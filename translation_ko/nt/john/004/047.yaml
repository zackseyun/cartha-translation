revisions:
- from: 이 사람이 예수께서 유대에서 갈릴리로 오셨다는 말을 듣고, 그에게 가서 내려와 자기 아들을 고쳐 달라고 간청했습니다. 그는 죽게 되어 있었기 때문입니다.
  to: 이 사람이 예수께서 유대에서 갈릴리로 오셨다는 말을 듣고, 예수께 가서 내려오셔서 자기 아들을 고쳐 달라고 요청했습니다. 그의 아들이 곧 죽을 참이었기 때문입니다.
  rationale: 원문의 사건 순서와 지형적 ‘내려오다’를 유지했습니다. ἠρώτα는 과장 없이 ‘요청했습니다’로 옮기고, 마지막 절은 아들을 명시하여 지시 대상의 모호성을 제거했으며, ‘곧 죽을 참’으로 죽음의 임박성을 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:53Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 원문을 충실히 옮겼으나, ἠρώτα를 ‘간청했습니다’로 번역하면 기본 의미인 ‘청하다/요청하다’보다 정서적 강도가 높아집니다. 또한 마지막 ‘그는’은 한국어에서 앞 절의 ‘이 사람’을 가리키는 것으로도 읽혀 아들이 죽을 지경이었다는 원문의 명확한 지시를 흐립니다. μέλλω의 임박성도 ‘죽게 되어 있었다’보다 더 직접적으로 드러낼 필요가 있습니다.
  naturalness: ‘예수께 가서’로 대상을 명시하고, ‘내려오셔서’로 예수께 대한 일관된 존대와 자연스러운 간접 청원문을 구성하는 것이 좋습니다. ‘그의 아들이 곧 죽을 참이었기 때문입니다’는 지시 대상과 긴급성을 자연스럽게 전달합니다.
  terminology: ‘이 사람’, ‘유대’, ‘갈릴리’, ‘내려오셔서’, ‘고쳐’는 적절합니다. ‘요청했습니다’는 ἐρωτάω에 안전하게 대응하며, 본문이 명시하지 않는 간청의 정서적 강도를 덧붙이지 않습니다.
  issues:
  - severity: medium
    issue: ‘간청했습니다’는 ἠρώτα의 의미를 다소 과장합니다.
    rationale: ἐρωτάω는 이 문맥에서 ‘청하다, 요청하다’가 기본이며, 절박한 상황 자체가 긴급성을 전달합니다. ‘간청하다’는 애원하는 태도를 추가할 수 있습니다.
  - severity: high
    issue: ‘그는 죽게 되어 있었기 때문입니다’의 대명사 지시가 모호하고 임박성도 약화됩니다.
    rationale: 그리스어 문맥상 죽을 사람이 아들임은 분명합니다. 한국어의 ‘그는’은 주절의 ‘이 사람’을 다시 가리킬 수 있습니다. 또한 ‘죽게 되어 있었다’는 예정·운명처럼 들릴 수 있어 μέλλω + 부정사의 ‘곧 죽으려 하다’라는 임박성을 충분히 나타내지 못합니다.
  - severity: low
    issue: ‘그에게 가서’보다 ‘예수께 가서’가 자연스럽고 명료합니다.
    rationale: 같은 문장 안에서 예수를 재지칭할 때 한국어에서는 대명사보다 이름 또는 높임 조사가 붙은 명사가 더 자연스럽고, 존대 흐름도 유지됩니다.
  revised_text: 이 사람이 예수께서 유대에서 갈릴리로 오셨다는 말을 듣고, 예수께 가서 내려오셔서 자기 아들을 고쳐 달라고 요청했습니다. 그의 아들이 곧 죽을 참이었기 때문입니다.
  revised_footnotes: []
  revision_rationale: 원문의 사건 순서와 지형적 ‘내려오다’를 유지했습니다. ἠρώτα는 과장 없이 ‘요청했습니다’로 옮기고, 마지막 절은 아들을 명시하여 지시 대상의 모호성을 제거했으며, ‘곧 죽을 참’으로 죽음의 임박성을 반영했습니다.
