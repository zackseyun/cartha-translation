id: JHN.4.47
reference: John 4:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
  footnotes:
  - marker: a
    text: Or 'was asking.' The Greek imperfect may indicate continued or repeated action; 'kept asking' brings out that nuance.
    reason: lexical_alternative
  - marker: b
    text: '''Come down'' reflects the change in elevation between locations in Galilee.'
    reason: cultural_note
translation:
  language: ko
  text: 이 사람이 예수께서 유대에서 갈릴리로 오셨다는 말을 듣고, 그에게 가서 내려와 자기 아들을 고쳐 달라고 간청했습니다. 그는 죽게 되어 있었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  english_pob_choice: this man
  chosen_korean: 이 사람
  alternatives_korean:
  - 그 사람
  - 이 남자
  lexicon: BDAG
  rationale: 앞선 문맥의 왕의 신하를 가리키는 지시어로서, 한국어에서는 담담하게 ‘이 사람’이 가장 자연스럽고 demonstrative의 지시성을 살립니다.
- source_word: ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  english_pob_choice: heard that Jesus had come from Judea into Galilee
  chosen_korean: 예수께서 유대에서 갈릴리로 오셨다는 말을 듣고
  alternatives_korean:
  - 예수께서 유대에서 갈릴리로 오셨다는 것을 듣고
  - 예수께서 유대에서 갈릴리로 들어오셨다는 말을 듣고
  lexicon: BDAG
  rationale: ἥκει는 ‘오다’의 도달 결과를 담는 표현이므로 ‘오셨다’가 자연스럽고, 전반을 간결하게 시간 부사절로 옮겼습니다.
- source_word: ἠρώτα
  english_pob_choice: asked / kept asking
  chosen_korean: 간청했습니다
  alternatives_korean:
  - 요청했습니다
  - 계속 물었습니다
  - 간구했습니다
  lexicon: BDAG
  rationale: 청원의 강도를 드러내는 동사로서, 문맥상 단순한 ‘묻다’보다 ‘간청하다’가 더 적절하며, 영어 POB의 반복성 논의는 본문상 필수는 아니므로 과도한 강조를 피했습니다.
- source_word: καταβῇ
  english_pob_choice: come down
  chosen_korean: 내려와
  alternatives_korean:
  - 내려오셔서
  - 가셔서
  lexicon: BDAG
  rationale: 지형적 하강을 반영하는 ‘내려와’가 직접적이며, 청원문의 흐름에서도 자연스럽습니다.
- source_word: ἰάσηται
  english_pob_choice: heal
  chosen_korean: 고쳐 달라고
  alternatives_korean:
  - 치유해 달라고
  - 낫게 해 달라고
  lexicon: BDAG
  rationale: 육체적 병고침 문맥에서 ‘고쳐 달라’가 현대 한국어에서 가장 자연스럽고, 치료 행위의 직접성을 잘 드러냅니다.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  english_pob_choice: for he was about to die
  chosen_korean: 그는 죽게 되어 있었기 때문입니다
  alternatives_korean:
  - 그는 곧 죽을 참이었기 때문입니다
  - 그는 죽기 직전이었기 때문입니다
  lexicon: BDAG
  rationale: μέλλω + 부정사는 임박성을 나타내므로 ‘죽게 되어 있었다’가 원문의 긴박함을 보존하면서도 한국어에서 지나치게 직역적이지 않습니다.
theological_decisions:
- issue: 청원의 태도와 예수에 대한 호칭을 과장하지 않기
  chosen_reading: 본문은 예수의 치유 권능을 믿고 찾아온 아버지의 절박한 요청을 담되, 본문이 말하지 않는 추가 정서나 신앙 고백을 덧붙이지 않았습니다.
  alternative_readings:
  - 애원했습니다
  - 빌었습니다
  rationale: ἐρωτάω의 기본 의미는 ‘묻다/청하다’의 범위에 있으므로, 문맥상 절박함은 살리되 후대적 경건어로 의미를 과장하지 않는 것이 source-direct합니다.
  doctrine_reference: 본문 문맥 해석
- issue: ‘내려와’의 지형적 표현 유지
  chosen_reading: 갈릴리 내부의 고도 차를 반영해 ‘내려와’를 유지했습니다.
  alternative_readings:
  - 와서
  - 오셔서
  rationale: 영어 POB의 주석과 같이, 이동 방향에는 실제 지형 감각이 들어 있으므로 이를 보존하는 것이 본문 의미에 충실합니다.
  doctrine_reference: 문화·지리적 관찰
