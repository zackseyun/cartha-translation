id: JHN.4.45
reference: John 4:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
  footnotes:
  - marker: a
    text: Or 'received him.' The Greek verb can denote receiving or welcoming; here the context suggests a favorable reception.
    reason: lexical_alternative
  - marker: b
    text: Or 'festival.' The Greek ἑορτή refers to a religious feast; John likely has the Jerusalem pilgrimage feast in view from the surrounding context.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 예수께서 갈릴리[a]에 오셨을 때, 갈릴리 사람들이 그분을 맞이하였는데, 이는 그들이 예루살렘에서 절기[b] 때 그분께서 행하신 모든 일을 보았기 때문입니다. 그들도 절기에 갔었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 받았다.’ Greek 동사는 ‘받다’와 ‘맞이하다’ 모두를 뜻할 수 있는데, 여기서는 문맥상 호의적 환영이 더 잘 드러납니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘축제.’ Greek ἑορτή는 종교적 절기를 뜻하며, 문맥상 예루살렘 순례 절기를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐδέξαντο αὐτόν
  english_pob_choice: welcomed him
  chosen_korean: 그분을 맞이하였는데
  alternatives_korean:
  - 그분을 받아들였는데
  - 그분을 영접하였는데
  lexicon: BDAG
  rationale: δέχομαι는 여기서 단순한 수령보다 호의적 반응을 뜻하므로, 문맥상 자연스러운 ‘맞이하다’가 POB의 ‘welcomed him’을 가장 잘 반영합니다.
- source_word: ὅσα ἐποίησεν
  english_pob_choice: all that he had done
  chosen_korean: 그분께서 행하신 모든 일
  alternatives_korean:
  - 그분이 하신 모든 일
  - 그분께서 하신 모든 일
  lexicon: BDAG
  rationale: 완료분사와 과거 행위의 누적을 살려 ‘행하신 모든 일’로 옮겼고, 갈릴리 사람들이 이미 본 행위 전체를 가리키게 했습니다.
- source_word: ἐν τῇ ἑορτῇ
  english_pob_choice: at the feast
  chosen_korean: 절기 때
  alternatives_korean:
  - 그 절기 때
  - 축제 때
  lexicon: BDAG
  rationale: ἑορτή는 단순한 축제보다 종교적 절기를 가리키므로, 요한복음 문맥에 맞게 ‘절기’로 옮겼습니다.
- source_word: καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν
  english_pob_choice: for they too had gone to the feast
  chosen_korean: 그들도 절기에 갔었기 때문입니다
  alternatives_korean:
  - 그들도 절기에 갔기 때문입니다
  - 그들 역시 그 절기에 갔었기 때문입니다
  lexicon: BDAG
  rationale: γάρ의 설명 기능과 αὐτοὶ의 강조를 살려 ‘그들도’로 압축했고, 앞선 시점보다 이전의 참석을 한국어 과거완료에 가까운 ‘갔었기’로 나타냈습니다.
theological_decisions:
- issue: 갈릴리 사람들이 예수를 맞이한 태도
  chosen_reading: 호의적 환영으로 읽었습니다.
  alternative_readings:
  - 중립적 수용
  - 단순한 접대
  rationale: δέχομαι의 문맥상 의미와 POB의 영어 선택이 함께 긍정적 반응을 가리키므로, 무표정한 ‘받아들이다’보다 관계적 환대를 드러내는 번역을 택했습니다.
  doctrine_reference: 내러티브 문맥과 어휘 의미
- issue: 절기(ἑορτή)의 성격
  chosen_reading: 예루살렘 순례가 수반되는 종교 절기로 보았습니다.
  alternative_readings:
  - 일반적인 축제
  - 막연한 행사
  rationale: 요한복음의 주변 문맥상 예루살렘으로 올라간 절기를 가리키므로, 문화적·종교적 배경을 보존하는 ‘절기’를 유지했습니다.
  doctrine_reference: 요한복음의 절기 문맥
