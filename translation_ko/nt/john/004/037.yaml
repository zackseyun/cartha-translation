lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  english_pob_choice: For in this
  chosen_korean: 이는 곧
  alternatives_korean:
  - 이 일에서
  - 이것에서
  - 이 점에서
  lexicon: BDAG
  rationale: 앞 문맥의 현재 상황을 가리키는 지시를 자연스럽게 살리면서, ἐν τούτῳ의 참조를 한국어로 간결하게 전달합니다.
- source_word: ὁ λόγος
  english_pob_choice: the saying
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 진술
  - 속담
  lexicon: BDAG
  rationale: 여기서 λόγος는 신학적 ‘말씀’ 칭호보다 앞선 진술을 가리키므로, 문맥상 자연한 ‘말씀’으로 옮기되, 주어진 문장이 참됨을 말하는 구조를 살렸습니다.
- source_word: ἄλλος ... καὶ ἄλλος
  english_pob_choice: one ... and another
  chosen_korean: 한 사람은 ... 다른 한 사람은
  alternatives_korean:
  - 하나는 ... 또 하나는
  - 한 이는 ... 다른 이는
  lexicon: BDAG
  rationale: 두 주체의 대비를 분명히 하면서, 한국어에서 자연스럽고 평행적인 대구를 유지합니다.
- source_word: ὁ σπείρων / ὁ θερίζων
  english_pob_choice: the one sowing / the one reaping
  chosen_korean: 뿌리는 사람 / 거두는 사람
  alternatives_korean:
  - 뿌리는 이 / 거두는 이
  - 뿌리는 자 / 거두는 자
  lexicon: BDAG
  rationale: 분사적 표현의 의미를 살리되, 비유적 격언체에 더 자연한 ‘사람’으로 옮겨 한국어 가독성을 높였습니다.
theological_decisions:
- issue: 격언의 적용 대상을 번역문에서 특정할지 여부
  chosen_reading: 번역문에서는 일반적인 참된 말씀으로 두고, 뿌리는 이와 거두는 이의 구체적 대응은 문맥에 맡깁니다.
  alternative_readings:
  - 뿌리는 이를 예언자/세례자 요한/예수로, 거두는 이를 제자들로 특정하기
  - 번역 안에 해석을 삽입해 상징적 대응을 드러내기
  rationale: 헬라어 본문 자체는 여기서 두 인물을 특정하지 않으므로, 번역이 해석을 앞서지 않도록 했습니다.
  doctrine_reference: 본문의 해석적 긴장을 보존함
