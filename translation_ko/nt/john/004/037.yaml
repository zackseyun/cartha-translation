translation:
  language: ko
  text: 이는 곧 이 말씀[a]이 참되다는 것입니다. 한 사람은 뿌리는 사람이고, 다른 한 사람은 거두는 사람입니다.
  philosophy: optimal-equivalence
  footnotes:
