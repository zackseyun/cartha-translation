translation:
  language: ko
  text: 오십시오[a], 제가 한 모든 일을 말씀해 주신 그 사람을 보십시오. 이분이 메시아일까요?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「이분이 그리스도일까요?」
    reason: alternative_reading
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  english_pob_choice: Come, see
  chosen_korean: 오십시오, 보십시오
  alternatives_korean:
  - 와 보십시오
  - 오세요, 보세요
  lexicon: BDAG
  rationale: 둘 다 복수 청중을 향한 즉각적 초청이므로, 현대 합쇼체에서 자연스럽고 간결한 「오십시오, 보십시오」로 옮겨 초청의 힘을 살렸습니다.
- source_word: ἄνθρωπον
  english_pob_choice: a man
  chosen_korean: 그 사람
  alternatives_korean:
  - 한 남자
  - 한 사람
  lexicon: BDAG
  rationale: 여기서는 예수님을 가리키는 지시적 표현이 핵심이므로, 한국어에서는 성별을 과도하게 부각하기보다 문맥상 지시성을 살린 「그 사람」이 자연스럽습니다.
- source_word: ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα
  english_pob_choice: who told me everything I have done
  chosen_korean: 제가 한 모든 일을 말씀해 주신
  alternatives_korean:
  - 제가 한 모든 것을 말해 주신
  - 내가 한 모든 일을 알려 주신
  lexicon: BDAG
  rationale: εἶπέ μοι는 상황상 「말씀해 주신/알려 주신」으로 옮길 수 있지만, 증언체의 흐름을 살리기 위해 「말씀해 주신」을 택하고, πάντα ὅσα ἐποίησα는 「제가 한 모든 일」로 충분히 포괄했습니다.
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: BDAG
  rationale: POB의 기본 방침에 따라 Χριστός의 칭호 용법은 한국어에서 「메시아」로 번역해 유대적 메시아 기대를 드러냈습니다.
theological_decisions:
- issue: μήτι가 만드는 반문/추정의 뉘앙스
  chosen_reading: 「이분이 메시아일까요?」
  alternative_readings:
  - 「이분이 메시아가 아닐까요?」
  - 「이분이 메시아일 리가 있을까요?」
  rationale: μήτι는 단정이 아니라 조심스러운 제안을 담으므로, 한국어에서는 부드러운 추정형 질문으로 옮겨 청중을 초대하는 말투를 살렸습니다.
  doctrine_reference: Greek discourse force of μήτι; POB optimal-equivalence policy
