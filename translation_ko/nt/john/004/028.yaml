    rationale: 한국어에서는 생략 가능하지만, 간결하게 ‘자기 물동이’로 반영할 수 있으며 의미를 더 정확히 보존합니다.
  revised_text: 그 여자는 자기 물동이를 두고 마을로 가서 사람들에게 말합니다.
