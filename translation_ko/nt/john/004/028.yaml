  naturalness: ‘그 여자는 자기 물동이를 두고 마을로 가서 사람들에게 말합니다’는 현대 표준어 합쇼체로 자연스럽고, 앞선 과거 서술과 서술 현재의 전환도 원문의 표현 효과를 보존합니다.
  terminology: ὑδρία에 ‘물동이’를 쓰는 것은 적절합니다. 다만 ‘버려 두고’는 중립적인 ἀφῆκεν보다 강하므로 ‘두고’로 고쳐야 합니다.
