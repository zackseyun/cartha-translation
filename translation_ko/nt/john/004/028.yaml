  text: ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: ko
  text: 그 여자는 자기 물동이를 두고 마을로 가서 사람들에게 말합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν ... τὴν ὑδρίαν
  english_pob_choice: left her water jar
  chosen_korean: 물동이를 버려 두고
  alternatives_korean:
  - 물동이를 두고
  - 물항아리를 버려 두고
  - 우물통을 두고
  lexicon: ὑδρία
  rationale: ὑδρία는 일상적인 물 길어 나르는 용기이므로 한국어에서는 자연스러운 ‘물동이’가 적절하며, 동작의 급박함을 살려 ‘버려 두고’로 옮겼습니다.
- source_word: εἰς τὴν πόλιν
  english_pob_choice: went into the town
  chosen_korean: 마을로 가서
  alternatives_korean:
  - 읍내로 가서
  - 도시로 가서
  - 성 안으로 가서
  lexicon: πόλις
  rationale: 문맥상 사마리아의 지역 공동체를 가리키므로, 과도하게 도시화된 느낌을 피하고 ‘마을’로 옮겼습니다.
- source_word: λέγει
  english_pob_choice: says
  chosen_korean: 말합니다
  alternatives_korean:
  - 말합니다
  - 말해요
  - 말했습니다
  lexicon: λέγω
  rationale: 현재형 직설화법을 반영해 과거형으로 평탄화하지 않고, 내러티브의 생동감을 살려 ‘말합니다’로 옮겼습니다.
theological_decisions:
- issue: 서술 시제의 현재형 사용
  chosen_reading: λέγει를 한국어 현재형 ‘말합니다’로 유지했습니다.
  alternative_readings:
  - ‘말했습니다’로 과거 서술화
  - ‘말하더라’로 구어적 처리
  rationale: 요한복음의 현재형 서술 효과를 보존해 장면 전개를 즉각적으로 느끼게 하려는 본문 효과를 따랐습니다.
