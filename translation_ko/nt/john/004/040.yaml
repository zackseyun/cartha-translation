- from: 그 사마리아 사람들[a]이 그에게 오자, 그들은 자기들과 함께 머물러 달라고 그에게 요청했고, 그는 거기서 이틀을 머물렀습니다.
  to: 그래서 사마리아 사람들이 그에게 왔을 때, 그들은 그들과 함께 머물러 달라고 계속 요청했고[a], 그는 그곳에 이틀 동안 머물렀습니다.
  rationale: ὡς οὖν을 ‘그래서 … 왔을 때’로 옮겨 시간 관계와 문맥적 연결을 함께 살렸습니다. ἠρώτων의 미완료상은 ‘계속 요청했고’로 반영하고, 이에 관한 각주를 해당 동사구에 정확히 연결했습니다. 나머지 요소는 원문의 장소·동반·기간 표현을 자연스럽게 유지합니다.
