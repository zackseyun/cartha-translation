  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
  footnotes:
  - marker: a
    text: Or 'they asked him to stay with them.' The Greek imperfect ('were asking') may suggest repeated or continued request.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사마리아 사람들[a]이 그에게 오자, 그들은 자기들과 함께 머물러 달라고 그에게 요청했고, 그는 거기서 이틀을 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사마리아 사람들은 그에게 머물러 달라고 요청했다.” 그리스어 미완료시제는 반복적이거나 계속된 요청을 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  english_pob_choice: So when
  chosen_korean: 그때
  alternatives_korean:
  - 그러므로 그때
  - 그래서 그때
  - 그리하여
  lexicon: BDAG
  rationale: ὡς οὖν의 시간적·순차적 연결을 자연스러운 한국어로 옮기되, 의미를 과도하게 해석하지 않도록 간결하게 처리했습니다.
- source_word: οἱ Σαμαρῖται
  english_pob_choice: the Samaritans
  chosen_korean: 그 사마리아 사람들
  alternatives_korean:
  - 사마리아인들
  - 사마리아 사람들
  lexicon: BDAG
  rationale: 민족/집단 명칭을 직역하되, 문맥상 특정 집단을 가리키는 관사를 반영해 ‘그’를 붙였습니다.
- source_word: ἠρώτων
  english_pob_choice: were asking
  chosen_korean: 요청했고
  alternatives_korean:
  - 계속 요청했고
  - 거듭 요청했고
  - 부탁했고
  lexicon: BDAG
  rationale: 미완료 시상의 지속성은 한국어에서 꼭 진행형으로만 드러내지 않아도 되므로, 본문 흐름에 맞는 정중한 동사로 옮겼습니다.
- source_word: μεῖναι παρ’ αὐτοῖς
  english_pob_choice: to stay with them
  chosen_korean: 자기들과 함께 머물러 달라고
  alternatives_korean:
  - 그들과 함께 남아 달라고
  - 그들 곁에 머물러 달라고
  - 그들과 함께 있어 달라고
  lexicon: BDAG
  rationale: μένω와 παρά의 결합이 ‘함께/곁에 머묾’의 뜻이므로, 한국어에서는 관계적 뉘앙스가 살아나도록 ‘함께 머물러 달라’로 옮겼습니다.
- source_word: καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας
  english_pob_choice: and he stayed there two days
  chosen_korean: 그는 거기서 이틀을 머물렀습니다
  alternatives_korean:
  - 그리고 그는 거기서 이틀 동안 머물렀습니다
  - 그는 거기서 이틀간 머물렀습니다
  lexicon: BDAG
  rationale: 앞의 ‘머물러 달라’와 어휘를 맞추되, 장소와 기간을 자연스럽게 드러내기 위해 ‘거기서 이틀을 머물렀습니다’로 옮겼습니다.
