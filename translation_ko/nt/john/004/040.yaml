review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 본문의 ‘그 사마리아 사람들이 그에게 오자’는 시간 관계는 전달하지만, ὡς οὖν의 연결·추론적 힘이 충분히 드러나지 않습니다. 또한 ἠρώτων은 미완료시제로서 계속되거나 거듭된 요청의 뉘앙스를 안전하게 반영할 수 있습니다.
  naturalness: ‘그래서 사마리아 사람들이 그에게 왔을 때’와 ‘그들과 함께 머물러 달라고 계속 요청했고’는 현대 표준 한국어의 자연스러운 서술이며, 합쇼체 종결을 유지합니다. ‘자기들과 함께’보다 ‘그들과 함께’가 이 문맥에서 더 매끄럽습니다.
  terminology: ‘사마리아 사람들’, ‘머물다’, ‘이틀 동안’은 집단 명칭과 μένω의 반복, 기간 대격을 적절히 반영합니다. 신학적으로 해석을 덧붙이지 않았습니다.
  issues:
