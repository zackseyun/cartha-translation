  - severity: low
    issue: 미완료시제 관련 각주 표지가 ‘사마리아 사람들’에 붙어 있음
    rationale: 각주의 내용은 집단 명칭이 아니라 ἠρώτων(요청했다)의 미완료상에 관한 것이므로 요청 동사구에 표지를 두는 것이 정확합니다.
  - severity: low
    issue: ‘요청했고’가 미완료상의 지속·반복 가능성을 본문에서 드러내지 않음
    rationale: 문맥상 ‘계속 요청했고’는 과도한 해석 없이 그리스어 미완료시제의 가능한 지속성을 자연스럽게 보존합니다.
