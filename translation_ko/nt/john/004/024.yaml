id: JHN.4.24
reference: John 4:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
  footnotes:
  - marker: a
    text: Or, 'in the Spirit and truth.' The Greek can be understood more specifically, but the wording here preserves the broader sense of the phrase.
    reason: alternative_reading
  - marker: b
    text: '''God is spirit'' expresses God''s nature; it does not mean merely that God is one spirit-being among others.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님은 영이십니다. 그러므로 그분을 경배하는 사람들은 영과 진리로 경배해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 성령
  - 정신
  lexicon: BDAG
  rationale: 문맥상 정체성 서술인 '하나님은 영이십니다'를 자연스럽게 살리기 위해 '영'을 택했습니다. 여기서는 성령을 가리키는 문맥이 아니므로 '성령'보다 일반적·질적 의미가 더 적절합니다.
- source_word: ὁ θεός
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: BDAG
  rationale: θεός의 표준 번역으로 '하나님'을 사용했습니다. 한국어 교회어에서 가장 널리 이해되며, 본문이 말하는 주어를 분명하게 드러냅니다.
- source_word: προσκυνοῦντας / προσκυνεῖν
  english_pob_choice: those who worship / worship
  chosen_korean: 경배하는 사람들 / 경배해야 합니다
  alternatives_korean:
  - 예배하는 사람들 / 예배해야 합니다
  - 절하는 사람들 / 절해야 합니다
  lexicon: BDAG
  rationale: προσκυνέω의 핵심 의미는 경배이므로, 예배보다 더 직접적으로 원어의 숭배 행위를 반영하는 '경배'를 선택했습니다. 몸짓의 역사적 뉘앙스보다 여기의 종교적 행위가 중심입니다.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  english_pob_choice: in spirit and truth
  chosen_korean: 영과 진리로
  alternatives_korean:
  - 영 안에서와 진리 안에서
  - 성령과 진리로
  - 마음과 진리로
  lexicon: BDAG
  rationale: 전치사구를 한국어에서 가장 자연스럽게 옮기되, POB의 해석적 폭을 보존하기 위해 '성령'으로 한정하지 않고 '영과 진리로'라고 했습니다. 이는 경배의 방식이 영적 실재와 진리에 의해 규정된다는 넓은 뜻을 남깁니다.
theological_decisions:
- issue: '''하나님은 영이십니다''의 의미'
  chosen_reading: 하나님을 다른 영적 존재들 가운데 하나로 분류하지 않고, 하나님의 본성을 질적으로 진술하는 표현으로 읽었습니다.
  alternative_readings:
  - 하나님은 한 영이십니다
  - 하나님은 성령이십니다
  rationale: 원문의 관사 없는 πνεῦμα는 질적 서술을 강하게 시사하므로, 한국어도 존재론적 분류보다 본성 진술이 되도록 옮겼습니다.
  doctrine_reference: 니케아 신경의 하나님 이해; 번역 원칙 §1 원어 우선과 §3 본문의 긴장 보존
