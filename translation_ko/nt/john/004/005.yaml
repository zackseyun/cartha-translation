id: JHN.4.5
reference: John 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
  footnotes:
  - marker: a
    text: Or “city of Samaria.” The Greek word πόλις can refer to either a city or a town, depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or “field.” The Greek χωρίον can denote a field, property, or piece of land.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 사마리아에 있는 쉬카르라 불리는 한 동네[a]에 이르렀습니다. 그곳은 야곱이 그의 아들 요셉에게 주었던 땅 가까이에 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “도시.” 그리스어 πόλις는 문맥에 따라 도시나 읍(또는 마을)을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “밭/토지.” 그리스어 χωρίον은 들판, 소유지, 또는 한 필지의 땅을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  english_pob_choice: he came
  chosen_korean: 예수께서 ... 이르렀습니다
  alternatives_korean:
  - 그가 이르렀습니다
  - 이르러 오십니다
  lexicon: BDAG
  rationale: 그릭 현재형의 서사적 현재(historical present)를 한국어에서 자연스럽게 전달하기 위해 과거형 '이르렀습니다'를 사용했습니다. 대상(주어)이 바로 앞 문맥에서 예수임이 명확하므로 '예수께서'를 명시하여 독자의 이해를 돕습니다.
- source_word: πόλιν
  english_pob_choice: town
  chosen_korean: 동네
  alternatives_korean:
  - 도시
  - 읍
  lexicon: BDAG
  rationale: πόλις는 도시 또는 읍(또는 큰/작은 정착지)을 가리킬 수 있습니다. 원문의 지나치게 큰 규모를 가정하지 않기 위해 '동네'를 선택하여 원문의 스케일을 과장하지 않았습니다.
- source_word: λεγομένην Συχὰρ
  english_pob_choice: called Sychar
  chosen_korean: 쉬카르라 불리는
  alternatives_korean:
  - 시카르라 불리는
  - 시하르라 불리는
  lexicon: BDAG / LXX onomastics
  rationale: 지명 Συχὰρ의 음운을 한국어로 옮겨 '쉬카르'를 택했습니다(발음과 가독성 고려). 고유명사이므로 번역이 아니라 음역으로 표기했고, '…라 불리는' 구조로 원문의 λεγομένην을 전달했습니다.
- source_word: χωρίου ὃ ἔδωκεν Ἰακὼβ τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  english_pob_choice: the piece of land that Jacob had given to Joseph his son
  chosen_korean: 야곱이 그의 아들 요셉에게 주었던 땅
  alternatives_korean:
  - 야곱이 그의 아들 요셉에게 준 밭
  - 야곱이 요셉에게 준 소유지
  lexicon: BDAG
  rationale: χωρίον은 단순히 '밭'으로 제한되지 않고 토지 소유지의 의미도 있으므로 '땅'으로 넓게 번역했습니다. 영어 원문이 과거완료를 사용하였기에 한국어에서는 '주었던'으로 배경사실임을 표지했습니다. 'τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ'의 소유·관계는 '그의 아들 요셉에게'로 자연스럽게 표현했습니다.
theological_decisions:
- issue: Unnamed/historical subject in Greek (ἔρχεται) — whether to supply the name
  chosen_reading: 예수께서(주어 명시)
  alternative_readings:
  - 그가(대명사로 처리)
  - 문맥에 의존해 주어를 생략
  rationale: 원문의 문맥상 행위자는 예수였으나 그리스어는 대명사를 생략하는 관습을 따른다. 한국어 독자에게 사건의 흐름을 분명히 전달하기 위해 주어를 명시적으로 표기했습니다. 이는 본문 의미를 바꾸지 않으며 이해를 돕습니다.
  doctrine_reference: narrative clarity / POB editorial practice
