  to: 예수께서는 사마리아의 수가라고 하는 한 동네[a]에 이르셨습니다. 그곳은 야곱이 자기 아들 요셉에게 준 땅[b] 가까이에 있었습니다.
  rationale: 통용 성서 지명 표기를 ‘수가’로 바로잡고, χωρίον 관련 각주를 ‘땅’에 연결했습니다. 두 문장으로 수식 관계를 풀어낸 방식은 원문의 ‘그 땅 가까이에 있는 동네’라는 의미를 자연스러운 한국어로 보존하므로 유지했습니다. ‘자기 아들 요셉’은 야곱을 가리키는 원문의 소유 관계를 분명히 합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:52Z'
