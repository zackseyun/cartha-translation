revisions:
- from: 그리고 그 여인[a]에게 그들은 말하고 있었습니다. 「우리는 더 이상 당신의 말[b] 때문에 믿지 않습니다. 우리가 직접 들었고, 또 우리가 아는 것은 이분이 참으로 세상의 구원자이시기 때문입니다.」
  to: 그들은 그 여인[a]에게 이렇게 말했습니다. “우리는 더 이상 당신의 말[b] 때문에 믿는 것이 아닙니다. 우리가 직접 들었고, 이분이 참으로 세상의 구원자이심을 압니다.”
  rationale: 원문의 핵심 구조인 ‘더 이상 당신의 말 때문에 믿는 것이 아니다—우리가 직접 들었고, 이분이 참으로 세상의 구원자이심을 안다’를 한국어의 자연스러운 병렬 구조로 회복했습니다. ‘세상의 구원자’의 범위에는 해석적 한정을 더하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:55Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 주요 어휘를 대체로 충실히 옮겼지만, 마지막 절의 인과관계가 원문과 달라졌습니다. γὰρ는 ‘우리가 직접 들었고, 또 안다’라는 두 동사의 근거를 제시하며, ‘이분이 … 구원자이시기 때문입니다’가 아니라 ‘이분이 … 구원자이심을 압니다’가 되어야 합니다.
  naturalness: ‘그리고 그 여인에게 그들은 말하고 있었습니다’는 한국어 어순상 부자연스럽고, 직접 인용을 도입하는 서술로도 어색합니다. ‘그들은 그 여인에게 이렇게 말했습니다’가 현대 합쇼체 문맥에서 자연스럽습니다.
  terminology: ‘그 여인’, ‘당신의 말’, ‘이분’, ‘세상의 구원자’는 원문의 지시성·존칭 및 핵심 용어를 무리 없이 보존합니다. ‘말씀’처럼 과도하게 종교적 존칭을 부여하지 않은 점도 적절합니다.
  issues:
  - severity: high
    issue: 마지막 문장의 인과관계와 문장 구조가 원문과 다릅니다.
    rationale: 원문은 αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι...로서 ‘우리 자신이 들었고, 이분이 …이심을 안다’는 뜻입니다. 초안의 ‘…구원자이시기 때문입니다’는 ‘구원자이심’이 믿음의 이유인 것처럼 종속시켜, οἴδαμεν ὅτι의 내용을 누락합니다.
  - severity: medium
    issue: 도입 문장의 어순과 미완료과거 처리 방식이 부자연스럽습니다.
    rationale: ‘그 여인에게 그들은 말하고 있었습니다’는 한국어에서 어색합니다. 그리스어 미완료과거는 여기서 직접 인용을 도입하는 관습적 서술로 자연스럽게 ‘말했습니다’로 옮길 수 있으며, 반복성을 과도하게 부각할 필요는 없습니다.
