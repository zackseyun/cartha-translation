id: JHN.4.42
reference: John 4:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
  footnotes:
  - marker: a
    text: Or, more formally, 'because of your speech.' The Greek refers to the woman's spoken testimony.
    reason: lexical_alternative
  - marker: b
    text: Some translations render 'this man' or simply 'he' for 'this one.' The Greek demonstrative is more emphatic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 여인[a]에게 이렇게 말했습니다. “우리는 더 이상 당신의 말[b] 때문에 믿는 것이 아닙니다. 우리가 직접 들었고, 이분이 참으로 세상의 구원자이심을 압니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 여자’이지만, 여기서는 대화 상대를 가리키는 자연스러운 표현으로 ‘그 여인’을 썼습니다.
    reason: cultural_note
  - marker: b
    text: λαλιὰν은 단순한 ‘말씀’보다 실제로 한 말, 곧 발화의 내용에 더 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε γυναικὶ
  english_pob_choice: to the woman
  chosen_korean: 그 여인에게
  alternatives_korean:
  - 그 여자에게
  - 그 여인에게도
  lexicon: BDAG
  rationale: 여격의 수신자를 자연스러운 현대 한국어로 옮기되, τε의 약한 연결감은 문맥상 별도 표시 없이 유지할 수 있습니다.
- source_word: ἔλεγον
  english_pob_choice: they were saying
  chosen_korean: 말하고 있었습니다
  alternatives_korean:
  - 말했습니다
  - 말하곤 했습니다
  lexicon: BDAG
  rationale: 과거 미완료의 반복·진행성을 살려 단순 과거보다 진행형에 가깝게 옮겼습니다.
- source_word: διὰ τὴν σὴν λαλιὰν
  english_pob_choice: because of your word
  chosen_korean: 당신의 말[b] 때문에
  alternatives_korean:
  - 당신의 말 때문에
  - 당신의 말하심 때문에
  - 당신의 말씀 때문에
  lexicon: BDAG
  rationale: διά + 대격의 원인/근거를 ‘때문에’로 옮겼고, λαλιὰν은 공식적 ‘말씀’보다 실제 발화의 내용인 ‘말’이 더 정확합니다.
- source_word: οὗτός ἐστιν
  english_pob_choice: this one ... is
  chosen_korean: 이분이
  alternatives_korean:
  - 이분은
  - 이 사람은
  - 그분은
  lexicon: BDAG
  rationale: 지시대명사의 강조를 살리면서도 한국어 신앙문맥에서 예수께 대한 존칭을 반영해 ‘이분’으로 옮겼습니다.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  english_pob_choice: the Savior of the world
  chosen_korean: 세상의 구원자
  alternatives_korean:
  - 온 세상의 구원자
  - 세상의 구주
  - 온 세상의 구주
  lexicon: BDAG
  rationale: σωτήρ는 ‘구원자’가 직접적이고, κόσμος는 보편적 인간 세계를 가리켜 ‘세상’으로 충분히 옮길 수 있습니다.
theological_decisions:
- issue: 사마리아 사람들의 고백 범위
  chosen_reading: ‘세상의 구원자’로 직역해, 고백의 보편성을 좁히지 않고 그대로 드러냈습니다.
  alternative_readings:
  - ‘모든 사람의 구원자’
  - ‘사마리아인들의 구원자’
  rationale: 본문은 예수의 구원 사역을 넓게 고백하므로, 후대 교리적 한정 없이 본문 자체의 범위를 유지했습니다.
  doctrine_reference: Theological tension preserved; no doctrinal narrowing.
