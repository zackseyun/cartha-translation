id: JHN.4.19
reference: John 4:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
  footnotes:
  - marker: a
    text: Or “Sir.” The Greek κύριε can be a respectful form of address as well as “Lord.”
    reason: alternative_reading
translation:
  language: ko
  text: 여자가 그에게 말했습니다. 「주님[a], 제가 보니 주님은 예언자이십니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님.” 그리스어 κύριε는 “주님” 외에도 공손한 호칭으로 사용될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말한다
  - 말하였다
  lexicon: BDAG
  rationale: 그리스어의 역사적 현재를 한국어 현대 서술에서는 통상 과거로 풀이하여 담백한 서사 흐름을 유지합니다. 따라서 '말했습니다'로 자연스럽게 처리했습니다.
- source_word: γυνή
  english_pob_choice: the woman
  chosen_korean: 여자
  alternatives_korean:
  - 여인
  - 그 여자
  lexicon: BDAG
  rationale: 요한복음 맥락에서 사마리아 여인을 가리키는 동일 지시어입니다. 한국어 현대정중체에는 '여자' 또는 '그 여자'가 자연스럽습니다; 본문 흐름상 간결한 '여자'를 선택했습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 선생님
  lexicon: BDAG; POB contested-terms
  rationale: 프로젝트 기본 방침에 따라 κύριος의 호격은 '주님'으로 번역합니다. 다만 문맥상 정중한 호칭으로도 쓰일 수 있으므로 대안 '선생님'을 각주로 보존했습니다.
- source_word: θεωρῶ / σύ
  english_pob_choice: I see / you
  chosen_korean: 제가 보기에 / 당신
  alternatives_korean:
  - 제가 보니 / 너는
  - 제가 보건대 / 그대
  lexicon: BDAG
  rationale: θεωρέω의 지각적 의미를 '제가 보기에'로, 강조하는 인칭 대명사 σύ는 한국어에서 '당신'으로 표지하여 그리스어의 강조(명시적 주어)를 반영했습니다. '당신'은 대화 상대의 지시성을 유지하면서 존칭과 과격한 친밀성 모두 피합니다.
- source_word: προφήτης
  english_pob_choice: a prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  lexicon: BDAG
  rationale: 무관사(무관사적 서술격)로서 불특정성을 유지하여 '예언자'로 처리했습니다. 한국어에서 관사 표지는 없으므로 문맥상 불특정성을 유지하도록 번역했습니다.
theological_decisions:
- issue: Rendering of κύριος as a form of address to Jesus
  chosen_reading: 주님
  alternative_readings:
  - 선생님 (or 'Sir')
  rationale: 직접 호칭으로서 문맥이 반드시 예수의 신격 고백을 의미하지 않을 수 있으나, POB의 방침(Contested terms)상 κύριος는 기본적으로 'Lord/주님'으로 처리합니다. 혼동을 피하고 원문이 가진 해석적 긴장을 보존하기 위해 대안은 각주로 제시합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord; preserve alternatives in footnotes where ambiguity is contextually relevant.'
- issue: Honorifics and pronoun emphasis for σύ
  chosen_reading: explicit emphatic pronoun reflected by '당신' and honorific predicate
  alternative_readings:
  - omit pronoun (한국어에서 흔함)
  - use more archaic '그대' 또는 '너' (비공식)
  rationale: 원문의 σύ는 강조적 대명사이므로 한국어에서도 명시적으로 표기해 원문의 화법적 강조를 전달하려 했습니다. 또한 예수께 대한 경의를 표현하여 술어에 높임말('예언자이십니다')을 사용했습니다.
  doctrine_reference: 'POB style: preserve morpho-syntactic emphases that affect meaning/audience reception.'
