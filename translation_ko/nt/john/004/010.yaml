id: JHN.4.10
reference: John 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
  footnotes:
  - marker: a
    text: Or 'running water' or 'fresh water'; the phrase can refer to flowing water, but 'living water' preserves the double meaning Jesus intends here.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하여 그녀에게 말씀하셨습니다. “만일 당신이 하나님의 선물과 당신에게 ‘나에게 마실 것을 주시오’라고 말하는 이가 누구인지 알았다면, 당신은 그에게 청하였을 것이고 그가 당신에게 생수[a]를 주었을 것입니다.”
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘흐르는 물’이나 ‘맑은 물’로 번역될 수 있습니다. 일상어로는 흐르는(샘)물을 가리킬 수 있으나, 여기서는 예수의 의도한 문자적·영적 중첩을 보존하기 위해 ‘생수’로 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 … 말씀하셨습니다
  alternatives_korean:
  - 대답하고 말했다
  - 대답하셨고 이르셨다
  lexicon: BDAG
  rationale: 그리스어 이중 표현(ἀπεκρίθη καὶ εἶπεν)을 한국어에서 하나의 자연스러운 문장으로 옮기기 위해 '대답하여 … 말씀하셨습니다'로 처리하여 원문의 반응·발화 연속을 보존했습니다.
- source_word: δωρεὰν τοῦ θεοῦ
  english_pob_choice: the gift of God
  chosen_korean: 하나님의 선물
  alternatives_korean:
  - 하나님께로부터의 선물
  - 하나님의 은사
  lexicon: BDAG
  rationale: δωρεὰν은 '자유롭게 주어진 선물'의 의미를 담으나 한국어에서 과도한 수식은 피해 '선물'로, 소유격 τοῦ θεοῦ는 '하나님의'로 직역했습니다.
- source_word: Δός μοι πεῖν
  english_pob_choice: Give me a drink
  chosen_korean: 나에게 마실 것을 주시오
  alternatives_korean:
  - 나에게 마실 것을 달라
  - 나에게 한 잔 주시오
  lexicon: BDAG
  rationale: 그리스어 명령형 원문을 직접적으로 전달하기 위해 정중한 명령형 문체로 옮겼습니다. 영어의 간결함('Give me a drink')을 한국어 문법과 예수의 발화 상황에 맞게 표현했습니다.
- source_word: ὕδωρ ζῶν
  english_pob_choice: living water
  chosen_korean: 생수
  alternatives_korean:
  - 흐르는 물
  - 살아 있는 물
  - 맑은 물
  lexicon: BDAG
  rationale: 요한복음에서의 ὕδωρ ζῶν은 문자적(흐르는 물)·상징적(영적 은혜)을 동시에 함의하므로, 한국어로는 간결하게 '생수'로 옮겨 신학적 긴장을 보존했습니다. 대체 해석은 각주로 표기했습니다.
theological_decisions:
- issue: Rendering ὕδωρ ζῶν with both literal and symbolic force
  chosen_reading: 생수
  alternative_readings:
  - 흐르는 물
  - 맑은 물
  - 살아 있는 물
  rationale: 본문은 청자에게 물리적 오해를 유도하면서 영적 의미를 드러내는 말장난을 포함합니다. '생수'는 한 단어로 그중첩된 의미를 유지하여 독자가 문자·비유 양쪽을 모두 생각하게 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
