lexical_decisions:
- source_word: πολλῷ πλείους
  english_pob_choice: many more
  chosen_korean: 훨씬 더 많은 사람들이
  alternatives_korean:
  - 많은 사람들이 더
  - 훨씬 많은 사람들이
  - 더 많은 사람들이 매우
  lexicon: BDAG
  rationale: dative πολλῷ가 비교급 πλείους를 강하게 강조하므로, 한국어에서는 ‘훨씬 더 많은’으로 자연스럽게 확대의 뉘앙스를 살렸습니다.
- source_word: ἐπίστευσαν
  english_pob_choice: believed
  chosen_korean: 믿게 되었습니다
  alternatives_korean:
  - 믿었습니다
  - 믿음을 두었습니다
  - 믿기 시작했습니다
  lexicon: BDAG
  rationale: aorist πιστεύω의 단순한 사실 진술을 살리면서도 문맥상 결과를 자연스럽게 드러내기 위해 ‘믿게 되었습니다’로 옮겼습니다.
- source_word: λόγον
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 가르침
  lexicon: BDAG
  rationale: 요한복음에서 λόγος는 단순한 정보보다 예수의 권위 있는 발화를 가리키므로, 본문 문맥에 맞는 ‘말씀’이 가장 자연스럽습니다.
- source_word: διὰ τὸν λόγον αὐτοῦ
  english_pob_choice: because of his word
  chosen_korean: 그분의 말씀[a] 때문에
  alternatives_korean:
  - 그분의 말 때문에
  - 그분의 메시지 때문에
  - 그분의 말씀으로 인해
  lexicon: BDAG
  rationale: διά + 대격은 원인/이유를 나타내므로 ‘때문에’가 가장 직접적입니다. footnote는 POB의 ‘message’ 대안을 반영합니다.
theological_decisions:
- issue: 믿음의 객체를 본문보다 더 명시적으로 만들지 않음
  chosen_reading: ‘믿게 되었습니다’로 번역해, 여기서는 믿음의 대상이 문법적으로 직접 제시되지 않은 상태를 유지했습니다.
  alternative_readings:
  - 그분을 믿게 되었습니다
  - 예수를 믿게 되었습니다
  - 믿음을 갖게 되었습니다
  rationale: 본문은 단지 많은 사람들이 그의 말씀 때문에 믿었다고 말할 뿐이므로, 대상이 예수임을 너무 일찍 명시해 해석을 앞서가지 않도록 했습니다.
  doctrine_reference: 원문 우선, 문맥이 제시하는 정도까지만 명시
