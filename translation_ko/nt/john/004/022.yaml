  to: 너희는 알지 못하는 것을 예배하고, 우리는 아는 것을 예배합니다. 이는 구원이 유대인에게서[a] 오기 때문입니다.
  rationale: 번역의 핵심 의미는 유지하고, Ἰουδαίων 관련 각주 표지를 해당 어구로 옮겼습니다. 또한 ‘유대인에게서’로 집단적 출처라는 뜻을 더 자연스럽게 표현했습니다. 이는 구원이 유대 민족을 통한 역사적·언약적 출처를 가진다는 본문의 진술을 보존하며, 민족적 우월성 주장을 덧붙이지 않습니다.
