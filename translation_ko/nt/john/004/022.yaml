id: JHN.4.22
reference: John 4:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
  footnotes:
  - marker: a
    text: Or 'the Jewish people'; elsewhere in John, 'Judeans' may fit some contexts, but here the contrast is with Samaritans in matters of worship and salvation history.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 알지 못하는 것을 예배하고, 우리는 아는 것을 예배합니다. 이는 구원이 유대인에게서[a] 오기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 민족’. 요한복음의 다른 문맥에서는 ‘유다인들’이 더 적절할 수 있으나, 여기서는 예배와 구원사의 문제에서 사마리아인과 유대인의 대조가 중심입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  english_pob_choice: worship
  chosen_korean: 예배하다
  alternatives_korean:
  - 경배하다
  - 절하다
  lexicon: BDAG
  rationale: 요한복음의 동사는 종교적 예배를 가리키므로, 한국어로는 일반적이고 현대적인 종교행위 용어인 '예배하다'가 가장 적합합니다.
- source_word: ὃ
  english_pob_choice: what
  chosen_korean: 것
  alternatives_korean:
  - 그분을
  - 그 사람을
  lexicon: BDAG
  rationale: 중성 관계대명사는 영어처럼 일반적 대상(‘what’)을 가리키므로 한국어에서는 구체적 인칭으로 옮기지 않고 중성 대체어 '것'으로 처리했습니다.
- source_word: οἴδατε / οἴδαμεν
  english_pob_choice: know
  chosen_korean: 알다
  alternatives_korean:
  - 이해하다
  - 알고 있다
  lexicon: BDAG
  rationale: 여기서 동사는 대상에 대한 인식·지식을 말하므로 간결하게 '알다'로 옮겼습니다; 대조를 명확히 유지합니다.
- source_word: σωτηρία
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 구함
  lexicon: BDAG
  rationale: 요한서 신학에서 단어는 단순한 생존 이상의 구원사적 의미를 지니므로 전통적 번역어 '구원'을 사용했습니다.
- source_word: τῶν Ἰουδαίων
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대 민족
  - 유다인들
  - 유대인
  lexicon: BDAG
  rationale: 문맥상 사마리아인과의 대조를 통해 '구원이 유대인들에게서(=유대 민족을 통해) 온다'는 역사·언약적 출처를 말하므로 집단을 가리키는 '유대인들'로 표현했습니다.
theological_decisions:
- issue: Meaning of 'salvation is from the Jews'
  chosen_reading: 구원이 역사적·언약적 출처로서 유대인들에게서 나온다고 진술 — 민족적 우월성 주장으로 번역하지 않음
  alternative_readings:
  - 메시아의 유대인적 출신을 한정적으로 가리킴
  - 유대인의 계시·예배가 우선함을 보다 포괄적으로 주장함
  rationale: 본문은 예배의 대조를 구원사(救援史)의 출처에 연결하는 진술입니다. 번역은 원문 어휘를 충실히 전달하되, 본문이 암시하지 않는 우월성·교리적 주장으로 확장하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
