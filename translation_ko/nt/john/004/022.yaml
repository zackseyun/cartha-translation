  verdict: revise
  source_fidelity: 본문 번역은 προσκυνέω의 종교적 의미를 ‘예배하다’로, οἶδα의 대조를 ‘알지 못하다/알다’로, σωτηρία를 ‘구원’으로 충실히 옮겼습니다. 다만 Ἰουδαίων에 관한 각주가 현재 ‘예배합니다’ 뒤에 붙어 있어 실제 해당 어구와 연결되지 않습니다. ‘유대인에게서’는 집단을 가리키는 한국어의 자연스러운 단수형으로, 복수형 그리스어의 집합적 의미를 보존합니다.
  naturalness: ‘유대인들에게서’도 이해되지만, 구원의 역사적 출처를 말하는 이 문맥에서는 ‘유대인에게서’가 더 자연스럽고 불필요하게 개별 유대인들을 연상시키지 않습니다. 문장의 합쇼체는 유지됩니다.
  terminology: ‘예배’, ‘구원’, ‘유대인’은 문맥과 표준 한국어 성서 용례에 적절합니다. 각주는 ‘유대 민족’ 및 문맥에 따른 ‘유다인들’ 가능성을 설명하되, 본문의 사마리아인-유대인 대조를 분명히 해야 합니다.
