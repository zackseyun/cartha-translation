  source_fidelity: 마지막 절의 ἤδη(‘이미’)와 λευκαί εἰσιν(‘희어져 있다’)를 충실히 반영해야 합니다. 초안의 ‘추수할 때가 될 만큼 희어졌습니다’는 ‘될’과 완료 변화의 뉘앙스를 더하여, 현재의 ‘이미 희어져 있다’라는 원문 표현을 다소 바꿉니다.
  naturalness: ‘당신들은’은 현대 표준 한국어의 공적·정중한 성경 문체에서 예수께서 복수의 청자에게 말씀하시는 표현으로 다소 직접적이고 어색할 수 있습니다. ‘여러분은’ 및 ‘여러분에게’이 자연스럽습니다. ‘그 뒤에 추수가 온다’는 인용된 속담의 시간 관계도 명료하게 전달합니다.
  terminology: θερισμός는 일관되게 ‘추수’로, χώρας는 농경 비유의 시각을 보존하여 ‘밭들’로 옮기는 것이 적절합니다. λευκαί의 ‘희다’ 이미지는 본문에 유지하고, ‘익다’는 가능한 해석적 대안으로 각주에 둡니다.
  issues:
  - severity: medium
    issue: ‘추수할 때가 될 만큼 희어졌습니다’
    rationale: 원문은 ‘이미 추수를 향해/위해 희어져 있다’(λευκαί εἰσιν πρὸς θερισμόν· ἤδη)라고 현재 상태를 말합니다. ‘될’은 미래적 과정 또는 조건을 보태며, ‘희어졌습니다’는 완료 변화에 초점을 둡니다.
  - severity: low
