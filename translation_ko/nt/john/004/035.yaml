    rationale: 문법적으로 틀리지는 않지만, 현대 합쇼체 성경 문체에서는 복수 청자를 향한 ‘여러분은 / 여러분에게’이 더 자연스럽고 불필요한 대인적 직접성을 피합니다.
  - severity: low
    issue: 영어 감사 기록의 ‘white/ripe’ 대안 각주가 한국어 본문에 반영되지 않음
