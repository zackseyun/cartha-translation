id: JHN.4.35
reference: John 4:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
  footnotes:
  - marker: a
    text: Or 'they are ripe for harvest.' The Greek says 'white,' preserving the visual harvest image while implying readiness.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 「아직 넉 달이 남았고, 그때에 추수가 온다」고 말하지 않습니까? 보십시오, 내가 당신들에게 말합니다. 눈을 들어 밭들을 보십시오. 이미 추수할 때가 될 만큼 희어졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  english_pob_choice: Do you not say
  chosen_korean: 당신들은 …고 말하지 않습니까?
  alternatives_korean:
  - 당신들은 …고 말하지 않습니까?
  - 여러분은 …고 말하지 않습니까?
  lexicon: BDAG
  rationale: 부정 의문문의 수사적 힘을 살리면서도 ὑμεῖς의 강조를 한국어로 자연스럽게 드러내기 위해 '당신들은'을 앞세웠습니다.
- source_word: Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται
  english_pob_choice: There are still four months, and then the harvest comes
  chosen_korean: 아직 넉 달이 남았고, 그때에 추수가 온다
  alternatives_korean:
  - 아직 넉 달이 남았고, 그때에 추수가 옵니다
  - 아직 넉 달이 지나야 추수가 옵니다
  lexicon: BDAG
  rationale: 남은 기간을 나타내는 관용적 표현으로 풀되, 영어 POB처럼 기다림의 관용적 감각을 살려 '그때에 추수'로 옮겼습니다.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε
  english_pob_choice: lift up your eyes and see
  chosen_korean: 눈을 들어 밭들을 보십시오
  alternatives_korean:
  - 눈을 들어 보십시오
  - 눈을 들어 밭들을 살펴보십시오
  lexicon: BDAG
  rationale: '''눈을 들어''는 원문의 생생한 관용구를 살리고, θεάσασθε는 단순한 시선이 아니라 의도적 관찰이므로 ''보십시오''로 옮겼습니다.'
- source_word: τὰς χώρας
  english_pob_choice: the fields
  chosen_korean: 밭들
  alternatives_korean:
  - 들판들
  - 밭
  lexicon: BDAG
  rationale: 추수 문맥에서 χώρας는 일반적인 지역이 아니라 경작지이므로, 한국어에서 가장 직접적인 대응어인 '밭들'을 택했습니다.
- source_word: λευκαί εἰσιν πρὸς θερισμόν
  english_pob_choice: they are white for harvest
  chosen_korean: 이미 추수할 때가 될 만큼 희어졌습니다
  alternatives_korean:
  - 이미 추수하기에 희어졌습니다
  - 추수할 만큼 희어졌습니다
  lexicon: BDAG
  rationale: '''희다''의 시각 이미지를 유지하되, 한국어 독자가 수확의 준비 상태를 이해하도록 ''될 만큼''을 덧붙여 원문의 은유를 과도하게 풀지 않았습니다.'
theological_decisions:
- issue: 추수 비유를 본문에서 어떻게 처리할 것인가
  chosen_reading: 비유를 유지하고 사람들의 준비 상태를 노골적으로 풀어 쓰지 않았습니다.
  alternative_readings:
  - 사람들이 이미 거둘 준비가 되었다고 해석적으로 옮길 수 있습니다
  - 전도 대상으로서 사람들을 직접 지칭하는 방식으로 옮길 수 있습니다
  rationale: 문맥상 영적 의미가 분명하더라도, 본문 자체는 농경 이미지를 유지하므로 POB 원칙에 따라 은유를 보존했습니다.
  doctrine_reference: Translation philosophy items 1, 3, and 6
