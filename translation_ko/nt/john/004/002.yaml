  lexicon: BDAG
  rationale: 그리스어 미완료형(ἐβάπτιζεν)은 당시의 계속적·습관적 행위를 내포할 수 있으므로, 한국어의 진행형·공손 표현인 '베풀고 계시지 않으셨고'로 그 뉘앙스를 살렸습니다.
- source_word: οἱ μαθηταὶ αὐτοῦ
  english_pob_choice: his disciples were
  chosen_korean: 오히려 제자들이 베풀고 있었습니다
  alternatives_korean:
  - 그의 제자들이 베풀고 있었습니다
  - 제자들이 베풀고 있었습니다
  lexicon: BDAG
  rationale: 그리스어는 'ἀλλ’ οἱ μαθηταὶ αὐτοῦ'에서 동사를 생략하므로 한국어에서는 앞절의 동사를 채워야 합니다. '오히려'는 대조를 명확히 하고, '베풀고 있었습니다'는 미완료의 계속성을 반영합니다.
theological_decisions:
- issue: 누가 세례를 집행했는가에 관한 서술
  chosen_reading: 이 구절은 예수님 자신이 직접 세례를 베푸시지 않았고 제자들이 그 일을 했음을 서술합니다.
  alternative_readings:
  - 단순 과거로 '예수님은 세례를 베풀지 않으셨고 제자들이 베풀었다'고 옮길 수 있다.
  rationale: 원문 미완료형을 보존하여 예수의 비(非)집행과 제자들의 계속적 집행이라는 서술적 긴장을 유지하는 것이 원문 우선 원칙에 부합합니다. 번역은 신학적 결론을 도출하지 않고 서술적 사실만 전달합니다.
  doctrine_reference: 원문 우선; 번역은 본문의 서술적 긴장을 보존함
