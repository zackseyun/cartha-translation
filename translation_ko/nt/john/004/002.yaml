  rationale: 현대 한국어의 서술적 공손성을 반영하여 인물 호칭에 통상 붙는 경칭 '-님'을 사용했습니다. 본 구절은 직접 호칭이 아니라 서술이므로 경칭은 번역상의 공손성·표준성을 위한 선택이며 원문의 의미를 변경하지 않습니다.
