  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s slaves[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
  footnotes:
  - marker: a
    text: Or “servants.” The Greek word is douloi, which can mean either “servants” or “slaves” depending on context; here “slaves” was chosen to preserve the bonded status implied by the term.
    reason: lexical_alternative
translation:
  language: ko
  text: 베드로가 귀를 잘라 낸 사람의 친척인 대제사장의 노예들[a] 가운데 한 사람이 말하였습니다. 「제가 동산에서 그와 함께 있는 당신을 보지 않았습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「종들」 또는 「하인들」. 헬라어 「둘로이」(δοῦλοι)는 문맥에 따라 「종」 또는 「노예」로 옮길 수 있다. 여기서는 대제사장에게 속한 사람들의 예속된 신분을 나타내므로 「노예들」로 옮겼다.
    reason: lexical_alternative
