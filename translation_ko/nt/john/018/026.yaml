  source_fidelity: 수정이 필요합니다. δοῦλοι는 이 문맥에서 대제사장에 속한 실제 노예들을 가리키므로 본문의 「종들」 및 각주의 「종을 채택」은 영어 POB의 어휘 결정과도 어긋나며, κοινων적 예속 관계를 약화합니다. 또한 「베드로가 귀를 자른 자」는 귀의 소유자가 아니라 베드로가 그 사람을 잘랐다는 뜻으로도 읽힐 수 있어 관계절을 명확히 해야 합니다.
