  terminology: ἀρχιερεύς는 「대제사장」, συγγενής는 「친척」, κῆπος는 「동산」으로 적절합니다. δοῦλοι는 여기서 「노예들」로 번역하고, 각주는 대안인 「종들/하인들」을 제시해야 합니다.
