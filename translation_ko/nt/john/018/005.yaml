    issue: 인용된 응답이 명사구로만 끝남
    rationale: ‘나사렛 사람 예수’는 원문에서는 가능한 간결한 대격 명사구이지만, 한국어 직접 응답에서는 ‘나사렛 사람 예수입니다’가 자연스럽고 문법적으로 완결됩니다.
  - severity: low
    issue: 직접 인용문의 종결 표현이 합쇼체와 불일치
    rationale: ‘내가 그 사람이다’는 평서체이므로, 지정된 현대 공식-공손체에 맞춰 ‘내가 그 사람입니다’로 바꾸는 편이 일관됩니다.
  - severity: low
