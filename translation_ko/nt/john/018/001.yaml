  text: 예수께서 이 말씀들을 하신 뒤, 제자들과 함께 기드론 시내[a] 건너편으로 나가셨습니다. 그곳에는 동산이 있었는데, 그분과 그분의 제자들이 그 동산으로 들어가셨습니다.
  philosophy: optimal-equivalence
