  source_fidelity: ‘기드론 시내를 건너 동산이 있는 곳으로 나가셨습니다’는 그리스어의 구조를 다소 바꿉니다. πέραν은 기드론 시내의 ‘건너편’을, ὅπου ἦν κῆπος는 그곳에 동산이 있었음을 나타냅니다. 또한 각주는 χειμάρρου에 직접 붙는 것이 적절합니다.
  naturalness: 합쇼체는 자연스럽지만, ‘동산이 있는 곳으로’보다 ‘그곳에는 동산이 있었는데’가 원문의 관계절과 한국어 흐름을 더 잘 살립니다. ‘이 말씀들을 하신 뒤’도 자연스럽고 시간적 분사구문을 충실히 반영합니다.
  terminology: ‘기드론’, ‘시내’, ‘동산’은 적절합니다. ‘헬라어’는 현대 표준어 성경 번역의 설명문에서는 ‘그리스어’로 하는 편이 더 자연스럽습니다. 계절성 물길이라는 각주 설명은 유익하되, 본문에는 ‘시내’를 유지할 수 있습니다.
