base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
  footnotes:
  - marker: a
    text: Or “bear witness concerning the evil” or “testify about what was wrong.”
    reason: lexical_alternative
  - marker: b
    text: Or “why do you hit me?” The Greek verb can refer broadly to striking, and in some contexts to beating.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그에게 대답하셨습니다. 「내가 잘못 말했다면 그 잘못[a]에 대하여 증언하십시오. 그러나 옳게 말했다면 왜 나를 치십니까[b]?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「그 악에 대하여 증언하십시오」 또는 「잘못된 것에 대하여 증언하십시오」.
    reason: lexical_alternative
  - marker: b
    text: 또는 「왜 나를 때리십니까?」 헬라어 동사는 넓게는 치거나 때리는 것을 가리키며, 문맥에 따라 구타를 뜻할 수도 있습니다.
