  text: 예수께서 대답하셨습니다. 「당신이 이것을 스스로 말하는 것입니까, 아니면 다른 사람들이 나에 대해 당신에게 말해 준 것입니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
