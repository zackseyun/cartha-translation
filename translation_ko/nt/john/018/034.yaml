  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
  footnotes:
  - marker: a
    text: Or “on your own.” The Greek literally says “from yourself,” asking whether Pilate’s statement originates with him personally.
    reason: lexical_alternative
