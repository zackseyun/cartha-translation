  terminology: ‘대제사장들’, ‘바리새인’, ‘등불’, ‘횃불’, ‘무기’는 적절합니다. ‘군사 분견대’는 σπεῖρα의 군사적 성격을 보존하면서 전원이 출동했다는 주장을 피합니다. ‘경비원들’은 ὑπηρέτας의 공식적 역할을 드러내되 ‘성전 경찰’이라는 해석을 본문에 확정적으로 넣지 않습니다.
