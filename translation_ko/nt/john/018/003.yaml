  source_fidelity: 수정 전의 ‘부하들’은 ὑπηρέτας가 가리키는 대제사장들과 바리새인 측의 공식 경비·수행 인력을 단순한 유다의 부하처럼 들리게 할 수 있습니다. 또한 ‘대제사장들과 바리새인들에게서 보낸’은 원문의 ‘그들에게서 [데려온]’보다 파송 행위를 더 강하게 암시합니다. 이를 ‘...에게서 온 경비원들’로 고쳐 혼합된 체포 인원의 구성을 보존했습니다. σπεῖρα는 전체 병력 규모를 단정하지 않는 ‘군사 분견대’로 옮겼습니다.
