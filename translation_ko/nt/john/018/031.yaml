review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘권한이 없습니다’는 문맥상 가능한 해석이지만, οὐκ ἔξεστιν은 권한의 부재보다 ‘허용되지 않음/합법적이지 않음’을 직접 말합니다. 이를 법적 허용의 표현으로 고치면 원문의 양태와 법정 문맥을 더 정확히 반영합니다. Λάβετε와 명시된 ὑμεῖς의 강조는 ‘당신들이 그를 데려가서’로, κατὰ τὸν νόμον ὑμῶν κρίνατε는 ‘당신들의 율법에 따라 재판하십시오’로 자연스럽게 보존됩니다.
  naturalness: 현대 표준 한국어 합쇼체로 문장을 다듬었습니다. 직접 인용에서 빌라도의 명령은 ‘-하십시오’, 유대인들의 진술은 ‘-않습니다’로 처리하여 격식 있는 서술과 발화의 자연스러움을 유지했습니다.
  terminology: ‘율법’은 νόμος의 성경적·문맥적 용례에 적절합니다. οἱ Ἰουδαῖοι는 본문에서 ‘유대인들’로 유지하되, 각주에서 이 대화 장면의 직접 지시 대상이 유대 당국자들 또는 고발자들임을 설명했습니다. 각주는 본문 표현의 범위를 과도하게 단정하지 않도록 ‘가리키는 것으로 보인다’로 조정했습니다.
  issues:
  - severity: medium
    issue: οὐκ ἔξεστιν을 ‘권한이 없습니다’로 번역함
    rationale: ‘권한’은 권능이나 관할권의 부재를 전면에 내세우지만, 원문은 그들이 누군가를 죽이는 일이 허용되지 않거나 합법적이지 않다는 진술입니다. 법적 맥락은 유지하되 ‘허용되지 않습니다’로 옮기는 편이 더 직접적입니다.
  - severity: low
    issue: 각주 문구가 οἱ Ἰουδαῖοι의 문맥상 지시 대상을 단정적으로 한정함
    rationale: 현재 장면의 화자는 빌라도 앞의 유대 당국자들/고발자들이지만, 표현 자체는 ‘유대인들’입니다. 각주는 오독을 방지하되 본문의 표현과 해석상 여지를 보존하도록 완화하는 것이 좋습니다.
