  text: 그러자 빌라도가 그들에게 말했습니다. “당신들이 그를 데려가서, 당신들의 율법에 따라 재판하십시오.” 유대인들이[a] 그에게 말했습니다. “우리에게는 아무도 죽이는 것이 법적으로 허용되지 않습니다.”
  philosophy: optimal-equivalence
  footnotes:
