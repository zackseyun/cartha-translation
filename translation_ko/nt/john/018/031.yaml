- from: 그래서 빌라도가 그들에게 말하였습니다. 「당신들이 그를 데려다가 당신들의 율법대로 그를 재판하시오.」 유대인들이 그에게 말하였습니다. 「우리에게는 사람을 죽일 권한이 없습니다.」[a]
  to: 그러자 빌라도가 그들에게 말했습니다. “당신들이 그를 데려가서, 당신들의 율법에 따라 재판하십시오.” 유대인들이[a] 그에게 말했습니다. “우리에게는 아무도 죽이는 것이 법적으로 허용되지 않습니다.”
  rationale: 법정 문맥에서 οὐκ ἔξεστιν이 나타내는 허용 여부를 ‘권한’이 아니라 ‘법적으로 허용되지 않습니다’로 번역했습니다. 그 밖에는 빌라도의 명령에 담긴 강조와 원문의 법적 어휘를 보존하면서, 현대 한국어 합쇼체에 맞게 다듬었습니다. 각주 표지는 ‘유대인들’에 직접 연결했습니다.
