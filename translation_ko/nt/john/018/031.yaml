    text: 헬라어는 「유대인들」(hoi Ioudaioi)입니다. 이 문맥에서는 빌라도와 대화하는 유대 당국자들 또는 고발자들을 가리키는 것으로 보이며, 유대 백성 전체를 뜻하는 말로 이해해서는 안 됩니다.
