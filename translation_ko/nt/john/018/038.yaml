  source_fidelity: 빌라도의 두 역사적 현재를 과거 서술로 옮긴 것은 한국어 서사에 자연스럽습니다. 그러나 「무엇이오?」와 「찾지 못하겠소」는 목표 register인 현대 합쇼체가 아니라 하오체/하겠소체입니다. 또한 αἰτίαν은 법정 문맥에서 단순한 개인의 ‘죄목’보다 그를 고발할 근거나 혐의의 사유를 뜻합니다.
