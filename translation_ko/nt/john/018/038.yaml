  terminology: ἀλήθεια는 무관사이므로 「진리」로 유지합니다. Ἰουδαίους는 본문에서 「유대인들」로 직역하되, 당면 문맥상 유대 지도자들 또는 대표 무리를 가리킬 수 있음을 각주로 남기는 것이 적절합니다. αἰτίαν은 「고발할 근거」로 번역하여 법정적 의미를 보존합니다.
