  text: 빌라도가 그에게 말하였습니다. 「진리가 무엇입니까?」 이 말씀을 하신 뒤에, 빌라도는 다시 나가 유대인들에게 말하였습니다. 「나는 그에 대하여 고발할 근거를 아무것도 찾지 못합니다.[a]」
