review_pass:
  verdict: revise
  source_fidelity: 그리스어의 사건 순서와 핵심 의미는 대체로 충실합니다. 다만 「칼을 가지고 있다가」는 ἔχων μάχαιραν(칼을 가지고 있던)의 동시적/수식적 용법을 부자연스럽게 시간적 상황으로 바꿉니다. ἀπέκοψεν은 귀를 단지 베었다기보다 잘라 내어 떨어지게 한 뜻이므로 이를 더 분명히 반영하는 것이 좋습니다.
  naturalness: 「칼을 가지고 있던 시몬 베드로가」와 「칼을 뽑아 … 치고」가 현대 표준 한국어 서술에서 자연스럽고, 합쇼체 문체에도 알맞습니다. 「잘라 냈습니다」는 불필요하게 구어적인 「잘라 버렸습니다」보다 중립적입니다.
  terminology: 「시몬 베드로」, 「대제사장」, 「종」, 「말고」는 한국어 성경 문맥에서 통용되는 적절한 용어와 표기입니다. δοῦλος의 의미 범위를 보완하는 각주는 현대적으로 「그리스어」 및 음역 「둘로스」를 사용하고, 「노예」 대안을 제시하는 편이 명확합니다.
  issues:
  - severity: medium
    issue: 「칼을 가지고 있다가」
    rationale: ἔχων은 베드로가 칼을 소지한 상태를 나타내는 분사이며, 「-다가」는 뒤 사건 이전에 진행되던 행위나 상황이 전환되는 인상을 주어 자연스럽지 않습니다.
  - severity: low
    issue: 「귀를 잘라 버렸습니다」
    rationale: 의미는 대체로 맞지만, 「-버리다」는 한국어에서 화자의 완료·유감 등의 뉘앙스를 덧붙일 수 있습니다. ἀπέκοψεν의 절단·제거 의미는 「잘라 냈습니다」로 중립적으로 표현할 수 있습니다.
  - severity: low
    issue: 각주의 「헬라어 단어는 doulos」
    rationale: 현대 표준어에서는 「그리스어」가 더 자연스럽고, 원어 음역은 한글 병기가 읽기 쉽습니다. 대안도 δοῦλος의 핵심 의미를 직접 나타내는 「노예」가 적절합니다.
  revised_text: 그러자 칼을 가지고 있던 시몬 베드로가 그것을 뽑아 대제사장의 종을 치고 그의 오른쪽 귀를 잘라 냈습니다. 그 종의 이름은 말고였습니다.[a]
