  source_fidelity: 원문의 δέ는 강한 역접인 ‘그러나’보다 화제를 잇는 ‘그런데’가 적절합니다. ἕνα은 ‘한 사람’으로 보존했고, 두 차례의 ἀπολύσω는 모두 ‘석방하다’로 일관되게 옮겼습니다. βούλεσθε οὖν의 질문도 ‘그러면 … 원하십니까?’로 보존했습니다.
  naturalness: 초안의 문장 자체는 대체로 이해되지만, ‘그러나’는 문맥상 다소 강하며, 문장 끝의 닫는 인용 부호는 짝이 없습니다. ‘유대인의 왕’은 한국어에서 정착된 칭호형 표현이며 ‘유대인들의 왕’보다 자연스럽습니다.
