  text: 그런데 너희에게는 유월절에 내가 한 사람을 너희를 위하여 석방하는 관습이 있다. 그러면 내가 유대인의[a] 왕을 너희를 위하여 석방하기를 원하십니까?
  philosophy: optimal-equivalence
  footnotes:
