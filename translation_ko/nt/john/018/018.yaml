  yaml_path: translation/nt/john/018/018.yaml
  text: Now the slaves and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
  footnotes:
  - marker: a
    text: Or 'servants' for δοῦλοι; here 'slaves' is used to preserve the likely bonded status of the household personnel.
    reason: lexical_alternative
  - marker: b
    text: Or 'guards' for ὑπηρέται; the term refers to official attendants, likely connected with the temple or high priestly establishment.
    reason: lexical_alternative
translation:
  language: ko
  text: 종들[a]과 경비원들[b]이 추웠기 때문에 숯불을 피워 놓고 서서 몸을 녹이고 있었습니다. 베드로도 그들과 함께 서서 몸을 녹이고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「하인들」(δοῦλοι). 여기서는 단순한 고용인보다 예속된 신분을 가리킬 가능성을 살리기 위해 「종들」로 옮긴다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「관리들」(ὑπηρέται). 이 말은 공적 수행원 또는 경비 인력을 가리키며, 아마도 성전이나 대제사장 측과 관련되었을 것이다.
    reason: lexical_alternative
