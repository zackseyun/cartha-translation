translation:
  language: ko
  text: 예수께서 대답하셨습니다. 「내 나라는 이 세상에서 비롯된 것이 아닙니다. 만일 내 나라가 이 세상에서 비롯된 것이라면, 내 종들이 내가 유대인들에게[a] 넘겨지지 않도록 싸우고 있었을 것입니다. 그러나 사실 내 나라는 여기에서 비롯된 것이 아닙니다.」
  philosophy: optimal-equivalence
  footnotes:
