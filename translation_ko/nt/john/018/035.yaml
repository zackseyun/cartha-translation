  source_fidelity: 초안은 문장의 기본 의미와 ‘넘기다’의 사법적 뉘앙스를 대체로 잘 옮겼습니다. 그러나 μήτι가 기대하는 부정의 수사 의문문이 ‘내가 유대인입니까?’에서는 충분히 드러나지 않습니다. ‘내가 유대인이겠습니까?’가 이를 더 정확히 반영합니다.
  naturalness: 요구된 현대 표준어 합쇼체에 맞추어 대화문 종결을 ‘-습니다/-습니까’로 통일해야 합니다. ‘당신 민족’보다 ‘당신의 민족’이 현대 한국어 문장으로 더 자연스럽습니다.
  terminology: ἀρχιερεῖς는 복수의 예루살렘 제사장 지도층이므로 ‘대제사장들’보다 통상적이고 정확한 ‘수석 제사장들’로 옮깁니다. Ἰουδαῖος는 본문에서는 ‘유대인’으로 번역하되, 가능한 지역적 의미는 해당 어휘에 직접 연결한 각주에서 보존합니다.
