  naturalness: ‘그래서’도 가능하지만, 서사 연결의 οὖν에는 현대 격식체에서 ‘그러므로’가 자연스럽습니다. ‘군대 부대’와 ‘유대인들의 부하들’은 현대 한국어에서 어색하거나 오해를 낳을 수 있어 다듬었습니다.
