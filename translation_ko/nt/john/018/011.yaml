  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
  footnotes:
  - marker: a
    text: Or 'scabbard' for 'sheath.'
    reason: lexical_alternative
  - marker: b
    text: The 'cup' is a biblical metaphor for the suffering or destiny appointed by God; compare John 18:11 with the prayer in Gethsemane (e.g., Matt 26:39; Mark 14:36; Luke 22:42).
    reason: cross_reference
translation:
  language: ko
  text: 그러자 예수께서 베드로에게 말씀하셨습니다. 「칼을 칼집[a]에 넣으십시오. 아버지께서 내게 주신 잔[b]을 내가 마시지 않겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「검집」.
    reason: lexical_alternative
  - marker: b
    text: 「잔」은 성경에서 고난이나 하나님께서 정하신 길을 가리킬 수 있는 비유입니다. 겟세마네에서의 기도를 참조하십시오(마 26:39; 막 14:36; 눅 22:42).
    reason: cross_reference
