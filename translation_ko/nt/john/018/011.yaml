  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 οὖν은 이 문맥에서 강한 논리적 결론이라기보다 서술의 연결이므로 「그러자」가 더 적절합니다. 또한 οὐ μὴ πίω αὐτό;의 수사 의문문은 「내가 마시지 않겠습니까?」로 옮겨 긍정의 답을 기대하는 힘을 자연스럽게 보존할 수 있습니다.
