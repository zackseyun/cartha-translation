  terminology: 「칼」, 「칼집」, 「아버지」, 「잔」은 적절합니다. 다만 「잔」의 비유에 대한 주석은 본문보다 좁은 교리적 해석을 강요하지 않도록 ‘고난이나 하나님께서 정하신 길’ 정도로 절제해 설명하는 것이 좋습니다.
