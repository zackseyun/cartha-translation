  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
  footnotes:
  - marker: a
    text: Or 'Why are you asking me? Ask those who heard what I said to them.' The Greek verb can be rendered more neutrally as 'ask,' but 'question' better reflects the hearing's judicial setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 나를 심문하십니까? 내가 그들에게 말한 것을 들은 사람들에게 물으십시오[a]. 보십시오, 이 사람들이 내가 말한 것을 알고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「왜 나에게 묻습니까? 내가 그들에게 말한 것을 들은 사람들에게 물으십시오」. 헬라어 동사는 더 중립적으로 「묻다」로 옮길 수도 있으나, 공식 심리의 문맥에서는 「심문하다」로 옮길 수 있습니다.
    reason: lexical_alternative
