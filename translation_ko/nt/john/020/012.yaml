id: JHN.20.12
reference: John 20:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
  footnotes:
  - marker: a
    text: Or 'wearing white' or 'in white clothing.' The Greek is literally 'in white.'
    reason: lexical_alternative
  - marker: b
    text: Or 'where the body of Jesus was lying.' The Greek imperfect can be rendered more simply, but 'had been lying' clarifies the prior state in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그녀는 흰 옷을 입은 두 천사가[a] 앉아 있는 것을 보았습니다. 하나는 머리 쪽에, 하나는 발 쪽에 있었는데[b], 예수의 몸이 놓여 있던 곳입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘흰 옷을 입은’이라는 뜻일 수 있습니다. 그리스어는 문자적으로 ‘흰 것 안에/흰 가운데’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예수의 몸이 누워 있던 곳’으로 옮길 수 있습니다. 그리스어 미완료형은 문맥상 이전 상태를 더 분명히 드러내기 위해 ‘놓여 있던’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  english_pob_choice: she sees
  chosen_korean: 보았습니다
  alternatives_korean:
  - 봅니다
  - 지켜보았습니다
  - 목격했습니다
  lexicon: BDAG
  rationale: 서술 문맥에서 현재형의 생생함을 자연스러운 과거 서술로 옮겼으며, 문맥상 마리아 막달레나의 시선을 분명히 드러내면서도 과장하지 않았습니다.
- source_word: ἐν λευκοῖς
  english_pob_choice: in white
  chosen_korean: 흰 옷을 입은
  alternatives_korean:
  - 흰색인
  - 흰 옷의
  - 하얀 옷을 입은
  lexicon: BDAG
  rationale: 그리스어의 간결한 표현을 한국어에서는 자연스럽게 풀어, 색깔만이 아니라 흰 옷 차림이라는 의미가 드러나도록 했습니다.
- source_word: καθεζομένους
  english_pob_choice: sitting there
  chosen_korean: 앉아 있는
  alternatives_korean:
  - 앉아 있는 채로
  - 자리하고 있는
  - 앉아 있는 것을
  lexicon: BDAG
  rationale: 천사들의 자세를 나타내는 분사로서, 한국어에서는 진행적 상태를 나타내는 ‘앉아 있는’이 가장 자연스럽습니다.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  english_pob_choice: one at the head and one at the feet
  chosen_korean: 하나는 머리 쪽에, 하나는 발 쪽에
  alternatives_korean:
  - 하나는 머리 가까이에, 하나는 발 가까이에
  - 하나는 머리 편에, 하나는 발 편에
  lexicon: BDAG
  rationale: πρός + 여격의 근접 위치를 ‘쪽에’로 옮겨, 원문의 공간적 배치를 자연스럽고 정확하게 살렸습니다.
- source_word: ἔκειτο
  english_pob_choice: had been lying
  chosen_korean: 놓여 있던
  alternatives_korean:
  - 누워 있던
  - 있던
  - 누워 있었던
  lexicon: BDAG
  rationale: 무덤 장면에서 시신이 이전에 거기에 놓여 있었음을 한국어 과거 관형절로 표현해, 영어 POB의 과거완료가 드러내는 선행 상태를 반영했습니다.
theological_decisions:
- issue: ἀγγέλους의 지시 대상
  chosen_reading: 천사들
  alternative_readings:
  - 사자들
  - 전령들
  rationale: 빈 무덤과 흰 옷이라는 문맥이 하늘 존재를 분명히 가리키므로, 일반적 ‘전령’보다 ‘천사’가 원문 의도에 더 가깝습니다.
  doctrine_reference: 원어 우선 원칙
- issue: 참조절 ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ의 시간 관계
  chosen_reading: 예수의 몸이 놓여 있던 곳입니다
  alternative_readings:
  - 예수의 몸이 놓여 있던 곳이었습니다
  - 예수의 몸이 있던 곳입니다
  rationale: 무덤의 현재 지점이 이전에 시신이 놓여 있던 자리임을 문맥적으로 드러내되, 과도한 해석 없이 선행 상태를 분명히 했습니다.
  doctrine_reference: 최적 대응 번역
