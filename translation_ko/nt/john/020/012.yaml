  lexicon: BDAG
  rationale: 그리스어의 간결한 표현을 한국어에서는 자연스럽게 풀어, 색깔만이 아니라 흰 옷 차림이라는 의미가 드러나도록 했습니다.
- source_word: καθεζομένους
  english_pob_choice: sitting there
  chosen_korean: 앉아 있는
  alternatives_korean:
  - 앉아 있는 채로
  - 자리하고 있는
  - 앉아 있는 것을
  lexicon: BDAG
  rationale: 천사들의 자세를 나타내는 분사로서, 한국어에서는 진행적 상태를 나타내는 ‘앉아 있는’이 가장 자연스럽습니다.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  english_pob_choice: one at the head and one at the feet
  chosen_korean: 하나는 머리 쪽에, 하나는 발 쪽에
  alternatives_korean:
  - 하나는 머리 가까이에, 하나는 발 가까이에
  - 하나는 머리 편에, 하나는 발 편에
  lexicon: BDAG
  rationale: πρός + 여격의 근접 위치를 ‘쪽에’로 옮겨, 원문의 공간적 배치를 자연스럽고 정확하게 살렸습니다.
- source_word: ἔκειτο
  english_pob_choice: had been lying
  chosen_korean: 놓여 있던
  alternatives_korean:
  - 누워 있던
  - 있던
  - 누워 있었던
  lexicon: BDAG
  rationale: 무덤 장면에서 시신이 이전에 거기에 놓여 있었음을 한국어 과거 관형절로 표현해, 영어 POB의 과거완료가 드러내는 선행 상태를 반영했습니다.
theological_decisions:
- issue: ἀγγέλους의 지시 대상
  chosen_reading: 천사들
  alternative_readings:
  - 사자들
  - 전령들
  rationale: 빈 무덤과 흰 옷이라는 문맥이 하늘 존재를 분명히 가리키므로, 일반적 ‘전령’보다 ‘천사’가 원문 의도에 더 가깝습니다.
  doctrine_reference: 원어 우선 원칙
- issue: 참조절 ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ의 시간 관계
  chosen_reading: 예수의 몸이 놓여 있던 곳입니다
  alternative_readings:
  - 예수의 몸이 놓여 있던 곳이었습니다
  - 예수의 몸이 있던 곳입니다
  rationale: 무덤의 현재 지점이 이전에 시신이 놓여 있던 자리임을 문맥적으로 드러내되, 과도한 해석 없이 선행 상태를 분명히 했습니다.
  doctrine_reference: 최적 대응 번역
