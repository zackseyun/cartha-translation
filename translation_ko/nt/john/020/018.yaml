revisions:
- from: 마리아 막달레나가 제자들에게 가서 이렇게 알렸습니다[a]. 「나는 주님을 보았습니다」라고, 그리고 주님이 자기에게 이런 일들을 말씀하셨다고 전했습니다.
  to: 막달라 마리아가 제자들에게 와서, “나는 주님을 보았습니다”라고, 또 주님께서 그녀에게 이 말씀들을 하셨다고 알렸습니다[a].
  rationale: 원문의 역사적 현재는 한국어 서사 과거 ‘와서’로 자연스럽게 옮겼습니다. ἀγγέλλουσα가 이끄는 두 내용, 곧 주님을 보았다는 말과 주님이 마리아에게 말씀하신 내용이 한 보고 행위에 속하도록 문장을 정리했습니다. 마지막 절의 문법적 귀속에 관한 불확실성은 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:52:06Z'
review_pass:
  verdict: revise
  source_fidelity: 마지막 절을 마리아가 제자들에게 전한 내용으로 이해한 점은 가능한 해석이며, κύριος를 ‘주님’으로 옮긴 것도 적절합니다. 그러나 ‘가서’는 원문의 ἔρχεται(여기서는 역사적 현재)의 ‘오다’보다 방향성을 불필요하게 바꾸며, ταῦτα를 ‘이런 일들’로 옮기면 예수께서 하신 말씀/말한 내용이라는 지시가 사건들로 변합니다.
  naturalness: 현 번역은 ‘알렸습니다’ 뒤에 직접 인용을 놓고 다시 ‘전했습니다’로 같은 전달 행위를 반복하여 문장 구조가 부자연스럽습니다. 한 동사 아래 두 전달 내용을 병렬로 두는 편이 자연스럽습니다. ‘막달라 마리아’는 표준 한국어 성경 관습에도 더 잘 맞습니다.
  terminology: ‘주님’은 적절합니다. ταῦτα εἶπεν αὐτῇ는 ‘그녀에게 이 말씀들을 하셨다’처럼 발화 내용을 가리키도록 옮기는 것이 더 정확합니다. 마지막 절의 귀속은 문법적으로 다툼이 있으므로 대안 독법을 각주로 보존합니다.
  issues:
  - severity: medium
    issue: ἔρχεται를 ‘가서’로 번역함
    rationale: 원문 동사는 ‘오다’이며 역사적 현재로 사용되었습니다. 문맥상 한국어 과거 서술에서는 ‘와서’가 더 직접적이고, ‘가서’는 이동 방향을 반대로 특정합니다.
  - severity: medium
    issue: ταῦτα를 ‘이런 일들’로 번역함
    rationale: 여기서 ταῦτα는 예수께서 마리아에게 말씀하신 내용을 가리킵니다. ‘일들’은 사건으로 이해될 수 있으므로 ‘이 말씀들을’이 문맥에 더 충실합니다.
  - severity: medium
    issue: 전달 동사의 중복과 인용 구조의 어색함
    rationale: ‘알렸습니다 … 전했습니다’는 한 절의 분사와 그 내용절들을 한국어에서 중복된 두 보고 행위로 풀어 문장이 무겁습니다. 두 내용을 하나의 ‘알렸습니다’에 연결하는 것이 자연스럽습니다.
  revised_text: 막달라 마리아가 제자들에게 와서, “나는 주님을 보았습니다”라고, 또 주님께서 그녀에게 이 말씀들을 하셨다고 알렸습니다[a].
