id: JHN.20.18
reference: John 20:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
  footnotes:
  - marker: a
    text: Or, 'Mary Magdalene came to the disciples and said, “I have seen the Lord,” and he said these things to her.' The final clause may be taken either as part of Mary's report or as the narrator's comment.
    reason: alternative_reading
translation:
  language: ko
  text: 막달라 마리아가 제자들에게 와서, “나는 주님을 보았습니다”라고, 또 주님께서 그녀에게 이 말씀들을 하셨다고 알렸습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘막달라 마리아가 제자들에게 와서 “나는 주님을 보았습니다”라고 알렸습니다. 그리고 주님께서는 그녀에게 이 말씀들을 하셨습니다.’ 마지막 절은 마리아가 알린 내용에 포함될 수도 있고, 서술자의 설명일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  english_pob_choice: came
  chosen_korean: 가서
  alternatives_korean:
  - 왔습니다
  - 들어왔습니다
  lexicon: BDAG
  rationale: 현재형 역사적 현재를 한국어 자연스러운 서술로 풀어, 제자들에게 향한 이동 방향을 살려 ‘가서’로 옮겼습니다.
- source_word: ἀγγέλλουσα
  english_pob_choice: announcing
  chosen_korean: 알렸습니다
  alternatives_korean:
  - 전했습니다
  - 보고했습니다
  - 알리며
  lexicon: BDAG
  rationale: 단순한 말하기보다 메시지를 전달하는 행위를 드러내기 위해 ‘알렸습니다’를 선택했습니다.
- source_word: τοῖς μαθηταῖς
  english_pob_choice: to the disciples
  chosen_korean: 제자들에게
  alternatives_korean:
  - 그 제자들에게
  - 문하생들에게
  lexicon: BDAG
  rationale: μαθηταῖς의 기본 의미를 따라 ‘제자들’로 옮기되, 원문에 없는 소유격은 넣지 않았습니다.
- source_word: Ἑώρακα τὸν κύριον
  english_pob_choice: I have seen the Lord
  chosen_korean: 나는 주님을 보았습니다
  alternatives_korean:
  - 나는 주를 보았습니다
  - 나는 주님을 뵈었습니다
  lexicon: BDAG
  rationale: 완료형의 현재적 결과를 한국어 과거시제 중심 표현으로 자연스럽게 담고, κύριος는 예수에 대한 칭호로 ‘주님’을 택했습니다.
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 이런 일들
  alternatives_korean:
  - 이것들
  - 이 일들
  lexicon: BDAG
  rationale: 복수 지시어의 포괄성을 살려 ‘이런 일들’로 옮겨, 말씀의 내용을 뭉뚱그리지 않으면서도 한국어로 자연스럽게 했습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주인
  - 주
  rationale: 부활 서사에서 κύριος는 예수에 대한 칭호로 기능하므로, 한국어 독자에게도 그 신학적 무게가 드러나는 ‘주님’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: 마지막 절의 관계
  chosen_reading: ‘그리고 주님이 자기에게 이런 일들을 말씀하셨다고 전했습니다’로 마리아의 보고에 포함
  alternative_readings:
  - ‘그리고 주님이 자기에게 이런 일들을 말씀하셨습니다’라는 별도 서술
  - 마지막 절을 나레이터 주석으로 분리
  rationale: 원문에는 두 번째 ὅτι가 없으므로, 마지막 절을 마리아의 전언 내용으로 계속 읽는 해석을 살리되 한국어에서는 ‘전했습니다’로 구분을 분명히 했습니다.
  doctrine_reference: 문법-담화 관찰
- issue: 직접화법 도입
  chosen_reading: 「나는 주님을 보았습니다」
  alternative_readings:
  - “나는 주님을 보았습니다”
  - 나는 주님을 보았습니다
  rationale: 원문 ὅτι가 내용절을 이끌지만, 한국어에서는 인용부호로 직접화법을 표시하는 편이 문장의 흐름과 보고 구조를 가장 잘 드러냅니다.
  doctrine_reference: 번역 관습
