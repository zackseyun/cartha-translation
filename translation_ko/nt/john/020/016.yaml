id: JHN.20.16
reference: John 20:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
  footnotes:
  - marker: a
    text: Or “in Aramaic.” John’s “in Hebrew” can refer more broadly to the Semitic speech of Judea.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그녀에게 말씀하셨습니다. “마리아.” 그 여인은 돌아서서 그분께 히브리어로 “랍보니!” 하고 말했습니다. (이는 “선생님”이라는 뜻입니다.)[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아람어로”. 요한의 ‘히브리어로’는 유대 지역의 셈어 구어를 더 넓게 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  english_pob_choice: says
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말합니다
  - 말하셨습니다
  lexicon: BDAG
  rationale: 요한복음의 생생한 현재형 효과를 살리면서도, 한국어에서는 서술의 자연스러움을 위해 공손한 서술형으로 옮겼습니다.
- source_word: Μαριάμ
  english_pob_choice: Mary
  chosen_korean: 마리아
  alternatives_korean:
  - 마리암
  lexicon: BDAG
  rationale: 이름은 한국어에서 널리 통용되는 형태인 ‘마리아’를 사용했습니다.
- source_word: Ἑβραϊστί
  english_pob_choice: in Hebrew
  chosen_korean: 히브리어로
  alternatives_korean:
  - 아람어로
  - 히브리 말로
  lexicon: BDAG
  rationale: 본문의 표면 의미를 따라 ‘히브리어로’라고 옮기고, 주해 가능한 대안을 각주로 보완했습니다.
- source_word: Ραββουνι
  english_pob_choice: Rabboni
  chosen_korean: 랍보니
  alternatives_korean:
  - 나의 선생님
  - 나의 주인
  lexicon: BDAG
  rationale: 즉시 뒤따르는 설명구가 있으므로 음역을 유지해 호칭의 정서와 문화적 뉘앙스를 보존했습니다.
- source_word: ὃ λέγεται Διδάσκαλε
  english_pob_choice: which means, “Teacher”
  chosen_korean: 이는 “선생님”이라는 뜻입니다
  alternatives_korean:
  - 이는 “스승”이라는 뜻입니다
  - 이는 “교사”라는 뜻입니다
  lexicon: BDAG
  rationale: Διδάσκαλε의 기본 호칭 의미를 한국어에서 가장 자연스럽고 과장되지 않게 ‘선생님’으로 옮겼습니다.
theological_decisions:
- issue: Ἑβραϊστί의 의미 범위
  chosen_reading: 본문에는 ‘히브리어로’로 두되, 요한의 용법이 유대 지역의 셈어 구어를 넓게 가리킬 수 있다는 점을 각주로 열어 둡니다.
  alternative_readings:
  - 아람어로
  - 히브리 말로
  rationale: 원문 그리스어의 직접 표현을 본문에서 보존하면서, 학문적 해석 가능성을 숨기지 않고 독자가 확인할 수 있게 했습니다.
  doctrine_reference: 번역 원칙 §1, §3
