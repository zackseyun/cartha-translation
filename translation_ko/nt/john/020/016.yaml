review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the core clauses: Jesus addresses Mary by name, she turns and answers him in ‘Hebrew,’ and ‘Rabboni’ is glossed as ‘Teacher.’ The aorist participle στραφεῖσα is suitably conveyed by ‘돌아서서.’ The present-tense narrative verbs may be rendered naturally with Korean past narration. The demonstrative ἐκείνη does not require an unnaturally emphatic rendering such as ‘그 여인.’'
  naturalness: ‘그 여인은’ is possible but slightly stilted and distancing in this immediate exchange. ‘그녀는’ is more natural in modern formal Korean while retaining the referent. Placing the explanatory footnote marker immediately after ‘히브리어로’ makes its scope unambiguous rather than appearing to qualify the final parenthetical gloss.
  terminology: ‘마리아,’ ‘히브리어로,’ ‘랍보니,’ and ‘선생님’ are appropriate. ‘예수께’ is clearer and more direct than the reverential pronoun ‘그분께’ in this compact narrative, without altering register or meaning.
  issues:
  - severity: low
    issue: The footnote marker is placed after the parenthetical gloss rather than directly after ‘히브리어로.’
    rationale: The note concerns Ἑβραϊστί (‘in Hebrew’), not the meaning of ‘Rabboni.’ Moving the marker to its source term provides a clear footnote anchor.
  - severity: low
    issue: ‘그 여인은’ is more marked and less natural than needed for ἐκείνη in this context.
    rationale: The Greek demonstrative identifies Mary as the subject but does not require Korean wording that sounds distancing. ‘그녀는’ is idiomatic and source-faithful.
  revised_text: 예수께서 그녀에게 말씀하셨습니다. “마리아.” 그녀는 돌아서서 예수께 히브리어로[a] “랍보니!”라고 말했습니다. (이는 “선생님”이라는 뜻입니다.)
