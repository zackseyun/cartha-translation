id: JHN.20.23
reference: John 20:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἄν τινων ἀφῆτε τὰς ἁμαρτίας ⸀ἀφέωνται αὐτοῖς· ἄν τινων κρατῆτε κεκράτηνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'If you forgive anyone's sins, they are forgiven; if you retain them, they are retained.' The Greek uses perfect passives in both clauses, which may emphasize a completed action with continuing result.
    reason: lexical_alternative
  - marker: b
    text: Or 'they have been forgiven them'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희가 누구의 죄든지 용서하면, 그 죄는 그들에게 용서된 것입니다. 너희가 그대로 두면, 그대로 남아 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄν τινων
  english_pob_choice: If ... of any
  chosen_korean: 누구의 죄든지
  alternatives_korean:
  - 아무의 죄든지
  - 어떤 사람의 죄든지
  lexicon: BDAG
  rationale: 조건문과 불특정 대상을 함께 살리기 위해, 한국어에서는 자연스럽게 들리면서도 범위를 열어 두는 「누구의 죄든지」로 옮겼습니다.
- source_word: ἀφῆτε
  english_pob_choice: you forgive
  chosen_korean: 용서하면
  alternatives_korean:
  - 사해주면
  - 용서하시면
  - 놓아주면
  lexicon: BDAG
  rationale: 죄의 맥락에서 ἀφίημι는 ‘용서하다’가 가장 직접적이며, 현대 한국어에서도 의미가 분명합니다.
- source_word: ἀφέωνται
  english_pob_choice: they have been forgiven
  chosen_korean: 용서된 것입니다
  alternatives_korean:
  - 용서받은 것입니다
  - 용서되어 있습니다
  - 용서되었습니다
  lexicon: BDAG
  rationale: 완료 수동의 결과 상태를 살리되, 한국어에서는 ‘~된 것입니다’가 완료성과 현재의 결과를 함께 가장 자연스럽게 드러냅니다.
- source_word: κρατῆτε / κεκράτηνται
  english_pob_choice: you retain / they have been retained
  chosen_korean: 그대로 두면, 그대로 남아 있습니다
  alternatives_korean:
  - 붙들면, 붙들려 있습니다
  - 붙잡아 두면, 붙잡혀 있습니다
  - 보류하면, 보류되어 있습니다
  lexicon: BDAG
  rationale: κρατέω는 여기서 죄를 ‘붙들다’보다 ‘그대로 두다/남겨 두다’의 대비가 한국어에서 더 분명하게 죄 사함과 대조를 이룹니다. 완료 수동은 ‘그대로 남아 있습니다’로 결과 상태를 살렸습니다.
theological_decisions:
- issue: 제자들의 행위가 독립적으로 죄를 사하는 권한인지, 아니면 하나님의 용서 현실을 선포·확인하는 것인지
  chosen_reading: 원문의 수동태와 완료상을 그대로 살려, 주체를 명시하지 않고 「용서된 것입니다」라고 번역했습니다.
  alternative_readings:
  - 하나님께서 용서하신 것입니다
  - 용서받게 됩니다
  rationale: 본문은 하나님을 명시하지 않으면서도 결과 상태를 강하게 말하므로, 교리적으로 결론을 미리 넣지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
