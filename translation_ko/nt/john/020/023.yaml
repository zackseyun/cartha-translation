revisions:
- from: 너희가 누구의 죄든지 용서하면, 그 죄는 그들에게 용서된 것입니다. 너희가 그대로 두면, 그대로 남아 있습니다.
  to: 너희가 어떤 사람들의 죄든지 용서하면, 그 죄는 그들에게 용서되어 있습니다. 너희가 어떤 사람들의 죄든지 그대로 남겨 두면, 그 죄는 그대로 남아 있습니다.
  rationale: 둘째 절에 ‘죄’를 명시하여 원문의 목적어와 완료 수동태의 병행을 회복했습니다. 또한 불특정 복수 대상을 ‘어떤 사람들의’로 옮겨 뒤의 ‘그들에게’와 자연스럽게 연결했습니다. 수동태의 주체를 하나님으로 명시하거나, 제자들의 행위와 신적 용서의 관계를 해석적으로 보충하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:52:06Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절은 ἄν+접속법의 불특정 조건, ‘죄를 용서하다,’ 그리고 완료 수동태의 결과 상태를 대체로 잘 반영합니다. 그러나 둘째 절의 ‘그대로 두면, 그대로 남아 있습니다’는 죄라는 목적어와 수동태의 대상이 생략되어, 무엇을 보류하는지 불분명합니다. κρατῆτε/κεκράτηνται의 대조와 병행을 드러내도록 ‘죄를 그대로 남겨 두면/그 죄는 그대로 남아 있습니다’로 명시하는 것이 안전합니다.
  naturalness: ‘누구의 죄든지’ 뒤에 ‘그들에게’가 오는 것은 단수 일반 표현과 복수 지시가 다소 어색합니다. ‘어떤 사람들의 죄든지’와 ‘그들에게’를 맞추면 자연스럽고 원문의 복수형 τινων 및 αὐτοῖς에도 더 가깝습니다. ‘그대로 남겨 두다/그대로 남아 있다’는 현대 표준어에서 이해 가능하며, 용서와의 대조도 유지합니다.
  terminology: ‘용서하다’는 ἀφίημι의 죄 문맥에 적절합니다. ‘용서되어 있습니다’는 ἀφέωνται의 완료 수동태가 나타내는 결과 상태를 자연스럽게 반영하고, 수동태의 행위자를 명시하지 않아 본문의 신학적 여지를 보존합니다. ‘그대로 남겨 두다’는 κρατέω의 ‘붙들어 두다, 보류하다’라는 뜻을 과도하게 해석하지 않고 전달합니다.
  issues:
  - severity: medium
    issue: 둘째 절에서 죄라는 목적어와 수동태의 대상이 불명확합니다.
    rationale: 원문은 첫 절과 병행하여 ‘누구의 죄들을 붙들어 두면, 그것들은 붙들려 있다’라고 말합니다. 초안의 ‘그대로 두면, 그대로 남아 있습니다’는 독자가 무엇이 남는지를 문맥으로 추정해야 하며, 병행 구조도 약해집니다.
  - severity: low
    issue: ‘누구의 죄든지’와 ‘그들에게’의 수 일치가 다소 어색합니다.
    rationale: 한국어의 일반적 단수 표현으로 가능하지만, 복수의 사람들을 가리키는 원문과 후행 ‘그들에게’에 맞추어 ‘어떤 사람들의 죄든지’로 하는 편이 더 매끄럽습니다.
  revised_text: 너희가 어떤 사람들의 죄든지 용서하면, 그 죄는 그들에게 용서되어 있습니다. 너희가 어떤 사람들의 죄든지 그대로 남겨 두면, 그 죄는 그대로 남아 있습니다.
