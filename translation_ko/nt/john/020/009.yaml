- from: 그들은 아직 성경을 이해하지 못했기 때문입니다. 곧 그가 죽은 자들 가운데서 일어나야 한다는 말씀입니다.[a]
  to: 이는 그들이 그가 죽은 자들 가운데서 일어나야 한다는 성경을 아직 이해하지 못했기 때문입니다.[a]
  rationale: The revision restores the single-sentence structure and makes the ὅτι clause the content of the disciples’ incomplete understanding of Scripture. It retains the active wording in the main text and gives the English audit trail’s passive alternative in clear Korean.
  reviewer_model: gpt-5.6-terra
