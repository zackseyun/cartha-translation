id: JHN.20.9
reference: John 20:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
  footnotes:
  - marker: a
    text: Or, 'that he had to be raised from the dead.' The Greek here uses an active verb, 'to rise.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 아직 성경을 이해하지 못했기 때문입니다. 곧 그가 죽은 자들 가운데서 일어나야 한다는 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 죽은 자들 가운데서 살아나야 한다.’ 헬라어 본문은 능동형 ‘일어나다’를 사용합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  english_pob_choice: not yet
  chosen_korean: 아직
  alternatives_korean:
  - 아직까지
  - 아직도
  lexicon: BDAG
  rationale: 시점상 이해가 아직 이루어지지 않았다는 뜻을 자연스럽게 살리며, 부정의 지속을 과장하지 않습니다.
- source_word: ᾔδεισαν
  english_pob_choice: understand
  chosen_korean: 이해하지 못했
  alternatives_korean:
  - 알지 못했
  - 깨닫지 못했
  lexicon: BDAG
  rationale: 단순한 지식 부재보다 성경의 의미를 파악하지 못한 상태를 드러내므로 ‘이해하다’가 가장 정확합니다.
- source_word: τὴν γραφὴν
  english_pob_choice: the Scripture
  chosen_korean: 성경
  alternatives_korean:
  - 그 성경 말씀
  - 성구
  lexicon: BDAG
  rationale: 그리스어 단수형의 권위 있는 성경 증언을 가리키므로, 한국어에서는 자연스럽게 ‘성경’으로 옮기되 특정 본문을 암시하는 주해는 덧붙이지 않았습니다.
- source_word: ἀναστῆναι
  english_pob_choice: to rise
  chosen_korean: 일어나야 한다
  alternatives_korean:
  - 다시 살아나야 한다
  - 부활해야 한다
  lexicon: BDAG
  rationale: 본문의 능동형을 따라 ‘일어나다’로 살렸고, POB의 주석처럼 수동형 ‘살아나야 한다’는 가능하지만 본문 형태를 우선하여 본문에는 넣지 않았습니다.
theological_decisions:
- issue: 부활 진술의 능동 표현 보존
  chosen_reading: 그가 죽은 자들 가운데서 일어나야 한다
  alternative_readings:
  - 그가 죽은 자들 가운데서 살아나야 한다
  rationale: 헬라어는 능동 부정사 ἀναστῆναι를 사용하므로, 본문은 능동적 표현을 유지하고 주석에서 수동적 독법을 열어 두는 편이 원문에 더 충실합니다.
  doctrine_reference: 원문 형태를 보존하고 신학적 조화는 본문 밖에서 다룹니다.
