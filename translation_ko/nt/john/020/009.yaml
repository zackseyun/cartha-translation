review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the temporal negation, explanatory γάρ, Scripture, divine necessity, and the active resurrection infinitive. However, its two-sentence division and the added predicate “말씀입니다” obscure the Greek syntax, in which the ὅτι clause specifies what they had not yet understood from/in Scripture.
  naturalness: The proposed revision is a single, natural modern formal-polite Korean sentence. It preserves the explanatory relationship without making the content clause into an independent assertion.
  terminology: “성경,” “죽은 자들 가운데서,” and “일어나야 한다” are appropriate. The footnote is revised because “살아나다” is not a clear Korean passive counterpart to “be raised”; “일으킴을 받아야 한다” explicitly conveys the alternative passive sense.
  issues:
  - severity: medium
    issue: The content clause is separated into a second sentence and recast as “곧 … 말씀입니다.”
    rationale: Greek ὅτι introduces the content of what the disciples did not yet understand regarding Scripture. The recasting adds an independent explanatory assertion and weakens the direct syntactic connection.
  - severity: medium
    issue: The footnote describes “살아나야 한다” as a passive alternative.
    rationale: “살아나다” is not an unambiguously passive Korean expression. A passive alternative should explicitly express being raised, while noting that the Greek verb itself is active.
  revised_text: 이는 그들이 그가 죽은 자들 가운데서 일어나야 한다는 성경을 아직 이해하지 못했기 때문입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘그가 죽은 자들 가운데서 일으킴을 받아야 한다.’ 본문의 그리스어 동사는 능동형으로, ‘일어나다’라는 뜻입니다.
    reason: alternative_reading
  revision_rationale: The revision restores the single-sentence structure and makes the ὅτι clause the content of the disciples’ incomplete understanding of Scripture. It retains the active wording in the main text and gives the English audit trail’s passive alternative in clear Korean.
