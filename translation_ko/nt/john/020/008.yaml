id: JHN.20.8
reference: John 20:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
  footnotes:
  - marker: a
    text: Or 'entered.'
    reason: lexical_alternative
  - marker: b
    text: The Greek simply says 'believed' without stating explicitly what he believed; interpreters differ on whether this means he believed the resurrection, believed the evidence before him, or believed the earlier report.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 먼저 무덤에 도착했던 다른 제자도 들어가서 보고 믿었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 단순히 ‘들어갔다’고만 하며, ‘들어갔다’와 같은 뉘앙스로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘믿었다’고만 할 뿐, 그가 무엇을 믿었는지는 분명히 밝히지 않습니다. 해석자들은 그가 부활을 믿은 것인지, 눈앞의 증거를 믿은 것인지, 또는 앞선 보고를 믿은 것인지 다르게 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  english_pob_choice: Then
  chosen_korean: 그러자
  alternatives_korean:
  - 그때
  - 그리하여
  lexicon: BDAG
  rationale: 이 접속부는 단순한 시간 순서와 약한 추론을 함께 나타내므로, 한국어에서는 서술 흐름을 자연스럽게 잇는 ‘그러자’가 가장 잘 맞습니다.
- source_word: εἰσῆλθεν
  english_pob_choice: went in
  chosen_korean: 들어가서
  alternatives_korean:
  - 들어갔습니다
  - 들어가
  lexicon: BDAG
  rationale: ‘went in/entered’의 동작성을 살리면서 현대 서술문에 자연스러운 동사형으로 옮겼습니다.
- source_word: ὁ ἄλλος μαθητὴς
  english_pob_choice: the other disciple
  chosen_korean: 다른 제자
  alternatives_korean:
  - 다른 학생
  - 다른 추종자
  lexicon: BDAG
  rationale: 요한복음의 고유한 표현인 μαθητής는 이 문맥에서 ‘제자’가 가장 정확하고 관용적입니다.
- source_word: ἐπίστευσεν
  english_pob_choice: believed
  chosen_korean: 믿었습니다
  alternatives_korean:
  - 믿게 되었습니다
  - 믿었습니다만
  lexicon: BDAG
  rationale: 헬라어는 믿음의 대상을 밝히지 않은 채 단순히 ‘믿었다’고만 말하므로, 한국어도 내용을 특정하지 않고 간결하게 살렸습니다.
theological_decisions:
- issue: 그가 무엇을 믿었는지
  chosen_reading: ‘믿었습니다’만 두고 믿음의 대상을 명시하지 않았습니다.
  alternative_readings:
  - 부활하셨다고 믿었습니다
  - 증거를 믿었습니다
  - 마리아의 보고를 믿었습니다
  rationale: 원문이 목적어를 생략해 해석의 여지를 남기므로, 번역이 그 긴장을 해소하지 않도록 했습니다. 바로 다음 절과의 관계도 이 여지를 유지하는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
