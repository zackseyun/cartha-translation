  source_fidelity: 본문은 대체로 원문에 충실합니다. ‘그러자’는 τότε οὖν의 서사적 진행과 약한 연결성을 자연스럽게 반영하고, ‘먼저 무덤에 도착했던 다른 제자도’는 ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον을 적절히 옮깁니다. 다만 ‘들어가서 보고 믿었습니다’는 세 동작의 병렬 관계를 다소 압축하므로, 문장을 나누어 εἰσῆλθεν, εἶδεν, ἐπίστευσεν의 순차성과 독립성을 더 분명히 하는 것이 좋습니다.
