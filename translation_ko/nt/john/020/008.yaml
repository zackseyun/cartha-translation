  terminology: ‘무덤’, ‘제자’, ‘믿었습니다’는 문맥과 요한복음의 관용에 적합합니다. 특히 ‘믿었습니다’는 믿음의 대상을 보충하지 않아 원문의 의도적인 모호성을 보존합니다.
