  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
  footnotes:
  - marker: a
    text: Or, less likely, 'Thomas answered and said, “My Lord and my God,”' as an exclamation; however, the Greek says he spoke 'to him,' supporting direct address to Jesus.
    reason: alternative_reading
translation:
  language: ko
  text: 도마가 대답하여 그에게 말했습니다. 「나의 주님, 나의 하나님!」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 ‘그에게 말했습니다’라고 하여 예수께 직접 말한 것으로 읽게 합니다. 따라서 본문은 감탄문보다 직접 고백을 우선합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  lexicon: BDAG
  rationale: 서술 흐름의 표준적 응답 동사를 살리면서, 뒤의 말하기 동사와 함께 자연스러운 한국어 구성을 이루게 했습니다.
- source_word: εἶπεν αὐτῷ
  english_pob_choice: said to him
  chosen_korean: 그에게 말했습니다
  alternatives_korean:
  - 그에게 말하였습니다
  - 그분에게 말했습니다
  lexicon: BDAG
  rationale: 헬라어의 여격 목적어를 그대로 살려 ‘그에게’로 옮겼고, 본문에 없는 ‘예수’를 덧붙이지 않았습니다.
- source_word: Ὁ κύριός μου
  english_pob_choice: My Lord
  chosen_korean: 나의 주님
  alternatives_korean:
  - 나의 주
  - 내 주님
  lexicon: BDAG
  rationale: κύριος는 본문과 프로젝트 기준상 ‘주님’이 가장 적절하며, 도마의 직접 고백이라는 문맥에서 존칭형 ‘나의 주님’이 자연스럽습니다.
- source_word: ὁ θεός μου
  english_pob_choice: my God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 나의 신
  lexicon: BDAG
  rationale: θεός는 통상적으로 ‘하나님’으로 옮기고, μου의 소유격을 ‘나의’로 유지해 개인적 고백의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 도마의 발언을 예수에게 직접 한 고백으로 유지할지, 단순 감탄문으로 약화할지
  chosen_reading: 예수께 직접 드린 고백으로 유지했습니다.
  alternative_readings:
  - 하나님을 향한 감탄적 외침으로 처리
  rationale: 본문이 ‘그에게 말했습니다’(αὐτῷ)라고 명시하므로, 도마의 말은 예수를 향한 직접 호칭으로 읽는 것이 가장 자연스럽고, 그리스도론적 긴장을 보존합니다.
  doctrine_reference: 요한복음 20:28, 니케아 신경(381), 칼케돈 신조(451)
