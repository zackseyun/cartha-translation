    rationale: πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν의 의도적인 명사 병행을 관계절로 바꾸어 흐립니다. 한국어에서는 ‘내 아버지, 곧 너희 아버지께, 내 하나님, 곧 너희 하나님께’가 문법적으로 자연스럽고 원문의 수사적 구조를 더 잘 보존합니다.
