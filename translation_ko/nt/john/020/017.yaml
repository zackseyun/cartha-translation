id: JHN.20.17
reference: John 20:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
  footnotes:
  - marker: a
    text: Or “Do not touch me” or “Do not hold on to me.” The Greek likely refers to clinging or continuing to hold him rather than merely making contact.
    reason: lexical_alternative
  - marker: b
    text: “Brothers” renders the masculine plural Greek term; here it refers to Jesus’ disciples and may include a broader representative group.
    reason: cultural_note
translation:
  language: ko
  text: 예수님께서 그녀에게 말씀하셨습니다. “나를 붙들지 마십시오. 내가 아직 아버지께 올라가지 않았기 때문입니다. 그러나 내 형제들에게 가서, ‘나는 내 아버지이시며 너희 아버지이신 분께, 내 하나님이시며 너희 하나님이신 분께 올라가고 있습니다’라고 말하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붙들지 마십시오’는 단순한 일회적 접촉 금지보다 계속 붙드는 행위를 멈추라는 뜻을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 남성 복수형을 옮긴 것으로, 여기서는 예수님의 제자들을 가리키며 더 넓은 대표 집단을 포함할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  english_pob_choice: Do not cling to me
  chosen_korean: 나를 붙들지 마십시오
  alternatives_korean:
  - 나를 만지지 마십시오
  - 나를 붙잡고 있지 마십시오
  lexicon: BDAG
  rationale: μή + 현재명령형은 진행 중인 행위를 멈추라는 뉘앙스가 있어, 단순한 접촉 금지보다 지속적으로 붙드는 의미를 살려 ‘붙들지 마십시오’로 옮겼습니다.
- source_word: ἀναβέβηκα
  english_pob_choice: I have not yet ascended
  chosen_korean: 아직 아버지께 올라가지 않았습니다
  alternatives_korean:
  - 아직 아버지께 올라가지 못했습니다
  - 아직 올라가지 않았습니다
  lexicon: BDAG
  rationale: 요한복음의 ἀναβαίνω는 아버지께로의 ‘올라감’이라는 신학적 함의를 지니므로, 단순 이동보다 ‘아버지께 올라가다’를 유지했습니다.
- source_word: τὸν πατέρα
  english_pob_choice: the Father
  chosen_korean: 아버지께
  alternatives_korean:
  - 그 아버지께
  - 내 아버지께
  lexicon: BDAG
  rationale: 첫 절에는 소유격 μου가 없으므로, 원문의 관사 표현을 살려 ‘아버지께’로 옮겼습니다. 이어지는 인용문에서만 ‘내 아버지’와 ‘너희 아버지’가 명시됩니다.
- source_word: ἀδελφούς μου
  english_pob_choice: my brothers
  chosen_korean: 내 형제들에게
  alternatives_korean:
  - 내 형제자매들에게
  - 내 동생들에게
  lexicon: BDAG
  rationale: 남성 복수형을 본문 그대로 살려 ‘형제들’로 옮겼고, 예수님의 제자들을 가리키는 대표적 남성 복수 표현이라는 점을 반영했습니다.
theological_decisions:
- issue: Μή μου ἅπτου의 의미
  chosen_reading: 예수님의 신체적 접촉 전면 금지가 아니라, 계속 붙드는 행위를 멈추라는 뜻으로 옮겼습니다.
  alternative_readings:
  - 나를 만지지 마십시오
  - 나를 붙잡지 마십시오
  rationale: 문법상 진행 중인 행위를 중단시키는 뉘앙스가 강하므로, 부활하신 예수님과의 접촉 자체를 절대 금지하는 의미로 좁히지 않았습니다.
  doctrine_reference: 번역 원칙 §1, §3
- issue: ‘내 하나님이시며 너희 하나님이신 분’의 직역
  chosen_reading: 예수님의 ‘내 하나님’ 표현을 그대로 살려, 문구의 신학적 무게를 약화시키지 않았습니다.
  alternative_readings:
  - 더 완화된 의역
  - 관계만 강조하는 표현
  rationale: 본문은 예수님의 독특한 아들 됨과 제자들의 관계를 나란히 제시하므로, 교리적으로 완화하지 않고 원문의 병행 구조를 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §4
