revisions:
- from: 예수님께서 그녀에게 말씀하셨습니다. “나를 붙들지 마십시오. 내가 아직 아버지께 올라가지 않았기 때문입니다. 그러나 내 형제들에게 가서, ‘나는 내 아버지이시며 너희 아버지이신 분께, 내 하나님이시며 너희 하나님이신 분께 올라가고 있습니다’라고 말하십시오.”[a][b]
  to: 예수님께서 그녀에게 말씀하셨습니다. “나를 붙들지 마십시오.[a] 내가 아직 아버지께 올라가지 않았기 때문입니다. 그러나 내 형제들에게[b] 가서 그들에게 이렇게 말하십시오. ‘나는 내 아버지, 곧 너희 아버지께, 내 하나님, 곧 너희 하나님께로 올라가고 있습니다.’”
  rationale: 원문의 첫 절에서 소유격 없는 ‘아버지’를 유지하고, ἅπτου의 지속적 행위 뉘앙스와 ‘형제들’의 형태를 보존했습니다. 직접 인용문은 ‘내/너희’의 관계를 나란히 세우는 원문의 병행을 한국어의 자연스러운 동격 표현인 ‘곧’으로 재현했으며, ‘께로’를 사용하여 πρὸς의 방향성을 분명히 했습니다. 각주 내용은 의미상 적절하므로 표지 위치만 সংশ정했습니다.
