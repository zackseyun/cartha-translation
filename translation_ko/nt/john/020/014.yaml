  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
  footnotes:
  - marker: a
    text: Or 'she did not recognize that it was Jesus.' The Greek says literally, 'she did not know that it is Jesus,' expressing lack of recognition of his identity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 말을 하고 나서, 그녀는 뒤로 돌아섰고 예수님이 서 계신 것을 보았습니다. 그러나 그녀는 그것이 예수님인 줄 알지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알지 못했습니다’는 직역에 가깝고, ‘알아보지 못했습니다’는 의미를 풀어 옮긴 해석입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰποῦσα
  english_pob_choice: after saying these things
  chosen_korean: 그런 말을 하고 나서
  alternatives_korean:
  - 이런 것들을 말하고 나서
  - 그 말을 한 뒤에
  lexicon: BDAG
  rationale: 복수 지시어 ταῦτα와 부가 분사 εἰποῦσα의 시간 관계를 자연스럽게 살려, 앞선 대화 내용을 가리키는 지시성과 선행 동작을 함께 드러냈습니다.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  english_pob_choice: she turned around
  chosen_korean: 뒤로 돌아섰고
  alternatives_korean:
  - 뒤로 몸을 돌렸고
  - 뒤를 돌아보았고
  lexicon: BDAG
  rationale: 관용구는 현대 한국어의 자연스러운 동작 표현으로 옮기되, 단순한 방향 전환이 아니라 뒤쪽을 향해 몸을 돌린 움직임을 유지했습니다.
- source_word: θεωρεῖ τὸν Ἰησοῦν ἑστῶτα
  english_pob_choice: saw Jesus standing there
  chosen_korean: 예수님이 서 계신 것을 보았습니다
  alternatives_korean:
  - 예수님이 서 있는 것을 보았습니다
  - 예수님을 서 계신 채로 보았습니다
  lexicon: BDAG
  rationale: 현재시제 θεωρεῖ는 서술 흐름에 맞게 과거로 옮기고, ἑστῶτα의 상태적 뉘앙스는 ‘서 계신’으로 살렸습니다.
- source_word: οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν
  english_pob_choice: she did not know that it was Jesus
  chosen_korean: 그것이 예수님인 줄 알지 못했습니다
  alternatives_korean:
  - 예수님이신 줄 알지 못했습니다
  - 그가 예수님이라는 것을 알지 못했습니다
  lexicon: BDAG
  rationale: οἶδα의 기본 의미를 따라 ‘알지 못했습니다’로 옮기고, 한국어에서 자연스러운 인식 부정 구문으로 신원 미확인을 표현했습니다.
theological_decisions:
- issue: 예수님의 신원 인식의 서술 방식
  chosen_reading: 그녀는 그것이 예수님인 줄 알지 못했습니다
  alternative_readings:
  - 그녀는 예수님을 알아보지 못했습니다
  rationale: 본문은 인식 실패의 결과를 말하지만 원인을 설명하지 않으므로, 해석을 더한 ‘알아보지 못하다’보다 신원에 대한 지식 부재를 직접적으로 드러냈습니다.
  doctrine_reference: 본문이 말하는 인식의 결핍을 유지하고, 원인 추정을 본문에 덧붙이지 않음
