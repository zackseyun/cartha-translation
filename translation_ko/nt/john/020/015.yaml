  source_fidelity: 그리스어의 두 질문, 마리아의 정원사라는 오인, 시신을 옮긴 장소를 묻고 자신이 가져가겠다는 미래 의도는 대체로 충실히 반영합니다. 다만 κύριε의 대안 번역 각주는 해당 호칭 바로 뒤에 붙여야 하며, 한국어의 ‘선생님’은 본래 ‘교사’라는 뜻도 강하여 문맥상 일반적인 정중 호칭임을 각주에서 더 분명히 해야 합니다.
  naturalness: 합쇼체는 일관됩니다. 그러나 서술에서 ‘그녀’가 연속되면 현대 한국어 성서 문체로는 다소 번역투이므로, 선행 문맥에서 이미 밝혀진 인물인 ‘마리아’를 사용하면 더 자연스럽고 명료합니다. ‘여인이여’는 다소 문어적이지만 원문의 호격과 장면의 엄숙한 문체를 보존하는 범위에서 허용됩니다.
  terminology: κύριε를 ‘선생님’으로 처리한 것은 마리아가 예수를 정원사로 여긴 문맥에서 ‘주님’이라는 신앙 고백적 번역을 피하려는 선택으로 가능하지만, 한국어에서 교사 의미로 오해될 수 있습니다. 따라서 ‘정중한 호칭’이라는 각주를 호칭에 직접 연결합니다. ‘옮겨 갔다면,’ ‘두었는지,’ ‘가져가겠습니다’는 각각 βαστάζω, τίθημι, αἴρω의 문맥상 의미를 무리 없이 반영합니다.
