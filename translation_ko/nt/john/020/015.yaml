id: JHN.20.15
reference: John 20:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
  footnotes:
  - marker: a
    text: 'Greek: ''Lord'' (κύριε); here likely used in the sense of a respectful ''Sir,'' since Mary thinks she is speaking to the gardener.'
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 마리아에게 말씀하셨습니다. 「여인이여, 왜 우십니까? 누구를 찾고 있습니까?」 마리아는 예수께서 정원사인 줄 알고 그에게 말했습니다. 「선생님[a], 만일 당신이 그를 옮겨 갔다면 어디에 두었는지 제게 말해 주십시오. 그러면 제가 그를 가져가겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 κύριε는 보통 ‘주님’으로 번역되지만, 여기서는 마리아가 예수님을 정원사로 여기고 있으므로 정중한 호칭, 곧 ‘선생님’ 또는 ‘Sir’라는 뜻으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  english_pob_choice: Woman
  chosen_korean: 여인이여
  alternatives_korean:
  - 여자여
  - 부인
  lexicon: BDAG
  rationale: 예수의 호격은 원문의 직접성을 살리되 한국어에서 무례하지 않게 옮겨야 하므로, 직역적이면서도 호격 느낌이 살아 있는 「여인이여」를 택했습니다.
- source_word: τί κλαίεις
  english_pob_choice: why are you weeping
  chosen_korean: 왜 우십니까
  alternatives_korean:
  - 왜 우세요
  - 왜 우느냐
  lexicon: BDAG
  rationale: κλαίω의 울음/통곡 뉘앙스를 살려 「우십니까」로 옮겼고, 합쇼체로 장면의 엄숙함을 유지했습니다.
- source_word: Κύριε
  english_pob_choice: Sir
  chosen_korean: 선생님
  alternatives_korean:
  - 주님
  - 나리
  - 여보세요
  lexicon: BDAG
  rationale: 마리아가 예수를 아직 정원사로 오인한 상황이므로, 경칭이지만 신앙고백적 의미를 띠지 않는 한국어 호칭으로 「선생님」을 선택했습니다. 이는 영어 POB의 'Sir'에 해당하는 상황적 존대입니다.
- source_word: ἐβάστασας αὐτόν / ποῦ ἔθηκας αὐτόν / κἀγὼ αὐτὸν ἀρῶ
  english_pob_choice: you carried him away / where you put him / and I will take him away
  chosen_korean: 그를 옮겨 갔다면 / 어디에 두었는지 / 제가 그를 가져가겠습니다
  alternatives_korean:
  - 그를 데려갔다면 / 어디에 놓았는지 / 제가 그를 옮기겠습니다
  - 그를 빼갔다면 / 어디에 두었는지 / 제가 그를 치우겠습니다
  lexicon: BDAG
  rationale: 몸을 옮긴다는 물리적 의미를 살려 ἐβάστασας는 「옮겨 갔다면」, τίθημι는 「두다」로 옮겼고, αἴρω는 시신을 다시 옮겨 모시겠다는 의도를 드러내는 「가져가겠습니다」로 자연스럽게 표현했습니다.
theological_decisions:
- issue: Κύριε의 번역이 예수에 대한 호칭인지, 오인된 정중한 호칭인지
  chosen_reading: 정중한 상황적 호칭으로 보고 「선생님」으로 번역했습니다.
  alternative_readings:
  - 주님
  - 주여
  rationale: 본문에서 마리아는 부활하신 예수를 아직 알아보지 못하고 정원사로 생각합니다. 따라서 κύριε를 신앙적 칭호가 아니라 예의상 부르는 말로 처리하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table (κύριος) 및 문맥 우선 원칙'
