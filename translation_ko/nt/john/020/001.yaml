base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: Now on the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
  footnotes:
  - marker: a
    text: Literally, 'on one of the Sabbaths,' an idiom meaning 'on the first day of the week.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 주의 첫날[a], 막달라 마리아가 아직 어두울 때에 무덤에 와서, 돌이 무덤에서 옮겨진 것을 봅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현은 문자적으로 ‘안식일들 중 하나’이지만, 관용적으로 ‘한 주의 첫날’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  english_pob_choice: Now on the first day of the week
  chosen_korean: 그리고 주간 첫날에
  alternatives_korean:
  - 그리고 안식일들 중 첫째 날에
  - 그리고 주의 첫날에
  lexicon: BDAG
  rationale: 헬라어 관용구를 직역하면 ‘안식일들 중 하나’이지만, 문맥상 ‘한 주의 첫날’ 의미이므로 자연스러운 현대 한국어로 옮겼습니다. δέ는 서술 전환을 나타내므로 ‘그리고’로 처리했습니다.
- source_word: Μαρία ἡ Μαγδαληνή
  english_pob_choice: Mary Magdalene
  chosen_korean: 막달라 마리아
  alternatives_korean:
  - 마리아 막달라인
  - 막달라 여자 마리아
  lexicon: BDAG
  rationale: 한국어 성경에서 널리 굳어진 인명 표현을 따르되, 지명형 별칭의 의미가 드러나도록 ‘막달라 마리아’로 옮겼습니다.
- source_word: σκοτίας ἔτι οὔσης
  english_pob_choice: while it was still dark
  chosen_korean: 아직 어두울 때
  alternatives_korean:
  - 여전히 어둠이 남아 있을 때
  - 아직 캄캄할 때
  lexicon: BDAG
  rationale: 분사구의 시간적 상황을 한국어 종속절로 자연스럽게 처리했습니다. ‘아직 어두울 때’가 간결하면서도 진행 중인 어둠의 상태를 보존합니다.
- source_word: τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου
  english_pob_choice: the stone having been taken away from the tomb
  chosen_korean: 돌이 무덤에서 옮겨진 것을
  alternatives_korean:
  - 돌이 무덤에서 치워진 것을
  - 돌이 무덤 밖으로 옮겨진 것을
  lexicon: BDAG
  rationale: 완료된 수동 상태를 드러내기 위해 ‘옮겨진 것’을 택했습니다. ‘치워진’도 가능하지만, ἠρμένον의 ‘들어 올려 옮기다’는 뉘앙스를 좀 더 직접적으로 반영합니다.
theological_decisions:
- issue: 역사적 현재의 보존
  chosen_reading: ἔρχεται와 βλέπει의 현재형을 한국어 현재 서술로 살렸습니다.
  alternative_readings:
  - 과거형으로 통일해 ‘왔다… 보았다’로 옮김
  rationale: 부활 아침 이야기의 생생한 서술 효과를 살리기 위한 선택입니다. 의미를 바꾸지 않으면서 원문의 현장감을 유지합니다.
  doctrine_reference: Translation philosophy §1, §6
