id: JHN.20.19
reference: John 20:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
  footnotes:
  - marker: a
    text: Or possibly “the Jewish leaders” or “the Judeans,” depending on how Ἰουδαῖοι is understood in context.
    reason: alternative_reading
  - marker: b
    text: Or “Peace be with you.” The Greek reads literally, “Peace to you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 주의 첫날인 그날 저녁에, 유대인들을[a] 두려워하여 제자들이 있던 곳의 문들은 잠겨 있었습니다. 예수께서 오셔서 그들 가운데에 서시고 그들에게 말씀하셨습니다. “여러분에게 평안이 있기를 바랍니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 문맥에 따라 “유대 지도자들” 또는 “유대 지방 사람들”로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “평안이 여러분과 함께 있기를 바랍니다.” 원문을 직역하면 “여러분에게 평안”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  english_pob_choice: So when it was evening
  chosen_korean: 그날 저녁,
  alternatives_korean:
  - 그날 저녁이 되자
  - 저녁 무렵에
  lexicon: BDAG
  rationale: 시간 배경을 자연스러운 한국어 문장 머리로 옮기되, 원문의 상황 설정을 간결하게 유지했습니다.
- source_word: τῇ μιᾷ σαββάτων
  english_pob_choice: the first day of the week
  chosen_korean: 곧 그 주의 첫날이었는데
  alternatives_korean:
  - 그 주의 첫째 날이었는데
  - 안식일 다음 첫날이었는데
  lexicon: BDAG
  rationale: 요한복음의 관용적 표현을 한국어로 분명하게 풀어, 독자가 요일 의미를 바로 이해하도록 했습니다.
- source_word: τῶν θυρῶν κεκλεισμένων
  english_pob_choice: the doors had been locked
  chosen_korean: 문들이 닫혀 있었습니다
  alternatives_korean:
  - 문들이 잠겨 있었습니다
  - 문들이 굳게 닫혀 있었습니다
  lexicon: BDAG
  rationale: 완료 수동 분사의 결과 상태를 살리면서도, 한국어에서 과도하게 구체적인 '잠겨'보다 중립적인 닫힌 상태를 기본으로 두었습니다.
- source_word: τῶν Ἰουδαίων
  english_pob_choice: the Jews
  chosen_korean: 유대 사람들을
  alternatives_korean:
  - 유대인들을
  - 유대 지도자들을
  lexicon: BDAG
  rationale: 원문 어휘를 그대로 반영하되, 한국어에서 민족적·종교적 집단을 가리키는 자연스러운 표현으로 옮겼습니다. 본문은 과도하게 '지도자들'로 좁히지 않았습니다.
- source_word: ἔστη εἰς τὸ μέσον
  english_pob_choice: stood in the midst of them
  chosen_korean: 그들 가운데 서시고
  alternatives_korean:
  - 그들 한가운데 서시고
  - 그들의 가운데에 서시고
  lexicon: BDAG
  rationale: 공간적 중심에 서시는 장면을 한국어 관용으로 자연스럽게 살렸습니다.
- source_word: Εἰρήνη ὑμῖν
  english_pob_choice: Peace to you
  chosen_korean: “평강이 너희에게.”
  alternatives_korean:
  - “평강이 너희에게.”
  - “너희에게 평강이 있기를.”
  lexicon: BDAG
  rationale: POB의 직역적 선택을 따라 평강을 유지했고, 원문의 간결한 인사형을 보존했습니다. 대화체이므로 제자들에게 주시는 직접 화법으로 옮겼습니다.
theological_decisions:
- issue: τῶν Ἰουδαίων의 범위
  chosen_reading: 본문에는 '유대 사람들'로 두고, 특정 지도층으로는 좁히지 않았습니다.
  alternative_readings:
  - 유대인들
  - 유대 지도자들
  rationale: 요한의 용례는 문맥에 따라 넓거나 좁게 읽힐 수 있으나, 원문 자체가 '지도자들'이라고 명시하지 않으므로 본문은 과도한 해석을 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: Εἰρήνη ὑμῖν의 화법
  chosen_reading: 직접 발화로 '평강이 너희에게'라고 옮겼습니다.
  alternative_readings:
  - 평강이 너희와 함께 있기를
  - 너희에게 평강이 있기를
  rationale: 원문의 짧은 축복/인사 공식을 보존하면서, 합쇼체 본문 속에서도 예수의 직접 발화를 자연스럽게 드러냈습니다.
  doctrine_reference: 'Source-priority: direct speech fidelity'
