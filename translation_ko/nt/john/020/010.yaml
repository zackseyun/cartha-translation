translation:
  language: ko
  text: 그래서 제자들은 자기들이 있던 곳으로 다시 돌아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기들에게로’ 또는 ‘자기들의 자리/곳으로’입니다. 이 표현은 여기서 단순한 재귀가 아니라, 그들이 머물던 곳으로 돌아갔다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  english_pob_choice: went away
  chosen_korean: 돌아갔습니다
  alternatives_korean:
  - 떠났습니다
  - 가 버렸습니다
  - 나갔습니다
  lexicon: BDAG
  rationale: 문맥상 무덤을 방문한 뒤 이전 머물던 곳으로 이동하는 의미이므로, 단순한 ‘떠남’보다 귀환의 방향을 드러내는 ‘돌아갔습니다’가 POB의 영어 해설과 잘 맞습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그래서
  alternatives_korean:
  - 그러므로
  - 그런즉
  - 그리하여
  lexicon: BDAG
  rationale: 서술의 연결을 나타내는 οὖν을 현대 한국어에서 자연스러운 인과·전개 연결어인 ‘그래서’로 옮겼습니다.
- source_word: πάλιν
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 거듭
  - 한번 더
  lexicon: BDAG
  rationale: πάλιν의 반복/재개 의미를 가장 सीधे하게 살리는 표현은 ‘다시’입니다.
- source_word: πρὸς αὑτούς
  english_pob_choice: to their own homes
  chosen_korean: 자기들이 있던 곳으로
  alternatives_korean:
  - 자기들에게로
  - 자기들 집으로
  - 자기들의 집으로
  lexicon: BDAG
  rationale: 이 관용구는 단순한 재귀 ‘자기들에게로’보다, POB 각주가 밝히듯 ‘자기들이 머물던 자리/곳’으로 돌아간다는 뜻이 핵심이므로 그 의미를 한국어 본문에 드러냈습니다.
theological_decisions:
- issue: πρὸς αὑτούς의 관용적 의미를 본문에 얼마나 명시할지
  chosen_reading: 본문에는 ‘자기들이 있던 곳’으로 옮기고, 그 이상의 세부는 각주 없이 본문 의미 안에만 담았습니다.
  alternative_readings:
  - ‘자기들에게로’
  - ‘자기들의 집으로’
  - ‘자기들의 처소로’
  rationale: 원문은 귀환의 방향을 말하지만 정확한 ‘집’ 여부는 문맥상 추정이므로, POB의 해설을 반영하되 과도하게 특정하지 않는 표현을 택했습니다.
  doctrine_reference: 문맥적 의미 보존과 과잉특정 회피
