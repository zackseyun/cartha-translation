revisions:
- from: 그러나 이들은 예수께서 메시아[a], 하나님의 아들이심을 여러분이 믿게 하려고, 또 믿으면서 그의 이름으로 생명을 얻게 하려고 기록되었습니다.
  to: 그러나 이것들은 여러분이 예수께서 메시아[b]이시며 하나님의 아들이심을 믿도록[a] 기록되어 있습니다. 또 여러분이 믿음으로써 그의 이름으로 생명을 얻게 하려고 기록되어 있습니다.
  rationale: 본문의 두 ἵνα 목적절을 병렬로 유지하고, 완료 수동 γέγραπται는 한국어에서 지속된 결과를 자연스럽게 나타내는 ‘기록되어 있습니다’로 옮겼습니다. 첫 믿음 절에는 현재형/부정과거형 본문 변이를 보존하는 주석을 연결했으며, 둘째 절의 πιστεύοντες는 수단을 나타내는 ‘믿음으로써’로 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:52:05Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 핵심 내용과 목적 구조를 대체로 반영하지만, SBLGNT의 πιστεύητε(현재 접속법)와 잘 알려진 부정과거 변이에 관한 주석이 본문에서 빠져 있습니다. 또한 ‘믿으면서’는 πιστεύοντες의 수단적 관계를 충분히 드러내지 못하므로 ‘믿음으로써’가 더 정확합니다.
  naturalness: ‘이들은’은 앞서 언급된 표적과 기록 내용을 가리키는 데 다소 부자연스러우므로 ‘이것들은’이 적절합니다. ‘메시아이시며 하나님의 아들이심’ 및 ‘믿음으로써’는 현대 표준어 합쇼체 문맥에서 자연스럽고 명료합니다.
  terminology: ‘메시아’와 ‘하나님의 아들’은 적절합니다. Χριστός의 대안인 ‘그리스도’는 메시아에 붙은 주석으로 보존합니다. πιστεύητε의 본문 변이 주석은 해당 동사에 직접 연결해야 합니다.
  issues:
  - severity: medium
    issue: πιστεύητε의 본문 변이 및 상적 뉘앙스에 관한 주석이 누락되었습니다.
    rationale: SBLGNT 본문은 현재 접속법 πιστεύητε를 읽으며, 부정과거 접속법 πιστεύσητε를 읽는 중요한 변이가 있습니다. 영어 POB 감사 기록도 이 불확실성을 주석으로 보존하므로, 한국어도 ‘믿도록’에 앵커된 주석으로 이를 반영해야 합니다.
  - severity: low
    issue: ‘믿으면서’는 πιστεύοντες의 수단적 기능을 약화시킵니다.
    rationale: 문맥상 분사는 생명을 얻는 수단을 나타내므로 ‘믿음으로써’가 그 관계를 더 정확하고 자연스럽게 전달합니다.
  - severity: low
    issue: ‘이들은’은 비인칭 지시 대상에 다소 어색합니다.
    rationale: ταῦτα는 앞서 언급한 일들과 기록 내용을 가리키므로 ‘이것들은’이 한국어에서 더 자연스럽습니다.
  revised_text: 그러나 이것들은 여러분이 예수께서 메시아[b]이시며 하나님의 아들이심을 믿도록[a] 기록되어 있습니다. 또 여러분이 믿음으로써 그의 이름으로 생명을 얻게 하려고 기록되어 있습니다.
