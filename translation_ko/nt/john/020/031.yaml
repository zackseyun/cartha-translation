id: JHN.20.31
reference: John 20:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
  footnotes:
  - marker: a
    text: Some manuscripts read 'so that you may come to believe' (aorist), while others support 'so that you may continue believing' (present). The main text renders the clause broadly as 'so that you may believe.'
    reason: textual_variant
  - marker: b
    text: Or 'the Christ.' The Greek title Χριστός is rendered 'Messiah' here to preserve its meaning as a title.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이것들은 여러분이 예수께서 메시아[b]이시며 하나님의 아들이심을 믿도록[a] 기록되어 있습니다. 또 여러분이 믿음으로써 그의 이름으로 생명을 얻게 하려고 기록되어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘믿도록’에 해당하는 동사를 부정과거로 읽어 ‘믿게 되도록’의 뉘앙스를 보이며, 다른 사본들은 현재형을 지지하여 ‘계속 믿도록’의 뉘앙스를 보입니다. 본문은 이를 넓게 ‘믿도록’으로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그리스도’. 그리스어 Χριστός의 호칭적 의미를 살려 여기서는 ‘메시아’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  english_pob_choice: these
  chosen_korean: 이들은
  alternatives_korean:
  - 이것들은
  - 이러한 것들은
  lexicon: BDAG
  rationale: 앞선 표적과 기록들을 가리키므로, 한국어에서는 자연스럽고 문맥상 충분히 지시적인 ‘이들은’으로 옮겼습니다.
- source_word: γέγραπται
  english_pob_choice: have been written
  chosen_korean: 기록되었습니다
  alternatives_korean:
  - 써졌습니다
  - 기록되어 있습니다
  lexicon: BDAG
  rationale: 완료된 기록 행위와 그 결과를 함께 드러내기 위해 수동 완료의 의미를 살려 ‘기록되었습니다’로 옮겼습니다.
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: BDAG
  rationale: Χριστός는 호칭적 용법이므로 의미를 살려 ‘메시아’로 번역했으며, 전통적 음역인 ‘그리스도’는 보조 대안으로 남겼습니다.
- source_word: πιστεύητε / πιστεύοντες
  english_pob_choice: you may believe / by believing
  chosen_korean: 믿게 하려고 / 믿으면서
  alternatives_korean:
  - 믿도록 / 믿음으로써
  - 믿게 되고 / 믿으므로
  lexicon: BDAG
  rationale: 첫 절의 πιστεύητε는 텍스트 변이와 상을 과도하게 결정하지 않기 위해 넓게 ‘믿게 하려고’로, 뒤의 분사 πιστεύοντες는 행위의 수단·동반 상황을 살려 ‘믿으면서’로 옮겼습니다.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  english_pob_choice: in his name
  chosen_korean: 그의 이름으로
  alternatives_korean:
  - 그 이름 안에서
  - 그 이름에 의하여
  lexicon: BDAG
  rationale: 관용구를 한국어 성경 문체에 맞게 자연스럽게 살리되, 인격과 권위에 근거한 표현이라는 의미를 유지했습니다.
theological_decisions:
- issue: Χριστός의 호칭 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 절에서는 예수의 정체성을 드러내는 호칭이므로, 음역보다 의미 번역을 택해 유대적·구약적 메시아 이해를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names; Contested terms table for Χριστός'
- issue: πιστεύητε의 상과 본문 변이
  chosen_reading: 믿게 하려고
  alternative_readings:
  - 믿고 계속하려고
  - 믿기 시작하도록
  rationale: 현재 본문과 잘 알려진 변이 사이의 긴장을 한쪽으로 과도하게 해결하지 않기 위해, 단회적 시작과 지속 가능성을 모두 포괄할 수 있는 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
