id: JHN.20.3
reference: John 20:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πέτρος καὶ ὁ ἄλλος μαθητής, καὶ ἤρχοντο εἰς τὸ μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
  footnotes:
  - marker: a
    text: Or 'they went to the tomb.' The Greek imperfect verb can be rendered more simply, but 'they were going' preserves the ongoing action more explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 베드로와 다른 제자가 밖으로 나가 무덤으로 가고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν οὖν
  english_pob_choice: So ... went out
  chosen_korean: 그래서 ... 밖으로 나가
  alternatives_korean:
  - 그리하여 ... 나가
  - 그러므로 ... 나가
  lexicon: BDAG
  rationale: οὖν의 연결감을 살려 결과·전개를 자연스럽게 옮기고, ἐξῆλθεν은 단순한 출발 동작으로서 ‘밖으로 나가’가 가장 무난합니다.
- source_word: ὁ ἄλλος μαθητής
  english_pob_choice: the other disciple
  chosen_korean: 다른 제자
  alternatives_korean:
  - 그 다른 제자
  - 다른 학생
  lexicon: BDAG
  rationale: μαθητής는 복음서 문맥에서 일관되게 ‘제자’로 옮기는 것이 적절하며, ἄλλος는 베드로와 대비되는 ‘다른’이라는 뜻을 분명히 합니다.
- source_word: ἤρχοντο
  english_pob_choice: they were going
  chosen_korean: 가고 있었습니다
  alternatives_korean:
  - 가고 있었습니다만
  - 가고 있던 중이었습니다
  - 가고 있었습니다
  lexicon: BDAG
  rationale: 미완료시제의 진행성을 살려 단순 과거 ‘갔습니다’보다 진행형인 ‘가고 있었습니다’가 더 가깝습니다.
- source_word: εἰς τὸ μνημεῖον
  english_pob_choice: to the tomb
  chosen_korean: 무덤으로
  alternatives_korean:
  - 무덤 안으로
  - 무덤에
  - 묘지로
  lexicon: BDAG
  rationale: μνημεῖον은 여기서 예수의 매장 무덤을 가리키므로 ‘무덤’이 적절하고, 이동 방향은 한국어에서 ‘-로’가 자연스럽습니다.
