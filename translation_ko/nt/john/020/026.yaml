id: JHN.20.26
reference: John 20:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: ko
  text: 여드레가 지나서 제자들이 다시 안에 있었고 도마도 그들과 함께 있었습니다. 문들이 닫혀 있었는데도 예수님께서 오셔서 가운데 서시고 말씀하셨습니다. “평강이 너희에게 있기를.”
  philosophy: formal
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτὼ
  english_pob_choice: after eight days
  chosen_korean: 여드레가 지나서
  alternatives_korean:
  - 여덟 날 후에
  - 팔일 뒤에
  lexicon: ὀκτώ
  rationale: 관용적 시간 표현을 자연스럽게 살리되, 원문의 ‘여덟째 날’보다는 ‘여드레가 지나서’가 문맥상 더 직접적이고 현대 한국어에 자연스럽습니다.
- source_word: ἦσαν ἔσω
  english_pob_choice: were inside
  chosen_korean: 안에 있었고
  alternatives_korean:
  - 실내에 있었고
  - 집 안에 있었고
  lexicon: ἔσω
  rationale: 장소를 과장하지 않고 단순히 ‘안에’로 옮겨, 제자들이 모여 있던 내부 공간이라는 원문의 사실 진술을 유지했습니다.
- source_word: τῶν θυρῶν κεκλεισμένων
  english_pob_choice: though the doors had been shut
  chosen_korean: 문들이 닫혀 있었는데도
  alternatives_korean:
  - 문들이 잠겨 있었는데도
  - 문들이 닫힌 상태였는데도
  lexicon: κλείω
  rationale: 완료분사로 된 상태 표현을 한국어의 상태절로 옮겨, 닫힌 문이 계속 유지된 상황을 드러냈습니다. 잠김까지는 원문에 직접 없으므로 보류했습니다.
- source_word: Εἰρήνη ὑμῖν
  english_pob_choice: Peace to you
  chosen_korean: 평강이 너희에게 있기를
  alternatives_korean:
  - 평강이 너희에게
  - 너희에게 평강이 있기를
  lexicon: εἰρήνη
  rationale: εἰρήνη를 POB 기본어인 ‘평강’으로 유지하고, 인사/축복의 발화이므로 한국어에서 자연스러운 바람형으로 옮겼습니다.
theological_decisions:
- issue: 예수님의 동사 시제/상(comes)
  chosen_reading: 예수님께서 오셔서
  alternative_readings:
  - 예수님이 오십니다
  - 예수님께서 오셨습니다
  rationale: POB의 현재형 선택을 따라 장면의 생생한 서술감을 살리되, 한국어는 연속 동작을 나타내는 연결형으로 자연스럽게 처리했습니다.
  doctrine_reference: 서술적 현재의 현장감 전달
