review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. πρὸς τῷ μνημείῳ ἔξω는 마리아가 무덤의 외부에 있었음을 나타내므로 ‘무덤 밖에’가 더 직접적입니다. παρέκυψεν εἰς τὸ μνημεῖον은 몸을 숙이는 동작과 실제로 안을 보는 행위를 함께 나타내므로 ‘몸을 숙여 … 들여다보았습니다’가 충실합니다.
  naturalness: ‘밖에서 무덤 곁에’는 위치 표현이 중복되어 다소 어색합니다. ‘무덤 밖에 서서’와 ‘그러던 중’은 현대 표준 한국어 합쇼체 서술에서 자연스럽습니다.
  terminology: ‘마리아’, ‘무덤’, ‘울고 있었습니다’는 적절합니다. 신학 용어 또는 고유명사상의 추가 수정은 필요하지 않습니다.
  issues:
  - severity: medium
    issue: ‘밖에서 무덤 곁에’의 위치 표현
    rationale: 원문은 무덤의 바깥에 있는 위치를 말합니다. ‘곁에’는 단순 인접을 강조하여 ‘밖에’라는 공간적 대조를 약화시키며, ‘밖에서’와 함께 쓰면 한국어에서도 중복적입니다.
  - severity: medium
    issue: ‘그러다가’와 ‘들여다보려고’
    rationale: ‘그러다가’는 어떤 행동이 진행 중 다른 일이 발생한 듯한 뉘앙스를 줄 수 있으며, ‘들여다보려고’는 의도에만 초점을 둡니다. 원문은 울고 있는 중에 몸을 숙여 실제로 무덤 안을 들여다본 행위를 서술합니다.
  revised_text: 그러나 마리아는 무덤 밖에 서서 울고 있었습니다. 그러던 중에도 울면서 몸을 숙여 무덤 안을 들여다보았습니다.
