- from: 마리아는 밖에서 무덤 곁에 서서 울고 있었습니다. 그러다가 계속 울면서 무덤 안을 들여다보려고 몸을 굽혔습니다.
  to: 그러나 마리아는 무덤 밖에 서서 울고 있었습니다. 그러던 중에도 울면서 몸을 숙여 무덤 안을 들여다보았습니다.
  rationale: 무덤 외부라는 위치를 ‘무덤 밖에’로 명료하게 옮기고, 몸을 숙여 안을 들여다보는 완료된 동작을 직접 표현했습니다. δέ의 완만한 전환은 ‘그러나’로, ὡς οὖν의 서사적 연결은 ‘그러던 중에도’로 자연스럽게 반영했습니다.
