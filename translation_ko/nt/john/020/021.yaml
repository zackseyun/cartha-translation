base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
  footnotes:
  - marker: a
    text: Or, more traditionally, “Peace be with you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 예수께서 다시 그들에게 말씀하셨습니다. 「평안이 너희에게 있기를」[a] 아버지께서 나를 보내신 것 같이 나도 너희를 보냅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘너희에게 평안’이라는 짧은 인사말입니다. 전통적으로는 ‘너희에게 평강이 있을지어다’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν οὖν
  english_pob_choice: So Jesus said
  chosen_korean: 예수께서 다시 그들에게 말씀하셨습니다
  alternatives_korean:
  - 그때 예수께서 그들에게 말씀하셨습니다
  - 그러므로 예수께서 그들에게 말씀하셨습니다
  lexicon: SBLGNT; BDAG
  rationale: οὖν의 이어짐과 πάλιν의 반복을 함께 반영해, 앞선 장면에 이어 예수의 인사가 다시 주어졌음을 자연스럽게 드러냈습니다.
- source_word: Εἰρήνη ὑμῖν
  english_pob_choice: Peace to you
  chosen_korean: 평안이 너희에게 있기를
  alternatives_korean:
  - 평안이 너희에게 있습니다
  - 너희에게 평안이 있기를
  lexicon: BDAG
  rationale: 직역형의 간결한 인사말을 살리면서도 한국어에서 자연스러운 축원형으로 옮겼습니다. 전통적 ‘너희에게 평강이 있을지어다’보다 현대 표준어의 직접성을 우선했습니다.
- source_word: ἀπέσταλκέν
  english_pob_choice: has sent
  chosen_korean: 보내신 것 같이
  alternatives_korean:
  - 보내셨듯이
  - 보내신 대로
  lexicon: BDAG
  rationale: 완료 시제가 지닌 ‘보냄이 이미 이루어져 그 결과가 지속됨’의 뉘앙스를 한국어에서 가장 무리 없이 반영하기 위해 ‘보내신 것 같이’로 처리했습니다.
- source_word: πέμπω ὑμᾶς
  english_pob_choice: I am sending you
  chosen_korean: 나도 너희를 보냅니다
  alternatives_korean:
  - 나도 너희를 보내고 있습니다
  - 나도 너희를 보내겠습니다
  lexicon: BDAG
  rationale: 현재형의 파견 행위를 문맥에 맞게 현재적 선언으로 옮겼습니다. ‘보냅니다’가 가장 간결하고 공적 장면에 어울립니다.
theological_decisions:
- issue: 아버지의 보내심과 예수의 보내심의 관계
  chosen_reading: ‘아버지께서 나를 보내신 것 같이 나도 너희를 보냅니다’로 옮겨, 사명의 유비를 분명히 하되 그 이상의 동일성이나 직분론을 덧붙이지 않았습니다.
  alternative_readings:
  - 아버지께서 나를 보내신 것처럼 나도 너희를 보냅니다
  - 아버지께서 나를 보내셨듯이 나도 너희를 보냅니다
  rationale: 본문은 제자들의 파송을 예수의 파송에 비추어 설명하지만, 번역이 그 관계를 과도하게 신학적으로 확장할 필요는 없습니다. 유비는 유지하고 해석은 열어 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
