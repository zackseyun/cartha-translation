    reason: lexical_alternative
lexical_decisions:
- source_word: σουδάριον
  english_pob_choice: face cloth
  chosen_korean: 수건
  alternatives_korean:
  - 얼굴수건
  - 머리수건
  - 얼굴천
  lexicon: BDAG
  rationale: 시신의 머리/얼굴과 관련된 천을 가리키므로, 한국어로는 지나치게 전문적인 ‘장례포’보다 기능이 드러나는 ‘수건’이 자연스럽습니다. 앞의 문맥인 ‘머리에 있던’이 의미를 보완합니다.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  english_pob_choice: on his head
  chosen_korean: 머리에 있던
  alternatives_korean:
  - 머리 위에 있던
  - 머리에 놓여 있던
  lexicon: BDAG
  rationale: 그리스어의 위치 표현을 자연스럽게 옮기되, 정확한 덮임 방식은 과도하게 특정하지 않도록 했습니다.
- source_word: ὀθονίων
  english_pob_choice: linen cloths
  chosen_korean: 아마포들
  alternatives_korean:
  - 아마 천들
  - 세마포들
  - 린넨 천들
  lexicon: BDAG
  rationale: 무덤의 아마포/세마포 계열을 가리키는 복수형이므로, 본문 내 장례용 천들과의 연결을 살리기 위해 ‘아마포들’로 옮겼습니다.
- source_word: ἐντετυλιγμένον
  english_pob_choice: folded up
  chosen_korean: 잘 접혀 있었습니다
  alternatives_korean:
  - 둘둘 말려 있었습니다
  - 감겨 있었습니다
  - 접혀 있었습니다
  lexicon: BDAG
  rationale: 완료 수동 분사로서 정돈된 상태를 나타내므로, ‘잘’과 함께 ‘접혀 있었습니다’로 옮겨 질서 있게 놓인 상태를 드러냈습니다. POB의 ‘folded up’에 해당하는 대안적 뉘앙스는 본문 해석을 과잉하지 않는 범위에서 반영했습니다.
theological_decisions:
- issue: 수건의 정돈된 배치가 암시하는 의미를 본문에 얼마나 반영할지
  chosen_reading: 본문은 관찰 가능한 배열을 묘사하는 데 머물게 하고, 부활의 상징이나 논증을 본문 속에 덧붙이지 않았습니다.
  alternative_readings:
  - 정돈된 배치 자체를 부활의 표지로 해석함
  - 시신 도난이 아니라는 논증을 암시함
  rationale: 헬라어는 위치와 상태를 설명할 뿐, 상징적 의미를 직접 말하지 않으므로 서술적 톤을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; do not import doctrinal claims the text does not make.'
