  source_fidelity: ‘잘 접혀’의 ‘잘’은 ἐντετυλιγμένον이 직접 말하지 않는 정돈성 또는 의도성을 더합니다. 이 완료 수동분사는 수건이 감기거나 말린 상태였음을 나타내므로, 한국어 본문은 그 상태를 중립적으로 표현하는 편이 더 충실합니다. 또한 αὐτοῦ를 ‘그의’로 드러내는 것이 안전합니다.
  naturalness: ‘그의 머리에 있던 수건’과 ‘아마포들과 함께 놓여 있지 않고, 따로 한 곳에 감겨 있었습니다’는 현대 표준 한국어의 합쇼체 서술로 자연스럽습니다. ‘아마포들’은 문맥상 복수의 장례용 천을 나타내기에 적절합니다.
