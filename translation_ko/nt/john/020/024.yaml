id: JHN.20.24
reference: John 20:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Now Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
  footnotes:
  - marker: a
    text: 'Greek: ''Didymus.'' The name means ''Twin.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 도마는 열두 제자 가운데 한 사람으로, ‘쌍둥이’라고 불렸는데, 예수님께서 오셨을 때 그들과 함께 있지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θωμᾶς
  english_pob_choice: Thomas
  chosen_korean: 도마
  alternatives_korean:
  - 토마스
  lexicon: 고유명사 관용 표기
  rationale: 신약에서 널리 정착된 한국어 표기를 따라 ‘도마’로 옮겼습니다.
- source_word: εἷς ἐκ τῶν δώδεκα
  english_pob_choice: one of the Twelve
  chosen_korean: 열두 제자 가운데 하나로서
  alternatives_korean:
  - 열둘 가운데 하나로서
  - 열두 사람 가운데 하나로서
  lexicon: BDAG
  rationale: ‘the Twelve’는 단순 수사가 아니라 사도 집단을 가리키는 관용적 명칭이므로, 한국어로도 그 집단성을 드러내어 옮겼습니다.
- source_word: ὁ λεγόμενος Δίδυμος
  english_pob_choice: the one called Didymus / Twin
  chosen_korean: ‘쌍둥이’라고 불리는
  alternatives_korean:
  - 디두모라고 불리는
  - 디디무스라고 불리는
  lexicon: BDAG
  rationale: Δίδυμος는 의미를 가진 별칭이므로 전통 음역보다 뜻을 드러내는 ‘쌍둥이’가 원문 투명성을 더 잘 살립니다.
- source_word: μετ’ αὐτῶν
  english_pob_choice: with them
  chosen_korean: 그들과 함께
  alternatives_korean:
  - 그들 가운데
  - 그들과
  lexicon: BDAG
  rationale: μετά + 속격의 동반 관계를 자연스러운 한국어로 풀어 ‘함께’로 옮겼습니다.
theological_decisions:
- issue: Δίδυμος의 처리
  chosen_reading: 의미 번역을 따라 ‘쌍둥이’라고 옮기고 음역은 쓰지 않았습니다.
  alternative_readings:
  - 디두모
  - 디디무스
  rationale: 이 표현은 신학적 쟁점이 아니라 설명적 별칭이므로, 독자가 즉시 뜻을 이해하도록 의미를 드러내는 쪽이 적절합니다.
  doctrine_reference: '번역 원칙: 원어 의미 우선, 별칭은 가능하면 의미를 보존'
