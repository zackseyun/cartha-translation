id: JHN.20.25
reference: John 20:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
  footnotes:
  - marker: a
    text: Or, “I will never believe.” The Greek uses an emphatic negation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다른 제자들이 그에게 「우리는 주님을 보았습니다」 하고 말하고 있었습니다. 그러나 그는 그들에게 말했습니다. 「내가 그의 손에 있는 못자국을 보지 않고, 내 손가락을 못자국에 넣어 보고, 내 손을 그의 옆구리에 넣어 보지 않으면, 나는 결코 믿지 않겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 결코 믿지 않겠습니다.” 헬라어는 강조된 부정을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον οὖν
  english_pob_choice: were telling / So
  chosen_korean: 그러자 ... 하고 말하고 있었습니다
  alternatives_korean:
  - 그래서 ... 말했습니다
  - 그러므로 ... 하고 있었습니다
  lexicon: BDAG
  rationale: ἔλεγον의 미완료상은 반복·진행의 뉘앙스를 가지므로, 단순 과거보다 ‘말하고 있었습니다’로 옮겨 진행성을 살렸습니다. οὖν은 문맥 연결을 자연스럽게 드러내는 ‘그러자’로 처리했습니다.
- source_word: κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 부활하신 예수를 가리키는 칭호이므로, 본문 맥락에 맞는 호칭형인 ‘주님’을 썼습니다. 이는 일반적 주인보다 더 분명하게 기독론적 호칭을 드러냅니다.
- source_word: τύπον τῶν ἥλων
  english_pob_choice: the mark of the nails
  chosen_korean: 못자국
  alternatives_korean:
  - 못의 흔적
  - 못의 자국
  lexicon: BDAG
  rationale: τύπος는 단순한 ‘표시’보다 상처로 남은 눈에 보이는 자국을 뜻하므로, 한국어로는 자연스럽고 구체적인 ‘못자국’이 가장 가까웠습니다.
- source_word: οὐ μὴ πιστεύσω
  english_pob_choice: I will certainly not believe
  chosen_korean: 나는 결코 믿지 않겠습니다
  alternatives_korean:
  - 나는 절대로 믿지 않겠습니다
  - 나는 결코 믿을 수 없습니다
  lexicon: BDAG
  rationale: οὐ μή의 강한 강조를 한국어의 ‘결코’로 살렸습니다. 단순한 미래 부정보다 강한 거절의 뜻을 유지하되, 영어의 ‘never’처럼 시간적으로 절대화하지는 않았습니다.
theological_decisions:
- issue: 도마의 거부를 나타내는 강한 부정의 어조
  chosen_reading: ‘나는 결코 믿지 않겠습니다’로 옮겨, 조건이 충족되기 전까지의 단호한 거절을 드러냈습니다.
  alternative_readings:
  - 나는 절대로 믿지 않겠습니다
  - 나는 결코 믿을 수 없습니다
  rationale: 본문은 도마의 신앙적 망설임을 완화하지 않고 강하게 드러냅니다. 한국어에서도 그 긴장을 보존하는 것이 본문의 수사적 힘을 살립니다.
  doctrine_reference: 본문의 긴장을 보존하는 번역 원칙
