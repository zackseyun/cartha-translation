id: JHN.20.20
reference: John 20:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: ko
  text: 그리고 이런 말씀을 하신 뒤에 그분은 자기의 손들과 옆구리를 그들에게 보여 주셨습니다. 그러자 제자들은 주님을 보고 기뻐했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ τοῦτο εἰπὼν
  english_pob_choice: after saying this
  chosen_korean: 이런 말씀을 하신 뒤에
  alternatives_korean:
  - 그렇게 말씀하신 후에
  - 이것을 말씀하신 뒤에
  lexicon: SBLGNT
  rationale: aorist participle와 지시대명사 τοῦτο의 선행 동작을 자연스러운 한국어 선행 시간 표현으로 옮겼습니다.
- source_word: ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν αὐτοῖς
  english_pob_choice: he showed them his hands and his side
  chosen_korean: 자기의 손들과 옆구리를 그들에게 보여 주셨습니다
  alternatives_korean:
  - 그의 손들과 옆구리를 그들에게 보이셨습니다
  - 손들과 옆구리를 보여 주셨습니다
  lexicon: BDAG
  rationale: 손들과 옆구리는 예수의 신원 표지이므로 소유를 분명히 했고, πλευρά는 문맥상 ‘옆구리’가 가장 직접적입니다.
- source_word: ἐχάρησαν οὖν
  english_pob_choice: Then the disciples rejoiced
  chosen_korean: 그러자 제자들은 … 기뻐했습니다
  alternatives_korean:
  - 그러므로 제자들은 … 기뻐했습니다
  - 그래서 제자들은 … 기뻐했습니다
  lexicon: BDAG
  rationale: οὖν의 결과적 흐름을 ‘그러자’로 살렸고, χαίρω의 강한 정서를 ‘기뻐했습니다’로 자연스럽게 옮겼습니다.
- source_word: τὸν κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 부활 현현 문맥에서 κύριος는 단순 호칭보다 그리스도론적 칭호이므로 한국어 관용을 따라 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: 부활하신 예수에 대한 κύριος의 의미
  chosen_reading: ‘주님’은 제자들의 인식과 예수의 신분을 함께 드러내는 그리스도론적 칭호로 유지했습니다.
  alternative_readings:
  - ‘선생님’으로 완화
  - 단순히 ‘주’로 번역
  rationale: 요한복음의 부활 장면에서는 κύριος가 예수의 주되심을 분명히 드러내므로, 예배적·신학적 무게를 약화시키지 않았습니다.
  doctrine_reference: 'John 20:28; DOCTRINE.md contested terms: κύριος → Lord'
