source:
  edition: SBLGNT
  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
  footnotes:
  - marker: a
    text: Greek has a historical present in both 'comes' and 'sees'; English renders the first as past for smoother narrative flow while retaining the second as present for vividness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 시몬 베드로도 그를 따라와서 무덤에 들어갔습니다. 그는 아마포 천들이 놓여 있는 것을 봅니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται οὖν
  english_pob_choice: Then ... came
  chosen_korean: 그러자 ...도 ...와서
  alternatives_korean:
  - 그때 ...도 ...왔습니다
  - 그러므로 ...도 ...왔습니다
  lexicon: BDAG
  rationale: οὖν의 전개 기능을 살려 앞 구절에서 이어지는 서술 흐름을 자연스럽게 드러내기 위해 ‘그러자’로 옮겼고, 역사적 현재의 서술 효과는 한국어에서 어색하지 않은 과거 서술로 처리했습니다.
- source_word: καὶ Σίμων Πέτρος
  english_pob_choice: Simon Peter also
  chosen_korean: 시몬 베드로도
  alternatives_korean:
  - 그리고 시몬 베드로
  - 시몬 베드로 또한
  lexicon: BDAG
  rationale: 여기서 καὶ는 단순 연결보다 ‘또한/도’의 덧붙임을 나타내므로, 다른 제자에 이어 베드로가 도착했다는 점을 살려 ‘도’로 표현했습니다.
- source_word: ὀθόνια
  english_pob_choice: the linen cloths
  chosen_korean: 아마포
  alternatives_korean:
  - 세마포
  - 린넨 천
  lexicon: BDAG
  rationale: 장례용 천을 가리키는 말이지만, 한국어 성경에서 널리 이해되는 재질·용도를 함께 살리는 표현으로 ‘아마포’를 택했습니다.
- source_word: κείμενα
  english_pob_choice: lying there
  chosen_korean: 놓여 있는
  alternatives_korean:
  - 누워 있는
  - 그대로 놓인
  lexicon: BDAG
  rationale: κείμενα는 물건이 자리를 잡고 놓여 있는 상태를 나타내므로, 단순한 상태 묘사와 장면의 정지감을 살려 ‘놓여 있는’으로 옮겼습니다.
