review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the narrative sequence, Peter's following the other disciple, entry into the tomb, and the cloths' position. However, ὀθόνια is plural and denotes cloths/wrappings, whereas bare ‘아마포’ can read merely as the linen material. The Greek historical present θεωρεῖ is also best represented by a Korean narrative present here, consistent with the audit trail's retention of ‘sees.’
  naturalness: ‘그를 따라와서’ and ‘무덤에 들어갔으며’ are understandable, but two finite sentences read more naturally in modern formal-polite Korean. ‘아마포 천들이 놓여 있는 것을’ is clear and idiomatic while retaining the plural referent.
  terminology: ‘시몬 베드로,’ ‘무덤,’ and ‘아마포’ are appropriate. Adding ‘천들’ makes the lexical sense of ὀθόνια explicit without imposing the more interpretive ‘장례용 천.’
  issues:
  - severity: medium
    issue: Plural ὀθόνια is rendered as bare singular/material noun ‘아마포.’
    rationale: The Greek refers to linen cloths/wrappings. ‘아마포 천들’ preserves both the material and plural referent more clearly.
  - severity: low
    issue: The historical present θεωρεῖ is flattened to past tense.
    rationale: Korean can naturally retain the vivid narrative present in the final clause (‘봅니다’), reflecting the source and the English POB audit choice.
  revised_text: 그러자 시몬 베드로도 그를 따라와서 무덤에 들어갔습니다. 그는 아마포 천들이 놓여 있는 것을 봅니다.
  revised_footnotes: []
  revision_rationale: The revision explicitly renders the plural linen cloths and retains the final historical present for narrative vividness. It otherwise preserves the draft's natural rendering of the connective, additive ‘도,’ following participle, and entry into the tomb.
