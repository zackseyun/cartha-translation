id: JHN.20.29
reference: John 20:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
  footnotes:
  - marker: a
    text: Or, 'Because you have seen me, you have believed.' The Greek can be read as either a question or a statement.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “네가 나를 보았기 때문에 믿었느냐? 보지 않고도 믿는 사람들은 복이 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘네가 나를 보았기 때문에 믿었다.’ 헬라어는 질문문이나 진술문으로 모두 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  english_pob_choice: Jesus said to him
  chosen_korean: 예수께서 그에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그에게 이르셨습니다
  - 예수께서 그에게 말씀하십니다
  lexicon: BDAG
  rationale: 서술의 자연스러운 흐름을 살려 한국어에서는 과거형으로 옮기고, αὐτῷ는 ‘그에게’로 분명히 유지했습니다.
- source_word: Ὅτι ἑώρακάς με πεπίστευκας
  english_pob_choice: Because you have seen me, you have believed?
  chosen_korean: 네가 나를 보았기 때문에 믿었느냐?
  alternatives_korean:
  - 네가 나를 보았기 때문에 믿었다.
  - 네가 나를 보았으므로 믿었느냐?
  lexicon: BDAG
  rationale: Ὅτι의 인과를 살려 ‘~때문에’로 옮기되, 영어 POB의 질문 읽기를 따라 반문형으로 처리해 본문이 가진 긴장감을 보존했습니다.
- source_word: μακάριοι
  english_pob_choice: Blessed
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 복되도다
  - 복됩니다
  lexicon: BDAG
  rationale: 예수의 선언적 복을 현대 한국어의 자연스러운 합쇼체로 옮기면서도, 단순 감정 상태가 아니라 하나님께서 주시는 복의 선언임을 유지했습니다.
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  english_pob_choice: those who have not seen and have believed
  chosen_korean: 보지 않고도 믿는 사람들은
  alternatives_korean:
  - 보지 못하고도 믿은 사람들은
  - 보지 않은 채 믿는 사람들은
  lexicon: BDAG
  rationale: 분사구를 한국어 관용에 맞게 현재적 일반화로 옮겨, ‘보지 않음’과 ‘믿음’의 대비를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 첫 절의 진술문/의문문 긴장
  chosen_reading: 본문은 질문으로 옮기고, 예수의 말이 토마스의 ‘보는 믿음’을 부드럽게 짚는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘네가 나를 보았기 때문에 믿었다.’라는 진술문
  - 중립적으로 해석해 쉼표 중심으로 처리
  rationale: 헬라어는 구두점이 없으므로 두 읽기가 가능하지만, 영어 POB의 주해 전통을 따라 질문형을 본문에 두어 해석상의 긴장을 유지했습니다.
  doctrine_reference: 해석상의 긴장 보존
- issue: 마카리오이의 복 선언
  chosen_reading: ‘복이 있습니다’로 옮겨 단순한 행복이 아니라 하나님의 복 주심을 나타냈습니다.
  alternative_readings:
  - 행복합니다
  - 복되도다
  rationale: 산상복과 유사한 선언 형식으로, 신학적 무게를 약화시키지 않으면서 현대 한국어로 자연스럽게 표현했습니다.
  doctrine_reference: 복 선언의 신학적 무게
