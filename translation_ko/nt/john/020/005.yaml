  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
  footnotes:
  - marker: a
    text: Or 'he sees the linen cloths lying'; the Greek participle may be taken closely with 'linen cloths' without explicitly supplying 'there.'
