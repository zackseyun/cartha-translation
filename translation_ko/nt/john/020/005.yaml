  source_fidelity: 개정이 필요합니다. βλέπει는 요한복음의 역사적 현재이므로 ‘보았지만’보다 현재형 ‘봅니다’로 옮기는 편이 원문에 더 충실합니다. 또한 τὰ ὀθόνια는 복수이므로 ‘아마포 천들’로 명시하는 것이 안전합니다. οὐ μέντοι의 대조는 별도 문장인 ‘그러나’로 자연스럽게 보존했습니다.
  naturalness: ‘몸을 굽혀 안을 들여다보니’는 무덤 입구에서의 동작을 자연스럽게 나타냅니다. 역사적 현재와 과거형 종결의 결합은 원문의 생동감과 완료된 행동의 대조를 반영하며, 현대 한국어 성경 문체에서도 수용 가능합니다.
