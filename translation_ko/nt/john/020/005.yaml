translation:
  language: ko
  text: 그가 몸을 굽혀 안을 들여다보니, 그곳에 놓여 있는 아마포 천들을 봅니다.[a] 그러나 들어가지는 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놓여 있는 아마포 천들을 봅니다’; 헬라어 분사는 ‘아마포 천들’과 밀접하게 연결될 수 있으며, ‘그곳에’는 명시하지 않을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  english_pob_choice: stooping to look in
  chosen_korean: 몸을 구부려 안을 들여다보니
  alternatives_korean:
  - 몸을 숙여 안을 보니
  - 구부려 들여다보니
  lexicon: BDAG
  rationale: 동작의 굽힘과 시선의 방향을 함께 살리기 위해 ‘몸을 구부려 안을 들여다보니’로 옮겼습니다.
- source_word: βλέπει
  english_pob_choice: he sees
  chosen_korean: 보았지만
  alternatives_korean:
  - 봅니다
  - 보니
  lexicon: BDAG
  rationale: 요한복음의 역사적 현재를 한국어에서 지나치게 어색하게 만들지 않으면서도 관찰의 순간성을 살리기 위해 ‘보았지만’으로 자연스럽게 처리했습니다.
- source_word: τὰ ὀθόνια
  english_pob_choice: the linen cloths
  chosen_korean: 아마포
  alternatives_korean:
  - 세마포
  - 아마포 천
  lexicon: BDAG
  rationale: 매장용 리넨 천을 가리키는 말로, 한국어 성경에서 널리 쓰이는 ‘아마포’가 가장 직접적입니다.
- source_word: οὐ μέντοι εἰσῆλθεν
  english_pob_choice: yet he did not enter
  chosen_korean: 들어가지는 않았습니다
  alternatives_korean:
  - 들어가지는 않았습니다
  - 들어가지는 못했습니다
  lexicon: BDAG
  rationale: μέντοι의 약한 대조를 ‘-지만’ 구조로 반영하면서, εἰσῆλθεν을 단순한 ‘들어가다’로 옮겨 과장된 해석을 피했습니다.
theological_decisions:
- issue: 무덤 안으로 들어가지 않음의 서술
  chosen_reading: 단순한 행동 묘사로 옮기고, 추측적 동기 해석은 넣지 않았습니다.
  alternative_readings:
  - 두려움 때문에 들어가지 않았다는 뉘앙스
  - 존중 때문에 기다렸다는 뉘앙스
  rationale: 본문은 하지 않은 행동만 말하며 이유를 밝히지 않으므로, 서술을 넘어선 심리 해석을 덧붙이지 않았습니다.
