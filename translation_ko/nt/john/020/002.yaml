id: JHN.20.2
reference: John 20:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
  footnotes:
  - marker: a
    text: 'Greek: ''the other disciple, whom Jesus loved.'' The verb here is from φιλέω, which can emphasize affection; alternatively, ''whom Jesus was fond of.'''
    reason: lexical_alternative
  - marker: b
    text: Mary says, 'we do not know,' preserving the Greek first person plural. Some readers understand this as including other women with her; the text itself does not explain the plural here.
    reason: alternative_reading
translation:
  language: ko
  text: 그녀는 달려가 시몬 베드로와 예수님께서 사랑하시던 다른 제자[a]에게 가서 그들에게 말합니다. “그들이 주님을 무덤에서 가져갔습니다. 우리는 그분을 어디에 두었는지 알지 못합니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘예수님께서 사랑하시던 다른 제자’라고 합니다. 여기의 동사는 φιλέω로서 애정의 뉘앙스를 강조할 수 있으며, ‘예수님께서 아끼시던’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘우리는 알지 못합니다’라고 하여 1인칭 복수를 유지합니다. 이 복수가 그와 함께 있던 다른 여성들을 포함하는지 본문은 설명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει / ἔρχεται
  english_pob_choice: runs / comes
  chosen_korean: 달려가 … 가서
  alternatives_korean:
  - 달려갑니다
  - 달려가 찾아갑니다
  lexicon: BDAG
  rationale: 두 역사적 현재를 한국어에서는 자연스러운 서술 흐름으로 살려 ‘달려가’와 ‘가서’로 옮겨, 장면의 즉시성을 유지했습니다.
- source_word: τὸν ἄλλον μαθητήν
  english_pob_choice: the other disciple
  chosen_korean: 다른 제자
  alternatives_korean:
  - 그 다른 제자
  - 또 한 제자
  lexicon: BDAG
  rationale: μαθητής는 요한복음에서 일관되게 ‘제자’로 옮기는 것이 가장 직접적이며, ἄλλον의 대비도 ‘다른’으로 보존했습니다.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  english_pob_choice: whom Jesus loved
  chosen_korean: 예수님께서 사랑하시던
  alternatives_korean:
  - 예수님께서 사랑하신
  - 예수님께서 아끼시던
  lexicon: BDAG
  rationale: φιλέω의 애정 뉘앙스를 살리되, 한국어에서는 관계절 안에서 ‘사랑하시던’이 자연스럽고 본문의 관용적 표지를 유지합니다.
- source_word: τὸν κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: BDAG
  rationale: 예수님을 가리키는 κύριος는 이 문맥에서 경칭적 칭호이므로 ‘주님’이 가장 적절합니다.
- source_word: ἐκ τοῦ μνημείου
  english_pob_choice: out of the tomb
  chosen_korean: 무덤에서 가져갔고
  alternatives_korean:
  - 무덤에서 꺼냈고
  - 무덤 밖으로 옮겼고
  lexicon: BDAG
  rationale: ἐκ의 출처 의미와 ‘take out’의 동작을 한국어에서 자연스럽게 풀어, ‘무덤에서 가져갔고’로 옮겼습니다.
- source_word: οὐκ οἴδαμεν
  english_pob_choice: we do not know
  chosen_korean: 우리는 … 알지 못합니다
  alternatives_korean:
  - 나는 … 알지 못합니다
  - 우리는 … 모릅니다
  lexicon: BDAG
  rationale: 그리스어 1인칭 복수를 그대로 살려 ‘우리는’으로 옮겨, 화자의 단수화나 조정 없이 본문 긴장을 보존했습니다.
theological_decisions:
- issue: κύριος의 예수님 호칭 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 부활 서사에서 κύριος는 단순한 예의 호칭이 아니라 예수님에 대한 신앙 고백적 칭호이므로 ‘주님’으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: 첫인칭 복수 οἴδαμεν 보존
  chosen_reading: 우리는 … 알지 못합니다
  alternative_readings:
  - 나는 … 알지 못합니다
  rationale: 본문의 복수형을 그대로 보존해, 동행자 포함 가능성을 해소하지 않고 서술상의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
