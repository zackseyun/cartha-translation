    rationale: 이 문맥의 δέ는 두 사람이 함께 달렸다는 진술에 이어 다른 제자가 더 빨리 달린 결과를 연결합니다. 강한 대조를 표시할 필요가 없습니다.
  - severity: low
    issue: ‘베드로보다 더 빨리 앞질러 달려가’는 다소 중복적이며 ‘추월’의 과도한 뉘앙스를 낼 수 있습니다.
    rationale: τάχιον τοῦ Πέτρου는 ‘베드로보다 더 빨리’를 명시하며, προέδραμεν의 앞섬은 ‘먼저 도착했다’와 결합하여 충분히 드러납니다.
