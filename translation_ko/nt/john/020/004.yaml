  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
  footnotes:
  - marker: a
    text: Or 'outran Peter.' The Greek verb literally means 'ran ahead,' and the comparison is expressed by 'faster than Peter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 두 사람은 함께 달리고 있었습니다. 그런데 다른 제자가 베드로보다 더 빨리 앞질러 달려가 무덤에 먼저 도착했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘앞질러 달려가’는 그리스어 동사 προέδραμεν의 기본 뜻을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτρεχον
  english_pob_choice: were running
  chosen_korean: 달리고 있었습니다
  alternatives_korean:
  - 달렸습니다
  lexicon: BDAG
  rationale: 미완료 시제의 지속성을 살려 과거의 진행 중인 동작으로 옮겼습니다.
- source_word: οἱ δύο ὁμοῦ
  english_pob_choice: The two were running together
  chosen_korean: 그 두 사람은 함께
  alternatives_korean:
  - 둘은 함께
  - 두 사람은 같이
  lexicon: BDAG
  rationale: 두 사람의 동시 행동을 자연스럽게 드러내기 위해 ‘함께’로 옮겼습니다.
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  english_pob_choice: ran ahead faster than Peter
  chosen_korean: 베드로보다 더 빨리 앞질러 달려가
  alternatives_korean:
  - 베드로보다 더 빨리 달려가
  - 베드로를 앞질러 달려가
  lexicon: BDAG
  rationale: προέδραμεν은 ‘앞서 달리다’의 동작을, τάχιον은 비교 부사 ‘더 빨리’로 분리해 한국어에서도 비교 관계를 분명히 했습니다.
- source_word: μνημεῖον
  english_pob_choice: the tomb
  chosen_korean: 무덤
  alternatives_korean:
  - 묘실
  - 무덤집
  lexicon: BDAG
  rationale: 예수의 매장 장소를 가리키는 문맥이므로 현대 한국어에서 가장 자연스러운 ‘무덤’을 사용했습니다.
theological_decisions:
- issue: δέ의 연결 뉘앙스
  chosen_reading: 대조를 강하게 만들지 않고 단순 연결로 처리했습니다.
  alternative_readings:
  - 그런데
  - 하지만
  rationale: 본문은 두 사람이 함께 달리다가 한 사람이 앞서는 장면 전환일 뿐, 의미상 뚜렷한 반전을 요구하지 않으므로 한국어에서는 ‘그런데’로 부드럽게 이어 갔습니다.
  doctrine_reference: 문맥-연결어 처리
