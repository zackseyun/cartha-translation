- from: 그 두 사람은 함께 달리고 있었습니다. 그런데 다른 제자가 베드로보다 더 빨리 앞질러 달려가 무덤에 먼저 도착했습니다.[a]
  to: 그 두 사람은 함께 달리고 있었고, 다른 제자는 베드로보다 더 빨리 달려가[a] 무덤에 먼저 도착했습니다.
