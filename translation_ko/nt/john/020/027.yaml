id: JHN.20.27
reference: John 20:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
  footnotes:
  - marker: a
    text: Or 'do not be faithless, but faithful.' The Greek adjectives can carry either sense, but in this context the contrast centers on Thomas's belief in the risen Jesus.
    reason: alternative_reading
translation:
  language: ko
  text: 그런 다음 예수께서 도마에게 말씀하셨습니다. 「네 손가락을 이리 가져와서 내 두 손을 보아라. 네 손을 가져와 내 옆구리에 넣어라. 믿지 않는 이가 되지 말고 믿는 이가 되어라.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿지 않는 이’와 ‘믿는 이’는 각각 ‘믿음 없는 이’와 ‘신실한 이’로도 옮길 수 있습니다. 여기서는 부활하신 예수에 대한 도마의 믿음이 문맥의 초점이므로 이렇게 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후에
  - 그런 다음
  lexicon: BDAG
  rationale: 서사적 순서를 자연스럽게 표시하면서도 앞선 장면의 연속성을 유지하는 현대 한국어 표현입니다.
- source_word: Φέρε
  english_pob_choice: Bring
  chosen_korean: 가져와
  alternatives_korean:
