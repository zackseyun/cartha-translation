  - 오게 하라
  lexicon: BDAG
  rationale: 두 번 반복되는 명령의 동작성을 살리기 위해 ‘가져오다’ 계열을 택했고, 직접적이면서도 한국어에서 자연스럽습니다.
- source_word: τὰς χεῖράς μου / τὴν χεῖρά σου
  english_pob_choice: my hands / your hand
  chosen_korean: 내 손들을 / 네 손
  alternatives_korean:
  - 내 손들 / 네 손들
  - 내 손 / 네 손
  lexicon: BDAG
  rationale: 원문 복수형을 반영해 예수의 손에 ‘손들을’이라고 살렸고, 두 번째는 단수 그대로 두어 반복 대조를 유지했습니다.
- source_word: πλευράν
  english_pob_choice: side
  chosen_korean: 옆구리
  alternatives_korean:
  - 옆구리 부분
  - 옆구리 쪽
  lexicon: BDAG
  rationale: 예수의 찔린 옆구리를 가리키는 이 본문에서는 한국어에서 가장 자연스럽고 구체적인 표현인 ‘옆구리’가 적절합니다.
- source_word: ἄπιστος / πιστός
  english_pob_choice: unbelieving / believing
  chosen_korean: 믿지 않는 사람 / 믿는 사람
  alternatives_korean:
  - 믿음 없는 사람 / 신실한 사람
  - 불신하는 자 / 신실한 자
  lexicon: BDAG
  rationale: 문맥상 도마가 부활하신 예수를 믿느냐의 대조가 핵심이므로, 도덕적 뉘앙스가 강한 ‘신실한’보다 믿음의 유무를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ἄπιστος / πιστός의 대조를 한국어로 어떻게 드러낼지
  chosen_reading: ‘믿지 않는 사람’ / ‘믿는 사람’으로 번역해 부활하신 예수에 대한 믿음의 문제를 전면에 둡니다.
  alternative_readings:
  - ‘믿음 없는 사람’ / ‘믿는 사람’
  - ‘불신하는 자’ / ‘신실한 자’
  rationale: 이 장면은 도마의 윤리적 성실성보다 부활 증언에 대한 믿음 여부를 다룹니다. 따라서 신학적 긴장을 흐리지 않으면서도 문맥의 초점을 보존하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; πίστις is rendered as 믿음 by default.'
