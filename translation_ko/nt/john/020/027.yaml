id: JHN.20.27
reference: John 20:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
  footnotes:
  - marker: a
    text: Or 'do not be faithless, but faithful.' The Greek adjectives can carry either sense, but in this context the contrast centers on Thomas's belief in the risen Jesus.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 예수께서 도마에게 말씀하셨습니다. 「네 손가락을 여기 가져와 내 손들을 보아라. 네 손을 가져와 내 옆구리에 넣어 보아라. 그리고 믿지 않는 사람이 되지 말고 믿는 사람이 되어라.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿지 않는 사람’은 문맥에 따라 ‘믿음 없는 사람’, ‘믿는 사람이 아닌 사람’으로도 옮길 수 있습니다. 여기서는 부활하신 예수에 대한 믿음의 대조를 분명히 하기 위해 이렇게 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후에
  - 그런 다음
  lexicon: BDAG
  rationale: 서사적 순서를 자연스럽게 표시하면서도 앞선 장면의 연속성을 유지하는 현대 한국어 표현입니다.
- source_word: Φέρε
  english_pob_choice: Bring
  chosen_korean: 가져와
  alternatives_korean:
  - 가져오라
  - 오게 하라
  lexicon: BDAG
  rationale: 두 번 반복되는 명령의 동작성을 살리기 위해 ‘가져오다’ 계열을 택했고, 직접적이면서도 한국어에서 자연스럽습니다.
- source_word: τὰς χεῖράς μου / τὴν χεῖρά σου
  english_pob_choice: my hands / your hand
  chosen_korean: 내 손들을 / 네 손
  alternatives_korean:
  - 내 손들 / 네 손들
  - 내 손 / 네 손
  lexicon: BDAG
  rationale: 원문 복수형을 반영해 예수의 손에 ‘손들을’이라고 살렸고, 두 번째는 단수 그대로 두어 반복 대조를 유지했습니다.
- source_word: πλευράν
  english_pob_choice: side
  chosen_korean: 옆구리
  alternatives_korean:
  - 옆구리 부분
  - 옆구리 쪽
  lexicon: BDAG
  rationale: 예수의 찔린 옆구리를 가리키는 이 본문에서는 한국어에서 가장 자연스럽고 구체적인 표현인 ‘옆구리’가 적절합니다.
- source_word: ἄπιστος / πιστός
  english_pob_choice: unbelieving / believing
  chosen_korean: 믿지 않는 사람 / 믿는 사람
  alternatives_korean:
  - 믿음 없는 사람 / 신실한 사람
  - 불신하는 자 / 신실한 자
  lexicon: BDAG
  rationale: 문맥상 도마가 부활하신 예수를 믿느냐의 대조가 핵심이므로, 도덕적 뉘앙스가 강한 ‘신실한’보다 믿음의 유무를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ἄπιστος / πιστός의 대조를 한국어로 어떻게 드러낼지
  chosen_reading: ‘믿지 않는 사람’ / ‘믿는 사람’으로 번역해 부활하신 예수에 대한 믿음의 문제를 전면에 둡니다.
  alternative_readings:
  - ‘믿음 없는 사람’ / ‘믿는 사람’
  - ‘불신하는 자’ / ‘신실한 자’
  rationale: 이 장면은 도마의 윤리적 성실성보다 부활 증언에 대한 믿음 여부를 다룹니다. 따라서 신학적 긴장을 흐리지 않으면서도 문맥의 초점을 보존하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; πίστις is rendered as 믿음 by default.'
