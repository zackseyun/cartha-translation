review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 명령의 순서는 대체로 충실합니다. 그러나 ‘내 손들을’은 한국어에서 부자연스럽고, 복수형은 ‘내 두 손’을 통해 자연스럽게 보존할 수 있습니다. 또한 ‘넣어 보아라’의 ‘-아 보다’는 원문의 단순한 명령 βάλε에 없는 ‘시험해 보다’의 뉘앙스를 더할 수 있으므로 제거하는 편이 안전합니다.
  naturalness: 서술의 합쇼체는 적절합니다. 직접 인용문의 ‘가져와’는 구어적 반말이고 ‘손들을’ 및 ‘믿지 않는 사람이 되지 말고 믿는 사람이 되어라’는 현대 한국어로 다소 어색합니다. 명령문은 본문의 직접성과 권위를 유지하는 하라체로 자연스럽게 다듬을 수 있습니다.
  terminology: ‘옆구리’는 πλευρά의 문맥상 적절한 번역입니다. ἄπιστος / πιστός는 부활하신 예수에 대한 믿음이라는 문맥을 따라 ‘믿지 않는 이 / 믿는 이’로 옮기는 것이 적절하며, ‘사람’의 반복 없이 원문의 형용사적 대조를 더 자연스럽게 드러냅니다.
  issues:
  - severity: medium
    issue: ‘내 손들을’이라는 복수 표기가 부자연스럽습니다.
    rationale: τὰς χεῖράς μου는 복수이지만, 한국어에서 신체 부위에 ‘손들’을 쓰면 어색합니다. ‘내 두 손’은 복수와 의미를 모두 자연스럽게 반영합니다.
  - severity: medium
    issue: ‘내 옆구리에 넣어 보아라’가 원문보다 시험적 뉘앙스를 더합니다.
    rationale: βάλε εἰς는 ‘넣어라/대어라’라는 직접 명령입니다. ‘-아 보다’는 시도 또는 시험의 의미를 덧붙일 수 있습니다.
  - severity: low
    issue: ‘믿지 않는 사람이 되지 말고 믿는 사람이 되어라’가 장황하고 어색합니다.
    rationale: 원문의 ἄπιστος / πιστός는 사람 명사를 반복하지 않는 형용사 대조입니다. ‘믿지 않는 이가 되지 말고 믿는 이가 되어라’가 의미와 γίνου의 변화·과정성을 보존하면서 더 자연스럽습니다.
