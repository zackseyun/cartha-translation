revisions:
- from: 그때 예수께서 도마에게 말씀하셨습니다. 「네 손가락을 여기 가져와 내 손들을 보아라. 네 손을 가져와 내 옆구리에 넣어 보아라. 그리고 믿지 않는 사람이 되지 말고 믿는 사람이 되어라.」[a]
  to: 그런 다음 예수께서 도마에게 말씀하셨습니다. 「네 손가락을 이리 가져와서 내 두 손을 보아라. 네 손을 가져와 내 옆구리에 넣어라. 믿지 않는 이가 되지 말고 믿는 이가 되어라.」[a]
  rationale: εἶτα의 순차성을 ‘그런 다음’으로 분명히 하고, 손의 복수는 자연스러운 한국어인 ‘내 두 손’으로 보존했습니다. βάλε의 직접 명령을 ‘넣어라’로 옮겨 ‘시험해 보다’의 추가 뉘앙스를 피했습니다. 마지막 대조는 γίνου의 변화 의미를 유지하되, 불필요한 ‘사람’ 반복을 제거하여 현대 한국어의 자연스러움을 높였습니다.
  reviewer_model: gpt-5.6-terra
