    issue: ‘이처럼’의 추가
    rationale: οὖν은 문맥상 추론·연결의 기능을 하지만 ‘이처럼’이라는 지시적 내용이 본문에 명시되어 있지는 않습니다.
  - severity: low
    issue: ‘이외에도 많은 다른 표징’의 어색한 중복
    rationale: ἄλλα는 ‘그 밖의/다른’이라는 뜻이지만, 한국어에서는 ‘이외에도’와 ‘다른’을 함께 쓰면 중복되고 문장이 무거워집니다.
  - severity: low
    issue: 각주 표지의 위치와 용어
    rationale: 각주는 σημεῖα의 번역 대안을 설명하므로 ‘표징’에 직접 붙이는 편이 명확하며, 현대 한국어에서는 ‘헬라어’보다 ‘그리스어’가 중립적이고 일반적인 명칭입니다.
  revised_text: 예수께서는 제자들 앞에서 그 밖에도 많은 표징[a]을 행하셨습니다. 이 표징들은 이 책에 기록되어 있지 않습니다.
