translation:
  language: ko
  text: 예수께서는 제자들 앞에서 그 밖에도 많은 표징[a]을 행하셨습니다. 이 표징들은 이 책에 기록되어 있지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기적’. 그리스어 σημεῖα는 예수의 정체를 가리키는 행위라는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  english_pob_choice: many other
  chosen_korean: 이처럼 … 이외에도 많은 다른
  alternatives_korean:
  - 많은 다른
  - 참으로 많은 다른
  lexicon: BDAG
  rationale: οὖν의 결론적 흐름과 μέν의 미완결 대비를 반영하되, 한국어에서는 ‘이처럼’과 ‘이외에도’로 자연스럽게 이어 주어 앞뒤 문맥의 연결을 살렸습니다.
- source_word: σημεῖα
  english_pob_choice: signs
  chosen_korean: 표징
  alternatives_korean:
  - 기적
  - 징조
  lexicon: BDAG
  rationale: 요한복음의 σημεῖα는 단순한 놀라운 일보다 예수의 정체를 가리키는 기능이 강조되므로, ‘기적’보다 의미를 더 분명히 드러내는 ‘표징’으로 옮겼습니다.
- source_word: ἐνώπιον τῶν μαθητῶν
  english_pob_choice: in the presence of the disciples
  chosen_korean: 제자들 앞에서
  alternatives_korean:
  - 제자들 면전에서
  - 제자들 앞에
  lexicon: BDAG
  rationale: ἐνώπιον은 목격 가능성과 공개성을 나타내므로, 현대 한국어에서 자연스러운 ‘제자들 앞에서’로 옮겼습니다.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  english_pob_choice: in this book
  chosen_korean: 이 책에
  alternatives_korean:
  - 이 책 안에
  - 이 기록에
  lexicon: BDAG
  rationale: 복음서를 가리키는 βιβλίον의 기본 의미를 살리면서도 현대 독자에게 가장 자연스러운 ‘이 책’으로 옮겼습니다.
theological_decisions:
- issue: 요한복음에서 σημεῖα의 신학적 뉘앙스
  chosen_reading: ‘표징’으로 번역해 예수의 행위가 그 자체로 끝나지 않고 예수의 정체와 사명을 가리킨다는 점을 드러냈습니다.
  alternative_readings:
  - 기적
  - 놀라운 일
  rationale: 본문은 단순한 능력 과시보다 계시적 기능을 강조하므로, 표준적인 교회어 ‘기적’보다 신학적 긴장을 보존하는 ‘표징’이 더 적합합니다.
  doctrine_reference: 요한복음의 표징 신학
