review_pass:
  verdict: revise
  source_fidelity: ‘이처럼’은 οὖν의 추론적 연결을 다소 지나치게 지시적으로 구체화하며, ‘이외에도 많은 다른 표징’은 πολλὰ … καὶ ἄλλα의 반복을 한국어에서 부자연스럽게 드러냅니다. ‘그 밖에도 많은 표징’은 ‘many other signs’를 자연스럽고 충실하게 옮깁니다. 기록되지 않은 대상이 표징임도 대명사로 명확히 유지했습니다.
  naturalness: ‘그 밖에도 많은 표징’이 현대 표준어 합쇼체에서 자연스럽습니다. 각주 표지도 해당 어휘인 ‘표징’ 바로 뒤에 두어 참조 범위가 분명합니다.
  terminology: 요한복음의 σημεῖα에는 ‘표징’을 유지했습니다. 이는 단순한 이적이라는 뜻으로 한정하지 않으면서도 현대 한국어에서 이해 가능한 용례입니다. 각주에서는 대안 ‘기적’과 그리스어의 지시적 뉘앙스를 간결하게 밝혔습니다.
  issues:
