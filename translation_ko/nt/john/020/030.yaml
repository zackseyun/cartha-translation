  to: 예수께서는 제자들 앞에서 그 밖에도 많은 표징[a]을 행하셨습니다. 이 표징들은 이 책에 기록되어 있지 않습니다.
  rationale: 본문의 ‘많은 다른 표징’을 자연스러운 한국어로 다듬고, 원문의 지시·추론 관계를 과도하게 특정하는 ‘이처럼’을 제거했습니다. 표징과 기록되지 않은 것의 관계는 ‘이 표징들’로 분명히 했으며, 각주는 해당 낱말에 직접 연결하고 현대적인 언어 명칭으로 정리했습니다.
