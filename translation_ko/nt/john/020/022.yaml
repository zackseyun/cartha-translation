id: JHN.20.22
reference: John 20:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
  footnotes:
  - marker: a
    text: Or 'he breathed into them.' The verb also recalls creation and new-creation imagery in Genesis 2:7 and Ezekiel 37.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것을 말씀하신 뒤, 그들에게 숨을 내쉬며 말씀하셨습니다. 「성령을 받으십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 안으로 숨을 내쉬었다’로도 옮길 수 있습니다. 이 동사는 창세기 2:7과 에스겔 37장의 창조 및 새창조 이미지를 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  english_pob_choice: after saying this
  chosen_korean: 이것을 말씀하신 뒤
  alternatives_korean:
  - 이것을 말씀하신 후
  - 이 말씀을 하신 뒤
  lexicon: BDAG
  rationale: aorist 분사로 앞선 행위를 나타내므로, 한국어에서는 ‘-하신 뒤’로 자연스럽게 시간 순서를 살렸습니다.
- source_word: ἐνεφύσησεν
  english_pob_choice: breathed on them
  chosen_korean: 그들에게 숨을 내쉬며
  alternatives_korean:
  - 그들에게 숨을 불며
  - 그들 안으로 숨을 불어넣으며
  lexicon: BDAG
  rationale: 동사는 ‘불다’보다 ‘숨을 내쉬다’가 본문 동작을 더 직접적으로 드러내며, POB의 주석처럼 창조/새창조의 연상도 과도하게 풀지 않고 유지합니다.
- source_word: Λάβετε
  english_pob_choice: Receive
  chosen_korean: 성령을 받으십시오
  alternatives_korean:
  - 성령을 받으십시오
  - 받으십시오
  lexicon: BDAG
  rationale: 받다의 명령형을 예수의 직접 명령에 맞게 공손한 합쇼체로 옮겼고, 문맥상 목적어를 함께 제시해 자연스러운 한국어가 되게 했습니다.
- source_word: πνεῦμα ἅγιον
  english_pob_choice: the Holy Spirit
  chosen_korean: 성령
  alternatives_korean:
  - 거룩한 영
  - 거룩한 성령
  lexicon: BDAG
  rationale: 요한복음의 문맥상 이는 단순한 ‘거룩한 영’이 아니라 하나님의 영을 가리키므로, 교회 용례에 맞는 ‘성령’을 택했습니다.
theological_decisions:
- issue: πνεῦμα ἅγιον의 인격적/신적 의미
  chosen_reading: 성령
  alternative_readings:
  - 거룩한 영
  - 거룩한 영으로
  rationale: 본문은 단순한 성질을 뜻하는 표현이 아니라 예수께서 제자들에게 주시는 하나님의 영을 가리키므로, 인격적·신적 의미가 드러나는 ‘성령’이 적절합니다.
  doctrine_reference: 요한복음의 성령 약속 본문; 번역 원칙
