  source_fidelity: 그리스어는 ‘이것을 말씀하신 뒤’(τοῦτο εἰπὼν), ‘숨을 내쉬셨고’(ἐνεφύσησεν), 이어 ‘그들에게 말씀하셨습니다’(λέγει αὐτοῖς)라는 순서를 보입니다. 초안의 ‘숨을 내쉬며’는 두 동작을 동시 행위처럼 연결하므로 순서를 약화합니다. 또한 본문의 ἐνεφύσησεν에는 직접 목적어나 방향 표현이 명시되어 있지 않지만, 문맥상 제자들을 향한 행위임은 자연스럽게 이해됩니다.
  naturalness: ‘그들을 향해 숨을 내쉬시고’는 현대 표준 한국어 합쇼체에서 자연스럽고, ‘숨을 내쉬시며’보다 서술의 연속과 인용 도입을 명료하게 합니다. 인용부호는 한국어 문장부호 관례에 맞춰 큰따옴표로 통일했습니다.
  terminology: ‘성령’과 ‘받으십시오’는 πνεῦμα ἅγιον 및 Λάβετε에 대한 자연스럽고 확립된 한국어 대응입니다. 교리적 내용을 추가하지 않습니다. 각주는 본문의 동사를 ‘그들 안으로 숨을 불어넣으셨다’로 이해할 수 있는 가능성과 창조·새창조 연상을 보존합니다.
  issues:
