id: JHN.20.13
reference: John 20:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
  footnotes:
  - marker: a
    text: Or 'what are you weeping for?' The Greek literally uses 'what,' but the sense in English is 'why.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my master.' Greek kyrios is rendered 'Lord' by default in this translation; the term can also function as a respectful title depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 그녀에게 말했습니다. “여자여, 왜 우십니까?” 그녀가 그들에게 말했습니다. “사람들이 내 주님을 가져갔습니다. 나는 그들이 그를 어디에 두었는지 알지 못합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 τί κλαίεις는 문자적 ‘무엇’을 뜻하기보다 관용적으로 ‘왜 우십니까?’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: κύριος는 여기서 기본적으로 ‘주님’으로 옮겼습니다. 문맥에 따라 ‘주인’이라는 뜻도 가능하지만, 본문에서는 예수에 대한 존칭이 더 적절합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  english_pob_choice: Woman
  chosen_korean: 여자여
  alternatives_korean:
  - 여인이여
  - 부인
  lexicon: BDAG
  rationale: 직접적인 호격을 살리되, 존칭을 과도하게 덧붙이지 않고 본문의 간결한 호칭을 반영했습니다.
- source_word: τί κλαίεις
  english_pob_choice: why are you weeping
  chosen_korean: 왜 우십니까
  alternatives_korean:
  - 무엇 때문에 우십니까
  - 왜 우느냐
  lexicon: BDAG
  rationale: τί의 문자적 ‘무엇’보다 관용적 의미인 ‘왜’를 살려, 한국어에서 자연스러운 질문으로 옮겼습니다.
- source_word: Ἦραν τὸν κύριόν μου
  english_pob_choice: They have taken away my Lord
  chosen_korean: 사람들이 내 주님을 가져갔습니다
  alternatives_korean:
  - 그들이 내 주님을 데려갔습니다
  - 그들이 내 주님을 옮겼습니다
  lexicon: BDAG
  rationale: Ἦραν은 단순히 ‘가져가다/치워가다’의 의미를 담으므로 ‘가져갔습니다’가 가장 직접적입니다. κύριός μου는 기본 용례를 따라 ‘주님’으로 옮겼습니다.
- source_word: οὐκ οἶδα ποῦ ἔθηκαν αὐτόν
  english_pob_choice: I do not know where they have put him
  chosen_korean: 나는 그들이 그를 어디에 두었는지 알지 못합니다
  alternatives_korean:
  - 그들이 그를 어디에 놓았는지 알지 못합니다
  - 그를 어디에 두었는지 모르겠습니다
  lexicon: BDAG
  rationale: ἔθηκαν의 ‘두다/놓다’ 의미를 살려, 무덤 안에서의 위치 이동을 드러내는 ‘두었는지’로 번역했습니다. 오이다는 상태를 나타내므로 ‘알지 못합니다’가 자연스럽습니다.
theological_decisions:
- issue: κύριός μου의 번역
  chosen_reading: 내 주님
  alternative_readings:
  - 내 주인
  - 내 선생님
  rationale: 본문의 κύριος는 단순한 사회적 예우보다 예수께 대한 존칭과 신앙적 고백의 여지를 함께 가지므로, 기본 번역 원칙에 따라 ‘주님’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
- issue: Γύναι의 한국어 호칭
  chosen_reading: 여자여
  alternative_readings:
  - 부인
  - 여인이여
  rationale: 본문의 호칭은 정중하지만 과도하게 부드럽게 만들 필요는 없으므로, 원문의 직접성을 보존하는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy'
