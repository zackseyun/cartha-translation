- from: 그들이 그녀에게 말했습니다. “여자여, 왜 우십니까?” 그녀가 그들에게 말했습니다. “사람들이 내 주님을 가져갔습니다. 나는 그들이 그를 어디에 두었는지 알지 못합니다.”[a][b]
  to: 그들이 그녀에게 말했습니다. “여인이여, 왜 우십니까?”[a] 그녀가 그들에게 말했습니다. “그들이 내 주님을 가져갔습니다.[b] 나는 그들이 그를 어디에 두었는지 알지 못합니다.”
  rationale: The revision removes the added noun ‘사람들’, adopts a respectful and readable Korean vocative for Γύναι, and relocates both footnote anchors to the terms they explain. It otherwise retains the draft’s accurate rendering of the Greek syntax, actions, and κύριος terminology.
