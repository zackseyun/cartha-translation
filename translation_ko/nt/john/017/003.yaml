review_pass:
  verdict: revise
  source_fidelity: 초안은 αἰώνιος ζωή의 정의 구조와 「유일하신 참 하나님」 및 「예수 메시아」를 대체로 충실히 옮겼습니다. 그러나 원문의 2인칭 목적어 σέ와 2인칭 동사 ἀπέστειλας를 「아버지께서」로 바꾸어, 기도 속 직접 호칭을 3인칭으로 전환하고 원문에 없는 명시적 호칭을 넣었습니다. 한국어에서는 자연스러운 직접 호칭인 「주님」으로 이를 보완하는 것이 더 충실합니다.
  naturalness: 「영원한 생명은 곧 …을 아는 것입니다」는 현대 표준어 합쇼체에서 자연스럽고, 정의문으로도 분명합니다. 「유일하신 참 하나님이신 주님과 주님께서 보내신 예수 메시아를」은 두 대상을 한 동사에 연결하면서 원문의 직접 호칭을 자연스럽게 보존합니다.
  terminology: 「영원한 생명」, 「유일하신 참 하나님」, 「예수 메시아」는 적절합니다. Χριστός의 칭호성을 보존한 「메시아」와 전통적 대안 「그리스도」를 제시한 각주도 적절합니다. 다만 각주의 「본 글로사리」는 성경 본문 각주로서는 편집 정책을 언급하는 메타 설명이므로, 어휘적 대안과 용법 설명만 남기는 편이 적절합니다.
  issues:
  - severity: medium
    issue: 「아버지께서」가 원문의 직접 2인칭을 3인칭으로 바꿈
    rationale: σέ와 ἀπέστειλας는 기도에서 하나님께 직접 드리는 「주님」 및 「주님께서 보내신」에 해당합니다. 「아버지」는 문맥상 지시 대상과 부합하지만 이 절의 그리스어에는 명시되어 있지 않으므로, 번역문에서 직접 호칭을 보존하는 편이 source fidelity에 더 부합합니다.
  - severity: low
    issue: 각주의 편집 정책 언급
    rationale: 「본 글로사리는 … 채택한다」는 독자용 본문 각주가 아니라 편집 메모에 가깝습니다. 대안 번역과 Χριστός의 칭호/이름 같은 용법만 제시하면 충분합니다.
  revised_text: 영원한 생명은 곧 유일하신 참 하나님이신 주님과 주님께서 보내신 예수 메시아를 아는 것입니다.[a]
