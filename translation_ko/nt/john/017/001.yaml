  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: ko
  text: 예수께서는 이 말씀을 하시고 눈을 들어 하늘을 향하시며 말씀하셨습니다. 「아버지여, 때가 이르렀습니다. 아버지의 아들을 영화롭게 하소서. 그리하여 아들이 아버지를 영화롭게 하게 하소서.」
  philosophy: optimal-equivalence
