revisions:
- from: 예수께서는 이것들을 말씀하시고, 눈을 들어 하늘을 우러러보시며 말씀하셨습니다. 「아버지여, 때가 이르렀습니다. 아들이 아버지께 영광을 돌리게 하시려고, 아버지의 아들을 영광스럽게 하소서.
  to: 예수께서는 이 말씀을 하시고 눈을 들어 하늘을 향하시며 말씀하셨습니다. 「아버지여, 때가 이르렀습니다. 아버지의 아들을 영화롭게 하소서. 그리하여 아들이 아버지를 영화롭게 하게 하소서.」
  rationale: 원문의 어순과 ἵνα 목적 관계를 회복하고, 두 번의 δοξάζω를 같은 한국어 핵심어로 옮겨 상호 영화의 대칭을 보존했습니다. 호격 「아버지여」, 완료의 결과 상태를 담은 「때가 이르렀습니다」, 기도체 「하소서」는 유지했습니다.
