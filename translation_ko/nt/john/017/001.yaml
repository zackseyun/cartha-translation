  source_fidelity: 핵심 의미는 대체로 보존했지만, 원문의 명령(아들을 영화롭게 하소서)과 목적절(그리하여 아들이 아버지를 영화롭게 하게 하소서)의 순서가 초안에서는 역전되어 있습니다. 또한 원문이 같은 동사 δοξάζω를 양쪽에 사용하므로 한국어도 가능한 한 같은 핵심 표현으로 대응시키는 편이 좋습니다.
  naturalness: 「이것들을 말씀하시고」는 문맥상 가능하나 「이 말씀을 하시고」가 현대 한국어에서 더 자연스럽습니다. 「눈을 들어 하늘을 우러러보시며」도 이해되지만, 「눈을 들어 하늘을 향하시고」는 눈을 들어 하늘 쪽으로 향한 원문의 동작을 더 간결하게 나타냅니다.
  terminology: Πάτερ의 「아버지여」와 ἐλήλυθεν ἡ ὥρα의 「때가 이르렀습니다」는 적절합니다. δοξάζω는 상호 관계의 대칭을 보존하도록 두 곳 모두 「영화롭게 하다」로 옮기는 것이 좋습니다. 이는 다소 격식 있는 성서어이지만 현대 정중 기도문 문맥에서 자연스럽고 신학 용어로도 안정되어 있습니다.
  issues:
