    rationale: 그리스어는 먼저 「당신의 아들을 영화롭게 하소서」라고 명하고, 이어 ἵνα로 「그리하여 아들이 당신을 영화롭게 하게 하소서」라는 목적을 제시합니다. 번역도 이 진행을 유지하는 것이 최적 등가에 부합합니다.
  - severity: medium
    issue: 상호 대응하는 δοξάζω의 번역이 불균형합니다.
    rationale: 초안은 아들에 대해서는 「영광스럽게 하소서」, 아버지에 대해서는 「영광을 돌리다」를 사용합니다. 두 동사가 모두 δοξάζω이므로 동일한 핵심 동사인 「영화롭게 하다」를 사용하여 원문의 대칭을 보존하는 편이 좋습니다.
