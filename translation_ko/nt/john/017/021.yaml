- from: 그리하여 그들 모두가 하나가 되게 하소서. 아버지여, 아버지께서 내 안에 계시고 내가 아버지 안에 있는 것과 같이, 그들도 우리 안에 있게 하소서. 그래서 세상으로 하여금 아버지께서 나를 보내셨음을 믿게 하소서.[a][b][c]
  to: 그들 모두가 하나가 되게 하소서.[a] 아버지여, 아버지께서 내 안에 계시고 내가 아버지 안에 있는 것같이, 그들도 우리 안에 있게 하소서.[b] 그리하여 세상이 아버지께서 나를 보내셨다는 것을 믿게 하소서.[c]
  rationale: 목적절의 흐름을 보존하면서 한국어 기도문으로 자연스럽게 다듬었습니다. 「하나」와 「~ 안에」를 그대로 유지하여 원문이 남기는 하나 됨과 상호 내주의 범위를 좁히지 않았습니다. 또한 모든 각주 표지를 해당 어구에 배치하고, 각주 내용은 원문과 영어 감사 기록의 설명 범위 안에서 정리했습니다.
