  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 παρὰ σεαυτῷ의 관계적·공간적 의미는 「아버지의 앞에서」보다 「아버지 곁에서」가 더 직접적으로 반영합니다. 또한 강조된 주어 σύ는 「아버지께서」로 자연스럽게 드러낼 수 있습니다.
  naturalness: 「아버지의 앞에서」는 현대 한국어에서 다소 부자연스럽고, 기도문 문맥에서는 「아버지 곁에서」가 자연스럽습니다. 「가지고 있던 영광」은 의미상 가능하지만 영광과의 결합에서는 「지니고 있던 영광」이 더 자연스럽습니다. 합쇼체는 「하십시오」로 일관되게 유지했습니다.
  terminology: δόξα는 요한복음의 핵심 어휘인 「영광」으로 유지했습니다. 「영화롭게 하십시오」는 δοξάζω를 적절히 반영하며, 선재와 아버지와의 공유를 나타내는 시간절 및 「아버지와 함께」를 보존합니다.
