  to: 나는 그들을 위하여 간구합니다[a][b]. 세상을 위하여 간구하는 것이 아니라, 아버지께서 내게 주신 이들을 위하여 간구합니다. 그들이 아버지의 것이기 때문입니다.
  rationale: ‘간구합니다’로 바꾸어 기도 문맥에서 목적어만을 수반하는 한국어 표현의 어색함을 해소했습니다. ‘세상’을 해석적으로 제한하지 않았고, ‘내게 주신’으로 δέδωκάς의 완료형 결과를 유지했습니다. 각주를 해당 어휘에 직접 연결하고 문구를 현대 한국어 문장에 맞게 다듬었습니다.
