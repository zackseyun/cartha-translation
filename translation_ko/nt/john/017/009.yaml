review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 완료형(‘내게 주신’), 그리고 ‘세상’의 포괄성을 잘 보존했습니다. 다만 ἐρωτῶ는 이 기도 문맥에서 ‘그들을 위해 구합니다’보다 ‘그들을 위하여 간구합니다’가 한국어에서 더 분명하고 자연스럽습니다. ‘아버지께서’는 기도의 상대방인 문맥을 반영한 자연스러운 보충입니다.
  naturalness: 합쇼체는 일관되지만, ‘그들을 위해 구합니다’는 무엇을 구하는지 생략된 상태에서 다소 어색하거나 ‘그들을 찾는다’는 뜻으로도 순간적으로 읽힐 수 있습니다. ‘그들을 위하여 간구합니다’는 기도 안의 중보 요청이라는 문맥을 자연스럽게 전달합니다.
  terminology: ‘세상’, ‘아버지’, ‘내게 주신 이들’, ‘아버지의 것’은 요한복음의 용어와 문체에 적절합니다. 주석 b는 ἐρωτῶ의 대안을 설명하므로 첫 번째 동사에 붙여야 하며, 현재의 ‘묻다·청하다’는 인용형과 문장 형태가 맞지 않아 고쳤습니다.
  issues:
  - severity: medium
    issue: ‘구합니다’의 문맥상 자연스러움
    rationale: 한국어에서 ‘그들을 위해 구합니다’는 요청의 내용을 밝히지 않을 경우 어색할 수 있습니다. 기도 문맥의 ἐρωτῶ를 ‘간구합니다’로 옮기면 중보적 요청을 자연스럽게 나타내면서도 원문의 일반적 ‘청하다’ 의미를 과도하게 좁히지 않습니다.
