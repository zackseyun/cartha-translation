  source_fidelity: 본문은 ἐγώ σε ἐδόξασα를 ‘나는 … 영광을 돌렸습니다’로, ἐπὶ τῆς γῆς를 ‘땅에서’로, τελειώσας를 수단을 나타내는 ‘완수함으로써’로 충실히 옮깁니다. δέδωκάς μοι ἵνα ποιήσω의 의미도 ‘아버지께서 내게 주신 일’에 자연스럽게 담겨 있습니다. 문맥상 기도 대상인 ‘아버지’를 명시한 것은 무리한 해석 추가가 아닙니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽고, 예배적·요한복음의 문맥에 맞는 격식을 유지합니다. ‘땅에서 아버지께 영광을 돌렸습니다’의 어순도 매끄럽습니다.
  terminology: ‘영광을 돌리다’는 δοξάζω의 요한복음적 의미를 한국어 성경 문체에서 안정적으로 전달합니다. ‘일’, ‘완수함으로써’도 원문의 사명 및 완료 의미를 적절히 보존합니다.
