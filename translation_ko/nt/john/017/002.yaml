revisions:
- from: 아버지께서 그에게 모든 육체를 다스릴 권세를 주신 것과 같이, 아버지께서 그에게 주신 모든 사람에게 그가 영원한 생명을 주게 하시려는 것입니다.[a][b]
  to: 아버지께서 그에게 모든 육체에 대한 권세를 주신 것처럼, 그가 아버지께서 그에게 주신 모든 이에게 영원한 생명을 주도록 하셨습니다.[a][b]
