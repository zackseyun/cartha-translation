  source_fidelity: 본문은 대체로 헬라어의 의미를 충실히 옮깁니다. 다만 Ἐφανέρωσα는 이 문맥에서 ‘나타내었습니다’보다 ‘드러냈습니다’가 더 직접적이며 자연스럽습니다. τοῖς ἀνθρώποις는 문법적으로 남성만을 명시하지 않으므로 본문에서는 ‘사람들’이 적절합니다.
  naturalness: 합쇼체 문체는 적절합니다. 각주 표지를 관련 낱말이나 구절에 붙이면 독자가 각주의 적용 범위를 분명히 알 수 있습니다. ‘본 사람들’이라는 각주 표현은 ‘이 “사람들”’로 다듬는 편이 자연스럽습니다.
  terminology: ‘아버지의 이름’, ‘세상’, ‘말씀을 지켰습니다’는 요한복음의 표현과 헬라어 τὸ ὄνομα, κόσμος, τὸν λόγον/τετήρηκαν을 잘 보존합니다. ‘하나님’이라는 각주 설명도 ‘아버지’의 계시된 정체성을 설명하는 범위에서 적절합니다.
