- from: 나는 아버지께서 세상에서 내게 주신 사람들에게 아버지의 이름을 나타내었습니다. 그들은 아버지의 것이었으며, 아버지께서 그들을 내게 주셨고, 그들은 아버지의 말씀을 지켰습니다.[a][b][c][d][e]
  to: 나는 아버지의 이름[b]을 세상에서[d] 아버지께서 내게 주신 사람들[c]에게 드러냈습니다[a]. 그들은 아버지의 것이었으며, 아버지께서 그들을 내게 주셨고, 그들은 아버지의 말씀을 지켰습니다[e].
  rationale: 본문의 의미는 유지하면서 φανερόω를 더 직접적으로 ‘드러냈습니다’로 옮기고, 각주 표지를 해당 어구에 연결했습니다. ἄνθρωποι에 관하여는 본문을 자연스러운 ‘사람들’로 유지하고, 각주에서 원어가 명시하지 않는 성별을 단정하지 않도록 조정했습니다. ‘세상에서’는 ἐκ τοῦ κόσμου의 선택·분리의 뉘앙스를 본문에서 보존하며, 각주는 비해석적 대안을 제시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:55Z'
