  terminology: '''아버지여,'' ''영광,'' and ''원합니다'' are appropriate in formal-polite Korean. ''세상이 세워지기 전부터'' gives a clear, non-interpretive rendering of πρὸ καταβολῆς κόσμου. The footnote should be attached to ''내게 주신 이들,'' the phrase it explains, rather than to the final clause.'
