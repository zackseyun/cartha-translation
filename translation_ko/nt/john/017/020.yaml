  source_fidelity: 원문의 περί + 속격은 여기서 기도의 대상을 가리키므로, ‘이들을 위해’보다 ‘이들을 두고/이들에 관하여’가 더 직접적입니다. 또한 λόγος의 소유자가 제자들이므로 높임말·신학적 용례를 강하게 띠는 ‘말씀’보다 ‘말’이 중립적입니다. πιστεύω εἰς ἐμέ는 ‘나를 믿는’으로 적절히 옮겼습니다.
