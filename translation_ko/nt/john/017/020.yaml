  terminology: ‘말’은 λόγος의 폭넓은 의미를 보존하며, 대안으로 ‘메시지’를 각주에 제시합니다. ‘믿는 이들’은 현재 분사의 지속적·일반적 성격을 자연스럽게 반영합니다.
