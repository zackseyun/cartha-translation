  source_fidelity: 원문의 비교 구문 καθὼς…κἀγώ와 두 번의 ἀποστέλλω(보내다), 그리고 εἰς τὸν κόσμον(세상에)를 정확히 보존합니다. 기도 문맥에서 2인칭 단수 수신자를 ‘아버지께서’로 명시한 것은 자연스럽고 문맥적으로 정당합니다.
