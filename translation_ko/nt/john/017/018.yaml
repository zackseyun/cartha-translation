  terminology: ‘세상’은 요한복음의 κόσμος에 대한 표준적이고 적절한 번역이며, ‘보내다’의 반복은 원문의 의도적인 선교적 평행을 보존합니다. ‘파송하다’보다 덜 교단적·해석적인 ‘보내다’가 적절합니다.
