revisions:
- from: 이 때문에 유대인들은 더욱 예수를 죽이려고 찾았습니다. 그가 안식일을 어길 뿐 아니라 하나님을 자기 아버지라고 불러, 자신을 하나님과 동등하게 만들고 있었기 때문입니다.[a][b]
  to: 이 때문에 유대인들은[a] 예수를 죽이려고 더욱 애썼습니다. 그는 안식일을 어길 뿐 아니라 하나님을 자기 아버지라고 불러, 자신을 하나님과 동등하게 만들었기 때문입니다.[b]
  rationale: ‘죽이려고 더욱 애썼습니다’로 바꾸어 ἐζήτουν의 지속·반복적 추구와 μᾶλλον의 강화 의미를 한국어답게 반영했습니다. ‘자신을 하나님과 동등하게 만들었기’는 ἴσον ἑαυτὸν ποιῶν의 재귀적 구성과 원문의 인과 논리를 유지하며, 그리스어가 직접 말하는 범위를 넘어 교리적으로 해설하지 않습니다. 두 각주는 각각의 대상 표현에 직접 연결되도록 표지를 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:55Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 인과 관계, ‘유대인들’, 안식일을 어김, 하나님을 자기 아버지라고 부름, 하나님과의 동등성이라는 논리는 대체로 보존되었습니다. 그러나 ἐζήτουν ... ἀποκτεῖναι를 ‘죽이려고 찾았습니다’로 옮긴 것은 한국어에서 목적어 없는 ‘찾다’처럼 들려 의미가 불완전하며, 지속적 의도를 더 자연스럽게 나타낼 필요가 있습니다. 또한 ποιῶν의 분사절은 ‘만들고 있었기’보다 완료된 서술의 인과절로 처리하는 편이 자연스럽습니다.
  naturalness: ‘예수를 죽이려고 찾았습니다’는 현대 표준 한국어에서 부자연스럽습니다. ‘예수를 죽이려고 더욱 애썼습니다’는 반복·지속의 미완료 과거와 μᾶλλον의 강화 의미를 자연스럽게 전달합니다. 각주 표지도 해당 표현 바로 뒤에 두어 참조 범위를 명확히 했습니다.
  terminology: ‘안식일’, ‘하나님’, ‘자기 아버지’, ‘동등하게’는 적절합니다. ‘하나님을 자기 아버지라고 불러’는 πατέρα ἴδιον ἔλεγε τὸν θεόν의 소유·특수성을 과도하게 해석하지 않고 보존합니다. 대안 각주는 본문의 재귀적 표현을 유지하는 ‘자신을 하나님과 동등하게 여겼기’로 제시하는 것이 기존 각주보다 자연스럽고 실제 번역 대안에 가깝습니다.
  issues:
  - severity: medium
    issue: ‘예수를 죽이려고 찾았습니다’의 부자연스러운 결합
