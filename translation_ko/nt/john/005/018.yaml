id: JHN.5.18
reference: John 5:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
  footnotes:
  - marker: a
    text: In John, 'the Jews' often refers more specifically to Jesus' Judean opponents or certain Jewish authorities in context, not to every Jewish person without distinction.
    reason: cultural_note
  - marker: b
    text: Or 'making himself equal to God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 때문에 유대인들은 더욱 예수를 죽이려고 찾았습니다. 그가 안식일을 어길 뿐 아니라 하나님을 자기 아버지라고 불러, 자신을 하나님과 동등하게 만들고 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 요한복음에서 ‘유대인들’은 문맥상 예수의 유대 지역 반대자들 또는 특정 유대 지도자들을 가리키는 경우가 많으며, 모든 유대인을 무차별적으로 뜻하지는 않습니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘하나님과 동등한 존재로 만들고 있었기 때문입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  english_pob_choice: For this reason, therefore
  chosen_korean: 이 때문에
  alternatives_korean:
  - 그러므로
  - 이런 이유로
  lexicon: BDAG
  rationale: 두 추론 표지를 한국어에서 한 번의 연결 표현으로 자연스럽게 묶되, 앞 문맥과의 인과를 분명히 살렸습니다.
- source_word: μᾶλλον ἐζήτουν
  english_pob_choice: were seeking all the more
  chosen_korean: 더욱 … 찾았습니다
  alternatives_korean:
  - 더욱 … 죽이려 했습니다
  - 한층 더 … 찾았습니다
  lexicon: BDAG
  rationale: ἐζήτουν의 지속적·반복적 뉘앙스를 살려 현재 진행형보다는 서술형으로 자연스럽게 옮기고, μᾶλλον의 증폭을 ‘더욱’으로 반영했습니다.
- source_word: ἔλυε τὸ σάββατον
  english_pob_choice: was ... breaking the Sabbath
  chosen_korean: 안식일을 어길 뿐 아니라
  alternatives_korean:
  - 안식일을 깨뜨릴 뿐 아니라
  - 안식일을 위반할 뿐 아니라
  lexicon: BDAG
  rationale: λύω의 관용적 의미를 한국어에서 가장 직접적인 ‘어기다’로 옮겨, 상대측의 고발 성격을 분명히 했습니다.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  english_pob_choice: was also calling God his own Father
  chosen_korean: 하나님을 자기 아버지라고 불러
  alternatives_korean:
  - 하나님을 자신의 아버지라고 말하며
  - 하나님을 자기만의 아버지라고 부르며
  lexicon: BDAG
  rationale: ἴδιον의 소유·특수성은 ‘자기’로, ἔλεγε의 발화 행위는 ‘불러’로 살려 단순한 설명이 아니라 호칭 행위를 드러냈습니다.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  english_pob_choice: making himself equal with God
  chosen_korean: 자신을 하나님과 동등하게 만들고 있었기 때문입니다
  alternatives_korean:
  - 자신을 하나님과 같게 만들고 있었기 때문입니다
  - 하나님과 동등하다고 자처하고 있었기 때문입니다
  lexicon: BDAG
  rationale: 행위의 결과를 나타내는 분사 구문을 ‘만들고 있었습니다’로 옮겨, 본문의 고발적 논리를 유지하면서 ‘동등’으로 평행 구조를 살렸습니다.
theological_decisions:
- issue: ‘유대인들’의 지시 범위를 본문에 어떻게 둘 것인가
  chosen_reading: 본문에는 ‘유대인들’을 그대로 두고, 과도한 일반화를 피하는 해석은 각주로 처리합니다.
  alternative_readings:
  - 유대 지도자들
  - 유대 지역 사람들
  rationale: 그리스어 원문이 οἱ Ἰουδαῖοι를 직접 사용하므로 본문에서 축소 번역하지 않았습니다. 다만 요한복음의 문맥상 특정 반대자 집단을 가리킬 수 있다는 긴장은 그대로 보존합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 본문에서 해석을 과도하게 확정하지 않음'
- issue: ‘하나님과 동등하게’의 기독론적 강도를 어떻게 보존할 것인가
  chosen_reading: ‘자신을 하나님과 동등하게 만들고 있었기 때문입니다’로 유지합니다.
  alternative_readings:
  - 자신을 하나님과 같게 만들고 있었기 때문입니다
  - 하나님과 동등하다고 주장하고 있었기 때문입니다
  rationale: 본문은 예수의 발화를 둘러싼 고발을 통해 그의 신적 동등성을 분명히 드러내므로, 이를 약화시키지 않는 직역적 표현을 택했습니다.
  doctrine_reference: 니케아 신조(381)의 그리스도의 신적 동등성 고백과 양립
