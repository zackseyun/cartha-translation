id: JHN.5.15
reference: John 5:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
  footnotes:
  - marker: a
    text: Or 'to the Jewish leaders' or 'to the Judeans,' depending on how John's use of 'the Jews' is understood in context.
    reason: alternative_reading
translation:
  language: ko
  text: 그 사람은 떠나서 유대인들에게 예수께서 자기를 낫게 하신 분이라고 알렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 문맥에 따라 ‘유대인 지도자들에게’ 또는 ‘유대 사람들에게’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  english_pob_choice: went away
  chosen_korean: 떠나서
  alternatives_korean:
  - 가서
  - 물러가서
  - 떠났습니다
  lexicon: BDAG
  rationale: 장면에서의 이탈을 자연스러운 현대 한국어로 옮기되, 단순한 이동보다 ‘scene에서 물러남’의 뉘앙스를 살렸습니다.
- source_word: ἀνήγγειλεν
  english_pob_choice: reported
  chosen_korean: 알렸습니다
  alternatives_korean:
  - 보고했습니다
  - 전했습니다
  - 보고했습니다
  lexicon: BDAG
  rationale: 공적·정보 전달의 성격을 살리면서도 한국어에서 지나치게 관료적으로 들리지 않는 표현을 택했습니다.
- source_word: τοῖς Ἰουδαίοις
  english_pob_choice: to the Jews
  chosen_korean: 유대인들에게
  alternatives_korean:
  - 유대인 지도자들에게
  - 유대 사람들에게
  lexicon: BDAG
  rationale: 본문의 표면적 표현인 ‘유대인들’을 본문에 유지했고, 요한복음의 문맥상 가능한 좁은 의미는 각주로 남겼습니다.
- source_word: ὁ ποιήσας αὐτὸν ὑγιῆ
  english_pob_choice: the one who had made him well
  chosen_korean: 자기를 낫게 하신 분
  alternatives_korean:
  - 자기를 건강하게 하신 분
  - 자기를 온전하게 하신 분
  lexicon: BDAG
  rationale: ποιέω의 ‘만들다/되게 하다’와 ὑγιής의 ‘건강하게 하다’가 결합한 표현을, 치유 문맥에 맞는 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 요한복음에서 ‘the Jews’의 지시 범위
  chosen_reading: 본문에는 ‘유대인들에게’를 두고, 해석상 좁은 의미 가능성은 각주로 처리했습니다.
  alternative_readings:
  - 유대인 지도자들에게
  - 유대 사람들에게
  rationale: 원문 어휘를 본문에서 보존해 해석을 미리 확정하지 않으면서, 문맥상 가능한 범위를 독자에게 열어 두는 편이 원문 충실도에 더 부합합니다.
  doctrine_reference: 번역 철학 1, 3
- issue: 간접화법에서 시제 대응
  chosen_reading: ‘예수께서… 하신 분’으로 자연스러운 한국어 서술을 택했습니다.
  alternative_readings:
  - 예수께서… 하셨다고
  - 예수께서… 하신다고
  rationale: 그리스어 현재형 ἐστιν을 한국어 간접화법 안에서 그대로 현재로 밀어붙이면 어색하므로, 보고 동사의 과거와 맞는 자연스러운 서술로 처리했습니다.
  doctrine_reference: 문체 및 의미 보존
