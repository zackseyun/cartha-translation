  edition: SBLGNT
  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
  footnotes:
  - marker: a
    text: Or 'the Judeans' or, contextually, 'the Jewish leaders.' In John, this term often refers to a particular group opposing Jesus, not to every Jewish person without distinction.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이 때문에 유대인들은 예수를 박해하고 있었습니다. 이는 그가 안식일에 이런 일들을 하고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 사람들’ 혹은 문맥상 ‘유대 지도자들’일 수 있습니다. 요한복음에서 이 표현은 흔히 예수를 반대하는 특정 집단을 가리키며, 모든 유대인을 구분 없이 뜻하는 것은 아닙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: because of this
  chosen_korean: 그리고 이 때문에
  alternatives_korean:
  - 그래서
  - 이런 까닭에
  lexicon: BDAG
  rationale: 직전 문맥의 사건을 원인으로 되받는 표현이므로, 단순한 결과 연결보다 원인성을 드러내는 ‘이 때문에’가 적절합니다.
- source_word: ἐδίωκον
  english_pob_choice: were persecuting
  chosen_korean: 박해하고 있었습니다
  alternatives_korean:
  - 뒤쫓고 있었습니다
  - 핍박하고 있었습니다
  lexicon: BDAG
  rationale: 요한복음 문맥에서 διώκω는 단순 추적보다 적대적 압박을 뜻하므로, 지속성을 살린 진행형으로 ‘박해하고 있었습니다’를 택했습니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들은
  alternatives_korean:
  - 유대 사람들은
  - 유대 지도자들은
  lexicon: BDAG
  rationale: 원문은 특정 집단을 지칭하는 표준 복수형이므로, 본문에는 직접적 대응인 ‘유대인들’로 두고 지나친 해석적 축소는 피했습니다.
- source_word: ἐν σαββάτῳ
  english_pob_choice: on the Sabbath
  chosen_korean: 안식일에
  alternatives_korean:
  - 어느 안식일에
  - 안식일 동안
  lexicon: BDAG
  rationale: 무관사 단수형이지만 한국어에서는 시간 부사로 ‘안식일에’가 가장 자연스럽고, 본문이 문제 삼는 율법적 시간 표지를 분명히 드러냅니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 범위와 오독 방지
  chosen_reading: 본문에는 ‘유대인들’을 유지하되, 특정 적대 집단으로 읽히도록 본문 안에서 별도 확장 설명은 하지 않았습니다.
  alternative_readings:
  - 유대 지도자들
  - 유대 사람들
  rationale: 원문 어휘를 보존하는 것이 우선이므로 본문은 직접 번역을 택했습니다. 다만 요한복음의 관용적 사용이 모든 유대인을 뜻하는 것으로 확장되지 않도록 주해적 장치가 아닌 본문 수준의 절제된 번역을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
