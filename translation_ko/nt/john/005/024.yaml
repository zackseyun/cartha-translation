id: JHN.5.24
reference: John 5:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
  footnotes:
  - marker: a
    text: Or 'does not come into condemnation.' The Greek κρίσις can mean 'judgment' generally or, in context, an adverse judgment.
    reason: lexical_alternative
  - marker: b
    text: 'The Greek perfect verb indicates a completed transition with continuing result: ''has passed over'' or ''has crossed over'' from death into life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로 진실로 여러분에게 말씀합니다. 내 말을 듣고 나를 보내신 분을 믿는 사람은 영생을 얻으며, 심판으로 들어오지 않고 오히려 죽음에서 생명으로 옮겨졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정죄로 들어오지 않고’. 헬라어 κρίσις는 일반적인 ‘심판’이나, 문맥상 불리한 판결을 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 완료시제는 전환이 이미 끝났고 그 결과가 계속됨을 나타냅니다. 곧 ‘건너갔다’ 또는 ‘건너온 상태이다’의 뉘앙스입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로 진실로
  alternatives_korean:
  - 아멘 아멘
  - 참으로 참으로
  lexicon: BDAG
  rationale: 두 번 반복된 서두의 강조를 자연스러운 현대 한국어로 살리면서도, 구어체로 가볍게 흐르지 않도록 했습니다.
- source_word: ὁ τὸν λόγον μου ἀκούων
  english_pob_choice: whoever hears my word
  chosen_korean: 내 말을 듣고
  alternatives_korean:
  - 내 말씀을 듣고
  - 내 메시지를 듣고
  lexicon: BDAG
  rationale: λόγος는 여기서 예수의 발화된 말씀/메시지를 가리키므로, 요한복음의 반복되는 ‘말씀’ 어휘를 살리되 한국어에서는 현재 문맥에 가장 자연스러운 ‘말’로 옮겼습니다.
- source_word: πιστεύων τῷ πέμψαντί με
  english_pob_choice: believes him who sent me
  chosen_korean: 나를 보내신 분을 믿는
  alternatives_korean:
  - 나를 보내신 이를 믿는
  - 나를 보내신 분을 신뢰하는
  lexicon: BDAG
  rationale: 여기서 πιστεύω는 목적어를 취해 ‘~을 믿다’의 의미이므로, ‘믿는 분/이를’로 직접 옮겨 수식 관계를 분명히 했습니다.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  english_pob_choice: does not come into judgment
  chosen_korean: 심판으로 들어오지 않고
  alternatives_korean:
  - 판결로 들어오지 않고
  - 정죄로 들어오지 않고
  lexicon: BDAG
  rationale: κρίσις는 문맥에 따라 부정적 판결일 수 있지만, 어휘 자체는 더 넓은 ‘심판’을 뜻하므로, 최종 결과를 미리 확정하는 ‘정죄’보다 더 절제된 표현을 택했습니다.
- source_word: μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  english_pob_choice: has passed from death into life
  chosen_korean: 죽음에서 생명으로 옮겨졌습니다
  alternatives_korean:
  - 죽음에서 생명으로 건너갔습니다
  - 죽음에서 생명으로 옮겨져 있습니다
  lexicon: BDAG
  rationale: 완료시제가 나타내는 이미 이루어진 전환과 그 결과의 지속성을 한국어 완료·피동 표현으로 자연스럽게 반영했습니다.
theological_decisions:
- issue: κρίσις의 범위
  chosen_reading: ‘심판’으로 옮기되, 여기서 곧바로 ‘정죄’로 좁히지 않습니다.
  alternative_readings:
  - 정죄
  - 판결
  rationale: 이 절은 구원의 약속을 말하지만, 명사 자체는 넓은 의미를 가지므로 한국어에서도 그 긴장을 유지하는 것이 본문에 더 충실합니다.
  doctrine_reference: Theological tension preserved rather than resolved.
- issue: 완료시제 μεταβέβηκεν의 구원론적 함의
  chosen_reading: ‘죽음에서 생명으로 옮겨졌습니다’로 현재적 효력을 지닌 완료된 전환을 드러냅니다.
  alternative_readings:
  - 장차 옮겨질 것입니다
  - 이미 지나갔습니다
  rationale: 현재 소유된 영생과 이미 일어난 전환이라는 본문의 시제 대비를 살려, 장래만을 가리키는 해석으로 축소하지 않았습니다.
  doctrine_reference: Maintain verbal aspect without denominational overstatement.
