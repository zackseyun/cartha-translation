  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
  footnotes:
  - marker: a
    text: Or, “that he had already had this condition a long time.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서는 이 사람이 누워 있는 것을 보시고, 그가 이미 오랫동안 그러한 상태에[a] 있음을 아시고 그에게 말씀하셨습니다. “낫고 싶으십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이미 오랫동안 그곳에 있었음을.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  english_pob_choice: this man
  chosen_korean: 이 사람
  alternatives_korean:
  - 이 사람
  - 그 사람
  - 이 자
  lexicon: BDAG
  rationale: 지시대명사가 문맥상 바로 앞의 병자를 가리키므로, 한국어에서는 자연스럽게 ‘이 사람’으로 풀어 특정 인물을 드러냈습니다.
- source_word: κατακείμενον
  english_pob_choice: lying there
  chosen_korean: 누워 있는 것을
  alternatives_korean:
  - 누워 있는
  - 드러누워 있는
  - 거기 누워 있는 것을
  lexicon: BDAG
  rationale: 장소감과 자세를 함께 살리기 위해 ‘누워 있는’으로 옮기되, 문장 흐름상 목적절처럼 자연스럽게 연결했습니다.
- source_word: πολὺν ἤδη χρόνον ἔχει
  english_pob_choice: he had already been there a long time
  chosen_korean: 이미 오랫동안 그러한 상태에 있음을
  alternatives_korean:
  - 이미 오랫동안 그곳에 있었음을
  - 이미 오랫동안 병을 앓고 있음을
  - 이미 오랫동안 그러한 처지에 있음을
  lexicon: BDAG
  rationale: 직역하면 ‘이미 오랫동안 시간을 가지고 있다’는 식의 관용 표현이므로, 장소보다 지속된 상태를 드러내는 방향으로 자연스럽게 풀었습니다.
- source_word: ὑγιὴς γενέσθαι
  english_pob_choice: to become well
  chosen_korean: 낫고 싶으냐
  alternatives_korean:
  - 건강해지고 싶으냐
  - 온전해지고 싶으냐
  - 낫기를 원하느냐
  lexicon: BDAG
  rationale: ‘되다’의 ingressive 의미를 살리되, 치료 맥락에서 한국어로는 질문의 직접성과 의미가 가장 분명한 ‘낫고 싶으냐’가 적절합니다.
theological_decisions:
- issue: 예수의 앎(γνοὺς)의 성격
  chosen_reading: 예수께서 그가 오랫동안 그런 상태에 있음을 ‘아시고’라고만 옮겨, 그 지식이 초자연적이었는지 단순 관찰이었는지 단정하지 않았습니다.
  alternative_readings:
  - 초자연적으로 아셨습니다
  - 단순히 보고 아셨습니다
  rationale: 본문은 예수의 앎을 말할 뿐 그 수단을 설명하지 않으므로, 해석을 과도하게 규정하지 않고 본문의 절제된 진술을 유지했습니다.
  doctrine_reference: 본문이 허용하는 범위를 넘어 지식의 방식에 대한 교리를 결정하지 않음
