id: JHN.5.23
reference: John 5:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: ko
  text: 이는 모든 사람이 아버지를 공경하는 것처럼 아들을 공경하도록 하려는 것입니다. 아들을 공경하지 않는 자는 그를 보내신 아버지도 공경하지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  english_pob_choice: so that
  chosen_korean: 이는 … 하려는 것입니다
  alternatives_korean:
  - …하기 위함입니다
  - …하도록 하려는 것입니다
  lexicon: BDAG
  rationale: 목적/결과를 나타내는 ἵνα의 기능을 한국어에서 자연스럽고 격식 있게 옮기기 위해 ‘하려는 것입니다’를 택했습니다.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  english_pob_choice: honor
  chosen_korean: 공경하다
  alternatives_korean:
  - 존중하다
  - 영예를 돌리다
  lexicon: BDAG
  rationale: τιμάω는 단순한 존중보다 마땅한 존귀를 인정하는 뉘앙스가 있어, 한국어 성경 문맥에서 비교적 직접적인 ‘공경하다’가 반복되는 동사를 가장 잘 살립니다.
- source_word: τὸν υἱὸν / τὸν πατέρα
  english_pob_choice: the Son / the Father
  chosen_korean: 아들 / 아버지
  alternatives_korean:
  - 그 아들 / 그 아버지
  - 아드님 / 아버님
  lexicon: BDAG
  rationale: 이 본문에서는 예수와 하나님을 가리키는 호칭이지만, 한국어에서는 문맥상 명확하므로 일반적인 호칭형 ‘아들’, ‘아버지’로 충분히 전달됩니다.
- source_word: τὸν πέμψαντα αὐτόν
  english_pob_choice: who sent him
  chosen_korean: 그를 보내신
  alternatives_korean:
  - 그를 파송하신
  - 그를 보내신 분
  lexicon: BDAG
  rationale: πέμπω의 기본 의미는 ‘보내다’이므로, 선교적·공적 뉘앙스를 과도하게 덧붙이는 ‘파송하다’보다 ‘보내신’이 더 직접적입니다.
theological_decisions:
- issue: 아들과 아버지에 대한 동일한 공경의 요구
  chosen_reading: ‘아들을 아버지를 공경하듯 공경하게 하려는 것입니다’로 옮겨, καθὼς의 강한 비교를 약화시키지 않았습니다.
  alternative_readings:
  - ‘아들을 아버지만큼 공경하게 하려는 것입니다’
  - ‘아들을 아버지처럼 공경하게 하려는 것입니다’
  rationale: 원문의 비교는 단순 유사성이 아니라 아들과 아버지께 드려야 할 공경의 대응 관계를 강하게 세웁니다. 한국어에서도 이 긴장을 유지하는 것이 문맥과 신학을 더 정확히 드러냅니다.
  doctrine_reference: 요한복음 5:23의 그리스도론적 문맥
- issue: ‘그를 보내신 아버지’의 지시 대상
  chosen_reading: ‘그를 보내신’은 뒤의 ‘아버지’를 수식하는 말로 처리했습니다.
  alternative_readings:
  - ‘그를 보내신 분’
  - ‘보내신 아버지’
  rationale: 그리스어 분사구는 아버지를 규정하는 역할을 하므로, 한국어에서도 인칭 대명사보다 관계절적 수식을 써서 원문의 연결을 분명하게 했습니다.
  doctrine_reference: 요한복음의 파송 모티프
