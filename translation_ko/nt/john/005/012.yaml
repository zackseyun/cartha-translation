base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
  footnotes:
  - marker: a
    text: 'Greek: ''Take up and walk.'' The object (''it'') is implied from the previous context, referring to the mat or bedroll the man had been lying on.'
