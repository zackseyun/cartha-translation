translation:
  language: ko
  text: 그러자 그들이 그에게 물었습니다. “너에게 ‘들고 걸어라’고 말한 남자가 누구입니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν
  english_pob_choice: they asked
  chosen_korean: 물었습니다
  alternatives_korean:
  - 물어보았습니다
  - 질문했습니다
  lexicon: BDAG
  rationale: 과거 서술에서 가장 자연스럽고, 이어지는 대화 장면의 흐름을 살립니다.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι
  english_pob_choice: Who is the man who said to you
  chosen_korean: ‘…말한 사람이 누구입니까?’
  alternatives_korean:
  - ‘…말한 분이 누구입니까?’
  - ‘…말한 이가 누구입니까?’
  lexicon: BDAG
  rationale: ὁ ἄνθρωπος는 특정 남성 개인을 가리키므로 ‘사람’보다 ‘사람이’가 자연스럽고, 질문 형식은 합쇼체로 옮겼습니다.
- source_word: Ἆρον
  english_pob_choice: Pick it up
  chosen_korean: 집어 들고
  alternatives_korean:
  - 들어 올리고
  - 들어서
  lexicon: BDAG
  rationale: 앞문맥의 깔개/자리를 가리키는 목적어가 한국어에서는 생략되기 어려워, 행위의 의미를 자연스럽게 드러냈습니다.
- source_word: περιπάτει
  english_pob_choice: and walk
  chosen_korean: 걸어가라
  alternatives_korean:
  - 걷고 가라
  - 계속 걸어가라
  lexicon: BDAG
  rationale: 치유 명령의 문맥에서 단순한 보행 명령이므로, 영어 POB의 간결성을 살려 자연스러운 명령형으로 옮겼습니다.
