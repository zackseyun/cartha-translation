lexical_decisions:
- source_word: ὑμεῖς
  english_pob_choice: You
  chosen_korean: 여러분은
  alternatives_korean:
  - 당신들은
  - 여러분이
  lexicon: BDAG
  rationale: 본문의 2인칭 대명사는 동사가 이미 인칭을 표시하므로 문장 앞에서 주어를 드러내 강조만 살리면 됩니다. 합쇼체에서 자연스러운 공손한 직접 호칭으로 ‘여러분’을 택했습니다.
- source_word: ἀπεστάλκατε
  english_pob_choice: have sent
  chosen_korean: 사람을 보내셨고
  alternatives_korean:
  - 보내셨고
  - 파견하셨고
  lexicon: BDAG
  rationale: 완료형이므로 단순 과거보다 현재까지 이어지는 결과를 살려 ‘보내셨고’로 옮겼습니다. 한국어에서는 목적지를 향한 파송을 더 자연스럽게 나타내기 위해 ‘사람을’ 보충했습니다.
- source_word: μεμαρτύρηκε
  english_pob_choice: has testified
  chosen_korean: 증언하였습니다
  alternatives_korean:
  - 증언해 왔습니다
  - 증거하였습니다
  lexicon: BDAG
  rationale: 완료형의 지속적 증언을 반영하되, 현대 한국어에서 ‘증언하다’가 법정·증거 진술의 의미를 분명히 드러냅니다.
- source_word: τῇ ἀληθείᾳ
  english_pob_choice: to the truth
  chosen_korean: 진리에 대하여
  alternatives_korean:
  - 진리를 향하여
  - 진실에 대하여
  lexicon: BDAG
  rationale: 여격은 ‘...에 대하여’로 자연스럽게 풀 수 있고, 정관사 있는 ἀλήθεια는 단순한 사실성보다 특정한 ‘진리’를 가리키므로 그 명사성을 유지했습니다.
theological_decisions:
- issue: ‘진리’의 정관사와 요한 문맥의 신학적 울림
  chosen_reading: ‘진리’를 특정한 개념으로 유지하되 추가 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘진실’로 완화
  - ‘그 진리’로 명시화
  rationale: 본문은 정관사로 특정성을 띠지만, 여기서 그 진리가 무엇인지를 본절 안에서 해설하지는 않습니다. 따라서 한국어도 간결하게 ‘진리’로 남겨 요한 문맥의 긴장을 보존했습니다.
  doctrine_reference: 요한복음의 ‘진리’ 개념을 본문 범위 안에서 보존
