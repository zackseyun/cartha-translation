translation:
  language: ko
  text: 여러분은 요한에게 보내셨으며, 그는 진리에 대하여 증언해 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “진리에 대하여 증거해 왔습니다.”
