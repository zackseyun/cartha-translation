- from: 여러분은 요한에게 사람을 보내셨고, 그는 진리에 대하여 증언하였습니다.[a]
  to: 여러분은 요한에게 보내셨으며, 그는 진리에 대하여 증언해 왔습니다.[a]
  rationale: 명시되지 않은 목적어 ‘사람을’을 삭제하여 원문의 표현 범위를 보존했습니다. 두 완료형은 한국어의 ‘보내셨으며’와 특히 증언의 지속적 효력을 나타내는 ‘증언해 왔습니다’로 반영했습니다. ‘진리’는 유지하고, 각주는 영어 POB 감사 기록의 μαρτυρέω 어휘 대안을 한국어로 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:55Z'
review_pass:
  verdict: revise
  source_fidelity: ‘사람을’은 요한복음 1:19의 문맥상 파견된 대표자들을 가리킬 수 있으나, 본절의 그리스어에는 목적어가 명시되어 있지 않습니다. 이를 보충하더라도 단수 ‘사람’으로 특정하는 것은 불필요하게 범위를 좁힙니다. 또한 μεμαρτύρηκε의 완료상은 한국어에서 ‘증언해 왔습니다’로 더 잘 드러낼 수 있습니다.
  naturalness: 합쇼체의 ‘여러분은 … 보내셨으며’와 ‘증언해 왔습니다’는 자연스럽고, ‘요한에게 보내셨으며’의 목적어 생략은 한국어에서도 문맥상 가능합니다. 다만 ‘사람을’보다 원문에 더 가까운 표현입니다.
  terminology: ‘진리’는 τῇ ἀληθείᾳ의 요한복음적 울림과 정관사에 따른 특정성을 과도하게 해석하지 않고 유지합니다. μαρτυρέω는 ‘증언하다’로 일관되게 옮깁니다.
  issues:
  - severity: medium
    issue: 원문에 없는 단수 목적어 ‘사람을’의 보충
    rationale: ἀπεστάλκατε에는 파견 대상이 명시되지 않았습니다. 문맥상 대표단을 뜻할 수 있으나, 단수 ‘사람’을 본문에 넣으면 원문이 말하지 않은 수와 대상을 특정합니다.
  - severity: low
    issue: 각주가 영어 POB의 어휘 대안과 일치하지 않음
    rationale: 영어 감사 기록의 각주는 μαρτυρέω에 대한 ‘has borne witness’라는 어휘 대안입니다. 현 각주는 한국어 시제 설명만 제공하여 해당 대안을 반영하지 못합니다.
  revised_text: 여러분은 요한에게 보내셨으며, 그는 진리에 대하여 증언해 왔습니다.[a]
