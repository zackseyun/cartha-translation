  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: δόξαν παρὰ ἀνθρώπων οὐ λαμβάνω,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
  footnotes:
  - marker: a
    text: Or 'honor' or 'praise' for 'glory.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'from men'; the term can also mean 'from people' or 'from human beings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 사람들에게서 영광을 받지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람들로부터’입니다. ἀνθρώπων은 문법적으로 남성 복수형이지만, 여기서는 일반적 인간을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 칭찬
  - 명예
  lexicon: BDAG
  rationale: δόξα는 여기서 사람들로부터 주어지는 평가나 찬사를 가리키므로, 문맥상 ‘영광’이 가장 직접적입니다. 요한복음의 ‘영광’ 어휘와도 연결을 살리면서, 인간의 인정이라는 뜻을 자연스럽게 담습니다.
- source_word: παρὰ ἀνθρώπων
  english_pob_choice: from men
  chosen_korean: 사람들에게서
  alternatives_korean:
  - 사람에게서
  - 인간에게서
  lexicon: BDAG
  rationale: παρά + 속격은 출처를 나타내므로 ‘~에게서’로 옮기는 것이 맞습니다. ἀνθρώπων의 남성 복수 형태는 표지로 보존하되, 한국어에서는 자연스러운 포괄 표현인 ‘사람들’로 옮겼습니다.
- source_word: λαμβάνω
  english_pob_choice: receive
  chosen_korean: 받다
  alternatives_korean:
  - 받아들이다
  - 취하다
  lexicon: BDAG
  rationale: λαμβάνω는 여기서 ‘받다/받아들이다’의 의미로 쓰이며, 인간의 영광을 출처로부터 ‘받는’ 행위를 직접적으로 표현하는 ‘받다’가 가장 간결합니다.
theological_decisions:
- issue: 예수의 진술이 인간의 인정 전체를 절대적으로 부정하는지 여부
  chosen_reading: 예수는 자신의 사명과 정체성이 사람의 찬사에 의존하지 않는다고 말씀하십니다.
  alternative_readings:
  - 예수는 어떤 인간에게서도 영광을 전혀 받지 않는다고 절대적으로 말씀하십니다.
  rationale: 문맥상 핵심은 인간의 평가를 근거로 자신을 세우지 않는다는 뜻이지, 모든 인간의 존중 가능성을 철학적으로 부정하는 것은 아닙니다. 따라서 본문은 그 긴장을 유지한 채 직역에 가깝게 보존합니다.
  doctrine_reference: 문맥 우선 해석 유지
