translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “일어나십시오. 네 매트[a]를 드십시오. 그리고 걸으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 κράβαττος는 단순한 잠자리용 깔개나 휴대용 매트를 가리키며, 반드시 일반적인 침대를 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  english_pob_choice: says
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말합니다
  - 말씀합니다
  lexicon: BDAG
  rationale: 요한복음의 현재시제 서술 기능을 한국어에서는 자연스러운 과거 서술로 옮기되, 예수의 직접 발화를 공손하게 나타내기 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: Ἔγειρε
  english_pob_choice: Get up
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어나십시오
  - 일어나세요
  lexicon: BDAG
  rationale: 즉각적인 기상 동작을 자연스럽게 나타내기 위해 명령형 의미를 살리면서도 한국어에서는 행위 전체를 이끄는 ‘일어나서’로 옮겼습니다.
- source_word: ἆρον
  english_pob_choice: pick up
  chosen_korean: 들고
  alternatives_korean:
  - 집어 들고
  - 메고
  lexicon: BDAG
  rationale: κράβαττος를 무겁고 영구적인 ‘침대’가 아니라 휴대 가능한 깔개로 이해해야 하므로, 물리적으로 ‘들다’는 의미를 간결하게 살렸습니다.
- source_word: τὸν κράβαττόν
  english_pob_choice: mat
  chosen_korean: 매트
  alternatives_korean:
  - 돗자리
  - 깔개
  - 침상
  lexicon: BDAG
  rationale: 영어 POB가 지적한 대로 κράβαττος는 단순한 잠자리용 깔개에 가깝기 때문에, 현대 한국어에서 오해를 줄이는 ‘매트’를 선택했습니다.
- source_word: περιπάτει
  english_pob_choice: walk
  chosen_korean: 걸어가십시오
  alternatives_korean:
  - 걸으십시오
  - 다니십시오
  lexicon: BDAG
  rationale: 단순한 보행 명령을 자연스럽게 전달하기 위해 ‘걸어가십시오’로 옮겼으며, 치료가 암시되더라도 본문 자체의 명령을 넘어서는 해설을 덧붙이지 않았습니다.
theological_decisions:
- issue: 치유의 의미를 본문에 덧붙일지 여부
  chosen_reading: 본문의 세 동사를 그대로 명령문으로 옮기고, ‘치유되라’ 같은 해석적 문구는 넣지 않았습니다.
  alternative_readings:
  - ‘일어나서 치유받으십시오’
  - ‘일어나서 건강해지십시오’
  rationale: 그리스어 본문은 일어나기, 깔개를 들기, 걷기의 명령만 제시하므로, 치유 결과는 문맥에서 이해하되 번역어에 삽입하지 않는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy: Never paraphrase beyond what the source text warrants.'
