id: JHN.5.36
reference: John 5:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
  footnotes:
  - marker: a
    text: Or 'witness greater than John's.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 요한의 증언보다[a] 더 큰 증언을 가지고 있습니다. 아버지께서 내가 그것들을 완성하도록 내게 주신 일들, 곧 내가 하고 있는 바로 그 일들이 나에 관하여, 곧 아버지께서 나를 보내셨다는 것을 증언합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요한의 증언보다 더 큰 증거를’.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρίαν
  english_pob_choice: testimony
  chosen_korean: 증언
  alternatives_korean:
  - 증거
  - 증언 내용
  lexicon: BDAG
  rationale: 요한복음에서 μαρτυρία는 단순한 정보보다 인격적·법정적 증언의 의미를 띱니다. 한국어에서는 ‘증거’보다 ‘증언’이 그 증언 행위와 내용의 뉘앙스를 함께 살립니다.
- source_word: μείζω τοῦ Ἰωάννου
  english_pob_choice: greater than John's
  chosen_korean: 요한의 증언보다 더 큰
  alternatives_korean:
  - 요한보다 더 큰
  - 요한의 것보다 더 큰
  lexicon: BDAG
  rationale: 원문의 비교 대상은 사람 요한 자체라기보다 그의 증언입니다. 한국어에서도 비교 대상을 명시해 ‘요한의 증언보다’라고 옮겨, 생략된 의미를 자연스럽게 드러냈습니다.
- source_word: ἔργα ... αὐτὰ τὰ ἔργα ἃ ποιῶ
  english_pob_choice: works / these very works that I am doing
  chosen_korean: 일들 — 내가 바로 하고 있는 이 일들
  alternatives_korean:
  - 일들 — 내가 하는 바로 그 일들
  - 역사들 — 내가 하고 있는 이 역사들
  lexicon: BDAG
  rationale: ἔργα는 요한복음에서 예수의 표적과 사역 전체를 포괄할 수 있어, ‘일들’로 비교적 넓게 살렸습니다. 반복된 αὐτά τὰ ἔργα는 ‘이 일들’과 삽입 부호로 강조를 살렸습니다.
- source_word: τελειώσω
  english_pob_choice: to complete
  chosen_korean: 이루라고
  alternatives_korean:
  - 완성하라고
  - 마치라고
  lexicon: BDAG
  rationale: ἵνα+접속법은 목적을 나타냅니다. ‘이루다’는 단순히 끝내는 것보다 맡겨진 일을 목적대로 성취한다는 뉘앙스를 담아, 아버지께서 주신 사역의 완결성을 살립니다.
- source_word: ἀπέσταλκεν
  english_pob_choice: has sent
  chosen_korean: 보내셨기 때문입니다
  alternatives_korean:
  - 보내셨습니다
  - 파송하셨기 때문입니다
  lexicon: BDAG
  rationale: 완료형의 지속적 효력을 한국어 현재완료식으로 살리기보다는, 문맥상 이유 절로 자연스럽게 옮겼습니다. ‘보내다’가 ‘파송하다’보다 현대 한국어에서 덜 경직되면서도 파송의 의미를 충분히 전달합니다.
theological_decisions:
- issue: 아버지의 ‘일들’이 무엇을 가리키는가
  chosen_reading: 아버지께서 예수에게 맡기신 사역 전체가 증언으로 기능하며, 표적만이 아니라 그가 지금 수행하는 모든 일이 아버지의 파송을 입증합니다.
  alternative_readings:
  - 기적들만이 증언한다
  - 단순한 행위의 예시일 뿐이다
  rationale: 본문은 ἔργα를 단순히 기적으로 좁히지 않고, ‘주신 일들’과 ‘내가 하고 있는 이 일들’을 병렬로 두어 증언의 근거를 넓게 제시합니다. 이를 한국어도 그대로 유지했습니다.
  doctrine_reference: 'Affirmations; Translation philosophy #3'
