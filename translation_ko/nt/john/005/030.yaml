  source_fidelity: ‘내게서’는 한국어에서 ἀπ’ ἐμαυτοῦ(‘나 자신에게서/독립하여’)의 뜻을 자연스럽게 전달하지 못하며, ‘내게로부터’처럼 들릴 수 있습니다. 또한 현 문장의 ‘…뜻을 구하기 때문입니다’는 인과절이 바로 앞의 ‘보내신 분의 뜻을 구함’에만 걸리는 것으로 읽혀, 판단이 공정한 이유 전체를 명료하게 연결하지 못합니다.
