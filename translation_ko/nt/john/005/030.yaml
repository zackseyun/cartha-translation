id: JHN.5.30
reference: John 5:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
  footnotes:
  - marker: a
    text: Or 'I can do nothing on my own.' The Greek phrase can emphasize acting independently; here it is rendered 'from myself' to preserve the sense of source as well as independence.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 스스로[a] 아무것도 할 수 없습니다. 나는 듣는 대로 심판하며, 내 심판이 공정한 것은 내가 내 뜻이 아니라 나를 보내신 분의 뜻을 구하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나 자신에게서’. 이는 단지 혼자 행동한다는 뜻이 아니라, 자신에게서 나온 독립적인 근거로 행동하지 않음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  english_pob_choice: I am not able
  chosen_korean: 나는 ... 할 수 없습니다
  alternatives_korean:
  - 나는 할 수 없습니다
  - 나는 능히 할 수 없습니다
  lexicon: BDAG
  rationale: δύναμαι의 부정 능력을 한국어의 가능 표현으로 자연스럽게 옮기되, ἐγώ의 강조는 주어를 앞세워 살렸습니다.
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  english_pob_choice: to do anything from myself
  chosen_korean: 내게서 아무것도 할 수 없습니다
  alternatives_korean:
  - 스스로 아무것도 할 수 없습니다
  - 내 힘으로는 아무것도 할 수 없습니다
  lexicon: BDAG
  rationale: ἀπ’ ἐμαυτοῦ의 ‘출처/근원’ 뉘앙스를 살려 ‘내게서’로 옮겼고, 독립적 행위를 가리키는 문맥을 한국어로 간결하게 표현했습니다.
- source_word: κρίνω / ἡ κρίσις ἡ ἐμή
  english_pob_choice: I judge / my judgment
  chosen_korean: 심판하다 / 내 심판
  alternatives_korean:
  - 판단하다 / 내 판단
  - 재판하다 / 내 재판
  lexicon: BDAG
  rationale: 요한복음의 κρίσις 계열을 일관되게 살리기 위해 ‘심판’을 택했고, δικαία와 함께 판정의 공정성을 드러내도록 했습니다.
- source_word: δικαία
  english_pob_choice: just
  chosen_korean: 공정합니다
  alternatives_korean:
  - 의롭습니다
  - 정당합니다
  lexicon: BDAG
  rationale: 재판적 문맥에서 ‘just’의 의미를 한국어로 가장 자연스럽게 드러내는 말은 ‘공정하다’입니다. 여기서는 도덕적 칭찬보다 판단의 올바름을 강조합니다.
- source_word: τὸ θέλημα τὸ ἐμὸν / τὸ θέλημα τοῦ πέμψαντός με
  english_pob_choice: my own will / the will of the one who sent me
  chosen_korean: 내 뜻 / 나를 보내신 분의 뜻
  alternatives_korean:
  - 내가 원하는 것 / 나를 보내신 이의 뜻
  - 제 뜻 / 저를 보내신 분의 뜻
  lexicon: BDAG
  rationale: θέλημα은 ‘뜻’이 가장 직접적이며, ‘내 own will’의 대비를 자연스럽게 살리기 위해 ‘내 뜻’을 유지했습니다. πέμψαντός με는 관계 서술을 그대로 따라 ‘나를 보내신 분’으로 옮겼습니다.
theological_decisions:
- issue: ἀπ’ ἐμαυτοῦ의 신학적 함의
  chosen_reading: ‘내게서’로 옮겨, 독립적 자율성이 아니라 근원과 출처의 부정을 드러냈습니다.
  alternative_readings:
  - 스스로
  - 혼자서
  rationale: 이 표현은 아들의 무능을 절대적으로 말하기보다 아버지와 분리된 자율적 행위를 부정합니다. 본문의 신학적 긴장을 유지하기 위해 설명을 본문에 덧붙이지 않았습니다.
  doctrine_reference: 니케아 신경(381), 칼케돈 신조(451)
