    rationale: 한국어에는 정관사 대립이 없으므로 영어의 ‘a/the Sabbath’ 대안을 그대로 재현하기 어렵습니다. 대신 전치사구를 포함한 그리스어의 직역적 어순을 설명하는 주석이 유익합니다.
