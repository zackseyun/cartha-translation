id: JHN.5.9
reference: John 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
  footnotes:
  - marker: a
    text: Or 'took up his bed.' The Greek κράβαττον refers to a simple mat, pallet, or sleeping pad rather than necessarily a full bed.
    reason: lexical_alternative
  - marker: b
    text: Or 'was walking.' The Greek imperfect can emphasize continued action; here it may also be understood as the beginning of his walking after being healed.
    reason: lexical_alternative
  - marker: c
    text: Or 'the Sabbath.' The Greek reads literally 'it was Sabbath on that day.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 곧바로 그 사람은 나았습니다[a]. 그는 자기 매트를 들어 올리고[b] 걷기 시작했습니다. 그런데 그날은 안식일이었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나아졌습니다.’ 헬라어 ἐγένετο ὑγιὴς는 문자적으로 ‘건강해졌다/나아졌다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘들어 올렸습니다.’ κράβαττον은 단단한 침대가 아니라 단순한 깔개나 침상용 매트를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘안식일이었습니다.’ 헬라어는 문자적으로 ‘그날은 안식일이었다’에 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  english_pob_choice: immediately
  chosen_korean: 곧바로
  alternatives_korean:
  - 즉시
  - 바로
  lexicon: BDAG
  rationale: 치유가 일어난 순간성을 자연스럽게 드러내면서도 현대 한국어 문장 흐름에 잘 맞는 표현입니다.
- source_word: ἐγένετο ὑγιὴς
  english_pob_choice: became well
  chosen_korean: 나았습니다
  alternatives_korean:
  - 건강해졌습니다
  - 온전해졌습니다
  - 잘 되었습니다
  lexicon: BDAG
  rationale: 직역형의 ‘되었다’보다 치유 결과를 분명히 드러내는 자연스러운 한국어로, 상태의 회복을 잘 전달합니다.
- source_word: κράβαττον
  english_pob_choice: mat
  chosen_korean: 매트
  alternatives_korean:
  - 돗자리
  - 깔개
  - 침상
  lexicon: BDAG
  rationale: 단순한 휴대용 깔개를 가리키므로, 현대 독자가 형상을 쉽게 떠올릴 수 있는 ‘매트’를 택했습니다.
- source_word: περιεπάτει
  english_pob_choice: began to walk
  chosen_korean: 걷기 시작했습니다
  alternatives_korean:
  - 걷고 있었습니다
  - 걸었습니다
  lexicon: BDAG
  rationale: 미완료 시상의 계속/개시 뉘앙스를 살리되, 이 치유 문맥에서는 ‘걷기 시작했습니다’가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: σάββατον
  english_pob_choice: a Sabbath
  chosen_korean: 안식일
  alternatives_korean:
  - 그 안식일
  - 하루 안식일
  lexicon: BDAG
  rationale: 무관사 표현이라도 한국어에서는 관사 구별이 없으므로, 문맥상 규정된 유대교적 거룩한 날을 표준적으로 ‘안식일’로 옮겼습니다.
theological_decisions:
- issue: 안식일 표현의 범주
  chosen_reading: ‘그날은 안식일이었습니다’로 옮겨, 날의 성격을 설명문처럼 제시했습니다.
  alternative_readings:
  - ‘그날은 한 안식일이었습니다’
  - ‘그날은 안식일이었습니다’
  rationale: 본문은 서술적 시간 표시이므로, 불필요한 신학적 강조 없이 사건 배경을 자연스럽게 알리는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
