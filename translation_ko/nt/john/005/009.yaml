  lexicon: BDAG
  rationale: 무관사 표현이라도 한국어에서는 관사 구별이 없으므로, 문맥상 규정된 유대교적 거룩한 날을 표준적으로 ‘안식일’로 옮겼습니다.
theological_decisions:
- issue: 안식일 표현의 범주
  chosen_reading: ‘그날은 안식일이었습니다’로 옮겨, 날의 성격을 설명문처럼 제시했습니다.
  alternative_readings:
  - ‘그날은 한 안식일이었습니다’
  - ‘그날은 안식일이었습니다’
  rationale: 본문은 서술적 시간 표시이므로, 불필요한 신학적 강조 없이 사건 배경을 자연스럽게 알리는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §1, §6
