  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
  footnotes:
  - marker: a
    text: Or 'his letters.' The Greek word can denote letters or writings; here it refers to what Moses wrote.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그분의 글을 믿지 않으신다면, 어떻게 내 말을 믿으시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘글’은 γράμμα의 가능한 뜻 가운데 하나로, 여기서는 모세가 쓴 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  english_pob_choice: But if
  chosen_korean: 그런데 … 않으신다면
  alternatives_korean:
  - 하지만 … 않으시면
  - 그런데 … 믿지 않으신다면
  lexicon: BDAG
  rationale: 앞절과의 대조를 살리기 위해 문두는 전환 표현 ‘그런데’로, 조건은 ‘-지 않으신다면’으로 자연스럽게 옮겼습니다.
- source_word: τοῖς ἐκείνου γράμμασιν
  english_pob_choice: his writings
  chosen_korean: 그분의 글
  alternatives_korean:
  - 그의 글
  - 그분의 기록
  - 그의 글들
  lexicon: BDAG
  rationale: γράφμμα는 ‘글/기록/편지’의 폭이 있으나 여기서는 문맥상 모세가 쓴 것을 가리키므로, 한국어에서는 ‘글’로 넓게 살리되 문맥상 대상이 분명한 ‘그분의’로 처리했습니다.
- source_word: οὐ πιστεύετε / πιστεύσετε
  english_pob_choice: you do not believe / you believe
  chosen_korean: 믿지 않으신다면 / 믿으시겠습니까
  alternatives_korean:
  - 믿지 않으시면 / 믿으시겠습니까
  - 믿지 않으신다면 / 믿게 되시겠습니까
  lexicon: BDAG
  rationale: πιστεύω는 여기서 ‘신뢰’보다 ‘믿다’가 직접적이며, 두 절의 평행을 살려 같은 어근으로 유지했습니다.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  english_pob_choice: my words
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 말들
  - 내가 하는 말
  lexicon: BDAG
  rationale: ῥῆμα는 발화된 말이나 말씀을 가리키므로, 예수의 발화 문맥에서 한국어로는 간결한 ‘내 말’이 가장 자연스럽고 대조 구조도 잘 드러냅니다.
theological_decisions:
- issue: ‘그분의’의 지시 대상
  chosen_reading: ‘그분’은 바로 앞 문맥의 모세를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 보다 일반적인 제3자 지시
  - 명시적으로 ‘모세의 글’로 풀어쓰기
  rationale: 직전 절들에서 모세가 이미 명시되어 있으므로, 본문은 지시대명사를 유지하되 한국어에서 오해 없도록 ‘그분’으로 옮겼습니다.
  doctrine_reference: 문맥 지시대명사 처리
