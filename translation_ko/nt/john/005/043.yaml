revisions:
- from: 제가 아버지의 이름으로 왔는데도 여러분은 저를 받아들이지 않습니다. 다른 이가 자기 이름으로 오면, 여러분은 그를 받아들일 것입니다.[a][b]
  to: 제가 제 아버지의 이름으로[a] 왔지만, 여러분은 저를 받아들이지 않습니다. 다른 이가 자기 이름으로[b] 오면, 여러분은 그를 받아들일 것입니다.
  rationale: 소유격 μου를 ‘제’로 반영하고, 원문에 없는 강한 양보를 피하도록 ‘왔는데도’를 ‘왔지만’으로 고쳤습니다. 두 ‘이름으로’ 구문의 평행과 λαμβάνω의 반복은 유지했으며, 각주 표지를 각 해당 구문에 정확히 연결했습니다.
