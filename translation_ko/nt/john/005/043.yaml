id: JHN.5.43
reference: John 5:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
  footnotes:
  - marker: a
    text: Or 'with my Father's authority.' The Greek idiom 'in the name' can denote representation or authority as well as the name itself.
    reason: lexical_alternative
  - marker: b
    text: Or 'on his own authority.' The phrase 'in his own name' contrasts sharply with Jesus' coming 'in my Father's name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 제 아버지의 이름으로[a] 왔지만, 여러분은 저를 받아들이지 않습니다. 다른 이가 자기 이름으로[b] 오면, 여러분은 그를 받아들일 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 아버지의 권위로’. 그리스어 관용구 ‘이름으로’는 이름 자체뿐 아니라 대표성이나 권위를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 권위로’. ‘자기 이름으로’는 앞의 ‘제 아버지의 이름으로’와 강하게 대조됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  english_pob_choice: have come
  chosen_korean: 왔는데도
  alternatives_korean:
  - 와 있습니다
  - 왔습니다
  lexicon: BDAG
  rationale: 완료 시상의 현재적 결과를 자연스러운 한국어로 살리기 위해 단순 과거보다 현재에 남아 있는 도착 상태를 드러내는 ‘왔는데도’를 택했습니다.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  english_pob_choice: in my Father's name
  chosen_korean: 아버지의 이름으로
  alternatives_korean:
  - 아버지의 권위로
  - 아버지를 대표하여
  lexicon: BDAG
  rationale: ‘이름 안에서/으로’라는 관용구를 본문에서 그대로 살려, 대표·권위의 함의를 지나치게 좁히지 않고 유지했습니다.
- source_word: λαμβάνετέ με
  english_pob_choice: you do not receive me
  chosen_korean: 저를 받아들이지 않습니다
  alternatives_korean:
  - 저를 받지 않습니다
  - 저를 영접하지 않습니다
  lexicon: BDAG
  rationale: 요한복음의 ‘받다/받아들이다’ 의미를 살리되, 현대 한국어에서 문맥상 자연스러운 ‘받아들이지 않습니다’로 옮겼습니다.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  english_pob_choice: in his own name
  chosen_korean: 자기 이름으로
  alternatives_korean:
  - 자기 권위로
  - 자기 스스로의 이름으로
  lexicon: BDAG
  rationale: 앞절과의 평행을 유지하면서 ‘자기 이름으로’가 자의적 권한 주장까지 포함할 수 있도록 했습니다.
theological_decisions:
- issue: ‘아버지’가 가리키는 분을 본문에서 명시할지 여부
  chosen_reading: 본문은 직역적으로 ‘아버지’로 두고, 의미를 확정하는 추가 설명은 넣지 않았습니다.
  alternative_readings:
  - ‘하나님 아버지’로 풀어 씀
  - ‘아버지 하나님’으로 표시
  rationale: 요한문맥에서 분명히 하나님을 가리키지만, 그 해석은 본문 밖의 설명에 속하므로 번역문 자체는 원문의 호칭을 유지했습니다.
  doctrine_reference: Translation philosophy §6
- issue: ‘이름으로’ 관용구를 ‘권위로’로 풀지 여부
  chosen_reading: 본문에서는 관용구를 유지하고, 해석 가능성은 각주로 남겼습니다.
  alternative_readings:
  - ‘아버지의 권위로’/‘자기 권위로’
  rationale: 원문의 병렬 대비를 살리고, ‘이름’이 지닌 대표·권위의 범위를 좁히지 않기 위해 직역적 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §3
