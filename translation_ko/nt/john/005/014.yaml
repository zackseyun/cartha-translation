id: JHN.5.14
reference: John 5:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
  footnotes:
  - marker: a
    text: Or, more literally, “After these things.”
    reason: lexical_alternative
  - marker: b
    text: Greek “you have become well,” emphasizing the man's restored condition as the result of what has happened.
    reason: lexical_alternative
  - marker: c
    text: The warning does not explicitly state whether the earlier illness was caused by a specific sin, nor whether the “worse” outcome is temporal suffering, final judgment, or both.
    reason: alternative_reading
translation:
  language: ko
  text: 그 후에[a] 예수께서 그를 성전에서 찾아내시고 그에게 말씀하셨습니다. “보십시오, 나았습니다.[b] 당신에게 더 나쁜 일이 생기지 않도록, 더는 죄를 짓지 마십시오.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하면, “이 일들 후에.”
    reason: lexical_alternative
  - marker: b
    text: 그리스어 “당신은 건강하게 되었습니다.” 완료형은 일어난 변화의 결과로 현재 회복된 상태를 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 이 경고는 이전의 병이 특정 죄 때문에 생겼는지, 또 ‘더 나쁜 일’이 현세의 고난, 최종 심판, 또는 둘 다를 가리키는지를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  english_pob_choice: After these things
  chosen_korean: 그 후에
  alternatives_korean:
  - 이 일들 후에
  - 이후에
  lexicon: BDAG
  rationale: 복수 지시어 ταῦτα의 서술적 연결을 살리되, 한국어에서는 자연스러운 시간 연결어인 ‘그 후에’로 옮겼습니다.
- source_word: ὑγιὴς γέγονας
  english_pob_choice: you have become well
  chosen_korean: 당신은 나았습니다
  alternatives_korean:
  - 당신은 건강해졌습니다
  - 당신은 온전해졌습니다
  - 당신은 잘 되었습니다
  lexicon: BDAG
  rationale: 완료 시제가 드러내는 변화 후의 상태를 한국어에서 간명하게 표현했습니다. ‘나았습니다’는 치유의 결과 상태를 자연스럽게 담되, 과도하게 해석하지 않습니다.
- source_word: μηκέτι ἁμάρτανε
  english_pob_choice: Sin no more
  chosen_korean: 더는 죄를 짓지 마십시오
  alternatives_korean:
  - 이제 더는 죄짓지 마십시오
  - 계속 죄짓지 마십시오
  lexicon: BDAG
  rationale: μηκέτι와 현재 명령형의 결합은 행위를 중단하라는 뜻이므로, 직역적이면서도 한국어 명령으로 자연스러운 ‘더는 죄를 짓지 마십시오’로 옮겼습니다.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  english_pob_choice: so that something worse may not happen to you
  chosen_korean: 그리하여 당신에게 더 나쁜 일이 생기지 않게 하십시오
  alternatives_korean:
  - 그리하여 당신에게 더 나쁜 것이 일어나지 않게 하십시오
  - 그래서 당신에게 더 악화된 일이 없게 하십시오
  lexicon: BDAG
  rationale: ἵνα μὴ의 목적/결과 뉘앙스를 살려 ‘그리하여’로 연결했고, χεῖρόν σοί τι와 γένηται는 ‘당신에게 더 나쁜 일이 생기지 않게’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 예수의 경고가 이전 질병의 직접 원인으로서의 특정 죄를 전제하는지 여부
  chosen_reading: 본문이 말하는 범위를 넘어서 원인-결과를 확정하지 않고, 다만 앞으로의 죄와 ‘더 나쁜 일’ 사이의 경고를 그대로 유지했습니다.
  alternative_readings:
  - 이전 병이 특정 죄의 직접적 형벌이었다고 단정하는 읽기
  - ‘더 나쁜 일’을 단지 현세적 고통으로만 제한하는 읽기
  - ‘더 나쁜 일’을 최종 심판으로만 한정하는 읽기
  rationale: 그리스어는 죄를 짓지 말라는 경고와 더 나쁜 결과 가능성은 분명히 말하지만, 그 ‘더 나쁜 일’의 성격과 과거 질병과의 직접적 인과를 명시하지 않습니다. 번역은 이 긴장을 보존해야 합니다.
  doctrine_reference: 본문이 허용하는 범위 안에서만 인과를 말하고, 신학적 긴장을 보존함
