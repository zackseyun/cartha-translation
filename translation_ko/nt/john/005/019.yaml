  to: 그러므로 예수께서 그들에게 대답하여 말씀하셨습니다. “진실로 진실로 여러분에게 말합니다. 아들은 아버지께서 하시는 것을 보지 않고서는 스스로 아무것도 할 수 없습니다. 아버지께서 무엇을 하시든지, 아들도 그것을 똑같이 하십니다.”
