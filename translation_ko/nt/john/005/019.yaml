id: JHN.5.19
reference: John 5:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “the Son can do nothing on his own, except what he sees the Father doing.”
    reason: lexical_alternative
  - marker: b
    text: The statement describes the Son’s complete unity with and dependence on the Father in action; it should not be read as denying the Son’s full deity.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 그들에게 대답하여 말씀하셨습니다. “진실로 진실로 여러분에게 말합니다. 아들은 아버지께서 하시는 것을 보지 않고서는 스스로 아무것도 할 수 없습니다. 왜냐하면 아버지께서 하시는 것은 무엇이든지 아들도 그와 같이 하기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게 옮기면 “아들은 자기 스스로는 아무것도 할 수 없고, 아버지께서 하시는 것만 할 수 있습니다.”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ... καὶ ἔλεγεν
  english_pob_choice: So Jesus answered and said / was saying
  chosen_korean: 예수께서 그들에게 대답하여 말씀하셨습니다
  alternatives_korean:
  - 그래서 예수께서 대답하여 말씀하시며
  - 예수께서 대답하여 그들에게 이르셨습니다
  lexicon: SBLGNT
  rationale: οὖν의 연결과 ἔλεγεν의 발화 흐름을 자연스러운 한국어 서술로 옮기되, 반복적 진행상을 과도하게 드러내지 않고 응답-발화의 흐름을 살렸습니다.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  english_pob_choice: Truly, truly, I say to you
  chosen_korean: 진실로 진실로 여러분에게 말합니다
  alternatives_korean:
  - 아멘 아멘 여러분에게 말합니다
  - 진실로 진실로 내가 여러분에게 말합니다
  lexicon: BDAG
  rationale: 중복된 Ἀμὴν ἀμὴν의 강조를 살리면서도, 현대 한국어에서 이해가 쉬운 엄숙한 공식을 사용했습니다.
- source_word: οὐ δύναται ... ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  english_pob_choice: is not able to do anything from himself
  chosen_korean: 아들은 아버지께서 하시는 것을 보지 않고서는 스스로 아무것도 할 수 없습니다
  alternatives_korean:
  - 아들은 스스로 아무것도 할 수 없습니다
  - 아들은 자기 혼자서는 아무것도 할 수 없습니다
  lexicon: BDAG
  rationale: δύναται의 능력 불가능을 살리면서, ἐὰν μή 절의 문맥에 맞게 한국어에서는 '보지 않고서는'으로 조건을 자연스럽게 풀었습니다.
- source_word: τὸν πατέρα ποιοῦντα
  english_pob_choice: the Father doing it / the Father doing something
  chosen_korean: 아버지께서 하시는 것
  alternatives_korean:
  - 아버지께서 하고 계신 일
  - 아버지께서 하시는 그것
  lexicon: BDAG
  rationale: ποιεῖν/ποιοῦντα의 현재적 행위를 한국어의 관용적 '하시다'로 옮겨, 아버지의 활동성을 분명히 했습니다.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  english_pob_choice: for whatever that one does, these things the Son also does likewise
  chosen_korean: 왜냐하면 아버지께서 하시는 것은 무엇이든지 아들도 그와 같이 하기 때문입니다
  alternatives_korean:
  - 아버지께서 무엇을 하시든지 아들도 똑같이 하십니다
  - 그분이 하시는 것은 무엇이든지 아들도 똑같이 합니다
  lexicon: BDAG
  rationale: ἐκεῖνος의 지시적 대비를 한국어에서는 '아버지께서'로 명확히 하고, ταῦτα...ὁμοίως의 평행을 '그와 같이'로 간결하게 살렸습니다.
theological_decisions:
- issue: 아들의 불가능 진술이 종속론처럼 들릴 수 있는 문제
  chosen_reading: 아들은 아버지께서 하시는 것을 보지 않고서는 스스로 아무것도 할 수 없습니다
  alternative_readings:
  - 아들은 스스로 아무것도 할 수 없습니다
  - 아들은 자기 뜻으로는 아무것도 할 수 없습니다
  rationale: 본문은 아들의 본질적 열등이 아니라 아버지와의 행위상의 완전한 일치와 의존을 말합니다. 한국어도 이 기능적 진술을 유지하되, 신성 부정으로 읽히지 않도록 문맥을 반영했습니다.
  doctrine_reference: 요한복음의 성부-성자 관계; 니케아 신경(381)
