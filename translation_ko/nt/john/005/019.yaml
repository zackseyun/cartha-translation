  source_fidelity: 초안은 핵심 대구와 ‘스스로 아무것도 할 수 없다’는 능력 표현을 대체로 충실히 옮겼습니다. 그러나 οὖν의 연결을 본문에서 드러내지 않았고, 마지막 절의 ‘무엇이든지’와 ‘그와 같이’의 대응은 더 직접적으로 표현할 수 있습니다. υπάρ하는 각주도 원문의 ‘보다’라는 요소를 ‘아버지께서 하시는 것만 할 수 있다’로 바꾸어 설명하므로, 단순한 어휘 대안으로는 의미를 다소 재구성합니다.
  naturalness: ‘그러므로 예수께서 … 대답하여 말씀하셨습니다’와 ‘아버지께서 무엇을 하시든지, 아들도 그것을 똑같이 하십니다’는 표준어 현대 합쇼체에서 자연스럽고, 원문의 일반화 및 행위의 동일성을 명료하게 전달합니다.
