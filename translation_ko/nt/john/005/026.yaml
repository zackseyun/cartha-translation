id: JHN.5.26
reference: John 5:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
  footnotes:
  - marker: a
    text: Or 'gave the Son to have life in himself.' The Greek verb is the ordinary word for 'gave'; 'granted' is used in the main text for natural English and to reflect bestowed prerogative.
    reason: lexical_alternative
  - marker: b
    text: '''Life in himself'' may be understood as life intrinsic to one''s own being; the translation preserves the Greek wording rather than using the theological shorthand ''self-existent life.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지께서 자기 안에 생명을 가지고 계신 것처럼, 아들에게도 자기 안에 생명을 가지도록 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 안에 생명을 가지다’는 말은 생명이 그 자신의 존재 안에 있다는 뜻으로 이해할 수 있습니다. 본문은 이를 ‘자존적 생명’과 같은 신학 용어로 바꾸지 않고 원문의 표현을 따릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  english_pob_choice: For just as
  chosen_korean: —와 같이
  alternatives_korean:
  - 마치 —처럼
  - 바로 —처럼
  lexicon: BDAG
  rationale: 비교 구조를 자연스러운 한국어로 옮기되, 앞뒤 평행을 살리기 위해 ‘—와 같이’로 처리했습니다.
- source_word: ἔχει ζωὴν ἐν ἑαυτῷ
  english_pob_choice: has life in himself
  chosen_korean: 자기 안에 생명을 가지신 것
  alternatives_korean:
  - 스스로 생명을 가지신 것
  - 자기 안에 생명이 있으신 것
  lexicon: BDAG
  rationale: ‘생명을 가지다’와 ‘자기 안에’의 반복을 살려, 기술적 표현인 ‘자존적 생명’으로 바꾸지 않고 원문의 문구를 보존했습니다.
- source_word: ἔδωκεν
  english_pob_choice: granted
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주었습니다
  - 허락하셨습니다
  lexicon: BDAG
  rationale: 주시는 행위를 자연스러운 합쇼체로 옮기면서도, 단순한 전달보다 부여·수여의 뉘앙스를 살렸습니다.
- source_word: τῷ υἱῷ
  english_pob_choice: the Son
  chosen_korean: 아들
  alternatives_korean:
  - 그 아들
  - 아드님
  lexicon: BDAG
  rationale: 문맥상 예수에 대한 칭호이므로 ‘아들’로 옮기되, 한국어 문장에서는 자연스럽게 호칭의 무게를 유지했습니다.
theological_decisions:
- issue: ‘life in himself’를 신학적 술어로 바꿀지 여부
  chosen_reading: ‘자기 안에 생명을 가지다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 자존적 생명
  - 스스로 존재하는 생명
  rationale: 본문은 아버지와 아들이 각각 ‘자기 안에 생명’을 가지는 관계를 말하므로, 후대 신학 용어로 압축하지 않고 본문 표현 자체의 긴장을 보존했습니다.
  doctrine_reference: 요한복음의 아버지-아들 관계; 니케아 신앙고백과 양립 가능하되 본문 위에 용어를 덧씌우지 않음
- issue: ἔδωκεν을 ‘gave’보다 ‘granted’로 읽는 뉘앙스
  chosen_reading: ‘주셨습니다’로 번역해 부여된 권한/은혜의 성격을 남겼습니다.
  alternative_readings:
  - 주었습니다
  - 허락하셨습니다
  rationale: 아버지가 아들에게 생명을 ‘주셨다’는 진술을 약화시키지 않으면서, 단순 이전이 아니라 위임·수여의 성격도 드러내기 위해서입니다.
  doctrine_reference: 성자론을 훼손하지 않도록 본문 표현을 유지하는 번역 원칙
