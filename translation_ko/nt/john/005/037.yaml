revisions:
- from: 그리고 나를 보내신 아버지—그분께서 나에 대하여 증언하셨습니다. 여러분은 그분의 음성을 한 번도 들은 적이 없고 그분의 모습을 보신 적도 없습니다.[a][b]
  to: 또 나를 보내신 아버지, 바로 그분께서 나에 대하여 증언하셨습니다[a]. 여러분은 그분의 음성을 한 번도 들은 적이 없고 그분의 모습을 본 적도 없습니다[b].
  rationale: The revision preserves the Greek syntax and meaning while making the demonstrative emphasis explicit in idiomatic 합쇼체 Korean. It also relocates each footnote marker to its proper textual anchor and refines the εἶδος alternative to avoid unnecessary narrowing.
