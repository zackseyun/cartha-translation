translation:
  language: ko
  text: 또 나를 보내신 아버지, 바로 그분께서 나에 대하여 증언하셨습니다[a]. 여러분은 그분의 음성을 한 번도 들은 적이 없고 그분의 모습을 본 적도 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분 자신께서 나에 대하여 증언하셨습니다.’ 그리스어 ἐκεῖνος는 ‘나를 보내신 아버지’를 다시 가리키며 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분의 형상.’ 그리스어 εἶδος는 보이는 형상이나 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  english_pob_choice: the Father who sent me
  chosen_korean: 나를 보내신 아버지
  alternatives_korean:
  - 나를 보내신 아버지께서
  - 나를 파송하신 아버지
  lexicon: BDAG
  rationale: 관계절 의미를 한국어로 자연스럽게 살리되, 아버지의 정체성을 한정하는 힘을 유지했습니다. ‘파송하신’도 가능하지만, 본문에서는 ‘보내신’이 더 직접적입니다.
- source_word: ἐκεῖνος
  english_pob_choice: that one / has himself
  chosen_korean: 그분께서
  alternatives_korean:
  - 그분 자신께서
  - 그분이야말로
  lexicon: BDAG
  rationale: ἐκεῖνος의 강조를 한국어에서 어색하지 않게 전달하기 위해 대명사 강조를 살려 ‘그분께서’로 옮겼습니다. 단순한 ‘그분이’보다 문맥상 증언 주체를 더 분명히 드러냅니다.
- source_word: μεμαρτύρηκεν περὶ ἐμοῦ
  english_pob_choice: has testified about me
  chosen_korean: 나에 대하여 증언하셨습니다
  alternatives_korean:
  - 내게 대하여 증언하셨습니다
  - 나를 증언하셨습니다
  lexicon: BDAG
  rationale: μαρτυρέω의 법정적·증언적 의미를 ‘증언하다’로 유지했고, περὶ ἐμοῦ는 ‘나에 대하여’로 직역에 가깝게 살렸습니다. 완료 시제는 한국어 완료·존대 서술로 반영했습니다.
- source_word: εἶδος αὐτοῦ
  english_pob_choice: his form
  chosen_korean: 그분의 모습
  alternatives_korean:
  - 그분의 형체
  - 그분의 외모
  lexicon: BDAG
  rationale: εἶδος의 시각적 ‘형상/모습’ 범위를 과도하게 좁히지 않도록 ‘모습’을 선택했습니다. ‘형체’보다 현대 한국어에서 덜 경직되면서도 ‘appearance’로 과해석하지 않습니다.
theological_decisions:
- issue: 예수의 말에서 아버지의 증언과 인간의 인지 한계를 어떻게 드러낼지
  chosen_reading: 아버지를 직접 인칭으로 받되, 증언 주체를 강조하고 ‘음성’과 ‘모습’을 병렬로 유지했습니다.
  alternative_readings:
  - ‘그분이 친히 나에 대하여 증언하셨습니다’
  - ‘그분의 소리’와 ‘그분의 형상’
  rationale: 본문은 아버지가 예수의 증인이라는 사실과, 청중이 그분을 직접 감각적으로 알지 못했다는 대조를 분명히 합니다. ‘그분께서’와 ‘음성/모습’의 병렬은 이 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
