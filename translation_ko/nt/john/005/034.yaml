id: JHN.5.34
reference: John 5:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: ko
  text: 그러나 나는 사람에게서 증언을 받지 않습니다. 오히려 이런 것들을 말하는 것은 여러분이 구원을 받게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘사람에게서’입니다. 여기서 단수는 일반적인 인간 증언을 가리키며, 복수화하지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  english_pob_choice: from man
  chosen_korean: 사람에게서
  alternatives_korean:
  - 한 사람에게서
  - 사람으로부터
  - 인간에게서
  lexicon: BDAG
  rationale: παρά + 속격은 출처를 나타내므로 ‘에게서/로부터’로 옮겼고, 단수 ἀνθρώπου의 일반적 인간성을 살리기 위해 ‘사람’으로 번역했습니다.
- source_word: μαρτυρίαν
  english_pob_choice: testimony
  chosen_korean: 증언
  alternatives_korean:
  - 증거
  - 증언 내용
  - 증거 진술
  lexicon: BDAG
  rationale: 법정적·증거적 뉘앙스를 살리면서도 한국어에서 자연스러운 명사로 ‘증언’을 택했습니다. ‘증거’는 대상이 너무 넓고, ‘증언’은 행위자보다 내용에 초점을 두어 문맥에 맞습니다.
- source_word: ἵνα ὑμεῖς σωθῆτε
  english_pob_choice: so that you may be saved
  chosen_korean: 여러분이 구원을 받게 하려는 것입니다
  alternatives_korean:
  - 여러분이 구원받도록 하려는 것입니다
  - 여러분이 구원되게 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα의 목적을 드러내기 위해 ‘-하려는 것입니다’로 옮겼고, σωθῆτε는 수동의 의미를 살리면서도 한국어에서 자연스러운 ‘구원을 받다’로 번역했습니다.
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 이런 것들을
  alternatives_korean:
  - 이것들을
  - 이 일들을
  lexicon: BDAG
  rationale: 중성 복수의 복수성을 살리면서 앞선 증언 논쟁의 발언들을 가리키는 뉘앙스를 자연스럽게 전달하기 위해 ‘이런 것들’로 옮겼습니다.
theological_decisions:
- issue: σῴζω의 범위
  chosen_reading: 구원을 주는 종말론적·신학적 의미를 유지하되, 물리적 구출이나 특정 교리 모델로 좁히지 않았습니다.
  alternative_readings:
  - 도움을 받게 하려는 것입니다
  - 건짐을 받게 하려는 것입니다
  rationale: 요한복음에서 σωθῆτε는 단순한 구조 요청보다 더 넓은 구원의 의미를 지니므로, 본문의 신학적 무게를 보존하는 표현이 필요합니다.
  doctrine_reference: 요한복음의 구원 이해
