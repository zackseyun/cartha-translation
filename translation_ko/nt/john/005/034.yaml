revisions:
- from: 그러나 나는 사람에게서 증언을 받지 않습니다. 오히려 이런 것들을 말하는 것은 여러분이 구원을 받게 하려는 것입니다.[a]
  to: 그러나 나는 사람에게서 증언을 받지 않습니다. 다만 내가 이것들을 말하는 것은 여러분이 구원받도록 하려는 것입니다.
  rationale: 원문의 ‘그러나 … 다만’ 대조를 유지하고, ταῦτα의 복수 지시성을 ‘이것들’로 명확히 했습니다. 목적절은 σωθῆτε의 수동적 구원 의미를 보존하는 ‘구원받도록’으로 옮겼습니다. 필수적이지 않고 위치도 부정확한 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:52Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ταῦτα의 지시성을 ‘이런 것들’보다 ‘이것들’로 옮기는 편이 더 직접적이며, λέγω의 직접적인 발화를 ‘말하는 것은’이라는 명사절만으로 처리하기보다 원문의 대조와 목적을 분명히 드러내는 문장으로 다듬는 것이 좋습니다.
  naturalness: 초안은 합쇼체로 자연스럽지만, ‘오히려 이런 것들을 말하는 것은’은 한국어에서 다소 무겁고 ‘오히려’가 문장 전체의 논리 관계를 약간 어색하게 만듭니다. ‘다만 내가 이것들을 말하는 것은’이 자연스럽고 원문의 대조를 보존합니다.
  terminology: ‘증언’, ‘사람에게서’, ‘구원받도록’은 적절합니다. ‘구원을 받게 하려는’도 가능하지만, ‘구원받도록 하려는’이 수동적 구원 의미를 유지하면서 더 간결하고 자연스럽습니다.
  issues:
  - severity: low
    issue: ταῦτα를 ‘이런 것들’로 번역함
    rationale: ‘이런’은 종류나 성격을 가리키는 뉘앙스를 더할 수 있습니다. 문맥상 앞서 언급한 발언들을 가리키는 직시적 복수 표현인 ‘이것들’이 더 가깝습니다.
  - severity: low
    issue: 각주 위치와 필요성
    rationale: 각주는 ‘사람에게서’를 설명하지만 문장 끝에 붙어 있어 해당 어구와의 연결이 약합니다. 또한 본문 ‘사람에게서’ 자체가 단수의 일반적 용법을 충분히 자연스럽게 반영하므로 이 짧은 절에서는 각주가 필수적이지 않습니다.
  revised_text: 그러나 나는 사람에게서 증언을 받지 않습니다. 다만 내가 이것들을 말하는 것은 여러분이 구원받도록 하려는 것입니다.
