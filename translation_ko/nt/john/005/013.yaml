id: JHN.5.13
reference: John 5:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
  footnotes:
  - marker: a
    text: Or 'had withdrawn' or 'had slipped out.' The Greek verb suggests that Jesus departed unobtrusively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 나은 사람은 그가 누구인지 알지 못하였습니다. 예수께서 그곳에 무리가 있었기 때문에 몸을 피하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸을 피하셨다’, ‘슬쩍 빠져나가셨다’로 옮길 수 있습니다. 그리스어 동사는 예수께서 눈에 띄지 않게 떠나셨다는 뜻을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἰαθεὶς
  english_pob_choice: the man who had been healed
  chosen_korean: 나은 사람
  alternatives_korean:
  - 치유된 사람
  - 치유를 받은 사람
  - 나음을 입은 사람
  lexicon: BDAG
  rationale: ἰαθεὶς는 ‘치유되다/낫다’의 수동 분사로, 문맥상 이미 병에서 벗어난 사람을 가리키므로 자연스러운 현대 한국어 표현인 ‘나은 사람’으로 옮겼습니다.
- source_word: οὐκ ᾔδει
  english_pob_choice: did not know
  chosen_korean: 알지 못하였습니다
  alternatives_korean:
  - 몰랐습니다
  - 알지 못했습니다
  lexicon: BDAG
  rationale: οἶδα의 부정은 단순한 인지 부재를 나타내므로, 평이하고 격식을 갖춘 ‘알지 못하였습니다’가 가장 직접적입니다.
- source_word: ἐξένευσεν
  english_pob_choice: had withdrawn
  chosen_korean: 몸을 피하셨기 때문입니다
  alternatives_korean:
  - 물러나셨기 때문입니다
  - 자리를 피하셨기 때문입니다
  - 슬쩍 빠져나가셨기 때문입니다
  lexicon: BDAG
  rationale: ἐκνεύω는 눈에 띄지 않게 물러나다/빠져나가다의 뉘앙스를 가지므로, 예수님의 조용한 이탈을 드러내되 지나치게 구어적이지 않은 ‘몸을 피하셨기’로 옮겼습니다.
- source_word: ὄχλου ὄντος ἐν τῷ τόπῳ
  english_pob_choice: since there was a crowd in the place
  chosen_korean: 그곳에 무리가 있었기 때문에
  alternatives_korean:
  - 그곳에 무리가 있었으므로
  - 그 자리에 무리가 있었기 때문에
  - 그곳에 군중이 있었기 때문에
  lexicon: BDAG
  rationale: 분사구문은 원인/상황을 설명하므로 한국어에서는 자연스럽게 인과로 풀었습니다. ‘무리’가 본문의 ὄχλος에 가장 무난한 대응입니다.
theological_decisions:
- issue: 예수님의 ἐξένευσεν의 뉘앙스
  chosen_reading: 공개적으로 떠난 것이 아니라, 무리 가운데서 눈에 띄지 않게 몸을 피하신 것으로 표현했습니다.
  alternative_readings:
  - 떠나셨기 때문입니다
  - 물러나셨기 때문입니다
  rationale: 본문의 동사는 단순 이동보다 조용한 이탈을 시사하므로, 예수님의 행동 방식이 드러나도록 ‘몸을 피하셨기’로 번역했습니다.
  doctrine_reference: 복음서 서술의 세부 묘사와 예수님의 지혜로운 행보
