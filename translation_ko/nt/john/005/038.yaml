revisions:
- from: 그리고 당신에게는 그의 말씀이 여러분 안에 머물러 있지 않습니다[a]. 이는 그분이 보내신 이를 여러분이 믿지 않기 때문입니다.
  to: 또한 여러분 안에는 그의 말씀이 머물러 있지 않습니다[a]. 이는 그분이 보내신 이를 여러분은 믿지 않기 때문입니다.
  rationale: 원문의 복수 청자를 ‘여러분’으로 일관되게 반영했습니다. ‘또한’은 καί의 연결 기능을 자연스럽게 살리며, ‘여러분은’은 후반부의 강조된 ὑμεῖς를 보존합니다. 본문의 인과관계와 ‘머물다’의 지속성은 유지했고, 각주는 μένω의 요한복음적 대안을 분명하게 제시하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:59Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어는 복수 청자(ὑμῖν, ὑμεῖς)에게 ‘그의 말씀을 여러분 안에 머물러 있는 것으로 가지고 있지 않다’고 말하며, 그 이유를 그분이 보내신 이를 믿지 않기 때문이라고 제시합니다. 초안의 첫 구절 ‘당신에게는’은 단수여서 원문의 복수와 일치하지 않습니다.
  naturalness: ‘여러분 안에는 그의 말씀이 머물러 있지 않습니다’는 현대 표준어 합쇼체로 자연스럽고, 지속을 나타내는 μένοντα도 적절히 드러냅니다. ‘여러분은’은 원문의 강조된 주어 ὑμεῖς를 자연스럽게 반영합니다.
  terminology: λόγος는 이 문맥에서 ‘말씀’으로 옮기는 것이 적절합니다. μένω의 대안으로는 다소 교회적인 표현이지만 요한복음의 용례를 보존하는 ‘거하고 있는’을 각주로 제시할 수 있습니다. ‘그분이 보내신 이’는 아버지와 예수의 지시 관계를 해설 없이 유지합니다.
  issues:
  - severity: medium
    issue: 청자 대명사의 수가 불일치합니다.
    rationale: 원문 ὑμῖν과 ὑμεῖς는 모두 복수인데, 초안은 앞부분에서 ‘당신에게는’(단수)을 쓰고 뒷부분에서 ‘여러분’을 사용합니다. 복수로 통일해야 합니다.
  - severity: low
    issue: 각주의 대안 표현이 문장 성분으로 완결되지 않아 기능이 불명확합니다.
    rationale: ‘또는 여러분 안에 머물러 있는’은 주석으로는 원문의 분사구를 가리키지만, 번역 대안으로 더 분명하게 하려면 ‘여러분 안에 거하고 있는’처럼 해당 수식어구의 대안을 제시하는 편이 낫습니다.
  revised_text: 또한 여러분 안에는 그의 말씀이 머물러 있지 않습니다[a]. 이는 그분이 보내신 이를 여러분은 믿지 않기 때문입니다.
  revised_footnotes:
