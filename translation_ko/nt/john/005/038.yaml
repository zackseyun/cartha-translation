    text: Or 'abiding in you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 여러분 안에는 그의 말씀이 머물러 있지 않습니다[a]. 이는 그분이 보내신 이를 여러분은 믿지 않기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분 안에 거하고 있는’.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: BDAG
  rationale: 요한복음의 문맥에서는 하나님의 계시된 말씀을 가리키므로, 한국어에서는 교회적·성경적 어감이 있는 ‘말씀’이 가장 자연스럽고 정확합니다.
- source_word: μένoντα / μένω
  english_pob_choice: abiding / remaining
  chosen_korean: 머물러 있지
  alternatives_korean:
  - 남아 있지
  - 거하고 있지
  lexicon: BDAG
  rationale: 지속적으로 안에 머무는 상태를 나타내므로 ‘머물러 있다’가 합쇼체에서 의미를 잘 드러냅니다. ‘거하다’는 가능하지만 다소 교회어입니다.
- source_word: ὑμεῖς
  english_pob_choice: you
  chosen_korean: 여러분
  alternatives_korean:
  - 너희
  - 당신들
  lexicon: BDAG
  rationale: 예수의 책망 발화이지만 본문 전체의 공식성을 살리기 위해 복수 청자를 정중하게 지시하는 ‘여러분’을 택했습니다.
- source_word: πιστεύετε
  english_pob_choice: believe
  chosen_korean: 믿지 않기 때문입니다
  alternatives_korean:
  - 신뢰하지 않기 때문입니다
  - 믿지 않기 때문입니다
  lexicon: BDAG
  rationale: 요한복음에서 πιστεύω는 표준적으로 ‘믿다’로 옮기는 것이 가장 직접적이며, 여기서는 부정형으로 불신을 분명히 드러냅니다.
theological_decisions:
- issue: ‘그분이 보내신 이’의 지시 대상과 문장 논리
  chosen_reading: 아버지께서 보내신 이는 예수이며, 그분을 믿지 않는 사실이 곧 하나님의 말씀이 그들 안에 머물러 있지 않다는 근거로 제시됩니다.
  alternative_readings:
  - ‘그분이 보내신 이’를 일반적 선지자 전승으로 넓게 읽을 수 있음
  - 말씀이 ‘내면화되지 않았다’는 종교적 일반론으로 약화시킬 수 있음
  rationale: 문장은 관계적·인격적 대상을 분명히 하며, 불신이 말씀의 부재를 드러낸다는 요한복음의 긴장을 그대로 보존해야 합니다.
  doctrine_reference: Theological tension preserved; no doctrinal smoothing.
