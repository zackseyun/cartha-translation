id: JHN.5.21
reference: John 5:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
  footnotes:
  - marker: a
    text: Or 'makes alive' for both occurrences of 'gives life.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to whom he wills.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로, 아버지께서 죽은 사람들을 일으키시고 살리시는[a] 것처럼, 아들도 원하시는 이들을[b] 살리십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 두 곳의 ‘살리십니다’는 ‘생명을 주십니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘원하시는 이들을’은 ‘뜻하시는 이들을’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  english_pob_choice: For just as
  chosen_korean: …것과 같이
  alternatives_korean:
  - …처럼
  - …와 같이
  lexicon: BDAG
  rationale: 비교를 시작하는 ὥσπερ의 대응으로 자연스러운 ‘…것과 같이’를 쓰고, γάρ의 설명적 연결은 앞 문맥에 기대도록 처리했습니다.
- source_word: ὁ πατὴρ
  english_pob_choice: the Father
  chosen_korean: 아버지
  alternatives_korean:
  - 아버님
  - 하나님 아버지
  lexicon: BDAG
  rationale: 요한복음의 하나님 아버지를 가리키는 호칭이므로, 직역적이면서도 문맥상 분명한 ‘아버지’를 택했습니다.
- source_word: ἐγείρει τοὺς νεκρούς
  english_pob_choice: raises the dead
  chosen_korean: 죽은 사람들을 일으키시고
  alternatives_korean:
  - 죽은 자들을 일으키시고
  - 죽은 이들을 깨우시고
  lexicon: BDAG
  rationale: ἐγείρει는 부활 문맥에서 ‘일으키다’가 가장 직접적이며, τοὺς νεκρούς는 집합명사로서 ‘죽은 사람들’이 현대 한국어에서 자연스럽습니다.
- source_word: ζῳοποιεῖ
  english_pob_choice: gives them life / gives life
  chosen_korean: 살리십니다
  alternatives_korean:
  - 생명을 주십니다
  - 살게 하십니다
  lexicon: BDAG
  rationale: ζῳοποιέω의 핵심은 ‘생명을 주다/살리다’이므로, 반복되는 동사를 한국어의 동적 표현인 ‘살리시다’로 옮겨 생명 부여의 결과를 분명히 했습니다.
- source_word: οὓς θέλει
  english_pob_choice: to whom he wishes
  chosen_korean: 자기가 원하는 이들을
  alternatives_korean:
  - 자기가 뜻하시는 이들을
  - 원하시는 누구든지
  lexicon: BDAG
  rationale: οὓς θέλει는 대상 선택과 의지를 함께 드러내므로, ‘원하는 이들’로 자연스럽게 옮기되 주어는 문맥상 아들을 가리키도록 ‘자기가’로 분명히 했습니다.
theological_decisions:
- issue: 아버지와 아들의 병행적 생명 부여
  chosen_reading: 아버지와 아들이 모두 죽은 이들을 살리고 생명을 주는 동일한 능동을 병행으로 드러냈습니다.
  alternative_readings:
  - 아들이 아버지를 본받아 살립니다
  - 아들이 허락된 범위에서 살립니다
  rationale: 헬라어는 아버지의 행위와 아들의 행위를 의도적으로 나란히 놓아 강한 기독론적 대칭을 형성하므로, 그 긴장을 완화하지 않고 그대로 살렸습니다.
  doctrine_reference: '니케아 신조(381): 성자의 신적 위상에 대한 고백'
- issue: θέλει의 의지 표현
  chosen_reading: ‘자기가 원하는’으로 옮겨, 아들의 주권적 의지를 현대 한국어에서 자연스럽게 드러냈습니다.
  alternative_readings:
  - 자기가 뜻하시는
  - 자기가 원하시는
  rationale: ‘원하다’는 문맥의 의지성을 유지하면서도 지나치게 고어적인 ‘뜻하다/원하시다’보다 읽기 쉽습니다. 공손 표현은 주어가 아들이므로 보조 동사에서만 반영했습니다.
  doctrine_reference: 요한복음의 그리스도론적 문맥
