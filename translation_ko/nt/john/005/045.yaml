  source_fidelity: 본문은 μὴ δοκεῖτε의 금지, κατηγορέω의 법정적 ‘고발’, 그리고 모세에게 둔 지속된 희망을 대체로 충실히 옮깁니다. 다만 ἔστιν ὁ κατηγορῶν의 ‘고발하는 이가 있다’라는 도입·대조를 더 분명히 드러내는 편이 좋습니다.
  naturalness: 합쇼체는 적절합니다. ‘그에게 희망을 두었습니다’도 이해되지만, 성경 문맥의 신뢰·기대의 뜻에는 ‘그에게 소망을 두었습니다’가 조금 더 자연스럽고 관용적입니다.
  terminology: ‘아버지’, ‘고발’, ‘모세’, ‘소망’은 적절합니다. 각주 b의 ‘율법의 중재자이자 증인’ 및 미래의 ‘서게 됩니다’는 이 절의 직접 진술을 넘어가거나 현재분사의 표현과 어긋날 수 있으므로 절제해야 합니다.
  issues:
