id: JHN.5.45
reference: John 5:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
  footnotes:
  - marker: a
    text: Or 'Do not suppose that I will bring charges against you before the Father.'
    reason: lexical_alternative
  - marker: b
    text: That is, Moses—the one in whom they placed their confidence, especially as the mediator and witness of the law—will stand as their accuser.
    reason: cross_reference
translation:
  language: ko
  text: 내가 아버지 앞에서[a] 여러분을 고발할 것이라고 생각하지 마십시오. 여러분을 고발하는 이가 있습니다. 곧 모세[b]입니다. 여러분은 그에게 소망을 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 아버지께 여러분을 고발할 것이라고 생각하지 마십시오.’
    reason: lexical_alternative
  - marker: b
    text: 곧 여러분이 소망을 둔 모세가 여러분을 고발하는 이로 제시됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  english_pob_choice: Do not think
  chosen_korean: 생각하지 마십시오
  alternatives_korean:
  - 생각하지 마세요
  - 짐작하지 마십시오
  lexicon: BDAG
  rationale: μή와 현재 명령형 δοκεῖτε는 금지 명령으로 자연스럽게 들리며, ‘생각하다’가 현대 한국어에서 가장 직접적이고 분명합니다.
- source_word: κατηγορήσω
  english_pob_choice: I will accuse
  chosen_korean: 고발할 것이라고
  alternatives_korean:
  - 고소할 것이라고
  - 죄를 묻겠다고
  lexicon: BDAG
  rationale: κατηγορέω의 법정적 의미를 살려 ‘고발하다’를 택했습니다. ‘고소하다’도 가능하지만, 여기서는 예수께서 심판자가 아니라 고발자로 대조되므로 ‘고발하다’가 더 직접적입니다.
- source_word: πρὸς τὸν πατέρα
  english_pob_choice: before the Father
  chosen_korean: 아버지 앞에서
  alternatives_korean:
  - 아버지 앞에서
  - 아버지께
  lexicon: BDAG
  rationale: 고발 행위의 법정적 장면을 살리면서, πρός + 대격의 방향성을 한국어 관용으로 자연스럽게 옮겼습니다. ‘아버지께’보다 ‘아버지 앞에서’가 심문/재판의 뉘앙스를 더 잘 드러냅니다.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  english_pob_choice: there is one who accuses you
  chosen_korean: 여러분을 고발하는 이는
  alternatives_korean:
  - 여러분을 고발하는 사람이 있습니다
  - 여러분을 고발하는 자가 있습니다
  lexicon: BDAG
  rationale: 현재분사 ὁ κατηγορῶν의 지속적 성격을 ‘고발하는 이’로 살렸습니다. ‘있습니다’를 앞에 둘 수도 있지만, 한국어에서는 뒤로 보내도 문법상 자연스럽습니다.
- source_word: εἰς ὃν ὑμεῖς ἠλπίκατε
  english_pob_choice: in whom you have put your hope
  chosen_korean: 그에게 희망을 두었습니다
  alternatives_korean:
  - 그에게 소망을 두었습니다
  - 그 안에 희망을 두었습니다
  lexicon: BDAG
  rationale: εἰς + 인칭대명사와 ἐλπίζω의 결합을 한국어로는 ‘~에게 희망을 두다’로 옮기는 것이 가장 자연스럽습니다. ‘희망/소망’ 중에서는 문맥의 평이한 진술에 맞춰 ‘희망’을 택했습니다.
theological_decisions:
- issue: 예수의 역할을 ‘고발’로, ‘정죄’로 확대하지 않음
  chosen_reading: 예수께서 아니라, 모세가 그들을 고발하는 자로 제시됩니다.
  alternative_readings:
  - 내가 여러분을 정죄할 것입니다
  - 내가 여러분을 고소할 것입니다
  rationale: κατηγορέω는 ‘정죄하다’가 아니라 ‘고발하다/고소하다’의 범위에 있습니다. 본문이 말하는 법정적 긴장을 보존하되, 더 강한 최종 판결의 의미는 덧입히지 않았습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and lexical restraint.'
