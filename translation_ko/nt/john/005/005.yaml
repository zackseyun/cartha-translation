base_translation:
  language: en
  yaml_path: translation/nt/john/005/005.yaml
  text: Now there was a man there who had been in his sickness for thirty-eight years[a].
  footnotes:
  - marker: a
    text: Or 'in his weakness' or 'in his illness.' The Greek ἀσθένεια can refer broadly to physical weakness or sickness.
