translation:
  language: ko
  text: 거기에는 서른여덟 해 동안 병약한 상태에 있던 한 사람이 있었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘병을 앓던’ 또는 ‘약한 상태에 있던’. 헬라어 ἀσθένεια는 넓게는 신체적 약함이나 병을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  english_pob_choice: Now there was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 그리고 있었습니다
  - 그러나 있었습니다
  lexicon: BDAG
  rationale: δέ는 강한 대조보다 서술 전개를 잇는 약한 연결이므로, 한국어에서는 자연스러운 도입 표현으로 옮겼습니다.
- source_word: τις ἄνθρωπος
  english_pob_choice: a man
  chosen_korean: 한 사람
  alternatives_korean:
  - 한 남자
  - 어떤 사람
  lexicon: BDAG
  rationale: τις ἄνθρωπος는 특정 개인을 막연히 도입하므로, 문맥상 자연스럽고 성별을 유지하는 ‘한 사람’으로 옮겼습니다.
- source_word: ἐκεῖ
  english_pob_choice: there
  chosen_korean: 거기에는
  alternatives_korean:
  - 그곳에는
  - 거기 있었는데
  lexicon: BDAG
  rationale: 장면의 장소를 지시하는 부사이므로, 앞선 문맥의 장소를 이어 주는 ‘거기에는’이 가장 직접적입니다.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  english_pob_choice: in his sickness
  chosen_korean: 그의 병약함 가운데
  alternatives_korean:
  - 그의 병 가운데
  - 그의 약함 가운데
  - 그의 질병 가운데
  lexicon: BDAG
  rationale: ἀσθένεια는 ‘약함/병약함/질병’의 의미 범위를 가지므로, 병과 약함의 긴장을 함께 살리는 표현을 택했습니다. 끝의 ἐν은 상태를 나타내어 ‘가운데’로 풀었습니다.
theological_decisions:
- issue: ἀσθένεια의 의미 범위
  chosen_reading: 특정 병명으로 좁히지 않고, ‘병약함’으로 넓게 유지했습니다.
  alternative_readings:
  - 병
  - 질병
  - 약함
  rationale: 본문 자체는 질환의 명칭을 밝히지 않고 지속된 상태를 강조하므로, 어휘의 범위를 보존하는 것이 소스에 더 충실합니다.
  doctrine_reference: 본문 근거 중심 번역 원칙
