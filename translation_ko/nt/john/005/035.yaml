id: JHN.5.35
reference: John 5:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
  footnotes:
  - marker: a
    text: Or 'for a while.' The phrase means only for a limited time, not necessarily a literal hour.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 타오르고 빛나는 등불이었으며, 여러분은 잠시 그의 빛 가운데서 기뻐하고자 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠시’는 문자적인 한 시간이 아니라 제한된 기간을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  english_pob_choice: lamp
  chosen_korean: 등불
  alternatives_korean:
  - 램프
  - 등
  lexicon: BDAG
  rationale: λύχνος는 추상적 ‘빛’이 아니라 비추는 도구를 가리키므로, 요한의 증언자 역할을 드러내는 ‘등불’로 옮겼습니다.
- source_word: καιόμενος καὶ φαίνων
  english_pob_choice: was burning and shining
  chosen_korean: 타오르며 빛나는
  alternatives_korean:
  - 타올라 빛나는
  - 불타며 비추는
  lexicon: BDAG
  rationale: 두 분사는 지속적 상태와 발광 기능을 함께 나타내므로, 한국어에서도 병렬적으로 자연스러운 현재적 묘사로 살렸습니다.
- source_word: πρὸς ὥραν
  english_pob_choice: for a time
  chosen_korean: 한때
  alternatives_korean:
  - 잠시
  - 일시적으로
  lexicon: BDAG
  rationale: 이 관용구는 문자적 ‘한 시간’이 아니라 제한된 기간을 뜻하므로, 간결하게 ‘한때’로 처리했습니다.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  english_pob_choice: in his light
  chosen_korean: 그 빛 안에서
  alternatives_korean:
  - 그의 빛 가운데
  - 그 빛으로
  lexicon: BDAG
  rationale: ‘안에서’는 빛의 은유 속에 머물며 기뻐하는 이미지를 자연스럽게 살리면서도, 전치사의 관계를 유지합니다.
theological_decisions:
- issue: 세례 요한의 위상과 예수의 ‘빛’의 구별
  chosen_reading: 요한을 ‘등불’로 두어, 그가 빛 자체가 아니라 빛을 비추는 증언자임을 본문 그대로 드러냈습니다.
  alternative_readings:
  - 그는 빛이었습니다
  rationale: λύχνος와 φῶς의 구별은 요한복음의 신학적 긴장점이므로, 이를 평탄화하지 않고 유지했습니다.
  doctrine_reference: 요한복음의 증언자-그리스도 구별
