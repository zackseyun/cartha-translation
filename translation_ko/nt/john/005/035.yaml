  to: 그는 타오르고 빛나는 등불이었으며, 여러분은 잠시 그의 빛 가운데서 기뻐하고자 했습니다.[a]
  rationale: 인물 지시를 현대 한국어 문맥에 맞게 ‘그는’으로 다듬고, ‘기뻐하고자 했습니다’로 의지 동사와 강한 기쁨의 의미를 더 충실히 반영했습니다. πρὸς ὥραν은 ‘잠시’ 및 각주로, 문자적 한 시간이 아닌 제한된 기간이라는 뜻을 보존했습니다.
