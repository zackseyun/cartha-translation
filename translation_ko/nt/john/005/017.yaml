  text: But he answered them[a], “My Father is working until now, and I also am working.”
  footnotes:
  - marker: a
    text: Or, “My Father works until now, and I work.” The Greek present tense can be rendered as either simple present or progressive in English; the progressive was chosen to highlight ongoing action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 예수님께서 그들에게 대답하셨습니다. 「내 아버지께서는 지금까지 일하고 계시며, 나도 일합니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 현재 시제는 한국어에서 단순 현재형이나 진행 표현으로 옮길 수 있습니다. 여기서는 아버지의 활동이 지금까지 계속됨을 드러내기 위해 ‘일하고 계십니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀπεκρίνατο αὐτοῖς
  english_pob_choice: But he answered them
  chosen_korean: 그런데 예수님께서 그들에게 대답하셨습니다
  alternatives_korean:
  - 그는 그들에게 대답하셨습니다
  - 그러자 예수님께서 그들에게 말씀하셨습니다
  lexicon: SBLGNT / BDAG
  rationale: δέ의 대조적·전개적 뉘앙스를 ‘그런데’로 살리고, 중간태 대답 동사를 자연스러운 서술문으로 옮겼습니다.
- source_word: Ὁ πατήρ μου
  english_pob_choice: My Father
  chosen_korean: 내 아버지께서
  alternatives_korean:
  - 나의 아버지께서
  - 아버지께서
  lexicon: BDAG
  rationale: 예수님의 고유한 신적 호칭을 직접적으로 드러내기 위해 ‘내 아버지’로 옮기되, 한국어 문맥에 맞게 주격 조사와 존대를 갖추었습니다.
- source_word: ἕως ἄρτι ἐργάζεται
  english_pob_choice: is working until now
  chosen_korean: 지금까지 일하시니
  alternatives_korean:
  - 지금까지 일하십니다
  - 계속 일하십니다
  lexicon: BDAG
  rationale: ἕως ἄρτι의 ‘지금까지/이때까지’라는 지속성을 살리고, 현재 시제의 지속적 동작을 ‘일하시니’로 간결하게 반영했습니다.
- source_word: κἀγὼ ἐργάζομαι
  english_pob_choice: and I also am working
  chosen_korean: 나도 일합니다
  alternatives_korean:
  - 저도 일합니다
  - 그리고 저도 일하고 있습니다
  lexicon: BDAG
  rationale: κἀγώ의 덧붙임을 한국어의 ‘나도’로 자연스럽게 나타내어, 아버지의 일하심과 예수님의 일하심 사이의 평행을 유지했습니다.
theological_decisions:
- issue: 아버지의 현재적 일하심과 예수님의 현재적 일하심의 평행
  chosen_reading: 구절의 평행 구조를 해설 없이 그대로 드러내어, 아버지의 일하심과 예수님의 일하심이 나란히 이어지도록 번역했습니다.
  alternative_readings:
  - 안식일 논쟁을 암시하도록 해설적으로 다듬는 방식
  - 의미를 완화해 일반적 섭리 진술로 바꾸는 방식
  rationale: 본문은 현재 진행적 활동의 병렬을 통해 신학적 긴장을 형성하므로, 이를 평이화하거나 설명으로 풀지 않고 그대로 보존하는 것이 소스 충실도에 부합합니다.
  doctrine_reference: John 5:17; 번역 원칙 §3 신학적 긴장 보존
