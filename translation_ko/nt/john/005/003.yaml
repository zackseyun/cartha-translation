id: JHN.5.3
reference: John 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐν ταύταις κατέκειτο ⸀πλῆθος τῶν ἀσθενούντων, τυφλῶν, χωλῶν, ⸀ξηρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/003.yaml
  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
  footnotes:
  - marker: a
    text: Or 'withered.' The Greek literally means 'dry' or 'withered,' likely referring to withered or shriveled limbs.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳들에는 병든 사람들[a], 눈먼 사람들, 다리 저는 사람들, 그리고 [b]마른 사람들이 많이 누워 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아픈 사람들’.
    reason: lexical_alternative
  - marker: b
    text: 헬라어의 문자적 뜻은 ‘마른’ 또는 ‘오그라든’이며, 아마도 마르고 쪼그라든 팔다리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  english_pob_choice: In these
  chosen_korean: 그곳들에는
  alternatives_korean:
  - 이 안에는
  - 그 안에는
  lexicon: BDAG
  rationale: 앞 절의 못들/현관들을 가리키는 지시어를 한국어에서 자연스럽게 살리기 위해 장소 지시로 옮겼습니다.
- source_word: κατέκειτο
  english_pob_choice: lay
  chosen_korean: 누워 있었습니다
  alternatives_korean:
  - 엎드려 있었습니다
  - 놓여 있었습니다
  lexicon: BDAG
  rationale: 불완료 과거의 지속성을 살려 ‘누워 있었습니다’로 옮기되, 사람들의 병약한 상태를 드러내도록 했습니다.
- source_word: ἀσθενούντων
  english_pob_choice: the sick
  chosen_korean: 병든 사람들
  alternatives_korean:
  - 아픈 사람들
  - 병자들
  lexicon: BDAG
  rationale: 몸이 아픈 상태를 직접 드러내는 표현이 문맥의 병자 목록에 가장 잘 맞습니다.
- source_word: ξηρῶν
  english_pob_choice: paralyzed / withered
  chosen_korean: 마른 사람들
  alternatives_korean:
  - 오그라든 사람들
  - 마비된 사람들
  lexicon: BDAG
  rationale: 직역어로는 ‘마른/오그라든’이지만, 본문이 신체적 결함을 가리키므로 한국어 본문은 ‘마른 사람들’로 두고, 문자적 뉘앙스는 각주로 남겼습니다.
theological_decisions:
- issue: ξηρῶν의 신체 묘사 번역과 독해
  chosen_reading: 한국어 본문은 ‘마른 사람들’로 두어 원문의 ‘dry/withered’ 이미지를 보존했습니다.
  alternative_readings:
  - 마비된 사람들로 의역
  - 오그라든 사람들로 직역
  rationale: 본문이 단순히 증상을 분류하는 열거이므로, 해석을 앞서서 특정 질환명으로 고정하지 않고 원문의 형용사적 이미지를 살렸습니다.
  doctrine_reference: 본문주의와 과잉해석 회피
