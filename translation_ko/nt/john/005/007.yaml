id: JHN.5.7
reference: John 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: ko
  text: 병든 사람이 그에게 대답했습니다. 「주님, 물이 흔들릴 때 나를 못에 넣어 줄 사람이 없습니다. 제가 가는 동안에는 다른 사람이 저보다 먼저 내려갑니다」.
  philosophy: formal
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 선생님
  - 주인님
  lexicon: κύριος
  rationale: POB가 영어에서 Lord로 확정한 점을 따라, 예수께 드리는 직접 호칭으로는 현대 한국어의 경건한 호칭인 주님이 가장 자연스럽고 source-direct합니다.
- source_word: ἀσθενῶν
  english_pob_choice: the sick man
  chosen_korean: 병든 사람
  alternatives_korean:
  - 아픈 사람
  - 환자
  - 병자
  lexicon: ἀσθενέω
  rationale: 신체적 병약함을 드러내면서도 현대 한국어 문체에서 자연스러운 표현으로 옮겼습니다.
- source_word: κολυμβήθραν
  english_pob_choice: the pool
  chosen_korean: 못
  alternatives_korean:
  - 연못
  - 물웅덩이
  - 목욕탕
  lexicon: κολυμβήθρα
  rationale: 해당 어휘는 물을 담은 일정한 수조를 가리키므로, POB의 pool을 한국어 성경 문맥에 맞는 못으로 옮겼습니다.
- source_word: ταραχθῇ τὸ ὕδωρ
  english_pob_choice: when the water is stirred up
  chosen_korean: 물이 흔들릴 때
  alternatives_korean:
  - 물이 동요할 때
  - 물이 일렁일 때
  - 물이 뒤흔들릴 때
  lexicon: ταράσσω / ὕδωρ
  rationale: 능동적/물리적 동작을 과장하지 않고, 물의 움직임을 간결하게 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: 예수께 대한 호칭의 수준
  chosen_reading: 주님
  alternative_readings:
  - 주여
  - 선생님
  rationale: 본문의 Κύριε는 단순한 예의 호칭을 넘어 예수를 향한 경칭으로 읽히므로, POB의 Lord를 따라 주님으로 유지했습니다.
  doctrine_reference: 예수의 주되심(κύριος)과 정중한 직접 호칭
