id: JHN.5.29
reference: John 5:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
  footnotes:
  - marker: a
    text: Or 'the resurrection of condemnation' for 'the resurrection of judgment.' The Greek says 'judgment,' which is broader; 'condemnation' reflects an interpretive narrowing found in some translations.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 선한 일을 한 사람들은 생명의 부활로, 악한 일을 한 사람들은 심판의 부활[a]로 나올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정죄의 부활’. 그리스어는 ‘심판’이라고 말하며, 이 말은 더 넓은 뜻을 지닙니다. ‘정죄’는 일부 번역에서 보이는 해석적 축소입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  english_pob_choice: will come out
  chosen_korean: 나아갈 것입니다
  alternatives_korean:
  - 나올 것입니다
  - 밖으로 나올 것입니다
  - 나가게 될 것입니다
  lexicon: BDAG
  rationale: 무덤에서 나오는 문맥을 유지하면서도 한국어에서 너무 물리적·거친 느낌을 줄이지 않기 위해 ‘나아갈 것입니다’로 옮겼습니다.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  english_pob_choice: those who have done good
  chosen_korean: 선한 일을 한 사람들
  alternatives_korean:
  - 좋은 일을 한 사람들
  - 선한 것을 행한 사람들
  - 선을 행한 사람들
  lexicon: BDAG
  rationale: τὰ ἀγαθά의 실질적 의미를 한국어에서 자연스럽게 드러내기 위해 ‘선한 일’로 풀었고, 결과 상태를 가리키는 분사 구조는 ‘한 사람들’로 처리했습니다.
- source_word: τὰ φαῦλα πράξαντες
  english_pob_choice: those who have done evil
  chosen_korean: 악한 일을 한 사람들
  alternatives_korean:
  - 나쁜 일을 한 사람들
  - 악을 행한 사람들
  - 사악한 일을 한 사람들
  lexicon: BDAG
  rationale: φαῦλα의 도덕적 악함을 드러내되, 한국어에서 지나치게 강한 도덕적 해석을 덧씌우지 않도록 ‘악한 일’로 옮겼습니다.
- source_word: ἀνάστασιν ζωῆς / ἀνάστασιν κρίσεως
  english_pob_choice: the resurrection of life / the resurrection of judgment
  chosen_korean: 생명의 부활 / 심판의 부활
  alternatives_korean:
  - 생명으로의 부활 / 심판으로의 부활
  - 생명의 부활 / 판단의 부활
  - 생명에 이르는 부활 / 정죄의 부활
  lexicon: BDAG
  rationale: 두 구절의 대칭을 살리면서, κρίσις를 영어 POB의 문맥대로 넓은 ‘심판’으로 옮겨 ‘정죄’로 좁히지 않았습니다.
theological_decisions:
- issue: κρίσεως를 ‘정죄’로 좁힐지 ‘심판’으로 넓게 둘지
  chosen_reading: 심판의 부활
  alternative_readings:
  - 정죄의 부활
  - 판결의 부활
  rationale: 그리스어 κρίσις는 본문 자체에서 ‘정죄’보다 넓은 의미이므로, 결과를 미리 한정하지 않고 본문의 긴장을 보존하기 위해 ‘심판’으로 번역했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
