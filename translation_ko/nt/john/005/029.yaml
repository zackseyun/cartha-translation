- from: 그리고 선한 일을 한 사람들은 생명의 부활로 나아갈 것이며, 악한 일을 한 사람들은 심판의 부활로 나아갈 것입니다.[a]
  to: 그리고 선한 일을 한 사람들은 생명의 부활로, 악한 일을 한 사람들은 심판의 부활[a]로 나올 것입니다.
  rationale: 원문의 ἐκπορεύσονται와 직전 절의 무덤 문맥을 반영하여 ‘나아갈 것입니다’를 ‘나올 것입니다’로 고쳤습니다. 두 부활의 대조와 κρίσις의 넓은 의미는 유지했습니다. 각주 표지는 대안 번역의 대상인 ‘심판의 부활’에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:21:55Z'
review_pass:
  verdict: revise
  source_fidelity: ‘나아갈 것입니다’는 ἐκπορεύσονται가 가리키는 ‘나오다/나오게 되다’를 충분히 전달하지 못합니다. 바로 앞 절의 무덤에서 나오는 문맥에 맞추어 ‘나올 것입니다’로 고쳐야 합니다. 두 εἰς 구문의 대칭은 ‘생명의 부활로 … 심판의 부활로’로 보존할 수 있습니다.
  naturalness: ‘생명의 부활로, … 심판의 부활로 나올 것입니다’는 한국어 성경 문체에서도 자연스럽고, 합쇼체에도 맞습니다. ‘선한 일을 한/악한 일을 한 사람들’은 명료하고 현대 표준어로 무난합니다.
  terminology: ἀνάστασις는 ‘부활’, ζωή는 ‘생명’, κρίσις는 해석적으로 좁히지 않은 ‘심판’이 적절합니다. 대안 ‘정죄’는 각주에서만 제시하되, 본문보다 좁은 해석임을 밝혀야 합니다.
  issues:
  - severity: medium
    issue: ἐκπορεύσονται를 ‘나아갈 것입니다’로 번역함
    rationale: 이 동사는 이 문맥에서 죽은 이들이 무덤에서 ‘나오는’ 것을 뜻합니다. ‘나아가다’는 이동의 방향이나 진전을 암시하지만, 원문의 출현/나옴과 앞 절의 무덤 문맥을 흐리게 합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 놓여 있음
    rationale: 대안 번역은 ‘심판의 부활’(ἀνάστασιν κρίσεως)에 관한 것이므로 해당 어구 바로 뒤에 표지를 두는 편이 참조 대상이 더 분명합니다.
  revised_text: 그리고 선한 일을 한 사람들은 생명의 부활로, 악한 일을 한 사람들은 심판의 부활[a]로 나올 것입니다.
