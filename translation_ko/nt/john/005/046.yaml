id: JHN.5.46
reference: John 5:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐπιστεύετε Μωϋσεῖ, ἐπιστεύετε ἂν ἐμοί, περὶ γὰρ ἐμοῦ ἐκεῖνος ἔγραψεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
  footnotes:
  - marker: a
    text: Or 'you would trust me.' The same Greek verb is used in both clauses.
    reason: lexical_alternative
  - marker: b
    text: Or 'for that one wrote concerning me,' with 'that one' reflecting the emphatic demonstrative 'ἐκεῖνος.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세를 믿으셨더라면 나를 믿으셨을 것이니, 그가 바로 나에 관하여 기록하였기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿다’는 여기서 ‘신뢰하다’로도 옮길 수 있으나, 원문은 같은 동사를 두 절에 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: ἐκεῖνος의 강조를 살리면 ‘그 사람은’ 또는 ‘그가 바로’와 같이 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ ἐπιστεύετε Μωϋσεῖ
  english_pob_choice: For if you believed Moses
  chosen_korean: 모세를 믿으셨더라면
  alternatives_korean:
  - 모세를 믿었다면
  - 모세를 믿고 계셨다면
  lexicon: BDAG
  rationale: εἰ + 미완료 직설법과 뒤의 ἄν 절이 이루는 반사실 조건문을 한국어의 ‘-셨더라면 … -셨을 것이니’로 자연스럽게 옮겼습니다. πιστεύω는 여기서 모세를 ‘믿다’는 직접 목적 관계로 이해하는 것이 가장 자연스럽습니다.
- source_word: ἐπιστεύετε ἂν ἐμοί
  english_pob_choice: you would believe me
  chosen_korean: 나를 믿으셨을 것이니
  alternatives_korean:
  - 나를 믿으셨을 것입니다
  - 나를 신뢰하셨을 것이니
  lexicon: BDAG
  rationale: 같은 동사의 반복을 살려 ‘믿다’를 유지했고, dative ἐμοί를 ‘나를’로 옮겨 영어처럼 ‘믿다 in’의 의미를 덧붙이지 않았습니다.
- source_word: περὶ γὰρ ἐμοῦ
  english_pob_choice: for he wrote about me
  chosen_korean: 그가 바로 나에 관하여 기록하였기 때문입니다
  alternatives_korean:
  - 그가 나에 관하여 썼기 때문입니다
  - 그가 나에 대해 기록했기 때문입니다
  lexicon: BDAG
  rationale: περὶ + 속격의 ‘about/concerning’ 의미를 ‘나에 관하여’로 보존했고, ἔγραψεν은 문맥상 ‘기록하였다’도 가능하지만 모세의 성경 기록을 드러내기 위해 ‘기록하였’로 옮겼습니다.
- source_word: ἐκεῖνος
  english_pob_choice: he
  chosen_korean: 그가 바로
  alternatives_korean:
  - 그 사람은
  - 그는
  lexicon: BDAG
  rationale: 지시대명사의 강조를 한국어의 ‘바로’로 살려, 모세를 다시 가리키는 강조 효과를 반영했습니다.
theological_decisions:
- issue: 모세의 글이 예수를 가리킨다는 진술의 보존
  chosen_reading: ‘그가 바로 나에 관하여 기록하였기 때문입니다’로 직설적으로 옮겨, 모세의 기록이 예수를 증언한다는 주장 자체를 완화하지 않았습니다.
  alternative_readings:
  - ‘그가 나에 대해 기록했기 때문입니다’
  - ‘그가 나를 가리켜 기록했기 때문입니다’
  rationale: 원문은 특정 본문을 밝히기보다 모세의 기록 전체가 예수를 지시한다는 예수의 논지를 유지하므로, 번역도 그 긴장을 그대로 보존하는 편이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
