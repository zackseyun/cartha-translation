id: JHN.5.28
reference: John 5:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
  footnotes:
  - marker: a
    text: Or 'graves.' The Greek μνημεῖα can refer to burial places generally; 'tombs' was chosen to preserve the concrete image.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것을 놀라워하지 마십시오. 한 시간이 오고 있습니다. 그때에는 무덤들에 있는 모든 사람이 그의 음성을 들을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: μνημεῖα는 매장지나 무덤을 가리킬 수 있습니다. 여기서는 구체적인 장례 이미지를 살리기 위해 '무덤들'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  english_pob_choice: Do not marvel
  chosen_korean: 놀라워하지 마십시오
  alternatives_korean:
  - 놀라지 마십시오
  - 경탄하지 마십시오
  lexicon: BDAG
  rationale: μή와 함께하는 금지형을 현대 한국어의 공손한 금지로 옮겼습니다. '놀라워하다'는 'marvel'의 놀람과 경이의 뉘앙스를 비교적 잘 살리면서도 과도하게 구어적이지 않습니다.
- source_word: τοῦτο
  english_pob_choice: this
  chosen_korean: 이것을
  alternatives_korean:
  - 이 일을
  - 이를
  lexicon: BDAG
  rationale: 앞선 진술을 가리키는 직접목적어로서 가장 투명하게 옮겼습니다.
- source_word: ἔρχεται ὥρα
  english_pob_choice: an hour is coming
  chosen_korean: 한 시간이 오고 있습니다
  alternatives_korean:
  - 때가 오고 있습니다
  - 시간이 오고 있습니다
  lexicon: BDAG
  rationale: 요한복음의 ὥρα를 '때'로 완화하기보다, 영어 POB의 선택을 따라 시간적 도래를 직역에 가깝게 보존했습니다. 현재형으로 미래의 확실한 임박성을 드러냈습니다.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  english_pob_choice: all who are in the tombs
  chosen_korean: 무덤들에 있는 모든 사람
  alternatives_korean:
  - 무덤들에 있는 모든 이
  - 무덤에 있는 모든 사람
  lexicon: BDAG
  rationale: μνημεῖα의 구체적 매장 장소 이미지를 살리되, 한국어에서는 '무덤들에 있는'으로 자연스럽게 풀어 옮겼습니다. '모든 사람'은 πάντες의 실질적 주어 기능을 반영합니다.
- source_word: τῆς φωνῆς αὐτοῦ
  english_pob_choice: his voice
  chosen_korean: 그의 음성
  alternatives_korean:
  - 그의 소리
  - 그의 음성의 소리
  lexicon: BDAG
  rationale: φωνή는 단순한 소리보다 인격적 발화를 가리키므로 '음성'이 더 정확합니다. 예수의 말씀하는 권위를 드러내는 데도 적합합니다.
theological_decisions:
- issue: 무덤/매장지 이미지의 보존
  chosen_reading: '''무덤들''로 옮겨 장례·매장 장소의 구체성을 유지했습니다.'
  alternative_readings:
  - '''묘지들'''
  - '''무덤'''
  rationale: 본문은 부활을 암시하지만 그 의미를 설명으로 풀기보다, 본문이 제시하는 구체적 이미지를 그대로 남겨 두는 것이 더 충실합니다.
  doctrine_reference: 부활 암시를 보존하되 본문 밖의 해석을 덧붙이지 않음
