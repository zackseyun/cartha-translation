  source_fidelity: 수정이 필요합니다. 초안의 ‘한 시간이 오고 있습니다. 그때에는’은 ὥρα를 한국어에서 부자연스러운 수량 단위인 ‘한 시간’으로 이해하게 하며, ὅτι가 나타내는 앞 명령의 근거 관계도 약화합니다. ὥρα는 여기서 특정한 때/시간을 뜻하므로 ‘때가 오고 있습니다’가 충실합니다. ‘무덤들에 있는 모든 사람’과 ‘그의 음성’은 원문의 복수 μνημείοις 및 τῆς φωνῆς αὐτοῦ를 적절히 반영합니다.
  naturalness: ‘한 시간이 오고 있습니다’는 한국어에서 지속 시간(60분)이 다가온다는 뜻으로 우선 읽혀 문맥상 어색합니다. ‘무덤들에 있는 모든 사람이 그의 음성을 들을 때가 오고 있습니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 연결도 보존합니다.
