  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
  footnotes:
  - marker: a
    text: Or 'who bears witness about me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 다른 이가 나에 관하여 증언합니다[a]. 나는 그가 나에 관하여 하는 증언이 참되다는 것을 압니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나에 관하여 증거합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  english_pob_choice: another
  chosen_korean: 또 다른 이
  alternatives_korean:
  - 다른 사람
  - 한 사람 더
  lexicon: BDAG
  rationale: ἄλλος는 앞의 증언과 구별되는 ‘또 다른’ 인물을 가리키므로, 단순히 ‘다른 사람’보다 관계적 대비가 드러나는 표현이 적절합니다.
- source_word: ὁ μαρτυρῶν
  english_pob_choice: who testifies
  chosen_korean: 증언하고 계십니다
  alternatives_korean:
  - 증언합니다
  - 증언하고 있습니다
  lexicon: BDAG
  rationale: 현재분사 형태의 지속적·현재적 뉘앙스를 살리면서, 한국어에서는 자연스러운 현재 진행/현재상 표현으로 옮겼습니다.
- source_word: περὶ ἐμοῦ
  english_pob_choice: about me
  chosen_korean: 나에 대해
  alternatives_korean:
  - 나에 관하여
  - 나를 두고
  lexicon: BDAG
  rationale: περί + 속격의 주제·대상 의미를 현대 한국어에서 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: ἡ μαρτυρία ἣν μαρτυρεῖ
  english_pob_choice: the testimony which he testifies
  chosen_korean: 그가 나에 대해 증언하는 증언
  alternatives_korean:
  - 그가 나에 대해 하는 증언
  - 그가 증언하는 증거
  lexicon: BDAG
  rationale: 동사 μαρτυρεῖ와 명사 μαρτυρία의 어근 반복을 살리기 위해 ‘증언/증언’의 중첩을 유지했습니다. 영어 POB가 유지한 반복 효과를 한국어에서도 드러내려는 선택입니다.
- source_word: ἀληθής
  english_pob_choice: 'true'
  chosen_korean: 참되다
  alternatives_korean:
  - 진실하다
  - 진짜다
  lexicon: BDAG
  rationale: 문맥상 증언의 성질을 말하므로 ‘참되다’가 가장 자연스럽고, 사실성·신뢰성을 함께 담을 수 있습니다.
theological_decisions:
- issue: ‘또 다른 이’의 정체를 본문 수준에서 특정할지 여부
  chosen_reading: 본문이 밝히지 않는 한 특정 인물을 이름으로 확정하지 않고, 그대로 ‘또 다른 이’로 유지했습니다.
  alternative_readings:
  - 세례자 요한
  - 아버지 하나님
  - 법정적 증인 일반
  rationale: 주변 문맥이 해석을 돕더라도, 번역문 자체는 본문의 명시적 수준을 넘어서지 않도록 하여 해석을 강요하지 않았습니다.
  doctrine_reference: 본문의 긴장과 개방성을 보존
