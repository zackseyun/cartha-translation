id: JHN.5.20
reference: John 5:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
  footnotes:
  - marker: a
    text: Or 'so that you will marvel.' The Greek ἵνα with the subjunctive can express purpose and, in context, may also imply the resulting astonishment of Jesus' hearers.
    reason: alternative_reading
translation:
  language: ko
  text: 아버지께서는 아들을 사랑하셔서, 자신이 하시는 모든 것을 그에게 보여 주십니다. 또 이보다 더 큰 일들을 그에게 보여 주실 것입니다. 그것은 여러분이 놀라게 하시려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 놀라게 되도록’. 헬라어 ἵνα + 접속법은 목적을 나타낼 수 있으며, 문맥상 결과로서의 놀라움도 암시할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  english_pob_choice: loves
  chosen_korean: 사랑하셔서
  alternatives_korean:
  - 사랑하십니다
  - 친애하십니다
  - 정이 있으셔서
  lexicon: BDAG
  rationale: φιλέω는 단순한 호감보다 인격적 애정과 사랑의 관계를 나타낼 수 있으므로, 약화하지 않고 자연스럽게 ‘사랑하셔서’로 옮겼습니다.
- source_word: πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ
  english_pob_choice: shows him all that he himself is doing
  chosen_korean: 자신이 하시는 모든 것을 그에게 보여 주십니다
  alternatives_korean:
  - 그가 하시는 모든 일을 그에게 보여 주십니다
  - 그 자신이 하고 있는 모든 것을 그에게 보여 주십니다
  lexicon: BDAG
  rationale: πάντα와 ἃ αὐτὸς ποιεῖ의 포괄성과 강조를 살려 ‘자신이 하시는 모든 것’으로 옮겼고, 현재형 ποιεῖ는 진행감이 드러나도록 ‘하시는’으로 처리했습니다.
- source_word: μείζονα τούτων ἔργα
  english_pob_choice: greater works than these
  chosen_korean: 이보다 더 큰 일들
  alternatives_korean:
  - 이것들보다 더 큰 일들
  - 더 큰 일들
  lexicon: BDAG
  rationale: 요한복음의 ἔργα는 단순한 행위보다 예수님의 표적적 사역을 가리킬 수 있어, 문맥상 자연스러운 ‘일들’로 옮겼습니다.
- source_word: θαυμάζητε
  english_pob_choice: so that you may marvel
  chosen_korean: 여러분이 놀라게 하시려는 것입니다
  alternatives_korean:
  - 여러분이 놀라게 되도록 하려는 것입니다
  - 여러분이 경탄하게 하시려는 것입니다
  lexicon: BDAG
  rationale: θαυμάζω의 결과적 놀라움/경탄을 살리되, 한국어에서 목적·결과를 자연스럽게 드러내기 위해 ‘놀라게 하시려는 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ἵνα ὑμεῖς θαυμάζητε의 목적/결과 뉘앙스
  chosen_reading: 목적과 결과를 함께 열어 두는 표현으로 처리했습니다.
  alternative_readings:
  - 여러분이 놀라게 되실 것입니다
  - 여러분이 놀라게 하려는 것입니다
  rationale: ἵνα + 접속법은 목적뿐 아니라 문맥상 결과를 띨 수 있으므로, 단정적으로 예언만 하거나 목적만으로 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
