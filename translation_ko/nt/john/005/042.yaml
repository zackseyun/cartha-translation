  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
  footnotes:
  - marker: a
    text: Or, more explicitly, 'you do not have love for God in yourselves.' The Greek can also be understood more broadly as 'the love that comes from God' or 'God's love.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 나는 너희를 압니다. 너희는 너희 안에 하나님께 대한 사랑이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 분명히, ‘너희 안에 하나님을 향한 사랑이 없다.’ 원문의 γενitive는 더 넓게 ‘하나님의 사랑’ 또는 ‘하나님에게서 오는 사랑’으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: SBLGNT / discourse contrast
  rationale: 직전 진술과의 강한 대조를 살리기 위해 역접 접속사로 옮겼습니다. 합쇼체 문맥에서는 ‘그러나’가 가장 자연스럽고 문체도 안정적입니다.
- source_word: ἔγνωκα ὑμᾶς
  english_pob_choice: I know you
  chosen_korean: 나는 너희를 압니다
  alternatives_korean:
  - 나는 너희를 압니다
  - 나는 너희를 알고 있습니다
  lexicon: BDAG
  rationale: 완료형 γνώκ-의 지속된 인식 상태를 한국어 현재형으로 자연스럽게 반영했습니다. ‘알고 있습니다’보다 단정적인 ‘압니다’가 이 구절의 판정적 어조에 더 가깝습니다.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  english_pob_choice: the love of God
  chosen_korean: 하나님께 대한 사랑
  alternatives_korean:
  - 하나님의 사랑
  - 하나님을 향한 사랑
  lexicon: BDAG
  rationale: γενitive의 의미가 애매하지만, 이 문맥에서는 하나님을 향한 사랑이 가장 강하게 요구됩니다. 다만 주석에서 원문이 가질 수 있는 다른 의미 범주를 보존했습니다.
- source_word: ἐν ἑαυτοῖς
  english_pob_choice: in yourselves
  chosen_korean: 너희 안에
  alternatives_korean:
  - 너희 속에
  - 너희 자신 안에
  lexicon: BDAG
  rationale: 반사 대명사와 전치사의 내적 소유감을 한국어의 자연스러운 내적 위치 표현으로 옮겼습니다. 문맥상 ‘안에’가 간결하면서도 의미를 잘 드러냅니다.
theological_decisions:
- issue: τὴν ἀγάπην τοῦ θεοῦ의 의미 범위
  chosen_reading: 본문에는 ‘하나님께 대한 사랑’으로 옮기되, 원문의 γενitive가 본질적으로 애매하다는 점은 각주로 남겼습니다.
  alternative_readings:
  - 하나님의 사랑
  - 하나님에게서 오는 사랑
  rationale: 이 구절의 직접 문맥은 예수께서 그들의 하나님을 향한 참된 사랑의 부재를 지적하는 방향을 강하게 지지합니다. 그러나 원문 표현 자체는 ‘하나님의 사랑’이라는 더 넓은 의미도 가능하므로, 본문은 문맥 우선으로 옮기고 해석의 긴장은 각주로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
