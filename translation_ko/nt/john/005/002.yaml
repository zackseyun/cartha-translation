id: JHN.5.2
reference: John 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: Now there is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
  footnotes:
  - marker: a
    text: Or 'in Aramaic'; John's expression 'in Hebrew' often refers to the local Semitic language of Judea rather than classical Hebrew strictly speaking.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read 'Bethzatha' or 'Bethsaida' instead of 'Bethesda.'
    reason: textual_variant
  - marker: c
    text: The Greek likely refers to the area of the Sheep Gate (compare Nehemiah 3:1; 12:39), with 'Gate' understood though not explicitly stated here.
    reason: cross_reference
translation:
  language: ko
  text: 이제 예루살렘[a]에는 양 문 곁에 베데스다[b]라 불리는 못이 있는데, 그것은 히브리어로[c] 다섯 행랑을 가지고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아람어로’. 요한의 ‘히브리어로’는 엄밀한 고전 히브리어보다 유대 지역의 셈어를 가리키는 경우가 많습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본은 ‘벳자타’ 또는 ‘벳사다’로 읽습니다.
    reason: textual_variant
  - marker: c
    text: 여기서 ‘양 문’은 본문에 직접 나오지 않지만, 느헤미야 3:1; 12:39와 비교할 때 문맥상 이해되는 표현입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστιν δὲ
  english_pob_choice: Now there is
  chosen_korean: 이제 …에는
  alternatives_korean:
  - 지금 …에 있습니다
  - 그리고 …에 있습니다
  lexicon: BDAG
  rationale: 현재시제의 존재 진술을 자연스러운 서술형으로 살리고, δέ는 강한 대조 없이 담화 전환 정도로 처리했습니다.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘 시내
  - 예루살렘 성 안
  lexicon: BDAG
  rationale: 지명은 표준 한국어 관용인 예루살렘으로 옮기되, 위치 관계는 뒤의 ‘에는’로 살렸습니다.
- source_word: ἐπὶ τῇ προβατικῇ
  english_pob_choice: by the Sheep Gate
  chosen_korean: 양 문 곁에
  alternatives_korean:
  - 양 문에
  - 양 시장 곁에
  lexicon: BDAG
  rationale: 문맥상 예루살렘의 ‘양 문’ 일대로 이해되는 약호적 표현이므로, 풀이를 보태되 원문의 지형적 의미를 드러내는 방식으로 번역했습니다.
- source_word: ἡ ἐπιλεγομένη Ἑβραϊστὶ Βηθεσδά
  english_pob_choice: called Bethesda in Hebrew
  chosen_korean: 베데스다[b]라 불리는 못이 있는데, 그것은 히브리어로[c]
  alternatives_korean:
  - 베데스다라 불리는 못이 있는데, 그것은 아람어로
  - 베데사다라 불리는 못이 있는데, 그것은 히브리어로
  lexicon: BDAG
  rationale: ‘불리는’으로 이름 소개를 자연스럽게 처리하고, Ἑβραϊστὶ는 본문대로 ‘히브리어로’ 두되 언어 주석을 각주로 보완했습니다. 베데스다는 본문 계열을 따라 표기했습니다.
- source_word: πέντε στοὰς ἔχουσα
  english_pob_choice: having five porticoes
  chosen_korean: 다섯 행랑을 가지고 있습니다
  alternatives_korean:
  - 다섯 주랑을 가지고 있습니다
  - 다섯 회랑이 있습니다
  lexicon: BDAG
  rationale: στοά의 건축적 의미를 살려 ‘행랑’으로 옮겼고, 분사구문은 ‘가지고 있습니다’로 유지했습니다.
theological_decisions:
- issue: Ἑβραϊστὶ의 언어 지시가 정확히 무엇을 가리키는가
  chosen_reading: 본문은 ‘히브리어로’라고 유지하되, 실제로는 지역 셈어, 곧 아람어를 가리킬 수 있다는 점을 각주로 밝혔습니다.
  alternative_readings:
  - 아람어로
  - 히브리어/아람어로
  rationale: 출발어의 표면 의미를 보존하되, 요한복음의 용례에 대한 언어학적 긴장을 지우지 않기 위해 본문과 각주를 분리했습니다.
  doctrine_reference: 성경 본문의 역사적·언어적 구체성
- issue: ‘양 문 곁에’의 해석 범위
  chosen_reading: 본문에는 문이 직접 언급되지 않지만, 문맥상 ‘양 문’으로 이해되는 예루살렘 지형을 드러내는 방향으로 옮겼습니다.
  alternative_readings:
  - 양 곳에
  - 양 연못 곁에
  rationale: 지형적 암시를 한국어 독자가 이해하도록 최소한만 보충했으며, 원문의 장소성을 흐리지 않았습니다.
  doctrine_reference: 본문의 지리적 배경 보존
