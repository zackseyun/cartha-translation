  source_fidelity: 핵심 어휘인 καὶ, οὐ θέλετε, ἐλθεῖν πρός με, ζωή는 대체로 적절히 옮겼습니다. 그러나 ‘이는 너희가 생명을 얻게 하려는 것입니다’는 ἵνα 목적절을 독립된 진술로 바꾸고, 누가 너희에게 생명을 얻게 하려 한다는 뜻처럼 들리게 하므로 원문의 구문과 의미를 정확히 전달하지 못합니다.
  naturalness: 합쇼체와 ‘그러나’, ‘생명’은 자연스럽습니다. 다만 기존의 두 문장 구성은 목적절이 앞 절에 자연스럽게 연결되지 않으며, ‘-게 하려는 것입니다’는 문맥상 행위 주체가 불분명합니다. 목적절을 ‘내게 오기를 원하지 않습니다’에 직접 연결하면 현대 표준 한국어로도 자연스럽습니다.
  terminology: ‘내게’, ‘생명’은 요한복음의 표현을 불필요하게 교리적으로 확대하지 않고 잘 보존합니다. θέλετε는 ‘원하지 않습니다’로 옮겨 의지·의향의 뜻을 명료하게 드러낼 수 있습니다.
  issues:
