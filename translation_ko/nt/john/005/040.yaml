    rationale: ‘이는 너희가 생명을 얻게 하려는 것입니다’는 원문에 없는 의도 주체를 암시하고, ‘생명을 얻도록 내게 오기를 원하지 않는다’라는 원래의 관계를 흐립니다. ἵνα절은 ‘내게 오다’를 목적 면에서 수식하도록 옮겨야 합니다.
