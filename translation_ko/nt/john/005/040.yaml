    rationale: 본문을 ‘원하지 않습니다’로 고치면, θέλω의 기본 뜻과 ‘오려고 하지 않습니다’라는 가능한 대안을 함께 제시하는 편이 더 정확합니다.
  revised_text: 그러나 너희는 생명을 얻도록 내게 오기를 원하지 않습니다.[a][b]
