  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
  footnotes:
  - marker: a
    text: Or 'And you do not want to come to me so that you may have life.' The Greek conjunction can be rendered simply 'and,' and θέλετε can be translated 'want.'
    reason: lexical_alternative
  - marker: b
    text: In John, 'life' often carries the fuller sense of life from God, that is, eternal life, though the word 'eternal' is not stated here.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 너희는 생명을 얻도록 내게 오기를 원하지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그러나’는 그리스어 접속사 καί를 문맥의 대조를 살려 옮긴 것입니다. ‘내게 오기를 원하지 않습니다’는 ‘내게 오려고 하지 않습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생명’은 요한복음에서 종종 하나님에게서 오는 충만한 생명을 가리키지만, 여기서는 ‘영생’이 직접 언급되지는 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 또
  lexicon: BDAG
  rationale: 문맥상 앞선 책망을 이어 받는 대조적 접속이므로, 단순한 연결인 ‘그리고’보다 역접 뉘앙스를 살린 ‘그러나’가 자연스럽습니다.
- source_word: οὐ θέλετε
  english_pob_choice: you are not willing
  chosen_korean: 너희는 … 하려고 하지 않습니다
  alternatives_korean:
  - 너희는 원하지 않습니다
  - 너희는 가려 하지 않습니다
  - 너희는 원치 않습니다
  lexicon: BDAG
  rationale: θέλω의 의지·의향을 살려 ‘원하다’보다 결단과 의향을 드러내는 표현을 택했고, 정중한 문체 안에서 현대 한국어로는 ‘하려고 하지 않습니다’가 가장 직접적입니다.
- source_word: ἐλθεῖν πρός με
  english_pob_choice: to come to me
  chosen_korean: 내게 오려고
  alternatives_korean:
  - 내게 오기 위해
  - 내게 오다
  - 내게 다가오려고
  lexicon: BDAG
  rationale: πρός με의 방향성을 살리되, 요한복음의 관계적 울림을 과도하게 해석하지 않기 위해 ‘내게 오다’의 직설성을 유지했습니다.
- source_word: ζωὴν
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 삶
  - 목숨
  - 영생
  lexicon: BDAG
  rationale: 이 문맥의 ζωή는 단순한 일상적 ‘삶’보다 하나님에게서 오는 생명의 의미가 강하므로, 본문이 직접 말하지 않는 ‘영생’은 피하고 ‘생명’으로 옮겼습니다.
theological_decisions:
- issue: ἵνα ζωὴν ἔχητε의 목적 절을 어떻게 드러낼 것인가
  chosen_reading: 이는 너희가 생명을 얻게 하려는 것입니다
  alternative_readings:
  - 그래야 너희가 생명을 가질 수 있습니다
  - 너희가 생명을 가지도록
  rationale: ἵνα의 목적성을 분명히 하면서도 한국어에서 자연스러운 종결을 위해 ‘-게 하려는 것입니다’를 택했습니다. 이 표현은 결과만이 아니라 의도도 드러냅니다.
  doctrine_reference: 'Translation philosophy: original-language primacy with readable Korean purpose clause'
- issue: ζωή를 ‘생명’으로 둘지 ‘영생’으로 넓힐지
  chosen_reading: 생명
  alternative_readings:
  - 영생
  - 생명, 곧 영생
  rationale: 요한복음의 신학적 깊이는 인정되지만, 본문에 αἰώνιος가 없으므로 주석적 확장을 본문에 넣지 않았습니다. 다만 문맥상 구원 생명의 의미는 유지됩니다.
  doctrine_reference: Never import doctrinal claims the text does not make
