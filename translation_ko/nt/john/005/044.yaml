  - marker: b
    text: Or 'How can you believe...?'
    reason: lexical_alternative
  - marker: c
    text: Or 'the one and only God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들끼리 서로 영광을 받으면서, 또 오직 하나님에게서 오는 영광은 찾지 않으니, 어떻게 여러분이 믿을 수 있겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영광’은 문맥에 따라 ‘명예’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘믿을 수 있겠습니까’는 ‘믿겠습니까’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘오직 하나님’은 ‘유일하신 하나님’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε
  english_pob_choice: How are you able
  chosen_korean: 어떻게 여러분이 믿을 수 있겠습니까?
  alternatives_korean:
  - 어떻게 여러분은 믿을 수 있습니까?
  - 어떻게 여러분이 믿겠습니까?
  lexicon: BDAG
  rationale: πῶς + δύνασθε는 능력/가능성에 대한 수사적 질문이므로, 현대 한국어에서는 ‘어떻게 …할 수 있겠습니까?’가 가장 자연스럽게 그 뉘앙스를 전달합니다.
- source_word: πιστεῦσαι
  english_pob_choice: to believe
  chosen_korean: 믿을 수 있겠습니까
  alternatives_korean:
  - 믿겠습니까
  - 믿을 수 있습니까
  lexicon: BDAG
  rationale: aorist 부정사이지만 한국어에서는 능력 표현과 함께 자연스럽게 풀어 ‘믿을 수 있겠습니까’로 옮겨, 요한복음의 믿음 문맥을 유지했습니다.
- source_word: δόξαν
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 명예
  lexicon: BDAG
  rationale: δόξα는 여기서 사람에게서 받는 평가와 하나님에게서 오는 영광을 대조하므로, 두 곳 모두 ‘영광’으로 일관되게 옮겨 원문 반복을 살렸습니다.
- source_word: παρ’ ἀλλήλων / παρὰ τοῦ μόνου θεοῦ
  english_pob_choice: from one another / from the only God
  chosen_korean: 사람들끼리 … 오직 하나님에게서 오는
  alternatives_korean:
  - 서로에게서 … 오직 하나님에게서 오는
  - 서로로부터 … 오직 하나님으로부터 오는
  lexicon: BDAG
  rationale: παρά의 출처 의미를 한국어의 ‘-에게서 오는’으로 자연스럽게 풀어, 인간 상호 간의 출처와 하나님의 유일한 출처를 분명히 했습니다.
- source_word: τοῦ μόνου θεοῦ
  english_pob_choice: the only God
  chosen_korean: 오직 하나님
  alternatives_korean:
  - 유일하신 하나님
  - 한 분뿐이신 하나님
  lexicon: BDAG
  rationale: μόνος의 배타적 의미를 살리되, 현대 한국어에서 가장 직역에 가까운 ‘오직 하나님’을 사용해 유일성의 강조를 유지했습니다.
theological_decisions:
- issue: δόξα의 반복을 한국어에서 어떻게 처리할지
  chosen_reading: 두 번 모두 ‘영광’으로 통일했습니다.
  alternative_readings:
  - 첫째는 ‘명예’, 둘째는 ‘영광’
  - 첫째는 ‘존귀’, 둘째는 ‘영광’
  rationale: 사람의 영광과 하나님의 영광 사이의 의도된 대조를 원문대로 드러내기 위해, 의미가 다른 한국어 동의어로 분산하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Consistency of key terms, or documented exception'
- issue: 수사적 질문의 강도
  chosen_reading: 직역형 질문보다 가능성/능력의 무능을 드러내는 질문으로 옮겼습니다.
  alternative_readings:
  - 단순한 정보 질문처럼 옮김
  - ‘어떻게 믿겠습니까?’처럼 압축
  rationale: 문맥상 예수의 질책적 수사 질문이므로, 한국어에서도 믿음의 불가능성을 드러내는 형태가 본문의 논지를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve rhetorical force and contextual force without over-explication'
