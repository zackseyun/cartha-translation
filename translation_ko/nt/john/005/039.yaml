revisions:
- from: 여러분은 성경을 살펴봅니다. 그것들 안에 영원한 생명이 있다고 생각하기 때문입니다. 그러나 그것들은 바로 나에 관하여 증언하는 것들입니다.[a]
  to: 여러분은 성경을 살핍니다[a]. 그 성경들 안에 영원한 생명이 있다고 생각하기 때문입니다. 그 성경들이 바로 나에 관하여 증언합니다.
  rationale: 직설법 해석과 명령법 대안은 유지했습니다. 원문 καί의 비역접적 연결을 반영하도록 ‘그러나’를 삭제했고, 성경을 가리키는 지시 표현과 증언 구문을 현대 한국어에 자연스럽게 다듬었습니다. 각주 표지는 문법적 대안이 걸리는 동사 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:02Z'
review_pass:
  verdict: revise
  source_fidelity: 직설법으로 본문을 옮기고 명령법 가능성을 각주에 보존한 것은 그리스어 Ἐραυνᾶτε의 문법적 모호성을 적절히 반영합니다. 다만 καί를 ‘그러나’로 옮긴 것은 원문의 단순 연결을 불필요하게 대조로 바꾸며, αἱ μαρτυροῦσαι를 ‘증언하는 것들’로 처리한 표현은 한국어에서 부자연스럽습니다.
  naturalness: ‘그것들 안에’와 ‘그것들은 바로 나에 관하여 증언하는 것들입니다’는 성경을 가리키는 한국어 표현으로 다소 어색합니다. ‘그 성경들 안에’ 및 ‘그 성경들이 바로 나에 관하여 증언합니다’로 하면 지시 관계와 문장이 더 자연스럽고 분명해집니다.
  terminology: ‘성경’, ‘영원한 생명’, ‘증언하다’는 적절한 용어입니다. ‘나에 관하여’도 현대의 격식 있는 문체에 맞습니다.
  issues:
