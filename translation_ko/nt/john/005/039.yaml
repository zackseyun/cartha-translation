id: JHN.5.39
reference: John 5:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
  footnotes:
  - marker: a
    text: Or, 'Search the Scriptures,' taking Ἐραυνᾶτε as an imperative rather than an indicative.
    reason: alternative_reading
translation:
  language: ko
  text: 여러분은 성경을 살핍니다[a]. 그 성경들 안에 영원한 생명이 있다고 생각하기 때문입니다. 그 성경들이 바로 나에 관하여 증언합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성경을 살펴보십시오’로 옮길 수 있습니다. Ἐραυνᾶτε를 명령법으로 보는 해석입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  english_pob_choice: You search
  chosen_korean: 여러분은 성경을 살펴봅니다
  alternatives_korean:
  - 여러분은 성경을 검색합니다
  - 성경을 살펴보십시오
  lexicon: BDAG
  rationale: 형태상 직설법/명령법이 모두 가능하므로, 문맥에 따라 현재의 행동을 묘사하는 직설법으로 옮겼습니다. ‘살펴봅니다’는 탐구의 뉘앙스를 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: τὰς γραφάς
  english_pob_choice: the Scriptures
  chosen_korean: 성경
  alternatives_korean:
  - 성경 기록들
  - 성서
  lexicon: BDAG
  rationale: 요한복음에서 γραφή는 이스라엘의 성경을 가리키므로, 한국어의 자연한 대응인 ‘성경’이 적절합니다.
- source_word: ζωὴν αἰώνιον
  english_pob_choice: eternal life
  chosen_korean: 영원한 생명
  alternatives_korean:
  - 영생
  - 영원한 삶
  lexicon: BDAG
  rationale: 요한 문맥의 정식 표현을 한국어로 직접 풀어 옮겼습니다. ‘영생’도 가능하지만, 본문 구조를 분명히 드러내기 위해 ‘영원한 생명’을 택했습니다.
- source_word: αἱ μαρτυροῦσαι
  english_pob_choice: the ones that testify
  chosen_korean: 증언하는 것들
  alternatives_korean:
  - 증언하는 것들
  - 증언하고 있는 것들
  lexicon: BDAG
  rationale: μαρτυρέω의 법정적 증언 뉘앙스를 살려 ‘증언하다’로 옮겼습니다. 복수 여성형 지시어와 결합된 표현은 ‘것들’로 처리해 성경들을 가리키는 연결을 유지했습니다.
theological_decisions:
- issue: Ἐραυνᾶτε의 문법적 모호성
  chosen_reading: 본문은 ‘여러분은 성경을 살펴봅니다’라는 직설법으로 옮기고, 명령법 가능성은 주석으로 보존합니다.
  alternative_readings:
  - ‘성경을 살펴보십시오’라는 명령법
  rationale: 이 구절은 현재의 행동을 비판적으로 진술하는 흐름이 자연스럽지만, 형태상 명령법도 가능하므로 해석의 긴장을 제거하지 않기 위해 본문과 주석을 분리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
