    issue: καί를 ‘그러나’로 번역함
    rationale: 원문은 여기서 역접 접속사 ἀλλά가 아니라 단순 접속사 καί를 사용합니다. 문맥상 비판적 긴장은 있으나, 본문에 ‘그러나’를 넣어 문법적 대조를 명시하지 않는 편이 원문에 더 충실합니다.
  - severity: low
    issue: 성경을 ‘그것들’ 및 ‘증언하는 것들’로 지칭함
    rationale: 문법적으로는 가능하지만 현대 표준 한국어에서는 비인칭적이고 어색합니다. ‘그 성경들’과 능동 동사 ‘증언합니다’가 지시 대상과 관계절의 뜻을 더 자연스럽게 전달합니다.
  - severity: low
    issue: 각주 표지가 대안이 되는 동사에서 멀리 놓임
    rationale: 명령법/직설법 대안은 첫 동사 Ἐραυνᾶτε에만 해당하므로, 해당 동사 바로 뒤에 표지를 두는 것이 각주의 범위를 명확히 합니다.
