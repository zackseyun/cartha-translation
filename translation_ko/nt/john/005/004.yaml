theological_decisions:
- issue: 본문의 위치와 정경적 지위
  chosen_reading: 이 절을 본문에 두되, 각주로 후기 사본 전승에 속하는 본문임을 알립니다.
  alternative_readings:
  - 본문에서 제외
  - 괄호 처리만 하고 각주 없음
  rationale: 비잔틴 전승에 존재하지만 초기 그리스어 사본에는 없다는 본문의 텍스트 비평 정보를 보존해야 하므로, 읽기에는 포함하되 출처 상태를 각주로 알립니다.
  doctrine_reference: 성경 본문비평 / 사본 전승
