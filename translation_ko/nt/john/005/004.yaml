  rationale: 설명 접속사 γάρ를 ‘왜냐하면’으로 옮기고, 두 미완료과거의 반복상을 ‘-곤 했습니다’로 보존했습니다. 질병에 관한 수동 표현은 자연스러운 한국어 관용인 ‘병을 앓고 있든지’로 옮겼습니다. 각주는 영어 POB 감사 기록의 본문비평 정보, 특히 3절 후반과의 관련 및 초기 번역 전승을 빠짐없이 반영하도록 수정했습니다.
