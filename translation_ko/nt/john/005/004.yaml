source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
  footnotes:
  - marker: a
    text: This verse (along with the latter half of verse 3) is absent from the earliest Greek papyri (such as the 3rd-century Papyrus 66 and Papyrus 75) and major 4th-century manuscripts (Sinaiticus and Vaticanus). It is present in the Byzantine majority tradition, as well as early Latin and Syriac translations. It is widely viewed by scholars as an early scribal addition to explain why the disabled gathered at the pool.
    reason: textual_critical
  - marker: b
    text: Or 'became well'.
    reason: previous_rendering
translation:
  language: ko
  text: 왜냐하면 천사가 때때로 못[a]에 내려와 물을 흔들곤 했습니다. 그러므로 물이 요동한 뒤에 가장 먼저 들어간 사람은 어떤 병을 앓고 있든지 낫곤 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '이 절과 3절 후반은 초기 그리스어 파피루스들(예: 3세기 파피루스 66과 파피루스 75)과 4세기의 주요 사본들(시내 사본과 바티칸 사본)에는 없습니다. 이 구절은 비잔틴 다수 전승과 초기 라틴어 및 시리아어 번역들에는 있습니다. 학계에서는 병자들이 왜 못에 모여 있었는지를 설명하려는 초기 필사자의 첨가로 널리 봅니다.'
    reason: textual_variant
