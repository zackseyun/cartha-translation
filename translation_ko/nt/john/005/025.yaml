id: JHN.5.25
reference: John 5:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
  footnotes:
  - marker: a
    text: Or, more formally, 'Amen, amen, I say to you.'
    reason: lexical_alternative
  - marker: b
    text: '''Hour'' can also be understood more broadly as ''time,'' but the Greek specifically says ''hour.'''
    reason: lexical_alternative
  - marker: c
    text: '''The dead'' may include a present spiritual sense here (''and now is'') while also anticipating bodily resurrection in the surrounding context.'
    reason: cross_reference
  - marker: d
    text: Or 'those who have heard will live.'
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로 진실로 여러분에게 말합니다. 한 시간이 오고 있습니다. 이미 와 있습니다. 그때에는 죽은 자들이 하나님의 아들의 음성을 들을 것이며, 듣는 사람들은 살아날 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 시간’은 더 넓게 ‘때’로도 이해될 수 있지만, 그리스어는 구체적으로 ‘시간’을 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘죽은 자들’은 여기서 현재의 영적 의미를 포함할 수 있으며(‘이미 와 있습니다’), 주변 문맥에서는 육체적 부활도 바라봅니다.
    reason: cross_reference
  - marker: c
    text: ‘듣는 사람들’은 더 문자적으로는 ‘들은 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로 진실로
  alternatives_korean:
  - 아멘, 아멘
  - 참으로 참으로
  lexicon: BDAG
  rationale: 반복된 서두의 엄숙한 강조를 자연스러운 현대 한국어로 살리면서, 과도하게 교회적 관용구로 굳어지지 않게 했습니다.
- source_word: ἔρχεται ὥρα καὶ νῦν ἐστιν
  english_pob_choice: an hour is coming, and now is
  chosen_korean: 한 시간이 오고 있습니다. 이미 와 있습니다.
  alternatives_korean:
  - 그 시간이 오고 있습니다. 지금도 그렇습니다.
  - 한 때가 오고 있으며 지금도 그렇습니다.
  lexicon: BDAG
  rationale: ὥρα를 단순히 '때'로 일반화하지 않고 '한 시간'으로 옮겨 요한복음의 종말론적 표현을 보존했습니다. '이미 와 있습니다'는 현재 실현과 미래 긴장의 압축을 자연스럽게 드러냅니다.
- source_word: οἱ νεκροὶ
  english_pob_choice: the dead
  chosen_korean: 죽은 자들
  alternatives_korean:
  - 죽은 사람들
  - 죽은 이들
  lexicon: BDAG
  rationale: 문맥이 물리적 죽음과 영적 죽음의 긴장을 함께 열어 두므로, 해석을 좁히지 않는 중립적 표현을 택했습니다.
- source_word: τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ
  english_pob_choice: the voice of the Son of God
  chosen_korean: 하나님의 아들의 음성
  alternatives_korean:
  - 하나님의 아들의 목소리
  - 하나님의 아들의 소리
  lexicon: BDAG
  rationale: φωνή는 인격적 주체의 발화로서 '음성'이 가장 자연스럽고, '하나님의 아들'은 본문의 완전한 그리스도 칭호를 그대로 살렸습니다.
- source_word: οἱ ἀκούσαντες ζήσουσιν
  english_pob_choice: those who hear will live
  chosen_korean: 듣는 사람들은 살아날 것입니다
  alternatives_korean:
  - 들은 사람들은 살아날 것입니다
  - 듣는 이들은 살 것입니다
  lexicon: BDAG
  rationale: aorist 분사 ἀκούσαντες의 완료된 '들음'을 한국어에서 문맥상 자연스러운 현재적 조건으로 풀되, 결과인 ζωή를 '살아날 것입니다'로 옮겨 생명 회복의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘the dead’의 의미 범위
  chosen_reading: ‘죽은 자들’로 직역하되, 영적 죽음과 육체적 죽음 중 하나로 좁히지 않았습니다.
  alternative_readings:
  - 영적으로 죽은 사람들
  - 육체적으로 죽은 사람들
  rationale: 바로 뒤의 ‘이미 와 있습니다’가 현재적 생명 부여를 시사하지만, 요한복음 5장의 더 넓은 문맥은 부활까지 포함하므로 번역에서 긴장을 보존하는 것이 본문에 더 충실합니다.
  doctrine_reference: 본문의 신학적 긴장을 유지합니다.
