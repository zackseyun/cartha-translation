id: JHN.5.22
reference: John 5:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: ko
  text: 이는 아버지께서 아무도 심판하지 않으시고, 오히려 모든 심판을 아들에게 주셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  english_pob_choice: For
  chosen_korean: 아버지는
  alternatives_korean:
  - 왜냐하면 아버지는
  - 그런데 아버지는
  lexicon: BDAG
  rationale: γάρ의 설명적 연결은 앞문맥을 이어 주므로 한국어에서는 별도의 접속사를 드러내기보다 주절의 주어를 바로 제시해 자연스럽게 이어지게 했습니다.
- source_word: κρίνει οὐδένα
  english_pob_choice: judges no one
  chosen_korean: 아무도 심판하지 않으시고
  alternatives_korean:
  - 아무도 판단하지 않으시고
  - 아무도 재판하지 않으시고
  lexicon: BDAG
  rationale: κρίνει는 문맥상 정죄보다 넓은 ‘심판하다’가 적절하며, οὐδένα의 포괄적 부정을 한국어의 ‘아무도’로 자연스럽게 살렸습니다.
- source_word: τὴν κρίσιν πᾶσαν
  english_pob_choice: all judgment
  chosen_korean: 모든 심판
  alternatives_korean:
  - 온전한 심판
  - 심판 전체
  lexicon: BDAG
  rationale: κρίσις는 판단 행위/심판 기능을 가리키므로 ‘모든 심판’이 어휘와 범위를 가장 सीधे하게 반영합니다.
- source_word: δέδωκεν
  english_pob_choice: has given
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주셨습니다
  - 맡기셨습니다
  lexicon: BDAG
  rationale: 완료 시제의 지속된 결과를 한국어에서는 자연스러운 현재 효력으로 표현해 ‘주셨습니다’로 옮겼습니다. ‘맡기셨습니다’는 해석을 더 강하게 전제합니다.
- source_word: τῷ υἱῷ
  english_pob_choice: to the Son
  chosen_korean: 아들에게
  alternatives_korean:
  - 아드님에게
  - 그 아들에게
  lexicon: BDAG
  rationale: 정관사와 함께 쓰인 ‘아들’을 신학적 칭호로 유지하되, 한국어에서는 문맥상 명료성과 간결성을 위해 ‘아들에게’로 옮겼습니다.
theological_decisions:
- issue: 아버지가 ‘아무도 심판하지 않으신다’는 진술과 아들에게 ‘모든 심판’을 주셨다는 진술의 긴장
  chosen_reading: 본문의 직접적 진술을 그대로 유지해, 아버지의 심판 부재와 아들에게 주어진 모든 심판을 그대로 병치했습니다.
  alternative_readings:
  - ‘아버지가 독자적으로는 아무도 심판하지 않으신다’로 완화하기
  - ‘모든 심판’을 최종 심판만으로 한정하기
  rationale: 원문에 없는 조정어를 넣어 긴장을 해소하지 않고, 본문의 언어가 말하는 범위를 그대로 드러내는 것이 소스 충실성에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
- issue: ‘아들’의 칭호 유지
  chosen_reading: ‘아들’로 유지해 요한복음의 높은 기독론적 칭호를 보존했습니다.
  alternative_readings:
  - ‘그의 아들’로 풀어쓰기
  rationale: 헬라어는 소유격 대명사를 두지 않고 정관사와 함께 ‘아들’을 칭호처럼 사용하므로, 한국어도 그 칭호성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles'
