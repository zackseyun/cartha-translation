id: JHN.5.27
reference: John 5:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
  footnotes:
  - marker: a
    text: Or "because he is a son of man," that is, because he shares human nature. The main text preserves the likely title usage in John.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그분에게 심판을 행할 권한을 주셨습니다. 이는 그분이 인자이시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 사람의 아들이기 때문에”로도 옮길 수 있습니다. 다만 본문은 요한복음에서의 칭호 용법을 유지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  english_pob_choice: authority
  chosen_korean: 권한
  alternatives_korean:
  - 권세
  - 권리
  - 힘
  lexicon: BDAG
  rationale: 여기서는 단순한 힘이 아니라 심판을 수행하도록 위임된 법적·통치적 자격을 가리키므로, ‘권한’이 가장 자연스럽고 정확합니다.
- source_word: ἔδωκεν
  english_pob_choice: gave
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주었습니다
  - 부여하셨습니다
  lexicon: BDAG
  rationale: ‘주다’의 직접성을 살리면서, 아버지를 가리키는 문맥에 맞게 존대형으로 옮겼습니다.
- source_word: κρίσιν ποιεῖν
  english_pob_choice: to execute judgment
  chosen_korean: 심판을 행할
  alternatives_korean:
  - 심판하다
  - 판결을 내리다
  - 심판을 집행할
  lexicon: BDAG
  rationale: 직역식 ‘심판하다’보다, 판결을 실제로 수행하는 공적·사법적 행위를 드러내는 ‘심판을 행하다’가 원문의 형식을 더 잘 반영합니다.
- source_word: υἱὸς ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자의 아들
  lexicon: BDAG
  rationale: 요한복음에서 굳어진 기독론적 칭호이므로, 단순한 ‘사람의 아들’로 풀지 않고 전통적이면서도 소스-직접적인 ‘인자’로 유지했습니다.
theological_decisions:
- issue: υἱὸς ἀνθρώπου를 칭호로 유지할지, 인간성 일반을 가리키는 뜻으로 풀지 여부
  chosen_reading: 본문은 ‘인자’라는 칭호를 유지하되, 심판 권한의 이유를 문장 안에서 직접 제시합니다.
  alternative_readings:
  - 그가 사람의 아들이기 때문입니다
  - 그가 인간이기 때문입니다
  rationale: 요한복음의 문맥에서는 예수의 고유 칭호로 읽는 것이 자연스럽고, 인간성과의 연관성은 칭호를 제거하지 않아도 문맥상 함께 살아납니다. 따라서 본문은 칭호를 보존하고, 의미 축소는 하지 않았습니다.
  doctrine_reference: 요한복음의 인자 기독론; 니케아-칼케돈 경계
