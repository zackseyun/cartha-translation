  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
  footnotes:
  - marker: a
    text: Or, 'my testimony is not valid,' reflecting the legal setting of witness testimony.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 나 자신에 대해 증언하면, 내 증언은 참되지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 증언은 유효하지 않습니다’ — 증언의 법정적 맥락을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  english_pob_choice: If
  chosen_korean: 내가 …하면
  alternatives_korean:
  - 만일 내가 …하면
  - 내가 …할 경우
  lexicon: BDAG
  rationale: 조건문을 자연스러운 한국어 종속절로 옮겼습니다. 직설적인 ‘만일’보다 본문 흐름에 더 매끄럽습니다.
- source_word: μαρτυρῶ
  english_pob_choice: testify
  chosen_korean: 증언하면
  alternatives_korean:
  - 증언하다
  - 증거하면
  - 증거하다
  lexicon: BDAG
  rationale: μαρτυρέω의 법정적·증언적 의미를 살리면서, 현대 한국어에서 가장 자연스러운 동사로 옮겼습니다.
- source_word: περὶ ἐμαυτοῦ
  english_pob_choice: about myself
  chosen_korean: 나 자신에 대해
  alternatives_korean:
  - 내게 관해
  - 내 자신에 관해
  - 내 편에서
  lexicon: BDAG
  rationale: περί + 속격의 기본값인 ‘~에 대해’를 따르되, 예수의 자기증언을 분명히 드러내기 위해 ‘나 자신’을 보강했습니다.
- source_word: ἀληθής
  english_pob_choice: is not true
  chosen_korean: 참되지 않습니다
  alternatives_korean:
  - 참이 아닙니다
  - 진실하지 않습니다
  - 유효하지 않습니다
  lexicon: BDAG
  rationale: ἀληθής의 핵심 의미인 ‘참됨/진실함’을 살렸고, POB가 보존한 해석적 긴장(참되지 않음 vs 법적 유효성)을 한국어에서도 그대로 남겼습니다.
theological_decisions:
- issue: 예수의 자기증언이 '참되지 않다'는 표현의 긴장 보존
  chosen_reading: 본문을 곧바로 '참되지 않습니다'로 옮겨, 법정적 맥락에서 제기되는 해석을 본문 안에서 과도하게 풀어 버리지 않았습니다.
  alternative_readings:
  - 유효하지 않습니다
  - 인정되지 않습니다
  rationale: 헬라어는 ἀληθής를 사용하므로, 한국어도 먼저 ‘참됨’의 의미를 유지하는 것이 원문에 더 충실합니다. 문맥상 법정적 타당성의 함의는 있으나, 그 의미는 독자가 문맥에서 판단하도록 남겨 두는 편이 좋습니다.
  doctrine_reference: 요한복음의 증언 모티프와 본문 긴장 보존
