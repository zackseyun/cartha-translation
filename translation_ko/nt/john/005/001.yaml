id: JHN.5.1
reference: John 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'a festival of the Jews.'
    reason: lexical_alternative
  - marker: b
    text: '''The Jews'' here refers to the Jewish people in connection with one of their festal observances; some contexts in John may also support ''Judeans'' for Ἰουδαῖοι.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들[ a ] 후에 유대인들의 명절이 있었고, 예수께서 예루살렘으로 올라가셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  english_pob_choice: After these things
  chosen_korean: 이 일들 후에
  alternatives_korean:
  - 이 일들 뒤에
  - 그 후에
  lexicon: BDAG
  rationale: μετὰ ταῦτα의 서술 연결을 살리기 위해 직역에 가깝게 옮겼고, 요한의 전환 표지를 자연스럽게 유지했습니다.
- source_word: ἑορτὴ
  english_pob_choice: a feast
  chosen_korean: 명절
  alternatives_korean:
  - 절기
  - 축제
  - 잔치
  lexicon: BDAG
  rationale: 유대교 맥락의 ἑορτή는 단순한 잔치보다 종교적 절기·명절의 성격이 강하므로, 한국어에서는 문맥상 가장 직접적인 '명절'을 택했습니다.
- source_word: τῶν Ἰουδαίων
  english_pob_choice: of the Jews
  chosen_korean: 유대인들의
  alternatives_korean:
  - 유대인들의
  - 유대 사람들의
  - 유대 지역 사람들의
  lexicon: BDAG
  rationale: 영어 POB가 'the Jews'를 택한 것을 따라, 이 절기와 연결된 집단을 한국어에서도 '유대인들'로 옮겼습니다.
- source_word: ἀνέβη
  english_pob_choice: went up
  chosen_korean: 올라가셨습니다
  alternatives_korean:
  - 가셨습니다
  - 올라가셨습니다
  - 상경하셨습니다
  lexicon: BDAG
  rationale: 예루살렘으로 향하는 ἀναβαίνω의 관용적 'go up'과 지리적 상승의 뉘앙스를 함께 살렸습니다.
theological_decisions:
- issue: Ἰουδαίων의 번역
  chosen_reading: 이 절에서는 요한복음의 일반적 관용에 따라 '유대인들'로 옮겼습니다.
  alternative_readings:
  - 유대인들
  - 유대인들/유대 사람들
  - 유대인들(혹은 유대 사람들)
  rationale: 여기서는 명절의 소속을 말하는 표현이므로, 지역명 '유대인들'보다 집단 표지가 자연스럽고 영어 POB의 판단과도 일치합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve ambiguity only where the source is genuinely ambiguous'
