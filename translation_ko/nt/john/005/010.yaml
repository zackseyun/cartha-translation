id: JHN.5.10
reference: John 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
  footnotes:
  - marker: a
    text: Or possibly “the Jewish leaders” or “the Judeans,” depending on how John is using the term here.
    reason: alternative_reading
  - marker: b
    text: Or “pick up” or “take up your mat.”
    reason: lexical_alternative
  - marker: c
    text: The term rendered “mat” refers to a portable sleeping pad or pallet, not necessarily a full bed.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 유대인들이[a] 치유받은 사람에게 말하고 있었습니다. “안식일입니다. 그리고 당신이 그 깔개[c]를 들고 가는 것은 허용되지 않습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대인들’은 문맥에 따라 ‘유대 지도자들’ 또는 ‘유대 지역 사람들’을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘들고 가다’는 ‘집어 들다’ 또는 ‘메고 가다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘깔개’는 꼭 완전한 침대가 아니라, 휴대 가능한 잠자리나 깔개를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον οὖν
  english_pob_choice: So ... were saying
  chosen_korean: 그러므로 ... 말했습니다
  alternatives_korean:
  - 그래서 ... 말했습니다
  - 그러자 ... 말했습니다
  lexicon: BDAG
  rationale: οὖν의 연결성과 ἔλεγον의 미완료상 반복·진행 뉘앙스를 살리되, 한국어에서는 자연스럽게 과거 진행의 상황 서술로 풀어 옮겼습니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들이
  alternatives_korean:
  - 유대 지도자들이
  - 유대 사람들에게서 온 이들이
  lexicon: BDAG
  rationale: 본문의 직접 표현을 좁히지 않고 유지했습니다. 이 절만으로는 지도자들로 한정할 근거가 부족하므로, POB 영어의 문자적 선택을 반영했습니다.
- source_word: τῷ τεθεραπευμένῳ
  english_pob_choice: to the man who had been healed
  chosen_korean: 치유받은 사람에게
  alternatives_korean:
  - 치유된 사람에게
  - 나은 사람에게
  lexicon: BDAG
  rationale: 완료 수동 분사는 이미 치유가 이루어져 그 결과가 남아 있음을 나타냅니다. 문맥상 남성임은 분명하지만, 한국어에서는 불필요한 성별 표지를 더하지 않고 자연스럽게 옮겼습니다.
- source_word: ἆραι τὸν κράβαττον
  english_pob_choice: to carry his mat
  chosen_korean: 이 들것을 들고 가는 것이
  alternatives_korean:
  - 이 매트를 옮기는 것이
  - 이 침상을 메고 가는 것이
  lexicon: BDAG
  rationale: κράβαττον은 휴대용 잠자리/깔개에 가까운 뜻이라 ‘들것’으로 옮겨 이동성과 임시성을 드러냈습니다. ἆραι는 단순히 ‘집어 들다’보다 여기서는 ‘들고 가다/운반하다’의 행위가 핵심입니다.
- source_word: οὐκ ἔξεστίν σοι
  english_pob_choice: it is not lawful for you
  chosen_korean: 당신에게는 ... 합법적이지 않습니다
  alternatives_korean:
  - 당신은 ... 해서는 안 됩니다
  - 당신에게는 ... 허용되지 않습니다
  lexicon: BDAG
  rationale: 안식일 논쟁의 율법적 성격을 살려 ‘합법적이지 않다’로 직역에 가깝게 유지했습니다. 전통적 교회 용어로 완화하기보다 본문의 규범적 판단을 분명히 드러냅니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 지시 대상
  chosen_reading: 본문 그대로 ‘유대인들’로 두고, 지도자들로 한정하지 않았습니다.
  alternative_readings:
  - 유대 지도자들
  - 유대인들/유대 사람들
  rationale: 요한복음의 용례에는 논쟁이 있지만, 이 절 자체는 발화자를 지도자로 특정하지 않습니다. 따라서 원문 표면형을 유지해 해석을 과잉 확정하지 않았습니다.
  doctrine_reference: 번역 원칙 §§1, 3, 5
