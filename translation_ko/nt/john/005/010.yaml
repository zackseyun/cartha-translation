  source_fidelity: 원문의 οὖν은 ‘그러자’로 자연스럽게 반영했고, 미완료형 ἔλεγον의 진행·반복적 배경성을 ‘말하고 있었습니다’로 살렸습니다. τῷ τεθεραπευμένῳ, 안식일 선언, ἔξεστιν의 허용/규범 의미, 그리고 κράβαττον을 들고 가는 행위가 모두 보존됩니다.
  naturalness: 초안의 ‘그러므로’와 ‘합법적이지 않습니다’는 이 서술 및 안식일 규정의 발화로는 다소 부자연스럽습니다. ‘그러자’와 ‘허용되지 않습니다’가 현대 표준어 합쇼체에서 더 자연스럽고 의미도 정확합니다. ‘들것’은 환자 이송용 기구를 우선 연상시키므로 휴대용 잠자리라는 κράβαττον의 뜻에는 ‘깔개’가 더 적절합니다.
  terminology: ‘유대인들’은 원문의 표면적 표현을 유지합니다. 지시 대상의 문맥상 가능한 좁은 이해는 각주에서만 제시합니다. κράβαττον은 본문에서 ‘깔개’로 옮기고, 문화 각주에서 휴대 가능한 잠자리임을 설명합니다.
