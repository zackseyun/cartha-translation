  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐγένετο ⸀τότε τὰ ἐγκαίνια ἐν ⸀τοῖς Ἱεροσολύμοις· ⸀χειμὼν ἦν,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
  footnotes:
  - marker: a
    text: Or 'Hanukkah,' the Jewish festival commemorating the rededication of the temple.
    reason: cultural_note
translation:
  language: ko
  text: 그때 예루살렘에서 봉헌절이 있었습니다[a]. 때는 겨울이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 말로 ‘하누카’이며, 성전을 다시 봉헌한 일을 기념하는 유대 절기입니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο τότε
  english_pob_choice: At that time ... took place
  chosen_korean: 그때 ... 있었습니다
  alternatives_korean:
  - 그때 ... 일어났습니다
  - 그때 ... 열렸습니다
  lexicon: BDAG
  rationale: Ἐγένετο는 여기서 사건의 발생을 알리는 서술이므로, 한국어에서는 자연스러운 사건 도입형 표현인 ‘있었습니다’로 옮겨 시간 전환을 살렸습니다. τότε는 ‘그때’로 간결하게 처리했습니다.
- source_word: τὰ ἐγκαίνια
  english_pob_choice: the Feast of Dedication
  chosen_korean: 봉헌절
  alternatives_korean:
  - 봉헌 축제
  - 봉헌 기념절
  - 하누카
  lexicon: BDAG
  rationale: 직역하면 ‘봉헌절’이 가장 간결하게 헬라어의 절기 명칭을 드러냅니다. 본문 주석에서 유대 절기의 문화적 대응인 하누카를 보완할 수 있으므로, 본문은 원어 의미를 우선해 정리했습니다.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에
  lexicon: BDAG
  rationale: 지명 부사는 한국어에서 ‘예루살렘에서’가 가장 자연스럽고, 장소 부사의 기능도 충분히 전달합니다.
- source_word: χειμὼν ἦν
  english_pob_choice: It was winter
  chosen_korean: 때는 겨울이었습니다
  alternatives_korean:
  - 겨울이었습니다
  - 겨울철이었습니다
  lexicon: BDAG
  rationale: 단순한 계절 진술이므로 문장 흐름을 부드럽게 하는 ‘때는 겨울이었습니다’로 옮겼습니다. 영어의 분위기와 시간 표지를 함께 살립니다.
theological_decisions:
- issue: τὰ ἐγκαίνια의 절기 정체
  chosen_reading: 본문에는 의미 중심의 절기명인 ‘봉헌절’을 두고, 독자가 유대 절기의 통용 명칭을 확인할 수 있도록 주석으로 보완하는 방향이 적절합니다.
  alternative_readings:
  - 하누카
  - 성전 봉헌절
  rationale: 이 구절은 교리 논쟁점이 아니라 문화·역사적 식별의 문제입니다. 본문은 원어의 의미를 직접 드러내고, 통용 명칭은 각주로 처리하는 것이 원어 우선 원칙에 부합합니다.
  doctrine_reference: 원어 우선 번역 원칙, 문화적 등가 표기
