  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
  footnotes:
  - marker: a
    text: Or 'even if you do not believe in me.' The Greek more literally uses 'believe' with a dative pronoun, which can mean 'believe me' or 'believe in me'; here 'believe me' best fits the contrast with 'believe the works.'
    reason: lexical_alternative
  - marker: b
    text: The expression 'know and continue knowing' reflects two different Greek verb forms, likely emphasizing both coming to know and ongoing recognition.
    reason: lexical_alternative
  - marker: c
    text: Or 'so that you may know and continue knowing'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 내가 그것들을 행한다면, 여러분이 나를 믿지 않더라도 그 일들을 믿으십시오. 그러면 여러분이 알고 계속 알게 되어, 아버지께서 내 안에 계시고 나도 아버지 안에 있다는 것을 알게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐμοί는 ‘나를’ 또는 ‘나를 믿고’로도 옮길 수 있지만, 여기서는 ‘나를 믿지 않더라도’가 뒤의 ‘그 일들을 믿으십시오’와 더 뚜렷한 대조를 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: 두 동사 μορφή의 차이는 ‘알고 계속 알게 되어’처럼 초기 인식과 지속적 인식을 함께 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘아버지께서 내 안에, 그리고 나도 아버지 안에’입니다.
    reason: source_note
lexical_decisions:
- source_word: ποιῶ
  english_pob_choice: I do them
  chosen_korean: 내가 그것들을 행한다면
  alternatives_korean:
  - 내가 그것들을 한다면
  - 내가 그것들을 하더라도
  lexicon: BDAG
  rationale: 문맥의 ‘일들’을 가리키므로 목적어를 한국어로 드러내되, ‘행하다’로 요한복음의 표지적 표현을 자연스럽게 살렸습니다.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  english_pob_choice: even if you do not believe me
  chosen_korean: 여러분이 나를 믿지 않더라도
  alternatives_korean:
  - 여러분이 내게 믿지 않더라도
  - 여러분이 나를 믿지 않고도
  lexicon: BDAG
  rationale: 여기서 πιστεύω + 여격은 예수의 증언을 받아들이는 뜻이므로, ‘믿다’를 직접 써서 대조를 분명히 했습니다.
- source_word: τοῖς ἔργοις πιστεύετε
  english_pob_choice: believe the works
  chosen_korean: 그 일들을 믿으십시오
  alternatives_korean:
  - 그 일들을 믿어 주십시오
  - 그 일들을 신뢰하십시오
  lexicon: BDAG
  rationale: ‘믿음’을 일들 자체에 두는 어색함을 피하면서도, 작품/기적의 증거성을 그대로 살리기 위해 간결하게 옮겼습니다.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  english_pob_choice: so that you may know and continue to know
  chosen_korean: 여러분이 알고 계속 알게 되어
  alternatives_korean:
  - 여러분이 알게 되고 계속 알게 되어
  - 여러분이 알고 또 계속 알게 되어
  lexicon: BDAG
  rationale: aorist와 present의 대비를 ‘알고’와 ‘계속 알게 되어’로 반영해, 한 번의 인식과 지속적 인식을 모두 드러냈습니다.
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  english_pob_choice: the Father is in me, and I am in the Father
  chosen_korean: 아버지께서 내 안에 계시고 나도 아버지 안에 있다는 것을
  alternatives_korean:
  - 아버지께서 내 안에 계시고 나 역시 아버지 안에 있다는 것을
  - 아버지께서 내 안에 계시며 나도 아버지 안에 있다는 것을
  lexicon: BDAG
  rationale: ἐν의 상호 내주를 ‘안에 계시고/안에 있다’로 직역해, 요한복음의 신학적 긴장을 덜어내지 않았습니다.
theological_decisions:
- issue: 아버지와 아들의 상호 내주 표현
  chosen_reading: ‘아버지께서 내 안에 계시고 나도 아버지 안에 있다는 것’을 그대로 유지했습니다.
  alternative_readings:
  - ‘아버지와 나는 하나라는 것’
  - ‘아버지와 내가 연합되어 있다는 것’
  rationale: 본문의 관계 언어를 설명적 용어로 바꾸면 요한의 직접적 진술이 약해질 수 있으므로, 본문이 말하는 그대로 보존했습니다.
  doctrine_reference: 요한복음의 높은 그리스도론; 번역 원칙
