    rationale: 여기서 믿으라는 명령은 아버지와 아들의 관계를 알도록 하기 위한 목적을 지닙니다. 한국어에서도 ‘… 알게 되고 계속 알아 가도록 … 믿으십시오’로 목적을 명시하는 편이 가깝습니다.
