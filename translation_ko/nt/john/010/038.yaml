    issue: γνῶτε καὶ γινώσκητε의 번역이 중복되고 문법적으로 부자연스럽습니다.
    rationale: ‘알고 계속 알게 되어’ 뒤에 다시 ‘알게 될 것입니다’가 이어져 인식의 의미가 세 번 반복됩니다. aorist와 present의 대비는 ‘알게 되고 계속 알아 가도록’처럼 초기 인식과 지속을 구분하여 옮길 수 있습니다.
  - severity: medium
