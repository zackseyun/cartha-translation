review_pass:
  verdict: revise
  source_fidelity: 본문의 핵심 대조(예수를 믿지 않더라도 그 일들을 믿으라)와 아버지와 아들의 상호 내주 표현은 대체로 충실합니다. 그러나 ‘알고 계속 알게 되어 … 알게 될 것입니다’는 γνῶτε καὶ γινώσκητε를 중복·혼합하여 옮기고, ἵνα의 목적 관계도 약화합니다. 이를 ‘알게 되고 계속 알아 가도록’으로 정리하는 것이 안전합니다.
  naturalness: ‘그러면 … 알게 될 것입니다’는 앞선 명령과의 목적 관계보다 단순한 미래 결과처럼 들리며, ‘알고 계속 알게 되어’는 현대 한국어에서 어색합니다. 목적절을 명령의 목적을 나타내도록 재배열하면 자연스럽습니다.
  terminology: ‘행하다’, ‘일들’, ‘아버지’, ‘내 안에/아버지 안에’는 요한복음의 어휘와 신학적 표현을 과도한 해설 없이 적절히 보존합니다. 각주 b의 ‘두 동사 μορφή’는 잘못된 그리스어 용어이므로 ‘두 동사의 형태’로 바로잡아야 합니다.
  issues:
