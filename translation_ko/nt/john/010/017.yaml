id: JHN.10.17
reference: John 10:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
  footnotes:
  - marker: a
    text: Or 'my soul.' Here ψυχή most naturally means 'life' in the sense of the life Jesus lays down in death and takes up again.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 때문에 아버지께서 나를 사랑하십니다. 내가 다시 그것을 얻기 위하여 내 생명[a]을 내려놓기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼’. 여기서 ψυχή는 문자적으로 ‘영혼’이라기보다, 죽음에 내어주고 다시 얻는 생명을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: For this reason
  chosen_korean: 이런 까닭에
  alternatives_korean:
  - 이 때문에
  - 이유로
  lexicon: BDAG
  rationale: 앞선 진술과의 인과 관계를 자연스러운 현대 한국어로 잇되, 원문의 담화 연결을 분명하게 살리기 위해 ‘이런 까닭에’로 옮겼습니다.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  english_pob_choice: the Father loves me
  chosen_korean: 아버지께서 나를 사랑하십니다
  alternatives_korean:
  - 아버지께서 나를 사랑하십니다
  - 내 아버지께서 나를 사랑하십니다
  lexicon: BDAG
  rationale: 원문은 소유격이 아니라 정관사 있는 주어 ‘아버지’를 쓰므로, ‘아버지께서’로 옮겨 요한복음의 직접적인 신학적 표현을 보존했습니다.
- source_word: τὴν ψυχήν μου
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 목숨
  - 내 영혼
  lexicon: BDAG
  rationale: 이 문맥에서 ψυχή는 죽음에 내어주고 다시 취하는 ‘생명’을 가리키므로, ‘영혼’보다 ‘생명’이 원문의 뜻을 더 정확히 드러냅니다.
- source_word: λάβω αὐτήν
  english_pob_choice: I may take it up again
  chosen_korean: 다시 그것을 취하려는 것입니다
  alternatives_korean:
  - 다시 그것을 받으려는 것입니다
  - 다시 그것을 취하겠습니다
  lexicon: BDAG
  rationale: ‘다시 취하다’는 기본 의미를 살리되, 10장 앞뒤 문맥의 죽음 뒤 회복을 반영하여 한국어에서는 자연스럽게 ‘다시 그것을 취하려는 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ψυχή의 의미를 ‘영혼’으로 볼지 ‘생명’으로 볼지
  chosen_reading: ‘생명’으로 번역했습니다.
  alternative_readings:
  - 내 영혼
  - 내 목숨
  rationale: 본문은 예수께서 자기 생명을 내려놓고 다시 취하시는 장면을 말하므로, ‘영혼’은 문맥의 초점을 벗어날 수 있습니다. ‘생명’은 희생과 부활의 흐름을 그대로 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ἵνα + 접속법의 목적/결과 뉘앙스
  chosen_reading: ‘...하려는 것입니다’로 목적성을 살렸습니다.
  alternative_readings:
  - '...하도록'
  - '...하기 위하여'
  rationale: ἵνα의 목적성을 지나치게 딱딱하게 만들지 않으면서도, 예수의 자기 내어줌과 다시 취하심 사이의 의도적 연결을 보존하기 위한 선택입니다.
  doctrine_reference: Translation philosophy §3
