review_pass:
  verdict: revise
  source_fidelity: 초안은 ψυχή를 ‘생명’으로 옮긴 점과 ‘아버지께서 나를 사랑하십니다’라는 주절은 원문에 충실합니다. 그러나 ὅτι의 이유절을 ‘…것은 …것입니다’라는 설명·명사절 구조로 바꾸어 인과 관계가 약화되었고, ἵνα + 접속법을 ‘…하려는 것입니다’로 옮겨 목적절을 예수의 의도에 대한 서술로 변형했습니다.
  naturalness: ‘이런 까닭에’는 자연스럽지만 ‘이 때문에’가 더 간결하고 현대적인 담화 연결입니다. 수정문은 합쇼체를 유지하면서 이유와 목적의 관계를 명료하고 자연스럽게 드러냅니다.
  terminology: ‘아버지’, ‘생명’, ‘내려놓다’는 요한복음 문맥과 표준적 성서 한국어 용례에 적절합니다. ψυχή의 대안인 ‘영혼’은 각주에서만 제시하여 문맥상 의미인 ‘생명’을 본문에 유지합니다.
