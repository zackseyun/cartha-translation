id: JHN.10.16
reference: John 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
  footnotes:
  - marker: a
    text: Or 'they will hear my voice.' The Greek verb can mean either 'hear' or 'listen,' but here likely includes the sense of responsive hearing.
    reason: lexical_alternative
  - marker: b
    text: Greek distinguishes 'sheepfold' (αὐλή, an enclosure) from 'flock' (ποίμνη, the group of sheep). Some translations render the final phrase 'one fold,' but 'one flock' better reflects the Greek wording here.
    reason: alternative_reading
translation:
  language: ko
  text: 내게는 이 우리에 속하지 않은 다른 양들도 있습니다. 나는 그들도 반드시 데려와야 합니다. 그들은 내 음성을 들을 것입니다.[a] 그리하여 한 무리와 한 목자가 있게 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '대안: ‘내 음성에 귀 기울일 것입니다.’ ἀκούω는 ‘듣다’와 ‘귀 기울여 듣다’를 모두 뜻할 수 있으며, 여기서는 반응하는 들음의 뉘앙스도 포함할 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: 원문은 αὐλή(울타리나 우리)와 ποίμνη(무리나 양 떼)를 서로 다르게 씁니다. 둘 다 ‘우리’로 옮기면 이 구분이 희미해집니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  english_pob_choice: other sheep
  chosen_korean: 다른 양들
  alternatives_korean:
  - 다른 어린양들
  - 다른 양 떼
  lexicon: BDAG
  rationale: πρόβατα는 일반적으로 ‘양’이므로 ‘어린양들’은 과도한 축소입니다. 복수성과 대비를 살리기 위해 ‘다른 양들’로 옮겼습니다.
- source_word: αὐλή
  english_pob_choice: sheepfold
  chosen_korean: 이 우리
  alternatives_korean:
  - 양 우리
  - 울타리
  - 마당
  lexicon: BDAG
  rationale: αὐλή는 이 목자 비유에서 양을 가두는 울타리/우리의 뜻입니다. 한국어에서는 자연스럽고 구체적인 ‘우리’가 가장 적절합니다.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  english_pob_choice: they will listen to my voice
  chosen_korean: 내 음성을 들을 것입니다
  alternatives_korean:
  - 내 음성을 들을 것입니다
  - 내 목소리를 들을 것입니다
  - 내 음성에 귀 기울일 것입니다
  lexicon: BDAG
  rationale: ἀκούω는 여기서 단순 청각이 아니라 반응하는 듣기를 포함할 수 있지만, 한국어에서는 ‘들을 것입니다’가 가장 직접적으로 원문을 반영합니다. 주석 없이도 문맥상 순종의 뉘앙스가 전달됩니다.
- source_word: μία ποίμνη, εἷς ποιμήν
  english_pob_choice: one flock, one shepherd
  chosen_korean: 한 무리가 되고 한 목자가 있을 것입니다
  alternatives_korean:
  - 한 떼가 되고 한 목자가 있을 것입니다
  - 한 양 떼가 되고 한 목자가 있을 것입니다
  lexicon: BDAG
  rationale: ποίμνη는 ‘양 떼/무리’의 뜻이지만, 직전의 αὐλή와 구별을 살리기 위해 ‘무리’로 옮겨 두 명사가 다른 대상을 가리킨다는 점을 유지했습니다. ποιμήν은 비유의 핵심어이므로 ‘목자’로 직역했습니다.
theological_decisions:
- issue: αὐλή와 ποίμνη의 구분 보존
  chosen_reading: 이 우리 ... 한 무리
  alternative_readings:
  - 이 우리 ... 한 양 떼
  - 이 우리 ... 한 우리
  rationale: 원문은 αὐλή(울타리/우리)와 ποίμνη(무리/양 떼)를 구분합니다. 둘 다 ‘우리’로 처리하면 원문의 대비가 사라지므로, 전자는 ‘우리’, 후자는 ‘무리’로 구분해 옮겼습니다.
  doctrine_reference: 'Translation philosophy #1, #5'
- issue: δεῖ의 필연성
  chosen_reading: 반드시 데려와야 합니다
  alternative_readings:
  - 데려와야 합니다
  - 데려올 필요가 있습니다
  rationale: δεῖ는 요한복음에서 단순 필요보다 더 강한 필연성을 나타낼 수 있습니다. ‘반드시’로 그 강도를 살리되, 과도한 신학적 설명은 덧붙이지 않았습니다.
  doctrine_reference: 'Translation philosophy #3'
