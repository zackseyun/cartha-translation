revisions:
- from: 아버지께서 내게 주신 이들은 아버지께서 모든 것보다 크십니다. 아무도 그들을 아버지의 손에서 빼앗아 갈 수 없습니다.[a]
  to: 내 아버지께서는[a] 이들을 내게 주셨고, 모든 것보다 크십니다. 아무도 그들을 아버지의 손에서 빼앗아 갈 수 없습니다.
  rationale: 본문의 선택 독법은 직전의 양들 문맥 및 영어 POB 감사 기록에 따라 아버지께서 ‘이들’을 예수께 주셨다는 뜻을 자연스럽게 드러냅니다. 다만 헬라어 중성 관계대명사와 난해한 구문이 허용하는 대안, 곧 ‘내게 주신 것’이 모든 것보다 크다는 이해는 각주로 보존했습니다. 수정은 한국어의 주어 관계를 바로잡고 ‘내’와 각주 앵커를 명확히 할 뿐, 비교의 범위나 신학적 함의를 좁히지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:23:06Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장은 헬라어의 난해한 관계절을 문맥상 ‘아버지께서 이들을 내게 주셨다’로 풀어 옮길 수 있습니다. 그러나 현 번역은 ‘아버지께서 내게 주신 이들은’이 문장 화제로 제시된 뒤 ‘아버지께서 ... 크십니다’가 이어져, 주어 관계가 문법적으로 불명확하고 뜻이 뒤엉깁니다. ‘내 아버지’는 ὁ πατήρ μου의 소유 표현도 더 충실히 반영합니다.
  naturalness: ‘내 아버지께서는 이들을 내게 주셨고, 모든 것보다 크십니다’는 현대 표준어 합쇼체로 자연스럽고, 두 서술의 공통 주어가 아버지임을 명료하게 합니다. ‘빼앗아 갈 수 없습니다’도 자연스럽습니다.
  terminology: ‘아버지’, ‘손’, ‘빼앗아 가다’는 요한복음의 문맥과 한국어 성서 문체에 적절합니다. πάντων의 열린 범위를 유지하기 위해 ‘모든 것보다’는 그대로 두는 것이 좋습니다.
  issues:
  - severity: high
    issue: 첫 문장의 주어 및 수식 관계가 불명확함
    rationale: ‘아버지께서 내게 주신 이들은 아버지께서 모든 것보다 크십니다’는 표면적으로 ‘이들’이 문장 화제/주어처럼 놓이지만 뒤의 ‘크십니다’는 아버지를 서술합니다. 한국어 문장 구조상 의미가 혼동됩니다.
  - severity: medium
    issue: ὁ πατήρ μου의 ‘μου’가 본문에서 탈락함
    rationale: 초안의 ‘아버지께서’는 ‘내 아버지’라는 소유 표현을 본문에서 드러내지 않습니다. 한국어에서 생략이 가능하더라도, 이 난해한 절에서는 ‘내 아버지’가 주어를 분명히 하고 원문의 표현도 보존합니다.
  - severity: low
