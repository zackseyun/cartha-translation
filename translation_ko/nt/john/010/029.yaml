id: JHN.10.29
reference: John 10:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
  footnotes:
  - marker: a
    text: Or, more literally, 'My Father, what he has given me, is greater than all.' The Greek wording here is difficult, and some understand the gift itself rather than the persons given as the subject of the comparison.
    reason: alternative_reading
translation:
  language: ko
  text: 내 아버지께서는[a] 이들을 내게 주셨고, 모든 것보다 크십니다. 아무도 그들을 아버지의 손에서 빼앗아 갈 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘내 아버지, 곧 그분이 내게 주신 것은 모든 것보다 크십니다.’ 그리스어 표현은 문법적으로 어렵습니다. 어떤 이들은 비교의 주어를 내게 주신 사람들로 보지 않고, 내게 주신 것 자체로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  english_pob_choice: My Father
  chosen_korean: 아버지
  alternatives_korean:
  - 내 아버지
  - 나의 아버지
  lexicon: BDAG
  rationale: 직설화법에서 예수의 친밀한 소유 관계를 자연스럽게 드러내면서도 한국어 문장 흐름을 해치지 않도록 ‘아버지’로 옮겼습니다.
- source_word: ὃ δέδωκέν μοι
  english_pob_choice: who has given them to me
  chosen_korean: 내게 주신 이들
  alternatives_korean:
  - 내게 주신 것
  - 내게 주신 자들
  lexicon: BDAG
  rationale: 문맥의 양 떼 이미지를 따라 인격적 대상임을 드러내되, 헬라어의 중성 관계대명사가 지닌 형식적 모호성은 완전히 지워지지 않도록 ‘이들’로 옮겼습니다.
- source_word: πάντων μεῖζων
  english_pob_choice: greater than all
  chosen_korean: 모든 것보다 크십니다
  alternatives_korean:
  - 모두보다 크십니다
  - 만물보다 크십니다
  lexicon: BDAG
  rationale: πάντων의 범위를 특정 인물이나 사물로 좁히지 않고, 한국어에서도 절대적 비교를 유지하는 표현을 택했습니다.
- source_word: ἁρπάζειν
  english_pob_choice: to snatch
  chosen_korean: 빼앗아 가다
  alternatives_korean:
  - 낚아채다
  - 강제로 빼앗다
  lexicon: BDAG
  rationale: 즉각적이고 폭력적인 탈취의 뉘앙스를 살리면서, 문맥상 양 떼를 보호하는 이미지에 자연스럽게 맞는 동사를 선택했습니다.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  english_pob_choice: out of the Father's hand
  chosen_korean: 아버지의 손에서
  alternatives_korean:
  - 아버지의 손 밖으로
  - 아버지 손에서
  lexicon: BDAG
  rationale: ‘손’의 보호와 소유의 은유를 그대로 보존하되, 한국어에서는 ‘에서’가 ἐκ의 이탈 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: ὃ δέδωκέν μοι의 문법적 모호성
  chosen_reading: 인격적 대상인 양 떼를 가리키는 뜻을 본문 흐름에 따라 드러내되, 완전한 해소는 피했습니다.
  alternative_readings:
  - 내게 주신 것
  - 내게 주신 그것
  rationale: 직전 절의 양 떼 문맥 때문에 독자는 ‘주신 이들’로 이해할 수 있지만, 헬라어의 중성 형태가 남기는 긴장도 보존해야 하므로 과도한 명시화는 피했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
