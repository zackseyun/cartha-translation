id: JHN.10.1
reference: John 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
  footnotes:
  - marker: a
    text: Or 'through the gate.' The Greek θύρα can mean 'door' or 'gate' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'into the sheep pen' or 'into the courtyard of the sheep.' The Greek αὐλή denotes an enclosed court or fold.
    reason: lexical_alternative
  - marker: c
    text: The Greek distinguishes between a 'thief' (κλέπτης) and a 'robber' (λῃστής), the latter often suggesting a more forceful or violent kind of stealing.
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로, 진실로 내가 여러분에게 말합니다. 문을 통해[a] 양의 우리에[b] 들어가지 않고 다른 곳에서 기어올라 들어가는 사람은 도둑이며 강도입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대문을 통해’. 헬라어 θύρα는 문맥에 따라 ‘문’ 또는 ‘대문/출입문’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘양 우리 안으로’ 또는 ‘양의 뜰로’. 헬라어 αὐλή는 울타리로 둘러싸인 뜰이나 우리를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 헬라어는 ‘도둑’(κλέπτης)과 ‘강도’(λῃστής)를 구별합니다. 뒤의 말은 흔히 더 강제적이거나 폭력적인 탈취를 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로, 진실로
  alternatives_korean:
  - 아멘, 아멘
  - 참으로, 참으로
  lexicon: SBLGNT / POB audit trail
  rationale: 반복된 강조 형식을 살리면서 현대 한국어에서 자연스럽고 엄숙한 서두로 옮겼습니다. '아멘'을 음역으로 두기보다 담화 기능을 드러내는 표현을 택했습니다.
- source_word: λέγω ὑμῖν
  english_pob_choice: I say to you
  chosen_korean: 내가 여러분에게 말합니다
  alternatives_korean:
  - 내가 너희에게 말합니다
  - 내가 당신들에게 말합니다
  lexicon: SBLGNT / BDAG
  rationale: 직접 화법의 공식성을 살리되, 현대 독자에게는 '여러분'이 가장 무난하게 복수 대상을 드러냅니다.
- source_word: διὰ τῆς θύρας
  english_pob_choice: through the door
  chosen_korean: 문으로
  alternatives_korean:
  - 문을 통해
  - 문으로서
  lexicon: BDAG
  rationale: θύρα는 문/문지방의 출입구를 가리킬 수 있지만, 이 비유에서는 '문으로'가 간결하면서도 출입 경로의 대비를 잘 보여 줍니다.
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  english_pob_choice: into the sheepfold
  chosen_korean: 양의 우리에
  alternatives_korean:
  - 양 우리 안에
  - 양우리로
  lexicon: BDAG
  rationale: αὐλή의 울타리 친 공간 이미지를 한국어의 '우리'로 옮겨 비유의 현장감을 살렸습니다. '양의 우리'는 전통적이면서도 본문상의 울타리/울 안 이미지를 유지합니다.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  english_pob_choice: but climbs up from somewhere else
  chosen_korean: 오히려 다른 데로 올라가는
  alternatives_korean:
  - 오히려 다른 곳에서 올라오는
  - 오히려 다른 길로 올라가는
  lexicon: BDAG
  rationale: ἀναβαίνω의 '오르다/올라가다' 이미지를 유지하고, ἀλλαχόθεν의 '다른 데에서/다른 쪽으로'라는 비특정성을 한국어의 '다른 데로'로 간결하게 반영했습니다.
- source_word: κλέπτης καὶ λῃστής
  english_pob_choice: a thief and a robber
  chosen_korean: 도둑이며 강도입니다
  alternatives_korean:
  - 도둑이며 약탈자입니다
  - 도둑이며 산적입니다
  lexicon: BDAG
  rationale: κλέπτης와 λῃστής의 구별을 한국어에서도 두 단어로 살리되, λῃστής의 더 폭력적인 뉘앙스를 '강도'로 옮겼습니다. '강도'는 단순 절도보다 강제성과 위험성을 함께 드러냅니다.
theological_decisions:
- issue: 이중 강조 서두의 담화 기능
  chosen_reading: '''진실로, 진실로''로 시작하여 예수의 단호한 선언 형식을 살렸습니다.'
  alternative_readings:
  - 아멘, 아멘으로 음역
  - 참으로, 참으로로 완화
  rationale: 본문의 반복 구조는 단순한 강조가 아니라 이어지는 선언의 권위를 세웁니다. 한국어에서도 동일한 담화 효과를 유지하는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 인칭 대명사와 수사적 보편성
  chosen_reading: '''여러분에게''와 ''사람은''을 사용해 복수 청중과 대표적 단수 주어를 함께 드러냈습니다.'
  alternative_readings:
  - 너희에게 / 그 사람은
  - 당신들에게 / 그 사람은
  rationale: 그리스어의 단수 분사와 지시어는 특정 개인이면서도 대표적 사례를 가리킵니다. 한국어에서는 현대 문체를 유지하면서도 그 수사적 기능을 잃지 않도록 했습니다.
  doctrine_reference: Translation philosophy §4
