    rationale: θύρα는 문 또는 문맥상 출입문/대문을 뜻할 수 있으나, ‘문지기 쪽’이라는 뜻은 본 어휘 자체에 없습니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 한꺼번에 붙어 있어 해당 어휘와의 연결이 약합니다.
