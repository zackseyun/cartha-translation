- from: 진실로, 진실로 내가 여러분에게 말합니다. 문으로 양의 우리에 들어가지 않고, 오히려 다른 데로 올라가는 사람은 도둑이며 강도입니다.[a][b][c]
  to: 진실로, 진실로 내가 여러분에게 말합니다. 문을 통해[a] 양의 우리에[b] 들어가지 않고 다른 곳에서 기어올라 들어가는 사람은 도둑이며 강도입니다[c].
