revisions:
- from: 나는 문입니다. 누구든지 나를 통해 들어오면 구원을 받고, 드나들며 목초를 얻게 될 것입니다.[a]
  to: 나는 문입니다. 누구든지 나를 통해 들어오면 구원을 받을 것이며, 드나들고 목초지를 찾을 것입니다.[a]
  rationale: ‘문’과 ‘나를 통해’ 및 ‘구원’은 유지했습니다. νομὴν εὑρήσει의 장소적 의미와 ‘찾다’의 직접성을 반영하여 ‘목초지를 찾을 것입니다’로 고쳤고, 원문의 미래 동사 병렬을 더 분명히 했습니다. 각주는 중복된 대안어를 실제 가능한 어휘 대안인 ‘출입문’으로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:25Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘나는 문입니다’와 ‘나를 통해 들어오면’은 ἐγώ εἰμι ἡ θύρα 및 δι’ ἐμοῦ를 충실히 반영합니다. 다만 νομὴν은 먹는 ‘목초’ 자체보다 양이 풀을 뜯는 ‘목초지/풀밭’을 뜻하므로, ‘목초를 얻게 될 것입니다’보다 ‘목초지를 찾을 것입니다’가 εὑρήσει와 함께 원문에 더 가깝습니다. 또한 세 미래 동사의 병렬을 미래형으로 분명히 나타내는 것이 좋습니다.
  naturalness: ‘구원을 받을 것이며, 드나들고 목초지를 찾을 것입니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 간결한 목양 비유를 유지합니다. ‘드나들고’는 εἰσελεύσεται καὶ ἐξελεύσεται의 짝을 한국어 관용 표현으로 잘 살립니다.
  terminology: ‘문’은 θύρα의 직접적인 기본 대응어로 적절하며, ‘구원을 받다’는 σωθήσεται의 요한복음 문맥상 신학적 의미를 보존합니다. 기존 각주의 ‘또는 문’은 본문어와 동일하여 대안 기능을 하지 못하고, ‘문간/출입구’라는 설명도 영어 POB의 ‘gate’ 대안과 정확히 대응하지 않습니다. ‘출입문’으로 대안을 제시하는 것이 안전합니다.
  issues:
  - severity: medium
    issue: νομὴν을 ‘목초’로 번역함
    rationale: νομὴ는 목초 자체라기보다 목초지·풀밭·방목지를 가리킵니다. 또한 εὑρήσει는 ‘얻다’보다 ‘찾다’가 직접 대응입니다.
  - severity: low
    issue: 각주의 대안어가 본문어와 동일함
    rationale: 본문이 이미 ‘문’인데 각주가 ‘또는 문’이라고 하여 실질적인 어휘 대안을 제공하지 못합니다. θύρα의 문/대문·출입문 의미 범위를 반영하도록 고쳐야 합니다.
  - severity: low
    issue: 미래 결과의 병렬이 일부 약화됨
    rationale: σωθήσεται, εἰσελεύσεται, ἐξελεύσεται, εὑρήσει는 모두 미래형입니다. ‘구원을 받고, 드나들며 … 얻게 될 것입니다’도 문맥상 가능하지만, 각 결과를 미래형으로 더 명시하면 원문의 진행을 더 잘 보존합니다.
