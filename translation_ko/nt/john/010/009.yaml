id: JHN.10.9
reference: John 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
  footnotes:
  - marker: a
    text: Or "gate." The Greek word can denote a door or gate; "door" is kept in the main text as the more direct lexical rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 문입니다. 누구든지 나를 통해 들어오면 구원을 받고, 드나들며 목초를 얻게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “문.” 헬라어 θύρα는 문이나 문간/출입구를 가리킬 수 있으나, 본문에서는 더 직접적인 대응인 ‘문’을 본문에 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  english_pob_choice: door
  chosen_korean: 문
  alternatives_korean:
  - 문지기
  - 문짝
  - 출입문
  - 문/문간
  lexicon: BDAG
  rationale: θύρα의 가장 직접적인 뜻은 ‘문’이며, 영어 POB가 ‘door’를 유지한 것처럼 본문 은유를 과도하게 풀지 않고 간결하게 살렸습니다.
- source_word: δι’ ἐμοῦ
  english_pob_choice: through me
  chosen_korean: 나를 통해
  alternatives_korean:
  - 내게로
  - 내로 말미암아
  - 나를 통하여
  lexicon: BDAG
  rationale: διά + 속격의 매개/수단 의미를 살려, 예수를 진입의 통로로 드러내는 ‘나를 통해’로 옮겼습니다.
- source_word: σωθήσεται
  english_pob_choice: he will be saved
  chosen_korean: 구원을 받고
  alternatives_korean:
  - 구원받을 것입니다
  - 구출될 것입니다
  - 구해질 것입니다
  lexicon: BDAG
  rationale: 요한복음에서 σῴζω는 단순한 물리적 안전보다 구원의 신학적 의미가 강하므로 ‘구원을 받고’로 살리되, 한국어에서 자연스러운 미래 결과를 표현했습니다.
- source_word: νομὴν
  english_pob_choice: pasture
  chosen_korean: 목초
  alternatives_korean:
  - 목초지
  - 풀밭
  - 초장
  lexicon: BDAG
  rationale: νομὴ는 양이 먹는 풀밭/먹이터를 뜻하므로, 목자 비유의 맥락을 살리면서도 ‘pasture’의 직접 대응을 보이는 ‘목초’를 선택했습니다.
theological_decisions:
- issue: θύρα의 은유를 한국어로 어떻게 유지할지
  chosen_reading: 문
  alternative_readings:
  - 문지기
  - 출입문
  - 문간
  rationale: 본문은 예수의 ‘나는 …이다’ 자기계시 은유를 제시하므로, 해석을 덧붙이기보다 직접적인 은유어 ‘문’을 유지하는 편이 원문의 힘을 가장 잘 전달합니다.
  doctrine_reference: 요한복음의 ‘나는 ~이다’ 계시 진술
- issue: σωθήσεται의 의미 범위를 어떻게 보존할지
  chosen_reading: 구원을 받고
  alternative_readings:
  - 구출될 것이며
  - 보호를 받게 될 것이며
  rationale: 문맥상 안전과 생명 보존의 이미지가 있지만, 본문이 말하는 것은 단순한 물리적 보호로 축소되지 않으므로 ‘구원’의 신학적 폭을 유지했습니다.
  doctrine_reference: 구원론, 요한복음의 구원 언어
