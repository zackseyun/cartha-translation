  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
  footnotes:
  - marker: a
    text: Or “John performed no sign.”
    reason: lexical_alternative
  - marker: b
    text: Or “about him.” The Greek says “about this one/this man.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 많은 사람이 그에게 와서 말하고 있었습니다. “요한은 표적을 하나도 행하지 않았습니다. 그러나 요한이 이 사람에 대해 말한 모든 것은 참이었습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  english_pob_choice: many
  chosen_korean: 많은 사람
  alternatives_korean:
  - 많은 이들
  - 많은 무리
  lexicon: BDAG
  rationale: 복수 형용사가 명사처럼 쓰인 표현이므로, 한국어에서는 자연스럽게 ‘많은 사람’으로 풀어 주었습니다.
- source_word: ἦλθον πρὸς αὐτὸν
  english_pob_choice: came to him
  chosen_korean: 그에게 와서
  alternatives_korean:
  - 그에게 갔습니다
  - 그에게 나아왔습니다
  lexicon: BDAG
  rationale: 예수에게 다가오는 동작을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: σημεῖον
  english_pob_choice: sign
  chosen_korean: 표적
  alternatives_korean:
  - 기적
  - 사인
  lexicon: BDAG
  rationale: 요한복음에서 σημεῖον은 단순한 기적보다 의미를 가리키는 표지이므로, 한국어에서도 신학적 기능을 살리는 ‘표적’을 택했습니다.
- source_word: περὶ τούτου
  english_pob_choice: about this man
  chosen_korean: 이 사람에 대해
  alternatives_korean:
  - 그에 대해
  - 이분에 대해
  lexicon: BDAG
  rationale: τούτου의 지시성을 살리면서도 한국어에서 자연스럽고, 예수의 직접 언급을 분명히 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: John 10:41의 σημεῖον 해석
  chosen_reading: ‘표적’으로 유지해 요한복음의 표징-신학을 보존합니다.
  alternative_readings:
  - ‘기적’으로 완화할 수 있습니다.
  rationale: 본문은 단순한 초자연 현상보다 예수의 정체를 가리키는 표지를 말하므로, 전통적 번역보다 ‘표적’이 원문 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; consistency of key terms, or documented exception.'
