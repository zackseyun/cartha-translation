id: JHN.10.33
reference: John 10:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
  footnotes:
  - marker: a
    text: Or, 'make yourself a god.' The Greek θεόν lacks the article, but in this context of a blasphemy charge the sense is most likely 'God.'
    reason: alternative_reading
translation:
  language: ko
  text: 유대인들이 그에게 대답했습니다. “우리가 좋은 일 때문에 당신을 돌로 치는 것이 아닙니다. 신성모독 때문입니다. 당신은 사람이면서 자신을 하나님으로 만듭니다.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신을 신으로 만듭니다’로 옮길 수 있습니다. 그리스어 θεόν에는 정관사가 없지만, 여기서는 신성모독이라는 고발의 문맥상 ‘하나님’이라는 뜻이 가장 가능성이 큽니다.
    reason: theological_note
lexical_decisions:
- source_word: Ἰουδαῖοι
  english_pob_choice: The Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대 지도자들
  - 유대 사람들
  lexicon: BDAG
  rationale: 요한복음의 Ἰουδαῖοι는 문맥에 따라 다양하게 가리킬 수 있지만, 여기서는 예수와 대치하는 집단을 가장 सीधे하게 드러내는 ‘유대인들’이 원문과 POB의 직설적 표현을 잘 반영합니다.
- source_word: λιθάζομέν
  english_pob_choice: are stoning
  chosen_korean: 돌을 던지는 것이
  alternatives_korean:
  - 돌로 치는 것이
  - 돌을 던지고 있는 것이
  lexicon: BDAG
  rationale: 현재형 복수는 대립 상황의 생생한 현재성을 살려 ‘돌을 던지는 것’으로 옮겼습니다. 한국어에서는 목적어가 포함된 부정사 구조로 자연스럽게 표현할 수 있습니다.
- source_word: βλασφημίας
  english_pob_choice: blasphemy
  chosen_korean: 신성모독
  alternatives_korean:
  - 모독
  - 하나님을 모독하는 일
  lexicon: BDAG
  rationale: βλασφημία는 하나님을 향한 모독죄를 가리키므로, 교회적 전통어이면서도 뜻이 분명한 ‘신성모독’이 적절합니다.
- source_word: ποιεῖς σεαυτὸν θεόν
  english_pob_choice: make yourself God
  chosen_korean: 자신을 하나님으로 만드니까
  alternatives_korean:
  - 자신을 신으로 만드니까
  - 자신을 하나님이라고 하니까
  lexicon: BDAG
  rationale: 반사동사구는 예수가 자기 자신을 하나님과 같은 지위로 세운다는 고발을 뜻하므로 ‘자신을 하나님으로 만드니까’가 가장 직접적입니다. 무관사 θεόν의 문법적 여지를 유지하되, 문맥상 ‘하나님’이 자연스럽습니다.
theological_decisions:
- issue: 무관사 θεόν의 한국어 처리
  chosen_reading: 하나님
  alternative_readings:
  - 신
  - 하나의 신
  rationale: 문법적으로는 ‘신’도 가능하지만, 바로 앞의 신성모독 고발과 요한복음의 일신론적 문맥에서는 예수가 유일하신 하나님과 동급의 지위를 주장한다고 이해하는 것이 자연스럽습니다. 따라서 본문은 그 긴장을 그대로 살려 ‘하나님’으로 옮겼습니다.
  doctrine_reference: Translation philosophy §3; John 10:33 context
