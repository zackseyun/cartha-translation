revisions:
- from: 유대인들이 예수께 대답하여 말했습니다. “우리는 좋은 일 때문에 당신에게 돌을 던지는 것이 아니라, 신성모독 때문이며, 또 당신이 사람이면서 자신을 하나님으로 만드니까 그렇습니다.”[a]
  to: 유대인들이 그에게 대답했습니다. “우리가 좋은 일 때문에 당신을 돌로 치는 것이 아닙니다. 신성모독 때문입니다. 당신은 사람이면서 자신을 하나님으로 만듭니다.[a]”
  rationale: The revision uses ‘돌로 치다’ for the direct sense of λιθάζω and recasts the two stated grounds for the accusation into natural formal Korean. It preserves the source’s unqualified ‘유대인들,’ the contrast of Jesus’ humanity with the alleged divine claim, and the footnoted ambiguity of anarthrous θεόν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:34Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the principal clauses, including the accusation of blasphemy and the contextual rendering of anarthrous θεόν as ‘하나님.’ However, ‘돌을 던지는 것’ is less precise than the judicially charged sense of λιθάζω, ‘돌로 치다/돌로 죽이려 하다,’ and the final Korean causal construction is syntactically awkward.
  naturalness: The phrase ‘신성모독 때문이며, 또 ... 만드니까 그렇습니다’ is redundant and unnatural in modern formal Korean. Dividing the accusation into two coordinated reasons produces clear, idiomatic 합쇼체.
  terminology: ‘유대인들,’ ‘신성모독,’ and ‘하나님’ are suitable. The footnote properly retains the grammatical alternative ‘신.’ ‘유대인들’ preserves the Greek referential breadth rather than narrowing the group to leaders.
  issues:
  - severity: medium
    issue: λιθάζομέν is rendered ‘당신에게 돌을 던지는 것.’
    rationale: While understandable, this can suggest merely throwing stones rather than stoning someone. ‘당신을 돌로 치는 것’ more directly conveys λιθάζω while retaining the present-tense confrontation.
  - severity: medium
    issue: The closing causal wording is awkward and repetitive.
    rationale: ‘... 때문이며, 또 ... 만드니까 그렇습니다’ combines overlapping causal expressions. The Greek gives two reasons, which Korean can state naturally as ‘... 때문입니다. 당신이 ... 때문입니다.’
  revised_text: 유대인들이 그에게 대답했습니다. “우리가 좋은 일 때문에 당신을 돌로 치는 것이 아닙니다. 신성모독 때문입니다. 당신은 사람이면서 자신을 하나님으로 만듭니다.[a]”
  revised_footnotes:
  - marker: a
    text: 또는 ‘자신을 신으로 만듭니다’로 옮길 수 있습니다. 그리스어 θεόν에는 정관사가 없지만, 여기서는 신성모독이라는 고발의 문맥상 ‘하나님’이라는 뜻이 가장 가능성이 큽니다.
    reason: theological_note
  revision_rationale: The revision uses ‘돌로 치다’ for the direct sense of λιθάζω and recasts the two stated grounds for the accusation into natural formal Korean. It preserves the source’s unqualified ‘유대인들,’ the contrast of Jesus’ humanity with the alleged divine claim, and the footnoted ambiguity of anarthrous θεόν.
