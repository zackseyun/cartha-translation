  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
  footnotes:
  - marker: a
    text: Or 'kill' for 'slaughter' (θύσῃ). The Greek verb often refers to slaughtering, which fits the sheep imagery of the context.
    reason: lexical_alternative
  - marker: b
    text: Or 'have life in abundance' or 'have it to the full.'
    reason: alternative_reading
translation:
  language: ko
  text: 도둑은 훔치고 죽이고 멸망시키려는 것 외에는 오지 않습니다[a]. 나는 그들이 생명을 얻고 풍성히 누리도록 왔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도살하고’. 그리스어 동사 θύσῃ는 흔히 도살하는 것을 뜻하며, 여기서는 양과 목자의 비유 문맥에 어울립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘생명을 풍성하게 누리도록’ 또는 ‘생명을 충만히 누리도록’.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  english_pob_choice: the thief
  chosen_korean: 도둑은
  alternatives_korean:
  - 그 도둑은
  - 도둑이
  lexicon: BDAG
  rationale: 정관사와 단수 일반용법을 반영해 특정 개인이라기보다 대조되는 대표적 인물로 읽히게 했습니다.
- source_word: οὐκ ἔρχεται εἰ μὴ
  english_pob_choice: comes only
  chosen_korean: …외에는 오지 않습니다
  alternatives_korean:
  - …하지 않고는 오지 않습니다
  - 오직 …하려고 옵니다
  lexicon: BDAG
  rationale: 배타적 의미를 자연스러운 현대 한국어로 옮겨, 도둑의 ‘옴’이 뒤의 행위들만을 위한 것임을 드러냈습니다.
- source_word: θύσῃ
  english_pob_choice: slaughter
  chosen_korean: 죽이고
  alternatives_korean:
  - 도살하고
  - 살해하고
  lexicon: BDAG
  rationale: 양과 목자 비유의 맥락에서 ‘도살하다’가 더 문자적이지만, 한국어 본문에서는 ‘죽이고’가 과도한 어색함 없이 파괴적 폭력을 잘 드러냅니다. 각주로 영어 POB의 ‘slaughter’ 대안 가능성을 남겼습니다.
- source_word: ἀπολέσῃ
  english_pob_choice: destroy
  chosen_korean: 멸망시키려는
  alternatives_korean:
  - 망하게 하려는
  - 파멸시키려는
  lexicon: BDAG
  rationale: 단순한 소실보다 총체적 파괴를 나타내는 표현으로, ‘훔치고 죽이고’와의 점층을 살렸습니다.
- source_word: περισσὸν ἔχωσιν
  english_pob_choice: have it abundantly
  chosen_korean: 풍성히 얻게 하려고
  alternatives_korean:
  - 넉넉히 얻게 하려고
  - 충만히 얻게 하려고
  lexicon: BDAG
  rationale: περισσόν의 ‘풍성함/충만함’을 한국어에서 자연스럽게 풀어, 생명의 양과 질이 넘치는 상태를 나타내되 번영복음적 뉘앙스는 피했습니다.
theological_decisions:
- issue: ζωὴ의 범위
  chosen_reading: 생명
  alternative_readings:
