  - severity: medium
    issue: 각주 a가 본문 선택과 반대로 서술됨
    rationale: 본문은 θύσῃ를 ‘죽이고’로 번역했는데, 각주는 ‘죽이다’가 ‘죽이고’의 대안이라고 하여 논리적으로 맞지 않습니다. ‘도살하고’가 본문 ‘죽이고’의 대안이라고 해야 합니다.
  - severity: low
