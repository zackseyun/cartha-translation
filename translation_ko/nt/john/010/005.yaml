id: JHN.10.5
reference: John 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
  footnotes:
  - marker: a
    text: Or 'they will never follow a stranger.' The Greek uses an emphatic negation (οὐ μὴ).
    reason: lexical_alternative
  - marker: b
    text: '''Know the voice'' can also be understood as ''recognize the voice.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 낯선 사람을 결코 따르지 않을 것입니다[a]. 오히려 그에게서 도망칠 것입니다. 낯선 사람들의 목소리를 알지 못하기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 οὐ μή라는 강한 부정을 사용합니다. ‘절대로 따르지 않을 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘알지 못한다’는 여기서 ‘목소리를 알아보지 못한다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  english_pob_choice: a stranger
  chosen_korean: 낯선 사람
  alternatives_korean:
  - 타인
  - 이방인
  - 모르는 사람
  lexicon: BDAG
  rationale: 목자의 양 비유에서 ἀλλότριος는 ‘자기에게 속하지 않는 사람’을 가리키므로, 관계적 거리감을 살리는 ‘낯선 사람’이 가장 자연스럽습니다. ‘이방인’은 민족적 뉘앙스가 강하고, ‘타인’은 다소 약합니다.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  english_pob_choice: will certainly not follow
  chosen_korean: 결코 따르지 않을 것입니다
  alternatives_korean:
  - 절대 따르지 않을 것입니다
  - 결코 따라가지 않을 것입니다
  lexicon: BDAG
  rationale: οὐ μή + 미래는 강한 부정을 나타내므로, 현대 한국어에서 강세를 살리는 ‘결코 … 않을 것입니다’가 적절합니다.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  english_pob_choice: will flee from him
  chosen_korean: 그에게서 도망칠 것입니다
  alternatives_korean:
  - 그에게서 달아날 것입니다
  - 그에게서 피할 것입니다
  lexicon: BDAG
  rationale: φεύγω는 단순한 회피보다 더 강한 이탈·도피의 의미가 있어 ‘도망칠 것입니다’가 문맥의 긴박감을 잘 드러냅니다.
- source_word: οἴδασι τῶν ἀλλοτρίων τὴν φωνήν
  english_pob_choice: they do not know the voice of strangers
  chosen_korean: 낯선 사람들의 목소리를 알지 못하기 때문입니다
  alternatives_korean:
  - 낯선 사람들의 목소리를 알아보지 못하기 때문입니다
  - 낯선 사람들의 음성을 알지 못하기 때문입니다
  lexicon: BDAG
  rationale: οἶδα는 여기서 ‘알다’와 ‘알아보다’ 둘 다 가능하지만, 원문의 직설성을 살려 ‘알지 못하다’로 두고, ‘φωνή’는 일상적이면서도 식별 가능한 ‘목소리’로 옮겼습니다.
theological_decisions:
- issue: 비유의 해석을 본문 밖으로 확장할지 여부
  chosen_reading: 본문은 ‘낯선 사람’과 ‘목소리’를 그대로 유지하고, 이를 본문 안에서 명시적으로 ‘거짓 교사’ 등으로 풀지 않았습니다.
  alternative_readings:
  - 낯선 사람을 ‘거짓 교사’로 명시하는 번역
  - 목소리를 ‘가르침’으로 해석해 본문에 반영하는 번역
  rationale: 이 절은 양과 목자의 비유 안에서 말하며, 원문이 여기서 대상을 명시적으로 해석하지 않으므로 번역이 해석을 선취하지 않도록 했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 만큼만 말하고, 비유의 해석은 독자와 주석의 몫으로 남깁니다.'
