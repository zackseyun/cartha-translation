id: JHN.10.37
reference: John 10:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
  footnotes:
  - marker: a
    text: Or, 'do not believe what I say.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 내가 내 아버지의 일을 하고 있지 않다면, 나를 믿지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내가 말하는 것을 믿지 마십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  english_pob_choice: If
  chosen_korean: 만일 …라면
  alternatives_korean:
  - …하면
  - 만약 …라면
  lexicon: BDAG
  rationale: 조건절의 표지를 분명히 드러내되, 문어체 합쇼체에 자연스러운 ‘만일 …라면’을 택했습니다.
- source_word: ποιῶ
  english_pob_choice: am not doing
  chosen_korean: 하고 있지 않다면
  alternatives_korean:
  - 하지 않는다면
  - 행하고 있지 않다면
  lexicon: BDAG
  rationale: 현재 진행의 뉘앙스를 살려 예수님의 계속된 행위를 나타내도록 ‘하고 있지 않다’로 옮겼습니다.
- source_word: τὰ ἔργα
  english_pob_choice: the works
  chosen_korean: 일
  alternatives_korean:
  - 일들
  - 행위
  lexicon: BDAG
  rationale: 요한복음에서 예수님의 행위를 가리키는 ἔργα를 한국어로는 의미를 유지하면서도 자연스럽게 ‘일’로 옮겼습니다.
- source_word: τοῦ πατρός μου
  english_pob_choice: of my Father
  chosen_korean: 내 아버지의
  alternatives_korean:
  - 내 아버지의 일
  - 하나님의
  lexicon: BDAG
  rationale: 직역 구조를 유지해 소유 관계를 분명히 했고, 요한복음의 신적 호칭인 ‘아버지’를 그대로 살렸습니다.
- source_word: μὴ πιστεύετέ μοι
  english_pob_choice: do not believe me
  chosen_korean: 나를 믿지 마십시오
  alternatives_korean:
  - 내 말을 믿지 마십시오
  - 저를 믿지 마십시오
  lexicon: BDAG
  rationale: dative μοι의 직접적 대상인 ‘나를 믿다’를 살리되, 한국어 금지형으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: μὴ πιστεύετέ μοι의 의미 범위
  chosen_reading: 예수님의 인격에 대한 믿음과 그의 증언에 대한 신뢰를 함께 포함하는 직접적 금지로 읽었습니다.
  alternative_readings:
  - 내 말을 믿지 마십시오
  - 내 말을 받아들이지 마십시오
  rationale: 그리스어는 ‘나를 믿다’와 ‘내 말을 믿다’ 둘 다 가능하지만, 문맥상 예수님이 자신의 일들을 근거로 자신을 받아들이라고 하므로 개인적·증언적 의미를 함께 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy items 3 and 5
