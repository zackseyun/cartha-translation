    rationale: λιθάζετε는 ‘돌로 치다/돌로 죽이려 하다’의 현재 직설법입니다. ‘치려 하다’는 의도·시도라는 요소를 보태므로, 현재 대치의 직접성을 살린 ‘돌로 치고 있습니까?’가 더 충실합니다.
