  source_fidelity: ‘아버지에게서 나온’은 출처를 나타내는 원문 ἐκ τοῦ πατρός를 대체로 반영하지만, ‘나온’이 수식하는 방식은 원문보다 한국어에서 다소 우회적입니다. 또한 λιθάζετε는 현재형의 직접적 질문이므로 ‘돌로 치고 있습니까?’가 ‘치려 합니까?’보다 원문에 더 가깝습니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, ‘아버지께로부터’와 ‘그 가운데 어느 일 때문에’는 격식 있는 성경 문맥에도 적절합니다.
  terminology: ἔργα καλά는 ‘많은 좋은 일들’로 유지하여 원문의 일반적이면서도 긍정적인 평가를 보존했습니다. ‘아버지’에 ‘내’를 보태지 않았고, ‘돌로 치다’는 λιθάζω의 폭력적 행위를 직접적으로 옮겼습니다.
  issues:
