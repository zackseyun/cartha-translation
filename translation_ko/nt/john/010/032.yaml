source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
  footnotes:
  - marker: a
    text: Or 'because of which of these works.'
    reason: lexical_alternative
  - marker: b
    text: Some translations read 'from my Father,' but the Greek here says simply 'from the Father.'
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그들에게 대답하셨습니다. “내가 아버지께로부터[b] 너희에게 많은 좋은 일들을 보여 주었습니다. 그 가운데 어느 일 때문에[a] 너희가 나를 돌로 치고 있습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 일들 가운데 어느 일 때문에’
    reason: lexical_alternative
  - marker: b
    text: 일부 번역은 ‘내 아버지께로부터’로 읽지만, 여기의 그리스어는 단순히 ‘아버지께로부터’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하셨습니다
  alternatives_korean:
  - 응답하셨습니다
  - 말씀하셨습니다
  lexicon: BDAG
  rationale: 대화의 응답 동사를 자연스럽게 살리면서, 예수의 발화를 분명히 보여 주는 표준적 표현입니다.
- source_word: Πολλὰ ἔργα καλὰ
  english_pob_choice: many good works
  chosen_korean: 많은 좋은 일들
  alternatives_korean:
  - 많은 선한 일들
  - 많은 좋은 행위들
  lexicon: BDAG
  rationale: ἔργα는 요한복음에서 단순한 ‘행위’보다 예수의 사역과 행적을 가리키므로, 한국어에서는 문맥상 자연한 ‘일들’로 옮기되 καλὰ의 긍정적 평가를 ‘좋은’으로 반영했습니다.
- source_word: ἐκ τοῦ πατρός
  english_pob_choice: from the Father
  chosen_korean: 아버지에게서
  alternatives_korean:
  - 아버지로부터
  - 내 아버지에게서
  lexicon: BDAG
  rationale: 그리스어에는 소유 대명사 ‘내’가 없으므로, 영어 POB처럼 관계를 과잉 확장하지 않고 단순한 출처 표현을 한국어 조사로 보존했습니다.
- source_word: λιθάζετε
  english_pob_choice: are you stoning me
  chosen_korean: 나를 돌로 치려 합니까
  alternatives_korean:
  - 나를 돌로 치고 있습니까
  - 나를 돌로 던지려 합니까
  lexicon: BDAG
  rationale: 현재형의 대치 상황을 한국어에서 의도·진행의 긴박함으로 자연스럽게 드러내면서도, 본동사 자체의 폭력 행위를 분명히 유지했습니다.
theological_decisions:
- issue: ‘아버지’의 소유격 확장 여부
  chosen_reading: ‘아버지에게서’로 옮기고 ‘내’는 넣지 않았습니다.
  alternative_readings:
  - ‘내 아버지에게서’
  rationale: 원문에는 μου가 없으므로, 예수와 아버지의 관계를 강화해 해석하지 않고 원문의 긴장을 그대로 유지했습니다.
  doctrine_reference: 원어 우선 원칙; 번역 전통보다 문법 표지를 우선 보존
