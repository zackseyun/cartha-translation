id: JHN.10.11
reference: John 10:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
  footnotes:
  - marker: a
    text: Or "noble shepherd"; Greek καλός can denote what is good, noble, or exemplary.
    reason: lexical_alternative
  - marker: b
    text: Literally, "lays down his soul"; the Greek idiom means "lays down his life."
    reason: lexical_alternative
  - marker: c
    text: Or "on behalf of the sheep."
    reason: alternative_reading
translation:
  language: ko
  text: 나는 선한 목자입니다[a]. 선한 목자는 양들을 위하여[c] 자기 목숨을 내어놓습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “고귀한 목자”일 수 있습니다. 그리스어 καλός는 선한, 고귀한, 모범적인 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “자기 영혼을 내어놓는다”이지만, 그리스어 관용구는 “자기 목숨을 내어놓는다”는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “양들을 위해서.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  english_pob_choice: I am
  chosen_korean: 나는 ...입니다
  alternatives_korean:
  - 제가 ...입니다
  - 나는 ...이오
  lexicon: BDAG
  rationale: 그리스어의 직접적인 자기 동일시를 살리면서도, 한국어에서는 자연스러운 단정형으로 옮겼습니다. 1인칭 대명사 ‘나는’이 강조를 유지합니다.
- source_word: ποιμὴν
  english_pob_choice: shepherd
  chosen_korean: 목자
  alternatives_korean:
  - 양치기
  - 목양자
  - 목사
  lexicon: BDAG
  rationale: 이미지의 직접 대응어는 ‘목자’이며, ‘목사’는 후대 교회직분의 뉘앙스를 불필요하게 들여옵니다.
- source_word: καλός
  english_pob_choice: good
  chosen_korean: 선한
  alternatives_korean:
  - 좋은
  - 고귀한
  - 훌륭한
  lexicon: BDAG
  rationale: καλός의 도덕적·모범적 뉘앙스를 살리면서도, 목자 비유에서 한국어로 가장 자연스럽고 신학적으로도 잘 통하는 표현을 택했습니다.
- source_word: τίθησιν τὴν ψυχὴν αὐτοῦ
  english_pob_choice: lays down his life
  chosen_korean: 자기 목숨을 내어놓습니다
  alternatives_korean:
  - 자기 생명을 바칩니다
  - 자기 영혼을 내려놓습니다
  lexicon: BDAG
  rationale: ψυχή는 이 관용구에서 ‘영혼’보다 ‘목숨/생명’의 뜻이므로, 직역보다 관용적 한국어로 옮겨 의미를 분명히 했습니다.
- source_word: ὑπὲρ τῶν προβάτων
  english_pob_choice: for the sheep
  chosen_korean: 양들을 위하여
  alternatives_korean:
  - 양들을 위해
  - 양들 대신에
  - 양들을 위하여서
  lexicon: BDAG
  rationale: ὑπέρ의 대표적·유익을 위한 넓은 의미를 유지하기 위해 ‘위하여’로 옮겼고, ‘대신에’처럼 특정 속죄 해석으로 좁히지 않았습니다.
theological_decisions:
- issue: Jesus’ self-identification with Ἐγώ εἰμι in this verse
  chosen_reading: 문맥상 단순한 자기 동일시로 ‘나는 ...입니다’라고 옮기고, 추가적인 신적 이름 암시는 본문에서 확정하지 않았습니다.
  alternative_readings:
  - ‘나는 바로 ...입니다’처럼 강조를 더한 번역
  - 출애굽기적 신명 암시를 전면화한 번역
  rationale: 요한복음 전체에서는 신학적 울림이 가능하지만, 이 절 자체는 ‘나는 선한 목자입니다’라는 술어적 진술로 충분하며, 번역에서 해석을 과잉 확정하지 않는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: 신학적 긴장을 유지하고, 본문이 명시하지 않은 해석을 번역이 앞서 단정하지 않음.
- issue: ὑπὲρ τῶν προβάτων의 범위
  chosen_reading: ‘양들을 위하여’로 옮겨 대표적·대리적 가능성을 열어 두었습니다.
  alternative_readings:
  - ‘양들을 대신하여’
  - ‘양들을 위해서’
  rationale: ὑπέρ는 문맥상 유익을 위한 의미와 대표/대리의 뉘앙스를 함께 가질 수 있으므로, 특정 속죄론으로 좁히지 않는 표현이 가장 적절합니다.
  doctrine_reference: 정통 기독교 범위 안에서 본문의 의미 범위를 유지하고, 교단적 세부 교리를 번역에 선취하지 않음.
