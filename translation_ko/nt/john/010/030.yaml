lexical_decisions:
- source_word: ἐγὼ
  english_pob_choice: I
  chosen_korean: 나는
  alternatives_korean:
  - 저는
  - 내가
  lexicon: BDAG
  rationale: 1인칭 단수 대명사를 앞세워 예수의 강조를 살리되, 합쇼체 서술에 자연스럽게 맞추기 위해 주어형 ‘나는’을 택했습니다.
- source_word: ὁ πατὴρ
  english_pob_choice: the Father
  chosen_korean: 아버지
  alternatives_korean:
  - 그 아버지
  - 하나님 아버지
  lexicon: BDAG
  rationale: 요한복음의 문맥상 예수의 아버지를 가리키는 호칭이므로, 영어 POB의 대문자 구분을 한국어에서는 자연스러운 호칭 ‘아버지’로 옮겼습니다.
- source_word: ἕν
  english_pob_choice: one
  chosen_korean: 하나
  alternatives_korean:
  - 한 분
  - 한 몸
  - 일치
  lexicon: BDAG
  rationale: 중성 단수의 ‘하나’는 인격의 동일성이 아니라 온전한 하나됨을 드러내므로, 한국어에서도 추상적 ‘일치’보다 직접적인 ‘하나’를 유지했습니다.
- source_word: ἐσμεν
  english_pob_choice: are
  chosen_korean: 입니다
  alternatives_korean:
  - 있습니다
  - 됩니다
  lexicon: BDAG
  rationale: 복수 동사로서 ‘나’와 ‘아버지’의 구별을 보존해야 하므로, 단수적 합침을 암시하는 표현보다 복수 주어에 대응하는 평서형 ‘입니다’를 택했습니다.
theological_decisions:
- issue: ‘하나’가 의미하는 그리스도론적 긴장
  chosen_reading: 예수와 아버지의 실제적 하나됨을 말하되, 두 위격의 구별은 유지하는 문장으로 옮겼습니다.
  alternative_readings:
  - ‘나는 아버지와 한 분입니다’
  - ‘나는 아버지와 일치합니다’
  rationale: 중성 ‘하나’와 복수 동사가 함께 주는 긴장을 살려, 인격 혼동이나 단순한 의견 일치로 약화시키지 않도록 했습니다.
  doctrine_reference: 니케아 신경의 성자와 성부의 구별 및 하나됨; 번역 원칙 §3 신학적 긴장 보존
