  naturalness: ‘나는 내 스스로’는 주어 ‘나는’과 함께 다소 중복적으로 들립니다. ‘나는 스스로’가 현대 표준 한국어에서 자연스럽습니다. 각주 표지도 해당 어구 바로 뒤에 배치하여 독자가 적용 범위를 분명히 알 수 있게 했습니다.
