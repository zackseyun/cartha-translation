id: JHN.10.18
reference: John 10:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
  footnotes:
  - marker: a
    text: Or 'from myself' or 'on my own initiative.' The phrase stresses that Jesus gives his life voluntarily.
    reason: lexical_alternative
  - marker: b
    text: Or 'power' or 'right' for 'authority.' The Greek term can include both capability and rightful authorization.
    reason: lexical_alternative
  - marker: c
    text: That is, his life; compare the repeated 'my life' in the immediate context (John 10:17).
    reason: cross_reference
translation:
  language: ko
  text: 아무도 그것을 내게서 빼앗아 가지 않습니다. 나는 스스로[a] 그것을 내려놓습니다. 나는 그것을 내려놓을 권한이 있고, 또 그것을 다시 되찾을[c] 권한이 있습니다.[b] 이 명령을 나는 내 아버지에게서 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스스로’는 직역하면 ‘나 자신에게서’라는 뜻이며, 예수께서 자발적으로 자신의 생명을 내어 주심을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘권한’은 ἐξουσία의 가능한 뜻인 ‘권리’나 ‘권세’도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 앞문맥의 ‘내 생명’을 가리킵니다(요한복음 10:17).
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ
  english_pob_choice: No one takes it from me
  chosen_korean: 아무도 그것을 내게서 빼앗지 못합니다
  alternatives_korean:
  - 아무도 그것을 내게서 가져가지 못합니다
  - 아무도 그것을 내게서 취하지 못합니다
  lexicon: BDAG
  rationale: αἴρει는 여기서 단순히 ‘취하다’보다 ‘빼앗다/가져가다’의 강한 의미가 자연스럽고, ‘내게서’가 ἀπ’ ἐμοῦ의 출발점을 분명히 드러냅니다.
- source_word: τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ
  english_pob_choice: I lay it down of myself
  chosen_korean: 나는 내 스스로 그것을 내려놓습니다
  alternatives_korean:
  - 나는 그것을 스스로 내려놓습니다
  - 나는 내 뜻으로 그것을 내려놓습니다
  lexicon: BDAG
  rationale: τίθημι αὐτήν은 생명을 자발적으로 ‘내려놓다’는 반복 표현을 살려야 하므로, 문어적인 ‘내려놓습니다’를 택했습니다. ἀπ’ ἐμαυτοῦ는 ‘내 스스로’로 옮겨 자기주도성을 분명히 했습니다.
- source_word: ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν
  english_pob_choice: I have authority to lay it down, and I have authority to take it up again
  chosen_korean: 나는 그것을 내려놓을 권한이 있고, 또 그것을 다시 받을 권한이 있습니다
  alternatives_korean:
  - 나는 그것을 내려놓을 권세가 있고, 또 그것을 다시 받을 권세가 있습니다
  - 나는 그것을 내려놓을 권리가 있고, 또 그것을 다시 받을 권리가 있습니다
  lexicon: BDAG
  rationale: ἐξουσία는 단순한 능력보다 위임된 권한/권위를 뜻하므로 ‘권한’이 가장 균형 잡힌 대응입니다. λαβεῖν αὐτήν은 여기서 생명을 다시 회복하는 뜻이므로 ‘다시 받다’가 자연스럽습니다.
- source_word: ταύτην τὴν ἐντολὴν
  english_pob_choice: This command
  chosen_korean: 이 명령을
  alternatives_korean:
  - 이 계명을
  - 이 지시를
  lexicon: BDAG
  rationale: ἐντολή는 여기서 아버지와 아들 사이의 실제적인 ‘명령’으로 유지하는 것이 가장 직접적이며, ‘계명’은 한국어에서 윤리 조항처럼 들릴 수 있어 약화될 수 있습니다.
- source_word: παρὰ τοῦ πατρός μου
  english_pob_choice: from my Father
  chosen_korean: 내 아버지에게서
  alternatives_korean:
  - 내 아버지로부터
  - 내 아버지 곁에서
  lexicon: BDAG
  rationale: παρά + 속격은 출처를 나타내므로 ‘~에게서’가 자연스럽고 간결합니다. ‘내 아버지’는 요한복음의 친밀한 부자 관계를 그대로 살립니다.
theological_decisions:
- issue: ἀπ’ ἐμαυτοῦ의 자기 주도성과 아버지와의 관계
  chosen_reading: 내 스스로
  alternative_readings:
  - 스스로
  - 내 뜻으로
  rationale: 예수의 자발적 자기희생을 분명히 하되, 바로 뒤의 ‘내 아버지에게서 받았습니다’와 긴장 없이 함께 읽히도록 독립성보다 자발성을 강조했습니다.
  doctrine_reference: Affirmations; Translation philosophy §3
- issue: ἐξουσία의 의미
  chosen_reading: 권한
  alternative_readings:
  - 권세
  - 권리
  - 능력
  rationale: 이 구절은 죽음과 부활이 우연한 사건이 아니라 예수께 부여된 정당한 권위 아래 있음을 말하므로, 능력보다 권한이 원문의 질서와 관계성을 더 잘 보존합니다.
  doctrine_reference: Affirmations; Translation philosophy §§1, 3, 5
