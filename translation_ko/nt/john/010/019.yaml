theological_decisions:
- issue: Ἰουδαῖοι의 지시 대상
  chosen_reading: 본문에는 ‘유대인들’로 두고, 특정 집단으로 좁히지 않았습니다.
  alternative_readings:
  - 유대 사람들
  - 유대 지도자들
  rationale: 요한복음의 Ἰουδαῖοι는 문맥에 따라 범위가 달라질 수 있지만, 이 절 자체는 바로 앞의 예수의 말씀에 대한 반응을 일반적으로 서술하므로 원문 표현을 보존하는 것이 가장 적절합니다.
  doctrine_reference: translation philosophy §§1, 6
