  text: Because of these words[a], a division arose again among the Jews.
  footnotes:
  - marker: a
    text: Or 'among the Judeans' or, in some contexts in John, 'among the Jewish leaders.' The term 'the Jews' here reflects the Greek wording, but in John's Gospel it often refers to a particular group in context rather than to the Jewish people as a whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 말씀들 때문에 다시 유대인들 사이에 분쟁이 일어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 사람들 사이에’, 또는 일부 요한복음 문맥에서는 ‘유대 지도자들 사이에’. 여기서 ‘유대인들’은 그리스어 표현을 반영한 것이지만, 요한복음에서는 문맥에 따라 유대 민족 전체보다 특정 집단을 가리키는 경우가 자주 있습니다.
    reason: lexical_alternative
