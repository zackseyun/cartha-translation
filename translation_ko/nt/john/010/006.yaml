source:
  edition: SBLGNT
  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
  footnotes:
  - marker: a
    text: Or "parable," "illustration," or "proverb." The Greek word can refer broadly to a figurative saying; here it introduces Jesus' shepherd discourse in a non-literal form.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님께서 이 비유를 그들에게 말씀하셨지만, 그들은 예수님께서 자기들에게 하시는 말씀이 무엇인지 이해하지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 παροιμία는 넓게는 비유적 말, 잠언, 격언을 가리킬 수 있습니다. 여기서는 직전의 목자 담화를 가리키는 비유적 발화라는 점을 반영했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  english_pob_choice: figure of speech
  chosen_korean: 비유
  alternatives_korean:
  - 비유적인 말씀
  - 잠언
  - 비유적 표현
  lexicon: BDAG
  rationale: 요한복음에서 παροιμία는 단순한 '잠언'보다 넓은 비유적·은유적 말을 가리키므로, 문맥상 자연스럽고 독자가 이해하기 쉬운 '비유'로 옮겼습니다.
- source_word: εἶπεν
  english_pob_choice: spoke
  chosen_korean: 말씀하셨지만
  alternatives_korean:
  - 말씀하셨습니다
  - 이르셨지만
  - 말하셨지만
  lexicon: BDAG
  rationale: 예수님을 주어로 한 직접 화법에서 '말씀하다'가 가장 자연스럽고, 뒤의 대조를 살리기 위해 '하지만'을 붙였습니다.
- source_word: οὐκ ἔγνωσαν
  english_pob_choice: did not understand
  chosen_korean: 이해하지 못했습니다
  alternatives_korean:
  - 알지 못했습니다
  - 깨닫지 못했습니다
  lexicon: BDAG
  rationale: 여기서는 예수님의 비유적 발화를 '아는 것'의 문제가 아니라 그 뜻을 '파악하는 것'의 문제이므로, '이해하지 못했습니다'가 의미를 가장 잘 드러냅니다.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  english_pob_choice: what he was saying to them
  chosen_korean: 예수님께서 자기들에게 하시는 말씀이 무엇인지
  alternatives_korean:
  - 예수님께서 자기들에게 말씀하시는 것이 무엇인지
  - 예수님께서 자기들에게 하신 말씀이 무엇인지
  lexicon: BDAG
  rationale: 그리스어의 다소 어색한 구조를 한국어에서 직역하면 부자연스러우므로, 핵심 의미인 '그 말씀이 무엇인지'를 살려 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예수님의 비유적 발화의 성격
  chosen_reading: '''비유''로 옮겨, 요한복음 10장의 목자 담화를 문자 그대로의 설명이 아닌 상징적 발화로 드러냈습니다.'
  alternative_readings:
  - '''잠언'''
  - '''그림말'''
  - '''비유적인 말씀'''
  rationale: 이 절은 예수님의 담화가 청중에게 곧바로 투명하게 이해되지 않았음을 보여 주므로, 본문의 비유성 자체를 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 요 10:6 문맥상 예수의 상징적 자기계시
