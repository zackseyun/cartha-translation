  naturalness: ‘말씀하셨으나’는 현대의 격식 있는 합쇼체 서술에 자연스럽습니다. ‘예수님께서 그들에게 말씀하시던 내용’은 원문의 다소 굴절된 표현을 자연스러운 한국어로 옮기면서도, 그들이 말씀의 내용을 파악하지 못했다는 뜻을 보존합니다.
  terminology: παροιμία를 본문에서 ‘비유’로 번역하는 것은 문맥상 가능하지만, 이 단어가 좁은 의미의 비유에 한정되지 않음을 밝히는 각주가 필요합니다. 각주 표지는 해당 낱말 바로 뒤에 두는 것이 적절합니다.
