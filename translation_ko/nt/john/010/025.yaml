    rationale: a는 ‘내 아버지의 이름으로’의 대안이고 b는 ‘증언합니다’/‘나를 증언합니다’의 대안입니다. 현재처럼 문장 끝에 [a][b]를 함께 두면 어느 표현에 각주가 대응하는지 불명확합니다.
  - severity: low
    issue: ‘말했지만’은 καί를 명시적 역접으로 다소 강화합니다.
    rationale: 문맥상 불신과의 대조는 분명하지만, 원문은 단순 접속으로 연결합니다. ‘말했는데’는 자연스러운 한국어 연결을 제공하면서도 역접을 덜 확정합니다.
  revised_text: 예수께서 그들에게 대답하셨습니다. “내가 너희에게 말했는데, 너희는 믿지 않습니다. 내가 내 아버지의 이름으로[a] 행하는 일들, 바로 그 일들이 나를 증언합니다.[b]”
