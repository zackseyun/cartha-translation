id: JHN.10.25
reference: John 10:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
  footnotes:
  - marker: a
    text: Or 'by the authority of my Father.'
    reason: lexical_alternative
  - marker: b
    text: Or 'these bear witness concerning me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 대답하셨습니다. “내가 너희에게 말했지만, 너희는 믿지 않습니다. 내가 내 아버지의 이름으로 행하는 그 일들—이것들이 나에 대해 증언합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 아버지의 권위로.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이것들이 나에 관해 증언합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하셨습니다
  alternatives_korean:
  - 응답하셨습니다
  - 말씀하셨습니다
  lexicon: BDAG
  rationale: 대화 맥락에서 ἀποκρίνομαι의 표준 서술을 자연스럽게 살리면서, 단순한 발화보다 응답의 성격을 분명히 했습니다.
- source_word: Εἶπον ὑμῖν
  english_pob_choice: I told you
  chosen_korean: 내가 너희에게 말했지만
  alternatives_korean:
  - 내가 너희에게 말했습니다
  - 내가 너희에게 일러두었습니다
  lexicon: BDAG
  rationale: 이미 이전에 전한 말을 가리키므로 완료된 이전 발화를 드러내되, 한국어에서는 대조를 살리는 ‘-지만’으로 이어 자연스럽게 했습니다.
- source_word: πιστεύετε
  english_pob_choice: you do not believe
  chosen_korean: 너희는 믿지 않습니다
  alternatives_korean:
  - 너희는 믿지 않고 있습니다
  - 너희는 신뢰하지 않습니다
  lexicon: BDAG
  rationale: 요한복음에서 πιστεύω의 일관된 기본값인 ‘믿다’를 유지해 예수의 증언을 받아들이지 않는 의미를 분명히 했습니다.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  english_pob_choice: in the name of my Father
  chosen_korean: 내 아버지의 이름으로
  alternatives_korean:
  - 내 아버지의 권위로
  - 내 아버지를 대표하여
  lexicon: BDAG
  rationale: ‘이름으로’라는 헬라어 표현을 보존해 단순한 권한 부여를 넘는 대표성과 소속의 뉘앙스를 함께 살렸습니다.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  english_pob_choice: these testify about me
  chosen_korean: 이것들이 나에 대해 증언합니다
  alternatives_korean:
  - 이것들이 나를 증언합니다
  - 이것들이 나에 관해 증언합니다
  lexicon: BDAG
  rationale: μαρτυρέω의 법정적·증언적 뉘앙스를 ‘증언하다’로 살리고, 지시대명사 ταῦτα는 강조를 위해 ‘이것들’로 옮겼습니다.
theological_decisions:
- issue: 아버지의 이름으로 행한 예수의 일들의 의미
  chosen_reading: ‘내 아버지의 이름으로’라는 표현을 그대로 살려, 아버지의 승인과 권위 아래 행해진 일들이라는 점은 보이되 그 의미를 ‘권위로’로 좁혀 해석하지는 않았습니다.
  alternative_readings:
  - 내 아버지의 권위로 행하는 일들
  - 내 아버지를 대신하여 행하는 일들
  rationale: 본문은 예수의 사역이 아버지와 연결되어 있음을 말하지만, 그 관계를 번역이 미리 해석해 확정하지 않도록 긴장을 유지하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
