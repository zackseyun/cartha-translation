  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
  footnotes:
  - marker: a
    text: Or, 'But you do not believe that you are not among my sheep.' The Greek conjunction can also be read as introducing content rather than cause.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 여러분은 믿지 않습니다[a]. 여러분이 내 양에 속하지 않기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 내 양에 속하지 않기 때문에 여러분은 믿지 않습니다.’ 그리스어 접속사 ὅτι는 원인을 나타내는 말로도, 내용절을 여는 말로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞선 문맥과의 대조를 자연스럽게 살리면서도 현대 한국어에서 문장 첫머리의 반전 연결로 무난한 표준어를 택했습니다.
- source_word: οὐ πιστεύετε
  english_pob_choice: do not believe
  chosen_korean: 믿지 않습니다
  alternatives_korean:
  - 믿지 않고 있습니다
  - 믿지 않습니다
  lexicon: BDAG
  rationale: 요한복음의 πιστεύω는 단순한 인지 동의보다 예수의 증언을 받아들이는 믿음을 가리키므로, 직역적이되 현대 한국어에서 자연스러운 부정 현재로 옮겼습니다.
- source_word: ὅτι
  english_pob_choice: because
  chosen_korean: 때문입니다
  alternatives_korean:
  - 그래서입니다
  - 곧
  lexicon: BDAG
  rationale: POB의 영어처럼 원인 관계를 드러내는 것이 문맥상 가장 자연스러워서, 한국어에서는 종결형 앞의 이유 표현으로 풀어 옮겼습니다.
- source_word: ἐκ τῶν προβάτων τῶν ἐμῶν
  english_pob_choice: among my sheep
  chosen_korean: 내 양에 속하지 않기
  alternatives_korean:
  - 내 양 가운데 있지 않기
  - 내 양 무리에 속하지 않기
  lexicon: BDAG
  rationale: ἐκ은 단순한 물리적 ‘부터’보다 집단 소속/출신을 나타내므로, ‘~에 속하다’로 소속 부재를 분명히 했습니다. '양'은 군집 은유를 그대로 유지합니다.
theological_decisions:
- issue: ὅτι의 인과적/내용절 가능성
  chosen_reading: 인과적으로 읽어 ‘믿지 않습니다… 때문입니다’로 옮겼습니다.
  alternative_readings:
  - ‘믿지 않습니다, 곧 여러분이 내 양에 속하지 않기 때문입니다’라는 설명적 읽기
  - ‘믿지 않는다는 것, 곧 여러분이 내 양에 속하지 않기 때문입니다’라는 내용절 읽기
  rationale: 문맥상 예수의 양은 듣고 따르는 반면, 이들은 믿지 않는다는 대조가 이어지므로 원인 설명이 가장 자연스럽습니다. 다만 ελλην어 ὅτι의 해석 여지는 남아 있어 각주로 보존했습니다.
  doctrine_reference: 해석상의 긴장을 보존하고 단정적 신학 결론으로 좁히지 않음
