  source_fidelity: 본문은 Εἶπεν, πάλιν, Ἀμὴν ἀμὴν, ἐγώ εἰμι, θύρα τῶν προβάτων을 전반적으로 충실히 반영합니다. 다만 οὖν은 이 문맥에서 강한 논리적 결론을 뜻하는 ‘그러므로’보다 앞선 대화에 이어지는 ‘그러자’가 더 자연스럽고 범위를 과장하지 않습니다. θύρα의 대안 주석은 원문의 어휘적 범위 안에서 명료하게 고쳐야 합니다.
  naturalness: ‘그러자 예수께서 그들에게 다시 말씀하셨습니다’는 현대 표준 한국어 합쇼체 서술로 자연스럽습니다. ‘양들의 문’은 요한복음의 비유적 표현을 보존하는 관습적이고 이해 가능한 표현입니다.
  terminology: ‘진실로, 진실로’, ‘나는’, ‘양들의 문’은 엄숙한 요한복음 문체와 핵심 은유를 적절히 보존합니다. 기존 주석의 ‘양들의 문이 아니라’라는 표현은 본문 번역을 부정하는 듯하고, 제시된 대안도 불명확하므로 ‘출입문’이라는 어휘적 대안으로 바로잡습니다.
