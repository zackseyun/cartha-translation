id: JHN.10.7
reference: John 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
  footnotes:
  - marker: a
    text: Or “the gate of the sheep.” The Greek θύρα can mean “door” or “gate,” especially in shepherding imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 예수께서 그들에게 다시 말씀하셨습니다. "진실로, 진실로 내가 여러분에게 말합니다. 나는 양들의 문입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “양들의 문”이 아니라 “양들의 우리 문/양문”으로 이해할 수 있습니다. 그리스어 θύρα는 문, 문간, 출입구를 가리킬 수 있으며, 목자 이미지에서는 ‘문’과 ‘문간’의 뉘앙스가 모두 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν οὖν πάλιν αὐτοῖς
  english_pob_choice: So Jesus said to them again
  chosen_korean: 그러므로 예수께서 그들에게 다시 말씀하셨습니다
  alternatives_korean:
  - 그리하여 예수께서 그들에게 다시 말씀하셨습니다
  - 예수께서 그들에게 다시 말씀하셨습니다
  lexicon: SBLGNT
  rationale: οὖν의 이어짐을 ‘그러므로’로 드러내고, πάλιν을 ‘다시’로 옮겨 앞선 대화의 재개를 자연스럽게 살렸습니다.
- source_word: Ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로, 진실로
  alternatives_korean:
  - 아멘, 아멘
  - 참으로, 참으로
  lexicon: BDAG
  rationale: 요한복음의 이중 엄숙 공식을 한국어에서 반복형으로 보존하되, 회중적 표현인 ‘아멘, 아멘’보다 직접적이고 현대적인 ‘진실로, 진실로’를 택했습니다.
- source_word: ἐγώ εἰμι
  english_pob_choice: I am
  chosen_korean: 나는
  alternatives_korean:
  - 내가 바로
  - 내가
  lexicon: BDAG
  rationale: 문장 구조상 주어의 강조를 살리면서도 자연스러운 한국어로 옮기기 위해 ‘나는’으로 처리했습니다.
- source_word: ἡ θύρα
  english_pob_choice: the door
  chosen_korean: 문
  alternatives_korean:
  - 문지기
  - 문짝
  - 문/문이 되는 이
  lexicon: BDAG
  rationale: θύρα는 기본적으로 ‘문’이므로 본문에는 직접 대응어를 사용했습니다. 양우리 이미지에서 ‘문’은 진입점이라는 상징을 가장 투명하게 전달합니다.
- source_word: τῶν προβάτων
  english_pob_choice: for/of the sheep
  chosen_korean: 양들의
  alternatives_korean:
  - 양들을 위한
  - 양의
  - 양 떼의
  lexicon: BDAG
  rationale: 속격의 관계를 과도하게 풀지 않고, ‘양들의 문’으로 문이 양들과 연결된 소속·관계 의미를 간결하게 보존했습니다.
theological_decisions:
- issue: θύρα의 비유를 한국어에서 어떻게 유지할지
  chosen_reading: ‘양들의 문’으로 직역에 가깝게 유지해 예수의 자기계시와 접근의 은유를 그대로 드러냈습니다.
  alternative_readings:
  - ‘양들의 문지기’로 오해되지 않게 풀어쓰기
  - ‘양들을 위한 문’으로 기능을 명시하기
  rationale: 본문은 예수를 양우리의 출입점으로 제시하므로, 해석을 덧붙이기보다 은유 자체를 보존하는 것이 source-direct합니다.
  doctrine_reference: Preserve metaphor and theological tension; optimal equivalence
