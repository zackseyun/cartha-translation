id: JHN.10.3
reference: John 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
  footnotes:
  - marker: a
    text: Or 'brings them out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 문지기는 그에게 문을 열어 주고, 양들은 그의 음성을 듣고, 그는 자기 양들의 이름을 하나하나 부르고 그들을 데리고 나갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들을 이끌어 냅니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ / αὐτόν
  english_pob_choice: To him
  chosen_korean: 그에게
  alternatives_korean:
  - 이 사람에게
  - 그분에게
  lexicon: BDAG
  rationale: 앞선 절의 목자 인물을 가리키는 대명사는 한국어에서 자연스럽게 ‘그에게’로 옮기는 것이 가장 직접적이며, 불필요한 해석을 덧붙이지 않습니다.
- source_word: θυρωρὸς
  english_pob_choice: gatekeeper
  chosen_korean: 문지기
  alternatives_korean:
  - 대문지기
  - 문간지기
  lexicon: BDAG
  rationale: 목장/울타리 문맥에서 ‘문지기’는 한국어로 가장 익숙하고 기능을 잘 드러내며, ‘gatekeeper’의 역할을 충분히 반영합니다.
- source_word: τὰ πρόβατα
  english_pob_choice: the sheep
  chosen_korean: 양들은
  alternatives_korean:
  - 양 떼는
  - 양들이
  lexicon: BDAG
  rationale: 목자 비유에서 πρόβατα는 문자 그대로 ‘양들’이 자연스럽고, 주어 반복을 살려 흐름을 매끄럽게 합니다.
- source_word: φωνεῖ κατ’ ὄνομα
  english_pob_choice: calls his own sheep by name
  chosen_korean: 이름대로 불러서
  alternatives_korean:
  - 이름을 불러
  - 각각 이름을 불러
  - 이름으로 불러
  lexicon: BDAG
  rationale: κατ’ ὄνομα는 개별적으로/이름마다라는 뜻이므로, ‘이름대로’가 호명의 개별성을 간결하게 살립니다. ‘불러서’는 다음 동작인 인도와 자연스럽게 이어집니다.
- source_word: ἐξάγει
  english_pob_choice: leads them out
  chosen_korean: 데리고 나갑니다
  alternatives_korean:
  - 이끌어 냅니다
  - 밖으로 데려갑니다
  - 이끌어 나갑니다
  lexicon: BDAG
  rationale: 여기서는 단순한 이동보다 목자의 인도 행위를 드러내는 것이 중요하므로, ‘데리고 나갑니다’가 가장 자연스럽고 관계적입니다.
theological_decisions:
- issue: 목자 비유의 직접성 유지
  chosen_reading: 본문의 비유적 행위를 그대로 살려, 문지기·양·음성·호명·인도의 순서를 해석 없이 제시했습니다.
  alternative_readings:
  - 목자의 신원이나 그리스도론을 본문 문구 안에 더 분명히 드러내는 번역
  rationale: 이 절은 비유 속 장면 자체를 묘사하므로, 본문이 말하는 범위를 넘어서기보다 독자가 문맥 안에서 의미를 읽도록 두는 것이 원문에 충실합니다.
  doctrine_reference: 원문 우선, 비유의 긴장 보존
