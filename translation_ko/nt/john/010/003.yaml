review_pass:
  verdict: revise
  source_fidelity: 대체로 원문 순서와 목자 비유의 행위를 충실히 반영합니다. 다만 κατ’ ὄνομα는 각 양을 이름으로 부르는 뜻이므로 ‘이름대로’보다 ‘이름을 하나하나 불러’가 더 정확합니다. ἐξάγει의 대안 각주는 본문의 ‘데리고 나갑니다’와 사실상 중복되지 않도록 구별할 필요가 있습니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. ‘자기 양들을 이름대로 불러서’는 현대 한국어에서 다소 어색하고 뜻이 흐려질 수 있으므로, ‘자기 양들의 이름을 하나하나 부르고’로 다듬는 것이 자연스럽습니다.
  terminology: ‘문지기’, ‘양들’, ‘음성’, ‘자기 양들’은 목자 비유의 어휘와 격식에 적절합니다. ‘문을’은 ἀνοίγει의 생략된 목적어를 한국어에서 자연스럽게 보충한 것입니다.
  issues:
