translation:
  language: ko
  text: 그러나 그들 가운데 많은 사람이 말하고 있었습니다. “그에게는 귀신이 들려 있고 미쳐 있습니다. 왜 그에게 귀를 기울이십니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
