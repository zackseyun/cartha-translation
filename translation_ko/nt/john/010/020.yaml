source:
  edition: SBLGNT
  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
  footnotes:
  - marker: a
    text: Or, “He is demon-possessed and mad.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데 많은 사람이 말하고 있었습니다. “그에게는 귀신이 들려 있고, 미쳐 있습니다. 왜 그에게 귀를 기울이십니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “그는 귀신 들린 사람이고 미쳤습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον δὲ
  english_pob_choice: But many of them were saying
  chosen_korean: 그들 가운데 많은 사람이 말하고 있었습니다
  alternatives_korean:
  - 그들 가운데 많은 사람이 말했습니다
  - 그러나 그들 가운데 많은 사람이 말하고 있었습니다
  lexicon: BDAG
  rationale: 미완료 시상의 반복·지속적 발화를 살려 ‘말하고 있었습니다’로 옮겼고, δὲ의 대조는 문맥상 충분히 드러나므로 앞뒤 문장 흐름에 맡겼습니다.
- source_word: πολλοὶ ἐξ αὐτῶν
  english_pob_choice: many of them
  chosen_korean: 그들 가운데 많은 사람
  alternatives_korean:
  - 그들 중 많은 사람
  - 많은 이들
  lexicon: BDAG
  rationale: ἐξ αὐτῶν의 부분적 의미를 자연스럽게 살려 ‘그들 가운데’로 옮겼습니다.
- source_word: Δαιμόνιον ἔχει
  english_pob_choice: He has a demon
  chosen_korean: 그에게는 귀신이 들려 있고
  alternatives_korean:
  - 그는 귀신이 있습니다
  - 그는 귀신 들린 사람입니다
  lexicon: BDAG
  rationale: 직역적 구조를 유지하되 한국어에서 자연스러운 비난 표현으로 다듬었습니다. 다만 ‘귀신이 들려 있다’는 표현은 POB의 투명성을 해치지 않으면서도 현대 한국어에서 이해되기 쉽습니다.
- source_word: μαίνεται
  english_pob_choice: is insane
  chosen_korean: 미쳐 있습니다
  alternatives_korean:
  - 정신이 나가 있습니다
  - 제정신이 아닙니다
  lexicon: BDAG
  rationale: 현대 한국어에서 모욕적·판정적 의미를 분명히 드러내는 표현으로, 영어 POB의 ‘is insane’에 대응시켰습니다.
- source_word: τί αὐτοῦ ἀκούετε;
  english_pob_choice: Why do you listen to him?
  chosen_korean: 왜 그에게 귀를 기울이십니까?
  alternatives_korean:
  - 왜 그를 들으십니까?
  - 왜 그 말씀을 듣습니까?
  lexicon: BDAG
  rationale: ἀκούω + 속격의 ‘듣다/귀를 기울이다’ 의미를 살리면서, 한국어에서 자연스러운 비난의 질문으로 옮겼습니다.
theological_decisions:
- issue: 적대적 발언의 수위와 직설성 보존
  chosen_reading: ‘귀신이 들려 있고, 미쳐 있습니다’처럼 원문의 모욕을 완화하지 않고 직접적으로 옮겼습니다.
  alternative_readings:
  - ‘귀신 들린 사람입니다, 미쳤습니다’처럼 더 관용적인 표현
  - ‘귀신이 있습니다’처럼 완곡한 표현
  rationale: 이 구절은 예수에 대한 적대적 비난 자체가 서술상의 긴장을 이루므로, 전통적 완곡화보다 원문이 지닌 공격성을 유지하는 편이 본문 기능을 더 잘 드러냅니다.
  doctrine_reference: 서술적 긴장 보존; 번역에서의 완곡화 지양
