id: JHN.10.24
reference: John 10:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
  footnotes:
  - marker: a
    text: Or more literally, “How long do you keep our soul hanging?”—an idiom meaning to keep someone in uncertainty or suspense.
    reason: lexical_alternative
  - marker: b
    text: In John, “the Jews” can in context refer more specifically to the Judean authorities or opponents of Jesus, not to the Jewish people as a whole.
    reason: cultural_note
translation:
  language: ko
  text: 그래서 유대인들이 그를 둘러싸고 그에게 말했습니다. “언제까지 우리 영을 들었다 놓으시렵니까? 당신이 메시아라면, 분명히 말씀해 주십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “우리 영을 언제까지 들었다 놓으십니까?”라는 뜻으로, 사람을 불확실함이나 초조함 속에 두는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 요한복음에서 “유대인들”은 문맥에 따라 유대 민족 전체보다 더 좁게, 특히 유대 지도층이나 예수의 반대자들을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  english_pob_choice: surrounded
  chosen_korean: 둘러싸고
  alternatives_korean:
  - 에워싸고
  - 포위하고
  lexicon: BDAG
  rationale: κυκλόω는 물리적으로 둘러싸거나 에워싸는 뜻이므로, ‘둘러싸고’가 자연스러운 현대 한국어이면서 대치적인 분위기를 잘 드러냅니다.
- source_word: ἔλεγον αὐτῷ
  english_pob_choice: were saying to him
  chosen_korean: 그에게 말했습니다
  alternatives_korean:
  - 그에게 계속 말했습니다
  - 그에게 말하고 있었습니다
  lexicon: BDAG
  rationale: 미완료 시제의 반복·지속 뉘앙스는 살리되, 한국어 본문에서는 현재 진행형보다 서술의 자연스러움을 위해 ‘말했습니다’로 처리했습니다.
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  english_pob_choice: will you keep us in suspense
  chosen_korean: 우리 영을 들었다 놓으시렵니까
  alternatives_korean:
  - 우리 목숨을 빼앗으시렵니까
  - 우리 영을 붙들고 계시렵니까
  - 우리 마음을 계속 흔드십니까
  lexicon: BDAG
  rationale: 직역하면 ‘우리 영/생명을 들어 올리다’인데, 본문은 불확실성과 초조함을 뜻하는 관용구입니다. 영어 POB의 ‘keep us in suspense’를 한국어로 옮기되, 원문의 이미지가 보이도록 ‘들었다 놓으시렵니까’로 표현했습니다.
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 구원자
  lexicon: DOCTRINE.md Contested terms
  rationale: 여기서는 호칭적 용법의 Χριστός이므로, 유대적 왕-구원자 칭호를 살려 ‘메시아’로 옮겼습니다.
- source_word: παρρησίᾳ
  english_pob_choice: plainly
  chosen_korean: 분명히
  alternatives_korean:
  - 공개적으로
  - 노골적으로
  - 솔직히
  lexicon: BDAG
  rationale: παρρησία는 공개성, 담대함, 분명함의 의미를 가질 수 있으나, 이 문맥에서는 모호함 없이 직접 밝히라는 요구이므로 ‘분명히’가 가장 적절합니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 번역 범위
  chosen_reading: 유대인들
  alternative_readings:
  - 유대 지도자들
  - 유대인들 곧 유대 지도층
  rationale: 본문 자체는 더 좁은 범주를 명시하지 않으므로, 원문 표현을 그대로 반영했습니다. 문맥상 특정 집단을 가리킬 수 있다는 해석은 본문 밖에서만 주석적으로 보완할 수 있습니다.
  doctrine_reference: 'Translation philosophy: 원문의 표현을 보존하고, 문맥적 축소는 본문이 아니라 주석에서 처리'
