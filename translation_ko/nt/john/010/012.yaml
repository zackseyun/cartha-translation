  lexicon: BDAG
  rationale: 분사구문을 한국어 관계절보다 서술형으로 자연스럽게 처리하면서, 이 사람이 참된 목자가 아님을 분명히 했습니다.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  english_pob_choice: whose sheep are not his own
  chosen_korean: 자기 소유의 양도 없는
