  - 고용된 사람
  lexicon: BDAG
  rationale: 단순한 직업명이 아니라 임금을 받고 일하는 자를 가리키므로, 현대 한국어에서 자연스럽고 의미가 드러나는 ‘품삯을 받는 사람’으로 옮겼습니다.
- source_word: οὐκ ὢν ποιμήν
