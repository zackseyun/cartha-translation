id: JHN.10.12
reference: John 10:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
  footnotes:
  - marker: a
    text: Or 'abandons the sheep.' The verb 'leaves' can carry the stronger sense of deserting them in danger.
    reason: lexical_alternative
translation:
  language: ko
  text: 품삯을 받는 사람으로서 목자가 아니고 자기 소유의 양도 없는 그 사람은 늑대가 오는 것을 보고 양을 버려두고 달아납니다—그러면 늑대가 그것들을 낚아채고 흩어 버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘버려두고’는 단순히 떠나는 것보다 위험 속에 남겨 두고 책임을 저버리는 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτὸς
  english_pob_choice: hired hand
  chosen_korean: 품삯을 받는 사람
  alternatives_korean:
  - 품꾼
  - 고용된 사람
  lexicon: BDAG
  rationale: 단순한 직업명이 아니라 임금을 받고 일하는 자를 가리키므로, 현대 한국어에서 자연스럽고 의미가 드러나는 ‘품삯을 받는 사람’으로 옮겼습니다.
- source_word: οὐκ ὢν ποιμήν
  english_pob_choice: who is not a shepherd
  chosen_korean: 목자가 아니고
  alternatives_korean:
  - 목자가 아닌
  - 목자가 되지 못하는
  lexicon: BDAG
  rationale: 분사구문을 한국어 관계절보다 서술형으로 자연스럽게 처리하면서, 이 사람이 참된 목자가 아님을 분명히 했습니다.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  english_pob_choice: whose sheep are not his own
  chosen_korean: 자기 소유의 양도 없는
  alternatives_korean:
  - 그의 양이 아닌
  - 자기 양이 아닌
  lexicon: BDAG
  rationale: ἴδια의 소유/귀속 뉘앙스를 살리기 위해 ‘자기 소유’로 옮겼고, 소속의 결핍을 간명하게 드러냈습니다.
- source_word: ἀφίησιν
  english_pob_choice: leaves
  chosen_korean: 버려두고
  alternatives_korean:
  - 두고 가고
  - 떠나고
  lexicon: BDAG
  rationale: 문맥상 단순히 ‘두다’보다 위험 속에서 방치하는 책임 회피가 강하므로, POB의 주석 취지를 반영해 ‘버려두고’로 옮겼습니다.
- source_word: ἁρπάζει
  english_pob_choice: snatches
  chosen_korean: 낚아채고
  alternatives_korean:
  - 빼앗고
  - 채가고
  lexicon: BDAG
  rationale: 포식자의 폭력적 빼앗음을 한국어 동사 ‘낚아채다’로 생생하게 살렸습니다.
- source_word: σκορπίζει
  english_pob_choice: scatters them
  chosen_korean: 흩어 버립니다
  alternatives_korean:
  - 흩어 놓습니다
  - 흩어집니다
  lexicon: BDAG
  rationale: 대상을 흩뜨려 놓는 결과를 분명히 하기 위해 목적어를 생략하지 않고 자연스러운 한국어로 처리했습니다.
theological_decisions:
- issue: 목자 비유의 직접성 유지
  chosen_reading: ‘목자’, ‘품삯을 받는 사람’, ‘늑대’, ‘양’의 구체적 비유를 그대로 유지했습니다.
  alternative_readings:
  - ‘지도자’, ‘보호자’ 같은 해석적 추상어로 바꾸기
  rationale: 요한복음 10장의 의미는 지속되는 목자-양 비유에 있으므로, 설명적 표현으로 바꾸지 않고 원문 이미지를 보존하는 것이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 원어 우선, 과도한 의역 금지
