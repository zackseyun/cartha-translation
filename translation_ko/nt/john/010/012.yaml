  rationale: 요한복음 10장의 의미는 지속되는 목자-양 비유에 있으므로, 설명적 표현으로 바꾸지 않고 원문 이미지를 보존하는 것이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 원어 우선, 과도한 의역 금지
