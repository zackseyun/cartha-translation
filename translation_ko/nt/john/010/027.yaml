  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: ko
  text: 내 양들은 내 음성을 듣습니다. 나는 그들을 알고, 그들은 나를 따릅니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόβατα
  english_pob_choice: sheep
  chosen_korean: 양들
  alternatives_korean:
  - 양
  - 양떼
  - 양 무리
  lexicon: BDAG
  rationale: ‘sheep’의 자연스러운 대응으로 복수형 ‘양들’을 택해 목자-양 비유의 직접성을 살렸습니다.
- source_word: φωνῆς
  english_pob_choice: voice
  chosen_korean: 음성
  alternatives_korean:
  - 목소리
  - 소리
  lexicon: BDAG
  rationale: 사람의 인격적 식별이 핵심인 문맥에서 ‘음성’이 ‘소리’보다 더 정확하고, ‘목소리’보다 다소 격조 있게 들립니다.
- source_word: γινώσκω
  english_pob_choice: know
  chosen_korean: 알다
  alternatives_korean:
  - 알고 있다
  - 친히 아시다
  - 인정하다
  lexicon: BDAG
  rationale: 관계적 인지를 뜻하는 기본 의미를 유지하면서도, 문장 흐름상 ‘나는 그들을 압니다’보다 간결한 ‘나는 그들을 알고’가 자연스럽습니다.
- source_word: ἀκολουθοῦσίν μοι
  english_pob_choice: they follow me
  chosen_korean: 그들은 나를 따릅니다
  alternatives_korean:
  - 그들은 나를 따라옵니다
  - 그들은 나를 좇습니다
  lexicon: BDAG
  rationale: 현재형의 상습·특성적 의미를 한국어 현재 서술로 옮기고, 현대 표준어에서 가장 자연스러운 ‘따르다’를 사용했습니다.
theological_decisions:
- issue: γινώσκω의 관계적 깊이
  chosen_reading: ‘알다’로 번역해, 친밀한 관계성과 식별의 의미를 열어 두었습니다.
  alternative_readings:
  - ‘친히 아시다’
  - ‘인정하다’
  - ‘알아보시다’
  rationale: 본문은 목자와 양의 상호 관계를 드러내지만, 원문이 요구하지 않는 설명적 확장을 피하고 의미의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
