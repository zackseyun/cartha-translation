  rationale: 목적절을 ‘그를 돌로 치려고’로 직접 옮겨 ἵνα의 목적 용법을 보존하고, 중복적이고 부자연스러운 설명문을 제거했습니다. 본문의 ‘유대인들’은 원문의 표현을 유지하되, 각주에서 문맥상 더 좁거나 지리적인 의미 가능성을 구별하여 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:58Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 οὖν, πάλιν, λίθους, ἵνα 목적절, λιθάσωσιν을 모두 반영해야 합니다. 초안의 ‘그것은 … 것이었습니다’는 ἵνα의 목적을 설명문으로 바꾸어 문장 연결을 약화시키므로, 목적 표현을 직접 연결하는 편이 원문에 더 충실합니다.
  naturalness: ‘그러자 유대인들이 그를 돌로 치려고 다시 돌을 집어 들었습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 행동의 목적도 명료하게 드러냅니다.
  terminology: ‘유대인들’은 οἱ Ἰουδαῖοι의 직접적인 번역으로 유지할 수 있습니다. 다만 각주 대안에서 ‘유대 사람들’은 본문의 ‘유대인들’과 실질적으로 구별되지 않으므로, 영어 감사 기록의 ‘Judeans’에 상응하는 ‘유대 지방 사람들’로 고쳐야 합니다. ‘돌로 치다’는 λιθάζω에 적절합니다.
  issues:
  - severity: medium
    issue: 목적절이 불필요한 설명문으로 전환됨
    rationale: ‘그것은 그를 돌로 치려는 것이었습니다’는 ἵνα λιθάσωσιν αὐτόν의 직접적인 목적 관계를 우회적으로 풀이합니다. ‘그를 돌로 치려고’로 연결하면 원문의 구문과 한국어 문체를 함께 살릴 수 있습니다.
  - severity: low
    issue: 각주의 두 번째 대안이 본문 표현과 구별되지 않음
    rationale: ‘유대 사람들’은 ‘유대인들’과 사실상 같은 범주여서 번역 대안이 되지 못합니다. 문맥상 가능한 지리적 의미를 나타내려면 ‘유대 지방 사람들’이 더 적절합니다.
  revised_text: 그러자 유대인들이 그를 돌로 치려고 다시 돌을 집어 들었습니다.[a]
