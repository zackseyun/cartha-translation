  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
  footnotes:
  - marker: a
    text: Or possibly, in context, 'the Jewish leaders' or 'the Judeans.' John's phrase 'the Jews' often refers to particular Jewish opponents of Jesus rather than to the Jewish people as a whole.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 유대인들이 다시 돌을 집어 들었습니다. 그것은 그를 돌로 치려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 문맥상 ‘유대 지도자들’ 혹은 ‘유대 사람들’일 수 있습니다. 요한복음에서 ‘유대인들’은 종종 유대 민족 전체가 아니라 예수의 특정 반대자들을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  english_pob_choice: picked up
  chosen_korean: 집어 들었습니다
  alternatives_korean:
  - 들었습니다
  - 들어 올렸습니다
  lexicon: BDAG
  rationale: 돌을 즉시 사용하려는 장면이므로 단순한 ‘가지고 갔다’보다 ‘집어 들었다’가 영어 POB의 뉘앙스를 살리면서도 자연스럽습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러자
  alternatives_korean:
  - 그래서
  - 그러므로
  lexicon: BDAG
  rationale: 앞선 발언에 대한 서술의 진행을 보여 주는 연결이므로, 현대 한국어 서사에서 자연스러운 ‘그러자’로 옮겼습니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대 지도자들
  - 유대 사람들
  lexicon: BDAG
  rationale: 본문은 문자적으로 ‘유대인들’이지만, 요한복음의 문맥상 특정 반대자들을 가리킬 수 있어 그 범위를 과도하게 좁히지 않으면서도 오해를 줄이는 표현을 택했습니다.
- source_word: λιθάσωσιν
  english_pob_choice: stone
  chosen_korean: 돌로 치려는
  alternatives_korean:
  - 돌로 치다
  - 돌로 죽이려는
  lexicon: BDAG
  rationale: 동사 자체는 ‘돌로 치다’이지만, 목적절의 의도를 한국어로 자연스럽게 드러내기 위해 ‘돌로 치려는 것’으로 풀었습니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 번역 범위
  chosen_reading: 본문에는 ‘유대인들’로 두고, 특정 민족 전체를 일반화하지 않도록 문맥상 반대자 집단의 가능성을 열어 둡니다.
  alternative_readings:
  - 유대 지도자들
  - 유대 사람들
  rationale: 원문은 일반화나 축소를 명시하지 않으므로 본문은 직역에 가깝게 유지하되, 요한복음의 용례상 문맥적 제한 가능성을 해설로 남기는 것이 source-grounded합니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy), §3 (preserve tension rather than resolve it)
