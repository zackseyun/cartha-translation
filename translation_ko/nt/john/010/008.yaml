id: JHN.10.8
reference: John 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
  footnotes:
  - marker: a
    text: Or 'ahead of me.' The phrase may be understood temporally ('before me') or with the sense of coming in advance while claiming authority apart from Jesus; the context suggests false shepherds rather than all earlier servants of God.
    reason: alternative_reading
translation:
  language: ko
  text: 나보다 먼저 온 사람들은 모두 도둑이며 강도입니다. 그러나 양들은 그들의 말을 듣지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나보다 앞서’. 이 표현은 시간적 ‘나보다 먼저’로도, 예수의 권위와 별개로 앞서 나섰다는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  english_pob_choice: All who
  chosen_korean: 모두
  alternatives_korean:
  - 모든 사람
  - 누구든지
  lexicon: BDAG
  rationale: 관형절을 한국어에서 자연스럽게 풀어 ‘모두’로 집약하되, 뒤의 관계절과 함께 포괄적 대상을 분명히 합니다.
- source_word: πρὸ ἐμοῦ
  english_pob_choice: before me
  chosen_korean: 나보다 먼저
  alternatives_korean:
  - 내 앞에
  - 나보다 앞서
  lexicon: BDAG
  rationale: 시간적 우선성을 가장 직접적으로 드러내는 표현을 택하되, 본문이 가진 ‘앞서 옴/선행함’의 뉘앙스를 한국어에서도 유지합니다.
- source_word: κλέπται ... λῃσταί
  english_pob_choice: thieves ... robbers
  chosen_korean: 도둑이며 강도
  alternatives_korean:
  - 도둑이며 약탈자
  - 도둑이며 산적
  lexicon: BDAG
  rationale: 두 명사를 구별해 옮기면서도 짝을 이룬 부정적 인물을 자연스러운 한국어로 전달합니다. ‘강도’는 λῃσταί의 폭력성과 약탈성을 함께 살립니다.
- source_word: οὐκ ἤκουσαν αὐτῶν
  english_pob_choice: did not listen to them
  chosen_korean: 그들의 말을 듣지 않았습니다
  alternatives_korean:
  - 그들에게 귀를 기울이지 않았습니다
  - 그들을 듣지 않았습니다
  lexicon: BDAG
  rationale: ἀκούω는 단순 청취보다 응답적 청취의 뜻이 있어, 목자-양 비유에 맞게 ‘말을 듣지 않다’로 옮겼습니다.
theological_decisions:
- issue: πρὸ ἐμοῦ의 범위와 함의
  chosen_reading: 본문은 ‘나보다 먼저 온 사람들’로 직역성을 유지하고, 그 대상을 본문 안에서 더 좁히지 않았습니다.
  alternative_readings:
  - 나보다 앞서 온 사람들
  - 나보다 먼저 온 사람들 [즉, 예수의 권위와 무관하게 나선 이들]
  rationale: 그리스어 표현은 넓게 들리며, 문맥상 모든 이전 하나님의 종을 정죄하는 것으로 오해되지 않도록 본문은 그대로 두고 해석적 한정은 덧붙이지 않습니다.
  doctrine_reference: 문맥적 긴장을 보존하고, 본문 해석은 주석 영역에 남깁니다.
