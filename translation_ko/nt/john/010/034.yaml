id: JHN.10.34
reference: John 10:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
  footnotes:
  - marker: a
    text: Or 'divine beings.' Jesus is quoting Psalm 82:6, where the term is debated in interpretation; the main text preserves the direct wording of the citation.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 대답하셨습니다. “너희 율법에 ‘내가 말하였다. 너희는 신들이다[a]’라고 기록되어 있지 않습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신적 존재들’. 예수께서 시편 82:6을 인용하신 것으로, 이 표현의 의미는 해석상 논쟁이 있으나 본문은 직접 인용의 표현을 그대로 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  english_pob_choice: answered them
  chosen_korean: 그들에게 대답하셨습니다
  alternatives_korean:
  - 그들에게 답하셨습니다
  - 그들에게 응답하셨습니다
  lexicon: BDAG
  rationale: 대화 장면의 표준적인 응답 동사로, 자연스러운 현대 한국어 합쇼체에서 가장 직접적으로 기능을 옮깁니다.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  english_pob_choice: in your Law
  chosen_korean: 너희 율법에
  alternatives_korean:
  - 너희 법에
  - 너희 율법서에
  lexicon: BDAG
  rationale: νόμος는 여기서 시편 82:6을 가리키는 성경적 권위 표현이므로, 단순한 법이 아니라 ‘율법’으로 옮기되 소유격 ‘너희’를 유지해 예수의 반박 어조를 살렸습니다.
- source_word: Θεοί ἐστε
  english_pob_choice: you are gods
  chosen_korean: 너희는 신들이다
  alternatives_korean:
  - 너희는 하나님들이다
  - 너희는 신적 존재들이다
  lexicon: BDAG
  rationale: 시편 인용의 직접성을 살리기 위해 해석을 덧붙이지 않고 ‘신들’로 옮겼습니다. POB의 본문 유지 원칙에 따라 문맥적 설명은 본문이 아니라 주석에 두는 것이 적절합니다.
- source_word: γεγραμμένον
  english_pob_choice: written
  chosen_korean: 기록되어 있지 않습니까
  alternatives_korean:
  - 기록된 것이 아닙니까
  - 쓰여 있지 않습니까
  lexicon: BDAG
  rationale: 성경 인용을 여는 관용구로서 ‘기록되어 있다’를 쓰되, 수사 의문형을 그대로 살려 예수의 논박 형식을 자연스럽게 전달합니다.
theological_decisions:
- issue: 시편 82:6의 θεοί 번역
  chosen_reading: ‘신들’로 직역하여 본문에 유지합니다.
  alternative_readings:
  - ‘신적 존재들’로 완화해 옮김
  - ‘하나님들’로 강하게 신학화함
  rationale: 예수의 논증은 인용문의 날카로움에 의존하므로, 해석적 완화보다 원문 어휘를 우선했습니다. 독자가 오해할 수 있는 점은 주석으로 처리하는 것이 본문 충실도에 더 적합합니다.
  doctrine_reference: 원문 우선 원칙과 인용문 보존; 시편 82편의 해석 논쟁은 본문에서 해결하지 않음
