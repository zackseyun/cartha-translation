id: JHN.10.15
reference: John 10:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
  footnotes:
  - marker: a
    text: Or 'my soul.' Here the sense is 'my life' in the context of self-sacrifice.
    reason: lexical_alternative
  - marker: b
    text: Or 'on behalf of the sheep.' The Greek preposition can carry representative or sacrificial force.
    reason: alternative_reading
translation:
  language: ko
  text: 아버지께서 나를 아시는 것처럼 나도 아버지를 압니다. 나는 양들을 위하여[b] 내 생명[a]을 내려놓습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼.’ 이 문맥에서는 자기희생적 죽음을 가리키므로 ‘내 생명’이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘양들을 대신하여.’ 그리스어 전치사는 대표적 또는 희생적 의미를 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  english_pob_choice: just as
  chosen_korean: —하는 것처럼
  alternatives_korean:
  - 같이
  - 마치
  lexicon: BDAG
  rationale: 앞의 비교 관계를 자연스럽게 드러내되, 아버지와 아들 사이의 상호 인식의 대응을 약화시키지 않도록 했습니다.
- source_word: γινώσκει / γινώσκω
  english_pob_choice: knows / know
  chosen_korean: 아시다 / 알다
  alternatives_korean:
  - 알고 계시다 / 이해하다
  - 친밀하게 아시다 / 친밀하게 알다
  lexicon: BDAG
  rationale: 단순 정보가 아니라 관계적·상호적 인식을 가리키므로, 한국어에서도 기본 동사 ‘알다’를 살리되 문맥상 존대형 ‘아시다’를 사용했습니다.
- source_word: ψυχήν μου
  english_pob_choice: my life
  chosen_korean: 내 생명
  alternatives_korean:
  - 내 영혼
  - 내 목숨
  lexicon: BDAG
  rationale: 이 문맥에서는 자기희생적 내어줌을 말하므로 ψυχή를 ‘영혼’으로 옮기지 않고, 자연스러우면서도 생명 자체를 가리키는 ‘생명’으로 옮겼습니다.
- source_word: ὑπὲρ τῶν προβάτων
  english_pob_choice: for the sheep
  chosen_korean: 양들을 위하여
  alternatives_korean:
  - 양들을 대신하여
  - 양들을 위해
  lexicon: BDAG
  rationale: ὑπέρ의 대표적·희생적 힘을 그대로 열어 두기 위해 ‘위하여’를 택했으며, ‘대신하여’로 좁히지는 않았습니다.
theological_decisions:
- issue: ὑπὲρ의 희생적/대표적 힘
  chosen_reading: ‘양들을 위하여’로 옮겨, 대표성과 희생성의 범위를 한국어 안에서 유지했습니다.
  alternative_readings:
  - 양들을 대신하여
  - 양들을 위해
  rationale: 본문은 예수의 자기 내어줌을 분명히 말하지만, 그 의미를 단일한 속죄 공식으로 축소하지 않습니다. ‘위하여’는 그 신학적 긴장을 보존합니다.
  doctrine_reference: 의도적 긴장 보존
- issue: ψυχήν μου의 의미
  chosen_reading: ‘내 생명’으로 옮겼습니다.
  alternative_readings:
  - 내 영혼
  rationale: 여기서는 영혼론이 아니라 목자 예수의 자기희생적 죽음을 가리키므로, 독자가 본문 의도를 오해하지 않도록 ‘생명’으로 처리했습니다.
  doctrine_reference: 문맥 우선 번역
