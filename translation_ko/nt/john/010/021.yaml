id: JHN.10.21
reference: John 10:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
  footnotes:
  - marker: a
    text: Or, “These words are not from one who is demon-possessed.”
    reason: lexical_alternative
translation:
  language: ko
  text: 다른 사람들은 이렇게 말했습니다[a]. “이 말들은 귀신 들린 사람의 말이 아닙니다. 귀신이 눈먼 사람들의 눈을 열 수 있겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 말들은 귀신 들린 사람에게서 나온 말이 아닙니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  english_pob_choice: Others
  chosen_korean: 다른 사람들은
  alternatives_korean:
  - 다른 이들은
  - 사람들은
  lexicon: BDAG
  rationale: 문맥상 앞선 발화자들과 구별되는 군중의 일부를 가리키므로, 간결한 ‘다른 사람들’이 가장 자연스럽고 원문 대비도 분명합니다.
- source_word: ἔλεγον
  english_pob_choice: were saying
  chosen_korean: 이렇게 말했습니다
  alternatives_korean:
  - 말하고 있었습니다
  - 말했습니다
  lexicon: BDAG
  rationale: 미완료시상의 반복·지속 뉘앙스는 한국어에서 ‘이렇게 말했습니다’로 담백하게 처리할 수 있으며, 지나치게 장황한 진행형을 피했습니다.
- source_word: Ταῦτα τὰ ῥήματα
  english_pob_choice: These words
  chosen_korean: 이 말들은
  alternatives_korean:
  - 이 말씀들은
  - 이 말들
  lexicon: BDAG
  rationale: ῥήματα는 예수의 발화를 가리키므로 ‘말들’이 가장 직접적입니다. ‘말씀들’은 한국어 교회어감이 강해 원문의 일반적 발화성을 약화할 수 있습니다.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  english_pob_choice: are not those of a demon-possessed man
  chosen_korean: 귀신 들린 사람의 말이 아닙니다
  alternatives_korean:
  - 귀신 들린 사람에게서 나온 말이 아닙니다
  - 귀신에 사로잡힌 사람의 말이 아닙니다
  lexicon: BDAG
  rationale: 속격 분사구는 발화의 출처를 묘사하므로 한국어에서는 자연스럽게 ‘~의 말이 아니다’로 옮겼습니다. ‘귀신 들린’은 한국어에서 δαιμονίζομαι의 표준적 직역에 가깝습니다.
- source_word: δαιμόνιον
  english_pob_choice: A demon
  chosen_korean: 귀신
  alternatives_korean:
  - 악한 영
  - 악령
  lexicon: BDAG
  rationale: 이 문맥의 반문은 초자연적 존재의 행동 불가능성을 말하므로, 한국어 성서 용례가 익숙한 ‘귀신’이 가장 직관적입니다. ‘악령’은 의미는 가깝지만 본문 대비가 덜 직접적입니다.
- source_word: τυφλῶν ὀφθαλμοὺς ἀνοῖξαι
  english_pob_choice: open the eyes of the blind
  chosen_korean: 눈먼 사람들의 눈을 열 수 있겠습니까
  alternatives_korean:
  - 눈먼 이들의 눈을 뜨게 할 수 있겠습니까
  - 맹인의 눈을 열 수 있겠습니까
  lexicon: BDAG
  rationale: 동사의 기본 의미인 ‘열다’를 살리면서, 앞문맥의 맹인 치유를 분명히 드러내기 위해 ‘눈먼 사람들의 눈’으로 옮겼습니다. ‘뜨게 하다’는 의미를 풀어내지만 원문의 이미지가 다소 약해집니다.
theological_decisions:
- issue: μή가 이끄는 반문이 기대하는 부정의 힘
  chosen_reading: ‘귀신이 눈먼 사람들의 눈을 열 수 있겠습니까?’로 옮겨, 대답이 ‘그럴 수 없다’는 기대를 유지했습니다.
  alternative_readings:
  - ‘귀신이 눈먼 사람들의 눈을 열 수 없겠습니까?’
  - ‘귀신이 눈먼 사람들의 눈을 열 수 있는가?’
  rationale: 본문의 반문은 예수의 행위를 귀신의 일로 볼 수 없다는 군중의 추론을 드러냅니다. 한국어에서는 긍정형 반문이 가장 자연스럽게 부정 기대를 전달합니다.
  doctrine_reference: 문맥적 수사법 보존; 원문 반문의 기대 방향 유지
- issue: δαιμονιζομένου와 δαιμόνιον의 구분
  chosen_reading: ‘귀신 들린 사람’과 ‘귀신’으로 각각 구분해 옮겼습니다.
  alternative_readings:
  - ‘악령 들린 사람’과 ‘악령’
  - ‘귀신에 사로잡힌 사람’과 ‘악한 영’
  rationale: 원문은 사람의 상태(δαιμονιζομένου)와 존재 자체(δαιμόνιον)를 구별합니다. 한국어에서도 동일한 구분을 보존해 군중의 논증 구조를 더 선명하게 했습니다.
  doctrine_reference: 어휘적 구별 보존; 본문의 논증 구조 유지
