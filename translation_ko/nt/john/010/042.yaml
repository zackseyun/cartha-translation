id: JHN.10.42
reference: John 10:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸂πολλοὶ ἐπίστευσαν εἰς αὐτὸν ἐκεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: ko
  text: 그리고 많은 이들이 그곳에서 그분을 믿었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그래서
  lexicon: BDAG
  rationale: 문맥을 이어 주는 단순한 접속사이므로, 해석을 덧붙이지 않는 ‘그리고’가 가장 직접적입니다.
- source_word: πολλοὶ
  english_pob_choice: many
  chosen_korean: 많은 이들이
  alternatives_korean:
  - 많은 사람들은
  - 많은 무리가
  lexicon: BDAG
  rationale: 복수 주어를 자연스럽게 드러내면서도 원문의 수량 강조를 유지하는 표현입니다.
- source_word: ἐπίστευσαν εἰς αὐτόν
  english_pob_choice: believed in him
  chosen_korean: 그분을 믿었습니다
  alternatives_korean:
  - 그분에게 믿음을 두었습니다
  - 그분 안에 믿었습니다
  lexicon: BDAG
  rationale: πιστεύω εἰς의 인격적 신뢰 대상을 한국어에서 가장 자연스럽게 드러내는 표현은 ‘~을 믿다’입니다. ‘믿음을 두다’는 의미는 살리지만 다소 설명적입니다.
- source_word: ἐκεῖ
  english_pob_choice: there
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기서
  - 그 자리에서
  lexicon: BDAG
  rationale: 장소 부사이므로 단순한 ‘그곳에서’가 문맥의 장소성을 정확히 보존합니다.
theological_decisions:
- issue: πιστεύω εἰς αὐτόν의 신앙적 함의
  chosen_reading: ‘그분을 믿었습니다’로, 예수께 향한 인격적 신뢰를 직접적으로 표현했습니다.
  alternative_readings:
  - ‘그분에게 믿음을 두었습니다’
  - ‘그분 안에 믿었습니다’
  rationale: 원문은 단순한 인지 동의가 아니라 예수를 향한 신뢰와 의탁을 말하므로, 한국어에서도 그 관계성을 분명히 드러내는 번역이 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy §3; πίστις 관련 항목'
