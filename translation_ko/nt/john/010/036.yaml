id: JHN.10.36
reference: John 10:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
  footnotes:
  - marker: a
    text: Or 'consecrated' or 'set apart' for ἡγίασεν.
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지께서 거룩하게 하시고 세상에 보내신 분을 두고 여러분은 어떻게 「네가 신성을 모독한다」고 말합니까? 내가 「나는 하나님의 아들이다」라고 말했기 때문입니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩하게 하시고’는 여기서 ‘성별하시고’ 또는 ‘구별하시고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  english_pob_choice: sanctified
  chosen_korean: 거룩하게 하시고
  alternatives_korean:
  - 성별하시고
  - 구별하시고
  - 성화시키시고
  lexicon: BDAG
  rationale: ἁγιάζω는 문맥상 거룩하게 하다, 성별하다, 구별하다의 뜻을 가질 수 있으나, 여기서는 아버지의 파송에 앞선 행위로서 ‘거룩하게 하시고’가 본문의 신학적 긴장을 가장 자연스럽게 살립니다.
- source_word: ἀπέστειλεν
  english_pob_choice: sent
  chosen_korean: 보내신
  alternatives_korean:
  - 파송하신
  - 파견하신
  lexicon: BDAG
  rationale: ἀποστέλλω의 기본 의미는 ‘보내다’이므로, 요한복음의 선교/파송 언어를 투명하게 살리는 ‘보내신’을 채택했습니다.
- source_word: Βλασφημεῖς
  english_pob_choice: You are blaspheming
  chosen_korean: 신성을 모독한다
  alternatives_korean:
  - 신성모독을 한다
  - 하나님을 모독한다
  lexicon: BDAG
  rationale: 직접적인 비난의 어조를 살리기 위해 동사성을 유지하면서도, 한국어에서 자연스러운 표현인 ‘신성을 모독한다’를 택했습니다.
- source_word: Υἱὸς τοῦ θεοῦ
  english_pob_choice: the Son of God
  chosen_korean: 하나님의 아들
  alternatives_korean:
  - 하나님의 아들님
  - 하나님의 아드님
  - 하나님의 아들 곧 메시아
  lexicon: BDAG
  rationale: 직역형이면서도 한국어 성경에서 널리 통용되는 титул 표현으로 ‘하나님의 아들’을 사용해, 직함의 무게를 보존했습니다.
theological_decisions:
- issue: ἡγίασεν을 ‘거룩하게 하시고’로 옮길 때의 신학적 함의
  chosen_reading: 아버지의 거룩하게 하심과 파송을 한 흐름으로 제시하되, 아들의 본질적 결함을 암시하지 않도록 번역합니다.
  alternative_readings:
  - 성별하시고 보내신
  - 구별하시고 보내신
  - 성화시키시고 보내신
  rationale: 본문은 아버지가 아들을 세계로 보내기 전에 구별/위임하셨다는 뜻을 드러내므로, 도덕적 개선이 아니라 사명을 위한 거룩한 구별로 읽히게 해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5; Nicene and Chalcedonian orthodoxy
- issue: ‘하나님의 아들’의 그리스도론적 무게
  chosen_reading: 직함으로서의 ‘하나님의 아들’을 유지해, 유대-요한 문맥의 신성모독 논쟁을 그대로 드러냅니다.
  alternative_readings:
  - 하나님의 아들인 분
  - 하나님의 아들이라
  rationale: 예수의 발언이 단순한 비유가 아니라 정체성 주장으로 읽히도록, 서술적 완곡어법보다 титул형 표현을 유지합니다.
  doctrine_reference: Nicene and Chalcedonian orthodoxy; Translation philosophy §1
