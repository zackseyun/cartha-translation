source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
  footnotes:
  - marker: a
    text: Or 'my sheep.' The Greek says literally 'my own' in both clauses.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 선한 목자입니다. 나는 내 것을 알고, 내 것도 나를 압니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 것’입니다. 문맥상 ‘내 양들’로 이해될 수 있지만, 헬라어는 두 절에서 모두 단순히 ‘내 것’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμήν
  english_pob_choice: shepherd
  chosen_korean: 목자
  alternatives_korean:
  - 목동
  - 목회자
  lexicon: BDAG
  rationale: 목자라는 기본 어휘가 본문의 목양 비유를 가장 자연스럽게 살리며, 목회자처럼 후대 교회 직분 의미를 덧씌우지 않습니다.
- source_word: καλός
  english_pob_choice: good
  chosen_korean: 선한
  alternatives_korean:
  - 좋은
  - 아름다운
  - 고귀한
  lexicon: BDAG
  rationale: 요한복음의 καλός는 단순한 평범성보다 도덕적·모범적 탁월함을 띠므로, 한국어에서는 ‘선한’이 ‘좋은’보다 그 뉘앙스를 더 잘 드러냅니다.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  english_pob_choice: my own
  chosen_korean: 내 것
  alternatives_korean:
  - 내 사람들
  - 내 양들
  - 나에게 속한 자들
  lexicon: BDAG
  rationale: 그리스어의 중성 복수 표현이 소유와 관계적 소속을 압축적으로 말하므로, 본문에서는 반복되는 ‘내 것’을 살리고, ‘양들’은 본문에 직접 나오지 않는 해석적 확장이라 본문 밖으로 뺐습니다.
theological_decisions:
- issue: ‘my own’의 관계적 소속을 어떻게 살릴지
  chosen_reading: ‘내 것’으로 반복하여 번역해 예수와 그분께 속한 이들 사이의 상호 인식을 드러냈습니다.
  alternative_readings:
  - ‘내 양들’
  - ‘나에게 속한 자들’
  rationale: 본문은 소속과 상호 인식을 강조하지만, 여기서 ‘양’이라는 명칭을 직접 반복하지는 않습니다. 그래서 본문의 간결함을 유지하면서도 소속 관계가 보이도록 ‘내 것’을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
