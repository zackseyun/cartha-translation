  verdict: revise
  source_fidelity: ‘내 것’은 한국어에서 주로 사물로 이해되어, 사람을 가리키는 문맥과 상호적 ‘알다’의 관계를 부자연스럽게 만듭니다. τὰ ἐμά가 중성 복수로 간결하게 표현된 점은 주석에서 보존하되, 본문에서는 문맥상 사람을 가리키는 표현으로 옮기는 것이 충실합니다.
  naturalness: ‘나는 내 것을 알고, 내 것도 나를 압니다’는 ‘내 것’과 ‘내 것도’가 사물을 뜻하는 듯하여 현대 표준 한국어로 매우 어색합니다. ‘나에게 속한 이들’은 관계적 소속과 사람 지시를 자연스럽게 드러냅니다.
  terminology: ‘선한 목자’는 ποιμὴν ὁ καλός의 확립되고 자연스러운 번역이며, 목회 직분을 뜻하는 ‘목회자’를 도입하지 않습니다. ‘나에게 속한 이들’은 ‘내 양들’보다 본절에 없는 명사를 덜 보충하면서 τὰ ἐμά의 문맥상 사람 지시를 전달합니다.
  issues:
