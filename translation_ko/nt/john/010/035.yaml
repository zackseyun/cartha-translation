id: JHN.10.35
reference: John 10:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
  footnotes:
  - marker: a
    text: Or 'divine ones.' The Greek says 'gods,' echoing Psalm 82:6; some interpreters understand the referent as human judges.
    reason: lexical_alternative
  - marker: b
    text: Or 'cannot be annulled' or 'cannot be set aside.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그가 하나님의 말씀이 임한 그 사람들을 ‘신들’이라 하셨다면 — 그리고 성경은 폐할 수 없습니다 —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신들’ 또는 ‘신적인 존재들’. 헬라어는 직접적으로 ‘신들’을 말하며, 시편 82:6을 반영합니다. 일부 해석자들은 이 대상을 인간 재판관으로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘깨뜨릴 수 없습니다’, ‘무효화할 수 없습니다’, 또는 ‘폐할 수 없습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν θεοὺς
  english_pob_choice: he called those ... ‘gods’
  chosen_korean: ‘신들’이라 하셨다면
  alternatives_korean:
  - ‘신적인 존재들’이라 하셨다면
  - ‘재판관들’이라 하셨다면
  lexicon: BDAG
  rationale: εἶπεν 뒤의 목적보어 θεοὺς는 예수의 논증에서 시편 82:6의 직접 인용을 유지해야 하므로, 해석을 덧붙인 ‘재판관들’보다 직역적인 ‘신들’이 원문과 대응이 가장 분명합니다.
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  english_pob_choice: to whom the word of God came
  chosen_korean: 하나님의 말씀이 임한 그 사람들
  alternatives_korean:
  - 하나님의 말씀이 이른 그 사람들
  - 하나님의 말씀이 온 그 사람들
  lexicon: BDAG
  rationale: πρὸς οὓς ... ἐγένετο는 ‘누구에게 말씀이 임하다/이르다’의 관용적 구조이므로, ‘임한’이 사건성과 방향성을 함께 살립니다.
- source_word: οὐ δύναται λυθῆναι
  english_pob_choice: cannot be broken
  chosen_korean: 폐할 수 없습니다
  alternatives_korean:
  - 깨뜨릴 수 없습니다
  - 무효화할 수 없습니다
  lexicon: BDAG
  rationale: λυθῆναι는 문자적으로는 ‘풀리다/해제되다’지만, 문맥상 성경의 권위가 무효화되지 않는다는 뜻이므로 한국어에서는 ‘폐하다’가 가장 자연스럽고 본문의 논증 효과를 잘 드러냅니다.
- source_word: ἡ γραφή
  english_pob_choice: the Scripture
  chosen_korean: 성경
  alternatives_korean:
  - 그 성경
  - 성문
  lexicon: BDAG
  rationale: 정관사 있는 ἡ γραφή는 권위 있는 기록 전체를 가리키는 통상적 표현이므로, 현대 한국어에서는 ‘성경’이 가장 읽기 쉽고 의미도 정확합니다.
theological_decisions:
- issue: ‘신들’의 번역이 가져오는 신학적 긴장
  chosen_reading: 본문의 표현을 완화하지 않고 ‘신들’로 유지했습니다.
  alternative_readings:
  - 신적인 존재들
  - 재판관들
  rationale: 예수님의 논증은 시편 인용의 정확한 어휘에 기대고 있으므로, 본문이 의도적으로 남겨 둔 긴장을 번역에서 미리 해소하지 않았습니다.
  doctrine_reference: 성경 본문의 수사와 인용 논증을 우선 보존
- issue: ‘성경은 폐할 수 없습니다’의 문장 기능
  chosen_reading: 성경의 취소 불가능한 권위를 단정하는 괄호적 진술로 옮겼습니다.
  alternative_readings:
  - 성경은 깨뜨릴 수 없습니다
  - 성경은 무효화될 수 없습니다
  rationale: 이 절은 예수님의 논증을 받치는 부연이므로, 법적·권위적 뉘앙스를 살리면서도 간결한 합쇼체 표현을 택했습니다.
  doctrine_reference: 성경 무오/권위에 대한 일반적 정통 이해와 양립
