translation:
  language: ko
  text: 그러나 문으로 들어가는 이는 양들의 목자입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  english_pob_choice: But the one who enters
  chosen_korean: 그러나 문으로 들어가는 이
  alternatives_korean:
  - 그러나 들어가는 사람
  - 그러나 문을 통해 들어가는 이
  lexicon: BDAG
  rationale: 관사 있는 현재분사를 서술적으로 처리해 ‘그 사람’의 성격을 드러내면서, δέ의 대조를 ‘그러나’로 살렸습니다.
- source_word: διὰ τῆς θύρας
  english_pob_choice: through the door
  chosen_korean: 문으로
  alternatives_korean:
  - 문을 통해
  - 문을 지나
  lexicon: BDAG
  rationale: διά+속격의 이동 경로를 한국어 관용에 맞게 간결하게 살려 ‘문으로’로 옮겼습니다.
- source_word: ποιμήν
  english_pob_choice: the shepherd
  chosen_korean: 목자
  alternatives_korean:
  - 그 목자
  - 한 목자
  lexicon: BDAG
  rationale: 직역상 ‘목자’가 기본 의미를 가장 직접적으로 전달하며, 문맥상 정당한 목자를 가리키는 기능은 한국어에서는 관사 없이도 충분히 드러납니다.
- source_word: τῶν προβάτων
  english_pob_choice: of the sheep
  chosen_korean: 양들의
  alternatives_korean:
  - 양의
  - 양 떼의
  lexicon: BDAG
  rationale: πρόβατα를 추상화한 ‘양 떼’보다 원문 이미지에 충실한 ‘양들’을 택해 소유격 구성을 자연스럽게 만들었습니다.
theological_decisions:
- issue: ποιμήν의 정관성 처리
  chosen_reading: ‘목자’로 옮기되 관사성은 별도 표지 없이 문맥으로 살립니다.
  alternative_readings:
  - ‘그 목자’
  - ‘한 목자’
  rationale: 헬라어는 보어 명사에 관사가 없지만, 여기서는 삯꾼/도둑과 대비되는 정당한 목자를 가리키므로 한국어에서는 과도한 지정사 없이 의미를 유지하는 편이 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §5
