  text: But the one who enters through the door is the shepherd of the sheep[a].
  footnotes:
  - marker: a
    text: 'Or "a shepherd of the sheep." The Greek predicate noun ποιμήν lacks the article, but the context favors a definite sense: the rightful shepherd in contrast to illegitimate intruders.'
