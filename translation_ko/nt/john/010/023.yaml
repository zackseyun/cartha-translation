  text: καὶ περιεπάτει ὁ Ἰησοῦς ἐν τῷ ἱερῷ ἐν τῇ στοᾷ ⸀τοῦ Σολομῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
  footnotes:
  - marker: a
    text: Or “colonnade”; Greek στοά refers to a covered walkway with columns.
    reason: lexical_alternative
  - marker: b
    text: Greek ἱερόν refers to the temple complex or precincts, not specifically the inner sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 예수께서는 성전 경내에 있는 솔로몬의 행각을 걸어 다니고 계셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεπάτει
  english_pob_choice: was walking
  chosen_korean: 거닐고 계셨습니다
  alternatives_korean:
  - 걷고 계셨습니다
  - 걸어 다니고 계셨습니다
  lexicon: BDAG
  rationale: 미완료 과거의 진행상을 한국어에서 자연스럽게 살리기 위해 단순 과거보다 진행 표현을 선택했습니다.
- source_word: ἱερῷ
  english_pob_choice: temple courts
  chosen_korean: 성전 뜰
  alternatives_korean:
  - 성전
  - 성전 구역
  - 성전 경내
  lexicon: BDAG
  rationale: ἱερόν은 내성소(ναός)가 아니라 성전 परिसर/경내를 가리키므로, 한국어에서는 공적인 외곽 공간을 드러내는 ‘성전 뜰’이 적절합니다.
- source_word: στοᾷ
  english_pob_choice: Portico
  chosen_korean: 행각
  alternatives_korean:
  - 회랑
  - 주랑
  lexicon: BDAG
  rationale: στοά는 기둥이 있는 지붕 있는 보행 공간으로, 한국어 성경 문맥에서 통용되는 건축 용어인 ‘행각’이 가장 간결하고 정확합니다.
- source_word: τοῦ Σολομῶνος
  english_pob_choice: Solomon’s
  chosen_korean: 솔로몬의
  alternatives_korean:
  - 솔로몬의 것
  lexicon: BDAG
  rationale: 고유명사 속격은 한국어 소유격으로 자연스럽게 옮기는 것이 장소명 구성상 가장 명료합니다.
