  to: 예수께서는 성전 경내에 있는 솔로몬의 행각을 걸어 다니고 계셨습니다.
  rationale: 성전 복합 구역을 뜻하는 ἱερόν의 범위를 ‘성전 경내’로 반영하고, 행각과 성전 구역의 공간적 관계를 자연스러운 한국어로 풀었습니다. 또한 περιεπάτει의 미완료 진행상은 ‘걸어 다니고 계셨습니다’로 유지하되 ‘거닐다’의 추가 뉘앙스는 피했습니다.
