  rationale: 인과 접속사 ὅτι를 ‘이는 … 때문입니다’로 보존하고, μισθωτός는 ‘삯꾼’으로 유지했습니다. μέλει αὐτῷ περὶ는 행위적 ‘돌보다’ 대신 ‘양들에게는 관심이 없다’로 옮겨 원문의 관심·염려의 의미를 살렸습니다. τῶν προβάτων의 복수는 한국어에서 자연스러운 총칭 표현인 ‘양들’ 계열로 반영했습니다.
