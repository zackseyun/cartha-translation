  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: ko
  text: 이는 그가 삯꾼이어서 양들에게는 관심이 없기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  english_pob_choice: because
  chosen_korean: -기 때문에
  alternatives_korean:
  - 왜냐하면
  - -므로
  lexicon: BDAG
  rationale: 앞절의 이유를 드러내는 인과 관계이므로, 현대 한국어에서는 자연스러운 이유 표현인 '-기 때문에'로 옮겼습니다.
- source_word: μισθωτός
  english_pob_choice: a hired hand
  chosen_korean: 삯꾼
  alternatives_korean:
  - 고용된 일꾼
  - 품팔이꾼
  lexicon: BDAG
  rationale: 단순한 ‘고용된 사람’보다 삯을 받고 일하는 사람이라는 뉘앙스를 살려, 한국어에서 경멸적이기보다 직업적 의미가 분명한 ‘삯꾼’을 택했습니다.
- source_word: μέλει αὐτῷ περὶ
  english_pob_choice: does not care about
  chosen_korean: 돌보지 않습니다
  alternatives_korean:
  - 걱정하지 않습니다
  - 관심하지 않습니다
  lexicon: BDAG
  rationale: μέλει + 여격 + περί의 ‘마음에 두다/신경 쓰다’ 의미를 한국어의 ‘돌보다’로 자연스럽게 풀어, 양들에 대한 책임 부재를 드러냈습니다.
- source_word: τῶν προβάτων
  english_pob_choice: the sheep
  chosen_korean: 양들
  alternatives_korean:
  - 양 떼
  - 양
  lexicon: BDAG
  rationale: 복수 명사 προβάτων을 한국어 복수 감각이 살아 있는 ‘양들’로 옮겨, 목자-양 이미지의 직접성을 유지했습니다.
theological_decisions:
- issue: μισθωτός의 평가적 뉘앙스
  chosen_reading: 예수의 비유적 대조를 살리되, 본문에 없는 추가적 신분 규정은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘임시 고용인’처럼 중립화하기
  - 거짓 지도자에 대한 직접적 규정으로 확정하기
  rationale: 본문은 삯꾼과 선한 목자를 대비하며 양들에 대한 무관심을 말할 뿐이므로, 번역도 그 도덕적 대비를 그대로 드러내되 해석을 과잉 확장하지 않았습니다.
  doctrine_reference: Translation philosophy items 1 and 3
