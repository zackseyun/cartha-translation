base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
  footnotes:
  - marker: a
    text: Or 'out of their hands' or 'from their grasp.' The Greek reads literally 'from their hand,' an idiom for power or control.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들은 다시 그를 붙잡으려고 찾았지만, 그는 그들의 손에서 벗어나 나가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 손에서’입니다. 헬라어의 이 표현은 손아귀나 권세, 통제를 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  english_pob_choice: they were seeking
  chosen_korean: 그들은 다시 그를 붙잡으려고 찾았지만
  alternatives_korean:
  - 그들은 다시 그를 찾고 있었습니다
  - 그들은 다시 그를 잡으려 했습니다
  lexicon: BDAG
  rationale: 미완료시제의 진행·시도 뉘앙스를 살리되, 문맥상 목적이 단순 탐색이 아니라 체포 시도이므로 ‘붙잡으려고 찾다’로 옮겼습니다.
- source_word: πάλιν
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 거듭
  lexicon: BDAG
  rationale: 직전의 체포 시도가 반복됨을 자연스럽게 드러내는 가장 간결한 표현입니다.
- source_word: πιάσαι
  english_pob_choice: to seize
  chosen_korean: 붙잡으려고
  alternatives_korean:
  - 체포하려고
  - 잡으려고
  lexicon: BDAG
  rationale: πιάζω의 물리적이고 적대적인 ‘붙잡다/붙들다’ 의미를 살리면서, 법적 어감이 강한 ‘체포하다’보다 본문의 동작감을 더 직접적으로 반영합니다.
- source_word: ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν
  english_pob_choice: he escaped from their hand
  chosen_korean: 그들의 손에서 벗어나 나가셨습니다
  alternatives_korean:
  - 그들의 손에서 나가셨습니다
  - 그들의 손에서 벗어났습니다
  lexicon: BDAG
  rationale: ἐξῆλθεν의 기본 의미인 ‘나가다’를 유지하면서, ‘그들의 손’이라는 관용구가 권세/통제를 뜻한다는 점을 한국어에서 자연스럽게 드러내기 위해 ‘벗어나 나가셨습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘그들의 손에서’라는 단수 관용구의 의미를 어떻게 드러낼지
  chosen_reading: 그들의 권세나 통제 아래서 벗어났다는 뜻을 암시하되, 본문 이미지를 유지해 ‘그들의 손에서’로 두었습니다.
  alternative_readings:
  - 그들의 손아귀에서
  - 그들의 권세에서
  rationale: 헬라어 단수 ‘손’은 힘/통제의 관용구이므로, 의미를 설명적으로 풀기보다 본문 형상을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over domestication; preserve idiom without erasing narrative tension.'
