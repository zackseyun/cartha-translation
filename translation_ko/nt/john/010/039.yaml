translation:
  language: ko
  text: 그러므로 그들은 다시 그를 붙잡으려 했으나, 그는 그들의 손에서 벗어나셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 직역하면 ‘그들의 손에서’라고 하며, ‘손’은 단수입니다. 이 표현은 손아귀, 권세, 또는 통제를 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
