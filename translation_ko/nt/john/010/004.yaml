id: JHN.10.4
reference: John 10:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
  footnotes:
  - marker: a
    text: Or 'has driven out' or 'has led out'; the Greek verb can carry the sense of driving or bringing out from an enclosure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기의 모든 것을 끌어내면 그들 앞에 서서 가고, 양들은 그의 음성을 알므로 그를 따릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘끌어내면’은 여기서 ἐκβάλῃ가 가질 수 있는 ‘몰아내다/이끌어 내다’의 뜻을 반영한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἴδια πάντα
  english_pob_choice: all his own
  chosen_korean: 자기의 모든 것
  alternatives_korean:
  - 자기에게 속한 모든 것
  - 자기 양들 모두
  lexicon: BDAG
  rationale: 중성 복수 관용구가 목자의 소유물을 가리키므로, 한국어에서도 소유 관계를 먼저 드러내되 본문 뒤의 ‘양들’에 의해 자연스럽게 구체화되도록 했습니다.
- source_word: ἐκβάλῃ
  english_pob_choice: has brought out
  chosen_korean: 끌어내면
  alternatives_korean:
  - 내보내면
  - 이끌어 내면
  lexicon: BDAG
  rationale: 목자와 양의 문맥에서는 거칠게 ‘내쫓다’보다 울타리 밖으로 ‘끌어내다/내보내다’가 더 정확하며, 동작의 방향성과 인도성을 함께 살릴 수 있습니다.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  english_pob_choice: he goes before them
  chosen_korean: 그들 앞에 서서 갑니다
  alternatives_korean:
  - 그들 앞에서 갑니다
  - 그들 앞서 갑니다
  lexicon: BDAG
  rationale: 단순한 위치 표현을 한국어 관용에 맞게 ‘앞에 서서’로 풀어 목자가 앞장서는 장면을 분명하게 했습니다.
- source_word: τὴν φωνὴν αὐτοῦ
  english_pob_choice: his voice
  chosen_korean: 그의 음성
  alternatives_korean:
  - 그의 목소리
  - 그의 소리
  lexicon: BDAG
  rationale: φωνή는 단순한 소리보다 부르는 음성을 가리키는 뉘앙스가 있어, 양들이 알아듣는 ‘음성’으로 옮겼습니다.
theological_decisions:
- issue: 목자의 행위로서 ἐκβάλῃ의 뉘앙스
  chosen_reading: ‘끌어내면’으로 옮겨, 강제 추방처럼 들릴 수 있는 의미를 피했습니다.
  alternative_readings:
  - 내쫓으면
  - 몰아내면
  rationale: 문맥은 적대적 배제가 아니라 목자가 자기 양을 우리 밖으로 인도하는 장면이므로, 본문의 목자상과 일치하는 인도적 방향을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
