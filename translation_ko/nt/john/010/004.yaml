revisions:
- from: 그가 자기의 모든 것을 끌어내면 그들 앞에 서서 가고, 양들은 그의 음성을 알므로 그를 따릅니다.[a]
  to: 그가 자기 양들을 모두 내보내면[a], 그들 앞서 갑니다. 양들은 그의 목소리를 알기 때문에 그를 따릅니다.
  rationale: The revision makes the contextual referent of τὰ ἴδια πάντα explicit in idiomatic Korean, removes the unsupported notion of standing, and renders the shepherd’s leading movement directly. It retains the generic temporal sense of ὅταν, the causal force of ὅτι, and a non-coercive yet lexically transparent rendering of ἐκβάλῃ, with an anchored alternative-reading note.
