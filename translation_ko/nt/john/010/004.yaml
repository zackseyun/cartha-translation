review_pass:
  verdict: revise
  source_fidelity: The draft conveys the basic sequence and causal clause, but ‘자기의 모든 것’ is not a natural Korean referent for τὰ ἴδια πάντα in this pastoral context, and ‘앞에 서서 가고’ adds the action of standing, which is absent from πορεύεται.
  naturalness: ‘자기의 모든 것’ is awkward and can suggest possessions in general rather than the shepherd’s sheep. ‘그들 앞에 서서 가고’ is also unnatural and semantically overexpanded. ‘자기 양들을 모두’ and ‘그들 앞서 갑니다’ are clear, idiomatic modern formal Korean.
  terminology: ‘양들’ appropriately renders πρόβατα. ‘목소리’ is a natural contemporary rendering of φωνή here. The footnote should be anchored directly to the rendering of ἐκβάλῃ and should explain its viable lexical alternatives without making the main text sound coercive.
  issues:
  - severity: medium
    issue: ‘자기의 모든 것’ is an unnatural and potentially misleading rendering of τὰ ἴδια πάντα.
    rationale: Although the Greek expression is formally nonspecific, its referent in the immediate shepherding context is the shepherd’s own sheep. Korean requires a more explicit referent for natural comprehension; ‘자기 양들을 모두’ conveys this contextual referent.
  - severity: medium
    issue: ‘그들 앞에 서서 가고’ adds ‘standing’ to the source.
    rationale: ἔμπροσθεν αὐτῶν πορεύεται means that he goes ahead of/before them. It does not state that he stands before them. ‘그들 앞서 갑니다’ retains the leading movement without addition.
  - severity: low
    issue: The lexical footnote marker is placed at the end of the verse rather than on the translated verb it explains.
    rationale: Placing the marker immediately after ‘내보내면’ makes the anchor unambiguous.
  revised_text: 그가 자기 양들을 모두 내보내면[a], 그들 앞서 갑니다. 양들은 그의 목소리를 알기 때문에 그를 따릅니다.
  revised_footnotes:
