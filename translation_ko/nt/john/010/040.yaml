source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
  footnotes:
  - marker: a
    text: Or 'beyond the Jordan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 다시 요단강 건너편, 요한이 처음 세례를 베풀던 곳으로 떠나가셔서 그곳에 머무르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요단강 너머’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  english_pob_choice: went away
  chosen_korean: 가셨습니다
  alternatives_korean:
  - 떠나셨습니다
  - 가셨습니다
  lexicon: BDAG
  rationale: 장소를 떠나는 동작을 자연스럽게 드러내기 위해 ‘가셨습니다’로 옮겼습니다. 문맥상 단순 이동보다 이탈의 뉘앙스가 있습니다.
- source_word: πάλιν
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 다시금
  lexicon: BDAG
  rationale: 반복 이동을 나타내는 부사로서 ‘다시’가 가장 자연스럽고 직접적입니다.
- source_word: πέραν τοῦ Ἰορδάνου
  english_pob_choice: across the Jordan
  chosen_korean: 요단강 건너편
  alternatives_korean:
  - 요단강 너머
  - 요단강 저편
  lexicon: BDAG
  rationale: ‘πέραν + 속격’의 지리적 위치를 한국어에서 가장 분명하게 드러내는 표현으로 ‘건너편’을 택했습니다. 전통적 ‘너머’보다 현대 한국어에서 의미가 더 즉각적입니다.
- source_word: ἔμεινεν ἐκεῖ
  english_pob_choice: stayed there
  chosen_korean: 거기에 머무셨습니다
  alternatives_korean:
  - 거기에 계셨습니다
  - 거기서 머무셨습니다
  lexicon: BDAG
  rationale: ‘μένω’의 지속적 체류를 살리기 위해 ‘머무셨습니다’로 옮겼습니다. 단순히 ‘계셨습니다’보다 장소에 머무름을 더 분명하게 드러냅니다.
theological_decisions:
- issue: Ἰωάννης τὸ πρῶτον βαπτίζων의 시제/상 처리
  chosen_reading: ‘요한이 처음에 세례를 베풀던 곳’으로 번역하여, 과거의 지속적 행위를 장소 설명 안에서 자연스럽게 반영했습니다.
  alternative_readings:
  - ‘요한이 처음 세례를 주던 곳’
  - ‘요한이 처음으로 세례를 베풀고 있던 곳’
  rationale: 본문은 예수께서 그 이전의 요한 사역 장소로 다시 가신다는 시간 관계를 보여 주므로, 한국어에서도 과거의 지속성을 드러내는 표현이 적절합니다.
  doctrine_reference: 서술 시제와 상(aspect)의 문맥적 재현
