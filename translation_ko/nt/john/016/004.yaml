  source_fidelity: 첫 αὐτῶν은 ‘그들의 때’로 적절히 보존했지만, 두 번째 αὐτῶν의 존재와 그에 따른 다소 어려운 구문은 본문에서 자연스럽게 흡수되고 각주에서만 설명되어야 합니다. 수정안은 목적절과 완료 시제의 현재적 관련성을 ‘말해 둔 것’으로 자연스럽게 반영하며, 두 αὐτῶν의 모호성은 각주에 보존합니다.
  naturalness: ‘이것들’보다 ‘이 일들’이 현대 표준 한국어 문맥에서 더 자연스럽습니다. 또한 두 번째 문장에 ‘그러나’를 보충하여 δέ의 역접·전환을 드러냈습니다. 각주 표지는 해당 난점이 시작되는 ‘그들의 때’ 바로 뒤에 두는 것이 독자에게 명확합니다.
