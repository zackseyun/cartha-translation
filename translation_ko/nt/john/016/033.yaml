review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 λελάληκα와 νενίκηκα의 완료상은 한국어에서 각각 ‘말해 왔습니다’와 ‘이겼습니다’로 더 자연스럽게 드러낼 수 있습니다. ‘이 세상에서’와 ‘세상’은 κόσμος의 반복과 요한복음의 열린 의미를 적절히 보존합니다.
  naturalness: ‘내가 이것들을 여러분에게 말한 것은’은 표준 현대 한국어에서 다소 직역투입니다. ‘내가 이 말씀들을 여러분에게 말해 온 것은’이 자연스럽고, 합쇼체에도 맞습니다. ‘환난을 겪습니다’는 ‘환난을 당합니다’보다 현대적이면서 θλῖψις의 압박·고난의 뜻을 유지합니다.
  terminology: ‘평화’, ‘환난’, ‘세상’, ‘용기를 내십시오’는 적절합니다. 다만 각주 a는 θαρσεῖτε의 대안이므로 ‘용기를 내십시오’ 뒤에, 각주 b는 θλῖψις의 대안이므로 ‘환난’ 뒤에 붙여야 합니다. 현 초안은 두 각주가 절 끝에 함께 붙어 있어 해당 어휘의 각주 연결이 불명확합니다.
  issues:
