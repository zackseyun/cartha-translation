    issue: 각주 표지가 해당 본문 어휘에 연결되어 있지 않으며 순서도 뒤바뀌어 있습니다.
    rationale: 각주 a는 ‘담대하라’라는 θαρσεῖτε의 대안이고, 각주 b는 ‘환난’이라는 θλῖψις의 대안입니다. 따라서 b는 ‘환난’ 뒤에, a는 ‘용기를 내십시오’ 뒤에 배치해야 합니다.
  - severity: low
