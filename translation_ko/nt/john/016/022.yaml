  to: 그러므로 여러분도 지금은 슬픔이 있습니다. 그러나 내가 다시 여러분을 볼 것이며, 여러분의 마음은 기뻐할 것이고, 아무도 여러분의 기쁨을 여러분에게서 빼앗지 못할 것입니다.[a]
  rationale: 원문의 대조(νῦν μὲν … πάλιν δέ), ‘내가 여러분을 볼 것이다’라는 주어·목적어 관계, 그리고 미래 문맥의 기쁨과 빼앗기지 않을 기쁨을 보존했습니다. 동시에 현대 한국어에서 자연스럽지 않은 ‘근심을 가지고 있다’를 ‘슬픔이 있다’로 다듬고, 각주 용어와 대명사를 현대 표준어에 맞추었습니다.
