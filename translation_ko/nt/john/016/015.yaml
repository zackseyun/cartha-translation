- from: 아버지께 있는 모든 것이 내 것입니다. 그래서 그분이 내 것에서 받아 여러분에게 알려 주실 것이라고 내가 말한 것입니다.[a]
  to: 아버지께서 가지신 모든 것은 내 것입니다. 그러므로 그분께서 내 것에서 취하여 여러분에게 알려 주실 것이라고 내가 말한 것입니다.[a]
  rationale: 본문의 λαμβάνει는 ‘취하다’로 옮기고, 가능한 대안인 ‘받다’를 각주에 보존했습니다. 또한 ‘아버지께서 가지신’으로 그리스어 소유 동사의 주체를 명확히 했습니다. 원문의 현재형 λαμβάνει와 미래형 ἀναγγελεῖ의 대비는 ‘취하여 … 알려 주실 것’으로 자연스럽게 유지했습니다.
