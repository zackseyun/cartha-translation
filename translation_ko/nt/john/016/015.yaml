review_pass:
  verdict: revise
  source_fidelity: 초안은 전체 의미와 미래형 ‘알려 주실 것’을 대체로 충실히 옮깁니다. 다만 ‘아버지께 있는’은 ἔχει의 주어가 아버지이심을 다소 간접적으로 표현하며, 본문의 λαμβάνει에 대해 본문은 이미 ‘받아’로 번역하면서 각주는 다시 ‘받으신다’를 대안으로 제시하여 어휘 대안의 기능이 성립하지 않습니다.
  naturalness: ‘아버지께서 가지신 모든 것은 내 것입니다’와 ‘그러므로’는 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽고, ‘그분께서 … 알려 주실 것이라고’는 합쇼체 존대 문맥에도 맞습니다.
  terminology: ‘아버지’, ‘내 것’, ‘알려 주시다’는 요한복음의 관계적·계시적 표현을 과도한 교리 용어 없이 보존합니다. λαμβάνει의 ‘취하다/받다’ 양의성을 본문과 각주로 구별해 보존합니다.
  issues:
  - severity: medium
    issue: 각주의 어휘 대안이 본문 번역과 실질적으로 구별되지 않습니다.
    rationale: 본문의 ‘받아’와 각주의 ‘받으신다’는 시제·활용만 다를 뿐 동일한 ‘receive’ 선택입니다. 영어 감사 기록의 ‘takes’/‘receives’ 대안을 반영하려면 본문을 ‘취하여’로 하고 ‘받으신다’를 각주 대안으로 두는 것이 적절합니다.
  - severity: low
