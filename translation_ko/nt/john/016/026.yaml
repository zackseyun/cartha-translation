translation:
  language: ko
  text: 그날에 여러분은 내 이름으로 구할 것입니다. 그리고 나는 내가 여러분에 관하여 아버지께 청하겠다고 여러분에게 말하지 않습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「그날에는」.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 그리스어에는 ‘구하다’와 ‘청하다’라는 서로 다른 두 동사가 사용됩니다. 제자들의 구함에는 αἰτέω, 예수께서 아버지께 청하시는 데에는 ἐρωτάω가 사용됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 「여러분을 위하여」.
    reason: lexical_alternative
