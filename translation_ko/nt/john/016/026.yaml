revisions:
- from: 그 날에는 여러분이 내 이름으로 구할 것입니다. 그리고 나는 내가 여러분을 위해 아버지께 청하겠다고 여러분에게 말하지 않습니다.[a][b][c]
  to: 그날에 여러분은 내 이름으로 구할 것입니다. 그리고 나는 내가 여러분에 관하여 아버지께 청하겠다고 여러분에게 말하지 않습니다.[a][b][c]
  rationale: περὶ ὑμῶν을 본문에서 「여러분에 관하여」로 옮겨 원문의 넓은 의미를 유지하고, ‘여러분을 위하여’라는 문맥상 가능한 중보적 뉘앙스는 각주로 남겼습니다. 이에 따라 기존 각주 c가 본문과 중복되던 문제를 해소했습니다. 그 밖에는 원문의 시제, 직접적인 진술, 그리고 두 ‘묻다/청하다’ 동사의 구별을 유지했습니다.
