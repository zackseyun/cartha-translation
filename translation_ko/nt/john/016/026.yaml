  verdict: revise
  source_fidelity: 본문의 미래 시제와 현재 시제, 그리고 αἰτέω와 ἐρωτάω의 구별을 「구하다」와 「청하다」로 옮긴 것은 적절합니다. 다만 περὶ ὑμῶν은 우선적으로 ‘여러분에 관하여’이며, 현 본문의 「여러분을 위해」는 각주 c의 대안과 동일하여 본문-각주 구성이 성립하지 않습니다.
  naturalness: 「그날에 여러분은 내 이름으로 구할 것입니다」와 「나는 ... 말하지 않습니다」는 현대 표준 한국어 합쇼체로 자연스럽고 격식에 맞습니다. 「그 날에는」보다 「그날에」가 현행 표기에 맞습니다.
  terminology: 「내 이름으로」, 「아버지」는 요한복음의 핵심 표현을 과도하게 해석하지 않고 잘 보존합니다. 「그리스어」가 현대 한국어의 언어 명칭으로 「헬라어」보다 중립적이고 자연스럽습니다.
  issues:
