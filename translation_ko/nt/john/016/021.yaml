source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
  footnotes:
  - marker: a
    text: Or, 'a man has been born into the world.' The Greek ἄνθρωπος can mean 'man' or more generally 'human being'; here it is generic, not specifically male.
    reason: lexical_alternative
translation:
  language: ko
  text: 여자가 해산 중일 때에는 때가 되었으므로 슬퍼합니다. 그러나 아이를 낳고 나면, 한 사람이 세상에 태어났다는 기쁨 때문에 그 고통을 더 이상 기억하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「남자가 세상에 태어났다」. 헬라어 ἄνθρωπος는 「남자」를 뜻할 수도 있고 더 일반적으로 「사람」을 뜻할 수도 있는데, 여기서는 성별을 가리지 않는 일반적인 뜻이다.
    reason: lexical_alternative
