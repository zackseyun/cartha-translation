  text: 사람들이 여러분을 회당에서 내쫓을 것입니다.[a] 그러나 때가 올 것입니다. 그때에는 여러분을 죽이는 사람마다 자기가 하나님께 섬김을 드리는 것이라고 생각할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
