  verdict: revise
  source_fidelity: 첫 절은 회당 공동체로부터의 배제를 충실히 전달하지만, 「출교」는 기독교 제도 용어로 오해될 수 있습니다. 후반의 λατρεία는 단순히 예배 행위만을 뜻하기보다 하나님께 드리는 종교적·예전적 섬김을 가리키므로, 본문은 그 넓은 뜻을 보존하는 편이 좋습니다. ἀλλά의 강화·대조는 「그러나」로 자연스럽게 옮겼습니다.
  naturalness: 「정녕 때가 오는데」는 현대 표준어 합쇼체에서 다소 문어적이고 연결 관계가 불분명합니다. 「그러나 때가 올 것입니다. 그때에는 …」로 나누면 자연스럽고 ἵνα가 나타내는 시간적 내용을 명확히 합니다.
  terminology: 「회당에서 내쫓다」는 자연스럽고 정확합니다. 「출교」는 피하고, λατρεία는 본문에서 「섬김」으로 번역하여 예배보다 넓은 종교적 봉사의 의미를 유지합니다. 신명 「하나님」은 기존 본문 전통 및 초안과 일치합니다.
  issues:
  - severity: medium
    issue: λατρεία를 본문에서 「예배」로 한정함
    rationale: λατρεία는 하나님께 드리는 예전적·종교적 섬김을 뜻하며, 「예배」만으로는 그 의미 범위가 다소 좁아집니다. 본문에는 「섬김」을 쓰고 「예배」를 각주 대안으로 두는 것이 더 충실합니다.
  - severity: low
    issue: 각주 a의 「출교하다」
    rationale: 회당으로부터의 배제를 가리키지만, 「출교」는 한국어에서 주로 기독교 교회의 징계 제도를 연상시키는 기술어입니다. 원문의 비제도적·일반적 배제 의미를 위해 「회당에서 제외하다」가 안전합니다.
  - severity: low
    issue: 「정녕 때가 오는데」의 현대적 자연스러움과 접속 관계
    rationale: 「정녕」은 현대 합쇼체에서 다소 고어적이며, 「-는데」는 원문의 강화된 대조와 뒤 절의 시간적 내용을 충분히 드러내지 못합니다.
