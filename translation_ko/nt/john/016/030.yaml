revisions:
- from: 이제 우리는 당신께서 모든 것을 아시고, 누가 당신께 물을 필요도 없으심을 압니다. 이로 인하여 우리는 당신께서 하나님께로부터 나오셨음을 믿습니다.[a]
  to: 이제 우리는 당신께서 모든 것을 아시고 누구에게서도 질문을 받으실 필요가 없으심을[a] 압니다. 이로써 우리는 당신께서 하나님께로부터 오셨음을 믿습니다.
