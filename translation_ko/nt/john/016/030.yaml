review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the disciples’ present realization, Jesus’ comprehensive knowledge, their confession of his origin from God, and does not add doctrinal interpretation. However, ‘누가 당신께 물을 필요도 없으심’ is grammatically and semantically awkward: it can suggest that no person needs to ask Jesus, rather than that Jesus has no need to be questioned. ‘하나님께로부터 오셨음’ is a more natural Korean rendering of ἀπὸ θεοῦ ἐξῆλθες than ‘나오셨음.’'
  naturalness: Use ‘이로써’ rather than the stiffer ‘이로 인하여,’ and recast the questioning clause as ‘누구에게서도 질문을 받으실 필요가 없으심’ for clear, formal modern Korean. The footnote marker should attach directly to the expression it annotates.
  terminology: ‘하나님’ appropriately represents θεός. ‘질문을 받다’ best retains the inquiry-focused sense of ἐρωτᾷ in idiomatic Korean; the note preserves ‘묻다’ as a lexical alternative. Honorific verb forms are appropriate for direct address to Jesus in this register.
  issues:
  - severity: medium
    issue: The clause ‘누가 당신께 물을 필요도 없으심’ has an unclear subject and reverses the practical perspective of the Greek construction.
    rationale: οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ states that Jesus has no need for anyone to question him. ‘누구에게서도 질문을 받으실 필요가 없으심’ expresses this clearly without adding meaning.
  - severity: low
    issue: The footnote anchor is placed at the end of the verse rather than beside the questioned expression.
    rationale: The footnote concerns ἐρωτᾷ and should be anchored immediately after ‘질문을 받으실 필요가.’
  - severity: low
    issue: ‘하나님께로부터 나오셨음’ is less idiomatic than ‘하나님께로부터 오셨음’ in this origin/mission context.
    rationale: ‘오셨다’ naturally renders ἐξῆλθες with ἀπὸ θεοῦ while preserving the source wording ‘from God.’
  revised_text: 이제 우리는 당신께서 모든 것을 아시고 누구에게서도 질문을 받으실 필요가 없으심을[a] 압니다. 이로써 우리는 당신께서 하나님께로부터 오셨음을 믿습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「누구에게서도 물음을 받으실 필요가 없으심을」. 헬라어 동사(ἐρωτάω)는 「묻다」 또는 「질문하다」를 뜻할 수 있습니다. 여기서는 예수께서 제자들의 말하지 않은 생각도 아신다는 문맥상 「질문」으로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: The revision clarifies that Jesus does not need to receive questions from anyone, improves idiomatic modern formal Korean, relocates the lexical footnote anchor to its referent, and retains the Greek text’s direct confession that Jesus came from God.
