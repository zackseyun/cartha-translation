  text: 아버지께서 친히 여러분을 사랑하십니다. 이는 여러분이 나를 사랑해 왔고, 내가 하나님에게서 나왔다는 것을 믿어 왔기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
