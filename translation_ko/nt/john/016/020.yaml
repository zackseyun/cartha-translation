review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the emphatic double ἀμήν, the contrast between the disciples and ‘the world,’ and the future sequence. However, ‘근심하게 되다/근심’ can suggest worry or anxiety and is less direct for λυπηθήσεσθε/λύπη, which denotes grief or sorrow. The Korean should also retain the lexical linkage between the verb and noun.
  naturalness: The formal-polite register is appropriate and the verse reads clearly. ‘슬퍼하게 되겠지만 … 슬픔’ is more natural and semantically precise in this context than the repeated ‘근심.’ The current footnote is not a genuine alternative to the main wording and shifts from ‘여러분’ to ‘너희.’
  terminology: ‘진실로 진실로,’ ‘세상,’ and ‘기쁨’ are suitable standard Korean renderings. Revising λυπηθήσεσθε/λύπη to ‘슬퍼하다/슬픔’ better conveys the Greek and preserves the source-word connection without importing interpretation.
  issues:
  - severity: medium
    issue: ‘근심하게 되다/근심’ is imprecise for λυπηθήσεσθε/λύπη.
    rationale: In this contrast with weeping, mourning, and joy, the Greek denotes being grieved and grief/sorrow rather than anxiety or worry. ‘슬퍼하게 되다/슬픔’ is a closer, natural Korean pairing.
  - severity: low
    issue: The footnote is redundant and has inconsistent second-person wording.
    rationale: The main text already says that the grief will ‘바뀔 것입니다,’ and the note repeats that same sense while changing ‘여러분’ to ‘너희.’ Rendering the main clause as ‘기쁨이 될 것입니다’ permits ‘기쁨으로 바뀔 것입니다’ as a meaningful lexical alternative.
  revised_text: 진실로 진실로 여러분에게 말합니다. 여러분은 울며 슬퍼할 것이지만, 세상은 기뻐할 것입니다. 여러분은 슬퍼하게 되겠지만, 여러분의 슬픔은 기쁨이 될 것입니다.[a]
