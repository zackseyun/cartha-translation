- from: 진실로 진실로 여러분에게 말합니다. 여러분은 울며 슬퍼할 것이지만, 세상은 기뻐할 것입니다. 여러분은 근심하게 되겠지만, 여러분의 근심이 기쁨으로 바뀔 것입니다.[a]
  to: 진실로 진실로 여러분에게 말합니다. 여러분은 울며 슬퍼할 것이지만, 세상은 기뻐할 것입니다. 여러분은 슬퍼하게 되겠지만, 여러분의 슬픔은 기쁨이 될 것입니다.[a]
  rationale: The revision renders λυπηθήσεσθε and λύπη with the linked pair ‘슬퍼하게 되다/슬픔,’ preserving both the meaning and the Greek lexical recurrence. It renders εἰς χαρὰν γενήσεται as ‘기쁨이 될 것입니다’ and supplies ‘기쁨으로 바뀔 것입니다’ as a valid alternative, corresponding to the English audit trail. No theological expansion has been added.
