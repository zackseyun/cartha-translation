  source_fidelity: 원문의 περὶ δὲ κρίσεως는 「심판에 대하여는」으로 충실히 옮겼고, ὅτι의 인과 관계도 「…때문입니다」로 분명히 드러납니다. 「이 세상의 통치자」는 ὁ ἄρχων τοῦ κόσμου τούτου의 권위적 의미를 자연스럽게 보존하며, κέκριται의 완료 수동은 「이미 심판을 받았기」로 완료된 심판을 적절히 표현합니다.
  naturalness: 문장은 표준어 현대 한국어의 합쇼체로 자연스럽고, 이 문맥의 병렬적 논지에도 잘 맞습니다. 「심판에 대하여는」은 다소 문어적이지만 성경 번역의 격식 있는 문체 안에서 자연스럽습니다.
  terminology: 「심판」, 「통치자」는 문맥과 원어에 적합합니다. 본문에서 ‘사탄’이라는 이름을 보충하지 않고 칭호를 유지한 것은 원문의 표현 범위를 지킵니다. 각주도 대안 표현, 가능한 지시 대상, 완료형의 결과적 뉘앙스를 적절히 설명합니다.
