translation:
  language: ko
  text: 그러나 내가 여러분에게 진실을 말합니다. 내가 떠나는 것이 여러분에게 유익합니다. 이는 내가 떠나가지 않으면 보혜사[a]가 여러분에게 결코 오지 않을 것이기 때문입니다. 그러나 내가 가면, 내가 그분을 여러분에게 보내겠습니다.
  philosophy: optimal-equivalence
