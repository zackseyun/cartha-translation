- from: 그분이 나를 영광스럽게 하실 것입니다. 그분이 내 것에서 받아 여러분에게 알려 주실 것이기 때문입니다.[a]
  to: 그분은 나를 영화롭게 하실 것입니다. 이는 그분이 내게 속한 것을 가져다가[a] 여러분에게 알려 주실 것이기 때문입니다.
  rationale: ‘영화롭게 하실 것입니다’로 δοξάζω의 요한복음적 용례를 보존하고, ἐκ τοῦ ἐμοῦ λήμψεται는 자연스러운 한국어로 ‘내게 속한 것을 가져다가’라고 옮겼습니다. 이는 성령이 예수께 속한 것을 전달한다는 넓은 의미를 유지하며, 그 내용물을 교리적으로 특정하지 않습니다. λήμψεται의 ‘받다’ 가능성은 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:43Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 미래 시제와 인과 관계, 그리고 ἐκ τοῦ ἐμοῦ의 포괄적 표현을 유지해야 합니다. 초안의 ‘내 것에서 받아’는 의미는 가능하나 현대 한국어로 다소 어색하며, ‘영광스럽게 하다’는 요한복음의 δοξάζω에 대한 정착된 신학적 용례를 충분히 살리지 못합니다.
  naturalness: ‘그분은 … 하실 것입니다’와 ‘내게 속한 것을 가져다가 여러분에게 알려 주실 것’은 표준 현대 한국어 합쇼체로 자연스럽고, 제자들에게 하는 복수 خطاب도 ‘여러분’으로 드러납니다.
  terminology: δοξάσει는 요한 문맥의 핵심어를 보존하는 ‘영화롭게 하실 것입니다’로 옮깁니다. λήμψεται는 본문에서 ‘가져다가’로, 가능한 ‘받다’는 각주로 제시하여 어느 한 해석을 과도하게 강제하지 않습니다.
  issues:
  - severity: medium
    issue: ‘영광스럽게 하실 것입니다’
    rationale: 문법적으로 가능하지만 δοξάζω의 요한복음 내 신학적·성경적 용례에 비해 일상적이고 설명적인 표현입니다. ‘영화롭게 하실 것입니다’가 용어의 연속성과 원문의 무게를 더 잘 보존합니다.
  - severity: low
    issue: ‘내 것에서 받아’
    rationale: ‘내 것’과 ‘것에서’의 결합이 현대 한국어에서 다소 부자연스럽습니다. ‘내게 속한 것을 가져다가’는 원문의 ‘내 것에서’라는 출처 의미를 자연스럽게 전달합니다.
  - severity: low
    issue: 각주의 대안이 본문 표현과 충분히 구별되지 않음
    rationale: 초안 본문이 이미 ‘받아’를 사용하면서 각주도 ‘받으실 것이다’를 제시하므로 어휘 대안의 기능이 약합니다. 본문을 ‘가져다가’로 하고 ‘받다’를 각주 대안으로 제시합니다.
  revised_text: 그분은 나를 영화롭게 하실 것입니다. 이는 그분이 내게 속한 것을 가져다가[a] 여러분에게 알려 주실 것이기 때문입니다.
