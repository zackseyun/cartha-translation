source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
  footnotes:
  - marker: a
    text: Or, more literally, “about this.”
    reason: lexical_alternative
  - marker: b
    text: 'The Greek uses two different verbs for seeing here: first “behold/observe” (θεωρέω), then “see” (ὁράω). English smooths both as “see” to preserve the sense and parallelism.'
    reason: lexical_alternative
  - marker: c
    text: Or “because I said.” The Greek conjunction can introduce either the content under discussion or the reason for it.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서는 그들이 자신에게 묻고자 한다는 것을 아시고, 그들에게 말씀하셨습니다. “내가 ‘조금 있으면 너희가 나를 보지 못하고, 또 조금 있으면 너희가 나를 볼 것이다’라고[c] 말한 이 일을 두고[a] 너희가 서로 의논하고 있느냐?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면 「이것에 관하여」.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 여기서 「보다」에 서로 다른 두 동사를 사용합니다. 처음에는 「자세히 보다, 관찰하다」(θεωρέω), 다음에는 「보다」(ὁράω)를 씁니다. 한국어 본문에서는 의미와 병행을 살려 둘 다 「보다」로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 「내가 말했기 때문에」. 그리스어 접속사는 논의의 내용을 도입할 수도 있고 그 이유를 나타낼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  english_pob_choice: knew
  chosen_korean: 아시다
  alternatives_korean:
  - 깨달으시다
  lexicon: BDAG
  rationale: 부정과거의 인지적 「알다」.
- source_word: ζητεῖτε μετ’ ἀλλήλων
  english_pob_choice: discussing
  chosen_korean: 서로 의논하다
  alternatives_korean:
  - 서로 묻다
  lexicon: BDAG
  rationale: ζητέω + μετά의 「함께 묻고 따지다」를 「의논하다」로.
