  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 「자기 곳」은 εἰς τὰ ἴδια의 넓은 지시 범위를 충분히 자연스럽게 드러내지 못하며, 각주 표지도 해당 표현에 직접 붙는 편이 낫습니다. 「때가 오는데, 이미 왔습니다」는 의미상 가능하나, 접속과 완료의 긴장을 한국어에서 더 분명하고 자연스럽게 표현할 수 있습니다.
  naturalness: 합쇼체는 적절합니다. 그러나 「그때에」와 「자기 곳」은 다소 번역투입니다. 「…할 때가 오고 있습니다. 아니, 이미 왔습니다」 및 「제자리로」가 현대 표준어에서 더 자연스럽습니다.
  terminology: 「아버지」와 「나와 함께 계시기 때문입니다」는 요한복음의 관계적 호칭과 이유 절을 정확히 반영합니다. 「제자리」는 본문에서 장소로 한정되지 않을 수 있으므로, 각주로 집·자리·소유물/자기에게 속한 것이라는 범위를 보완합니다.
