  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 παροιμίαις는 공관복음식 「비유」 자체라기보다 비유적·간접적인 말이라는 뜻이므로, 본문에서는 이를 더 분명히 드러내는 표현이 안전합니다. ἔρχεται의 현재형은 「오고 있습니다」로 자연스럽게 반영할 수 있으며, παρρησίᾳ는 문맥상 「분명히」가 적절합니다.
