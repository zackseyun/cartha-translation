translation:
  language: ko
  text: 내가 그대에게 ‘여러분은 위로부터 태어나야 합니다’라고 말한 것을 놀라지 마십시오[b]. [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἄνωθεν은 ‘위로부터’ 또는 ‘다시/새로’를 뜻할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그대에게’(σοι)는 단수이고, ‘여러분은’(ὑμᾶς)은 복수입니다.
