  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
  footnotes:
  - marker: a
    text: Or 'born again.' The Greek ἄνωθεν can mean 'from above' or 'again/anew.'
    reason: alternative_reading
  - marker: b
    text: The first 'you' is singular ('I told you'), but 'you must be born' is plural in Greek.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 당신에게 말한 것을 놀라지 마십시오[b]. 「여러분은 위로부터 태어나야 합니다。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ἄνωθεν은 '위로부터' 또는 '다시/새로'로 읽힐 수 있습니다. 요한의 맥락에서 '위로부터'가 더 자주 보이므로 본문에는 '위로부터'로 번역했지만, 대안적 읽이는 그대로 남겨둡니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 첫 번째 '당신'(εἶπον σοι)은 단수이고, 이어지는 '여러분'(Δεῖ ὑμᾶς)은 복수입니다(σοι 단수 · ὑμᾶς 복수).
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  english_pob_choice: Do not be amazed
  chosen_korean: 놀라지 마십시오
  alternatives_korean:
  - 놀라워하지 마십시오
  - 경탄하지 마십시오
  lexicon: BDAG
  rationale: μή + aorist subjunctive가 금지 명령으로 작동하므로 현대 한국어의 공식적 부정 명령문 '놀라지 마십시오'가 원문의 금지성을 자연스럽게 전달합니다.
- source_word: ἄνωθεν
  english_pob_choice: from above
  chosen_korean: 위로부터
  alternatives_korean:
  - 다시
  - 새로
  lexicon: BDAG
  rationale: 요한복음에서 ἄνωθεν은 종종 '위로부터'의 의미를 지니며, 본문 전체의 신적 기원 강조를 살리기 위해 본문 번역은 '위로부터'로 했습니다. '다시·새로'라는 중의성은 신학적으로 중요하므로 각주로 보존합니다.
- source_word: εἶπον σοι / ὑμᾶς
  english_pob_choice: I told you / you (plural)
  chosen_korean: 당신에게 (σοι 단수) … 여러분은 (ὑμᾶς 복수)
  alternatives_korean:
  - 둘 다 '당신'으로 번역
  - 둘 다 '여러분'으로 번역
  lexicon: BDAG
  rationale: 원문은 εἶπον σοι(단수)와 Δεῖ ὑμᾶς(복수)로 인칭 수가 달라 이 차이를 본문에 드러내어 독자가 수사의 변화를 알 수 있게 했습니다(각주로도 병기).
- source_word: Δεῖ + γεννηθῆναι
  english_pob_choice: must be born
  chosen_korean: 태어나야 합니다
  alternatives_korean:
  - 반드시 태어나야 합니다
  - 태어나야만 합니다
  lexicon: BDAG
  rationale: Δεῖ의 필요·의무 의미를 한국어에서 자연스럽게 전달하기 위해 '태어나야 합니다'를 선택했습니다. 과도히 고풍스럽지 않으면서도 원문의 필연성을 유지합니다.
theological_decisions:
- issue: Meaning of ἄνωθεν in the new birth saying
  chosen_reading: 위로부터 (from above)
  alternative_readings:
  - 다시 (again)
  - 새로 (anew)
  rationale: 요한복음의 문맥과 용례는 '위로부터'의 신적·하늘적 기원을 강조하는 쪽으로 해석하는 근거를 제공합니다. 번역 철학에 따라 신학적 긴장을 지우지 않고 본문은 '위로부터'로 번역하되, 가능한 다른 해석('다시/새로')은 각주로 남깁니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (Preserve theological tension rather than resolve it)
