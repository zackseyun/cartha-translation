  text: Then a dispute arose between John's disciples and a Jew about purification[a].
  footnotes:
  - marker: a
    text: Or 'about cleansing' or 'about ceremonial purification.' The Greek term can refer generally to cleansing, and in this context likely carries ritual overtones.
