translation:
  language: ko
  text: 그때에 요한의 제자들과 한 유대인 사이에 정결[a]에 관한 논쟁이 일어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '세정' 또는 '의례적 정결'로 읽을 수 있습니다. 그리스어 용어는 일반적으로 정결·세척을 가리킬 수 있으며, 이 문맥에서는 의례적 뉘앙스를 지닐 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζήτησις
  english_pob_choice: dispute
  chosen_korean: 논쟁
  alternatives_korean:
  - 논의
  - 토론
  - 다툼
  lexicon: BDAG
  rationale: ζήτησις는 단순한 대화나 질문보다 논쟁·논의의 뜻을 갖습니다. 본문 맥락에서 의례적 문제를 둘러싼 대립을 가리키므로 '논쟁'이 긴장감을 유지하면서도 한국어로 자연스럽습니다.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου
  english_pob_choice: between John's disciples
  chosen_korean: 요한의 제자들과
  alternatives_korean:
  - 요한에게서 온 제자들
  - 요한의 제자들 중에서
  lexicon: BDAG
  rationale: 그리스어 구성은 문자적으로는 '요한의 제자들로부터'이나 μετὰ ~와 함께 쓰일 때 논쟁의 한 편에 요한의 제자들이 있음을 가리킵니다. 한국어 문장에서는 '요한의 제자들과 … 사이에'로 자연스럽게 표현합니다.
- source_word: μετὰ Ἰουδαίου
  english_pob_choice: and a Jew
  chosen_korean: 한 유대인 사이에
  alternatives_korean:
  - 한 유대인과
  - 유대인 한 사람과
  lexicon: BDAG
  rationale: μετά는 본래 '함께/와 함께' 뜻이지만, '...와 ... 사이에'라는 한국어 관용 표현으로 옮기는 것이 명확합니다. Ἰουδαίου는 단수이므로 '한 유대인'으로 수를 유지했습니다.
- source_word: περὶ καθαρισμοῦ
  english_pob_choice: about purification
  chosen_korean: 정결
  alternatives_korean:
  - 세정
  - 정결례
  - 정화
  lexicon: BDAG
  rationale: καθαρισμός는 일반적·의례적 '정결/세정'을 가리킬 수 있습니다. 요한복음 주변 문맥에서 의례적 정결 관습을 암시하므로 한국어 본문에서는 간결하게 '정결'로 옮겨 원문이 품고 있는 종교적 뉘앙스를 보존합니다.
theological_decisions:
- issue: Whether καθαρισμός should be rendered in explicitly ritual terms
  chosen_reading: 정결 (의례적·종교적 정결을 포함하는 어휘)
  alternative_readings:
  - 세정
  - 의례적 정결
  - 단순한 청결(비종교적)
  rationale: 요한복음의 문맥(근접한 본문들에서 유대인의 정결 관행을 언급함)을 고려하면 καθαρισμός는 의례적·종교적 정결을 암시할 가능성이 큽니다. 그러나 본절 자체는 구체적 의례를 규정하지 않으므로 '정결'이라는 중립적이면서도 의례적 뉘앙스를 담을 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
