id: JHN.3.17
reference: John 3:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
  footnotes:
  - marker: a
    text: Or, 'so that he might condemn the world.' The Greek verb can be rendered more narrowly in context, but its basic sense is 'judge.'
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께서 아들을 세상에 보내신 것은 세상을 심판하려는 것이 아니라[a], 그를 통하여 세상이 구원받게 하시려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상을 정죄하려는 것’으로 번역할 수 있습니다. 그리스어 동사 κρίνω는 문맥상 더 좁게 ‘정죄하다’로 번역될 수 있으나, 기본 의미는 ‘심판하다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 야훼
  - 하나님께서
  lexicon: BDAG
  rationale: θεός는 본문에서 일반 명사적·신적 지시를 하므로 한국어 성경 전통과 POB 용례에 따라 '하나님'으로 번역했습니다. 본절은 신을 지시하는 3인칭 언급이므로 명사형 '하나님'을 사용했습니다.
- source_word: τὸν υἱὸν
  english_pob_choice: the Son
  chosen_korean: 아들
  alternatives_korean:
  - 그 아들
  - 아들(주님)
  lexicon: BDAG
  rationale: 그리스어의 정관사(tὸν)와 문맥상의 독립적 칭호성을 살려 한국어로는 간결한 '아들'을 선택했습니다. 소유격을 강하게 드러내는 '그 아들'보다는 요한서신의 타이틀적 사용을 반영합니다.
- source_word: ἵνα κρίνῃ
  english_pob_choice: so that he might judge the world
  chosen_korean: 세상을 심판하려
  alternatives_korean:
  - 세상을 정죄하려
  - 세상을 판단하려
  lexicon: BDAG
  rationale: κρίνω의 범주적 의미를 살려 한국어로는 '심판하다'(judge)를 택했습니다. 전통적 번역인 '정죄하다'는 더 좁은 의미이므로 본문이 유지하는 신학적 긴장(심판 vs 구원)을 남기기 위해 '심판'을 사용하고, 대안은 각주로 표기했습니다.
- source_word: σωθῇ δι’ αὐτοῦ
  english_pob_choice: might be saved through him
  chosen_korean: 그로 말미암아 세상이 구원받게 하시려
  alternatives_korean:
  - 그를 통해 세상이 구원되게 하시려
  - 그로 말미암아 세상이 구원되게 하시려
  lexicon: BDAG
  rationale: 수동적 σῴζω의 결과와 διά αὐτοῦ의 수단을 한국어로 자연스럽게 연결해 '그로 말미암아 세상이 구원받게 하시려'로 처리했습니다. '구원받다'는 σῴζω의 구원-구출 의미 스펙트럼을 잘 담습니다.
theological_decisions:
- issue: '뜻의 범위: κρίνῃ를 ''심판하다''로 옮길지 아니면 좁게 ''정죄하다''로 옮길지'
  chosen_reading: 심판
  alternative_readings:
  - 정죄
  rationale: 그리스어 κρίνω는 문맥에 따라 '판단하다/심판하다/정죄하다'의 범위를 가질 수 있습니다. 본절은 아들의 파송 목적을 구원과 대조시키므로 원어의 넓은 의미('심판')를 살려 번역해 신학적 긴장을 보존했습니다. 좁은 해석('정죄')는 각주로 밝힙니다.
  doctrine_reference: 원문 우선의 번역 원칙 — 본문이 드러내는 구원과 심판의 대비를 보존
- issue: 대명사로 나타난 '아들'의 지칭 방식과 경칭 사용
  chosen_reading: 아들(정관적 칭호) + 본문 전체는 현대 한국어 합쇼체(공식적 서술) 사용; 하나님 관련 서술어는 존칭형이 아닌 중립적 서술로 처리
  alternative_readings:
  - 한국어 전통에 따라 하나님 서술어에 존칭형(-십니다) 사용
  rationale: POB 표준(현대 합쇼체)과 원문의 담화 지향성을 따랐습니다. 본문은 하나님께 직접 말하는 호격이 아니므로 서술은 합쇼체로 유지했고, 하나님을 지칭하는 표현은 경칭 대신 명사형 '하나님'과 표준 합쇼체 서술을 선택하여 원문-독자 관계의 투명성을 유지합니다.
  doctrine_reference: 번역 등록과 독자 지향성 — 합쇼체(현대 공식 서술) 우선
