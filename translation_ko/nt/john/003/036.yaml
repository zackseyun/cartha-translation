id: JHN.3.36
reference: John 3:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
  footnotes:
  - marker: a
    text: Or 'the one who refuses to believe the Son.' The Greek verb can carry the sense of refusing belief as well as disobeying.
    reason: alternative_reading
translation:
  language: ko
  text: 아들을 믿는 사람은 영생을 가지고 있습니다. 그러나 아들에게 불순종하는 사람[a]은 생명을 보지 못할 것이며, 하나님의 진노가 그에게 남아 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '아들을 믿기를 거부하는 사람'으로 번역할 수 있습니다. 그리스어 동사 ἀπειθῶν은 불순종뿐 아니라 믿음을 거부하는 의미도 지닐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων
  english_pob_choice: the one who believes
  chosen_korean: 아들을 믿는 사람
  alternatives_korean:
  - 믿는 이
  - 누구든지 믿는 자
  lexicon: BDAG
  rationale: 그리스어 관사 있는 현재 분사(ὁ πιστεύων)는 총체적·일반적 인칭을 가리키므로 한국어에서 자연스러운 표현으로 '아들을 믿는 사람'이라고 풀었습니다. 동사의 지속적·행위적 성격을 살려 '믿는' 현재형을 사용했습니다.
- source_word: ὁ δὲ ἀπειθῶν
  english_pob_choice: the one who disobeys
  chosen_korean: 아들에게 불순종하는 사람
  alternatives_korean:
  - 아들을 믿기를 거부하는 사람
  - 불순종하는 자
  lexicon: BDAG
  rationale: ἀπειθῶν은 '불순종하다'의 넓은 의미를 지니며, 요한복음의 대조 구도(믿음 ↔ ἀπειθεῖν)를 고려하여 주된 번역으로 '불순종하는'을 선택했습니다. 영어 POB와 동일하게 해석상 긴장(불신·거부 가능성)을 보존합니다.
- source_word: ζωὴν αἰώνιον
  english_pob_choice: eternal life
  chosen_korean: 영생
  alternatives_korean:
  - 영원한 생명
  - 세상의 생명
  lexicon: BDAG
  rationale: 요한문헌에서 통상적 용례인 'eternal life'를 한국어 관용어 '영생'으로 옮겼습니다. 그리스어 복합어가 지닌 지속성과 종말론적 성격을 살렸습니다.
- source_word: ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν
  english_pob_choice: the wrath of God remains on him
  chosen_korean: 하나님의 진노가 그에게 남아 있습니다
  alternatives_korean:
  - 하나님의 진노가 그에게 머물러 있습니다
  - 하나님의 분노가 그를 덮고 있습니다
  lexicon: BDAG
  rationale: μένει의 현재 지속성을 살려 '남아 있습니다'로 옮겼고, θεοῦ는 표준 번역 관례대로 '하나님'으로 표기했습니다. '진노'는 'wrath'의 정확한 대응어입니다.
theological_decisions:
- issue: Meaning of ἀπειθῶν in contrast with πιστεύων
  chosen_reading: 본문은 주된 번역으로 '아들에게 불순종하는 사람'을 사용하고, '아들을 믿기를 거부하는 사람'을 각주로 보존합니다.
  alternative_readings:
  - 아들을 믿기를 거부하는 사람
  - 믿지 않는 자
  rationale: 요한서신은 불신과 불순종을 밀접하게 연결하므로 본문에서는 넓은 의미의 '불순종'을 택해 신학적 긴장을 남겨두었습니다. 동시에 그리스어 동사가 믿음 거부의 의미를 가질 수 있기에 각주로 대안 해석을 명시합니다(영문 POB의 결정에 따름).
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; document contested interpretive choices.'
- issue: Temporal force of verbs (ἔχει, μένει, ὄψεται)
  chosen_reading: ἔχει와 μένει의 현재 지속성을 살리고 ὄψεται의 미래적 어조는 한국어에서 명확히 표현했습니다.
  alternative_readings:
  - 모두 현재적 상태로만 읽기
  - 모두 미래적 결과로만 읽기
  rationale: 원문은 현재시제 동사(ἔχει, μένει)와 미래시제(ὄψεται)를 함께 사용하여 현재적 소유와 계속되는 심판 상태, 그리고 보지 못할 미래를 병치합니다. 번역은 이 문법적 긴장을 훼손하지 않도록 현재 소유·계속성과 미래 결과를 모두 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy; preserve theological tension rather than resolve it.'
