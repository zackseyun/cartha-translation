id: JHN.3.33
reference: John 3:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
  footnotes:
  - marker: a
    text: Or, more literally, "has set his seal to" that God is true.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 증언을 받은 사람은 하나님이 참되다는 것을 확증하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 '그(또는 그 증언)에 도장을 찍었다'—원어 ἐσφράγισεν의 직역적 비유 표현.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαβὼν
  english_pob_choice: Whoever has received
  chosen_korean: 증언을 받은 사람은
  alternatives_korean:
  - 받는 사람은
  - 받은 자는
  lexicon: BDAG
  rationale: 관사와 완료상(ἀορист participle)이 실질적으로 명사 역할을 하므로 일반적인 '누구든지 ~한 사람' 의미로 번역합니다. 한국어에서는 자연스럽고 명확한 '증언을 받은 사람'으로 처리하였습니다.
- source_word: αὐτοῦ τὴν μαρτυρίαν
  english_pob_choice: his testimony
  chosen_korean: 그의 증언
  alternatives_korean:
  - 그분의 증언
  - 그의 증거
  lexicon: BDAG
  rationale: αὐτοῦ는 문맥상 직전의 하늘에서 온 이(아들)를 가리킵니다. '그의 증언'은 영어 POB 선택을 충실히 반영하면서 한국어로 자연스럽게 연결됩니다.
- source_word: ἐσφράγισεν
  english_pob_choice: has certified
  chosen_korean: 확증하였습니다
  alternatives_korean:
  - 도장을 찍었다(문자적)
  - 확인하였습니다
  lexicon: BDAG
  rationale: 원어는 문자적으로 '도장을 찍다/인봉하다'의 비유적 표현입니다. 현대 한국어 본문에서는 비유의 의미를 분명히 전달하기 위해 '확증하였다'로 옮기고, 문자적 관용은 각주로 보존했습니다.
- source_word: ὁ θεὸς ἀληθής ἐστιν
  english_pob_choice: God is true
  chosen_korean: 하나님이 참되다(참되심)
  alternatives_korean:
  - 하나님은 참되시다
  - 하나님이 진실하시다
  lexicon: BDAG
  rationale: Θεός는 프로젝트 용어에 따라 '하나님'으로, ἀληθής는 '참되다/진실하다'로 번역합니다. 본문 맥락상 하나님의 신실성과 신뢰성을 말하므로 '참되다' 어휘를 선택했습니다.
theological_decisions:
- issue: Metaphorical force of sealing language (ἐσφράγισεν)
  chosen_reading: 본문에서는 의미 전달을 위해 '확증하였다'로 번역하고, 문자적 '도장을 찍었다/인봉했다'는 각주로 보존합니다.
  alternative_readings:
  - 그(또는 그 증언)에 도장을 찍었다
  - 문자적으로 '인봉하였다' 혹은 '서명했다'로 번역
  rationale: 원어의 인장·도장 비유는 증언의 공식적 확인·보증을 의미합니다. 현대 한국어 독자에게 비유의 힘을 전하려면 본문에서는 의미역(확증)을 사용하고, 문학적·원어적 뉘앙스는 각주로 남기는 것이 투명하고 충실합니다.
  doctrine_reference: Translation philosophy §6; §5 documented exception/consistency
- issue: 'Reference to God: verb form/honorific'
  chosen_reading: 하나님을 지칭할 때 경의의 어조를 고려하여 본문 표기는 '하나님이 참되다'로 옮기되, 낱말 형태는 존중을 반영하여 문체(합쇼체)로 처리합니다.
  alternative_readings:
  - 평이한 진술어 '참되다' 사용
  - 존칭을 더 분명히 드러내는 '참되시다' 사용
  rationale: 직접 호칭과는 달리 서술적 언급에서는 번역 간의 관습 차이가 있습니다. 본문은 하나님의 신실성을 기술하므로 지나치게 고어적이거나 교회적 용어를 넣지 않고 한국어 일반 독자의 이해를 돕는 현대적 존중 표기(합쇼체)를 선택했습니다.
  doctrine_reference: Translation practice / POB glossary guidance on Θεός
