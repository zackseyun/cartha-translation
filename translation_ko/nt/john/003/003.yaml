id: JHN.3.3
reference: John 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
  footnotes:
  - marker: a
    text: Or 'again.' The Greek adverb can mean both 'from above' and 'again'; the dialogue in the following verse turns on this double meaning.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 대답하여 그에게 말씀하셨습니다. 「진실로 진실로 내가 당신에게 말합니다. 사람이 위로부터[a] 태어나지 아니하면 하나님의 나라를 볼 수 없습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '다시'. 그리스어 부사는 '위로부터'와 '다시'를 모두 뜻할 수 있으며, 이어지는 3:4의 대화는 이 이중 의미를 바탕으로 전개됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로 진실로
  alternatives_korean:
  - 아멘 아멘
  - 참으로 참으로
  lexicon: BDAG
  rationale: 그리스어의 중복된 '아멘' 공식의 강조를 현대 한국어로 전달하기 위해 '진실로 진실로'를 사용했습니다. '아멘 아멘'은 더 문자적이나 현대 독자에게 덜 친숙할 수 있습니다.
- source_word: γεννηθῇ
  english_pob_choice: is born
  chosen_korean: 태어나지 아니하면
  alternatives_korean:
  - 낳아지지 아니하면
  - 다시 태어나지 아니하면
  lexicon: BDAG
  rationale: 수동형 의미를 직접적으로 전달하는 현대 한국어 동사 '태어나다'를 선택했습니다. '다시 태어나지'는 ἄνωθεν의 의미 해석을 전제하므로 본문에서는 별도로 표기하지 않았습니다.
- source_word: ἄνωθεν
  english_pob_choice: from above
  chosen_korean: 위로부터
  alternatives_korean:
  - 다시
  - 새로
  lexicon: BDAG
  rationale: 요한복음의 맥락(천상/지상 대비 등)이 '위로부터' 의미를 우선 지시하므로 본문에 '위로부터'를 사용했습니다. '다시'의 가능성은 주석적 각주로 남겼습니다.
- source_word: βασιλείαν τοῦ θεοῦ
  english_pob_choice: the kingdom of God
  chosen_korean: 하나님의 나라
  alternatives_korean:
  - 하나님의 통치
  - 하나님 나라의 임재
  lexicon: BDAG
  rationale: 프로젝트 용어집에 따른 표준어 '하나님의 나라'를 사용하여 βασιλεία의 영역·통치 양면성을 보존했습니다.
theological_decisions:
- issue: 의미상 ἄνωθεν(위로부터/다시)의 선택
  chosen_reading: 위로부터
  alternative_readings:
  - 다시
  - 새롭게
  rationale: '요한복음은 반복적으로 ''위에서(천상)로부터''의 신학적 어휘를 사용하며(예: 3:31), 본문은 또한 니고데모의 오해(3:4)를 통해 ''다시''로 들릴 수 있는 중층적 의미를 드러냅니다. 본문 번역은 원문의 천상적 의미를 우선하되, ''다시''의 가능성은 각주로 기록하여 신학적 긴장을 보존했습니다.'
  doctrine_reference: DOCTRINE.md 번역 원칙 §3 (신학적 긴장을 보존하라)
