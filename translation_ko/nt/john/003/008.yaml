id: JHN.3.8
reference: John 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
  footnotes:
  - marker: a
    text: Greek pneuma can mean either 'wind' or 'spirit.' Jesus uses the same word in both halves of the verse, creating a wordplay that English cannot fully reproduce.
    reason: lexical_alternative
  - marker: b
    text: Or 'voice' for 'sound'; the Greek word can mean either, but here it refers to the audible effect of the wind.
    reason: lexical_alternative
translation:
  language: ko
  text: 바람[a]은 원하는 대로 불며 그 소리[b]를 들을 수 있으나 그것이 어디서 와서 어디로 가는지는 알 수 없습니다. 이와 같이 성령으로 난 모든 사람은 그러합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 πνεῦμα는 '바람'과 '영(성령)' 두 뜻을 모두 가질 수 있습니다. 예수는 두 번 같은 단어를 사용해 말장난을 만드셨는데, 한국어 본문은 이를 완전히 재현하지 못하므로 각주로 알립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '목소리'로 번역할 수 있습니다(φωνή의 겹의미). 여기서는 바람의 들리는 효과를 가리키므로 '소리'로 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (v. 8a)
  english_pob_choice: wind
  chosen_korean: 바람
  alternatives_korean:
  - 성령
  - 영
  lexicon: BDAG
  rationale: 첫 번째 πνεῦμα은 동사 πνεῖ(불다)와 φωνή(소리)와 결합되어 기상학적 이미지(바람)를 강하게 시사합니다. 이렇게 번역하면 마지막의 πνεύματος가 명백히 성령을 가리킬 때 원문의 말장난을 한국어 독자에게 보존할 수 있습니다.
- source_word: φωνήν
  english_pob_choice: sound
  chosen_korean: 소리
  alternatives_korean:
  - 목소리
  - 소음
  lexicon: BDAG
  rationale: φωνή가 '소리' 또는 '목소리'로 해석될 수 있으나, 앞부분이 바람의 맥락이므로 바람의 청각적 효과로서 '소리'가 자연스럽습니다. 원문 중의 겹의미(목소리/소리)는 주석으로 표지했습니다.
- source_word: ἐκ τοῦ πνεύματος (v. 8b)
  english_pob_choice: of the Spirit
  chosen_korean: 성령
  alternatives_korean:
  - 영
  - 하나님의 영
  lexicon: BDAG
  rationale: 요한복음 3장의 문맥(거듭남)에서 후반부의 πνεύματος는 신적 영을 가리킵니다. 프로젝트 용어집과 한국 관습을 따라 '성령'으로 표기했습니다.
- source_word: ὅπου θέλει
  english_pob_choice: where it wishes
  chosen_korean: 원하는 대로
  alternatives_korean:
  - 뜻하는 대로
  - 원하는 곳으로
  lexicon: BDAG
  rationale: θέλει은 의지를 나타내는 동사입니다. '원하는 대로'는 현대 한국어에서 자연스럽게 그 의지적·인격적 뉘앙스를 전달합니다.
theological_decisions:
- issue: 반복된 πνεῦμα의 겹의미(바람/영) 처리
  chosen_reading: 첫 번째는 '바람'으로, 마지막은 '성령'으로 번역
  alternative_readings:
  - 두 번 모두 '성령'으로 번역
  - 두 번 모두 '바람'으로 번역
  - 본문에서 '성령(또는 바람)'과 같이 괄호로 병기
  rationale: 그리스어는 같은 어휘(πνεῦμα)를 사용해 바람의 이미지와 신적 영의 원천을 겹쳐 보여 줍니다. 한국어는 한 단어로 두 의미를 동시에 전달하기 어렵기 때문에 본문에서는 의미를 분리하고 주석(각주)으로 원문의 말장난을 알렸습니다. 이렇게 하면 독자가 비유의 표면적 이미지와 신학적 적용을 모두 이해할 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
