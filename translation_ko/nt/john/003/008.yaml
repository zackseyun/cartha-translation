    text: 그리스어 πνεῦμα는 ‘바람’ 또는 ‘영’(여기서는 성령)을 뜻할 수 있습니다. 예수께서는 이 절의 앞부분과 뒷부분에 같은 단어를 사용하여 말놀이를 이루십니다. 한국어에서는 이 말놀이를 완전히 재현할 수 없어, 앞에서는 ‘바람’, 뒤에서는 ‘성령’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘목소리’. 그리스어 φωνή는 ‘소리’ 또는 ‘목소리’를 뜻할 수 있으나, 여기서는 바람이 내는 소리를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 장소를 뜻하는 ὅπου를 ‘원하는 곳에서’로 분명히 하고, 결론절을 현대 합쇼체에 맞게 다듬었습니다. 각주는 πνεῦμα의 의도적인 이중 의미와 φωνή의 어휘적 대안을 유지하되, 더 자연스럽고 절제된 한국어로 수정했습니다.
