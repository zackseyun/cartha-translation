    reason: lexical_alternative
lexical_decisions:
- source_word: Νικόδημος
  english_pob_choice: Nicodemus
  chosen_korean: 니고데모
  alternatives_korean:
  - 니코데모
  - 니고데모스
  lexicon: SBLGNT / BDAG
  rationale: 고유명사는 표준 음역을 따릅니다. 한국어 전통 성경에서 널리 쓰이는 표기와 현대 외래어 표기법을 반영하여 '니고데모'를 선택했습니다.
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 대답했습니다
  - 응답하여
  lexicon: BDAG
  rationale: ἀπεκρίθη는 담화 내 응답 행위를 표시하므로 '대답하여'로 사건성(담화 연결)을 살리면서도 현대 한국어 서술문에 맞게 번역했습니다.
- source_word: εἶπεν αὐτῷ
  english_pob_choice: said to him
  chosen_korean: 그에게 말했습니다
  alternatives_korean:
  - 그에게 이르되
  - 예수께 말했습니다
  lexicon: BDAG
  rationale: 그리스어는 명시적 대명사(αὐτῷ)를 사용하므로 원문 충실성을 위해 인칭 대명사 '그에게'를 유지했습니다. 이름을 도입하면 원문의 표현을 과잉 보충하게 됩니다.
- source_word: ταῦτα / γενέσθαι
  english_pob_choice: these things / happen
  chosen_korean: 이런 일들이 / 일어날 수 있습니까
  alternatives_korean:
  - 이것들이 / 있을 수 있습니까
  - 이러한 일들이 / 생길 수 있습니까
  lexicon: BDAG
  rationale: ταῦτα의 복수 지시를 살려 '이런 일들'로 처리하고, γίνομαι의 사건·발생성(come to be, happen)을 자연스러운 현대어 '일어날 수 있습니까'로 표현해 물음의 가능성·불가사의함을 전달했습니다.
theological_decisions:
- issue: 표현의 지시 대상(αὐτῷ)을 '예수'로 명시할지 여부
  chosen_reading: 원문 대명사를 그대로 '그에게'로 번역하여 특정 이름을 도입하지 않음
  alternative_readings:
  - 문맥상 예수를 가리키므로 '예수께'로 분명히 표기
  - 그 대신 '주님께'로 경칭 사용
  rationale: 원문은 대명사를 사용하므로 과도하게 화자를 보충하지 않는 것이 출전(原文) 충실성에 부합합니다. 독자는 앞 문맥에서 화자가 누구인지 알 수 있으므로 이름을 첨가할 필요가 없습니다.
  doctrine_reference: Translation philosophy §3 (source fidelity)
