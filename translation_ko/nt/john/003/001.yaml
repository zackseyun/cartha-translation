id: JHN.3.1
reference: John 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: Now there was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
  footnotes:
  - marker: a
    text: Or, 'a ruler of the Judeans.' The Greek term can refer to Jews generally or, in some contexts, more specifically to Judeans/Jewish authorities.
    reason: alternative_reading
translation:
  language: ko
  text: 바리새인들 가운데 니고데모라는 사람이 있었습니다. 그는 유대인의 지도자[a]였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 사람들의 지도자’. 헬라어 Ἰουδαῖοι는 문맥에 따라 ‘유대인들’ 또는 더 지역적으로 ‘유대 사람들’을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  english_pob_choice: Now there was
  chosen_korean: 있었습니다
  alternatives_korean:
  - 그런데 있었다
  - 한 사람이 있었다
  lexicon: BDAG
  rationale: δέ는 완급을 더하는 접속사입니다. 한국어 내러티브에서는 '있었습니다' 형태로 자연스럽게 연결하면서도 담화를 전환하는 힘을 유지합니다(영어 POB의 'Now'에 해당).
- source_word: ἐκ τῶν Φαρισαίων
  english_pob_choice: from the Pharisees
  chosen_korean: 바리새인 중에
  alternatives_korean:
  - 바리새인으로부터
  - 바리새인들 가운데서
  lexicon: BDAG
  rationale: ἐκ + 属格은 소속·출신을 나타냅니다. 한국어에서는 소속을 '중에'로 표현하는 것이 자연스러워 '바리새인 중에'로 옮겼습니다(니고데모가 그 집단에 속함을 보존).
- source_word: Νικόδημος ὄνομα αὐτῷ
  english_pob_choice: named Nicodemus
  chosen_korean: 니고데모라는 사람
  alternatives_korean:
  - 그의 이름은 니고데모였다
  - 니고데모라고 불렸다
  lexicon: BDAG
  rationale: 그리스어 명명 표현은 한국어에서 '~라는 사람' 또는 '~라는 이름의'로 자연스럽게 옮겨집니다. 짧고 독자에게 익숙한 어법으로 '니고데모라는 사람'을 선택했습니다.
- source_word: ἄρχων τῶν Ἰουδαίων
  english_pob_choice: a ruler of the Jews
  chosen_korean: 유대인의 관원
  alternatives_korean:
  - 유대인의 지도자
  - 유대인 관원
  lexicon: BDAG
  rationale: ἄρχων은 권위를 가진 공적 직책을 가리키므로 '관원' 또는 '관직자' 계열의 번역이 적절합니다. 본문에서 ἄρχων이 공동체 내 권위자로서의 의미를 가지므로 '유대인의 관원'으로 번역해 영어 POB의 범주적 의미를 따랐습니다.
theological_decisions:
- issue: Rendering of Ἰουδαίων in Johannine context
  chosen_reading: 유대인의 (유대인들의)
  alternative_readings:
  - 유대 지방 사람들(유대인들)
  - 유대인 당국(유대인들의 지도자들)
  rationale: 요한복음에서 Ἰουδαῖοι는 민족적·종교적·지역적 의미로 다양하게 쓰입니다. 이 구절에서는 니고데모가 바리새인으로서 공동체 내 권위자임을 드러내므로 넓은 공동체·종교적 의미인 '유대인의'가 원문 의도를 잘 반영합니다. 그러나 지역적·정치적 뉘앙스('유대 지방 사람들' 혹은 '유대 당국')로 읽을 여지도 있어 그 대안은 각주로 보존합니다.
  doctrine_reference: Translation philosophy §3; §4
