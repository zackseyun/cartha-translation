source:
  edition: SBLGNT
  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
  footnotes:
  - marker: a
    text: That is, John the Baptist.
    reason: cross_reference
translation:
  language: ko
  text: 요한[a]은 아직 옥에 던져지지 않았습니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 즉 세례 요한을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: οὔπω
  english_pob_choice: not yet
  chosen_korean: 아직 …지 않았다
  alternatives_korean:
  - 그때까지 …지 않았다
  - 아직 …아니다
  lexicon: BDAG
  rationale: οὔπω는 동작이 서술 시점까지 발생하지 않았음을 표시하므로 한국어로 간결한 시제 표현 '아직 …지 않았다'를 썼습니다.
- source_word: γὰρ
  english_pob_choice: for
  chosen_korean: (문장 수준의 설명 어조로 번역, 별도 접속사 생략)
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: BDAG
  rationale: γάρ은 배경적·설명적 연결을 제공하므로 별도의 접속사 없이 문장 어조로 설명을 전달하는 편이 자연스러워 본문에서는 명시적 단어를 넣지 않았음을 밝힙니다.
- source_word: ἦν βεβλημένος
  english_pob_choice: had ... been thrown
  chosen_korean: 던져지지 않았다
  alternatives_korean:
  - 던져지지 않았었습니다
  - 투옥되지 않았다
  lexicon: BDAG
  rationale: περιφραστική 과거·수동의 완료된 행위를 나타내므로 한국어로 완료 부정 '…지 않았다'를 선택했고, βάλλω의 '던지다' 어감을 살려 '던져지지 않았다'로 번역하여 원문의 역동성을 보존했습니다.
- source_word: εἰς τὴν φυλακήν
  english_pob_choice: into prison
  chosen_korean: 옥에
  alternatives_korean:
  - 감옥에
  - 옥으로
  lexicon: BDAG
  rationale: φυλακή는 구금·투옥을 뜻하므로 한국어로는 전통적이면서 간결한 '옥'을 택해 방향성(…에 들어감)을 '…에'로 표했습니다.
- source_word: ὁ Ἰωάννης
  english_pob_choice: John
  chosen_korean: 요한
  alternatives_korean:
  - 세례 요한
  - 요한(세례자)
  lexicon: BDAG
  rationale: 그리스어 본문은 정관사와 이름만을 제시하므로 본문에는 추가 수식 없이 전통적 한국어 성경형인 '요한'으로 표기하고, 정체는 각주로 밝힙니다.
theological_decisions:
- issue: Identification of Ἰωάννης
  chosen_reading: 요한
  alternative_readings:
  - 세례 요한
  - 요한(세례자)
  rationale: 본문 표기가 단순히 '요한'이므로 본문에 '세례 요한'을 삽입하면 원문 이상의 해석이 들어갑니다. 문맥상 대상은 세례자 요한이지만 그 사실은 각주로 제시하여 본문 충실성을 유지했습니다.
  doctrine_reference: 'Translation philosophy: Never paraphrase beyond what the source text warrants.'
