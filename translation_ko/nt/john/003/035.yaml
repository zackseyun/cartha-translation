  source_fidelity: 원문의 현재형 ἀγαπᾷ는 ‘사랑하시며’로, 완료형 δέδωκεν은 ‘맡기셨습니다’로 자연스럽게 옮겨졌습니다. πάντα의 포괄성도 ‘모든 것’으로 보존되었고, ἐν τῇ χειρὶ αὐτοῦ의 위임·권한 관용 표현을 ‘손에 맡기셨습니다’로 옮긴 것은 적절합니다.
  naturalness: 합쇼체와 하나님을 향한 존칭이 일관되고 자연스럽습니다. 다만 ‘그의 손’의 ‘그’는 한국어에서 문맥상 아들을 가리킬 수 있으나, 바로 앞의 주어인 ‘아버지’도 있어 소유격 지시 대상이 순간적으로 모호할 수 있습니다. ‘아들의 손’이 더 분명하고 자연스럽습니다.
  terminology: ‘아버지’와 ‘아들’은 요한복음 문맥의 관계적·칭호적 표현을 과도한 해설 없이 충실히 보존합니다. 각주에서 ἐν τῇ χειρί의 문자적 표현은 ‘손 안에’보다 ‘손에’가 더 직접적이며, 본문의 관용적 번역과의 대비도 명료합니다.
