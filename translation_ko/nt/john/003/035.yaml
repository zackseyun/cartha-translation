  text: ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
  footnotes:
  - marker: a
    text: Or 'in his hand.' The Greek expression is literally 'in his hand,' an idiom for entrusting authority or possession.
    reason: lexical_alternative
translation:
  language: ko
  text: 아버지께서는 아들을 사랑하시며 모든 것을 그의 손에 맡기셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 손 안에'로 직역할 수 있습니다. 헬라어 표현은 문자적으로 '그의 손 안에'이며, 권한이나 소유를 맡긴다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  english_pob_choice: The Father
  chosen_korean: 아버지
  alternatives_korean:
  - 아버지께서는
  - 하나님 아버지
  lexicon: BDAG
  rationale: '요한복음의 문맥에서 인칭적 신칭호이므로 일반적 부성(‘the father’)이 아니라 인격적 제목으로 처리했습니다. 본문에서는 동사에 경어형을 사용해 신적 존칭을 표시합니다(번역문: ''아버지께서는'').'
- source_word: ἀγαπᾷ
  english_pob_choice: loves
  chosen_korean: 사랑하시다
  alternatives_korean:
  - 사랑한다
  - 사랑하십니다
  lexicon: BDAG
  rationale: 현재 직설법의 지속적·현실적 의미를 한국어에서는 경어형 현재로 전달하는 것이 자연스럽습니다. 신을 가리키므로 존칭형을 사용했습니다.
- source_word: δέδωκεν / ἐν τῇ χειρὶ αὐτοῦ
  english_pob_choice: has given ... into his hand
  chosen_korean: 모든 것을 그의 손에 맡기셨습니다
  alternatives_korean:
  - 모든 것을 그의 손에 주셨습니다
  - 모든 것을 그의 손 안에 두셨습니다
  lexicon: BDAG
  rationale: δέδωκεν의 완료적 결과와 ἐν τῇ χειρὶ의 관용적 의미(권한·소유를 맡김)를 함께 살려 '맡기셨습니다'로 번역하여 위임·권한 부여의 지속성을 보존했습니다.
- source_word: τὸν υἱόν
  english_pob_choice: the Son
  chosen_korean: 아들
  alternatives_korean:
  - 아들(메시아)
  - 아드님
  lexicon: BDAG
  rationale: 문맥상 예수를 가리키는 기독론적 칭호이므로 '아들'로 처리하되, 본문 전체의 문법·경어 선택을 통해 인격적·제목적 사용을 드러냅니다.
theological_decisions:
- issue: Relation of the Father and the Son
  chosen_reading: 본문의 인칭적·관계적 칭호('아버지', '아들')를 그대로 유지하고 번역문에서 존칭으로 표시했습니다.
  alternative_readings:
  - 일반적 가족 어휘로 처리(비전문적·비제목적 번역)
  - 야훼 등 고대 이명으로 대체
  rationale: 요한 신학의 핵심적 아버지-아들 관계를 축소하거나 의도적으로 확장하지 않고, 원문이 의도한 인격적 관계를 전달하는 것이 우선입니다.
  doctrine_reference: Affirmations; Translation philosophy §2
- issue: Scope and permanence of what is given to the Son
  chosen_reading: δέδωκεν의 완료 의미와 ἐν τῇ χειρὶ의 '위임/권한' 관용을 살려 '모든 것을 그의 손에 맡기셨습니다'로 번역하여 포괄성과 지속성을 보존했습니다.
  alternative_readings:
  - '''주셨다''처럼 단순 과거로 번역하여 일회적 사건으로 처리'
  rationale: 원문의 완료 시제와 수사적 맥락은 현재까지 유효한 위임을 가리키므로 번역도 그 결과의 지속성을 반영해야 합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
