translation:
  language: ko
  text: 내가 여러분에게 땅의 것들에 관해[a] 말했는데도 여러분이 믿지 않는다면, 내가 여러분에게 하늘의 것들에 관해[b] 말하면 어떻게 믿겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅 위의 것들’ 또는 ‘지상의 것들’로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘에 있는 것들’ 또는 ‘천상의 것들’로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐπίγεια
  english_pob_choice: earthly things
  chosen_korean: 땅의 것들
  alternatives_korean:
  - 지상의 것들
  - 땅에 속한 것들
  - 세상적인 것들
  lexicon: BDAG
  rationale: 중성 복수 형용사가 명사화되어 대조(τὰ ἐπουράνια)와 짝을 이룹니다. '땅의 것들'은 한국어에서 자연스럽고 원어의 대비를 그대로 드러내므로 선택했습니다. 대안들은 가능하지만 각각의 뉘앙스(지상성, 속함을 드러냄, 세속성)를 추가해 원문 대조를 불필요하게 좁힐 수 있습니다.
- source_word: τὰ ἐπουράνια
  english_pob_choice: heavenly things
  chosen_korean: 하늘의 것들
  alternatives_korean:
  - 천상의 것들
  - 하늘에 속한 것들
  - 하늘의 일들
  lexicon: BDAG
  rationale: 대조 관계를 유지하기 위해 τὰ ἐπίγεια와 대응되는 평어를 사용했습니다. '하늘의 것들'은 직역적이고 중립적이며 원문의 범위를 제한하지 않습니다. 다른 대안은 경건성이나 사건성을 더해 해석적 편향을 만들 수 있습니다.
- source_word: εἶπον / ἐὰν εἴπω
  english_pob_choice: I told / if I tell
  chosen_korean: 말했는데 / 말하면
  alternatives_korean:
  - 말했습니다 / 말한다면
  - 말하였다 / 말하면
  lexicon: BDAG
  rationale: εἶπον(과거형)은 화자가 이미 말한 행위를 가리키고, ἐὰν εἴπω의 조건절은 미래적·가정적 어감을 줍니다. 한국어에서는 '말했는데(도)'와 조건절 '말하면'으로 시제·상태 차이를 자연스럽게 살렸습니다.
- source_word: πιστεύετε
  english_pob_choice: you do not believe
  chosen_korean: 믿지 않는다면
  alternatives_korean:
  - 믿지 않습니다
  - 믿지 않거든요
  - 믿지 않으시면
  lexicon: BDAG
  rationale: 그리스어 현재형과 부정(οὐ)은 반복적·일반적 상태를 지시합니다. 조건문 문맥에서는 '믿지 않는다면'이 자연스럽게 원문의 일반적·현상적 어조를 전달합니다. 청중 표지로 복수 ὑμῖν은 '여러분'으로 처리했습니다.
- source_word: ὑμῖν
  english_pob_choice: you (to you)
  chosen_korean: 여러분에게
  alternatives_korean:
  - 너희에게
  - 당신에게
  - 그대에게
  lexicon: SBLGNT (pronouns)
  rationale: 원문 ὑμῖν은 2인칭 복수(또는 공적 청중) 형태입니다. 현대 한국어 출판 표준과 POB의 공적·정중한 어조에 따라 '여러분에게'로 번역했습니다.
theological_decisions:
- issue: 대조된 '땅의 것들'과 '하늘의 것들'의 의미 범위
  chosen_reading: 텍스트가 제시하는 단순한 대조(땅 대 하늘)를 그대로 살리고, '땅의 것들'을 지상적 비유나 세상적 사실 가운데 어느 하나로 좁히지 않음
  alternative_readings:
  - '''땅의 것들''을 단순한 비유적 예로 보는 해석'
  - '''땅의 것들''을 지상의 사건·사실로 구체화하는 해석'
  - '''하늘의 것들''을 심오한 신비로 좁히는 해석'
  rationale: 원문은 두 범주를 대비시키지만 그 범위를 명시적으로 한정하지 않습니다. 번역에서 광범위한 표현을 유지함으로써 원문의 신학적 긴장을 보존하는 것이 POB 원칙에 부합합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
