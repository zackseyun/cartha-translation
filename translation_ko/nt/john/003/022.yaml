id: JHN.3.22
reference: John 3:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
  footnotes:
  - marker: a
    text: John 4:2 later clarifies that Jesus himself was not baptizing, but his disciples were.
    reason: cross_reference
  - marker: b
    text: Or 'into the land of Judea' or simply 'into Judea.'
    reason: lexical_alternative
  - marker: c
    text: Or 'was staying there with them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들 후에[a], 예수님과 그의 제자들이 유대 땅으로[b] 갔고, 거기서 그분은 그들과 함께 머물며[c] 세례를 베풀고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 요한복음 4:2에서 뒤에 밝히기를, 예수님 자신이 직접 세례를 베풀지 않고 제자들이 베풀었다고 합니다.
    reason: cross_reference
  - marker: b
    text: 또는 '유대로' 또는 '유대 지방으로'라고 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '거기서 그들과 함께 머물고 있었다'고 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  english_pob_choice: After these things
  chosen_korean: 이 일들 후에
  alternatives_korean:
  - 그 후에
  - 이후에
  lexicon: BDAG
  rationale: 원문 복수 지시사를 반영하여 내러티브의 연속성을 보존합니다. 한국어 관용 표현 '그 후에'도 가능하지만, 복수 형태를 살려 '이 일들 후에'로 직역에 가깝게 처리했습니다.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  english_pob_choice: into the land of Judea
  chosen_korean: 유대 땅으로
  alternatives_korean:
  - 유대로
  - 유대 지방으로
  - 유대 광야로
  lexicon: BDAG
  rationale: γῆ의 '땅/지역' 의미를 직접적으로 반영하기 위해 '유대 땅'으로 번역했습니다. 영어 감사자문에서 최종적으로 'land of Judea'를 채택한 점을 따랐습니다.
- source_word: διέτριβεν
  english_pob_choice: was spending time
  chosen_korean: 머물며
  alternatives_korean:
  - 머물고 있었다
  - 지내고 있었다
  - 체류하고 있었다
  lexicon: BDAG
  rationale: 미완료의 진행적 성격을 살려 '머물며'로 처리했습니다. 문맥상 '제자들과 함께 시간을 보냈다/머물렀다'는 뜻인데, 한국어의 자연스러움을 위해 현재진행형 어감을 주는 표현을 선택했습니다.
- source_word: ἐβάπτιζεν
  english_pob_choice: baptizing
  chosen_korean: 세례를 베풀고 있었습니다
  alternatives_korean:
  - 세례를 베풀고 있었다
  - 침례를 베풀고 있었다
  - 세례를 주고 있었다
  lexicon: BDAG
  rationale: βαπτίζω의 전통적 신학어인 'baptize'를 한국어로는 '세례를 베풀다'로 옮겼습니다. 미완료의 지속성을 반영해 '...베풀고 있었습니다'로 표현했고, 행위 주체 문제는 각주로 처리했습니다.
theological_decisions:
- issue: Subject of 'baptizing' in John 3:22 vs. John 4:2
  chosen_reading: 문법상 본절은 예수님을 주어로 취하지만, 요한복음 4:2의 분명한 설명을 존중하여 본문은 그대로 두고 각주로 설명합니다.
  alternative_readings:
  - '본문에서 주어를 제자로 바꾸어 번역 (예: ''제자들이 세례를 베풀었다'')'
  - 수동·비인칭 구조로 바꾸어 행위자를 명시하지 않음
  rationale: 본문의 문법적 주체(단수 동사)와 문맥상의 명확한 서술(요한 4:2)을 동시에 보존하는 것이 원문 비평과 독자에 대한 투명성에서 우선됩니다. 따라서 본문은 문자 그대로 보존하고, 요한복음 4:2을 각주로 제시해 신학적 긴장을 드러냅니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
