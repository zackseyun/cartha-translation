id: JHN.3.18
reference: John 3:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
  footnotes:
  - marker: a
    text: Or 'judged' in both occurrences of 'condemned.' The Greek verb is κρίνω, which can mean 'judge' or, in context, 'condemn.'
    reason: lexical_alternative
  - marker: b
    text: Or 'only Son,' 'unique Son'; traditionally, 'only begotten Son.'
    reason: alternative_reading
translation:
  language: ko
  text: 그를 믿는 사람은 정죄를 받지 않습니다[a]. 그러나 믿지 않는 사람은 이미 정죄를 받았습니다. 이는 그가 하나님의 유일한 아들의 이름을 믿지 않았기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 두 곳 모두에서 ‘심판을 받지 않습니다/이미 심판을 받았습니다’로 번역할 수 있습니다. 그리스어 κρίνω는 ‘판단하다’에서 ‘정죄하다’까지 의미 폭이 있으므로 문맥적으로 정죄의 뜻을 취했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 전통적 번역 '독생자' 또는 '오직 하나의 아들'로 읽을 수 있습니다(역사적·신학적 전승 때문에 주석에서 보전).
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων
  english_pob_choice: the one who believes
  chosen_korean: 그를 믿는 사람
  alternatives_korean:
  - 믿는 자
  - 믿는 이
  lexicon: BDAG
  rationale: ἡ ἀρθροληπτικὴ μετοχή(articular participle)는 규범적으로 ‘~하는 사람/이’로 한국어화하는 것이 자연스러우므로, 현대 독자가 쉽게 읽도록 '그를 믿는 사람'을 택했습니다; '믿는 자'는 고전적 어투입니다.
- source_word: εἰς αὐτόν
  english_pob_choice: in him
  chosen_korean: 그를 믿는
  alternatives_korean:
  - 그 안을 믿는
  - 그에게 믿는
  lexicon: BDAG
  rationale: πιστεύω + εἰς는 대상을 향한 신뢰를 가리킵니다. 한국어 관용으로는 '그를 믿다'가 자연적이므로 목적격 어구로 처리했습니다.
- source_word: οὐ κρίνεται / ἤδη κέκριται (κρίνω)
  english_pob_choice: is not condemned / has already been condemned (condemned)
  chosen_korean: 정죄를 받지 않습니다 / 이미 정죄를 받았습니다
  alternatives_korean:
  - 심판받지 않습니다 / 이미 심판을 받았습니다
  - 판결을 받지 않았습니다 / 이미 판결을 받았습니다
  lexicon: BDAG
  rationale: 요한본문의 문맥(3:17–19)은 구원과 정죄의 대비를 전제로 하므로 κρίνω의 부정적·결정적 의미를 살려 '정죄'를 택했습니다; 완료상(κέκριται)은 현재 결과 상태를 보이므로 '이미 정죄를 받았습니다'로 번역했습니다.
- source_word: εἰς τὸ ὄνομα
  english_pob_choice: in the name
  chosen_korean: 이름을 믿지 않았기
  alternatives_korean:
  - 그 이름을 믿지 않았기
  - 그 권위를 신뢰하지 않았기
  lexicon: BDAG
  rationale: 요한서신에서 τὸ ὄνομα는 인물의 드러난 신원·권위를 가리키는 관용적 표현입니다. 본문은 '이름을 믿다'라는 구체적 표현을 쓰므로 이를 유지했습니다.
- source_word: τοῦ μονογενοῦς υἱοῦ
  english_pob_choice: of the one and only Son
  chosen_korean: 하나님의 유일한 아들
  alternatives_korean:
  - 하나님의 외아들
  - 하나님의 독생자
  lexicon: BDAG
  rationale: μονογενής는 '유일성/독특함'을 강조하므로 현대 독자에게 명확한 '유일한 아들'을 택했습니다. 전통적 '독생자'는 주석적 보충으로 남깁니다.
theological_decisions:
- issue: Rendering κρίνω (οὐ κρίνεται / κέκριται)
  chosen_reading: 정죄(정죄받지 않음/정죄받음)로 번역
  alternative_readings:
  - 심판/판정(심판받지 않습니다/이미 심판을 받았습니다)
  - 보다 중립적 '심사·판정' 어휘
  rationale: 요한복음 3:17–19의 맥락은 믿음에 따른 구원과 믿지 않음에 따른 불리한 심판(정죄)의 대비를 전제로 합니다. 최신 심사·교정 기록에서도 본문 전체의 구원/정죄 대비를 살리기 위해 '정죄' 번역이 채택·복원되었습니다.
  doctrine_reference: 원어 우선성; 해석은 본문 문맥에 근거함(요한복음 3장 전체의 구원·정죄 대비).
- issue: Rendering μονογενής
  chosen_reading: 하나님의 유일한 아들
  alternative_readings:
  - 하나님의 독생자
  - 하나님의 외아들
  - 하나님만의 아들(유일무이한 아들)
  rationale: 원어의 핵심 의미는 '유일무이성'이며, 전통적 '독생자' 표현은 신학사적 함의가 있어 주석적 고지를 통해 보존하고, 본문 번역은 현대 독자에게 오해를 줄이지 않도록 '유일한 아들'로 처리했습니다.
  doctrine_reference: '니케아 신경 전통과 번역 원칙: 원어 우선성과 신학적 민감성 보존.'
