id: JHN.3.4
reference: John 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
  footnotes:
  - marker: a
    text: Or, 'How can someone be born when they are old?' The Greek says 'a man,' using a masculine singular form generically.
    reason: lexical_alternative
  - marker: b
    text: Greek 'a second time'; Nicodemus understands Jesus' words in a literal sense.
    reason: cross_reference
translation:
  language: ko
  text: 니고데모가 그에게 말했습니다. “사람[a]이 늙었는데 어떻게 태어날 수 있습니까? 어머니의 태중에 두 번째로[b] 들어가서 태어날 수는 없지 않습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '어떤 이/사람'으로 옮길 수 있습니다. 그리스어는 남성 단수형을 일반적 용법으로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 '두 번째로'입니다; 니고데모는 예수의 말을 문자적으로 이해하고 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἄνθρωπος
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 어떤 이
  - 사람(누구든)
  lexicon: BDAG
  rationale: 그리스어의 남성 단수형이 일반적·대표적 용법으로 쓰였습니다. 한국어에서 '사람'은 원문의 대표적·일반적 뜻을 살리면서 성별을 불필요하게 한정하지 않습니다. '남자'는 원문의 문법적 성을 과도하게 성별화할 수 있습니다.
- source_word: δεύτερον
  english_pob_choice: a second time
  chosen_korean: 두 번째로
  alternatives_korean:
  - 다시
  - 또
  lexicon: BDAG
  rationale: δεύτερον은 문자적으로 '두 번째로'를 뜻합니다. 니고데모의 말이 문자적·시간적 반복을 가리키므로 한국어에서도 명확하게 '두 번째로'로 옮겨 원문의 오해(문자적 이해)를 보존합니다.
- source_word: κοιλίαν τῆς μητρὸς αὐτοῦ
  english_pob_choice: his mother's womb
  chosen_korean: 어머니의 태중
  alternatives_korean:
  - 어머니의 배
  - 자궁
  lexicon: BDAG
  rationale: κοιλίαν은 문맥상 '태중/자궁'을 가리킵니다. 한국어 전통 번역과 자연스러움을 고려해 '어머니의 태중'을 선택하여 원문의 생물학적 의미를 정확히 전달합니다.
- source_word: γεννηθῆναι
  english_pob_choice: be born
  chosen_korean: 태어나다
  alternatives_korean:
  - 낳아지다
  - 거듭나다
  lexicon: BDAG
  rationale: 원형은 출생을 가리키는 수동 부정사입니다. 한국어에서 '태어나다'가 가장 직설적이고 중립적인 대응어입니다. '거듭나다/거듭 태어나다'는 요한복음 3장의 신학적 논쟁을 불필요하게 끌어들일 수 있으므로 피했습니다.
theological_decisions:
- issue: Rendering the generic masculine ἄνθρωπος
  chosen_reading: 사람 (generic)
  alternative_readings:
  - 남자
  - 어떤 이
  rationale: 원문은 문법적 남성 단수형을 사용하지만 일반적·대표적 의미로 읽힙니다. 한국어에서 '사람'으로 번역하면 원문의 대표성은 유지하면서 과도한 성별 한정을 피할 수 있습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: Whether to import 'born again' language from John 3:3 into γεννηθῆναι here
  chosen_reading: 두 번째로 … 태어날 수 있습니까? (원문의 δεύτερον을 충실히 반영)
  alternative_readings:
  - 거듭나다
  - 다시 태어나다 (의역)
  rationale: ὅτι δεύτερον(‘두 번째로’)은 니고데모의 문자적 오해를 드러냅니다. '거듭나다' 같은 신학적 용어를 이 절에 도입하면 내러티브의 긴장(예수와 니고데모의 이해 차이)을 약화시키므로 회피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
