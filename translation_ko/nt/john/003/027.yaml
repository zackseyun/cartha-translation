id: JHN.3.27
reference: John 3:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
  footnotes:
  - marker: a
    text: Or “a person.” The Greek says “a man” (ἄνθρωπος) with a generic, representative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 요한이 대답하여 말했습니다. 「사람은 그에게 하늘로부터 주어지지 않으면 하나도 받을 수 없습니다.」[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 “한 사람” 혹은 “어떤 사람도”로 번역할 수 있습니다. 그리스어 ἄνθρωπος는 여기서 일반적·대표적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωάννης
  english_pob_choice: John
  chosen_korean: 요한
  alternatives_korean:
  - 요한 (standard NT form)
  lexicon: BDAG / standard NT onomastics
  rationale: 고유명사는 현대 한국어 성경 관행대로 표준화된 전통적 표기를 따릅니다. '요한'은 그리스어 Ἰωάννης의 일반적 한국어 표기입니다.
- source_word: ἄνθρωπος
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 사람
  - 어떤 사람도
  - 사람(일반적)
  lexicon: BDAG
  rationale: 그리스어 ἄνθρωπος는 단수·대표적(generic) 의미이므로, 성별을 부각시키지 않는 '사람'으로 번역하여 원문의 일반적 대표성을 유지합니다. 원문의 대표성은 주석[a]로 문서화합니다.
- source_word: λαμβάνειν
  english_pob_choice: to receive
  chosen_korean: 받다
  alternatives_korean:
  - 얻다
  - 취하다
  lexicon: BDAG
  rationale: 문맥상 수여받는 능동적 수혜 행위가 강조되므로 '받다'가 원어의 수동적·수혜적 의미를 가장 충실히 전달합니다.
- source_word: ἐκ τοῦ οὐρανοῦ
  english_pob_choice: from heaven
  chosen_korean: 하늘로부터
  alternatives_korean:
  - 하늘에서
  - 하늘로부터, 하늘로부터 오는 것
  lexicon: BDAG
  rationale: 요한복음의 어법에서 '하늘'은 신적 기원을 암시할 수 있으나 원문은 문자적으로 'from heaven'이므로 직역어 '하늘로부터'를 사용하여 수여의 출처를 보존합니다.
theological_decisions:
- issue: 범위와 결정론적 해석의 보류
  chosen_reading: 이 구절은 받음의 근원이 하늘(신적 출처)에 의해 주어짐을 말하지만, 인간 행위나 책임을 모두 배제하는 강한 결정론을 단언하지 않습니다.
  alternative_readings:
  - 모든 인간 성취에 대한 강한 결정론(모든 것이 이미 하늘에서 정해짐)
  - 즉시 문맥(세례자와 예수의 사역)에 국한한 지위·사명 관련의 제한적 진술
  rationale: 문맥상 요한의 발언은 주로 사역·권위의 출처를 말하는 것이지만, 어법은 일반적 원칙을 제시합니다. 번역은 원문의 넓은 진술을 그대로 살려 두 입장을 교정하거나 제거하지 않습니다.
  doctrine_reference: 신학적 긴장 보존 — 결정론과 인간 행위의 긴장을 해소하지 않음
