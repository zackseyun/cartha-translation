source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
  footnotes:
  - marker: a
    text: Or 'the one who came down from heaven.'
    reason: lexical_alternative
  - marker: b
    text: '''The Son of Man'' is Jesus'' characteristic self-designation and echoes Daniel 7:13–14.'
    reason: cross_reference
translation:
  language: ko
  text: 하늘에 올라간 이는 하늘에서 내려오신 분[a], 곧 인자[b] 외에는 아무도 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '하늘에서 오신 분'으로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 『인자』는 예수께서 특징적으로 자신을 가리켜 사용하신 명칭이며, 다니엘 7:13–14을 환기합니다.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  english_pob_choice: no one
  chosen_korean: 아무도 … 없다
  alternatives_korean:
  - 아무도 … 하지 않았다
  - 누구도 … 아니다
  lexicon: BDAG
  rationale: 그리스어 부정 대명사의 배타적 의미를 한국어 관용구인 '아무도 … 없다'로 자연스럽게 전달합니다.
- source_word: ἀναβέβηκεν
  english_pob_choice: has ascended
  chosen_korean: 올라간
  alternatives_korean:
  - 올라갔습니다
  - 올랐습니다
  lexicon: BDAG
  rationale: 완료적 의미(올라간 행위의 완료)를 '올라간'·'올라갔습니다' 같은 한국어 표현으로 전달하며, 본문이 내려오심과의 평행을 이루도록 '올라간'을 사용했습니다.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  english_pob_choice: the one who descended from heaven
  chosen_korean: 하늘에서 내려오신 분
  alternatives_korean:
  - 하늘에서 내려온 이
  - 하늘에서 오신 분
  lexicon: BDAG
  rationale: 관사화된 분사구문을 한국어의 명사화 표현 '…하신 분'으로 처리하여 원문의 서술적·명사적 기능을 유지했습니다.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 인간
  - 사람의 아들
  lexicon: BDAG; Gospel usage
  rationale: 예수의 고유한 자칭으로서 다니엘적·복음서적 함의를 보존하기 위해 전통적 번역 '인자'를 사용했습니다.
theological_decisions:
- issue: Title force of 'the Son of Man' (ὁ υἱὸς τοῦ ἀνθρώπου)
  chosen_reading: 원문적 자칭으로 '인자'를 그대로 유지
  alternative_readings:
  - '''인간'' 또는 ''사람의 아들''처럼 의역'
  - '''메시아''로 직역'
  rationale: 원어적·종말론적 함의(다니엘 7:13–14의 상호참조)를 보존하려면 자칭을 휘발시키지 않는 직역이 적절합니다.
  doctrine_reference: Affirmations; Translation philosophy §3, §5
- issue: Ascent/descent aspect (ἀναβέβηκεν … καταβάς)
  chosen_reading: '''올라간''과 ''내려오신''의 평행 표현으로 천상 출신과 유일한 접근을 유지'
  alternative_readings:
  - '''가다/오다'' 등의 덜 사색적인 번역'
  - 현재 시제화하여 보편적 진술로 바꾸기
  rationale: 본문은 그리스어의 완료/분사 구조로 하늘에서의 '오르심'과 '내리심'을 대조하므로, 한국어에서도 동작의 완료와 평행을 살린 표현을 선택했습니다.
  doctrine_reference: Affirmations; Translation philosophy §1, §3
