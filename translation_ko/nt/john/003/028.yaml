id: JHN.3.28
reference: John 3:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
  footnotes:
  - marker: a
    text: Or, 'the Christ.'
    reason: alternative_reading
  - marker: b
    text: Or, 'I am sent before him' or 'I was sent before him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 자신이 내가 이렇게 말한 것을 내게 증언합니다. 「나는 메시아[a]가 아닙니다. 오히려 그분보다 앞서 보내심을 받았습니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리스도’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그분보다 앞서 보내졌습니다’ 또는 ‘그분보다 앞서 보냄을 받았습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  english_pob_choice: You yourselves
  chosen_korean: 너희 스스로
  alternatives_korean:
  - 너희 자신들이
  - 너희들 스스로
  lexicon: BDAG
  rationale: 원문 결합은 화자에게 증언하는 대상(청중)을 강조합니다. 한국어 '너희 스스로'는 강조를 자연스럽게 전달합니다.
- source_word: μοι μαρτυρεῖτε
  english_pob_choice: bear me witness
  chosen_korean: 내게 증거합니다
  alternatives_korean:
  - 내게 증언합니다
  - 나에 대해 증거합니다
  lexicon: BDAG
  rationale: δοτικὸν μοι는 '내게'로, μαρτυρεῖτε는 법적·증언적 어감을 가진 '증거하다'로 처리하여 요한 본문의 증언 뉘앙스를 살렸습니다.
- source_word: ὁ χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: BDAG
  rationale: 프로젝트 용어집 지침에 따라 칭호적 기능의 Χριστός는 '메시아'로 번역하여 원어의 의미를 보존합니다.
- source_word: Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου
  english_pob_choice: I have been sent ahead of him
  chosen_korean: 그분보다 앞서 보내심을 받았습니다
  alternatives_korean:
  - 그보다 앞서 보내심을 받았습니다
  - 그보다 앞서 보내졌습니다
  lexicon: BDAG
  rationale: Ἀπεσταλμένος εἰμὶ의 수동적·완료적 성격을 '보내심을 받았습니다'로 옮겨, 이전의 파견 사건이 현재적 효력을 지닌 상태임을 전달합니다.
theological_decisions:
- issue: Rendering of Χριστός as title
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 여기서 Χριστός는 기대되는 '기름부음 받은 자'라는 칭호로 사용되므로, 라벨식 음역 '그리스도'보다 의미 번역인 '메시아'가 독자의 이해를 돕습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: Χριστός → Messiah (where title; Christ where name-like)'
- issue: Force of Ἀπεσταλμένος εἰμὶ
  chosen_reading: 보내심을 받았습니다 (완료적 결과를 지닌 파견)
  alternative_readings:
  - 나는 그보다 앞서 보내심을 받습니다
  - 내가 그보다 앞서 보내졌습니다
  rationale: 그리스어 구성은 과거의 파견 사건이 현재의 신분으로 이어짐을 암시하므로, 완료적 뉘앙스를 살려 번역했습니다. 이는 요한의 '준비된 사명'이라는 맥락을 유지합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve source text''s plain sense; do not import doctrinal claims the text does not make'
