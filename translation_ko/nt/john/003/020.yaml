revisions:
- from: 모든 악을 행하는 사람은 빛을 미워하여 빛으로 오지 않습니다. 그의 행위[b]가 드러나지 않으려는 것입니다[a].
  to: 악한 일을 일삼는 사람은 모두 빛을 미워하고, 자신의 행위가 드러나지 않게 하려고 빛으로 나아오지 않습니다.[a][b]
  rationale: 목적절을 ‘빛으로 나아오지 않습니다’에 직접 연결하여 원문의 ἵνα μὴ 구조를 분명히 했습니다. 또한 현재분사의 지속적 성격과 πρὸς의 방향성을 더 자연스러운 현대 한국어로 반영했습니다. 각주 표지는 본문에 실제로 붙이고, 기존 각주의 어휘적 대안과 일반적 남성 단수 설명을 수정 본문에 맞게 정리했습니다.
