review_pass:
  verdict: revise
  source_fidelity: 개정안은 πᾶς ... πράσσων의 일반적·지속적 행위를 ‘악한 일을 일삼는 사람은 모두’로, μισεῖ와 οὐκ ἔρχεται의 병렬을 ‘미워하고 ... 나아오지 않습니다’로 충실히 반영합니다. ἵνα μὴ ἐλεγχθῇ는 빛을 피하는 목적을 분명히 하여 ‘드러나지 않게 하려고’로 옮겼습니다.
  naturalness: 초안의 ‘빛으로 오지 않습니다’와 문장 끝에 독립된 ‘그의 행위가 드러나지 않으려는 것입니다’는 현대 표준 한국어에서 다소 직역적이고 목적 관계가 불분명합니다. 개정안은 자연스러운 합쇼체 문장으로 목적절을 앞 동사에 직접 연결합니다.
  terminology: ‘빛’과 ‘악한 일’은 요한복음의 대조적 비유와 φαῦλα의 윤리적 의미를 보존합니다. ‘자신의 행위’는 원문의 단수 소유 표현이 가리키는 각 개인의 행위를 자연스럽게 나타내며, 한국어에서 부자연스러운 남성 표지를 강제하지 않습니다. ‘드러나다’는 ἐλεγχθῇ의 문맥상 폭로 의미를 유지합니다.
  issues:
  - severity: medium
    issue: 목적절의 연결과 어순
    rationale: ‘그의 행위가 드러나지 않으려는 것입니다’는 행위 자체가 의도를 갖는 듯하게 읽힐 수 있으며, ἵνα μὴ가 ‘빛으로 나아오지 않음’의 목적을 나타낸다는 관계가 약해집니다.
  - severity: low
    issue: πράσσων의 지속적·특성적 뉘앙스
    rationale: ‘모든 악을 행하는 사람’도 가능하지만, ‘악한 일을 일삼는 사람’이 현재분사의 습관적 행위를 더 자연스럽고 분명하게 전달합니다.
  - severity: low
    issue: ‘빛으로 오다’의 자연스러움
    rationale: πρὸς τὸ φῶς의 방향성과 요한복음의 비유를 한국어에서 자연스럽게 살리려면 ‘빛으로 나아오다’가 더 적절합니다.
