id: JHN.3.20
reference: John 3:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
  footnotes:
  - marker: a
    text: Or 'be reproved' or 'be convicted'; the Greek verb can carry the sense of exposing wrongdoing, showing guilt, or bringing something to light.
    reason: lexical_alternative
  - marker: b
    text: Greek 'his works' uses a singular masculine form generically for any person who practices evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 악을 행하는 사람은 빛을 미워하여 빛으로 오지 않습니다. 그의 행위[b]가 드러나지 않으려는 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '책망을 받다'나 '정죄를 당하다'로 번역할 수 있습니다; 그리스어 동사 ἐλέγχω는 잘못을 드러내거나 유죄를 밝히거나 책망하는 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 일반적 진술을 위해 남성 단수 형태(ὁ ... αὐτοῦ)를 사용합니다. 본 번역은 POB의 대표성 원칙에 따라 '그의 행위'로 처리했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαῦλα
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 가치 없는 것들
  - 나쁜 것들
  - 천한 것들
  lexicon: BDAG
  rationale: φαῦλος는 요한서신에서 윤리적·도덕적 의미를 담아 '빛'과 대조됩니다. '악'은 그 강한 도덕적 반대와 문맥상 적절성을 유지합니다.
- source_word: μισεῖ
  english_pob_choice: hates
  chosen_korean: 미워하다
  alternatives_korean:
  - 혐오하다
  - 싫어하다
  lexicon: BDAG
  rationale: μισέω의 강한 의지적·도덕적 반대 의미를 살리기 위해 '미워하다'를 선택했습니다. 평이한 현대 한국어 어감으로도 원어의 감정을 전달합니다.
- source_word: ἐλεγχθῇ
  english_pob_choice: be exposed
  chosen_korean: 드러나다 (드러나지 않으려 함)
  alternatives_korean:
  - 책망받다
  - 정죄당하다
  - 유죄가 드러나다
  lexicon: BDAG
  rationale: ἐλέγχω는 드러내다·책망하다·정죄하다의 범위를 가집니다. '드러나다'는 '빛이 드러냄'의 비유적 맥락과 어울려 행위의 폭로·노출을 강조합니다.
- source_word: τὰ ἔργα αὐτοῦ
  english_pob_choice: his works
  chosen_korean: 그의 행위
  alternatives_korean:
  - 그의 일들
  - 그가 하는 것들
  - 그의 행적
  lexicon: BDAG
  rationale: 그리스어는 일반적 진술에 남성 단수 형태를 사용합니다. POB의 대표성 원칙을 따라 한국어에서도 3인칭 단수 소유대명사 '그의'를 반영했습니다.
theological_decisions:
- issue: Representative masculine pronoun in a generic statement
  chosen_reading: 그의 행위
  alternative_readings:
  - 그들의 행위
  - 그 행위
  rationale: 원문은 남성 단수 대표형(ὁ ... αὐτοῦ)을 사용합니다. POB의 성별-정확성 원칙에 따라 원문 형태를 반영하여 한국어에서도 단수 소유 표현을 유지합니다(문맥상 모든 사람을 가리킴).
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: Meaning of ἐλεγχθῇ in relation to the light
  chosen_reading: 드러나지 않으려 함 (be exposed)
  alternative_readings:
  - 책망받지 않으려 함
  - 정죄받지 않으려 함
  rationale: 빛이 행위를 '드러내는' 비유적 기능을 고려하여, 단순한 책망이나 법적 정죄보다 '폭로·노출'의 의미를 살렸습니다. 이는 요한의 '빛' 어휘망과 더 잘 연결됩니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
