id: JHN.3.2
reference: John 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
  footnotes:
  - marker: a
    text: Or “at night.” The phrase may also carry thematic resonance in John, where night/darkness can have symbolic force.
    reason: lexical_alternative
  - marker: b
    text: Or “these miraculous signs.” Greek σημεῖα is rendered “signs” in John to preserve their function as acts that point beyond themselves.
    reason: lexical_alternative
  - marker: c
    text: 'Greek: “unless God is with him,” retaining the third-person wording of Nicodemus’s statement.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 사람이 밤에[a] 예수께 와서 말하였습니다. “랍비, 우리는 당신이 하나님에게로부터 오신 선생님이심을 압니다. 사람이 당신이 행하시는 이러한 표적들을 아무도 행할 수 없습니다[b]; 만일 하나님이 그와 함께하지 아니하시면[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '밤중에'로 번역할 수 있습니다. 요한복음에서 밤/어둠은 상징적 의미를 지니는 경우가 있어 신학적 함의를 염두에 둘 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '이 기적들'로 번역할 수 있습니다. 그리스어 σημεῖα는 요한복음에서 예수를 가리키는 표지로서 신학적 기능을 갖습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 원문은 조건절에서 제3인칭(αὐτοῦ)을 유지합니다. 번역에서도 '그와'라는 제3인칭을 보존하여 원문 표현의 어법적 특징을 반영했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  english_pob_choice: This man
  chosen_korean: 이 사람
  alternatives_korean:
  - 그
  - 이 자
  lexicon: BDAG
  rationale: οὗτος는 바로 앞에서 소개된 니고데모를 가리키는 지시사입니다. 영어 POB가 'This man'을 택한 것처럼 한국어도 지시성을 보존하기 위해 더 일반적인 '이 사람'을 사용했습니다.
- source_word: νυκτός
  english_pob_choice: by night
  chosen_korean: 밤에
  alternatives_korean:
  - 밤중에
  - 야간에
  lexicon: BDAG
  rationale: 시간의 속격으로 쓰인 νυκτός는 관습적으로 '밤에/밤중에'로 옮깁니다. 존중과 문체상 과하게 문학적이지 않은 '밤에'를 선택하여 요한 복음의 어둠/밤의 상징성을 남겼습니다.
- source_word: Ῥαββί
  english_pob_choice: Rabbi
  chosen_korean: 랍비
  alternatives_korean:
  - 라삐
  - 선생님(교사)
  lexicon: BDAG
  rationale: 원문은 유대어 호칭을 음차로 보존합니다. 영어 POB와 일치하게 역사적·문화적 색채를 유지하기 위해 한국어 음차 '랍비'를 사용했습니다(의미는 문맥으로 충분히 드러납니다).
- source_word: ταῦτα τὰ σημεῖα
  english_pob_choice: these signs
  chosen_korean: 이러한 표적들(표적)
  alternatives_korean:
  - 이 기적들
  - 이 표징들
  lexicon: BDAG
  rationale: 요한복음에서 σημεῖα는 단순한 '기적'을 넘어 표지(sign)로 작용하므로 '표적'을 기본어로 삼았습니다. 괄호 안에 '표적'을 남겨 원어의 신학적 긴장을 알리도록 표시했습니다.
theological_decisions:
- issue: Shift from second person to third person in Nicodemus's statement (ἃ σὺ ποιεῖς ... ἐὰν μὴ ᾖ ὁ θεὸς μετ' αὐτοῦ)
  chosen_reading: 원문 질서를 존중하여 제3인칭 표현 '그와'를 유지함
  alternative_readings:
  - 본문의 '그와'를 '당신과'로 치환하여 직접화한다
  rationale: 그리스어는 친칭(σὺ)로 말하다가 조건절에서 제3인칭(αὐτοῦ)으로 전환합니다. 번역에서 이를 '당신'으로 평탄화하면 어법적·수사적 특징을 지우게 되므로 원문 텍스처 보존을 위해 '그와'를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
