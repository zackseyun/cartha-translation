id: JHN.3.26
reference: John 3:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
  footnotes:
  - marker: a
    text: Or “about whom you testified.” The Greek dative construction can be rendered either way in English.
    reason: lexical_alternative
  - marker: b
    text: Or “he is baptizing.” Greek οὗτος more explicitly says “this one,” which may convey the speakers’ pointed emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 요한에게 와서 말하였습니다[a], “랍비여, 네가 요단강 저편에서 함께 있었고 네가 증언하신 그 사람을 보십시오 — 그는 세례를 베풀고[b] 있고 모든 사람이 그에게로 가고 있습니다.”
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 “네가 증언한 사람에 대하여(about whom you testified). 헬라어의 관계대명사+여격(ᾧ) 구문은 ‘to whom’ 또는 ‘about whom’으로 해석될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그가 세례를 베풀고 있다.” οὗτος는 지시적 강조를 가진 대명사로, 영어판에서는 'this one'으로 옮겨져 화자의 지시·비난 어조를 드러낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαββί
  english_pob_choice: Rabbi
  chosen_korean: 랍비
  alternatives_korean:
  - 선생님
  - 랍비여
  lexicon: BDAG
  rationale: 원어의 호칭을 음역으로 살려 유대적 배경과 요한복음의 어조를 보존하기 위해 '랍비'를 선택했습니다. 문맥상 호명형 어미(여)를 문장 내 호소부호(보십시오)로 처리하여 현대 한국어 독자에게 자연스럽게 전달했습니다.
- source_word: οὗτος
  english_pob_choice: this one
  chosen_korean: 그는/그 사람은
  alternatives_korean:
  - 그
  - 이 사람은
  lexicon: BDAG
  rationale: οὗτος의 지시적·대조적 힘을 살리기 위해 단순한 '그'보다 '그는/그 사람은'의 형태로 강조를 유지했습니다.
- source_word: βαπτίζει
  english_pob_choice: is baptizing
  chosen_korean: 세례를 베풀고 있다
  alternatives_korean:
  - 세례를 주고 있다
  - 세례를 베풀고 있습니다
  lexicon: BDAG
  rationale: 현재진행의 지속적 활동을 나타내는 그리스어 현재를 한국어로 자연스럽게 옮기기 위해 '세례를 베풀고 있다'를 선택했습니다(공동번역/현대어 관행과도 조화).
- source_word: ᾧ σὺ μεμαρτύρηκας
  english_pob_choice: to whom you have borne witness
  chosen_korean: 네가 증언하신 그 사람(에게)
  alternatives_korean:
  - 당신이 증언하신 분(에게)
  - 네가 증언한 사람(에게)
  lexicon: BDAG
  rationale: μεμαρτύρηκας의 완결된 증언(과거-현재적 의미)을 한국어의 관형구 '증언하신'으로 반영했습니다. 그리스어의 여격 실격은 한국어에서 관형어+목적격(또는 여격 의미)로 처리했습니다.
theological_decisions:
- issue: Register of direct address to John (σὺ)
  chosen_reading: 화자들이 요한에게 친밀한 2인칭(반말, '네가')로 말하는 어조를 반영하되, 본문 전체는 현대 한국어 형식체를 유지
  alternative_readings:
  - 공식적 2인칭(당신)으로 바꾸어 전체를 정중하게 표현
  - 직역적 형식(너)으로 완전한 구어체화
  rationale: 원문은 2인칭 단수 σὺ로 요한을 직접 겨냥하므로, 인물 대화의 현실성을 살리기 위해 한국어 인칭대명사 '네가'의 어감(비공식성)을 반영하는 것이 저자의 의도를 더 잘 전달합니다. 다만 편집 방침에 따라 본문 전체는 형식적 문체를 유지하도록 인용문 내 다른 요소들은 존댓말 형태로 조정했습니다.
  doctrine_reference: 본문 번역 스타일 지침(직접화법 내 어조 보존 규정)
