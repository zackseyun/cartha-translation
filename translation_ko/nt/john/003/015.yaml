- from: 그를 믿는 모든 사람이[a] 그 안에서[b] 영생을 얻게 하려는 것입니다.
  to: 이는 그 안에서 믿는 모든 사람이[a][b][c] 영생을 얻게 하려는 것입니다.
  rationale: ἐν αὐτῷ를 πιστεύων과 직접 연결하여 원문의 문법적 관계를 회복했습니다. ‘그 안에서’라는 다소 표지적인 표현은 원문이 εἰς가 아니라 ἐν을 사용한다는 점을 보존합니다. SBLGNT의 대괄호 표시에 따라 생략 이문을 별도 각주로 밝혔으며, 영생이라는 핵심 용어와 ἵνα 목적절의 기능은 유지했습니다.
