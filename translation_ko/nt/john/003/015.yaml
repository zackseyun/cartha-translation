  text: ἵνα πᾶς ὁ πιστεύων ⸂ἐν αὐτῷ⸃ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
  footnotes:
  - marker: a
    text: Or "whoever believes."
    reason: lexical_alternative
  - marker: b
    text: Some translations render this phrase "into him," but the Greek here reads "in him" (ἐν αὐτῷ).
