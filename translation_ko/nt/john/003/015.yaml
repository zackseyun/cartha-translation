    reason: lexical_alternative
  - marker: c
    text: 일부 사본에는 ‘그 안에서’가 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ πιστεύων
  english_pob_choice: everyone who believes
  chosen_korean: 그를 믿는 모든 사람
  alternatives_korean:
  - 믿는 자마다
  - 누구든지 믿는 사람
  - 믿는 사람은
  lexicon: BDAG
  rationale: 그리스어 관사화된 현재 분사는 일반적·포괄적 대상(‘everyone/the one who believes’)을 나타냅니다. 한국어에서는 '모든 사람'이 현대적이고 포괄적 의미를 분명히 전달합니다.
- source_word: ἐν αὐτῷ
  english_pob_choice: in him
  chosen_korean: 그 안에서
  alternatives_korean:
  - 그에게
  - 그 안으로(그 속으로)
  lexicon: BDAG
  rationale: 원문은 ἐν(‘in’)을 사용하므로 방향적 'into'보다 내부적 위치를 나타내는 '그 안에서'가 원문을 충실히 반영합니다.
- source_word: ἵνα + ἔχῃ (subjunctive)
  english_pob_choice: may have
  chosen_korean: 얻게 하려는 것입니다
  alternatives_korean:
  - 얻도록 하려 함입니다
  - 얻을 수 있게 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα + 접속법의 목적·결과 의미를 한국어에서는 ‘...하게 하려는 것입니다/...하도록 하려 함입니다’로 자연스럽게 표현합니다. 여기서는 공적 서술에 맞게 평형 잡힌 표현을 선택했습니다.
- source_word: ζωὴν αἰώνιον
  english_pob_choice: eternal life
  chosen_korean: 영생
  alternatives_korean:
  - 영원한 생명
  - 영원한 삶
  lexicon: BDAG
  rationale: 요한 복음에서의 established term으로서 '영생'이 신학적·문체적으로 적절합니다. 간결하고 전통적 한국어 성경 어휘를 따릅니다.
theological_decisions:
- issue: Rendering the Johannine belief expression with ἐν αὐτῷ
  chosen_reading: 그 안에서
  alternative_readings:
  - 그에게
  - 그 안으로/그 속으로 (into him)
  rationale: 본문은 ἐν αὐτῷ를 쓰므로 번역문도 내부적 위치를 나타내는 표현을 유지해야 합니다. 전통적·신학적 편의상 εἰς 기반 번역('into him')을 도입하지 않고 원문 우선 원칙을 고수합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: Scope of πᾶς ὁ πιστεύων
  chosen_reading: 그를 믿는 모든 사람
  alternative_readings:
  - 누구든지 믿는 사람
  - 믿는 자마다
  rationale: 관사화된 현재 분사는 특정 개인이 아닌 일반적·포괄적 대상을 가리킵니다. '모든 사람'은 현대 한국어 독자에게 그 포괄성을 분명히 전달합니다.
  doctrine_reference: Translation philosophy §4
