id: JHN.3.5
reference: John 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
  footnotes:
  - marker: a
    text: Or 'water and spirit.' The Greek can be read with a lower-case 'spirit,' though 'Spirit' is likely here.
    reason: alternative_reading
  - marker: b
    text: '''Of water and Spirit'' has been understood in different ways, including as imagery of cleansing and renewal, as a reference to physical birth and spiritual birth, or as a reference to baptism. The translation preserves the Greek wording without deciding the interpretive question in the main text.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하셨습니다.[a] 「진실로 진실로 네게 말합니다. 사람이 물과 성령으로 나지 아니하면 하나님의 나라에 들어갈 수 없습니다.[b]」
  philosophy: formal
  footnotes:
  - marker: a
    text: 그리스어는 '물과 영(spirit)'으로 읽을 수도 있습니다; 'spirit'를 소문자로 읽을 여지가 있으나 문맥상 성령을 가리키는 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: 『물과 성령으로』라는 구절은 정결·회복의 상징, 육체적 출생과 영적 출생의 병치, 또는 세례를 가리키는 등 여러 해석이 존재합니다. 본문 번역은 그리스어 어구를 그대로 살려 해석적 결론을 본문에 강제하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하셨습니다
  alternatives_korean:
  - 응답하셨습니다
  - 대답하셨다
  lexicon: BDAG / LXX narrative convention
  rationale: 대화 문맥에서 ἀπεκρίθη는 ‘대답하다’로 자연스럽게 읽히며, 합쇼체 서술 어조에 맞춰 정중한 완료형을 사용했습니다.
- source_word: Ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로 진실로
  alternatives_korean:
  - 참으로 참으로
  - 아멘 아멘
  lexicon: BDAG
  rationale: 강조된 복수 아멘의 뜻을 현대 한국어로 전달하기 위해 '진실로 진실로'를 선택했습니다.
- source_word: ἐὰν μή τις
  english_pob_choice: unless someone
  chosen_korean: 사람이
  alternatives_korean:
  - 누구든지
  - 어떤 사람도
  lexicon: BDAG
  rationale: 원문이 지시대상 없이 불특정한 일반성을 나타내므로 '사람이'로 대표적·보통명사적 범주를 살려 번역했습니다.
- source_word: γεννηθῇ
  english_pob_choice: is born
  chosen_korean: 나지 아니하면
  alternatives_korean:
  - 태어나지 않으면
  - 거듭나지 않으면
  lexicon: BDAG
  rationale: γεννάω의 수동적 '태어나다/나다' 의미를 과도한 해석 없이 반어법적 부정형으로 '나지 아니하면'이라 번역했습니다.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  english_pob_choice: of water and Spirit
  chosen_korean: 물과 성령으로
  alternatives_korean:
  - 물과 영으로
  - 물과 (성)령으로
  lexicon: BDAG / Johannine theology
  rationale: 요한서 신학과 본문의 문맥상 'πνεῦμα'가 성령을 가리키는 가능성이 높아 '성령'을 기본 선택으로 삼되, 해석적 여지를 각주로 보존합니다.
theological_decisions:
- issue: Meaning of πνεύματος in ἐξ ὕδατος καὶ πνεύματος
  chosen_reading: 성령(Holy Spirit)로 읽음
  alternative_readings:
  - 소문자 '영/spirit'로 읽어 일반적 영적 원리로 해석
  - 물은 육체적 출생, 영은 영적 출생으로 쌍대적 해석
  rationale: '요한복음의 용례와 구약의 정결·회복 모티프(예: 겔 36장)와의 연관으로 볼 때 ''성령'' 해석이 문맥상 자연스럽지만, 그리스어가 관사를 결여하고 해석학적 논쟁이 있어 본문에서는 결론을 강요하지 않고 각주로 긴장을 보존합니다.'
  doctrine_reference: 본문의 신학적 긴장을 보존함(당파적 교리 채택을 피함)
- issue: Register inside direct speech ('I say to you')
  chosen_reading: 예수의 직설적 2인칭 호칭을 반말 계열로 반영(네게 말합니다)
  alternative_readings:
  - 전체를 합쇼체로 유지(당신에게 말합니다)
  - 고전적 문어체로 번역(이르노니)
  rationale: 개발자 지침에 따라 인용된 신적·예언적 발언 안에서는 청자(니고데모스)에게 직접 말하는 친밀성이 반영될 수 있으므로 원문의 대인관계를 드러내는 번역을 선택했습니다; 이 문체 전환은 주석으로 문체 선택을 기록합니다.
  doctrine_reference: 문체 선택은 신학적 해석을 담지 않으며, 독자의 이해를 돕기 위한 전달적 결정임
