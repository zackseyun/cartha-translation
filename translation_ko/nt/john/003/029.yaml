id: JHN.3.29
reference: John 3:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
  footnotes:
  - marker: a
    text: Or 'the bridegroom’s friend'; culturally, this role may resemble a 'best man,' but the Greek expression is literally 'friend of the bridegroom.'
    reason: cultural_note
  - marker: b
    text: Or 'rejoices with joy'—a more literal rendering of the emphatic Greek expression.
    reason: lexical_alternative
  - marker: c
    text: Or 'has been fulfilled.' The Greek can denote being brought to fullness or completion.
    reason: lexical_alternative
translation:
  language: ko
  text: 신부를 가진 이는 신랑입니다[a]. 그러나 신랑의 친구인 이는 서서 그를 듣고 신랑의 목소리 때문에 크게 기뻐합니다[c][b]. 그러므로 이 나의 기쁨이 충만해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '신랑의 친구' — 문화적으로는 '베스트맨'과 유사한 역할을 생각할 수 있으나, 그리스어 표현은 문자적으로 '신랑의 친구'입니다.
    reason: cultural_note
  - marker: b
    text: 또는 '기쁨으로 기뻐합니다' — 그리스어의 동격적 조합(여격 명사 + 동사)을 더 문자적으로 옮긴 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '충만하게 되었습니다/성취되었습니다' — πεπλήρωται는 충만·완성의 도달을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  english_pob_choice: The one who has
  chosen_korean: 신부를 가진 이는
  alternatives_korean:
  - 신부를 가진 사람은
  - 신부를 가진 자는
  lexicon: BDAG
  rationale: 아티쿨라된 현재 분사(substantival)로 일반적 단수 대상을 가리킵니다. 한국어에서는 '...를 가진 이는'가 원문의 범용적·간결한 의미를 보존하면서 문체에 맞습니다.
- source_word: νύμφην / νυμφίος
  english_pob_choice: the bride / the bridegroom
  chosen_korean: 신부 / 신랑
  alternatives_korean:
  - 아내 / 신랑
  - 혼례의 신부 / 혼례의 신랑
  lexicon: BDAG
  rationale: 결혼 비유를 그대로 살리기 위해 일상적이고 신뢰되는 한국어 성경어휘 '신부'와 '신랑'을 사용했습니다. '아내'는 결혼관계의 일차적 결과를 암시해 비유적 긴장감을 약화시킬 수 있습니다.
- source_word: φίλος τοῦ νυμφίου
  english_pob_choice: the friend of the bridegroom
  chosen_korean: 신랑의 친구
  alternatives_korean:
  - 신랑의 벗
  - 신랑 들러리(들러리 대표)
  lexicon: BDAG
  rationale: '그리스어는 문자적으로 ''신랑의 친구''라고 말합니다. 문화적 유사성(예: ''best man'')은 주석으로 남기고 본문은 투명하게 번역했습니다.'
- source_word: πεπλήρωται
  english_pob_choice: has been made complete
  chosen_korean: 충만해졌습니다
  alternatives_korean:
  - 충만하게 되었습니다
  - 성취되었습니다
  lexicon: BDAG
  rationale: 완료 수동의 결과적·현상태적 의미를 반영하여 '충만해졌다'로 번역했습니다. '성취되었다'는 가능하지만 '충만'이 기쁨의 충만감을 더 잘 전달합니다.
theological_decisions:
- issue: Wedding metaphor and identity of the bride / role of 'friend of the bridegroom'
  chosen_reading: '본문의 결혼 비유(신랑·신부·신랑의 친구)를 그대로 살려 번역하고, 신부의 정체(하나님의 백성/교회 등)나 친구의 정확한 의무(예: ''best man'')는 본문에 삽입하지 않습니다.'
  alternative_readings:
  - '''신랑의 친구''를 ''들러리(또는 들러리 대표/베스트맨)''로 구체화하여 문화적 역할을 본문에 반영'
  - '''신부''를 명시적으로 ''하나님의 백성''이나 ''교회''로 해석하여 독자가 신학적 결론을 바로 알게 함'
  rationale: 본문이 메타포적 언어를 사용하지만 그 자체로 신부의 정체를 규정하지 않습니다. 번역은 원문이 전달하는 긴장과 가능성을 보존하여 독자가 해석적 결정을 내리도록 남깁니다.
  doctrine_reference: 원문 충실성 유지 — 신학적 결론은 주석에서 다룸
