id: JHN.3.19
reference: John 3:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
  footnotes:
  - marker: a
    text: Or 'people'; Greek 'men' here refers to humanity generally, not males only.
    reason: lexical_alternative
translation:
  language: ko
  text: '이것이 바로 판단입니다: 빛이 세상에 들어왔음에도 사람들[a]은 빛보다 어둠을 더 사랑했습니다. 이는 그들의 행위가 악했기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사람들'; 헬라어의 'ἄνθρωποι'는 여기서 남성만을 가리키는 것이 아니라 일반적으로 인류 전체를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  english_pob_choice: judgment
  chosen_korean: 판단
  alternatives_korean:
  - 심판
  - 결정
  lexicon: BDAG
  rationale: κρίσις의 범위를 좁히지 않고 원문이 전달하는 결정적 평가라는 뜻을 살리기 위해 '판단'을 선택했습니다. '심판'은 다소 종말론적·처벌적 뉘앙스가 강해 원문의 폭넓은 의미를 제한할 위험이 있습니다.
- source_word: τὸ φῶς / ἐλήλυθεν
  english_pob_choice: the light / has come
  chosen_korean: 빛이 ... 들어왔음
  alternatives_korean:
  - 빛이 왔다
  - 빛이 임하였다
  lexicon: BDAG
  rationale: 요한서신의 메타포인 '빛'(τὸ φῶς)을 그대로 살려 '빛'으로 번역하고, 완료성(ἐλήλυθεν)을 '들어왔음'으로 처리하여 빛의 도래가 현재에도 유효함을 드러냈습니다.
- source_word: οἱ ἄνθρωποι
  english_pob_choice: people
  chosen_korean: 사람들
  alternatives_korean:
  - 남자들
  - 인간
  lexicon: BDAG
  rationale: 프로젝트의 최근 수정(영문판)을 반영하여 문맥상 포괄적 인류를 가리키는 의미를 살리기 위해 '사람들'로 번역했습니다(원문의 문법적 남성형은 대표적·일반적 용법일 수 있음).
- source_word: πονηρὰ τὰ ἔργα
  english_pob_choice: their works were evil
  chosen_korean: 그들의 행위가 악했음
  alternatives_korean:
  - 그들의 행위가 사악했다
  - 그들의 행동이 악했다
  lexicon: BDAG
  rationale: τὰ ἔργα를 '행위'로, πονηρά를 '악'으로 처리하여 요한서의 도덕적·윤리적 판단을 간결하게 전달했습니다; '악했다'는 현대 한국어에서 자연스럽고 원문의 강도를 보존합니다.
theological_decisions:
- issue: Referent of 'the light'
  chosen_reading: 비유적 '빛'을 본문 그대로 유지
  alternative_readings:
  - '''빛''을 명시적으로 메시아/예수로 표기'
  - '''빛''을 주석적 설명으로 확장'
  rationale: 본문은 메타포로 빛을 사용하고 있으므로 번역에서도 메타포를 유지해 요한의 신학적 어조를 보존합니다; 본문 안에서 문맥상 예수와 연결되지만 직접 치환하면 본문 자체의 표현을 과도하게 설명하게 됩니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: Generic force of οἱ ἄνθρωποι
  chosen_reading: '''사람들''로 포괄적 인류를 전달'
  alternative_readings:
  - 문법적 남성을 반영해 '남자들'으로 번역
  - '''인간'' 또는 ''사람'' 등 다른 포괄어 사용'
  rationale: 영문판 최근 수정이 'people'으로 바뀐 사실과 문맥의 포괄성을 반영하여 '사람들'을 선택했습니다. 원문은 남성형을 쓰지만 여기서는 인류 전체를 가리키는 뜻으로 독자가 이해하도록 처리했습니다.
  doctrine_reference: Translation philosophy §4
