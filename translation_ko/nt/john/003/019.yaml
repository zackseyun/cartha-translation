  to: 심판은 이것입니다. 빛이 세상에 왔는데, 사람들은 빛보다 어둠을 더 사랑했습니다. 그들의 행위가 악했기 때문입니다.
  rationale: The revision removes the added concessive implication, uses '심판' for κρίσις in keeping with the verse's Johannine context, and deletes the redundant footnote. It retains the source's metaphors, comparative preference, inclusive reference to humanity, and causal explanation without interpretive expansion.
