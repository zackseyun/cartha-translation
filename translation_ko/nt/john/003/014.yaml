id: JHN.3.14
reference: John 3:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
  footnotes:
  - marker: a
    text: Or 'be exalted.' The Greek verb can refer both to being physically lifted up and to being exalted; John likely intends both senses here.
    reason: lexical_alternative
  - marker: b
    text: See Numbers 21:8–9 for the account of Moses lifting up the serpent in the wilderness.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 모세가 광야에서 뱀을 들어 올린 것처럼[a], 인자도 들어 올려져야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 민수기 21:8–9에 모세가 광야에서 뱀을 장대에 걸어 올린 이야기가 있습니다.
    reason: cross_reference
  - marker: b
    text: ‘들어 올려지다’에 해당하는 그리스어 동사는 물리적으로 들어 올려지는 것과 높임을 받는 것을 모두 가리킬 수 있습니다. 요한은 이 두 의미를 함께 의도했을 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  english_pob_choice: just as
  chosen_korean: …처럼
  alternatives_korean:
  - …같이
  - …와 같이
  lexicon: BDAG
  rationale: 비교(유비)를 분명히 드러내는 한국어 관용표현으로, 원문의 'just as' 대비 관계를 자연스럽게 전달합니다.
- source_word: ὕψωσεν
  english_pob_choice: lifted up
  chosen_korean: 들어 올렸다
  alternatives_korean:
  - 들어 올리셨다
  - 높이 들었다
  - 존귀하게 하셨다
  lexicon: BDAG
  rationale: 민수기 본문에서는 물리적 고정(장대에 걸어 들은) 동작을 가리키므로 한국어로도 구체적 '들어 올렸다'를 선택해 물리적 행위를 보존합니다.
- source_word: ὑψωθῆναι δεῖ
  english_pob_choice: must be lifted up
  chosen_korean: 들어 올려져야 합니다
  alternatives_korean:
  - 들어 올려져야 한다
  - 들려야 합니다
  - 들려져야 합니다
  lexicon: BDAG
  rationale: 수동적 필연성을 드러내는 구문으로, '들어 올려지다'가 물리적 상승과 '높임/영광'의 이중 의미를 한국어에서 유지하기에 적합합니다.
- source_word: υἱὸν τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인간(인자)
  lexicon: BDAG; Danielic usage
  rationale: 요한복음에서 예수가 자주 쓰는 이 호칭의 전통적·신학적 무게를 보존하기 위해 한국어 '인자'를 사용했습니다.
theological_decisions:
- issue: Johannine double meaning of ὑψόω
  chosen_reading: 한국어 본문은 '들어 올려지다' 표현을 사용하여 물리적 고정과 함께 높임(영광·승천)의 의미를 동시에 열어둡니다.
  alternative_readings:
  - 물리적 십자가 죽음(거꾸로 들리는 행위)만 강조하여 '못에 달리다' 등으로 번역
  - 영광적 승천·존귀를 강조하여 '존귀하게 되다'로 번역
  rationale: 원문이 의도한 전형적(typological) 연관성과 신학적 긴장을 보존하려면 이중 의미를 해소하지 않고 남겨두는 것이 바람직합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
