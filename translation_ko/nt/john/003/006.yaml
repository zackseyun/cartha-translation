id: JHN.3.6
reference: John 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
  footnotes:
  - marker: a
    text: Or, 'What is born of the flesh is human nature'; the Greek word 'flesh' can, in some contexts, carry the sense of fallen or sinful human nature, but here the contrast is primarily with birth from the Spirit.
    reason: lexical_alternative
  - marker: b
    text: Or, 'what is born of the Spirit is spiritual.' The Greek reads 'is spirit,' preserving a qualitative contrast with 'flesh.'
    reason: lexical_alternative
translation:
  language: ko
  text: 육으로 난 것은 육[a]입니다. 성령으로 난 것은 영[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘육으로 난 것은 인간의 본성이다’라고 할 수 있습니다. σάρξ는 어떤 문맥에서는 타락한 또는 죄된 인간 본성을 가리킬 수 있으나, 여기서는 주로 성령으로 난 것과의 대비를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영적이다’라고 번역할 수 있습니다. 그리스어는 ‘영이다’라고 하여 ‘육’과의 대조를 보존합니다. ‘영적이다’는 그 대조의 성격을 드러내는 해석적 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  english_pob_choice: what is born
  chosen_korean: 난 것
  alternatives_korean:
  - 태어난 것
  - 난 자
  lexicon: BDAG
  rationale: 중성 단수의 완료수동분사는 일반적·범주적 대상을 가리키므로 ‘난 것’으로 처리해 한국어의 자연스러운 범주적 표현을 유지합니다.
- source_word: ἐκ
  english_pob_choice: of / from
  chosen_korean: 으로/에서(출처)
  alternatives_korean:
  - 에서
  - 에게서
  lexicon: BDAG
  rationale: 출신·기원을 나타내는 문맥이므로 한국어 관용표현 ‘~으로(~에서)’를 사용했습니다. 본문에서는 짧고 일반적인 '육으로/성령으로' 형태를 선택했습니다.
- source_word: σάρξ / σαρκὸς
  english_pob_choice: flesh
  chosen_korean: 육
  alternatives_korean:
  - 육체
  - 인간의 본성
  - 죄된 본성
  lexicon: BDAG
  rationale: 요한복음의 대비(자연적 출생 vs. 영으로 난 것)를 보존하기 위해 도덕적·도식적 해석('죄된 본성')을 도입하지 않고 문자적·범주적 어휘 '육'을 유지했습니다.
- source_word: πνεύματος / πνεῦμά
  english_pob_choice: Spirit / spirit
  chosen_korean: 성령 (출처), 영 (서술어)
  alternatives_korean:
  - 성령 / 영
  - 바람 / 영적
  lexicon: BDAG
  rationale: 원문에서 소유격(τοῦ πνεύματος)은 성령을 가리키므로 '성령'으로 처리했고, 서술적 목적어(πνεῦμά)는 관사가 없어 질적 의미를 주므로 결과 성격을 나타내는 '영'으로 구별하여 번역했습니다.
theological_decisions:
- issue: σάρξ의 의미 범주
  chosen_reading: 자연적·인간적 영역(육)으로서의 σάρξ
  alternative_readings:
  - 죄된 본성(도덕적·윤리적 의미)
  rationale: σάρξ는 문맥에 따라 윤리적 함의를 가질 수 있으나, 본 절은 출생의 원천(육 vs 성령)이라는 대비에 초점을 두므로 '육'으로 번역하여 독자가 과도한 도덕론으로 치우치지 않게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for σάρξ; Translation philosophy #3'
- issue: 서술적 πνεῦμα의 지시
  chosen_reading: 서술어는 질적·결과적 의미로 읽어 '영'으로 표기(소문자적 성격)
  alternative_readings:
  - 서술어도 '성령'으로 읽기
  - '''영적이다'' 혹은 ''영(적)이다''로 의역'
  rationale: 그리스어 원문이 서술적 명사(무관사)를 사용하여 질적 대비를 나타내므로, 원문의 구조를 존중하여 출처인 성령(성령으로 난 것)과 결과적 성격(영)은 구별해 표기했습니다. '영적이다'는 해석적 의역으로 과도한 주석을 내포합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #3'
