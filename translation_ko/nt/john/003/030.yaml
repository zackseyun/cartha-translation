translation:
  language: ko
  text: 그분은 더 커지셔야 하고, 나는 더 작아져야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνον
  english_pob_choice: He
  chosen_korean: 그
  alternatives_korean:
  - 그분
  - 저 사람
  - 그 사람
  lexicon: BDAG
  rationale: 그리스어의 목적격 지시대명사가 무한사의 논리적 주어로 기능하므로 한국어에서도 주격 실현이 필요합니다. '그'는 현대 한국어에서 중립적이고 자연스러운 삼인칭 대명사입니다. '그분'은 존칭적 뉘앙스를 더하므로 본문 맥락(요한의 겸손한 말)에서는 불필요한 미화가 될 수 있습니다.
- source_word: δεῖ
  english_pob_choice: must
  chosen_korean: 해야 합니다
  alternatives_korean:
  - 필요합니다
  - 마땅합니다
  - 꼭 그래야 합니다
  lexicon: BDAG
  rationale: δεῖ는 의무·필연의 의미를 담습니다. 한국어에서 의무성을 자연스럽게 전달하는 어법으로 공손한 합쇼체 '해야 합니다'를 선택하여 신학적 무게를 보존하되 구체적 메커니즘을 삽입하지 않습니다.
- source_word: αὐξάνειν
  english_pob_choice: increase
  chosen_korean: 커지다
  alternatives_korean:
  - 더 커지다
  - 자라다
  - 증대되다
  lexicon: BDAG
  rationale: 현재 부정사의 계속적·과정적 의미를 반영해 '커지다'를 선택했습니다. '더 커지다'는 중복적일 수 있고 '자라다'는 생장적 뉘앙스가 강해 맥락상 '커지다'가 예수의 위상·영향력의 증가를 넓게 전달합니다.
- source_word: ἐλαττοῦσθαι
  english_pob_choice: decrease
  chosen_korean: 작아지다
  alternatives_korean:
  - 줄어들다
  - 작아지다(스스로)
  - 쇠하다
  lexicon: BDAG
  rationale: 중간·수동적 의미의 '되어 가다/작아지다'를 반영하여 '작아지다'를 선택했습니다. '줄어들다'도 가능하나 '커지다'와의 평행성을 위해 형태·어감상 '작아지다'가 적절합니다.
theological_decisions:
- issue: Nature of the necessity expressed by δεῖ
  chosen_reading: '구속사적·역사적 질서에서의 필연성(예: 예수의 위상 증대와 요한의 감소가 마땅한 역사적·신학적 배치)으로 읽되, 구절이 이를 세부적 신정론(신의 직접적 명령 등)으로 규정하지는 않음.'
  alternative_readings:
  - 단순한 실용적 필요성(현실적·상황적 이유)
  - 명시적·직접적 신적 명령(하나님의 명령으로서의 δεῖ)
  rationale: δεῖ는 종종 신적·도덕적 필연을 내포하지만 본문은 메커니즘을 명시하지 않습니다. 한국어 '해야 합니다'는 이 필연성을 전달하되, 본문이 추가 교리적 결론을 내리지 않도록 여지를 남깁니다.
  doctrine_reference: '해석학적 긴장 보존: 본문 자체의 신학적 중량을 전달하되 더 넓은 교리적 결론은 부과하지 않음.'
