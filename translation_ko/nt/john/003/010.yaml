id: JHN.3.10
reference: John 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
  footnotes:
  - marker: a
    text: Or 'a teacher of Israel.' The Greek has 'the teacher,' which likely gives the address a pointed, rhetorical force.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하여 그에게 말씀하셨다. 「당신은 이스라엘의 선생[a]이신데, 이런 것들을 알지 못하십니까?」
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 '이스라엘의 한 선생'으로 번역할 수 있다. 헬라어의 정관사(ὁ)는 여기서 청자 지칭에 수사적 강조를 부여하는 것으로 보인다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 ... 말씀하셨다
  alternatives_korean:
  - 대답하고 말하였다
  - 응답하여 말하였다
  lexicon: BDAG / common Greek narrational formula
  rationale: 그리스어의 두 동사(ἀπεκρίθη καὶ εἶπεν)는 응답의 공식적인 서술을 이룬다. 한국어에서는 '대답하여 ... 말씀하셨다'로 두 동사를 보존하면서 예수의 말하기 행위를 공경의 어조로 처리(예수께서)하여 원문의 문체와 존칭을 반영했다.
- source_word: Σὺ
  english_pob_choice: You
  chosen_korean: 당신
  alternatives_korean:
  - 너
  - 네가
  lexicon: BDAG
  rationale: 그리스어의 명시적 인칭대명사 Σὺ는 강조를 지닌다. 한국어에서 강조를 유지하되 본 프로젝트의 표준 형식(현대 공손체)을 따르기 위해 반말 '너' 대신 정중한 2인칭 '당신'을 택했고, 인칭 강조는 문장 위치와 어순으로 드러나게 했다.
- source_word: ὁ διδάσκαλος τοῦ Ἰσραήλ
  english_pob_choice: the teacher of Israel
  chosen_korean: 이스라엘의 선생
  alternatives_korean:
  - 이스라엘의 한 선생
  - 이스라엘의 스승
  - 이스라엘의 교사
  lexicon: BDAG
  rationale: '정관사 ὁ가 있는 원문은 니고데모를 단순한 ''어떤 교사''가 아니라 ''이스라엘의 인정된(주된) 교사''로 지목하는 수사적 힘을 가진다. 한국어에서는 ''이스라엘의 선생''으로 정관사의 단정성을 살리되 과도한 미화(예: ''선생님'')는 피했다.'
- source_word: ταῦτα ... γινώσκεις
  english_pob_choice: these things ... know
  chosen_korean: 이런 것들을 ... 알지 못하십니까
  alternatives_korean:
  - 이것들을 ... 이해하지 못하십니까
  - 이 일들을 ... 아시지 못하십니까
  lexicon: BDAG
  rationale: γινώσκω는 문맥상 단순한 '앎'을 넘어 이해·파악의 의미를 포함하나, 한국어 '알다'가 그 범위를 포괄하므로 '알지 못하십니까'로 번역했다. 부정 질문의 수사적 비난 어조는 '-지 못하십니까?'로 살렸다.
theological_decisions:
- issue: 정관사(ὁ)로 표시된 'the teacher of Israel'의 힘
  chosen_reading: 원문 정관사의 단정을 살려 '이스라엘의 선생'으로 번역
  alternative_readings:
  - '''이스라엘의 한 선생'' (부정관사적 읽기)'
  - '''당신은 스승인데...'' 등 완곡화'
  rationale: 정관사는 니고데모를 공동체 내에서 인정된 교사로 지목하며, 예수의 말투에는 훈계·수사적 비판이 들어 있다. 이것을 그대로 전달하기 위해 정관사의 단정을 살리는 번역을 택했다. '한 선생'으로 완화하면 원문의 반어적·비판적 강도가 약해진다.
  doctrine_reference: 번역 원칙 (일관성·원문력 보존)
