id: JHN.3.31
reference: John 3:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
  footnotes:
  - marker: a
    text: Or 'from heaven' for 'from above' in the first clause; the Greek ἄνωθεν denotes origin from above and is clarified by the later phrase 'from heaven.'
    reason: lexical_alternative
  - marker: b
    text: Or 'speaks of the earth.' The Greek more literally repeats 'from the earth,' which may indicate source, sphere, or subject matter.
    reason: lexical_alternative
translation:
  language: ko
  text: 위에서 오시는 이는 만물 위에 계십니다.[a] 땅에서 난 이는 땅에서 났고, 땅에서 말합니다.[b] 하늘에서 오시는 이는 만물 위에 계십니다.
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 첫 절의 '위에서'를 '하늘에서'로 옮길 수 있습니다; 그리스어 ἄνωθεν은 위로부터의 기원을 뜻하며, 뒤의 '하늘에서'가 의미를 분명히 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '땅에 관해 말합니다.' 그리스어는 반복적으로 '땅에서'를 사용해 출처·영역·주제를 가리킬 수 있으므로, 직역을 통해 여지를 남깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  english_pob_choice: from above
  chosen_korean: 위에서
  alternatives_korean:
  - 하늘에서
  - 다시
  lexicon: BDAG
  rationale: ἄνωθεν은 여기서 기원의 수직적 방향을 나타내며, 영어판과 마찬가지로 '위에서'로 옮겨 요한복음의 대조(땅/하늘)를 보존합니다. 동시에 이후의 '하늘에서'가 의미를 분명히 합니다.
- source_word: ἐρχόμενος
  english_pob_choice: who comes
  chosen_korean: 오시는 이는
  alternatives_korean:
  - 오는 이
  - 오는 자
  lexicon: BDAG
  rationale: 현재 분사가 관형적·명사적으로 기능하므로 '오시는 이는'로 번역해 진행적·기술적 어감을 살립니다.
- source_word: ἐπάνω πάντων
  english_pob_choice: above all
  chosen_korean: 만물 위에 계십니다
  alternatives_korean:
  - 모든 것 위에
  - 모든 사람 위에
  lexicon: BDAG
  rationale: 공존하는 공간적·위계적 의미를 살려 '만물 위에 계신다'로 번역하여 우월성을 드러냅니다.
- source_word: ἐκ τῆς γῆς λαλεῖ
  english_pob_choice: speaks from the earth
  chosen_korean: 땅에서 말합니다
  alternatives_korean:
  - 땅을 말합니다
  - 땅에 관해 말합니다
  lexicon: BDAG
  rationale: 그리스어의 반복적 'ἐκ τῆς γῆς'를 보존하면서, 언어적 출처·영역을 열어둔 채 직역적 표현으로 두었습니다—발화의 '출처' 또는 '주제' 둘 다 가능하기 때문입니다.
theological_decisions:
- issue: Relationship between 'from above' (ἄνωθεν) and 'from heaven' (ἐκ τοῦ οὐρανοῦ)
  chosen_reading: ἄνωθεν은 '위에서'로, ἐκ τοῦ οὐρανοῦ는 '하늘에서'로 구별하여 번역합니다.
  alternative_readings:
  - 두 표현을 모두 '하늘에서'로 일치시켜 번역
  rationale: 원문은 관련하지만 서로 다른 어구를 사용합니다. 첫 용어를 '위에서'로 남겨 요한의 어조를 유지하고, 두 번째 절이 의미를 명확히 하도록 둡니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: Force of the repeated earthly language
  chosen_reading: '''땅에서 난… 땅에서… 땅에서''의 반복을 보존합니다.'
  alternative_readings:
  - 반복을 압축해 '그는 땅적이며 땅적 방식으로 말한다' 등으로 다듬음
  rationale: 그리스어의 반복은 수사적 대조를 형성하므로 이를 살려 번역해야 본문의 긴장과 대비가 유지됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
