id: JHN.8.17
reference: John 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
  footnotes:
  - marker: a
    text: Or 'the testimony of two people is true.' The Greek says 'two men,' a conventional legal expression for human witnesses.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 너희 율법에도 두 사람의 증언은 참되다고 기록되어 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 사람의 증언은 참입니다.’ 헬라어의 ‘두 사람’은 이 법적 문맥에서 인간 증인을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νόμῳ ... τῷ ὑμετέρῳ
  english_pob_choice: in your law
  chosen_korean: 너희 율법에도
  alternatives_korean:
  - 너희 법에도
  - 너희 율법 안에도
  lexicon: BDAG
  rationale: νόμος는 여기서 예수께서 상대방이 내세우는 유대인의 규범적 권위를 가리키므로 ‘율법’이 적절합니다. ὑμετέρῳ는 예수의 대조적 수사를 살려 ‘너희’로 옮겼습니다.
- source_word: γέγραπται
  english_pob_choice: it is written
  chosen_korean: 기록되어 있기를
  alternatives_korean:
  - 기록되어 있습니다
  - 기록되어 있음을
  lexicon: BDAG
  rationale: 완료수동형의 성구 인용 공식을 한국어에서 자연스럽게 살리기 위해 ‘기록되어 있기를’로 옮겨, 뒤따르는 인용 내용을 도입하는 기능을 드러냈습니다.
- source_word: δύο ἀνθρώπων
  english_pob_choice: two men
  chosen_korean: 두 사람의
  alternatives_korean:
  - 두 사람의 증언
  - 두 남자의
  lexicon: BDAG
  rationale: ἀνθρώπων은 문자적으로 ‘사람들/인간들’이므로, 성별을 과도하게 좁히지 않으면서 법정 격언의 일반적 인간 증언이라는 뜻을 드러내기 위해 ‘두 사람’으로 옮겼습니다.
- source_word: μαρτυρία
  english_pob_choice: testimony
  chosen_korean: 증언
  alternatives_korean:
  - 증거
  - 증언함
  lexicon: BDAG
  rationale: 법정 문맥에서 μαρτυρία는 ‘증언’이 가장 자연스럽고 정확합니다. 한국어에서도 사람의 법적 진술을 가리키는 표현으로 바로 전달됩니다.
- source_word: ἀληθής
  english_pob_choice: 'true'
  chosen_korean: 참
  alternatives_korean:
  - 진실한
  - 옳은
  lexicon: BDAG
  rationale: ἀληθής는 법적 유효성까지 내포할 수 있지만, 본문 수준에서는 ‘참’이 가장 간결하고 자연스럽게 그 의미를 보존합니다.
theological_decisions:
- issue: 예수의 ‘너희 율법’이라는 거리두기 수사
  chosen_reading: 상대방의 권위를 인정하는 듯한 직접 호칭을 유지해 ‘너희 율법’으로 옮겼습니다.
  alternative_readings:
  - 율법
  - 너희 자신의 율법
  rationale: 헬라어의 ὑμετέρῳ를 약화시키지 않고, 예수께서 논증의 출발점을 청중이 인정하는 권위로 삼는 긴장을 그대로 보여 주기 위함입니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 두 사람/두 사람의 증언의 일반 법정 격언성
  chosen_reading: main text는 ‘두 사람의 증언’으로 옮기고, 남성형의 법정 관용구라는 점은 주석으로만 처리하지 않았습니다.
  alternative_readings:
  - 두 남자의 증언
  - 두 사람의 증언은 참입니다
  rationale: 원문의 남성형을 과도하게 성별 특정적으로 밀어붙이지 않으면서도, 법정 증인의 일반 규범이라는 기능을 보존하기 위한 선택입니다.
  doctrine_reference: Translation philosophy §4
