    rationale: ζητεῖτε는 단순히 미래에 죽일 계획이라기보다 현재 죽이려 추구하고 있음을 뜻합니다. ‘죽이려 하고 있습니다’가 지속성과 의도성을 더 잘 드러냅니다.
  revised_text: 그러나 이제 너희는 하나님께로부터 들은 진리를 너희에게 말한 사람인 나를 죽이려 하고 있습니다. 아브라함은 이런 일을 하지 않았습니다.
