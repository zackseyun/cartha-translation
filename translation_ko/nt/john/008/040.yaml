revisions:
- from: 그러나 이제 너희는 나를 죽이려고 합니다. 나는 하나님에게서 들은 진리를 너희에게 말한 사람입니다. 아브라함은 이런 일을 하지 않았습니다.
  to: 그러나 이제 너희는 하나님께로부터 들은 진리를 너희에게 말한 사람인 나를 죽이려 하고 있습니다. 아브라함은 이런 일을 하지 않았습니다.
  rationale: 관계절을 ‘사람인 나를’에 결속하여 원문의 목적어 구조와 ἄνθρωπον의 자기지칭을 보존했습니다. 또한 ‘죽이려 하고 있습니다’로 ζητεῖτε의 현재적이고 지속적인 추구를 반영했습니다. ‘하나님께로부터’는 παρά + 속격의 출처 의미를 자연스러운 격식체 한국어로 표현하며, ‘아브라함은 이런 일을 하지 않았습니다’는 τοῦτο의 지시성을 과도하게 해석하지 않고 유지합니다.
