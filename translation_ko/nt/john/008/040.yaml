id: JHN.8.40
reference: John 8:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: ko
  text: 그러나 이제 너희는 나를 죽이려고 합니다. 나는 하나님에게서 들은 진리를 너희에게 말한 사람입니다. 아브라함은 이런 일을 하지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 이제는 그러나
  - 하지만 지금
  lexicon: BDAG
  rationale: δὲ의 대조와 νῦν의 시간 대비를 자연스러운 한국어로 살려, 앞뒤 정황의 반전을 분명히 드러냈습니다.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  english_pob_choice: you are seeking to kill me
  chosen_korean: 나를 죽이려고 합니다
  alternatives_korean:
  - 나를 죽이려 하고 있습니다
  - 나를 죽이려 찾고 있습니다
  lexicon: BDAG
  rationale: ζητεῖν + 부정사의 의도적 추구를 한국어의 '-려고 하다'로 옮겨 현재적 진행성과 목적성을 함께 살렸습니다.
- source_word: ἄνθρωπον
  english_pob_choice: a man
  chosen_korean: 사람입니다
  alternatives_korean:
  - 한 남자입니다
  - 인간입니다
  lexicon: BDAG
  rationale: 예수께서 자신을 가리켜 ἄνθρωπον이라 한 점을 살리되, 한국어에서는 문맥상 자연스러운 '사람'이 가장 직접적입니다. '인간'은 다소 추상적이고, '남자'는 성별을 지나치게 전면화할 수 있습니다.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  english_pob_choice: that I heard from God
  chosen_korean: 하나님에게서 들은
  alternatives_korean:
  - 하나님으로부터 들은
  - 하나님의 곁에서 들은
  lexicon: BDAG
  rationale: παρά + 속격의 출처 의미를 한국어의 '-에게서'로 자연스럽게 옮겼습니다. '하나님에게서'는 본문의 발화 근원을 분명히 합니다.
theological_decisions:
- issue: 예수 자신의 자기지칭 ἄνθρωπον의 처리
  chosen_reading: 사람
  alternative_readings:
  - 남자
  - 인간
  rationale: 본문은 예수께서 자신을 한 사람으로 언급하는 표현을 그대로 드러냅니다. '사람'은 그 인성을 훼손하지 않으면서도 한국어로 가장 평이하고 직접적인 대응입니다.
  doctrine_reference: DOCTRINE.md Affirmations; Translation philosophy §4
- issue: παρὰ τοῦ θεοῦ의 번역 범위
  chosen_reading: 하나님에게서
  alternative_readings:
  - 아버지에게서
  - 하나님의 임재에서
  rationale: 헬라어 본문은 '하나님'이라고만 말하므로, 요한복음의 다른 신학을 반영해 '아버지'로 구체화하지 않았습니다. 본문 수준의 표현을 유지하는 것이 더 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
