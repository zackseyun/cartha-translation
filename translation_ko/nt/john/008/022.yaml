  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
  footnotes:
  - marker: a
    text: Or possibly, in Johannine context, “the Judeans” or “the Jewish leaders,” depending on how broadly John intends the reference here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 유대인들[a]은 말하고 있었습니다. “그가 ‘내가 가는 곳에는 여러분이 올 수 없습니다’라고 말하니, 설마 그가 자신을 죽이겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥에 따라 ‘유대인들’은 ‘유대 지방 사람들’ 또는 ‘유대 지도자들’을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  english_pob_choice: were saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하고 있었습니다
  - 계속 말했습니다
  lexicon: BDAG
  rationale: 미완료 시상의 반복·지속 뉘앙스는 한국어에서 문맥상 자연스럽게 과거 진행/반복으로 드러나지만, 본문 흐름상 간결한 과거형이 가장 읽기 쉽고 과도한 장황함을 피합니다.
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들이
  alternatives_korean:
  - 유대인들
  - 유대 지도자들이
  - 유대 사람들
  lexicon: BDAG
  rationale: 영문 POB처럼 본문 표면의 집단명칭을 유지하되, 한국어에서는 관사 없는 복수 표현으로 자연스럽게 옮겼습니다. 문맥적 한정은 본문 자체에 없으므로 main text에서 좁히지 않았습니다.
- source_word: Μήτι ἀποκτενεῖ ἑαυτὸν
  english_pob_choice: Surely he will not kill himself
  chosen_korean: 그가 혹시 자신을 죽이려는 것입니까
  alternatives_korean:
  - 설마 그가 스스로 목숨을 끊으려는 것입니까
  - 그가 자살하려는 것입니까
  lexicon: BDAG
  rationale: Μήτι의 부정 예상 질문을 한국어의 추측·의심을 나타내는 표현으로 살렸습니다. ἀποκτενεῖ ἑαυτόν은 직역하면 ‘자신을 죽이다’이므로, 현대적이되 본문이 가진 자해/자살 추론의 뉘앙스를 유지했습니다.
- source_word: Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν
  english_pob_choice: Where I am going, you cannot come
  chosen_korean: 내가 가는 곳에는 너희가 올 수 없다
  alternatives_korean:
  - 내가 가는 곳으로는 너희가 올 수 없다
  - 내가 가는 곳에 너희는 올 수 없다
  lexicon: BDAG
  rationale: ὑπάγω는 단순한 ‘가다’보다 ‘가고 있다/떠나가다’의 이동감을 가지므로 ‘내가 가는 곳’으로 옮겼습니다. οὐ δύνασθε ἐλθεῖν은 능력 부정이므로 ‘올 수 없다’가 자연스럽고 정확합니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 번역 범위
  chosen_reading: 본문의 표면 의미를 따라 ‘유대인들’로 두고, 문맥상 가능한 축소 해석은 각주로 제시합니다.
  alternative_readings:
  - 유대 지도자들
  - 유대 사람들
  - 유다인들
  rationale: 요한복음에서는 이 표현이 때로 특정 반대자 집단을 가리키지만, 이 절 자체는 그 범위를 명시하지 않습니다. 본문을 먼저 존중하면서 독자가 오해하지 않도록 대안을 각주로 남깁니다.
  doctrine_reference: 원문 우선 원칙; 해석의 여지를 본문 밖에서 과도하게 확정하지 않음
