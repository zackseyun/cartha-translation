review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ἀποκτενεῖ는 미래형이므로 ‘자신을 죽이려는 것입니까’(의도·시도)는 ‘자신을 죽이겠습니까’로 옮기는 편이 정확합니다. ἔλεγον의 미완료상도 ‘말하고 있었습니다’로 반영할 수 있습니다.
  naturalness: 본문의 직접 인용에서 ‘너희’는 요청된 현대 표준 합쇼체와 어울리지 않으므로 ‘여러분’과 ‘없습니다’로 고쳤습니다. 각주 표지는 수식 대상인 ‘유대인들’에 붙였습니다.
  terminology: οἱ Ἰουδαῖοι는 본문에서 ‘유대인들’로 유지합니다. 다만 각주는 영어 감사 기록의 ‘Judeans’ 가능성을 ‘유대 지방 사람들’로 명시해야 하며, ‘유대 사람들’은 본문 표현과 실질적으로 구별되지 않아 대안으로 부정확합니다.
  issues:
  - severity: medium
    issue: 미래형 ἀποκτενεῖ의 의미가 ‘죽이려는’으로 약화됨
    rationale: 원문은 그가 자신을 죽일 것인지 묻는 부정 예상 의문문입니다. 의도나 시도를 뜻하는 보조 표현을 더하지 않는 것이 안전합니다.
  - severity: medium
    issue: 직접 인용의 ‘너희가 올 수 없다’가 합쇼체 기준에 맞지 않음
    rationale: 요청된 현대 격식체에서는 ‘여러분이 올 수 없습니다’가 자연스럽고 일관됩니다.
  - severity: low
    issue: 각주가 ‘the Judeans’라는 지리적·문맥적 대안을 충분히 제시하지 못함
    rationale: ‘유대 사람들’은 ‘유대인들’의 단순 동의어처럼 들립니다. ‘유대 지방 사람들’이라고 해야 대안의 범위를 분명히 알릴 수 있습니다.
  revised_text: 그러자 유대인들[a]은 말하고 있었습니다. “그가 ‘내가 가는 곳에는 여러분이 올 수 없습니다’라고 말하니, 설마 그가 자신을 죽이겠습니까?”
  revised_footnotes:
  - marker: a
    text: 문맥에 따라 ‘유대인들’은 ‘유대 지방 사람들’ 또는 ‘유대 지도자들’을 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 미래형의 의미와 미완료상의 지속성을 반영하고, 직접 인용을 현대 표준 합쇼체로 통일했습니다. οἱ Ἰουδαῖοι의 본문상 모호성은 유지하되, 각주에서 가능한 문맥적 범위만 제시했습니다.
