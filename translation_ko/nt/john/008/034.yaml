review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the response formula, the doubled solemn affirmation, the universalizing articular present participle, and the metaphor of bondage to sin. However, ‘죄를 행하는 사람’ is not idiomatic modern Korean for committing sin and is less natural than the standard expression ‘죄를 짓는 사람.’ The present participle need not be made more strongly habitual than the Greek itself requires; the generic present Korean expression preserves the contextual characteristic sense adequately.
  naturalness: ‘누구든지 죄를 행하는 사람’ is syntactically redundant and ‘죄를 행하다’ is markedly unnatural in this context. ‘죄를 짓는 사람은 누구나’ is fluent, formal-polite Korean and retains the universal scope.
  terminology: ‘진실로 진실로,’ ‘죄,’ and ‘죄의 노예’ are appropriate. ‘노예’ correctly preserves the force of δοῦλος in the metaphor of enslavement, without reducing it to a merely deferential servant role.
  issues:
  - severity: medium
    issue: Unnatural and redundant rendering of πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
    rationale: ‘누구든지 죄를 행하는 사람’ combines two overlapping expressions for an indefinite person and uses ‘죄를 행하다,’ which is not normal contemporary Korean. ‘죄를 짓는 사람은 누구나’ naturally conveys the generic, characteristic force of the Greek present participle.
  - severity: low
    issue: Footnote a is anchored at the end of the sentence rather than at the expression it explains
    rationale: The note concerns the rendering of ποιῶν τὴν ἁμαρτίαν and should follow ‘죄를 짓는 사람은 누구나’; the δοῦλος note should remain after ‘노예입니다.’
  revised_text: 예수께서 그들에게 대답하셨습니다. 「진실로 진실로 내가 너희에게 말합니다. 죄를 짓는 사람은 누구나[a] 죄의 노예입니다[b].」
