- source_word: πᾶς ὁ ποιῶν
  english_pob_choice: everyone who practices
  chosen_korean: 누구든지 죄를 행하는 사람
  alternatives_korean:
  - 누구든지 죄를 짓는 사람
  - 누구든지 죄를 행하는 자
  lexicon: BDAG
  rationale: 현재분사의 지속적·습관적 의미를 살리되, 한국어에서 ‘행하는 사람’이 지속적 행위를 비교적 자연스럽게 드러냅니다.
- source_word: δοῦλός ἐστιν τῆς ἁμαρτίας
  english_pob_choice: is a slave of sin
