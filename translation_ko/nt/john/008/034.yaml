  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a slave of sin.”
  footnotes:
  - marker: a
    text: Or 'everyone who does sin.' The Greek participle can be rendered more literally, but 'practices sin' better conveys the ongoing or characteristic sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'servant of sin.' The Greek word δοῦλος can mean 'servant' or 'slave'; here 'slave' is used because the sense of bondage is central to Jesus' point.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그들에게 대답하셨습니다. 「진실로 진실로 내가 너희에게 말합니다. 죄를 짓는 사람은 누구나[a] 죄의 노예입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄를 행하는 사람’. 그리스어 현재분사는 문맥상 단발적 행위보다 지속적·습관적 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죄의 종입니다’. δοῦλος는 ‘종’ 또는 ‘노예’로 옮길 수 있으나, 여기서는 예속의 의미가 본문의 요지이므로 ‘노예’를 택했습니다.
    reason: alternative_reading
