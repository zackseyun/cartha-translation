  - 죄의 종노릇을 합니다
  lexicon: BDAG
  rationale: 문맥의 핵심이 죄에 대한 예속과 지배이므로, 전통적 완화어보다 ‘노예’가 종속성과 구속성을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: 죄에 대한 지속적 예속의 표현
  chosen_reading: ‘죄를 행하는 사람’과 ‘죄의 노예입니다’로, 단발적 행위보다 지속적 지배 상태를 드러냈습니다.
  alternative_readings:
  - 죄를 짓는 자는 죄의 종입니다
  - 죄를 범하는 사람은 죄에 속한 종입니다
  rationale: 그리스어 현재분사 ποιῶν은 습관적·특성적 행위를 가리키므로, 예수의 경고를 도덕적 습관과 지배의 문제로 읽게 하는 번역이 본문 취지에 부합합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5; δοῦλος 용례 지침
