  - severity: low
    issue: 각주 b가 본문과 사실상 중복됨
    rationale: 본문의 ‘마지막 사람까지’가 이미 영어 감사 기록의 대안 ‘until the last’에 해당하는 의미를 자연스럽게 표현합니다. 현 각주 b는 별도의 번역 대안을 제공하지 않으므로 삭제하는 편이 명료합니다.
