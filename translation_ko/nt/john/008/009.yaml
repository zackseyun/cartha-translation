  terminology: συνείδησις는 ‘양심’, ἐλέγχω는 이 문맥에서 ‘책망’으로 적절히 옮겼습니다. πρεσβυτέρων은 직분명이 아닌 연령 비교이므로 ‘나이 많은 사람들’이 적절합니다.
