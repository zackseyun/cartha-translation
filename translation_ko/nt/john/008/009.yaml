id: JHN.8.9
reference: John 8:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
  footnotes:
  - marker: a
    text: Continuation of the pericope adulterae (John 7:53–8:11). See note on John 7:53.
    reason: textual_critical
  - marker: b
    text: Or 'until the last'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 말을 들은 사람들은 자기 양심에 책망을 받아 하나씩 하나씩, 나이 많은 사람들부터 마지막 사람까지 나가 버렸습니다. 예수님만 홀로 남으시고, 그 여자는 가운데 서 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 본문은 간음한 여인 단락(요 7:53–8:11)의 계속입니다. 요 7:53의 주석을 보십시오.
    reason: textual_variant
  - marker: b
    text: 또는 ‘마지막 사람까지’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  english_pob_choice: those who heard it
  chosen_korean: 그 말을 들은 사람들
  alternatives_korean:
  - 듣고 있던 사람들
  - 그것을 들은 사람들
  lexicon: contextual
  rationale: 직전 발언을 들은 이들을 가리키므로, 지시어를 살려 자연스럽게 ‘그 말’을 넣었습니다.
- source_word: ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι
  english_pob_choice: being convicted by their conscience
  chosen_korean: 자기 양심에 책망을 받아
  alternatives_korean:
  - 양심의 책망을 받아
  - 자기 양심에 정죄를 받아
  lexicon: BDAG
  rationale: ἐλέγχω의 내적 도덕적 책망을 한국어의 ‘책망을 받다’로 옮겨, 양심의 작용을 분명히 했습니다.
- source_word: ἐξήρχοντο εἷς καθ' εἷς
  english_pob_choice: went out one by one
  chosen_korean: 하나씩 하나씩 … 나가 버렸습니다
  alternatives_korean:
  - 한 사람씩 나갔습니다
  - 차례로 나갔습니다
  lexicon: contextual
  rationale: 순차적 이탈을 강조하는 표현으로, ‘하나씩 하나씩’은 반복을 살리고 ‘나가 버렸습니다’는 장면의 종결감을 드러냅니다.
- source_word: ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων
  english_pob_choice: beginning with the older ones down to the last
  chosen_korean: 나이 많은 사람들부터 마지막 사람까지
  alternatives_korean:
  - 연장자들부터 마지막까지
  - 어른들부터 끝까지
  lexicon: BDAG
  rationale: 여기서 πρεσβύτερος는 직분이 아니라 연령을 가리키므로 ‘나이 많은 사람들’로 옮겼습니다.
theological_decisions:
- issue: 양심의 내적 정죄 표현
  chosen_reading: 이 장면은 외적 판결이 아니라 각 사람의 양심이 자신을 책망하여 물러나는 장면으로 이해했습니다.
  alternative_readings:
  - 단순히 부끄러워서 떠난 것으로 읽기
  - 공적 비난을 두려워한 것으로 읽기
  rationale: ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι의 주어는 ‘양심’이므로, 내부의 도덕적 자각이 행동을 바꾼다는 점을 살렸습니다.
  doctrine_reference: 양심과 죄책의 도덕적 인식
