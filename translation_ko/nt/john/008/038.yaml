id: JHN.8.38
reference: John 8:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
  footnotes:
  - marker: a
    text: Or, more formally, 'I speak the things that I have seen with the Father, and you therefore do the things that you heard from the father.' The second 'father' is left less explicit here, though the wider context clarifies the referent (see v. 44).
    reason: alternative_reading
translation:
  language: ko
  text: 나는 아버지와 함께 본 것을 말합니다. 그러므로 너희도 너희 아버지에게서 들은 것을 행합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘나는 아버지와 함께 내가 본 것들을 말합니다. 그러므로 너희는 따라서 너희 아버지에게서 들은 것들을 행합니다.’ 둘째 ‘아버지’는 여기서 덜 분명하게 남겨 두었지만, 더 넓은 문맥이 그 지시 대상을 밝혀 줍니다(44절 참조).
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ ἐγὼ ἑώρακα
  english_pob_choice: what I have seen
  chosen_korean: 본 것을
  alternatives_korean:
  - 내가 본 것을
  - 본 바를
  lexicon: BDAG
  rationale: neuter plural 관계절을 한국어에서는 자연스럽게 명사화하여 ‘본 것’을 쓰되, 완전한 시제 감각은 ‘말합니다’와의 병렬 속에서 유지했습니다.
- source_word: παρὰ τῷ πατρὶ
  english_pob_choice: with the Father
  chosen_korean: 아버지와 함께
  alternatives_korean:
  - 아버지 앞에서
  - 아버지 곁에서
  lexicon: BDAG
  rationale: παρά + 여격의 근접/동반 의미를 살려 ‘함께’로 옮기면, 단순한 출처보다 예수와 아버지의 친밀한 관계가 드러납니다.
- source_word: λᾷλῶ
  english_pob_choice: I speak
  chosen_korean: 말합니다
  alternatives_korean:
  - 말하고 있습니다
  - 말합니다
  lexicon: BDAG
  rationale: 직접 목적어가 이어지는 구조를 한국어에서 가장 자연스럽게 풀어 주는 동사는 ‘말하다’입니다.
- source_word: παρὰ τοῦ πατρὸς
  english_pob_choice: from your father
  chosen_korean: 너희 아버지에게서
  alternatives_korean:
  - 아버지에게서
  - 너희 아버지로부터
  lexicon: BDAG
  rationale: παρά + 속격의 출처 의미를 살리면서, 문맥상 상대편의 아버지를 가리키므로 소유격 대명사 없이도 한국어에서 ‘너희 아버지’로 분명히 했습니다.
- source_word: ποιεῖτε
  english_pob_choice: do
  chosen_korean: 행합니다
  alternatives_korean:
  - 합니다
  - 실행합니다
  lexicon: BDAG
  rationale: 단순한 행위를 넘어 반복적·관습적 실천의 뉘앙스를 드러내기 위해 ‘행하다’를 택했습니다.
theological_decisions:
- issue: 둘째 ‘아버지’의 정체를 본문에서 얼마나 분명히 할 것인가
  chosen_reading: 본문에는 그대로 ‘너희 아버지’로 두고, 아직 그 정체를 즉시 단정하지 않았습니다.
  alternative_readings:
  - 너희의 아버지인 마귀
  - 마귀에게서
  rationale: 이 절은 다음 절(44절)에서 이어질 폭로를 예고하는 단계이므로, 여기서 해석을 앞당기지 않고 서술의 긴장과 점진성을 보존했습니다.
  doctrine_reference: 서술 진행 보존
- issue: ‘아버지와 함께’의 관계성 표현
  chosen_reading: 예수와 아버지의 단순한 출처 관계보다 동반·임재의 의미를 살리는 표현을 택했습니다.
  alternative_readings:
  - 아버지에게서
  - 아버지 앞에서
  rationale: παρά + 여격은 여기서 ‘from’보다 ‘with/in the presence of’의 의미가 강해, 아들의 독특한 계시적 관계를 드러내는 번역이 필요합니다.
  doctrine_reference: 요한복음의 아들-아버지 관계
