  source_fidelity: 본문의 핵심 대조와 동사 시제·태는 대체로 잘 반영되었습니다. 다만 παρὰ τῷ πατρί는 단순히 아버지와 공동으로 보았다는 뜻으로도 읽힐 수 있는 ‘아버지와 함께’보다, 임재·근접의 뜻을 드러내는 ‘아버지 곁에서’가 더 정확합니다. 둘째 πατρὸς에는 그리스어에 소유대명사가 없으나 문맥상 ‘너희 아버지’로 옮긴 것은 허용됩니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. ‘아버지 곁에서 내가 본 것’은 한국어에서 의미 관계가 더 분명합니다. 각주의 기존 직역문은 ‘그러므로’와 ‘따라서’를 겹쳐 쓰고, 둘째 ‘아버지’가 덜 명시적이라는 설명과 ‘너희 아버지’라는 표현이 충돌하므로 다듬어야 합니다.
  terminology: ‘아버지’, ‘너희 아버지’, ‘행합니다’는 요한복음의 대조와 격식 있는 성경 문체에 적절합니다. 둘째 아버지를 본문에서 마귀로 특정하지 않은 것은 원문의 점진적 전개를 보존합니다.
