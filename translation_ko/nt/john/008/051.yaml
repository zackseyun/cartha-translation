id: JHN.8.51
reference: John 8:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: ko
  text: 진실로 진실로 내가 여러분에게 말합니다. 누구든지 내 말을 지키면, 그는 영원히 죽음을 보지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν λέγω ὑμῖν
  english_pob_choice: Truly, truly, I say to you
  chosen_korean: 진실로 진실로 내가 여러분에게 말합니다
  alternatives_korean:
  - 아멘 아멘 내가 여러분에게 말합니다
  - 진실로 내가 여러분에게 말합니다
  lexicon: ἀμήν / λέγω / ὑμῖν
  rationale: 이중 ἀμήν의 강조를 살리면서, 직설적 선언형의 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: τὸν ἐμὸν λόγον
  english_pob_choice: my word
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 말씀을
  lexicon: λόγος
  rationale: 요한복음 문맥에서 λόγος는 단순한 ‘말’보다 권위 있는 말씀을 뜻할 수 있으나, 본문은 특정한 교리 용어보다 예수의 발화를 직접 가리키므로 ‘내 말’이 원문에 더 밀착합니다.
- source_word: τηρήσῃ
  english_pob_choice: keeps
  chosen_korean: 지키면
  alternatives_korean:
  - 간직하면
  - 준수하면
  lexicon: τηρέω
  rationale: τηρέω의 핵심인 ‘주의 깊게 지키다/보존하다’를 한국어로 자연스럽게 표현했습니다.
- source_word: θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα
  english_pob_choice: he will certainly never see death forever
  chosen_korean: 영원히 죽음을 보지 않을 것입니다
  alternatives_korean:
  - 절대로 죽음을 보지 않을 것입니다
  - 영원토록 죽음을 보지 않을 것입니다
  lexicon: θάνατος / θεωρέω / εἰς τὸν αἰῶνα
  rationale: ‘보다’는 관용적으로 ‘겪다/직면하다’의 의미를 담을 수 있어, 죽음을 실제로 맞이하지 않는다는 약속을 자연스럽게 전달합니다. εἰς τὸν αἰῶνα의 반복적·강조적 영속성을 ‘영원히’로 압축했습니다.
theological_decisions:
- issue: ‘죽음을 보지 않는다’는 표현의 의미
  chosen_reading: 물리적 죽음의 부정이라기보다, 예수의 말을 지키는 자가 최종적이고 파괴적인 죽음의 지배 아래 들어가지 않는다는 약속으로 읽었습니다.
  alternative_readings:
  - 신자에게 육체적 죽음이 전혀 없다는 직설적 약속
  - 영적 죽음만을 가리킨다는 해석
  rationale: 요한복음의 문맥과 ‘보지 않다’의 관용적 용법을 함께 고려하면, 과장법적이면서도 종말론적인 선언으로 이해하는 것이 가장 본문에 충실합니다.
  doctrine_reference: 요 5:24; 6:50-51; 11:25-26
