revisions:
- from: 예수께서 대답하셨습니다. "내가 내 자신을 영화롭게하면, 내 영광은 아무것도 아닙니다. 나를 영화롭게 하시는 분은 내 아버지이시니, 곧 여러분이 우리 하나님이라고 말하는 분입니다."[a]
  to: 예수께서 대답하셨습니다. “내가 내 자신을 영화롭게 하면, 내 영광은 아무것도 아닙니다. 나를 영화롭게 하시는 분은 내 아버지이시며, 그분은 여러분이 ‘우리 하나님’이라고 말하는 분입니다.[a]”
  rationale: 원문의 조건절, ‘영광’ 어휘의 반복, 아버지에 대한 관계절, 그리고 SBLGNT의 ‘우리 하나님’ 읽기를 유지했습니다. 띄어쓰기를 바로잡고, 연결 표현에서 불필요한 인과 뉘앙스를 피했으며, 본문 이문의 적용 범위가 분명하도록 각주 표지를 해당 어구에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:17Z'
