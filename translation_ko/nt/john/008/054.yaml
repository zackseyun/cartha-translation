  naturalness: 합쇼체는 일관되고 자연스럽습니다. ‘이시니, 곧’은 다소 어색하고 인과적 뉘앙스를 낼 수 있어, 관계절의 동격 설명을 자연스럽게 드러내도록 문장을 조정했습니다.
  terminology: δόξα/δοξάζω의 연관성을 ‘영광/영화롭게 하다’로 일관되게 유지했습니다. ‘하나님’, ‘내 아버지’도 한국어 성경 문체와 본문 지시 대상에 적절합니다.
