id: JHN.8.54
reference: John 8:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
  footnotes:
  - marker: a
    text: Some manuscripts read “your God” instead of “our God.”
    reason: textual_variant
translation:
  language: ko
  text: 예수께서 대답하셨습니다. “내가 내 자신을 영화롭게 하면, 내 영광은 아무것도 아닙니다. 나를 영화롭게 하시는 분은 내 아버지이시며, 그분은 여러분이 ‘우리 하나님’이라고 말하는 분입니다.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘우리 하나님’ 대신 ‘여러분의 하나님’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하셨습니다
  alternatives_korean:
  - 대답했습니다
  - 응답하셨습니다
  lexicon: BDAG
  rationale: 대화 서두의 ἀπεκρίθη는 자연스럽고 격식을 갖춘 서술로 ‘대답하셨습니다’가 적절합니다.
- source_word: δοξάσω / δοξάζω
  english_pob_choice: glorify
  chosen_korean: 영화롭게하다
  alternatives_korean:
  - 영광스럽게 하다
  - 존귀하게 하다
  lexicon: BDAG
  rationale: 요한복음의 δόξα/δοξάζω는 단순한 칭찬보다 하나님의 영광을 드러내는 의미가 강하므로 ‘영화롭게하다’가 문맥을 가장 잘 살립니다.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  english_pob_choice: my glory is nothing
  chosen_korean: 내 영광은 아무것도 아닙니다
  alternatives_korean:
  - 내 영광은 헛것입니다
  - 내 영광은 아무 의미가 없습니다
  lexicon: BDAG
  rationale: οὐδέν ἐστιν의 직선적 의미를 살려 ‘아무것도 아닙니다’로 옮겨, 자기 영광의 무가치를 분명하게 드러냈습니다.
- source_word: ὁ πατήρ μου ὁ δοξάζων με
  english_pob_choice: My Father is the one who glorifies me
  chosen_korean: 나를 영화롭게 하시는 분은 내 아버지이시니
  alternatives_korean:
  - 나를 영화롭게 하시는 분은 내 아버지이십니다
  - 내 아버지께서 나를 영화롭게 하십니다
  lexicon: BDAG
  rationale: 분사구를 한국어의 관계절로 풀어 현재적·서술적 의미를 살리고, 화자 내부의 호칭인 ‘내 아버지’는 존칭 형식으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν의 인칭 대조와 텍스트 뉘앙스
  chosen_reading: ‘여러분이 우리 하나님이라고 말하는 분’으로 옮겨, 본문이 전하는 ‘여러분’과 ‘우리’의 대조를 그대로 드러냈습니다.
  alternative_readings:
  - ‘여러분이 여러분의 하나님이라고 말하는 분’
  - ‘여러분이 하나님이라고 말하는 분’
  rationale: SBLGNT의 ἡμῶν을 따라 ‘우리 하나님’으로 두되, 논쟁 문맥의 대조를 유지하기 위해 ‘여러분이 …라고 말하는 분’이라는 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
