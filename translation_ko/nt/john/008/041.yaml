  source_fidelity: 핵심 대조와 화자의 전환은 잘 보존되어 있습니다. 다만 ἐκ πορνείας는 한국어에서 ‘음행에서 난 사람들’보다 원인·출처를 나타내는 ‘음행으로 말미암아 태어나다’로 옮기는 것이 더 자연스럽고 원문에 가깝습니다. 완료 수동태의 출생 관용 표현도 ‘태어나지 않았습니다’로 충분히 반영됩니다.
  naturalness: ‘당신들 아버지’는 소유 관계를 표시한 ‘당신들의 아버지’가 표준 한국어 문장으로 더 자연스럽습니다. 또한 ‘한 분 아버지가 계시니, 하나님이십니다’는 연결이 다소 어색하므로, 동격을 ‘곧’으로 명시하는 편이 분명하고 자연스럽습니다.
  terminology: ‘아버지’, ‘일’, ‘하나님’은 본문의 요한복음적 어휘와 대조를 적절히 유지합니다. ‘사생아’는 각주 안의 가능한 관용적 해석으로만 남기되, 본문은 원문의 표현을 직접적으로 유지합니다.
