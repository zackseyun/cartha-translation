  - marker: a
    text: Or, 'We are not illegitimate children.' The Greek literally says, 'We were not born from sexual immorality.'
    reason: lexical_alternative
translation:
  language: ko
  text: “당신들은 당신들의 아버지의 일을 하고 있습니다.” 그들이 그에게 말했습니다. “우리는 음행으로 말미암아 태어나지 않았습니다[a]. 우리에게는 한 분 아버지가 계십니다. 곧 하나님이십니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 사생아가 아닙니다.’ 그리스어는 문자적으로 ‘우리는 음행으로 말미암아 태어나지 않았습니다’라고 말합니다.
    reason: lexical_alternative
