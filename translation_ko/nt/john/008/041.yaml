source:
  edition: SBLGNT
  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
  footnotes:
  - marker: a
    text: Or, 'We are not illegitimate children.' The Greek literally says, 'We were not born from sexual immorality.'
    reason: lexical_alternative
translation:
  language: ko
  text: “당신들은 당신들 아버지의 일을 하고 있습니다.” 그들이 그에게 말했습니다. “우리는 음행에서 난 사람들이 아닙니다. 우리에게는 한 분 아버지가 계시니, 하나님이십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 사생아가 아닙니다.’ 그리스어는 문자적으로 ‘우리는 음행에서 나지 않았습니다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε τὰ ἔργα
  english_pob_choice: are doing the works
  chosen_korean: 일을 하고 있습니다
  alternatives_korean:
  - 행하고 있습니다
  - 하고 있습니다
  lexicon: BDAG
  rationale: 현재형의 진행감을 살리면서, ἔργα의 반복적·실천적 뉘앙스를 한국어의 ‘일을 하고 있습니다’로 자연스럽게 드러냈습니다.
- source_word: τοῦ πατρὸς ὑμῶν
  english_pob_choice: of your father
  chosen_korean: 당신들 아버지의
  alternatives_korean:
  - 너희 아버지의
  - 아버지의
  lexicon: BDAG
  rationale: 직설적 대조를 유지하기 위해 2인칭 복수 대상을 분명히 드러내되, 문맥상 관계적·비유적 ‘아버지’를 그대로 살렸습니다.
- source_word: ἐκ πορνείας
  english_pob_choice: from sexual immorality
  chosen_korean: 음행에서
  alternatives_korean:
  - 성적 부도덕에서
  - 음란에서
  lexicon: BDAG
  rationale: 원문의 전치사 ἐκ와 πορνεία의 결합을 직역에 가깝게 살리면서, 한국어에서 가장 표준적이고 성경적 용례가 넓은 ‘음행’을 택했습니다.
- source_word: ἕνα πατέρα ἔχομεν τὸν θεόν
  english_pob_choice: we have one Father—God
  chosen_korean: 우리에게는 한 분 아버지가 계시니, 하나님이십니다
  alternatives_korean:
  - 우리는 한 분 아버지, 곧 하나님을 모시고 있습니다
  - 우리에게는 한 분 아버지가 계십니다—하나님이십니다
  lexicon: BDAG
  rationale: 동격 관계를 한국어의 설명적 종결로 풀어, ‘한 분 아버지’가 곧 ‘하나님’임을 명료하게 드러냈습니다.
theological_decisions:
- issue: ‘아버지’의 반복이 지닌 영적 혈통 주장과 예수의 반박 구도
  chosen_reading: ‘당신들 아버지’와 ‘한 분 아버지’의 대조를 그대로 유지했습니다.
  alternative_readings:
  - ‘조상’으로 완화하기
  - ‘부친’으로 바꾸기
  rationale: 본문은 혈통이 아니라 소속과 근원을 두고 논쟁하므로, ‘아버지’라는 신학적·수사적 핵심어를 완화하지 않았습니다.
  doctrine_reference: Maintain theological tension rather than resolving the accusation-response pattern.
