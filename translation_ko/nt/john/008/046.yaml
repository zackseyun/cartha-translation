id: JHN.8.46
reference: John 8:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
  footnotes:
  - marker: a
    text: Or 'Who among you proves me guilty of sin?'
    reason: lexical_alternative
  - marker: b
    text: Or 'why do you not trust me?' The Greek can carry both the sense of believing a speaker and trusting him.
    reason: lexical_alternative
  - marker: c
    text: Or 'convicts me concerning sin'.
    reason: previous_rendering
translation:
  language: ko
  text: 여러분 가운데 누가 나를 죄로 정죄합니까? 내가 진리를 말한다면, 왜 여러분은 나를 믿지 않습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 나를 죄로 정죄합니까?’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왜 내 말을 믿지 않습니까?’; πιστεύω는 여기서 화자를 믿는 뜻과 그 말에 신뢰를 두는 뜻을 함께 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나를 죄에 관해 정죄합니까’.
    reason: previous_rendering
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  english_pob_choice: Which one of you
  chosen_korean: 여러분 가운데 누가
  alternatives_korean:
  - 누가 여러분 가운데
  - 여러분 중 누가
  lexicon: BDAG
  rationale: ἐξ ὑμῶν은 ‘여러분 가운데에서’라는 뜻이므로, 대면하는 논쟁의 뉘앙스를 살려 ‘여러분 가운데 누가’로 옮겼습니다.
- source_word: ἐλέγχει με
  english_pob_choice: convicts me
  chosen_korean: 나를 죄로 정죄합니까
  alternatives_korean:
  - 나를 책망합니까
  - 나를 입증하여 유죄로 합니까
  - 나를 죄 있다고 입증합니까
  lexicon: BDAG
  rationale: ἐλέγχω는 여기서 단순한 꾸중보다 법정적·논박적 의미가 강하므로, 영어 POB의 ‘convicts’에 맞게 ‘죄로 정죄하다’로 옮겼습니다.
- source_word: περὶ ἁμαρτίας
  english_pob_choice: of sin
  chosen_korean: 죄로
  alternatives_korean:
  - 죄에 관하여
  - 죄에 대하여
  lexicon: BDAG
  rationale: περὶ + 속격은 ‘…에 관하여’의 뜻이지만, 한국어에서는 ‘정죄하다’와 결합할 때 ‘죄로 정죄하다’가 자연스럽고 의미도 분명합니다.
- source_word: πιστεύετέ μοι
  english_pob_choice: do you not believe me
  chosen_korean: 나를 믿지 않습니까
  alternatives_korean:
  - 내 말을 믿지 않습니까
  - 나를 신뢰하지 않습니까
  lexicon: BDAG
  rationale: πιστεύω + 여격은 ‘믿다/신뢰하다’ 둘 다 가능하지만, 본문의 대조 구조를 살려 가장 직접적인 ‘나를 믿다’로 유지했습니다.
theological_decisions:
- issue: 예수의 진리 주장과 무죄 도전의 강도
  chosen_reading: 수사적 질문을 완화하지 않고, 예수의 직접적인 도전으로 유지했습니다.
  alternative_readings:
  - ‘누가 내 죄를 입증할 수 있습니까?’처럼 더 설명적으로 풀기
  rationale: 본문은 예수의 죄 없음과 그분의 말의 진실성을 함께 제기하므로, 이를 부드럽게 바꾸지 않고 원문의 긴장과 강도를 보존했습니다.
  doctrine_reference: '니케아 신경(381), 칼케돈 신조(451); 번역 원칙: 본문의 신학적 긴장을 해소하지 말 것'
