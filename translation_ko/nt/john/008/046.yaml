source:
  edition: SBLGNT
  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
  footnotes:
  - marker: a
    text: Or 'Who among you proves me guilty of sin?'
    reason: lexical_alternative
  - marker: b
    text: Or 'why do you not trust me?' The Greek can carry both the sense of believing a speaker and trusting him.
