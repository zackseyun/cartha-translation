review_pass:
  verdict: revise
  source_fidelity: 그리스어의 δαιμόνιον ἔχω는 문자상 ‘귀신을 가지고 있다’이지만, 한국어에서는 그 직역이 부자연스럽고 소유 의미로 오해될 수 있습니다. ‘귀신 들린 사람’은 이 관용적 의미를 정확히 전달합니다. ἀλλά는 ‘그러나’로, τιμάω/ἀτιμάζω의 대조는 ‘공경하다/욕되게 하다’로 살렸습니다.
  naturalness: ‘귀신을 가지고 있지 않습니다’는 현대 표준 한국어에서 자연스럽지 않습니다. ‘귀신 들린 사람이 아닙니다’가 현대의 합쇼체 문장으로 명확하고 자연스럽습니다. ‘욕되게 합니다’는 다소 문어적이나 성서 본문의 격식에 맞으며 ‘공경하다’와의 의미상 대조를 보존합니다.
  terminology: ‘내 아버지’는 원문의 호칭을 보충 없이 유지합니다. ‘공경하다’와 ‘욕되게 하다’는 존귀하게 함과 불명예스럽게 함의 대조를 적절히 나타냅니다. δαιμόνιον의 직역적 표현은 각주로 제시하여 본문의 자연성과 원문 관용구의 형태를 함께 보존합니다.
  issues:
  - severity: medium
    issue: ‘귀신을 가지고 있지 않습니다’는 한국어 관용에 맞지 않습니다.
    rationale: 그리스어 ἔχω의 직접 대응처럼 보이지만, 한국어에서는 귀신을 소유한다는 뜻으로 읽히기 쉽습니다. 이 문맥의 ‘귀신 들리다/귀신 들린 사람’은 원문의 관용적 뜻을 더 충실하고 자연스럽게 전달합니다.
  - severity: low
    issue: ‘모욕합니다’는 ἀτιμάζετε의 존귀-수치 대조를 다소 좁힙니다.
    rationale: ‘모욕하다’는 가능한 번역이나 특정 언어행위에 초점이 있습니다. ‘욕되게 하다’는 τιμῶ의 ‘공경하다’와 더 직접적으로 대조됩니다.
  - severity: low
    issue: ἀλλά의 대조 접속을 ‘오히려’보다 ‘그러나’로 명시할 필요가 있습니다.
    rationale: 여기서는 대체라기보다 부정과 긍정의 대조이므로 ‘그러나’가 원문의 논리 관계를 더 안정적으로 나타냅니다.
  revised_text: 예수께서 대답하셨습니다. “나는 귀신 들린 사람이 아닙니다[a]. 그러나 나는 내 아버지를 공경하는데, 너희는 나를 욕되게 합니다.”
