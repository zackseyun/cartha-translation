source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
  footnotes:
  - marker: a
    text: Or, more interpretively, “I am not possessed by a demon.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하셨습니다. “나는 귀신 들린 사람이 아닙니다[a]. 그러나 나는 내 아버지를 공경하는데, 너희는 나를 욕되게 합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “나는 귀신을 가지고 있지 않습니다.” 또는 더 관용적으로, “나는 귀신 들리지 않았습니다.”
    reason: δαιμόνιον ἔχω의 직역적 형태와 한국어 관용 번역의 관계를 밝혀, 본문은 자연스럽게 유지하면서 원문의 표현을 확인할 수 있게 합니다.
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하셨습니다
  alternatives_korean:
  - 응답하셨습니다
  - 말씀하셨습니다
  lexicon: SBLGNT
  rationale: 대화 문맥에서 가장 자연스러운 응답 동사이며, 예수의 발화 시작을 분명하게 표시합니다.
- source_word: δαιμόνιον οὐκ ἔχω
  english_pob_choice: I do not have a demon
  chosen_korean: 나는 귀신을 가지고 있지 않습니다
  alternatives_korean:
  - 나는 귀신이 없습니다
  - 나는 귀신 들리지 않았습니다
  - 나는 귀신에 사로잡혀 있지 않습니다
  lexicon: BDAG
  rationale: 영어 POB의 직역적 선택을 따라 기본 구조를 보존하면서, 한국어에서도 '가지고 있다'로 직접 소유/내재의 표현을 살렸습니다.
- source_word: τιμῶ
  english_pob_choice: honor
  chosen_korean: 공경하는데
  alternatives_korean:
  - 존경하는데
  - 영광스럽게 하는데
  - 존중하는데
  lexicon: BDAG
  rationale: 부모 공경의 어감과 함께 존귀하게 대한다는 의미를 살릴 수 있어 '공경하다'를 택했습니다. 다만 뒤의 ἀτιμάζετε와의 대조를 유지합니다.
- source_word: ἀτιμάζετέ με
  english_pob_choice: you dishonor me
  chosen_korean: 너희는 나를 모욕합니다
  alternatives_korean:
  - 너희는 나를 불명예스럽게 합니다
  - 너희는 나를 무시합니다
  - 너희는 나를 욕되게 합니다
  lexicon: BDAG
  rationale: 한국어에서 'dishonor'의 직접 대응으로는 '모욕하다'와 '욕되게 하다'가 가능하지만, 여기서는 상대가 예수를 낮추고 깎아내리는 대조를 분명히 하도록 선택했습니다.
theological_decisions:
- issue: ‘my Father’의 번역과 신적 호칭 유지
  chosen_reading: ‘내 아버지’를 일반적 가족 호칭이 아니라 예수의 하나님 지칭으로 읽히도록 문맥에 맡기고, 별도의 설명 없이 그대로 옮겼습니다.
  alternative_readings:
  - ‘내 아버지’에 ‘아버지’를 대문자화하는 방식
  - ‘하나님 아버지’로 명시하는 방식
  rationale: 본문 자체가 요한복음의 문맥 안에서 예수의 독특한 아버지 호칭을 전제하므로, 원문에 없는 보충을 더하지 않고 간결하게 유지하는 편이 더 source-direct합니다.
  doctrine_reference: Johannine Christology; Translation philosophy §6
- issue: δαιμόνιον의 의미 범위
  chosen_reading: 주본문은 직역적 표현인 ‘귀신을 가지고 있지 않습니다’를 유지하고, 점검용 각주 없이 본문 의미를 그대로 드러냈습니다.
  alternative_readings:
  - ‘귀신 들리지 않았습니다’
  - ‘귀신에 사로잡혀 있지 않습니다’
  rationale: 문법적으로는 ‘have a demon’의 직접 표현을 보존하는 것이 원문과 가장 가깝고, 독자가 이해 가능한 한국어 문장으로도 충분히 전달됩니다.
  doctrine_reference: Translation philosophy §1, §3
