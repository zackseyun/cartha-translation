- from: 예수께서 몸을 일으켜 보시니, 여인 외에는 아무도 없었습니다. 예수께서 그 여인에게 말씀하셨습니다. “여인아, 너를 고발하던 그 사람들은 어디 있느냐? 아무도 너를 정죄하지 않았느냐?”[a]
  to: 예수께서 몸을 일으키시고 여인 외에는 아무도 보지 못하시자, 그 여인에게 말씀하셨습니다. “여인이여, 당신을 고발하던 사람들이 어디 있습니까? 아무도 당신을 정죄하지 않았습니까?”[a]
  rationale: 현대 합쇼체를 일관되게 적용하고, 예수께서 자세를 바로 하신 뒤 여인 외에는 아무도 보지 못하신 원문의 분사 구조를 한국어에서 더 분명히 드러냈습니다. 본문 전승에 관한 각주는 유지했습니다.
