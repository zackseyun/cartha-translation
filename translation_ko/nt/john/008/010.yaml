  verdict: revise
  source_fidelity: 원문의 두 분사(‘몸을 일으키시고’, ‘여인 외에는 아무도 보지 못하시고’)와 법정적 의미의 κατήγοροι 및 κατέκρινεν은 대체로 잘 반영되었습니다. 다만 직접 화법의 종결이 ‘-느냐’로 되어 있어 지정된 현대 합쇼체와 일치하지 않습니다.
  naturalness: 서술문은 자연스럽지만, ‘몸을 일으켜 보시니’는 자세를 바로 하신 동작과 보는 행위를 다소 결합해 들리게 합니다. 두 동작을 분명히 나누고, 질문을 합쇼체로 고치면 더 자연스럽고 일관됩니다.
  terminology: ‘고발하던 사람들’과 ‘정죄하다’는 원문의 고발·유죄 판정 맥락을 적절히 전달합니다. 호칭은 현대 한국어의 공손한 직접 화법에 맞추어 ‘여인이여’와 ‘당신’을 사용했습니다.
  issues:
