source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
  footnotes:
  - marker: a
    text: This verse is part of the story of the woman caught in adultery (John 7:53–8:11), which is absent from the earliest Greek manuscripts. See note on John 7:53.
    reason: textual_critical
translation:
  language: ko
  text: 예수께서 몸을 일으키시고 여인 외에는 아무도 보지 못하시자, 그 여인에게 말씀하셨습니다. “여인이여, 당신을 고발하던 사람들이 어디 있습니까? 아무도 당신을 정죄하지 않았습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 간음 중에 잡힌 여인 이야기(요 7:53–8:11)의 일부로, 가장 이른 그리스어 사본들에는 없습니다. 요 7:53의 주를 보십시오.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀνακύψας
  english_pob_choice: straightened up
  chosen_korean: 몸을 일으켜 보시니
  alternatives_korean:
  - 일어나 보시니
  - 허리를 펴시니
  - 몸을 세우시니
  lexicon: BDAG
  rationale: 예수께서 이전에 숙여 계시다가 자세를 바로 하시는 동작을 한국어 자연문으로 살리기 위해 ‘몸을 일으켜 보시니’로 옮겼습니다.
- source_word: θεασάμενος
  english_pob_choice: seeing
  chosen_korean: 보시니
  alternatives_korean:
  - 살펴보시니
  - 목격하시니
  - 알아보시니
  lexicon: BDAG
  rationale: 단순한 시각적 인지를 나타내므로 과장 없이 ‘보시니’가 가장 सीधे합니다.
- source_word: κατήγοροί
  english_pob_choice: accusers
  chosen_korean: 고발하던 사람들
  alternatives_korean:
  - 고소하던 사람들
  - 비난하던 사람들
  - 고발자들
  lexicon: BDAG
  rationale: 법정적 맥락의 ‘고발자들’은 살리되, 한국어에서는 진행 중이던 행위를 드러내는 ‘고발하던 사람들’이 문맥상 자연스럽습니다.
- source_word: κατέκρινεν
  english_pob_choice: condemned
  chosen_korean: 정죄하지 않았느냐
  alternatives_korean:
  - 유죄 판결하지 않았느냐
  - 판결하지 않았느냐
  - 죄를 묻지 않았느냐
  lexicon: BDAG
  rationale: 단순한 판단이 아니라 유죄 선고와 정죄의 의미를 담으므로 교회 언어에서도 널리 쓰이는 ‘정죄하다’를 유지했습니다.
theological_decisions:
- issue: 예수의 직접 화법에서의 호칭과 말투
  chosen_reading: “여인아”로 옮기되, 직설적 명령형이나 반말의 거칠음을 더하지 않고 질문형을 그대로 유지했습니다.
  alternative_readings:
  - “여자여”
  - “부인아”
  rationale: 원문의 Ἡ γυνή는 호칭적 표현이므로, 의미를 살리되 한국어에서 지나치게 무뚝뚝하거나 문화적으로 부자연스러운 표현은 피했습니다.
  doctrine_reference: 복음서의 화자-청자 관계와 공손한 직접화법
