id: JHN.8.16
reference: John 8:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
  footnotes:
  - marker: a
    text: 'Or ''if I judge'' or ''if I should judge.'' The Greek conditional expression can be rendered more formally, but here it likely carries a concessive sense: ''even if I do judge.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 판단한다 해도, 내 판결은 참된 판결입니다. 왜냐하면 나는 혼자가 아니기 때문입니다. 나와 나를 보내신 아버지가 함께 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 판단하면’, ‘내가 판단할지라도’. 헬라어 조건문은 더 형식적으로 옮길 수 있지만, 여기서는 양보적 의미인 ‘판단한다 해도’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  english_pob_choice: even if I do judge
  chosen_korean: 내가 판단한다 해도
  alternatives_korean:
  - 내가 판단하면
  - 내가 판단할지라도
  lexicon: BDAG
  rationale: ἐὰν + 접속법은 단순 조건보다 양보적 가능성을 띠므로, ‘-한다 해도’가 POB의 ‘even if’와 원문의 양보 뉘앙스를 가장 자연스럽게 살립니다.
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 또
  lexicon: BDAG
  rationale: 앞 문맥과의 대조를 드러내는 접속사이므로, 한국어에서는 ‘그러나’가 가장 직접적으로 대응합니다.
- source_word: ἡ κρίσις ἡ ἐμὴ
  english_pob_choice: my judgment
  chosen_korean: 내 판결
  alternatives_korean:
  - 내 판단
  - 나의 심판
  - 내 재판
  lexicon: BDAG
  rationale: 문맥상 법정적·판정적 의미가 강하므로, 일반적인 ‘판단’보다 ‘판결’이 κρίσις의 공적/사법적 뉘앙스를 더 잘 드러냅니다.
- source_word: ἀληθινή
  english_pob_choice: 'true'
  chosen_korean: 참된
  alternatives_korean:
  - 진실한
  - 옳은
  - 진짜
  lexicon: BDAG
  rationale: ἀληθινή는 단순 사실 진술을 넘어 실재적·신실한 참됨을 함의하므로, 형식적이면서도 의미를 넓게 담는 ‘참된’이 적절합니다.
theological_decisions:
- issue: 예수의 판결이 참된 근거
  chosen_reading: 예수의 판결은 혼자서 내리는 독립적 판결이 아니라, 그분을 보내신 아버지와 함께하는 관계 안에서 참됩니다.
  alternative_readings:
  - 법정적 증언 논리만 드러내는 좁은 읽기
  - 예수의 신성을 직접 설명하는 확장된 읽기
  rationale: 원문은 판결의 참됨을 ‘혼자가 아님’과 ‘보내신 아버지’에 근거시키므로, 그 논리를 그대로 살리되 후대 교리 용어를 덧붙이지 않았습니다.
  doctrine_reference: 요한복음의 증언/판결 문맥
