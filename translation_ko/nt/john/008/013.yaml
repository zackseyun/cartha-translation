  lexicon: BDAG
  rationale: 법정적 뉘앙스를 유지하면서도 현대 한국어에서 자연스럽고 일관된 대응으로 맞췄습니다.
- source_word: ἀληθής
  english_pob_choice: not true
  chosen_korean: 참되지 않습니다
  alternatives_korean:
  - 진실하지 않습니다
  - 옳지 않습니다
  - 유효하지 않습니다
  lexicon: BDAG
  rationale: 직역적 '참되지 않습니다'로 ἀληθής의 진실성 판단을 살리되, 이 문맥의 법적 유효성 함의는 열어 두었습니다.
theological_decisions:
- issue: 자기 증언에 대한 바리새인들의 반박의 범위
  chosen_reading: ‘참되지 않습니다’로 옮겨, 단순한 법적 무효만이 아니라 진실성에 대한 공격까지 함께 드러나게 했습니다.
  alternative_readings:
  - 유효하지 않습니다
  - 받아들일 수 없습니다
  rationale: 그리스어 ἀληθής는 이 논쟁에서 법정적 함의를 가질 수 있지만, 본문은 진리성 판단을 더 직접적으로 말하므로 이를 지나치게 좁히지 않았습니다.
  doctrine_reference: 의도된 긴장을 보존
