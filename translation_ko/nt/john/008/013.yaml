  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
  footnotes:
  - marker: a
    text: Or 'your testimony is not valid.' The Greek says 'not true,' which may also carry the sense of legal validity in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 바리새인들이 그에게 말했습니다. 「당신은 스스로에 대해 증언하고 있습니다. 당신의 증언은 참되지 않습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 증언은 유효하지 않습니다.’ 그리스어는 직역하면 ‘참되지 않다’이며, 이 문맥에서는 법적 유효성의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러자
  alternatives_korean:
  - 그러므로
  - 그때
  lexicon: BDAG
  rationale: 앞 절과의 논리적·서술적 연결을 자연스럽게 살리면서 한국어 대화문 흐름에 맞게 옮겼습니다.
- source_word: μαρτυρεῖς / μαρτυρία
  english_pob_choice: You are testifying / your testimony
  chosen_korean: 증언하고 있습니다 / 증언
  alternatives_korean:
  - 증언합니다 / 증거
