- from: 그러자 바리새인들이 그에게 말했습니다. 「당신은 스스로에 대해 증언하고 있습니다. 당신의 증언은 참되지 않습니다.」[a]
  to: 그러자 바리새인들이 그에게 말했습니다. “당신은 자신에 대해 증언하고 있습니다. 당신의 증언은 참된 것이 아닙니다.”[a]
  rationale: The revision improves idiomatic modern Korean while preserving the explicit self-reference, present-tense accusation, evidentiary terminology, and the deliberate ambiguity of ἀληθής between truthfulness and legal validity.
