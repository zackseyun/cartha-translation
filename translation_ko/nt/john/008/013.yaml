  text: 그러자 바리새인들이 그에게 말했습니다. “당신은 자신에 대해 증언하고 있습니다. 당신의 증언은 참된 것이 아닙니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 증언은 유효하지 않습니다.’ 그리스어는 직역하면 ‘참된 것이 아니다’이며, 이 문맥에서는 법적 유효성의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
