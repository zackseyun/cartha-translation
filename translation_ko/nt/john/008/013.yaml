  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
  footnotes:
  - marker: a
    text: Or 'your testimony is not valid.' The Greek says 'not true,' which may also carry the sense of legal validity in this context.
