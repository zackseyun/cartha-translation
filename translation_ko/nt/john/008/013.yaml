theological_decisions:
- issue: 자기 증언에 대한 바리새인들의 반박의 범위
  chosen_reading: ‘참되지 않습니다’로 옮겨, 단순한 법적 무효만이 아니라 진실성에 대한 공격까지 함께 드러나게 했습니다.
  alternative_readings:
  - 유효하지 않습니다
  - 받아들일 수 없습니다
  rationale: 그리스어 ἀληθής는 이 논쟁에서 법정적 함의를 가질 수 있지만, 본문은 진리성 판단을 더 직접적으로 말하므로 이를 지나치게 좁히지 않았습니다.
  doctrine_reference: 의도된 긴장을 보존
