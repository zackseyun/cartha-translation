review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the connective οὖν, the Pharisees as speakers, the explicit pronoun ‘to him,’ the present-tense accusation, and the distinction between μαρτυρεῖς and μαρτυρία. ‘참되지 않습니다’ preserves the broad semantic scope of ἀληθής, including but not limited to legal validity.
  naturalness: ‘스스로에 대해’ is awkward in contemporary standard Korean for περὶ σεαυτοῦ. ‘자신에 대해’ is the natural idiom. ‘참된 것이 아닙니다’ is also more idiomatic modern formal-polite Korean than ‘참되지 않습니다’ while retaining the source’s assertion that the testimony is not true.
  terminology: ‘증언하다/증언’ consistently conveys the evidentiary sense of μαρτυρεῖς/μαρτυρία. The revision retains this consistent terminology and leaves the legal-validity nuance to the footnote rather than narrowing the main text.
  issues:
  - severity: low
    issue: ‘스스로에 대해’ is unnatural Korean phrasing.
    rationale: For testimony concerning oneself, standard contemporary Korean normally says ‘자신에 대해’ or ‘자신에 관해.’ The proposed wording retains the reflexive referent without altering the meaning.
  - severity: low
    issue: ‘참되지 않습니다’ is somewhat stilted in modern Korean.
    rationale: ‘참된 것이 아닙니다’ is a more natural formal-polite predicate and faithfully renders οὐκ ἔστιν ἀληθής without selecting only the legal sense.
  revised_text: 그러자 바리새인들이 그에게 말했습니다. “당신은 자신에 대해 증언하고 있습니다. 당신의 증언은 참된 것이 아닙니다.”[a]
