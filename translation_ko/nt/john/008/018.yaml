source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
  footnotes:
  - marker: a
    text: Or 'bears witness about myself ... bears witness about me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 자신에 대해 증언하는 이이며, 나를 보내신 아버지께서도 나에 대해 증언하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 자신에 대해… 나에 대해 증언하십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι
  english_pob_choice: I am
  chosen_korean: 나는 …입니다
  alternatives_korean:
  - 내가 …입니다
  - 저는 …입니다
  lexicon: SBLGNT
  rationale: 본절은 뒤에 서술어가 이어지는 단순한 계사문이므로, 별도의 절대적 강조를 보태지 않고 자연스러운 1인칭 주어-서술 구조로 옮겼습니다.
- source_word: ὁ μαρτυρῶν
  english_pob_choice: the one who testifies
  chosen_korean: 증언하는 이
  alternatives_korean:
  - 증언하는 자
  - 증언자
  lexicon: BDAG
  rationale: 관사+현재분사가 실질적으로 명사화되어 있으므로 ‘증언자’도 가능하지만, ‘증언하는 이’가 진행 중인 증언 행위를 더 분명하게 살립니다.
- source_word: περὶ ἐμαυτοῦ / περὶ ἐμοῦ
  english_pob_choice: about myself / about me
  chosen_korean: 내 자신에 대해 / 나에 대해
  alternatives_korean:
  - 나에 관해
  - 나를 두고
  lexicon: BDAG
  rationale: περί+속격의 기본값인 ‘~에 대해/관해’를 따르되, ἐμαυτοῦ의 반사성을 앞절에서 ‘내 자신’으로 드러내어 자기 증언의 직접성을 살렸습니다.
- source_word: ὁ πέμψας με πατήρ
  english_pob_choice: the Father who sent me
  chosen_korean: 나를 보내신 아버지
  alternatives_korean:
  - 나를 보내신 그 아버지
  - 보내신 아버지
  lexicon: BDAG
  rationale: 아티클이 붙은 aorist 분사가 πατήρ를 수식하므로 ‘보내신 아버지’가 직역에 가깝습니다. 한국어에서는 관계절보다 관형절이 더 자연스러워 이처럼 옮겼습니다.
theological_decisions:
- issue: ‘아버지’의 표지 방식
  chosen_reading: 본문의 ὁ ... πατήρ를 그대로 ‘아버지’로 두고, ‘하나님 아버지’나 ‘내 아버지’로 확대하지 않았습니다.
  alternative_readings:
  - 내 아버지
  - 하나님 아버지
  rationale: 헬라어 본문은 단지 ‘아버지’라고 말하며, 문맥상 예수의 파송자를 가리킵니다. 본문에 없는 소유격이나 설명어를 추가하지 않고 관계적·신학적 함의를 유지하는 것이 적절합니다.
  doctrine_reference: 요한복음의 파송-증언 구조
