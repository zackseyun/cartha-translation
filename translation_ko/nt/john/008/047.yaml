revisions:
- from: 하나님에게서 온 사람은 하나님의 말씀들을 듣습니다[a]. 그러므로 여러분은 듣지 않습니다[b], 여러분이 하나님에게서 온 자들이 아니기 때문입니다.
  to: 하나님께로부터 온 사람은 하나님의 말씀을 듣습니다. 그러므로 여러분은 하나님께로부터 온 사람들이 아니므로 듣지 않습니다.
  rationale: The revision retains the representative singular subject, the source/origin contrast, the repetition of ‘듣다,’ and the causal relationship. It replaces unnatural Korean plural and nominal forms with idiomatic standard Korean, without resolving the Johannine expression into a particular doctrinal category.
  reviewer_model: gpt-5.6-terra
