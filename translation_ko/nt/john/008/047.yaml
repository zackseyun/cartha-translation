review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the source/origin force of ἐκ τοῦ θεοῦ, the repeated ἀκούω ('hear'), and the causal force of ὅτι. However, ‘하나님에게서 온 자들이 아니기 때문입니다’ is less idiomatic and introduces an unnecessarily marked nominal form for the Greek predicate.
  naturalness: ‘하나님에게서’ is less natural in this formal theological context than ‘하나님께로부터,’ ‘말씀들을’ is unnatural in standard Korean where collective ‘말씀’ readily represents the Greek plural, and the comma before the causal clause produces a cumbersome sentence. Reordering the causal clause yields natural modern formal-polite Korean without changing the logic.
  terminology: Use ‘하나님께로부터 온’ to retain origin/source without importing the more specific concept ‘born of God.’ Use ‘하나님의 말씀’ as the established, natural Korean rendering of τὰ ῥήματα τοῦ θεοῦ. Retain ‘듣습니다’ rather than interpretively rendering it ‘순종합니다.’
  issues:
  - severity: medium
    issue: Unnatural rendering of source/origin language
    rationale: ‘하나님에게서 온’ is understandable but awkward in this register; ‘하나님께로부터 온’ is idiomatic while preserving ἐκ’s source/origin sense.
  - severity: medium
    issue: Unnatural plural marking in ‘말씀들을’
    rationale: Although ῥήματα is plural, Korean ‘말씀’ is naturally collective here. Forced plural marking sounds nonstandard and is not required for source fidelity.
  - severity: low
    issue: Cumbersome causal syntax and marked predicate nominalization
    rationale: ‘듣지 않습니다, 여러분이 … 온 자들이 아니기 때문입니다’ is less fluent than placing the causal clause first and using ‘사람들이 아닙니다.’
  revised_text: 하나님께로부터 온 사람은 하나님의 말씀을 듣습니다. 그러므로 여러분은 하나님께로부터 온 사람들이 아니므로 듣지 않습니다.
  revised_footnotes: []
  revision_rationale: The revision retains the representative singular subject, the source/origin contrast, the repetition of ‘듣다,’ and the causal relationship. It replaces unnatural Korean plural and nominal forms with idiomatic standard Korean, without resolving the Johannine expression into a particular doctrinal category.
