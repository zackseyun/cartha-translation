id: JHN.8.47
reference: John 8:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
  footnotes:
  - marker: a
    text: Or 'you do not hear that you are not from God.' The Greek conjunction ὅτι can also be read as 'that,' but the causal sense 'because' fits the context better.
    reason: alternative_reading
  - marker: b
    text: '''From God'' can also be rendered ''of God.'' The Greek expression emphasizes source or origin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께로부터 온 사람은 하나님의 말씀을 듣습니다. 그러므로 여러분은 하나님께로부터 온 사람들이 아니므로 듣지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὢν
  english_pob_choice: the one who is
  chosen_korean: 하나님에게서 온 사람은
  alternatives_korean:
  - 하나님에게서 온 자는
  - 하나님에게서 난 사람은
  lexicon: BDAG
  rationale: 분사구가 사람 부류를 가리키므로 한국어도 대표적 주어 표현으로 옮겼습니다. ‘온’은 원천을 드러내면서도 문맥의 대조를 자연스럽게 살립니다.
- source_word: ἐκ τοῦ θεοῦ / ἐκ τοῦ θεοῦ οὐκ ἐστέ
  english_pob_choice: from God
  chosen_korean: 하나님에게서
  alternatives_korean:
  - 하나님께 속한
  - 하나님으로부터
  - 하나님의
  lexicon: BDAG
  rationale: ἐκ는 소속보다 근원/출처를 가리키므로 ‘~에게서’로 옮겨 원천적 대비를 살렸습니다. ‘하나님의’는 소유로 들릴 수 있어 피했습니다.
- source_word: τὰ ῥήματα
  english_pob_choice: the words
  chosen_korean: 말씀들을
  alternatives_korean:
  - 말들을
  - 하신 말씀들을
  - 말씀
  lexicon: BDAG
  rationale: ῥήματα의 복수성을 살리되 한국어에서 자연스럽게 들리도록 ‘말씀들’로 옮겼습니다. 단수 ‘말씀’은 복수의 구체성을 약화시킬 수 있습니다.
- source_word: ἀκούει / ἀκούετε
  english_pob_choice: hears / hear
  chosen_korean: 듣습니다 / 듣지 않습니다
  alternatives_korean:
  - 들어 귀 기울입니다 / 듣지 않습니다
  - 듣고 순종합니다 / 순종하지 않습니다
  lexicon: BDAG
  rationale: ἀκούω의 기본 뜻을 따라 ‘듣다’로 유지했습니다. ‘순종하다’는 해석을 앞세울 수 있어 본문 의미를 과도하게 좁히지 않도록 했습니다.
- source_word: ὅτι
  english_pob_choice: because
  chosen_korean: 때문입니다
  alternatives_korean:
  - 곧
  - 라는 사실을
  - 왜냐하면
  lexicon: BDAG
  rationale: 문맥상 원인적 ὅτι를 자연스러운 한국어 원인 표현으로 옮겼습니다. 선언문 구조를 해치지 않으면서 인과를 분명히 합니다.
theological_decisions:
- issue: ‘하나님에게서 온’의 신학적 범위
  chosen_reading: 출처/근원 언어를 유지하고, 이를 곧바로 특정 교리 범주로 환원하지 않았습니다.
  alternative_readings:
  - 하나님께 속한
  - 거듭난
  - 택함받은
  rationale: 문맥은 예수의 대적자들과 참된 귀속의 대비를 말하지만, 본문이 직접 말하는 것은 ‘하나님에게서 옴/아님’입니다. 번역은 이 긴장을 보존해야 합니다.
  doctrine_reference: source-origin contrast; preserve theological tension rather than resolve it.
- issue: ‘듣다’의 의미 범위
  chosen_reading: 본문에서는 ‘듣다’를 본문어휘로 유지하고, 순종의 함의를 본문 밖에서 강요하지 않았습니다.
  alternative_readings:
  - 순종하다
  - 받아들이다
  rationale: 문맥상 참으로 듣는 것은 응답을 포함할 수 있지만, 본문은 먼저 ‘듣다’라는 동사를 사용합니다. 해석을 본문에 앞세우지 않기 위해 직역적 핵심을 유지했습니다.
  doctrine_reference: original-language primacy; avoid importing interpretation into the main text.
