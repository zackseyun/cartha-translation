    issue: δὲ를 ‘그때’로 번역함
    rationale: δὲ는 시간 표지로 단정되기보다 연결·전환을 나타내므로 ‘그런데’가 원문 기능을 더 잘 보존합니다.
  - severity: medium
    issue: ἄγουσιν을 ‘끌고 와서’로 번역함
    rationale: 문맥상 적대적 행동일 수 있으나 ἄγω 자체는 ‘데리고 오다/가져오다’의 넓은 뜻입니다. ‘끌고 오다’는 원문이 명시하지 않은 강제성을 강화할 수 있습니다.
  - severity: low
    issue: ‘간음 중에 붙잡힌’의 비자연스러운 표현
    rationale: 의미는 대체로 맞지만 현대 한국어에서는 ‘간음하다가 붙잡힌’이 더 자연스럽고 원문의 상황도 유지합니다.
