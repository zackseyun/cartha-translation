id: JHN.8.3
reference: John 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγουσιν δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι πρὸς αὐτὸν γυναῖκα ἐν μοιχείᾳ κατειλημμένην· καὶ στήσαντες αὐτὴν ἐν μέσῳ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/003.yaml
  text: Then[a] the scribes and the Pharisees brought to him a woman caught in adultery, and having set her in the midst,
  footnotes:
  - marker: a
    text: Continuation of the story of the woman caught in adultery (John 7:53–8:11). See note on John 7:53.
    reason: textual_critical
translation:
  language: ko
  text: 그때 서기관들과 바리새인들이 간음 중에 붙잡힌 한 여자를 그에게 끌고 와서, 그녀를 한가운데 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 ‘간음하다 잡힌 여인’ 이야기(요 7:53–8:11)의 계속입니다. 요 7:53의 주석을 보십시오.
    reason: textual_variant
lexical_decisions:
- source_word: Ἄγουσιν
  english_pob_choice: brought
  chosen_korean: 끌고 와서
  alternatives_korean:
  - 데리고 와서
  - 가져와서
  lexicon: BDAG
  rationale: 역사적 현재로 제시된 동작을 한국어 서술에서는 자연스러운 과거 맥락의 동작으로 옮기되, 강압적으로 끌어오는 뉘앙스를 살려 문맥의 적대성을 드러냈습니다.
- source_word: γυναῖκα ἐν μοιχείᾳ κατειλημμένην
  english_pob_choice: a woman caught in adultery
  chosen_korean: 간음 중에 붙잡힌 한 여자
  alternatives_korean:
  - 간음하다가 붙잡힌 한 여자
  - 간음 현장에서 붙잡힌 한 여자
  lexicon: BDAG
  rationale: κατειλημμένην의 ‘붙잡히다/발각되다’ 의미를 살려 ‘간음 중에 붙잡힌’으로 옮겼고, ‘여자’는 문맥상 자연스러운 기본어를 택했습니다.
- source_word: στήσαντες αὐτὴν ἐν μέσῳ
  english_pob_choice: having set her in the midst
  chosen_korean: 그녀를 한가운데 세웠습니다
  alternatives_korean:
  - 그녀를 한가운데에 놓았습니다
  - 그녀를 가운데 세웠습니다
  lexicon: BDAG
  rationale: στήσαντες의 ‘세우다/자리 잡게 하다’를 반영해 물리적으로 사람들 앞에 세워 둔 장면을 살렸고, ἐν μέσῳ는 ‘한가운데’로 간결하게 표현했습니다.
theological_decisions:
- issue: 이 절의 서사적 연결과 본문 위치
  chosen_reading: 문장 시작의 ‘그때’로 앞 절과의 연결을 드러냈습니다.
  alternative_readings:
  - ‘그리고’로 단순 연결
  - 시간 표지 없이 바로 시작
  rationale: 영어 POB의 Then과 그 뒤의 누락된 이야기 연속성을 반영해, 독자가 본문 단락의 이어짐을 자연스럽게 이해하도록 했습니다.
  doctrine_reference: 본문비평/서사 연결
- issue: 간음 사건의 묘사 강도
  chosen_reading: ‘간음 중에 붙잡힌’으로 사건의 성격을 직접적으로 유지했습니다.
  alternative_readings:
  - ‘간음하다가 들킨’처럼 완화
  - ‘간음한’으로 축소
  rationale: 원문의 전치사구와 분사구가 암시하는 공개적 발각의 긴장을 약화하지 않기 위해, 직접적인 사건 묘사를 유지했습니다.
  doctrine_reference: 본문 의미 보존
