review_pass:
  verdict: revise
  source_fidelity: 원문의 δὲ는 단순한 시간 부사라기보다 서사 전환·연결의 기능이므로 ‘그때’보다 ‘그런데’가 더 직접적입니다. ἄγουσιν은 ‘데리고 오다’로 충분하며, ‘끌고 오다’가 덧붙이는 강한 강제성은 본 동사 자체에 명시되어 있지 않습니다. ‘간음하다가 붙잡힌’과 ‘한가운데에 세웠습니다’는 각각 ἐν μοιχείᾳ κατειλημμένην 및 στήσαντες αὐτὴν ἐν μέσῳ를 자연스럽고 충실하게 반영합니다.
  naturalness: ‘간음 중에 붙잡힌’은 현대 표준 한국어에서 다소 경직되고 어색합니다. ‘간음하다가 붙잡힌’이 자연스럽습니다. 사람을 다시 가리킬 때 ‘그녀’보다 ‘그 여자를’이 이 문맥의 한국어 서술에서 더 자연스럽습니다.
  terminology: ‘서기관들’, ‘바리새인들’, ‘간음’은 성경 번역의 통상적이고 적절한 용어입니다. 본문비평 관련 주석은 영어 POB 감사 기록의 범위와 의미를 유지합니다.
  issues:
