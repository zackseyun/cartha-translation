id: JHN.8.24
reference: John 8:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
  footnotes:
  - marker: a
    text: Or, more literally, 'that I am.' The Greek does not state an explicit predicate after 'I am,' and the wording may carry deeper resonance in John's Gospel.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 내가 너희에게 말했습니다. 너희는 너희 죄 가운데서 죽을 것입니다. 만일 너희가 내가[a] 나임을 믿지 않으면, 너희는 너희 죄 가운데서 죽을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 나임을’입니다. 그리스어는 ‘나는 …이다’ 뒤에 명시적인 보어를 제시하지 않으며, 이 표현은 요한복음에서 더 깊은 울림을 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  english_pob_choice: So I told you
  chosen_korean: 그러므로 내가 너희에게 말했습니다
  alternatives_korean:
  - 그래서 내가 너희에게 말했습니다
  - 그러므로 내가 너희에게 말했습니다
  lexicon: SBLGNT; BDAG
  rationale: οὖν의 논리적 연결을 ‘그러므로’로, εἶπον의 과거를 ‘말했습니다’로 옮겨 담화 흐름을 분명히 했습니다. dative ὑμῖν은 ‘너희에게’로 자연스럽게 처리했습니다.
- source_word: ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν
  english_pob_choice: you will die in your sins
  chosen_korean: 너희는 너희 죄 가운데서 죽을 것입니다
  alternatives_korean:
  - 너희는 너희 죄 안에서 죽을 것입니다
  - 너희는 너희 죄 가운데 죽을 것입니다
  lexicon: BDAG
  rationale: 복수형 ἁμαρτίαις를 ‘죄들’로 풀 수도 있지만, 한국어에서는 관용적으로 ‘죄 가운데서’가 상태/영역을 가장 자연스럽게 드러냅니다. ‘가운데서’는 ἐν의 상태적 의미를 살리면서도 문장을 매끄럽게 합니다.
- source_word: ἐὰν γὰρ μὴ πιστεύσητε
  english_pob_choice: For unless you believe
  chosen_korean: 만일 너희가 … 믿지 않으면
  alternatives_korean:
  - 왜냐하면 만일 너희가 … 믿지 않으면
  - 너희가 … 믿지 않으면
  lexicon: BDAG
  rationale: γάρ과 ἐὰν μή의 결합을 한국어 조건문으로 자연스럽게 풀어, 앞선 진술의 근거를 제시하는 흐름을 살렸습니다. ‘만일 … 않으면’이 가장 직관적으로 대응합니다.
- source_word: ὅτι ἐγώ εἰμι
  english_pob_choice: that I am[a]
  chosen_korean: 내가[a] 누구인지를
  alternatives_korean:
  - 내가 누구인지를
  - 내가 있는 그대로라는 것을
  lexicon: BDAG
  rationale: 그리스어는 ἐγώ εἰμι 뒤에 명시적 보어가 없으므로, 한국어 본문에서는 의미를 드러내기 위해 ‘누구인지’를 보충했습니다. 다만 이 절의 절대적 자기선언 가능성을 보존하기 위해 각주로 더 문자적인 독법을 남겼습니다.
theological_decisions:
- issue: ἐγώ εἰμι의 번역에서 드러나는 자기동일시와 함의의 보존
  chosen_reading: 본문은 ‘내가 누구인지를 믿지 않으면’으로 읽되, 각주에서 ‘내가’라는 더 문자적인 표현을 남겨 절대적 자기선언의 울림을 보존했습니다.
  alternative_readings:
  - 내가 있다
  - 나는 있다
  - 내가 곧 나다
  rationale: 요한복음의 ἐγώ εἰμι는 단순한 자기소개를 넘는 함의를 가질 수 있으므로, 본문은 한국어 가독성을 확보하면서도 신학적 긴장을 완화하지 않도록 처리했습니다. 의미를 임의로 단정하지 않고, 원문의 여지를 각주로 남겼습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
