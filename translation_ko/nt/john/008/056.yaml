  source_fidelity: 원문의 주어·관계 표현, 두 동사의 시간적 진행, ‘내 날’의 비특정성을 대체로 충실히 반영합니다. 다만 ‘보려고’는 한국어에서 목적을 위해 기뻐했다는 뜻으로 다소 강하게 읽힐 수 있으므로, ἵνα절의 기대/내용 및 목적의 여지를 더 자연스럽게 보존하도록 조정하는 것이 안전합니다.
  naturalness: ‘아브라함, 곧 여러분의 아버지는’은 쉼표와 ‘곧’ 때문에 현대 한국어 문장으로 다소 부자연스럽습니다. ‘여러분의 아버지 아브라함은’이 원문의 동격 관계를 자연스럽게 전달합니다. 뒤의 암시된 목적어는 ‘그 날’로 받아 주면 ‘그것’보다 명확하고 자연스럽습니다.
