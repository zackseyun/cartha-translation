base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
  footnotes:
  - marker: a
    text: Or 'rejoiced to see my day' or 'exulted that he might see my day.' The Greek ἵνα-clause can be rendered in more than one closely related way.
    reason: lexical_alternative
  - marker: b
    text: '''My day'' may refer broadly to Jesus'' messianic day or fulfillment, without the verse itself specifying the exact event or time in view.'
    reason: alternative_reading
translation:
  language: ko
  text: 여러분의 아버지 아브라함은 내 날을 보게 될 것을 크게 기뻐했으며, 그 날을 보고 기뻐했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보게 될 것을’은 ἵνα + 접속법이 나타내는 목적 또는 기대/내용의 뉘앙스를 한국어로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 날’은 예수의 메시아적 날을 가리킬 수 있지만, 본문만으로 그 범위를 단정하지는 않습니다.
    reason: theological_note
