  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
  footnotes:
  - marker: a
    text: Or 'rejoiced to see my day' or 'exulted that he might see my day.' The Greek ἵνα-clause can be rendered in more than one closely related way.
    reason: lexical_alternative
  - marker: b
    text: '''My day'' may refer broadly to Jesus'' messianic day or fulfillment, without the verse itself specifying the exact event or time in view.'
    reason: alternative_reading
translation:
  language: ko
  text: 아브라함, 곧 여러분의 아버지는 내 날을 보려고 크게 기뻐했으며, 그것을 보고 기뻐했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보려고’는 ἵνα + 접속법의 목적/내용 뉘앙스를 한국어로 간결하게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 날’은 예수의 메시아적 날을 가리킬 수 있지만, 본문만으로 그 범위를 단정하지는 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: Ἀβραὰμ
  english_pob_choice: Abraham
  chosen_korean: 아브라함
  alternatives_korean:
  - 아브라함(아브람)
  lexicon: 고유명사
  rationale: 족장 이름은 현대 한국어 음역으로 옮기며, 표준적으로 굳어진 형태를 사용했습니다.
- source_word: ὁ πατὴρ ὑμῶν
  english_pob_choice: your father
  chosen_korean: 여러분의 아버지는
  alternatives_korean:
  - 너희의 아버지는
  - 여러분의 아버지
  lexicon: BDAG
  rationale: 청중을 향한 관계 표현을 자연스러운 한국어 소유 표현으로 살리되, 문맥상 호칭성을 분명히 했습니다.
- source_word: ἠγαλλιάσατο
  english_pob_choice: rejoiced
  chosen_korean: 크게 기뻐했으며
  alternatives_korean:
  - 기뻐했으며
  - 환호했으며
  - 크게 즐거워했으며
  lexicon: BDAG
  rationale: ἀγαλλιάω의 강한 기쁨/환희를 반영해 단순한 '기뻐하다'보다 강도를 높였고, 문장 전체의 흐름에 맞게 자연화했습니다.
- source_word: ἵνα ἴδῃ
  english_pob_choice: to see / that he would see
  chosen_korean: 보려고
  alternatives_korean:
  - 보게 되기를
  - 보도록
  - 볼 수 있도록
  lexicon: BDAG
  rationale: ἵνα + 접속법의 목적/내용 뉘앙스를 한국어에서 가장 간결하게 드러내는 형태로 옮겼습니다.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  english_pob_choice: my day
  chosen_korean: 내 날
  alternatives_korean:
  - 내가 맞이할 날
  - 나의 날
  lexicon: BDAG
  rationale: 직역성을 유지해 예수의 날에 대한 신학적 여지를 열어 두되, 한국어로도 어색하지 않게 정리했습니다.
- source_word: ἐχάρη
  english_pob_choice: was glad
  chosen_korean: 기뻐했습니다
  alternatives_korean:
  - 즐거워했습니다
  - 좋아했습니다
  lexicon: BDAG
  rationale: 앞의 ἠγαλλιάσατο와 어근이 다른 χαίρω 계열의 기쁨을 한국어에서는 무난한 과거형으로 살렸습니다.
theological_decisions:
- issue: ‘내 날’의 의미를 어디까지 특정할지
  chosen_reading: ‘내 날’을 그대로 유지해, 메시아적 성취나 예수의 사역·죽음·부활·재림 중 어느 한 항목으로 좁히지 않았습니다.
  alternative_readings:
  - 메시아의 날
  - 내가 오는 날
  - 구원의 날
  rationale: 본문 자체가 그 날의 범위를 명시하지 않으므로, 번역에서 해석을 과도하게 확정하지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
- issue: ἀγαλλιάω와 χαίρω의 기쁨 강도 구분
  chosen_reading: 앞절은 ‘크게 기뻐했으며’, 뒤는 ‘기뻐했습니다’로 나누어 표현했습니다.
  alternative_readings:
  - 둘 다 ‘기뻐했습니다’
  - 둘 다 ‘환호했습니다’
  rationale: 원문은 서로 다른 어휘를 사용하므로, 한국어에서도 동일 표현 반복을 피하고 감정의 결을 구분했습니다.
  doctrine_reference: 원어 어휘 구분 보존 원칙
