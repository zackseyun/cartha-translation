source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ ζητῶ τὴν δόξαν μου· ἔστιν ὁ ζητῶν καὶ κρίνων.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
  footnotes:
  - marker: a
    text: Or, more literally, 'there is the one who seeks and judges.' The implied object of 'seeks' is Jesus' glory from the previous clause.
    reason: lexical_alternative
  - marker: b
    text: The unnamed 'One' is commonly understood from context to refer to the Father, though the Greek does not state this explicitly here.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 나는 내 영광을 구하지 않습니다. 찾고 심판하시는 분이 계십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찾고’의 목적어는 앞 문장의 ‘내 영광’으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 이 ‘분’은 문맥상 아버지를 가리키는 것으로 흔히 이해되지만, 그리스어 본문은 여기서 그 신원을 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  english_pob_choice: But I
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 그리고 나는
  - 나는
  lexicon: BDAG
  rationale: δέ의 대조를 살려 앞선 문맥의 주장과 대비되는 전환으로 옮겼고, ἐγώ의 강조는 주어를 드러내어 반영했습니다.
- source_word: τὴν δόξαν μου
  english_pob_choice: my own glory
  chosen_korean: 내 영광
  alternatives_korean:
  - 나의 영광
  - 내가 드러내는 영광
  lexicon: BDAG
  rationale: δόξα는 여기서 자기 자신을 높이려는 영광/명예를 가리키므로 자연스러운 한국어로 간결하게 ‘내 영광’이라 옮겼습니다.
- source_word: ἔστιν ὁ ζητῶν καὶ κρίνων
  english_pob_choice: there is One who seeks it and judges
  chosen_korean: 찾고 심판하시는 분이 계십니다
  alternatives_korean:
  - 그것을 찾고 심판하시는 분이 계십니다
  - 찾고 심판하시는 이가 계십니다
  lexicon: BDAG
  rationale: ἔστιν의 존재 구문을 ‘계십니다’로 살리고, ζητῶν과 κρίνων의 현재 분사적 지속성을 존대 서술 ‘찾고 심판하시는’으로 자연스럽게 반영했습니다.
- source_word: κρίνων
  english_pob_choice: judges
  chosen_korean: 심판하시는
  alternatives_korean:
  - 판단하시는
  - 판결하시는
  lexicon: BDAG
  rationale: 요한복음의 법정적·판단적 문맥에서 κρίνω는 단순 판단보다 ‘심판하다’가 더 직접적으로 대응합니다.
theological_decisions:
- issue: 누가 '찾고 심판하시는 분'인가 하는 익명성
  chosen_reading: 본문은 주어를 이름으로 밝히지 않고 ‘분’으로 남겨 두었습니다.
  alternative_readings:
  - 아버지께서 찾고 심판하십니다
  - 찾고 심판하시는 분이 바로 아버지이십니다
  rationale: 요한 문맥상 아버지를 가리키는 것으로 이해되지만, 헬라어 본문 자체가 여기서는 명시적으로 말하지 않으므로 번역문도 그 절제를 유지했습니다.
  doctrine_reference: 원문이 허용하는 익명성을 보존하여 문맥적 해석을 독자에게 열어 둡니다.
