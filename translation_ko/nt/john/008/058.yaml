    rationale: 한국어에서는 생략 가능하지만, 원문의 명시된 1인칭 대명사가 뒤의 ‘나는’과 이루는 강조를 본문에서 보존하는 편이 최적 등가에 더 충실합니다.
  - severity: high
    issue: 각주 a와 b의 표지 및 내용이 원문의 어휘 쟁점과 맞지 않습니다.
    rationale: 현 초안의 a는 ‘그들에게’에 붙지만 실질적 대안도 아니며, γίνομαι의 대안은 b에만 있습니다. 또한 ἐγώ εἰμί의 가능한 대안 독법에 대한 각주가 빠져 있습니다. 표지를 각각 ‘생기기’와 ‘존재합니다’에 붙여야 합니다.
