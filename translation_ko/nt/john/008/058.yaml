  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
  footnotes:
  - marker: a
    text: 'Or, ''before Abraham was born.'' The Greek verb is broader: ''came to be'' or ''came into existence.'''
    reason: lexical_alternative
  - marker: b
    text: Or, 'I have been.' The Greek reads 'I am,' preserving the present-tense form and its possible theological resonance.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다[a]. 「진실로 진실로 너희에게 말합니다. 아브라함이 생기기[b] 전부터 나는 있습니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “그들에게”. 헬라어 본문에 있는 목적어를 자연스럽게 풀어 쓴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, “태어나기”. 헬라어 동사 γίνομαι는 단순한 출생보다 넓게 “생기다”, “존재하게 되다”를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  english_pob_choice: Jesus said to them
  chosen_korean: 예수께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그들에게 말씀하셨습니다
  - 예수께서 그들에게 이르셨습니다
  lexicon: SBLGNT
  rationale: 서술문에 어울리는 직접적 대응으로, 공손한 합쇼체와 자연스러운 회중 낭독감을 함께 살렸습니다.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  english_pob_choice: Truly, truly, I say to you
  chosen_korean: 진실로 진실로 너희에게 말합니다
  alternatives_korean:
  - 아멘 아멘 내가 너희에게 말합니다
  - 진실로 진실로 내가 너희에게 말합니다
  lexicon: BDAG
  rationale: 중복된 강조를 한국어에서 가장 자연스럽고 분명하게 전달하기 위해 '진실로 진실로'로 옮겼고, 반복되는 요한식 선포의 힘을 보존했습니다.
- source_word: πρὶν Ἀβραὰμ γενέσθαι
  english_pob_choice: before Abraham came to be
  chosen_korean: 아브라함이 생기기 전부터
  alternatives_korean:
  - 아브라함이 존재하기 전부터
  - 아브라함이 태어나기 전부터
  lexicon: BDAG
  rationale: γίνομαι의 폭넓은 의미를 반영해 '생기다'를 택했으며, 단순한 출생으로 좁히는 번역은 피했습니다.
- source_word: ἐγὼ εἰμί
  english_pob_choice: I am
  chosen_korean: 나는 있습니다
  alternatives_korean:
  - 나는 나입니다
  - 나는 있습니다
  - 나는 존재합니다
  lexicon: BDAG
  rationale: 현재형의 직설성과 절대적 자기 진술을 살리면서도 한국어로는 자연스럽게 읽히도록 옮겼습니다. 다만 신학적 함의를 지우지 않기 위해 현재형을 유지했습니다.
- source_word: Ἀβραὰμ
  english_pob_choice: Abraham
  chosen_korean: 아브라함
  alternatives_korean:
  - 아브라함
  lexicon: SBLGNT
  rationale: 현대 한국어 성경에서 널리 쓰이는 고유명사 표기를 따랐습니다.
theological_decisions:
- issue: ἐγὼ εἰμί의 현재형과 기독론적 울림 보존
  chosen_reading: 나는 있습니다
  alternative_readings:
  - 나는 있었다
