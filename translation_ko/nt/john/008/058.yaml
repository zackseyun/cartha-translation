  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
  footnotes:
  - marker: a
    text: 'Or, ''before Abraham was born.'' The Greek verb is broader: ''came to be'' or ''came into existence.'''
    reason: lexical_alternative
  - marker: b
    text: Or, 'I have been.' The Greek reads 'I am,' preserving the present-tense form and its possible theological resonance.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. 「진실로 진실로 내가 너희에게 말합니다. 아브라함이 생기기[a] 전부터 나는 존재합니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “태어나기.” 그리스어 동사 γίνομαι는 단순한 출생보다 넓게 “생기다”, “존재하게 되다”를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, “나는 계속 있어 왔습니다.” 그리스어는 현재형으로 직역하면 “나는 있다”이며, 현재형의 형태와 가능한 신학적 울림을 보존합니다.
    reason: alternative_reading
