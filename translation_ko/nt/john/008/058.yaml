    issue: 본문의 ‘나는 있습니다’가 현대 한국어에서 부자연스럽고 절대적 존재 진술을 충분히 전달하지 못합니다.
    rationale: ἐγώ εἰμι는 문맥상 보어 없는 강조된 현재형입니다. ‘존재합니다’는 존재의 의미를 명시하면서 현재형과 강조를 유지합니다.
