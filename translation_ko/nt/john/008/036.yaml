id: JHN.8.36
reference: John 8:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
  footnotes:
  - marker: a
    text: Or 'really free' or 'free indeed.' The Greek adverb emphasizes that this freedom is genuine and complete.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 아들이 여러분을 자유롭게 하시면, 여러분은 참으로 자유로울 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘참으로’는 ὄντως의 강조를 반영합니다. ‘정말로’, ‘진정으로’, ‘실로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  english_pob_choice: So if / Therefore, if
  chosen_korean: 그러므로 … 하시면
  alternatives_korean:
  - 그래서 … 하시면
  - 그러니 … 하시면
  lexicon: BDAG
  rationale: οὖν의 논리적 귀결을 살리기 위해 문두에 ‘그러므로’를 두고, 조건절은 자연스러운 한국어 조건 표현으로 처리했습니다.
- source_word: ὁ υἱός
  english_pob_choice: the Son
  chosen_korean: 아들
  alternatives_korean:
  - 아드님
  - 아들(메시아)
  lexicon: BDAG
  rationale: 요한복음의 문맥상 예수를 가리키는 칭호이므로 ‘아들’로 옮기되, 본문 자체가 요구하지 않는 설명적 보충은 넣지 않았습니다.
- source_word: ἐλευθερόω / ἐλεύθεροι
  english_pob_choice: sets you free / free
  chosen_korean: 자유롭게 하시다 / 자유롭다
  alternatives_korean:
  - 해방하다 / 해방된
  - 풀어 주시다 / 풀려나다
  lexicon: BDAG
  rationale: 동사의 행위성과 형용사의 결과 상태를 구분해, 영어 POB의 ‘sets free / free’에 대응되는 자연스러운 현대 한국어 표현으로 유지했습니다.
- source_word: ὄντως
  english_pob_choice: truly
  chosen_korean: 참으로
  alternatives_korean:
  - 정말로
  - 진정으로
  - 실로
  lexicon: BDAG
  rationale: ὄντως의 ‘진정한, 실제의’라는 강조를 ‘참으로’로 간결하게 살려, 단순한 정도부사 이상의 진실성·완전성을 드러냈습니다.
theological_decisions:
- issue: ‘아들’의 기독론적 칭호 유지
  chosen_reading: 예수를 가리키는 독특한 칭호로서 ‘아들’을 유지했습니다.
  alternative_readings:
  - 보통 의미의 아들
  - 하나님의 아들로 풀어 쓰기
  rationale: 문맥상 예수의 자기 계시와 권위를 드러내는 표현이므로, 본문에 없는 보충 설명을 덧붙이지 않고 칭호성을 유지했습니다.
  doctrine_reference: 요한복음의 그리스도론; 니케아 신경의 성자 고백과 양립
- issue: 자유의 범위
  chosen_reading: 정치적·사회적·내적 자유로 한정하지 않고, 본문이 말하는 참된 자유를 그대로 남겼습니다.
  alternative_readings:
  - 영적 자유로만 한정
  - 사회적 해방으로만 한정
  rationale: 문맥은 죄의 종됨을 배경으로 하지만, ὄντως가 강조하는 것은 자유의 참됨과 충만함이므로 해석을 좁히지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 의미 범위를 보존'
