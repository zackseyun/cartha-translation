revisions:
- from: 그러므로 예수께서 자기를 믿은 유대인들에게 말씀하셨습니다. “너희가 내 말 안에 머물면, 참으로 너희는 내 제자들입니다.”[a]
  to: 그러자 예수께서는 예수를 믿은 유대인들에게 말씀하셨습니다. “너희가 내 말 안에 머물러 있으면, 너희는 참으로 내 제자들입니다.”[a]
  rationale: 예수에 대한 지시를 명확히 하고, 여격 αὐτῷ에 관한 각주의 문법 오류를 바로잡았습니다. 완료분사의 결과 상태를 반영하는 대안 번역을 각주에 두되, 본문은 영어 POB의 ‘had believed him’에 상응하는 과거형을 유지했습니다. ‘머물러 있으면’으로 μένω의 지속적 뉘앙스를 자연스럽게 살렸습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:18Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 οὖν, 미완료 ἔλεγεν, 완료분사 πεπιστευκότας, 조건절, 그리고 ‘내 말 안에 머물다’라는 표현을 전반적으로 잘 반영합니다. 다만 ‘자기를 믿은’의 ‘자기’는 한국어에서 유대인들 자신을 가리키는 것으로도 읽힐 수 있어, 예수를 가리키는 지시 대상이 불명확합니다. 또한 현 각주는 여격 αὐτῷ를 부정하는 듯한 문법 설명을 담고 있어 원문과 맞지 않습니다.
  naturalness: ‘내 말 안에 머물면’도 이해할 수 있으나, ‘머물러 있으면’이 μένω의 지속성을 더 자연스럽게 드러냅니다. ‘그러자’는 이 문맥에서 οὖν의 담화 연결을 자연스럽게 옮깁니다.
  terminology: ‘말’, ‘제자들’, ‘참으로’는 요한복음의 어휘와 현대 표준 한국어의 격식 있는 문체에 적절합니다. ‘예수를 믿은’은 한국어에서 자연스럽고, 원문의 여격이 지닌 ‘그를 믿다/그에게 신뢰를 두다’의 표현상 논점을 본문에 과도하게 해석하여 넣지 않습니다.
