id: JHN.8.31
reference: John 8:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
  footnotes:
  - marker: a
    text: Or, “to the Jews who had believed in him.” The Greek says literally “who had believed him.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 예수께서 자기를 믿은 유대인들에게 말씀하셨습니다. “너희가 내 말 안에 머물면, 참으로 너희는 내 제자들입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '대안: “그를 믿은 유대인들에게.” 원문은 문법적으로 ‘그에게’가 아니라 여격 ‘자기/그’를 사용합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν οὖν
  english_pob_choice: So Jesus was saying
  chosen_korean: 그러므로 예수께서 말씀하셨습니다
  alternatives_korean:
  - 그래서 예수께서 말씀하고 계셨습니다
  - 그러므로 예수께서 계속 말씀하셨습니다
  lexicon: BDAG
  rationale: οὖν의 연결감을 ‘그러므로’로 살리고, ἔλεγεν의 미완료상은 한국어에서 자연스러운 서술로 풀어 과도한 진행형 표현은 피했습니다.
- source_word: τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  english_pob_choice: to the Jews who had believed him
  chosen_korean: 자기를 믿은 유대인들에게
  alternatives_korean:
  - 자기를 믿어 온 유대인들에게
  - 그를 믿은 유대인들에게
  lexicon: BDAG
  rationale: dative αὐτῷ를 원문대로 ‘자기’를 목적어로 살려 ‘그를’보다 더 직접적으로 옮겼고, πεπιστευκότας는 완료 분사이므로 ‘믿은’으로 옮겨 이전에 이루어진 믿음을 드러냈습니다.
- source_word: μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ
  english_pob_choice: If you remain in my word
  chosen_korean: 너희가 내 말 안에 머물면
  alternatives_korean:
  - 너희가 내 말에 계속 있으면
  - 너희가 내 가르침 안에 머물면
  lexicon: BDAG
  rationale: μένω의 관계적·지속적 의미를 ‘머물다’로 살렸고, λόγος는 문맥상 예수의 말씀/가르침을 가리키지만 요한복음의 표현성을 살려 ‘말’로 옮겼습니다.
- source_word: ἀληθῶς μαθηταί μού ἐστε
  english_pob_choice: you are truly my disciples
  chosen_korean: 참으로 너희는 내 제자들입니다
  alternatives_korean:
  - 너희는 참으로 내 제자들입니다
  - 정말 너희는 내 제자들입니다
  lexicon: BDAG
  rationale: ἀληθῶς의 진정성 강조를 ‘참으로’로 옮겼고, μαθηταί는 복음서 맥락에서 표준적으로 ‘제자들’로 번역했습니다.
theological_decisions:
- issue: πιστεύω + 여격 αὐτῷ의 의미
  chosen_reading: ‘자기를 믿은’으로 옮겨, 본문에 없는 εἰς를 덧붙이지 않았습니다.
  alternative_readings:
  - 그를 믿은
  - 그에게 믿음을 둔
  rationale: 요한복음의 통상적 표현인 ‘믿다’ 신학을 자동으로 확장하기보다, 여격만 있는 원문 구조를 그대로 드러내는 것이 본문 관찰에 더 충실합니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition); §3 (Preserve theological tension rather than resolve it)
