  source_fidelity: ‘계속 물었습니다’는 미완료형 ἔλεγον이 나타내는 반복적·지속적 발화를 자연스럽게 반영합니다. 예수님의 답변은 난해한 Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν을 영어 POB의 채택 해석(‘처음부터 말해 온 바로 그것’)에 맞추되, 정체를 묻는 질문에 대한 한국어 답변으로서 암시된 자기 지시를 ‘바로 그 사람’으로 드러냈습니다.
  naturalness: 초안의 ‘내가 처음부터 여러분에게 말해 온 바로 그것입니다’는 한국어에서 지시 대상이 불분명하고 자기 정체를 답하는 문장으로 다소 부자연스럽습니다. ‘나는 처음부터 여러분에게 말해 온 바로 그 사람입니다’는 현대 표준어 합쇼체에서 자연스럽고 문맥상 명료합니다.
