base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: ko
  text: 그들이 예수님께 “당신은 누구십니까?”라고 계속 물었습니다. 예수님께서 그들에게 말씀하셨습니다. “나는 처음부터 여러분에게 말해 온 바로 그 사람입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “처음부터 내가 여러분에게 말해 온 그대로입니다.” 그리스어 구문은 해석이 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον οὖν αὐτῷ
  english_pob_choice: So they were saying to him
  chosen_korean: 그들이 예수님께 “...?”라고 계속 물었습니다
  alternatives_korean:
  - 그래서 그들이 예수님께 말했습니다
  - 그들이 예수님께 묻고 있었습니다
  lexicon: ἔλεγον (imperfect)
  rationale: 미완료 시제의 반복·지속성을 살려 단발성보다 ‘계속 물었습니다’로 옮겼습니다.
- source_word: Σὺ τίς εἶ;
  english_pob_choice: Who are you?
  chosen_korean: “당신은 누구십니까?”
  alternatives_korean:
  - “당신은 누구입니까?”
  - “네가 누구냐?”
  lexicon: σύ + τίς εἰμί
  rationale: 예수님께 대한 직접 질문이므로 높임을 유지하되, 원문의 정면 질문성을 살려 직역적으로 옮겼습니다.
- source_word: Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν
  english_pob_choice: Just what I have been telling you from the beginning
  chosen_korean: 내가 처음부터 여러분에게 말해 온 바로 그것입니다
  alternatives_korean:
  - 내가 처음부터 여러분에게 말한 바로 그것입니다
  - 나는 처음부터 여러분에게 계속 말해 온 것입니다
  lexicon: τὴν ἀρχήν + ὅ τι + λαλῶ
  rationale: 문법적으로 난해한 구절을 영어 POB의 해석을 따라 ‘바로 그것입니다’로 처리하되, 현재완료적 지속을 ‘말해 온’으로 살렸습니다.
theological_decisions:
- issue: 예수님의 답변의 해석 범위
  chosen_reading: 예수님은 자신의 정체를 추상적으로 새로 설명하기보다, 지금까지 이미 말해 온 자신의 말과 증언 자체를 가리키십니다.
  alternative_readings:
  - ‘내가 처음부터 말해 온 사람입니다’처럼 인격적 자칭으로 읽는 해석
  - ‘나는 시작부터 그것이다’처럼 더 절대적 진술로 읽는 해석
  rationale: 본문의 문법과 영어 POB의 최종 채택을 따라, 질문에 대한 답을 자기 발언의 동일성/일관성으로 제시하는 쪽을 유지했습니다.
  doctrine_reference: 요한복음 8장의 문맥상 예수님의 증언과 정체성 계시
