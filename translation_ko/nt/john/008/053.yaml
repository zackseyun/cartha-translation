id: JHN.8.53
reference: John 8:53
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
  footnotes:
  - marker: a
    text: Or, more literally, 'Are you not greater than our father Abraham...?' The Greek question is framed to expect a negative answer.
    reason: lexical_alternative
  - marker: b
    text: Or 'Who do you make yourself?' The expression means 'Who do you make yourself out to be?' or 'Who are you claiming to be?'
    reason: lexical_alternative
translation:
  language: ko
  text: “당신이 우리 조상 아브라함보다 더 크십니까? 그는 죽었습니다. 예언자들도 죽었습니다. 당신 자신을 누구로 만드십니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “당신은 우리 조상 아브라함보다 더 크지 않습니까?” 헬라어의 질문 형식은 부정의 답을 기대합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “당신은 자신을 누구로 만드십니까?” 이 표현은 “당신이 누구라고 자처하십니까?”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ μείζων εἶ
  english_pob_choice: Surely you are not greater
  chosen_korean: “당신이 …보다 더 크십니까?”
  alternatives_korean:
  - “당신은 …보다 더 크지 않습니까?”
  - “설마 당신이 …보다 더 크십니까?”
  lexicon: BDAG
  rationale: μή + σύ가 기대하는 부정의 반문이라는 점을 살려, 직설적 질문 형식으로 옮기되 도전적인 뉘앙스를 유지했습니다. 한국어에서는 ‘더 크십니까?’가 위상·권위·중요성의 비교를 자연스럽게 담습니다.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  english_pob_choice: our father Abraham
  chosen_korean: 우리 조상 아브라함
  alternatives_korean:
  - 우리 아버지 아브라함
  - 우리 조상 아브라함
  lexicon: BDAG
  rationale: πατήρ는 이 문맥에서 혈통적·언약적 조상이라는 호칭이므로, 한국어에서는 ‘우리 조상’이 가장 자연스럽고 오해가 적습니다.
- source_word: ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον
  english_pob_choice: who died? The prophets also died
  chosen_korean: 그는 죽었습니다. 예언자들도 죽었습니다.
  alternatives_korean:
  - 그는 죽었습니다. 그리고 예언자들도 죽었습니다.
  - 그는 죽었고, 예언자들도 죽었습니다.
  lexicon: BDAG
  rationale: 아브라함과 예언자들의 죽음을 역사적 사실로 병렬 제시하므로, 단순 과거형으로 압축해 자연스럽게 옮겼습니다. ‘예언자들’은 구약적 맥락의 προφῆται를 직접적으로 드러냅니다.
- source_word: τίνα ⸀σεαυτὸν ποιεῖς
  english_pob_choice: Who do you make yourself out to be?
  chosen_korean: 당신 자신을 누구로 만드십니까?
  alternatives_korean:
  - 당신은 자신을 누구라고 하십니까?
  - 당신은 자신을 누구로 여기십니까?
  lexicon: BDAG
  rationale: 관용구의 핵심은 자신을 어떤 인물로 자처하느냐는 공격적 질문이므로, ‘누구로 만드십니까?’로 의미를 살렸습니다. ‘자신을’은 반사대명사의 직접성을 유지합니다.
theological_decisions:
- issue: 예수의 신분에 대한 적대적 반문 처리
  chosen_reading: 질문이 기대하는 부정의 뉘앙스를 살리되, 번역문 자체에서 결론을 미리 판정하지 않고 긴장을 유지했습니다.
  alternative_readings:
  - “당신은 우리 조상 아브라함보다 더 크지 않습니까?”처럼 단순 비교문으로 완화하는 방식
  rationale: 본문의 μή는 부정적 답을 기대하는 수사적 질문이므로, 상대의 도전과 불신을 그대로 드러내는 것이 소스 충실합니다.
  doctrine_reference: 본문의 수사적 긴장 보존
- issue: ‘예언자들’의 역사적 죽음 언급
  chosen_reading: 아브라함과 예언자들의 죽음을 실제 과거 사실로 표현했습니다.
  alternative_readings:
  - ‘죽었습니다’ 대신 ‘이미 죽었습니다’처럼 현재적 완료감을 강조하는 방식
  rationale: 헬라어 aorist는 여기서 단순한 역사적 사실 진술을 이루므로, 과도한 현재적 신학 해석을 덧붙이지 않았습니다.
  doctrine_reference: 서술 시제 보존
