    rationale: 본문의 ‘나를 찾을 것입니다’와 동일하므로 대안 각주로 기능하지 않습니다. ζητέω의 가능한 반복·탐색의 뉘앙스를 ‘나를 찾아다닐 것입니다’로 제시할 수 있습니다.
