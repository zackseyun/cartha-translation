id: JHN.8.21
reference: John 8:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
  footnotes:
  - marker: a
    text: Or 'you will look for me.' The verb can denote searching for someone, and in John it may also carry a deeper spiritual sense.
    reason: lexical_alternative
  - marker: b
    text: 'Greek singular: ''in your sin.'' Some translations render ''in your sins,'' but the singular likely emphasizes a continuing condition rather than individual acts.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you cannot come.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 예수께서 다시 그들에게 말씀하셨습니다[a]. “나는 떠나가고 있으며, 너희는 나를 찾을 것이며, 너희 죄[b] 가운데서 죽을 것입니다. 내가 가는 곳에는 너희가 올 수 없습니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 찾아다닐 것입니다.’ 이 동사는 사람을 찾는다는 뜻을 지니며, 요한복음에서는 더 깊은 영적 의미를 띨 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 단수형으로 ‘너희 죄 안에서’입니다. 일부 번역은 복수형 ‘너희 죄들 안에서’로 옮기지만, 단수형은 개별 행위들보다 지속적인 상태를 더 잘 드러낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘너희는 올 수 없다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν οὖν πάλιν
  english_pob_choice: So he said to them again
  chosen_korean: 그래서 예수께서 다시 그들에게 말씀하셨습니다
  alternatives_korean:
  - 그러므로 예수께서 다시 그들에게 말씀하셨습니다
  - 그런데 예수께서 다시 그들에게 말씀하셨습니다
  lexicon: SBLGNT / BDAG
  rationale: οὖν의 담화 연결을 ‘그래서’로 자연스럽게 살리고, πάλιν은 ‘다시’로 옮겨 반복 발화를 분명히 했습니다.
- source_word: ὑπάγω
  english_pob_choice: am going away
  chosen_korean: 떠나갈 것이고
  alternatives_korean:
  - 가실 것이고
  - 떠나실 것이고
  lexicon: BDAG
  rationale: 요한복음에서 ὑπάγω는 단순 이동보다 이별/떠남의 뉘앙스가 있어, 한국어에서는 ‘떠나가다’로 그 분리를 드러냈습니다.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  english_pob_choice: in your sin
  chosen_korean: 너희 죄 가운데서
  alternatives_korean:
  - 너희 죄 안에서
  - 너희 죄 속에서
  lexicon: BDAG
  rationale: 헬라어 단수 ἁμαρτίᾳ의 상태성을 살리기 위해 ‘죄들’이 아니라 단수적 상태를 드러내는 ‘죄 가운데서’를 택했습니다.
- source_word: οὐ δύνασθε ἐλθεῖν
  english_pob_choice: you are not able to come
  chosen_korean: 너희가 올 수 없습니다
  alternatives_korean:
  - 너희는 올 수 없습니다
  - 너희는 올 능력이 없습니다
  lexicon: BDAG
  rationale: δύνασθε의 가능/능력 어감을 한국어 ‘~할 수 없다’로 옮겨, 단순한 금지보다 도달 불가능성을 분명히 했습니다.
theological_decisions:
- issue: ἁμαρτίᾳ의 단수성 보존
  chosen_reading: ‘너희 죄 가운데서’로 옮겨, 한 사람 한 사람의 ‘죄들’보다 죄의 지속적 상태를 드러냈습니다.
  alternative_readings:
  - 너희 죄들 가운데서
  - 너희의 죄들 안에서
  rationale: 본문의 단수형을 보존해, 요한복음 문맥에서의 지속적 불신/분리 상태라는 긴장을 본문에 남겨 두었습니다.
  doctrine_reference: 'Translation philosophy: preserve source tensions'
- issue: ὑπάγω의 출발·이별 뉘앙스
  chosen_reading: ‘떠나갈 것이고’로 옮겨 단순한 이동이 아니라 예수의 떠남을 암시했습니다.
  alternative_readings:
  - 가실 것이고
  - 떠나실 것이고
  rationale: 요한 문맥에서 예수의 ‘감’은 수난과 아버지께로의 돌아감을 향해 열려 있으므로, 본문은 그 함의를 약하게만 반영하도록 했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
