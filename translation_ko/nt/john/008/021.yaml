  to: 이에 예수께서 다시 그들에게 말씀하셨습니다[a]. “나는 떠나가고 있으며, 너희는 나를 찾을 것이며, 너희 죄[b] 가운데서 죽을 것입니다. 내가 가는 곳에는 너희가 올 수 없습니다[c].”
  rationale: 현재형 ὑπάγω를 ‘떠나가고 있으며’로 옮겨 원문의 시제와 떠남의 뉘앙스를 보존했습니다. ‘죄’는 단수로 유지하고, 각주 표지를 각각 해당하는 본문 어구로 옮겼습니다. 또한 동일 표현을 반복하던 a 각주를 실질적인 어휘 대안으로 수정했습니다.
