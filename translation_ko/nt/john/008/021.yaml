review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ὑπάγω의 현재형은 ‘떠나갈 것이고’보다 ‘떠나가고 있으며’가 더 직접적으로 반영합니다. 또한 ἐν τῇ ἁμαρτίᾳ ὑμῶν의 단수 ‘죄’와 관련 각주 표지는 해당 어구에 붙어야 합니다.
  naturalness: 합쇼체 서술과 예수의 직접 화법은 자연스럽습니다. 다만 ‘이에’와 ‘떠나가고 있으며’를 사용하면 문맥 연결과 원문의 시제가 더 자연스럽고 정확하게 드러납니다.
  terminology: ‘죄’, ‘죽을 것입니다’, ‘올 수 없습니다’는 적절합니다. ‘너희 죄 가운데서’는 한국어 성경 문체에서도 자연스러우며 단수형을 유지합니다. 기존 a 각주는 본문과 동일한 표현을 대안으로 제시하므로 실제 대안인 ‘나를 찾아다닐 것입니다’로 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: ὑπάγω의 현재형을 ‘떠나갈 것이고’로 미래형만 사용함
    rationale: 그리스어 현재형은 예수의 진행 중인 떠남을 표현합니다. 한국어에서는 ‘떠나가고 있으며’가 현재형과 이별의 뉘앙스를 함께 더 잘 보존합니다.
  - severity: medium
    issue: 각주 b와 c의 표지가 내용에 맞는 본문 어구에 붙어 있지 않음
    rationale: b는 ‘너희 죄’의 단수성에 관한 각주이므로 ‘죄’ 뒤에, c는 ‘올 수 없습니다’의 대안 표현에 관한 각주이므로 해당 절 뒤에 붙어야 합니다.
  - severity: low
