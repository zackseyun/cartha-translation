id: JHN.8.12
reference: John 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
  footnotes:
  - marker: a
    text: Or, 'will never walk in darkness.' The Greek uses a strong negation (οὐ μὴ).
    reason: lexical_alternative
  - marker: b
    text: '''The light of life'' may also be understood as ''the light that gives life.'''
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그들에게 다시 말씀하셨습니다. “나는 세상의 빛입니다. 나를 따르는 사람은 결코 어둠 속을 걷지 않을 것이며, 생명의 빛을 가질 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘결코’는 οὐ μὴ의 강한 부정을 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생명의 빛’은 ‘생명을 주는 빛’으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  english_pob_choice: So ... again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 그러므로 다시
  lexicon: BDAG
  rationale: 재차 말을 시작하는 흐름을 간결하게 살리기 위해 ‘다시’로 옮겼습니다. οὖν의 연결감은 한국어 문맥상 별도 접속어 없이도 자연스럽습니다.
- source_word: ἐλάλησεν
  english_pob_choice: spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했다
  - 이야기하셨습니다
  lexicon: BDAG
  rationale: 예수의 공적 발화를 품위 있게 드러내면서도 직접적인 구어성을 유지하는 표현으로 ‘말씀하셨습니다’를 택했습니다.
- source_word: τὸ φῶς τοῦ κόσμου
  english_pob_choice: the light of the world
  chosen_korean: 세상의 빛
  alternatives_korean:
  - 세상의 등불
  - 세상을 비추는 빛
  lexicon: BDAG
  rationale: κόσμος를 여기서는 인류 일반의 세계로 이해하여, 관용적이면서도 직역에 가까운 ‘세상의 빛’으로 옮겼습니다.
- source_word: οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ
  english_pob_choice: will certainly not walk in the darkness
  chosen_korean: 결코 어둠 속을 걷지 않을 것이며
  alternatives_korean:
  - 어둠 속을 결코 걷지 않을 것이며
  - 어둠 속을 절대로 걸어 다니지 않을 것이며
  lexicon: BDAG
  rationale: οὐ μὴ의 강한 부정을 한국어의 ‘결코’로 살리고, περιπατέω는 문맥상 삶의 행로를 가리키므로 ‘걷다’로 옮겼습니다.
- source_word: τὸ φῶς τῆς ζωῆς
  english_pob_choice: the light of life
  chosen_korean: 생명의 빛
  alternatives_korean:
  - 삶의 빛
  - 생명을 주는 빛
  lexicon: BDAG
  rationale: 그리스어의 압축된 소유격 구조를 자연스러운 한국어로 풀되, POB의 간명한 표현을 살려 ‘생명의 빛’으로 옮겼습니다.
theological_decisions:
- issue: 예수의 자기 선언인 Ἐγώ εἰμι의 뉘앙스
  chosen_reading: ‘나는’으로 평이하게 옮겨, 숨어 있는 신적 자기 계시의 가능성을 과장하지 않으면서도 본문의 직접 선언성을 유지했습니다.
  alternative_readings:
  - ‘내가 곧’이라는 더 강한 강조
  - 신적 이름 암시를 드러내는 번역
  rationale: 여기서는 서술어 명사와 결합한 문법 구조가 분명하므로, 번역이 본문 이상의 해석을 앞서가지 않도록 했습니다.
  doctrine_reference: 본문의 문법을 우선하고 신학적 함의는 독자에게 열어 둡니다.
- issue: τῆς ζωῆς의 관계 의미
  chosen_reading: ‘생명의 빛’으로 직역해, 빛이 생명에 속하거나 생명을 주는 빛일 수 있는 여지를 남겼습니다.
  alternative_readings:
  - ‘생명을 주는 빛’
  - ‘생명에 속한 빛’
  rationale: 소유격의 관계가 단일하게 고정되지 않으므로, 해석을 좁히지 않는 쪽이 원문의 긴장을 보존합니다.
  doctrine_reference: 해석적 여지를 보존합니다.
