id: JHN.8.14
reference: John 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
  footnotes:
  - marker: a
    text: Or “bear witness about myself.”
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read “and where I am going” instead of “or where I am going.”
    reason: textual_variant
translation:
  language: ko
  text: 예수께서 그들에게 대답하여 말씀하셨습니다. “설령 내가 나 자신에 대해 증언합니다[a] 하더라도, 내 증언은 참입니다. 이는 내가 어디에서 왔는지와 어디로 가는지를 알기 때문입니다. 그러나 너희는 내가 어디에서 오는지 또는 어디로 가는지[b] 알지 못합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나 자신에 대해 증거를 제시합니다.’
    reason: lexical_alternative
  - marker: b
    text: 일부 사본은 ‘또는 어디로 가는지’ 대신 ‘또 어디로 가는지’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 ... 말씀하셨습니다
  alternatives_korean:
  - 대답하셨고 말씀하셨습니다
  - 대답하여 말하셨습니다
  lexicon: SBLGNT / Johannine narrative style
  rationale: 요한복음의 관용적 서술형을 살리되 한국어에서는 중복을 줄여 자연스럽게 옮겼습니다.
- source_word: Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ
  english_pob_choice: Even if I testify about myself
  chosen_korean: 설령 내가 나 자신에 대해 증언한다 하더라도
  alternatives_korean:
  - 비록 내가 나 자신에 대해 증언하더라도
  - 내가 나 자신에 대해 증언한다 해도
  lexicon: BDAG
  rationale: Κἂν의 양보적 힘을 유지하기 위해 ‘설령 … 하더라도’로 옮겼고, μαρτυρῶ는 요한문맥의 법정적 뉘앙스를 살려 ‘증언하다’로 렌더링했습니다.
- source_word: ἀληθής ἐστιν ἡ μαρτυρία μου
  english_pob_choice: my testimony is true
  chosen_korean: 내 증언은 참됩니다
  alternatives_korean:
  - 내 증언은 진실합니다
  - 내 증언은 참입니다
  lexicon: BDAG
  rationale: ἀληθής를 단순히 사실적 진위로 처리하여, ‘참됩니다’로 자연스럽고도 단정하게 표현했습니다.
- source_word: πόθεν ἦλθον ... ποῦ ὑπάγω
  english_pob_choice: where I came from and where I am going
  chosen_korean: 내가 어디에서 왔는지, 또 어디로 가는지
  alternatives_korean:
  - 내가 어디서 왔는지, 또 어디로 가는지
  - 내가 어디에서 왔는지, 또 어디로 가는지
  lexicon: BDAG
  rationale: 출처/기원을 묻는 πόθεν과 목적지/향향을 묻는 ποῦ를 한국어의 자연스러운 의문절로 살렸습니다.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  english_pob_choice: but you do not know
  chosen_korean: 그러나 너희는 ... 알지 못합니다
  alternatives_korean:
  - 하지만 너희는 ... 알지 못합니다
  - 그러나 너희는 ... 모르고 있습니다
  lexicon: BDAG
  rationale: 대조 접속사 δέ의 반전 관계를 ‘그러나’로 분명히 했고, οἶδα의 인지 의미를 ‘알지 못합니다’로 유지했습니다.
theological_decisions:
- issue: 예수의 자기 증언의 정당성
  chosen_reading: 예수의 증언이 참된 이유를, 그분이 자신의 기원과 목적지를 아신다는 진술 자체에 두어 과도한 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 법정적 유효성을 더 강하게 드러내는 번역
  - 예수의 하늘 기원을 더 노골적으로 해설하는 번역
  rationale: 본문은 자기 증언의 진위를 직접 주장할 뿐이므로, 요한신학의 더 넓은 의미는 문맥에서 드러나게 두는 편이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §3; Johannine Christology
- issue: 직접 화법의 한국어 존대
  chosen_reading: 예수의 직접 화법은 일반적 진술형을 유지하고, 인용문 내부의 말투 변화는 본문에 나타난 대로 반말형으로 처리했습니다.
  alternative_readings:
  - 인용문 내부도 전부 존대형으로 통일
  - 문장 전체를 구어체로 완화
  rationale: 제자/대상에게 하는 직접 발화의 대비를 보존하면서도, 예수의 권위 있는 진술이라는 성격은 현대 표준어로 자연스럽게 드러냅니다.
  doctrine_reference: Korean style guide; quotation register
