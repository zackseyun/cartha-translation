  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ γνώσεσθε τὴν ἀλήθειαν, καὶ ἡ ἀλήθεια ἐλευθερώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/032.yaml
  text: and you will know the truth[b][a], and the truth will set you free.
  footnotes:
  - marker: a
    text: Or 'you will come to know the truth.'
    reason: lexical_alternative
  - marker: b
    text: The freedom here is left unspecified in the wording of the verse itself; the surrounding context connects it with freedom from sin.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 여러분은 진리를 알게 될 것이며, 진리가 여러분을 자유롭게 할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “진리를 알게 될 것입니다”일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 ‘자유’는 본문 자체에서 구체적으로 규정되지 않으며, 앞뒤 문맥은 죄에서의 자유와 연결합니다.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  english_pob_choice: you will know
  chosen_korean: 알게 될 것이며
  alternatives_korean:
  - 알 것입니다
  - 알게 됩니다
  - 깨닫게 될 것입니다
  lexicon: BDAG
  rationale: 미래형의 인지 의미를 자연스러운 한국어로 옮기되, ingressive 뉘앙스를 과도하게 해설하지 않기 위해 '알게 될 것입니다'를 택했습니다.
- source_word: τὴν ἀλήθειαν / ἡ ἀλήθεια
  english_pob_choice: the truth
  chosen_korean: 진리 / 진리가
  alternatives_korean:
  - 그 진리를 / 그 진리가
  - 진실 / 진실이
  lexicon: BDAG
  rationale: 정관사의 반복이 강조하는 특정성을 살리면서도 한국어에서는 같은 어휘를 반복해 대조와 운율을 유지하기 위해 '진리'를 일관되게 사용했습니다.
- source_word: ἐλευθερώσει
  english_pob_choice: will set ... free
  chosen_korean: 자유롭게 할 것입니다
  alternatives_korean:
  - 자유케 할 것입니다
  - 풀어줄 것입니다
  - 해방할 것입니다
  lexicon: BDAG
  rationale: 현대 한국어에서 자연스럽고, 원문의 사역적 의미를 유지하면서도 정치적 뉘앙스를 덧붙이지 않는 표현으로 옮겼습니다.
- source_word: ὑμᾶς
  english_pob_choice: you
  chosen_korean: 여러분을
  alternatives_korean:
  - 당신들을
  - 너희를
  - 너희에게
  lexicon: BDAG
  rationale: 복수 2인칭을 자연스럽게 드러내기 위해 '여러분을'을 사용했고, 대화 상대가 복수임을 한국어에서도 분명히 했습니다.
theological_decisions:
- issue: 진리가 주는 자유의 범위
  chosen_reading: 본문 자체는 자유의 성격을 구체화하지 않고, '진리가 여러분을 자유롭게 할 것입니다'라고만 번역했습니다.
  alternative_readings:
  - 진리가 여러분을 죄에서 자유롭게 할 것입니다
  - 진리가 여러분을 영적으로 자유롭게 할 것입니다
  rationale: 요한복음 문맥이 뒤에서 죄와의 관련성을 전개하더라도, 본절의 서술은 더 압축적이므로 해설을 본문에 덧붙이지 않고 긴장을 보존했습니다.
  doctrine_reference: 문맥적 확장은 주석에서 다루고 본문은 과잉해석하지 않음
