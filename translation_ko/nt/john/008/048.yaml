  source_fidelity: 수정 전 본문은 ‘사마리아 사람이고 또 귀신 들렸다고’라는 내용을 누가 지칭하는지 문법적으로 불분명하며, 원문의 강조된 2인칭 주어(‘당신이’)를 충분히 드러내지 못합니다. 이를 보완하면 원문의 반문 구조, ‘사마리아 사람’이라는 모욕적 호칭, 그리고 ‘귀신을 가지고 있다’라는 비난을 충실히 반영합니다.
  naturalness: ‘우리가 당신이 사마리아 사람이며 귀신 들렸다고 말하는 것이 옳지 않습니까?’는 현대 표준 한국어 합쇼체에서 자연스럽고, 상대를 향한 적대적 반문의 어조도 유지합니다. 각주 표지를 해당 어구 가까이에 배치하여 참조 관계도 분명하게 했습니다.
  terminology: ‘유대인들’은 οἱ Ἰουδαῖοι의 직접적인 번역으로 유지하되, 요한복음 내 문맥상 그 지시 대상이 모든 유대인을 포괄하는 것은 아닐 수 있음을 각주에서 설명합니다. δαιμόνιον ἔχεις는 본문에서 자연스러운 ‘귀신 들렸다’로 옮기고, 직역적 표현은 각주에 보존합니다.
