id: JHN.8.48
reference: John 8:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
  footnotes:
  - marker: a
    text: Or “the Judeans” or “the Jewish leaders” in some contexts; in John, “the Jews” often refers to a particular group opposing Jesus, not to every Jewish person without exception.
    reason: alternative_reading
  - marker: b
    text: Or “Do we not say rightly…?”
    reason: lexical_alternative
  - marker: c
    text: Literally, “have a demon”; some translations render this more interpretively as “are demon-possessed.”
    reason: lexical_alternative
translation:
  language: ko
  text: 유대인들이[a] 그분께 대답하여 말했습니다. “우리가 당신이 사마리아 사람이며 귀신 들렸다고[c] 말하는 것이 옳지 않습니까?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥에 따라 ‘유대인들’은 모든 유대인을 가리키는 말이 아니라, 요한복음에서 예수와 대립하는 특정 집단을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “우리가 옳게 말하는 것이 아니냐?”
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “귀신을 가지고 있다”입니다. 일부 번역은 이를 해석적으로 “귀신 들렸다”로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: The Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유다인들
  - 유대 지도자들
  lexicon: BDAG
  rationale: 원문이 특정한 지배층을 명시하지 않으므로, 본문 차원의 직접 대응으로 ‘유대인들’을 택했습니다. 주석에서 요한복음의 용례상 특정 대립 집단을 가리킬 수 있음을 보완합니다.
- source_word: Ἀπεκρίθησαν ... καὶ εἶπαν αὐτῷ
  english_pob_choice: answered and said to him
  chosen_korean: 그분께 대답하여 말했습니다
  alternatives_korean:
  - 그분께 대답했습니다
  - 그분께 대답하여 이르렀습니다
  lexicon: BDAG
  rationale: 헬라어의 ‘대답하다 + 말하다’의 이중 서술을 살리되, 한국어에서는 자연스럽게 압축해 구두 응답의 흐름을 유지했습니다.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  english_pob_choice: Are we not right in saying
  chosen_korean: 우리가 … 말하는 것이 옳지 않습니까
  alternatives_korean:
  - 우리가 … 말하는 것이 옳지 않습니까
  - 우리가 … 말하는 것이 옳지 않습니까?
  - 우리가 … 옳게 말하지 않습니까
  lexicon: BDAG
  rationale: 부정 의문문의 기대 답변 구조를 한국어의 반문형으로 옮겨, ‘rightly/correctly’의 평가 의미를 ‘옳다’로 자연스럽게 반영했습니다.
- source_word: δαιμόνιον ἔχεις
  english_pob_choice: have a demon
  chosen_korean: 귀신 들렸고
  alternatives_korean:
  - 귀신을 가지고 있고
  - 귀신이 있고
  - 귀신 들렸고
  lexicon: BDAG
  rationale: 원문은 직역하면 ‘귀신을 가지고 있다’이지만, 한국어에서는 같은 모욕적 발화를 더 자연스럽고 즉각적으로 전달하는 ‘귀신 들렸다’가 원문의 비난성을 잘 드러냅니다. 다만 본문에는 개역적 전통어보다 현대어를 사용했습니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 범위와 독해
  chosen_reading: 본문에는 ‘유대인들’로 직역하되, 이것이 모든 유대인을 가리키는 포괄적 진술이 아니라는 점을 주석으로 밝혔습니다.
  alternative_readings:
  - 유대 지도자들
  - 유다인들
  rationale: 원문을 완화하지 않으면서도 요한복음의 담화 맥락에서 특정 대립 집단을 가리킬 수 있다는 점을 보존하기 위함입니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
- issue: δαιμόνιον ἔχεις의 표현 수위
  chosen_reading: ‘귀신 들렸고’로 옮겨, 단순한 상태 서술이 아니라 상대를 모욕하는 발화의 공격성을 살렸습니다.
  alternative_readings:
  - 귀신이 있고
  - 귀신에 사로잡혔고
  rationale: 예수에 대한 적대적 비난이라는 문맥을 희석하지 않되, 한국어 독자가 즉시 이해할 수 있는 관용 표현을 택했습니다.
  doctrine_reference: Preserve source force and rhetorical hostility without interpretive softening.
