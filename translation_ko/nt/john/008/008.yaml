translation:
  language: ko
  text: 그리고 다시 몸을 굽혀 땅에 쓰셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절은 간음하다 붙잡힌 여인 이야기(요 7:53–8:11)의 연속입니다. 요 7:53의 주석을 보십시오.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ πάλιν
  english_pob_choice: And again
  chosen_korean: 그리고 다시
  alternatives_korean:
  - 또
  - 다시
  lexicon: NA/BDAG
  rationale: καὶ πάλιν은 단순한 접속과 반복을 함께 나타내므로, 자연스러운 한국어로 '그리고 다시'가 그 흐름을 가장 잘 살립니다.
- source_word: κύψας
  english_pob_choice: stooped
  chosen_korean: 몸을 굽혀
  alternatives_korean:
  - 몸을 숙여
  - 굽혀
  lexicon: BDAG
  rationale: κύπτω의 aorist 분사로, 아래로 몸을 낮추는 동작을 가리키므로 '몸을 굽혀'가 자세의 변화를 가장 직접적으로 드러냅니다.
- source_word: ἔγραφεν
  english_pob_choice: wrote
  chosen_korean: 쓰셨습니다
  alternatives_korean:
  - 쓰고 계셨습니다
  - 쓰셨다
  lexicon: BDAG
  rationale: 미완료 과거의 진행성은 유지할 수 있으나, 한국어 내러티브에서는 단순 과거형 '쓰셨습니다'가 자연스럽고 본문의 동작을 간결하게 전달합니다.
- source_word: τὴν γῆν
  english_pob_choice: ground
  chosen_korean: 땅에
  alternatives_korean:
  - 땅 위에
  - 흙에
  lexicon: BDAG
  rationale: γῆ의 목적격은 이 문맥에서 바로 앞의 지면을 뜻하므로, 한국어에서는 장소부사격으로 풀어 '땅에'가 가장 자연스럽습니다.
theological_decisions:
- issue: 예수님의 동작을 서술할 때의 높임말 처리
  chosen_reading: 서술문은 합쇼체로 두되, 주어가 예수님이므로 동작은 '쓰셨습니다'처럼 높임을 반영했습니다.
  alternative_readings:
  - 쓰셨다
  - 쓰셨습니다
  rationale: 본문은 직접 화법이 아니라 서술이므로 합쇼체를 유지하는 것이 현대 표준어에 맞고, 예수님에 대한 존중은 서술 동사의 높임으로 반영할 수 있습니다.
  doctrine_reference: 존칭과 서술체의 조화
