id: JHN.8.37
reference: John 8:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
  footnotes:
  - marker: a
    text: Or 'Abraham’s seed' or 'descendants of Abraham.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my word finds no room in you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 당신들이 아브라함의 씨인 줄 압니다. 그러나 당신들은 나를 죽이려 하고 있습니다. 이는 내 말씀이 당신들 안에 들어갈 자리가 없기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아브라함의 씨’는 혈통적 소속을 직선적으로 옮긴 표현입니다.
    reason: source_note
  - marker: b
    text: ‘들어갈 자리가 없다’는 영어 POB의 ‘has no place in you’를 따른 비유적 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  english_pob_choice: Abraham’s offspring
  chosen_korean: 아브라함의 씨
  alternatives_korean:
  - 아브라함의 자손
  - 아브라함의 후손
  lexicon: BDAG
  rationale: σπέρμα는 여기서 집합적으로 쓰인 혈통 표현이므로, 본문의 직선적 의미를 살리기 위해 ‘씨’를 택했습니다. ‘자손’이나 ‘후손’도 가능하지만, 영어 POB의 ‘offspring’처럼 혈연적 귀속을 간결하게 드러내면서도 불필요한 해석을 덜어냅니다.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  english_pob_choice: you are seeking to kill me
  chosen_korean: 나를 죽이려 하고 있습니다
  alternatives_korean:
  - 나를 죽이려고 합니다
  - 나를 죽이려 찾고 있습니다
  lexicon: BDAG
  rationale: ζητεῖτε + 부정사 구조는 단순한 의도보다 ‘애쓰다/모색하다’의 진행감을 담으므로, 현재진행형으로 자연스럽게 옮겼습니다. ‘죽이려고 합니다’도 가능하지만, ‘seek’의 동사적 힘을 더 분명히 드러내기 위해 ‘죽이려 하고 있습니다’를 택했습니다.
- source_word: ὁ λόγος ὁ ἐμὸς
  english_pob_choice: my word
  chosen_korean: 내 말씀
  alternatives_korean:
  - 내 말
  - 내 메시지
  lexicon: BDAG
  rationale: λόγος는 여기서 예수의 단발적 발언보다 지속적으로 제시되는 권위 있는 말씀을 가리키므로, ‘말씀’이 가장 적절합니다. 이는 요한 문맥의 용례를 보존하면서도 한국어에서 자연스럽습니다.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  english_pob_choice: has no place in you
  chosen_korean: 당신들 안에 들어갈 자리가 없기 때문입니다
  alternatives_korean:
  - 당신들 안에서 받아들여지지 않기 때문입니다
  - 당신들 안에서 자리를 얻지 못하기 때문입니다
  lexicon: BDAG
  rationale: χωρέω는 ‘들어가다/자리를 얻다/받아들여지다’의 의미 범위를 가지므로, 영어 POB의 비유를 따라 ‘들어갈 자리’로 옮겼습니다. 이렇게 하면 그들의 내적 비수용성을 이미지로 유지하면서도 한국어로 매끄럽게 읽힙니다.
theological_decisions:
- issue: 아브라함의 혈통 인정과 동시에 예수 거절의 대조
  chosen_reading: ‘아브라함의 씨’는 여기서 우선 혈통적 소속을 인정하는 표현으로 두고, 영적 자녀 구별은 본 절에서 미리 해석해 넣지 않았습니다.
  alternative_readings:
  - 아브라함의 자녀로 의역해 영적 함의를 앞당김
  rationale: 문맥상 예수는 그들의 육적 계보를 인정하면서도 자신을 거부하는 태도를 책망합니다. 본 절에서 그 긴장을 유지하는 것이 요한의 논지를 더 정확히 반영합니다.
  doctrine_reference: 본문의 신학적 긴장을 보존
