lexical_decisions:
- source_word: ὑμεῖς
  english_pob_choice: You
  chosen_korean: 여러분은
  alternatives_korean:
  - 너희는
  - 당신들은
  lexicon: BDAG
  rationale: 복수 2인칭의 대조를 살리면서도 현대 한국어 합쇼체에 맞게 자연스럽게 표현했습니다.
- source_word: κατὰ τὴν σάρκα
  english_pob_choice: according to the flesh
  chosen_korean: 육신을 따라
  alternatives_korean:
  - 육체를 따라
  - 사람의 기준으로
  - 겉모습을 따라
  lexicon: BDAG
  rationale: σάρξ의 직역인 ‘육신’을 유지해 원문의 표현과 신학적 긴장을 보존했습니다. ‘사람의 기준으로’와 같은 풀이적 표현은 본문 주석 성격으로는 가능하지만, 본문 자체에서는 원문 어휘를 드러내는 쪽을 택했습니다.
- source_word: κρίνετε / κρίνω
  english_pob_choice: judge
  chosen_korean: 판단하다
  alternatives_korean:
  - 심판하다
  - 재판하다
  lexicon: BDAG
  rationale: 여기서는 법정적 최종심판보다 분별·판정의 뉘앙스가 자연스러워 ‘판단하다’로 옮겼습니다. 같은 어근의 반복도 한국어에서 무리 없이 살릴 수 있습니다.
- source_word: οὐδένα
  english_pob_choice: no one
  chosen_korean: 아무도
  alternatives_korean:
  - 아무 사람도
  - 한 사람도
  lexicon: BDAG
  rationale: 부정 대명사의 강한 포괄성을 한국어의 ‘아무도’가 간결하게 전달합니다.
theological_decisions:
- issue: κατὰ τὴν σάρκα의 의미
  chosen_reading: 본문은 ‘육신을 따라’로 옮겨, 인간적·겉보기 기준의 판단이라는 해석 가능성을 열어 두되 이를 본문에서 직접 풀어 쓰지는 않았습니다.
  alternative_readings:
  - 사람의 기준으로
  - 겉모습을 따라
  rationale: POB의 주석 선택처럼 본문은 원문의 표현을 보존하고, 해석적 완화는 주석에서 다루는 편이 source-grounded합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #3; Contested terms table for σάρξ'
