  terminology: ‘육신’은 σάρξ의 표현을 유지하면서도 이 구절의 인간적·외적 판단이라는 함의를 주석으로 열어 두는 적절한 선택입니다. κρίνω의 반복을 ‘판단하다’로 일관되게 옮긴 것도 좋습니다.
