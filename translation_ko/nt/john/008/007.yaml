review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐπέμενον ἐρωτῶντες는 중립적으로 ‘계속 물었다/질문했다’라는 지속을 나타내므로, ‘캐묻다’가 암시하는 추궁의 강도는 본문에 명시되지 않아 피하는 편이 좋습니다. ἀνακύψας, ἀναμάρτητος, πρῶτος, βαλέτω의 의미는 적절히 반영되었습니다.
  naturalness: ‘그들이 계속 그분을 캐묻고 있을 때’는 다소 구어적이고 목적격 표현도 문맥상 ‘그분께 묻다’보다 덜 자연스럽습니다. ‘그들이 계속 그분께 묻자’는 현대 표준어 합쇼체 서술에서 자연스럽고 간결합니다. 직접 인용문의 명령형은 현 번역처럼 합쇼체로 유지할 수 있습니다.
  terminology: ‘죄 없는 사람’, ‘돌을 던지십시오’, ‘가장 이른 그리스어 사본들’은 이해하기 쉽고 영어 POB의 본문비평 주석과도 일치합니다. 예수의 이름을 명시한 것은 앞 문맥의 지시 대상을 한국어에서 분명히 하는 자연스러운 보완입니다.
  issues:
  - severity: low
    issue: ‘캐묻고’는 원문의 지속적 질문에 추궁·압박의 뉘앙스를 더합니다.
    rationale: ἐρωτάω 자체는 질문하다/묻다이며, 이 구절의 문법은 질문의 계속됨을 분명히 하지만 그 질문 방식의 적대적 강도를 어휘적으로 특정하지는 않습니다.
