  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ὡς δὲ ἐπέμενον ἐρωτῶντες αὐτόν, ἀνακύψας εἶπεν αὐτοῖς, Ὁ ἀναμάρτητος ὑμῶν, πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
  footnotes:
  - marker: a
    text: This verse is part of the story of the woman caught in adultery (John 7:53–8:11), which is absent from the earliest Greek manuscripts. See note on John 7:53.
    reason: textual_critical
translation:
  language: ko
  text: 그런데 그들이 계속 그분을 캐묻고 있을 때, 예수께서 몸을 일으키시고 그들에게 말씀하셨습니다. "너희 가운데 죄 없는 사람이 먼저 그녀에게 돌을 던지십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 간음한 여인 이야기(요 7:53–8:11)의 일부로, 가장 이른 그리스어 사본들에는 없습니다. 요 7:53의 주석을 보십시오.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  english_pob_choice: continued questioning
  chosen_korean: 계속 그분을 캐묻고 있을 때
  alternatives_korean:
  - 질문을 계속하던 중
  - 계속 물어 대고 있을 때
  lexicon: BDAG
  rationale: ἐπέμενον의 지속성은 ‘계속’으로, ἐρωτῶντες는 단순 질문보다 압박감 있는 반복 질문을 드러내는 ‘캐묻다’로 옮기는 것이 문맥에 맞습니다.
- source_word: ἀνακύψας
  english_pob_choice: straightened up
  chosen_korean: 몸을 일으키시고
  alternatives_korean:
  - 허리를 펴시고
  - 곧게 일어나시고
  lexicon: BDAG
  rationale: 예수가 이전에 몸을 굽히고 있던 자세에서 다시 상체를 세우는 동작을 자연스러운 한국어로 살렸습니다.
- source_word: Ὁ ἀναμάρτητος ὑμῶν
  english_pob_choice: the one among you who is without sin
  chosen_korean: 너희 가운데 죄 없는 사람이
  alternatives_korean:
  - 너희 중 죄 없는 자가
  - 너희 가운데 죄가 없는 사람이
  lexicon: BDAG
  rationale: ἀναμάρτητος의 핵심은 도덕적·법적 무결함이 아니라 ‘죄가 없음’이므로, 합쇼체 문맥에 맞게 ‘죄 없는 사람’으로 옮겼습니다.
- source_word: πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω
  english_pob_choice: be the first to throw a stone at her
  chosen_korean: 먼저 그녀에게 돌을 던지십시오
  alternatives_korean:
  - 첫 번째로 그녀에게 돌을 던지십시오
  - 가장 먼저 그녀에게 돌을 던지십시오
  lexicon: BDAG
  rationale: πρῶτος의 우선성을 ‘먼저’로 간명하게 살리고, βαλέτω는 명령형으로서 자연스러운 한국어 명령문으로 옮겼습니다.
theological_decisions:
- issue: 예수의 직접 명령의 높임말 처리
  chosen_reading: 예수의 말씀은 합쇼체 명령형으로 처리했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 전통적인 경어 표현 사용
  rationale: 직접 화법이지만 독자에게 주는 권위와 공적 장면을 반영하기 위해 현대 표준어의 공손 명령형을 유지했습니다.
  doctrine_reference: 그리스도의 권위 있는 판결 발화
- issue: 간음한 여인 이야기의 본문비평 주석 여부
  chosen_reading: 본문 자체에는 주석 표기를 두지 않고, 별도 각주를 통해 전승 문제를 알립니다.
  alternative_readings:
  - 본문에 괄호로 삽입
  - 주석 없이 번역
  rationale: 본문의 문장 흐름은 유지하되, 해당 단락의 본문비평상 이슈는 주석으로 투명하게 표시하는 편이 POB의 감사 가능성에 부합합니다.
  doctrine_reference: 본문 전승의 투명성
