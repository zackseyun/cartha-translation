translation:
  language: ko
  text: 그런데 예수께서 감람산으로 가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 간음하다가 붙잡힌 여인의 이야기(요한복음 7:53–8:11)에 이어집니다. 본문 증거에 대해서는 요한복음 7:53의 주를 보십시오.
    reason: textual_critical
lexical_decisions:
- source_word: Ἰησοῦς
  english_pob_choice: Jesus
  chosen_korean: 예수
  alternatives_korean:
  - 예수님
  lexicon: 고유명사
  rationale: 서술문에서는 고유명사 예수를 기본형으로 옮기고, 직접 호칭이 아니므로 예수님보다 간결한 서술형을 택했습니다.
- source_word: ἐπορεύθη
  english_pob_choice: went
  chosen_korean: 가셨습니다
  alternatives_korean:
  - 가셨습니다만
  - 이동하셨습니다
  - 떠나셨습니다
  lexicon: BDAG
  rationale: 단순한 이동을 가리키는 동사로, 문맥에 맞게 자연스러운 서술형 ‘가셨습니다’로 옮겼습니다.
- source_word: εἰς τὸ ὄρος τῶν Ἐλαιῶν
  english_pob_choice: to the Mount of Olives
  chosen_korean: 감람산으로
  alternatives_korean:
  - 올리브산으로
  - 감람나무산으로
  lexicon: BDAG
  rationale: 전통적 성경 지명인 ‘감람산’이 본문의 고유 지리명에 가장 안정적으로 대응하므로 이를 채택했습니다.
theological_decisions:
- issue: 마지막 절의 서술 연결
  chosen_reading: ‘그런데’로 앞 문맥과 자연스럽게 이어지는 서술로 처리했습니다.
  alternative_readings:
  - ‘그리고’로 직역
  - 문맥 연결어를 생략
  rationale: 이 절은 7:53–8:11의 서사 연속선상에 있으므로, 한국어에서도 장면 전환의 흐름을 드러내는 연결어가 도움이 됩니다.
  doctrine_reference: 문맥 연결 및 본문비평 주석
- issue: 본절의 본문비평적 연속성
  chosen_reading: 별도의 본문 주석 없이 본문만 번역했습니다.
  alternative_readings:
  - 각주로 7:53–8:11 연속성 표기
  - 본문에 괄호 설명 삽입
  rationale: 영문 POB가 별도 각주로 처리한 본문비평 정보는 여기서는 본문 텍스트를 흐리지 않도록 각주로만 다루는 것이 적절하지만, 이 요청은 한 절 번역이므로 본문에는 반영하지 않았습니다.
  doctrine_reference: 본문비평 주석
