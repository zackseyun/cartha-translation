theological_decisions:
- issue: οὐ πιστεύετέ μοι의 번역에서 ‘믿다’와 ‘신뢰하다’의 선택
  chosen_reading: ‘믿지 않습니다’로 번역해 예수님의 증언을 받아들이지 않는 의미를 직접적으로 드러냈습니다.
  alternative_readings:
  - 나를 신뢰하지 않습니다
  - 내 말을 믿지 않습니다
  rationale: 문맥상 단순한 인간관계의 신뢰보다 예수님의 진술과 증언에 대한 불신이 핵심이므로, 복음서에서 흔한 ‘믿다’ 표현을 유지하는 것이 가장 적절합니다.
  doctrine_reference: 요한복음의 믿음/불신 대조
