  source_fidelity: 본문의 ‘그러나 내가 진리를 말하기 때문에 너희는 나를 믿지 않습니다’는 ἐγώ의 강조, δέ의 대조, ὅτι의 인과적 용법, 그리고 πιστεύω + 여격의 뜻을 자연스럽고 충실하게 옮깁니다. 다만 각주에 제시된 문자적 대안은 문장 조각으로 인용되어 한국어로는 불완전하며, ὅτι의 대안적 기능을 더 정확히 설명할 필요가 있습니다.
  naturalness: 본문은 현대 표준어 합쇼체로 자연스럽습니다. ‘내가’와 ‘너희는’은 원문의 대조적 강조를 무리 없이 드러내며, ‘나를 믿지 않습니다’도 자연스럽습니다. 각주의 직접 인용문은 완결된 한국어 표현이 아니므로 다듬는 것이 좋습니다.
  terminology: ‘진리’와 ‘믿지 않습니다’는 요한복음의 통상적이고 적절한 용어입니다. ‘신뢰하다’나 ‘내 말을 믿다’로 한정하지 않은 점도 원문의 προσωπ적 여격 목적어와 문맥을 잘 보존합니다.
