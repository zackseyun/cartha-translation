translation:
  language: ko
  text: 그들은 그에게 말했습니다. 「선생님, 이 여자는 간음하다가 그 현장에서 붙잡혔습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 간음한 여인 기사(요 7:53–8:11)의 계속입니다. 요 7:53의 주를 보십시오.
    reason: textual_variant
lexical_decisions:
- source_word: λέγουσιν
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: BDAG
  rationale: 역사적 현재이므로 한국어 서술에서는 자연스러운 과거형으로 옮기되, 구어적이면서도 공손한 서술체를 유지했습니다.
- source_word: Διδάσκαλε
  english_pob_choice: Teacher
  chosen_korean: 선생님
  alternatives_korean:
  - 스승님
  - 랍비
  lexicon: BDAG
  rationale: 호칭의 직접성을 살리면서도 현대 한국어에서 가장 자연스러운 대응인 ‘선생님’을 택했습니다.
- source_word: ἐπαυτοφώρῳ
  english_pob_choice: in the very act
  chosen_korean: 그 현장에서
  alternatives_korean:
  - 현행범으로
  - 그 자리에서
  lexicon: BDAG
  rationale: 관용구의 핵심인 ‘현장에서 붙잡힘’이라는 의미를 살리되, 법률용어처럼 과도하게 현대화되지 않도록 절제했습니다.
- source_word: μοιχευομένη
  english_pob_choice: of committing adultery
  chosen_korean: 간음하다가
  alternatives_korean:
  - 간음하는 중에
  - 간음하는 모습으로
  lexicon: BDAG
  rationale: 분사구를 한국어 자연어법에 맞게 행동 도중을 나타내는 ‘-하다가’로 옮겨, ‘붙잡혔습니다’와 함께 사건성을 분명히 했습니다.
theological_decisions:
- issue: 이 절의 문학적·본문비평적 위치
  chosen_reading: 문맥상 간음한 여인 기사(Jn 7:53–8:11)의 계속으로 읽히는 절을 반영했습니다.
  alternative_readings:
  - 독립된 본문으로 취급
  - 각주 없이 본문만 번역
  rationale: 영어 POB의 각주와 동일하게 본문 연결성을 드러내어, 독자가 이 절의 전승적 위치를 오해하지 않도록 했습니다.
  doctrine_reference: 본문비평 / 전승사
