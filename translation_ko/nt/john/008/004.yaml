    reason: textual_variant
lexical_decisions:
- source_word: λέγουσιν
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: BDAG
  rationale: 역사적 현재이므로 한국어 서술에서는 자연스러운 과거형으로 옮기되, 구어적이면서도 공손한 서술체를 유지했습니다.
- source_word: Διδάσκαλε
