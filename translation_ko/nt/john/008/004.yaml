- from: 그들은 그에게 말했습니다. 「선생님, 이 여자는 간음하다가 그 현장에서 붙잡혔습니다.」[a]
  to: 그들은 그에게 말했습니다. 「선생님, 이 여자는 간음하는 바로 그 현장에서 붙잡혔습니다.」[a]
  rationale: 완료 수동 κατείληπται는 ‘붙잡혔습니다’로, 역사적 현재 λέγουσιν는 한국어 서사에 자연스러운 과거형 ‘말했습니다’로 옮겼습니다. ἐπαυτοφώρῳ와 현재분사 μοιχευομένη의 결합이 나타내는 ‘간음 행위 중 바로 현장에서 붙잡힘’을 ‘간음하는 바로 그 현장에서’로 반영했습니다. 본문비평 각주는 영어 POB의 안내 기능을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:19Z'
