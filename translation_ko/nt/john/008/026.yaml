id: JHN.8.26
reference: John 8:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
  footnotes:
  - marker: a
    text: Or 'about you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'what I heard from him, this I speak to the world.' The Greek explicitly repeats the demonstrative 'these things' for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 여러분에 관하여[a] 말하고 판단할 것이 많이 있습니다. 그러나 나를 보내신 분은 참되십니다. 그리고 내가 그분에게서 들은 것들, 바로 그것들을[b] 나는 세상에 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신들에 관하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 강조를 위해 ‘이것들’(ταῦτα)을 분명히 되풀이합니다.
    reason: source_note
lexical_decisions:
- source_word: πολλὰ
  english_pob_choice: many things
  chosen_korean: 많은 것
  alternatives_korean:
  - 많은 일
  - 여러 가지
  lexicon: BDAG
  rationale: 중성 복수로 묶인 내용을 한국어에서 자연스럽게 받으면서도, 단순한 양이 아니라 여러 항목의 말을 가리키는 점을 살리기 위해 ‘많은 것’을 택했습니다.
- source_word: λαλεῖν / λαλῶ
  english_pob_choice: to say / I speak
  chosen_korean: 말하고 / 말합니다
  alternatives_korean:
  - 말할 / 이야기하고
  - 말하고 / 전합니다
  lexicon: BDAG
  rationale: 두 동사는 모두 발화 행위를 가리키므로 한국어에서는 같은 기본 동사 ‘말하다’로 대응하되, 앞은 부정법적 나열, 뒤는 현재적 선언으로 살려 자연스러움을 유지했습니다.
- source_word: κρίνειν
  english_pob_choice: to judge
  chosen_korean: 판단할
  alternatives_korean:
  - 심판할
  - 정죄할
  lexicon: BDAG
  rationale: 문맥상 ‘정죄하다’보다 넓은 판단 행위가 더 적절하므로, 법정적 울림을 유지하면서도 과도하게 좁히지 않는 ‘판단하다’를 택했습니다.
- source_word: ὁ πέμψας με
  english_pob_choice: the one who sent me
  chosen_korean: 나를 보내신 분
  alternatives_korean:
  - 나를 보내신 이
  - 보내신 분
  lexicon: BDAG
  rationale: 헬라어 분사구문을 인격적 주체로 자연스럽게 풀어 옮겼으며, 요한복음의 문맥상 아버지를 가리키지만 본문에 없는 명칭을 덧붙이지 않았습니다.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα
  english_pob_choice: what I heard from him, these things
  chosen_korean: 그분에게서 내가 들은 것을, 이것들을
  alternatives_korean:
  - 그분에게서 들은 것을, 이것을
  - 내가 그분에게서 들은 바를
  lexicon: BDAG
  rationale: 뒤에 반복되는 지시대명사 ταῦτα를 한국어에서도 살려, 앞의 상대절 내용과 뒤의 강조적 재지시를 분명하게 드러냈습니다.
theological_decisions:
- issue: ‘the one who sent me’의 지시 대상
  chosen_reading: 본문의 표현을 따라 ‘나를 보내신 분’으로 두고, 지시 대상인 아버지를 본문 밖에서 암시만 남겼습니다.
  alternative_readings:
  - ‘아버지께서 나를 보내셨습니다’처럼 명시적으로 풀기
  rationale: 요한복음 문맥에서는 아버지를 가리키는 것이 분명하지만, 헬라어는 여기서 명시명사 대신 분사구를 사용하므로 본문 형식을 우선했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: κρίνειν의 강도
  chosen_reading: ‘판단할’로 옮겨 정죄보다 넓은 뜻을 유지했습니다.
  alternative_readings:
  - 정죄할
  - 심판할
  rationale: 예수께서 청중에 대해 말할 뿐 아니라 판단할 근거가 있음을 말하지만, 이 절만으로 곧바로 ‘정죄’로 좁힐 필요는 없습니다.
  doctrine_reference: Translation philosophy §3
