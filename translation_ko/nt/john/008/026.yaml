  to: 나는 여러분에 관하여[a] 말하고 판단할 것이 많이 있습니다. 그러나 나를 보내신 분은 참되십니다. 그리고 내가 그분에게서 들은 것들, 바로 그것들을[b] 나는 세상에 말합니다.
