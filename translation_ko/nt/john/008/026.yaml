    issue: ‘그분에게서 내가 들은 것을, 이것들을’의 문법 및 수 일치
    rationale: ἃ와 ταῦτα는 모두 중성 복수이며, ταῦτα는 앞의 내용을 강조하여 다시 가리킵니다. 한국어에서는 ‘들은 것들, 바로 그것들’을 사용해야 복수성과 강조를 살리면서 목적격 조사의 어색한 중복을 피할 수 있습니다.
