review_pass:
  verdict: revise
  source_fidelity: 핵심 서술은 대체로 충실합니다. 다만 παρεγένετο는 이 문맥에서 ‘성전으로 오셨습니다’가 가장 직접적이며, ἤρχετο의 미완료상은 ‘오고 있었습니다’로 유지하는 것이 적절합니다. ἐδίδασκεν은 시작의 뉘앙스로 옮길 수 있으므로 ‘가르치기 시작하셨습니다’도 가능합니다.
  naturalness: 합쇼체와 문장 흐름은 자연스럽습니다. ‘온 백성’과 존칭 대명사 ‘그분’을 사용하면 현대 한국어 성경 문체에서 더 매끄럽고, 예수에 대한 일관된 존칭도 유지됩니다.
  terminology: ἱερόν은 내소(ναός)와 구별되는 성전 전체 परिसर를 가리키지만, 이 문맥에서는 ‘성전’이 적절합니다. 본문비평 주석은 영어 POB에 있는 내용을 한국어에도 각주와 실제 표지로 보존해야 합니다.
  issues:
  - severity: medium
    issue: 본문비평 각주가 번역문과 함께 제공되지 않았고, 따라서 각주 표지도 없습니다.
    rationale: 영어 POB 감사 기록에는 이 절이 요한복음 7:53–8:11 단락에 속하며 초기 그리스어 사본들에는 없다는 본문비평 각주가 있습니다. 번역문에 대응 표지를 두고 한국어 각주를 제공해야 각주 정보와 앵커가 보존됩니다.
  - severity: low
