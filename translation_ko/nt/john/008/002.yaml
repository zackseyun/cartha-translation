  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
  footnotes:
  - marker: a
    text: This verse is a continuation of the story of the woman caught in adultery (John 7:53–8:11), which is absent from the earliest Greek manuscripts. See note on John 7:53.
    reason: textual_critical
translation:
  language: ko
  text: 새벽에 예수께서 다시 성전으로 가셨습니다. 모든 백성이 그에게로 오고 있었고, 예수께서는 앉으셔서 그들을 가르치기 시작하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὄρθρου
  english_pob_choice: At dawn
  chosen_korean: 새벽에
  alternatives_korean:
  - 동틀 무렵에
  - 해 뜰 무렵에
  lexicon: BDAG
  rationale: 시간 부사를 자연스러운 현대 한국어로 옮기되, 이른 아침의 경계를 나타내는 의미를 살렸습니다.
- source_word: παρεγένετο
  english_pob_choice: he came
  chosen_korean: 가셨습니다
  alternatives_korean:
  - 오셨습니다
  - 도착하셨습니다
  lexicon: BDAG
  rationale: 장소 이동을 단순한 도착보다 자연스럽게 표현하되, 예수의 이동을 서술하는 문맥에 맞게 ‘가다’ 계열로 풀었습니다.
- source_word: ἱερόν
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
  - 성전 뜰
  - 성전 구역
  lexicon: BDAG
  rationale: ναός가 아니라 ἱερόν이어서 성전 परिसर 전체를 가리키는 말입니다. 한국어에서는 공적 가르침이 이루어지는 장소를 간명하게 ‘성전’으로 옮겼습니다.
- source_word: ἐδίδασκεν
  english_pob_choice: began to teach
  chosen_korean: 가르치기 시작하셨습니다
  alternatives_korean:
  - 가르치고 계셨습니다
  - 가르치셨습니다
  lexicon: BDAG
  rationale: 부정과거 분사 뒤의 미완료 시상을, 영어 POB처럼 시작 동작의 뉘앙스를 살려 ‘가르치기 시작하셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 이 절의 본문 위치와 단락 성격
  chosen_reading: 본문에 별도 주석은 달지 않고 본문만 번역했습니다.
  alternative_readings:
  - 요한복음 7:53–8:11의 단락 연속이라는 본문비평 주석을 본문 각주로 표시함
  rationale: 영어 POB의 본문비평 각주는 번역문이 아니라 주석 정보이므로, 이번 제출에서는 본문 재현에 집중했습니다.
  doctrine_reference: textual criticism / apparatus practice
