review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. οὐκ ἔγνωσαν은 문맥상 ‘이해하지 못했습니다’로 옮기는 것이 적절하며, τὸν πατέρα는 요한복음의 문맥에 따라 ‘아버지’로 유지하는 것이 좋습니다. 다만 αὐτοῖς는 예수님의 말씀을 듣는 대상을 가리키므로 ‘자기들에게’보다 ‘그들에게’가 더 정확하고 모호함이 없습니다. ἔλεγεν의 미완료적 배경 동작은 ‘말씀하고 계셨다는’으로 자연스럽게 드러낼 수 있습니다.
  naturalness: 원문의 ‘자기들에게’는 주어인 예수님과의 재귀 관계로도 잠시 읽힐 수 있어 현대 표준어 문장에서는 ‘그들에게’가 더 자연스럽습니다. 또한 ‘…줄을 이해하지 못했습니다’보다 ‘…다는 것을 이해하지 못했습니다’가 격식 있는 산문에서 더 명료합니다.
  terminology: ‘아버지’는 본문에 신학적 설명을 추가하지 않으면서도 문맥상 하나님을 가리키는 호칭을 보존합니다. 예수님에 대한 높임말 ‘말씀하다’도 합쇼체 성경 번역의 문체와 잘 맞습니다.
  issues:
  - severity: low
    issue: ‘자기들에게’의 지시가 다소 모호합니다.
    rationale: αὐτοῖς는 청중을 뜻하므로 ‘그들에게’가 수신자를 직접적으로 표시하며, ‘자기들’이 예수님을 기준으로 재귀적으로 읽힐 여지를 없앱니다.
  - severity: low
    issue: ‘…줄을 이해하지 못했습니다’의 연결이 다소 덜 명료합니다.
    rationale: 내용절 ὅτι는 ‘…다는 것을’으로 옮기면 현대 격식 문체에서 더 분명하며, 원문의 내용 관계도 잘 드러납니다.
  revised_text: 그들은 예수님께서 그들에게 아버지에 관하여 말씀하고 계셨다는 것을 이해하지 못했습니다.[a]
