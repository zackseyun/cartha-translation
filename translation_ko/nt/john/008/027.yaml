lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  english_pob_choice: They did not understand
  chosen_korean: 이해하지 못했습니다
  alternatives_korean:
  - 알지 못했습니다
  - 깨닫지 못했습니다
  lexicon: BDAG
  rationale: γινώσκω의 여기서는 단순한 정보 부재보다 예수님의 말씀의 의미를 파악하지 못한 뜻이어서, ‘이해하지 못했습니다’가 자연스럽고 문맥에 맞습니다.
- source_word: ἔλεγεν
  english_pob_choice: was speaking
  chosen_korean: 말씀하고 계신
  alternatives_korean:
  - 말하고 계신
  - 이야기하고 계신
  lexicon: BDAG
  rationale: 미완료 시상은 진행 중인 동작을 나타내므로, 한국어에서는 진행형 ‘말씀하고 계신’으로 살렸습니다.
- source_word: τὸν πατέρα
  english_pob_choice: the Father
  chosen_korean: 아버지
  alternatives_korean:
  - 그 아버지
  - 하나님 아버지
  lexicon: BDAG
  rationale: 요한복음의 문맥상 하나님을 가리키지만, 한국어에서는 본문에 없는 설명을 덧붙이지 않고 관계적 호칭 ‘아버지’로 옮겼습니다.
- source_word: αὐτοῖς
  english_pob_choice: to them
  chosen_korean: 자기들에게
  alternatives_korean:
  - 그들에게
  - 그들 앞에서
  lexicon: BDAG
  rationale: λέγω와 함께 쓰인 여격은 수신자를 나타내므로 ‘자기들에게’가 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: ‘the Father’의 지시 대상
  chosen_reading: 예수님이 하나님을 아버지로 지칭하신 것으로 이해되므로 한국어에서는 ‘아버지’로 두고, 신학적 해설은 본문 밖으로 넘기지 않았습니다.
  alternative_readings:
  - 인간의 아버지에 대한 언급
  - 더 직접적인 ‘하늘의 아버지’ 표현
  rationale: 요한복음의 즉각적 문맥은 예수님의 하나님 아버지 언어를 전제하지만, 본문 자체는 단순히 ‘아버지’라고 말하므로 과도한 확정을 피했습니다.
  doctrine_reference: 요한복음의 아버지-아들 언어; 원문 우선 원칙
