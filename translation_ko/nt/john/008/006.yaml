source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
  footnotes:
  - marker: a
    text: Continuation of the story of the woman caught in adultery (John 7:53–8:11). See note on John 7:53.
    reason: textual_critical
translation:
  language: ko
  text: 그들은 그를 시험하려고 이런 말을 하고 있었습니다. 그래서 그에게서 고발할 근거를 얻으려는 것이었습니다. 그러나 예수께서는 몸을 굽히시고 손가락으로 땅에 글을 쓰셨으며, 못 본 체하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 간음한 여인 이야기의 계속입니다(요 7:53–8:11). 요 7:53의 주석을 보십시오.
    reason: textual_variant
lexical_decisions:
- source_word: πειράζοντες
  english_pob_choice: to test
  chosen_korean: 시험하려고
  alternatives_korean:
  - 유혹하려고
  - 함정에 빠뜨리려고
  lexicon: BDAG
  rationale: 여기서는 단순한 유혹보다 예수를 곤경에 빠뜨리려는 악의적 시도가 핵심이므로, POB의 'to test'를 따라 '시험하려고'로 옮기는 것이 가장 자연스럽습니다.
- source_word: κατηγορίαν
  english_pob_choice: accusation
  chosen_korean: 고발할 근거
  alternatives_korean:
  - 고발
  - 비난
  - 혐의
  lexicon: BDAG
  rationale: 문맥상 율법 문제로 예수를 공식적으로 몰아붙일 법적 근거를 찾는 뜻이므로, 단순 명사형보다 '고발할 근거'가 의도와 기능을 더 분명히 드러냅니다.
- source_word: κάτω κύψας
  english_pob_choice: bending down
  chosen_korean: 몸을 굽히시고
  alternatives_korean:
  - 몸을 숙이시고
  - 허리를 굽히시고
  lexicon: LEX-μορφή
  rationale: 동작의 방향을 간결하게 살리면서도 문장 흐름이 자연스럽도록 '몸을 굽히시고'로 옮겼습니다.
- source_word: μὴ προσποιούμενος
  english_pob_choice: paying no attention
  chosen_korean: 못 본 체하셨습니다
  alternatives_korean:
  - 못 들은 체하셨습니다
  - 주의하지 않으셨습니다
  - 모른 척하셨습니다
  lexicon: BDAG
  rationale: 부정 분사로 된 '의도적으로 외면함'의 뉘앙스를 한국어 관용에 맞게 압축해, 반응을 보이지 않으신 상태를 자연스럽게 전달합니다.
theological_decisions:
- issue: 이 단락의 본문 지위 표기 여부
  chosen_reading: 본문 흐름은 유지하되, 별도 본문주석 없이 번역문 자체는 연속 서술로 제시했습니다.
  alternative_readings:
  - 요한복음 7:53–8:11의 본문비평상 이견을 본문주석으로 명시
  - 해당 단락을 각주로만 처리
  rationale: 제공된 영어 POB가 이미 문맥 연속성을 전제로 하므로, 이 절 단위 초안에서는 본문 자체를 매끄럽게 번역하되 주석 체계는 별도 항목 없이 유지했습니다.
  doctrine_reference: textual_critical
