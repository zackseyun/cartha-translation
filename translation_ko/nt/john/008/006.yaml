revisions:
- from: 그들은 그를 시험하려고 이런 말을 하고 있었습니다. 그래서 그에게서 고발할 근거를 얻으려는 것이었습니다. 그러나 예수께서는 몸을 굽히시고 손가락으로 땅에 글을 쓰셨으며, 못 본 체하셨습니다.[a]
  to: 그들은 그를 시험하여 그를 고발할 근거를 얻으려고 이렇게 말하고 있었습니다. 그러나 예수께서는 몸을 굽히시고 손가락으로 땅에 글을 쓰시면서, 아랑곳하지 않는 체하셨습니다.[a]
  rationale: 목적절과 ‘그를 반대하여’라는 법정적 방향성을 명확히 하였고, 예수께서 의도적으로 반응하지 않는 체하셨다는 마지막 분사의 뉘앙스를 살렸습니다. 각주는 영어 POB 감사 기록과 일치하도록 본문비평적 사유로 분류했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:14Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 목적절은 원문의 ἵνα(‘~하기 위하여’)를 더 직접적으로 반영해야 하며, κατ’ αὐτοῦ는 ‘그에게서’가 아니라 ‘그를 고발할’ 근거를 뜻합니다. 마지막 분사 μὴ προσποιούμενος는 단순히 못 본 것이 아니라 의도적으로 아랑곳하지 않는 체한 태도를 나타냅니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하면서, 두 개로 나뉜 첫 문장을 원문의 목적 관계가 드러나도록 자연스럽게 연결합니다.
  terminology: ‘시험하다’, ‘고발할 근거’, ‘땅에 글을 쓰다’는 문맥과 법정적 어휘를 적절히 반영합니다. ‘아랑곳하지 않는 체하시며’는 προσποιέομαι의 가장·외면의 뉘앙스를 보존합니다.
  issues:
  - severity: medium
    issue: ‘그에게서 고발할 근거’
    rationale: κατηγορίαν κατ’ αὐτοῦ는 예수를 대상으로 제기할 고발·혐의를 뜻합니다. ‘그에게서’는 근거의 출처가 예수인 것처럼 들릴 수 있으므로 ‘그를 고발할 근거’로 고쳐야 합니다.
  - severity: low
    issue: ἵνα 목적절이 ‘그래서’로 처리됨
    rationale: ‘그래서’는 결과 또는 인과로 읽히기 쉬우나, 원문은 그들이 이런 말을 한 의도를 나타내는 목적절입니다. ‘~하려고’로 연결하는 것이 더 정확합니다.
  - severity: low
    issue: ‘못 본 체하셨습니다’
    rationale: 원문은 보지 못한 체한다는 데 한정되지 않고, 의도적으로 반응하지 않는 체하는 태도를 나타냅니다. 더 포괄적인 표현이 적절합니다.
