source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἐν δὲ τῷ νόμῳ ἡμῶν Μωσῆς ἐνετείλατο τὰς τοιαύτας λιθοβολεῖσθαι· σὺ οὖν τί λέγεις;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/005.yaml
  text: Now[a] in our law, Moses commanded that such women be stoned. So what do you say?
  footnotes:
  - marker: a
    text: Continuation of the story of the woman caught in adultery (John 7:53–8:11). See note on John 7:53.
    reason: textual_critical
translation:
  language: ko
  text: '[a] 그런데 우리 율법에서 모세는 그런 여자들을 돌로 쳐 죽이라고 명령하였습니다. 그러면 당신은 무엇이라고 말씀하십니까?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 간음하다 붙잡힌 여인 이야기(요 7:53–8:11)의 계속입니다. 요 7:53의 주를 참조하십시오.
    reason: textual_variant
lexical_decisions:
- source_word: Ἐν δὲ τῷ νόμῳ ἡμῶν
  english_pob_choice: in our law
  chosen_korean: 우리 율법에는
  alternatives_korean:
  - 우리 법에는
  - 우리 율법 안에는
  lexicon: BDAG
  rationale: νόμος는 여기서 모세 율법을 가리키므로, POB의 ‘law’에 맞춰 ‘율법’으로 옮겼습니다.
- source_word: τοιαύτας
  english_pob_choice: such women
  chosen_korean: 그런 여자들은
  alternatives_korean:
  - 이런 여자들은
  - 그런 사람들은
  lexicon: BDAG
  rationale: 여성 복수 목적어를 가리키므로 ‘여자들’로 분명히 하고, 문맥상 간음으로 붙잡힌 여인들을 가리키는 뉘앙스를 살렸습니다.
- source_word: λιθοβολεῖσθαι
  english_pob_choice: be stoned
  chosen_korean: 돌로 치라고
  alternatives_korean:
  - 돌로 맞아 죽으라고
  - 돌로 치게 하라고
  lexicon: BDAG
  rationale: 모세 율법이 규정한 형벌로서의 ‘돌로 치다’를 자연스러운 한국어 명령형 간접화법으로 옮겼습니다.
- source_word: ἐνετείλατο
  english_pob_choice: commanded
  chosen_korean: 명령했습니다
  alternatives_korean:
  - 명하셨습니다
  - 지시했습니다
  lexicon: BDAG
  rationale: 모세의 권위 있는 규정 전달을 가장 직접적으로 드러내는 일반적 대응어입니다.
theological_decisions:
- issue: 예수께 대한 직접 발화의 높임말 처리
  chosen_reading: 후반부의 질문은 상대를 향한 직접 발화로 보아 “당신은 어떻게 말씀하시겠습니까?”로 정중하게 처리했습니다.
  alternative_readings:
  - “당신은 어떻게 말합니까?”
  - “그러니 무엇이라고 하십니까?”
  rationale: 문맥상 예수께 도전하는 말이지만, 한국어 합쇼체에서는 직접 대상을 높여 묻는 형태가 가장 자연스럽습니다.
  doctrine_reference: 공손한 직접 화법의 일관성
