revisions:
- from: 그런데 우리 율법에는 모세가 그런 여자들은 돌로 치라고 명령했습니다. 그러니 당신은 어떻게 말씀하시겠습니까?[a]
  to: '[a] 그런데 우리 율법에서 모세는 그런 여자들을 돌로 쳐 죽이라고 명령하였습니다. 그러면 당신은 무엇이라고 말씀하십니까?'
  rationale: 현재형 질문을 현재형 존대 표현으로 바로잡고, 돌로 치는 형벌이 사형임을 한국어에서 명료하게 했습니다. δέ의 연결은 ‘그런데’로, 여성 복수 목적어는 ‘그런 여자들’로 보존했습니다. 본문비평 주석의 문구는 유지하되 표지를 절 첫머리로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:13Z'
review_pass:
  verdict: revise
  source_fidelity: 후반의 λέγεις는 현재형인데 초안의 ‘말씀하시겠습니까?’는 미래·의향으로 옮겨졌습니다. 또한 λιθοβολεῖσθαι는 율법상 사형 집행인 돌로 쳐 죽임을 가리키므로 이를 분명히 하는 편이 적절합니다.
  naturalness: ‘우리 율법에서 모세는’과 ‘무엇이라고 말씀하십니까?’가 현대 표준어 합쇼체의 직접 발화로 자연스럽습니다.
  terminology: ‘율법’, ‘모세’, ‘돌로 쳐 죽이다’는 문맥과 한국어 성경 번역 관습에 부합합니다. τοιαύτας의 여성 복수는 ‘그런 여자들’로 유지했습니다.
  issues:
  - severity: medium
    issue: 질문의 시제가 미래형으로 번역됨
    rationale: τί λέγεις는 직설법 현재 ‘당신은 무엇이라고 말합니까?’이므로 ‘말씀하시겠습니까?’(미래/의향)를 피해야 합니다.
  - severity: medium
    issue: 형벌의 결과가 불충분하게 드러남
    rationale: λιθοβολεῖσθαι는 이 문맥에서 돌로 쳐 죽이는 처형을 뜻합니다. ‘돌로 치라고’는 상해 행위로도 이해될 수 있습니다.
  - severity: low
    issue: 본문 전체에 관한 본문비평 주석의 표지 위치
    rationale: 주석은 요 7:53–8:11 단락 전체와 관련되므로 절의 첫머리에 표지를 두는 것이 범위를 더 분명히 합니다.
