  - severity: low
    issue: ‘결코 영원히 죽음을 맛보지 않을 것이다’의 부사 위치
    rationale: 뜻은 대체로 전달되지만 ‘영원히’가 ‘맛보다’의 부정 범위를 받는다는 점을 더 분명히 하려면 ‘영원토록 결코 죽음을 맛보지 않을 것입니다’가 자연스럽습니다.
