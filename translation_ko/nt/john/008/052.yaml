id: JHN.8.52
reference: John 8:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
  footnotes:
  - marker: a
    text: Or, “you are demon-possessed.” The Greek is literally, “you have a demon.”
    reason: lexical_alternative
  - marker: b
    text: “Will certainly never taste death forever” is an emphatic Greek expression meaning “will never ever taste death.”
    reason: lexical_alternative
  - marker: c
    text: Or 'he will certainly never taste death forever'.
    reason: previous_rendering
translation:
  language: ko
  text: 유대인들이 그에게 말했습니다. 「이제야 우리는 당신에게 귀신이 들렸다는 것을 알았습니다.[a] 아브라함도 죽었고 예언자들도 죽었는데, 당신은 ‘누구든지 내 말을 지키면 영원토록 결코 죽음을 맛보지 않을 것입니다’라고 말합니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀신이 들렸다’는 본문의 직역적 표현인 ‘귀신을 가지고 있다’의 자연스러운 한국어 풀이입니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어의 οὐ μή는 강한 부정이며, 여기서는 ‘결코 …하지 않을 것이다’라는 뜻입니다. ‘영원토록’은 이 부정이 언제까지나 유효함을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: The Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대 지도자들
  - 유대인들(주요층)
  lexicon: BDAG
  rationale: 본문이 직접 가리키는 집단을 그대로 살리되, 문맥상 예수와 대립하는 유대인들을 가리키는 표준적 표현으로 옮겼습니다.
- source_word: δαιμόνιον ἔχεις
  english_pob_choice: you have a demon
  chosen_korean: 당신에게 귀신이 들렸다는 것을 알겠습니다
  alternatives_korean:
  - 당신은 귀신이 있습니다
  - 당신은 귀신 들린 사람입니다
  lexicon: BDAG
  rationale: 헬라어의 직역인 ‘귀신을 가지고 있다’는 한국어에서 부자연스러워, 본문의 모욕적 진술을 드러내면서도 의미를 자연스럽게 전달했습니다.
- source_word: τὸν λόγον μου τηρήσῃ
  english_pob_choice: keeps my word
  chosen_korean: 내 말을 지키면
  alternatives_korean:
  - 내 말씀을 지키면
  - 내 말을 지키고 따르면
  lexicon: BDAG
  rationale: λόγος를 여기서는 ‘말’로 옮겨 예수의 발화를 직접 가리키는 요한복음의 용법을 살렸고, τηρέω는 ‘지키다’로 옮겨 단순한 순종보다 더 넓은 ‘붙들고 보존함’의 뉘앙스를 남겼습니다.
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  english_pob_choice: he will certainly never taste death forever
  chosen_korean: 결코 영원히 죽음을 맛보지 않을 것이다
  alternatives_korean:
  - 결코 죽음을 맛보지 않을 것이다
  - 죽음을 영원히 맛보지 않을 것이다
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정과 γεύομαι의 비유적 표현을 살려 ‘죽음을 맛보다’를 유지했고, εἰς τὸν αἰῶνα는 ‘영원히’로 옮겨 부정의 지속성을 드러냈습니다.
theological_decisions:
- issue: ‘죽음을 맛보다’ 표현의 범위
  chosen_reading: 본문의 비유적 표현을 그대로 유지해, 육체적 죽음·영적 죽음·종말론적 죽음 중 어느 하나로 본문에서 미리 한정하지 않았습니다.
  alternative_readings:
  - 육체적 죽음
  - 영적 죽음
  - 영원한 죽음
  rationale: 문맥상 예수의 말은 다층적 의미를 가질 수 있으므로, 번역문은 논쟁의 여지를 보존하는 것이 가장 충실합니다.
  doctrine_reference: 해석을 본문 밖에서 확정하지 않고 긴장을 유지합니다.
