id: JHN.8.35
reference: John 8:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: Now the slave does not remain in the household forever[b][a]; the son remains forever.
  footnotes:
  - marker: a
    text: Or 'servant'; Greek doulos can mean either, but 'slave' best preserves the contrast in status within the household here.
    reason: lexical_alternative
  - marker: b
    text: '''The son'' may also carry an implicit reference to Jesus in the surrounding context, though the wording here is also proverb-like.'
    reason: alternative_reading
translation:
  language: ko
  text: 종[a]은 집에 영원히 머물지 않지만, 아들[b]은 영원히 머뭅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종’은 여기서 단순한 ‘하인’보다 신분상 비자유 상태를 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아들’은 이 문맥에서 예수를 가리키는 암시로도 읽힐 수 있지만, 문장 자체는 속담처럼도 들립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: BDAG
  rationale: 이 절의 핵심 대비는 아들과의 신분 차이이므로, 한국어에서는 관계적·사회적 종속성을 드러내는 ‘종’이 가장 자연스럽고, 너무 현대적 법률어감의 ‘노예’는 본문의 비유적 진술을 다소 거칠게 만들 수 있습니다.
- source_word: οἰκίᾳ
  english_pob_choice: household
  chosen_korean: 집
  alternatives_korean:
  - 가정
  - 집안
  - 집안살이
  lexicon: BDAG
  rationale: 영어 POB가 ‘household’로 풀이했지만, 원문 οἰκίᾳ는 ‘집/집 안’의 공간적 배경을 가지므로 한국어에서는 비유의 자연스러움을 살려 ‘집에’로 옮겼습니다. 문맥상 소속과 상속의 함의는 아들과 종의 대비가 이미 충분히 드러냅니다.
- source_word: μένει
  english_pob_choice: remain
  chosen_korean: 머뭅니다
  alternatives_korean:
  - 남습니다
  - 있습니다
  - 거합니다
  lexicon: BDAG
  rationale: 반복되는 μένει를 한국어에서도 반복으로 살려 지속·잔류의 의미를 유지하기 위해 ‘머뭅니다’를 택했습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  - 세세토록
  lexicon: BDAG
  rationale: 현대 표준어에서 가장 직접적이고 자연스러운 지속성 표현인 ‘영원히’로 옮겨, 두 절의 시간 대비를 분명히 했습니다.
- source_word: υἱός
  english_pob_choice: son
  chosen_korean: 아들
  alternatives_korean:
  - 자녀
  - 아들로서의 자
  - 아들
  lexicon: BDAG
  rationale: 원문의 남성 단수 대비를 유지하고, 종과의 신분 대비 및 주변 문맥의 잠재적 기독론적 울림을 살리기 위해 ‘아들’로 옮겼습니다.
theological_decisions:
- issue: ‘아들’의 기독론적 함의와 일반 속담적 표현의 긴장
  chosen_reading: 본문 자체는 일반적인 집안 비유처럼 말하면서도, 주변 문맥에서 예수께 대한 암시를 열어 둔 채 ‘아들’을 그대로 유지했습니다.
  alternative_readings:
  - 아들(대문자 암시로 ‘아들’=예수)
  - 아들(완전 일반명사로만 이해)
  rationale: 원문은 이 절만으로 기독론을 단정하지 않지만, 바로 이어지는 문맥에서 예수의 자기 정체성과 연결될 여지를 남깁니다. 한국어에서도 그 긴장을 해치지 않도록 평이한 표기를 유지했습니다.
  doctrine_reference: 본문 문맥의 다의성을 보존하고, 지나친 해석적 확정을 피함
