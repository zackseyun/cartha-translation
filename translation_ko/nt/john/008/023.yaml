- from: 그리고 그분은 그들에게 말씀하고 계셨습니다[a]. 「너희는 아래로부터 왔고, 나는 위로부터 왔다. 너희는 이 세상에 속해 있고[b], 나는 이 세상에 속한 사람이 아닙니다.」
  to: 그리고 그분은 그들에게 말씀하고 계셨습니다[a]. “너희는 아래에서 왔습니다. 나는 위에서 왔습니다. 너희는 이 세상에서 왔습니다[b]. 나는 이 세상에서 오지 않았습니다.”
  rationale: The revision restores the repeated ἐκ (‘from’) formulation in each of the four antithetical clauses, removes the added notion ‘person,’ and maintains the Johannine vertical and world-related imagery without resolving it into a narrower doctrinal claim. It also regularizes the quotation in formal-polite Korean and corrects both footnotes for naturalness and semantic accuracy.
