id: JHN.8.23
reference: John 8:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
  footnotes:
  - marker: a
    text: Or “You are of what is below … I am of what is above.”
    reason: lexical_alternative
  - marker: b
    text: In John, “world” often refers not merely to the physical earth but to the human order in alienation from God.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그분은 그들에게 말씀하고 계셨습니다[a]. “너희는 아래에서 왔습니다. 나는 위에서 왔습니다. 너희는 이 세상에서 왔습니다[b]. 나는 이 세상에서 오지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희는 아래에 속하고 … 나는 위에 속한다.”
    reason: lexical_alternative
  - marker: b
    text: 요한복음에서 ‘세상’은 흔히 단순한 물리적 땅만이 아니라 하나님에게서 멀어진 인간 질서를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  english_pob_choice: was saying
  chosen_korean: 말씀하고 계셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 이야기하고 계셨습니다
  lexicon: SBLGNT / BDAG
  rationale: 미완료 과거의 진행·반복 뉘앙스를 살리기 위해 단순 과거보다 진행형에 가까운 표현을 택했습니다. 예수님의 발화에 맞게 ‘말씀하다’를 사용했습니다.
- source_word: ἐκ τῶν κάτω / ἐκ τῶν ἄνω
  english_pob_choice: from below / from above
  chosen_korean: 아래로부터 왔고 / 위로부터 왔다
  alternatives_korean:
  - 아래에서 왔고 / 위에서 왔다
  - 아래에 속해 있고 / 위에 속해 있다
  lexicon: BDAG
  rationale: 영어 POB의 원천/기원 강조를 따라 ‘-로부터 왔다’로 옮겨, 공간적 대비와 출처의 대비를 함께 살렸습니다.
- source_word: κόσμος
  english_pob_choice: world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 세속
  lexicon: BDAG
  rationale: 요한복음에서 κόσμος는 단순한 물리적 지구보다 하나님과 어긋난 인간 질서를 가리키는 경우가 많으므로, 한국어에서는 문맥상 자연스럽고 신학적 함의를 담을 수 있는 ‘세상’을 택했습니다.
- source_word: ἐκ τοῦ κόσμου τούτου
  english_pob_choice: from this world
  chosen_korean: 이 세상에 속해 있고 / 이 세상에 속한 사람이 아닙니다
  alternatives_korean:
  - 이 세상으로부터 왔고 / 이 세상으로부터 온 사람이 아닙니다
  - 이 세상에 속하지 않고 / 이 세상에 속한 사람이 아닙니다
  lexicon: BDAG
  rationale: 반복되는 ἐκ 구조를 한국어에서 단순한 출신보다 ‘소속/출처’의 뉘앙스로 자연스럽게 드러내기 위해 ‘속해 있다’ 계열을 사용했습니다. 마지막 절은 영어 POB의 ‘not from this world’를 따라 소속과 기원을 함께 느끼게 했습니다.
theological_decisions:
- issue: ‘world/세상’의 의미 범위
  chosen_reading: 물리적 우주가 아니라 하나님과 대립하는 인간 질서라는 요한복음의 함의를 유지하되, 본문 자체를 넘는 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘세상’을 단순한 지구/세계로 좁게 이해하는 번역
  - ‘세속’으로 노골적으로 도덕화하는 번역
  rationale: 영어 POB가 footnote로 지적하듯, 요한복음의 ‘world’는 종종 신학적·인류학적 범주입니다. 그러나 본문은 그 의미를 해설하기보다 대비를 제시하므로, 번역도 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
