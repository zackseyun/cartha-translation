id: JHN.8.19
reference: John 8:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
  footnotes:
  - marker: a
    text: Or, more formally, “If you had known me, you would have known my Father also.” The Greek condition can be rendered to emphasize contrary-to-fact force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 예수께 물었습니다. “당신의 아버지는 어디에 있습니까?” 예수께서 대답하셨습니다. “너희는 나도 내 아버지도 알지 못합니다. 너희가 나를 알았다면, 내 아버지도 알았을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희가 나를 알았다면, 내 아버지도 알았을 것입니다’은 헬라어 조건문의 반사실적 뉘앙스를 살린 옮김입니다. 더 문자적으로는 ‘너희가 나를 알았더라면, 내 아버지도 알았을 것입니다’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον οὖν
  english_pob_choice: So they were saying
  chosen_korean: 그러므로 그들이 말하곤 했습니다
  alternatives_korean:
  - 그들이 말했습니다
  - 그러므로 그들이 말했습니다
  lexicon: BDAG
  rationale: ἔλεγον의 미완료 시상은 단발보다 지속·반복의 뉘앙스를 띠므로, 한국어에서는 ‘말하곤 했습니다’로 자연스럽게 살려 주었습니다. οὖν은 앞뒤 문맥 연결을 나타내어 ‘그러므로’로 옮겼습니다.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  english_pob_choice: Where is your Father?
  chosen_korean: 당신의 아버지는 어디 있습니까?
  alternatives_korean:
  - 네 아버지는 어디 있습니까?
  - 당신의 아버지는 어디에 있습니까?
  lexicon: BDAG
  rationale: 직접 질문의 구조를 그대로 살리되, 한국어에서는 주어-서술어 순서를 자연스럽게 조정했습니다. ‘아버지’는 예수의 아버지 곧 하나님을 가리키는 문맥이지만, 본문 자체의 단어는 그대로 유지했습니다.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  english_pob_choice: You know neither me nor my Father
  chosen_korean: 너희는 나도 내 아버지도 알지 못합니다
  alternatives_korean:
  - 너희는 나도 내 아버지도 알지 못합니다
  - 너희는 나도 내 아버지도 모릅니다
  lexicon: BDAG
  rationale: οὔτε...οὔτε의 대구를 ‘나도 …도’로 살리고, οἶδα의 관계적 인지 의미를 한국어의 ‘알지 못합니다’로 옮겼습니다. ‘모릅니다’보다 본문상의 앎/모름의 대칭이 더 분명합니다.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  english_pob_choice: If you knew me, you would know my Father also
  chosen_korean: 너희가 나를 알았다면, 내 아버지도 알았을 것입니다
  alternatives_korean:
  - 너희가 나를 알았다면, 내 아버지도 알았을 것입니다
  - 너희가 나를 알았더라면, 내 아버지도 알았을 것입니다
  lexicon: BDAG
  rationale: 조건문은 헬라어의 현재 반사실적 뉘앙스를 과도하게 과거화하지 않도록 ‘-았다면 ... -을 것입니다’로 옮겼습니다. καί는 문맥상 ‘또한’의 기능을 하므로 종결부에 자연스럽게 반영했습니다.
theological_decisions:
- issue: 예수의 ‘아버지’ 호칭을 한국어에서 어떻게 표기할지
  chosen_reading: ‘내 아버지’로 일관되게 표기했습니다.
  alternative_readings:
  - ‘내 아버지’ 소문자형 대응
  - ‘내 아버지’ 대신 ‘하늘 아버지’
  rationale: 본문의 호칭은 요한복음 문맥에서 하나님을 가리키지만, 한국어에서는 영어식 대문자 구분이 없으므로 별도 확장 없이 ‘내 아버지’로 옮겨 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §6
- issue: οἶδα 계열을 ‘알다’로 번역할지 ‘인정하다/깨닫다’로 풀어낼지
  chosen_reading: ‘알다’ 계열을 유지했습니다.
  alternative_readings:
  - ‘인정하다’
  - ‘깨닫다’
  rationale: 이 절은 예수와 아버지를 아는 지식의 신학적 연관을 직접 말하므로, 해석을 좁히는 표현보다 넓고 직접적인 ‘알다’가 본문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §3
