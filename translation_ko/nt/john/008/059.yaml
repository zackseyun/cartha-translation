id: JHN.8.59
reference: John 8:59
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
  footnotes:
  - marker: a
    text: Or more precisely, 'out of the temple precincts/courts'; the Greek word here is ἱερόν, referring to the temple complex rather than the inner sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 돌들을 집어 들어 그에게 던지려 했으나, 예수께서는 몸을 숨기시고 성전에서 나가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 정확히는 ‘성전 경내/뜰 밖으로’입니다. 여기의 ἱερόν은 내적 성소가 아니라 성전 복합구역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  english_pob_choice: picked up
  chosen_korean: 집어 들어
  alternatives_korean:
  - 들어 올리고
  - 취하고
  lexicon: BDAG
  rationale: 돌을 손에 들어 공격하려는 동작이므로, 현대 한국어에서 자연스럽고 행위 의도가 드러나는 ‘집어 들어’로 옮겼습니다.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  english_pob_choice: to throw at him
  chosen_korean: 그에게 던지려 했으나
  alternatives_korean:
  - 그에게 던지기 위해
  - 그를 향해 던지도록
  lexicon: BDAG
  rationale: ἵνα+접속법의 목적을 한국어에서는 자연스럽게 의도 표현으로 풀었고, ἐπί+대상 관계를 ‘그에게’로 옮겨 폭력적 방향성을 살렸습니다.
- source_word: ἐκρύβη
  english_pob_choice: hid himself
  chosen_korean: 몸을 숨기시고
  alternatives_korean:
  - 숨으시고
  - 스스로 숨으시고
  lexicon: BDAG
  rationale: 형태는 수동처럼 보여도 문맥상 예수의 자기-은폐 동작을 뜻하므로, 주어의 능동성을 살리면서도 한국어에서 자연한 ‘몸을 숨기시고’를 택했습니다.
- source_word: ἐκ τοῦ ἱεροῦ
  english_pob_choice: out of the temple
  chosen_korean: 성전에서 나가셨습니다
  alternatives_korean:
  - 성전 밖으로 나가셨습니다
  - 성전 경내에서 나가셨습니다
  lexicon: BDAG
  rationale: ἱερόν이 성전 건물 자체보다 성전 복합구역을 가리키지만, 본문 흐름에서는 간결한 ‘성전’이 자연스럽고, 더 정밀한 의미는 각주로 보완할 수 있습니다.
theological_decisions:
- issue: 예수의 이탈 방식에 대한 확장 여부
  chosen_reading: 본문이 말하는 범위 내에서 예수께서 몸을 숨기시고 성전에서 나가신 것으로만 번역했습니다.
  alternative_readings:
  - 기적적으로 그들 가운데를 지나가셨다
  - 보이지 않게 되셨다
  rationale: 제시된 SBLGNT 본문은 숨으심과 خروج만 말하며, 후대 전승의 확장 요소를 번역에 들이지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 번역에 없는 서술을 추가하지 않음
