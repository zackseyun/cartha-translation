revisions:
- from: 그들이 돌들을 집어 들어 그에게 던지려 했으나, 예수께서는 몸을 숨기시고 성전에서 나가셨습니다.[a]
  to: 그러므로 그들은 그에게 던지려고 돌을 집어 들었습니다. 그러나 예수께서는 몸을 숨기시고 성전에서 나가셨습니다.[a]
  rationale: ἵνα+접속법의 목적을 ‘던지려고’로 옮겨 돌을 집어 든 행위의 의도를 정확히 나타냈고, οὖν을 ‘그러므로’로 반영했습니다. 예수의 이탈에 관해서는 본문에 없는 기적적·확장적 설명을 더하지 않았습니다. 각주는 ἱερόν의 성전 경내/뜰 의미를 더 분명하게 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:19Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘그에게 던지려 했으나’는 ἵνα βάλωσιν의 목적 표현을 ‘던지려고 했으나’라는 미수 행위로 바꾸어, 돌을 집어 든 행위의 목적을 다소 약화합니다. 또한 οὖν의 결과·추론 연결을 본문에 반영하는 것이 좋습니다.
  naturalness: ‘그러므로 그들은 그에게 던지려고 돌을 집어 들었습니다. 그러나…’는 현대 표준 한국어 합쇼체로 자연스럽고, 두 절의 대조도 분명합니다. ‘몸을 숨기시고’도 자연스럽습니다.
  terminology: ‘성전’은 본문에서 자연스럽게 사용할 수 있으며, ἱερόν이 성소 건물 자체(ναός)가 아니라 성전 경내·뜰을 가리킨다는 점은 각주에서 정확히 밝혀야 합니다. 예수에 대한 높임말도 일관됩니다.
  issues:
  - severity: medium
    issue: 목적절을 미수 행위로 약화함
    rationale: ‘그에게 던지려 했으나’는 돌을 집어 든 뒤 실제로 던지려는 시도가 좌절된 듯한 뉘앙스를 줄 수 있습니다. 헬라어 ἵνα βάλωσιν은 돌을 집어 든 목적, 즉 ‘던지려고’를 나타냅니다.
  - severity: low
    issue: οὖν의 연결이 번역에서 빠짐
    rationale: οὖν은 앞 절의 발언에 따른 결과를 표시하므로 ‘그러므로’ 또는 ‘그래서’로 드러내는 편이 원문 충실성에 더 가깝습니다.
  - severity: low
    issue: 각주의 대안 표현이 다소 불명확함
    rationale: ‘성전 경내/뜰 밖으로’는 ‘뜰 밖’이라는 뜻으로 읽힐 여지가 있습니다. ἱερόν의 지시 범위를 ‘성전 경내 또는 성전 뜰’로 명료하게 설명하는 편이 좋습니다.
  revised_text: 그러므로 그들은 그에게 던지려고 돌을 집어 들었습니다. 그러나 예수께서는 몸을 숨기시고 성전에서 나가셨습니다.[a]
