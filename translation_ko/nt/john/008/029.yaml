id: JHN.8.29
reference: John 8:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
  footnotes:
  - marker: a
    text: Or, more formally, 'he did not leave me alone.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the things pleasing to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나를 보내신 분은 나와 함께 계십니다. 그분은 나를 홀로 버려 두지 않으셨습니다[b], 왜냐하면 나는 언제나 그분을 기쁘시게 하는 일을 하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 직역하면 ‘나를 홀로 두지 않으셨습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με
  english_pob_choice: the one who sent me
  chosen_korean: 나를 보내신 분
  alternatives_korean:
  - 나를 보낸 분
  - 나를 파송하신 분
  lexicon: BDAG
  rationale: 관계적 표현을 유지하되, 한국어에서는 신학적으로 자연스럽고 직역보다 덜 경직된 ‘보내신 분’으로 옮겼습니다. ‘파송하신’은 가능하지만 본문 전체의 평이한 진술에는 다소 교회적입니다.
- source_word: μετ’ ἐμοῦ ἐστιν
  english_pob_choice: is with me
  chosen_korean: 나와 함께 계십니다
  alternatives_korean:
  - 나와 함께 있습니다
  - 내 곁에 계십니다
  lexicon: BDAG
  rationale: μετά + 속격의 동행/함께함을 한국어의 자연스러운 존대 표현인 ‘함께 계십니다’로 옮겼습니다. ‘있습니다’보다 인격적 임재를 더 분명히 드러냅니다.
- source_word: οὐκ ἀφῆκέν με μόνον
  english_pob_choice: He has not left me alone
  chosen_korean: 나를 홀로 버려 두지 않으셨습니다
  alternatives_korean:
  - 나를 홀로 두지 않으셨습니다
  - 나를 혼자 두지 않으셨습니다
  lexicon: BDAG
  rationale: ἀφίημι의 ‘떠나다/버려 두다’ 뉘앙스를 살리면서, 한국어에서 ‘left me alone’의 관계적 의미를 가장 자연스럽게 전달하는 표현으로 옮겼습니다.
- source_word: τὰ ἀρεστὰ αὐτῷ
  english_pob_choice: what is pleasing to him
  chosen_korean: 그분을 기쁘시게 하는 일
  alternatives_korean:
  - 그분께 기쁜 것들
  - 그분께 기쁨이 되는 것들
  lexicon: BDAG
  rationale: 직역하면 ‘그분께 기쁜 것들’이지만, 한국어에서는 목적어화된 중성복수의 의미를 ‘기쁘시게 하는 일’로 풀어 자연스럽게 하되 평가적 의미를 유지했습니다.
- source_word: πάντοτε
  english_pob_choice: I always do
  chosen_korean: 언제나
  alternatives_korean:
  - 항상
  - 늘
  lexicon: BDAG
  rationale: 행위의 지속성과 습관성을 살리는 부사로 ‘언제나’를 택해, ‘always’의 반복적·상시적 의미를 유지했습니다.
theological_decisions:
- issue: ‘the one who sent me’의 인물 특정
  chosen_reading: 본문의 관계적 표현을 유지하고, ‘아버지’로 명시적으로 바꾸지 않았습니다.
  alternative_readings:
  - ‘나를 보내신 아버지’로 명시
  - ‘아버지께서 나를 보내셨습니다’로 의역
  rationale: 요한복음 문맥상 가리키는 분은 분명하지만, 원문이 사용하는 관계적 표현을 그대로 살려 요한의 문체와 긴장을 유지하는 편이 source-grounded합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: aorist ἀφῆκεν의 한국어 시제
  chosen_reading: 문맥상 현재적 효력을 살려 완료 의미의 존대형으로 옮겼습니다.
  alternative_readings:
  - 과거형 ‘버려 두지 않으셨습니다’
  - 현재형 ‘버려 두지 않으십니다’
  rationale: 원문의 과거형은 형식상 완료된 행위를 가리키지만, 진술의 초점은 예수에 대한 계속된 동행과 비버림에 있습니다. 한국어에서는 현재적 효력이 드러나는 완료형이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §6
