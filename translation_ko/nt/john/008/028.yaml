review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ἐγώ εἰμι의 술어 없는 표현을 본문에서 ‘내가 바로 그임’으로 다소 확정적으로 풀었고, 각주 표지가 해당 어구에 붙어 있지 않아 이중 의미와 대안 번역의 연결이 불분명합니다. 또한 ταῦτα는 ‘이것들’이 ‘이런 것들’보다 더 직접적입니다.
  naturalness: 합쇼체는 유지되어 있으나 ‘내가 바로 그임을’은 현대 한국어에서 다소 어색하고, 긴 종속절 안에 모든 내용을 묶어 놓아 문장 흐름이 무겁습니다. 문장을 분명히 나누고 ‘그분’으로 자연스럽게 다듬을 수 있습니다.
  terminology: ‘인자’, ‘아버지’, ‘들어 올리다’는 적절합니다. ‘들어 올리다’는 십자가와 높여짐의 중의성을 보존합니다. 다만 ‘그분’은 원문의 무술어성을 완전히 재현하지 못하므로, 각주에서 헬라어의 열린 표현을 명시해야 합니다.
  issues:
  - severity: medium
    issue: 각주 표지의 위치와 대상이 맞지 않습니다.
    rationale: a는 ἐγώ εἰμι에, b는 ὑψώσητε에 관한 각주인데, 초안에서는 두 표지가 문장 끝에 함께 붙어 있습니다. 해당 표현 바로 뒤에 표지를 두어 독자가 무엇을 설명하는지 알 수 있게 해야 합니다.
  - severity: medium
    issue: ἐγώ εἰμι의 원문상 무술어성과 번역상의 보충을 각주에서 충분히 밝히지 않았습니다.
    rationale: ‘내가 바로 그’는 자연스러운 번역을 위한 보충이지만, 원문에는 ‘그’에 해당하는 말이 없습니다. 본문을 자연스럽게 하되, 각주에서 원문이 술어 없는 ἐγώ εἰμι임을 밝혀 모호성을 보존해야 합니다.
  - severity: low
    issue: ‘이런 것들’은 ταῦτα의 직접적인 지시성을 약화합니다.
    rationale: ταῦτα는 ‘이것들/이 일들’에 가깝습니다. 문맥상 ‘이것들’을 사용하면 원문의 지시성을 더 잘 보존합니다.
  revised_text: 그러자 예수께서 말씀하셨습니다. “너희가 인자를 들어 올릴[b] 때에, 그때 너희는 내가 바로 그분임을[a] 알게 될 것입니다. 또 내가 스스로는 아무것도 하지 않으며, 아버지께서 내게 가르쳐 주신 대로 이것들을 말한다는 것도 알게 될 것입니다.”
  revised_footnotes:
