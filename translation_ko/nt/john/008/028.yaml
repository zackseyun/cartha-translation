    text: 본문의 ‘내가 바로 그분’은 헬라어 ἐγώ εἰμι를 자연스럽게 옮긴 것입니다. 원문에는 술어가 명시되어 있지 않아, 직역하면 “내가 있다” 또는 “나는 ~이다”와 같은 열린 표현입니다.
    reason: alternative_reading
  - marker: b
    text: ‘들어 올리다’는 육체적으로 들어 올리는 것과, 요한복음에서 말하는 높여짐 또는 영광을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: οὖν은 앞선 대화에서 이어지는 전환으로 ‘그러자’로 옮겼습니다. ὑψώσητε의 이중 의미는 ‘들어 올리다’와 해당 어구 직후의 각주로 보존했습니다. ἐγώ εἰμι는 한국어 본문에서 이해 가능한 ‘내가 바로 그분’으로 옮기되, 원문에 술어가 없다는 사실과 가능한 열린 읽기를 각주에 밝혀 신학적·문법적 모호성을 과도하게 해소하지 않았습니다. 원문의 병렬 구조도 두 문장으로 명료하게 반영했습니다.
