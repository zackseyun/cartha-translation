id: JHN.8.28
reference: John 8:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
  footnotes:
  - marker: a
    text: 'Or: “I am.” The Greek is simply “I am” (ἐγώ εἰμι), without an expressed predicate.'
    reason: alternative_reading
  - marker: b
    text: “Lift up” can refer both to being raised up physically and, in John’s usage, to exaltation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예수께서 말씀하셨습니다. “너희가 인자를 들어 올릴[b] 때에, 그때 너희는 내가 바로 그분임을[a] 알게 될 것입니다. 또 내가 스스로는 아무것도 하지 않으며, 아버지께서 내게 가르쳐 주신 대로 이것들을 말한다는 것도 알게 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘내가 바로 그분’은 헬라어 ἐγώ εἰμι를 자연스럽게 옮긴 것입니다. 원문에는 술어가 명시되어 있지 않아, 직역하면 “내가 있다” 또는 “나는 ~이다”와 같은 열린 표현입니다.
    reason: alternative_reading
  - marker: b
    text: ‘들어 올리다’는 육체적으로 들어 올리는 것과, 요한복음에서 말하는 높여짐 또는 영광을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν οὖν
  english_pob_choice: So Jesus said
  chosen_korean: 그러므로 예수님이 말씀하셨습니다
  alternatives_korean:
  - 그리하여 예수님이 말씀하셨습니다
  - 그러자 예수님이 말씀하셨습니다
  lexicon: SBLGNT, BDAG
  rationale: οὖν의 담화 연결과 이어지는 예수님의 발화를 자연스러운 합쇼체로 옮겼습니다. '그러므로'는 논리적/서사적 연결을 분명히 하면서도 과도하게 설교체로 들리지 않습니다.
- source_word: ὑψώσητε
  english_pob_choice: lift up
  chosen_korean: 들어 올릴 때에
  alternatives_korean:
  - 올려질 때에
  - 높이 올릴 때에
  lexicon: BDAG
  rationale: 요한복음에서 이 동사는 십자가에 달림과 높여짐의 이중 의미를 지니므로, 한쪽으로 해석을 닫지 않는 '들어 올리다'를 택했습니다.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자(人子)
  lexicon: BDAG
  rationale: 요한복음의 자기칭호를 관용적이고 문맥적으로도 익숙한 '인자'로 옮겼습니다. 이는 단순 직역보다 본문이 지닌 칭호적 기능을 더 잘 살립니다.
- source_word: ἐγώ εἰμι
  english_pob_choice: I am he
  chosen_korean: 내가 바로 그임을
  alternatives_korean:
  - 내가 바로 나임을
  - 내가 곧 나임을
  lexicon: BDAG
  rationale: 한국어에서는 영어의 'I am he'처럼 절제된 인칭 생략이 자연스럽지 않아, 지시적 의미를 살린 '내가 바로 그'로 옮겼습니다. 동시에 이 표현이 지닌 함축을 열어 두기 위해 서술형으로 과도하게 풀지 않았습니다.
- source_word: ἀπ’ ἐμαυτοῦ
  english_pob_choice: from myself
  chosen_korean: 내 스스로는
  alternatives_korean:
  - 내가 스스로는
  - 내 힘으로는
  lexicon: BDAG
  rationale: 출처/기원을 가리키는 표현과 자율적 주도권의 뉘앙스를 함께 살리기 위해 '내 스스로는'을 사용했습니다.
- source_word: ποιῶ οὐδέν
  english_pob_choice: I do nothing
  chosen_korean: 아무것도 하지 않고
  alternatives_korean:
  - 아무 일도 하지 않고
  - 전혀 하지 않고
  lexicon: BDAG
  rationale: 부정어와 동사의 일반 현재성을 살려, 예수님의 독자적 행위 부재를 간결하게 표현했습니다.
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  english_pob_choice: just as the Father taught me
  chosen_korean: 아버지께서 나에게 가르치신 그대로
  alternatives_korean:
  - 아버지께서 나를 가르치신 대로
  - 아버지께서 내게 가르치신 그대로
  lexicon: BDAG
  rationale: καθὼς의 대응 관계를 '그대로'로 살렸고, 요한복음의 '아버지'를 그대로 유지했습니다. '나에게'는 수혜/대상 관계를 분명히 합니다.
- source_word: ταῦτα λαλῶ
  english_pob_choice: I speak these things
  chosen_korean: 이런 것들을 말한다는 것도
  alternatives_korean:
  - 이것들을 말씀한다는 것도
  - 이 모든 것을 말한다는 것도
  lexicon: BDAG
  rationale: ταῦτα를 한국어 담화에서는 자연스러운 지시어군으로 풀어 '이런 것들'로 옮겼고, λαλέω의 발화 행위를 '말하다'로 유지했습니다.
theological_decisions:
- issue: ἐγώ εἰμι의 함축성 보존
  chosen_reading: '"내가 바로 그"'
  alternative_readings:
  - '"내가 바로 나입니다"'
  - '"나는 있다"'
  rationale: 본문은 술어가 없는 절대적 표현이라 신학적 함축을 가집니다. 한국어 본문에서는 자연성을 위해 의미를 드러내되, 자명한 신명(神名) 해석으로 닫지 않도록 '바로 그'를 사용했습니다.
  doctrine_reference: 의도적 모호성 보존
- issue: ὑψώσητε의 이중 의미 보존
  chosen_reading: 들어 올릴 때에
  alternative_readings:
  - 십자가에 못 박을 때에
  - 높여질 때에
  rationale: 요한복음 특유의 '높이 들림'은 십자가와 영광의 중첩을 지닙니다. 본문은 그 긴장을 유지해야 하므로 단일 해석어로 환원하지 않았습니다.
  doctrine_reference: 의도적 모호성 보존
