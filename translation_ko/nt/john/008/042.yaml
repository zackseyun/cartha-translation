id: JHN.8.42
reference: John 8:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
  footnotes:
  - marker: a
    text: Or, more formally, “because I proceeded from God and have come.”
    reason: lexical_alternative
  - marker: b
    text: Or, “For I have not come on my own.” The Greek can emphasize either source (“from myself”) or independent initiative.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. "만일 하나님이 너희 아버지이시라면, 너희는 나를 사랑할 것입니다. 내가 하나님에게서 나와 왔고 여기 있기 때문입니다. 나는 내 스스로 온 것이 아니라, 그분이 나를 보내셨습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, “내가 하나님에게서 나오고 와 있기 때문이다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “나는 내 뜻으로 온 것이 아니라.” 그리스어는 출처(“from myself”)와 독자적 주도권을 모두 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦς εἶπεν αὐτοῖς
  english_pob_choice: Jesus said to them
  chosen_korean: 예수께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그들에게 이르셨습니다
  - 예수께서 그들에게 말씀하셨다
  lexicon: SBLGNT
  rationale: 예수의 발화 동사를 현대 합쇼체로 자연스럽게 옮기되, 직접화법 도입을 분명하게 드러내기 위해 '말씀하셨습니다'를 택했습니다.
- source_word: εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν
  english_pob_choice: If God were your Father
  chosen_korean: 만일 하나님이 너희 아버지이시라면
  alternatives_korean:
  - 만일 하나님이 너희 아버지라면
  - 하나님이 너희 아버지이셨다면
  lexicon: BDAG
  rationale: 반사실 조건문을 한국어의 '-시라면'으로 옮겨 가정적 의미를 살렸고, θεός는 본문 관례에 따라 '하나님'으로 번역했습니다.
- source_word: ἠγαπᾶτε ἂν
  english_pob_choice: you would love me
  chosen_korean: 너희는 나를 사랑할 것입니다
  alternatives_korean:
  - 너희는 나를 사랑했을 것입니다
  - 너희는 나를 사랑하게 될 것입니다
  lexicon: BDAG
  rationale: 조건절의 결과를 현대 한국어에서 가장 자연스럽게 나타내는 '사랑할 것입니다'로 옮겨 반사실적 뉘앙스를 전달했습니다.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω
  english_pob_choice: I came from God and am here
  chosen_korean: 내가 하나님에게서 나와 왔고 여기 있기 때문입니다
  alternatives_korean:
  - 내가 하나님에게서 나와 왔고 지금 여기 있기 때문입니다
  - 내가 하나님에게서 나와 와서 지금 있습니다
  lexicon: BDAG
  rationale: ἐξέρχομαι의 출처/기원을 '하나님에게서 나와 왔고'로, ἥκω의 현재 도착 상태를 '여기 있기'로 살려 원문의 존재·현존 진술을 자연스럽게 반영했습니다.
- source_word: ἀπ’ ἐμαυτοῦ ἐλήλυθα
  english_pob_choice: I have not come from myself
  chosen_korean: 나는 내 스스로 온 것이 아니라
  alternatives_korean:
  - 나는 내 뜻으로 온 것이 아니라
  - 나는 혼자서 온 것이 아니라
  lexicon: BDAG
  rationale: ἀπ’ ἐμαυτοῦ의 자기기원/자기주도성을 한국어에서 가장 직접적으로 드러내는 표현으로 '내 스스로'를 택했습니다.
- source_word: ἐκεῖνός με ἀπέστειλεν
  english_pob_choice: but he sent me
  chosen_korean: 그분이 나를 보내셨습니다
  alternatives_korean:
  - 그가 나를 보내셨습니다
  - 그분께서 나를 보내셨습니다
  lexicon: BDAG
  rationale: ἐκεῖνος가 가리키는 대상이 하나님이므로, 한국어에서는 지시성을 살리면서도 존칭이 필요한 문맥에 맞게 '그분'으로 옮겼습니다.
theological_decisions:
- issue: 예수의 기원과 파송 언어를 과도하게 교리화하지 않으면서도 원문의 주장 보존
  chosen_reading: 내가 하나님에게서 나와 왔고 여기 있기 때문입니다
  alternative_readings:
  - 내가 하나님에게서 나왔고 와 있기 때문입니다
  - 내가 하나님으로부터 나와 도착했기 때문입니다
  rationale: 원문은 예수의 신적 기원과 현재 현존을 강하게 말하지만, 본문 자체의 동사들을 넘어서는 후대 용어를 본문에 덧씌우지 않도록 비교적 직접적인 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ἀπ’ ἐμαυτοῦ의 의미를 '자기기원'과 '자기주도성' 사이에서 어떻게 드러낼지
  chosen_reading: 나는 내 스스로 온 것이 아니라
  alternative_readings:
  - 나는 나 자신에게서 온 것이 아니라
  - 나는 내 뜻대로 온 것이 아니라
  rationale: 문맥상 'from myself'는 출처와 독립적 기획을 함께 함의하므로, 한국어에서는 두 의미를 모두 아우르는 '내 스스로'를 사용했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
