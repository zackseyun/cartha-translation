id: JHN.8.55
reference: John 8:55
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
  footnotes:
  - marker: a
    text: Or 'you do not know him.' The Greek verb ἐγνώκατε is perfect in form, which may be rendered to emphasize their continuing lack of true knowledge.
    reason: lexical_alternative
  - marker: b
    text: Or 'If I say.' The Greek construction is hypothetical; 'If I were to say' brings out the sense in natural English.
    reason: lexical_alternative
  - marker: c
    text: '''Keep'' may also be rendered ''obey'' or ''observe''; in John, the verb often carries the sense of faithfully keeping or guarding God''s word.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 그분을 알지 못하였지만, 나는 그분을 압니다. 내가 만일 그분을 알지 못한다고 말한다면, 나는 너희와 같은 거짓말쟁이가 될 것입니다. 그러나 나는 그분을 알고 있으며, 그의 말씀을 지킵니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분을 알지 못합니다.’ 그리스어 동사 ἐγνώκατε는 형태상 완료형이므로, 실제로는 계속되는 참된 인식의 부재를 나타내도록 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 말한다면.’ 여기의 그리스어 구성은 가상적 조건문이므로, 자연스러운 한국어에서는 ‘만일 … 말한다면’이 어울립니다.
    reason: lexical_alternative
  - marker: c
    text: ‘지키다’는 여기서 ‘순종하다’나 ‘준수하다’로도 옮길 수 있지만, 요한문헌에서는 하나님의 말씀을 충실히 간직하고 지키는 뜻을 함께 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐγνώκατε αὐτόν
  english_pob_choice: you have not known him
  chosen_korean: 너희는 그분을 알지 못하였지만
  alternatives_korean:
  - 너희는 그분을 알지 못합니다
  - 너희는 그분을 알지 못한 채입니다
  lexicon: BDAG
  rationale: 완료형의 지속적 상태를 살려 단순 현재보다 ‘알지 못하였지만’으로 옮겨, 참된 인식의 부재가 지금까지 이어진다는 점을 드러냈습니다.
- source_word: οἶδα αὐτόν
  english_pob_choice: I know him
  chosen_korean: 나는 그분을 압니다
  alternatives_korean:
  - 나는 그분을 알고 있습니다
  - 나는 그분을 알지요
  lexicon: BDAG
  rationale: οἶδα는 형태상 완료형이지만 현재적 상태를 나타내므로 자연스러운 현재형 ‘압니다’로 옮겼습니다.
- source_word: κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν
  english_pob_choice: If I were to say that I do not know him
  chosen_korean: 내가 만일 그분을 알지 못한다고 말한다면
  alternatives_korean:
  - 내가 그분을 알지 못한다고 말하면
  - 설령 내가 그분을 알지 못한다고 말하더라도
  lexicon: BDAG
  rationale: 조건문의 가상적·반사실적 뉘앙스를 살리기 위해 단순 ‘말하면’보다 ‘만일 … 말한다면’으로 옮겼습니다.
- source_word: ἔσομαι ὅμοιος ὑμῖν ψεύστης
  english_pob_choice: I would be a liar like you
  chosen_korean: 나는 너희와 같은 거짓말쟁이가 될 것입니다
  alternatives_korean:
  - 나는 너희와 같은 거짓말쟁이일 것입니다
  - 나는 너희처럼 거짓말쟁이가 될 것입니다
  lexicon: BDAG
  rationale: ψεύστης의 명사적 의미를 그대로 살려 ‘거짓말쟁이’로 옮기고, 비교 대상인 ‘너희와 같은’을 유지했습니다.
- source_word: τὸν λόγον αὐτοῦ τηρῶ
  english_pob_choice: I keep his word
  chosen_korean: 그의 말씀을 지킵니다
  alternatives_korean:
  - 그의 말씀을 지켜 둡니다
  - 그의 말씀을 보존합니다
  - 그의 말씀을 지킵니다/지키고 있습니다
  lexicon: BDAG
  rationale: 요한복음에서 τηρέω는 단순 순종을 넘어 ‘지키다/간직하다/준수하다’의 뉘앙스를 가지므로, 한국어에서는 가장 자연스러운 ‘지키다’를 택했습니다.
theological_decisions:
- issue: 예수의 하나님 인식과 순종의 대조를 어떻게 드러낼지
  chosen_reading: 본문의 날카로운 대조를 유지하되, 설명을 덧붙이지 않고 예수의 직접적 진술로 번역했습니다.
  alternative_readings:
  - 예수의 유일한 신적 아들됨을 풀어서 설명하기
  - 단순한 친분 정도로 완화해 번역하기
  rationale: 이 구절은 예수와 विरोध자들의 하나님의 인식 차이를 सीधे 제시하므로, 본문 이상의 신학적 해설 없이 그 긴장을 보존하는 것이 가장 충실합니다.
  doctrine_reference: 요한복음의 그리스도론; 번역 원칙 1, 3
