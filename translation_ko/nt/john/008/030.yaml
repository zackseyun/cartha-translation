lexical_decisions:
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 이런 말씀을
  alternatives_korean:
  - 이 일들을
  - 이것들을
  lexicon: BDAG
  rationale: 앞선 예수의 담화를 가리키는 복수 지시어이므로, 한국어에서는 담화 맥락을 살려 ‘이런 말씀을’로 자연스럽게 연결했습니다.
- source_word: αὐτοῦ λαλοῦντος
  english_pob_choice: as he was saying
  chosen_korean: 말씀을 하시는 동안
  alternatives_korean:
  - 말씀하시면서
  - 말씀하시는 동안
  lexicon: BDAG
  rationale: 분사적 절이 예수의 말씀이 진행 중인 동시 상황을 나타내므로, ‘동안’으로 진행성을 살렸습니다.
- source_word: πολλοὶ
  english_pob_choice: many
  chosen_korean: 많은 사람
  alternatives_korean:
  - 많은 이들
  - 많은 무리
  lexicon: BDAG
  rationale: 문맥상 실체화된 ‘많은 이들’이지만 한국어에서는 주어 역할이 분명하도록 ‘많은 사람’으로 옮겼습니다.
- source_word: ἐπίστευσαν εἰς αὐτόν
  english_pob_choice: believed in him
  chosen_korean: 그분을 믿었습니다
  alternatives_korean:
  - 그분 안에서 믿었습니다
  - 그를 믿었습니다
  lexicon: BDAG
  rationale: 요한복음의 πιστεύω + εἰς는 단순한 동의가 아니라 예수께 향한 신뢰를 뜻하므로, 관용적이면서도 관계적 의미를 살려 ‘그분을 믿었습니다’로 옮겼습니다.
theological_decisions:
- issue: πιστεύω εἰς αὐτόν의 신학적 뉘앙스
  chosen_reading: ‘믿다’보다 ‘그분을 믿다’로, 예수께 향한 신뢰와 의탁을 드러냈습니다.
  alternative_readings:
  - 그분을 믿었습니다
  - 그분께 믿음을 두었습니다
  rationale: 요한복음에서 εἰς는 대상에 대한 방향성을 강조하므로, 단순한 정보 수용이 아니라 인격적 신뢰를 나타내는 표현을 유지하는 것이 본문의 의미에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for πίστις; Translation philosophy #3'
