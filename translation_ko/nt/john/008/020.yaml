    text: 요한복음에서 ‘그분의 때’는 예수의 고난과 영화가 이루어질 정해진 때를 가리킵니다. 또는 ‘그분의 정해진 때’로 옮길 수 있습니다.
    reason: cross_reference
  revision_rationale: The revision removes an unsupported adversative, uses a simple negated action to reflect οὐδεὶς ἐπίασεν, places each footnote at its relevant expression, and retains the literal Johannine motif '그분의 때.'
