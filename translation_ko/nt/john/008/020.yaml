id: JHN.8.20
reference: John 8:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
  footnotes:
  - marker: a
    text: Or 'in the temple courts'; the Greek term refers to the temple complex rather than the inner sanctuary alone.
    reason: lexical_alternative
  - marker: b
    text: '''His hour'' in John refers to the appointed time of Jesus'' climactic suffering and glorification; alternatively, ''his appointed hour.'''
    reason: cross_reference
translation:
  language: ko
  text: 그분은 성전[a]에서 가르치시면서 보물고에서 이 말씀들을 하셨습니다. 아무도 그분을 붙잡지 않았습니다. 그분의 때가 아직 이르지 않았기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전 뜰에서’. 여기서 ‘성전’은 성소 건물만이 아니라 성전 복합체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 요한복음에서 ‘그분의 때’는 예수의 고난과 영화가 이루어질 정해진 때를 가리킵니다. 또는 ‘그분의 정해진 때’로 옮길 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  english_pob_choice: these words
  chosen_korean: 이런 말씀들
  alternatives_korean:
  - 이 말씀들
  - 이런 말들
  lexicon: SBLGNT; BDAG
  rationale: ῥήματα는 단순한 '말'보다 이미 발화된 내용을 가리키는 '말씀들'이 자연스럽습니다. ταῦτα의 지시성을 살려 '이런'을 붙였습니다.
- source_word: ἐλάλησεν
  english_pob_choice: spoke
  chosen_korean: 하셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하셨습니다
  lexicon: BDAG
  rationale: λαλέω의 발화 행위를 한국어 서술체에 자연스럽게 옮기기 위해 '하셨습니다'로 처리하되, 직전의 '가르치시면서'와 함께 예수의 공개 발화를 드러냈습니다.
- source_word: ἐν τῷ γαζοφυλακίῳ
  english_pob_choice: in the treasury
  chosen_korean: 보물고에서
  alternatives_korean:
  - 성전 헌금함에서
  - 성전 보물고에서
  lexicon: BDAG
  rationale: γαζοφυλάκιον은 성전 안의 재정 보관 구역을 가리키므로, 본문 흐름상 간결하게 '보물고'로 옮겼습니다. 성전 내부의 구역이라는 점은 다음 구절과 함께 이해될 수 있습니다.
- source_word: ἐν τῷ ἱερῷ
  english_pob_choice: in the temple
  chosen_korean: 성전에서
  alternatives_korean:
  - 성전 뜰에서
  - 성전 परिसर에서
  lexicon: BDAG
  rationale: ἱερόν은 성전 건물 내부만이 아니라 성전 복합체 전체를 가리키므로, 본문에서는 가장 직접적인 '성전에서'를 택했습니다. 이는 문맥상 보물고와 자연스럽게 연결됩니다.
- source_word: ἐπίασεν
  english_pob_choice: seized
  chosen_korean: 붙잡지 못했습니다
  alternatives_korean:
  - 잡지 못했습니다
  - 체포하지 못했습니다
  lexicon: BDAG
  rationale: πιάζω의 핵심 의미는 '붙잡다/잡다'이지만, 문맥상 적대적 시도를 내포합니다. 한국어에서는 결과를 분명히 드러내기 위해 부정형 '붙잡지 못했습니다'로 옮겼습니다.
theological_decisions:
- issue: ἡ ὥρα αὐτοῦ의 요한복음 신학적 함의
  chosen_reading: '''그분의 때''를 본문에 유지하되, 시간의 도래가 아직 아니라는 긴장을 살렸습니다.'
  alternative_readings:
  - 그분의 정하신 때
  - 그분의 시간
  rationale: 요한복음에서 '때'는 예수의 고난과 영화가 예정된 결정적 순간을 가리킵니다. 너무 설명적으로 풀지 않고, 본문의 긴장을 유지하는 쪽이 더 적절합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
