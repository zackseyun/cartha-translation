  rationale: 핵심적으로 누락·왜곡된 마지막 인과절을 원문대로 회복했습니다. 또한 원문의 논쟁적 함의, 특히 악마가 이전에 진리 안에 있었는지 여부는 ‘진리 안에 서 있지 않았습니다’라는 표현으로 결정하지 않았습니다. ‘거짓의 아버지’는 대명사의 가장 자연스러운 선행사인 τὸ ψεῦδος를 한국어에서 명료하고 자연스럽게 나타내며, 직역과 다른 해석 가능성은 각주에 보존했습니다.
