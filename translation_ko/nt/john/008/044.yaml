id: JHN.8.44
reference: John 8:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
  footnotes:
  - marker: a
    text: Or, more smoothly, 'Whenever he lies' or 'Whenever he speaks falsehood.' The Greek reads more literally, 'Whenever he speaks the lie.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'he speaks from his own'—that is, from what belongs to him by nature or character.
    reason: lexical_alternative
  - marker: c
    text: Or, 'and its father.' Some take this more generally as 'the father of lies.'
    reason: alternative_reading
translation:
  language: ko
  text: 당신들은 너희 아버지, 곧 악마에게서 났으며, 너희는 너희 아버지의 욕망을 행하려고 합니다. 그는 처음부터 살인자였습니다. 그는 진리에 서 있지 않았습니다. 그 안에는 진리가 없기 때문입니다. 그가 거짓을 말할 때마다 그는 자기 본성에서 말합니다. 그에게는 거짓이 없기 때문입니다. 그는 거짓말쟁이이며 그것의 아버지입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악마’는 διαβόλου의 직접적 음역에 가까운 선택입니다. 전통적 교회어 ‘마귀’도 가능하지만, 본 항목은 소스 직결성을 우선했습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘자기에게서/자기 것에서 말합니다’입니다. 한국어에서는 이 관용구를 ‘자기 본성에서 말합니다’로 풀어야 뜻이 분명합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그것의 아버지’는 가장 가까운 선행사인 ‘거짓’을 가리키는 것으로 이해했습니다. 일부는 더 일반적으로 ‘거짓의 아버지’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  english_pob_choice: from your father, the devil
  chosen_korean: 너희 아버지, 곧 악마에게서 났으며
  alternatives_korean:
  - 너희 아버지, 곧 마귀에게서 났으며
  - 너희 아버지 악마에게서 왔으며
  lexicon: BDAG
  rationale: ἐκ + εἰμί의 출처/기원을 살려 관계의 근원을 드러내면서, 한국어에서는 ‘~에게서 났다’가 가장 자연스럽고 직접적입니다. διαβόλου는 전통적 교회어 ‘마귀’보다 소스 직역 성격을 살린 ‘악마’를 기본으로 택했습니다.
- source_word: ἐπιθυμίας
  english_pob_choice: desires
  chosen_korean: 욕망
  alternatives_korean:
  - 원함
  - 욕구
  - 정욕
  lexicon: BDAG
  rationale: 문맥상 도덕적·의지적 추구를 가리키므로, 성적 의미로 좁아지기 쉬운 ‘정욕’보다 넓은 ‘욕망’이 적절합니다.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  english_pob_choice: Whenever he speaks the lie
  chosen_korean: 그가 거짓을 말할 때마다
  alternatives_korean:
  - 그가 그 거짓을 말할 때마다
  - 그가 거짓말할 때마다
  lexicon: BDAG
  rationale: 관사 있는 τὸ ψεῦδος의 특수한 형태를 너무 어색하지 않게 살리면서도, 한국어에서는 ‘그 거짓’보다 ‘거짓을 말하다’가 자연스럽습니다. POB의 주석처럼 ‘거짓말할 때마다’도 가능하나 본문은 더 직접적으로 유지했습니다.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  english_pob_choice: he speaks from his own nature
  chosen_korean: 자기 본성에서 말합니다
  alternatives_korean:
  - 자기에게 속한 것에서 말합니다
  - 자기 것에서 말합니다
  lexicon: BDAG
  rationale: 직역하면 ‘자기에게서/자기 것에서’이지만, 한국어에서 그 의미를 분명히 전달하려면 ‘자기 본성에서’가 가장 적절합니다. 이는 영어 POB의 해석을 따라가되, 원문의 출처-발화 관용구를 설명적으로 드러냅니다.
- source_word: ὁ πατὴρ αὐτοῦ
  english_pob_choice: the father of it
  chosen_korean: 그것의 아버지입니다
  alternatives_korean:
  - 거짓의 아버지입니다
  - 그의 아버지입니다
  lexicon: BDAG
  rationale: 가장 가까운 선행사인 τὸ ψεῦδος를 가리킨다는 POB의 해석을 반영하여, ‘그것의 아버지’로 옮겼습니다. ‘거짓의 아버지’는 의미는 분명하지만 단수 구조를 다소 풀어쓴 표현이어서 본문에는 덜 직접적입니다.
theological_decisions:
- issue: ὁ πατὴρ αὐτοῦ의 지시 대상
  chosen_reading: ‘그것’은 앞의 τὸ ψεῦδος, 곧 거짓/거짓말을 가리키며, 악마는 거짓의 근원이라는 뜻으로 이해했습니다.
  alternative_readings:
  - ‘그의 아버지’로 이해하여 악마의 아버지를 말하는 것으로 읽기
  - ‘거짓들의 아버지’라는 일반화된 표현으로 처리하기
  rationale: 문맥상 가장 가까운 선행사는 ‘거짓’입니다. 따라서 번역도 그 연결을 유지해, 악마를 거짓의 근원으로 보게 하되 원문 이상의 추론은 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃의 시간적 뉘앙스
  chosen_reading: ‘진리에 서 있지 않았습니다’로 옮겨, 한때 진리에 있었는지 여부를 번역이 결론짓지 않게 했습니다.
  alternative_readings:
  - ‘진리에 머물지 않았습니다’로 옮겨 과거 이탈을 강하게 암시하기
  - ‘진리에 서 있지 않습니다’로 현재 상태만 강조하기
  rationale: 부정된 ἔστηκεν은 서 있지 않음을 말하지만, 이전에 서 있었는지까지는 명시하지 않습니다. 그래서 원문의 이미지와 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
