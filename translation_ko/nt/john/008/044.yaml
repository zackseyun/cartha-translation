- from: 당신들은 너희 아버지, 곧 악마에게서 났으며, 너희는 너희 아버지의 욕망을 행하려고 합니다. 그는 처음부터 살인자였습니다. 그는 진리에 서 있지 않았습니다. 그 안에는 진리가 없기 때문입니다. 그가 거짓을 말할 때마다 그는 자기 본성에서 말합니다. 그에게는 거짓이 없기 때문입니다. 그는 거짓말쟁이이며 그것의 아버지입니다.[a][b][c]
