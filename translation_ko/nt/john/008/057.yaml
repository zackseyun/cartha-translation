translation:
  language: ko
  text: 그러자 유대인들이[a] 그에게 말했습니다. “당신은 아직 쉰 살도 되지 않았는데, 아브라함을 보았습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 문맥에 따라 ‘유대 사람들’, ‘유대 지도자들’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대 사람들
  - 유대 지도자들
  lexicon: BDAG
  rationale: 요한복음에서의 표준 집단 지칭을 직역에 가깝게 살리되, 본문이 지도자들로만 한정하지 않으므로 좁혀 번역하지 않았습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러자
  alternatives_korean:
  - 그러므로
  - 그래서
  lexicon: BDAG
  rationale: 앞 절에 대한 반응과 이어짐을 자연스럽게 드러내는 한국어 담화 연결어로 옮겼습니다.
- source_word: πεντήκοντα ἔτη οὔπω ἔχεις
  english_pob_choice: You are not yet fifty years old
  chosen_korean: 당신은 아직 쉰 살도 되지 않았는데
  alternatives_korean:
  - 당신은 아직 쉰 살이 되지 않았는데
  - 당신은 아직 오십 살이 아니신데
  lexicon: BDAG
  rationale: 헬라어의 ‘나이를 가지다’라는 관용적 표현을 한국어의 나이 표현으로 자연스럽게 옮겼고, 반문의 놀람을 살렸습니다.
- source_word: ἑώρακας
  english_pob_choice: you have seen
  chosen_korean: 보았습니까
  alternatives_korean:
  - 보셨습니까
  - 보았다고 하십니까
  lexicon: BDAG
  rationale: 완료형의 현재적 결과보다는 여기서의 놀라움 섞인 반문 기능이 더 두드러져, 한국어에서는 자연스러운 의문형으로 처리했습니다.
theological_decisions:
- issue: οἱ Ἰουδαῖοι의 범위
  chosen_reading: 본문은 ‘유대인들’로 두고, 지도자들로 한정하지 않았습니다.
  alternative_readings:
  - 유대 지도자들
  - 유대 사람들
  rationale: 문맥상 좁은 집단을 본문이 명시하지 않으므로, 해석을 덧씌우기보다 넓은 표지를 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 해석적 축소를 피함
