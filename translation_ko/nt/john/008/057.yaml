base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
  footnotes:
  - marker: a
    text: Or 'the Judeans' or 'the Jewish leaders,' depending on how broadly John intends οἱ Ἰουδαῖοι in context.
