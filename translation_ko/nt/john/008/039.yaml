id: JHN.8.39
reference: John 8:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
  footnotes:
  - marker: a
    text: Or, “If you were Abraham’s children, you would do the works of Abraham.” The Greek imperfect verb can be understood as implying a contrary-to-fact condition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그분께 대답하여 말했습니다. 「우리의 아버지는 아브라함입니다.” 예수께서 그들에게 말씀하셨습니다. 「만일 여러분이 아브라함의 자녀라면, 아브라함의 일을 하고 있을 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「만일 여러분이 아브라함의 자녀라면, 아브라함의 일을 하고 있을 것입니다.」 헬라어 미완료 시제는 반사실적 조건을 암시하는 것으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν
  english_pob_choice: They answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 대답하며 말했습니다
  lexicon: BDAG
  rationale: 헬라어의 응답+발화 이중 동사를 자연스러운 한국어로 옮기되, 두 동작이 모두 보이도록 했습니다.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  english_pob_choice: Abraham is our father
  chosen_korean: 우리의 아버지는 아브라함입니다
  alternatives_korean:
  - 아브라함이 우리의 아버지입니다
  - 우리 아버지는 아브라함입니다
  lexicon: BDAG
  rationale: 서술문 어순을 한국어에 맞게 다듬으면서도, 혈통 주장으로서의 강조를 보존했습니다.
- source_word: τέκνα
  english_pob_choice: children
  chosen_korean: 자녀
  alternatives_korean:
  - 아들들
  - 후손
  lexicon: BDAG
  rationale: τέκνα는 성별을 특정하지 않는 자녀를 뜻하므로, 남성 중심의 ‘아들들’보다 ‘자녀’가 더 정확합니다.
- source_word: ἐποιεῖτε
  english_pob_choice: you would be doing
  chosen_korean: 하고 있을 것입니다
  alternatives_korean:
  - 하고 있을 텐데
  - 하고 있겠지요
  - 하고 있었을 것입니다
  lexicon: BDAG
  rationale: 영어 POB가 살린 반사실적 조건의 뉘앙스를 한국어에서도 유지하기 위해, 현재 진행의 결과가 나타나야 함을 가리키는 ‘하고 있을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 아브라함의 자녀됨과 행위의 대비
  chosen_reading: 혈통 주장과 실제 행위의 대비를 그대로 드러내고, 그 관계를 영적/육적 소속 교리로 과도하게 풀지 않았습니다.
  alternative_readings:
  - 영적 자녀됨만을 뜻하는 것으로 해석
  - 육적 혈통 자체를 부정하는 것으로 해석
  rationale: 본문은 ‘아브라함은 우리의 아버지입니다’라는 주장과 ‘아브라함의 일’을 하지 않는 현실을 대조합니다. 번역은 이 긴장을 보존해야 하며, 본문 밖의 결론을 미리 확정하지 않아야 합니다.
  doctrine_reference: 본문의 대조 구조를 유지하고 신학적 긴장은 열어 둠
