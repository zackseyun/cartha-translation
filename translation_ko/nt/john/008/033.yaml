    issue: 각주 a가 본문과 같은 ‘아브라함의 씨’를 대안 번역으로 제시합니다.
    rationale: ‘또는’ 각주는 본문과 구별되는 대안을 제공해야 합니다. 본문을 ‘후손’으로 바꾸고 ‘씨’를 각주에 두면 현대 한국어의 자연스러움과 원문의 단수 집합적 표현을 함께 보존할 수 있습니다.
  - severity: medium
    issue: ‘자유롭게 될 것이다’는 ἐλεύθεροι의 형용사적 상태를 부사적으로 표현합니다.
    rationale: 원문은 ‘자유롭게 행동하다’가 아니라 ‘자유인/자유로운 이들이 되다’라는 상태 변화입니다. ‘자유인이 될 것이다’가 이를 더 정확히 전달합니다.
