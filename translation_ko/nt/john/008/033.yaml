id: JHN.8.33
reference: John 8:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
  footnotes:
  - marker: a
    text: Or “Abraham’s seed.” The Greek uses a singular collective expression for physical descent.
    reason: lexical_alternative
  - marker: b
    text: Or “have never served anyone.” The verb can mean serve, but in this context the sense of bondage/slavery is more prominent.
    reason: lexical_alternative
  - marker: c
    text: Or “You will be free.” The Greek more literally says “you will become free.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그분께 대답했습니다. “우리는 아브라함의 씨요, 누구에게도 한 번도 종살이를 한 적이 없습니다. 그런데 어떻게 당신이 ‘너희는 자유롭게 될 것이다’라고 말씀하십니까?”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아브라함의 씨.” 헬라어는 육적 혈통을 가리키는 단수 집합 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “섬긴 적이 없습니다.” 이 동사는 ‘섬기다’도 뜻하지만, 이 문맥에서는 예속/종살이의 의미가 더 두드러집니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “너희는 자유로울 것이다.” 헬라어는 더 문자적으로 “너희는 자유롭게 될 것이다”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  english_pob_choice: They answered him
  chosen_korean: 그들이 그분께 대답했습니다
  alternatives_korean:
  - 그들이 그분에게 답했습니다
  - 그들이 그분께 응답했습니다
  lexicon: SBLGNT; BDAG
  rationale: 대상을 향한 직접 응답을 자연스러운 합쇼체로 옮겼습니다. “그분께”는 예수께 대한 직접 대화를 분명히 합니다.
- source_word: Σπέρμα Ἀβραάμ
  english_pob_choice: Abraham’s offspring
  chosen_korean: 아브라함의 씨
  alternatives_korean:
  - 아브라함의 후손
  - 아브라함의 자손
  lexicon: BDAG
  rationale: σπέρμα의 단수 집합적 표현을 살리기 위해 직역에 가까운 “씨”를 택했습니다. 이는 혈통 주장이라는 문맥을 보존합니다.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  english_pob_choice: have been enslaved to anyone
  chosen_korean: 누구에게도 한 번도 종살이를 한 적이 없습니다
  alternatives_korean:
  - 누구에게도 한 번도 노예가 된 적이 없습니다
  - 누구를 섬긴 적이 없습니다
  lexicon: BDAG; project default δοῦλος/δουλεύω
  rationale: 이 문맥은 봉사보다 속박/예속의 의미가 분명하므로, “종살이”로 bondage의 뉘앙스를 드러냈습니다. “한 번도”는 πώποτε의 부정을 자연스럽게 옮깁니다.
- source_word: Ἐλεύθεροι γενήσεσθε
  english_pob_choice: You will become free
  chosen_korean: 너희는 자유롭게 될 것이다
  alternatives_korean:
  - 너희는 자유로워질 것이다
  - 너희는 자유가 될 것이다
  lexicon: BDAG
  rationale: γενήσεσθε의 “되다/되어 가다”를 살리되 한국어에서 가장 자연스러운 결과 상태 표현으로 옮겼습니다. 질문문의 인용으로서 미래의 전환을 유지합니다.
theological_decisions:
- issue: “씨”와 “자손” 중 어느 표현이 혈통 주장을 더 정확히 드러내는가
  chosen_reading: 아브라함의 씨
  alternative_readings:
  - 아브라함의 자손
  - 아브라함의 후손
  rationale: 본문은 단순한 일반적 후손 진술보다 혈통 연속성을 주장하는 맥락이므로, 단수 집합적 표현을 보존하는 번역이 더 직접적입니다.
  doctrine_reference: Translation philosophy §6; contested terms guidance
