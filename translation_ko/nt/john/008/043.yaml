lexical_decisions:
- source_word: τὴν λαλιὰν τὴν ἐμὴν
  english_pob_choice: my way of speaking
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말하는 방식
  - 내 화법
  - 내 언어
  lexicon: BDAG
  rationale: λαλιά는 단순한 내용이 아니라 말하는 방식이나 말투를 가리킬 수 있으므로, 앞의 이해하지 못함과 자연스럽게 연결되는 ‘내 말’로 옮기되, 뒤의 λόγος와의 구분은 주석에서 유지합니다.
- source_word: γινώσκετε
  english_pob_choice: understand
  chosen_korean: 이해하지 못합니까
  alternatives_korean:
  - 알지 못합니까
  - 깨닫지 못합니까
  - 인식하지 못합니까
  lexicon: BDAG
  rationale: 여기서는 단순한 지식이 아니라 예수의 발화를 알아듣지 못하는 이해의 문제이므로, 현대 한국어에서 가장 자연스러운 ‘이해하다’를 택했습니다.
- source_word: ἀκούειν τὸν λόγον τὸν ἐμόν
  english_pob_choice: hear my word
  chosen_korean: 내 말을 들을 수 없기
  alternatives_korean:
  - 내 말을 들을 수 없기
  - 내 말씀을 들을 수 없기
  - 내 말을 들을 능력이 없기
  lexicon: BDAG
  rationale: ἀκούω의 기본 의미를 살려 ‘듣다’로 옮기고, οὐ δύνασθε의 무능력을 드러내기 위해 ‘들을 수 없기’로 구성했습니다. λόγος는 여기서 예수의 전달된 말씀/발언을 가리키므로 한국어로는 자연스럽게 ‘말’로 옮겼습니다.
theological_decisions:
- issue: οὐ δύνασθε의 무능력과 그 원인
  chosen_reading: 본문이 말하는 것은 먼저 ‘들을 수 없음’이라는 무능력이며, 그 무능의 도덕적·영적 원인은 본절 자체에서 해명하지 않습니다.
  alternative_readings:
  - 불순종을 강조하는 표현으로 읽기
  - 영적 무능으로 단정하기
  - 심판적 완악함으로 해석하기
  rationale: 번역문은 본문의 긴장을 그대로 보존해야 하므로, 본절이 직접 말하는 범위인 ‘들을 수 없음’을 유지하고 신학적 메커니즘은 덧붙이지 않았습니다.
  doctrine_reference: 본문의 진술 범위를 보존하고 해석 논쟁을 번역에 과도하게 주입하지 않음
