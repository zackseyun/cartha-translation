  text: 왜 내 말하는 방식을 이해하지 못합니까?[a] 너희가 내 말을 들을 수 없기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 말투’ 또는 ‘내 화법’. 그리스어는 여기서 뒤의 ‘내 말’과 다른 단어를 사용하여 말하는 방식과 말의 내용을 구별합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘들을 수 없다’는 듣는 능력이나 가능성이 부정됨을 나타냅니다.
