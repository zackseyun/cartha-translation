source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
  footnotes:
  - marker: a
    text: Final verse of the story of the woman caught in adultery (John 7:53–8:11). See note on John 7:53.
    reason: textual_critical
translation:
  language: ko
  text: 그 여자가[a] 말했습니다. “아무도 없습니다, 주님.” 예수께서 말씀하셨습니다. “나도 너를 정죄하지 않습니다. 가서, 이제부터는 더 이상 죄를 짓지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 간음하다가 붙잡힌 여인 이야기의 마지막 절입니다(요 7:53–8:11). 요한복음 7:53의 주석을 보십시오.
    reason: textual_variant
lexical_decisions:
- source_word: κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인님
  - 선생님
  - 주여
  lexicon: BDAG
  rationale: 호격 κύριε는 예수께 대한 공손한 부름으로, 영어 POB의 Lord를 살려 표준적인 신앙 언어인 ‘주님’으로 옮겼습니다.
- source_word: κατακρίνω
  english_pob_choice: condemn
  chosen_korean: 정죄하지 않습니다
  alternatives_korean:
  - 판결하지 않습니다
  - 유죄 판결하지 않습니다
  - 단죄하지 않습니다
  lexicon: BDAG
  rationale: 법정적 의미의 ‘condemn’을 한국어에서 가장 직접적으로 드러내는 표현은 ‘정죄하다’이므로, 선언의 강도를 유지해 옮겼습니다.
- source_word: μηκέτι ἁμάρτανε
  english_pob_choice: sin no more
  chosen_korean: 이제부터는 더 이상 죄를 짓지 마십시오
  alternatives_korean:
  - 더 이상 죄를 짓지 마십시오
  - 다시는 죄짓지 마십시오
  - 이제는 죄를 짓지 마십시오
  lexicon: BDAG
  rationale: μηκέτι의 시간적 전환을 살리기 위해 ‘이제부터는’를 보탰고, ἁμάρτανε의 현재 명령을 자연스러운 금지형으로 풀었습니다.
theological_decisions:
- issue: 예수의 마지막 명령의 어조
  chosen_reading: 공손한 명령형 ‘…마십시오’로 옮겨, 권위는 유지하되 한국어 독자에게 과도하게 위압적으로 들리지 않게 했습니다.
  alternative_readings:
  - …하지 마라
  - …하지 말라
  rationale: 본문은 단호한 권면을 담지만, 합쇼체 문맥에서는 공손한 명령형이 예수의 권위와 목회적 권면을 함께 잘 드러냅니다.
  doctrine_reference: Jesus' authoritative yet restorative admonition
