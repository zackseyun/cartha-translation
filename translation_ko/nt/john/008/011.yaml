  source_fidelity: 본문의 핵심 의미는 충실합니다. οὐδείς는 ‘아무도 없습니다’, οὐδὲ ἐγώ는 ‘나도 …하지 않습니다’, κατακρίνω는 법정적 함의를 지닌 ‘정죄하다’, μηκέτι는 ‘더 이상/이제부터’로 적절히 반영되었습니다. ‘가서’는 πορεύου를 자연스럽게 옮긴 표현입니다.
  naturalness: 합쇼체의 서술과 명령이 일관되고 자연스럽습니다. 다만 각주에 있는 ‘간음하다 붙잡힌’은 조사 결합이 잘못되어 ‘간음하다가 붙잡힌’으로 고쳐야 합니다.
  terminology: ‘주님’과 ‘정죄하다’는 이 문맥 및 영어 POB의 선택과 잘 부합합니다. ‘이제부터는 더 이상 죄를 짓지 마십시오’는 μηκέτι의 지속적 금지를 명료하게 전달합니다.
