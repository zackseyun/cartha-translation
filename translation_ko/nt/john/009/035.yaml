review_pass:
  verdict: revise
  source_fidelity: ‘그를 찾아 만나시자’는 εὑρὼν αὐτόν(‘그를 찾으시고/찾으신 뒤’)보다 한 단계 더 나아가 ‘만나다’라는 의미를 보태므로, 이를 제거할 필요가 있습니다. 나머지는 ἐξέβαλον … ἔξω의 강조된 축출, 질문의 형태, 그리고 SBLGNT의 ‘인자’ 읽기를 적절히 반영합니다.
  naturalness: ‘그를 찾으신 뒤’는 현대 표준어 합쇼체에서 자연스럽고, 앞선 사건 뒤에 예수께서 그를 찾으신 시간적 진행을 명료하게 나타냅니다. ‘당신은 … 믿습니까?’도 이 번역의 현대 존대 문체 안에서 직접 질문의 강조를 무리 없이 전달합니다.
  terminology: ‘인자’는 요한복음에서 확립된 칭호를 보존하는 적절한 번역입니다. 각주의 ‘하나님의 아들’은 중요한 사본 변이를 정확하고 간결하게 제시합니다.
  issues:
  - severity: medium
    issue: ‘그를 찾아 만나시자’가 원문에 없는 ‘만나다’의 의미를 추가합니다.
    rationale: εὑρίσκω는 여기서 ‘찾다, 발견하다’이며, ‘찾아 만나다’는 실제 만남이라는 별도 행위를 명시합니다. 문맥상 만남은 개연적이지만 원문이 표현한 범위를 넘지 않도록 ‘그를 찾으신 뒤’로 옮기는 것이 안전합니다.
  revised_text: 예수께서는 그들이 그를 밖으로 내쫓았다는 말을 들으시고, 그를 찾으신 뒤 말씀하셨습니다. 「당신은 인자를 믿습니까?」[a]
  revised_footnotes:
