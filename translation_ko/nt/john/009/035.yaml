id: JHN.9.35
reference: John 9:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
  footnotes:
  - marker: a
    text: Some manuscripts read “the Son of God” instead of “the Son of Man.”
    reason: textual_variant
translation:
  language: ko
  text: 예수께서는 그들이 그를 밖으로 내쫓았다는 말을 들으시고, 그를 찾으신 뒤 말씀하셨습니다. 「당신은 인자를 믿습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 “인자” 대신 “하나님의 아들”로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω
  english_pob_choice: Jesus heard that they had thrown him out
  chosen_korean: 예수께서는 그들이 그를 밖으로 내쫓았다는 말을 들으시고
  alternatives_korean:
  - 예수께서는 그가 밖으로 쫓겨났다는 소식을 들으시고
  - 예수께서는 그를 밖으로 내보냈다는 말을 들으시고
  lexicon: SBLGNT / BDAG
  rationale: ἐξέβαλον ... ἔξω의 중복은 단순한 퇴거가 아니라 강한 축출을 나타내므로, 현대 한국어에서는 '밖으로 내쫓다'가 가장 자연스럽게 그 힘을 살립니다.
- source_word: εὑρὼν
  english_pob_choice: when he found him
  chosen_korean: 그를 찾아 만나시자
  alternatives_korean:
  - 그를 찾으시고
  - 그를 찾은 뒤
  lexicon: BDAG
  rationale: 부사적 aorist 분사로서 선행 동작을 나타내므로, 한국어에서는 시간 순서를 살린 '찾아 만나시자'가 본문의 진행을 자연스럽게 전달합니다.
- source_word: Σὺ πιστεύεις εἰς
  english_pob_choice: Do you believe in
  chosen_korean: 당신은 … 믿습니까
  alternatives_korean:
  - 너는 … 믿느냐
  - 믿고 있습니까
  lexicon: BDAG
  rationale: Σὺ의 강조를 살리되, 예수의 직접 질문을 현대 표준어 합쇼체로 옮기기 위해 '당신은'을 두고 '믿습니까'로 옮겼습니다.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자의 아들
  lexicon: BDAG
  rationale: 이 표현은 다니엘 7장과 요한복음의 관용적 칭호이므로, 한국어 성경에서 널리 쓰이는 '인자'를 유지해 제목적·상호본문적 울림을 보존합니다.
theological_decisions:
- issue: 본문의 메시아 칭호와 사본 변이
  chosen_reading: 본문은 '인자'를 따르고, 사본 변이 '하나님의 아들'은 각주로만 제시합니다.
  alternative_readings:
  - 하나님의 아들
  rationale: SBLGNT의 본문 읽기를 유지해 본문의 긴장을 보존하고, 중요한 변이는 본문을 덮지 않도록 각주로 처리합니다.
  doctrine_reference: 본문 비평은 텍스트의 다층성을 보존하며, 기독론적 변이를 주석으로 투명하게 기록합니다.
