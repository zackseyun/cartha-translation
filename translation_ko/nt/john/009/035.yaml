revisions:
- from: 예수께서는 그들이 그를 밖으로 내쫓았다는 말을 들으시고, 그를 찾아 만나시자 말씀하셨습니다. 「당신은 인자를 믿습니까?」[a]
  to: 예수께서는 그들이 그를 밖으로 내쫓았다는 말을 들으시고, 그를 찾으신 뒤 말씀하셨습니다. 「당신은 인자를 믿습니까?」[a]
  rationale: 원문의 εὑρὼν αὐτόν에 충실하도록 ‘찾아 만나시자’를 ‘찾으신 뒤’로 고쳤습니다. 축출의 강조, ‘인자’라는 본문 읽기, 그리고 사본 변이 각주는 유지했습니다.
