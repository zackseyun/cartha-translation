    issue: ἵνα절의 병렬성이 ‘보게 하고’/‘되게 하려는 것입니다’로 비대칭적으로 번역됨
    rationale: 원문은 ‘보지 못하는 이들이 보게 되고’와 ‘보는 이들이 눈먼 이들이 되게’라는 두 병렬 목적절을 제시합니다. ‘보게 하고’는 직접 사역의 뉘앙스를 강화할 수 있으므로, 양쪽을 ‘-도록’으로 병렬 처리하는 편이 원문에 더 가깝습니다.
  - severity: medium
