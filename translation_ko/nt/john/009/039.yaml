review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. 그러나 초안의 ‘보게 하고’와 ‘되게 하려는 것입니다’는 ἵνα절의 병렬 목적/결과 구조를 다소 비대칭적으로 만들고, ‘하고’는 예수께서 직접 그렇게 만드신다는 사역적 뉘앙스를 더합니다. 두 절을 같은 ‘-도록’ 구조로 옮겨 원문의 대조와 γένωνται(‘되다’)를 보존하는 것이 안전합니다.
  naturalness: ‘보지 못하는 이들/보는 이들’과 ‘눈먼 이들’의 대조는 현대 표준 한국어에서 자연스럽고, 합쇼체 서술에도 맞습니다. ‘심판을 위하여’는 다소 문어적이지만 본문의 엄숙한 법정적 어조와 εἰς κρίμα의 간결성을 잘 반영합니다.
  terminology: ‘심판’은 κρίμα의 폭넓은 사법적 판단·결과를 유지하며 ‘정죄’보다 적절합니다. 각주에서는 현대 학술 용례에 맞추어 ‘헬라어’ 대신 ‘그리스어’를 사용하고, ‘사법적 효과’는 더 자연스러운 ‘심판의 결과’로 다듬었습니다. 각주 표지는 κρίμα의 번역어인 ‘심판’에 붙여야 합니다.
  issues:
