id: JHN.9.39
reference: John 9:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
  footnotes:
  - marker: a
    text: Or 'for a judgment.' The Greek εἰς κρίμα can emphasize the judicial effect of Jesus' coming rather than only condemnation.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “내가 이 세상에 심판을 위하여 왔으니, 보지 못하는 사람들은 보게 하고, 보는 사람들은[a] 눈먼 사람이 되게 하려는 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 심판을 위하여’. 헬라어 εἰς κρίμα는 예수의 오심이 가져오는 사법적 효과를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς κρίμα
  english_pob_choice: for judgment
  chosen_korean: 심판을 위하여
  alternatives_korean:
  - 심판을 위해
  - 판단을 위하여
  - 정죄를 위하여
  lexicon: BDAG
  rationale: εἰς κρίμα의 법정적·결과적 뉘앙스를 살려 ‘심판을 위하여’로 옮겼습니다. ‘정죄’는 의미를 너무 좁히고, ‘판단’은 문맥의 사법적 긴장을 약화시킵니다.
- source_word: κόσμον
  english_pob_choice: world
  chosen_korean: 이 세상
  alternatives_korean:
  - 세상
  - 세계
  - 이 세계
  lexicon: BDAG
  rationale: 요한복음의 κόσμος를 한국어에서 자연스러운 ‘이 세상’으로 옮겨, 단순한 공간이 아니라 인간 세계 전체를 가리키는 뉘앙스를 살렸습니다.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  english_pob_choice: those who do not see / those who see
  chosen_korean: 보지 못하는 사람들 / 보는 사람들
  alternatives_korean:
  - 눈먼 사람들 / 보는 사람들
  - 보지 못하는 자들 / 보는 자들
  lexicon: BDAG
  rationale: 분사구를 실명자·시력자라는 고정된 명사로 굳히기보다, 원문의 대조 구조를 살려 ‘보지 못하는 사람들’과 ‘보는 사람들’로 옮겼습니다.
- source_word: τυφλοὶ γένωνται
  english_pob_choice: may become blind
  chosen_korean: 눈먼 사람이 되게 하려는 것입니다
  alternatives_korean:
  - 눈멀게 하려는 것입니다
  - 눈먼 자들이 되게 하려는 것입니다
  lexicon: BDAG
  rationale: γίνομαι의 ‘되다’ 의미를 살리면서, 결과를 드러내는 자연스러운 한국어로 정리했습니다. ‘눈멀게 하다’는 동작 중심이라 원문의 ‘되다’ 뉘앙스를 덜 반영합니다.
theological_decisions:
- issue: Jesus' coming 'for judgment' and the tension with John 3:17
  chosen_reading: ‘심판을 위하여’로 직역에 가깝게 두어, 요한복음 안의 긴장을 해소하지 않고 유지했습니다.
  alternative_readings:
  - ‘판별을 위하여’로 완화하기
  - ‘정죄를 위하여’로 좁히기
  rationale: 본문은 예수의 오심이 빛과 어둠, 보는 것과 보지 못함을 갈라놓는 사법적 결과를 말합니다. 이를 완화하면 요한복음의 의도적인 긴장이 사라집니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
