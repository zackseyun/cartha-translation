id: JHN.9.27
reference: John 9:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
  footnotes:
  - marker: a
    text: Or, 'I already told you, and you did not hear.' The Greek verb can mean either 'hear' or 'listen'; here it likely carries the sense of failing to heed what was said.
    reason: lexical_alternative
  - marker: b
    text: Or, 'Surely you do not also want to become his disciples?' The Greek question uses μή, which expects a negative answer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 대답했습니다[a]. “나는 이미 너희에게 말했는데도 너희는 듣지 않았습니다. 왜 다시 듣고자 합니까? 너희도 그의 제자가 되고자 하는 것은 아니겠지요?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 그들에게 말했습니다’. ἀποκρίνομαι는 문맥에 따라 ‘대답하다’와 ‘말하다’ 사이의 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: He answered
  chosen_korean: 대답했습니다
  alternatives_korean:
  - 대답하셨습니다
  - 응답했습니다
  lexicon: BDAG
  rationale: 서술문에서 자연스럽고, 원문의 응답 동사를 직접 반영합니다.
- source_word: οὐκ ἠκούσατε
  english_pob_choice: you did not listen
  chosen_korean: 너희는 듣지 않았습니다
  alternatives_korean:
  - 너희는 듣지 못했습니다
  - 너희는 들으려 하지 않았습니다
  lexicon: BDAG
  rationale: 여기서는 단순 청각보다 말에 귀 기울이지 않고 받아들이지 않은 뜻이므로 ‘듣지 않다’가 가장 직접적입니다.
- source_word: τί πάλιν θέλετε ἀκούειν;
  english_pob_choice: Why do you want to hear it again?
  chosen_korean: 왜 다시 듣고자 합니까?
  alternatives_korean:
  - 왜 다시 들으려 합니까?
  - 무엇을 다시 듣고자 합니까?
  lexicon: BDAG
  rationale: τί의 반문적 힘을 ‘왜’로 살리고, ‘πάλιν’은 ‘다시’로 옮겨 반복 요청의 뉘앙스를 드러냈습니다.
- source_word: μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
  english_pob_choice: You do not also want to become his disciples, do you?
  chosen_korean: 너희도 그의 제자가 되고자 하는 것은 아니겠지요?
  alternatives_korean:
  - 너희도 그의 제자가 되려는 것은 아니지요?
  - 너희도 그의 제자가 되고 싶다는 말은 아니겠지요?
  lexicon: BDAG
  rationale: μή가 이끄는 기대 부정의 의문을 한국어 반문으로 옮겼고, μαθηταί는 요한복음의 통상적 용례에 따라 ‘제자’로 유지했습니다.
theological_decisions:
- issue: 마지막 질문의 반문 톤
  chosen_reading: 부정의 답을 예상하는 반문으로 처리했습니다.
  alternative_readings:
  - 직역에 가까운 ‘너희도… 원하는 것이냐?’
  - 더 노골적인 조롱조의 표현
  rationale: 문법상 μή가 부정 답변을 기대하므로, 한국어에서도 그 긴장과 냉소 섞인 반문을 살려야 합니다.
  doctrine_reference: 문법적 수사법을 보존하여 화자의 태도와 본문 긴장을 유지합니다.
