id: JHN.9.36
reference: John 9:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
  footnotes:
  - marker: a
    text: Or “sir.” The Greek κύριε can be a respectful form of address as well as “Lord.”
    reason: alternative_reading
translation:
  language: ko
  text: 그가 대답하여 말했습니다. “그리고 그분이 누구십니까, 주님[a]? 제가 그분을 믿을 수 있도록 말씀해 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님”. 헬라어 κύριε는 존칭적 호칭일 수도 있고 “주님”일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  english_pob_choice: He answered and said
  chosen_korean: 그 사람이 대답하여 말했습니다
  alternatives_korean:
  - 그가 대답하고 말했습니다
  - 그 사람이 대답했습니다
  lexicon: BDAG
  rationale: 헬라어의 응답 동사와 서술 동사를 자연스러운 한국어 서술로 살리되, 중복을 과도하게 늘리지 않도록 ‘대답하여 말했습니다’로 옮겼습니다.
- source_word: Καὶ τίς ἐστιν
  english_pob_choice: And who is he
  chosen_korean: 그리고 누구십니까
  alternatives_korean:
  - 그리고 그분은 누구입니까
  - 그분이 누구십니까
  lexicon: BDAG
  rationale: 앞의 접속사 Καὶ를 살려 응답의 이어짐을 드러내고, τίς ἐστιν은 자연스러운 합쇼체 질문으로 옮겼습니다. 문맥상 대상이 이미 알려져 있어 ‘그분’보다 짧은 ‘누구십니까’가 더 직접적입니다.
- source_word: κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 선생님
  - 주여
  lexicon: BDAG
  rationale: 본문의 호격 κύριε는 존칭적 ‘선생님’으로도 읽힐 수 있지만, POB의 기본값과 요한복음 내 예수에 대한 호칭을 고려해 ‘주님’으로 두었습니다.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  english_pob_choice: that I may believe in him
  chosen_korean: 제가 그분을 믿게 하시려는 것입니까
  alternatives_korean:
  - 제가 그분을 믿게 하려는 것입니까
  - 제가 그분을 믿도록 하시려는 것입니까
  lexicon: BDAG
  rationale: ἵνα+접속법은 목적/의도를 나타내므로 ‘~하게 하시려는 것입니까’로 목적성을 살렸습니다. εἰς αὐτόν은 관용적으로 ‘그분을 믿다’로 옮겼습니다.
theological_decisions:
- issue: κύριε의 호칭 뉘앙스
  chosen_reading: 주님
  alternative_readings:
  - 선생님
  - 주여
  rationale: 이 장면에서 화자는 아직 예수의 정체를 완전히 고백하지 않았지만, 본문은 존칭적 호칭과 신앙 고백의 가능성을 함께 열어 둡니다. 따라서 ‘주님’을 본문에 두어 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — κύριος는 문맥에 따라 ‘Lord’/존칭 가능, 긴장 보존'
- issue: ἵνα πιστεύσω의 목적절 처리
  chosen_reading: 제가 그분을 믿게 하시려는 것입니까
  alternative_readings:
  - 제가 그분을 믿도록 하시려는 것입니까
  - 제가 그분을 믿게 하려는 것입니까
  rationale: 직역식 ‘그것은 누구이기에…’보다 한국어 목적/의도 표현이 더 분명하므로, 요청의 성격을 드러내는 간결한 합쇼체로 재구성했습니다.
  doctrine_reference: 'Greek ἵνα + subjunctive: purpose/result nuance'
