  lexicon: BDAG
  rationale: οὖν의 이어짐을 한국어 서술 흐름에 맞게 '그러므로'로 살리되, 문장 시작을 자연스럽게 유지했습니다.
- source_word: οἱ θεωροῦντες αὐτὸν τὸ πρότερον
  english_pob_choice: those who had seen him before
  chosen_korean: 그를 전에 보던 이들이
  alternatives_korean:
  - 그를 전에 보았던 이들이
  - 그를 이전에 보던 사람들이
  lexicon: BDAG
  rationale: 과거에 그를 알아볼 정도로 보아 온 사람들을 가리키는 뉘앙스를 살리기 위해 완료 느낌의 ‘보던’으로 옮겼습니다.
- source_word: ὅτι ⸀προσαίτης ἦν
  english_pob_choice: as a beggar
  chosen_korean: —그가 거지였기 때문에—
  alternatives_korean:
  - —그가 거지였던 사람이라서—
  - —거지였던 그를—
  lexicon: BDAG
  rationale: POB의 문맥상 식별 근거를 드러내되, 한국어에서는 자연스러운 설명 절로 처리했습니다. ‘거지’가 προσαίτης의 직접 대응어입니다.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  english_pob_choice: the man who used to sit and beg
  chosen_korean: 앉아 구걸하던 바로 그 사람
  alternatives_korean:
  - 앉아서 구걸하던 그 사람
  - 앉아 다니며 구걸하던 사람
  lexicon: BDAG
  rationale: 두 분사가 그 사람의 이전의 상습적 행위를 식별 표현으로 묘사하므로, ‘앉아 구걸하던’으로 습관적 과거를 자연스럽게 반영했습니다.
