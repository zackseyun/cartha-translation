source:
  edition: SBLGNT
  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
  footnotes:
  - marker: a
    text: Or, more formally, “Is this not the one who was sitting and begging?” The Greek uses participles ('sitting' and 'begging') to identify him by his customary former activity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이웃들과 그를 전에 보던 이들이—그가 거지였기 때문에—말하였습니다. 「이 사람이 앉아 구걸하던 바로 그 사람 아닙니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 직역하면 “앉아 구걸하던 그 사람인가?”입니다. 헬라어의 두 분사(‘앉다’, ‘구걸하다’)는 그 사람의 이전의 습관적 모습으로 식별하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν γείτονες
  english_pob_choice: So the neighbors
  chosen_korean: 그러므로 이웃들과
  alternatives_korean:
  - 그래서 이웃들과
  - 그런즉 이웃들이
  lexicon: BDAG
  rationale: οὖν의 이어짐을 한국어 서술 흐름에 맞게 '그러므로'로 살리되, 문장 시작을 자연스럽게 유지했습니다.
- source_word: οἱ θεωροῦντες αὐτὸν τὸ πρότερον
  english_pob_choice: those who had seen him before
  chosen_korean: 그를 전에 보던 이들이
  alternatives_korean:
  - 그를 전에 보았던 이들이
  - 그를 이전에 보던 사람들이
  lexicon: BDAG
  rationale: 과거에 그를 알아볼 정도로 보아 온 사람들을 가리키는 뉘앙스를 살리기 위해 완료 느낌의 ‘보던’으로 옮겼습니다.
- source_word: ὅτι ⸀προσαίτης ἦν
  english_pob_choice: as a beggar
  chosen_korean: —그가 거지였기 때문에—
  alternatives_korean:
  - —그가 거지였던 사람이라서—
  - —거지였던 그를—
  lexicon: BDAG
  rationale: POB의 문맥상 식별 근거를 드러내되, 한국어에서는 자연스러운 설명 절로 처리했습니다. ‘거지’가 προσαίτης의 직접 대응어입니다.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  english_pob_choice: the man who used to sit and beg
  chosen_korean: 앉아 구걸하던 바로 그 사람
  alternatives_korean:
  - 앉아서 구걸하던 그 사람
  - 앉아 다니며 구걸하던 사람
  lexicon: BDAG
  rationale: 두 분사가 그 사람의 이전의 상습적 행위를 식별 표현으로 묘사하므로, ‘앉아 구걸하던’으로 습관적 과거를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 직접화법의 질문형 재현
  chosen_reading: 「이 사람이 앉아 구걸하던 바로 그 사람 아닙니까?」
  alternative_readings:
  - 「이 사람이 앉아 구걸하던 그 사람 아닙니까?」
  - 「이 사람은 앉아 구걸하던 사람이 아닙니까?」
  rationale: 원문의 수사적 질문을 보존하되, 한국어에서는 식별의 강도를 살리기 위해 ‘바로 그 사람’으로 옮겼습니다.
  doctrine_reference: 해당 없음
