id: JHN.9.15
reference: John 9:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
  footnotes:
  - marker: a
    text: Or “clay” instead of “mud.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “how he saw again” or “how he regained sight.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 바리새인들도 그에게 그가 어떻게 보게 되었는지[a]를 다시 물었습니다. 그가 그들에게 말했습니다. “그가 내 눈에 진흙[b]을 얹고, 내가 씻었더니, 지금 봅니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떻게 다시 보게 되었는지’, ‘어떻게 시력을 되찾았는지’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘찰흙’, ‘점토’.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν ἠρώτων
  english_pob_choice: So the Pharisees also asked him again
  chosen_korean: 그래서 바리새인들도 그에게 다시 … 하고 물었습니다
  alternatives_korean:
  - 그리하여 바리새인들도 그에게 다시 … 하고 물었습니다
  - 바리새인들이 또 그에게 물었습니다
  lexicon: BDAG
  rationale: πάλιν·οὖν·ἠρώτων의 반복성과 이어짐을 한국어에서 자연스럽게 살리되, ‘바리새인들도’로 καί의 포함 관계를 드러냈습니다.
- source_word: πῶς ἀνέβλεψεν
  english_pob_choice: how he had received his sight
  chosen_korean: 어떻게 눈을 뜨게 되었습니까
  alternatives_korean:
  - 어떻게 다시 보게 되었습니까
  - 어떻게 시력을 회복했습니까
  lexicon: BDAG
  rationale: ἀναβλέπω는 여기서 ‘보다’ 일반보다 ‘시력을 회복하다/눈을 뜨다’의 치유 의미이므로, 현대 한국어의 자연스러운 표현으로 옮겼습니다.
- source_word: Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  english_pob_choice: He put mud on my eyes
  chosen_korean: 진흙을 제 눈 위에 얹으셨고
  alternatives_korean:
  - 진흙을 제 눈에 바르셨고
  - 진흙을 제 눈에 놓으셨고
  lexicon: BDAG
  rationale: πηλός의 기본 의미를 ‘진흙’으로 살리고, ἐπιτίθημι+ἐπί의 ‘위에 놓다/얹다’ 관계를 자연스럽게 표현했습니다.
- source_word: ἐνιψάμην
  english_pob_choice: I washed
  chosen_korean: 제가 씻었습니다
  alternatives_korean:
  - 제가 씻었고
  - 제가 제 몸을 씻었습니다
  lexicon: BDAG
  rationale: 중간태의 반사적 뉘앙스는 한국어에서 별도 표지 없이 ‘씻다’로 충분히 전달되므로, 간결하게 처리했습니다.
- source_word: βλέπω
  english_pob_choice: I see
  chosen_korean: 그리고 지금 봅니다
  alternatives_korean:
  - 그리고 봅니다
  - 그리고 지금 볼 수 있습니다
  lexicon: BDAG
  rationale: 현재시제의 생생한 결과 상태를 살리되, 문맥상 ‘보게 되었다’보다 현재의 실제 상태를 드러내는 ‘지금 봅니다’로 옮겼습니다.
theological_decisions:
- issue: 회복된 시력의 현재성
  chosen_reading: βλέπω를 단순 과거 완료가 아니라 현재의 살아 있는 결과로 읽어 ‘지금 봅니다’로 번역했습니다.
  alternative_readings:
  - ‘봅니다’
  - ‘볼 수 있습니다’
  rationale: 본문의 현재시제가 치유의 결과를 눈앞의 현실로 제시하므로, 한국어도 즉시성과 체험성을 유지하는 쪽이 더 적절합니다.
  doctrine_reference: 요한복음의 표적 서술과 치유의 현실성
