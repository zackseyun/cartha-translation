  verdict: revise
  source_fidelity: 바리새인들의 질문은 헬라어의 간접의문문(‘그가 어떻게 보게 되었는지’)으로 옮기는 것이 더 충실합니다. 또한 예수의 행위를 가리키는 ἐπέθηκεν에는 원문상 존대 표지가 없으므로 ‘얹으셨고’보다 ‘얹고’가 원문의 서술 수준을 보존합니다. βλέπω의 현재 결과는 ‘지금 봅니다’로 잘 드러납니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 자연스러운 서술과 직접 인용을 유지하면서, ‘제 눈 위에’보다 관용적인 ‘내 눈에’를 사용합니다. ‘내가 씻었더니’는 세 동작의 순서와 그 결과를 한국어에서 자연스럽게 연결합니다.
  terminology: ‘바리새인’, ‘진흙’, ‘눈’, ‘보다’는 적절합니다. πηλός의 대안인 ‘찰흙/점토’와 ἀναβλέπω의 ‘다시 보다/시력을 되찾다’ 가능성은 해당 표현 바로 뒤에 각주로 연결합니다.
