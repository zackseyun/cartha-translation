revisions:
- from: 그의 부모는 이런 말들을 했습니다. 그들이 유대인들을 두려워했기 때문입니다. 이미 유대인들은, 누구든지 예수를 메시아로 고백하면 회당에서 쫓겨나게 하기로 서로 합의해 두었기 때문입니다.[a][b]
  to: 그의 부모가 이러한 말들을 한 것은 유대인들을 두려워했기 때문입니다. 유대인들이 이미 누구든지 그를 메시아라고 고백하면 회당에서 쫓겨나게 하기로 서로 합의해 두었기 때문입니다.[a][b]
  rationale: 원문의 대명사 αὐτόν을 ‘그를’로 보존하고, ὅτι와 γάρ가 제시하는 인과·설명 관계를 자연스러운 한국어 문장으로 정리했습니다. ‘메시아’와 회당으로부터의 배제라는 핵심 용어는 유지했으며, ‘유대인들’이라는 본문 표현과 문맥상 가능한 지시 대상을 각주에서 구별했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:23Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 본문의 αὐτόν(‘그를’)을 ‘예수를’로 구체화한 것은 원문의 대명사 표현보다 한 단계 해석을 더한 것이므로, 문맥상 지시 대상은 분명하더라도 ‘그를’로 유지하는 편이 더 직접적입니다. 또한 ἤδη의 시간적 뉘앙스는 ‘이미’로 유지되어야 합니다.
  naturalness: 초안은 ‘...때문입니다’가 연달아 반복되고 첫 문장을 짧게 분리하여, 설명 관계(ὅτι 및 γάρ)가 다소 딱딱하고 부자연스럽게 들립니다. 한 문장으로 연결하면 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘메시아’는 χριστόν의 칭호적 용법을 잘 반영하며, ‘회당에서 쫓겨나게 하기로’도 ἀποσυνάγωγος γένηται의 회당 공동체로부터의 배제를 자연스럽게 전달합니다. ‘유대인들’은 본문의 표현을 보존하되, 각주에서 이 문맥의 유력한 지시 대상이 유대 지도자들임을 밝혀야 합니다.
  issues:
  - severity: medium
    issue: αὐτόν을 ‘예수를’로 구체화함
    rationale: 원문은 ‘그를’이라고 대명사를 사용합니다. 선행 문맥상 예수를 가리키지만, 번역문도 대명사를 유지하여 원문의 표현 범위와 문체를 보존하는 것이 안전합니다.
  - severity: low
    issue: 인과 표현의 반복과 문장 분절
    rationale: ‘...때문입니다’가 두 차례 반복되어 ὅτι와 γάρ의 연결된 설명 구조가 한국어에서 매끄럽지 않습니다. 한 문장으로 재구성하면 의미 관계가 더 분명하고 자연스럽습니다.
  - severity: low
    issue: 각주 a에 원문의 표면 표현 안내가 없음
    rationale: 영어 POB 감사 기록은 그리스어가 문자적으로 ‘유대인들’이라고 말함을 명시합니다. 한국어 각주도 이를 밝혀, 본문 표현과 문맥적 설명을 구별하는 것이 좋습니다.
  revised_text: 그의 부모가 이러한 말들을 한 것은 유대인들을 두려워했기 때문입니다. 유대인들이 이미 누구든지 그를 메시아라고 고백하면 회당에서 쫓겨나게 하기로 서로 합의해 두었기 때문입니다.[a][b]
