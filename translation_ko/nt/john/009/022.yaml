id: JHN.9.22
reference: John 9:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
  footnotes:
  - marker: a
    text: 'Greek: ''the Jews.'' In this context, the reference is likely to the Jewish authorities rather than to Jewish people indiscriminately.'
    reason: cultural_note
  - marker: b
    text: Or 'confessed him as Christ' or 'acknowledged him as the Christ.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 부모는 이런 말들을 했습니다. 그들이 유대인들을 두려워했기 때문입니다. 이미 유대인들은, 누구든지 예수를 메시아로 고백하면 회당에서 쫓겨나게 하기로 서로 합의해 두었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대인들’은 이 문맥에서 회당에서의 추방 권한을 가진 유대 지도자들을 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그를 그리스도로 고백하면’
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ γονεῖς αὐτοῦ
  english_pob_choice: his parents
  chosen_korean: 그의 부모는
  alternatives_korean:
  - 그의 아버지와 어머니는
  lexicon: BDAG
  rationale: γονεῖς는 일반적으로 ‘부모’를 뜻하므로 간결하고 자연스럽게 옮겼습니다.
- source_word: ἐφοβοῦντο τοὺς Ἰουδαίους
  english_pob_choice: they were afraid of the Jews
  chosen_korean: 유대인들을 두려워했기 때문입니다
  alternatives_korean:
  - 유대인들을 무서워했기 때문입니다
  - 유대 지도자들을 두려워했기 때문입니다
  lexicon: BDAG
  rationale: 본문의 표면 표현을 살리되, 한국어에서는 ‘두려워하다’가 문맥상 가장 자연스럽습니다.
- source_word: συνετέθειντο
  english_pob_choice: had already agreed
  chosen_korean: 서로 합의해 두었기 때문입니다
  alternatives_korean:
  - 이미 동의해 두었기 때문입니다
  - 이미 결의해 두었기 때문입니다
  lexicon: BDAG
  rationale: 사전에 이뤄진 확정적 합의를 나타내므로 ‘합의해 두다’가 의미와 시간감을 잘 드러냅니다.
- source_word: ὁμολογήσῃ χριστόν
  english_pob_choice: confessed him as the Messiah
  chosen_korean: 예수를 메시아로 고백하면
  alternatives_korean:
  - 예수를 그리스도로 고백하면
  - 예수를 메시아라고 고백하면
  lexicon: BDAG
  rationale: χριστόν은 여기서 титular 용법이므로 POB 기준에 따라 ‘메시아’로 옮겼고, ὁμολογέω는 공개적 신앙 고백의 의미를 살렸습니다.
- source_word: ἀποσυνάγωγος γένηται
  english_pob_choice: would be put out of the synagogue
  chosen_korean: 회당에서 쫓겨나게
  alternatives_korean:
  - 회당에서 배제되게
  - 회당에서 내쫓기게
  lexicon: BDAG
  rationale: ἀποσυνάγωγος는 회당 공동체에서의 배제를 뜻하므로, 한국어 관용에 맞는 ‘쫓겨나다’로 옮겼습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  - 그리스도이신 분
  rationale: 본문은 예수를 어떤 호칭으로 고백할 것인가를 다루는 титular 표현이므로, 유대적 메시아 기대를 드러내는 ‘메시아’가 가장 직접적입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: Χριστός → Messiah (title)'
