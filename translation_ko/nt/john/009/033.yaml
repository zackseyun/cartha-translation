lexical_decisions:
- source_word: εἰ μὴ
  english_pob_choice: If ... not
  chosen_korean: 만일 ... 아니시라면
  alternatives_korean:
  - '...이 아니면'
  - '...하지 않으시면'
  lexicon: BDAG
  rationale: 조건절의 대비 구조를 한국어에서도 분명히 드러내기 위해 ‘만일 ... 아니시라면’을 택했습니다. 영어 POB의 ‘If ... not’처럼 축약하지 않고, 원문의 가정적 조건을 자연스럽게 살렸습니다.
- source_word: οὗτος
  english_pob_choice: this man
  chosen_korean: 이 사람
  alternatives_korean:
  - 이분
  - 이 사람
  lexicon: BDAG
  rationale: 문맥상 예수를 가리키는 지시어이지만, 여기서는 화자가 공개적으로 논증하는 자리이므로 과도하게 경건한 호칭보다 ‘이 사람’이 원문의 지시성과 담화를 더 직접적으로 반영합니다.
- source_word: παρὰ θεοῦ
  english_pob_choice: from God
  chosen_korean: 하나님께로부터 온
  alternatives_korean:
  - 하나님에게서 온
  - 하나님으로부터 온
  lexicon: BDAG
  rationale: παρά + 속격의 출처 의미를 한국어로 옮기되, 단순한 출처를 넘어 인물의 기원/내림을 드러내는 흐름을 살려 ‘하나님께로부터 온’으로 번역했습니다. 이는 영어 POB의 ‘from God’을 따르면서도 한국어에서 자연스럽습니다.
- source_word: οὐκ ἠδύνατο ποιεῖν οὐδέν
  english_pob_choice: he could do nothing
  chosen_korean: 아무것도 하실 수 없습니다
  alternatives_korean:
  - 아무것도 할 수 없습니다
  - 아무 일도 하실 수 없습니다
  lexicon: BDAG
  rationale: 능력 부정을 한국어의 ‘할 수 없습니다’로 자연스럽게 표현하되, 앞선 ‘이 사람’에 대한 지시를 이어 예수께 대한 공적 발화를 반영해 존칭형 ‘하실 수 없습니다’를 택했습니다. ‘아무것도’가 συνολική 무능력의 강조를 유지합니다.
theological_decisions:
- issue: ‘from God’의 범위
  chosen_reading: ‘하나님께로부터 온’으로 번역해, 예수의 사역이 하나님에게서 유래했다는 진술을 유지하되 그 이상을 해설하지 않았습니다.
  alternative_readings:
  - 하나님께 보내심을 받은
  - 하나님에게서 나온
  rationale: 본문은 출처/기원 진술을 하고 있으므로, ‘보내심’을 명시하면 원문보다 해석이 앞서게 됩니다. 따라서 원문이 허용하는 범위에서만 분명하게 옮겼습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
