id: JHN.9.3
reference: John 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
  footnotes:
  - marker: a
    text: Or, more literally, 'but so that the works of God might be revealed in him.' The supplied words 'this happened' make the Greek construction natural in English.
    reason: lexical_alternative
  - marker: b
    text: Or possibly 'through him' for 'in him'; the Greek reads 'in him,' which may denote the sphere or means by which God's works are displayed.
    reason: lexical_alternative
  - marker: c
    text: Or 'Neither this man sinned'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 대답하셨습니다. 「이 사람이 죄를 지은 것도 아니고, 그의 부모가 죄를 지은 것도 아닙니다. 다만 하나님의 일들이 그를 통해 드러나게 하려는 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를 통해’는 헬라어 ἐν αὐτῷ의 문자적 ‘그 안에서’에 대한 해석적 옮김입니다. POB 주해는 하나님의 일이 그 사람 안/를 통해 드러난다는 여지를 남깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답하셨습니다
  alternatives_korean:
  - 응답하셨습니다
  - 말씀하셨습니다
  lexicon: BDAG
  rationale: 대화 맥락에서 ἀποκρίνομαι의 표준 의미를 자연스럽게 살리면서, 예수의 발화를 매끄러운 서술체로 전달합니다.
- source_word: οὔτε ... οὔτε
  english_pob_choice: Neither ... nor
  chosen_korean: ~도 아니고, ~도 아닙니다
  alternatives_korean:
  - ~도 아니며, ~도 아닙니다
  - ~도 아니고 ~도 아닙니다
  lexicon: BDAG
  rationale: 두 가지 원인을 모두 부정하는 상관구조를 한국어의 자연스러운 부정 대칭으로 옮겼습니다.
- source_word: ἥμαρτεν
  english_pob_choice: sinned
  chosen_korean: 죄를 지은
  alternatives_korean:
  - 범죄한
  - 죄를 범한
  lexicon: BDAG
  rationale: 동사 ἁμαρτάνω의 직접적 의미를 유지하되, 현대 한국어에서 가장 자연스러운 구문으로 풀었습니다.
- source_word: ἐν αὐτῷ
  english_pob_choice: in him
  chosen_korean: 그를 통해
  alternatives_korean:
  - 그 안에서
  - 그에게서
  lexicon: BDAG
  rationale: 문자적으로는 ‘그 안에서’가 가능하지만, 문맥상 하나님의 일이 이 사람을 매개로 드러난다는 의미를 살려 POB의 주해상 유보를 반영하는 표현으로 옮겼습니다.
theological_decisions:
- issue: ἵνα φανερωθῇ의 목적/결과 뉘앙스와 번역
  chosen_reading: ‘다만 하나님의 일들이 그를 통해 드러나게 하려는 것입니다’로 목적 중심의 표현을 유지했습니다.
  alternative_readings:
  - ‘그 결과 하나님의 일들이 그에게서 드러났습니다’
  - 목적을 덜 드러내는 완곡한 표현
  rationale: ἵνα + 접속법의 기본값을 살리면서도, 이 구절이 고난의 원인을 단정적으로 설명하는 듯한 과잉 신학화를 피했습니다.
  doctrine_reference: 문맥이 제시하는 특정 상황을 번역하고, 보편 명제로 확장하지 않습니다.
