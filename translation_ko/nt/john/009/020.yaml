  terminology: ‘부모’, ‘아들’, ‘압니다’는 정확하고 현대 표준어에 적합합니다. 각주에서는 ‘눈이 멀어 있었다’가 후천적 실명을 연상시킬 여지가 있으므로, 출생 시점부터의 상태를 더 분명히 하는 표현으로 다듬는 것이 좋습니다.
