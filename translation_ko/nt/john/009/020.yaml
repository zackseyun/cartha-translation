id: JHN.9.20
reference: John 9:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸀οὖν οἱ γονεῖς αὐτοῦ καὶ εἶπαν· Οἴδαμεν ὅτι οὗτός ἐστιν ὁ υἱὸς ἡμῶν καὶ ὅτι τυφλὸς ἐγεννήθη·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
  footnotes:
  - marker: a
    text: Or, “he was blind from birth.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그의 부모가 대답하며 말했습니다. "우리는 이 사람이 우리 아들이라는 것과 그가 눈먼 채로 태어났다는 것을 압니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 태어날 때부터 눈이 멀어 있었습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  english_pob_choice: answered and said
  chosen_korean: 대답하며 말했습니다
  alternatives_korean:
  - 대답했고 말했습니다
  - 대답하여 말했습니다
  lexicon: BDAG
  rationale: 헬라어의 반복적 응답 공식을 한국어에서 자연스럽게 살리되, ‘말했습니다’로 묶어 장황함을 줄였습니다.
- source_word: γονεῖς
  english_pob_choice: parents
  chosen_korean: 부모
  alternatives_korean:
  - 양친
  - 아버지와 어머니
  lexicon: BDAG
  rationale: 복수 명사로서 아버지와 어머니를 함께 가리키므로, 현대 한국어에서는 ‘부모’가 가장 자연스럽고 정확합니다.
- source_word: Οἴδαμεν
  english_pob_choice: We know
  chosen_korean: 우리는 ... 압니다
  alternatives_korean:
  - 우리는 ... 알고 있습니다
  - 우리는 ... 압니다
  lexicon: BDAG
  rationale: 증언의 확언을 분명히 드러내는 현재형 ‘압니다’가 문맥상 적절합니다.
- source_word: τυφλὸς ἐγεννήθη
  english_pob_choice: he was born blind
  chosen_korean: 눈먼 채로 태어났다는 것
  alternatives_korean:
  - 눈먼 채로 태어났다는 것
  - 태어날 때부터 눈이 멀었다는 것
  lexicon: BDAG
  rationale: 직역에 가까운 구조를 유지하면서도 한국어 문장 안에서 자연스럽게 들리도록 ‘눈먼 채로 태어났다’로 옮겼습니다.
theological_decisions:
- issue: 증언문의 직접화법과 사실 확인의 어조
  chosen_reading: 부모의 진술을 담담한 증언체로 유지했습니다.
  alternative_readings:
  - 더 강한 반박조
  - 더 해설적인 서술조
  rationale: 본문은 논쟁적 반박보다 사실 확인의 진술을 전하므로, 문체를 과장하지 않고 그대로 보존했습니다.
  doctrine_reference: 본문 맥락 보존
