    text: Or, “he was blind from birth.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그의 부모가 대답하여 말했습니다. “우리는 이 사람이 우리 아들이라는 것과 그가 눈먼 채로 태어났다는 것을 압니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
