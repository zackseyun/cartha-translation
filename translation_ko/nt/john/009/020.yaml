  source_fidelity: 그리스어의 οὖν(서사적 이어짐), γονεῖς(부모), οὗτός(이 사람), 그리고 ‘태어날 때부터 맹인이었다’는 τυφλὸς ἐγεννήθη의 의미가 전반적으로 충실히 반영되었습니다. 다만 ἀπεκρίθησαν ... καὶ εἶπαν은 완료된 두 동작의 연결이므로 ‘대답하며 말했습니다’보다 ‘대답하여 말했습니다’가 원문의 서술 진행에 더 가깝습니다.
