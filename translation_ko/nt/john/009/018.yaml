source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
  footnotes:
  - marker: a
    text: Or possibly 'the Jewish leaders' or 'the Judeans,' depending on how John's use of 'the Jews' is understood in context.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 유대인들은 그가 맹인이었다가 보게 되었다는 사실을, 보게 된 그 사람의 부모를 부를 때까지 믿지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘유대인들’은 문맥에 따라 ‘유대 지도자들’ 또는 ‘유대 지방 사람들’로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대 지도자들
  - 유대 사람들
  lexicon: BDAG
  rationale: 원문을 좁혀 해석하지 않고 기본 표현을 살렸습니다. 요한복음의 문맥상 다양한 지시 가능성은 있으나, 본문 자체가 말하는 주체는 ‘유대인들’입니다.
- source_word: περὶ αὐτοῦ
  english_pob_choice: concerning him
  chosen_korean: 그에 관하여
  alternatives_korean:
  - 그에 대해
  - 그를 두고
  lexicon: BDAG
  rationale: περὶ + 속격의 자연스러운 현대 한국어 대응으로, 내용에 대한 판단을 나타내는 조사적 표현을 유지했습니다.
- source_word: ἦν τυφλὸς καὶ ἀνέβλεψεν
  english_pob_choice: he had been blind and had received sight
  chosen_korean: 맹인이었다가 보게 되었다
  alternatives_korean:
  - 눈이 멀었다가 보게 되었다
  - 맹인이었다가 시력을 회복했다
  lexicon: BDAG
  rationale: 치유 전 상태와 치유 결과의 대조를 간결하게 드러내기 위해 ‘맹인이었다가 보게 되었다’로 옮겼습니다. ‘시력을 회복했다’는 이전에 보았던 뉘앙스를 줄 수 있어 피했습니다.
- source_word: τοῦ ἀναβλέψαντος
  english_pob_choice: the one who had received sight
  chosen_korean: 보게 된 사람
  alternatives_korean:
  - 시력을 받은 사람
  - 보게 된 이
  lexicon: BDAG
  rationale: 분사구를 한국어 관계절로 풀어, 이미 앞에서 언급된 치유 받은 사람을 자연스럽게 지시하도록 했습니다.
theological_decisions:
- issue: 요한복음에서 ‘유대인들’의 번역 범위
  chosen_reading: 본문은 해석적으로 좁히지 않고 ‘유대인들’로 유지했습니다.
  alternative_readings:
  - 유대 지도자들
  - 유대 사람들
  rationale: 문맥상 지도자층일 가능성이 있어도 원문이 그 한정어를 쓰지 않으므로, 본문은 그대로 두고 해석의 여지를 남기는 것이 원문 우선 원칙에 맞습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
