revisions:
- from: 그래서 유대인들은 그가 맹인이었다가 보게 되었다는 것을 그에 관하여 믿지 않았습니다. 그가 보게 된 사람의 부모를 부르기 전까지는요.[a]
  to: 그래서 유대인들은 그가 맹인이었다가 보게 되었다는 사실을, 보게 된 그 사람의 부모를 부를 때까지 믿지 않았습니다.[a]
  rationale: 원문의 내용절(그가 맹인이었고 보게 되었다는 것)과 시간 한계절(그의 부모를 부를 때까지)을 한 문장 안에서 자연스럽게 연결했습니다. 본문의 ‘유대인들’은 유지하여 지시 대상을 해석적으로 한정하지 않았고, 각주에서만 가능한 문맥적 범위를 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:21Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 사건 순서는 대체로 원문에 충실합니다. 다만 원문의 ἕως ὅτου(‘~할 때까지’)는 앞선 ‘믿지 않았다’에 직접 연결되어야 하므로, 이를 독립 문장과 ‘전까지는요’로 분리한 현 문안은 문법적 연결과 서술의 초점이 약해집니다.
  naturalness: ‘그에 관하여 믿지 않았습니다’는 한국어에서 다소 부자연스럽고, 문장 끝의 ‘전까지는요’는 현대 정중체 성경 문체에서 구어적이며 불완전한 문장처럼 들립니다. 시간절을 주절 안에 배치하면 자연스럽고 분명합니다.
  terminology: ‘유대인들’은 οἱ Ἰουδαῖοι를 해석적으로 좁히지 않는 적절한 본문 번역입니다. 그러나 각주의 ‘유대 사람들’은 본문의 ‘유대인들’과 사실상 같은 뜻이므로, 영어 감사 기록의 대안인 ‘Judeans’를 반영하여 ‘유대 지방 사람들’로 고치는 것이 좋습니다. ‘맹인이었다가 보게 되었다’와 ‘보게 된 그 사람’은 문맥과 원문 분사에 잘 맞습니다.
  issues:
  - severity: medium
    issue: ἕως ὅτου의 시간절이 독립된 구어적 문장으로 분리됨
    rationale: ‘그가 보게 된 사람의 부모를 부르기 전까지는요’는 술어가 없는 문장이고, 원문의 ‘믿지 않았다—부를 때까지’라는 직접적 시간 관계를 약화합니다.
  - severity: low
    issue: ‘그에 관하여 믿지 않았다’의 한국어 어색함
    rationale: 여기서 믿음의 내용은 ὅτι절입니다. ‘그가 맹인이었다가 보게 되었다는 사실을 믿지 않았다’가 자연스럽고 의미도 정확합니다.
  - severity: low
    issue: 각주의 대안 표현이 본문 표현과 중복됨
    rationale: ‘유대 사람들’은 ‘유대인들’의 실질적 대안이 되지 못합니다. 문맥적 대안으로 ‘유대 지방 사람들’을 제시하는 편이 영어 POB 감사 기록과도 부합합니다.
  revised_text: 그래서 유대인들은 그가 맹인이었다가 보게 되었다는 사실을, 보게 된 그 사람의 부모를 부를 때까지 믿지 않았습니다.[a]
