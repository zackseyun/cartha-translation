id: JHN.9.7
reference: John 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
  footnotes:
  - marker: a
    text: Or “which means ‘Sent.’”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말씀하셨습니다. “실로암 못으로 가서 씻으십시오.” (이는 “보냄 받은 자”로 번역됩니다.) 그래서 그는 가서 씻었고, 보게 되어 돌아왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보내심을 받은 자”로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὕπαγε
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 가십시오
  - 가라
  lexicon: BDAG
  rationale: 명령형 이동 동사로, 한국어에서는 뒤의 동작과 자연스럽게 이어지는 ‘가서’가 가장 간결하고 구어적이면서도 합쇼체 문맥에 맞습니다.
- source_word: νίψαι / ἐνίψατο
  english_pob_choice: wash / washed
  chosen_korean: 씻으십시오 / 씻었고
  alternatives_korean:
  - 씻으시고
  - 세수하십시오 / 세수했는데
  - 헹구십시오 / 헹구었고
  lexicon: BDAG
  rationale: νίπτω는 부분적 몸 씻기를 가리킬 수 있지만, 여기서는 ‘씻다’가 가장 자연스럽고 과도한 해석 없이 행위를 전달합니다.
- source_word: εἰς τὴν κολυμβήθραν
  english_pob_choice: in the pool
  chosen_korean: 실로암 못으로
  alternatives_korean:
  - 실로암 연못으로
  - 실로암 못 안으로
  lexicon: BDAG
  rationale: κολυμβήθρα는 연못/못을 가리키므로 한국어 성경 문맥에서 익숙한 ‘못’이 적절합니다. ‘으로’는 목적지·장소 진입을 모두 자연스럽게 담습니다.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  english_pob_choice: which is translated “Sent”
  chosen_korean: 이는 “보냄 받은 자”로 번역됩니다
  alternatives_korean:
  - 이는 “보냄 받은”으로 번역됩니다
  - 이는 “보냄”으로 해석됩니다
  - 이는 “보냄을 받은 자”로 옮길 수 있습니다
  lexicon: BDAG
  rationale: Ἀπεσταλμένος의 분사적 의미를 살려 ‘보냄 받은 자’로 옮기면, 영어의 ‘Sent’보다 한국어에서 인격적 호칭처럼 읽히는 효과를 보존합니다.
theological_decisions:
- issue: 실로암 이름의 설명을 본문 안에서 어떻게 유지할 것인가
  chosen_reading: 원문의 설명절을 본문 안 괄호로 유지하고, ‘보냄 받은 자’로 직역해 상징적 연결은 지나치게 풀어 쓰지 않았습니다.
  alternative_readings:
  - ‘보내심을 받은 자’로 더 신학적으로 풀어 쓰기
  - 설명절을 각주로만 처리하기
  rationale: 요한이 제시한 설명 자체는 본문 요소이므로 유지하되, 여기서 곧바로 예수의 파송 신학을 본문에 덧씌우지 않는 것이 원문 충실에 맞습니다.
  doctrine_reference: 원문 우선, 상징의 과잉 해석 자제
- issue: 구약적/신학적 호칭을 ‘보냄 받은 자’로 둘지 여부
  chosen_reading: ‘Sent’를 고유 명사처럼 처리하지 않고 설명적 번역으로 남겼습니다.
  alternative_readings:
  - ‘보냄’만 제시하기
  - ‘보내심 받은 이’로 의역하기
  rationale: ἑρμηνεύεται는 해설적 표지이므로, 의미를 분명히 하되 본문이 말하는 범위를 넘지 않도록 ‘보냄 받은 자’로 정리했습니다.
  doctrine_reference: 문맥 해설과 본문 의미 보존
