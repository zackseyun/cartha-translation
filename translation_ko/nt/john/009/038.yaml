id: JHN.9.38
reference: John 9:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
  footnotes:
  - marker: a
    text: Or “Sir.” The Greek κύριε can be a respectful form of address; here “Lord” is preferred because the context climaxes in confession and worship.
    reason: alternative_reading
  - marker: b
    text: Or “bowed down before him” / “paid homage to him.” The Greek verb can denote prostration or homage; here it is rendered “worshiped” in view of the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 대답했습니다. “저는 믿습니다, 주님.” 그리고 그는 그분께 절했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선생님”. 여기서는 단순한 공손 호칭일 수도 있지만, 문맥상 믿음의 고백과 경배로 절정에 이르므로 ‘주님’이 더 적절합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “예배했습니다” / “경배했습니다”. προσκυνέω는 절함이나 경배를 뜻할 수 있으며, 여기서는 예수님을 향한 응답이므로 ‘절했습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  english_pob_choice: And he said
  chosen_korean: 그가 대답했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그리고 그가 말했습니다
  lexicon: BDAG
  rationale: 이 표현은 단순한 발화 도입이므로 자연스러운 서사 한국어로 옮기되, 앞선 예수님의 말씀에 대한 응답임이 드러나도록 ‘대답했습니다’로 처리했습니다.
- source_word: Πιστεύω
  english_pob_choice: I believe
  chosen_korean: 저는 믿습니다
  alternatives_korean:
  - 나는 믿습니다
  - 믿습니다
  lexicon: BDAG
  rationale: 직접 고백의 1인칭 현재형을 살려 ‘믿습니다’로 옮기고, 한국어 화자에게 자연스러운 공손·고백체를 위해 주어를 보충했습니다.
- source_word: κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  - sir
  lexicon: BDAG
  rationale: 문맥상 단순 호칭보다 신앙 고백의 호칭이므로, 프로젝트 기본값에 따라 ‘주님’으로 옮겨 예수님에 대한 높임과 고백성을 함께 살렸습니다.
- source_word: προσεκύνησεν αὐτῷ
  english_pob_choice: worshiped him
  chosen_korean: 그분께 절했습니다
  alternatives_korean:
  - 그분께 경배했습니다
  - 그분께 예배했습니다
  - 그분께 경의를 표했습니다
  lexicon: BDAG
  rationale: προσκυνέω는 예배와 절함을 모두 가리킬 수 있으나, 한국어에서 문맥상 몸을 숙이는 행위와 예배의 함의를 함께 담는 ‘절했습니다’가 가장 직접적입니다.
theological_decisions:
- issue: κύριε의 존칭을 ‘sir’로 낮출지, 예수님에 대한 고백적 호칭으로 살릴지
  chosen_reading: ‘주님’으로 번역했습니다.
  alternative_readings:
  - ‘선생님’
  - ‘주’
  rationale: 이 장면은 치유받은 사람이 예수님을 믿음으로 응답하고 곧바로 경배하는 절정이므로, 예의적 호칭보다 신앙 고백의 무게를 드러내는 번역이 본문 취지에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος 관련 번역 원칙'
