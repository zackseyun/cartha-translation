id: JHN.9.29
reference: John 9:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
  footnotes:
  - marker: a
    text: Or 'where he comes from.' In John, questions about Jesus' origin can carry both ordinary and deeper theological significance.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 하나님이 모세에게 말씀하신 것을 압니다[a]. 그러나 이 사람에 대해서는 그가 어디서 왔는지 알지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 어디서 오는지’로 옮길 수 있습니다. 요한복음에서는 예수의 ‘어디서 왔는가’라는 질문이 단순한 지리적 출신과 더 깊은 신학적 의미를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  english_pob_choice: We
  chosen_korean: 우리는
  alternatives_korean:
  - 우리로서는
  - 우리들은
  lexicon: BDAG
  rationale: 명시적 인칭대명사는 대조를 강조하지만, 한국어에서는 주어를 자연스럽게 드러내면 충분하므로 ‘우리는’으로 옮겼습니다.
- source_word: Μωϋσεῖ λελάληκεν
  english_pob_choice: has spoken to Moses
  chosen_korean: 모세에게 말씀하신 것을
  alternatives_korean:
  - 모세에게 말하신 것을
  - 모세에게 말씀하셨다는 것을
  lexicon: BDAG
  rationale: λελάληκεν의 완료 뉘앙스는 이미 이루어져 지금까지 유효한 발화를 가리키므로 ‘말씀하신’를 사용했습니다. 하나님을 주어로 삼는 문맥에서 ‘말씀하다’가 가장 자연스럽습니다.
- source_word: τοῦτον δὲ
  english_pob_choice: but as for this man
  chosen_korean: 그러나 이 사람에 대해서는
  alternatives_korean:
  - 하지만 이 사람은
  - 그런데 이 사람에 대해서는
  lexicon: BDAG
  rationale: δὲ와 지시대명사의 결합이 주제 전환과 대조를 함께 드러내므로, ‘에 대해서는’으로 초점을 살렸습니다.
- source_word: πόθεν ἐστίν
  english_pob_choice: where he is from
  chosen_korean: 어디서 왔는지
  alternatives_korean:
  - 어디서 난 사람인지
  - 출신이 어디인지
  lexicon: BDAG
  rationale: πόθεν은 출처·기원을 묻는 표현이므로, 문맥의 단순한 지리적 의미와 더 깊은 기원 암시를 모두 열어 두는 한국어로 옮겼습니다.
theological_decisions:
- issue: 예수의 기원에 대한 질문의 범위
  chosen_reading: ‘어디서 왔는지’로 넓게 번역해, 단순한 출신뿐 아니라 요한복음이 반복하는 예수의 근원/권위 문제를 굳이 해설로 좁히지 않았습니다.
  alternative_readings:
  - 어디서 난 사람인지
  - 그의 근원이 무엇인지
  rationale: 본문은 화자들의 주장만 제시하며, 요한복음의 층위 있는 아이러니를 독자가 그대로 느끼도록 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 요한복음의 예수 기원 모티프를 해설로 평면화하지 않음
