review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 현재의 ‘네가 우리를 가르치려 하느냐?’는 현재형 διδάσκεις를 미래적 의도·시도의 의미로 다소 옮기므로, ‘네가 우리를 가르치느냐?’가 원문의 현재적이고 분개한 반문을 더 직접적으로 반영합니다. ‘밖으로 내쫓았습니다’는 ἐξέβαλον … ἔξω의 강제적 축출을 잘 살립니다.
  naturalness: 합쇼체 문체는 적절합니다. ‘태어났는데’보다 ‘태어났으면서’가 뒤따르는 경멸적 반문과 더 자연스럽게 연결됩니다. 또한 각주 표지는 해당 어구에 붙여야 독자가 무엇을 설명하는지 분명히 알 수 있습니다.
  terminology: ‘죄 가운데서’는 복수형 ἁμαρτίαις를 한국어에서 자연스럽게 처리하면서 비난의 낙인을 유지합니다. 이 표현이 개인 죄, 유전된 죄, 혹은 질병과 죄를 연결한 통념 중 어느 하나를 뜻한다고 해석하지 않습니다.
  issues:
