id: JHN.9.34
reference: John 9:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
  footnotes:
  - marker: a
    text: Or “You were born completely in sin.” The Greek is literally plural, “in sins,” preserving the force of the accusers’ insult.
    reason: lexical_alternative
  - marker: b
    text: Or “they cast him out.” This may refer to expelling him from their presence, and in context may also imply exclusion from the synagogue community.
    reason: alternative_reading
  - marker: c
    text: Or 'entirely in sins'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 그에게 대답하여 말했습니다. “네가 온통 죄 가운데서[a][c] 태어났으면서, 네가 우리를 가르치느냐?” 그리고 그를 밖으로 내쫓았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어는 직역하면 “죄들 안에서”입니다. 복수형은 그들의 모욕적인 비난의 어조를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그를 내쫓았습니다.” 이는 그들 앞에서 쫓아냈다는 뜻일 수 있으며, 문맥상 회당 공동체에서 배제했다는 뜻을 암시할 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 “온전히 죄 가운데서.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  english_pob_choice: They answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 말했습니다
  lexicon: SBLGNT
  rationale: 헬라어의 이중 동사 표현을 살리되 한국어에서는 자연스럽게 압축했습니다. 단순히 ‘말했습니다’로만 하면 서술의 격앙된 응답감을 약화시킬 수 있습니다.
- source_word: Ἐν ἁμαρτίαις
  english_pob_choice: in sins
  chosen_korean: 죄 가운데서
  alternatives_korean:
  - 죄들 가운데서
  - 죄 안에서
  lexicon: BDAG
  rationale: 복수형 ‘죄들’의 직설성을 한국어에서 그대로 옮기면 다소 어색하므로, 본문의 모욕적 의미를 살리면서도 자연스러운 ‘죄 가운데서’로 옮겼습니다. 이는 죄의 상태를 낙인찍는 표현입니다.
- source_word: ἐγεννήθης ὅλος
  english_pob_choice: were born entirely
  chosen_korean: 온통 … 태어났는데
  alternatives_korean:
  - 완전히 … 태어났는데
  - 온전히 … 태어났는데
  - 전적으로 … 태어났는데
  lexicon: BDAG
  rationale: ὅλος의 강조를 ‘온통’으로 옮겨 출생 전체가 죄로 규정된다는 모욕의 강도를 살렸습니다. 한국어에서 ‘온통’은 비난조의 전면적 규정을 잘 드러냅니다.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  english_pob_choice: they cast him out
  chosen_korean: 그를 밖으로 내쫓았습니다
  alternatives_korean:
  - 그를 쫓아냈습니다
  - 그를 내보냈습니다
  - 그를 밖으로 쫓아냈습니다
  lexicon: BDAG
  rationale: ‘cast him out’의 강제적 추방 뉘앙스를 한국어에서 분명하게 드러내기 위해 ‘내쫓았습니다’를 택했습니다. 이는 단순 퇴장보다 배제·추방의 폭력을 더 잘 반영합니다.
theological_decisions:
- issue: ‘죄 가운데서 태어났다’는 모욕의 신학적 함의
  chosen_reading: 본문의 조롱을 그대로 유지하고, 그 말이 그의 개인적 죄인지, 부모의 죄를 암시하는지, 혹은 병과 죄를 연결하는 통념인지 단정하지 않았습니다.
  alternative_readings:
  - 죄로 태어났느냐
  - 죄인으로 태어났느냐
  - 네 부모의 죄 아래 태어났느냐
  rationale: 헬라어는 공격적인 발화를 기록하지만 그 신학적 전제를 해명하지 않습니다. 번역도 그 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
