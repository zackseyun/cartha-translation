    issue: 현재형 ‘διδάσκεις’가 ‘가르치려 하느냐’로 번역됨
    rationale: ‘가르치려 하다’는 시도 또는 의도를 보태지만, 원문은 ‘네가 우리를 가르치느냐?’라는 현재형의 모욕적 반문입니다.
  - severity: medium
    issue: 각주 표지 [a][b][c]가 모두 문장 끝의 축출 표현 뒤에 배치됨
    rationale: '[a]와 [c]는 ‘죄 가운데서/온통’에 관한 각주인데, 현재 위치에서는 ‘밖으로 내쫓았습니다’를 설명하는 것처럼 보입니다. [b]만 축출 동사에 붙이는 것이 명확합니다.'
  - severity: low
    issue: 각주 b의 대안 문구가 본문과 동일함
    rationale: 본문이 이미 ‘그를 밖으로 내쫓았습니다’이므로 같은 문구를 ‘또는’으로 제시할 수 없습니다. ‘그를 내쫓았습니다’로 정리하고 문맥적 가능성을 설명합니다.
