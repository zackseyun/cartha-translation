  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
  footnotes:
  - marker: a
    text: Or 'passing by'; the Greek participle portrays Jesus in the act of going along when he saw the man.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 지나가시다가, 태어날 때부터 눈먼 사람을 보셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지나가시다가’는 진행 중 동작을 살린 번역이며, 헬라어 분사는 예수께서 길을 가시는 중에 그 사람을 보셨음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리고는
  lexicon: SBLGNT
  rationale: 문맥 연결을 자연스럽게 살리면서도 앞 절과의 서술 흐름을 유지하는 가장 단순한 접속으로 옮겼습니다.
- source_word: παράγων
  english_pob_choice: as he was passing by
  chosen_korean: 지나가시다가
  alternatives_korean:
  - 지나가시는 중에
  - 지나가면서
  lexicon: BDAG
  rationale: 진행 중 배경 동작을 한국어 부사절로 표현해, 예수가 ‘지나가던 중’에 보게 되었다는 시간적 동시성을 살렸습니다.
- source_word: ἄνθρωπον
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 한 사람
  lexicon: BDAG
  rationale: ἄνθρωπος는 여기서 특정 개인을 가리키며 성별보다 ‘한 사람’이라는 자연스러운 한국어가 문맥상 무난합니다. 다만 본문은 남성 단수 인물로 제시됩니다.
- source_word: τυφλὸν ἐκ γενετῆς
  english_pob_choice: blind from birth
  chosen_korean: 태어날 때부터 눈먼
  alternatives_korean:
  - 출생부터 눈먼
  - 선천적으로 눈먼
  lexicon: BDAG
  rationale: ‘ἐκ γενετῆς’의 관용적 뜻을 직역에 가깝게 살리되, 현대 한국어에서 자연스럽고 간결한 ‘태어날 때부터’로 옮겼습니다.
theological_decisions:
- issue: ἄνθρωπον의 성별을 한국어에서 어떻게 처리할지
  chosen_reading: 사람
  alternative_readings:
  - 남자
  - 한 남자
  rationale: 영어 POB는 gender-accurate 원칙을 따라 ‘a man’으로 옮겼지만, 한국어에서는 이어지는 서술과 함께 특정 인물을 자연스럽게 지시하는 ‘사람’이 과도한 성별 표지를 피하면서도 본문의 인물성을 유지합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
