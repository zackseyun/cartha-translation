    issue: ‘물으며 말했습니다’의 중복 서술
    rationale: ἠρώτησαν과 λέγοντες는 한국어에서 ‘물었습니다’와 이어지는 직접 인용으로 자연스럽게 처리할 수 있습니다. 초안은 두 동사를 모두 독립적으로 살려 문장이 부자연스럽습니다.
  - severity: medium
    issue: ‘태어나게 하려고’가 과도한 목적성을 암시함
    rationale: ἵνα는 이 질문에서 제자들이 가정한 목적/결과 관계를 나타낼 수 있으나, ‘하려고’는 한국어에서 의도적 행위자를 특히 강하게 시사합니다. 더 중립적인 ‘태어나도록’으로 그 모호성을 보존하는 편이 안전합니다.
  - severity: low
    issue: ‘라삐’의 표기
    rationale: 현대 표준 한국어 성경 및 일반 용례에서는 유대교 교사 호칭 Rabbi를 보통 ‘랍비’로 적습니다.
