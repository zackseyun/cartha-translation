revisions:
- from: 제자들이 그분께 물으며 말했습니다. 「라삐, 누가 죄를 지었습니까? 이 사람입니까, 아니면 그의 부모입니까? 그가 맹인으로 태어나게 하려고 말입니다」[a]
  to: 제자들이 그분께 물었습니다. “랍비, 누가 죄를 지었습니까? 이 사람입니까, 아니면 그의 부모입니까? 그가 보지 못하는 상태로 태어나도록 말입니까?”[a]
  rationale: 직접 인용 앞의 중복된 ‘물으며 말했습니다’를 ‘물었습니다’로 고쳐 자연스럽게 했습니다. ἵνα절은 제자들이 전제한 죄와 출생 시 시각 장애 사이의 관계를 보존하되, 의도적 원인을 강하게 암시하는 ‘하려고’를 피했습니다. 각주를 해당 절에 연결하여 목적/결과로 논의되는 모호성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:23Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 주절(제자들이 그에게 물음), 호칭, 죄를 지은 주체에 대한 양자택일, 그리고 출생 시 보지 못함과 관련된 제자들의 인과적 전제를 유지해야 합니다. 초안의 ‘태어나게 하려고’는 한국어에서 누군가가 그 출생 상태를 의도적으로 만들었다는 목적성을 지나치게 강하게 암시합니다.
  naturalness: ‘물으며 말했습니다’는 원문의 분사 λέγοντες를 기계적으로 중복 반영하여 현대 한국어로 어색합니다. ‘물었습니다’ 뒤에 직접 인용을 두는 것이 자연스럽습니다. 또한 ‘맹인’보다 ‘보지 못하는 상태’가 현대의 자연스러운 표현입니다.
  terminology: Ῥαββί의 통용 한국어 음역은 ‘랍비’가 적절합니다. ἁμαρτάνω는 ‘죄를 지었습니까’로 정확합니다. ‘보지 못하는 상태로 태어나다’는 τυφλὸς γεννηθῇ를 사람을 낙인찍는 명사화 없이 충실하게 옮깁니다.
  issues:
