id: JHN.9.2
reference: John 9:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
  footnotes:
  - marker: a
    text: Or, 'so that he was born blind.' The Greek clause can express the assumed purpose/result relationship in the disciples' question.
    reason: alternative_reading
translation:
  language: ko
  text: 제자들이 그분께 물었습니다. “랍비, 누가 죄를 지었습니까? 이 사람입니까, 아니면 그의 부모입니까? 그가 보지 못하는 상태로 태어나도록 말입니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 보지 못하는 상태로 태어난 것은 말입니까?’ 이 그리스어 절은 제자들의 질문 안에서 가정된 목적 또는 결과의 관계를 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  english_pob_choice: asked
  chosen_korean: 물으며
  alternatives_korean:
  - 물었습니다
  - 질문했습니다
  lexicon: BDAG
  rationale: 제자들이 예수께 던진 직접 질문을 자연스럽게 살리면서, 뒤따르는 말하기 동사를 받는 방식으로 한국어 문장을 매끈하게 구성했습니다.
- source_word: Ῥαββί
  english_pob_choice: Rabbi
  chosen_korean: 라삐
  alternatives_korean:
  - 랍비
  - 선생님
  lexicon: BDAG
  rationale: 유대적 호칭의 역사적 색채를 살리기 위해 음역을 유지했습니다. '선생님'은 의미는 전달하지만 호칭의 문화적 질감을 약화시킵니다.
- source_word: ἥμαρτεν
  english_pob_choice: sinned
  chosen_korean: 죄를 지었습니까
  alternatives_korean:
  - 죄를 범했습니까
  - 죄지었습니까
  lexicon: BDAG
  rationale: ἁμαρτάνω의 직접적인 의미를 표준적인 현대 한국어로 옮겼습니다. '죄를 지다'는 간결하고 자연스럽습니다.
- source_word: ἵνα τυφλὸς γεννηθῇ
  english_pob_choice: that he should be born blind
  chosen_korean: 그가 맹인으로 태어나게 하려고 말입니다
  alternatives_korean:
  - 그가 맹인으로 태어나도록 말입니다
  - 그가 태어날 때부터 맹인이 되도록 말입니다
  lexicon: BDAG
  rationale: ἵνα의 인식된 목적/결과 연결을 살려, 제자들의 질문 안에 담긴 인과 추정을 드러냈습니다. '맹인'은 본문이 말하는 출생 시 상태를 분명히 전달합니다.
theological_decisions:
- issue: 제자들의 질문에 나타난 죄-출생맹인 간의 인과 가정
  chosen_reading: 본문의 발화 주체를 제자들로 유지하고, 그들이 전제한 연결만 드러내며 서술자가 그 인과를 승인하는 듯한 표현은 피했습니다.
  alternative_readings:
  - 그가 맹인으로 태어난 것은 죄 때문이라고 단정하는 번역
  - 그가 태어나기 위해 맹인이 되었다는 식의 강한 목적 해석
  rationale: 본문은 제자들의 질문을 보고할 뿐이며, 질문의 논리를 그대로 전달하되 신학적 결론으로 확정하지 않는 것이 원문과 POB의 처리에 부합합니다.
  doctrine_reference: 질문 보고와 신학적 단정의 구분
- issue: 문장 끝의 ἵνα절 처리
  chosen_reading: '''그가 맹인으로 태어나게 하려고 말입니다''로 옮겨 질문의 목적/결과 뉘앙스를 보존했습니다.'
  alternative_readings:
  - '''그가 맹인으로 태어나도록 말입니다'''
  - '''그가 맹인으로 태어난 결과입니까'''
  rationale: POB의 영어 주석이 지적하듯 ἵνα는 여기서 단순 결과보다 제자들의 추정된 목적/결과 연결을 담습니다. 한국어에서도 그 긴장을 유지하는 표현이 필요합니다.
  doctrine_reference: 의도된 인과성의 보존
