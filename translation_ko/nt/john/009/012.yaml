  edition: SBLGNT
  text: ⸂καὶ εἶπαν⸃ αὐτῷ· Ποῦ ἐστιν ἐκεῖνος; λέγει· Οὐκ οἶδα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
  footnotes:
  - marker: a
    text: Or, “Where is he?” The Greek has “that one,” a demonstrative that may be rendered more literally but less idiomatically.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말했습니다. “그 사람은 어디에 있습니까?” 그가 말했습니다. “저는 모릅니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 더 문자적으로는 ‘그 사람은 어디에 있습니까?’라고도 옮길 수 있습니다. 지시대명사 ἐκεῖνος의 거리감을 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 그리하여
  - 또
  lexicon: BDAG
  rationale: 단순한 접속으로 앞뒤 대화를 잇는 기능이어서, 해석을 덧붙이지 않는 자연스러운 연결어로 옮겼습니다.
- source_word: εἶπαν
  english_pob_choice: they said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 물었습니다
  - 대답했습니다
  lexicon: BDAG
  rationale: 헬라어 λέγω의 기본값은 ‘말하다’이므로, 질문문 내용이더라도 동사를 ‘물었습니다’로 좁히지 않고 직접화법을 유지했습니다.
- source_word: ἐκεῖνος
  english_pob_choice: that man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그분
  - 저 사람
  - 그 자
  lexicon: BDAG
  rationale: 지시대명사의 거리감은 살리되 한국어에서 가장 자연스러운 인칭 지시로 옮겼습니다. 문맥상 예수를 가리키는 멀찍한 지시 뉘앙스를 보존합니다.
- source_word: Οὐκ οἶδα
  english_pob_choice: I do not know
  chosen_korean: 저는 모릅니다
  alternatives_korean:
  - 모르겠습니다
  - 알지 못합니다
  lexicon: BDAG
  rationale: 직접적이고 간결한 부정 인식 표현을 살리면서, 한국어 대화체로도 과도하게 구어적이지 않은 합쇼체를 택했습니다.
theological_decisions:
- issue: ἐκεῖνος의 거리감과 예수 지칭 방식
  chosen_reading: ‘그 사람’으로 옮겨, 화자가 예수를 직접 호칭하지 않고 지시적으로만 언급하는 거리감을 보존했습니다.
  alternative_readings:
  - ‘그분’으로 높여 번역
  - ‘저 사람’으로 더 멀리 표현
  rationale: 본문은 중립적 서술이 아니라 지시대명사를 사용해 화자들의 거리감을 드러내므로, 과도한 존칭이나 지나친 폄하를 피하고 담화상의 거리만 반영했습니다.
  doctrine_reference: 담화 맥락과 화자 태도 보존
- issue: 역사적 현재 λέγει의 처리
  chosen_reading: ‘그가 말했습니다’로 자연스러운 한국어 서술을 우선했습니다.
  alternative_readings:
  - ‘그가 말합니다’로 역사적 현재 보존
  rationale: 한국어에서는 역사적 현재가 오히려 부자연스러울 수 있어, 본문의 생동감을 해치지 않는 범위에서 과거 서술형으로 정리했습니다.
  doctrine_reference: 서사체 자연성
