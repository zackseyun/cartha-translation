id: JHN.9.16
reference: John 9:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
  footnotes:
  - marker: a
    text: Or 'a sinner.' The Greek reads 'a sinful man,' using an adjective modifying 'man.'
    reason: lexical_alternative
  - marker: b
    text: John often uses 'signs' for Jesus' works to emphasize their revelatory meaning; alternatively, 'miraculous signs' makes that implication more explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 바리새파 사람들 중 몇몇은 이렇게 말했습니다[a]. “이 사람은 하나님에게서 온 사람이 아닙니다. 그가 안식일을 지키지 않기 때문입니다.” 그러나 다른 이들은 이렇게 말했습니다[b]. “어떻게 죄 많은 사람이 이런 표적들을 행할 수 있습니까?” 그리고 그들 사이에는 분열이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄인.’ 그리스어는 ‘죄 많은 사람’이라는 뜻의 형용사가 ‘사람’을 수식합니다.
    reason: lexical_alternative
  - marker: b
    text: 요한은 예수의 행위를 가리켜 ‘표적’이라고 자주 말하며, 이는 그 행위의 계시적 의미를 드러냅니다. 필요하면 ‘기적의 표적’으로 더 풀어 말할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές
  english_pob_choice: So some of the Pharisees were saying
  chosen_korean: 그러므로 바리새파 사람들 중 몇몇은 이렇게 말했습니다
  alternatives_korean:
  - 그래서 바리새파 사람들 중 몇몇이 말하고 있었습니다
  - 그러므로 바리새파 사람들 가운데 일부는 말했습니다
  lexicon: SBLGNT; BDAG
  rationale: ἔλεγον의 미완료상은 반복·진행되는 발화를 나타내므로 “말했습니다”보다 서술의 흐름을 살린 표현을 택했고, ἐκ τῶν Φαρισαίων τινές은 “바리새파 사람들 중 몇몇”이 가장 자연스럽습니다.
- source_word: παρὰ θεοῦ
  english_pob_choice: from God
  chosen_korean: 하나님에게서 온
  alternatives_korean:
  - 하나님에게서
  - 하나님으로부터 온
  - 하나님이 보내신
  lexicon: BDAG
  rationale: παρά + 속격은 여기서 기원/출처를 나타내므로, 파송을 덧붙이지 않고 ‘하나님에게서 온’으로 옮겨 원문의 직접성을 살렸습니다.
- source_word: τὸ σάββατον οὐ τηρεῖ
  english_pob_choice: he does not keep the Sabbath
  chosen_korean: 그가 안식일을 지키지 않기 때문입니다
  alternatives_korean:
  - 그가 안식일을 지키지 않기 때문입니다
  - 그가 안식일을 준수하지 않기 때문입니다
  - 그가 안식일을 지키지 않으므로
  lexicon: BDAG
  rationale: τηρεῖ는 안식일 준수 문맥에서 ‘지키다’가 가장 자연스럽고, ‘준수하다’는 다소 문어적이어서 덜 직접적입니다.
- source_word: τοιαῦτα σημεῖα
  english_pob_choice: such signs
  chosen_korean: 이런 표적들
  alternatives_korean:
  - 이런 표적
  - 그런 표적들
  - 이런 기적들
  lexicon: BDAG
  rationale: 요한복음의 σημεῖα는 단순한 기적이 아니라 계시적 의미를 지닌 ‘표적’이므로 그 뉘앙스를 보존했습니다. 복수성은 한국어에서 문맥상 자연스럽게 살렸습니다.
- source_word: σχίσμα ἦν ἐν αὐτοῖς
  english_pob_choice: there was a division among them
  chosen_korean: 그들 사이에는 분열이 있었습니다
  alternatives_korean:
  - 그들 사이에는 분열이 있었습니다
  - 그들 가운데 갈라짐이 있었습니다
  - 그들 사이에 분열이 생겼습니다
  lexicon: BDAG
  rationale: σχίσμα는 관계적 균열/분열을 뜻하므로, “그들 사이에는 분열”이 본문의 사회적 긴장을 가장 잘 드러냅니다.
theological_decisions:
- issue: 요한복음의 σημεῖα 번역
  chosen_reading: 표적
  alternative_readings:
  - 기적
  - 기적의 표적
  rationale: 요한은 σημεῖα를 단순한 초자연 현상보다 예수의 행위가 지닌 계시성과 의미를 가리키는 말로 쓰므로, 한국어에서도 ‘표적’이 신학적 뉘앙스를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 바리새인들의 ‘하나님에게서 온’ 진술
  chosen_reading: 하나님에게서 온 사람이 아닙니다
  alternative_readings:
  - 하나님에게서 온 자가 아닙니다
  - 하나님께 속한 사람이 아닙니다
  rationale: 원문은 예수의 출처/권위를 두고 논쟁하는 진술이므로, 파송을 단정하지 않으면서도 출처의 부정이라는 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
