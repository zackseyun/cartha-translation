  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 그러나 원문의 ἔλεγον(미완료 과거)은 두 집단의 발화를 서술하며, ‘말했습니다’도 문맥상 가능하나 초안의 각주 표지가 해당 어휘가 아닌 발화 동사 뒤에 붙어 있어 각주의 대상과 맞지 않습니다. 또한 바리새파의 통상적 한국어 명칭은 ‘바리새인들’이 더 적절합니다.
