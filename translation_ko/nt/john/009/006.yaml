translation:
  language: ko
  text: 그분이 이렇게 말씀하신 뒤, 땅에 침을 뱉어 그 침으로 진흙을 만드시고, 그 진흙을 그의 눈에 바르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사는 ‘바르다’라는 뜻이며, 다른 문맥에서는 ‘기름을 바르다’ 또는 ‘기름 부음을 하다’로도 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  english_pob_choice: After saying these things
  chosen_korean: 이렇게 말씀하신 뒤
  alternatives_korean:
  - 이런 말씀들을 하신 뒤
  - 그렇게 말씀하신 후
  lexicon: BDAG
  rationale: 아오리스트 분사와 지시대명사의 시간적 선행 관계를 한국어의 자연스러운 선행 표현으로 옮겼습니다.
- source_word: ἔπτυσεν χαμαί
  english_pob_choice: he spit on the ground
  chosen_korean: 땅에 침을 뱉어
  alternatives_korean:
  - 땅에 침을 뱉었습니다
  - 땅바닥에 침을 뱉어
  lexicon: BDAG
  rationale: χαμαί의 ‘땅/바닥에’라는 구체성을 살리면서 현대 한국어에서 자연스러운 서술로 옮겼습니다.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  english_pob_choice: made mud from the saliva
  chosen_korean: 그 침으로 진흙을 만드시고
  alternatives_korean:
  - 그 침으로 흙반죽을 만드시고
  - 그 침으로 진흙을 빚으시고
  lexicon: BDAG
  rationale: πηλός와 πτύσμα의 물질적 결합을 살리되, ‘진흙’이 가장 직접적이고 이해하기 쉬운 대응어이므로 선택했습니다.
- source_word: ἐπέχρισεν ... τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  english_pob_choice: he spread the mud on his eyes
  chosen_korean: 그 진흙을 그의 눈에 바르셨습니다
  alternatives_korean:
  - 그 진흙을 그의 눈에 펴 바르셨습니다
  - 그 진흙을 그의 눈에 문지르셨습니다
  - 그 진흙으로 그의 눈을 바르셨습니다
  lexicon: BDAG
  rationale: ἐπιχρίω의 핵심인 ‘바르다/문지르다’의 물리적 적용을 살리면서, 제의적 ‘기름붓다’의 뉘앙스는 본문이 요구하는 만큼만 드러내도록 했습니다.
theological_decisions:
- issue: ἐπέχρισεν의 잠재적 의례적·상징적 뉘앙스
  chosen_reading: 주본문은 ‘바르셨습니다’로 옮겨, 물질을 눈에 실제로 적용하는 행위를 간명하게 드러냈습니다.
  alternative_readings:
  - 그의 눈에 그 진흙을 기름부으셨습니다
  - 그의 눈에 그 진흙을 문지르셨습니다
  rationale: 본문은 치유 행위의 구체성을 말할 뿐 제의적 행위를 명시하지 않으므로, 과도한 상징화를 피하고 원문의 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 교리적 함의를 덧씌우지 말 것.'
