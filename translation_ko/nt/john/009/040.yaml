  source_fidelity: 부분 표현(ἐκ τῶν Φαρισαίων, ταῦτα, τυφλοί)은 대체로 적절합니다. 그러나 현 문장은 ‘바리새인들 가운데 몇 사람이 예수님과 함께 있던 이들이’로 주어와 관계절의 결합이 문법적으로 성립하지 않아, ‘예수님과 함께 있던’ 이들이 바리새인들임을 분명하고 자연스럽게 재구성해야 합니다. 또한 μή 의문문의 부정적 기대는 본문에서 더 분명히 드러낼 수 있습니다.
  naturalness: 현 번역의 첫 문장은 비문입니다. ‘예수님과 함께 있던 바리새인들 가운데 몇 사람’이라는 어순이 자연스럽습니다. 직접화법도 ‘설마 우리도 눈먼 자들이겠습니까?’로 하면 현대 표준어 합쇼체에서 자연스러우며 반문과 부정 기대를 잘 전달합니다.
  terminology: ‘바리새인들’, ‘예수님’, ‘눈먼 자들’은 문맥과 관례에 맞습니다. ‘눈먼 자들’은 원문의 무수식 표현을 유지하고 비유적 의미를 본문에 덧붙이지 않습니다.
