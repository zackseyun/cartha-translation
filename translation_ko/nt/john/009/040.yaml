translation:
  language: ko
  text: 예수님과 함께 있던 바리새인들 가운데 몇 사람이 이 말씀을 듣고 예수님께 말했습니다. 「설마 우리도 눈먼 자들이겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 μή로 시작하는 질문은 보통 부정 대답을 예상합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν Φαρισαίων
  english_pob_choice: Some of the Pharisees
  chosen_korean: 바리새인들 가운데 몇 사람
  alternatives_korean:
  - 바리새인들 중 일부
  - 바리새인들 가운데 일부
  lexicon: BDAG
  rationale: 부분을 나타내는 ἐκ + 속격을 한국어에서도 집단 안의 일부라는 뜻으로 자연스럽게 옮겼습니다. '몇 사람'은 문맥상 불특정한 일부를 잘 드러냅니다.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  english_pob_choice: who were with him
  chosen_korean: 예수님과 함께 있던 이들
  alternatives_korean:
  - 그와 함께 있던 이들
  - 그와 함께 있는 이들
  lexicon: BDAG
  rationale: 분사구는 지속적으로 함께 있던 사람들을 가리키므로 '있던'으로 자연스럽게 처리했습니다. 인칭대명사 αὐτοῦ는 문맥상 예수님을 분명히 드러내는 것이 한국어에서 더 명확합니다.
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 이 말
  alternatives_korean:
  - 이것들
  - 이런 말들
  lexicon: BDAG
  rationale: 복수 지시대명사는 앞선 예수님의 발화를 가리키며, 한국어에서는 그 내용을 자연스럽게 묶어 '이 말'로 옮길 수 있습니다. 과도한 구체화 없이 직전 발언을 받습니다.
- source_word: τυφλοί
  english_pob_choice: blind
  chosen_korean: 눈먼 자들
  alternatives_korean:
  - 맹인들
  - 보지 못하는 자들
  lexicon: BDAG
  rationale: 본문은 수식어 없는 형용사 'blind'를 사용하므로, 해석적 부연 없이 본래의 감각적 표현을 살렸습니다. 한국어에서는 명사화해 조롱 섞인 자기고백의 뉘앙스를 자연스럽게 전합니다.
theological_decisions:
- issue: μή로 시작하는 반응형 질문의 기대 답변
  chosen_reading: 「우리도 눈먼 자들이라는 말입니까?」
  alternative_readings:
  - 「우리도 눈먼 자들이 아닙니까?」
  - 「우리가 눈먼 자들이라는 말입니까?」
  rationale: μή가 붙은 질문은 부정 대답을 예상하는 뉘앙스를 가지므로, 한국어에서는 반문형으로 그 기대를 살렸습니다. '아닙니까'보다 '...이라는 말입니까'가 원문의 놀람과 반발을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
