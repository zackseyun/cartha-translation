id: JHN.9.17
reference: John 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
  footnotes:
  - marker: a
    text: Or, “What do you yourself say about him?” The Greek explicitly includes “you” for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or, “because he opened your eyes.”
    reason: lexical_alternative
  - marker: c
    text: Or, “He is Prophet.” The Greek may be read with a more title-like force, but the context also supports the sense “a prophet.”
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 그들은 그 눈먼 사람에게 다시 물었습니다. 「너는 그 사람에 대해 어떻게 말하겠습니까? 그가 당신의 눈을 뜨게 했으니 말입니다.」 그러자 그는 「그분은 한 예언자이십니다」라고 말했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「그 사람에 대해 당신 자신은 어떻게 말하겠습니까?」. 그리스어는 강조를 위해 ‘너/당신’을 분명히 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「그가 당신의 눈을 뜨게 했기 때문입니다」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「그는 예언자입니다」. 그리스어는 더 칭호처럼 읽을 수도 있지만, 문맥상 「한 예언자」라는 뜻도 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν οὖν ... πάλιν
  english_pob_choice: So they said again
  chosen_korean: 그래서 그들은 … 다시 물었습니다
  alternatives_korean:
  - 그러므로 그들은 … 다시 말했습니다
  - 그리하여 그들은 … 또 물었습니다
  lexicon: SBLGNT; narrative discourse
  rationale: οὖν의 이어짐과 πάλιν의 반복성을 살리되, 한국어에서는 ‘그래서 … 다시’가 가장 자연스럽고 서술 흐름도 분명합니다.
- source_word: τῷ τυφλῷ
  english_pob_choice: to the blind man
  chosen_korean: 그 눈먼 사람에게
  alternatives_korean:
  - 그 맹인에게
  - 그 눈먼 이에게
  lexicon: SBLGNT; BDAG
  rationale: 지시 대상이 이미 서술된 인물이라는 점을 살려 ‘그 눈먼 사람’으로 옮겼고, 교회적 상투어인 ‘맹인’보다 현대 한국어에서 직접적입니다.
- source_word: Τί σὺ λέγεις περὶ αὐτοῦ
  english_pob_choice: What do you say about him
  chosen_korean: 너는 그 사람에 대해 어떻게 말하겠습니까?
  alternatives_korean:
  - 당신은 그에 대해 무엇이라고 말하겠습니까?
  - 그 사람에 대해 당신은 뭐라고 하겠습니까?
  lexicon: SBLGNT; BDAG
  rationale: σὺ의 강조를 살리기 위해 주어 ‘너는/당신은’을 드러냈습니다. interrogative는 한국어에서 ‘어떻게 말하겠습니까’가 ‘무엇이라고 평가하겠습니까’보다 원문의 직접성을 잘 유지합니다.
- source_word: ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς
  english_pob_choice: since he opened your eyes
  chosen_korean: 그가 당신의 눈을 뜨게 했으니 말입니다
  alternatives_korean:
  - 그가 당신의 눈을 열어 주었으니 말입니다
  - 그가 당신의 눈을 열었기 때문입니다
  lexicon: SBLGNT; BDAG
  rationale: ὅτι의 근거 제시를 한국어의 ‘-으니 말입니다’로 자연스럽게 옮겼고, ‘눈을 뜨게 하다’는 관용적으로도 통하며 사건의 결과를 분명히 드러냅니다.
- source_word: Προφήτης ἐστίν
  english_pob_choice: He is a prophet
  chosen_korean: 그분은 한 예언자이십니다
  alternatives_korean:
  - 그분은 예언자이십니다
  - 그는 예언자입니다
  lexicon: SBLGNT; BDAG
  rationale: anarthrous Προφήτης를 정관적 칭호로 과장하지 않고 ‘한 예언자’로 옮겨, 인물에 대한 인식의 단계성을 보존했습니다.
theological_decisions:
- issue: 'Προφήτης의 위상: 칭호(Prophet)인가 일반명사(a prophet)인가'
  chosen_reading: ‘예언자’이되, 기사성 없이 ‘한 예언자’로 번역했습니다.
  alternative_readings:
  - ‘예언자’(무관사 칭호처럼)
  - ‘선지자’
  rationale: 본문은 치유받은 사람이 예수를 메시아로 완전히 고백하기보다 최소한의 평가를 내리는 장면이므로, 더 강한 칭호화는 피했습니다. ‘예언자’는 현대 한국어 독자에게도 예언/발화의 의미를 직접 전달합니다.
  doctrine_reference: 본문의 점진적 계시와 인식의 긴장을 보존합니다.
