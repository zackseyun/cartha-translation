source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: ko
  text: 그러자 그들이 그들에게 물으며 말했습니다. 「이 사람이 당신들의 아들입니까? 당신들이 태어날 때부터 맹인이라고 말하는 바로 그 사람입니까? 그러면 그는 어떻게 지금 봅니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 Οὗτός ἐστιν은 형식상 평서문이지만, 여기서는 문맥상 의문으로 기능합니다.
    reason: source_note
lexical_decisions:
- source_word: ἠρώτησαν
  english_pob_choice: asked
  chosen_korean: 물으며
  alternatives_korean:
  - 물었습니다
  - 질문했습니다
  lexicon: BDAG
  rationale: 직접 질문을 도입하는 동사로서 자연스러운 서술 흐름을 살리되, 이어지는 인용문과 함께 구어체가 아니라 현대 문어체로 맞추기 위해 ‘물으며’로 옮겼습니다.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  english_pob_choice: Is this your son
  chosen_korean: 이 사람이 당신들의 아들입니까?
  alternatives_korean:
  - 이것이 당신들의 아들입니까?
  - 이 아들이 당신들의 아들입니까?
  lexicon: BDAG
  rationale: 지시대명사 Οὗτός는 사람을 가리키므로 ‘이 사람’으로 자연스럽게 풀고, 질문문으로 기능하는 문맥을 반영해 합쇼체 의문형으로 옮겼습니다.
- source_word: ὃν ὑμεῖς λέγετε
  english_pob_choice: whom you say
  chosen_korean: 당신들이 말하는
  alternatives_korean:
  - 당신들이 말한다고 하는
  - 당신들이 주장하는
  lexicon: BDAG
  rationale: λέγετε를 중립적인 ‘말하다’로 유지해 원문의 판단 유보성을 살렸고, ὑμεῖς의 강조를 살리기 위해 주어를 명시했습니다.
- source_word: τυφλὸς ἐγεννήθη
  english_pob_choice: was born blind
  chosen_korean: 태어날 때부터 맹인이라고
  alternatives_korean:
  - 날 때부터 눈먼 사람이라고
  - 맹인으로 태어났다고
  lexicon: BDAG
  rationale: 영어 POB의 ‘born blind’를 따라 선천적 상태를 분명히 드러내되, 한국어에서는 관용적으로 ‘태어날 때부터 맹인’이라고 풀어 자연성을 확보했습니다.
- source_word: πῶς οὖν βλέπει ἄρτι
  english_pob_choice: How then does he now see?
  chosen_korean: 그러면 그는 어떻게 지금 봅니까?
  alternatives_korean:
  - 그러면 그는 어떻게 이제 봅니까?
  - 그러면 어떻게 지금 시력을 얻었습니까?
  lexicon: BDAG
  rationale: οὖν의 논리적 귀결을 ‘그러면’으로, ἄρτι의 현재 대비를 ‘지금’으로 옮겨 원문의 추론 구조를 보존했습니다. ‘보다’는 원문 βλέπει의 현재 시각 상태를 자연스럽게 표현합니다.
theological_decisions:
- issue: 질문 형식과 화자 간 거리감
  chosen_reading: 직접 인용부를 합쇼체 의문문으로 처리해 공적 질문의 성격을 유지했습니다.
  alternative_readings:
  - 평서문처럼 처리
  - 더 친밀한 반말형으로 처리
  rationale: 본문은 조사 대상에 대한 공식적 추궁에 가까우므로, 현대 한국어 문어체의 공손한 질문 형식이 장면의 긴장과 사회적 거리감을 가장 잘 반영합니다.
  doctrine_reference: 내러티브 화행과 담화 톤
