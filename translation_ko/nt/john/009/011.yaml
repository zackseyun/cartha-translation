id: JHN.9.11
reference: John 9:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
  footnotes:
  - marker: a
    text: Or “made clay.” The Greek πηλός can refer to clay or mud; here “mud” is chosen for natural modern English.
    reason: lexical_alternative
  - marker: b
    text: Or “anointed my eyes.” The Greek verb can mean “spread on, smear” and is sometimes rendered more formally as “anoint.”
    reason: lexical_alternative
  - marker: c
    text: Or “I regained my sight.” In this context the verb means receiving sight after blindness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람이 대답했습니다. 「예수라고 불리는 그 사람은 진흙을 만들어 내 눈에 바르고, 내게 ‘실로암으로 가서 씻어라’ 하고 말했습니다. 그래서 내가 가서 씻었더니, 시력을 되찾았습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진흙을 만들었다’. 여기서 πηλός는 진흙이나 찰흙을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 눈에 발라 주었다’. ἐπιχρίω는 ‘바르다, 문지르다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘시력을 회복했습니다’. 이 문맥에서 ἀναβλέπω는 눈을 뜨고 보게 된 회복을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  english_pob_choice: He answered
  chosen_korean: 그 사람이 대답했습니다
  alternatives_korean:
  - 그가 대답했습니다
  - 그 사람이 응답했습니다
  lexicon: BDAG
  rationale: ἐκεῖνος의 지시성을 살려 단순한 ‘그’보다 ‘그 사람’으로 옮기되, 서술 흐름을 해치지 않도록 자연스럽게 처리했습니다.
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  english_pob_choice: The man called Jesus
  chosen_korean: 예수라고 불리는 그 사람
  alternatives_korean:
  - 예수라는 이름의 그 사람
  - 예수라고 불리는 사람
  lexicon: BDAG
  rationale: λεγόμενος는 단순한 명명 표현이므로 ‘불리는’으로 옮겼고, 화자의 제한된 인식을 반영해 호칭을 높이지 않았습니다.
- source_word: πηλὸν ἐποίησεν
  english_pob_choice: made mud
  chosen_korean: 진흙을 만들어
  alternatives_korean:
  - 흙을 만들어
  - 진흙을 빚어
  lexicon: BDAG
  rationale: πηλός의 기본 의미를 반영해 ‘진흙’으로 옮겼으며, 문맥상 물질을 만들어 붙인 행위를 자연스럽게 나타냈습니다.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  english_pob_choice: spread it on my eyes
  chosen_korean: 내 눈에 바르고
  alternatives_korean:
  - 내 눈에 문지르고
  - 내 눈에 발라
  lexicon: BDAG
  rationale: ἐπιχρίω의 물리적 의미를 살려 ‘바르다’로 옮겼고, 한국어에서도 가장 직접적인 동작 표현으로 보았습니다.
- source_word: ἀνέβλεψα
  english_pob_choice: I received my sight
  chosen_korean: 시력을 되찾았습니다
  alternatives_korean:
  - 보게 되었습니다
  - 시력을 회복했습니다
  lexicon: BDAG
  rationale: 치유 문맥의 의미를 따라 단순한 ‘보다’가 아니라 회복된 시각을 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: 예수에 대한 화자의 호칭 수준
  chosen_reading: ‘예수라고 불리는 그 사람’으로 유지해, 화자가 아직 예수를 메시아로 고백하지 않는 단계임을 드러냈습니다.
  alternative_readings:
  - ‘예수’로 단순화
  - ‘메시아 예수’로 강화
  rationale: 본문은 치유받은 사람의 제한된 이해를 보여 주므로, 뒤늦은 신앙 고백을 미리 주입하지 않도록 했습니다.
  doctrine_reference: 서사적 긴장 보존
