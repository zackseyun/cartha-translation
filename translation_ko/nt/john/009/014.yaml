    rationale: 초안은 ‘그날은 안식일이었습니다’ 뒤에 다시 ‘… 날이었습니다’라고 하여, ἐν ᾗ ἡμέρᾳ의 관계절을 어색하게 반복합니다. ‘예수께서 … 여신 날은 안식일이었습니다’가 원문의 시간적 초점을 자연스럽게 전달합니다.
  - severity: low
