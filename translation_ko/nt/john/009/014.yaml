  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: Now it was a Sabbath on the day when Jesus made the mud and opened his eyes.
  footnotes:
  - marker: a
    text: Or 'clay' for 'mud.'
    reason: lexical_alternative
  - marker: b
    text: 'Greek: ''opened his eyes,'' a concrete expression for the healing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날은 안식일이었습니다. 예수께서 진흙을 만드시고 그의 눈을 여신 날이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진흙’은 여기서 ‘흙’이나 ‘점토’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 문자적으로 ‘그의 눈을 열었다’고 말하며, 이는 치유를 가리키는 구체적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  english_pob_choice: a Sabbath
  chosen_korean: 안식일
  alternatives_korean:
  - 한 안식일
  - 그 안식일
  lexicon: BDAG
  rationale: 헬라어는 관사가 없는 서술적 용법이지만, 한국어에서는 “안식일이었습니다”로 자연스럽게 칼렌더 사건을 전달하는 것이 가장 직접적입니다. 본문 맥락상 단순한 시간 표지이므로 해설을 덧붙이지 않았습니다.
- source_word: ἐν ᾗ ἡμέρᾳ
  english_pob_choice: on the day when
  chosen_korean: 그날은 … 날이었습니다
  alternatives_korean:
  - 그 날에
  - 그 날, 곧 … 날
  lexicon: BDAG
  rationale: 전치사구+관계절의 시간 관계를 한국어에서는 “그날은 … 날이었습니다”로 풀어 자연스럽게 옮겼습니다. 직역식 “~한 날에”보다 문맥 흐름이 더 매끄럽습니다.
- source_word: πηλός
  english_pob_choice: mud
  chosen_korean: 진흙
  alternatives_korean:
  - 흙
  - 점토
  lexicon: BDAG
  rationale: 영문 POB의 ‘mud’에 대응해, 예수께서 눈에 바르신 재료를 일상적이고 구체적으로 드러내는 “진흙”을 택했습니다. “점토”는 지나치게 재료 공학적이고, “흙”은 본문의 혼합·질감을 덜 분명하게 합니다.
- source_word: ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς
  english_pob_choice: opened his eyes
  chosen_korean: 그의 눈을 여신
  alternatives_korean:
  - 그의 눈을 뜨게 하신
  - 그의 눈을 열어 주신
  lexicon: BDAG
  rationale: 직역적이면서도 한국어에서 자연한 “눈을 여신”을 사용해, 치유를 가리키는 구체적 표현을 유지했습니다. 이를 “시력을 회복시키셨다”로 바꾸면 원문의 몸-중심 표현이 약화됩니다.
theological_decisions:
- issue: 안식일 표지와 치유 행위의 긴장
  chosen_reading: 본문의 사실 진술만 유지하고, 안식일 논쟁에 대한 해설이나 평가를 덧붙이지 않았습니다.
  alternative_readings:
  - 예수께서 진흙을 만드시고 눈을 여신 날이 바로 안식일임을 더 강조하는 문장으로 재구성할 수 있음
  rationale: 이 절은 다음 절의 논쟁을 예고하는 서술이므로, 본문 자체의 긴장을 보존하는 것이 중요합니다. 번역이 논쟁을 미리 풀어버리면 서사의 힘이 약해집니다.
  doctrine_reference: 본문의 신학적 긴장을 보존하고 해석을 선행하지 않음
