  naturalness: ‘그들은 그를 모욕하고 말했습니다’는 현대 표준어 합쇼체 서술로 자연스럽고, 직접 인용문 안의 대조도 명료합니다.
  terminology: μαθητής는 양쪽 모두 ‘제자’로 일관되게 옮겼고, Μωϋσῆς는 통용 표기인 ‘모세’로 유지했습니다. λοιδορέω는 언어적 모욕을 뜻하므로 ‘모욕하다’가 적절합니다.
