id: JHN.9.28
reference: John 9:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
  footnotes:
  - marker: a
    text: Or, 'You are his disciple.' The Greek says 'that one's/that man's,' which may carry a dismissive tone here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그를 모욕하고 말했습니다. 「당신은 저 사람의 제자이지만, 우리는 모세의 제자입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ἐκείνου는 중립적인 ‘그의’보다 거리감을 나타내는 ‘저 사람의’로 옮길 수 있으며, 여기서는 경멸적인 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  english_pob_choice: They reviled
  chosen_korean: 모욕하며
  alternatives_korean:
  - 욕하며
  - 비방하며
  lexicon: BDAG
  rationale: λοιδορέω는 단순한 언짢음보다 공개적으로 업신여기고 헐뜯는 언어를 가리키므로, 한국어에서는 ‘모욕하다’가 강도와 공개적 경멸을 가장 잘 살립니다.
- source_word: Σὺ ... μαθητὴς εἶ
  english_pob_choice: You are ... disciple
  chosen_korean: 당신은 ... 제자입니다
  alternatives_korean:
  - 너는 ... 제자입니다
  - 당신은 ... 학생입니다
  lexicon: BDAG
  rationale: 문맥상 정면 비난의 발화이지만 표준어 합쇼체 본문에서는 ‘당신’이 가장 자연스럽고, μαθητής는 요한복음의 일관된 대응어인 ‘제자’로 옮기는 것이 적절합니다.
- source_word: ἐκείνου
  english_pob_choice: that man's
  chosen_korean: 그 사람의
  alternatives_korean:
  - 그분의
  - 그의
  - 저 사람의
  lexicon: BDAG
  rationale: 지시대명사 ἐκείνου는 여기서 예수를 거리 두며 낮춰 부르는 뉘앙스를 띠므로, 중립적 ‘그의’보다 ‘그 사람의’가 경멸적 거리감을 더 잘 드러냅니다.
- source_word: τοῦ Μωϋσέως ἐσμὲν μαθηταί
  english_pob_choice: we are disciples of Moses
  chosen_korean: 우리는 모세의 제자입니다
  alternatives_korean:
  - 우리는 모세의 추종자입니다
  - 우리는 모세를 따르는 제자입니다
  lexicon: BDAG
  rationale: ‘모세의 제자’는 원문의 소속 관계와 대조 구조를 가장 सीधे하게 살리고, μαθηταί의 반복을 본문과 같이 유지합니다.
theological_decisions:
- issue: 예수를 가리키는 ἐκείνου의 뉘앙스
  chosen_reading: ‘그 사람의’로 옮겨 화자들의 경멸적 거리 두기를 본문 수준에서 드러냈습니다.
  alternative_readings:
  - 중립적으로 ‘그의’로 옮길 수 있습니다.
  - ‘저 사람의’로 더 강하게 낮출 수도 있습니다.
  rationale: 이 절은 예수를 모세와 대조하며 그를 모욕하는 장면이므로, 한국어도 감정적 함의를 과장하지 않으면서도 무례한 거리감을 반영하는 것이 적절합니다.
  doctrine_reference: 번역 원칙 §1, §6
