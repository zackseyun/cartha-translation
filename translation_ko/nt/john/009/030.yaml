id: JHN.9.30
reference: John 9:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
  footnotes:
  - marker: a
    text: Or “This is the astonishing thing.”
    reason: lexical_alternative
  - marker: b
    text: Or “where he comes from.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사람이 대답하여 그들에게 말했습니다. 「이것이 참으로 놀라운 일입니다. 여러분은 그가 어디에서 왔는지 알지 못하면서도, 그는 내 눈을 열어 주었습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘놀라운’은 ‘경이로운’ 또는 ‘신기한’의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어디에서 왔는지’는 ‘어디 출신인지’ 또는 ‘어디서 왔는지’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος
  english_pob_choice: The man answered
  chosen_korean: 그 사람이 대답하여
  alternatives_korean:
  - 그 남자가 대답하여
  - 그 사람이 응답하여
  lexicon: BDAG
  rationale: ἀπεκρίθη는 대화 응답의 표준 동사이므로 ‘대답하여’로 자연스럽게 옮겼고, ὁ ἄνθρωπος는 문맥상 맹인이었던 그 사람을 가리켜 ‘그 사람’이 가장 담백합니다.
- source_word: εἶπεν αὐτοῖς
  english_pob_choice: said to them
  chosen_korean: 그들에게 말했습니다
  alternatives_korean:
  - 그들에게 말하였습니다
  - 그들에게 이르렀습니다
  lexicon: BDAG
  rationale: λέγω의 평이한 서술로서 과도한 힘을 더하지 않기 위해 ‘말했습니다’를 택했습니다.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  english_pob_choice: This is the remarkable thing
  chosen_korean: 이것이 참으로 놀라운 일입니다
  alternatives_korean:
  - 이것이 참으로 경이로운 일입니다
  - 이것이 놀라운 점입니다
  lexicon: BDAG
  rationale: Ἐν τούτῳ는 앞뒤 담화에서 지시하는 내용 전체를 가리키므로 ‘이것이’로 풀었고, θαυμαστόν은 ‘놀라운/경이로운’의 범위에서 문맥상 반어적 뉘앙스를 살려 ‘놀라운 일’로 옮겼습니다.
- source_word: ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν
  english_pob_choice: you do not know where he is from
  chosen_korean: 여러분은 그가 어디에서 왔는지 알지 못하면서도
  alternatives_korean:
  - 여러분은 그가 어디에서 왔는지 알지 못하고도
  - 여러분은 그가 어디 출신인지도 모르면서도
  lexicon: BDAG
  rationale: ὑμεῖς의 강조를 살려 ‘여러분은’으로 시작했고, πόθεν ἐστίν은 인물의 출처/기원을 묻는 말이므로 한국어에서는 ‘어디에서 왔는지’가 가장 자연스럽습니다.
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  english_pob_choice: and yet he opened my eyes
  chosen_korean: 그는 내 눈을 열어 주었습니다
  alternatives_korean:
  - 그리고 그는 내 눈을 열었습니다
  - 그런데도 그는 내 눈을 열어 주었습니다
  lexicon: BDAG
  rationale: ἤνοιξέν μου τοὺς ὀφθαλμούς는 문자적 치유 표현이므로 ‘내 눈을 열어 주었습니다’로 보존했고, 문맥상 역접은 앞의 ‘알지 못하면서도’가 이미 드러내므로 굳이 추가 접속어를 넣지 않았습니다.
theological_decisions:
- issue: 요한복음의 ‘눈을 열다’ 표현의 상징성 처리
  chosen_reading: 문맥의 직접 의미인 육체적 치유 표현을 유지하고, 영적 깨달음의 함의는 본문이 스스로 드러내도록 두었습니다.
  alternative_readings:
  - 영적 계몽을 전면에 내세우는 번역
  - 상징성을 살려 의역하는 번역
  rationale: 본문의 즉각적 참조는 실제 치유이며, 요한복음의 시각/맹목 모티프는 번역이 아니라 서술 전체가 드러내는 신학적 긴장으로 남겨 두는 것이 더 충실합니다.
  doctrine_reference: 본문의 직접 의미를 보존하고 신학적 함의를 과잉해석하지 않음
