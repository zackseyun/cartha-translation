id: JHN.9.5
reference: John 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅταν ἐν τῷ κόσμῳ ὦ, φῶς εἰμι τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: ko
  text: 내가 세상에 있는 동안에는 나는 세상의 빛입니다.
  philosophy: formal
lexical_decisions:
- source_word: ὅταν ... ὦ
  english_pob_choice: While I am in the world
  chosen_korean: 내가 세상에 있는 동안에는
  alternatives_korean:
  - 내가 세상에 있을 때마다
  - 내가 세상에 있는 때에는
  - 내가 세상에 있는 한
  lexicon: ὅταν + 접속법 ὦ
  rationale: ὅταν은 통상 ‘~할 때마다/~할 때’의 반복·조건성을 가질 수 있으나, 이 구절의 영어 POB는 문맥상 단회적·상태적 의미의 ‘While’를 채택했으므로, 한국어도 존재 상태를 나타내는 ‘있는 동안에는’으로 옮겨 과도한 반복 의미를 피했습니다.
- source_word: ἐν τῷ κόσμῳ
  english_pob_choice: in the world
  chosen_korean: 세상에
  alternatives_korean:
  - 세상 안에
  - 이 세상에
  - 세상 가운데
  lexicon: κόσμος
  rationale: κόσμος는 요한복음에서 단순한 물리적 ‘세계’보다 하나님을 대적하는 인간 세계 전체를 뜻하는 경우가 많아, 자연스러운 요한 문맥을 살려 ‘세상’으로 번역했습니다.
- source_word: φῶς
  english_pob_choice: the light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 등불
  lexicon: φῶς
  rationale: φῶς의 기본 의미를 직접 반영해 ‘빛’으로 옮겼고, 요한복음의 자기계시 표현으로서 상징성을 그대로 살렸습니다.
- source_word: τοῦ κόσμου
  english_pob_choice: of the world
  chosen_korean: 세상의
  alternatives_korean:
  - 세상에 속한
  - 세상을 위한
  - 온 세상의
  lexicon: κόσμος
  rationale: 소유격 관계를 가장 자연스럽게 살려 ‘세상의 빛’으로 옮겼으며, 원문의 간결한 진술 구조를 유지했습니다.
theological_decisions:
- issue: κόσμος의 신학적 뉘앙스
  chosen_reading: ‘세상’은 단순한 공간이 아니라 하나님과 대립하는 인간 세계를 포함하는 요한복음의 핵심 용어로 유지했습니다.
  alternative_readings:
  - ‘세계’로 일반화
  - ‘인류’로 의미를 좁힘
  rationale: 이 절은 예수님의 정체성을 선언하는 문장으로, 요한복음의 κόσμος 용례를 평준화하지 않고 본문의 신학적 긴장을 보존하는 편이 적절합니다.
  doctrine_reference: 요한복음의 κόσμος 용례 및 기독론적 자기계시
