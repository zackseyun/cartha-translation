  text: εἶπον ⸂οὖν αὐτῷ⸃· Τί ἐποίησέν σοι; πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: ko
  text: 그러자 그들이 그에게 말했습니다. “그가 너에게 무엇을 했느냐? 어떻게 네 눈을 뜨게 했느냐?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  english_pob_choice: they said
  chosen_korean: 그들이 … 말했습니다
  alternatives_korean:
  - 그들이 … 물었습니다
  - 그들이 … 말해 주었습니다
  lexicon: SBLGNT; BDAG
  rationale: 직접 화법을 여는 동사로서는 일반적인 ‘말하다’가 가장 자연스럽고, 문맥상 질문이 이어지지만 그리스어 동사 자체는 ‘묻다’보다 넓은 의미이므로 이를 유지했습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러자
  alternatives_korean:
  - 그래서
  - 그러므로
  lexicon: BDAG
  rationale: 앞선 논쟁의 흐름을 이어 주는 담화 표지로서, 현대 한국어에서는 대화 연결에 자연스러운 ‘그러자’가 적절합니다.
- source_word: ἐποίησέν σοι
  english_pob_choice: did he do to you
  chosen_korean: 너에게 무엇을 했느냐
  alternatives_korean:
  - 너에게 무슨 일을 했느냐
  - 너에게 무엇을 하였느냐
  lexicon: BDAG
  rationale: ποιέω의 목적격적 표현을 한국어로는 ‘무엇을 했다’가 가장 직역에 가깝고, hostile한 조사 맥락도 잘 드러냅니다.
- source_word: ἤνοιξέν σου τοὺς ὀφθαλμούς
  english_pob_choice: did he open your eyes
  chosen_korean: 네 눈을 뜨게 했느냐
  alternatives_korean:
  - 네 눈을 열었느냐
  - 네 눈을 열어 주었느냐
  lexicon: BDAG
  rationale: ‘눈을 열다’의 직역도 가능하지만, 한국어 관용과 본문의 치유 의미를 함께 살리기 위해 ‘눈을 뜨게 하다’로 옮겼습니다.
