id: JHN.9.31
reference: John 9:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
  footnotes:
  - marker: a
    text: Or, “a worshiper of God.”
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 하나님께서 죄인들의 말은 들으시지 않는다는 것을 압니다. 그러나 누구든지 하나님을 경외하고[a] 그의 뜻을 행하면, 하나님께서는 그런 사람의 말을 들으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님을 예배하는 사람.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  english_pob_choice: We know
  chosen_korean: 우리는 …을 압니다
  alternatives_korean:
  - 우리는 …을 알고 있습니다
  - 우리는 …을 압니다
  lexicon: BDAG
  rationale: οἶδα의 현재적 확정 인식을 자연스러운 한국어로 옮겨, 단순한 추측이 아니라 공동의 인식을 드러냈습니다.
- source_word: ἁμαρτωλῶν
  english_pob_choice: sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 죄 있는 사람들
  - 죄인들
  lexicon: BDAG
  rationale: 하나님이 듣지 않으시는 대상의 부류를 그대로 드러내는 간결한 표현으로, 도덕적·종교적 함의를 유지했습니다.
- source_word: θεοσεβὴς
  english_pob_choice: God-fearing
  chosen_korean: 하나님을 경외하며
  alternatives_korean:
  - 하나님을 두려워하며
  - 하나님을 예배하는
  lexicon: BDAG
  rationale: 형용사 θεοσεβής의 경외·경건의 뉘앙스를 살리기 위해 ‘경외하다’를 택했고, POB의 대안 의미인 ‘worshiper of God’는 예배행위로만 좁아질 수 있어 본문에서는 피했습니다.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  english_pob_choice: does his will
  chosen_korean: 그의 뜻을 행하면
  alternatives_korean:
  - 그의 뜻을 하면
  - 그의 뜻을 실행하면
  lexicon: BDAG
  rationale: ποιεῖν τὸ θέλημα의 관용적 구조를 한국어에서 가장 자연스럽고 직접적으로 살리는 표현으로 옮겼습니다.
- source_word: τούτου ἀκούει
  english_pob_choice: he listens to him
  chosen_korean: 그 사람은 들으십니다
  alternatives_korean:
  - 그 사람에게 귀를 기울이십니다
  - 그의 말을 들으십니다
  lexicon: BDAG
  rationale: 앞의 ἀκούει와 같은 ‘듣다’ 계열을 유지해 대조를 분명히 했고, 직접목적어를 한국어에서는 주어화하여 자연스럽게 정리했습니다.
theological_decisions:
- issue: ‘하나님께서 죄인들은 들으시지 않는다’는 진술의 범위
  chosen_reading: 본문의 진술을 그대로 유지하여, 하나님이 죄인들에게 ‘듣지 않으신다’는 말의 날카로움을 약화시키지 않았습니다.
  alternative_readings:
  - 하나님께서 죄인들의 기도는 들으시지 않는다
  - 하나님께서 죄인들을 인정하지 않으신다
  rationale: 헬라어는 단순히 ‘듣다/들으시다’의 대조를 제시하므로, 기도나 승인으로 좁혀 해석하지 않고 본문이 말하는 긴장을 보존했습니다.
  doctrine_reference: 본문의 수사적·증언적 진술을 해석으로 환원하지 않고 긴장을 보존함
