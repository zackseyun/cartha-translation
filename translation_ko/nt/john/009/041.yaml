source:
  edition: SBLGNT
  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
  footnotes:
  - marker: a
    text: Or 'you would not have guilt.' The Greek says 'sin,' which here may include the sense of culpability.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “만일 여러분이 눈멀었다면, 죄가 없었을 것입니다. 그러나 이제 여러분은 ‘우리는 봅니다’라고 말하니, 여러분의 죄가 남아 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유죄가 없었을 것입니다’. 헬라어는 ‘죄’라고 말하며, 여기서는 죄책의 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  english_pob_choice: blind
  chosen_korean: 눈멀었다면
  alternatives_korean:
  - 맹인이었다면
  - 영적으로 눈멀었다면
  lexicon: BDAG
  rationale: 직역적 의미는 ‘눈먼’이므로 기본어를 살리되, 한국어에서는 상태 표현인 ‘눈멀다’가 자연스럽고 본문의 비유적 의미도 문맥이 드러내게 합니다.
- source_word: ἁμαρτίαν
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 유죄
  - 허물
  lexicon: BDAG
  rationale: ἁμαρτία의 직접 대응어는 ‘죄’이며, 본문이 의도적으로 남기는 신학적 긴장을 해치지 않기 위해 POB처럼 ‘유죄’로 풀지 않았습니다.
- source_word: λέγετε ὅτι Βλέπομεν
  english_pob_choice: you say, ‘We see,’
  chosen_korean: ‘우리는 봅니다’라고 말하니
  alternatives_korean:
  - ‘우리가 본다’고 말하니
  - ‘우리는 보인다’라고 말하니
  lexicon: BDAG
  rationale: 2인칭 복수의 발화와 1인칭 복수 직접화법을 살려, 예수의 반어적 인용 구조를 한국어에서도 분명히 드러냈습니다.
- source_word: μένει
  english_pob_choice: remains
  chosen_korean: 그대로 남아 있습니다
  alternatives_korean:
  - 남아 있습니다
  - 머물러 있습니다
  lexicon: BDAG
  rationale: 요한복음에서 반복되는 ‘remain/abide’의 지속성을 살리되, 한국어에서는 ‘그대로 남아 있습니다’가 가장 자연스럽고 상태의 지속을 잘 전달합니다.
theological_decisions:
- issue: ‘blind’와 ‘sin’을 본문에서 해석적으로 풀어 쓸지 여부
  chosen_reading: 본문에는 ‘눈멀었다’와 ‘죄’라는 직역을 유지하고, ‘영적으로’나 ‘유죄’ 같은 해석어는 넣지 않았습니다.
  alternative_readings:
  - ‘영적으로 눈멀었다면, 죄책이 없었을 것입니다’
  - ‘맹인이었다면, 유죄가 없었을 것입니다’
  rationale: 본문은 9장 전체의 문맥상 영적 무지를 암시하지만, 예수의 표현 자체는 물리적 실명 은유를 그대로 사용합니다. 이를 해석어로 좁히면 비유의 긴장과 요한의 수사성이 약해집니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
