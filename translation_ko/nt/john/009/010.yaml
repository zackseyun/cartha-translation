review_pass:
  verdict: revise
  source_fidelity: The draft contains a structural typo ('그가에게') that obscures αὐτῷ ('to him'). Its treatment of the aorist passive as '뜨이게 되었느냐' broadly conveys an externally effected result, but the non-honorific question ending does not meet the required modern formal-polite 합쇼체 register. The imperfect ἔλεγον can naturally be rendered by '물었습니다' in Korean dialogue; adding '계속' would make the iterative nuance explicit but is not necessary.
  naturalness: '''그가에게'' is ungrammatical. ''네 눈이 … 되었느냐?'' is a mixed and non-formal register, whereas ''당신의 눈이 어떻게 뜨게 되었습니까?'' is grammatically natural in a formal direct question. ''그들은 그에게 물었습니다'' is more idiomatic Korean than using ''말했습니다'' to introduce a question.'
  terminology: '''눈이 뜨다'' is the established natural Korean expression for restored sight and appropriately reflects the passive/resultative sense here. The footnote should identify the Greek passive without implying that the Korean idiom is a word-for-word form.'
  issues:
  - severity: high
    issue: The phrase '그가에게' is ungrammatical and mistranslates the indirect-object expression.
    rationale: αὐτῷ means 'to him'; Korean requires '그에게.'
  - severity: medium
    issue: The direct question uses the non-honorific ending '-느냐?', contrary to the specified modern formal-polite 합쇼체.
    rationale: The target register requires a polite formal interrogative such as '-습니까?'.
  - severity: low
    issue: The translation introduces the question with '말했습니다,' which is less natural than '물었습니다.'
    rationale: Since the direct speech is a question, '물었습니다' is idiomatic Korean and retains the speech act without changing meaning.
  revised_text: 그러자 그들은 그에게 물었습니다. 「당신의 눈이 어떻게 뜨게 되었습니까?」[a]
  revised_footnotes:
  - marker: a
    text: 직역하면 “당신의 눈이 어떻게 열리게 되었습니까?”이며, 그리스어 동사는 수동형입니다.
    reason: lexical_alternative
  revision_rationale: Corrected the malformed indirect object, brought the question into the required 합쇼체, and used the idiomatic Korean verb '묻다' for an interrogative utterance. The Korean idiom '눈이 뜨다' retains the sense that sight came about rather than being self-produced; the note records the underlying Greek passive and the more literal 'opened' wording.
