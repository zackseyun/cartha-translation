base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
  footnotes:
  - marker: a
    text: 'Or, more literally, “I am.” Here the sense is ordinary self-identification: the man is saying that he is the one they are discussing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 이들은 「이 사람입니다」라고 말하고 있었고, 다른 이들은 「아닙니다. 그는 그와 비슷할 뿐입니다」라고 말하고 있었습니다. 그는 「제가 바로 그 사람입니다」라고 계속 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 보어를 명시하지 않고 「제가 바로 그입니다」. 그리스어는 문자적으로 「내가 있다/이다」라고만 말합니다. 여기서는 그가 군중이 논의하는 바로 그 사람임을 확인하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι ἔλεγον
  english_pob_choice: Some were saying / Others were saying
  chosen_korean: 어떤 사람들은 …라고 말했고, 다른 사람들은 …라고 말했습니다
  alternatives_korean:
  - 사람들이 말했습니다
  - 몇몇은 …라고 했고 다른 이들은 …라고 했습니다
  lexicon: BDAG
  rationale: ἄλλοι의 대조를 한국어의 「어떤 사람들은 / 다른 사람들은」으로 살려 군중의 분열된 반응을 자연스럽게 드러냈습니다.
- source_word: Οὗτός ἐστιν
  english_pob_choice: This is he
  chosen_korean: 이 사람입니다
  alternatives_korean:
  - 그 사람입니다
  - 이분입니다
  lexicon: BDAG
  rationale: 직접적인 동일시를 나타내되, 한국어에서 「이 사람입니다」가 가장 자연스럽고 과도한 존칭이나 설명을 덧붙이지 않습니다.
- source_word: ὅμοιος αὐτῷ ἐστιν
  english_pob_choice: he is like him
  chosen_korean: 그와 비슷할 뿐입니다
  alternatives_korean:
  - 그와 닮았습니다
  - 그와 같습니다
  lexicon: BDAG
  rationale: ὅμοιος는 동일이 아니라 유사성을 뜻하므로 「비슷할 뿐입니다」로 구분을 분명히 했습니다.
- source_word: Ἐγώ εἰμι
  english_pob_choice: I am he
  chosen_korean: 내가 바로 그 사람입니다
  alternatives_korean:
  - 내가 그입니다
  - 나는 나입니다
  lexicon: BDAG
  rationale: 이 문맥에서는 신학적 절대구보다 신원 확인이 핵심이므로, 한국어에서 생략된 술어를 보충해 의미를 분명히 했습니다.
theological_decisions:
- issue: Ἐγώ εἰμι의 문맥상 의미
  chosen_reading: 치유받은 사람이 자신이 바로 그 사람이라고 신원 확인하는 말로 옮겼습니다.
  alternative_readings:
  - 출애굽기적/요한복음적 절대적 자기계시로 여지를 남기는 번역
  - 단순히 「내가 있다」로 직역
  rationale: 이 장면의 쟁점은 메시아 선언이 아니라 눈먼 사람의 동일성 확인이므로, 본문이 요구하는 범위 안에서만 의미를 반영했습니다.
  doctrine_reference: 문맥 우선 원칙; 요한의 고양된 표현은 필요 이상으로 확대하지 않음
