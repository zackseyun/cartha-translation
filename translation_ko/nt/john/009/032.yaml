lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  english_pob_choice: From of old
  chosen_korean: 태초부터는
  alternatives_korean:
  - 오래전부터는
  - 옛날부터는
  - 세상 처음부터는
  lexicon: BDAG
  rationale: 역사적 관용구로서 “오래전부터/옛날부터”의 뜻을 살리되, “태초부터”는 과도한 ‘영원부터’의 형이상학적 뉘앙스를 피하면서도 오랜 기간의 부정을 자연스럽게 드러냅니다.
- source_word: οὐκ ἠκούσθη
  english_pob_choice: it has never been heard
  chosen_korean: 누구도 … 말을 들어 본 적이 없습니다
  alternatives_korean:
  - 들린 적이 없습니다
  - 들은 적이 없습니다
  - 그런 말을 들어 본 적이 없습니다
  lexicon: BDAG
  rationale: 수동형의 관용적 의미를 한국어의 자연스러운 경험 부정 표현으로 옮기되, ‘들어 본 적이 없습니다’로 precedent의 부재를 분명히 했습니다.
- source_word: ἠνέῳξέν τις ὀφθαλμοὺς
  english_pob_choice: anyone opened the eyes
  chosen_korean: 누가 뜨게 했다는
  alternatives_korean:
  - 누가 열었다는
  - 누군가 눈을 열었다는
  - 누가 눈을 뜨게 했다는
  lexicon: BDAG
  rationale: ‘눈을 뜨게 하다’가 한국어 관용으로 가장 자연스럽고, ἀνοίγω + 눈의 결합이 가리키는 기적적 행위를 그대로 드러냅니다.
- source_word: τυφλοῦ γεγεννημένου
  english_pob_choice: one born blind
  chosen_korean: 날 때부터 눈먼 사람의
  alternatives_korean:
  - 선천적으로 눈먼 사람의
  - 태어날 때부터 눈먼 사람의
  - 눈먼 채 태어난 사람의
  lexicon: BDAG
  rationale: γεννημένου는 출생 상태를 나타내므로 ‘날 때부터’로 옮겼고, POB의 최신 검토처럼 ‘사람/한 사람’을 보조하여 원문의 일반 진술을 자연스럽게 반영했습니다.
theological_decisions:
- issue: ἐκ τοῦ αἰῶνος의 범위
  chosen_reading: 인류가 기억하는 역사 전체에 걸친 관용적 부정으로 읽었습니다.
  alternative_readings:
  - 영원부터
  - 세상 창조 이래
  rationale: 이 구절은 형이상학적 ‘영원’ 선언이 아니라, 지금까지 알려진 예가 없다는 증언입니다. 그래서 과도한 신학적 확대 없이 논증의 수사적 힘을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
