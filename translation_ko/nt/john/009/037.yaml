  naturalness: ‘당신과 함께 말하고 있는’도 이해되지만, 한국어에서는 상호 대화의 뜻이 이미 포함된 ‘당신과 말하고 있는’이 더 자연스럽습니다. 인용문 끝에만 붙은 각주 표지는 해당 어구에 직접 붙이는 편이 독자에게 더 명확합니다.
