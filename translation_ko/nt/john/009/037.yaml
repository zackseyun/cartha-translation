  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
  footnotes:
  - marker: a
    text: Or, 'the one speaking to you is he.' The Greek more literally says 'speaking with you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. "당신은 그를 보았습니다. 당신과 함께 말하고 있는 이 사람이 바로 그입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신에게 말하고 있는 이 사람이 바로 그입니다.’ 그리스어는 문자적으로 ‘당신과 함께 말하고 있는’이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  english_pob_choice: Jesus said to him
  chosen_korean: 예수께서 그에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그에게 말씀하셨습니다
  - 예수께서 그에게 말하셨습니다
  lexicon: BDAG
  rationale: ἀὐτῷ는 수신자 표시이므로 ‘그에게’가 자연스럽고, εἶπεν은 대화문에서 단순 ‘말씀하셨습니다’로 옮겨 서술의 흐름과 존대를 모두 살렸습니다.
- source_word: ἑώρακας
  english_pob_choice: You have seen
  chosen_korean: 당신은 그를 보았습니다
  alternatives_korean:
  - 당신은 그를 보셨습니다
  - 당신은 그를 보았습니다
  lexicon: BDAG
  rationale: 완료형은 과거의 행위가 현재적 결과를 지니는 뉘앙스를 가지므로, 한국어에서는 ‘보았습니다’로 옮겨 확인된 인식의 현재성을 드러냈습니다.
- source_word: ὁ λαλῶν μετὰ σοῦ
  english_pob_choice: the one speaking with you
  chosen_korean: 당신과 함께 말하고 있는 이 사람
  alternatives_korean:
  - 당신과 말하고 있는 이 사람
  - 당신에게 말하고 있는 이 사람
  lexicon: BDAG
  rationale: μετά + 속격의 기본 의미인 ‘함께’를 살려 ‘당신과 함께 말하고 있는’으로 옮겼고, συμμετρ적 자기지시를 위해 ‘이 사람’을 덧붙였습니다.
- source_word: ἐκεῖνός ἐστιν
  english_pob_choice: is he
  chosen_korean: 바로 그입니다
  alternatives_korean:
  - 그가 바로 그입니다
  - 바로 그 사람입니다
  lexicon: BDAG
  rationale: 지시대명사 ἐκεῖνος의 식별 강조를 한국어의 ‘바로 그’로 반영했고, 문장 끝의 단정은 ‘입니다’로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 이 절의 자기계시를 과도하게 확장하지 않는 방식
  chosen_reading: ‘당신과 함께 말하고 있는 이 사람이 바로 그입니다’로 번역해, 앞선 질문의 대상과 예수의 동일성을 드러내되 본문에 없는 호칭을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘그 사람은 인자입니다’
  - ‘당신이 보고 있는 이가 바로 그입니다’
  rationale: 그리스어는 앞절의 질문 대상을 가리키면서도 여기서 다시 칭호를 반복하지 않으므로, 번역도 계시의 힘을 유지하되 해석을 최소화해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6; Johannine revelation context
