revisions:
- from: 그가 지금 어떻게 보게 되었는지는 우리가 알지 못하고, 누가 그의 눈을 뜨게 했는지도 우리가 알지 못합니다. 그에게 물어보십시오. 그는 나이가 들었습니다. 그가 자기 자신에 대해 말할 것입니다.[a]
  to: 그러나 그가 지금 어떻게 보는지는 우리는 알지 못합니다. 또는 누가 그의 눈을 열어 주었는지도 우리는 알지 못합니다. 그에게 물어보십시오. 그는 성인입니다. 그가 직접 자신에 관해 말할 것입니다.[a]
  rationale: 현재형과 반복된 무지의 진술을 보존하고, ‘성인입니다’로 독립적 증언 능력이라는 문맥상 의미를 명확히 했습니다. 마지막 절은 미래형을 유지하면서 αὐτός의 강조를 ‘직접’으로, περὶ ἑαυτοῦ를 ‘자신에 관해’로 자연스럽게 반영했습니다. 각주는 미래형의 기능적 대안임을 정확히 밝혔습니다.
