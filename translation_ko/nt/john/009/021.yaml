id: JHN.9.21
reference: John 9:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
  footnotes:
  - marker: a
    text: Or, 'He can speak for himself.' The Greek future may function as a practical assertion of his ability or responsibility to answer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 지금 어떻게 보는지는 우리는 알지 못합니다. 또는 누가 그의 눈을 열어 주었는지도 우리는 알지 못합니다. 그에게 물어보십시오. 그는 성인입니다. 그가 직접 자신에 관해 말할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리, ‘그가 직접 말할 수 있습니다.’ 헬라어 미래형은 실제로 그가 답변할 능력이나 책임이 있음을 나타내는 표현으로 쓰일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  english_pob_choice: But how he now sees
  chosen_korean: 그가 지금 어떻게 보게 되었는지는 우리가 알지 못하고
  alternatives_korean:
  - 그가 지금 어떻게 보는지는 우리가 알지 못하고
  - 그가 지금 어떻게 볼 수 있는지는 우리가 알지 못하고
  lexicon: BDAG
  rationale: πῶς는 ‘어떻게’, νῦν은 ‘지금’, βλέπει는 현재형 ‘본다’이므로, 원문의 현재 상태에 대한 부모의 무지를 자연스러운 한국어로 옮겼습니다.
- source_word: ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  english_pob_choice: who opened his eyes
  chosen_korean: 누가 그의 눈을 뜨게 했는지도 우리가 알지 못합니다
  alternatives_korean:
  - 누가 그의 눈을 열었는지도 우리가 알지 못합니다
  - 누가 그의 눈을 뜨게 하였는지도 우리가 알지 못합니다
  lexicon: BDAG
  rationale: 직역하면 ‘눈을 열다’이지만, 한국어에서는 ‘눈을 뜨게 하다’가 자연스럽고 기적 서사의 관용도 살릴 수 있어 선택했습니다.
- source_word: αὐτὸν ἐρωτήσατε
  english_pob_choice: Ask him
  chosen_korean: 그에게 물어보십시오
  alternatives_korean:
  - 그를 물어보십시오
  - 그에게 질문하십시오
  lexicon: BDAG
  rationale: aorist 명령형의 직접성을 살리되, 한국어에서는 ‘그에게 물어보십시오’가 가장 자연스럽고 공손한 권고형이 됩니다.
- source_word: ἡλικίαν ἔχει
  english_pob_choice: he is of age
  chosen_korean: 그는 나이가 들었습니다
  alternatives_korean:
  - 그는 성인이 되었습니다
  - 그는 충분히 나이가 되었습니다
  lexicon: BDAG
  rationale: 이 표현은 단순 연령 정보가 아니라 스스로 답할 수 있는 사회적·법적 성숙을 뜻하므로, ‘나이가 들었습니다’로 옮겨 자가 진술 가능성을 드러냈습니다.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  english_pob_choice: He will speak for himself
  chosen_korean: 그가 자기 자신에 대해 말할 것입니다
  alternatives_korean:
  - 그가 직접 말할 것입니다
  - 그가 자기 일을 직접 말할 것입니다
  lexicon: BDAG
  rationale: αὐτός와 περὶ ἑαυτοῦ의 자기지시성을 살리되, 한국어 법정 맥락의 ‘for himself’보다 자연스럽게 ‘자기 자신에 대해 말할 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ἡλικίαν ἔχει의 의미
  chosen_reading: 그가 스스로 답할 수 있는 나이/성숙에 이르렀다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 나이가 많다는 의미
  - 신체적 키나 체격을 가리킨다는 의미
  rationale: 문맥이 부모의 진술 책임 회피와 심문 장면에 있으므로, 단순 연령보다 독자적으로 증언할 수 있는 성숙을 뜻하는 것으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: αὐτὸς περὶ ἑαυτοῦ λαλήσει의 기능
  chosen_reading: 아들이 자기 증언을 직접 하라는 법정적·사회적 뉘앙스로 옮겼습니다.
  alternative_readings:
  - 단순히 자신에 대해 이야기한다는 뜻
  - 미래형을 완곡한 가능성 표현으로 보는 해석
  rationale: 이 장면은 조사 절차의 맥락에 있으므로, 교리적 확장 없이 자기 변호/자기 진술의 기능을 살리는 것이 본문 의도에 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
