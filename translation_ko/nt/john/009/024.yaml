id: JHN.9.24
reference: John 9:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
  footnotes:
  - marker: a
    text: 'Or possibly an idiomatic adjuration: “Give God the glory,” that is, “Tell the truth before God” or “Confess openly before God.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들이 한때 눈이 멀었던 그 사람을 다시 불러 이르되, “하나님께 영광을 돌리시오. 우리는 이 사람이 죄인인 줄 압니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 관용적으로는 “하나님께 영광을 돌리시오”가 곧 “하나님 앞에서 진실을 말하시오” 또는 “하나님 앞에서 솔직히 고백하시오”라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν οὖν
  english_pob_choice: So they called
  chosen_korean: 그래서 그들이 ... 다시 불러
  alternatives_korean:
  - 그러므로 그들이 ... 불렀습니다
  - 그리하여 그들이 ... 소환했습니다
  lexicon: BDAG
  rationale: οὖν의 서술 전개를 ‘그래서’로 자연스럽게 살리고, φωνέω는 공식적 강제보다 단순한 ‘부르다’로 옮겨 원문의 과도한 격식을 피했습니다.
- source_word: ἐκ δευτέρου
  english_pob_choice: a second time
  chosen_korean: 다시
  alternatives_korean:
  - 두 번째로
  - 한 번 더
  lexicon: BDAG
  rationale: 관용적으로 ‘두 번째로/다시’의 뜻이므로, 한국어에서는 간결한 ‘다시’로 처리해 같은 사건이 재차 일어났음을 분명히 했습니다.
- source_word: ὃς ἦν τυφλός
  english_pob_choice: who had been blind
  chosen_korean: 한때 눈이 멀었던
  alternatives_korean:
  - 눈이 멀었던
  - 전에 눈이 멀었던
  lexicon: BDAG
  rationale: 과거에 맹인이었음을 현재와 구별해 주기 위해 완료적 뉘앙스를 살렸고, ‘한때’로 지금은 고침받은 상황을 자연스럽게 드러냈습니다.
- source_word: Δὸς δόξαν τῷ θεῷ
  english_pob_choice: Give glory to God
  chosen_korean: 하나님께 영광을 돌리시오
  alternatives_korean:
  - 하나님께 영광을 드리시오
  - 하나님께 영광을 돌리십시오
  lexicon: BDAG
  rationale: 직역인 ‘영광을 주다’보다 한국어 관용에 맞는 ‘영광을 돌리다’가 원문의 doxological 표현을 가장 직접적으로 전달합니다. 명령형은 이 장면의 강한 요구를 살려 하십시오체로 옮겼습니다.
- source_word: ἁμαρτωλός
  english_pob_choice: a sinner
  chosen_korean: 죄인인 줄 압니다
  alternatives_korean:
  - 죄인임을 압니다
  - 죄인이라고 압니다
  lexicon: BDAG
  rationale: predicative adjective의 비난을 보존하기 위해 ‘죄인’으로 옮겼고, 문맥상 판단 진술이므로 ‘줄 압니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: Δὸς δόξαν τῷ θεῷ의 관용적 강도와 직역성
  chosen_reading: 본문에는 ‘하나님께 영광을 돌리시오’로 직역에 가깝게 두되, 한국어 관용을 따라 명령의 강한 압박을 유지했습니다.
  alternative_readings:
  - ‘하나님께 영광을 드리시오’
  - ‘하나님 앞에서 진실을 말하시오’
  rationale: 이 표현은 서약적/강권적 관용구로 이해될 수 있으나, 본문 자체는 영광 돌리라는 말로 되어 있으므로 그 표면적 의미를 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
