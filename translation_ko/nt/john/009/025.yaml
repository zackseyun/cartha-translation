source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
  footnotes:
  - marker: a
    text: Or, “If he is a sinner, I do not know.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 사람이 대답했습니다. 「그가 죄인인지[a] 저는 알지 못합니다. 한 가지는 압니다. 제가 눈멀어 있었으나, 지금은 봅니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그가 죄인이라면, 저는 알지 못합니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  english_pob_choice: So that man answered
  chosen_korean: 그 사람이 대답했습니다
  alternatives_korean:
  - 그 사람이 대답하여 말했습니다
  - 그러자 그 사람이 대답했습니다
  lexicon: BDAG
  rationale: οὖν의 전개감을 한국어에서는 자연스러운 담화 연결로 처리하고, ἐκεῖνος의 지시성은 문맥상 이미 지목된 인물을 가리키므로 ‘그 사람’으로 옮겼습니다.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  english_pob_choice: Whether he is a sinner
  chosen_korean: 그가 죄인인지
  alternatives_korean:
  - 그가 죄인이라면
  - 그가 죄인인가
  lexicon: BDAG
  rationale: 이 문맥은 ‘만약’의 조건문보다 간접의문에 가깝기 때문에, ‘인지’로 옮겨 화자의 모름과 판단 유보를 살렸습니다.
- source_word: ἁμαρτωλός
  english_pob_choice: a sinner
  chosen_korean: 죄인
  alternatives_korean:
  - 죄를 지은 사람
  - 악인
  lexicon: BDAG
  rationale: 문맥상 바리새인들이 예수를 고발하는 표현을 그대로 반영하는 것이 중요하므로, 간결하고 직접적인 ‘죄인’을 택했습니다.
- source_word: τυφλὸς ὢν ἄρτι βλέπω
  english_pob_choice: though I was blind, now I see
  chosen_korean: 내가 눈멀었었지만, 지금은 봅니다
  alternatives_korean:
  - 눈먼 상태였지만, 지금은 봅니다
  - 눈멀어 있었으나, 지금은 봅니다
  lexicon: BDAG
  rationale: 형용사적 분사구는 이전 상태와 현재 상태의 대비를 나타내므로, ‘눈멀었었지만’으로 과거의 지속된 상태를 살리고 ‘지금은 봅니다’로 현재 대조를 분명히 했습니다.
theological_decisions:
- issue: 치유받은 사람이 예수의 죄 여부에 대해 단정하지 않는 태도
  chosen_reading: ‘그가 죄인인지 저는 알지 못합니다’로 옮겨, 화자의 인식 한계를 그대로 드러냈습니다.
  alternative_readings:
  - ‘그가 죄인이라면 저는 알지 못합니다’로 조건문처럼 옮길 수 있음
  - ‘그가 죄인인지 나는 알지 못하오’처럼 구어체로 약화할 수 있음
  rationale: 이 절은 예수의 죄 없음을 교리적으로 판정하는 진술이 아니라, 논쟁 중인 사람이 자신의 알지 못함을 밝히는 응답입니다. 따라서 해석을 앞서지 않고, 원문의 판단 유보를 유지했습니다.
  doctrine_reference: 판단 유보를 보존하고 화자의 인식 범위를 넘겨 교리화하지 않음
