  to: 우리는 낮인 동안 나를 보내신 분의 일을 해야 합니다. 아무도 일할 수 없는 밤이 오고 있습니다[a].
  rationale: 본문의 복수 독법(‘우리는’)과 ‘나를 보내신’이라는 단수 표현을 그대로 유지했습니다. 후반절은 밤과 그때의 불가능성을 한 문장 안에서 연결하여 원문의 시간적·관계적 구조를 더 자연스럽게 반영했습니다. 각주는 널리 알려진 단수 독법을 정확히 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:17Z'
review_pass:
  verdict: revise
  source_fidelity: SBLGNT의 ἡμᾶς δεῖ를 ‘우리는 … 해야 합니다’로, τοῦ πέμψαντός με를 ‘나를 보내신 분’으로 옮겨 복수 주어와 단수 목적어가 공존하는 본문 형태를 정확히 보존했습니다. ‘아무도 일할 수 없는’은 οὐδεὶς δύναται ἐργάζεσθαι를 자연스럽고 충실하게 반영합니다.
  naturalness: 초안의 ‘밤이 오고 있습니다. 그때는 …’도 의미는 전달하지만, ὅτε절이 ‘밤’을 수식하는 관계를 두 문장으로 나누어 다소 느슨해집니다. ‘아무도 일할 수 없는 밤이 오고 있습니다’로 연결하면 현대 표준 한국어로 더 자연스럽고 원문의 결속도 살아납니다. ‘낮인 동안에’는 ‘낮인 동안’으로 다듬는 편이 자연스럽습니다.
  terminology: ‘나를 보내신 분’, ‘일’, ‘해야 합니다’는 요한복음의 문맥과 합쇼체 문체에 적절합니다. 신학적으로 과도한 해석을 덧붙이지 않았습니다. 본문 변이 각주는 단수 독법을 정확히 제시합니다.
  issues:
  - severity: low
    issue: ὅτε 이하 시간절의 결속이 문장 분리로 약화됨
    rationale: 그리스어의 ‘밤이 오는데, 그때에는 아무도 일할 수 없다’라는 연결을 ‘아무도 일할 수 없는 밤’으로 표현하면 수식 관계가 더 직접적이고 자연스럽습니다.
  - severity: low
    issue: ‘낮인 동안에’의 조사 선택
    rationale: 문법 오류는 아니지만, 시간 범위를 나타내는 ‘동안’에는 ‘에’ 없이 쓰는 것이 이 문맥에서 더 자연스럽습니다.
  revised_text: 우리는 낮인 동안 나를 보내신 분의 일을 해야 합니다. 아무도 일할 수 없는 밤이 오고 있습니다[a].
  revised_footnotes:
