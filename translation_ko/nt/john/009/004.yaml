id: JHN.9.4
reference: John 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
  footnotes:
  - marker: a
    text: Some manuscripts read, 'I must do the works of the one who sent me.'
    reason: textual_variant
translation:
  language: ko
  text: 우리는 낮인 동안 나를 보내신 분의 일을 해야 합니다. 아무도 일할 수 없는 밤이 오고 있습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘나는 나를 보내신 분의 일을 해야 합니다’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς δεῖ
  english_pob_choice: We must
  chosen_korean: 우리는 … 해야 합니다
  alternatives_korean:
  - 나는 … 해야 합니다
  - 우리가 … 해야 합니다
  lexicon: BDAG
  rationale: SBLGNT 본문은 1인칭 복수(ἡμᾶς)와 필연 표현(δεῖ)을 따르므로, 주어를 ‘우리’로 살려 의무의 범위를 그대로 반영했습니다.
- source_word: ἐργάζεσθαι τὰ ἔργα
  english_pob_choice: do the works
  chosen_korean: … 일을 … 해야 합니다
  alternatives_korean:
  - … 일들을 … 해야 합니다
  - … 행하셔야 합니다
  lexicon: BDAG
  rationale: 동사 ἐργάζεσθαι와 목적어 τὰ ἔργα의 연결을 한국어에서 자연스럽게 풀어, ‘일하다/해야 합니다’로 옮기되 ‘일들’을 덧붙여 과도하게 중복시키지 않았습니다.
- source_word: τοῦ πέμψαντός με
  english_pob_choice: of the one who sent me
  chosen_korean: 나를 보내신 분의
  alternatives_korean:
  - 나를 보내신 이의
  - 보내신 분의
  lexicon: BDAG
  rationale: 분사구를 한국어 관계절로 풀어 ‘나를 보내신 분’으로 옮겨, 보내신 분의 인격적 주체성을 분명히 했습니다.
- source_word: ἕως ἡμέρα ἐστίν
  english_pob_choice: while it is day
  chosen_korean: 낮인 동안에
  alternatives_korean:
  - 낮일 동안에
  - 낮인 동안
  lexicon: BDAG
  rationale: 시간 여유의 한정성을 나타내는 표현이므로 ‘낮인 동안에’로 옮겨, 단순한 시점이 아니라 활동 가능한 기간이라는 뜻을 살렸습니다.
- source_word: ἔρχεται νὺξ
  english_pob_choice: night is coming
  chosen_korean: 밤이 오고 있습니다
  alternatives_korean:
  - 밤이 옵니다
  - 밤이 다가오고 있습니다
  lexicon: BDAG
  rationale: 현재형의 임박한 미래 뉘앙스를 살려 진행형으로 옮겼습니다.
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  english_pob_choice: when no one can work
  chosen_korean: 그때는 아무도 일할 수 없습니다
  alternatives_korean:
  - 아무도 일할 수 없을 때입니다
  - 그때 아무도 일하지 못합니다
  lexicon: BDAG
  rationale: ὅτε 이하의 절을 한국어에서 명료하게 시간 종속절로 풀어, 보편적 불가능성을 ‘아무도 일할 수 없습니다’로 간결하게 옮겼습니다.
theological_decisions:
- issue: 본문 초기의 1인칭 복수(‘우리’)와 뒤이은 1인칭 단수(‘나’)의 긴장
  chosen_reading: 본문대로 ‘우리는 … 나를 보내신 분의 일’을 유지했습니다.
  alternative_readings:
  - 문맥을 따라 ‘나는 …’로 단수화하기
  rationale: SBLGNT의 복수 읽기를 우선하고, 같은 절 안의 단수 표현을 그대로 두어 본문에 남아 있는 긴장을 지웠지 않았습니다.
  doctrine_reference: 원문 우선 원칙 및 본문 변이 보존 원칙
