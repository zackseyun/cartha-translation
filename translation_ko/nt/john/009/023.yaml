  text: διὰ τοῦτο οἱ γονεῖς αὐτοῦ εἶπαν ὅτι Ἡλικίαν ἔχει, αὐτὸν ⸀ἐπερωτήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
  footnotes:
  - marker: a
    text: Or “He is old enough; question him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이 때문에 그의 부모는 “그는 이미 나이가 찼으니, 그에게 물어보십시오”라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 이미 나이가 찼으니; 그에게 질문하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: For this reason
  chosen_korean: 이 때문에
  alternatives_korean:
  - 그러므로
  - 이런 까닭에
  lexicon: BDAG
  rationale: 앞선 22절의 설명을 받는 인과 관계를 자연스러운 현대 한국어로 분명하게 나타냈습니다.
- source_word: γονεῖς
  english_pob_choice: parents
  chosen_korean: 부모
  alternatives_korean:
  - 아버지와 어머니
  - 양친
  lexicon: BDAG
  rationale: 복수 명사를 집합적으로 가리키므로 한국어에서는 가장 자연스러운 ‘부모’로 옮겼습니다.
- source_word: Ἡλικίαν ἔχει
  english_pob_choice: He is of age
  chosen_korean: 이미 나이가 찼으니
  alternatives_korean:
  - 이미 성인이니
  - 스스로 대답할 나이이니
  - 나이가 충분하니
  lexicon: BDAG
  rationale: 직역적 ‘나이를 가지고 있다’보다, 문맥상 ‘스스로 답할 수 있을 만큼 나이가 되었다’는 사회적·법적 뉘앙스를 살렸습니다.
- source_word: ἐπερωτήσατε
  english_pob_choice: ask
  chosen_korean: 물어보십시오
  alternatives_korean:
  - 질문하십시오
  - 그에게 물으십시오
  lexicon: BDAG
  rationale: 명령형의 직접적 요청을 살리되, 한국어에서는 ‘묻다/물어보다’가 가장 자연스럽고 공손한 표현입니다.
theological_decisions:
- issue: 화자 인용문 안에서의 공손체 유지
  chosen_reading: 부모의 발언은 인용문 안에서도 공손한 명령형 ‘물어보십시오’로 옮겼습니다.
  alternative_readings:
  - ‘그에게 물어보라’로 낮추는 번역
  - ‘그에게 질문하십시오’로 더 형식적인 번역
  rationale: 원문은 단순 명령형이지만, 한국어 공개 번역에서는 발화의 공손도를 유지하는 것이 자연스럽고 문맥상 무리 없습니다.
  doctrine_reference: 번역체/문체 결정
