review_pass:
  verdict: approve
  source_fidelity: 그리스어 διὰ τοῦτο의 앞 절을 받는 인과, γονεῖς의 집합 복수, Ἡλικίαν ἔχει의 ‘스스로 답할 수 있을 만큼 나이가 듦’이라는 관용적 의미, 그리고 αὐτόν을 향한 명령을 모두 충실히 반영합니다. ‘이미 나이가 찼으니’는 원문의 법적·사회적 성숙의 함의를 자연스럽게 보존하며, ‘성인’처럼 의미를 불필요하게 확정하지 않습니다.
  naturalness: ‘이 때문에 그의 부모는 …라고 말했습니다’와 인용문 안의 ‘그에게 물어보십시오’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘나이가 찼으니’는 다소 문어적인 성격이 있으나 성경 본문의 격식과 문맥에 잘 맞고 이해에 지장이 없습니다.
  terminology: ‘부모’, ‘나이가 찼으니’, ‘물어보십시오’의 선택은 적절합니다. 신학 용어나 교파적 해석을 덧붙이지 않았습니다. 각주도 ‘질문하십시오’라는 가능한 어휘 대안을 제시하며 본문의 의미를 변경하지 않습니다.
