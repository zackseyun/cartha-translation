id: JHN.13.30
reference: John 13:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
  footnotes:
  - marker: a
    text: Or 'the morsel' or 'the piece.' The Greek ψωμίον refers to a small piece of bread or food given at the meal.
    reason: lexical_alternative
  - marker: b
    text: Greek 'that one'; the wording is more emphatic than a simple 'he,' likely drawing attention to Judas.
    reason: lexical_alternative
  - marker: c
    text: John's mention that 'it was night' is a literal time reference and may also echo the Gospel's light/darkness theme.
    reason: cross_reference
translation:
  language: ko
  text: 그리하여 그 사람은[b] 빵 조각을[a] 받은 뒤 곧바로 나갔습니다. 밤이었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 조각’, ‘음식 한 입’. ψωμίον은 식탁에서 건네는 작은 빵이나 음식 조각을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘그 사람’. 단순한 ‘그’보다 더 강조된 표현이며, 유다에게 주의를 집중시키는 효과가 있을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 요한이 ‘밤’이라고 말하는 것은 문자적인 시간 표시이며, 동시에 이 복음서의 빛과 어둠 주제를 떠올리게 할 수도 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν οὖν
  english_pob_choice: So after taking
  chosen_korean: 받아 들고
  alternatives_korean:
  - 받고서
  - 받은 뒤에
  lexicon: BDAG
  rationale: 부사적 분사구를 한국어에서 자연스럽게 이어 주되, 직역의 어색함을 피하기 위해 ‘받아 들고’로 처리했습니다. οὖν의 서술 전개는 앞뒤 문맥 연결로 충분히 반영됩니다.
- source_word: τὸ ψωμίον
  english_pob_choice: the piece of bread
  chosen_korean: 빵 조각
  alternatives_korean:
  - 한 조각의 빵
  - 조각빵
  - 한 입거리
  lexicon: BDAG
  rationale: ψωμίον은 식탁에서 건네는 작은 빵 조각/음식 조각을 가리키므로, 현대 한국어로는 ‘빵 조각’이 가장 직관적입니다. 전통적 교회어인 ‘떡’은 여기의 작은 조각이라는 느낌을 약화시킬 수 있습니다.
- source_word: ἐκεῖνος
  english_pob_choice: that man
  chosen_korean: 그는
  alternatives_korean:
  - 그 사람은
  - 그 자는
  lexicon: BDAG
  rationale: 영어 POB의 ‘that man’이 주는 지시적 강조를 한국어에서는 문장 맥락과 함께 주어를 분리해 읽히게 하되, 과도하게 비하적인 표현은 피했습니다. 주석 없이도 유다를 가리키는 거리두기 효과를 어느 정도 보존합니다.
- source_word: ἐξῆλθεν εὐθύς
  english_pob_choice: went out immediately
  chosen_korean: 곧바로 나갔습니다
  alternatives_korean:
  - 즉시 나갔습니다
  - 바로 나갔습니다
  lexicon: BDAG
  rationale: ἐξῆλθεν은 공간 이동의 ‘나가다’가 핵심이므로 ‘나갔습니다’로 옮겼고, εὐθύς는 ‘곧바로’로 자연스럽게 살렸습니다.
- source_word: ἦν δὲ νύξ
  english_pob_choice: And it was night
  chosen_korean: 그런데 밤이었습니다
  alternatives_korean:
  - 그리고 밤이었습니다
  - 밤이었습니다
  lexicon: BDAG
  rationale: 단순한 시간 진술을 유지하면서도 δέ의 전환감을 한국어 접속 부사 ‘그런데’로 살렸습니다. 본문이 지닌 요한복음의 상징성을 과도하게 본문 안에 풀어 넣지 않았습니다.
theological_decisions:
- issue: ἐκεῖνος의 강조와 유다에 대한 거리두기
  chosen_reading: 주어를 평이하게 처리하되, 문맥상 유다를 가리키는 강조와 거리두기를 보존했습니다.
  alternative_readings:
  - 그 사람은
  - 그 자는
  rationale: 원문은 단순 대명사보다 더 강한 지시성을 띠지만, 한국어에서 이를 지나치게 노골적으로 만들면 문체가 부자연스럽거나 해석을 앞서게 됩니다. 따라서 본문은 자연성을 우선하고, 강조 효과는 문맥에 맡겼습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy and preserving rhetorical force without over-interpretation.'
- issue: 밤의 상징성
  chosen_reading: 본문은 시간 진술로 번역하고, 어둠의 상징성은 본문 밖의 독서에 맡깁니다.
  alternative_readings:
  - ‘밤’의 영적 어둠을 본문에 직접 반영
  - ‘밤’ 대신 ‘어둠’으로 해석적 번역
  rationale: 요한복음의 빛/어둠 주제는 분명하지만, 여기의 헬라어는 단순한 시간 표현입니다. 본문은 문자적 의미를 유지해야 하므로 해석적 확장을 자제했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
