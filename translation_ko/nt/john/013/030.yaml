  naturalness: ‘그리하여 그 사람은 빵 조각을 받은 뒤 곧바로 나갔습니다. 밤이었습니다.’는 현대 표준어 합쇼체로 자연스럽고 간결합니다. δέ를 ‘그런데’로 옮기면 원문보다 대조·반전의 뉘앙스가 강해질 수 있으므로 독립된 짧은 문장이 적절합니다.
  terminology: ψωμίον의 ‘빵 조각’은 명료하고 적절합니다. ἐκεῖνος은 ‘그 사람’으로 옮겨 단순 대명사와 구별하되, ‘그 자’처럼 불필요하게 경멸적인 표현은 피했습니다. ‘밤’은 문자적 시간 표현으로 유지했습니다.
