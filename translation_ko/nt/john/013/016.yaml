id: JHN.13.16
reference: John 13:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a slave is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
  footnotes:
  - marker: a
    text: Or 'servant' for 'slave' (δοῦλος); the Greek denotes one under the authority of a master, and 'slave' is used here to preserve that stronger social relation.
    reason: lexical_alternative
  - marker: b
    text: Or 'Lord' for 'master' (κύριος); here it is rendered in its social sense to match the slave/master comparison.
    reason: lexical_alternative
  - marker: c
    text: Or 'messenger' for 'apostle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 진실로, 진실로 내가 여러분에게 말합니다. 종은 주인보다 크지 않고, 사도는 자기를 보낸 이보다 크지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로, 진실로
  alternatives_korean:
  - 아멘, 아멘
  - 참으로, 참으로
  lexicon: BDAG
  rationale: 요한복음의 엄숙한 강조 공식이므로 반복을 살리면서 현대 한국어에서 자연스러운 감탄부사로 옮겼습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종복
  lexicon: BDAG
  rationale: POB의 영어 선택은 사회적 종속성을 강하게 드러내지만, 한국어에서는 '종'이 주인-종의 위계를 직접적으로 보여 주면서도 본문 비교문에 비교적 자연스럽습니다.
- source_word: κύριος
  english_pob_choice: master
  chosen_korean: 주인
  alternatives_korean:
  - 주
  - 주님
  lexicon: BDAG
  rationale: 여기서는 주님의 칭호가 아니라 종-주인 대비의 사회적 관계이므로, 영어 POB의 문맥적 예외를 따라 '주인'으로 옮겼습니다.
- source_word: τοῦ πέμψαντος αὐτόν
  english_pob_choice: the one who sent him
  chosen_korean: 자기를 보낸 이
  alternatives_korean:
  - 그를 보낸 분
  - 그를 보내신 이
  lexicon: BDAG
  rationale: 분사구문을 한국어 관용에 맞게 인칭을 분명히 하면서도, 보냄-보내는 이의 관계를 그대로 드러내도록 옮겼습니다.
theological_decisions:
- issue: κύριος의 칭호성 여부
  chosen_reading: 이 구절에서는 칭호가 아니라 사회적 '주인'입니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 본문의 구조가 종/주인, 사도/보낸 이의 대칭이므로, 기독교적 칭호를 앞세우기보다 관계적 의미를 유지하는 것이 문맥과 수사에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for κύριος; Translation philosophy #5'
