id: JHN.13.8
reference: John 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
  footnotes:
  - marker: a
    text: Or “you have no part with me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 베드로가 그에게 말했습니다. “당신은 제 발을 절대로 씻지 못합니다.” 예수께서 그에게 대답하셨습니다. “내가 당신을 씻지 않으면, 당신은 나와 함께할 몫이 없습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나와 함께할 부분이 없습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς ... εἰς τὸν αἰῶνα
  english_pob_choice: You will never wash
  chosen_korean: “당신은 제 발을 절대로 씻지 못합니다.”
  alternatives_korean:
  - “당신은 제 발을 결코 씻지 못합니다.”
  - “당신은 제 발을 영원히 씻지 못합니다.”
  lexicon: BDAG
  rationale: οὐ μή + aorist subjunctive의 강한 부정은 한국어에서 ‘절대로/결코’로 자연스럽게 옮기되, 대상이 분명한 ‘제 발’을 그대로 살렸습니다.
- source_word: μου τοὺς πόδας
  english_pob_choice: my feet
  chosen_korean: “제 발을”
  alternatives_korean:
  - “내 발을”
  - “내 발들을”
  lexicon: BDAG
  rationale: 복수 목적어이므로 ‘발들’을 직역할 수 있지만, 한국어에서는 통상적인 신체 표현으로 ‘발’을 사용해도 원뜻이 유지됩니다.
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  english_pob_choice: you have no share with me
  chosen_korean: “당신은 나와 함께할 몫이 없습니다.”
  alternatives_korean:
  - “당신은 나와 함께할 부분이 없습니다.”
  - “당신은 나와 함께할 분깃이 없습니다.”
  - “당신은 나와 함께할 몫이 없습니다.”
  lexicon: BDAG
  rationale: μέρος는 단순한 ‘부분’보다 관계적 참여를 가리킬 수 있어, POB의 ‘share’를 따라 ‘몫’으로 옮겨 공동 참여의 의미를 살렸습니다.
- source_word: ἀπεκρίθη ... Ἰησοῦς αὐτῷ
  english_pob_choice: Jesus answered him
  chosen_korean: “예수께서 그에게 대답하셨습니다.”
  alternatives_korean:
  - “예수께서 그에게 대답했습니다.”
  - “예수께서 그에게 응답하셨습니다.”
  lexicon: BDAG
  rationale: 서사체의 표준 응답 동사로 ‘대답하셨습니다’가 가장 자연스럽고, 존칭 주어와도 잘 맞습니다.
theological_decisions:
- issue: μέρος μετ’ ἐμοῦ의 신학적 범위
  chosen_reading: 예수와의 관계적 참여/연합을 가리키되, 그 방식은 본문이 직접 규정하지 않으므로 넓게 두었습니다.
  alternative_readings:
  - 세족 자체의 상징적 의미에 대한 언급
  - 성례적 정결의 직접 진술
  - 구원론적 소속을 단정하는 해석
  rationale: 본문은 ‘나와 함께할 몫’이 없다고 말하지만, 그 몫의 정확한 메커니즘은 설명하지 않습니다. 번역은 그 긴장을 유지합니다.
  doctrine_reference: 본문의 의미 범위를 넘어서지 않기
