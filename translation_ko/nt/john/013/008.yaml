  source_fidelity: 베드로의 발언에서 οὐ μή ... εἰς τὸν αἰῶνα는 미래에 대한 단호한 거부/부정입니다. 초안의 ‘씻지 못합니다’는 능력의 불가능으로 읽히므로 이 양태를 정확히 반영하지 못합니다. 예수님의 조건절과 ‘나와 함께할 몫’은 대체로 원문의 넓은 의미를 잘 보존합니다.
  naturalness: ‘제 발은 절대로 씻지 않으실 것입니다’는 한국어 높임법을 지키면서도 원문의 단호한 미래 부정을 자연스럽게 표현합니다. ‘당신은’이라는 직접 호칭을 생략해 예수님께 მიმართ하는 한국어 발화로서의 어색함도 피했습니다.
  terminology: νίπτω는 ‘씻다’로 적절하며, μέρος는 교리적으로 좁히지 않은 ‘몫’으로 유지할 수 있습니다. 각주 ‘부분’은 가능한 어휘 대안입니다.
