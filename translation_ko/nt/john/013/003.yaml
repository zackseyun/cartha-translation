id: JHN.13.3
reference: John 13:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
  footnotes:
  - marker: a
    text: Or 'he came forth from God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'was going back to God'; the Greek says simply 'was going to God.'
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서는 아버지께서 모든 것을 예수님의 손에 주셨으며, 자신이 하나님께로부터 나오셨고 하나님께로 가신다는 것을 아시고[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께로부터 오셨다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께로 돌아가신다’; 헬라어는 단순히 ‘하나님께로 가신다’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  english_pob_choice: knowing
  chosen_korean: 아시고
  alternatives_korean:
  - 알고
  - 깨닫고
  lexicon: BDAG
  rationale: 상황을 배경적으로 여는 분사이므로, 자연스러운 합쇼체로 ‘아시고’라고 옮겨 원문의 인지적·문맥적 기능을 살렸습니다.
- source_word: πάντα
  english_pob_choice: all things
  chosen_korean: 모든 것을
  alternatives_korean:
  - 모든 것
  - 전부
  lexicon: BDAG
  rationale: 중성 복수의 포괄성을 살리기 위해 ‘모든 것을’로 옮겨, 아버지께서 맡기신 범위의 총체성을 분명히 했습니다.
- source_word: εἰς τὰς χεῖρας
  english_pob_choice: into his hands
  chosen_korean: 자기 손에
  alternatives_korean:
  - 그의 손에
  - 그의 권한 아래
  lexicon: BDAG
  rationale: 관용적 표현을 문자적으로 유지해 ‘손’의 구체적 이미지를 살리되, 한국어에서는 소유대명사보다 ‘자기 손에’가 더 자연스럽습니다.
- source_word: ἀπὸ θεοῦ ἐξῆλθεν
  english_pob_choice: had come from God
  chosen_korean: 하나님에게서 나오셨다가
  alternatives_korean:
  - 하나님에게서 오셨다가
  - 하나님에게서 나오셨고
  lexicon: BDAG
  rationale: ‘나오다’는 출처와 기원을 직접 드러내므로 원문의 강한 기원 진술을 보존합니다. 또한 이어지는 ‘가시는’과 연결되도록 과거 완료적 배경을 한국어의 ‘-셨다가’로 자연스럽게 반영했습니다.
- source_word: πρὸς τὸν θεὸν ὑπάγει
  english_pob_choice: was going to God
  chosen_korean: 하나님께로 가시는 것을
  alternatives_korean:
  - 하나님께로 가고 계시는 것을
  - 하나님께로 돌아가시는 것을
  lexicon: BDAG
  rationale: πρός의 방향성을 ‘께로’로 살려 ‘to God’를 직접 반영했고, POB의 보존 원칙에 따라 ‘돌아가시는’처럼 해석을 덧붙이지 않았습니다.
theological_decisions:
- issue: 예수의 기원과 귀환 진술(ἀπὸ θεοῦ / πρὸς τὸν θεόν)
  chosen_reading: ‘하나님에게서 나오셨다가 하나님께로 가시는 것’으로 옮겨, 출처와 목적지를 모두 드러내되 ‘돌아가신다’는 해석적 보충은 넣지 않았습니다.
  alternative_readings:
  - 하나님에게서 오셨다가 하나님께로 돌아가시는 것을
  - 하나님에게서 나오셔서 하나님께로 가시는 것을
  rationale: 본문은 예수의 신적 기원과 하나님께로의 향해감을 강하게 말하지만, ‘back/돌아’는 문맥에서 추론되는 요소이므로 본문 자체의 표현을 넘지 않도록 했습니다.
  doctrine_reference: Johannine Christology; Translation philosophy §3
