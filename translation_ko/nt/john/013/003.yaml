review_pass:
  verdict: revise
  source_fidelity: 원문의 두 ὅτι절은 모두 예수께서 아신 내용입니다. 초안은 이 기본 구조를 대체로 보존하지만, ‘하나님에게서 나오셨다가’의 -다가 연결은 앞 사건이 뒤 사건의 계기·대조라는 뉘앙스를 줄 수 있어, 단순 병렬인 καί를 더 중립적으로 옮기는 편이 안전합니다. 또한 ‘자기 손’은 문법적으로 예수를 가리키지만, 현대 한국어에서 지시 대상이 잠시 모호할 수 있으므로 ‘그분의 손’이 더 분명합니다.
  naturalness: ‘예수께서는 … 아시고,’라는 문장 연결은 현대 문어 합쇼체에서 자연스럽습니다. 다만 ‘하나님에게서’보다 존대격 조사와 함께 ‘하나님께로부터’가 성경 문체와 현대 표준어에서 더 자연스럽고, ‘나오셨다가’보다 ‘나오셨으며’가 원문의 병렬을 매끄럽게 반영합니다.
  terminology: ‘아버지’, ‘하나님’, ‘모든 것’, ‘손에 주셨고’는 적절합니다. ‘하나님께로 가시는’은 πρὸς τὸν θεὸν ὑπάγει를 해석적으로 ‘돌아가시는’으로 좁히지 않아 적절합니다. 영어 감사 기록의 각주 a는 본문 중 ‘예수’가 아니라 ‘하나님에게서 나오셨다’에 연결되어야 하며, 각주 b는 ‘하나님께로 가시는’에 연결되어야 합니다.
  issues:
  - severity: medium
    issue: 각주 앵커가 원문 및 영어 POB 감사 기록의 해당 어구와 일치하지 않습니다.
    rationale: 초안은 a를 ‘예수께서는’에, b를 문장 끝에 두었으나, 영어의 a는 ἐξῆλθεν(‘하나님에게서 나오셨다’)의 어휘 대안이고 b는 ὑπάγει(‘하나님께로 가시는’)의 대안입니다. 각주를 해당 번역 어구에 붙여야 합니다.
  - severity: low
    issue: ‘나오셨다가’가 단순 접속 καί에 추가적인 연결 뉘앙스를 줄 수 있습니다.
    rationale: 원문은 ‘하나님에게서 나오셨으며 하나님께로 가신다’라는 병렬 진술입니다. ‘-다가’는 한국어에서 시간적 계기나 전환을 암시할 수 있으므로 ‘-으며’가 더 중립적입니다.
  - severity: low
    issue: ‘자기 손에’의 지시 대상이 문맥상 예수이지만 표현상 다소 모호합니다.
    rationale: αὐτῷ는 예수를 가리킵니다. ‘그분의 손에’는 원문의 소유 관계를 분명히 하면서도 자연스럽습니다.
  revised_text: 예수께서는 아버지께서 모든 것을 그분의 손에 주셨고, 또 자신이 하나님께로부터 나오셨으며 하나님께로 가시는 것을 아시고,
  revised_footnotes:
  - marker: a
    text: 또는 ‘그분께서 하나님께로부터 나오셨다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께로 돌아가시는 중이었다’; 헬라어는 단순히 ‘하나님께로 가시는’이라고 말합니다.
    reason: alternative_reading
  revision_rationale: 두 ὅτι절의 병렬과 예수께서 아신 내용이라는 문장 구조를 유지했습니다. ‘하나님께로부터 나오셨으며’로 ἀπὸ θεοῦ ἐξῆλθεν을 직역적이면서도 자연스럽게 옮기고, ‘돌아가시는’이라는 해석적 보충은 본문에는 넣지 않았습니다. 각주 앵커는 각각 ‘나오셨으며’와 ‘가시는’에 배치해야 합니다.
