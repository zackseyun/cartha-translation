review_pass:
  verdict: revise
  source_fidelity: 핵심 명제는 대체로 보존했지만, ‘자기 손에’는 바로 앞 종속절의 주어인 ‘아버지’를 가리키는 것으로 읽힐 수 있어 αὐτῷ(예수에게)의 지시를 흐립니다. 또한 ‘-셨다가’는 두 절 사이에 원문에 없는 시간적·전환적 뉘앙스를 더할 수 있습니다.
  naturalness: 합쇼체 문장 자체는 대체로 자연스럽지만, ‘자기가 하나님에게서 나오셨다가’는 재귀 표현과 높임 선어말어미의 결합이 어색합니다. ‘예수님의 손에’와 병렬 구조를 사용하면 더 명료하고 자연스럽습니다.
  terminology: ‘아버지’, ‘하나님’, ‘모든 것’, ‘손’은 적절합니다. ‘하나님에게서’보다 존칭 조사와 문체상 ‘하나님께로부터’가 더 자연스럽고, 원문의 출처 의미도 유지합니다.
  issues:
  - severity: medium
    issue: ‘자기 손에’의 선행사 모호성
    rationale: ‘아버지께서 ... 주셨고’ 안에서 ‘자기’는 통상 그 절의 주어인 아버지를 가리킬 수 있습니다. 그리스어 αὐτῷ는 예수를 가리키므로 명시적으로 바로잡아야 합니다.
  - severity: medium
    issue: ‘자기가 하나님에게서 나오셨다가’의 어색한 높임 및 연결
    rationale: ‘자기가’와 ‘나오셨다가’의 결합은 현대 표준어에서 부자연스럽고, -다가가 원문에 없는 전환·대조의 뉘앙스를 보탭니다. 두 사실절을 ‘-셨으며’로 병렬하는 편이 안전합니다.
  - severity: medium
    issue: 각주 앵커가 해당 어구에 붙어 있지 않음
    rationale: 대안 번역 각주는 각각 ἐξῆλθεν과 ὑπάγει의 번역어에 붙어야 합니다. 현재 a는 ‘예수께서는’, b는 ‘아시고’에 붙어 있어 독자가 무엇의 대안인지 알기 어렵습니다.
  - severity: low
    issue: 각주 a의 ‘그분께서’는 선행사를 불필요하게 불명확하게 함
    rationale: 대안은 ‘하나님께로부터 나오셨다’의 동사 표현에 관한 것이므로, 대명사만 제시하기보다 해당 절 전체를 제시하는 편이 명료합니다.
  revised_text: 예수께서는 아버지께서 모든 것을 예수님의 손에 주셨으며, 자신이 하나님께로부터 나오셨고 하나님께로 가신다는 것을 아시고[a][b],
  revised_footnotes:
  - marker: a
    text: 또는 ‘하나님께로부터 오셨다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께로 돌아가신다’; 헬라어는 단순히 ‘하나님께로 가신다’라고 말합니다.
    reason: alternative_reading
  revision_rationale: 수정문은 εἰδὼς의 배경적 분사 구조를 ‘아시고’로 유지하고, πάντα와 εἰς τὰς χεῖρας를 ‘모든 것을 예수님의 손에’로 옮겨 수여 대상이 예수임을 분명히 했습니다. ἀπὸ θεοῦ ἐξῆλθεν은 ‘하나님께로부터 나오셨고’로, πρὸς τὸν θεὸν ὑπάγει는 해석적 ‘돌아’를 본문에서 배제한 ‘하나님께로 가신다’로 보존했습니다. 각주는 실제로 대안을 설명하는 두 동사구에 연결했습니다.
