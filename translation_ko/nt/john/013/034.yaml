id: JHN.13.34
reference: John 13:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
  footnotes:
  - marker: a
    text: Or 'command.' The Greek term can be rendered either way, but 'commandment' better preserves the formal ethical force here.
    reason: lexical_alternative
  - marker: b
    text: The second clause may also be rendered, 'that you also may love one another.'
    reason: alternative_reading
translation:
  language: ko
  text: 새 계명을 내가 너희에게 줍니다. 곧 너희가 서로 사랑하라는 것입니다. 내가 너희를 사랑한 것처럼, 너희도 서로 사랑해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명령’. 그리스어 용어는 둘 다 가능하지만, 여기서는 공식적이고 윤리적인 무게를 더 잘 살리기 위해 ‘계명’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 둘째 절은 ‘너희도 서로 사랑하도록’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν καινὴν
  english_pob_choice: A new commandment
  chosen_korean: 새 계명
  alternatives_korean:
  - 새 명령
  - 새로운 계명
  lexicon: BDAG
  rationale: ἐντολή의 형식적·윤리적 무게를 살리되 한국어에서는 ‘계명’이 요한문맥의 단정한 요구를 가장 자연스럽게 드러냅니다. ‘새’는 καινὴν의 기본 의미를 간결하게 반영합니다.
- source_word: δίδωμι ὑμῖν
  english_pob_choice: I give to you
  chosen_korean: 내가 너희에게 줍니다
  alternatives_korean:
  - 내가 너희에게 드립니다
  - 내가 너희에게 줍니다
  lexicon: BDAG
  rationale: 직접적 부여의 뉘앙스를 살리기 위해 ‘주다’를 택했고, 1인칭 현재의 단정성을 합쇼체로 자연스럽게 옮겼습니다.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  english_pob_choice: that you love one another
  chosen_korean: 곧 너희가 서로 사랑하라는 것입니다
  alternatives_korean:
  - 너희가 서로 사랑하도록
  - 너희가 서로 사랑해야 한다는 것입니다
  lexicon: BDAG
  rationale: ἵνα가 여기서는 명령의 내용/목적을 나타내므로, 한국어에서는 풀어 써서 계명의 내용임을 분명히 했습니다. ‘서로 사랑하다’는 ἀλλήλους와 ἀγαπᾶτε의 반복을 유지합니다.
- source_word: καθὼς ἠγάπησα ὑμᾶς
  english_pob_choice: Just as I loved you
  chosen_korean: 내가 너희를 사랑한 것처럼
  alternatives_korean:
  - 내가 너희를 사랑한 것같이
  - 내가 너희를 사랑한 것처럼
  lexicon: BDAG
  rationale: καθὼς의 비교·모범 관계를 ‘-한 것처럼’으로 자연스럽게 살렸고, ἠγάπησα는 단순 과거로 처리해 이미 보인 예수의 사랑을 가리키게 했습니다.
- source_word: ἀγαπᾶτε ἀλλήλους
  english_pob_choice: you also are to love one another
  chosen_korean: 너희도 서로 사랑해야 합니다
  alternatives_korean:
  - 너희도 서로 사랑하라는 것입니다
  - 너희도 서로 사랑합니다
  lexicon: BDAG
  rationale: 두 번째 ἵνα절의 권면적·규범적 힘을 한국어의 의무 표현으로 옮겨, 예수의 사랑이 제자들의 상호 사랑의 기준임을 드러냅니다.
theological_decisions:
- issue: ‘새 계명’의 새로움의 성격
  chosen_reading: 본문이 말하는 새로움은 설명하지 않고 ‘새 계명’이라고만 옮겼습니다.
  alternative_readings:
  - 시간적으로 새롭다
  - 질적으로 새롭다
  - 예수의 본으로 인해 새롭게 성취된 계명
  rationale: 그리스어 본문 자체가 새로움의 정확한 범주를 규정하지 않으므로, 본문의 긴장을 유지하기 위해 해설을 본문에 덧붙이지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
