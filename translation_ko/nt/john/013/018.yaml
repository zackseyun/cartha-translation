id: JHN.13.18
reference: John 13:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
  footnotes:
  - marker: a
    text: Or, more formally, 'I do not speak concerning all of you.'
    reason: lexical_alternative
  - marker: b
    text: Quotation/allusion to Psalm 41:9.
    reason: cross_reference
  - marker: c
    text: Or 'has raised his heel against me.' The expression is an idiom of hostility and betrayal.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너희 모두를 두고 말하는 것이 아닙니다[a]. 나는 내가 누구를 택했는지 압니다[c][b]. 그러나 이는 성경이 이루어지게 하려는 것입니다. 「내 빵을 먹는 사람이 내게 자기 발꿈치를 들었습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 ‘너희 모두를 두고 말하는 것이 아닙니다’라고 할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 시편 41:9의 인용/암시입니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘내게 자기 발꿈치를 들었습니다’로 옮길 수 있습니다. 이 표현은 적대와 배신을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  english_pob_choice: I am not speaking about all of you
  chosen_korean: 나는 너희 모두를 두고 말하는 것이 아닙니다
  alternatives_korean:
  - 나는 너희 모두에 관해 말하는 것이 아닙니다
  - 나는 너희 모두를 가리켜 말하는 것이 아닙니다
  lexicon: BDAG
  rationale: περὶ + 목적어의 ‘about/concerning’ 범위를 한국어의 ‘두고’로 자연스럽게 옮겨, 부정의 범위가 모든 제자에게 미치지 않음을 유지했습니다.
- source_word: οἶδα
  english_pob_choice: I know
  chosen_korean: 나는 ... 압니다
  alternatives_korean:
  - 나는 ... 알고 있습니다
  - 나는 ... 압니다
  lexicon: BDAG
  rationale: οἶδα의 현재적 의미를 한국어의 단순 현재 ‘압니다’로 간명하게 살렸습니다.
- source_word: τίνας ἐξελεξάμην
  english_pob_choice: whom I have chosen
  chosen_korean: 내가 누구를 택했는지
  alternatives_korean:
  - 내가 누구를 선택했는지
  - 내가 택한 사람이 누구인지
  lexicon: BDAG
  rationale: 선택의 대상이 인격적 객체임을 살리기 위해 ‘누구를’ 구조를 유지했고, ἐκλέγομαι는 한국어 성서 문맥에 맞게 ‘택하다’로 옮겼습니다.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  english_pob_choice: The one who eats my bread
  chosen_korean: 내 빵을 먹는 사람
  alternatives_korean:
  - 내 떡을 먹는 사람
  - 내 빵을 먹는 자
  lexicon: BDAG
  rationale: ἄρτος의 기본 의미를 현대 한국어에서는 ‘빵’으로 옮겨 직설성을 살렸고, 문맥상 인격화된 주어는 ‘사람’으로 풀었습니다.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  english_pob_choice: has lifted up his heel against me
  chosen_korean: 자기 발꿈치를 들었습니다
  alternatives_korean:
  - 내게 발꿈치를 들었습니다
  - 내게 자기 발꿈치를 들어 올렸습니다
  lexicon: BDAG
  rationale: 시편 인용의 관용구를 직역하여 ‘발꿈치’를 유지했고, 폭력적/배신적 함의는 본문과 각주로 드러내도록 했습니다.
theological_decisions:
- issue: 본문의 배신 관용구를 어떻게 드러낼지
  chosen_reading: 직역에 가까운 ‘자기 발꿈치를 들었습니다’를 본문에 두고, 그 표현이 적대와 배신의 관용구임을 각주로 밝혔습니다.
  alternative_readings:
  - ‘내게 배반했습니다’처럼 의미를 풀어 쓰기
  - ‘내게 발꿈치를 들어 올렸습니다’처럼 기계적으로 옮기기
  rationale: 원문의 시적·상징적 힘과 시편 41:9의 인용성을 보존하면서, 현대 독자가 의미를 오해하지 않도록 주석으로 보완했습니다.
  doctrine_reference: Translation philosophy §1, §3
