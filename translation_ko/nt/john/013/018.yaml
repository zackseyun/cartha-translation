revisions:
- from: 나는 너희 모두를 두고 말하는 것이 아닙니다[a]. 나는 내가 누구를 택했는지 압니다[c][b]. 그러나 이는 성경이 이루어지게 하려는 것입니다. 「내 빵을 먹는 사람이 내게 자기 발꿈치를 들었습니다.」
  to: '나는 너희 모두에 관하여 말하는 것이 아닙니다[a]. 나는 내가 누구를 택했는지 압니다. 그러나 성경이 이루어지도록 하려는 것입니다[b]: 「내 빵을 먹는 사람이 나를 향해 자기 발꿈치를 치켜들었습니다[c].」'
  rationale: 부정의 범위와 ‘택하다’의 의미는 유지했습니다. 성경 성취를 나타내는 ἵνα 절은 결정론적 설명을 덧붙이지 않고 자연스러운 한국어 목적·귀결 표현으로 다듬었습니다. 시편 인용에서는 ‘발꿈치’ 은유를 보존하면서도 ‘나를 향해’로 원문의 대적 관계를 명시했고, 각주 b와 c를 각각 성경 인용 및 발꿈치 은유에 올바르게 연결했습니다.
