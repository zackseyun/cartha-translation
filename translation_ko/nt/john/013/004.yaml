  text: ἐγείρεται ἐκ τοῦ δείπνου καὶ τίθησιν τὰ ἱμάτια καὶ λαβὼν λέντιον διέζωσεν ἑαυτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
  footnotes:
  - marker: a
    text: Or 'he gets up from the meal.'
    reason: lexical_alternative
  - marker: b
    text: Or 'girded himself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 만찬 자리에서 일어나 겉옷을 벗어 놓고, 수건을 가져다가 자기 허리에 두르셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만찬에서 일어나다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘허리에 두르다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεται
  english_pob_choice: he rises
  chosen_korean: 일어나
  alternatives_korean:
  - 일어납니다
  - 일어나셨습니다
  - 몸을 일으키십니다
  lexicon: BDAG
  rationale: 현재형 서술의 생동감을 살리되, 한국어에서는 자연스러운 서술형으로 ‘일어나’라고 옮겼습니다.
- source_word: ἐκ τοῦ δείπνου
  english_pob_choice: from the supper
  chosen_korean: 만찬 자리에서
  alternatives_korean:
  - 만찬에서
  - 저녁 식사에서
  - 식사 자리에서
  lexicon: BDAG
  rationale: δεῖπνον의 식사 장면을 살리면서도 한국어에서 자연스러운 문맥 표현으로 ‘만찬 자리에서’라고 했습니다.
- source_word: τίθησιν τὰ ἱμάτια
  english_pob_choice: lays aside his outer garments
  chosen_korean: 겉옷을 벗어 놓고
  alternatives_korean:
  - 겉옷을 내려놓고
  - 겉옷을 치워 두고
  - 겉옷을 벗고
  lexicon: BDAG
  rationale: ἱμάτια를 단순한 ‘옷’보다 바깥옷으로 구체화해야 하므로 ‘겉옷’으로 옮겼고, τίθημι의 뜻을 살려 벗은 뒤 두는 동작을 반영했습니다.
- source_word: διέζωσεν ἑαυτόν
  english_pob_choice: tied it around himself
  chosen_korean: 자기 허리에 두르셨습니다
  alternatives_korean:
  - 스스로 허리를 동이셨습니다
  - 허리에 감으셨습니다
  - 허리를 동여매셨습니다
  lexicon: BDAG
  rationale: διαζώννυμι의 ‘허리에 둘러 매다’는 뜻을 현대 한국어로 분명하게 풀어, 종의 섬김을 위한 준비 동작이 드러나게 했습니다.
theological_decisions:
- issue: 예수의 몸짓을 지시하는 서술의 공손도
  chosen_reading: 서술 본문이지만 예수님을 주어로 하므로 마지막 동작은 ‘두르셨습니다’처럼 존칭 서술을 사용했습니다.
  alternative_readings:
  - 끝까지 중립적 서술인 ‘두르었습니다’
  - 전체를 비존칭으로 통일
  rationale: 직접 인용이 아닌 서술문에서는 한국어 경건 독자를 고려해 예수에 대한 존칭을 유지하면서도, 원문의 행동 묘사를 과장하지 않도록 했습니다.
  doctrine_reference: 그리스도의 존귀와 복음서 서술의 한국어 관습
- issue: ‘겉옷’과 ‘수건’의 구체성
  chosen_reading: 원문의 사물 명칭을 구체적으로 드러내어, 단순한 일반복이나 상징어로 완화하지 않았습니다.
  alternative_readings:
  - ‘옷’을 일반적으로 번역
  - ‘행주’ 같은 생활용품 어감으로 축소
  rationale: 요한복음의 발 씻기 준비 장면은 구체적 행위가 중요하므로, 물건의 물질성과 동작성을 보존하는 쪽을 택했습니다.
  doctrine_reference: 본문의 서사적 구체성 보존
