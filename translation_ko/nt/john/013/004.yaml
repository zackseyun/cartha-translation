translation:
  language: ko
  text: 그는 만찬에서[a] 일어나시어 겉옷을 벗어 놓으시고, 수건을 가져다가 자기 허리에 두르십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저녁 식사에서’.
