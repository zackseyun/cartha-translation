revisions:
- from: 예수께서 대답하십니다[a], “내가 빵 조각을 적셔서 주는 사람이 바로 그 사람입니다.” 그래서 예수께서 빵 조각을 적셔서 시몬의 아들 가룟 유다에게 주십니다.
  to: 예수께서 대답하십니다[a]. “내가 빵 조각을 적셔 주는 사람이 바로 그 사람입니다.” 그래서 예수께서 빵 조각을 적셔서 이스가리옷 시몬의 아들 유다에게 주십니다.
  rationale: 마지막 인명구를 ‘이스가리옷 시몬의 아들 유다’로 고쳐 원문의 표면적 결합과 영어 POB 본문 독법을 반영하고, ‘가룟 유다, 시몬의 아들’이라는 전통적 대안은 각주로 보존했습니다. 그 밖에는 역사적 현재, 미래의 의미, 빵 조각을 적신 뒤 주는 동작 순서를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:43Z'
review_pass:
  verdict: revise
  source_fidelity: 역사적 현재형 ἀποκρίνεται와 δίδωσιν을 각각 ‘대답하십니다’, ‘주십니다’로 옮긴 것은 적절합니다. 또한 미래형 βάψω와 빵 조각을 적신 뒤 주는 행위의 순서도 충실히 반영합니다. 다만 ‘시몬의 아들 가룟 유다’는 가룟/이스가리옷을 유다에게만 수식시키므로, Σίμωνος Ἰσκαριώτου의 수식 범위가 열려 있는 원문의 모호성을 본문에서 해소해 버립니다.
  naturalness: 합쇼체와 예수님에 대한 높임은 일관되고 자연스럽습니다. ‘빵 조각을 적셔서 주는 사람’도 이해할 수 있으나, ‘빵 조각을 적셔 주는 사람’은 ‘적시다’와 ‘주다’의 연결을 더 자연스럽게 나타냅니다. ‘이스가리옷 시몬의 아들 유다’는 다소 낯선 어순이지만, 원문의 직접적 구성을 보존하는 데 필요한 최소한의 표시입니다.
  terminology: ‘빵 조각’, ‘가룟 유다’는 현대 한국어 성경 문맥에서 이해 가능한 표현입니다. 본문에는 원문의 직접적 문법에 따라 ‘이스가리옷 시몬’을 두고, 관습적인 ‘가룟 유다’를 대안 독법으로 각주에 보존하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 마지막 인명구가 원문의 수식 범위 모호성을 보존하지 못합니다.
    rationale: ‘시몬의 아들 가룟 유다’는 Ἰσκαριώτου를 유다의 별칭으로 확정합니다. SBLGNT의 Ἰούδᾳ Σίμωνος Ἰσκαριώτου는 ‘이스가리옷 시몬의 아들 유다’로도, ‘가룟 유다, 시몬의 아들’로도 이해될 수 있으므로, 영어 POB 감사 기록처럼 한 독법을 본문에 두고 다른 독법을 각주에 제시해야 합니다.
  - severity: low
    issue: ‘적셔서 주는’의 띄어쓰기와 결합이 다소 덜 자연스럽습니다.
    rationale: ‘적셔 주는’으로 쓰면 빵을 적신 후 그 빵을 준다는 동작 연결이 자연스러우며 의미 변화가 없습니다.
  revised_text: 예수께서 대답하십니다[a]. “내가 빵 조각을 적셔 주는 사람이 바로 그 사람입니다.” 그래서 예수께서 빵 조각을 적셔서 이스가리옷 시몬의 아들 유다에게 주십니다.
  revised_footnotes:
