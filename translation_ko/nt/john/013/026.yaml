id: JHN.13.26
reference: John 13:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
  footnotes:
  - marker: a
    text: Or, 'Judas Iscariot, Simon's son.' The Greek wording can be taken either way.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 대답하십니다[a], “내가 빵 조각을 적셔서 주는 사람이 바로 그 사람입니다.” 그래서 예수께서 빵 조각을 적셔서 시몬의 아들 가룟 유다에게 주십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가룟 유다, 시몬의 아들’로 읽을 수 있습니다. 그리스어 표현은 두 가지로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  english_pob_choice: answers
  chosen_korean: 대답하십니다
  alternatives_korean:
  - 대답합니다
  - 응답하십니다
  lexicon: BDAG
  rationale: 현재시제의 역사적 서술을 한국어에서도 현재형으로 살리되, 예수께 대한 존칭을 반영해 자연스럽게 표현했습니다.
- source_word: Ἐκεῖνός ἐστιν
  english_pob_choice: It is he / the one
  chosen_korean: 바로 그 사람입니다
  alternatives_korean:
  - 그 사람입니다
  - 그가 바로 그 사람입니다
  lexicon: BDAG
  rationale: 지시대명사의 식별 기능을 살리면서 한국어에서 어색하지 않게, 질문에 대한 특정 인물을 지목하는 표현으로 옮겼습니다.
- source_word: βάψω τὸ ψωμίον
  english_pob_choice: will dip the piece of bread
  chosen_korean: 빵 조각을 적셔서
  alternatives_korean:
  - 빵 한 조각을 찍어서
  - 빵 조각을 담가서
  lexicon: BDAG
  rationale: ψωμίον은 작은 빵 조각을 가리키므로 ‘빵 조각’으로 옮기고, βάπτω의 문맥상 의미를 반영해 ‘적셔서’로 표현했습니다.
- source_word: δίδωσιν
  english_pob_choice: he gives
  chosen_korean: 주십니다
  alternatives_korean:
  - 줍니다
  - 건네십니다
  lexicon: BDAG
  rationale: 요한복음의 현재형 서술을 살리면서 한국어 문장 흐름에 맞게 ‘주십니다’로 옮겼습니다.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  english_pob_choice: Judas, the son of Simon Iscariot
  chosen_korean: 시몬의 아들 가룟 유다에게
  alternatives_korean:
  - 가룟 유다, 시몬의 아들에게
  - 시몬 이스가리옷의 아들 유다에게
  lexicon: BDAG
  rationale: 그리스어 소유격 결합이 유다를 시몬으로 식별하는 구성이므로, 한국어에서는 가장 자연스러운 친족관계 표지로 ‘시몬의 아들’이라 옮겼습니다.
theological_decisions:
- issue: ‘예수께서 대답하십니다’의 현재시제 처리
  chosen_reading: 서술 현재를 유지해 장면의 즉시성과 긴장감을 살렸습니다.
  alternative_readings:
  - 대답하셨습니다
  - 대답합니다
  rationale: 본문의 ἀποκρίνεται와 뒤이은 δίδωσιν의 현재형을 따라, 요한복음 특유의 생생한 서술을 한국어에서도 현재형으로 반영했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 마지막 인물 표기의 모호성
  chosen_reading: ‘시몬의 아들 가룟 유다’로 번역했습니다.
  alternative_readings:
  - ‘가룟 유다, 시몬의 아들’
  - ‘가룟 유다’
  rationale: 그리스어의 Σίμωνος Ἰσκαριώτου는 문법적으로 시몬과 이스가리옷의 연결이 다소 열려 있으므로, 본문에서는 직접적 친족관계를 드러내되 전통적 호칭을 과도하게 고정하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
