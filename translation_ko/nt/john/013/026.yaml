    text: 또는 ‘가룟 유다, 시몬의 아들’로 읽을 수 있습니다. 그리스어 표현은 두 가지로 이해될 수 있습니다.
    reason: alternative_reading
  revision_rationale: 마지막 인명구를 ‘이스가리옷 시몬의 아들 유다’로 고쳐 원문의 표면적 결합과 영어 POB 본문 독법을 반영하고, ‘가룟 유다, 시몬의 아들’이라는 전통적 대안은 각주로 보존했습니다. 그 밖에는 역사적 현재, 미래의 의미, 빵 조각을 적신 뒤 주는 동작 순서를 유지했습니다.
