id: JHN.13.37
reference: John 13:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
  footnotes:
  - marker: a
    text: Or, more literally, 'Why can I not follow you right now?'
    reason: lexical_alternative
  - marker: b
    text: Greek 'my soul'; in this idiom the sense is 'my life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 베드로가 그에게 말했습니다. 「주님, 왜 제가 지금은[a] 당신을 따를 수 없습니까? 저는 당신을 위해 제 생명[b]을 내놓겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 ‘왜 제가 지금 당장 당신을 따를 수 없습니까?’입니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어로는 ‘내 영혼’입니다. 이 관용구에서는 ‘내 생명’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  lexicon: BDAG
  rationale: 예수께 직접 드리는 호칭으로서 ‘Lord’의 존칭과 신학적 무게를 살리되, 한국어 공용 성경어인 ‘주님’을 사용했습니다.
- source_word: διὰ τί οὐ δύναμαί σοι ἀκολουθῆσαι ἄρτι
  english_pob_choice: why am I not able to follow you now?
  chosen_korean: 왜 제가 지금은 당신을 따를 수 없습니까?
  alternatives_korean:
  - 왜 저는 지금 당신을 따르지 못합니까?
  - 왜 제가 지금 당신을 따라갈 수 없습니까?
  lexicon: BDAG
  rationale: διὰ τί와 οὐ δύναμαι의 질문 구조를 자연스러운 한국어로 옮기면서, ἀκολουθέω의 ‘따르다’ 의미와 제자도 뉘앙스를 유지했습니다.
- source_word: τὴν ψυχήν μου ὑπὲρ σοῦ θήσω
  english_pob_choice: I will lay down my life for you.
  chosen_korean: 저는 당신을 위해 제 생명을 내놓겠습니다.
  alternatives_korean:
  - 저는 당신을 위해 제 목숨을 내놓겠습니다.
  - 저는 당신을 위해 제 생명을 바치겠습니다.
  lexicon: BDAG
  rationale: ψυχή의 관용적 의미를 따라 ‘생명’으로 옮기고, τίθημι의 관용구를 한국어 ‘내놓다’로 자연스럽게 재현했습니다.
theological_decisions:
- issue: ψυχή의 한국어 대응
  chosen_reading: ‘생명’으로 번역해 베드로가 예수님을 위해 죽을 각오를 말하는 뜻을 분명히 했습니다.
  alternative_readings:
  - ‘영혼’
  - ‘목숨’
  rationale: 문맥은 형이상학적 영혼이 아니라 자기 생명의 내어줌을 가리키므로, 영어 POB의 판단을 따라 ‘생명’을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ἀκολουθέω의 의미층
  chosen_reading: ‘따르다’로 번역해 이동의 뜻과 제자도의 뜻을 함께 살렸습니다.
  alternative_readings:
  - ‘동행하다’
  - ‘가다’
  rationale: 요한복음의 문맥에서는 단순한 이동이 아니라 제자적 추종의 의미가 함께 작동하므로, 이를 지우지 않는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §3
