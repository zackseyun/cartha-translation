    issue: ‘당신들은’
    rationale: 문법 오류는 아니지만, 현대 한국어의 직접 호칭에서 ‘당신들’은 대립적 또는 무례하게 들릴 수 있습니다. ‘여러분’이 문맥과 등록에 더 적합합니다.
  revised_text: 여러분은 나를 「스승님」과 「주님」[a]이라고 부릅니다. 그렇게 말하는 것이 옳습니다. 내가 그러하기 때문입니다.
