id: JHN.13.13
reference: John 13:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
  footnotes:
  - marker: a
    text: Or 'Master.' Greek kyrios can denote authority or lordship; here 'Lord' is retained as the default title rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 나를 「스승님」과 「주님」이라고 부릅니다. 그리고 옳게 말합니다. 내가 바로 그이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς φωνεῖτέ με
  english_pob_choice: You call me
  chosen_korean: 당신들은 나를 …이라고 부릅니다
  alternatives_korean:
  - 당신들은 나를 …이라고 말합니다
  - 당신들은 나를 …이라고 호칭합니다
  lexicon: BDAG
  rationale: φωνέω는 이 문맥에서 예수에게 붙이는 칭호를 ‘부르다’로 직접 재현하는 것이 자연스럽고, 호칭을 소개하는 동사의 직접성을 잘 살립니다.
- source_word: Ὁ διδάσκαλος
  english_pob_choice: Teacher
  chosen_korean: 스승님
  alternatives_korean:
  - 선생님
  - 교사
  lexicon: BDAG
  rationale: 예수의 제자-스승 관계를 한국어에서 가장 자연스럽게 드러내는 호칭으로 ‘스승님’을 택했습니다. ‘선생님’보다 제자도 맥락이 더 분명하고, ‘교사’는 직책명으로 들리기 쉽습니다.
- source_word: Ὁ κύριος
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인님
  - 주군
  lexicon: BDAG
  rationale: 기본 용례에 따라 κύριος는 예수께 붙는 호칭으로 ‘주님’을 유지했습니다. ‘주인님’은 사회적 소유 관계 뉘앙스를 과도하게 만들고, ‘주’는 호칭으로서 한국어 문장 안에서 덜 자연스럽습니다.
- source_word: καλῶς λέγετε
  english_pob_choice: you speak rightly
  chosen_korean: 옳게 말합니다
  alternatives_korean:
  - 바르게 말합니다
  - 맞게 말합니다
  - 정당하게 말합니다
  lexicon: BDAG
  rationale: καλῶς는 단순한 ‘잘’보다 판단의 정확성을 드러내는 ‘옳게’가 더 적절합니다. λέγετε는 ‘말합니다’로 옮겨, 예수의 인정을 직설적으로 살렸습니다.
- source_word: εἰμὶ γάρ
  english_pob_choice: for I am
  chosen_korean: 내가 바로 그이기 때문입니다
  alternatives_korean:
  - 내가 그러하기 때문입니다
  - 내가 바로 그렇기 때문입니다
  - 내가 바로 그입니다
  lexicon: BDAG
  rationale: 문맥상 예수의 자기 동일시를 한국어로 분명하게 드러내되, 헬라어의 간결한 자기 선언을 지나치게 풀지 않도록 ‘바로 그이’로 압축했습니다.
theological_decisions:
- issue: 예수의 κύριος 자기 호칭 수용
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 스승
  rationale: 이 절은 제자들의 호칭을 예수가 승인하는 장면이므로, 전통적이되 본문 의미를 약화하지 않는 ‘주님’을 유지했습니다. 이는 예수의 권위와 정체성을 함께 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
