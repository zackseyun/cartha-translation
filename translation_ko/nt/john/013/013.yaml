  - 스승
  rationale: 이 절은 제자들의 호칭을 예수가 승인하는 장면이므로, 전통적이되 본문 의미를 약화하지 않는 ‘주님’을 유지했습니다. 이는 예수의 권위와 정체성을 함께 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
