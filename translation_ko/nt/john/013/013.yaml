  source_fidelity: 핵심 호칭인 διδάσκαλος와 κύριος를 각각 ‘스승님’과 ‘주님’으로 옮긴 것은 적절합니다. 그러나 εἰμὶ γάρ의 생략된 보어는 앞의 두 호칭을 가리키므로 ‘내가 바로 그이기 때문입니다’보다는 이를 자연스럽게 되받는 ‘내가 그러하기 때문입니다’가 더 정확합니다. ‘그이’는 한국어에서 부자연스럽고 불필요하게 인칭·성별 지시를 덧붙입니다.
  naturalness: ‘당신들’은 현대 표준 한국어에서 대면 خطاب으로 날카롭거나 거리감 있게 들릴 수 있으므로, 제자들을 향한 합쇼체 발화에는 ‘여러분’이 자연스럽습니다. 또한 ‘그리고 옳게 말합니다’는 한국어 관용상 어색하므로 ‘그렇게 말하는 것이 옳습니다’로 다듬는 것이 자연스럽습니다.
  terminology: ‘스승님’은 διδάσκαλος의 제자-스승 관계를 잘 나타내며, ‘주님’은 κύριος의 본문상 칭호 기능과 한국어 성경 용례를 보존합니다. 영어 감사 기록의 ‘Master’ 대안은 한국어에서는 ‘주인’으로 제시할 수 있으나, 본문 칭호로는 ‘주님’을 유지하는 것이 적절합니다.
