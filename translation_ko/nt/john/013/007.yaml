  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 다만 μετὰ ταῦτα를 ‘나중에는’으로만 옮기면 지시어 ταῦτα(‘이 일들/이러한 일들’)가 사라집니다. ‘이 일들이 있은 뒤에는’은 시간적 범위를 특정하지 않으면서도 원문의 지시성을 더 잘 보존합니다.
  naturalness: 현행 문장은 서술어가 합쇼체인데 주어가 ‘너는’이어서 목표로 한 현대 정중체와 어울리지 않습니다. 한국어에서는 이 문맥의 2인칭 주어를 생략하는 것이 가장 자연스럽고, 존대 관계를 부자연스럽게 설정하지도 않습니다.
  terminology: 현행 각주 a는 그리스어의 서로 다른 두 동사를 ‘알다’와 ‘이해하다’로 표현한다고 말하지만, 본문은 두 경우 모두 ‘알다’ 계열로 번역합니다. 각주를 실제 번역 및 어휘상의 차이에 맞게 고쳐야 합니다.
  issues:
  - severity: medium
    issue: 각주 a가 본문 번역과 일치하지 않습니다.
