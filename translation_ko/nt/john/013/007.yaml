source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
  footnotes:
  - marker: a
    text: Or “you do not know now … but you will know later.” The Greek uses two different verbs, one often rendered “know” and the other “come to know/understand.”
    reason: lexical_alternative
  - marker: b
    text: “After these things” may refer to what follows in this episode or, more broadly, to later events that would clarify Jesus’ action.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그에게 대답하여 말씀하셨습니다. “내가 하고 있는 일을 지금은 알지 못하지만, 이 일들이 있은 뒤에는[b] 알게 될 것입니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 현재의 ‘알지 못하다’와 미래의 ‘알게 되다’에 서로 다른 동사를 사용합니다. 후자는 ‘이해하게 되다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 일들이 있은 뒤’는 이 장면에서 이어지는 일들을 가리킬 수도 있고, 예수님의 행동을 밝혀 줄 더 넓은 후속 사건들을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말씀하셨습니다
  alternatives_korean:
