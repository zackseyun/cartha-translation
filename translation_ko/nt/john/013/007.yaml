id: JHN.13.7
reference: John 13:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
  footnotes:
  - marker: a
    text: Or “you do not know now … but you will know later.” The Greek uses two different verbs, one often rendered “know” and the other “come to know/understand.”
    reason: lexical_alternative
  - marker: b
    text: “After these things” may refer to what follows in this episode or, more broadly, to later events that would clarify Jesus’ action.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그에게 대답하여 말씀하셨습니다. "내가 하고 있는 일을 너는 지금 알지 못하지만, 나중에는 알게 될 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알다’와 ‘이해하다’는 그리스어에서 서로 다른 동사로 표현되어, 현재의 인식 부족과 이후의 이해 획득을 구분합니다.
    reason: lexical_alternative
  - marker: b
    text: “나중에는”은 ‘이런 일 뒤에’라는 문자적 표현을 풀어 옮긴 것으로, 그 범위는 이 장면 직후일 수도 있고 더 넓은 때를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말씀하셨습니다
  alternatives_korean:
  - 대답하시며 말씀하셨습니다
  - 대답하고 말씀하셨습니다
  lexicon: SBLGNT / BDAG
  rationale: 그리스어의 두 동사 연속을 자연스러운 한국어로 압축하되, 응답과 발화를 함께 드러내는 형태를 택했습니다.
- source_word: Ὃ ἐγὼ ποιῶ
  english_pob_choice: What I am doing
  chosen_korean: 내가 하고 있는 일
  alternatives_korean:
  - 내가 하는 것
  - 내가 하고 있는 것
  lexicon: BDAG
  rationale: 현재 진행 중인 예수의 행위를 살리기 위해 동작성을 가진 표현으로 옮겼습니다.
- source_word: οἶδας
  english_pob_choice: know
  chosen_korean: 알지 못하지만
  alternatives_korean:
  - 이해하지 못하지만
  - 모르지만
  lexicon: BDAG
  rationale: 영어 POB가 보존한 현재의 미지/인지를 한국어에서도 '알다' 계열로 유지해, 뒤의 γνώσῃ와의 대비를 살렸습니다.
- source_word: γνώσῃ
  english_pob_choice: you will understand
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 이해하게 될 것입니다
  - 알게 되실 것입니다
  lexicon: BDAG
  rationale: 미래의 인식 획득을 자연스러운 한국어로 풀어, 현재의 '알지 못함'과의 대조를 분명히 했습니다.
theological_decisions:
- issue: ‘after these things’의 범위
  chosen_reading: “나중에는”으로 옮겨, 발 씻김 직후의 설명일 수도 있고 더 넓은 수난·부활 이후의 이해일 수도 있는 여지를 남겼습니다.
  alternative_readings:
  - 이런 일 뒤에
  - 이 일들이 있은 후에
  rationale: 그리스어 μετὰ ταῦτα는 시간 범위를 단정하지 않으므로, 번역도 해석을 고정하지 않도록 열어 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
