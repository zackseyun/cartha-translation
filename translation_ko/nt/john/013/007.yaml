  lexicon: SBLGNT / BDAG
  rationale: 그리스어의 두 동사 연속을 자연스러운 한국어로 압축하되, 응답과 발화를 함께 드러내는 형태를 택했습니다.
- source_word: Ὃ ἐγὼ ποιῶ
  english_pob_choice: What I am doing
  chosen_korean: 내가 하고 있는 일
  alternatives_korean:
  - 내가 하는 것
  - 내가 하고 있는 것
  lexicon: BDAG
  rationale: 현재 진행 중인 예수의 행위를 살리기 위해 동작성을 가진 표현으로 옮겼습니다.
- source_word: οἶδας
  english_pob_choice: know
  chosen_korean: 알지 못하지만
  alternatives_korean:
  - 이해하지 못하지만
  - 모르지만
  lexicon: BDAG
  rationale: 영어 POB가 보존한 현재의 미지/인지를 한국어에서도 '알다' 계열로 유지해, 뒤의 γνώσῃ와의 대비를 살렸습니다.
- source_word: γνώσῃ
  english_pob_choice: you will understand
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 이해하게 될 것입니다
  - 알게 되실 것입니다
  lexicon: BDAG
  rationale: 미래의 인식 획득을 자연스러운 한국어로 풀어, 현재의 '알지 못함'과의 대조를 분명히 했습니다.
theological_decisions:
- issue: ‘after these things’의 범위
  chosen_reading: “나중에는”으로 옮겨, 발 씻김 직후의 설명일 수도 있고 더 넓은 수난·부활 이후의 이해일 수도 있는 여지를 남겼습니다.
  alternative_readings:
  - 이런 일 뒤에
  - 이 일들이 있은 후에
  rationale: 그리스어 μετὰ ταῦτα는 시간 범위를 단정하지 않으므로, 번역도 해석을 고정하지 않도록 열어 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
