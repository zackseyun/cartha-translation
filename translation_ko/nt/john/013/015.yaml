review_pass:
  verdict: revise
  source_fidelity: ‘행하게 하려는 것입니다’는 ἵνα의 목적을 대체로 반영하지만, 한국어에서는 예수님이 제자들을 직접 ‘행하게 만든다’는 사역적 뉘앙스로 들릴 수 있습니다. ‘너희도 행하도록 하기 위해서입니다’가 목적과 제자들의 상응하는 행위를 더 충실히 드러냅니다. ὑμῖν은 문맥상 ‘너희에게’로 옮기는 것이 안전하며, ‘너희를 위해’는 가능한 문맥적 대안으로만 각주에서 제시합니다.
  naturalness: 초안은 ‘내가 … 보였으니’와 ‘…하려는 것입니다’의 결합이 다소 어색하고, 지정된 합쇼체에 완전히 맞지 않습니다. ‘내가 너희에게 본을 보인 것은 … 하기 위해서입니다’는 현대 표준어의 자연스러운 합쇼체입니다.
  terminology: ‘본’은 ὑπόδειγμα의 모방을 위한 예라는 뜻을 자연스럽고 간결하게 전달합니다. ‘행한 것처럼’도 ποιέω의 넓은 의미를 유지하며 발 씻김의 문맥에 잘 맞습니다.
  issues:
  - severity: medium
    issue: 목적절 표현이 사역적 의미로 들릴 수 있음
    rationale: ‘너희도 행하게 하려는 것입니다’는 제자들이 스스로 예수님의 본을 따라 행한다는 ἵνα + 접속법의 목적을, 예수님이 그들을 행위자로 만든다는 뜻으로 오해하게 할 수 있습니다.
  - severity: low
    issue: 본문의 종결 문체가 합쇼체와 불일치함
    rationale: ‘보였으니’와 ‘것처럼’ 자체는 인용문 안에서 가능하지만, 전체를 지정된 현대 공식-공손체로 일관되게 제시하려면 ‘보인 것은 … 위해서입니다’가 더 적절합니다.
  - severity: low
    issue: 각주 b와 c의 연결 위치 및 설명을 명료화할 필요가 있음
    rationale: b는 ‘행한’의 번역 선택을, c는 ὑμῖν의 문맥적 이해를 설명하므로 각각 해당 어구에 직접 붙이고, ‘위해’는 본문이 아니라 대안임을 분명히 하는 편이 좋습니다.
