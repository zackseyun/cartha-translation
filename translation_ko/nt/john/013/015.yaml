  rationale: 문장을 ‘본을 보인 것은 … 하기 위해서입니다’로 재구성하여 γάρ의 설명 관계와 ἵνα의 목적을 자연스러운 합쇼체로 명확히 표현했습니다. ‘너희에게 행한 것처럼’은 원문의 여격과 발 씻김의 직접적 대상을 보존하고, 가능한 수혜적 이해는 각주에 제한했습니다. 교회 의식이나 상징성에 관한 해석은 덧붙이지 않았습니다.
