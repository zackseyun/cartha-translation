  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
  footnotes:
  - marker: a
    text: Or 'a pattern' or 'a model.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I gave you an example.' The Greek uses a simple past form; English 'have given' brings out its present relevance in context.
    reason: lexical_alternative
  - marker: c
    text: Or 'I have done to you.' Here 'for you' reflects the benefactive sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희에게 본[a]을 보인 것은, 내가 너희에게[c] 행한 것처럼[b] 너희도 행하도록 하기 위해서입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예’나 ‘모범’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 너희에게 한 것처럼’. 여기서는 문맥상의 행위를 드러내기 위해 ‘행한’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘너희를 위해 행한 것처럼’. 이곳의 여격은 문맥상 예수님이 행하신 대상인 제자들을 가리키며, 그 행위의 유익을 함께 시사할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  english_pob_choice: an example
  chosen_korean: 본
  alternatives_korean:
  - 예
  - 모범
  - 본보기
  lexicon: BDAG
  rationale: ὑπόδειγμα은 따라 하도록 제시된 본보기나 모범을 뜻하므로, 현대 한국어에서는 자연스럽고 간결한 ‘본’을 택해 예수님의 행위가 모방의 기준임을 살렸습니다.
- source_word: γὰρ
  english_pob_choice: For
  chosen_korean: -니
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - for
  lexicon: BDAG
  rationale: γάρ의 설명적 연결을 한국어에서는 앞절과 이어지는 종결 어미로 처리해 자연스럽게 “내가 … 본을 보였으니”로 옮겼습니다.
- source_word: ἔδωκα
  english_pob_choice: I have given
  chosen_korean: 본을 보였으니
  alternatives_korean:
  - 본을 주었으니
  - 예를 주었으니
  lexicon: BDAG
  rationale: 동사의 완료적 현재 관련성을 한국어 완료 표현으로 과장하지 않고, 발화 직후의 행위를 가리키는 자연스러운 서술인 ‘본을 보였으니’로 풀었습니다.
- source_word: καθὼς ἐγὼ ἐποίησα ὑμῖν
  english_pob_choice: just as I have done for you
  chosen_korean: 내가 너희에게 행한 것처럼
  alternatives_korean:
  - 내가 너희를 위해 한 것처럼
  - 내가 너희에게 한 것처럼
  lexicon: BDAG
  rationale: καθώς의 대응 관계를 ‘…것처럼’으로 살리고, ἐποίησα ὑμῖν은 문맥상 발을 씻기신 행위 전체를 가리키므로 단순한 ‘해 준 것처럼’보다 ‘행한 것처럼’이 더 정확합니다.
- source_word: ποιῆτε
  english_pob_choice: may do
  chosen_korean: 행하게 하려는 것입니다
  alternatives_korean:
  - 행하게 하십니다
  - 행하도록 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα + 접속법은 목적을 나타내므로, 단순 명령으로 과도하게 옮기지 않고 예수님의 의도를 드러내는 ‘행하게 하려는 것입니다’로 번역했습니다.
theological_decisions:
- issue: 예수님의 발 씻김을 따르라는 요구의 성격
  chosen_reading: 본문이 말하는 핵심은 예수님의 행위를 제자들이 본받아 실제로 행해야 한다는 모범성입니다.
  alternative_readings:
  - 모든 신자에게 동일한 의식으로 제정된 명령
  - 단지 상징적 가르침일 뿐 실제 모방은 요구되지 않음
  rationale: 본문 자체가 ‘본을 보였으니… 너희도 행하게 하려는 것’이라고 말하므로, 해석을 의식 제정이나 단순 상징으로 좁히지 않고 모범적 요구를 그대로 살렸습니다.
  doctrine_reference: Affirmations; Translation philosophy §1, §3
