id: JHN.13.32
reference: John 13:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
  footnotes:
  - marker: a
    text: Or, 'Since God was glorified in him.' The Greek uses εἰ ('if'), though in context the condition is likely assumed as true.
    reason: alternative_reading
  - marker: b
    text: Or, 'in himself' may be understood as 'with himself' or 'by himself'; the Greek expression is compact and theologically dense.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 그 안에서 영광을 받으셨다면[a], 하나님께서도 자기 안에서[b] 그를 영광스럽게 하실 것이며, 곧 그를 영광스럽게 하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 그 안에서 영광을 받으셨으므로.’ 헬라어는 εἰ(‘if’)를 쓰지만, 문맥상 그 조건이 사실로 전제된 것으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘자기 안에서’는 ‘자기와 함께’ 또는 ‘자기로 말미암아’로도 이해할 수 있습니다. 헬라어 표현은 압축적이며 신학적으로 함축이 깊습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  english_pob_choice: If
  chosen_korean: -라면
  alternatives_korean:
  - -이면
  - -다면
  - -이므로
  lexicon: BDAG
  rationale: 조건절의 형식을 살려 ‘-라면’으로 옮겼습니다. 문맥상 사실로 전제된 뉘앙스가 있지만, 본문의 εἰ를 해석해 ‘-이므로’로 확정하지는 않았습니다.
- source_word: ἐδοξάσθη
  english_pob_choice: was glorified
  chosen_korean: 영광을 받으셨다면
  alternatives_korean:
  - 영광스럽게 되었다면
  - 영광을 얻으셨다면
  lexicon: BDAG
  rationale: 수동형 δοξάζω를 한국어에서 자연스럽게 드러내기 위해 ‘영광을 받다’로 옮겼습니다. 하나님의 행위에 대한 수동형을 그대로 보존하면서도 문맥에 맞는 표현입니다.
- source_word: ἐν αὐτῷ / ἐν ἑαυτῷ
  english_pob_choice: in him / in himself
  chosen_korean: 그 안에서 / 자기 안에서
  alternatives_korean:
  - 그를 통하여 / 자기로 말미암아
  - 그 안에 / 자신 안에
  lexicon: BDAG
  rationale: ἐν을 기본값인 ‘-안에서’로 유지해 요한복음의 밀도 있는 표현을 살렸습니다. δεύτερη 구절의 반사대명사는 하나님을 가리키므로 ‘자기 안에서’가 가장 직접적입니다.
- source_word: εὐθύς
  english_pob_choice: at once
  chosen_korean: 곧 그렇게 하실 것입니다
  alternatives_korean:
  - 즉시 그렇게 하실 것입니다
  - 바로 그렇게 하실 것입니다
  lexicon: BDAG
  rationale: εὐθύς의 즉시성을 한국어에서 자연스럽게 살리기 위해 문장 끝에 ‘곧’의 의미를 반영했습니다. 앞의 미래형과 결합해 반복을 피하면서도 긴박감을 유지합니다.
theological_decisions:
- issue: εἰ의 조건문을 ‘since’로 풀지 여부
  chosen_reading: 본문의 조건형을 유지해 ‘-라면’으로 번역했습니다.
  alternative_readings:
  - ‘-이므로’
  - ‘이미 영광을 받으셨으니’
  rationale: 문맥상 사실로 전제된 의미가 강하지만, 원문은 여전히 εἰ를 사용합니다. 해석을 앞서 확정하기보다 본문의 조건적 형식을 보존해 독자가 문맥에서 확신을 읽도록 했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
