  source_fidelity: 본문의 시간·목적 구조는 대체로 잘 반영했으나, ἐγώ εἰμι에 없는 명사 ‘사람’을 보충한 ‘내가 그 사람임을’은 절대적 자기 계시 표현의 의도적 미완결성과 가능한 함의를 지나치게 한정합니다.
  naturalness: ‘말하는 것은 … 하려는 것입니다’라는 구성은 이해 가능하고 합쇼체에도 맞습니다. 다만 ‘그 사람’은 이 문맥에서 자연스러운 한국어 자기 식별이라기보다 불필요하게 특정 인물을 가리키는 표현처럼 들립니다.
  terminology: πιστεύσητε는 ‘믿게’로 적절히 옮겼습니다. ἐγώ εἰμι는 본문에서 ‘내가 그임을’으로 번역하고, 그리스어에 ‘그’에 해당하는 말이 없다는 점과 더 문자적인 읽기를 각주에 밝혀 번역상의 긴장을 보존하는 것이 적절합니다.
