  to: 지금부터 그 일이 일어나기 전에 내가 여러분에게 말하는 것은, 그 일이 일어날 때 여러분이 내가 그임을 믿게 하려는 것입니다.[a]
  rationale: ‘그 사람’을 ‘그’로 고쳐 원문에 없는 명사 보충을 최소화했습니다. 각주는 직역 가능성을 유지하되, 본문의 ‘그’가 그리스어에 명시되어 있지 않음을 밝혀 ἐγώ εἰμι의 문법적·신학적 긴장을 보존합니다. 시간 표현, 사건의 반복 지시, 목적절 및 합쇼체는 유지했습니다.
