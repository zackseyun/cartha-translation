id: JHN.13.19
reference: John 13:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
  footnotes:
  - marker: a
    text: Or more literally, 'that I am.' The Greek expression may also echo divine self-identification in Isaiah and elsewhere in John.
    reason: alternative_reading
translation:
  language: ko
  text: 지금부터 그 일이 일어나기 전에 내가 여러분에게 말하는 것은, 그 일이 일어날 때 여러분이 내가 그임을 믿게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에는 ‘그’에 해당하는 말이 없습니다. 또는 더 문자적으로는 ‘내가 있다’입니다. 이 그리스어 표현은 이사야와 요한복음의 다른 곳에 나오는 신적 자기 계시를 반향할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  english_pob_choice: From now on
  chosen_korean: 지금부터
  alternatives_korean:
  - 이제부터
  - 이 순간부터
  lexicon: BDAG
  rationale: 현재 시점에서 앞으로를 가리키는 관용적 표현이므로, 자연스러운 현대 한국어로 ‘지금부터’가 가장 직접적입니다.
- source_word: λέγω ὑμῖν
  english_pob_choice: I am telling you
  chosen_korean: 내가 여러분에게 말하는 것은
  alternatives_korean:
  - 내가 여러분에게 말합니다
  - 내가 너희에게 말하는 것은
  lexicon: BDAG
  rationale: 직접 화법의 현재 진행적 말하기를 살리면서도, 문장 전체를 목적절과 연결하기 위해 한국어에서는 설명적 연결구를 택했습니다.
- source_word: πρὸ τοῦ γενέσθαι
  english_pob_choice: before it happens
  chosen_korean: 그 일이 일어나기 전에
  alternatives_korean:
  - 그것이 일어나기 전에
  - 그 일이 이루어지기 전에
  lexicon: BDAG
  rationale: 특정 사건을 가리키는 불특정 대명사적 표현을 한국어에서 ‘그 일’로 풀어 주어 자연스럽게 옮겼습니다.
- source_word: ὅτι ἐγώ εἰμι
  english_pob_choice: that I am he
  chosen_korean: 내가 그 사람임을
  alternatives_korean:
  - 내가 그임을
  - 내가 곧 나임을
  lexicon: BDAG
  rationale: 요한복음의 절대적 ἐγώ εἰμι는 단순한 자기지시를 넘는 여지가 있으므로, 영어 POB처럼 문맥상 알아들을 수 있는 자기 식별로 옮기되, 신학적 긴장은 살려 둡니다.
theological_decisions:
- issue: ἐγώ εἰμι의 요한복음적 뉘앙스와 가능한 신적 자기계시 암시
  chosen_reading: 내가 그 사람임을 믿게 하려는 것입니다
  alternative_readings:
  - 내가 나임을 믿게 하려는 것입니다
  - 내가 그임을 믿게 하려는 것입니다
  rationale: 한국어 본문에서는 즉시 이해되는 자기 식별을 택하되, 절대형 표현이 지닌 신학적 울림을 지나치게 해소하지 않도록 추상적 인칭 대명사를 피했습니다.
  doctrine_reference: 요한복음의 자기계시 표현은 과도하게 평준화하지 않고 번역상의 긴장을 보존해야 합니다.
