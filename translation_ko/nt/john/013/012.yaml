  source_fidelity: 원문의 시간 연결(Ὅτε)과 서술 진행을 나타내는 οὖν, 발을 씻은 뒤 옷을 다시 입고 식사 자세로 돌아간 순서를 충실히 반영할 수 있습니다. ἔλαβεν은 문맥상 ‘다시 입으시고’로 자연스럽게 옮길 수 있으나, πάλιν은 ‘또 다시’가 아니라 ‘다시’이면 충분합니다. ὑμῖν은 ‘너희에게’로 두어 ‘너희를 위하여’라는 가능한 수혜적 뉘앙스를 각주에서 밝혀 모호성을 보존합니다.
  naturalness: ‘그런즉’은 현대 표준어 합쇼체 본문에서는 다소 문어적·고풍스럽습니다. ‘그러므로’와 ‘…하신 뒤에’를 사용하고, ‘비스듬히 기대어 앉으신’은 고대 식사 자세를 유지하되 불필요한 ‘또’를 제거하면 자연스럽습니다.
