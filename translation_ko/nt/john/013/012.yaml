id: JHN.13.12
reference: John 13:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
  footnotes:
  - marker: a
    text: Or, more literally, 'sat down again'; the Greek verb refers to reclining at table.
    reason: lexical_alternative
  - marker: b
    text: Or 'what I have done to you'; the Greek dative can be rendered either way, though 'for you' best fits the context of service.
    reason: alternative_reading
translation:
  language: ko
  text: 그런즉 그들의 발을 씻기시고 자기 옷들을 다시 입으시고 또 다시 비스듬히 기대어 앉으신 뒤에 그들에게 말씀하셨습니다. "내가 너희에게 한 일을 이해합니까?"[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다시 기대어 누우셨다’에 가깝습니다. 여기서는 식탁에 비스듬히 기대는 당시 식사 자세를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희에게’는 문법적으로 가능하지만, 문맥상 예수의 봉사와 유익의 뉘앙스가 더 잘 드러납니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  english_pob_choice: So when
  chosen_korean: 그런즉 … 뒤에
  alternatives_korean:
  - 그때 …
  - 그러므로 …
  lexicon: BDAG
  rationale: Ὅτε의 시간 연결과 οὖν의 서술 진행/결과 감각을 함께 살리기 위해 ‘그런즉’과 뒤이어지는 시간절 구조를 사용했습니다.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  english_pob_choice: taken his garments
  chosen_korean: 자기 옷들을 다시 입으시고
  alternatives_korean:
  - 자기 옷들을 취하시고
  - 자기 겉옷을 다시 입으시고
  lexicon: BDAG
  rationale: ἱμάτια는 여기서 예수의 옷차림 전체를 가리키므로 ‘옷들’로 옮기되, 발 씻김 장면의 동작 흐름을 드러내기 위해 ‘다시 입으시고’로 자연스럽게 표현했습니다.
- source_word: ἀνέπεσεν
  english_pob_choice: reclined again
  chosen_korean: 또 다시 비스듬히 기대어 앉으신
  alternatives_korean:
  - 또 다시 앉으신
  - 다시 식탁에 자리를 잡으신
  lexicon: BDAG
  rationale: 식사 자리의 고대적 자세를 반영하여 ‘비스듬히 기대어 앉으신’으로 옮겼습니다. 단순한 ‘앉으셨습니다’보다 본문의 식사 장면을 더 정확히 드러냅니다.
- source_word: Γινώσκετε τί πεποίηκα ὑμῖν;
  english_pob_choice: Do you understand what I have done for you?
  chosen_korean: 내가 너희에게 한 일을 이해합니까?
  alternatives_korean:
  - 내가 너희에게 한 것을 아십니까?
  - 내가 너희를 위하여 한 일을 이해합니까?
  lexicon: BDAG
  rationale: γινώσκετε는 단순 인지보다 의미 파악을 묻는 뉘앙스가 강하므로 ‘이해합니까’로 옮겼고, ὑμῖν은 문맥상 수혜/봉사 뉘앙스를 살리되 한국어에서는 간결하게 처리했습니다.
theological_decisions:
- issue: ὑμῖν의 방향성
  chosen_reading: ‘너희에게 한 일’로 옮겨, 예수의 행위가 제자들을 향한 봉사이자 그들 유익을 위한 행동임을 드러냈습니다.
  alternative_readings:
  - 너희에게 한 것
  - 너희를 위하여 한 일
  rationale: 본문의 질문은 행위의 단순 대상보다 의미와 목적을 묻기 때문에, 한국어에서는 문맥상 자연스러운 수혜 의미를 살리는 편이 좋습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: ἀνέπεσεν의 식사 자세
  chosen_reading: ‘비스듬히 기대어 앉으신’으로 처리해 고대 만찬의 자세를 보존했습니다.
  alternative_readings:
  - 앉으신
  - 자리에 다시 앉으신
  rationale: 도상적·문화적 정보를 제거하지 않고 본문의 장면성을 유지하기 위한 번역 선택입니다.
  doctrine_reference: Translation philosophy §1, §6
