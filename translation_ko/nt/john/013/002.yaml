  source_fidelity: 원문의 미완결된 종속 상황절(속격 절대구문)을 유지해야 합니다. 현 번역의 ‘때였습니다’는 이를 독립된 완결문으로 바꾸며, ‘유다, 곧 시몬 이스카리옷의 아들’은 그리스어의 속격 관계를 ‘시몬 이스카리옷의 아들’로 잘못 분석합니다. 원문은 ‘시몬 이스카리옷의 아들 유다’라는 식별을 나타냅니다. 또한 ἵνα παραδοῖ의 행위 주체는 유다이므로 이를 문장에 분명히 드러내는 것이 안전합니다.
  naturalness: ‘만찬이 진행되는 동안’과 ‘마음에 … 생각을 넣어 두었을 때에’는 현대 표준 한국어에서 자연스럽고, 원문의 진행 중인 상황 및 완료된 선행 작용을 잘 나타냅니다. 절이 다음 절에 이어지는 원문 구조이므로 문장 끝 쉼표를 유지합니다.
