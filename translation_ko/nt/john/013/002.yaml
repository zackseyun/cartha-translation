id: JHN.13.2
reference: John 13:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
  footnotes:
  - marker: a
    text: Or 'while supper was taking place.' The Greek does not mean that the supper had already ended.
    reason: lexical_alternative
  - marker: b
    text: Or 'had already prompted.' Literally, 'had already put into the heart.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to hand him over.' In this context, 'betray' brings out the force of the expression.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 만찬이 진행되는 동안, 마귀가 이미 시몬 이스카리옷의 아들 유다의 마음에 유다가 그를 넘겨주려는 생각을 넣어 두었을 때에,[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만찬이 진행되는 동안’은 만찬이 이미 끝났다는 뜻이 아니라, 만찬이 진행 중이었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이미 마음에 넣어 두었을 때에’입니다.
    reason: source_note
  - marker: c
    text: ‘그를 넘겨주다’는 문맥상 ‘그를 배반하다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ δείπνου γινομένου
  english_pob_choice: during supper
  chosen_korean: 만찬 중에
  alternatives_korean:
  - 식사 중에
  - 만찬이 진행되는 동안
  lexicon: BDAG
  rationale: γενόμενου는 ‘끝난 뒤’가 아니라 동시적 상황을 나타내므로, 자연스럽고 간결한 ‘만찬 중에’로 옮겼습니다.
- source_word: τοῦ διαβόλου
  english_pob_choice: the devil
  chosen_korean: 마귀
  alternatives_korean:
  - 악마
  - 사탄
  lexicon: BDAG
  rationale: 여기서는 인격적 악한 존재를 가리키므로, 한국어 성경에서 널리 통용되는 ‘마귀’가 가장 직접적입니다.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  english_pob_choice: had already put it into the heart
  chosen_korean: 이미 … 마음에 … 넣었을 때였습니다
  alternatives_korean:
  - 이미 … 마음속에 … 넣었을 때였습니다
  - 이미 … 마음에 … 넣어 두었을 때였습니다
  lexicon: BDAG
  rationale: ‘마음’은 헬라어 καρδία의 인간 내면 전체를 살리며, ‘넣다’는 비유를 유지해 ‘촉발하다’보다 원문 이미지를 더 투명하게 드러냅니다.
- source_word: παραδοῖ αὐτὸν
  english_pob_choice: to betray him
  chosen_korean: 그를 넘겨주려는
  alternatives_korean:
  - 그를 배반하려는
  - 그를 배신하려는
  lexicon: BDAG
  rationale: παραδίδωμι의 핵심은 ‘넘겨주다’이지만, 유다 문맥에서는 그 행위가 배반의 성격을 띠므로 ‘넘겨주려는’으로 옮겨 원뜻과 문맥 효과를 함께 살렸습니다.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  english_pob_choice: Judas Iscariot, Simon's son
  chosen_korean: 유다, 곧 시몬 이스카리옷의 아들
  alternatives_korean:
  - 시몬 이스카리옷의 아들 유다
  - 유다 이스카리옷, 시몬의 아들
  lexicon: BDAG
  rationale: 그리스어 어순대로 유다를 먼저 제시하고, 이어서 ‘시몬 이스카리옷의 아들’이라는 친족 표지를 붙여 오해 없이 인물 식별을 살렸습니다.
theological_decisions:
- issue: 사탄적 영향과 유다의 책임
  chosen_reading: 마귀가 유다의 마음에 생각을 넣었지만, 유다가 그 행위를 하게 되는 주체성은 지우지 않는 표현으로 유지했습니다.
  alternative_readings:
  - 마귀가 유다를 부추겼습니다
  - 마귀가 유다를 통해 결정하게 했습니다
  rationale: 원문은 악한 영향과 인간 행위의 책임을 함께 둡니다. 번역도 어느 한쪽으로 단순화하지 않고 그 긴장을 보존해야 합니다.
  doctrine_reference: 악한 영향 아래서도 인간 책임을 보존
