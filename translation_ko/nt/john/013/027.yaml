id: JHN.13.27
reference: John 13:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
  footnotes:
  - marker: a
    text: Or 'the morsel.' The Greek ψωμίον refers to a small piece of food, here likely the dipped bread given during the meal.
    reason: lexical_alternative
  - marker: b
    text: Or 'do quickly.' The Greek τάχιον is comparative ('more quickly'), though many English versions smooth it to 'quickly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 빵 조각 뒤에, 사탄이 그에게 들어갔습니다. 그러자 예수께서 그에게 말씀하셨습니다. 「네가 하는 일을 더 빨리 하시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한입’. 여기서 ψωμίον은 식사 자리에서 건네진 작은 빵 조각을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더 속히 하시오’. τάχιον은 비교급으로 ‘더 빨리’의 뜻이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  english_pob_choice: the piece of bread
  chosen_korean: 빵 조각
  alternatives_korean:
  - 한 조각의 빵
  - 모퉁이빵 조각
  - 한입
  lexicon: BDAG
  rationale: 작은 음식 조각이라는 뜻을 살리되, 현대 한국어에서 자연스럽고 구체적인 표현으로 옮겼습니다. 의례적이거나 고어적인 ‘떡부스러기’류 표현은 피했습니다.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  english_pob_choice: entered into him
  chosen_korean: 그에게 들어갔습니다
  alternatives_korean:
  - 그 안으로 들어갔습니다
  - 그를 사로잡았습니다
  lexicon: BDAG
  rationale: ‘들어가다’의 직접성을 살려, 단순한 영향이나 장악보다 더 강한 침투의 이미지를 유지했습니다.
- source_word: ὁ Σατανᾶς
  english_pob_choice: Satan
  chosen_korean: 사탄
  alternatives_korean:
  - 악마
  - 대적
  lexicon: BDAG
  rationale: 본문의 고유명사적 용법을 따라, 의미 풀이보다 통용되는 이름형 표기를 택했습니다.
- source_word: τάχιον
  english_pob_choice: more quickly
  chosen_korean: 더 빨리
  alternatives_korean:
  - 더 속히
  - 빨리
  lexicon: BDAG
  rationale: 비교급의 뉘앙스를 살려 단순한 ‘빨리’보다 ‘더 빨리’로 옮겼습니다.
theological_decisions:
- issue: 사탄의 ‘들어감’의 성격
  chosen_reading: ‘사탄이 그에게 들어갔습니다’를 그대로 유지해, 본문이 말하는 직접적이고 인격적인 침투를 약화시키지 않았습니다.
  alternative_readings:
  - 사탄이 그를 사로잡았습니다
  - 사탄이 그를 장악했습니다
  rationale: 본문은 설명을 덧붙이지 않고 사건을 진술하므로, 심리적 비유나 교리적 확장으로 완화하지 않았습니다.
  doctrine_reference: 본문이 제시하는 긴장을 보존함
