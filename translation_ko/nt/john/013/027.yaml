- from: 그리고 빵 조각 뒤에, 사탄이 그에게 들어갔습니다. 그러자 예수께서 그에게 말씀하셨습니다. 「네가 하는 일을 더 빨리 하시오.」[a][b]
  to: 그 빵 조각[a]을 받은 뒤에, 그때 사탄이 그에게 들어갔습니다. 그러자 예수께서 그에게 말씀하셨습니다. 「네가 하는 일을 더 빨리[b] 하시오.」
