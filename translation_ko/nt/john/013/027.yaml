  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
  footnotes:
  - marker: a
    text: Or 'the morsel.' The Greek ψωμίον refers to a small piece of food, here likely the dipped bread given during the meal.
    reason: lexical_alternative
  - marker: b
    text: Or 'do quickly.' The Greek τάχιον is comparative ('more quickly'), though many English versions smooth it to 'quickly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 빵 조각[a]을 받은 뒤에, 그때 사탄이 그에게 들어갔습니다. 그러자 예수께서 그에게 말씀하셨습니다. 「네가 하는 일을 더 빨리[b] 하시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음식 한 조각’. 여기서 ψωμίον은 식사 자리에서 건네진 작은 빵 조각을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더 속히 하시오’. τάχιον은 비교급으로 ‘더 빨리’의 뜻이 있습니다.
    reason: lexical_alternative
