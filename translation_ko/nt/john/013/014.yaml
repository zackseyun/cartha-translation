id: JHN.13.14
reference: John 13:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
  footnotes:
  - marker: a
    text: Or 'the Master.' Greek κύριος is rendered 'Lord' here in keeping with its usual title sense and the project's default practice.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 주님이시며 선생이신 내가 너희의 발을 씻어 주었다면, 너희도 서로의 발을 씻어 주어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  english_pob_choice: If ... then
  chosen_korean: 그러므로
  alternatives_korean:
  - 만일 그러면
  - 그러니
  lexicon: BDAG
  rationale: 조건문과 귀결을 함께 담은 논리 전개이므로, 한국어에서는 자연스러운 결론 표지인 ‘그러므로’로 압축해 인과를 분명히 했습니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생
  lexicon: BDAG
  rationale: 예수님의 титular한 κύριος를 한국어 경어 관습에 맞춰 ‘주님’으로 옮기되, 인물의 권위를 약화시키지 않도록 했습니다.
- source_word: ὁ διδάσκαλος
  english_pob_choice: the Teacher
  chosen_korean: 선생
  alternatives_korean:
  - 선생님
  - 스승
  lexicon: BDAG
  rationale: κύριος와 병렬된 호칭이므로 직역에 가까운 ‘선생’을 택해 두 칭호의 구분을 살렸습니다.
- source_word: ἔνιψα ... ὀφείλετε ἀλλήλων νίπτειν
  english_pob_choice: have washed ... ought to wash
  chosen_korean: 발을 씻어 주었으니 ... 발을 씻어 주어야 합니다
  alternatives_korean:
  - 발을 씻었으니 ... 발을 씻어야 합니다
  - 발을 씻어 주었으니 ... 서로 섬겨야 합니다
  lexicon: BDAG
  rationale: νίπτω의 구체적 행위를 그대로 유지해 본문의 표면 의미와 상징성을 지우지 않았고, ὀφείλετε는 도덕적 의무를 나타내므로 ‘-어야 합니다’로 옮겼습니다.
theological_decisions:
- issue: 예수님의 낮아지심과 제자들의 의무를 연결하는 논리
  chosen_reading: 예수님의 신분 호칭을 유지한 채, 그분의 실제 발 씻김이 제자들의 상호 실천 의무를 근거 짓도록 표현했습니다.
  alternative_readings:
  - 예수님의 행동을 일반적 섬김으로 풀어쓰기
  - 의무를 약화시켜 권고로 번역
  rationale: 본문은 상징적 적용을 암시하지만, 실제로는 ‘발을 씻다’라는 구체 행위를 근거로 제자들의 상호 행위를 요구하므로, 그 연결을 희석하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Original-language primacy; never paraphrase beyond what the source warrants'
