id: JHN.13.23
reference: John 13:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
  footnotes:
  - marker: a
    text: Literally, 'in the bosom of Jesus,' an expression describing the position of one reclining next to another at a meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님의 제자들 가운데, 예수님께서 사랑하시는 한 사람이 예수님의 품에 기대어 누워 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘예수님의 품 안에’입니다. 이는 고대의 식사 자리에서 예수님 곁에 기대어 누워 있던 위치를 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  english_pob_choice: was reclining
  chosen_korean: 기대어 누워 있었습니다
  alternatives_korean:
  - 앉아 있었습니다
  - 식탁에 기대어 있었습니다
  - 누워 있었습니다
  lexicon: BDAG
  rationale: 식사 자리의 자세를 가리키는 분사이므로, 고대의 식사 장면을 살리면서도 한국어로 자연스러운 ‘기대어 누워 있었습니다’로 옮겼습니다.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  english_pob_choice: One of his disciples
  chosen_korean: 제자 한 사람
  alternatives_korean:
  - 그의 제자들 중 한 사람
  - 제자들 가운데 한 사람
  lexicon: BDAG
  rationale: 부분을 나타내는 표현이므로, 가장 간결하고 자연스러운 ‘제자 한 사람’으로 처리했습니다.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  english_pob_choice: in Jesus' bosom
  chosen_korean: 예수님의 품에
  alternatives_korean:
  - 예수님의 가슴에
  - 예수님의 옆에
  - 예수님의 품 안에
  lexicon: BDAG
  rationale: κόλπος의 문자적 이미지와 식사 자리에서의 근접한 위치를 함께 살리기 위해 ‘품에’로 옮겼습니다. 한국어에서 ‘품’은 친밀함과 공간적 근접을 모두 전달할 수 있습니다.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  english_pob_choice: whom Jesus loved
  chosen_korean: 예수께서 사랑하시는
  alternatives_korean:
  - 예수님이 사랑하시는
  - 예수께서 사랑하신
  lexicon: BDAG
  rationale: ἀγαπάω는 기본적으로 ‘사랑하다’로 옮기고, 현재 분사적 성격을 살려 관형형 ‘사랑하시는’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 예수님과 제자의 위치를 어떻게 드러낼지
  chosen_reading: 본문에는 문자적 이미지를 살려 ‘예수님의 품에’라고 옮겼습니다.
  alternative_readings:
  - 예수님의 옆에
  - 예수님 곁에
  rationale: 이 구절은 단순한 좌석 배치뿐 아니라 요한복음의 상징적 어조도 함께 지니므로, 원문 이미지를 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
