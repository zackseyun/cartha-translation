  - severity: low
    issue: ‘다 그런 것은 아닙니다’가 정결이라는 술어를 간접적으로 지시합니다.
    rationale: 원문의 ‘그러나 모두는 아니다’는 앞의 ‘너희는 깨끗하다’를 제한합니다. ‘너희 모두가 깨끗한 것은 아닙니다’가 이를 명확하고 자연스럽게 재현합니다.
  - severity: low
    issue: ‘온몸이 깨끗합니다’는 자연스럽지만 원문의 ὅλος가 수식하는 전체적 정결을 신체 표현으로 구체화합니다.
