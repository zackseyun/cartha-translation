id: JHN.13.10
reference: John 13:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
  footnotes:
  - marker: a
    text: 'Greek uses two different washing verbs: λούω (''bathe,'' of washing the whole body) and νίπτω (''wash,'' often of a part such as the feet).'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “목욕한 사람은 발을 씻는 것 외에는 필요하지 않습니다. 그는 온전히 깨끗합니다. 너희도 깨끗합니다. 그러나 너희 모두가 깨끗한 것은 아닙니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 서로 다른 두 씻는 동사를 사용합니다. λούω는 몸 전체를 씻거나 목욕하는 것을 가리키며, νίπτω는 흔히 발처럼 몸의 일부를 씻는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λελουμένος
  english_pob_choice: The one who has bathed
  chosen_korean: 목욕한 사람은
  alternatives_korean:
  - 목욕한 이는
  - 씻은 사람은
  lexicon: BDAG
  rationale: λελουμένος는 λούω의 완료 분사로, 단순한 ‘씻다’보다 몸 전체를 목욕한 완료 상태를 가리키므로 ‘목욕한 사람’으로 살렸습니다.
- source_word: τοὺς πόδας νίψασθαι
  english_pob_choice: to wash his feet
  chosen_korean: 발만 씻으면 되지
  alternatives_korean:
  - 발을 씻으면 되지
  - 발만 씻으면 됩니다
  lexicon: BDAG
  rationale: νίπτω는 전체 목욕과 구별되는 부분 세정을 가리키므로, 본문 대비를 살려 ‘발만 씻으면’으로 옮겼습니다.
- source_word: ὅλος καθαρὸς
  english_pob_choice: completely clean
  chosen_korean: 온몸이 깨끗합니다
  alternatives_korean:
  - 완전히 깨끗합니다
  - 온전히 깨끗합니다
  lexicon: BDAG
  rationale: ὅλος가 청결의 총체성을 강조하므로 ‘온몸’으로 그 전체성을 한국어 자연문으로 드러냈습니다.
- source_word: ἀλλ’ οὐχὶ πάντες
  english_pob_choice: but not all of you
  chosen_korean: 다 그런 것은 아닙니다
  alternatives_korean:
  - 그러나 너희 모두가 그런 것은 아닙니다
  - 하지만 다는 아닙니다
  lexicon: BDAG
  rationale: 직역하면 ‘너희는 깨끗하지만, 다는 아니다’이지만, 문맥상 제자 공동체 안의 예외를 가리키므로 한국어에서 자연스러운 ‘다 그런 것은 아닙니다’로 처리했습니다.
theological_decisions:
- issue: 세족 이미지와 상징적 정결의 긴장 보존
  chosen_reading: ‘목욕한 사람’과 ‘발만 씻으면’의 구분을 유지하고, 본문에 ‘영적으로’ 같은 해설을 덧붙이지 않았습니다.
  alternative_readings:
  - 상징을 풀어 ‘이미 깨끗한 사람’처럼 의역
  - λoύω/νίπτω의 구분을 무시하고 모두 ‘씻다’로 통일
  rationale: 예수님의 말씀은 실제 세정 이미지 위에 제자들의 정결 상태를 겹쳐 놓으므로, 어휘 구분을 유지해 해석적 긴장을 보존하는 것이 본문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
