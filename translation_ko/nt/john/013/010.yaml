revisions:
- from: 예수께서 그에게 말씀하셨습니다. 「목욕한 사람은 발만 씻으면 되지, 온몸이 깨끗합니다. 너희도 깨끗하지만, 다 그런 것은 아닙니다」.[a]
  to: 예수께서 그에게 말씀하셨습니다. “목욕한 사람은 발을 씻는 것 외에는 필요하지 않습니다. 그는 온전히 깨끗합니다. 너희도 깨끗합니다. 그러나 너희 모두가 깨끗한 것은 아닙니다.”[a]
  rationale: 개정문은 λούω의 전신 목욕과 νίπτω의 부분 세정이라는 어휘 대비를 유지합니다. ‘발을 씻는 것 외에는 필요하지 않습니다’는 원문의 ‘필요가 없다, 다만 발을 씻는 것은 예외이다’를 더 가깝게 옮기고 합쇼체를 준수합니다. ‘온전히 깨끗합니다’와 ‘너희 모두가 깨끗한 것은 아닙니다’는 정결의 반복과 집단 안의 예외를 명료하게 보존하며, 상징적 의미를 특정 교리로 해설하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:22:57Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심적인 λούω/νίπτω의 대비와 제자들 가운데 예외가 있다는 뜻은 잘 반영되었습니다. 다만 ‘발만 씻으면 되지’는 원문의 ‘필요가 없다, 다만 발을 씻는 것은 예외이다’라는 구문을 다소 느슨하게 만들며, 합쇼체 문체에도 맞지 않습니다. ‘온몸’은 ὅλος의 전체성을 자연스럽게 드러낼 수 있으나, 원문이 직접 말하는 술어는 ‘온전히 깨끗하다’이므로 이를 유지하는 편이 더 정확합니다.
  naturalness: 초안에는 인용문 안의 ‘되지’가 비격식 종결로 사용되어, 요구된 현대 한국어 합쇼체와 일치하지 않습니다. ‘너희도 깨끗하지만, 다 그런 것은 아닙니다’도 의미는 통하지만 ‘그런 것’이 앞선 정결 술어를 우회적으로 받습니다. ‘너희 모두가 깨끗한 것은 아닙니다’가 더 직접적이고 자연스럽습니다.
  terminology: ‘목욕한 사람’, ‘발을 씻다’, ‘깨끗하다’는 세정 이미지와 상징적 의미의 긴장을 해설 없이 보존하는 적절한 용어입니다. 각주도 두 그리스어 동사의 구별을 정확히 설명하되, 보다 직접적인 한국어로 다듬는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 인용문 안의 ‘발만 씻으면 되지’는 합쇼체가 아닙니다.
