translation:
  language: ko
  text: 그러자 예수께서 시몬 베드로에게 오셨습니다. 베드로가 그분께 말했습니다. “주님, 제 발을 씻으십니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: κύριε는 정중한 호칭으로도 쓰일 수 있어 ‘선생님’으로도 옮길 수 있지만, 여기서는 기본 번역값인 ‘주님’을 유지했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον
  english_pob_choice: So he comes to Simon Peter
  chosen_korean: 그러자 예수께서 시몬 베드로에게 오셨습니다
  alternatives_korean:
  - 그런즉 그가 시몬 베드로에게 옵니다
  - 그러고 나서 예수께서 시몬 베드로에게 다가오셨습니다
  lexicon: BDAG
  rationale: οὖν의 이어짐을 ‘그러자’로 자연스럽게 살리고, πρὸς + 대상을 ‘-에게’로 옮겨 움직임의 방향을 분명히 했습니다. ‘오셨습니다’는 요한복음의 현재적 서술감을 과도하게 드러내지 않으면서도 문맥상 자연스럽습니다.
- source_word: λέγει αὐτῷ
  english_pob_choice: He says to him
  chosen_korean: 베드로가 그분께 말했습니다
  alternatives_korean:
  - 그가 그분께 말합니다
  - 그가 그에게 말했습니다
  lexicon: BDAG
  rationale: 대화 상대가 이미 베드로로 분명하므로 주어를 보완해 한국어 문장을 매끄럽게 했고, αὐτῷ는 ‘그분께’로 예수에 대한 존칭을 반영했습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 선생님
  - 님
  lexicon: BDAG
  rationale: POB의 기본값에 따라 κύριε를 ‘주님’으로 옮겨 예수께 대한 존칭과 요한복음의 그리스도론적 울림을 함께 보존했습니다.
- source_word: σύ μου νίπτεις τοὺς πόδας
  english_pob_choice: are you washing my feet?
  chosen_korean: 제 발을 씻으십니까?
  alternatives_korean:
  - 내 발을 씻고 계십니까?
  - 제 발을 씻으십니까
  - 제 발을 씻으십니까?
  lexicon: BDAG
  rationale: νίπτω는 몸 전체가 아니라 부분을 씻는 뜻이므로 ‘발을 씻다’로 옮겼고, σύ의 강조는 놀라움이 담긴 수사 의문문으로 충분히 드러납니다. ‘제’는 μου를 겸손한 1인칭 소유로 자연스럽게 반영합니다.
theological_decisions:
- issue: κύριε의 한국어 존칭과 그리스도론적 뉘앙스
  chosen_reading: ‘주님’으로 번역해 예수에 대한 예우를 보존하면서도 단순한 사회적 호칭으로 축소하지 않았습니다.
  alternative_readings:
  - ‘선생님’으로 완화
  - ‘주여’의 예전적 표현
  rationale: 문맥상 베드로의 당혹과 예수의 권위가 함께 드러나며, 요한복음 전체의 ‘주’ 호칭은 예수의 정체성도 암시합니다. 따라서 전통적 교회어보다 소스 직결형을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
