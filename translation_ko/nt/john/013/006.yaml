  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
  footnotes:
  - marker: a
    text: Or “Sir, are you washing my feet?” The Greek κύριε can function as a respectful address, though here “Lord” is retained as the default rendering.
