id: JHN.13.38
reference: John 13:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
  footnotes:
  - marker: a
    text: 'Or “soul”: “Will you lay down your soul for me?” The Greek ψυχή can mean “soul” or “life”; here the sense is giving up one’s life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하셨습니다. 「네가 나를 위해 네 생명을 내놓겠느냐? 진실로 진실로 너에게 말합니다. 닭이 울기 전에는 네가 나를 세 번 부인할 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 “영혼”: “나를 위해 네 영혼을 내놓겠느냐?” 그리스어 ψυχή는 “영혼” 또는 “생명”을 뜻할 수 있으나, 여기서는 생명을 내어주는 뜻입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  english_pob_choice: answered
  chosen_korean: 대답하셨습니다
  alternatives_korean:
  - 대답하셨다
  - 응답하셨습니다
  lexicon: BDAG
  rationale: 문맥상 예수의 응답을 여는 서술동사이므로, 현대 서술체에 맞는 공손한 과거형으로 옮겼습니다.
- source_word: Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις
  english_pob_choice: Will you lay down your life for me?
  chosen_korean: 네가 나를 위해 네 생명을 내놓겠느냐
  alternatives_korean:
  - 네가 나를 위해 네 목숨을 내놓겠느냐
  - 네가 나를 위해 네 영혼을 내놓겠느냐
  lexicon: BDAG
  rationale: τίθημι + ψυχή의 관용구는 실제로 목숨을 내놓는 뜻이므로, POB 영어의 'life'에 맞춰 '생명'으로 옮겨 영혼론적 오해를 피했습니다.
- source_word: ἀμὴν ἀμὴν λέγω σοι
  english_pob_choice: Truly, truly, I say to you
  chosen_korean: 진실로 진실로 너에게 말합니다
  alternatives_korean:
  - 아멘 아멘 내가 너에게 말합니다
  - 진실로 내가 너에게 말합니다
  lexicon: BDAG
  rationale: 요한복음의 강조 공식은 반복을 살려 옮겨야 하므로, 현대 한국어에서 자연스럽고 장중한 '진실로 진실로'를 택했습니다.
- source_word: οὐ μὴ ἀλέκτωρ φωνήσῃ
  english_pob_choice: the rooster will certainly not crow
  chosen_korean: 닭이 울기 전에는
  alternatives_korean:
  - 수탉이 울기 전에는
  - 닭이 절대로 울지 않을 것입니다
  lexicon: BDAG
  rationale: ἀλέκτωρ는 문자적으로 수탉이지만, 한국어 성경 전통에서 '닭이 울다'가 자연스럽고 본문의 예언적 시간표현도 잘 드러냅니다.
theological_decisions:
- issue: ψυχή의 번역에서 영혼/생명 중 무엇을 택할지
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 이 구절은 베드로가 예수를 위해 죽을 각오가 있느냐는 문맥이므로, ψυχή를 '생명'으로 옮겨 자기희생의 구체성을 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; avoid narrowing ψυχή to a technical anthropology term.'
