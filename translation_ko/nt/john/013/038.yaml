base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
  footnotes:
  - marker: a
    text: 'Or “soul”: “Will you lay down your soul for me?” The Greek ψυχή can mean “soul” or “life”; here the sense is giving up one’s life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하셨습니다. 「네가 나를 위해 네 생명을[a] 내놓겠습니까? 진실로 진실로 너에게 말합니다. 네가 나를 세 번 부인하기까지는 닭이 결코 울지 않을 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 “영혼”: “네가 나를 위해 네 영혼을 내놓겠습니까?” 그리스어 ψυχή는 “영혼” 또는 “생명”을 뜻할 수 있으나, 여기서는 생명을 내어주는 뜻입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
