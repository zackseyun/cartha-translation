  source_fidelity: 첫 조건절 εἰ는 ‘알고 계시면’으로 적절히 반영되었으나, 둘째 조건절 ἐὰν ποιῆτε αὐτά는 ‘행하실 때’보다 조건을 보존하는 ‘행하시면’이 더 충실합니다. 또한 복수 대명사 αὐτά를 받는 ‘그것을’은 단수여서 복수 선행사 ταῦτα와의 연결을 흐립니다.
  naturalness: ‘이것들을’과 ‘그것을’의 수 불일치를 바로잡고, ‘그대로 행하시면’을 사용하면 한국어에서 불필요한 반복 없이 자연스럽게 앞의 복수 내용을 가리킬 수 있습니다. 합쇼체의 높임도 유지됩니다.
  terminology: μακάριοι를 ‘복되십니다’로 옮긴 것은 적절하며, 단순한 감정적 행복으로 축소하지 않습니다. 각주도 이 의미를 설명하되 본문에 없는 ‘하나님 앞에서’라는 해석적 한정은 피하는 편이 좋습니다.
