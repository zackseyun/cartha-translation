id: JHN.13.17
reference: John 13:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
  footnotes:
  - marker: a
    text: Or 'happy' or 'fortunate'; Greek 'blessed' carries the sense of being in a favored or flourishing state, not merely feeling happy.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들을 알고 계시면, 그대로 행하시면 복되십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘복되다’는 단순히 행복한 감정을 느낀다는 뜻만이 아니라, 복을 누리는 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 이것들
  alternatives_korean:
  - 이것
  lexicon: BDAG
  rationale: 앞절들에서 예수께서 말씀하신 가르침과 본보기를 가리키는 복수 지시어이므로, 복수성을 살려 ‘이것들’로 옮겼습니다.
- source_word: οἴδατε
  english_pob_choice: you know
  chosen_korean: 아시면
  alternatives_korean:
  - 알고 계시면
  - 알면
  lexicon: BDAG
  rationale: 지식의 소유를 나타내는 동사이므로 ‘아시다’로 옮기되, 문장 흐름을 자연스럽게 하기 위해 조건절로 처리했습니다.
- source_word: μακάριοί
  english_pob_choice: blessed
  chosen_korean: 복되십니다
  alternatives_korean:
  - 복이 있으십니다
  - 행복하십니다
  lexicon: BDAG
  rationale: 단순한 감정적 ‘행복’보다 하나님 앞에서의 복된 상태를 살리기 위해 ‘복되다’를 택했습니다. 대상이 제자들이므로 존칭형으로 자연스럽게 맞췄습니다.
- source_word: ποιῆτε αὐτά
  english_pob_choice: if you do them
  chosen_korean: 그것을 행하실 때
  alternatives_korean:
  - 그것들을 행하실 때
  - 그것을 실천하실 때
  lexicon: BDAG
  rationale: ποιέω는 여기서 말씀을 실제로 실행하는 뜻이므로 ‘행하다’가 직역성과 자연성을 함께 지닙니다. 한국어에서는 조건절을 매끄럽게 살려 ‘할 때’ 구조로 옮겼습니다.
theological_decisions:
- issue: μακάριοι의 번역이 단순한 감정 상태로 축소되지 않도록 할 것인지
  chosen_reading: ‘복되십니다’로 옮겨, 순종하는 제자들이 하나님 앞에서 누리는 복된 상태를 드러냈습니다.
  alternative_readings:
  - 행복하십니다
  - 복이 있습니다
  rationale: 문맥은 예수의 가르침을 아는 데서 더 나아가 실천하는 제자도의 복을 말하므로, 감정 중심 표현보다 신학적 무게를 보존하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §6; μακάριος의 축복/복됨 의미 보존 원칙
