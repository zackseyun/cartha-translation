  lexicon: BDAG
  rationale: 막연한 복수 주어로서 ‘some’을 자연스럽게 살리기 위해 ‘몇 사람은’으로 옮겼습니다.
- source_word: γλωσσόκομον
  english_pob_choice: money box
  chosen_korean: 돈궤
  alternatives_korean:
