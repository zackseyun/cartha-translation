id: JHN.13.29
reference: John 13:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
  footnotes:
  - marker: a
    text: Or 'moneybag.' The Greek term refers to the container holding the group's funds.
    reason: lexical_alternative
  - marker: b
    text: '''The feast'' refers to the festival meal context of Passover in this section.'
    reason: cross_reference
translation:
  language: ko
  text: 몇 사람은, 유다가 돈궤를 맡고 있었기 때문에 예수께서 그에게 「절기에 쓸 우리에게 필요한 것을 사라」고 말씀하시는 것이라고 생각하였고, 또는 그가 가난한 사람들에게 무엇인가 주라고 하시는 것이라고 생각하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돈궤’는 본문의 γλωσσόκομον이 가리키는 공동 자금 보관 용기를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘절기’는 이 단락의 유월절 만찬 맥락을 가리키는 표현입니다.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  english_pob_choice: some
  chosen_korean: 몇 사람은
  alternatives_korean:
  - 어떤 이들은
  - 몇몇 사람은
  lexicon: BDAG
  rationale: 막연한 복수 주어로서 ‘some’을 자연스럽게 살리기 위해 ‘몇 사람은’으로 옮겼습니다.
- source_word: γλωσσόκομον
  english_pob_choice: money box
  chosen_korean: 돈궤
  alternatives_korean:
  - 돈주머니
  - 공동 금고
  - 헌금함
  lexicon: BDAG
  rationale: 공동 자금이 들어 있는 용기를 가리키는 말이라, 구체적 형태를 과도하게 특정하지 않으면서도 그릇/상자를 드러내는 ‘돈궤’를 택했습니다.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  english_pob_choice: Jesus was telling him
  chosen_korean: 예수께서 그에게 … 말씀하시는 것
  alternatives_korean:
  - 예수께서 그에게 말씀하시는 것
  - 예수께서 그에게 말씀하신 것
  lexicon: BDAG
  rationale: 간접화법 안에서 제자들의 추정을 나타내므로, 현재형적 서술 효과를 지나치게 강조하지 않는 ‘말씀하시는 것’으로 풀었습니다.
- source_word: ἑορτήν
  english_pob_choice: feast
  chosen_korean: 절기
  alternatives_korean:
  - 명절
  - 축제
  lexicon: BDAG
  rationale: 요한복음의 유월절 맥락을 반영하되, 본절 자체에 ‘유월절’이 직접 반복되지는 않으므로 일반적인 ‘절기’로 옮겼습니다.
theological_decisions:
- issue: 유다의 의도에 대한 제자들의 오해를 어떻게 전달할지
  chosen_reading: 제자들이 예수의 말씀을 둘 중 하나로 추측한 것으로 옮겼습니다.
  alternative_readings:
  - 유다가 실제로 가난한 사람들에게 주려 했다는 식의 서술
  - 예수의 명령을 단정적으로 서술하는 방식
  rationale: 본문은 제자들의 추측을 전하는 장면이므로, 해석을 단정하지 않고 ‘생각하였습니다’와 ‘또는’ 구조를 유지했습니다.
  doctrine_reference: 문맥상 서술 관찰
