- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  english_pob_choice: Jesus was telling him
  chosen_korean: 예수께서 그에게 … 말씀하시는 것
  alternatives_korean:
  - 예수께서 그에게 말씀하시는 것
  - 예수께서 그에게 말씀하신 것
  lexicon: BDAG
  rationale: 간접화법 안에서 제자들의 추정을 나타내므로, 현재형적 서술 효과를 지나치게 강조하지 않는 ‘말씀하시는 것’으로 풀었습니다.
- source_word: ἑορτήν
  english_pob_choice: feast
  chosen_korean: 절기
  alternatives_korean:
  - 명절
  - 축제
  lexicon: BDAG
  rationale: 요한복음의 유월절 맥락을 반영하되, 본절 자체에 ‘유월절’이 직접 반복되지는 않으므로 일반적인 ‘절기’로 옮겼습니다.
theological_decisions:
- issue: 유다의 의도에 대한 제자들의 오해를 어떻게 전달할지
  chosen_reading: 제자들이 예수의 말씀을 둘 중 하나로 추측한 것으로 옮겼습니다.
  alternative_readings:
  - 유다가 실제로 가난한 사람들에게 주려 했다는 식의 서술
  - 예수의 명령을 단정적으로 서술하는 방식
  rationale: 본문은 제자들의 추측을 전하는 장면이므로, 해석을 단정하지 않고 ‘생각하였습니다’와 ‘또는’ 구조를 유지했습니다.
  doctrine_reference: 문맥상 서술 관찰
