- from: 시몬 베드로가 그에게 말했습니다. 「주님, 어디로 가십니까?」 예수께서 대답하셨습니다. 「내가 가는 곳으로는 지금 너는 나를 따를 수 없지만, 나중에는 따르게 될 것이다.」[a][b]
  to: 시몬 베드로가 그분께 말합니다. “주님, 어디로 가십니까?” 예수께서 대답하셨습니다. “내가 가는 곳에는 지금은 나를 따를 수 없습니다[a]. 그러나 나중에는 따르게 될 것입니다[b].”
  rationale: 장소 관계절을 자연스러운 한국어로 다듬고, 직접 발화를 합쇼체로 통일했습니다. ‘나중에 따른다’의 구체적 방식은 본문에서 정하지 않으므로 본문에는 덧붙이지 않고 각주에서도 가능성으로만 제시했습니다. 각주 표지는 설명 대상 어구에 직접 연결했습니다.
