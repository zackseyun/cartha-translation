id: JHN.13.36
reference: John 13:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
  footnotes:
  - marker: a
    text: Or “you cannot follow me now.” The Greek explicitly uses a verb of ability.
    reason: lexical_alternative
  - marker: b
    text: “You will follow later” may allude to Peter’s later following of Jesus in suffering or death; the wording itself does not specify how.
    reason: cross_reference
translation:
  language: ko
  text: 시몬 베드로가 그분께 말합니다. “주님, 어디로 가십니까?” 예수께서 대답하셨습니다. “내가 가는 곳에는 지금은 나를 따를 수 없습니다[a]. 그러나 나중에는 따르게 될 것입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 여기서 능력을 나타내는 동사를 명시적으로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나중에는 따르게 될 것입니다’라는 말은 베드로가 훗날 어떤 방식으로 예수를 따르게 될지를 구체적으로 말하지 않습니다. 이는 순교, 회복된 제자도, 또는 더 넓은 의미의 따름을 가리킬 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인님
  - 선생님
  lexicon: BDAG
  rationale: 예수께 직접 부르는 호칭이므로, POB의 ‘Lord’를 따라 한국어에서는 존칭성과 주님의 호칭 기능을 함께 담는 ‘주님’이 가장 자연스럽습니다.
- source_word: ποῦ ὑπάγεις
  english_pob_choice: where are you going
  chosen_korean: 어디로 가십니까
  alternatives_korean:
  - 어디로 가고 계십니까
  - 어디로 떠나십니까
  lexicon: BDAG
  rationale: ὑπάγω는 단순히 ‘가다/가다, 떠나다’의 뜻이므로, 과도한 해석을 피하면서도 현대 한국어로 자연스러운 ‘어디로 가십니까’로 옮겼습니다.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  english_pob_choice: you are not able to follow me now
  chosen_korean: 지금 너는 나를 따를 수 없지만
  alternatives_korean:
  - 지금 너는 나를 따르지 못하지만
  - 지금은 나를 따라올 수 없지만
  lexicon: BDAG
  rationale: δύναμαι의 ‘능력’이 분명하므로 단순한 가능성보다 ‘따를 수 없다’로 옮겨, EN POB의 각주가 지적한 능력 동사를 반영했습니다.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  english_pob_choice: but you will follow later
  chosen_korean: 나중에는 따르게 될 것이다
  alternatives_korean:
  - 그 뒤에는 따르게 될 것이다
  - 그러나 나중에는 따를 것이다
  lexicon: BDAG
  rationale: ὕστερον은 시간적 후속을 나타내므로 ‘나중에는’으로 자연스럽게 풀었고, 미래형을 살려 예고의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 베드로가 ‘나중에 따르리라’는 말의 구체적 의미
  chosen_reading: 본문은 베드로가 나중에 어떻게 예수를 따르게 되는지 구체화하지 않고 그대로 둡니다.
  alternative_readings:
  - 순교에 대한 암시
  - 부활 후 제자도 회복에 대한 암시
  - 죽음이나 영광 가운데의 최종적 따름
  rationale: 그리스어는 ‘지금은 못 따르지만 나중에는 따른다’는 말만 제시하므로, 본문이 열어 둔 의미를 번역에서 특정 사건으로 좁히지 않았습니다.
  doctrine_reference: 의미의 개방성을 보존하고 해석을 앞질러 확정하지 않음.
