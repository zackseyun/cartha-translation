id: JHN.13.25
reference: John 13:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
  footnotes:
  - marker: a
    text: Or 'reclining on Jesus' breast.' The Greek reflects the posture of dining while lying back at table.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 예수님의 가슴에 기대어, 주님, 누구입니까? 하고 물었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예수님의 가슴에 기대어’는 식탁에 누운 자세를 자연스럽게 풀어 옮긴 것입니다. 헬라어는 식사 자리에서 뒤로 기대는 자세를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπεσὼν / οὕτως
  english_pob_choice: leaning back in this way
  chosen_korean: 예수님의 가슴에 기대어
  alternatives_korean:
  - 기댄 채로
  - 뒤로 기대어
  - 식탁에 기대어
  lexicon: BDAG
  rationale: 식사 자세의 뒤로 기대는 동작과 예수님께 바짝 기대어 있는 상태를 함께 살리기 위해 ‘예수님의 가슴에 기대어’로 옮겼습니다. 한국어에서는 ‘가슴에 기대다’가 자연스럽고 장면도 분명하게 전달합니다.
- source_word: ἐκεῖνος
  english_pob_choice: he
  chosen_korean: 그는
  alternatives_korean:
  - 그 사람은
  - 그가
  - 그 이
  lexicon: BDAG
  rationale: 지시대명사의 인칭 지시를 한국어에서는 보통 대명사 ‘그는’으로 자연스럽게 드러냅니다. 본문 맥락상 이미 지목된 제자를 가리키는 점은 주변 문맥이 보완합니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 선생님
  - 님
  lexicon: BDAG
  rationale: 예수님께 드리는 직접 호칭으로서 ‘주님’이 POB의 κύριος 기본값을 살리면서도 한국어에서 경건하고 자연스럽습니다. ‘선생님’은 신학적 호칭성을 약화시킵니다.
- source_word: τίς ἐστιν;
  english_pob_choice: who is it?
  chosen_korean: 누구입니까?
  alternatives_korean:
  - 누구이십니까?
  - 누구예요?
  - 누구입니까 하고
  lexicon: BDAG
  rationale: 한국어에서는 대상의 정체를 묻는 말로 ‘누구입니까?’가 가장 자연스럽습니다. 직전 문맥이 가리키는 인물을 묻는 것이므로 ‘그는 누구입니까?’보다 짧게 유지했습니다.
theological_decisions:
- issue: 예수님에 대한 κύριος 호칭의 한국어 유지
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 선생님
  - 주여
  rationale: 본문의 κύριος는 단순한 예의 표현을 넘어 요한복음의 그리스도론적 호칭으로 기능하므로, 한국어에서도 ‘주님’으로 유지하는 것이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님'
