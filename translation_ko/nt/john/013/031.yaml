  naturalness: 전반적으로 현대 표준어 합쇼체로 자연스럽습니다. 다만 인자께서 가리키는 분이 예수님이므로 서술어에 높임을 적용하는 것이 문체상 더 일관되고 자연스럽습니다. 각주 표지는 대안이 되는 ‘그 안에서’ 바로 뒤에 두는 편이 독자의 연결을 분명히 합니다.
