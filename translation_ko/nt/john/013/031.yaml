id: JHN.13.31
reference: John 13:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
  footnotes:
  - marker: a
    text: Or “through him.” The Greek phrase can be understood either as God being glorified in the Son or through the Son.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 나간 뒤에 예수께서 말씀하셨습니다. “이제 인자께서 영광을 받으셨고, 하나님께서도 그 안에서[a] 영광을 받으셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를 통하여’로도 이해할 수 있습니다. 헬라어 전치사구는 하나님께서 인자 안에서 영광을 받으셨다는 뜻과 인자를 통하여 영광을 받으셨다는 뜻, 둘 다 가능하게 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  english_pob_choice: So when
  chosen_korean: 그가 나가자
  alternatives_korean:
  - 그러므로 그가 나갔을 때
  - 그가 나갔을 때
  lexicon: SBLGNT
  rationale: Ὅτε의 시간적 관계와 οὖν의 서술 진행을 한국어로 자연스럽게 묶어, 앞선 문맥의 유다 퇴장을 배경 사건으로 간결하게 드러냈습니다.
- source_word: ἐξῆλθεν
  english_pob_choice: he had gone out
  chosen_korean: 그가 나가자
  alternatives_korean:
  - 그가 나갔을 때
  - 그가 나갔습니다
  lexicon: BDAG
  rationale: 동작 완료를 전제로 한 뒤 이어지는 예수의 말씀을 살리기 위해 ‘나가자’로 처리하여, 영어의 과거완료가 보여 주는 선행성을 반영했습니다.
- source_word: ἐδοξάσθη
  english_pob_choice: has been glorified
  chosen_korean: 영광을 받았고
  alternatives_korean:
  - 영광을 받으셨고
  - 영광스럽게 되셨고
  lexicon: BDAG
  rationale: aorist passive의 완료 성격과 한국어 성경체의 자연스러움을 함께 고려해 ‘영광을 받다’로 옮겼습니다. 여기서는 단순한 상태보다 이미 시작된 사건의 성취를 드러냅니다.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자이신 분
  lexicon: BDAG
  rationale: 요한복음에서 예수의 자기 호칭으로 굳어진 표현이므로 전통적이면서도 본문 대응이 분명한 ‘인자’를 사용했습니다.
- source_word: ἐν αὐτῷ
  english_pob_choice: in him
  chosen_korean: 그 안에서
  alternatives_korean:
  - 그를 통하여
  - 그에게서
  lexicon: BDAG
  rationale: 전치사 ἐν의 기본 관계를 따라 직역에 가깝게 유지하되, 한국어에서는 ‘그 안에서’가 가장 자연스럽게 하나님과 아들의 상호 영광을 전달합니다.
theological_decisions:
- issue: Ἐν αὐτῷ의 관계성
  chosen_reading: ‘그 안에서’로 본문에 두고, 하나님이 아들 안에서 영광을 받으신 관계를 직접 드러냅니다.
  alternative_readings:
  - 그를 통하여
  - 그로 말미암아
  rationale: 본문은 관계적·장소적 표현을 그대로 두어도 의미가 충분히 살아나므로, 해석을 하나로 좁히지 않고 요한문맥의 상호영광을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘영광을 받다’의 범위
  chosen_reading: 예수의 영광을 십자가, 부활, 높아지심 중 하나로 한정하지 않고 포괄적으로 옮깁니다.
  alternative_readings:
  - 십자가에서 영광을 받으셨다
  - 부활과 높아지심으로 영광을 받으셨다
  rationale: 요한복음의 ‘영광’은 단일 사건보다 하나의 구속사적 전체를 가리키는 경우가 많으므로, 번역에서도 그 폭을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
