revisions:
- from: 그러자 시몬 베드로가 이 사람에게 그가 누구를 두고 말씀하시는지 물어보라고 손짓했습니다.[a]
  to: 그러자 시몬 베드로가 이 사람에게 예수님께서 누구를 두고 말씀하신 것인지 물어보라고 손짓했습니다.[a]
  rationale: 예수님의 발화를 가리키는 원문의 주어를 명시하여 한국어 대명사 지시의 모호성을 제거했습니다. ‘누구를 두고 말씀하신 것인지’는 말씀의 대상이라는 περὶ οὗ의 관계를 보존하며, ‘것인지’는 τίς ἂν εἴη의 미확정적 간접 질문을 자연스럽게 표현합니다. 각주는 직역 표기를 हट고 πυθέσθαι에 대한 어휘 대안만 제시하도록 정정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:42Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 동작(νεύει), 수신자(τούτῳ), 질문 요구(πυθέσθαι), 그리고 예수께서 말씀하신 대상(περὶ οὗ λέγει)은 대체로 충실히 옮겼습니다. 다만 현행 ‘그가’는 주절의 ‘시몬 베드로’를 가리키는 것으로도 읽혀, 원문의 λέγει의 주어인 예수님을 한국어에서 명확히 해야 합니다. 또한 τίς ἂν εἴη의 미확정적 뉘앙스는 ‘누구일지’로 더 잘 드러낼 수 있습니다.
  naturalness: ‘이 사람에게’와 ‘손짓했습니다’는 자연스럽고 합쇼체 문체에도 맞습니다. 그러나 ‘그가 누구를 두고 말씀하시는지’는 대명사 지시가 불명확합니다. ‘예수님께서 누구를 두고 말씀하신 것인지’로 바꾸면 자연스럽고 오독을 막습니다.
  terminology: ‘시몬 베드로’와 예수님을 가리키는 ‘말씀하시다’는 한국어 성경 문체 및 존대 관습에 적절합니다. ‘물어보라고’도 πυθέσθαι의 문맥상 의미를 충실하게 전달합니다.
  issues:
  - severity: medium
    issue: ‘그가’의 선행사가 불명확합니다.
    rationale: 한국어에서는 가장 가까운 주절 주어인 시몬 베드로로 이해될 여지가 있습니다. 그러나 원문의 λέγει는 문맥상 예수님을 가리키므로, 예수님을 명시해야 합니다.
  - severity: low
    issue: 각주가 ‘직역하면’이라고 하나 실제로는 πυθέσθαι의 다른 어휘 선택을 제시합니다.
    rationale: ‘알아보라고’는 가능한 번역 대안이지만 직역 자체는 아닙니다. 어휘 대안으로 간명하게 제시하는 편이 정확합니다.
  revised_text: 그러자 시몬 베드로가 이 사람에게 예수님께서 누구를 두고 말씀하신 것인지 물어보라고 손짓했습니다.[a]
