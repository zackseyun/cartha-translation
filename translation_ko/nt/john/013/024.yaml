lexical_decisions:
- source_word: νεύει
  english_pob_choice: motioned
  chosen_korean: 손짓했습니다
  alternatives_korean:
  - 신호했습니다
  - 고갯짓했습니다
  - 손으로 신호했습니다
  lexicon: BDAG
  rationale: 비언어적 의사전달의 동작을 자연스럽게 살리면서, ‘손짓하다’가 현대 한국어에서 가장 간결하고 읽기 쉽습니다.
- source_word: τούτῳ
  english_pob_choice: to this one
  chosen_korean: 이 사람에게
  alternatives_korean:
  - 이 사람에게
  - 이에게
  - 그에게
  lexicon: BDAG
  rationale: 지시대명사의 근접성을 살리되, 한국어에서는 대상 인물을 자연스럽게 드러내는 ‘이 사람’이 문맥상 가장 분명합니다.
- source_word: πυθέσθαι
  english_pob_choice: to ask
  chosen_korean: 물어보라고
  alternatives_korean:
  - 묻도록
  - 알아보라고
  - 질문하라고
  lexicon: BDAG
  rationale: 여기서는 베드로의 신호가 상대에게 질문을 전달하라는 뜻이므로, 구어적이지만 격식 있는 ‘물어보다’가 가장 직접적입니다.
- source_word: τίς ἂν εἴη περὶ οὗ
  english_pob_choice: who it might be about whom he was speaking
  chosen_korean: 그가 누구를 두고 말씀하시는지
  alternatives_korean:
  - 그가 누구를 말씀하시는지
  - 그분이 누구에 대해 말씀하시는지
  - 그가 누구를 두고 말하시는지
  lexicon: BDAG
  rationale: 희미한 가능성/미확정성을 한국어의 간접의문 ‘-는지’로 옮기고, ‘about whom’의 관계를 자연스럽게 ‘누구를 두고’로 풀었습니다.
- source_word: λέγει
  english_pob_choice: he was speaking
  chosen_korean: 말씀하시는
  alternatives_korean:
  - 말하고 계시는
  - 이야기하시는
  - 말하는
  lexicon: BDAG
  rationale: 예수께 대한 존칭을 살리면서도, 본문의 발화 행위를 자연스럽게 전달하는 표현으로 ‘말씀하시는’을 택했습니다.
theological_decisions:
- issue: 예수에 대한 호칭과 존대
  chosen_reading: 본문의 현재형 발화는 한국어에서 예수께 대한 존칭을 사용해 ‘말씀하시는’으로 옮겼습니다.
  alternative_readings:
  - 말하는
  - 말하고 계시는
  rationale: 지시 대상이 예수이므로 한국어 서술에서 비존칭보다 존칭이 더 적절하며, 본문의 내용과 의미를 바꾸지 않습니다.
  doctrine_reference: 복음서 서술에서 예수 호칭의 존중 표현
