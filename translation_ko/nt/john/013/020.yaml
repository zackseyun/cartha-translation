revisions:
- from: 진실로 진실로 여러분에게 말합니다. 누구든지 내가 보내는 이를 받는 사람은 나를 받고, 나를 받는 사람은 나를 보내신 분을 받습니다.[a][b]
  to: 진실로 진실로 여러분에게 말합니다. 내가 누구를 보내든지 그를 받는 이는 나를 받고, 나를 받는 이는 나를 보내신 분을 받습니다.[b]
  rationale: ‘내가 누구를 보내든지’는 원문의 ἄν τινα πέμψω가 지닌 부정적·조건적 범위를 자연스러운 현대 한국어로 드러냅니다. ‘받다’를 세 차례 일관되게 유지하고, ‘나를 보내신 분’이라는 본문 표현도 보존했습니다. 비문인 기존 각주 a는 본문 수정으로 그 기능이 해소되어 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:43Z'
