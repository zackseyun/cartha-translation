id: JHN.13.20
reference: John 13:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
  footnotes:
  - marker: a
    text: Or 'the one who receives whomever I send.'
    reason: lexical_alternative
  - marker: b
    text: In context, 'the one who sent me' refers to the Father.
    reason: cross_reference
translation:
  language: ko
  text: 진실로 진실로 여러분에게 말합니다. 누구든지 내가 보내는 이를 받는 사람은 나를 받고, 나를 받는 사람은 나를 보내신 분을 받습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alternatively, '누구든지 내가 보내는 누구를 받는 사람은'이라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 '나를 보내신 분'은 아버지를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로 진실로
  alternatives_korean:
  - 아멘 아멘
  - 참으로 참으로
  lexicon: BDAG
  rationale: 반복된 확언 공식의 강한 강조를 살리면서도, 현대 한국어에서 자연스럽고 격식 있는 서두로 옮겼습니다. '아멘 아멘'은 음역의 직접성은 있으나 일반 독자에게는 서두의 기능이 덜 분명합니다.
- source_word: λέγω ὑμῖν
  english_pob_choice: I say to you
  chosen_korean: 여러분에게 말합니다
  alternatives_korean:
  - 너희에게 말합니다
  - 여러분에게 이릅니다
  lexicon: BDAG
  rationale: 공적 담화에서의 직접 호칭을 표준어 합쇼체로 자연스럽게 옮겼습니다. '여러분'은 복수 수신자를 분명히 하면서도 문체를 부드럽게 유지합니다.
- source_word: ὁ λαμβάνων / λαμβάνει
  english_pob_choice: whoever receives / receives
  chosen_korean: 받는 사람은 / 받습니다
  alternatives_korean:
  - 영접하는 사람은 / 영접합니다
  - 받는 이는 / 받습니다
  lexicon: BDAG
  rationale: λαμβάνω의 반복을 한국어에서도 '받다'로 일관되게 살려, 수용-대표성의 연결고리를 드러냈습니다. '영접하다'는 가능하지만, 반복 구조와 범위를 다소 좁힐 수 있습니다.
- source_word: τὸν πέμψαντά με
  english_pob_choice: the one who sent me
  chosen_korean: 나를 보내신 분
  alternatives_korean:
  - 나를 보내신 이
  - 나를 보내신 분을
  lexicon: BDAG
  rationale: 직역에 가까운 '나를 보내신 분'으로 인격적 관계를 보존했습니다. 본문 자체가 아버지를 명시하지 않으므로, 본문 표면을 넘어서지 않도록 했습니다.
theological_decisions:
- issue: 보내신 분의 정체를 본문에 명시할지 여부
  chosen_reading: 나를 보내신 분
  alternative_readings:
  - 아버지
  - 아버지께서 나를 보내신 분
  rationale: 요한복음 문맥에서는 아버지를 가리키지만, 본절은 관계적 표현을 사용하므로 본문 수준의 표현을 유지했습니다. 해석은 문맥에서 충분히 드러나며, 본문에 신학적 명칭을 미리 삽입하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: generic 수신자의 표현
  chosen_reading: 누구든지 ... 받는 사람은
  alternative_readings:
  - 누구나 ... 받는 자는
  - 받는 사람은
  rationale: 그리스어의 일반적·대표적 분사를 한국어의 '누구든지'로 옮겨 남성 단수에 제한되지 않는 보편성을 살렸습니다. 동시에 뒤의 반복 문장에서도 인칭이 흔들리지 않도록 했습니다.
  doctrine_reference: Translation philosophy §4
