    text: ‘유대인들’은 문맥에 따라 ‘유대 지도자들’을 가리킬 수도 있습니다.
    reason: alternative_reading
  revision_rationale: 문장을 완결된 현대 합쇼체로 다듬고, ‘이제 너희에게도 그렇게 말합니다’로 비교·적용의 연결을 명시했습니다. 인용문도 합쇼체로 통일했습니다. 본문상 필요한 문맥적 대안 주석 a는 유지하되, 의미 있는 대안을 제공하지 못하는 주석 b는 삭제했습니다.
