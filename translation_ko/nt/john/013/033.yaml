review_pass:
  verdict: revise
  source_fidelity: 'The draft broadly conveys the Greek, including the tender address, the brief remaining time, the future seeking, and the recalled statement to the Jews. However, the final clause is syntactically incomplete in Korean: καὶ ὑμῖν λέγω ἄρτι means that Jesus now says the same thing to the disciples, not merely ‘now I say to you’ after a dash.'
  naturalness: The draft’s dash leaves the sentence fragmented, and the quoted statement in plain style (‘올 수 없다’) sits unevenly within an otherwise modern formal-polite rendering. A complete reported-speech construction is more natural and clear.
  terminology: ‘유대인들’ appropriately retains the unqualified wording of τοῖς Ἰουδαίοις; the contextual alternative may remain in a note. ‘어린 자녀들아’ is an acceptable rendering of τεκνία in this context. Footnote b is redundant in Korean and is not meaningfully anchored to its stated alternative.
  issues:
  - severity: medium
    issue: The final clause is incomplete and the dash is syntactically unsupported.
    rationale: 'The Greek links the prior saying with its present application: ‘and now I say [it] to you.’ Korean should explicitly express ‘the same’ or ‘thus’ (e.g., ‘너희에게도 그렇게 말합니다’).'
  - severity: medium
    issue: Footnote b is redundant and improperly related to the Korean text.
    rationale: Its content merely offers the same Korean wording already used (‘너희는 올 수 없다’) and supplies no genuine lexical or interpretive alternative. Removing it avoids a misleading anchor.
  revised_text: 어린 자녀들아, 내가 너희와 함께 있는 시간도 이제 조금밖에 남지 않았습니다. 너희는 나를 찾을 것입니다. 내가 유대인들에게 “내가 가는 곳에는 너희가 올 수 없습니다”라고 말한 것처럼, 이제 너희에게도 그렇게 말합니다.[a]
  revised_footnotes:
