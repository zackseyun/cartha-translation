id: JHN.13.33
reference: John 13:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
  footnotes:
  - marker: a
    text: Or 'the Jewish leaders,' since in John 'the Jews' can sometimes refer more specifically to the Judean authorities depending on context.
    reason: alternative_reading
  - marker: b
    text: Or more simply, 'you cannot come.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어린 자녀들아, 내가 너희와 함께 있는 시간이 아직 조금 남아 있습니다. 너희가 나를 찾을 것이고, 내가 유대인들에게 말한 것처럼 “내가 가는 곳에 너희는 올 수 없다” — 지금도 너희에게 말합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유대인들’은 문맥에 따라 ‘유대 지도자들’을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 더 간단히, ‘너희는 올 수 없다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  english_pob_choice: Little children
  chosen_korean: 어린 자녀들아
  alternatives_korean:
  - 자녀들아
  - 사랑하는 자녀들아
  lexicon: BDAG
  rationale: 호격 복수의 애정 어린 축소형을 살리기 위해 단순한 ‘자녀들아’보다 ‘어린 자녀들아’가 가족적 비유와 정서적 뉘앙스를 함께 드러냅니다.
- source_word: ἔτι μικρὸν
  english_pob_choice: a little while longer
  chosen_korean: 아직 조금 남아 있습니다
  alternatives_korean:
  - 조금 더 있습니다
  - 아직 잠시 있습니다
  lexicon: BDAG
  rationale: 짧게 남은 시간을 자연스러운 현대 한국어로 옮기되, ‘아직’과 ‘조금’을 통해 남은 시간이 많지 않다는 뜻을 유지했습니다.
- source_word: ζητήσετέ με
  english_pob_choice: You will seek me
  chosen_korean: 너희가 나를 찾을 것이고
  alternatives_korean:
  - 너희가 나를 구할 것이고
  - 너희가 나를 찾게 될 것이고
  lexicon: BDAG
  rationale: ζητέω의 ‘찾다/구하다’ 가운데 이 문맥에서는 행위의 일반적 의미가 자연스러워 ‘찾다’를 택했습니다.
- source_word: τοῖς Ἰουδαίοις
  english_pob_choice: the Jews
  chosen_korean: 유대인들에게
  alternatives_korean:
  - 유대 지도자들에게
  - 유다인들에게
  lexicon: BDAG
  rationale: 본문의 직접적 표현을 따라 ‘유대인들’로 두어, 문맥상 더 좁은 집단으로 미리 제한하지 않았습니다.
- source_word: Ὅπου ἐγὼ ὑπάγω
  english_pob_choice: Where I am going
  chosen_korean: 내가 가는 곳에
  alternatives_korean:
  - 내가 가는 곳으로
  - 내가 가는 곳
  lexicon: BDAG
  rationale: ὑπάγω의 이동·떠남을 한국어 관용구 ‘가는 곳’으로 살렸고, 질문/인용 구조 안에서 자연스럽게 배치했습니다.
- source_word: οὐ δύνασθε ἐλθεῖν
  english_pob_choice: you are not able to come
  chosen_korean: 너희는 올 수 없다
  alternatives_korean:
  - 너희는 올 능력이 없다
  - 너희는 올 수 없습니다
  lexicon: BDAG
  rationale: δύνασθε의 ‘가능하다/할 수 있다’를 한국어의 평이한 부정 가능 표현으로 옮겨, 단순 금지보다 능력·접근 불가의 뜻을 유지했습니다.
theological_decisions:
- issue: ‘유대인들’(Ἰουδαίοις)의 범위
  chosen_reading: 본문 그대로 ‘유대인들’로 유지했습니다.
  alternative_readings:
  - 유대 지도자들
  - 유다인들
  rationale: 요한복음에서 이 표현이 때때로 더 좁은 집단을 가리킬 수 있지만, 이 절 자체는 직전 발화를 되짚는 인용이라 범위를 축소할 근거가 부족합니다. 따라서 본문 표현을 보존하고 해석적 제한은 달지 않았습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 문맥이 요구하지 않는 해석적 축소는 피함.'
