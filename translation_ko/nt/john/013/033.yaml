revisions:
- from: 어린 자녀들아, 내가 너희와 함께 있는 시간이 아직 조금 남아 있습니다. 너희가 나를 찾을 것이고, 내가 유대인들에게 말한 것처럼 “내가 가는 곳에 너희는 올 수 없다” — 지금도 너희에게 말합니다.[a][b]
  to: 어린 자녀들아, 내가 너희와 함께 있는 시간도 이제 조금밖에 남지 않았습니다. 너희는 나를 찾을 것입니다. 내가 유대인들에게 “내가 가는 곳에는 너희가 올 수 없습니다”라고 말한 것처럼, 이제 너희에게도 그렇게 말합니다.[a]
  rationale: 문장을 완결된 현대 합쇼체로 다듬고, ‘이제 너희에게도 그렇게 말합니다’로 비교·적용의 연결을 명시했습니다. 인용문도 합쇼체로 통일했습니다. 본문상 필요한 문맥적 대안 주석 a는 유지하되, 의미 있는 대안을 제공하지 못하는 주석 b는 삭제했습니다.
