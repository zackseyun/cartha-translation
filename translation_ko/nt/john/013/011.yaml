lexical_decisions:
- source_word: ᾔδει
  english_pob_choice: he knew
  chosen_korean: 아셨기 때문입니다
  alternatives_korean:
  - 알고 계셨기 때문입니다
  - 알았기 때문입니다
  lexicon: BDAG
  rationale: οἶδα의 서술적 완료 감각을 한국어에서는 자연스러운 과거 진술인 ‘아셨다’로 옮기되, 문맥상 예수님의 지속적 인식을 무리 없이 드러내기 위해 높임을 유지했습니다.
- source_word: τὸν παραδιδόντα αὐτόν
  english_pob_choice: the one betraying him
  chosen_korean: 자기를 넘겨줄 사람
  alternatives_korean:
  - 그를 배반하는 사람
  - 그를 넘겨주는 사람
  lexicon: BDAG
  rationale: παραδίδωμι의 직역인 ‘넘겨주다’를 살리면서도, 요한 수난 문맥에서 유다의 행위를 가리키는 점을 반영했습니다. ‘배반하다’는 의미를 담을 수 있으나, 원어의 ‘넘겨줌’과 긴장을 남기기 위해 보다 직접적인 표현을 택했습니다.
- source_word: διὰ τοῦτο
  english_pob_choice: for this reason
  chosen_korean: 그래서
  alternatives_korean:
  - 이 때문에
  - 그러므로
  lexicon: BDAG
  rationale: 앞절의 인식과 뒤의 발화를 연결하는 인과를 한국어에서 가장 자연스럽고 간결하게 드러내는 연결어로 옮겼습니다.
- source_word: Οὐχὶ πάντες καθαροί ἐστε
  english_pob_choice: Not all of you are clean
  chosen_korean: 너희 모두가 깨끗한 것은 아닙니다
  alternatives_korean:
  - 너희 모두가 깨끗하지는 않습니다
  - 너희 전부가 깨끗한 것은 아닙니다
  lexicon: BDAG
  rationale: ‘καθαροί’를 문자적·의례적 깨끗함과 상징적 정결의 이중성을 함께 살리는 ‘깨끗하다’로 옮겼고, 강한 부정 어감을 한국어 자연성에 맞게 구성했습니다.
theological_decisions:
- issue: καθαροί의 의미 범위
  chosen_reading: 깨끗한 상태를 말하되, 단순한 도덕적 순수성으로만 좁히지 않았습니다.
  alternative_readings:
  - 순수한
  - 정결한
  rationale: 발 씻김 문맥 때문에 문자적 씻음과 영적 상태가 겹쳐 있습니다. ‘깨끗하다’는 이 긴장을 보존하면서도 한국어 독자가 즉시 이해할 수 있게 합니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
- issue: παραδιδόντα의 의미
  chosen_reading: ‘넘겨줄 사람’으로 옮겨, 유다의 배반을 직접적으로 지시하되 원어의 ‘hand over’ 배경을 남겼습니다.
  alternative_readings:
  - 배반할 사람
  - 넘겨주는 사람
  rationale: 여기서는 단순한 전달이 아니라 예수님을 적대 세력에게 내주는 행위를 가리킵니다. 한국어에서 ‘넘겨주다’가 그 행위성을 비교적 직접적으로 드러냅니다.
  doctrine_reference: Translation philosophy §1, original-language primacy over translation tradition; §3, preserve tension where genuine ambiguity exists.
