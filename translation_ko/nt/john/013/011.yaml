review_pass:
  verdict: revise
  source_fidelity: The main renderings accurately convey Jesus' knowledge, the person who would hand him over, the causal connection, and the statement that not all the disciples are clean. However, the opening pronoun followed by the explicit subject '예수님은' is less coherent in Korean, and the lexical footnote anchor should attach directly to the expression it explains.
  naturalness: ‘그는 자기를 넘겨줄 사람을 아셨기 때문입니다. 그래서 예수님은’ creates an awkward shift from pronoun to name across two short sentences. Using ‘이는 예수님께서 … 알고 계셨기 때문입니다’ gives a natural Korean explanatory formulation while retaining the source’s causal force. ‘자신을’ is also more natural than ‘자기를’ in this formal narrative register.
  terminology: ‘넘겨줄 사람’ appropriately preserves the hand-over sense of παραδιδόντα without prematurely replacing it with ‘배반할 사람.’ ‘깨끗한’ rightly preserves the washing/ethical-spiritual resonance of καθαροί. ‘말씀하셨습니다’ and the direct speech ending ‘아닙니다’ consistently maintain modern formal-polite register.
  issues:
  - severity: low
    issue: Subject reference shifts awkwardly from ‘그는’ to ‘예수님은.’
    rationale: The Greek has a single implied subject throughout. Korean reads more smoothly when Jesus is identified in the initial explanatory clause rather than after the causal sentence.
  - severity: low
    issue: Footnote marker is placed after the whole sentence rather than immediately after ‘넘겨줄 사람.’
    rationale: The footnote explains παραδιδόντα/‘넘겨주는 사람’; attaching the marker to that phrase provides a clear lexical anchor.
  revised_text: 이는 예수님께서 자신을 넘겨줄 사람[a]을 알고 계셨기 때문입니다. 그래서 “너희가 모두 깨끗한 것은 아닙니다”라고 말씀하셨습니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 “그를 넘겨주는 사람”입니다. 문맥에서는 유다의 배반을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The revision resolves the Korean subject-reference awkwardness and moves the lexical footnote marker to its proper anchor. It retains the source’s explanatory and consequential linkage, the contextual-future sense of the participle, and the deliberate breadth of ‘깨끗한.’
