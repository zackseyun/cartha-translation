review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘끝까지’는 εἰς τέλος의 시간적·질적 중의성을 잘 보존합니다. 그러나 현행 각주 a는 유월절에 붙어 있으면서 실제로는 εἰς τέλος을 설명하므로 앵커가 잘못되었습니다. 또한 ‘사랑하셨으니’는 ἀγαπήσας를 인과 관계로 다소 좁히며, ‘옮겨 갈 때가 된’은 ‘때가 왔다’라는 요한복음의 관용 표현을 어색하게 반복합니다.
  naturalness: ‘이 세상을 떠나 아버지께로 가실 때가 온 것’은 현대 표준어 합쇼체에서 자연스럽고, ‘사랑하신 그분은’이라는 문장 분할은 원문의 선행 분사와 마지막 동사의 강조를 무리 없이 드러냅니다.
  terminology: ‘유월절 절기’, ‘아버지’, ‘자기 사람들’, ‘끝까지’는 원문의 범위와 요한복음의 용례를 적절히 반영합니다. ‘자기 사람들’은 특정 집단으로 과도하게 한정하지 않습니다.
  issues:
  - severity: medium
    issue: 각주 a의 앵커가 잘못 배치되어 있습니다.
    rationale: 각주 a의 내용은 유월절 절기가 아니라 εἰς τέλος(‘끝까지’)의 대안적 의미를 설명합니다. 따라서 ‘끝까지’에 붙어야 합니다.
  - severity: medium
    issue: 각주 b는 원문상 유의미한 대안 번역을 제공하지 않으며, 현행 본문의 중복된 ‘사랑’ 표현을 삭제하는 방향입니다.
    rationale: ἀγαπήσας와 ἠγάπησεν의 반복은 원문의 문체적 강조입니다. 제시된 대안은 이를 축소하므로 보존할 필요가 없습니다.
  - severity: low
    issue: ‘옮겨 갈 때가 된’이라는 표현이 어색하게 ‘때’를 반복합니다.
    rationale: ἦλθεν αὐτοῦ ἡ ὥρα는 ‘그분의 때가 왔다/온 것’으로 옮기는 것이 자연스럽고 관용적입니다.
  revised_text: 유월절 절기 전에, 예수께서는 자신이 이 세상을 떠나 아버지께로 가실 때가 온 것을 아셨습니다. 세상에 있는 자기 사람들을 사랑하신 그분은 그들을 끝까지[a] 사랑하셨습니다.
