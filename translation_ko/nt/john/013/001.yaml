id: JHN.13.1
reference: John 13:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Now before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
  footnotes:
  - marker: a
    text: Or 'to the fullest extent' or 'completely.' The Greek phrase may express both enduring love to the final moment and love in its fullest measure.
    reason: lexical_alternative
  - marker: b
    text: Or 'having loved his own who were in the world, loved them to the end'.
    reason: previous_rendering
translation:
  language: ko
  text: 유월절 절기 전에, 예수께서는 자신이 이 세상을 떠나 아버지께로 가실 때가 온 것을 아셨습니다. 세상에 있는 자기 사람들을 사랑하신 그분은 그들을 끝까지[a] 사랑하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전히’ 또는 ‘최대한으로’로도 옮길 수 있습니다. 이 그리스어 표현은 마지막 순간까지 지속된 사랑과 가장 충만한 사랑을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  english_pob_choice: Now before the Feast of the Passover
  chosen_korean: 유월절 잔치 전에
  alternatives_korean:
  - 유월절 전에
  - 유월절 절기 전에
  lexicon: BDAG
  rationale: ἑορτή는 단순한 날짜보다 절기·잔치의 공적 성격을 가리키므로, 직역의 딱딱함을 피하면서도 ‘유월절 잔치’로 살렸습니다.
- source_word: εἰδὼς ὁ Ἰησοῦς ὅτι ἦλθεν αὐτοῦ ἡ ὥρα
  english_pob_choice: Jesus, knowing that his hour had come
  chosen_korean: 예수께서는 자기 때가 ... 된 것을 아시고
  alternatives_korean:
  - 예수께서는 자기 시간이 왔음을 아시고
  - 예수께서는 그분의 때가 이른 것을 아시고
  lexicon: BDAG
  rationale: 요한복음의 ἡ ὥρα는 단순한 시각이 아니라 예수의 결정적 정해진 때를 뜻하므로, ‘때’로 옮겨 그 신학적 울림을 보존했습니다.
- source_word: μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  english_pob_choice: to depart from this world to the Father
  chosen_korean: 이 세상에서 아버지께로 옮겨 갈
  alternatives_korean:
  - 이 세상에서 아버지께로 떠날
  - 이 세상을 떠나 아버지께로 갈
  lexicon: BDAG
  rationale: μεταβαίνω는 단순 이동보다 상태·장소의 전환을 시사하므로, ‘옮겨 가다’로 옮겨 출발과 이행의 뉘앙스를 함께 살렸습니다.
- source_word: τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  english_pob_choice: his own who were in the world
  chosen_korean: 세상에 있는 자기 사람들을
  alternatives_korean:
  - 세상에 있는 자기들을
  - 세상에 있는 자기 소유의 사람들을
  lexicon: BDAG
  rationale: τοὺς ἰδίους는 관계적 소유·친밀성을 함축하므로, 문맥상 제자들을 가리키는 것을 반영해 ‘자기 사람들’로 자연스럽게 옮겼습니다.
- source_word: εἰς τέλος ἠγάπησεν αὐτούς
  english_pob_choice: loved them to the end
  chosen_korean: 끝까지 그들을 사랑하셨습니다
  alternatives_korean:
  - 완전히 그들을 사랑하셨습니다
  - 최후까지 그들을 사랑하셨습니다
  lexicon: BDAG
  rationale: εἰς τέλος은 시간적으로 ‘끝까지’이면서 질적으로 ‘완전히’의 뜻도 가질 수 있어, 본문에는 더 열려 있는 ‘끝까지’를 두고 그 중의성을 보존했습니다.
theological_decisions:
- issue: εἰς τέλος의 의미 중의성
  chosen_reading: 본문은 ‘끝까지’로 두어 최종 순간까지의 지속성과 사랑의 충만함을 함께 열어 둡니다.
  alternative_readings:
  - 완전히
  - 최후까지
  rationale: 요한복음의 표현은 예수의 사랑이 시간적으로 마지막 순간까지 이어졌다는 뜻과, 질적으로 완전했다는 뜻을 함께 전달할 수 있으므로, 한쪽으로 좁히지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
