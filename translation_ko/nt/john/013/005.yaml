  source_fidelity: 원문의 순차적 동작, ‘씻기 시작하다’(ἤρξατο νίπτειν), 수건으로 발을 닦는 행위, 그리고 허리에 두른 수건이라는 의미는 대체로 반영되었습니다. 다만 현 문장의 ‘씻기 시작하시고 … 닦으셨습니다’는 ἤρξατο가 씻기와 닦기라는 병렬 부정사에 걸리는 구조를 한국어에서 충분히 자연스럽게 드러내지 못합니다.
  naturalness: 합쇼체 경어는 대체로 적절하나, 예수님을 높이는 서술 가운데 ‘그가 허리에 두르고 있던’은 ‘계시던’보다 덜 일관됩니다. 또한 각주 표지가 문장 끝에 함께 놓여 있어 각각의 어휘가 아닌 문장 전체에 붙는 듯 보입니다.
