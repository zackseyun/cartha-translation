id: JHN.13.5
reference: John 13:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
  footnotes:
  - marker: a
    text: Or 'basin.' The Greek term denotes a vessel used for washing.
    reason: lexical_alternative
  - marker: b
    text: Or 'with which he was girded.' The Greek idiom refers to the towel tied around him for service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 그는 물을 대야에 붓고, 제자들의 발을 씻기 시작하시고 그가 허리에 두르고 있던 수건으로 닦으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘대야’는 씻는 데 쓰는 그릇이라는 기능을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘허리에 두르고 있던’은 ‘그가 둘러 맨/띤’이라는 뜻을 풀어 쓴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  english_pob_choice: Then
  chosen_korean: 그런 다음
  alternatives_korean:
  - 그때
  - 그 후
  lexicon: BDAG
  rationale: 서술의 순서를 자연스럽게 이어 주는 표현으로, 문맥상 단순한 시간 연결을 한국어로 매끄럽게 옮겼습니다.
- source_word: βάλλει ὕδωρ εἰς τὸν νιπτῆρα
  english_pob_choice: pours water into the washbasin
  chosen_korean: 물을 대야에 붓고
  alternatives_korean:
  - 물을 세숫대야에 붓고
  - 물을 세면대에 붓고
  lexicon: BDAG
  rationale: νιπτῆρα는 씻기 위한 그릇이므로 기능을 살려 ‘대야’로 옮겼고, βάλλει는 물과 결합할 때 ‘붓다’가 자연스럽습니다.
- source_word: ἤρξατο νίπτειν
  english_pob_choice: began to wash
  chosen_korean: 씻기 시작하시고
  alternatives_korean:
  - 씻기 시작하고
  - 씻기셨고
  lexicon: BDAG
  rationale: ἤρξατο + 부정사는 동작의 개시를 나타내므로 ‘시작하시고’로 풀어 연속 동작을 살렸습니다.
- source_word: τῷ λεντίῳ ᾧ ἦν διεζωσμένος
  english_pob_choice: with the towel with which he was girded
  chosen_korean: 그가 허리에 두르고 있던 수건으로
  alternatives_korean:
  - 그가 두르고 있던 수건으로
  - 그가 허리에 띠고 있던 수건으로
  lexicon: BDAG
  rationale: λεντίον은 수건/천을 뜻하고, διεζωσμένος는 몸에 둘러 맨 상태를 가리키므로 ‘허리에 두르다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 예수의 낮아지심과 종의 행위 표현
  chosen_reading: 문맥의 서술성을 살려 예수의 손동작을 직접적으로 묘사하되, 과도한 해설 없이 섬김의 낮아지심이 드러나게 했습니다.
  alternative_readings:
  - 예수께서 자신을 낮추어 제자들의 발을 씻기셨습니다
  - 예수께서 종처럼 제자들의 발을 씻으셨습니다
  rationale: 본문 자체가 행위의 연속을 보여 주므로 해석을 덧붙이기보다 장면의 힘을 유지하는 쪽이 원문에 가깝습니다.
  doctrine_reference: 요한복음 13장 문맥상 섬김의 모범
- issue: 동작 개시를 나타내는 ἤρξατο의 처리
  chosen_reading: ‘씻기 시작하시고’로 옮겨 발 씻김과 닦음이 이어지는 연속 동작을 드러냈습니다.
  alternative_readings:
  - 씻으셨고
  - 씻기셨습니다
  rationale: 헬라어의 ‘~하기 시작하다’ 구조를 보존해 다음 동작과의 연결을 분명히 했습니다.
  doctrine_reference: SBLGNT 구문 관찰
