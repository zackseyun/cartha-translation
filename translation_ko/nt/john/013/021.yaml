review_pass:
  verdict: revise
  source_fidelity: 본문은 시간 순서, 예수님의 영적·내적 동요, 엄숙한 증언, 그리고 제자 가운데 한 사람이 예수님을 넘겨줄 것이라는 예고를 대체로 충실히 담고 있습니다. 그러나 각주가 παραδώσει με가 아니라 ἐταράχθη τῷ πνεύματι에 붙어 있어 영어 POB 감사 기록 및 실제 어휘 대안과 일치하지 않습니다.
  naturalness: ‘영 안에서 괴로워하시며’는 이해되지만 다소 직역투이며, 뒤의 ‘증언하여 말씀하셨습니다’와 함께 동작의 순서가 약해집니다. ‘영 안에서 괴로워하시고, 증언하여 말씀하셨습니다’로 하면 원문의 연속된 서술을 더 자연스럽게 드러냅니다. 또한 ‘여러분 가운데 하나’는 사람을 가리키는 표현으로는 어색하므로 ‘여러분 가운데 한 사람이’가 자연스럽습니다.
  terminology: ‘증언하다’는 요한복음의 μαρτυρέω를 잘 반영합니다. παραδίδωμι를 본문에서 ‘넘겨주다’로 옮긴 것은 가능한 직역적 선택이며, 문맥적 의미인 ‘배반하다/배신하다’는 각주가 아니라 ‘넘겨주다’의 대안으로 보존되어야 합니다. ‘진실로, 진실로’도 Ἀμὴν ἀμὴν의 반복을 충실히 살립니다.
