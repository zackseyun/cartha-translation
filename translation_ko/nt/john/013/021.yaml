id: JHN.13.21
reference: John 13:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
  footnotes:
  - marker: a
    text: Or, more literally, “will hand me over.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 이 말씀들을 하신 뒤, 영 안에서 괴로워하시고 증언하여 말씀하셨습니다. “진실로, 진실로 내가 여러분에게 말합니다. 여러분 가운데 한 사람이 나를 넘겨줄 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 배반할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  english_pob_choice: After saying these things
  chosen_korean: 이 말씀들을 하신 뒤
  alternatives_korean:
  - 이것들을 말씀하신 뒤
  - 이 말씀들을 하신 후에
  lexicon: SBLGNT / 문맥상 지시대명사
  rationale: ταῦτα는 앞선 단락의 발언을 가리키므로 자연스럽게 ‘이 말씀들’로 옮기고, aorist 분사 구조는 시간 순서를 드러내는 ‘하신 뒤’로 처리했습니다.
- source_word: ἐταράχθη τῷ πνεύματι
  english_pob_choice: was troubled in spirit
  chosen_korean: 영 안에서 괴로워하시며
  alternatives_korean:
  - 영이 괴로워하셨으며
  - 영에 있어 괴로워하시며
  lexicon: BDAG
  rationale: τῷ πνεύματι는 영역/관점의 여격으로 보고 ‘영 안에서’로 살렸으며, ἐταράχθη의 내적 동요는 ‘괴로워하시며’가 과도한 해석 없이 담아 줍니다.
- source_word: ἐμαρτύρησεν
  english_pob_choice: testified
  chosen_korean: 증언하여
  alternatives_korean:
  - 증언하시며
  - 증거하여
  lexicon: BDAG
  rationale: 요한복음의 μαρτυρέω는 단순한 ‘말하다’보다 엄숙한 증언 행위를 뜻하므로, 서술 동작을 이어 주는 부사적 표현으로 ‘증언하여’가 적절합니다.
- source_word: παραδώσει με
  english_pob_choice: will betray me
  chosen_korean: 나를 넘겨줄 것입니다
  alternatives_korean:
  - 나를 배반할 것입니다
  - 나를 팔아넘길 것입니다
  lexicon: BDAG
  rationale: παραδίδωμι의 기본 뜻은 ‘넘겨주다/건네주다’이므로 본문 차원에서는 ‘넘겨줄 것입니다’로 직역성을 유지했습니다. 다만 문맥상 배신의 행위이므로 영어 POB의 ‘betray’에 해당하는 해석적 색채는 충분히 전달됩니다.
theological_decisions:
- issue: 예수의 내적 동요 표현
  chosen_reading: ‘영 안에서 괴로워하시며’로 예수의 실제 인간적 동요를 드러내되, 추가 설명으로 완화하지 않습니다.
  alternative_readings:
  - ‘영 안에서 깊이 괴로워하시며’
  - ‘영이 불안해지시며’
  rationale: 본문은 예수의 진정한 정서적 충격을 숨기지 않으므로, 이를 그대로 보존하는 것이 성육신의 현실성을 해치지 않습니다. 과도한 심리화도 피했습니다.
  doctrine_reference: 성육신과 참된 인간성의 보존
- issue: παραδίδωμι의 배반 예고
  chosen_reading: 문맥상 ‘넘겨줄 것입니다’로 옮기되, 배반의 의미는 전체 서술이 분명히 드러내도록 합니다.
  alternative_readings:
  - ‘배반할 것입니다’
  - ‘넘겨줄 것입니다’
  rationale: 동사의 기본 의미를 살려 본문 자체의 투명성을 유지하면서, 바로 뒤의 상황이 배신임을 독자가 알 수 있게 했습니다. 이렇게 하면 어휘적 폭과 문맥적 의미를 함께 보존할 수 있습니다.
  doctrine_reference: '번역 원칙: 본문 우선, 문맥 보존'
