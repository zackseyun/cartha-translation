  rationale: 총부정을 자연스럽고 유려하게 드러내기 위해 ‘아무도’를 택했습니다.
- source_word: τῶν ἀνακειμένων
  english_pob_choice: of those reclining at the table
  chosen_korean: 식탁에 함께 앉아 있던 사람들 가운데
  alternatives_korean:
  - 식탁에 기대어 있던 사람들 가운데
  - 식사 자리에 앉아 있던 사람들 가운데
  lexicon: BDAG
  rationale: ἀνάκειμαι의 식사 장면을 살리면서도 현대 독자가 이해하기 쉽게 ‘식탁에 함께 앉아 있던 사람들’로 옮겼습니다.
- source_word: πρὸς τί
  english_pob_choice: why
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 목적으로
