    issue: ‘자기에게’의 지시 대상이 불명확하고 재귀적으로 오해될 수 있음
    rationale: 그리스어 αὐτῷ는 예수 자신이 아니라 그가 말을 건넨 상대(앞 문맥의 유다)입니다. 한국어 ‘자기’는 통상 절의 주어 ‘그’를 가리킬 수 있으므로 ‘그에게’로 바꾸어야 합니다.
  - severity: medium
    issue: ‘식탁에 함께 앉아 있던’이 ἀνακειμένων의 기대어 식사하는 자세를 충분히 반영하지 못함
    rationale: ἀνάκειμαι는 이 문맥에서 식사 자리에서 기대어 있는 것을 뜻합니다. ‘기대어 앉아 있던’이 이를 더 가깝게 옮깁니다.
