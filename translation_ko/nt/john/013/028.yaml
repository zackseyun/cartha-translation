  source_fidelity: 수정이 필요합니다. αὐτῷ는 앞 문맥의 유다를 가리키는 여격인데, 초안의 ‘자기에게’는 주어 ‘그’와 재귀적으로 연결되어 예수 자신에게 말한 것처럼 읽힐 수 있습니다. 또한 ἀνακειμένων의 식사 중 기대어 있는 자세는 ‘앉아 있던’만으로는 약화됩니다.
  naturalness: ‘식탁에 기대어 앉아 있던 사람들’은 고대 식사 관습을 충분히 드러내면서도 현대 한국어에서 이해 가능합니다. ‘무슨 까닭으로’는 πρὸς τί의 이유·목적 질문을 자연스럽게 보존합니다.
  terminology: 인명이나 특수 신학 용어는 없습니다. ‘이 말’은 τοῦτο가 앞선 발화를 가리키는 점을 자연스럽게 반영합니다.
  issues:
