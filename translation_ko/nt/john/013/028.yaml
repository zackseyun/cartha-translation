  lexicon: BDAG
  rationale: ἀνάκειμαι의 식사 장면을 살리면서도 현대 독자가 이해하기 쉽게 ‘식탁에 함께 앉아 있던 사람들’로 옮겼습니다.
- source_word: πρὸς τί
