    rationale: 각주는 πρὸς τί의 보다 형식적인 목적 표현을 제시해야 합니다. ‘무슨 목적으로’가 적절합니다.
  revised_text: 그러나 식탁에 기대어 앉아 있던 사람들 가운데 아무도 그가 무슨 까닭으로 그에게 이 말을 했는지 알지 못했습니다.[a]
