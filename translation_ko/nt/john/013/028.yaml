  - 이 일
  lexicon: BDAG
  rationale: 앞서 나온 발화를 가리키는 지시어이므로, 한국어에서는 자연스럽게 ‘이런 말’로 풀어 앞선 말과의 연결을 살렸습니다.
- source_word: οὐδεὶς
