  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
  footnotes:
  - marker: a
    text: Or 'In this everyone will know' or 'By this means everyone will know.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'have love among one another'; that is, show mutual love.
    reason: lexical_alternative
translation:
  language: ko
  text: 이로써 모든 사람이 여러분이 내 제자들인 줄 알게 될 것입니다. 곧 여러분이 서로 사랑을 가지면 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘서로 서로 가운데 사랑을 가지다’에 가깝습니다. 즉 상호 사랑을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이로써’는 ‘이 안에서’ 또는 ‘이로 말미암아’보다 자연스러운 현대 한국어 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  english_pob_choice: By this
  chosen_korean: 이로써
  alternatives_korean:
  - 이 안에서
  - 이로 말미암아
  - 이 일로
  lexicon: BDAG
  rationale: 표지 기능과 수단 기능을 함께 담는 간결한 현대 한국어로, 뒤의 인식 결과를 자연스럽게 이끕니다.
- source_word: γνώσονται πάντες
  english_pob_choice: everyone will know
  chosen_korean: 모든 사람이 … 알게 될 것입니다
  alternatives_korean:
  - 모두가 … 알게 될 것입니다
  - 사람마다 … 알게 될 것입니다
  lexicon: BDAG
  rationale: πάντες의 보편 범위를 표준적인 한국어로 풀어 ‘모든 사람’으로 옮기되, 자연스러운 문장 흐름을 위해 ‘알게 될 것입니다’로 처리했습니다.
- source_word: ἐμοὶ μαθηταί ἐστε
  english_pob_choice: you are my disciples
  chosen_korean: 여러분이 내 제자들인 줄
  alternatives_korean:
  - 여러분은 내 제자들입니다
  - 여러분이 내 제자라는 것을
  lexicon: BDAG
  rationale: 소유 관계를 직역하면 부자연스러우므로, 서술절로 풀어 인식 내용으로 자연스럽게 연결했습니다.
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  english_pob_choice: if you have love for one another
  chosen_korean: 서로 사랑을 가지면
  alternatives_korean:
  - 서로 사랑을 지니면
  - 서로 사랑이 있으면
  - 서로를 사랑하면
  lexicon: BDAG
  rationale: 문자적으로는 ‘서로 안에 사랑을 가지다’에 가까워 mutual love의 관계성을 살리면서도 한국어에서 가장 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 제자 됨의 표지로서의 조건문 처리
  chosen_reading: ‘곧 … 말입니다’로 설명적 종속절을 두어, 사랑이 제자 됨을 만들어 내는 조건이 아니라 식별되는 표지임을 드러냈습니다.
  alternative_readings:
  - ‘만일 여러분이 서로 사랑하면’
  - ‘여러분이 서로 사랑할 때’
  rationale: 헬라어 ἐὰν은 조건을 나타내지만, 문맥상 제자 됨의 근거를 성립시키는 공로 조건이 아니라 인식 가능한 표지입니다. 한국어에서도 이 점이 드러나도록 과도한 공로 뉘앙스를 피했습니다.
  doctrine_reference: DOCTRINE.md § Affirmations; § Translation philosophy, point 3
