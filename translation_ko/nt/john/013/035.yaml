  text: 이로써[a] 모든 사람이 여러분이 내 제자들인 줄 알게 될 것입니다. 여러분이 서로 사랑하면[b] 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이로써’는 문맥에 따라 ‘이 안에서’ 또는 ‘이로 말미암아’로도 옮길 수 있습니다.
    reason: lexical_alternative
