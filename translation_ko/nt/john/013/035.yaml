revisions:
- from: 이로써 모든 사람이 여러분이 내 제자들인 줄 알게 될 것입니다. 곧 여러분이 서로 사랑을 가지면 말입니다.[a][b]
  to: 이로써[a] 모든 사람이 여러분이 내 제자들인 줄 알게 될 것입니다. 여러분이 서로 사랑하면[b] 말입니다.
  rationale: 원문의 조건절(ἐὰν … ἔχητε)을 ‘여러분이 서로 사랑하면’으로 보존하고, 한국어의 자연스러운 표현을 위해 ‘사랑을 가지면’을 ‘서로 사랑하면’으로 고쳤습니다. ‘말입니다’는 앞 문장 전체를 받아 조건의 표지적 기능을 자연스럽게 덧붙이면서도 조건 자체를 삭제하지 않습니다. 각주 표지는 해당 표현 뒤에 오도록 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:37Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ἐὰν 조건절을 ‘곧 … 말입니다’로 바꾸어 원문의 명시적 조건 형식을 약화시켰고, ‘서로 사랑을 가지면’은 한국어에서 다소 어색합니다. ἐν ἀλλήλοις는 여기서 상호성을 나타내므로 ‘서로 사랑하면’이 자연스럽고 충분히 충실합니다.
  naturalness: ‘이로써 모든 사람이 여러분이 내 제자들인 줄 알게 될 것입니다’은 자연스럽습니다. 반면 ‘곧 여러분이 서로 사랑을 가지면 말입니다’은 문장 종결 뒤에 조건절을 덧붙이는 방식이 어색하며 합쇼체의 정중한 성경 문체에도 맞지 않습니다.
  terminology: ‘제자들’, ‘사랑’, ‘모든 사람’은 적절합니다. ‘서로 사랑하면’은 ἀγάπην ἔχητε ἐν ἀλλήλοις의 상호 사랑을 자연스럽게 표현하며, 별도의 교리적 해석을 더하지 않습니다.
  issues:
  - severity: medium
    issue: ἐὰν 조건절이 ‘곧 … 말입니다’로 재구성됨
    rationale: ἐὰν ἔχητε는 명시적인 조건절입니다. 이것을 설명적 후치 표현으로 바꾸면 원문의 문법적 형태와 조건성의 여지를 불필요하게 약화시킵니다. ‘만일/여러분이 … 하면’으로 옮기는 것이 충실합니다.
  - severity: low
    issue: ‘서로 사랑을 가지면’의 비자연스러움
    rationale: 한국어에서는 ‘사랑을 가지다’보다 ‘서로 사랑하면’ 또는 ‘서로 사랑이 있으면’이 자연스럽습니다. 문맥상 ‘서로 사랑하면’이 상호적 방향을 분명하고 간결하게 전달합니다.
  - severity: low
    issue: 각주 표지와 내용의 대응이 뒤바뀜
    rationale: 본문에서 [a][b] 순서로 붙었지만 [a]는 상호 사랑 표현, [b]는 ‘이로써’에 관한 각주입니다. 해당 표현 직후에 각각 배치하도록 순서를 바로잡는 것이 독자의 추적에 적절합니다.
