id: JHN.14.30
reference: John 14:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
  footnotes:
  - marker: a
    text: Or, 'the ruler of this world.' Some English versions add 'this' in line with similar Johannine expressions, but the Greek here reads simply 'of the world.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'he has no claim on me' or 'he has no hold over me.' The Greek is literally, 'he has nothing in me.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제는 여러분과 많은 말을 나누지 않겠습니다. 세상의 통치자[a]가 오고 있기 때문입니다. 그는 내 안에 아무것도 가지고 있지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 세상의 통치자’입니다. 일부 번역은 요한복음의 유사한 표현에 따라 ‘이’를 넣지만, 여기의 그리스어는 단순히 ‘세상의’라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 내게 아무런 권리도 없다’ 혹은 ‘그는 내게 아무런 지배력도 없다’입니다. 그리스어의 문자적 표현은 ‘그는 내 안에 아무것도 가지고 있지 않다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν
  english_pob_choice: I will no longer speak much with you
  chosen_korean: 이제는 여러분과 더 많이 말하지 않겠습니다
  alternatives_korean:
  - 이제는 여러분과 더 이상 많이 말하지 않겠습니다
  - 이제는 여러분과 오래 말하지 않겠습니다
  lexicon: SBLGNT; BDAG
  rationale: οὐκέτι는 ‘더 이상/이제는 더’의 시간적 중단을, πολλὰ λαλήσω는 ‘많이 말하다’의 양적 표현을 담으므로, 합쇼체에서 자연스럽고 간결하게 살렸습니다.
- source_word: ὁ τοῦ κόσμου ἄρχων
  english_pob_choice: the ruler of the world
  chosen_korean: 이 세상의 통치자
  alternatives_korean:
  - 세상의 통치자
  - 세상의 지배자
  - 이 세상의 군주
  lexicon: BDAG
  rationale: ἄρχων은 단순한 ‘왕자’보다 ‘통치자/지배자’가 더 직접적이며, 본문에 없는 ‘this’를 반영해 ‘이 세상’으로 옮겨 영어 주석의 긴장을 드러냈습니다.
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  english_pob_choice: he has nothing in me
  chosen_korean: 그는 내게 아무것도 가지고 있지 않습니다
  alternatives_korean:
  - 그는 내 안에 아무것도 없습니다
  - 그는 내게 아무런 권리도 없습니다
  - 그는 내게 아무런 빌미도 없습니다
  lexicon: BDAG
  rationale: 그리스어의 간결한 표현을 그대로 살리되, 한국어에서 자연스러운 소유/관계 표현인 ‘내게 아무것도 가지고 있지 않습니다’로 옮겨, 주석이 제시한 해석 가능성(권리, 틈, 근거)은 본문 밖에 남겨 두었습니다.
theological_decisions:
- issue: ‘κόσμος’의 범위와 ‘이 세상’의 해석
  chosen_reading: 본문에는 단순히 ‘세상’이 아니라 ‘이 세상’으로 옮겨, 요한복음의 ‘세상’이 가진 타락한 질서를 염두에 두되, 본문에 없는 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - 세상
  - 세상의 질서
  rationale: 영어 POB가 주석에서 ‘this’를 본문이 아니라 해설로만 다루듯, 한국어도 본문과 주석을 구분해 본문은 직역에 가깝게 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
- issue: ‘he has nothing in me’의 의미
  chosen_reading: ‘아무것도 가지고 있지 않습니다’로 직역해, 사탄이 예수님 안에서 주장할 권리나 발붙일 지점을 찾지 못한다는 의미는 본문이 아니라 주석 차원에 남겼습니다.
  alternative_readings:
  - 내게 아무런 권리가 없습니다
  - 내게 아무런 힘도 없습니다
  - 내게 아무런 빌미도 없습니다
  rationale: 원문은 매우 압축적이므로, 특정 해석으로 좁히지 않고 문장 자체의 강도를 보존하는 것이 합쇼체 한국어에서도 가장 투명합니다.
  doctrine_reference: Translation philosophy 3
