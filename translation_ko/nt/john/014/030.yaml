revisions:
- from: 이제는 여러분과 더 많이 말하지 않겠습니다. 이 세상의 통치자가 오기 때문입니다. 그리고 그는 내게 아무것도 가지고 있지 않습니다.[a][b]
  to: 이제는 여러분과 많은 말을 나누지 않겠습니다. 세상의 통치자[a]가 오고 있기 때문입니다. 그는 내 안에 아무것도 가지고 있지 않습니다.[b]
  rationale: 본문에 없던 비교 의미와 지시어를 제거하고, ἐν ἐμοὶ의 ‘내 안에’를 보존했습니다. 또한 각주 표지를 해당 어구에 붙여 구조와 참조 대상을 명확히 했습니다. 수정문은 원문의 ‘그가 내 안에 아무것도 가지고 있지 않다’라는 다소 압축적이고 해석의 여지가 있는 표현을 유지하며, 권리나 장악력이라는 해석은 각주에만 남깁니다.
