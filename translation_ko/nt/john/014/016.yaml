translation:
  language: ko
  text: 그리고 나는 아버지께 구하겠습니다[a]. 그러면 그분께서 여러분에게 또 다른 보혜사를 주셔서, 그분이 여러분과 영원히 함께 계시게 하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도우시는 분’, ‘변호자’, 전통적으로 ‘위로자’로 번역할 수 있는 그리스어 παράκλητος의 대안적 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  english_pob_choice: And I
  chosen_korean: 그리고 나는
  alternatives_korean:
  - 나도
  - 그리고 나도
  lexicon: BDAG
  rationale: κἀγώ는 접속된 1인칭 주어이므로 문맥의 흐름을 살리면서도 과도한 강조를 피하기 위해 ‘그리고 나는’으로 옮겼습니다.
- source_word: ἐρωτήσω τὸν πατέρα
  english_pob_choice: will ask the Father
  chosen_korean: 아버지께 구하겠습니다
  alternatives_korean:
  - 아버지께 요청하겠습니다
  - 아버지께 기도하겠습니다
  lexicon: BDAG
  rationale: ἐρωτάω의 미래형은 자연스럽게 ‘구하다/청하다’로 옮길 수 있으며, 여기서는 아들-아버지 관계의 친밀성과 청원의 뉘앙스를 살려 ‘아버지께 구하겠습니다’로 번역했습니다.
- source_word: παράκλητον
  english_pob_choice: Advocate
  chosen_korean: 보혜사
  alternatives_korean:
  - 도우시는 분
  - 변호자
  - 위로자
  lexicon: JOHN_USAGE
  rationale: 요한복음 14–16장의 παράκλητος는 단순한 기능어보다 인격적·대표적 역할을 함께 지니므로, 교회 전통과 본문 사용례를 반영하는 ‘보혜사’를 택했습니다.
- source_word: ἄλλον
  english_pob_choice: another
  chosen_korean: 또 다른
  alternatives_korean:
  - 다른
  - 한 분 더
  lexicon: BDAG
  rationale: ἄλλος는 이미 존재하는 대상과 구별되는 ‘다른’이라는 뜻이므로, 보혜사의 인격성과 연속성을 드러내는 자연스러운 표현인 ‘또 다른’으로 옮겼습니다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영원토록
  lexicon: BDAG
  rationale: 이 관용구는 요한문맥에서 지속적이고 끝없는 존속을 뜻하므로, 현대 한국어에서 가장 직접적이고 자연스러운 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: παράκλητος의 한국어 렌더링
  chosen_reading: 보혜사
  alternative_readings:
  - 도우시는 분
  - 변호자
  - 위로자
  rationale: ‘또 다른 보혜사’는 예수님의 뒤를 잇는 인격적 존재를 가리키므로, 기능만을 좁게 말하는 표현보다 한국 교회 전통에서 널리 이해되는 ‘보혜사’가 본문의 신학적 중량을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; readable modern Korean, not archaic or overly explanatory.'
- issue: 아버지께 대한 청원의 문체
  chosen_reading: 구하겠습니다
  alternative_readings:
  - 요청하겠습니다
  - 빌리겠습니다
  rationale: 예수님의 발화는 제자들에게 들려주는 약속의 말씀으로서 합쇼체를 유지하되, 아버지께 드리는 청원의 동작은 ‘구하다’로 옮겨 삼위 간 관계의 친밀성과 공손함을 함께 드러냈습니다.
  doctrine_reference: Johannine discourse style and Korean reverential speech conventions
