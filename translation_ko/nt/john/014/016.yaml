  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 현행 ‘주셔서, 그분이 ... 계시게 하실 것입니다’는 아버지께서 보혜사로 하여금 함께 계시도록 하신다는 사역(使役)의 의미를 더해, ἵνα ᾖ의 목적절을 다소 부정확하게 처리합니다. 목적을 직접 나타내는 표현으로 고치는 것이 안전합니다.
  naturalness: 합쇼체는 일관되고 전반적으로 자연스럽습니다. 다만 문장 중간의 대명사 ‘그분’과 ‘계시게 하실 것입니다’의 결합은 지시 관계와 사역성을 불필요하게 복잡하게 합니다. 목적절을 앞세운 문장이 더 간결하고 자연스럽습니다.
  terminology: ‘아버지’, ‘또 다른’, ‘보혜사’, ‘영원히’는 적절합니다. ‘보혜사’는 한국어 성경 전통에서 널리 쓰이는 용어이므로 유지할 수 있으며, 대안 번역은 각주에서 제시하는 것이 좋습니다. 다만 각주 표지가 현재 ‘아버지께’에 붙어 있어 παράκλητος에 관한 각주라는 점과 맞지 않습니다.
