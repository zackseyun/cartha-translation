  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
  footnotes:
  - marker: a
    text: Or, more literally, 'Jesus says to him.' Greek uses a historical present here.
    reason: lexical_alternative
  - marker: b
    text: Or 'No one comes to the Father unless through me.'
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “내가 길이요, 진리요, 생명입니다. 아버지께로 오는 사람은 나를 통하지 않고는 아무도 없습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “예수께서 그에게 말씀하십니다”이며, 헬라어는 역사적 현재를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “아무도 아버지께는 나를 통하지 않고서는 오지 않습니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말합니다
  lexicon: SBLGNT
  rationale: 헬라어 현재형 역사적 현재를 한국어 서술에서는 자연스러운 과거형으로 옮기되, 예수의 발화를 공손하고 구어적으로 드러내기 위해 “말씀하셨습니다”를 선택했습니다.
- source_word: Ἐγώ εἰμι
  english_pob_choice: I am
  chosen_korean: 내가 …입니다
  alternatives_korean:
  - 나는 …입니다
  lexicon: BDAG
  rationale: 강조된 1인칭 표현을 살리면서 한국어에서는 주어 ‘내가’를 두어 선언적 자기계시의 힘을 유지했습니다.
- source_word: ἡ ὁδός καὶ ἡ ἀλήθεια καὶ ἡ ζωή
  english_pob_choice: the way, and the truth, and the life
  chosen_korean: 길이요, 진리요, 생명입니다
  alternatives_korean:
  - 길이며, 진리이며, 생명입니다
  - 길, 진리, 생명입니다
  lexicon: BDAG
  rationale: 각 명사 앞의 정관사 반복과 삼중 병렬을 한국어의 종결 보조와 반복 어미로 살려, 단순 열거보다 선언적 리듬이 드러나게 했습니다.
- source_word: οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ
  english_pob_choice: No one comes to the Father except through me
  chosen_korean: 아버지께로 오는 사람은 나를 통하지 않고는 아무도 없습니다
  alternatives_korean:
  - 아버지께 오는 사람은 나를 통하지 않고는 아무도 없습니다
  - 아버지께로 오는 자는 나를 통하지 않고는 아무도 없습니다
  lexicon: BDAG
  rationale: ‘ἔρχεται πρὸς τὸν πατέρα’의 도착 방향성을 ‘아버지께로 오는’으로 살리고, ‘εἰ μὴ δι’ ἐμοῦ’는 배타적 통로의 뜻을 한국어 부정 조건 구조로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 아버지께 나아가는 유일한 통로의 배타성
  chosen_reading: “나를 통하지 않고는 아무도 없습니다”로 직역적 배타성을 유지했습니다.
  alternative_readings:
  - 저를 통해서만 가능합니다
  - 나를 거치지 않고는 아무도 아버지께 갈 수 없습니다
  rationale: 본문의 예외 불가 진술을 약화시키지 않기 위해 ‘except through me’의 배타적 의미를 분명히 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
