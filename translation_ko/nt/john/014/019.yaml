id: JHN.14.19
reference: John 14:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
  footnotes:
  - marker: a
    text: Or 'behold/observe me' for both instances of 'see'; the Greek verb can imply more than a mere glance.
    reason: lexical_alternative
  - marker: b
    text: '''You also will live'' may refer to the disciples'' share in Jesus'' resurrection life, spiritual life in union with him, or both.'
    reason: alternative_reading
translation:
  language: ko
  text: 아직 조금 더 있으면 세상은 더 이상 나를 보지 못하겠지만, 너희는 나를 볼 것입니다. 내가 사니 너희도 살 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보다’에 해당하는 그리스어 θεωρέω는 단순한 눈맞춤보다 더 지속적이거나 인식적인 ‘봄’을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희도 살 것입니다’는 예수님의 부활 생명에 참여하는 것, 영적 생명, 또는 그 둘을 함께 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  english_pob_choice: A little while longer
  chosen_korean: 아직 조금 더 있으면
  alternatives_korean:
  - 조금만 더 지나면
  - 아직 얼마 안 있어
  lexicon: BDAG
  rationale: 짧게 남은 시간을 자연스러운 한국어로 살리면서, 이어지는 미래 대비를 분명히 했습니다.
- source_word: θεωρεῖ / θεωρεῖτέ
  english_pob_choice: will no longer see / will see
  chosen_korean: 더 이상 나를 보지 못하겠지만 … 나를 볼 것입니다
  alternatives_korean:
  - 더 이상 나를 관찰하지 못하겠지만 … 나를 관찰할 것입니다
  - 더 이상 나를 바라보지 못하겠지만 … 나를 바라볼 것입니다
  lexicon: BDAG
  rationale: θεωρέω의 지속적·인식적 뉘앙스를 완전히 평범한 ‘보다’로만 고정하지 않되, 본문의 대비 구조를 해치지 않는 범위에서 자연스럽게 옮겼습니다.
- source_word: ζῶ / ζήσετε
  english_pob_choice: I live / you also will live
  chosen_korean: 내가 사니 너희도 살 것입니다
  alternatives_korean:
  - 내가 살아 있으니 너희도 살아 있을 것입니다
  - 내가 살아 있으니 너희도 살 것입니다
  lexicon: BDAG
  rationale: 현재형 ‘ζῶ’의 생동하는 상태를 ‘내가 사니’로 간결하게 살렸고, 미래형 ‘ζήσετε’는 ‘살 것입니다’로 대응했습니다.
theological_decisions:
- issue: 제자들이 ‘나를 볼 것입니다’라는 표현의 의미
  chosen_reading: 부활 ظهور, 믿음의 인식, 장차의 종말론적 봄을 특정하지 않고 넓게 유지했습니다.
  alternative_readings:
  - 부활 후 실제로 보는 것
  - 믿음으로 영적으로 보는 것
  - 현재와 미래를 아우르는 중층적 의미
  rationale: 그리스어는 시각의 방식과 시점을 구체화하지 않으므로, 번역도 그 긴장을 그대로 보존하는 편이 적절합니다.
  doctrine_reference: 본문의 신학적 긴장 보존
- issue: ‘너희도 살 것입니다’의 범위
  chosen_reading: 육체적 생존, 부활 생명, 영적 생명으로 의미를 좁히지 않고 그대로 두었습니다.
  alternative_readings:
  - 부활 생명을 얻을 것입니다
  - 영적으로 살 것입니다
  - 그와 연합한 생명에 참여할 것입니다
  rationale: ζήσετε는 신학적으로 풍부하지만 본문 자체는 범위를 특정하지 않으므로, 번역은 넓은 의미를 유지해야 합니다.
  doctrine_reference: 본문의 신학적 긴장 보존
