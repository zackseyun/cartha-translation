review_pass:
  verdict: approve
  source_fidelity: 그리스어의 시간 표현(ἔτι μικρόν), 세상과 제자들의 대조(δὲ), ‘더 이상’(οὐκέτι), ‘보다’(θεωρέω), 그리고 ‘내가 사니 너희도 살 것입니다’라는 인과적 연결(ὅτι, ζῶ, ζήσετε)을 충실히 반영합니다. ‘보지 못하겠지만’은 문맥상 미래의 불가능을 자연스럽게 표현하며, 원문의 의미를 과도하게 제한하지 않습니다.
  naturalness: 문장은 현대 표준 한국어 합쇼체로 자연스럽고 읽기 쉽습니다. ‘아직 조금 더 있으면’은 ‘ἔτι μικρόν’의 짧게 남은 시간을 적절히 드러내며, 전체 대조 구조도 명료합니다.
  terminology: ‘세상’, ‘보다’, ‘살 것입니다’는 요한복음의 문맥과 한국어 성경 문체에 잘 맞습니다. ‘내가 사니’는 현재형 ζῶ를 간결하게 보존하고, ‘너희도’는 καί의 연결을 반영합니다. 각주도 θεωρέω의 넓은 의미와 ζήσετε의 해석상 범위를 본문에 덧붙이지 않고 적절히 안내합니다.
