  source_fidelity: 수정이 필요합니다. 초안의 첫 문장인 ‘세상이 내가 아버지를 사랑하는 것을 알게 하려는 것입니다’는 ἵνα 목적절은 반영하지만, 이어지는 ‘아버지께서 … 명령하신 대로 나는 … 합니다’가 세상이 알게 될 내용에 함께 속한다는 원문의 연결(καί)을 분리합니다. 두 내용을 모두 ‘세상이 알게’ 되는 대상으로 묶어야 합니다.
