  terminology: ‘아버지’, ‘사랑하다’, ‘명령하다’, ‘세상’은 요한복음의 용례와 원문의 어휘 강도를 적절히 반영합니다. καθώς…οὕτως의 대응은 ‘…대로 행한다’로 충분히 드러납니다.
  issues:
