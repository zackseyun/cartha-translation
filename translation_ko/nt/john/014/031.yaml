id: JHN.14.31
reference: John 14:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
  footnotes:
  - marker: a
    text: Or 'just as the Father commanded me, so I do.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 세상이 내가 아버지를 사랑하고 아버지께서 내게 명령하신 대로 행한다는 것을 알게 하려는 것입니다. 일어나십시오, 여기서 떠납시다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아버지께서 내게 명령하신 대로, 나는 행합니다’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞뒤 문맥의 전환을 분명히 하는 역접으로, 현대 한국어에서 자연스러운 ‘그러나’가 가장 직접적으로 대응합니다.
- source_word: ἵνα γνῷ ὁ κόσμος
  english_pob_choice: so that the world may know
  chosen_korean: 세상이 … 알게 하려는 것입니다
  alternatives_korean:
  - 세상이 … 알도록
  - 세상이 … 알게 되도록
  lexicon: BDAG
  rationale: ἵνα의 목적 의미를 살리면서도 합쇼체 문장 흐름에 맞게 ‘하려는 것입니다’로 목적을 자연스럽게 풀었습니다. κόσμος는 요한복음의 용례를 따라 ‘세상’으로 옮겼습니다.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  english_pob_choice: I do just as the Father has commanded me
  chosen_korean: 아버지께서 내게 명령하신 대로 나는 그대로 합니다
  alternatives_korean:
  - 아버지께서 내게 명하신 대로 나는 그렇게 합니다
  - 아버지께서 내게 명령하신 대로 나는 그와 같이 행합니다
  lexicon: BDAG
  rationale: καθώς… οὕτως의 대응 구조를 한국어의 ‘…대로 …그대로’로 살려, 본문의 ‘정확히 일치하는 순종’을 드러냈습니다. ἐντέλλομαι는 약화시키지 않고 ‘명령하다’로 옮겼습니다.
- source_word: Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν
  english_pob_choice: Rise, let us go from here
  chosen_korean: 일어나십시오, 여기서 떠납시다
  alternatives_korean:
  - 일어나십시오, 여기서 갑시다
  - 일어나십시오, 이곳을 떠납시다
  lexicon: BDAG
  rationale: Ἐγείρεσθε는 제자들에게 향한 복수 명령으로 공손한 한국어 명령형 ‘일어나십시오’를 택했습니다. ἄγωμεν은 권유적 1인칭 복수로 ‘떠납시다’가 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: 아버지에 대한 예수의 순종과 사랑을 드러내는 진술
  chosen_reading: ‘아버지께서 내게 명령하신 대로 나는 그대로 합니다’로 번역해, 사랑과 순종의 병치를 약화하지 않았습니다.
  alternative_readings:
  - ‘아버지께서 내게 지시하신 대로 나는 합니다’
  - ‘아버지께서 내게 말씀하신 대로 나는 합니다’
  rationale: 본문은 예수의 사랑(ἀγαπῶ)과 순종(ἐνετείλατο… ποιῶ)을 함께 제시합니다. 한국어에서도 사랑과 명령-순종의 긴장을 분명히 보여 주는 것이 요한의 의도를 더 잘 보존합니다.
  doctrine_reference: '요한복음 14장; 번역 원칙 #1, #5'
