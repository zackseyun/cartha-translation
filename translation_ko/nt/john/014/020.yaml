id: JHN.14.20
reference: John 14:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
  footnotes:
  - marker: a
    text: Or, less idiomatically, 'In that day.'
    reason: lexical_alternative
  - marker: b
    text: The repeated 'in' language is preserved literally to reflect John's theme of mutual indwelling; alternatively, one might paraphrase 'in union with,' but that is more interpretive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날[a] 여러분은 내가 내 아버지 안에 있고, 여러분이 내 안에 있으며, 내가 여러분 안에 있다는 것을 알 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그날에’입니다.
    reason: lexical_alternative
  - marker: b
    text: 반복되는 ‘안에’ 표현은 원문의 반복된 전치사를 그대로 옮긴 것으로, 요한복음의 상호 내주 언어를 보존합니다.
    reason: theological_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그날에
  lexicon: BDAG
  rationale: 시간 부사구이므로 ‘그날에’로 옮겨 현대 한국어의 자연스러움을 살리되, 특정한 날을 가리키는 지시성을 유지했습니다.
- source_word: γνώσεσθε
  english_pob_choice: you will know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 알 것입니다
  - 알아차리게 될 것입니다
  lexicon: BDAG
  rationale: 미래의 인식/이해를 가리키므로 ‘알게 될 것입니다’가 가장 자연스럽고, 단순 지식보다 깨달음의 뉘앙스도 담습니다.
- source_word: ἐν τῷ πατρί μου
  english_pob_choice: I am in my Father
  chosen_korean: 내가 아버지 안에 있고
  alternatives_korean:
  - 내가 내 아버지 안에 있고
  - 내가 아버지와 함께 있고
  lexicon: BDAG
  rationale: 반복되는 ἐν을 그대로 ‘안에’로 살려 요한복음의 상호 내주 표현을 보존했습니다. ‘함께’로 풀면 원문의 은유가 약해집니다.
- source_word: ὑμεῖς ἐν ἐμοὶ ... κἀγὼ ἐν ὑμῖν
  english_pob_choice: and you are in me, and I am in you
  chosen_korean: 여러분이 내 안에 있으며, 내가 여러분 안에
  alternatives_korean:
  - 여러분이 나와 연합되어 있으며, 내가 여러분과 연합되어
  - 여러분이 내 안에 있고, 내가 여러분 안에
  lexicon: BDAG
  rationale: 동일한 ‘안에’ 표현을 반복해 관계의 상호성을 드러냈습니다. ‘연합하여’는 해석을 앞세워 원문의 긴장을 줄일 수 있습니다.
theological_decisions:
- issue: 요한복음의 상호 내주(ἐν ... ἐν ... ἐν) 표현
  chosen_reading: 세 번 반복되는 ‘안에’를 그대로 유지해, 예수와 아버지, 제자들 사이의 관계를 해석으로 단정하지 않고 드러내도록 했습니다.
  alternative_readings:
  - 아버지와 하나로, 여러분도 나와 하나로, 나도 여러분과 하나로
  - 아버지와 연합하여, 여러분도 나와 연합하여, 나도 여러분과 연합하여
  rationale: 본문은 상호 내주의 깊은 신학을 담고 있으므로, 이를 관계적 친밀감이나 존재론적 동일성 중 하나로 미리 좁히지 않는 편이 원문에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: 번역 철학 §3, ‘신학적 긴장을 해소하지 말고 보존하라.’'
- issue: ‘아버지’ 호칭의 직접성
  chosen_reading: ‘my Father’를 ‘내 아버지’보다 ‘아버지’로 옮겨, 한국어에서 이미 충분히 자연스러운 소유 관계를 유지했습니다.
  alternative_readings:
  - 내 아버지
  - 아버지께서
  rationale: 직역을 지나치게 밀어붙이면 문장이 어색해질 수 있어, 소유 의미는 문맥과 인칭 대명사로 충분히 보존된다고 보았습니다.
  doctrine_reference: 'DOCTRINE.md: 직역과 자연스러움의 균형'
