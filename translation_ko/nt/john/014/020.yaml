revisions:
- from: 그날에 여러분은 내가 아버지 안에 있고, 여러분이 내 안에 있으며, 내가 여러분 안에 있다는 것을 알게 될 것입니다.[a][b]
  to: 그날[a] 여러분은 내가 내 아버지 안에 있고, 여러분이 내 안에 있으며, 내가 여러분 안에 있다는 것을 알 것입니다.[b]
  rationale: 시간 표현을 현대 한국어에 맞게 ‘그날’로 다듬고, 미래의 앎을 과도하게 과정화하지 않도록 ‘알 것입니다’로 옮겼습니다. 또한 ‘내 아버지’로 소유 표현을 보존했습니다. 세 차례의 ‘안에’는 원문의 반복과 신학적 긴장을 유지하도록 그대로 두었습니다. 각주 a는 해당 시간 표현 바로 뒤로 옮겨 연결 대상을 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:41Z'
review_pass:
  verdict: revise
  source_fidelity: ‘알게 될 것입니다’는 미래의 인식에 도달하는 과정을 다소 부각할 수 있어, 단순한 미래형 γνώσεσθε에는 ‘알 것입니다’가 더 가깝습니다. 또한 πατρί μου의 소유 표현은 ‘내 아버지’로 명시하는 것이 안전합니다. 반복된 ἐν은 ‘안에’로 일관되게 보존한 점이 적절합니다.
  naturalness: ‘그날에’도 가능하지만 현대 표준어의 시간 부사구로는 ‘그날’이 더 자연스럽습니다. ‘그날 여러분은 … 알 것입니다’는 현대적인 합쇼체 문장으로 자연스럽습니다.
  terminology: ‘아버지’, ‘안에’ 및 ‘여러분’은 본문의 관계 언어와 현대적 공적 존대를 적절히 반영합니다. ‘안에’를 ‘연합하여’ 등으로 해석적으로 바꾸지 않아 신학적 다의성을 보존합니다.
  issues:
  - severity: low
    issue: ‘그날에’의 현대적 자연스러움
    rationale: 시간을 나타낼 때 ‘그날’이 더 관용적이며, ἐν ἐκείνῃ τῇ ἡμέρᾳ의 지시성과 시간성을 그대로 유지합니다.
  - severity: medium
    issue: γνώσεσθε의 과정성 부가
    rationale: ‘알게 될 것입니다’는 ‘come to know’처럼 깨달음에 이르는 과정을 강조할 수 있습니다. 원문의 미래형은 여기서 그러한 과정성을 반드시 요구하지 않으므로 ‘알 것입니다’가 더 절제된 번역입니다.
  - severity: low
    issue: πατρί μου의 소유 표현 미표시
    rationale: ‘아버지’만으로도 문맥상 이해되지만, 원문의 μου를 ‘내 아버지’로 드러내면 소유 관계를 분명히 보존합니다.
  revised_text: 그날[a] 여러분은 내가 내 아버지 안에 있고, 여러분이 내 안에 있으며, 내가 여러분 안에 있다는 것을 알 것입니다.[b]
