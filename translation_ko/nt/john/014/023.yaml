id: JHN.14.23
reference: John 14:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
  footnotes:
  - marker: a
    text: Or 'my teaching' or 'what I say' for 'my word.'
    reason: lexical_alternative
  - marker: b
    text: Or 'make a dwelling place with him' or 'make our home with him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하여 그에게 말씀하셨습니다. “누구든지 나를 사랑하면 내 말을 지킬 것입니다. 그러면 내 아버지께서 그를 사랑하실 것이며, 우리가 그에게 가서 그와 함께 살 곳을 마련하겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 말’은 여기서 λόγος의 가장 직접적인 의미를 살린 번역입니다. 문맥상 ‘내 말씀’이나 ‘내 가르침’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘살 곳을 마련하겠습니다’는 ‘우리의 거처를 만들다/우리의 집을 삼다’의 의미를 한국어로 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  english_pob_choice: answered and said
  chosen_korean: 대답하여 … 말씀하셨습니다
  alternatives_korean:
  - 대답하고 말씀하셨습니다
  - 대답하여 이르셨습니다
  lexicon: SBLGNT / BDAG
  rationale: 두 동사의 연속을 한국어에서 자연스럽게 살리면서도, 요한복음의 응답 장면을 형식적으로 보존하기 위해 ‘대답하여 말씀하셨습니다’로 옮겼습니다.
- source_word: τὸν λόγον μου
  english_pob_choice: my word
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 가르침
  - 내가 하는 말
  lexicon: BDAG
  rationale: 여기서 λόγος는 예수의 발화된 말씀을 가리키므로, 문맥상 가장 직접적인 ‘말’을 택했습니다. 다만 ‘말씀’은 신학적으로는 가능하지만 한국어에서 더 예전적이고 성경적 어감을 강하게 만들어, 본문의 즉각성을 살리는 데는 ‘내 말’이 더 적합합니다.
- source_word: τηρήσει
  english_pob_choice: will keep
  chosen_korean: 지킬 것입니다
  alternatives_korean:
  - 지켜 행할 것입니다
  - 준수할 것입니다
  - 지킬 것입니다
  lexicon: BDAG
  rationale: τηρέω는 단순 복종보다 ‘지키다, 보존하다, 간직하다’의 넓은 뜻을 가지므로, 관계적 충실함까지 포함하는 ‘지키다’가 가장 균형 잡힌 표현입니다.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  english_pob_choice: make our dwelling with him
  chosen_korean: 그와 함께 살 곳을 마련하겠습니다
  alternatives_korean:
  - 그와 함께 거할 곳을 마련하겠습니다
  - 그와 함께 머물 곳을 마련하겠습니다
  - 그와 함께 우리의 거처를 만들겠습니다
  lexicon: BDAG
  rationale: μονή는 ‘거처/머무는 자리’이지만, 한국어에서 직역형 ‘거처’를 쓰면 다소 경직될 수 있어 ‘살 곳’으로 풀어 인격적 동거의 의미를 살렸습니다. ‘마련하겠습니다’는 ποιέω의 ‘만들다’보다 관계적 결과를 자연스럽게 드러냅니다.
theological_decisions:
- issue: ‘우리’의 복수 주어(아버지와 예수)
  chosen_reading: ‘우리가 … 가서 … 마련하겠습니다’로 복수성을 그대로 살렸습니다.
  alternative_readings:
  - ‘내 아버지와 나는 …’로 설명적으로 풀기
  - 복수성을 약화해 단수처럼 옮기기
  rationale: 본문의 ἐλευσόμεθα, ποιησόμεθα는 예수와 아버지의 공동 행위를 분명히 나타내므로, 한국어에서도 복수 주어를 유지해 삼위적 구별과 연합을 흐리지 않게 했습니다.
  doctrine_reference: 요한복음 14장의 성부-성자 상호내주 맥락; 니케아 신경(381)과의 정합성
- issue: 장소 비유의 번역
  chosen_reading: ‘살 곳을 마련하겠습니다’로 번역해 단순한 건축 개념이 아니라 상호 임재의 의미를 드러냈습니다.
  alternative_readings:
  - ‘거처를 만들겠습니다’
  - ‘집을 삼겠습니다’
  rationale: 이 문맥의 μονή는 물리적 건물보다 하나님과 믿는 자 사이의 지속적 임재를 가리키므로, 한국어에서도 ‘살 곳’으로 옮겨 관계성과 내주성을 강조했습니다.
  doctrine_reference: 요한복음 14:2, 14:23의 내주(거함) 주제
