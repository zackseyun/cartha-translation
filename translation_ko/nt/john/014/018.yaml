id: JHN.14.18
reference: John 14:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
  footnotes:
  - marker: a
    text: Or 'I will not leave you orphaned.' The Greek image is of being left as children without parental care.
    reason: lexical_alternative
  - marker: b
    text: '''I am coming to you'' may refer to Jesus'' coming after the resurrection, his coming through the Holy Spirit, or his future return; the Greek wording itself does not force a single referent.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 여러분을 고아로 남겨 두지 않겠습니다. 나는 여러분에게로 갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 여러분을 고아처럼 버려두지 않겠습니다.’ ὀρφανούς는 부모의 돌봄 없이 남겨진 아이의 이미지를 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나는 여러분에게로 갑니다’는 부활 후 나타나심, 성령을 통한 오심, 또는 장차의 오심을 가리킬 수 있으며, 그리스어 표현 자체는 하나로 단정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ ἀφήσω
  english_pob_choice: I will not leave
  chosen_korean: 남겨 두지 않겠습니다
  alternatives_korean:
  - 떠나지 않겠습니다
  - 버려두지 않겠습니다
  - 남기지 않겠습니다
  lexicon: BDAG
  rationale: ἀφήσω는 이 문맥에서 단순한 '떠남'보다 뒤에 남겨 두는 의미가 핵심이므로, 한국어에서는 자연스럽게 '남겨 두다'로 옮기는 것이 source에 가장 가깝습니다.
- source_word: ὑμᾶς ὀρφανούς
  english_pob_choice: you as orphans
  chosen_korean: 여러분을 고아로
  alternatives_korean:
  - 여러분을 고아처럼
  - 여러분을 고아 상태로
  - 여러분을 부모 없는 아이로
  lexicon: BDAG
  rationale: ὀρφανούς는 문자적으로 부모가 없는 존재를 가리키는 이미지이므로, '고아로'라고 옮겨 가족 보호의 상실이라는 구체적 비유를 살렸습니다.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  english_pob_choice: I am coming to you
  chosen_korean: 나는 여러분에게로 갑니다
  alternatives_korean:
  - 나는 여러분에게로 옵니다
  - 나는 여러분에게 갑니다
  - 나는 여러분 쪽으로 갑니다
  lexicon: BDAG
  rationale: 현재형 ἔρχομαι의 즉각성과 운동성을 살리면서도 한국어에서 자연스러운 현재 진행적 표현인 '갑니다'를 사용했습니다.
theological_decisions:
- issue: ‘나는 여러분에게로 갑니다’의 참조 대상
  chosen_reading: 본문의 열림을 유지하여 부활 후 나타나심, 성령을 통한 오심, 또는 장차의 오심 가운데 하나로 한정하지 않았습니다.
  alternative_readings:
  - 부활 후 나타나심을 가리킴
  - 성령을 통해 오심을 가리킴
  - 장차의 재림을 가리킴
  rationale: 직전 문맥과 요한복음 전체 흐름은 여러 가능성을 허용하므로, 본문이 허용하는 신학적 긴장을 한국어 본문에서도 유지하는 것이 적절합니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장을 해소하지 말고 보존한다.'
