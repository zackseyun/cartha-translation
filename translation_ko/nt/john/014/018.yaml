  source_fidelity: 첫 절의 ‘여러분을 고아로 남겨 두지 않겠습니다’는 οὐκ ἀφήσω ὑμᾶς ὀρφανούς의 미래 부정과 ‘고아로’라는 구체적 이미지를 충실히 보존합니다. 그러나 ἔρχομαι πρὸς ὑμᾶς는 화자 쪽에서 제자들에게 ‘오는’ 움직임이므로, ‘갑니다’가 아니라 ‘옵니다’로 옮겨야 합니다.
