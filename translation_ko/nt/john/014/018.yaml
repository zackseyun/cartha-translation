  terminology: ‘고아’는 ὀρφανούς의 부모 보호를 잃은 구체적 이미지를 유지합니다. ‘옵니다’는 ἔρχομαι의 현재형이 지닌 생동감과 가까운 미래적 뉘앙스를 보존하며, 어느 신학적 참조 대상으로도 한정하지 않습니다.
