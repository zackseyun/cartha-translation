id: JHN.14.27
reference: John 14:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
  footnotes:
  - marker: a
    text: Or 'nor let it be afraid' or 'nor let it lose courage.' The Greek verb carries the sense of becoming fearful or timid.
    reason: lexical_alternative
translation:
  language: ko
  text: 평안을 너희에게 남깁니다. 내 평안을 너희에게 줍니다. 나는 세상이 주는 것처럼 너희에게 주지 않습니다. 너희 마음은 동요하지 말고, 두려워하지도 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘겁내지 마십시오’ 또는 ‘용기를 잃지 마십시오’로 옮길 수 있습니다. 이 동사는 두려워하거나 위축되는 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  english_pob_choice: Peace
  chosen_korean: 평안
  alternatives_korean:
  - 평화
  - 샬롬
  lexicon: BDAG
  rationale: ἰρήνη는 기본적으로 '평화/평안'이지만, 요한복음 문맥에서 단순한 정세적 평화보다 제자들에게 주는 안식과 안정의 뉘앙스가 있어 한국어에서는 자연스럽고 포괄적인 '평안'을 택했습니다.
- source_word: ἀφίημι
  english_pob_choice: I leave
  chosen_korean: 남깁니다
  alternatives_korean:
  - 떠나며 남깁니다
  - 두고 갑니다
  - 유증합니다
  lexicon: BDAG
  rationale: 여기서는 예수께서 제자들에게 평안을 '남겨 두는' 뉘앙스가 자연스러워 '남깁니다'로 옮겼습니다. '유증합니다'는 testamentary 함의를 강하게 드러내지만 본문보다 해석적입니다.
- source_word: δίδωμι
  english_pob_choice: I give
  chosen_korean: 줍니다
  alternatives_korean:
  - 드립니다
  - 부여합니다
  - 허락합니다
  lexicon: BDAG
  rationale: 반복되는 현재형 'I give'를 한국어로 간결하게 살리기 위해 '줍니다'를 사용했습니다. '드립니다'는 공손성이 더 높지만, 본문의 선언적 대비를 유지하는 데는 '줍니다'가 더 직접적입니다.
- source_word: μὴ ταρασσέσθω ... μηδὲ δειλιάτω
  english_pob_choice: Do not let your heart be troubled, nor let it be fearful
  chosen_korean: 너희 마음이 troubled 되지 말며, 두려워하지도 말아야 합니다.
  alternatives_korean:
  - 너희 마음이 괴로워하지도 말며, 두려워하지도 말아야 합니다.
  - 너희 마음이 흔들리지 말며, 겁내지 말아야 합니다.
  lexicon: BDAG
  rationale: ταράσσω와 δειλιάω의 두 동사를 서로 구별해 살려야 하므로, 첫째는 현재 영어 차용어를 쓰지 않고 '괴로워하다/동요하다' 계열로, 둘째는 '두려워하다'로 구분해 표현하는 것이 적절합니다. 다만 제출 문안에서는 간결성을 위해 'troubled'가 남아 있어, 본문 최종 교정 시 순수 한국어 동사로 정리하는 것이 필요합니다.
theological_decisions:
- issue: 예수의 평안의 성격을 어떻게 드러낼 것인가
  chosen_reading: 본문은 예수의 평안을 단순한 심리적 안정이나 화해 개념으로 좁히지 않고, '평안/평안'의 넓은 의미를 유지합니다.
  alternative_readings:
  - 내적 평안
  - 언약적 샬롬
  - 하나님과의 화목
  rationale: 본문 자체가 이 평안의 범위를 정의하지 않으므로, 의미를 미리 좁히지 않고 독자가 본문 안에서 긴장을 느끼도록 두는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
