id: JHN.14.3
reference: John 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
  footnotes:
  - marker: a
    text: Or, 'I will come again.' The Greek uses a present-form verb ('I am coming') with future sense.
    reason: lexical_alternative
  - marker: b
    text: Interpretations differ on whether 'I am coming again' refers specifically to Jesus' final return, his resurrection appearances, the coming of the Spirit, or a layered promise encompassing more than one of these.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 가서 너희를 위하여 곳을 마련하면, 다시 와서 너희를 내게로 데려갈 것입니다.[a] 이는 내가 있는 곳에 너희도 있게 하려는 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다시 와서’에 해당하는 그리스어 동사는 현재형이지만, 여기서는 미래의 약속을 나타내는 용법으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 예수께서 ‘다시 오심’이 구체적으로 무엇을 가리키는지에 대해서는 해석이 다릅니다. 부활 후의 나타나심, 성령의 오심, 마지막 재림, 또는 이들을 아우르는 약속으로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  english_pob_choice: if I go
  chosen_korean: 내가 가서
  alternatives_korean:
  - 내가 떠나서
  lexicon: BDAG
  rationale: aorist subjunctive와 ἐάν이 만드는 미래 조건을 살려 직역에 가까운 ‘가서’로 옮겼습니다. ‘떠나서’는 의미상 가능하지만, πορεύομαι의 기본 뜻보다 해석이 더 들어갑니다.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  english_pob_choice: prepare a place for you
  chosen_korean: 너희를 위해 한 곳을 마련하면
  alternatives_korean:
  - 너희를 위해 한 곳을 준비하면
  - 너희를 위해 자리를 마련하면
  lexicon: BDAG
  rationale: ἑτοιμάζω의 ‘준비하다/마련하다’와 τόπος의 ‘장소/곳’을 자연스러운 현대 한국어로 풀어 ‘한 곳을 마련하다’로 옮겼습니다. ‘장소’는 다소 딱딱하고, ‘자리’는 의미가 좁아질 수 있습니다.
- source_word: πάλιν ἔρχομαι
  english_pob_choice: I am coming again
  chosen_korean: 나는 다시 와서
  alternatives_korean:
  - 나는 다시 올 것입니다
  - 나는 다시 오고 있습니다
  lexicon: BDAG
  rationale: 현재형 ἔρχομαι의 미래적 용법을 살려 ‘다시 와서’로 옮겼습니다. 이렇게 하면 영어 POB의 ‘I am coming again’이 지닌 현재형의 생동감을 반영하면서도 한국어 문맥상 미래 약속으로 이해되게 됩니다.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  english_pob_choice: will take you to myself
  chosen_korean: 너희를 내게로 데려갈 것입니다
  alternatives_korean:
  - 너희를 내 곁으로 받아들일 것입니다
  - 너희를 내게로 취하실 것입니다
  lexicon: BDAG
  rationale: παραλαμβάνω의 핵심은 ‘데리고 가다/함께 받아들이다’이므로, 현대 독자가 바로 이해할 수 있는 ‘데려갈 것입니다’로 옮겼습니다. πρὸς ἐμαυτόν의 관계적 방향성은 ‘내게로’에 담았습니다.
- source_word: ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε
  english_pob_choice: so that where I am, you also may be
  chosen_korean: 그래서 내가 있는 곳에 너희도 있게 하려는 것입니다
  alternatives_korean:
  - 그래서 내가 있는 곳에 너희도 있을 수 있게 하려는 것입니다
  - 그래서 내가 있는 곳에 너희도 있게 되게 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα의 목적 의미를 ‘-려는 것입니다’로 살렸고, ὅπου εἰμὶ ἐγώ는 자연스럽게 ‘내가 있는 곳’으로 옮겼습니다. ἦτε의 목적절 뉘앙스는 ‘있게 하려는 것입니다’로 반영했습니다.
theological_decisions:
- issue: πάλιν ἔρχομαι의 ‘다시 옴’의 범위
  chosen_reading: 본문의 약속을 열린 상태로 유지하며, 재림·부활 후 나타나심·성령의 오심 중 어느 하나로 단정하지 않았습니다.
  alternative_readings:
  - 부활 후 나타나심에 대한 언급
  - 성령 강림에 대한 언급
  - 마지막 재림(파루시아)에 대한 언급
  rationale: 문맥은 예수의 다시 오심을 약속하지만, 본문 자체는 그 방식과 시점을 하나로 확정하지 않습니다. 따라서 번역은 해석적 단정을 피하고 본문의 긴장을 보존해야 합니다.
  doctrine_reference: 해석적 긴장 보존
