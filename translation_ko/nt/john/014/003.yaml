revisions:
- from: 내가 가서 너희를 위해 한 곳을 마련하면, 나는 다시 와서 너희를 내게로 데려갈 것입니다. 그래서 내가 있는 곳에 너희도 있게 하려는 것입니다.[a][b]
  to: 내가 가서 너희를 위하여 곳을 마련하면, 다시 와서 너희를 내게로 데려갈 것입니다.[a] 이는 내가 있는 곳에 너희도 있게 하려는 것입니다.[b]
