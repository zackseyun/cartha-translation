source:
  edition: SBLGNT
  text: ἐάν τι αἰτήσητέ ⸀με ἐν τῷ ὀνόματί μου ⸀ἐγὼ ποιήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
  footnotes:
  - marker: a
    text: Some manuscripts read, 'If you ask anything in my name, I will do it,' omitting 'me.'
    reason: textual_variant
translation:
  language: ko
  text: 만일 여러분이 내게 무엇이든지 내 이름으로 구하시면, 내가 그것을 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 '내 이름으로 무엇이든지 구하면, 내가 그것을 하겠다'로 읽으며, '내게'를 생략합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν ... αἰτήσητέ
  english_pob_choice: If you ask
  chosen_korean: 만일 여러분이 ... 구하면
  alternatives_korean:
  - 여러분이 ... 요청하면
  - 여러분이 ... 구하시면
  lexicon: BDAG
  rationale: 조건절의 요청 행위를 자연스러운 현대 한국어로 옮기되, 기도적 뉘앙스를 살려 '구하다'를 택했습니다.
- source_word: τι
  english_pob_choice: anything
  chosen_korean: 무엇이든지
  alternatives_korean:
  - 아무것이나
  - 어떤 것이든지
  lexicon: BDAG
  rationale: 불특정 대상을 포괄하는 의미를 가장 자연스럽게 담는 한국어 표현입니다.
- source_word: με
  english_pob_choice: me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 나를
  lexicon: BDAG
  rationale: 본문에 있는 직접목적어를 반영하여, 예수께 직접 드리는 요청임을 분명히 했습니다.
- source_word: ἐν τῷ ὀνόματί μου
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름 안에서
  - 내 이름에 근거하여
  lexicon: BDAG
  rationale: 요한복음의 관용구를 직역에 가깝게 살리면서도 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: ποιήσω
  english_pob_choice: I will do it
  chosen_korean: 내가 그것을 행하겠습니다
  alternatives_korean:
  - 내가 그것을 하겠습니다
  - 내가 이루겠습니다
  lexicon: BDAG
  rationale: 미래형 약속을 분명히 드러내되, 헬라어의 일반적 행위 동사를 무리 없이 옮겼습니다.
theological_decisions:
- issue: 수신 대상이 예수께 직접 향하는지 여부
  chosen_reading: '''내게 구하면''을 본문에 반영하여, 요청이 예수께 직접 드려지는 것으로 읽히게 했습니다.'
  alternative_readings:
  - '''내 이름으로 무엇이든지 구하면'''
  rationale: SBLGNT 본문에는 με가 포함되어 있으므로, 이를 생략하지 않고 번역해 직접 호소의 대상을 보존했습니다. 이는 본문이 지닌 그리스도론적 긴장을 가리지 않기 위한 선택입니다.
  doctrine_reference: 원어 우선 원칙, 본문 변이 보존 원칙
