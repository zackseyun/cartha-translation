review_pass:
  verdict: revise
  source_fidelity: SBLGNT의 με를 본문에서 '내게'로 명시하여 직접 요청의 대상을 보존한 점과, ἐν τῷ ὀνόματί μου를 '내 이름으로'로 옮긴 점은 충실합니다. 다만 각주가 본문에서 사용한 번역어와 달리 '나를'의 생략이라고 하여 변이의 대상을 일관되게 표시하지 못합니다.
  naturalness: '''여러분이 ... 구하시면, 내가 그것을 하겠습니다''가 현대 표준 한국어의 합쇼체에 더 일관되고 자연스럽습니다. ''그것을 하겠습니다''는 ποιήσω의 넓은 의미를 불필요하게 좁히지 않습니다.'
  terminology: '''구하다''와 ''내 이름으로''는 기도·요청의 문맥 및 요한복음의 관용 표현에 적절합니다. με는 한국어에서 ''내게''로 자연스럽게 표현할 수 있으나, 각주에서는 바로 그 표현의 생략임을 밝혀야 합니다.'
  issues:
  - severity: low
    issue: 각주가 생략된 표현을 '나를'이라고 표기합니다.
    rationale: 본문은 με를 '내게'로 번역했으므로, 변이 각주는 일부 사본이 '내게'를 생략한다고 해야 본문 및 원문과의 대응이 명료합니다.
  - severity: low
    issue: 본문의 조건절 높임이 서술절과 완전히 일치하지 않습니다.
    rationale: '''구하면''도 문법적으로 가능하지만, 합쇼체 목표 및 ''행하겠습니다''와의 문체 일관성을 위해 ''구하시면''이 더 적절합니다.'
  revised_text: 만일 여러분이 내게 무엇이든지 내 이름으로 구하시면, 내가 그것을 하겠습니다.[a]
