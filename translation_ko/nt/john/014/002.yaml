review_pass:
  verdict: revise
  source_fidelity: ‘아버지의 집’은 한국어에서 화자의 소유를 어느 정도 함축할 수 있으나, τοῦ πατρός μου의 ‘나의’를 본문에서 직접 드러내는 편이 더 충실합니다. 또한 τόπον은 단순히 ‘한 곳’이라기보다 문맥상 ‘처소/머무를 곳’으로 옮기는 것이 자연스럽고, ὑμῖν의 복수 수혜 의미도 보존되어야 합니다. δεύτε 절은 반문으로 번역할 수 있으며, 원문에 고유한 문장부호가 없고 ὅτι의 연결이 논의되므로 대안 독법은 각주로 유지하는 것이 적절합니다.
  naturalness: ‘내가 너희에게 내가 … 간다고 말했겠습니까’는 인용절이 연속되어 다소 무겁습니다. ‘내가 … 간다’고 인용 부호와 조사 ‘고’를 사용하면 현대 표준 한국어 합쇼체에서 더 명료하고 자연스럽습니다. ‘마련하러’는 여기서 ἑτοιμάσαι를 자연스럽게 전달합니다.
  terminology: μονή는 ‘거할 곳’으로 유지하여 ‘방’보다 넓은 의미를 보존합니다. τόπος는 앞의 μονή와 동일시하지 않고 ‘처소’로 옮겨, 넓은 ‘장소’의 뜻을 유지하면서도 문맥에 맞게 표현합니다. ‘내 아버지의 집’은 요한복음의 표현과 존칭적 문체에 적합합니다.
  issues:
  - severity: medium
    issue: 본문에서 μου(‘나의’)가 직접 드러나지 않습니다.
    rationale: ‘아버지의 집’도 문맥상 이해될 수 있지만, 그리스어의 소유 관계를 명시하는 ‘내 아버지의 집’이 더 정확합니다.
  - severity: low
    issue: ‘한 곳’과 중첩된 간접인용 표현이 다소 부자연스럽습니다.
    rationale: ‘너희를 위하여 처소를 마련하러 간다’고 하면 τόπος의 문맥상 의미와 한국어 문장 흐름을 더 잘 살립니다.
  - severity: medium
    issue: 각주 b의 진술형 대안이 ὅτι를 포함한 다른 연결 가능성을 충분히 반영하지 못합니다.
    rationale: 대안은 ‘내가 너희에게 말했을 것입니다’와 ‘내가 … 마련하러 가기 때문입니다’라는 연결을 제시하여, 반문 독법과 구별되는 문장 분할을 명확히 해야 합니다.
