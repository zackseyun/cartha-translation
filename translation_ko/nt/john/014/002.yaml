source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
  footnotes:
  - marker: a
    text: Or, 'many rooms.' The Greek word can mean places to stay or dwell; 'dwelling places' is broader and preserves the connection to the theme of abiding in this chapter.
    reason: lexical_alternative
  - marker: b
    text: Or, 'If it were not so, I would have told you, because I am going to prepare a place for you.' The Greek clause can also be taken as a statement rather than a rhetorical question.
    reason: alternative_reading
translation:
  language: ko
  text: 내 아버지의 집에는 거할 곳이 많습니다[a]. 그렇지 않다면, 내가 너희에게 ‘내가 너희를 위하여 처소를 마련하러 간다’고 말했겠습니까[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 방들’. 그리스어 μοναί는 머무르거나 거하는 곳을 뜻할 수 있습니다. ‘거할 곳’은 ‘방’보다 넓은 의미를 지니며, 이 장의 ‘거함’이라는 주제와의 연결도 살립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그렇지 않았다면, 내가 너희에게 말했을 것입니다. 내가 너희를 위하여 처소를 마련하러 가기 때문입니다.’ 그리스어 원문에는 본래 문장 부호가 없었으므로, 이 절을 반문이 아니라 진술문으로 읽고 ὅτι를 ‘왜냐하면’의 뜻으로 연결하는 해석도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ τοῦ πατρός μου
  english_pob_choice: my Father's house
  chosen_korean: 아버지의 집
  alternatives_korean:
  - 내 아버지의 집
  - 아버지 집
  lexicon: BDAG
  rationale: οἰκία는 여기서 구체적인 ‘집’을 가리키므로, ‘아버지의 집’이 원문 이미지와 요한복음의 익숙한 표현을 가장 자연스럽게 살립니다.
- source_word: μοναὶ πολλαί
  english_pob_choice: many dwelling places
  chosen_korean: 거할 곳이 많습니다
  alternatives_korean:
  - 많은 거처가 있습니다
  - 많은 방이 있습니다
  - 많은 머무를 곳이 있습니다
  lexicon: BDAG
  rationale: μονή는 단순한 ‘방’보다 ‘머무는/거하는 곳’의 뜻이 넓으므로, ‘거할 곳’이 원문의 범위를 살리면서도 14장 전체의 ‘거함’ 주제와 연결됩니다.
- source_word: πορεύομαι ἑτοιμάσαι τόπον ὑμῖν
  english_pob_choice: I am going to prepare a place for you
  chosen_korean: 내가 너희를 위하여 한 곳을 준비하러 간다고
  alternatives_korean:
  - 내가 너희를 위해 한 곳을 마련하러 간다고
  - 내가 너희를 위하여 장소를 준비하러 간다고
  lexicon: BDAG
  rationale: πορεύομαι는 현재형이지만 문맥상 임박한 진행을 나타내므로 ‘가다’보다 ‘준비하러 가다’로 자연스럽게 옮겼고, τόπος는 넓은 의미의 ‘한 곳’으로 유지했습니다.
- source_word: εἰ δὲ μή ... εἶπον ἂν ὑμῖν
  english_pob_choice: If it were not so, would I have told you
  chosen_korean: 그렇지 않다면, 내가 너희에게 … 말했겠습니까
  alternatives_korean:
  - 그렇지 않았다면 내가 너희에게 … 말했겠습니까
  - 그렇지 않다면 내가 너희에게 … 말했겠습니까
  lexicon: BDAG
  rationale: 원문의 조건문과 ἄν이 만드는 반문 뉘앙스를 살려, 한국어도 질문형으로 유지했습니다. 다만 원문 문장 구조상 뒤의 ὅτι-절을 함께 읽는 대안이 가능하므로, 번역은 그 긴장을 그대로 남겼습니다.
theological_decisions:
- issue: μοναί의 공간 이미지와 종말론적 기대
  chosen_reading: ‘거할 곳’으로 넓게 번역해, 단순한 건물 내부의 ‘방’으로 좁히지 않았습니다.
  alternative_readings:
  - 방
  - 맹수처럼? no
  - 거처
  rationale: 원문은 공동주택의 칸막이보다 ‘머무는 장소’라는 의미가 더 강하므로, 독자가 천국을 물리적 객실로만 상상하지 않도록 범위를 넓게 유지하는 것이 본문에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: εἰ δὲ μή ... εἶπον ἂν ὑμῖν의 문장 기능
  chosen_reading: 반문으로 처리했습니다.
  alternative_readings:
  - '진술형: ‘그렇지 않았다면, 내가 너희에게 말했을 것입니다.’'
  - ‘왜냐하면 내가 너희를 위하여 한 곳을 준비하러 가기 때문입니다’로 연결
  rationale: 쉼표와 ὅτι의 결합 방식이 본문 전승상 분명히 한 가지로 고정되지 않으므로, 질문형 번역이 자연스럽지만 다른 읽기 가능성도 주석으로 남겨 두었습니다.
  doctrine_reference: Translation philosophy §3
