  rationale: 합쇼체를 일관되게 적용하고, 본문은 영어 POB의 선택 및 문맥상 가장 자연스러운 두 명령법의 평행으로 옮겼습니다. πιστεύετε의 실제 형태상 중의성과 ‘신뢰하다’라는 어휘적 가능성은 각각 해당 동사에 붙인 각주에서 보존했습니다. ‘흔들리지 않게 하십시오’는 원문의 τρί인칭 현재 수동 명령이 나타내는 내적 동요의 금지를 자연스러운 한국어로 전달합니다.
