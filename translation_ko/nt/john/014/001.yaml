id: JHN.14.1
reference: John 14:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
  footnotes:
  - marker: a
    text: Or, 'You believe in God; believe also in me.' The Greek form πιστεύετε can be either indicative ('you believe') or imperative ('believe').
    reason: alternative_reading
  - marker: b
    text: Or, 'Trust in God; trust also in me.' The verb can carry the sense of trust as well as belief.
    reason: lexical_alternative
translation:
  language: ko
  text: 「여러분의 마음이 흔들리지 않게 하십시오. 하나님을 믿으십시오[a]. 또 나를 믿으십시오[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 πιστεύετε는 형태상 직설법(‘여러분은 믿습니다’)과 명령법(‘믿으십시오’)으로 모두 읽힐 수 있습니다. 따라서 ‘여러분은 하나님을 믿으니, 또 나를 믿으십시오’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: πιστεύω는 ‘믿다’뿐 아니라 ‘신뢰하다’라는 뜻도 가질 수 있습니다. 따라서 ‘하나님을 신뢰하십시오. 또 나를 신뢰하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία
  english_pob_choice: Do not let your heart be troubled
  chosen_korean: 너희 마음이 불안해하지 말아라
  alternatives_korean:
  - 너희 마음이 괴로워하지 말아라
  - 너희 마음이 동요하지 말아라
  - 너희 마음이 troubled되지 말아라
  lexicon: BDAG
  rationale: ταράσσω의 핵심은 내적 동요와 불안정이어서, 한국어에서는 ‘불안해하다’가 자연스럽고 본문의 금지 명령을 잘 드러냅니다. 단수 ‘마음’은 헬라어의 집합적 단수 ἡ καρδία를 살린 것입니다.
- source_word: πιστεύετε εἰς τὸν θεόν
  english_pob_choice: Believe in God
  chosen_korean: 하나님을 믿으니
  alternatives_korean:
  - 하나님을 믿으라
  - 하나님을 신뢰하라
  - 하나님 안에서 믿으라
  lexicon: BDAG
  rationale: πιστεύω + εἰς는 방향성을 가진 ‘믿다/신뢰하다’의 의미이지만, 본문은 영어 POB의 주석처럼 직설법/명령법의 중의성이 있으므로 한국어에서는 문맥상 가능한 진술형으로도 읽히는 형태를 택해 긴장을 보존했습니다.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  english_pob_choice: believe also in me
  chosen_korean: 또 나를 믿으라
  alternatives_korean:
  - 그리고 나를 믿으라
  - 또한 나를 믿으니
  - 나를 또한 믿으라
  lexicon: BDAG
  rationale: καί의 덧붙임을 ‘또’로 옮겨 하나님에 대한 믿음과 예수에 대한 믿음의 평행을 살렸습니다. 반복되는 πιστεύετε는 한국어에서도 같은 동사 ‘믿다’로 유지하되, 명령형으로 옮겨 문장 구조를 자연스럽게 했습니다.
theological_decisions:
- issue: πιστεύετε의 직설법/명령법 중의성
  chosen_reading: 본문은 ‘하나님을 믿으니, 또 나를 믿으라’로 옮겨, 첫 절의 금지 명령 뒤에 이어지는 위로와 권면의 흐름 속에서 직설법과 명령법의 중의를 함께 남겼습니다.
  alternative_readings:
  - 하나님을 믿으십시오. 또 나를 믿으십시오.
  - 하나님을 믿고 계시니, 또 나를 믿으십시오.
  - 하나님을 믿으니, 또 나를 믿으십시오.
  rationale: 헬라어 πιστεύετε는 형태상 직설법과 명령법이 모두 가능하므로, 어느 한쪽으로 단정해 의미 긴장을 지우지 않는 것이 source-grounded 원칙에 맞습니다. 한국어에서는 공손한 합쇼체를 유지하면서도, 문맥상 권면과 진술이 함께 들리도록 조정했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
