  source_fidelity: 초안은 ταρασσέσθω와 πιστεύετε의 기본 의미를 대체로 반영하지만, ‘하나님을 믿으니’는 첫 πιστεύετε를 직설법으로 확정하면서 둘째는 명령법으로 처리합니다. 이는 가능한 해석이지만, 영어 POB 본문의 선택(두 명령법) 및 금지 명령과 이어지는 권면의 평행을 본문에서 충분히 보존하지 못합니다.
  naturalness: ‘너희 마음이 불안해하지 말아라’는 마음이 행위 주체인 듯하여 현대 한국어로 다소 부자연스럽고, ‘말아라/믿으라’는 요구된 현대 공손 합쇼체에 맞지 않습니다. ‘여러분의 마음이 흔들리지 않게 하십시오’와 ‘믿으십시오’가 자연스럽고 격식에 맞습니다.
  terminology: ‘하나님’, ‘믿다’, ‘신뢰하다’는 적절합니다. ταράσσω에는 특정 심리 상태인 ‘불안’보다 폭넓은 내적 동요를 나타내는 ‘흔들리다’가 안전합니다.
