id: JHN.14.24
reference: John 14:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
  footnotes:
  - marker: a
    text: Or 'the message that you hear is not mine, but is from the Father who sent me.'
    reason: lexical_alternative
  - marker: b
    text: Or "but the Father's who sent me".
    reason: previous_rendering
translation:
  language: ko
  text: 나를 사랑하지 않는 사람은 내 말을 지키지 않습니다. 그리고 여러분이 듣는 그 말씀은 내 말이 아니라, 나를 보내신 아버지의 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여러분이 듣는 그 말씀은 내 말이 아니라, 나를 보내신 아버지에게서 나온 것입니다.”
    reason: lexical_alternative
  - marker: b
    text: ‘나를 보내신 아버지의 것입니다’는 이전 번역의 ‘아버지께 속한 것입니다’에 해당하는 표현입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  english_pob_choice: The one who does not love
  chosen_korean: 나를 사랑하지 않는 사람은
  alternatives_korean:
  - 누구든지 나를 사랑하지 않는 자는
  - 나를 사랑하지 않는 이는
  lexicon: BDAG
  rationale: 관형사적 현재분사를 서술적으로 풀어, 예수님을 사랑하지 않는 사람을 일반적으로 가리키는 뜻을 자연스러운 합쇼체로 살렸습니다.
- source_word: τοὺς λόγους μου
  english_pob_choice: my words
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 말들
  lexicon: BDAG
  rationale: 복수형 λόγους는 ‘말들’보다 한국어에서 자연스러운 집합적 표현인 ‘말’로 옮기되, 예수의 가르침 전체를 가리키는 복수 감각을 유지했습니다.
- source_word: τηρεῖ
  english_pob_choice: keep
  chosen_korean: 지키지 않습니다
  alternatives_korean:
  - 지키지 않습니다
  - 지켜 행하지 않습니다
  - 준수하지 않습니다
  lexicon: BDAG
  rationale: 요한문맥의 τηρέω는 단순한 순종보다 ‘지키다/간직하다’의 뉘앙스를 함께 가지므로, 관계적·실천적 함의를 살리는 ‘지키다’를 택했습니다.
- source_word: ὁ λόγος ὃν ἀκούετε
  english_pob_choice: the word that you hear
  chosen_korean: 여러분이 듣는 그 말씀은
  alternatives_korean:
  - 여러분이 듣는 그 말씀은
  - 여러분이 듣는 그 말은
  - 여러분이 듣고 있는 그 말씀은
  lexicon: BDAG
  rationale: 단수 λόγος를 ‘말씀’으로 옮겨 요한복음의 어휘 울림을 살렸고, 현재형 ἀκούετε는 ‘듣는’으로 자연스럽게 반영했습니다.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  english_pob_choice: but belongs to the Father who sent me
  chosen_korean: 나를 보내신 아버지의 것입니다
  alternatives_korean:
  - 나를 보내신 아버지에게 속한 것입니다
  - 나를 보내신 아버지의 말씀입니다
  lexicon: BDAG
  rationale: 속격 구조는 ‘~의 것입니다’로 옮겨 소유·출처를 함께 드러냈고, ‘보내신’은 aorist participle의 사건성을 자연스럽게 반영했습니다.
theological_decisions:
- issue: 예수의 말과 아버지의 말씀 사이의 관계
  chosen_reading: 예수님은 자신의 말의 독립적 기원을 부정하는 것이 아니라, 들리는 말씀의 근원이 아버지께 있음을 말씀하십니다.
  alternative_readings:
  - 예수님이 자신의 권위를 약화시키는 뜻으로 읽는 해석
  - 말씀이 단순히 아버지로부터 온 외부의 메시지라는 평탄화된 해석
  rationale: 본문의 긴장—아들의 말씀을 듣는 것이 곧 아버지의 뜻을 듣는 것이라는 관계—를 보존해야 하므로, 소유/출처 표현을 통해 구분과 연합을 함께 살렸습니다.
  doctrine_reference: '니케아 신경(381), 칼케돈 정의(451); 번역 원칙: 신학적 긴장을 해소하지 말고 보존할 것'
