  terminology: ‘사랑하다’, ‘지키다’, ‘말씀’, ‘아버지’는 요한복음 문맥과 한국어 성경 문체에 잘 맞습니다. 첫 문장의 ‘내 말’과 둘째 문장의 ‘그 말씀’은 각각 복수 가르침과 단수의 통합된 말씀이라는 원문의 수적 차이를 한국어 관용 안에서 적절히 반영합니다. 교리적 해석을 본문에 덧붙이지 않았습니다.
