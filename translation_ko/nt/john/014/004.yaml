  rationale: 본문은 ‘장소’를 별도의 목적어로 제시하지 않고 ‘길’을 목적어로 제시합니다. 따라서 ‘내가 가는 곳으로 가는 길’로 번역하여 ὅπου ἐγὼ ὑπάγω와 τὴν ὁδόν의 관계를 한국어에서 자연스럽게 드러냈습니다. 각주는 일부 사본의 더 긴 독법, 곧 목적지와 길을 각각 안다는 진술을 분명히 반영하도록 수정했습니다.
