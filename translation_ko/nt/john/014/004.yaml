review_pass:
  verdict: revise
  source_fidelity: 본문의 SBLGNT는 목적어가 ‘그 길’ 하나이며, ὅπου 절은 그 길의 목적지와 관련됩니다. 초안은 ‘내가 가는 곳을’과 ‘그 길을’을 모두 ‘압니다’의 병렬 목적어로 만들어, 본문이 아닌 각주 사본의 독법과 같은 의미를 본문에 도입합니다.
  naturalness: ‘그리고 너희는 내가 가는 곳으로 가는 길을 압니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 목적지-길 관계를 분명히 표현합니다.
  terminology: ὁδός는 이 문맥에서 ‘길’로 옮기는 것이 적절합니다. 불필요한 ‘그’는 한국어에서 생략해도 정관사성 및 문맥상 특정성이 충분히 유지됩니다.
