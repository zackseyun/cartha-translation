translation:
  language: ko
  text: 그리고 내가 가는 곳을 너희는 그 길을 압니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 “그리고 내가 가는 곳과 그 길을 너희는 압니다”로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리고도
  lexicon: BDAG
  rationale: 단순한 연결어이므로 한국어에서도 평이한 접속사 ‘그리고’로 연결감을 살렸습니다.
- source_word: ὅπου
  english_pob_choice: where
  chosen_korean: 가는 곳
  alternatives_korean:
  - 어디로
  - 어디
  lexicon: BDAG
  rationale: ‘where’의 장소적 의미를 한국어에서 자연스럽게 풀어 ‘가는 곳’으로 옮겨, 목적지 관계를 드러냈습니다.
- source_word: ὑπάγω
  english_pob_choice: am going
  chosen_korean: 가는
  alternatives_korean:
  - 가고 있는
  - 떠나가는
  lexicon: BDAG
  rationale: 현재형의 이동 뉘앙스를 살리되, 문맥상 장차 떠나실 예수님의 움직임을 자연스럽게 표현했습니다.
- source_word: τὴν ὁδόν
  english_pob_choice: the way
  chosen_korean: 그 길
  alternatives_korean:
  - 길
  - 그 방법
  lexicon: BDAG
  rationale: ὁδός의 기본 뜻을 ‘길’로 살렸고, 정관사성은 문맥상 지시성을 반영해 ‘그 길’로 옮겼습니다.
theological_decisions:
- issue: ‘where I am going’과 ‘the way’의 관계를 한국어에서 어떻게 드러낼지
  chosen_reading: 내가 가는 곳과 그곳으로 가는 길을 아는 것으로 이해될 수 있게 배치했습니다.
  alternative_readings:
  - 내가 가는 곳으로 가는 길을 너희는 압니다.
  - 내가 가는 곳을 너희는 압니다. 그 길도 압니다.
  rationale: 원문은 ‘너희가 그 길을 안다’는 진술과 예수님의 목적지를 함께 묶습니다. 한국어에서는 ‘가는 곳’과 ‘그 길’을 나란히 두어 원문의 관계를 유지하면서도 과도한 재구성을 피했습니다.
  doctrine_reference: 'translation philosophy: optimal equivalence; 문맥상의 의미 관계를 보존하되 본문이 말하는 범위를 넘지 않음'
