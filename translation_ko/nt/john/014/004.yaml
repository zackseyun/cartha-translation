  edition: SBLGNT
  text: καὶ ὅπου ἐγὼ ὑπάγω οἴδατε ⸂τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/004.yaml
  text: And you know the way where I am going[a].
  footnotes:
  - marker: a
    text: Some manuscripts read, 'And you know where I am going, and you know the way.'
