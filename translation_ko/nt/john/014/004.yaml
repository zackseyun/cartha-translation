    rationale: ‘내가 가는 곳을 너희는 그 길을 압니다’는 두 대격 목적어를 병렬로 처리하여, SBLGNT의 ‘너희는 [내가 가는 곳으로 가는] 길을 안다’는 구문 관계를 변경합니다. 이는 각주에 제시된 변이 독법의 의미를 본문에 반영한 결과입니다.
  - severity: low
    issue: 각주 변이 독법의 한국어 표현은 의미상 적절하나 더 자연스럽게 다듬을 수 있습니다.
    rationale: 변이 독법은 목적지와 길을 각각 안다는 뜻이므로, ‘알고, ... 압니다’로 두 동사를 드러내면 대조가 명확합니다.
