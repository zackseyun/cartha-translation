id: JHN.14.17
reference: John 14:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
  footnotes:
  - marker: a
    text: Or 'which the world cannot receive ... because it neither sees it nor knows it.' Greek uses neuter grammar with 'Spirit' (πνεῦμα), though the referent is personal.
    reason: lexical_alternative
  - marker: b
    text: Or 'will be among you.' The Greek can be read corporately, though 'in you' best preserves the contrast with 'with you.'
    reason: alternative_reading
translation:
  language: ko
  text: 진리의 영입니다[a]. 세상은 그를 받을 수 없습니다. 세상이 그를 보지도 못하고 알지도 못하기 때문입니다. 여러분은 그를 압니다[b]. 그가 여러분과 함께 머물고 여러분 안에 있을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상이 그것을 받을 수 없습니다 … 세상은 그것을 보지도 못하고 알지도 못하기 때문입니다.’ 헬라어에서 ‘영’(πνεῦμα)은 문법상 중성이며, 이를 받는 관계대명사와 대명사도 중성입니다. 그러나 여기서 가리키는 대상은 인격적으로 표현됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분 가운데 있을 것입니다.’ 헬라어는 공동체적으로도 읽을 수 있으나, ‘여러분 안에’가 앞의 ‘여러분과 함께’와의 대조를 가장 잘 살립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  english_pob_choice: the Spirit of truth
  chosen_korean: 진리의 영
  alternatives_korean:
  - 진리의 성령
  - 참된 영
  lexicon: BDAG
  rationale: 헬라어의 속격구조를 살려 ‘진리의 영’으로 옮기고, 문맥상 인격적 하나님의 영을 가리키므로 ‘성령’보다 더 직접적인 기본형 ‘영’을 사용했습니다.
- source_word: ὃ ὁ κόσμος οὐ δύναται λαβεῖν
  english_pob_choice: whom the world is not able to receive
  chosen_korean: 세상이 받을 수 없습니다
  alternatives_korean:
  - 세상이 받아들일 수 없습니다
  - 세상이 영접할 수 없습니다
  lexicon: BDAG
  rationale: οὐ δύναται λαβεῖν의 불능과 λαβεῖν의 핵심 의미를 살려 ‘받을 수 없습니다’로 옮겼습니다. ‘영접하다’는 한국어 교회어로는 자연스럽지만 본문의 직접성을 조금 약화시킵니다.
- source_word: ὃ ὁ κόσμος οὐ δύναται λαβεῖν
  english_pob_choice: whom the world is not able to receive
  chosen_korean: 세상이
  alternatives_korean:
  - 사람들이
  - 세상 사람들은
  lexicon: BDAG
  rationale: κόσμος는 요한복음의 표준 용례를 따라 ‘세상’으로 유지해, 인류 전체나 반역적 세계질서로 좁혀 번역하지 않았습니다.
- source_word: παρ’ ὑμῖν μένει
  english_pob_choice: he remains with you
  chosen_korean: 여러분과 함께 머물고
  alternatives_korean:
  - 여러분과 함께 남아 있고
  - 여러분 곁에 머물고
  lexicon: BDAG
  rationale: μένει의 요한복음적 ‘머묾’의 뉘앙스를 살리면서 자연스러운 현대 한국어로 옮겼습니다. παρά + 여격의 관계도 ‘함께’로 무리 없이 드러납니다.
- source_word: ἐν ὑμῖν ἔσται
  english_pob_choice: will be in you
  chosen_korean: 여러분 안에 있을 것이기 때문입니다
  alternatives_korean:
  - 여러분 가운데 있을 것이기 때문입니다
  - 여러분 안에 계실 것이기 때문입니다
  lexicon: BDAG
  rationale: ἐν ὑμῖν의 위치 감각을 따라 ‘안에’로 번역해, 앞의 ‘with you’와 구별되는 내주적 의미를 보존했습니다. 복수 대명사이므로 ‘여러분 안에’가 자연스럽습니다.
theological_decisions:
- issue: πνεῦμα의 인격적 지시와 한국어 대명사/명사 선택
  chosen_reading: ‘영’으로 옮기되, 뒤에서는 ‘그를’로 받아 인격적 지시를 드러냈습니다.
  alternative_readings:
  - ‘그것을’로 받아 문법적 중성을 반영함
  - ‘성령’을 앞에서부터 명시함
  rationale: 헬라어 πνεῦμα는 문법상 중성이지만 문맥은 인격적 영을 가리킵니다. 한국어에서는 사물화되지 않도록 인칭 대명사로 연결하는 것이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 니케아 신경(381)과 성령의 인격성에 대한 정통 삼위일체 이해
- issue: ‘with you’와 ‘in you’의 관계
  chosen_reading: ‘여러분과 함께’와 ‘여러분 안에’를 구별해 둘 다 보존했습니다.
  alternative_readings:
  - 둘 다 ‘여러분과 함께’로 평평하게 처리함
  - ‘여러분 가운데’로 공동체적 의미로만 처리함
  rationale: παρά와 ἐν의 차이를 지워 버리지 않고, 동행과 내주의 긴장을 그대로 살렸습니다. 요한 본문의 신학적 진행을 해치지 않기 위해서입니다.
  doctrine_reference: '번역 원칙: 신학적 긴장을 해소하지 말고 보존'
