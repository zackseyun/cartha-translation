id: JHN.14.28
reference: John 14:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
  footnotes:
  - marker: a
    text: Or, 'you would rejoice that I am going to the Father.' The Greek form may be rendered more generally, but 'would have rejoiced' best fits the contrary-to-fact condition in context.
    reason: lexical_alternative
  - marker: b
    text: '''The Father is greater than I'' is translated as written without adding an interpretive qualifier such as ''in role'' or ''in status.'''
    reason: alternative_reading
translation:
  language: ko
  text: 여러분은 내가 여러분에게 한 말을 들었습니다. ‘나는 떠나가며, 여러분에게 옵니다.’ 여러분이 나를 사랑했다면, 내가 아버지께로 가므로 기뻐했을 것입니다. 아버지는 나보다 더 크시기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여러분에게 한 말’은 ὅτι가 이끄는 인용 내용을 한국어에서 자연스럽게 받기 위한 표현입니다.
    reason: source_note
  - marker: b
    text: ‘더 크시기 때문입니다’는 ‘아버지는 나보다 더 크시다’를 해설 없이 그대로 옮긴 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν
  english_pob_choice: You heard that I said to you
  chosen_korean: 여러분은 내가 여러분에게 한 말을 들었습니다
  alternatives_korean:
  - 여러분은 내가 여러분에게 말했다는 것을 들었습니다
  - 여러분은 내가 여러분에게 한 말을 들으셨습니다
  lexicon: BDAG
  rationale: ἠκούσατε는 완료된 청취를 가리키며, ὅτι는 바로 뒤 내용을 받는다고 보아 한국어에서는 자연스럽게 ‘한 말’을 받는 구문으로 옮겼습니다.
- source_word: Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς
  english_pob_choice: I am going away, and I am coming to you
  chosen_korean: ‘나는 떠나가며, 여러분에게 옵니다.’
  alternatives_korean:
  - ‘나는 가고 있으며, 여러분에게 옵니다.’
  - ‘나는 떠나며, 여러분에게 갑니다.’
  lexicon: BDAG
  rationale: Ὑπάγω의 ‘떠나가다’와 ἔρχομαι의 ‘오다’를 분리해, 예수님이 제자들을 떠나면서도 그들에게 향해 오신다는 역설을 살렸습니다.
- source_word: ἐχάρητε ἄν
  english_pob_choice: you would have rejoiced
  chosen_korean: 기뻐했을 것입니다
  alternatives_korean:
  - 기뻐했을 텐데
  - 기뻐하셨을 것입니다
  lexicon: BDAG
  rationale: 반사실 조건문의 결과로서 가능한 일어난 기쁨을 한국어의 ‘-했을 것입니다’로 옮겨 영어 POB의 ‘would have rejoiced’와 같은 반사실 뉘앙스를 유지했습니다.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  english_pob_choice: I am going to the Father
  chosen_korean: 내가 아버지께로 가므로
  alternatives_korean:
  - 내가 아버지께로 가기 때문에
  - 내가 아버지께로 가고 있으므로
  lexicon: BDAG
  rationale: πορεύομαι는 단순 이동보다 ‘가다/여행하다’의 흐름이 있어, 이유절로 풀어 ‘아버지께로 가므로’라고 자연스럽게 연결했습니다.
- source_word: πατὴρ μείζων μού ἐστιν
  english_pob_choice: the Father is greater than I
  chosen_korean: 아버지는 나보다 더 크시기 때문입니다
  alternatives_korean:
  - 아버지는 나보다 더 크십니다
  - 아버지는 나보다 크시기 때문입니다
  lexicon: BDAG
  rationale: μείζων은 비교급 ‘더 크다’의 직접 대응으로 두었고, 본문의 비교를 해설 없이 그대로 드러내기 위해 부가적 한정어를 넣지 않았습니다.
theological_decisions:
- issue: ‘아버지는 나보다 더 크시다’의 비교 표현을 어떻게 처리할지
  chosen_reading: 주해적 완화 없이 문자적 비교를 유지했습니다.
  alternative_readings:
  - 아버지는 나보다 역할상 더 크십니다
  - 아버지는 나보다 위상이 더 크십니다
  - 아버지는 성육신하신 상태에서만 나보다 더 크십니다
  rationale: 원문은 비교를 평이하게 진술하므로, 본문 안에서 위계나 상태를 해설하는 글로 바꾸지 않고 긴장을 그대로 남겼습니다.
  doctrine_reference: '니케아 신경, 칼케돈 신조; 번역 원칙 #3 신학적 긴장을 본문 안에서 해소하지 않음'
