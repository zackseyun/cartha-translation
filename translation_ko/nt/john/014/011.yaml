id: JHN.14.11
reference: John 14:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
  footnotes:
  - marker: a
    text: Or, 'believe on account of the works themselves.' The final 'believe' has no explicit object in Greek; the sense is that the works themselves are sufficient grounds for belief.
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 믿으십시오. 내가 아버지 안에 있고 아버지가 내 안에 있기 때문입니다. 그렇지 않으면, 그 일들 자체 때문에 믿으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 두 번째 명령형 πιστεύετε에는 명시적 목적어가 없습니다. 따라서 뜻은 “그 일들 자체를 근거로 믿으십시오”입니다.
    reason: source_note
lexical_decisions:
- source_word: πιστεύετέ μοι
  english_pob_choice: Believe me
  chosen_korean: 나를 믿으십시오
  alternatives_korean:
  - 내 말을 믿으십시오
  - 나를 신뢰하십시오
  lexicon: BDAG
  rationale: 여기서 πιστεύετέ 뒤의 여격 μοι는 대상 인물로 받는 것이 자연스럽기 때문에, 직접적인 호소인 “나를 믿으십시오”로 옮겼습니다. “내 말을”은 해석을 더하고, “신뢰하십시오”는 어조를 지나치게 넓힙니다.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  english_pob_choice: in the Father ... in me
  chosen_korean: 아버지 안에 ... 내 안에
  alternatives_korean:
  - 아버지와 하나이며 ... 나와 하나이며
  - 아버지와의 연합 안에 ... 나와의 연합 안에
  lexicon: BDAG
  rationale: 반복되는 ἐν은 요한복음 특유의 상호 내주를 가리키므로, 해석적 풀어쓰기를 피하고 “안에”를 유지했습니다. 한국어에서도 “아버지 안에 / 내 안에”가 원문의 긴장을 가장 직접적으로 드러냅니다.
- source_word: διὰ τὰ ἔργα αὐτὰ
  english_pob_choice: because of the works themselves
  chosen_korean: 그 일들 자체 때문에
  alternatives_korean:
  - 그 일들로 말미암아
  - 그 일들 때문에
  lexicon: BDAG
  rationale: διά + 대격은 근거/이유를 나타내므로, “때문에”로 옮겼습니다. τὰ ἔργα는 요한복음에서 예수의 표적적 행위를 포함하는 넓은 뜻이 있어, 전통적 신학어를 덧붙이지 않고 “그 일들”로 두었습니다.
- source_word: αὐτὰ
  english_pob_choice: themselves
  chosen_korean: 자체
  alternatives_korean:
  - 스스로
  - 만으로
  lexicon: BDAG
  rationale: αὐτά의 강조는 ‘그 일들 자체’라는 식으로 충분성을 드러내므로, 부사적 “만으로”보다 명사구 안에서 강조하는 “자체”가 원문의 힘을 더 가깝게 살립니다.
theological_decisions:
- issue: 아버지와 아들의 상호 내주 표현
  chosen_reading: “내가 아버지 안에 있고 아버지가 내 안에”라는 원문 구조를 그대로 살렸습니다.
  alternative_readings:
  - “내가 아버지와 하나이고 아버지가 나와 하나입니다”
  - “아버지와 연합되어 있고...”
  rationale: 이 절은 그리스도론적으로 중요한 진술이지만, 본문 자체의 문구를 도그마적 의역으로 바꾸지 않고 그대로 보존해야 합니다. 직역에 가까운 표현이야말로 문장의 신학적 무게를 가장 충실하게 전달합니다.
  doctrine_reference: 니케아 신경의 성자-성부 관계에 대한 고백
- issue: 두 번째 πιστεύετε의 목적어 생략
  chosen_reading: 두 번째 명령형은 목적어를 밝히지 않고 “믿으십시오”만 두고, 근거는 뒤의 “그 일들 자체 때문에”로 제시했습니다.
  alternative_readings:
  - “나를 믿으십시오, 아니면 그 일들 자체 때문에 나를 믿으십시오”
  - “그 일들 때문에 나를 믿으십시오”
  rationale: 그리스어는 두 번째 πιστεύετε에 명시적 목적어가 없으므로, 한국어도 이를 억지로 채우지 않는 편이 원문에 더 가깝습니다. 믿음의 근거를 표적으로 제시하는 구조를 유지했습니다.
  doctrine_reference: 본문의 수사 구조 보존
