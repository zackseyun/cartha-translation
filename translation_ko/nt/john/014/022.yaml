    text: 또는 “우리에게 자신을 알리시려.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “자신을 드러내시려.”
    reason: lexical_alternative
  revision_rationale: The revision removes the added restrictive ‘만,’ renders the Greek perfect question more directly, and relocates the footnote markers to the self-manifestation expression. It preserves the Johannine ambiguity of κόσμος as ‘세상’ and the forward/intention sense of μέλλεις without doctrinal expansion.
