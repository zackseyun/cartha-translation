- from: 가룟인이 아닌 유다가 예수께 말했습니다. 「주님, 무슨 일이 일어나서 저희에게만 자신을 나타내시고 세상에게는 나타내지 않으시려 합니까?」[a][b]
  to: 가룟인이 아닌 유다가 예수께 말했습니다. 「주님, 무슨 일이 있었기에 우리에게는 자신을 나타내시려 하시고 세상에는 나타내시려 하지 않으십니까?」[a][b]
  rationale: The revision removes the added restrictive ‘만,’ renders the Greek perfect question more directly, and relocates the footnote markers to the self-manifestation expression. It preserves the Johannine ambiguity of κόσμος as ‘세상’ and the forward/intention sense of μέλλεις without doctrinal expansion.
  reviewer_model: gpt-5.6-terra
