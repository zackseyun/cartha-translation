id: JHN.14.22
reference: John 14:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
  footnotes:
  - marker: a
    text: Or “make yourself known to us.”
    reason: lexical_alternative
  - marker: b
    text: Or “manifest yourself.”
    reason: lexical_alternative
translation:
  language: ko
  text: 가룟인이 아닌 유다가 예수께 말했습니다. 「주님, 무슨 일이 있었기에 우리에게는 자신을 나타내시려 하시고 세상에는 나타내시려 하지 않으십니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리에게 자신을 알리시려.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “자신을 드러내시려.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  english_pob_choice: Judas (not Iscariot)
  chosen_korean: 가룟인이 아닌 유다
  alternatives_korean:
  - 유다(가룟인이 아님)
  - 유다, 곧 가룟인이 아닌 사람
  lexicon: BDAG
  rationale: Ἰούδας를 표준적으로 유다로 옮기고, οὐχ ὁ Ἰσκαριώτης의 구별 기능을 간결하게 살리기 위해 ‘가룟인이 아닌’을 앞에 두었습니다.
- source_word: λέγει αὐτῷ
  english_pob_choice: said to him
  chosen_korean: 예수께 말했습니다
  alternatives_korean:
  - 그에게 말했습니다
  - 예수님께 말했습니다
  lexicon: BDAG
  rationale: 문맥상 대상은 예수님이므로 한국어에서는 대상을 드러내어 자연스럽게 옮겼습니다. 직접화법 도입부는 현대 서술체에 맞게 ‘말했습니다’로 처리했습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  lexicon: BDAG
  rationale: 예수께 대한 직접 호칭으로서 주님의 존칭과 신학적 무게를 함께 살리기 위해 ‘주님’을 택했습니다.
- source_word: ἐμφανίζειν σεαυτόν
  english_pob_choice: reveal yourself
  chosen_korean: 자신을 나타내시고
  alternatives_korean:
  - 자신을 드러내시고
  - 자신을 보이시고
  - 자신을 알리시고
  lexicon: BDAG
  rationale: ἐμφανίζειν은 ‘드러내다/나타내다/보이다’의 뜻이므로, 요한복음의 표현을 과도하게 해석하지 않으면서도 자연스러운 한국어인 ‘나타내시다’로 옮겼습니다.
- source_word: κόσμῳ
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세상 사람들
  - 온 세상
  - 세상 전체
  lexicon: BDAG
  rationale: 요한문헌의 κόσμος를 문맥상 ‘세상’으로 옮겨, 하나님과 대비되는 세계라는 신학적 긴장을 너무 빨리 풀지 않도록 했습니다.
theological_decisions:
- issue: 예수의 자기 현현을 ‘나타내시다’로 번역할지 ‘드러내시다/계시하시다’로 번역할지
  chosen_reading: ‘자신을 나타내시다’로 옮겨, 현현과 계시의 뉘앙스를 열어 두었습니다.
  alternative_readings:
  - 자신을 드러내시다
  - 자신을 계시하시다
  - 자신을 보이시다
  rationale: 본문의 ἐμφανίζειν은 단순한 시각적 ‘보임’보다 자신을 알아볼 수 있게 하는 현현의 뜻을 가질 수 있으나, 여기서는 요한적 문맥을 지나치게 해설하지 않고 원문의 긴장을 보존하는 표현이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
