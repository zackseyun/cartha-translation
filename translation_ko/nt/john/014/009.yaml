id: JHN.14.9
reference: John 14:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
  footnotes:
  - marker: a
    text: Or, 'for such a long time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. 「내가 이렇게 오랫동안 여러분과 함께 있어 왔는데도, 빌립아, 당신은 아직도 나를 알지 못합니까? 나를 본 사람은 아버지를 본 것입니다. 그런데 어떻게 당신이 ‘아버지를 우리에게 보여 주십시오’라고 말합니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그토록 긴 시간 동안”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  english_pob_choice: for so long
  chosen_korean: 이렇게 오랜 시간 동안
  alternatives_korean:
  - 오랫동안
  - 그토록 긴 시간 동안
  - 이렇게 오래
  lexicon: BDAG
  rationale: 기간의 길이를 드러내는 표현으로, 예수의 책망 섞인 놀라움을 자연스럽게 살리면서도 원문의 지속 기간을 분명히 전합니다.
- source_word: μεθ’ ὑμῶν εἰμι
  english_pob_choice: have I been with you
  chosen_korean: 너희와 함께 있으면서도
  alternatives_korean:
  - 너희와 함께 있었으면서도
  - 너희와 함께 있어 왔으면서도
  lexicon: BDAG
  rationale: 현재형 ‘εἰμι’가 지속된 동행을 가리키므로, 한국어에서는 진행·지속의 뉘앙스를 살려 책망의 흐름 속에 넣었습니다.
- source_word: οὐκ ἔγνωκάς με
  english_pob_choice: you still have not known me
  chosen_korean: 너는 나를 알지 못하느냐
  alternatives_korean:
  - 너는 아직도 나를 알지 못하느냐
  - 너는 나를 알지 못했느냐
  lexicon: BDAG
  rationale: 완료형의 상태성을 ‘알지 못하느냐’로 간명하게 살리고, 반문을 통해 서술상의 책망을 드러냈습니다.
- source_word: ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα
  english_pob_choice: The one who has seen me has seen the Father
  chosen_korean: 나를 본 사람은 아버지를 본 것이다
  alternatives_korean:
  - 나를 본 이는 아버지를 본 것이다
  - 나를 본 사람은 아버지를 보았습니다
  lexicon: BDAG
  rationale: ‘ὁ … ἑωρακώς’를 실질적인 명사구로 옮겨 보편적 진술을 유지했고, ‘τὸν πατέρα’를 그대로 ‘아버지’로 옮겨 요한의 직접적 신학 진술을 보존했습니다.
- source_word: πῶς σὺ λέγεις
  english_pob_choice: How can you say
  chosen_korean: 어떻게 네가 …라고 말하느냐
  alternatives_korean:
  - 어찌 네가 …라고 말하느냐
  - 어떻게 네가 …라고 할 수 있느냐
  lexicon: BDAG
  rationale: πῶς의 반문적 놀라움을 자연스러운 한국어 의문문으로 처리해, 단순 질문이 아니라 불신·책망의 뉘앙스를 전달했습니다.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  english_pob_choice: Show us the Father
  chosen_korean: ‘아버지를 우리에게 보여 주십시오’
  alternatives_korean:
  - ‘아버지를 우리에게 보여 주십시오’
  - ‘아버지를 보여 주십시오’
  lexicon: BDAG
  rationale: 직전 문맥의 요청을 그대로 반영하되, 한국어 구문에서는 공손한 요청형으로 옮겨 예수의 인용 발화를 자연스럽게 처리했습니다.
theological_decisions:
- issue: ‘아버지를 본 것이다’의 대표성 vs. 단순 유사성
  chosen_reading: 예수와 아버지의 관계를 ‘닮았다’는 식으로 약화하지 않고, 본문이 말하는 직접적 동일-시각적 인식의 강도를 그대로 유지했습니다.
  alternative_readings:
  - ‘아버지의 모습을 본 것이다’처럼 완화된 대표성
  - 삼위일체 용어를 덧붙인 설명적 번역
  rationale: 원문은 단순 비유가 아니라 강한 기독론적 선언이므로, 번역에서 그 긴장을 희석하지 않는 것이 필요합니다.
  doctrine_reference: 요한복음의 기독론; 니케아 신경(381), 칼케돈 신경(451)
