revisions:
- from: 내 계명들을 가지고 그것을 지키는 사람이 곧 나를 사랑하는 사람입니다[a]. 그리고 나를 사랑하는 사람은 내 아버지께 사랑을 받을 것이며[b], 나도 그를 사랑하여 그에게 나 자신을 드러내겠습니다.
  to: 내 계명들을 가지고 지키는 사람이 곧 나를 사랑하는 사람입니다[a]. 그리고 나를 사랑하는 사람은 내 아버지께 사랑을 받을 것이며[b], 나도 그를 사랑하고 그에게 나 자신을 드러내겠습니다[c].
  rationale: Plural-reference agreement has been restored by omitting a redundant object pronoun. The final coordinated future actions have been rendered without implying that Jesus' love is merely the means of revelation. Footnote b has been corrected to describe the actual passive rendering accurately, and a source-based note for “드러내겠습니다” has been supplied at its proper anchor.
