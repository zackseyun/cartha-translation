review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the substantival participles, the identification of the commandment-keeper as the one who loves Jesus, the Father's future love, and Jesus' love and self-disclosure. However, the singular pronoun in “그것을 지키는” does not agree with the plural αὐτά (“them,” referring to commandments).
  naturalness: The overall 합쇼체 register is appropriate. Removing the mismatched repeated object makes the opening smoother. Coordinating Jesus' two future actions with “사랑하고” more directly reflects κἀγώ ... ἀγαπήσω ... καὶ ἐμφανίσω and avoids a potentially instrumental nuance in “사랑하여.”
  terminology: '“계명,” “지키는,” “사랑,” and “나 자신을 드러내겠습니다” are suitable, consistent renderings. The existing passive explanatory footnote is inaccurate: the Korean main text is itself passive, not an active paraphrase, and its proposed wording is not more literal than the text.'
  issues:
  - severity: medium
    issue: Number disagreement in “내 계명들을 가지고 그것을 지키는.”
    rationale: The antecedent “계명들을” and Greek αὐτά are plural, whereas “그것을” is singular. Omitting the redundant Korean object preserves the plural referent and yields natural Korean.
  - severity: medium
    issue: Footnote b incorrectly characterizes the rendering as an active paraphrase.
    rationale: “내 아버지께 사랑을 받을 것입니다” is a passive Korean construction corresponding directly to Greek ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου. The note should instead explain the passive construction, if retained.
  - severity: low
    issue: “사랑하여” can be read as expressing means or consequence.
    rationale: The Greek coordinates two future verbs, “I will love ... and reveal.” “사랑하고 ... 드러내겠습니다” retains this coordination more plainly.
  revised_text: 내 계명들을 가지고 지키는 사람이 곧 나를 사랑하는 사람입니다[a]. 그리고 나를 사랑하는 사람은 내 아버지께 사랑을 받을 것이며[b], 나도 그를 사랑하고 그에게 나 자신을 드러내겠습니다[c].
  revised_footnotes:
