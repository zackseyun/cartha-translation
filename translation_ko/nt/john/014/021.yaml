id: JHN.14.21
reference: John 14:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
  footnotes:
  - marker: a
    text: Or 'The person who has my commandments and keeps them … I will love that person and reveal myself to that person.' The Greek uses masculine singular forms with representative force.
    reason: lexical_alternative
  - marker: b
    text: Or 'will show myself to him.' The Greek verb can mean to make oneself known or visible; here it likely emphasizes personal self-disclosure.
    reason: alternative_reading
  - marker: c
    text: Or 'and I will love him and will reveal myself to him'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 계명들을 가지고 그것을 지키는 사람이 곧 나를 사랑하는 사람입니다[a]. 그리고 나를 사랑하는 사람은 내 아버지께 사랑을 받을 것이며[b], 나도 그를 사랑하여 그에게 나 자신을 드러내겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 남성 단수 형식을 쓰지만, 대표적 의미로 쓰인 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 아버지께서 그를 사랑하실 것이다’입니다. 수동형은 한국어에서 자연스럽게 옮기기 위해 능동적 표현으로 풀었습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  english_pob_choice: The one who has
  chosen_korean: 가지고
  alternatives_korean:
  - 지닌
  - 가진
  lexicon: BDAG
  rationale: 분사구가 명사처럼 쓰인 구조를 살리면서도, 한국어에서는 ‘계명들을 가지고’가 자연스럽고 문맥상 소유·보유의 의미를 잘 드러냅니다.
- source_word: τηρῶν
  english_pob_choice: keeps
  chosen_korean: 지키는
  alternatives_korean:
  - 준수하는
  - 지켜 행하는
  lexicon: BDAG
  rationale: 요한복음에서 τηρέω는 단순 복종보다 말씀을 지키고 간직하는 뉘앙스를 가지므로, ‘지키는’이 가장 무난하고 문맥에 맞습니다.
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  english_pob_choice: loves / will be loved / will love
  chosen_korean: 사랑하는 / 사랑을 받을 / 사랑하여
  alternatives_korean:
  - 사랑하는 / 사랑받을 / 사랑하며
  lexicon: BDAG
  rationale: ἀγαπάω 어군의 반복을 한국어에서도 그대로 살려, 인간의 사랑과 하나님의 사랑이 같은 어휘망 안에서 연결되도록 했습니다.
- source_word: ἐμφανίσω ἐμαυτόν
  english_pob_choice: will reveal myself
  chosen_korean: 나 자신을 드러내겠습니다
  alternatives_korean:
  - 나를 보이겠습니다
  - 나를 나타내겠습니다
  lexicon: BDAG
  rationale: ἐμφανίζω는 단순한 시각적 ‘보여 주다’보다 자신을 드러내어 알리다의 의미가 강하므로, 관계적 자기 계시를 살려 ‘나 자신을 드러내겠습니다’로 옮겼습니다.
- source_word: ὑπὸ τοῦ πατρός μου
  english_pob_choice: by my Father
  chosen_korean: 내 아버지께 사랑을 받을
  alternatives_korean:
  - 내 아버지에게 사랑을 받을
  - 내 아버지로부터 사랑을 받을
  lexicon: BDAG
  rationale: 수동형을 자연스러운 한국어로 풀되, 행위 주체가 아버지이심을 분명히 하기 위해 ‘내 아버지께’로 옮겼습니다.
theological_decisions:
- issue: 계명 준수와 사랑의 관계
  chosen_reading: 계명을 가지고 지키는 사람이 예수를 사랑하는 사람임을 식별적으로 말하고, 그 사랑이 하나님의 사랑을 ‘얻어내는’ 것으로 번역하지 않았습니다.
  alternative_readings:
  - 계명을 지키면 예수를 사랑하는 증거가 된다
  - 순종이 하나님의 사랑을 산다
  rationale: 본문은 사랑과 계명의 긴밀한 연결을 말하지만, 공로적 인과관계를 추가하지는 않습니다. 한국어도 그 긴장을 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 남성 단수 대명사의 대표성
  chosen_reading: ‘그 사람’으로 바꾸지 않고 ‘그를’/‘사람’의 조합으로 대표적 남성 단수를 유지했습니다.
  alternative_readings:
  - 그 사람을
  - 그들을
  rationale: 그리스어의 문법적 남성 단수는 대표적 기능을 가지므로, 이를 평탄화하지 않고 본문 형식을 보존했습니다. 다만 첫 절은 ‘사람’으로 자연스러운 한국어를 확보했습니다.
  doctrine_reference: Gender-accurate over gender-neutral.
