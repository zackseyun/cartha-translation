id: JHN.14.26
reference: John 14:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
  footnotes:
  - marker: a
    text: 'Or ''Helper,'' ''Counselor,'' or ''Comforter'' for ''Advocate'' (Greek: paraklētos).'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아버지께서 내 이름으로 보내실 보혜사, 곧 성령께서, 그분께서 여러분에게 모든 것을 가르치시고 내가 여러분에게 말한 모든 것을 생각나게 하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대언자’, ‘돕는 이’, ‘상담자’, ‘위로자’로 옮길 수 있습니다. 그리스어 παράκλητος의 번역어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  english_pob_choice: Advocate
  chosen_korean: 보혜사
  alternatives_korean:
  - 대언자
  - 돕는 이
  - 위로자
  lexicon: 기독교 전통 용례
  rationale: 요한복음 14–16장에서 παράκλητος는 성령의 고유 명칭으로 굳어져 있어, 본문 기능을 살리면서도 한국어 교회어에서 가장 널리 인식되는 ‘보혜사’를 사용했습니다. 영어 POB의 ‘Advocate’가 지닌 대리·변호의 뉘앙스는 각주로 보완했습니다.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  english_pob_choice: the Holy Spirit
  chosen_korean: 성령
  alternatives_korean:
  - 거룩한 영
  - 성령님
  lexicon: 신약 그리스어 일반 용례
  rationale: πνεῦμα τὸ ἅγιον은 여기서 하나님의 영을 가리키므로 표준적인 ‘성령’으로 옮겼습니다. 본문의 인격적 지시를 유지하기 위해 뒤의 대명사와 동사를 자연스럽게 한국어화했습니다.
- source_word: ἐκεῖνος
  english_pob_choice: he
  chosen_korean: 그분
  alternatives_korean:
  - 그
  - 그이
  lexicon: 문법·담화 기능
  rationale: 그리스어의 남성 지시대명사는 παράκλητος를 다시 가리키는 강조 표현이므로, 비인격적 ‘그것’이 아니라 인격적·강조적 ‘그분’으로 옮겼습니다.
- source_word: ὑπομνήσει
  english_pob_choice: remind
  chosen_korean: 생각나게 하실
  alternatives_korean:
  - 기억나게 하실
  - 상기시키실
  lexicon: BDAG
  rationale: ‘생각나게 하다’는 구어적이지만 합쇼체 문맥에서 자연스럽고, 제자들이 이미 들은 말씀을 떠올리게 하는 causative 의미를 잘 드러냅니다.
- source_word: ἐν τῷ ὀνόματί μου
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름 안에서
  - 내 이름에 의하여
  lexicon: 관용구
  rationale: 관용구를 직역에 가깝게 살리되, 한국어에서 자연스러운 ‘내 이름으로’로 옮겨 파송의 권위와 대리성을 유지했습니다.
theological_decisions:
- issue: 보혜사와 성령의 동일시
  chosen_reading: ‘보혜사, 곧 성령’으로 동격을 분명히 하여 한 분을 가리키는 구조를 드러냈습니다.
  alternative_readings:
  - ‘보혜사인 성령’
  - ‘성령, 곧 보혜사’
  rationale: 원문은 ὁ παράκλητος와 τὸ πνεῦμα τὸ ἅγιον을 동격으로 제시하므로, 한국어에서도 동일 인격을 명시해야 본문의 문법과 신학을 함께 보존할 수 있습니다.
  doctrine_reference: 요한복음 14:16, 26; 니케아 신경의 성령 이해
- issue: 성령에 대한 인격적 지시
  chosen_reading: ‘그분이 … 가르치시고 … 하실 것입니다’처럼 인격적 주어와 동사를 사용했습니다.
  alternative_readings:
  - ‘그것이 … 가르치고 … 할 것입니다’
  rationale: 본문의 ἐκεῖνος는 중성 πνεῦμα보다 παράκλητος를 다시 가리키는 강조적 인칭 지시로 읽히므로, 한국어도 인격적 표현을 택해야 문법과 신학적 의미가 일치합니다.
  doctrine_reference: 요한복음 14:26; 성령의 인격성
- issue: ‘보혜사’의 용어 선택
  chosen_reading: 전통 교회 용어 ‘보혜사’를 유지했습니다.
  alternative_readings:
  - ‘변호자’
  - ‘대언자’
  - ‘돕는 이’
  rationale: 한국어 성경·교회 사용에서 굳어진 전문 용어를 유지하되, 영어 POB의 ‘Advocate’가 가진 법정적·대표적 의미는 각주로 안내하는 것이 가장 투명합니다.
  doctrine_reference: '번역 철학 #1, #5'
