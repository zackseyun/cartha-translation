  lexicon: BDAG
  rationale: ἀγαπάω의 기본 의미를 그대로 살려 ‘사랑하다’로 옮겼고, 예수께 드리는 직접 대화의 공손한 문맥에 맞춰 종결은 합쇼체로 처리했습니다.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  english_pob_choice: my commandments
  chosen_korean: 나의 명령들을
  alternatives_korean:
  - 나의 계명들을
  - 나의 명령들
  lexicon: BDAG
  rationale: ἐντολή는 문맥상 ‘명령/계명’이 가능하지만, 문맥에 따라 좁은 종교용어보다 원문의 직접적인 명령성을 드러내는 ‘명령들’이 더 투명합니다.
- source_word: τηρήσετε
  english_pob_choice: you will keep
  chosen_korean: 지키실 것입니다
  alternatives_korean:
  - 지킬 것입니다
  - 지키게 될 것입니다
  - 순종하실 것입니다
  lexicon: BDAG
  rationale: τηρέω의 ‘지키다, 보존하다, 준수하다’라는 넓은 의미를 살려 ‘지키다’로 옮겼고, 미래형을 보존해 문법적 긴장을 유지했습니다.
theological_decisions:
- issue: τηρήσετε를 명령형으로 풀지, 미래 직설법으로 살릴지
  chosen_reading: 미래 진술로 유지하여 ‘지키실 것입니다’로 옮김
  alternative_readings:
  - 명령형 뉘앙스의 ‘지키십시오’
  - 규범적 표현의 ‘지켜야 합니다’
  rationale: 원문은 미래 직설법이므로, 사랑이 예수의 명령을 지키는 결과로 나타난다는 진술 구조를 유지했습니다. 이를 명령으로 바꾸면 원문의 문법적 긴장과 진술성을 약화시킵니다.
  doctrine_reference: 원문 문법 우선, 신학적 긴장 보존
- issue: ‘my commandments’의 한국어 선택
  chosen_reading: ‘나의 명령들’
  alternative_readings:
  - ‘나의 계명들’
  - ‘내 계명들’
  rationale: 요한복음 전통에서 ‘계명’은 가능하지만, 본문은 예수의 명령을 직접 가리키므로 더 중립적이고 원문에 가까운 ‘명령들’을 택했습니다.
  doctrine_reference: 어휘의 직접성 유지
