lexical_decisions:
- source_word: Ἐὰν
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - if
  - 만약
  lexicon: BDAG
  rationale: 조건절을 분명하게 드러내는 가장 자연스러운 현대 한국어 연결어로 옮겼습니다.
- source_word: ἀγαπᾶτέ
  english_pob_choice: you love
  chosen_korean: 나를 사랑하시면
  alternatives_korean:
  - 나를 사랑하시면
