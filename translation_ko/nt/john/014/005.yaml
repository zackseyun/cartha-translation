id: JHN.14.5
reference: John 14:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
  footnotes:
  - marker: a
    text: Or “How are we able to know the way?”
    reason: lexical_alternative
  - marker: b
    text: The Greek verb for “know” is used twice in this verse, once in “we do not know” and again in “know the way.”
    reason: cross_reference
translation:
  language: ko
  text: 도마가 그에게 말했습니다. 「주님, 우리는 당신이 어디로 가시는지 모릅니다. 어떻게 그 길을 알 수 있겠습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리는 어떻게 그 길을 알 수 있겠습니까?”
    reason: lexical_alternative
  - marker: b
    text: 이 절에서는 ‘알다’에 해당하는 그리스어 동사가 두 번 쓰여, ‘모릅니다’와 ‘그 길을 알 수 있겠습니까’ 사이의 반복을 이룹니다.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  english_pob_choice: Thomas said to him
  chosen_korean: 도마가 그에게 말했습니다
  alternatives_korean:
  - 도마가 그에게 말합니다
  lexicon: SBLGNT
  rationale: 역사적 현재 λέγει는 한국어 내러티브에서는 자연스러운 과거형으로 옮기고, Θωμᾶς는 통용되는 이름형 도마로 옮겼습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인님
  - 선생님
  lexicon: BDAG
  rationale: κύριε는 여기서 단순 호칭보다 제자적 경의를 담으므로, 프로젝트 기본값에 맞게 주님으로 옮겼습니다.
- source_word: οὐκ οἴδαμεν ... εἰδέναι
  english_pob_choice: we do not know ... know
  chosen_korean: 모릅니다 ... 알 수 있겠습니까
  alternatives_korean:
  - 알지 못합니다 ... 알 수 있겠습니까
  - 모르겠습니다 ... 알 수 있겠습니까
  lexicon: BDAG
  rationale: οἶδα 계열의 반복을 한국어에서도 ‘모르다/알다’의 대응으로 살려, 두 번째 동사의 반복적 논리를 유지했습니다.
- source_word: ποῦ ὑπάγεις / τὴν ὁδὸν
  english_pob_choice: where you are going / the way
  chosen_korean: 어디로 가시는지 / 그 길
  alternatives_korean:
  - 어디로 가시는지 / 그 길
  - 어디로 가시는지 / 그 도리
  lexicon: BDAG
  rationale: ὑπάγω의 ‘떠나가다’ 뉘앙스를 과도하게 풀지 않고 ‘가시다’로 자연스럽게 옮겼으며, ὁδός는 다음 절과의 주제적 연결을 살리기 위해 ‘길’로 옮겼습니다.
theological_decisions:
- issue: 도마의 질문이 지닌 인식의 한계와 예수의 목적지 암시
  chosen_reading: 예수님의 목적지를 설명하지 않고, 도마의 무지와 질문 자체를 그대로 드러냈습니다.
  alternative_readings:
  - 어디로 떠나가시는지
  - 어디로 가서 아버지께 가시는지
  rationale: 본문은 목적지의 신학적 의미를 바로 해명하기보다, 도마가 그 의미를 아직 알지 못한다는 긴장을 보존합니다.
  doctrine_reference: 본문의 신학적 긴장을 그대로 유지
