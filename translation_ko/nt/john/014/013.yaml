revisions:
- from: 그리고 너희가 내 이름으로 무엇이든지 구하면, 내가 그것을 행하겠습니다. 이는 아버지께서 아들 안에서 영광을 받으시게 하려는 것입니다.
  to: 그리고 여러분이 내 이름으로 무엇이든지 구하시면, 내가 그것을 하겠습니다. 그리하여 아버지께서 아들 안에서[a] 영광을 받으시게 하려는 것입니다.
  rationale: 합쇼체 문체를 일관되게 하고, ποιέω의 자연스러운 현대어 표현을 사용했습니다. 목적을 나타내는 ἵνα는 ‘그리하여 … 하려는 것입니다’로 유지했습니다. ἐν τῷ υἱῷ는 본문에서 ‘아들 안에서’로 보존하고, ‘아들을 통하여’라는 가능한 이해는 각주에만 제시하여 해석을 단정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:45Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. ‘무엇이든지’, ‘내 이름으로’, ‘아들 안에서’는 각각 ὅ τι ἂν, ἐν τῷ ὀνόματί μου, ἐν τῷ υἱῷ의 열린 의미를 잘 보존합니다. 다만 ‘행하겠습니다’는 ποιήσω에 가능하나 현대 한국어에서는 ‘하겠습니다’가 더 자연스럽습니다. 또한 목적절의 ἵνα를 더 직접적으로 드러내도록 다듬는 것이 좋습니다.
  naturalness: 현 문장은 ‘너희가 … 구하면’(비격식·평서형)과 ‘행하겠습니다’(합쇼체)가 섞여 있어, 지정된 현대 합쇼체에 맞지 않습니다. ‘여러분이 … 구하시면’으로 통일하면 자연스럽고 정중한 문체가 됩니다.
  terminology: ‘내 이름으로’와 ‘아들 안에서’는 요한복음의 표현 및 신학적 여지를 보존하는 적절한 용어입니다. ‘아들 안에서’의 ἐν은 ‘아들을 통하여’로도 이해될 수 있으므로, 본문은 유지하고 각주로 가능성을 밝혀야 합니다.
  issues:
  - severity: medium
    issue: 문체가 합쇼체로 일관되지 않습니다.
    rationale: ‘너희가 … 구하면’은 비격식 형태인데 서술은 ‘행하겠습니다’로 합쇼체입니다. 대상 언어 규격에 맞게 ‘여러분이 … 구하시면’으로 통일하는 것이 필요합니다.
  - severity: low
    issue: ‘행하겠습니다’는 현대어에서 다소 딱딱합니다.
    rationale: ποιήσω는 여기서 넓은 뜻의 ‘하다’이므로 ‘내가 그것을 하겠습니다’가 더 자연스럽고 의미 손실이 없습니다.
  - severity: medium
    issue: ἐν τῷ υἱῷ의 대안적 이해를 알리는 각주가 없습니다.
    rationale: 영어 POB 감사 기록은 ‘through the Son’이라는 가능한 이해를 각주로 보존합니다. 한국어도 본문의 ‘아들 안에서’를 유지하되 해당 대안을 각주로 제시하는 것이 원문의 의미 여지를 보존합니다.
  revised_text: 그리고 여러분이 내 이름으로 무엇이든지 구하시면, 내가 그것을 하겠습니다. 그리하여 아버지께서 아들 안에서[a] 영광을 받으시게 하려는 것입니다.
  revised_footnotes:
