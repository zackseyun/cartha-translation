id: JHN.14.13
reference: John 14:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
  footnotes:
  - marker: a
    text: Or 'through the Son.' The Greek says 'in the Son,' which may express the sphere or means by which the Father is glorified.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 너희가 내 이름으로 무엇이든지 구하면, 내가 그것을 행하겠습니다. 이는 아버지께서 아들 안에서 영광을 받으시게 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅ τι ἂν
  english_pob_choice: whatever
  chosen_korean: 무엇이든지
  alternatives_korean:
  - 무슨 일이든지
  - 무엇이든
  lexicon: BDAG
  rationale: 무한정적 관계대명사+ἄν의 열린 범위를 한국어에서도 자연스럽게 살려, 요청의 범위를 제한하지 않는 의미를 유지했습니다.
- source_word: αἰτήσητε
  english_pob_choice: you ask
  chosen_korean: 구하면
  alternatives_korean:
  - 요청하면
  - 구하시면
  lexicon: BDAG
  rationale: 기도 문맥에서 αἰτέω의 ‘ask/request’를 합쇼체 문장 안에 자연스럽게 담기 위해 ‘구하다’를 택했습니다.
- source_word: ἐν τῷ ὀνόματί μου
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름 안에서
  - 내 이름 안에
  lexicon: BDAG
  rationale: 요한복음의 고유한 표현을 과도하게 풀지 않고, 한국어에서 관용적이면서도 원문의 관계성·대표성을 보존하는 표현으로 옮겼습니다.
- source_word: ἐν τῷ υἱῷ
  english_pob_choice: in the Son
  chosen_korean: 아들 안에서
  alternatives_korean:
  - 아들을 통해
  - 아들 안에
  lexicon: BDAG
  rationale: POB의 ‘in the Son’을 따라 ἐν의 여지를 좁히지 않고, 한국어에서도 ‘안에서’로 남겨 아버지의 영광이 아들 안에서 드러나는 영역성을 보존했습니다.
theological_decisions:
- issue: ‘내 이름으로’의 신학적 범위
  chosen_reading: 본문에는 해석을 덧붙이지 않고 ‘내 이름으로’로 유지했습니다.
  alternative_readings:
  - 내 권위로
  - 내 뜻에 따라
  - 나와 연합하여
  rationale: 요한문맥의 층위를 하나의 설명으로 환원하지 않고, 기도와 예수의 이름 사이의 관계를 원문에 가까운 형태로 남겼습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
- issue: ἐν τῷ υἱῷ의 처리
  chosen_reading: ‘아들 안에서’로 직역해, ‘through the Son’의 해석 가능성을 본문에서 닫지 않았습니다.
  alternative_readings:
  - 아들을 통해
  rationale: 원문 ἐν은 여기서 단일 의미로 확정되지 않으므로, 본문은 더 넓은 의미를 유지하고 주해적 해석은 각주가 아니라 검토 층위에 남깁니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
