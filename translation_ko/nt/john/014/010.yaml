id: JHN.14.10
reference: John 14:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
  footnotes:
  - marker: a
    text: Or 'on my own.' The phrase 'from myself' can express speaking on one's own initiative or authority.
    reason: lexical_alternative
  - marker: b
    text: Or 'abides in me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 아버지 안에 있고 아버지께서 내 안에 계신 것을 믿지 않느냐? 내가 너희에게 하는 말들은 내 스스로 하는 말이 아닙니다. 오히려 내 안에 머무르시는 아버지께서 자기 일을 하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 스스로’는 ‘자기 주도적으로’ 또는 ‘자기 권위로’라는 뜻까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘머무르시는’은 전통적으로 ‘거하시는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ πιστεύεις
  english_pob_choice: Do you not believe
  chosen_korean: 믿지 않느냐
  alternatives_korean:
  - 믿지 않습니까
  - 믿지 않느냐고
  lexicon: BDAG
  rationale: 요한복음의 반복적 πιστεύω를 살리기 위해 ‘믿다’를 유지했습니다. 반문형은 원문의 수사적 질문을 자연스럽게 전달합니다.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  english_pob_choice: in the Father ... in me
  chosen_korean: 아버지 안에 ... 내 안에
  alternatives_korean:
  - 아버지와 하나로 ... 나와 하나로
  - 아버지 가운데 ... 내 가운데
  lexicon: BDAG
  rationale: 상호 내주를 드러내는 ‘안에’를 그대로 살려, 해석적 완화인 ‘하나로’보다 원문의 관계성을 보존했습니다.
- source_word: ἀπ’ ἐμαυτοῦ
  english_pob_choice: from myself
  chosen_korean: 내 스스로
  alternatives_korean:
  - 나 자신에게서
  - 내게서
  lexicon: BDAG
  rationale: ‘from myself’의 자발성·독자성을 한국어에서 자연스럽게 드러내기 위해 ‘내 스스로’를 택했습니다. 이는 단순한 출처보다 ‘자기 주도/자기 권위로’ 말하지 않음을 포괄합니다.
- source_word: λαλῶ
  english_pob_choice: speak
  chosen_korean: 하는 말
  alternatives_korean:
  - 말하는 것
  - 말씀하시는
  lexicon: BDAG
  rationale: 앞의 λέγω와 구별되는 발화 행위를 살리되, 한국어에서는 ‘말하다’를 반복하기보다 ‘하는 말들’로 자연스럽게 옮겼습니다.
- source_word: μένων
  english_pob_choice: who remains
  chosen_korean: 머무르시는
  alternatives_korean:
  - 계시는
  - 거하시는
  lexicon: BDAG
  rationale: 요한복음의 μένω를 현대 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘머무르다’를 선택했습니다. 전통적 ‘거하다’는 가능하지만 문체상 더 교회적입니다.
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  english_pob_choice: does his works
  chosen_korean: 자기 일을 하십니다
  alternatives_korean:
  - 그의 일들을 하십니다
  - 그의 일들을 행하십니다
  lexicon: BDAG
  rationale: τὰ ἔργα αὐτοῦ의 ‘works’를 요한의 신학어로 살리면서도 한국어에서 어색한 직역을 피하기 위해 ‘자기 일’을 택했습니다. ‘자기’는 αὐτοῦ의 소유격을 반영합니다.
theological_decisions:
- issue: 상호 내주 표현의 보존
  chosen_reading: ‘아버지 안에 ... 내 안에’라는 직접적인 공간적 비유를 유지했습니다.
  alternative_readings:
  - ‘아버지와 하나로 ...’
  - ‘아버지와 내가 서로 안에’
  rationale: 문맥은 높은 그리스도론을 전제하지만, 본문 자체의 상호 내주 표현을 해석적으로 풀어 쓰기보다 그대로 보존하는 것이 사도의 의도를 가장 정확히 드러냅니다.
  doctrine_reference: 니케아 신경(381); 요한복음의 상호 내주 문맥
