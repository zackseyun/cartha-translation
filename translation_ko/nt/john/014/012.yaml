review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 κἀκεῖνος ποιήσει와 뒤의 ποιήσει는 모두 미래형이므로, 초안의 ‘그도 하며’는 현재·연결 표현으로 되어 미래의 약속이라는 원문의 시제를 충분히 반영하지 못합니다. μείζονα τούτων은 앞선 ‘일들’을 받아 ‘이 일들보다 더 큰 일들’로 명시하는 것이 한국어에서도 자연스럽고 원문의 생략된 명사를 무리 없이 보충합니다.
  naturalness: ‘그가 하는 일들을 그도 하며’는 시제와 호응 면에서 다소 어색합니다. ‘그도 할 것이며’로 고치면 엄숙한 합쇼체 문체와 문장 흐름이 자연스러워집니다. 인과를 나타내는 ὅτι 앞의 ‘그것은’은 불필요하게 앞 문장 전체를 지시하므로 생략하는 편이 간결하고 직접적입니다.
  terminology: ‘진실로, 진실로’, ‘나를 믿는 사람’, ‘일들’, ‘아버지께로’는 적절합니다. ‘더 큰 일들’은 원문의 비교가 무엇을 구체적으로 뜻하는지 해석으로 제한하지 않으면서도, 앞 절의 ἔργα에서 보충되는 명사를 자연스럽게 드러냅니다.
  issues:
  - severity: medium
    issue: 미래형 ποιήσει의 시제가 ‘그도 하며’에서 충분히 반영되지 않음
    rationale: 두 번의 ποιήσει는 미래형입니다. ‘그도 할 것이며 … 할 것입니다’로 옮겨야 미래의 약속과 두 동사의 병렬이 보존됩니다.
  - severity: low
    issue: ‘이보다 더 큰 일도’의 선행 비교 대상이 한국어에서 다소 불명확함
    rationale: τούτων은 앞서 언급된 예수의 ‘일들’을 가리킵니다. ‘이 일들보다 더 큰 일들’은 원문의 생략을 자연스럽게 보충하며 비교 대상을 분명히 합니다.
  - severity: low
    issue: 인과절 앞의 ‘그것은’이 불필요하게 지시적임
    rationale: ὅτι의 직접적인 인과 관계는 ‘내가 아버지께로 가기 때문입니다’로 충분히 표현됩니다.
  revised_text: 진실로, 진실로 내가 여러분에게 말합니다. 나를 믿는 사람은 내가 하는 일들을 그도 할 것이며, 이 일들보다 더 큰 일들을 할 것입니다. 내가 아버지께로 가기 때문입니다.
