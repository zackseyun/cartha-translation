source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
  footnotes:
  - marker: a
    text: Or 'greater works than these.' The Greek can supply 'works' from the previous clause.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the one who believes ... he' uses a grammatically masculine representative singular in Greek, referring generically to any believer.
    reason: cultural_note
translation:
  language: ko
  text: 진실로, 진실로 내가 여러분에게 말합니다. 나를 믿는 사람은 내가 하는 일들을 그도 할 것이며, 이 일들보다 더 큰 일들을 할 것입니다. 내가 아버지께로 가기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  english_pob_choice: Truly, truly
  chosen_korean: 진실로, 진실로
  alternatives_korean:
  - 아멘, 아멘
  - 참으로, 참으로
  lexicon: BDAG
  rationale: 예수의 강한 서두를 한국어에서 자연스럽고 엄숙하게 살리기 위해 중복된 확언 형식을 그대로 옮겼습니다.
- source_word: ὁ πιστεύων εἰς ἐμέ
  english_pob_choice: the one who believes in me
  chosen_korean: 나를 믿는 사람
  alternatives_korean:
  - 나를 믿는 자
  - 나를 믿는 이
  lexicon: BDAG
  rationale: 요한복음의 πιστεύω εἰς를 ‘믿는 사람’으로 옮겨 대표 단수의 일반성을 살리되, 한국어에서 문장이 지나치게 딱딱해지지 않게 했습니다.
- source_word: τὰ ἔργα ... κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει
  english_pob_choice: the works ... he will do greater than these
  chosen_korean: 그가 하는 일들을 그도 하며, 이보다 더 큰 일도 하게 될 것입니다
  alternatives_korean:
  - 그가 하는 일들을 그도 하며, 이보다 더 큰 일들까지 하게 될 것입니다
  - 그가 하는 일들을 그도 하며, 이보다 더 큰 일들을 하게 될 것입니다
  lexicon: BDAG
  rationale: ἔργα를 ‘일들’로 옮겨 요한복음의 표지어를 유지하면서, μείζονα τούτων의 비교는 원문의 열린 범위를 해치지 않도록 ‘이보다 더 큰 일’로 처리했습니다.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  english_pob_choice: I am going to the Father
  chosen_korean: 내가 아버지께로 가기 때문입니다
  alternatives_korean:
  - 내가 아버지께로 가고 있기 때문입니다
  - 내가 아버지께로 가기 때문입니다
  lexicon: BDAG
  rationale: 현재형의 뉘앙스를 한국어 문맥상 자연스러운 이유절로 옮기고, άρθρον이 있는 τὸν πατέρα는 ‘아버지’로 유지했습니다.
theological_decisions:
- issue: ‘더 큰 일’의 범위
  chosen_reading: 예수께서 하신 일과 비교되는 더 큰 일들이 실제로 일어난다는 점은 살리되, 그 ‘더 큼’의 구체적 의미는 본문이 열어 둔 채로 둡니다.
  alternative_readings:
  - 부활 이후 사역에서 더 넓은 범위의 일들
  - 성령에 의해 가능해진 구속사적 의미에서 더 큰 일
  - 표적의 수나 규모가 더 큰 일
  rationale: 본문은 ‘더 큰’의 정확한 신학적 범주를 규정하지 않으므로, 해석을 과도하게 좁히지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
