translation:
  language: ko
  text: 그리고 이제 나는 그것이 일어나기 전에 너희에게 말했습니다[a]. 이는 그것이 일어날 때에 너희가 믿도록 하려는 것입니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것이 이루어지기 전에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것이 이루어질 때에’.
    reason: lexical_alternative
  - marker: c
    text: 이 동사는 ‘신뢰하다’라는 뜻도 가질 수 있지만, 요한복음에서는 여기서 일반적으로 ‘믿다’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  english_pob_choice: And now
  chosen_korean: 이제 나는
  alternatives_korean:
  - 그리고 이제 나는
  - 이제
  lexicon: BDAG
  rationale: καί의 연결감과 νῦν의 시간 표시를 살리면서, 한국어에서는 자연스럽게 화자가 직접 말하는 형식으로 옮겼습니다.
- source_word: εἴρηκα ὑμῖν
  english_pob_choice: I have told you
  chosen_korean: 너희에게 말했습니다
  alternatives_korean:
  - 너희에게 말해 왔습니다
  - 너희에게 말했습니다
  lexicon: BDAG
  rationale: 완료형 εἴρηκα는 이미 한 말이 현재까지 효력을 가지는 뉘앙스를 가지므로, 한국어에서는 자연스러운 완료 과거 ‘말했습니다’로 옮겼습니다.
- source_word: πρὶν γενέσθαι
  english_pob_choice: before it happens
  chosen_korean: 그것이 일어나기 전에
  alternatives_korean:
  - 그것이 이루어지기 전에
  - 그것이 일어나기 전
  lexicon: BDAG
  rationale: γενέσθαι는 ‘일어나다/생겨나다’의 사건 발생을 가리키므로, 문맥에 맞는 중립적 표현인 ‘일어나기 전에’를 선택했습니다.
- source_word: ὅταν γένηται
  english_pob_choice: when it happens
  chosen_korean: 그것이 일어날 때
  alternatives_korean:
  - 그것이 이루어질 때
  - 그 일이 생길 때
  lexicon: BDAG
  rationale: 앞의 πρὶν γενέσθαι와 같은 동사군의 반복을 한국어에서도 유지하여, ‘일어나기 전에 / 일어날 때’의 대응을 살렸습니다.
- source_word: πιστεύσητε
  english_pob_choice: you may believe
  chosen_korean: 너희가 믿게 하려는 것입니다
  alternatives_korean:
  - 너희가 믿도록 하려는 것입니다
  - 너희가 믿게 됩니다
  lexicon: BDAG
  rationale: ἵνα절의 목적을 한국어 자연문장으로 풀어 ‘믿게 하려는 것입니다’로 옮겼으며, 요한복음의 표준적 번역어인 ‘믿다’를 유지했습니다.
theological_decisions:
- issue: πιστεύσητε의 목적성
  chosen_reading: 예수님의 예고는 사건 발생 후 제자들의 믿음을 일깨우거나 강화하려는 목적을 드러냅니다.
  alternative_readings:
  - 처음 믿게 하려는 목적
  - 이미 있는 믿음을 계속하게 하려는 목적
  rationale: 본문의 ἵνα는 목적을 나타내지만, 동사 자체는 믿음의 시작인지 지속인지 특정하지 않으므로, 한국어도 그 긴장을 풀지 않고 넓게 ‘믿게 하려는 것’으로 두었습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
