lexical_decisions:
- source_word: Λέγει αὐτῷ
  english_pob_choice: said to him
  chosen_korean: 그에게 말했습니다
  alternatives_korean:
  - 그에게 말하였습니다
  - 그에게 이르렀습니다
  lexicon: SBLGNT; BDAG
  rationale: 헬라어 현재시제 서술 ‘λέγει’는 한국어 서사에서 자연스럽게 과거로 옮기고, αὐτῷ는 대화의 상대를 분명히 하는 ‘그에게’로 처리했습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  lexicon: BDAG
  rationale: 예수께 대한 호칭으로서의 κύριος를 경건하지만 너무 약하지 않은 ‘주님’으로 옮겨, 존칭과 주권적 뉘앙스를 함께 살렸습니다.
- source_word: δεῖξον ἡμῖν
  english_pob_choice: show us
  chosen_korean: 우리에게 보여 주십시오
  alternatives_korean:
  - 우리를 보여 주십시오
  - 보여 주시옵소서
  lexicon: BDAG
  rationale: δεῖξον은 직접적인 요청이므로 ‘보여 주십시오’가 가장 자연스럽고, ἡμῖν은 한국어에서 목적어를 분명히 하기 위해 ‘우리에게’로 풀어 옮겼습니다.
- source_word: τὸν πατέρα
  english_pob_choice: the Father
  chosen_korean: 아버지
  alternatives_korean:
  - 그 아버지
  - 아버님
  lexicon: BDAG
  rationale: 요한복음의 문맥상 하나님을 가리키는 아버지이지만, 한국어에서는 직역형의 ‘아버지’가 원문의 호칭성과 의미를 가장 직접적으로 드러냅니다.
- source_word: ἀρκεῖ ἡμῖν
  english_pob_choice: is enough for us
  chosen_korean: 우리에게 충분합니다
  alternatives_korean:
  - 우리에게 충분합니다
  - 우리에게 족합니다
  lexicon: BDAG
  rationale: ἀρκεῖ는 ‘충분하다’의 의미이므로 현대 한국어에서 가장 분명한 ‘충분합니다’로 옮겼고, ἡμῖν은 ‘우리에게’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: Κύριε의 예수 호칭 뉘앙스
  chosen_reading: ‘주님’으로 번역해 예수께 드리는 존칭이면서도 제자도의 관계를 드러냈습니다.
  alternative_readings:
  - 주
  - 선생님
  rationale: 본문은 단순 예의 호칭보다 예수의 위상과 관련된 더 강한 호칭을 요구하므로, POB의 κύριος 기본값을 한국어에서 가장 자연스럽게 반영하는 ‘주님’을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
