id: JHN.14.25
reference: John 14:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
  footnotes:
  - marker: a
    text: Or 'while staying with you' or 'while I am with you.' The Greek uses the participle of 'remain,' a recurring Johannine term.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너희와 함께 있으면서 이 모든 것을 너희에게 말해 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 μένων은 요한복음에서 반복되는 ‘머물다/남다’ 계열 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  english_pob_choice: these things
  chosen_korean: 이 모든 것
  alternatives_korean:
  - 이것들
  - 이러한 것들
  lexicon: SBLGNT
  rationale: 중립복수 지시어 Ταῦτα의 복수성을 살리면서, 앞 문맥의 가르침 전체를 가리키는 뉘앙스를 자연스럽게 드러냅니다.
- source_word: λελάληκα
  english_pob_choice: I have spoken
  chosen_korean: 말해 두었습니다
  alternatives_korean:
  - 말했습니다
  - 말해 왔습니다
  lexicon: BDAG
  rationale: 완료시제의 ‘말해 두었다’는 이미 말한 내용이 지금도 유효하다는 점을 살리면서, 한국어 문장으로는 가장 자연스럽게 읽힙니다.
- source_word: παρ’ ὑμῖν / μένων
  english_pob_choice: while staying with you / while remaining with you
  chosen_korean: 너희와 함께 있으면서
  alternatives_korean:
  - 너희 곁에 머물면서
  - 너희 가운데 머물면서
  - 너희와 함께 남아 있으면서
  lexicon: BDAG
  rationale: παρά + 여격과 μένω의 결합을 단순한 시간 부사로만 풀지 않고, 예수의 지속적 임재라는 문맥을 살려 ‘함께 있으면서’로 옮겼습니다.
- source_word: ὑμῖν
  english_pob_choice: to you
  chosen_korean: 너희에게
  alternatives_korean:
  - 당신들에게
  lexicon: BDAG
  rationale: 제자들에게 하는 복수 2인칭 대격/여격의 직접 호칭을 표준 한국어로 자연스럽게 반영했습니다.
theological_decisions:
- issue: μένω 계열 표현의 신학적 연속성 보존
  chosen_reading: ‘머물다/남다’의 직역보다 ‘함께 있으면서’로 자연화하되, 예수의 계속된 임재를 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 너희와 함께 머물면서
  - 너희와 함께 남아 있으면서
  - 너희와 함께 있는 동안
  rationale: 요한복음의 μένω는 단순한 체류가 아니라 관계적·신학적 ‘머묾’의 뉘앙스를 지닙니다. 한국어에서는 완전한 직역보다 문장 흐름을 살리면서도 그 임재의 의미를 보존하는 쪽이 적절합니다.
  doctrine_reference: 'Translation philosophy #5 (Consistency of key terms, or documented exception)'
