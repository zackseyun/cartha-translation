  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
  footnotes:
  - marker: a
    text: Or 'while staying with you' or 'while I am with you.' The Greek uses the participle of 'remain,' a recurring Johannine term.
