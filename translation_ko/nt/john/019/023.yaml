id: JHN.19.23
reference: John 19:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
  footnotes:
  - marker: a
    text: Or 'his garments'; the Greek term can refer broadly to clothing, but here likely means the outer garments in contrast with the tunic mentioned separately.
    reason: lexical_alternative
  - marker: b
    text: Or 'from above.' In this context the phrase most likely refers to the tunic being woven from the top of the garment downward.
    reason: lexical_alternative
  - marker: c
    text: Or 'woven in one piece through the whole garment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 군인들은 예수님을 십자가에 못 박은 뒤에 그의 겉옷들을 가져다가 네 몫으로 나누어 각 군인에게 한 몫씩 주고, 또 속옷도 가져갔습니다. 그 속옷은 솔기 없이 위에서부터 온통 짜인 것이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겉옷들’은 ἱμάτια가 여기서 속옷과 구별되는 바깥옷들을 가리킬 가능성을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘위에서부터’는 의복 문맥에서 옷의 윗부분에서 아래로 짜였다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘온통 짜인’은 ‘한 벌로/한 조각으로 짜인’이라는 뜻을 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  english_pob_choice: So when the soldiers
  chosen_korean: 그런데 군인들은
  alternatives_korean:
  - 그러므로 군인들은
  - 그리하여 군인들은
  lexicon: BDAG
  rationale: οὖν의 서술 연결을 한국어 이야기 흐름에 맞게 처리했습니다. 여기서는 단순한 인과보다 장면 전환의 뉘앙스가 있어 ‘그런데’가 자연스럽습니다.
- source_word: τὰ ἱμάτια αὐτοῦ
  english_pob_choice: his outer garments
  chosen_korean: 그의 겉옷들
  alternatives_korean:
  - 그의 옷들
  - 그의 옷가지들
  lexicon: BDAG
  rationale: χιτών과 대비되는 ἱμάτια의 구별을 살리기 위해 ‘겉옷들’로 옮겼습니다. 복수형도 반영했습니다.
- source_word: καὶ τὸν χιτῶνα
  english_pob_choice: and also the tunic
  chosen_korean: 또 속옷도
  alternatives_korean:
  - 그리고 속옷도
  - 또 튜닉도
  lexicon: BDAG
  rationale: χιτών은 몸에 가장 가까이 입는 옷으로서 한국어에서는 ‘속옷’이 구별을 가장 잘 드러냅니다. 다만 현대어 오해 가능성을 줄이기 위해 본문에는 일반적 의미의 옷가지 맥락을 유지했습니다.
- source_word: ἄραφος
  english_pob_choice: seamless
  chosen_korean: 솔기 없이
  alternatives_korean:
  - 이음매 없이
  - 한 벌로
  lexicon: BDAG
  rationale: ἄραφος의 기본 의미를 직설적으로 살려 ‘솔기 없이’로 옮겼습니다. ‘매끈한’ 같은 완화 표현은 피했습니다.
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  english_pob_choice: woven from the top throughout
  chosen_korean: 위에서부터 온통 짜인
  alternatives_korean:
  - 위쪽에서부터 전체가 짜인
  - 위에서부터 전체에 걸쳐 짜인
  lexicon: BDAG
  rationale: ἐκ τῶν ἄνωθεν은 의류 문맥에서 ‘위에서부터’로 이해하는 것이 가장 자연스럽습니다. δι’ ὅλου는 ‘온통’으로 전체성을 간결하게 전달했습니다.
theological_decisions:
- issue: 예수님의 속옷 묘사에 상징을 덧입힐지 여부
  chosen_reading: 본문의 묘사적 정보를 그대로 옮기고, 상징적 의미는 본문에 삽입하지 않았습니다.
  alternative_readings:
  - 제사장 의복이나 교회 일치의 상징으로 읽기
  - 성례적 의미를 암시하기
  rationale: 이 절은 군인들의 행위와 의복의 구조를 묘사합니다. 가능한 신학적 연상은 주석에서 다룰 수 있지만, 번역문에는 본문이 말하지 않는 의미를 넣지 않는 것이 적절합니다.
  doctrine_reference: 본문이 직접 말하지 않는 신학적 함의를 번역에 주입하지 말 것
