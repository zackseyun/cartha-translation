id: JHN.19.8
reference: John 19:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: ko
  text: 그런데 빌라도는 그 말을 듣고 더욱 두려워졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  english_pob_choice: When ...
  chosen_korean: 그런데
  alternatives_korean:
  - 그리고
  - 그때
  - 그러므로
  lexicon: BDAG
  rationale: 시간을 여는 접속과 앞뒤 문맥의 연결을 한국어에서는 자연스럽게 하나의 전환어로 살렸습니다. ‘그러므로’처럼 인과를 강하게 드러내기보다, 문맥상 반응의 전환을 보여 주는 ‘그런데’가 가장 무난합니다.
- source_word: ἤκουσεν τοῦτον τὸν λόγον
  english_pob_choice: heard this statement
  chosen_korean: 그 말을 듣고
  alternatives_korean:
  - 이 말을 듣고
  - 이 진술을 듣고
  - 이 말을 들었을 때
  lexicon: BDAG
  rationale: λόγος는 여기서 직전 절의 구체적 발언(“하나님의 아들이라”)을 가리키므로, 한국어에서는 어색한 ‘진술’보다 자연스럽고 직전 문맥을 받는 ‘그 말’로 옮겼습니다.
- source_word: μᾶλλον ἐφοβήθη
  english_pob_choice: became even more afraid
  chosen_korean: 더욱 두려워졌습니다
  alternatives_korean:
  - 더 무서워졌습니다
  - 한층 더 두려워했습니다
  - 더욱 두려워했습니다
  lexicon: BDAG
  rationale: μᾶλλον의 증대 의미와 φοβέομαι의 상태 변화(‘두려워지다’)를 함께 살려, 감정의 강도가 높아진 것을 자연스러운 합쇼체로 표현했습니다.
theological_decisions:
- issue: 빌라도의 두려움의 성격
  chosen_reading: 두려움의 원인을 정치적 불안이나 종교적 경외로 특정하지 않고, 본문이 말하는 심리적 증대 자체를 그대로 드러냈습니다.
  alternative_readings:
  - 정치적으로 더 불안해졌습니다
  - 신적 함의를 느끼고 더 두려워졌습니다
  rationale: 헬라어 본문은 두려움이 커졌다고만 말하며 원인을 해석하지 않습니다. 따라서 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: '해석의 절제: 본문이 밝히지 않은 동기를 덧붙이지 않음'
