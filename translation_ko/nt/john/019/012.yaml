  - severity: medium
    issue: 각주 표지의 위치
    rationale: a는 ἐκ τούτου, b는 ‘유대인들’, c는 ἀντιλέγει에 각각 붙어야 합니다. 현행처럼 인용문 끝에 함께 붙이면 각주의 대상이 불명확합니다.
