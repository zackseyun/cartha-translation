id: JHN.19.12
reference: John 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
  footnotes:
  - marker: a
    text: Or, “Because of this Pilate kept trying to release him.” The Greek phrase ἐκ τούτου can be understood temporally (“from then on”) or causally (“because of this”).
    reason: lexical_alternative
  - marker: b
    text: In John, “the Jews” often refers more specifically to the Judean authorities or to particular Jewish opponents in the narrative context, not necessarily to the Jewish people as a whole.
    reason: cultural_note
  - marker: c
    text: Or, “opposes Caesar” or “sets himself against Caesar.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이로부터 빌라도는 그를 놓아주려고 계속 애썼습니다. 그런데 유대인들은 외치며 말했습니다. “이 사람을 놓아주면 당신은 카이사르의 친구가 아닙니다. 스스로 왕이 되려는 사람은 누구나 카이사르에게 맞서는 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 일 때문에 빌라도는 그를 놓아주려고 계속 애썼습니다.” ἐκ τούτου는 시간적 의미(“이로부터”)로도, 원인적 의미(“이 일 때문에”)로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 요한복음에서 “유대인들”은 문맥에 따라 전체 유대 민족보다 예루살렘의 유대 지도자들 또는 대적자들을 더 구체적으로 가리키는 경우가 많습니다.
    reason: cultural_note
  - marker: c
    text: 또는 “카이사르에게 반대하는 것입니다”나 “카이사르를 거스르는 것입니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τούτου
  english_pob_choice: From then on
  chosen_korean: 이로부터
  alternatives_korean:
  - 그때부터
  - 이 일로 말미암아
  lexicon: BDAG
  rationale: 문맥상 시간의 전개를 표시하므로, 원문의 전개감을 살리면서도 현대 한국어에서 자연스러운 ‘이로부터’로 옮겼습니다.
- source_word: ἐζήτει
  english_pob_choice: was seeking
  chosen_korean: 계속 애썼습니다
  alternatives_korean:
  - 놓아주려고 했습니다
  - 놓아주려고 계속 시도했습니다
  lexicon: BDAG
  rationale: 미완료상은 단발적 시도보다 지속적·반복적 노력을 드러내므로, 법정 맥락을 해치지 않는 범위에서 ‘계속 애썼습니다’로 표현했습니다.
- source_word: οἱ δὲ Ἰουδαῖοι
  english_pob_choice: But the Jews
  chosen_korean: 유대인들은
  alternatives_korean:
  - 유대 지도자들은
  - 유대인들은
  lexicon: BDAG
  rationale: 원문은 단순히 ‘유대인들’이라고 말하므로, 해석적 축소 없이 본문 차원의 표현을 유지했습니다.
- source_word: ἀντιλέγει τῷ Καίσαρι
  english_pob_choice: speaks against Caesar
  chosen_korean: 카이사르에게 맞서는 것입니다
  alternatives_korean:
  - 카이사르를 반대하는 것입니다
  - 카이사르를 거스르는 것입니다
  lexicon: BDAG
  rationale: ἀντιλέγω의 핵심은 단순한 의견 표명이 아니라 대항·반대의 의미이므로, 정치적 위협의 뉘앙스를 살려 ‘맞서는’으로 옮겼습니다.
theological_decisions:
- issue: ‘the Jews’의 지시 범위
  chosen_reading: 본문에는 ‘유대인들’로 두고, 특정 지도층으로 제한하지 않았습니다.
  alternative_readings:
  - 유대 지도자들
  - 유대인들(문맥상 예루살렘 지도층)
  rationale: 요한복음의 관용적 용례를 주석이 아닌 본문 안에서 임의로 좁히지 않기 위해, 원문 수준의 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
