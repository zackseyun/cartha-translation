revisions:
- from: 이로부터 빌라도는 그를 놓아주려고 계속 애썼습니다. 그런데 유대인들은 외치며 말했습니다. “이 사람을 놓아주면 당신은 카이사르의 친구가 아닙니다. 스스로 왕이 되려는 사람은 누구나 카이사르에게 맞서는 것입니다.”[a][b][c]
  to: 그때부터[a] 빌라도는 그를 놓아주려고 계속 애썼습니다. 그러나 유대인들이[b] 큰 소리로 외쳤습니다. “이 사람을 놓아주면 당신은 카이사르의 친구가 아닙니다. 스스로 왕이 되는 사람은 누구나 카이사르에게 맞서는 사람입니다.”[c]
  rationale: 시간적 독해를 본문에서 자연스러운 ‘그때부터’로 유지하되 원인적 독해는 각주에 보존했습니다. 미완료상의 지속성을 ‘계속 애썼습니다’로 살렸고, ‘자신을 왕으로 만드는’ 원문의 단정적 표현을 ‘스스로 왕이 되는 사람’으로 바로잡았습니다. 각주 표지를 해당 원어 어구 가까이에 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:55Z'
review_pass:
  verdict: revise
  source_fidelity: ‘스스로 왕이 되려는 사람’은 βασιλέα ἑαυτὸν ποιῶν(‘자신을 왕으로 만드는 사람’)의 단정적 표현을 ‘되려는’이라는 의도·시도 표현으로 약화합니다. 또한 각주 표지가 관련 어구가 아니라 문장 끝에 한꺼번에 놓여 있어, 주석의 적용 범위가 불명확합니다.
  naturalness: ‘이로부터’와 ‘외치며 말했습니다’는 현대 표준어 산문에서는 다소 문어적이거나 중복적으로 들립니다. ‘그때부터’와 ‘큰 소리로 외쳤습니다’가 원문의 시간 전개와 δημόσια 외침을 자연스럽게 전달합니다.
  terminology: ‘빌라도’, ‘유대인들’, ‘카이사르’, ‘놓아주다’는 적절합니다. 본문은 원문대로 ‘유대인들’을 유지하고, 문맥상 지시 범위는 각주에서만 설명하는 방식이 타당합니다. ἀντιλέγει는 이 정치적 맥락에서 ‘카이사르에게 맞서다’로 무리 없이 옮길 수 있습니다.
