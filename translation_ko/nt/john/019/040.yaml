  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
  footnotes:
  - marker: a
    text: Or 'among the Judeans,' if taken geographically rather than ethnically/religiously; here the context favors a reference to Jewish burial practice in general.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 예수님의 시신을 가져다가 향품과 함께 삼베 천으로 감았는데, 이는 유대인들의 장례 관습과 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대 사람들 가운데서’로도 옮길 수 있으나, 여기서는 일반적인 유대인의 장례 관습을 가리키는 문맥이 더 강합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  english_pob_choice: they took
  chosen_korean: 가져다가
  alternatives_korean:
  - 가져갔습니다
  - 취했습니다
  lexicon: BDAG
  rationale: ἐλάβον은 시신을 실제로 인수하여 장례 준비를 하는 동작이므로, 문맥상 자연스럽고 행위 방향을 살린 ‘가져다가’로 옮겼습니다.
- source_word: τὸ σῶμα
  english_pob_choice: body
  chosen_korean: 시신
  alternatives_korean:
  - 몸
  - 몸뚱이
  lexicon: BDAG
  rationale: σῶμα의 기본값은 ‘몸’이지만, 여기서는 매장 준비 문맥이므로 죽은 몸을 드러내는 ‘시신’이 한국어 독자에게 더 정확합니다.
- source_word: ἔδησαν … ὀθονίοις
  english_pob_choice: wrapped it in linen cloths
  chosen_korean: 삼베 천으로 감았는데
  alternatives_korean:
  - 세마포 천으로 둘렀는데
  - 린넨 천으로 묶었는데
  lexicon: BDAG
  rationale: δέω의 기본 의미는 ‘묶다/매다’지만, 장례 준비에서 옷감으로 시신을 처리하는 행동이므로 한국어에서는 자연스럽게 ‘감다’로 옮기되, 뒤의 도구구를 붙여 직역성을 유지했습니다.
- source_word: ἀρώματα
  english_pob_choice: the spices
  chosen_korean: 향품
  alternatives_korean:
  - 향신료
  - 향료
  lexicon: BDAG
  rationale: 장례용 향료를 가리키는 ἀρώματα는 한국어 성경에서 널리 쓰이는 ‘향품’이 가장 적절하며, 단순 식재료의 뉘앙스를 피합니다.
- source_word: τοῖς Ἰουδαίοις
  english_pob_choice: the Jews
  chosen_korean: 유대인들의
  alternatives_korean:
  - 유대 사람들의
  - 유다 사람들의
  lexicon: BDAG
  rationale: 여기서는 지리적 ‘유대 사람들’보다 종교·문화적 집단을 가리키는 뜻이 강하므로, POB의 해석과 같이 ‘유대인들’로 옮겼습니다.
theological_decisions:
- issue: Ἰουδαίοις의 범위와 뉘앙스
  chosen_reading: 유대인들의 장례 관습
  alternative_readings:
  - 유대 사람들의 장례 관습
  - 유대 지역 사람들의 장례 관습
  rationale: 문맥상 요한복음의 반유대적 뉘앙스를 만들기보다, 예수 장례에 적용되는 유대인의 일반적 관습을 가리키는 문화적 표현으로 읽는 것이 타당합니다.
  doctrine_reference: original-language primacy; contextual semantic range
