review_pass:
  verdict: revise
  source_fidelity: 원문의 καθὼς ἔθος ἐστὶν ... ἐνταφιάζειν은 현재의 일반적 관습, 곧 ‘유대인들이 장례를 위해 시신을 준비하는 관습에 따라’를 뜻합니다. 초안의 ‘같았습니다’는 과거형 비교 서술이 되어 이 관습적 의미를 충분히 나타내지 못합니다. 또한 ὀθόνια는 삼베보다는 아마포(린넨) 천을 가리킵니다.
  naturalness: ‘이는 유대인들의 장례 관습과 같았습니다’는 한국어로 다소 어색하며, 무엇이 무엇과 같다는 것인지도 불명확합니다. 두 문장으로 나누어 관습에 따른 행위임을 밝히면 현대 합쇼체로 자연스럽습니다.
  terminology: ἀρώματα의 ‘향품’은 장례 문맥에 적절합니다. σῶμα의 ‘시신’도 문맥상 적절합니다. ὀθονίοις는 재료를 정확히 나타내도록 ‘아마포 천’으로 고치는 것이 안전합니다. τοῖς Ἰουδαίοις는 이 문맥에서 ‘유대인들’이 자연스럽습니다.
  issues:
  - severity: medium
    issue: ‘이는 유대인들의 장례 관습과 같았습니다’
    rationale: καθὼς는 행위가 관습에 부합함을 나타내며, ἔθος ἐστίν은 현재의 일반적 관습입니다. 초안은 비교 대상이 불분명하고 과거형 ‘같았습니다’로 원문의 의미를 흐립니다.
  - severity: medium
    issue: ‘삼베 천’
    rationale: ὀθόνια는 일반적으로 아마포/린넨 천을 뜻합니다. 삼베는 다른 섬유를 가리키므로 재료를 부정확하게 특정합니다.
  revised_text: 그들은 예수님의 시신을 가져다가 향품과 함께 아마포 천으로 감았습니다. 이것은 유대인들이 장례를 위해 시신을 준비하는 관습에 따른 것이었습니다.[a]
