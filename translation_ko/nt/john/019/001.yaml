lexical_decisions:
- source_word: Τότε οὖν
  english_pob_choice: Then
  chosen_korean: 그때에
  alternatives_korean:
  - 그런즉
  - 그리하여
  - 그때
  lexicon: BDAG
  rationale: 두 시간·논리 표지 Τότε와 οὖν의 흐름을 한국어에서 자연스럽게 한 번의 전개 표지로 압축했습니다. '그때에'는 사건의 순차성을 살리면서도 문체가 과하지 않습니다.
- source_word: ἔλαβεν
  english_pob_choice: took
  chosen_korean: 데려다가
  alternatives_korean:
  - 데리고 갔다가
  - 잡아다가
  - 붙들어
  lexicon: BDAG
  rationale: 여기서는 단순한 '가져감'보다 예수를 심문·처벌 맥락 안으로 끌고 가는 장면이므로 '데려다가'가 서술 흐름과 맞습니다. 다만 원문의 폭력성은 동사 ἐμαστίγωσεν에서 충분히 드러나므로 과도한 해석은 피했습니다.
- source_word: ἐμαστίγωσεν
  english_pob_choice: flogged him
  chosen_korean: 채찍질했습니다
  alternatives_korean:
  - 매질했습니다
  - 태형했습니다
  - 채찍으로 때렸습니다
  lexicon: BDAG
  rationale: μαστιγόω는 채찍/태형의 가혹한 구타를 뜻하므로, 현대 한국어에서 가장 직접적이고 명료한 '채찍질했습니다'를 택했습니다. '매질'은 다소 포괄적이고, '태형'은 제도명처럼 들려 동사로는 덜 자연스럽습니다.
theological_decisions:
- issue: ἔλαβεν ... ἐμαστίγωσεν의 주어가 가리키는 로마 관행상 대리 수행 여부
  chosen_reading: 빌라도를 두 동사의 문법적 주어로 그대로 유지하되, 그가 직접 채찍질했는지 아니면 명령했는지는 밝히지 않았습니다.
  alternative_readings:
  - 빌라도가 예수를 데려다가 채찍질하게 했습니다
  - 빌라도가 예수를 데려다가 채찍질하도록 명했습니다
  rationale: 그리스어 본문은 빌라도를 행위의 주어로 제시하지만, 한국어 번역에서 로마 절차의 세부를 덧붙이면 원문이 주는 표면 의미를 넘어서게 됩니다. 본문이 유지하는 책임 귀속은 살리되, 직접행위와 위임행위 사이의 긴장은 그대로 두었습니다.
  doctrine_reference: 원문 표면 구조 보존 및 해석적 과잉 방지
