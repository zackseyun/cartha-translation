id: JHN.19.37
reference: John 19:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
  footnotes:
  - marker: a
    text: Or, “They will look to him whom they pierced.” The Greek construction can be rendered either with 'on' or 'to,' and the wording echoes Zechariah 12:10.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 또 다른 성경은 말합니다[a]. “그들이 찌른 이를 바라볼 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 찌른 이를 향해 바라볼 것입니다.” 그리스어 표현은 ‘~을 바라보다’ 또는 ‘~을 향해 바라보다’로 옮길 수 있으며, 스가랴 12:10을 반향합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν ἑτέρα γραφή
  english_pob_choice: And again another Scripture says
  chosen_korean: 그리고 또 다른 성경은 이렇게 말합니다
  alternatives_korean:
  - 그리고 또 다른 성구는 말합니다
  - 그리고 다시 다른 성경이 말합니다
  lexicon: BDAG
  rationale: ἑτέρα γραφή는 새 인용을 여는 표현이므로 자연스럽게 ‘또 다른 성경’으로 옮겼고, λέγει는 성경 인용문을 여는 현재형으로 ‘말합니다’를 택했습니다.
- source_word: Ὄψονται
  english_pob_choice: They will look on
  chosen_korean: 바라볼 것입니다
  alternatives_korean:
  - 볼 것입니다
  - 주목할 것입니다
  lexicon: BDAG
  rationale: Ὄψονται는 단순 시각보다 대상에 대한 향한 시선을 가리키므로, 문맥상 더 직접적인 ‘바라보다’로 옮겼습니다.
- source_word: εἰς ὃν
  english_pob_choice: on the one whom
  chosen_korean: 이를
  alternatives_korean:
  - 그를
  - 그분을
  lexicon: BDAG
  rationale: εἰς는 시선의 방향을 나타내므로 한국어에서는 중복을 피하기 위해 목적어를 자연스럽게 연결하는 ‘이를’로 처리했습니다.
- source_word: ἐξεκέντησαν
  english_pob_choice: they pierced
  chosen_korean: 찌른
  alternatives_korean:
  - 꿰뚫은
  - 창으로 찌른
  lexicon: BDAG
  rationale: ἐξεκέντησαν은 신체를 찌르거나 꿰뚫는 행위를 뜻하므로, 요한복음의 수난 장면에 가장 직접적인 ‘찌른’이 적절합니다.
theological_decisions:
- issue: 시편/스가랴 인용의 메시아적 함의를 드러내는 번역어 선택
  chosen_reading: ‘찌른 이’로 옮겨 요한이 예수를 가리키는 문맥을 유지했습니다.
  alternative_readings:
  - ‘그를 찌른 자’를 분명히 넣는 번역
  - ‘그가 찔린 것을’로 완화하는 번역
  rationale: 이 절은 스가랴의 예언을 요한의 그리스도론적 문맥에서 인용하므로, 원문의 대상 지시를 흐리지 않으면서도 예수에게 귀속되는 의미가 드러나도록 했습니다.
  doctrine_reference: 요한복음 19장 수난 서술과 스가랴 12:10 인용의 상호본문성
