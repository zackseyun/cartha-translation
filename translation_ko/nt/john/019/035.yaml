id: JHN.19.35
reference: John 19:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
  footnotes:
  - marker: a
    text: Or 'so that you too may continue believing.' The present subjunctive may carry an ongoing nuance.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그것을 본 이가 증언하였으며, 그의 증언은 참됩니다. 그 사람은 자신이 참된 말을 하고 있음을 압니다. 이는 여러분도 믿게 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  english_pob_choice: the one who has seen
  chosen_korean: 그것을 본 이
  alternatives_korean:
  - 본 사람
  - 목격자
  lexicon: BDAG
  rationale: 완료 분사의 지속적 효력을 살리면서도, POB의 ‘the one who has seen’에 맞게 서술형이 아닌 명사구로 옮겼습니다. ‘목격자’는 해석을 앞세우므로 본문은 더 직접적인 표현을 택했습니다.
- source_word: μεμαρτύρηκεν
  english_pob_choice: has testified
  chosen_korean: 증언하였으며
  alternatives_korean:
  - 증언해 왔으며
  - 증언하였고
  lexicon: BDAG
  rationale: 완료 시상의 완료된 증언과 현재적 유효성을 한국어의 과거완료적 뉘앙스로 무리 없이 반영했습니다. 문맥상 연결을 위해 접속 어미를 사용했습니다.
- source_word: ἀληθινὴ ... ἡ μαρτυρία
  english_pob_choice: his testimony is true
  chosen_korean: 그의 증언은 참됩니다
  alternatives_korean:
  - 그의 증언은 참입니다
  - 그의 증언은 진실합니다
  lexicon: BDAG
  rationale: ἀληθινή를 단순히 ‘참’으로 옮기면 형용사적 사실판단이 가장 직접적으로 살아납니다. ‘참됩니다’는 현대 한국어에서 다소 문어적이지만, 본문의 단정성을 유지합니다.
- source_word: ἀληθῆ λέγει
  english_pob_choice: he is telling the truth
  chosen_korean: 참된 말을 하고 있음을 압니다
  alternatives_korean:
  - 진실을 말하고 있음을 압니다
  - 참말을 하고 있음을 압니다
  lexicon: BDAG
  rationale: λέγει의 진행적 현재와 ἀληθῆ의 관용적 결합을 자연스러운 한국어로 풀었습니다. ‘참된 말을 하고 있음을’은 말의 내용이 참됨을 드러냅니다.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  english_pob_choice: so that you also may believe
  chosen_korean: 이는 여러분도 믿게 하려는 것입니다
  alternatives_korean:
  - 이는 여러분도 믿게 하시려는 것입니다
  - 그래서 여러분도 믿게 하려는 것입니다
  lexicon: BDAG
  rationale: ἵνα의 목적을 현대적 인과 목적 표현으로 옮겼고, καὶ ὑμεῖς의 포괄성을 ‘여러분도’로 살렸습니다. 현재 접속법의 지속 가능성은 본문을 과도하게 늘리지 않기 위해 본문이 아닌 각주로 처리하지 않았습니다.
theological_decisions:
- issue: ἐκεῖνος의 지시적 강조와 증언자의 정체성
  chosen_reading: ‘그 사람’으로 옮겨 지시적 강조를 살리되, 증언자가 누구인지 본문에서 특정하지 않았습니다.
  alternative_readings:
  - 그가
  - 그 증인
  rationale: 그리스어는 증언자의 신원을 명시하지 않으므로, 해석을 앞서지 않으면서도 ἐκεῖνος의 강조를 반영했습니다.
  doctrine_reference: 해석의 긴장 보존
- issue: πιστεύητε의 현재 접속법 뉘앙스
  chosen_reading: 본문은 ‘믿게 하려는 것’으로 두어 목적을 분명히 하되, 지속적 믿음의 가능성은 본문 밖에서 해석 여지를 남깁니다.
  alternative_readings:
  - 계속 믿게 하려는 것
  - 믿게 되게 하려는 것
  rationale: 요한복음의 현재 접속법은 경우에 따라 지속성을 띨 수 있으나, 여기서는 핵심 목적을 간결하게 드러내는 것이 우선입니다.
  doctrine_reference: 해석의 긴장 보존
