    rationale: ὁ ἑωρακώς는 단지 ‘본 이’이며, 이 절 자체에는 ‘그것’에 해당하는 목적어가 없습니다. 문맥적 대상의 특정은 피하는 편이 본문 충실성에 맞습니다.
  - severity: medium
    issue: ‘그의 증언은 참됩니다’가 비자연적입니다.
    rationale: 현대 표준어에서는 ‘증언은 참입니다’ 또는 ‘증언은 진실합니다’가 자연스럽습니다. 여기서는 ἀληθινή의 직접적 진술을 ‘참입니다’로 옮깁니다.
  - severity: low
    issue: 영어 POB 감사 기록의 πιστεύητε 관련 각주가 한국어 본문에 반영되어 있지 않습니다.
    rationale: 현재 접속법의 지속적 뉘앙스는 본문에서 단정하지 않되, ‘계속 믿도록’이라는 가능성을 각주로 제공하면 원문의 해석 여지를 보존할 수 있습니다.
