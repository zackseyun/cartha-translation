revisions:
- from: 그리고 그것을 본 이가 증언하였으며, 그의 증언은 참됩니다. 그 사람은 자신이 참된 말을 하고 있음을 압니다. 이는 여러분도 믿게 하려는 것입니다.
  to: 그리고 본 이가 증언하였으며, 그의 증언은 참입니다. 그 사람은 자신이 진실을 말하고 있음을 압니다. 이는 여러분도 믿게 하려는 것입니다[a].
  rationale: 원문에 없는 목적어를 제거하고, 현대 한국어에서 자연스럽지 않은 ‘참됩니다’를 ‘참입니다’로 고쳤습니다. ἐκεῖνος의 강조와 증언자의 미확정성은 ‘그 사람’으로 유지했으며, ἀληθῆ λέγει의 관용적 뜻을 ‘진실을 말하고 있음을’으로 자연스럽게 옮겼습니다. 영어 POB 감사 기록에 있는 πιστεύητε의 대안적 지속 뉘앙스도 각주와 앵커로 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:52:00Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘그것을’은 그리스어 본문에 없는 목적어를 보충하므로 삭제하는 것이 안전합니다. 또한 ἀληθινή는 ‘참입니다’가 자연스럽고 정확하며, ἀληθῆ λέγει는 ‘진실을 말하고 있음’으로 옮기는 편이 관용적 의미를 잘 반영합니다. 목적절과 ‘여러분도’의 포괄성은 유지됩니다.
  naturalness: ‘참됩니다’는 현대 표준 한국어에서 부자연스럽습니다. ‘그 사람은 자신이 참된 말을 하고 있음을 압니다’도 다소 무겁고 어색하므로, ‘그 사람은 자신이 진실을 말하고 있음을 압니다’로 다듬는 것이 자연스럽습니다.
  terminology: ‘증언’ 및 ‘믿다’는 적절합니다. 증언자의 신원을 특정하지 않고 ‘본 이’와 ‘그 사람’을 유지하여 ὁ ἑωρακώς 및 ἐκεῖνος의 지시성과 미확정성을 보존합니다. 영어 POB의 현재 접속법 관련 각주는 한국어에도 앵커와 함께 반영하는 것이 좋습니다.
  issues:
