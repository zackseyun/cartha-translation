id: JHN.19.4
reference: John 19:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
  footnotes:
  - marker: a
    text: 'Or, “I find no fault in him.” The Greek expression can be rendered more traditionally this way, but here it likely carries a specifically judicial sense: Pilate finds no valid charge or case against Jesus.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 빌라도가 다시 밖으로 나와 그들에게 말했습니다. 「보십시오, 내가 그를 여러분에게 밖으로 데려오고 있습니다. 이는 여러분이 내가 그에게서 아무런 죄목도 찾지 못한다는 것을 알게 하려는 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그에게서 아무런 허물도 찾지 못한다.’ 전통적 표현은 가능하지만, 여기서는 법정적 의미—유효한 고발 사유나 죄목이 없다는 뜻—가 더 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  english_pob_choice: went outside
  chosen_korean: 다시 밖으로 나와
  alternatives_korean:
  - 밖으로 나가
  - 나가서
  lexicon: SBLGNT + BDAG
  rationale: ἐξέρχομαι와 ἔξω의 중복은 ‘밖으로’라는 공간 이동을 분명히 하므로, 자연스러운 한국어로 ‘다시 밖으로 나와’라고 옮겼습니다.
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: BDAG
  rationale: 서술 역사적 현재는 한국어 서술문에서 자연스럽게 과거형으로 풀어 ‘말했습니다’로 옮겼습니다.
- source_word: ἄγω ... αὐτὸν ἔξω
  english_pob_choice: I am bringing him out
  chosen_korean: 그를 여러분에게 밖으로 데려오고 있습니다
  alternatives_korean:
  - 그를 밖으로 데리고 나오고 있습니다
  - 그를 밖으로 이끌고 있습니다
  lexicon: BDAG
  rationale: 여기서 ἄγω는 단순 이동이 아니라 군중 앞에 예수를 내보이는 행위를 가리키므로, ‘데려오고 있습니다’로 현재 진행의 즉시성을 살렸습니다.
- source_word: οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ
  english_pob_choice: I find no case against him
  chosen_korean: 내가 그에게서 아무런 죄목도 찾지 못한다는 것
  alternatives_korean:
  - 내가 그에게서 아무런 혐의도 찾지 못한다는 것
  - 내가 그에게서 아무런 고소 사유도 찾지 못한다는 것
  lexicon: BDAG
  rationale: αἰτία는 법정 문맥에서 ‘죄목/혐의/고발 사유’의 뜻이므로, 전통적인 ‘허물이 없다’보다 사법적 뉘앙스를 드러내는 ‘죄목’으로 옮겼습니다. ‘그에게서’는 εὑρίσκω ἐν αὐτῷ의 법적 관용을 한국어 자연문으로 풀어낸 것입니다.
theological_decisions:
- issue: 빌라도의 선언을 어떤 어조로 번역할지
  chosen_reading: 법정적 무죄 판단을 드러내는 진술로 번역했습니다.
  alternative_readings:
  - 도덕적 비난이 없다는 일반적 진술로 완화하기
  - 전통적 표현인 ‘허물이 없다’로 옮기기
  rationale: 문맥은 예수의 도덕 평가보다 빌라도의 법적 판단에 초점이 있으므로, 사법적 의미를 보존해 독자가 본문 의도를 분명히 이해하도록 했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
