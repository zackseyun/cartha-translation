id: JHN.19.11
reference: John 19:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
  footnotes:
  - marker: a
    text: Or "from heaven." The Greek says "from above," which in John often points to a divine source.
    reason: lexical_alternative
  - marker: b
    text: The one who handed Jesus over is not explicitly identified here; interpreters variously understand this as Judas, Caiaphas, or the Jewish leadership more broadly.
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그에게 대답하셨습니다. 「위에서 주어지지 않았다면, 너는 나를 향한 아무런 권한도 없었을 것입니다. 그러므로 나를 너에게 넘겨준 자가 더 큰 죄를 지었습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘로부터”. 그리스어는 “위에서”라고 말하며, 요한복음에서는 이것이 흔히 신적 근원을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 예수께 넘겨준 사람이 여기서 분명히 밝혀지지는 않습니다. 해석자들은 이를 유다, 가야바, 또는 더 넓게는 유대 지도층으로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ... Ἰησοῦς
  english_pob_choice: Jesus answered him
  chosen_korean: 예수께서 그에게 대답하셨습니다
  alternatives_korean:
  - 예수께서 그에게 응답하셨습니다
  - 예수께서 그에게 말씀하셨습니다
  lexicon: SBLGNT
  rationale: ἀπεκρίθη는 대화 응답을 분명히 나타내므로 한국어에서는 자연스러운 서술형인 “대답하셨습니다”로 옮겼습니다.
- source_word: ἐξουσίαν ... οὐδεμίαν
  english_pob_choice: authority over me at all
  chosen_korean: 나를 향한 아무런 권한도
  alternatives_korean:
  - 내게 대한 아무런 권세도
  - 나에 대한 어떤 권한도
  lexicon: BDAG
  rationale: ἐξουσία는 이 문맥에서 단순한 힘보다 법적·재판적 권한을 가리키므로 “권한”을 택했고, οὐδεμίαν의 강조는 “아무런”으로 살렸습니다.
- source_word: ἄνωθεν
  english_pob_choice: from above
  chosen_korean: 위에서
  alternatives_korean:
  - 하늘로부터
  - 위로부터
  lexicon: BDAG
  rationale: 요한복음에서 ἄνωθεν은 단순한 지리적 위치보다 신적 근원을 가리킬 수 있으므로, 본문이 허용하는 간결한 “위에서”로 두었습니다.
- source_word: παραδούς μέ σοι
  english_pob_choice: the one who handed me over to you
  chosen_korean: 나를 너에게 넘겨준 자
  alternatives_korean:
  - 나를 네게 넘겨준 사람
  - 나를 너에게 넘긴 자
  lexicon: BDAG
  rationale: παραδίδωμι의 수난 문맥상 기본 뜻인 “넘겨주다”를 살려, 특정 인물을 본문 밖에서 미리 확정하지 않도록 일반적인 표현을 유지했습니다.
- source_word: μείζονα ἁμαρτίαν
  english_pob_choice: the greater sin
  chosen_korean: 더 큰 죄
  alternatives_korean:
  - 더 큰 죄책
  - 더 중한 죄
  lexicon: BDAG
  rationale: 비교급의 의미를 자연스럽게 드러내기 위해 “더 큰 죄”로 옮겼으며, 윤리적·신학적 무게를 보존했습니다.
theological_decisions:
- issue: ἄνωθεν의 신적 기원 함의
  chosen_reading: “위에서”로 옮겨, 권한의 근원이 인간이 아니라 더 높은 차원에서 주어졌음을 드러내되, 본문이 직접 말하지 않는 추가 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - 하늘로부터
  - 하나님께로부터
  rationale: 문맥상 예수는 빌라도의 권한이 상위 근원에서 주어졌다고 말하지만, 번역은 해석을 확정하기보다 요한복음이 즐겨 쓰는 위/아래 대조를 살립니다.
  doctrine_reference: 본문이 허용하는 신적 기원 진술은 보존하되 과잉 신학화는 피합니다.
- issue: ὁ παραδούς μέ σοι의 지시 대상
  chosen_reading: 주요 본문에는 “나를 너에게 넘겨준 자”라고만 두어, 유다·가야바·유대 지도층 중 누구인지 확정하지 않았습니다.
  alternative_readings:
  - 유다
  - 가야바
  - 유대 지도자들
  rationale: 그리스어는 여기서 지시 대상을 명시하지 않으므로, 번역에서도 해석 논쟁을 해소하지 않고 열린 상태를 유지합니다.
  doctrine_reference: 본문의 의도된 모호성을 보존합니다.
