revisions:
- from: 그러므로 유대인들 가운데 많은 사람이 이 표문을 읽었습니다. 이는 예수께서 십자가에 못 박히신 곳이 도성에서 가까웠기 때문입니다. 그리고 그것은 히브리어와 라틴어와 그리스어로 적혀 있었습니다.[a]
  to: 그러므로 유대인 가운데 많은 사람이 이 글을 읽었습니다. 예수께서 십자가에 못 박히신 곳이 도시 가까이에 있었기 때문입니다. 그 글은 히브리어[a]와 라틴어와 그리스어로 적혀 있었습니다.
  rationale: 원문의 인과 관계, ‘유대인 가운데 많은 사람’이라는 부분적 표현, 예수께서 십자가에 못 박히신 장소의 도시 근접성, 그리고 세 언어의 병렬을 유지했습니다. 현대적이고 자연스러운 표준어를 위해 ‘표문’과 ‘도성’을 각각 ‘글’과 ‘도시’로 고쳤고, 아람어 가능성 각주의 연결 위치를 원어 어휘에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:52:00Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 논리 관계는 대체로 충실합니다. 다만 τίτλος는 십자가 위에 게시된 글을 뜻하므로 ‘표문’보다 일반 독자에게 자연스러운 ‘글’이 안전하며, τῆς πόλεως는 현대 표준어 ‘도시’로 옮기는 편이 적절합니다. Ἑβραϊστί의 본문 번역과 아람어 가능성을 알리는 각주는 원문 및 영어 감사 기록에 부합합니다.
  naturalness: ‘표문’과 ‘도성’은 현대 표준어 합쇼체 성경 문장에서는 다소 낯설거나 문어적입니다. ‘이 글’, ‘도시 가까이’로 고치면 게시문의 성격과 문맥을 유지하면서도 더 자연스럽습니다. 각주 표지는 해당 어휘인 ‘히브리어’ 바로 뒤에 두는 것이 참조 범위를 분명하게 합니다.
  terminology: ‘십자가에 못 박히신’, ‘히브리어’, ‘라틴어’, ‘그리스어’는 정확하고 현대적인 용어입니다. ‘히브리어’는 본문에 보존하고 ‘아람어’ 가능성은 각주에서 제시해야 합니다.
  issues:
  - severity: low
    issue: ‘표문’은 현대 한국어에서 자연스럽지 않고 의미 범위가 다소 불분명합니다.
    rationale: τίτλος는 이 문맥에서 십자가에 게시된 글/명문을 가리킵니다. ‘이 글’은 불필요한 해석을 더하지 않으면서도 자연스럽게 전달합니다.
  - severity: low
    issue: ‘도성’은 현대 표준어 번역의 평이한 문체보다 고풍스럽습니다.
    rationale: πόλις는 여기서 ‘도시’로 충분하며, ‘도시 가까이’가 원문의 위치 관계를 자연스럽게 표현합니다.
  - severity: low
    issue: 각주 표지가 언어 목록 전체 뒤에 놓여 있어 ‘히브리어’의 대안이라는 범위가 즉시 드러나지 않습니다.
    rationale: 영어 감사 기록의 각주는 Ἑβραϊστί에만 연결됩니다. 한국어에서도 ‘히브리어’ 직후에 표지를 두는 것이 적절합니다.
