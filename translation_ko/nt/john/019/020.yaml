language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
  footnotes:
  - marker: a
    text: Or possibly 'in Aramaic'; John uses 'Hebrew' for the local Semitic language.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 유대인들 가운데 많은 사람이 이 표문을 읽었습니다. 이는 예수께서 십자가에 못 박히신 곳이 도성에서 가까웠기 때문입니다. 그리고 그것은 히브리어와 라틴어와 그리스어로 적혀 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아람어’일 수 있습니다. 요한은 지역 셈어를 가리킬 때 ‘히브리어’라고 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον οὖν τὸν τίτλον
  english_pob_choice: this inscription
  chosen_korean: 이 표문
  alternatives_korean:
  - 이 비문
  - 이 글귀
  - 이 안내문
  lexicon: BDAG
  rationale: 십자가 위에 붙은 공개 문구라는 문맥을 살려, 현대 한국어에서 자연스럽고 구체적인 ‘표문’을 선택했습니다. ‘제목’은 문맥에 맞지 않고, ‘비문’은 너무 고전적이며, ‘안내문’은 기능이 약간 빗나갑니다.
- source_word: ἀνέγνωσαν
  english_pob_choice: read
  chosen_korean: 읽었습니다
  alternatives_korean:
  - 소리 내어 읽었습니다
  - 읽어 보았습니다
  lexicon: BDAG
  rationale: 단순히 게시된 글을 읽은 뜻으로 보이므로, 추가 의미를 덧붙이지 않고 평이한 ‘읽었습니다’로 옮겼습니다.
- source_word: Ἑβραϊστί
  english_pob_choice: in Hebrew
  chosen_korean: 히브리어
  alternatives_korean:
  - 아람어
  - 히브리 말
  lexicon: BDAG
  rationale: 본문의 표면적 표현을 따라 ‘히브리어’로 두었습니다. 요한복음의 용례가 현지 셈어를 가리킬 수 있다는 점은 본문에 밀어 넣지 않고 각주 처리하는 편이 더 투명합니다.
- source_word: Ῥωμαϊστί
  english_pob_choice: in Latin
  chosen_korean: 라틴어
  alternatives_korean:
  - 로마말로
  - 로마어로
  lexicon: BDAG
  rationale: 문자 그대로는 ‘로마식으로’에 가깝지만, 실제 언어 지칭은 라틴어이므로 현대 한국어 독자가 바로 이해할 수 있는 ‘라틴어’를 선택했습니다.
- source_word: Ἑλληνιστί
  english_pob_choice: in Greek
  chosen_korean: 그리스어
  alternatives_korean:
  - 헬라어
  lexicon: BDAG
  rationale: 세 언어의 병렬을 현대 표준어로 균형 있게 맞추기 위해 ‘그리스어’로 옮겼습니다. 기존 교회용 어휘인 ‘헬라어’도 가능하지만, 여기서는 일관된 언어명 표기를 택했습니다.
theological_decisions:
- issue: Ἑβραϊστί의 의미를 본문에 어떻게 둘 것인가
  chosen_reading: 본문에는 ‘히브리어’로 두고, 가능한 대안 의미는 각주로 보충합니다.
  alternative_readings:
  - 아람어
  rationale: 그리스어 본문이 실제로 ‘히브리어’라고 말하므로, 주본문은 원문을 우선 따릅니다. 다만 요한의 용례가 지역 셈어를 가리킬 수 있다는 해석 가능성도 있으므로, 그 긴장은 각주에서 유지합니다.
  doctrine_reference: Translation philosophy §1, §3
