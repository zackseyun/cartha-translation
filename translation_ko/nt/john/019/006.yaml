  to: 그러자 대제사장들과 경비원들이 그를 보고 외쳤습니다. 「십자가에 못 박으시오! 십자가에 못 박으시오!」 빌라도가 그들에게 말했습니다. 「너희가[a] 그를 데려가서 십자가에 못 박으시오. 나는 그에게서 아무 죄목도[b] 찾지 못합니다.」
