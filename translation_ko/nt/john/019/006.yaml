id: JHN.19.6
reference: John 19:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
  footnotes:
  - marker: a
    text: Or, “Take him yourselves and crucify him.” The Greek explicitly includes “you,” adding emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or, “I find no fault in him.” The Greek term can mean a legal charge or basis for accusation; here the judicial sense is primary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 대제사장들과 하인들이 그를 보고 소리쳤습니다. 「십자가에 못 박으시오! 십자가에 못 박으시오!」 빌라도가 그들에게 말했습니다. 「너희가 그를 데려다가 십자가에 못 박으시오. 나는 그에게서 아무런 혐의를 찾지 못하겠습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희가 그를 데려다가 십자가에 못 박으시오’는 헬라어의 ὑμεῖς(너희가)를 강조적으로 살린 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘혐의’는 여기서 ‘죄목’이나 ‘기소할 근거’에 가까운 법정 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  english_pob_choice: chief priests
  chosen_korean: 대제사장들
  alternatives_korean:
  - 수제사장들
  - 우두머리 제사장들
  lexicon: BDAG
  rationale: 복수형으로 나온 성전 지도층을 자연스럽게 가리키는 표준어는 ‘대제사장들’이며, 한국어 성경 관용과도 맞습니다.
- source_word: ὑπηρέται
  english_pob_choice: officers
  chosen_korean: 하인들
  alternatives_korean:
  - 경비병들
  - 부하들
  - 관리들
  lexicon: BDAG
  rationale: 이 본문에서는 유대 지도자들에게 딸린 하급 수행원/심부름꾼의 뉘앙스가 강하므로, 과도하게 군사·공권력화하지 않는 ‘하인들’이 가장 중립적입니다.
- source_word: Σταύρωσον σταύρωσον
  english_pob_choice: Crucify him! Crucify him!
  chosen_korean: 십자가에 못 박으시오! 십자가에 못 박으시오!
  alternatives_korean:
  - 십자가형에 처하시오! 십자가형에 처하시오!
  - 그를 십자가에 못 박으시오! 그를 십자가에 못 박으시오!
  lexicon: BDAG
  rationale: 동사의 직접명령을 살리면서도 한국어에서 자연스럽고 공개적 구호의 긴박감을 전달하는 표현으로 옮겼습니다. 반복도 그대로 보존했습니다.
- source_word: αἰτίαν
  english_pob_choice: charge
  chosen_korean: 혐의
  alternatives_korean:
  - 죄목
  - 죄
  - 사유
  lexicon: BDAG
  rationale: 법정 맥락에서 αἰτία는 ‘기소할 만한 근거/혐의’의 뜻이므로, 전통적이지만 다소 추상적인 ‘죄’보다 ‘혐의’가 더 직접적입니다.
theological_decisions:
- issue: 빌라도의 무죄 판정의 법정적 성격
  chosen_reading: 나는 그에게서 아무런 혐의를 찾지 못하겠습니다.
  alternative_readings:
  - 나는 그에게서 아무런 잘못도 찾지 못하겠습니다.
  - 나는 그에게서 아무런 죄목도 찾지 못하겠습니다.
  rationale: 이 절은 신학적 선언이라기보다 재판관의 법정 판단이므로, αἰτία의 법적 의미를 살려 예수의 무죄를 재판 맥락 안에서 드러냈습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
