review_pass:
  verdict: revise
  source_fidelity: ‘대답했습니다’는 ἀπεκρίθη를 정확히 옮기고, ‘빌라도’도 통용 표기입니다. 그러나 현행 인용문의 ‘내가 쓴 것은, 내가 썼습니다’는 두 번째 ‘썼습니다’의 목적어가 생략되어 한국어 문장으로 어색하며, 반복된 γέγραφα를 안정적으로 재현하지 못합니다.
  naturalness: 현대 표준어 합쇼체에서는 ‘내가 쓴 것은 내가 쓴 것입니다’가 자연스럽고, 원문의 반복과 단호한 어조를 유지합니다. 인용문 안의 불필요한 쉼표는 제거하는 것이 좋습니다.
  terminology: ‘빌라도’, ‘대답했습니다’, ‘썼습니다/쓴 것’은 문맥과 현대 성서 한국어에 적절합니다. 완료형의 지속 결과는 한국어 단순 과거·관형 구성만으로 완전히 문법화되지는 않으므로, 본문에서는 반복을 보존하고 각주에서 그 뉘앙스를 설명하는 편이 안전합니다.
