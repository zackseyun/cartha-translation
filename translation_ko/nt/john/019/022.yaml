translation:
  language: ko
  text: 빌라도가 대답했습니다. 「내가 쓴 것은, 내가 썼습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「내가 쓴 것을 나는 썼습니다」. 그리스어는 두 번의 완료형을 사용하여, 빌라도가 써 놓은 것이 그대로 굳어졌다는 최종성을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  english_pob_choice: answered
  chosen_korean: 대답했습니다
  alternatives_korean:
  - 답했습니다
  - 응답했습니다
  lexicon: BDAG
  rationale: 서술 대화에서의 aorist deponent ἀποκρίνομαι를 자연스러운 현대 한국어로 옮기되, 문맥상 단순한 회신보다 직접적인 반응인 ‘대답했습니다’가 가장 무난합니다.
- source_word: ὁ Πιλᾶτος
  english_pob_choice: Pilate
  chosen_korean: 빌라도가
  alternatives_korean:
  - 빌라도
  - 총독 빌라도가
  lexicon: BDAG
  rationale: 그리스어 정관사 포함된 주어를 한국어 서술문에서는 조사로 처리하고, 통용되는 성서 인명 표기 ‘빌라도’를 사용했습니다.
- source_word: Ὃ γέγραφα γέγραφα
  english_pob_choice: What I have written, I have written.
  chosen_korean: 내가 쓴 것은, 내가 썼습니다
  alternatives_korean:
  - 내가 기록한 것은, 내가 기록했습니다
  - 내가 쓴 것은, 내가 썼소
  lexicon: BDAG
  rationale: 반복되는 완전한 문장 구조와 종결성을 살리기 위해 앞뒤를 같은 틀로 맞췄고, 영어 POB의 현재완료 뉘앙스를 한국어에서는 완료·확정의 의미가 드러나는 과거형 반복으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 반복된 완료형의 종결성과 번복 불가성
  chosen_reading: 같은 문장을 두 번 반복해 빌라도의 수정 불가 선언을 드러냈습니다.
  alternative_readings:
  - 한 번만 번역해 의미를 완화하는 방식
  - '''써 두었다''처럼 상태 중심으로 옮기는 방식'
  rationale: 그리스어의 두 번 반복된 완전형은 단순한 과거 사실보다 ‘이미 써 놓았고 그대로다’라는 확정성을 강조하므로, 한국어에서도 반복 구조를 유지해 그 종결성을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5, §6
