  rationale: 반복되는 완전한 문장 구조와 종결성을 살리기 위해 앞뒤를 같은 틀로 맞췄고, 영어 POB의 현재완료 뉘앙스를 한국어에서는 완료·확정의 의미가 드러나는 과거형 반복으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 반복된 완료형의 종결성과 번복 불가성
  chosen_reading: 같은 문장을 두 번 반복해 빌라도의 수정 불가 선언을 드러냈습니다.
  alternative_readings:
  - 한 번만 번역해 의미를 완화하는 방식
  - '''써 두었다''처럼 상태 중심으로 옮기는 방식'
  rationale: 그리스어의 두 번 반복된 완전형은 단순한 과거 사실보다 ‘이미 써 놓았고 그대로다’라는 확정성을 강조하므로, 한국어에서도 반복 구조를 유지해 그 종결성을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5, §6
