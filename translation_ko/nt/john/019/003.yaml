base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
  footnotes:
  - marker: a
    text: Or “they kept coming up to him and saying,” reflecting the Greek imperfect verbs.
    reason: lexical_alternative
  - marker: b
    text: Or “they gave him slaps” / “they slapped him.” The Greek expression is literally “they were giving him blows.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그에게 계속 다가와 「유대인의 왕이여, 만세!」라고 말하고, 그의 뺨을 때리고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 그에게 다가와서 계속 말했습니다.” 그리스어의 미완료 시제들은 반복되거나 지속되는 동작을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그에게 손바닥질을 하고 있었습니다” / “그를 때리고 있었습니다.” 그리스어 표현은 문자적으로 “그에게 타격들을 주고 있었습니다”에 가깝습니다.
    reason: lexical_alternative
