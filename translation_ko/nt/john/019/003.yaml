  text: καὶ ⸂ἤρχοντο πρὸς αὐτὸν καὶ⸃ ἔλεγον· Χαῖρε, ὁ βασιλεὺς τῶν Ἰουδαίων· καὶ ἐδίδοσαν αὐτῷ ῥαπίσματα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
  footnotes:
  - marker: a
    text: Or “they kept coming up to him and saying,” reflecting the Greek imperfect verbs.
    reason: lexical_alternative
  - marker: b
    text: Or “they gave him slaps” / “they slapped him.” The Greek expression is literally “they were giving him blows.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그에게 다가와 「유대인의 왕이여, 만세!」라고 말하고, 그를 계속 때렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 그에게 계속 다가가며 말했습니다.” 그리스어 미완료 시제가 반복적 동작을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그를 뺨치고 있었습니다” / “그에게 손바닥질을 하고 있었습니다.” 그리스어 표현은 문자적으로는 “그에게 타격들을 주고 있었습니다”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν
  english_pob_choice: they came up to him
  chosen_korean: 그들은 그에게 다가와
  alternatives_korean:
  - 그에게 왔습니다
  - 그에게 가까이 다가왔습니다
  - 그에게 계속 다가와
  lexicon: BDAG
  rationale: 미완료 시제의 반복·지속적 접근을 살리면서도 한국어 문장으로 자연스럽게 옮기기 위해 ‘다가와’를 택했습니다.
- source_word: Χαῖρε
  english_pob_choice: Hail
  chosen_korean: 만세
  alternatives_korean:
  - 안녕하시오
  - 경하하라
  - 문안드립니다
  lexicon: BDAG
  rationale: 왕에게 보내는 형식적 환호를 유지하되, 본문 전체의 조롱을 드러내는 말로 한국어에서 가장 직접적인 호응 표현은 ‘만세’입니다.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  english_pob_choice: King of the Jews
  chosen_korean: 유대인의 왕
  alternatives_korean:
  - 유대인들의 왕
  - 유대인의 임금
  - 유대인의 왕이시여
  lexicon: BDAG
  rationale: 정치적·메시아적 칭호를 약화하지 않도록 직역에 가깝게 ‘유대인의 왕’으로 옮겼습니다.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  english_pob_choice: they were slapping him
  chosen_korean: 그를 계속 때렸습니다
  alternatives_korean:
  - 그를 때리고 있었습니다
  - 그에게 손바닥을 날렸습니다
  - 그를 뺨치고 있었습니다
  lexicon: BDAG
  rationale: ῥαπίσματα의 손바닥질/매질 의미와 반복적 뉘앙스를 포괄하면서, 한국어에서 지나치게 구체적이거나 어색한 표현을 피하기 위해 ‘계속 때렸습니다’로 처리했습니다.
theological_decisions:
- issue: Χαῖρε의 조롱적 왕실 환호성
  chosen_reading: 형식상 환호를 살리되, 문맥상 조롱이 드러나는 「만세」로 옮겼습니다.
  alternative_readings:
  - 중립적인 「안녕하시오」
  - 직역에 가까운 「기뻐하라」
  rationale: 수난 서사의 문맥상 이 인사는 존중이 아니라 조롱이므로, 왕권을 비꼬는 뉘앙스를 유지하는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve meaning in context'
