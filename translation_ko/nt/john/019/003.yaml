  verdict: revise
  source_fidelity: 원문의 세 미완료 시제(다가오다, 말하다, ῥαπίσματα를 가하다)는 조롱과 폭행이 반복·지속되었음을 나타냅니다. 현 번역은 마지막 동작에만 ‘계속’을 명시하고, 첫 두 동작의 반복성은 각주에만 남겨 두었습니다. 본문에서 ‘계속 다가와’로 이를 더 직접적으로 반영하는 것이 안전합니다. ῥαπίσματα는 일반적인 ‘때림’보다 손으로 가하는 뺨 때림/손바닥질에 가까우므로, 본문은 자연스러운 ‘뺨을 때리고 있었습니다’로 옮깁니다.
  naturalness: ‘그들은 그에게 계속 다가와 … 말하고, 그의 뺨을 때리고 있었습니다’는 현대 표준 한국어 합쇼체 문맥에서 자연스럽고, 조롱의 반복 장면을 명료하게 전달합니다. ‘유대인의 왕이여, 만세!’도 왕에게 하는 형식적 환호를 재현하며 문맥상 조롱으로 읽힙니다.
  terminology: ‘유대인의 왕’은 τίτλος를 충실히 보존합니다. Χαῖρε는 이 문맥에서 ‘만세!’로 적절합니다. ῥαπίσματα는 ‘뺨을 때리다’로 옮겨 손으로 가하는 모욕적 타격이라는 어휘의 통상적 의미를 반영하되, 각주에서 더 넓은 ‘손바닥질’ 가능성을 제시합니다.
