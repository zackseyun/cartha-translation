  source_fidelity: 대체로 충실합니다. 다만 Ἆρον ἆρον은 이 문맥에서 예수를 ‘치워/데려가라’는 반복 외침이며, ‘없애시오’는 한국어에서 죽이거나 제거하라는 뜻을 독립적으로 더 강하게 암시할 수 있습니다. 뒤이은 십자가형 요구가 그 폭력성을 충분히 드러내므로, 앞 구호는 제거·배제의 요구로 옮기는 편이 원문의 표현 범위에 더 가깝습니다.
  naturalness: ‘-으시오’와 ‘-으랴?’는 오늘날의 표준 현대 합쇼체에서는 다소 문어적·고풍스럽습니다. ‘-으십시오’와 ‘-겠습니까?’가 자연스러운 현대 정중체입니다.
  terminology: ‘십자가에 못 박다’, ‘대제사장들’, ‘가이사’, ‘왕’은 적절합니다. 각주에 제시된 문구는 단순한 어순 변이일 뿐 의미 있는 어휘 대안이 아니므로 유지할 필요가 없습니다.
  issues:
  - severity: medium
    issue: ‘없애시오, 없애시오’
    rationale: Ἆρον ἆρον의 문맥상 강한 배제 요구는 보존해야 하나, ‘없애다’는 한국어에서 ‘죽여 없애다’라는 의미를 선행하여 암시할 수 있습니다. ‘치워 버리십시오’는 반복된 제거 요구와 문맥상의 적대성을 유지하면서도 다음 명령과의 구별을 보존합니다.
