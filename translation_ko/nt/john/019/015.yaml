id: JHN.19.15
reference: John 19:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
  footnotes:
  - marker: a
    text: Or, “We have no king but Caesar.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 사람들이 소리쳤습니다. 「치워 버리십시오, 치워 버리십시오! 그를 십자가에 못 박으십시오!」 빌라도가 그들에게 말했습니다. 「내가 너희 왕을 십자가에 못 박겠습니까?」 대제사장들이 대답했습니다. 「우리에게는 가이사 외에는 왕이 없습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  english_pob_choice: So they cried out
  chosen_korean: 그러자 그 사람들이 소리쳤습니다
  alternatives_korean:
  - 그래서 그들이 외쳤습니다
  - 그러자 그들이 외쳤습니다
  lexicon: BDAG
  rationale: οὖν은 앞뒤 사건의 흐름을 잇는 말이라 ‘그러자’로 자연스럽게 살렸고, ἐκραύγασαν은 단순한 말하기보다 큰 소리의 외침이어서 ‘소리쳤습니다’가 적절합니다.
- source_word: Ἆρον ἆρον
  english_pob_choice: Away, away!
  chosen_korean: 없애시오, 없애시오
  alternatives_korean:
  - 데려가시오, 데려가시오
  - 치워 버리시오, 치워 버리시오
  lexicon: BDAG
  rationale: 반복 명령은 제거·배제를 요구하는 군중의 구호이므로, 한국어에서는 대상 생략형보다 직접적인 명령으로 ‘없애시오’를 택해 본문의 적대성과 긴박감을 살렸습니다.
- source_word: σταύρωσον αὐτόν
  english_pob_choice: Crucify him
  chosen_korean: 그를 십자가에 못 박으시오
  alternatives_korean:
  - 그를 십자가형에 처하시오
  - 그를 못 박으시오
  lexicon: BDAG
  rationale: σταυρόω는 로마 처형 맥락의 표준어인 ‘십자가에 못 박다’가 가장 정확하며, 공손한 체로 명령형을 맞추어 군중의 요구를 반영했습니다.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  english_pob_choice: We have no king except Caesar
  chosen_korean: 우리에게는 가이사 외에는 왕이 없습니다
  alternatives_korean:
  - 우리에게는 가이사 말고는 왕이 없습니다
  - 우리는 가이사 외에는 왕이 없습니다
  lexicon: BDAG
  rationale: εἰ μὴ는 배타적 예외를 나타내므로 ‘외에는’으로 옮겼고, βασιλέα는 왕권 주장 전체를 드러내는 말로서 그대로 ‘왕’으로 옮겼습니다.
theological_decisions:
- issue: 대제사장들의 최종 정치·신학적 선언의 뉘앙스
  chosen_reading: ‘우리에게는 가이사 외에는 왕이 없습니다’로 옮겨, 예수의 왕권을 사실상 부정하는 충돌을 흐리지 않았습니다.
  alternative_readings:
  - ‘가이사 말고는 우리에게 왕이 없습니다’
  - ‘우리는 가이사만을 왕으로 둡니다’
  rationale: 본문은 단순한 정치적 충성 맹세를 넘어 메시아 왕권에 대한 거부를 드러내므로, 배타성을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 본문의 긴장을 해소하지 않고 그대로 보존
- issue: 아라미즘적 군중 구호의 직설성
  chosen_reading: ‘없애시오, 없애시오!’를 사용해 단순한 이동 요청이 아니라 처형 요구의 폭력을 드러냈습니다.
  alternative_readings:
  - ‘데려가시오, 데려가시오!’
  - ‘치워 버리시오, 치워 버리시오!’
  rationale: Ἆρον ἆρον은 상황상 ‘데려가라’보다 ‘제거하라’는 의미가 강하게 작동하므로, 한국어에서도 그 폭력성을 분명히 드러내는 쪽이 본문에 더 가깝습니다.
  doctrine_reference: 본문의 수사적 강도 유지
