    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο γὰρ ταῦτα
  english_pob_choice: For these things happened
  chosen_korean: 이 일이 일어난 것은
  alternatives_korean:
  - 이 일들이 일어난 것은
  - 이런 일들이 생긴 것은
  lexicon: BDAG
  rationale: 앞선 사건들을 가리키는 설명 연결이므로, 자연스러운 현대 문장으로 사건성을 살린 ‘이 일이 일어난 것은’으로 옮겼습니다.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  english_pob_choice: so that the Scripture might be fulfilled
  chosen_korean: 성경이 이루어지게 하려는 것이었습니다
  alternatives_korean:
  - 성경이 성취되게 하려는 것이었습니다
  - 성경이 이루어질 수 있도록 한 것이었습니다
  lexicon: BDAG
  rationale: ἵνα-절의 목적/결과 의미를 반영하되, 요한복음의 공통 표현에 맞춰 ‘성경이 이루어지다’로 간명하게 옮겼습니다.
- source_word: Ὀστοῦν
  english_pob_choice: bone
  chosen_korean: 뼈 하나
  alternatives_korean:
  - 뼈
  - 한 뼈
  lexicon: BDAG
  rationale: 헬라어 단수는 인용문 안에서 집합적 의미를 가지므로, 영어 POB의 해석을 따라 한국어에서는 ‘하나도’로 자연스럽게 집합성을 드러냈습니다.
- source_word: οὐ συντριβήσεται αὐτοῦ
  english_pob_choice: Not one of his bones will be broken
  chosen_korean: 그의 뼈 하나도 부러지지 않을 것입니다
  alternatives_korean:
  - 그의 뼈가 하나도 꺾이지 않을 것입니다
  - 그의 뼈 하나도 꺾이지 않을 것입니다
  lexicon: BDAG
  rationale: συντρίβω는 문맥상 뼈가 ‘부러지다’라는 뜻이 가장 분명하므로, 전통적 교회용어보다 본문 의미를 직접 드러내는 ‘부러지다’를 선택했습니다.
theological_decisions:
- issue: 성경 인용의 집합적 단수 표현을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘그의 뼈 하나도 부러지지 않을 것입니다’로 옮겨, 단수 인용이지만 전체 뼈를 가리키는 집합적 의미를 살렸습니다.
  alternative_readings:
  - ‘그의 뼈는 하나도 부러지지 않을 것입니다’
  - ‘그의 뼈가 하나도 꺾이지 않을 것입니다’
  rationale: 출애굽기/민수기/시편의 인용을 염두에 둔 요한의 성취 진술이므로, 문자적 단수보다 의미 전달을 우선하되 예언 성취의 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; OT fulfillment citation'
- issue: ‘이루어지다’의 신학적 함의
  chosen_reading: ‘성경이 이루어지게 하려는 것’으로 번역해, 성경의 성취가 사건의 목적이라는 요한의 신학을 그대로 살렸습니다.
  alternative_readings:
  - ‘성경이 성취되게 하려는 것’
  - ‘성경이 완성되게 하려는 것’
  rationale: 본문은 단순한 우연이 아니라 성경의 성취를 드러내므로, 목적절을 약화시키지 않고 직접적으로 표현했습니다.
  doctrine_reference: Johannine fulfillment motif
