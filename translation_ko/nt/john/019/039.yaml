revisions:
- from: 니고데모도 — 곧 밤에 처음 그분께 왔던 그 사람도 — 몰약과 알로에를 섞은 것 약 백 리트라를 가지고 왔습니다.[a][b]
  to: 니고데모도 왔습니다. 그는 처음에 밤에 예수께 왔던 사람인데[b], 몰약과 알로에의 혼합물을 약 백 리트라[a] 가지고 왔습니다.
  rationale: The revision removes the unsupported and awkward second additive particle, renders the appositional identification in idiomatic Korean prose, preserves the temporal nuance of τὸ πρῶτον with ‘처음에,’ and places each footnote marker at the phrase it explains. Naming Jesus in the retrospective clause makes the Korean referent explicit without altering the narrative sense.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:52:01Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the additive arrival, the retrospective identification of Nicodemus, the aromatic mixture, and the approximate quantity. However, the repeated additive particle (‘니고데모도 … 그 사람도’) is not supported by the Greek and makes the identification clause sound as though it introduces another person. The source’s τὸ πρῶτον is better represented as ‘처음에’ in the retrospective clause, and the footnote anchor for that clause should occur there rather than at the end of the verse.
  naturalness: The current parenthetical construction is cumbersome, especially with the duplicated ‘도.’ A two-sentence rendering is natural in modern formal Korean and retains the appositional identification without ambiguity. ‘되살립니다’ in footnote b is less idiomatic here than ‘상기시킵니다.’
  terminology: ‘몰약,’ ‘알로에,’ and ‘리트라’ are suitable. ‘혼합물’ is a direct and natural rendering of μίγμα. The cultural note accurately explains the Roman unit and its approximate modern equivalent.
  issues:
  - severity: medium
    issue: 'The text repeats the additive marker: ‘니고데모도 — … 그 사람도 —’.'
    rationale: καί adds Nicodemus to the participants, while the article-plus-participle identifies Nicodemus appositionally; it does not add a second ‘also.’ The repetition is unnatural and can momentarily imply two persons.
  - severity: low
    issue: Footnote b is anchored at the end rather than at the identifying clause, and its wording is unnatural.
    rationale: The note concerns the allusion in ‘밤에 … 왔던 사람,’ so its marker should be attached there. ‘요한복음 3:1–2를 상기시킵니다’ is idiomatic modern Korean.
  revised_text: 니고데모도 왔습니다. 그는 처음에 밤에 예수께 왔던 사람인데[b], 몰약과 알로에의 혼합물을 약 백 리트라[a] 가지고 왔습니다.
  revised_footnotes:
  - marker: a
    text: 리트라는 로마 파운드로, 대략 327그램이며, ‘약 백 리트라’는 약 32–33킬로그램(약 72파운드)입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘이전에 밤에 예수께 왔던 사람’—요한복음 3:1–2를 상기시킵니다.
    reason: cross_reference
  revision_rationale: The revision removes the unsupported and awkward second additive particle, renders the appositional identification in idiomatic Korean prose, preserves the temporal nuance of τὸ πρῶτον with ‘처음에,’ and places each footnote marker at the phrase it explains. Naming Jesus in the retrospective clause makes the Korean referent explicit without altering the narrative sense.
