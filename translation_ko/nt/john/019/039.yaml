id: JHN.19.39
reference: John 19:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
  footnotes:
  - marker: a
    text: A litra was a Roman pound, roughly 327 grams; 'about a hundred litras' is approximately 32–33 kilograms (around 72 pounds).
    reason: cultural_note
  - marker: b
    text: Or 'who had earlier come to him by night,' recalling John 3:1–2.
    reason: cross_reference
translation:
  language: ko
  text: 니고데모도 왔습니다. 그는 처음에 밤에 예수께 왔던 사람인데[b], 몰약과 알로에의 혼합물을 약 백 리트라[a] 가지고 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 리트라는 로마 파운드로, 대략 327그램이며, ‘약 백 리트라’는 약 32–33킬로그램(약 72파운드)입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘이전에 밤에 예수께 왔던 사람’—요한복음 3:1–2를 상기시킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  english_pob_choice: also came
  chosen_korean: 도 … 가지고 왔습니다
  alternatives_korean:
  - 또 왔습니다
  - 그리고 또한 왔습니다
  lexicon: BDAG
  rationale: δὲ와 καὶ의 덧붙이는 흐름을 한국어에서는 인물 추가를 나타내는 ‘도’와 서술의 자연스러운 진행으로 살렸습니다.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  english_pob_choice: the one who had first come to him at night
  chosen_korean: 곧 밤에 처음 그분께 왔던 그 사람
  alternatives_korean:
  - 밤에 먼저 그분께 왔던 사람
  - 이전에 밤에 그분께 왔던 사람
  lexicon: BDAG
  rationale: 분사구는 니고데모를 식별하는 삽입 설명이므로 ‘그 사람’으로 풀어 주고, τὸ πρῶτον의 회고적 의미를 ‘처음’으로 반영했습니다.
- source_word: αὐτόν
  english_pob_choice: him
  chosen_korean: 그분
  alternatives_korean:
  - 그에게
  - 예수께
  lexicon: NT narrative context
  rationale: 요한복음 3장의 야간 방문을 가리키므로, 문맥상 예수님을 가리키는 ‘그분’으로 자연스럽게 연결했습니다.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  english_pob_choice: a mixture of myrrh and aloes
  chosen_korean: 몰약과 알로에를 섞은 것
  alternatives_korean:
  - 몰약과 침향을 섞은 것
  - 몰약과 알로에의 혼합물
  lexicon: BDAG
  rationale: μίγμα의 ‘혼합’ 의미를 동사구보다 명사구로 자연스럽게 옮기되, 장례용 향료라는 기능이 드러나도록 했습니다. ἀλόη는 여기서 식물 일반이 아니라 향료 성분으로 이해했습니다.
- source_word: ὡς λίτρας ἑκατόν
  english_pob_choice: about a hundred litras
  chosen_korean: 약 백 리트라
  alternatives_korean:
  - 대략 백 리트라
  - 약 백 파운드
  lexicon: BDAG
  rationale: ὡς의 근사값을 ‘약’으로 살리고, λίτρα를 고대 도량형으로 음역해 본문의 투명성을 유지했습니다.
theological_decisions:
- issue: 야간 방문 회고의 기능
  chosen_reading: ‘밤에 처음 그분께 왔던’은 요한복음 3:1–2를 환기하는 회고적 식별구입니다.
  alternative_readings:
  - 단순히 밤에 방문했던 사람
  - 첫 번째로 밤에 온 사람
  rationale: 본문은 니고데모의 신원을 재언급하면서 이전 대화를 떠올리게 하므로, 그 연결을 드러내되 의미를 과장하지 않았습니다.
  doctrine_reference: 요한복음 3:1–2, 19:39 문맥
