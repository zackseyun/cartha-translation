id: JHN.19.7
reference: John 19:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
  footnotes:
  - marker: a
    text: Or, “according to the law.” The Greek repeats “law,” with the second occurrence referring back to the first.
    reason: lexical_alternative
  - marker: b
    text: Or, “because he made himself God’s Son.”
    reason: lexical_alternative
translation:
  language: ko
  text: 유대인들이 그에게 대답했습니다. 「우리는 율법이 있습니다. 그리고 그 율법에 따르면 그는 죽어야 합니다. 그가 자신을 하나님의 아들로 만들었기 때문입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 둘째 ‘율법’은 첫째 ‘율법’을 되받는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그는 죽을 의무가 있습니다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  english_pob_choice: The Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대 지도자들
  - 유대 사람들
  lexicon: BDAG
  rationale: 공동체 전체를 가리키는 형태를 그대로 살리되, 현대 한국어에서는 직역형보다 인칭적 집단명사인 ‘유대인들’이 가장 직접적입니다.
- source_word: νόμον ἔχομεν, καὶ κατὰ τὸν νόμον
  english_pob_choice: We have a law, and according to that law
  chosen_korean: 우리는 율법이 있습니다. 그리고 그 율법에 따르면
  alternatives_korean:
  - 우리는 법이 있습니다. 그리고 그 법에 따르면
  - 우리는 율법을 가지고 있습니다. 그리고 율법에 따라
  lexicon: BDAG
  rationale: 첫 νόμον과 둘째 νόμον의 반복을 살려 둘 다 ‘율법’으로 옮기고, 두 번째는 지시어 ‘그’로 앞선 항목을 가리키게 해 원문의 되풀이를 반영했습니다.
- source_word: ὀφείλει ἀποθανεῖν
  english_pob_choice: he ought to die
  chosen_korean: 그는 죽어야 합니다
  alternatives_korean:
  - 그는 죽을 의무가 있습니다
  - 그는 반드시 죽어야 합니다
  lexicon: BDAG
  rationale: ὀφείλει의 의무·당위성을 한국어에서 자연스럽게 드러내되, 과도하게 단정적인 표현은 피했습니다.
- source_word: υἱὸν θεοῦ
  english_pob_choice: the Son of God
  chosen_korean: 하나님의 아들
  alternatives_korean:
  - 하나님의 아들로
  - 하나님의 아들
  lexicon: BDAG
  rationale: 요한복음의 핵심 기독론 용어이지만, 이 구절은 적대자들의 고발을 직접 전하는 문맥이므로 한국어에서는 자연스러운 칭호형인 ‘하나님의 아들’로 옮겼습니다.
theological_decisions:
- issue: υἱὸν θεοῦ를 유죄 주장 맥락에서 어떻게 처리할지
  chosen_reading: ‘하나님의 아들’로 옮겨, 독자가 예수에 대한 고발 내용 자체를 그대로 듣게 합니다.
  alternative_readings:
  - ‘하나님의 아들’ 대신 ‘하나님의 아들’
  - ‘하나님의 아들’ 대신 ‘한 아들’
  rationale: 본문은 예수의 신적 아들됨에 대한 적대적 진술을 보존해야 하므로, 이를 일반화하거나 약화하지 않았습니다.
  doctrine_reference: 'Translation philosophy: preserve tension in hostile accusation; Nicene Christology'
