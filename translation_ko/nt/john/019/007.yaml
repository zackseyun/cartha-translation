    issue: ἑαυτὸν ἐποίησεν의 한국어 표현
    rationale: ‘자신을 하나님의 아들로 만들었다’는 한국어에서 자기 자신을 실제로 만들어 변화시켰다는 뜻을 낳을 수 있습니다. 여기서는 상대자들이 예수께서 자신을 하나님의 아들이라고 주장하셨다고 고발하는 뜻이므로, ‘하나님의 아들이라고 하였다’ 또는 ‘하나님의 아들로 자처하였다’가 문맥상 정확하고 자연스럽습니다.
