revisions:
- from: 그러므로 유대인들은, 준비일이어서 시체들이 안식일에 십자가 위에 남아 있지 않게 하려고 — 그 안식일은 큰 날이었기 때문입니다 — 빌라도에게 그들의 다리를 꺾고 내려 달라고 요청했습니다.[a][b][c][d]
  to: 그러므로 유대인들은[c] 준비일이어서[a] 시체들이 안식일에 십자가에 남아 있지 않게 하려고, 그 안식일이 큰 날이었기 때문에[b], 빌라도에게 그들의 다리를 꺾고 시체들을 치워 달라고[d] 요청했습니다.
  rationale: 시체들의 제거를 명시하여 두 병렬 요청을 원문대로 분명히 했습니다. ἀρθῶσιν의 넓은 ‘제거하다’ 의미는 본문의 ‘치워 달라고’로 유지하고, 십자가에서의 제거라는 문맥적 대안은 각주에 두었습니다. 각주 표지도 해당 어구에 각각 배치했습니다.
