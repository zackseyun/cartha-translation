id: JHN.19.31
reference: John 19:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
  footnotes:
  - marker: a
    text: Or 'Preparation Day.' The term refers to the day of preparation before the Sabbath.
    reason: lexical_alternative
  - marker: b
    text: Or 'for that Sabbath was a high day,' meaning an especially significant Sabbath.
    reason: alternative_reading
  - marker: c
    text: '''The Jews'' could in Johannine context sometimes refer more specifically to the Judean authorities or leaders.'
    reason: alternative_reading
  - marker: d
    text: Or 'and removed' or 'and taken down.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 유대인들은, 준비일이어서 시체들이 안식일에 십자가 위에 남아 있지 않게 하려고 — 그 안식일은 큰 날이었기 때문입니다 — 빌라도에게 그들의 다리를 꺾고 내려 달라고 요청했습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘준비일’은 안식일 전날 준비를 가리키는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 날’은 전통적으로 ‘높은 날’로 옮기기도 합니다.
    reason: alternative_reading
  - marker: c
    text: 요한복음에서 ‘유대인들’은 때로 유대 지도자들을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘내려 달라고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  english_pob_choice: Therefore the Jews
  chosen_korean: 그러므로 유대인들은
  alternatives_korean:
  - 그리하여 유대인들은
  - 그러므로 유다인들은
  - 그러므로 유대 지도자들은
  lexicon: BDAG
  rationale: οὖν의 추론적 연결을 살려 ‘그러므로’로 옮기고, Ἰουδαῖοι는 본문이 직접 좁혀 말하지 않으므로 덜 해석적인 기본 번역을 택했습니다.
- source_word: ἐπεὶ παρασκευὴ ἦν
  english_pob_choice: because it was the day of preparation
  chosen_korean: 준비일이어서
  alternatives_korean:
  - 준비일이었기 때문에
  - 안식일 준비일이어서
  - 준비일이므로
  lexicon: BDAG
  rationale: παρασκευή를 안식일 전 ‘준비일’로 풀어, 현대 한국어 독자가 즉시 이해할 수 있게 했습니다.
- source_word: ἠρώτησαν τὸν Πιλᾶτον ἵνα ... καὶ ἀρθῶσιν
  english_pob_choice: asked Pilate ... and they might be taken away
  chosen_korean: 빌라도에게 ... 내려 달라고 요청했습니다
  alternatives_korean:
  - 빌라도에게 ... 치워 달라고 청했습니다
  - 빌라도에게 ... 가져가게 해 달라고 요청했습니다
  - 빌라도에게 ... 옮겨 달라고 요청했습니다
  lexicon: BDAG
  rationale: ἠρώτησαν의 요청 의미를 ‘요청했습니다’로 살리고, ἀρθῶσιν은 십자가에서의 제거를 한국어 관용에 맞게 ‘내려 달라고’로 옮겨 문맥을 분명히 했습니다.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  english_pob_choice: for that Sabbath day was a great one
  chosen_korean: 그 안식일은 큰 날이었기 때문입니다
  alternatives_korean:
  - 그 안식일은 큰 날이었기 때문입니다
  - 그 안식일은 중요한 날이었기 때문입니다
  - 그 안식일은 특별히 큰 날이었기 때문입니다
  lexicon: BDAG
  rationale: μεγάλη를 직역해 ‘큰 날’로 유지하여, 전통적 해석어를 덧씌우기보다 원문의 강도를 그대로 드러냈습니다.
theological_decisions:
- issue: Ἰουδαῖοι의 지시 대상
  chosen_reading: 본문의 표면형을 따라 ‘유대인들’로 두고, 지도자들로 한정하지 않았습니다.
  alternative_readings:
  - 유대 지도자들
  - 유다인들
  - 유대 사람들
  rationale: 요한복음에서 Ἰουδαῖοι는 문맥에 따라 범위가 달라질 수 있으므로, 본문이 명시하지 않는 한 해석적으로 축소하지 않는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 원문 우선 번역 원칙; 본문이 말하는 범위를 넘겨 특정 집단으로 단정하지 않음
