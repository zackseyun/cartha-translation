    rationale: 각주는 해당 어구 뒤에 배치해야 연결 대상이 분명합니다. 본문을 ‘치워 달라고’로 옮기고 d를 ‘내려 달라고’라는 대안으로 제시하면 ἀρθῶσιν의 의미 범위도 더 잘 보존됩니다.
