review_pass:
  verdict: revise
  source_fidelity: 원문은 빌라도에게 (1) 십자가 위에 시체들이 안식일 동안 남아 있지 않도록, (2) 그들의 다리를 꺾고, (3) 시체들을 치워 달라고 요청한 내용을 담고 있습니다. 초안은 마지막 동작의 목적어가 명시되지 않아 ‘다리를 꺾고 내려 달라’가 다리를 내려 달라는 뜻으로도 읽힐 수 있습니다. 또한 ἀρθῶσιν은 넓게 ‘치워지다/옮겨지다’이므로 본문에서는 이를 유지하고 ‘내려 달라고’는 각주 대안으로 두는 것이 안전합니다.
  naturalness: ‘십자가 위에’보다 이 문맥에서는 ‘십자가에’가 더 자연스럽습니다. ‘큰 날’은 직역적 표현으로 유지할 수 있으나, 각주 표시는 해당 표현과 직접 연결하는 편이 독자의 이해와 구조적 명료성에 좋습니다.
  terminology: ‘유대인들’은 원문의 표면적 범위를 보존하며, 요한복음 안에서의 가능한 더 좁은 지시 대상은 각주로 처리하는 것이 적절합니다. ‘준비일’, ‘안식일’, ‘빌라도’도 적절합니다. ‘시체들’은 σώματα가 이 문맥에서 가리키는 바를 자연스럽고 분명하게 전달합니다.
  issues:
  - severity: medium
    issue: ‘그들의 다리를 꺾고 내려 달라고’는 ‘내려’의 목적어가 불분명합니다.
    rationale: κατεαγῶσιν αὐτῶν τὰ σκέλη와 ἀρθῶσιν은 각각 다리와 시체들의 제거를 가리킵니다. 한국어에서는 ‘시체들을’을 보충해야 두 요청이 명확히 구별됩니다.
  - severity: low
