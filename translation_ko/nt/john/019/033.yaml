source:
  edition: SBLGNT
  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
  footnotes:
  - marker: a
    text: 'John later connects this action to Scripture: ''Not one of his bones will be broken'' (John 19:36; cf. Exod 12:46; Num 9:12; Ps 34:20).'
    reason: cross_reference
  - marker: b
    text: Or 'when they saw that he had already died.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그들이 예수께[a] 와서, 예수께서 이미 죽어 계신 것을 보고는[b] 그의 다리를 꺾지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 요한은 뒤이어 이 일을 “그의 뼈가 하나도 꺾이지 않을 것이다”라는 성경 말씀과 연결합니다(요 19:36; 출 12:46; 민 9:12; 시 34:20 참조).
    reason: cross_reference
  - marker: b
    text: 또는 “그들이 예수께서 이미 죽어 계신 것을 보았을 때.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  english_pob_choice: But when they came to Jesus
  chosen_korean: 그런데 예수께 와서
  alternatives_korean:
  - 예수께 오자
  - 예수께 다가와서
  lexicon: SBLGNT
  rationale: δέ의 약한 대조를 ‘그런데’로 살리고, 분사구문은 한국어에서 자연스러운 시간·상황 표현인 ‘와서’로 옮겼습니다.
- source_word: ὡς εἶδον
  english_pob_choice: seeing that
  chosen_korean: 보니
  alternatives_korean:
  - 보았을 때
  - 보고 나서
  lexicon: BDAG
  rationale: 단순 시각 인지뿐 아니라 그 인식에 근거해 뒤의 행동이 결정되는 뉘앙스를 한국어의 ‘보니’가 간결하게 드러냅니다.
- source_word: ἤδη αὐτὸν τεθνηκότα
  english_pob_choice: he was already dead
  chosen_korean: 이미 죽어 계셨으므로
  alternatives_korean:
  - 이미 돌아가셨으므로
  - 이미 죽어 있었으므로
  lexicon: BDAG
  rationale: τεθνηκότα의 완료 상태를 반영해 ‘이미’로 시점을 살리고, 예수께 대한 서술에서 문맥상 존대가 필요한 부분은 ‘죽어 계셨으므로’로 자연스럽게 처리했습니다.
- source_word: οὐ κατέαξαν αὐτοῦ τὰ σκέλη
  english_pob_choice: they did not break his legs
  chosen_korean: 그의 다리를 꺾지 않았습니다
  alternatives_korean:
  - 그의 다리뼈를 부러뜨리지 않았습니다
  - 그의 다리를 부수지 않았습니다
  lexicon: BDAG
  rationale: κατάγνυμι의 본뜻인 ‘부러뜨리다/꺾다’를 살리면서, 한국어 성경 문맥에서 가장 자연스럽고 즉각적인 표현인 ‘다리를 꺾다’를 택했습니다.
theological_decisions:
- issue: 예수의 다리가 꺾이지 않은 사건의 성경 성취 암시를 본문에 얼마나 드러낼지
  chosen_reading: 이 절은 서술 자체에 머물고, 성경 성취의 연결은 본문 밖 주석적 연결로 남깁니다.
  alternative_readings:
  - ‘뼈’나 ‘다리뼈’로 바꾸어 19:36의 성취를 미리 강조하기
  - 성취를 암시하는 설명을 본문에 덧붙이기
  rationale: 요한복음은 성취 연결을 19:36에서 명시하므로, 19:33에서는 사건의 진행을 과장하지 않고 자연스러운 서술을 유지하는 것이 원문 구조에 맞습니다.
  doctrine_reference: 본문 우선 원칙; 성경 성취는 문맥이 밝히는 위치에서 제시
