review_pass:
  verdict: revise
  source_fidelity: 원문의 ὅτε(‘~했을 때/후에’)가 초안의 ‘그러므로’에는 반영되지 않아 시간 관계가 빠졌습니다. οὖν의 전개 기능과 ἔλαβεν 이후의 순서도 ‘그러자 … 받으신 뒤’로 자연스럽게 살릴 수 있습니다. 나머지 핵심 표현인 ‘신 포도주’, ‘다 이루어졌습니다’, ‘영을 내어주셨습니다’는 원문의 어휘와 표현적 긴장을 대체로 충실히 보존합니다.
  naturalness: 초안의 ‘그러므로 예수께서 … 받으시고’는 현대 한국어에서 다소 부자연스럽고, ‘그러므로’가 시간 접속사 ὅτε를 대신할 수 없습니다. ‘그러자 예수께서는 … 받으신 뒤 말씀하셨습니다’가 합쇼체 서술로 자연스럽습니다. 각주 표지는 해당 낱말이나 구절 바로 뒤에 붙여야 합니다.
  terminology: ‘신 포도주’는 ὄξος에 적절하며, ‘영을 내어주셨습니다’는 παρέδωκεν τὸ πνεῦμα를 단순 사망 표현으로 축소하지 않습니다. ‘다 이루어졌습니다’는 Τετέλεσται의 완료된 상태를 무리 없이 나타냅니다.
  issues:
  - severity: medium
    issue: ὅτε의 시간 관계가 번역문에서 누락됨
    rationale: ὅτε οὖν은 단순한 추론 접속사만이 아니라 ‘그러자/그래서 …했을 때(후에)’라는 서사적 시간 전개를 포함합니다. 초안의 ‘그러므로’는 ὅτε를 반영하지 못합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 한꺼번에 배치됨
    rationale: a는 ‘신 포도주’, b는 ‘다 이루어졌습니다’, c는 ‘영을 내어주셨습니다’에 각각 연결되어야 독자가 각주의 대상을 명확히 알 수 있습니다.
  revised_text: 그러자 예수께서는 신 포도주[a]를 받으신 뒤 말씀하셨습니다. “다 이루어졌습니다.[b]” 그리고 머리를 숙이시고 영을 내어주셨습니다.[c]
