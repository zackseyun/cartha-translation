  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
  footnotes:
  - marker: a
    text: Or “the vinegar” or “the wine vinegar.” The Greek ὄξος refers to sour wine.
    reason: lexical_alternative
  - marker: b
    text: Or “It has been accomplished” or “It has been completed.”
    reason: lexical_alternative
  - marker: c
    text: Or “he breathed his last.” The Greek more literally says, “he gave up his spirit.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 예수께서는 신 포도주[a]를 받으신 뒤 말씀하셨습니다. “다 이루어졌습니다.[b]” 그리고 머리를 숙이시고 영을 내어주셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “식초” 또는 “포도주 식초”입니다. 그리스어 ὄξος는 신 포도주를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “완성되었습니다” 또는 “성취되었습니다”입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “숨을 거두셨습니다”입니다. 그리스어를 더 문자적으로 옮기면 “영을 내어주셨습니다”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  english_pob_choice: So when
  chosen_korean: 그러므로
  alternatives_korean:
  - 그때 그러므로
  - 그런데 그때
  lexicon: BDAG
  rationale: ὅτε의 시간 관계와 οὖν의 전개 표지를 함께 살리되, 한국어에서는 ‘그러므로’가 문맥 연결을 자연스럽게 보여 줍니다.
- source_word: τὸ ὄξος
  english_pob_choice: the sour wine
  chosen_korean: 그 신 포도주
  alternatives_korean:
  - 식초
  - 포도주 식초
  - 신 포도주
  lexicon: BDAG
  rationale: ὄξος는 단순 ‘식초’보다 당시의 값싼 신 포도주를 가리키므로, 현대 독자가 오해하지 않도록 ‘신 포도주’로 옮겼습니다.
- source_word: Τετέλεσται
  english_pob_choice: It is finished
  chosen_korean: 다 이루어졌습니다
  alternatives_korean:
  - 다 끝났습니다
  - 완성되었습니다
  - 성취되었습니다
  lexicon: BDAG
  rationale: 완료된 상태를 나타내는 표현으로, 한국어에서는 ‘다 이루어졌습니다’가 완결성과 성취 뉘앙스를 함께 가장 자연스럽게 드러냅니다.
- source_word: παρέδωκεν τὸ πνεῦμα
  english_pob_choice: he gave up his spirit
  chosen_korean: 영을 내어주셨습니다
  alternatives_korean:
  - 영을 넘기셨습니다
  - 숨을 거두셨습니다
  - 영혼을 내어주셨습니다
  lexicon: BDAG
  rationale: 직역적 ‘영을 주셨다/내어주셨다’가 그리스어 표현의 중량감을 살리며, 단순한 ‘죽으셨습니다’보다 본문의 문구를 더 잘 보존합니다.
theological_decisions:
- issue: παρέδωκεν τὸ πνεῦμα를 한국어에서 단순 사망 서술로 풀지, 문구 자체를 살려 예수의 자발성을 드러낼지
  chosen_reading: 영을 내어주셨습니다
  alternative_readings:
  - 돌아가셨습니다
  - 숨을 거두셨습니다
  - 죽으셨습니다
  rationale: 요한복음의 표현을 평이한 사망 진술로 환원하지 않고, 예수의 죽음이 자발적 내어줌이라는 문장 구조를 유지했습니다.
  doctrine_reference: 본문의 표현적 긴장을 보존
