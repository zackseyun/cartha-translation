revisions:
- from: 그러므로 예수께서 그 신 포도주를 받으시고 말씀하셨습니다. 「다 이루어졌습니다」 — 그리고 머리를 숙이시고 영을 내어주셨습니다.[a][b][c]
  to: 그러자 예수께서는 신 포도주[a]를 받으신 뒤 말씀하셨습니다. “다 이루어졌습니다.[b]” 그리고 머리를 숙이시고 영을 내어주셨습니다.[c]
  rationale: 시간·전개 표지인 ὅτε οὖν과 수령 뒤 발화라는 문장 순서를 ‘그러자 … 받으신 뒤’로 보완했습니다. 어휘와 신학적으로 무리 없는 기존 선택은 유지했으며, 각주 표지를 해당 표현에 직접 연결했습니다.
