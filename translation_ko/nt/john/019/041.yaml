review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the crucifixion location, garden, new tomb, and the fact that no one had yet been laid in it. However, ‘그곳에는’ can refer either to the garden or to the tomb in Korean, whereas ἐν ᾧ unambiguously refers to the tomb.
  naturalness: The wording is natural in modern formal-polite Korean. Repeating ‘그 무덤에는’ is slightly clearer and remains fluent.
  terminology: ‘십자가에 못 박히신,’ ‘동산,’ ‘새 무덤,’ and ‘안치된 적이 없었습니다’ are appropriate and consistent with the burial context. ‘안치’ preserves the sense of a body having been laid in the tomb without prematurely narrowing it to burial.
  issues:
  - severity: low
    issue: Relative-clause antecedent is unclear in ‘그곳에는’.
    rationale: The Greek relative pronoun ᾧ refers specifically to μνημεῖον (‘tomb’). In Korean, ‘그곳’ may naturally be understood as either the immediately mentioned tomb or the broader garden/location. Explicitly naming ‘그 무덤’ preserves the source referent.
  revised_text: 그가 십자가에 못 박히신 곳에는 동산이 있었고, 그 동산에는 새 무덤이 있었는데, 그 무덤에는 아직 아무도 안치된 적이 없었습니다.
  revised_footnotes: []
  revision_rationale: ‘그곳’을 ‘그 무덤’으로 바꾸어, 아무도 아직 안치되지 않았다는 진술이 동산이 아니라 새 무덤에 관한 것임을 원문의 관계절과 같이 명확히 했습니다. 그 밖의 표현은 원문과 영어 POB의 의미를 충실하고 자연스럽게 전달합니다.
