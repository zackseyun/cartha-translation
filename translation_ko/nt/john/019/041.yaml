source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: Now in the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: ko
  text: 그가 십자가에 못 박히신 곳에는 동산이 있었고, 그 동산에는 새 무덤이 있었는데, 그 무덤에는 아직 아무도 안치된 적이 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τόπῳ ὅπου ἐσταυρώθη
  english_pob_choice: the place where he was crucified
  chosen_korean: 그가 십자가에 못 박히신 곳
  alternatives_korean:
  - 그가 십자가에 못 박히신 자리
  - 그가 못 박히신 장소
  lexicon: BDAG
  rationale: τόπος는 여기서 단순한 ‘장소’보다 서술 흐름에 맞는 ‘곳’이 자연스럽고, ἐσταυρώθη의 수동형은 주체를 덧붙이지 않고 ‘십자가에 못 박히신’으로 옮기는 것이 원문에 가깝습니다.
- source_word: κῆπος
  english_pob_choice: garden
  chosen_korean: 동산
  alternatives_korean:
  - 정원
  - 과수원
  lexicon: BDAG
  rationale: κῆπος의 기본 의미는 정원/동산이지만, 요한복음의 장면에서는 장례 장소와 어울리는 성경적·서사적 표현인 ‘동산’이 더 적절합니다.
- source_word: μνημεῖον καινόν
  english_pob_choice: a new tomb
  chosen_korean: 새 무덤
  alternatives_korean:
  - 새로운 무덤
  - 새로 만든 무덤
  lexicon: BDAG
  rationale: καινόν은 ‘새로운/새 것’의 의미이므로 ‘새 무덤’이 간결하고 자연스럽습니다. 영어 POB처럼 ‘unused’의 의미를 형용사에 미리 넣지 않고 다음 절로 풀어 줍니다.
- source_word: ἐν ᾧ οὐδέπω οὐδεὶς ἦν τεθειμένος
  english_pob_choice: in which no one had yet been laid
  chosen_korean: 그곳에는 아직 아무도 안치된 적이 없었습니다
  alternatives_korean:
  - 그곳에는 아직 아무도 놓인 적이 없었습니다
  - 그곳에는 아직 누구도 묻힌 적이 없었습니다
  lexicon: BDAG
  rationale: τεθειμένος는 무덤 맥락에서 ‘안치되다’가 가장 자연스럽고, ‘묻히다’보다 시신이 무덤에 놓인 상태를 더 직접적으로 반영합니다. οὐδέπω는 ‘아직’으로 충분히 드러납니다.
theological_decisions:
- issue: ἐσταυρώθη의 수동형 처리
  chosen_reading: 주어를 덧붙이지 않고 ‘십자가에 못 박히신’으로 번역했습니다.
  alternative_readings:
  - 그들이 그를 십자가에 못 박은 곳
  - 그가 십자가형을 당하신 곳
  rationale: 원문은 수동형으로만 말하며, 이 절의 초점은 행위자보다 장소의 묘사에 있습니다. 따라서 명시적 행위자를 넣지 않고 수동성을 유지하는 편이 본문 구조에 충실합니다.
  doctrine_reference: Translation philosophy §1
