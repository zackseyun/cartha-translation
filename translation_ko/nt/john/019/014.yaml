revisions:
- from: 그것은 유월절 준비일이었습니다. 때는 거의 제육시였고, 그가 유대인들에게 말합니다. 「보십시오, 당신들의 왕입니다!」[a][b]
  to: 그날은 유월절 준비일이었습니다. 때는 대략 제육시[a]였습니다. 그리고 그는 유대인들[b]에게 말합니다. 「보십시오, 여러분의 왕입니다!」
  rationale: 원문의 ὡς가 나타내는 근사성을 ‘대략’으로 정확히 반영하고, 각주를 해당 어구에 직접 연결했습니다. 역사적 현재 λέγει는 ‘말합니다’로 유지했으며, 유월절·제육시·유대인들이라는 핵심 표현과 본문의 해석상 열려 있는 범위를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:59Z'
review_pass:
  verdict: revise
  source_fidelity: ‘거의’는 어떤 시점에 가까워짐을 뜻하기 쉬워 ὡς의 단순한 근사 표현에는 ‘대략’이 더 정확합니다. 또한 각주 표지는 해당 표현인 ‘제육시’와 ‘유대인들’에 직접 붙이는 것이 적절합니다.
  naturalness: ‘그것은’은 한국어 성경 서술에서 부자연스러우므로 ‘그날은’으로 고쳤습니다. 집단을 향한 공적 발화에서는 ‘당신들의’보다 ‘여러분의’가 현대 표준어 합쇼체에서 자연스럽고 불필요한 공격성을 피합니다.
  terminology: ‘유월절 준비일’과 ‘제육시’는 원문의 절기·시간 용어를 보존합니다. τοῖς Ἰουδαίοις는 본문에서 ‘유대인들’로 유지하고, 문맥상 범위가 더 좁을 가능성은 각주에서만 제시합니다.
  issues:
  - severity: medium
    issue: ὡς ἕκτη의 근사 표현을 ‘거의 제육시’로 옮김
    rationale: ‘거의’는 ‘제육시가 되기 직전’이라는 방향성을 암시할 수 있습니다. ὡς는 여기서 대략적 수치를 표시하므로 ‘대략 제육시’가 더 충실합니다.
  - severity: low
    issue: 각주 표지가 지시 대상 표현에 직접 연결되지 않음
    rationale: 시간 각주와 ‘유대인들’의 지시 범위 각주는 각각 ‘제육시’와 ‘유대인들’에 붙여 독자가 무엇을 설명하는지 즉시 알 수 있게 해야 합니다.
  - severity: low
    issue: ‘그것은’ 및 ‘당신들의’의 현대 한국어 어감
    rationale: ‘그날은’이 시간 서술에 자연스럽습니다. ‘여러분의 왕’은 공적 خطاب에서 소유격과 아이러니를 유지하면서도 현대 합쇼체에 더 적합합니다.
  revised_text: 그날은 유월절 준비일이었습니다. 때는 대략 제육시[a]였습니다. 그리고 그는 유대인들[b]에게 말합니다. 「보십시오, 여러분의 왕입니다!」
