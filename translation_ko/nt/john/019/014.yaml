id: JHN.19.14
reference: John 19:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: Now it was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
  footnotes:
  - marker: a
    text: Or, possibly in modern terms, 'about noon,' depending on how the hour is reckoned.
    reason: cultural_note
  - marker: b
    text: '''The Jews'' may in context refer more specifically to the Judean authorities or Jewish leaders.'
    reason: alternative_reading
translation:
  language: ko
  text: 그날은 유월절 준비일이었습니다. 때는 대략 제육시[a]였습니다. 그리고 그는 유대인들[b]에게 말합니다. 「보십시오, 여러분의 왕입니다!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제육시’는 고대의 시간 계산을 따른 표현입니다. 시간 계산 방식에 따라 현대 시각으로는 대략 정오를 가리킬 수도 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘유대인들’은 문맥상 유대 지도자들을 더 구체적으로 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  english_pob_choice: the day of preparation of the Passover
  chosen_korean: 유월절 준비일
  alternatives_korean:
  - 유월절의 준비일
  - 유월절을 위한 준비일
  lexicon: BDAG
  rationale: παρασκευή는 절기 직전의 ‘준비일’을 가리키므로, 한국어에서는 자연스럽게 ‘유월절 준비일’로 옮겨 시간적 의미를 분명히 했습니다.
- source_word: ὥρα ⸂ἦν ὡς⸃ ἕκτη
  english_pob_choice: it was about the sixth hour
  chosen_korean: 때는 거의 제육시였고
  alternatives_korean:
  - 때는 거의 여섯 시였고
  - 때는 거의 정오였고
  lexicon: BDAG
  rationale: ὡς는 근사치를 나타내므로 ‘거의’로 살렸고, ‘제육시’는 본문이 가진 시대적 시간표현을 유지합니다.
- source_word: τοῖς Ἰουδαίοις
  english_pob_choice: to the Jews
  chosen_korean: 유대인들에게
  alternatives_korean:
  - 유대인 지도자들에게
  - 유다 사람들에게
  lexicon: BDAG
  rationale: 본문에는 범위를 좁히는 표지가 없으므로 직접적으로 ‘유대인들에게’로 옮겼습니다.
- source_word: Ἴδε
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오요
  lexicon: BDAG
  rationale: 선포적 주의를 환기하는 감탄사로서, 현대 한국어에서는 공적인 호명에 어울리는 ‘보십시오’가 가장 자연스럽습니다.
- source_word: ὁ βασιλεὺς ὑμῶν
  english_pob_choice: your king
  chosen_korean: 당신들의 왕
  alternatives_korean:
  - 너희의 왕
  - 여러분의 왕
  lexicon: BDAG
  rationale: 직설적이고 정치적인 뉘앙스를 보존하기 위해 소유격을 분명히 살렸습니다. 다만 ‘당신들’은 한국어에서 상대를 집단으로 지칭하는 중립적 표현으로 사용했습니다.
theological_decisions:
- issue: 예수의 발언을 현장감 있게 전달하는 역사적 현재
  chosen_reading: ‘그가 말합니다’로 현재형을 유지했습니다.
  alternative_readings:
  - 그가 말했습니다
  rationale: 요한복음의 역사적 현재를 평이한 과거로 평면화하지 않고, 원문의 현장감을 살리기 위한 선택입니다.
  doctrine_reference: translation philosophy §1, §3
- issue: ‘유대인들’의 지시 대상
  chosen_reading: 본문의 직접 표현을 유지했습니다.
  alternative_readings:
  - 유대 지도자들
  - 유다인들
  rationale: 이 구절만으로는 지시 대상을 더 좁힐 근거가 부족하므로, 본문이 말하는 범위를 임의로 축소하지 않았습니다.
  doctrine_reference: translation philosophy §1, §5
