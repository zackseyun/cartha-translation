id: JHN.19.32
reference: John 19:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
  footnotes:
  - marker: a
    text: Or, more literally, 'the first' and 'the other.' English supplies 'man' for clarity.
    reason: lexical_alternative
  - marker: b
    text: Or 'and of the other who had been crucified with him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 병사들이 와서 첫째 사람의 다리를 부러뜨리고, 그와 함께 십자가에 못 박힌 다른 사람의 것도 부러뜨렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘첫째 사람의’는 그리스어의 ‘첫째’를 풀어 쓴 것으로, 영어 본문이 덧붙인 ‘man’에 해당하는 보충어입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그와 함께 십자가에 못 박힌 다른 사람의 것도’는 두 번째 절에서 앞의 ‘다리를 부러뜨리고’를 생략한 병렬 구조를 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런즉
  - 그때
  lexicon: BDAG
  rationale: 이 접속사는 앞 문맥에서 이어지는 결과·전개를 나타내므로, 문어체에서 자연스러운 인과 연결어인 ‘그러므로’로 옮겼습니다.
- source_word: οἱ στρατιῶται
  english_pob_choice: the soldiers
  chosen_korean: 병사들이
  alternatives_korean:
  - 군인들이
  - 군사들이
  lexicon: BDAG
  rationale: 문맥상 로마 병력을 가리키며, 현대 한국어에서는 ‘병사들’이 가장 자연스럽고 명확합니다.
- source_word: τοῦ μὲν πρώτου
  english_pob_choice: the first man
  chosen_korean: 첫째 사람의
  alternatives_korean:
  - 첫 번째 사람의
  - 첫째의
  lexicon: BDAG
  rationale: 그리스어는 ‘첫째/첫 번째’를 말할 뿐 ‘사람’을 직접 덧붙이지 않지만, 한국어에서는 소유격 구조 안에서 대상을 분명히 하기 위해 ‘사람’을 보충했습니다.
- source_word: κατέαξαν τὰ σκέλη
  english_pob_choice: broke the legs
  chosen_korean: 다리를 부러뜨리고
  alternatives_korean:
  - 다리를 꺾고
  - 다리를 부숴서
  lexicon: BDAG
  rationale: κατέαξαν은 단순한 ‘부러뜨리다’의 뜻이므로 직설적이고 형벌 장면에 맞는 ‘부러뜨리다’를 택했습니다. 복수 ‘다리들’은 한국어에서 자연스럽게 단수형으로 옮겼습니다.
- source_word: τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ
  english_pob_choice: the other who had been crucified with him
  chosen_korean: 그와 함께 십자가에 못 박힌 다른 사람의 것도
  alternatives_korean:
  - 그와 함께 십자가에 못 박힌 다른 이의 것도
  - 함께 못 박힌 다른 사람의 것도
  lexicon: BDAG
  rationale: 두 번째 절은 앞 절의 동사와 목적어를 공유하므로, 한국어에서도 ‘...의 것도’로 병렬을 살려 반복을 최소화했습니다. συσταυρωθέντος는 ‘함께 십자가에 못 박힌’으로 수동·동시성을 드러냈습니다.
theological_decisions:
- issue: αὐτῷ의 지시 대상
  chosen_reading: ‘그와 함께 십자가에 못 박힌’의 ‘그’는 예수를 가리킵니다.
  alternative_readings:
  - 첫째 사람을 가리킨다고 볼 수 있음
  rationale: 요한복음의 수난 서술에서 두 사람은 예수를 중심으로 규정되므로, 단수 대명사는 예수를 가리키는 것이 가장 자연스럽습니다.
  doctrine_reference: 수난 서술 문맥의 지시어 해석
