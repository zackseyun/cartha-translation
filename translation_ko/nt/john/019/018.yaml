translation:
  language: ko
  text: 그들이 그를 십자가에 못 박은 곳이며, 그와 함께 두 사람도 있었는데, 한 사람은 이쪽에, 한 사람은 저쪽에 있었고, 예수님은 가운데 계셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 압축하면, ‘양쪽에 한 사람씩, 예수님은 가운데’로 옮길 수 있습니다.
