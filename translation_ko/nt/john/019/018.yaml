  source_fidelity: 수정이 필요합니다. 원문의 ἐσταύρωσαν은 예수와 ‘다른 두 사람’에게 모두 적용되지만, 초안의 ‘그와 함께 두 사람도 있었는데’는 그 두 사람이 십자가에 못 박혔다는 핵심 서술을 ‘있었다’라는 위치·존재 서술로 약화합니다. 또한 ἄλλους δύο의 ‘다른’이 빠져 있습니다. 수정문은 동사의 공통 적용, ‘다른 두 사람’, 양쪽의 배치, 예수의 중앙 위치를 모두 보존합니다.
  naturalness: 초안의 ‘그들이 그를 십자가에 못 박은 곳이며’는 독립된 절로 읽힐 때 연결이 어색합니다. ‘…곳에서’로 이어 주고, ‘그와 함께 다른 두 사람도 십자가에 못 박았는데’라고 하면 현대 표준어 합쇼체에서 자연스럽고 원문의 병렬 구조도 드러납니다.
  terminology: ‘십자가에 못 박다’는 σταυρόω에 대한 통용되고 적절한 번역입니다. ‘예수께서는’은 한국어의 정중한 서술 관례에 맞으며, ‘가운데에’는 μέσον의 공간적 의미를 과도한 해석 없이 전달합니다.
