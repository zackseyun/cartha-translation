lexical_decisions:
- source_word: ὅπου
  english_pob_choice: where
  chosen_korean: 곳이며
  alternatives_korean:
  - 장소이며
  - 바로 그곳이며
  lexicon: BDAG
  rationale: ὅπου의 장소성은 한국어에서 ‘곳’으로 자연스럽게 드러내는 것이 가장 직접적입니다.
- source_word: ἐσταύρωσαν
  english_pob_choice: they crucified
  chosen_korean: 십자가에 못 박은
  alternatives_korean:
  - 십자가형에 처한
  - 십자가에 못 박은 채 죽인
  lexicon: BDAG
  rationale: σταυρόω는 요한복음 수난문맥에서 ‘십자가에 못 박다’가 가장 정확하고 통용되는 표현입니다.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  english_pob_choice: one on each side
  chosen_korean: 한 사람은 이쪽에, 한 사람은 저쪽에
  alternatives_korean:
  - 양쪽에 한 사람씩
  - 한 사람은 이편에, 한 사람은 저편에
  lexicon: BDAG
  rationale: 두 개의 지시 부사는 양쪽의 분포를 강조하므로, ‘이쪽/저쪽’으로 나누어 옮겨 공간 구도를 또렷하게 살렸습니다.
- source_word: μέσον δὲ τὸν Ἰησοῦν
  english_pob_choice: and Jesus in the middle
  chosen_korean: 예수님은 가운데 계셨습니다
  alternatives_korean:
  - 예수님은 그 사이에 계셨습니다
  - 예수님은 중심에 계셨습니다
  lexicon: BDAG
  rationale: μέσον의 중심 위치를 한국어 관용어 ‘가운데’로 옮겼고, 인물 주어를 자연스럽게 살리기 위해 ‘계셨습니다’를 사용했습니다.
theological_decisions:
- issue: 예수님의 중앙 위치를 얼마나 명시할 것인가
  chosen_reading: ‘예수님은 가운데 계셨습니다’로 중앙 배치를 직접적으로 서술했습니다.
  alternative_readings:
  - ‘예수님은 그들 사이에 계셨습니다’
  - ‘예수님은 중심에 계셨습니다’
  rationale: 본문은 두 사람의 양쪽 배치와 예수님의 중앙 위치를 함께 제시하므로, 그 공간 배열을 흐리지 않도록 직접적으로 표현했습니다.
  doctrine_reference: 원문의 공간적 대비를 보존하고, 해석을 최소화합니다.
