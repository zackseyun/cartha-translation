id: JHN.19.10
reference: John 19:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
  footnotes:
  - marker: a
    text: Or 'power' instead of 'authority'; Greek exousia can denote authority, right, or power. 'Authority' is preferred here because Pilate is speaking in a legal-governing context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 빌라도가 그에게 말했습니다. “나에게는 말하지 않겠습니까? 내가 당신을 놓아줄 권한도 있고, 당신을 십자가에 못 박을 권한도 있다는 것을 모르십니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘권력’. 헬라어 exousia는 권한, 권리, 권력의 뜻을 가질 수 있으나, 여기서는 법정·통치 맥락이므로 ‘권한’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  english_pob_choice: So ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그러므로 ... 말했습니다
  - 그리고 ... 말했습니다
  lexicon: SBLGNT
  rationale: οὖν의 서술 전진 기능을 한국어에서 자연스러운 시간·전개 연결인 ‘그때’로 살려, 문맥 진행을 매끄럽게 하면서도 무리한 인과를 덧씌우지 않았습니다.
- source_word: Ἐμοὶ οὐ λαλεῖς;
  english_pob_choice: Will you not speak to me?
  chosen_korean: 나에게는 말하지 않겠습니까?
  alternatives_korean:
  - 나에게 말하지 않겠습니까?
  - 왜 나에게 말하지 않습니까?
  lexicon: BDAG
  rationale: 전면화된 Ἐμοὶ의 강조를 조사 ‘-에는’으로 살리고, 반문 형식으로 빌라도의 책망·당혹을 유지했습니다.
- source_word: ἐξουσίαν ἔχω
  english_pob_choice: I have authority
  chosen_korean: 권한도 있고
  alternatives_korean:
  - 권세도 있고
  - 권력도 있고
  - 권리도 있고
  lexicon: BDAG
  rationale: ἐξουσία는 여기서 재판·통치 맥락의 법적 권한을 가리키므로, 교회 전통어의 추상적 ‘권세’보다 현대 한국어의 ‘권한’을 택했습니다.
- source_word: ἀπολῦσαί σε
  english_pob_choice: to release you
  chosen_korean: 당신을 놓아줄
  alternatives_korean:
  - 당신을 풀어줄
  - 당신을 석방할
  lexicon: BDAG
  rationale: 법정적 맥락에서 ἀπολύω의 ‘풀어주다/석방하다’ 의미를 살리되, 한국어에서는 ‘놓아주다’가 자연스럽고 판결 전후의 해방 조치를 잘 드러냅니다.
- source_word: σταυρῶσαί σε
  english_pob_choice: to crucify you
  chosen_korean: 당신을 십자가에 못 박을
  alternatives_korean:
  - 당신을 십자가형에 처할
  - 당신을 십자가에 매달을
  lexicon: BDAG
  rationale: σταυρόω의 직접적 형벌 행위를 한국어 관용에 맞게 ‘십자가에 못 박다’로 직역하여, 형벌의 잔혹성과 법적 주도권을 약화시키지 않았습니다.
theological_decisions:
- issue: 빌라도의 ἐξουσία 주장 번역
  chosen_reading: ‘권한’으로 번역하되, 그것이 정당한 통치권인지에 대한 평가는 하지 않았습니다.
  alternative_readings:
  - 권세
  - 권력
  - 권리
  rationale: 본문은 빌라도의 자기 주장만 보고하며, 다음 절에서 예수께서 그 권한의 궁극적 한계를 드러낼 여지를 남겨 두어야 하므로 중립적인 법정 용어를 유지했습니다.
  doctrine_reference: 본문 내 긴장 보존
