  source_fidelity: 그리스어의 핵심 구조와 반복(ἐξουσίαν ἔχω … καὶ ἐξουσίαν ἔχω …)은 대체로 충실히 옮겼습니다. 다만 οὖν은 단순한 시간 지시인 ‘그때’보다 앞 장면에 이어지는 반응을 나타내는 ‘그러자’가 더 적절합니다. ἀπολῦσαι의 법정적 의미는 ‘석방하다’가 ‘놓아주다’보다 명료합니다.
  naturalness: 합쇼체 서술과 질문은 자연스럽습니다. ‘그러자’와 ‘석방할’을 사용하면 현대 한국어의 서사 연결 및 법정 문맥이 더 자연스럽고 정확하게 드러납니다.
  terminology: ἐξουσία를 ‘권한’으로 옮긴 것은 빌라도의 법적·행정적 주장이라는 문맥에 적합하며, 그 주장의 정당성을 번역이 보증하지도 않습니다. 각주의 원어 표기는 로마자보다 그리스어 ‘ἐξουσία’로 제시하는 편이 정확합니다.
  issues:
