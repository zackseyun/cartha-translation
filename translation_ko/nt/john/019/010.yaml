  to: 그러자 빌라도가 그에게 말했습니다. “나에게는 말하지 않겠습니까? 내가 당신을 석방할 권한[a]도 있고, 당신을 십자가에 못 박을 권한도 있다는 것을 모르십니까?”
  rationale: 서사 연결을 더 충실히 반영하도록 ‘그때’를 ‘그러자’로, 법정적 석방의 의미를 분명히 하도록 ‘놓아줄’을 ‘석방할’로 고쳤습니다. ἐξουσία의 두 차례 반복, 빌라도의 강조된 ‘나에게는’, 그리고 십자가형 집행에 관한 직접적 표현은 유지했습니다. 각주는 해당 어휘에 직접 연결하고 원어 표기를 정비했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:55Z'
