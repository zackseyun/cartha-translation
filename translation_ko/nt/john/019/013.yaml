- from: 그러므로 빌라도는 그 말들을 듣고 예수를 밖으로 끌고 나가서, 이른바 돌바닥이라는 곳의 재판석 위에 앉았습니다. 그곳은 히브리어로는 가바다라고 불립니다.[a][b]
  to: 그러므로 빌라도는 이 말들을 듣고 예수를 밖으로 데리고 나와, 돌로 포장한 곳, 히브리어로는[b] 가바다라 하는 곳에서 재판석에 앉았습니다[a].
  rationale: The revision removes an unwarranted connotation of force, renders Λιθόστρωτον as a stone-paved location, preserves the source’s appositional relationship between the Greek and Semitic place names, and relocates the notes to their precise anchors. The syntactic ambiguity of ἐκάθισεν remains explicitly preserved in footnote a.
