id: JHN.19.13
reference: John 19:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
  footnotes:
  - marker: a
    text: Or, 'and seated him on the judgment seat.' The Greek verb can be understood transitively, though the more likely sense here is that Pilate himself sat on the judgment seat.
    reason: alternative_reading
  - marker: b
    text: '''In Hebrew'' likely refers to the local Semitic language, probably Aramaic, as elsewhere in John.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 빌라도는 이 말들을 듣고 예수를 밖으로 데리고 나와, 돌로 포장한 곳, 히브리어로는[b] 가바다라 하는 곳에서 재판석에 앉았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사는 타동적으로도 이해될 수 있어서 ‘예수를 재판석에 앉히다’로 볼 가능성도 있습니다. 그러나 여기서는 빌라도 자신이 재판석에 앉은 뜻이 더 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: ‘히브리어로’는 요한복음에서 종종 지역의 셈어, 곧 아람어를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그리하여
  - 그러자
  lexicon: BDAG
  rationale: 앞 절과의 논리적·서사적 연속을 드러내는 연결어로 자연스럽고, 빌라도의 행동이 앞선 발화에 대한 반응임을 살립니다.
- source_word: ἀκούσας τῶν λόγων τούτων
  english_pob_choice: when Pilate heard these words
  chosen_korean: 그 말들을 듣고
  alternatives_korean:
  - 이 말들을 듣고
  - 이러한 말들을 듣고
  - 그것들을 듣고
  lexicon: BDAG
  rationale: 직전의 발화를 가리키는 λόγοι를 한국어로는 자연스럽게 ‘그 말들’로 옮겨, 시간 부사절의 기능을 살렸습니다.
- source_word: ἐκάθισεν ἐπὶ βήματος
  english_pob_choice: sat down on the judgment seat
  chosen_korean: 재판석 위에 앉았습니다
  alternatives_korean:
  - 재판석에 앉았습니다
  - 재판관석에 앉았습니다
  - 심판석에 앉았습니다
  lexicon: BDAG
  rationale: βῆμα는 법정의 공식 재판석을 가리키므로 ‘재판석’이 가장 직접적입니다. 문맥상 주어를 빌라도로 읽는 기본 해석을 반영해 능동으로 옮겼습니다.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  english_pob_choice: at a place called the Stone Pavement
  chosen_korean: 이른바 돌바닥이라는 곳
  alternatives_korean:
  - 돌바닥이라 불리는 곳
  - 리토스트로톤이라 불리는 곳
  - 돌 포장이라는 곳
  lexicon: BDAG
  rationale: Λιθόστρωτον은 뜻이 분명한 지명 설명이므로 의미 번역을 택했습니다. ‘이른바’는 뒤의 설명적 지명을 한국어에서 자연스럽게 연결합니다.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  english_pob_choice: and in Hebrew, Gabbatha
  chosen_korean: 히브리어로는 가바다라고 불립니다
  alternatives_korean:
  - 히브리어로 가바다라 합니다
  - 히브리어로는 가바다입니다
  - 아람어로는 가바다라고 불립니다
  lexicon: BDAG
  rationale: 본문 표현을 따라 ‘히브리어로는’을 유지하되, 요한복음의 관례상 현지 셈어를 가리킬 수 있다는 점을 손상하지 않도록 ‘라고 불립니다’로 풀었습니다. 고유명사는 음역했습니다.
theological_decisions:
- issue: ἐκάθισεν의 주어와 행위 방향성
  chosen_reading: 빌라도가 재판석에 앉은 것으로 옮겼습니다.
  alternative_readings:
  - 빌라도가 예수를 재판석에 앉힌 것으로 옮길 수 있습니다.
  - 예수를 재판석에 앉혔다는 뜻으로도 읽을 수 있습니다.
  rationale: 그리스어 동사는 타동·자동 모두 가능해 해석상 긴장이 있습니다. 본문 전체의 재판 장면 흐름과 가장 자연스러운 통사 읽기를 따르되, 다른 가능성은 본문 주석으로 남기는 것이 적절합니다.
  doctrine_reference: 해석상의 긴장을 보존하고 한쪽으로 과도하게 단정하지 않습니다.
