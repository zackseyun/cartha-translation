    reason: cultural_note
  revision_rationale: The revision removes an unwarranted connotation of force, renders Λιθόστρωτον as a stone-paved location, preserves the source’s appositional relationship between the Greek and Semitic place names, and relocates the notes to their precise anchors. The syntactic ambiguity of ἐκάθισεν remains explicitly preserved in footnote a.
