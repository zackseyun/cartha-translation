  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
  footnotes:
  - marker: a
    text: Or 'because of the Jewish day of preparation' or 'because it was the Preparation of the Jews.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 거기에서, 유대인들의 준비일이었고 무덤이 가까웠기 때문에, 그들은 예수님을 거기에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대인들의 준비일이었기 때문에’ 혹은 ‘유대인들의 준비일이었으므로’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖ
  english_pob_choice: there
  chosen_korean: 거기에서
  alternatives_korean:
  - 그곳에서
  - 거기
  lexicon: BDAG
  rationale: 장소를 가리키는 부사이므로, 앞의 맥락을 이어 주는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러니
  lexicon: BDAG
  rationale: 서술의 연결과 추론을 드러내는 접속어로 살렸습니다.
- source_word: διὰ τὴν παρασκευὴν τῶν Ἰουδαίων
  english_pob_choice: because of the Jews’ day of preparation
  chosen_korean: 유대인들의 준비일이었고
  alternatives_korean:
  - 유대인들의 준비일 때문에
  - 유대인의 준비일이어서
  lexicon: BDAG
  rationale: διά + 대격의 이유를 살리되, παρασκευή를 본문이 허용하는 달력적 용례인 ‘준비일’로 옮겨 현대 독자가 이해하기 쉽게 했습니다.
- source_word: ἔθηκαν
  english_pob_choice: they laid
  chosen_korean: 그들은 … 두었습니다
  alternatives_korean:
  - 그들은 … 놓았습니다
  - 그들은 … 안치했습니다
  lexicon: BDAG
  rationale: 무덤에 시신을 두는 맥락이므로 단순 동사보다 ‘두다’가 가장 직접적이며, 지나치게 의례적인 표현은 피했습니다.
theological_decisions:
- issue: τῶν Ἰουδαίων의 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: 유대인들의 준비일
  alternative_readings:
  - 유대인의 준비일
  - 유대인들의 유월절 준비일
  rationale: 원문의 소유격 표현을 가시화하되, 본문에 없는 추가 설명은 넣지 않았습니다. 이 표현은 유대인들에 대한 평가가 아니라 준비일의 관습적 귀속을 가리킵니다.
  doctrine_reference: 원문 우선 원칙; 본문 의미 보존
