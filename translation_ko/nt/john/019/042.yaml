lexical_decisions:
- source_word: ἐκεῖ
  english_pob_choice: there
  chosen_korean: 거기에서
  alternatives_korean:
  - 그곳에서
  - 거기
  lexicon: BDAG
  rationale: 장소를 가리키는 부사이므로, 앞의 맥락을 이어 주는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: οὖν
  english_pob_choice: So
  chosen_korean: 그러므로
  alternatives_korean:
