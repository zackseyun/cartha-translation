revisions:
- from: 그러므로 거기에서, 유대인들의 준비일이었고 무덤이 가까웠기 때문에, 그들은 예수님을 거기에 두었습니다.[a]
  to: 그러므로 유대인의 준비일[a]이었고 그 무덤이 가까이 있었기 때문에, 그들은 예수님을 그곳에 두었습니다.
  rationale: 문두의 ἐκεῖ를 문미의 ‘그곳에’ 한 번으로 옮겨 중복을 제거했습니다. ‘유대인의 준비일이었고 … 가까이 있었기 때문에’는 준비일이라는 시간적 사정과 무덤의 근접성이 함께 매장 장소 선택의 이유가 되는 원문의 관계를 보존합니다. 각주에서는 διά를 더 직접적으로 드러내는 대안을 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:52:02Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 원문의 ἐκεῖ를 문두의 ‘거기에서’와 문미의 ‘거기에’로 두 번 옮겨 공간 지시를 중복했습니다. 또한 διά + 대격의 이유 표현은 ‘준비일이었고’로만 처리하기보다, 그 날이라는 사정이 매장 장소 선택의 이유였음을 자연스럽게 드러내야 합니다.
  naturalness: ‘그러므로 거기에서, … 거기에 두었습니다’는 한국어 어순과 수식 관계가 부자연스럽습니다. 한 번의 ‘그곳에’를 동사 가까이에 두고, 두 이유를 ‘…이었고 … 가까이 있었기 때문에’로 연결하면 현대 합쇼체 문장으로 자연스럽습니다.
  terminology: παρασκευή는 본문에 더 구체적인 절기 명칭을 보태지 않고 ‘준비일’로 유지했습니다. τῶν Ἰουδαίων은 한국어 관용상 ‘유대인의 준비일’로 옮겼으며, ‘유월절’ 등의 해석적 보충은 하지 않았습니다. μνημεῖον은 문맥상 ‘무덤’이 적절합니다.
