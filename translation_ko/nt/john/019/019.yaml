    rationale: 영어 POB 감사 기록의 대안 독법을 한국어 본문에서도 동일한 표지에 연결하여, ‘유대인’과 ‘유다 사람들’ 사이의 문맥상 범위를 투명하게 보일 필요가 있습니다.
  revised_text: 빌라도는 또한 명패를 써서 십자가에 붙였습니다. 그것에는 이렇게 적혀 있었습니다. “나사렛 예수, 유대인의 왕[ㄱ].”
