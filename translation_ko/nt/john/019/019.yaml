  source_fidelity: ‘십자 위에’는 ἐπὶ τοῦ σταυροῦ(‘십자가에/on the cross’)에 ‘위’를 더하며, ‘십자’는 이 문맥에서 ‘십자가’의 자연스러운 표기가 아닙니다. 이를 ‘십자가에 붙였습니다’로 고치면 위치와 행위를 충실히 옮깁니다. τίτλον은 십자가에 부착한 공개 표식이므로 ‘명패’가 가능하며, ‘나사렛 예수, 유대인의 왕’은 원문의 식별명과 공적 왕호를 보존합니다.
  naturalness: ‘빌라도도’도 가능하지만 δὲ καὶ의 이어짐과 첨가를 현대 격식체에서 더 분명히 드러내도록 ‘빌라도는 또한’으로 다듬었습니다. ‘그것에는 이렇게 적혀 있었습니다’는 자연스럽고 γεγραμμένον의 결과 상태를 무리 없이 전달합니다.
  terminology: ‘십자가’, ‘나사렛 예수’, ‘유대인의 왕’을 유지합니다. Ἰουδαίων은 여기서 관례적 공적 칭호인 ‘유대인’으로 옮기되, ‘유다 사람들’이라는 가능한 지역적 의미는 각주로 밝혀야 합니다.
