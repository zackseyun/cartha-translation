id: JHN.19.19
reference: John 19:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
  footnotes:
  - marker: a
    text: Or “the King of the Judeans.” The Greek term can refer either to Jews more broadly or to Judeans in particular, depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 빌라도는 또한 명패를 써서 십자가에 붙였습니다. 그것에는 이렇게 적혀 있었습니다. “나사렛 예수, 유대인의 왕[ㄱ].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 또는 “유다 사람들의 왕.” 그리스어 ‘유대인’은 문맥에 따라 유대인들을 넓게 가리킬 수도 있고 유다 지역 사람들을 특별히 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  english_pob_choice: inscription
  chosen_korean: 명패
  alternatives_korean:
  - 글판
  - 표지문
  - 문구
  lexicon: BDAG
  rationale: 십자형 처형 맥락에서 제목이 아니라 위에 붙이는 공개 표식을 가리키므로, 한국어로는 자연스럽고 기능을 드러내는 ‘명패’가 적절합니다.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  english_pob_choice: put it on the cross
  chosen_korean: 십자 위에 붙였습니다
  alternatives_korean:
  - 십자에 놓았습니다
  - 십자에 달았습니다
  - 십자 위에 두었습니다
  lexicon: BDAG
  rationale: 원문은 ‘십자 위에’라는 위치 관계를 직접 말하므로, 의미를 보존하면서 한국어 관용에 맞게 ‘붙였습니다’로 옮겼습니다.
- source_word: Ἰησοῦς ὁ Ναζωραῖος
  english_pob_choice: Jesus the Nazarene
  chosen_korean: 나사렛 예수
  alternatives_korean:
  - 예수 나사렛 사람
  - 나사렛 사람 예수
  - 나사렛 예수님
  lexicon: BDAG
  rationale: Ναζωραῖος의 식별 기능을 살리되, 한국어 복음서 표현으로 널리 통용되는 ‘나사렛 예수’가 가장 자연스럽고 간결합니다.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  english_pob_choice: the King of the Jews
  chosen_korean: 유대인의 왕
  alternatives_korean:
  - 유다 사람들의 왕
  - 유대 사람들의 왕
  lexicon: BDAG
  rationale: POB의 기본 선택처럼 여기서는 공적 표제의 문구를 그대로 살려 ‘유대인의 왕’으로 번역했습니다. ‘유다인’보다는 이 장면의 정치·종교적 호칭 효과를 더 직접적으로 전달합니다.
theological_decisions:
- issue: Ἰουδαίων의 한국어 처리와 공적 표제의 뉘앙스
  chosen_reading: 유대인의 왕
  alternative_readings:
  - 유다 사람들의 왕
  - 유대 사람들의 왕
  rationale: 이 구절은 빌라도가 십자 위에 붙인 공식 문구를 전합니다. 따라서 본문이 의도한 공개적 조롱과 고발의 힘을 보존하기 위해, 일반적인 전승 표현인 ‘유대인의 왕’을 유지했습니다.
  doctrine_reference: translation philosophy §3; 본문의 역사적·서사적 긴장을 그대로 보존
