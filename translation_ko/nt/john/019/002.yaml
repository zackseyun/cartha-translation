lexical_decisions:
- source_word: οἱ στρατιῶται
  english_pob_choice: the soldiers
  chosen_korean: 군인들은
  alternatives_korean:
  - 병사들은
  - 군대 사람들은
  lexicon: BDAG
  rationale: 로마 병력을 가리키는 일반적 의미를 자연스러운 현대 한국어로 옮기되, 서술 문맥의 구체성을 유지하기 위해 ‘군인들’을 선택했습니다.
- source_word: πλέξαντες στέφανον ἐξ ἀκανθῶν
  english_pob_choice: after weaving a crown of thorns
  chosen_korean: 가시로 관을 엮어
  alternatives_korean:
  - 가시로 이루어진 왕관을 엮어
  - 가시 면류관을 엮어
  lexicon: BDAG
  rationale: ‘στέφανον’의 기본 이미지를 ‘관’으로 살리고, 재료/출처를 나타내는 ‘ἐξ ἀκανθῶν’은 ‘가시로’로 간결하게 옮겼습니다. ‘엮어’는 만드는 동작을 자연스럽게 보여 줍니다.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  english_pob_choice: put it on his head
  chosen_korean: 그의 머리에 씌우고
  alternatives_korean:
  - 그의 머리에 올려놓고
  - 그의 머리에 얹고
  lexicon: BDAG
  rationale: 머리에 무엇을 얹는 동작을 한국어에서 가장 자연스럽게 나타내는 동사로 ‘씌우다’를 택해, 본문의 왕관 모티프를 드러냈습니다.
- source_word: ἱμάτιον πορφυροῦν περιέβαλον αὐτόν
  english_pob_choice: clothed him in a purple garment
  chosen_korean: 그에게 자주색 겉옷을 입혔습니다
  alternatives_korean:
  - 그에게 자주색 옷을 입혔습니다
  - 그를 자주색 겉옷으로 감쌌습니다
  lexicon: BDAG
  rationale: ‘ἱμάτιον’은 단순한 옷보다 바깥에 걸치는 겉옷에 가깝기 때문에 ‘겉옷’이 더 구체적입니다. ‘πορφυροῦν’은 왕권을 암시하는 색이지만, 본문에 없는 해석어를 덧붙이지 않고 ‘자주색’으로 옮겼습니다.
theological_decisions:
- issue: 본문의 조롱적 왕권 상징을 얼마나 드러낼지
  chosen_reading: 조롱이라는 해설을 덧붙이지 않고, 관과 자주색 겉옷이라는 상징적 행동 자체를 그대로 제시했습니다.
  alternative_readings:
  - ‘조롱하며 가시관을 씌웠다’처럼 해석을 직접 삽입하는 번역
  - ‘왕관’으로 옮겨 왕권 모티프를 더 강하게 부각하는 번역
  rationale: 문맥상 조롱은 분명하지만, 본문이 직접 말하는 것은 군인들의 행동입니다. 해설을 추가하지 않고 원문의 표면 의미를 보존하는 것이 번역 원칙에 더 부합합니다.
  doctrine_reference: Maintain what the author meant for the audience to understand, and represent true and powerful meaning.
