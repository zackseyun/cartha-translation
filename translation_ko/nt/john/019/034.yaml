  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
  footnotes:
  - marker: a
    text: Or 'with a lance.'
    reason: lexical_alternative
  - marker: b
    text: Some interpreters understand 'blood and water' symbolically or sacramentally; others take it as a physical description. The Greek text itself does not explain the significance here.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 군인들 가운데 한 사람이 창으로[a] 예수님의 옆구리를 찔렀습니다. 그러자 곧 피와 물이 나왔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘랜스(lance)로’.
    reason: lexical_alternative
  - marker: b
    text: 어떤 해석자들은 ‘피와 물’을 상징적 또는 성례전적으로 이해하고, 다른 이들은 물리적 묘사로 봅니다. 헬라어 본문 자체는 여기서 그 의미를 설명하지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: BDAG
  rationale: 앞선 문맥과의 대조를 분명히 드러내면서도 한국어 서술 흐름에 자연스럽게 맞습니다.
- source_word: εἷς τῶν στρατιωτῶν
  english_pob_choice: one of the soldiers
  chosen_korean: 군인들 가운데 한 사람
  alternatives_korean:
  - 군인들 중 한 사람
  - 한 군인
  lexicon: BDAG
  rationale: 부분격 구조를 살려 ‘한 사람’이 군인들 집단 안에서 나온 인물임을 드러냈습니다.
- source_word: λόγχῃ
  english_pob_choice: with a spear
  chosen_korean: 창으로
  alternatives_korean:
  - 창으로써
  - 창으로 찔러
  lexicon: BDAG
  rationale: 군인이 사용하는 무기를 한국어에서 가장 자연스럽고 간결하게 옮겼으며, 영어 POB의 ‘spear’에 대응시켰습니다.
- source_word: τὴν πλευρὰν ἔνυξεν
  english_pob_choice: pierced his side
  chosen_korean: 그의 옆구리를 찔렀습니다
  alternatives_korean:
  - 그의 옆구리를 꿰찼습니다
  - 그의 옆구리를 찔러 넣었습니다
  lexicon: BDAG
  rationale: πλευρά의 기본 뜻을 ‘옆구리’로 살리고, ἔνυξεν의 ‘찌르다/꿰찌르다’ 의미를 간명하게 반영했습니다.
- source_word: εὐθὺς
  english_pob_choice: immediately
  chosen_korean: 곧
  alternatives_korean:
  - 즉시
  - 바로
  lexicon: BDAG
  rationale: 사건의 즉각성을 유지하되 한국어 서술에서 과도하게 딱딱해지지 않도록 했습니다.
theological_decisions:
- issue: ‘피와 물’의 의미를 본문에서 해석할지 여부
  chosen_reading: 주석 없이 문자적 현상으로 남겨 두었습니다.
  alternative_readings:
  - 성례전적 상징으로 읽기
  - 의학적·생리학적 현상으로 읽기
  rationale: 본문 자체가 의미를 설명하지 않으므로, POB의 원칙에 따라 해석을 본문에 끼워 넣지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
