  rationale: 예수님을 명시하여 원문의 문맥적 지시 대상을 한국어에서 분명히 했습니다. 또한 각주 표지를 해당 어구로 옮기고, a 각주를 λόγχῃ의 실제 어휘 대안으로 수정했습니다. ‘피와 물’은 해석을 덧붙이지 않은 채 본문에 그대로 보존했습니다.
  reviewer_model: gpt-5.6-terra
