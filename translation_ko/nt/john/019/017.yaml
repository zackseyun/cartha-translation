translation:
  language: ko
  text: 그리고 자기 십자가를 지고, 그는 ‘해골의 장소’라고 불리는 곳으로 나갔습니다. 그곳은 히브리어로[a] 골고다라고 불립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아람어로’로 이해할 수 있습니다. 요한의 ‘히브리어로’는 유대 지역에서 쓰인 셈어를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  english_pob_choice: carrying
  chosen_korean: 지고
  alternatives_korean:
  - 메고
  - 들고
  - 짊어지고
  lexicon: BDAG
  rationale: 십자가를 실제로 몸에 지고 가는 동작을 자연스러운 현대 한국어로 옮기면서, 단순 소지나 운반보다 짊어짐의 무게감을 살렸습니다.
- source_word: αὑτῷ τὸν σταυρόν
  english_pob_choice: the cross by himself
  chosen_korean: 자기 십자가를
  alternatives_korean:
  - 자기 자신을 위해 십자가를
  - 자기 혼자 십자가를
  - 그의 십자가를
  lexicon: BDAG
  rationale: 재귀적 뉘앙스를 한국어의 소유 표현으로 무리 없이 살리되, 영어처럼 ‘by himself’의 의미가 드러나도록 ‘자기’로 반영했습니다.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  english_pob_choice: the place called Skull Place
  chosen_korean: ‘해골의 곳’이라 불리는 곳
  alternatives_korean:
  - ‘해골 곳’이라 불리는 곳
  - ‘해골 자리’라 불리는 곳
  - ‘해골의 장소’라 불리는 곳
  lexicon: BDAG
  rationale: 직역적 의미인 κρανίον/τόπος의 결합을 유지하되, 한국어에서 자연스러운 지명 형식으로 ‘해골의 곳’을 사용했습니다.
- source_word: Ἑβραϊστί
  english_pob_choice: in Hebrew
  chosen_korean: 히브리어로
  alternatives_korean:
  - 아람어로
  - 히브리 말로
  lexicon: BDAG
  rationale: 본문의 표면 의미를 따라 ‘히브리어로’를 본문에 두고, 요한의 용례가 지역 셈어를 가리킬 수 있는 긴장은 본문을 바꾸지 않고 유지했습니다.
- source_word: Γολγοθα
  english_pob_choice: Golgotha
  chosen_korean: 골고다
  alternatives_korean:
  - 갈보리
  - 골고타
  lexicon: BDAG
  rationale: 고유 지명은 음역하여 표준적으로 널리 알려진 한국어 형태를 따랐습니다.
theological_decisions:
- issue: Ἑβραϊστί의 언어 지시가 ‘히브리어’인지 ‘아람어’인지의 긴장
  chosen_reading: 본문은 ‘히브리어로’라고 유지하고, 그 실제 용례가 지역 셈어를 포함할 수 있다는 해석은 주석으로 넘깁니다.
  alternative_readings:
  - ‘아람어로’로 본문 처리
  - ‘히브리 말로’로 완화
  rationale: 원문 표면을 우선 보존해야 하므로 본문은 Greek wording을 따르고, 가능한 역사언어적 뉘앙스는 본문을 훼손하지 않는 방식으로 남깁니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
