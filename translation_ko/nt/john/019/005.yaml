    text: 또는 “보라, 이 사람입니다.” Ἰδοὺ는 주의를 끄는 표현으로, “보십시오”, “보라”, “보세요”처럼 옮길 수 있습니다.
    reason: alternative_reading
  revision_rationale: 빌라도를 발화 주체로 명시하여 직전 문맥과 원문의 서술 구조를 회복했습니다. 예수님의 복장은 관과 겉옷에 맞는 동사를 각각 사용해 자연스럽게 옮겼으며, 역사적 현재는 ‘말합니다’로 보존했습니다. 각주도 ‘이 사람’으로 본문과 일치시켰습니다.
