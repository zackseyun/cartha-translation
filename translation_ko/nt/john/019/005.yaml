id: JHN.19.5
reference: John 19:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
  footnotes:
  - marker: a
    text: Or “Look, the man.” The Greek Ἰδοὺ is an attention-getting expression that can be rendered “Behold,” “Look,” or “See.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 예수님은 밖으로 나가셔서 가시관과 자주색 겉옷을 입고 계셨습니다. 그리고 그들에게 말씀하셨습니다. 「보십시오, 그 사람입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보라, 그 사람입니다.” Ἰδοὺ는 주의를 끄는 표현으로, “보십시오”, “보라”, “보세요”처럼 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  english_pob_choice: So ... came out
  chosen_korean: 그러므로 ... 밖으로 나가셔서
  alternatives_korean:
  - 그때 ... 나가셔서
  - 그래서 ... 나오셔서
  lexicon: BDAG
  rationale: οὖν의 이어짐을 '그러므로'로, ἐξῆλθεν ἔξω의 이동을 '밖으로 나가셔서'로 옮겨 장면 전환과 방향성을 분명히 했습니다.
- source_word: φορῶν
  english_pob_choice: wearing
  chosen_korean: 입고 계셨습니다
  alternatives_korean:
  - 쓰고 계셨습니다
  - 걸치고 계셨습니다
  lexicon: BDAG
  rationale: 왕관과 겉옷을 몸에 지닌 상태를 자연스럽게 드러내기 위해 '입고 계셨습니다'를 택했습니다.
- source_word: ἀκάνθινον στέφανον
  english_pob_choice: the crown of thorns
  chosen_korean: 가시관
  alternatives_korean:
  - 가시로 만든 왕관
  - 가시 왕관
  lexicon: BDAG
  rationale: 통용되는 한국어 표현이면서도 'στέφανον'의 왕관/관 형태를 유지하는 '가시관'을 사용했습니다.
- source_word: πορφυροῦν ἱμάτιον
  english_pob_choice: the purple robe
  chosen_korean: 자주색 겉옷
  alternatives_korean:
  - 자주색 옷
  - 보라색 겉옷
  lexicon: BDAG
  rationale: ἱμάτιον의 일반적 외투/겉옷 의미를 살리되, 조롱의 왕의 복장을 자연스럽게 드러내는 '겉옷'으로 옮겼습니다.
- source_word: Ἰδοὺ ὁ ἄνθρωπος
  english_pob_choice: Behold, the man.
  chosen_korean: 보십시오, 그 사람입니다.
  alternatives_korean:
  - 보라, 그 사람입니다.
  - 보십시오, 그 남자입니다.
  lexicon: BDAG
  rationale: Ἰδοὺ의 주목 환기 기능을 '보십시오'로 살리고, ὁ ἄνθρωπος는 특정 인물 예수를 가리키는 말로서 '그 사람'이 가장 자연스럽고 성별을 과도하게 강조하지도 않습니다.
theological_decisions:
- issue: Ἰδοὺ의 호명 방식
  chosen_reading: 공적 발표의 느낌을 살린 '보십시오'
  alternative_readings:
  - 보라
  - 보세요
  rationale: 빌라도가 군중 앞에 예수를 제시하는 장면의 공적·선언적 성격을 유지하기 위해, 일상적 권유보다 격식 있는 주목 환기 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
