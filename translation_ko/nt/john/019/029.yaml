id: JHN.19.29
reference: John 19:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
  footnotes:
  - marker: a
    text: Or 'vinegar.' The Greek term can denote sour wine or vinegar; here it likely refers to the sour wine drink available to soldiers.
    reason: lexical_alternative
  - marker: b
    text: Or 'on a hyssop branch' or 'with hyssop.' The Greek simply says 'on/with hyssop,' and the exact picture is debated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에 신 포도주가 가득 담긴 그릇이 놓여 있었습니다[a]. 그래서 그들은 신 포도주에 적신 해면을 우슬초에[b] 얹어 그분의 입에 가져다 대었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘식초’. 그리스어 ὄξος는 신 포도주나 식초를 가리킬 수 있는데, 여기서는 군인들이 마시던 신 포도주로 보는 것이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우슬초로’ 또는 ‘우슬초 위에’. 그리스어는 단지 ‘우슬초에/우슬초로’라고 하므로, 정확한 장면은 논의됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  english_pob_choice: container
  chosen_korean: 그릇
  alternatives_korean:
  - 용기
  - 통
  lexicon: BDAG
  rationale: σκεῦος는 여기서 특정한 식기보다 ‘무언가를 담는 물건’이라는 일반적 뜻이므로, 자연스러운 현대 한국어로는 ‘그릇’이 과도한 구체화 없이 전달됩니다.
- source_word: ὄξους
  english_pob_choice: sour wine
  chosen_korean: 신 포도주
  alternatives_korean:
  - 식초
  - 포도 식초
  lexicon: BDAG
  rationale: 문맥상 군인들이 마시던 음료로서의 ὄξος를 가리키므로, 조리용 ‘식초’보다 ‘신 포도주’가 더 정확하고 읽기 쉽습니다.
- source_word: ὑσσώπῳ
  english_pob_choice: on hyssop
  chosen_korean: 우슬초에
  alternatives_korean:
  - 우슬초로
  - 우슬초 위에
  lexicon: BDAG
  rationale: 그리스어는 ‘on/with hyssop’의 여지가 있어 단정적인 해석을 피하면서도, 본문 그대로 식물을 보존하기 위해 ‘우슬초에’로 옮겼습니다.
- source_word: προσήνεγκαν
  english_pob_choice: brought
  chosen_korean: 가져다 대었습니다
  alternatives_korean:
  - 가져왔습니다
  - 내밀었습니다
  lexicon: BDAG
  rationale: 예수님의 입 쪽으로 물건을 옮겨 대는 동작을 한국어로 가장 자연스럽게 드러내면서, 단순한 ‘제시’보다 구체적인 물리적 움직임을 살렸습니다.
theological_decisions:
- issue: ὑσσώπῳ의 상징성 보존
  chosen_reading: 본문의 표면 의미를 유지해 ‘우슬초’만 제시하고, 이 구절 안에서 유월절/정결 상징을 해설하지 않았습니다.
  alternative_readings:
  - ‘우슬초 가지’로 풀어 설명하기
  - 상징을 약화해 단순한 막대기로 처리하기
  rationale: 요한의 표현은 상징적 연상을 불러올 수 있지만 본문 자체가 그것을 설명하지 않으므로, 의미 가능성을 남긴 채 과잉 해석은 피했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
