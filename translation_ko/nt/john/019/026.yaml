  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
  footnotes:
  - marker: a
    text: Or 'Dear woman' or 'Madam.' The Greek address is respectful, not rude, though a literal English 'Woman' can sound harsher to modern readers.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 예수님께서는 어머니와 자신이 사랑하시던 제자가 곁에 서 있는 것을 보시고, 어머니에게 말씀하셨습니다. 「여인이여[a], 보십시오, 당신의 아들입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 호격 Γύναι는 글자 그대로는 ‘여인’이라는 뜻입니다. 현대 한국어 독자에게는 다소 낯설거나 거칠게 들릴 수 있으나, 본문에서 무례를 뜻하지는 않습니다. 또는 ‘부인이여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  english_pob_choice: when ... saw
  chosen_korean: 보시고
  alternatives_korean:
  - 보고
  - 보신 뒤
  lexicon: BDAG
  rationale: 부사적 aorist 분사로서 선행 행동을 나타내므로, 한국어에서는 자연스러운 연결형인 「보시고」로 옮겨 사건의 순서를 살렸습니다.
- source_word: ὃν ἠγάπα
  english_pob_choice: whom he loved
  chosen_korean: 사랑하시는
  alternatives_korean:
  - 사랑하던
  - 사랑한
  lexicon: BDAG
  rationale: 요한복음의 관용적 표지를 살려 현재형 느낌의 「사랑하시는」으로 옮기되, 예수님이 그 제자를 사랑하신다는 식별 기능을 유지했습니다.
- source_word: Γύναι
  english_pob_choice: Woman
  chosen_korean: 여인이여
  alternatives_korean:
  - 여자여
  - 부인
  lexicon: BDAG
  rationale: 직역된 「여자」는 한국어에서 거칠게 들릴 수 있어, 존중의 호격을 드러내는 「여인이여」로 옮겼습니다. 이는 본문의 직접성을 유지하면서도 무례한 뉘앙스를 피합니다.
- source_word: ἴδε
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  lexicon: BDAG
  rationale: 명령형의 주목 촉구를 한국어 공손체로 옮겨, 문맥상 엄숙한 지시의 힘을 살렸습니다.
theological_decisions:
- issue: 예수님의 어머니에 대한 호칭 Γύναι의 어조
  chosen_reading: 본문의 직접성을 살리되, 한국어에서는 존칭 호격 「여인이여」로 옮겨 존중의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - 여자여
  - 부인
  rationale: 원문은 무례를 뜻하지 않지만, 현대 한국어의 「여자」는 차갑게 들릴 수 있습니다. 따라서 어휘의 힘을 유지하면서도 예수님의 말씀이 경멸적으로 오해되지 않도록 조정했습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 수신자 오해 방지, 예수님의 언어적 존중성 보존'
