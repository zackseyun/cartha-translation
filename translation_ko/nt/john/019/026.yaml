- from: 예수님께서는 자기 어머니와 사랑하시는 제자가 서 있는 것을 보시고, 어머니에게 말씀하셨습니다. 「여인이여, 보십시오, 당신의 아들입니다」.[a]
  to: 이에 예수님께서는 어머니와 자신이 사랑하시던 제자가 곁에 서 있는 것을 보시고, 어머니에게 말씀하셨습니다. 「여인이여[a], 보십시오, 당신의 아들입니다.」
  rationale: 서술 연결을 나타내는 οὖν를 ‘이에’로, 제자가 가까이 서 있었음을 나타내는 παρεστῶτα를 ‘곁에 서 있는’으로 반영했습니다. ἠγάπα의 미완료 과거는 ‘사랑하시던’으로 옮겼습니다. Γύναι는 본문에서 직접적으로 보존하고, 그 존중의 뉘앙스와 가능한 대안을 각주로 설명했으며, 각주 앵커를 해당 호칭에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:52:02Z'
