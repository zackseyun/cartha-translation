revisions:
- from: 이 일 뒤에 예수께서는 모든 일이 이미 이루어진 것을 아시고, 성경이 이루어지게 하시려고 말씀하셨습니다. “내가 목마릅니다.”[a]
  to: 이 일이 있은 뒤에 예수께서는 모든 일이 이미 이루어진 것을 아시고, 성경이 이루어지도록 말씀하셨습니다. “목마릅니다.”[a]
  rationale: 시간 표현을 자연스럽게 다듬고, ἵνα τελειωθῇ ἡ γραφή의 목적절과 수동성을 ‘성경이 이루어지도록’으로 옮겨 사동적 신학 해석을 덧붙이지 않았습니다. Διψῶ는 현대 합쇼체 직접화법으로 ‘목마릅니다’라 하되, 전통적 표현은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:59Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘성경이 이루어지게 하시려고’는 예수께서 성경을 이루게 하신다는 사역적·사동적 뉘앙스를 불필요하게 강화합니다. 수동태 τελειωθῇ와 ἵνα의 목적 관계는 ‘성경이 이루어지도록’이 더 직접적이고 중립적으로 보존합니다.
  naturalness: ‘이 일 뒤에’보다 ‘이 일이 있은 뒤에’가 현대 표준 한국어 산문에서 더 자연스럽고, ‘목마릅니다’는 합쇼체 직접화법으로 자연스럽습니다. 주어 ‘내가’는 그리스어에 별도로 명시되지 않았으므로 생략하는 편이 간결합니다.
  terminology: ‘성경’, ‘이루어지다’, ‘말씀하셨습니다’는 적절합니다. 본문의 완료된 ‘모든 일’과 성경의 성취라는 표현상의 긴장은 유지됩니다.
  issues:
  - severity: medium
    issue: ‘성경이 이루어지게 하시려고’의 사동적 함의
    rationale: 그리스어는 ‘성경이 이루어지다/완성되다’라는 수동 표현이며, 이 문맥에서 한국어 사동 구문은 예수께서 성경을 이루게 하신다는 인과관계를 과도하게 명시할 수 있습니다. ‘성경이 이루어지도록’은 목적절과 수동성을 보존하면서 그러한 추가 함의를 피합니다.
  - severity: low
    issue: ‘이 일 뒤에’의 문체적 어색함
    rationale: 의미는 통하지만, 사건을 가리키는 시간 전환에는 ‘이 일이 있은 뒤에’가 더 자연스럽습니다.
  - severity: low
    issue: 직접화법의 불필요한 주어 ‘내가’
    rationale: Διψῶ에는 명시적 1인칭 대명사가 없으므로 한국어에서도 ‘목마릅니다’로 충분하며 더 자연스럽습니다.
  revised_text: 이 일이 있은 뒤에 예수께서는 모든 일이 이미 이루어진 것을 아시고, 성경이 이루어지도록 말씀하셨습니다. “목마릅니다.”[a]
  revised_footnotes:
