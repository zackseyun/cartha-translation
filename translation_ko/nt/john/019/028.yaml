    text: 더 전통적인 표현으로는 “내가 목마르다.”
    reason: lexical_alternative
  revision_rationale: 시간 표현을 자연스럽게 다듬고, ἵνα τελειωθῇ ἡ γραφή의 목적절과 수동성을 ‘성경이 이루어지도록’으로 옮겨 사동적 신학 해석을 덧붙이지 않았습니다. Διψῶ는 현대 합쇼체 직접화법으로 ‘목마릅니다’라 하되, 전통적 표현은 각주에 보존했습니다.
