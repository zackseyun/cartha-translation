id: JHN.19.28
reference: John 19:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
  footnotes:
  - marker: a
    text: Or, more traditionally, “I thirst.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일이 있은 뒤에 예수께서는 모든 일이 이미 이루어진 것을 아시고, 성경이 이루어지도록 말씀하셨습니다. “목마릅니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 전통적인 표현으로는 “내가 목마르다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  english_pob_choice: After this
  chosen_korean: 이 일 뒤에
  alternatives_korean:
  - 그 뒤에
  - 그 후에
  - 이후에
  lexicon: BDAG
  rationale: 지시어 τοῦτο의 지시성을 살리면서도 한국어 서술 흐름에 자연스럽게 맞추기 위해 ‘이 일 뒤에’로 옮겼습니다.
- source_word: εἰδὼς
  english_pob_choice: knowing
  chosen_korean: 아시고
  alternatives_korean:
  - 알고
  - 알고 계시고
  lexicon: BDAG
  rationale: 예수께 대한 존칭을 유지하면서, 동시적 상태를 나타내는 분사를 한국어 연결형으로 자연스럽게 표현했습니다.
- source_word: ἤδη πάντα τετέλεσται
  english_pob_choice: all things had already been completed
  chosen_korean: 모든 일이 이미 이루어진 것을
  alternatives_korean:
  - 모든 것이 이미 완성된 것을
  - 만사가 이미 끝난 것을
  lexicon: BDAG
  rationale: 완료 상태를 나타내는 τετέλεσται를 ‘이루어지다’로 옮겨, 단순 종결보다 ‘완성/성취’의 뉘앙스를 살렸습니다.
- source_word: ἵνα τελειωθῇ ἡ γραφή
  english_pob_choice: in order that the Scripture might be fulfilled
  chosen_korean: 성경이 이루어지게 하시려고
  alternatives_korean:
  - 성경이 성취되게 하시려고
  - 성경이 완성되게 하시려고
  lexicon: BDAG
  rationale: ἵνα의 목적 의미를 살리되, ἡ γραφή는 관용적으로 ‘성경’으로 옮겨 본문이 말하는 성취의 대상을 분명히 했습니다.
- source_word: Διψῶ
  english_pob_choice: I am thirsty
  chosen_korean: 내가 목마릅니다
  alternatives_korean:
  - 나는 목마릅니다
  - 내가 목마릅니다. “목마르다.”
  lexicon: BDAG
  rationale: 직설적이고 현대적인 표현으로 예수의 말문을 살리되, 주어를 분명히 드러내어 한국어 문장으로 자연스럽게 했습니다.
theological_decisions:
- issue: ἵνα τελειωθῇ ἡ γραφή의 목적/성취 뉘앙스
  chosen_reading: 예수의 말은 성경이 이루어지도록 하시는 목적을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 단순 결과로 ‘그리하여 성경이 이루어졌다’고 읽을 수 있음
  - ‘성경이 완성되게 하시려고’로 더 문자적으로 옮길 수 있음
  rationale: ἵνα의 목적성을 보존하면서도, 요한복음의 성경 성취 공식과 잘 맞는 한국어를 선택했습니다. 동시에 ‘이루다’는 표현으로 completion과 fulfillment의 긴장을 과도하게 해소하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
