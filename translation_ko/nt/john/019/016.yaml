revisions:
- from: 그때에 그러므로 그는 그들에게 넘겨 주어 십자가에 못 박히게 하셨습니다. 그러자 그들이 예수를 데려갔습니다.
  to: 그리하여 그는 그를 십자가에 못 박도록 그들에게[a] 넘겨주었습니다. 그러자 그들은 예수를 데려갔습니다.
  rationale: 연결 표현을 현대 표준 한국어에 맞게 다듬고, 부당한 높임말을 제거했습니다. 또한 ‘십자가에 못 박도록 … 넘겨주었습니다’로 목적절의 수동성과 사법적 인도 의미를 보존했습니다. 본문이 밝히지 않는 ‘그들’의 지시 대상은 각주와 본문에서 그대로 모호하게 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T08:51:55Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the unnamed recipients/actors and broadly conveys παρέδωκεν and παρέλαβον. However, “못 박히게 하셨습니다” introduces an inappropriate honorific toward the unnamed subject and can make him sound like the direct agent who performs the crucifixion. The Greek has a passive purpose clause; “십자가에 못 박히도록 … 넘겨주었습니다” represents it more faithfully.
  naturalness: “그때에 그러므로” is not idiomatic modern Korean connective usage. “그리하여” naturally carries the narrative progression and consequential sense of τότε οὖν. The revised wording is fluent formal-polite Korean.
  terminology: “십자가에 못 박히다” is an established and clear rendering of σταυρόω. “넘겨주었습니다” appropriately conveys the judicial transfer denoted by παραδίδωμι without specifying the recipients. “예수” is standard Korean biblical naming.
  issues:
  - severity: medium
    issue: Inappropriate honorific in “십자가에 못 박히게 하셨습니다”
    rationale: The formal ending -셨습니다 honors the subject (“he”), though the Greek does not encode honorification and the immediate referent is Pilate. It should be removed. Recasting the clause also more directly preserves the passive σκοπός/purpose construction.
  - severity: medium
    issue: Awkward duplicated connective “그때에 그러므로”
    rationale: Although τότε and οὖν both occur in Greek, a word-for-word sequence is unnatural in Korean. “그리하여” preserves the combined narrative-consequential relation without an unnatural duplication.
  revised_text: 그리하여 그는 그를 십자가에 못 박도록 그들에게[a] 넘겨주었습니다. 그러자 그들은 예수를 데려갔습니다.
  revised_footnotes:
  - marker: a
    text: ‘그들에게’와 이어지는 ‘그들은’이 누구를 가리키는지는 이 절에서 명시되지 않습니다. 가까운 문맥이 독자의 이해를 돕지만, 헬라어 본문은 그 집단의 이름을 밝히지 않습니다.
    reason: alternative_reading
  revision_rationale: 연결 표현을 현대 표준 한국어에 맞게 다듬고, 부당한 높임말을 제거했습니다. 또한 ‘십자가에 못 박도록 … 넘겨주었습니다’로 목적절의 수동성과 사법적 인도 의미를 보존했습니다. 본문이 밝히지 않는 ‘그들’의 지시 대상은 각주와 본문에서 그대로 모호하게 유지했습니다.
