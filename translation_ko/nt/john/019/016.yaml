id: JHN.19.16
reference: John 19:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
  footnotes:
  - marker: a
    text: Or, 'Then he handed him over to them to be crucified.' The Greek purpose clause can be rendered more compactly in English.
    reason: lexical_alternative
  - marker: b
    text: The pronouns 'them' and 'they' are not explicitly identified in this verse; the immediate context informs the reader, but the Greek here does not name the group.
    reason: alternative_reading
translation:
  language: ko
  text: 그때에 그러므로 그는 그들에게 넘겨 주어 십자가에 못 박히게 하셨습니다. 그러자 그들이 예수를 데려갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε οὖν
  english_pob_choice: Then / therefore
  chosen_korean: 그때에 그러므로
  alternatives_korean:
  - 그때에 그래서
  - 그리하여
  lexicon: BDAG
  rationale: τότε와 οὖν의 시간적·결과적 연결을 함께 살리되, 한국어에서는 두 연결을 자연스럽게 겹쳐 표현했습니다.
- source_word: παρέδωκεν
  english_pob_choice: handed ... over
  chosen_korean: 넘겨 주어
  alternatives_korean:
  - 내주어
  - 인도하여
  lexicon: BDAG
  rationale: 법적·권위적 인도 의미를 살리면서도 한국어에서 자연스럽고 서술 흐름에 맞는 표현을 택했습니다.
- source_word: ἵνα σταυρωθῇ
  english_pob_choice: to be crucified / so that he might be crucified
  chosen_korean: 십자가에 못 박히게 하셨습니다
  alternatives_korean:
  - 십자가에 못 박히도록 하셨습니다
  - 십자가형을 받게 하셨습니다
  lexicon: BDAG
  rationale: ἵνα의 목적성을 한국어 부사절로 풀면서도 수동의 결과를 분명히 드러냈습니다.
- source_word: Παρέλαβον ... τὸν Ἰησοῦν
  english_pob_choice: they took Jesus
  chosen_korean: 그들이 예수를 데려갔습니다
  alternatives_korean:
  - 그들이 예수를 붙잡았습니다
  - 그들이 예수를 받아갔습니다
  lexicon: BDAG
  rationale: παραλαμβάνω의 ‘데려가다/데리고 가다’ 뉘앙스를 살려, 이후 처형 장면으로 이어지는 서술에 맞게 옮겼습니다.
theological_decisions:
- issue: ‘them/they’의 지시 대상 비명시성
  chosen_reading: 주어와 목적어를 모두 ‘그들’로 유지해 구체적 집단을 이름 붙이지 않았습니다.
  alternative_readings:
  - 대제사장들과 그들의 하인들로 구체화
  - 로마 병사들로 구체화
  rationale: 본문이 이 절에서 지시 대상을 명시하지 않으므로, 번역도 그 모호성을 보존해 독자가 문맥으로 판단하도록 남겼습니다.
  doctrine_reference: 본문의 지시 대상을 번역이 과잉 확정하지 않음
- issue: 수동 목적절의 한국어 표기
  chosen_reading: ‘십자가에 못 박히게 하셨습니다’로 목적과 결과를 함께 드러냈습니다.
  alternative_readings:
  - ‘십자가에 못 박히도록 하셨습니다’
  - ‘십자가형을 받게 하셨습니다’
  rationale: 헬라어 ἵνα의 목적 의미를 살리면서도 서술문으로 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 목적/결과의 문법 기능 보존
