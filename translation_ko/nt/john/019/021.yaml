review_pass:
  verdict: revise
  source_fidelity: 그리스어의 미완료 과거 ἔλεγον은 ‘말하고 있었습니다’로 적절히 반영되었습니다. 그러나 ἐκεῖνος는 단순한 인칭대명사보다 지시성이 있으므로 ‘그 사람이’로 옮기는 편이 더 충실합니다. 또한 ‘유다 사람들’은 Ἰουδαῖοι의 지리적 대안으로는 부정확합니다. 유다(Judah)가 아니라 유대(Judea)를 가리키므로 ‘유대 사람들’로 고쳐야 합니다.
  naturalness: ‘유대인들의 왕’도 이해되지만, 한국어의 관용적 왕호와 반복되는 표제 표현에는 ‘유대인의 왕’이 더 자연스럽고 간결합니다. 부정 명령과 대안적 요구는 ‘쓰지 마시고 … 쓰십시오’로 자연스럽게 연결됩니다.
  terminology: ἀρχιερεῖς는 복수의 지도적 제사장들을 가리키므로 ‘대제사장들’이 적절합니다. Ἰουδαίων은 본문에서 통용되는 왕호에 따라 ‘유대인’으로 유지하고, 지리적 의미 가능성은 ‘유대 사람들’이라는 각주로 보존합니다. 영어 각주 b의 정관사 유무는 한국어에는 적용되지 않으므로 별도 각주가 필요하지 않습니다.
  issues:
  - severity: medium
    issue: 각주의 ‘유다 사람들’
    rationale: Ἰουδαῖοι의 가능한 지리적 의미는 Judeans, 곧 ‘유대 사람들’입니다. ‘유다 사람들’은 Judah와 Judea를 혼동할 소지가 있어 원어의 지리적 대안을 정확히 전달하지 못합니다.
  - severity: low
    issue: ἐκεῖνος를 ‘그가’로 처리
    rationale: 문법적으로 가능하지만, 지시대명사 ἐκεῖνος의 표시성을 충분히 드러내지 못합니다. ‘그 사람이’는 불필요하게 ‘주장했다’ 등으로 강화하지 않으면서도 그 지시성을 보존합니다.
  - severity: low
    issue: 반복되는 왕호의 한국어 표현
    rationale: ‘유대인의 왕’은 한국어 성경 문체와 왕호 표현에 더 자연스럽고, 두 인용문의 동일한 문구도 명확히 유지합니다.
  revised_text: 이에 유대인의 대제사장들이 빌라도에게[a] 말하고 있었습니다. “‘유대인의 왕’이라고 쓰지 마시고, 오히려 그 사람이 ‘나는 유대인의 왕이다’라고 말했다고 쓰십시오.”
  revised_footnotes:
