- from: 그래서 유대인들의 대제사장들이 빌라도에게[a] 말하고 있었습니다. "쓰지 마십시오. ‘유대인들의 왕’이라고 하지 말고, 오히려 그가 ‘나는 유대인들의 왕이다’라고 말했다고 쓰십시오."
