id: JHN.19.9
reference: John 19:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
  footnotes:
  - marker: a
    text: Or 'praetorium,' the Roman governor’s official residence or headquarters.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 다시 총독 관저[a]로 들어가 예수님께 말했습니다. “어디에서 오셨습니까?” 그러나 예수님은 그에게 아무 대답도 하지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘총독 관저’는 πραιτώριον의 기능을 풀어 옮긴 것입니다. 원어를 음역하면 ‘프라이토리움’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν
  english_pob_choice: entered the governor’s headquarters again
  chosen_korean: 다시 총독 관저로 들어가
  alternatives_korean:
  - 다시 총독 관저에 들어가
  - 다시 총독의 본관으로 들어가
  - 다시 프라이토리움으로 들어가
  lexicon: BDAG
  rationale: πραιτώριον은 로마 총독의 공식 거처/집무 공간을 가리키므로, 기능을 드러내는 ‘총독 관저’가 가장 분명합니다. εἰσῆλθεν은 자연스러운 서술로 ‘들어가’로 옮겼습니다.
- source_word: λέγει
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말합니다
  - 이르렀습니다
  lexicon: BDAG
  rationale: 헬라어 역사적 현재를 한국어에서는 자연스러운 서술 과거로 옮겨 장면의 흐름을 살렸습니다.
- source_word: Πόθεν εἶ σύ;
  english_pob_choice: Where are you from?
  chosen_korean: 어디에서 오셨습니까?
  alternatives_korean:
  - 어디서 오셨습니까?
  - 어디 출신입니까?
  lexicon: BDAG
  rationale: πόθεν은 출처/기원을 묻는 표현이므로 단순 위치보다 기원성을 살려 ‘어디에서 오셨습니까?’로 옮겼습니다. 존대형으로 처리해 예수님께 하는 질문의 호칭을 반영했습니다.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  english_pob_choice: gave him no answer
  chosen_korean: 아무 대답도 하지 않으셨습니다
  alternatives_korean:
  - 그에게 아무 대답도 주지 않으셨습니다
  - 그에게 대답하지 않으셨습니다
  lexicon: BDAG
  rationale: 직역상 ‘대답을 주지 않다’이지만, 한국어에서는 ‘아무 대답도 하지 않다’가 더 자연스럽고 의미도 보존합니다. 예수님의 침묵을 분명히 드러내기 위해 보조 어휘를 최소화했습니다.
- source_word: τῷ Ἰησοῦ
  english_pob_choice: to Jesus
  chosen_korean: 예수님께
  alternatives_korean:
  - 예수께
  - 예수에게
  lexicon: Modern Korean biblical usage
  rationale: 화자와 대상이 예수님이므로 존대 조사와 호칭을 사용해 한국어 서술의 예의와 일관성을 유지했습니다.
theological_decisions:
- issue: 예수님의 침묵의 표현 방식
  chosen_reading: ‘아무 대답도 하지 않으셨습니다’로 옮겨, 단순한 무응답이 아니라 의도적 침묵이라는 본문 효과를 유지했습니다.
  alternative_readings:
  - ‘대답하지 않으셨습니다’
  - ‘그에게 아무 말도 하지 않으셨습니다’
  rationale: 원문은 ἀπόκρισιν(대답)을 명시하므로, 대답의 부재를 분명히 드러내는 표현이 가장 충실합니다.
  doctrine_reference: 본문 주해 수준의 서술 선택
