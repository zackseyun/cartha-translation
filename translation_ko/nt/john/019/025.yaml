  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Now standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
  footnotes:
  - marker: a
    text: Or 'Mary of Clopas'; the Greek does not explicitly state the relationship, though 'wife of Clopas' is a common interpretation.
    reason: lexical_alternative
  - marker: b
    text: The Greek may also be read as naming three women rather than four, if 'his mother's sister' is taken to be the same person as 'Mary of Clopas.'
    reason: alternative_reading
translation:
  language: ko
  text: 예수의 십자가 곁에는 그의 어머니와 그의 어머니의 자매, 글로바의 아내 마리아와 막달라 마리아가 서 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '글로바의 마리아'로 읽을 수 있습니다. 그리스어는 관계를 명시적으로 '아내'라고 말하지 않지만, 그렇게 이해하는 해석이 널리 받아들여집니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 '그의 어머니의 자매'와 '글로바의 마리아'를 같은 인물로 볼 수도 있어, 여인들을 셋으로 이해할 가능성이 있습니다.
    reason: alternative_reading
