- from: 이 일들 뒤에 아리마대 출신 요셉이 빌라도에게 요청했습니다. 그는 예수님의 제자였지만, 유대인들에 대한 두려움 때문에 그것을 숨기고 있었습니다. 그는 예수님의 시신을 가져가려 했습니다. 빌라도는 허락했습니다. 그래서 그가 와서 예수님의 시신을 가져갔습니다.[a]
  to: 이 일들이 있은 뒤에, 아리마대 출신인 요셉이 빌라도에게 예수님의 시신을 가져가게 해 달라고 요청했습니다. 그는 예수님의 제자였지만, 유대인들을 두려워하여 제자라는 사실을 숨기고 있었습니다. 빌라도가 허락하자, 요셉은 와서 예수님의 시신을 가져갔습니다.[a]
  rationale: 요청의 목적을 '가져가게 해 달라고 요청했습니다'로 연결하여 ἠρώτησεν ... ἵνα ἄρῃ의 통사 관계를 보존했습니다. 제자됨을 숨긴 상태는 문맥상 숨겨진 내용을 명시하되, 원문의 '유대인들'은 본문에 그대로 유지했습니다. '빌라도가 허락하자'는 ἐπέτρεψεν 및 이어지는 οὖν의 순차적 연결을 자연스럽게 반영합니다.
  reviewer_model: gpt-5.6-terra
