id: JHN.19.38
reference: John 19:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
  footnotes:
  - marker: a
    text: Or, more specifically in context, 'the Judean/Jewish authorities'—John often uses 'the Jews' for those opposing Jesus, not for the Jewish people without distinction.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일들이 있은 뒤에, 아리마대 출신인 요셉이 빌라도에게 예수님의 시신을 가져가게 해 달라고 요청했습니다. 그는 예수님의 제자였지만, 유대인들을 두려워하여 제자라는 사실을 숨기고 있었습니다. 빌라도가 허락하자, 요셉은 와서 예수님의 시신을 가져갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 '유대인들'은 문맥상 예수님을 대적하던 유대인 지도층을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  english_pob_choice: After these things
  chosen_korean: 이 일들 뒤에
  alternatives_korean:
  - 그 후에
  - 이런 일들 뒤에
  lexicon: BDAG
  rationale: 복수 지시어 ταῦτα를 살려 사건의 연속을 자연스럽게 나타내면서도 요한의 서술 전환을 유지합니다.
- source_word: ἀπὸ Ἁριμαθαίας
  english_pob_choice: from Arimathea
  chosen_korean: 아리마대 출신
  alternatives_korean:
  - 아리마대에서 온
  - 아리마대 사람
  lexicon: BDAG
  rationale: ἀπό의 출신/연고 의미를 반영해 요셉의 배경을 분명히 하되, 한국어에서는 '출신'이 가장 간결하고 자연스럽습니다.
- source_word: κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων
  english_pob_choice: having kept it hidden because of fear of the Jews
  chosen_korean: 유대인들에 대한 두려움 때문에 그것을 숨기고 있었습니다
  alternatives_korean:
  - 유대인들을 두려워하여 숨고 있었습니다
  - 유대인들을 무서워해 그것을 숨겼습니다
  lexicon: BDAG
  rationale: 완료분사 κεκρυμμένος의 지속 상태를 '숨기고 있었습니다'로 살리고, 한국어에서 자연스럽도록 숨겨진 대상인 제자됨을 '그것'으로 받았습니다.
- source_word: τῶν Ἰουδαίων
  english_pob_choice: the Jews
  chosen_korean: 유대인들
  alternatives_korean:
  - 유대인들
  - 유대 지도자들
  - 유대인들(곧 예수님을 대적하던 유대 지도층)
  lexicon: BDAG
  rationale: 원문 표현을 그대로 살리되, 현대 한국어 독자가 민족 전체로 오해하지 않도록 문맥상 대적 집단을 떠올리게 하는 표현을 유지했습니다.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  english_pob_choice: that he might take away the body of Jesus
  chosen_korean: 예수님의 시신을 가져가려 했습니다
  alternatives_korean:
  - 예수님의 몸을 치우려 했습니다
  - 예수님의 시신을 옮기려 했습니다
  lexicon: BDAG
  rationale: αἴρω는 여기서 장례를 위해 시신을 '가져가다/옮기다'는 뜻이므로, 한국어에서는 문맥에 맞는 '시신을 가져가다'로 옮겼습니다.
- source_word: ἦρεν τὸ σῶμα αὐτοῦ
  english_pob_choice: took away his body
  chosen_korean: 예수님의 시신을 가져갔습니다
  alternatives_korean:
  - 그의 시신을 가져갔습니다
  - 시신을 거두어 갔습니다
  lexicon: BDAG
  rationale: 앞의 목적절과 어휘를 맞추어 αἴρω를 일관되게 '가져가다'로 번역했고, αὐτοῦ는 한국어 문맥상 예수님으로 명료합니다.
theological_decisions:
- issue: τῶν Ἰουδαίων의 한국어 처리와 오해 가능성
  chosen_reading: 본문에는 '유대인들'을 유지하되, 문맥상 예수님을 대적하던 집단을 가리킨다는 점을 드러내는 방식으로 번역했습니다.
  alternative_readings:
  - 유대 지도자들
  - 유대인들에 대한 두려움 때문에
  rationale: 원문 표현을 바꾸어 좁히기보다, 본문 자체의 말투를 보존하면서 독자가 문맥을 오해하지 않도록 했습니다.
  doctrine_reference: 번역 원칙 1, 3, 6
