id: JHN.19.24
reference: John 19:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
  footnotes:
  - marker: a
    text: Or 'draw lots for it.'
    reason: lexical_alternative
  - marker: b
    text: Quoted from Psalm 22:18.
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 그들은 서로에게 말했습니다. 「이것을 찢지 말고, 누구의 것이 될지 정하려고 제비를 뽑읍시다.」 이는 「그들의 옷을 서로 나누고, 내 옷을 두고는 제비를 뽑았습니다」라고 한 성경이 이루어지게 하려는 것이었습니다. 병사들은 이렇게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제비를 뽑아 정하자.’
    reason: lexical_alternative
  - marker: b
    text: 시편 22:18을 인용합니다.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ σχίσωμεν αὐτόν
  english_pob_choice: Let us not tear it
  chosen_korean: 이것을 찢지 말고
  alternatives_korean:
  - 이것을 찢지 말자
  - 그것을 찢지 말고
  lexicon: BDAG
  rationale: σχίσωμεν은 천이나 물건을 찢는 뜻이므로, 문맥상 옷을 가리키는 대명사는 한국어에서도 자연스럽게 중성적 지시어 ‘이것’을 쓰는 것이 가장 분명합니다.
- source_word: λάχωμεν περὶ αὐτοῦ τίνος ἔσται
  english_pob_choice: cast lots for it to decide whose it will be
  chosen_korean: 누구의 것이 될지 정하려고 제비를 뽑읍시다
  alternatives_korean:
  - 그것이 누구의 것이 될지 정하기 위해 제비를 뽑읍시다
  - 누구의 것이 될지 알기 위해 제비를 뽑읍시다
  lexicon: BDAG
  rationale: λάχωμεν은 제비를 뽑아 정하는 관용구이므로 ‘제비를 뽑다’로 옮기되, τίνος ἔσται의 목적을 한국어답게 풀어 ‘누구의 것이 될지 정하다’로 표현했습니다.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  english_pob_choice: so that the Scripture might be fulfilled
  chosen_korean: 이는 … 성경이 이루어지게 하려는 것이었습니다
  alternatives_korean:
  - 이는 … 성경이 성취되게 하려는 것이었습니다
  - 이는 … 성경이 이루어지도록 하려는 것이었습니다
  lexicon: BDAG
  rationale: 요한복음의 성취 공식을 따라 ‘이루어지다’로 옮겨, 성경의 예언/기록이 사건 속에서 성취된다는 뜻을 자연스럽게 드러냈습니다.
- source_word: Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον
  english_pob_choice: They divided my garments among themselves, and for my clothing they cast a lot
  chosen_korean: 그들의 옷을 서로 나누고, 내 옷을 두고는 제비를 뽑았습니다
  alternatives_korean:
  - 내 옷들을 서로 나누고, 내 속옷을 두고는 제비를 뽑았습니다
  - 내 의복을 서로 나누고, 내 겉옷을 두고는 제비를 뽑았습니다
  lexicon: BDAG
  rationale: ἱμάτια와 ἱματισμός의 두 표현을 한국어에서 모두 ‘옷’으로 옮기되, 시편 인용의 흐름을 살려 반복을 피하고 자연스러운 성경체로 정리했습니다.
theological_decisions:
- issue: 병사들의 행위와 성경 성취의 관계
  chosen_reading: 사건이 성경을 이루게 되었다는 요한의 서술을 그대로 살리되, 그 인과를 과도하게 설명하지는 않았습니다.
  alternative_readings:
  - ‘성경이 성취될 수 있도록’으로 더 직역하기
  - 결과 의미로만 약화해 읽기
  rationale: 본문은 병사들의 행동이 성경의 성취와 연결된다고 말하지만, 그 기계적 방식까지 풀어 설명하지는 않으므로 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 성경 성취의 진술을 유지하되 섭리의 작동 방식은 본문 이상으로 규정하지 않음
