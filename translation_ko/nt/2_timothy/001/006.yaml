  source_fidelity: 핵심 의미는 대체로 잘 반영했으나, 「불일듯이 일으키십시오」는 현대 한국어에서 다소 부자연스럽고 띄어쓰기에도 문제가 있습니다. 또한 「내 손을 그대 위에 얹음으로써」는 가능하나, 원문의 수단 관계를 더 자연스럽게 나타내도록 다듬는 편이 좋습니다.
  naturalness: 「그대에게 일깨워 줍니다」는 합쇼체의 권면 「하십시오」와 높임의 균형이 다소 맞지 않습니다. 「일깨워 드립니다」와 「다시 불붙이십시오」가 현대적이고 자연스러운 formal-polite 문장입니다.
  terminology: χάρισμα를 「하나님의 선물」로 옮긴 것은 원문과 영어 POB의 비신조적 표현을 잘 보존합니다. ἐπίθεσις τῶν χειρῶν은 「내 손을 얹음」으로 풀어 옮겨 의례적 행위를 과도하게 해석하지 않았습니다. 각주에서는 「은사」나 권면의 강도를 본문 이상으로 설명하지 않고 어휘적 불 이미지에 한정하는 것이 좋습니다.
