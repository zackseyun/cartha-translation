  to: 나는 그대 안에 있는 거짓 없는 믿음을 기억하게 되어, 그 믿음이 먼저 그대의 할머니 로이스와 어머니 유니게 안에 깃들었고 그대 안에도 있음을 확신합니다.
  rationale: 원문의 분사구문과 주절의 관계를 ‘기억하게 되어 … 확신합니다’로 보존하고, 혈통 방향을 단정하는 ‘외할머니’를 중립적인 ‘할머니’로 바로잡았습니다. ἐνοικέω의 내주·거주 이미지는 자연스러운 한국어인 ‘깃들다’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
