  source_fidelity: ‘외할머니’는 원문 μάμμῃ(할머니)가 제공하지 않는 모계 혈연 정보를 단정합니다. 또한 첫 절의 분사구문(‘기억하게 되어/상기되어’)이 독립문 ‘떠오릅니다’로 처리되어, 뒤의 ‘확신합니다’와의 문법적 연결이 약화되었습니다.
  naturalness: ‘믿음이 떠오릅니다’도 이해되지만, 이 문맥에서는 ‘믿음을 기억하게 되어 … 확신합니다’가 자연스럽고 원문의 논리 관계를 더 잘 드러냅니다. ‘안에 살아 있었고’는 다소 어색하므로 ‘안에 깃들었고’가 자연스럽습니다.
  terminology: ‘거짓 없는 믿음’, ‘로이스’, ‘유니게’, ‘확신합니다’는 적절합니다. 친족 명칭은 혈통 방향을 덧붙이지 않은 ‘할머니’가 적합합니다.
  issues:
