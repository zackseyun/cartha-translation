  naturalness: 초안은 대체로 자연스럽고 합쇼체도 일관됩니다. 다만 「내가 누구를 믿어 왔는지」보다 「내가 믿어 온 분을」이 한국어에서 더 매끄러우며, 문장 전체의 인과 관계도 자연스럽게 연결할 수 있습니다.
