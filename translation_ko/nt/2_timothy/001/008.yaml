  naturalness: 합쇼체 문장은 자연스럽습니다. 다만 ‘주의 죄수가 된 나도 부끄러워하지 마십시오’는 한국어상 ‘나 역시 부끄러워하지 말라’처럼 읽힐 여지가 있어, ‘또한 주의 죄수인 나를 부끄러워하지 마십시오’가 훨씬 명료하고 자연스럽습니다.
