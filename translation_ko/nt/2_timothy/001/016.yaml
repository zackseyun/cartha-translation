  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 οἶκος는 물리적 건물보다 오네시보로에게 속한 가정·식구들을 가리키므로 「집」보다 「집안」이 적절합니다. ἀνέψυξεν은 바울에게 안도와 기력을 주었다는 뜻으로, 「새 힘으로 일으켜 주다」보다 「새 힘을 주다」가 원문의 의미를 더 직접적이고 자연스럽게 전달합니다.
