  source_fidelity: 현 초안은 ἀγαπητῷ τέκνῳ를 수신자 디모데의 성별에 맞추어 「사랑하는 아들」로 옮긴 점은 가능하지만, 원문에 없는 「편지합니다」를 보태고 인사문의 형식을 다소 자유롭게 확장했습니다. 또한 원문의 은혜·자비·평강이 하나님과 주 메시아 예수에게서 온다는 구조를 더 직접적으로 드러내는 편이 좋습니다.
  naturalness: 「사랑하는 자녀인 디모데에게」는 현대 표준 한국어에서 영적·관계적 자녀라는 비유를 보존하면서 자연스럽습니다. 「…있기를 바랍니다」는 합쇼체의 현대적인 인사·축원 표현입니다.
  terminology: 「은혜, 자비, 평강」, 「아버지 하나님」, 「우리 주 메시아 예수」는 적절합니다. Χριστός의 의미를 살린 「메시아」와 대안 「그리스도」의 각주는 영어 POB의 방침 및 원문과 일치합니다.
  issues:
