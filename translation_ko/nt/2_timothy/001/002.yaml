    issue: 원문에 없는 「편지합니다」의 첨가
    rationale: Τιμοθέῳ ἀγαπητῷ τέκνῳ는 수신자 표지이며 ‘편지합니다’라는 동사를 포함하지 않습니다. 한국어 문장 성립을 위해 필수적이지 않으므로 삭제하는 것이 최적 등가와 원문 충실성에 더 맞습니다.
  - severity: low
    issue: 「함께하기를 빕니다」가 축원의 내용을 다소 관용적으로 확장함
    rationale: 원문은 ‘은혜, 자비, 평강—…로부터’라는 명사적 인사입니다. ‘있기를 바랍니다’는 현대 합쇼체로 자연스럽게 문장을 완결하면서도 원문의 축원 구조를 더 가깝게 반영합니다.
  revised_text: 사랑하는 자녀인 디모데에게. 아버지 하나님과 우리 주 메시아 예수께로부터 은혜와 자비와 평강이 있기를 바랍니다.
  revised_footnotes:
  - marker: a
    text: 또는 「그리스도」. 그리스어 Χριστός는 칭호이므로, 본 번역에서는 그 뜻을 살려 「메시아」로 옮깁니다.
    reason: lexical_alternative
  revision_rationale: 수신자 표지에 원문에 없는 서간 동사를 덧붙이지 않고, τέκνον의 관계적 비유를 「자녀」로 보존했습니다. 인사문의 출처와 축원 내용을 원문 어순과 의미에 가깝게 정리했으며, 현대 합쇼체에 맞추어 「있기를 바랍니다」를 사용했습니다. 각주는 메시아/그리스도라는 번역 대안을 명료하게 제시합니다.
