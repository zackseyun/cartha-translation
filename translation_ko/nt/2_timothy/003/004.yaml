  source_fidelity: 「배신하고」는 προδόται(배신자들)를 행위로 바꾸므로, 이 덕목 목록의 인물 규정을 더 직접적으로 반영하는 명사적 표현이 필요합니다. τετυφωμένοι는 완료 수동 분사로서 일시적 ‘우쭐댐’보다 교만에 빠진 지속 상태를 나타내는 표현이 더 적절합니다. 나머지 비교 구문은 원문의 대조를 충실히 반영합니다.
  naturalness: 수정문은 앞 절에서 이어지는 ‘사람들은 … 할 것입니다’라는 미래 서술 안에서 자연스럽게 연결됩니다. 병렬 목록에는 「-이며/-하고/-있으며」를 사용해 한국어 문장 흐름을 유지했습니다.
  terminology: προδόται는 「배신자들이며」, προπετεῖς는 「무모하고」, τετυφωμένοι는 「교만에 빠져 있으며」로 옮겼습니다. φιλήδονοι와 φιλόθεοι의 대조는 「하나님을 사랑하기보다 쾌락을 사랑할 것입니다」로 보존했습니다.
