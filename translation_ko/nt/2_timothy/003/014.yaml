  source_fidelity: 핵심 의미는 대체로 반영했으나, 원문의 εἰδὼς(‘알면서/알고’)가 초안에서는 독립절처럼 처리되어 절이 미완성으로 끝납니다. 또한 ‘그대가 배워 확신하게 된 그것’은 관계와 대상을 불필요하게 중복합니다.
  naturalness: ‘그대는 누구에게서 배웠는지를 알고 있고,’는 문장이 연결되지 않은 채 끝나므로 현대 한국어로 자연스럽지 않습니다. 원문의 분사적 관계를 유지하면서 완결된 문장으로 다듬는 것이 필요합니다.
  terminology: ‘확신하게 된’은 ἐπιστώθης의 문맥상 의미를 잘 전달합니다. ‘머무르십시오’도 μένε ἐν의 비유를 보존하는 적절한 표현입니다. τίνων의 복수는 한국어 ‘누구에게서’가 단복수를 특정하지 않아 본문의 개방성을 유지합니다.
  issues:
