    rationale: 문맥상 유대 성경 문헌을 가리키지만, 해당 각주는 어휘 대안을 설명하는 자리입니다. 시대 구분의 용어를 단정적으로 덧붙이지 않는 편이 더 절제되고 정확합니다.
