  revised_text: 박해와 고난도 따랐습니다. 안디옥과 이고니온과 루스드라에서 내게 일어났던 일들, 내가 어떤 박해들을 견뎌 냈는지 말입니다. 그리고 그 모든 것에서 주께서 나를 건져 주셨습니다.
