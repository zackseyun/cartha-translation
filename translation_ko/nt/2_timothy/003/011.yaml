  source_fidelity: 원문의 박해와 고난, 세 지명, 견딤, 그리고 주님의 구출을 모두 충실히 반영합니다. 다만 οἵους διωγμούς의 질적·감탄적 강조는 「그러한 박해들」보다 「어떤 박해들을」로 옮기는 편이 더 직접적입니다.
  naturalness: 합쇼체 문체와 전후 문맥을 잇는 「따랐습니다」는 자연스럽습니다. 「내게」가 「나에게」보다 현대 표준어 문맥에서 조금 더 간결하며, 반복된 박해의 표현도 더 자연스럽게 다듬을 수 있습니다.
  terminology: 「박해」, 「고난」, 「안디옥」, 「이고니온」, 「루스드라」, 「주」, 「건져 주셨습니다」는 적절합니다. 「주」는 원문의 ὁ κύριος를 넘어서 예수라는 이름을 보태지 않고 그대로 보존합니다.
