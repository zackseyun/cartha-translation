  to: 박해와 고난도 따랐습니다. 안디옥과 이고니온과 루스드라에서 내게 일어났던 일들, 내가 어떤 박해들을 견뎌 냈는지 말입니다. 그리고 그 모든 것에서 주께서 나를 건져 주셨습니다.
  rationale: οἵους διωγμούς의 질적 강조를 「어떤 박해들을」로 반영하고, 「나에게」를 간결한 「내게」로 다듬었습니다. 나머지 표현은 원문의 전후 문맥상 앞 절의 「따랐습니다」를 이어 가는 구조, 지명 표기, 그리고 ἐρρύσατο의 구출 의미를 유지합니다.
