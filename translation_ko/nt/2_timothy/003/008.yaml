review_pass:
  verdict: revise
  source_fidelity: 핵심 비교 구조와 동사의 시제 대비(얀네와 얌브레의 과거 행동, 이 사람들의 현재적 반대)는 보존되어 있습니다. 그러나 νοῦς를 「마음」으로 옮기면 정서·의지의 뜻이 강해져 사고·판단 능력을 가리키는 원문의 초점이 다소 흐려집니다. 또한 「검증을 통과하지 못한」은 ἀδόκιμοι의 ‘승인되지 않은/부적격한’ 평가 의미를 전달하나 문맥상 다소 기계적입니다.
  naturalness: 「생각이 부패한 사람들」과 「믿음에 관해서는 인정받지 못한 사람들」이 현대 표준 한국어에서 더 자연스럽고, 원문의 병렬적인 사람 묘사를 유지합니다. 합쇼체 종결도 유지했습니다.
  terminology: 「얀네와 얌브레」, 「모세」, 「진리」, 「믿음」은 적절합니다. 「믿음」은 개인적 신뢰로 한정하지 않고 본문의 넓은 의미(문맥상 그리스도교 신앙/사도적 가르침을 포함할 수 있음)를 보존하도록 주석으로만 설명합니다.
  issues:
  - severity: medium
    issue: νοῦς를 「마음」으로 번역함
    rationale: νοῦς는 여기서 주로 생각·판단·정신의 영역을 가리킵니다. 한국어 「마음」은 가능하지만 정서와 의지로 더 쉽게 이해될 수 있으므로 「생각」이 원문의 초점을 더 정확히 살립니다.
  - severity: low
    issue: 「검증을 통과하지 못한」의 문체
    rationale: ἀδόκιμοι는 시험을 통과하지 못해 승인되지 않거나 부적격한 상태를 뜻하지만, 해당 표현은 현대 한국어에서 절차적·기계적으로 들립니다. 「인정받지 못한」이 더 자연스럽게 평가적 의미를 전달합니다.
  - severity: low
    issue: 믿음의 지시 범위에 대한 주석 부재
    rationale: τὴν πίστιν은 문맥상 그리스도교 신앙 또는 사도적 메시지를 가리킬 가능성이 크지만 번역문은 이를 좁히지 않아야 합니다. 독자가 개인적 믿음으로만 오해하지 않도록 비결정적 설명 주석을 둡니다.
  revised_text: 얀네와 얌브레가 모세를 거역한 것처럼, 이 사람들도 진리를 거역합니다[a]. 이들은 생각이 부패한 사람들이며, 믿음[b]에 관해서는 인정받지 못한 사람들입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「모세를 대적한 것처럼 … 진리를 대적합니다」 또는 「맞섭니다」.
    reason: lexical_alternative
  - marker: b
    text: 여기서 「믿음」은 개인의 주관적 신뢰만이 아니라, 문맥상 그리스도교 신앙 또는 사도적 가르침을 가리킬 수도 있다.
    reason: cross_reference
  revision_rationale: 원문의 비교 표현과 반복되는 ‘반대하다’ 동사를 유지하되, νοῦς의 지적·판단적 의미를 「생각」으로 명확히 했습니다. ἀδόκιμοι는 원문의 평가 의미를 보존하면서 자연스러운 한국어인 「인정받지 못한」으로 다듬었습니다. 「믿음」의 의미는 본문에서 특정 교리적 해석으로 좁히지 않고 주석에서만 가능성을 밝혔습니다.
