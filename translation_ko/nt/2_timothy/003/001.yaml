  lexicon: BDAG
  rationale: χαλεπός는 「어렵고 위험한·험난한」을 함께 가리킨다. ἐνίστημι는 「임박하여 들이닥침」. 「험난한 때가 닥쳐오다」가 두 어휘의 무게를 담는다.
