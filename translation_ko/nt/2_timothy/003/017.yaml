  naturalness: 초안의 ‘온전하여 … 온전히 갖추어지게 하려 함입니다’는 ‘온전-온전히’의 반복이 다소 부자연스럽고, ‘행하도록 … 갖추어지게’의 중첩 목적 구조가 매끄럽지 않습니다. 병렬된 상태를 ‘온전하고 … 갖추어지도록’으로 표현하면 현대 한국어 합쇼체에서 자연스럽습니다.
