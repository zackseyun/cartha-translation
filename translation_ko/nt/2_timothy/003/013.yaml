  source_fidelity: 핵심 어휘와 문장 구조는 대체로 충실합니다. 다만 미래 동사 προκόψουσιν에 딸린 현재분사 πλανῶντες καὶ πλανώμενοι는 그들이 장차 계속 ‘속이고 속게 될’ 상황을 나타내므로, 둘째 문장의 현재형은 미래 시제로 맞추는 것이 필요합니다.
  naturalness: 「점점 더 악한 데로」도 이해되지만, 상태의 악화를 뜻하는 ἐπὶ τὸ χεῖρον에는 「점점 더 악한 상태로」가 현대 표준어에서 더 자연스럽고 분명합니다. 「속이면서 자신도 속을 것입니다」는 능동·수동의 대칭을 간결하게 보존합니다.
  terminology: 「악한 사람들」과 「사기꾼들」은 πονηροὶ ἄνθρωποι와 γόητες에 적절합니다. 각주에서 γόης의 주술적·사기적 함의를 단정적인 어원 주장 없이 조건적으로 설명하도록 다듬었습니다.
