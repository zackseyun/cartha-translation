    rationale: πλανῶντες καὶ πλανώμενοι는 미래 동사 προκόψουσιν에 수반되어 미래의 지속적 행위를 나타냅니다. 한국어도 「속이고 … 속을 것입니다」로 미래성을 유지해야 합니다.
  - severity: low
    issue: 「악한 데로」는 표현상 다소 구어적이고 지시 대상이 불분명합니다.
    rationale: ἐπὶ τὸ χεῖρον은 더 나쁜 상태나 방향으로의 진행을 뜻하므로 「더 악한 상태로」가 의미를 더 명료하게 전달합니다.
