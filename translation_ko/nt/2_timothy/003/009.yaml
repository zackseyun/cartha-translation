review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the cessation of further advance and the eventual public exposure of the opponents' folly. However, it reverses the Greek clause order and renders ἐκείνων as “그 옛 사람들,” adding an unwarranted temporal nuance. The comparison should refer anaphorically to the men named in the preceding verse, without calling them “ancient people.”
  naturalness: The Korean is generally fluent and suitably formal. “환히 드러날” is natural, but “드러날” sufficiently conveys ἔκδηλος and is more restrained. Restoring the source order also improves clarity.
  terminology: “어리석음” is an appropriate modern Korean rendering of ἄνοια. “더 이상 나아가지 못할 것입니다” appropriately renders οὐ προκόψουσιν ἐπὶ πλεῖον. “그 사람들” preserves the demonstrative reference without importing historical characterization.
  issues:
  - severity: medium
    issue: “그 옛 사람들” adds a temporal characterization not present in ἐκείνων.
    rationale: ἐκείνων refers to the previously named 얀네와 얌브레; it means “those [men],” not specifically “those people of old.”
  - severity: low
    issue: The comparative clause is fronted and the main clause is recast in a way that obscures the Greek progression.
    rationale: The Greek states first that the present opponents' folly will become evident to all, then compares it with the prior case. Retaining this order more directly reflects the source.
  - severity: low
    issue: The draft omits the audit-trail footnote anchors.
    rationale: The lexical alternative for προκόψουσιν and the antecedent explanation for ἐκείνων should be retained with anchored Korean footnotes.
  revised_text: 그러나 그들은 더 이상 나아가지 못할 것입니다[a]. 그들의 어리석음도 그 사람들의 어리석음이 드러났던 것처럼 모든 사람에게 드러날 것이기 때문입니다[b].
