  terminology: εὐσεβῶς는 ‘경건하게’, διωχθήσονται는 ‘박해를 받을 것입니다’로 적절합니다. Χριστός의 칭호적 번역인 ‘메시아’도 제시된 번역 원칙과 일치합니다. 대안 용어 각주는 간결하게 ‘그리스도’라고 제시하는 것으로 충분합니다.
