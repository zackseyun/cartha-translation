  lexicon: BDAG
  rationale: κοπιάω는 「수고하다·노력하다」를 뜻하며, 한국 성서 전통의 「수고하는」이 자연스럽다.
- source_word: τῶν καρπῶν μεταλαμβάνειν
  english_pob_choice: to receive a share of the crops
  chosen_korean: 소출의 몫을 받아야
  alternatives_korean:
  - 열매의 몫을 받아야
  - 곡물을 나누어 받아야
  lexicon: BDAG
  rationale: μεταλαμβάνω + 속격은 「몫을 나누어 받음」을 뜻한다. καρπός는 농업 문맥에서 「소출·열매·곡물」로, 「소출의 몫」이 분배의 의미를 자연스럽게 담는다.
