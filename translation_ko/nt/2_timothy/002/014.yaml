  source_fidelity: 개정이 필요합니다. διαμαρτυρόμενος는 단순한 ‘경고’보다 주 앞에서 권위 있게 엄숙히 명하거나 엄히 당부하는 행위를 가리키며, μὴ λογομαχεῖν은 그 명령의 내용입니다. 또한 ἐπ’ οὐδὲν χρήσιμον은 말다툼의 무익함을, ἐπὶ καταστροφῇ τῶν ἀκουόντων은 그것이 듣는 이들에게 초래하는 해로운 결과를 나타냅니다.
  naturalness: ‘주 앞에서 그들에게 … 말라고 엄숙히 명하십시오’는 한국어 합쇼체에서 자연스럽고, 명령의 대상과 내용을 명료하게 드러냅니다. ‘파멸로 이끌 뿐입니다’는 원문의 ‘무익함’과 ‘파멸이라는 결과’를 다소 부정확하게 ‘오직 파멸’로 한정할 수 있어 ‘파멸에 이르게 합니다’로 고쳤습니다.
  terminology: κύριος의 지시 대상은 본문만으로 특정하지 않고 전통적이면서도 중립적인 ‘주’로 옮겼습니다. καταστροφή는 ‘파멸’로 유지했습니다. λογομαχεῖν의 ‘말다툼’은 자연스럽지만 단순한 개인적 다툼보다 말에 관한 논쟁이라는 문맥을 보완하기 위해 ‘말을 두고 다투는 일’로 옮겼습니다.
  issues:
