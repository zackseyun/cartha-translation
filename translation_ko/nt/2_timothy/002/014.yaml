  to: 이러한 것들을 그들에게 계속 일깨워 주십시오. 주[a] 앞에서 그들에게 말을 두고 다투는 일을 하지 말라고 엄숙히 명하십시오. 그런 다툼은 아무 유익이 없고[b], 듣는 이들을 파멸에 이르게 합니다.
