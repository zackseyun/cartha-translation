    issue: ‘엄히 경고하여’는 διαμαρτυρόμενος의 엄숙한 명령·당부의 힘과 μὴ λογομαχεῖν이 그 명령의 내용이라는 구문 관계를 충분히 드러내지 못합니다.
    rationale: 이 동사는 이 문맥에서 단지 위험을 알리는 경고라기보다 하나님/주를 증인으로 삼아 엄히 지시하는 행위입니다.
  - severity: low
