  to: 그리고 많은 증인들 앞에서 나에게서 들은 것들을 신실한 사람들에게 맡기십시오.[a] 그러면 그들은 또 다른 이들도 가르칠 능력을 갖추게 될 것입니다.[b]
  rationale: The revision retains the likely public setting of Paul’s teaching, states the future competence expressed by ἔσονται, and uses two anchored notes to preserve the recorded ambiguity of διὰ πολλῶν μαρτύρων and the grammatical gender of πιστοῖς ἀνθρώποις. ‘신실한 사람들’ preserves the semantic range of πιστός without imposing a narrower doctrinal sense.
