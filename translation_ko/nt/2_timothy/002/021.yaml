review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 어휘와 비유를 대체로 충실히 옮겼습니다. 다만 미래형 ἔσται에 이어지는 세 분사가 모두 그 결과 상태를 설명하는데, 초안은 마지막을 현재 서술형 ‘그릇입니다’로 바꾸어 시제와 문장 구조가 어색해졌고 ‘그릇’도 불필요하게 반복합니다.
  naturalness: ‘귀하게 쓰일 그릇이 될 것입니다’ 뒤에 ‘…준비된 그릇입니다’가 이어지는 구조는 현대 한국어에서 부자연스럽습니다. 하나의 미래 결과절 안에서 병렬로 연결하면 자연스럽고 합쇼체 문체도 일관됩니다.
  terminology: ‘거룩하게 구별되다’, ‘주인’, ‘선한 일’은 원문의 의미와 한국어 성서 문맥에 적절합니다. εὔχρηστον은 ‘유익하며’보다 사람이나 물건의 사용 가능성을 더 직접적으로 나타내는 ‘쓸모 있으며’가 알맞습니다.
  issues:
  - severity: medium
    issue: 서술 시제와 문장 구조의 불일치
    rationale: ἔσται가 이끄는 ‘귀한 용도의 그릇’ 및 이어지는 분사구들이 한 미래 결과를 이룹니다. 초안의 ‘될 것입니다’와 ‘그릇입니다’의 혼용은 원문의 연결을 흐리고 한국어 문장을 부자연스럽게 합니다.
  - severity: low
    issue: ‘그릇’의 불필요한 반복
    rationale: 마지막 분사구는 앞선 ‘그릇’을 수식하므로, 한국어에서도 이를 반복하지 않고 병렬 서술로 연결하는 편이 정확하고 자연스럽습니다.
  revised_text: 그러므로 누구든지 이러한 것들에서 자신을 깨끗이 하면, 귀하게 쓰이는 그릇이 되어 거룩하게 구별되고 주인에게 쓸모 있으며 모든 선한 일을 할 준비가 되어 있을 것입니다.
