  to: 그러므로 누구든지 이러한 것들에서 자신을 깨끗이 하면, 귀하게 쓰이는 그릇이 되어 거룩하게 구별되고 주인에게 쓸모 있으며 모든 선한 일을 할 준비가 되어 있을 것입니다.
  rationale: 조건절의 ‘자신을 깨끗이 하면’은 ἐκκαθάρῃ ἑαυτόν ἀπὸ τούτων을 간결하고 자연스럽게 반영합니다. 미래형 결과절 아래에 ‘귀하게 쓰이는 그릇’, ‘거룩하게 구별되고’, ‘주인에게 쓸모 있으며’, ‘모든 선한 일을 할 준비가 되어’라는 술어들을 병렬로 두어 원문의 분사 구조와 완료된 준비 상태를 유지했습니다.
