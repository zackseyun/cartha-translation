- from: 예수 메시아를 기억하십시오. 그분은 죽은 자들 가운데서 다시 살아나신 분이시고, 다윗의 후손[a]이십니다. 나의 복음이 그러합니다.
  to: 죽은 자들 가운데서 다시 살아나시고 다윗의 후손[a]이신 예수 메시아를 나의 복음에 따라 기억하십시오.
