- from: 주의 종은 다투지 말아야 합니다. 도리어 모든 이에게 온유하고, 가르칠 만하며, 부당함을 잘 견뎌야 합니다.
  to: 주의 종[a]은 다투지 말고, 모든 사람에게 온유하며, 가르치기에 능하고, 악을 참아 견뎌야 합니다.
  rationale: διδακτικόν을 의미상 분명한 ‘가르치기에 능하고’로 고쳤고, ἀνεξίκακον을 ‘악을 참아 견디고’로 다듬었습니다. 또한 원문의 부정-대조와 병렬 구조를 한 문장으로 정리하고, δοῦλος의 어휘 대안을 각주로 보존했습니다.
