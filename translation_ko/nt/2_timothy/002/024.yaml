    rationale: ‘종’은 문맥상 적절하지만 servant/slave의 어휘적 범위를 투명하게 보이기 위해 대응 각주와 표지를 두는 것이 감사 기록과의 정합성을 높입니다.
  revised_text: 주의 종[a]은 다투지 말고, 모든 사람에게 온유하며, 가르치기에 능하고, 악을 참아 견뎌야 합니다.
