  source_fidelity: συγκακοπάθησον의 단수 부정과거 명령을 「함께 고난을 받으십시오」로, συν-의 공동 참여 뉘앙스를 보존하여 충실히 옮겼습니다. ὡς καλὸς στρατιώτης는 「훌륭한 군사로서」로 자연스럽게 재현되며, Χριστοῦ Ἰησοῦ의 속격 관계도 「메시아 예수의」에 보존되어 있습니다. 본문에는 ‘나와’가 명시되지 않았으므로 이를 본문에 보태지 않은 점도 적절합니다.
