- from: 또 반대하는 자들을 온유함으로 바로잡아야 합니다. 어쩌면 하나님께서 그들에게 회개를 베푸셔서 진리를 깨닫게 하실지도 모릅니다.
  to: 반대하는 사람들을 온유하게 가르치십시오. 혹시 하나님께서 그들에게 회개를 허락하셔서 진리를 아는 데 이르게 하실지도 모릅니다.
  rationale: The revision removes an unsupported additive, restores the exhortational force carried from the preceding clause, and renders repentance as leading toward knowledge of the truth. It does not specify an object of opposition absent from the Greek and preserves μήποτε's cautious contingency with '혹시 ... 하실지도 모릅니다.'
