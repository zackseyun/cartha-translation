  source_fidelity: 핵심 의미와 명령의 대조(φεῦγε/δίωκε), 네 가지 덕목, 그리고 ‘깨끗한 마음으로 주를 부르는’ 이들과의 동반 추구를 잘 전달합니다. 다만 νεωτερικὰς ἐπιθυμίας는 특정 ‘젊은이’ 한 사람의 욕망이라기보다 젊은 시절에 특징적인 욕망들을 가리키므로 이를 더 정확히 드러내는 편이 좋습니다.
  naturalness: ‘그대는’은 문어적 호칭인 반면 ‘추구하십시오’는 현대 합쇼체이므로 문체가 다소 섞입니다. 주어를 생략하고 ‘젊은 시절의 욕망’을 쓰면 현대 표준어 합쇼체로 더 자연스럽습니다. ‘사람들’은 ‘자들’보다 현대적이며, εἰρήνη는 이 문맥에서 ‘평화’가 더 일반적이고 자연스럽습니다.
  terminology: ‘의’, ‘믿음’, ‘사랑’은 적절합니다. δικαιοσύνη의 ‘정의’ 및 πίστις의 ‘신실함’ 가능성은 원문의 의미 범위를 보존하도록 각주로 제시할 수 있습니다. κύριος는 ‘주’로 유지했습니다.
