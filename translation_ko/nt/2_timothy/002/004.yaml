  source_fidelity: 그리스어의 보편 부정(οὐδείς), 군 복무의 현재적 상황(στρατευόμενος), 얽힘의 비유(ἐμπλέκεται), 목적절(ἵνα)을 명확히 반영하도록 다듬었습니다. στρατολογήσαντι는 특정 계급을 덧붙이지 않고 ‘군에 모집한 사람’으로 옮겼습니다.
  naturalness: 초안의 ‘군 복무 중인 사람은 누구도’는 주제 표지와 부정 주어의 결합이 다소 부자연스럽고, ‘함입니다’도 현대 합쇼체 문장으로 매끄럽지 않습니다. 이를 자연스러운 문장으로 고쳤습니다.
  terminology: ‘생활상의 일들’은 βίος의 일상적 삶과 πραγματεῖαι의 일·업무를 함께 드러내며, 각주의 ‘민간의 일들’은 군사적 대조를 보존하는 가능한 대안입니다. 사람 일반을 가리키는 비유이므로 ‘분’이라는 불필요한 존칭은 쓰지 않았습니다.
