  to: 이 때문에 나는 택함받은 이들을 위하여 모든 것을 견뎌 냅니다. 이는 그들도 메시아 예수 안에 있는 구원을 영원한 영광과 함께 얻게 하려는 것입니다.
  rationale: 인과를 나타내는 διὰ τοῦτο를 ‘이 때문에’로 조정하고, ἐκλεκτούς를 원문의 명시성에 맞게 ‘택함받은 이들’로 옮겼습니다. 목적절은 ‘이는 … 얻게 하려는 것입니다’로 자연스럽게 연결하되, 구원과 영원한 영광의 동반 관계를 그대로 유지했습니다.
