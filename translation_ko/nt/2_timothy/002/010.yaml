    issue: ‘그러므로’의 접속 의미
    rationale: ‘그러므로’는 결론·추론의 인상을 줄 수 있으나, διὰ τοῦτο는 여기서 앞선 상황을 근거로 삼는 ‘이 때문에’가 더 가깝습니다.
  - severity: low
    issue: ‘택하신 자들’의 명시되지 않은 행위자
    rationale: 원문의 ἐκλεκτούς는 ‘택함받은 이들’이라는 형용사적 명사화 표현입니다. ‘택하신’은 한국 성서 관용으로 가능하지만, 원문에 명시되지 않은 행위자를 문법적으로 전면화하지 않는 표현이 더 충실합니다.
  revised_text: 이 때문에 나는 택함받은 이들을 위하여 모든 것을 견뎌 냅니다. 이는 그들도 메시아 예수 안에 있는 구원을 영원한 영광과 함께 얻게 하려는 것입니다.
