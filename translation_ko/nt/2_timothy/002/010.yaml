review_pass:
  verdict: revise
  source_fidelity: διὰ τοῦτο는 앞 문맥에 근거를 두는 표현이므로 ‘그러므로’보다 ‘이 때문에’가 더 직접적으로 맞습니다. ἵνα의 목적 관계와 σωτηρίας τύχωσιν의 ‘구원을 얻다’도 개정문에서 보존했습니다. ἐκλεκτούς는 원문에 행위자가 명시되지 않은 ‘택함받은 이들’로 옮겨 불필요하게 행위자를 전면화하지 않았습니다.
  naturalness: 원문의 두 절 구조를 유지하면서 둘째 문장 앞에 ‘이는’를 보충해 목적 관계를 현대 한국어 합쇼체로 자연스럽고 분명하게 드러냈습니다.
  terminology: Χριστῷ Ἰησοῦ는 프로젝트 방침에 따라 ‘메시아 예수’로 유지했습니다. ‘영원한 영광과 함께’는 μετά + 속격이 나타내는 동반의 뜻을 보존합니다.
  issues:
