- from: 그러나 속되고 헛된 말을 피하십시오. 그것은 점점 더 경건치 못한 데로 나아가게 만들기 때문입니다.
  to: 그러나 속되고 헛된 말을 피하십시오. 그러한 사람들은 점점 더 불경건에 빠져들 것이기 때문입니다.
  rationale: The revision removes the unsupported causative construction and supplies a natural Korean plural referent for the Greek verb, while retaining the source’s warning that involvement in irreverent empty speech leads to increasing ἀσέβεια. “속되고 헛된 말” and the formal-polite imperative are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:48:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the imperative and the twofold characterization of the speech. However, “그것은 … 나아가게 만들기 때문입니다” makes the empty talk itself explicitly cause someone else to advance, whereas προκόψουσιν is a plural active verb (“they will advance”). The Greek’s implied plural subject is best represented as the people associated with such talk, without a Korean causative construction.
  naturalness: “피하십시오” is natural formal-polite Korean. “경건치 못한 데로” is intelligible but somewhat dated and less direct than modern “불경건에”; “그러한 사람들은 … 빠져들 것입니다” reads naturally while retaining the warning’s escalating force.
  terminology: “속되고 헛된 말” adequately conveys βεβήλους κενοφωνίας, preserving both irreverence and emptiness. “불경건” is an appropriate modern theological-moral equivalent for ἀσέβεια and avoids reducing it to merely deficient personal piety.
  issues:
  - severity: medium
    issue: Causative shift in the second sentence
    rationale: “나아가게 만들기” adds a causative relationship not expressed by the active plural προκόψουσιν. The translation should say that the relevant people themselves will advance further into ungodliness.
  - severity: low
    issue: Dated and indirect rendering of ἀσέβεια
    rationale: “경건치 못한 데” is grammatically possible but archaic in form and less precise in modern Korean than “불경건에.”
  revised_text: 그러나 속되고 헛된 말을 피하십시오. 그러한 사람들은 점점 더 불경건에 빠져들 것이기 때문입니다.
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported causative construction and supplies a natural Korean plural referent for the Greek verb, while retaining the source’s warning that involvement in irreverent empty speech leads to increasing ἀσέβεια. “속되고 헛된 말” and the formal-polite imperative are retained.
