  text: 'The saying is trustworthy: for if we died with him, we will also live with him.'
translation:
  language: ko
  text: 이 말은 믿을 만합니다.[a] 왜냐하면 우리가 그분과 함께 죽었으면, 또한 그분과 함께 살 것이기 때문입니다.
