  source_fidelity: 첫 문장은 Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ를 정확히 옮깁니다. 명령절의 「마가를 데리고 함께 오십시오」도 ἀναλαβὼν ἄγε μετὰ σεαυτοῦ의 뜻을 대체로 충실히 전달합니다. 다만 마지막 절은 εὔχρηστος의 서술적 용법과 εἰς διακονίαν의 목적·용도 관계를 더 자연스럽게 드러내도록 다듬는 것이 좋습니다.
