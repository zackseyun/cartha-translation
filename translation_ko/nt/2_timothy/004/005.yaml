  source_fidelity: 원문의 대조(σὺ δέ, νῆφε ἐν πᾶσιν, 네 개의 명령, πληροφορέω의 완결성)를 전반적으로 잘 반영합니다. 다만 ἐν πᾶσιν은 ‘어떤 일에서든’보다 ‘모든 일에’가 더 직접적이며, 마지막 구절은 ‘온전히 완수하십시오’가 ‘충분히 수행하여 완결하다’라는 πληροφόρησον의 뜻을 더 분명히 드러냅니다.
