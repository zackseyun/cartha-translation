  to: 이제부터는 나를 위해 의의 면류관[a]이 예비되어 있습니다. 의로우신 재판관이신 주께서는 그날에 그것을 내게만이 아니라 그분의 나타나심을 사랑해 온 모든 사람에게도 주실 것입니다.
  rationale: 본문은 λοιπὸν의 시간적 의미를 ‘이제부터는’으로, ἀπόκειται의 보관·예비 상태를 ‘예비되어 있습니다’로 유지했습니다. ‘의의 면류관’은 원문의 소유격이 지닌 의미 범위를 본문에서 확정하지 않으며, ‘정의의 면류관’이라는 어휘 대안은 각주로 보존했습니다. 완료 분사 ἠγαπηκόσι는 ‘사랑해 온’으로 옮겨 지속되어 온 사랑의 함의를 살리되 ‘사모하다’가 더하는 해석적 갈망의 뉘앙스는 본문에 강제하지 않았습니다.
  reviewer_model: gpt-5.6-terra
