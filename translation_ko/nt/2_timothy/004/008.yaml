    rationale: ‘사모하다’는 갈망과 동경을 강하게 함축하지만, ἀγαπάω는 기본적으로 ‘사랑하다’입니다. 완료 시제의 지속적 함의는 ‘사랑해 온’으로 보존할 수 있습니다.
