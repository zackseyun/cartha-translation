  source_fidelity: σπένδομαι의 전제 이미지와 ἤδη, 그리고 ἀνάλυσις의 죽음에 대한 완곡적 ‘떠남’은 대체로 반영되었습니다. 그러나 ‘전제(奠祭)로 부어지고’는 한국어에서 다소 어색하며, 주석이 본문 자체가 명시하지 않는 ‘순교’를 단정합니다. ἀνάλυσις의 어휘적 여지를 설명하는 주석도 있으면 좋습니다.
