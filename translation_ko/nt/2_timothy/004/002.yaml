- from: 말씀을 전파하십시오. 때를 얻든 못 얻든 항상 힘쓰십시오.[a] 오래 참음과 가르침을 다하여 책망하고 꾸짖고 권면하십시오.
  to: 말씀을 전파하십시오. 때가 좋든 좋지 않든 준비하고 있으십시오.[a] 온갖 인내와 가르침으로 책망하고 꾸짖고 권면하십시오.
