review_pass:
  verdict: revise
  source_fidelity: κήρυξον τὸν λόγον and the three following imperatives are conveyed well overall. However, 「항상 힘쓰십시오」 adds an unqualified ‘always’ and weakens/recasts ἐπίστηθι (‘be ready/stand by; possibly be urgent’) rather than representing its imperative force in relation to εὐκαίρως ἀκαίρως. The final prepositional phrase is better rendered as the manner accompanying all three corrective actions.
  naturalness: The draft is generally fluent in modern formal-polite Korean. 「때를 얻든 못 얻든」 is understandable but somewhat traditional and can be made clearer as a favorable/unfavorable-time expression. 「오래 참음과 가르침을 다하여」 is possible, but 「온갖 인내와 가르침으로」 is more natural in this construction.
  terminology: 「말씀을 전파하십시오」, 「책망하고 꾸짖고 권면하십시오」 appropriately preserve established biblical terminology and the escalating-yet-pastoral sequence. 「인내」 is a natural modern rendering of μακροθυμία here; the wording retains its interpersonal patient endurance without importing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: 「항상 힘쓰십시오」 does not adequately render ἐπίστηθι εὐκαίρως ἀκαίρως.
    rationale: ἐπίστηθι is an imperative of readiness/presence (with a possible nuance of urgent persistence), while 「항상」 is not stated in the Greek and 「힘쓰십시오」 is too nonspecific. A rendering with 「준비하고 있으십시오」 more directly represents the source while retaining the paired qualification.
  - severity: low
    issue: Footnote a contains unnatural and lexically imprecise Korean.
    rationale: 「곁에 섬·임함·임전 태세」 is not idiomatic Korean and presents overly specific senses as though they were a direct gloss. The note should state the viable alternative succinctly and preserve lexical uncertainty.
  - severity: low
    issue: 「오래 참음과 가르침을 다하여」 is less natural and may make ‘all’ sound verbal rather than attributive.
    rationale: The Greek phrase is an instrumental expression specifying the manner of reproof, rebuke, and exhortation. 「온갖 인내와 가르침으로」 is clear and preserves its comprehensive scope.
  revised_text: 말씀을 전파하십시오. 때가 좋든 좋지 않든 준비하고 있으십시오.[a] 온갖 인내와 가르침으로 책망하고 꾸짖고 권면하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 “때가 좋든 좋지 않든 나서십시오.” 헬라어 ἐπίστηθι는 “준비하고 있다, 곁에 서 있다”라는 뜻이며, 문맥에 따라 “열심히 힘쓰다”라는 뉘앙스로 이해되기도 한다.
    reason: lexical_alternative
