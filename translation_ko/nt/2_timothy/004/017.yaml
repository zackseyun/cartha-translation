  naturalness: ‘나를 통하여 … 듣게 하시려는 것이었습니다’는 문법상 가능하지만, 목적을 나타내는 주어와 ‘듣다’의 내용을 명시하면 현대 한국어 합쇼체에서 더 자연스럽고 명료합니다. ‘그 선포를’은 원문상 생략된 청취 내용을 문맥상 보완하는 표현입니다.
  terminology: ‘주’, ‘선포’, ‘이방인’, ‘사자의 입’, ‘건짐을 받았습니다’는 한국어 성서 문체와 핵심 용어에 적절합니다. ‘이방인’은 ἔθνη의 문맥상 가능한 번역이지만 ‘민족들’이라는 의미 범위도 각주에서 보존하는 것이 좋습니다.
