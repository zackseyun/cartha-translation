    reason: lexical_alternative
  revision_rationale: 분사구를 교사들의 속성이 아니라 사람들이 교사들을 모으는 동기·상태로 유지하고, 재귀 여격의 ‘자신들을 위해’를 복원했습니다. ἐπισωρεύσουσιν의 축적 의미는 ‘잔뜩 모아들이며’로 자연스럽게 드러냈습니다. 본문에 각주 표지가 없으므로, 개정문에는 각주 표지를 붙이지 않았습니다.
