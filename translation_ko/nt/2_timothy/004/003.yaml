  terminology: ‘건전한 가르침’은 ὑγιαινούσης διδασκαλίας에 적절하며, ‘교사들’과 ‘쌓아 둘’은 각각 διδασκάλους와 ἐπισωρεύσουσιν의 의미와 과장된 비유를 잘 보존합니다.
