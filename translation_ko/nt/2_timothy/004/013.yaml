  source_fidelity: 수정이 필요합니다. 원문의 παρὰ Κάρπῳ는 단순히 ‘가보 집에’라기보다 가보의 보관·돌봄 아래에 둔 것을 뜻하므로 ‘가보에게 맡겨 둔’이 더 충실합니다. 또한 μεμβράνας는 ‘양피지 책들’로 한정할 근거가 없으며, ‘양피지 문서들’로 옮기는 것이 원문의 물질·문서적 범위를 보존합니다.
  naturalness: 초안은 ‘가져오고 … 가져오십시오’처럼 명령이 중복되어 자연스럽지 않습니다. 두 목적어를 한 명령에 연결하면 현대 한국어 합쇼체로 매끄럽습니다.
  terminology: ‘겉옷’, ‘드로아’, ‘가보’, ‘책들’은 적절합니다. μεμβράνας는 책이라는 형식을 단정하지 않고 ‘양피지 문서들’로 번역합니다. βιβλία의 물리적 형식 불확실성은 각주로 보존합니다.
  issues:
