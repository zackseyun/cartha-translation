    issue: ‘가보 집에’는 παρὰ Κάρπῳ의 의미를 지나치게 특정합니다.
    rationale: παρά+여격은 이 문맥에서 가보와 함께, 또는 그의 보관 아래에 있음을 나타냅니다. 가보의 ‘집’이라고 명시하지 않는 편이 정확합니다.
  - severity: medium
    issue: ‘양피지 책들’은 μεμβράνας를 부당하게 한정합니다.
    rationale: μεμβράνας는 양피지 또는 양피지 문서를 가리키며, 반드시 책이라는 제본·형식을 뜻하지 않습니다.
  - severity: low
    issue: 명령 표현이 중복됩니다.
    rationale: ‘겉옷을 가져오고, 책들도 … 가져오십시오’보다 두 목적어를 병렬로 연결한 한 개의 명령문이 자연스럽습니다.
  - severity: medium
    issue: 기존 각주의 ‘당시 가장 귀중한 형태의 책’이라는 설명은 본문 어휘가 보장하지 않는 역사적 평가를 덧붙입니다.
    rationale: 각주는 형식상 ‘책’이라고 단정할 수 없는 μεμβράνας를 ‘양피지로 만든 책’으로 규정하고, 검증되지 않은 가치 판단도 더합니다.
