  source_fidelity: 개정이 필요합니다. 현 번역의 ‘내 육체에 있던 시험에도 불구하고’는 πειρασμὸν ὑμῶν ἐν τῇ σαρκί μου의 난해한 소유격을 ‘바울 자신의 육체 안에 있던 시험’으로 지나치게 확정하며, ‘여러분의’라는 요소도 본문에서 사라집니다. 본문은 바울의 신체적 상태가 갈라디아 교인들에게 시험/시련이 되었다는 의미로 자연스럽게 옮기되, 다른 구문 분석은 각주에 보존하는 것이 적절합니다. ‘침 뱉지도 않았다’는 한국어에서 목적과 관용적 기능이 불분명하므로, 원문의 혐오와 배척의 몸짓을 살려 ‘침을 뱉어 내치지도’로 옮깁니다.
  naturalness: 개정문은 현대 표준어 합쇼체로 자연스럽습니다. ‘마치 하나님의 천사를 맞이하듯, 또 메시아 예수를 맞이하듯’은 두 ὡς 비교구를 명료하게 재현하면서 바울을 천사나 메시아와 동일시하지 않고, 그에 상응하는 환대의 방식을 나타냅니다.
  terminology: σάρξ는 이 문맥에서 도덕적 ‘육신’이 아니라 신체적 상태를 가리키므로 ‘내 몸의 상태’가 적절합니다. Χριστὸν Ἰησοῦν은 프로젝트 방침에 따라 ‘메시아 예수’로 유지합니다. ἄγγελον θεοῦ는 문맥상 ‘하나님의 천사’가 적절합니다.
