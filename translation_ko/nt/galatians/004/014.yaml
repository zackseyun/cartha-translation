  - severity: medium
    issue: ‘침 뱉지도 않았습니다’가 한국어에서 부자연스럽고 배척의 의미가 충분히 드러나지 않음
    rationale: ἐξεπτύσατε는 문자적으로 침을 뱉는 혐오의 행위이며 문맥상 배척을 뜻합니다. ‘침을 뱉어 내치지도’는 문자적 이미지와 문맥적 기능을 함께 드러냅니다.
