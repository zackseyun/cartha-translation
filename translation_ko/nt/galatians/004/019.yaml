  source_fidelity: 그리스어의 호격 τέκνα μου, 반복을 나타내는 πάλιν, 출산 진통 은유 ὠδίνω, 그리고 수동형 μορφωθῇ를 전반적으로 충실히 옮겼습니다. 다만 ‘또 다시’는 πάλιν의 반복 의미를 한국어에서 불필요하게 겹쳐 강조합니다.
  naturalness: ‘내 자녀 여러분’보다 바울의 애정 어린 호격을 자연스럽게 살리는 ‘나의 자녀 여러분’이 더 적절합니다. ‘다시 산고를 겪고 있습니다’는 현대 표준어 합쇼체에서 자연스럽고 원문의 지속적 진술을 잘 전달합니다.
  terminology: Χριστός를 프로젝트의 선택에 맞춰 ‘메시아’로 유지했고, ἐν ὑμῖν은 ‘여러분 안에’로 옮겨 개인적·공동체적 함의를 과도하게 한쪽으로 제한하지 않았습니다. ‘형성되다’는 μορφωθῇ의 수동성을 보존합니다.
  issues:
