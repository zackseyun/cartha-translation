base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
  footnotes:
  - marker: a
    text: Or 'to be zealous' / 'to show zeal.' The Greek infinitive ζηλοῦσθαι can be understood differently, but the passive sense fits the immediate contrast with those who seek the Galatians in the previous verse.
    reason: alternative_reading
  - marker: b
    text: Literally 'in a good [thing/matter].' The phrase likely means with good motives or for a good purpose.
    reason: lexical_alternative
translation:
  language: ko
  text: 좋은 목적을 위해 열렬한 관심을 받는 것[a]은 언제나 좋은 일입니다[b]. 내가 여러분과 함께 있을 때만 그런 것은 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 일에 열심을 내는 것’ 또는 ‘좋은 일에 열심을 보이는 것’. 그리스어 ζηλοῦσθαι는 다르게 이해될 수 있으나, 바로 앞 절에서 다른 이들이 갈라디아인들에게 열심을 보인다는 대조를 고려하면 수동 의미가 잘 어울립니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘좋은 것/일 안에서’. 이 표현은 좋은 동기나 좋은 목적을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
