revisions:
- from: 그들은 여러분에게 열심을 보이지만 좋은 뜻에서가 아닙니다. 도리어 여러분을 따돌리려는 것이니, 여러분이 그들에게 열심을 보이게 하려는 것입니다.
  to: 그들은 여러분에게 열심을 보이지만, 좋은 방식으로 그러는 것은 아닙니다. 오히려 여러분을 배제하려 합니다. 이는 여러분이 그들에게 열심을 보이게 하려는 것입니다.
