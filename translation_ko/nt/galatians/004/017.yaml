review_pass:
  verdict: revise
  source_fidelity: 첫 번째 ζηλοῦσιν과 마지막 ζηλοῦτε의 어휘적 대응을 모두 ‘열심을 보이다’로 유지한 점은 적절합니다. 그러나 ἐκκλεῖσαι는 ‘따돌리다’보다 ‘배제하다’가 더 정확하며, 불특정한 배제의 대상을 본문처럼 열어 둡니다. ‘좋은 뜻에서’도 가능한 해석이나, καλῶς의 ‘올바르게/합당하게’라는 평가를 ‘좋은 방식으로’가 더 직접적으로 반영합니다.
  naturalness: 합쇼체 문체는 적절합니다. 다만 ‘따돌리려는 것이니’는 구어적 뉘앙스가 있고 문장 연결도 다소 압축되어 있습니다. 세 절을 분명히 나누고 목적 관계를 ‘이는 … 하려는 것입니다’로 드러내면 현대 표준어 문장으로 더 자연스럽습니다.
  terminology: ‘열심을 보이다’는 관계적·구애적 의미를 자연스럽게 전달하면서 두 차례의 ζηλόω를 일관되게 옮깁니다. ‘배제하다’는 ἐκκλείω의 ‘제외하다, 차단하다’를 정확히 반영하며, 바울 및 그의 동료들과의 관계에서 떼어 놓으려 한다는 문맥상 추론을 본문에 과도하게 명시하지 않습니다.
  issues:
  - severity: medium
    issue: ‘따돌리려는 것’
    rationale: ἐκκλεῖσαι는 ‘배제하다/제외하다’라는 뜻이며, ‘따돌리다’는 집단 괴롭힘 또는 사회적 소외라는 더 구어적이고 특정한 뉘앙스를 낼 수 있습니다.
  - severity: low
    issue: ‘좋은 뜻에서가 아닙니다’
    rationale: 의도에 관한 해석으로는 가능하지만, οὐ καλῶς는 행위의 방식·성격이 ‘좋지 않게/옳지 않게’라는 평가입니다. ‘좋은 방식으로’는 이를 더 포괄적으로 보존합니다.
  revised_text: 그들은 여러분에게 열심을 보이지만, 좋은 방식으로 그러는 것은 아닙니다. 오히려 여러분을 배제하려 합니다. 이는 여러분이 그들에게 열심을 보이게 하려는 것입니다.
