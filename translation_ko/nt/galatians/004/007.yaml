  text: 그러므로 당신은 더 이상 노예가 아니라 아들[a]입니다. 그리고 아들이라면, 하나님을 통하여 상속자[b]이기도 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리 「자녀」로 옮길 수도 있습니다. 헬라어 「아들」은 이 문맥의 상속과 입양의 논리를 보존하며, 바울은 이 지위를 모든 신자에게 적용합니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본은 「그리스도를 통하여 하나님의 상속자」(또는 「메시아를 통하여 하나님의 상속자」)로 읽습니다.
    reason: textual_variant
