    text: 또는 ‘여인에게서’. 이 표현은 아들의 실제 인간 출생을 나타냅니다.
    reason: lexical_alternative
  - marker: d
    text: 문맥상 모세 율법의 지배 아래 있음을 뜻합니다.
    reason: cross_reference
