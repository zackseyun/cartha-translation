  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐφ’ ὅσον χρόνον은 상속자가 ‘어린아이인 동안’을 뜻하므로, ‘어린아이일 동안’보다 서술격 조사가 드러나는 표현이 정확합니다. κύριος πάντων은 이 비유에서 ‘모든 것의 주인’으로 적절히 옮겼습니다.
