  terminology: νήπιος를 ‘어린아이’로, δοῦλος를 ‘노예’로, κύριος를 ‘주인’으로 옮긴 선택은 문맥과 용어 구별에 적절합니다. 다만 b 각주는 대안어를 제시하기보다 해석적·신학적 주장에 치우쳐 있어, 영어 POB의 ‘servant’ 대안 및 δοῦλος의 어휘 범위를 더 직접적으로 설명해야 합니다.
