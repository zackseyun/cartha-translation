review_pass:
  verdict: revise
  source_fidelity: The draft retains the two sons and the paired maternal-status contrast, but 「기록되었듯이」 means “as it was written” and does not accurately render the Greek formula γέγραπται γὰρ ὅτι (“for it is written that”). The revised wording directly preserves both the connective and the content clause.
  naturalness: 「아브라함에게 두 아들이 있었습니다」 is understandable, but embedding it under 「…있었다고 기록되어 있습니다」 is more natural and syntactically faithful. 「노예 여인/자유 여인」 provides a balanced, modern formal Korean contrast; 「…에게서 태어났습니다」 is idiomatic for the maternal expression ἐκ.
  terminology: The paired terms 「노예 여인」 and 「자유 여인」 preserve the salient slave/free contrast without importing a denominational interpretation. The note is recast as a lexical explanation rather than a theological assertion.
  issues:
  - severity: medium
    issue: 「기록되었듯이」 does not render γέγραπται γὰρ ὅτι precisely.
    rationale: It changes “for it is written that” into an adverbial comparison (“as it was written”), leaving the Greek content clause insufficiently represented.
  - severity: low
    issue: The footnote attributes a theological development to the text and uses editorial wording.
    rationale: A lexical-alternative note should explain παιδίσκη and the immediate slave/free contrast without asserting a broader theological conclusion.
  revised_text: 왜냐하면 아브라함에게 두 아들이 있었다고 기록되어 있습니다. 한 아들은 노예 여인[a]에게서, 한 아들은 자유 여인에게서 태어났습니다.
  revised_footnotes:
  - marker: a
    text: 헬라어 παιδίσκη는 여성 노예를 가리키며, 「여종」으로도 옮길 수 있습니다. 여기서는 뒤의 「자유 여인」과의 대조를 나타내기 위해 「노예 여인」으로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: The revision restores the πλήρης force of the introductory Scripture formula, maintains the explicit two-part parallelism, and uses balanced Korean status terms. The footnote continues to record the viable lexical alternative while accurately explaining the translation choice.
