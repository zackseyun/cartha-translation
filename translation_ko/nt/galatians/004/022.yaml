  source_fidelity: 개정이 필요합니다. γέγραπται γὰρ ὅτι는 성경의 권위를 나타내는 현재적 관용구이므로 「왜냐하면 다음과 같이 기록되어 있습니다」가 더 충실합니다. ἔσχεν의 과거 사건성과 ἕνα … καὶ ἕνα의 병렬도 「있었는데, 하나는 … 하나는 … 태어났습니다」로 보존합니다.
  naturalness: 초안의 「기록되었듯이」는 문맥상 가능하지만 γέγραπται의 통상적 성경 인용 공식을 다소 약화합니다. 또한 「자유로운 여자」는 한국어에서 사회적 법적 신분보다 성격이나 태도를 뜻할 수 있으므로 「자유인인 여자」가 더 분명하고 자연스럽습니다.
  terminology: παιδίσκη는 이 문맥의 자유 신분과의 대조를 살려 「노예 여자」로 유지할 수 있습니다. ἐλευθέρα는 이에 대응하는 법적·사회적 신분을 명시하는 「자유인인 여자」로 옮기는 것이 적절합니다. 각주에서 본문 이상의 신학적 해석을 단정하기보다 어휘 및 대조의 기능만 설명하도록 고칩니다.
  issues:
