    issue: 「기록되었듯이」가 γέγραπται γὰρ ὅτι의 인용 공식과 접속사 γάρ를 충분히 드러내지 못함
    rationale: 원문은 ‘왜냐하면 다음과 같이 기록되어 있기 때문입니다’라는 취지로 앞 논증을 잇고, 이어지는 내용을 기록된 것으로 제시합니다.
  - severity: medium
    issue: 「자유로운 여자」의 신분 의미가 모호함
    rationale: ἐλευθέρας는 노예 상태가 아닌 자유 신분의 여자를 가리킵니다. 「자유로운」은 현대 한국어에서 성격·행동의 자유로움으로도 읽힐 수 있습니다.
  - severity: low
    issue: 각주의 「신학적으로 전개하므로」가 어휘 대안 각주에 불필요하게 해석적임
    rationale: 이 절에서는 노예/자유의 대조 자체를 명료하게 밝히는 것으로 충분하며, 교리적·해석적 설명을 추가할 필요가 없습니다.
