  text: 이 하갈은 아라비아에 있는 시내 산이며[a], 지금의 예루살렘에 해당합니다. 그녀는 자기 자녀들과 함께 노예 상태에 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
