  to: 그러나 이제 여러분이 하나님을 알게 되었는데—오히려 하나님께 알려졌는데—어떻게 다시 그 무력하고 빈약한 초보적인 것들[a]로 돌아가, 다시 처음부터 노예가 되려고 합니까?
  rationale: 비인격적 중성 명사에 맞게 ‘에게로’를 ‘로’로 고치고, 예속의 의미를 ‘노예가 되다’로 분명히 했습니다. στοιχεῖα는 논쟁적인 용어이므로 본문에서는 넓은 표현을 사용하고 각주에서 대안을 보존했습니다. 수동 표현과 하나님의 주도성, 그리고 πάλιν ἄνωθεν의 반복·재출발 강조도 유지했습니다.
