  verdict: revise
  source_fidelity: 핵심 구조와 의미는 대체로 충실합니다. 다만 중성 복수인 στοιχεῖα를 받는 οἷς를 ‘원리들에게로’라고 옮긴 것은 비인격적 대상을 가리키는 한국어 조사 선택으로 수정할 필요가 있습니다. 또한 δουλεύειν의 예속 의미는 ‘노예 노릇 하다’보다 ‘노예가 되다’가 더 직접적으로 드러냅니다.
  naturalness: ‘하나님께 알려진 바 되었는데’는 문법적으로 가능하지만 현대 표준어 합쇼체에서는 다소 관료적이고 부자연스럽습니다. ‘하나님께 알려졌는데’로 간결하게 하되, 수동 및 하나님의 주도성을 유지할 수 있습니다. ‘더 정확히는’보다 μᾶλλον δέ의 교정적 뉘앙스를 살리는 ‘오히려’가 적절합니다.
  terminology: ‘초보적인 것들’은 στοιχεῖα의 논쟁적인 의미를 특정한 체계나 인격적 영적 존재로 고정하지 않으면서 보존합니다. 각주에는 ‘영적 세력들’, ‘초보적 원리들’, ‘초보적인 것들’이라는 가능한 이해를 제시합니다. ‘무력하고 빈약한’은 ἀσθενῆ καὶ πτωχὰ의 부정적 평가를 자연스럽게 반영합니다.
  issues:
  - severity: medium
    issue: ‘초보적 원리들[a]에게로’의 조사 사용
    rationale: οἷς는 중성 복수 στοιχεῖα를 받습니다. 본문이 비인격적 ‘원리들’로 번역될 경우 ‘에게로’는 부적절하며 ‘로’ 또는 ‘에게 다시 예속되다’와 같은 구조가 필요합니다.
  - severity: medium
    issue: δουλεύειν의 예속 의미가 약화될 수 있음
    rationale: ‘노예 노릇 하려고’도 의미상 가능하지만, 본문의 속박 이미지를 더 직접적으로 반영하는 ‘노예가 되려고’가 적절합니다.
  - severity: low
    issue: μᾶλλον δέ의 번역
    rationale: ‘더 정확히는’은 설명·정정의 뜻을 낼 수 있으나, 바울의 수사적 교정에는 ‘오히려’가 더 자연스럽고 충실합니다.
  revised_text: 그러나 이제 여러분이 하나님을 알게 되었는데—오히려 하나님께 알려졌는데—어떻게 다시 그 무력하고 빈약한 초보적인 것들[a]로 돌아가, 다시 처음부터 노예가 되려고 합니까?
