  naturalness: 현 문장의 ‘여러분에게 헛되이 수고한 것’은 현대 한국어에서 다소 부자연스럽고, 앞 문장과 뒤의 ‘해서입니다’의 연결도 설명문처럼 들립니다. ‘여러분이 염려됩니다’와 ‘… 아닐까 해서입니다’를 사용하면 현대 표준어 합쇼체로 자연스럽습니다.
