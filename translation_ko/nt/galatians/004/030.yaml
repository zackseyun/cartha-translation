source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the slave woman and her son[c][b][a], for the son of the slave woman will certainly not inherit with the son of the free woman.”
  footnotes:
  - marker: a
    text: Or “bondwoman.” The Greek term denotes a female slave/servant; “slave woman” is used here because the slavery/freedom contrast is central to the passage.
    reason: lexical_alternative
  - marker: b
    text: The quotation echoes Genesis 21:10.
    reason: cross_reference
  - marker: c
    text: 'Greek has an emphatic negation: “will certainly not inherit,” alternatively “will by no means inherit.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 성경은 무엇이라고 합니까? 「노예 여인과 그 아들을 내쫓아라. 노예 여인의 아들은 자유 여인의 아들과 함께 결단코 상속받지 못할 것이다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 인용은 창세기 21:10을 반영합니다. 헬라어에는 강조된 부정(οὐ μὴ)이 있어 「결단코 상속받지 못할 것이다」라는 뜻입니다.
    reason: cross_reference; lexical_alternative
lexical_decisions:
- source_word: Ἔκβαλε τὴν παιδίσκην
  english_pob_choice: Cast out the slave woman
  chosen_korean: 노예 여자를 내쫓아라
  alternatives_korean:
  - 여종을 내보내라
  lexicon: BDAG
  rationale: 4장 일관성. 「내쫓아라」가 강한 명령형을 살린다.
- source_word: οὐ … μὴ κληρονομήσει
  english_pob_choice: will certainly not inherit
  chosen_korean: 결단코 유산을 받지 못할 것이다
  alternatives_korean:
  - 절대로 상속받지 못할 것이다
  lexicon: BDAG
  rationale: 이중 부정의 강조를 「결단코」로 보존.
