- from: 여러분이 아들이므로, 하나님께서 자기 아들의 영을 우리[a] 마음속에 보내사 「아빠, 아버지」 하고 부르짖게 하셨습니다.
  to: 그리고 여러분이 아들이기 때문에[b], 하나님께서는 자신의 아들의 영을 우리[a] 마음속에 보내셔서, 그 영께서 “아바[c], 아버지”라고 부르짖으십니다.
