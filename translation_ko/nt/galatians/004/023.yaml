- from: 그러나 노예 여자에게서 난 아들은 육체를 따라 났고, 자유로운 여자에게서 난 아들은 약속을 통해 났습니다.
  to: 그러나 노예 신분의 여자의 아들은 육체를 따라 태어났고, 자유 신분의 여자의 아들은 약속을 통하여 태어났습니다.
  rationale: The revision clarifies the passive sense of γεγέννηται with '태어났고,' improves the naturalness and symmetry of the status contrast, and retains the source's key expressions '육체를 따라' and '약속을 통하여.' No footnote is necessary because the Korean main text preserves the relevant ambiguity and terminology.
