  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
  footnotes:
  - marker: a
    text: Or 'like me.'
    reason: lexical_alternative
  - marker: b
    text: '''Brothers'' here addresses the believing community and likely includes both men and women.'
    reason: cultural_note
  - marker: c
    text: Or 'I too am as you are'; the Greek is elliptical, and 'became' is supplied to make the sense clear in context.
    reason: alternative_reading
translation:
  language: ko
  text: 형제 여러분[b], 여러분도 나처럼 되십시오[a]. 나도 여러분처럼 되었기 때문입니다. 여러분에게 간청합니다. 여러분은 나에게 아무 잘못도 하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나도 여러분처럼 [되었기 때문입니다]’입니다. 그리스어에는 이 절의 동사가 생략되어 있으며, 문맥에 따라 ‘되었다’를 보충했습니다.
    reason: alternative_reading
  - marker: b
    text: ‘형제 여러분’에 해당하는 그리스어는 문법적으로 남성 복수이지만, 여기서는 믿는 공동체 전체를 부르는 호칭으로 남녀를 포함할 수 있습니다.
    reason: cultural_note
