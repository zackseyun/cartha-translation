  source_fidelity: 두 ἵνα 목적절의 구조와 ἐξαγοράζω의 ‘속량하다’ 의미는 대체로 반영되었습니다. 다만 υἱοθεσία를 ‘양자됨’으로 옮기면 한국어에서 ‘양자’가 특정 남성 입양아를 가리키는 말로도 이해되어, 원문의 아들 신분·상속의 법적 지위를 충분히 자연스럽게 전달하지 못합니다.
  naturalness: ‘양자됨을 받게’는 명사화가 겹쳐 다소 부자연스럽습니다. ‘아들로 삼으심을 받게’가 현대 표준어 성경 문체에서 더 자연스럽고 원문의 문자적 표현도 보존합니다.
  terminology: ‘율법 아래 있는 이들’, ‘속량’은 적절합니다. υἱοθεσία는 본문에서 ‘아들로 삼으심’으로 옮기고, 각주에서 직역 및 남녀 모두에게 적용되는 포괄적 지시 대상을 밝혀 성별 표지와 상속 함의를 함께 보존하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘양자됨’의 의미 및 용법상 모호성
    rationale: 한국어 ‘양자’는 흔히 입양된 남자아이 또는 그 개인을 뜻하므로, 바울이 말하는 하나님 자녀로 받아들여지는 신분을 자연스럽게 전달하기 어렵습니다. 또한 원문의 ‘아들’ 표지와 상속적 함의도 본문에서 희미해집니다.
  - severity: low
    issue: 각주의 ‘완전한 자녀 신분’ 표현
    rationale: ‘완전한’은 도덕적·질적 완전성을 연상시킬 수 있습니다. 여기서는 법적·가족적 지위의 충만함을 뜻하므로 ‘온전한 자녀의 신분과 상속권’이 더 정확합니다.
  revised_text: 이는 율법 아래 있는 이들을 속량하시고, 우리가 아들로 삼으심을 받게 하시려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 헬라어 υἱοθεσία. 직역하면 「아들로 삼음」입니다. 온전한 자녀의 신분과 상속권을 강조하며, 남녀 모든 신자에게 적용됩니다.
    reason: lexical_alternative
  revision_rationale: ‘아들로 삼으심’은 υἱοθεσία의 문자적 구성과 바울 문맥의 신분·상속 함의를 보존하면서도 ‘양자됨’보다 자연스럽습니다. 문맥상 하나님께서 아들을 보내신 목적을 나타내므로 ‘속량하시고 … 받게 하시려는’으로 두 목적을 매끄럽게 연결했습니다.
