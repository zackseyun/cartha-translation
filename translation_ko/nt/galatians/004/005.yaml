review_pass:
  verdict: revise
  source_fidelity: 초안은 ἐξαγοράσῃ를 ‘속량하여’로, υἱοθεσία를 ‘양자됨’으로 옮겨 핵심 의미를 대체로 보존합니다. 다만 두 ἵνα 목적절의 관계가 더 분명히 드러나도록 하고, υἱοθεσία의 문자적 ‘아들로 삼음’의 의미를 본문과 주석에서 더 자연스럽게 반영하는 편이 좋습니다.
  naturalness: ‘양자됨을 받게’는 의미는 통하지만 현대 표준 한국어로는 다소 명사화되어 어색합니다. ‘아들로 삼으심을 받게’가 더 자연스럽고 원문의 표현도 더 직접적으로 반영합니다.
  terminology: ‘속량’은 ἐξαγοράζω의 해방·구속 의미를 적절히 보존합니다. υἱοθεσία는 단순한 법률적 입양만을 뜻하도록 좁혀지지 않게 ‘아들로 삼으심’으로 옮기고, 주석에서 남녀 모든 신자를 포함함을 밝혀야 합니다. ‘헬라어’보다 현대 학술 한국어에서는 ‘그리스어’가 적절합니다.
  issues:
  - severity: medium
    issue: ‘양자됨을 받게’의 자연성과 어휘 범위
    rationale: ‘양자됨’은 현대 한국어에서 다소 부자연스럽고 법률적 입양에 한정되어 들릴 수 있습니다. υἱοθεσία의 문자적·상속 관련 함의를 살리는 ‘아들로 삼으심’을 쓰는 것이 안전합니다.
  - severity: low
    issue: 두 목적절의 연결
    rationale: 원문은 ἵνα를 두 차례 사용합니다. 한국어에서 동일 형식을 기계적으로 반복할 필요는 없지만, ‘속량하시어 … 받게 하시려는’으로 두 목적의 연계를 자연스럽게 드러낼 수 있습니다.
  - severity: low
    issue: 주석의 용어와 문체
    rationale: ‘그리스어’와 ‘이 신분은’이 현대 표준어 및 합쇼체 설명 문체에 더 자연스럽습니다.
  revised_text: 이는 율법 아래 있는 이들을 속량하시어, 우리가 아들로 삼으심을 받게 하시려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 그리스어 υἱοθεσία. 직역하면 ‘아들로 삼음’입니다. 완전한 자녀의 신분과 상속권을 강조하며, 이 신분은 남녀 모든 신자에게 적용됩니다.
    reason: lexical_alternative
  revision_rationale: ‘속량’은 유지하고, ‘양자됨’을 ‘아들로 삼으심’으로 바꾸어 υἱοθεσία의 문자적 표현과 상속 관련 신분 의미를 보존했습니다. 또한 ‘속량하시어 … 받게 하시려는’ 구문으로 원문의 연속된 목적 표현을 자연스러운 한국어로 반영했습니다.
