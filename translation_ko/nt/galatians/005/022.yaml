translation:
  language: ko
  text: 그러나 성령의 열매는 사랑, 기쁨, 평화, 오래 참음, 친절, 선함, 신실함[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘믿음’. 그리스어 피스티스는 믿음, 신뢰, 또는 신실함을 뜻할 수 있습니다. 이 덕목 목록에서는 ‘신실함’, 곧 믿을 만하고 신뢰할 수 있는 성품으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς τοῦ πνεύματός
  english_pob_choice: the fruit of the Spirit
  chosen_korean: 성령의 열매
  alternatives_korean: []
  lexicon: BDAG
  rationale: 한국 성경의 정형 표현. 「열매」는 단수로 보존하여 통일된 열매 개념을 살린다.
- source_word: ἀγάπη, χαρά, εἰρήνη
  english_pob_choice: love, joy, peace
  chosen_korean: 사랑, 기쁨, 평강
  alternatives_korean:
