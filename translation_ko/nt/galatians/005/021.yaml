translation:
  language: ko
  text: 시기, 술 취함, 흥청거림[a], 그리고 이와 같은 것들입니다. 전에 경고한 바와 같이, 이런 것들에 대하여 내가 여러분에게 미리 경고합니다. 이런 것들을 행하는 사람들은 하나님의 나라를 유업으로 받지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방탕한 잔치’, ‘환락’. 그리스어는 흔히 술자리와 관련된 떠들썩하고 방종한 축제나 흥청거림을 가리키며, 반드시 성적 행위만을 뜻하지는 않습니다.
    reason: κῶμοι의 의미 범위와 가능한 한국어 번역을 밝혀, 현대어 ‘환락’이 지나치게 성적인 의미로만 이해될 가능성을 피한다.
