    issue: ‘율법 전체를 행할 의무’
    rationale: ποιέω의 기본 뜻은 ‘하다’이나, νόμος와 함께 쓰인 이 문맥에서는 율법을 ‘지키다’ 또는 ‘준수하다’가 한국어 관용과 원문의 요구 의미를 더 정확히 전달합니다.
  - severity: low
    issue: ‘그는 … 의무가 있는 자입니다’
    rationale: παντὶ ἀνθρώπῳ의 분배적 단수는 유지되지만, 한국어에서는 대명사와 ‘자입니다’를 겹쳐 쓰지 않고 ‘의무가 있습니다’로 표현하는 편이 자연스럽습니다.
