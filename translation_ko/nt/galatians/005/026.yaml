  source_fidelity: 원문의 권면법(μὴ γινώμεθα)을 ‘…되지 맙시다’로 살리고, κενόδοξοι의 상태적 술어를 ‘헛된 영광을 바라는 사람이’로 옮기는 것이 적절합니다. 초안의 ‘추구하지 말고’는 γίνομαι의 ‘되다’와 복수 권면의 뉘앙스를 약화합니다. 두 분사는 상호 관계에서 드러나는 행동으로 병렬 처리했습니다.
  naturalness: ‘헛된 영광을 바라는 사람이 되지 맙시다’와 ‘서로를 자극하며 서로를 시기하지 맙시다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘서로 도전하다’는 경쟁적으로 맞서게 한다는 뜻으로도 읽혀 원문의 도발·자극의 의미보다 좁거나 어색할 수 있습니다.
