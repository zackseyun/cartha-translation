  terminology: σάρξ는 바울의 비유적 윤리 문맥에서 ‘육체’로 유지하되, 문자적 신체를 뜻하는 말로만 오해되지 않도록 짧은 각주를 두는 것이 영어 POB의 감사 기록 및 용어 선택과 일치합니다. πορνεία는 폭넓은 불법적 성 행위를 가리키므로 ‘성적 부도덕’이 전통적이지만 범위가 다소 좁게 들릴 수 있는 ‘음행’보다 적절합니다. ἀκαθαρσία는 ‘부정’으로 옮깁니다.
