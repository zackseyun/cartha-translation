base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
  footnotes:
  - marker: a
    text: Or 'brothers and sisters'; Greek 'brothers' can address a mixed group.
    reason: lexical_alternative
  - marker: b
    text: Or 'the stumbling block of the cross.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 형제 여러분, 내가 여전히 할례를 전파하고 있다면, 어찌하여 내가 여전히 박해를 받고 있겠습니까? 그렇다면 십자가가 걸림돌이 되는 일[a]은 없어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “십자가의 걸림돌”입니다. 헬라어 σκάνδαλον은 걸려 넘어지게 하는 것 또는 거부감을 일으키는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
