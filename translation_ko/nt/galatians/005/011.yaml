  to: 그러나 형제 여러분, 내가 여전히 할례를 전파하고 있다면, 어찌하여 내가 여전히 박해를 받고 있겠습니까? 그렇다면 십자가가 걸림돌이 되는 일[a]은 없어졌습니다.
  rationale: 대조 접속사 δέ를 “그러나”로 반영하고, 두 ἔτι를 “여전히”로 유지했습니다. σκάνδαλον τοῦ σταυροῦ는 현대 한국어에 맞게 풀어 쓰되, 각주에서 직역과 의미 범위를 밝혀 원문의 표현 및 해석 가능성을 보존했습니다. 완료 수동형 κατήργηται는 결과 상태를 나타내는 “없어졌습니다”로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
