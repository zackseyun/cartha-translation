  source_fidelity: 수정이 필요합니다. 초안은 ἐγὼ δέ의 대조적 1인칭 강조(“그러나 나로 말하자면”)를 반영하지 않았습니다. 또한 σκάνδαλον τοῦ σταυροῦ를 전통적인 표현으로 옮기려는 의도는 타당하나, 본문의 “십자가의 거치는 것”은 현대 한국어에서 어색합니다. “십자가가 걸림돌이 되는 일”은 십자가가 일으키는 걸림/반발이라는 문맥적 의미와 원문의 속격 관계를 자연스럽게 드러냅니다. κατήργηται의 완료 수동 결과는 “없어졌습니다”로 반영했습니다.
  naturalness: “그러나 형제 여러분”과 “여전히 … 전파하고 있다면”은 현대 표준어 합쇼체에서 자연스럽고, 두 차례의 ἔτι도 모두 “여전히”로 보존합니다. “사라진 셈입니다”보다 “없어졌습니다”가 원문의 단정적 귀결을 더 직접적으로 전달합니다.
  terminology: περιτομή는 “할례”, κηρύσσω는 “전파하다”, διώκομαι는 “박해를 받다”, σταυρός는 “십자가”로 적절합니다. σκάνδαλον은 본문에서 “걸림돌이 되는 일”로 풀고, 각주에서 직역 및 의미 범위를 제시합니다.
