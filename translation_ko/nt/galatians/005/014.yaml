  - severity: low
    issue: γάρ의 근거 기능이 드러나지 않음
    rationale: 초안은 문장 연결상 ‘-으니’를 사용하지만, 독립된 절에서는 원문의 설명·근거 기능이 충분히 분명하지 않습니다. ‘이는 … 때문입니다’로 반영했습니다.
