base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
  footnotes:
  - marker: a
    text: Or “in one word.” The Greek says literally “in one word/statement,” meaning in a single saying or command.
    reason: lexical_alternative
  - marker: b
    text: Or “has been fulfilled” or, interpretively, “is summed up.” The Greek verb more literally means “is fulfilled,” which may also imply that the law’s intent reaches its completion in this command.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 온 율법이 한 말씀 안에서 성취되었기 때문입니다.[b] 곧 「너는 네 이웃을 네 자신과 같이 사랑하라」는 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 레위기 19:18의 인용.
    reason: cross_reference
  - marker: b
    text: 그리스어는 완료 수동태로, ‘성취되었습니다’ 또는 ‘성취되어 있습니다’라는 뜻입니다. ‘요약됩니다’는 문맥에 따른 해석적 번역입니다.
    reason: alternative_reading
