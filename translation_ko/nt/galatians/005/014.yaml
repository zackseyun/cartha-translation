  source_fidelity: 개정안은 γάρ의 근거 제시를 ‘이는 … 때문입니다’로 드러내고, πᾶς νόμος를 ‘온 율법’으로 유지하며, ἐν ἑνὶ λόγῳ와 완료 수동태 πεπλήρωται를 각각 ‘한 말씀 안에서’, ‘성취되었기’로 충실히 옮깁니다. 인용문의 σεαυτόν은 ‘네 몸’보다 원문에 가까운 ‘네 자신’으로 바로잡았습니다.
