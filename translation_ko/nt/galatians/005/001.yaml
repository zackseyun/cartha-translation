source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
  footnotes:
  - marker: a
    text: Or, 'In freedom Messiah has set us free.' The opening dative phrase is compressed and can be understood in more than one closely related way.
    reason: alternative_reading
  - marker: b
    text: Traditional English often has 'do not be entangled again with a yoke of slavery.' The Greek verb can carry the sense of becoming subject to or ensnared by something.
    reason: lexical_alternative
translation:
  language: ko
  text: 메시아께서 자유를 위하여 우리를 자유롭게 하셨습니다[a]. 그러므로 굳게 서십시오. 그리고 다시 노예살이의 멍에에 매이지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「메시아께서 자유 안에서 우리를 자유롭게 하셨습니다」. 「자유를 위하여」로 옮긴 압축된 여격 표현은 목적 또는 결과의 뉘앙스를 지닐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ … ἠλευθέρωσεν
  english_pob_choice: For freedom Messiah set us free
  chosen_korean: 자유롭게 하시려고 자유를 주셨다
  alternatives_korean:
  - 자유를 위해 메시아께서 우리를 자유롭게 하셨다
  lexicon: BDAG
  rationale: 동족 목적어의 강조를 한국어 「자유를 주셨다」로 풀어 자연스럽게 옮긴다.
- source_word: ζυγῷ δουλείας
  english_pob_choice: a yoke of slavery
  chosen_korean: 노예의 멍에
  alternatives_korean:
  - 종됨의 멍에
  lexicon: BDAG
  rationale: δουλεία를 「노예 상태」로 일관되게 옮김. 매임의 무게를 살린다.
