base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
  footnotes:
  - marker: a
    text: Or 'the sinful nature' for 'the flesh'; the Greek word is σάρξ (sarx), which Paul uses with a broader ethical sense here than mere physical body.
    reason: lexical_alternative
  - marker: b
    text: Or 'the spirit' if taken as the human spirit rather than the Holy Spirit.
    reason: alternative_reading
translation:
  language: ko
  text: 육체[a]는 성령[b]을 거슬러 욕망하고, 성령은 육체를 거슬러 욕망합니다. 이 둘은 서로 대립하여, 여러분이 원하는 것을 행하지 못하도록 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄된 본성’. 그리스어 σάρξ(사르크스)는 여기서 단순한 육체를 넘어 윤리적 의미로 사용됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영’. 여기서는 문맥상 성령을 가리키는 것으로 보는 해석이 유력합니다.
    reason: alternative_reading
