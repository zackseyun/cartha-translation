  text: 나는 주 안에서 여러분에 대하여 확신합니다. 여러분이 다른 생각을 품지 않을 것이라고 말입니다. 그러나 여러분을 어지럽히는 자는, 그가 누구든지 심판을 짊어질 것입니다.
  philosophy: optimal-equivalence
