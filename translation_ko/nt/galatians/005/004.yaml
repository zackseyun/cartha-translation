base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
  footnotes:
  - marker: a
    text: Or 'alienated from Christ' or 'cut off from Christ.'
    reason: lexical_alternative
  - marker: b
    text: Or 'You who are being justified by law.' The Greek present passive may be rendered more formally this way; here it is translated to reflect Paul's argument about seeking justification on the basis of law.
    reason: lexical_alternative
  - marker: c
    text: Or 'from Christ.' Greek Christos can be rendered 'Christ' or, when functioning clearly as a title, 'Messiah.'
    reason: alternative_reading
translation:
  language: ko
  text: 율법으로 의롭다 함을 받으려는 여러분은 메시아에게서 끊어졌고, 은혜에서 떨어졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατηργήθητε ἀπὸ Χριστοῦ
  english_pob_choice: have been severed from the Messiah
  chosen_korean: 메시아에게서 끊어지다
  alternatives_korean:
  - 메시아로부터 분리되다
  - 그리스도로부터 단절되다
  lexicon: BDAG
  rationale: καταργέω + ἀπό의 분리·해제 의미를 「끊어지다」로 강하게 옮긴다.
- source_word: τῆς χάριτος ἐξεπέσατε
  english_pob_choice: you have fallen away from grace
  chosen_korean: 은혜에서 떨어지다
  alternatives_korean:
  - 은혜에서 탈락하다
  lexicon: BDAG
  rationale: ἐκπίπτω의 「떨어져 나옴」 의미를 살린다.
