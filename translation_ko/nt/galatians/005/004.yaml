  terminology: ‘메시아’는 영어 POB의 Messiah 선택 및 Χριστός의 칭호성을 반영하며, ‘율법’, ‘의롭다 함’, ‘은혜’도 신학적 의미를 과도하게 해석하거나 특정 교리 결론을 강요하지 않고 전달합니다.
