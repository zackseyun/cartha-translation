  source_fidelity: κατηργήθητε ἀπὸ Χριστοῦ를 ‘메시아에게서 끊어졌고’로, τῆς χάριτος ἐξεπέσατε를 ‘은혜에서 떨어졌습니다’로 옮겨 두 완료적·결정적 경고의 힘을 적절히 보존합니다. ‘율법으로 의롭다 함을 받으려는’은 ἐν νόμῳ δικαιοῦσθε의 문맥상 의도·추구의 뉘앙스를 자연스럽게 드러내며, 원문의 현재 수동태를 부당하게 능동으로 바꾸지 않습니다.
