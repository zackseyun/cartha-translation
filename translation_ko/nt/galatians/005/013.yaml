- from: 형제 여러분, 여러분은 자유를 위해 부르심을 받았습니다. 다만 그 자유를 육체를 위한 빌미로 삼지 말고, 도리어 사랑을 통해 서로 종노릇 하십시오[a].
  to: 형제 여러분[a], 여러분은 자유를 위하여 부르심을 받았습니다. 다만 그 자유를 육체[b]를 위한 빌미로 삼지 말고, 도리어 사랑으로 서로 섬기십시오[c].
  rationale: The revision preserves the Greek wording and its deliberate freedom/service tension while using natural modern formal Korean. It retains 「육체」for σάρξ, represents the adversative ἀλλά with 「도리어」, and places the stronger lexical force of δουλεύετε in a non-interpretive footnote. Footnote anchors are placed on the terms they explain.
