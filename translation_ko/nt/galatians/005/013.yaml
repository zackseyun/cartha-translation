review_pass:
  verdict: revise
  source_fidelity: The draft conveys the calling to freedom, the warning against making freedom an ἀφορμή for the flesh, and the contrasting command. However, 「서로 종노릇 하십시오」is less natural in modern Korean and can suggest mutual subjugation rather than the reciprocal service expressed by δουλεύετε ἀλλήλοις. The lexical slave-service nuance is better retained in a restrained footnote.
  naturalness: 「형제 여러분」, 「자유를 위하여 부르심을 받았습니다」, and 「육체를 위한 빌미」are understandable in formal Korean. 「사랑으로 서로 섬기십시오」is idiomatic, direct, and appropriately formal-polite. Restoring 「도리어」makes the Greek ἀλλά contrast explicit.
  terminology: 「육체」appropriately preserves σάρξ rather than prematurely interpreting it as ‘sinful nature.’ 「섬기십시오」is the most natural main-text rendering of δουλεύετε; its cognate slave-service force can be noted without adding the interpretive claim about ‘self-binding.’ A footnote on 「형제 여러분」clarifies the mixed-community reference without altering the masculine plural form.
  issues:
  - severity: medium
    issue: 「서로 종노릇 하십시오」is overly literal and unnatural as the main rendering of δουλεύετε ἀλλήλοις.
    rationale: Although δουλεύω has slave-service associations, in this reciprocal ethical imperative the natural Korean equivalent is 「서로 섬기십시오」. The current phrase may imply being mutually enslaved and distract from the exhortation to loving service.
  - severity: low
    issue: The existing footnote adds an interpretive theological formulation (‘자기 매임’) not stated by the verse.
    rationale: A lexical note should identify the slave-service association of δουλεύετε without characterizing the verse’s meaning through an added interpretive concept.
  - severity: low
    issue: The contrast introduced by ἀλλά is not fully represented after 「말고」.
    rationale: Adding 「도리어」clearly reflects the source’s adversative contrast and improves the flow of the exhortation.
  revised_text: 형제 여러분[a], 여러분은 자유를 위하여 부르심을 받았습니다. 다만 그 자유를 육체[b]를 위한 빌미로 삼지 말고, 도리어 사랑으로 서로 섬기십시오[c].
  revised_footnotes:
