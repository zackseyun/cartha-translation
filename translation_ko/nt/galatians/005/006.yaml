  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
  footnotes:
  - marker: a
    text: Or 'Christ Jesus.' The Greek title Χριστός is rendered 'Messiah' here to preserve its meaning as a title.
    reason: alternative_reading
  - marker: b
    text: πίστις can also be rendered 'faithfulness' or 'trust'; the main text follows the project's default 'faith.'
    reason: lexical_alternative
  - marker: c
    text: Or 'faith being active through love,' 'faith expressing itself through love,' or 'faith made effective through love.'
    reason: lexical_alternative
translation:
  language: ko
  text: 메시아 예수 안에서는 할례나 무할례는 아무 효력이 없고, 오직 사랑을 통하여 작용하는 믿음[a]만이 효력이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「사랑을 통하여 활성화되는 믿음」, 「사랑으로 표현되는 믿음」, 「사랑으로 효력을 발휘하는 믿음」. 헬라어 ἐνεργουμένη는 중간태 또는 수동태로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πίστις δι’ ἀγάπης ἐνεργουμένη
  english_pob_choice: faith working through love
  chosen_korean: 사랑을 통해 일하는 믿음
  alternatives_korean:
  - 사랑으로 역사하는 믿음
  - 사랑으로 표현되는 믿음
  lexicon: BDAG
  rationale: 중간태로 읽어 능동적 「일하는」을 살린다. 한국 전통 「역사하는」도 가능하지만 현대 합쇼체에 어색하다.
