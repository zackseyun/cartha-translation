  revision_rationale: 핵심 명사를 「권유」에서 더 넓고 중립적인 「설득」으로 바꾸고, 현재분사 καλοῦντος를 「부르시는」으로 반영했습니다. 본문이 명시하지 않는 ‘하나님’을 보충하지 않았으며, 어휘적 대안은 각주에 남겼습니다.
