  source_fidelity: 「믿음에서 난 사람들」은 οἱ ἐκ πίστεως의 근거·출처 의미를 기계적으로 옮긴 표현으로 한국어에서는 혈통적 출생을 연상시켜 부자연스럽습니다. 「믿음으로 말미암는 사람들」은 ἐκ πίστεως의 의미를 자연스럽게 보존합니다. οὗτοι의 강조는 「바로」로, υἱοί의 복수는 「아들들」로 유지했습니다.
  naturalness: 현 초안의 「믿음에서 난 사람들」은 현대 표준어 성경 문맥에서 어색합니다. 또한 「알아 두십시오」의 ‘두십시오’는 원문의 단순 명령보다 기억·보존의 뉘앙스를 더합니다. 「…임을 아십시오」는 합쇼체로 자연스럽고 원문에 가깝습니다.
