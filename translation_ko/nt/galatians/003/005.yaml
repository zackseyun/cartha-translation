id: GAL.3.5
reference: Galatians 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
  footnotes:
  - marker: a
    text: Or “in you.”
    reason: lexical_alternative
  - marker: b
    text: Or “by hearing of faith,” or “by the message heard with faith.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 여러분에게 성령을 공급하시고 여러분 가운데서[a] 기적들을 행하시는 분께서, 율법의 행위로 하십니까, 아니면 믿음으로 듣는 것을 통해[b] 하십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여러분 안에서.”
    reason: ἐν ὑμῖν은 공동체 가운데서 일어나는 일을 가리킬 수도 있고, 수신자들 안에서 일어나는 일을 가리킬 수도 있다.
  - marker: b
    text: 또는 “믿음의 들음으로,” 또는 “믿음으로 받아들인 들은 말씀을 통해.”
    reason: ἀκοῆς πίστεως는 ‘듣기’와 ‘믿음’의 관계를 압축한 표현으로, 문법적으로 서로 밀접하게 관련된 여러 번역이 가능하다.
