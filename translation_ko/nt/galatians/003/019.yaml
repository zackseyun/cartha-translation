  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
  footnotes:
  - marker: a
    text: Or "offspring" or "descendant."
    reason: lexical_alternative
  - marker: b
    text: '"Because of transgressions" may mean to address, expose, or restrain transgressions; the Greek does not specify more narrowly.'
    reason: alternative_reading
  - marker: c
    text: Or "having been ordained" or "having been arranged."
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇다면 율법은 왜 있습니까? 그것은 범법 때문에[b] 약속이 주어진 그 씨[a]가 올 때까지 더해진 것이며, 천사들을 통하여 한 중보자를 통하여 정해진 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘씨’는 ‘후손’ 또는 ‘자손’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘범법 때문에’는 범법을 다루거나 드러내거나 억제하기 위하여라는 뜻일 수 있으나, 헬라어 본문은 그 목적을 더 구체적으로 밝히지 않습니다.
    reason: alternative_reading
  - marker: c
    text: ‘정해진’은 ‘제정된’ 또는 ‘배치된’으로도 옮길 수 있습니다.
    reason: lexical_alternative
