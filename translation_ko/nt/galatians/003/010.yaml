translation:
  language: ko
  text: 율법의 행위에 근거를 두는 모든 사람은 저주 아래 있습니다[a]. 기록되기를, “율법책에 기록된 모든 것을 계속 지켜 행하지 않는 사람은 모두 저주를 받습니다[b]” 하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “율법의 행위에 의지하는.”
    reason: alternative_reading
  - marker: b
    text: 직역하면, “율법책에 기록된 모든 것 안에 머물러 그것들을 행하지 않는 모든 사람.”
    reason: lexical_alternative
