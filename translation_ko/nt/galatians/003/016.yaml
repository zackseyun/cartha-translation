translation:
  language: ko
  text: 약속들은 아브라함과 그의 씨[a]에게 말씀으로 주어졌습니다. 하나님께서는 많은 이를 가리켜 말씀하신 것처럼 「그리고 씨들[b]에게」라고 말씀하지 않으시고, 한 분을 가리켜 「그리고 네 씨에게」라고 말씀하셨습니다. 그분이 곧 메시아이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 σπέρμα는 이 절 전체에서 ‘씨’로 옮길 수 있는 단수 집합명사입니다. 바울의 논증은 단수형과 복수형의 대조에 근거합니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 복수형 ‘씨들’(σπέρμασιν)입니다. 바울은 이 복수형을 뒤의 단수형 ‘씨’와 대조합니다.
    reason: lexical_alternative
