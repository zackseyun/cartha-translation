  source_fidelity: 원문의 조건문과 강조(ὄντως)를 보존하되, ζῳοποιῆσαι는 ‘살리는 힘’이라는 해석적 명사구보다 ‘생명을 줄 수 있는’으로 직접 옮기는 편이 낫습니다. ἐκ νόμου도 ‘율법에서 났을’보다 ‘율법에서 왔을’이 자연스럽고 원문의 출처·근원을 더 분명히 나타냅니다.
  naturalness: ‘하나님의 약속들에 반대됩니까?’도 이해되지만, ‘하나님의 약속들에 대항하는 것입니까?’가 한국어에서 문법적으로 더 자연스럽습니다. 합쇼체의 수사 의문문과 강한 부정도 유지했습니다.
  terminology: νόμος는 문맥의 모세 율법을 포함하는 일반적 논증을 따라 ‘율법’으로, δικαιοσύνη는 기존 한국어 성경 용례 및 영어 POB 결정을 따라 ‘의’로 옮겼습니다. 영어 감사 기록의 ‘justice’ 대안은 한국어 각주에서 ‘정의’로 보존합니다.
