  source_fidelity: 핵심 문장은 ἐξηγόρασεν(속량하셨습니다), ἐκ τῆς κατάρας τοῦ νόμου(율법의 저주에서), γενόμενος ὑπὲρ ἡμῶν κατάρα(우리를 위하여 저주가 되심으로)를 충실히 반영합니다. 다만 인용문의 「저주를 받았다」는 Ἐπικατάρατος의 현재적·서술적 ‘저주받은 자이다/저주받았다’보다 완료된 사건을 더 강하게 들리게 하므로, 형용사적 진술을 보존하도록 고쳤습니다.
