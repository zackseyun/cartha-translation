  source_fidelity: 핵심 어휘 선택은 대체로 충실합니다. 「메시아의 것」은 Χριστοῦ의 소속 속격을 반영하고, 「씨」는 σπέρμα의 단수 및 본문 내 선행 논증과의 연결을 보존하며, 「상속자들」은 κληρονόμοι에 적절합니다. 다만 δέ를 강한 역접인 「그러나」로 옮기면 문맥상의 가벼운 연결·추론보다 대조가 강해집니다. 또한 κατ’ ἐπαγγελίαν에는 「약속을 따른」보다 「약속에 따른」이 더 자연스럽고 정확합니다.
