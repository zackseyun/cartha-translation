  terminology: 「메시아」, 「아브라함」, 「씨」, 「상속자」는 적절합니다. 「씨」는 현대 한국어에서 다소 문어적이지만 갈라디아서 3장의 어휘적 연결을 보존하기 위해 유지하는 것이 타당합니다.
