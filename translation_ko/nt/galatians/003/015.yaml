source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
  footnotes:
  - marker: a
    text: '''Brothers'' translates the masculine plural adelphoi; Paul is addressing fellow believers, likely including women.'
    reason: cultural_note
  - marker: b
    text: Or 'will' / 'testament' for 'covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 형제 여러분[a], 사람의 일에 빗대어 말씀드립니다. 사람이 확정한 언약[b]일지라도 아무도 그것을 폐기하거나 거기에 무엇을 덧붙이지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「형제 여러분」에 해당하는 헬라어 ἀδελφοί는 남성 복수형이지만, 바울이 신자 공동체를 부르는 호칭으로 여성도 포함했을 가능성이 크다.
    reason: cultural_note
  - marker: b
    text: 또는 「유언」 또는 「유언장」. 헬라어 διαθήκη는 문맥에 따라 「언약」이나 「유언」을 가리킬 수 있다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκην
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 유언
  - 약정
  lexicon: BDAG
  rationale: 본문은 다음 절들에서 신적 언약과의 연결을 시도하므로 「언약」을 유지하되, 일상적 「유언」 의미는 각주로 둔다.
- source_word: κεκυρωμένην
  english_pob_choice: ratified
  chosen_korean: 비준한
  alternatives_korean:
  - 확정한
  lexicon: BDAG
  rationale: 법적·공적으로 효력을 부여한 의미를 살린다.
