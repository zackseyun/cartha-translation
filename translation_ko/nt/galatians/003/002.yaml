id: GAL.3.2
reference: Galatians 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
  footnotes:
  - marker: a
    text: Or 'by the hearing of faith'; the phrase may also mean hearing the message in faith.
    reason: alternative_reading
  - marker: b
    text: '''Faithfulness'' is a less likely nuance for ''faith'' here but is sometimes discussed because the Greek construction is compressed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 여러분에게서 이것 한 가지만 알고 싶습니다. 여러분이 성령을 받은 것이 율법의 행위에서 비롯된 것입니까, 아니면 믿음[b]으로 듣는 데서 비롯된 것입니까[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「믿음의 들음」. 헬라어 ἀκοῆς πίστεως는 믿음과 관련된 들음이라는 압축된 표현이며, 메시지를 믿음으로 듣는 것을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘믿음’은 여기서 ‘신실함’이라는 뉘앙스로 이해될 가능성도 논의되지만, 그 가능성은 덜 유력합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  english_pob_choice: by works of the law
  chosen_korean: 율법의 행위에 근거한 것
  alternatives_korean:
  - 율법의 행위로
  - 율법의 일들로
  lexicon: BDAG
  rationale: ἐκ + 속격의 근거·기원 의미를 살린다.
- source_word: ἐξ ἀκοῆς πίστεως
  english_pob_choice: by hearing with faith
  chosen_korean: 믿음으로 들음에 근거한 것
  alternatives_korean:
  - 믿음의 들음으로
  - 들음의 믿음으로
  lexicon: BDAG
  rationale: ἀκοή의 「들음(행위/내용)」과 πίστις의 결합을 자연스럽게 옮긴다.
