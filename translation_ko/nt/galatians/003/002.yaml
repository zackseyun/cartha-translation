    rationale: ‘들음’의 명사화 뒤에 다시 ‘에 근거한 것’을 붙인 표현은 현대 한국어에서 매끄럽지 않습니다. ‘믿음으로 듣는 데서’로 옮기면 의미를 유지하면서 자연스러워집니다.
  - severity: low
    issue: πίστεως의 대안적 뉘앙스 각주가 빠짐
