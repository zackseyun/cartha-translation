  rationale: 본문은 ‘이것 한 가지만’으로 τοῦτο μόνον의 강조를 보존하고, ‘성령을 받은 것이 …에서 비롯된 것입니까’로 ἐλάβετε와 두 ἐκ 구문의 수단·출처 대조를 자연스럽게 재현했습니다. ‘믿음으로 듣는 데’는 ἀκοῆς πίστεως를 한 가지 교리적 해석으로 고정하지 않으며, 각주가 직역적 표현과 대안적 뉘앙스를 보존합니다.
