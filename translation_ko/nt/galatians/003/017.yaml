- from: 내가 말하려는 바는 이것입니다. 사백삼십 년 뒤에 생긴 율법은, 하나님께서 미리 비준하신 언약을 무효화하여 그 약속을 폐기할 수 없습니다.
  to: 제가 말하는 바는 이것입니다. 사백삼십 년 뒤에 생긴 율법은 하나님께서 미리 확증하신 언약을 무효로 만들어 그 약속의 효력을 없애지 못합니다.
  rationale: The revision retains the chronology, divine agency, legal force, and covenant terminology of the Greek while clarifying that the law cannot invalidate the prior covenant so as to render the promise ineffective. No footnotes are required because no unresolved textual or lexical ambiguity needs to be carried in this Korean rendering.
