translation:
  language: ko
  text: 성경은 하나님께서 이방인들을 믿음으로 의롭다 하실 것을 미리 보고, 아브라함에게 미리 좋은 소식을 전했습니다. 「네 안에서 모든 이방인이 복을 받을 것이다.」
  philosophy: optimal-equivalence
