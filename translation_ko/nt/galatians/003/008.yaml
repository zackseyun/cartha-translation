review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 반복되는 τὰ ἔθνη / πάντα τὰ ἔθνη와 영어 POB의 일관된 “nations”를 초안의 ‘이방인(들)’은 ‘민족들’로 옮기는 편이 더 충실합니다. 또한 προευηγγελίσατο의 복음 선포 의미는 ‘좋은 소식’보다 ‘복음을 미리 전했습니다’가 더 직접적으로 보존합니다.
  naturalness: ‘성경은 … 미리 보고’도 이해되지만, personified γραφή의 선행 인식을 나타내는 ‘미리 내다보고’가 현대 표준어 문맥에서 더 자연스럽습니다. 문장 전체는 합쇼체 서술로 유지했습니다.
  terminology: δικαιόω는 ‘의롭다 하다’로 적절합니다. ἔθνη는 이 절의 두 용례 모두 ‘민족들’로 통일하여 아브라함 인용문의 어휘 반복을 보존했습니다. εὐαγγελ- 어근은 ‘복음’으로 반영했습니다.
  issues:
  - severity: medium
    issue: ἔθνη를 두 곳 모두 ‘이방인(들)’으로 번역함
    rationale: 원문은 바울의 진술과 인용문에서 같은 어휘를 반복하며, 제공된 영어 POB도 이 연결을 보존하려고 두 곳 모두 “nations”를 선택합니다. ‘이방인’도 가능한 어휘 범위이지만, 여기서는 ‘민족들’이 원문의 반복과 인용의 보편적 범위를 더 잘 보존합니다.
  - severity: low
    issue: προευηγγελίσατο를 ‘미리 좋은 소식을 전했습니다’로 풀이함
    rationale: 뜻은 대체로 전달되지만, 동사의 명시적인 복음(εὐαγγελ-) 의미를 ‘복음을 미리 전했습니다’로 옮기면 더 정확하고 한국어 성경 용례에도 자연스럽습니다.
  revised_text: 성경은 하나님께서 믿음으로 민족들을 의롭다 하실 것을 미리 내다보고, 아브라함에게 복음을 미리 전했습니다. “네 안에서 모든 민족이 복을 받을 것이다.”
  revised_footnotes: []
  revision_rationale: 원문의 ἔθνη 반복을 ‘민족들’로 통일하고, προευηγγελίσατο의 복음 선포 의미를 직접 드러냈습니다. ‘네 안에서’는 ἐν σοὶ의 해석상 열려 있는 표현을 보존하며, 미래 수동형 ‘복을 받을 것이다’도 유지했습니다.
