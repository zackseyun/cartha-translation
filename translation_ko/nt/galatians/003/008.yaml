review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 ἔθνη를 두 차례 모두 ‘이방인’으로 옮겨 그리스어의 반복은 유지하지만, 원문의 ‘민족들’ 및 인용문의 보편적 범위를 ‘이방인’이라는 대조적 집단 개념으로 좁힙니다. 또한 영어 POB의 ‘nations’ 선택 및 그에 따른 어휘 연결도 반영하지 못합니다.
  naturalness: ‘성경은 … 미리 보고’는 이해 가능하나, ‘미리 내다보고’가 현대 표준 한국어에서 더 자연스럽습니다. ‘복음을 미리 전했습니다’는 προευηγγελίσατο의 복음 선포 의미와 시간적 요소를 간결하고 자연스럽게 전달합니다.
  terminology: ἡ γραφή는 바울의 의인화된 ‘성경’으로 적절합니다. δικαιοῖ는 ‘의롭다 하시다’로, ἐκ πίστεως는 ‘믿음으로’로 옮깁니다. τὰ ἔθνη와 πάντα τὰ ἔθνη는 모두 ‘민족들’로 일관되게 번역하고, ‘이방인들’이라는 가능한 대안은 해당 첫 용례에 각주로 제시합니다.
  issues:
  - severity: medium
    issue: ἔθνη를 두 용례에서 모두 ‘이방인(들)’으로 번역함
    rationale: 원문은 ‘민족들’을 반복하여 하나님의 믿음에 의한 의롭다 하심과 아브라함에게 주어진 약속을 연결합니다. ‘이방인’도 가능한 문맥적 번역이나, 이 본문에서는 ‘민족들’이 원문의 반복과 인용의 범위를 더 직접적으로 보존합니다.
  - severity: low
    issue: ‘미리 좋은 소식을 전했습니다’의 용어 선택
    rationale: 뜻은 전달되지만, προευηγγελίσατο에는 εὐαγγελ- 즉 ‘복음’의 어휘적 표지가 있습니다. ‘복음을 미리 전했습니다’가 접근성을 크게 해치지 않으면서 이를 더 분명히 반영합니다.
  revised_text: 성경은 하나님께서 민족들을 믿음으로 의롭다 하신다는 것을 미리 내다보고, 아브라함에게 복음을 미리 전했습니다. “너 안에서 모든 민족이 복을 받을 것이다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘이방인들’. 그리스어 에트네(ἔθνη)는 ‘민족들’ 또는 ‘이방인들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 문장 구조, 곧 성경이 하나님의 믿음에 의한 민족들의 의롭다 하심을 미리 보고 아브라함에게 복음을 미리 전했다는 흐름을 보존했습니다. ἔθνη의 두 반복을 ‘민족(들)’으로 일치시켜 인용문과의 어휘적 연결을 살렸으며, 가능한 ‘이방인들’ 번역은 해당 어휘에만 정확히 연결되는 각주로 남겼습니다. ἐν σοί는 해석적으로 ‘너로 말미암아’로 바꾸지 않고 ‘너 안에서’로 보존했습니다.
