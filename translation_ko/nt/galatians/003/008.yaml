  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
  footnotes:
  - marker: a
    text: Or “the Gentiles”; Greek ἔθνη can mean “nations” or “Gentiles.”
    reason: lexical_alternative
  - marker: b
    text: Or “preached the gospel beforehand to Abraham.”
    reason: lexical_alternative
translation:
  language: ko
  text: 성경은 하나님께서 믿음으로 민족들을 의롭다 하실 것을 미리 내다보고, 아브라함에게 복음을 미리 전했습니다. “네 안에서 모든 민족이 복을 받을 것이다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γραφή
  english_pob_choice: the Scripture
  chosen_korean: 성경
  alternatives_korean: []
  lexicon: BDAG
  rationale: 표준 한국어.
- source_word: προευηγγελίσατο
  english_pob_choice: proclaimed the good news beforehand
  chosen_korean: 미리 좋은 소식을 전하다
  alternatives_korean:
  - 복음을 미리 전하다
  lexicon: BDAG
  rationale: 복합어의 「미리 + 복음 전함」을 직역으로 풀이.
- source_word: ἔθνη
  english_pob_choice: the nations
  chosen_korean: 이방인
  alternatives_korean:
  - 민족들
  - 열방
  lexicon: BDAG
  rationale: 창 12:3 인용 맥락에서 「이방인」이 한국 성경의 표준이다.
