source:
  edition: SBLGNT
  text: ὥστε ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν, ἵνα ἐκ πίστεως δικαιωθῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
  footnotes:
  - marker: a
    text: Or 'our custodian'; traditionally 'our tutor.' The Greek παιδαγωγός refers to a household guardian or supervisor for a child, not primarily a classroom teacher.
    reason: lexical_alternative
  - marker: b
    text: Literally 'unto the Messiah'; the phrase may also be understood as 'leading to the Messiah.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 율법은 메시아께로[a] 향한 우리의 보호자[b]가 되었습니다. 이는 우리가 믿음으로 의롭다 하심을 받도록 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 「메시아께로」입니다. 「메시아에게로」, 「메시아를 향하여」로도 옮길 수 있으며, 문맥상 「메시아의 때까지」라는 뜻으로 이해되기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 헬라어 παιδαγωγός. 고대 그리스·로마 가정에서 미성년 자녀를 돌보고 감독하며 동행하던 가정의 보호자 또는 감독자를 가리킵니다. 주로 학교 교사를 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδαγωγὸς
  english_pob_choice: guardian
  chosen_korean: 양육자
  alternatives_korean:
  - 보호자
  - 감독자
  - 후견인
  - 몽학선생
  lexicon: BDAG
  rationale: 교사가 아닌 미성년 자녀의 감독·동행자를 가리킨다. 한국 전통의 「몽학선생」은 오해의 소지가 있어 「양육자」로 옮기고 각주로 설명한다.
- source_word: εἰς Χριστόν
  english_pob_choice: until Messiah
  chosen_korean: 메시아께로
  alternatives_korean:
  - 메시아에게로
  - 메시아의 때까지
  - 메시아를 향해
  lexicon: BDAG
  rationale: εἰς의 시간적·목적적 의미가 함께 작용한다. 「메시아께로」가 양면을 함축한다.
