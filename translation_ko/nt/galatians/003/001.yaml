    issue: 후반절에 「그려졌는데도 말입니다」를 사용함
    rationale: οἷς κατ’ ὀφθαλμοὺς 이하의 관계절은 ‘여러분의 눈앞에 … 제시되었던’이라는 수식이며, 양보 의미의 ‘그런데도/…는데도’가 명시되어 있지 않습니다.
  - severity: low
    issue: 「마술을 걸다」의 한국어 연상
    rationale: 기본 의미는 반영하지만, 현대 한국어에서는 초자연적 주술보다 오락적 마술을 연상할 수 있습니다. 본문의 비유적 ‘bewitch’는 「홀리다」가 더 자연스럽고, 직역적 뉘앙스는 각주로 보존할 수 있습니다.
