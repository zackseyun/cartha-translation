    reason: lexical_alternative
translation:
  language: ko
  text: 어리석은 갈라디아 사람들이여, 여러분의 눈앞에 십자가에 못 박히신 예수, 곧 메시아께서 분명히 제시되었는데, 누가 여러분을 홀렸습니까[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἐβάσκανεν은 직역하면 「마술을 걸다」 또는 「주술로 홀리다」라는 뜻이며, 「현혹하다」로도 옮길 수 있다.
    reason: lexical_alternative
