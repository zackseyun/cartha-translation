- from: 어리석은 갈라디아 사람들이여, 누가 여러분에게 마술을 걸었습니까[a]? 여러분의 눈앞에서 예수 메시아가 십자가에 못 박힌 모습으로 분명히 그려졌는데도 말입니다.
  to: 어리석은 갈라디아 사람들이여, 여러분의 눈앞에 십자가에 못 박히신 예수, 곧 메시아께서 분명히 제시되었는데, 누가 여러분을 홀렸습니까[a]?
  rationale: 원문의 수사적 질문과 ‘여러분의 눈앞에’라는 관계절의 결속을 한국어 문장 안에서 보존했습니다. 양보 의미를 덧붙이지 않고, προεγράφη의 공개적·분명한 제시의 뜻을 「분명히 제시되었다」로 옮겼습니다. 「홀리다」와 각주를 함께 사용하여 βασκαίνω의 생생한 주술 비유와 한국어 자연스러움을 모두 확보했습니다.
