  source_fidelity: 핵심 어휘인 ἀνόητοι, ἐβάσκανεν, προεγράφη ἐσταυρωμένος는 대체로 충실하게 반영되었습니다. 그러나 현재 후반절의 「…그려졌는데도 말입니다」는 원문의 관계절을 양보절로 재구성하여, 바울의 수사적 질문에 원문에 없는 ‘그런데도’의 논리를 더합니다. 또한 προεγράφη의 ‘공개적으로/분명하게 제시됨’은 ‘그려짐’보다 넓은 표현으로 옮기는 것이 안전합니다.
  naturalness: 「누가 여러분에게 마술을 걸었습니까」도 이해되지만, 한국어에서는 ‘마술을 걸다’가 공연·오락 맥락을 먼저 떠올리게 할 수 있습니다. 「누가 여러분을 홀렸습니까」가 비유적 책망의 생동감을 보존하면서 더 자연스럽습니다. 관계절을 「여러분의 눈앞에 … 제시되었던」으로 처리하면 현대 한국어 합쇼체의 문장 흐름도 자연스럽습니다.
  terminology: Χριστός의 칭호 의미를 살려 「메시아」를 유지하되, 한국어의 자연스러운 동격 구조로 「예수, 곧 메시아」라고 옮깁니다. ἐσταυρωμένος는 「십자가에 못 박히신」으로 충실히 반영합니다.
  issues:
