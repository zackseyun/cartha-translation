  text: Now a mediator is not of one[b][a], but God is one.
  footnotes:
  - marker: a
    text: Or, more literally, “a mediator is not of one”; the sense may be “does not act for one alone” or “is not for one party alone.”
    reason: alternative_reading
  - marker: b
    text: “God is one” likely echoes Israel’s confession of monotheism; compare Deuteronomy 6:4.
    reason: cross_reference
translation:
  language: ko
  text: 그런데 중보자는 한쪽만을 위한 것이 아니며,[a] 하나님은 한 분이십니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “중보자는 한 사람/한 쪽의 것이 아닙니다.” 이 압축된 표현은 “한쪽만을 위해 일하지 않는다” 또는 “한 당사자만을 위한 것이 아니다”라는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: “하나님은 한 분이십니다”는 이스라엘의 유일신 신앙 고백을 반영하는 듯합니다. 신명기 6:4을 보십시오.
    reason: cross_reference
