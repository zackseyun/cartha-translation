id: GAL.6.16
reference: Galatians 6:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
  footnotes:
  - marker: a
    text: Or 'all who will follow this standard.' The verb carries the sense of walking in line with or keeping in step with a rule.
    reason: lexical_alternative
  - marker: b
    text: '''The Israel of God'' is debated: Paul may mean believing Jews, the whole church, or God''s people more broadly. The translation preserves the Greek wording without resolving the debate.'
    reason: alternative_reading
  - marker: c
    text: The final 'and' may be read either as adding a further group ('and upon the Israel of God') or as restating the same group ('even upon the Israel of God').
    reason: alternative_reading
translation:
  language: ko
  text: 이 규범을 따라 살아가는 모든 이들에게 평강과 자비가 있기를 빕니다[a]. 그리고 하나님의 이스라엘에게도 그러하기를 빕니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 기준을 따라 행하는 모든 이들에게.” ‘따라 살아가다’로 옮긴 말은 규범에 맞추어 걷거나 보조를 맞추어 살아간다는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하나님의 이스라엘’이 믿는 유대인들, 온 교회, 또는 더 넓게 하나님의 백성을 가리키는지에 대해서는 견해가 갈립니다. 번역은 그리스어 표현을 그대로 옮겨 이 문제를 결정하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 마지막 ‘그리고’는 별도의 대상을 덧붙이는 뜻으로도, 앞의 대상을 다시 가리키는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: κανόνι
  english_pob_choice: rule
  chosen_korean: 규범
  alternatives_korean:
  - 기준
  - 법도
  lexicon: BDAG
  rationale: 「측정 기준」으로서 「규범」이 자연스럽다.
- source_word: ἔλεος
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 자비하심
  lexicon: BDAG
  rationale: 글로사리에 따라 ἔλεος는 「자비」, ἀγάπη는 「사랑」으로 구분.
- source_word: τὸν Ἰσραὴλ τοῦ θεοῦ
  english_pob_choice: the Israel of God
  chosen_korean: 하나님의 이스라엘
  alternatives_korean: []
  lexicon: BDAG
  rationale: 해석 논쟁(=교회 vs 믿는 유대인 vs 전체 하나님 백성)을 본문이 미해결로 두므로 직역 보존.
