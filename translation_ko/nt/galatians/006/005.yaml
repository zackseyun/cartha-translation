  source_fidelity: 본문은 ἕκαστος, τὸ ἴδιον φορτίον, βαστάσει의 의미를 대체로 충실히 전달합니다. 다만 γάρ의 설명적 연결을 문장 끝의 ‘...때문입니다’로만 처리하면 독립된 절로 읽힐 때 다소 불완전하게 들릴 수 있습니다. ‘각 사람은’과 ‘자기 짐’은 각각의 개인성과 소유의 강조를 자연스럽게 보존합니다.
  naturalness: ‘각자 자기 짐’보다 ‘각 사람은 자기 짐’이 현대 표준어 문장에서는 더 매끄럽고, 합쇼체에도 잘 맞습니다. 문두에 ‘이는’를 두어 앞 절에 대한 γάρ의 설명 관계를 자연스럽게 드러냅니다.
  terminology: φορτίον을 ‘짐’으로 옮기는 것은 적절합니다. 다만 각주의 ‘각자에게 고유하게 지워진 짐’은 본문의 어휘적 의미를 넘어 ‘지워진’이라는 부가 개념을 넣습니다. 2절의 βάρη와 다른 그리스어 단어라는 사실만 간결하게 밝히는 편이 안전합니다.
