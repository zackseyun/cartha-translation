  terminology: παράπτωμα은 문맥상 “잘못”으로 유지할 수 있습니다. καταρτίζετε는 “바로잡아 주십시오”로, πραΰτης는 자연스러운 “온유한 마음으로”로 옮겼습니다. πειρασθῇ는 ‘유혹’과 ‘시험’의 여지를 보존하기 위해 본문에서 “시험에 들다”로 번역하고 각주에서 설명했습니다.
