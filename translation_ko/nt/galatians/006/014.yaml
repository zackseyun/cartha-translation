  - marker: b
    text: Greek 'Jesus Christ.' The title Χριστός is rendered 'Messiah' here to preserve its meaning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 자랑할 것은 우리 주 예수 메시아의 십자가밖에 없습니다. 그 십자가를 통하여 세상은 나에 대하여 십자가에 못 박혔고, 나도 세상에 대하여 십자가에 못 박혔습니다.
  philosophy: optimal-equivalence
