review_pass:
  verdict: revise
  source_fidelity: 첫 접속사 ὅτι의 설명·근거 기능이 번역문에서 빠졌습니다. 또한 εἰς τὴν σάρκα/εἰς τὸ πνεῦμα은 여기서 단순한 장소를 나타내기보다 ‘육체/성령을 위하여’ 심는다는 비유적 방향·목적을 나타내므로, ‘~에 심다’보다 ‘~을 위하여 심다’가 원문의 대조와 의미를 더 정확히 반영합니다. ἐκ의 원천 의미는 ‘~로부터’로 유지했습니다.
  naturalness: ‘부패를 거두다’는 한국어에서 다소 결합이 어색하고 윤리적 타락으로 지나치게 좁게 들릴 수 있습니다. ‘썩어짐을 거두다’는 농경 비유 및 φθορά의 쇠함·파멸·부패의 폭을 비교적 잘 보존합니다. 문장 전체는 현대 합쇼체로 자연스럽게 정리했습니다.
  terminology: ‘육체’는 바울의 σάρξ 용어를 보존하며, 각주에서 윤리적 의미 가능성을 밝혔습니다. 갈라디아서의 문맥상 πνεῦμα은 ‘성령’으로 옮기는 것이 타당합니다. ζωὴ αἰώνιος는 ‘영원한 생명’으로 유지했습니다.
  issues:
  - severity: medium
    issue: ὅτι가 번역되지 않았습니다.
    rationale: 이 접속사는 앞선 권면의 근거를 제시하므로 ‘왜냐하면’으로 드러내는 것이 필요합니다.
  - severity: medium
    issue: ‘자기 육체에/성령에 심는’은 εἰς의 비유적 방향·목적을 충분히 반영하지 못합니다.
    rationale: 이 문맥에서 씨 뿌림의 대상·지향을 나타내므로 ‘자기 육체를 위하여/성령을 위하여 심는’이 더 정확하고 자연스럽습니다.
  - severity: low
    issue: ‘부패를 거두다’의 한국어 결합이 다소 부자연스럽고 의미가 좁아질 수 있습니다.
    rationale: φθορά는 윤리적 부패에만 한정되지 않고 썩음과 파멸을 포괄합니다. ‘썩어짐’을 사용하면 이러한 범위를 더 잘 유지합니다.
  revised_text: 왜냐하면 자기 육체를 위하여 심는 사람은 육체로부터 썩어짐을 거둘 것이며, 성령을 위하여 심는 사람은 성령으로부터 영원한 생명을 거둘 것이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘자기의 죄된 본성을 위하여’. 여기서 ‘육체’(σάρξ)는 문자적 몸을 뜻할 수도 있으나, 바울의 윤리적 대조에서는 성령에 맞서는 타락한 인간의 성향을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘파멸’ 또는 ‘부패’. 그리스어 φθορά는 썩어짐, 부패, 파멸을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 성령을 가리킵니다. 일부는 ‘영’으로 옮기지만, 갈라디아서에서 육체와 대조되는 이 표현은 일반적으로 하나님의 성령을 가리킵니다.
    reason: alternative_reading
  revision_rationale: 원문의 설명 접속사와 씨 뿌림 비유의 방향·목적을 복원하고, φθορά의 의미 범위 및 한국어 자연스러움을 개선했습니다. 성령과 육체라는 본문의 대조 및 영원한 생명이라는 핵심 용어는 유지했습니다.
