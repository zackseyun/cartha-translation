review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s twofold sowing/reaping antithesis and correctly understands πνεῦμα in context as the Holy Spirit. However, ‘부패를 거두다’ is less faithful to φθορά’s resultative sense and is not idiomatic Korean in this agricultural metaphor. The reflexive force of ἑαυτοῦ is better retained with ‘자기 육체를 위하여.’
  naturalness: ‘~을 위하여 심다 / ~로부터 거두다’ is a natural and established Korean rendering of the metaphor. ‘썩어짐을 거두다’ is appropriately formal-biblical and communicates decay/corruption without prematurely narrowing φθορά to moral corruption or annihilation.
  terminology: ‘육체’ preserves Paul’s σάρξ terminology without imposing ‘sinful nature.’ ‘성령’ is contextually well supported by Galatians’ flesh/Spirit contrast. ‘영원한 생명’ is clear modern standard Korean for ζωὴ αἰώνιος.
  issues:
  - severity: medium
    issue: ‘부패를 거둘 것’ is semantically and idiomatically weak for φθοράν.
    rationale: φθορά includes decay, perishing, and ruin. Korean ‘부패’ can suggest primarily corruption, including social or moral corruption, whereas ‘썩어짐’ retains the broader decay/perishing sense and fits the reaping image.
  - severity: low
    issue: The draft’s ‘자기 육체에 심는’ does not express εἰς with σπείρω as clearly as Korean ‘자기 육체를 위하여 심는.’
    rationale: In this metaphor, εἰς indicates the orientation or object for which one sows. ‘~을 위하여 심다’ is both natural Korean and preserves the contrast with sowing for the Spirit.
  revised_text: 자기 육체를 위하여[a] 심는 사람은 육체로부터 썩어짐을[b] 거두고, 성령을 위하여[c] 심는 사람은 성령으로부터 영원한 생명을 거둘 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘자기 죄된 본성을 위하여.’ 여기서 ‘육체’는 문자적인 몸을 뜻할 수도 있지만, 바울의 윤리적 대조에서는 성령과 대립하는 타락한 인간의 성향을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부패’, ‘파멸’, ‘쇠퇴.’ 그리스어는 부패, 썩음, 파멸을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 성령을 가리킵니다. 일부는 ‘영’으로 옮기지만, 갈라디아서에서 육체와 대조되는 ‘영’은 일반적으로 하나님의 성령을 가리킵니다.
    reason: alternative_reading
  revision_rationale: 수정문은 σάρξ/πνεῦμα의 대조와 ἐκ(‘~로부터’)의 출처 표현을 보존합니다. ‘썩어짐’은 φθορά의 의미 범위를 보존하면서도 ‘거두다’와 자연스럽게 결합합니다. 각주로 ‘육체’와 ‘성령’의 해석상 쟁점을 밝혀 본문이 지닌 긴장을 불필요하게 해소하지 않았습니다.
