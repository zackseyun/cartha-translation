id: GAL.6.8
reference: Galatians 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
  footnotes:
  - marker: a
    text: Or 'to his own sinful nature.' The Greek word sarx can mean 'flesh' literally or, in Paul's ethical contrasts, the fallen human orientation opposed to the Spirit.
    reason: lexical_alternative
  - marker: b
    text: Or 'destruction' or 'decay.' The Greek word can denote corruption, ruin, or decay.
    reason: lexical_alternative
  - marker: c
    text: That is, the Holy Spirit; some render 'spirit' in lowercase, but in Galatians this contrast commonly refers to the Spirit of God.
    reason: alternative_reading
translation:
  language: ko
  text: 자기 육체를 위하여[a] 심는 사람은 육체로부터 썩어짐을[b] 거두고, 성령을 위하여[c] 심는 사람은 성령으로부터 영원한 생명을 거둘 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 죄된 본성을 위하여.’ 여기서 ‘육체’는 문자적인 몸을 뜻할 수도 있지만, 바울의 윤리적 대조에서는 성령과 대립하는 타락한 인간의 성향을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘부패’, ‘파멸’, ‘쇠퇴.’ 그리스어는 부패, 썩음, 파멸을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 성령을 가리킵니다. 일부는 ‘영’으로 옮기지만, 갈라디아서에서 육체와 대조되는 ‘영’은 일반적으로 하나님의 성령을 가리킵니다.
    reason: alternative_reading
