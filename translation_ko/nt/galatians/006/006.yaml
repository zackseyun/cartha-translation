review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the learner, the teacher, and the comprehensive scope of "all good things." However, "사람은 … 나누십시오" combines a third-person subject with a second-person honorific imperative, which does not represent the Greek third-person imperative naturally in Korean. The revision renders the ongoing exhortation as an obligation without narrowing the broad sense of κοινωνέω and ἐν πᾶσιν ἀγαθοῖς.
  naturalness: '"가르침 받는 사람" is understandable but less natural than "말씀을 배우는 사람" in this context. Repeating "말씀" with the teacher makes the referent explicit and produces a balanced, idiomatic Korean sentence. "나누어야 합니다" is appropriate modern formal-polite 합쇼체 for the Greek exhortation.'
  terminology: '"말씀" appropriately renders λόγον in this Pauline instructional context. "모든 좋은 것" retains the source''s broad wording and does not reduce it to money, while the footnote notes that material support is probably included. "가르치는 사람" is retained in a clearer contextual form as "말씀을 가르치는 사람."'
  issues:
  - severity: medium
    issue: Imperative-person mismatch in "말씀을 가르침 받는 사람은 가르치는 사람과 모든 좋은 것을 함께 나누십시오."
    rationale: The Greek uses a third-person imperative addressed generally concerning "the one being instructed." Korean "나누십시오" is a second-person honorific imperative and clashes syntactically with the stated third-person subject. "나누어야 합니다" supplies a natural formal-polite exhortation.
  - severity: low
    issue: '"가르침 받는 사람" is somewhat stilted and "가르치는 사람" leaves the content implicit.'
    rationale: The participles concern receiving and giving instruction in "the word." "말씀을 배우는 사람" and "말씀을 가르치는 사람" are more natural and preserve the contextual referent without importing the later technical term "예비 신자."
  revised_text: 말씀을 배우는 사람은 말씀을 가르치는 사람과 모든 좋은 것을 함께 나누어야 합니다[a].
