  rationale: The revision corrects the Korean imperative-person mismatch, improves modern formal-polite idiom, and makes the reciprocal instructional context explicit. It preserves the source and English audit trail's intentionally broad expression "all good things"; the note identifies likely material support without restricting the command to it.
