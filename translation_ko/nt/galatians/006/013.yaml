  - severity: medium
    issue: ‘다만’이 ἀλλά의 대조를 충분히 전달하지 못합니다.
    rationale: 여기서는 ‘그러나’가 앞의 ‘율법을 지키지 않는다’와 뒤의 ‘할례받기를 원한다’ 사이의 대조를 더 직접적으로 나타냅니다.
  - severity: medium
    issue: ‘여러분을 할례 받게 하고자 하는 것입니다’는 θέλουσιν의 주어와 의지를 다소 흐립니다.
    rationale: ‘그들은 … 하기를 원합니다’로 옮기면 그리스어의 명시된 주어와 의지 동사를 자연스럽고 분명하게 보존합니다.
