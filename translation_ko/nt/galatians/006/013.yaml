  terminology: ‘할례’, ‘율법’, ‘육체’는 문맥과 바울 서신의 용례에 적절합니다. οἱ περιτεμνόμενοι는 해석을 덧붙이지 않고 ‘할례를 받는 이들’로 옮겼습니다.
