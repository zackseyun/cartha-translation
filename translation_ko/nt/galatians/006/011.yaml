  naturalness: ‘보십시오, … 썼는지 말입니다’는 현대 표준어 합쇼체에서 어색하고 문장 종결도 부자연스럽습니다. ‘내가 여러분에게 내 손으로 얼마나 큰 글자로 썼는지 보십시오’가 자연스럽고 원문의 수사적 주의 환기를 유지합니다.
