revisions:
- from: 선한 일을 행함에 낙심하지 맙시다. 우리가 포기하지 않는다면 정한 때에 거둘 것이기 때문입니다.
  to: 선을 행하는 데에 낙심하지 맙시다. 우리가 지쳐 쓰러지지 않는다면, 정해진 때에 거둘 것이기 때문입니다.
  rationale: 'The revision improves modern Korean idiom and more closely represents the distinct wording of the two perseverance expressions: ἐγκακῶμεν as discouragement (“낙심하지 맙시다”) and ἐκλυόμενοι as exhaustion or fainting (“지쳐 쓰러지지 않는다면”). The future harvest and its proper, appointed time remain explicit.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:41:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the exhortation, the appointed timing of the harvest, and the conditional force of μὴ ἐκλυόμενοι. However, rendering ἐκλυόμενοι merely as “포기하지 않는다면” somewhat reduces its primary sense of becoming exhausted or fainting. A differentiated rendering can retain both the source nuance and the rhetorical contrast with ἐγκακῶμεν.
  naturalness: “선한 일을 행함에” is understandable but somewhat stiff in modern Korean. “선을 행하는 데에” is natural, formal-polite Korean and retains the ethical sense of τὸ καλὸν ποιεῖν. “정해진 때” is also more idiomatic than “정한 때.”
  terminology: “낙심하지 맙시다” is an appropriate rendering of ἐγκακῶμεν. “지쳐 쓰러지지 않는다면” preserves the exhaustion/fainting imagery of ἐκλυόμενοι without importing a doctrinal interpretation, while maintaining a meaningful distinction from “낙심하지 맙시다.”
  issues:
  - severity: low
    issue: The phrase “선한 일을 행함에” is stylistically stiff for the requested modern formal Korean.
    rationale: The source means doing what is good; “선을 행하는 데에” is idiomatic and preserves the ongoing ethical activity.
  - severity: medium
    issue: “포기하지 않는다면” underrepresents the exhaustion/fainting nuance of μὴ ἐκλυόμενοι.
    rationale: Although the participle can imply giving up, it more directly denotes becoming exhausted or losing strength. “지쳐 쓰러지지 않는다면” preserves that imagery and the conditional sense.
  - severity: low
    issue: “정한 때” is less natural than “정해진 때.”
    rationale: Both convey καιρῷ ἰδίῳ, but the revision is standard contemporary usage.
  revised_text: 선을 행하는 데에 낙심하지 맙시다. 우리가 지쳐 쓰러지지 않는다면, 정해진 때에 거둘 것이기 때문입니다.
  revised_footnotes: []
  revision_rationale: 'The revision improves modern Korean idiom and more closely represents the distinct wording of the two perseverance expressions: ἐγκακῶμεν as discouragement (“낙심하지 맙시다”) and ἐκλυόμενοι as exhaustion or fainting (“지쳐 쓰러지지 않는다면”). The future harvest and its proper, appointed time remain explicit.'
