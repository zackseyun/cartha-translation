review_pass:
  verdict: revise
  source_fidelity: 핵심 뜻은 대체로 충실합니다. 그러나 ὡς καιρὸν ἔχομεν은 단순히 시간의 지속을 뜻하는 ‘기회가 있는 동안’보다 ‘기회가 있는 대로/기회가 있을 때마다’가 더 직접적입니다. 또한 πρὸς πάντας와 이어지는 πρὸς τοὺς οἰκείους의 대조·강조를 한국어에서도 동일한 동사와 구조로 유지하는 편이 좋습니다.
  naturalness: ‘믿음의 한 식구’는 자연스럽지만, ‘모든 사람에게 선을 행합시다’ 뒤에 ‘그렇게 합시다’를 반복하면 원문의 간결한 병렬 구조가 다소 흐려집니다. ‘모든 사람에게 선을 행하되, 특히 믿음의 식구들에게 그렇게 합시다’가 현대 표준어 합쇼체로 자연스럽고 강조 관계를 분명히 합니다.
  terminology: ‘선을 행하다’는 τὸ ἀγαθὸν ἐργάζεσθαι에 알맞고, ‘믿음의 식구들’은 οἰκείους τῆς πίστεως의 가정/공동체 비유를 보존합니다. ‘한 식구’는 단수 집합 표현이어서 복수 대격 τοὺς οἰκείους를 충분히 드러내지 못하므로 ‘식구들’로 고칩니다.
  issues:
  - severity: medium
    issue: ‘기회가 있는 동안’의 시간적 뉘앙스
    rationale: καιρός는 일반적 시간의 기간보다 알맞은 때·기회를 가리킵니다. ‘기회가 있을 때마다’는 기회가 주어지는 경우마다 선을 행하라는 권면을 더 잘 반영합니다.
  - severity: low
    issue: 특별 우선순위의 병렬 구조가 약화됨
    rationale: ‘특히 …에게 그렇게 합시다’도 의미상 가능하지만, 원문의 πρὸς πάντας ... μάλιστα δὲ πρὸς ... 구조를 ‘모든 사람에게 … 하되, 특히 …에게’로 재현하면 보편적 대상과 특별한 우선순위가 더 명료합니다.
  - severity: low
    issue: ‘한 식구’의 수와 지시 대상
    rationale: οἰκείους는 ‘집안에 속한 사람들’을 가리키는 복수형입니다. ‘믿음의 식구들’이 은유와 복수 대상을 더 분명히 전달합니다.
  revised_text: 그러므로 기회가 있을 때마다 모든 사람에게 선을 행하되, 특히 믿음의 식구들에게 그렇게 합시다.[a]
  revised_footnotes:
  - marker: a
    text: 직역하면 「믿음에 속한 집안 사람들」 또는 「믿음의 가족」. 믿음으로 특징지어지는 공동체에 속한 사람들을 한 가정의 식구로 묘사하는 표현입니다.
    reason: lexical_alternative
  revision_rationale: ὡς καιρὸν ἔχομεν의 기회성, πρὸς πάντας와 μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως의 포괄성과 특별 우선순위, 그리고 οἰκείους의 가정 비유 및 복수 지시를 보존하도록 문장을 고쳤습니다. 본문은 ‘믿음’을 유지하여 τῆς πίστεως를 불필요하게 교리적·제도적으로 한정하지 않았습니다.
