review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the inferential force, the universal scope of doing good, and the special priority given to fellow believers. However, "기회가 있는 동안" can foreground the duration of time, whereas καιρός here more specifically denotes a fitting occasion or opportunity. "기회가 있는 대로" better represents the Greek while remaining natural Korean.
  naturalness: '"믿음의 한 식구에게" is understandable, but the singular collective expression is less natural here for the plural τοὺς οἰκείους. "믿음의 식구들에게" naturally expresses the people belonging to the believing community. Repeating "선을 행합시다" also makes the emphasized second clause complete and clear in formal-polite Korean.'
  terminology: '"선을 행하다" is an appropriate established rendering of ἐργάζεσθαι τὸ ἀγαθόν. "믿음의 식구들" retains the household metaphor without imposing a narrower institutional or doctrinal interpretation of τῆς πίστεως.'
  issues:
  - severity: medium
    issue: '"기회가 있는 동안" may be heard primarily as temporal duration.'
    rationale: ὡς καιρὸν ἔχομεν concerns having an opportunity or fitting occasion. "기회가 있는 대로" more directly conveys this nuance.
  - severity: low
    issue: '"믿음의 한 식구에게" is singular and less idiomatic for the plural referent.'
    rationale: τοὺς οἰκείους denotes persons belonging to the household. The plural "믿음의 식구들에게" is both natural and closer to the source.
  revised_text: 그러므로 기회가 있는 대로 모든 사람에게 선을 행합시다. 특히 믿음의 식구들에게 선을 행합시다.
  revised_footnotes:
  - marker: a
    text: 직역하면 「믿음의 집안 사람들」. 믿는 이들의 공동체를 한 가정에 비유하여 표현한 말입니다.
    reason: lexical_alternative
  revision_rationale: The revision more accurately reflects καιρός as opportunity, renders the plural household members naturally, and retains the Greek contrast between beneficence toward all and special concern for fellow believers. The footnote preserves the household imagery underlying οἰκείους τῆς πίστεως.
