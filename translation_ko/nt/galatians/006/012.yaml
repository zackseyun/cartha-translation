  naturalness: 「육체 안에서 좋은 모양을 내고자 하는 자들은」은 현대 표준어 문장으로 어색합니다. 「육체 안에서 잘 보이려는 사람들」은 바울의 ‘육체’ 표현을 유지하면서도 자연스럽습니다. 목적을 별도 문장으로 처리하여 μόνον ἵνα의 배타적 동기를 명료하게 했습니다.
  terminology: σάρξ는 본문에서 ‘육체’로 유지하고, 외적 인상·외적 영역이라는 문맥적 뜻은 각주로 밝혔습니다. Χριστός는 제공된 영어 POB의 용례 및 번역 방침을 따라 「메시아」로 옮겼습니다. περιτέμνεσθαι의 수동 의미는 「할례를 받도록」으로 보존했습니다.
  issues:
