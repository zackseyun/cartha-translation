  - severity: medium
    issue: μόνον ἵνα의 유일한 목적이 약화됨
    rationale: ‘다만’이 문장 중간에 놓이면 수식 범위가 불분명합니다. ‘오직 ... 않으려는 것뿐입니다’로 박해 회피만이 동기라는 원문의 한정을 분명히 해야 합니다.
