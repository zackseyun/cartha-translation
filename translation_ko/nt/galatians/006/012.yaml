  source_fidelity: 개정이 필요합니다. 초안은 ὅσοι와 θέλουσιν, ἀναγκάζουσιν, ὑμᾶς περιτέμνεσθαι, 그리고 박해 회피의 목적을 대체로 전달하지만, 강조형 지시사 οὗτοι와 μόνον의 ‘오직 이 목적 때문에’라는 한정이 충분히 드러나지 않습니다. 또한 ‘육체 안에서 좋은 모양을 내다’는 εὐπροσωπῆσαι의 ‘좋게 보이다/좋은 인상을 주다’라는 뜻을 부자연스럽게 옮깁니다.
  naturalness: ‘육체 안에서 좋은 모양을 내고자’는 현대 표준 한국어에서 어색하며, ‘좋게 보이기를 원하는’이 더 자연스럽습니다. ‘바로 그들이’는 원문의 οὗτοι가 주는 강조를 합쇼체 문맥에서 자연스럽게 보존합니다.
  terminology: σάρξ는 바울의 용어를 보존하여 ‘육체’로 유지하되, 외적·겉모양의 의미는 각주로 밝혔습니다. Χριστός는 이 문맥에서 칭호적 용법이므로 ‘메시아’가 적절하며, 전통적 ‘그리스도’는 각주로 제시했습니다. ‘할례를 받도록’은 수동 부정사 περιτέμνεσθαι를 자연스럽게 반영합니다.
  issues:
