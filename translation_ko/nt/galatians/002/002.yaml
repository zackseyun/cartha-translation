translation:
  language: ko
  text: 그러나 나는 계시를 따라 올라갔습니다[a]. 그리고 내가 이방인들 가운데 전하는 복음을 그들에게 제시했습니다. 그러나 인정받는 이들에게는 따로 제시했습니다[b]. 혹시라도 내가 헛되이 달리고 있거나 이미 달려온 것은 아닐까 해서였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「계시 때문에」, 「계시에 따라」.
    reason: lexical_alternative
  - marker: b
    text: 또는 「유력해 보이는 이들」, 「지도자로 여겨지는 이들」. 헬라어 τοῖς δοκοῦσιν은 사람들이 중요하거나 영향력 있다고 여기는 이들을 가리킬 수 있습니다.
    reason: lexical_alternative
