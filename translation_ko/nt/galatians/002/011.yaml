  source_fidelity: 초안의 ‘면전에서 책망했습니다’는 κατὰ πρόσωπον의 직접성을 살리지만, ἀντέστην은 ‘책망하다’보다 ‘맞서다/반대하다’에 가깝습니다. 또한 κατεγνωσμένος ἦν은 수동의 상태를 나타내는데, ‘명백히 잘못했습니다’는 능동적이고 ‘명백히’라는 해석을 더합니다.
  naturalness: ‘그에게 면전에서 맞섰습니다’와 ‘비난받을 만했기 때문입니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 직접적 대립과 이유절을 무리 없이 전달합니다.
  terminology: Κηφᾶς는 음역하여 ‘게바’로 유지했습니다. 독자의 식별을 위해 베드로와의 동일 인물을 알리는 각주를 추가합니다. ‘비난받을 만하다’는 정죄의 주체를 특정하거나 교리적으로 과도한 의미를 부여하지 않으면서 κατεγνωσμένος의 수동적 평가를 반영합니다.
