  text: 그리고 나에게 주어진 은혜를 알고, 기둥으로 여겨지는 야고보와 게바와 요한은 나와 바나바에게 교제의 오른손을 내밀었습니다. 이는 우리가 이방 사람들에게로 가고, 그들은 할례 받은 사람들에게로 가기로 한 것입니다.
