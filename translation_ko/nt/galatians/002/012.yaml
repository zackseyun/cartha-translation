review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘먹곤 했습니다’는 συνήσθιεν의 습관적 미완료를 잘 반영합니다. 그러나 ὑπέστελλεν과 ἀφώριζεν ἑαυτόν도 미완료이며, 초안의 ‘떼어 놓았습니다’는 완료된 단회 행위처럼 들려 이 지속적·점진적 후퇴를 충분히 드러내지 못합니다. ‘야고보에게서’는 ἀπὸ Ἰακώβου의 연관·출처를 옮기며 야고보의 공식 파송을 단정하지 않습니다.
  naturalness: ‘자기를 따로 떼어 놓았습니다’는 뜻은 통하지만, 이 문맥에서는 ‘자신을 따로 떼어 놓기 시작하였습니다’가 사회적 분리와 점진적 행위를 더 자연스럽게 전달합니다. 합쇼체도 일관되게 유지됩니다.
  terminology: ‘이방인들’은 τῶν ἐθνῶν에 적절하며, ‘할례자들’은 τοὺς ἐκ περιτομῆς를 간결하게 보존합니다. 어느 표현도 특정 집단 명칭이나 야고보의 승인 여부를 본문 이상으로 해석하지 않습니다.
  issues:
  - severity: medium
    issue: 후반부 두 미완료 동사의 상이 충분히 반영되지 않음
    rationale: ὑπέστελλεν과 ἀφώριζεν은 그들이 온 뒤 베드로가 물러나며 자신을 분리해 가는 행위를 나타냅니다. ‘떼어 놓았습니다’는 단회적 완료로 들릴 수 있으므로, ‘시작하였습니다’를 사용해 문맥상 점진적 후퇴를 드러내는 것이 안전합니다.
