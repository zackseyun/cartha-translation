base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
  footnotes:
  - marker: a
    text: Or 'some men' instead of 'certain men.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the company of James'; the Greek does not by itself specify whether James formally sent them.
    reason: alternative_reading
  - marker: c
    text: Or 'those of the circumcision party.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야고보에게서 어떤 이들이 오기 전에는 그가 이방인들과 함께 음식을 먹곤 하였습니다. 그러나 그들이 왔을 때에는, 그는 할례자들을 두려워하여 물러서고 자신을 따로 떼어 놓기 시작하였습니다.
  philosophy: optimal-equivalence
