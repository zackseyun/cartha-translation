translation:
  language: ko
  text: 나는 더 이상 내가 사는 것이 아니라, 메시아께서 내 안에 사십니다. 내가 지금 육체 안에서 사는 삶은 나를 사랑하시고 나를 위하여 자신을 내어 주신 하나님의 아들의 믿음[a]으로 사는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
