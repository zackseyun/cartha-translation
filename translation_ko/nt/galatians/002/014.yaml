    text: Or, more literally, 'were not walking straight' with the truth of the gospel.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''How can you compel the Gentiles to Judaize?'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 그들이 복음의 진리에 맞게 바르게 행하지 않는[a] 것을 보았을 때, 모든 사람 앞에서 게바에게 말했습니다. “당신은 유대인이면서도 이방인처럼 살고 유대인처럼 살지 않는데, 어떻게 이방인들에게 유대인처럼 살도록[b] 강요합니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하면, ‘복음의 진리에 맞게 곧게 걷지 않는’.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로, ‘유대화하도록’.
    reason: lexical_alternative
