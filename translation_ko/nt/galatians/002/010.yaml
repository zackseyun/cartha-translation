  verdict: revise
  source_fidelity: The draft correctly renders τῶν πτωχῶν as “가난한 이들” and retains the emphatic connection to “바로 그 일.” However, “힘써 행하고자 한” weakens ἐσπούδασα, which denotes earnest effort rather than merely intending to act. The initial phrasing also introduces an awkward explanatory construction (“…것뿐이었는데”) not required by μόνον.
  naturalness: The sentence is grammatically understandable but unnecessarily heavy and less idiomatic in modern formal Korean. Two concise sentences express the Greek progression naturally.
  terminology: “가난한 이들” is appropriate, respectful modern Korean for “the poor.” “기억하다” appropriately preserves the source wording without imposing an expanded interpretation of material support.
  issues:
  - severity: medium
    issue: “힘써 행하고자 한” renders earnest effort as intention.
    rationale: ἐσπούδασα indicates that Paul made earnest effort / was diligent to do this, not simply that he wanted or intended to do it.
  - severity: low
    issue: “다만 우리는 … 한다는 것뿐이었는데” is syntactically cumbersome.
    rationale: μόνον introduces the sole stipulation. Korean is clearer as “다만 … 하라는 것뿐이었습니다,” without the contrastive “-는데.”}],
  revised_text: 다만 가난한 이들을 기억하라는 것뿐이었습니다. 나도 바로 이 일을 하려고 힘썼습니다.
