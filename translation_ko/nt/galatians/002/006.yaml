  naturalness: 합쇼체는 일관되지만, ‘무엇인가 인정받는 이들’은 한국어에서 다소 불분명합니다. ‘중요한 사람으로 여겨지는 이들’이 해당 인물들의 사회적 평판을 자연스럽고 절제되게 나타냅니다. ‘사람의 얼굴을 보지 않으십니다’는 한국어 성경 문체에서 통용되나, 각주에서 관용적 의미를 ‘차별하지 않음’으로 명확히 해야 합니다.
  terminology: δοκοῦντες는 ‘중요한 사람으로 여겨지는 이들’로 옮겨 명성·평판을 뜻하는 용례와 바울의 유보적 뉘앙스를 함께 보존했습니다. πρόσωπον ... λαμβάνει는 본문에서 전통적 관용구를 유지하고, 각주에서 편파성/차별의 뜻을 밝혔습니다. προσανέθεντο는 ‘덧붙이지 않았다’로 수정했습니다.
