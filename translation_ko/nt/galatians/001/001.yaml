  terminology: 사도 is the appropriate established rendering of ἀπόστολος. 예수 메시아 preserves the titular sense of Χριστός in accordance with the supplied project decision; the alternative 예수 그리스도 is suitably supplied in the anchored note. 아버지 하나님 is natural formal Korean for θεοῦ πατρός.
  issues:
