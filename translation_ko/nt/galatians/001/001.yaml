    issue: The adversative ἀλλά is not explicitly represented.
    rationale: 'The draft moves from the two negative human clauses directly to the positive divine clause with ''아니며,'' but the Greek marks a strong contrast: ''but through Jesus Messiah and God the Father.'' Adding ''오직'' faithfully represents this contrast without introducing interpretation.'
