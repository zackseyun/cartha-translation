  source_fidelity: The draft correctly preserves the plural/singular contrast in 사람들에게서 / 사람 and the distinction between source (ἀπό) and agency (διά). However, it does not explicitly render the adversative ἀλλά ('but'); adding 오직 makes the contrast and exclusive positive ground of Paul's apostleship clear. The final relative construction appropriately reflects the verse's syntactically incomplete salutation opening.
