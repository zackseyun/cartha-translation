  source_fidelity: 초안은 ἀναστροφή를 ‘어떻게 살았는지’로 적절히 포괄하고, Ἰουδαϊσμός을 ‘유대교’로 옮겼습니다. 그러나 ἐκκλησίαν τοῦ θεοῦ는 여기서 그리스도인 공동체를 가리키므로 통상적이고 원문에 가까운 ‘하나님의 교회’가 ‘하나님의 회중’보다 적절합니다. ἐπόρθουν의 강한 계속적 파괴 의미도 ‘무너뜨리려 했다’보다 ‘유린하고 있었다’가 더 잘 드러냅니다.
  naturalness: ‘곧 …라는 것입니다’는 앞 문장과의 연결이 다소 부자연스럽고 설명문처럼 들립니다. 두 절을 쉼표로 이어 ‘…들으셨습니다. 즉’의 어색함을 피하고, 두 미완료 동사를 ‘박해하고 유린하고 있었습니다’로 병렬하면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘유대교’와 ‘하나님의 교회’는 확립된 한국어 성서 용어이며, 특정 교파적 해석을 더하지 않습니다. ‘극도로’는 καθ’ ὑπερβολήν의 강한 정도를 자연스럽게 반영합니다.
