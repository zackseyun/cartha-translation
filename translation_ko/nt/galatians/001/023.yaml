  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ἀκούοντες ἦσαν의 주변적 미완료 과거는 단순 과거 「들었습니다」보다 지속적·반복적 보고 수용을 나타내는 표현으로 옮기는 편이 적절합니다. 또한 ἐπόρθει는 과거의 계속된 파괴 행위를 가리키므로 「멸하려던」보다 「파괴하던」이 원문의 상에 더 가깝습니다.
