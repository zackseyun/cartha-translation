    reason: lexical_alternative
  - marker: b
    text: 직역하면 “사람을 따라.” 문맥상 “사람에게서 비롯된”이라는 뜻이 가장 자연스럽습니다. “인간의 기준에 따른”이라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
