  source_fidelity: 초안의 「내가 여러분에게 쓰는 것에 대해」는 γράφω의 목적어인 관계절 ἃ를 자연스럽게 처리하지 못하며, 「거짓말이 아닙니다」는 화자 주어와 ψεύδομαι(‘내가 거짓말하다’)의 동사적 의미를 약화합니다. 수정문은 γράφω의 현재 진행, ὑμῖν의 수신자, ἰδού의 엄숙한 강조, ἐνώπιον τοῦ θεοῦ의 하나님 앞에서의 진술, 그리고 οὐ ψεύδομαι의 1인칭 부정을 모두 보존합니다.
  naturalness: 「쓰고 있는 것들에 관해서는」은 현대 표준어에서 다소 문어적이지만 본문의 엄숙한 자기변호 문맥에 자연스럽고, 합쇼체 「보십시오」「아닙니다」와 일관됩니다. 「하나님 앞에서 내가 거짓말하는 것이 아닙니다」는 원문의 강조적 진술을 무리하게 정식 맹세로 확대하지 않습니다.
  terminology: 「하나님」과 「하나님 앞에서」는 한국어 성경 문체 및 ἐνώπιον τοῦ θεοῦ의 엄숙한 호소에 적절합니다. ἰδού는 「보십시오」로 명시적으로 옮깁니다.
  issues:
  - severity: high
    issue: 관계절 목적어 및 화자 주어의 의미가 불명확함
