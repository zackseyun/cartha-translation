    rationale: τοῦ θεοῦ καὶ πατρὸς ἡμῶν은 ‘우리의 하나님이시며 아버지이신 분’이라는 한 분을 가리킵니다. 「우리의 하나님 곧 아버지」는 이를 자연스럽고 간결하게 나타냅니다.
  - severity: low
    issue: 각주가 αἰών의 의미를 시간적·공간적으로 함께 지닌다고 단정함
    rationale: 어휘 자체에 폭넓은 용례는 있으나, 이 문맥에서는 ‘시대’가 주된 뜻입니다. 대안 번역 「세상」은 제시할 수 있지만, 두 의미가 이 구절에서 동등하게 작동한다고 표현할 필요는 없습니다.
