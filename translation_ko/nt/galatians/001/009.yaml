id: GAL.1.9
reference: Galatians 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
  footnotes:
  - marker: a
    text: Or "beyond what you received"; the phrase can denote deviation from the received message.
    reason: lexical_alternative
  - marker: b
    text: 'Or "let him be under a curse"; Greek: anathema estō.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 전에 말한 것처럼, 지금 다시 말합니다. 누구든지 여러분이 받은 복음과 다른 복음을 여러분에게 전한다면, 그는 저주받을지어다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρ’ ὃ παρελάβετε
  english_pob_choice: contrary to what you received
  chosen_korean: 여러분이 받은 복음과 다른 것
  alternatives_korean:
  - 여러분이 받은 것을 넘어서는 것
  lexicon: BDAG
  rationale: παρά + 대격은 「대조·이탈」의 뜻으로, 받은 메시지에서 빗나가는 가르침을 가리킨다.
