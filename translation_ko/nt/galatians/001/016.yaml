translation:
  language: ko
  text: 자기 아들을 내 안에[a] 계시하시어 내가 그분을 이방인들 가운데 전하도록 하시기를 기뻐하셨을 때에, 나는 곧바로 사람들과[b] 의논하지 않았고,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「나에게」, 「나를 통해」.
    reason: alternative_reading
  - marker: b
    text: 직역하면 「살과 피」. 사람 또는 사람들을 가리키는 관용 표현이다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοί
  english_pob_choice: to reveal his Son in me
  chosen_korean: 자기 아들을 내 안에 계시하시다
  alternatives_korean:
  - 자기 아들을 나에게 계시하시다
  - 그의 아들을 나를 통해 계시하시다
  lexicon: BDAG
  rationale: ἐν ἐμοί는 직역 「내 안에」가 가장 자연스럽고 다의성을 보존한다.
- source_word: σαρκὶ καὶ αἵματι
  english_pob_choice: flesh and blood
  chosen_korean: 혈육
  alternatives_korean:
  - 살과 피
  - 사람
  lexicon: BDAG
  rationale: 한국어에서 「혈육」이 정확히 같은 관용을 옮긴다.
- source_word: ἔθνεσιν
  english_pob_choice: Gentiles
  chosen_korean: 이방인
  alternatives_korean:
  - 민족들
  - 열방
  lexicon: BDAG
  rationale: 본문 맥락은 비유대인을 가리키며 한국어 「이방인」이 표준이다.
