  source_fidelity: 현 초안은 ἐν ἐμοί의 모호성을 본문과 각주에서 대체로 잘 보존하고, ἔθνη를 「이방인들」로 옮긴 것도 문맥에 맞습니다. 그러나 「혈육」은 현대 한국어에서 주로 친족을 뜻하므로, 모든 인간을 가리키는 σαρκὶ καὶ αἵματι의 관용적 의미를 충분히 전달하지 못합니다. 또한 「…전하게 하셨을 때」는 헬라어의 목적절을 시간절처럼 처리하고, 직전 절에서 이어지는 ‘기뻐하셨을 때’의 구조를 불분명하게 만듭니다.
