  to: 그러나 우리나 하늘에서 온 천사라도, 우리가 여러분에게 전한 것과 다른 복음을 여러분에게 전한다면, 그는 저주를 받을지어다[a].
  rationale: 조건절의 강조(ἀλλὰ καὶ ἐὰν)를 ‘그러나 …라도’로, 두 εὐαγγελίζομαι 동사의 관련성을 ‘전한 것과 다른 복음을 … 전한다’로 반영했습니다. 결말은 원문의 3인칭 명령·저주 공식의 힘을 보존하도록 ‘저주를 받을지어다’로 고쳤습니다. 이는 특정 교파의 후대 기술 용어를 본문에 도입하지 않습니다.
