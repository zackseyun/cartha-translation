  source_fidelity: 초안은 주된 의미를 대체로 전달하지만, εὐαγγελίζηται와 εὐηγγελισάμεθα의 연결을 더 분명히 하고, ἀνάθεμα ἔστω의 명령·선고 형식을 미래 서술문으로 바꾸지 않는 편이 원문에 더 충실합니다.
  naturalness: ‘우리든지’도 가능하나, 조건절에서는 ‘우리나 하늘에서 온 천사라도’가 더 자연스럽습니다. ‘저주를 받을지어다’는 일상 화법은 아니지만, 원문의 엄중한 저주 선고를 보존하는 한국어 성경 문체로 적절합니다.
  terminology: ‘복음’과 ‘전하다’는 현대 표준 한국어 성경 용례에 맞습니다. ‘아나테마’는 음역만으로는 뜻이 불분명하므로 각주에서 대안으로만 제시합니다.
  issues:
  - severity: medium
    issue: ‘저주받을 것입니다’가 ἀνάθεμα ἔστω의 선고적 명령법을 미래 진술로 바꿉니다.
    rationale: ἔστω는 ‘그가 …이 되게 하라/…일지어다’라는 엄중한 저주 공식입니다. 단순한 미래 예측인 ‘것입니다’보다 ‘저주를 받을지어다’가 문법적 힘과 수사적 강도를 더 잘 보존합니다.
  - severity: low
    issue: ‘복음과 다른 것을 전한다면’은 원문의 두 복음 선포 동사의 어휘적 연결을 다소 흐립니다.
    rationale: ‘우리가 여러분에게 전한 것과 다른 복음을 여러분에게 전한다면’은 원문에 명시되지 않은 내용을 최소한으로 보충하면서, 무엇이 ‘다른 것’인지와 수신자를 분명히 합니다.
