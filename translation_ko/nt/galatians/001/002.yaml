  source_fidelity: 원문의 καὶ는 앞 절의 바울과 ‘나와 함께 있는 모든 형제들’을 공동 발신자로 연결합니다. 초안의 ‘모든 형제가 … 편지합니다’는 형제들만이 발신 주체인 듯 읽힐 수 있으므로, 앞 절에서 암시된 바울의 발신 주체에 동반구로 연결하는 편이 더 정확합니다. 복수형 ἐκκλησίαις는 ‘여러 교회’로 드러내야 합니다.
  naturalness: ‘나와 함께 있는 모든 형제와 더불어 … 편지합니다’는 앞 절과 이어 읽히는 서신 머리말로 자연스럽고 현대 한국어 문어체에 맞습니다.
  terminology: ἀδελφοί는 본문에서 ‘형제’로 옮기고 포괄적 용례 가능성은 각주에 보존할 수 있습니다. ἐκκλησίαις는 바울 서신의 수신 공동체를 가리키는 통상적이고 자연스러운 용어인 ‘교회’가 적절합니다. ‘회중’을 택할 근거로 후대 제도성을 배제하는 것은 원문이 요구하지 않는 해석적 제한입니다.
  issues:
  - severity: medium
    issue: 발신 주체가 ‘모든 형제’만인 것처럼 보임
    rationale: 그리스어는 앞 절의 Παῦλος와 καὶ로 결합된 공동 발신자 구성이므로, ‘형제가 … 편지합니다’라는 단독 주어 구조는 연결 관계를 약화시킵니다.
  - severity: medium
    issue: ἐκκλησίαις의 복수성이 ‘회중들에게’에는 드러나지만 표준 교회 용어와 영어 감사 기록의 ‘churches’에서 벗어남
    rationale: ‘갈라디아의 여러 교회’는 복수성과 수신처를 명료하게 나타내며 한국어 성서 문체에서도 자연스럽습니다.
  - severity: low
    issue: ‘회중’ 선택의 각주 설명이 번역어 대안 설명을 넘어 해석적 번역 정책을 주장함
    rationale: ‘후대의 제도적 함의를 피해’라는 설명은 본문 어휘가 요구하는 주석이 아니며, 중립적인 대안 각주로 유지하기 어렵습니다.
  revised_text: 나와 함께 있는 모든 형제와 더불어 갈라디아의 여러 교회에 편지합니다.
  revised_footnotes:
  - marker: a
    text: 또는 「형제자매」. 헬라어는 「형제들」(ἀδελφοί)이며, 남녀 신자를 함께 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 앞 절과 연결되는 공동 발신자 구조를 한국어에서 ‘…와 더불어’로 자연스럽게 나타냈습니다. ἐκκλησίαις의 복수형은 ‘여러 교회’로 옮겼고, 불필요하게 해석적인 ‘회중’ 관련 각주는 삭제했습니다. 형제의 포괄적 지시 가능성은 원문의 문법적 형태를 본문에서 보존하면서 각주로 제시했습니다.
