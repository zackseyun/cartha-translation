  source_fidelity: 현 초안은 ἀδελφοί의 복수 주어를 한국어 단수처럼 보이게 하는 「모든 형제」로 처리하고, 「편지합니다」의 주체도 바울과 동료들 전체가 아니라 형제들만인 듯 읽히게 합니다. 또한 ἐκκλησίαις는 바울 서신의 수신 공동체를 가리키므로 「교회들」이 직접적이고 관습적인 대응어입니다.
  naturalness: 「나와 함께 있는 모든 형제들과 함께」는 바울과 그 동료들이 공동으로 보내는 서신이라는, 앞 절에서 이어지는 문맥을 자연스럽게 드러냅니다. 「갈라디아의 교회들에게 편지합니다」도 현대 표준 한국어 합쇼체 문장으로 자연스럽습니다.
  terminology: ἀδελφοί는 본문에서 「형제들」로 옮기고, 남녀 신자 전체를 포함할 가능성은 각주로 보존합니다. ἐκκλησίαις는 신학적·제도적 함의를 임의로 배제하지 않고 「교회들」로 옮깁니다.
  issues:
  - severity: medium
    issue: 공동 발신 주체의 불명확성
    rationale: 「나와 함께 있는 모든 형제가 ... 편지합니다」는 문법상 형제들만 편지하는 것으로 읽힐 수 있습니다. 그리스어의 καὶ와 앞 절의 바울 발신자 표지는 바울과 함께 있는 모든 형제들이 공동 발신자임을 나타냅니다.
  - severity: medium
    issue: ἀδελφοί의 복수 표지 누락
    rationale: 「모든 형제」보다 「모든 형제들」이 복수형 ἀδελφοί를 더 분명하게 반영하며 한국어에서도 자연스럽습니다.
  - severity: medium
    issue: ἐκκλησίαις를 「회중」으로 옮기고 각주에서 「교회」를 회피함
    rationale: 바울 서신의 주소 표현에서 ἐκκλησίαι는 「교회들」이 가장 직접적이고 자연스러운 대응어입니다. 「후대의 제도적 함의」를 피한다는 각주 설명은 본문 어휘가 지닌 역사적 사용 범위를 불필요하게 제한합니다.
  revised_text: 나와 함께 있는 모든 형제들과 함께 갈라디아의 교회들에게 편지합니다.
  revised_footnotes:
  - marker: a
    text: 또는 「형제자매들」. 헬라어는 「형제들」(ἀδελφοί)이라고 하지만, 남녀 신자를 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 앞 절의 바울 발신 표지에 이어지는 접속사와 공동 발신자 구문을 한국어에서 명확히 하기 위해 「모든 형제들과 함께」로 옮겼습니다. ἀδελφοί의 복수형을 살리고, 포괄적 지시 가능성은 각주로 유지했습니다. ἐκκλησίαις는 본문의 역사적·서신적 용법에 맞춰 「교회들에게」로 옮겼으며, 의미를 추가하는 회중 관련 각주는 삭제했습니다.
