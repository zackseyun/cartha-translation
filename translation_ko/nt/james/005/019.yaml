review_pass:
  verdict: revise
  source_fidelity: 원문의 πλανηθῇ는 수동형으로, 「진리에서 미혹되고」는 ‘진리에서 벗어나도록 미혹되다/길을 잃다’라는 뜻을 자연스럽게 보존합니다. ἐπιστρέψῃ τις αὐτόν은 어떤 사람이 그를 다시 돌아오게 하는 행위를 가리키므로 「그를 돌아오게 한다면」이 적절합니다. 조건문의 미완결 문장 구조와 끝의 쉼표도 다음 절(5:20)로 이어지는 원문 구조를 반영합니다.
  naturalness: 초안의 「그를 돌이키게 한다면」은 ‘누군가가 그를 돌이키게 한다’라는 사역 표현이 겹쳐 문법적으로 부자연스럽고 의미도 불명확합니다. 「그를 돌아오게 한다면」은 현대 표준 한국어의 합쇼체 성경 문체에서 자연스럽습니다.
  terminology: 「나의 형제 여러분」은 Ἀδελφοί μου의 직접 호칭을 보존하며, 「진리」도 τῆς ἀληθείας를 과도하게 해석하지 않습니다. 「미혹되다」는 야고보서 1:16의 어휘적 연관성을 유지할 수 있으나, 수동 의미가 문맥상 분명하도록 접속형으로 조정했습니다.
  issues:
  - severity: medium
    issue: 「어떤 사람이 그를 돌이키게 한다면」의 사역 표현
    rationale: ἐπιστρέψῃ τις αὐτόν은 ‘누군가가 그를 돌이키다/돌아오게 하다’라는 타동 행위입니다. 초안의 「돌이키게 한다」는 다시 사역화하여 의미 관계가 어색해집니다.
  - severity: low
    issue: 「미혹되었다가」의 시간적 뉘앙스
    rationale: -었다가는 미혹이 먼저 완료된 뒤 후속 행동이 일어나는 시간적 순서를 다소 강하게 암시합니다. 원문의 두 접속법 동사는 조건 안에서 단순히 결합되어 있으므로 「미혹되고」가 더 중립적입니다.
  revised_text: 나의 형제 여러분, 여러분 가운데 누가 진리에서 미혹되고 어떤 사람이 그를 돌아오게 한다면,
