  source_fidelity: ‘들어 알고 있고’는 ἠκούσατε(‘들었습니다’)에 ‘알고 있다’라는 추가 의미와 현재적 상태를 더합니다. 또한 ‘주께서 이루신 결말’은 τὸ τέλος κυρίου의 문맥상 가능한 해석이지만, 주어의 행위를 명시하므로 ‘주님의 결말’보다 다소 해석적입니다. 다만 한국어에서 ‘주님의 결말’은 부자연스럽고, 문맥상 주께서 가져오신 결말을 가리키므로 자연스럽게 유지할 수 있습니다.
