revisions:
- from: 보십시오. 여러분의 밭을 거둔 일꾼들의 품삯, 곧 여러분이 떼어먹은 그 품삯이 부르짖고 있으며, 추수한 자들의 외침이 만군의 야훼[a]의 귀에 들어갔습니다.
  to: 보십시오. 여러분의 밭에서 추수한 일꾼들의 품삯, 곧 여러분이 지급하지 않은 그 품삯이 부르짖고 있고, 추수한 사람들의 외침이 만군의 주[a]의 귀에 들어갔습니다.
  rationale: 억류된 임금이라는 법적·윤리적 고발을 ‘지급하지 않은’으로 정확하고 격식 있게 표현했습니다. 농경 표현을 자연스러운 한국어로 다듬었고, 신적 칭호는 그리스어 본문과 영어 POB의 번역 원칙을 따라 ‘만군의 주’로 옮기되 음역 대안을 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:00Z'
review_pass:
  verdict: revise
  source_fidelity: ‘떼어먹은’은 ἀφυστερημένος(억류된, 지급되지 않은)보다 구어적이고 부당 취득의 뉘앙스를 강하게 더합니다. 또한 κύριος Σαβαώθ를 ‘만군의 야훼’로 확정하는 것은 히브리어 배경은 반영하지만, 그리스어 본문의 칭호를 넘어선 해석입니다. 본문에서는 ‘만군의 주’가 직역적이며, ‘사바옷’은 각주로 보존하는 편이 적절합니다.
  naturalness: ‘밭을 거둔’은 한국어에서 다소 어색하고, ‘떼어먹은’은 현대 표준어 합쇼체의 공적·성경 번역 문체에 맞지 않습니다. ‘밭에서 추수한’, ‘지급하지 않은’, ‘부르짖고 있습니다’가 더 자연스럽고 격식에 맞습니다.
  terminology: ‘만군의 주’는 Κυρίου Σαβαώθ의 칭호를 한국어로 충실히 옮기며 영어 POB의 ‘Lord of Hosts’와도 일치합니다. ‘사바옷’은 음역 대안으로 각주에 제시합니다. ‘품삯’, ‘일꾼’, ‘추수’는 적절합니다.
  issues:
  - severity: medium
    issue: ‘여러분이 떼어먹은’
    rationale: ἀφυστερέω는 임금을 부당하게 억류하거나 지급하지 않는다는 뜻입니다. ‘떼어먹다’는 구어적이고 횡령·착복을 더 강하게 암시하므로 ‘지급하지 않은’으로 완화 없이 정확하게 옮기는 것이 좋습니다.
  - severity: medium
    issue: ‘만군의 야훼’ 및 각주의 단정적 설명
    rationale: κύριος Σαβαώθ는 히브리 성경의 신명 배경을 지닌 칭호이나, 현 그리스어 본문은 κύριος로 되어 있습니다. 본문은 ‘만군의 주’로 번역하고 ‘주 사바옷’을 각주 대안으로 제시하여 원문의 형태와 배경을 함께 보존해야 합니다.
  - severity: low
    issue: ‘여러분의 밭을 거둔’
    rationale: 한국어에서는 밭 자체를 ‘거두다’라고 하기보다 밭에서 곡식 등을 ‘추수하다’라고 하는 것이 자연스럽습니다.
