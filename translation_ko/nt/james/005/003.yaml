  source_fidelity: 초안은 문장의 핵심 의미와 심판의 비유를 대체로 충실히 옮깁니다. 그러나 καί를 인과적으로 보이게 하는 ‘녹슬었으니’는 병렬 연결로 고치고, 금과 은에 적용된 ἰός는 ‘녹’보다 포괄적인 ‘부식’으로 옮기는 것이 원문의 표현과 현대 한국어 모두에 더 적절합니다. 또한 ἐν ἐσχάταις ἡμέραις는 복수인 ‘마지막 날들에’로 반영했습니다.
  naturalness: ‘부식되었고’, ‘여러분에게 불리한 증거’, ‘살을 먹을 것입니다’는 현대 표준 한국어의 합쇼체 문체로 자연스럽고, 원문의 강렬한 이미지를 유지합니다. ‘마지막 날들’은 다소 문어적이지만 성경적 종말론 관용구로 자연스럽습니다.
  terminology: ἰός는 금속 문맥에서 ‘부식’으로, μαρτύριον은 법정적 뉘앙스를 살려 ‘불리한 증거’로 옮겼습니다. σάρκας는 ‘살’로 유지했으며, ἐθησαυρίσατε는 목적어적 의미를 드러내어 ‘보화를 쌓아 두었습니다’로 옮겼습니다.
