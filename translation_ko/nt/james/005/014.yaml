review_pass:
  verdict: revise
  source_fidelity: 초안은 ἀσθενεῖ를 ‘병든’으로, πρεσβυτέρους를 ‘장로들’로, ἀλείψαντες를 ‘기름을 바르다’로 옮겨 핵심 의미를 대체로 잘 반영합니다. 그러나 ‘그를 위해 기도하되’는 ἐπ’ αὐτόν(그 사람 위에/그를 두고)의 공간적·상황적 뉘앙스를 일반적인 ‘위하여’로 바꾸며, ‘...해야 합니다’는 두 명령문의 요청·지시 구조를 평서적 의무 표현으로 다소 약화합니다.
  naturalness: ‘그는 회중의 장로들을 부르십시오’는 3인칭 주어와 청자 존대 명령형의 결합이 현대 표준 한국어에서 부자연스럽습니다. 질문 뒤에 직접 권면하는 ‘교회의 장로들을 청하십시오’ 및 ‘...기도하게 하십시오’가 합쇼체에서 자연스럽고 원문의 명령 기능도 잘 살립니다.
  terminology: ἐκκλησία는 영어 POB의 ‘church’ 및 한국어의 통상적인 성경 용례에 맞추어 ‘교회’로 옮겼습니다. 이는 현대 독자가 ‘회중’을 단순 모임으로 이해할 수 있는 가능성을 줄이면서도 원문의 공동체 의미를 보존합니다. ‘주의 이름으로’와 ‘기름을 바르며’는 중립적으로 유지하여 기름 바름의 의학적·상징적·성례적 기능을 결정하지 않습니다.
  issues:
  - severity: medium
    issue: 3인칭 명령 구조의 부자연스러움
    rationale: ‘그는 ... 부르십시오’는 한국어 합쇼체에서 주어와 명령의 대상이 어긋나 보입니다. 원문의 3인칭 명령은 한국어에서는 청자에게 직접 ‘청하십시오/기도하게 하십시오’라고 권면하는 방식으로 자연스럽게 전달할 수 있습니다.
  - severity: medium
    issue: ἐπ’ αὐτόν의 의미가 ‘그를 위해’로 일반화됨
    rationale: 전치사 ἐπί와 대격은 여기서 기도가 병든 사람 위에 또는 그를 두고 행해짐을 나타냅니다. ‘그를 두고 기도하다’는 한국어에서 자연스러우면서도 ‘위하여’보다 원문의 표현을 더 가깝게 보존합니다.
  - severity: low
    issue: 명령문의 강도가 ‘...해야 합니다’로 완화됨
    rationale: προσκαλεσάσθω와 προσευξάσθωσαν은 명령형입니다. ‘...하게 하십시오’는 원문의 요청·지시 구조를 더 직접적으로 반영합니다.
  - severity: low
    issue: 영어 POB 감사 기록의 어휘·해석상 주석이 한국어 본문에 없음
    rationale: ἀσθενεῖ의 넓은 의미 가능성과 기름 바름의 기능 미규정은 번역 선택의 투명성을 위해 해당 한국어 표현에 연결된 주석으로 제시하는 것이 적절합니다.
