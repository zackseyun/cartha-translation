review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘그는 … 부르십시오’는 3인칭 주어와 청자 높임 명령형이 부자연스럽게 결합되어 있습니다. 또한 헬라어는 장로들이 기도하는 것을 주된 명령으로 하고, 기름을 바르는 행위를 분사로 수반시키므로 이를 한국어 문장 구조에 반영하는 것이 좋습니다.
  naturalness: ‘그런 사람은 … 부르십시오’와 ‘… 기름을 바르면서 그를 위하여 기도하십시오’는 현대 표준어 합쇼체로 자연스럽고, 공동체를 향한 일반적 권면의 문맥도 유지합니다.
  terminology: ‘회중의 장로들’, ‘주의 이름’, ‘기름을 바르다’는 주어진 용어 정책 및 본문의 중립성을 잘 보존합니다. ‘병든 사람’은 ἀσθενεῖ의 이 문맥상 주된 뜻을 자연스럽게 옮기며, 더 넓은 ‘약하다’의 가능성은 각주에서 밝협니다.
  issues:
  - severity: medium
    issue: ‘그는 회중의 장로들을 부르십시오’의 인칭 및 문체 불일치
    rationale: 그리스어의 3인칭 단수 명령은 병든 사람에게 적용되는 일반적 지시입니다. 한국어 합쇼체에서는 ‘그런 사람은 … 부르십시오’가 자연스럽습니다.
  - severity: low
    issue: 기도와 기름 바름의 문장상 위계가 흐려짐
    rationale: προσευξάσθωσαν이 주동사이고 ἀλείψαντες는 수반 행동을 나타내므로, ‘기름을 바르면서 … 기도하십시오’로 표현하여 이 관계를 반영합니다.
  revised_text: 여러분 가운데 병든 사람이 있습니까? 그런 사람은 회중의 장로들을 부르십시오. 장로들은 주의 이름으로 그에게 기름을 바르면서 그를 위하여 기도하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 ‘약한 사람이’. 헬라어 동사는 더 넓게 약함을 뜻할 수도 있지만, 여기서는 기도와 기름 바름, 그리고 다음 절의 치유 문맥으로 볼 때 병을 가리키는 뜻이 가장 자연스럽습니다.
    reason: lexical_alternative
