base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: ko
  text: 여러분 가운데 병든 자가 있습니까? 그는 회중의 장로들을 부르십시오. 장로들은 그를 위해 기도하되, 주의 이름으로 그에게 기름을 발라야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτεροι τῆς ἐκκλησίας
  english_pob_choice: elders of the church
  chosen_korean: 회중의 장로들
  alternatives_korean:
  - 교회의 장로들
  lexicon: BDAG
  rationale: 글로서리 정책에 따라 ἐκκλησία를 초기 공동체 문맥에서 「회중」으로 옮긴다.
theological_decisions:
- issue: 병자를 위한 기름부음과 기도(5:14-16)
  chosen_reading: 주의 이름으로 기름을 바르고 기도하다
  alternative_readings:
  - 상징적 의례로 의역
  rationale: 본문은 회중 안에서 행해지는 구체적 의례를 평이하게 진술한다. 한국어 번역에서도 본문의 평이함과 구체성을 그대로 보존한다. 14절의 ἀλείψαντες(기름을 바르다)와 15절의 σώσει(구원할 것이다)/ἐγερεῖ(일으키실 것이다)의 어휘를 풀어쓰지 않는다.
  doctrine_reference: 'DOCTRINE.md: 본문의 구체성 보존'
