source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ' αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: ko
  text: 여러분 가운데 병든[a] 사람이 있습니까? 교회의 장로들을 청하십시오. 그들이 주의 이름으로 그에게 기름을 바르며 그를 두고 기도하게 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘약한 사람이’. 그리스어 동사는 더 넓게 ‘약하다’를 뜻할 수도 있습니다. 그러나 기도, 기름을 바르는 일, 그리고 다음 절의 치유 문맥상 여기서는 병을 가리키는 뜻이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 기름을 바르는 행위는 의학적 처치, 상징적 행위, 또는 둘 다로 이해될 수 있습니다. 본문 자체는 그 방식이나 기능을 명시하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι τῆς ἐκκλησίας
  english_pob_choice: elders of the church
  chosen_korean: 회중의 장로들
  alternatives_korean:
  - 교회의 장로들
  lexicon: BDAG
  rationale: 글로서리 정책에 따라 ἐκκλησία를 초기 공동체 문맥에서 「회중」으로 옮긴다.
theological_decisions:
- issue: 병자를 위한 기름부음과 기도(5:14-16)
  chosen_reading: 주의 이름으로 기름을 바르고 기도하다
  alternative_readings:
  - 상징적 의례로 의역
  rationale: 본문은 회중 안에서 행해지는 구체적 의례를 평이하게 진술한다. 한국어 번역에서도 본문의 평이함과 구체성을 그대로 보존한다. 14절의 ἀλείψαντες(기름을 바르다)와 15절의 σώσει(구원할 것이다)/ἐγερεῖ(일으키실 것이다)의 어휘를 풀어쓰지 않는다.
  doctrine_reference: 'DOCTRINE.md: 본문의 구체성 보존'
