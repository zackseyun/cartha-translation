  source_fidelity: 「자, 이제」는 Ἄγε νῦν의 강한 환기·소환을, 「부자들이여」는 직접 호격으로 쓰인 οἱ πλούσιοι를 잘 반영합니다. 「통곡하며 우십시오」는 κλαύσατε와 이를 강화하는 ὀλολύζοντες를 자연스럽게 옮겼고, 「여러분에게 닥쳐오는 비참한 일들」도 ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις의 수신자와 임박한 재난을 충실히 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 예언적 경고의 격렬한 어조도 과장하거나 완화하지 않습니다. 「비참한 일들을 두고」는 한국어에서 앞으로 닥칠 재난을 바라보며 애통한다는 뜻으로 무리 없이 이해됩니다.
  terminology: 「부자들」, 「통곡」, 「비참한 일들」은 본문의 사회적·예언적 어조를 적절히 전달합니다. 특정 집단의 신분이나 종교적 지위를 덧붙이지 않아 본문의 해석상 열린 범위를 유지합니다.
