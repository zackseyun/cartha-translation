  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘어떤 다른 맹세로도 하지 마십시오’는 그리스어의 병렬 구조를 한국어에서 다소 부자연스럽게 재현하며, 마지막 문장은 목적절의 권면을 미래 진술처럼 약화합니다. ‘심판 아래에 떨어지다’는 πέσητε와 ὑπὸ κρίσιν을 잘 보존할 수 있습니다.
  naturalness: ‘나의 형제 여러분’은 현대 한국어 교회 문체에서 다소 어색합니다. ‘나의 형제들이여’가 원문의 호칭과 엄숙한 권면의 어조를 자연스럽게 살립니다. ‘예는 예로, 아니오는 아니오로 하십시오’는 간결한 격언적 표현을 자연스럽게 전달합니다.
  terminology: ‘맹세하다’, ‘심판’은 적절합니다. κρίσις는 본문에서 더 강한 ‘정죄’로 한정하지 않고 ‘심판’으로 옮기되, 대안은 주석으로 남깁니다. ἀδελφοί의 남성 복수형은 본문에서 ‘형제들’로 보존하고, 공동체 전체를 가리킬 수 있다는 점을 주석으로 밝힙니다.
  issues:
  - severity: medium
    issue: ‘어떤 다른 맹세로도 하지 마십시오’의 결합이 부자연스럽습니다.
    rationale: μήτε ἄλλον τινὰ ὅρκον은 앞선 금지와 병렬을 이루는 포괄적 금지입니다. ‘그 밖의 어떤 맹세도 하지 마십시오’가 한국어에서 더 명료하고 자연스럽습니다.
  - severity: low
    issue: ‘나의 형제 여러분’이 현대 표준 한국어에서 다소 어색합니다.
    rationale: 호격의 ἀδελφοί μου는 ‘나의 형제들이여’가 자연스럽고 원문의 직접 호소를 보존합니다.
  - severity: medium
    issue: ‘그래야 … 떨어지지 아니할 것입니다’가 목적절을 미래 결과 진술로 바꿉니다.
    rationale: ἵνα μὴ … πέσητε는 권면의 목적을 나타내므로 ‘… 떨어지지 않도록 하십시오’가 문법 기능을 더 가깝게 반영합니다.
  revised_text: 그러나 나의 형제들이여, 무엇보다도 맹세하지 마십시오. 하늘을 두고도 땅을 두고도, 그 밖의 어떤 맹세도 하지 마십시오. 여러분의 「예」는 「예」로, 「아니오」는 「아니오」로 하십시오. 그리하여 여러분이 심판 아래에 떨어지지 않도록 하십시오.
  revised_footnotes:
  - marker: a
    text: 그리스어는 ‘나의 형제들’이라고 하며, 문맥상 믿는 공동체 전체를 가리킬 수 있습니다.
    reason: ἀδελφοί의 어휘적 대안 및 포괄적 지시 대상 설명
  - marker: b
    text: 또는 ‘정죄 아래에 떨어지지 않도록 하십시오.’
    reason: κρίσις의 가능한 더 강한 번역을 본문에 과도하게 한정하지 않고 제시
  revision_rationale: 원문의 강조(‘무엇보다도’), 맹세에 대한 포괄적 금지, 예·아니오의 간결한 대구, 그리고 ‘심판 아래에 떨어지다’라는 목적절을 보존하면서 현대 한국어 합쇼체로 다듬었습니다. 본문에 주석 표지가 표시될 수 있도록 a는 ‘형제들이여’ 뒤에, b는 ‘심판’ 뒤에 붙입니다.
