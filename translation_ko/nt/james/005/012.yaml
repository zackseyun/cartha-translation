review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the priority marker, prohibition of oath-taking, call to direct truthfulness, and the broad sense of κρίσις as ‘judgment.’ However, ‘어떤 다른 맹세로도’ is not idiomatic Korean for μήτε ἄλλον τινὰ ὅρκον, and the final future statement weakens the Greek purpose clause.
  naturalness: ‘나의 형제 여러분’ is understandable but somewhat awkward. ‘나의 형제들이여’ is a natural formal biblical address. Rendering the oath formulas with ‘~을 두고’ is idiomatic modern Korean.
  terminology: ‘심판’ appropriately retains the Greek’s broader meaning and does not impose the more specific sense of condemnation. ‘맹세’ is the appropriate term for ὅρκος/ὀμνύω in this context.
  issues:
  - severity: medium
    issue: ‘어떤 다른 맹세로도’ is awkward and does not naturally express the final item in the Greek prohibition.
    rationale: μήτε ἄλλον τινὰ ὅρκον means ‘nor any other oath.’ In Korean, ‘그 밖의 어떤 맹세도 하지 마십시오’ clearly carries the coordinated prohibition without the unnatural instrumental phrase ‘맹세로.’
  - severity: medium
    issue: ‘그래야 여러분이 심판 아래 떨어지지 아니할 것입니다’ presents the result as a future prediction rather than the purpose expressed by ἵνα μὴ ... πέσητε.
    rationale: 'The Greek uses a purpose clause: straightforward speech is commanded so that the hearers may not fall under judgment. ‘...않도록 하십시오’ retains this exhortational purpose relationship.'
  - severity: low
    issue: ‘나의 형제 여러분’ is less natural than a conventional formal biblical vocative.
    rationale: ‘나의 형제들이여’ preserves ἀδελφοί μου directly and suits a modern formal-polite scripture register. A footnote can clarify the likely whole-community reference.
  revised_text: 그러나 무엇보다도, 나의 형제들이여, 맹세하지 마십시오. 하늘을 두고도, 땅을 두고도, 그 밖의 어떤 맹세도 하지 마십시오. 여러분의 「예」는 「예」가 되게 하고, 「아니오」는 「아니오」가 되게 하십시오. 그리하여 여러분이 심판 아래 떨어지지 않도록 하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 ‘나의 형제자매 여러분’. 그리스어는 직역하면 ‘나의 형제들’이며, 믿는 공동체 전체를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정죄 아래 떨어지지 않도록 하십시오’.
    reason: alternative_reading
  revision_rationale: The revision makes the oath prohibition idiomatic in Korean, preserves the Greek purpose clause, and retains ‘judgment’ rather than over-specifying κρίσις as final condemnation. Footnotes preserve the inclusive-reference clarification for ἀδελφοί and the stronger possible rendering of κρίσις.
