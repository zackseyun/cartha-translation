    issue: 「주께서 오실 때가」
    rationale: 원문의 ἡ παρουσία τοῦ κυρίου는 ‘주의 오심/도래’라는 명사구입니다. ‘주께서 오실 때’는 시간을 뜻하는 절로 바꾸므로, ‘그 오심이 가까이 왔다’는 원문의 표현과 구조를 직접적으로 보존하지 못합니다.
  revised_text: 여러분도 오래 참으십시오. 여러분의 마음을 굳게 하십시오. 주님의 오심[a]이 가까이 왔기 때문입니다.
