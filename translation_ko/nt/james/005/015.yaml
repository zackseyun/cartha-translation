  source_fidelity: 첫 절의 καὶ는 단순 접속사 ‘그리고/또’인데, 초안의 ‘그리하면’은 조건·결과 관계를 추가합니다. 또한 κἄν의 양보적 조건은 ‘죄를 지었더라도’로 자연스럽게 반영하는 것이 적절합니다. σώσει는 본문에서 ‘구원할’로 유지하여 치유와 구원의 폭을 보존했습니다.
  naturalness: ‘병든 자’보다 현대 표준 한국어에서는 ‘병든 사람’이 자연스럽습니다. ‘용서받을 것입니다’는 수동형 미래를 자연스럽고 간결하게 옮깁니다. 전체 문장은 합쇼체로 통일했습니다.
  terminology: ‘믿음의 기도’, ‘구원하다’, ‘주’, ‘일으키다’, ‘죄’, ‘용서받다’는 원문의 핵심 어휘와 한국어 성서 문체에 잘 맞습니다. ‘구원할’에 치유/낫게 함의 대안을, ‘믿음의 기도’와 양보 조건에 해설 각주를 달아 의미 범위를 보존했습니다.
