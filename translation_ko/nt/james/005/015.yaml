revisions:
- from: 그리하면 믿음의 기도가 병든 자를 구원할 것이며, 주께서 그를 일으키실 것입니다. 만일 그가 죄를 지었다면, 사함을 받을 것입니다.
  to: 그리고 믿음[b]의 기도가 병든 사람을 구원할[a] 것이며, 주께서 그를 일으키실 것입니다. 그가 죄를 지었더라도[c], 용서받을 것입니다.
  rationale: 원문에 없는 조건 표현 ‘그리하면’을 ‘그리고’로 바로잡고, 병상에서의 회복과 더 넓은 구원의 울림을 함께 지닌 σώσει를 ‘구원할’로 유지했습니다. κἄν의 양보 조건은 ‘죄를 지었더라도’로 옮겼으며, 죄가 모든 질병의 원인이라는 뜻을 더하지 않았습니다. 각주는 영어 감사 기록의 주요 어휘·구문 대안을 한국어로 제공하고, 본문 내 표지를 모두 연결했습니다.
