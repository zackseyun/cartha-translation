  text: 그러므로 형제 여러분, 주님의 오심까지 오래 참으십시오. 보십시오, 농부는 땅의 귀한 열매를 기다리며, 그 열매가 이른 비와 늦은 비를 받을 때까지 그것을 두고 오래 참습니다.
