  source_fidelity: ‘서로 원망하지 마십시오’는 관계적 갈등을 나타내지만, στενάζετε κατ’ ἀλλήλων의 직접적인 불평·투덜거림의 뜻을 충분히 드러내지 못합니다. ‘서로에게 불평하지 마십시오’가 원문의 윤리적 경고를 더 가깝게 옮깁니다. κριθῆτε의 수동형과 ἵνα μή의 목적을 ‘심판을 받지 않도록’으로 명확히 반영했습니다. ‘문들 앞에’는 한국어로 부자연스러우므로, 복수형을 별도 주석으로 보존하면서 관용적인 ‘문 앞에’를 사용했습니다.
  naturalness: 합쇼체를 유지하고, ‘보십시오, 심판자가 문 앞에 서 있습니다’로 두 문장을 자연스럽게 연결했습니다. ‘형제 여러분’은 현대 한국어에서 공동체를 부르는 관용적 호칭으로 유지하되, 원어의 포괄적 공동체 호칭 가능성은 주석으로 밝혔습니다.
  terminology: ‘심판자’는 κριτής를 과도하게 특정하지 않으면서 종말론적 판단의 직무를 보존합니다. ‘심판을 받다’는 κρίνω의 판단/심판 의미를 ‘정죄’로 좁히지 않습니다.
