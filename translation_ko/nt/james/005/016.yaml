  source_fidelity: 첫 두 명령의 상호성은 대체로 잘 반영되어 있습니다. 그러나 ὅπως ἰαθῆτε는 목적을 나타내므로, 단순한 미래 결과인 ‘그리하면 … 얻을 것입니다’보다 ‘… 얻도록’으로 옮기는 것이 원문에 더 가깝습니다. ἐνεργουμένη의 난해한 작용/효력의 뉘앙스도 본문과 각주에서 보존하는 것이 적절합니다.
  naturalness: ‘서로에게’로 고백의 상대를 분명히 하고, 목적절을 기도 명령에 자연스럽게 연결했습니다. ‘의인의 간구는 역사할 때 큰 힘을 발휘합니다’는 현대 표준어 합쇼체 문맥에서 자연스러우며, 기도의 작용성을 유지합니다.
  terminology: ‘죄’, ‘고백하다’, ‘기도하다’, ‘나음을 얻다’, ‘의인’, ‘간구’는 문맥과 한국어 성서 문체에 적합합니다. ‘나음’은 신체적 치유와 더 넓은 회복의 가능성을 불필요하게 좁히지 않습니다.
