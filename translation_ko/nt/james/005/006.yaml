  terminology: ‘의인’ is an established, suitably concise rendering of τὸν δίκαιον and does not prematurely identify the referent as Jesus. ‘살해했습니다’ appropriately retains the force of φονεύω. ‘대적하다’ is a direct and natural rendering of ἀντιτάσσομαι.
  issues:
