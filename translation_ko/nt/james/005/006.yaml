    issue: ‘죽였습니다’ weakens the force of ἐφονεύσατε.
    rationale: The Greek verb φονεύω ordinarily denotes murder or unlawful killing, not merely killing. ‘살해했습니다’ more closely represents this force in Korean.
  - severity: low
    issue: ‘아니합니다’ does not match the requested modern formal-polite register as well as ‘않습니다.’
    rationale: The latter is the ordinary contemporary Standard Korean 합쇼체 form.
  - severity: medium
    issue: The draft provides no note for the punctuational/interpretive ambiguity of the final clause.
    rationale: The supplied SBLGNT punctuates the clause as a question, while the declarative is a defensible contextual rendering. A note preserves this unresolved ambiguity.
