  text: 여러분은 의인을[a] 정죄하고 살해했습니다. 그는 여러분을 대적하지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로운 이’. 이 표현은 부유한 이들에게 억압받는 의로운 사람을 대표적으로 가리킬 수 있습니다. 일부 해석자는 이를 예수님, 곧 ‘의로운 이’에 대한 암시로 보기도 합니다.
    reason: ‘τὸν δίκαιον’의 지시 대상은 본문에서 명시되지 않았으므로, 대표적 의인이라는 의미와 그리스도론적 암시 가능성을 함께 보존합니다.
  - marker: b
    text: 그리스어는 ‘그가 여러분을 대적하지 않습니까?’로 물음으로 읽을 수도 있습니다. 본문은 문맥에 따라 그가 여러분을 대적하지 않는다는 서술로 옮겼습니다.
    reason: SBLGNT의 물음표와 선언문으로 이해될 수 있는 문맥적 해석 사이의 모호성을 보존합니다.
