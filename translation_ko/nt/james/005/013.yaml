    issue: ‘그는 기도하십시오’ 및 ‘그는 찬송하십시오’의 주어-종결어미 불일치
    rationale: ‘그는’은 3인칭 지시인데 ‘-십시오’는 청자를 향한 높임 명령입니다. 헬라어의 3인칭 단수 명령을 한국어에 기계적으로 대응시킨 결과로, 자연스러운 한국어 권면이 되지 않습니다.
  - severity: low
    issue: ψαλλέτω의 가능한 ‘시편을 노래하다’ 의미에 대한 각주 부재
    rationale: 본문의 ‘찬송하십시오’는 넓은 의미로 적절하지만, 동사가 시편 노래를 가리킬 수 있다는 어휘적 가능성을 짧은 각주로 보존하면 영어 POB 감사 기록과도 일치합니다.
