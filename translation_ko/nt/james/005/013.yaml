  source_fidelity: 첫 문장의 ‘고난을 겪는’은 κακοπαθεῖ의 현재적 고난·역경을 대체로 잘 옮깁니다. 그러나 ‘그는 기도하십시오/찬송하십시오’는 한국어에서 3인칭 주어와 2인칭 명령형이 결합되어 문법적·화용론적으로 부자연스럽습니다. 주어를 생략한 조건적 권면으로 바꾸면 τις와 단수 명령의 대표적 용법을 자연스럽게 전달합니다. ψαλλέτω는 ‘찬송하십시오’로 옮기되, ‘시편을 노래하십시오’라는 가능한 좁은 의미는 각주로 보존하는 것이 적절합니다.
  naturalness: 합쇼체의 질문과 명령은 유지하되, ‘여러분 가운데 … 있습니까?’ 뒤에 ‘그는 …하십시오’라고 하는 표현은 피해야 합니다. ‘고난을 겪고 있습니까? 기도하십시오’와 같은 생략형이 현대 표준 한국어에서 자연스럽고 직접적입니다.
  terminology: ‘고난을 겪다’, ‘기도하다’, ‘찬송하다’는 교회 문맥에서 널리 이해되는 적절한 용어입니다. ‘찬송하다’는 ψάλλω의 예배·찬양 의미를 자연스럽게 드러내며, 시편으로 한정될 수 있는 어휘적 가능성은 각주에서 밝협니다.
  issues:
