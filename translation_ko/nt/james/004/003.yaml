  verdict: revise
  source_fidelity: 'The draft correctly conveys the causal relation and the general sense of asking wrongly. However, its conditional phrasing ("구하여도") weakens the Greek''s straightforward present assertion, and "욕망에 쓰려는" is less precise than the source: ἡδοναῖς denotes pleasures/self-indulgent enjoyments, while δαπανήσητε means to spend or expend what is sought.'
  naturalness: A direct formal-polite rendering with finite sentences is more natural in modern Korean and maintains the verse's rhetorical clarity.
  terminology: '"쾌락" appropriately renders ἡδοναῖς here without narrowing it to motives or importing a particular doctrinal interpretation. "잘못 구하다" preserves the breadth of κακῶς.'
  issues:
