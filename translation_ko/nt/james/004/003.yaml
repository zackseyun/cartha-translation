    issue: The opening conditional construction does not fully reflect the Greek indicative assertion.
    rationale: αἰτεῖτε καὶ οὐ λαμβάνετε states, "You ask and do not receive," rather than "Even if you ask, you do not receive."
  - severity: medium
    issue: '"욕망에 쓰려는" blurs the lexical sense and the spending construction.'
    rationale: ἡδοναῖς refers to pleasures, and δαπανήσητε expresses spending/expenditure. "쾌락을 위해 그것을 쓰려고" makes both elements clear while retaining the implicit object as a necessary Korean pronoun.
  revised_text: 여러분은 구하지만 받지 못합니다. 여러분의 쾌락을 위해 그것을 쓰려고 잘못 구하기 때문입니다.
