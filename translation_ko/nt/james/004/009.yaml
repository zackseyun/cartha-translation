  naturalness: ‘괴로워하고 슬퍼하고 우십시오’는 현대 표준어 합쇼체로 자연스럽고, 엄중한 권면의 어조도 유지합니다. ‘침울함’은 다소 문어적이지만 κατήφεια의 낙담하고 가라앉은 상태를 적절히 나타내며 본문의 엄숙한 문체에 맞습니다.
  terminology: ‘슬픔’과 ‘침울함’은 각각 πένθος와 κατήφεια의 대조를 보존합니다. ‘여러분의’는 두 병렬 명사에 모두 적용되도록 표현하여 원문의 수사적 대칭을 살렸습니다.
