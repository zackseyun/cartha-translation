review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the sequence of frustrated desire, murder, envy, inability to attain, conflict, and failure to have through not asking. However, its final conflict pair, “다투고 싸웁니다,” does not adequately distinguish πολεμεῖτε (‘wage war’) from μάχεσθε (‘fight/quarrel’).
  naturalness: The draft is generally clear and uses appropriate modern formal-polite Korean. “욕망을 품으나” is intelligible but somewhat stiff; “욕망을 품지만” is more natural in this parallel, frustrated-desire construction.
  terminology: “살인하고” appropriately preserves the strong force of φονεύετε. “시기하지만” is suitable for ζηλοῦτε in context. “구하지 아니하므로” is formal but marked/archaizing relative to the requested modern standard; “구하지 않기 때문에” is modern formal-polite and preserves the causal construction. No explicit object such as 하나님 should be added to ‘ask.’
  issues:
  - severity: medium
    issue: The rendering of μάχεσθε καὶ πολεμεῖτε is insufficiently differentiated.
    rationale: “다투고 싸웁니다” renders both verbs as ordinary fighting and weakens πολεμεῖτε, which specifically carries the stronger warfare sense. “다투고 전쟁을 벌입니다” preserves the rhetorical escalation without deciding whether James intends literal or figurative conflict.
  - severity: low
    issue: The causal phrasing is unnecessarily archaizing for the stated target register.
    rationale: “구하지 아니하므로” is grammatically sound but less natural in modern standard 합쇼체 than “구하지 않기 때문에.”
  revised_text: 여러분은 욕망을 품지만 가지지 못합니다. 살인하고 시기하지만 얻을 수 없습니다. 다투고 전쟁을 벌입니다. 구하지 않기 때문에 가지지 못합니다.
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek clause sequence and emphatic lexical force while making the Korean more natural and maintaining the distinction between having (ἔχετε) and attaining/obtaining (ἐπιτυχεῖν). It also renders the escalating pair μάχεσθε/πολεμεῖτε as “다투고 전쟁을 벌입니다.” The implicit object of ‘ask’ remains unstated, as in Greek.
