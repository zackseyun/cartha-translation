- from: 여러분은 욕망을 품으나 얻지 못합니다. 살인하고 시기하지만 얻을 수 없습니다. 다투고 싸웁니다. 여러분이 구하지 아니하므로 가지지 못하는 것입니다.
  to: 여러분은 욕망을 품지만 가지지 못합니다. 살인하고 시기하지만 얻을 수 없습니다. 다투고 전쟁을 벌입니다. 구하지 않기 때문에 가지지 못합니다.
  rationale: The revision preserves the Greek clause sequence and emphatic lexical force while making the Korean more natural and maintaining the distinction between having (ἔχετε) and attaining/obtaining (ἐπιτυχεῖν). It also renders the escalating pair μάχεσθε/πολεμεῖτε as “다투고 전쟁을 벌입니다.” The implicit object of ‘ask’ remains unstated, as in Greek.
