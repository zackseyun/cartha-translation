    text: 직역하면 ‘간음한 여자들이여’입니다. 여기서는 예언서의 언약 언어를 반영하여 하나님께 대한 영적·언약적 불충실을 비유적으로 가리킬 가능성이 큽니다.
    reason: μoiχαλίδες의 여성 복수 호격과 비유적 용법 가능성을 함께 보존하기 위함
