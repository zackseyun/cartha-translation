  rationale: 수사 질문을 원문의 문장 구조대로 ‘성경이 헛되이 말한다고 생각합니까?’로 바로잡았습니다. 인용문에서는 τὸ πνεῦμα을 ‘그 영’으로 유지하고, κατῴκισεν의 사역 의미를 ‘거하게 하신’으로 반영했습니다. Πρὸς φθόνον의 논쟁적 의미는 ‘시기할 만큼’으로 절제하여 옮기고, 성령/인간 영 및 시기 표현의 대안을 각주로 보존했습니다.
