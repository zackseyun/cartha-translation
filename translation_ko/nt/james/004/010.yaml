  source_fidelity: ‘주 앞에서 자기를 낮추십시오’는 ταπεινώθητε ἐνώπιον κυρίου를 자연스럽게 옮기며, 수동형 명령의 문맥상 자발적 자기 낮춤이라는 의미도 보존합니다. ‘그분이 여러분을 높이실 것입니다’는 καὶ ὑψώσει ὑμᾶς의 미래 약속과 복수 수신자를 충실히 반영합니다. ‘주’는 원문의 κύριος가 지닌 구체적 지시 대상의 여지를 불필요하게 좁히지 않습니다.
