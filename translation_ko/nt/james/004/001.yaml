  source_fidelity: 초안은 공동체 안의 갈등과 내적 동기의 연결을 잘 반영하지만, 반복된 Πόθεν(‘어디서 … 또 어디서’)이 한 번으로 축소되었고, ἡδονῶν은 ‘욕망’보다 ‘쾌락들’이 더 직접적인 대응입니다. στρατευομένων의 군사적 비유도 ‘전쟁을 벌이는’으로 드러내는 편이 적절합니다.
  naturalness: ‘여러분 가운데 전쟁은 어디서 오며, 싸움은 또 어디서 옵니까?’는 현대 표준 한국어에서 자연스러우면서도 원문의 반복과 수사 의문을 보존합니다. ‘여러분의 지체 안에서’는 다소 문어적이나 본문의 문자적 표현을 유지하며 각주로 뜻을 보완할 수 있습니다.
  terminology: πόλεμοι/μάχαι는 ‘전쟁/싸움’으로 구별하고, ἡδοναί는 ‘쾌락들’, μέλη는 ‘지체’로 옮깁니다. ‘지체’가 교회 구성원을 뜻하는 용례로도 익숙할 수 있으므로, 여기서는 신체의 부분 또는 사람 안의 기능들을 가리킬 수 있음을 각주에서 명시합니다.
