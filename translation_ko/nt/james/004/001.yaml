  text: 여러분 가운데 전쟁은 어디서 오며, 싸움은 또 어디서 옵니까? 이것들이 여러분의 지체 안에서 전쟁을 벌이는 여러분의 쾌락들로부터 오는 것이 아닙니까?[a][b][c]
  philosophy: optimal-equivalence
