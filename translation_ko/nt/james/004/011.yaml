source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: ko
  text: 형제 여러분[a], 서로 비방하지 마십시오. 형제를 비방하거나 자기 형제를 판단하는 사람은 율법을 비방하고 율법을 판단합니다. 그러나 율법을 판단한다면, 율법을 행하는 사람이 아니라 재판관입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제 여러분’은 헬라어 남성 복수형이지만, 문맥상 공동체 전체, 곧 형제자매를 부르는 말일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλέω
  english_pob_choice: speak against
  chosen_korean: 비방하다
  alternatives_korean:
  - 헐뜯다
  - 거슬러 말하다
  lexicon: BDAG
  rationale: 뒤에서 험담하거나 깎아내리는 말을 가리킨다. 「비방하다」가 가장 자연스럽다.
