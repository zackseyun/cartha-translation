  naturalness: ‘말에서 실족하지 않으면’과 ‘온몸까지도 재갈로 다스릴 수 있는’은 현대 표준 한국어 합쇼체에서 자연스럽고, 뒤이어 나오는 재갈의 비유도 보존합니다.
