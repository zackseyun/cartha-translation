base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: ko
  text: 우리는 모두 여러 가지로 실족하기 때문입니다. 누구든지 말에서 실족하지 않으면, 그는 온몸까지도 재갈로 다스릴 수 있는 성숙한 사람입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘말에서’(ἐν λόγῳ)는 말함, 곧 발언이나 언어생활을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘성숙한’에 해당하는 그리스어 τέλειος는 ‘완전한’, ‘온전한’, 또는 ‘성숙한’을 뜻할 수 있습니다. 여기서는 절대적인 무흠을 뜻하기보다 도덕적 성숙을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘남자’(ἀνήρ)라는 남성 단수를 사용하지만, 여기서는 ‘누구든지’라는 일반적 진술 안에서 대표적으로 쓰였습니다.
    reason: cultural_note
