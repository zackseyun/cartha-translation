  to: 혀도 불입니다. 우리 지체 가운데 자리 잡은 혀는 불의의 세계가 되어, 온몸을 더럽히고 인생의 수레바퀴[a]를 불태우며, 자신은 게헨나[b]에 의해 불붙고 있습니다.
