  source_fidelity: 수정 전 본문은 전반적으로 원문의 강렬한 비유와 병렬 구조를 잘 보존합니다. 그러나 ὑπὸ τῆς γεέννης는 ‘게헨나에 의해’이며, ‘게헨나의 불에 의해’는 원문에 없는 ‘불’을 보충합니다. 또한 φλογιζομένη의 수동성을 더 직접적으로 드러내는 표현이 적절합니다.
  naturalness: ‘혀도 불입니다’, ‘불의의 세계’, ‘인생의 수레바퀴’는 현대 표준 한국어의 격식 있는 성경 문체 안에서 자연스럽습니다. 마지막 절은 ‘게헨나에 의해 불붙고 있습니다’로 하면 반복되는 불의 이미지를 유지하면서도 원문의 수동 관계를 명확히 합니다.
