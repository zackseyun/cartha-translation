source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: ko
  text: 혀도 불입니다. 우리 지체 가운데 자리 잡은 혀는 불의의 세계가 되어, 온몸을 더럽히고 인생의 수레바퀴[a]를 불태우며, 자신은 게헨나[b]에 의해 불붙고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘태어남의 수레바퀴’입니다. ‘삶의 과정’ 또는 ‘삶의 순환’으로도 옮길 수 있습니다.
    reason: τὸν τροχὸν τῆς γενέσεως의 직역적 비유와 해석적 번역 가능성을 함께 제시합니다.
  - marker: b
    text: ‘게헨나’는 그리스어 γέεννα를 음역한 것입니다. 전통적으로는 ‘지옥’으로 번역합니다.
    reason: 원문의 특정 용어를 보존하면서 통용 번역을 안내합니다.
lexical_decisions: []
theological_decisions:
- issue: 혀에 관한 비유(3:1-12)의 강도 보존
  chosen_reading: 게헨나의 불, 인생의 수레바퀴, 죽음의 독 등 강한 이미지를 그대로 유지
  alternative_readings:
  - 「지옥」으로 의역, 「수레바퀴」를 「과정」으로 풀이
  rationale: 야고보의 혀 단락은 격렬한 동방 지혜문학의 이미지로 구성되어 있다. 한국어로 풀어 약화시키면 본문의 충격이 사라진다. 「숲」, 「수레바퀴」, 「게헨나」 등 본문의 구체적 어휘를 모두 보존한다.
  doctrine_reference: 'DOCTRINE.md: 본문의 강도와 시각성을 보존'
