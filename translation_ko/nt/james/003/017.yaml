base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: ko
  text: 그러나 위로부터 오는 지혜는 첫째로 정결하고, 그다음에는 평화롭고, 관대하며, 잘 듣고 따르며, 긍휼과 선한 열매로 가득하고, 편파적이지 않으며[a], 위선이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한결같으며’ 또는 ‘의심하거나 망설이지 않으며’. 그리스어 아디아크리토스(ἀδιάκριτος)는 ‘편파적이지 않은’으로도, ‘나뉘지 않은/한결같은’ 또는 ‘의심하지 않는’으로도 이해될 수 있습니다.
    reason: lexical_alternative
