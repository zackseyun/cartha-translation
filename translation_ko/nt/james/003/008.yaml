  verdict: revise
  source_fidelity: The draft correctly renders the contrast, the human inability to tame the tongue, and its being full of lethal poison. However, “가만있지 않는 악” is an awkward and somewhat colloquial way to express ἀκατάστατον; it does not convey the Greek adjective’s sense of restless, unstable, or unruly evil as naturally as a formal Korean rendering can.
  naturalness: “그러나 어떤 사람도 혀를 길들일 수 없습니다” is natural modern formal Korean and accurately expresses οὐδεὶς … ἀνθρώπων δύναται δαμάσαι. “쉬지 않는 악” is an established, idiomatic formal expression for the restless quality intended here.
  terminology: “혀” appropriately preserves James’s sustained image for speech, and “길들이다” retains the link with the preceding taming imagery. “죽음에 이르게 하는 독” clearly conveys ἰοῦ θανατηφόρου without introducing doctrinal interpretation.
  issues:
  - severity: medium
    issue: “가만있지 않는 악” is stylistically awkward and insufficiently precise for ἀκατάστατον.
    rationale: The phrase sounds conversational and merely describes inability to remain still. In context ἀκατάστατον denotes a restless/unruly, destabilizing evil. “쉬지 않는 악” is both natural Korean and a close contextual equivalent.
