revisions:
- from: 여러분 가운데 누가 지혜롭고 명철한 사람입니까? 그는 지혜의 온유함으로, 자기의 선한 행실을 통해 자기 행위를 보일 것입니다.
  to: 여러분 가운데 지혜롭고 명철한 사람이 누구입니까? 그런 사람은 지혜의 온유함으로 선한 행실을 통하여 자기 행위를 보이십시오.
  rationale: The revision changes the future indicative to the formal-polite imperative 보이십시오, preserving the force of δειξάτω. 그런 사람은 represents the Greek masculine singular generically in idiomatic Korean, without implying that wisdom is restricted to men. The wording retains the source text's rhetorical question, its connection between conduct and works, and the deliberately compact expression 지혜의 온유함.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:52:48Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the rhetorical question and the key terms for wisdom, understanding, good conduct, works, and gentleness. However, 보일 것입니다 is future indicative, whereas δειξάτω is a third-person singular aorist imperative and must retain exhortative force.
  naturalness: The clause order is understandable, but 자기의 선한 행실을 통해 자기 행위를 repeats 자기 awkwardly and presents the imperative as a prediction. A representative expression such as 그런 사람은 is natural in formal Korean.
  terminology: 지혜롭고 명철한 is suitable for σοφὸς καὶ ἐπιστήμων. 지혜의 온유함 appropriately preserves the compact genitive relationship in πραΰτητι σοφίας without unnecessarily deciding between attributive and source nuance. 선한 행실 and 행위 are appropriate for ἀναστροφή and ἔργα.
  issues:
  - severity: high
    issue: 보일 것입니다 translates δειξάτω as a future statement.
    rationale: The Greek is an aorist imperative, calling the wise person to demonstrate deeds, not predicting that the person will do so.
  - severity: low
    issue: 자기의 선한 행실을 통해 자기 행위를 is stylistically repetitive.
    rationale: The Greek has possessive force only with works (τὰ ἔργα αὐτοῦ); Korean can express the relationship naturally without repeating 자기.
  revised_text: 여러분 가운데 지혜롭고 명철한 사람이 누구입니까? 그런 사람은 지혜의 온유함으로 선한 행실을 통하여 자기 행위를 보이십시오.
  revised_footnotes: []
  revision_rationale: The revision changes the future indicative to the formal-polite imperative 보이십시오, preserving the force of δειξάτω. 그런 사람은 represents the Greek masculine singular generically in idiomatic Korean, without implying that wisdom is restricted to men. The wording retains the source text's rhetorical question, its connection between conduct and works, and the deliberately compact expression 지혜의 온유함.
