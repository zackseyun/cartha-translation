    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 모든 것에 대해 책임이 있는 사람이기 때문입니다.’ 이는 율법의 한 부분을 어기면 율법 전체에 관하여 책임을 지게 됨을 뜻하며, 모든 계명을 각각 범했다는 뜻을 반드시 말하는 것은 아닙니다.
