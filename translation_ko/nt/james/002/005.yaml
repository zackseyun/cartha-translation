review_pass:
  verdict: revise
  source_fidelity: 원문의 ἐξελέξατο는 가난한 이들을 ‘믿음에 부요하고 나라의 상속자인’ 이들로 택하셨다는 서술입니다. 초안의 ‘택하셔서 … 되게 하시고’는 택하심이 그들을 부요하게 하고 상속자가 되게 하는 원인이라는 추가적인 사역·결과 관계를 만듭니다.
  naturalness: 초안은 전반적으로 자연스러운 합쇼체이나, 병렬된 ‘되게 하시고’가 길고 원문의 수식 구조를 인과적 구조로 바꿉니다. 수식절로 정리하면 현대 표준어로도 자연스럽습니다.
  terminology: ‘하나님’, ‘믿음’, ‘나라’, ‘상속자’는 적절합니다. τῷ κόσμῳ는 ‘세상에서는’으로, ἐν πίστει는 ‘믿음에는’으로 대조를 살릴 수 있습니다. ἀδελφοί의 포괄 가능성은 본문에 ‘형제 여러분’을 유지하고 각주로 알리는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘택하셔서 … 되게 하시고’가 선택과 부요함·상속자 됨 사이에 인과적 사역 관계를 추가합니다.
    rationale: 그리스어는 τοὺς πτωχούς를 πλουσίους 및 κληρονόμους와 함께 ἐξελέξατο의 목적어 보어로 제시합니다. 번역은 이들이 택하심의 결과로 ‘되게 된’다는 점을 이 절 자체에서 명시하지 않아야 합니다.
  revised_text: 사랑하는 나의 형제 여러분, 들으십시오. 하나님께서 세상에서는 가난하지만 믿음에는 부요하고, 자기를 사랑하는 이들에게 약속하신 나라의 상속자인 사람들을 택하지 않으셨습니까?
  revised_footnotes:
  - marker: a
    text: ‘형제 여러분’은 그리스어로는 남성 복수형 ‘형제들’이며, 온 신자 공동체를 포괄하여 부르는 말일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘세상에서는 가난하지만’은 ‘세상의 기준으로 가난한’ 또는 ‘세상의 눈에는 가난한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘믿음’은 ‘신뢰’로도 옮길 수 있으며, 여기서는 가능성이 낮지만 ‘신실함’으로 이해할 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 수사 의문문, ‘사랑하는 나의 형제들’이라는 호칭, 세상적 가난과 믿음 안의 부요함의 대조, 그리고 약속된 나라의 상속자라는 병렬 서술을 유지했습니다. 특히 ‘되게 하시고’를 제거하여 원문에 없는 명시적 인과 관계를 피했습니다.
