  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: ko
  text: 사랑하는 나의 형제[a] 여러분, 들으십시오. 하나님께서 세상의 기준으로 가난한 사람들[b]을 믿음에 부요한 사람들[c]로, 또 하나님을 사랑하는 이들에게 약속하신 나라의 상속자들로 택하지 않으셨습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형제자매 여러분’. 그리스어는 문자적으로 ‘형제들’이며, 온 신자 공동체를 포괄하여 부를 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘세상 사람들의 눈에 가난한 사람들’, ‘세상적으로 가난한 사람들’.
    reason: lexical_alternative
  - marker: c
    text: ‘믿음’은 ‘신뢰’로도 옮길 수 있으며, 여기서는 가능성이 낮지만 ‘신실함’으로 이해할 수도 있습니다.
