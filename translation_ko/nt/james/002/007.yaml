  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 τὸ ἐπικληθὲν ἐφ’ ὑμᾶς의 관용적 수동 표현은 ‘여러분 위에 불려진’보다 ‘여러분에게 일컬어진’으로 옮기는 것이 자연스럽고 정확합니다. αὐτοὶ의 강조와 현재형 βλασφημοῦσιν의 수사 의문문도 유지했습니다.
  naturalness: ‘위에 불려진’은 현대 표준 한국어에서 어색하며, ‘불려진’보다 ‘일컬어진’이 이름과 결합하는 문어적 합쇼체 성경 문맥에 적합합니다. ‘그들이 바로 … 아닙니까?’도 가능하지만, ‘그들 자신이 … 모독하지 않습니까?’가 원문의 강조와 동사 중심 구문을 더 직접적으로 드러냅니다.
  terminology: βλασφημοῦσιν은 종교적·모욕적 뉘앙스를 보존하여 ‘모독하다’로 유지했습니다. καλὸν ὄνομα는 해석적으로 그리스도나 하나님의 이름으로 한정하지 않고 ‘아름다운 이름’으로 유지했습니다.
