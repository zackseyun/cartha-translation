- from: 긍휼을 베풀지 아니한 자에게는 긍휼 없는 심판이 있을 것이기 때문입니다. 긍휼은 심판을 이기고 자랑합니다.
  to: 긍휼을 베풀지 않은 사람에게는 심판도 긍휼이 없습니다. 긍휼은 심판에 맞서 의기양양합니다[a].
  rationale: 현재형의 일반적 경고를 유지하고, 마지막 절의 비유적 ‘자랑/승리’ 이미지를 자연스러운 현대 합쇼체로 옮겼습니다. 각주는 ‘승리하다’라는 관용적 해석과 원문의 자랑 이미지 모두를 보존합니다.
