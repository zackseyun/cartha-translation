  source_fidelity: 원문의 완료형 ἠτιμάσατε는 ‘업신여겼습니다’로 적절히 옮겼고, 단수 τὸν πτωχόν은 한국어에서 자연스럽게 대표적 의미를 유지하는 ‘가난한 자’로 표현했습니다. ‘압제하고’는 καταδυναστεύουσιν의 강압적 지배를, ‘법정으로 끌고 가는’은 ἕλκουσιν εἰς κριτήρια의 강제성과 법적 맥락을 충실히 반영합니다. 수사 의문문과 αὐτοὶ의 강조도 ‘바로 부자들이 아닙니까?’에 보존되어 있습니다.
  naturalness: 문장은 현대 표준 한국어 합쇼체로 자연스럽고 간결합니다. ‘가난한 자’는 다소 문어적이지만 성경 문맥에서는 자연스럽고, 앞 절의 특정한 가난한 방문자를 대표적으로 가리키는 원문의 단수 표현에도 잘 맞습니다.
  terminology: ‘압제하다’, ‘법정’, ‘부자들’은 문맥과 신약 번역 관습에 적절합니다. 특정 교리적 해석을 덧붙이지 않았습니다.
