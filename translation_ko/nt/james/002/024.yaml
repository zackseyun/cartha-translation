  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: ko
  text: 여러분은 보시는 바와 같이, 사람은 행위로 의롭다 하심을 받으며[a], 믿음[b]만으로 의롭다 하심을 받는 것은 아닙니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의롭다고 드러난다’ 또는 ‘정당함이 입증된다’. 야고보서의 표현은, 이것이 바울이 ‘의롭다 하다’를 사용하는 방식과 어떻게 관련되는지에 관한 해석 논쟁을 결론짓지 않은 채 보존합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘신실함’ 또는 ‘신뢰’. 그러나 이 번역에서는 그리스어 피스티스(πίστις)를 기본적으로 ‘믿음’으로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘한 사람’이며, 여기서는 일반적으로 인간을 가리키는 표현입니다.
    reason: cultural_note
