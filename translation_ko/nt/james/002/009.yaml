  naturalness: A finite-verb rendering in modern formal-polite Korean is clearer and more idiomatic. "사람을 외모로 차별하여 대하면" naturally expresses partial treatment based on outward appearance or status.
  terminology: '"율법" and "범법자" preserve the biblical-juridical register of νόμος and παραβάται. "책망을 받습니다" reflects ἐλεγχόμενοι without over-specifying a formal judicial verdict.'
