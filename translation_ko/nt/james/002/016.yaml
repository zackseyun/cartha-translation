  source_fidelity: The draft accurately conveys the hypothetical address, the contrast between spoken goodwill and withholding material necessities, and the concluding rhetorical question. However, "배부르게 드십시오" makes χορτάζεσθε explicitly an active command to eat, whereas the Greek middle/passive form remains open to passive or middle nuance. The alternative should be retained in a footnote.
  naturalness: The wording is generally natural in modern formal-polite Korean. "말하고도 ... 주지 않는다면" more clearly and idiomatically expresses the adversative force in context than "하면서 ... 주지 아니한다면."
  terminology: '"평안히 가십시오," "따뜻하게 지내시고," and "몸에 필요한 것" are appropriate, clear renderings. "배부르십시오" avoids adding the specific action of eating while remaining natural as part of a conventional wish.'
  issues:
  - severity: medium
    issue: '"배부르게 드십시오" narrows the voice and sense of χορτάζεσθε.'
    rationale: The Greek form may be read in a passive or middle sense. Rendering it as "드십시오" specifically directs the recipients to eat and thus resolves an ambiguity that the source does not resolve.
  - severity: low
    issue: The adversative relationship is understated by "하면서 ... 주지 아니한다면."
    rationale: Using "말하고도 ... 주지 않는다면" naturally conveys the rhetorical contrast expressed by δέ in the immediate context.
