  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘거기 서 있거나, 내 발등상 아래에 앉으시오’는 ἐκεῖ를 ‘서 있다’에 붙여 처리하여, 비평본문의 ⸂ἢ κάθου ἐκεῖ⸃(‘또는 거기에 앉으시오’)를 충분히 반영하지 못합니다. 또한 ἐπιβλέψητε는 이 문맥에서 단순히 시선을 두는 것보다 호의적으로 특별히 주목하는 뜻이므로 ‘특별히 주목하여’가 더 정확합니다.
  naturalness: 합쇼체 인용문과 조건절 구성은 자연스럽습니다. 다만 ‘당신은’의 반복은 한국어에서 다소 경직될 수 있으나, 두 사람에게 차별적으로 직접 말하는 원문의 대조를 보존하므로 유지할 수 있습니다. ‘내 발등상 아래에 거기에’처럼 직역하면 부자연스러우므로 ‘내 발등상 아래 저기에’로 위치의 거리감을 자연스럽게 드러냈습니다.
  terminology: ‘화려한 옷’은 λαμπράν의 ‘빛나는/훌륭한/화려한’ 의미 범위 안에 있으며 문맥에도 적절합니다. ‘발등상’은 ὑποπόδιον의 전통적이고 이해 가능한 대응어입니다. πτωχῷ의 남성 단수는 한국어에서 성별 표지가 없는 ‘가난한 사람’으로 자연스럽게 옮길 수 있습니다.
  issues:
  - severity: medium
    issue: ἐκεῖ의 수식 관계와 본문구 반영
    rationale: SBLGNT 본문은 ‘서 있으시오, 또는 거기에 앉으시오’라는 선택 명령을 포함합니다. 초안은 ‘거기’를 ‘서 있다’에 연결하고 ‘앉으시오’에는 ‘발등상 아래’만 연결하여 ⸂ἢ κάθου ἐκεῖ⸃를 정확히 재현하지 못합니다.
  - severity: low
    issue: ἐπιβλέψητε의 문맥상 뉘앙스
    rationale: ‘주목하여’도 가능한 번역이지만, 부유한 사람에게 우대적 관심을 보이는 장면에서는 ‘특별히 주목하여’가 원문의 호의적 주목이라는 뜻을 더 잘 전달하면서도 ‘차별하다’라고 과도하게 해석하지 않습니다.
  - severity: medium
    issue: 본문의 이문 표지 부재
    rationale: 비평본문에서 ‘또는 거기에 앉으시오’가 이문으로 표지되어 있고 영어 감사 기록도 이 구절의 사본 차이를 다룹니다. 해당 구절에 각주 표지를 두어 독자가 본문 상태를 확인할 수 있게 해야 합니다.
