  rationale: 원문의 명령 구조(‘서 있으시오, 또는 … 앉으시오’)와 ἐκεῖ의 거리감을 한국어 어순에 맞게 회복했습니다. 본문에 포함된 이문 구절에는 각주 표지를 추가했습니다. ‘특별히 주목하여’는 문맥상 ἐπιβλέψητε의 우대적 관심을 반영하되, 이 절 자체에 없는 해석적 표현은 피합니다.
