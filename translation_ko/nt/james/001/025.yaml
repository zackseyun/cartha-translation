- from: 그러나 자유를 주는 온전한 율법[a]을 자세히 들여다보고 그 안에 머무는 사람, 곧 잊어버리는 듣는 자가 아니라 행하는 자가 된 사람—그는 자기의 행함 가운데서 복을 받을 것입니다.
  to: 그러나 온전한 율법, 곧 자유의 율법[a]을 자세히 살피고 그 율법에 계속 머무는 사람은, 듣고 잊어버리는 사람이 아니라 행위를 실천하는 사람이 되어, 자기의 행함 가운데 복을 받을 것입니다.
  rationale: 원문의 「온전한 율법, 자유의 율법」이라는 동격적 표현을 보존하여 ‘자유’와 율법의 관계를 특정 교리나 해석으로 좁히지 않았습니다. παρακύψας의 주의 깊은 시선은 「자세히 살피고」로, παραμείνας의 지속성은 「계속 머무는」으로 반영했습니다. ἀκροατὴς ἐπιλησμονῆς는 자연스러운 한국어로 「듣고 잊어버리는 사람」으로, ποιητὴς ἔργου는 행위의 요소를 살려 「행위를 실천하는 사람」으로 옮겼습니다.
