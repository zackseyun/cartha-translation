base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: ko
  text: 시험[a]을 견디는 사람은 복이 있습니다. 그는 시험을 거쳐 인정받은 뒤에, 하나님께서 자기를 사랑하는 사람들에게 약속하신 생명의 면류관[b]을 받을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유혹’ 또는 ‘시련’. 그리스어 낱말은 시련과 유혹을 모두 가리킬 수 있으나, 여기의 문맥은 시험 아래에서 견디는 일을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘면류관’은 왕의 관뿐 아니라 경기 승리자에게 주는 화관을 가리킬 수도 있습니다.
    reason: cultural_note
