    issue: 각주 b가 ‘열두 지파’를 이스라엘 땅 밖의 유대 백성으로 단정합니다.
    rationale: διασπορά는 유대 디아스포라와 관련된 표현이지만, 이 서신의 ‘열두 지파’가 정확히 누구를 지칭하는지는 해석상 논의가 있습니다. 본문과 각주는 그 범위를 단정하지 않고 표현의 역사적·관용적 배경만 밝혀야 합니다.
  - severity: low
    issue: 각주 a가 야고보의 표현이 의도적으로 특정 ‘신학적 무게’를 드러낸다고 단정하고 내부 지침 및 다른 본문을 근거로 듭니다.
    rationale: δοῦλος의 어휘 범위와 번역 대안만 설명하면 충분합니다. 해당 의도에 대한 단정은 번역 주석의 범위를 넘어가며, 외부 내부지침 인용은 독자용 각주에 적절하지 않습니다.
  revised_text: 하나님과 주 예수 메시아의 노예인 야고보가, 흩어져 사는 열두 지파에게 문안합니다.
