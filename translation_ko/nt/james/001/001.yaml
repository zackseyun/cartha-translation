review_pass:
  verdict: revise
  source_fidelity: 본문은 Ἰάκωβος, δοῦλος, θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ, ταῖς δώδεκα φυλαῖς, χαίρειν을 충실히 반영합니다. 다만 διασπορά의 수신자 범위를 각주에서 단정적으로 ‘유대 백성’으로 한정하면, ‘열두 지파’가 문자적 유대 디아스포라인지 또는 더 넓은 신앙 공동체를 가리키는지에 관한 해석상 여지를 좁힙니다.
  naturalness: ‘하나님과 주 예수 메시아의 노예인 야고보가, 흩어져 사는 열두 지파에게 문안합니다’는 현대 표준 한국어의 격식 있는 편지 서두로 자연스럽습니다. ‘문안합니다’는 χαίρειν의 서신 관용 표현을 적절히 옮깁니다.
  terminology: ‘노예’는 δοῦλος의 강한 소속 관계를 보존하며, ‘메시아’는 Χριστός의 칭호성을 드러냅니다. ‘열두 지파’도 φυλαί에 적절합니다. 각주는 번역 선택을 설명하되 본문이 확정하지 않는 신학적 의도나 수신자 정체를 단정하지 않는 편이 좋습니다.
  issues:
