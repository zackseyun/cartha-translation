  terminology: 「야고보」, 「주」, 「메시아」, 「노예」, 「열두 지파」는 원문의 칭호와 어휘를 잘 보존합니다. 「흩어져 사는」은 διασπορά의 반전문적 유대 디아스포라 의미를 각주로 보완하는 것이 적절합니다.
