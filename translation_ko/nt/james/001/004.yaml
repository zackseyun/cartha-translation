  verdict: revise
  source_fidelity: 초안의 ‘그 인내가 온전한 일을 이루게 하십시오’는 ὑπομονὴ와 명령법 ἐχέτω 및 ἔργον τέλειον의 기본 뜻을 대체로 반영합니다. 그러나 ‘온전한 일을 이루다’는 인내가 어떤 선한 일을 행한다는 뜻으로도 읽힐 수 있어, 인내가 충분히 작용하여 의도된 결과를 내게 하라는 문맥을 더 분명히 드러낼 필요가 있습니다. 또한 ‘...없게 하려는 것입니다’는 ἵνα 목적절을 설명문으로 바꾸고 목적의 주체를 불분명하게 합니다.
  naturalness: ‘그리하여 여러분이 온전하고 완전하게 되어’는 유사한 뜻의 형용사를 겹쳐 다소 부자연스럽고, ‘어느 하나도 부족함이 없게 하려는 것입니다’도 현대 합쇼체 성경 문장으로는 어색합니다. ‘성숙하고 온전하여, 아무것도 부족함이 없게 될 것입니다’는 두 그리스어 형용사의 차이를 살리면서 자연스럽습니다.
  terminology: ὑπομονή는 ‘인내’가 적절합니다. τέλειον은 여기서 ‘온전한 효력’으로 옮겨 ἔργον τέλειον이 가리키는 완성된 작용/결과를 드러냈습니다. 사람에게 쓰인 τέλειοι는 ‘성숙하고’, ὁλόκληροι는 ‘온전하여’로 구별하여, 절대적 무결성을 단정하지 않으면서도 전인적 온전함의 뜻을 보존했습니다.
