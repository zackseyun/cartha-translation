  - severity: medium
    issue: 목적절이 ‘...하려는 것입니다’라는 설명문으로 전환되었습니다.
    rationale: ἵνα ἦτε는 독자들이 성숙하고 온전하게 되는 목적/결과를 표현합니다. 초안은 이 연결을 문법적으로 불명확하게 만듭니다.
  - severity: low
