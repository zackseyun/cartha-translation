  source_fidelity: 본문의 ‘유혹’ 번역과 하나님이 아무도 유혹하지 않으신다는 번역은 문맥과 잘 맞습니다. 다만 ἀπείραστός ἐστιν κακῶν은 난해한 표현이므로, ‘악에 의해 유혹받으실 수 없다’로 자연스럽게 풀되 각주의 설명은 이 구절 자체의 어휘 문제에 연결하는 편이 적절합니다.
