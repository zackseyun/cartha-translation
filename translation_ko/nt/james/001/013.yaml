  rationale: 본문의 πειράζω 계열은 죄로 이끄는 유혹이라는 문맥에 맞춰 유지했습니다. ἀπείραστος의 난해함은 본문에서 ‘유혹받으실 수 없다’로 자연스럽게 표현하고, 원문의 형용사적 표현 및 κακῶν의 복수형은 해당 어구에 붙인 각주에서만 설명했습니다. 기존 각주의 과도한 문맥 대조와 표지 불일치를 해소했습니다.
