review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequential conception-and-birth metaphor and leaves ‘death’ unqualified. However, ‘그 다음’ is less natural in this logical progression, and ‘욕망이 잉태하여’ is syntactically less clear than an explicit prior-action construction for the aorist participle συλλαβοῦσα.
  naturalness: ‘그 후에’ and ‘욕심이 잉태한 뒤’ are natural modern standard Korean and clearly express that desire first conceives and then gives birth. ‘완전히 자라면’ retains the growth/maturity image of ἀποτελεσθεῖσα.
  terminology: ‘욕심’ appropriately conveys ἐπιθυμία here as wrongful desire without restricting it to sexual lust. ‘죄’ and ‘죽음’ are standard, accurate theological terms, and no doctrinal qualification is added to ‘죽음.’
  issues:
  - severity: low
    issue: The temporal-participial relation is not fully explicit in ‘욕망이 잉태하여.’
    rationale: συλλαβοῦσα is an aorist participle preceding τίκτει. ‘잉태한 뒤’ clearly preserves the sequence while retaining the reproductive imagery.
  - severity: low
    issue: ‘그 다음’ is somewhat colloquial/awkward as a discourse connector in this verse.
    rationale: εἶτα marks the next stage in the argument; ‘그 후에’ is more idiomatic in formal Korean prose.
  revised_text: 그 후에 욕심이 잉태한 뒤 죄를 낳고, 죄가 완전히 자라면 죽음을 낳습니다.
  revised_footnotes: []
  revision_rationale: The revision makes the Greek sequence explicit, improves formal Korean flow, and preserves the personified conception, birth, and maturation imagery. It does not narrow the meaning of desire or specify the nature of death.
