    rationale: 의미는 맞지만 ἀποτελεσθεῖσα의 완료 또는 성숙의 뉘앙스를 ‘완전히 자라면’이 더 명확히 드러냅니다.
  revised_text: 그 후에 욕망이 잉태하여 죄를 낳고, 죄는 완전히 자라면 죽음을 낳습니다.
