  source_fidelity: 핵심 비유와 순서는 대체로 충실합니다. 다만 εἶτα는 여기서 구어적인 ‘그 다음’보다 문맥상 전개를 나타내는 ‘그 후에’가 더 적절하며, ἀποτελεσθεῖσα의 완료·성숙 뉘앙스를 ‘완전히 자라면’으로 밝혀 주는 편이 좋습니다.
  naturalness: ‘그 다음’은 현대 합쇼체 성경 문맥에서는 다소 구어적입니다. ‘그 후에’와 ‘완전히 자라면’은 자연스럽고, 잉태·출산의 의인화된 비유도 유지합니다.
  terminology: ἐπιθυμία는 성적인 의미로 한정하지 않는 ‘욕망’으로 유지하고, ἁμαρτία와 θάνατος는 각각 ‘죄’와 ‘죽음’으로 직역합니다. 죽음의 범위를 해석적으로 한정하지 않습니다.
  issues:
