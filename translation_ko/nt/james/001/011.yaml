base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: ko
  text: 해가 뜨거운 열기와 함께[a] 떠올라 풀을 말렸고, 그 꽃이 떨어졌으며 그 아름다운 모습도 사라졌습니다. 이와 같이 부자도 자기 행로 가운데에서[b] 시들 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뜨거운 바람과 함께’. 그리스어 καύσων은 타는 듯한 열기를 뜻하며, 문맥에 따라 그와 관련된 뜨거운 바람을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기의 활동(또는 추구) 가운데에서’. 그리스어 πορείαις는 문자적으로 ‘여행들, 길들’을 뜻할 수 있으며, 더 넓게는 삶의 과정이나 활동을 가리킬 수도 있습니다.
    reason: lexical_alternative
