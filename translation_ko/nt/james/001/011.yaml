  source_fidelity: 개정이 필요합니다. 초안은 전반적인 식물 비유와 부자의 쇠함이라는 의미를 전달하지만, 그리스어의 완료된 예시 서술(해가 떠올라 풀을 말리고, 꽃이 떨어지고, 아름다움이 사라짐)을 현재형으로 처리하여 시제와 논리적 진행이 다소 흐려졌습니다. 또한 πορείαις는 문자적으로도 비유적으로도 열려 있는 표현이므로 ‘가는 길’보다 ‘행로’로 옮기고 각주로 대안을 밝혀 두는 편이 충실합니다.
  naturalness: ‘그 모양의 아름다움’은 현대 표준 한국어에서 어색합니다. ‘그 아름다운 모습도 사라졌습니다’가 εὐπρέπεια τοῦ προσώπου의 외적 아름다움이라는 이미지를 자연스럽게 전달합니다. ‘자기 행로 가운데에서’는 합쇼체 문맥에서 자연스럽고, 문맥상 활동·삶의 과정이라는 확장 의미도 유지합니다.
  terminology: ‘뜨거운 열기’는 καύσων의 기본 의미를 잘 전달합니다. 다만 이 말은 뜨거운 바람을 가리킬 수도 있으므로 각주로 보완합니다. ‘부자’는 대표적 단수인 ὁ πλούσιος에 적절하며, ‘시들 것입니다’는 μαρανθήσεται의 식물 비유를 보존합니다.
  issues:
