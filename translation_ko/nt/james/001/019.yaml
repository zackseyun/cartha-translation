review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the threefold exhortation and treats πᾶς ἄνθρωπος naturally as a generic expression. However, '듣기는 속히 하고' can suggest hearing something quickly rather than being readily disposed to listen, and '노하다' is not the most natural modern Korean expression in this context. The opening Ἴστε is formally ambiguous between imperative and indicative; the imperative rendering is defensible, but the ambiguity should be retained in a note.
  naturalness: The formal-polite register is generally maintained. Revising to '듣는 데에는 빨리 하고' and '화내기는 더디 하십시오' gives more idiomatic modern Korean while preserving the concise parallelism of the Greek.
  terminology: '''사랑하는 형제 여러분'' appropriately renders ἀδελφοί μου ἀγαπητοί in Korean church register. ''사람마다'' preserves the generic singular force of πᾶς ἄνθρωπος without introducing an unwarranted gender distinction. ''화내다'' is a natural modern equivalent of ὀργή in this exhortative context.'
  issues:
  - severity: medium
    issue: The opening verb Ἴστε is ambiguous between an imperative and an indicative, but the draft supplies only the imperative sense without a note.
    rationale: The SBLGNT form can be read either as '아십시오' or '알고 있습니다/알고 계십시오' in context. Since the ambiguity is recognized in the English audit trail, it should be preserved in a footnote.
  - severity: low
    issue: '''듣기는 속히 하고'' is less idiomatic and may be read as completing the act of hearing quickly.'
    rationale: ταχὺς εἰς τὸ ἀκοῦσαι describes readiness or promptness with respect to listening. '듣는 데에는 빨리 하고' communicates this more naturally.
  - severity: low
    issue: '''노하다'' is literary and less natural in modern formal Korean.'
    rationale: '''화내다'' is the standard modern expression and retains the sense of being slow to anger.'
  revised_text: 나의 사랑하는 형제 여러분, 이것을 아십시오[a]. 사람마다 듣는 데에는 빨리 하고, 말하기는 더디 하며, 화내기도 더디 하십시오.
  revised_footnotes:
