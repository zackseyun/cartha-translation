    issue: ‘본래 영역’ 및 ‘마땅한 처소’의 해석적 보충
    rationale: ἑαυτῶν/ἴδιον은 우선 ‘자기들의/자신들의’를 뜻합니다. ‘본래’와 ‘마땅한’은 가능한 문맥적 이해이지만, 그 평가적·시간적 함의를 본문에 확정적으로 넣습니다.
  - severity: medium
    issue: τηρέω의 반복·대조가 약화됨
    rationale: 천사들이 ‘지키지’ 않았고 하나님께서 그들을 ‘지켜 두셨다’는 의도적인 동사 반복이 있습니다. ‘가두어 두셨습니다’도 의미상 가능하지만 ‘지켜 두셨습니다’가 이 대비를 더 잘 보존합니다.
  - severity: low
    issue: ‘흑암 아래’에 조사 누락
    rationale: 현대 한국어 문장에서는 ‘흑암 아래에’가 더 자연스럽습니다.
  revised_text: 또한 그분께서는 자기들의 영역을 지키지 않고 자기들의 거처를 버린 천사들을, 큰 날의 심판을 위하여 영원한 사슬로 묶어 흑암 아래에 지켜 두셨습니다.
