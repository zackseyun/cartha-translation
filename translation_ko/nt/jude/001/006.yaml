id: JUD.1.6
reference: Jude 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain, but abandoned their proper dwelling, he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: ko
  text: 또한 그분께서는, 자기의 본래 영역을 지키지 아니하고 자기의 마땅한 처소를 버린 천사들을 큰 날의 심판을 위하여 영원한 결박으로 흑암 아래 가두어 두셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχήν
  english_pob_choice: who did not keep their own domain
  chosen_korean: 자기의 본래 영역을 지키지 아니하고
  alternatives_korean:
  - 자기의 본래 위치를 지키지 않고
  - 자기의 본분을 지키지 않고
  - 자기의 권세를 지키지 않고
  lexicon: BDAG
  rationale: ἀρχή는 본 절에서 「시작·근원·통치 영역」을 함의 — 천사들에게 본래 주어진 신적 질서 내 위치/권세 영역. 「본래 영역」이 위치적·기능적 의미를 함께 담는다. 마지막 동사 τηρέω(지키다)는 종결부의 τετήρηκεν(가두어 두다)과 의도적 대조 — 「지키지 않은 자들을 (다른 방식으로) 지키신다(=가두신다)」.
- source_word: ἀπολιπόντας τὸ ἴδιον οἰκητήριον
  english_pob_choice: abandoned their proper dwelling
  chosen_korean: 자기의 마땅한 처소를 버린
  alternatives_korean:
  - 자기 고유의 거처를 버린
  - 자기의 거주처를 떠난
  lexicon: BDAG
  rationale: ἴδιον의 「고유한·마땅한」 함의를 「마땅한」으로 옮겨 신적 질서에서 천사에게 정해진 자리의 적합성을 강조한다. οἰκητήριον은 「거주처·처소」.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  english_pob_choice: for the judgment of the great day
  chosen_korean: 큰 날의 심판을 위하여
  alternatives_korean:
  - 큰 날 심판을 위해
  - 대 심판의 날을 위하여
  lexicon: BDAG
  rationale: 종말론적 「그 큰 날」 정형 표현. 정관사 없는 「큰 날의」도 그 종말론적 함의를 유지한다.
- source_word: δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν
  english_pob_choice: kept in eternal chains under gloom
  chosen_korean: 영원한 결박으로 흑암 아래 가두어 두셨습니다
  alternatives_korean:
  - 영원한 쇠사슬로 흑암 아래 묶어 두셨습니다
  - 영원한 사슬로 음침함 아래 보존하셨습니다
  lexicon: BDAG
  rationale: ἀΐδιος(영원한 — ἀίδιος는 ἀεί「항상」 어원, αἰώνιος와 다른 절대적 영원), δεσμός(결박·쇠사슬), ζόφος(짙은 흑암·음부의 어둠)의 우주적·종말론적 무게를 「영원한 결박으로 흑암 아래 가두어 두다」로 살린다. 완료 τετήρηκεν은 「현재까지도 가두어 두신 상태」 — 위 τηρήσαντας와의 의도적 대비.
theological_decisions:
- issue: 타락한 천사들의 우주적 반역 — 창세기 6:1-4 전통 및 1 에녹서 6-19장 배경
  chosen_reading: 자기의 본래 영역을 지키지 아니하고 자기의 마땅한 처소를 버린 천사들 ... 영원한 결박으로 흑암 아래 가두어 두셨습니다
  alternative_readings:
  - 권위·지위를 지키지 않은 천사들 (해석적 풀이)
  - 본래의 시작을 지키지 않은 천사들 (어원적 직역)
  rationale: 본 절은 1 에녹서 6-19장(감찰자 천사들 Watchers의 타락 — 인간 여자들과 결합하여 본래의 천적 영역을 떠남)을 배경으로 한다. 「본래 영역을 지키지 아니하고 마땅한 처소를 버림」 어휘는 우주적 반역 이미지를 보존하기 위해 의역하지 않고 직역에 가깝게 옮긴다. 흑암(ζόφος)과 영원한 결박(δεσμοῖς ἀϊδίοις)은 1 에녹의 음부 감금 모티프(에녹 10:4-6, 21:6 평행)와 직접 연결된다. 본 번역은 이 우주적·종말론적 무게를 약화시키지 않는다.
  doctrine_reference: 유다 6 ↔ 1 에녹서 6-19장 (감찰자 천사 전승); 베드로후서 2:4 평행; DOCTRINE.md §5 — preserve the source's strongest plain meaning, including intertestamental cosmology
