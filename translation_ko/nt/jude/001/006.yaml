  source_fidelity: 수정이 필요합니다. 초안의 ‘본래’와 ‘마땅한’은 각각 ἑαυτῶν과 ἴδιον이 직접 말하지 않는 ‘원래/정해진’ 의미를 보태며, ἀρχή의 논쟁적인 의미 범위를 본문에서 다소 좁힙니다. 또한 τετήρηκεν과 앞선 τηρήσαντας의 반복·대조는 ‘지켜 두셨습니다’로 보존하는 편이 좋습니다.
  naturalness: ‘자기들의 영역’과 ‘자기들의 거처’가 현대 표준어에서 자연스럽고, ‘영원한 사슬로 묶어 흑암 아래에 지켜 두셨습니다’는 결박·장소·완료 상태를 분명하면서도 자연스럽게 표현합니다.
  terminology: ‘천사들’, ‘심판’, ‘영원한 사슬’, ‘흑암’은 본문의 종말론적 어조에 맞습니다. ἀρχή는 ‘영역’으로 옮기되, ‘지위’와 ‘권세’의 가능성은 각주로 남겨 해석을 강제하지 않습니다. οἰκητήριον은 ‘거처’로 옮겨 ‘마땅한’이라는 해석적 보충을 피합니다.
  issues:
