  naturalness: 「사랑하는 자들이여」는 문법적으로 가능하지만 현대 표준 한국어 합쇼체 성경 문맥에서는 「사랑하는 여러분은」이 더 자연스럽고, 원문의 호격과 강조된 독자를 함께 잘 살립니다. 문장 전체도 이 구성이 더 매끄럽습니다.
