  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you, beloved, remember the words spoken beforehand by the apostles of our Lord Jesus Messiah.
translation:
  language: ko
  text: 그러나 사랑하는 여러분은, 우리 주 예수 메시아의 사도들이 미리 말한 말씀들을 기억하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς δέ, ἀγαπητοί
  english_pob_choice: But you, beloved
  chosen_korean: 그러나 사랑하는 자들이여
  alternatives_korean:
  - 그러나 사랑받는 자들이여
  lexicon: BDAG
  rationale: 강조 대명사 Ὑμεῖς와 호격 ἀγαπητοί로 거짓 교사들(16절 「이 자들」)과 신실한 독자들의 대조를 명확히 한다. 합쇼체 호격 「~자들이여」.
- source_word: μνήσθητε τῶν ῥημάτων τῶν προειρημένων
  english_pob_choice: remember the words spoken beforehand
  chosen_korean: 미리 말한 그 말씀들을 기억하십시오
  alternatives_korean:
  - 이미 말씀하셨던 말들을 기억하십시오
  - 미리 일러주신 그 말씀들을 기억하십시오
  lexicon: BDAG
  rationale: ῥῆμα(「말씀·말」)와 προειρημένων(완료수동분사 「미리 말해진」)을 「미리 말한 그 말씀들」로 옮긴다. 부정과거 명령 μνήσθητε는 단호한 명령 「기억하십시오」.
- source_word: τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  english_pob_choice: the apostles of our Lord Jesus Messiah
  chosen_korean: 우리 주 예수 메시아의 사도들
  alternatives_korean:
  - 우리 주 예수 그리스도의 사도들
  - 우리의 주이신 예수 메시아의 사도들
  lexicon: BDAG
  rationale: Χριστός를 칭호 「메시아」로 옮긴다. 정관사 + 속격 정형 「~의 사도들」.
