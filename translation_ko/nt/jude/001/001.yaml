id: JUD.1.1
reference: Jude 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude, a slave of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah, called:'
translation:
  language: ko
  text: '예수 메시아[a]의 노예[b]이자 야고보의 형제인 유다는, 아버지 하나님 안에서 사랑받고 예수 메시아를 위하여 지키심을 받은 부르심 입은 자들에게 편지합니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「예수 그리스도」. Χριστός를 칭호로 옮기는 본 번역의 원칙에 따라 「메시아」로 옮긴다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「종」. 헬라어 δοῦλος는 단순한 봉사자가 아니라 주인에게 매인 자를 가리킨다. 빌립보서 1:1과 같이 유다서 1:1의 자기 소개도 매임(bonded status)의 신학적 무게를 의도적으로 드러내므로 「노예」로 옮긴다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας
  english_pob_choice: Jude
  chosen_korean: 유다
  alternatives_korean:
  - 유다스
  lexicon: BDAG
  rationale: 한국 교회의 정착 표기 「유다」를 따른다. 가룟 유다(Ἰούδας Ἰσκαριώτης)와의 혼동을 막기 위해 본문 흐름에서 야고보의 형제임을 명시한다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  lexicon: BDAG
  rationale: DOCTRINE.md §1에 따라 δοῦλος의 매임(bonded status)을 강하게 드러내는 「노예」를 채택. 빌립보서 1:1과 일관성 유지. 「종」은 봉사 기능만 시사하여 매임의 무게를 약화시킨다.
- source_word: Ἰακώβου
  english_pob_choice: James
  chosen_korean: 야고보
  alternatives_korean:
  - 야곱
  lexicon: BDAG
  rationale: 한국 교회의 정착 표기 「야고보」. 본 야고보는 예수의 형제이자 예루살렘 교회 지도자(갈 1:19).
- source_word: τοῖς ἐν θεῷ πατρὶ ἠγαπημένοις
  english_pob_choice: to those who are loved in God the Father
  chosen_korean: 아버지 하나님 안에서 사랑받고
  alternatives_korean:
  - 아버지 하나님 안에서 사랑함을 입은
  - 하나님 아버지 안에서 사랑받은
  lexicon: BDAG
  rationale: 완료수동분사 ἠγαπημένοις의 「과거에 사랑받아 지금도 그 사랑 안에 있는」 결과상태를 「사랑받고」로 자연스럽게 옮긴다. ἐν θεῷ πατρί의 처소격을 「안에서」로 보존.
- source_word: Ἰησοῦ Χριστῷ τετηρημένοις
  english_pob_choice: kept for Jesus the Messiah
  chosen_korean: 예수 메시아를 위하여 지키심을 받은
  alternatives_korean:
  - 예수 메시아를 위해 지켜진
  - 예수 메시아께 보전된
  lexicon: BDAG
  rationale: 'τηρέω의 핵심 어휘(보존·지킴)와 여격의 목적·이익 함의를 살린다. 여격 Ἰησοῦ Χριστῷ는 「~를 위하여」(목적)로 옮겨 24절의 종말론적 보존 신학과 연결한다. 완료수동분사는 「지키심을 받은」 신적 수동.'
- source_word: κλητοῖς
  english_pob_choice: called
  chosen_korean: 부르심 입은 자들
  alternatives_korean:
  - 부르심을 받은 자들
  - 부름받은 자들
  lexicon: BDAG
  rationale: κλητός는 바울·유다 인사 정형 어휘. 「부르심 입은 자들」이 신적 부름의 수동성과 정체성을 함께 살린다.
