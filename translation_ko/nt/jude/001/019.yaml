lexical_decisions:
- source_word: οἱ ἀποδιορίζοντες
  english_pob_choice: the ones who cause divisions
  chosen_korean: 분열을 일으키는 자들
  alternatives_korean:
  - 갈라놓는 자들
  - 가르는 자들
  lexicon: BDAG
  rationale: ἀποδιορίζω(ἀπό「에서·로부터」 + δια「~을 가로질러」 + ὁρίζω「경계 짓다」)는 「갈라 떼어놓다·분리하다」 — NT 단 1회. 「분열을 일으키다」가 공동체적 함의를 살린다.
- source_word: ψυχικοί
  english_pob_choice: worldly people
  chosen_korean: 영혼적 차원에 머무는 자들
  alternatives_korean:
  - 혼에 속한 자들
  - 자연적인 사람들
  - 세속적인 자들
  lexicon: BDAG
  rationale: ψυχικός(「영혼(ψυχή)에 속한」)는 πνευματικός(「영(πνεῦμα)에 속한」)와 대조되며 자연적·세속적 차원에 머무는 인간을 가리킴(고전 2:14 평행). 단순 「세속적」이나 「자연적」으로 옮기면 직접 대조하는 πνεῦμα(영) 어휘와의 짝이 흐려지므로, 「영혼적 차원에 머무는」으로 옮겨 그리스어 인간학의 三분(영·혼·육) 구조를 살린다.
- source_word: πνεῦμα μὴ ἔχοντες
  english_pob_choice: not having the Spirit
  chosen_korean: 영을 가지지 못한 자들
  alternatives_korean:
  - 성령을 갖지 못한 자들
  - 영(靈)이 없는 자들
  lexicon: BDAG
  rationale: πνεῦμα(영) — 본 문맥에서 「하나님의 영·성령」(20절의 「성령으로 기도하라」와 직접 연결)이지만 무관사이므로 일반적 「영」으로 옮기고 20절에서 「성령」으로 명시한다. 「가지지 못한」이 결여를 강조.
