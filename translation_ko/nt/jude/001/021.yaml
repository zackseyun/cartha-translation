  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God, waiting for the mercy of our Lord Jesus Messiah unto eternal life.
translation:
  language: ko
  text: 하나님의 사랑[a] 안에서 여러분 자신을 지키고, 영원한 생명에 이르도록[c] 우리 주 예수 메시아[b]의 자비를 기다리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 향한 사랑.’ 그리스어는 ‘하나님께서 베푸시는 사랑’으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 ‘예수 그리스도’; Χριστός의 칭호 의미를 살려 ‘메시아’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영원한 생명을 위하여’ 또는 ‘영원한 생명에 이르기까지.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε
  english_pob_choice: keep yourselves in the love of God
  chosen_korean: 자신을 하나님의 사랑 안에 지키십시오
  alternatives_korean:
  - 자기들을 하나님의 사랑 가운데 지키십시오
  - 하나님의 사랑 안에서 자신을 보존하십시오
  lexicon: BDAG
  rationale: τηρέω(「지키다·보존하다」)는 1절의 「예수 메시아를 위하여 지키심을 받은」, 6절의 「가두어 두셨다」와 의도적 어휘 연결. 1절의 신적 지키심 ↔ 21절의 인간의 능동적 자기 지킴이 짝을 이룬다.
- source_word: προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  english_pob_choice: waiting for the mercy of our Lord Jesus Messiah
  chosen_korean: 우리 주 예수 메시아의 자비를 기다리며
  alternatives_korean:
  - 우리 주 예수 그리스도의 자비를 기대하며
  - 우리 주 예수 메시아의 긍휼을 바라며
  lexicon: BDAG
  rationale: προσδέχομαι(「기다리다·고대하다」)의 종말론적 함의(눅 2:25 시므온의 「이스라엘의 위로를 기다리다」 평행). ἔλεος를 일관되게 「자비」로 옮긴다(2절과 일치).
- source_word: εἰς ζωὴν αἰώνιον
  english_pob_choice: unto eternal life
  chosen_korean: 영원한 생명에 이르도록
  alternatives_korean:
  - 영생에 이르기까지
  - 영원한 생명을 위하여
  lexicon: BDAG
  rationale: εἰς의 목적·도달 함의를 「~에 이르도록」으로 살린다. ζωὴ αἰώνιος는 요한 문헌의 정형 「영원한 생명」.
