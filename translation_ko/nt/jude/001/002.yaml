- source_word: ἔλεος καὶ εἰρήνη καὶ ἀγάπη
  english_pob_choice: mercy and peace and love
  chosen_korean: 자비와 평강과 사랑
  alternatives_korean:
  - 긍휼과 평강과 사랑
  - 자비와 평화와 사랑
  lexicon: BDAG
  rationale: 글로사리에 따라 ἔλεος는 「자비」, ἀγάπη는 「사랑」, εἰρήνη는 「평강」으로 옮긴다. 유다서의 인사 정식은 일반적인 「은혜·평강」 대신 「자비·평강·사랑」 삼중 구조 — 종말론적 자비를 강조하는 유다서의 주제와 연결된다.
- source_word: πληθυνθείη
  english_pob_choice: be multiplied
  chosen_korean: 더욱 풍성하기를 바랍니다
  alternatives_korean:
  - 충만하기를 바랍니다
  - 더해지기를 바랍니다
  lexicon: BDAG
  rationale: 부정과거 수동 기원법 πληθυνθείη(「풍성해지기를」)의 축복 기원을 한국어 「~기를 바랍니다」로 자연스럽게 옮긴다. 베드로전후서 인사와 동일한 어휘.
