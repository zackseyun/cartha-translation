id: JUD.1.4
reference: Jude 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed, who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord, Jesus Messiah.
translation:
  language: ko
  text: 어떤 사람들이 몰래 숨어들어 왔기 때문입니다. 그들은 오래전부터 이 심판에 처할 자로 기록된 자들, 곧 경건치 않은 자들이니, 우리 하나님의 은혜를 방종으로 바꾸어 버리고, 우리의 유일한 주인이시며 주이신 예수 메시아를 부인하는 자들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεισέδυσαν
  english_pob_choice: have slipped in unnoticed
  chosen_korean: 몰래 숨어들어 왔기
  alternatives_korean:
  - 은밀히 들어왔기
  - 가만히 침투해 들어왔기
  lexicon: BDAG
  rationale: παρεισδύω(παρά「곁에」 + εἰς「안으로」 + δύω「잠겨 들다」)는 「몰래·은밀히 곁에서 잠입하다」. 합쇼체에서 「몰래 숨어들어 왔다」가 본문의 은밀한 침입 함의를 살린다.
- source_word: οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  english_pob_choice: who long ago were designated for this judgment
  chosen_korean: 오래전부터 이 심판에 처할 자로 기록된
  alternatives_korean:
  - 오래전부터 이 심판에 정해진
  - 옛적부터 이 심판을 위해 미리 기록된
  lexicon: BDAG
  rationale: 'προγράφω의 완료수동분사는 「미리 기록된·미리 지정된」. 14-15절의 에녹 예언과 연결되는 종말론적 「기록」 함의를 「기록된」으로 살린다.'
- source_word: ἀσεβεῖς
  english_pob_choice: ungodly
  chosen_korean: 경건치 않은 자들
  alternatives_korean:
  - 불경건한 자들
  - 경건치 못한 자들
  lexicon: BDAG
  rationale: 유다서의 핵심 키워드 ἀσέβεια/ἀσεβής(15절에 4회 반복) — 「하나님께 마땅한 경외를 보이지 않는」 상태. 「경건치 않은」이 한국 교회 정착 어휘.
- source_word: τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν
  english_pob_choice: turn the grace of our God into sensuality
  chosen_korean: 우리 하나님의 은혜를 방종으로 바꾸어 버리고
  alternatives_korean:
  - 우리 하나님의 은혜를 호색으로 바꾸어 버리고
  - 우리 하나님의 은혜를 음란함으로 변질시키고
  lexicon: BDAG
  rationale: 'ἀσέλγεια는 「제약 없는 방탕·도덕적 무절제·성적 방종」. 「방종」이 도덕적 자기제어 결여의 일반적 함의를 담으면서 7절 음행과 연결된다.'
- source_word: τὸν μόνον δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστόν
  english_pob_choice: our only Master and Lord, Jesus Messiah
  chosen_korean: 우리의 유일한 주인이시며 주이신 예수 메시아
  alternatives_korean:
  - 우리의 유일한 통치자이시며 주이신 예수 메시아
  - 우리의 유일한 주재이시며 주이신 예수 메시아
  lexicon: BDAG
  rationale: 'δεσπότης(「가장(家長)·절대 주인」)와 κύριος(「주」)의 구별을 살려 「주인」과 「주」로 옮긴다. δεσπότης는 절대적·가족적 소유권을, κύριος는 영적·종교적 주권을 함의한다.'
