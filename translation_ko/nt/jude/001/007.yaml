  verdict: revise
  source_fidelity: 현 번역은 τούτοις의 지시 대상을 ‘그 천사들’로 확정하여, 원문의 논쟁적·모호한 지시를 해석으로 좁혔습니다. 또한 ‘소돔과 고모라…성읍들’이라는 한 문장의 주어를 ‘마찬가지입니다. 이들도’로 분리한 것은 원문의 비교 및 분사 구조를 충분히 반영하지 못합니다.
  naturalness: ‘마찬가지입니다. 이들도’는 문맥상 어색하고, ‘본보기로 세워졌습니다’는 완료된 사건으로 한정하는 인상을 줍니다. ‘본보기로 제시되어 있습니다’와 현재 분사에 상응하는 ‘받으면서’가 자연스럽고 원문에 가깝습니다.
  terminology: ‘소돔과 고모라’, ‘음행’, ‘다른 육체’, ‘영원한 불의 형벌’은 적절합니다. 다만 ‘음행을 자행하고’는 ἐκπορνεύσασαι를 다소 과도하게 강화할 수 있으므로 ‘음행을 저지르고’가 절제된 현대 한국어 표현입니다.
  issues:
