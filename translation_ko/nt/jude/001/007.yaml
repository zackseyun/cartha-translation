    issue: τούτοις를 ‘그 천사들’로 명시함
    rationale: 이 대명사의 선행사는 천사들로 보는 견해를 포함하여 논쟁적입니다. 본문은 비교를 표시하지만 대상을 명시하지 않으므로, 번역도 이를 확정하지 않아야 합니다.
  - severity: medium
    issue: 문장 구조를 ‘마찬가지입니다. 이들도’로 분리함
