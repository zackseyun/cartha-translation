- from: 소돔과 고모라와 그 주변의 성읍들도 마찬가지입니다. 이들도 그 천사들과 같은 방식으로 음행을 자행하고 다른 육체를 좇아갔으므로, 영원한 불의 형벌을 받아 본보기로 세워졌습니다.
  to: 소돔과 고모라와 그 주변의 성읍들은 그들과 같은 방식으로[a] 음행을 저지르고 다른 육체를[b] 좇아갔으며, 영원한 불의 형벌을 받으면서 본보기로 제시되어 있습니다.
