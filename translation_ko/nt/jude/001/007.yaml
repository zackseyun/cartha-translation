id: JUD.1.7
reference: Jude 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them, having in like manner committed sexual immorality and gone after other flesh, are set forth as an example, undergoing the punishment of eternal fire.
translation:
  language: ko
  text: 소돔과 고모라와 그 주변의 성읍들도 마찬가지입니다. 이들도 그 천사들과 같은 방식으로 음행을 자행하고 다른 육체를 좇아갔으므로, 영원한 불의 형벌을 받아 본보기로 세워졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σόδομα καὶ Γόμορρα
  english_pob_choice: Sodom and Gomorrah
  chosen_korean: 소돔과 고모라
  alternatives_korean: []
  lexicon: BDAG
  rationale: 한국 교회 정착 표기.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  english_pob_choice: in like manner
  chosen_korean: 그 천사들과 같은 방식으로
  alternatives_korean:
  - 그들과 같은 방식으로
  - 이들과 같은 모양으로
  lexicon: BDAG
  rationale: 'τούτοις의 지시 대상은 6절의 타락한 천사들 — 본문 흐름의 연속성을 살리기 위해 「그 천사들과」를 명시한다. 소돔의 죄와 천사들의 죄가 「자기 영역/육체를 벗어남」이라는 동일 패턴을 공유한다는 유다의 신학적 비교를 명확히 한다.'
- source_word: ἐκπορνεύσασαι
  english_pob_choice: having committed sexual immorality
  chosen_korean: 음행을 자행하고
  alternatives_korean:
  - 음란을 행하고
  - 음행에 빠져
  lexicon: BDAG
  rationale: ἐκ- 강조 접두사 + πορνεύω의 「철저히·극단적으로 음행하다」 의미. 「자행하다」가 자발적·극단적 함의를 살린다. 「방종」(4절)·「방탕」(영문 sensuality)으로 부드럽게 옮기지 않는다 — 북극성 원칙에 따라 본문의 강한 의미를 보존.
- source_word: ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας
  english_pob_choice: gone after other flesh
  chosen_korean: 다른 육체를 좇아갔으므로
  alternatives_korean:
  - 다른 종류의 육체를 따라갔으므로
  - 이상한 육체를 좇아갔으므로
  lexicon: BDAG
  rationale: 'σαρκὸς ἑτέρας(「다른 육체」)의 기이함을 그대로 보존 — 풀어 해석하지 않는다. 본 어구는 창세기 19장의 인간/천사 경계를 넘는 시도(소돔 사람들이 롯의 천사 손님들을 향함)와 6절의 천사/인간 경계를 넘는 결합(창 6:1-4 전승) 양쪽을 함의하는 모호한 표현으로, 의도적 모호함을 살린다. ἕτερος(「다른 종류의」)는 ἄλλος(「같은 종류의 다른」)와 구별되어 「본질적으로 다른 종류」를 함의.'
- source_word: πρόκεινται δεῖγμα
  english_pob_choice: are set forth as an example
  chosen_korean: 본보기로 세워졌습니다
  alternatives_korean:
  - 본보기로 진열되어 있습니다
  - 모범 사례로 제시되었습니다
  lexicon: BDAG
  rationale: πρόκειμαι(「앞에 놓여 있다·전시되다」) + δεῖγμα(「표본·본보기」). 「본보기로 세워지다」가 경고용 전시의 함의를 자연스럽게 담는다.
- source_word: πυρὸς αἰωνίου δίκην ὑπέχουσαι
  english_pob_choice: undergoing the punishment of eternal fire
  chosen_korean: 영원한 불의 형벌을 받아
  alternatives_korean:
  - 영원한 불의 심판을 받으면서
  - 영원한 불의 정죄를 받으며
  lexicon: BDAG
  rationale: δίκη(법적 형벌·정죄) + ὑπέχω(「감수하다·견디다」) + αἰώνιος(영원한). 「영원한 불의 형벌을 받다」가 한국 교회에 정착된 종말 어휘.
theological_decisions:
- issue: '「다른 육체(σαρκὸς ἑτέρας)」 — 의도적 모호함의 보존'
  chosen_reading: 다른 육체를 좇아갔으므로
  alternative_readings:
  - 이상한 육체를 좇아갔으므로
  - (동성애적 음행만으로 한정한 해석) 비자연적 욕망을 좇아갔으므로
  rationale: 'σαρκὸς ἑτέρας의 「다름」은 본문 자체가 의도적으로 기이하고 모호하다. 한국 전통 번역의 「다른 색을 따라」(개역) 또는 동성애로만 한정하는 해석은 본문의 우주적 경계 위반(천사 ↔ 인간) 함의를 가린다. 본 번역은 어색하더라도 「다른 육체」를 그대로 두어 6절의 천사 반역과의 평행(「자기 영역을 벗어남」)을 살린다.'
  doctrine_reference: 'DOCTRINE.md §5 — preserve odd/strong source language rather than domesticating to one interpretation'
