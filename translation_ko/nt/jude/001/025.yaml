id: JUD.1.25
reference: Jude 1:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior, through Jesus Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever. Amen.
translation:
  language: ko
  text: 우리의 구주이신 오직 한 분 하나님께, 우리 주이신 예수 메시아를 통하여[a], 영광과 위엄과 권능과 권세가 모든 시대 이전에도, 지금도, 모든 시대에 이르기까지 있기를 빕니다[b]. 아멘.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 「우리 주이신 예수 메시아를 통하여」가 없습니다. 또는 「예수 그리스도」.
    reason: textual_variant; alternative_reading
  - marker: b
    text: 직역하면 「모든 시대 전에도 … 모든 시대들을 향하여」입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ σωτῆρι ἡμῶν
  english_pob_choice: the only God our Savior
  chosen_korean: 우리의 구주이신 유일한 하나님께
  alternatives_korean:
  - 우리 구주 한 분 하나님께
  - 오직 한 분이신 하나님 우리 구주께
  lexicon: BDAG
  rationale: 4절의 「유일한 주인(μόνον δεσπότην)」과 봉합(inclusio) — 거짓 교사들이 부인한 「유일한 주인」이 송영에서 「유일한 하나님 우리 구주」로 다시 송축된다. σωτήρ를 「구주」로 옮긴다(한국 교회 정착 어휘).
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  english_pob_choice: through Jesus Messiah our Lord
  chosen_korean: 우리 주 예수 메시아를 통하여
  alternatives_korean:
  - 우리 주 예수 그리스도로 말미암아
  - 우리 주이신 예수 메시아를 통하여
  lexicon: BDAG
  rationale: διά + 속격의 「~을 통하여」(매개) 함의를 살린다. 메시아의 중보적 역할을 명시 — 송영이 메시아를 통해 하나님께 향한다.
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  english_pob_choice: glory, majesty, dominion, and authority
  chosen_korean: 영광과 위엄과 권능과 권세
  alternatives_korean:
  - 영광과 위대하심과 능력과 권세
  - 영광, 위엄, 통치, 권위
  lexicon: BDAG
  rationale: 네 명사의 송영 어휘 — δόξα(영광), μεγαλωσύνη(위엄·장엄함), κράτος(권능·강한 힘), ἐξουσία(권세·권위). 한국 교회 정착 어휘로 「영광·위엄·권능·권세」를 사용하되 네 어휘의 구별을 보존한다.
- source_word: πρὸ παντὸς τοῦ αἰῶνος καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  english_pob_choice: before all time and now and forever
  chosen_korean: 모든 시대 이전에도, 지금도, 모든 시대에 이르기까지
  alternatives_korean:
  - 만세 전과 이제와 영원토록
  - 모든 시대 이전과 지금과 모든 시대에 이르기까지
  lexicon: BDAG
  rationale: 세 시제의 송영 정형 — πρὸ παντὸς τοῦ αἰῶνος(과거·창세 전), νῦν(현재), εἰς πάντας τοὺς αἰῶνας(미래·끝없는 시대). 「모든 시대 이전에도, 지금도, 모든 시대에 이르기까지」가 그 세 시제 구분을 명확히 살린다.
- source_word: ἀμήν
  english_pob_choice: Amen
  chosen_korean: 아멘
  alternatives_korean: []
  lexicon: BDAG
  rationale: 히브리어 אָמֵן의 음역. 한국 교회 정착 표기 「아멘」.
