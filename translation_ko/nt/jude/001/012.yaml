id: JUD.1.12
reference: Jude 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts, feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead, uprooted.
translation:
  language: ko
  text: 이 자들은 여러분의 애찬에서 함께 먹는 암초입니다 — 두려움도 없이 자기 자신만을 먹이는 자들이며, 바람에 휘날리는 물 없는 구름이며, 가을철에 열매 없는 나무 — 두 번 죽고 뿌리째 뽑힌 나무입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες
  english_pob_choice: hidden reefs at your love feasts
  chosen_korean: 여러분의 애찬에서 함께 먹는 암초
  alternatives_korean:
  - 여러분의 사랑의 만찬에 있는 숨은 암초
  - 여러분의 애찬의 위험한 바위
  lexicon: BDAG
  rationale: 'σπιλάς는 「물에 잠긴 위험한 암초」 — 배를 난파시키는 보이지 않는 바위. ἀγάπαι(「사랑들」의 복수)는 초기 기독교의 공동체 식사 의식 「애찬」 — 한국 교회 정착 용어. 어떤 사본은 σπίλοι(「오점·얼룩」)로 읽지만, SBLGNT의 σπιλάδες를 따른다.'
- source_word: ἀφόβως ἑαυτοὺς ποιμαίνοντες
  english_pob_choice: feasting together without fear, shepherding themselves
  chosen_korean: 두려움도 없이 자기 자신만을 먹이는 자들
  alternatives_korean:
  - 두려움 없이 자기들만을 돌보는 자들
  - 거리낌 없이 자기 자신만을 양육하는 자들
  lexicon: BDAG
  rationale: 'ποιμαίνω(「목양하다·양 떼를 먹이다」)를 자기 자신에게 적용 — 양 떼를 먹여야 할 목자가 자기만 먹이는 거짓 목자 비유(겔 34장 평행). 「자기 자신만을 먹이는」이 직설적 비판을 살린다. συνευωχούμενοι(「함께 잔치하는」)는 위 「함께 먹는 암초」로 자연스럽게 흡수.'
- source_word: νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι
  english_pob_choice: waterless clouds carried along by winds
  chosen_korean: 바람에 휘날리는 물 없는 구름
  alternatives_korean:
  - 바람에 떠밀려 가는 물 없는 구름
  - 바람에 이리저리 날리는 물 없는 구름
  lexicon: BDAG
  rationale: 'ἄνυδρος(「물 없는」 — 잠 25:14의 「선물 약속만 하고 주지 않는 자는 비 없는 구름과 같다」 평행). παραφέρομαι(「곁으로 떠밀려 가다」)를 「휘날리다」로 옮겨 본문의 무정형·무능 이미지를 살린다.'
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα
  english_pob_choice: autumn trees without fruit, twice dead, uprooted
  chosen_korean: 가을철에 열매 없는 나무 — 두 번 죽고 뿌리째 뽑힌 나무
  alternatives_korean:
  - 늦가을의 열매 없는 나무, 두 번 죽고 뿌리뽑힌 것들
  - 가을철 결실 없는 나무 — 두 번 죽고 뿌리째 뽑혀
  lexicon: BDAG
  rationale: 'φθινοπωρινός(「늦가을의·결실기 막바지의」) — 열매가 있어야 할 시기에 열매가 없음을 강조. δὶς ἀποθανόντα(「두 번 죽은」 — 열매 없음이 1차 죽음, 뿌리뽑힘이 2차 죽음, 또는 영적/육적 이중 죽음). ἐκριζόω(「뿌리째 뽑다」 — 회복 불가능한 멸망).'
