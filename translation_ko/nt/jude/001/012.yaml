  source_fidelity: 초안은 συνευωχούμενοι(함께 잔치함)를 ‘함께 먹는 암초’에 결합하여, 암초가 먹는 것처럼 읽히게 합니다. 또한 ἀφόβως와 ἑαυτοὺς ποιμαίνοντες의 수식 관계가 불분명합니다. 이를 각각 사람들을 가리키는 분사구로 옮겨야 합니다. σπιλάδες의 ‘암초’ 이해와 물 없는 구름, 열매 없는 나무, ‘두 번 죽고 뿌리째 뽑힘’의 연쇄 비유는 유지할 수 있습니다.
  naturalness: ‘여러분의 애찬에서 함께 먹는 암초’는 현대 한국어에서 수식 구조가 부자연스럽고 의미상 오해를 낳습니다. ‘애찬에서 두려움 없이 함께 잔치하며’로 분리하면 자연스럽고 원문의 구문도 드러납니다. ‘자기들만 돌보며’는 자연스러운 한국어이면서 자기중심성을 전달하되, 목양 은유는 각주로 보완합니다.
  terminology: ‘애찬’은 이 문맥의 정착된 한국어 교회 용어로 적절합니다. σπιλάδες는 본문에서 ‘암초’로 옮기고, 전통적인 ‘흠/얼룩’ 해석은 각주에 보존합니다. ποιμαίνω의 목양 은유를 본문에서 과도하게 의역하지 않도록 ‘자기들만 돌보며’로 번역하고, 직역 및 ‘자기 자신을 먹이며’라는 가능한 이해를 각주로 제시합니다.
