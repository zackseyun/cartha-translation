  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: Now to the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing,
translation:
  language: ko
  text: 여러분을 넘어지지 않도록 능히 지키시고, 기쁨으로 흠 없이 그분의 영광 앞에 세우실 수 있는 분께
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῷ δυναμένῳ φυλάξαι ὑμᾶς ἀπταίστους
  english_pob_choice: to the one who is able to keep you from stumbling
  chosen_korean: 여러분을 넘어지지 않게 지키시고
  alternatives_korean:
  - 여러분이 실족하지 않도록 지키시고
  - 여러분을 거리낌 없게 지키시고
  lexicon: BDAG
  rationale: ἄπταιστος(「넘어지지 않는·실족하지 않는」 — NT 단 1회)는 신앙의 길에서 도덕적·영적으로 넘어지지 않음을 가리킴. 「넘어지지 않게 지키다」가 자연스럽고 직관적이다. φυλάξαι(부정과거 부정사「지키다」)는 1절·21절의 τηρέω와 동의어 — 신적 지킴의 정점.
- source_word: στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους
  english_pob_choice: to present you blameless before his glory
  chosen_korean: 흠 없이 그분의 영광 앞에 세우실
  alternatives_korean:
  - 그분의 영광 앞에 흠 없는 자로 세우실
  - 그분의 영광 앞에 점 없이 세우실
  lexicon: BDAG
  rationale: ἄμωμος(「흠 없는」)는 LXX 제사 어휘 — 흠 없는 제물(레 1:3 등). 종말론적 완성에서 신자가 흠 없는 제물로 하나님의 영광 앞에 서는 이미지(엡 1:4, 골 1:22 평행). κατενώπιον(「~앞에·면전에」 — 강한 처소격).
- source_word: ἐν ἀγαλλιάσει
  english_pob_choice: with rejoicing
  chosen_korean: 기쁨 가운데
  alternatives_korean:
  - 기쁨으로
  - 환희 가운데
  lexicon: BDAG
  rationale: ἀγαλλίασις는 「큰 기쁨·환희·환호」 — 단순한 χαρά보다 더 격렬한 표현적 기쁨. 「기쁨 가운데」로 옮겨 종말론적 영광의 환희를 살린다.
theological_decisions:
- issue: 24-25절 송영의 운율과 절정 보존 — 「넘어지지 않게 지키시고 ... 흠 없이 그분의 영광 앞에 세우실 수 있는 분께」
  chosen_reading: 여러분을 넘어지지 않게 지키시고, 기쁨 가운데 흠 없이 그분의 영광 앞에 세우실 수 있는 분께
  alternative_readings:
  - 영어 POB에 더 가까운 산문체 직역
  - 한국 전통 송영체(「우리를 능히 보호하사 거침없게 하시고...」)
  rationale: 본 24-25절은 유다서의 송영 클라이맥스 — 거짓 교사들의 종말론적 운명(5-19절)에 대한 정반대의 종말론적 안전 보장. 본 번역은 분사구의 운율(「지키시고 ... 세우실 수 있는 분께」)을 한국어 송영체로 살리되, 합쇼체 격식과 가독성을 유지한다. 「넘어지지 않게」는 인간적 직관성을 살리고, 「흠 없이 ... 영광 앞에 세우실」은 제사적·종말론적 무게를 보존한다.
  doctrine_reference: 24-25절 송영 — 1절(「예수 메시아를 위하여 지키심을 받은」)과의 본문 전체 봉합(inclusio); DOCTRINE.md §5 — preserve cadence and theological force of liturgical passages
