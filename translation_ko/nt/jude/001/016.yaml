  to: 이들은 불평하는 자들이며, 자기 처지를 탓하는 자들이고, 자기 욕망을 따라 살아갑니다. 그들의 입은 과장된 말을 하며, 이익을 얻기 위해 사람들의 비위를 맞춥니다.
