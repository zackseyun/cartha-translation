id: JUD.1.16
reference: Jude 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers, malcontents, walking according to their own desires, and their mouth speaks arrogant things, showing favoritism for the sake of gain.
translation:
  language: ko
  text: 이들은 불평하는 자들이며, 자기 처지를 탓하는 자들이고, 자기 욕망을 따라 살아갑니다. 그들의 입은 과장된 말을 하며, 이익을 얻기 위해 사람들의 비위를 맞춥니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γογγυσταί
  english_pob_choice: grumblers
  chosen_korean: 불평하는 자들
  alternatives_korean:
  - 원망하는 자들
  - 투덜대는 자들
  lexicon: BDAG
  rationale: γογγυστής는 광야 시기 이스라엘의 「불평·원망」(LXX 출 16:7, 민 11:1 등)을 가리키는 어휘 — 5절·11절의 광야 멸망 모티프와 연결. 「불평하는 자」가 정형 어휘.
- source_word: μεμψίμοιροι
  english_pob_choice: malcontents
  chosen_korean: 자기 처지를 늘 탓하는 자들
  alternatives_korean:
  - 운명을 불평하는 자들
  - 자기 몫을 탓하는 자들
  lexicon: BDAG
  rationale: μεμψίμοιρος(μέμφομαι「탓하다」 + μοῖρα「몫·운명」)는 「자기 몫·처지를 탓하는 자」 — NT 단 1회. 「자기 처지를 늘 탓하는」이 어원적 함의를 자연스럽게 풀어낸다.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  english_pob_choice: walking according to their own desires
  chosen_korean: 자기 정욕대로 살아가는 자들
  alternatives_korean:
  - 자기들의 욕망을 따라 걸어가는 자들
  - 자기 욕심대로 행하는 자들
  lexicon: BDAG
  rationale: ἐπιθυμία의 부정적 함의(욕심·정욕)를 「정욕」으로 살린다. 18절의 「자기 경건치 않은 정욕대로」와 일관성 유지.
- source_word: λαλεῖ ὑπέρογκα
  english_pob_choice: speaks arrogant things
  chosen_korean: 거만한 말을 내뱉으며
  alternatives_korean:
  - 거창한 말을 늘어놓으며
  - 부풀린 말을 합니다
  lexicon: BDAG
  rationale: ὑπέρογκα(「과대한·부풀린·거만한 것들」)는 자기 권위와 능력을 과장하는 허세 어휘. 「거만한 말」이 영적·도덕적 교만 함의를 살린다.
- source_word: θαυμάζοντες πρόσωπα ὠφελείας χάριν
  english_pob_choice: showing favoritism for the sake of gain
  chosen_korean: 자기 이익을 위하여 사람의 비위를 맞춥니다
  alternatives_korean:
  - 이익을 얻기 위해 외모를 따지는 자들입니다
  - 유익을 위해 사람의 얼굴을 우러르는 자들입니다
  lexicon: BDAG
  rationale: θαυμάζω πρόσωπον(「얼굴을 우러르다·외모를 따라 판단하다」 — 셈어 「얼굴 들기」 관용구). ὠφελείας χάριν(「이익을 위하여」). 「사람의 비위를 맞추다」가 외모·지위·이익에 따라 차별 대우하는 현대 한국어 정형 표현.
