review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal charges accurately. However, ‘늘’ adds an unexpressed habitual nuance to μεμψίμοιροι; ‘정욕’ can overrestrict ἐπιθυμίαι to sexual desire, whereas the Greek is broader; and ‘내뱉으며’ adds a force not present in λαλεῖ. The final clause is well understood contextually as self-interested favor/flattery.
  naturalness: The draft is generally natural formal Korean. A more parallel construction and neutral verbs better reflect the Greek while retaining modern 합쇼체.
  terminology: ‘불평하는 자들’ and ‘자기 처지를 탓하는 자들’ are appropriate. ‘자기 욕망’ preserves the broad, negative-in-context sense of ἐπιθυμίαι without unnecessarily specifying sexual lust. ‘과장된 말’ represents ὑπέρογκα’s inflated, boastful quality. ‘사람들의 비위를 맞춥니다’ naturally conveys seeking persons’ favor for gain in this context.
  issues:
  - severity: medium
    issue: ‘늘’ in ‘자기 처지를 늘 탓하는 자들’
    rationale: μεμψίμοιροι identifies those who complain about their lot; it does not explicitly state frequency. Removing ‘늘’ avoids adding meaning.
  - severity: medium
    issue: ‘정욕’ for ἐπιθυμίαι
    rationale: In this polemical context the desires are morally disordered, but ἐπιθυμίαι is not limited to sexual desire. ‘욕망’ retains the breadth of the source.
  - severity: low
    issue: ‘거만한 말을 내뱉으며’
    rationale: λαλεῖ simply means ‘speaks.’ ‘내뱉다’ can imply a harsh or impulsive manner not specified by the Greek. ‘과장된 말을 하며’ more directly renders ὑπέρογκα and λαλεῖ.
  revised_text: 이들은 불평하는 자들이며, 자기 처지를 탓하는 자들이고, 자기 욕망을 따라 살아갑니다. 그들의 입은 과장된 말을 하며, 이익을 얻기 위해 사람들의 비위를 맞춥니다.
  revised_footnotes: []
  revision_rationale: The revision removes unsupported intensification, preserves the broad semantic range of ἐπιθυμίαι, and renders the inflated character of ὑπέρογκα without adding a manner of speech. The final idiom is retained in a natural Korean expression that communicates self-serving favor or flattery.
