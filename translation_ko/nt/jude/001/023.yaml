base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire; and have mercy on others with fear, hating even the tunic stained by the flesh.
translation:
  language: ko
  text: 또 어떤 이들은 불에서 낚아채어 구원하시고[a], 어떤 이들에게는 두려움 가운데 자비를 베푸시되[d][b], 육체[c]로 말미암아 더럽혀진 옷마저 미워하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다른 이들을 불에서 낚아채어 구원하십시오.” 이 비유는 다가오는 심판이나 심각한 영적 위험을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘두려움 가운데’는 하나님 앞에서의 경외하는 두려움을 뜻할 수도 있고, 자신도 오염될 수 있음을 조심하는 태도를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “죄 된 본성으로 더럽혀진 옷.” 그리스어는 ‘육체’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 “또 다른 이들에게는 자비를 베푸십시오.”
    reason: previous_rendering
lexical_decisions:
- source_word: σῴζετε ἐκ πυρὸς ἁρπάζοντες
  english_pob_choice: save others by snatching them out of the fire
  chosen_korean: 불에서 낚아채어 구원하시고
  alternatives_korean:
  - 불 가운데서 끌어내어 구원하시고
  - 불에서 낚아채어 살려내시고
  lexicon: BDAG
  rationale: ἁρπάζω(「강제로·갑작스레 채어가다」)는 슥 3:2의 「불에서 꺼낸 그루터기」 모티프와 연결. 「낚아채다」가 그 긴급함과 강제성을 살린다.
- source_word: οὓς δὲ ἐλεᾶτε ἐν φόβῳ
  english_pob_choice: have mercy on others with fear
  chosen_korean: 어떤 이들에게는 두려움 가운데 자비를 베푸시되
  alternatives_korean:
  - 어떤 이들에게는 두려움으로 자비를 행하시되
  - 어떤 이들에게는 경외함 가운데 자비를 베푸시되
  lexicon: BDAG
  rationale: 22절과 일관되게 ἐλεάω를 「자비를 베풀다」로 옮긴다. ἐν φόβῳ(「두려움 가운데」)는 거짓 가르침에 함께 오염될 위험에 대한 경계의 두려움을 가리킴.
- source_word: μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα
  english_pob_choice: hating even the tunic stained by the flesh
  chosen_korean: 육체로 더럽혀진 그 옷자락마저 미워하십시오
  alternatives_korean:
  - 육체에 의해 더럽혀진 속옷까지 미워하면서
  - 살에 닿아 오염된 그 옷까지 미워하시되
  lexicon: BDAG
  rationale: χιτών은 「속옷·내복」 — 살에 직접 닿는 의류. 강조 καί「~마저」를 살려 죄와의 가까운 접촉마저 거부하라는 권면. 「옷자락마저」가 그 강한 분리 함의를 살린다. ἐσπιλωμένον(완료수동분사「얼룩진·오염된」)은 도덕적·제의적 오염.
