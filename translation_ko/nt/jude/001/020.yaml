  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you, beloved, building yourselves up in your most holy faith and praying in the Holy Spirit,
translation:
  language: ko
  text: 그러나 사랑하는 여러분, 여러분의 가장 거룩한 믿음 위에 여러분 자신을 세워 가고 성령 안에서 기도하며,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει
  english_pob_choice: building yourselves up in your most holy faith
  chosen_korean: 자기들의 가장 거룩한 믿음 위에 자신을 세워 가며
  alternatives_korean:
  - 여러분의 지극히 거룩한 믿음 위에 자신을 세워 가며
  - 여러분의 가장 거룩한 믿음으로 자신을 굳게 세워 가며
  lexicon: BDAG
  rationale: ἐποικοδομέω(「~위에 세우다」 — 건축 비유)와 최상급 ἁγιωτάτῃ(「가장 거룩한」)의 결합. 3절의 「단번에 전해 받은 그 믿음」을 「가장 거룩한 믿음」으로 부르며 그 위에 공동체를 세우라는 권면. 합쇼체 명령 「세워 가며」.
- source_word: ἐν πνεύματι ἁγίῳ προσευχόμενοι
  english_pob_choice: praying in the Holy Spirit
  chosen_korean: 성령 안에서 기도하십시오
  alternatives_korean:
  - 성령으로 기도하십시오
  - 성령 가운데 기도하십시오
  lexicon: BDAG
  rationale: ἐν + 여격을 「~안에서」로 옮겨 처소격을 보존. πνεῦμα ἁγίον은 명시적 신적 영 — 19절의 「영을 가지지 못한」과 직접 대조. 「성령」으로 명시.
