- from: 그러나 사랑하는 자들이여, 여러분은 자기들의 가장 거룩한 믿음 위에 자신을 세워 가며, 성령 안에서 기도하십시오.
  to: 그러나 사랑하는 여러분, 여러분의 가장 거룩한 믿음 위에 여러분 자신을 세워 가고 성령 안에서 기도하며,
  rationale: The revision corrects the person of the possessive, uses natural modern formal Korean for the vocative, preserves the plural reflexive/community address, and maintains the two coordinated participles as an open construction continuing into the next verse. It retains the building-on metaphor and the source-level ambiguity of ἐν ('in' rather than explicitly 'by').
