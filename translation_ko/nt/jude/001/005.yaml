id: JUD.1.5
reference: Jude 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: Now I want to remind you, though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: ko
  text: 여러분이 이미 이 모든 것을 알고 계시지만, 여러분에게 상기시키고자 합니다. 곧 예수[a]께서 한 백성을 이집트 땅에서 구원해 내시고, 그 후에 믿지 않은 자들을 멸하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 「예수」 대신 「주」 또는 「하나님」으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι
  english_pob_choice: Now I want to remind you
  chosen_korean: 나는 여러분에게 다시 일깨우려 합니다
  alternatives_korean:
  - 나는 여러분에게 다시 한번 상기시키려 합니다
  - 여러분에게 일러두려 합니다
  lexicon: BDAG
  rationale: ὑπομιμνῄσκω의 「잊지 않게 일깨우다」 의미를 「다시 일깨우다」로 옮긴다.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  english_pob_choice: though you know all things once for all
  chosen_korean: 비록 여러분이 이 모든 일을 단번에 알고 있으나
  alternatives_korean:
  - 여러분이 모든 것을 한 번에 다 알고 있다 할지라도
  lexicon: BDAG
  rationale: ἅπαξ를 「단번에」로 옮겨 3절(「단번에 전해 받은 믿음」)과 의도적 어휘 연결을 만든다 — 사도적 신앙의 결정적 전수가 곧 사도적 가르침의 결정적 앎의 근거다.
- source_word: Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας
  english_pob_choice: Jesus, having saved a people out of the land of Egypt
  chosen_korean: 예수께서 한 백성을 이집트 땅에서 구원해 내신
  alternatives_korean:
  - 예수께서 백성을 애굽 땅에서 구원하신
  lexicon: BDAG
  rationale: SBLGNT의 「Ἰησοῦς(예수)」 독법을 따른다. Αἴγυπτος는 본 번역에서 현대 한국어 「이집트」로 옮기되, 「애굽」도 가능 대안. 부정과거분사 σώσας를 「구원해 내신」으로 옮겨 출애굽 구원 행위의 완결성을 살린다.
- source_word: τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν
  english_pob_choice: afterward destroyed those who did not believe
  chosen_korean: 후에는 ... 믿지 아니한 자들을 멸하셨다
  alternatives_korean:
  - 그 후 ... 믿지 않은 자들을 멸망시키셨다
  - 두 번째로 ... 믿지 않은 자들을 멸하셨다
  lexicon: BDAG
  rationale: τὸ δεύτερον(「두 번째로·그 다음에」)을 「후에는」으로 옮겨 출애굽 구원과 광야 멸망의 순차적 대조를 살린다. 부정과거 ἀπώλεσεν의 단호함을 「멸하셨다」로 보존.
theological_decisions:
- issue: Ἰησοῦς 본문 독법 — 출애굽의 구원자가 예수와 동일시되는 기독론적 해석
  chosen_reading: 예수께서 한 백성을 이집트 땅에서 구원해 내신 후에는
  alternative_readings:
  - 주께서 한 백성을 이집트 땅에서 구원해 내신 후에는
  - 하나님께서 한 백성을 이집트 땅에서 구원해 내신 후에는
  rationale: SBLGNT는 「Ἰησοῦς(예수)」를 본문으로 채택했고, 본문비평상 가장 어려운 독법이라 원본일 가능성이 높다. 이 독법은 출애굽의 야훼와 예수 메시아를 신적 일치 관점에서 동일시하는 초기 기독론(고전 10:4, 9 평행)을 보존한다. 본 번역은 SBLGNT 본문을 따르고 각주에 이문을 명시한다.
  doctrine_reference: 'SBLGNT 본문 충실성; DOCTRINE.md: prefer hardest reading where text-critically supported'
