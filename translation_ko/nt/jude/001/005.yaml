revisions:
- from: 비록 여러분이 이 모든 일을 단번에 알고 있으나, 나는 여러분에게 다시 일깨우려 합니다 — 곧 예수[a]께서 한 백성을 이집트 땅에서 구원해 내신 후에는, 믿지 아니한 자들을 멸하셨다는 사실입니다.
  to: 여러분이 이미 이 모든 것을 알고 계시지만, 여러분에게 상기시키고자 합니다. 곧 예수[a]께서 한 백성을 이집트 땅에서 구원해 내시고, 그 후에 믿지 않은 자들을 멸하셨습니다.
  rationale: 문장의 논리와 현대 합쇼체를 다듬으면서, SBLGNT 본문의 주어인 ‘예수’를 그대로 유지했습니다. ἅπαξ의 문맥상 전제성을 ‘이미’로 자연스럽게 표현하고, τὸ δεύτερον의 순차성을 ‘그 후에’로 옮겼습니다. 각주는 이문 정보만 제시하여 논쟁 가능한 본문비평·신학 해석을 본문 또는 각주에서 확정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:01Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘예수’, 출애굽 구원, 뒤이은 불신자들의 멸망이라는 핵심 의미는 대체로 충실합니다. 그러나 ἅπαξ를 ‘단번에’로 옮기면 한 번의 동작으로 안다는 뜻이 강해져 문맥상 ‘이미/한 번 알고 있는’ 사실을 전제하는 표현에 비해 부자연스럽습니다. ‘후에는’보다 ‘그 후에’가 τὸ δεύτερον의 시간적 순서를 더 직접적으로 나타냅니다.
  naturalness: ‘다시 일깨우려 합니다’는 이해 가능하나, 현대 표준어 합쇼체에서는 ‘상기시키고자 합니다’가 더 자연스럽고 안정적입니다. ‘믿지 아니한’은 다소 문어적이므로 ‘믿지 않은’이 현대적입니다.
  terminology: ‘예수’, ‘이집트’, ‘구원해 내시고’, ‘멸하셨습니다’는 적절합니다. 본문비평 각주는 이문을 알리는 범위에 머물러야 하며, 특정 독법의 우선성이나 그것이 보존한다는 기독론적 해석을 단정적으로 덧붙이지 않는 것이 원문과 영어 POB 감사 기록에 더 충실합니다.
  issues:
  - severity: medium
    issue: ἅπαξ를 ‘단번에’로 번역함
    rationale: ‘단번에’는 ‘한 번에, 일거에’라는 방식의 뜻으로 쉽게 읽힙니다. 여기서는 독자들이 이미 알고 있는 내용을 다시 상기시키는 문맥이므로 ‘이미’가 자연스럽고 의미를 보존합니다.
  - severity: low
    issue: τὸ δεύτερον을 ‘후에는’으로 번역함
    rationale: ‘후에는’은 조건·대조의 뉘앙스도 낼 수 있습니다. ‘그 후에’는 구원 뒤에 이어진 멸망이라는 시간적 순서를 명료하게 드러냅니다.
  - severity: medium
    issue: 각주에 본문비평적 우선성과 신학적 해석을 단정적으로 서술함
    rationale: 제공된 영어 POB 각주는 단지 ‘주’ 또는 ‘하나님’이라는 이문을 알립니다. ‘가장 어려운 독법’ 및 특정 초기 기독론의 보존이라는 설명은 논쟁 가능한 해석을 각주에 확정적으로 추가합니다.
  revised_text: 여러분이 이미 이 모든 것을 알고 계시지만, 여러분에게 상기시키고자 합니다. 곧 예수[a]께서 한 백성을 이집트 땅에서 구원해 내시고, 그 후에 믿지 않은 자들을 멸하셨습니다.
  revised_footnotes:
