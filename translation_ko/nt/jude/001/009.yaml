review_pass:
  verdict: revise
  source_fidelity: 원문의 시간절(ὅτε), 마귀와의 대립·논쟁, 모세의 몸, 미가엘의 자제, 그리고 기원법의 주의 책망을 대체로 충실히 옮겼습니다. 다만 ‘때에도’의 양보적 뉘앙스는 원문에 없으므로 삭제하는 것이 좋습니다. κρίσιν ἐπενεγκεῖν βλασφημίας는 의미가 논쟁적인 구절이므로 본문은 ‘모독적인 판결’로 절제해 두고 전통적 대안을 각주에 제시합니다.
  naturalness: ‘마귀와 다투면서 모세의 시신을 두고 논쟁할 때’는 두 그리스어 동사의 중첩을 무리 없이 살립니다. ‘그에게 모독적인 판결을 내리기를 감히 하지 않고’는 원문의 부정·부정과거와 대격/여격 관계를 자연스러운 현대 한국어 합쇼체 문장으로 반영합니다.
  terminology: ‘천사장’, ‘미가엘’, ‘모세’, ‘마귀’, ‘주’는 한국어 성경 독자에게 정착된 표기와 용어입니다. ‘시신’은 죽은 모세의 σώμα를 자연스럽게 나타냅니다. 기존 각주는 이 사건의 출처를 단정하고 본문의 권위에 관한 해석적 결론을 덧붙이므로, 오리게네스의 전승 증언과 현존 문헌의 한계를 밝혀 역사 정보로 제한해야 합니다.
  issues:
  - severity: medium
    issue: ‘때에도’가 원문에 없는 양보·강조를 더합니다.
    rationale: ὅτε는 단순히 ‘~할 때’라는 시간 관계를 표시합니다. 앞뒤 문맥상 대조는 뒤의 ἀλλὰ가 충분히 나타내므로 ‘에도’는 삭제하는 편이 정확합니다.
  - severity: medium
    issue: 기존 역사 각주가 모세 시신 논쟁의 출처를 ‘모세 승천기’로 사실상 확정하고, 본문의 권위에 관한 교리적 결론을 제시합니다.
    rationale: 오리게네스는 이 일화를 『모세 승천기』와 연결하지만, 현존하는 해당 문헌에는 이 장면이 보존되어 있지 않습니다. 따라서 출처는 전통적 귀속으로만 밝히고 불확실성을 표시해야 하며, 본문에 없는 권위론적 판단은 각주에서 제거해야 합니다.
  - severity: low
    issue: ‘모독의 판결’은 한국어에서 다소 압축적이며, βλασφημίας의 수식 관계가 논쟁적이라는 점이 드러나지 않습니다.
    rationale: ‘모독적인 판결’은 원문의 가능한 의미를 유지하면서 더 자연스럽습니다. 전통적 ‘비방/훼방하는 판결’은 각주에서 대안으로 제시해 해석적 불확실성을 보존합니다.
  revised_text: 그러나 천사장 미가엘은 마귀와 다투면서 모세의 시신을 두고 논쟁할 때,[a] 그에게 모독적인 판결을 내리기를 감히 하지 않고,[b] 다만 이렇게 말했습니다. 「주께서 너를 꾸짖으시기를!」
