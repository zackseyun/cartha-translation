id: JUD.1.9
reference: Jude 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel, when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said, "May the Lord rebuke you."
translation:
  language: ko
  text: 그러나 천사장 미가엘은 마귀와 다투면서 모세의 시신을 두고 논쟁할 때,[a] 그에게 모독적인 판결을 내리기를 감히 하지 않고,[b] 다만 이렇게 말했습니다. 「주께서 너를 꾸짖으시기를!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 사건은 구약 성경에 기록되어 있지 않습니다. 오리게네스는 이를 『모세 승천기』와 연결하였으나(『원리론』 3.2.1), 현존하는 그 문헌에는 이 장면이 보존되어 있지 않습니다.
    reason: historical_background
  - marker: b
    text: 또는 전통적으로, “그를 비방하는 판결” 또는 “훼방하는 판결.” 그리스어 표현의 정확한 뉘앙스는 논쟁적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μιχαὴλ ὁ ἀρχάγγελος
  english_pob_choice: Michael the archangel
  chosen_korean: 천사장 미가엘
  alternatives_korean:
  - 대천사 미가엘
  - 천사들의 우두머리 미가엘
  lexicon: BDAG
  rationale: ἀρχάγγελος를 한국 교회 정착 어휘 「천사장」으로 옮긴다. 미가엘은 다니엘 10:13, 12:1, 계 12:7에서 하나님의 백성을 위해 싸우는 주된 천사로 등장한다.
- source_word: ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος
  english_pob_choice: when he was disputing with the devil and arguing about Moses' body
  chosen_korean: 모세의 시신에 관하여 마귀와 다투며 논쟁할 때에도
  alternatives_korean:
  - 모세의 시체를 두고 마귀와 다투며 논쟁할 때
  - 모세의 몸을 가지고 마귀와 변론할 때
  lexicon: BDAG
  rationale: διακρινόμενος(「다투는」)와 διελέγετο(「논쟁했다」)의 두 동사를 「다투며 논쟁하다」로 자연스럽게 결합한다. σῶμα는 「시신·시체·몸」 — 사망한 모세의 몸을 가리키므로 「시신」이 가장 자연스럽다. Μωϋσέως는 한국 정착 표기 「모세」.
- source_word: οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας
  english_pob_choice: did not dare to bring a slanderous judgment against him
  chosen_korean: 감히 모독의 판결을 그에게 내리지 못하고
  alternatives_korean:
  - 모독적인 판결을 그에게 내리려 하지 않고
  - 모독의 정죄를 가하기를 감히 하지 않고
  lexicon: BDAG
  rationale: οὐκ ἐτόλμησεν은 「감히 ~하지 않았다」 — 무력함이 아닌 의도적 자제. κρίσιν βλασφημίας(「모독의 판결」)는 8절의 「영광들을 모독함」과 직접 대조 — 천사장조차 마귀를 향해 자제했는데, 거짓 교사들은 천상적 존재들을 모독한다는 논리적 핵심.
- source_word: Ἐπιτιμήσαι σοι κύριος
  english_pob_choice: May the Lord rebuke you
  chosen_korean: 주께서 너를 꾸짖으시기를!
  alternatives_korean:
  - 주께서 너를 책망하시기를!
  - 주께서 너를 견책하시기를!
  lexicon: BDAG
  rationale: 부정과거 기원법 ἐπιτιμήσαι(「꾸짖으시기를」)의 기원 형식을 「~기를!」 감탄으로 살린다. 즉 7:1과의 평행(미가엘이 자신의 권위가 아닌 주의 권위에 호소). 「꾸짖다」는 ἐπιτιμάω의 강한 명령적 책망 함의에 적절.
theological_decisions:
- issue: 「모세 승천기」 인용 — 정경 외 유대 전승의 본보기적 활용
  chosen_reading: 미가엘과 마귀의 모세 시신 다툼 일화를 본문 그대로 보존하고, 각주에 출처(모세 승천기) 명시
  alternative_readings:
  - 일화의 출처를 본문에 풀어 설명
  - 일화를 비유적 해석으로 약화
  rationale: 유다는 정경 외 유대 전승(「모세 승천기/Assumptio Mosis」)을 인용하여 본보기로 삼는다. 이 인용은 본문의 권위 근거가 외경에 있다는 뜻이 아니라, 유대 독자들이 익숙한 전승을 사용하여 모독적 판결을 자제하는 천상적 모범을 제시하기 위함이다. 본 번역은 본문을 직역으로 그대로 살리고, 각주에서 외경 출처를 명시하여 독자가 신학적·역사적 맥락을 이해하도록 한다. 풀이·해석으로 본문을 약화시키지 않는다.
  doctrine_reference: 유다 9 ↔ 모세 승천기 (전승되지 않은 부분); 오리겐 De Principiis 3.2.1 증언; DOCTRINE.md §5 — preserve source-direct rendering, document interpretive context in footnotes
