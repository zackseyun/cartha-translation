revisions:
- from: 그러나 천사장 미가엘은 모세의 시신에 관하여 마귀와 다투며 논쟁할 때에도, 감히 모독의 판결을 그에게 내리지 못하고 다만 이렇게 말했습니다 — 「주께서 너를 꾸짖으시기를!」[a]
  to: 그러나 천사장 미가엘은 마귀와 다투면서 모세의 시신을 두고 논쟁할 때,[a] 그에게 모독적인 판결을 내리기를 감히 하지 않고,[b] 다만 이렇게 말했습니다. 「주께서 너를 꾸짖으시기를!」
  rationale: 원문에 없는 양보 표현을 제거하고, 논쟁적인 ‘모독의 판결’ 구절을 자연스러우면서도 과도하게 해석하지 않는 표현으로 다듬었습니다. 또한 외경 전승 관련 각주를 검증 가능한 역사적 정보로 한정하고, 출처 귀속의 불확실성을 밝혔습니다. 두 각주는 각각 해당 ‘모세의 시신’과 ‘모독적인 판결’에 직접 연결되도록 앵커를 옮겼습니다.
  reviewer_model: gpt-5.6-terra
