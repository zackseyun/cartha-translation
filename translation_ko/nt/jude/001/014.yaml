id: JUD.1.14
reference: Jude 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch, the seventh from Adam, also prophesied to these, saying, "Behold, the Lord came with his holy myriads,"
translation:
  language: ko
  text: 아담으로부터 일곱째인 에녹도 이들에 관하여 예언하여 이렇게 말했습니다. “보라[a], 주께서 그분의 거룩한 무리 수만과 함께 임하셨으니,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 인용은 1 에녹서 1:9와 관련됩니다. ‘거룩한 무리 수만’은 직역하면 ‘그분의 거룩한 만만들’이며, 매우 큰 수의 거룩한 무리를 뜻합니다. 원문은 그들이 누구인지를 더 특정하지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἕβδομος ἀπὸ Ἀδὰμ Ἑνώχ
  english_pob_choice: Enoch, the seventh from Adam
  chosen_korean: 아담으로부터 일곱째인 에녹
  alternatives_korean:
  - 아담에서부터 일곱 번째 되는 에녹
  - 아담의 일곱째 후손인 에녹
  lexicon: BDAG
  rationale: 창세기 5장의 계보 — 아담(1), 셋(2), 에노스(3), 게난(4), 마할랄렐(5), 야렛(6), 에녹(7). 「일곱째」가 종말론적·완전수 함의(1 에녹서가 강조). Ἀδάμ과 Ἑνώχ은 한국 교회 정착 표기.
- source_word: Προεφήτευσεν ... τούτοις
  english_pob_choice: prophesied to these
  chosen_korean: 이 자들에 관하여 예언하여
  alternatives_korean:
  - 이들에 대하여 예언하여
  - 이들에게 예언하여
  lexicon: BDAG
  rationale: τούτοις 여격은 「~에 관하여·~을 두고」(주제) 또는 「~에게」(대상) 두 해석이 모두 가능하나, 에녹이 거짓 교사들의 운명을 예언했다는 본문 흐름상 「~에 관하여」가 자연스럽다.
- source_word: Ἰδοὺ ἦλθεν κύριος
  english_pob_choice: Behold, the Lord came
  chosen_korean: 보라, 주께서 ... 임하셨으니
  alternatives_korean:
  - 보라, 주께서 ... 오셨으니
  - 보라, 주께서 ... 강림하셨으니
  lexicon: BDAG
  rationale: ἰδού는 예언적 정형 「보라」. 예언적 부정과거 ἦλθεν(「오셨다」)은 종말의 확정성을 과거형으로 표현 — 「임하셨다」가 그 격식과 종말론적 무게를 살린다.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  english_pob_choice: with his holy myriads
  chosen_korean: 그분의 거룩한 자들의 만만(萬萬)과 함께
  alternatives_korean:
  - 그분의 거룩한 무수한 자들과 함께
  - 그분의 수만 명의 거룩한 자들과 함께
  lexicon: BDAG
  rationale: μυριάς(「만(萬)·일만」)의 복수 μυριάσιν은 「만의 만」 즉 수많은 무리. 단 7:10(「천만이 그분 앞에서 시중들다」), 1 에녹 1:9의 「거룩한 자들의 만만과 함께」 정형. 「만만(萬萬)」이 그 무수함의 격식 어휘. 「거룩한 자들」은 천사들 또는 성도들을 가리킴 — 1 에녹의 천사적 회중 함의.
theological_decisions:
- issue: 1 에녹서 1:9의 명시적 인용 — 신약의 유일한 1 에녹 정경적 인용
  chosen_reading: 14-15절을 1 에녹 1:9의 직접 인용으로 보존하고, 각주에 출처와 신학적 함의 명시
  alternative_readings:
  - 인용을 일반 예언적 표현으로 약화
  - 출처를 본문 안에 풀어 설명
  rationale: 본 14-15절은 1 에녹서 1:9(에티오피아어판)와 거의 직접적인 문자적 일치를 보이며, 신약에서 1 에녹서를 정경적 권위로 인용한 유일한 본문이다. 9절의 모세 승천기 인용과 함께, 유다는 정경 외 유대 종말론 자료를 자기 논증의 권위적 본보기로 사용한다. 본 번역은 인용을 직역으로 그대로 살리고, 각주에서 출처(1 에녹 1:9)와 그 신학적 함의(1 에녹의 광범위한 권위 있는 유포, 정경성에 관한 별도 판단)를 명시한다. 본문을 「예언의 일반 어휘」로 풀어 약화시키지 않는다.
  doctrine_reference: 유다 14-15 ↔ 1 에녹 1:9 (유일한 신약 명시적 인용); DOCTRINE.md §1, §5 — preserve source-direct quotation, document intertestamental sources transparently
