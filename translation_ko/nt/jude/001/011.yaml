id: JUD.1.11
reference: Jude 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them, because they have walked in the way of Cain, and have poured themselves out for pay into Balaam's error, and have perished in Korah's rebellion.
translation:
  language: ko
  text: 이 자들에게 화 있을지어다 — 그들이 가인의 길로 걸어갔고, 삯을 위하여 발람의 미혹 속으로 자신을 쏟아부었으며, 고라의 거역으로 멸망해 버렸기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  english_pob_choice: Woe to them
  chosen_korean: 이 자들에게 화 있을지어다
  alternatives_korean:
  - 그들에게 화가 있도다
  - 그들에게 재앙이 있을 것이다
  lexicon: BDAG
  rationale: '예언자적·종말론적 정형 어휘 οὐαί(히브리어 הוֹי의 헬라어 음역)를 한국 교회 정착 어휘 「화 있을지어다」로 옮긴다. 격식 어조 보존.'
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  english_pob_choice: walked in the way of Cain
  chosen_korean: 가인의 길로 걸어갔고
  alternatives_korean:
  - 가인의 길을 따라갔고
  lexicon: BDAG
  rationale: '창세기 4장의 가인 — 형제 살해자, 시기와 거짓의 원형. 「길로 걸어가다」가 도덕적 행로의 정형 표현.'
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  english_pob_choice: poured themselves out for pay into Balaam's error
  chosen_korean: 삯을 위하여 발람의 미혹 속으로 자신을 쏟아부었으며
  alternatives_korean:
  - 발람의 잘못된 길로 돈을 위해 자신을 던졌으며
  - 보수를 위해 발람의 오류에 자신을 내맡겼으며
  lexicon: BDAG
  rationale: '민수기 22-24장의 발람 — 돈/보상을 위해 이스라엘을 저주하려 한 거짓 선지자(민 31:16, 벧후 2:15 평행). ἐκχέω(「쏟아붓다」)의 수동형은 자기 무절제한 투기·헌신을 가리킴. 「자신을 쏟아부었다」가 그 무절제한 탐욕 함의를 살린다.'
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο
  english_pob_choice: perished in Korah's rebellion
  chosen_korean: 고라의 거역으로 멸망해 버렸기
  alternatives_korean:
  - 고라의 반역으로 멸망당했기
  - 고라의 다툼으로 망해 버렸기
  lexicon: BDAG
  rationale: '민수기 16장의 고라 반역 — 모세와 아론의 권위에 도전하다가 땅이 갈라져 죽음. ἀντιλογία(「대적·반박·거역」)를 「거역」으로 옮긴다. 부정과거 ἀπώλοντο의 단호한 결과를 「멸망해 버렸다」로 살린다(예언적 부정과거 — 이미 결정된 미래를 과거로 말함).'
