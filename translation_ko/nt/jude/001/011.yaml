revisions:
- from: 이 자들에게 화 있을지어다 — 그들이 가인의 길로 걸어갔고, 삯을 위하여 발람의 미혹 속으로 자신을 쏟아부었으며, 고라의 거역으로 멸망해 버렸기 때문입니다.
  to: 그들에게 화가 있습니다. 그들은 가인의 길을 따라갔고, 삯을 위하여 발람의 미혹에 자신을 내던졌으며, 고라의 거역으로 멸망하였습니다.
  rationale: 현대 표준어 합쇼체에 맞추어 문장을 다듬되, 세 개의 과거 동사가 이루는 병렬 구조와 가인·발람·고라에 대한 성경적 암시를 유지했습니다. 특히 난해한 ἐξεχύθησαν의 문자적 ‘쏟아짐’ 이미지는 한국어에서 부정확하거나 난삽해질 수 있으므로, 문맥상 안전한 비유적 표현인 ‘자신을 내던졌다’로 옮겼습니다. 별도의 원문 이문이나 필수 주석 표지가 없으므로 각주는 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:06Z'
review_pass:
  verdict: revise
  source_fidelity: 첫째 절의 ‘가인의 길’과 셋째 절의 ‘고라의 거역’은 원문의 비유적·성경적 암시를 대체로 잘 보존합니다. 그러나 ‘발람의 미혹 속으로 자신을 쏟아부었다’는 ἐξεχύθησαν의 이미지를 기계적으로 옮겨 한국어로 매우 부자연스럽고 의미가 불명확합니다. ‘자신을 내던졌다’는 이 문맥의 무절제하고 탐욕스러운 몰입을 자연스럽게 전달합니다. ἀπώλοντο에 ‘해 버렸다’를 더한 것은 원문보다 구어적이며 불필요한 완료·감정 뉘앙스를 보탭니다.
  naturalness: 현 문안은 ‘길로 걸어가다’, ‘미혹 속으로 자신을 쏟아붓다’, ‘멸망해 버리다’가 현대 표준어 합쇼체 성경 문장으로 매끄럽지 않습니다. ‘길을 따라가다’, ‘미혹에 자신을 내던지다’, ‘멸망하였습니다’로 고치면 격식을 유지하면서 자연스러워집니다. ‘이 자들’도 원문의 단순한 3인칭 지시보다 경멸적·지시적인 느낌을 더하므로 ‘그들’이 적절합니다.
  terminology: 가인, 발람, 고라의 표기는 표준적입니다. οὐαί는 예언자적 심판 선언으로 ‘그들에게 화가 있습니다’라고 하여 현대 합쇼체로 옮겼습니다. πλάνη는 ‘미혹’으로 유지하여 발람 자신의 잘못, 혹은 그와 관련된 미혹이라는 원문의 해석상 여지를 과도하게 좁히지 않았습니다. ἀντιλογία는 민수기 16장의 암시를 살려 ‘거역’으로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘발람의 미혹 속으로 자신을 쏟아부었으며’가 한국어에서 의미상·문체상 부자연스럽습니다.
    rationale: ‘자신을 쏟아붓다’는 통상 사람·일·대상에 헌신이나 노력을 들인다는 뜻으로 쓰이며, ‘미혹 속으로’와 결합하면 원문의 자포자기적·무분별한 몰입을 명료하게 전달하지 못합니다.
  - severity: low
    issue: ‘가인의 길로 걸어갔고’는 비유적 행로를 나타내는 현대 한국어 표현으로 다소 어색합니다.
    rationale: ‘가인의 길을 따라갔고’가 ὁδός와 ἐπορεύθησαν의 비유를 더 자연스럽게 보존합니다.
  - severity: low
    issue: ‘이 자들에게’와 ‘멸망해 버렸기’가 각각 불필요한 경멸적 지시성과 구어적 강조를 더합니다.
    rationale: αὐτοῖς는 단순히 ‘그들에게’이며, ἀπώλοντο는 ‘멸망하였습니다’로 충분히 단호한 결과를 나타냅니다.
  revised_text: 그들에게 화가 있습니다. 그들은 가인의 길을 따라갔고, 삯을 위하여 발람의 미혹에 자신을 내던졌으며, 고라의 거역으로 멸망하였습니다.
