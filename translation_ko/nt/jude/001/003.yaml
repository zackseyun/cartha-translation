id: JUD.1.3
reference: Jude 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved, although I was making every effort to write to you about our common salvation, I found it necessary to write, urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: ko
  text: 사랑하는 자들이여, 우리가 함께 누리는 구원에 관해 여러분에게 쓰려고 모든 힘을 기울이던 차에, 나는 부득이 여러분에게 편지를 써서 권면해야만 했습니다 — 곧 성도들에게 단번에 전해 받은 그 믿음을 위하여 힘써 싸우라는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσαν σπουδὴν ποιούμενος
  english_pob_choice: making every effort
  chosen_korean: 모든 힘을 기울이던
  alternatives_korean:
  - 모든 열심을 다하던
  - 온갖 정성을 다하던
  lexicon: BDAG
  rationale: σπουδή(「열심·진지함·서두름」) + ποιέω 정형의 「힘껏 노력하다」 의미를 「모든 힘을 기울이다」로 옮긴다.
- source_word: τῆς κοινῆς ἡμῶν σωτηρίας
  english_pob_choice: our common salvation
  chosen_korean: 우리가 함께 누리는 구원
  alternatives_korean:
  - 우리의 공동의 구원
  - 우리 모두의 구원
  lexicon: BDAG
  rationale: κοινός의 「공동·함께 나누는」 의미를 「함께 누리는」으로 옮겨 단순 형용사 「공동의」보다 관계적 함의를 살린다.
- source_word: ἀνάγκην ἔσχον γράψαι
  english_pob_choice: I found it necessary to write
  chosen_korean: 나는 부득이 ... 편지를 써서 ... 해야만 했습니다
  alternatives_korean:
  - 나는 ... 쓰지 않을 수 없었습니다
  - 나는 ... 쓸 수밖에 없었습니다
  lexicon: BDAG
  rationale: ἀνάγκη(불가피·강제)의 무게를 「부득이 ... 해야만 했습니다」로 살려, 본래 의도(공동 구원에 관한 편지)에서 긴급 권면 편지로 전환한 상황의 절박함을 드러낸다.
- source_word: ἐπαγωνίζεσθαι
  english_pob_choice: contend earnestly
  chosen_korean: 힘써 싸우라
  alternatives_korean:
  - 분투하라
  - 굳게 싸우라
  - 사력을 다해 싸우라
  lexicon: BDAG
  rationale: ἐπί 강조 접두사 + ἀγωνίζομαι(「투기·전투·경기」 어휘)는 운동·전투 비유. 「힘써 싸우다」가 진리 수호를 위한 적극적 분투의 함의를 살린다.
- source_word: τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει
  english_pob_choice: the faith once for all delivered to the saints
  chosen_korean: 성도들에게 단번에 전해 받은 그 믿음
  alternatives_korean:
  - 거룩한 자들에게 한 번에 모두 전해진 믿음
  - 성도들에게 일거에 전수된 믿음
  lexicon: BDAG
  rationale: 'ἅπαξ는 「단번에·일거에」 — 반복될 수 없는 결정적 전수. 「단번에」가 한국어 교의적 어휘로 정착해 있다. 부정과거수동분사 παραδοθείσῃ는 「전해 받은(전수받은)」 신적 수동.'
theological_decisions:
- issue: '「단번에 전해 받은 믿음」 — 사도적 전통의 결정성·완결성'
  chosen_reading: 성도들에게 단번에 전해 받은 그 믿음
  alternative_readings:
  - 성도들에게 한 번 전해진 믿음
  - 성도들에게 일거에 맡겨진 믿음
  rationale: ἅπαξ는 「오직 한 번·결정적으로」의 의미로, 사도적 전수가 반복·수정 불가능한 완결적 사건임을 강조한다. 유다서 전체 논증의 기둥이며, 이단적 신교리(4·8·16절)에 대한 반박의 근거가 된다. 「단번에」가 그 결정성을 가장 분명히 담는다.
  doctrine_reference: '유다 1:3 — 사도적 신앙의 완결적 전수; DOCTRINE.md §5: preserve the source''s strongest plain meaning'
