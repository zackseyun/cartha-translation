id: JUD.1.15
reference: Jude 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness, and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: ko
  text: 곧 모든 사람에게 심판을 집행하시고, 모든 불경건한 자들을 그들이 불경건하게 저지른 모든 불경건한 행위에 관하여, 또 불경건한 죄인들이 그분을 거슬러 말한 모든 가혹한 말에 관하여 유죄를 밝히시려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιῆσαι κρίσιν κατὰ πάντων
  english_pob_choice: to execute judgment against all
  chosen_korean: 모든 자를 향하여 심판을 행하시고
  alternatives_korean:
  - 모든 사람을 대적하여 심판하시고
  - 모든 자에게 심판을 시행하시고
  lexicon: BDAG
  rationale: κρίσιν ποιέω(「심판을 행하다」)는 정형 표현. κατά + 속격은 「~을 거슬러·향하여」 적대적 함의.
- source_word: ἐλέγξαι πάντας τοὺς ἀσεβεῖς
  english_pob_choice: convict all the ungodly
  chosen_korean: 모든 경건치 않은 자들 ... 그들 모두를 정죄하시려는 것
  alternatives_korean:
  - 모든 불경건한 자들을 책망하시려는 것
  - 모든 경건치 않은 자들을 책잡으시려는 것
  lexicon: BDAG
  rationale: ἐλέγχω의 「죄를 드러내어 정죄하다」 의미. 「정죄하다」가 종말론적 법적 판결 함의를 살린다.
- source_word: πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν
  english_pob_choice: all their ungodly deeds that they committed in ungodliness
  chosen_korean: 경건치 않은 방식으로 행한 모든 경건치 않은 일들
  alternatives_korean:
  - 그들이 불경건하게 저지른 모든 불경건한 행위들
  - 그들이 경건치 않게 행한 모든 경건치 않은 일들
  lexicon: BDAG
  rationale: 본 절은 ἀσέβεια/ἀσεβής/ἀσεβέω 어근이 한 절 안에 4회 반복되는 의도적 강조 구조(명사 ἀσεβείας + 동사 ἠσέβησαν + 형용사 ἀσεβεῖς 두 번). 한국어 번역에서 「경건치 않은」을 의도적으로 반복하여 본문의 강조 효과를 보존한다.
- source_word: τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ
  english_pob_choice: the harsh things that ... have spoken against him
  chosen_korean: 그분을 거슬러 말한 모든 가혹한 말들
  alternatives_korean:
  - 그분에게 대항하여 말한 모든 거친 말들
  - 그분을 거슬러 한 모든 강퍅한 말들
  lexicon: BDAG
  rationale: σκληρός(「딱딱한·가혹한·강퍅한」)는 거칠고 강한 말. 「가혹한 말」이 본문의 모독적 발화의 무게를 살린다. κατά + 속격 αὐτοῦ는 주(또는 그분)에 대한 적대.
