  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand, and whatever they understand naturally, like irrational animals, by these things they are corrupted.
translation:
  language: ko
  text: 그런데 이 자들은 자기들이 알지 못하는 것은 무엇이든 모독하고, 이성 없는 짐승처럼 본능적으로 아는 것들로 말미암아 부패합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν
  english_pob_choice: slander whatever they do not understand
  chosen_korean: 자기들이 알지 못하는 것은 무엇이든 모독하고
  alternatives_korean:
  - 자기들이 모르는 것은 다 비방하고
  - 자기들이 깨닫지 못하는 것을 훼방하고
  lexicon: BDAG
  rationale: ὅσα(부정관계대명사「얼마든지의 것들」) + οἴδασιν(완료의 현재 의미「알다」)을 「알지 못하는 것은 무엇이든」으로 옮긴다. 9절의 미가엘과 대조 — 천사장도 자제한 모독을 이들은 자기들이 알지도 못하는 천상의 존재들에 대해 행한다.
- source_word: ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται
  english_pob_choice: whatever they understand naturally, like irrational animals, by these things they are corrupted
  chosen_korean: 이성 없는 짐승처럼 본능으로 아는 것에 의해서는 스스로 부패해 갑니다
  alternatives_korean:
  - 이성 없는 동물처럼 본성적으로 아는 것들로 인해 멸망해 갑니다
  - 말 못 하는 짐승처럼 본능으로 아는 것들 안에서 썩어집니다
  lexicon: BDAG
  rationale: φυσικῶς(「본성적으로·본능으로」), ἄλογος ζῷα(「이성 없는 짐승」 — λόγος를 갖지 못한 동물), φθείρομαι(현재수동「부패하다·멸망하다」)의 결합. 「본능으로 아는 것에 의해 스스로 부패해 가다」가 그 자기 파괴적 함의를 살린다. ἄλογος는 「로고스(이성·말씀)가 없는」이라는 어원적 의미가 풍부하다.
