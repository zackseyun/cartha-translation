  verdict: revise
  source_fidelity: 첫 절은 βλασφημοῦσιν과 ὅσα μὲν οὐκ οἴδασιν을 충실하게 옮깁니다. 그러나 둘째 절의 ὅσα는 복수적 범위를 지니므로 ‘아는 것들’로 옮기는 편이 적절하며, ‘스스로’는 원문이 명시하지 않는 행위 주체성 또는 재귀성을 더합니다. ἐν τούτοις는 그들이 본능적으로 아는 바로 그 것들과 관련된 파멸/부패를 나타내므로 ‘그것들로 말미암아’가 자연스럽습니다. φθείρονται의 부패와 파멸의 중첩된 함의는 ‘부패합니다’로 보존됩니다.
  naturalness: ‘아는 것에 의해서는’은 단수와 보조사의 결합 때문에 다소 부자연스럽습니다. ‘본능적으로 아는 것들로 말미암아 부패합니다’는 현대 표준어 합쇼체에서 더 매끄럽고 원문의 병렬 구조도 분명히 드러냅니다.
  terminology: ‘모독하다’는 이 문맥에서 βλασφημέω의 강한 비방·모독의 의미를 무리 없이 담습니다. ‘이성 없는 짐승’은 ἄλογα ζῷα에 대응하며, ‘본능적으로’는 φυσικῶς의 기능을 명료하게 표현합니다. ‘부패합니다’는 φθείρονται의 도덕적 부패와 파국적 결과의 여지를 지나치게 한쪽으로 확정하지 않습니다.
  issues:
