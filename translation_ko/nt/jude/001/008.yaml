id: JUD.1.8
reference: Jude 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: ko
  text: 그러나 이들도 마찬가지로 꿈에 의지하여[a] 육체를 더럽히고, 권위를 거부하며, 영광스러운 존재들을 비방합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “꿈꾸면서.” 그리스어 분사는 단순히 꿈을 꾸는 것을 뜻할 수도 있지만, 여기서는 그들이 꿈을 자기 행동의 근거로 삼는다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 직역하면 “영광들”입니다. 높은 천상적 존재들, 아마도 천사들을 가리킬 수 있으나, 본문은 더 구체적으로 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνυπνιαζόμενοι
  english_pob_choice: relying on dreams
  chosen_korean: 자기 꿈에 사로잡혀
  alternatives_korean:
  - 꿈꾸는 자처럼
  - 꿈을 따라
  lexicon: BDAG
  rationale: 현재중간분사 ἐνυπνιαζόμενοι는 「꿈꾸는·환상에 빠진」. 거짓 교사들이 거짓 환상·계시를 자기 권위의 근거로 삼는 모습을 가리킨다. 「자기 꿈에 사로잡혀」가 그 자기기만적 의존을 살린다.
- source_word: σάρκα μὲν μιαίνουσιν
  english_pob_choice: defile the flesh
  chosen_korean: 육체를 더럽히고
  alternatives_korean:
  - 육신을 더럽히고
  - 살을 오염시키고
  lexicon: BDAG
  rationale: μιαίνω의 「제의적·도덕적 오염」 의미를 「더럽히다」로 옮긴다. 7절 음행과 연결된다.
- source_word: κυριότητα δὲ ἀθετοῦσιν
  english_pob_choice: reject authority
  chosen_korean: 주권을 멸시하며
  alternatives_korean:
  - 주재권을 거부하며
  - 권위를 무시하며
  lexicon: BDAG
  rationale: κυριότης는 「주재권·주님 되심」 — 단순 권위 일반이 아닌 신적·천상적 주권을 함의(엡 1:21, 골 1:16의 권세 계열 어휘). ἀθετέω는 「폐기·거부·멸시」. 「주권을 멸시하다」가 신적 질서에 대한 반역 함의를 담는다.
- source_word: δόξας δὲ βλασφημοῦσιν
  english_pob_choice: slander glorious ones
  chosen_korean: 영광스러운 자들을 모독합니다
  alternatives_korean:
  - 영광스러운 존재들을 비방합니다
  - 영광스러운 자들을 훼방합니다
  lexicon: BDAG
  rationale: 복수 δόξας(「영광들·영광스러운 자들」)는 천상적 존재(좋은 천사들 또는 어떤 천상 권세)를 가리키는 것으로 폭넓게 이해된다. 9절에서 미가엘조차 마귀에게 비방의 판결을 내리지 못한 것과의 대조 — 천상적 존재 자체에 대한 모독을 가리킴이 가장 자연스럽다. 「영광스러운 자들」이 그 모호함과 천상적 무게를 함께 살린다.
