  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea, foaming up their own shames; wandering stars, for whom the gloom of darkness has been reserved forever.
translation:
  language: ko
  text: 바다의 거친 파도 — 자기들의 수치를 거품처럼 뱉어내며, 유리하는 별 — 그들을 위하여는 흑암의 어둠이 영원토록 예비되어 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας
  english_pob_choice: wild waves of the sea, foaming up their own shames
  chosen_korean: 바다의 거친 파도 — 자기들의 수치를 거품처럼 뱉어내며
  alternatives_korean:
  - 바다의 사나운 물결 — 자기 부끄러움을 거품으로 토해내며
  - 바다의 광포한 파도 — 자기들의 수치를 거품으로 뿜어내며
  lexicon: BDAG
  rationale: 'ἄγριος(「거친·사나운·광포한」), ἐπαφρίζω(「거품을 내뿜다」 — 사 57:20 평행 「악인은 평온할 수 없으며 진흙과 더러움을 뿜는 바다 같다」). αἰσχύνη의 복수형은 「수치스러운 행위들」 — 자기 부끄러움을 거품처럼 적나라하게 드러냄.'
- source_word: ἀστέρες πλανῆται
  english_pob_choice: wandering stars
  chosen_korean: 유리하는 별
  alternatives_korean:
  - 떠도는 별
  - 방황하는 별
  - 정처 없는 별
  lexicon: BDAG
  rationale: 'πλανήτης(「떠도는·방황하는」 — 영어 planet 어원)는 정해진 궤도 없이 떠돌아 항해자에게 방향을 줄 수 없는 별을 가리킴. 1 에녹서의 「떠도는 별 = 정해진 자리를 벗어난 천사」 모티프(에녹 18:13-16, 21:1-6)와 연결 — 6절의 「자기 영역을 지키지 않은 천사들」 이미지가 다시 등장. 「유리하는 별」이 그 무정처성과 종말론적 함의를 함께 담는다.'
- source_word: οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται
  english_pob_choice: for whom the gloom of darkness has been reserved forever
  chosen_korean: 그들을 위하여는 흑암의 어둠이 영원토록 예비되어 있습니다
  alternatives_korean:
  - 그들에게는 흑암의 어두움이 영원히 보존되어 있습니다
  - 그들을 위해 어둠의 음침함이 영원까지 마련되어 있습니다
  lexicon: BDAG
  rationale: '6절의 ὑπὸ ζόφον τετήρηκεν(「흑암 아래 가두어 두셨다」)과 의도적 어휘 연결 — 떠도는 별/타락한 천사들에 대한 동일한 종말론적 운명. ζόφος τοῦ σκότους(「어둠의 흑암」 — 동의어 강조)는 가장 짙은 어둠. τετήρηται는 신적 수동의 완료 — 「예비되어 있다」.'
