review_pass:
  verdict: revise
  source_fidelity: 현 번역은 두 비유와 심판의 결말을 대체로 충실히 옮깁니다. 그러나 ἐπαφρίζοντα는 수치를 ‘거품처럼’ 뱉는다는 뜻이라기보다 수치를 거품과 함께/거품으로 뿜어낸다는 이미지이므로, ‘처럼’은 비교 의미를 덧붙입니다. πλανῆται는 복수이므로 ‘별들’로 명시하는 편이 안전합니다.
  naturalness: ‘유리하는’과 ‘그들을 위하여는’은 현대 표준어 합쇼체 성경 문장으로 다소 문어적이거나 어색합니다. ‘떠도는 별들’, ‘그들을 위해’가 자연스럽습니다. ‘어둠의 흑암’은 의도적인 중첩을 보존하면서도 ‘흑암의 어둠’보다 자연스럽습니다.
  terminology: ‘예비되어 있습니다’는 τετήρηται의 완료 수동 및 심판을 위해 보존·유보된 상태를 무리 없이 반영합니다. ζόφος τοῦ σκότους의 강조된 어둠 이미지는 ‘어둠의 흑암’으로 보존합니다.
  issues:
  - severity: medium
    issue: ‘거품처럼 뱉어내며’
    rationale: ἐπαφρίζοντα는 거품을 일으키며/거품으로 뿜어내는 동작을 나타냅니다. ‘처럼’은 수치 자체가 거품과 같다는 비교를 추가할 수 있습니다.
  - severity: low
    issue: ‘유리하는 별’ 및 단수 표현
    rationale: ‘유리하는’은 현대어에서 덜 자연스럽고, ἀστέρες πλανῆται는 복수입니다. ‘떠도는 별들’이 자연스럽고 형태도 보존합니다.
  - severity: low
    issue: ‘그들을 위하여는’
    rationale: 조사 결합이 부자연스럽습니다. οἷς의 수혜/관계 용법은 ‘그들을 위해’로 자연스럽게 옮길 수 있습니다.
  revised_text: 자기들의 수치를 거품으로 뿜어내는 바다의 거친 파도들, 떠도는 별들—그들을 위해 어둠의 흑암이 영원토록 예비되어 있습니다.
