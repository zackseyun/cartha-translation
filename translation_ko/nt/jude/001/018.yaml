source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you, "In the last time there will be mockers, going according to their own ungodly desires."
translation:
  language: ko
  text: 그들은 여러분에게 이렇게 말하곤 했습니다. “마지막 때에 자기들의 불경건한 욕망을 따라 살아가는 조롱하는 자들이 있을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον ὑμῖν
  english_pob_choice: were saying to you
  chosen_korean: 여러분에게 ... 말하곤 했습니다
  alternatives_korean:
  - 여러분에게 말씀하시기를
  - 여러분에게 거듭 말씀하셨기를
  lexicon: BDAG
  rationale: 미완료 ἔλεγον의 반복·습관 함의를 「말하곤 했다」로 살린다 — 사도들이 거듭 가르쳤음을 함의.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  english_pob_choice: In the last time
  chosen_korean: 마지막 때에
  alternatives_korean:
  - 종말의 때에
  - 말세에
  lexicon: BDAG
  rationale: 종말론적 정형 표현 「마지막 때」. 「말세」도 한국 교회 정착 어휘이나 「마지막 때」가 합쇼체에 더 자연스럽다.
- source_word: ἐμπαῖκται
  english_pob_choice: mockers
  chosen_korean: 조롱하는 자들
  alternatives_korean:
  - 비웃는 자들
  - 희롱하는 자들
  lexicon: BDAG
  rationale: ἐμπαίκτης(「조롱하는·비웃는 자」 — 벧후 3:3 평행)는 거룩한 것을 우습게 여기는 자. 「조롱하는 자」가 종말론적 정형.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας ... τῶν ἀσεβειῶν
  english_pob_choice: according to their own ungodly desires
  chosen_korean: 자기 경건치 않은 정욕대로
  alternatives_korean:
  - 자기들의 불경건한 욕심대로
  - 자기 경건치 못한 욕망대로
  lexicon: BDAG
  rationale: τῶν ἀσεβειῶν의 속격은 「경건치 않음의(부류·성질의)」 — ἐπιθυμίας를 한정한다. 「경건치 않은 정욕」이 한 어구로 그 부정적 의미를 살린다. 16절의 「자기 정욕대로」와 연결.
