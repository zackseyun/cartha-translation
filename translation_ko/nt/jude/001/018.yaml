review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the imperfect force of ἔλεγον, the singular eschatological expression ἐπ’ ἐσχάτου χρόνου, and the future ἔσονται. However, 「일어나」 adds an idea not expressed by ἔσονται, and 「경건치 않은 정욕」 is both archaic in form and may unduly narrow ἐπιθυμίαι toward sexual lusts. The participle πορευόμενοι is better represented as a characterization of the mockers' manner of life.
  naturalness: 「경건치 않은」 is not preferred modern standard Korean; 「불경건한」 is natural and formal. Recasting the participial phrase as 「…따라 살아가는 조롱하는 자들」 is clear, idiomatic, and retains its modifying relationship to the mockers.
  terminology: 「마지막 때」 suitably preserves the singular χρόνος without importing 「마지막 날들」. 「조롱하는 자들」 is an appropriate modern rendering of ἐμπαῖκται. 「불경건한 욕망」 conveys the moral-religious force of ἀσεβειῶν without restricting ἐπιθυμίαι to sexual desire.
  issues:
  - severity: medium
    issue: 「일어나」 has no direct source counterpart.
    rationale: ἔσονται means “there will be,” not specifically “will arise.” Adding “arise” can imply an emergence emphasis absent from this wording.
  - severity: medium
    issue: 「경건치 않은 정욕」 is dated and potentially too narrow.
    rationale: Modern formal Korean normally uses 「불경건한」 rather than 「경건치 않은」. 「정욕」 often suggests sexual lust in contemporary Korean, whereas ἐπιθυμίαι is broader; 「욕망」 better preserves that breadth.
  - severity: low
    issue: The participial relationship of πορευόμενοι can be expressed more directly.
    rationale: Placing 「…따라 살아가는」 directly before 「조롱하는 자들」 makes clear that their conduct characterizes the mockers.
  revised_text: 그들은 여러분에게 이렇게 말하곤 했습니다. “마지막 때에 자기들의 불경건한 욕망을 따라 살아가는 조롱하는 자들이 있을 것입니다.”
  revised_footnotes: []
  revision_rationale: The revision retains the repeated-past nuance of the imperfect 「말하곤 했습니다」, the singular 「마지막 때」, and the future prediction 「있을 것입니다」. It removes the unsupported addition 「일어나」 and uses current formal Korean to render the broad, morally qualified desires and the participial description of the mockers.
