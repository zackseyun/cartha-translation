lexical_decisions:
- source_word: ἐλεᾶτε
  english_pob_choice: have mercy on
  chosen_korean: 자비를 베푸십시오
  alternatives_korean:
  - 긍휼히 여기십시오
  - 자비를 행하십시오
  lexicon: BDAG
  rationale: 2절·21절의 ἔλεος를 「자비」로 옮긴 결정과 일관되게 동사 ἐλεάω를 「자비를 베풀다」로 옮긴다.
- source_word: διακρινομένους
