  - 의심하는 자들
  - 흔들거리는 자들
  - 갈라진 마음을 가진 자들
  lexicon: BDAG
  rationale: διακρίνομαι(중간/수동 의미「자기 안에서 분열되다·의심하다·흔들리다」)는 신앙의 동요를 가리킴(약 1:6 평행). 「흔들리는 자들」이 의심·동요·확신 부족의 다층 의미를 살린다. 9절의 διακρινόμενος(「다투는」)는 능동·외부 갈등 의미이므로 구별.
