  source_fidelity: 「이제」는 그리스어 본문에 명시적으로 대응하는 시간 부사가 아니므로 삭제하는 것이 적절합니다. ἵνα절은 명령·권면의 내용으로 자연스럽게 연결하되, μετὰ ἡσυχίας ἐργαζόμενοι와 τὸν ἑαυτῶν ἄρτον ἐσθίωσιν의 관계를 보존했습니다.
  naturalness: 기존의 「명하며 또한 권합니다. 곧 … 한다는 것입니다」는 병렬 동사와 ἵνα절의 연결이 다소 부자연스럽고, 「곧」「것입니다」가 원문에 없는 설명적 거리를 더합니다. 「… 먹도록 명하고 권합니다」가 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: κύριος는 「주」, Ἰησοῦς는 「예수」, 칭호 Χριστός는 정책에 따라 「메시아」로 유지했습니다. 「자기 양식」은 여기서 자기 노동으로 얻는 생계를 뜻하는 문맥적 의미를 자연스럽게 드러내며, 문자적 「빵」은 각주로 보완합니다.
