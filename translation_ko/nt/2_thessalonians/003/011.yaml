base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: ko
  text: 우리는 여러분 가운데 어떤 이들이 무질서하게 행하며[a], 아무 일도 하지 않고 도리어 남의 일에 참견한다는 말을 듣습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「게으르게 살며」. 헬라어 ἀτάκτως는 질서나 규율을 벗어난 행동을 가리키며, 이 문맥에서는 게으름의 함의도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로 「참견꾼이 되어」. 헬라어는 ‘일하다’(ἐργάζομαι)와 ‘쓸데없이 일에 관여하다, 참견하다’(περιεργάζομαι)를 대비하여 말놀이를 이룹니다.
    reason: lexical_alternative
