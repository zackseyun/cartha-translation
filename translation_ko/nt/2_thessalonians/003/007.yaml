  terminology: ‘본받다’, ‘무질서하게 행하다’, ‘여러분 가운데서’는 원문의 의미와 문맥에 적합합니다. ‘게으르게 지내다’는 본문의 주된 번역이 아니라 정황상 가능한 좁은 대안으로 각주에 두는 것이 타당합니다.
  issues:
