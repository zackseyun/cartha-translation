review_pass:
  verdict: revise
  source_fidelity: 초두의 καὶ는 앞 문맥에 잇는 접속사로, 「그러나」가 나타내는 역접보다 「또」 또는 생략이 더 충실합니다. 또한 νουθετεῖτε는 단순한 격려의 「권면하다」보다 교정적 권고를 뜻하므로 「타이르다」가 문맥과 어휘 의미를 더 잘 반영합니다. 「그를 형제로 대하고 타이르십시오」는 δεύτε 번째 ὡς ἀδελφόν의 관계적 뉘앙스를 자연스러운 한국어로 보존합니다.
  naturalness: 개정문은 현대 표준어 합쇼체로 자연스럽고, 교회 공동체 맥락의 절제된 권면 어조를 유지합니다.
  terminology: 「원수」와 「형제」는 각각 ἐχθρόν과 ἀδελφόν에 적절합니다. 「형제」의 공동체 구성원에 대한 대표적 용법은 각주로 유지합니다.
  issues:
  - severity: medium
    issue: 「그러나」
    rationale: 그리스어는 καὶ μὴ … ἀλλὰ로, 절 내부에는 ‘…하지 말고 …하라’의 대조가 있으나 절두 καὶ 자체는 역접 접속사로 명시되지 않았습니다. 「그러나」는 불필요하게 강한 역접을 더합니다.
  - severity: medium
    issue: 「권면하십시오」
    rationale: νουθετεῖτε는 교정과 경고를 수반하는 타이름/훈계의 뜻입니다. 「권면하다」는 한국어에서 격려·권유로도 흔히 이해되어 교정적 힘이 약해질 수 있습니다.
  revised_text: 또 그를 원수[a]로 여기지 말고, 형제로 대하고 타이르십시오.
  revised_footnotes:
  - marker: a
    text: 또는 「적」, 「대적」.
    reason: lexical_alternative
  - marker: b
    text: 본 문맥에서 「형제」는 같은 신앙 공동체의 일원을 가리킨다. 이 호칭은 대표적으로 사용될 수 있다.
    reason: cultural_note
  revision_rationale: '접속사 καὶ의 기본적 연결 기능을 「또」로 반영하고, νουθετέω의 교정적·목회적 의미를 「타이르십시오」로 명료하게 옮겼습니다. 「형제로 대하고」는 원문이 요구하는 ‘형제로서의 관계 안에서’ 타이르라는 뜻을 자연스럽게 표현합니다. 각주 표지는 본문에서 각각 한 번씩 사용되도록 b 표지도 「형제」 뒤에 유지해야 합니다. 완성 본문은 다음과 같습니다: 「또 그를 원수[a]로 여기지 말고, 형제[b]로 대하고 타이르십시오.」'
