review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 δεύτε 절의 ὡς ἀδελφόν은 ‘형제로 알고’보다 ‘형제로서’(또는 ‘형제에게 하듯’)가 더 직접적으로 ὡς의 방식·관계의 뉘앙스를 드러냅니다. 또한 νουθετεῖτε는 단순한 격려를 뜻할 수 있는 ‘권면하십시오’보다 교정적 경고를 포함하는 ‘타이르십시오’가 문맥과 어휘 의미에 더 맞습니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. ‘그러나’는 원문의 καὶ와 앞 절에 연결되는 흐름을 다소 강하게 역접화하므로 ‘또한’ 또는 접속사 없이 옮기는 편이 더 가깝습니다. ‘형제로 알고 권면하십시오’는 의미상 가능하지만, 현대 한국어에서는 ‘형제로서 타이르십시오’가 더 명료하고 자연스럽습니다.
  terminology: ‘원수’와 ‘형제’는 적절합니다. ‘원수’의 대안으로 ‘적’은 가능하나, ‘대적’은 이 문맥에서 불필요하게 신학적·문학적인 색채를 더할 수 있습니다. νουθετέω의 교정적 성격을 살려 ‘타이르십시오’를 채택합니다.
  issues:
  - severity: medium
    issue: νουθετεῖτε를 ‘권면하십시오’로 번역함
    rationale: ‘권면하다’는 격려·권유의 의미로도 넓게 쓰여 교정적 경고의 힘이 약해질 수 있습니다. νουθετέω는 잘못을 바로잡도록 경고하고 타이르는 행위를 가리키므로 ‘타이르십시오’가 더 충실합니다.
  - severity: low
    issue: ὡς ἀδελφόν을 ‘형제로 알고’로 표현함
    rationale: 원문은 상대를 형제라고 인지한다는 내용보다 형제로서 대하는 방식으로 타이르라는 대조를 나타냅니다. ‘형제로서’가 이를 더 직접적으로 보존합니다.
  - severity: low
    issue: καὶ를 ‘그러나’로 옮김
    rationale: 원문에는 μὴ ... ἀλλὰ 내부의 대조가 이미 있으며, καὶ 자체는 앞 문맥을 잇는 접속입니다. ‘그러나’는 원문보다 역접을 강화할 수 있습니다.
  revised_text: 그를 원수[a]로 여기지 말고, 형제로서 타이르십시오.
  revised_footnotes:
  - marker: a
    text: 또는 「적」.
    reason: lexical_alternative
  - marker: b
    text: 「형제」는 같은 신앙 공동체의 일원을 가리키며, 남성형 호칭이 대표적으로 사용될 수 있다.
    reason: cultural_note
  revision_rationale: 원문의 대조 구조(‘원수로 여기지 말고 … 형제로서’)를 한국어에서 선명하게 살리고, νουθετεῖτε의 교정적·목회적 의미를 ‘타이르십시오’로 반영했습니다. 본문에는 b 표지가 없으므로 각주 표지를 ‘형제’에 붙여 구조적 일관성을 바로잡았습니다.
