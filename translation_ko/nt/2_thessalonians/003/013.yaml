  source_fidelity: 원문의 δέ가 나타내는 앞 문맥과의 대조는 「그러나」로 반영되었고, 「선을 행하다가 낙심하지 마십시오」도 μὴ ἐγκακήσητε καλοποιοῦντες의 지속적 선행 가운데 지치거나 용기를 잃지 말라는 뜻을 자연스럽게 전달합니다. 다만 강조되어 앞에 놓인 ὑμεῖς(‘여러분은’)가 현행 본문에는 명시되지 않아, 원문의 대조적 강조를 더 분명히 드러내는 것이 좋습니다.
  naturalness: 「그러나 형제 여러분은 선을 행하다가 낙심하지 마십시오」는 현대 표준 한국어의 합쇼체로 자연스럽고 간결합니다. 「형제 여러분은」은 호칭과 대조되는 주어를 함께 자연스럽게 처리합니다.
  terminology: ἀδελφοί는 본문에서 「형제 여러분」으로 유지할 수 있습니다. 다만 각주의 「회중 전체를 대표적으로 가리킨다」는 포괄성을 단정하는 표현이므로, 원문의 문법적 성별과 공동체 전체를 포괄할 수 있는 용법을 구분하여 가능성으로 설명하는 편이 영어 POB 감사 기록 및 해석상 신중함에 더 부합합니다.
