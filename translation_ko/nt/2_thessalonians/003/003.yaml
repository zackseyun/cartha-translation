  naturalness: ‘그러나 주는 신실하시니’는 성서 문체로는 가능하지만, 요청된 현대 합쇼체에서는 ‘그러나 주님은 신실하십니다’가 더 자연스럽고 명료합니다. 또한 ‘악한 자로부터 지켜 주시다’보다 ‘악한 자에게서 지켜 주시다’가 현대 한국어에서 더 자연스럽습니다.
