review_pass:
  verdict: revise
  source_fidelity: 헬라어의 목적절(ἵνα)과 수동태 ῥυσθῶμεν은 ‘우리가 … 건짐을 받도록’으로 자연스럽게 보존했습니다. ἄτοπος와 πονηρός의 구별을 유지하여 ‘부당하고 악한’으로 옮겼으며, 마지막 절의 타원적 표현은 ‘모든 사람이 믿음을 가진 것은 아니다’로 충실히 풀었습니다.
  naturalness: 초안의 ‘비뚤어지고 악한 사람들’은 사람을 수식할 때 다소 구어적이고 의미 범위가 좁아질 수 있습니다. ‘부당하고 악한 사람들’은 현대 표준어 합쇼체에서 자연스럽고, 두 형용사의 병렬도 분명합니다. 또한 ‘모든 사람이 다’의 중복을 덜었습니다.
  terminology: ῥύομαι는 구원론적 의미를 과도하게 부여하지 않는 ‘건짐을 받다’로 유지했습니다. πίστις는 본문의 기본 의미대로 ‘믿음’으로 옮기고, 가능한 ‘신실함’ 해석은 각주에 보존했습니다. ἄτοπος의 대안 의미도 각주에 유지했습니다.
  issues:
  - severity: medium
    issue: ἀτόπων을 ‘비뚤어지고’로 번역함
    rationale: ‘비뚤어진 사람’은 한국어에서 성격·태도상의 왜곡을 강하게 떠올리게 하며, 여기의 ἄτοπος가 지닌 ‘부당한, 부적절한, 불합리한’ 의미를 충분히 드러내지 못할 수 있습니다. ‘부당하고’가 문맥과 어휘 범위를 더 잘 반영합니다.
  - severity: low
    issue: ‘모든 사람이 다’의 중복 및 b 각주 표지 위치
    rationale: ‘모든 사람’에 ‘다’를 더하면 불필요하게 중복됩니다. 또한 문장부호 앞에 각주 표지를 두어 한국어 본문 표기 관례에 맞추는 것이 좋습니다.
  revised_text: 또 우리가 부당하고 악한 사람들에게서 건짐을 받도록 기도해 주십시오. 모든 사람이 믿음을 가진 것은 아니기 때문입니다[b].
  revised_footnotes:
  - marker: a
    text: 또는 「불합리하고 악한 사람들」. 헬라어 ἄτοπος는 「부당한」, 「부적절한」, 「불합리한」을 뜻하며, 이 문맥에서는 도덕적으로 어긋난 적대자들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「모든 사람이 신실한 것은 아니기 때문입니다」. 헬라어는 문자적으로 「믿음은 모든 사람의 것이 아니기 때문이다」입니다.
    reason: alternative_reading
  revision_rationale: ‘부당하고 악한’은 ἀτόπων καὶ πονηρῶν의 의미 구별을 보다 정확하고 자연스러운 한국어로 전달합니다. 목적을 나타내는 ἵνα절은 ‘건짐을 받도록 기도해 주십시오’로 명확히 연결했습니다. b 각주는 본문에 실제로 앵커되도록 유지했고, a는 본문 번역에 적용되지 않은 어휘 대안을 보존하되 앵커 없이 제시하지 않도록 본문에 [a]를 배치할 필요가 있습니다.
