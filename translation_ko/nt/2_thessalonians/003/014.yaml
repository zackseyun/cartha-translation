    issue: 「표시해 두고」의 의미가 지나치게 물리적일 수 있음
    rationale: σημειοῦσθε는 여기서 불순종하는 사람을 알아보고 지목하라는 뜻이지, 그 사람에게 물리적 표지를 하라는 뜻은 아닙니다.
  - severity: low
    issue: 「이 편지를 통한 우리의 말」이 부자연스러운 연결임
    rationale: διά τῆς ἐπιστολῆς의 수단 의미는 유지하되 「이 편지로 전한」으로 표현하는 편이 자연스럽습니다.
  - severity: low
    issue: 목적절의 한국어 표현 개선 필요
    rationale: 「부끄러움을 느끼게 하기 위함입니다」보다 「그가 부끄러워하게 하려는 것입니다」가 ἵνα ἐντραπῇ의 목적절과 능동적 권면의 취지를 더 명확히 반영합니다.
