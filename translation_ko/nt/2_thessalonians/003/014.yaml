review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 잘 보존되어 있습니다. 다만 「이 편지를 통한 우리의 말」은 한국어에서 수식 관계가 다소 어색하며, διά τῆς ἐπιστολῆς가 가리키는 ‘편지를 통하여 전달된’ 사도적 말을 더 분명히 표현할 수 있습니다. 목적절도 「부끄러움을 느끼게 하기 위함입니다」보다 주어와 목적을 드러낸 표현이 원문의 ἵνα ἐντραπῇ에 더 가깝습니다.
  naturalness: 합쇼체와 전반적 문체는 적절합니다. 그러나 「그 사람을 표시해 두고」는 물리적으로 표식을 하거나 낙인찍는다는 인상을 줄 수 있습니다. σημειοῦσθε의 문맥상 식별하고 유의한다는 뜻을 자연스럽게 나타내는 「특별히 알아 두고」가 더 적합합니다.
  terminology: 「순종하다」, 「어울리지 마십시오」, 「부끄러워하게」는 원문의 권면·교정 문맥을 충실히 반영합니다. 15절 인용형 주석은 본문 표현에 맞추어 「형제로 여기고 권면」으로 고치는 것이 정확합니다.
  issues:
  - severity: medium
    issue: 「그 사람을 표시해 두고」의 표현
    rationale: σημειοῦσθε는 해당 사람을 식별·유의하라는 뜻이지만, 「표시하다」는 한국어에서 낙인이나 외적 표식을 연상시킬 수 있습니다.
  - severity: low
    issue: 「이 편지를 통한 우리의 말」의 수식 관계
    rationale: 문법적으로 가능하나 현대 한국어로 다소 경직되어 있습니다. 편지를 통해 전달되는 말을 명시하면 의미와 흐름이 더 선명합니다.
  - severity: low
    issue: d 주석의 15절 표현
    rationale: 15절은 그를 ‘형제로 여기고 권면하라’고 하므로, 「형제로서 권면」보다 이를 정확히 반영하는 편이 좋습니다.
  revised_text: 만일 누구든지 이 편지를 통해 전한 우리의 말에 순종하지 않으면, 그 사람을 특별히 알아 두고[b] 그와 어울리지 마십시오[c]. 그가 부끄러워하게 하려는 것입니다[d].
  revised_footnotes:
  - marker: a
    text: 또는 「이 편지로」, 「이 편지에서」. 헬라어 διά + 속격은 가르침이 전달되는 수단을 가리킬 수 있다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「지목하라」, 「표시하라」.
    reason: lexical_alternative
  - marker: c
    text: 또는 「그와 가까이 지내지 마십시오」.
    reason: lexical_alternative
  - marker: d
    text: 목적은 교정적이다. 15절을 보면 그 사람을 여전히 「형제로 여기고 권면」하라고 한다.
    reason: cross_reference
  revision_rationale: 「특별히 알아 두고」는 σημειοῦσθε의 식별·유의 의미를 낙인적 뉘앙스 없이 옮깁니다. 「이 편지를 통해 전한 우리의 말」은 편지가 사도적 지시를 전달하는 수단이라는 διά의 기능을 자연스러운 한국어로 드러냅니다. 또한 목적절과 문맥 주석을 더 정확하고 자연스럽게 다듬었습니다.
