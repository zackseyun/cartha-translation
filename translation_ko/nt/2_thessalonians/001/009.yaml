revisions:
- from: 이들은 영원한 멸망의 형벌을 받을 것이니, 주의 얼굴로부터 그리고 그분의 강력하신 영광으로부터 떨어져 있을 것입니다[a].
  to: 이들은 주의 임재와 그분의 능력의 영광에서 멀어진 채 영원한 멸망이라는 형벌을 받을 것입니다[a].
  rationale: 본문은 ἀπό를 분리로 이해하되, 한국어 관용에 맞게 「임재」와 「멀어진 채」를 사용했습니다. 출처/기원으로 이해할 수 있는 문법적 가능성은 각주에 유지했습니다. 또한 형벌과 영원한 멸망의 동격 관계 및 ‘능력의 영광’이라는 속격 관계를 명확히 했으며, 멸망의 양상에 관한 교리적 결론은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:48:26Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 법정 표현과 종말론적 어구는 대체로 반영되었으나, 「영원한 멸망의 형벌」은 ὄλεθρον αἰώνιον이 형벌의 내용을 동격으로 설명하는 관계를 충분히 드러내지 못합니다. 또한 τῆς δόξης τῆς ἰσχύος αὐτοῦ는 「그분의 강력하신 영광」보다 「그분의 능력의 영광」으로 옮겨야 소유/속격 관계를 보존합니다.
  naturalness: 「주의 얼굴로부터 ... 떨어져 있을 것입니다」는 현대 표준 한국어에서 다소 직역투이며, 「강력하신 영광」도 자연스럽지 않습니다. 「주의 임재와 그분의 능력의 영광에서 멀어진 채」는 합쇼체 문맥에서 자연스럽고, 분리라는 본문 선택도 유지합니다.
  terminology: κύριος는 「주」, δόξα는 「영광」, ἰσχύς는 「능력」으로 일관되게 옮겼습니다. 「임재」는 πρόσωπον의 관용적 의미를 자연스럽게 전달하며, 대안인 출처 해석은 각주에서 보존합니다.
  issues:
  - severity: medium
    issue: 「영원한 멸망의 형벌」의 관계가 불분명함
    rationale: δίκην τίσουσιν ὄλεθρον αἰώνιον은 ‘영원한 멸망이라는 형벌/벌’을 치른다는 동격적 구조입니다. 현 번역은 ‘멸망에 대한 형벌’로도 읽힐 수 있으므로 「영원한 멸망이라는 형벌」로 명시하는 것이 안전합니다.
  - severity: medium
    issue: 「그분의 강력하신 영광」이 속격 구조를 약화하고 한국어로 부자연스러움
    rationale: τῆς δόξης τῆς ἰσχύος αὐτοῦ는 문자상 ‘그분의 능력의 영광’입니다. ‘강력하신 영광’은 ἰσχύος를 영광의 형용사로 바꾸어 원문의 관계를 흐립니다.
  - severity: low
    issue: 「주의 얼굴로부터 ... 떨어져 있을 것입니다」가 직역투임
    rationale: πρόσωπον은 이 문맥에서 ‘임재’가 자연스러운 한국어 관용 표현입니다. 「멀어진 채」는 분리/배제라는 선택된 독법을 유지하면서 문장을 매끄럽게 합니다.
  revised_text: 이들은 주의 임재와 그분의 능력의 영광에서 멀어진 채 영원한 멸망이라는 형벌을 받을 것입니다[a].
