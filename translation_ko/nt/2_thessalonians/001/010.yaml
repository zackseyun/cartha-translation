  terminology: 「성도들」과 「영광을 받으시고」는 적절합니다. 「믿은 모든 사람들」은 πιστεύσασιν의 분사적 의미를 보존하면서 「모든 자들」보다 현대 한국어에서 자연스럽습니다. ἐν의 「가운데서/안에서」 양의성을 각주로 보존합니다.
