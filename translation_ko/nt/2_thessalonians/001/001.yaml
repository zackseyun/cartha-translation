  terminology: '''실루아노'', ''디모데'', ''주'', ''메시아'', ''회중''은 주어진 번역 원칙과 일치합니다. 각주 a와 b의 대안 자체는 유효하지만, 현행 각주는 독자용 대안 주석이라기보다 번역 정책과 해설을 제시합니다. 특히 ''후대의 제도적 함의''를 약화한다는 설명은 본문의 어휘 의미를 넘는 편집적 정당화이므로 간결한 대안 표기로 고치는 것이 중립적입니다.'
