  source_fidelity: 수정이 필요합니다. τὸ ὄνομα(이름)는 비인격 명사이므로 ‘영광 받으시고’의 높임말은 부적절합니다. 또한 마지막 κατὰ τὴν χάριν 구는 앞의 목적/기도 내용의 근거를 나타내므로, ‘이는 … 것입니다’로 독립시키기보다 ‘은혜에 따라’로 연결하는 편이 원문에 더 가깝습니다. 영어 감사 추적에 있는 마지막 소유격구의 해석상 쟁점 각주도 보완해야 합니다.
