  terminology: κύριος는 ‘주’, χάρις는 ‘은혜’, Χριστός는 본 프로젝트 원칙에 따라 ‘메시아’로 유지했습니다. αὐτῷ는 문맥상 주 예수를 가리키는 ‘그분’으로 옮겼습니다. 마지막 구문의 단일 지시/두 지시 논쟁은 본문에서 결정하지 않고 각주로 밝혔습니다.
