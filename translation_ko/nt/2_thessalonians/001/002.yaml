  source_fidelity: 그리스어 본문은 θεοῦ πατρὸς이며 ‘우리’(ἡμῶν)를 포함하지 않습니다. 따라서 ‘우리 아버지 하나님’은 본문에 없는 소유·관계 표현을 보충합니다. 나머지 요소인 ‘은혜’, ‘평강’, ‘~께로부터’, ‘주 예수 메시아’는 본문의 의미와 문법적 관계를 충실히 반영합니다.
  naturalness: ‘하나님 아버지와 주 예수 메시아께로부터 은혜와 평강이 여러분에게 있기를 빕니다’는 현대 표준어의 격식 있는 합쇼체 인사·축복문으로 자연스럽습니다. ‘메시아’는 한국어에서 칭호로 무관사로 쓸 수 있습니다.
  terminology: χάρις는 ‘은혜’, εἰρήνη는 ‘평강’, κύριος는 ‘주’, Χριστός는 칭호 의미를 살린 ‘메시아’로 유지합니다. ‘그리스도’는 가능한 대안으로 각주에 남깁니다.
  issues:
  - severity: medium
    issue: ‘우리’가 본문에 없는 채로 첨가되어 있습니다.
    rationale: 제시된 SBLGNT 본문은 θεοῦ πατρὸς라고만 하며 ἡμῶν(‘우리의’)을 읽지 않습니다. 영어 감사 기록의 관용적 보충을 한국어 번역이 그대로 따라갈 필요는 없으며, 한국어 ‘하나님 아버지’는 추가 소유대명사 없이도 자연스럽습니다.
  revised_text: 하나님 아버지와 주 예수 메시아께로부터 은혜와 평강이 여러분에게 있기를 빕니다.
  revised_footnotes:
