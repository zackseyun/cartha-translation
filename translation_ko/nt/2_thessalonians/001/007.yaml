review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 보존되었으나, 「그분의 능력의 천사들」은 헬라어 속격을 한국어에 기계적으로 옮긴 표현으로 자연스럽지 않습니다. ἀγγέλων δυνάμεως αὐτοῦ는 문맥상 주 예수의 능력에 속하거나 그 능력을 지닌 천사들을 가리키며, 「그분의 능력 있는 천사들」이 충실하면서도 자연스럽습니다. 또한 ἄνεσις는 현재의 환난과 대조되는 압박으로부터의 안도/안식입니다.
  naturalness: 현 문장은 「여러분에게는 … 우리와 함께 쉼을 주십니다」의 어순과 시제가 다소 부자연스럽고, 종말적 장면의 미래적 약속도 약하게 들립니다. 「안식을 주실 것입니다」로 옮기고 시간절을 앞세우면 현대 표준 한국어 합쇼체로 매끄럽습니다.
  terminology: 「환난을 겪고 있는」은 현재 수동 분사의 뜻과 앞 절의 환난 어휘를 잘 연결합니다. κύριος Ἰησοῦ는 「주 예수」로 유지합니다. 「계시되실 때」와 「드러나실 때」는 ἀποκάλυψις의 가능한 대안으로 각주에 보존합니다.
  issues:
  - severity: medium
    issue: 「그분의 능력의 천사들」은 비자연적인 직역입니다.
    rationale: 한국어에서 ‘능력의 천사들’은 천사들이 누구의 능력인지 또는 어떤 능력을 뜻하는지 불명료합니다. 헬라어의 질적/연관 속격을 「그분의 능력 있는 천사들」로 옮기면 원문의 범위를 부당하게 좁히지 않으면서 자연스럽습니다.
  - severity: low
    issue: 「쉼을 주십니다」의 시제와 문장 연결이 문맥상 매끄럽지 않습니다.
    rationale: 이 구절은 앞 절의 하나님의 장래 보응 약속에 이어지는 목적어 구조입니다. 한국어 독립 문장에서는 미래 약속을 드러내는 「안식을 주실 것입니다」가 자연스럽고 의미를 보완합니다.
  revised_text: 또한 환난을 겪고 있는 여러분에게는, 주 예수께서 하늘로부터 그분의 능력 있는 천사들과 함께 나타나실[a] 때에 우리와 함께 안식을 주실 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「계시되실 때」, 「드러나실 때」. 헬라어 ἀποκάλυψις는 가려진 것이 드러나는 종말론적 나타남을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 능력의 천사들이라는 기계적 속격 직역을 한국어에서 자연스럽고 원문의 질적 의미를 보존하는 「그분의 능력 있는 천사들」로 고쳤습니다. 또한 장래의 안도라는 약속을 「안식을 주실 것입니다」로 명확히 하고, 문장 어순을 다듬었습니다. 계시/드러남이라는 ἀποκάλυψις의 어휘적 폭은 각주에 유지했습니다.
