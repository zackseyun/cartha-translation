review_pass:
  verdict: revise
  source_fidelity: 원문의 ἄνεσιν은 환난받는 이들에게 약속된 ‘쉼/해방’이며, 그 시점은 주 예수의 계시(나타나심)입니다. 초안은 ‘주 예수께서 … 쉼을 주십니다’로 읽혀, 원문에서 앞 절의 문맥상 함축된 수여 행위를 주 예수께 명시적으로 귀속시키고 현재형 서술로 바꾸는 문제가 있습니다. 또한 ἐν τῇ ἀποκαλύψει의 시간 관계가 더 분명히 드러나도록 조정했습니다.
  naturalness: ‘능력의 천사들’은 원문의 압축된 속격을 보존하는 면은 있으나 현대 한국어에서는 다소 부자연스럽습니다. 본문에서는 자연스러운 질적 표현인 ‘그분의 능력 있는 천사들’을 사용하고, 각주에서 원문에 가까운 표현을 제시했습니다. ‘쉼이 있을 것입니다’는 한국어에서 자연스럽고, 압박의 해소라는 ἄνεσις의 문맥적 뜻을 유지합니다.
  terminology: θλιβομένοις는 ‘환난을 받고 있는’으로 유지했습니다. κύριος Ἰησοῦ는 ‘주 예수’로, ἀποκάλυψις는 본문에서 시간절로 자연스럽게 ‘나타나실 때’로 옮겼습니다. ἀγγέλων δυνάμεως αὐτοῦ는 ‘그분의 능력 있는 천사들’로 번역하되, 속격 구조의 대안은 각주에 보존했습니다.
  issues:
  - severity: medium
    issue: 주 예수께서 쉼을 ‘주십니다’라는 명시적 주어·현재형 서술
    rationale: 이 절의 ἄνεσιν은 앞 절의 문맥에 의존하는 목적어이며, 주 예수의 나타나심은 쉼의 시점입니다. 초안의 문장은 예수를 ‘쉼을 주시는’ 명시적 주어로 만들고 현재형으로 진술합니다.
  - severity: low
    issue: ‘그분의 능력의 천사들’의 현대 한국어 자연성
    rationale: 원문의 속격을 기계적으로 재현한 표현으로 이해는 가능하지만 현대 표준어로는 어색합니다. ‘능력 있는 천사들’이 질적 속격의 자연스러운 번역이며, 직역적 가능성은 각주로 보존할 수 있습니다.
  revised_text: 또 환난을 받고 있는 여러분에게는 우리와 함께 쉼이 있을 것입니다. 곧 주 예수께서 그분의 능력 있는 천사들과 함께 하늘로부터 나타나실[a] 때에 말입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「계시되실 때」, 「드러나실 때」. 헬라어 ἀποκάλυψις는 가려진 것을 드러내는 종말론적 나타남을 가리킨다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 「그분의 능력의 천사들과 함께」. 또는 「그분의 권능에 속한 천사들과 함께」로 이해할 수 있다.
    reason: lexical_alternative
  revision_rationale: 원문의 시간 관계와 문맥상 함축된 수여 행위를 보존하기 위해 쉼의 약속을 ‘쉼이 있을 것입니다’로 표현하고, 주 예수의 나타나심을 그 시점으로 분명히 했습니다. 능력의 천사들이라는 압축된 속격은 본문에서 자연스러운 한국어로 옮기고 각주에 직역적 대안을 보존했습니다.
