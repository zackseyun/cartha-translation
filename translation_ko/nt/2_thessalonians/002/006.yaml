  - severity: low
    issue: 「이는 그가 … 하기 위함입니다」의 지시 및 종결 방식
    rationale: 문법 오류는 아니지만 ‘이는’의 선행 대상과 목적 관계가 다소 느슨합니다. 제한하는 것이 그가 자기 때에 드러나게 하려는 것이라는 관계를 동사형으로 명확히 하는 편이 자연스럽습니다.
