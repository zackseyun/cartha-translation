  to: 그러나 주의 사랑을 받은 형제[b] 여러분, 우리는 여러분에 대하여 언제나 하나님께 감사드려야 합니다. 하나님께서 성령으로 거룩하게 하심과 진리에 대한 믿음을 통하여 여러분을 구원을 위하여 첫 열매[a]로 택하셨기 때문입니다.
