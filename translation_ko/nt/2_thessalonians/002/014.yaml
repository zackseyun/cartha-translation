base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus Messiah.
translation:
  language: ko
  text: 이를 위하여 그분은 우리의 복음을 통하여 여러분을 부르셨습니다. 곧 여러분이 우리 주 예수 메시아[a]의 영광을 얻도록 하신 것입니다.
  philosophy: optimal-equivalence
  footnotes:
