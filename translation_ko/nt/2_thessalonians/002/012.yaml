review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 충실합니다. κριθῶσιν을 「심판을 받다」로 유지하고, 「정죄받다」를 각주 대안으로 둔 것은 원문의 사법적 표현과 문맥상의 불리한 함의를 균형 있게 보존합니다. 다만 「심판받게 하기 위함입니다」는 한국어에서 다소 겹쳐 들리므로, 목적절을 더 자연스럽고 명료하게 다듬는 것이 좋습니다.
  naturalness: 「모든 자들이」보다 「모든 사람이」가 현대 표준어 성경 문체에서 더 자연스럽습니다. 또한 「심판을 받도록 하기 위함입니다」가 합쇼체의 격식과 문장 흐름에 잘 맞습니다.
  terminology: 「진리」, 「불의」, 「심판」은 적절합니다. 「도리어」는 ἀλλά의 강한 대조를 자연스럽게 드러냅니다. 각주의 「헬라어」도 통용되지만, 현대 학술·성경 번역 관례상 「그리스어」가 더 중립적이고 자연스럽습니다.
  issues:
  - severity: low
    issue: 목적 표현의 어색한 중첩
    rationale: 「심판받게 하기 위함입니다」는 피동 표현과 「하기 위함」이 이어져 다소 무겁고 어색합니다. 「심판을 받도록 하기 위함입니다」로 다듬으면 의미를 바꾸지 않고 자연스러워집니다.
  - severity: low
    issue: 일반적 복수 지시 표현
    rationale: 「모든 자들이」도 틀리지는 않으나, 이 문맥에서는 「모든 사람이」가 보다 현대적이고 매끄럽습니다.
  revised_text: 이는 진리를 믿지 않고 도리어 불의를 기뻐한 모든 사람이 심판을 받도록 하기 위함입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「정죄받도록」. 그리스어 κρίνω는 본문 정황상 불리한 심판을 함의하나, 더 문자적으로는 「심판을 받다」를 뜻합니다.
    reason: lexical_alternative
  revision_rationale: 원문의 ἵνα 목적절, κριθῶσιν의 피동적·사법적 의미, 그리고 두 분사가 나타내는 대조를 보존했습니다. 문장만 현대 표준어 합쇼체에 맞게 매끄럽게 조정했으며, 「정죄」를 본문에 확정적으로 도입하지 않고 각주 대안으로 유지했습니다.
