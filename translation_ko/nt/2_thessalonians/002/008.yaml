    rationale: 그리스어 속격 구조를 기계적으로 겹친 표현이라 현대 한국어에서 부자연스럽습니다. 「그분께서 오셔서 나타나심으로」는 ἐπιφάνεια와 παρουσία의 결합 및 수단 여격을 자연스럽게 보존합니다.
  - severity: low
    issue: 「자기 입의 숨」
    rationale: 의미는 맞지만 한국어 결합이 매끄럽지 않습니다. 「그분의 입김」은 ‘입의 숨’이라는 관용적 의미를 자연스럽게 전달합니다.
  revised_text: 그때에 불법한 자가 드러날 것이며, 주 예수께서 그분의 입김[a]으로 그를 죽이시고 그분께서 오셔서 나타나심으로 그를 무력하게 하실 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「그분의 입의 영으로」. 헬라어 πνεῦμα는 「숨」 또는 「영」을 가리킬 수 있습니다. 여기서는 「입김」이 더 자연스러우며, 사 11:4 칠십인역과의 반향을 고려할 수 있습니다.
