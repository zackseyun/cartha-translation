    rationale: 원문은 ‘대적하는’ 것과 ‘모든 이른바 신 또는 경배 대상 위에 자신을 높이는’ 것을 καὶ로 병렬합니다. 한국어 초안은 「위로」가 「대적하며」에도 걸리는 듯하여 원문의 관계를 흐립니다.
