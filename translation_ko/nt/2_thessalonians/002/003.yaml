review_pass:
  verdict: revise
  source_fidelity: 본문의 「배교」는 ἀποστασία의 가능한 해석이지만, SBLGNT와 영어 POB가 의도적으로 보존한 폭넓은 뜻(반역·이탈)을 종교적 배교로 좁힙니다. 본문은 「반역」으로 하고 「배교」를 각주로 보존하는 편이 원문과 감사 기록에 더 충실합니다. 또한 ἀποκαλυφθῇ의 수동적 ‘드러남’을 「드러나기」로 옮기는 것이 적절합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. 「불법의 사람, 곧 멸망의 아들」은 원문의 동격 구조를 명료하게 드러냅니다.
  terminology: 「불법의 사람」과 「멸망의 아들」은 원문의 핵심 표현과 한국어 성경적 관용을 잘 보존합니다. 「반역」은 ἀποστασία의 의미 범위를 선결하지 않으며, 「배교」는 각주에서 대안으로 제시합니다.
  issues:
  - severity: medium
    issue: ἀποστασία를 본문에서 「배교」로 한정함
    rationale: ἀποστασία는 종교적 배교를 뜻할 수 있으나 반역·이탈도 뜻합니다. 제공된 영어 POB도 교리적 좁힘을 피하여 ‘rebellion’을 본문에 두었습니다. 따라서 한국어 본문도 넓은 「반역」을 택하고 「배교」를 각주에 두어야 합니다.
  - severity: low
    issue: ἀποκαλυφθῇ의 수동 뉘앙스가 「나타나기」에서 약화됨
    rationale: 「드러나기」는 누군가에 의해 밝혀지는 수동적 계시·현현의 뉘앙스를 더 잘 보존하면서도 자연스럽습니다.
  revised_text: 누구도 어떤 방법으로든 여러분을 속이지 못하게 하십시오. 먼저 반역[a]이 일어나고 불법의 사람, 곧 멸망의 아들이 드러나기 전에는 그날이 오지 않을 것이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 「배교」 또는 「떠나감」. 헬라어 ἀποστασία는 결정적인 반역이나 이탈을 뜻하며, 종교적 배교로 이해되기도 합니다.
    reason: alternative_reading
  - marker: b
    text: 일부 사본은 「죄의 사람」으로 읽습니다(τῆς ἁμαρτίας). SBLGNT는 「불법의 사람」(τῆς ἀνομίας)으로 읽습니다.
    reason: textual_variant
  revision_rationale: 원문 우선 원칙에 따라 ἀποστασία의 논쟁적인 의미 범위를 본문에서 보존했습니다. ἀποκαλυφθῇ는 「드러나기」로 옮겨 수동적 뉘앙스를 살렸고, 동격인 「멸망의 아들」을 「불법의 사람」 뒤에 명시했습니다. 사본 변이 각주 [b]는 본문 표현에 직접 연결되도록 「불법의 사람[b]」에 붙여야 합니다.
