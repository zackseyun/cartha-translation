    rationale: ‘그리스도의 재림을 흉내내는 패러디적 표현’은 원문의 어휘적 대안 자체가 아니라 해석입니다. 본 절의 번역 각주는 παρουσία의 가능한 번역어만 제시해야 합니다.
  - severity: low
    issue: 「동반합니다」의 주어-동작 결합이 다소 부자연스러움
    rationale: 「오심」이 능력·표적·기사를 동반한다고 할 수는 있으나, 「…과 함께 나타납니다」가 ἐν의 동반적 의미와 한국어 문장성을 더 잘 살립니다.
  revised_text: 그의 오심[a]은 사탄의 활동에 따라 이루어지며, 모든 능력과 거짓의 표적과 기사[b]와 함께 나타납니다.
