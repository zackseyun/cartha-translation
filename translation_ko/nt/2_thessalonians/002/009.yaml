    issue: ψεύδους의 수식 범위가 본문에서 지나치게 좁게 반영됨
    rationale: 「거짓의 기사」는 ψεύδους를 기사에만 연결합니다. ψεύδους가 표적과 기사를 함께 특징짓는 것으로 보는 해석이 자연스럽므로, 본문에는 「거짓의 표적과 기사」를 사용하고 좁은 연결은 각주에서 대안으로 보존하는 것이 좋습니다.
  - severity: low
