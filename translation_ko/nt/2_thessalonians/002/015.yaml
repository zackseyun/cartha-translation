  source_fidelity: 전반적으로 원문을 충실히 옮겼습니다. 다만 διὰ λόγου에는 소유격 ἡμῶν이 명시되어 있지 않고, ἡμῶν은 바로 뒤의 ἐπιστολῆς를 수식합니다. 따라서 ‘우리의 말로든 편지로든’보다 ‘말로든 우리의 편지로든’이 원문의 결속을 더 정확히 보존합니다. 또한 ἐδιδάχθητε의 수동 의미는 ‘배운’보다 ‘가르침을 받은’에서 더 분명합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘형제 여러분’은 호격으로 무난하며, ‘굳게 서서 … 굳게 붙드십시오’는 두 현재 명령의 지속적·강한 권면을 적절히 살립니다.
  terminology: παραδόσεις는 ‘전통’으로 유지하는 것이 적절합니다. 이는 전해진 것이라는 어휘적 의미와 구두·서신 전달의 대조를 보존하며, 후대 교파적 의미를 본문에 부과하지 않습니다. 각주는 ‘사도적’ 같은 본문 밖의 규정 대신 문맥상 전달 방식을 설명하도록 절제했습니다.
