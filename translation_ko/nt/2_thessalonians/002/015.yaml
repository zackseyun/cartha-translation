  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: ko
  text: 그러므로 형제[a] 여러분, 굳게 서서 말로든 우리의 편지로든 여러분이 가르침을 받은 전통[b]을 굳게 붙드십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἀδελφοί는 문자적으로 남성 복수 호격인 「형제들」이다. 이 호칭은 문맥상 회중 전체를 부르는 말일 가능성이 크다.
    reason: cultural_note
  - marker: b
    text: 또는 「가르침」, 「전해 받은 것」. 헬라어 παράδοσις는 전해진 것을 가리키며, 여기서는 말과 편지를 통해 전해진 내용을 뜻한다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  english_pob_choice: So then
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서 그렇다면
  - 그러니
  lexicon: BDAG
  rationale: 이중 추론 불변사의 결론 도입을 「그러므로」로 자연스럽게 옮긴다.
- source_word: ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제
  alternatives_korean:
