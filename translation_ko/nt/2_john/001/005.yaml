review_pass:
  verdict: revise
  source_fidelity: 현 번역의 「자매여」는 κυρία(‘부인/여주인/lady’)를 ‘자매’로 바꾸어 원문의 어휘적 의미와, 개인 여성·교회 의인화·고유명사 가능성이라는 의도적 모호성을 보존하지 못합니다. 또한 οὐχ ὡς ... γράφων ... ἀλλὰ의 비교 구문에서 ‘새 계명을 쓰는 것이 아니라, 처음부터 지닌 계명을 쓰는 것’이라는 대조를 더 명시해야 합니다.
  naturalness: 「부인이시여」와 「부인께」는 현대 표준어 합쇼체에서 다소 격식 있는 호칭이지만, 서신의 직접 호격과 원문의 존칭적 ‘lady’를 자연스럽게 반영합니다. 문장을 재구성하여 대조와 결론절의 연결도 명료하게 했습니다.
  terminology: 「새 계명」, 「처음부터」, 「서로 사랑하라」를 유지했습니다. 「부인」은 교회로 단정하지 않으면서 κυρία의 기본 뜻을 반영하며, 각주에서 가능한 비유적·고유명사적 이해를 제시합니다.
  issues:
  - severity: high
    issue: κυρία를 「자매여」로 번역함
    rationale: κυρία는 ‘자매’(ἀδελφή)가 아니라 ‘lady/부인’입니다. 「자매」는 신앙 공동체 구성원이라는 해석을 덧붙이고, 개인 여성인지 교회 의인화인지의 모호성을 좁힙니다.
  - severity: medium
    issue: οὐχ ὡς ... γράφων ... ἀλλά 구문의 대조가 불완전함
    rationale: 초안은 「새 계명을 써 보내는 것이 아니라, ... 그 계명입니다」라고 하여 ‘쓰는’ 행위의 비교 대조가 한국어에서 매끄럽게 병렬되지 않습니다. 후반에도 ‘계명을 쓰는 것’을 보충하여 원문의 구조를 드러내는 것이 안전합니다.
  - severity: low
    issue: ἵνα절을 「사랑하자는 것입니다」로 청유화함
    rationale: 공동의 권면이라는 뜻은 가능하지만, 이 절은 앞의 계명의 내용을 제시합니다. 「서로 사랑하라는 것입니다」가 계명의 내용이라는 연결을 더 직접적으로 나타냅니다.
  revised_text: 이제, 부인이시여[a], 제가 부인께 청합니다. 제가 새 계명을 부인께 쓰는 것이 아니라, 우리가 처음부터 가지고 있던 계명을 쓰는 것입니다. 곧 우리가 서로 사랑하라는 것입니다.
