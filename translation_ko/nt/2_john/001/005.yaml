- from: '이제 자매여, 내가 그대에게 청합니다. 새 계명을 써 보내는 것이 아니라, 우리가 처음부터 가지고 있던 그 계명입니다: 곧 우리가 서로 사랑하자는 것입니다.'
  to: 이제, 부인이시여[a], 제가 부인께 청합니다. 제가 새 계명을 부인께 쓰는 것이 아니라, 우리가 처음부터 가지고 있던 계명을 쓰는 것입니다. 곧 우리가 서로 사랑하라는 것입니다.
  rationale: κυρία를 「부인」으로 옮겨 기본 어휘 의미와 해석상 모호성을 보존하고, 각주로 교회 의인화 및 고유명사 가능성을 밝혔습니다. 비교 구문은 한국어에서 양쪽에 ‘쓰는 것’을 명시해 원문의 대조를 보존했습니다. 마지막 ἵνα절은 계명의 내용으로 자연스럽게 연결했습니다.
