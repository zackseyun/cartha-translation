id: 2JN.1.5
reference: 2 John 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you, lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: ko
  text: 이제, 부인이시여[a], 제가 부인께 청합니다. 제가 새 계명을 부인께 쓰는 것이 아니라, 우리가 처음부터 가지고 있던 계명을 쓰는 것입니다. 곧 우리가 서로 사랑하라는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 비유적으로 ‘교회’일 수 있습니다. 어떤 이들은 ‘퀴리아’를 고유명사로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ σε
  english_pob_choice: I ask you
  chosen_korean: 그대에게 청합니다
  alternatives_korean:
  - 그대에게 요청합니다
  - 그대에게 부탁합니다
  lexicon: BDAG
  rationale: 요한 문헌에서 ἐρωτάω는 단순 질문이 아닌 정중한 부탁·간청의 의미로 자주 쓰인다. 「청합니다」가 합쇼체 격식과 간청의 어감을 함께 담는다.
- source_word: κυρία
  english_pob_choice: lady
  chosen_korean: 자매여
  alternatives_korean:
  - 부인이여
  - 안주인이여
  lexicon: BDAG
  rationale: 1절의 ἐκλεκτῇ κυρίᾳ를 「택하심을 받은 자매」로 옮긴 결정과 일관되게 호격 κυρία를 「자매여」로 옮긴다. 「부인이여」는 lord-of-the-house 어감을 살리는 대안이다.
- source_word: ἐντολὴν καινὴν
  english_pob_choice: a new commandment
  chosen_korean: 새 계명
  alternatives_korean:
  - 새로운 계명
  lexicon: BDAG
  rationale: 요한복음 13:34과 요한1서 2:7-8의 「새 계명」 정형을 유지한다.
- source_word: ἀπ’ ἀρχῆς
  english_pob_choice: from the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 태초부터
  lexicon: BDAG
  rationale: 요한 문헌의 정형 표현 ἀπ’ ἀρχῆς를 「처음부터」로 일관되게 옮긴다.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  english_pob_choice: that we love one another
  chosen_korean: 우리가 서로 사랑하자는 것입니다
  alternatives_korean:
  - 우리가 서로 사랑해야 한다는 것입니다
  lexicon: BDAG
  rationale: 권면적 ἵνα + 가정법을 「하자는 것입니다」 청유형으로 옮겨 공동체 윤리의 부드러운 권면 음조를 살린다.
