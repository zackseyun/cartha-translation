  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace, mercy, and peace will be with us from God the Father and from Jesus Messiah, the Father's Son, in truth and love.
translation:
  language: ko
  text: 하나님 아버지께로부터, 또 아버지의 아들이신 예수 메시아[a]께로부터 은혜와 자비와 평강이 진리와 사랑 안에서 우리와 함께 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「그리스도」. Χριστός는 칭호이며, 본 번역에서는 이를 「메시아」로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις ἔλεος εἰρήνη
  english_pob_choice: Grace, mercy, and peace
  chosen_korean: 은혜와 자비와 평강
  alternatives_korean:
  - 은혜와 긍휼과 평강
  - 은총·자비·평화
  lexicon: BDAG
  rationale: 본 번역의 글로사리에 따라 ἀγάπη는 「사랑」, ἔλεος는 「자비」로 옮긴다(평행 어휘 분리 유지). 「평강」은 바울·요한 인사 정식의 한국 교회 전통 어휘를 살린다.
- source_word: Ἰησοῦ Χριστοῦ
  english_pob_choice: Jesus Messiah
  chosen_korean: 예수 메시아
  alternatives_korean:
  - 예수 그리스도
  lexicon: BDAG
  rationale: 칭호 Χριστός를 일관되게 「메시아」로 옮긴다.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  english_pob_choice: the Father's Son
  chosen_korean: 아버지의 아들
  alternatives_korean:
  - 아버지의 아들이신
  lexicon: BDAG
  rationale: 동격 구문을 그대로 보존하여 요한 신학의 부자(父子) 관계를 명시한다.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  english_pob_choice: in truth and love
  chosen_korean: 진리와 사랑 안에서
  alternatives_korean:
  - 참됨과 사랑으로
  lexicon: BDAG
  rationale: 처소격 ἐν을 「안에서」로 살려 요한 문헌의 정형성을 유지한다.
