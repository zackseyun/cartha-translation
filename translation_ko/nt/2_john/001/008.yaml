  text: Watch yourselves, so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: ko
  text: 우리가 수고하여 이룬 것을 잃지 않고 온전한 상을 받도록, 여러분 자신을 살피십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 어떤 사본에는 “우리가 수고하여 이룬 것” 대신 “여러분이 수고하여 이룬 것”이라고 되어 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  english_pob_choice: Watch yourselves
  chosen_korean: 여러분 자신을 살피십시오
  alternatives_korean:
  - 여러분 자신을 주의하십시오
  - 스스로를 살피십시오
  lexicon: BDAG
  rationale: βλέπω의 명령형이 영적 경각심을 가리킬 때의 정형 의미를 「살피다」로 옮긴다. 합쇼체 명령 「~하십시오」.
- source_word: ἀπολέσητε ἃ εἰργασάμεθα
  english_pob_choice: lose what we have worked for
  chosen_korean: 우리가 수고하여 이룬 것을 잃지
  alternatives_korean:
  - 우리가 일하여 얻은 것을 잃지
  lexicon: BDAG
  rationale: 부정과거 εἰργασάμεθα를 「수고하여 이룬」으로 옮겨 사역의 결과 함의를 살린다. (이문 「당신들이 수고한」 대신 SBLGNT 본문의 「우리가」를 따른다.)
- source_word: μισθὸν πλήρη ἀπολάβητε
  english_pob_choice: receive a full reward
  chosen_korean: 온전한 상을 받도록 하십시오
  alternatives_korean:
  - 가득 찬 상을 받으십시오
  - 충만한 보상을 받으십시오
  lexicon: BDAG
  rationale: πλήρη(가득한·온전한)와 ἀπολαμβάνω(되돌려받다)의 결합을 「온전한 상을 받다」로 자연스럽게 옮긴다.
