  lexicon: BDAG
  rationale: 10절과 일관되게 χαίρειν을 「인사」로 옮긴다. 분사 ὁ λέγων을 한국어 관형형으로 자연스럽게 처리한다.
- source_word: κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
