  - 그의 악한 일에 공모하는 것입니다
  lexicon: BDAG
  rationale: κοινωνέω의 「함께함·공동참여」 의미를 「함께 참여하다」로 옮겨 단순한 동의가 아닌 공동 책임의 무게를 살린다.
