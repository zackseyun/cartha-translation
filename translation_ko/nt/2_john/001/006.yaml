  verdict: revise
  source_fidelity: 첫 문장의 복수형 ἐντολάς는 한국어에서도 복수형을 드러내는 편이 좋습니다. 마지막 αὐτῇ의 선행사는 가까운 단수 여성형 ‘계명’이 가장 자연스럽지만, ‘사랑’으로도 이해될 수 있으므로 각주로 보존해야 합니다.
  naturalness: 초안의 「사랑은 곧 이것이니」는 현대 표준어 합쇼체의 문장 종결로는 다소 고어적입니다. 「사랑은 이것입니다」가 현대적이고 자연스럽습니다. 또한 대시 뒤의 「행하라는 것입니다」보다 문맥상 정의·설명 구조를 유지하는 「행하는 것입니다」가 원문의 ἵνα 절을 더 중립적으로 반영합니다.
  terminology: ἀγάπη는 ‘사랑’, ἐντολή/ἐντολάς는 각각 ‘계명’/‘계명들’, περιπατέω는 반복되는 윤리적 비유를 살려 ‘행하다’로 유지합니다. ‘그 계명’은 정관사와 단수 전환을 반영합니다.
