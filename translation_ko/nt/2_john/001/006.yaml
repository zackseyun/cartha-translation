  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment, just as you heard from the beginning, that you should walk in it.'
translation:
  language: ko
  text: '사랑은 곧 이것이니, 우리가 그분의 계명을 따라 행하는 것입니다. 이것이 그 계명입니다 — 여러분이 처음부터 들은 그대로, 곧 그 안에서 행하라는 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὕτη ἐστὶν ἡ ἀγάπη
  english_pob_choice: this is love
  chosen_korean: 사랑은 곧 이것이니
  alternatives_korean:
  - 사랑은 이것이니
  - 그 사랑은 이것입니다
  lexicon: BDAG
  rationale: 강조의 αὕτη와 ἀγάπη의 정관사를 살려 「곧 이것이니」로 옮긴다. 한국어 어순상 주어를 앞에 두어 정의문의 음조를 살린다.
- source_word: ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ
  english_pob_choice: that we walk according to his commandments
  chosen_korean: 우리가 그분의 계명을 따라 행하는 것입니다
  alternatives_korean:
  - 우리가 그분의 명령대로 걸어가는 것입니다
  lexicon: BDAG
  rationale: 설명적 ἵνα를 「~것입니다」로 자연스럽게 풀어내며, κατά + 대격을 「~따라」로 옮긴다.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  english_pob_choice: just as you heard from the beginning
  chosen_korean: 여러분이 처음부터 들은 그대로
  alternatives_korean:
  - 여러분이 처음부터 들은 바와 같이
  lexicon: BDAG
  rationale: καθώς를 「그대로」로 옮겨 비교·일치를 명시한다.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  english_pob_choice: that you should walk in it
  chosen_korean: 그 안에서 행하라는 것입니다
  alternatives_korean:
  - 그 안에서 걸어가야 한다는 것입니다
  lexicon: BDAG
  rationale: 권면적 ἵνα를 「~하라는 것」으로 옮겨 명령적 어감을 살린다. 「그 안에서」는 ἐν αὐτῇ (사랑 또는 계명)의 처소격을 보존한다.
