id: 2JN.1.1
reference: 2 John 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder, to the chosen lady and her children, whom I love in truth—and not I alone, but also all who have come to know the truth—
translation:
  language: ko
  text: '장로[a]는 택하심을 받은 부인[b]과 그 자녀들에게:

    나는 그들을 진리 안에서[c] 사랑합니다. 나만이 아니라 진리를 알게 된 모든 이도 그들을 사랑합니다—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「원로」 또는 「연장자」. 헬라어 ὁ πρεσβύτερος는 나이 많은 사람을 가리킬 수도 있고, 인정받는 지도자의 호칭일 수도 있다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「택함 받은 부인」 또는 「선택된 부인」. 이 표현은 실제 한 여성을 가리킬 수도 있고, 한 지역 회중을 부인으로 의인화한 것일 수도 있다. 「부인」(Κυρία)을 개인 이름으로 보는 견해도 있다.
    reason: alternative_reading
  - marker: c
    text: 또는 「참되게」. 「진리 안에서」는 요한 문헌에서 ‘진리’가 지닌 의미를 함께 나타낼 수 있다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  english_pob_choice: The elder
  chosen_korean: 장로
  alternatives_korean:
  - 원로
  - 그 어른
  lexicon: BDAG
  rationale: 편지 서두의 자기 호칭으로서 πρεσβύτερος는 단순한 나이 표지가 아니라 인정받은 지도자 칭호로 기능한다. 한국어 「장로」는 교회적 직제의 음영과 함께 권위 있는 연장자 의미를 그대로 담아낸다.
- source_word: ἐκλεκτῇ κυρίᾳ
  english_pob_choice: chosen lady
  chosen_korean: 택하심을 받은 자매
  alternatives_korean:
  - 택함 받은 부인
  - 택하심을 받은 안주인
  - 택함 받은 여주인
  lexicon: BDAG
  rationale: κυρίᾳ는 κύριος(주인)의 여성형으로 「안주인·여주인」을 가리킨다. 본 번역은 두 가지 해석(실제 한 여성 / 한 회중의 의인화)을 모두 보존하기 위해 「자매」를 택했다. 「부인」은 lady의 직역에 가깝지만, 13절의 「자매(ἀδελφή)」와의 가족적 짝을 살리고 회중 해석의 여지를 함께 열기 위해 「자매」를 본문에, 「부인」을 각주에 둔다.
- source_word: ἐν ἀληθείᾳ
  english_pob_choice: in truth
  chosen_korean: 진리 안에서
  alternatives_korean:
  - 참되게
  - 그 진리 안에서
  lexicon: BDAG
  rationale: 요한 문헌의 정형 표현 「진리 안에서」를 보존한다. 단순한 부사적 「참되게」보다 처소격적 「진리 안에서」가 본문의 신학적 무게(머무름·연합)를 더 잘 살린다.
- source_word: οἱ ἐγνωκότες τὴν ἀλήθειαν
  english_pob_choice: all who have come to know the truth
  chosen_korean: 진리를 알게 된 모든 이들
  alternatives_korean:
  - 진리를 깨달은 자들
  - 진리를 인식한 이들
  lexicon: BDAG
  rationale: 완료분사 ἐγνωκότες는 「알게 되어 지금도 그 앎의 상태에 있는 자」를 가리킨다. 「알게 된」이 그 결과 상태를 담는다.
theological_decisions:
- issue: ἐκλεκτῇ κυρίᾳ의 정체 — 개인 자매인가, 의인화된 회중인가
  chosen_reading: 택하심을 받은 자매(인격적 해석을 본문에, 회중적 해석을 각주에 병기)
  alternative_readings:
  - '한 여성(예: Kyria라는 개인 이름)으로 보는 인격적 해석'
  - 한 지역 회중을 의인화한 표현으로 보는 교회적 해석
  - 「안주인」 어휘의 「lord-of-the-house」 음영을 그대로 살린 「택함 받은 부인」
  rationale: 편지의 일관된 단·복수 교차(σε / ὑμᾶς)와 13절의 「택하심을 받은 자매의 자녀들」 인사가 두 해석을 모두 정당화한다. 본 번역은 인격적·관계적 음조를 본문에 두되, 영어 POB 각주의 두 해석(개인 자매 / 의인화된 회중 / Kyria 인명설)을 각주에 살려 둔다. 「자매」 어휘는 13절 ἀδελφή와의 짝을 살리고 가족적 친밀성을 보존하지만, lord-of-the-house 어감은 「부인」 대안에 명시한다.
  doctrine_reference: 'DOCTRINE.md: preserve ambiguity where the source is ambiguous; do not collapse interpretations'
