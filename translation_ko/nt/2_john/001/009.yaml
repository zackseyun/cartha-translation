id: 2JN.1.9
reference: 2 John 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God. The one who remains in the teaching, this one has both the Father and the Son.
translation:
  language: ko
  text: 메시아의 가르침에 머물지 않고 앞서 나아가는 자는 누구든지 하나님을 모시지 못합니다. 그 가르침에 머무는 자, 이 사람은 아버지와 아들을 함께 모시고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  english_pob_choice: Everyone who goes on ahead
  chosen_korean: 앞서 나아가는 자는 누구든지
  alternatives_korean:
  - 앞질러 가는 자는 누구든지
  - 더 나아가는 자는 모두
  lexicon: BDAG
  rationale: προάγω는 「먼저·앞서 나아가다」를 뜻하며, 본문 맥락에서는 그리스도의 가르침을 넘어 새로운 교리를 「앞서 내세우는」 행위를 가리킨다. 「앞서 나아가는」이 그 의미를 살린다.
- source_word: μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ
  english_pob_choice: remain in the teaching of Messiah
  chosen_korean: 메시아의 가르침에 머물
  alternatives_korean:
  - 메시아의 교훈 안에 거하
  - 메시아의 가르침 안에 머무르
  lexicon: BDAG
  rationale: 요한 문헌의 핵심 어휘 μένω를 「머물다」로 일관되게 옮긴다. διδαχή는 「가르침」으로, τοῦ Χριστοῦ는 칭호 「메시아」로 옮긴다.
- source_word: θεὸν οὐκ ἔχει
  english_pob_choice: does not have God
  chosen_korean: 하나님을 모시지 못합니다
  alternatives_korean:
  - 하나님을 소유하지 못합니다
  - 하나님과 함께하지 못합니다
  lexicon: BDAG
  rationale: 「ἔχει θεόν」을 직역하면 어색하다. 한국어 신앙 어휘 「하나님을 모시다」가 인격적 임재·소속을 자연스럽게 담는다.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  english_pob_choice: has both the Father and the Son
  chosen_korean: 아버지와 아들을 함께 모시고 있습니다
  alternatives_korean:
  - 아버지와 아들을 모두 모시고 있습니다
  lexicon: BDAG
  rationale: 상관 접속사 καὶ... καὶ를 「함께」로 살리고, 위 9b 「모시다」와 일관성을 유지한다.
