  to: 앞서 나아가고 메시아의 가르침에 머물지 않는 사람은 모두 하나님을 모시지 않습니다[a]. 그 가르침에 머무는 사람은 아버지와 아들을 모두 모시고 있습니다[b].
  rationale: 원문의 부정 직설을 보존하도록 「모시지 못합니다」를 「모시지 않습니다」로 고쳤습니다. 분사들의 병렬을 자연스럽게 드러내고, οὗτος의 강조와 καὶ…καὶ의 ‘둘 다’를 각각 「그 사람은」과 「모두」로 반영했습니다. 본문이 유지하는 προάγων의 비유성과 τοῦ Χριστοῦ의 소유격 모호성은 각주에서 보존했습니다.
