  source_fidelity: 원문의 πᾶς ὁ προάγων καὶ μὴ μένων의 병렬과 θεὸν οὐκ ἔχει의 단정은 대체로 반영되었습니다. 그러나 「모시지 못합니다」의 ‘못하다’는 원문에 없는 능력·불가능의 뉘앙스를 더합니다. 「모시지 않습니다」가 부정 직설을 더 정확히 반영합니다.
  naturalness: 「앞서 나아가고 … 머물지 않는 사람은 모두」는 현대 표준 한국어에서 자연스럽고 원문의 두 분사를 병렬로 드러냅니다. δεύτε 절의 강조 대명사 οὗτος는 「그 사람은」으로 자연스럽게 살렸습니다.
  terminology: Χριστός는 프로젝트 방침에 따라 「메시아」로 유지했습니다. μένω는 「머물다」로 일관되게 옮겼고, διδαχή는 「가르침」으로 번역했습니다. 「모시다」는 한국어 신앙 문맥에서 ἔχει의 관계적 표현으로 가능하되, 원문에 없는 ‘못하다’는 제거했습니다.
