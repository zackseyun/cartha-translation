id: 2JN.1.7
reference: 2 John 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world, those who do not confess Jesus Messiah coming in the flesh. This is the deceiver and the antichrist.
translation:
  language: ko
  text: 많은 미혹하는 자들이 세상으로 나갔습니다. 그들은 예수 메시아께서 육체로 오심을 시인하지 않는 자들입니다. 이런 자가 곧 미혹하는 자요 적그리스도[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἀντίχριστος는 「메시아를 대적하는 자/메시아 대신 자처하는 자」를 가리킨다. 한국 교회의 정착 용어 「적그리스도」를 유지한다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλάνοι
  english_pob_choice: deceivers
  chosen_korean: 미혹하는 자들
  alternatives_korean:
  - 속이는 자들
  - 유혹하는 자들
  lexicon: BDAG
  rationale: πλάνος는 능동적으로 「길에서 벗어나게 하는 자」를 가리킨다. 「미혹하는 자」가 영적·교리적 일탈을 유도하는 본문 맥락에 가장 정확하다.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  english_pob_choice: have gone out into the world
  chosen_korean: 세상으로 나갔습니다
  alternatives_korean:
  - 세상에 나타났습니다
  - 세상으로 나아갔습니다
  lexicon: BDAG
  rationale: ἐξέρχομαι의 운동(공동체로부터의 이탈 후 세상으로의 진출) 함의를 「나갔습니다」로 보존한다.
- source_word: ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί
  english_pob_choice: confess Jesus Messiah coming in the flesh
  chosen_korean: 예수 메시아께서 육체로 오심을 시인하지
  alternatives_korean:
  - 예수 메시아께서 육신으로 오신 것을 고백하지
  - 예수 메시아의 육체 오심을 인정하지
  lexicon: BDAG
  rationale: '현재분사 ἐρχόμενον은 영지주의적 부정에 맞서는 도케티즘 반대 진술의 핵심 어구로, 단순 과거 사건이 아닌 「오심」 자체(성육신 신앙고백)를 가리킨다. 「오심을 시인하지 않는」이 신학적 무게를 살린다.'
- source_word: ὁ ἀντίχριστος
  english_pob_choice: the antichrist
  chosen_korean: 적그리스도
  alternatives_korean:
  - 반(反)메시아
  - 적메시아
  lexicon: BDAG
  rationale: 「적그리스도」는 한국 교회에 깊이 정착한 음역+의역 합성어이다. 본 번역이 칭호로서 Χριστός를 「메시아」로 옮기지만, ἀντίχριστος는 합성 고유어로서 별개의 정착 용어이므로 그대로 유지한다.
theological_decisions:
- issue: ἀντίχριστος를 「적메시아」 대신 「적그리스도」로 음역 합성 유지
  chosen_reading: 적그리스도
  alternative_readings:
  - 적메시아
  - 반(反)메시아
  rationale: '본 번역은 칭호로서 Χριστός를 「메시아」로 옮기는 일관된 원칙을 따르지만, ἀντίχριστος는 신약과 한국 교회 전통에서 단일 합성어로 굳어진 종말론적 인물 칭호이다. 영어 POB도 「antichrist」를 그대로 유지한다. 본 번역에서도 음역+의역의 정착 합성어인 「적그리스도」를 유지하되, 각주에서 어원과 「메시아 대적자」의 의미를 명시한다.'
  doctrine_reference: 'DOCTRINE.md: established compound terms; consistency with EN POB rendering'
