    rationale: ἐν σαρκί는 문자적으로 ‘육체/육신 안에서’이지만, 한국어 신학·성경 문맥에서는 ‘육신으로’가 예수의 참된 인간적 몸됨을 자연스럽게 나타냅니다. ‘육체로’는 현대 한국어에서 다소 부자연스럽고 물질적 신체에 지나치게 좁혀 들릴 수 있습니다.
