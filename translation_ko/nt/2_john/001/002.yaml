  text: because of the truth that remains in us and will be with us forever.
translation:
  language: ko
  text: 이는 우리 안에 머무는 진리 때문이며, 그 진리는 영원토록 우리와 함께 있을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὴν ἀλήθειαν
  english_pob_choice: because of the truth
  chosen_korean: 진리 때문이며
  alternatives_korean:
  - 진리로 말미암아
  - 진리를 인하여
  lexicon: BDAG
  rationale: διά + 대격은 원인·근거를 가리킨다. 「때문이며」가 1절의 사랑의 근거를 자연스럽게 잇는다.
- source_word: τὴν μένουσαν ἐν ἡμῖν
  english_pob_choice: that remains in us
  chosen_korean: 우리 안에 머무는
  alternatives_korean:
  - 우리 안에 거하는
  - 우리 속에 머물러 있는
  lexicon: BDAG
  rationale: 요한 문헌의 핵심 어휘 μένω를 「머물다」로 옮겨, 거함·지속·연합의 다층적 의미를 보존한다.
- source_word: εἰς τὸν αἰῶνα
  english_pob_choice: forever
  chosen_korean: 영원토록
  alternatives_korean:
  - 영원히
  - 영원까지
  lexicon: BDAG
  rationale: 「영원토록」은 끝나지 않는 시간의 지속을 담는 합쇼체 격식 어휘이다.
