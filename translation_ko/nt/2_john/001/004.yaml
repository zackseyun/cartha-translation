revisions:
- from: 나는 그대의 자녀들 가운데 진리 안에서 행하는 이들을 만나게 되어 크게 기뻐했습니다. 이는 우리가 아버지께로부터 받은 계명 그대로입니다.
  to: 나는 그대의 자녀들 가운데 몇 사람이 우리가 아버지께로부터 받은 계명대로 진리 안에서 행하고 있는 것을 보게 되어 크게 기뻐했습니다.
  rationale: The revision makes the comparative force of καθώς explicit with ‘계명대로’ and attaches it to ‘행하고 있는,’ the conduct being described. It also states the partitive force clearly as ‘몇 사람’ and renders the perfect εὕρηκα idiomatically as having come to see that they are presently walking in the truth.
