id: 2JN.1.4
reference: 2 John 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth, just as we received a commandment from the Father.
translation:
  language: ko
  text: 나는 그대의 자녀들 가운데 몇 사람이 우리가 아버지께로부터 받은 계명대로 진리 안에서 행하고 있는 것을 보게 되어 크게 기뻐했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐχάρην λίαν
  english_pob_choice: I rejoiced greatly
  chosen_korean: 크게 기뻐했습니다
  alternatives_korean:
  - 매우 기뻐했습니다
  - 심히 기뻐했습니다
  lexicon: BDAG
  rationale: 부정과거 Ἐχάρην의 시상과 λίαν의 강조를 합쇼체 과거형 「크게 기뻐했습니다」로 자연스럽게 옮긴다.
- source_word: εὕρηκα ἐκ τῶν τέκνων σου
  english_pob_choice: I have found some of your children
  chosen_korean: 그대의 자녀들 가운데 ... 이들을 만나게 되어
  alternatives_korean:
  - 그대의 자녀들 중 일부가 ... 함을 보게 되어
  lexicon: BDAG
  rationale: 부분의 ἐκ를 「가운데 ... 이들」로 살려 「일부」의 함의를 보존한다. 완료 εὕρηκα는 「만나게 되어」로 옮겨 발견의 결과 상태를 담는다.
- source_word: περιπατοῦντας ἐν ἀληθείᾳ
  english_pob_choice: walking in the truth
  chosen_korean: 진리 안에서 행하는
  alternatives_korean:
  - 진리 가운데 살아가는
  - 진리를 따라 걷는
  lexicon: BDAG
  rationale: 요한 문헌의 정형 어휘 περιπατέω를 「행하다(걸어가다)」로, ἐν ἀληθείᾳ를 「진리 안에서」로 보존한다.
- source_word: καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός
  english_pob_choice: just as we received a commandment from the Father
  chosen_korean: 우리가 아버지께로부터 받은 계명 그대로입니다
  alternatives_korean:
  - 우리가 아버지로부터 받은 계명대로입니다
  lexicon: BDAG
  rationale: καθώς의 비교·일치 의미를 「그대로」로 살린다. 부정과거 ἐλάβομεν은 한국어 단순과거로 자연스럽다.
