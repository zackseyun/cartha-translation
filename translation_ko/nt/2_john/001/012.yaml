  to: 여러분에게 쓸 것이 많지만, 종이와 먹을 써서 그렇게 하고 싶지는 않았습니다. 오히려 여러분에게 가서 얼굴을 마주하고 이야기하기를 바랍니다. 이는 여러분의 기쁨이 충만해지게 하려는 것입니다.[a]
  rationale: SBLGNT의 ὑμῶν을 따라 ‘여러분의 기쁨’을 본문에 반영하고, ἡμῶν 이문은 각주로 보존했습니다. 과거형 ἐβουλήθην을 ‘싶지 않았습니다’로 바로잡았으며, 목적절을 현대 한국어 합쇼체에 맞게 자연스럽게 다듬었습니다.
