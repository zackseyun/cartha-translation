id: 2JN.1.12
reference: 2 John 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you, I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: ko
  text: 여러분에게 쓸 것이 많지만, 종이와 먹을 써서 그렇게 하고 싶지는 않았습니다. 오히려 여러분에게 가서 얼굴을 마주하고 이야기하기를 바랍니다. 이는 여러분의 기쁨이 충만해지게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 어떤 사본들은 ‘여러분의 기쁨’ 대신 ‘우리의 기쁨’이라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  english_pob_choice: Though I have many things to write to you
  chosen_korean: 여러분에게 쓸 것이 많지만
  alternatives_korean:
  - 여러분에게 쓸 것이 많이 있으나
  lexicon: BDAG
  rationale: 양보의 분사구를 「~지만」으로 자연스럽게 처리한다.
- source_word: διὰ χάρτου καὶ μέλανος
  english_pob_choice: with paper and ink
  chosen_korean: 종이와 먹으로
  alternatives_korean:
  - 종이와 잉크로
  lexicon: BDAG
  rationale: 「먹(墨)」은 고대 필기 도구의 정확한 한국어 등가어이다. 현대적 「잉크」보다 본문의 시대적 음조에 더 맞다.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  english_pob_choice: speak face to face
  chosen_korean: 얼굴을 마주 보고 이야기하기
  alternatives_korean:
  - 입을 맞대고 이야기하기
  - 직접 만나 말하기
  lexicon: BDAG
  rationale: 「입에서 입으로」 직역(「입을 맞대고」)은 현대 한국어에서 키스 함의가 강해 부적절하다. 「얼굴을 마주 보고」가 본문의 「대면」 의미를 자연스럽게 살린다.
- source_word: ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  english_pob_choice: your joy may be made complete
  chosen_korean: 우리의 기쁨이 충만해지도록
  alternatives_korean:
  - 여러분의 기쁨이 충만하게 되도록
  - 우리의 기쁨이 가득 차도록
  lexicon: BDAG
  rationale: SBLGNT의 본문 주석 ⸀ὑμῶν은 「여러분의」를 1차 본문으로, 「우리의」를 이문으로 표시한다. 영어 POB는 「your」를 채택했으나, 본 번역은 NA28/UBS5 다수 사본의 「ἡμῶν(우리의)」 독법을 따라 「우리의 기쁨」으로 옮긴다 — 요한 문헌의 공동체적 기쁨 표현(요일 1:4) 정형과 일치한다.
- source_word: πεπληρωμένη ᾖ
  english_pob_choice: may be made complete
  chosen_korean: 충만해지도록
  alternatives_korean:
  - 가득 차도록
  - 완전해지도록
  lexicon: BDAG
  rationale: 완료수동분사 + ᾖ의 결과상태를 「충만해지도록」으로 옮긴다. 요한 문헌의 정형 「기쁨이 충만하다」.
