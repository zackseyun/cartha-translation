id: 2JN.1.10
reference: 2 John 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: ko
  text: '누군가가 여러분에게 와서 이 가르침을 가져오지 않거든, 그 사람을 집에 들이지 말고 인사도 건네지 마십시오.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις ἔρχεται
  english_pob_choice: If anyone comes
  chosen_korean: 누군가가 ... 와서
  alternatives_korean:
  - 어떤 사람이 오거든
  - 누가 ... 오면
  lexicon: BDAG
  rationale: 1급 조건문(현실 가능한 가정)을 「~거든」으로 자연스럽게 옮긴다.
- source_word: ταύτην τὴν διδαχὴν οὐ φέρει
  english_pob_choice: does not bring this teaching
  chosen_korean: 이 가르침을 가져오지 않거든
  alternatives_korean:
  - 이 교훈을 가지고 오지 않으면
  lexicon: BDAG
  rationale: 9절의 「가르침」과 일관되게 διδαχή를 「가르침」으로 유지하고, φέρω를 「가져오다」로 직역한다.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  english_pob_choice: do not receive him into your house
  chosen_korean: 그 사람을 집에 들이지 말고
  alternatives_korean:
  - 그를 집에 받아들이지 말고
  - 그를 집 안으로 영접하지 말고
  lexicon: BDAG
  rationale: λαμβάνω εἰς οἰκίαν의 환대 거부 의미를 「집에 들이지 말다」로 자연스럽게 옮긴다. 합쇼체 명령.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  english_pob_choice: do not say a greeting to him
  chosen_korean: 인사도 건네지 마십시오
  alternatives_korean:
  - 「평안하라」고 말하지도 마십시오
  - 인사조차 하지 마십시오
  lexicon: BDAG
  rationale: 헬라어 χαίρειν은 인사 정형 표현이다. 한국어 일상 어휘 「인사를 건네다」가 가장 자연스럽다.
