  source_fidelity: 핵심 의미는 충실합니다. 다만 조건절의 「와서 … 가져오지 않거든」은 문법상 이해되지만, 헬라어의 한 조건 안에 결합된 두 동작을 한국어에서 더 매끄럽고 분명하게 나타낼 수 있습니다. 또한 여격 αὐτῷ는 「그에게」로 드러내는 편이 좋습니다.
  naturalness: 「누구든지 여러분에게 와서 이 가르침을 가져오지 않으면」은 일반적 조건을 자연스럽게 표현합니다. 「그에게 인사하지도 마십시오」는 현대 표준어 합쇼체로 자연스럽고, 원문의 두 금지를 명료하게 연결합니다.
  terminology: διδαχή는 문맥 및 인접 절과의 일관성을 위해 「가르침」으로 유지하는 것이 적절합니다. οἰκία는 환대의 구체적 장소를 나타내므로 「집에 들이지」가 자연스럽습니다. χαίρειν은 관용적인 인사 표현이므로 「인사하지도 마십시오」로 옮깁니다.
