review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 헬라어는 수신자들을 여격으로 열거할 뿐, ‘편지합니다’라는 동사나 ‘함께’라는 부사를 명시하지 않습니다. 현 초안의 ‘함께 편지합니다’는 원문에 없는 내용을 보태며, ‘함께’는 특히 Ἀρχίππῳ에만 걸리는 ‘우리의 전우’라는 수식 관계를 흐립니다.
  naturalness: ‘자매 압비아와 우리의 전우 아킵보와 그대의 집에 있는 교회에’는 서신 인사말의 앞 절에 이어지는 수신자 열거로 자연스럽습니다. ‘전우’는 현대 표준어에서 자연스러우면서도 συστρατιώτῃ의 군사 은유를 보존합니다.
  terminology: 압비아와 아킵보는 통용 음역으로 적절합니다. ἀδελφῇ는 SBLGNT의 읽기를 따라 ‘자매’로, ἐκκλησίᾳ는 이 문맥에서 확립된 용어인 ‘교회’로 옮겼습니다. ‘그대의 집에 있는’은 κατ’ οἶκόν σου의 위치/가정교회 의미를 과도하게 풀어쓰지 않고 전달합니다.
  issues:
  - severity: high
    issue: 원문에 없는 ‘함께 편지합니다’의 첨가
    rationale: καὶ Ἀπφίᾳ ... καὶ τῇ ... ἐκκλησίᾳ는 앞 절의 인사 수신자를 계속 열거하는 구문입니다. 이 절 자체에는 γράφω나 인사 동사가 없으며, ‘함께’는 아킵보를 수식하는 ἡμῶν συστρατιώτῳ의 의미를 전체 수신자에게 잘못 확장할 수 있습니다.
  - severity: medium
    issue: συστρατιώτῃ의 수식 범위가 흐려짐
    rationale: ἡμῶν은 아킵보의 ‘전우’를 수식합니다. ‘우리의 전우 아킵보’로 명료하게 옮기는 것이 적절합니다.
  - severity: low
    issue: 각주에서 τῇ ἀδελφῇ를 ‘그 자매’로 단정적으로 역번역함
    rationale: 정관사는 한국어에서 반드시 ‘그’로 옮겨지지 않으며, 본문 번역 ‘자매’와도 불필요하게 어긋납니다. 사본 이문과 본문 선택만 간결히 밝혀야 합니다.
  revised_text: 그리고 자매 압비아와 우리의 전우 아킵보와 그대의 집에 있는 교회에.
  revised_footnotes:
  - marker: a
    text: 일부 사본은 ‘자매’에 ‘우리의’(ἡμῶν)를 덧붙여 읽습니다. SBLGNT 본문에는 ἡμῶν이 없습니다.
    reason: textual_variant
  revision_rationale: 원문의 반복된 καὶ와 여격 수신자 열거를 유지하되, 원문에 없는 서신 동사와 ‘함께’의 확장적 의미를 제거했습니다. 아킵보에게만 붙는 ‘우리의 전우’와 집에 있는 교회라는 구조를 분명히 했습니다.
