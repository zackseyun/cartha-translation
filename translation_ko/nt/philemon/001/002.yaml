review_pass:
  verdict: revise
  source_fidelity: 본문은 수신자들을 나열하는 여격 구문입니다. 초안의 ‘함께 편지합니다’는 앞 절의 발신자 및 서신 형식을 보완한 표현으로 가능하지만, ‘또한’과 ‘에게도’의 중첩은 원문의 단순한 καί 연결을 과도하게 풀어냅니다. 또한 συστρατιώτῃ는 ‘함께 싸우는 동지’보다 ‘동료 군사’가 군사 은유와 명사적 호칭을 더 직접적으로 보존합니다.
  naturalness: ‘우리의 동료 군사’는 현대 한국어 성서 문체에서 자연스럽고, ‘그대의 집에 있는 교회’도 가정교회의 장소적 의미를 무리 없이 전달합니다. ‘회중’도 가능하나, 이 문맥의 ἐκκλησία에는 ‘교회’가 가장 자연스럽고 널리 통용되는 대응어입니다.
  terminology: 압비아와 아킵보의 음역은 적절합니다. ἀδελφῇ에는 SBLGNT에 ἡμῶν이 없으므로 ‘자매’로 옮긴 것이 맞습니다. ‘동료 군사’는 συστρατιώτῃ의 군사적 비유를 보존하며, ‘교회’는 ἐκκλησία의 통상적 성서 용례에 부합합니다.
  issues:
  - severity: medium
    issue: ‘함께 싸우는 동지’
    rationale: 원문의 단일 명사 συστρατιώτῃ는 ‘함께 복무하는 군사/동료 군사’라는 호칭입니다. ‘함께 싸우는 동지’는 동사적 설명을 더하고 ‘동지’의 현대 한국어 연상이 불필요하게 강합니다.
  - severity: low
    issue: ‘회중’ 선택
    rationale: ἐκκλησία가 모인 공동체를 뜻할 수는 있으나, 가정에 있는 그리스도인 공동체를 가리키는 이 문맥에서는 ‘교회’가 더 자연스럽고 한국어 성서 용례에도 안정적으로 부합합니다.
  - severity: low
    issue: ‘또한’ 및 ‘에게도’의 중첩
    rationale: καί의 반복적 연결을 한국어에서 ‘또한’과 ‘에게도’로 함께 표시할 필요는 없습니다. 간결한 ‘그리고 …와 …와 …에게’가 원문의 나열 구조를 더 잘 반영합니다.
  revised_text: 그리고 자매 압비아와 우리의 동료 군사 아킵보와 그대의 집에 있는 교회에 함께 편지합니다.
  revised_footnotes:
  - marker: a
    text: 일부 사본은 「자매」 대신 「우리의 자매」로 읽습니다. SBLGNT 본문은 ἡμῶν(우리의) 없이 「그 자매」(τῇ ἀδελφῇ)로 읽으므로, 본문에서는 「자매」로 옮겼습니다.
    reason: textual_variant
  revision_rationale: 수신자 나열이라는 원문의 문장 구조를 유지하면서 불필요한 첨가를 줄였습니다. συστρατιώτῃ는 군사 은유를 직접 보존하는 ‘동료 군사’로, ἐκκλησία는 문맥과 한국어 성서 관용에 맞는 ‘교회’로 수정했습니다. 본문 비평 각주는 SBLGNT의 ἡμῶν 부재를 정확히 설명하도록 다듬었습니다.
