review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 정확합니다. 그러나 「자원하는 것」은 ἀλλὰ κατὰ ἑκούσιον이 수식하는 ‘그대의 선한 행위’와의 관계가 한국어에서 부자연스럽고, 행위 자체가 ‘자원하는 것’인 듯 들립니다. 이를 그 행위가 자발적으로 행해진 것이라는 뜻으로 명료하게 옮기는 것이 원문의 대조(강요/자원)를 더 충실히 반영합니다.
  naturalness: 「아무것도 하고 싶지 않았습니다」도 가능하지만, 바울의 숙고된 의지를 나타내는 문맥에서는 「아무것도 하기를 원하지 않았습니다」가 현대의 격식 있는 성경 문체에 더 적합합니다. 목적절은 「마지못해 한 것처럼 ... 자원하여 한 것이 되도록」으로 다듬으면 자연스럽고 분명합니다.
  terminology: 「그대의 동의」, 「선한 행위」는 적절합니다. 「강요에 의한 것처럼」은 의미상 가능하나, 문맥상 강제된 행위라는 뜻을 더 자연스럽게 나타내도록 「마지못해 한 것처럼」으로 옮기고 각주에서 ‘강요/제약’을 보충할 수 있습니다. ‘그대’와 합쇼체의 조합은 본문 전체에서 유지된다면 허용됩니다.
  issues:
  - severity: medium
    issue: 「자원하는 것」의 수식 관계와 표현이 부자연스럽습니다.
    rationale: κατὰ ἑκούσιον은 빌레몬의 ‘선한 행위’가 자발적으로 이루어지는 방식을 강요와 대조합니다. 현 번역은 ‘자원하는 것’이 무엇인지 불분명하여, 원문의 자발성 대조를 한국어에서 충분히 전달하지 못합니다.
  - severity: low
    issue: 「아무것도 하고 싶지 않았습니다」는 다소 구어적입니다.
    rationale: ἠθέλησα는 단순한 희망보다 의지적 선택을 나타냅니다. 「아무것도 하기를 원하지 않았습니다」가 격식 있는 합쇼체와 원문의 의지 표현에 더 잘 맞습니다.
  revised_text: 그러나 나는 그대의 동의[a] 없이는 아무것도 하기를 원하지 않았습니다. 그대의 선한 행위[b]가 마지못해 한 것처럼 되지 않고 자원하여 한 것이 되도록 하기 위함이었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「그대의 승낙」 또는 「그대의 뜻」.
    reason: lexical_alternative
  - marker: b
    text: 또는 「그대의 선함」 또는 「그대의 친절」. 헬라어는 빌레몬이 이 일에서 할 선한 행위를 가리킬 수도 있고, 더 추상적으로 그의 선함을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 「자발적인 것에 따라」, 곧 「그대가 자유의지로 한 것」입니다.
    reason: literal_translation
  revision_rationale: '목적절 전체를 자연스러운 현대 한국어로 재구성하여, 바울이 빌레몬의 동의 없이 행동하지 않으려 했던 이유, 곧 빌레몬의 선한 행위가 강요된 것이 아니라 자발적인 것이 되게 하려 했다는 원문의 논리를 보존했습니다. 기존 c 각주는 본문에 더 이상 각주 표지가 없으므로 삭제하지 않고, 자발성 표현 뒤에 c 표지를 두어 원문의 직역상 대안을 유지해야 합니다. 따라서 아래 본문에는 해당 표지가 포함되어야 합니다: 「...자원하여 한 것[c]이 되도록...」'
