  source_fidelity: 「동역자」는 κοινωνός가 문맥상 지닐 수 있는 사역적 함의를 반영할 수 있으나, 원어는 더 넓게 ‘함께 나누는 사람/동료/동반자’를 뜻하며 사역 자체를 명시하지 않습니다. 「동료」가 이 절의 관계적 호소를 더 직접적이고 비특수하게 전달합니다. 「나를 대하듯」은 ὡς ἐμέ의 비교를 명확하게 살립니다.
  naturalness: 초안은 「그대가 … 받아 주시기 바랍니다」에서 문체와 대우법이 다소 혼합됩니다. 주어를 생략하고 「여기신다면 … 받아 주십시오」로 하면 현대 표준어 합쇼체로 자연스럽고 일관됩니다. 각주도 「친교에 받아들이는」보다 「교제 안으로 받아들이는」이 자연스럽습니다.
  terminology: κοινωνός는 여기서 특정 교회 직분이나 사역 관계를 단정하지 않는 「동료」로 옮겼습니다. προσλαβοῦ는 호의적 수용과 관계적 받아들임을 포괄하는 「받아 주십시오」로 유지했습니다.
