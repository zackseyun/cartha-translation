  terminology: ‘무익한/유익한’은 원문의 대조와 오네시모 이름에 관련된 의미상의 말놀이를 적절히 보존합니다. 각주는 이름의 의미와 본문의 대조를 설명하되, 그리스어 단어들이 오네시모와 같은 어근이라는 인상을 주지 않도록 다듬는 것이 좋습니다.
