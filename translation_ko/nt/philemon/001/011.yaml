    reason: lexical_alternative
  revision_rationale: 원문의 ποτέ—νυνὶ δέ 시간 대조, σοί καὶ ἐμοί의 병렬, 그리고 ἄχρηστον—εὔχρηστον의 어휘 대조를 유지하면서, 한국어의 부자연스러운 ‘둘 다에게’를 ‘모두에게’로 고쳤습니다. 각주는 언어유희가 개연적인 문학적 관찰임을 유지하되 이름의 관련 의미를 명료하게 설명했습니다.
