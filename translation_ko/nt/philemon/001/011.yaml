  terminology: ‘무익/유익’은 ἄχρηστον/εὔχρηστον의 대조와 오네시모 이름에 관련된 언어유희를 적절히 보존합니다. 각주는 이름의 의미와 본문의 어휘 대조를 더 명료하고 자연스럽게 밝혀야 합니다.
  issues:
