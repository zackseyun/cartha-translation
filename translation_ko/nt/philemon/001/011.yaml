    rationale: 현 각주는 ‘유익을 뜻하는 … 이름’이라는 표현이 다소 압축되어 있습니다. 이름의 의미를 괄호로 명시하고 언어유희의 대상 어휘를 연결하면 더 명료합니다.
  revised_text: 그는 한때 그대에게 무익했으나, 이제는 그대와 나 모두에게 유익합니다.
  revised_footnotes:
