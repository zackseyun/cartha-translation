review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘 선택은 대체로 원문에 충실합니다. 「그대를 대신하여」는 ὑπὲρ σοῦ의 대리·대표의 뉘앙스를 잘 보존하며, 「복음의 결박」도 τοῦ εὐαγγελίου의 압축된 속격을 성급히 인과로 풀지 않습니다. 다만 현행 문장은 「복음의 결박 중에 있는 나를」 뒤에 다시 「그가」가 이어져, 목적절의 주어와 목적어 관계가 일시적으로 불명확하고 원문의 통사 관계를 흐립니다.
  naturalness: 현행 문장의 「나는 복음의 결박 중에 있는 나를 그가 … 섬기도록」은 동일한 「나」가 연속되어 현대 한국어 문장으로 부자연스럽습니다. 목적절을 먼저 명료하게 구성하고 쉼표로 구분하면 합쇼체 문어체로 자연스럽습니다.
  terminology: 「복음」, 「결박」, 「섬기다」는 적절합니다. 「결박 가운데 있는」은 ἐν τοῖς δεσμοῖς를 구금 상태를 나타내는 표현으로 자연스럽게 옮기면서도 사슬/결박의 구체성을 유지합니다.
  issues:
  - severity: medium
    issue: 목적절의 통사적 모호성과 어색한 어순
    rationale: 초안의 「복음의 결박 중에 있는 나를 그가 그대를 대신해서 섬기도록」은 「나를」이 목적절에 속하는지, 주절의 목적어인지 즉시 파악하기 어렵습니다. 원문은 ‘그를 곁에 두고 싶었다’가 주절이고, ‘그가 나를 섬기도록’이 목적절이므로 이를 한국어 어순에서 분명히 해야 합니다.
  revised_text: 나는 그가 복음의 결박 가운데 있는 나를 그대를 대신하여 섬기도록, 그를 내 곁에 두고 싶었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「복음을 위한 결박」. 곧 복음 때문에 진 사슬을 뜻할 수 있습니다. 헬라어 속격은 그 사슬이 복음과 연관되어 있음을 압축적으로 표현합니다.
    reason: alternative_reading
  revision_rationale: 목적절 「그가 … 나를 … 섬기도록」을 먼저 완결해 오네시모가 섬기는 주체이고 바울이 섬김을 받는 대상임을 명확히 했습니다. 이어 주절의 목적어 「그를」과 「내 곁에 두고 싶었습니다」를 배치하여 원문의 구조를 보존했습니다. 각주는 본문의 「복음의 결박」을 유지하면서 가능한 인과적 이해만 대안으로 제시합니다.
