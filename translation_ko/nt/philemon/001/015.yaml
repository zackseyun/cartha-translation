  naturalness: 「그대」는 현대 표준어 합쇼체 본문에서는 문어적·고풍스럽게 들립니다. 「당신」으로 바꾸고, 목적절을 「…하려는 것이었을 것입니다」로 구성하면 현대의 정중한 문체로 더 자연스럽습니다.
  terminology: 「영원히」와 「되돌려받다」는 αἰώνιον과 ἀπέχῃς의 문맥상 의미를 적절히 전달합니다. 「떼어져 있었다」는 ἐχωρίσθη의 수동태를 유지하면서 행위 주체를 확정하지 않습니다.
