  naturalness: ‘그대’는 현대 표준어 합쇼체의 일반적 서신 문체로는 문어적·고풍스럽게 들립니다. 또한 ‘그대가 … 행할 줄 알기 때문입니다’보다 ‘당신이 … 할 것을 알고 있습니다’가 현대 정중 문체에서 더 자연스럽고, 원문의 분사적 연결도 더 잘 드러냅니다.
