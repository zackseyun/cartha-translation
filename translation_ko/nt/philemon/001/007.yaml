  to: 형제여, 나는 그대의 사랑으로 인해 큰 기쁨과 위로를 얻었습니다. 성도들의 마음[a]이 그대를 통하여 새 힘을 얻었기 때문입니다.
  rationale: διὰ σοῦ의 뜻을 현대 한국어에서 혼동 없이 드러내기 위해 「그대로 말미암아」를 「그대를 통하여」로 수정했습니다. 그 외에는 원문의 인과관계, 완료형이 나타내는 회복된 상태, 그리고 친밀하면서도 격식 있는 호칭을 보존했습니다. 각주는 σπλάγχνα의 문자적 의미를 제시하되 본문의 자연스러운 관용 번역을 뒷받침하도록 문장을 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:49:11Z'
