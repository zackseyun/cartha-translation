  naturalness: '''바로 그를, 곧 나의 심장을''은 현대 표준 한국어에서 동격 연결이 어색하고, 사람이 ''나의 심장''이라는 표현도 자연스럽지 않습니다. ''그는 바로 내 심정입니다''는 합쇼체 문맥에서 자연스럽고 바울의 강한 개인적 애정을 전달합니다.'
