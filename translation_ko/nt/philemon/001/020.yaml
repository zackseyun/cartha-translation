  terminology: '''주,'' ''메시아,'' ''형제여,'' and ''마음'' are suitable. Footnote b incorrectly says ''깊은 정의 자리'': 정의 normally means justice/righteousness, not affection. It should refer to deep feelings/affections. The Onesimus gloss should be ''유익한/쓸모 있는'' rather than the overly fixed nominal gloss ''유익한 자.'''
  issues:
