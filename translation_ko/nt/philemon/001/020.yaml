    issue: '''그대로부터'''
    rationale: This is malformed Korean and does not mean 'from you.' Greek σου with ὀναίμην calls for '그대에게서' (or equivalent).
  - severity: medium
    issue: 'Footnote b: ''깊은 정의 자리'''
    rationale: '''정의'' denotes justice/righteousness in contemporary Korean; σπλάγχνα here is an idiom for deep feelings, affection, or inner being.'
  - severity: low
    issue: Footnote a's name gloss
    rationale: The explanation is clearer and more lexically restrained if Onesimus is described as meaning 'useful' or 'beneficial,' rather than assigning the fixed gloss '유익한 자.'
