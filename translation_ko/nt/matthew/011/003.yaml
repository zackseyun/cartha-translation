  source_fidelity: The draft correctly represents the direct question, the alternative introduced by ἤ, and the deliberative force of προσδοκῶμεν. However, “오실 그분” is not idiomatic Korean and does not naturally express the articular participle ὁ ἐρχόμενος.
  naturalness: “오실 분” is the normal, natural Korean substantive expression. “다른 분을 기다려야 합니까?” is idiomatic in this question and suitably conveys the expectant/awaiting sense of προσδοκῶμεν. The honorific “그분께” and the formal-polite question endings fit the requested register.
  terminology: “오실 분” retains the potentially titular and messianic force of ὁ ἐρχόμενος without inserting “메시아” into the text. A footnote preserves the viable non-titular alternatives and explains the contextual title-like sense.
