translation:
  language: ko
  text: 내 멍에를 메고 내게서 배우십시오. 내가 온유하고 마음이 겸손하기 때문입니다.[a] 그러면 너희 영혼이 안식을 얻을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
