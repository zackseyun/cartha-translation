  terminology: ζυγός의 중심 비유인 ‘멍에’를 유지했습니다. πραΰς는 ‘온유하다’, ταπεινὸς τῇ καρδίᾳ는 ‘마음이 겸손하다’, ἀνάπαυσις는 ‘안식’으로 옮겨 본문의 어휘와 성경적 울림을 보존했습니다.
