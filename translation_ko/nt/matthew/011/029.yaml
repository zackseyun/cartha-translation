  source_fidelity: 원문의 두 명령형(ἄρατε, μάθετε), 인과절(ὅτι), 미래 약속(εὑρήσετε), 그리고 ‘영혼들에/위하여’라는 여격 표현을 충실히 반영하도록 수정했습니다. 초안의 ‘너희 영혼이 쉴 안식’은 원문에 없는 관계절을 더하고 한국어로도 부자연스럽습니다.
