  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
  footnotes:
  - marker: a
    text: Or, 'wisdom was vindicated by her deeds.'
    reason: lexical_alternative
  - marker: b
    text: 'Some manuscripts read ''children'' instead of ''works'': ''wisdom was justified by her children.'''
    reason: textual_variant
translation:
