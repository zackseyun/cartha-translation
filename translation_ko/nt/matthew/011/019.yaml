  to: 인자가 와서 먹고 마시는데, 그들은 “보라, 먹보요 술주정뱅이이며 세리들과 죄인들의 친구다!” 하고 말합니다. 지혜는 자기 행위들[a]로 옳음이 입증되었습니다.
