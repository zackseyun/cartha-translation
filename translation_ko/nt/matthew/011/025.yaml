  terminology: ‘주님’, ‘아버지’, ‘숨기시고’, ‘나타내셨고’는 본문의 종교적·서사적 어조와 신학적 무게를 적절히 유지합니다. ‘어린아이들’은 νηπίοις의 비유적 이미지와 문자적 의미 가능성을 함께 보존합니다.
