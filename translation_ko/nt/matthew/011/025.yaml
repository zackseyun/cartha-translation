  source_fidelity: 핵심 동사들의 능동적 신적 행위(“숨기시고/나타내셨고”)와 ‘지혜로운 자들과 슬기로운 자들’ 및 ‘어린아이들’의 대조를 충실히 보존합니다. 다만 Ἐξομολογοῦμαί의 의미 범위에는 ‘감사하다’와 ‘찬양하다/공개적으로 인정하다’가 모두 있으므로, 본문의 선택인 ‘감사드립니다’에 대안 각주를 붙이는 것이 적절합니다.
