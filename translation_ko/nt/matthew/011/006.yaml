  verdict: revise
  source_fidelity: The draft conveys the central sense of μακάριος and σκανδαλισθῇ, but its archaic wording and the unexplained closing quotation mark impair a faithful, usable Korean presentation. The revision retains the stumbling metaphor and renders ἐν ἐμοί naturally as '나 때문에,' without restricting the meaning to mere emotional offense.
  naturalness: ‘나를 인하여’ is archaic and does not suit modern standard Korean. ‘자, 그 사람은’ is needlessly dislocated, and the final ‘」’ is structurally erroneous. ‘나 때문에 걸려 넘어지지 않는 사람은 복이 있습니다’ is idiomatic modern formal-polite Korean.
  terminology: ‘복이 있습니다’ appropriately renders μακάριος in a beatitude-like pronouncement. ‘걸려 넘어지다’ preserves the metaphorical force of σκανδαλίζω; a footnote supplies the contextual alternative of taking offense.
  issues:
  - severity: medium
    issue: Archaic expression ‘나를 인하여’
    rationale: Modern standard Korean normally uses ‘나 때문에’ or ‘나로 말미암아’; the latter is more formal but can sound biblical/archaic. ‘나 때문에’ is clear and natural.
  - severity: medium
    issue: Sentence structure ‘...않는 자, 그 사람은’
    rationale: The appositional repetition is unnatural here and is not required by the Greek relative construction.
  - severity: high
    issue: Unmatched closing quotation mark ‘」’
    rationale: The closing quotation mark has no matching opening mark and must be removed.
  - severity: low
    issue: No Korean anchor for the lexical alternative preserved in the English audit trail
    rationale: Adding an anchored note preserves the contextual ‘take offense’ alternative while retaining the source metaphor in the main text.
