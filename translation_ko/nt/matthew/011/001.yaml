source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
  footnotes:
  - marker: a
    text: Or 'commanding' his twelve disciples.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'their cities' is ambiguous in Greek; it may refer to the disciples' cities or more generally to the towns of the surrounding people.
    reason: alternative_reading
translation:
  language: ko
  text: 예수님께서 열두 제자들에게 지시를[a] 마치셨을 때, 그곳을 떠나 그들의 성읍에서[b] 가르치고 선포하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “명령을”.
    reason: διατάσσων은 지시하거나 명령한다는 뜻을 지닐 수 있습니다.
  - marker: b
    text: “그들의 성읍”이 누구의 성읍을 가리키는지는 그리스어에서 분명하지 않습니다. 제자들의 성읍을 가리킬 수도 있고, 더 넓게는 그 지역 사람들의 고을들을 가리킬 수도 있습니다.
    reason: αὐτῶν의 선행사가 명시되지 않은 원문의 모호성을 보존합니다.
