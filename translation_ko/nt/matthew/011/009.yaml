review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the object question, the prophet, and John's elevated status. However, ἀλλά is better represented by "그러나" than "오히려" in this contrastive rhetorical sequence, and the final phrase should retain the comparative sense without the interpretively stronger wording "더 뛰어난 자이다."
  naturalness: The draft mixes non-polite archaic-style endings ("나갔느냐," "이다") with a target specification of modern formal-polite 합쇼체. The revision consistently uses modern formal-polite forms and smooth Korean rhetorical questions.
  terminology: '"예언자" is a suitable modern Korean rendering of προφήτης. "예언자보다 더 큰 이" closely preserves περισσότερον προφήτου while avoiding an unnecessary explanation of the precise basis for John''s greater status.'
  issues:
  - severity: medium
    issue: Register is inconsistent with the required modern formal-polite Korean.
    rationale: '"나갔느냐? ... 자이다" is not 합쇼체; use "나갔습니까? ... 이입니다."'
  - severity: low
    issue: '"오히려" is not the closest contextual rendering of ἀλλά.'
    rationale: Here ἀλλά contrasts the preceding alternatives and is naturally rendered "그러나"; "오히려" can imply a corrective preference beyond the Greek's basic contrast.
  - severity: low
    issue: '"더 뛰어난" slightly specifies the comparison more than necessary.'
    rationale: The Greek literally says "more than a prophet"; "더 큰" is a conventional restrained Korean comparative and preserves the intended open-ended elevation.
  revised_text: 그러나 너희가 무엇을 보러 나갔습니까? 예언자입니까? 그렇습니다. 내가 너희에게 말합니다. 예언자보다 더 큰 이입니다.
