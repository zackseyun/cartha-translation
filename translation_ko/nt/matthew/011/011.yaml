  source_fidelity: 원문의 대조와 긴장 구조는 대체로 잘 반영되어 있습니다. 다만 ὁ βαπτιστής의 통상적 한국어 성경 명칭은 '세례자'이며, ὁ δὲ μικρότερος의 정관사 단수 표현은 '가장 작은 이'로 옮기는 편이 '가장 작은 자라도'보다 정확합니다. 완료형 ἐγήγερται는 '일어난 적이 없습니다'로 자연스럽게 나타낼 수 있습니다.
