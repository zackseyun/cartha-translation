  terminology: '''세례자 요한''은 표준 한국어 성경 용례와 널리 통용되는 인명 표기에 부합합니다. ''하늘 나라''는 마태복음의 βασιλεία τῶν οὐρανῶν을 직역적으로 유지하며, 본문이 설명하지 않는 비교의 신학적 의미는 해석으로 보충하지 않았습니다.'
