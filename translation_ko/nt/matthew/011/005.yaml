  source_fidelity: 개정안은 ἀναβλέπουσιν을 시력의 회복/획득으로, καθαρίζονται를 ‘깨끗하게 되다’로, εὐαγγελίζονται의 수동적 수혜를 ‘좋은 소식이 선포됩니다’로 옮깁니다. ‘죽은 이들이 살아나며’는 한국어에서 자연스러운 표현으로 ἐγείρονται의 부활·소생 사건을 충실히 전달합니다.
  naturalness: 초안의 ‘다시 보고’는 이전에 시력이 있었음을 단정하는 듯 들릴 수 있으므로 ‘보게 되고’로 고쳤습니다. 또한 현대 표준어의 존중하는 사람 중심 표현을 위해 ‘맹인들’, ‘다리 저는 자들’, ‘귀먹은 자들’을 각각 ‘보지 못하는 이들’, ‘걷지 못하던 이들’, ‘듣지 못하는 이들’로 다듬었습니다. 문장 종결은 현대의 격식 있는 성경 문체에 맞추어 ‘선포됩니다’를 사용했습니다.
  terminology: ‘나병 환자’는 λεπροί의 복음서 문맥에서 통용되는 번역어를 유지하되, ‘깨끗하게 되다’로 질병 치유만이 아니라 정결의 의미도 남겼습니다. ‘좋은 소식’은 후대의 전문 용어를 본문에 강제하지 않으면서 εὐαγγελίζονται의 어휘적 연결을 보존합니다.
