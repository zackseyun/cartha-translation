  terminology: ‘부드러운 옷’은 μαλακά의 직역적 표현을 보존하며, 문맥상 고급스럽고 섬세한 옷이라는 함의는 각주로 밝힐 수 있습니다. ‘왕들의 집’은 τοῖς οἴκοις τῶν βασιλέων의 복수와 직설성을 유지합니다.
