  source_fidelity: 초안은 두 수사 의문문의 기본 뜻과 사치스러운 옷차림을 대비하는 흐름을 대체로 잘 옮겼습니다. 그러나 ἀλλά의 담화상 대조는 ‘오히려’보다 ‘그러나’가 더 직접적이며, ‘궁’은 복수형 ‘왕들의 집들/왕들의 집’보다 해석을 좁힙니다. φοροῦντες의 습관적 의미도 ‘입는’으로 드러내는 편이 좋습니다.
