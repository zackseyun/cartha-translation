  - severity: medium
    issue: ‘왕들의 궁’은 ‘왕들의 집들’이라는 원문의 표현을 ‘궁전’으로 좁히고 복수도 흐립니다.
    rationale: ‘궁전’은 가능한 해석이지만 본문은 ‘왕들의 집’으로 두고 대안은 각주에 제시하는 것이 최적 등가에 맞습니다.
  - severity: low
