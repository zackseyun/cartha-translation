  source_fidelity: 그리스어의 시간적 속격절(‘그들이 떠나가는 동안’)과 예수님께서 무리에게 요한에 관해 말씀하기 시작하신다는 흐름은 대체로 반영되었습니다. 그러나 두 질문은 모두 같은 ‘무엇을 보려고 광야로 나갔습니까?’라는 수사 의문 구조이므로, 두 번째도 동사구를 명시하는 편이 원문의 반복과 의미를 더 충실히 살립니다.
  naturalness: ‘떠나갈 때에’는 가능하지만 ‘떠나갈 때’가 현대 표준어에서 더 자연스럽습니다. 또한 요청된 현대 합쇼체에 맞추어 직접 화법의 ‘나갔느냐?’를 ‘나갔습니까?’로 고쳤습니다.
  terminology: ‘광야’, ‘무리’, ‘요한’, ‘갈대’는 적절합니다. 예수님을 주어로 하는 문장에는 ‘예수님께서’와 ‘말씀하기 시작하셨습니다’가 자연스럽고 일관된 존대 표현입니다.
  issues:
