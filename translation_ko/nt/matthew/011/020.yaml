review_pass:
  verdict: revise
  source_fidelity: The draft preserves the temporal marker, the ingressive sense of ‘began,’ the cities as the object of reproach, and the reason that they did not repent. However, ‘능한 일들이 … 일어난’ is not idiomatic modern Korean and weakly represents the possessive αὐτοῦ (‘his’).
  naturalness: ‘능한 일들’ is an unnatural collocation in contemporary standard Korean, and ‘일들이 … 일어난 성읍들’ is cumbersome. Recasting the clause with Jesus as the agent is natural Korean while retaining the sense that these were his deeds.
  terminology: ‘회개하지 않았기 때문입니다’ accurately renders οὐ μετενόησαν in formal-polite register. ‘능력의 일들’ retains the power/deed sense of δυνάμεις; a note supplies ‘기적들’ and ‘권능의 일들’ as legitimate alternatives.
  issues:
  - severity: medium
    issue: ‘그분의 능한 일들이 가장 많이 일어난’ is awkward and imprecise.
    rationale: ‘능한 일’ is not a natural modern Korean expression, and merely saying the deeds ‘occurred’ leaves the possessive/agentive force of αὐτοῦ less clear than necessary. The Greek refers to Jesus’ powerful deeds performed in those cities.
  revised_text: 그때 예수님께서는 자신이 가장 많은 능력의 일들을 행하신 성읍들을 꾸짖기 시작하셨습니다. 그들이 회개하지 않았기 때문입니다.
  revised_footnotes:
  - marker: a
    text: '‘능력의 일들’은 ‘기적들’ 또는 ‘권능의 일들’로도 옮길 수 있습니다(그리스어: 뒤나메이스).'
    reason: δυνάμεις의 어휘적 대안을 제시하여, 본문의 ‘능력의 일들’이 기적적 능력을 나타내는 행위들을 가리킴을 밝힙니다.
  revision_rationale: The revision replaces an unnatural Korean collocation with ‘능력의 일들’ and explicitly expresses Jesus as the one who performed them, while preserving the Greek superlative (‘most’), the beginning of the reproach, and repentance as the stated reason. The footnote preserves the English audit trail’s lexical alternatives for δυνάμεις.
