review_pass:
  verdict: revise
  source_fidelity: 원문의 μή+미래형 수동태는 부정의 답을 기대하는 수사 의문문으로 옮겼습니다. ᾅδης는 게헨나나 일반적 ‘지옥’으로 해석하지 않고 ‘하데스’로 음역했으며, 반사실 조건문과 소돔을 가리키는 단수 귀결도 보존했습니다.
  naturalness: 초안의 ‘능한 일들’은 현대 표준어에서 다소 부자연스럽고 의미가 불명확합니다. ‘권능의 일들’은 공관복음의 δυνάμεις에 맞고 현대 한국어 성서 문맥에서도 자연스럽습니다. 지정된 합쇼체에 맞추어 종결을 ‘-습니까/-것입니다’로 통일했습니다.
  terminology: Καφαρναούμ은 ‘가버나움’, Σόδομοι는 도시를 가리키는 ‘소돔’으로 옮겼습니다. ᾅδης는 ‘하데스’로 유지하고, ‘음부’가 현대어에서 불러일으킬 수 있는 불필요한 전통적·교리적 연상을 피했습니다.
  issues:
  - severity: medium
    issue: ‘음부’는 ᾅδης의 음역 또는 중립적 설명어보다 현대 독자에게 덜 명확하며 전통 번역의 신학적 연상을 동반할 수 있습니다.
    rationale: 본문은 ᾅδης와 게헨나를 구별하므로 ‘하데스’와 설명 각주가 원어의 어휘적 구별을 가장 안전하게 보존합니다.
  - severity: medium
    issue: ‘능한 일들’은 δυνάμεις의 현대 한국어 번역으로 부자연스럽습니다.
    rationale: 여기서 δυνάμεις는 예수의 능력 있는 행위들을 뜻하므로 ‘권능의 일들’이 의미와 문체를 더 잘 전달합니다.
  - severity: low
    issue: 초안은 평서 종결이 ‘-것이다’여서 요구된 현대 합쇼체와 일치하지 않습니다.
    rationale: ‘-것입니다’와 ‘-습니까’를 사용해 지정된 높임말 문체를 일관되게 반영했습니다.
