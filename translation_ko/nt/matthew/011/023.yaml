revisions:
- from: 그리고 너 가버나움아, 네가 하늘까지 높아지겠느냐? 너는 음부까지 내려갈 것이다. 네 안에서 일어난 능한 일들이 소돔에서 일어났더라면, 그곳이 오늘날까지 남아 있었을 것이다.
  to: 그리고 너, 가버나움아, 네가 하늘까지 높아지겠습니까? 너는 하데스[1]까지 내려갈 것입니다. 네 안에서 일어난 권능의 일들이 소돔에서 일어났더라면, 소돔은 오늘날까지 남아 있었을 것입니다.
  rationale: 수사 의문문, 하늘/하데스의 공간 은유, δυνάμεις의 행위 의미, 반사실 조건문을 보존했습니다. ‘하데스’의 의미 범위를 특정 교리적 ‘지옥’으로 축소하지 않도록 설명 각주를 추가했으며, 본문 전체를 현대 표준어 합쇼체로 다듬었습니다.
