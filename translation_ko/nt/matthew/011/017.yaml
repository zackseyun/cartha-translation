  source_fidelity: 초안은 αὐλέω의 악기 특정성(‘피리를 불다’)과 춤추지 않았다는 뜻은 대체로 반영합니다. 그러나 두 접속절을 ‘-어도’로 옮겨 원문의 단순 과거 병렬을 양보 관계로 바꾸었고, ἐθρηνήσαμεν의 애도 노래와 ἐκόψασθε의 관습적 애도 행위(가슴을 침)를 각각 ‘슬픈 노래’와 ‘울지 않았다’로 약화했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 비유 속 인용문의 반복·대조 구조를 유지합니다.
  terminology: ‘애가’는 θρηνέω의 장례적 애도 노래를 적절히 나타내며, ‘가슴을 치다’는 κόπτω의 중간태가 가리키는 애도 몸짓을 직역적으로 보존합니다. ‘피리를 불다’는 αὐλέω에 적합합니다.
  issues:
  - severity: medium
    issue: ‘불어도/불러도’의 양보 표현
    rationale: 원문은 ‘우리가 피리를 불었고 … 애가를 불렀다’라는 두 과거 행위와 상대의 반응 부재를 병렬로 제시합니다. ‘-어도’는 원문에 없는 양보 뉘앙스를 더합니다.
  - severity: medium
    issue: ‘슬픈 노래를 불러도’
    rationale: ἐθρηνήσαμεν은 일반적인 슬픈 노래보다 애도, 특히 장례적 애가를 뜻합니다.
  - severity: medium
    issue: ‘울지 않았다’
    rationale: ἐκόψασθε는 단순히 우는 것이 아니라 애도하며 자기 가슴을 치는 관습적 몸짓을 가리킵니다.
