  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
  footnotes:
  - marker: a
    text: Or, more literally, 'we piped for you.' The Greek verb refers specifically to playing a flute or pipe.
    reason: lexical_alternative
  - marker: b
    text: Or, 'we lamented' or 'we sang a funeral song.'
    reason: lexical_alternative
  - marker: c
    text: More literally, 'you did not beat yourselves,' referring to customary gestures of mourning such as beating the breast.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 이렇게 말합니다. 「우리가 너희를 위해 피리를 불었지만 너희는 춤추지 않았고, 우리가 애가를 불렀지만 너희는 가슴을 치지 않았습니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면, ‘너희는 자신들의 가슴을 치지 않았다.’ 당시 애도할 때 가슴을 치는 관습적 몸짓을 가리킵니다.
    reason: cultural_note
