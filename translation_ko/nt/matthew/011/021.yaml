review_pass:
  verdict: revise
  source_fidelity: The conditional comparison and the reference to repentance are conveyed accurately. However, the draft’s opening quotation mark is unmatched, and its wording for the prophetic pronouncement and for the mighty works is unnecessarily archaic for the required modern formal-polite Korean. ‘벳세다’ should be standardized to ‘벳새다.’
  naturalness: ‘화 있을진저’ and ‘능한 일들’ are biblical-archaic rather than natural modern standard Korean. ‘네게 화가 있다’ and ‘권능의 일들’ preserve the force and meaning in a contemporary formal register. Removing the unmatched opening quotation mark also resolves the punctuation defect.
  terminology: ‘고라신,’ ‘벳새다,’ ‘두로,’ and ‘시돈’ follow established Korean biblical name forms. ‘권능의 일들’ retains the sense of Greek δυνάμεις without prematurely reducing it to ‘기적.’ ‘회개하다’ is the appropriate established rendering of μετενόησαν.
  issues:
  - severity: medium
    issue: Register is archaic in ‘화 있을진저’ and ‘능한 일들.’
    rationale: The requested target is modern formal-polite Korean. These expressions sound like older Bible Korean and can be updated without loss of prophetic force or lexical meaning.
  - severity: low
    issue: The place name is spelled ‘벳세다.’
    rationale: ‘벳새다’ is the standard Korean biblical transliteration of Bethsaida.
  - severity: low
    issue: The text begins with an opening quotation mark but has no closing quotation mark.
    rationale: This is a punctuation/structural defect. Since the source does not require quotation punctuation, omitting the unmatched mark is the least intrusive correction.
  revised_text: 고라신아, 네게 화가 있다! 벳새다야, 네게 화가 있다! 너희 가운데서 일어난 권능의 일들이 두로와 시돈에서 일어났더라면, 그곳 사람들은 벌써 오래전에 베옷을 입고 재를 뒤집어쓰며 회개하였을 것이다.
