- from: 「화 있을진저, 고라신아! 화 있을진저, 벳세다야! 너희 가운데서 일어난 능한 일들이 두로와 시돈에서 일어났더라면, 그들이 베옷을 입고 재를 뒤집어쓰고 오래 전에 회개하였을 것이다.
  to: 고라신아, 네게 화가 있다! 벳새다야, 네게 화가 있다! 너희 가운데서 일어난 권능의 일들이 두로와 시돈에서 일어났더라면, 그곳 사람들은 벌써 오래전에 베옷을 입고 재를 뒤집어쓰며 회개하였을 것이다.
