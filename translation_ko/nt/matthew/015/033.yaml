  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], "Where could we get enough bread in this desolate place to satisfy so large a crowd?"
translation:
  language: ko
  text: 제자들이 그에게 말하였습니다. “이 외딴 곳[a]에서 이렇게 큰 무리를 배불리 먹일[c] 만큼 많은 빵[b]을 우리가 어디서 구하겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「광야에서」 / 「인적이 드문 곳에서」.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로 「이렇게 많은 빵들」 또는 「이렇게 많은 빵 덩이들」. 한국어에서는 「빵」을 집합적으로 표현할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 「먹이다」 / 「배부르게 하다」.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρημίᾳ
  english_pob_choice: desolate place
  chosen_korean: 황량한 곳
  alternatives_korean:
  - 광야
  - 외딴 곳
  lexicon: BDAG
  rationale: ἐρημία는 사람이 적은 황량한 지역. 「황량한 곳」이 자연스러우며 「광야」의 종교적 함의를 피한다.
- source_word: χορτάσαι
  english_pob_choice: satisfy
  chosen_korean: 배불리 먹일
  lexicon: BDAG
  rationale: χορτάζω는 「배부르게 하다」. 「배불리 먹이다」가 자연스럽다.
