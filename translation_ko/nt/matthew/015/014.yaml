base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: ko
  text: 「그들을 내버려 두십시오. 그들은 눈먼 이들의 눈먼 인도자들입니다[a]. 눈먼 이가 눈먼 이를 인도하면[b], 둘 다 구덩이에 빠질 것입니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「눈먼 이들을 위한 눈먼 인도자들」.
    reason: lexical_alternative
  - marker: b
    text: 「눈먼 이」라는 단수 표현은 이 속담에서 일반을 대표합니다.
    reason: cultural_note
  - marker: c
    text: 또는 「도랑」.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  english_pob_choice: Leave them alone
  chosen_korean: 그들을 내버려 두라
  alternatives_korean:
  - 그들을 놓아 두라
  lexicon: BDAG
  rationale: ἀφίημι의 「버려두다·놓아두다」의 명령형. 한국어 「내버려 두라」가 가장 자연스럽다.
- source_word: ὁδηγοὶ
  english_pob_choice: guides
  chosen_korean: 인도자들
  alternatives_korean:
  - 길잡이들
  lexicon: BDAG
  rationale: 종교 지도자에 대한 비유적 호칭. 「인도자」가 정착어이다.
- source_word: βόθυνον
  english_pob_choice: pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 도랑
  lexicon: BDAG
  rationale: 길가의 깊은 구멍·구덩이. 「구덩이」가 자연스럽다.
