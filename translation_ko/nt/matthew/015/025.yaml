  source_fidelity: 그리스어의 ἐλθοῦσα와 προσεκύνει 및 λέγουσα의 사건 서술은 대체로 잘 반영했습니다. 다만 본문의 과거 서술 흐름에서 본문 동사 「말합니다」는 부자연스러운 현재시제이므로 과거로 고쳐야 합니다. 「그 앞에」는 προσκυνέω와 함께 쓰인 여격의 대상 관계를 한국어로 더 자연스럽게 드러냅니다.
  naturalness: 「그 여자는 와서 그 앞에 무릎을 꿇고 말했습니다」는 현대 표준 한국어의 문장 흐름과 합쇼체 문체에 자연스럽습니다. 직접 인용의 「도와주십시오」도 긴급한 청원을 적절히 전달합니다.
  terminology: 「주여」는 Κύριε에 대한 정착된 성경식 호격으로 적절합니다. 「무릎을 꿇고」는 προσκυνέω를 경배로 단정하지 않고 신체적 경의 행위로 옮긴 선택이며, 각주에서 「절했다」와 「경배했다」를 제시하여 의미 범위를 보존합니다.
