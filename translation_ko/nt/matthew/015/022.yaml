  source_fidelity: 「그런데」는 καὶ ἰδού가 요구하는 대비를 덧붙이며, 본문의 ἔκραζεν(미완료)의 지속·반복적 외침도 「외치며 말합니다」보다 더 분명히 드러낼 수 있습니다. δαιμονίζεται는 귀신의 작용 아래 있음을 말하므로, 본문은 통상적 표현인 「귀신 들려」로 옮기고 대안적 표현은 각주로 보존하는 것이 적절합니다.
  naturalness: 「보십시오」와 「계속 외쳐 말했습니다」는 현대 표준어 합쇼체 문맥에서 자연스럽고, 서술 시제도 일관됩니다. 「가나안 여자」와 「다윗의 자손이여」는 성경 본문의 역사적·칭호적 어감을 자연스럽게 유지합니다.
  terminology: Χαναναία는 마가복음의 ‘시로페니키아 여자’로 바꾸지 않고 「가나안 여자」로 유지했습니다. 「다윗의 자손」은 메시아적 칭호를 보존하며, κύριε는 이 호칭과 결합된 문맥에 맞게 「주여」로 옮겼습니다.
