- source_word: Φράσον
  english_pob_choice: Explain
  chosen_korean: 설명해 주십시오
  alternatives_korean:
  - 풀이해 주십시오
  - 밝혀 주십시오
  lexicon: BDAG
  rationale: φράζω는 「분명히 말하다·풀이하다」. 베드로의 청원이므로 합쇼체 청유형 「-십시오」로 옮긴다.
- source_word: παραβολὴν
  english_pob_choice: parable
  chosen_korean: 비유
  lexicon: BDAG
  rationale: 복음서 정착어.
