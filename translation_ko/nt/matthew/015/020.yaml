  source_fidelity: ‘사람을 더럽히다’는 κοινόω의 정결 문맥과 더 넓은 오염·훼손의 뜻을 무리 없이 살립니다. ‘씻지 않은 손으로 먹는 것’도 ἀνίπτοις χερσὶν φαγεῖν을 정확히 반영합니다. 다만 ταῦτά ἐστιν τὰ κοινοῦντα의 복수 술어 명사에 맞추어 ‘것들’로 명시하는 편이 더 충실합니다.
  naturalness: 초안의 ‘이것들이 사람을 더럽히는 것이다’는 주어는 복수인데 보어가 단수여서 현대 한국어에서 다소 어색합니다. 또한 지정된 합쇼체에는 ‘입니다/않습니다’가 적합합니다.
  terminology: ‘더럽히다’는 이 문맥의 κοινόω에 적절하며, ‘사람’은 ἄνθρωπον의 대표적 단수를 자연스럽게 보존합니다. 별도 주석은 필수적이지 않습니다.
  issues:
