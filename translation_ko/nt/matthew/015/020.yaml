    rationale: ταῦτά와 τὰ κοινοῦντα가 모두 복수이므로 ‘이것들이 사람을 더럽히는 것들입니다’가 의미와 문법을 더 분명히 반영합니다. ‘것이다/않는다’는 요청된 합쇼체에도 맞지 않습니다.
  revised_text: 「이것들이 사람을 더럽히는 것들입니다. 그러나 씻지 않은 손으로 먹는 것은 사람을 더럽히지 않습니다.」
