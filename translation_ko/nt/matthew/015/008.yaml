lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  english_pob_choice: This people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 무리
  lexicon: BDAG
  rationale: λαός는 집합적으로 「백성」을 가리키며, 예언서 인용의 배경음을 살리기 위해 「이 백성」으로 옮긴다.
- source_word: τοῖς χείλεσίν
  english_pob_choice: with their lips
  chosen_korean: 입술로는
  lexicon: BDAG
  rationale: 도구적 여격. 외면의 입술과 내면의 마음 대조를 강조하기 위해 「-로는」 조사를 더한다.
- source_word: ἡ δὲ καρδία αὐτῶν
  english_pob_choice: but their heart
  chosen_korean: 그들의 마음은
  alternatives_korean:
  - 그들의 마음들은
  lexicon: BDAG
  rationale: 헬라어의 집합 단수를 한국어에서도 단수로 보존하여 예언적 인용의 수사적 무게를 살린다.
