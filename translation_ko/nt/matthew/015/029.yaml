    issue: 「갈릴리 바닷가로」가 παρά τὴν θάλασσαν τῆς Γαλιλαίας의 이동 경로 의미를 약화합니다.
    rationale: παρά+대격은 이동 동사와 함께 ‘~을 따라’라는 의미를 낼 수 있으며, 원문의 공간적 묘사를 보존하려면 「바닷가를 따라」가 더 적절합니다.
  - severity: medium
    issue: 「앉으셨습니다」가 ἐκάθητο의 미완료상(지속적 앉아 있음)을 충분히 드러내지 못합니다.
    rationale: 「앉아 계셨습니다」는 앉은 상태의 지속을 자연스럽게 표현하여 원문의 미완료형에 더 가깝습니다.
  revised_text: 예수께서는 그곳을 떠나 갈릴리 바닷가를 따라 오셨습니다. 그리고 산에 올라가셔서 거기에 앉아 계셨습니다.
