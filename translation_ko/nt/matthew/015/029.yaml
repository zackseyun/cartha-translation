  verdict: revise
  source_fidelity: 「갈릴리 바닷가로 오셨습니다」는 παρά+대격이 동사 ἦλθεν과 함께 나타내는 ‘바닷가를 따라/끼고 이동함’보다 단순한 도착 지점으로 읽힐 수 있습니다. 또한 ἐκάθητο는 미완료형이므로 지속 상태를 드러내는 표현이 필요합니다.
  naturalness: 「갈릴리 바닷가를 따라 오셨습니다」와 「앉아 계셨습니다」는 현대 표준 한국어 합쇼체로 자연스럽고, 서술의 순서도 원문에 충실합니다.
  terminology: 「예수께서/예수께서는」, 「갈릴리 바다」, 「산」은 자연스럽고 통용되는 성경 한국어 표현입니다. 정관사는 한국어에서 별도 표지가 필수적이지 않으므로 「산에」로 옮겨도 충분합니다.
  issues:
