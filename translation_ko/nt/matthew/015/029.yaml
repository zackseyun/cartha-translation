  to: 예수께서는 그곳을 떠나 갈릴리 바닷가를 따라 오셨습니다. 그리고 산에 올라가셔서 거기에 앉아 계셨습니다.
  rationale: 이동 경로를 나타내는 παρά+대격의 뉘앙스를 「갈릴리 바닷가를 따라」로 보존하고, 미완료형 ἐκάθητο의 지속성을 「앉아 계셨습니다」로 반영했습니다. 두 아오리스트 분사(떠나, 올라가셔서)는 주동사에 앞선 행동이라는 원문의 순서를 자연스러운 한국어 연결 표현으로 유지합니다.
  reviewer_model: gpt-5.6-terra
