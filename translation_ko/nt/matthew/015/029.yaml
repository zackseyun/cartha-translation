  lexicon: BDAG
  rationale: 「-가(邊)」가 호숫가의 자연스러운 한국어. 「갈릴리 바다」는 정착어이다.
- source_word: εἰς τὸ ὄρος
  english_pob_choice: on the mountain
  chosen_korean: 산에
  lexicon: BDAG
  rationale: 정관사가 가리키는 특정 「그 산」은 마태가 의도적으로 모세적·시내적 공명을 환기하는 모티프일 수 있으나, 한국어에서 「그 산」은 부자연스럽다.
