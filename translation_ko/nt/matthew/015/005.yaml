    rationale: ‘…유익하게 했을 것이 예물입니다’는 한국어에서 무엇이 예물인지와 어떤 행위가 조건절인지가 즉시 파악되지 않습니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 어휘 대안에 관한 각주는 발화 동사나 인용문 전체 끝보다 ‘예물’ 바로 뒤에 두는 것이 δῶρον을 가리킨다는 점을 명확히 합니다.
