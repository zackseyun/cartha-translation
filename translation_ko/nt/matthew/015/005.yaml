  to: 그러나 너희는 말합니다. “누구든지 자기 아버지나 어머니에게, ‘내게서 받아 당신에게 도움이 될 수 있었던 것은 예물[a]입니다’ 하고 말하면,”
  rationale: 수동태 ὠφεληθῇς를 ‘도움이 되다’가 아니라 수혜자의 관점에서 ‘도움을 받다’로 옮기고, ἐξ ἐμοῦ를 ‘내게서 받아’로 명시했습니다. ‘될 수 있었던’은 문맥상 부모가 받지 못하게 된 도움이라는 조건적·미실현의 함의를 자연스럽게 드러냅니다. 본문은 마태의 δῶρον에 맞춰 ‘예물’을 유지하고, ‘고르반’은 각주에만 남겼습니다. 원문이 이 절에서 끝내지 않고 다음 절로 이어지므로 한국어 인용문도 쉼표로 열어 두었습니다.
  reviewer_model: gpt-5.6-terra
