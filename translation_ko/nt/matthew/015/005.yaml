review_pass:
  verdict: revise
  source_fidelity: ‘내가 당신에게 드려 유익하게 했을 것’은 ἐξ ἐμοῦ(‘내게서/from me’)와 수동태 ὠφεληθῇς(‘도움을 받다/유익을 얻다’)의 관계를 부자연스럽게 능동·사역으로 바꿉니다. ‘내게서 받아 당신에게 도움이 될 수 있었던 것’은 원문의 출처 표현과 수동의 의미, 그리고 조건적·미실현의 뉘앙스를 더 충실히 보존합니다.
  naturalness: 초안의 ‘내가 당신에게 드려 유익하게 했을 것이 예물입니다’는 현대 표준 한국어로 어색하고, 주어와 서술 관계도 불분명합니다. 수정문은 인용문 안의 명사절과 술어를 자연스럽게 연결하며 합쇼체를 유지합니다.
  terminology: δῶρον의 본문 번역으로 ‘예물’은 문맥상 가능한 선택입니다. 마태복음 본문에 없는 ‘고르반’을 본문에 넣지 않고 각주에서 마가복음 7:11과 연결한 것도 적절합니다. 다만 각주 표지는 해당 어휘인 ‘예물’에 직접 붙이는 편이 분명합니다.
  issues:
  - severity: high
    issue: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς의 번역이 능동 사역 표현으로 바뀜
    rationale: ‘내가 당신에게 드려 유익하게 했을 것’은 ‘내가 주어서 유익하게 만들다’라는 뜻이 되어, ‘내게서 당신이 도움을 받았을/받을 수 있었던 것’이라는 원문의 수동태와 ἐξ ἐμοῦ의 출처 관계를 정확히 반영하지 못합니다.
