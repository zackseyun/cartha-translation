review_pass:
  verdict: revise
  source_fidelity: 첫 인용의 「공경하라」는 Τίμα를 잘 옮겼고, 「욕하는 자」도 κακολογῶν의 넓은 범위를 대체로 보존합니다. 그러나 θανάτῳ τελευτάτω는 죽음의 법적 정식을 나타내지만 행위 주체를 문법적으로 명시하지 않으므로, 「죽임을 당해야 한다」보다 「반드시 죽어야 합니다」가 그 모호성을 더 잘 보존합니다.
  naturalness: 원문의 한 동사 εἶπεν이 두 인용을 함께 이끄는데, 초안의 「말씀하시기를 …, 그리고, … 하셨다」는 쉼표와 인용 연결이 현대 한국어로 다소 부자연스럽고 문체도 합쇼체가 아닙니다. 두 인용을 「…라고 말씀하셨고, …라고도 말씀하셨습니다」로 연결하면 자연스럽고 격식 있는 문체가 됩니다.
  terminology: 「하나님」, 「공경하다」는 적절합니다. 「욕하다」는 여기서 ‘악하게 말하다/모욕하다/저주하다’의 의미를 자연스럽게 포괄하지만, ‘저주하다’라는 가능한 어휘 대안은 해당 어구에 각주로 제시하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 형식·문체와 인용 연결
    rationale: 초안의 종결형 「하셨다」는 요구된 현대 합쇼체와 일치하지 않으며, 「그리고,」의 쉼표 및 「말씀하시기를 … 하셨다」 구조는 부자연스럽습니다.
  - severity: medium
    issue: 사형 정식의 행위 주체
    rationale: 「죽임을 당해야 한다」는 수동 표현으로 인간 집행의 뉘앙스를 더하지만, θανάτῳ τελευτάτω는 죽어야 한다는 법적 결과를 말할 뿐 집행 주체를 명시하지 않습니다.
  - severity: low
    issue: 어휘 대안 각주의 위치
    rationale: 영어 감사 기록의 ‘curse’ 대안은 εἶπεν(‘말씀하셨다’)이 아니라 κακολογῶν(‘욕하는’)에 대응합니다. 한국어 각주는 해당 어구 뒤에 붙여야 합니다.
  revised_text: 하나님께서 “네 아버지와 어머니를 공경하십시오”라고 말씀하셨고, 또 “아버지나 어머니를 욕하는[a] 사람은 반드시 죽어야 합니다”라고 말씀하셨습니다.
