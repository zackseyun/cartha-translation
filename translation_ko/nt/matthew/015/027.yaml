  source_fidelity: 그리스어 부정과 인과 연결(καὶ γάρ), κυνάρια의 지소 뉘앙스, 그리고 복수 중성 주어에 따른 일반적 진술을 반영해야 합니다. 초안의 「그런데」는 καὶ γάρ의 설명적·첨가적 의미를 대조로 바꾸며, 「말합니다」는 εἶπεν의 과거 서술과 맞지 않습니다.
