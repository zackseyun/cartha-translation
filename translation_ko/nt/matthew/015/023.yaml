    issue: 시제 및 미완료상 표현
    rationale: 「말합니다」는 주변의 과거 서술과 시제가 불일치하며, ἠρώτουν의 반복·지속 의미도 충분히 나타내지 못합니다.
  - severity: medium
    issue: 부자연스러운 연결 표현
    rationale: 「다가와서 그에게 청하여 말합니다」는 한국어 서술에서 어색하고, προσελθόντες와 λέγοντες의 기능을 자연스럽게 처리하지 못합니다.
