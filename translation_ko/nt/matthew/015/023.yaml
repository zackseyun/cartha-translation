  to: 그러나 그는 그 여자에게 한마디도 대답하지 않으셨습니다. 그러자 그의 제자들이 다가와 그에게 계속 청했습니다. 「그 여자를 보내십시오[a]. 우리 뒤에서[b] 외치고 있습니다.」
