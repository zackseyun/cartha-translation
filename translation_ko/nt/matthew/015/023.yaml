  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 미완료 과거 ἠρώτουν의 계속성을 「계속 청했습니다」로 드러내고, ὄπισθεν의 대안 의미와 ἀπόλυσον의 해석상 모호성이 각각 해당 표현에 직접 연결되도록 각주 표지를 옮기는 것이 좋습니다.
  naturalness: 원문의 「청하여 말합니다」는 시제도 앞문장의 과거 서술과 어울리지 않고, 「청하다」와 「말하다」의 결합도 다소 부자연스럽습니다. 「다가와 그에게 계속 청했습니다」가 현대 한국어 합쇼체 서술로 자연스럽습니다.
  terminology: 「한마디도 대답하지 않으셨습니다」와 「그 여자를 보내십시오」는 적절합니다. 「보내십시오」는 제자들의 의도가 요청 수락인지 단순 축출인지 확정되지 않는 원문의 중립성을 잘 유지합니다.
