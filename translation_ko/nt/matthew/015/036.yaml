  source_fidelity: ‘가지시고’는 여기서 음식을 손에 취하는 동작을 나타내는 ἔλαβεν을 자연스럽게 전달하지 못할 수 있고, ‘감사 기도를 드린’은 εὐχαριστήσας에 없는 ‘기도’라는 표현을 보탭니다. 이를 각각 ‘집어 드시고’와 ‘감사하신 후’로 고쳐 원문의 행동과 표현 범위를 보존했습니다. ἐδίδου의 미완료적 지속은 ‘계속 주셨으며’로 유지했습니다.
  naturalness: ‘집어 드시고, 감사하신 후 떼어’는 현대 표준어 합쇼체에서 자연스럽고, 음식 분배 장면의 순서도 분명합니다. 두 번째 절의 동사 보충은 그리스어의 타원 표현을 한국어 문장으로 자연스럽게 풀어 준 것입니다.
  terminology: ‘빵’, ‘물고기’, ‘제자들’, ‘무리’는 문맥과 마태복음의 일반적 용례에 적절합니다. 성찬적 또는 교리적 표현을 덧붙이지 않았습니다. 각주에서는 ‘헬라어’ 대신 현대 학술 한국어에서 통용되는 ‘그리스어’를 사용했습니다.
