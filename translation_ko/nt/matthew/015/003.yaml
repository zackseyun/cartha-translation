  source_fidelity: 그리스어의 접속사 δέ는 「그러나」로, ἀποκριθεὶς εἶπεν은 「대답하여 … 말씀하셨습니다」로 충실히 반영했습니다. καὶ ὑμεῖς의 대조·첨가 뉘앙스도 「너희도」에 보존되어 있습니다. παραβαίνετε는 「어기느냐」, τὴν ἐντολὴν τοῦ θεοῦ는 「하나님의 계명」으로 정확합니다. διὰ τὴν παράδοσιν ὑμῶν은 여기서 원인·근거를 나타내므로 「너희의 전통 때문에」는 자연스럽고 본문에 충실합니다.
  naturalness: 현대 표준어 합쇼체 서술과 직접 인용의 의문형이 자연스럽습니다. 「어찌하여」와 「너희」는 성경 본문의 격식 있는 논쟁적 어조에 알맞으며, 지나치게 고어적이지 않습니다.
  terminology: 「하나님의 계명」과 「너희의 전통」은 신적 계명과 상대방의 전승 사이의 대조를 선명하게 유지합니다. 「전통」은 특정 문제의 전통을 가리킬 뿐 모든 전통에 대한 포괄적 판단을 덧붙이지 않습니다.
