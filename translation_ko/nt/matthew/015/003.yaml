- source_word: ἐντολὴν τοῦ θεοῦ
  english_pob_choice: commandment of God
  chosen_korean: 하나님의 계명
  alternatives_korean:
  - 하나님의 명령
  lexicon: BDAG
  rationale: 인간 전통과 신적 명령의 대조를 분명히 하기 위해 언약적 무게가 실린 「계명」을 채택한다.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
