review_pass:
  verdict: revise
  source_fidelity: 핵심 사건 순서와 결과절은 대체로 충실합니다. 다만 κυλλούς는 단순히 ‘손발 굽은’ 상태에 한정되지 않고 팔다리에 장애나 훼손이 있는 사람들을 가리키므로, 현 표현은 의미를 불필요하게 좁히며 현대 한국어로도 부자연스럽습니다. κωφούς는 문맥상 ‘말 못 하던’으로 옮길 수 있으나 ‘듣지 못하는’이라는 어휘 범위도 있어 주석으로 밝혀 두는 것이 적절합니다.
  naturalness: ‘손발 굽은 자들’은 현대 표준 한국어에서 어색하고 사람을 지칭하는 방식으로도 권장하기 어렵습니다. ‘팔다리가 불편하던 사람들’이 자연스럽고 원문의 범위를 더 잘 보존합니다. 병렬 목록에는 ‘사람들’을 사용하고, 뒤 절의 주어는 생략하면 합쇼체 서술에서 매끄럽습니다.
  terminology: ‘이스라엘의 하나님께 영광을 돌렸습니다’는 δοξάζω와 τὸν θεὸν Ἰσραήλ을 정확하고 자연스럽게 반영합니다. ‘온전해지고’는 ὑγιεῖς의 회복된 상태를 적절히 나타냅니다.
  issues:
  - severity: medium
    issue: ‘손발 굽은 자들’
    rationale: κυλλούς의 의미를 굽은 손발이라는 특정 외형으로 좁히고 현대 한국어 표현으로도 부자연스럽습니다. 팔다리의 장애·훼손을 포괄하는 표현이 필요합니다.
  - severity: low
    issue: κωφούς의 어휘적 범위 미표시
    rationale: λαλοῦντας 때문에 ‘말 못 하던’이 문맥상 적절하지만, κωφός는 ‘듣지 못하는’ 뜻도 가질 수 있으므로 번역 선택의 범위를 주석으로 보존하는 것이 좋습니다.
  revised_text: 그 결과 무리는 말 못 하던 사람들이 말하고, 팔다리가 불편하던 사람들이 온전해지고, 다리를 저는 사람들이 걷고, 눈먼 사람들이 보게 되는 것을 보고 놀랐습니다. 그리고 이스라엘의 하나님께 영광을 돌렸습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘듣지 못하던 사람들이 말하는 것’. 그리스어 단어는 듣지 못하는 사람이나 말하지 못하는 사람을 가리킬 수 있습니다. 여기서는 바로 뒤의 ‘말하고’ 때문에 ‘말 못 하던’으로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: κυλλούς를 현대 한국어에서 자연스럽고 원문의 포괄적 의미를 보존하는 ‘팔다리가 불편하던 사람들’로 수정했습니다. 또한 κωφούς의 문맥상 선택은 유지하되 어휘적 대안을 주석으로 제시했습니다. 나머지 병렬 구조, 결과 관계, 하나님께 영광을 돌린다는 표현은 유지했습니다.
