    reason: lexical_alternative
  - marker: b
    text: 또는 “팔다리가 훼손된 이들이 회복되고” 또는 “팔다리에 장애가 있던 이들이 건강해지고.” 그리스어 κυλλός는 팔다리에 장애가 있거나 훼손된 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 현대 한국어의 자연스러움과 존중하는 장애 관련 표현을 위해 ‘손발 굽은 자들’을 원문의 의미 범위에 맞는 ‘팔다리에 장애가 있던 이들’로 고쳤습니다. κωφός와 κυλλός의 번역상 가능한 의미 범위는 본문 선택을 유지하면서 각주로 보존했습니다. 나머지 치유의 병렬 구조와 하나님께 돌린 영광은 유지했습니다.
