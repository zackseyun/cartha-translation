  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: ko
  text: 그 결과 무리는 말하지 못하던 이들이 말하고[a], 팔다리에 장애가 있던 이들이 온전해지고[b], 다리를 저는 이들이 걷고, 보지 못하던 이들이 보는 것을 보고 놀랐습니다. 그리고 그들은 이스라엘의 하나님께 영광을 돌렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “듣지 못하던 이들이 말하고.” 그리스어 κωφός는 듣지 못하는 사람이나 말하지 못하는 사람을 가리킬 수 있습니다. 여기서는 뒤따르는 “말하고” 때문에 말하지 못하던 사람으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “팔다리가 훼손된 이들이 회복되고” 또는 “팔다리에 장애가 있던 이들이 건강해지고.” 그리스어 κυλλός는 팔다리에 장애가 있거나 훼손된 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμάσαι
  english_pob_choice: marveled
  chosen_korean: 놀랐습니다
  alternatives_korean:
  - 경이로워했습니다
  lexicon: BDAG
  rationale: θαυμάζω의 일반적 의미. 「놀라다」가 자연스럽다.
- source_word: ἐδόξασαν τὸν θεὸν Ἰσραήλ
  english_pob_choice: glorified the God of Israel
  chosen_korean: 이스라엘의 하나님께 영광을 돌렸습니다
  lexicon: BDAG
  rationale: δοξάζω의 정착어 「영광을 돌리다」. 「이스라엘의 하나님」 표현은 이방 영역(15:21~)에서 일어난 일을 마태가 의도적으로 표기한 것을 보존한다.
