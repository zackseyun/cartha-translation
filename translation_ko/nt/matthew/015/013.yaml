  source_fidelity: φυτεία는 문자적으로 식물 또는 심긴 것을 가리키며, 여기서는 아버지께서 ‘심으셨다’는 동사와 ‘뿌리째 뽑히다’라는 결말이 이루는 농경 비유를 유지해야 합니다. 초안의 ‘식물’도 가능한 번역이나, ‘모든 식물’은 일반적인 식물 전체를 뜻하는 듯 들릴 수 있습니다. ‘심긴 모든 것’은 비유적 대상을 특정하지 않으면서 원문의 결속된 심기/뿌리 뽑기 이미지를 더 잘 보존합니다. ἐκριζωθήσεται의 ‘뿌리째 뽑힐’도 그 의미를 충실히 드러냅니다.
  naturalness: 초안의 직접 인용문 끝맺음 ‘것이다’는 지정된 현대 합쇼체와 맞지 않습니다. ‘것입니다’로 고치고, ‘그러나’보다 문맥 의존적인 δέ의 서술 진행을 자연스럽게 반영하는 ‘그러자’를 사용했습니다. ‘대답하여 말씀하셨습니다’는 원문의 두 동사를 과도하게 어색하게 만들지 않으면서 보존합니다.
  terminology: ‘하늘에 계신 내 아버지’는 ὁ πατήρ μου ὁ οὐράνιος를 자연스럽게 옮기며, 신학적 호칭을 덧붙이거나 비유의 대상을 교훈·전통·사람으로 해석하지 않습니다. ‘심긴 모든 것’의 명사적 표현에는 ‘심은 모든 것’이라는 가능한 대안을 각주로 제시합니다.
