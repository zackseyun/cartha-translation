  chosen_korean: 뒷간
  alternatives_korean:
  - 변소
  - 측간
  lexicon: BDAG
  rationale: ἀφεδρών은 1세기 변소·하수. 「뒷간」이 한국어에서 가장 직설적이며 사실적 어조를 살린다.
