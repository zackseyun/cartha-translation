  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: ko
  text: 「그러나 그들은 나를 헛되이 경배하며, 사람의[b] 계명들을 교훈으로 가르칩니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「사람의 계명들을 교훈으로 삼아 가르치며」. 헬라어 통사는 다소 압축적이다.
    reason: alternative_reading
  - marker: b
    text: 또는 「사람들의」. 헬라어 ἀνθρώπων은 일반적 인간을 가리키며 신적인 것과 대비된다.
    reason: lexical_alternative
lexical_decisions:
- source_word: μάτην
  english_pob_choice: in vain
  chosen_korean: 헛되이
  lexicon: BDAG
  rationale: 정착된 한국어 부사. 예언적 판단의 어조를 보존한다.
- source_word: σέβονταί
  english_pob_choice: worship
  chosen_korean: 경배하니
  alternatives_korean:
  - 섬기니
  - 공경하니
  lexicon: BDAG
  rationale: σέβομαι는 신적 존재에 대한 경외·예배를 가리킨다. 대상이 「나(=하나님)」이므로 「경배」가 자연스럽다.
- source_word: διδασκαλίας ἐντάλματα ἀνθρώπων
  english_pob_choice: as doctrines the commandments of men
  chosen_korean: 사람의 계명을 교훈으로
  alternatives_korean:
  - 사람의 계명들을 교훈들로
  lexicon: BDAG
  rationale: 압축된 헬라어 통사를 자연스러운 한국어 「-을 -으로 가르치다」 구조로 풀되, 인간 명령에 교리적 권위를 부여한다는 의미를 분명히 한다.
