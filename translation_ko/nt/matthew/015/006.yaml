  to: 그는 결코 자기 아버지를 공경할 필요가 없습니다[b]. 그리고 여러분은 여러분의 전통 때문에 하나님의 말씀을 무효로 만들었습니다[a].
  rationale: 원문의 단순 접속 καὶ와 ἀκυρόω의 무효화 의미를 더 직접적으로 반영하고, 요청된 현대 한국어 합쇼체로 문장을 통일했습니다. 본문은 SBLGNT의 단수 ‘아버지’와 ‘하나님의 말씀’을 유지했으며, 사본 변이와 ‘공경’의 문맥상 함의는 각주로만 처리했습니다.
  reviewer_model: gpt-5.6-terra
