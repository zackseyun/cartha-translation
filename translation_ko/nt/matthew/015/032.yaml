- from: 예수께서 자기 제자들을 부르시고 말씀하셨습니다. 「내가 이 무리를 불쌍히 여긴다. 그들이 벌써 사흘이나 나와 함께 있으면서 먹을 것이 없기 때문이다. 그들을 굶긴 채로 보내고 싶지 않다. 길에서 쓰러질까 염려된다.」[a][b][c][d]
  to: 예수께서 제자들을 자기에게 부르시고 말씀하셨습니다. 「나는 이 무리를 불쌍히 여깁니다.[a] 그들이 벌써 사흘 동안 나와 함께 머물러 있는데 먹을 것이 없습니다.[b] 나는 그들을 굶주린 채로 돌려보내기를 원하지 않습니다.[c] 그들이 길에서 쓰러질까 봐 염려됩니다.[d]」
  rationale: 번역을 현대 합쇼체로 통일하고, 예수께 제자들을 불러오신 방향성 및 군중이 길에서 쓰러질지 모른다는 우려를 명시했습니다. ‘굶주린 채로’는 νήστεις가 가리키는 비자발적 무식(無食) 상태를 자연스럽게 전달합니다. 각주 a는 원어의 깊은 연민이라는 의미에 맞게 바로잡았으며, 모든 각주 표지는 해당 본문 표현 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:27Z'
