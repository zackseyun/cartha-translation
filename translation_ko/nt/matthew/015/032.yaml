  source_fidelity: 핵심 의미는 대체로 정확합니다. 다만 προσκαλεσάμενος의 ‘자기에게 불러’라는 방향성을 본문에 드러내고, μήποτε ἐκλυθῶσιν의 우려의 결과를 ‘그들이 길에서 쓰러질까 봐’로 명시하는 편이 더 충실합니다.
  naturalness: 현행 직접 인용문은 평서체(‘여긴다/싶지 않다’)여서 요구된 현대 합쇼체와 일치하지 않습니다. 합쇼체로 일관되게 고치고, ‘굶긴 채로’보다 사람들의 상태를 직접 나타내는 ‘굶주린 채로’가 자연스럽습니다.
  terminology: ‘불쌍히 여기다’는 σπλαγχνίζομαι의 정착된 한국어 번역으로 적절합니다. 그러나 각주 a의 ‘가엾이 여겨 감동을 받는다’는 동사의 뜻을 부정확하게 풀어내므로 ‘깊이 불쌍히 여기다’로 고쳐야 합니다. νήστεις의 각주는 종교적 금식을 뜻하지 않는다는 설명을 유지하되 문법적으로 자연스럽게 다듬었습니다.
  issues:
