  naturalness: 「화가 있으리니」는 현대 합쇼체로는 다소 고어적입니다. 「너희에게 화가 있습니다」와 「겉으로는 길게 기도하는 체하면서」가 현대 표준어에서 자연스럽고, 원문의 고발적 어조도 유지합니다.
