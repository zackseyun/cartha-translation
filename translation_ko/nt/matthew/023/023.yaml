  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
  footnotes:
  - marker: a
    text: Or 'faithfulness.' The Greek word can denote faith, trust, or fidelity; in this ethical context many understand it as covenant faithfulness.
    reason: alternative_reading
translation:
  language: ko
  text: 너희에게 화가 있으리니, 서기관들과 바리새인들, 위선자들아! 너희가 박하와 회향과 근채의 십일조는 바치면서 율법의 더 중대한 것들, 곧 정의와 자비와 믿음[a]은 버려두었습니다. 이것들은 행하되 저것들은 버려두지 말아야 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신실함’. 그리스어는 믿음, 신뢰, 충실함을 뜻할 수 있으며, 이 윤리적 문맥에서는 많은 이들이 신실함으로 이해합니다.
    reason: alternative_reading
