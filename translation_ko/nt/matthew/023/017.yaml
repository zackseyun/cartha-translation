  terminology: ‘성전’은 ναός의 문맥상 적절한 번역이며, ‘거룩하게 한’은 성별·성화의 제의적 의미를 불필요한 교리적 해석 없이 보존합니다. 별도의 주석은 한국어 본문의 이해나 원문 충실성을 위해 필수적이지 않습니다.
