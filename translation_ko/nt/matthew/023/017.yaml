  source_fidelity: 원문의 호격 복수(μωροὶ καὶ τυφλοί), 비교 의문(τίς ... μείζων), 금과 성전의 대조, 그리고 성전이 금을 거룩하게 했다는 관계를 충실히 옮겼습니다. ‘거룩하게 한’은 과거 부정과분사의 관점과 성전 맥락의 ἁγιάζω를 자연스럽게 반영합니다.
