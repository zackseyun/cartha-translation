  source_fidelity: καθηγηταί는 이 문맥에서 칭호로 불리는 ‘지도자/인도자’를 가리키며, ‘지도자’는 가능한 번역입니다. 다만 수동 명령 κληθῆτε는 ‘칭함을 받다’보다 ‘불리다’가 현대 한국어에서 더 직접적이고 자연스럽습니다. ὅτι 이하의 근거와 εἷς의 단수 강조도 ‘한 분, 곧 메시아이십니다’로 보존했습니다.
  naturalness: 초안의 ‘지도자라 칭함도 받지 마십시오’는 문법적으로 가능하지만 다소 겹치고 문어적인 표현입니다. ‘지도자라 불리지도 마십시오’가 합쇼체를 유지하면서 더 자연스럽습니다. 청자 복수는 현대 표준어에 맞추어 ‘여러분’으로 옮겼습니다.
  terminology: καθηγητής는 인접 문맥의 διδάσκαλος와 구별되는 칭호이므로 ‘교사’로 평준화하지 않고 ‘지도자’로 유지했습니다. ὁ χριστός는 칭호이므로 ‘메시아’로 번역하고, 통용 명칭 ‘그리스도’를 대안 각주로 제시했습니다.
