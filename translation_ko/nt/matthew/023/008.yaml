review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition, the singularity of the disciples' teacher, and their shared status as ἀδελφοί. A small revision makes the Korean prohibition more idiomatic and uses the ordinary respectful Korean designation for a teacher.
  naturalness: “‘랍비’라 칭함을 받지 마십시오” is understandable but somewhat formal and less natural than “‘랍비’라고 불리지 마십시오.” “선생님” is the natural modern formal-polite rendering of διδάσκαλος here.
  terminology: 랍비 appropriately retains the Jewish title, while 선생님 renders διδάσκαλος distinctly. 형제 preserves the masculine-plural familial term; a note can clarify its possible collective reference without altering the main text.
  issues:
  - severity: low
    issue: Less idiomatic passive-title expression
    rationale: “칭함을 받지 마십시오” is grammatical, but “‘랍비’라고 불리지 마십시오” is more natural in contemporary standard Korean while retaining the passive prohibition μὴ κληθῆτε.
  - severity: low
    issue: Teacher term lacks customary respectful form
    rationale: In modern Korean, “선생님” is the ordinary respectful term for a teacher and fits the referent and the formal-polite register better than bare “선생.”
  revised_text: 그러나 너희는 ‘랍비’라고 불리지 마십시오. 너희의 선생님은 한 분이시며, 너희는 모두 형제이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: ‘랍비’는 ‘선생’이라는 뜻을 지닌 유대교의 호칭입니다. 음역을 유지하여 뒤의 ‘선생님’과 구별했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제’는 그리스어 남성 복수형 ἀδελφοί를 옮긴 말입니다. 문맥상 함께 있는 제자들을 통틀어 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision preserves the direct prohibition and its rationale without deciding how broadly the saying must be applied. It retains ‘랍비’ as a historical title, renders διδάσκαλος naturally as ‘선생님,’ and keeps ‘형제’ for the masculine plural while documenting its collective contextual use.
