  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition, the singularity of the disciples' teacher, and their shared familial status. However, the source term Ῥαββί is a title retained transliterated in the English audit trail; Korean should preserve this with the standard spelling “라삐,” rather than the nonstandard “랍비.”
  naturalness: The sentence is natural in modern formal-polite Korean. “한 분이시며” appropriately renders the singular εἷς with an honorific predicate. Repeating “너희” is acceptable for the Greek emphasis, though the connective is more naturally represented with “왜냐하면” in Korean.
  terminology: Use the standard Korean biblical/Jewish title “라삐.” “선생” is a natural rendering of διδάσκαλος in this context. “형제” faithfully retains the masculine-plural familial metaphor; a note should clarify its collective contextual reference without altering the main text.
  issues:
  - severity: medium
    issue: ‘랍비’ should be standardized as ‘라삐’.
    rationale: Ῥαββί is a transliterated Jewish title. Standard Korean Bible usage and Korean transliteration favor “라삐,” which also preserves the distinction from the following διδάσκαλος (‘선생’).
  - severity: low
    issue: No footnote explains the contextual collective reference of ‘형제’.
    rationale: ἀδελφοί is grammatically masculine plural and is correctly rendered ‘형제,’ but the supplied audit trail calls for a lexical note that it can collectively denote fellow disciples.
  revised_text: 그러나 너희는 ‘라삐’라 칭함을 받지 마십시오. 왜냐하면 너희의 선생은 한 분이시며, 너희는 모두 형제이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: ‘라삐’는 ‘선생’이라는 뜻을 지닌 유대교의 칭호입니다. 음역을 유지하여 뒤의 ‘선생’과 구별하고 유대적 배경을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제’는 남성 복수형 ἀδελφοί를 옮긴 말입니다. 문맥상 함께 있는 제자들을 통틀어 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: ‘라삐’라는 음역을 표준화하여 원문의 칭호와 뒤따르는 ‘선생’을 구별했습니다. 원문의 직접적인 금지와 그 근거를 유지했으며, ‘형제’의 문법 형태와 문맥상 집단 지시를 각주로 밝혔습니다.
