    rationale: '"화가 있으리니" is archaic/literary and does not consistently maintain the requested modern formal-polite 합쇼체.'
  - severity: medium
    issue: '"매이게 된다" is awkward for ὀφείλει in Korean.'
    rationale: The Greek denotes obligation in the oath scenario. "맹세를 지킬 의무가 있습니다" supplies the contextually implied obligation in idiomatic Korean, as the English audit trail also does with "is bound."
