  source_fidelity: The draft accurately conveys the denunciation, the metaphor of blind guides, and the contrasted oath formulations. However, its main-clause style ("화가 있으리니") is not modern formal-polite Korean, and "매이게 된다" is less natural and less precise than an explicit statement of obligation in this oath context.
  naturalness: A modern 합쇼체 rendering should use "화가 있습니다" and "말합니다." The phrase "맹세를 지킬 의무가 있습니다" naturally expresses the elliptical ὀφείλει without assigning a specific object beyond the oath context.
  terminology: '"눈먼 인도자들" preserves the guide metaphor well. "성전을 두고 맹세하다" and "성전의 금" are established and natural Korean formulations for the oath language and ναός/its gold.'
  issues:
