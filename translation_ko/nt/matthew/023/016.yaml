review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 맹세 공식은 보존되어 있으나, 초안의 ‘아무것도 아니지만’은 무엇이 ‘아무것도 아닌지’가 불분명하고, ‘매이게 된다’는 현재의 일반적 의무를 미래·수동의 어색한 표현으로 옮깁니다.
  naturalness: ‘눈먼 인도자들아’는 문맥상 이해되지만 현대 합쇼체에서는 ‘눈먼 인도자들이여’가 더 자연스럽습니다. 인용문에서는 맹세 자체를 주어로 드러내어 한국어 문장을 명료하게 했습니다.
  terminology: ναός는 ‘성전’으로, χρυσός τοῦ ναοῦ는 ‘성전의 금’으로 적절히 유지했습니다. ὀφείλει는 교파적 해석을 더하지 않고 ‘의무가 있다’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘성전을 두고 맹세하면 아무것도 아니지만’의 생략된 주어가 한국어에서 불명확함
    rationale: οὐδέν ἐστιν은 맹세의 효력에 관한 타원 표현입니다. 한국어에서는 ‘성전을 두고 한 맹세는’이라고 밝혀야 사람이 ‘아무것도 아닌’ 것으로 오해되지 않습니다.
  - severity: medium
    issue: ‘매이게 된다’가 ὀφείλει의 의미와 상에 부정확하고 부자연스러움
    rationale: ὀφείλει는 일반적으로 ‘의무가 있다/책임이 있다’라는 현재의 상태를 나타냅니다. 미래적 수동 표현은 원문의 일반적 진술을 약화하고 한국어 관용에도 덜 맞습니다.
  revised_text: 너희에게 화가 있습니다, 눈먼 인도자들이여! 너희는 이렇게 말합니다. ‘누구든지 성전을 두고 한 맹세는 아무것도 아니지만, 누구든지 성전의 금을 두고 맹세하면 의무가 있다.’
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘아무것도 아니다.’ 여기서는 그러한 맹세가 효력이 없는 것으로 여겨진다는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: 원문의 경고 형식, ‘눈먼 인도자’라는 비유, 성전과 성전의 금 사이의 대조를 유지했습니다. 첫 절의 타원적 표현은 본문에서 맹세를 주어로 밝혀 자연스럽게 옮기되, ‘아무것도 아니다’라는 원문의 압축된 표현은 각주로 보존했습니다. 둘째 절은 ὀφείλει의 의무·책임의 뜻을 ‘의무가 있다’로 옮겨 불필요하게 ‘맹세에’ 또는 ‘그 맹세로’ 같은 보충을 덧붙이지 않았습니다.
