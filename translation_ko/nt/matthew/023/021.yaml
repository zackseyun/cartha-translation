  source_fidelity: 원문의 병렬 구조를 충실히 옮겼습니다. 「성전을 두고 맹세하는 자」는 ὁ ὀμόσας ἐν τῷ ναῷ를, 「그 성전과 그 안에 거하시는 분을 두고 맹세하는 것입니다」는 ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ κατοικοῦντι αὐτόν을 자연스럽게 반영합니다. 여기서 「두고 맹세하다」는 맹세 공식의 ἐν을 한국어 관용에 맞게 잘 처리합니다.
