id: MAT.23.18
reference: Matthew 23:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
  footnotes:
  - marker: a
    text: Or 'by the offering.' The Greek word can denote a gift presented to God in the temple.
    reason: lexical_alternative
  - marker: b
    text: That is, according to the teaching Jesus is condemning, an oath by the altar 'counts for nothing,' but an oath by the gift on it is considered binding.
    reason: cultural_note
translation:
  language: ko
  text: 또 ‘누구든지 제단을 두고 맹세하면 아무 효력이 없습니다[a]. 그러나 그 위에 있는 예물[b]을 두고 맹세하면 의무를 집니다’라고 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧, 예수님께서 정죄하시는 가르침에 따르면, 제단을 두고 한 맹세는 아무 효력이 없는 것으로 여겨집니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘제물’. 그리스어는 성전에서 하나님께 드리는 예물이나 제물을 가리킬 수 있습니다.
    reason: lexical_alternative
