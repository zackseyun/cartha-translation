  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
  footnotes:
  - marker: a
    text: Or 'but inside it is full of robbery/extortion and lack of self-control.' The Greek terms can carry stronger senses of exploitative taking and undisciplined excess.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희에게 화가 있습니다, 서기관들과 바리새인들, 위선자들아! 너희가 잔과 접시의 겉은 깨끗이 하면서, 그 안에는 탐욕과 무절제[a]가 가득합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강탈/착취와 절제하지 못함’. 그리스어 표현은 착취적으로 빼앗는 행위와 절제 없는 과도함이라는 더 강한 뜻을 지닐 수도 있습니다.
    reason: lexical_alternative
