review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘사람들에게 보이려고’와 경문 관련 표현을 대체로 잘 옮깁니다. 그러나 μεγαλύνουσι는 ‘크게 하다/확대하다’라는 뜻인데, ‘옷술을 길게 늘어뜨립니다’는 길이와 늘어뜨리는 동작을 덧붙여 원문의 의미를 좁히고 변경합니다.
  naturalness: ‘그들은 사람들에게 보이려고 모든 일을 합니다’와 ‘경문 상자를 넓게 만들고 옷술을 크게 만듭니다’는 현대 표준 한국어의 합쇼체로 자연스럽습니다.
  terminology: φυλακτήρια는 유대교 관습의 구체적 물건을 가리키므로 ‘경문 상자’로 번역하고 주석으로 설명합니다. κράσπεδα는 ‘옷술’로 옮기며, 비판의 대상이 물건이나 관습 자체가 아니라 과시적 행위임을 본문의 목적 표현이 유지합니다.
  issues:
  - severity: medium
    issue: ‘옷술을 길게 늘어뜨립니다’
    rationale: μεγαλύνουσι는 옷술을 ‘크게 한다/확대한다’는 표현입니다. ‘길게’는 가능한 결과를 특정하지만 원문이 명시하지 않으며, ‘늘어뜨립니다’는 원문에 없는 동작입니다.
  - severity: low
    issue: ‘경문 띠’의 지시 대상이 다소 불분명함
    rationale: φυλακτήρια는 성구를 넣어 착용한 작은 가죽 상자이므로 ‘경문 상자’가 물건의 성격을 더 분명하게 전달합니다. 문화 주석을 덧붙이면 낯선 용어도 이해할 수 있습니다.
  revised_text: 그러나 그들은 사람들에게 보이려고 모든 일을 합니다. 그래서 경문 상자[a]를 넓게 만들고 옷술[b]을 크게 만듭니다.
