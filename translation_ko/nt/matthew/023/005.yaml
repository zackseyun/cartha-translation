  to: 그러나 그들은 사람들에게 보이려고 모든 일을 합니다. 그래서 경문 상자[a]를 넓게 만들고 옷술[b]을 크게 만듭니다.
  rationale: 원문의 대조(‘그러나’), 목적(‘사람들에게 보이려고’), 설명 접속(‘그래서’)을 유지했습니다. 특히 옷술을 ‘길게 늘어뜨린다’는 해석적 표현을 원문의 폭을 보존하는 ‘크게 만든다’로 바로잡았습니다.
