- from: 그러나 너희에게 화가 있으리니, 서기관들과 바리새인들, 위선자들아! 너희가 사람들 앞에서 하늘 나라를 닫아 버리기 때문입니다. 너희도 들어가지 않고, 들어가려는 자들도 들어가지 못하게 합니다.
  to: 그러나 너희에게 화가 있으리니, 서기관들과 바리새인들인 위선자들아! 너희가 사람들 앞에서 하늘 나라를 닫기 때문입니다. 너희도 들어가지 않고, 들어가고 있는 사람들도 들어가지 못하게 합니다.[a]
  rationale: 원문의 문법과 은유를 유지하면서, 초안에 더해진 ‘버리다’의 뉘앙스를 제거했습니다. 또한 현재분사의 범위를 본문과 각주로 보존하여 논쟁적·해석적 한정을 피했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:57Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 οὐαί의 예언자적 화 선언, ‘하늘 나라’, 그리고 자신들은 들어가지 않으면서 다른 이들의 دخول을 막는 대조를 보존합니다. 다만 초안의 ‘들어가려는 자들’은 현재분사 τοὺς εἰσερχομένους를 ‘들어가려고 시도하는 사람들’로 다소 좁힐 수 있으므로, 본문을 더 직접적인 ‘들어가고 있는 사람들’로 고치고 그 어휘적 범위를 각주로 밝혔습니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘닫아 버리다’의 완료·강조 뉘앙스를 제거하고, 호격 관계를 ‘서기관들과 바리새인들인 위선자들아’로 명료하게 표시했습니다.
  terminology: ‘서기관들’, ‘바리새인들’, ‘위선자들’, ‘하늘 나라’는 한국어 성경 문맥에서 널리 이해되는 용어이며 원문의 표현을 충실히 반영합니다. ‘하늘 나라’는 마태의 βασιλεία τῶν οὐρανῶν을 자연스럽게 옮깁니다.
  issues:
  - severity: low
    issue: ‘닫아 버리다’가 원문에 없는 완료·강조의 뉘앙스를 더합니다.
    rationale: κλείετε는 단순히 ‘닫다/막다’이며, 문맥 자체가 강한 책망을 충분히 전달합니다.
  - severity: medium
    issue: ‘들어가려는 자들’은 τοὺς εἰσερχομένους의 진행 중인 ‘들어가는 사람들’을 시도·의도로 좁힐 수 있습니다.
    rationale: 현재분사는 실제로 들어가는 과정 또는 들어가고자 하는 상태를 가리킬 수 있습니다. 본문에서는 진행성을 보존하고, 가능한 ‘시도’의 뉘앙스는 각주에서 제시하는 편이 안전합니다.
  revised_text: 그러나 너희에게 화가 있으리니, 서기관들과 바리새인들인 위선자들아! 너희가 사람들 앞에서 하늘 나라를 닫기 때문입니다. 너희도 들어가지 않고, 들어가고 있는 사람들도 들어가지 못하게 합니다.[a]
