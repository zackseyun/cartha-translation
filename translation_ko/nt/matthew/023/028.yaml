  source_fidelity: οὕτως καὶ ὑμεῖς의 비교·적용을 ‘이와 같이 너희도’로, ἔξωθεν/ἔσωθεν의 대조를 ‘겉으로는/안으로는’으로 충실히 옮겼습니다. φαίνεσθε τοῖς ἀνθρώποις δίκαιοι는 실제 의로움을 단정하지 않고 ‘사람들에게 의로워 보이나’로 인간의 관점에서 보이는 외양을 잘 나타냅니다. ἐστε μεστοὶ ὑποκρίσεως καὶ ἀνομίας도 ‘위선과 불법으로 가득 차 있습니다’로 빠짐없이 반영합니다.
