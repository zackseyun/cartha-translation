  terminology: ‘의롭다’, ‘위선’, ‘불법’은 성경 문맥에서 안정적으로 통용되는 용어이며, ἀνομία의 규범/율법을 거스르는 뉘앙스를 ‘불법’이 적절히 보존합니다. 한국어 ‘사람들’은 성별을 특정하지 않으므로 영어의 대안 각주는 필요하지 않습니다.
