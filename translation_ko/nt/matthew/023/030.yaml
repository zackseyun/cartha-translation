    text: Or 'sharers with them' or 'participants with them'; the Greek term can denote shared involvement or complicity.
    reason: lexical_alternative
  - marker: b
    text: That is, participation in the shedding of the prophets' blood; a claim of not sharing in their ancestors' bloodguilt.
