  source_fidelity: 그리스어의 일반적·격언적 진술을 충실히 옮겼습니다. ‘제단을 두고 맹세하는 자’는 ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ를, ‘그 제단과 그 위의 모든 것을 두고’는 ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ를 자연스럽게 반영합니다. ‘모든 것’은 문맥상 ‘예물’로 좁히지 않아 원문의 포괄성을 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, ‘~두고 맹세하다’라는 맹세 표현도 적절합니다. 결론의 ‘것입니다’는 일반 원리를 설명하는 문체에 잘 맞습니다.
  terminology: ‘제단’과 ‘맹세’는 문맥 및 한국어 성경 번역 관습에 적합합니다. 원문의 대명사 반복을 ‘그 제단’으로 명시한 것은 지시 대상의 혼동을 피합니다.
