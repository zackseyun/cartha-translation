  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
  footnotes:
  - marker: a
    text: Or, 'you will by no means see me from now on until you say.' The Greek uses an emphatic negation (οὐ μή).
    reason: lexical_alternative
  - marker: b
    text: A quotation/allusion to Psalm 118:26.
    reason: cross_reference
translation:
  language: ko
  text: 내가 너희에게 말합니다[a]. 이제부터 너희는 ‘주의 이름으로 오시는 분은 복되십니다’라고 말할 때까지[b] 결코 나를 보지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에는 강한 부정 표현(οὐ μή)이 쓰였습니다. ‘결코 … 못할 것입니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 시편 118:26을 인용하거나 암시합니다.
    reason: cross_reference
