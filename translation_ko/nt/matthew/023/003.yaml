  source_fidelity: 초안은 πάντα οὖν ὅσα ἐὰν, ποιήσατε καὶ τηρεῖτε, κατὰ δὲ τὰ ἔργα αὐτῶν, 그리고 λέγουσιν γὰρ καὶ οὐ ποιοῦσιν의 핵심 대조를 전반적으로 충실히 옮깁니다. 다만 마지막 절의 ‘말만 하고’는 문맥상 자연스럽지만, 원문의 단순한 ‘말하고 행하지 않는다’에 ‘오직’의 뉘앙스를 다소 더할 수 있습니다.
  naturalness: ‘그들의 행위를 따라 행하지는 마십시오’도 이해되지만, 현대 표준어에서는 ‘그들의 행위대로는 행하지 마십시오’가 더 간결하고 자연스럽습니다. 두 명령 사이의 대조는 ‘그러나’로 분명히 드러내는 것이 합쇼체 문장에 적합합니다.
  terminology: ‘행하고 지키십시오’는 ποιήσατε와 τηρεῖτε의 구별을 잘 보존합니다. ‘행위’는 ἔργα에 적절하며, 신학적 해석을 덧붙이지 않습니다.
  issues:
  - severity: low
    issue: 마지막 절의 ‘말만 하고’
    rationale: 그리스어는 λέγουσιν καὶ οὐ ποιοῦσιν, 곧 ‘말하지만 행하지 않는다’라는 대조를 표현합니다. ‘말만’은 의도된 위선을 잘 전달하지만 ‘만’의 제한 의미를 명시적으로 더할 수 있으므로, 대조 접속으로 옮기는 편이 더 직접적입니다.
  - severity: low
    issue: 두 번째 명령문의 표현과 대조 표지
    rationale: ‘행위를 따라 행하다’보다 ‘행위대로 행하다’가 자연스럽고, δέ의 대조는 ‘그러나’로 드러낼 수 있습니다.
  revised_text: 그러므로 그들이 너희에게 말하는 것은 모두 행하고 지키십시오. 그러나 그들의 행위대로는 행하지 마십시오. 그들은 말하지만 행하지 않기 때문입니다.
