  source_fidelity: ὥστε의 결론적 기능과 μαρτυρεῖτε의 증언 의미는 살렸습니다. 다만 ἑαυτοῖς는 문맥상 자신들에게 불리하게 되는 증언이라는 뜻이므로, 이를 더 분명히 드러내는 편이 좋습니다. υἱοί는 여기서 혈통 및 그에 수반되는 연대를 가리키므로 한국어에서는 문맥상 자연스러운 ‘자손’이 적절합니다.
  naturalness: 초안도 이해되지만, ‘너희가 … 자손임을 너희 스스로 증언합니다’는 수식 관계가 다소 빽빽하고 자기에게 불리한 증언이라는 책망의 날카로움이 약합니다. 두 절로 나누면 현대 표준어 합쇼체로 더 자연스럽습니다.
  terminology: ‘예언자들’은 προφήτας에 적절하며, ‘죽인’도 문맥상 φονεύω의 살해 의미를 충분히 전달합니다. ‘자손’은 한국어에서 직계 혈통과 그 계승 관계를 자연스럽게 나타내며, 본문의 비난 맥락을 과도하게 교리적으로 해석하지 않습니다.
  issues:
  - severity: medium
    issue: ἑαυτοῖς의 문맥상 불리한/자기 고발적 뉘앙스가 충분히 드러나지 않습니다.
    rationale: ‘너희 스스로 증언합니다’는 단지 증언의 주체가 너희라는 뜻으로도 읽힐 수 있습니다. 본문은 그들의 말이 자신들을 불리하게 증언한다는 논증의 결론입니다.
  revised_text: 그러므로 너희는 너희 자신에게 불리한 증언을 합니다. 곧 너희가 예언자들을 죽인 자들의 자손이라는 것입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘너희 자신에게 증언합니다’입니다. 문맥에서는 그들의 증언이 자신들에게 불리하게 작용한다는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: 자기 고발적 의미를 본문에서 자연스럽게 드러내고, ὅτι가 이끄는 증언의 내용을 ‘곧’으로 명료하게 연결했습니다. ‘자손’은 한국어에서 자연스러우면서도 혈통적·도덕적 연대라는 문맥적 함의를 보존합니다.
