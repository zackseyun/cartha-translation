review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential force of ὥστε and the identification with those who murdered the prophets. However, it renders ἑαυτοῖς merely as emphatic reflexive subject ("너희 스스로") rather than preserving the testimony's self-implicating direction, and "자손" weakens the explicit familial term υἱοί ("sons").
  naturalness: The revised wording is natural in modern formal Korean and retains the rebuking, juridical force without becoming archaic.
  terminology: '"예언자들" is an appropriate modern Korean rendering of προφήτας. "아들" retains the source''s masculine familial wording; the collective predicate is idiomatic with the plural addressee.'
  issues:
  - severity: medium
    issue: The self-incriminating force of ἑαυτοῖς is not adequately represented.
    rationale: '"너희 스스로 증언합니다" means that they themselves give testimony, whereas the Greek dative, in this context, indicates testimony concerning themselves that implicates them.'
  - severity: low
    issue: '"자손" replaces the explicit familial term υἱοί.'
    rationale: Although "자손" is possible interpretively, "아들" more closely preserves both the masculine term and the familial rhetoric of the source.
  revised_text: 그러므로 너희는 너희 자신에게 불리하게 증언합니다. 곧 너희가 예언자들을 죽인 자들의 아들임을 증언하는 것입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면, “너희 자신에게 증언합니다.” 문맥상 이 증언은 너희 자신에게 불리하게 작용한다는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: The revision makes explicit the contextual self-incriminating sense of μαρτυρεῖτε ἑαυτοῖς while supplying a footnote that preserves the more literal ambiguity. It also changes "자손" to "아들" to reflect υἱοί more closely, without adding doctrinal interpretation.
