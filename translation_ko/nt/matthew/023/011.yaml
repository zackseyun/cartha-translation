  source_fidelity: 원문의 비교급 μείζων은 이 문맥에서 집단 내 최고 지위를 가리키는 관용적 용법이며, ‘너희 가운데 가장 큰 자’가 이를 정확히 반영합니다. 두 차례의 ὑμῶν도 각각 ‘너희 가운데’와 ‘너희를 섬기는’으로 자연스럽고 충실하게 옮겼습니다. διάκονος는 직분명이 아니라 섬기는 사람이라는 뜻으로 적절히 번역되었습니다.
  naturalness: ‘너희 가운데 가장 큰 자는 너희를 섬기는 자가 될 것입니다’는 현대 표준 한국어에서 자연스럽고, 합쇼체의 격식을 유지합니다. 문장의 대조와 가르침의 역전도 분명합니다.
  terminology: ‘섬기는 자’는 διάκονος의 비직분적 의미를 잘 살리며, ‘집사’나 ‘사역자’처럼 후대 교회 직분을 연상시키지 않습니다. ‘가장 큰 자’도 문맥상 요구되는 지위 언어를 보존합니다.
