review_pass:
  verdict: revise
  source_fidelity: 초안은 책망의 대상, 광범위한 이동, 한 사람의 개종, 그리고 게헨나와 관련된 결말을 대체로 충실히 옮깁니다. 그러나 Οὐαί의 현재적 예언자적 선언을 미래형 ‘화가 있으리니’로 옮긴 점은 피하는 것이 좋고, ‘두 배나 더한 게헨나의 자식’은 비교 구문이 한국어로 다소 불분명합니다.
  naturalness: 합쇼체는 유지되어 있으나, ‘화가 있으리니’는 현대 표준어 산문에서 다소 고어적이며, ‘두 배나 더한 게헨나의 자식’은 자연스럽지 않습니다. ‘화가 있습니다’와 ‘너희 자신보다 갑절이나 더한 게헨나의 자식’이 더 명료합니다.
  terminology: ‘서기관’, ‘바리새인’, ‘위선자’, ‘게헨나’는 적절합니다. προσήλυτον의 의미를 ‘개종자’로 본문에 옮기고 ‘프로셀뤼토스’라는 대안을 각주로 남깁니다. γεέννα는 ‘게헨나’로 유지하고, 통상적 대안인 ‘지옥’을 각주에 제시합니다.
  issues:
  - severity: medium
    issue: Οὐαί를 ‘화가 있으리니’로 번역함
    rationale: 원문의 감탄적·선언적 책망을 미래 예고처럼 들리게 할 수 있습니다. 현대 한국어로는 ‘화가 있습니다’가 더 직접적입니다.
  - severity: medium
    issue: ‘두 배나 더한 게헨나의 자식’의 비교 표현이 어색하고 불명료함
    rationale: διπλότερον ὑμῶν은 ‘너희 자신보다 갑절이나 더한’이라는 비교를 나타냅니다. 비교 대상을 명시해야 의미가 분명해집니다.
  revised_text: 너희에게 화가 있습니다, 서기관들과 바리새인들, 위선자들아! 너희가 한 개종자를 만들려고 바다와 육지를 두루 다니다가, 그가 개종자가 되면 너희 자신보다 갑절이나 더한 게헨나의 자식으로 만들기 때문입니다.[a][b]
  revised_footnotes:
