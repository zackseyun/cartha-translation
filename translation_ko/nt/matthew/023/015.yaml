review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하나, “너희보다 두 배나 더한”은 한국어에서 비교의 기준과 배수 관계가 다소 어색하고 ‘두 배 더’(세 배)로도 읽힐 수 있습니다. διπλότερον ὑμῶν의 비교를 자연스럽게 ‘너희보다 갑절이나 더한’으로 옮기는 편이 안전합니다.
  naturalness: 합쇼체 문체는 유지되어 있으나, 마지막 목적격 구성이 다소 무겁습니다. ‘...자식이 되게 합니다’로 다듬으면 현대 표준어에서 더 자연스럽습니다.
  terminology: ‘서기관’, ‘바리새인’, ‘위선자’, ‘게헨나’는 적절합니다. προσήλυτον을 ‘개종자’로 번역하되, 유대교로의 개종이라는 역사적·어휘적 범위를 각주로 밝혀 두는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘너희보다 두 배나 더한 게헨나의 자식’의 배수 비교 표현
    rationale: διπλότερον은 ‘두 배나/갑절이나 더한’ 비교를 나타내지만, 한국어 ‘두 배나 더한’은 흔히 기준보다 두 배를 추가한 것으로 이해될 여지가 있습니다. 또한 ‘더한 게헨나의 자식’의 수식 관계가 매끄럽지 않습니다.
  revised_text: 너희에게 화가 있습니다, 서기관들과 바리새인들, 위선자들아! 너희가 개종자 한 사람을 만들려고 바다와 육지를 두루 다니며, 그가 개종자가 되면 너희보다 갑절이나 더한 게헨나의 자식이 되게 하기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “개종자.” 그리스어 προσήλυτος는 특히 유대교로 개종한 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “게헨나의 자식.” ‘게헨나’는 유대교의 종말론적 배경을 지닌 그리스어 용어입니다.
    reason: terminology
  revision_rationale: ‘두 배나 더한’을 ‘갑절이나 더한’으로 바꾸어 그리스어 비교 표현을 한국어에서 더 자연스럽고 오해 없이 전달했습니다. προσήλυτος와 γεέννα의 역사적·어휘적 특성은 번역문에 과도한 해설을 넣지 않고 각주로 보완했습니다.
