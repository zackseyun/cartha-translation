  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
  footnotes:
  - marker: a
    text: Or “proselyte.”
    reason: lexical_alternative
  - marker: b
    text: Or “a son of hell.” Greek “a son of Gehenna.”
    reason: alternative_reading
translation:
  language: ko
  text: 너희에게 화가 있습니다, 서기관들과 바리새인들, 위선자들아! 너희가 한 개종자를 만들려고 바다와 육지를 두루 다니다가, 그가 개종자가 되면 너희 자신보다 갑절이나 더한 게헨나의 자식으로 만들기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘개종자’는 그리스어 ‘프로셀뤼토스’를 옮긴 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지옥의 자식’. 그리스어는 ‘게헨나의 자식’입니다.
    reason: alternative_reading
