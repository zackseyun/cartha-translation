revisions:
- from: 너희에게 화가 있으리니, 서기관들과 바리새인들, 위선자들아! 너희는 회칠한 무덤과 같으니, 겉으로는 아름답게 보이나 안으로는 죽은 자의 뼈와 온갖 더러움으로 가득 차 있습니다.
  to: 너희에게 화가 있으리니, 서기관들과 바리새인들, 위선자들아! 너희는 회칠한 무덤과 같으니, 겉으로는 아름답게 보이지만 안으로는 죽은 자들의 뼈와 온갖 부정으로 가득 차 있습니다.
