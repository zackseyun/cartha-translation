review_pass:
  verdict: revise
  source_fidelity: 핵심 비유와 대조는 대체로 충실합니다. 그러나 그리스어의 ὀστέων νεκρῶν은 복수로 ‘죽은 자들의 뼈’이며, ‘죽은 자의 뼈’보다 복수 표현이 원문에 더 가깝습니다. 또한 원문의 ‘온갖 ἀκαθαρσία’는 의례적 부정과 도덕적 부패의 여지를 함께 지니므로 ‘더러움’보다 ‘부정’이 더 적절합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 ‘너희는 … 같으니’ 뒤에 ‘보이나’가 이어지는 문장은 가능하나, ‘겉으로는 아름답게 보이지만’이 대조를 더 분명하고 매끄럽게 드러냅니다.
  terminology: ‘서기관’, ‘바리새인’, ‘위선자’, ‘회칠한 무덤’은 확립된 성서 용어이며 적절합니다. ‘부정’은 ἀκαθαρσία의 폭넓은 의미를 보존합니다.
  issues:
  - severity: medium
    issue: ‘죽은 자의 뼈’의 단수 표현
    rationale: ὀστέων νεκρῶν은 ‘죽은 자들의 뼈/죽은 이들의 뼈’라는 복수 표현입니다. 한국어에서 단수 집합 표현도 가능하지만, 여기서는 복수로 옮겨 원문의 표현을 보존하는 것이 안전합니다.
  - severity: medium
    issue: ἀκαθαρσία를 ‘더러움’으로 번역
    rationale: ‘더러움’은 일반적 오염의 뜻으로 읽히기 쉬우며, 문맥상 포함되는 의례적 부정과 도덕적 불결의 의미를 충분히 반영하지 못할 수 있습니다. ‘부정’이 모호성을 더 잘 보존합니다.
  revised_text: 너희에게 화가 있으리니, 서기관들과 바리새인들, 위선자들아! 너희는 회칠한 무덤과 같으니, 겉으로는 아름답게 보이지만 안으로는 죽은 자들의 뼈와 온갖 부정으로 가득 차 있습니다.
