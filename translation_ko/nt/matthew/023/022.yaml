  terminology: ‘하늘’, ‘하나님의 보좌’, ‘맹세’는 문맥과 한국어 성경 문체에 잘 맞습니다. ‘그 위에 앉아 계신 분’은 하나님을 직접 대명사로 치환하지 않아 원문의 우회적 지칭을 유지합니다.
