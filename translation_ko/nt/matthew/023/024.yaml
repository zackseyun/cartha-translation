  terminology: ὁδηγοί는 비유를 유지하는 ‘인도자들’로, τυφλοί는 ‘눈먼’으로 옮기는 것이 적절합니다. κώνωψ는 ‘하루살이’보다 ‘모기’가 정확합니다.
