  to: 그리하여 땅[a] 위에 쏟아진 모든 의로운 피, 곧 의로운 아벨의 피부터 너희가 성소와 제단 사이에서 살해한 바라갸의 아들 스가랴[b]의 피까지가 너희에게 임하게 하려는 것입니다.
  rationale: 목적 또는 의도된 결과를 나타내는 ὅπως ἔλθῃ를 ‘임하게 하려는 것입니다’로 반영하고, 피의 범위를 ‘곧’으로 명료하게 연결했습니다. ναός/θυσιαστήριον은 각각 ‘성소/제단’으로 유지했고, φονεύω의 고발적 의미는 ‘살해한’으로 살렸습니다. 논쟁적인 스가랴의 신원과 γῆ의 의미 범위는 본문을 변경하거나 해소하지 않고 각주에 보존했습니다.
