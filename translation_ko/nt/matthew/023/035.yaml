    rationale: ὅπως 뒤의 부정과거 접속법은 앞선 문맥에 연결되는 목적 또는 의도된 결과를 나타냅니다. 한국어에서는 ‘임하게 하려는 것입니다’가 이 기능을 더 잘 보존합니다.
