  source_fidelity: 개정이 필요합니다. 현행문의 미래 직설형 ‘임할 것이다’는 ὅπως와 접속법 ἔλθῃ가 이루는 목적/귀결의 종속적 뉘앙스를 약화합니다. 또한 ‘그래서’는 앞 문맥의 결과를 단정적으로 진술하는 듯하여, 목적 또는 의도된 결과를 나타내는 표현이 더 가깝습니다. ‘땅 위에 쏟긴’과 살해 장소는 대체로 충실합니다.
  naturalness: 현행문은 전반적으로 이해 가능하나, ‘아벨의 피로부터 … 스가랴의 피에 이르기까지, 땅 위에… 피가’의 수식 범위가 다소 늦게 드러납니다. ‘곧’을 사용해 피의 범위를 동격적으로 제시하면 현대 표준어 문장으로 더 자연스럽고 명료합니다.
  terminology: ‘성소’는 ναός의 제한된 의미를 잘 반영하며, ‘제단’도 적절합니다. φονεύσατε는 ‘죽인’보다 ‘살해한’이 고발의 강도를 더 잘 반영합니다. 인명은 한국어 성서 관용에 맞추어 ‘바라갸의 아들 스가랴’로 통일하는 것이 적절합니다. 스가랴의 신원 문제와 γῆ의 ‘땅/온 땅’ 가능성은 본문에서 해소하지 말고 각주로 남겨야 합니다.
