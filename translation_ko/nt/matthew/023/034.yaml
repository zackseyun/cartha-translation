  naturalness: 초안의 ‘보아라’는 반말 명령형이므로 요청된 현대 합쇼체와 맞지 않습니다. ‘지혜 있는 자들/어떤 자들’보다 ‘지혜로운 사람들/어떤 사람들’이 현대 표준어에서 더 자연스럽습니다.
  terminology: ‘예언자들’, ‘서기관들’, ‘십자가에 못 박다’, ‘회당’은 적절합니다. ‘채찍질하다’는 원문의 매질을 더 구체적으로 충실히 전달합니다.
  issues:
