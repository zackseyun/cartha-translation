    rationale: ποσάκις는 ‘몇 번이나/얼마나 자주’라는 빈도를 묻습니다. 해당 초안은 현대어에서 어색하고 수사 의문문의 의미도 흐립니다.
  - severity: medium
    issue: ‘자기에게 보내심을 받은 자들’
    rationale: 원문은 예루살렘을 가리키는 αὐτήν에 ‘보내진 이들’입니다. 한국어의 ‘보내심을 받은’은 불필요한 높임 뉘앙스와 어색한 피동 구성을 만듭니다.
  - severity: low
    issue: ‘돌로 치는’
    rationale: λιθοβολέω는 돌을 던져 죽이는 행위를 가리키므로 ‘돌로 죽이는’이 의미를 더 분명히 합니다.
