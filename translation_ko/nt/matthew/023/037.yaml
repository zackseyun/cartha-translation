  source_fidelity: 개정이 필요합니다. 초안의 ‘내가 네 자녀를 모으려 한 적이 얼마였더냐’는 ποσάκις(‘몇 번이나/얼마나 자주’)를 현대 한국어에서 부자연스럽게 처리하며, 원문의 수사 의문문의 흐름도 충분히 드러내지 못합니다. 또한 ‘자기에게 보내심을 받은 자들’은 피동·높임 표현이 부자연스럽고, 원문의 ‘그녀에게/너에게 보내진 이들’이라는 예루살렘 의인화를 명료하게 반영하는 편이 좋습니다.
  naturalness: 합쇼체에 맞추어 ‘하였습니까? … 원하지 않았습니다’로 다듬었습니다. ‘돌로 죽이는’은 단순히 돌로 때린다는 뜻으로 오해될 수 있는 ‘돌로 치는’보다 λιθοβολέω의 처형 의미를 현대 한국어로 더 정확하고 자연스럽게 전달합니다.
  terminology: ‘예언자들’, ‘자녀들’, ‘암탉’, ‘새끼들’, ‘날개 아래’는 원문의 관계적·비유적 표현을 유지합니다. ὄρνις는 문맥상 암탉으로 옮기는 것이 안전하며, 별도 각주는 필수적이지 않습니다.
