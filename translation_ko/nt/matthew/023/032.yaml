  naturalness: ‘그리고 너희는 … 채우십시오’는 명시된 ὑμεῖς의 강조와 문장 연결을 자연스럽게 살리며, 현대 표준어 합쇼체에 맞습니다.
  terminology: ‘조상들’은 여기서 πατέρων이 가리키는 선조들을 자연스럽고 포괄적으로 나타냅니다. ‘분량을 채우다’는 누적된 것이 한도에 이르는 비유를 보존합니다.
