  rationale: καὶ를 ‘그리고’로 옮겨 원문의 단순한 수사적 연결을 보존했습니다. 명시된 ὑμεῖς는 ‘너희는’으로 반영했고, aorist imperative πληρώσατε는 합쇼체 명령형 ‘채우십시오’로 옮겼습니다. ‘조상들의 분량’이라는 비유는 본문에서 해설하지 않고, 죄의 누적이라는 문맥상 의미는 각주에 대안적 설명으로만 제시했습니다.
