id: MAT.18.17
reference: Matthew 18:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
  footnotes:
  - marker: a
    text: 'Or ''church'' or ''congregation'' for ''assembly'' (Greek: ekklēsia).'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말을 듣지 않거든 회중에게 말하십시오. 회중의 말도 듣지 않거든 그를 이방인과 세리처럼 여기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 여기서 ἐκκλησία의 기본 의미를 반영한 번역입니다. 전통적 번역인 ‘교회’ 또는 ‘공동체’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  english_pob_choice: refuses to listen
  chosen_korean: 말을 듣지 않거든
  alternatives_korean:
  - 듣기를 거부하거든
  - 순종하지 않거든
  - 무시하거든
  lexicon: BDAG
  rationale: 이 문맥에서는 단순한 청각 실패가 아니라 권면을 듣지 않으려는 태도를 가리키므로, 한국어로는 자연스럽고 완곡한 ‘말을 듣지 않다’를 택했습니다.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 교회
  - 모임
  - 공동체
  lexicon: BDAG
  rationale: ἐκκλησία의 기본 뜻은 모인 공동체이므로, 제도적 뉘앙스가 강한 ‘교회’보다 ‘회중’이 원뜻을 더 직접적으로 드러냅니다.
- source_word: ἔστω σοι ὥσπερ
  english_pob_choice: let him be to you like
  chosen_korean: 그를 …처럼 여기십시오
  alternatives_korean:
  - 그를 …로 여기십시오
  - 그를 …같이 대하십시오
  lexicon: BDAG
  rationale: 명령형의 의미를 살리면서도 한국어에서 자연스럽고 직접적인 판단 표현으로 옮기기 위해 ‘여기십시오’를 사용했습니다.
- source_word: ὁ ἐθνικὸς καὶ ὁ τελώνης
  english_pob_choice: the Gentile and the tax collector
  chosen_korean: 이방인과 세리
  alternatives_korean:
  - 이방 사람과 세리
  - 이방인과 세금 징수원
  lexicon: BDAG
  rationale: 두 명사 모두 한국 교회 독자에게 익숙하면서도 원문 범주를 유지하는 표준 표현이므로 ‘이방인과 세리’를 택했습니다.
theological_decisions:
- issue: ἐκκλησία를 ‘교회’로 옮길지 ‘회중’으로 옮길지
  chosen_reading: 회중
  alternative_readings:
  - 교회
  - 공동체
  rationale: 예수의 말씀 문맥에서 ἐκκλησία를 후대 제도 기관명처럼 들리기 쉬운 ‘교회’보다, 모인 사람들의 실체를 드러내는 ‘회중’으로 옮기는 것이 원문 이해에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘이방인과 세리처럼’의 사회적 거리 두기 강도
  chosen_reading: 그를 이방인과 세리처럼 여기십시오
  alternative_readings:
  - 그를 이방인과 세리로 대하십시오
  - 그를 외부인으로 여기십시오
  rationale: 본문은 공식적 절차의 세부를 확장하기보다 비유적 비교를 유지하므로, 심판적 선언으로 과장하지 않고 비교 구문을 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §3
