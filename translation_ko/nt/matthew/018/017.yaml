review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘그들이 말을 듣지 않거든’은 αὐτῶν(‘그들의’)을 주격 복수 ‘그들이’로 처리하여, 권면자들이 듣지 않는다는 뜻으로 읽힐 수 있습니다. ‘그들의 말을 듣지 않거든’으로 고쳐야 대상자가 그들의 말을 듣기를 거부한다는 원문의 뜻이 분명해집니다. ‘회중’, ‘이방인과 세리처럼’ 및 비교 표현은 원문에 충실합니다.
  naturalness: ‘회중에게 말하십시오’는 한국어에서 무엇을 말하는지 다소 불분명합니다. 문맥상 암시된 사안을 드러내어 ‘그 일을 회중에게 알리십시오’라고 하면 자연스럽습니다. 각주 표지는 설명 대상인 첫 ‘회중’에 붙이는 편이 적절합니다.
  terminology: ἐκκλησία를 ‘회중’으로 옮긴 것은 ‘assembly’의 선택을 잘 반영하며, 각주에 ‘교회’와 ‘공동체’를 대안으로 제시한 것도 적절합니다. ‘이방인’, ‘세리’는 통용되는 성서 용어이며 원문의 대표적 범주 표현을 보존합니다.
