    rationale: 원문의 αὐτῶν은 παρακούσῃ의 주어가 아니라 ‘그들(두세 증인)의 말을’이라는 속격 목적어입니다. 현 번역은 ‘그들이 듣지 않으면’으로 이해될 수 있으므로 ‘그들의 말을 듣지 않거든’으로 수정해야 합니다.
