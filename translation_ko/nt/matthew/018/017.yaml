revisions:
- from: 그들이 말을 듣지 않거든 회중에게 말하십시오. 회중의 말도 듣지 않거든 그를 이방인과 세리처럼 여기십시오.[a]
  to: 그들의 말을 듣지 않거든 그 일을 회중[a]에게 알리십시오. 회중의 말도 듣지 않거든, 그를 이방인과 세리처럼 여기십시오.
  rationale: 첫 문장의 속격 대명사 αὐτῶν을 ‘그들의 말’로 명확히 반영했습니다. εἰπόν의 문맥상 암시된 목적어는 ‘그 일’로 최소한으로 보완하여 한국어 문장을 자연스럽게 했습니다. ἐκκλησία의 번역과 각주 내용, 그리고 ὥσπερ의 비교 표현은 유지하되 각주 표지를 해당 어휘에 연결했습니다.
  reviewer_model: gpt-5.6-terra
