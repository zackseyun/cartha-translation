review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘빚진 것을’은 명령의 핵심 뜻을 전달하지만, εἴ τι ὀφείλεις의 부정·개방적 표현(‘무엇이든 빚진 것이 있으면’)을 충분히 드러내지 못합니다. ‘네가 빚진 것은 무엇이든’으로 옮기면 이를 자연스럽게 보존합니다. 또한 각주 표지는 해당 단어·표현 바로 뒤에 두는 것이 원문 및 영문 POB의 각주 기능에 부합합니다.
  naturalness: ‘그러나 그 종이 나가서’와 ‘그를 붙들어 목을 조르며 말했습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. 다만 화자의 명령을 ‘네가 빚진 것은 무엇이든 갚아라’로 하면 한국어에서도 강압적인 요구의 범위가 더 분명해집니다.
  terminology: ‘종/동료 종’은 현 장의 용어 일관성을 유지하며 σύνδουλος의 동료 관계를 드러냅니다. ‘백 데나리온’도 역사적 화폐 단위를 보존합니다. 문화 각주는 ‘하루 품삯’으로 다듬어 자연스럽게 제시합니다.
  issues:
  - severity: medium
    issue: εἴ τι ὀφείλεις의 개방적·부정적 범위가 본문에서 약화됨
