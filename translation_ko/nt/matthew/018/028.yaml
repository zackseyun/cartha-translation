  to: 그러나 그 종이 나가서 자기에게 백 데나리온[a]을 빚진 동료 종 하나를 만났습니다. 그는 그를 붙들어 목을 조르며 말했습니다. “네가 빚진 것은 무엇이든 갚아라.”[b]
