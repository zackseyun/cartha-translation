id: MAT.18.28
reference: Matthew 18:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that slave went out[a], he found one of his fellow slaves who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
  footnotes:
  - marker: a
    text: Or, more literally, “Pay back if you owe anything.”
    reason: lexical_alternative
  - marker: b
    text: A denarius was a common daily wage for a laborer or soldier.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그 종이 나가서 자기에게 백 데나리온[a]을 빚진 동료 종 하나를 만났습니다. 그는 그를 붙들어 목을 조르며 말했습니다. “네가 빚진 것은 무엇이든 갚아라.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 데나리온은 일반적으로 노동자나 병사의 하루 품삯에 해당합니다.
    reason: cultural_note
  - marker: b
    text: εἴ τι ὀφείλεις는 직역하면 ‘네가 무엇인가를 빚지고 있다면’이며, 여기서는 ‘네가 빚진 것은 무엇이든’이라는 뜻으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν δὲ
  english_pob_choice: But when ... went out
  chosen_korean: 그러나 그 종이 나가서
  alternatives_korean:
  - 그리고 그 종이 나가서
  - 그런데 그 종이 나가서
  lexicon: BDAG
  rationale: δέ의 전환을 살리되 한국어 서술 흐름에 맞게 ‘그러나’로 연결했고, 분사구문은 자연스럽게 ‘나가서’로 옮겼습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종사
  lexicon: BDAG
  rationale: 이 비유의 문맥은 예속 관계와 강제적 권력이 핵심이지만, 한국어 본문에서는 POB의 기본 용례에 맞춰 ‘종’을 사용했습니다. 이 장 전체의 같은 인물 지칭과의 일관성도 고려했습니다.
- source_word: συνδούλων
  english_pob_choice: fellow slaves
  chosen_korean: 동료 종
  alternatives_korean:
  - 동료 노예
  - 함께 종 된 자
  lexicon: BDAG
  rationale: συν-의 상호성을 살려 ‘동료’로 옮겼고, 앞의 δοῦλος와 호응하도록 ‘종’을 반복했습니다.
- source_word: ἑκατὸν δηνάρια
  english_pob_choice: a hundred denarii
  chosen_korean: 백 데나리온
  alternatives_korean:
  - 백 은전
  - 하루 품삯 백 몫
  lexicon: BDAG
  rationale: 역사적 화폐 단위를 그대로 음역해 수치의 대비를 보존했습니다. 본문이 큰 탕감액과의 대비를 전제하므로 일반화하지 않았습니다.
- source_word: κρατήσας ... ἔπνιγεν
  english_pob_choice: seizing him, he began choking him
  chosen_korean: 그를 붙들어 목을 조르며
  alternatives_korean:
  - 그를 붙잡고 질식시키며
  - 그를 움켜쥐어 목을 졸라대며
  lexicon: BDAG
  rationale: κρατέω의 강한 신체적 구속과 ἔπνιγεν의 진행성을 함께 살려, 단순한 ‘붙잡다’보다 강한 ‘붙들어 목을 조르며’로 옮겼습니다.
- source_word: Ἀπόδος εἴ τι ὀφείλεις
  english_pob_choice: Pay back whatever you owe
  chosen_korean: “빚진 것을 갚아라.”
  alternatives_korean:
  - “네가 빚진 것을 갚아라.”
  - “무엇이든 네가 빚진 것을 갚아라.”
  lexicon: BDAG
  rationale: ἀπόδος는 채무 맥락의 강한 상환 요구이므로 ‘갚아라’로 옮겼고, εἴ τι ὀφείλεις는 한국어에서 자연스럽게 열린 채무 요구를 드러내는 ‘빚진 것을’로 처리했습니다. 영어 POB의 ‘whatever you owe’에 해당하는 개방성을 완전히 닫지 않도록 직역식 ‘만약 조금이라도 빚졌다면’은 본문에 두지 않았습니다.
theological_decisions:
- issue: δοῦλος의 사회적 강도
  chosen_reading: ‘종’을 택하되, 강제적 예속 관계가 드러나도록 문맥상 폭력성을 함께 유지했습니다.
  alternative_readings:
  - ‘노예’로 더 강하게 표기하기
  - ‘종’으로 완화해 읽기
  rationale: 이 장면은 빚과 폭력, 지배 관계를 드러내지만, 한국어 독자에게는 ‘종’이 본문 전체의 서술 일관성을 유지하면서도 관계의 비대칭을 충분히 전달합니다.
  doctrine_reference: POB contested terms policy for δοῦλος; Matthew 18 문맥
