translation:
  language: ko
  text: 두세 사람이 내 이름으로 모인 곳에는 나도 그들 가운데 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ γάρ
  english_pob_choice: For where
  chosen_korean: 두세 사람이 내 이름으로 모인 곳에는
  alternatives_korean:
  - 두세 사람이 내 이름으로 모여 있는 곳에는
  - 두세 사람이 내 이름으로 모일 때에는
  lexicon: BDAG
  rationale: οὗ의 장소 지시를 한국어의 자연스러운 장소 절로 옮기고, γάρ의 설명적 연결은 문장 흐름 속에 포함시켜 과도한 접속사 반복을 피했습니다.
- source_word: συνηγμένοι
  english_pob_choice: are gathered
  chosen_korean: 모인
  alternatives_korean:
  - 모여 있는
  - 함께 모인
  lexicon: BDAG
  rationale: 완료된 모임의 상태를 간결하게 나타내면서도, ‘are gathered’의 결과 상태를 자연스럽게 반영했습니다.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름 안에서
  - 내 이름에 의하여
  lexicon: BDAG
  rationale: 구약·신약에서 흔한 ‘이름’의 권위/소속/대상성 표현을 한국어에서 가장 직접적으로 드러내는 방식으로 옮겼습니다.
- source_word: ἐν μέσῳ αὐτῶν
  english_pob_choice: in their midst
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 한가운데
  - 그들 가운데에
  lexicon: BDAG
  rationale: ‘in their midst’의 공간적 이미지를 살리되, 현대 한국어에서 자연스럽고 유려한 표현을 선택했습니다.
theological_decisions:
- issue: 예수의 임재 표현
  chosen_reading: ‘나도 그들 가운데 있습니다’라고 직설적으로 옮겨, 모인 공동체 가운데 있는 예수의 실제 임재를 분명히 하되 그 방식은 규정하지 않았습니다.
  alternative_readings:
  - ‘나도 그들 가운데 present합니다’와 같은 해설적 번역
  - 특정 교단의 성례론적 임재 해석을 덧붙이는 번역
  rationale: 본문은 임재를 약속하지만 그 형이상학적 양식을 설명하지 않으므로, 번역은 본문의 주장 자체를 유지하고 후대 교리를 도입하지 않아야 합니다.
  doctrine_reference: Affirmations; Translation philosophy §3
