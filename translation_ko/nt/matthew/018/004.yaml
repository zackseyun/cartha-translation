id: MAT.18.4
reference: Matthew 18:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: ko
  text: 그러므로 누구든지 이 어린아이처럼 자신을 낮추는 사람이 하늘 나라에서 가장 큽니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτὸν
  english_pob_choice: humbles himself
  chosen_korean: 자신을 낮추는
  alternatives_korean:
  - 자기를 겸손하게 하는
  - 자기를 낮추는
  lexicon: ταπεινόω
  rationale: 동사 μορφή가 ‘자신을 낮추다’의 직접적 행위를 가리키므로, 한국어에서도 자발적 자기낮춤을 분명히 드러내되 ‘겸손’이라는 추상명사보다 동작성을 살렸습니다.
- source_word: ὡς τὸ παιδίον τοῦτο
  english_pob_choice: like this child
  chosen_korean: 이 어린아이처럼
  alternatives_korean:
  - 이 아이처럼
  - 이 어린아이와 같이
  lexicon: παιδίον
  rationale: 작은 아이를 가리키는 παιδίον의 감각을 살려 ‘어린아이’로 옮겼고, 비교 표지는 현대 한국어에서 자연스러운 ‘처럼’으로 처리했습니다.
- source_word: ὁ μείζων
  english_pob_choice: the greatest
  chosen_korean: 가장 큽니다
  alternatives_korean:
  - 가장 위대합니다
  - 가장 큰 사람입니다
  lexicon: μέγας
  rationale: 비교급/최상급의 직접적 의미를 유지하면서, 인격 평가를 덜 덧씌우는 ‘가장 큽니다’를 택해 원문의 서열 선언을 간결하게 반영했습니다.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  english_pob_choice: in the kingdom of heaven
  chosen_korean: 하늘 나라에서
  alternatives_korean:
  - 하늘 나라 안에서
  - 천국에서
  lexicon: βασιλεία τῶν οὐρανῶν
  rationale: 마태복음의 고유한 ‘하늘 나라’를 유지했고, 장소적 범주를 나타내는 ἐν은 한국어의 조사 ‘-에서’로 자연스럽게 대응했습니다.
theological_decisions:
- issue: 본절의 서열 역전 진술
  chosen_reading: 어린아이처럼 자신을 낮추는 사람이 ‘가장 큽니다’라는 판단을 그대로 유지했습니다.
  alternative_readings:
  - 가장 높은 사람입니다
  - 가장 중요합니다
  rationale: 원문은 제자 공동체의 가치 역전을 단정적으로 선포하므로, 완곡하게 풀지 않고 서열 판단을 직설적으로 보존했습니다.
  doctrine_reference: 겸손과 하나님 나라의 역전 가치
- issue: 하늘 나라 표현
  chosen_reading: 마태복음 고유 표현을 따라 ‘하늘 나라’로 번역했습니다.
  alternative_readings:
  - 하나님의 나라
  - 천국
  rationale: 마태의 문맥적·전승적 용법을 반영해 일관성을 지켰고, 전통적 ‘천국’보다 본문이 말하는 통치 영역의 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: 마태복음의 βασιλεία τῶν οὐρανῶν
