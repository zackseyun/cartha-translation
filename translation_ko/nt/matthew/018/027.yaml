id: MAT.18.27
reference: Matthew 18:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that slave[a], moved with compassion[b], released him and forgave him the debt.
  footnotes:
  - marker: a
    text: Or 'master' for 'lord' (κύριος); the Greek refers here to the human master in the parable, not directly to God.
    reason: lexical_alternative
  - marker: b
    text: Or 'the debt'; the Greek noun more specifically denotes a loan or something lent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그 종의 주인이 불쌍히 여겨 그를 풀어 주고 그 빚을 탕감해 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주인’. 여기의 κύριος는 하나님이 아니라 비유 속 인간 주인을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 빚’. δάνειον은 더 구체적으로는 ‘빌려준 것’ 또는 ‘대여금’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  english_pob_choice: moved with compassion
  chosen_korean: 불쌍히 여겨
  alternatives_korean:
  - 측은히 여겨
  - 연민을 느껴
  lexicon: BDAG
  rationale: σπλαγχνίζομαι의 깊은 동정과 긍휼을 자연스러운 현대 한국어로 살리기 위해 ‘불쌍히 여겨’를 선택했습니다.
- source_word: ὁ κύριος τοῦ δούλου ἐκείνου
  english_pob_choice: the master of that slave
  chosen_korean: 그 종의 주인이
  alternatives_korean:
  - 그 노예의 주인이
  - 그 종의 주인
  lexicon: BDAG
  rationale: 이 문맥의 κύριος는 비유 속 인간 주인을 가리키므로 ‘주인’으로 옮겨, 신적 호칭으로 오해되지 않도록 했습니다.
- source_word: δοῦλου
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: BDAG
  rationale: 이 절은 관계를 지닌 비유 문맥이므로 기본어인 ‘종’을 택했고, 한국어에서 지나치게 현대 사회제도적 뉘앙스를 띠는 ‘노예’는 본문 전체의 비유적 흐름을 더 직접적으로 드러낼 때가 아니면 기본값으로 삼지 않았습니다.
- source_word: ἀπέλυσεν αὐτόν
  english_pob_choice: released him
  chosen_korean: 그를 풀어 주고
  alternatives_korean:
  - 그를 놓아 주고
  - 그를 해방하고
  lexicon: BDAG
  rationale: ἀπολύω는 여기서 억류나 즉각적 구속에서 풀어 주는 뜻이므로, 한국어의 자연스러운 서술로 ‘풀어 주고’가 적절합니다.
- source_word: τὸ δάνειον
  english_pob_choice: the loan
  chosen_korean: 그 빚
  alternatives_korean:
  - 그 대여금
  - 그 대출금
  lexicon: BDAG
  rationale: δάνειον의 더 구체적 의미는 ‘빌려준 것/대여금’이지만, 비유의 상환 문맥에서는 한국어로 ‘빚’이 가장 분명하게 전달합니다.
- source_word: ἀφῆκεν αὐτῷ
  english_pob_choice: forgave him
  chosen_korean: 탕감해 주었습니다
  alternatives_korean:
  - 면제해 주었습니다
  - 없던 일로 해 주었습니다
  lexicon: BDAG
  rationale: ἀφίημι는 여기서 빚을 면제하거나 취소하는 뜻이므로, 금전채무 맥락을 살리는 ‘탕감해 주었습니다’로 옮겼습니다.
theological_decisions:
- issue: κύριος를 신적 호칭으로 읽을 가능성
  chosen_reading: 비유 속 인간 주인을 가리키는 ‘주인’으로 번역했습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 문맥상 이 인물은 종의 인간 주인이므로, 대문자화된 신적 호칭을 피하고 서술의 직접 대상을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1; POB lexical guidance on κύριος
