  naturalness: 합쇼체는 자연스럽고 공적인 성경 번역 문체에 적절합니다. ‘길을 잃으면’ 및 ‘길을 잃고 있는 한 마리’는 원문의 각각 부정과거 및 현재분사 대비를 무리 없이 드러냅니다.
  terminology: ‘양’, ‘아흔아홉 마리’, ‘찾다’는 적절합니다. ‘산에’는 복수 지형을 한국어에서 집합적으로 자연스럽게 표현합니다. ‘길을 잃다’는 이 목양 비유에서 πλανάω의 의미를 과도하게 해석하지 않는 적절한 선택입니다.
