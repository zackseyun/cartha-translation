id: MAT.18.12
reference: Matthew 18:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
  footnotes:
  - marker: a
    text: Or 'wanders off.' The Greek verb can mean 'go astray,' 'wander,' or in some contexts 'be led astray.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the hills.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'the one going astray'; traditionally 'the lost one.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 어떻게 생각합니까? 어떤 사람에게 양 백 마리가 있는데 그중 하나가 길을 잃는다면, 그는 아흔아홉 마리를 산에 두고 가서 길 잃은 그 한 마리를 찾지 않겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헤매다’. 이 동사는 문맥에 따라 ‘길을 잃다’, ‘헤매다’, 또는 어떤 경우에는 ‘속임을 당하다’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘산들 위에’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘길 잃고 있는 그 한 마리’입니다. 전통적으로는 ‘잃은 그 한 마리’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  english_pob_choice: What do you think?
  chosen_korean: 여러분은 어떻게 생각합니까?
  alternatives_korean:
  - 여러분은 어떻게 생각하십니까?
  - 어떻게 생각합니까?
  lexicon: BDAG
  rationale: 청중의 판단을 묻는 도입 질문이므로 자연스러운 현대 한국어로 옮겼고, ὑμῖν의 직접성을 살리기 위해 2인칭 복수로 표현했습니다.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  english_pob_choice: If a man has
  chosen_korean: 어떤 사람에게 … 있는데
  alternatives_korean:
  - 어떤 사람이 … 가지게 되면
  - 어느 한 사람이 … 가지고 있다면
  lexicon: BDAG
  rationale: γίνομαι + 여격이 소유/상황을 나타내는 관용이므로 ‘가지게 되다’보다 한국어의 ‘…에게 …이 있다/있는데’ 구조가 더 자연스럽습니다.
- source_word: ἐπὶ τὰ ὄρη
  english_pob_choice: on the mountains
  chosen_korean: 산에
  alternatives_korean:
  - 산들 위에
  - 산악 지대에
  lexicon: BDAG
  rationale: ὄρη의 구체적 지형 이미지를 유지하되, 한국어에서는 ‘산에’가 가장 간결하고 자연스럽습니다.
- source_word: τὸ πλανώμενον
  english_pob_choice: the one going astray
  chosen_korean: 길 잃은 그 한 마리
  alternatives_korean:
  - 헤매는 그 한 마리
  - 방황하는 그 한 마리
  - 잃어버린 그 한 마리
  lexicon: BDAG
  rationale: 현재분사의 진행성을 살리면서도 양의 비유에 맞는 한국어로 옮겼고, ‘잃어버린’보다 πλανάω의 ‘빗나감/길 잃음’을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: πλανηθῇ / πλανώμενον의 의미 범위
  chosen_reading: ‘길을 잃다’ / ‘길 잃은’
  alternative_readings:
  - ‘헤매다’
  - ‘잘못되다’
  - ‘속임을 당하다’
  rationale: 양의 비유에서 πλανάω는 단순한 물리적 이탈과 도덕적/영적 일탈의 여지를 함께 남기므로, 과도하게 특정하지 않는 ‘길을 잃다’가 소스에 가장 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
