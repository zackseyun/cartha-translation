id: MAT.18.19
reference: Matthew 18:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
  footnotes:
  - marker: a
    text: Or 'if two from among you are in agreement.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'in the heavens'; rendered idiomatically as 'in heaven.'
    reason: lexical_alternative
  - marker: c
    text: In context, this saying follows Jesus' teaching about the community's authority and discipline (18:15–18), though the wording here itself speaks broadly of agreed requests.
    reason: cross_reference
translation:
  language: ko
  text: 또다시[a] 진실로 내가 여러분에게 말합니다. 여러분 가운데 두 사람이 땅에서 그들이 구하는 어떤 일에 관하여 뜻을 같이하면[c], 하늘에 계신[b] 내 아버지께서 그들에게 그것을 이루어 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다시’ 또는 ‘또’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 복수형 ‘하늘들’이지만, 한국어에서는 관용적으로 ‘하늘’로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 이 말은 공동체의 권위와 징계에 대한 가르침(18:15–18) 뒤에 나오지만, 문장 자체는 합의된 요청을 넓게 말합니다.
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  english_pob_choice: Again
  chosen_korean: 또다시
  alternatives_korean:
  - 다시
  - 또
  lexicon: BDAG
  rationale: 새로운 엄숙한 발화를 여는 표지로서 자연스러운 현대 한국어로 옮기되, 앞선 맥락과의 연속성을 유지했습니다.
- source_word: ἀμὴν λέγω ὑμῖν
  english_pob_choice: truly I tell you
  chosen_korean: 진실로 내가 여러분에게 말합니다
  alternatives_korean:
  - 진실로 내가 너희에게 말합니다
  - 아멘, 내가 여러분에게 말합니다
  lexicon: BDAG
  rationale: 예수의 엄숙한 선언 공식을 현대 합쇼체로 풀어 옮겨, 경건한 어조를 유지하면서도 자연스러운 한국어가 되도록 했습니다.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  english_pob_choice: if two of you agree
  chosen_korean: 여러분 가운데 둘이 ... 합의하면
  alternatives_korean:
  - 여러분 중 둘이 ... 동의하면
  - 여러분 가운데 둘이 ... 일치하면
  lexicon: BDAG
  rationale: συμφωνέω의 핵심은 단순한 동시성보다 ‘같은 뜻으로 합의함’이므로, ‘합의하다’로 옮겨 공동의 일치와 결정을 드러냈습니다.
- source_word: ἐπὶ τῆς γῆς
  english_pob_choice: on earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 지상에서
  - 이 땅에서
  lexicon: BDAG
  rationale: 하늘에 계신 아버지와 대비되는 지상적 영역을 간결하게 살리기 위해 ‘땅에서’로 옮겼습니다.
- source_word: παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  english_pob_choice: by my Father in heaven
  chosen_korean: 하늘에 계신 내 아버지께서
  alternatives_korean:
  - 하늘들에 계신 내 아버지께서
  - 하늘에 계신 내 아버지로부터
  lexicon: BDAG
  rationale: παρά + 속격은 여기서 행위의 근원/행위자를 드러내므로 ‘...께서’로 자연스럽게 주어화했고, τοῦ ἐν οὐρανοῖς는 한국어 관용에 맞게 ‘하늘에 계신’으로 옮겼습니다.
theological_decisions:
- issue: 요청의 범위와 문맥적 긴장
  chosen_reading: 본문이 말하는 범위를 넓히거나 좁히지 않고, ‘합의하여 구하는 것’이라는 표현만 그대로 살렸습니다.
  alternative_readings:
  - 교회 징계 결정에만 한정하는 해석
  - 아무 요청이나 자동으로 성취된다는 식의 일반 약속으로 확장하는 해석
  rationale: 직전 문맥(18:15–18)과 연결되지만, 이 절 자체는 공동의 합의된 구함을 말할 뿐이므로 해석을 덧씌워 긴장을 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
