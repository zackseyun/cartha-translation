  - 그때에
  lexicon: BDAG
  rationale: 시간적·순차적 연결을 자연스럽게 살리되, 한국어 문장 흐름에 맞는 간결한 표지로 옮겼습니다.
- source_word: προσελθὼν αὐτῷ
