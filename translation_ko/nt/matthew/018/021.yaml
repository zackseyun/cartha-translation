  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
  footnotes:
  - marker: a
    text: Or 'my brother or sister'; the Greek says 'my brother' (masculine singular), which may in context refer more broadly to a fellow disciple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 베드로가 예수께 다가와 말했습니다. 「주님, 제 형제[a]가 제게 몇 번이나 죄를 지으면 제가 그를 용서해야 합니까? 일곱 번까지입니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 '내 형제'라는 남성 단수 형태를 사용합니다. 문맥상 동료 제자를 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
