- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 선생님
  lexicon: BDAG
  rationale: 예수께 대한 직접 호칭으로서 경외를 드러내는 한국어 관용을 반영했습니다.
- source_word: ποσάκις ἁμαρτήσει εἰς ἐμὲ
  english_pob_choice: how many times will my brother sin against me
  chosen_korean: 몇 번이나 저에게 죄를 지으면
  alternatives_korean:
  - 몇 차례나 저에게 죄를 범하면
  - 얼마나 자주 저에게 죄를 지으면
  lexicon: BDAG
  rationale: ποσάκις의 빈도 질문과 ἁμαρτήσει εἰς ἐμέ의 '나를 향해 짓는 죄'를 자연스럽게 옮겼습니다.
- source_word: ὁ ἀδελφός μου
  english_pob_choice: my brother
  chosen_korean: 제 형제
  alternatives_korean:
  - 제 형제자매
  - 제 동료 제자
  lexicon: BDAG
  rationale: 그리스어가 남성 단수 형태이므로 본문 표기를 보존하되, 현대 한국어에서 포괄적으로 읽힐 수 있는 문맥적 가능성도 남겼습니다.
- source_word: ἀφήσω αὐτῷ
  english_pob_choice: and I forgive him
  chosen_korean: 제가 그를 용서해야 합니까
  alternatives_korean:
  - 제가 그를 용서하겠습니까
  - 제가 그에게 용서해 주어야 합니까
  lexicon: BDAG
  rationale: 질문의 핵심은 반복적 용서 의무이므로, 미래형의 기능을 한국어의 의무·결단형으로 자연스럽게 반영했습니다.
- source_word: ἕως ἑπτάκις
  english_pob_choice: Up to seven times?
  chosen_korean: 일곱 번까지입니까?
  alternatives_korean:
  - 최대 일곱 번입니까?
  - 일곱 번까지요?
  lexicon: BDAG
  rationale: 상한선을 묻는 표현을 직역에 가깝게 유지하면서도 한국어 질문문으로 자연화했습니다.
theological_decisions:
- issue: ἀδελφός의 범위
  chosen_reading: 본문에는 '제 형제'를 유지했습니다.
  alternative_readings:
  - 제 형제자매
  - 제 동료 제자
  rationale: 그리스어는 남성 단수형이며, 본문 자체는 성별 확장을 명시하지 않습니다. 문맥상 포괄 가능성은 주석 없이 본문을 넘지 않고, 원문 형식을 우선했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
