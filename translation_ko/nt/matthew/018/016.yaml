id: MAT.18.16
reference: Matthew 18:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'on the testimony of two or three witnesses.'
    reason: lexical_alternative
  - marker: b
    text: An allusion to Deuteronomy 19:15, where a matter is established by two or three witnesses.
    reason: cross_reference
translation:
  language: ko
  text: 그런데도 그가 듣지 않으면, 너와 함께 한두 사람을 더 데려가십시오. 이는 두세 증인의 입으로 모든 일이 확정되게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 해석적으로, ‘두세 증인의 증언에 의하여’.
    reason: lexical_alternative
  - marker: b
    text: 신명기 19:15를 가리키는 말로, 두세 증인의 입으로 일이 확정된다는 원칙을 반영합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δὲ μὴ ἀκούσῃ
  english_pob_choice: But if he does not listen
  chosen_korean: 그런데도 그가 듣지 않으면
  alternatives_korean:
  - 그러나 그가 듣지 않으면
  - 만일 그가 듣지 않으면
  lexicon: BDAG
  rationale: ἀκούω는 단순 청각이 아니라 여기서는 권고나 경고를 받아들이는 뜻이므로, 관계와 절차의 흐름을 살린 ‘듣지 않으면’이 적절합니다.
- source_word: παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο
  english_pob_choice: take one or two others with you
  chosen_korean: 너와 함께 한두 사람을 더 데려가십시오
  alternatives_korean:
  - 한두 사람을 더 데리고 가십시오
  - 한두 사람을 더 함께 데려가십시오
  lexicon: BDAG
  rationale: παράλαβε와 μετὰ σοῦ의 결합은 동행을 위한 동반 조치를 뜻하므로, 자연스러운 한국어 명령형인 ‘데려가십시오’로 옮겼습니다.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  english_pob_choice: by the mouth of two or three witnesses
  chosen_korean: 두세 증인의 입으로
  alternatives_korean:
  - 두세 증인의 증언으로
  - 두세 증인의 증거로
  lexicon: BDAG
  rationale: στόματος는 직역하면 ‘입’이지만, 신명기 19:15를 반영하는 법정적 관용구이므로 그 성격을 살려 ‘입으로’로 유지했습니다.
- source_word: πᾶν ῥῆμα
  english_pob_choice: every matter
  chosen_korean: 모든 일
  alternatives_korean:
  - 모든 사건
  - 모든 말
  lexicon: BDAG
  rationale: 법적 맥락에서 ῥῆμα는 개별 발화보다 분쟁의 대상이 되는 사안 전체를 가리키므로, 한국어로는 ‘모든 일’이 가장 무난합니다.
theological_decisions:
- issue: 신명기 19:15의 재현 방식
  chosen_reading: 법정적 의미를 살리되, 한국어 문장 안에서는 지나치게 해석적인 용어를 최소화했습니다.
  alternative_readings:
  - ‘두세 증인의 증언에 의해’
  - ‘두세 증인의 증거로’
  rationale: 본문은 공동체 징계 절차를 신명기의 증인 원칙 위에 놓고 있으므로, 원문의 관용구를 보존하면서도 현대 독자가 이해할 수 있게 번역해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
