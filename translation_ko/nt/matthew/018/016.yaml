  source_fidelity: 개정이 필요합니다. δέ는 단순한 대조/진행이므로 ‘그런데도’가 암시하는 강한 양보보다는 ‘그러나’가 더 정확합니다. 또한 법정적 맥락의 πᾶν ῥῆμα는 ‘모든 일’보다 ‘모든 사안’이 더 분명하게 반영합니다.
  naturalness: ‘한두 사람을 더 데리고 가십시오’는 μετὰ σοῦ의 동반 의미를 자연스럽게 담으며, ‘너와 함께’라는 중복을 피합니다. 목적절도 현대 표준어 합쇼체로 매끄럽게 정리했습니다.
  terminology: ‘두세 증인의 입으로’는 신명기적 법률 관용구를 보존합니다. 대안 번역과 신명기 인용 각주는 해당 관용구에 직접 붙여야 하므로 앵커를 옮겼습니다.
