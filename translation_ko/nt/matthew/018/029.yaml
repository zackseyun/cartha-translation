revisions:
- from: 그래서 그 동료 종이 엎드려 그에게 간청하며 말했습니다. 「저에게 오래 참아 주십시오. 그러면 제가 갚겠습니다.」[a]
  to: 그래서 그의 동료 종[a]이 엎드려 그에게 간청하면서 이렇게 말했습니다. 「제게 오래 참아 주십시오. 그러면 제가 갚겠습니다.」
  rationale: αὐτοῦ를 ‘그의’로 명시하고, 각주 표지를 ‘동료 종’에 직접 연결했습니다. 각주는 σύνδουλος의 핵심 관계를 설명하면서 한국어 대안 번역을 제시하도록 수정했습니다. 나머지 표현은 원문의 간청, 인내 요청, 빚 상환 약속을 현대 한국어 합쇼체로 충실히 유지합니다.
  reviewer_model: gpt-5.6-terra
