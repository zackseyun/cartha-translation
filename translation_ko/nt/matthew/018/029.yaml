id: MAT.18.29
reference: Matthew 18:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow slave fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
  footnotes:
  - marker: a
    text: Or 'fellow servant.' The Greek σύνδουλος denotes one who shares the same master; 'fellow slave' is used here because the bonded relationship is prominent in the parable.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 그 동료 종이 엎드려 그에게 간청하며 말했습니다. 「저에게 오래 참아 주십시오. 그러면 제가 갚겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동료 종’은 그리스어 σύνδουλος의 직역적 의미를 따른 것입니다. POB의 영어 본문처럼, 이 관계는 같은 주인 아래 있는 동료의 신분을 강조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ σύνδουλος αὐτοῦ
  english_pob_choice: fellow slave
  chosen_korean: 그 동료 종
  alternatives_korean:
  - 그 동료 노예
  - 그 동료 종
  lexicon: BDAG
  rationale: σύνδουλος는 같은 주인 아래 있는 ‘동료 종’이라는 뜻이므로 기본값인 종을 살리되, POB의 ‘fellow slave’가 드러내는 관계적 동일 처지를 유지했습니다.
- source_word: παρεκάλει
  english_pob_choice: pleaded
  chosen_korean: 간청하며
  alternatives_korean:
  - 애원하며
  - 부탁하며
  - 간청하며
  lexicon: BDAG
  rationale: 미완료 시제의 지속적이고 절박한 요청을 한국어의 ‘간청하다’로 옮겨, 단순한 부탁보다 강한 호소를 반영했습니다.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  english_pob_choice: Be patient with me
  chosen_korean: 저에게 오래 참아 주십시오
  alternatives_korean:
  - 저에게 인내해 주십시오
  - 저를 향해 참아 주십시오
  - 저에게 오래 참아 주십시오
  lexicon: BDAG
  rationale: μακροθυμέω는 상대를 향한 인내/참음을 뜻하므로, 자연스러운 합쇼체로 ‘오래 참아 주십시오’라고 옮겼습니다. ‘오래’는 장기적 유예의 뉘앙스를 살립니다.
- source_word: ἀποδώσω σοι
  english_pob_choice: I will repay you
  chosen_korean: 제가 갚겠습니다
  alternatives_korean:
  - 제가 갚아 드리겠습니다
  - 제가 갚겠습니다
  - 제가 돌려드리겠습니다
  lexicon: BDAG
  rationale: 빚 문맥에서 ἀποδίδωμι는 ‘갚다/상환하다’가 적절하며, ‘갚겠습니다’가 가장 간결하고 직접적입니다.
theological_decisions:
- issue: δουλος 계열을 한국어로 어떻게 드러낼지
  chosen_reading: ‘동료 종’으로 번역해, 신분적 종속 관계를 완화하지 않았습니다.
  alternative_readings:
  - 동료 일꾼
  - 동료 종
  - 동료 노예
  rationale: 본문은 빚과 주인-종 관계의 비유 안에 있으므로, 관계의 낮은 신분과 의존성을 흐리지 않는 번역이 필요합니다. 다만 한국어 출판문맥에서 ‘노예’는 지나치게 강한 현대적 뉘앙스를 낼 수 있어, 본문 의미와 독자 가독성의 균형상 ‘종’을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; Contested terms table for δοῦλος
