id: MAT.18.26
reference: Matthew 18:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the slave fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
  footnotes:
  - marker: a
    text: Or 'bowed down before him'; the Greek verb can also be rendered 'worshiped' in other contexts, but here it refers to deferential prostration before a human master.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 종이 엎드려 그에게 간청하며 말했습니다. “저를 참아 주십시오. 제가 모든 것을 갚겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엎드려’는 προσκυνέω의 몸짓을 드러낸 표현입니다. 이 동사는 다른 문맥에서는 ‘경배하다’로도 옮길 수 있지만, 여기서는 인간 주인 앞의 예우적 엎드림을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  english_pob_choice: fell down
  chosen_korean: 엎드려
  alternatives_korean:
  - 쓰러져
  - 무릎을 꿇고
  lexicon: BDAG
  rationale: 서술적 겸손의 자세를 나타내는 동작으로, 한국어에서는 자연스러운 ‘엎드려’가 신체적 절을 잘 드러냅니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  - 종복
  lexicon: BDAG
  rationale: 이 비유에서 빚과 전적인 종속 관계가 이미 분명하므로, 본문 어조를 살리면서도 한국어에서 과도하게 현대적 착취 이미지를 덧씌우지 않는 ‘종’을 택했습니다.
- source_word: προσεκύνει
  english_pob_choice: kept pleading
  chosen_korean: 간청하며
  alternatives_korean:
  - 절하며
  - 경배하며
  - 빌며
  lexicon: BDAG
  rationale: 사람 주인 앞에서의 공손한 엎드림으로 이해해야 하므로, ‘경배’ 대신 간청의 뉘앙스를 살리는 ‘간청하며’로 옮겼습니다.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  english_pob_choice: Be patient with me
  chosen_korean: 저를 참아 주십시오
  alternatives_korean:
  - 제게 오래 참아 주십시오
  - 제게 관대히 대해 주십시오
  - 저를 너그럽게 봐 주십시오
  lexicon: BDAG
  rationale: 채무 연기와 관용을 구하는 간청이므로, 현대 한국어에서 자연스럽고 정중한 요청으로 들리는 ‘참아 주십시오’를 선택했습니다.
theological_decisions:
- issue: προσκυνέω의 의미를 종교적 경배로 읽을지, 예우의 엎드림으로 읽을지
  chosen_reading: 인물 간 서열 관계 안에서의 예우적 엎드림으로 처리했습니다.
  alternative_readings:
  - 경배하며
  - 예배드리며
  rationale: 문맥상 대상은 이야기 속 주인이므로, 종교적 숭배를 직접 암시하는 표현은 본문의 긴장을 과도하게 확대할 수 있습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 허락하는 의미 범위를 보존
