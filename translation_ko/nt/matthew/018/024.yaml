review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문은 ‘만 달란트를 빚진’이라는 수식어를 채무자에게 직접 붙이며, 초안처럼 ‘그 빚은 만 달란트였습니다’라고 별도 문장으로 처리하면 원문의 한 문장 구조와 초점이 약해집니다. 또한 προσηνέχθη는 ‘데려오다/이끌어 오다’의 수동으로, ‘끌려오다’는 가능한 문맥적 뉘앙스이나 원어 동사 자체가 강제성을 명시하지는 않습니다.
  naturalness: ‘한 빚진 자’보다 ‘한 채무자’ 또는 ‘한 사람이 … 빚진’이 현대 표준어 문장에서는 더 자연스럽습니다. ‘이끌려 왔습니다’는 수동성을 유지하면서도 불필요하게 강제성을 단정하지 않는 합쇼체 표현입니다.
  terminology: ‘결산을 시작하다’는 συναίρειν의 회계·정산 문맥을 잘 살립니다. ‘달란트’는 역사적 화폐·중량 단위로 유지하는 것이 적절하며, 문화 주석도 적절합니다.
  issues:
  - severity: medium
    issue: ‘만 달란트’가 채무자가 아닌 별도 문장의 ‘빚’에 연결됨
    rationale: μυρίων ταλάντων는 εἷς ὀφειλέτης를 직접 수식합니다. 의미 자체는 보존되지만, 원문의 정보 배열과 강조를 보존하려면 ‘만 달란트를 빚진 한 채무자’로 옮기는 편이 낫습니다.
  - severity: low
    issue: ‘끌려왔습니다’가 강제성을 다소 과도하게 시사함
    rationale: προσηνέχθη는 수동태로 ‘데려와졌다/이끌려 왔다’라는 뜻이지만, 동사만으로 강제 연행을 명시하지는 않습니다. ‘이끌려 왔습니다’가 더 중립적입니다.
  - severity: low
    issue: ‘한 빚진 자’의 현대성
    rationale: 문법적으로 가능하나 현대의 자연스러운 공적 문체에서는 ‘한 채무자’가 더 간결하고 자연스럽습니다.
  revised_text: 그가 결산을 시작하자, 만 달란트를 빚진 한 채무자가 그에게 이끌려 왔습니다.[a]
  revised_footnotes:
