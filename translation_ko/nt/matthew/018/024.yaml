    reason: cultural_note
  revision_rationale: 원문의 회계 상황, 수동 표현, 수사적으로 큰 액수, 그리고 ‘한 채무자’라는 정보 구조를 한 문장 안에서 보존했습니다. 수동태는 유지하되 원문이 명시하지 않는 강제성을 확정하지 않도록 ‘이끌려 왔습니다’로 조정했습니다.
