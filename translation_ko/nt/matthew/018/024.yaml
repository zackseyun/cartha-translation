id: MAT.18.24
reference: Matthew 18:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
  footnotes:
  - marker: a
    text: A talent was a very large monetary unit; 'ten thousand talents' represents an unimaginably great debt in the parable's setting.
    reason: cultural_note
translation:
  language: ko
  text: 그가 계산을 시작하자, 한 빚진 자가 그에게 끌려왔습니다. 그 빚은 만 달란트였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달란트는 매우 큰 화폐 단위로, '만 달란트'는 비유의 장면에서 상상하기 어려울 만큼 큰 빚을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ συναίρειν
  english_pob_choice: when he began to settle accounts
  chosen_korean: 그가 계산을 시작하자
  alternatives_korean:
  - 그가 장부를 정리하기 시작하자
  - 그가 결산을 시작하자
  lexicon: BDAG
  rationale: 계산·결산의 회계적 이미지를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: προσηνέχθη αὐτῷ
  english_pob_choice: was brought to him
  chosen_korean: 그에게 끌려왔습니다
  alternatives_korean:
  - 그에게 끌려왔습니다
  - 그에게 끌려나왔습니다
  - 그 앞에 끌려왔습니다
  lexicon: BDAG
  rationale: 수동형의 강한 강제성을 드러내기 위해 단순히 '왔다'보다 '끌려왔다'를 택했고, 문맥상 왕 앞에 데려온 뜻을 자연스럽게 표현했습니다.
- source_word: εἷς ὀφειλέτης
  english_pob_choice: one debtor
  chosen_korean: 한 빚진 자
  alternatives_korean:
  - 한 채무자
  - 한 빚진 사람
  lexicon: BDAG
  rationale: ὀφειλέτης의 기본 뜻을 살리되, 비유의 문체에 맞게 '빚진 자'로 옮겨 인물 유형을 간결하게 드러냈습니다.
- source_word: μυρίων ταλάντων
  english_pob_choice: ten thousand talents
  chosen_korean: 만 달란트
  alternatives_korean:
  - 일만 달란트
  - 헤아릴 수 없이 많은 달란트
  lexicon: BDAG
  rationale: μύριοι의 수사적 크기를 그대로 살려 '만'을 쓰고, 역사적 화폐 단위인 '달란트'는 현대화하지 않고 유지했습니다.
theological_decisions:
- issue: 비유에서의 수동 표현이 담는 강제성
  chosen_reading: '''그에게 끌려왔습니다''로 처리해, 단순한 자발적 접근이 아니라 왕 앞에 불려 나온 상황을 드러냈습니다.'
  alternative_readings:
  - 그에게 가져왔습니다
  - 그에게 소개되었습니다
  rationale: 문맥의 심판/정산 장면에 맞게 수동형의 압박감을 보존하는 것이 비유의 긴장을 더 잘 전달합니다.
  doctrine_reference: 마태복음 18장 비유의 심판적 맥락
- issue: '''만 달란트''의 과장된 규모'
  chosen_reading: '''만 달란트''를 유지해 과장법을 살렸습니다.'
  alternative_readings:
  - 헤아릴 수 없이 많은 달란트
  - 엄청난 달란트
  rationale: 수치 자체가 비유의 핵심 효과이므로, 의미를 풀어 설명하기보다 원문 수사를 그대로 전달하는 편이 적절합니다.
  doctrine_reference: 비유의 수사적 과장
