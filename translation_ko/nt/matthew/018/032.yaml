id: MAT.18.32
reference: Matthew 18:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked slave[b], I forgave you all that debt because you pleaded with me.’
  footnotes:
  - marker: a
    text: Or 'I canceled for you all that debt.' The Greek verb can denote releasing or remitting a debt as well as forgiving.
    reason: lexical_alternative
  - marker: b
    text: Or 'servant.' The Greek δοῦλος can mean 'servant' or 'slave'; here 'slave' is used because the bonded relationship to the master is central to the parable.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그의 주인이 그를 불러 말했습니다. 「악한 노예야, 네가 나에게 간구했으므로 내가 네 모든 빚을 탕감해 주었다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘탕감해 주었다’는 빚을 면제한다는 뜻을 분명히 합니다. 원문 동사는 채무를 풀어 주거나 용서한다는 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘노예’는 원문의 δοῦλος를 따른 것입니다. 이 비유에서는 주인에게 속한 종속 관계가 핵심이므로 ‘종’보다 더 직접적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  english_pob_choice: Then
  chosen_korean: 그러자
  alternatives_korean:
  - 그때
  - 그런 다음
  lexicon: BDAG
  rationale: 서사 진행을 자연스럽게 이어 주는 시간/결과 연결어로, 이 문맥에서는 단순한 ‘그때’보다 사건의 전개를 드러내는 ‘그러자’가 적절합니다.
- source_word: προσκαλεσάμενος
  english_pob_choice: summoned
  chosen_korean: 불러
  alternatives_korean:
  - 소환하여
  - 불러들여
  lexicon: BDAG
  rationale: 주인이 권위를 가지고 자기 앞으로 부르는 동작을 한국어로 간결하게 살렸습니다. 너무 과장된 ‘소환하다’보다 서사에 자연스럽습니다.
- source_word: Δοῦλε
  english_pob_choice: slave
  chosen_korean: 노예야
  alternatives_korean:
  - 종아
  - 종이여
  lexicon: BDAG
  rationale: PB의 도우룰로스 기본 방침에 따라, 이 비유에서 종속·소유 관계가 핵심이므로 ‘노예’로 옮겼습니다.
- source_word: πονηρέ
  english_pob_choice: Wicked
  chosen_korean: 악한
  alternatives_korean:
  - 사악한
  - 못된
  lexicon: BDAG
  rationale: 도덕적 비난을 직접 드러내는 형용사로, 한국어에서 가장 सीधे하게는 ‘악한’이 적절합니다.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  english_pob_choice: all that debt
  chosen_korean: 네 모든 빚
  alternatives_korean:
  - 그 모든 빚
  - 그 빚 전부
  lexicon: BDAG
  rationale: ὀφειλή는 ‘빚/채무’이므로 ‘빚’으로 옮겼고, συνολικό한 범위를 한국어로 자연스럽게 ‘모든’으로 풀었습니다. 지시사 ἐκείνην의 거리감은 문맥상 한국어에선 강하게 드러낼 필요가 적습니다.
- source_word: ἀφῆκά σοι
  english_pob_choice: I forgave you
  chosen_korean: 탕감해 주었다
  alternatives_korean:
  - 용서해 주었다
  - 면제해 주었다
  lexicon: BDAG
  rationale: 빚 문맥에서는 ‘탕감하다’가 채무 면제를 가장 직접적으로 드러냅니다. 동시에 마태복음의 용서 언어와의 연결은 본절의 채무 이미지를 해치지 않는 범위에서 유지됩니다.
- source_word: παρεκάλεσάς με
  english_pob_choice: you pleaded with me
  chosen_korean: 나에게 간구했으므로
  alternatives_korean:
  - 나를 애원했으므로
  - 나에게 탄원했으므로
  lexicon: BDAG
  rationale: παρακαλέω의 간절한 청원을 살리되, 한국어 성경 문체에서 격식 있고 자연스러운 ‘간구하다’를 택했습니다.
theological_decisions:
- issue: δοῦλος의 번역에서 ‘종’ 대신 ‘노예’를 유지할지 여부
  chosen_reading: 노예
  alternative_readings:
  - 종
  - 종살이하는 사람
  rationale: 이 비유는 주인-소유 관계와 채무 의존성을 드러내므로, 완곡한 ‘종’보다 ‘노예’가 본문의 사회적 긴장을 더 투명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δοῦλος; preserve bonded-status where central'
- issue: ἀφίημι의 채무 문맥 번역
  chosen_reading: 탕감해 주었다
  alternative_readings:
  - 용서해 주었다
  - 빚을 면제해 주었다
  rationale: ‘탕감하다’는 채무 면제를 직접 뜻하면서도, 마태복음이 의도하는 용서의 신학적 울림을 크게 훼손하지 않습니다. 따라서 경제적 의미와 관계적 의미 사이의 긴장을 비교적 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than flattening it'
