  rationale: Singular αὐτοῦ를 정확히 반영하여 ‘그분의’를 ‘그의’로 고쳤고, 각주 표지를 해당 어휘에 붙였습니다. 또한 διεσάφησαν의 자세한 보고 의미를 자연스럽게 드러내도록 ‘자세히 알렸습니다’로 다듬었습니다.
