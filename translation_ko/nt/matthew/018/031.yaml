id: MAT.18.31
reference: Matthew 18:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow slaves saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
  footnotes:
  - marker: a
    text: Or 'fellow servants.' The Greek term is σύνδουλοι, literally 'fellow slaves' or 'fellow servants'; here 'slaves' is used because their bonded status under the same lord is important to the parable.
    reason: lexical_alternative
  - marker: b
    text: Or 'to their master.' The Greek word is κύριος, commonly rendered 'lord' or 'master' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그분의 동료 노예들이 일어난 일을 보고 크게 슬퍼하였으며, 와서 자기들의 주인에게 일어난 모든 일을 자세히 보고하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 중의적으로는 ‘동료 종들’로도 옮길 수 있습니다. 그러나 여기서는 같은 주인 아래의 묶인 신분이 중요하므로 ‘노예들’을 채택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 κύριος는 사람 주인을 가리키므로, ‘주님’보다 ‘주인’이 문맥에 더 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러니까
  lexicon: BDAG
  rationale: 앞절의 상황에서 이어지는 추론적·서술적 연결을 자연스럽게 살리기 위해 ‘그러므로’를 택했습니다.
- source_word: σύνδουλοι
  english_pob_choice: fellow slaves
  chosen_korean: 동료 노예들
  alternatives_korean:
  - 동료 종들
  - 동료 하인들
  lexicon: BDAG
  rationale: 같은 주인 아래 묶인 신분을 드러내기 위해 POB의 ‘fellow slaves’ 취지를 따라 ‘동료 노예들’로 옮겼습니다.
- source_word: ἐλυπήθησαν σφόδρα
  english_pob_choice: were deeply grieved
  chosen_korean: 크게 슬퍼하였으며
  alternatives_korean:
  - 몹시 근심하였으며
  - 깊이 슬퍼하였으며
  lexicon: BDAG
  rationale: λυπέω의 슬픔/근심 의미와 σφόδρα의 강화를 자연스러운 현대 한국어로 반영했습니다.
- source_word: τῷ κυρίῳ ἑαυτῶν
  english_pob_choice: to their lord
  chosen_korean: 자기들의 주인에게
  alternatives_korean:
  - 자기들의 주에게
  - 자기들의 주인께
  lexicon: BDAG
  rationale: 여기서 κύριος는 비유 속 인간 상전이므로, 신적 호칭 ‘주님’보다 관계를 분명히 하는 ‘주인’이 source-direct합니다.
- source_word: διεσάφησαν
  english_pob_choice: reported
  chosen_korean: 자세히 보고하였습니다
  alternatives_korean:
  - 보고하였습니다
  - 자세히 설명하였습니다
  lexicon: BDAG
  rationale: 문맥상 단순 전달보다 ‘자세히 알려줌’의 뉘앙스가 있어, 보고의 성격을 살리되 ‘자세히’로 보완했습니다.
theological_decisions:
- issue: δουλος-계열 용어를 한국어에서 어떻게 살릴지
  chosen_reading: ‘동료 노예들’
  alternative_readings:
  - ‘동료 종들’
  - ‘동료 일꾼들’
  rationale: 이 비유에서는 같은 주인에게 속한 묶인 신분이 핵심이므로, 전통적 완화어보다 POB의 source-direct 취지를 따라 ‘노예’로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; Contested terms table for δοῦλος
- issue: κύριος의 인간 상전 용례
  chosen_reading: ‘주인’
  alternative_readings:
  - ‘주’
  - ‘선생’
  rationale: 인물의 신적 호칭이 아니라 인간적 소유/권위 관계를 가리키므로, 한국어에서 오해를 줄이는 ‘주인’이 적절합니다.
  doctrine_reference: DOCTRINE.md Contested terms table for κύριος
