    text: 달리 ‘동료 종들’로 옮길 수도 있습니다. σύνδουλοι는 같은 주인에게 속한 동료 노예 또는 종을 뜻합니다. 이 비유에서는 그러한 예속된 지위가 중요하므로 ‘동료 노예들’로 옮겼습니다.
