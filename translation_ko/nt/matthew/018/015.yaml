id: MAT.18.15
reference: Matthew 18:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
  footnotes:
  - marker: a
    text: Some manuscripts omit 'against you,' reading, 'If your brother sins, go and confront him between you and him alone.'
    reason: textual_variant
  - marker: b
    text: Or 'reprove,' 'show him his fault.'
    reason: lexical_alternative
  - marker: c
    text: '''Brother'' is grammatically masculine singular; in context it may refer more broadly to a fellow disciple.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 네 형제가 네게 죄를 지으면, 가서 너와 그 사람만 있을 때 그를 책망하십시오. 그가 네 말을 들으면, 네 형제를 얻은 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 '네게'를 생략하여, '네 형제가 죄를 지으면, 가서 너와 그 사람만 있을 때 그를 책망하십시오'로 읽습니다.
    reason: textual_variant
  - marker: b
    text: '''책망하십시오'' 또는 ''그의 잘못을 드러내십시오''라는 뜻입니다.'
    reason: lexical_alternative
  - marker: c
    text: '''형제''는 문법상 남성 단수이지만, 문맥상 더 넓게는 동료 제자를 가리킬 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ εἰς σέ
  english_pob_choice: sins against you
  chosen_korean: 네게 죄를 지으면
  alternatives_korean:
  - 네게 죄를 범하면
  - 너를 거슬러 죄를 지으면
  lexicon: BDAG
  rationale: εἰς σέ의 대인적 방향성을 한국어에서는 자연스럽게 '네게 죄를 지으면'으로 살리되, 전치사적 표현을 과장하지 않았습니다.
- source_word: ἀδελφός σου
  english_pob_choice: your brother
  chosen_korean: 네 형제
  alternatives_korean:
  - 네 형제자매
  - 네 동료 신자
  lexicon: BDAG
  rationale: 본문의 문법상 남성 단수 형식을 따라 직역에 가깝게 유지했으며, 포괄적 확장은 본문 밖의 해석이므로 본문에는 넣지 않았습니다.
- source_word: ἔλεγξον
  english_pob_choice: reprove / show him his fault
  chosen_korean: 책망하십시오
  alternatives_korean:
  - 꾸짖으십시오
  - 잘못을 드러내십시오
  - 면전에서 지적하십시오
  lexicon: BDAG
  rationale: ἐλέγχω의 핵심인 잘못을 드러내어 바로잡는 뜻을 현대 한국어의 공손한 명령형으로 가장 간결하게 살렸습니다.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  english_pob_choice: between you and him alone
  chosen_korean: 너와 그 사람만 있을 때
  alternatives_korean:
  - 너와 그 사람 둘만 있을 때
  - 은밀히 너와 그 사람 사이에서
  lexicon: BDAG
  rationale: 사적이고 배타적인 상황을 한국어의 자연스러운 시간/상황 표현으로 옮겨, '혼자'의 의미를 더 명료하게 전달했습니다.
theological_decisions:
- issue: 형제 언어의 적용 범위
  chosen_reading: 본문에는 '형제'를 유지하고, 필요 이상의 중성화는 하지 않았습니다.
  alternative_readings:
  - 형제자매
  - 동료 신자
  rationale: 공동체 적용 가능성은 문맥상 이해되지만, 본문 형식이 남성 단수이므로 그 형태를 보존하는 것이 소스 충실성에 더 부합합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: εἰς σέ의 본문 포함
  chosen_reading: '''네게''를 본문에 포함했습니다.'
  alternative_readings:
  - '''네게''를 생략한 짧은 읽기'
  rationale: 제공된 SBLGNT 본문을 따르며, 잘 알려진 본문 변이를 한국어 본문에서 무시하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
