review_pass:
  verdict: revise
  source_fidelity: 본문은 SBLGNT의 εἰς σέ(‘네게’)를 반영하고, 사적으로 당사자끼리 권면하라는 구조와 ‘네 형제를 얻었다’는 결과를 대체로 충실히 옮겼습니다. 다만 ‘너와 그 사람만 있을 때’는 μεταξὺ σοῦ καὶ αὐτοῦ μόνου의 ‘너와 그 사람 둘 사이에서/단둘이’라는 한정성을 약간 느슨하게 하므로 더 직접적으로 표현하는 편이 좋습니다.
  naturalness: ‘그 사람’과 ‘그를 책망하십시오’의 연결은 이해되지만 다소 딱딱하고, ‘책망하다’는 ἐλέγχω보다 꾸짖는 뉘앙스가 강하게 들릴 수 있습니다. ‘너와 그 사람 둘만 있는 자리에서 그의 잘못을 지적하십시오’는 현대 표준어 합쇼체에서 자연스럽고, 사적인 대면과 잘못을 드러내는 뜻을 분명히 합니다.
  terminology: ‘네 형제’는 ἀδελφός σου의 남성 단수 형식을 보존하며 적절합니다. ‘네게 죄를 지으면’도 εἰς σέ의 대인적 방향성을 자연스럽게 반영합니다. 각주 표지는 해당 단어 또는 구절 바로 뒤에 두어 본문 변이와 어휘 설명의 범위를 명확히 해야 합니다.
  issues:
  - severity: medium
    issue: 각주 표지 [a][b][c]가 모두 절 끝에 몰려 있습니다.
