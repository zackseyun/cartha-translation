  to: 그러나 네 형제[c]가 네게 죄를 지으면[a], 가서 너와 그 사람 둘만 있는 자리에서 그의 잘못을 지적하십시오[b]. 그가 네 말을 들으면, 네 형제를 얻은 것입니다.
