review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. σκανδαλίζει의 ‘넘어짐’ 비유를 본문에서 ‘죄를 짓게 하다’로 직접화한 것은 원문의 표현을 평면화합니다. 또한 κυλλόν ἢ χωλόν을 ‘장애인이나 절뚝발이’로 옮긴 것은 각각의 구체적 신체 상태와 대비를 충분히 반영하지 못하며, 사람을 범주화하는 표현도 자연스럽지 않습니다.
  naturalness: ‘네게 걸림돌이 되거든’은 현대 표준어에서 자연스러우면서도 원문의 비유를 보존합니다. ‘손발을 잃은 채나 다리를 저는 채’는 본문의 극단적 손상 이미지를 구체적으로 전달하고, ‘두 손이나 두 발을 가진 채’와의 대비도 명료합니다.
  terminology: ‘생명’, ‘영원한 불’은 각각 ζωή와 τὸ πῦρ τὸ αἰώνιον을 불필요하게 해석적으로 확장하지 않고 충실히 반영합니다. ‘잘라 내고’와 ‘내던지십시오’는 강한 명령과 분리의 뜻을 유지합니다.
  issues:
  - severity: medium
    issue: σκανδαλίζει를 ‘네가 죄를 짓게 하거든’으로 본문에서 번역함
    rationale: 이는 가능한 해석적 의미이지만, 원문과 영어 POB가 보존한 ‘걸려 넘어짐’의 비유를 직접적인 도덕 표현으로 바꿉니다. 본문에는 비유를 살리고 ‘죄를 짓게 하다’는 각주 대안으로 두는 것이 적절합니다.
  - severity: medium
