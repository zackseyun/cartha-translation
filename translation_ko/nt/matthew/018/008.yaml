    rationale: κυλλός는 절단·훼손으로 손발을 잃은 상태를, χωλός는 다리를 저는 상태를 가리키는 대조입니다. ‘장애인’은 지나치게 넓고, ‘절뚝발이’는 현대 표준어에서 사람을 지칭하는 표현으로 부자연스럽거나 낙인적으로 들릴 수 있습니다.
  - severity: low
    issue: 각주가 본문의 선택과 중복됨
    rationale: 현 본문이 이미 ‘죄를 짓게 하거든’인데 각주도 같은 표현을 ‘또는’으로 제시합니다. 본문을 비유적으로 고치고 각주를 해석적 대안으로 제시해야 기능이 분명해집니다.
  revised_text: 그러나 네 손이나 네 발이 네게 걸림돌이 되거든[a], 그것을 잘라 내고 네게서 내던지십시오. 손발을 잃은 채나 다리를 저는 채 생명에 들어가는 것이, 두 손이나 두 발을 가진 채 영원한 불에 던져지는 것보다 네게 낫습니다.
