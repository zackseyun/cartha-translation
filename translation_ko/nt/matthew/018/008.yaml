- from: 그런데 만일 네 손이나 네 발이 네가 죄를 짓게 하거든[a] 그것을 찍어 버리고 네게서 내던지십시오. 장애인이나 절뚝발이로 생명에 들어가는 것이, 두 손이나 두 발을 가지고 영원한 불에 던져지는 것보다 네게 더 낫습니다.
  to: 그러나 네 손이나 네 발이 네게 걸림돌이 되거든[a], 그것을 잘라 내고 네게서 내던지십시오. 손발을 잃은 채나 다리를 저는 채 생명에 들어가는 것이, 두 손이나 두 발을 가진 채 영원한 불에 던져지는 것보다 네게 낫습니다.
  rationale: σκανδαλίζω의 비유적 이미지를 ‘네게 걸림돌이 되다’로 보존하고, 각주에서 해석적 대안인 ‘죄를 짓게 하다’를 제시했습니다. 신체 상태는 원문의 구체적 대조를 따라 ‘손발을 잃은 채나 다리를 저는 채’로 수정했습니다. 명령의 강도, ‘생명’과 ‘영원한 불’의 표현, 그리고 원문의 수적 대비는 유지했습니다.
