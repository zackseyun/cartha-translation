id: MAT.18.8
reference: Matthew 18:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
  footnotes:
  - marker: a
    text: Or 'causes you to sin.' The Greek verb literally means 'causes you to stumble.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 만일 네 손이나 네 발이 네가 죄를 짓게 하거든[a] 그것을 찍어 버리고 네게서 내던지십시오. 장애인이나 절뚝발이로 생명에 들어가는 것이, 두 손이나 두 발을 가지고 영원한 불에 던져지는 것보다 네게 더 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄를 짓게 하거든.’ 그리스어 동사는 문자적으로는 ‘넘어지게 하다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  english_pob_choice: causes you to stumble
  chosen_korean: 네가 죄를 짓게 하거든
  alternatives_korean:
  - 네가 걸려 넘어지게 하거든
  - 네게 걸림돌이 되거든
  - 네가 넘어지게 하거든
  lexicon: BDAG
  rationale: 직역상의 ‘걸려 넘어지다’ 이미지를 살릴 수 있지만, 한국어에서는 이 표현이 도리어 어색할 수 있어 이 문맥의 도덕적 결과를 분명히 하는 ‘죄를 짓게 하거든’으로 옮겼습니다.
- source_word: ἔκκοψον
  english_pob_choice: cut it off
  chosen_korean: 그것을 찍어 버리고
  alternatives_korean:
  - 그것을 잘라 버리고
  - 그것을 끊어 버리고
  lexicon: BDAG
  rationale: 손과 발에 대한 강한 절단 명령을 한국어에서 자연스럽고 단호하게 드러내기 위해 ‘찍어 버리고’를 택했습니다.
- source_word: βάλε ἀπὸ σοῦ
  english_pob_choice: throw it away from you
  chosen_korean: 네게서 내던지십시오
  alternatives_korean:
  - 네게서 던져 버리십시오
  - 네게서 버리십시오
  lexicon: BDAG
  rationale: ἀπό σοῦ의 분리감을 살리면서도 명령의 강도를 유지하도록 ‘내던지십시오’로 옮겼습니다.
- source_word: κυλλὸν ἢ χωλόν
  english_pob_choice: maimed or lame
  chosen_korean: 장애인이나 절뚝발이로
  alternatives_korean:
  - 불구가 되어
  - 손발이 불편한 채로
  lexicon: BDAG
  rationale: 본문의 대비는 한 손/두 손, 한 발/두 발의 결손 상태이므로 ‘불구’보다 더 구체적으로 결손의 결과를 드러내는 표현을 택했습니다.
- source_word: τὸ πῦρ τὸ αἰώνιον
  english_pob_choice: the eternal fire
  chosen_korean: 영원한 불
  alternatives_korean:
  - 영벌의 불
  - 영원한 지옥불
  lexicon: BDAG
  rationale: 형용사 αἰώνιον을 그대로 반영해 ‘영원한’으로 옮기고, 본문이 말하는 심판의 불 이미지를 보존했습니다.
theological_decisions:
- issue: σκανδαλίζει의 한국어 처리에서 비유적 ‘넘어짐’ 이미지를 살릴지, 도덕적 결과를 직접화할지
  chosen_reading: 죄를 짓게 하거든으로 옮기되, 각주는 생략했습니다.
  alternative_readings:
  - 걸려 넘어지게 하거든
  - 걸림돌이 되거든
  rationale: 한국어에서 ‘걸리다/넘어지다’보다 ‘죄를 짓게 하다’가 본문의 경고 효과를 더 분명하게 전달하므로, 본문 의미를 희생하지 않는 범위에서 결과를 직접화했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: κυλλὸν ἢ χωλόν의 인체 손상 이미지를 현대 한국어에서 어떻게 제시할지
  chosen_reading: 장애인이나 절뚝발이로
  alternative_readings:
  - 불구가 되어
  - 절름발이로
  rationale: 본문은 단순한 사회적 장애 범주가 아니라 손/발 절단의 극단적 결과를 말하므로, 지나치게 완곡하거나 낙인 없는 표현보다 손상 상태를 분명히 드러내는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §3
