id: MAT.18.6
reference: Matthew 18:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
  footnotes:
  - marker: a
    text: Or 'causes one of these little ones who believe in me to sin.' The Greek verb can mean to cause someone to stumble, fall away, or sin.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a donkey millstone,' that is, a large millstone turned by a donkey.
    reason: cultural_note
  - marker: c
    text: Or 'in the depth of the sea.' The Greek more specifically refers to the open sea.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 나를 믿는 이 작은 사람들 가운데 하나라도 죄에 빠지게 하면, 그에게는 차라리 나귀 맷돌이 목에 매여서 바다 한가운데에 빠져 익사당하는 편이 낫습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '나를 믿는 이 작은 사람들 가운데 하나를 죄짓게 하면.' 그리스어 동사는 넘어지게 하다, 실족시키다, 죄짓게 하다의 뜻이 될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 '나귀 맷돌'입니다. 곧 나귀가 돌리는 큰 맷돌을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 '바다의 깊은 곳에.' 그리스어는 더 구체적으로 열린 바다를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίσῃ
  english_pob_choice: causes ... to stumble
  chosen_korean: 죄에 빠지게 하면
  alternatives_korean:
  - 넘어지게 하면
  - 실족하게 하면
  - 죄짓게 하면
  lexicon: BDAG
  rationale: σκανδαλίζω의 의미 범위가 '넘어지게 하다, 실족시키다, 죄에 빠지게 하다'까지 포괄하므로, 문맥의 심각성을 살리면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: μικρῶν τούτων
  english_pob_choice: these little ones
  chosen_korean: 이 작은 사람들 가운데 하나
  alternatives_korean:
  - 이 작은 이들 가운데 하나
  - 이 어린아이들 가운데 하나
  - 이 작은 자들 가운데 하나
  lexicon: BDAG
  rationale: 여기서 μικρός는 단순한 연령보다 작음/연약함의 범주를 가리킬 수 있으므로, 어린아이로 좁히지 않고 포괄적인 표현을 택했습니다.
- source_word: μύλος ὀνικὸς
  english_pob_choice: a donkey millstone
  chosen_korean: 나귀 맷돌
  alternatives_korean:
  - 나귀가 돌리는 맷돌
  - 큰 맷돌
  - 나귀 맷돌
  lexicon: BDAG
  rationale: ὀνικός는 나귀와 관련된 큰 맷돌을 뜻하므로, 짧고 직설적인 '나귀 맷돌'이 크기와 이미지를 함께 보존합니다.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  english_pob_choice: in the open sea
  chosen_korean: 바다 한가운데에
  alternatives_korean:
  - 깊은 바다에
  - 넓은 바다에
  - 바다의 깊은 곳에
  lexicon: BDAG
  rationale: πέλαγος는 해안에서 떨어진 '열린 바다'를 가리키므로, '바다 한가운데에'가 가장 자연스럽게 그 공간감을 전달합니다.
theological_decisions:
- issue: 작은 사람들(μικρῶν τούτων)의 범위
  chosen_reading: 어린아이로만 제한하지 않고, 예수님을 믿는 연약하고 작은 이들을 포괄하는 표현으로 옮겼습니다.
  alternative_readings:
  - 이 어린아이들 가운데 하나
  - 이 제자들 가운데 하나
  rationale: 본문은 예시로 어린아이가 등장하지만, '나를 믿는'이라는 수식이 붙어 있어 범주를 단순한 연령 집단보다 더 넓게 읽게 합니다. 번역도 그 긴장을 유지했습니다.
  doctrine_reference: 의도적 긴장 보존
