id: MAT.18.9
reference: Matthew 18:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
  footnotes:
  - marker: a
    text: Or 'causes you to sin.' The Greek verb can mean to cause someone to stumble, fall, or sin.
    reason: lexical_alternative
  - marker: b
    text: '''Gehenna'' refers to the place of final judgment; traditionally rendered ''hell.'''
    reason: alternative_reading
translation:
  language: ko
  text: 또 만일 네 눈이 너를 실족하게 하거든[a], 그것을 빼내어 네게서 내던지십시오. 한쪽 눈으로 생명에 들어가는 것이, 두 눈을 가지고 불의 게헨나[b]에 던져지는 것보다 너에게 더 낫습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너를 죄짓게 하거든.’ σκανδαλίζω는 넘어지게 하다, 실족하게 하다, 죄에 빠지게 하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘게헨나’는 최후 심판의 장소를 가리키는 말로, 전통적으로는 ‘지옥’으로 옮겨졌습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  english_pob_choice: causes you to stumble
  chosen_korean: 너를 넘어지게 하거든
  alternatives_korean:
  - 너를 죄짓게 하거든
  - 너에게 올무가 되거든
  lexicon: BDAG
  rationale: σκανδαλίζω의 넘어지게 함이라는 비유를 살리면서, 한국어에서 자연스러운 경고형 표현으로 옮겼습니다.
- source_word: ἔξελε ... βάλε ἀπὸ σοῦ
  english_pob_choice: tear it out and throw it away from you
  chosen_korean: 그것을 빼어 네게서 내던지십시오
  alternatives_korean:
  - 그것을 빼어 버리십시오
  - 그것을 뽑아 네게서 던지십시오
  lexicon: BDAG
  rationale: 명령의 급박함과 과격한 비유를 살리되, 현대 한국어에서 읽히는 강한 명령형으로 다듬었습니다. '빼어'는 ἔξελε의 제거 감각을, '내던지십시오'는 ἀπὸ σοῦ의 완전한 분리를 반영합니다.
- source_word: μονόφθαλμον
  english_pob_choice: with one eye
  chosen_korean: 한쪽 눈으로
  alternatives_korean:
  - 외눈으로
  - 한 눈으로
  lexicon: BDAG
  rationale: 직역적인 '외눈'보다 문장 안에서 자연스럽고, 신체 이미지를 그대로 전달합니다.
- source_word: γέενναν τοῦ πυρός
  english_pob_choice: Gehenna of fire
  chosen_korean: 게헨나 곧 불의 곳
  alternatives_korean:
  - 지옥 곧 불의 곳
  - 게헨나, 불의 골짜기
  lexicon: BDAG
  rationale: γέεννα를 관습적 '지옥'으로 바꾸지 않고 음역 '게헨나'를 유지해 특수한 종말 심판 용어를 보존했습니다. '불의 곳'은 τοῦ πυρός의 이미지를 한국어로 풀어 주는 최소한의 설명입니다.
theological_decisions:
- issue: γέεννα의 번역 유지
  chosen_reading: 게헨나
  alternative_readings:
  - 지옥
  rationale: 본문은 일반어가 아니라 γέεννα를 쓰므로, 후대의 신학적 색채가 강한 '지옥'보다 원어의 특수성을 보존하는 쪽이 본문 충실성에 더 적합합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: εἰς τὴν ζωὴν의 보존
  chosen_reading: 생명에 들어가는 것
  alternative_readings:
  - 영생에 들어가는 것
  rationale: 원문은 단순히 '생명'이라 하며 '영원한'을 명시하지 않으므로, 그 긴장을 유지해 과잉 해석을 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
