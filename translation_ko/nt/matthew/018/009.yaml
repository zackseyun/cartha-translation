review_pass:
  verdict: revise
  source_fidelity: 전반적인 문장 구조와 비교 구문, ‘생명에 들어가다’의 절제된 번역은 원문에 충실합니다. 그러나 γέενναν τοῦ πυρός를 ‘게헨나 곧 불의 곳’으로 풀면 원문의 ‘불의 게헨나’라는 속격 관계가 설명적 동격으로 바뀌고 ‘곳’이 추가됩니다. 이를 직접 보존하는 편이 더 정확합니다.
  naturalness: 합쇼체와 현대 표준어가 대체로 자연스럽습니다. 다만 σκανδαλίζει의 비유적 표현에는 ‘넘어지게 하거든’보다 ‘실족하게 하거든’이 문맥상 더 자연스럽고 관용적입니다. 명령절과 뒤따르는 절의 경계를 쉼표로 분명히 했습니다.
  terminology: ‘게헨나’와 ‘생명’은 각각 γέεννα와 ζωή의 특수성 및 미규정성을 잘 보존합니다. ‘불의 게헨나’는 τοῦ πυρός를 추가 설명 없이 직접 반영합니다.
  issues:
  - severity: medium
    issue: ‘게헨나 곧 불의 곳’은 γέενναν τοῦ πυρός의 문법 관계를 바꾸고 ‘곳’을 보탭니다.
    rationale: 원문은 ‘게헨나’를 ‘불의’로 수식합니다. ‘곧 불의 곳’은 게헨나 자체의 뜻을 해설하는 동격 표현으로 들릴 수 있으므로, ‘불의 게헨나’로 옮겨 원문의 표현과 모호성을 보존하는 것이 안전합니다.
  - severity: low
    issue: ‘너를 넘어지게 하거든’은 비유적 경고 문맥에서 다소 어색합니다.
    rationale: σκανδαλίζω의 ‘걸려 넘어지게 하다/실족하게 하다’라는 비유를 유지하면서 한국어 관용에 맞게 ‘너를 실족하게 하거든’으로 다듬을 수 있습니다.
  revised_text: 또 만일 네 눈이 너를 실족하게 하거든[a], 그것을 빼내어 네게서 내던지십시오. 한쪽 눈으로 생명에 들어가는 것이, 두 눈을 가지고 불의 게헨나[b]에 던져지는 것보다 너에게 더 낫습니다.
