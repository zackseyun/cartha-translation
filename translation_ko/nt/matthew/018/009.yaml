  to: 또 만일 네 눈이 너를 실족하게 하거든[a], 그것을 빼내어 네게서 내던지십시오. 한쪽 눈으로 생명에 들어가는 것이, 두 눈을 가지고 불의 게헨나[b]에 던져지는 것보다 너에게 더 낫습니다.
