id: MAT.18.7
reference: Matthew 18:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
  footnotes:
  - marker: a
    text: Or 'offenses,' 'causes of sin,' or 'traps.' The Greek σκάνδαλον/σκάνδαλα refers to something that causes a person to stumble, whether by offense, enticement, or occasion for sin.
    reason: lexical_alternative
  - marker: b
    text: '''The man'' is grammatically masculine singular in Greek and here represents any individual through whom such a stumbling block comes.'
    reason: cultural_note
translation:
  language: ko
  text: 걸림돌 때문에 세상에 화가 있습니다. 걸림돌들은 반드시 오게 되어 있지만, 그 걸림돌이 오는 그 사람에게는 화가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘걸림돌’은 사람을 넘어지게 하거나 죄에 빠지게 하는 것이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 남성 단수 형태를 쓰지만, 문맥상 이런 걸림돌을 가져오는 사람이라면 누구에게나 적용되는 경고입니다.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  english_pob_choice: Woe
  chosen_korean: 화
  alternatives_korean:
  - 슬픔
  - 아아
  lexicon: BDAG
  rationale: 예언적·심판적 경고의 강도를 살리기 위해 「화」를 택했습니다. 한국어에서 통용되는 완곡한 표현보다 선포적 뉘앙스가 분명합니다.
- source_word: κόσμῳ
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 세상 사람들
  lexicon: BDAG
  rationale: κόσμος의 포괄적 의미를 자연스러운 한국어로 옮기기 위해 「세상」을 썼습니다. 물리적 세계보다 죄 아래 놓인 인간 세계 전체를 가리키는 뉘앙스를 유지합니다.
- source_word: σκάνδαλα / σκάνδαλον
  english_pob_choice: stumbling blocks
  chosen_korean: 걸림돌
  alternatives_korean:
  - 실족하게 하는 것
  - 오류
  - 죄의 유인
  lexicon: BDAG
  rationale: 원문의 비유적 이미지를 살리고, 단순한 ‘실수’보다 사람을 넘어뜨리게 하는 원인이라는 뜻을 드러내기 위해 「걸림돌」을 택했습니다. 복수·단수도 문맥에 따라 구분해 반영했습니다.
- source_word: ἀνάγκη ... ἐλθεῖν
  english_pob_choice: it is necessary that ... come
  chosen_korean: 반드시 오게 되어 있지만
  alternatives_korean:
  - 반드시 와야 하지만
  - 오지 않을 수 없지만
  lexicon: BDAG
  rationale: 그리스어의 필연성을 한국어로 자연스럽게 옮기되, 그 필연의 근거를 구체화하지 않도록 표현했습니다. ‘오게 되어 있다’는 운명론적 단정과 문맥상 필연성을 함께 전달합니다.
- source_word: ἀνθρώπῳ δι’ οὗ
  english_pob_choice: the man through whom
  chosen_korean: 그 걸림돌이 오는 그 사람에게
  alternatives_korean:
  - 그 사람을 통해
  - 그 사람으로 말미암아
  lexicon: BDAG
  rationale: 직역적인 「그 사람을 통해」보다 한국어에서 책임 귀속이 분명한 구조로 다듬었습니다. 원문의 남성 단수 형식을 해치지 않으면서 대표적 의미를 유지합니다.
theological_decisions:
- issue: 걸림돌의 발생에 대한 필연성
  chosen_reading: 걸림돌들이 ‘반드시 오게 되어 있지만’이라고 번역해, 원문이 말하는 필연성은 살리되 그 근거를 하나님께 직접 귀속시키지는 않았습니다.
  alternative_readings:
  - ‘반드시 와야 합니다’처럼 더 강하게 필연을 표현하는 읽기
  - ‘어쩔 수 없이 생깁니다’처럼 약화하는 읽기
  rationale: 원문은 필요/필연을 말하지만 그 근거를 설명하지 않습니다. 번역에서도 그 긴장을 보존해, 신적 섭리나 인과를 성급히 확정하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: ἀνθρώπῳ의 대표성
  chosen_reading: 주요 본문은 「그 사람」을 유지해 남성 단수 형식을 살리고, 문맥상 누구에게나 적용되는 경고임을 한국어 표현 자체로 드러냈습니다.
  alternative_readings:
  - ‘사람’
  - ‘누구든지’
  rationale: 원문은 문법적으로 남성 단수이며, 이를 평준화하지 않고 보존하는 것이 소스 충실도에 더 가깝습니다. 한국어 문장 안에서는 대표적 일반성을 충분히 전달할 수 있습니다.
  doctrine_reference: 'Translation philosophy §4: Gender-accurate over gender-neutral.'
