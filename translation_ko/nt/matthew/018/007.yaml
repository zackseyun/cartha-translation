  source_fidelity: 원문에는 첫 번째 ‘화’의 근거를 설명하는 γάρ(‘왜냐하면/이는’)와 ἀνάγκη(필연)가 명시되어 있습니다. 초안은 필연성은 반영했으나 γάρ의 설명 관계가 문장상 충분히 드러나지 않습니다. 또한 ‘그 걸림돌이 오는 그 사람’은 δι’ οὗ(‘그를 통하여’)의 매개·책임 관계를 자연스럽게 드러내지 못합니다.
  naturalness: ‘걸림돌 때문에 세상에 화가 있습니다’와 ‘화가 있습니다’의 합쇼체는 현대 표준어로 자연스럽습니다. 다만 마지막 구절은 ‘그를 통하여’로 옮기면 원문 의미와 한국어 문장 흐름이 모두 개선됩니다.
  terminology: ‘화’, ‘세상’, ‘걸림돌’은 각각 οὐαί, κόσμος, σκάνδαλον의 의미와 예언적 경고의 어조를 적절히 보존합니다. ‘필연입니다’는 필요성의 근거를 신학적으로 특정하지 않습니다. 남성 단수 ἀνθρώπῳ는 본문에서 ‘그 사람’으로 유지하고 각주로 대표적 적용을 설명하는 것이 적절합니다.
