id: MAT.18.1
reference: Matthew 18:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: ko
  text: 그때 제자들이 예수께 나아와 말했습니다. “그러면 누가 하늘 나라에서 더 큽니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  english_pob_choice: At that time
  chosen_korean: 그때
  alternatives_korean:
  - 그 시각에
  - 그때 그 시간에
  lexicon: ἐκείνῃ τῇ ὥρᾳ
  rationale: 시간 부사를 자연스럽고 간결하게 옮기되, 특별한 신학적 강조를 과장하지 않도록 ‘그때’로 처리했습니다.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  english_pob_choice: the disciples came to Jesus
  chosen_korean: 제자들이 예수께 나아와
  alternatives_korean:
  - 제자들이 예수께 왔습니다
  - 제자들이 예수님께 다가와
  lexicon: προσέρχομαι + dative
  rationale: 단순한 ‘오다’보다 예수께 접근하는 동작을 드러내는 ‘나아와’를 택해 동사의 방향성을 살렸습니다.
- source_word: μείζων
  english_pob_choice: greater
  chosen_korean: 더 큽니까
  alternatives_korean:
  - 더 위대합니까
  - 더 큰 사람입니까
  - 가장 큽니까
  lexicon: μείζων
  rationale: POB의 ‘greater’를 반영하되, 비교급의 핵심 의미를 한국어에서 자연스럽게 드러내기 위해 ‘더 큽니까’로 옮겼습니다.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  english_pob_choice: in the kingdom of heaven
  chosen_korean: 하늘 나라에서
  alternatives_korean:
  - 하늘 나라 안에서
  - 하늘 나라 가운데서
  - 천국에서
  lexicon: βασιλεία τῶν οὐρανῶν
  rationale: 마태복음의 고유 표현을 기존 관용을 살리면서도, 본문의 ‘왕국/통치 영역’ 감각을 해치지 않도록 ‘하늘 나라’로 번역했습니다.
theological_decisions:
- issue: 제자들의 질문이 비교급 ‘greater’인지 최상급 ‘greatest’인지
  chosen_reading: ‘더 큽니까’로 비교급을 유지했습니다.
  alternative_readings:
  - 가장 큽니까
  - 누가 가장 위대합니까
  rationale: 영문 POB의 최종 확정본이 ‘greater’로 되돌아갔고, 헬라어 μορφή도 비교급 μᾶλλον이 아니라 μᾶλλον...가 아닌 μείζων이어서 최상급 의미를 부풀리지 않았습니다.
  doctrine_reference: 본문 의미 보존과 번역 정확성
