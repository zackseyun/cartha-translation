  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸀προσκαλεσάμενος παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/002.yaml
  text: And calling a child to himself, he stood him in their midst.
translation:
  language: ko
  text: 그리고 어린아이 하나를 자기에게 불러 가까이 세우시고, 그들을 가운데에 두셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  english_pob_choice: calling ... to himself
  chosen_korean: 자기에게 불러 가까이
  alternatives_korean:
  - 자기 곁으로 부르시고
  - 자기에게 불러오시고
  lexicon: προσκαλέομαι
  rationale: 단순한 ‘부르다’보다 ‘자기에게’라는 방향성을 살려, 예수께서 아이를 직접 자기 곁으로 오게 하신 동작을 드러냈습니다.
- source_word: παιδίον
  english_pob_choice: a child
  chosen_korean: 어린아이 하나
  alternatives_korean:
  - 아이 하나
  - 작은 아이 하나
  lexicon: παιδίον
  rationale: 문맥상 성인과 대비되는 ‘어린아이’를 분명히 하되, 수량 감각을 자연스럽게 살리기 위해 ‘하나’를 보탰습니다.
- source_word: ἔστησεν
  english_pob_choice: he stood him
  chosen_korean: 세우시고
  alternatives_korean:
  - 서 있게 하시고
  - 가운데 세우시고
  lexicon: ἵστημι
  rationale: 영어 POB의 ‘stood’를 따라, 아이를 ‘서게 하다/세우다’는 의미를 간결하게 반영했습니다. 한국어에서는 목적어 ‘그’를 반복하지 않고 자연스럽게 처리했습니다.
- source_word: ἐν μέσῳ αὐτῶν
  english_pob_choice: in their midst
  chosen_korean: 그들을 가운데에
  alternatives_korean:
  - 그들 한가운데
  - 그들 가운데
  lexicon: μέσος
  rationale: ‘한가운데’의 공간적 중심을 살리면서도 한국어 어순에 맞게 배치했습니다.
theological_decisions:
- issue: 예수의 행위 묘사에서 동작의 연속성 표현
  chosen_reading: ‘불러 가까이 세우시고’로 연속 동작을 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘불러서 가운데 세우시고’
  - ‘불러 자기 곁에 세우시고’
  rationale: 헬라어 분사와 본동사의 연속을 한국어 연결 어미로 드러내되, 서술의 리듬을 해치지 않도록 했습니다.
  doctrine_reference: 본문 서술의 사건 진행
