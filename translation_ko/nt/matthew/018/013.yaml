id: MAT.18.13
reference: Matthew 18:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
  footnotes:
  - marker: a
    text: Or, more formally, 'if it should happen that he finds it.'
    reason: lexical_alternative
  - marker: b
    text: Or 'that did not wander off.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 그가 그 양을 찾게 되면[a], 진실로 여러분에게 말합니다. 그는 길을 잃지 않은 아흔아홉 마리보다 그 양을 더 기뻐합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찾게 되면’은 ἐὰν γένηται εὑρεῖν의 조건적 발생을 반영합니다. 더 직역하면 ‘그가 그것을 찾는 일이 있게 되면’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘길을 잃지 않은’은 μὴ πεπλανημένοις를 옮긴 표현입니다. 더 문자적으로는 ‘헤매지 않은’ 또는 ‘길을 벗어나지 않은’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  english_pob_choice: if he happens to find it
  chosen_korean: 만일 그가 그것을 찾아내면
  alternatives_korean:
  - 만일 그가 그것을 찾게 되면
  - 그가 그것을 찾으면
  lexicon: BDAG
  rationale: ἐὰν + γένηται + 부정사 구조의 우연·성립 뉘앙스를 한국어의 ‘찾아내면’으로 자연스럽게 살렸습니다. ‘찾으면’은 너무 평면적일 수 있어 약간의 발생 가능성을 드러냅니다.
- source_word: ἀμὴν λέγω ὑμῖν
  english_pob_choice: truly I tell you
  chosen_korean: 진실로 내가 여러분에게 말합니다
  alternatives_korean:
  - 진실로 내가 여러분에게 이릅니다
  - 아멘, 내가 여러분에게 말합니다
  lexicon: BDAG
  rationale: 예수의 엄숙한 서두를 현대 한국어로 분명하게 옮기되, 교회적 상투어보다 직접적이고 공적 화법에 가까운 ‘진실로…말합니다’를 택했습니다.
- source_word: χαίρει ἐπ’ αὐτῷ
  english_pob_choice: he rejoices over it
  chosen_korean: 그것을 더 기뻐합니다
  alternatives_korean:
  - 그것을 기뻐합니다
  - 그것으로 인해 기뻐합니다
  lexicon: BDAG
  rationale: ἐπί+여격의 대상성은 한국어에서 ‘-을/를 더 기뻐합니다’로 충분히 드러납니다. 영어의 ‘over it’에 매이지 않고, 기쁨의 강도를 자연스럽게 살렸습니다.
- source_word: μᾶλλον ἢ
  english_pob_choice: more than
  chosen_korean: …보다 더
  alternatives_korean:
  - …보다
  - 차라리…보다
  lexicon: BDAG
  rationale: 명시적 비교 구조를 그대로 반영해, 찾은 한 마리에 대한 기쁨이 아흔아홉보다 큼을 직접 드러냈습니다.
- source_word: τοῖς μὴ πεπλανημένοις
  english_pob_choice: that have not gone astray
  chosen_korean: 길 잃지 않은
  alternatives_korean:
  - 떠나지 않은
  - 헤매지 않은
  lexicon: BDAG
  rationale: 완료 분사 πεπλανημένοις의 결과 상태를 한국어 형용사구로 압축해, 양 떼 이미지에 맞는 ‘길 잃지 않은’으로 옮겼습니다.
theological_decisions:
- issue: 비교문이 암시하는 가치의 긴장
  chosen_reading: 목자는 돌아온 한 마리에 더 크게 기뻐하지만, 이것이 아흔아홉의 가치나 돌봄의 부재를 뜻한다고 풀어 쓰지 않았습니다.
  alternative_readings:
  - 아흔아홉은 상대적으로 덜 중요하다는 뜻으로 완화해 번역
  - 비유적 과장으로 보고 비교를 약화시켜 번역
  rationale: 헬라어 μᾶλλον ἢ의 실제 비교를 보존해, 본문이 유지하는 긴장을 해설로 해소하지 않았습니다.
  doctrine_reference: 본문의 비교를 직접 보존하여 신학적 긴장을 유지
