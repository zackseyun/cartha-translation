  text: For the Son[a] of Man came to save the lost.
  footnotes:
  - marker: a
    text: This verse is absent from the earliest Greek manuscripts (including 4th-century Sinaiticus and Vaticanus) and early Coptic translations, but is present in the 5th-century Codex Bezae, the Byzantine majority tradition, and the Latin Vulgate. It was likely added by later scribes to harmonize with Luke 19:10.
    reason: textual_critical
translation:
  language: ko
  text: 인자께서 잃어버린 것을 구원하러 오셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 가장 초기의 그리스어 사본들(4세기의 시내 사본과 바티칸 사본 포함)과 초기 콥트어 번역본들에는 없지만, 5세기의 베자 사본, 비잔틴 다수 본문 전통, 라틴 벌게이트에는 있습니다. 아마도 누가복음 19:10과 조화를 이루도록 후대 필사자들이 덧붙인 것으로 보입니다.
    reason: textual_critical
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인간의 아들
  lexicon: project default / established biblical usage
  rationale: 마태복음의 표준 종말론적 칭호로서, POB의 원문 지향을 따라 ‘인자’로 옮기는 것이 가장 직접적입니다.
- source_word: σῶσαι
  english_pob_choice: to save
  chosen_korean: 구원하러
  alternatives_korean:
  - 구해
  - 구출하러
  lexicon: BDAG
  rationale: 본문의 목적 부정사로서 ‘구원하다’가 soteriological한 뜻을 가장 분명하게 드러내므로 ‘구원하러’로 옮겼습니다.
- source_word: τὸ ἀπολωλός
  english_pob_choice: the lost
  chosen_korean: 잃은 것
  alternatives_korean:
  - 잃어버린 자
  - 잃은 사람들
  - 잃은 이들
  lexicon: BDAG
  rationale: 중성 단수 분사로서 집합적·실체화된 대상을 가리키므로, 문자적으로는 ‘잃은 것’이 원문 구조를 가장 잘 살리지만 한국어 자연성을 위해 간결하게 유지했습니다.
theological_decisions:
- issue: 이 절의 본문 포함 여부
  chosen_reading: 비잔틴 계열 본문에 있는 절로서 본문 번역은 유지하되, 본문비평상 이 절이 초기 사본들에는 없었다는 사실은 각주로 표시하는 방식이 적절합니다.
  alternative_readings:
  - 초기 사본을 따라 본문에서 제외
  - 본문은 두되 각주로만 처리
  rationale: 원문 전승과 POB의 감사 가능성을 함께 보존해야 하므로, 번역 본문은 제공된 원문을 따르고 텍스트 변이 사실은 별도 각주로 남깁니다.
  doctrine_reference: 본문비평 / 사본전승
- issue: ‘잃은 것’의 신학적 뉘앙스
  chosen_reading: 개인만이 아니라 하나님에게서 떨어져 파괴된 상태를 포괄하는 집합적 표현으로 유지합니다.
  alternative_readings:
  - 잃어버린 사람들
  - 멸망한 것
  rationale: 영어 POB의 ‘the lost’처럼 상태와 대상을 함께 드러내는 표현이 원문의 중성 분사 기능을 가장 잘 반영합니다.
  doctrine_reference: 구원론
