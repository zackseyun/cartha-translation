  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow slave[a], as I also had mercy on you?
  footnotes:
  - marker: a
    text: Or 'your fellow servant' or 'your fellow bondservant.' The Greek σύνδουλος refers to one who shares the same master; 'fellow slave' is used here to preserve the bonded sense of the term in this parable.
    reason: alternative_reading
translation:
  language: ko
  text: 같은 주인에게 속한 네 동료 종을 네가 또한 불쌍히 여겨야 하지 않았겠느냐? 나도 너를 불쌍히 여겼는데.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동료 종’은 σύνδουλος의 문자적 의미를 살린 표현입니다. 전통적 번역으로는 ‘동료 종/동료 노예/동료 하인’이 가능하지만, 여기서는 같은 주인 아래 있는 공동 신분을 드러내는 데 초점을 두었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔδει
  english_pob_choice: Should you not have
  chosen_korean: ~해야 하지 않았겠느냐
  alternatives_korean:
  - ~했어야 하지 않겠느냐
  - ~할 필요가 없었겠느냐
  lexicon: BDAG
  rationale: 반문 속의 도덕적 의무와 책망의 뉘앙스를 한국어 합쇼체에서 자연스럽게 살리기 위해 ‘~해야 하지 않았겠느냐’를 택했습니다.
- source_word: σύνδουλόν σου
  english_pob_choice: your fellow slave
  chosen_korean: 네 동료 종
  alternatives_korean:
  - 네 동료 노예
  - 네 동료 종들 중 한 사람
  lexicon: BDAG
  rationale: σύνδουλος의 ‘같은 주인 아래 있는 공동 신분’을 드러내기 위해 ‘동료 종’으로 옮겼고, 본문의 종속적 관계를 너무 완화하는 ‘일꾼/종복’은 피했습니다.
- source_word: ἐλεῆσαι / ἠλέησα
  english_pob_choice: have had mercy on / had mercy on
  chosen_korean: 불쌍히 여기다
  alternatives_korean:
  - 긍휼을 베풀다
  - 자비를 베풀다
  - 용서하다
  lexicon: BDAG
  rationale: 직역적 종교 용어보다 한국어에서 즉각 이해되는 ‘불쌍히 여기다’가 ἐλεέω의 자비 행위를 더 직접적으로 전달하며, 반복되는 동사를 본문처럼 유지합니다.
- source_word: κἀγὼ
  english_pob_choice: I also
  chosen_korean: 나도
  alternatives_korean:
  - 나 역시
  - 나 또한
  lexicon: BDAG
  rationale: 앞선 ‘또한’과 대응되는 병렬성을 간결하게 살리기 위해 ‘나도’를 사용했습니다.
theological_decisions:
- issue: σύνδουλος의 종속 신분 강도
  chosen_reading: ‘동료 종’으로 옮겨 공동 신분을 살리되, 주인-종 관계의 봉합된 종속성을 약화하지 않았습니다.
  alternative_readings:
  - 동료 종으로 순화하여 번역
  - 동료 노예로 더 강하게 번역
  - 동료 시종으로 완화
  rationale: 이 비유는 왕과 빚진 자들의 권위 구조를 전제로 하므로, 관계의 윤리적 압박을 흐리지 않는 번역이 필요합니다. 다만 한국어에서 ‘노예’는 과도하게 현대적 사회사적 뉘앙스를 부를 수 있어, 본문 기능에 맞는 중간값으로 ‘종’을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested terms table for δοῦλος
