revisions:
- from: 같은 주인에게 속한 네 동료 종을 네가 또한 불쌍히 여겨야 하지 않았겠느냐? 나도 너를 불쌍히 여겼는데.[a]
  to: 당신도 당신의 동료 종에게 자비를 베풀었어야 하지 않았습니까? 내가 당신에게 자비를 베푼 것처럼 말입니다.[a]
  rationale: οὐκ ἔδει … ἐλεῆσαι의 도덕적 책망을 ‘…베풀었어야 하지 않았습니까?’로, καὶ와 κἀγώ의 대응 및 ὡς의 비교를 ‘당신도’와 ‘내가 … 것처럼’으로 반영했습니다. σύνδουλος의 핵심 의미는 ‘동료 종’으로 보존하되, 같은 주인이라는 설명은 본문 첨가가 아니라 주석으로 옮겼습니다. 반복되는 ἐλεέω는 두 번 모두 ‘자비를 베풀다’로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:37Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘같은 주인에게 속한’은 σύνδουλος가 함의하는 관계를 설명하지만, 본문에 별도 수식어로 덧붙여져 있어 번역문에서는 피하는 편이 좋습니다. 또한 ὡς κἀγὼ σὲ ἠλέησα의 비교·대응 관계가 ‘나도 너를 불쌍히 여겼는데’보다 ‘내가 당신에게 자비를 베푼 것처럼’에서 더 직접적으로 드러납니다.
  naturalness: ‘불쌍히 여기다’는 현대 한국어에서 연민이나 동정에 치우쳐 들릴 수 있습니다. 이 비유에서 빚을 탕감하는 행위와 연결된 ἐλεέω에는 ‘자비를 베풀다’가 더 정확하고 자연스럽습니다. 지정된 현대 합쇼체에 맞추어 의문 종결도 ‘않았습니까?’로 조정했습니다.
  terminology: σύνδουλος는 ‘동료 종’으로 유지할 수 있으나, 주석은 이것이 같은 주인을 섬기는 ‘동료 노예/동료 하인’이라는 대안을 정확히 밝혀야 합니다. ἐλεέω의 두 용례는 모두 ‘자비를 베풀다’로 통일했습니다.
  issues:
  - severity: medium
    issue: ‘같은 주인에게 속한’의 명시적 첨가
    rationale: σύνδουλος의 어휘적 함의를 풀어 쓴 것이지만, 헬라어 본문은 단순히 ‘당신의 동료 종’을 말합니다. 주석에서 설명하고 본문에서는 첨가를 피하는 것이 최적등가 원칙에 더 맞습니다.
  - severity: medium
    issue: ἐλεέω를 ‘불쌍히 여기다’로 번역
    rationale: 이 문맥의 자비로운 탕감 행위와 윤리적 요구를 충분히 나타내지 못하고 단순한 감정적 동정으로 좁혀질 수 있습니다. ‘자비를 베풀다’가 반복과 행위성을 보존합니다.
  - severity: low
    issue: ὡς의 비교 관계가 약화됨
    rationale: ‘나도 너를 불쌍히 여겼는데’는 비교를 배경 설명처럼 처리합니다. ‘내가 당신에게 자비를 베푼 것처럼’은 원문의 대응 구조를 명시합니다.
  - severity: low
    issue: 지정된 합쇼체와 종결 방식의 불일치
    rationale: 초안의 ‘않았겠느냐?’는 문어적 해라체 계열입니다. 요청된 현대 공식·공손 문체에는 ‘않았습니까?’가 적합합니다.
