  source_fidelity: 주요 동사 παρέδωκεν은 ‘넘겨주었다’로 적절히 반영되었고, κύριος를 비유 안의 인간 ‘주인’으로 옮긴 것도 문맥에 충실합니다. 그러나 ‘모든 빚진 것을 다 갚을 때까지 있게 하였습니다’는 원문에 없는 ‘있게 하다’를 보태며, ‘~때까지’가 ‘넘겨주었다’에 걸리는 원문의 구조를 불분명하게 합니다.
  naturalness: ‘그를 고문하는 자들에게 넘겨 주어, ... 때까지 있게 하였습니다’는 현대 한국어 문장으로도 어색합니다. 시간절의 주어를 밝혀 ‘그가 빚진 모든 것을 다 갚을 때까지 그를 … 넘겨주었습니다’로 쓰면 자연스럽고 정확합니다.
  terminology: ‘주인’은 κύριος의 비유적 용법에 알맞습니다. βασανισταῖς는 ‘고문하는 자들’로 그 강한 형벌적 의미를 보존합니다. πᾶν τὸ ὀφειλόμενον은 ‘빚진 모든 것’이 더 자연스럽고, 원문의 포괄적 표현도 유지합니다.
