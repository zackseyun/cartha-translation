id: MAT.18.34
reference: Matthew 18:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
  footnotes:
  - marker: a
    text: 'Or ''Lord'': the Greek word is kyrios. Here it refers to the servant''s master within the parable, so ''master'' is used in the main text.'
    reason: alternative_reading
  - marker: b
    text: Or 'tormentors' or, less strongly, 'jailers.' The Greek term refers to those who inflict torment, not merely ordinary guards.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 주인이 화가 나서 그를 고문하는 자들에게 넘겨 주어, 모든 빚진 것을 다 갚을 때까지 있게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주인’은 여기서 비유 속 종의 인간 상관을 가리키므로, κύριος를 일반적인 ‘주님’ 대신 이렇게 옮겼습니다.
    reason: previous_rendering
  - marker: b
    text: ‘고문하는 자들’은 βασανισταῖς의 강한 의미를 살린 번역으로, 단순한 간수보다 더 강한 형벌적 뉘앙스를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  english_pob_choice: in anger
  chosen_korean: 화가 나서
  alternatives_korean:
  - 분노하여
  - 성내어
  - 노하여
  lexicon: BDAG
  rationale: 분사구문이 앞선 원인·상태를 나타내므로, 자연스러운 합쇼체 서술로 ‘화가 나서’가 가장 간결하게 감정의 원인과 다음 동작을 연결합니다.
- source_word: κύριος
  english_pob_choice: master
  chosen_korean: 주인
  alternatives_korean:
  - 주
  - 주님
  lexicon: BDAG
  rationale: 비유 안에서 종의 인간 상관을 가리키므로, 예수에 대한 호칭으로 오해되지 않도록 ‘주인’으로 옮겼습니다.
- source_word: βασανισταῖς
  english_pob_choice: the torturers
  chosen_korean: 고문하는 자들
  alternatives_korean:
  - 고문자들
  - 괴롭히는 자들
  - 간수들
  lexicon: BDAG
  rationale: 단순한 감옥 관리가 아니라 고통을 가하는 사람들을 뜻하므로, 한국어에서도 폭력성과 형벌성을 분명히 드러내는 표현을 택했습니다.
- source_word: πᾶν τὸ ὀφειλόμενον
  english_pob_choice: all that was owed
  chosen_korean: 모든 빚진 것
  alternatives_korean:
  - 모든 빚
  - 빚진 모든 것
  - 다 갚아야 할 모든 것
  lexicon: BDAG
  rationale: 본문은 단순히 ‘부채’라는 명사보다 ‘빚져 있는 것’이라는 상태를 말하므로, 명사화보다 상태를 살린 표현으로 옮겼습니다.
theological_decisions:
- issue: κύριος를 비유적 인간 상관으로 처리할지, 기본 경배 호칭으로 처리할지
  chosen_reading: 주인
  alternative_readings:
  - 주님
  - 주
  rationale: 이 장면은 비유의 서사 안에서 종의 상관을 가리키며, 기독론적 호칭으로 읽도록 미리 확정하지 않는 것이 원문 맥락에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: 컨텍스트 우선 원칙, contested terms (κύριος)'
