  - 다 갚아야 할 모든 것
  lexicon: BDAG
  rationale: 본문은 단순히 ‘부채’라는 명사보다 ‘빚져 있는 것’이라는 상태를 말하므로, 명사화보다 상태를 살린 표현으로 옮겼습니다.
