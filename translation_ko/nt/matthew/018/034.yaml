  rationale: 단순한 감옥 관리가 아니라 고통을 가하는 사람들을 뜻하므로, 한국어에서도 폭력성과 형벌성을 분명히 드러내는 표현을 택했습니다.
- source_word: πᾶν τὸ ὀφειλόμενον
  english_pob_choice: all that was owed
  chosen_korean: 모든 빚진 것
  alternatives_korean:
