source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
  footnotes:
  - marker: a
    text: 'Or ''Lord'': the Greek word is kyrios. Here it refers to the servant''s master within the parable, so ''master'' is used in the main text.'
    reason: alternative_reading
  - marker: b
    text: Or 'tormentors' or, less strongly, 'jailers.' The Greek term refers to those who inflict torment, not merely ordinary guards.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 주인이 화가 나서, 그가 빚진 모든 것을 다 갚을 때까지 그를 고문하는 자들에게 넘겨주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주인’은 여기서 비유 속 종의 인간 상관을 가리키므로, κύριος를 일반적인 ‘주님’ 대신 이렇게 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘고문하는 자들’은 βασανισταῖς의 강한 의미를 살린 번역으로, 단순한 간수보다 더 강한 형벌적 뉘앙스를 반영합니다.
    reason: lexical_alternative
