    rationale: ‘즉, 그는 빚을 갚을 수 없었습니다’는 본문의 ‘갚을 길이 없자’를 단순 반복합니다. 원문상 별도 주석이 필수적이지 않으므로 삭제하는 편이 낫습니다.
