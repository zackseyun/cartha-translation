review_pass:
  verdict: revise
  source_fidelity: 원문의 핵심 구조는 빚을 갚지 못함, 주인의 명령, 그 사람·아내·자녀·소유물의 매각, 그리고 변제가 이루어짐입니다. 초안의 ‘그를 팔아 … 함께 팔아 넘기고’는 πραθῆναι(‘팔리다’)의 수동성을 능동 처분으로 바꾸고, 사람과 재산을 각각 두 차례 ‘팔다’고 표현하여 원문의 한 매각 명령 구조를 다소 흐립니다.
  naturalness: ‘갚을 길이 없자’와 ‘주인’은 현대 표준 한국어 합쇼체 문맥에 자연스럽습니다. 다만 ‘그를 팔아 그의 아내와 자녀들과 그가 가진 모든 것을 함께 팔아 넘기고’는 병렬 관계가 어색하고 중복됩니다. ‘그와 그의 아내와 자녀들과 그가 가진 모든 것을 팔아’가 더 자연스럽고 명료합니다.
  terminology: κύριος를 비유 속 인간 상전이라는 문맥에 따라 ‘주인’으로 옮긴 것은 적절합니다. ‘빚을 갚게 하다’는 ἀποδοθῆναι의 수동 표현을 한국어에서 자연스럽게 풀어 내며, 문맥상 암시된 채무를 과도하게 확정하지 않습니다.
  issues:
  - severity: medium
    issue: 매각 명령의 구조와 태가 흐려짐
    rationale: πραθῆναι는 ‘그가 팔리다’이며, 뒤의 아내·자녀·소유물은 그와 함께 매각될 항목으로 열거됩니다. 초안은 ‘그를 팔아’와 ‘모든 것을 함께 팔아 넘기고’로 나누어 원문의 단일 병렬 구조를 중복·변형합니다.
  - severity: low
