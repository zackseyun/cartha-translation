revisions:
- from: 그런데 갚을 길이 없자, 주인이 그를 팔아 그의 아내와 자녀들과 그가 가진 모든 것을 함께 팔아 넘기고, 갚게 하라고 명했습니다.[a][b]
  to: 그런데 그가 갚을 길이 없자, 주인은 그와 그의 아내와 자녀들과 그가 가진 모든 것을 팔아 빚을 갚게 하라고 명했습니다.[a]
  rationale: 수동 부정사 πραθῆναι와 그 뒤를 잇는 병렬 열거를 한국어의 단일 매각 명령으로 재구성했습니다. ‘주인’은 비유 안의 인간 상전을 가리키는 κύριος에 알맞습니다. 중복적인 각주를 제거하고, 남은 문화적 각주는 당시의 매각·처분이 변제를 위한 명령이라는 문맥만 설명하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
