id: MAT.18.25
reference: Matthew 18:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
  footnotes:
  - marker: a
    text: Or 'the master.' Greek κύριος can mean 'lord' or 'master' depending on context; here it refers to the servant’s human superior in the parable.
    reason: lexical_alternative
  - marker: b
    text: That is, he and his family were to be sold and his possessions liquidated in order to make repayment.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 그가 갚을 길이 없자, 주인은 그와 그의 아내와 자녀들과 그가 가진 모든 것을 팔아 빚을 갚게 하라고 명했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 그와 그의 가족이 팔리고 그의 소유물이 처분되어 빚을 갚도록 하려는 명령입니다.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  english_pob_choice: But since he was unable to repay
  chosen_korean: 그런데 갚을 길이 없자
  alternatives_korean:
  - 그런데 갚지 못하자
  - 그런데 갚을 것이 없자
  lexicon: BDAG
  rationale: 부정 분사구문은 원인/상황을 나타내므로 한국어에서는 자연스럽게 '갚을 길이 없자'로 옮겨, 단순 능력 부족이 아니라 상환 불가능한 처지를 드러냈습니다.
- source_word: ἐκέλευσεν
  english_pob_choice: ordered
  chosen_korean: 명했습니다
  alternatives_korean:
  - 명령했습니다
  - 지시했습니다
  lexicon: BDAG
  rationale: κελεύω의 권위 있는 명령을 현대 합쇼체에서 자연스럽게 살리되, 지나치게 군사적 울림이 강한 '명령했습니다'보다 서술 문맥에 맞는 '명했습니다'를 택했습니다.
- source_word: πραθῆναι
  english_pob_choice: that he be sold
  chosen_korean: 그를 팔아
  alternatives_korean:
  - 그가 팔리게
  - 그를 노예로 팔아
  lexicon: BDAG
  rationale: 동사의 수동적 의미를 한국어 사역·결과 표현으로 풀어, 단순 매매가 아니라 사람을 처분하는 장면임을 유지했습니다. 이 절에서는 구체적 노예 용어를 추가하지 않고 원문에 있는 일반적 '팔리다'를 따랐습니다.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ἔχει
  english_pob_choice: along with his wife and children and all that he had
  chosen_korean: 그의 아내와 자녀들과 그가 가진 모든 것을 함께
  alternatives_korean:
  - 아내와 자녀들과 소유한 모든 것과 함께
  - 아내와 자녀들과 그의 모든 소유와 함께
  lexicon: BDAG
  rationale: 열거 구조를 그대로 살려 가족과 소유물이 함께 처분 대상이 됨을 분명히 했고, '그가 가진 모든 것'으로 원문의 포괄성을 유지했습니다.
- source_word: ἀποδοθῆναι
  english_pob_choice: that payment be made
  chosen_korean: 갚게 하라고
  alternatives_korean:
  - 상환되게 하라고
  - 빚을 갚게 하라고
  lexicon: BDAG
  rationale: 마지막 목적절은 앞의 빚 상환 문맥을 받아 한국어에서 가장 자연스러운 '갚게 하다'로 옮겼습니다.
theological_decisions:
- issue: 'κύριος의 번역: human superior in the parable'
  chosen_reading: 주인
  alternative_readings:
  - 주
  - 주님
  - 선생
  rationale: 이 절의 κύριος는 비유 속 인간 고용주를 가리키므로, 신적 칭호를 피하면서도 한국어 서사에서 즉각 이해되는 '주인'으로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: context-sensitive κύριος rendering; preserve human referent in parable setting.'
