revisions:
- from: 이와 같이, 하늘에 계신 여러분의 아버지 앞에서는 이 작은 자들 가운데 하나도 망하는 것이 아버지의 뜻이 아닙니다.[a]
  to: 그와 같이, 하늘에 계신 여러분의 아버지께서는 이 작은 이들 가운데 하나라도 망하는 것을 원하지 않으십니다.[a]
  rationale: The revision renders the Greek idiom concerning the Father’s will in natural modern Korean rather than preserving ἔμπροσθεν as a misleading literal locative. It retains the plural ‘여러분의,’ the unspecified referent of ‘작은 이들,’ and the singular-inclusive emphasis ‘하나라도.’ The footnote preserves the viable lost-sheep-context reading with grammatically correct Korean.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:30:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly connects the verse with the preceding illustration and preserves the inclusive force of ἓν with ‘하나도.’ However, ‘아버지 앞에서는 … 아버지의 뜻이 아닙니다’ treats ἔμπροσθεν too mechanically and produces an unnatural Korean construction. In this idiom, the sense is the Father’s will, not an action occurring ‘before’ him.
  naturalness: A finite verbal rendering of God’s will is natural in modern formal-polite Korean. ‘하늘에 계신 여러분의 아버지께서는 … 원하지 않으십니다’ clearly communicates the source while avoiding repetition and the syntactic awkwardness of the draft.
  terminology: ‘작은 이들’ retains μικρῶν without specifying children. ‘망하다’ suitably represents the serious sense of ἀπόληται. The alternative must not use ‘잃어버리다’ with the little ones as its active subject, since that Korean wording means that they lose something; ‘길을 잃다’ conveys the contextual alternative of being lost.
  issues:
  - severity: medium
    issue: ‘하늘에 계신 여러분의 아버지 앞에서는 … 아버지의 뜻이 아닙니다’ is syntactically and idiomatically awkward.
    rationale: Although ἔμπροσθεν literally means ‘before,’ the whole Greek expression οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρός is an idiom for what is not the Father’s will. Korean ‘앞에서는’ makes it sound like a setting or viewpoint and leaves an unnatural duplicated noun phrase.
  - severity: medium
    issue: The footnote alternative ‘하나도 잃어버리는 것이’ reverses the required semantic direction in Korean.
    rationale: With ‘이 작은 자들’ as subject, 잃어버리다 normally means ‘to lose [something],’ rather than ‘to be/become lost.’ The alternative should express the little ones’ being lost, while retaining the contextual nuance.
  revised_text: 그와 같이, 하늘에 계신 여러분의 아버지께서는 이 작은 이들 가운데 하나라도 망하는 것을 원하지 않으십니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘이 작은 이들 가운데 하나라도 길을 잃는 것을’입니다. 이 그리스어 동사는 여기서 ‘망하다’ 또는 ‘잃어버린 자가 되다’를 뜻할 수 있으며, 바로 앞의 잃은 양 비유는 후자의 뉘앙스를 뒷받침합니다.
    reason: alternative_reading
  revision_rationale: The revision renders the Greek idiom concerning the Father’s will in natural modern Korean rather than preserving ἔμπροσθεν as a misleading literal locative. It retains the plural ‘여러분의,’ the unspecified referent of ‘작은 이들,’ and the singular-inclusive emphasis ‘하나라도.’ The footnote preserves the viable lost-sheep-context reading with grammatically correct Korean.
