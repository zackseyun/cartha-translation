id: MAT.18.14
reference: Matthew 18:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
  footnotes:
  - marker: a
    text: Or, 'that even one of these little ones should be lost.' The Greek verb can mean either 'perish' or 'be lost'; the immediate context of the lost sheep supports the latter nuance.
    reason: alternative_reading
translation:
  language: ko
  text: 이와 같이, 하늘에 계신 여러분의 아버지 앞에서는 이 작은 자들 가운데 하나도 망하는 것이 아버지의 뜻이 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 작은 자들 가운데 하나도 잃어버리는 것이’입니다. 이 동사는 여기서 ‘망하다’와 ‘잃어버리다’ 둘 다를 뜻할 수 있으며, 바로 앞의 잃은 양 비유는 후자의 뉘앙스를 뒷받침합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  english_pob_choice: In the same way
  chosen_korean: 이와 같이
  alternatives_korean:
  - 그러므로
  - 그와 같이
  lexicon: BDAG
  rationale: 앞선 비유와의 연결을 자연스럽게 살리면서도 비교 관계를 분명히 드러내는 표현입니다.
- source_word: ἔμπροσθεν
  english_pob_choice: before
  chosen_korean: 앞에서는
  alternatives_korean:
  - 앞에선
  - 면전에서는
  lexicon: BDAG
  rationale: 문맥상 ‘아버지 앞에서/면전에서’라는 위치·관계적 의미를 살려 직역에 가깝게 옮겼습니다.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  english_pob_choice: your Father in heaven
  chosen_korean: 하늘에 계신 여러분의 아버지
  alternatives_korean:
  - 하늘에 계신 아버지
  - 여러분의 하늘 아버지
  lexicon: BDAG
  rationale: 복수 2인칭 소유와 ‘하늘에 계신’의 locative 의미를 살리면서 현대 한국어로 자연스럽게 다듬었습니다.
- source_word: ἵνα ἀπόληται
  english_pob_choice: that ... should perish
  chosen_korean: 망하는 것이
  alternatives_korean:
  - 잃어버리는 것이
  - 멸망하는 것이
  lexicon: BDAG
  rationale: 본문의 엄중한 결과를 드러내는 기본 의미를 취하되, 잃어버림의 뉘앙스는 본문 각주로 보존했습니다.
theological_decisions:
- issue: ἀπόληται의 의미 범위—‘망하다’와 ‘잃어버리다’의 긴장
  chosen_reading: 주된 본문은 ‘망하다’로 두고, 문맥상 ‘잃어버리다’ 가능성은 각주로 남깁니다.
  alternative_readings:
  - 잃어버리는 것이
  - 멸망하는 것이
  rationale: 잃은 양 비유와의 연결은 ‘잃어버리다’ 뉘앙스를 지지하지만, 아버지의 뜻 진술로서는 심각한 상실/파멸의 의미도 살아 있어야 하므로 한쪽으로 평면화하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
