id: MAT.18.5
reference: Matthew 18:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
  footnotes:
  - marker: a
    text: Or 'welcomes.' The Greek verb can mean 'receive,' 'welcome,' or 'accept.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'one such child'; the Greek does not include the adjective 'little' in this verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 누구든지 내 이름으로 이런 어린아이 하나를 받아들이는 사람은 나를 받아들이는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맞아들이다’로 옮길 수 있습니다. 헬라어 동사는 ‘받다’, ‘맞아들이다’, ‘영접하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이런 어린아이 하나’입니다. 이 절에는 ‘작은’에 해당하는 형용사가 들어 있지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  english_pob_choice: whoever
  chosen_korean: 누구든지
  alternatives_korean:
  - 만일 누구나
  - 누구든
  lexicon: BDAG
  rationale: ἐὰν과 결합한 관계대명사는 일반적·포괄적 조건을 이루므로, 한국어에서는 자연스러운 총칭 표현인 ‘누구든지’가 그 힘을 잘 살립니다.
- source_word: δέξηται / δέχεται
  english_pob_choice: receives / receives
  chosen_korean: 받아들이는
  alternatives_korean:
  - 맞아들이는
  - 영접하는
  - 받는
  lexicon: BDAG
  rationale: δέχομαι는 ‘받다/맞아들이다/영접하다’의 범위를 가지며, 두 절의 동일 동사를 한국어에서도 반복해 연결성을 드러내기 위해 ‘받아들이다’를 택했습니다.
- source_word: ἓν παιδίον τοιοῦτο
  english_pob_choice: one such child
  chosen_korean: 이런 어린아이 하나
  alternatives_korean:
  - 그런 아이 하나
  - 이와 같은 아이 하나
  lexicon: BDAG
  rationale: 원문에는 ‘작은’에 해당하는 형용사가 없으므로 이를 보태지 않고, τοιοῦτο의 지시적 뉘앙스를 ‘이런’으로 옮겼습니다. παιδίον은 여기서 ‘어린아이’가 가장 자연스럽습니다.
- source_word: ἐπὶ τῷ ὀνόματί μου
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름 안에서
  - 내 이름을 따라
  lexicon: BDAG
  rationale: 전치사구는 예수의 이름에 대한 근거·권위·연관을 함께 담으므로, 한국어 관용에 맞으면서도 의미 범위를 과도하게 좁히지 않는 ‘내 이름으로’를 택했습니다.
theological_decisions:
- issue: 어린아이를 받아들이는 것과 예수를 받아들이는 것의 직접적 동일시
  chosen_reading: 어린아이 하나를 ‘받아들이는’ 행위가 예수를 ‘받아들이는’ 것과 같은 것으로 제시됩니다.
  alternative_readings:
  - 그저 예수를 공경하는 간접적 행위로 완화할 수 있습니다.
  rationale: 두 절에서 같은 동사 δέχομαι가 대응되므로, 본문의 대표적 동일시를 약화하지 않고 그대로 드러내는 것이 source-direct합니다.
  doctrine_reference: 본문의 수사적·신학적 긴장을 유지합니다.
