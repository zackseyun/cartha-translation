source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his slaves[a][b].
  footnotes:
  - marker: a
    text: Or 'servants' or 'bondservants'; Greek 'slaves' (δοῦλοι), emphasizing their bonded status under the king.
    reason: alternative_reading
  - marker: b
    text: Greek 'was likened to' or 'was compared to.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 하늘 나라는 자기 노예들[a]과 결산하려 했던 왕에 비유되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종들’ 또는 ‘하인들’. 그리스어 δούλων은 ‘노예들’을 뜻하며, 여기서는 왕에게 예속된 신분을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어로는 ‘비유되었다’ 또는 ‘비교되었다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  english_pob_choice: For this reason
  chosen_korean: 그러므로
  alternatives_korean:
