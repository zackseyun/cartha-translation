  - 하인
  lexicon: BDAG
  rationale: 이 문맥에서 종들은 왕에게 예속된 신분이지만, 마태복음의 한국어 합쇼체에서는 ‘노예’보다 ‘종’이 문체상 자연스럽고, 본문의 경제적 결산 맥락이 그 예속성을 이미 드러냅니다.
- source_word: συνᾶραι λόγον
