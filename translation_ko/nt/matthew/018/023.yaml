id: MAT.18.23
reference: Matthew 18:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his slaves[a][b].
  footnotes:
  - marker: a
    text: Or 'servants' or 'bondservants'; Greek 'slaves' (δοῦλοι), emphasizing their bonded status under the king.
    reason: alternative_reading
  - marker: b
    text: Greek 'was likened to' or 'was compared to.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 하늘 나라는 자기 종들과 결산하려는 왕에 비유됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘종들’ 혹은 ‘노예들’. 여기서는 왕 아래에 예속된 신분을 드러내기 위해 δοῦλους의 의미를 반영했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘비유되었다/비교되었다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  english_pob_choice: For this reason
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 이러므로
  lexicon: BDAG
  rationale: 앞선 문맥과 연결되는 추론적 접속을 자연스러운 현대 한국어로 살렸습니다.
- source_word: ὡμοιώθη
  english_pob_choice: has become like
  chosen_korean: 비유됩니다
  alternatives_korean:
  - ~와 같아졌습니다
  - 비슷하게 되었습니다
  lexicon: BDAG
  rationale: 수동형의 ‘비유되다/비유하다’ 의미를 반영하면서 마태복음의 비유 도입을 한국어로 자연스럽게 표현했습니다.
- source_word: δούλων
  english_pob_choice: slaves
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: BDAG
  rationale: 이 문맥에서 종들은 왕에게 예속된 신분이지만, 마태복음의 한국어 합쇼체에서는 ‘노예’보다 ‘종’이 문체상 자연스럽고, 본문의 경제적 결산 맥락이 그 예속성을 이미 드러냅니다.
- source_word: συνᾶραι λόγον
  english_pob_choice: to settle accounts
  chosen_korean: 결산하려는
  alternatives_korean:
  - 회계를 정리하려는
  - 계산을 따지려는
  lexicon: BDAG
  rationale: 관용구로서의 ‘계산을 맞추다/결산하다’ 의미를 살려, 왕이 종들에게 장부를 청산하려는 상황을 간명하게 전달했습니다.
theological_decisions:
- issue: 하늘 나라 표현
  chosen_reading: 하늘 나라
  alternative_readings:
  - 하늘의 나라
  - 천국
  rationale: 마태복음의 표준적 표현을 따라 ‘하늘 나라’로 옮겨, 전통적 ‘천국’이 가진 후대적 뉘앙스를 피했습니다.
  doctrine_reference: 'POB glossary: βασιλεία τῶν οὐρανῶν → 하늘 나라'
