id: MAT.18.35
reference: Matthew 18:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
  footnotes:
  - marker: a
    text: Or 'unless each one forgives his brother.'
    reason: lexical_alternative
  - marker: b
    text: '''His brother'' translates the masculine singular Greek; in context it functions representatively for each fellow disciple or fellow believer.'
    reason: cultural_note
translation:
  language: ko
  text: 이와 같이, 여러분 각 사람이 자기 형제를 마음에서 용서하지 않으면, 내 하늘에 계신 아버지께서도 여러분에게 하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제’는 그리스어의 남성 단수 표현을 옮긴 것입니다. 문맥상 각 제자 또는 신자를 대표적으로 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘하늘에 계신’은 그리스어에서 ‘아버지’를 수식하는 ‘하늘의, 하늘에 속한’이라는 표현(οὐράνιος)을 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: Οὕτως καὶ
  english_pob_choice: So also
  chosen_korean: 그와 같이
  alternatives_korean:
  - 이와 같이도
  - 그러므로 또한
  lexicon: BDAG
  rationale: 앞선 비유의 적용을 이끄는 비교·귀결 표현으로, 한국어에서는 ‘그와 같이’가 자연스럽고 원문의 연결성을 잘 살립니다.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  english_pob_choice: my heavenly Father
  chosen_korean: 내 하늘에 계신 아버지
  alternatives_korean:
  - 내 하늘 아버지
  - 하늘에 계신 내 아버지
  lexicon: BDAG
  rationale: οὐράνιος의 형용사적 뉘앙스를 살려 ‘하늘에 계신’으로 옮기고, 소유격 μου는 ‘내’로 분명히 드러냈습니다.
- source_word: ἀφῆτε ... ἕκαστος
  english_pob_choice: each of you does not forgive
  chosen_korean: 여러분이 각각 ... 용서하지 않으면
  alternatives_korean:
  - 각자 ... 용서하지 않으면
  - 여러분 각 사람이 ... 용서하지 않으면
  lexicon: BDAG
  rationale: ἕκαστος의 분배적 의미를 한국어에서 자연스럽게 드러내기 위해 ‘여러분이 각각’으로 처리했습니다.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  english_pob_choice: his brother
  chosen_korean: 자기 형제
  alternatives_korean:
  - 그의 형제
  - 자기 형제자매
  lexicon: BDAG
  rationale: 그리스어의 남성 단수 형태를 유지하되, 한국어에서는 문맥상 상호적 관계가 살아나도록 ‘자기’로 귀속을 분명히 했습니다.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  english_pob_choice: from your hearts
  chosen_korean: 마음으로부터
  alternatives_korean:
  - 너희의 마음으로부터
  - 마음 깊은 곳에서
  lexicon: BDAG
  rationale: 복수 ‘마음들’을 직역하기보다 한국어에서 의미가 살아나는 표현으로 옮기되, 내면에서 우러나는 진정한 용서라는 강조를 보존했습니다.
theological_decisions:
- issue: 형벌/심판의 직접성
  chosen_reading: 예수님의 비유에 연결된 하나님의 직접적 경고를 완화하지 않고, ‘그렇게 하실 것입니다’로 보존했습니다.
  alternative_readings:
  - 비슷하게 대하실 것입니다
  - 그와 같은 일을 당하게 하실 것입니다
  rationale: 원문은 조건부 심판 진술을 분명히 말하므로, 의미를 누그러뜨리거나 도덕적 충고로 바꾸지 않았습니다.
  doctrine_reference: 심판 경고의 무게를 유지하고 신학적 범주는 본문 너머로 확장하지 않음
- issue: ‘형제’의 대표성
  chosen_reading: ‘자기 형제’를 본문에 두고, 남성 단수 형태가 공동체 전체를 대표한다는 함의를 보존했습니다.
  alternative_readings:
  - 자기 동료
  - 자기 형제자매
  rationale: 그리스어의 성별 표지를 지우지 않으면서도, 본문 내 사용이 대표적이라는 점은 한국어 번역 자체를 넓히지 않는 방식으로 처리했습니다.
  doctrine_reference: 번역 원칙상 gender-accurate 우선
