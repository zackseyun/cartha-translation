revisions:
- from: 그와 같이, 내 하늘에 계신 아버지께서도 여러분이 각각 자기 형제를 마음으로부터 용서하지 않으면 여러분에게 그렇게 하실 것입니다.[a][b]
  to: 이와 같이, 여러분 각 사람이 자기 형제를 마음에서 용서하지 않으면, 내 하늘에 계신 아버지께서도 여러분에게 하실 것입니다.[a][b]
  rationale: 문두의 비교·적용 표현은 ‘이와 같이’로 유지하되 문말의 중복 지시어를 제거했습니다. 분배적 주어와 마음에서 나오는 용서의 뜻은 보존하면서 문장을 현대 표준 한국어 합쇼체로 매끄럽게 다듬었습니다. 각주는 원문의 성·수와 οὐράνιος의 의미를 정확히 설명하도록 조정했습니다.
