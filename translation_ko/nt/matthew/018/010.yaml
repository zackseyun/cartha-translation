id: MAT.18.10
reference: Matthew 18:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
  footnotes:
  - marker: a
    text: Or 'do not look down on' one of these little ones.
    reason: lexical_alternative
  - marker: b
    text: '''Their angels'' may refer to angels associated with or representing these little ones; the verse does not by itself settle the full doctrine of guardian angels.'
    reason: alternative_reading
  - marker: c
    text: Greek 'in the heavens' / 'who is in the heavens'; rendered idiomatically as 'in heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 작은 이들 가운데 하나라도 업신여기지 않도록 주의하십시오. 내가 여러분에게 말합니다. 그들의 천사들은 하늘에서 계속해서 나의 아버지, 곧 하늘에 계신 분의 얼굴을 보고 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘업신여기다’는 ‘깎아내리다/깔보다’보다 더 강하게 경멸하는 태도를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 천사들’은 수호천사를 뜻한다고 단정하지 않고, 본문이 허용하는 범위만 반영합니다.
    reason: theological_note
  - marker: c
    text: 그리스어는 문자적으로 ‘하늘들’이지만, 한국어에서는 관용적으로 ‘하늘’이라고 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  english_pob_choice: See that you do not despise
  chosen_korean: 업신여기지 않도록 주의하십시오
  alternatives_korean:
  - 멸시하지 않도록 주의하십시오
  - 깔보지 않도록 주의하십시오
  lexicon: BDAG
  rationale: Ὁρᾶτε의 경계·주의 촉구와 καταφρονέω의 ‘경멸하다/업신여기다’ 의미를 함께 살리기 위해, 현대 한국어에서 경고의 힘이 분명한 표현을 택했습니다.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  english_pob_choice: one of these little ones
  chosen_korean: 이 작은 이들 가운데 하나라도
  alternatives_korean:
  - 이 작은 이들 중 하나라도
  - 이 작은 아이들 가운데 하나라도
  lexicon: BDAG
  rationale: μικροί는 단순한 연령만이 아니라 낮은 지위와 연약함까지 포괄할 수 있어, ‘작은 이들’로 넓게 두되 ‘하나라도’로 개별성을 분명히 했습니다.
- source_word: οἱ ἄγγελοι αὐτῶν
  english_pob_choice: their angels
  chosen_korean: 그들의 천사들은
  alternatives_korean:
  - 그들의 천사들은
  - 그들을 섬기는 천사들은
  lexicon: BDAG
  rationale: 본문이 말하는 소유 관계를 그대로 유지해 ‘그들의 천사들’로 옮기고, 해석을 덧붙여 기능을 규정하지 않았습니다.
- source_word: ἐν οὐρανοῖς ... τοῦ ἐν οὐρανοῖς
  english_pob_choice: in heaven / who is in heaven
  chosen_korean: 하늘에서 ... 하늘에 계신 분의
  alternatives_korean:
  - 하늘에서 ... 하늘에 계신
  - 하늘들에서 ... 하늘들에 계신
  lexicon: BDAG
  rationale: 그리스어 복수형 ‘하늘들’을 한국어 관용 표현 ‘하늘’로 옮기되, 같은 어구를 두 번 반복해 천상의 위치와 아버지의 거처를 모두 드러냈습니다.
- source_word: βλέπουσι τὸ πρόσωπον
  english_pob_choice: continually see the face
  chosen_korean: 계속해서 ... 얼굴을 보고 있습니다
  alternatives_korean:
  - 늘 ... 얼굴을 보고 있습니다
  - 항상 ... 얼굴을 보고 있습니다
  lexicon: BDAG
  rationale: 현재형 βλέπουσι와 διὰ παντὸς의 지속성을 함께 살려 진행형으로 옮겼고, πρόσωπον은 ‘얼굴’로 직역해 직접적인 임재 이미지를 유지했습니다.
theological_decisions:
- issue: ‘their angels’의 해석 범위
  chosen_reading: ‘그들의 천사들’이라고만 두고, 각 작은 이에게 배정된 수호천사 교리를 본문 안에 확정하지 않았습니다.
  alternative_readings:
  - 개인별 수호천사로 명시적으로 해석하기
  - 천사들이 이 작은 이들을 대표하거나 섬긴다는 더 일반적 의미로 풀기
  rationale: 본문은 천사들이 아버지의 얼굴을 본다고 말하지만, 그 관계의 정확한 방식은 규정하지 않습니다. 번역은 그 긴장을 보존해야 하므로 해석을 닫지 않았습니다.
  doctrine_reference: 'Translation philosophy: theological tension should be preserved rather than resolved.'
