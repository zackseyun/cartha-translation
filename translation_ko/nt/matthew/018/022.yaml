id: MAT.18.22
reference: Matthew 18:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
  footnotes:
  - marker: a
    text: Or, “seventy times seven.”
    reason: alternative_reading
translation:
  language: ko
  text: 예수님께서 그에게 말씀하십니다. “나는 너에게 일곱 번까지라고 말하지 않습니다. 오히려 일흔 번씩 일곱 번까지라고 말합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “일흔일곱 번까지.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  english_pob_choice: says
  chosen_korean: 말씀하십니다
  alternatives_korean:
  - 말합니다
  - 이르십니다
  lexicon: SBLGNT
  rationale: 서술의 현재형을 자연스러운 한국어 현재 진술로 옮기되, 예수님의 발화는 예의와 존중을 반영해 ‘말씀하십니다’로 표현했습니다.
- source_word: Οὐ λέγω σοι
  english_pob_choice: I do not say to you
  chosen_korean: 나는 너에게 …라고 말하지 않습니다
  alternatives_korean:
  - 나는 너에게 …라고 하지 않습니다
  - 나는 너에게 …라고 말씀하지 않습니다
  lexicon: BDAG
  rationale: 부정문 구조를 직접 살리고, σοι의 단순한 2인칭 대상을 자연스럽게 한국어로 옮겼습니다.
- source_word: ἕως ἑπτάκις
  english_pob_choice: up to seven times
  chosen_korean: 일곱 번까지
  alternatives_korean:
  - 일곱 번까지로
  - 일곱 번에 이르기까지
  lexicon: BDAG
  rationale: 횟수의 상한을 나타내는 ἕως를 한국어의 ‘까지’로 간결하게 옮겼습니다.
- source_word: ἑβδομηκοντάκις ἑπτά
  english_pob_choice: seventy-seven times / seventy times seven
  chosen_korean: 일흔 번씩 일곱 번까지
  alternatives_korean:
  - 일흔일곱 번까지
  - 일흔 번 곱하기 일곱 번까지
  lexicon: BDAG
  rationale: 그리스어 표현의 산술적·관용적 이중 가능성을 보존하기 위해, 기존 영어 전승의 ‘seventy times seven’에 맞춰 직역형을 유지했습니다.
theological_decisions:
- issue: ἑβδομηκοντάκις ἑπτά의 수량 표현이 지닌 해석 여지
  chosen_reading: 본문의 숫자 표현을 ‘일흔 번씩 일곱 번까지’로 두어, 계산적 한도를 넘어서는 용서를 강조하는 본문의 힘을 유지했습니다.
  alternative_readings:
  - 일흔일곱 번까지
  - 일흔 번 곱하기 일곱 번까지
  rationale: 본문은 용서의 상한을 산정하려는 것이 아니라 한계를 크게 넘는 태도를 가르치므로, 수치의 해석을 과도하게 단정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 'translation philosophy §3: Preserve theological tension rather than resolve it.'
