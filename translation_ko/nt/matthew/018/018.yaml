id: MAT.18.18
reference: Matthew 18:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'will be bound in heaven ... will be loosed in heaven.' The Greek form can be rendered this way, but the wording here reflects the future verb with a perfect participle, which may indicate a state already established in heaven.
    reason: alternative_reading
translation:
  language: ko
  text: “진실로 내가 너희에게 말합니다. 너희가 땅에서 무엇이든지 매면 하늘에서 이미 매여 있을 것이고, 너희가 땅에서 무엇이든지 풀면 하늘에서 이미 풀려 있을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 전통적인 번역으로는 ‘하늘에서 매일 것이다 … 하늘에서 풀릴 것이다’라고 옮길 수 있습니다. 그러나 이 번역은 미래 동사와 완료 분사의 결합이 암시하는, 이미 확립된 상태를 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  english_pob_choice: Truly
  chosen_korean: 진실로
  alternatives_korean:
  - 아멘
  lexicon: BDAG
  rationale: 엄숙한 서두의 확언으로서 현대 한국어에서 자연스럽고, 이어지는 권위 있는 발화를 분명히 드러냅니다.
- source_word: λέγω ὑμῖν
  english_pob_choice: I tell you
  chosen_korean: 내가 너희에게 말합니다
  alternatives_korean:
  - 내가 너희에게 이릅니다
  - 내가 너희에게 말하노라
  lexicon: BDAG
  rationale: 직접 화행을 유지하면서도 합쇼체에 맞는 자연스러운 문장으로 옮겼습니다.
- source_word: δήσητε / λύσητε
  english_pob_choice: bind / loose
  chosen_korean: 매다 / 풀다
  alternatives_korean:
  - 묶다 / 풀다
  - 금지하다 / 허락하다
  lexicon: BDAG
  rationale: ‘bind/loose’의 대조를 한국어에서도 그대로 살리되, 비유적·권위적 용법을 미리 한정하지 않기 위해 가장 기본적인 동사쌍을 택했습니다.
- source_word: ἔσται δεδεμένα / ἔσται λελυμένα
  english_pob_choice: will have been bound / will have been loosed
  chosen_korean: 이미 매여 있을 것 / 이미 풀려 있을 것
  alternatives_korean:
  - 매여 있을 것입니다 / 풀려 있을 것입니다
  - 매일 것입니다 / 풀릴 것입니다
  lexicon: BDAG
  rationale: 미래형 동사와 완료 분사 결합이 가리키는 ‘이미 이루어진 상태’와 그 결과의 지속을 한국어에서 자연스럽게 반영했습니다.
theological_decisions:
- issue: 하늘의 선행 상태를 드러내는 시제 처리
  chosen_reading: ‘하늘에서 이미 매여 있을 것이고 / 이미 풀려 있을 것입니다’로 옮겨, 하늘에서의 선행된 상태가 땅의 행위와 대응한다는 점을 드러냈습니다.
  alternative_readings:
  - ‘하늘에서 매일 것입니다’
  - ‘하늘에서 매여 있습니다’
  rationale: 그리스어의 ἔσται + 완료 수동 분사는 단순한 미래 수동보다 이미 성립된 상태를 강하게 시사하므로, 이를 한국어에서도 분명히 나타내는 편이 본문의 긴장을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
