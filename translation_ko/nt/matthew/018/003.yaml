id: MAT.18.3
reference: Matthew 18:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
  footnotes:
  - marker: a
    text: Or 'like children.' The Greek has 'like the children,' likely echoing the child Jesus had set before them in the immediate context.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will never enter.' The Greek uses an emphatic negation.
    reason: lexical_alternative
  - marker: c
    text: '''Turn'' can also be rendered ''be turned'' or, in older English tradition, ''be converted.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말씀하셨습니다. “진실로 너희에게 말합니다. 너희가 돌이켜 어린아이들처럼 되지 않으면, 결코 하늘 나라에 들어가지 못할 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어린아이들처럼.’ 헬라어는 ‘그 어린아이들처럼’으로 되어 있어, 바로 앞 문맥에서 예수님이 세워 두신 아이를 되새기는 표현일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘결코 들어가지 못할 것입니다.’ 헬라어는 강한 부정을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘돌이키다’는 ‘돌이켜지다’로도 옮길 수 있고, 옛 번역 전통에서는 ‘회개하다’로도 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  english_pob_choice: Truly I say to you
  chosen_korean: 진실로 너희에게 말합니다
  alternatives_korean:
  - 아멘, 너희에게 말합니다
  - 진실로 진실로 너희에게 말합니다
  lexicon: BDAG
  rationale: Ἀμὴν은 엄숙한 말씀 도입 공식이므로 현대 한국어에서는 ‘진실로’가 가장 자연스럽고 분명합니다. ‘아멘’은 너무 음역적이고, ‘진실로 진실로’는 본문에 없는 중복을 보태게 됩니다.
- source_word: στραφῆτε
  english_pob_choice: turn
  chosen_korean: 돌이켜
  alternatives_korean:
  - 돌아서
  - 변하여
  - 회심하여
  lexicon: BDAG
  rationale: 여기서는 방향 전환의 결단을 나타내므로 ‘돌이켜’가 가장 직접적입니다. ‘회심하여’는 후대 신학 용어를 앞세울 수 있어 피했습니다.
- source_word: γένησθε
  english_pob_choice: become
  chosen_korean: 되지 않으면
  alternatives_korean:
  - 되어야 하지 않으면
  - 변하지 않으면
  lexicon: BDAG
  rationale: γίνομαι의 상태 변화 의미를 살려 ‘되다’로 옮겼습니다. 앞의 ‘돌이켜’와 함께, 행위와 상태의 변화를 두 동사로 균형 있게 드러냅니다.
- source_word: ὡς τὰ παιδία
  english_pob_choice: like children / like the children
  chosen_korean: 어린아이들처럼
  alternatives_korean:
  - 아이들처럼
  - 그 어린아이들처럼
  lexicon: BDAG
  rationale: 한국어에서는 ‘어린아이들처럼’이 자연스럽고, 본문의 비교 의미를 분명히 드러냅니다. 영어 POB의 ‘like children’과 달리, 여기서는 문맥상 비유 대상의 성격을 살리되 특정 성질을 본문에 덧붙이지 않았습니다.
- source_word: οὐ μὴ εἰσέλθητε
  english_pob_choice: you will certainly not enter
  chosen_korean: 결코 … 들어가지 못할 것입니다
  alternatives_korean:
  - 절대로 … 들어가지 못할 것입니다
  - 반드시 … 들어가지 못할 것입니다
  lexicon: BDAG
  rationale: οὐ μή의 강한 부정을 한국어의 ‘결코’로 살렸습니다. ‘들어가지 못할 것입니다’는 자연스럽고, 강한 부정을 유지하면서도 과도하게 경직되지 않습니다.
theological_decisions:
- issue: στραφῆτε의 의미를 기술적으로 ‘회심’으로 고정할지 여부
  chosen_reading: 본문의 요구를 ‘돌이켜’로 옮겨, 이후의 신학적 용어를 미리 주입하지 않았습니다.
  alternative_readings:
  - 회심하여
  - 돌아서
  rationale: 이 구절은 분명한 전환을 요구하지만, 그 자체로 후대의 기술적 ‘회심’ 용어를 필수로 하지는 않습니다. 따라서 본문의 긴장을 보존하면서도 문맥에 충실한 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: τὰ παιδία를 성품의 추상화로 풀지 않을지 여부
  chosen_reading: ‘어린아이들처럼’으로 구체적으로 유지했습니다.
  alternative_readings:
  - 겸손하게
  - 순진하게
  rationale: 본문은 제자들을 어린아이들과 비교할 뿐, 여기서 어떤 단일 덕목으로 해석해야 한다고 명시하지 않습니다. 그래서 비교 대상을 그대로 살려 해석의 여지를 남겼습니다.
  doctrine_reference: Translation philosophy §3
