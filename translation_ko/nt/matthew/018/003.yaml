  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘하늘나라’는 이 복합 명사를 현대 표기로 붙여 쓰고, 각주 표지를 해당 어구 바로 뒤에 배치하면 가독성과 기능이 좋아집니다.
  terminology: ‘돌이켜’는 기술적 교리 용어를 피하면서 전환의 요구를 보존합니다. ‘어린아이들처럼’은 παιδία가 요구하는 비교를 구체적으로 유지하며 특정 덕목으로 해석하지 않습니다. ‘하늘나라’는 마태복음의 βασιλεία τῶν οὐρανῶν에 대한 자연스럽고 확립된 한국어 표현입니다.
