id: MAT.18.30
reference: Matthew 18:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
  footnotes:
  - marker: a
    text: Or 'refused'; Greek literally 'was not willing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'put him in prison'; the Greek verb is more forceful, literally 'threw/cast him into prison.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the amount owed' or 'the debt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 그렇게 하려 하지 않았습니다.[a] 오히려 가서 그를 감옥에 던져 넣어[b], 그가 빚진 것을[c] 갚을 때까지 가두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거절했습니다”; 헬라어는 문자적으로 “원하지 않았습니다/하려 하지 않았습니다”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “감옥에 가두었습니다”; 헬라어 동사는 더 강하게 “던지다/내던지다”라는 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “빚” 또는 “빚진 액수”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἤθελεν
  english_pob_choice: was not willing
  chosen_korean: 내키지 않았습니다
  alternatives_korean:
  - 원하지 않았습니다
  - 하려 하지 않았습니다
  - 거절했습니다
  lexicon: BDAG
  rationale: θέλω의 의지·내적 동의 부재를 살리면서도, 한국어에서 자연스럽게 무성의한 거부감을 드러내는 표현으로 옮겼습니다. "거절했습니다"는 의미는 맞지만 원문의 의지 상태보다 결과를 더 강하게 단정합니다.
- source_word: ἀλλὰ
  english_pob_choice: instead
  chosen_korean: 오히려
  alternatives_korean:
  - 그러나
  - 대신
  - 반대로
  lexicon: BDAG
  rationale: 앞선 거부와 뒤따르는 폭력적 행동의 강한 대조를 한국어 관용에 맞게 살렸습니다.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  english_pob_choice: threw him into prison
  chosen_korean: 그를 감옥에 던져 넣고
  alternatives_korean:
  - 그를 감옥에 가두고
  - 그를 감옥에 넣고
  - 그를 옥에 던지고
  lexicon: BDAG
  rationale: βάλλω의 물리적이고 거친 동작을 약화하지 않기 위해 "던져 넣다"를 택했습니다. "가두다"는 결과는 전하되 행위의 폭력성이 약해집니다.
- source_word: ἕως οὗ ἀποδῷ
  english_pob_choice: until he should pay
  chosen_korean: 갚을 때까지
  alternatives_korean:
  - 그가 갚을 때까지
  - 그가 갚아야 할 때까지
  - 그가 상환할 때까지
  lexicon: BDAG
  rationale: ἕως οὗ + 접속법의 종결 의미를 한국어의 "-할 때까지"로 자연스럽게 살렸습니다. "갚다"는 ὀφειλόμενον과 함께 빚 상환의 맥락을 잘 드러냅니다.
- source_word: τὸ ὀφειλόμενον
  english_pob_choice: what was owed
  chosen_korean: 자기가 빚진 것
  alternatives_korean:
  - 빚진 것
  - 져야 할 것
  - 빚
  lexicon: BDAG
  rationale: 분사적 명사구의 의미를 한국어에서 가장 자연스럽게 드러내기 위해 "자기가 빚진 것"으로 옮겼습니다. "빚"은 간결하지만 인칭적 책임을 덜 분명하게 합니다.
theological_decisions:
- issue: 포로처럼 붙잡아 두는 폭력적 처벌의 강도
  chosen_reading: 원문의 거친 동작을 완화하지 않고 "던져 넣고"로 직역에 가까운 강도를 유지했습니다.
  alternative_readings:
  - 그를 감옥에 넣고
  - 그를 가두고
  rationale: 이 장면은 단순 구금이 아니라 보복적이고 폭력적인 처분을 드러내므로, 한국어에서도 그 불편함과 강도를 보존하는 것이 서사의 의도를 더 정확히 전달합니다.
  doctrine_reference: 본문의 서사적·윤리적 강조
- issue: 빛진 액수의 표현
  chosen_reading: '"자기가 빚진 것"으로 책임 주체를 분명히 했습니다.'
  alternative_readings:
  - 빚
  - 빚진 액수
  - 빚진 돈
  rationale: τὸ ὀφειλόμενον은 단순 금액보다 '갚아야 할 빚' 자체를 가리키므로, 책임과 의무를 함께 드러내는 표현이 적절합니다.
  doctrine_reference: 본문의 법적/채무적 비유
