revisions:
- from: 그런데 그는 내키지 않았습니다. 오히려 가서 그를 감옥에 던져 넣고, 자기가 빚진 것을 갚을 때까지 가두었습니다.[a][b][c]
  to: 그러나 그는 그렇게 하려 하지 않았습니다.[a] 오히려 가서 그를 감옥에 던져 넣어[b], 그가 빚진 것을[c] 갚을 때까지 가두었습니다.
  rationale: 원문의 채무자 지시를 바로잡기 위해 ‘자기가’ 를 ‘그가’로 수정했습니다. θέλω의 의지적 거부는 ‘그렇게 하려 하지 않았습니다’로 자연스럽게 드러냈고, βάλλω의 강도와 구금의 지속을 보존했습니다. 각주 표지도 해당 어구 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:33Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘자기가 빚진 것’에서 ‘자기’는 문장 주어인 첫째 종을 가리키므로, 원문의 αὐτόν(둘째 종)이 갚아야 하는 채무를 첫째 종의 채무로 바꾸어 버립니다. 또한 각주 표지는 해당 표현에 직접 붙이는 편이 적절합니다.
  naturalness: ‘내키지 않았습니다’는 가능하지만, 이 문맥에서는 상대의 간청을 받아들이려 하지 않았다는 뜻을 분명히 하는 ‘그렇게 하려 하지 않았습니다’가 현대 표준어 합쇼체에서 더 자연스럽고 정확합니다. ‘감옥에 던져 넣어 … 가두었습니다’는 βάλλω의 거친 행위와 구금의 지속을 자연스럽게 함께 나타냅니다.
  terminology: ‘감옥’, ‘빚진 것’, ‘갚을 때까지’는 φυλακή, τὸ ὀφειλόμενον, ἕως οὗ ἀποδῷ에 잘 대응합니다. 채무자는 반드시 ‘그가’로 밝혀야 합니다.
  issues:
  - severity: high
    issue: ‘자기가 빚진 것’의 재귀 지시 대상 오류
    rationale: 한국어 재귀대명사 ‘자기’는 통상 주어 ‘그’(채권자인 첫째 종)를 가리킵니다. 그러나 원문의 αὐτόν 및 문맥상 갚는 이는 감옥에 갇힌 둘째 종입니다. ‘그가 빚진 것’으로 고쳐야 합니다.
  - severity: medium
    issue: 각주 표지의 위치와 순서
    rationale: 각주 a, b, c가 모두 문장 끝에 붙어 있어 각각 ‘원하지 않음’, ‘던져 넣음’, ‘빚진 것’이라는 해당 어휘에 즉시 연결되지 않습니다. 각 표지를 관련 표현 뒤에 배치해야 합니다.
