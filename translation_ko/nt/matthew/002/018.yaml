revisions:
- from: 「라마에서 한 소리가 들렸으니, 통곡과 큰 애곡이라. 라헬이 자기 자녀들을 위하여 울며, 위로받기를 거절하였으니, 자녀들이 더 이상 없기 때문이라.」
  to: 「라마에서 한 소리가 들렸습니다. 곧 통곡과 큰 애곡이 있었습니다. 라헬이 자기 자녀들을 위하여 울며, 그들이 더 이상 없기 때문에 위로받기를 원하지 않았습니다.」
  rationale: 원문의 지명과 인명, 통곡의 시적·예언적 어조, 라헬의 지속적인 울음, 그리고 자녀들이 ‘더 이상 없다’는 절제된 표현을 유지했습니다. ‘거절하다’를 ‘원하지 않다’로 조정하여 θέλω의 의미를 보존하고, 전체를 현대 표준어 합쇼체로 정리했습니다.
  reviewer_model: gpt-5.6-terra
