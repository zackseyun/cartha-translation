base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
  footnotes:
  - marker: a
    text: Or 'will come forth' (more literally, 'will go out').
    reason: lexical_alternative
  - marker: b
    text: '''Will shepherd'' can also carry the sense ''will rule,'' preserving royal leadership imagery alongside pastoral care.'
    reason: lexical_alternative
translation:
  language: ko
  text: 『유다 땅 베들레헴아, 너는 유다의 통치자들 가운데서 결코 가장 작은 이가 아닙니다. 너에게서 한 통치자가 나와 내 백성 이스라엘을 목자로서 돌볼 것이기 때문입니다.』
  philosophy: optimal-equivalence
