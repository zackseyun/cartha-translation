  to: 『유다 땅 베들레헴아, 너는 유다의 통치자들 가운데서 결코 가장 작은 이가 아닙니다. 너에게서 한 통치자가 나와 내 백성 이스라엘을 목자로서 돌볼 것이기 때문입니다.』
  rationale: 원문의 강한 부정(οὐδαμῶς), 통치자 어휘(ἡγεμόσιν, ἡγούμενος), 미래 동사(ἐξελεύσεται, ποιμανεῖ), 그리고 목자 이미지(ποιμανεῖ)를 보존했습니다. 본문에 없는 출처 설명이나 해석을 덧붙이지 않았으며, 문장부호 오류를 바로잡고 합쇼체로 통일했습니다.
  reviewer_model: gpt-5.6-terra
