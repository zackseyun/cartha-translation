  text: 그러나 아켈라오가 그의 아버지 헤롯을 대신하여 유대를 다스리고 있다는 말을 듣고, 거기로 가기를 두려워하였습니다. 꿈에서 경고를 받은 뒤, 갈릴리 지방으로 물러갔습니다.[a]
