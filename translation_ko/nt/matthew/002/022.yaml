  source_fidelity: 초안은 문장의 기본 구조와 사건 순서를 잘 옮겼습니다. 다만 χρηματισθείς는 단순한 '지시'보다 경고 또는 신적 지시의 뉘앙스를 지니며, 여기서는 '경고를 받은'이 원문 및 영어 감사 번역의 선택을 더 충실히 반영합니다. ἀντί는 '이어'보다 '대신하여'가 직접적입니다.
  naturalness: 합쇼체 문체는 자연스럽습니다. '자기 아버지'는 한국어에서 아켈라오가 아닌 요셉을 가리킬 가능성도 있어, '그의 아버지'로 바꾸면 지시 대상이 분명해집니다. '꿈에서 경고를 받은 뒤'도 자연스럽고 문맥에 맞습니다.
  terminology: Ἀρχέλαος는 '아켈라오', Ἡρῴδης는 '헤롯', Ἰουδαία와 Γαλιλαία는 각각 '유대'와 '갈릴리'로 적절합니다. βασιλεύει의 왕권적 함의는 '유대를 다스리다'에 충분히 담기지만, '왕으로'를 보태면 역사적 직함에 관한 불필요한 단정으로 읽힐 수 있으므로 보태지 않았습니다.
