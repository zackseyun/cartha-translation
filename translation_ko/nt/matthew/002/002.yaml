  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
  footnotes:
  - marker: a
    text: Or “at its rising.” The Greek phrase ἐν τῇ ἀνατολῇ can mean “in the east” or refer to the star’s rising.
    reason: alternative_reading
  - marker: b
    text: Or “to worship him.” The Greek verb can denote either homage to a king or worship, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 말하였습니다[a]. 「유대인의 왕으로 나신 분이 어디 계십니까? 우리가 동방에서[b] 그분의 별을 보고 그분께 절하러[c] 왔습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “묻기를” 또는 “말하면서”.
    reason: λέγοντες는 그들의 발화 내용을 이끄는 현재분사이며, 앞 절의 동작과 연결됩니다.
  - marker: b
    text: 또는 “그 별이 떠오를 때”. 그리스어 ἐν τῇ ἀνατολῇ는 ‘동방에서’ 또는 별의 떠오름을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 “경배하러”. 그리스어 προσκυνέω는 왕에게 경의를 표하며 절하는 것 또는 예배하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
