  source_fidelity: 초안은 행동의 순서와 목적지(이스라엘 땅)를 대체로 충실히 옮겼습니다. 다만 '그분의 어머니'의 높임 표현은 원문의 비높임 소유 표현과 그 지시 대상(아기의 어머니)을 불필요하게 흐립니다.
  naturalness: '''그래서''는 가능하지만, 여기의 δέ는 강한 인과보다는 단순한 서사 진행을 나타냅니다. ''그러자''가 문맥상 더 자연스럽고, ''아기와 그 어머니''는 소유 관계를 분명하고 자연스럽게 드러냅니다.'
  terminology: '''아기''는 이 문맥의 παιδίον에 적절합니다. ''이스라엘 땅''은 γῆν Ἰσραήλ을 정확히 반영합니다. 어머니에게만 적용된 ''그분''은 신학적 또는 경어적 뉘앙스를 원문 이상으로 더하므로 피하는 것이 좋습니다.'
