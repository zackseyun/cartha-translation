translation:
  language: ko
  text: 그는 와서 나사렛이라는 도시에서 살았습니다. 이는 예언자들을 통하여 전해진 “그는 나사렛 사람이라[a] 불릴 것이다”라는 말씀이 이루어지게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나조라인”. “그는 나사렛 사람이라 불릴 것이다”라는 말의 정확한 예언적 배경은 논쟁 중입니다. 마태가 특정한 한 예언을 인용하기보다 예언자들에게서 나타나는 주제들을 요약했을 수 있습니다.
    reason: Ναζωραῖος의 형식적 대안과, 복수형 ‘예언자들’에 관련된 인용 배경의 불확실성을 보존합니다.
