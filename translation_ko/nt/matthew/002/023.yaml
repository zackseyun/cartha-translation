    rationale: πόλις는 본문상 ‘도시’이며, κατοικέω는 거주를 뜻합니다. ‘동네’는 규모를 축소하고 ‘자리잡고’는 정착성의 의미를 다소 보탭니다.
  - severity: low
    issue: ‘그분’이라는 호칭
    rationale: 원문은 단순히 ‘그’(암시된 주어)를 사용합니다. 존칭적 신학적 뉘앙스를 덧붙이지 않고 ‘그는’으로 옮기는 편이 원문에 가깝습니다.
  - severity: medium
