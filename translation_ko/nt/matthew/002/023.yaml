revisions:
- from: 그리고 가서 나사렛이라 하는 동네에 자리잡고 살았습니다. 이는 예언자들을 통하여 「그분은 나사렛 사람이라 불릴 것이다」 하신 말씀이 이루어지게 하려 함이었습니다.
  to: 그는 와서 나사렛이라는 도시에서 살았습니다. 이는 예언자들을 통하여 전해진 “그는 나사렛 사람이라[a] 불릴 것이다”라는 말씀이 이루어지게 하려는 것이었습니다.
  rationale: 수정안은 도시/거주의 어휘 의미를 더 정확히 반영하고, 수동형 성취 공식을 자연스러운 한국어로 유지합니다. 또한 단일 구약 본문을 특정하지 않은 채, Ναζωραῖος의 번역상 대안과 논쟁적인 예언적 배경을 각주로 보존합니다.
