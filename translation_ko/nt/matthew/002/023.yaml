  source_fidelity: 수정안은 ἐλθὼν κατῴκησεν의 순차적 행동을 ‘와서 … 살았습니다’로 자연스럽게 옮기고, πόλις를 ‘도시’로 반영합니다. 또한 διὰ τῶν προφητῶν의 복수와 수동적 ‘전해진 말씀’을 보존하며, ὅπως πληρωθῇ의 목적·성취 표현을 유지합니다.
  naturalness: 초안의 ‘자리잡고 살았습니다’는 κατοικέω에 영속성의 뉘앙스를 다소 더하고, ‘동네’는 πόλις보다 축소된 표현입니다. 수정안은 현대 표준어 합쇼체로 더 자연스럽고 정확합니다.
  terminology: Ναζωραῖος는 본문에서 통상적인 ‘나사렛 사람’으로 옮기되, ‘나조라인’이라는 형식적 대안을 각주에 두었습니다. ‘그분’ 대신 원문의 인칭과 서술의 절제를 따르는 ‘그는’을 사용했습니다.
