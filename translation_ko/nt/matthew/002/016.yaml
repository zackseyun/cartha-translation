review_pass:
  verdict: revise
  source_fidelity: 수정안은 ἐνεπαίχθη의 문맥상 ‘우롱당하다’라는 뜻, ἀποστείλας의 파송 행위, πάντας τοὺς παῖδας의 전칭과 남아 의미, 그리고 κατὰ τὸν χρόνον의 기준·근거 관계를 보존합니다. ‘두 살 이하’는 ἀπὸ διετοῦς καὶ κατωτέρω의 포함되는 상한 연령을 자연스럽고 정확하게 옮깁니다.
  naturalness: 초안의 마지막 독립문 ‘박사들에게서 알아낸 그 시간에 따른 것이었습니다’는 한국어로 지시 대상이 불분명하고 다소 부자연스럽습니다. 이를 본문의 살해 행위를 수식하도록 한 문장에 통합했습니다. ‘그 모든 인근 지역’도 ‘그 주변의 모든 지역’으로 다듬었습니다.
  terminology: ‘헤롯’, ‘베들레헴’, ‘박사들’은 한국어 성경 독자에게 익숙한 명칭입니다. 다만 ‘박사들’은 현대 한국어에서 학위를 가진 사람이라는 의미로도 이해될 수 있으므로, 마고이의 역사·문화적 의미를 설명하는 각주를 덧붙입니다. ἐνεπαίχθη에는 ‘우롱당한’을 본문에 두고 문맥적 대안 ‘속은’을 각주로 제시합니다.
  issues:
  - severity: medium
    issue: 마지막 문장의 수식 관계와 지시 대상이 불명확함
    rationale: ‘박사들에게서 알아낸 그 시간에 따른 것이었습니다’는 무엇이 그 시간에 따른 것인지 분명하지 않으며, κατὰ τὸν χρόνον이 헤롯의 살해 및 연령 기준과 관련된다는 원문의 연결을 약화합니다.
  - severity: low
    issue: ‘그 모든 인근 지역’의 어색한 표현
    rationale: αὐτῆς를 받는 자연스러운 한국어 표현은 ‘그 주변의 모든 지역’입니다.
  revised_text: 그때 헤롯은 박사들에게 우롱당한[a] 것을 알고 몹시 분노하여, 사람들을 보내 박사들에게서 알아낸 때에 따라 베들레헴과 그 주변의 모든 지역에 있는 두 살 이하의 사내아이들을 모두 죽였습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘박사들에게 속은’.
    reason: lexical_alternative
  - marker: b
    text: ‘박사들’은 그리스어 마고이(magoi)를 옮긴 말입니다. 이들은 동방의 현자 또는 점성가들을 가리킵니다.
    reason: cultural_note
  revision_rationale: 원문의 사건 순서와 수식 관계를 명확히 하도록 ‘박사들에게서 알아낸 때에 따라’를 살해 행위가 포함된 문장 안에 배치했습니다. ἐνεπαίχθη는 문맥상 헤롯이 마고이들에게 조롱 또는 우롱당했다고 여긴 뜻이므로 ‘우롱당한’으로 옮기되, 영어 감사 기록의 ‘tricked’에 상응하는 ‘속은’을 각주에 보존했습니다. 문화적 용어인 ‘박사들’에는 설명 각주를 제공합니다.
