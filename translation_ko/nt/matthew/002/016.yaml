review_pass:
  verdict: revise
  source_fidelity: 본문은 헤롯의 인식(ἰδὼν ὅτι), 매우 큰 분노(ἐθυμώθη λίαν), 사람들을 보냄(ἀποστείλας), 베들레헴과 그 인근 전역의 두 살 이하 남자아이들을 죽임(ἀνεῖλεν πάντας τοὺς παῖδας), 그리고 박사들에게서 정확히 알아낸 시간에 따른 연령 기준을 대체로 충실히 전달합니다. 다만 초안의 마지막 독립문은 원문의 시간 기준이 학살과 연령 범위를 규정한다는 관계를 불분명하게 만듭니다.
  naturalness: 초안의 “박사들에게서 알아낸 그 시간에 따른 것이었습니다”는 주어와 수식 관계가 불명확하여 현대 한국어로 다소 부자연스럽습니다. 시간 기준을 ‘두 살 이하’의 범위와 연결해 한 문장으로 정리하면 명료하고 자연스럽습니다.
  terminology: ‘박사들’은 한국어 성경의 관용적 표현으로 유지할 수 있으나, 그리스어 μάγοι의 역사·문화적 의미를 간단한 주석으로 밝혀 오해를 줄이는 것이 좋습니다. ἐνεπαίχθη는 단순한 사기보다 조롱·우롱의 뉘앙스를 지니므로 ‘우롱당한’이 문맥과 어휘 양쪽에 더 가깝습니다.
  issues:
  - severity: medium
    issue: 마지막 문장의 시간 기준 연결이 불명확함
    rationale: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων은 헤롯이 박사들에게서 자세히 알아낸 시간을 기준으로 연령 범위를 정했음을 나타냅니다. 초안처럼 별도 문장으로 두면 무엇이 그 시간에 따른 것인지 불분명합니다.
  - severity: low
    issue: ‘속은’은 ἐνεπαίχθη의 조롱·우롱 뉘앙스를 다소 약화함
    rationale: 이 문맥에서 헤롯은 박사들이 돌아오지 않아 자신이 우롱당했다고 여겼습니다. ‘우롱당한’은 이를 자연스럽고 직접적으로 반영하며, ‘조롱당한’이라는 대안을 주석으로 남길 수 있습니다.
  - severity: low
    issue: ‘사람을 보내’의 단수 표현
    rationale: ἀποστείλας는 보낸 대상을 명시하지 않지만, 살해 실행을 위해 파견한 자들을 문맥상 가리킵니다. 한국어에서는 ‘사람들을 보내’가 더 자연스럽고 영어 POB의 ‘sending men’에도 부합합니다.
  revised_text: 그때 헤롯은 자신이 박사들에게 우롱당한 것을 알고 크게 분노했습니다. 그는 사람들을 보내, 박사들에게서 자세히 알아낸 시간에 따라 베들레헴과 그 모든 인근 지역에 있는 두 살 이하의 사내아이들을 모두 죽였습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘조롱당한’.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘마고이’. 동방의 점성가 겸 현자들을 가리키는 말입니다.
    reason: cultural_note
  revision_rationale: 원문의 시간 기준을 연령 범위 및 살해 명령과 명확히 연결하고, ἐνεπαίχθη의 문맥상 의미를 ‘우롱당한’으로 반영했습니다. ‘사람들을 보내’는 ἀποστείλας의 수행 주체를 자연스럽게 드러냅니다. 주석 표지는 각각 ‘우롱당한’과 ‘박사들’ 뒤에 둡니다.
