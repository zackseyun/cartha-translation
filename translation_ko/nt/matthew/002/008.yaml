  source_fidelity: 수정이 필요합니다. πέμψας는 본동사보다 앞선 완료된 행위를 나타내므로 ‘보내며’보다 ‘보내고’가 적절합니다. 또한 ἐξετάσατε ἀκριβῶς περὶ τοῦ παιδίου는 단순히 아이에 관하여 알아보라는 말보다 그 아이의 소재를 정확히 അന്വേഷ/찾으라는 지시이므로 ‘그 아이를 자세히 찾아보십시오’로 옮기는 것이 문맥과 원문에 더 충실합니다. ὅπως의 목적 관계도 ‘그리하여’로 드러냈습니다.
  naturalness: 합쇼체 직접화법은 자연스럽습니다. ‘그 아이’는 παιδίον의 의미를 무리 없이 반영하며, ‘나에게 알려 주십시오’는 ἀπαγγείλατέ μοι의 보고 요청을 자연스럽게 전달합니다.
  terminology: προσκυνήσω는 본문의 신학적·서사적 맥락상 ‘경배하다’로 유지하되, 왕에게 하는 경의 또는 절을 뜻할 수도 있다는 어휘적 대안을 각주로 보존합니다. 원문의 αὐτῷ에는 경칭이 없으므로 ‘그분’ 대신 ‘그에게’를 사용했습니다.
