  text: 그들을 베들레헴으로 보내고 말했습니다. 「가서 그 아이를 자세히 찾아보십시오. 찾으면 나에게 알려 주십시오. 그리하여 나도 가서 그에게 경배[a]하려 합니다.」
  philosophy: optimal-equivalence
  footnotes:
