  to: 그들이 집에 들어가 그 아이와 그의 어머니 마리아를 보고, 엎드려 그에게 절하였습니다[a]. 그리고 보물함을 열어 그에게 황금과 유향과 몰약을 선물로 드렸습니다.
  rationale: The revision follows the Greek wording while preserving the lexical and theological openness of προσκυνέω. It also replaces overly narrow or interpretively loaded terms with natural Korean equivalents. «보물함» reflects the action of opening θησαυρούς in this context without claiming that the Greek itself specifies a particular modern container type.
