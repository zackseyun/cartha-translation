  doctrine_reference: Hos 11:1 cited by Matthew typologically; preserve direct divine speech
revisions:
- from: 헤롯이 죽기까지 거기 머물렀습니다. 이는 주께서 예언자를 통하여 「내가 내 아들을 이집트에서 불러내었다」 하신 말씀이 이루어지게 하려 함이었습니다.
  to: 헤롯이 죽을 때까지 그곳에 있었습니다. 그렇게 된 것은 주께서 예언자를 통하여 “내가 이집트에서 내 아들을 불렀다”라고 말씀하신 것이 이루어지게 하려는 것이었습니다.
  rationale: 원문의 단순 과거형 인용 동사를 ‘불렀다’로 절제하여 옮기고, 성취 공식을 현대적이면서도 원문의 목적 표현을 보존하는 문장으로 다듬었습니다. 호세아 11:1의 원래 문맥이나 마태의 성취 방식에 관한 해석은 본문에 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:17Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘거기 머물렀습니다’는 ἦν ἐκεῖ를 문맥상 자연스럽게 옮겼습니다. 그러나 인용문의 ἐκάλεσα는 단순히 ‘불렀다’이며, ‘불러내었다’는 본문에 명시되지 않은 ‘밖으로’의 뉘앙스를 더합니다. 또한 Ἐξ Αἰγύπτου의 출발점 의미는 ‘이집트에서’로 명확히 표현할 수 있습니다.
  naturalness: ‘이는 … 하려 함이었습니다’는 문어적이고 다소 경직되어 있습니다. ‘그렇게 된 것은 … 이루어지게 하려는 것이었습니다’가 현대 표준어 합쇼체에서 자연스럽고, 문맥의 인과 관계도 분명히 합니다.
  terminology: κύριος는 프로젝트 방침과 원문에 따라 ‘주’로 유지했습니다. διὰ τοῦ προφήτου는 ‘예언자를 통하여’로 적절합니다. 호세아 인용문의 ‘내 아들’과 1인칭 화법도 보존했습니다.
  issues:
  - severity: low
    issue: 인용문의 ‘불러내었다’
    rationale: ἐκάλεσα는 ‘불렀다’입니다. ‘불러내다’는 출애굽 문맥에서는 해석상 가능하지만, 동사 자체에는 없는 ‘밖으로 내보냄’의 의미를 덧붙입니다.
  - severity: low
    issue: 성취 공식의 문체
    rationale: ‘이는 … 하려 함이었습니다’보다 ‘그렇게 된 것은 … 하려는 것이었습니다’가 현대 한국어에서 더 자연스럽고 ἵνα πληρωθῇ의 목적/성취 관계를 유지합니다.
  revised_text: 헤롯이 죽을 때까지 그곳에 있었습니다. 그렇게 된 것은 주께서 예언자를 통하여 “내가 이집트에서 내 아들을 불렀다”라고 말씀하신 것이 이루어지게 하려는 것이었습니다.
