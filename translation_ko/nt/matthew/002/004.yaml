revisions:
- from: 그는 백성의 모든 대제사장들과 율법학자들을 모아 메시아가 어디에서 태어나야 하는지 그들에게 물었습니다.
  to: 그는 백성의 대제사장들과 율법학자들을 모두 모아, 메시아가 어디에서 태어날 것인지 그들에게 묻고 있었습니다.
  rationale: 의무를 암시하는 ‘태어나야 하는지’를 미래적 기대를 나타내는 ‘태어날 것인지’로 바꾸고, 주동사의 미완료상을 ‘묻고 있었습니다’로 반영했습니다. 나머지 핵심 용어와 문장 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:20:10Z'
review_pass:
  verdict: revise
  source_fidelity: ‘대제사장들’, ‘율법학자들’, ‘메시아’는 각각 ἀρχιερεῖς, γραμματεῖς, ὁ χριστός을 적절히 옮깁니다. 그러나 ‘태어나야 하는지’는 γεννᾶται에 의무의 뉘앙스를 더하므로, 예언적·기대된 출생을 나타내는 표현으로 고치는 것이 더 정확합니다. 또한 미완료 과거 ἐπυνθάνετο의 진행성을 ‘묻고 있었습니다’로 반영하는 것이 좋습니다.
  naturalness: 수정문은 현대 표준 한국어의 격식 있는 서술체로 자연스럽고, ‘모두 모아’가 πάντας의 포괄성을 분명히 드러냅니다.
  terminology: ‘대제사장들’은 복수의 ἀρχιερεῖς에 대한 한국어 성경 전통과 용례에 부합하며, ‘율법학자들’은 γραμματεῖς의 기능을 자연스럽게 전달합니다. 칭호 ὁ χριστός은 번역 원칙에 따라 ‘메시아’로 유지합니다.
  issues:
  - severity: medium
    issue: ‘태어나야 하는지’의 의무 뉘앙스
    rationale: γεννᾶται는 메시아가 태어날 장소를 묻는 간접의문문에서 기대된/장차의 출생을 가리키며, ‘-해야 한다’가 암시하는 당위는 본문에 없습니다.
  - severity: low
    issue: ἐπυνθάνετο의 미완료상 미반영
    rationale: ‘물었습니다’도 기본 의미는 전달하지만, 미완료 과거의 진행적·반복적 문의를 ‘묻고 있었습니다’로 더 충실히 나타낼 수 있습니다.
  revised_text: 그는 백성의 대제사장들과 율법학자들을 모두 모아, 메시아가 어디에서 태어날 것인지 그들에게 묻고 있었습니다.
