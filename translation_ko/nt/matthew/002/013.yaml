revisions:
- from: 그들이 떠난 뒤에, 보십시오, 주의 천사가 꿈에 요셉에게 나타나 말하였습니다. 「일어나 아기와 그분의 어머니를 데리고 이집트로 피하십시오. 그리고 내가 당신에게 말할 때까지 거기 머무르십시오. 헤롯이 아기를 찾아 죽이려 하고 있기 때문입니다.」
  to: 그들이 떠난 뒤에, 그런데 보십시오, 주님의 천사가 꿈에 요셉에게 나타나 이렇게 말했습니다. 「일어나서 그 아이와 그 아이의 어머니를 데리고 이집트로 피하십시오. 내가 당신에게 말할 때까지 거기에 머무르십시오. 헤롯이 그 아이를 찾아 죽이려 하기 때문입니다.」
  rationale: 문체를 현대 표준어 합쇼체로 통일하고, 아이와 어머니의 관계를 원문대로 명확히 했습니다. 또한 헤롯이 아이를 찾아 죽이려는 임박한 의도를 「찾아 죽이려 합니다」로 옮겼습니다. 본 절의 한국어 본문에는 원문상 별도 각주가 반드시 필요한 이문·모호성이 없으므로 각주를 두지 않았습니다.
  reviewer_model: gpt-5.6-terra
