review_pass:
  verdict: revise
  source_fidelity: 원문의 시간 순서, 꿈속 현현, 이집트로의 긴급한 피신, 헤롯의 살해 의도는 대체로 반영되었습니다. 그러나 직접 인용문의 명령형이 합쇼체 높임말과 일치하지 않으며, 「그분의 어머니」는 원문의 παιδίον을 선행사로 하는 αὐτοῦ를 불필요하게 경칭화하여 지시 관계를 흐립니다. 또한 「죽이려 하고 있기 때문입니다」는 μέλλει ζητεῖν(곧/막 찾으려 한다)의 임박한 의도를 다소 ‘이미 시도 중’으로 바꿉니다.
  naturalness: 「보십시오」는 ἰδού의 서사적 주의를 살리는 데 가능하지만, 문장 흐름상 「그런데 보십시오」가 더 자연스럽습니다. 직접 화법 전체를 「-십시오」로 통일하고, 「그 아이의 어머니」로 풀어 쓰면 현대 표준어 합쇼체에서 자연스럽고 명확합니다.
  terminology: 「주님의 천사」는 ἄγγελος κυρίου를 자연스럽게 옮기며, 관사가 없는 원문의 불특정성도 한국어에서는 무리 없이 유지됩니다. παιδίον은 「아기」보다 연령을 과도하게 좁히지 않는 「그 아이」가 적절합니다. Αἴγυπτος는 현대 표기 「이집트」가 적합합니다.
  issues:
  - severity: medium
    issue: 직접 인용문의 높임말 불일치
    rationale: 「일어나」는 해라체 명령이고 뒤의 「피하십시오/머무르십시오」는 합쇼체입니다. 목표 등록에 맞게 모두 합쇼체로 통일해야 합니다.
  - severity: medium
    issue: 「그분의 어머니」의 불필요한 경칭 및 지시 불명확성
    rationale: αὐτοῦ는 ‘그 아이의’를 뜻합니다. 「그분」은 본문에 없는 경칭을 더하며, 「그 아이의 어머니」가 관계를 명확히 합니다.
  - severity: medium
    issue: 헤롯의 행동 시점 및 의도의 뉘앙스
    rationale: μέλλει ζητεῖν은 헤롯이 아이를 ‘곧/막 찾으려 한다’는 임박한 의도이며, τοῦ ἀπολέσαι는 그 목적이 죽이는 것임을 나타냅니다. 「찾아 죽이려 합니다」가 이를 더 직접적으로 반영합니다.
  revised_text: 그들이 떠난 뒤에, 그런데 보십시오, 주님의 천사가 꿈에 요셉에게 나타나 이렇게 말했습니다. 「일어나서 그 아이와 그 아이의 어머니를 데리고 이집트로 피하십시오. 내가 당신에게 말할 때까지 거기에 머무르십시오. 헤롯이 그 아이를 찾아 죽이려 하기 때문입니다.」
