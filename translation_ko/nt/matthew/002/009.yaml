  text: 그들이 왕의 말을 들은 뒤 길을 떠났습니다. 그런데 보십시오, 그들이 동방에서[a] 본 별이 그들을 앞서 가다가 아기가 있는 곳 위에 이르러 멈춰 섰습니다.
