  source_fidelity: 개정이 필요합니다. 초안의 ‘만류하며’는 διεκώλυεν의 미완료 직설법이 나타내는 계속적·반복적 저지 시도를 충분히 드러내지 못하며, ‘처지인데’는 χρείαν ἔχω(‘필요가 있다’)에 본문에 없는 상황 판단의 뉘앙스를 더합니다. ‘당신께 세례를 받다’는 수동 부정사와 ὑπό + 속격의 행위자 관계를 자연스럽게 보존합니다.
  naturalness: ‘계속 말리며 말하였습니다’는 현대 표준어 합쇼체에서 자연스럽고, 직접 발화의 ‘제가/제게/당신께서’는 일관된 높임말입니다. ‘당신’은 이 문맥에서 존대 주체 표지 ‘당신께서’와 결합하여 예수께 대한 직접 호칭으로 기능하며 별도의 칭호를 첨가하지 않습니다.
  terminology: ‘세례를 받다’는 βαπτισθῆναι의 수동 의미를 보존하는 정착된 용어입니다. 예수의 이름이나 ‘주님’ 등의 칭호를 보충하지 않고 원문의 대명사 관계를 ‘그분/당신’으로 유지합니다.
