revisions:
- from: 나는 회개를 위해 물로 너희에게 세례를 준다. 그러나 내 뒤에 오시는 분은 나보다 더 강하시고, 나는 그분의 신을 들기에도 합당하지 않다. 그분은 너희에게 성령과 불로 세례를 주실 것이다.
  to: 나는 회개를 위하여 물로 너희에게 세례를 베풉니다.[a] 그러나 내 뒤에 오시는 분은 나보다 더 강하십니다. 나는 그분의 샌들을 들 자격도 없습니다. 그분께서는 너희에게 성령과 불로 세례를 베푸실 것입니다.[a][b]
  rationale: 합쇼체로 일관되게 고치고, ὑποδήματα를 현대적으로 자연스러운 「샌들」로 구체화했습니다. 「회개를 위하여」와 「성령과 불로」는 각각 εἰς와 ἐν의 의미 범위 및 본문의 해석상 긴장을 보존합니다. 각주 표지는 해당 표현에 맞게 배치했습니다.
