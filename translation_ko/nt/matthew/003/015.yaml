  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
  footnotes:
  - marker: a
    text: Or “all justice.” The Greek word can denote righteousness or justice; here “righteousness” best fits Matthew’s emphasis on conformity to God’s will.
    reason: lexical_alternative
