- from: 그분의 키[a]가 손에 있어, 자기의 타작 마당을 깨끗이 치우시고, 자기의 알곡을 곡간에 모으시며, 쭉정이는 꺼지지 않는 불에 태우실 것이다.」
  to: 그분의 키[a]가 그분의 손에 들려 있습니다. 그분은 자기 타작마당을 말끔히 정리하시고, 자기 밀을 곳간에 모아들이시겠지만, 쭉정이는 꺼지지 않는 불에 태워 없애실 것입니다.
