  verdict: revise
  source_fidelity: The draft accurately preserves the agricultural and judgment imagery, including the present possession of the πτύον, the thorough clearing of the threshing floor, gathering the grain, and burning the chaff with unquenchable fire. However, 「알곡」 is somewhat broader than σῖτος ('wheat'), and 「태우실 것이다」 does not fully convey the intensive κατακαύσει ('burn up/consume').
  naturalness: The draft is generally understandable, but 「손에 있어」 is less natural in modern formal-polite Korean than 「손에 들려 있습니다」. The final stray closing quotation mark is also an evident textual defect. A consistently formal-polite rendering is preferable.
  terminology: 「키」 is an appropriate, established Korean term for πτύον. 「타작마당」, 「곳간」, 「쭉정이」, and 「꺼지지 않는 불」 appropriately convey the source imagery. Rendering σῖτος as 「밀」 gives closer lexical precision, while 「태워 없애실 것입니다」 reflects the force of κατακαύσει.
  issues:
  - severity: medium
    issue: The rendering 「알곡」 is less specific than σῖτος.
    rationale: σῖτος ordinarily denotes wheat in this context. 「밀」 retains the concrete lexical reference while preserving the wheat/chaff image.
  - severity: low
    issue: The force of κατακαύσει is understated.
    rationale: The compound verb denotes burning up or consuming completely. 「태워 없애실 것입니다」 more naturally preserves this intensification in Korean.
  - severity: low
    issue: The text has an unmatched closing quotation mark and slightly uneven formal style.
    rationale: The final 」 is unsupported. Recasting the verse with formal-polite endings improves readability and matches the stated target register.
  - severity: low
    issue: The existing footnote explains the chosen term rather than presenting the stated lexical alternative.
    rationale: A concise alternative rendering for πτύον better corresponds to the English audit trail and the footnote reason.
