  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
  footnotes:
  - marker: a
    text: Or 'winnowing shovel.' Older English versions often have 'fan.'
    reason: lexical_alternative
  - marker: b
    text: Or 'barn' or 'granary' for 'storehouse.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 키[a]가 그분의 손에 들려 있습니다. 그분은 자기 타작마당을 말끔히 정리하시고, 자기 밀을 곳간에 모아들이시겠지만, 쭉정이는 꺼지지 않는 불에 태워 없애실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「까부르는 삽」. 전통 번역에서는 「부채」로 옮기기도 한다.
    reason: lexical_alternative
