  source_fidelity: 바리새인들과 사두개인들 가운데 ‘많은 사람’이라는 부분적 범위를 분명히 하고, ὀργή를 ‘진노’로 유지했습니다. ‘그의 세례에 나오다’는 한국어에서 부자연스럽고 지시 대상도 다소 불명확하므로, 문맥상 요한이 베푸는 세례를 받기 위해 오는 것으로 자연스럽게 옮겼습니다. 이는 그들이 실제로 세례를 받았다고 진술하지 않습니다.
  naturalness: 초안의 ‘많은 바리새파 사람들과 사두개파 사람들이 자기의 세례에 나오는 것’은 조사와 수식 관계가 어색합니다. 또한 표준어 현대 합쇼체 목표와 달리 인용문의 종결이 평어체(‘일러 주었느냐’)이므로 ‘일러 주었습니까’로 고쳤습니다.
  terminology: ‘바리새인’, ‘사두개인’, ‘세례’, ‘진노’는 표준 성서 한국어 용례에 부합합니다. Γεννήματα ἐχιδνῶν의 강한 모욕적 호격은 ‘독사의 자식들이여’로 유지했습니다.
  issues:
  - severity: medium
    issue: 인용문의 종결이 합쇼체 목표와 불일치합니다.
