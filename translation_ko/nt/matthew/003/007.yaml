    rationale: αὐτοῦ는 요한의 세례를 가리킵니다. 한국어에서는 ‘그가 베푸는 세례를 받으러 오는’이 자연스럽고, 오는 목적만 나타낼 뿐 실제 세례 시행을 단정하지 않습니다.
