  source_fidelity: The draft accurately conveys the warning against reliance on Abrahamic descent and God's ability to raise up descendants from stones. However, ‘조상’ weakens the explicit singular paternal claim (Πατέρα ... τὸν Ἀβραάμ), and ‘너희 속으로’ selects inward self-talk without retaining the phrase's possible communal sense.
  naturalness: The wording is generally clear, but the imperative ‘하지 마라’ does not meet the required modern formal-polite 합쇼체 register. The revised phrasing is natural in formal contemporary Korean.
  terminology: ‘아버지’ preserves the source's paternal/ancestral wording better than ‘조상.’ ‘자녀들’ appropriately renders τέκνα without narrowing it to sons. ‘일으키실 수 있습니다’ retains the source image without implying resurrection.
  issues:
  - severity: medium
    issue: Register mismatch
    rationale: ‘하지 마라’ is plain speech, whereas the specified target register is modern formal-polite 합쇼체.
  - severity: medium
    issue: ‘조상’ replaces the source's ‘father’
    rationale: Πατέρα explicitly means ‘father’; ‘조상’ broadens the relationship and softens the stated claim of Abraham as father.
  - severity: low
    issue: Ambiguity of ἐν ἑαυτοῖς is not retained
    rationale: ‘너희 속으로’ favors private inward speech, while the Greek may also mean speaking among themselves. A footnote preserves this ambiguity.
