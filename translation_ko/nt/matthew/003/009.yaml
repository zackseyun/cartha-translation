  language: ko
  text: 또 너희끼리[a] ‘아브라함이 우리의 아버지다’라고 말할 생각을 하지 마십시오. 내가 너희에게 말합니다. 하나님께서는 이 돌들로도 아브라함을 위하여 자녀들을 일으키실 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 속으로’ 또는 ‘너희 자신에게.’ 그리스어 표현은 내면의 혼잣말을 가리킬 수도 있고, 그들끼리 하는 말을 가리킬 수도 있습니다.
    reason: ἐν ἑαυτοῖς의 내면적 또는 집단적 의미 가능성을 보존합니다.
