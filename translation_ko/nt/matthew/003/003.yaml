lexical_decisions:
- source_word: κυρίου
  english_pob_choice: of the Lord
  chosen_korean: 주의
  alternatives_korean:
  - 야훼의
  lexicon: BDAG
  rationale: 이사야 40:3의 70인역 인용에서 κύριος는 본래 야훼이지만, 본 인용은 마태가 70인역을 그대로 채택한 형태이며 한국 성서 정형은 「주」를 유지한다. 본 번역은 직접 OT 인용 중 야훼 본문을 「야훼」로 회복하는 정책을 두지만, 마태가 의도적으로 「주」 호칭으로 예수와 야훼를 겹쳐 읽도록 한 정형(「주의 길을 예비하라」)에서는 한국어 정형 「주의 길」을 그대로 보존해 마태의 의도를 살린다.
theological_decisions:
- issue: 이사야 40:3 인용의 κύριος를 「주」로 둘지 「야훼」로 회복할지
  chosen_reading: 주의 길
  alternative_readings:
  - 야훼의 길
  rationale: 본 번역 정책상 야훼 본문의 LXX κύριος는 「야훼」로 회복할 수 있으나, 마태 3:3의 인용은 예수와 야훼의 정체성을 겹쳐 읽도록 의도된 정형이며 한국어에서도 「주의 길」이 그 신학적 겹침을 가장 자연스럽게 보존한다.
  doctrine_reference: 'Glossary: κύριος (= YHWH) → 야훼 / 주; preserve Matthew''s deliberate identification'
revisions:
- from: 이 사람은 예언자 이사야를 통하여 「광야에서 외치는 자의 소리. 주의 길을 예비하라. 그분의 길을 곧게 하라」고 말씀하신 그 사람입니다.
  to: '이 사람은 예언자 이사야를 통하여 전해진 말씀에 언급된 바로 그 사람입니다. “광야에서 외치는 이의 소리입니다: ‘너희는 주의[a] 길을 준비하고, 그분의 길들을 곧게 하십시오.’”'
  rationale: The revision corrects the reference formula, preserves the plural commands and plural ‘paths,’ and improves quotation syntax. It retains ‘주’ as the direct rendering of κύριος while placing the Hebrew-background alternative in an accurately anchored footnote. The note avoids treating a theological inference about Matthew’s intent as a lexical necessity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:26Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies John as the person referred to through Isaiah and retains ‘주의 길.’ However, ‘말씀하신 그 사람’ reverses/obscures the passive sense of ὁ ῥηθεὶς (‘the one spoken of’) and can imply that this person was the speaker. The quotation also needs to represent the plural imperatives and the plural τὰς τρίβους (‘paths’).
  naturalness: ‘이 사람은 … 그 사람입니다’ is unnecessarily repetitive, and the quotation’s punctuation does not clearly distinguish the announcing voice from its proclamation. The revision uses natural modern Korean while retaining the prophetic-citation form and formal-polite imperative register.
  terminology: ‘주’ appropriately renders κύριος in Matthew’s Greek text. A narrowly worded note records the YHWH background of Isaiah 40:3 without asserting a particular theological interpretation. ‘광야,’ ‘예언자,’ ‘길,’ and ‘곧게’ are suitable modern formal biblical terms.
  issues:
  - severity: medium
    issue: The passive reference formula is mistranslated/unclear.
    rationale: ‘예언자 이사야를 통하여 … 말씀하신 그 사람’ does not naturally mean ‘the one spoken of through Isaiah’; it may make John the one who spoke. The revised wording explicitly presents him as the person mentioned in the message transmitted through Isaiah.
  - severity: medium
    issue: The quotation loses Greek plurality.
    rationale: Ἑτοιμάσατε and ποιεῖτε are plural imperatives, and τὰς τρίβους is plural. ‘너희는 … 준비하고’ and ‘길들을’ preserve these features.
  - severity: low
    issue: The quotation punctuation and register need adjustment.
    rationale: A colon after ‘광야에서 외치는 이의 소리입니다’ clearly introduces the proclamation, and ‘하십시오’ conforms to the requested modern formal-polite register.
  revised_text: '이 사람은 예언자 이사야를 통하여 전해진 말씀에 언급된 바로 그 사람입니다. “광야에서 외치는 이의 소리입니다: ‘너희는 주의[a] 길을 준비하고, 그분의 길들을 곧게 하십시오.’”'
  revised_footnotes:
