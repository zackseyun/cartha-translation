- from: 예수께서 세례를 받으시고 곧 물에서 올라오셨습니다. 그리고 보십시오, 하늘이 그분을 향하여 열렸고, 하나님의 영이 비둘기처럼 내려와 그분 위에 임하는 것을 그분께서 보셨습니다.
  to: 예수께서 세례를 받으신 뒤에 곧바로 물에서 올라오셨습니다. 그리고 보십시오, 하늘이 열리고, 그분께서 하나님의 영이 비둘기처럼 내려와 그분 위로 오시는 것을 보셨습니다.
  rationale: ‘그분을 향하여’를 삭제하여 하늘이 열렸다는 원문의 수동 진술을 회복했습니다. 또한 두 현재분사의 연속 동작을 ‘내려와 … 위로 오시는’으로 옮겨, 성령을 비둘기와 동일시하지 않는 비교 표현과 예수께 향하는 움직임을 보존했습니다.
