review_pass:
  verdict: revise
  source_fidelity: 원문의 ‘하늘들이 열렸다’는 수동 표현과 성령의 두 동작(‘내려오며’와 ‘그분 위로 오며’)을 보존해야 합니다. 초안의 ‘그분을 향하여 열렸고’는 하늘이 예수를 향해 열렸다는 방향성을 덧붙이므로 원문에 충실하지 않습니다.
  naturalness: 합쇼체 문체는 대체로 자연스럽습니다. 다만 ‘하늘이 그분을 향하여 열렸고’는 한국어로도 부자연스럽고 의미가 달라집니다. ‘그리고 보십시오’는 ἰδού의 주의 환기 기능을 자연스럽게 살립니다.
  terminology: ‘세례’, ‘하나님의 영’, ‘비둘기처럼’은 적절합니다. πνεῦμα θεοῦ를 ‘성령’으로 바꾸지 않고 ‘하나님의 영’으로 둔 것은 원문의 표현을 보존합니다.
  issues:
  - severity: high
    issue: ‘하늘이 그분을 향하여 열렸고’
    rationale: οἱ οὐρανοί는 단순히 ‘열렸다’(수동태)라고 되어 있으며, 예수를 향한 방향을 나타내지 않습니다. ‘그분을 향하여’는 근거 없는 의미 추가입니다.
  - severity: low
    issue: 성령의 마지막 동작 표현
    rationale: ἐρχόμενον ἐπ’ αὐτόν은 그분 위로/위에 ‘오고 있는’ 동작입니다. ‘임하는’도 문맥상 가능하지만, ‘그분 위로 오시는’이 영어 감사 기록의 투명한 어휘 선택 및 원문 동작성을 더 직접적으로 반영합니다.
  revised_text: 예수께서 세례를 받으신 뒤에 곧바로 물에서 올라오셨습니다. 그리고 보십시오, 하늘이 열리고, 그분께서 하나님의 영이 비둘기처럼 내려와 그분 위로 오시는 것을 보셨습니다.
