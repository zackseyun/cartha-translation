  source_fidelity: 수동 미완료형 ἐβαπτίζοντο는 단순히 완료된 과거 사건이라기보다 당시 계속되거나 반복된 세례 행위를 나타냅니다. 초안의 ‘세례를 받았습니다’는 기본 의미와 행위자 ‘그에게’를 보존하지만, 미완료상의 뉘앙스가 약화됩니다. ‘요단강에서’와 ‘그에게’는 각각 장소와 요한의 행위자임을 충실히 옮깁니다.
  naturalness: ‘자기들의’보다 현대 표준 한국어에서는 ‘자신들의’가 자연스럽고, ἐξομολογούμενοι에는 ‘자백하며’보다 일반 독자에게 자연스러운 ‘고백하면서’가 적절합니다. ‘세례를 받고 있었습니다’는 합쇼체를 유지하면서 미완료상을 드러냅니다.
  terminology: ‘세례’는 βαπτίζω의 확립된 한국어 성서 용어로 적절하며, 본문이 명시하지 않는 방식(침수 등)을 덧붙이지 않습니다. ‘죄를 고백하다’도 ἐξομολογέω와 ἁμαρτίας의 복수 표현을 자연스럽게 반영합니다.
