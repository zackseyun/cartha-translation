  chosen_korean: 매우 기뻐한다
  alternatives_korean:
  - 기뻐한다
  - 흡족해한다
  lexicon: BDAG
  rationale: εὐδοκέω는 단순한 호감이 아니라 의지적 선택의 흡족함을 함의한다. 한국어 「매우 기뻐한다」가 그 무게를 살린다.
theological_decisions:
- issue: 하늘에서 들린 신적 발화 — 합쇼체 종결과 인용 형식
  chosen_reading: 이는 내 사랑하는 아들이다. 내가 그를 매우 기뻐한다.
  alternative_readings:
  - 이는 내 사랑하는 아들이라
  - 나는 그를 기뻐한다
  rationale: 신적 발화는 합쇼체 원칙이나, 신적 자기 선언은 「-이다/-한다」 평서종결로 옮겨 신적 권위·확정성을 살린다. 청중 일반(군중·요한·예수 자신)이 듣도록 선포되는 형식이므로 「합니다」보다 「-이다/-한다」가 본문의 무게에 더 가깝다.
  doctrine_reference: 'Korean register policy: divine self-declaration → declarative -이다/-한다 within 합쇼체 narrative'
review_pass:
  verdict: revise
  source_fidelity: 현 번역은 핵심 진술인 예수의 아들 되심과 하나님의 기쁨을 대체로 전달합니다. 그러나 「매우」는 εὐδόκησα에 없는 강도를 더하며, 「그를」은 ἐν ᾧ의 ‘그 안에서/그에게서’라는 표현을 다소 평면화합니다. 또한 οὐρανῶν의 복수는 한국어 본문에서는 관용적으로 단수로 옮길 수 있으나 각주로 밝혀야 합니다.
  naturalness: 「한 음성이 있어 말씀하셨습니다」는 한국어에서 어색하며, 음성이 ‘말씀하다’의 주어가 되는 표현도 부자연스럽습니다. 「하늘에서 음성이 들려왔습니다」가 현대 한국어 서술에 자연스럽습니다. 인용문도 대상 표준인 현대 합쇼체에 맞추어 「입니다/기뻐합니다」로 고칩니다.
  terminology: 「내 사랑하는 아들」은 성서적이고 자연스러운 핵심 용어입니다. 다만 문장 전체를 현대 합쇼체로 유지하고, εὐδόκησα에 근거 없는 강조어 「매우」를 제거합니다.
  issues:
  - severity: medium
    issue: εὐδόκησα에 「매우」를 첨가함
    rationale: εὐδοκέω는 기쁨·만족·승인을 나타내지만 본문에는 ‘매우’에 해당하는 강화 부사가 없습니다. 이를 삭제하여 원문의 의미 범위를 보존해야 합니다.
  - severity: medium
    issue: 「한 음성이 있어 말씀하셨습니다」의 부자연스러운 서술
    rationale: φωνή가 직접 발화하는 문맥이지만 한국어에서는 ‘음성이 말씀하셨다’보다 ‘음성이 들려왔다’가 자연스럽고, 뒤의 직접 인용이 발화 내용을 충분히 나타냅니다.
  - severity: low
    issue: οὐρανῶν의 복수에 대한 각주 부재
    rationale: 한국어의 「하늘에서」는 자연스럽지만, 그리스어가 복수형임을 각주로 밝혀 원문 형태와 영어 POB 감사 기록을 반영하는 것이 좋습니다.
  revised_text: 그리고 보십시오, 하늘에서 음성이 들려왔습니다. “이분은 내 사랑하는 아들이며, 나는 이분을 기뻐합니다.”
  revised_footnotes:
  - marker: a
    text: 그리스어는 복수형으로, 직역하면 “하늘들에서”입니다.
    reason: lexical_alternative
  revision_rationale: 원문의 주의 환기 표지(καὶ ἰδού), 하늘로부터 들린 음성, 예수의 ‘사랑하는 아들’ 되심, 그리고 하나님이 그에게 기쁨을 두신다는 선언을 보존했습니다. 한국어 관용상 「하늘에서」를 본문에 쓰되 그리스어 복수형은 각주로 밝혔습니다. 또한 현대 합쇼체를 일관되게 적용하고, 원문에 없는 강조어를 제거했습니다.
