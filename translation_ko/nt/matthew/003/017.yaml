  rationale: εὐδοκέω는 단순한 호감이 아니라 의지적 선택의 흡족함을 함의한다. 한국어 「매우 기뻐한다」가 그 무게를 살린다.
theological_decisions:
- issue: 하늘에서 들린 신적 발화 — 합쇼체 종결과 인용 형식
  chosen_reading: 이는 내 사랑하는 아들이다. 내가 그를 매우 기뻐한다.
  alternative_readings:
  - 이는 내 사랑하는 아들이라
  - 나는 그를 기뻐한다
  rationale: 신적 발화는 합쇼체 원칙이나, 신적 자기 선언은 「-이다/-한다」 평서종결로 옮겨 신적 권위·확정성을 살린다. 청중 일반(군중·요한·예수 자신)이 듣도록 선포되는 형식이므로 「합니다」보다 「-이다/-한다」가 본문의 무게에 더 가깝다.
  doctrine_reference: 'Korean register policy: divine self-declaration → declarative -이다/-한다 within 합쇼체 narrative'
review_pass:
  verdict: revise
  source_fidelity: 원문의 복수형 τῶν οὐρανῶν, φωνή의 발화, 그리고 ἐν ᾧ εὐδόκησα의 관계절을 더 정확히 반영해야 합니다. 초안의 「매우」는 εὐδόκησα에 없는 강도를 더하며, 「한 음성이 있어 말씀하셨습니다」는 무생물 주어 ‘음성’에 부적절한 높임을 사용합니다.
  naturalness: 「그리고 보십시오」와 「한 음성이 있어 말씀하셨습니다」는 현대 표준 한국어 합쇼체 서술로 다소 어색합니다. 「보십시오, 하늘들로부터 음성이 들려와 말했습니다」는 표지어의 주목 기능을 유지하면서 더 자연스럽습니다. 인용문은 본문의 선언적 문체를 살려 「-이다/-한다」로 유지할 수 있습니다.
  terminology: 「내가 사랑하는 아들」은 ὁ υἱός μου ὁ ἀγαπητός을 자연스럽고 충실하게 옮깁니다. εὐδόκησα는 여기서 「내가 기뻐하는」으로 옮겨 관용적 선언의 뜻을 보존하되, 원문에 없는 「매우」는 제거했습니다.
  issues:
  - severity: medium
    issue: 「하늘에서」가 원문의 복수형 τῶν οὐρανῶν을 평준화합니다.
    rationale: 한국어에서는 복수형이 다소 표지적이지만, 본문의 표현을 보존하기 위해 본문에 「하늘들로부터」를 사용하고 자연스러운 단수형은 각주로 제시하는 것이 적절합니다.
  - severity: medium
    issue: 「한 음성이 있어 말씀하셨습니다」의 높임과 문장 구성이 부자연스럽습니다.
    rationale: φωνή는 발화하는 ‘음성’이지 높임의 대상이 아니므로 「음성이 들려와 말했습니다」가 자연스럽고 원문의 기능에도 맞습니다.
  - severity: medium
    issue: 「매우 기뻐한다」가 원문에 없는 정도 부사를 첨가합니다.
    rationale: εὐδόκησα는 기쁨/만족/기꺼이 받아들임을 뜻하지만 ‘매우’라는 강도를 어휘적으로 요구하지 않습니다.
  - severity: low
    issue: ἐν ᾧ의 관계 표현이 「그를」로 풀릴 때 문자적 선택지를 확인할 각주가 필요합니다.
    rationale: 본문의 자연스러운 한국어 표현은 유지하되, 「그 안에서/그에게서」라는 원문의 전치사 표현은 각주로 밝혀 둘 수 있습니다.
  revised_text: 보십시오, 하늘들로부터[a] 음성이 들려와 말했습니다. 「이는 내가 사랑하는 아들이며, 내가 기뻐하는 이이다.[b]」
  revised_footnotes:
  - marker: a
    text: 또는 “하늘에서.” 그리스어는 복수형으로, 직역하면 “하늘들로부터”이다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “내가 그 안에서 기뻐한 이이다.”
    reason: lexical_alternative
  revision_rationale: 주목을 촉구하는 καὶ ἰδού는 「보십시오」로, ἐκ τῶν οὐρανῶν의 복수형은 「하늘들로부터」로 보존했습니다. 음성의 발화는 비높임 서술인 「말했습니다」로 고쳤습니다. 아들 선언과 신적 기쁨의 두 수식 요소는 「사랑하는 아들이며, 내가 기뻐하는 이」로 연결하여 원문의 구조와 의미를 유지했습니다. 원문에 없는 강도 부사 「매우」는 حذف했습니다.
