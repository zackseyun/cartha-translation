  source_fidelity: 원문의 δέ가 나타내는 앞 절의 침묵 명령과의 가벼운 대조는 ‘그러나’로 잘 반영할 수 있습니다. ἐξελθόντες의 선행 동작은 ‘나간 뒤에’로, διεφήμισαν αὐτόν은 한국어에서 자연스럽게 ‘그분에 관한 소문을 퍼뜨렸습니다’로 옮겨 그분의 소식/명성이 널리 알려졌다는 뜻을 전달합니다. ἐν ὅλῃ τῇ γῇ ἐκείνῃ는 지역적 범위로 ‘그 지역 전체에’라고 옮겼습니다.
  naturalness: 초안의 ‘그 온 지방에 그분에 관해 두루 알렸습니다’는 조사와 부사 배치가 다소 부자연스럽고, ‘그분에 관해 알리다’는 이 문맥에서 다소 직역투입니다. ‘그분에 관한 소문을 그 지역 전체에 퍼뜨렸습니다’가 현대 표준 한국어로 자연스럽습니다.
  terminology: ‘그분’은 존칭을 유지하며, ‘지역’은 γῆ의 문맥상 지역적 의미를 무리 없이 반영합니다. ‘소문’은 여기서 단순한 확인되지 않은 풍문이 아니라 널리 퍼지는 평판·소식을 가리키는 한국어 관용적 표현으로 사용했습니다.
  issues:
  - severity: low
    issue: 직역투인 어순과 표현
    rationale: ‘그 온 지방에 그분에 관해 두루 알렸습니다’보다 목적어를 명시하고 ‘그 지역 전체에 퍼뜨렸습니다’로 옮기는 편이 διεφήμισαν의 의미와 현대 한국어 어법을 더 정확히 살립니다.
  revised_text: 그러나 그들은 나간 뒤에 그분에 관한 소문을 그 지역 전체에 퍼뜨렸습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그 온 땅에’. 그리스어 γῆ는 ‘땅’, ‘지역’, 또는 ‘영역’을 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 한국어 표현을 자연스럽게 다듬으면서, 나간 뒤 널리 알렸다는 시간적 순서와 지역 전체에 미친 범위를 보존했습니다. γῆ의 어휘적 폭은 각주로 남겼습니다.
