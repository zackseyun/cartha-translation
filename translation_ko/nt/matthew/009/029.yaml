  - severity: low
    issue: 높임 주격 조사
    rationale: 현대 한국어의 공적·존대 서술에서는 ‘예수님께서’가 ‘예수님이’보다 자연스럽고 일관됩니다.
  revised_text: 그때 예수님께서 그들의 눈을 만지시며 말씀하셨습니다. “너희 믿음[a]대로 너희에게 이루어져라.”
