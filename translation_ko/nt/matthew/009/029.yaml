  naturalness: ‘예수님이’보다 높임 주격 조사인 ‘예수님께서’가 현대 표준어 합쇼체 서술에 적절합니다. ‘너희 믿음대로 너희에게 이루어져라’는 다소 엄숙하지만 예수님의 치유 선언으로 자연스럽고 원문의 명령형을 보존합니다.
  terminology: πίστις는 본문에서 일관되게 ‘믿음’으로 옮기고, 문맥상 가능한 ‘신뢰’는 각주로 제시합니다. ἥψατο는 ‘눈을 만지시며’로 정확히 반영됩니다.
  issues:
