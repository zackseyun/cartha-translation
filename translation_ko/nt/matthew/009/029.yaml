review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders τότε, the physical touching of their eyes, and the measure/correspondence expressed by κατὰ τὴν πίστιν ὑμῶν. However, the final Korean phrase uses an incomplete desiderative form ("이루어지기를") where the Greek has a passive imperative, γενηθήτω.
  naturalness: The narration is natural modern Korean. In the direct speech, "너희 믿음대로 너희에게 이루어지기를" is fragmentary in this register. A formal imperative makes the utterance complete and preserves its pronouncement-like force.
  terminology: '"믿음" is the standard and appropriate rendering of πίστις here. "눈을 만지시며" naturally conveys ἥψατο τῶν ὀφθαλμῶν αὐτῶν. "여러분" is used in place of archaic/intimate "너희" to maintain the requested modern formal-polite register.'
  issues:
  - severity: medium
    issue: The rendering "이루어지기를" does not express the finite imperative force of γενηθήτω.
    rationale: 'γενηθήτω is an aorist passive imperative, functioning as a healing pronouncement: “let it be done/become for you.” The Korean should contain a complete imperative rather than a sentence fragment or an added explicit wish.'
  revised_text: 그때 예수님께서 그들의 눈을 만지시며 말씀하셨습니다. “여러분의 믿음대로 여러분에게 이루어지십시오.”
  revised_footnotes:
  - marker: a
    text: 또는 “여러분의 신뢰에 따라 여러분에게 이루어지십시오.” 그리스어 피스티스(πίστις)는 “신뢰”로도, 문맥에 따라서는 “신실함”으로도 옮길 수 있습니다.
    reason: πίστις의 가능한 어휘적 대안을 보존합니다.
  revision_rationale: 서술의 존대와 현대 표준어를 유지하면서, "너희"를 "여러분"으로 조정했습니다. 또한 γενηθήτω의 수동 명령법을 "이루어지십시오"로 옮겨, 원문의 수행적 명령/선언의 힘을 보존했습니다. "믿음"은 본문에 유지하고 가능한 대안은 각주에 제시했습니다.
