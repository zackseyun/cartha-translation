  source_fidelity: 그리스어의 역사적 현재 λέγει를 반영하려면 ‘말씀하십니다’가 적절합니다. 현 초안의 ‘말씀하셨습니다’도 한국어 서사에서는 가능하지만, 원문의 현재형이 지닌 생동감을 보존하지 못합니다. 또한 θερισμός는 ‘추수할 것’보다 명사형 ‘추수’로 옮기는 것이 직접적이며, πολύς와 ὀλίγοι의 대조를 ‘많으나/적습니다’로 명료하게 살릴 수 있습니다.
