  source_fidelity: ‘새 천’은 ἄγναφος의 핵심인 아직 줄지 않음/아직 축융되지 않음을 충분히 드러내지 못합니다. 또한 αἴρει는 덧댄 조각이 옷에서 떨어져 나가거나 떼어 내는 결과를 나타내므로, 현재 번역의 ‘그 옷을 잡아당겨’보다 분리의 결과를 명시하는 편이 원문에 더 가깝습니다.
