  terminology: ἄγναφος는 본문에서 ‘아직 줄지 않은’으로 옮기고, 축융되지 않은 천이라는 어휘적 대안은 각주로 보완합니다. ἐπίβλημα와 τὸ πλήρωμα αὐτοῦ는 문맥상 ‘천 조각/그 조각’으로 일관되게 옮깁니다.
