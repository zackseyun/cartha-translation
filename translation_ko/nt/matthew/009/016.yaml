  text: 아무도 아직 줄지 않은 천 조각을 낡은 옷에 덧대지 않습니다[a]. 그렇게 하면 그 조각이 그 옷에서 떨어져 나가 더 심한 찢어짐이 생기기 때문입니다.
  philosophy: optimal-equivalence
