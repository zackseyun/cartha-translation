id: MAT.9.17
reference: Matthew 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
  footnotes:
  - marker: a
    text: Or 'new wineskins.' The Greek distinguishes new wine (νέος) from wineskins that are fresh/new in condition (καινός).
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 사람들은 새 포도주를 낡은 가죽 부대에 담지 않습니다. 그렇게 하면 가죽 부대가 터지고, 포도주는 쏟아지며, 가죽 부대도 못 쓰게 됩니다. 오히려 새 포도주는 새 가죽 부대에[a] 담고, 그러면 둘 다 보존됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 포도주의 ‘새’(νέος)와 가죽 부대의 ‘새’(καινός)에 서로 다른 낱말을 사용합니다. 여기서 후자는 새것이거나 상태가 좋은 가죽 부대를 가리킵니다.
    reason: lexical_alternative
