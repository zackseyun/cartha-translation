translation:
  language: ko
  text: 예수께서 돌아보시고 그 여인을 보시며 말씀하셨습니다. “딸아, 용기를 내십시오.[a] 네 믿음이 너를 구원했습니다.[b]” 그러자 그 여인은 바로 그때부터 나았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “안심하십시오.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “네 믿음이 너를 낫게 했다” 또는 “온전하게 했다.” 그리스어 동사는 ‘구원하다,’ ‘낫게 하다,’ 또는 ‘온전하게 하다’를 뜻할 수 있습니다.
    reason: lexical_alternative
