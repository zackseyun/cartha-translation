  - severity: low
    issue: 메시아 칭호 주석의 표지 부재
    rationale: 영어 감사 기록의 주석 내용은 ‘Son of David’를 설명하지만 표기가 ‘from there’에 연결되어 있습니다. 한국어에서는 설명 대상인 ‘다윗의 자손’에 직접 표지를 두어 앵커를 바로잡습니다.
