  source_fidelity: 원문의 현재분사 παράγοντι ἐκεῖθεν은 예수께서 ‘그곳에서 떠나 가시는 중/때’라는 배경 상황을, ἠκολούθησαν은 두 사람이 실제로 그분을 뒤따른 사건을 나타냅니다. ‘그곳을 떠나가실 때’와 ‘그분을 따라왔습니다’로 이를 자연스럽고 충실하게 옮겼습니다. κράζοντες καὶ λέγοντες의 긴급한 외침도 ‘외쳐 말했습니다’로 보존했습니다.
  naturalness: 초안의 ‘두 맹인이 따라오며’는 사건의 주동사 시제가 다소 흐릿하고, ‘맹인’은 현대 일반 문맥에서는 다소 표지적인 명사로 들릴 수 있습니다. ‘눈먼 두 사람이 그분을 따라오면서’는 현대 표준어에서 더 자연스럽고 원문의 남성 복수도 무리 없이 반영합니다.
  terminology: ‘다윗의 자손’은 υἱὲ Δαυίδ의 정착된 메시아적 칭호를 충실히 보존합니다. 의미를 본문에서 ‘메시아’ 등으로 풀어쓰지 않고, 필요한 설명은 해당 표현에 연결한 주석으로 제한했습니다. 한국어 주석 표지는 설명 대상인 ‘다윗의 자손’에 붙였습니다.
