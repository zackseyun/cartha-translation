- from: 귀신이 쫓겨나자 그 벙어리가 말을 했습니다. 무리가 놀라며 말했습니다. 「이스라엘에서 이런 일이 결코 나타난 적이 없다.」
  to: 귀신이 쫓겨나자, 말하지 못하던 사람[a]이 말했습니다. 무리는 놀라 이렇게 말했습니다. “이스라엘에서는 이와 같은 일이 결코 나타난 적이 없습니다.”
