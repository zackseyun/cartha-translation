  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
  footnotes:
  - marker: a
    text: Or, “the deaf man.” The Greek word can mean either “deaf” or “mute”; here the context favors “mute” because the emphasis is that he spoke.
    reason: lexical_alternative
translation:
  language: ko
  text: 귀신이 쫓겨나자, 말하지 못하던 사람[a]이 말했습니다. 무리는 놀라 이렇게 말했습니다. “이스라엘에서는 이와 같은 일이 결코 나타난 적이 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 단어는 ‘듣지 못하던 사람’을 뜻할 수도 있습니다. 그러나 여기서는 그가 말하게 된 것이 강조되므로 ‘말하지 못하던 사람’으로 옮겼습니다.
    reason: κωφός의 ‘듣지 못하는’ 또는 ‘말하지 못하는’ 의미 범위를 보존하면서, 문맥상 선택한 의미를 설명합니다.
