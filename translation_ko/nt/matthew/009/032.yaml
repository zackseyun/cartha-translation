    issue: The explicit subject “사람들이” is added.
    rationale: προσήνεγκαν has an unspecified plural subject (“they”); identifying them as “people” goes beyond the Greek text.
  - severity: medium
    issue: “벙어리” is outdated and can be derogatory in contemporary Korean.
    rationale: “말하지 못하는” conveys the contextual meaning of κωφός respectfully and naturally.
  - severity: low
    issue: The lexical range of κωφός is not noted.
    rationale: κωφός can refer to being unable to hear as well as being unable to speak. The next verse supports the chosen contextual rendering, but the alternative should be footnoted.
