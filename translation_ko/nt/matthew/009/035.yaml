- from: 예수님은 모든 성읍과 마을을 두루 다니시며, 그들의 회당에서 가르치시고, 그 나라의 좋은 소식을 선포하시며, 모든 병과 모든 약한 것을 고치셨습니다.
  to: 예수께서는 모든 성읍과 마을을 두루 다니시며, 그곳의 회당들에서 가르치시고 왕국의 기쁜 소식[a]을 선포하시며 모든 질병과 모든 연약함[b]을 고치셨습니다.
  rationale: 원문의 미완료 과거 περιῆγεν은 «두루 다니시며»로, 세 현재분사(가르치고, 선포하고, 고치며)는 병렬 연결로 유지했습니다. 반복된 πᾶσαν은 «모든 …과 모든 …»으로 보존했습니다. 지시가 불분명한 «그 나라»와 비자연적인 «약한 것»만 안전하게 바로잡았으며, 왕국을 특정 신학적 표현으로 확대하지 않았습니다.
