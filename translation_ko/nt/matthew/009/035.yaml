    rationale: μαλακία는 여기서 병약함·연약함·질환을 뜻하며, «약한 것»은 사람이나 사물을 가리키는 듯하여 부자연스럽고 의미가 불명확합니다.
  - severity: low
    issue: 각주 부재
    rationale: 영어 감사 기록에 보존된 εὐαγγέλιον 및 μαλακία의 주요 어휘 대안을 한국어 본문에도 앵커와 함께 제시하는 것이 검토 가능성과 의미 범위 보존에 유익합니다.
