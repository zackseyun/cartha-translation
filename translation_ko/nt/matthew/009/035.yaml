    rationale: τῆς βασιλείας는 ‘왕국의/나라의’라는 명사 수식어이나, 한국어 «그 나라»는 이 절 안에서 지시 대상을 찾기 어렵습니다. «왕국의 기쁜 소식»이 원문의 의미와 문법 관계를 더 직접적으로 드러냅니다.
  - severity: medium
