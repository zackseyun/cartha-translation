  - marker: b
    text: 호세아 6:6의 인용입니다.
    reason: cross_reference
  - marker: c
    text: 또는 “자신이 의롭다고 생각하는 사람들.” 그리스어 본문은 단지 “의인”이라고 합니다.
    reason: alternative_reading
