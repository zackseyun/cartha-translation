  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 δέ의 연결을 ‘그러나’로 반영하고, 인용문의 범위를 분명히 하며, 원문의 명령법과 대조를 자연스럽게 살릴 필요가 있습니다.
  naturalness: 초안의 ‘배우라’는 요청된 현대 합쇼체 문체에 맞지 않으며, 문장 끝의 닫는 인용부호가 짝을 이루지 않아 구조상 오류입니다. ‘무슨 뜻인지’보다 ‘무엇을 뜻하는지’가 이 문맥에서 조금 더 자연스럽고 격식 있습니다.
  terminology: ‘자비’, ‘제사’, ‘의인들’, ‘죄인들’은 각각 ἔλεος, θυσία, δίκαιοι, ἁμαρτωλοί에 적절합니다. ‘의인들’을 ‘스스로 의롭다고 여기는 사람들’ 등으로 해석적으로 바꾸지 않았습니다.
  issues:
  - severity: medium
    issue: 문체가 합쇼체 요구에 맞지 않음
    rationale: ‘배우라’는 해라체 명령이므로 현대 formal-polite 합쇼체의 ‘배우십시오’로 고쳐야 합니다.
  - severity: high
    issue: 인용부호 짝 오류
    rationale: 초안 마지막의 닫는 인용부호(」)는 대응하는 여는 인용부호가 없으며, 호세아 인용 뒤의 인용부호도 문장부호와 결합 방식이 부자연스럽습니다.
  - severity: low
    issue: δέ의 연결 의미 미반영
    rationale: 문두의 δέ는 강한 대립일 필요는 없지만, 앞선 발화와의 연결을 위해 ‘그러나’를 두는 것이 적절합니다.
  revised_text: 그러나 가서 ‘나는 자비를 원하고 제사는 원하지 않는다’ 하신 말씀이 무엇을 뜻하는지 배우십시오. 나는 의인들을 부르러 온 것이 아니라 죄인들을 부르러 왔습니다.
  revised_footnotes:
  - marker: a
    text: 호세아 6:6을 인용한 말씀입니다.
    reason: cross_reference
  revision_rationale: 합쇼체를 일관되게 적용하고, 잘못된 인용부호를 바로잡았습니다. 호세아 인용은 원문의 대조를 보존하여 ‘자비’와 ‘제사’를 그대로 옮겼으며, ‘의인들’의 가능한 아이러니를 본문에 덧붙이지 않았습니다. ‘그러나’는 δέ의 담화 연결을 반영합니다.
