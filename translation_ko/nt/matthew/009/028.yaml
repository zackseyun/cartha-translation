  text: 예수님께서 집에 들어가시자, 그 눈먼 사람들이 그분께 다가왔습니다. 예수님께서 그들에게 말씀하십니다. 「내가 이것을 할 수 있다고 너희가 믿느냐?」 그들이 그분께 말합니다. 「예, 주님.」
