review_pass:
  verdict: revise
  source_fidelity: ‘인자,’ ‘땅에서,’ ‘죄를 용서할 권세,’ and the healing commands accurately represent the principal Greek expressions. However, the Greek purpose clause (ἵνα ... εἰδῆτε) runs directly into the following narration (‘then he says’); rendering it as a completed declarative sentence, ‘알게 하려는 것이다,’ weakens that syntactic and dramatic connection.
  naturalness: The proposed revision uses natural modern formal-polite Korean narrative style. ‘침상’ is appropriate in this biblical context, and the commands retain the direct, concise force of the Greek.
  terminology: ‘인자’ suitably preserves the established titular expression ὁ υἱὸς τοῦ ἀνθρώπου without imposing an interpretive paraphrase. ‘권세’ appropriately conveys ἐξουσία as authority, and ‘죄를 용서하다’ is idiomatic Korean for ἀφιέναι ἁμαρτίας.
  issues:
  - severity: medium
    issue: The purpose clause is unnecessarily completed as an independent assertion.
    rationale: ‘너희가 알게 하려는 것이다’ supplies a sentence-ending explanatory assertion where Greek leaves the purpose clause syntactically joined to the ensuing action. Recasting it as ‘… 알게 하시려고’ preserves the source’s flow and is more idiomatic Korean.
  - severity: low
    issue: The plural ‘죄들’ is unnatural in this Korean context.
    rationale: Although ἁμαρτίας is plural, Korean idiom normally uses the unmarked singular collective ‘죄를’ for forgiving sins. This does not reduce the source sense.
  revised_text: 그러나 인자가 땅에서 죄를 용서할 권세를 가지고 있음을 너희가 알게 하시려고 말씀하신 뒤, 그 중풍병자에게 말씀하셨습니다. “일어나 네 침상을 들고 네 집으로 가라.”
  revised_footnotes: []
  revision_rationale: 'The revision preserves the Greek purpose-to-action sequence by connecting Jesus’ stated purpose to his subsequent address to the paralyzed person. It also replaces the awkward plural ‘죄들’ with idiomatic collective ‘죄’ while retaining the same meaning. No footnotes are required: ‘인자’ is the conventional Korean rendering of the title, and ‘침상’ adequately conveys κλίνη in context.'
