revisions:
- from: 그러나 인자가 땅에서 죄들을 용서하는 권세를 가지고 있음을 너희가 알게 하려는 것이다.」 그러고 나서 그 중풍병자에게 말씀하셨습니다. 「일어나 네 침상을 들고 네 집으로 가라.」
  to: 그러나 인자가 땅에서 죄를 용서할 권세를 가지고 있음을 너희가 알게 하시려고 말씀하신 뒤, 그 중풍병자에게 말씀하셨습니다. “일어나 네 침상을 들고 네 집으로 가라.”
  rationale: 'The revision preserves the Greek purpose-to-action sequence by connecting Jesus’ stated purpose to his subsequent address to the paralyzed person. It also replaces the awkward plural ‘죄들’ with idiomatic collective ‘죄’ while retaining the same meaning. No footnotes are required: ‘인자’ is the conventional Korean rendering of the title, and ‘침상’ adequately conveys κλίνη in context.'
