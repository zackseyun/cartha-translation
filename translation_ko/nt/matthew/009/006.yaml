  text: 그러나 인자가 땅에서 죄를 용서할 권세를 가지고 있음을 너희가 알게 하시려고 말씀하신 뒤, 그 중풍병자에게 말씀하셨습니다. “일어나 네 침상을 들고 네 집으로 가라.”
  philosophy: optimal-equivalence
