  terminology: '"출혈을 겪던" is a non-diagnostic rendering of αἱμορροοῦσα. "옷 가장자리" is suitably broad for κράσπεδον; a note preserves the possible sense of fringe or tassel and its Jewish-law background.'
  issues:
