    issue: '"그런데" adds a contrastive nuance.'
    rationale: Καὶ ἰδού is a connective plus attention-getting narrative marker, not specifically a contrast. "보십시오" adequately represents ἰδού without adding contrast.
  - severity: medium
    issue: '"옷자락" does not retain the full lexical range of κράσπεδον.'
    rationale: The Greek can denote a garment's edge, fringe, or tassel-like border. "옷 가장자리" is broader, and notes can preserve the alternatives and cultural background.
  - severity: low
    issue: '"혈루증" is a traditional medical label rather than a transparent modern description.'
    rationale: The Greek describes ongoing bleeding and does not require a diagnostic label. "출혈을 겪던" is clear, modern, and avoids over-specification.
