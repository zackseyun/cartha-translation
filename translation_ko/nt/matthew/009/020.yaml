  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
  footnotes:
  - marker: a
    text: Or 'tassel' or 'hem'; the Greek term can refer to the fringe or border of a garment, possibly including the tassel-like border associated with Jewish dress.
    reason: lexical_alternative
  - marker: b
    text: See Numbers 15:38 and Deuteronomy 22:12 for the background of garment fringes/tassels in Israel's law.
    reason: cross_reference
translation:
  language: ko
  text: 보십시오[b], 열두 해 동안 출혈을 겪던 한 여인이 뒤에서 다가와 그분의 옷 가장자리[a]를 만졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “옷의 술” 또는 “옷단.” 그리스어는 옷의 가장자리나 술을 가리킬 수 있으며, 유대인의 옷에 달던 술이 포함될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 옷 가장자리/술의 배경은 민수기 15:38과 신명기 22:12를 보십시오.
    reason: cross_reference
