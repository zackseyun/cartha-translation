id: MAT.9.8
reference: Matthew 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
  footnotes:
  - marker: a
    text: Or 'were filled with awe.' The Greek verb more literally means 'were afraid,' but the fear may include reverent amazement.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''to people'' or ''to human beings.'' Greek: ''to men,'' which can function representatively for humans in general.'
    reason: lexical_alternative
translation:
  language: ko
  text: 무리들은 그것을 보고 두려워했으며[a], 사람들에게 이와 같은 권세를 주신 하나님께 영광을 돌렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경외했습니다.’ 그리스어는 더 문자적으로 ‘두려워했습니다’라는 뜻이지만, 그 두려움에는 경외와 놀라움의 뉘앙스가 포함될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '‘사람들에게’는 사람 일반, 곧 ‘인간들에게’를 뜻할 수 있습니다. 그리스어: ‘사람들에게’.'
    reason: lexical_alternative
