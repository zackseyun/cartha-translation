review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the inferential οὖν, prayer/entreaty imperative δεήθητε, the harvest metaphor, and the dispatch of workers. However, the final unmatched closing quotation mark is a structural defect, and the construction “보내 주시도록 하라” is less direct and natural than the Greek imperative addressed to the disciples. “내보내시도록” also better retains the force of ἐκβάλῃ than simple “보내 주시도록.”
  naturalness: “간구하십시오” is modern formal-polite Korean and directly renders the plural imperative. “추수의 주님” is natural biblical Korean; “그분의 추수” clearly represents αὐτοῦ without adding an interpretation of the Lord’s identity.
  terminology: Render κύριος as “주님,” preserving the title without deciding whether its referent is the Father, Jesus, or God more broadly. Render ἐργάτας as “일꾼들.” The footnote records the stronger lexical sense of ἐκβάλῃ while retaining a natural contextual main-text rendering.
  issues:
  - severity: medium
    issue: Unmatched closing quotation mark
    rationale: The draft ends with “」” without a corresponding opening mark, creating a structural and typographical error.
  - severity: medium
    issue: Awkward imperative and weakened verb nuance
    rationale: “간구하여 … 하라” is less natural than directly addressing readers with “간구하십시오,” and “보내 주시도록” does not reflect the comparatively forceful ἐκβάλῃ as well as “내보내시도록.”}],
  revised_text: 그러므로 추수의 주님께, 그분이 일꾼들을 그분의 추수에 내보내시도록[a] 간구하십시오.
  revised_footnotes:
