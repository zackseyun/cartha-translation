  verdict: revise
  source_fidelity: δέομαι의 긴급한 간구와 οὖν의 논리적 연결, ‘추수의 주인’이라는 표현, 그리고 그분의 추수에 일꾼을 보내는 구문을 충실히 반영하도록 다듬었습니다. ἐκβάλῃ의 비교적 강한 ‘내보냄’의 뉘앙스는 각주로 보존했습니다.
  naturalness: 초안의 ‘간구하여 … 하라’는 연결과 명령이 다소 부자연스럽고, 문장 끝에 불필요한 닫는 인용 부호가 있습니다. ‘…간구하십시오’로 현대 표준어 합쇼체의 자연스러운 문장으로 고쳤습니다.
  terminology: κύριος는 ‘주인’으로, θερισμός은 ‘추수’로, ἐργάτας는 ‘일꾼들’로 옮겼습니다. ‘자신의 추수’는 αὐτοῦ의 소유 관계를 유지하며, ‘추수의 주인’의 정체를 특정하지 않습니다.
  issues:
  - severity: medium
    issue: 명령문 연결이 부자연스러움
    rationale: ‘간구하여, … 하라’보다 ὅπως 이하의 청원 내용을 받는 ‘…하시도록 간구하십시오’가 한국어 문법과 합쇼체 문체에 더 자연스럽습니다.
  - severity: low
    issue: 불필요한 닫는 인용 부호
    rationale: 본문 끝의 ‘」’는 짝이 없으며 본문에 포함될 이유가 없습니다.
  - severity: low
    issue: ἐκβάλῃ의 강한 어감이 본문에서 약화됨
    rationale: 문맥상 ‘내보내시다’가 자연스럽지만, ‘보내다’보다 강한 동사의 어감은 각주로 밝혀 두는 것이 적절합니다.
  revised_text: 그러므로 추수의 주인께서 자신의 추수에 일꾼들을 내보내시도록 간구하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 ‘일꾼들을 몰아내시도록.’ 그리스어 동사는 단순히 ‘보내다’보다 강한 뜻이지만, 여기서는 일꾼들을 추수에 파견한다는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: 문법적으로 자연스러운 합쇼체 명령문으로 고치고, 원문의 청원 목적절과 소유 표현을 유지했습니다. ἐκβάλλω의 강한 어감은 문맥에 맞는 본문 표현과 대안 각주를 통해 함께 보존했습니다.
