  source_fidelity: 개정이 필요합니다. 「그런데」는 καὶ ἰδού의 주의를 환기하는 기능에 없는 대조·전환의 뉘앙스를 더하므로 「보십시오」로 옮기는 편이 적절합니다. προσέφερον의 미완료상은 「데려오고 있었습니다」로 반영했습니다. παραλυτικός는 특정 질환인 「중풍병자」보다 넓은 「마비된 사람」이 원문에 더 충실합니다. τὴν πίστιν αὐτῶν의 복수와 수동형 용서 선언도 유지했습니다.
  naturalness: 서술은 현대 표준어 합쇼체로 다듬었습니다. 다만 τέκνον은 다정한 직접 호칭이므로 인용문 안에서는 자연스러운 「얘야」를 유지했습니다. 요청된 합쇼체에 맞추어 뒤따르는 명령과 선언은 「-십시오/-았습니다」로 처리했습니다.
  terminology: 「마비된 사람」은 παραλυτικός의 의미를 과도하게 특정하지 않습니다. 「믿음」, 「죄들」, 「용서받았습니다」는 각각 πίστις, ἁμαρτίαι, ἀφίενται를 무리 없이 반영합니다. 「용기를 내십시오」는 Θάρσει의 격려 명령을 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: 「그런데」가 καὶ ἰδού에 대조적 전환의 의미를 덧붙입니다.
    rationale: 원문은 접속사와 주의 환기 표지로 장면을 생생하게 제시할 뿐, 역접이나 대조를 명시하지 않습니다.
  - severity: medium
    issue: 「중풍병자」는 παραλυτικός보다 의미 범위를 좁힐 수 있습니다.
    rationale: 그리스어는 일반적으로 마비된 사람을 가리키며, 뇌졸중성 중풍이라는 특정 의학적 원인을 말하지 않습니다.
  - severity: low
    issue: 「데려왔습니다」는 προσέφερον의 미완료상을 충분히 드러내지 못합니다.
    rationale: 문맥상 단순 과거도 가능하지만, 진행 중인 장면을 나타내는 「데려오고 있었습니다」가 원문의 상을 더 잘 보존합니다.
  - severity: medium
    issue: 초안의 직접 인용문 「안심하여라/용서받았다」는 목표 합쇼체와 일치하지 않습니다.
    rationale: 다정한 호칭은 보존하되, 명령과 선언의 종결을 합쇼체로 조정하는 것이 프로젝트의 목표 문체에 맞습니다.
