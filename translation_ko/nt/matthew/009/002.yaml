  to: 보십시오, 사람들이 침상에 누워 있는 마비된 사람 한 명을 예수님께 데려오고 있었습니다. 예수님께서 그들의 믿음[b]을 보시고 그 마비된 사람에게 말씀하셨습니다. 「얘야, 용기를 내십시오[a]. 네 죄들이 용서받았습니다[c].」
  rationale: 원문의 주의 환기 표현, 미완료상, 비특정적인 마비 표현, 복수 대명사의 해석상 열림, 그리고 행위자를 밝히지 않는 수동형 용서 선언을 보존했습니다. 각주 표지는 해당 표현에 직접 붙여 구조와 내용을 일치시켰습니다.
