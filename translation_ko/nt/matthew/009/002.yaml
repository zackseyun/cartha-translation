    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 사람들이 침상에 누워 있는 마비된 사람 한 명을 예수님께 데려오고 있었습니다. 예수님께서 그들의 믿음[b]을 보시고 그 마비된 사람에게 말씀하셨습니다. 「얘야, 용기를 내십시오[a]. 네 죄들이 용서받았습니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마음을 굳게 먹으십시오.”
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 “그들의 믿음”입니다. 이 복수 표현은 마비된 사람과 그를 데려온 사람들을 함께 가리킬 수도 있고, 그를 데려온 사람들만을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 “네 죄들이 용서받았습니다.”
    reason: lexical_alternative
