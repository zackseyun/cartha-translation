review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal marker, John’s disciples’ approach to Jesus, the paired subject “we and the Pharisees,” the customary sense of the present-tense fasting verbs, and the contrast introduced by δέ. “자주” appropriately renders πολλά as frequent fasting practice.
  naturalness: The sentence is otherwise natural in modern formal-polite Korean. However, direct second-person “당신의” is generally abrasive or unnatural in contemporary Korean dialogue, especially when addressing a respected interlocutor. Repeating “예수님” in the quoted question avoids that pragmatic problem while retaining the referent established by “예수님께.”
  terminology: “요한의 제자들,” “바리새인들,” and “금식” are standard and suitable. “예수님” consistently reflects Korean Christian usage and the required respectful register.
  issues:
  - severity: medium
    issue: Direct address “당신의 제자들은” is pragmatically unnatural in this Korean setting.
    rationale: Although formally literal for σου, “당신” often carries confrontational, intimate, or otherwise unsuitable force in modern Korean. The wording can distract from the question’s intended contrast.
  revised_text: 그때 요한의 제자들이 예수님께 와서 말했습니다. “어찌하여 우리와 바리새인들은 자주 금식하는데, 예수님의 제자들은 금식하지 않습니까?”
