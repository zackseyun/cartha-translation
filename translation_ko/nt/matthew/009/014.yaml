- from: 그때 요한의 제자들이 예수님께 와서 말했습니다. 「어찌하여 우리와 바리새인들은 자주 금식하는데, 당신의 제자들은 금식하지 않습니까?」
  to: 그때 요한의 제자들이 예수님께 와서 말했습니다. “어찌하여 우리와 바리새인들은 자주 금식하는데, 예수님의 제자들은 금식하지 않습니까?”
  rationale: The revision changes only the Korean second-person possessive to a natural referential expression. It preserves the question’s addressee, contrast, customary aspect, and the frequency nuance of πολλά without adding a theological title or interpretive claim.
