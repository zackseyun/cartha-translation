  source_fidelity: 초안의 ‘피리 부는 자들’, ‘떠들썩한 무리’, 그리고 두 분사의 연속은 대체로 원문을 반영합니다. 그러나 ἄρχων은 이 절에서 구체적으로 ‘관리’를 뜻하지 않으므로, 이를 더 넓은 ‘지도자’로 옮겨야 합니다. ‘소란을 피우는’은 θορυβούμενον의 진행 중인 소요를 자연스럽게 나타냅니다.
  naturalness: ‘예수님께서 … 들어가셔서 … 보시고,’는 현대 표준 한국어의 성경 서술 문체로 자연스럽고, 원문의 미완결 절 구조도 보존합니다. ‘피리 부는 사람들’이 ‘피리 부는 자들’보다 현대적입니다.
  terminology: ‘지도자’는 ἄρχων의 넓은 지시 범위를 유지하며, 병행 본문의 회당 지도자라는 정보를 본문에 끌어들이지 않습니다. ‘관리’는 공직자라는 현대적이고 지나치게 특정한 뜻을 암시할 수 있습니다.
