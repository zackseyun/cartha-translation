base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
  footnotes:
  - marker: a
    text: Or 'the official' or, by comparison with parallel accounts, 'the synagogue leader.' Matthew's wording here is simply 'the ruler.'
    reason: alternative_reading
  - marker: b
    text: That is, professional mourners were already present, including flute players customary at funerals.
    reason: cultural_note
  - marker: c
    text: Or 'in an uproar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님께서 그 지도자[a]의 집에 들어가셔서 피리 부는 사람들[b]과 소란을 피우는[c] 무리를 보시고,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘통치자’, ‘관리’. 병행 기록과 비교하면 ‘회당 지도자’로 볼 수도 있습니다. 그러나 마태복음의 표현은 단지 ‘지도자’입니다.
    reason: alternative_reading
  - marker: b
    text: 장례 때 관례적으로 피리 연주자를 포함한 전문 곡하는 이들이 이미 와 있었습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘소란스러워하는’, ‘소동을 벌이는’.
    reason: lexical_alternative
