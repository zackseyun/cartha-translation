    issue: 직접화법의 종결 표현이 합쇼체와 일치하지 않음
    rationale: ‘물러가라’, ‘자고 있다’는 반말체입니다. 지정된 현대 정중체에 맞게 ‘물러가십시오’, ‘자고 있습니다’로 해야 합니다.
  - severity: low
    issue: 두 미완료형의 진행·지속 뉘앙스가 약화됨
    rationale: ἔλεγεν과 κατεγέλων은 모두 미완료형입니다. 한국어에서는 ‘말씀하고 계셨습니다’, ‘비웃고 있었습니다’가 이를 자연스럽게 나타냅니다.
