revisions:
- from: 예수께서 성전에 들어오셔서 가르치고 계실 때, 대제사장들과 백성의 장로들이 예수께 다가와 말했습니다. 「무슨 권위로 이런 일들을 하십니까? 또 누가 당신에게 이런 권위를 주었습니까?」[a]
  to: 예수께서 성전[a]에 들어오셔서 가르치고 계실 때, 수석 제사장들과 백성의 장로들이 예수께 다가와 말했습니다. “무슨 권위로 이런 일들을 하십니까? 또 누가 당신에게 이런 권위를 주었습니까?”
  rationale: 원문의 시간 관계와 권위에 관한 질문은 유지했습니다. 지도적 제사장 집단을 뜻하는 ἀρχιερεῖς를 ‘수석 제사장들’로 조정했으며, 성전 구역을 설명하는 각주 표지를 ‘성전’에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:45Z'
review_pass:
  verdict: revise
  source_fidelity: 시간적 속격절과 동시적 분사(‘성전에 들어오셨을 때’ 및 ‘가르치고 계실 때’)는 본문에서 충실히 반영되었습니다. 다만 οἱ ἀρχιερεῖς는 단수 대제사장의 복수라기보다 지도적 제사장 집단을 가리키므로, ‘대제사장들’보다 ‘수석 제사장들’이 원문의 용례를 더 정확히 드러냅니다.
  naturalness: 전반적으로 현대 표준 한국어 합쇼체에 자연스럽습니다. ‘예수께 다가와 말했습니다’와 질문문의 표현도 자연스럽습니다. 각주 표지는 성전의 의미를 설명하므로 해당 낱말 바로 뒤에 놓는 편이 독자의 이해와 표지 원칙에 맞습니다.
  terminology: ἱερόν은 본문에서 ‘성전’으로 유지하고 각주에서 성소에 한정되지 않는다는 점을 설명하는 것이 적절합니다. ἐξουσία는 행위의 정당한 권한·권위에 관한 질문이므로 ‘권위’가 적절합니다. ἀρχιερεῖς는 ‘수석 제사장들’로 옮겨 복수의 대제사장 직분자를 뜻한다는 오해를 피했습니다.
