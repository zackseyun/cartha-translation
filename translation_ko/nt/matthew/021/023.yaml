id: MAT.21.23
reference: Matthew 21:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
  footnotes:
  - marker: a
    text: Greek ἱερόν refers to the temple complex or precincts, not specifically the inner sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 예수께서 성전[a]에 들어오셔서 가르치고 계실 때, 수석 제사장들과 백성의 장로들이 예수께 다가와 말했습니다. “무슨 권위로 이런 일들을 하십니까? 또 누가 당신에게 이런 권위를 주었습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἱερόν은 성전의 중심 성소만이 아니라 성전 복합 구역 전체를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἱερὸν
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 성전 뜰
  - 성전 구역
  lexicon: BDAG
  rationale: ἱερόν은 성전 복합 구역을 가리키므로, 한국어에서는 본문 흐름에 자연스러운 ‘성전’으로 옮기되 inner sanctuary로 한정하지 않았습니다.
- source_word: προσῆλθον αὐτῷ
  english_pob_choice: came up to him
  chosen_korean: 예수께 다가와
  alternatives_korean:
  - 예수께 나아와
  - 예수께 와서
  lexicon: BDAG
  rationale: 접근의 동작을 살리면서도 대화 장면에 자연스러운 한국어로 ‘다가와’라고 옮겼습니다.
- source_word: διδάσκοντι
  english_pob_choice: while he was teaching
  chosen_korean: 가르치고 계실 때
  alternatives_korean:
  - 가르치시는 중에
  - 가르치고 있을 때
  lexicon: BDAG
  rationale: 동시적 행위를 분명히 드러내기 위해 ‘-고 계실 때’로 처리했습니다.
- source_word: ἐξουσία
  english_pob_choice: authority
  chosen_korean: 권위
  alternatives_korean:
  - 권한
  - 권세
  lexicon: BDAG
  rationale: 이 질문은 예수의 행위와 가르침을 정당화하는 근거를 묻는 것이므로, 제도적·신학적 뉘앙스를 함께 살리는 ‘권위’가 가장 적절합니다.
theological_decisions:
- issue: 지도자들의 질문이 겨냥하는 바
  chosen_reading: 예수의 성전 행동과 가르침에 대한 정당한 위임 여부를 묻는 도전으로 읽었습니다.
  alternative_readings:
  - 단순한 능력 과시 여부를 묻는 것으로 읽기
  - 법적 권한만을 묻는 것으로 읽기
  rationale: 문맥상 성전에서의 행위와 가르침에 대한 승인 출처를 캐묻는 장면이므로, ‘권위’라는 질문의 날을 약화시키지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
