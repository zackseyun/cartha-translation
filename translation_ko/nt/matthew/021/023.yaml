    rationale: 여기서 복수형은 여러 명의 단수 대제사장 직임자를 뜻하기보다 지도적 제사장들을 가리킵니다. ‘수석 제사장들’은 영어 POB의 ‘chief priests’ 및 원문의 제도적 의미를 더 정확히 반영합니다.
