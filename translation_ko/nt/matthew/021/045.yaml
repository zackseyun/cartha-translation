id: MAT.21.45
reference: Matthew 21:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
  footnotes:
  - marker: a
    text: Or 'concerning them'; the sense is that they recognized the parables were directed at them. Some translations render more interpretively, 'against them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 대제사장들과 바리새인들이 그의 비유들을 듣고 나서, 그것이 자기들을 두고 하신 말씀인 줄 알았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에 관하여’입니다. 문맥상 예수께서 그들을 겨냥해 말씀하신 것이 분명하지만, 그리스어 표현 자체는 ‘반대하여’까지는 직접 뜻하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  english_pob_choice: when [they] heard
  chosen_korean: 듣고 나서
  alternatives_korean:
  - 들었을 때
  - 들은 뒤에
  lexicon: BDAG
  rationale: 부사절 역할의 부정과거 분사로, 앞선 사건을 자연스럽게 나타내는 한국어 연결 표현으로 옮겼습니다.
- source_word: ἀρχιερεῖς
  english_pob_choice: chief priests
  chosen_korean: 대제사장들
  alternatives_korean:
  - 수석 제사장들
  - 제사장 지도자들
  lexicon: BDAG
  rationale: 복수형의 성전 지도층을 가리키므로, 관용적으로 이해되는 ‘대제사장들’을 택했습니다.
- source_word: παραβολὰς
  english_pob_choice: parables
  chosen_korean: 비유들
  alternatives_korean:
  - 비유 말씀들
  - 비유적인 말씀들
  lexicon: BDAG
  rationale: 예수의 비유 장르를 그대로 살려, 복수형을 반영해 ‘비유들’로 옮겼습니다.
- source_word: περὶ αὐτῶν
  english_pob_choice: about them
  chosen_korean: 자기들을 두고
  alternatives_korean:
  - 자기들에 관해
  - 자기들에 대하여
  lexicon: BDAG
  rationale: περί + 대격이 단순히 ‘관하여’의 의미를 가지므로, 본문의 맥락상 대상이 분명히 드러나면서도 ‘against’처럼 적대 의미를 과도하게 넣지 않는 표현을 택했습니다.
theological_decisions:
- issue: 말씀의 방향을 ‘반대하여’로 강하게 만들지 여부
  chosen_reading: ‘자기들을 두고 하신 말씀’으로 유지해, 문맥상 책망의 뉘앙스는 살리되 본문에 없는 적대 의미는 본문에 직접 넣지 않았습니다.
  alternative_readings:
  - 자기들을 향해 하신 말씀
  - 자기들을 반대하여 하신 말씀
  rationale: 그리스어는 περὶ αὐτῶν(‘그들에 관하여’)라고만 말하므로, 해석상 가능한 비판성은 유지하되 번역문에서는 과도한 단정으로 확장하지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 말하는 것과 문맥이 암시하는 것을 구분하고, 어휘가 보장하지 않는 강한 의미는 본문에 삽입하지 않습니다.'
