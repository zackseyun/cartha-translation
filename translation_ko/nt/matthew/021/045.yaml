  source_fidelity: ‘대제사장들’, ‘바리새인들’, ‘비유들’, 그리고 ‘자기들에 관하여’는 원문의 의미를 충실히 반영합니다. 다만 원문은 복수인 ‘그의 비유들’을 듣고 예수께서 자신들에 관해 말씀하신다고 깨달았다는 구조이므로, 초안의 단수 ‘그것이’와 ‘말씀인 줄’은 복수 선행사 및 발화 행위를 다소 흐리게 합니다.
  naturalness: 초안은 전반적으로 자연스럽고 합쇼체에도 맞습니다. 그러나 ‘그것이 자기들을 두고 하신 말씀’은 복수인 ‘비유들’을 단수로 뭉뚱그리며, ‘그의’의 지시 대상도 문장 내부에서는 불필요하게 모호할 수 있습니다. 예수님을 명시하고 ‘말씀하고 계셨다는 것’으로 옮기면 더 명료하고 자연스럽습니다.
  terminology: ‘대제사장들’, ‘바리새인들’, ‘비유들’은 표준적인 성경 용어입니다. ‘관하여’는 περί+속격의 비적대적 의미를 적절히 보존합니다. 참고로 초안의 어휘 해설에서 περί αὐτῶν을 ‘περί + 대격’이라고 한 문법 설명은 사실과 다르며, 여기서는 속격입니다.
