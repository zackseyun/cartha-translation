    rationale: 원문은 ‘그의 비유들’을 들은 뒤 ‘그가 자신들에 관하여 말씀하고 있다’고 알았다는 절 구조입니다. 수정문은 복수 비유와 예수님의 발화 행위를 더 직접적으로 반영합니다.
