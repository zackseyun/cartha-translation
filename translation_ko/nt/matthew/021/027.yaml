id: MAT.21.27
reference: Matthew 21:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: ko
  text: 그들이 예수님께 대답하여 말했습니다. “우리는 알지 못합니다.” 예수님도 그들에게 말씀하셨습니다. “그러면 나도 내가 이런 일들을 무슨 권위로 하는지 말하지 않겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 현재형 λέγω는 이 문맥에서 한국어의 자연스러운 거절 표현인 ‘말하지 않겠습니다’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: ἀποκριθέντες τῷ Ἰησοῦ εἶπαν
  english_pob_choice: And answering Jesus, they said
  chosen_korean: 그들이 예수님께 대답하여 말했습니다
  alternatives_korean:
  - 그들은 예수님께 대답했습니다
  - 예수님께 답하여 그들이 말했습니다
  lexicon: BDAG
  rationale: 분사 ἀποκριθέντες의 응답 구조를 살리되 한국어에서는 자연스럽게 본동사로 풀어 ‘대답하여 말했습니다’로 옮겼습니다.
- source_word: Οὐκ οἴδαμεν
  english_pob_choice: We do not know
  chosen_korean: 우리는 알지 못합니다
  alternatives_korean:
  - 모르겠습니다
  - 우리는 모릅니다
  lexicon: BDAG
  rationale: 단순한 지식 부정을 직접적으로 옮기기 위해 ‘알지 못합니다’를 택했습니다. 대화의 공식성을 위해 축약형보다 완전형이 적절합니다.
- source_word: καὶ αὐτός
  english_pob_choice: He also
  chosen_korean: 예수님도
  alternatives_korean:
  - 그리고 그분도
  - 그도
  lexicon: BDAG
  rationale: 대응 발화를 표시하는 표현이므로, 예수님의 응답을 자연스럽게 이어 주는 ‘예수님도’로 처리했습니다.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  english_pob_choice: by what authority
  chosen_korean: 무슨 권위로
  alternatives_korean:
  - 어떤 권위로
  - 어느 권한으로
  lexicon: BDAG
  rationale: ἐξουσία를 단순한 힘이 아니라 정당한 근거와 자격의 문제로 이해하여, 한국어에서는 ‘권위’로 옮겼습니다. 전치사구는 행위의 근거를 나타내는 관용적 표현인 ‘무슨 권위로’가 자연스럽습니다.
- source_word: ταῦτα ποιῶ
  english_pob_choice: I do these things
  chosen_korean: 내가 이런 일들을 … 하는지
  alternatives_korean:
  - 내가 이것들을 … 하는지
  - 내가 이 일들을 … 하는지
  lexicon: BDAG
  rationale: 복수 지시사 ταῦτα를 반영해 ‘이런 일들’로 옮겼고, 현재형 ποιῶ는 문맥상 예수님의 행위 전체를 가리키는 말로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 예수님의 응답에서 말하지 않겠다는 거절의 뉘앙스
  chosen_reading: 직접적인 정보 제공 거절로 옮겨, 질문의 핵심인 권위의 근거를 밝히지 않겠다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘말하지 않겠습니다’보다 ‘대답하지 않겠습니다’로 일반화하는 해석
  - ‘알려 주지 않겠습니다’로 바꾸는 해석
  rationale: λέγω ὑμῖν은 단순 발화보다 ‘말해 주다/알려 주다’의 거절로 읽히므로, 문맥의 대립 효과를 살려 번역했습니다.
  doctrine_reference: Translation philosophy §1, §5
