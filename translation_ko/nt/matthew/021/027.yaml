revisions:
- from: 그들이 예수님께 대답하여 말했습니다. “우리는 알지 못합니다.” 예수님도 그들에게 말씀하셨습니다. “그러면 나도 내가 이런 일들을 무슨 권위로 하는지 말하지 않겠습니다.”[a]
  to: 그들이 예수님께 대답했습니다. “우리는 알지 못합니다.” 예수님도 그들에게 말씀하셨습니다. “나도 내가 무슨 권위로 이런 일들을 하는지 여러분에게 말하지 않겠습니다.”
  rationale: 원문에 없는 ‘그러면’을 삭제하여 예수님의 대응 발화라는 의미만 남겼습니다. 또한 중복적인 서술을 다듬고, ἐν ποίᾳ ἐξουσίᾳ 및 ταῦτα ποιῶ를 각각 ‘무슨 권위로’, ‘이런 일들을 하는지’로 보존했습니다. 현재형 λέγω가 이 문맥에서 미래적 거절로 자연스럽게 표현되는 점은 번역문 자체로 충분히 드러나므로 별도 역자 주석은 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
