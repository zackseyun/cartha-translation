id: MAT.21.26
reference: Matthew 21:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
  footnotes:
  - marker: a
    text: Or “of human origin.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 우리가 ‘사람들에게서’라고 말하면, 우리는 군중을 두려워합니다. 그들이 모두 요한을 예언자로 여기기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간에게서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  english_pob_choice: But if we say
  chosen_korean: 그러나 만일 우리가 …라고 말하면
  alternatives_korean:
  - 그러나 우리가 …라고 말하면
  - 만일 우리가 …라고 말하면
  lexicon: BDAG
  rationale: ἐὰν + 접속법은 가정적 조건을 나타내므로, 한국어에서는 ‘그러나 만일 우리가 …라고 말하면’으로 자연스럽고 문맥의 deliberative force를 살렸습니다.
- source_word: Ἐξ ἀνθρώπων
  english_pob_choice: From men
  chosen_korean: ‘사람들에게서’
  alternatives_korean:
  - ‘인간에게서’
  - ‘사람의 기원에서’
  - ‘사람에게서’
  lexicon: BDAG
  rationale: 직전 문맥의 ‘하늘에서’와 대조되는 출처를 나타내므로, ‘사람들에게서’로 짧고 직접적으로 옮겨 원문의 출처 대비를 보존했습니다.
- source_word: τὸν ὄχλον
  english_pob_choice: the crowd
  chosen_korean: 군중
  alternatives_korean:
  - 무리
  - 백성
  - 사람들
  lexicon: BDAG
  rationale: ὄχλος는 마태복음에서 모여 있는 군중을 가리키는 경우가 많아, 현대 한국어에서 자연스러운 ‘군중’을 선택했습니다.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  english_pob_choice: regard John as a prophet
  chosen_korean: 요한을 예언자로 여기기
  alternatives_korean:
  - 요한을 예언자라고 여기기
  - 요한을 예언자로 생각하기
  - 요한을 예언자라 인정하기
  lexicon: BDAG
  rationale: ἔχω + 목적어 + ὡς의 관용적 용법은 ‘~로 여기다/간주하다’에 가깝기 때문에, 평가적 의미를 살려 ‘예언자로 여기기’로 옮겼습니다.
theological_decisions:
- issue: ‘Ἐξ ἀνθρώπων’의 대조 구조
  chosen_reading: ‘사람들에게서’로 옮겨 하늘/사람 출처 대비를 유지했습니다.
  alternative_readings:
  - ‘인간에게서’
  - ‘인간의 기원에서’
  rationale: 이 절은 앞선 문맥의 ‘하늘에서’와 맞물려 권위의 출처를 대조하므로, 설명을 덧붙이기보다 짧은 직접 표현으로 대비를 선명하게 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
- issue: 군중이 요한을 보는 평가
  chosen_reading: ‘요한을 예언자로 여기기’로 번역해 군중의 인식을 서술적으로 유지했습니다.
  alternative_readings:
  - ‘요한을 예언자로 인정하기’
  - ‘요한을 예언자라고 생각하기’
  rationale: 이 진술은 군중의 일반적 평가를 보고할 뿐이며, 번역이 그 평가를 확대하거나 축소하지 않도록 중립적인 서술을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Affirmations; §Translation philosophy, point 3
