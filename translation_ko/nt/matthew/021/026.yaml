revisions:
- from: 그러나 만일 우리가 ‘사람들에게서’라고 말하면, 우리는 군중을 두려워합니다. 그들이 모두 요한을 예언자로 여기기 때문입니다.[a]
  to: 그러나 우리가 ‘사람에게서’라고 말하면[a] 군중이 두렵습니다. 모두가 요한을 예언자로 여기기 때문입니다.
  rationale: 인간적 출처와 하늘의 출처 사이의 원문 대조를 한국어 관용 표현인 ‘사람에게서’로 보존하고, 각주를 해당 어휘에 연결했습니다. 나머지 표현은 원문의 조건적 숙고, 군중에 대한 두려움, 그리고 요한에 대한 군중의 평가를 자연스럽고 중립적으로 전달합니다.
  reviewer_model: gpt-5.6-terra
