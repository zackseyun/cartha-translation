    rationale: 어휘 대안 각주는 ‘사람에게서’라는 번역어에 직접 붙어야 합니다. 현 위치인 문장 끝에서는 어느 표현의 대안인지 불분명합니다.
  revised_text: 그러나 우리가 ‘사람에게서’라고 말하면[a] 군중이 두렵습니다. 모두가 요한을 예언자로 여기기 때문입니다.
