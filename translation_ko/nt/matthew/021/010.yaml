id: MAT.21.10
reference: Matthew 21:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
  footnotes:
  - marker: a
    text: Or “was shaken.” The Greek verb can mean to shake physically or, as here, to describe public agitation.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 예루살렘에 들어가시자 온 성이 동요하여 「이분이 누구십니까?」 하고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “흔들렸다.” 그리스어 동사는 물리적으로 흔들리는 것을 뜻할 수도 있고, 여기서는 도시 전체의 공적 동요를 나타낼 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  english_pob_choice: when he entered
  chosen_korean: 예수께서 … 들어가시자
  alternatives_korean:
  - 예수께서 … 들어가셨을 때
  - 예수께서 … 들어가신 뒤에
  - 예수께서 … 들어가시는 동안
  lexicon: BDAG
  rationale: 분사구문을 한국어 시간 부사절로 자연스럽게 옮기되, 본문의 행위 순서를 분명히 하기 위해 ‘들어가시자’를 택했습니다.
- source_word: Ἱεροσόλυμα
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘 성
  - 예루살렘 도성
  lexicon: BDAG
  rationale: 지명은 한국어 성경에서 널리 정착된 표기를 따랐습니다.
- source_word: ἐσείσθη
  english_pob_choice: was stirred up
  chosen_korean: 크게 동요하며
  alternatives_korean:
  - 흔들리며
  - 요동하며
  - 들썩이며
  lexicon: BDAG
  rationale: 직역하면 ‘흔들리다’이지만, 도시 전체의 반응이라는 문맥상 물리적 진동보다 집단적 소동·불안을 드러내는 표현이 더 적절합니다.
- source_word: Τίς ἐστιν οὗτος;
  english_pob_choice: Who is this?
  chosen_korean: 이 사람이 누구냐
  alternatives_korean:
  - 이분이 누구냐
  - 저 사람이 누구냐
  - 누구십니까
  lexicon: BDAG
  rationale: 직접 인용된 질문의 의미를 살리되, 군중의 놀람과 거리감을 드러내는 자연스러운 한국어 의문문으로 옮겼습니다.
theological_decisions:
- issue: 도시의 반응을 물리적 진동으로 볼지, 집단적 동요로 볼지
  chosen_reading: ‘온 성이 크게 동요하며’로 옮겨 공적 소동의 의미를 드러냈습니다.
  alternative_readings:
  - 온 성이 흔들리며
  - 온 성이 요동하며
  rationale: 본문은 지진 묘사가 아니라 예수의 입성에 대한 도시 전체의 반응을 말하므로, 원문의 은유를 유지하면서 문맥상 의도를 분명히 해야 합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; source sense in context.'
