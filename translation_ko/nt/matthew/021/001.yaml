  source_fidelity: 현 번역은 앞의 복수 동사 ἤγγισαν·ἦλθον을 예수의 단수 행위(‘예수께서 … 오셔서 … 이르셨을 때’)로 바꾸어, 원문의 서술 주어와 수를 보존하지 못합니다. 또한 예수의 이름이 뒤에 처음 명시되는 원문의 흐름이 중복된 ‘예수께서’로 사라집니다. 복수 주어를 보충하지 않은 채 ‘그들이’로 옮기고, 이어서 예수께서 제자들을 보내시는 것으로 고쳐야 합니다.
  naturalness: ‘그들이 예루살렘에 가까이 다가가 감람산에 있는 벳바게에 이르렀을 때’는 현대 표준 한국어의 자연스러운 합쇼체 서술이며, 두 이동을 구별합니다. 고유명사는 한국어 성경에서 널리 쓰이는 ‘벳바게’를 사용했습니다.
