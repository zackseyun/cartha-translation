source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
  footnotes:
  - marker: a
    text: Or 'drew near to Jerusalem and came to Bethphage, to the Mount of Olives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 예루살렘에 가까이 오셔서 감람산에 있는 베드파게에 이르셨을 때, 예수께서 두 제자를 보내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘에 가까이 가서 베드파게, 곧 감람산에 이르셨을 때’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγγισαν / ἦλθον
  english_pob_choice: came near / came to
  chosen_korean: 가까이 오셔서 / 이르셨을 때
  alternatives_korean:
  - 다가가서 / 도착하셨을 때
  - 가까이 이르러 / 왔을 때
  lexicon: BDAG
  rationale: 두 이동 동사를 구분해, 첫째는 예루살렘에 대한 접근, 둘째는 베드파게에의 도착을 자연스러운 현대 한국어로 살렸습니다.
- source_word: Ἱεροσόλυμα
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
  alternatives_korean:
  - 예루살렘
  lexicon: BDAG
  rationale: 통용되는 고유명사 표기를 따랐습니다.
- source_word: Ὄρος τῶν Ἐλαιῶν
  english_pob_choice: Mount of Olives
  chosen_korean: 감람산
  alternatives_korean:
  - 올리브산
  lexicon: BDAG
  rationale: 한국어 성경 전통에서 널리 쓰이는 지명을 유지하되, 뒤의 전치사구는 위치를 나타내는 말로 자연스럽게 연결했습니다.
- source_word: ἀπέστειλεν δύο μαθητάς
  english_pob_choice: sent two disciples
  chosen_korean: 두 제자를 보내셨습니다
  alternatives_korean:
  - 두 제자를 파견하셨습니다
  - 두 제자를 보냈습니다
  lexicon: BDAG
  rationale: μαθητάς는 복음서 문맥에서 '제자'가 가장 직접적이며, ἀπέστειλεν은 사명 부여의 뉘앙스를 살리면서도 과도하게 격식화하지 않았습니다.
theological_decisions:
- issue: 본문에 드러난 서술 주어의 처리
  chosen_reading: 앞의 복수 동사는 주어를 덧붙이지 않고, 후반에 예수께서 명시될 때 자연스럽게 이어지도록 했습니다.
  alternative_readings:
  - '''예수와 제자들이 예루살렘에 가까이 오셨다가...''로 명시하기'
  rationale: 헬라어는 서술 경제성을 유지하며 복수 동사를 먼저 놓고, 예수를 뒤에서 명시합니다. 본문에 없는 주어를 보태지 않고 그 흐름을 따랐습니다.
  doctrine_reference: Translation philosophy §1, §3
