  to: 그들이 예루살렘에 가까이 다가가 감람산에 있는 벳바게[a]에 이르렀을 때, 예수께서 두 제자를 보내셨습니다.
  rationale: 복수 이동 동사를 ‘그들이’로 보존하되, 그 집단의 구성원을 본문에 없는 말로 특정하지 않았습니다. ἤγγισαν은 ‘가까이 다가가’, ἦλθον은 ‘이르렀을 때’로 구별했습니다. 감람산과 벳바게의 지리적 연결은 본문에서 자연스럽게 ‘감람산에 있는 벳바게’로 옮기고, 다른 구문 가능성은 각주에 남겼습니다.
