theological_decisions:
- issue: μεταμεληθεὶς의 신학적 뉘앙스
  chosen_reading: 마음을 바꾸고
  alternative_readings:
  - 후회하고
  - 회개하고
  rationale: 이 비유는 도덕적 평가를 직접 규정하기보다 거절에서 순종으로의 방향 전환을 보여 줍니다. '회개하다'는 μετανοέω의 뉘앙스를 지나치게 불러올 수 있어, 원문이 허용하는 범위 안에서 중립적이고 정확한 표현을 택했습니다.
