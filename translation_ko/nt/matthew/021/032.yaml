id: MAT.21.32
reference: Matthew 21:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
  footnotes:
  - marker: a
    text: Or 'in a righteous way' or 'in the path of righteousness.' The Greek phrase can describe either John's manner of life/ministry or the righteous way he proclaimed.
    reason: lexical_alternative
  - marker: b
    text: Or 'you did not trust him.' The Greek verb can carry the sense of believing or trusting a person.
    reason: lexical_alternative
  - marker: c
    text: Or 'you did not later repent so as to believe him.' The verb here is not the more common μετανοέω but μεταμέλομαι, which more specifically suggests a change of mind or regret.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜냐하면 요한이 의의 길로 너희에게 왔으나 너희는 그를 믿지 않았습니다. 그러나 세리와 창녀들은 그를 믿었습니다. 그런데 너희는 이것을 보고도 끝내 마음을 돌이켜 그를 믿게 되지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로운 방식으로’ 또는 ‘의의 길 안에서’. 이 그리스어 구절은 요한의 삶과 사역의 방식, 또는 그가 선포한 의의 길을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 신뢰하지 않았습니다’. 여기서 그리스어 동사는 사람을 믿다/신뢰하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘뒤늦게 회개하여 그를 믿게 되지 않았습니다’. 여기의 동사는 더 흔한 μετανοέω가 아니라 μεταμέλομαι로, 마음의 변화나 뉘우침을 더 구체적으로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὁδῷ δικαιοσύνης
  english_pob_choice: in the way of righteousness
  chosen_korean: 의의 길로
  alternatives_korean:
  - 의 가운데로
  - 의로운 길로
  - 의의 길 안에서
  lexicon: BDAG
  rationale: ὁδός의 비유를 살리기 위해 ‘길’로 옮기고, δικαιοσύνη는 기본 대응어인 ‘의’를 유지했습니다. 한국어에서는 ‘의의 길’이 문맥상 가장 자연스럽고, ‘의로운 길’보다 원문의 명사적 구조를 더 잘 드러냅니다.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  english_pob_choice: you did not believe him / believed him
  chosen_korean: 그를 믿지 않았습니다 / 그를 믿었습니다
  alternatives_korean:
  - 그를 믿어 주지 않았습니다
  - 그를 신뢰하지 않았습니다
  - 그를 믿지 않았습니다
  lexicon: BDAG
  rationale: 여기서는 대상이 사람인 πιστεύω의 직접적 의미를 살려 ‘그를 믿다’로 옮겼습니다. ‘신뢰하다’도 가능하지만, 앞뒤 대조를 가장 간단하고 분명하게 살립니다.
- source_word: τελῶναι καὶ αἱ πόρναι
  english_pob_choice: the tax collectors and the prostitutes
  chosen_korean: 세리와 창녀들
  alternatives_korean:
  - 세리와 매춘부들
  - 세리들과 창녀들
  - 세금 징수원들과 창녀들
  lexicon: BDAG
  rationale: τελῶναι는 통상적 한국어 성경 어휘인 ‘세리’로, πόρναι는 가장 직접적인 대응인 ‘창녀들’로 옮겼습니다. 원문의 사회적·도덕적 충격을 약화시키지 않기 위해 완곡한 표현은 피했습니다.
- source_word: μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ
  english_pob_choice: you did not afterward change your minds so as to believe him
  chosen_korean: 끝내 마음을 돌이켜 그를 믿게 되지 않았습니다
  alternatives_korean:
  - 나중에 마음을 돌이켜 그를 믿도록 하지 않았습니다
  - 뒤늦게 회개하여 그를 믿게 되지 않았습니다
  - 후에 뉘우쳐 그를 믿게 되지 않았습니다
  lexicon: BDAG
  rationale: μεταμέλομαι는 μετανοέω와 달리 ‘회개’보다 ‘마음을 돌이키다/뉘우치다’의 뉘앙스가 더 가깝기 때문에, 구별을 살리면서도 자연스러운 한국어로 ‘마음을 돌이키다’를 택했습니다. τοῦ πιστεῦσαι의 목적성을 반영해 결과적으로 ‘믿게 되지 않았다’로 연결했습니다.
theological_decisions:
- issue: μετεμελήθητε의 번역에서 ‘회개’ 사용 여부
  chosen_reading: ‘마음을 돌이켜’로 옮기고 ‘회개’는 쓰지 않았습니다.
  alternative_readings:
  - 뒤늦게 회개하다
  - 뉘우치다
  rationale: 본문은 통상적 회개 동사 μετανοέω가 아니라 μεταμέλομαι를 사용하므로, 그 차이를 지우지 않기 위해 ‘회개’ 대신 더 좁은 의미의 표현을 택했습니다. 이는 요한의 선포를 듣고도 응답하지 않은 책임을 부각합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5, consistency of key terms or documented exception'
