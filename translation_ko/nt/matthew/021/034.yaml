- from: 그런데 열매를 거둘 때가 가까워지자, 그는 자기 종들을 농부들에게 보내어 자기 열매를 거두게 했습니다.
  to: 그런데 열매를 거둘 때가 가까워지자, 그는 자기 종들을 농부들에게 보내어 자기 열매를 받으려고 했습니다.
  rationale: The final clause is revised to express the purpose of sending the servants—receiving the owner's fruit from the farmers—without suggesting that they themselves were sent to perform the harvest. The temporal and agricultural wording is otherwise retained.
