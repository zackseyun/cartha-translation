id: MAT.21.34
reference: Matthew 21:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
  footnotes:
  - marker: a
    text: Or 'his slaves.' The Greek word doulous can mean either 'servants' or 'slaves'; here 'servants' was chosen because the parable emphasizes their representative role as the landowner's agents rather than their bonded status.
    reason: lexical_alternative
  - marker: b
    text: Or 'farmers,' 'tenants,' or 'vine-growers.' The Greek geōrgous refers to cultivators; 'tenant farmers' makes explicit their role in leasing and working another man's vineyard in this parable.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 열매를 거둘 때가 가까워지자, 그는 자기 종들을 농부들에게 보내어 자기 열매를 받으려고 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε δὲ ἤγγισεν
  english_pob_choice: But when ... had drawn near
  chosen_korean: 그런데 ... 가까워지자
  alternatives_korean:
  - 그리고 ... 가까워지자
  - 그런데 ... 가까워졌을 때
  lexicon: BDAG
  rationale: ὅτε δέ의 시간 전환과 약한 대조를 한국어의 “그런데”로 살리고, ἤγγισεν은 서술 흐름에 맞게 “가까워지자”로 옮겼습니다.
- source_word: ὁ καιρὸς τῶν καρπῶν
  english_pob_choice: the season for fruit
  chosen_korean: 열매를 거둘 때
  alternatives_korean:
  - 열매의 때
  - 수확철
  lexicon: BDAG
  rationale: καιρός는 단순한 시각보다 정해진 때/철의 뉘앙스가 있어, 농경 비유에 맞는 “열매를 거둘 때”로 자연스럽게 표현했습니다.
- source_word: τοὺς δούλους αὐτοῦ
  english_pob_choice: his servants
  chosen_korean: 자기 종들을
  alternatives_korean:
  - 자기 노예들을
  - 자기 하인들을
  lexicon: BDAG
  rationale: δώλους은 문맥상 주인의 대리인들이라는 역할이 핵심이므로, 본문 의미를 과도하게 사회제도로 환원하지 않는 “종”을 택했습니다.
- source_word: τοὺς γεωργοὺς
  english_pob_choice: the tenant farmers
  chosen_korean: 농부들에게
  alternatives_korean:
  - 소작농들에게
  - 밭가는 이들에게
  lexicon: BDAG
  rationale: γεωργός는 일반적으로 농사짓는 사람/경작자를 뜻하므로 기본 의미를 살린 “농부들”로 옮겼습니다. 문맥상 소작의 뉘앙스는 비유 전체에서 드러납니다.
- source_word: λαβεῖν τοὺς καρποὺς αὐτοῦ
  english_pob_choice: to collect his fruits
  chosen_korean: 자기 열매를 거두게 했습니다
  alternatives_korean:
  - 자기 열매를 받게 했습니다
  - 자기 열매를 거두러 보냈습니다
  lexicon: BDAG
  rationale: λαβεῖν은 여기서 소유주의 몫을 받아오는 의미이므로 “거두다”를 사용했고, τοὺς καρπούς는 복수형을 반영해 “열매”를 유지했습니다.
theological_decisions:
- issue: δοῦλος의 사회적 지위 표현
  chosen_reading: 문맥상 대리인으로서의 역할이 중심이므로 “종”으로 번역했습니다.
  alternative_readings:
  - 노예
  - 하인
  rationale: 이 비유는 사절의 신분 자체보다 포도원의 주인이 보낸 사람들의 대표성을 강조하므로, bonded status를 전면화하는 번역은 본문 효과를 왜곡할 수 있습니다.
  doctrine_reference: 비유 본문 문맥
