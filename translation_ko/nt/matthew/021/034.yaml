review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal transition, the approaching fruit season, the sending of the owner's servants, and the destination. However, “자기 열매를 거두게 했습니다” can mean that the servants were made to harvest the fruit themselves. The infinitive λαβεῖν means to receive/take the fruit from the growers, not to harvest it.
  naturalness: The draft is generally fluent in modern formal-polite Korean. Revising the final purpose clause avoids the potentially misleading repetition of ‘harvest’ and gives a more natural account of the owner's claimed yield.
  terminology: “종들” is an acceptable contextual rendering of δούλους, and “농부들” preserves the basic sense of γεωργούς. No doctrinal terminology is at issue. “열매” can naturally function as a collective noun in Korean despite the Greek plural forms.
  issues:
  - severity: medium
    issue: ‘거두게 했습니다’ may portray the servants as harvesting the fruit.
    rationale: In this context λαβεῖν τοὺς καρποὺς αὐτοῦ concerns receiving or obtaining the owner's fruit from the growers. The Korean wording should distinguish this from physically harvesting (거두다), which is already used in ‘열매를 거둘 때.’
  revised_text: 그런데 열매를 거둘 때가 가까워지자, 그는 자기 종들을 농부들에게 보내어 자기 열매를 받으려고 했습니다.
  revised_footnotes: []
  revision_rationale: The final clause is revised to express the purpose of sending the servants—receiving the owner's fruit from the farmers—without suggesting that they themselves were sent to perform the harvest. The temporal and agricultural wording is otherwise retained.
