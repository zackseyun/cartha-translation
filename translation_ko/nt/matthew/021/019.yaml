review_pass:
  verdict: revise
  source_fidelity: 핵심 동작과 결과는 대체로 충실하지만, 발화의 「…나지 않게 하라」는 한국어에서 제3자에게 내리는 명령처럼 들려, 무화과나무를 향한 그리스어의 소원·저주적 선언(Μηκέτι … γένηται)을 정확히 옮기지 못합니다. 또한 ἦλθεν ἐπ’ αὐτήν은 단순히 ‘그리로 가셨으나’보다 ‘가까이 가셔서’가 접근의 뜻을 더 잘 드러냅니다.
  naturalness: 합쇼체 서술은 대체로 자연스럽습니다. 다만 「그리로 가셨으나」의 역접은 원문의 단순 연속을 다소 과도하게 대조시키며, 인용문의 「나지 않게 하라」는 현대 한국어에서 부자연스럽고 문장 기능도 불분명합니다. 각주 표지는 해당 대안이 관계하는 인용문 바로 뒤에 두는 것이 적절합니다.
  terminology: ‘무화과나무’, ‘열매’, ‘길가’, ‘곧’은 적절합니다. ‘잎사귀밖에 아무것도’도 배타적 강조를 잘 살리지만, ‘잎사귀 외에는 아무것도’가 문장 안에서 더 매끄럽습니다. 원문의 ‘더 이상’과 ‘영원히’의 누적된 영속성은 본문에 유지했습니다.
  issues:
  - severity: high
    issue: 「이제부터 영원히 너에게서 열매가 나지 않게 하라」의 문장 기능
    rationale: ‘-게 하라’는 통상 상대에게 어떤 일을 하도록 명하는 형식입니다. 여기서는 나무를 향한 소원·저주적 선언이므로 ‘나지 않기를 바란다’와 같은 소원형으로 옮기는 편이 γένηται의 기능에 충실합니다.
  - severity: medium
    issue: 「그리로 가셨으나」
    rationale: 원문은 ‘그것에게 가까이 가셨고’라는 동작의 연속이며, 역접 ‘-으나’는 원문에 없는 대조를 강화합니다. ‘가까이 가셔서’가 접근과 이어지는 발견을 자연스럽게 표현합니다.
