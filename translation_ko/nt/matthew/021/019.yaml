id: MAT.21.19
reference: Matthew 21:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
  footnotes:
  - marker: a
    text: Or more idiomatically, “May no fruit ever come from you again.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 길가에 있는 무화과나무 하나를 보시고 그리로 가셨으나, 그 나무에서는 잎사귀밖에 아무것도 찾지 못하셨습니다. 그러고 나서 그 나무에 말씀하셨습니다. 「이제부터 영원히 너에게서 열매가 나지 않게 하라.」 그러자 무화과나무가 곧 시들어 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, 「너에게서 다시는 열매가 나오지 않게 하라」.
    reason: alternative_reading
lexical_decisions:
- source_word: συκῆν μίαν
  english_pob_choice: a fig tree
  chosen_korean: 무화과나무 하나
  alternatives_korean:
  - 무화과나무 한 그루
  - 하나의 무화과나무
  lexicon: BDAG
  rationale: μίαν의 ‘one/single’ 값을 살리되, 한국어에서는 관사 없이 수량을 자연스럽게 드러내는 ‘하나’를 붙여 장면의 특정성을 유지했습니다.
- source_word: ἐπὶ τῆς ὁδοῦ
  english_pob_choice: by the road
  chosen_korean: 길가에
  alternatives_korean:
  - 도로 옆에
  - 길 옆에
  lexicon: BDAG
  rationale: 정지된 사물의 위치를 나타내는 표현으로, 문맥상 가장 자연스러운 현대 한국어인 ‘길가에’를 택했습니다.
- source_word: εἰ μὴ φύλλα μόνον
  english_pob_choice: except leaves alone
  chosen_korean: 잎사귀밖에 아무것도
  alternatives_korean:
  - 잎사귀만
  - 잎사귀뿐
  lexicon: BDAG
  rationale: εἰ μὴ와 μόνον의 배타적 강조를 살리기 위해 ‘…밖에 아무것도’로 옮겨, 단순한 정보 전달보다 ‘잎만 있었다’는 대비를 드러냈습니다.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  english_pob_choice: May there no longer ever be fruit from you
  chosen_korean: 이제부터 영원히 너에게서 열매가 나지 않게 하라
  alternatives_korean:
  - 다시는 너에게서 열매가 맺히지 않게 하라
  - 영원히 너에게서 열매가 나오지 않게 하라
  lexicon: BDAG
  rationale: 무화과나무에 대한 선언적 저주/금지의 힘을 살리면서, ‘from you’와 ‘fruit come’의 이미지를 ‘너에게서 열매가 나다’로 비교적 직접적으로 보존했습니다.
- source_word: παραχρῆμα
  english_pob_choice: at once
  chosen_korean: 곧
  alternatives_korean:
  - 즉시
  - 당장
  lexicon: BDAG
  rationale: 즉각성을 나타내되 서술의 흐름을 부드럽게 유지하는 현대 문체로 ‘곧’을 택했습니다.
theological_decisions:
- issue: 예수의 무화과나무에 대한 발화의 문장 기능
  chosen_reading: 명령형/금지형의 선언으로 옮겨, 심판적 발화의 엄중함을 보존했습니다.
  alternative_readings:
  - 미래 예언처럼 옮김
  - 완곡한 소원형으로 완화함
  rationale: 그리스어의 Μηκέτι와 aorist subjunctive가 결합한 문맥은 단순한 설명보다 선언적 금지의 뉘앙스를 가지므로, 이를 약화하지 않는 방향으로 한국어를 구성했습니다.
  doctrine_reference: source-imagery와 심판 발화의 긴장을 본문 수준에서 유지합니다.
