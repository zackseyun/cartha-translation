  rationale: 그리스어의 접근 동작(ἦλθεν ἐπ’ αὐτήν), 잎 외에는 아무것도 없었다는 배타적 강조(εἰ μὴ φύλλα μόνον), 그리고 ‘더 이상’과 ‘영원히’가 결합된 소원·저주적 선언(Μηκέτι … εἰς τὸν αἰῶνα)을 보존했습니다. 명령처럼 들리는 기존 인용문을 소원형으로 고쳐 문법적 기능을 바로잡았고, 각주 표지를 해당 발화 뒤로 옮겼습니다.
