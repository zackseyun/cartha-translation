- from: 그리고 길가에 있는 무화과나무 하나를 보시고 그리로 가셨으나, 그 나무에서는 잎사귀밖에 아무것도 찾지 못하셨습니다. 그러고 나서 그 나무에 말씀하셨습니다. 「이제부터 영원히 너에게서 열매가 나지 않게 하라.」 그러자 무화과나무가 곧 시들어 버렸습니다.[a]
