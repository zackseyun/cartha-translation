  source_fidelity: 원문의 세 동작과 순서(그를 붙잡음, 포도원 밖으로 내던짐, 죽임)를 충실히 반영합니다. λαβόντες를 ‘붙잡아’로 옮긴 것은 문맥상 자연스러운 구체화이며, ἐξέβαλον ἔξω τοῦ ἀμπελῶνος와 ἀπέκτειναν의 순서도 보존합니다.
  naturalness: ‘사람들이 그를 붙잡아 포도원 밖으로 내던지고 죽였습니다’는 현대 표준 한국어 합쇼체로 자연스럽고 간결합니다. 문맥상 선행 명사인 소작인들을 받는 ‘사람들이’도 문법적으로 무리가 없습니다.
  terminology: ‘포도원’은 ἀμπελών에 대한 표준적이고 정확한 번역입니다. ‘죽였습니다’는 ἀπέκτειναν의 중립적 의미를 유지하며, ‘붙잡아’와 ‘내던지고’도 폭력적 사건 서술에 적절합니다.
