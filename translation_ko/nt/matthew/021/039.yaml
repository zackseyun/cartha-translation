id: MAT.21.39
reference: Matthew 21:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
  footnotes:
  - marker: a
    text: Or 'cast him out of the vineyard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들이 그를 붙잡아 포도원 밖으로 내던지고 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  english_pob_choice: took
  chosen_korean: 붙잡아
  alternatives_korean:
  - 데리고
  - 잡고
  lexicon: BDAG
  rationale: aorist participle λαβόντες의 선행 동작을 자연스럽게 살리되, 뒤의 폭력적 동작과 결합될 때 한국어에서는 단순한 ‘갖다’보다 ‘붙잡다’가 문맥의 힘을 더 잘 드러냅니다.
- source_word: ἐξέβαλον ἔξω τοῦ ἀμπελῶνος
  english_pob_choice: threw ... out of the vineyard
  chosen_korean: 포도원 밖으로 내던지고
  alternatives_korean:
  - 포도원에서 내쫓고
  - 포도원 밖으로 쫓아내고
  lexicon: BDAG
  rationale: ἐκβάλλω의 물리적 내보냄을 살려 ‘내던지다’로 옮기고, ἔξω τοῦ ἀμπελῶνος는 ‘포도원 밖으로’로 직역에 가깝게 처리했습니다.
- source_word: ἀμπελῶνος
  english_pob_choice: vineyard
  chosen_korean: 포도원
  alternatives_korean:
  - 포도밭
  - 포도원
  lexicon: BDAG
  rationale: ἀμπελών의 기본 의미를 가장 직접적으로 반영하는 표준어는 ‘포도원’이며, 비유 문맥에서도 자연스럽습니다.
- source_word: ἀπέκτειναν
  english_pob_choice: killed him
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 죽였다고
  - 살해했습니다
  lexicon: BDAG
  rationale: ἀποκτείνω의 기본 의미는 ‘죽이다’이므로, 도덕적 해석을 덧붙이는 ‘살해하다’보다 중립적인 ‘죽이다’가 원문에 가깝습니다.
theological_decisions:
- issue: 마태복음의 사건 순서 보존
  chosen_reading: 포도원 밖으로 내던진 뒤 죽였다고 옮겨, 마가·누가와의 조화를 위해 순서를 바꾸지 않았습니다.
  alternative_readings:
  - 죽이고 나서 밖으로 내던졌다고 암시하는 조화적 번역
  rationale: 헬라어는 ἐξέβαλον ἔξω ... καὶ ἀπέκτειναν의 순서를 분명히 제시하므로, 본문이 말하는 순서를 그대로 반영하는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: Translation philosophy §1, §3
