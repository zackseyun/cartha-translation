id: MAT.21.15
reference: Matthew 21:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
  footnotes:
  - marker: a
    text: Greek ἱερόν refers to the temple complex or precincts, not specifically the inner sanctuary.
    reason: cultural_note
  - marker: b
    text: “Hosanna” is a Hebrew-derived acclamation meaning something like “Save, please” or “Save now,” but by this point it also functions as a shout of praise.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 대제사장들과 서기관들이 그가 행하신 놀라운 일들과 성전에서 「호산나 다윗의 아들에게」라고 외치는 아이들을 보고는 분개했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘성전’은 내부 성소가 아니라 성전 복합체 전체를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘호산나’는 본래 ‘구원하소서’에 가까운 히브리어 감탄사이지만, 여기서는 찬양의 외침으로도 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες δὲ
  english_pob_choice: But when ... saw
  chosen_korean: 그런데 ... 보고는
  alternatives_korean:
  - 그리고 ... 보고
  - 보자마자
  lexicon: BDAG
  rationale: 과거 분사로 이끈 상황 전환을 한국어에서 자연스럽게 나타내면서, δὲ의 약한 대조를 '그런데'로 살렸습니다.
- source_word: τὰ θαυμάσια
  english_pob_choice: the wonderful things
  chosen_korean: 놀라운 일들
  alternatives_korean:
  - 경이로운 일들
  - 기이한 일들
  lexicon: BDAG
  rationale: 구체적으로 '기적들'로 좁히지 않고, 본문의 넓은 의미를 살려 놀라운 행위 전반을 가리키게 했습니다.
- source_word: παῖδας ... κράζοντας
  english_pob_choice: the children crying out
  chosen_korean: 외치는 아이들
  alternatives_korean:
  - 소리치는 아이들
  - 부르짖는 아이들
  lexicon: BDAG
  rationale: παῖδας는 이 문맥에서 '아이들'이 가장 자연스럽고, κράζοντας는 공개적이고 큰 소리의 외침을 '외치는'으로 간결하게 옮겼습니다.
- source_word: Ὡσαννὰ
  english_pob_choice: Hosanna
  chosen_korean: 호산나
  alternatives_korean:
  - 오, 구원하소서
  - 지금 구원하소서
  lexicon: BDAG
  rationale: 이미 예배적 외침으로 굳어진 음역을 본문에 유지하고, 구원의 간구라는 어원적 의미는 주석적 여지를 남겼습니다.
theological_decisions:
- issue: ‘다윗의 아들’의 메시아적 호칭
  chosen_reading: ‘다윗의 아들’로 직역해 메시아 칭호의 힘을 유지했습니다.
  alternative_readings:
  - 다윗의 후손
  - 다윗의 아들인 분
  rationale: 마태복음에서 이 표현은 단순 혈통표현이 아니라 메시아적 칭호이므로, 설명적 풀어쓰기로 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §2
- issue: 성전(ἱερόν)의 범위
  chosen_reading: ‘성전’으로 옮기되, 예배당 내부가 아니라 성전 परिसर 전체를 가리키는 의미를 유지했습니다.
  alternative_readings:
  - 성전 뜰에서
  - 성전 구역에서
  rationale: ἱερόν은 지성소나 내부 성소가 아니라 성전 परिसर을 가리키므로, 본문 이해를 해치지 않는 범위에서 일반적 표현을 사용했습니다.
  doctrine_reference: English audit trail footnote a
