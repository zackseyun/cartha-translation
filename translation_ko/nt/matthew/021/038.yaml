source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
  footnotes:
  - marker: a
    text: Or, more literally, 'have his inheritance'; the sense in context is to take possession of it by force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 소작인들이 아들을 보고는 자기들끼리 말했습니다. 「이 사람이 상속자다. 자, 그를 죽이고 그의 유산을 차지하자.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 단순히 ‘갖다’는 뜻이 아니라, 힘으로 빼앗아 점유한다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ γεωργοὶ
  english_pob_choice: the tenant farmers
  chosen_korean: 소작인들
  alternatives_korean:
  - 농부들
  - 포도원 소작인들
  lexicon: BDAG
  rationale: γεωργοί는 단순한 ‘농부들’보다 포도원을 빌려 경작하는 소작인들의 사회적 역할을 가리키므로, 한국어에서는 ‘소작인들’이 가장 직접적입니다.
- source_word: τὸν υἱόν
  english_pob_choice: the son
  chosen_korean: 아들을
  alternatives_korean:
  - 그 아들을
  - 아들
  lexicon: BDAG
  rationale: 본문은 소유격을 드러내지 않고 ‘그 아들’을 지시하므로, 한국어에서도 이야기 수준의 직설을 살려 ‘아들을’로 옮겼습니다.
- source_word: ἐν ἑαυτοῖς
  english_pob_choice: among themselves
  chosen_korean: 자기들끼리
  alternatives_korean:
  - 서로
  - 속으로
  lexicon: BDAG
  rationale: 복수 주어의 내부 대화를 나타내므로 ‘자기들끼리’가 집단적 자문을 자연스럽게 드러냅니다.
- source_word: κληρονόμος
  english_pob_choice: heir
  chosen_korean: 상속자
  alternatives_korean:
  - 후계자
  - 상속인
  lexicon: BDAG
  rationale: κληρονόμος의 법적·상속 맥락을 살리면서도 한국어에서 분명한 대응이 되는 ‘상속자’를 택했습니다.
- source_word: κληρονομίαν αὐτοῦ
  english_pob_choice: his inheritance
  chosen_korean: 그의 유산을 차지하자
  alternatives_korean:
  - 그의 상속을 차지하자
  - 그 상속을 차지하자
  lexicon: BDAG
  rationale: 문맥상 단순 소유가 아니라 강제로 빼앗아 점유하는 뜻이므로, 영문 POB의 해설에 따라 ‘차지하자’로 힘을 살렸습니다. ‘유산’은 κληρονομία의 직접 대응이지만, 한국어에서 ‘상속자’와의 연결을 유지하면서 소유 대상의 의미를 드러냅니다.
theological_decisions:
- issue: 아들의 지시 대상과 이야기 수준 유지
  chosen_reading: 본문 수준에서는 예수님에 대한 직접 해설을 덧붙이지 않고 ‘아들’로 유지했습니다.
  alternative_readings:
  - ‘예수님’을 암시적으로 드러내는 해석적 번역
  rationale: 마태복음의 서사에서는 비유가 예수님을 가리키지만, 이 절 자체는 비유의 장면을 말하므로 본문이 말하는 긴장을 그대로 보존하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
