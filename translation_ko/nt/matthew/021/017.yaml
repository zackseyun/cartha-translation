base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
  footnotes:
  - marker: a
    text: Or "lodged there" or "spent the night there."
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 떠나 성 밖으로 나가셔서 베다니로 가셨고, 거기서 밤을 지내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거기서 묵으셨습니다”, “거기서 하룻밤을 보내셨습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλιπὼν
  english_pob_choice: leaving
  chosen_korean: 떠나
  alternatives_korean:
  - 남겨 두고
  - 그들을 떠나
  lexicon: BDAG
  rationale: 부사적 분사로서 앞선 동작을 나타내므로, 자연스러운 한국어로는 ‘떠나’가 가장 간결하고 문맥에 맞습니다.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  english_pob_choice: went out of the city
  chosen_korean: 성 밖으로 나가
  alternatives_korean:
  - 도시 밖으로 나가
  - 성읍 밖으로 나가
  lexicon: BDAG
  rationale: ‘나가’가 동작을, ‘성 밖으로’가 ἔξω τῆς πόλεως의 중복된 바깥 이동을 자연스럽게 살립니다.
- source_word: Βηθανίαν
  english_pob_choice: Bethany
  chosen_korean: 베다니
  alternatives_korean:
  - 벳바니
  - 베타니
  lexicon: 표준 외래어 표기
  rationale: 성경 고유명사로 널리 쓰이는 표준 음역은 ‘베다니’입니다.
- source_word: ηὐλίσθη
  english_pob_choice: stayed there overnight
  chosen_korean: 거기서 밤을 지내셨습니다
  alternatives_korean:
  - 거기서 묵으셨습니다
  - 거기서 하룻밤을 보내셨습니다
  lexicon: BDAG
  rationale: 동사의 핵심은 ‘숙박하다/밤을 보내다’이므로, 현대 한국어에서 자연스럽고 의미를 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 예수님의 동작 묘사에서 높임말 처리
  chosen_reading: 서술문 전체를 합쇼체로 유지하되, 예수님을 지칭하는 동사는 ‘나가셨습니다/지내셨습니다’처럼 높임을 반영했습니다.
  alternative_readings:
  - 중립적 평서형으로 처리
  - 예수님 지칭 부분만 낮춤말로 처리
  rationale: 본문은 서술형 역사 내러티브이므로 현대 문어체 합쇼체를 유지하면서도 예수님에 대한 존대는 한국어 관습에 맞게 반영했습니다.
  doctrine_reference: 기독론적 존중 표현의 문체적 관례
- issue: ‘성’의 번역
  chosen_reading: ‘성 밖으로’로 번역해 예루살렘 성읍/도시의 경계 밖 이동을 간결하게 드러냈습니다.
  alternative_readings:
  - ‘도시 밖으로’
  - ‘성읍 밖으로’
  rationale: 문맥상 예루살렘을 가리키며, 한국어에서는 ‘성 밖으로’가 이동 방향과 대비를 가장 직접적으로 보여 줍니다.
  doctrine_reference: 본문 문맥의 지리적 서술
