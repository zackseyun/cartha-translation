source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
  footnotes:
  - marker: a
    text: Or “from God”; Greek “from heaven,” a reverential way of referring to divine origin.
    reason: lexical_alternative
  - marker: b
    text: “From men” means “from human beings,” contrasting merely human origin with heavenly origin.
    reason: lexical_alternative
translation:
  language: ko
  text: 요한의 세례는 어디에서 온 것입니까? 하늘에서[a]입니까, 사람에게서[b]입니까? 그러자 그들은 서로 의논하며 말했습니다. “우리가 ‘하늘에서’라고 말하면, 그가 우리에게 ‘그러면 왜 너희는 그를 믿지 않았습니까?’라고 말할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘에서’는 하나님에게서라는 뜻을 완곡하게 나타내는 유대교의 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람에게서’는 사람 일반, 곧 인간에게서라는 뜻이며, 하늘에서 난 것과 인간에게서 난 것을 대비합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  english_pob_choice: The baptism of John
  chosen_korean: 요한의 세례
  alternatives_korean:
  - 요한의 침례
  - 요한의 세례 행위
  lexicon: BDAG
  rationale: βάπτισμα는 여기서 행위 진행이 아니라 요한과 연관된 세례 전체를 가리키므로, 한국어에서는 자연스럽고 교회적으로도 통용되는 ‘세례’를 기본으로 하되 요한의 소유/연관을 살렸습니다.
- source_word: πόθεν ἦν
  english_pob_choice: where was it from
  chosen_korean: 어디서 났습니까
  alternatives_korean:
  - 어디에서 왔습니까
  - 그 기원이 어디입니까
  lexicon: BDAG
  rationale: πόθεν은 출처·기원을 묻는 말이라 ‘어디서 났습니까’가 현대 한국어에서 자연스럽고, 질문의 초점인 기원성을 살립니다.
- source_word: ἐξ οὐρανοῦ
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하나님에게서
  - 하늘로부터
  lexicon: BDAG
  rationale: 본문의 직역인 ‘하늘에서’를 유지해, 신적 기원을 가리키는 유대식 완곡 표현을 본문 안에서 보존했습니다.
- source_word: ἐξ ἀνθρώπων
  english_pob_choice: from men
  chosen_korean: 사람에게서
  alternatives_korean:
  - 사람들로부터
  - 인간에게서
  lexicon: BDAG
  rationale: ἀνθρώπων은 남성만이 아니라 사람 일반을 가리키므로, 성중립적이면서도 ‘하늘에서’와의 대조가 분명한 ‘사람에게서’를 택했습니다.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  english_pob_choice: they were reasoning among themselves
  chosen_korean: 그들은 서로 의논하며
  alternatives_korean:
  - 그들은 자기들끼리 생각하며
  - 그들은 서로 논의하며
  lexicon: BDAG
  rationale: 미완료 시상의 내적 숙고를 반영하면서도, 공개 발언 전의 계산된 논의를 드러내는 한국어로 ‘서로 의논하며’를 사용했습니다.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  english_pob_choice: did you not believe him
  chosen_korean: 그를 믿지 않았느냐
  alternatives_korean:
  - 그의 말을 믿지 않았느냐
  - 그를 신뢰하지 않았느냐
  lexicon: BDAG
  rationale: πιστεύω의 목적어가 인물이므로, 요한의 메시지와 권위를 받아들이는 의미를 자연스럽게 담는 ‘그를 믿다’를 유지했습니다.
theological_decisions:
- issue: '''from heaven''의 의미를 본문에서 어떻게 드러낼지'
  chosen_reading: ‘하늘에서’를 본문에 그대로 두어 신적 기원의 완곡 표현을 유지했습니다.
  alternative_readings:
  - ‘하나님에게서’로 풀어 설명
  - 각주로만 신적 의미를 처리
  rationale: 본문 자체의 수사적 대조가 ‘하늘에서 / 사람에게서’에 있으므로, 해석어를 본문에 미리 넣기보다 원문 표현을 보존하는 편이 논쟁 장면의 날카로움을 유지합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘사람에게서’의 일반 명사성
  chosen_reading: 성별이 아니라 인간 일반을 가리키는 말로 ‘사람에게서’를 사용했습니다.
  alternative_readings:
  - ‘남자에게서’
  - ‘인간에게서’
  rationale: 본문의 대비는 신적 기원과 인간 기원의 대비이지 남성 대 여성의 대비가 아니므로, 한국어에서는 오해 없이 포괄적인 의미를 드러내는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §4
