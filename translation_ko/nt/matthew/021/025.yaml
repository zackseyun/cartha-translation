revisions:
- from: 요한의 세례가 어디서 났습니까? 하늘에서입니까, 사람에게서입니까? 그러자 그들은 서로 의논하며 말했습니다. 「만일 우리가 ‘하늘에서’라고 하면, 그가 우리에게 ‘그렇다면 왜 그를 믿지 않았느냐?’ 하고 말할 것이다」[a][b]
  to: 요한의 세례는 어디에서 온 것입니까? 하늘에서[a]입니까, 사람에게서[b]입니까? 그러자 그들은 서로 의논하며 말했습니다. “우리가 ‘하늘에서’라고 말하면, 그가 우리에게 ‘그러면 왜 너희는 그를 믿지 않았습니까?’라고 말할 것입니다.”
  rationale: 원문의 기원에 관한 질문과 ‘하늘/사람’의 대비를 보존했습니다. 목표 합쇼체에 맞추어 인용문 종결을 정중체로 조정하고, 원문의 2인칭 복수를 ‘너희는’으로 드러냈습니다. 또한 각주 표지를 해당 표현 바로 뒤로 옮겨 참조 대상을 명확히 했습니다.
