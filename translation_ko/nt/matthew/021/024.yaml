id: MAT.21.24
reference: Matthew 21:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
  footnotes:
  - marker: a
    text: Or “one matter” or more literally “one word”; Greek λόγον ἕνα can denote a question or matter under discussion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 예수께서 그들에게 대답하여 말씀하셨습니다. “나도 너희에게 한 가지를[a] 묻겠습니다. 너희가 그것을 내게 말하면, 나도 내가 무슨 권위로 이런 일들을 하는지 너희에게 말하겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 λόγον ἕνα은 문자적으로 ‘한 말’ 또는 ‘한 사안’을 뜻할 수 있으며, 이 문맥에서는 ‘한 질문’으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτοῖς
  english_pob_choice: But Jesus answered them
  chosen_korean: 그러나 예수께서 그들에게 대답하여 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그들에게 대답하셨습니다
  - 그러나 예수께서 그들에게 말씀하셨습니다
  lexicon: SBLGNT / narrative idiom
  rationale: ἀποκριθεὶς는 서술에서 뒤따르는 발화동사와 함께 관용적으로 쓰이므로, 한국어도 ‘대답하여 말씀하셨습니다’로 응답의 뉘앙스를 살렸습니다. δέ는 대조적 전환을 드러내어 ‘그러나’가 적절합니다.
- source_word: λόγον ἕνα
  english_pob_choice: one question
  chosen_korean: 한 가지
  alternatives_korean:
  - 한 질문
  - 한 말
  - 한 문제
  lexicon: BDAG
  rationale: λόγος는 여기서 문자적으로 ‘말’이지만, 문맥상 논쟁 중인 물음/사안을 가리키므로 한국어에서는 가장 자연스러운 ‘한 가지’로 옮겨 질문의 성격을 담았습니다. 문맥상 특정한 한 문항을 지시하므로 과도하게 ‘말’로 좁히지 않았습니다.
- source_word: ὃν ἐὰν εἴπητέ μοι
  english_pob_choice: which if you tell me
  chosen_korean: 너희가 내게 말하면
  alternatives_korean:
  - 너희가 내게 대답하면
  - 너희가 내게 말해 주면
  lexicon: BDAG
  rationale: λέγω는 여기서 단순 발화보다 응답 제공의 뜻이므로 ‘말하면’으로 충분히 자연스럽게 옮겼습니다. 조건절의 대응 관계를 살리기 위해 직역보다 한국어 문장 흐름을 우선했습니다.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  english_pob_choice: by what authority
  chosen_korean: 무슨 권위로
  alternatives_korean:
  - 어떤 권위로
  - 무슨 권한으로
  - 어떤 권한으로
  lexicon: BDAG
  rationale: ἐν + ἐξουσίᾳ는 행위의 근거/권한을 뜻하므로 한국어 관용에 따라 ‘무슨 권위로’가 가장 직접적입니다. ‘권한’도 가능하지만, 본문이 예수의 행위 정당성을 둘러싼 문제이므로 ‘권위’가 더 적절합니다.
theological_decisions:
- issue: 예수의 반문 구조와 권위 주장
  chosen_reading: 예수께서는 단순한 회피가 아니라, 자신이 행하는 일의 권위를 드러내기 위해 조건부 반문으로 응답하십니다.
  alternative_readings:
  - 그저 질문을 되돌리는 수사적 응답
  - 대화 지연을 위한 전술적 응답
  rationale: 문맥상 예수의 대답은 상대의 질문을 피하는 것이 아니라, 그들의 답변 여부에 따라 자신의 권위를 밝히겠다는 상호적 제안입니다.
  doctrine_reference: 복음서의 예수 권위와 지혜로운 응답 방식
- issue: 대화체 등록
  chosen_reading: 직접화법 안에서는 예수의 발화가 평서·조건문으로 유지되며, 한국어는 합쇼체 서술을 사용하되 인용문 내부는 자연스러운 구어형을 허용했습니다.
  alternative_readings:
  - 인용문 내부도 완전한 합쇼체로 통일
  - 더 강한 명령형/고어체로 조정
  rationale: 원문이 예수의 응답을 자연스러운 대화체로 제시하므로, 현대 한국어 독자가 이해하기 쉬운 형식을 택하되 경어체 서술은 유지했습니다.
  doctrine_reference: 번역 문체와 직접화법 재현
