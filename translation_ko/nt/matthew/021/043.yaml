id: MAT.21.43
reference: Matthew 21:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
  footnotes:
  - marker: a
    text: Or 'to a people.' The Greek ἔθνει can denote a nation or people-group; the wording here identifies a corporate body by its fruitfulness without specifying more narrowly who is meant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 너희에게 말합니다. 하나님의 나라는 너희에게서 빼앗기고, 그 나라의 열매를 맺는 한 민족에게 주어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 백성에게’. 그리스어 ἔθνει는 민족 또는 사람들의 집단을 가리킬 수 있습니다. 이 표현은 열매를 맺는 집단을 가리키지만, 그 집단이 누구인지는 더 좁게 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 따라서
  lexicon: BDAG
  rationale: 앞 문맥의 비유와 인용에 대한 결론을 자연스럽게 이끄는 접속어로, 원문의 추론 관계를 간결하게 살립니다.
- source_word: λέγω ὑμῖν
  english_pob_choice: I tell you
  chosen_korean: 내가 너희에게 말합니다
  alternatives_korean:
  - 내가 너희에게 이르노라
  - 내가 너희에게 말하노라
  lexicon: BDAG
  rationale: 직접 화법의 공적인 선언을 현대 합쇼체로 옮기되, '말합니다'를 써서 구어적이면서도 단정한 어조를 유지했습니다.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  english_pob_choice: the kingdom of God
  chosen_korean: 하나님의 나라
  alternatives_korean:
  - 하나님의 왕국
  - 하나님의 통치
  lexicon: BDAG
  rationale: 이 문맥에서 βασιλεία의 통상적 번역인 '나라'를 유지해, 왕권과 통치의 의미를 함께 담되 과도한 설명으로 좁히지 않았습니다.
- source_word: ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς
  english_pob_choice: to a nation producing its fruits
  chosen_korean: 그 열매들을 맺는 한 민족에게
  alternatives_korean:
  - 그 열매를 맺는 한 백성에게
  - 열매를 맺는 민족에게
  lexicon: BDAG
  rationale: ἔθνει는 문맥상 '민족/백성' 둘 다 가능하지만, 본문이 특정 정체성을 직접 규정하지 않으므로 넓은 의미의 '한 민족'으로 옮겨 집단성을 보존했습니다. καρπούς의 복수를 살려 '열매들'로 번역했습니다.
theological_decisions:
- issue: ἔθνει의 수신자 정체성
  chosen_reading: 본문은 '한 민족'이라고만 옮기고, 교회·이방인·이스라엘의 잔여 등으로 특정하지 않았습니다.
  alternative_readings:
  - 교회
  - 이방 민족들
  - 새로 된 하나님의 백성
  rationale: 원문 자체는 열매 맺는 집단으로의 이전을 말할 뿐, 후대 신학적 동일시를 번역문에 확정하지 않습니다. 모호성을 보존하는 편이 본문의 긴장을 유지합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
