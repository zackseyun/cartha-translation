  to: 그러므로 내가 너희에게 말합니다. 하나님의 나라는 너희에게서 빼앗기고, 그 나라의 열매를 맺는 한 민족에게 주어질 것입니다.[a]
  rationale: ‘그 나라의 열매’를 사용하여 원문의 대명사가 하나님의 나라를 가리키는 관계를 자연스러운 한국어로 드러냈습니다. 또한 두 미래 수동태를 ‘빼앗기고 … 주어질 것입니다’로 병렬하여 문법적 대응을 명확히 했습니다. ‘한 민족’과 각주 대안 ‘한 백성’을 유지하여 ἔθνει의 의미 범위와 지시 대상의 해석상 여지를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:47Z'
