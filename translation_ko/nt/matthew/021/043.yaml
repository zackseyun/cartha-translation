  naturalness: ‘열매들을’은 한국어에서 다소 부자연스럽고, ‘너희에게서 빼앗겨’보다 ‘너희에게서 빼앗기고’가 뒤의 ‘주어질 것입니다’와 병렬을 이루어 현대 합쇼체 문장으로 더 매끄럽습니다.
  terminology: ‘하나님의 나라’와 ‘한 민족’은 적절합니다. ἔθνει의 지시 대상을 교회나 이방인 등으로 특정하지 않은 점도 유지해야 합니다.
