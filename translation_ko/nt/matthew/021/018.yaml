review_pass:
  verdict: revise
  source_fidelity: Πρωῒ는 ‘이른 아침에’로 정확하며, ἐπανάγων의 동시적 분사 의미도 ‘돌아가시는 길에’로 자연스럽게 나타낼 수 있습니다. εἰς τὴν πόλιν은 특정 도시를 향한 이동이므로 ‘그 도시로’가 원문의 정관사와 방향성을 무리 없이 반영합니다. ἐπείνασεν은 문맥상 예수님께서 배고픔을 느끼신 사건을 말하며 ‘배가 고프셨습니다’가 자연스럽고 충실합니다.
  naturalness: 초안의 ‘도성’은 현대 표준어 성서 본문에서는 다소 문어적·역사적 어감이 강하고, ‘돌아가시던 중에’도 자연스럽지 않습니다. ‘그 도시로 돌아가시는 길에’가 현대적이면서 분사의 상황적 기능을 잘 살립니다.
  terminology: 예수님을 가리키는 서술에 합쇼체 존대 표현을 쓰는 것은 일관되고 자연스럽습니다. 이 절에는 별도의 신학 용어나 인명 표기가 없습니다.
  issues:
  - severity: low
    issue: ‘도성으로’의 문체가 다소 고풍스럽고 의미가 과잉될 수 있습니다.
    rationale: πόλις는 기본적으로 ‘도시/성’을 뜻합니다. 문맥상 예루살렘임은 분명하지만, ‘도성’은 원문에 없는 수도·왕도의 뉘앙스를 더하며 현대 본문에서는 다소 문어적입니다.
  - severity: low
    issue: ‘돌아가시던 중에’가 현대 한국어에서 다소 어색합니다.
    rationale: -던은 회상적 진행의 뉘앙스를 줄 수 있습니다. 현재적·동시적 분사 ἐπανάγων은 ‘돌아가시는 길에’로 더 자연스럽고 정확하게 표현됩니다.
  revised_text: 이른 아침에 그가 그 도시로 돌아가시는 길에 배가 고프셨습니다.
