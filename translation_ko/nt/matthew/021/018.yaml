  yaml_path: translation/nt/matthew/021/018.yaml
  text: Now early in the morning, as he was returning to the city, he became hungry.
translation:
  language: ko
  text: 이른 아침에 그가 그 도시로 돌아가시는 길에 배가 고프셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  english_pob_choice: early in the morning
  chosen_korean: 이른 아침에
  alternatives_korean:
  - 아침 일찍
  - 새벽에
  lexicon: BDAG
  rationale: 시간 부사를 자연스러운 현대 한국어로 옮기되, 단순한 ‘아침에’보다 이른 시간대를 분명히 살렸습니다.
- source_word: ἐπανάγων
  english_pob_choice: as he was returning
  chosen_korean: 돌아가시던 중에
  alternatives_korean:
  - 돌아가시는 길에
  - 다시 가시던 중에
  lexicon: BDAG
  rationale: 동시 진행의 분사 의미를 살려, 동작이 진행되는 와중임을 드러내는 표현으로 옮겼습니다.
- source_word: εἰς τὴν πόλιν
  english_pob_choice: to the city
  chosen_korean: 도성으로
  alternatives_korean:
  - 도시에
  - 성으로
  lexicon: BDAG
  rationale: 문맥상 예루살렘을 가리키는 이동 방향을 자연스럽게 살리면서, ‘도성’이 도시/예루살렘의 공적 성격을 전달합니다.
- source_word: ἐπείνασεν
  english_pob_choice: he became hungry
  chosen_korean: 배가 고프셨습니다
  alternatives_korean:
  - 배고프셨습니다
  - 주리셨습니다
  lexicon: BDAG
  rationale: aorist의 사건성을 한국어에서는 상태 변화로 자연스럽게 풀어, 단순 상태 진술보다 ‘배가 고파지심’을 드러냈습니다.
theological_decisions:
- issue: 예수님의 배고픔을 어떻게 표현할지
  chosen_reading: 예수님의 실제 인간적 배고픔을 그대로 서술했습니다.
  alternative_readings:
  - 영적 배고픔으로 완화해 표현
  - 단순히 ‘배고프셨다’로 축약
  rationale: 본문은 예수님의 참된 인간성을 서사적으로 증언하므로, 의미를 약화시키지 않고 직접적으로 옮겼습니다.
  doctrine_reference: '칼케돈 신조(451): 그리스도의 참 하나님이심과 참 사람이심'
- issue: 직접 호칭이 아닌 서술문에서 존대 처리
  chosen_reading: 주어가 예수님이므로 동작과 상태를 존대형으로 처리했습니다.
  alternative_readings:
  - 평서형으로 중립 처리
  rationale: 합쇼체 본문에서 예수님 서술은 존대형이 자연스럽고, 본문의 뜻을 바꾸지 않으면서 경외적 문체를 유지합니다.
  doctrine_reference: Korean style convention for reverent narrative address
