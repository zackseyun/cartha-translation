id: MAT.21.37
reference: Matthew 21:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
  footnotes:
  - marker: a
    text: Or ‘They will reverence my son.’ The Greek verb can denote showing respect or deference; in other contexts it can also mean ‘be ashamed.’
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 나중에 그는 자기 아들을 그들에게 보내며 말했습니다. 「그들이 내 아들을 존중하겠지요.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 아들을 존중할 것이다.’ 이 동사는 문맥에 따라 ‘존중하다, 공경하다, reverence하다’의 뜻을 띨 수 있으며, 다른 문맥에서는 ‘부끄러워하다’의 의미도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  english_pob_choice: later
  chosen_korean: 나중에
  alternatives_korean:
  - 후에
  - 뒤에
  lexicon: BDAG
  rationale: 시간의 뒤늦음을 자연스러운 현대 한국어로 옮겼으며, ‘마침내’처럼 결말성을 과도하게 보태지 않았습니다.
- source_word: ἀπέστειλεν
  english_pob_choice: he sent
  chosen_korean: 보내며
  alternatives_korean:
  - 보냈습니다
  - 파견했습니다
  lexicon: BDAG
  rationale: 문맥상 아들을 보내는 행위를 간결하게 드러내는 표현으로, 서사 흐름 속에서 자연스럽게 연결되도록 했습니다.
- source_word: Ἐντραπήσονται
  english_pob_choice: They will respect
  chosen_korean: 존중하겠지요
  alternatives_korean:
  - 존경하겠지요
  - 공경하겠지요
  - 부끄러워하겠지요
  lexicon: BDAG
  rationale: 이 동사는 여기서 아들을 향한 사회적 존중/예우의 기대를 나타내므로, 종교적 색채가 강한 ‘공경’보다 ‘존중’이 더 직접적입니다.
- source_word: τὸν υἱόν μου
  english_pob_choice: my son
  chosen_korean: 내 아들
  alternatives_korean:
  - 나의 아들
  - 내 아드님
  lexicon: BDAG
  rationale: 직접적인 소유·관계 표현을 살리면서도 한국어 구어체가 아니라 서사체에 어울리는 표준적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 아들의 지칭을 제목화하지 않고 서사적 호칭으로 유지함
  chosen_reading: ‘아들’로 유지하고 ‘그 아들’ 또는 ‘주님’으로 확대하지 않았습니다.
  alternative_readings:
  - ‘그 아들’
  - ‘주님의 아들’
  - ‘메시아’
  rationale: 본문은 단순히 υἱός를 사용하므로, 번역자가 해석을 앞서 밀어 넣지 않고 비유의 서사 형식을 그대로 보존했습니다. 그리스도론적 함의는 문맥이 드러내도록 두는 것이 적절합니다.
  doctrine_reference: Affirmations; Translation philosophy §§1, 3, 6
