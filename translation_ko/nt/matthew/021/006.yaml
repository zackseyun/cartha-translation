  to: 제자들은 가서 예수님께서 그들에게 지시하신 대로 했습니다.[a]
  rationale: 원문의 사건 순서와 예수님의 지시에 제자들이 그대로 따랐다는 뜻을 유지하면서, 중복 표현을 제거했습니다. δέ는 한국어에서 별도 접속 표현을 강제하지 않고 자연스럽게 이어지는 서술로 처리했습니다.
