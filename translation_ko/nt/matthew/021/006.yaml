review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 충실합니다. πορευθέντες와 ποιήσαντες의 연속 동작을 ‘가서 … 했습니다’로 옮겼고, καθώς와 συνέταξεν도 ‘지시하신 대로’로 적절히 반영했습니다. 다만 δέ의 서술 연결은 ‘그런 다음’보다 약하므로, 별도의 강한 시간 전환 없이 문장 흐름 안에서 처리하는 편이 더 가깝습니다.
  naturalness: ‘지시하신 대로 그대로’는 같은 뜻이 중복되어 현대 한국어 문장으로 다소 부자연스럽습니다. ‘지시하신 대로 했습니다’가 간결하고 자연스럽습니다.
  terminology: ‘제자들’, ‘예수님’, ‘지시하신’은 복음서 문맥과 합쇼체에 잘 맞습니다. 각주의 ‘헬라어’는 현대 표준 학술 용례인 ‘그리스어’로 다듬을 수 있습니다.
  issues:
  - severity: low
    issue: ‘대로 그대로’의 의미 중복
    rationale: καθὼς의 대응 표현으로 ‘대로’ 또는 ‘그대로’ 하나면 충분합니다. 둘을 함께 쓰면 강조라기보다 불필요한 중복으로 들립니다.
  - severity: low
    issue: δὲ를 ‘그런 다음’으로 과도하게 시간화함
    rationale: δέ는 여기서 주로 서술을 이어 주는 접속사입니다. ‘그런 다음’도 의미상 큰 오류는 아니지만, 뚜렷한 시간적 단계를 추가할 수 있으므로 생략하여 자연스러운 한국어 서술 흐름으로 처리하는 편이 안전합니다.
  revised_text: 제자들은 가서 예수님께서 그들에게 지시하신 대로 했습니다.[a]
