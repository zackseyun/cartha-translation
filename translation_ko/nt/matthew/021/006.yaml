source:
  edition: SBLGNT
  text: πορευθέντες δὲ οἱ μαθηταὶ καὶ ποιήσαντες καθὼς ⸀συνέταξεν αὐτοῖς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
  footnotes:
  - marker: a
    text: Or 'commanded them.' The Greek verb can denote giving orders or instructions; here the context favors 'instructed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제자들은 가서 예수님께서 그들에게 지시하신 대로 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘명령하신’입니다. 그리스어 동사는 명령하거나 지시하는 것을 모두 나타낼 수 있으며, 여기서는 문맥상 ‘지시하신’이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 떠났습니다
  lexicon: BDAG
  rationale: 분사형을 한국어 서술 흐름에 맞게 동작 연결로 처리했습니다. ‘가서’가 앞선 명령에 대한 응답과 다음 행동을 자연스럽게 잇습니다.
- source_word: ποιήσαντες
  english_pob_choice: did
  chosen_korean: 그대로 했습니다
  alternatives_korean:
  - 행했습니다
  - 실행했습니다
  - 따랐습니다
  lexicon: BDAG
  rationale: 앞의 ‘지시하신 대로’와 결합된 순응의 의미를 살려, 단순한 행위보다 명령 준수를 드러내는 표현으로 옮겼습니다.
- source_word: συνέταξεν
  english_pob_choice: had instructed
  chosen_korean: 지시하신
  alternatives_korean:
  - 명령하신
  - 지시하신 바를 주신
  - 명하신
  lexicon: BDAG
  rationale: 이 동사는 문맥상 단순한 ‘명령’보다 구체적 안내·지시의 성격이 강하므로, POB의 판단을 따라 ‘지시하다’를 택했습니다.
- source_word: οἱ μαθηταὶ
  english_pob_choice: the disciples
  chosen_korean: 제자들은
  alternatives_korean:
  - 학생들은
  - 문하생들은
  lexicon: BDAG
  rationale: 복음서 문맥에서 μαθηταί는 예수님의 추종자를 가리키는 표준 용례이므로, 자연스럽고 전통적인 의미를 유지하는 ‘제자들’로 옮겼습니다.
theological_decisions:
- issue: 명령과 지시의 뉘앙스
  chosen_reading: 예수님의 권위는 유지하되, 본문이 강조하는 것은 가혹한 명령이라기보다 구체적 지시를 따른 즉각적 순종으로 보았습니다.
  alternative_readings:
  - ‘명령하신’으로 더 강하게 표현할 수 있음
  - ‘분부하신’으로 전통적 어휘를 사용할 수 있음
  rationale: 앞 문맥과 POB의 영어 선택이 ‘instructed’를 지지하므로, 순종의 사실은 살리되 과도하게 군사적·위계적인 뉘앙스는 피했습니다.
  doctrine_reference: 제자도의 순종, 마태복음의 예수 권위 이해
- issue: 부사적 분사 구조의 처리
  chosen_reading: 두 분사(πορευθέντες, ποιήσαντες)를 한국어에서는 연속 동작으로 풀어, 행동의 순서를 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘가서 … 하고’처럼 더 직역적으로 배열할 수 있음
  - ‘가서 … 그대로 행했습니다’로 더 간결하게 할 수 있음
  rationale: 헬라어의 분사 연쇄를 한국어 문장 흐름에 맞춰 재구성하되, 사건의 순차성과 응답성을 유지했습니다.
  doctrine_reference: 본문 서술의 문법적 자연성
