lexical_decisions:
- source_word: οἱ μαθηταὶ
  english_pob_choice: the disciples
  chosen_korean: 제자들
  alternatives_korean:
  - 학생들
  - 문하생들
  lexicon: SBLGNT
  rationale: μαθηταί는 예수의 추종자들을 가리키므로, 한국어 성경의 자연스러운 표준인 ‘제자들’로 옮겼습니다.
- source_word: ἐθαύμασαν
  english_pob_choice: they marveled
  chosen_korean: 놀라서
  alternatives_korean:
  - 경이롭게 여기며
  - 감탄하며
  lexicon: BDAG
  rationale: θαυμάζω의 핵심은 놀람과 경탄이므로, 합쇼체 서술에 자연스럽게 맞는 ‘놀라서’로 처리했습니다.
- source_word: παραχρῆμα
  english_pob_choice: immediately
  chosen_korean: 곧바로
  alternatives_korean:
  - 즉시
  - 바로
  lexicon: BDAG
  rationale: παραχρῆμα의 즉시성을 살리되, 제자들의 놀람이 드러나도록 ‘곧바로’를 선택했습니다.
- source_word: ἐξηράνθη
  english_pob_choice: withered
  chosen_korean: 말라 버렸습니까
  alternatives_korean:
  - 시들었습니까
  - 말랐습니까
  lexicon: BDAG
  rationale: 무화과나무에 대한 ξηραίνω는 ‘마르다/시들다’가 자연스러우며, 완료된 상태를 드러내기 위해 ‘말라 버렸습니까’로 옮겼습니다.
theological_decisions:
- issue: 제자들의 반응을 묘사하는 서술의 뉘앙스
  chosen_reading: 감정 과잉 없이 ‘놀라서’로 간결하게 옮겨, 사건의 즉각성과 제자들의 경탄을 함께 드러냈습니다.
  alternative_readings:
  - 경탄하며
  - 놀랐습니다
  rationale: 원문은 단순한 정보 전달보다 놀람의 반응을 강조하므로, 한국어에서도 그 반응성을 유지하는 쪽이 적절합니다.
  doctrine_reference: 서술 맥락 유지
