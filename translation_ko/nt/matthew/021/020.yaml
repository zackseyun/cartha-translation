- from: 그것을 보신 제자들은 놀라서 말했습니다. "무슨 일로 무화과나무가 곧바로 말라 버렸습니까?"[a]
  to: 제자들이 그것을 보고 놀라 말했습니다. “무화과나무가 어떻게 곧바로 말랐습니까?”[a]
  rationale: 시간적 관계를 ‘보고’로, Πῶς의 방식·과정의 물음을 ‘어떻게’로 분명히 하였습니다. 불필요한 주체 높임과 원문보다 강한 완료·유감 뉘앙스를 피하면서, παραχρῆμα의 즉시성은 ‘곧바로’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:44Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 시간적 분사 ἰδόντες와 질문사 Πῶς를 각각 ‘보고’와 ‘어떻게’로 명시할 필요가 있습니다. 현행 ‘무슨 일로’는 원인의 물음으로도 이해될 수 있어, 나무가 말라 간 방식·과정에 대한 원문의 물음보다 의미 범위가 달라집니다.
  naturalness: ‘제자들이 그것을 보고 놀라 말했습니다’는 현대 표준어 합쇼체에서 자연스럽고, 제자들에게 불필요한 주체 높임을 쓰지 않아 서술 문체도 안정적입니다. ‘말랐습니까’는 나무에 자연스러운 표현입니다.
  terminology: ‘제자들’, ‘무화과나무’, ‘곧바로’는 적절합니다. παραχρῆμα의 대안으로 ‘즉시’를 제시하는 각주도 적절합니다.
  issues:
  - severity: medium
    issue: ‘무슨 일로’가 Πῶς의 의미를 충분히 반영하지 못함
    rationale: Πῶς는 ‘어떻게, 어떤 방식으로’라는 물음입니다. ‘무슨 일로’는 흔히 이유나 원인을 묻는 말이므로, 원문의 물음을 ‘어떻게’로 옮기는 것이 더 충실합니다.
  - severity: low
    issue: ‘보신’의 주체 높임
    rationale: 원문에는 제자들에 대한 높임의 근거가 없으며, 이 문맥의 현대 성경 서술에서는 ‘제자들이 … 보고’가 더 중립적이고 자연스럽습니다.
  revised_text: 제자들이 그것을 보고 놀라 말했습니다. “무화과나무가 어떻게 곧바로 말랐습니까?”[a]
