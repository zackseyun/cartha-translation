  to: 예수께서 그들에게 말씀하셨습니다. “성경에서 한 번도 읽어 본 적이 없습니까? ‘건축자들이 버린 그 돌이 바로 머릿돌[a]이 되었습니다. 이 일은 주님에게서[b] 비롯된 것이며, 우리 눈에는 놀랍습니다.’”
  rationale: 본문에 ‘한 번도’를 넣어 Οὐδέποτε의 강조를 보존했습니다. αὕτη가 가리키는, 버려진 돌이 머릿돌이 된 사건을 ‘이 일’로 명시하고, παρά κυρίου의 출처 의미를 ‘주님에게서 비롯된’으로 자연스럽게 옮겼습니다. 또한 주석 표지를 해당 어구에 연결하고, 머릿돌 관련 주석을 원문의 문자적 의미와 가능한 번역 대안을 반영하도록 바로잡았습니다.
