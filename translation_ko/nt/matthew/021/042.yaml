id: MAT.21.42
reference: Matthew 21:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
  footnotes:
  - marker: a
    text: Or 'the capstone'; literally 'the head of the corner.'
    reason: lexical_alternative
  - marker: b
    text: Greek 'from the Lord'; the Hebrew source of the quotation has 'from the LORD' (YHWH).
    reason: alternative_reading
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “성경에서 한 번도 읽어 본 적이 없습니까? ‘건축자들이 버린 그 돌이 바로 머릿돌[a]이 되었습니다. 이 일은 주님에게서[b] 비롯된 것이며, 우리 눈에는 놀랍습니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머릿돌’은 직역하면 ‘모퉁이의 머리’라는 뜻입니다. ‘모퉁잇돌’ 또는 ‘갓돌’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘주님에게서’라고 합니다. 인용된 히브리어 본문에는 하나님의 이름인 ‘야훼’가 사용됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς
  english_pob_choice: Have you never read in the Scriptures
  chosen_korean: 성경에서 읽어 본 적이 없습니까
  alternatives_korean:
  - 성경을 한 번도 읽지 않았습니까
  - 성경에서 읽어 보지 못했습니까
  lexicon: BDAG
  rationale: 수사적 질문의 강한 질책을 살리면서도 현대 한국어의 자연스러운 합쇼체로 옮겼습니다. γραφαῖς는 여기서 이스라엘의 성경을 가리키므로 ‘성경’이 가장 분명합니다.
- source_word: Λίθον ... ὁ οἰκοδομοῦντες ... κεφαλὴν γωνίας
  english_pob_choice: the stone ... the builders ... the cornerstone
  chosen_korean: 그 돌 ... 건축자들 ... 머릿돌
  alternatives_korean:
  - 돌 ... 짓는 사람들 ... 모퉁이돌
  - 돌 ... 건축자들 ... 모퉁잇돌
  lexicon: BDAG
  rationale: λίθον은 특정한 돌을 가리키는 인용문 맥락이므로 ‘그 돌’로 살렸고, οἰκοδομοῦντες는 메타포적 주어로 ‘건축자들’이 적절합니다. κεφαλὴν γωνίας는 본문에서 자연스럽게 읽히는 한국어로 ‘머릿돌’을 택하되, 전통 교회어인 ‘모퉁이돌’보다 원문의 관용을 더 직접적으로 드러냅니다.
- source_word: παρὰ κυρίου
  english_pob_choice: This came from the Lord
  chosen_korean: 이것은 주님에게서 난 것이며
  alternatives_korean:
  - 이것은 주님으로부터 왔으며
  - 이것은 주님에게서 나왔으며
  lexicon: BDAG
  rationale: παρά with genitive는 출처를 나타내므로 ‘~에게서 난’으로 옮겼습니다. POB의 본문처럼 κύριος는 기본적으로 ‘주님’으로 두되, 구약 인용의 배경을 과도하게 본문에 풀어 넣지 않았습니다.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  english_pob_choice: in our eyes
  chosen_korean: 우리 눈에는
  alternatives_korean:
  - 우리 보기에
  - 우리 눈앞에는
  lexicon: BDAG
  rationale: 직역적이지만 한국어에서도 자연스러운 관용으로, ‘우리 보기에’보다 원문의 이미지가 더 살아납니다.
theological_decisions:
- issue: 시편 인용의 κύριος 번역
  chosen_reading: 본문에는 ‘주님’을 두고, 구약 배경의 야훼 대용은 본문 밖에서 처리하지 않았습니다.
  alternative_readings:
  - 야훼
  - 주님(LORD)
  rationale: 이 구절의 직접적인 그리스어는 κυρίου이므로, POB 기본 원칙에 따라 본문은 ‘주님’으로 유지했습니다. 히브리어 원천이 야훼를 반영한다는 정보는 중요하지만, 여기서는 본문 가독성을 해치지 않도록 주석 없이 본문만 번역했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주님; יהוה → 야훼'
- issue: 돌 이미지의 메시아적 적용
  chosen_reading: 비유 자체를 유지하고, 예수의 자기-해석을 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 그 돌이 메시아가 되었습니다
  - 그 돌은 예수님을 가리킵니다
  rationale: 예수께서 이 시편을 자신에게 적용하시는 문맥이지만, 절 자체는 인용문의 형식을 유지합니다. 따라서 해석을 본문에 앞서 넣기보다 원문의 은유를 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Original-language primacy'
