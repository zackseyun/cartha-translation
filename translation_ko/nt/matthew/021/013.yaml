source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
  footnotes:
  - marker: a
    text: Jesus combines Isaiah 56:7 with Jeremiah 7:11.
    reason: cross_reference
  - marker: b
    text: Or “bandits.” The Greek term can refer to robbers or violent brigands.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다[a]. “기록되어 있습니다. ‘내 집은 기도하는 집이라고 불릴 것이다.’ 그런데 너희는 그것을 강도들의 소굴[b]로 만들고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 예수께서는 이사야 56:7과 예레미야 7:11을 결합하여 말씀하십니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘도적들의 소굴’. 이 그리스어는 폭력적인 약탈자나 산적을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  english_pob_choice: he says
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말합니다
  - 이르셨습니다
  lexicon: BDAG
  rationale: 현재형 역사서술의 생동감을 살리되, 한국어 합쇼체에서는 자연스러운 서술 과거로 옮겨 예수의 발화를 분명하게 했습니다.
- source_word: Γέγραπται
  english_pob_choice: It is written
  chosen_korean: 기록되어 있습니다
  alternatives_korean:
  - 쓰여 있습니다
  - 기록되었습니다
  lexicon: BDAG
  rationale: 성경 인용을 여는 관용구로서, 완료 수동의 지속된 권위를 드러내면서도 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: οἶκός μου οἶκος προσευχῆς
  english_pob_choice: My house ... a house of prayer
  chosen_korean: 내 집은 기도하는 집
  alternatives_korean:
  - 내 집은 기도의 집
  - 내 집은 기도하는 집입니다
  lexicon: BDAG
  rationale: ‘집’이라는 직역을 유지해 이사야 56:7의 문구가 드러나도록 했고, ‘기도하는 집’으로 자연스러운 문장성을 살렸습니다.
- source_word: σπήλαιον λῃστῶν
  english_pob_choice: den of robbers
  chosen_korean: 강도의 소굴
  alternatives_korean:
  - 도적들의 소굴
  - 강도들의 은신처
  lexicon: BDAG
  rationale: σπήλαιον은 ‘소굴’이 관용적으로 가장 적절하며, λῃστῶν은 단순한 절도범보다 폭력적 약탈자를 가리킬 수 있어 ‘강도’로 옮겼습니다.
theological_decisions:
- issue: 이사야 56:7과 예레미야 7:11의 결합 인용을 드러내는 방식
  chosen_reading: 본문은 ‘기도하는 집’과 ‘강도의 소굴’이라는 익숙한 표현을 유지해 상호본문성을 보이게 했습니다.
  alternative_readings:
  - 의미만 풀어 써서 성구 연결을 약화시키는 번역
  rationale: 예수의 선언은 두 본문을 결합한 성구 적용이므로, 한국어에서도 성경적 연결이 식별되도록 하는 것이 해석 투명성에 유리합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
