id: MAT.21.9
reference: Matthew 21:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
  footnotes:
  - marker: a
    text: “Hosanna” is a Hebrew-derived acclamation meaning something like “save, please” or “save now,” but here it functions as a shout of praise.
    reason: lexical_alternative
  - marker: b
    text: “The Son of David” is a royal messianic title.
    reason: cultural_note
  - marker: c
    text: This line echoes Psalm 118:26, where “the Lord” reflects the divine name YHWH in the Hebrew text.
    reason: cross_reference
translation:
  language: ko
  text: 그 무리 가운데 앞서 가는 이들과 뒤따르는 이들이 외치며 말했습니다. 「호산나, 다윗의 아들에게! 주의 이름으로 오시는 분은 복되십니다! 가장 높은 곳에서 호산나!」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호산나’는 히브리어 유래 감탄사로, 여기서는 ‘구원하소서’라는 뜻의 청원에서 예배적 환호로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다윗의 아들’은 왕적 메시아 칭호입니다.
    reason: cultural_note
  - marker: c
    text: 이 구절은 시편 118:26을 반향하며, 거기서 ‘주’는 히브리어 본문의 하나님의 이름을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι οἱ προάγοντες αὐτὸν καὶ οἱ ἀκολουθοῦντες
  english_pob_choice: the crowds going ahead of him and those following
  chosen_korean: 그 무리 가운데 앞서 가는 이들과 뒤따르는 이들
  alternatives_korean:
  - 군중 가운데 앞서 가는 이들과 뒤따르는 이들
  - 앞서 그를 가는 무리와 뒤따르는 무리
  lexicon: BDAG
  rationale: 행렬의 대비를 살리되 한국어로는 ‘무리’와 ‘이들’을 써서 자연스럽게 했습니다. ‘앞서 가는’은 진행 방향을, ‘뒤따르는’은 대조를 분명히 보여 줍니다.
- source_word: ἔκραζον λέγοντες
  english_pob_choice: were crying out, saying
  chosen_korean: 외치며 말했습니다
  alternatives_korean:
  - 부르짖으며 말했습니다
  - 계속 외치며 말했습니다
  lexicon: BDAG
  rationale: 미완료의 지속성을 과도하게 살리기보다, 행렬 장면에 어울리는 자연스러운 진행 표현으로 옮겼습니다. ‘외치며 말했습니다’는 외침과 발화를 함께 담습니다.
- source_word: Ὡσαννὰ
  english_pob_choice: Hosanna
  chosen_korean: 호산나
  alternatives_korean:
  - 오, 구원하소서
  - 지금 구원하소서
  lexicon: BDAG
  rationale: 이곳에서는 청원어라기보다 예배적 환호로 기능하므로 음역을 유지하는 것이 본문의 울림을 가장 잘 보존합니다.
- source_word: τῷ υἱῷ Δαυίδ
  english_pob_choice: to the Son of David
  chosen_korean: 다윗의 아들에게
  alternatives_korean:
  - 다윗의 아들을 향하여
  - 다윗의 아들을 위해
  lexicon: BDAG
  rationale: 여격은 한국어에서 감탄·환호의 대상 표시로 자연스럽게 ‘-에게’ 계열로 풀 수 있습니다. ‘다윗의 아들’은 메시아적 왕호를 그대로 살립니다.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  english_pob_choice: Blessed is the one who comes
  chosen_korean: 주의 이름으로 오시는 분은 복되십니다
  alternatives_korean:
  - 오시는 분은 복되십니다
  - 주의 이름으로 오시는 이는 복되십니다
  lexicon: BDAG
  rationale: 복을 선언하는 수동 분사를 한국어 존대 종결 ‘복되십니다’로 옮겨 예배적 맥락을 살렸습니다. ‘오시는 분’은 현재형 분사의 지속적 도착을 반영합니다.
- source_word: ἐν ὀνόματι κυρίου
  english_pob_choice: in the name of the Lord
  chosen_korean: 주의 이름으로
  alternatives_korean:
  - 주님의 이름으로
  - 주의 권위로
  lexicon: BDAG
  rationale: 관용구를 직역하되, 시편 118편의 인용이라는 점을 드러내기 위해 ‘주의 이름으로’를 유지했습니다. ‘권위로’는 의미는 드러내지만 원문의 표현을 덜 직접적으로 만듭니다.
- source_word: ἐν τοῖς ὑψίστοις
  english_pob_choice: in the highest
  chosen_korean: 가장 높은 곳에서
  alternatives_korean:
  - 가장 높은 곳에
  - 가장 높은 하늘에서
  lexicon: BDAG
  rationale: 찬양의 외침이 향하는 영역을 한국어 어순에 맞춰 자연스럽게 표현했습니다. ‘가장 높은 하늘’보다 원문의 간결한 감탄성을 보존합니다.
theological_decisions:
- issue: Psalm 118 인용에서 κυρίου의 처리
  chosen_reading: 본문에는 ‘주의 이름으로’로 두고, 야훼 대체는 본문이 아니라 주석 차원에서만 고려했습니다.
  alternative_readings:
  - 야훼의 이름으로
  - 주님의 이름으로
  rationale: 인용문이 시편 118:26을 반향하지만, 마태 본문 자체의 그리스어는 κυρίου입니다. 본문에서는 ‘주’로 옮겨 그리스어 표면형을 보존하고, 구약 배경은 필요 시 주석으로 추적하는 편이 더 투명합니다.
  doctrine_reference: 'Contested terms table: κύριος; YHWH'
