- from: 그 무리 가운데 앞서 가는 이들과 뒤따르는 이들이 외치며 말했습니다. 「호산나, 다윗의 아들에게! 주의 이름으로 오시는 분은 복되십니다! 가장 높은 곳에서 호산나!」[a][b][c]
  to: 예수님 앞에서 가는 무리와 뒤따르는 무리가 외치고 있었습니다. “호산나[a], 다윗의 아들[b]에게! 주[c]의 이름으로 오시는 분은 복되십니다! 가장 높은 곳에 호산나!”
  rationale: 군중의 두 집단이라는 문장 구조와 ‘그분 앞에서’라는 목적어 관계를 분명히 했습니다. 미완료 ἔκραζον은 ‘외치고 있었습니다’로 반영하고, ἐν τοῖς ὑψίστοις는 특정 해석을 덧붙이지 않는 ‘가장 높은 곳에’로 옮겼습니다. 핵심 호칭과 시편 인용의 표현은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:47Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘그 무리 가운데’는 οἱ ὄχλοι를 ‘무리 안에서’라는 뜻으로 바꾸어 버리며, προάγοντες αὐτόν의 목적어도 본문에서 드러나지 않습니다. 또한 ‘가장 높은 곳에서’는 ἐν τοῖς ὑψίστοις를 외침의 발원지처럼 들리게 할 수 있어 위치·영역을 나타내는 ‘가장 높은 곳에’가 더 충실합니다.
  naturalness: ‘예수님 앞에서 가는 무리와 뒤따르는 무리’ 및 ‘외치고 있었습니다’는 행렬 장면과 미완료 과거의 진행성을 자연스럽게 나타냅니다. 각주 표지는 해당 어구 바로 뒤에 배치하여 가리키는 대상을 분명히 했습니다.
  terminology: ‘호산나’, ‘다윗의 아들’, ‘주의 이름으로’, ‘복되십니다’를 유지합니다. ‘다윗의 아들’의 왕적·메시아적 칭호와 시편 인용의 ‘주’는 보존했으며, YHWH 배경은 각주에서만 설명합니다.
  issues:
  - severity: medium
    issue: ‘그 무리 가운데’라는 표현
    rationale: 원문은 ‘앞서 가는 군중들과 뒤따르는 군중들’이지 군중 내부의 일부 사람들을 뜻하지 않습니다.
  - severity: medium
    issue: προάγοντες αὐτόν의 목적어 미표시
    rationale: ‘앞서 가는’만으로는 누구의 앞인지 불분명합니다. 문맥상 지시 대상인 예수님을 밝혀야 합니다.
  - severity: low
    issue: ‘가장 높은 곳에서 호산나’
    rationale: ‘에서’는 호산나가 높은 곳으로부터 들린다는 뜻으로 읽힐 수 있습니다. 원문의 ἐν은 ‘가장 높은 곳에/에서’라는 영역 표현이므로, 한국어에서는 ‘에’가 더 중립적입니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 일괄 배치됨
    rationale: 각주 a, b, c가 각각 호산나, 다윗의 아들, 주를 가리키도록 해당 표현 뒤에 붙이는 편이 명료합니다.
