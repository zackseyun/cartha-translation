revisions:
- from: 사람들이 예수께 말했습니다. 「저들이 말하는 것을 들으십니까?」 예수께서 그들에게 말씀하셨습니다. 「예. 너희는 ‘어린아이들과 젖먹이들의 입에서 주께서 찬양을 준비하셨다’는 것을 읽어 본 적이 없습니까?」[a]
  to: 그들이 예수께 말했습니다. “저들이 말하는 것을 들으십니까?” 예수께서 그들에게 말씀하셨습니다. “그렇습니다. 너희는 ‘어린아이들과 젖먹이들의 입에서 주께서 찬양을 마련하셨다’[a]는 말씀을 한 번도 읽어 본 적이 없습니까?”
  rationale: ‘그들이’로 원문의 대명사 지시를 보존하고, οὐδέποτε를 ‘한 번도’로 명시했습니다. 인용문 안의 ‘찬양을 준비하셨다’는 뜻을 유지하면서 한국어 결합이 더 자연스러운 ‘찬양을 마련하셨다’로 다듬었으며, 각주 표지를 해당 시편 인용문 끝으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:49Z'
