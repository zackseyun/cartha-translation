id: MAT.21.16
reference: Matthew 21:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
  footnotes:
  - marker: a
    text: Jesus is quoting Psalm 8:2 according to the Greek scriptural tradition. The Hebrew text is commonly rendered, “Out of the mouth of infants and nursing babies you have established strength.”
    reason: alternative_reading
translation:
  language: ko
  text: 사람들이 예수께 말했습니다. 「저들이 말하는 것을 들으십니까?」 예수께서 그들에게 말씀하셨습니다. 「예. 너희는 ‘어린아이들과 젖먹이들의 입에서 주께서 찬양을 준비하셨다’는 것을 읽어 본 적이 없습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 예수께서는 시편 8:2를 헬라어 성경 전승에 따라 인용하십니다. 히브리어 본문은 흔히 “어린아이들과 젖먹이들의 입에서 주께서 능력을 세우셨습니다”로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις τί οὗτοι λέγουσιν
  english_pob_choice: Do you hear what these are saying?
  chosen_korean: 「저들이 말하는 것을 들으십니까?」
  alternatives_korean:
  - 「이 사람들이 무슨 말을 하는지 들으십니까?」
  - 「저들이 하는 말을 듣고 계십니까?」
  lexicon: BDAG
  rationale: 현재형 질문의 도전적 뉘앙스를 살리면서, οὗτοι의 다소 거리 두는 느낌을 ‘저들’로 반영했습니다.
- source_word: λέγει αὐτοῖς
  english_pob_choice: Jesus says to them
  chosen_korean: 예수께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그들에게 말씀합니다
  - 예수께서 그들에게 대답하셨습니다
  lexicon: BDAG
  rationale: 마태가 쓰는 역사적 현재의 생동감을 살리기보다 한국어 서술의 자연스러움을 우선해 과거 서술형으로 옮겼습니다.
- source_word: οὐδέποτε ἀνέγνωτε
  english_pob_choice: Have you never read
  chosen_korean: 읽어 본 적이 없습니까
  alternatives_korean:
  - 한 번도 읽어 본 적이 없습니까
  - 너희는 읽지 않았습니까
  lexicon: BDAG
  rationale: 성경을 알고 있어야 할 상대를 책망하는 수사적 질문이므로, 현대 한국어에서 자연스러운 ‘읽어 본 적이 없습니까’를 선택했습니다.
- source_word: Ἐκ στόματος νηπίων καὶ θηλαζόντων
  english_pob_choice: Out of the mouth of infants and nursing babies
  chosen_korean: 어린아이들과 젖먹이들의 입에서
  alternatives_korean:
  - 아기들과 젖먹는 아이들의 입에서
  - 유아들과 젖먹이들의 입에서
  lexicon: BDAG
  rationale: νηπίων과 θηλαζόντων의 서로 다른 이미지를 함께 살리되, 오늘날 독자가 바로 이해할 수 있는 ‘어린아이들’과 ‘젖먹이들’을 택했습니다.
- source_word: κατηρτίσω αἶνον
  english_pob_choice: you have prepared praise
  chosen_korean: 주께서 찬양을 준비하셨다
  alternatives_korean:
  - 주께서 찬양을 마련하셨다
  - 주께서 찬송을 준비하셨다
  lexicon: BDAG
  rationale: 마태복음의 헬라어 인용을 따라 시편 8:2의 그리스어 전승인 ‘찬양’을 본문에 유지했습니다.
theological_decisions:
- issue: 시편 8:2 인용의 본문 전승 차이
  chosen_reading: 본문에는 마태복음의 그리스어 인용대로 ‘찬양을 준비하셨다’를 두고, 각주로 히브리어 전승의 ‘능력을 세우셨다’를 알립니다.
  alternative_readings:
  - 히브리어 시편 8:2의 ‘능력을 세우셨다’로 본문을 맞추는 읽기
  rationale: 예수의 인용은 마태의 그리스어 성경 전승을 따르므로 본문은 이를 그대로 반영해야 하며, 독자가 익숙한 히브리어 본문과의 차이는 주석으로 보완하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3
