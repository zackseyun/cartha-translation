  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
  footnotes:
  - marker: a
    text: Or 'other slaves.' The Greek word doulous can mean either 'servants' or 'slaves,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 다시 처음에 보낸 종들보다 더 많은 다른 종들을 보냈습니다. 그들은 그 종들에게도 똑같이 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  english_pob_choice: Again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 한번 더
  lexicon: BDAG
  rationale: 반복된 행동을 나타내는 부사로, 서술 흐름을 자연스럽게 이어 주는 간결한 대응어입니다.
- source_word: ἀπέστειλεν
  english_pob_choice: he sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 보냈습니다
  lexicon: BDAG
  rationale: ἀποστέλλω의 서술형 과거를 현대 한국어 서술문에 맞게 옮겼습니다. '파견하다'는 다소 문어적이어서 여기서는 덜 자연스럽습니다.
- source_word: ἄλλους δούλους
  english_pob_choice: other servants
  chosen_korean: 다른 종들
  alternatives_korean:
  - 다른 노예들
  - 다른 종/노예들
  lexicon: BDAG
  rationale: 이 비유의 맥락에서는 POB의 영어 선택처럼 봉사자/심부름꾼의 기능이 전면에 있어 '종'이 가장 자연스럽습니다. 동시에 주석으로 '노예' 가능성을 남겨 두었습니다.
- source_word: πλείονας τῶν πρώτων
  english_pob_choice: more than the first ones
  chosen_korean: 처음보다 더 많이
  alternatives_korean:
  - 첫 번째 사람들보다 더 많은
  - 처음 것들보다 더 많은
  lexicon: BDAG
  rationale: 비교 구조를 한국어로 간결하게 풀어, 후속 무리의 수가 더 많았음을 분명히 했습니다.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  english_pob_choice: and they did the same to them
  chosen_korean: 그들에게도 똑같이 했습니다
  alternatives_korean:
  - 그들에게도 같은 일을 했습니다
  - 그들도 그들에게 똑같이 했습니다
  lexicon: BDAG
  rationale: 앞선 종들에게 한 처우를 되풀이했다는 의미를 '똑같이'로 압축해, 본문의 반복성과 연결성을 살렸습니다.
theological_decisions:
- issue: δοῦλος의 한국어 처리
  chosen_reading: 본문에는 '종'을 쓰고, 각주로 '노예' 가능성을 열어 두었습니다.
  alternative_readings:
  - 노예
  - 종/노예
  rationale: 이 장면의 초점은 보냄 받은 이들의 신분 규정보다 거절과 학대의 반복입니다. 따라서 읽기 자연성을 위해 '종'을 택하되, 원어의 범위를 각주로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δοῦλος'
