  text: 다시 다른 종들[a]을 처음보다 더 많이 보냈습니다. 그런데 그들에게도 똑같이 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '다른 노예들'. 그리스어 doulous는 문맥에 따라 '종'이나 '노예'를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  english_pob_choice: Again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 한번 더
  lexicon: BDAG
  rationale: 반복된 행동을 나타내는 부사로, 서술 흐름을 자연스럽게 이어 주는 간결한 대응어입니다.
- source_word: ἀπέστειλεν
  english_pob_choice: he sent
  chosen_korean: 보냈습니다
