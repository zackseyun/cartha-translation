review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ‘처음보다 더 많이’는 πλείονας τῶν πρώτων이 가리키는 비교 대상, 곧 ‘처음에 보낸 종들’을 충분히 명시하지 못하며 ‘첫 번째 때보다’라는 시간 비교로도 읽힐 수 있습니다. 또한 δεύτε 문장의 ‘그들에게’는 한국어에서 지시 대상이 다소 불명확합니다.
  naturalness: ‘처음에 보낸 종들보다 더 많은 다른 종들’로 비교 대상을 밝혀 자연스럽고 정확하게 옮길 수 있습니다. ‘그들은 그 종들에게도 똑같이 했습니다’는 원문의 의도적으로 생략된 학대 행위를 유지하면서도 대상을 분명히 합니다.
  terminology: ‘종들’은 이 비유에서 자연스럽고 영어 POB의 ‘servants’와도 일치합니다. δοῦλος의 ‘노예’ 가능성을 알리는 각주는 적절합니다.
  issues:
  - severity: medium
    issue: ‘처음보다 더 많이’의 비교 대상이 불명확함
    rationale: τῶν πρώτων은 시간적 ‘처음’이 아니라 앞서 보낸 첫 종들의 무리를 가리킵니다. 현 번역은 ‘처음 보냈을 때보다’로 이해될 여지가 있습니다.
  - severity: low
    issue: ‘그들에게도’의 지시 대상이 다소 불분명함
    rationale: 그리스어 αὐτοῖς는 새로 보낸 종들을 가리킵니다. 한국어에서는 ‘그 종들에게도’라고 밝혀 주면 자연스럽게 연결됩니다.
  revised_text: 다시 처음에 보낸 종들보다 더 많은 다른 종들을 보냈습니다. 그들은 그 종들에게도 똑같이 했습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘다른 노예들’. 그리스어 doulous는 문맥에 따라 ‘종’이나 ‘노예’를 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 비교 구문 πλείονας τῶν πρώτων을 ‘처음에 보낸 종들보다 더 많은’으로 명확히 하여 후속 무리의 수가 첫 무리보다 많았다는 뜻을 보존했습니다. δεύτε 문장은 앞 절의 가해자들을 주어로 유지하고, αὐτοῖς의 대상을 ‘그 종들’로 밝혔습니다. ‘똑같이 했습니다’는 원문처럼 구체적 행위를 앞 문맥에 의존하게 둡니다.
