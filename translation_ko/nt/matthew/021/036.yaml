  lexicon: BDAG
  rationale: ἀποστέλλω의 서술형 과거를 현대 한국어 서술문에 맞게 옮겼습니다. '파견하다'는 다소 문어적이어서 여기서는 덜 자연스럽습니다.
- source_word: ἄλλους δούλους
  english_pob_choice: other servants
  chosen_korean: 다른 종들
  alternatives_korean:
  - 다른 노예들
  - 다른 종/노예들
  lexicon: BDAG
  rationale: 이 비유의 맥락에서는 POB의 영어 선택처럼 봉사자/심부름꾼의 기능이 전면에 있어 '종'이 가장 자연스럽습니다. 동시에 주석으로 '노예' 가능성을 남겨 두었습니다.
- source_word: πλείονας τῶν πρώτων
  english_pob_choice: more than the first ones
  chosen_korean: 처음보다 더 많이
  alternatives_korean:
  - 첫 번째 사람들보다 더 많은
  - 처음 것들보다 더 많은
  lexicon: BDAG
  rationale: 비교 구조를 한국어로 간결하게 풀어, 후속 무리의 수가 더 많았음을 분명히 했습니다.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  english_pob_choice: and they did the same to them
  chosen_korean: 그들에게도 똑같이 했습니다
  alternatives_korean:
  - 그들에게도 같은 일을 했습니다
  - 그들도 그들에게 똑같이 했습니다
  lexicon: BDAG
  rationale: 앞선 종들에게 한 처우를 되풀이했다는 의미를 '똑같이'로 압축해, 본문의 반복성과 연결성을 살렸습니다.
