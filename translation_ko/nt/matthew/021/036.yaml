review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 πλείονας τῶν πρώτων은 이전에 보낸 ‘첫 종들’과의 수적 비교인데, ‘처음보다 더 많이’는 비교 대상이 사람들임을 충분히 드러내지 못합니다.
  naturalness: ‘처음보다 더 많이’는 현대 한국어에서 다소 불완전하고, 무엇보다 더 많은지 잠시 모호합니다. ‘처음에 보낸 종들보다 더 많이’가 자연스럽고 의미를 명확히 합니다.
  terminology: ‘종들’은 이 비유의 문맥에서 가능한 번역이며, ‘노예들’이라는 어휘 대안을 각주로 보존한 것도 적절합니다. ‘그리스어 doulous’는 한글 음역을 사용해 ‘그리스어 도울로스(δούλους)’로 쓰면 한국어 각주로 더 자연스럽고 원어 지시도 명확합니다.
  issues:
  - severity: medium
    issue: πλείονας τῶν πρώτων의 비교 대상이 불명확함
    rationale: ‘처음보다 더 많이’는 시간이나 횟수와 비교하는 듯하게도 읽힐 수 있습니다. 원문은 뒤에 보낸 종들의 수가 앞서 보낸 첫 종들의 수보다 많았다는 뜻이므로, ‘처음에 보낸 종들보다 더 많이’처럼 비교 대상을 밝혀야 합니다.
  revised_text: 다시 다른 종들을 처음에 보낸 종들보다 더 많이 보냈습니다. 그런데 그들에게도 똑같이 하였습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘다른 노예들’. 그리스어 도울로스(δούλους)는 문맥에 따라 ‘종’이나 ‘노예’를 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 비교 구문을 ‘처음에 보낸 종들보다 더 많이’로 고쳐 원문의 수적 비교와 선행 종들에 대한 지시를 명확히 했습니다. 접속사 ‘그런데’와 두 번째 절의 생략된 주어는 앞 절과 앞선 문맥의 포도원 소작인들을 자연스럽게 이어 주므로 유지했습니다. δοῦλος의 본문 번역과 어휘 대안 각주도 유지하되, 각주 표현을 한국어 독자에게 더 자연스럽게 다듬었습니다.
