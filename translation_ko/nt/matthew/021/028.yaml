  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐν τῷ ἀμπελῶνι의 장소 의미는 ‘포도원에서’로 드러내고, ὕπαγε의 이동 명령은 ‘포도원에 가서’로 함께 표현하는 편이 가장 분명합니다.
  naturalness: ‘한 사람이 자녀 둘을 두었습니다’도 이해되지만, 현대 표준어에서는 ‘한 사람에게는 자녀가 둘 있었습니다’가 더 자연스럽습니다. δέ의 약한 전환은 ‘그러나’보다 ‘그런데’가 문맥상 과도한 대립을 피합니다. 인용문 안의 ‘얘야’와 ‘일하여라’는 부모가 자녀에게 하는 말로 자연스럽고, 서술부의 합쇼체와 충돌하지 않습니다.
  terminology: τέκνα/τέκνον을 ‘자녀/얘야’로 넓게 유지한 것은 원문에 충실합니다. ‘포도원’은 ἀμπελών의 적절한 표준 번역입니다. 현 각주는 한국어 독자에게 영어 번역 관행을 설명하고 있어 부적절하므로, 그리스어의 어휘 범위만 설명하도록 고쳐야 합니다.
