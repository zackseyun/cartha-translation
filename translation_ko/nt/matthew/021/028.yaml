  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
  footnotes:
  - marker: a
    text: Or 'two sons.' Many English translations use 'sons,' but the Greek here says 'children' (τέκνα).
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 어떻게 생각하십니까? 한 사람에게는 자녀가 둘[a] 있었습니다. 그가 첫째에게 가서 말했습니다. 「얘야, 오늘 포도원에 가서 일하여라.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 아들’. 그리스어 τέκνα는 ‘자녀들’을 뜻하며, 이 절에서는 성별을 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  english_pob_choice: But what do you think?
  chosen_korean: 그러나 어떻게 생각하십니까?
  alternatives_korean:
  - 그런데 어떻게 생각하십니까?
  - 하지만 어떻게 생각하십니까?
  lexicon: BDAG
  rationale: δὲ의 약한 연결감을 살리면서도 한국어에서는 자연스러운 전환어로 옮겼습니다. δοκεῖ는 단순한 정보 요청이 아니라 듣는 이의 판단을 묻는 말이므로 ‘어떻게 생각하십니까?’로 표현했습니다.
- source_word: τέκνα δύο
  english_pob_choice: two children
  chosen_korean: 자녀 둘
  alternatives_korean:
  - 두 자녀
  - 두 아들
  lexicon: BDAG
  rationale: τέκνα는 ‘자녀/아이들’의 넓은 의미이므로, 본문에 없는 ‘아들’로 좁히지 않고 한국어에서도 포괄적인 표현을 유지했습니다.
- source_word: Τέκνον
  english_pob_choice: Child
  chosen_korean: 얘야
  alternatives_korean:
  - 아이야
  - 자녀야
  lexicon: BDAG
  rationale: 호격 τέκνον은 단순한 호칭으로서 ‘child’에 해당하지만, 한국어에서는 아버지가 자식에게 직접 부르는 말투가 더 자연스러워 ‘얘야’로 옮겼습니다.
- source_word: ἐν τῷ ἀμπελῶνι
  english_pob_choice: in the vineyard
  chosen_korean: 포도원에
  alternatives_korean:
  - 포도원 안에서
  - 포도밭에
  lexicon: BDAG
  rationale: ἀμπελών은 ‘포도원’이 가장 직접적인 대응이며, ἐν + 여격은 한국어에서 목적지/장소를 나타내는 조사 ‘에’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: τέκνα/τέκνον을 ‘아들/아들아’로 좁힐지 여부
  chosen_reading: ‘자녀 둘’과 ‘얘야’로 유지하여 원문의 더 넓은 가족어를 살림
  alternative_readings:
  - ‘두 아들’과 ‘아들아’
  - ‘두 아들’과 ‘얘야’
  rationale: 이 절의 그리스어는 υἱοί/υἱέ가 아니라 τέκνα/τέκνον을 사용하므로, 아직 ‘아들’로 확정하지 않고 원문의 범위를 보존했습니다. 이는 후속 문맥에서 아들로 드러날 가능성을 남겨 두는 번역입니다.
  doctrine_reference: Translation philosophy §§1, 4
