revisions:
- from: 그러나 어떻게 생각하십니까? 한 사람이 자녀 둘을 두었습니다. 첫째에게 가서 말했습니다. 「얘야, 오늘 포도원에 가서 일하여라.」[a]
  to: 그런데 어떻게 생각하십니까? 한 사람에게는 자녀가 둘[a] 있었습니다. 그가 첫째에게 가서 말했습니다. 「얘야, 오늘 포도원에 가서 일하여라.」
  rationale: 원문의 완곡한 전환, ‘두 자녀’라는 포괄적 가족어, 포도원으로 가서 그 안에서 일하라는 명령을 자연스러운 현대 한국어로 유지했습니다. 각주는 영어 번역에 대한 언급을 제거하고 원문의 어휘 범위와 직접 연결했으며, 표지를 해당 표현에 붙였습니다.
  reviewer_model: gpt-5.6-terra
