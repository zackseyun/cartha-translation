  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'Now this happened so that what was spoken through the prophet might be fulfilled[a], saying:'
  footnotes:
  - marker: a
    text: Or 'by the prophet.' The Greek more literally says 'through the prophet,' emphasizing prophetic mediation.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일은 예언자를 통해 말씀하신 것이 이루어지게 하려는 것이었습니다. 그분이 말씀하시기를:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '예언자를 통해'입니다. 이 표현은 예언자가 단순히 말한 것이 아니라, 예언자를 매개로 한 말씀의 전달을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: Τοῦτο δὲ γέγονεν
  english_pob_choice: Now this happened
  chosen_korean: 이 일은 … 것이었습니다
  alternatives_korean:
  - 이것이 일어났습니다
  - 이 일은 일어났습니다
  lexicon: BDAG
  rationale: 지시대명사와 완료형 서술을 자연스러운 서사체로 옮기기 위해 '이 일은'으로 시작했고, 완료의 결과 상태를 현대 한국어의 과거형 서술로 풀어 옮겼습니다.
- source_word: ἵνα πληρωθῇ
  english_pob_choice: so that ... might be fulfilled
  chosen_korean: 이루어지게 하려는
  alternatives_korean:
  - 성취되게 하려는
  - 이루어질 수 있게 하려는
  lexicon: BDAG
  rationale: ἵνα의 목적/결과 뉘앙스를 살리면서, 'fulfilled'의 수동적 성취 의미를 한국어에서 가장 자연스럽게 드러내기 위해 '이루어지게 하려는'으로 옮겼습니다.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  english_pob_choice: what was spoken through the prophet
  chosen_korean: 예언자를 통해 말씀하신 것
  alternatives_korean:
  - 예언자를 통해 선포된 것
  - 예언자를 통해 전해진 말씀
  lexicon: BDAG
  rationale: 수동 분사 ῥηθέν은 단순한 '말해진 것'보다 하나님의 선포로서의 말씀을 더 잘 드러내므로, POB의 'spoken'을 한국어에서 '말씀하신 것'으로 살렸습니다. διὰ + 속격은 중개/매개를 나타내므로 '통해'를 유지했습니다.
- source_word: λέγοντος
  english_pob_choice: saying
  chosen_korean: 그분이 말씀하시기를
  alternatives_korean:
  - 말하기를
  - 이르시기를
  lexicon: BDAG
  rationale: 직접 인용을 여는 분사로, 한국어에서는 앞선 '예언자를 통해'와의 연결이 자연스럽도록 '그분이 말씀하시기를'로 처리했습니다.
theological_decisions:
- issue: 예언적 중개성 보존
  chosen_reading: '''예언자를 통해''를 유지하여, 말씀의 출처가 하나님이시면서도 예언자를 매개로 전달되었다는 구조를 드러냈습니다.'
  alternative_readings:
  - '''예언자를 통해서'''
  - '''예언자를 통해서 하신 말씀'''
  rationale: 본문의 διά + 속격은 단순 저자 표지가 아니라 매개된 발화를 가리키므로, 이를 평탄하게 '예언자가 말한'으로 바꾸지 않고 중개성을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
