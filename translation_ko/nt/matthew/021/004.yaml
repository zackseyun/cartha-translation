  source_fidelity: 수정이 필요합니다. 초안의 ‘이루어지게 하려는 것이었습니다’는 이 사건 자체가 어떤 의도를 지닌 것처럼 표현하여, ἵνα πληρωθῇ의 성취 공식과 사건 발생의 관계를 다소 부정확하게 만듭니다. ‘이 일이 일어났습니다’와 ‘말씀이 이루어지도록’을 연결하면 원문의 목적/결과적 표현을 더 충실히 반영합니다. 또한 ‘그분’은 선행사가 불명확합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 인용문을 여는 문장으로도 매끄럽습니다. ‘그 말씀은 이러합니다:’는 원문의 λέγοντος가 수행하는 인용 도입 기능을 한국어답게 재현합니다.
  terminology: ‘예언자’, ‘말씀’, ‘이루어지도록’, ‘통하여’를 유지했습니다. ‘예언자를 통하여 전해진 말씀’은 원문의 수동 표현과 예언자를 통한 매개성을 보존하면서, 발화자를 본문 이상으로 특정하지 않습니다.
