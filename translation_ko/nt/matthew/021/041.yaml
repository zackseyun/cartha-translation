  lexicon: BDAG
  rationale: καρπούς는 문자적으로 ‘열매’이므로 이를 유지했고, καιροί는 농업적 맥락에서 ‘때가 될 때마다’로 옮겨 정한 시기를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 심판 진술의 강도와 범위
  chosen_reading: 그는 그 악한 자들을 비참하게 멸하고
  alternative_readings:
  - 그는 그 악한 자들을 멸하고
  - 그는 그 악한 자들을 끔찍하게 멸하고
