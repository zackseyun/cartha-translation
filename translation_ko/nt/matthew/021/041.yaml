  naturalness: 합쇼체 서술은 자연스럽습니다. ‘비참하게 멸하고’는 다소 문어적이고 동사의 목적 관계가 덜 분명할 수 있으므로 ‘비참하게 멸망시킬’로 다듬는 편이 현대 한국어에서 명료합니다. 각 주석 표지도 해당 어구 바로 뒤에 두는 것이 독해상 좋습니다.
  terminology: ‘포도원’, ‘농부들’, ‘열매’는 적절합니다. ‘악한 자들’은 Κακοὺς의 도덕적 평가를 보존하며, ‘비참하게’는 κακῶς의 강조된 심판 어조를 무리 없이 반영합니다. 교리적으로 심판의 방식을 과도하게 특정하지 않습니다.
