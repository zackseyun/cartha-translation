  - 다른 포도 재배자들에게
  lexicon: BDAG
  rationale: γεωργοί의 기본 뜻을 살리면서도, 앞의 ‘세로 주다’가 이미 소작 관계를 드러내므로 ‘농부들’로 자연스럽게 번역했습니다.
- source_word: τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν
  english_pob_choice: the fruits in their seasons
  chosen_korean: 때가 될 때마다 … 열매를 바칠 것입니다
  alternatives_korean:
