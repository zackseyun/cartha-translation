id: MAT.21.41
reference: Matthew 21:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
  footnotes:
  - marker: a
    text: Or, “He will miserably destroy those miserable men.” The Greek uses a wordplay with the adjective and adverb from the same root to intensify the judgment.
    reason: lexical_alternative
  - marker: b
    text: Or, “will rent out the vineyard to other tenants.”
    reason: lexical_alternative
  - marker: c
    text: Or, “will give him the produce at the proper times.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말했습니다. 「그는 그 악한 자들을 비참하게 멸하고, 포도원을 다른 농부들에게 세로 줄 것이며, 그들은 때가 될 때마다 그에게 열매를 바칠 것입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 악한 자들을 비참하게’는 같은 어근의 형용사와 부사가 겹치는 그리스어 말장난을 살린 번역입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘포도원을 다른 소작인들에게 세로 줄 것이다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘제때마다 그에게 소출을 바칠 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  english_pob_choice: They said to him
  chosen_korean: 그들이 그에게 말했습니다
  alternatives_korean:
  - 그들이 그에게 말합니다
  lexicon: SBLGNT; narrative historical present
  rationale: 본문의 현재형은 서술적 역사적 현재이지만, 한국어에서는 자연스러운 서술 과거로 옮겨 서사 흐름을 살렸습니다.
- source_word: Κακοὺς κακῶς
  english_pob_choice: miserably destroy those wretches
  chosen_korean: 그 악한 자들을 비참하게 멸하고
  alternatives_korean:
  - 그 악인들을 비참하게 멸하고
  - 그 나쁜 자들을 나쁘게 멸하고
  lexicon: BDAG
  rationale: 형용사와 부사의 어근 반복이 만드는 강조와 경멸을 살리기 위해 ‘악한 자들 / 비참하게’로 옮겼습니다.
- source_word: ἐκδώσεται
  english_pob_choice: will lease
  chosen_korean: 세로 줄 것이며
  alternatives_korean:
  - 임대할 것이며
  - 다른 농부들에게 맡길 것이며
  lexicon: BDAG
  rationale: 포도원과 소작 관계를 드러내는 동사로서 현대 한국어에서는 ‘세로 주다’가 가장 직접적이며, 계약적 관계를 분명하게 전달합니다.
- source_word: ἄλλοις γεωργοῖς
  english_pob_choice: to other farmers
  chosen_korean: 다른 농부들에게
  alternatives_korean:
  - 다른 소작인들에게
  - 다른 포도 재배자들에게
  lexicon: BDAG
  rationale: γεωργοί의 기본 뜻을 살리면서도, 앞의 ‘세로 주다’가 이미 소작 관계를 드러내므로 ‘농부들’로 자연스럽게 번역했습니다.
- source_word: τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν
  english_pob_choice: the fruits in their seasons
  chosen_korean: 때가 될 때마다 … 열매를 바칠 것입니다
  alternatives_korean:
  - 제때마다 … 열매를 바칠 것입니다
  - 자기들의 때에 열매를 바칠 것입니다
  lexicon: BDAG
  rationale: καρπούς는 문자적으로 ‘열매’이므로 이를 유지했고, καιροί는 농업적 맥락에서 ‘때가 될 때마다’로 옮겨 정한 시기를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 심판 진술의 강도와 범위
  chosen_reading: 그는 그 악한 자들을 비참하게 멸하고
  alternative_readings:
  - 그는 그 악한 자들을 멸하고
  - 그는 그 악한 자들을 끔찍하게 멸하고
  rationale: 본문은 심판의 강한 어조를 분명히 하지만, 멸망의 정확한 방식까지 특정하지는 않습니다. 한국어에서도 그 긴장을 유지하도록 강도를 살리되 과도한 해석은 피했습니다.
  doctrine_reference: 원문 우선, 심판의 형태는 본문이 말하는 범위 안에서만 번역
