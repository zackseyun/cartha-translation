id: MAT.21.14
reference: Matthew 21:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
  footnotes:
  - marker: a
    text: Greek ἱερόν refers to the temple complex or precincts, not specifically the inner sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 눈먼 사람들과 다리 저는 사람들은 성전[a] 안에서 예수께 나아왔습니다. 예수께서는 그들을 고치셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἱερόν은 성전의 내실 자체보다 성전 परिसर 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  english_pob_choice: came to him
  chosen_korean: 예수께 나아왔습니다
  alternatives_korean:
  - 예수께 왔습니다
  - 예수께 다가왔습니다
  lexicon: BDAG
  rationale: προσέρχομαι는 단순한 이동보다 대상에게 가까이 가는 뜻을 지니므로, 합쇼체 문맥에서는 ‘나아오다’가 자연스럽고 의미도 잘 드러냅니다.
- source_word: τυφλοὶ
  english_pob_choice: the blind
  chosen_korean: 눈먼 사람들
  alternatives_korean:
  - 맹인들
  - 눈먼 자들
  lexicon: BDAG
  rationale: 원문은 형용사의 명사적 복수이므로 사람을 분명히 드러내는 ‘눈먼 사람들’로 옮겼습니다. 전통적 교회 용어인 ‘맹인들’도 가능하지만, 현대 한국어에서는 설명성이 더 높습니다.
- source_word: χωλοὶ
  english_pob_choice: the lame
  chosen_korean: 다리 저는 사람들
  alternatives_korean:
  - 절뚝거리는 사람들
  - 절름발이들
  lexicon: BDAG
  rationale: χωλός는 걷는 데 장애가 있는 사람들을 가리키므로, 현대 독자가 바로 이해할 수 있는 ‘다리 저는 사람들’로 풀었습니다. 다만 ‘절름발이들’은 뉘앙스가 더 거칠 수 있어 피했습니다.
- source_word: ἐν τῷ ἱερῷ
  english_pob_choice: in the temple
  chosen_korean: 성전 안에서
  alternatives_korean:
  - 성전 뜰에서
  - 성전 구역에서
  lexicon: BDAG
  rationale: ἱερόν은 내전(ναός)보다 성전 परिसर 전체를 가리키므로, 장소의 넓은 범위를 살리되 문장으로는 간결한 ‘성전 안에서’로 옮겼습니다.
theological_decisions:
- issue: ἱερόν의 공간 범위
  chosen_reading: 예수께서는 성전 परिसर에서 그들을 고치셨습니다.
  alternative_readings:
  - 예수께서는 성전 뜰에서 그들을 고치셨습니다.
  - 예수께서는 성전 안에서 그들을 고치셨습니다.
  rationale: 본문은 내부 성소가 아니라 성전 구역 전체를 뜻하므로, 지나친 내실화 없이 예수의 치유가 공적 성전 영역에서 일어났음을 보존했습니다.
  doctrine_reference: 성전 용어의 범위 구분(ἱερόν vs ναός)
