review_pass:
  verdict: revise
  source_fidelity: 원문의 두 주어(τυφλοὶ καὶ χωλοὶ), 예수께 나아오는 동작(προσῆλθον αὐτῷ), 성전 구역이라는 장소(ἐν τῷ ἱερῷ), 그리고 예수의 치유(ἐθεράπευσεν αὐτούς)를 충실히 전달합니다. 다만 현행 각주에 한국어 문맥에 맞지 않는 외국어 표현이 섞여 있어 고쳐야 합니다.
  naturalness: ‘성전에서 눈먼 사람들과 다리를 저는 사람들이 예수께 나아왔습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘성전 안에서’보다 ‘성전에서’가 ἱερόν의 넓은 공간 범위를 불필요하게 실내로 한정하지 않습니다.
  terminology: ‘눈먼 사람들’과 ‘다리를 저는 사람들’은 원문의 명사화된 복수 형용사를 현대적으로, 비하적 표현 없이 옮깁니다. ἱερόν은 ‘성전’으로 번역하고, 각주에서 성소 자체가 아닌 성전 구역 전체라는 범위를 명시합니다.
  issues:
  - severity: medium
    issue: 각주에 ‘성전 परिसर’라는 한국어가 아닌 표현이 포함되어 있습니다.
    rationale: 독자에게 의미가 불명확하고 한국어 번역문의 구조·언어 일관성을 해칩니다. ‘성전 구역 전체’로 바로잡아야 합니다.
  - severity: low
    issue: 본문의 ‘성전 안에서’는 ἱερόν의 넓은 공간 범위를 다소 실내 공간처럼 들리게 할 수 있습니다.
    rationale: ἱερόν은 내실/성소(ναός)가 아니라 성전 경내·구역을 가리킵니다. ‘성전에서’가 자연스러우면서도 범위를 과도하게 좁히지 않습니다.
  revised_text: 성전에서 눈먼 사람들과 다리를 저는 사람들이 예수께 나아왔습니다. 예수께서는 그들을 고치셨습니다.
  revised_footnotes:
  - marker: a
    text: 헬라어 ἱερόν은 성소 자체가 아니라 성전 경내 또는 성전 구역 전체를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 각주의 비한국어 표현을 수정하여 구조적·언어적 문제를 해소했습니다. 또한 ‘성전 안에서’를 ‘성전에서’로 다듬어 ἱερόν이 가리키는 성전 경내의 넓은 범위를 보존했습니다. 나머지 문장은 원문의 동작, 대상, 치유를 충실하고 자연스럽게 전달하므로 유지했습니다.
