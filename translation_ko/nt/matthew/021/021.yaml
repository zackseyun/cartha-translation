id: MAT.21.21
reference: Matthew 21:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
  footnotes:
  - marker: a
    text: Or “do not waver” or “are not divided in mind.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 대답하여 말씀하셨습니다. “진실로 내가 여러분에게 말합니다. 여러분에게 믿음이 있고 의심하지 않으면[a], 무화과나무에 일어난 일만 할 뿐 아니라, 이 산더러 ‘들려서 바다에 던져지라’고 말하여도 그렇게 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “흔들리지 않으면”, “마음이 갈라지지 않으면”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  english_pob_choice: But Jesus answered them
  chosen_korean: 예수께서 그들에게 대답하여 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그들에게 대답하셨습니다
  - 예수께서 그들에게 말씀하셨습니다
  lexicon: BDAG
  rationale: ἀποκριθεὶς는 응답의 서두를 여는 분사이므로 ‘대답하여’로 살리고, εἶπεν은 직역보다 자연스러운 공손한 서술형 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: Ἀμὴν λέγω ὑμῖν
  english_pob_choice: Truly I say to you
  chosen_korean: 진실로 내가 여러분에게 말합니다
  alternatives_korean:
  - 아멘, 내가 여러분에게 말합니다
  - 진실로 내가 너희에게 말합니다
  lexicon: BDAG
  rationale: ἀμήν의 엄숙한 선언성을 ‘진실로’로 옮기고, 2인칭 복수는 문맥상 현대 공용어에 맞게 ‘여러분에게’로 자연화했습니다.
- source_word: μὴ διακριθῆτε
  english_pob_choice: do not doubt
  chosen_korean: 의심하지 않으면
  alternatives_korean:
  - 흔들리지 않으면
  - 마음이 갈라지지 않으면
  lexicon: BDAG
  rationale: διακρίνω의 여기서의 핵심은 내적 망설임과 의심이므로 기본 본문에는 ‘의심하다’를 택하되, 다른 뉘앙스 가능성은 본문의 다른 자료에 맞춰 남겨둘 수 있습니다.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  english_pob_choice: you will not only do what was done to the fig tree
  chosen_korean: 무화과나무에 일어난 일만 할 뿐 아니라
  alternatives_korean:
  - 무화과나무에 한 일을 할 뿐 아니라
  - 무화과나무에 일어난 그 일만 할 뿐 아니라
  lexicon: BDAG
  rationale: τὸ τῆς συκῆς는 생략된 사건 지시이므로 ‘무화과나무에 일어난 일’로 풀어 한국어에서 자연스럽게 사건을 가리키게 했습니다.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  english_pob_choice: Be taken up and thrown into the sea
  chosen_korean: 들려 바다에 던져지라
  alternatives_korean:
  - 들려서 바다에 던져지라
  - 들어 올려져 바다에 던져지라
  lexicon: BDAG
  rationale: 두 수동 명령을 한국어 명령형으로 압축하되, ‘들려’와 ‘던져지라’로 물리적 이동의 이미지를 유지했습니다.
- source_word: γενήσεται
  english_pob_choice: it will happen
  chosen_korean: 그렇게 될 것입니다
  alternatives_korean:
  - 그 일이 일어날 것입니다
  - 그것이 될 것입니다
  lexicon: BDAG
  rationale: γίνομαι의 미래는 결과 발생을 가리키므로, 한국어에서는 예언적 성격이 드러나는 ‘그렇게 될 것입니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 믿음과 의심의 대조를 어떻게 살릴 것인가
  chosen_reading: 믿음이 있고 의심하지 않으면
  alternative_readings:
  - 믿음이 있고 흔들리지 않으면
  - 믿음이 있고 마음이 갈라지지 않으면
  rationale: 본문의 대조는 단순한 지적 회의보다 신뢰의 결여와 내적 분열까지 포괄할 수 있으나, 본문 기본역은 가장 직접적인 ‘의심’으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: πίστις → 믿음; διακρίνω의 문맥상 의미'
- issue: 산을 바다에 던지는 표현의 해석 긴장
  chosen_reading: 예언적 과장/상징을 보존하고 의미를 단정하지 않음
  alternative_readings:
  - 문자적 기적의 약속으로 한정
  - 비유적 난관 극복의 표현으로 한정
  rationale: 본문의 힘은 과장적이고 시각적인 언어에 있으므로, 번역은 그 긴장을 해소하지 않고 그대로 유지해야 합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
