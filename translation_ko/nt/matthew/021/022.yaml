review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘믿고 구하면’은 헬라어의 동시적 현재분사 πιστεύοντες를 한국어 조건 연결로 다소 더 강하게 재구성할 수 있습니다. ‘믿고 구하는 것은 무엇이든지’는 믿음과 구함의 동시성을 더 직접적으로 드러냅니다. λήμψεσθε에는 단순 미래인 ‘받을 것입니다’가 ‘받게 될 것입니다’보다 가깝습니다.
  naturalness: 수정문은 표준어 현대 합쇼체로 자연스럽고, 포괄적 대상과 기도 및 믿음의 관계가 명료합니다.
  terminology: ‘기도’, ‘믿고’, ‘구하는 것’, ‘받을 것입니다’는 신약 문맥과 한국어 성경 문체 모두에 적절합니다. ‘믿고’는 πιστεύοντες의 직설적 표현으로 유지했습니다.
  issues:
  - severity: low
    issue: 각주 표지가 해당 어구에 직접 붙어 있지 않습니다.
    rationale: a는 ‘무엇이든지’, b는 ‘믿고’의 번역 대안을 설명하므로 각 해당 어구 뒤에 배치하는 편이 각주 앵커의 범위를 분명히 합니다.
  - severity: medium
    issue: ‘믿고 구하면’이 믿음의 분사를 조건적 연결로 다소 강화할 수 있습니다.
    rationale: 원문은 명시적 조건절이 아니라 ‘믿으면서/믿고’라는 동시적 분사를 사용합니다. 한국어에서 ‘믿고 구하는 것은’으로 옮기면 그 결합을 보존하면서 불필요하게 조건 구조를 전면화하지 않습니다.
  - severity: low
    issue: ‘받게 될 것입니다’에는 원문에 없는 결과적·사역적 뉘앙스가 약하게 있을 수 있습니다.
    rationale: 미래 중간태 λήμψεσθε는 여기서 자연스럽게 ‘받을 것입니다’로 옮길 수 있습니다.
