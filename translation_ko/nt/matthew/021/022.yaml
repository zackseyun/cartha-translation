  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
  footnotes:
  - marker: a
    text: Or 'all that you ask' or 'everything you ask.'
    reason: lexical_alternative
  - marker: b
    text: Or 'trusting'; the Greek participle means believing as you pray.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러분이 기도할 때 믿고[b] 구하는 것은 무엇이든지[a] 받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무엇이든지’는 ‘모든 것’, ‘무엇을 막론하고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘믿고’는 ‘신뢰하며’로도 옮길 수 있으나, 본문은 기도 중의 믿음을 직접 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  english_pob_choice: whatever
  chosen_korean: 무엇이든지
  alternatives_korean:
  - 모든 것
  - 무엇을 막론하고
  - 무엇이든
  lexicon: BDAG
  rationale: πᾶς와 ὅσος의 결합이 만드는 포괄적 표현을 한국어의 자연스러운 개방형 표현인 ‘무엇이든지’로 옮겨, 범위를 넓게 유지했습니다.
- source_word: ἂν αἰτήσητε
  english_pob_choice: you ask
  chosen_korean: 구하면
  alternatives_korean:
  - 구할 것입니다
  - 구할지라도
  - 구하시게 되면
  lexicon: BDAG
  rationale: ἄν이 붙은 부정과거 가정형을 한국어에서 자연스럽게 조건적 의미를 띠는 ‘-면’ 구조로 풀어, 과도한 조동사 해석 없이 요청 행위를 드러냈습니다.
- source_word: ἐν τῇ προσευχῇ
  english_pob_choice: in prayer
  chosen_korean: 기도할 때
  alternatives_korean:
  - 기도 중에
  - 기도 안에서
  - 기도 가운데
  lexicon: BDAG
  rationale: 전치사구의 뜻을 한국어에서 가장 자연스럽게 전달하기 위해 ‘기도할 때’로 옮겼으며, 명사 ‘기도’를 유지하면서 행위의 상황성을 살렸습니다.
- source_word: πιστεύοντες
  english_pob_choice: believing
  chosen_korean: 믿고
  alternatives_korean:
  - 믿으면서
  - 믿으며
  - 믿는 가운데
  lexicon: BDAG
  rationale: 현재분사를 동시적 행위로 살려, 구하는 행위와 믿음이 함께 진행된다는 점을 ‘믿고’로 간결하게 반영했습니다.
- source_word: λήμψεσθε
  english_pob_choice: you will receive
  chosen_korean: 받게 될 것입니다
  alternatives_korean:
  - 받을 것입니다
  - 받게 됩니다
  - 받으실 것입니다
  lexicon: BDAG
  rationale: 미래 중간태의 자연스러운 한국어로 ‘받게 될 것입니다’를 택해, 문체의 격식을 유지하면서도 결과의 확정성을 표현했습니다.
theological_decisions:
- issue: 믿음과 응답의 관계를 조건문으로 과도하게 해석할지 여부
  chosen_reading: ‘믿고 구하면’으로 옮겨, 믿음과 기도의 결합을 분명히 하되 명시적 조건절 ‘만일’은 넣지 않았습니다.
  alternative_readings:
  - 믿으면
  - 믿는다면
  - 믿고서야
  rationale: 헬라어는 조건절이 아니라 분사구를 사용하므로, 한국어에서도 그 결합을 살리되 신학적 메커니즘을 지나치게 좁히지 않도록 했습니다.
  doctrine_reference: 믿음과 기도에 대한 긴장은 보존하고, 본문이 말하는 범위를 넘겨 단정하지 않습니다.
