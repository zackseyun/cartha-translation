id: MAT.21.12
reference: Matthew 21:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
  footnotes:
  - marker: a
    text: Or 'the temple' or 'the temple precincts'; the Greek word refers to the broader temple complex rather than specifically the inner sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 성전 뜰로 들어가셔서 그곳에서 사고팔던 사람들을 모두 내쫓으시고, 돈 바꾸는 이들의 탁자들을 뒤엎으시며 비둘기 파는 이들의 의자들을 뒤엎으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전’ 또는 ‘성전 구역’. 여기서 헬라어는 내적 성소가 아니라 더 넓은 성전 복합 구역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  english_pob_choice: temple courts
  chosen_korean: 성전 뜰
  alternatives_korean:
  - 성전
  - 성전 구역
  lexicon: BDAG
  rationale: ἱερόν은 지성소나 성소 자체보다 성전 복합 구역을 가리키므로, 예수께서 들어가신 장소를 ‘성전 뜰’로 옮겨 좁은 성소 प्रवेश으로 오해하지 않게 했습니다.
- source_word: ἐξέβαλεν
  english_pob_choice: drove out
  chosen_korean: 내쫓으시고
  alternatives_korean:
  - 몰아내시고
  - 쫓아내시고
  lexicon: BDAG
  rationale: 이 동사는 단순 이동이 아니라 강한 추방 행위를 나타내므로, 현대 한국어에서 힘 있는 동작을 살리는 ‘내쫓으시고’로 옮겼습니다.
- source_word: κολλυβιστῶν
  english_pob_choice: money changers
  chosen_korean: 돈 바꾸는 이들
  alternatives_korean:
  - 환전상들
  - 돈꾼들
  lexicon: BDAG
  rationale: 성전 맥락에서 화폐 교환을 하는 사람들을 가리키므로, 종교적 관용어보다 의미가 분명한 ‘돈 바꾸는 이들’을 택했습니다.
- source_word: περιστεράς
  english_pob_choice: doves
  chosen_korean: 비둘기
  alternatives_korean:
  - 산비둘기
  - 구관조
  lexicon: BDAG
  rationale: 제의적 맥락에서 sacrificial bird로 쓰이는 일반적인 한국어 대응은 ‘비둘기’이므로, 본문 의도를 가장 자연스럽게 드러내는 표현을 사용했습니다.
theological_decisions:
- issue: 성전 관련 장소 표현의 범위
  chosen_reading: 예수께서 성전 뜰에 들어가셔서 상업 행위를 제지하신 것으로 이해했습니다.
  alternative_readings:
  - 성전 자체로 일반화하여 옮기는 방식
  - 성전 구역이라는 더 설명적인 표현
  rationale: 본문의 ἱερόν은 내적 성소가 아니라 성전 복합 구역을 가리키므로, 역사적·공간적 뉘앙스를 보존하면서도 과도한 설명을 덧붙이지 않는 번역을 선택했습니다.
  doctrine_reference: Translation philosophy §1, §5
