review_pass:
  verdict: revise
  source_fidelity: 원문의 ἱερόν을 ‘성전 뜰’로 옮겨 성소 자체와 구별한 점은 적절하며, 매매하는 모든 사람을 내쫓고 환전상들의 탁자와 비둘기 판매자들의 의자를 뒤엎었다는 핵심 의미도 보존합니다. 다만 원문은 ‘성전 뜰에서 팔고 사는’이라는 장소 수식을 명시하므로 이를 번역문에도 직접 드러내는 편이 더 충실합니다. 또한 κατέστρεψεν 하나가 두 목적어(탁자들과 의자들)에 함께 걸리므로 한국어에서도 하나의 서술로 연결하는 것이 구조를 더 정확히 반영합니다.
  naturalness: 초안은 전반적으로 자연스럽고 합쇼체도 일관됩니다. 그러나 ‘그곳에서’보다 ‘성전 뜰에서’가 지시 대상이 명료하며, ‘탁자들을 뒤엎으시며 … 의자들을 뒤엎으셨습니다’는 동일 동작을 불필요하게 반복하고 앞 절을 부수적으로 들리게 합니다.
  terminology: ‘성전 뜰’, ‘돈 바꾸는 이들’, ‘비둘기’는 문맥상 이해 가능하고 신학적으로 과도한 해석을 더하지 않습니다. 각주에서 ‘내적 성소’는 현대 한국어에서 다소 부자연스러우므로 ‘성전 내부의 성소’로 다듬습니다.
  issues:
  - severity: low
    issue: 상행위 장소의 명시성이 약함
    rationale: ἐν τῷ ἱερῷ는 팔고 사는 사람들을 수식합니다. ‘그곳에서’도 선행 장소를 가리키지만, ‘성전 뜰에서’라고 반복하면 원문의 장소 한정이 더 분명해집니다.
  - severity: low
    issue: 뒤엎는 행위의 중복 및 연결
    rationale: κατέστρεψεν은 ‘환전상들의 탁자들’과 ‘비둘기를 파는 이들의 의자들’을 함께 목적어로 취합니다. 한국어에서도 두 목적어를 묶어 한 번의 ‘뒤엎으셨습니다’로 표현하는 편이 자연스럽고 원문 구조에 가깝습니다.
  - severity: low
    issue: 각주 표현의 자연스러움
    rationale: ‘내적 성소’보다 ‘성전 내부의 성소’가 현대 표준 한국어에서 더 자연스럽습니다.
  revised_text: 예수께서 성전 뜰에 들어가셔서, 성전 뜰에서 팔고 사는 사람들을 모두 내쫓으시고 돈 바꾸는 이들의 탁자들과 비둘기를 파는 이들의 의자들을 뒤엎으셨습니다.[a]
