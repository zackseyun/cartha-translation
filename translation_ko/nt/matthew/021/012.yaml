revisions:
- from: 예수께서 성전 뜰로 들어가셔서 그곳에서 사고팔던 사람들을 모두 내쫓으시고, 돈 바꾸는 이들의 탁자들을 뒤엎으시며 비둘기 파는 이들의 의자들을 뒤엎으셨습니다.[a]
  to: 예수께서 성전 뜰에 들어가셔서, 성전 뜰에서 팔고 사는 사람들을 모두 내쫓으시고 돈 바꾸는 이들의 탁자들과 비둘기를 파는 이들의 의자들을 뒤엎으셨습니다.[a]
  rationale: 장소 수식의 범위를 명료하게 하고, 원문의 단일 동사가 두 목적어를 함께 취하는 구조를 한국어 문장에도 반영했습니다. ‘성전 뜰’이라는 선택과 각주의 공간적 설명은 유지하여 ἱερόν과 ναός의 구별을 보존했습니다.
