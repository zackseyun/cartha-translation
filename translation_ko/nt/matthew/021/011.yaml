  source_fidelity: 원문의 δέ, 복수 주어 οἱ ὄχλοι, 미완료 과거 ἔλεγον, 그리고 ὁ προφήτης의 정관사와 나사렛·갈릴리 지리 표지를 대체로 충실히 반영했습니다. 다만 ‘말했습니다’는 미완료 과거의 진행·반복적 발화 양상을 충분히 드러내지 못하며, ‘갈릴리 나사렛 출신의 그 예언자 예수’는 원문의 동격 관계를 한국어에서 다소 부자연스럽게 만듭니다.
  naturalness: ‘군중들은 … 말하고 있었습니다’가 복수 집단의 계속된 발화를 자연스럽게 드러냅니다. ‘예수라는 그 예언자’는 ‘그 예언자 예수’보다 현대 표준 한국어에서 이름과 직함의 관계를 더 매끄럽게 표현합니다.
  terminology: ‘예언자’는 προφήτης에 적절하며, ‘그 예언자’는 정관사의 특정성 및 가능한 함의를 유지하되 그 인물을 특정한 종말론적 인물로 해석해 확정하지 않습니다. ‘갈릴리 나사렛’은 통용 지명 표기이며 적절합니다.
