id: MAT.21.11
reference: Matthew 21:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
  footnotes:
  - marker: a
    text: Or “a prophet.” The Greek has “the prophet,” which may reflect the crowd’s identification of Jesus as a recognized prophetic figure.
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 군중들은 이렇게 말하고 있었습니다. “이분은 갈릴리 나사렛 출신인 예수라는 그 예언자입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예언자.” 그리스어에는 “그 예언자”라는 표현이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  english_pob_choice: And the crowds
  chosen_korean: 그런데 군중은
  alternatives_korean:
  - 그리고 군중은
  - 무리들은
  lexicon: BDAG
  rationale: δὲ의 약한 전환을 자연스럽게 살리면서 ὄχλοι의 복수성을 한국어에서 가장 무리 없이 드러냈습니다.
- source_word: ἔλεγον
  english_pob_choice: were saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하고 있었습니다
  - 계속 말했습니다
  lexicon: BDAG
  rationale: 한국어에서는 영어의 진행상을 그대로 옮기기보다 문맥상 반복적 발화를 자연스러운 과거로 옮기는 편이 읽기 좋습니다.
- source_word: ὁ προφήτης
  english_pob_choice: the prophet
  chosen_korean: 그 예언자
  alternatives_korean:
  - 예언자
  - 그 선지자
  lexicon: BDAG
  rationale: 정관사와 함께 특정 인물을 가리키는 표현이므로 ‘그’를 살려 식별성을 유지했고, 전통적 교회어인 ‘선지자’보다 원문의 일반 명칭에 가까운 ‘예언자’를 택했습니다.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  english_pob_choice: from Nazareth of Galilee
  chosen_korean: 갈릴리 나사렛 출신의
  alternatives_korean:
  - 갈릴리 나사렛에서 온
  - 갈릴리의 나사렛 출신인
  lexicon: BDAG
  rationale: ἀπό를 ‘출신의’로 옮겨 출처·기원을 간결하게 나타냈고, τῆς Γαλιλαίας는 지리적 식별을 위해 ‘갈릴리’로 보존했습니다.
theological_decisions:
- issue: ὁ προφήτης의 정관사 보존 여부
  chosen_reading: 그 예언자
  alternative_readings:
  - 예언자
  - 한 예언자
  rationale: 본문의 정관사는 군중이 예수를 단순히 어떤 예언자 하나가 아니라 특정 예언자적 인물로 인식하고 있음을 시사하므로, 그 뉘앙스를 약화시키지 않도록 ‘그’를 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolving identification beyond the Greek text.
