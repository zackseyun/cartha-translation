id: MAT.21.7
reference: Matthew 21:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
  footnotes:
  - marker: a
    text: Or, more specifically, 'he sat on the cloaks' that had been placed on the animals.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 나귀와 새끼 나귀를 데려와, 그 위에 자기들의 겉옷을 얹었습니다. 그리고 예수께서 그 위에 앉으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 구체적으로는, 동물들 위에 얹어 둔 겉옷 위에 앉으셨다는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγαγον
  english_pob_choice: They brought
  chosen_korean: 데려와
  alternatives_korean:
  - 데려왔습니다
  - 끌고 왔습니다
  - 가져왔습니다
  lexicon: BDAG
  rationale: ἄγω의 부정과거는 이 문맥에서 ‘데려오다/가져오다’로 자연스럽게 옮길 수 있습니다. 동물이 사람의 인도로 현장에 도착했다는 장면이므로 ‘데려와’가 간결하고 자연합니다.
- source_word: ὄνον
  english_pob_choice: the donkey
  chosen_korean: 나귀
  alternatives_korean:
  - 당나귀
  - 암나귀
  lexicon: BDAG
  rationale: ὄνος는 일반적으로 나귀를 뜻합니다. 본문은 성별 표지가 있으나 한국어 본문에서는 과도한 설명을 덜어 ‘나귀’로 두고, 필요하면 주석에서 보완할 수 있습니다.
- source_word: πῶλον
  english_pob_choice: the colt
  chosen_korean: 새끼 나귀
  alternatives_korean:
  - 망아지
  - 어린 나귀
  lexicon: BDAG
  rationale: πῶλος는 어린 짐승을 가리키며 여기서는 문맥상 어린 나귀입니다. ‘새끼 나귀’가 마태의 병치 구조를 가장 분명하게 살립니다.
- source_word: ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια
  english_pob_choice: put their cloaks on them
  chosen_korean: 그 위에 자기들의 겉옷을 얹었습니다
  alternatives_korean:
  - 그 위에 겉옷을 깔았습니다
  - 그들 위에 망토를 놓았습니다
  lexicon: BDAG
  rationale: ἱμάτια는 겉옷/외투입니다. 말타기용으로 ‘얹다’가 자연스럽고, ‘자기들의’는 원문의 소유 관계를 반영합니다.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  english_pob_choice: he sat on them
  chosen_korean: 그 위에 앉으셨습니다
  alternatives_korean:
  - 그들 위에 앉으셨습니다
  - 그 겉옷 위에 앉으셨습니다
  lexicon: BDAG
  rationale: 원문은 복수 대명사 αὐτῶν이 가리키는 대상이 동물들인지 겉옷인지 문법적으로 여지를 남깁니다. 한국어 본문은 그 모호성을 완전히 해소하지 않고 ‘그 위에’로 자연스럽게 보존합니다.
theological_decisions:
- issue: 마지막 복수 대명사 αὐτῶν의 지시 대상
  chosen_reading: 본문은 ‘그 위에 앉으셨습니다’로 두어, 예수께서 동물들 위에 앉으셨는지 겉옷 위에 앉으셨는지의 여지를 남깁니다.
  alternative_readings:
  - 예수께서 그 겉옷 위에 앉으셨습니다
  - 예수께서 그들 모두 위에 앉으셨습니다
  rationale: 이 구절은 교리 쟁점이 아니라 서술상의 모호성입니다. 번역은 원문의 긴장을 보존하는 쪽이 적절하므로, 본문은 중립적으로 처리합니다.
  doctrine_reference: 'Translation philosophy: Preserve genuine ambiguity rather than resolve it.'
