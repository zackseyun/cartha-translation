    rationale: 원문에는 강조 대명사 Ἐγώ와 호격 κύριε가 함께 있습니다. ‘제가’만 남아 있다는 설명은 호칭 요소를 누락하므로, 생략된 동사와 공손한 호칭을 함께 설명해야 합니다.
