id: MAT.21.30
reference: Matthew 21:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
  footnotes:
  - marker: a
    text: Or, more literally, 'I, sir'—an elliptical reply meaning 'I will' or 'I will go.'
    reason: lexical_alternative
  - marker: b
    text: Greek κύριε can also be rendered 'lord' or 'master'; here it is used as a respectful address to a human father, so 'sir' is preferred.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 둘째에게 가서 똑같이 말씀하셨습니다. 둘째가 대답했습니다. “아버님, 제가 가겠습니다.” 그러나 가지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 직역하면 “저, κύριε”라고만 말하며, ‘가겠습니다’에 해당하는 동사는 생략되어 있습니다. 문맥상 그 뜻을 보완하여 “제가 가겠습니다”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어 κύριε는 ‘주님’, ‘주인님’, 또는 사람에게 쓰는 공손한 호칭으로 옮길 수 있습니다. 여기서는 비유의 문맥상 아버지에게 드린 공손한 호칭이므로 ‘아버님’으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  english_pob_choice: came
  chosen_korean: 다가가서
  alternatives_korean:
  - 와서
  - 그에게 가서
  - 나아가서
  lexicon: BDAG
  rationale: 아버지가 둘째에게 이동하는 동작을 자연스럽게 드러내면서도, 단순한 ‘오다’보다 대상에게 접근하는 뉘앙스를 살렸습니다.
- source_word: τῷ δευτέρῳ
  english_pob_choice: to the second
  chosen_korean: 둘째에게
  alternatives_korean:
  - 둘째 아들에게
  - 두 번째에게
  - 그 둘째에게
  lexicon: BDAG
  rationale: 헬라어가 ‘둘째’를 간명하게만 말하므로, 문맥상 생략된 ‘아들’을 보태되 한국어에서는 자연스럽게 ‘둘째에게’로 옮겼습니다.
- source_word: Ἐγώ
  english_pob_choice: I will
  chosen_korean: 제가 가겠습니다
  alternatives_korean:
  - 제가 하겠습니다
  - 저요
  - 제가 가요
  lexicon: BDAG
  rationale: 원문은 ‘나’만 있는 생략된 응답이지만, 문맥상 ‘가겠다’는 뜻이므로 한국어에서는 생략된 동사를 보충해 의미를 분명히 했습니다. 존댓말로의 응답이므로 ‘제가’와 ‘-겠습니다’를 택했습니다.
- source_word: κύριε
  english_pob_choice: sir
  chosen_korean: 아버님
  alternatives_korean:
  - 선생님
  - 주인님
  - 주님
  lexicon: BDAG
  rationale: 이 호칭은 사람인 아버지에게 드리는 공손한 호칭이므로, 영어 POB의 ‘sir’와 같은 기능을 하되 한국어에서는 가족 관계를 드러내는 공손한 호칭 ‘아버님’이 가장 자연스럽습니다.
theological_decisions:
- issue: κύριε의 번역을 신적 호칭으로 읽을지 여부
  chosen_reading: 여기서는 예수나 하나님을 향한 ‘주님’이 아니라, 아버지에게 드리는 공손한 호칭으로 처리했습니다.
  alternative_readings:
  - 주님
  - 주인님
  rationale: 직전 문맥상 아버지와 아들의 비유적 대화이므로, 신학적 호칭으로 격상하면 원문의 인간 관계 장면이 흐려집니다. 영어 POB의 판단대로 예의적 호칭으로 유지하는 것이 본문 의도에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος의 문맥적 변이(인간 호칭 vs. 신적 칭호)'
