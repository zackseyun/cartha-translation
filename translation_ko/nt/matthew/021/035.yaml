id: MAT.21.35
reference: Matthew 21:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his slaves; one they beat[a], another they killed, and another they stoned.
  footnotes:
  - marker: a
    text: Or 'servants.' The Greek word is douloi, which can mean either 'slaves' or 'servants' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 농부들은 그의 종들을 붙잡았습니다. 그들 가운데 하나는 때리고, 다른 하나는 죽이고, 또 다른 하나는 돌로 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노예들’. 헬라어 δοῦλοι는 문맥에 따라 ‘종들’ 또는 ‘노예들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ γεωργοὶ
  english_pob_choice: tenant farmers
  chosen_korean: 농부들
  alternatives_korean:
  - 소작농들
  - 임차 농부들
  - 포도원 소작인들
  lexicon: BDAG
  rationale: 문맥상 포도원을 맡아 일하는 자들이므로 단순한 ‘농부들’보다 소작 관계가 드러나는 표현이 적절하지만, 한국어에서 가장 자연스러운 간결성을 위해 본문에는 ‘농부들’을 두고, 필요 시 주석으로 소작적 성격을 보완할 수 있습니다.
- source_word: τοὺς δούλους αὐτοῦ
  english_pob_choice: his slaves
  chosen_korean: 그의 종들을
  alternatives_korean:
  - 그의 노예들을
  - 그의 하인들을
  - 그의 종노릇하는 이들을
  lexicon: BDAG
  rationale: 영어 POB의 ‘slaves’는 본문에서 종속·소유 관계를 드러내려는 선택이지만, 한국어에서는 ‘노예들’이 현대 독자에게 과도하게 역사적·사회적 이미지를 앞세울 수 있어, 본문에는 중립적인 ‘종들’을 두되 영어 선택의 긴장을 유지합니다.
- source_word: ἔδειραν
  english_pob_choice: beat
  chosen_korean: 때리고
  alternatives_korean:
  - 때렸고
  - 매질했고
  - 채찍질했고
  lexicon: BDAG
  rationale: δέρειν은 구타를 뜻하므로, 행위의 연속을 살리는 서술형 ‘때리고’가 본문 흐름에 맞습니다. ‘매질하다’는 더 강한 형법적 뉘앙스를 덧붙일 수 있습니다.
- source_word: ἀπέκτειναν
  english_pob_choice: killed
  chosen_korean: 죽이고
  alternatives_korean:
  - 죽였고
  - 살해하고
  - 목숨을 빼앗고
  lexicon: BDAG
  rationale: 동사의 직접적 의미를 가장 간단히 드러내는 현대 한국어는 ‘죽이다’입니다. ‘살해하다’는 법적·도덕적 색채가 더 강합니다.
- source_word: ἐλιθοβόλησαν
  english_pob_choice: stoned
  chosen_korean: 돌로 쳤습니다
  alternatives_korean:
  - 돌로 쳤고
  - 돌로 때렸습니다
  - 돌로 쳐 죽였습니다
  lexicon: BDAG
  rationale: λιθοβολέω는 돌로 던져 공격하거나 처형하는 행위를 뜻하므로, 한국어에서는 관용적으로 이해되는 ‘돌로 치다’가 가장 자연스럽습니다. ‘돌로 쳐 죽였습니다’는 결과를 과하게 명시할 수 있습니다.
theological_decisions:
- issue: δοῦλοι의 한국어 처리와 본문의 충격성
  chosen_reading: 본문에는 ‘종들’을 사용하되, 주석/대조 번역에서 ‘노예들’ 가능성을 열어 둡니다.
  alternative_readings:
  - 노예들
  - 하인들
  rationale: 도구적·소유적 관계를 드러내는 원문의 긴장을 보존해야 하지만, 한국어 본문에서 ‘노예들’은 현대 독자에게 본문의 비유적 기능보다 사회사적 뉘앙스를 앞세울 수 있습니다. 따라서 읽기 자연성과 의미 충실성의 균형을 위해 ‘종들’을 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table for δοῦλος; Translation philosophy §1'
