revisions:
- from: 농부들은 그의 종들을 붙잡았습니다. 그들 가운데 하나는 때리고, 다른 하나는 죽이고, 또 다른 하나는 돌로 쳤습니다.[a]
  to: 소작농들은 그의 노예들[a]을 붙잡아, 그들 가운데 한 사람은 때리고, 다른 한 사람은 죽이고, 또 다른 한 사람은 돌로 쳤습니다.
  rationale: 비유의 토지 임차 관계를 반영하도록 γεωργοί를 ‘소작농들’로, 소유·종속 관계를 보존하도록 δοῦλοι를 ‘노예들’로 고쳤습니다. 원문의 세 차례 대조 구조와 폭력 행위의 정도를 유지했으며, 돌로 친 결과가 반드시 사망이었다고 본문에서 단정하지 않았습니다. 각주 표지는 해당 어휘 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:48Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. οἱ γεωργοί는 이 비유의 문맥에서 단순한 농업 종사자보다 토지를 맡아 경작하는 소작 관계의 경작자들을 가리키므로 ‘농부들’만으로는 핵심 관계가 약화됩니다. 또한 δοῦλοι는 이 문맥에서 ‘노예들’로 옮기는 것이 소유·종속 관계를 더 직접적으로 보존합니다. 세 대상을 구별하는 ὃν μὲν ... ὃν δὲ ... ὃν δὲ의 구조도 ‘한 사람은 … 다른 한 사람은 … 또 다른 한 사람은’으로 명확히 반영했습니다.
  naturalness: 합쇼체의 현대 표준어로 자연스럽게 다듬었습니다. ‘그들 가운데 하나’는 사람을 가리키는 표현으로 다소 부자연스러우므로 ‘그들 가운데 한 사람’으로 고쳤습니다. ‘붙잡아’ 뒤에 각 대상을 대조적으로 처리하는 병렬 구조는 한국어에서도 원문의 연속된 폭력 행위를 자연스럽게 전달합니다.
  terminology: γεωργοί는 ‘소작농들’, δοῦλοι는 ‘노예들’로 옮겼습니다. ‘종들’은 가능한 대안으로 각주에 남겼습니다. λιθοβολέω는 죽음의 결과를 본문에 과도하게 명시하지 않고 ‘돌로 쳤습니다’로 유지했습니다.
  issues:
  - severity: medium
    issue: οἱ γεωργοί를 ‘농부들’로만 번역함
    rationale: 이 비유에서는 포도원 주인의 토지를 맡아 경작하는 임차·소작 관계가 문맥상 중요합니다. ‘소작농들’이 원문의 역할을 더 충실히 드러냅니다.
  - severity: medium
    issue: τοὺς δούλους αὐτοῦ를 본문에서 ‘그의 종들’로 번역함
    rationale: δοῦλοι는 소유주의 종속된 사람들을 가리키며, 이 문맥에서는 ‘노예들’이 그 관계를 더 직접적으로 반영합니다. ‘종들’은 각주 대안으로 제시할 수 있습니다.
  - severity: low
    issue: ‘그들 가운데 하나’의 지시 대상 표현
    rationale: 사람들을 가리키므로 ‘한 사람’이 현대 한국어에서 더 자연스럽고 분명합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 있음
    rationale: 어휘 대안 각주는 해당 어휘인 ‘노예들’ 바로 뒤에 두어 무엇에 관한 주석인지 명확히 해야 합니다.
