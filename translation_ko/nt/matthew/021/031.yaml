id: MAT.21.31
reference: Matthew 21:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
  footnotes:
  - marker: a
    text: Or “are entering the kingdom of God before you.” The Greek says “are going ahead of you,” emphasizing precedence without necessarily stating final exclusion.
    reason: alternative_reading
translation:
  language: ko
  text: 둘 중에 누가 아버지의 뜻을 행했습니까? 그들이 대답했습니다. “첫째입니다.” 예수께서 그들에게 말씀하셨습니다. “진실로 여러분에게 말합니다. 세리들과 매춘부들이 여러분보다 앞서 하나님의 나라로 가고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여러분보다 먼저 하나님의 나라에 들어가고 있습니다.” 그리스어는 문자적으로 “여러분보다 앞서 가고 있습니다”라고 하며, 선행을 강조할 뿐 반드시 최종적인 배제를 뜻하지는 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  english_pob_choice: Which of the two
  chosen_korean: 둘 중에 누가
  alternatives_korean:
  - 둘 가운데 누가
  - 둘 중 어느 쪽이
  lexicon: BDAG
  rationale: 부분집합을 묻는 ἐκ τῶν δύο의 의미를 자연스러운 한국어로 옮겼습니다.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  english_pob_choice: did the will of the father
  chosen_korean: 아버지의 뜻을 행했습니까
  alternatives_korean:
  - 아버지의 뜻을 했습니까
  - 아버지의 뜻을 이루었습니까
  lexicon: BDAG
  rationale: ποιέω와 θέλημα의 결합을 '뜻을 행하다'로 옮겨, 단순한 수행보다 순종의 의미를 드러냈습니다.
- source_word: οἱ τελῶναι καὶ αἱ πόρναι
  english_pob_choice: the tax collectors and the prostitutes
  chosen_korean: 세리들과 창녀들이
  alternatives_korean:
  - 세리들과 prostitutes
  - 세리들과 매춘부들이
  lexicon: BDAG
  rationale: τελῶναι는 통상적이며, πόρναι는 본문의 직접적 사회적 충격을 살리기 위해 완곡화보다 직접적인 '창녀들'을 선택했습니다.
- source_word: προάγουσιν ὑμᾶς
  english_pob_choice: are going ahead of you
  chosen_korean: 여러분보다 앞서 … 들어가고 있습니다
  alternatives_korean:
  - 여러분보다 앞서 가고 있습니다
  - 여러분 앞에 가고 있습니다
  lexicon: BDAG
  rationale: 현재형의 진행성과 '앞서'의 우선성을 살리되, 단정적 배제보다 선행의 이미지를 유지했습니다.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  english_pob_choice: into the kingdom of God
  chosen_korean: 하나님의 나라로
  alternatives_korean:
  - 하나님의 나라 안으로
  - 하나님의 나라에
  lexicon: BDAG
  rationale: εἰς의 방향성을 한국어 조사 '-로'로 자연스럽게 옮겼고, 전통 용어인 '하나님의 나라'를 유지했습니다.
theological_decisions:
- issue: προάγουσιν ὑμᾶς의 종말론적 뉘앙스
  chosen_reading: '''여러분보다 앞서 … 들어가고 있습니다''로 옮겨 선행을 분명히 하되, 본문이 말하는 우선성과 경고의 긴장을 그대로 남겼습니다.'
  alternative_readings:
  - '''여러분보다 먼저 들어갑니다'''
  - '''여러분보다 앞서 가고 있습니다'''
  rationale: 그리스어는 '앞서감/선행'을 말할 뿐 최종 배제를 명시하지 않으므로, 의미를 좁히지 않도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
