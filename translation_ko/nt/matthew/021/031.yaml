revisions:
- from: 둘 중에 누가 아버지의 뜻을 행했습니까? 그들이 대답했습니다. “첫째입니다.” 예수께서 그들에게 말씀하셨습니다. “진실로 여러분에게 말합니다. 세리들과 창녀들이 여러분보다 앞서 하나님의 나라로 들어가고 있습니다.”[a]
  to: 둘 중에 누가 아버지의 뜻을 행했습니까? 그들이 대답했습니다. “첫째입니다.” 예수께서 그들에게 말씀하셨습니다. “진실로 여러분에게 말합니다. 세리들과 매춘부들이 여러분보다 앞서 하나님의 나라로 가고 있습니다.”[a]
  rationale: 본문은 προάγω의 ‘앞서 가다’라는 비유를 유지하고, ‘먼저 들어가다’라는 문맥상 가능한 해석은 각주로 제시했습니다. 또한 πόρναι를 현대 공적 문체에 더 적합한 ‘매춘부들’로 조정하되, 원문의 직접성과 사회적 충격을 완곡하게 제거하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:48Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 προάγουσιν은 ‘앞서 가다/앞서 나아가다’라는 선행의 비유를 유지하는 것이 좋으며, 본문의 번역을 곧바로 ‘들어가고 있습니다’로 확정하면 가능한 뉘앙스를 다소 좁힙니다.
  naturalness: 문장 구성과 합쇼체는 자연스럽습니다. 그러나 현대 표준어의 공적 문맥에서는 ‘창녀들’보다 ‘매춘부들’이 더 중립적이고 자연스럽습니다. 이는 πόρναι의 직접성을 약화하지 않습니다.
  terminology: ‘아버지의 뜻’, ‘세리’, ‘하나님의 나라’는 적절합니다. πόρναι는 ‘매춘부들’로, προάγουσιν은 ‘앞서 가고 있습니다’로 옮겨 현대적 표현과 원문의 선행 이미지를 함께 보존하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: προάγουσιν을 ‘들어가고 있습니다’로 본문에서 확정함
    rationale: ‘앞서 들어가다’는 문맥상 가능한 해석이지만, προάγω의 기본 이미지인 ‘앞서 가다’를 본문 번역에서 보존하고 ‘먼저 들어가다’는 각주 대안으로 두는 편이 원문과 영어 감사 기록의 의도를 더 잘 반영합니다.
  - severity: low
    issue: ‘창녀들’의 현대 공적 문체상 어감
    rationale: πόρναι가 사회적으로 낙인찍힌 표현이라는 점은 유지해야 하지만, ‘창녀’는 현대 표준어의 공적 성경 번역에서 지나치게 모욕적·구어적으로 들릴 수 있습니다. ‘매춘부들’은 의미를 직접적으로 유지하면서 더 중립적입니다.
  revised_text: 둘 중에 누가 아버지의 뜻을 행했습니까? 그들이 대답했습니다. “첫째입니다.” 예수께서 그들에게 말씀하셨습니다. “진실로 여러분에게 말합니다. 세리들과 매춘부들이 여러분보다 앞서 하나님의 나라로 가고 있습니다.”[a]
  revised_footnotes:
  - marker: a
    text: 또는 “여러분보다 먼저 하나님의 나라에 들어가고 있습니다.” 그리스어는 문자적으로 “여러분보다 앞서 가고 있습니다”라고 하며, 선행을 강조할 뿐 반드시 최종적인 배제를 뜻하지는 않습니다.
    reason: alternative_reading
  revision_rationale: 본문은 προάγω의 ‘앞서 가다’라는 비유를 유지하고, ‘먼저 들어가다’라는 문맥상 가능한 해석은 각주로 제시했습니다. 또한 πόρναι를 현대 공적 문체에 더 적합한 ‘매춘부들’로 조정하되, 원문의 직접성과 사회적 충격을 완곡하게 제거하지 않았습니다.
