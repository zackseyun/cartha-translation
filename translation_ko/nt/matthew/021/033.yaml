id: MAT.21.33
reference: Matthew 21:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
  footnotes:
  - marker: a
    text: The imagery of planting a vineyard, enclosing it, digging a winepress, and building a tower echoes Isaiah 5:1–2.
    reason: cross_reference
  - marker: b
    text: Or 'put a hedge around it.' The Greek term can refer to an enclosing barrier such as a fence or hedge.
    reason: lexical_alternative
  - marker: c
    text: Or 'rented it out to farmers.' The expression refers to leasing the vineyard to cultivators who would work it.
    reason: lexical_alternative
translation:
  language: ko
  text: 다른 비유를 들으십시오. 어떤 포도원 주인이 포도원을 심고 그 둘레에 울타리를 둘렀으며[b] 그 안에 포도주 짜는 틀을 파고 망대를 세웠습니다.[a] 그리고 그것을 농부들에게 임대하고[c] 떠나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 포도원을 심고, 울타리를 두르고, 포도주 짜는 틀을 파고, 망대를 세우는 이미지는 이사야 5:1–2를 떠올리게 합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘그 둘레에 산울타리를 둘렀습니다.’ 그리스어는 울타리나 산울타리처럼 둘러막는 구조를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘농부들에게 세를 주고.’ 이 표현은 포도원을 경작할 사람들에게 임대한 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  english_pob_choice: Listen to another parable
  chosen_korean: 다른 비유를 들으십시오
  alternatives_korean:
  - 다른 비유를 들으십시오
  - 또 다른 비유를 들으시오
  lexicon: SBLGNT; BDAG
  rationale: ἀκούσατε는 복수 명령형이므로 직접 청유가 아니라 청중에게 향한 명령으로 옮겼고, παραβολή는 예수의 가르침 맥락에서 ‘비유’가 가장 정확합니다.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  english_pob_choice: There was a landowner
  chosen_korean: 어떤 사람이 주인이었는데
  alternatives_korean:
  - 한 사람이 집주인이었는데
  - 어떤 사람이 땅주인이었는데
  lexicon: BDAG
  rationale: οἰκοδεσπότης는 집안의 주인/소유주를 뜻하지만, 이 문맥에서는 포도원과 소작인의 관계가 중심이므로 한국어로는 자연스럽게 ‘주인’이라고 옮기되, ἄνθρωπος ἦν의 서술적 도입을 살려 ‘어떤 사람이 …였는데’로 처리했습니다.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  english_pob_choice: put a fence around it
  chosen_korean: 그 둘레에 울타리를 두르고
  alternatives_korean:
  - 그 둘레에 담을 두르고
  - 그 둘레에 울타리를 쳐서
  lexicon: BDAG
  rationale: φραγμός는 울타리, 담, 둘레막이 모두 가능하지만, 현대 한국어에서 과도한 해석을 피하면서도 포도원 둘레를 둘러친 방어 구조를 자연스럽게 드러내는 말로 ‘울타리’를 택했습니다.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  english_pob_choice: leased it to tenant farmers
  chosen_korean: 그것을 농부들에게 세 주고
  alternatives_korean:
  - 그것을 소작농들에게 세 주고
  - 그것을 농부들에게 빌려 주고
  lexicon: BDAG
  rationale: ἐξέδετο는 임대/전대의 의미이므로 단순한 고용이 아니라 소유자가 사용권을 넘긴 관계를 살려 ‘세 주고’로 옮겼습니다. γεωργοί는 일반 ‘농부’로도 되지만, 여기서는 포도원을 맡아 경작하는 소작적 관계가 있어 본문 전체에서 그 뉘앙스가 드러납니다.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  english_pob_choice: dug a winepress in it
  chosen_korean: 그 안에 포도즙 틀을 파고
  alternatives_korean:
  - 그 안에 포도즙 틀을 만들고
  - 그 안에 포도즙 틀을 파 넣고
  lexicon: BDAG
  rationale: ληνός는 포도즙을 짜는 틀이며, ὤρυξεν은 ‘팔다’에 가깝기 때문에 ‘포도즙 틀을 파고’가 사역 동작을 가장 직접적으로 살립니다.
theological_decisions:
- issue: 이사야 5장의 포도원 비유와의 연결
  chosen_reading: 본문에는 해설을 덧붙이지 않고, 포도원·울타리·포도즙 틀·망대의 구체적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 이사야의 배경을 드러내기 위해 본문에서 ‘담’처럼 더 전통적인 표현을 선택할 수 있음
  rationale: 이 구절은 이사야 5:1–2를 분명히 떠올리게 하지만, 해석적 연결은 주석과 각주에서 다루는 편이 본문 의미를 과도하게 규정하지 않으면서도 원문 이미지를 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
