id: MAT.21.46
reference: Matthew 21:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
  footnotes:
  - marker: a
    text: Or 'they considered him a prophet' or 'they held him to be a prophet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그를 붙잡으려 하였으나, 무리들을 두려워하였으니, 그들이 예수를 예언자로 여기고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붙잡으려 하였다’는 κρατῆσαι의 기본적 강제성을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες ... κρατῆσαι
  english_pob_choice: although they were seeking to arrest him
  chosen_korean: 그를 붙잡으려 하였으나
  alternatives_korean:
  - 그를 체포하려 하였으나
  - 그를 잡으려 하였으나
  lexicon: BDAG
  rationale: ζητοῦντες의 지속적 의도와 κρατῆσαι의 강제적 행위를 함께 살려, 단순한 ‘찾다/원하다’보다 행위의 방향이 드러나는 ‘붙잡으려 하였으나’로 옮겼습니다.
- source_word: ἐφοβήθησαν τοὺς ὄχλους
  english_pob_choice: they feared the crowds
  chosen_korean: 무리들을 두려워하였으니
  alternatives_korean:
  - 무리를 두려워하였으니
  - 군중을 두려워하였으니
  lexicon: BDAG
  rationale: 복수형 τοὺς ὄχλους을 살려 ‘무리들’로 옮기고, 서술 흐름에 맞게 ‘두려워하였으니’로 연결해 앞 절의 양보/대조 관계를 드러냈습니다.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  english_pob_choice: they regarded him as a prophet
  chosen_korean: 그들이 예수를 예언자로 여기고 있었기 때문입니다
  alternatives_korean:
  - 그들이 예수를 예언자로 생각하고 있었기 때문입니다
  - 그들이 예수를 예언자로 여기고 있었기 때문입니다
  lexicon: BDAG
  rationale: εἰς ... ἔχω의 관용구를 ‘여기다’로 자연스럽게 풀어, 예수에 대한 군중의 평가를 보고하는 문맥을 유지했습니다.
- source_word: προφήτην
  english_pob_choice: a prophet
  chosen_korean: 예언자로
  alternatives_korean:
  - 선지자로
  - 예언자 한 사람으로
  lexicon: BDAG
  rationale: 표준어 현대 문체에서 ‘예언자’가 가장 직접적이며, 본문의 범주적 진술을 자연스럽게 나타냅니다.
theological_decisions:
- issue: 군중의 예수 인식을 어떻게 보존할 것인가
  chosen_reading: ‘예언자로 여기고 있었습니다’로, 예수에 대한 군중의 평가를 서술 수준에서만 유지했습니다.
  alternative_readings:
  - ‘예언자라고 여겼습니다’
  - ‘예언자로 믿고 있었습니다’
  rationale: 본문은 군중의 인식을 전하는 서술이므로, 예수의 정체를 확정하거나 축소하지 않도록 평가의 수준을 그대로 남겼습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
