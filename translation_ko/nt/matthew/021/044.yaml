source:
  edition: SBLGNT
  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
  footnotes:
  - marker: a
    text: Or more vividly, 'it will grind him to powder' or 'scatter him like chaff.'
    reason: lexical_alternative
  - marker: b
    text: The verse is absent in some manuscripts of Matthew, though it is paralleled in Luke 20:18.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 이 돌 위에 떨어지는 사람은 산산이 부서질 것입니다[a]. 그러나 그 돌이 누구에게든 떨어지면 그를 산산이 부술 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘그를 가루로 갈아버리다’ 또는 ‘겨처럼 흩어버리다’의 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 일부 마태복음 사본에 없지만, 누가복음 20:18과 평행합니다.
    reason: textual_variant
