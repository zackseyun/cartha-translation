id: MAT.21.3
reference: Matthew 21:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
  footnotes:
  - marker: a
    text: Or 'the master has need of them.'
    reason: alternative_reading
  - marker: b
    text: Or 'he will send them immediately'; the subject is most naturally the person addressed, who will send the animals.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 누가 여러분에게 무엇이든 말하면, 여러분은 ‘주께서 그것들을 필요로 하십니다. 그가 곧 그것들을 보내실 것입니다’라고 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 “그것들”은 앞절의 나귀 새끼와 어미 나귀를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: ἐάν τις
  english_pob_choice: if anyone
  chosen_korean: 누가 ... 무엇이든
  alternatives_korean:
  - 어떤 사람이 ... 무엇이든
  - 누군가 ... 무엇이든
  lexicon: BDAG
  rationale: 조건의 불특정성을 살리기 위해 일반적이고 열린 표현으로 옮겼습니다. “누가”는 구어적이지만 여기서는 발화 상황의 예시성을 자연스럽게 드러냅니다.
- source_word: ἐρεῖτε
  english_pob_choice: you shall say
  chosen_korean: 라고 하십시오
  alternatives_korean:
  - 라고 말하십시오
  - 라고 하여라
  lexicon: BDAG
  rationale: 미래형의 지시적 용법을 한국어 명령/지시 표현으로 옮겼습니다. 합쇼체를 유지하면서도 직접적인 지시를 살리기 위해 “하십시오”를 선택했습니다.
- source_word: Ὁ κύριος αὐτῶν
  english_pob_choice: The Lord ... of them
  chosen_korean: 주께서 그것들을
  alternatives_korean:
  - 주님께서 그것들의
  - 주인께서 그것들을
  lexicon: BDAG
  rationale: κύριος는 프로젝트 기본값에 따라 “주” 계열로 옮기되, 한국어에서는 주어를 분명히 하기 위해 “주께서”를 썼습니다. αὐτῶν은 직전의 짐승들을 가리키므로 사람의 소유자를 뜻하는 “주인”은 본문보다 좁힐 수 있습니다.
- source_word: χρείαν ἔχει
  english_pob_choice: has need
  chosen_korean: 필요로 하십니다
  alternatives_korean:
  - 필요가 있으십니다
  - 쓰실 것입니다
  lexicon: BDAG
  rationale: 직역적 “필요를 가지고 계십니다”보다 한국어로 자연스러운 관용을 택했습니다. 다만 단순히 “필요합니다”라고 하면 주어의 존칭이 약해져, “필요로 하십니다”로 보존했습니다.
- source_word: εὐθὺς
  english_pob_choice: at once
  chosen_korean: 곧
  alternatives_korean:
  - 즉시
  - 바로
  lexicon: BDAG
  rationale: 즉각성을 간결하게 나타내는 한국어 부사로 옮겼습니다. 본문 흐름상 과도하게 강한 “즉시”보다 “곧”이 더 자연스럽습니다.
- source_word: ἀποστελεῖ αὐτούς
  english_pob_choice: he will send them
  chosen_korean: 그가 ... 보내실 것입니다
  alternatives_korean:
  - 그가 ... 돌려보내실 것입니다
  - 그가 ... 풀어주실 것입니다
  lexicon: BDAG
  rationale: ἀποστέλλω는 여기서 단순히 “보내다”가 핵심이며, 반납 의미는 본문에 명시되지 않습니다. 따라서 추가 해석을 피하고 가장 सीधे한 의미를 살렸습니다.
theological_decisions:
- issue: κύριος의 번역과 문맥적 지시대상
  chosen_reading: “주”로 번역해 예수의 권위 있는 자기지시와 동시에 현장상의 실용적 의미를 모두 살렸습니다.
  alternative_readings:
  - 주인
  - 주님
  rationale: 이 절은 짐승의 소유자와 예수의 권위적 발화를 동시에 염두에 둘 수 있습니다. 그러나 프로젝트 기본값은 κύριος를 “주”로 두며, “주인”은 소유자만을 강조해 그리스도론적 울림을 약화시킬 수 있습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → 주/주님'
