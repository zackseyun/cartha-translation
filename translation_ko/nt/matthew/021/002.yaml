id: MAT.21.2
reference: Matthew 21:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
  footnotes:
  - marker: a
    text: Or “across from you” for the village’s location.
    reason: lexical_alternative
  - marker: b
    text: “Colt” here means a young donkey, as the context makes clear.
    reason: lexical_alternative
  - marker: c
    text: 'The Greek literally has a participle, “having untied,” followed by an imperative, “bring”; English commonly renders the sequence as two commands: “Untie them and bring them.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 말씀하셨습니다. “너희 맞은편에 있는 마을로 가십시오.[a] 그러면 곧 매여 있는 암나귀 한 마리와 그와 함께 있는 어린 나귀 한 마리를 찾게 될 것입니다.[b] 그것들을 풀어 내게 끌고 오십시오.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희 건너편에 있는 마을”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어린 나귀’로 옮긴 말은 본래 어린 짐승을 가리키며, 여기서는 함께 언급된 암나귀로 보아 어린 나귀를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 문자적으로 “풀고”에 해당하는 분사 뒤에 “내게 끌고 오십시오”라는 명령이 이어집니다. 한국어에서는 이를 자연스럽게 두 동작의 명령으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  english_pob_choice: saying to them
  chosen_korean: 그들에게 말씀하시기를
  alternatives_korean:
  - 그들에게 말하시며
  - 그들에게 이르시기를
  lexicon: SBLGNT; BDAG
  rationale: 서술적 연결을 유지하면서도 현대 한국어에서 자연스러운 간접화법으로 옮겼습니다. 예수의 말씀 도입이므로 ‘말씀하시기를’이 ‘말하다’보다 문체상 더 적합합니다.
- source_word: κατέναντι ὑμῶν
  english_pob_choice: opposite you
  chosen_korean: 너희 맞은편
  alternatives_korean:
  - 너희 앞
  - 너희 건너편
  - 너희 맞은쪽
  lexicon: SBLGNT; BDAG
  rationale: 마을의 위치를 ‘맞은편’으로 옮겨 원문의 공간 관계를 직접 살렸습니다. 영어 주석의 ‘across from you’와 같은 의미 범위이지만, 한국어에서는 ‘맞은편’이 가장 분명합니다.
- source_word: ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς
  english_pob_choice: a donkey tied, and a colt with her
  chosen_korean: 매여 있는 암나귀 한 마리와 그 곁에 있는 어린 나귀 한 마리
  alternatives_korean:
  - 묶여 있는 암나귀 한 마리와 그 곁의 어린 나귀 한 마리
  - 매여 있는 나귀 한 마리와 그와 함께 있는 새끼 나귀 한 마리
  lexicon: SBLGNT; BDAG
  rationale: ὄνον의 성별이 문맥상 암컷임을 한국어에서 드러내기 위해 ‘암나귀’로 옮겼고, πῶλον은 문맥상 어린 나귀이므로 ‘어린 나귀’로 풀었습니다. 영어 POB의 주석처럼 ‘colt’를 일반적인 새끼 말이 아니라 어린 나귀로 이해해야 합니다.
- source_word: λύσαντες ἀγάγετέ μοι
  english_pob_choice: Untie them and bring them to me
  chosen_korean: 그것들을 풀어 내게 끌고 오너라
  alternatives_korean:
  - 그것들을 풀고 내게 데려오너라
  - 풀어서 내게 끌고 오너라
  lexicon: SBLGNT; BDAG
  rationale: 분사 λύσαντες를 한국어에서는 이어지는 명령으로 자연스럽게 풀어 ‘풀어’라고 옮겼고, ἀγάγετέ μοι는 동물에 대한 명령이므로 ‘끌고 오라’가 ‘데려오라’보다 원문의 이동감을 더 잘 살립니다. 복수 대상을 유지하기 위해 ‘그것들’을 사용했습니다.
theological_decisions:
- issue: 예수의 직접 명령문에서 문체와 존대의 처리
  chosen_reading: 예수의 권위 있는 명령을 합쇼체로 유지하되, 직접 명령은 ‘오너라’처럼 한국어에서 자연스럽고 단호한 명령형으로 옮겼습니다.
  alternative_readings:
  - 오십시오
  - 오게 하여라
  rationale: 본문은 제자들에게 주는 지시이므로 지나친 공손 표현은 어색합니다. 합쇼체 서술 안에서 직접 화법의 명령 강도를 살리는 것이 원문의 수행적 힘을 더 잘 전달합니다.
  doctrine_reference: 공관복음서의 예수 명령 서술
