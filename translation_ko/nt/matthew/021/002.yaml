  source_fidelity: 암나귀가 매여 있고 어린 나귀가 그와 함께 있다는 핵심 의미와, 풀어서 예수께 가져오라는 명령은 대체로 충실합니다. 다만 μετ’ αὐτῆς는 단순히 ‘그 곁에 있는’보다 ‘그와 함께 있는’이 더 직접적이며, 직접 인용문의 종결을 표준 현대 합쇼체로 통일하는 편이 적절합니다.
  naturalness: ‘너희 맞은편 마을’도 이해되지만 ‘너희 맞은편에 있는 마을’이 현대 한국어에서 더 자연스럽고 위치 관계가 분명합니다. 서술문과 직접 명령문을 각각 ‘말씀하셨습니다’와 ‘가십시오/오십시오’로 처리하면 지정된 현대 격식체가 일관됩니다.
  terminology: ‘암나귀’는 여성 단수 분사 δεδεμένην 및 αὐτῆς와 잘 맞고, πῶλον을 ‘어린 나귀’로 명시한 것도 이 문맥에서 적절합니다. ‘끌고 오십시오’는 ἀγάγετε의 동물 이동 명령을 자연스럽게 전달합니다.
