  source_fidelity: 핵심 어휘는 대체로 충실하지만, 원문의 τί ποιήσει τοῖς γεωργοῖς ἐκείνοις는 주인이 ‘그 농부들에게/그 농부들을’ 대상으로 무엇을 할지를 묻습니다. 한국어에서는 ‘그 농부들을 어떻게 하겠습니까?’가 이 대상을 더 분명하고 자연스럽게 드러냅니다.
  naturalness: ‘하시겠습니까’는 주어인 ‘포도원의 주인’에게 높임을 부여하므로, 비유 속 인물에 대한 중립적 서술로는 ‘하겠습니까’가 적절합니다. 각주 표지도 해당 어휘 바로 뒤에 두는 것이 명확합니다.
  terminology: ‘포도원의 주인’은 κύριος τοῦ ἀμπελῶνος의 비유 내 소유자 의미를 자연스럽게 전달하며, ‘그 농부들’은 γεωργοῖς ἐκείνοις의 기본 의미와 지시성을 보존합니다. ‘소작인들’은 문맥상 가능한 대안으로 각주에 유지할 수 있습니다.
