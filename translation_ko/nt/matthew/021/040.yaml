  rationale: 앞선 비유 전개에서 이어지는 추론적 전환을 한국어에서 자연스럽게 드러내면서도, 문맥상 질문으로 넘어가는 흐름을 부드럽게 살립니다.
- source_word: κύριος τοῦ ἀμπελῶνος
  english_pob_choice: owner of the vineyard
