id: MAT.21.40
reference: Matthew 21:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
  footnotes:
  - marker: a
    text: Or 'master of the vineyard.' The Greek word is kyrios, often rendered 'Lord,' but here it refers to the vineyard's proprietor within the parable.
    reason: lexical_alternative
  - marker: b
    text: Or 'tenant farmers.' The broader parable context shows these farmers are leasing the vineyard, though the Greek word itself more generally means 'farmers' or 'cultivators.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 포도원의 주인이 오면, 그 농부들에게 어떻게 하시겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포도원의 소유주.’ 그리스어 κύριος는 보통 ‘주님’으로 옮기지만, 여기서는 비유 속 포도원의 소유자를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소작인들.’ 문맥상 이들은 포도원을 빌려 경작하는 사람들로 이해되지만, 그리스어 단어 자체는 더 넓게 ‘농부들’ 또는 ‘경작자들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  english_pob_choice: therefore
  chosen_korean: 그러면
  alternatives_korean:
  - 그러므로
  - 그런즉
  lexicon: BDAG
  rationale: 앞선 비유 전개에서 이어지는 추론적 전환을 한국어에서 자연스럽게 드러내면서도, 문맥상 질문으로 넘어가는 흐름을 부드럽게 살립니다.
- source_word: κύριος τοῦ ἀμπελῶνος
  english_pob_choice: owner of the vineyard
  chosen_korean: 포도원의 주인
  alternatives_korean:
  - 포도원의 소유주
  - 포도원의 주인님
  lexicon: BDAG
  rationale: κύριος가 비유 안의 인간 소유자를 가리키므로, 신적 호칭인 ‘주님’ 대신 ‘주인’으로 옮겨 소유자라는 역할을 분명히 했습니다.
- source_word: γεωργοῖς
  english_pob_choice: farmers
  chosen_korean: 그 농부들
  alternatives_korean:
  - 그 소작인들
  - 그 포도원지기들
  lexicon: BDAG
  rationale: 어휘 자체는 넓게는 농부/경작자를 뜻하므로 기본 의미를 살려 ‘농부들’로 옮기되, 문맥의 특정성을 반영해 지시어 ‘그’를 유지했습니다.
- source_word: τί ποιήσει
  english_pob_choice: what will he do
  chosen_korean: 어떻게 하시겠습니까
  alternatives_korean:
  - 무엇을 하시겠습니까
  - 그들에게 무엇을 하시겠습니까
  lexicon: BDAG
  rationale: τί ποιήσει의 질문은 단순 행위의 유무보다 ‘어떤 처분을 할 것인가’를 묻는 뉘앙스가 강하므로, 한국어에서는 결과를 묻는 자연스러운 표현으로 풀었습니다.
theological_decisions:
- issue: 비유 속 κύριος의 호칭 처리
  chosen_reading: ‘주인’으로 번역하여 비유의 인물로 읽게 했습니다.
  alternative_readings:
  - ‘주님’으로 옮겨 독자에게 주제적 연결을 열어 두는 읽기
  - ‘소유주’로 더 법적·소유 개념을 강조하는 읽기
  rationale: 이 구절의 κύριος는 야훼나 메시아 칭호가 아니라 포도원의 소유자를 가리키는 비유 내부 인물이므로, 호칭의 신학적 중첩을 피하는 것이 원문의 의도에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: κύριος의 문맥 우선 번역 원칙'
