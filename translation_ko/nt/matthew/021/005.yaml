id: MAT.21.5
reference: Matthew 21:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
  footnotes:
  - marker: a
    text: Or “humble.” The Greek πραΰς can mean “gentle,” “meek,” or “humble,” and echoes Zechariah 9:9.
    reason: lexical_alternative
  - marker: b
    text: 'Matthew preserves the prophetic wording with two linked animal expressions: “on a donkey, and on a colt, the foal of a beast of burden.”'
    reason: cross_reference
translation:
  language: ko
  text: 「시온의 딸에게 말하십시오. 보십시오, 당신의 왕이 온유하시며 나귀를 타고, 또 짐을 나르는 짐승의 새끼를 타고 당신에게 오십니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온유하시며’로 옮긴 그리스어 πραΰς는 ‘겸손하시며’ 또는 ‘유순하시며’라는 뉘앙스도 지닐 수 있으며, 스가랴 9:9를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 마태는 예언의 표현을 ‘나귀를 타고, 또 짐을 나르는 짐승의 새끼를 타고’라는 두 동물 어구로 연결하여 보존합니다.
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε τῇ θυγατρὶ Σιών
  english_pob_choice: Tell the daughter of Zion
  chosen_korean: 시온의 딸에게 말하십시오
  alternatives_korean:
  - 시온의 딸에게 이르십시오
  - 시온의 딸에게 말씀하십시오
  lexicon: BDAG
  rationale: 예언적 인용을 여는 명령형을 자연스러운 현대 한국어로 옮기되, ‘시온의 딸’이라는 인격화 표현을 그대로 살려 원문과 구약 배경을 유지했습니다.
- source_word: Ἰδοὺ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: BDAG
  rationale: 주의를 끄는 지시적 감탄으로서 합쇼체에 맞는 ‘보십시오’가 자연스럽고, 고어투인 ‘보라’보다 현대 문체에 적합합니다.
- source_word: πραῢς
  english_pob_choice: gentle
  chosen_korean: 온유하시며
  alternatives_korean:
  - 겸손하시며
  - 유순하시며
  lexicon: BDAG
  rationale: POB의 ‘gentle’에 대응하되, 마태복음 21:5가 스가랴 9:9의 메시아적 배경을 보존하므로 ‘온유’가 한국어 성경 전통과 원문의 의미 범위를 함께 살립니다.
- source_word: ἐπιβεβηκὼς ἐπὶ ὄνον καὶ … ἐπὶ πῶλον υἱὸν ὑποζυγίου
  english_pob_choice: mounted on a donkey, and on a colt, the foal of a beast of burden
  chosen_korean: 나귀를 타고, 멍에 메는 짐승의 새끼인 어린 나귀를 타고
  alternatives_korean:
  - 나귀 위에 올라타고, 어린 짐승의 새끼인 어린 나귀를 타고
  - 나귀에 올라타고, 짐 싣는 짐승의 새끼인 어린 나귀를 타고
  lexicon: BDAG
  rationale: 마태가 보존한 이중 동물 표현을 평평하게 합치지 않고 그대로 살렸습니다. ‘ὄνος’는 ‘나귀’, ‘πῶλος’는 ‘어린 나귀’로 옮기고, ‘υἱὸν ὑποζυγίου’는 직역을 지나치게 어색하게 만들지 않으면서도 ‘멍에 메는 짐승의 새끼’로 렌더링했습니다.
theological_decisions:
- issue: 마태복음의 메시아적 예언 인용에서 스가랴 9:9와의 연동을 어떻게 드러낼지
  chosen_reading: 원문의 마태 표현을 그대로 살리되, ‘온유’와 두 개의 동물 표현을 모두 유지했습니다.
  alternative_readings:
  - ‘겸손하시며’로 바꾸어 스가랴 9:9의 익숙한 한국어 전통에 더 맞추기
  - 동물 표현을 하나로 통합해 매끄럽게 만들기
  rationale: 이 절은 단순한 서술이 아니라 예언 성취 인용이므로, 조화 번역보다 마태의 실제 헬라어가 지닌 강조와 반복을 보존하는 것이 본문 의미를 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
