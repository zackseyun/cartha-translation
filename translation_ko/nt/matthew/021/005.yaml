revisions:
- from: 「시온의 딸에게 말하십시오. 보십시오, 너의 왕이 너에게 오십니다. 그는 온유하시며, 나귀를 타고, 멍에 메는 짐승의 새끼인 어린 나귀를 타고 오십니다」[a][b]
  to: 「시온의 딸에게 말하십시오. 보십시오, 당신의 왕이 온유하시며 나귀를 타고, 또 짐을 나르는 짐승의 새끼를 타고 당신에게 오십니다.」[a][b]
  rationale: 원문의 예언 인용과 이중 동물 어구를 유지하면서, πῶλον을 ‘어린 나귀’로 과도하게 특정한 부분을 원문의 포괄성을 살린 ‘새끼’로 조정했습니다. 또한 합쇼체 대명사 사용과 분사구의 문장 연결을 다듬었습니다.
  reviewer_model: gpt-5.6-terra
