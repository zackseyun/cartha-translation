review_pass:
  verdict: revise
  source_fidelity: 원문의 명령, ‘시온의 딸’이라는 인격화, 주의를 환기하는 Ἰδού, 왕의 도래, πραΰς의 의미, 그리고 두 동물 어구의 반복은 대체로 보존되었습니다. 그러나 πῶλον υἱὸν ὑποζυγίου는 ‘멍에 메는 짐승의 새끼인 어린 나귀’라고 특정하기보다, 원문의 포괄적 표현을 유지하는 편이 안전합니다. 또한 분사구를 별도의 ‘타고 오십니다’로 반복하지 않는 편이 원문의 한 문장 구조를 더 잘 반영합니다.
  naturalness: ‘보십시오’와 ‘온유하시며’는 현대 합쇼체의 격식 있는 성경 문체에 자연스럽습니다. 인용문 안의 ‘너의/너에게’는 합쇼체 종결과 어울리지 않으므로 ‘당신의/당신에게’로 통일했습니다. ‘멍에 메는 짐승’은 뜻을 전달하지만 다소 딱딱하므로 ‘짐을 나르는 짐승’이 현대 한국어에서 더 자연스럽습니다.
  terminology: ‘시온의 딸’, ‘왕’, ‘온유’는 적절합니다. πραΰς의 대안으로 ‘겸손’을 각주에 보존하는 것도 적절합니다. πῶλος를 ‘어린 나귀’로 확정하면 뒤의 ὑποζυγίου가 제공하는 포괄성을 앞당겨 해석하게 되므로 ‘새끼’로 옮겼습니다.
  issues:
  - severity: medium
    issue: πῶλον을 ‘어린 나귀’로 특정함
    rationale: πῶλος는 어린 짐승/새끼이며, 뒤의 ‘짐을 나르는 짐승의 새끼’라는 표현이 이를 수식합니다. 문맥상 나귀를 연상할 수는 있어도, 본문 번역에서는 ‘어린 나귀’로 확정하지 않아 원문의 표현 범위를 보존하는 편이 낫습니다.
  - severity: low
    issue: 인용문 안의 대명사와 종결 높임의 불일치
    rationale: ‘너의 왕이 너에게 오십니다’는 비격식 2인칭 대명사와 합쇼체 종결이 섞입니다. 현대 formal-polite 문체에서는 ‘당신의 왕이 당신에게 오십니다’가 일관됩니다.
  - severity: low
    issue: ‘타고 오십니다’의 반복
    rationale: ἐπιβεβηκώς은 왕의 도래를 수식하는 분사입니다. ‘타고, 또 … 타고 오십니다’보다 ‘타고 … 오십니다’가 한국어에서 더 매끄럽고 원문의 연결을 잘 드러냅니다.
