review_pass:
  verdict: revise
  source_fidelity: ‘그때’는 원문의 δέ가 명시하는 시간 부사가 아니므로 삭제하는 것이 적절합니다. 또한 ἔκοπτον과 ἐστρώννυον은 모두 미완료형이므로, 후반 행동을 진행 중인 장면으로 옮기는 편이 원문에 더 충실합니다. ‘무리의 대부분’, ‘자기 옷’, ‘길에 깔다’, ‘나무에서 가지를 자르다’는 적절합니다.
  naturalness: ‘무리의 대부분이’가 주격 조사와 함께 자연스럽습니다. ‘나무에서 가지를 자르고 길에 깔고 있었습니다’는 현대 표준어 합쇼체로 자연스럽고, 두 동작의 진행성을 잘 드러냅니다.
  terminology: ὄχλος의 ‘무리’, ἱμάτια의 ‘옷’(각주로 ‘겉옷’ 제시), κλάδοι의 ‘가지’, ὁδός의 ‘길’은 문맥과 어휘 범위에 알맞습니다. 신학적 해석을 본문 번역에 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘그때’가 원문에 없는 시간 관계를 더합니다.
    rationale: δέ는 여기서 주로 서술의 연결 또는 약한 대조를 나타내며, ‘그때’라는 명시적 시간 부사를 요구하지 않습니다.
  - severity: medium
    issue: 후반의 두 미완료 동사의 진행성이 충분히 반영되지 않습니다.
    rationale: ‘잘라 길에 깔았습니다’는 완료된 일련의 행위로 읽히기 쉽습니다. ‘자르고 길에 깔고 있었습니다’는 ἔκοπτον과 ἐστρώννυον의 장면 진행을 보존합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 놓여 있어 각 대상어와의 연결이 약합니다.
    rationale: ‘대부분’과 ‘옷’ 바로 뒤에 각각 표지를 두면 각주의 적용 범위가 분명해집니다.
  revised_text: 무리의 대부분이[a] 자기 옷[b]을 길에 깔았고, 다른 이들은 나무에서 가지를 자르고 길에 깔고 있었습니다.
