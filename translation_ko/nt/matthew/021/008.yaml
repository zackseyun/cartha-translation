  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Now most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
  footnotes:
  - marker: a
    text: Or 'the greater part of the crowd.'
    reason: lexical_alternative
  - marker: b
    text: '''Garments'' may also be rendered ''cloaks.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 무리의 대부분이[a] 자기 옷[b]을 길에 깔았고, 다른 이들은 나무에서 가지를 자르고 길에 깔고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘대부분’은 ‘무리의 더 많은 부분’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘옷’은 ‘겉옷’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  english_pob_choice: Now most of the crowd
  chosen_korean: 무리의 대부분은
  alternatives_korean:
  - 무리의 큰 무리가
  - 무리의 더 많은 부분은
  lexicon: BDAG
  rationale: πλεῖστος는 집합명사와 함께 ‘대부분’ 또는 ‘더 큰 부분’의 뜻이므로, 자연스럽고 문맥에 맞는 ‘무리의 대부분’으로 옮겼습니다. ὄχλος는 ‘무리’가 적절합니다.
- source_word: ἔστρωσαν / ἐστρώννυον
  english_pob_choice: spread / were spreading
  chosen_korean: 깔았고 / 깔았습니다
  alternatives_korean:
  - 펼쳤고 / 펼치고 있었습니다
  - 펴 놓았고 / 펴 놓았습니다
  lexicon: BDAG
  rationale: 겉옷이나 가지를 길 위에 놓는 동작이므로 한국어에서는 ‘깔다’가 가장 자연스럽고 장면을 잘 살립니다. 두 동사의 미완료적 흐름은 문장 전체의 진행형 어감을 통해 완화 없이 반영했습니다.
- source_word: ἑαυτῶν τὰ ἱμάτια
  english_pob_choice: their garments
  chosen_korean: 자기 옷
  alternatives_korean:
  - 자기 겉옷
  - 그들의 옷
  lexicon: BDAG
  rationale: ἱμάτια는 넓게는 옷, 특히 바깥에 걸치는 옷을 가리킬 수 있지만, 본문 상황에서는 한국어로 ‘자기 옷’이 가장 자연스럽고 과도한 특정화를 피합니다.
- source_word: κλάδους ἀπὸ τῶν δένδρων
  english_pob_choice: branches from the trees
  chosen_korean: 나무에서 가지를 잘라
  alternatives_korean:
  - 나무에서 가지들을 잘라
  - 나무의 가지를 꺾어
  lexicon: BDAG
  rationale: κλάδους는 ‘가지’이고, ἔκοπτον은 자르는 동작이므로 ‘잘라’로 옮겼습니다. ‘꺾어’도 가능하지만, 원문의 절단 행위를 덜 무리 없이 전달하는 ‘잘라’가 더 무난합니다.
theological_decisions:
- issue: 길에 옷과 가지를 깔는 행위의 의미를 약화하지 않음
  chosen_reading: 예수의 입성을 환영하는 공개적이고 상징적인 행동으로 그대로 드러냈습니다.
  alternative_readings:
  - 단순히 길을 준비했다는 실무적 묘사로 완화
  - 의례적 환대 정도로 축소
  rationale: 본문은 군중의 행동을 구체적으로 묘사하며 왕적 환영의 분위기를 형성하므로, 상징성과 공개성을 희석하지 않고 유지했습니다.
  doctrine_reference: 마태복음 21장의 메시야적 입성 문맥
