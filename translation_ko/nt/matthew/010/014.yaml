  - severity: low
    issue: ‘떠나면서’가 장소에서 나감을 충분히 드러내지 않습니다.
    rationale: ἐξερχόμενοι ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης는 그 집 또는 그 마을에서 밖으로 나가는 행위를 가리키므로 ‘그 집이나 그 마을에서 나올 때’가 더 직접적입니다.
  - severity: low
    issue: 일부 어휘가 현대 표준어 목표와 다소 거리가 있습니다.
    rationale: ‘영접’, ‘성읍’은 성경적 관습어이지만, 본문은 현대적 격식체를 목표로 하므로 ‘맞아들이지’, ‘마을’이 더 자연스럽고 원문의 의미도 보존합니다.
