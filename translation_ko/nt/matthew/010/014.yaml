  source_fidelity: 원문의 불특정 조건 표현(ὃς ἄν μὴ), ‘받아들이다/듣다’, 집 또는 마을에서 나가는 상황, 발의 먼지를 떨어 내라는 명령은 대체로 반영되어 있습니다. 다만 ‘떠나면서’는 ἐξερχόμενοι ἔξω의 ‘그곳에서 나갈 때’를 다소 약화하며, 명령형 종결이 목표 합쇼체와 맞지 않습니다.
  naturalness: ‘영접하지’와 ‘성읍’은 이해 가능하나 현대 표준어 합쇼체 번역으로는 ‘맞아들이지’, ‘마을’이 더 자연스럽습니다. ‘떨어 버려라’는 해라체이므로 ‘털어 버리십시오’로 고쳐야 합니다.
  terminology: δέξηται의 환대와 수용의 뜻은 ‘맞아들이지’로 자연스럽게 보존했습니다. πόλις는 이 문맥에서 규모를 특정하지 않는 ‘마을’로 옮겼으며, κονιορτός는 ‘먼지’로 유지했습니다. ‘말’은 λόγοι의 비해석적이고 자연스러운 대응입니다.
  issues:
