  terminology: ‘하늘 나라’는 마태복음의 특징적인 표현인 βασιλεία τῶν οὐρανῶν을 적절히 보존합니다. ‘가까이 왔습니다’는 완료형이 나타내는 이미 도래한 가까움의 상태를 무리 없이 전달합니다.
