  source_fidelity: 원문의 복수 명령형 κηρύσσετε와 두 분사(πορευόμενοι, λέγοντες), 그리고 완료형 ἤγγικεν의 의미를 반영해야 합니다. 초안은 ‘가면서’와 ‘가까이 왔다’로 대체로 의미를 담지만, 명령형의 대상과 문체가 맞지 않습니다.
