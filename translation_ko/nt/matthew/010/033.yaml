  source_fidelity: 그리스어의 대조 접속사(δέ), 일반적 관계절(ὅστις ... ἄν), ‘부인하다’의 반복, 그리고 ‘하늘에 계신 내 아버지 앞에서’라는 구문은 초안에 대체로 충실히 반영되어 있습니다. 다만 일반적 조건을 더 자연스럽고 분명하게 드러내고, 목표 합쇼체 종결을 적용하는 것이 필요합니다.
  naturalness: ‘누구든지 … 부인하는 자’는 이해 가능하지만 현대 표준 한국어에서는 ‘누구든지 … 부인하는 사람은’ 또는 ‘누구든지 … 부인하면’이 더 자연스럽습니다. 또한 ‘부인할 것이다’는 해라체이므로 지정된 현대 합쇼체에 맞지 않습니다.
  terminology: ἀρνέομαι의 두 용례를 모두 ‘부인하다’로 옮겨 원문의 의도적인 대응을 보존했습니다. ἀνθρώπων은 문맥상 포괄적인 ‘사람들’로, αὐτόν은 한국어에서 자연스러운 ‘그를’로 번역해 의미를 보존했습니다. ‘하늘에 계신’은 복수형 οὐρανοῖς를 한국어 관용에 맞게 충실히 전달합니다.
  issues:
  - severity: medium
    issue: 종결 표현이 합쇼체가 아님
    rationale: 초안의 ‘부인할 것이다’는 해라체 종결입니다. 요청된 현대 formal-polite 합쇼체에는 ‘부인할 것입니다’가 적합합니다.
  - severity: low
    issue: 일반 조건 구문의 현대적 자연스러움
    rationale: ‘누구든지 … 부인하는 자’보다 ‘누구든지 … 부인하는 사람은’이 현대 표준어에서 자연스럽고, ὅστις ... ἄν의 일반적 범위를 명료하게 나타냅니다.
  revised_text: 그러나 누구든지 사람들 앞에서 나를 부인하는 사람은, 나도 하늘에 계신 내 아버지 앞에서 그를 부인할 것입니다.
