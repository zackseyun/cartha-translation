    issue: Register mismatch and potentially overstated verb nuance
    rationale: The draft ends in plain declarative '-것이다,' rather than the requested 합쇼체. Also, '끌려가다' often conveys being dragged or taken by force; ἀχθήσεσθε means 'will be brought/led' and does not itself specify violence.
