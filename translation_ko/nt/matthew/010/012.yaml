  source_fidelity: 초안의 ‘평안을 빌어라’는 본문의 ἀσπάσασθε(‘인사하십시오’)를 넘어선 표현이며, 다음 절의 ‘평안’ 개념을 앞당겨 넣습니다. 또한 합쇼체 요청에 맞게 종결을 조정해야 합니다. ‘집’에 인사하라는 표현은 헬라어의 문법적 표현을 보존하되, 거주자를 가리키는 환유임을 주석으로 밝혀야 합니다.
  naturalness: ‘그 집에 들어갈 때에는 그 집에 인사하십시오’는 ‘집에 인사하다’라는 다소 이례적인 표현을 의도적으로 유지하지만, 원문의 환유를 충실히 반영합니다. 반복되는 ‘그 집’은 한국어에서 약간 무겁지만 지시 대상과 단수 여성 대명사의 연결을 보존하는 데 안전합니다.
  terminology: ἀσπάσασθε는 현대 한국어로 ‘인사하십시오’가 가장 자연스럽고 적절합니다. ‘평안을 빌다’는 이 절의 어휘적 등가가 아니므로 사용하지 않습니다. ‘가정’이나 ‘식구들’로 본문을 바꾸지 않고 주석에서 환유를 설명합니다.
  issues:
  - severity: high
    issue: ‘평안을 빌어라’가 ἀσπάσασθε의 의미를 확장함
    rationale: 본문은 집에 ‘인사하라’고 명령하며, ‘평안’은 바로 다음 절에서 명시됩니다. 현 초안은 절 경계를 흐리고 원문의 표현을 해석적으로 대체합니다.
  - severity: medium
    issue: 종결 표현이 요구된 현대 합쇼체가 아님
    rationale: ‘빌어라’는 해라체이므로, 지정된 현대 정중한 합쇼체에 맞춰 ‘인사하십시오’로 해야 합니다.
  - severity: low
    issue: 집에 하는 인사의 환유적 의미를 안내하는 주석이 없음
    rationale: 그리스어 αὐτήν은 οἰκίαν(집)을 받지만 실제로는 그곳에 사는 이들을 가리키는 표현일 가능성이 높습니다. 본문에서 이를 풀어 쓰지 않고 주석으로 안내하는 것이 적절합니다.
  revised_text: 그 집에 들어갈 때에는 그 집에 인사하십시오.
  revised_footnotes:
