    text: 직역하면 ‘그 집에 인사하십시오’입니다. 여기서 ‘집’은 그 집에 사는 사람들을 가리키는 표현일 수 있습니다.
    reason: αὐτήν이 οἰκίαν(집)을 받는 원문의 환유적 표현을 본문에 보존하면서, 한국어 독자가 의도된 사회적 대상을 이해하도록 돕습니다.
  revision_rationale: 본절의 명령 ἀσπάσασθε를 ‘인사하십시오’로 직접 옮기고, 원문에 없는 ‘평안’ 개념은 제거했습니다. 원문의 ‘집’과 그에 대한 여성 단수 대명사 지시를 본문에서 유지하며, 거주자를 가리킬 수 있는 환유는 주석으로만 설명했습니다. 종결은 현대 합쇼체로 통일했습니다.
