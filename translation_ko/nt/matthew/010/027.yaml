review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal images of darkness/light, ear, and housetops, but its first imperative is rendered as a connective declarative-style form (말하고) rather than the Greek aorist imperative εἴπατε. ‘귀에 듣는 것’ is also not idiomatic Korean for εἰς τὸ οὖς ἀκούετε.
  naturalness: A consistent formal-polite imperative is needed. ‘귀에 들은 것’ is natural Korean and retains the concrete ear imagery without paraphrasing it as private speech.
  terminology: ‘선포하십시오’ appropriately renders κηρύξατε as a public proclamation. ‘지붕 위에서’ accurately retains the elevated-house-roof image.
  issues:
  - severity: high
    issue: The first command is not expressed as a formal-polite imperative.
    rationale: εἴπατε is an aorist imperative addressed to the plural disciples. ‘말하고’ links clauses but does not command; ‘말하십시오’ restores the force and the required 합쇼체 register.
  - severity: medium
    issue: ‘귀에 듣는 것’ is unidiomatic Korean.
    rationale: Korean normally says ‘귀에 들은 것’ for something heard. This is a natural rendering while retaining the source’s ‘ear’ image and its implication of private hearing.
  revised_text: 내가 너희에게 어둠 속에서 말하는 것을 빛 가운데서 말하십시오. 또 너희가 귀에 들은 것을 지붕 위에서 선포하십시오.
