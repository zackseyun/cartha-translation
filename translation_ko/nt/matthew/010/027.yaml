- from: 내가 너희에게 어둠 속에서 말하는 것을 너희는 빛 가운데서 말하고, 너희가 귀에 듣는 것을 지붕 위에서 선포하라.
  to: 내가 너희에게 어둠 속에서 말하는 것을 빛 가운데서 말하십시오. 또 너희가 귀에 들은 것을 지붕 위에서 선포하십시오.
  rationale: The revision preserves the Greek antithetical imagery rather than replacing it with ‘비밀리에/공개적으로.’ It restores both imperatives in modern formal-polite Korean and makes the ear expression idiomatic without adding a doctrinal or interpretive gloss.
