  source_fidelity: 'The draft correctly retains the two prohibitions and renders ἐθνῶν as “이방인” and Σαμαριτῶν as “사마리아인.” However, its opening wording is unnecessarily repetitive and the direct quotation lacks a closing quotation mark. The revision preserves the Greek’s sequence: Jesus sent the twelve and gave them the following command.'
