  terminology: “이방인의 길” appropriately preserves the compact and somewhat ambiguous δρόμος/ὁδός expression without over-specifying a destination or making it a permanent theological exclusion. “사마리아 사람들의 동네” naturally renders πόλιν Σαμαριτῶν; “동네” is suitable for πόλις here.
