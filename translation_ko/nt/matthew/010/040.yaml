    text: '''영접하는''은 문맥에 따라 ''받아들이는'' 또는 ''맞아들이는''으로도 옮길 수 있습니다. 그리스어 동사는 특히 파견된 이를 맞아들이는 뜻을 포함합니다.'
    reason: lexical_alternative
