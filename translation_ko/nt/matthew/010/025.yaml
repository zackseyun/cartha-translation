base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
  footnotes:
  - marker: a
    text: Or 'Beelzebub,' a familiar variant form in English tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 제자가 자기 스승과 같게 되고 종이 자기 주인과 같게 되는 것으로 족합니다. 사람들이 집 주인을 바알세불[a]이라고 불렀다면, 그의 집안 사람들을 얼마나 더 그렇게 부르겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영어 전통에서는 익숙한 이형인 ‘바알세붑’으로도 옮깁니다.
    reason: Βεελζεβούλ의 본문 형태 ‘바알세불’과, 영어 전통에서 널리 알려진 이형 ‘Beelzebub’을 구별하여 알립니다.
