  to: 제자가 자기 스승과 같게 되고 종이 자기 주인과 같게 되는 것으로 족합니다. 사람들이 집 주인을 바알세불[a]이라고 불렀다면, 그의 집안 사람들을 얼마나 더 그렇게 부르겠습니까?
