  - severity: low
    issue: ‘끝까지 견디는 자, 이 사람이’의 연결이 부자연스러움
    rationale: 원문의 강조적 재지시어 οὗτος를 직역적으로 분리하면 한국어에서는 어색합니다. ‘바로 그 사람은’이 강조를 보존하면서 자연스럽습니다.
