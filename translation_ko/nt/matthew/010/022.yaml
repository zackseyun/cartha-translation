  source_fidelity: 원문의 미래 수동 표현(ἔσεσθε μισούμενοι), 원인 표현(διὰ τὸ ὄνομά μου), 포괄적 행위자(ὑπὸ πάντων), 끝까지의 인내(ὑπομείνας εἰς τέλος), 그리고 구원 약속(σωθήσεται)을 충실히 반영합니다. οὗτος의 강조는 한국어에서 ‘바로 그 사람’으로 자연스럽게 살렸습니다.
  naturalness: 초안의 ‘끝까지 견디는 자, 이 사람이’는 현대 한국어 합쇼체 문장으로 다소 부자연스럽고 문어적입니다. ‘끝까지 견디는 바로 그 사람은’이 강조와 문장 흐름을 함께 보존합니다. 또한 종결을 ‘것이다’에서 합쇼체 ‘것입니다’로 고쳤습니다.
  terminology: ‘내 이름 때문에’, ‘미움을 받을 것입니다’, ‘끝까지 견디는’, ‘구원을 받을 것입니다’는 문맥과 한국어 성경적 용례에 적절합니다. ‘구원’은 여기서 가능한 종말론적·구출적 함의를 특정 교리로 좁히지 않고 유지합니다.
