id: MAT.10.29
reference: Matthew 10:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
  footnotes:
  - marker: a
    text: Or 'without your Father'; the phrase may imply not apart from his knowledge, care, or will, but the Greek does not specify which.
    reason: alternative_reading
  - marker: b
    text: An assarion was a small Roman copper coin of very low value.
    reason: cultural_note
translation:
  language: ko
  text: 참새 두 마리가 앗사리온 한 닢에 팔리지 않습니까? 그러나 그 가운데 한 마리도 너희 아버지 없이는 땅에 떨어지지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희 아버지와 무관하게.” 이 표현은 아버지의 지식, 돌보심, 또는 뜻과 무관하지 않음을 뜻할 수 있으나, 그리스어 본문은 그 어느 하나를 특정하지 않습니다.
    reason: alternative_reading
  - marker: b
    text: 앗사리온은 가치가 매우 낮은 작은 로마 구리 화폐였습니다.
    reason: cultural_note
