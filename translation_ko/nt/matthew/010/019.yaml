review_pass:
  verdict: revise
  source_fidelity: The draft conveys the future contingency, handing over, prohibition of anxiety, paired questions of manner and content, and future passive provision. However, the imperative ending "말라" is not the specified modern formal-polite 합쇼체, and "말할까" is less precise than an indirect-question form expressing what/how they are to speak.
  naturalness: '"그들이 너희를 넘길 때에" is understandable, but "너희를 넘겨줄 때에" is more idiomatic for παραδῶσιν in this judicially hostile context. "어떻게 또는 무엇을 말해야 할지" naturally and explicitly retains both Greek interrogatives. "그 때에" is natural standard Korean while retaining the temporal force of ἐν ἐκείνῃ τῇ ὥρᾳ.'
  terminology: Retain "너희" for the plural second person and "주어질 것입니다" for the Greek future passive, without naming the implicit giver. Use the formal-polite prohibition "염려하지 마십시오."
  issues:
  - severity: medium
    issue: Register mismatch in "염려하지 말라."
    rationale: The requested target register is modern formal-polite 합쇼체; "말라" is a plain/authoritative imperative rather than 합쇼체.
  - severity: low
    issue: '"말할까" does not fully represent the indirect questions πῶς ἢ τί λαλήσητε.'
    rationale: '"어떻게 또는 무엇을 말해야 할지" clearly expresses both the manner and content of the contemplated speech.'
  - severity: low
    issue: The audit-trail notes require correctly placed Korean anchors.
    rationale: The alternative wording note belongs with the anxiety/speaking clause, and the note about the implicit agent belongs with the future passive "주어질 것입니다."
  revised_text: 그들이 너희를 넘겨줄 때에, 어떻게 또는 무엇을 말해야 할지 염려하지 마십시오[a]. 너희가 말해야 할 것이 그 때에 너희에게 주어질 것입니다[b].
