source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
  footnotes:
  - marker: a
    text: Or 'do not be anxious about how you are to speak or what you are to say.'
    reason: lexical_alternative
  - marker: b
    text: The passive 'will be given' leaves the giver implicit here; the next verse identifies the Spirit as the one speaking through them.
    reason: cross_reference
translation:
  language: ko
  text: 그들이 너희를 넘겨줄 때에, 어떻게 또는 무엇을 말해야 할지 염려하지 마십시오[a]. 너희가 말해야 할 것이 그 때에 너희에게 주어질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “어떻게 말해야 할지, 무엇을 말해야 할지 걱정하지 마십시오.”
    reason: lexical_alternative
  - marker: b
    text: “주어질 것입니다”는 수동태이며, 이 절에서는 주시는 분을 밝히지 않습니다. 다음 절은 성령께서 그들을 통하여 말씀하신다고 설명합니다.
    reason: cross_reference
