review_pass:
  verdict: revise
  source_fidelity: ‘더러운 영들을 다스리는 권세’ is less precise than the Greek expression for authority over them, and the following ‘...하게 하셨습니다’ can imply that Jesus directly caused the actions rather than that he granted authority for them. ‘모든 약한 것’ does not naturally convey μαλακία (‘weakness/infirmity’).
  naturalness: The draft is generally formal-polite, but ‘모든 약한 것’ is unnatural Korean. Recasting the sentence so that ‘권세’ governs both casting out and healing is natural and reflects the Greek infinitives clearly.
  terminology: ‘제자,’ ‘더러운 영들,’ and ‘권세’ are appropriate standard Korean biblical terms. ‘질병’ and ‘허약함’ retain the source’s two related but distinct healing terms without treating people or things as ‘weak.’
  issues:
  - severity: medium
    issue: ‘다스리는 권세’ narrows the sense of ἐξουσίαν πνευμάτων ἀκαθάρτων.
    rationale: The phrase denotes authority over unclean spirits, immediately specified as authority to cast them out; ‘다스리다’ introduces an ongoing ruling sense not expressed in the verse.
  - severity: high
    issue: ‘모든 약한 것’ is an inaccurate and unnatural rendering of πᾶσαν μαλακίαν.
    rationale: μαλακία here denotes weakness, infirmity, or sickness, not ‘every weak thing.’
  - severity: medium
    issue: ‘주셔서 ... 고치게 하셨습니다’ can overstate causation.
    rationale: The Greek says Jesus gave authority for casting out and healing. Korean should attach these actions directly to the granted authority.
  revised_text: 예수님께서 자기의 열두 제자를 부르셔서, 그들에게 더러운 영들을 쫓아내고 모든 질병과 모든 허약함을 고칠 권세를 주셨습니다.[a]
  revised_footnotes:
  - marker: a
    text: ‘질병’과 ‘허약함’은 서로 관련된 두 그리스어 단어(νόσος와 μαλακία)를 옮긴 것입니다. ‘허약함’은 ‘병약함’ 또는 ‘질환’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision preserves the summons of Jesus’ own twelve disciples, expresses delegated authority over unclean spirits through the actions authorized, and replaces the unnatural ‘약한 것’ with ‘허약함.’ The footnote documents the distinct but overlapping disease/infirmity terminology.
