  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 προσκαλεσάμενος에는 ‘자신에게로 불러’라는 소집의 방향성이 있으며, 초안의 ‘부르시고’는 이를 충분히 드러내지 않습니다. 또한 μαλακία를 ‘약한 것’으로 옮기면 질환·허약의 뜻이 불분명해집니다. ‘더러운 영들에 대한 권세’와 ‘그 영들을 쫓아내고’는 ἐξουσία 및 그 목적/결과를 충실히 반영합니다.
  naturalness: ‘모든 병과 모든 약한 것’은 현대 표준어에서 부자연스럽고 의미 범주도 흐립니다. ‘모든 질병과 모든 쇠약함’은 두 그리스어 명사의 병렬을 보존하면서 자연스럽습니다. ‘자신에게로 열두 제자를 불러’는 합쇼체 문맥에서 자연스럽게 소집의 뉘앙스를 표현합니다.
  terminology: ἐξουσία는 단순 능력보다 위임된 ‘권세’로 옮기는 것이 적절합니다. πνεύματα ἀκάθαρτα는 복음서의 관용적 표현인 ‘더러운 영들’로 유지합니다. νόσος/μαλακία의 구별은 ‘질병/쇠약함’으로 가능한 한 보존합니다.
  issues:
  - severity: medium
    issue: ‘부르시고’가 προσκαλεσάμενος의 ‘자신에게로 불러’라는 소집의 방향성을 생략합니다.
    rationale: 접두사 προσ-와 중간태 동사는 예수께서 제자들을 자신에게 불러 모으신 행위를 나타냅니다.
  - severity: medium
    issue: ‘모든 약한 것’은 μαλακία의 질병·허약 의미를 자연스럽게 전달하지 못합니다.
    rationale: ‘약한 것’은 사람이 아닌 일반 사물을 가리키는 듯하게 들릴 수 있습니다. ‘쇠약함’은 원문의 두 번째 질환 관련 명사를 자연스럽게 반영합니다.
  - severity: low
    issue: ‘더러운 영들을 다스리는 권세’는 가능하지만 ‘다스리다’가 본문이 명시하는 축출 행위와 다소 중복·확장됩니다.
    rationale: ‘더러운 영들에 대한 권세’가 ἐξουσία의 지배 범위를 직접적으로 옮기며, 이어지는 ‘쫓아내고’와도 매끄럽게 연결됩니다.
  revised_text: 예수께서 자신에게로 열두 제자를 불러, 그들에게 더러운 영들에 대한 권세를 주셔서 그 영들을 쫓아내고 모든 질병과 모든 쇠약함을 고치게 하셨습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘자신의 열두 제자를 불러.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘더러운 영들에 대한 능력.’ 그리스어 엑수시아는 흔히 위임된 권세의 뜻을 지닙니다.
    reason: lexical_alternative
  - marker: c
    text: ‘모든 질병과 모든 쇠약함’은 서로 관련된 두 그리스어 명사(nosos와 malakia)를 반영합니다. ‘모든 질병과 모든 연약함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 소집 방향성, 위임된 권세, 더러운 영들을 축출하는 행위, 그리고 두 질환 명사의 병렬을 보존하도록 수정했습니다. 의미를 넘는 신학적 해석은 추가하지 않았으며, 현대 표준어 합쇼체 문체를 유지했습니다.
