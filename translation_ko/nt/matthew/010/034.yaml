  source_fidelity: 원문의 금지 명령(Μὴ νομίσητε), 목적을 나타내는 '왔다'(ἦλθον ... βαλεῖν), '땅에'(ἐπὶ τὴν γῆν), 강한 대조(οὐκ ... ἀλλὰ), 그리고 구체적 비유인 '검'(μάχαιραν)을 모두 보존해야 합니다. 초안의 '주러'도 가능한 해석이지만, βάλλειν의 결과적·도래적 뉘앙스와 검이라는 구체적 대상을 함께 자연스럽게 담기에는 '가져오러'가 더 적절합니다.
