  terminology: εἰρήνη는 '평화', μάχαιρα는 해석적으로 '분열'로 바꾸지 않고 '검'으로 옮겼습니다. '검'의 비유적 효과는 각주에서만 간략히 밝혀 본문의 표현을 약화하지 않았습니다.
