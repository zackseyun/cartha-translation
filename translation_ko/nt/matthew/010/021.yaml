  terminology: ἀδελφός는 '형제', τέκνον/τέκνα는 '자식(들)', γονεῖς는 '부모'로 번역하여 원문의 성별 및 범위 차이를 보존했습니다. θανατόω는 '죽이다'로 옮겨 의도적으로 죽게 하는 뜻을 유지했습니다. παραδίδωμι의 문맥상 가능한 '배신하다' 뉘앙스는 각주로 제시합니다.
