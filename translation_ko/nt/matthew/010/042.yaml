  source_fidelity: 개정이 필요합니다. 초안의 ‘제자의 이름으로’는 εἰς ὄνομα μαθητοῦ의 형식적 번역으로 가능하지만, 현대 한국어에서는 제자의 권위나 명의로 행한다는 뜻으로도 읽힐 수 있습니다. 문맥상 이는 받는 사람이 제자이기 때문에 베푸는 행위를 가리키므로 그 뜻을 본문에서 분명히 했습니다. 또한 ‘마시게 하는 자’와 결론절의 연결을 자연스럽게 바로잡고, 강조 부정 οὐ μὴ를 ‘결코 … 않을 것입니다’로 유지했습니다.
  naturalness: 초안은 ‘누구든지 … 마시게 하는 자’라는 주제어가 길고, 뒤의 ‘진실로 너희에게 말한다. 그가’가 현대 합쇼체 문장으로 다소 부자연스럽습니다. 조건절과 주절을 분명히 하고 ‘내가 진실로 너희에게 말합니다’로 현대적 정중 문체를 적용했습니다. 끝의 닫는 인용부호도 근거 없이 단독으로 있었으므로 제거했습니다.
  terminology: ‘작은 이들’은 μικροί의 전통적 표현을 유지하되 어린이만을 뜻한다고 한정하지 않습니다. μισθός는 문맥상 ‘상’으로 옮겼습니다. εἰς ὄνομα μαθητοῦ의 가능한 형식적 번역은 각주에 보존했습니다.
  issues:
  - severity: medium
    issue: ‘제자의 이름으로’의 현대 한국어 의미가 불명확함
    rationale: 원문 표현은 수혜자가 제자라는 정체성에 근거하여 행하는 뜻이지만, 한국어 ‘~의 이름으로’는 대리·권위·명의의 뜻으로 오해될 수 있습니다.
  - severity: medium
    issue: 문체와 문장 구조가 합쇼체에 맞지 않음
    rationale: ‘진실로 너희에게 말한다. 그가’는 격식체 종결과 문장 연결이 혼재되어 있습니다.
  - severity: low
    issue: 단독 닫는 인용부호
    rationale: 열린 인용부호가 없는 구조적 표기 오류입니다.
  revised_text: 누구든지 이 작은 이들 가운데 한 사람에게, 그가 제자라는 이유로 냉수 한 잔만이라도 마시게 하면, 내가 진실로 너희에게 말합니다. 그 사람은 결코 자기 상을 잃지 않을 것입니다.
  revised_footnotes:
  - marker: a
    text: ‘작은 이들’은 반드시 어린이만을 가리키는 말은 아니며, 여기서는 예수님의 따르는 이들 가운데 낮게 여겨지거나 보잘것없어 보이는 이들을 가리킬 수 있습니다.
    reason: cross_reference
  - marker: b
    text: 직역하면 ‘제자의 이름으로’입니다. 이 표현은 그 사람이 제자라는 이유로 행하는 것을 뜻합니다.
    reason: alternative_reading
  revision_rationale: 원문의 조건적·일반적 진술, 최소한의 선행(‘냉수 한 잔만이라도’), 제자라는 정체성에 근거한 동기, 엄중한 확언, 그리고 강한 부정을 모두 보존했습니다. 본문은 현대 한국어에서 오해가 적은 표현을 택하고, 논의될 수 있는 형식적 표현과 ‘작은 이들’의 범위는 각주로 남겼습니다.
