review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 ποτίσῃ는 ‘마시게 하다/마실 것을 주다’이며, ‘냉수 한 잔’은 자연스럽게 옮길 수 있습니다. εἰς ὄνομα μαθητοῦ는 행위의 근거, 곧 그 사람이 제자라는 정체성과 관련된 이유를 나타내므로 ‘제자의 이름으로’보다 ‘그가 제자라는 이유로’가 한국어에서 더 명확합니다. μόνον의 최소성은 ‘한 잔만이라도’로 반영했습니다. οὐ μὴ의 강한 부정은 ‘결코 … 않을 것입니다’로 옮겼습니다.
  naturalness: 초안은 ‘제자의 이름으로’의 수식 범위가 ‘마시게 하는 자’에 붙는 듯하여 의미가 불명확하고, 합쇼체 본문에 ‘말한다’가 사용되었습니다. 또한 닫는 인용 부호만 있어 문장부호가 불완전합니다. 개정문은 현대 표준어 합쇼체로 자연스럽게 다듬었습니다.
  terminology: ‘작은 이들’은 μικρῶν의 표현을 보존하며 이를 어린이로 한정하지 않습니다. ‘상’은 μισθός의 문맥상 적절합니다. ‘제자’는 μαθητοῦ에 충실합니다.
  issues:
  - severity: medium
    issue: ‘제자의 이름으로’의 의미와 수식 범위가 불명확함
    rationale: εἰς ὄνομα μαθητοῦ는 이 구절에서 받는 이가 제자라는 사실에 근거하여 행하는 것을 가리킵니다. 초안의 어순은 행위자가 제자의 이름으로 행동한다는 뜻으로 읽힐 수 있습니다.
  - severity: medium
    issue: 합쇼체 불일치
    rationale: 번역 목표가 현대 공식 존대체인데 ‘진실로 너희에게 말한다’는 평서체입니다. ‘말씀드립니다’ 또는 ‘말합니다’가 필요합니다.
  - severity: low
    issue: 불필요하고 짝이 없는 닫는 인용 부호
    rationale: 본문 끝의 ‘」’에는 대응하는 여는 인용 부호가 없어 제거해야 합니다.
  revised_text: 누구든지 이 작은 이들 가운데 한 사람에게 그가 제자라는 이유로 찬물 한 잔만이라도 마시게 하면, 내가 진실로 너희에게 말씀드립니다. 그는 결코 자기 상을 잃지 않을 것입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면, ‘제자의 이름으로.’ 이 표현은 그 사람이 제자라는 정체성 때문에 그에게 행하는 것을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: ‘이 작은 이들’은 반드시 어린이만을 뜻하지 않으며, 문맥상 예수님의 제자들 가운데 낮거나 중요하지 않게 여겨지는 이들을 포함할 수 있습니다.
    reason: cross_reference
  revision_rationale: 원문의 의미를 보존하면서 모호한 수식 관계를 한국어에서 해소했습니다. ‘그가 제자라는 이유로’는 εἰς ὄνομα μαθητοῦ의 관용적 기능을 자연스럽게 드러내며, 보다 형식적인 직역은 각주에 보존했습니다. ‘한 잔만이라도’는 μόνον이 강조하는 매우 작은 행위를 나타냅니다. 문체와 문장부호도 목표 형식에 맞게 바로잡았습니다.
