  terminology: σταυρός는 ‘십자가’, ἄξιος의 관계적 용법은 ‘내게 합당하지 않습니다’로 옮기는 것이 적절합니다. ‘사람’은 ὃς의 포괄적·일반적 용법을 자연스럽게 나타냅니다.
