  source_fidelity: 초안은 장소에 들어감, 그곳에서 ἄξιος인 사람을 찾아봄, 떠날 때까지 머묾이라는 기본 흐름을 잘 옮겼습니다. 그러나 헬라어 κἀκεῖ μείνατε는 ‘그곳에 머무르라’이며 특정하게 ‘그의 집에’라고 하지 않습니다. 문맥상 환대하는 사람의 집을 예상할 수는 있어도, 본문에 없는 장소를 본문에 명시해서는 안 됩니다.
  naturalness: ‘성읍’과 ‘머물러라’는 각각 다소 전통적·비격식 명령형입니다. 표준 현대어 합쇼체에 맞추어 ‘도시’, ‘머무르십시오’를 사용하고, ‘그곳에서 누가 … 인지 알아보십시오’로 자연스럽게 다듬었습니다.
  terminology: ἄξιος는 ‘합당한’으로 유지했습니다. 이는 본문의 평가어를 보존하면서도 구원 공로라는 의미를 본문에 덧붙이지 않습니다. 짧은 주석은 환대와 사명자 수용이라는 문맥적 의미를 제시하되 단정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘그의 집에’가 본문에 없음
    rationale: κἀκεῖ는 ‘그리고/또 그곳에’를 뜻할 뿐, ‘그의 집’을 명시하지 않습니다. 문맥적 추론을 번역 본문에 추가한 것입니다.
  - severity: low
    issue: 합쇼체 및 현대 표준어 일관성
    rationale: ‘성읍’, ‘머물러라’ 대신 ‘도시’, ‘머무르십시오’가 요청된 현대적 합쇼체에 더 적합합니다.
  revised_text: 너희가 어느 도시나 마을에 들어가든지, 그곳에서 누가 합당한 사람인지 알아보십시오. 그리고 그곳을 떠날 때까지 거기에 머무르십시오.
  revised_footnotes:
  - marker: a
    text: ‘합당한’은 하나님의 은혜를 받을 자격을 얻었다는 뜻이라기보다, 사자들을 맞아들일 만한 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 본문에 없는 ‘그의 집’을 삭제하여 κἀκεῖ의 장소 지시를 그대로 보존했습니다. 또한 현대 표준어 합쇼체로 다듬고, ἄξιος의 문맥적 의미는 주석에서 제한적으로 설명했습니다.
