review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys entering any city or village, making inquiry about a suitable person, and remaining until departure. However, it adds “his house,” which is not stated in the Greek; κἀκεῖ means “there/in that place.”
  naturalness: The wording is generally understandable, but the imperative ending “-머물러라” is 해라체 and does not meet the required modern formal-polite 합쇼체 register. “누가 합당한 사람인지” is more natural than “합당한 사람이 누구인지.”
  terminology: “성읍이나 마을” appropriately represents πόλις ἢ κώμη, and “합당한” suitably preserves ἄξιος without deciding whether the qualification is moral, social, or receptivity-based. A clarifying note can describe the likely contextual sense without narrowing the main text.
  issues:
  - severity: medium
    issue: The draft adds “그의 집에” (“at his house”).
    rationale: The Greek says “and stay there” (κἀκεῖ μείνατε), referring to the place just entered. Although a host household is implied by context, “his house” is not expressed in this verse and unnecessarily narrows the wording.
  - severity: medium
    issue: The final imperative uses non-honorific 해라체.
    rationale: “머물러라” conflicts with the specified modern formal-polite 합쇼체 target register. “머무르십시오” maintains the instruction while meeting the register requirement.
  - severity: low
    issue: The inquiry clause is less idiomatic than it could be.
    rationale: “그 안에서 합당한 사람이 누구인지” is understandable, but “그곳에서 누가 합당한 사람인지” is smoother modern Korean and retains the source sense.
  revised_text: 여러분이 어느 성읍이나 마을에 들어가든지, 그곳에서 누가 합당한 사람인지 알아보십시오[a]. 그리고 그곳을 떠날 때까지 그곳에 머무르십시오.
  revised_footnotes:
  - marker: a
    text: ‘알아보십시오’는 ‘자세히 알아보십시오’ 또는 ‘조사하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘합당한’은 여기서 하나님의 은총을 받을 자격을 얻었다는 뜻이라기보다, 사자들을 받아들이기에 적합하거나 받아들일 만한 사람을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  revision_rationale: The revision removes the unstated reference to a particular person’s house, restores the explicit locative sense of κἀκεῖ as “그곳에,” and uses consistent 합쇼체. It retains “합당한” in the text to preserve the evaluative breadth of ἄξιος; the note gives the likely contextual force without making it a doctrinal definition.
