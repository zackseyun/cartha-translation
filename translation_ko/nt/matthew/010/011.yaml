  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
  footnotes:
  - marker: a
    text: Or 'inquire' or 'investigate' for who in it is worthy.
    reason: lexical_alternative
  - marker: b
    text: '''Worthy'' here likely means fit or receptive to receive the messengers, not someone who has earned God''s favor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분이 어느 성읍이나 마을에 들어가든지, 그곳에서 누가 합당한 사람인지 알아보십시오[a]. 그리고 그곳을 떠날 때까지 그곳에 머무르십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알아보십시오’는 ‘자세히 알아보십시오’ 또는 ‘조사하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
