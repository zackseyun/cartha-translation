  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
  footnotes:
  - marker: a
    text: Or 'soul' in both clauses; Greek ψυχή can mean 'life' or 'soul,' but here 'life' best fits the context of losing and finding one's life in discipleship.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 목숨을 얻는 사람은 그 목숨을 잃을 것입니다[a]. 나를 위하여 자기 목숨을 잃는 사람은 그 목숨을 얻을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 두 절 모두 ‘영혼’. 그리스어 프쉬케(ψυχή)는 ‘목숨’ 또는 ‘영혼’을 뜻할 수 있으나, 여기서는 제자도의 맥락에서 목숨을 잃고 얻는다는 뜻에 ‘목숨’이 가장 잘 맞습니다.
    reason: lexical_alternative
