  text: 예언자를 예언자의 이름으로[a] 영접하는 사람은 예언자의 상을 받을 것이며, 의인을 의인의 이름으로[b] 영접하는 사람은 의인의 상을 받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예언자이기 때문에’ 또는 ‘예언자로서’. 그리스어는 직역하면 ‘예언자의 이름으로’이다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의인이기 때문에’ 또는 ‘의인으로서’. 그리스어는 직역하면 ‘의인의 이름으로’이다.
