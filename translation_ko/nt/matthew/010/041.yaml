  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
  footnotes:
  - marker: a
    text: Or 'because he is a prophet' or 'as a prophet.' The Greek literally says 'in the name of a prophet.'
    reason: lexical_alternative
  - marker: b
    text: Or 'because he is a righteous man' or 'as a righteous man.' The Greek literally says 'in the name of a righteous man.'
    reason: lexical_alternative
