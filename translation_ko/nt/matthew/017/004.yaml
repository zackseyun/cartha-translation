id: MAT.17.4
reference: Matthew 17:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
  footnotes:
  - marker: a
    text: Or “tabernacles,” “booths,” or “tents” for Greek skēnas.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 베드로가 예수께 대답하여 말했습니다. “주님, 우리가 여기 있는 것이 좋습니다. 원하시면 제가 여기서 천막[a] 셋을 만들겠습니다. 하나는 주님을 위해, 하나는 모세를 위해, 하나는 엘리야를 위해.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천막’은 헬라어 σκηνάς의 일반적 의미를 따른 것입니다. 문맥상 ‘장막’, ‘초막’, ‘텐트’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  english_pob_choice: Then Peter answered and said
  chosen_korean: 그러자 베드로가 대답하여 말했습니다
  alternatives_korean:
  - 베드로가 응답하여 말했습니다
  - 그때 베드로가 말했습니다
  lexicon: BDAG
  rationale: ἀποκριθεὶς δὲ εἶπεν은 서술적 말문 여는 공식이므로, ‘그러자’로 흐름을 살리고 ‘대답하여 말했습니다’로 응답 동작을 보존했습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인님
  - 선생님
  lexicon: BDAG
  rationale: 예수께 직접 드리는 호칭으로서 ‘주님’이 영어 POB의 ‘Lord’와 대응하며, 단순한 예의 표현보다 호칭의 신학적 무게를 유지합니다.
- source_word: σκηνάς
  english_pob_choice: shelters
  chosen_korean: 천막
  alternatives_korean:
  - 장막
  - 텐트
  - 초막
  lexicon: BDAG
  rationale: σκηνή는 임시 거처를 뜻하므로, 현대 한국어에서 자연스럽고 구체적인 ‘천막’으로 옮겼습니다. ‘장막/초막’은 교회 용어 또는 절기 연상을 더 강하게 불러일으킬 수 있습니다.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  english_pob_choice: one for you, one for Moses, and one for Elijah
  chosen_korean: 하나는 주님을 위해, 하나는 모세를 위해, 하나는 엘리야를 위해
  alternatives_korean:
  - 하나는 주님을 위하여, 하나는 모세를 위하여, 하나는 엘리야를 위하여
  lexicon: BDAG
  rationale: 반복되는 μίαν을 한국어에서도 각각 ‘하나’로 살려 분배적 강조를 유지했습니다. 전치사적 의미는 ‘을 위해’로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 예수께 드리는 κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주인님
  - 선생님
  rationale: 이 장면에서 베드로의 호칭은 단순한 존칭을 넘어서며, ‘주님’이 공경과 주권적 의미를 함께 담습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος → Lord'
- issue: σκηνάς의 의미 범위
  chosen_reading: 천막
  alternative_readings:
  - 장막
  - 초막
  rationale: 본문은 절기적 의미를 명시하지 않으므로, 축제적 연상을 강하게 띠는 표현을 본문에 도입하지 않고 중립적 임시 구조물로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: preserve theological tension rather than resolve it'
