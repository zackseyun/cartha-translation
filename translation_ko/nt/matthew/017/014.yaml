translation:
  language: ko
  text: 그리고 그들이 무리에게 다가갔을 때, 한 남자가 예수께 와서 무릎을 꿇고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무리’는 ὄχλος의 자연스러운 현대어 옮김입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: Καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그때
  lexicon: SBLGNT
  rationale: 앞 문맥과의 연결을 자연스럽게 살리면서도, 서술 흐름에 불필요한 해석을 더하지 않기 위해 기본 접속사로 옮겼습니다.
- source_word: ἐλθόντων πρὸς τὸν ὄχλον
  english_pob_choice: when they came to the crowd
  chosen_korean: 그들이 무리에게 다가갔을 때
  alternatives_korean:
  - 그들이 무리에게 왔을 때
  - 그들이 군중에게 다가왔을 때
  lexicon: BDAG
  rationale: γενitive absolute의 시간 관계를 한국어 종속절로 풀고, ὄχλος는 여기서 자연스러운 현대어인 ‘무리’로 옮겼습니다.
- source_word: προσῆλθεν αὐτῷ
  english_pob_choice: came up to him
  chosen_korean: 예수께 와서
  alternatives_korean:
  - 그에게 다가와
  - 예수께 접근하여
  lexicon: BDAG
  rationale: 문맥상 ‘그’는 예수님을 가리키므로 대상을 분명히 하되, προσέρχομαι의 접근 의미는 ‘와서’로 간결하게 살렸습니다.
- source_word: γονυπετῶν αὐτὸν
  english_pob_choice: kneeling before him
  chosen_korean: 무릎을 꿇고 있었습니다
  alternatives_korean:
  - 그 앞에 무릎을 꿇고 있었습니다
  - 무릎을 꿇으며 나아왔습니다
  lexicon: BDAG
  rationale: 현재분사로 나타난 자세를 한국어 진행형으로 반영했고, 예수 앞의 경배적 몸짓은 ‘무릎을 꿇다’로 충분히 드러납니다.
theological_decisions:
- issue: γονυπετῶν의 예수에 대한 태도 표현
  chosen_reading: 무릎을 꿇고 있었습니다
  alternative_readings:
  - 예수 앞에 엎드리고 있었습니다
  - 경배하고 있었습니다
  rationale: 본문은 예배 행위의 해석을 직접 말하지 않고 자세를 묘사하므로, 해석을 과도하게 확정하지 않고 신체적 행위를 중심으로 옮겼습니다.
  doctrine_reference: Translation philosophy — source-directed restraint
