revisions:
- from: 그리고 그들이 무리에게 다가갔을 때, 한 남자가 예수께 와서 무릎을 꿇고 있었습니다.[a]
  to: 그리고 그들이 무리에 이르렀을 때, 한 남자가 예수께 다가와 그 앞에 무릎을 꿇었습니다.
  rationale: 시간적 속격 독립구문은 ‘그들이 무리에 이르렀을 때’로, 남자의 접근과 무릎 꿇는 자세는 ‘한 남자가 예수께 다가와 그 앞에 무릎을 꿇었습니다’로 옮겼습니다. 이는 원문의 순서, 접근의 방향, 그리고 예수를 향한 신체 자세를 보존하면서 과도한 경배 해석을 덧붙이지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:25Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘무리에게 다가갔을 때’는 의미상 가능하지만, πρὸς τὸν ὄχλον의 도착을 ‘무리에 이르렀을 때’로 옮기는 편이 더 정확하고 자연스럽습니다. 또한 γονυπετῶν αὐτόν에는 예수를 향한 자세가 명시되어 있으므로 ‘그 앞에’를 보충해야 합니다. ‘무릎을 꿇고 있었습니다’는 사건을 진행 상태로 만들 수 있어, 분사의 동반 동작을 자연스럽게 나타내는 ‘무릎을 꿇었습니다’가 적절합니다.
  naturalness: ‘그들이 무리에 이르렀을 때’와 ‘한 사람이 예수께 다가와 그 앞에 무릎을 꿇었습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. ‘한 남자’보다 문맥상 자연스러운 ‘한 사람’도 가능하지만, ἄνθρωπος가 특정 성인 남성을 가리키므로 ‘한 남자’를 유지합니다.
  terminology: ὄχλος는 ‘무리’, ἄνθρωπος는 ‘한 남자’로 적절합니다. προσῆλθεν은 ‘다가와’, γονυπετῶν은 신학적 해석인 ‘경배하다’를 피한 ‘그 앞에 무릎을 꿇었습니다’로 옮겨 신체 자세와 대상을 모두 보존합니다.
  issues:
  - severity: medium
    issue: γονυπετῶν αὐτὸν의 대상을 본문에서 생략함
    rationale: ‘무릎을 꿇고 있었습니다’는 누구 앞에서 무릎을 꿇었는지 명시하지 않아 αὐτόν(그를)를 충분히 반영하지 못합니다. ‘그 앞에’를 넣어야 합니다.
  - severity: low
    issue: 현재분사를 ‘꿇고 있었습니다’로 진행상태화함
    rationale: 이 문맥의 현재분사는 남자가 다가오는 가운데 취한 자세를 나타냅니다. 한국어 완료 서술 ‘무릎을 꿇었습니다’가 불필요한 지속 상태의 뉘앙스 없이 자연스럽습니다.
  - severity: low
    issue: 각주가 원문의 번역상 쟁점이 아닌 문체 설명임
    rationale: ‘무리’는 본문에 직접 제시되어 있고, 해당 각주는 원문 대안이나 본문 이해에 필요한 정보를 제공하지 않습니다. 삭제하는 편이 적절합니다.
  revised_text: 그리고 그들이 무리에 이르렀을 때, 한 남자가 예수께 다가와 그 앞에 무릎을 꿇었습니다.
  revised_footnotes: []
  revision_rationale: 시간적 속격 독립구문은 ‘그들이 무리에 이르렀을 때’로, 남자의 접근과 무릎 꿇는 자세는 ‘한 남자가 예수께 다가와 그 앞에 무릎을 꿇었습니다’로 옮겼습니다. 이는 원문의 순서, 접근의 방향, 그리고 예수를 향한 신체 자세를 보존하면서 과도한 경배 해석을 덧붙이지 않습니다.
