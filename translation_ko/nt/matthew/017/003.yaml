review_pass:
  verdict: revise
  source_fidelity: ‘그러자’는 원문의 καὶ ἰδού가 가진 단순한 연결 및 주의 환기 이상의 시간적·인과적 진행을 덧붙일 수 있으므로 제거하는 것이 좋습니다. 또한 μετ’ αὐτοῦ는 ‘그분과’로 옮겨 원문의 대명사 표현을 보존하는 편이 적절합니다. ὤφθη와 현재분사 συλλαλοῦντες의 의미는 ‘나타나 … 이야기하고 있었습니다’로 충실히 전달됩니다.
  naturalness: ‘보십시오, 모세와 엘리야가 그들에게 나타나 그분과 이야기하고 있었습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. ‘말씀을 나누다’보다 ‘이야기하다’가 συλλαλοῦντες의 상호 대화를 더 중립적으로 나타내며, 불필요한 경어 뉘앙스를 피합니다.
  terminology: 모세와 엘리야는 통용되는 한국어 성경 인명 표기입니다. 문맥상 예수를 가리키는 αὐτοῦ는 ‘그분’으로 유지하여 원문의 지시 방식과 존칭에 맞췄습니다.
  issues:
  - severity: medium
    issue: ‘그러자’가 καὶ ἰδού에 시간적·전개적 의미를 덧붙입니다.
    rationale: καὶ ἰδού는 여기서 주의를 환기하며 사건을 생생하게 제시합니다. ‘그러자’는 앞 사건의 결과 또는 다음 단계라는 뉘앙스를 더할 수 있습니다.
  - severity: low
    issue: ‘예수와’가 원문의 대명사 αὐτοῦ를 이름으로 바꿉니다.
    rationale: 지시 대상은 문맥상 분명하지만, 본문 자체의 대명사 표현은 ‘그분과’로 보존할 수 있습니다.
  - severity: low
    issue: ‘말씀을 나누고’는 다소 경건화된 관용 표현입니다.
    rationale: συλλαλοῦντες는 함께 이야기하거나 대화하는 것을 뜻하므로, ‘이야기하고’가 더 직접적이고 중립적입니다.
  revised_text: 보십시오, 모세와 엘리야가 그들에게 나타나 그분과 이야기하고 있었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그들에게 보였습니다.’ 그리스어 동사는 형태상 수동태이지만, 한국어에서는 ‘나타났습니다’가 더 자연스럽습니다.
    reason: lexical_alternative
  revision_rationale: 주의 환기 표현 ἰδού를 시간적 첨가 없이 ‘보십시오’로 옮기고, αὐτοῦ의 대명사성을 ‘그분’으로 보존했습니다. συλλαλοῦντες는 상호적 대화를 뜻하는 중립적 표현 ‘이야기하고 있었습니다’로 다듬었습니다. 각주는 수동태 형태라는 원문의 특징과 자연스러운 한국어 번역의 차이를 유지합니다.
