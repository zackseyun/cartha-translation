id: MAT.17.3
reference: Matthew 17:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
  footnotes:
  - marker: a
    text: Or 'were seen by them.' The Greek verb is formally passive, though in English 'appeared to them' is the more natural rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 보십시오[a]. 모세와 엘리야가 그들에게 나타나 예수와 말씀을 나누고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 보였습니다.’ 그리스어 동사는 형식상 수동태이지만, 한국어에서는 ‘나타나’가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: BDAG
  rationale: 듣는 이의 주의를 즉시 끌어 사건의 급작스러움을 살리는 감탄형/주의 환기 표현으로 옮겼습니다.
- source_word: ὤφθη
  english_pob_choice: appeared
  chosen_korean: 나타나
  alternatives_korean:
  - 보이셨습니다
  - 드러났습니다
  lexicon: BDAG
  rationale: 수동형의 형태를 그대로 풀어 쓰기보다, 본문이 말하는 가시적 출현을 자연스럽게 드러내는 동사로 옮겼습니다.
- source_word: συλλαλοῦντες
  english_pob_choice: talking
  chosen_korean: 말씀을 나누고 있었습니다
  alternatives_korean:
  - 대화하고 있었습니다
  - 말하고 있었습니다
  lexicon: BDAG
  rationale: 단순한 발화보다 함께 말하는 상호적 행위를 살리되, 현대 한국어에서 자연스럽게 들리는 표현으로 처리했습니다.
theological_decisions:
- issue: αὐτοῦ의 지시 대상
  chosen_reading: ‘그분’은 문맥상 예수님입니다.
  alternative_readings:
  - 그에게
  - 그와
  rationale: 변형해 이름을 반복하기보다 대명사를 유지하되, 장면 전체가 변화산 사건이라는 문맥으로 지시 대상을 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ὤφθη의 의미 범위
  chosen_reading: 모세와 엘리야의 가시적 출현을 그대로 진술합니다.
  alternative_readings:
  - 그들에게 보였다
  - 환상으로 나타났다
  rationale: 본문은 나타남의 사실을 말할 뿐 그 존재 방식에 대한 신학적 해설을 덧붙이지 않으므로, 해석을 과잉하지 않았습니다.
  doctrine_reference: Translation philosophy §3
