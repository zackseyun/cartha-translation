revisions:
- from: 그러나 내가 여러분에게 말합니다. 엘리야가 이미 왔지만, 사람들은 그를 알아보지 못하고 그에게 자기들이 원하는 대로 했습니다. 이와 같이 인자도 그들의 손에서 고난을 겪어야 합니다.[a][b][c]
  to: 그러나 내가 여러분에게 말씀드립니다. 엘리야는 이미 왔습니다. 그러나 그들은 그를 알아보지 못했지만[a], 그에게 자기들이 원하는 대로 하였습니다. 이와 같이 인자도 그들에게[b] 곧 고난을 당하게 됩니다.[c]
  rationale: The revision removes the unsupported necessity nuance from ‘-아/어야 합니다’ and renders μέλλει with ‘곧 … 당하게 됩니다,’ preserving the prospective/impending sense without asserting theological determinism. It retains the source's ambiguity about Elijah's referent and about the specific acts done to him, uses standard biblical terms, and relocates each footnote marker to its relevant phrase.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:31Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves Elijah's coming, the failure to recognize him, the unrestricted hostile treatment, and the agency of 'them.' However, '고난을 겪어야 합니다' renders μέλλει πάσχειν with an unwarranted sense of obligation/necessity ('must suffer') and does not adequately express its prospective, often impending force.
  naturalness: The draft is generally understandable in modern formal Korean, but '그에게 자기들이 원하는 대로 했습니다' is somewhat vague and colloquial in a formal Bible register. A small adjustment improves flow while retaining the Greek's deliberate lack of specification.
  terminology: ‘엘리야’ and ‘인자’ are appropriate established Korean biblical terms. ‘그들에게 고난을 당하게 됩니다’ clearly expresses the hostile agency of ὑπ’ αὐτῶν without importing additional interpretation.
  issues:
  - severity: medium
    issue: ‘고난을 겪어야 합니다’ adds necessity to μέλλει πάσχειν.
    rationale: μέλλω with the infinitive expresses a forthcoming/impending event here; it does not itself state that the Son of Man 'must' suffer. Rendering it with -아/어야 하다 imports a modal necessity not expressed in this clause.
  - severity: low
    issue: Footnote c describes imminence, but the main text does not explicitly convey it.
    rationale: The note claims that the rendering represents the impending sense of μέλλω, whereas ‘고난을 겪어야 합니다’ instead conveys obligation. Adding ‘곧’ aligns the text and note.
  - severity: low
    issue: All footnote anchors occur at the end rather than at their relevant words or phrases.
    rationale: Placing each marker immediately after its corresponding expression makes the lexical and source notes unambiguous.
  revised_text: 그러나 내가 여러분에게 말씀드립니다. 엘리야는 이미 왔습니다. 그러나 그들은 그를 알아보지 못했지만[a], 그에게 자기들이 원하는 대로 하였습니다. 이와 같이 인자도 그들에게[b] 곧 고난을 당하게 됩니다.[c]
  revised_footnotes:
