    text: ‘알아보다’는 여기서 단순히 그에 관해 알지 못했다는 뜻보다, 그의 정체나 역할을 식별하지 못했다는 뜻을 담습니다. 또는 ‘그를 알지 못했다’, ‘그를 인정하지 않았다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들에게’는 고난을 가하는 주체를 나타냅니다. 직역하면 ‘그들에 의해’입니다.
    reason: source_note
  - marker: c
