id: MAT.17.12
reference: Matthew 17:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
  footnotes:
  - marker: a
    text: Or 'they did not know him' or 'they did not acknowledge him.' The Greek can denote failure to recognize or identify him properly.
    reason: lexical_alternative
  - marker: b
    text: Or 'did against him whatever they wanted' or 'treated him however they wished.' The Greek expression is idiomatic and conveys unrestricted action toward him.
    reason: lexical_alternative
  - marker: c
    text: Or 'is going to suffer.' The Greek says the Son of Man is about to suffer, emphasizing what is impending.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 여러분에게 말씀드립니다. 엘리야는 이미 왔습니다. 그러나 그들은 그를 알아보지 못했지만[a], 그에게 자기들이 원하는 대로 하였습니다. 이와 같이 인자도 그들에게[b] 곧 고난을 당하게 됩니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알아보다’는 여기서 단순히 그에 관해 알지 못했다는 뜻보다, 그의 정체나 역할을 식별하지 못했다는 뜻을 담습니다. 또는 ‘그를 알지 못했다’, ‘그를 인정하지 않았다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들에게’는 고난을 가하는 주체를 나타냅니다. 직역하면 ‘그들에 의해’입니다.
    reason: source_note
  - marker: c
    text: ‘곧 고난을 당하게 됩니다’는 μέλλω + 부정사의 앞으로 닥친 일을 나타내는 뜻을 옮긴 것입니다. 또는 ‘고난을 당할 것입니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  english_pob_choice: But I tell you
  chosen_korean: 그러나 내가 여러분에게 말합니다
  alternatives_korean:
  - 그러나 내가 당신들에게 말합니다
  - 하지만 내가 여러분에게 말합니다
  lexicon: BDAG
  rationale: δέ의 대조를 ‘그러나’로 살리고, ὑμῖν은 복수 청중에게 자연스러운 ‘여러분에게’로 옮겨 직접 발화의 힘을 유지했습니다.
- source_word: ἤδη ἦλθεν
  english_pob_choice: has already come
  chosen_korean: 이미 왔지만
  alternatives_korean:
  - 이미 왔습니다
  - 벌써 왔습니다
  lexicon: BDAG
  rationale: ἤδη와 완료된 도착을 한국어의 ‘이미’로 분명히 하고, 문맥상 뒤따르는 대조를 위해 절 내부를 유연하게 연결했습니다.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  english_pob_choice: they did not recognize him
  chosen_korean: 그를 알아보지 못하고
  alternatives_korean:
  - 그를 알아보지 못했습니다
  - 그를 알아차리지 못하고
  - 그를 알아보지 못하였습니다
  lexicon: BDAG
  rationale: ἐπιγινώσκω의 핵심은 단순한 무지가 아니라 정체를 식별하지 못한 것이므로, ‘알아보다’ 계열로 옮겨 인식 실패를 살렸습니다.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  english_pob_choice: did to him whatever they wanted
  chosen_korean: 그에게 자기들이 원하는 대로 했습니다
  alternatives_korean:
  - 그에게 자기들이 하고 싶은 대로 했습니다
  - 그에게 자기들이 원한 것은 무엇이든 했습니다
  - 그에게 자기들이 원하는 대로 행했습니다
  lexicon: BDAG
  rationale: ἐποίησαν ἐν αὐτῷ의 관용적이고 가해적인 뉘앙스를 ‘그에게 … 했다’로 자연스럽게 풀어, 뒤의 ‘원하는 대로’와 함께 무제한적 처리를 드러냈습니다.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자이신 분
  lexicon: BDAG
  rationale: 마태복음의 확립된 종말론적 칭호를 표준적으로 ‘인자’로 유지해 다니엘적 호칭의 울림을 살렸습니다.
- source_word: μέλλει πάσχειν
  english_pob_choice: is about to suffer
  chosen_korean: 고난을 겪어야 합니다
  alternatives_korean:
  - 곧 고난을 겪게 됩니다
  - 고난을 겪게 되어 있습니다
  - 고난을 당하게 됩니다
  lexicon: BDAG
  rationale: μέλλω + 부정사는 임박성을 드러내지만, 여기서는 수동적 고난의 현실이 핵심이므로 한국어로는 ‘고난을 겪어야 합니다’로 임박성과 수난성을 함께 담았습니다.
- source_word: ὑπ’ αὐτῶν
  english_pob_choice: at their hands
  chosen_korean: 그들의 손에서
  alternatives_korean:
  - 그들로부터
  - 그들에 의해
  - 그들의 손에
  lexicon: BDAG
  rationale: ὑπό + 속격의 가해 행위자 표시를 한국어 관용인 ‘손에서’로 옮겨, 고난의 가해 주체를 분명히 했습니다.
theological_decisions:
- issue: 엘리야의 정체를 본문 안에서 얼마나 명시할 것인가
  chosen_reading: 본문은 ‘엘리야’라고 그대로 두고, 그를 세례 요한으로 바로 바꿔 쓰지 않았습니다.
  alternative_readings:
  - 세례 요한을 가리킨다고 본문에 풀어 쓸 수 있습니다
  - 엘리야-형 예비자로 의역할 수 있습니다
  rationale: 마태복음의 문맥이 식별을 돕더라도, 이 절 자체는 엘리야를 말하므로 원문 수준의 명시를 유지해 해석은 문맥에 맡겼습니다.
  doctrine_reference: 원문 우선 원칙과 해석의 여백 보존
- issue: μέλλει의 강도
  chosen_reading: ‘고난을 겪어야 합니다’로 옮겨 임박성과 필연성을 모두 지나치게 강화하지 않았습니다.
  alternative_readings:
  - 곧 고난을 겪게 됩니다
  - 고난을 당할 것입니다
  rationale: 그리스어는 임박한 미래를 말하지만 이 절만으로 더 강한 신학적 필연을 명시하지 않으므로, 과도한 결정론을 덧붙이지 않았습니다.
  doctrine_reference: 본문이 말하는 만큼만 말하기
