lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  english_pob_choice: after six days
  chosen_korean: 엿새 뒤에
  alternatives_korean:
  - 여섯 날 후에
  - 엿새 후에
  lexicon: BDAG
  rationale: 시간 경과를 자연스러운 한국어로 옮기되, ‘뒤에’로 사건의 선후 관계를 분명히 드러냈습니다.
- source_word: παραλαμβάνει
  english_pob_choice: takes
  chosen_korean: 데리고
  alternatives_korean:
  - 데려가시고
  - 함께 데리고
  lexicon: BDAG
  rationale: 예수께서 제자들을 동행시켜 데려가시는 뜻을 살리면서, 한국어 문맥에서 가장 자연스러운 동사로 옮겼습니다.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  english_pob_choice: his brother
  chosen_korean: 그의 형제 요한
  alternatives_korean:
  - 야고보의 형제 요한
  - 그의 형 요한
  lexicon: BDAG
  rationale: 헬라어의 소유대명사를 그대로 살리면 요한을 가리키는 인접한 표현이므로, 한국어에서도 ‘그의 형제 요한’으로 옮겨 인칭 연결을 유지했습니다.
- source_word: κατ’ ἰδίαν
  english_pob_choice: by themselves
  chosen_korean: 따로
  alternatives_korean:
  - 따로따로
  - 비공개로
  - 둘만
  lexicon: BDAG
  rationale: 공동체로부터 분리된 상태를 나타내는 표현으로, ‘따로’가 본문의 장면을 가장 간결하게 전달합니다.
- source_word: ὄρος ὑψηλὸν
  english_pob_choice: a high mountain
  chosen_korean: 높은 산
  alternatives_korean:
  - 고지대의 산
  - 높은 산 위로
  lexicon: BDAG
  rationale: 산의 높이를 직접적으로 표현하는 기본어를 사용해 원문의 장면성과 이동 방향을 그대로 살렸습니다.
theological_decisions:
- issue: 예수의 움직임을 나타내는 서술 시제
  chosen_reading: 과거 서술형으로 자연스럽게 옮기되, 진행감은 동사 선택으로 유지했습니다.
  alternative_readings:
  - ‘예수께서 데리고 올라가십니다’처럼 현재형으로 살리는 방법
  - 단순과거로만 평평하게 옮기는 방법
  rationale: 헬라어 현재형 서술의 생동감은 한국어에서 부자연스러운 역사적 현재보다, ‘데리고’와 ‘올라가셨습니다’의 조합으로 충분히 전달할 수 있습니다.
  doctrine_reference: 번역 원칙 §1, §6
