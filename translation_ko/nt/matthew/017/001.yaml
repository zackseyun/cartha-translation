    text: ‘데리고’는 ‘데려가시고’ 또는 ‘함께 데리고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘따로’는 ‘사적으로’ 또는 ‘다른 이들과 떨어져’로도 옮길 수 있습니다.
