  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 원문의 반복된 πολλάκις(‘자주’)를 한국어에서도 두 번 명시하는 것이 좋으며, υἱός(‘아들’)의 지시 대상은 ‘아이’보다 ‘제 아들’로 유지하는 편이 더 정확합니다.
  naturalness: 합쇼체와 간청의 어조는 자연스럽습니다. ‘자주 불 속에 떨어지고, 자주 물 속에 떨어집니다’는 반복을 살리면서도 현대 한국어로 매끄럽습니다.
  terminology: ‘주님’, ‘불쌍히 여겨 주십시오’, ‘경련을 일으키며’, ‘몹시 고통받습니다’는 적절합니다. 각주에서 ‘달에 씌인’은 빙의적 뉘앙스를 불필요하게 낳을 수 있으므로, 고대 관용의 문자적 달-관련성을 더 중립적으로 설명해야 합니다.
