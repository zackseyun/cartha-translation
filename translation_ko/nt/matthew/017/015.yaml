id: MAT.17.15
reference: Matthew 17:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
  footnotes:
  - marker: a
    text: Or 'is epileptic'; literally, 'is moonstruck.' The Greek term reflects ancient idiom for a seizure-like condition.
    reason: lexical_alternative
translation:
  language: ko
  text: “주님, 제 아들을 불쌍히 여겨 주십시오. 제 아들이 경련을 일으키며[a] 몹시 고통받습니다. 자주 불 속에 떨어지고, 자주 물 속에 떨어집니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘달의 영향을 받는다’는 뜻의 옛 표현입니다. 고대에는 발작성 질환을 가리키는 관용구로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인님
  - 선생님
  lexicon: SBLGNT / BDAG
  rationale: 예수께 드리는 호격으로서 κύριε는 존칭 호칭인 '주님'이 자연스럽고, 본문의 경외와 간청의 톤을 가장 잘 살립니다.
- source_word: ἐλέησόν
  english_pob_choice: have mercy on
  chosen_korean: 불쌍히 여겨 주십시오
  alternatives_korean:
  - 자비를 베풀어 주십시오
  - 은혜를 베풀어 주십시오
  lexicon: BDAG
  rationale: 구체적 도움을 구하는 간청으로서 '불쌍히 여겨 주십시오'는 현대 한국어에서 절박한 긍휼 요청을 분명하게 전달합니다.
- source_word: υἱόν
  english_pob_choice: my son
  chosen_korean: 제 아들
  alternatives_korean:
  - 제 아이
  - 제 자식
  lexicon: BDAG
  rationale: υἱός는 '아들'을 뜻하므로, 보호자의 호소를 자연스럽게 살려 '제 아들'로 옮겼습니다.
- source_word: σεληνιάζεται
  english_pob_choice: is epileptic / has seizures
  chosen_korean: 경련을 일으키고
  alternatives_korean:
  - 간질을 앓고
  - 달에 영향을 받는 것처럼
  lexicon: BDAG
  rationale: 직역적·의학적 진단어보다, 본문의 관찰 가능한 증상을 드러내는 표현으로 옮겨 고대 관용구가 가리키는 발작성 상태를 현대 한국어로 전달했습니다.
- source_word: κακῶς πάσχει
  english_pob_choice: suffers terribly
  chosen_korean: 몹시 고통받습니다
  alternatives_korean:
  - 심하게 고통받습니다
  - 끔찍하게 고통받습니다
  lexicon: BDAG
  rationale: κακῶς가 πάσχει를 강하게 수식하므로, 고통의 심각성을 자연스럽게 드러내는 '몹시 고통받습니다'가 적절합니다.
- source_word: πολλάκις… πολλάκις
  english_pob_choice: often… often
  chosen_korean: 자주… 자주
  alternatives_korean:
  - 종종… 종종
  - 여러 번… 여러 번
  lexicon: BDAG
  rationale: 반복성을 나타내는 대조적 병행을 살리기 위해 동일한 부사구를 반복해 옮겼습니다.
theological_decisions:
- issue: σεληνιάζεται의 번역이 질병 진단인지 관용적 묘사인지
  chosen_reading: 현대 의학명으로 단정하지 않고, 발작성 증상의 묘사로 번역했습니다.
  alternative_readings:
  - 간질을 앓고
  - 달에 씌인 것처럼
  rationale: 이 말은 아버지의 증언을 전하는 것으로, 본문 자체가 질병의 원인이나 정확한 진단을 규정하지 않습니다. 따라서 문자적 고대 관용과 현대 독자의 가독성 사이에서 증상 중심 표현을 택했습니다.
  doctrine_reference: 원문 우선과 과도한 해석 자제
