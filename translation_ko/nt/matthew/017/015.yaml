  - severity: low
    issue: υἱός의 ‘아들’이 뒤 문장에서 ‘아이’로 바뀜
    rationale: ‘아이’가 의미상 틀린 것은 아니지만, 원문이 특정한 성별 관계를 명시하므로 ‘제 아들’을 유지하는 편이 더 충실합니다.
  - severity: medium
    issue: 각주의 ‘달에 씌인’ 표현
    rationale: σεληνιάζεται의 어원적 달-관련 관용을 설명하려는 의도는 타당하나, ‘씌이다’는 한국어에서 빙의나 초자연적 지배를 암시할 수 있습니다. 본문이 단정하지 않는 원인을 덧붙이지 않도록 중립적으로 고쳐야 합니다.
