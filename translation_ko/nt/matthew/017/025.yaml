id: MAT.17.25
reference: Matthew 17:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
  footnotes:
  - marker: a
    text: Or “customs or tribute.” The Greek distinguishes τέλη (duties/customs) from κῆνσος (poll tax, tribute tax).
    reason: lexical_alternative
  - marker: b
    text: Or “from strangers.” The Greek ἀλλοτρίων refers to those who are not one's own family, that is, outsiders.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 대답했습니다. 「예.」 그가 집에 들어갔을 때, 예수께서 그에게 먼저 말씀하셨습니다. 「시몬아, 어떻게 생각하십니까? 세상의 왕들이 관세나 인두세[a]를 누구에게서 거둡니까? 자기 아들들에게서입니까, 아니면 다른 사람들에게서[b]입니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「세금이나 공물」. 그리스어는 τέλη(관세·간접세)와 κῆνσος(인두세·공물)를 구별합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「낯선 이들에게서」. 그리스어 ἀλλοτρίων은 자기 가족에 속하지 않는 외부 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  english_pob_choice: 'Yes'
  chosen_korean: 예
  alternatives_korean:
  - 네
  - 그렇습니다
  lexicon: BDAG
  rationale: 짧은 긍정 응답이므로 현대 한국어의 자연스러운 「예」가 가장 सीधे합니다.
- source_word: προέφθασεν αὐτὸν
  english_pob_choice: spoke to him first
  chosen_korean: 먼저 그에게 말씀하셨습니다
  alternatives_korean:
  - 그에게 먼저 말씀하셨습니다
  - 그보다 먼저 말씀하셨습니다
  lexicon: BDAG
  rationale: 예수께서 베드로의 응답보다 먼저 주도권을 잡으셨다는 점을 자연스럽게 살리되, 어색한 직역을 피했습니다.
- source_word: τέλη
  english_pob_choice: duties
  chosen_korean: 세금
  alternatives_korean:
  - 관세
  - 부과세
  - 통행세
  lexicon: BDAG
  rationale: τέλη는 여러 형태의 간접세를 가리키므로, 한국어로는 넓게 「세금」으로 옮기되 다음 항목과 구별됩니다.
- source_word: κῆνσον
  english_pob_choice: poll tax
  chosen_korean: 인두세
  alternatives_korean:
  - 공물
  - 호구세
  - 세금
  lexicon: BDAG
  rationale: κῆνσος의 특정 세목을 드러내기 위해 「인두세」를 택해 τέλη와의 구별을 보존했습니다.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  english_pob_choice: from others
  chosen_korean: 남들에게서
  alternatives_korean:
  - 낯선 이들에게서
  - 외인들에게서
  - 다른 사람들에게서
  lexicon: BDAG
  rationale: 문맥상 자기 아들들과 대비되는 ‘자기 소속이 아닌 사람들’을 뜻하므로, 간결하고 자연스러운 「남들」로 옮겼습니다.
theological_decisions:
- issue: 아들들(υἱῶν)이라는 가족 비유를 약화할지 여부
  chosen_reading: 「자기 아들들에게서냐」로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 자기 자녀들에게서냐
  - 자기 신하들에게서냐
  rationale: 예수의 논지는 통치자의 가족이 세금에서 면제되는 통상적 비유에 기반하므로, 아들들라는 성별·가족 언어를 유지해야 다음 절의 신학적 함의를 보존할 수 있습니다.
  doctrine_reference: Translation philosophy §§3-4
