id: MAT.17.20
reference: Matthew 17:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
  footnotes:
  - marker: a
    text: Or “Because of your lack of faith”; the Greek term more specifically suggests deficient or small faith rather than complete unbelief.
    reason: lexical_alternative
  - marker: b
    text: Greek “if you have faith as a mustard seed.” The comparison is to something very small.
    reason: lexical_alternative
  - marker: c
    text: Or 'But he says to them'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 그들에게 말씀하십니다. 「너희의 작은 믿음 때문입니다. 진실로 너희에게 말합니다. 만일 너희에게 겨자씨 한 알만 한 믿음이 있으면, 이 산더러 ‘여기서 저기로 옮겨 가라’ 하고 말할 것이며, 그러면 그것이 옮겨 갈 것이고, 너희에게는 아무것도 불가능하지 않을 것입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희의 믿음 없음 때문입니다.”; 그러나 헬라어는 완전한 불신보다 결핍되거나 작은 믿음을 더 구체적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 헬라어는 “겨자씨 같은 믿음”입니다. 비교점은 매우 작은 크기입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그가 그들에게 말씀하십니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: λέγει
  english_pob_choice: he says
  chosen_korean: 말씀하십니다
  alternatives_korean:
  - 말합니다
  - 이르십니다
  lexicon: SBLGNT
  rationale: 마태복음의 현재형 역사적 서술을 살리면서 예수의 직접 발화를 자연스럽게 드러내기 위해 현재형 공손체를 사용했습니다.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  english_pob_choice: Because of your little faith
  chosen_korean: 너희의 작은 믿음 때문입니다
  alternatives_korean:
  - 너희의 믿음 없음 때문입니다
  - 너희의 믿음 부족 때문입니다
  lexicon: BDAG
  rationale: ὀλιγοπιστία는 완전한 불신보다 믿음의 작음·부족함을 가리키므로, POB의 ‘little faith’에 맞춰 ‘작은 믿음’으로 옮겼습니다.
- source_word: ὡς κόκκον σινάπεως
  english_pob_choice: like a mustard seed
  chosen_korean: 겨자씨 한 알만 한
  alternatives_korean:
  - 겨자씨 같은
  - 겨자씨 크기의
  lexicon: BDAG
  rationale: 비교 대상이 매우 작은 크기임을 드러내기 위해 자연스러운 한국어 관용에 맞춰 ‘겨자씨 한 알만 한’으로 풀었습니다.
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  english_pob_choice: nothing will be impossible for you
  chosen_korean: 너희에게는 아무것도 불가능하지 않을 것입니다
  alternatives_korean:
  - 너희에게는 아무것도 불가능할 것입니다
  - 너희에게 불가능한 것은 아무것도 없을 것입니다
  lexicon: BDAG
  rationale: 무엇이든 불가능해지지 않는다는 뜻을 분명히 하되, 한국어에서 자연스럽게 읽히도록 이중부정을 사용했습니다.
theological_decisions:
- issue: ὀλιγοπιστία의 의미 범위
  chosen_reading: ‘믿음 없음’보다 ‘작은 믿음’으로 읽어, 제자들의 신뢰 부족을 지적하는 표현으로 옮겼습니다.
  alternative_readings:
  - 완전한 불신
  - 믿음 부족
  rationale: 본문과 POB 주석이 ὀλιγοπιστία를 완전한 불신이 아니라 결핍된 믿음으로 설명하므로, 그 긴장을 보존하는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: ὀλιγοπιστία/πίστις'
