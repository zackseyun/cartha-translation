  lexicon: SBLGNT
  rationale: 마태복음의 현재형 역사적 서술을 살리면서 예수의 직접 발화를 자연스럽게 드러내기 위해 현재형 공손체를 사용했습니다.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  english_pob_choice: Because of your little faith
  chosen_korean: 너희의 작은 믿음 때문입니다
  alternatives_korean:
