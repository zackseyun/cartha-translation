  lexicon: BDAG
  rationale: ὀλιγοπιστία는 완전한 불신보다 믿음의 작음·부족함을 가리키므로, POB의 ‘little faith’에 맞춰 ‘작은 믿음’으로 옮겼습니다.
- source_word: ὡς κόκκον σινάπεως
  english_pob_choice: like a mustard seed
  chosen_korean: 겨자씨 한 알만 한
  alternatives_korean:
  - 겨자씨 같은
  - 겨자씨 크기의
  lexicon: BDAG
  rationale: 비교 대상이 매우 작은 크기임을 드러내기 위해 자연스러운 한국어 관용에 맞춰 ‘겨자씨 한 알만 한’으로 풀었습니다.
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  english_pob_choice: nothing will be impossible for you
  chosen_korean: 너희에게는 아무것도 불가능하지 않을 것입니다
  alternatives_korean:
  - 너희에게는 아무것도 불가능할 것입니다
  - 너희에게 불가능한 것은 아무것도 없을 것입니다
  lexicon: BDAG
  rationale: 무엇이든 불가능해지지 않는다는 뜻을 분명히 하되, 한국어에서 자연스럽게 읽히도록 이중부정을 사용했습니다.
theological_decisions:
- issue: ὀλιγοπιστία의 의미 범위
  chosen_reading: ‘믿음 없음’보다 ‘작은 믿음’으로 읽어, 제자들의 신뢰 부족을 지적하는 표현으로 옮겼습니다.
  alternative_readings:
  - 완전한 불신
  - 믿음 부족
  rationale: 본문과 POB 주석이 ὀλιγοπιστία를 완전한 불신이 아니라 결핍된 믿음으로 설명하므로, 그 긴장을 보존하는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: ὀλιγοπιστία/πίστις'
