id: MAT.17.16
reference: Matthew 17:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
  footnotes:
  - marker: a
    text: Or 'they could not heal him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그를 당신의 제자들에게 데려갔으나, 그들은 그를 고치지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 그를 고칠 수 없었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήνεγκα
  english_pob_choice: brought
  chosen_korean: 데려갔으나
  alternatives_korean:
  - 데려왔으나
  - 가져갔으나
  lexicon: BDAG
  rationale: 사람을 다른 이들에게 데려가는 뜻이므로, 자연스러운 현대 한국어로는 ‘데려가다’가 가장 직접적입니다. 문맥상 화자의 시점에서는 ‘데려갔으나’가 무난합니다.
- source_word: μαθηταῖς σου
  english_pob_choice: your disciples
  chosen_korean: 당신의 제자들에게
  alternatives_korean:
  - 당신의 추종자들에게
  - 당신의 학생들에게
  lexicon: BDAG
  rationale: μαθητής는 복음서에서 예수의 공적 제자를 가리키므로 ‘제자들’이 가장 분명합니다. 합쇼체 대화 문맥을 살려 ‘당신의’로 옮겼습니다.
- source_word: ἠδυνήθησαν
  english_pob_choice: were not able
  chosen_korean: 못했습니다
  alternatives_korean:
  - 할 수 없었습니다
  - 능하지 못했습니다
  lexicon: BDAG
  rationale: 능력 부재를 나타내는 동사지만, 한국어에서는 ‘못했습니다’가 가장 자연스럽고 간결합니다. 과도한 설명 없이 단순한 무능을 드러냅니다.
- source_word: θεραπεῦσαι
  english_pob_choice: to heal
  chosen_korean: 고치지
  alternatives_korean:
  - 치유하지
  - 낫게 하지
  lexicon: BDAG
  rationale: 치료·치유의 일반 동사이지만, 병든 자를 회복시키는 의미를 담아 복음서 문맥에서 자연스러운 ‘고치다’를 택했습니다. 전통적 교회어보다 직접적입니다.
theological_decisions:
- issue: 제자들의 실패에 대한 해석 범위
  chosen_reading: 이 절 자체는 단지 제자들이 그를 고치지 못했다고만 말하고, 실패 원인(믿음 부족, 귀신 축출 실패 등)은 덧붙이지 않았습니다.
  alternative_readings:
  - 그들이 귀신을 쫓아내지 못했다고 명시하기
  - 믿음이 없어서 실패했다고 해석하기
  rationale: 원문은 θεραπεῦσαι(고치다)만 말하므로, 주변 문맥의 설명을 이 절에 끌어오지 않는 것이 소스에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
