    text: 또는 ‘그들은 그를 고치지 못했습니다.’
    reason: lexical_alternative
  revision_rationale: 원문의 두 καί가 나타내는 단순한 연결을 ‘-고’로 보존하고, 능력의 부정을 ‘고칠 수 없었습니다’로 명시했습니다. 또한 직접 호칭 상황에 맞게 ‘당신의’를 자연스러운 존칭 표현인 ‘주님의’로 조정했습니다. 각주 표지는 유지하되, 한국어에서 자연스러운 대체 표현을 제시했습니다.
