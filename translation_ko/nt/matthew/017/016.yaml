revisions:
- from: 내가 그를 당신의 제자들에게 데려갔으나, 그들은 그를 고치지 못했습니다.[a]
  to: 제가 그를 주님의 제자들에게 데려왔고, 그들은 그를 고칠 수 없었습니다.[a]
  rationale: 원문의 두 καί가 나타내는 단순한 연결을 ‘-고’로 보존하고, 능력의 부정을 ‘고칠 수 없었습니다’로 명시했습니다. 또한 직접 호칭 상황에 맞게 ‘당신의’를 자연스러운 존칭 표현인 ‘주님의’로 조정했습니다. 각주 표지는 유지하되, 한국어에서 자연스러운 대체 표현을 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:28Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘데려갔으나’는 προσήνεγκα의 ‘데려오다/데려가다’ 의미 자체는 가능한 범위이나, 뒤의 -으나가 원문의 단순 접속 καὶ ... καὶ에 없는 역접을 부가합니다. 또한 ἠδυνήθησαν은 ‘할 수 없었다’라는 능력·가능의 진술이므로 ‘고칠 수 없었습니다’가 이를 더 직접적으로 드러냅니다.
  naturalness: ‘당신의 제자들’은 현대 한국어의 예수께 드리는 공손한 발화로는 다소 부자연스럽거나 거리감 있게 들립니다. 이 문맥에서 이미 호칭된 κύριε를 반영한 ‘주님의 제자들’이 합쇼체의 공손한 대화에 자연스럽습니다. ‘데려왔고, 그들은’은 원문의 연결을 자연스럽게 보존합니다.
  terminology: μαθηταί는 ‘제자들’, θεραπεύω는 여기서 ‘고치다’로 옮기는 것이 적절합니다. ‘주님’은 본절의 σου를 문맥상 자연스러운 한국어 존칭으로 표현한 것이며, 제자들의 실패 원인이나 귀신 축출에 관한 설명은 추가하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘데려갔으나’의 역접 연결
    rationale: 원문은 καὶ ... καὶ로 아버지의 행동과 제자들의 무능을 단순히 이어 말합니다. ‘-으나’는 명시되지 않은 대조·양보 관계를 부가하므로 ‘-고’로 고칩니다.
  - severity: low
    issue: ‘당신의 제자들’의 공손한 한국어 대화문 부자연스러움
    rationale: 예수께 직접 말하는 문맥에서 ‘당신’은 표준 현대 한국어의 존칭으로 어색할 수 있습니다. 문맥의 호칭을 따라 ‘주님의 제자들’로 옮깁니다.
  - severity: low
    issue: ‘못했습니다’가 능력 진술을 다소 축약함
    rationale: 문맥상 뜻은 통하지만, ἠδυνήθησαν의 능력·가능 의미를 ‘고칠 수 없었습니다’가 더 명시적으로 보존합니다.
  revised_text: 제가 그를 주님의 제자들에게 데려왔고, 그들은 그를 고칠 수 없었습니다.[a]
  revised_footnotes:
