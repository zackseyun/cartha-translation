id: MAT.17.9
reference: Matthew 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
  footnotes:
  - marker: a
    text: Or, more literally, “from among the dead.”
    reason: lexical_alternative
  - marker: b
    text: Or “what you saw.” The Greek says “the vision.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 산에서 내려오고 있을 때에 예수께서 그들에게 명령하시며 말씀하셨습니다. “인자가 죽은 자들 가운데서 일어날 때까지는 이 환상을 아무에게도 말하지 마십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “죽은 자들 가운데서(among the dead)”입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “환상”입니다. 영어 POB는 “what you saw”라는 대안 번역을 덧붙였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν
  english_pob_choice: as they were coming down
  chosen_korean: 그들이 산에서 내려오고 있을 때에
  alternatives_korean:
  - 그들이 산에서 내려올 때에
  - 그들이 산에서 내려오는 동안
  lexicon: BDAG
  rationale: 현재 분사와 속격 절대구의 동시 진행을 자연스러운 한국어로 살리기 위해 ‘내려오고 있을 때에’로 옮겼습니다.
- source_word: ἐκ τοῦ ὄρους
  english_pob_choice: from the mountain
  chosen_korean: 산에서
  alternatives_korean:
  - 그 산에서
  - 산으로부터
  lexicon: BDAG
  rationale: 관사 있는 συγκεκριμένο 산을 가리키지만, 한국어에서는 ‘산에서’가 가장 자연스럽고 문맥상 충분히 구체적입니다.
- source_word: τὸ ὅραμα
  english_pob_choice: the vision
  chosen_korean: 이 환상
  alternatives_korean:
  - 이 이상
  - 이 광경
  - 그들이 본 것을
  lexicon: BDAG
  rationale: ὅραμα의 묵시적·계시적 뉘앙스를 살리되, 영어 POB의 ‘the vision’을 따라 ‘환상’으로 번역했습니다. 문맥상 이미 본 내용이므로 지시어 ‘이’를 보탰습니다.
- source_word: ἐκ νεκρῶν
  english_pob_choice: from the dead
  chosen_korean: 죽은 자들 가운데서
  alternatives_korean:
  - 죽은 자들로부터
  - 죽은 자들 중에서
  lexicon: BDAG
  rationale: 부활 표현의 관용구를 한국어로 자연스럽게 옮기기 위해 ‘가운데서’로 표현했습니다. 이로써 영어 POB 각주가 지적한 ‘among/from among the dead’의 문자적 여지를 반영합니다.
- source_word: ἐγερθῇ
  english_pob_choice: is raised
  chosen_korean: 일어날 때까지는
  alternatives_korean:
  - 일으켜질 때까지는
  - 다시 살아나실 때까지는
  lexicon: BDAG
  rationale: 수동형을 기본으로 하면서도 한국어에서는 ‘일어나다’가 부활 맥락을 가장 간명하게 드러냅니다. 다만 문장 흐름상 완료 시점보다 ‘때까지는’ 구조가 금지의 종결점을 분명히 합니다.
theological_decisions:
- issue: 부활 수동형의 처리
  chosen_reading: “인자가 죽은 자들 가운데서 일어날 때까지는”
  alternative_readings:
  - “인자가 죽은 자들 가운데서 일으켜질 때까지는”
  - “인자가 죽은 자들 가운데서 다시 살아날 때까지는”
  rationale: 그리스어의 수동형 ἐγερθῇ를 완전히 능동화하지 않기 위해 ‘일어나다’를 사용했습니다. 이는 본문이 말하는 부활 사건의 신적 작용을 지나치게 명시하지 않으면서도 의미를 자연스럽게 전달합니다.
  doctrine_reference: 보존된 수동형과 부활의 신적 주도성
- issue: 예수의 명령문 어조
  chosen_reading: “...말하지 마십시오”
  alternative_readings:
  - “...말하지 마세요”
  - “...말하지 말라”
  rationale: 예수의 직접 명령을 현대 표준어의 공손한 명령형으로 옮겨, 합쇼체 서술과 직접 화법의 존댓말을 일관되게 유지했습니다.
  doctrine_reference: 직접 화법에서의 존칭 유지
