  source_fidelity: ‘아무도 보이지 않았습니다’는 자연스럽지만, 원문의 능동 동사 εἶδον(‘그들이 보았다’)을 비인칭적·수동적 표현으로 바꿉니다. 또한 ‘예수님 외에는’은 배타성을 나타내지만 εἰ μὴ와 μόνον으로 거듭 강조된 유일성을 ‘한 분’으로 더 분명히 드러내는 것이 좋습니다.
