  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
  footnotes:
  - marker: a
    text: Or, 'except Jesus alone.' The Greek uses both an emphatic pronoun ('himself') and 'alone' for strong exclusivity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 눈을 들어보니, 예수님 외에는 아무도 보이지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘보이지 않았다’는 뜻을 분명히 하며, εἰ μὴ와 μόνον이 배타성을 함께 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν
  english_pob_choice: And lifting up their eyes
  chosen_korean: 그들이 눈을 들어보니
  alternatives_korean:
  - 그리고 그들이 눈을 들자
  - 눈을 들어올린 그들이
  lexicon: BDAG
  rationale: 분사구문을 한국어 서술 흐름에 맞게 자연스럽게 풀되, 본문이 보여 주는 행동의 선후 관계는 유지했습니다.
- source_word: οὐδένα εἶδον
  english_pob_choice: they saw no one
  chosen_korean: 아무도 보이지 않았습니다
  alternatives_korean:
  - 아무도 보지 못했습니다
  - 그들은 아무도 보지 않았습니다
  lexicon: BDAG
  rationale: 직역적 어순보다 한국어에서 더 자연스러운 ‘보이지 않았다’로 옮겨 부정의 결과를 분명하게 드러냈습니다.
- source_word: εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον
  english_pob_choice: except Jesus alone
  chosen_korean: 예수님 외에는
  alternatives_korean:
  - 예수님만
  - 예수님 외에는 오직 그분뿐이었습니다
  lexicon: BDAG
  rationale: εἰ μὴ와 μόνον의 배타성을 한국어의 ‘외에는’으로 간결하게 살렸고, 본문이 요구하는 유일성은 뒤의 문맥으로 충분히 드러납니다.
theological_decisions:
- issue: 예수님만 남는 장면의 배타적 강조
  chosen_reading: ‘예수님 외에는’으로 배타성을 유지하되 과도한 강조구를 덧붙이지 않았습니다.
  alternative_readings:
  - 예수님만 보였습니다
  - 예수님 외에는 아무도 없었습니다
  rationale: 본문의 핵심은 변모 현상에서 다른 이들이 사라지고 예수님만 보이게 되는 장면입니다. 그 배타성은 유지하되, 본문이 말하지 않는 설명적 확장은 피했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 허용하는 강조는 보존하되 신학적 해석을 과잉 주입하지 않음.
