id: MAT.17.19
reference: Matthew 17:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
  footnotes:
  - marker: a
    text: Or “him,” if the pronoun is taken to refer to the boy rather than the demon.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 제자들이 예수님께 따로 다가와 말했습니다. “왜 우리는 그것을 쫓아내지 못했습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘그것’은 문맥상 귀신을 가리키는 것으로 읽는 것이 가장 자연스럽습니다. 다만 앞의 아이를 가리킨다고 볼 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그때에
  - 그 후에
  lexicon: BDAG
  rationale: 시간 순서를 나타내는 담화 표지로, 현대 한국어에서 자연스럽고 간결한 ‘그때’가 적절합니다.
- source_word: κατ’ ἰδίαν
  english_pob_choice: privately
  chosen_korean: 따로
  alternatives_korean:
  - 은밀히
  - 개인적으로
  lexicon: BDAG
  rationale: 사람들로부터 분리된 상태를 나타내며, 문맥상 ‘따로’가 ‘비공개로’라는 의미를 가장 자연스럽게 옮깁니다.
- source_word: οἱ μαθηταὶ
  english_pob_choice: the disciples
  chosen_korean: 제자들이
  alternatives_korean:
  - 문하생들이
  - 학생들이
  lexicon: BDAG
  rationale: 복음서 문맥에서 μαθηταί는 예수님의 ‘제자들’을 가리키므로 표준적인 교회 용어를 유지했습니다.
- source_word: ἐκβαλεῖν
  english_pob_choice: to cast out
  chosen_korean: 쫓아낼
  alternatives_korean:
  - 내쫓을
  - 몰아낼
  lexicon: BDAG
  rationale: 귀신 축출의 관용적 표현으로 ‘쫓아내다’가 한국어에서 가장 자연스럽고, exorcism의 힘을 잘 보존합니다.
theological_decisions:
- issue: αὐτό의 지시 대상
  chosen_reading: 직역상 중성 대명사를 반영해 ‘그것’으로 옮기되, 문맥상 귀신 축출을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - ‘그를’—아이를 가리키는 해석
  - 대상을 명시하지 않고 ‘이를’로 완화하는 해석
  rationale: 문맥상 제자들의 실패는 귀신을 내쫓지 못한 데 있으므로, 영어 POB의 선택처럼 중성적 대상인 귀신을 기본 의미로 살리는 것이 가장 투명합니다.
  doctrine_reference: 본문의 서술상 긴장을 유지하고, 대명사 지시의 해석 가능성을 과도하게 단정하지 않습니다.
