id: MAT.17.5
reference: Matthew 17:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
  footnotes:
  - marker: a
    text: Or 'hear him.' The Greek imperative can denote hearing with the sense of heeding.
    reason: lexical_alternative
  - marker: b
    text: The repeated 'behold' renders Greek ἰδού, an attention-directing marker that heightens the dramatic scene.
    reason: lexical_alternative
  - marker: c
    text: '''Overshadowed'' may echo biblical theophany language associated with God''s manifest presence.'
    reason: cross_reference
translation:
  language: ko
  text: 그가 아직 말하고 있을 때에, 보십시오[a], 밝은 구름이 그들을 덮었습니다. 보십시오[a], 구름에서[b] 음성이 들려와 말했습니다. 「이는 내가 기뻐하는 내 사랑하는 아들입니다. 그의 말을 들으십시오[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 두 번 반복된 ἰδού를 옮긴 것으로, 장면에 주의를 집중시키는 표지입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구름에서’는 ἐκ τῆς νεφέλης를 옮긴 것으로, 음성이 구름으로부터 들려왔음을 나타냅니다.
    reason: source_note
  - marker: c
    text: ‘그의 말을 들으십시오’는 단순히 소리를 듣는 것뿐 아니라 주의 깊게 듣고 받아들이라는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  english_pob_choice: While he was still speaking
  chosen_korean: 그가 아직 말하고 있을 때에
  alternatives_korean:
  - 그가 아직 말하는 중에
  - 그가 말하고 있는 동안에
  lexicon: SBLGNT
  rationale: 동시적 진행을 나타내는 속격 절을 자연스러운 현대 한국어로 옮기되, ‘아직’으로 중단 직전의 긴박함을 살렸습니다.
- source_word: ἰδοὺ
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오,
  lexicon: BDAG
  rationale: 주목을 끄는 담화 표지로서의 기능을 살리기 위해 생략하지 않고 두 번 모두 옮겼으며, 본문 서술과 조화되는 합쇼체로 처리했습니다.
- source_word: νεφέλη φωτεινή
  english_pob_choice: a bright cloud
  chosen_korean: 밝은 구름
  alternatives_korean:
  - 빛나는 구름
  - 환한 구름
  lexicon: BDAG
  rationale: ‘밝은/빛나는’의 기본 의미를 직역에 가깝게 반영하면서도, 구름의 시각적 인상을 간명하게 전달했습니다.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  english_pob_choice: a voice from the cloud said
  chosen_korean: 구름 속에서 음성이 들려와 말했습니다
  alternatives_korean:
  - 구름에서 음성이 나와 말했습니다
  - 구름으로부터 음성이 말했습니다
  lexicon: BDAG
  rationale: ‘from the cloud’는 한국어에서 자연스러운 ‘구름 속에서’로 옮겼고, 음성의 출현과 발화를 한 문장으로 매끄럽게 처리했습니다.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  english_pob_choice: my beloved Son
  chosen_korean: 내 사랑하는 아들입니다
  alternatives_korean:
  - 내 사랑하는 아들입니다
  - 내 사랑받는 아들입니다
  - 내 사랑하는 아들
  lexicon: BDAG
  rationale: ‘ἀγαπητός’의 친애/선택의 뉘앙스를 ‘사랑하는’으로 옮겨 자연스러운 한국어와 신학적 무게를 함께 유지했습니다.
- source_word: ἐν ᾧ εὐδόκησα
  english_pob_choice: with whom I am well pleased
  chosen_korean: 나는 그를 기뻐합니다
  alternatives_korean:
  - 나는 그 안에서 기뻐합니다
  - 그에게 나는 만족합니다
  lexicon: BDAG
  rationale: ‘εὐδόκησα’의 호의와 기쁨의 선언을 현대 한국어의 자연한 표현으로 옮기되, 도치된 관계절의 딱딱함은 피했습니다.
- source_word: ἀκούετε αὐτοῦ
  english_pob_choice: listen to him
  chosen_korean: 그의 말을 들으십시오
  alternatives_korean:
  - 그를 들으십시오
  - 그에게 귀를 기울이십시오
  lexicon: BDAG
  rationale: 단순 청각보다 순종적 경청을 포함하는 명령으로 이해해, 한국어에서 가장 자연스럽고 의미가 분명한 표현을 선택했습니다.
theological_decisions:
- issue: 성자의 정체를 선포하는 음성의 직접 인용
  chosen_reading: 이는 내 사랑하는 아들입니다. 나는 그를 기뻐합니다.
  alternative_readings:
  - 이는 내 아들, 사랑받는 이입니다. 나는 그를 기뻐합니다.
  - 이는 내 사랑하는 아들입니다. 그 안에서 내가 기뻐합니다.
  rationale: 본문의 핵심은 예수의 아들 됨과 하나님의 호의 선언이므로, 이를 한국어로 분명하게 드러내되 본문 밖의 설명을 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: ἀκούετε αὐτοῦ의 명령 강도
  chosen_reading: 그의 말을 들으십시오
  alternative_readings:
  - 그를 들으십시오
  - 그에게 순종하십시오
  rationale: 명령은 단순 청취가 아니라 주의를 기울여 받아들이라는 뜻이어서, 한국어에서는 ‘말을 들으십시오’가 그 힘을 가장 자연스럽게 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
