  source_fidelity: ἀκούσαντες를 「그것을 듣고」로 시간적 선행 관계를 살려 옮겼고, 문맥상 보충한 「그것」도 앞 절의 음성을 자연스럽게 가리킵니다. 「얼굴을 땅에 대고 엎드려」는 ἔπεσαν ἐπὶ πρόσωπον αὐτῶν의 몸을 낮추는 자세를 충실히 전달하며, 「몹시 두려워했습니다」는 ἐφοβήθησαν σφόδρα의 강한 두려움을 보존합니다. 예배나 공포 가운데 어느 하나로 해석을 덧붙이지 않았습니다.
