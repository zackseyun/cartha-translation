source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
  footnotes:
  - marker: a
    text: Or 'having heard'; the Greek uses an aorist participle that can be rendered temporally ('when they heard') or more formally ('having heard').
    reason: lexical_alternative
  - marker: b
    text: Literally 'fell on their face'; in English with a plural subject, 'fell on their faces' is the natural idiom.
    reason: lexical_alternative
  - marker: c
    text: That is, they were intensely afraid; 'greatly' translates the adverb σφόδρα.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제자들이 그것을 듣고 얼굴을 땅에 대고 엎드려 몹시 두려워했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 앞선 하늘의 음성을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 헬라어는 단수형 πρόσωπον을 쓰지만, 복수 주어에서는 한국어로 「얼굴들」보다 「얼굴을」/「얼굴에」가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: σφόδρα는 두려움의 강도를 높이는 부사로, 「몹시」가 현대 한국어에서 가장 자연스럽게 그 뉘앙스를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  english_pob_choice: when ... heard it
  chosen_korean: 그것을 듣고
  alternatives_korean:
  - 들었을 때
  - 들은 뒤에
  lexicon: BDAG
  rationale: aorist 분사로서 앞뒤 관계를 시간적으로 풀 수 있어, 한국어에서는 자연스러운 부사절/연결형인 「그것을 듣고」로 옮겼습니다.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  english_pob_choice: fell on their faces
  chosen_korean: 얼굴을 땅에 대고 엎드려
  alternatives_korean:
  - 그들의 얼굴에 엎드려
  - 얼굴을 바닥에 대고 쓰러져
  lexicon: BDAG
  rationale: 직역 가능한 관용구지만 한국어에서는 신체적 자세와 경외/두려움의 반응을 드러내는 「얼굴을 땅에 대고 엎드려」가 가장 자연스럽습니다.
- source_word: ἐφοβήθησαν σφόδρα
  english_pob_choice: were greatly afraid
  chosen_korean: 몹시 두려워했습니다
  alternatives_korean:
  - 심히 두려워했습니다
  - 지극히 두려워했습니다
  lexicon: BDAG
  rationale: σφόδρα의 강도는 「몹시」로 간결하게 살리고, φοβέομαι는 현대 한국어에서 과장 없이 상태를 나타내는 「두려워했습니다」로 옮겼습니다.
theological_decisions:
- issue: 제자들의 반응의 성격
  chosen_reading: 본문이 말하는 것은 몸을 엎드린 자세와 강한 두려움이며, 이를 예배인지 공포인지로 단정하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 예배적 경외로 이해할 수 있습니다.
  - 신적 현현 앞의 공포로 이해할 수 있습니다.
  rationale: 헬라어는 자세와 감정만 보고하므로, 번역에서 신학적 해석을 덧붙여 긴장을 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
