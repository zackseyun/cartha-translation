id: MAT.17.7
reference: Matthew 17:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
  footnotes:
  - marker: a
    text: Or “approached”; the Greek verb can mean “came to” or “approached.”
    reason: lexical_alternative
  - marker: b
    text: Or “Rise”; the command refers to getting up from their fallen position.
    reason: lexical_alternative
  - marker: c
    text: Or “do not fear.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 다가와 손을 대시며 말씀하셨습니다. 「일어나십시오. 그리고 두려워하지 마십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사의 뉘앙스는 “다가오다/다가서다”까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 명령은 쓰러진 자리에서 몸을 일으키라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “두려워하지 마십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν
  english_pob_choice: came near
  chosen_korean: 다가와
  alternatives_korean:
  - 가까이 오셔서
  - 다가오셔서
  lexicon: BDAG
  rationale: 접근 동작을 자연스럽게 살리면서도, 'came near'의 거리감과 움직임을 현대 한국어로 간결하게 전합니다.
- source_word: ἁψάμενος αὐτῶν
  english_pob_choice: touched them
  chosen_korean: 손을 대시며
  alternatives_korean:
  - 그들을 만지시며
  - 닿으시며
  lexicon: BDAG
  rationale: 문맥상 단순 접촉의 위로를 드러내면서도, 한국어에서 예수의 손길을 가장 자연스럽게 표현하는 방식입니다. '손을 얹으시며'는 원문보다 특정합니다.
- source_word: Ἐγέρθητε
  english_pob_choice: Get up
  chosen_korean: 일어나십시오
  alternatives_korean:
  - 일어나라
  - 어서 일어나십시오
  - 일어서십시오
  lexicon: BDAG
  rationale: 누워 있던 자세에서 일어남을 명령하는 뜻을 살리되, 합쇼체로 정중하게 옮겼습니다. '일어서십시오'는 자세를 지나치게 규정할 수 있습니다.
- source_word: μὴ φοβεῖσθε
  english_pob_choice: do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말십시오
  - 두려워하지 말라
  lexicon: BDAG
  rationale: φοβέομαι의 기본 뜻을 현대 표준어로 분명하게 옮겼습니다. '무서워하다'보다 '두려워하다'가 더 직접적입니다.
theological_decisions:
- issue: 예수의 위로 명령을 한국어 존댓말로 어떻게 재현할지
  chosen_reading: 예수의 직접 명령을 합쇼체로 옮겨, 권위와 위로를 함께 드러냈습니다.
  alternative_readings:
  - 평서형으로 완화하기
  - 반말형으로 직역하기
  rationale: 본문은 예수의 실제 발화이며, 한국어 독자에게는 합쇼체가 권위 있는 직접 화행을 가장 자연스럽게 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
