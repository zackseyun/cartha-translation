  to: 예수께서 그들에게 다가오셔서[a] 그들을 만지시고 말씀하셨습니다. “일어나십시오.[b] 두려워하지 마십시오.[c]”
  rationale: 원문이 단지 ‘만졌다’고 말하는 곳에 ‘손’을 보태지 않도록 수정했습니다. 또한 각주를 해당 어구에 연결하고, 중복된 c 각주를 실제 대안 표현으로 바꾸었습니다. 본문의 존대 및 합쇼체 문체는 유지했습니다.
