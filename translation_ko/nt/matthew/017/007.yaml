  - severity: low
    issue: 각주 표지가 모두 문장 끝에 몰려 있어 각주 대상이 불명확합니다.
    rationale: a, b, c는 각각 접근, 일어남, 두려워하지 않음에 관한 각주이므로 해당 표현 뒤에 배치하는 편이 각주 연결을 명료하게 합니다.
  - severity: low
    issue: 기존 c 각주는 본문과 동일한 표현을 대안으로 제시합니다.
    rationale: 실질적인 어휘 대안인 ‘무서워하지 마십시오’를 제시하면 각주의 기능이 분명해집니다.
