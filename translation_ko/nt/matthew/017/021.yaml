    rationale: 본문에 ‘ᵃ[a]’가 함께 표시되어 하나의 각주에 두 표지 체계가 중복 적용되었습니다. 등록된 각주 marker가 a이므로 본문 표지는 하나만 남겨야 합니다.
  revised_text: 그러나 이런 종류는 기도와 금식으로 하지 않고서는 나가지 않습니다.ᵃ
