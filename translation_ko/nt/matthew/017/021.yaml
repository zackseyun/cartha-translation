review_pass:
  verdict: revise
  source_fidelity: 그리스어의 대조(δὲ), 범주(τοῦτο τὸ γένος), 배제 표현(εἰ μὴ), 그리고 기도와 금식을 수단으로 나타내는 ἐν의 의미를 충실히 반영하도록 다듬었습니다.
  naturalness: ‘이 종류’는 사람이나 귀신의 범주를 가리킬 때 다소 부자연스러울 수 있고, ‘기도와 금식이 아니면’은 수단을 나타내는 원문 구조를 충분히 드러내지 못합니다. ‘이런 부류’ 및 ‘기도와 금식 외에는’이 현대 표준 한국어에서 더 자연스럽습니다.
  terminology: ‘기도’와 ‘금식’은 확립된 성서 용어로 유지했습니다. 원문이 명시하지 않는 ‘귀신’을 본문에 보충하지 않아, 지시 대상의 문맥상 함의는 유지하되 표현상 모호성도 보존했습니다.
  issues:
  - severity: medium
    issue: 각주 표지가 ‘ᵃ[a]’로 중복되어 있습니다.
    rationale: 본문 각주 표지는 하나만 있어야 하며, 중복 표기는 구조적으로 잘못되어 독자의 각주 연결을 혼란스럽게 합니다.
  - severity: low
    issue: ‘이 종류’와 ‘기도와 금식이 아니면’의 표현이 다소 어색하고 수단 의미가 약합니다.
    rationale: γένος는 이 문맥에서 존재들의 부류를 가리키므로 ‘이런 부류’가 더 자연스럽습니다. ἐν προσευχῇ καὶ νηστείᾳ는 ‘기도와 금식 외에는’으로 옮겨 기도와 금식이 요구되는 수단/조건임을 더 분명히 합니다.
  revised_text: 하지만 이런 부류는 기도와 금식 외에는 나가지 않습니다.ᵃ
  revised_footnotes:
  - marker: a
    text: 이 절은 가장 이른 그리스어 사본들(4세기의 시내 사본과 바티칸 사본 포함)과 초기 시리아어 및 콥트어 번역본들에는 없지만, 비잔틴 다수본문 전통과 라틴 전통, 그리고 대부분의 시리아어 증언에는 있습니다. 이 절은 마가복음 9:29와 조화시키기 위해 후대 필사자들이 덧붙였을 가능성이 큽니다.
