  text: But[a] this kind does not come out except by prayer and fasting.
  footnotes:
  - marker: a
    text: This verse is absent from the earliest Greek manuscripts (including the 4th-century Sinaiticus and Vaticanus) and early Syriac and Coptic translations, but is present in the Byzantine majority tradition, the Latin tradition, and most Syriac witnesses. It was likely added by later scribes to harmonize with Mark 9:29.
    reason: textual_critical
translation:
  language: ko
  text: 하지만 이 종류는 기도와 금식이 아니면 나가지 않습니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 가장 이른 그리스어 사본들(4세기 시내 사본과 바티칸 사본 포함)과 초기 시리아어·콥트어 번역본들에는 없지만, 비잔틴 다수본문 전통과 라틴 전통, 그리고 대부분의 시리아어 증언에는 있습니다. 아마도 마가복음 9:29와 맞추기 위해 뒤늦은 필사자들이 덧붙였을 가능성이 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο … τὸ γένος
  english_pob_choice: this kind
  chosen_korean: 이 종류
  alternatives_korean:
  - 이 부류
  - 이런 것
  - 이 악한 부류
  lexicon: BDAG
  rationale: γένος은 여기서 특정 귀신의 범주를 가리키므로, 의미를 과도하게 좁히지 않으면서도 POB의 'kind'에 대응하는 자연스러운 한국어로 '종류'를 택했습니다.
- source_word: οὐκ ἐκπορεύεται
  english_pob_choice: does not come out
  chosen_korean: 나가지 않습니다
  alternatives_korean:
  - 나오지 않습니다
  - 떠나지 않습니다
  - 쫓겨나지 않습니다
  lexicon: BDAG
  rationale: 귀신의 축출을 말하는 동사로, 한국어에서는 '나가다'가 가장 직접적이고 자연스럽게 이탈/축출의 움직임을 드러냅니다.
- source_word: εἰ μὴ
  english_pob_choice: except
  chosen_korean: 아니면
  alternatives_korean:
  - except
  - 외에는
  - 않고는
  lexicon: BDAG
  rationale: 부정문과 결합한 예외 구조를 한국어에서 매끄럽게 살리기 위해 'A 아니면 B'보다도 조건적 배제를 담는 '아니면'과 '-지 않습니다' 구문으로 옮겼습니다.
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  english_pob_choice: by prayer and fasting
  chosen_korean: 기도와 금식
  alternatives_korean:
  - 기도와 금식으로
  - 기도와 금식 가운데
  - 기도와 금식을 통해
  lexicon: BDAG
  rationale: '''ἐν''의 수단/방법 뉘앙스를 한국어에서는 관형적 도구 표현보다 간결한 명사구로 드러내어, 기도와 금식이 축출의 방식임을 자연스럽게 표현했습니다.'
theological_decisions:
- issue: 이 절의 본문 상태를 한국어 본문에서 어떻게 처리할지
  chosen_reading: 본문에 포함하되, 각주로 이 절의 후기 전승 가능성을 밝혔습니다.
  alternative_readings:
  - 본문에서 아예 제외
  - 괄호 처리만 하고 각주는 두지 않음
  rationale: 제공된 그리스어 본문과 비잔틴 전승을 따르되, 영어 POB의 비평 각주를 반영해 독자가 본문 비평 문제를 알 수 있도록 했습니다.
  doctrine_reference: textual_criticism
