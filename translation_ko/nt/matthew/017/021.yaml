  text: But[a] this kind does not come out except by prayer and fasting.
  footnotes:
  - marker: a
    text: This verse is absent from the earliest Greek manuscripts (including the 4th-century Sinaiticus and Vaticanus) and early Syriac and Coptic translations, but is present in the Byzantine majority tradition, the Latin tradition, and most Syriac witnesses. It was likely added by later scribes to harmonize with Mark 9:29.
    reason: textual_critical
translation:
  language: ko
  text: 하지만 이 종류는 기도와 금식이 아니면 나가지 않습니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 가장 이른 그리스어 사본들(4세기 시내 사본과 바티칸 사본 포함)과 초기 시리아어·콥트어 번역본들에는 없지만, 비잔틴 다수본문 전통과 라틴 전통, 그리고 대부분의 시리아어 증언에는 있습니다. 아마도 마가복음 9:29와 맞추기 위해 뒤늦은 필사자들이 덧붙였을 가능성이 있습니다.
    reason: textual_variant
