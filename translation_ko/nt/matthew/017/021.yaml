  source_fidelity: 그리스어의 대조(δὲ), ‘이 종류’(τοῦτο τὸ γένος), 배타 조건(εἰ μὴ), 그리고 기도와 금식의 수단적 의미(ἐν …)를 유지해야 합니다. 초안의 ‘기도와 금식이 아니면’은 조건의 대상과 수단의 관계가 다소 불명확합니다.
  naturalness: ‘이런 종류는 기도와 금식으로 하지 않고서는 나가지 않습니다’는 현대 표준어 합쇼체로 자연스럽고, 귀신 축출이라는 문맥에서 ‘나가지 않습니다’도 무리 없이 이해됩니다.
  terminology: ‘기도’, ‘금식’은 확립된 성서 용어입니다. γένος는 원문처럼 명시적으로 ‘귀신’을 보태지 않고 ‘이런 종류’로 옮겨 문맥적 지시와 원문의 표현 범위를 보존합니다.
  issues:
  - severity: medium
    issue: 수단·배타 구문의 불명확성
    rationale: ‘기도와 금식이 아니면’은 기도와 금식 자체가 조건의 주체처럼 들릴 수 있으며, ἐν προσευχῇ καὶ νηστείᾳ의 수단적 의미를 충분히 드러내지 못합니다. ‘기도와 금식으로 하지 않고서는’이 ‘오직 기도와 금식으로’라는 뜻을 자연스럽게 전달합니다.
  - severity: medium
