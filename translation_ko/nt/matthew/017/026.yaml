id: MAT.17.26
reference: Matthew 17:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
  footnotes:
  - marker: a
    text: Or “From foreigners” or “From others.” The Greek contrasts those outside the ruler’s household with his own sons.
    reason: lexical_alternative
  - marker: b
    text: Or “the sons are exempt.” The Greek more literally says “the sons are free,” which in context implies exemption from the tax.
    reason: lexical_alternative
  - marker: c
    text: Or “the children,” though the Greek specifically says “sons.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 「외인들에게서입니다」라고 하자 예수께서 그에게 말씀하셨습니다. 「그렇다면 아들들은 자유롭습니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “외국인들에게서” 혹은 “다른 이들에게서”. 그리스어는 통치자의 자기 집안 밖에 있는 사람들과 그의 아들들을 대조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “아들들은 면제됩니다”. 그리스어는 더 문자적으로는 “아들들은 자유롭습니다”라고 하며, 문맥상 세금 면제를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “자녀들”이지만, 그리스어는 구체적으로 “아들들”이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  english_pob_choice: When he said
  chosen_korean: 그가 …라고 하자
  alternatives_korean:
  - 그가 말하자
  - 그가 말했을 때
  lexicon: BDAG
  rationale: 분사구문을 한국어에서 자연스러운 시간 연결로 옮기되, 뒤의 예수 말씀으로 전환되는 흐름을 살리기 위해 「…라고 하자」를 택했습니다.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  english_pob_choice: From strangers
  chosen_korean: 외인들에게서
  alternatives_korean:
  - 낯선 이들에게서
  - 남의 사람들에게서
  - 외국인들에게서
  lexicon: BDAG
  rationale: 여기서는 세금의 대상이 되는 ‘자기 집안 밖의 사람들’과의 대조가 핵심이므로, 민족적 의미가 강한 「외국인」보다 관계적 거리감을 드러내는 「외인」이 더 적절합니다.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  english_pob_choice: Jesus said to him
  chosen_korean: 예수께서 그에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그에게 말씀하셨다
  - 예수께서 그에게 이르셨습니다
  lexicon: BDAG
  rationale: 서술체이므로 합쇼체로 처리했고, 예수의 직접 발화를 자연스럽게 이어 주는 표준적인 동사 「말씀하셨습니다」를 사용했습니다.
- source_word: οἱ υἱοί
  english_pob_choice: the sons
  chosen_korean: 아들들은
  alternatives_korean:
  - 자녀들은
  - 아들들이
  - 아들들은
  lexicon: BDAG
  rationale: 원문의 남성 복수 υἱοί를 성중립화하지 않고, 가문의 아들들을 가리키는 문맥을 살려 「아들들」로 옮겼습니다.
theological_decisions:
- issue: 예수의 결론문에서 ‘자유롭다’와 세금 면제 함의의 관계
  chosen_reading: 직접적으로는 ‘자유롭습니다’로 옮기되, 세금 면제라는 문맥적 함의는 본문이 아니라 독자가 파악하도록 둡니다.
  alternative_readings:
  - 세금이 면제됩니다
  - 의무에서 면제됩니다
  rationale: 원문은 문자적으로 ‘자유롭다’라고 말하며, 문맥상 세금 면제를 함축합니다. 본문 자체의 표현을 유지해야 원문의 폭을 보존할 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2 (Source-text priority)
