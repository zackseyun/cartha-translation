revisions:
- from: 그가 「외인들에게서입니다」라고 하자 예수께서 그에게 말씀하셨습니다. 「그렇다면 아들들은 자유롭습니다」.[a][b][c]
  to: 그가 「다른 사람들에게서입니다」라고 하자, 예수께서 그에게 말씀하셨습니다. 「그러므로 아들들은 자유롭습니다.」[a][b][c]
  rationale: 현대 표준어에서 자연스럽고 의미가 분명한 ‘다른 사람들’로 ἀλλότριοι의 관계적 대조를 옮겼습니다. ‘아들들’과 ‘자유롭습니다’는 원문의 성별 표지와 세금 면제 이상의 폭을 보존하므로 유지했습니다. 각주는 대안 번역과 문맥적 함의를 제공하되 본문을 과도하게 해석하지 않도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:23Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ἀλλότριοι는 문맥상 왕의 아들들과 대조되는 ‘자기 집안에 속하지 않는 사람들’이며, ‘외인’은 현대 한국어에서 다소 낯설고 ‘외국인’ 또는 배타적 외부인을 연상시킬 수 있습니다. 또한 ἄρα γε의 추론을 ‘그러므로’로 분명히 드러내는 것이 적절합니다.
  naturalness: 합쇼체는 일관되게 사용되었습니다. 다만 ‘외인들에게서입니다’는 현대 표준어 성경 문장으로 어색하고 지시 대상이 불명료하게 들릴 수 있습니다. ‘다른 사람들에게서입니다’가 자연스럽고 관계적 대조를 잘 보존합니다.
  terminology: ‘아들들’ 및 ‘자유롭습니다’는 각각 υἱοί와 ἐλεύθεροι를 정확히 보존합니다. ‘말씀하셨습니다’도 존대 서술에 적절합니다. 세금 문맥의 면제 함의는 각주로 처리하는 것이 바람직합니다.
  issues:
  - severity: medium
    issue: ‘외인들에게서’의 어휘 선택
    rationale: ‘외인’은 현대 표준 한국어에서 흔하지 않고, 외국인·낯선 사람·배제된 사람 등으로 의미가 흔들릴 수 있습니다. 원문의 핵심인 ‘왕의 집안/아들들이 아닌 다른 사람들’이라는 관계적 대조를 ‘다른 사람들에게서’로 명료하게 옮기는 편이 안전합니다.
  - severity: low
    issue: Ἄρα γε의 추론 표지 약화
    rationale: ‘그렇다면’도 가능하지만, 앞선 답변에서 결론을 이끄는 ἄρα γε의 추론을 ‘그러므로’가 더 직접적으로 나타냅니다.
  revised_text: 그가 「다른 사람들에게서입니다」라고 하자, 예수께서 그에게 말씀하셨습니다. 「그러므로 아들들은 자유롭습니다.」[a][b][c]
