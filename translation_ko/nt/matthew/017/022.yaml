source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
  footnotes:
  - marker: a
    text: Or, “were assembling together.”
    reason: lexical_alternative
  - marker: b
    text: Or, “is about to be handed over.”
    reason: alternative_reading
  - marker: c
    text: Greek “into the hands of men”; alternatively, “into the hands of people.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 갈릴리에서 함께 모여 있을 때 예수께서 그들에게 말씀하셨습니다. “인자는 사람들의 손에 넘겨질 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “함께 모이고 있었다”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “넘겨질 것입니다” 대신 “손에 넘겨질 것입니다”로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 “사람들의 손에”입니다. 문맥에 따라 “사람들” 또는 “인간들”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων δὲ αὐτῶν
  english_pob_choice: While they were gathering together
  chosen_korean: 그들이 갈릴리에서 함께 모여 있을 때
  alternatives_korean:
  - 그들이 갈릴리에서 모이고 있을 때
  - 그들이 갈릴리에서 함께하고 있을 때
  lexicon: BDAG
  rationale: 공동체적 동작을 나타내는 현재 분사 구문을 한국어의 시간 부사절로 자연스럽게 옮기되, ‘함께 모여’로 집합의 뉘앙스를 살렸습니다.
- source_word: ἐν τῇ Γαλιλαίᾳ
  english_pob_choice: in Galilee
  chosen_korean: 갈릴리에서
  alternatives_korean:
  - 갈릴리 안에서
  - 갈릴리 지역에서
  lexicon: BDAG
  rationale: 단순한 장소 표지이므로 ‘~에서’로 직역에 가깝게 옮겼습니다.
- source_word: παραδίδοσθαι
  english_pob_choice: be delivered
  chosen_korean: 넘겨질 것입니다
  alternatives_korean:
  - 전달될 것입니다
  - 내어줄 것입니다
  - 넘겨질 것입니다
  lexicon: BDAG
  rationale: 수동 의미를 살리면서도 한국어에서 자연스럽고, 고난 예고의 법정·배신적 함의를 너무 일찍 고정하지 않는 표현으로 옮겼습니다.
- source_word: εἰς χεῖρας ἀνθρώπων
  english_pob_choice: into the hands of men
  chosen_korean: 사람들의 손에
  alternatives_korean:
  - 인간들의 손에
  - 사람의 손에
  lexicon: BDAG
  rationale: 손이라는 비유를 유지해 원문 이미지를 보존했고, ἀνθρώπων은 문맥상 구체적인 인간 행위자들을 가리키므로 ‘사람들’로 옮겼습니다.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου의 번역
  chosen_reading: 인자
  alternative_readings:
  - 사람의 아들
  - 인간
  rationale: 복음서에서 예수의 자기호칭으로 굳어진 표현을 유지해, 원문이 지닌 성경적·신학적 연관성을 보존했습니다.
  doctrine_reference: Translation philosophy §§2, 3, 4
- issue: παραδίδοσθαι의 수동적·다의적 뉘앙스
  chosen_reading: 넘겨질 것입니다
  alternative_readings:
  - 내어줄 것입니다
  - 배반당할 것입니다
  - 손에 넘겨질 것입니다
  rationale: 여기서는 누가 어떻게 넘기는지 완전히 풀어 쓰지 않고, 수동형이 열어 두는 행위 주체와 신학적 층위를 그대로 남겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
