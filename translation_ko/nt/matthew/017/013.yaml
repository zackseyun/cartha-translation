  lexicon: BDAG
  rationale: 복음서에서 μαθηταί의 통상적 호칭을 반영해 ‘제자들’로 옮겼습니다.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  english_pob_choice: John the Baptist
  chosen_korean: 세례자 요한
  alternatives_korean:
  - 침례자 요한
  - 요한 세례자
  lexicon: BDAG
  rationale: βαπτιστής의 직함을 직역하면 ‘세례자’이며, 이는 본문이 가리키는 인물을 분명하게 드러냅니다. 관용적 교회어인 ‘침례자’보다 원문 직함을 더 직접적으로 반영합니다.
theological_decisions:
- issue: 예수의 발언 대상 식별
  chosen_reading: 이 구절은 제자들이 예수께서 엘리야에 대해 하신 말씀을 요한에게 관한 것으로 이해했음을 분명히 말합니다.
  alternative_readings:
  - 예수께서 단지 요한을 언급하셨다고 완화하는 읽기
  - 엘리야-요한의 관계를 해석적으로 풀어 쓰는 읽기
  rationale: 본문이 직접 밝히는 서술을 그대로 따라가며, 그 이상으로 해석을 확장하지 않았습니다.
  doctrine_reference: 문맥이 제공하는 동일시를 보존하고, 번역이 해석을 과도하게 덧붙이지 않도록 유지합니다.
