  - 이해했습니다
  - 알아차렸습니다
  lexicon: BDAG
  rationale: 단순한 인지보다 문맥상의 의미 파악과 연결되므로, 서사적 완결감을 주는 ‘깨달았습니다’가 적절합니다.
- source_word: οἱ μαθηταὶ
  english_pob_choice: the disciples
  chosen_korean: 제자들은
