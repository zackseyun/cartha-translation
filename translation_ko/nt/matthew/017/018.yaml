id: MAT.17.18
reference: Matthew 17:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
  footnotes:
  - marker: a
    text: Or, 'the child was healed from that moment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그를 꾸짖으시자, 귀신이 그에게서 나갔으며 그 아이는 그때부터 나았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를’은 문맥상 귀신을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπετίμησεν
  english_pob_choice: rebuked
  chosen_korean: 꾸짖으시자
  alternatives_korean:
  - 책망하시자
  - 꾸짖으셨고
  lexicon: BDAG
  rationale: ἐπιτιμάω는 권위 있는 책망·꾸짖음을 뜻하므로, 예수의 권위 있는 제압을 살리면서도 한국어에서 자연스러운 ‘꾸짖다’를 택했습니다.
- source_word: αὐτῷ
  english_pob_choice: it
  chosen_korean: 그를
  alternatives_korean:
  - 그것을
  - 그 아이를
  lexicon: BDAG
  rationale: 문맥상 예수께서 꾸짖으신 대상은 귀신이므로, 한국어에서는 인칭 대명사로 받아 자연스럽게 ‘그를’이라고 옮겼습니다. 이는 뒤의 ‘귀신이 그에게서 나갔으며’와도 잘 맞습니다.
- source_word: τὸ δαιμόνιον
  english_pob_choice: demon
  chosen_korean: 귀신
  alternatives_korean:
  - 악한 영
  - 악령
  lexicon: BDAG
  rationale: 이 절의 δαιμόνιον은 단순히 ‘귀신’으로 옮기는 것이 가장 직접적이며, 본문이 말하는 초자연적 존재를 과도하게 풀지 않습니다.
- source_word: ὁ παῖς
  english_pob_choice: the boy
  chosen_korean: 그 아이
  alternatives_korean:
  - 소년
  - 아이
  lexicon: BDAG
  rationale: παῖς는 문맥상 아들/아이를 가리키므로, 본문의 가족 상황을 반영하면서도 자연스러운 ‘그 아이’를 선택했습니다.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  english_pob_choice: from that hour
  chosen_korean: 그때부터
  alternatives_korean:
  - 그 시간부터
  - 그 순간부터
  lexicon: BDAG
  rationale: 헬라어의 직역은 ‘그 시간부터’이지만, 한국어에서는 시간 표현을 보다 자연스럽게 살린 ‘그때부터’가 본문의 즉시성과 지속성을 잘 드러냅니다.
theological_decisions:
- issue: 예수의 꾸짖음의 대상
  chosen_reading: 예수께서 귀신을 꾸짖으셨고, 그 결과 귀신이 그에게서 나갔습니다.
  alternative_readings:
  - 예수께서 아이를 꾸짖으셨습니다.
  - 예수께서 그것을 꾸짖으셨습니다.
  rationale: 직후 절이 ‘귀신이 그에게서 나갔으며’라고 이어지므로, 꾸짖음의 대상은 아이가 아니라 귀신으로 이해하는 것이 본문 흐름에 가장 부합합니다.
  doctrine_reference: 문맥 우선 원칙; 귀신 축출 서술의 지시 대상 보존
