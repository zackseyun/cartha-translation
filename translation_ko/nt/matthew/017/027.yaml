id: MAT.17.27
reference: Matthew 17:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
  footnotes:
  - marker: a
    text: A stater was a coin roughly equal to four drachmas, enough to pay the temple tax for two people.
    reason: cultural_note
  - marker: b
    text: Or 'cause them to stumble' / 'give them offense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들의 마음을 상하게 하지 않기 위해, 바다에 가서 낚시바늘을 던지십시오. 그리고 처음으로 올라오는 물고기를 끌어올리십시오. 그 입을 열면 한 스타테르[a]를 찾게 될 것입니다. 그것을 가져다가 나와 당신을 위하여 그들에게 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스타테르는 대략 네 드라크마에 해당하는 동전으로, 두 사람의 성전세를 내기에 충분한 액수였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  english_pob_choice: offend
  chosen_korean: 걸려 넘어지게 하지 않으려면
  alternatives_korean:
  - 그들에게 실족하게 하지 않으려면
  - 그들을 거슬리게 하지 않으려면
  lexicon: BDAG
  rationale: 여기서는 도덕적 유혹보다 불필요한 반감이나 장애를 주지 않는 뜻이므로, ‘걸려 넘어지게 하다’로 원뜻을 살리되 자연스러운 조건절로 옮겼습니다.
- source_word: θάλασσαν
  english_pob_choice: sea
  chosen_korean: 바다
  alternatives_korean:
  - 호수
  - 갈릴리 호수
  lexicon: BDAG
  rationale: 원문은 ‘바다’(θάλασσα)를 직접 사용하므로 지리적 설명으로 바꾸지 않고 소스 용어를 유지했습니다.
- source_word: ἄγκιστρον
  english_pob_choice: hook
  chosen_korean: 낚시바늘
  alternatives_korean:
  - 갈고리
  - 바늘
  lexicon: BDAG
  rationale: 한국어에서 낚시에 쓰는 도구를 가장 자연스럽게 드러내는 말로 ‘낚시바늘’을 택했습니다. 단순한 ‘바늘’보다 의미가 분명합니다.
- source_word: στατῆρα
  english_pob_choice: a stater
  chosen_korean: 한 스타터
  alternatives_korean:
  - 한 스테터
  - 한 사드란트짜리 동전
  lexicon: BDAG
  rationale: 고유 화폐명은 음차로 보존하고, 독자가 액수를 바로 알 수 있도록 본문에는 두지 않고 주석으로 처리할 수 있게 했습니다.
theological_decisions:
- issue: σκανδαλίζω의 뉘앙스와 예수의 세금 납부 의미
  chosen_reading: 예수는 세금 의무를 신학적으로 양보한다기보다, 불필요한 걸림이 생기지 않도록 실천적으로 배려하라고 말씀하십니다.
  alternative_readings:
  - 예수가 세금 의무를 완전히 인정하신다
  - 기적 시연만을 위한 행동이다
  rationale: 문맥상 17:24–26은 아들들의 자유를 전제하고 있으므로, 이 절은 그 자유를 지우지 않으면서도 공동체적 배려를 강조하는 방향으로 옮겨야 합니다.
  doctrine_reference: 문맥의 긴장 보존
