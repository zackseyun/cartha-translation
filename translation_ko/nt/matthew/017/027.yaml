revisions:
- from: 그러나 우리가 그들을 걸려 넘어지게 하지 않으려면, 바다로 가서 낚시바늘을 던지십시오. 그리고 먼저 올라오는 물고기를 잡으십시오. 그 입을 열면 한 스타터[a]를 찾을 것입니다. 그것을 가져다가 나를 위해서도, 당신을 위해서도 그들에게 주십시오.
  to: 그러나 그들의 마음을 상하게 하지 않기 위해, 바다에 가서 낚시바늘을 던지십시오. 그리고 처음으로 올라오는 물고기를 끌어올리십시오. 그 입을 열면 한 스타테르[a]를 찾게 될 것입니다. 그것을 가져다가 나와 당신을 위하여 그들에게 주십시오.
  rationale: 화폐명 음역을 ‘스타테르’로 교정하고, σκανδαλίζω를 이 문맥에 맞게 ‘그들의 마음을 상하게 하지 않기 위해’로 옮겼습니다. 이는 세금 납부의 신학적 의무 여부를 단정하지 않고 불필요한 거스름을 피한다는 원문의 실천적 뜻을 보존합니다. 나머지 명령형과 지시 대상, 그리고 스타테르의 두 사람분 지급 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:28Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 명령 연쇄와 ‘바다’, ‘낚시바늘’, 처음 올라오는 물고기, 입에서 발견되는 스타테르, 두 사람을 위한 지급이라는 핵심은 대체로 반영했습니다. 다만 ‘스타터’는 στατήρ의 적절한 한국어 음역이 아니며, σκανδαλίσωμεν의 문맥상 ‘걸려 넘어지게 하다’보다 불필요하게 마음을 상하게 하거나 거슬리게 한다는 뜻을 자연스럽게 드러낼 필요가 있습니다.
  naturalness: ‘그들을 걸려 넘어지게 하지 않으려면’은 한국어에서 물리적으로 넘어뜨리는 뜻으로도 쉽게 읽혀 이 문맥에 다소 부자연스럽습니다. ‘그들의 마음을 상하게 하지 않기 위해’가 현대 표준어 합쇼체에서 자연스럽고, 문맥상의 불필요한 반감을 피한다는 의미를 잘 전달합니다. ‘나를 위해서도, 당신을 위해서도’는 가능하지만 ‘나와 당신을 위하여’가 더 간결합니다.
  terminology: στατήρ는 ‘스타테르’로 음역하는 것이 적절합니다. 문화 주석은 스타테르가 약 네 드라크마에 해당하여 두 사람의 성전세에 충분했다는 정보를 정확히 제공합니다. θάλασσα는 지리적 해석을 덧붙이지 않고 ‘바다’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘스타터’라는 화폐명 음역
    rationale: ‘스타터’는 영어 starter와 혼동되며 그리스어 στατήρ의 통상적 음역도 아닙니다. ‘스타테르’로 바로잡아야 합니다.
  - severity: medium
    issue: σκανδαλίσωμεν의 한국어 표현
    rationale: ‘그들을 걸려 넘어지게 하지 않으려면’은 직역적이지만 이 상황에서 의도된 ‘불필요한 반감/거스름을 일으키지 않다’라는 화용적 의미가 약하고 한국어로 어색합니다. 뜻을 과도하게 신학화하지 않는 자연스러운 표현으로 수정하는 것이 안전합니다.
  revised_text: 그러나 그들의 마음을 상하게 하지 않기 위해, 바다에 가서 낚시바늘을 던지십시오. 그리고 처음으로 올라오는 물고기를 끌어올리십시오. 그 입을 열면 한 스타테르[a]를 찾게 될 것입니다. 그것을 가져다가 나와 당신을 위하여 그들에게 주십시오.
