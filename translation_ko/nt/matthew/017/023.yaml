revisions:
- from: 그리고 그들은 그분을 죽일 것입니다. 그리고 셋째 날에 그분은 일으켜질 것입니다. 그러자 그들은 몹시 슬퍼했습니다.[a]
  to: 그들이 그분을 죽일 것이며, 그분은 셋째 날에 일으켜지실 것입니다.[a] 그들은 몹시 슬퍼했습니다.
  rationale: 원문의 미래 예고와 수동태를 유지하면서, 단순 접속사 καί에 추가 뉘앙스를 부여한 ‘그러자’를 제거했습니다. 또한 한국어의 자연스러운 문장 연결을 위해 첫 두 절을 연결하고, 각주 표지를 해당 수동 동사 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:29Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 충실합니다. ἀποκτενοῦσιν의 미래 능동형, τῇ τρίτῃ ἡμέρᾳ의 시간 표현, ἐγερθήσεται의 미래 수동태, ἐλυπήθησαν σφόδρα의 강한 슬픔을 모두 적절히 반영했습니다. 다만 마지막의 ‘그러자’는 단순 접속사 καί에 시간적·추론적 연결을 더하므로 제거하는 것이 더 정확합니다.
  naturalness: 반복된 ‘그리고’는 한국어 문장 흐름에 다소 부자연스럽습니다. 첫 두 절은 ‘-것이며’로 연결하고 마지막 절은 독립문으로 처리하면 현대 표준어 합쇼체에서 자연스럽습니다. ‘일으켜지실 것입니다’는 다소 문어적이지만 원문의 수동태를 보존하는 안전한 표현입니다.
  terminology: ‘죽일 것입니다’, ‘셋째 날’, ‘몹시 슬퍼했습니다’는 적절합니다. 예수님을 가리키는 ‘그분’ 및 높임 표현도 한국어 성경 문체와 합쇼체에 맞습니다. 각주 표지는 수동태가 걸리는 ‘일으켜지실 것입니다’에 붙이는 편이 내용과 정확히 연결됩니다.
  issues:
  - severity: low
    issue: ‘그러자’가 καί에 없는 시간적·추론적 뉘앙스를 보탭니다.
    rationale: καί는 여기서 단순히 다음 사건을 연결합니다. ‘그들은 몹시 슬퍼했습니다’가 원문의 연결을 과잉 해석하지 않습니다.
  - severity: low
    issue: 반복된 ‘그리고’가 한국어에서 다소 기계적으로 들립니다.
    rationale: 그리스어의 병렬 구조는 유지하되, 한국어에서는 첫 문장의 절을 ‘-것이며’로 연결하는 것이 자연스럽습니다.
  - severity: low
    issue: 각주 표지가 문장 끝의 슬픔 표현에 붙어 있어 부활 동사에 관한 각주의 지시 대상이 불명확합니다.
    rationale: 각주는 ἐγερθήσεται에 관한 것이므로 ‘일으켜지실 것입니다’ 직후에 배치해야 합니다.
  revised_text: 그들이 그분을 죽일 것이며, 그분은 셋째 날에 일으켜지실 것입니다.[a] 그들은 몹시 슬퍼했습니다.
