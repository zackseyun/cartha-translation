source:
  edition: SBLGNT
  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
  footnotes:
  - marker: a
    text: 'Or, ''he will rise.'' The Greek verb is passive: ''he will be raised.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그분을 죽일 것이며, 그분은 셋째 날에 일으켜지실 것입니다.[a] 그들은 몹시 슬퍼했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분은 일어나실 것입니다.’ 그리스어 동사는 수동태입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν
  english_pob_choice: they will kill
  chosen_korean: 그들은 그분을 죽일 것입니다
  alternatives_korean:
  - 그분을 목숨 빼앗을 것입니다
  - 그분을 죽음에 넘길 것입니다
  lexicon: BDAG
  rationale: 미래 능동형의 직접적 의미를 살려 가장 자연스러운 표준어로 옮겼습니다. “죽이다”는 본문이 말하는 행위를 과장 없이 바로 드러냅니다.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  english_pob_choice: on the third day
  chosen_korean: 셋째 날에
  alternatives_korean:
  - 세 번째 날에
  - 사흘째 되는 날에
  lexicon: BDAG
  rationale: 그리스어의 시간 부사구를 한국어 관용에 맞게 간결하게 옮겼습니다. “셋째 날에”는 원문의 표현을 충분히 보존합니다.
- source_word: ἐγερθήσεται
  english_pob_choice: he will be raised
  chosen_korean: 그분은 일으켜질 것입니다
  alternatives_korean:
  - 그분은 일어날 것입니다
  - 그분은 다시 살아나실 것입니다
  lexicon: BDAG
  rationale: 미래 수동태를 살려 ‘일으켜질 것입니다’로 옮겼습니다. 이는 예수의 부활이 하나님에 의해 행해지는 사건이라는 수동형의 뉘앙스를 보존합니다.
- source_word: ἐλυπήθησαν σφόδρα
  english_pob_choice: they were deeply grieved
  chosen_korean: 몹시 슬퍼했습니다
  alternatives_korean:
  - 크게 슬퍼했습니다
  - 심히 근심했습니다
  lexicon: BDAG
  rationale: σφόδρα의 강조를 한국어 부사 ‘몹시’로 자연스럽게 반영했습니다. λυπέω는 여기서 슬픔의 정서를 나타내므로 ‘슬퍼했습니다’가 가장 مستقیم합니다.
theological_decisions:
- issue: 부활 예고의 수동태 보존
  chosen_reading: ‘일으켜질 것입니다’로 번역해 수동태를 유지했습니다.
  alternative_readings:
  - ‘일어날 것입니다’로 능동적/자동적 표현
  - ‘다시 살아나실 것입니다’로 풀어쓴 표현
  rationale: 원문의 ἐγερθήσεται는 수동태이므로, 부활을 하나님이 행하시는 일로 드러내는 문법적 뉘앙스를 살리는 것이 바람직합니다. 동시에 한국어 문장으로도 읽기 자연스럽게 구성했습니다.
  doctrine_reference: Translation philosophy §1, §3
