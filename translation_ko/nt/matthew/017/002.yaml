translation:
  language: ko
  text: 그는 그들 앞에서 변화되셨습니다.[a] 그의 얼굴은 해처럼 빛났고, 그의 옷은 빛처럼 희어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘변형되셨습니다.’
