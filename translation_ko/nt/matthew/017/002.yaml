lexical_decisions:
- source_word: μετεμορφώθη
  english_pob_choice: was transfigured
  chosen_korean: 변화되셨습니다
  alternatives_korean:
  - 변형되셨습니다
  - 변모되셨습니다
  lexicon: BDAG
  rationale: 예수님의 외형이 영광 가운데 드러난 변화를 자연스럽게 살리면서도, 단순한 내적 변화처럼 좁혀지지 않도록 했습니다.
- source_word: ἔμπροσθεν αὐτῶν
  english_pob_choice: before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 앞에
  - 그들 면전에서
  lexicon: BDAG
  rationale: 장소 관계를 직역에 가깝게 옮기되, 현대 한국어에서 가장 자연스러운 표현을 택했습니다.
- source_word: ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  english_pob_choice: his face shone like the sun
  chosen_korean: 그의 얼굴은 해처럼 빛났고
  alternatives_korean:
  - 그의 얼굴은 태양처럼 빛났고
  - 그의 얼굴은 해와 같이 빛났고
  lexicon: BDAG
  rationale: πρόσωπον은 여기서 육체적 ‘얼굴’을 가리키므로 그대로 살렸고, ὡς ὁ ἥλιος의 비교는 한국어에서 자연스러운 ‘해처럼’으로 옮겼습니다.
- source_word: τὰ δὲ ἱμάτια αὐτοῦ … ἐγένετο λευκὰ ὡς τὸ φῶς
  english_pob_choice: and his clothes became white as the light
  chosen_korean: 그의 옷은 빛처럼 희어졌습니다
  alternatives_korean:
  - 그의 옷은 빛 같이 희어졌습니다
  - 그의 옷은 빛처럼 하얘졌습니다
  lexicon: BDAG
  rationale: ἱμάτια를 일반적인 ‘옷’으로 옮겨 읽기 쉽도록 했고, λευκὰ는 상태 변화를 드러내는 ‘희어졌습니다’로 옮겼습니다.
theological_decisions:
- issue: 변화된 모습의 의미
  chosen_reading: 예수님의 영광스러운 외형 변화가 제자들 앞에 드러난 것으로 읽었습니다.
  alternative_readings:
  - 단순한 변형 사건으로 읽는 것
  - 상징적 환상으로 완화하는 것
  rationale: 문맥상 얼굴의 빛남과 옷의 백색이 함께 제시되어 실제로 보이는 영광의 현현을 가리키므로, 이를 약화시키지 않고 그대로 반영했습니다.
  doctrine_reference: Affirmations; Translation philosophy §§1, 6
