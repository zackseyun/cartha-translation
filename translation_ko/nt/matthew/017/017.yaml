id: MAT.17.17
reference: Matthew 17:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
  footnotes:
  - marker: a
    text: Or “faithless.” The Greek adjective can mean either “unbelieving” or “faithless.”
    reason: lexical_alternative
  - marker: b
    text: Or “twisted” or “corrupt generation.”
    reason: lexical_alternative
  - marker: c
    text: Or “How long will I bear with you?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 예수께서 대답하여 말씀하셨습니다. 「오, 믿지 않는 뒤틀린 세대여, 내가 언제까지 여러분과 함께 있겠습니까? 내가 언제까지 여러분을 참아야 하겠습니까? 그를 여기 내게 데려오십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  english_pob_choice: But Jesus answered
  chosen_korean: 그러나 예수께서 대답하여 말씀하셨습니다
  alternatives_korean:
  - 예수께서 대답하셨습니다
  - 그런데 예수께서 대답하여 말씀하셨습니다
  lexicon: SBLGNT
  rationale: ἀποκριθεὶς δὲ εἶπεν은 히브리식 관용구로 ‘대답하여 말씀하다’가 자연스럽고, δέ는 반전되는 책망의 흐름을 살려 ‘그러나’로 옮겼습니다.
- source_word: ἄπιστος
  english_pob_choice: unbelieving
  chosen_korean: 믿지 않는
  alternatives_korean:
  - 믿음 없는
  - 신실하지 않은
  lexicon: BDAG
  rationale: 이 문맥은 실패한 귀신 축출과 관련된 믿음의 결핍을 책망하므로 ‘믿지 않는’이 가장 직접적입니다.
- source_word: διεστραμμένη
  english_pob_choice: perverse
  chosen_korean: 뒤틀린
  alternatives_korean:
  - 비뚤어진
  - 타락한
  - 왜곡된
  lexicon: BDAG
  rationale: διαστρέφω의 ‘비틀어짐/왜곡됨’이라는 형상을 살리되, 한국어에서 도덕적 일탈을 과도하게 정죄하는 뉘앙스는 피하면서도 강한 책망을 유지하는 표현으로 ‘뒤틀린’을 택했습니다.
- source_word: ἕως πότε ... ἀνέξομαι ὑμῶν
  english_pob_choice: How long will I bear with you
  chosen_korean: 내가 언제까지 여러분을 참아야 하겠습니까
  alternatives_korean:
  - 내가 언제까지 여러분을 견뎌야 하겠습니까
  - 내가 언제까지 여러분을 받아주어야 하겠습니까
  lexicon: BDAG
  rationale: ἀνέχομαι는 단순 인내보다 ‘참다/견디다’의 강한 부담을 나타내므로, 합쇼체의 책망 어조에 맞게 ‘참아야 하겠습니까’로 옮겼습니다.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  english_pob_choice: Bring him here to me
  chosen_korean: 그를 여기 내게 데려오십시오
  alternatives_korean:
  - 그를 여기로 데려오십시오
  - 그를 여기 내게 가져오십시오
  lexicon: BDAG
  rationale: φέρω의 명령형은 여기서 ‘데려오다’가 가장 자연스럽고, μοι는 목적지를 드러내는 ‘내게’로 살렸습니다.
theological_decisions:
- issue: 예수의 책망 발화체의 높임말 처리
  chosen_reading: 지문은 서술문은 합쇼체로 유지하되, 예수의 직접 발화는 권위 있는 책망과 명령을 자연스럽게 드러내기 위해 합쇼체 명령형과 수사적 질문으로 옮겼습니다.
  alternative_readings:
  - 직설적 반말로 옮김
  - 더 완곡한 존대 표현으로 완화함
  rationale: 본문은 엄중한 공적 책망과 즉각적 지시를 담고 있으므로, 현대 한국어에서 그 긴장과 권위를 보존하는 방식이 필요합니다.
  doctrine_reference: 번역 철학 §3 — source-direct register preservation
- issue: ἄπιστος와 διεστραμμένη의 결합
  chosen_reading: ‘믿지 않는 뒤틀린 세대’로 함께 유지했습니다.
  alternative_readings:
  - ‘믿음 없는 타락한 세대’
  - ‘믿지 않는 비뚤어진 세대’
  rationale: 두 형용사는 서로 다른 결을 가지므로 하나로 풀어버리지 않고, 믿음의 결핍과 왜곡된 상태를 함께 드러내도록 보존했습니다.
  doctrine_reference: 번역 철학 §3 — tension preservation
