  source_fidelity: 본문은 시간적 속격절(‘그들이 가버나움에 이르렀을 때’), 징수자들의 접근, 베드로에게 한 질문, 그리고 부정 의문문의 형태를 충실히 전달합니다. 다만 각주 표지는 해당 어구 가까이에 두는 편이 각주의 지시 대상과 더 정확히 연결됩니다.
