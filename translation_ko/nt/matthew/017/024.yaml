id: MAT.17.24
reference: Matthew 17:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
  footnotes:
  - marker: a
    text: Greek 'the two-drachmas'; that is, the two-drachma temple tax.
    reason: cultural_note
  - marker: b
    text: Or 'the collectors of the didrachma tax.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 가버나움에 이르렀을 때, 두 드라크마 세금을[a] 거두는 사람들[b]이 베드로에게 와서 말했습니다. “여러분의 선생님께서는 두 드라크마 세금을 내지 않으십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어로는 ‘두 드라크마들’이며, 곧 두 드라크마 성전세를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘디드라크마 세금을 거두는 사람들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ
  english_pob_choice: When they came to Capernaum
  chosen_korean: 그들이 가버나움에 이르렀을 때
  alternatives_korean:
  - 가버나움에 도착하자
  - 그들이 가버나움에 왔을 때
  lexicon: BDAG
  rationale: 분사구문은 시간적 상황을 나타내므로, 현대 한국어에서는 자연스러운 종속절로 옮겨 시간 관계를 살렸습니다.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  english_pob_choice: those who collected the two-drachma tax
  chosen_korean: 두 드라크마 세금을 거두는 사람들
  alternatives_korean:
  - 두 드라크마를 받는 사람들
  - 두 드라크마 세금 징수자들
  lexicon: BDAG
  rationale: 문맥상 단순한 동전 수수가 아니라 세금 징수이므로, 동사를 ‘거두다’로 살려 기능을 분명히 했습니다.
- source_word: δίδραχμα
  english_pob_choice: two-drachma tax
  chosen_korean: 두 드라크마 세금
  alternatives_korean:
  - 이중 드라크마 세금
  - 디드라크마 세금
  lexicon: BDAG
  rationale: 금액을 드러내는 표현을 유지하면서, 문맥에 맞게 세금이라는 기능을 앞세웠습니다.
- source_word: Ὁ διδάσκαλος ὑμῶν
  english_pob_choice: your teacher
  chosen_korean: 당신들의 선생님
  alternatives_korean:
  - 너희 선생님
  - 너희 스승
  lexicon: BDAG
  rationale: διδάσκαλος는 여기서 ‘선생님’이 가장 직접적이며, 복음서의 일상적 호칭을 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: Ὁ διδάσκαλος ὑμῶν의 호칭 뉘앙스
  chosen_reading: ‘당신들의 선생님’으로 공손한 제3자 호칭을 유지했습니다.
  alternative_readings:
  - ‘너희 선생님’
  - ‘당신들의 스승’
  rationale: 베드로에게 향한 질문이므로 직설적이되 공적 대화의 예의를 유지하는 표현이 적절합니다. ‘스승’은 위계적 뉘앙스를 더해 원문의 일반적 호칭을 약화시킬 수 있습니다.
  doctrine_reference: 공손한 현대 한국어 화법과 복음서 대화체의 자연스러움
- issue: οὐ τελεῖ의 의문문 처리
  chosen_reading: ‘내지 않습니까?’로 옮겨, 세금 납부 여부를 묻는 뜻을 분명히 했습니다.
  alternative_readings:
  - ‘갚지 않습니까?’
  - ‘치르지 않습니까?’
  rationale: τελέω는 여기서 금전적 의무 이행을 뜻하므로, 한국어에서는 가장 직접적인 ‘내다’가 문맥을 선명하게 전달합니다.
  doctrine_reference: 문맥 우선의 어휘 선택
