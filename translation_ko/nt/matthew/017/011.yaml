lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  english_pob_choice: He answered
  chosen_korean: 그가 대답하여 말씀하셨습니다
  alternatives_korean:
  - 그가 대답하셨습니다
  - 그가 응답하여 말씀하셨습니다
  - 그가 대답하고 말씀하셨습니다
  lexicon: BDAG
  rationale: 분사+동사의 관용적 응답 표현을 한국어에서는 자연스럽게 ‘대답하여 말씀하셨습니다’로 옮겨, 응답의 기능은 살리되 군더더기 반복은 줄였습니다.
- source_word: Ἠλίας
  english_pob_choice: Elijah
  chosen_korean: 엘리야
  alternatives_korean:
  - 엘리야 선지자
  lexicon: 표준 성서 인명 표기
  rationale: 정확한 고유명사는 한국어 성서 표준 표기인 ‘엘리야’를 사용했습니다.
- source_word: μέν
  english_pob_choice: indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 실로
  - 과연
  - 분명히
  lexicon: BDAG
  rationale: μέν의 강조·대조 예고 기능을 한국어에서는 ‘참으로’로 옮겨, 뒤이어 올 대비를 예고하는 힘을 유지했습니다.
- source_word: ἔρχεται
  english_pob_choice: is coming
  chosen_korean: 오고 있으며
  alternatives_korean:
  - 오고 있습니다
  - 올 것입니다
  - 오십니다
  lexicon: BDAG
  rationale: 현재형의 미래지향적 용법을 반영해, 현재 진행의 생동감과 장차 올 사건성을 함께 살렸습니다.
- source_word: ἀποκαταστήσει πάντα
  english_pob_choice: will restore all things
  chosen_korean: 모든 것을 회복할 것입니다
  alternatives_korean:
  - 모든 것을 복원할 것입니다
  - 만물을 회복할 것입니다
  - 모든 것을 바로잡을 것입니다
  lexicon: BDAG
  rationale: ἀποκαταστήσει의 핵심 의미를 ‘회복하다’로 옮겨 포괄적 복원의 의미를 유지했고, πάντα는 의미를 과도하게 좁히지 않도록 ‘모든 것’을 택했습니다.
theological_decisions:
- issue: 엘리야의 회복 사역 범위
  chosen_reading: ‘모든 것을 회복할 것입니다’로 넓게 유지해, 그 회복이 무엇을 포함하는지 이 절에서 단정하지 않았습니다.
  alternative_readings:
  - 모든 것을 바로잡을 것입니다
  - 모든 사람과 모든 것을 제자리로 돌려놓을 것입니다
  rationale: 원문은 회복의 총체성을 말하지만 그 구체적 범위를 여기서 규정하지 않습니다. 따라서 해석을 앞질러 특정 교리 틀로 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
