  terminology: ‘엘리야’, ‘모든 것’, ‘회복할 것입니다’는 표준적인 성서 용례이며, 원문의 포괄성과 신학적 개방성을 잘 유지합니다. μέν의 강조는 ‘참으로’로 무리 없이 드러납니다.
