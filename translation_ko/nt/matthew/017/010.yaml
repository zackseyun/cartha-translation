id: MAT.17.10
reference: Matthew 17:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: ko
  text: 제자들이 그분께 이렇게 물었습니다. 「그렇다면 어째서 서기관들은 엘리야가 먼저 와야 한다고 말합니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  english_pob_choice: asked
  chosen_korean: 물으며 말했습니다
  alternatives_korean:
  - 물었습니다
  - 질문했습니다
  lexicon: BDAG
  rationale: 직접 질문을 도입하는 aorist의 기능을 자연스러운 현대 한국어로 살리되, 뒤의 λέγοντες까지 반영해 ‘물으며 말했습니다’로 옮겼습니다.
- source_word: οἱ μαθηταὶ
  english_pob_choice: the disciples
  chosen_korean: 제자들이
  alternatives_korean:
  - 그 제자들이
  - 그의 제자들이
  lexicon: BDAG
  rationale: 문맥상 이미 알려진 무리를 가리키므로 ‘제자들이’가 가장 간결하고 정확합니다. ‘그의’는 원문에 없는 소유를 덧붙입니다.
- source_word: γραμματεῖς
  english_pob_choice: the scribes
  chosen_korean: 서기관들
  alternatives_korean:
  - 율법학자들
  - 율법교사들
  lexicon: BDAG
  rationale: 공관복음에서 γραμματεῖς의 표준 대응인 ‘서기관들’을 사용해, 설명적이지만 덜 직접적인 표현을 피했습니다.
- source_word: δεῖ ἐλθεῖν πρῶτον
  english_pob_choice: must come first
  chosen_korean: 먼저 와야 한다
  alternatives_korean:
  - 먼저 와야만 한다
  - 먼저 오셔야 한다
  lexicon: BDAG
  rationale: δεῖ의 필연성을 ‘-아/어야 하다’로 옮기고, πρῶτον을 ‘먼저’로 살려 도래의 순서를 분명히 했습니다. ‘오셔야’는 3인칭 인격 존대가 과도하게 개입할 수 있어 피했습니다.
theological_decisions:
- issue: 이스라엘의 엘리야 도래에 대한 질문의 긴장 유지
  chosen_reading: 이 절은 서기관들의 가르침을 단정적으로 승인하거나 반박하지 않고, 제자들의 질문 자체만 드러내도록 옮겼습니다.
  alternative_readings:
  - 말라기 배경을 미리 풀어 설명하는 번역
  - 질문 어조를 더 회의적으로 만들어 서기관들을 암시적으로 비판하는 번역
  rationale: 다음 절에서야 예수님의 설명이 이어지므로, 여기서는 해석을 선취하지 않고 본문이 유지하는 긴장을 그대로 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
