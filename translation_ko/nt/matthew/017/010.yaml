review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 충실합니다. ἐπηρώτησαν의 질문, οὖν의 추론적 연결(‘그렇다면’), 서기관들의 발언 내용, 엘리야가 ‘먼저’ 와야 한다는 필연성이 모두 보존되었습니다. 다만 καὶ는 단순 연결인데 ‘그러자’는 문맥상 결과·전환을 조금 더 강하게 나타낼 수 있어 중립적으로 다듬는 편이 안전합니다.
  naturalness: ‘물으며 말했습니다’는 한국어에서 동의어 동작을 불필요하게 중첩하여 다소 부자연스럽습니다. 직접 인용을 도입할 때 ‘이렇게 물었습니다’가 현대 표준어 합쇼체에서 자연스럽고, λέγοντες가 수행하는 인용 도입 기능도 충분히 반영합니다.
  terminology: ‘제자들’, ‘서기관들’, ‘엘리야’는 공관복음 문맥과 한국어 성서 용례에 적절합니다. ‘먼저 와야 한다’는 δεῖ ἐλθεῖν πρῶτον의 필요성과 순서를 정확히 전달합니다.
  issues:
  - severity: low
    issue: ‘물으며 말했습니다’의 중복적 인용 도입
    rationale: ἐπηρώτησαν과 λέγοντες를 기계적으로 둘 다 동사로 옮기면서 한국어에서는 어색한 중복이 생겼습니다. ‘이렇게 물었습니다’로 자연스럽게 인용을 도입할 수 있습니다.
  - severity: low
    issue: ‘그러자’가 καὶ보다 다소 강한 문맥 관계를 암시함
    rationale: καὶ 자체는 단순 접속이며, 이 절만으로 결과·전환의 강도를 확정할 필요는 없습니다. 생략하거나 중립적 연결로 처리하는 편이 원문에 가깝습니다.
  revised_text: 제자들이 그분께 이렇게 물었습니다. 「그렇다면 어째서 서기관들은 엘리야가 먼저 와야 한다고 말합니까?」
