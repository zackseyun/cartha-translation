  to: 제자들이 그분께 이렇게 물었습니다. 「그렇다면 어째서 서기관들은 엘리야가 먼저 와야 한다고 말합니까?」
  rationale: 의미와 신학적 긴장은 그대로 유지하면서, 중복적인 ‘물으며 말했습니다’를 자연스러운 직접 인용 도입으로 고쳤습니다. 또한 단순 접속사 καὶ에 ‘그러자’가 부여할 수 있는 다소 강한 전환 뉘앙스를 피했습니다.
  reviewer_model: gpt-5.6-terra
