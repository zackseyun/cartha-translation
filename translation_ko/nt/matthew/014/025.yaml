  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
  footnotes:
  - marker: a
    text: Or 'walking upon the sea.' Some have taken the phrase as 'walking by the sea,' but the context strongly favors movement on the water itself.
    reason: alternative_reading
  - marker: b
    text: The 'fourth watch of the night' refers to the final night watch, roughly between 3:00 and 6:00 a.m. in the Roman system.
    reason: cultural_note
translation:
  language: ko
  text: 밤 사경에[a] 예수님께서 바다 위를 걸으시며 그들에게 오셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밤 사경’은 로마식 야간 경비의 마지막 교대 시간으로, 대략 오전 3시부터 6시까지를 가리킵니다.
    reason: cultural_note
