  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
  footnotes:
  - marker: a
    text: Or “the miraculous powers,” or more interpretively, “the miracles.” The Greek says “the powers” (αἱ δυνάμεις), referring to supernatural power manifested in mighty works.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 신하들에게 이렇게 말했습니다. 「이 사람은 세례자 요한이다. 그가 죽은 사람들 가운데서 살아나게 되었고, 그래서 이 능력들[a]이 그 안에서 작용하고 있는 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기적적인 능력들’. 그리스어는 ‘능력들’이라고 하며, 여기서는 강력한 일들로 나타나는 초자연적 능력을 가리킵니다.
    reason: δυνάμεις의 어휘적 의미를 본문에서는 보존하면서, 문맥상 기적적 의미를 설명합니다.
