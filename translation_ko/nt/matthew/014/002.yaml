  naturalness: 합쇼체와 현대 표준어에 맞게 ‘그 때문에’를 ‘그래서’로, ‘활동하는 것이다’를 문맥상 더 자연스러운 ‘작용하고 있는 것입니다’로 다듬었습니다. ‘신하들’은 통치자의 궁정/가정 구성원을 가리키는 문맥에서 가능한 번역입니다.
