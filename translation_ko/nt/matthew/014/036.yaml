  source_fidelity: 그리스어의 반복·지속적 간청(παρεκάλουν), ‘오직/단지’라는 제한(μόνον), 옷의 κράσπεδον, 그리고 접촉한 모든 이의 회복(ὅσοι ἥψαντο διεσώθησαν)을 충실히 반영합니다. ‘나았습니다’는 이 문맥에서 신체적 치유를 자연스럽게 전달합니다.
