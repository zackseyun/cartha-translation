id: MAT.14.9
reference: Matthew 14:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
  footnotes:
  - marker: a
    text: Or 'those reclining at table with him.' The Greek reflects the customary dining posture of the period.
    reason: cultural_note
  - marker: b
    text: The Greek leaves the object of 'to be given' implicit; the referent is the request mentioned in the preceding context.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 슬퍼하였으나, 자기가 한 맹세들과 그와 함께 식사하던 사람들[a] 때문에 그것[b]을 주라고 명령하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그와 함께 식탁에 기대어 있던 사람들’입니다. 이는 당시의 식사 자세를 반영합니다.
    reason: cultural_note
  - marker: b
    text: ‘그것’의 대상은 그리스어 본문에서 명시되지 않았으며, 앞 문맥에서 요청된 것을 가리킵니다.
    reason: lexical_alternative
