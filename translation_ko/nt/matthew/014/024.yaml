base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
  footnotes:
  - marker: a
    text: Or 'from shore' / 'from the shore.' The Greek says 'from the land.'
    reason: lexical_alternative
  - marker: b
    text: A stadion was an ancient unit of distance, roughly 185 meters (about 607 feet).
    reason: cultural_note
  - marker: c
    text: Or 'being buffeted by the waves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 배는 이미 육지에서 여러 스타디온[a]이나 떨어져 있었고, 파도에 시달리고 있었습니다. 바람이 맞바람이었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스타디온은 고대의 거리 단위로, 약 185미터입니다.
    reason: cultural_note
