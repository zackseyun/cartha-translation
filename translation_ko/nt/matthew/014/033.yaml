  source_fidelity: οἱ δὲ ἐν τῷ πλοίῳ를 ‘배 안에 있던 사람들’로, προσεκύνησαν αὐτῷ를 ‘예수님께 엎드려 경배하며’로, λέγοντες를 ‘말했습니다’로 충실히 옮겼습니다. Ἀληθῶς θεοῦ υἱὸς εἶ도 ‘참으로 당신은 하나님의 아들이십니다’로 자연스럽고 정확하게 반영합니다. ‘예수님’은 바로 앞 문맥의 αὐτῷ의 지시 대상을 한국어에서 명료하게 한 것입니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. ‘엎드려 경배하며 말했습니다’는 행동과 발화를 연결하는 그리스어 분사 구문을 매끄럽게 살립니다.
  terminology: ‘경배’와 ‘하나님의 아들’은 마태복음의 문맥 및 한국어 성경 문체에 적절한 핵심 용어입니다. ‘엎드려’는 προσκυνέω에 수반될 수 있는 부복의 몸짓을 드러내되, ‘경배’와 결합하여 문맥상의 강한 존숭의 의미를 보존합니다.
