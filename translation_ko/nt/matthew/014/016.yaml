  terminology: ‘예수님께서 … 말씀하셨습니다’는 한국어 성경 문체에서 자연스럽고 존중 표현에도 맞습니다. ‘먹을 것’은 φαγεῖν과 δίδωμι의 관용적 결합을 자연스럽게 반영합니다.
  issues:
