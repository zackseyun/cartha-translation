  - severity: low
    issue: ὑμεῖς의 강조가 충분히 드러나지 않습니다.
    rationale: 명시된 2인칭 복수 대명사는 제자들이 행동해야 함을 강조합니다. ‘여러분이 직접’이 이 강조를 자연스럽게 재현합니다.
  revised_text: 그러나 예수님께서 그들에게 말씀하셨습니다. “그들이 떠날 필요가 없습니다. 여러분이 직접 그들에게 먹을 것을 주십시오.”
