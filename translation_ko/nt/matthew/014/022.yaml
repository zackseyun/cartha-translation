  to: 예수님께서는 곧 제자들에게 배에 올라 자신보다 먼저 건너편으로 가도록 강권하셨습니다. 그분이 무리를 보내실 때까지 그렇게 하게 하셨습니다.
  rationale: 원문의 즉시성(εὐθέως), 강한 권유 또는 압박(ἠνάγκασεν), ‘그분보다 먼저’라는 관계(προάγειν αὐτόν), 그리고 무리를 보내는 일을 미래의 기준점으로 제시하는 시간 관계(ἕως οὗ ἀπολύσῃ)를 보존하도록 수정했습니다. 두 문장으로 나누어 한국어의 자연스러움을 확보하되, ‘그렇게’는 제자들이 배에 올라 건너편으로 먼저 가는 행동을 가리킵니다.
  reviewer_model: gpt-5.6-terra
