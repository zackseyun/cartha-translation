  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
  footnotes:
  - marker: a
    text: Or 'he blessed God' / 'he said a blessing.' The Greek simply says 'he blessed,' without stating the object explicitly.
    reason: alternative_reading
translation:
  language: ko
  text: 예수님께서 무리에게 풀밭에 앉도록 명하신 뒤, 떡 다섯 개와 물고기 두 마리를 받으시고 하늘을 우러러 축복하시며[a], 떡을 떼어 제자들에게 주셨고, 제자들은 무리에게 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘축복하셨다’라고만 하며 축복의 대상을 명시하지 않습니다. 떡과 물고기를 축복하셨다는 뜻으로도, 하나님을 찬송하시거나 축복의 말씀을 드리셨다는 뜻으로도 이해될 수 있습니다.
    reason: 원문의 εὐλόγησεν에 목적어가 명시되지 않은 모호성을 보존하기 위함
