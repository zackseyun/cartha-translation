  rationale: ‘들고’를 λαβών의 동작을 더 정확히 나타내는 ‘받으시고’로 고쳤습니다. εὐλόγησεν의 목적어를 본문에서 보충하거나 특정하지 않고, ‘축복하시며’와 해당 위치의 각주로 원문의 해석상 열려 있는 표현을 보존했습니다. ‘풀밭에 앉도록’은 식사 자리의 자세를 가리키는 원문을 현대 표준 한국어로 자연스럽게 전달하므로 유지했습니다.
