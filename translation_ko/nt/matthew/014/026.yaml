  naturalness: 초안의 ‘두려워하며 말했습니다’는 두려워한 사실과 외친 행위의 관계가 다소 흐려집니다. 두 문장으로 나누어 현대 표준어 합쇼체에서 자연스럽고 원문의 진행도 살렸습니다. 문맥상 이미 알려진 인물을 가리키는 ‘그분께서’를 유지했습니다.
