- from: 베드로가 예수님께 대답하여 말했습니다. 「주님, 만일 당신이시면, 저더러 물 위로 당신께 오라고 명령해 주십시오.」
  to: 베드로가 예수님께 대답하여 말했습니다. “주님, 주님이시라면 제가 물 위로 주님께 가라고 명령해 주십시오.”
