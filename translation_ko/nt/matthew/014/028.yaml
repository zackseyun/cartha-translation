review_pass:
  verdict: revise
  source_fidelity: The draft conveys Peter’s response, Jesus’ lordship-title, the conditional identification, the imperative force of κελεύω, and movement to Jesus over the water. However, ‘당신이시면’ is less precise and less natural in this reverential direct address than ‘주님이시라면.’
  naturalness: ‘저더러 … 오라고’ is colloquial and comparatively awkward in modern formal-polite prose. ‘제가 … 가라고 명령해 주십시오’ is clear, formal, and idiomatic. Rendering the addressee consistently as ‘주님’ also avoids the potentially distancing or ambiguous second-person pronoun ‘당신.’
  terminology: ‘베드로,’ ‘예수님,’ and ‘주님’ are appropriate standard Korean biblical forms. ‘명령해 주십시오’ properly retains the authoritative force of κελεύω without imposing an interpretation. Korean ‘물’ normally functions as an uncountable collective noun; no footnote is needed to reproduce the Greek plural ὕδατα.
  issues:
  - severity: medium
    issue: ‘만일 당신이시면’
    rationale: Although understandable, this construction is stylistically marked and does not express the identification sense of εἰ σὺ εἶ as naturally as ‘주님이시라면.’
  - severity: low
    issue: ‘저더러 물 위로 당신께 오라고’
    rationale: ‘저더러’ is relatively colloquial, and repeating ‘당신’ is less suitable in a formal-polite address to ‘주님.’ A first-person subject clause with ‘주님께 가라고’ is more natural while preserving the infinitival complement.
  revised_text: 베드로가 예수님께 대답하여 말했습니다. “주님, 주님이시라면 제가 물 위로 주님께 가라고 명령해 주십시오.”
