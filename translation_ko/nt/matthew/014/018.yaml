  source_fidelity: 원문의 δέ는 앞 절 제자들의 말에 이어지는 응답을 나타내며, ‘그분이 말씀하셨습니다’로 자연스럽게 반영됩니다. Φέρετε(복수 명령), μοι(나에게), ὧδε(여기), αὐτούς(문맥상 떡과 물고기)를 모두 반영했습니다.
  naturalness: 초안의 ‘가져오너라’는 현대 표준 한국어 합쇼체 요청 형식에 맞지 않습니다. ‘가져오십시오’가 현대적이고 격식 있는 명령 표현입니다. ‘여기 나에게’는 ὧδε와 μοι를 모두 자연스럽게 드러냅니다.
  terminology: ‘그분’은 헬라어의 대명사 주어를 과도한 정보 추가 없이 옮기며, 문맥상 예수님을 가리킵니다. ‘그것들’은 앞 절의 떡과 물고기를 가리키므로 주석으로 명시합니다.
  issues:
  - severity: medium
    issue: 직접 명령문의 종결이 합쇼체가 아님
    rationale: ‘가져오너라’는 해라체이므로, 지정된 현대 격식체(합쇼체)와 일치하지 않습니다.
  - severity: low
    issue: ὧδε(‘여기’)와 μοι(‘나에게’)의 공간적·인칭적 초점이 충분히 드러나지 않음
    rationale: ‘내게로’만으로도 일부 전달되지만, 원문의 ‘여기’와 ‘나에게’를 모두 명시하는 편이 충실합니다.
  revised_text: 그분이 말씀하셨습니다. “그것들을 여기 나에게 가져오십시오.”
  revised_footnotes:
