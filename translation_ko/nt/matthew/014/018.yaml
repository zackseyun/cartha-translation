  source_fidelity: 원문의 δέ는 앞선 제자들의 말에 대한 예수님의 응답을 잇는 접속사이며, 한국어에서는 별도의 역접 표지 없이도 자연스럽게 반영됩니다. Φέρετε(복수 명령), μοι(내게), ὧδε(이리/여기로), αὐτούς(앞 절의 빵과 물고기를 가리키는 ‘그것들’)를 모두 보존하도록 다듬었습니다.
  naturalness: 초안의 ‘가져오너라’는 현대 표준어 합쇼체 지향과 맞지 않는 해라체 명령입니다. ‘가져오십시오’가 현대의 정중하고 자연스러운 직접 명령 표현입니다. ‘이리 내게’는 장소와 수취인을 모두 간결하게 나타냅니다.
  terminology: 문맥상 선행하는 예수님을 명시한 ‘예수님께서’는 자연스럽고 의미를 추가하지 않습니다. αὐτούς의 지시 대상은 본문에서 과도하게 풀어 쓰지 않고 ‘그것들’로 유지하며, 필요한 문맥 설명은 각주로 제시합니다.
