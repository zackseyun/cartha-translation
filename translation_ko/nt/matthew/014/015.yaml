  text: 저녁이 되자 제자들이 예수님께 다가와 말했습니다. “이곳은 외딴 곳이고 시간도 이미 늦었습니다. 무리를 보내 주십시오. 그러면 그들이 마을들로 가서 자기들이 먹을 음식을 살 수 있습니다.”
