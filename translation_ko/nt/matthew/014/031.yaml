  source_fidelity: 원문의 εὐθέως는 ‘곧바로’로, ἐκτείνας τὴν χεῖρα와 ἐπελάβετο αὐτοῦ는 ‘손을 내밀어 그를 붙잡으시고’로 충실히 옮길 수 있습니다. ἐδίστασας는 ‘의심하다’뿐 아니라 ‘망설이다/흔들리다’의 뉘앙스도 있으므로 각주로 보완하는 것이 적절합니다. 그리스어의 역사적 현재 λέγει는 한국어 서사에서 자연스러운 과거형 ‘말씀하셨습니다’로 옮겨도 의미 손실이 없습니다.
  naturalness: 초안의 ‘붙잡으시며 말씀하셨습니다’는 행동의 연결과 시제가 다소 어색합니다. ‘붙잡으시고 그에게 말씀하셨습니다’가 현대 표준어 합쇼체 문장으로 더 자연스럽습니다. 호격 ‘믿음이 작은 자야’는 현대어에서 다소 문어적·낡은 느낌이 있으므로, 문장 종결을 합쇼체로 맞춘 ‘믿음이 작은 사람이여, 왜 의심하였습니까?’로 다듬습니다.
  terminology: Ὀλιγόπιστε의 ‘믿음이 작은’은 믿음의 부족을 나타내며, 완전한 불신으로 과장하지 않습니다. ‘예수님’ 및 존대 서술은 대상 한국어의 합쇼체 관례와 일치합니다.
  issues:
  - severity: medium
    issue: 행동 연결과 문장 표현
    rationale: ‘붙잡으시며 말씀하셨습니다’는 원문의 선행 행동 뒤 발화라는 흐름을 덜 분명하게 하고, 현대 한국어로도 다소 부자연스럽습니다. ‘붙잡으시고 그에게 말씀하셨습니다’가 더 명료합니다.
  - severity: low
    issue: 직접화법의 높임말 종결 및 호격
    rationale: ‘믿음이 작은 자야, 어찌하여 의심하였느냐?’는 현대 합쇼체 기준과 맞지 않고 문어적입니다. 합쇼체 종결과 현대적인 의문사로 조정합니다.
  - severity: low
    issue: ἐδίστασας의 의미 범위 각주 누락
    rationale: ‘의심하였습니까?’는 적절한 본문 번역이나, 동사는 망설임 또는 흔들림을 뜻할 수도 있으므로 영어 감사 기록과 같이 대안 뉘앙스를 각주로 제시하는 것이 좋습니다.
  revised_text: 예수님께서 곧바로 손을 내밀어 그를 붙잡으시고 그에게 말씀하셨습니다. “믿음이 작은 사람이여, 왜 의심하였습니까?[a]”
  revised_footnotes:
