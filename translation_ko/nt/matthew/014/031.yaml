    text: 또는 “왜 망설였습니까?” 또는 “왜 흔들렸습니까?” 그리스어 동사는 의심뿐 아니라 망설임이나 흔들림을 나타낼 수도 있습니다.
    reason: ἐδίστασας의 어휘적 대안 의미를 보존합니다.
  revision_rationale: 원문의 즉각성, 손을 내밀어 붙잡는 행동, 그리고 믿음의 부족에 대한 질문을 유지하면서 문장을 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. 역사적 현재는 한국어 서사 관습에 따라 과거형으로 옮겼으며, ‘의심하다’의 가능한 뉘앙스는 각주로 보존했습니다.
