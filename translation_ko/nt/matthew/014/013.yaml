  text: 예수님께서 이 소식을 들으시고 그곳에서 배를 타고 따로 외딴 곳으로 물러나셨습니다.[a] 무리가 이를 듣고 여러 마을에서 걸어서 그분을 따라왔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
