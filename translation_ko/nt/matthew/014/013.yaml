review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ withdrawal by boat to an isolated place and the crowds’ following on foot. However, ‘한적한’ can suggest a pleasantly quiet place rather than the isolated/uninhabited force of ἔρημος, and ‘성읍들’ is not the most natural modern-standard Korean wording for πόλεις in this setting.
  naturalness: The honorific narrative register is appropriate. ‘따로 한적한 곳으로’ is somewhat awkward and semantically softened; ‘따로 외딴 곳으로’ is more natural and closer to the Greek. ‘여러 마을에서’ is modern and idiomatic.
  terminology: ‘예수님’ and ‘물러나셨습니다’ suit modern formal-polite Korean. ‘따로’ preserves κατ’ ἰδίαν without imposing a motive. A footnote retains the lexical breadth of πόλις, and another clarifies that ‘외딴 곳’ need not mean a sandy desert.
  issues:
  - severity: medium
    issue: ‘한적한 곳’ weakens the sense of ἔρημος.
    rationale: ἔρημος denotes an isolated, deserted, or uninhabited place. In Korean, ‘한적한’ may primarily connote a tranquil or quiet place; ‘외딴 곳’ better represents the lexical sense without specifying desert terrain.
  - severity: low
    issue: ‘성읍들’ is less natural in contemporary standard Korean.
    rationale: Although semantically possible, ‘성읍’ has a literary or archaic feel. ‘여러 마을’ is more idiomatic in this Galilean context; a note preserves the possible sense ‘cities’.
  revised_text: 예수님께서 이 소식을 들으시고 그곳에서 배를 타고 따로 외딴 곳으로 물러나셨습니다.[a] 무리가 이를 듣고 여러 마을에서 걸어서 그분을 따라왔습니다.[b]
  revised_footnotes:
