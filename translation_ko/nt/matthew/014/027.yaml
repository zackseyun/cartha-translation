  - severity: low
    issue: ἐγώ εἰμι의 대안적 문자 읽기를 보존하는 각주가 없음
    rationale: 문맥상 「나입니다」가 적절하지만, 그리스어의 문자적 「나는 있다」와 신적 자기선언을 환기한다고 읽는 가능성은 단정 없이 주석으로 보존하는 편이 원문의 의미 폭과 감사 기록에 부합합니다.
