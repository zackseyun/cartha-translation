revisions:
- from: 예수님이 즉시 그들에게 말씀하셨습니다. 「안심하여라. 나다. 두려워하지 말라.」
  to: 예수께서 곧바로 그들에게 말씀하셨습니다. “안심하십시오. 나입니다[a]. 두려워하지 마십시오.”
  rationale: 직접 화법을 현대 합쇼체로 고쳐 지정된 등록을 충족했습니다. εὐθύς의 시간적 힘은 「곧바로」로, θαρσεῖτε와 μὴ φοβεῖσθε의 복수 명령은 각각 「안심하십시오」와 「두려워하지 마십시오」로 옮겼습니다. ἐγώ εἰμι는 서사 문맥의 자연스러운 신원 확인으로 본문에 두고, 논쟁 가능한 신학적 함의를 각주에서 제한적으로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:20:27Z'
review_pass:
