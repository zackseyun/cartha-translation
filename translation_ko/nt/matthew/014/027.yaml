  source_fidelity: 초안은 εὐθύς, αὐτοῖς, ἐλάλησεν, 세 명령을 대체로 충실히 옮깁니다. 다만 직접 화법의 종결형 「-어라/-말라」는 요청된 현대 합쇼체와 맞지 않으며, ἐγώ εἰμι의 문자적 표현 및 가능한 함의를 본문 밖에서 보존하는 주석이 필요합니다.
  naturalness: 「예수께서 곧바로 그들에게 말씀하셨습니다」와 「안심하십시오. 나입니다. 두려워하지 마십시오」는 현대 표준어 합쇼체로 자연스럽습니다. 「곧바로」는 εὐθύς의 즉각성을 분명히 드러냅니다.
  terminology: 인명은 한국어 성경 문체에 맞추어 「예수께서」로 표기했습니다. ἐγώ εἰμι는 문맥상 신원 확인으로 「나입니다」라고 옮기되, 이를 명시적인 신적 자칭으로 단정하지 않고 각주에서 문자적 형태와 가능한 환기를 보존했습니다.
