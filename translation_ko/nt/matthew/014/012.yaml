    issue: '''그 시신을 가져다'''
    rationale: ἦραν은 이 문맥에서 시신을 들어 거두어 가는 행위를 뜻합니다. '가져다'는 화자나 기준점 쪽으로 가져온다는 뜻으로도 읽힐 수 있으므로 '거두어'가 더 정확하고 자연스럽습니다.
  - severity: low
    issue: πτῶμα에 대한 각주 부재
    rationale: 본문의 '시신'은 정확하지만, 원어가 단순한 '몸'보다 죽은 몸/시체를 명시하는 단어임을 독자가 확인할 수 있도록 어휘 각주를 추가하는 것이 영어 POB 감사 기록과 부합합니다.
