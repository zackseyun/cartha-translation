  source_fidelity: 원문은 요한의 제자들이 와서 시신을 거두어 장사 지낸 후 예수께 보고한 일을 서술합니다. 초안의 의미는 대체로 충실하나, '가져다'는 시신을 다른 곳으로 '가져오는' 뉘앙스를 낼 수 있어 αἴρω의 문맥상 의미인 '거두다'가 더 정확합니다. πτῶμα의 죽은 몸이라는 어휘적 의미는 각주로 밝혀 주는 것이 적절합니다.
  naturalness: '''시신을 거두어 장사 지낸 뒤''는 현대 표준 한국어의 자연스러운 서술이며, 합쇼체 종결과도 잘 어울립니다. 두 번째 ἐλθόντες의 이동 및 순서를 ''그리고 가서''로 드러냈습니다.'
  terminology: 문맥상 αὐτοῦ는 세례 요한을 가리키므로 '요한의 제자들'은 안전한 명시화입니다. '예수께'는 원문의 인명에 불필요한 호칭을 덧붙이지 않으면서도 한국어 문체에 자연스럽습니다. '장사 지내다'는 θάπτω에 알맞습니다.
  issues:
