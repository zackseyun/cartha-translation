  source_fidelity: 초안의 ‘야훼’는 신명기 히브리어 배경을 반영하려는 의도는 있으나, 검토 대상인 그리스어 본문은 κύριον을 사용하며 영어 POB 감사 기록도 이를 ‘the Lord’로 유지합니다. 따라서 본문에서는 ‘주님’으로 옮기는 것이 직접적인 원문 충실성과 지정된 감사 기록에 맞습니다. 또한 ‘하였습니다’는 인용문 안에서 원문에 없는 발화 도입을 더합니다.
  naturalness: ‘또 기록되어 있습니다’는 γέγραπται의 성경 인용 관용을 자연스럽게 살립니다. ‘주 너의 하나님’은 성경 인용문에서 통용되는 자연스러운 어순이며, 명령 인용의 ‘시험하지 말라’도 적절합니다.
  terminology: κύριος는 본문에서 ‘주님’으로 일관되게 옮겼습니다. ‘야훼’로의 복원은 이 그리스어 본문 및 영어 POB의 용어 결정을 넘어서는 해석적 정규화이므로 채택하지 않았습니다. ἐκπειράσεις는 ‘시험하지 말라’로 옮기고, 대안 표현은 각주에 보존했습니다.
