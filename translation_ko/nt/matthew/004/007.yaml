  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
  footnotes:
  - marker: a
    text: Or simply, “You shall not test the Lord your God.” The Greek verb ἐκπειράζω can be rendered “test” or “put to the test.”
    reason: lexical_alternative
  - marker: b
    text: This cites Deuteronomy 6:16. The Greek “the Lord” reflects the Septuagint’s rendering of the divine name.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 그에게[b] 말씀하셨습니다. “또 기록되어 있습니다. ‘주 너의 하나님을 시험하지 말라[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주 너의 하나님을 시험에 들게 하지 말라.” 그리스어 동사 ἐκπειράζω는 “시험하다” 또는 “시험에 들게 하다”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이는 신명기 6:16을 인용한 것입니다. 그리스어 ‘주님’은 칠십인역에서 하나님의 이름을 옮긴 표현입니다.
    reason: cross_reference
