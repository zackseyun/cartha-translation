  source_fidelity: 원문의 ἤρξατο는 κηρύσσειν과 λέγειν 두 부정사를 함께 지배합니다. 초안의 ‘선포하기를 시작하시며 말씀하셨습니다’는 ‘말씀하셨습니다’를 이미 완료된 별도 행동처럼 만들고, -며가 동시 행위를 나타내어 원문의 ‘선포하고 말하기 시작하셨다’는 구조를 충분히 반영하지 못합니다. ‘하늘 나라가 가까이 왔습니다’는 ἤγγικεν의 완료상과 βασιλεία τῶν οὐρανῶν을 적절히 옮깁니다.
  naturalness: ‘선포하고 이렇게 말씀하기 시작하셨습니다’는 현대 표준어 합쇼체로 자연스럽고, 인용문을 도입하는 문장으로도 매끄럽습니다. ‘그때부터’ 및 ‘회개하십시오’도 문맥과 격식에 적절합니다.
  terminology: ‘회개하십시오’는 Μετανοεῖτε의 명령을 정확하고 확립된 신학 용어로 전달합니다. ‘하늘 나라’는 마태복음 특유의 표현을 자연스럽게 보존하며, 이를 ‘하나님의 나라’로 바꾸지 않는 것이 원문 표현에 충실합니다.
