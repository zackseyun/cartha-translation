review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the conditional offer and the physical act of falling down, but '절하면' can suggest ordinary bowing and does not adequately carry the worship sense favored by the immediate context. The explicit honorific '그분' is also not licensed for the speaking subject and leaves the source's two pronouns less clear.
  naturalness: The conditional wording is natural Korean, but '당신' is unnecessarily stiff in this dialogue. A direct first-person/second-person construction without an explicit second-person pronoun is more idiomatic while retaining the meaning.
  terminology: '''경배하다'' appropriately renders προσκυνέω here in light of the following verse''s exclusive worship of God. A note preserves the possible bodily/homage nuance. ''엎드려'' represents πεσών.'
  issues:
  - severity: medium
    issue: '''절하면'' is too semantically broad for προσκυνήσῃς in this context.'
    rationale: Although it can describe bowing, it may be heard as a conventional gesture of respect. The temptation context and Matthew 4:10 favor '경배하면,' while a footnote can retain the broader lexical range.
  - severity: low
    issue: The explicit second-person pronoun '당신' is stylistically awkward in the quoted demand.
    rationale: Korean normally omits the second-person pronoun when the verb and context make the addressee clear; omission improves naturalness without altering the source.
  revised_text: 그가 그에게 말했습니다. “네가 엎드려 내게 경배하면[a], 내가 이 모든 것을 네게 주겠습니다.”
