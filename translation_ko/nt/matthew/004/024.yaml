  rationale: 원문의 일반적 범주(‘병든 모든 이들’)와 그 안의 구체적 열거를 한국어에서 자연스럽게 유지했습니다. ‘귀신 들린 이들’은 초자연적 지시를 삭제하지 않으며, ‘발작을 하는 이들’과 각주는 세레니아조메누스의 전통적 번역과 어원적 배경을 모두 보존합니다.
