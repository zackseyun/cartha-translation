  naturalness: 서술은 현대 표준어 합쇼체로 자연스럽습니다. 인용문에서는 시험자의 도전적 발화를 반영하여 직접적 명령형을 사용하되, 「당신이 … 명령하시오」보다 「네가 … 말하라」가 더 자연스럽고 간결합니다.
  terminology: 「시험하는 자」는 ὁ πειράζων의 문맥상 적절한 번역입니다. 「하나님의 아들」 및 「빵」도 문맥과 현대어 용법에 맞습니다.
