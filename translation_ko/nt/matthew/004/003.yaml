    rationale: εἰ는 도전, 의심, 또는 가정의 조건으로 기능할 수 있습니다. 「아들이라면」은 이 모호성을 더 중립적으로 보존합니다.
  revised_text: 시험하는 자가 다가와 그분께 말했습니다. “네가 하나님의 아들이라면, 이 돌들이 빵이 되라고 말하라.”
