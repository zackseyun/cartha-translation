  to: 예수께서 온 갈릴리를 두루 다니시면서 그들의 회당에서 가르치시고 왕국의 복음을 선포하시며, 백성 가운데 모든 질병과 모든 허약함을 고치셨습니다.
  rationale: ‘나라’를 ‘왕국’으로 바꾸어 βασιλεία의 의미를 분명히 하되 원문에 명시되지 않은 ‘하나님’이나 ‘하늘’을 첨가하지 않았습니다. νόσος와 μαλακία의 두 항목 및 πᾶσαν의 반복은 ‘모든 질병과 모든 허약함’으로 유지했습니다. 영어 감사본의 ‘gospel’ 대안 각주는 한국어 본문이 이미 전통 용어 ‘복음’을 사용하므로 별도 각주가 필요하지 않습니다.
