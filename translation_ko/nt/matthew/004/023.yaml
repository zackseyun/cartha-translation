  source_fidelity: 원문의 미완료 동사 περιῆγεν이 나타내는 갈릴리 전역의 지속적인 순회, 동시적으로 이루어진 가르침·선포·치유, 그리고 πᾶσαν의 반복이 나타내는 포괄성을 모두 보존하도록 다듬었습니다. ‘그들의 회당’도 αὐτῶν을 유지합니다.
  naturalness: ‘나라의 복음’은 현대 한국어에서 ‘나라’를 국가로 이해하기 쉬우며 표현도 다소 부자연스럽습니다. 또한 ‘모든 약함을 고치셨습니다’는 마λακία에 대한 자연스러운 한국어 표현이 아닙니다. ‘왕국의 복음’ 및 ‘모든 질병과 모든 허약함’이 원문의 구별과 문장성을 더 잘 살립니다.
  terminology: ‘회당’과 ‘복음’은 한국어 성서 용례에 맞는 적절한 용어입니다. τῆς βασιλείας에는 원문에 없는 ‘하나님’ 또는 ‘하늘’을 보태지 않고 ‘왕국’으로 옮겼습니다.
