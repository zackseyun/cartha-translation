  - severity: low
    issue: 영어 감사 주석에 대응하는 한국어 주석 앵커 부재
    rationale: σκοτία의 가능한 대안 ‘짙은 어둠’을 제시하는 주석은 본문의 ‘어둠’에 앵커를 두는 것이 적절합니다. 원문은 ‘죽음’을 명시하므로 본문에서는 ‘사망의 … 그늘’을 유지합니다.
