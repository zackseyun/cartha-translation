  naturalness: 초안의 종결형 ‘보았고/떠올랐다’는 지정된 현대 표준어 합쇼체에 맞지 않습니다. ‘앉아 있는’, ‘이들에게는’, ‘떠올랐습니다’로 고쳐 자연스럽고 일관된 문체가 되게 했습니다.
  terminology: ‘백성’, ‘어둠’, ‘큰 빛’, ‘사망의 땅과 그늘’을 유지했습니다. ‘사망의 그늘’이라는 익숙한 성서 어휘를 보존하면서도 원문의 ‘땅과 그늘’ 병렬을 생략하지 않았습니다.
