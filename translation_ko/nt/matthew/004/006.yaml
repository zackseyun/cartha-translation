  text: 마귀가 예수께 말했습니다. “당신이 하나님의 아들이라면, 자신을 아래로 던지십시오. 기록되어 있습니다. ‘하나님께서 당신에 관하여 자기 천사들에게 명하실 것이며, 그들이 손으로 당신을 받들어 올려, 당신의 발이 돌에 부딪치지 않게 할 것이다.’”
