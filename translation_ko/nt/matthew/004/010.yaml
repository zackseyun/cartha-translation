review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 「야훼」는 인용의 배경인 신명기를 근거로 한 역번역이지만, 마태복음의 그리스어 본문은 Κύριον τὸν θεόν σου(‘주 너의 하나님’)라고 하므로, 본문 번역에서는 이를 임의로 「야훼」로 회복하지 않는 것이 원문 충실성에 맞습니다. 또한 γάρ는 ‘왜냐하면/…때문이다’로 드러나야 하며, γέγραπται는 성경 인용 도입 공식으로 자연스럽게 「기록되어 있기 때문이다」로 옮길 수 있습니다.
  naturalness: 「기록되어 있다. 『…』 하였다」는 인용 도입과 종결이 중복되고 한국어 문장 흐름도 부자연스럽습니다. 예수의 발화와 그 안의 성경 인용을 한 문장 안에서 명료하게 처리하고, 사탄을 향한 직접 명령은 권위적 평서체 명령형 「물러가라」로 유지하는 것이 적절합니다.
  terminology: Κύριος는 여기서 「주」, θεός는 「하나님」으로 구별하여 「주 너의 하나님」으로 번역합니다. προσκυνέω와 λατρεύω는 각각 「경배하다」와 「섬기다」로 구별해 보존합니다. 「오직 그분만을」은 αὐτῷ μόνῳ의 배타적 초점을 자연스럽게 나타냅니다.
  issues:
