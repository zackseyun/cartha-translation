  text: 그때 예수께서 그에게 말씀하셨습니다. “물러가라, 사탄아! 기록되어 있기 때문이다. ‘주 너의 하나님께 경배하고[a], 오직 그분만을 섬겨라[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주 너의 하나님께 절하라.” 그리스어 동사는 더 문자적으로는 경외의 뜻으로 엎드리거나 절하는 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
