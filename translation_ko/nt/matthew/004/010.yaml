    issue: Κύριον τὸν θεόν σου를 「너의 하나님 야훼」로 번역함
    rationale: 그리스어 원문에는 ‘야훼’라는 이름이 아니라 κύριος(주)가 쓰였습니다. 인용의 히브리어 배경을 근거로 본문에 신명을 삽입하는 것은 원문 번역을 넘어선 역번역입니다.
  - severity: medium
    issue: γάρ와 γέγραπται의 인용 도입이 부정확하고 중복됨
    rationale: 「기록되어 있다. 『…』 하였다」는 γάρ의 인과 관계를 빠뜨리고, ‘기록되어 있다’와 ‘하였다’로 인용 공식을 어색하게 이중화합니다.
  - severity: low
    issue: 핵심 동사의 의미 선택에 대한 주석 앵커 부재
    rationale: 경배와 섬김은 서로 다른 그리스어 동사이며, 각각의 어휘적 뉘앙스를 설명하는 주석을 해당 단어에 연결하는 것이 영어 감사 기록과도 일치합니다.
