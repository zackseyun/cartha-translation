  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
  footnotes:
  - marker: a
    text: χολή can mean 'gall' or more generally a bitter substance. The translation keeps 'gall' to reflect Matthew's wording; compare the related passion account in Mark 15:23, which mentions myrrh.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그분에게 쓸개[a]를 섞은 포도주를 마시도록 주었으나, 그분께서는 맛을 보신 뒤에 마시려 하지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘χολή’는 ‘쓸개’ 또는 더 넓게는 쓴 물질을 뜻할 수 있습니다. 본문은 마태의 표현을 따라 ‘쓸개’로 옮겼습니다. 마가복음 15:23의 관련 수난 기사에서는 몰약을 언급합니다.
    reason: lexical_alternative
