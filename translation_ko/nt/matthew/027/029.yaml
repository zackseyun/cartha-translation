  source_fidelity: 가시로 관을 엮어 머리에 두고, 갈대를 오른손에 놓고, 그 앞에 무릎을 꿇어 조롱하는 사건 순서와 핵심 동작은 대체로 반영합니다. 그러나 ‘갈대를 들리고는’은 한국어에서 자연스럽지 않고 ‘들리다’(소리가 들리다/들어 올려지다)로도 읽혀, κάλαμον ἐν τῇ δεξιᾷ αὐτοῦ(갈대를 그의 오른손에 놓다)를 정확히 전달하지 못합니다. 또한 Χαῖρε를 ‘평안하소서’로 옮기면 이 문맥의 조롱 섞인 왕실 경례가 약화됩니다.
  naturalness: ‘들리고는’은 비문에 가깝고, 인용문 앞의 쉼표 뒤에 ‘말하였습니다’를 잇는 방식도 현대 문장부호 관행상 매끄럽지 않습니다. ‘쥐여 주고’와 콜론을 사용하면 합쇼체 서술로 자연스럽습니다.
  terminology: ‘유대인의 왕’은 본문의 조롱하는 왕호를 자연스럽게 보존합니다. ‘만세!’는 이 문맥에서 Χαῖρε의 형식적 왕실 경례와 조롱의 효과를 가장 적절히 살립니다. Ἰουδαίων은 ‘유대인들’ 또는 ‘유대 지방 사람들’로도 논의될 수 있으나, 이 수난 서사의 정형 왕호에서는 ‘유대인의 왕’이 자연스럽고 충분히 충실합니다.
