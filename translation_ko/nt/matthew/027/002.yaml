  terminology: 인명 ‘빌라도’와 직함 ‘총독’은 한국어 성경 사용례와 그리스어 Πιλάτῳ τῷ ἡγεμόνι에 잘 부합합니다. 신학적 해석을 추가하지 않았습니다.
