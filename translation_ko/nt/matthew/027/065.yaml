    issue: 인용문이 합쇼체가 아니라 해라체입니다.
    rationale: 대상 변형이 현대 공식·공손한 합쇼체이므로 ‘너희에게 … 지키라’는 ‘여러분에게 … 지키십시오’로 바꾸어야 합니다.
  - severity: medium
    issue: ‘경비병’은 κουστωδίαν의 집합적 의미를 지나치게 단수화합니다.
    rationale: κουστωδία는 경비 임무 또는 경비대(guard detail/watch)를 뜻하므로 ‘경비대’가 더 정확합니다.
  - severity: low
    issue: Ἔχετε의 해석상 모호성이 각주 없이 드러나지 않습니다.
    rationale: 이는 경비대를 주겠다는 허가일 수도, 이미 가진 경비대에 대한 언급일 수도 있으므로, 본문은 중립적으로 유지하고 각주로 대안을 밝혀야 합니다.
