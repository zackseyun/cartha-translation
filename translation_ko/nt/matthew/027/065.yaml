review_pass:
  verdict: revise
  source_fidelity: Ἔχετε κουστωδίαν은 직설법 형태로, 경비대를 이미 가지고 있다는 진술일 수도 있고 경비대를 사용하도록 허락하는 말일 수도 있습니다. 본문은 이를 단정하지 않고 ‘경비대가 있습니다’로 보존하며, 각주에서 가능한 다른 이해를 제시합니다. ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε는 ‘가서 ... 아는 방법대로 확실히 지키십시오’로, 명령과 방법·능력의 한정을 유지합니다.
  naturalness: 초안의 직접 인용은 ‘너희에게’, ‘지키라’라는 해라체여서 요청된 현대 공식 합쇼체와 일치하지 않습니다. ‘여러분에게 ... 있습니다’, ‘지키십시오’로 고쳤습니다. 또한 ‘너희가 아는 대로 굳게 지키라’보다 ‘여러분이 아는 방법대로 확실히 지키십시오’가 현대 표준어로 더 자연스럽습니다.
  terminology: κουστωδίαν은 한 명의 ‘경비병’이라기보다 경비를 맡은 인원 또는 경비대/경비를 가리키므로 ‘경비대’로 옮겼습니다. 논쟁적인 역사적 소속(로마 경비대인지, 유대 지도자 측 경비인지)은 본문에서 결정하지 않았습니다.
  issues:
