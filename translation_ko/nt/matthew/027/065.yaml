  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
  footnotes:
  - marker: a
    text: Or 'Take a guard,' or possibly 'You have your own guard.' The Greek can be understood either as Pilate granting a guard or referring to one already available to them.
    reason: alternative_reading
  - marker: b
    text: Or 'make it as secure as you know how'.
    reason: previous_rendering
translation:
  language: ko
  text: 빌라도가 그들에게 말하였습니다. 「여러분에게 경비대가 있습니다[a]. 가서 여러분이 아는 방법대로 확실히 지키십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “경비대를 데리고 가십시오.” 또는 “여러분에게는 자체 경비대가 있습니다.” 그리스어는 빌라도가 경비대를 사용하도록 허락한 것으로도, 그들이 이미 이용할 수 있는 경비대가 있다고 말한 것으로도 이해될 수 있습니다.
    reason: alternative_reading
