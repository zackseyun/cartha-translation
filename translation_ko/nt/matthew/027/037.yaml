review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys placement above Jesus’ head and the inscription’s basic content, but ‘죄 패’ is archaic and can imply that the placard itself is a ‘sin tablet’ rather than the judicial charge/accusation (αἰτία) written on it. The revision renders the judicial sense explicitly and retains γεγραμμένην (‘written’).
  naturalness: ‘그리고’ and ‘죄 패’ are not natural choices in modern formal Korean. ‘그들은 … 표지를 붙였습니다’ is clear, contemporary, and suitably formal-polite.
  terminology: ‘유대인의 왕’ is the established Korean rendering of the royal title. A footnote preserves the possible geographical sense of Ἰουδαίων without displacing the contextually standard wording. ‘혐의’ communicates the judicial force of αἰτία without adding theological interpretation.
  issues:
  - severity: medium
    issue: ‘죄 패’ is archaic and semantically imprecise.
    rationale: αἰτία in this context denotes the charge or accusation against Jesus, and γεγραμμένην indicates that it was written. ‘그에 대한 혐의가 적힌 표지’ expresses both elements naturally.
  - severity: low
    issue: The draft’s opening connective ‘그리고’ is unnecessary and less natural in this standalone verse.
    rationale: The Greek καί may be rendered without an explicit Korean connective here.
  - severity: low
    issue: The alternative sense of Ἰουδαίων is not preserved.
    rationale: While ‘유대인’ is appropriate in this fixed royal title, ‘Judeans’ remains a possible lexical alternative and should be footnoted at the term it qualifies.
  revised_text: 그들은 그의 머리 위에 그에 대한 혐의가 적힌 표지를 붙였습니다. 그 글에는 “이는 유대인의[a] 왕 예수이다”라고 쓰여 있었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “유대 지방 사람들의 왕.” 그리스어 ‘유대인’은 문맥에 따라 유대 지방 사람들을 가리킬 수도 있습니다.
    reason: alternative_reading
  revision_rationale: The revision replaces the archaic and potentially misleading ‘죄 패’ with a modern expression that retains the judicial meaning of αἰτία and the written nature of the accusation. It preserves the direct form of the inscription and adds a narrowly framed lexical footnote for Ἰουδαίων, anchored to ‘유대인의.’
