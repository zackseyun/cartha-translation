base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
  footnotes:
  - marker: a
    text: Or “the accusation against him.” The Greek αἰτίαν has a judicial sense here.
    reason: lexical_alternative
  - marker: b
    text: Or “the King of the Judeans.” Greek Ἰουδαίων can mean either “Jews” or “Judeans,” depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 그의 머리 위에 그에 대한 혐의가 적힌 표지를 붙였습니다. 그 글에는 “이는 유대인의[a] 왕 예수이다”라고 쓰여 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대 지방 사람들의 왕.” 그리스어 ‘유대인’은 문맥에 따라 유대 지방 사람들을 가리킬 수도 있습니다.
    reason: alternative_reading
