revisions:
- from: 그리고 그의 머리 위에 그에 대한 죄 패를 두었으니, 거기에는 「이는 유대인의 왕 예수라」라고 쓰여 있었습니다.
  to: 그들은 그의 머리 위에 그에 대한 혐의가 적힌 표지를 붙였습니다. 그 글에는 “이는 유대인의[a] 왕 예수이다”라고 쓰여 있었습니다.
  rationale: The revision replaces the archaic and potentially misleading ‘죄 패’ with a modern expression that retains the judicial meaning of αἰτία and the written nature of the accusation. It preserves the direct form of the inscription and adds a narrowly framed lexical footnote for Ἰουδαίων, anchored to ‘유대인의.’
  reviewer_model: gpt-5.6-terra
