translation:
  language: ko
  text: 그리고 곧바로 그들 중 한 사람이 달려가 해면을 가져다가 신 포도주[a]로 적시고, 그것을 갈대[b]에 꽂아 그에게 마시게 하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘식초’. 그리스어 ὄξος는 신 포도주 또는 포도주 식초를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지팡이’. 그리스어 καλάμος는 갈대나 갈대 같은 막대기를 가리킬 수 있습니다.
    reason: lexical_alternative
