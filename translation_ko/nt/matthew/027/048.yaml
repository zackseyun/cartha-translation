  source_fidelity: 달려감, 해면, 신 포도주, 갈대, 마시게 함의 기본 순서는 보존합니다. 그러나 πλήσας는 해면을 신 포도주로 채우거나 충분히 적시는 행위인데, 현행의 ‘신 포도주에 적셔’는 다소 약하며, περιθεὶς καλάμῳ를 ‘갈대에 매어’로 옮기면 원문에 없는 묶는 방식을 특정합니다. 또한 ἐπότιζεν의 미완료상은 진행·반복의 뉘앙스를 반영하는 편이 좋습니다.
