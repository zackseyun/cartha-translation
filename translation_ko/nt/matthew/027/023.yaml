  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “Why, what wrong has he done?”
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has “Crucify him.” The Greek is more literally, “Let him be crucified.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그가 말하였습니다[a]. “그가 무슨 악한 일을 하였습니까?” 그러나 그들은 더욱더 크게 외쳤습니다[b]. “그를 십자가에 못 박히게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 자연스럽게는, “어찌하여, 그가 무슨 잘못을 하였습니까?”
    reason: lexical_alternative
  - marker: b
    text: 전통적인 번역은 “그를 십자가에 못 박으십시오”라고 합니다. 그리스어는 더 문자적으로, “그가 십자가에 못 박히게 하십시오”입니다.
    reason: alternative_reading
