  source_fidelity: 첫 질문은 τί γὰρ κακὸν ἐποίησεν의 도전적 물음을 충실히 옮겨야 하며, 그리스어의 수동 명령형 Σταυρωθήτω는 한국어에서도 가능하면 수동·사역 구문으로 드러내는 것이 좋습니다. 초안의 ‘십자가에 못 박으십시오’는 자연스럽지만 능동 명령으로 바뀝니다. 또한 ἔκραζον의 미완료적·반복적 뉘앙스와 περισσῶς의 강화는 ‘더욱더 크게 외쳤습니다’로 자연스럽게 반영됩니다.
  naturalness: 초안의 인용문 ‘하였느냐?’는 해라체이므로, 본문의 현대 격식체 합쇼체와 일치하지 않습니다. ‘하였습니까?’로 고쳐야 합니다. ‘소리치며 말하였습니다’는 한국어에서 다소 중복되므로 직접 인용과 함께 ‘외쳤습니다’로 처리하는 편이 자연스럽습니다.
  terminology: ‘악한 일’은 κακόν의 도덕적 무게를 유지하는 적절한 표현입니다. ‘십자가에 못 박히게 하십시오’는 한국어에서 다소 무겁지만, 수동 명령의 의미를 보존하는 안전한 표현입니다. 인물과 신학적 해석을 추가하지 않았습니다.
  issues:
  - severity: medium
    issue: 인용문 종결이 합쇼체와 불일치합니다.
    rationale: ‘그가 무슨 악한 일을 하였느냐?’는 해라체입니다. 지정된 현대 격식체에는 ‘그가 무슨 악한 일을 하였습니까?’가 맞습니다.
  - severity: medium
    issue: 수동 명령형의 의미가 능동 명령으로 바뀌었습니다.
    rationale: Σταυρωθήτω는 3인칭 단수 수동 부정과거 명령형입니다. 초안의 ‘십자가에 못 박으십시오’는 자연스러운 관용 표현이지만 능동형이므로, ‘그를 십자가에 못 박히게 하십시오’로 수동적 의미를 보존합니다.
  - severity: low
    issue: ‘소리치며 말하였습니다’가 다소 중복되고 미완료의 반복성을 충분히 나타내지 못합니다.
    rationale: ἔκραζον λέγοντες는 직접 인용과 함께 ‘더욱더 크게 외쳤습니다’로 자연스럽게 옮길 수 있으며, ‘더욱더’가 περισσῶς의 강화도 반영합니다.
