id: MAT.27.27
reference: Matthew 27:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
  footnotes:
  - marker: a
    text: Or 'the governor’s headquarters.' The Greek term refers to the official residence or military headquarters of the Roman governor.
    reason: lexical_alternative
  - marker: b
    text: '''Cohort'' translates a Roman military term; it can refer to a unit of soldiers rather than necessarily every soldier in a full cohort being physically present.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 총독의 군사들이 예수를 총독 관저[a]로 데려가서, 온 부대[b]를 그 둘레에 모았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘총독의 본부’. 그리스어 ‘프라이토리온’은 로마 총독의 공식 관저나 행정·군사 본부를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부대’는 로마 군사 단위를 가리킵니다. 이 표현이 반드시 완편된 한 부대의 모든 군사가 실제로 그 자리에 있었다는 뜻은 아닐 수 있습니다.
    reason: cultural_note
