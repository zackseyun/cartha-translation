  text: Now on the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
  footnotes:
  - marker: a
    text: Or 'which is after Preparation.' The Greek term can denote the preparation day before the Sabbath; translating it as 'Friday' would be more interpretive than the source text requires.
