translation:
  language: ko
  text: 그 이튿날[a], 곧 예비일 다음 날에 대제사장들과 바리새인들이 빌라도에게 모였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예비일 후에.” 그리스어 ‘예비일’은 안식일 전날을 가리킬 수 있습니다. 이를 ‘금요일’로 옮기는 것은 본문이 요구하는 것보다 더 해석적입니다.
    reason: lexical_alternative
