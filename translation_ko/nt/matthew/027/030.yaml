  source_fidelity: 원문의 부정과거 분사 ἐμπτύσαντες의 선행 행위, κάλαμον(갈대), 그리고 미완료 ἔτυπτον의 반복·지속성을 전반적으로 충실히 옮겼습니다. 다만 ‘갈대를 가져다가’는 문맥상 가능하나 λαμβάνω의 ‘집어 들다/취하다’보다 ‘가져오다’의 뉘앙스를 낼 수 있어 더 직접적인 표현으로 다듬는 것이 안전합니다.
  naturalness: ‘그에게 침을 뱉은 뒤, 갈대를 집어 들어 그의 머리를 계속 때렸습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 사건의 순서와 반복성을 명료하게 드러냅니다.
  terminology: ‘침을 뱉다’, ‘갈대’, ‘머리’, ‘계속 때리다’는 모두 문맥과 일반 성서 번역 용례에 적절합니다. ‘갈대’를 ‘지팡이’로 해석적으로 바꾸지 않아 원문의 어휘 연결을 보존했습니다.
  issues:
  - severity: low
    issue: ‘갈대를 가져다가’의 동작 뉘앙스
    rationale: λαμβάνω는 여기서 갈대를 ‘취하다/집어 들다’라는 뜻입니다. ‘가져다가’도 가능하지만, 가져오는 이동을 다소 암시할 수 있으므로 ‘집어 들어’가 더 직접적입니다.
  revised_text: 그리고 그에게 침을 뱉은 뒤, 갈대를 집어 들어 그의 머리를 계속 때렸습니다.
  revised_footnotes:
  - marker: a
    text: ‘계속 때렸습니다’로 옮긴 그리스어 미완료 동사는 반복되거나 지속된 행동을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 ‘칼라모스’는 ‘갈대’를 뜻하며, 갈대처럼 생긴 막대기를 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 분사의 선행 순서를 ‘침을 뱉은 뒤’로 분명히 하고, ‘갈대를 가져다가’를 원문의 λαμβάνω에 더 가까운 ‘갈대를 집어 들어’로 조정했습니다. 미완료 동사의 반복성을 ‘계속’으로 유지했습니다.
