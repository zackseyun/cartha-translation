  source_fidelity: 원문의 명령법, 시간 한정, 제자들이 예수의 시신을 훔쳐 부활을 주장할 것이라는 우려, 그리고 ‘마지막 미혹’과 ‘처음 미혹’의 비교는 대체로 충실히 옮겼습니다. 그러나 Ἠγέρθη는 수동태인데, 초안의 ‘일어났다’는 능동/자동사 표현으로 수동태의 형태를 보존하지 못합니다. 또한 ἀσφαλισθῆναι는 단순히 ‘단단히 지키다’보다 무덤을 안전하게 확보·경비하게 한다는 뜻입니다.
  naturalness: 합쇼체는 일관되며 전반적으로 자연스럽습니다. 다만 ‘죽은 자들로부터’보다 현대 표준 한국어에서는 ‘죽은 사람들 가운데서’가 더 자연스럽고, ‘마지막 미혹이 처음 것보다’는 ‘마지막 속임수가 처음 속임수보다’로 보완하면 생략된 명사를 한국어에서 명료하게 전달할 수 있습니다.
