  to: 「그가 하나님을 신뢰했으니, 하나님께서 지금 그를 원하신다면 그를 구원하시게 하라.[a] 그가[b] ‘나는 하나님의 아들이다’라고 말했기 때문이다.」
  rationale: The revision makes God—the implied subject of ῥυσάσθω and θέλει—explicit, resolving Korean pronoun ambiguity while retaining the Greek sequence, immediacy (‘지금’), and taunting imperative. It preserves ‘원하신다면’ as the direct rendering of θέλει αὐτόν, while documenting the Psalm 22 allusion and its possible ‘delights in him’ nuance in a footnote. ‘하나님의 아들’ retains the contextual titular force of Θεοῦ … υἱός without adding doctrinal explanation.
