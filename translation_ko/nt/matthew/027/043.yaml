  source_fidelity: 'The draft conveys the principal clauses, but its repeated pronouns obscure the distinct referents: Jesus is the one who trusted and spoke, while God is the implied subject of ‘rescue’ and ‘want.’ The Greek perfect πέποιθεν is appropriately represented by ‘신뢰했으니,’ and θέλει αὐτόν is retained as ‘그를 원하신다면,’ without importing the Psalmic interpretive nuance into the text.'
  naturalness: Explicitly naming 하나님 as the subject of the imperative clause makes the taunt readily intelligible in modern formal Korean. ‘하나님께서 … 구원하시게 하라’ is an idiomatic formal rendering of the third-person imperative in this hostile challenge.
  terminology: ‘하나님,’ ‘구원하시게 하라,’ and ‘하나님의 아들’ are standard Korean biblical terminology. The honorific on God is appropriate; the direct self-identification remains formal and natural.
  issues:
