  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
  footnotes:
  - marker: a
    text: Or 'if he delights in him.' The wording echoes Psalm 22:8, where the sense of divine favor is prominent.
    reason: alternative_reading
  - marker: b
    text: This taunt closely echoes Psalm 22:8, linking the mockery of Jesus with the righteous sufferer in that psalm.
    reason: cross_reference
translation:
  language: ko
  text: 「그가 하나님을 신뢰했으니, 하나님께서 지금 그를 원하신다면 그를 구원하시게 하라.[a] 그가[b] ‘나는 하나님의 아들이다’라고 말했기 때문이다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 기뻐하시면.’ 이 표현은 시편 22:8을 반영하며, 그곳에서는 하나님께서 그를 기뻐하신다는 뜻이 두드러집니다.
    reason: alternative_reading
  - marker: b
    text: 이 조롱은 시편 22:8을 밀접하게 반영하여, 예수님에 대한 조롱을 그 시편의 의로운 고난받는 이와 연결합니다.
    reason: cross_reference
