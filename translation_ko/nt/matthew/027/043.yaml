    issue: Ambiguous pronoun reference in the rescue clause
    rationale: In ‘만일 그가 그를 원하시거든 지금 그를 구원하시게 하라,’ readers must infer that the honorific subject is God and that the other pronouns refer to Jesus. The Greek’s implied subject is contextually God, but Korean benefits from making this subject explicit.
  - severity: low
    issue: Psalm 22 allusion and semantic alternative are unmarked
    rationale: The wording is rightly translated as ‘원하신다면,’ but the supplied audit trail identifies a meaningful allusive alternative (‘기뻐하시면’) and the Psalm 22:8 echo. Footnotes can preserve these without changing the source-primary rendering.
