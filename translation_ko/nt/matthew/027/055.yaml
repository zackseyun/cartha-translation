review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 δέ는 약한 연결사이므로 문두의 ‘이제’는 근거 없이 시간성을 더합니다. 또한 ‘따라와’는 가능하지만, ‘갈릴리에서부터 예수를 따라왔고’가 ἠκολούθησαν과 ἀπὸ τῆς Γαλιλαίας를 더 직접적으로 드러냅니다. ‘멀리서 지켜보고 있던’은 ἀπὸ μακρόθεν θεωροῦσαι의 지속적 관찰을 자연스럽게 옮깁니다.
  naturalness: 개정문은 현대 표준 한국어의 정중한 서술체로 자연스럽습니다. ‘그분을 섬기던’은 διακονοῦσαι의 폭넓은 섬김/지원의 뜻을 유지하며 특정 교회 직분을 암시하지 않습니다.
  terminology: ‘여자들’, ‘갈릴리’, ‘예수’, ‘섬기다’는 본문 및 한국어 성경 문맥에 적절합니다. 예수에 대한 대명사는 한국어의 자연스러운 존중 표현으로 ‘그분’을 사용하되, 원문에 없는 신학적 의미를 더하지 않습니다.
  issues:
  - severity: medium
    issue: 문두의 ‘이제’
    rationale: Ἦσαν δὲ에는 명시적인 시간 부사 ‘이제’가 없습니다. δέ의 약한 장면 연결 기능을 한국어에서 반드시 별도 어휘로 옮길 필요가 없으므로 삭제해야 합니다.
  - severity: low
    issue: ‘갈릴리에서부터 예수를 따라와’의 의미 관계
    rationale: 원문의 ἠκολούθησαν은 ‘따랐다’이며, ‘따라와’도 문맥상 가능하지만 이동의 도착을 상대적으로 강하게 부각합니다. ‘따라왔고’가 과거의 동행과 이후 십자가 장면의 관계를 더 분명히 합니다.
  revised_text: 거기에는 멀리서 지켜보고 있던 여자들이 많이 있었습니다. 그들은 갈릴리에서부터 예수를 따라왔고 그분을 섬기던 사람들이었습니다.
