revisions:
- from: 이제 거기에 많은 여자들이 있었으니, 그들은 멀리서 보고 있었으며, 갈릴리에서부터 예수를 따라와 그를 섬기던 자들이었습니다.
  to: 거기에는 멀리서 지켜보고 있던 여자들이 많이 있었습니다. 그들은 갈릴리에서부터 예수를 따라왔고 그분을 섬기던 사람들이었습니다.
  rationale: 근거 없는 시간 표지 ‘이제’를 제거하고, 원문의 관찰(θεωροῦσαι), 갈릴리로부터 예수를 따름(ἠκολούθησαν ἀπὸ τῆς Γαλιλαίας), 섬김(διακονοῦσαι)을 자연스러운 한국어로 보존했습니다. 원문이 섬김의 구체적 형태를 규정하지 않으므로 추가 설명이나 교리적 한정은 넣지 않았습니다.
