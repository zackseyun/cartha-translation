    reason: ὑμεῖς ὄψεσθε의 직역 가능성과 문맥상 기능을 보존합니다.
  revision_rationale: 원문의 시제·동작 순서와 책임 면제의 관용 표현을 더 정확히 반영하고, 현대 표준 한국어 합쇼체의 자연스러운 문장으로 다듬었습니다. '이 피'는 그리스어의 표현을 그대로 보존했으며, 빌라도의 말은 그의 주장으로만 제시합니다.
