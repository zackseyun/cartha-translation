review_pass:
  verdict: revise
  source_fidelity: 핵심 사건 순서는 대체로 반영했지만, οὐδὲν ὠφελεῖ는 빌라도가 '아무것도 얻지 못한다'는 뜻보다 자신의 시도가 아무 효과가 없음을 뜻합니다. 또한 현재분사 '일어나는'과 '손을 씻으며'는 원문의 완료된 동작보다 덜 정확합니다. ἀπὸ τοῦ αἵματος τούτου는 '이 피에 대하여'보다 책임 면제의 관용적 의미가 드러나는 '이 피에 대해서는'이 자연스럽습니다. ὑμεῖς ὄψεσθε의 강조와 미래/명령적 책임 전가도 '너희가 알아서 할 일이다'보다 '너희가 스스로 책임져라'가 더 충실합니다.
  naturalness: 합쇼체 서술은 대체로 자연스럽지만, 직접 인용문 안의 '무죄하다'는 현대 표준 한국어 문장으로 다소 부자연스럽고, '말하였습니다,' 뒤의 쉼표도 인용 연결에 적절하지 않습니다. '나는 이 피에 대해서는 책임이 없습니다'와 '너희가 스스로 책임져라'가 현대적이고 문맥상 명료합니다.
  terminology: 빌라도, 무리, 소요는 적절합니다. 다만 법적·도덕적 책임을 부인하는 ἀθῷος 및 피 흘림에 대한 책임이라는 관용을 한국어에서 명시하는 것이 필요합니다. 이는 빌라도의 주장을 번역하는 것이며 그 주장의 진실성을 확정하지 않습니다.
  issues:
  - severity: medium
    issue: οὐδὲν ὠφελεῖ를 '자기가 아무것도 얻지 못하고'로 옮김
    rationale: 이 표현은 빌라도의 개입이나 시도가 아무 소용이 없다는 뜻입니다. 개인적 이득을 얻지 못한다는 의미로 읽힐 수 있습니다.
  - severity: medium
    issue: ἀπενίψατο를 '손을 씻으며'로 옮김
    rationale: 원문은 물을 취한 뒤 손을 씻은 완료된 동작을 서술합니다. '-며'는 동시 진행의 뉘앙스를 더합니다.
  - severity: medium
    issue: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου를 '나는 이 피에 대하여 무죄하다'로 옮김
    rationale: 한국어 표현이 부자연스럽고, 죽음/피 흘림에 대한 책임 면제라는 관용적 뜻이 충분히 드러나지 않습니다.
  - severity: medium
    issue: ὑμεῖς ὄψεσθε를 '너희가 알아서 할 일이다'로 옮김
    rationale: 명시된 2인칭 복수 강조와 책임을 넘기는 미래/명령적 기능을 약화합니다. '너희가 스스로 책임져라'가 더 직접적입니다.
  revised_text: 그래서 빌라도는 자기의 시도가 아무 소용이 없고 도리어 소요가 일어나고 있는 것을 보고, 물을 가져다가 무리 앞에서 손을 씻고 말하였습니다. “나는 이 피에 대해서는 책임이 없습니다. 너희가 스스로 책임져라.”
  revised_footnotes:
