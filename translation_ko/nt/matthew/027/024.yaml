review_pass:
  verdict: revise
  source_fidelity: 초안의 핵심 의미는 대체로 원문을 따르지만, οὐδὲν ὠφελεῖ는 빌라도의 시도가 아무 효과가 없었다는 뜻이므로 ‘아무것도 얻지 못하고’보다 ‘아무런 효과도 거두지 못하고’가 더 정확합니다. 또한 ὑμεῖς ὄψεσθε의 강조와 관용적 책임 전가의 뜻을 살려 ‘여러분이 알아서 하십시오’로 옮기는 것이 적절합니다.
  naturalness: ‘이 피에 대하여 무죄하다’는 현대 한국어에서 다소 직역투입니다. ‘이 피에 대해서는 나는 죄가 없습니다’가 자연스럽고, 공적·법정적 상황에 맞는 합쇼체 문체입니다. 손을 씻는 행위는 말하기에 앞선 행위이므로 ‘씻고 말하였습니다’가 ‘씻으며 말하였습니다’보다 문맥에 맞습니다.
  terminology: ‘빌라도’, ‘무리’, ‘피’, ‘죄가 없습니다’는 표준적인 성경 번역 용어이며, 빌라도 자신의 책임 부인이라는 발화로만 제시하여 그 주장의 진위를 번역이 판단하지 않습니다. θόρυβος는 ‘소요’로 유지하되 대안 의미를 각주로 제시합니다.
  issues:
  - severity: medium
    issue: ‘자기가 아무것도 얻지 못하고’
    rationale: οὐδὲν ὠφελεῖ는 빌라도가 개인적으로 무엇을 얻지 못했다기보다 자신의 조치가 아무 효과가 없었다는 뜻입니다.
  - severity: low
    issue: ‘이 피에 대하여 무죄하다’
    rationale: 의미는 전달되나 현대 한국어로는 어색합니다. ‘이 피에 대해서는 나는 죄가 없습니다’가 원문의 책임 면제 관용구를 자연스럽게 전달합니다.
  - severity: low
    issue: ‘손을 씻으며 말하였습니다’
    rationale: λαμβὼν과 ἀπενίψατο는 손을 씻은 뒤 발언한 연속 행위이므로 ‘씻고 말하였습니다’가 더 적절합니다.
  - severity: medium
    issue: ‘너희가 알아서 할 일이다’
    rationale: ὑμεῖς의 강조와 ὄψεσθε의 관용적 ‘스스로 처리하다/책임지다’의 뉘앙스가 약해집니다. 직접 발화에 맞게 ‘여러분이 알아서 하십시오’로 옮깁니다.
  revised_text: 그래서 빌라도는 자기가 아무런 효과도 거두지 못하고, 오히려 소요가 일어나고 있는 것을 보고 물을 가져다가 무리 앞에서 손을 씻고 말하였습니다. 「이 피에 대해서는 나는 죄가 없습니다[b]. 여러분이 알아서 하십시오[c].」
  revised_footnotes:
