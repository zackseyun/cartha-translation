  rationale: 역사적 현재 ‘말합니다’와 대명사 ‘그에게’를 유지하면서, 법정적 동사 καταμαρτυρέω를 ‘불리한 증언을 하다’로 자연스럽게 반영했습니다. πόσα의 복수적 수량은 ‘얼마나 많이 하는 증언’으로 표현하여, 원문의 ‘얼마나 많은 증언/사안’을 묻는 뜻을 보존했습니다.
