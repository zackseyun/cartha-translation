review_pass:
  verdict: revise
  source_fidelity: 초안은 τότε와 역사적 현재 λέγει를 각각 ‘그때에’, ‘말합니다’로 잘 반영합니다. 그러나 πόσα의 복수적 양(‘얼마나 많은 것들/증언’)이 ‘얼마나 많이’로 약화되며, καταμαρτυροῦσιν의 법정적 ‘불리한 증언을 하다’라는 뜻도 더 분명하고 자연스럽게 옮길 수 있습니다.
  naturalness: ‘너를 거슬러 얼마나 많이 증언하고 있는지’는 현대 표준어에서 다소 직역투입니다. ‘당신에게 불리한 증언을 얼마나 많이 하는지’가 법정 장면에 자연스럽고 합쇼체 직접화법에도 맞습니다.
  terminology: ‘증언’은 καταμαρτυρέω의 증언·법정 의미를 유지하며, 단순히 ‘고발하다’로 축소하지 않습니다. 한국어 합쇼체 요구에 따라 직접 발화는 ‘듣지 못합니까?’로 처리했습니다.
  issues:
  - severity: medium
    issue: πόσα의 수량적 복수 표현이 약화됨
    rationale: ‘얼마나 많이 증언하고 있는지’는 행위의 정도나 빈도로 읽히기 쉽습니다. 원문은 그들이 증언하는 사안/증언의 수가 얼마나 많은지를 묻습니다.
  - severity: medium
    issue: ‘너를 거슬러’가 현대 표준어에서 부자연스러움
    rationale: 원문의 법정적 대적 관계는 ‘당신에게 불리한 증언’으로 옮기면 더 자연스럽고 정확합니다.
  - severity: low
    issue: 직접화법의 종결이 합쇼체가 아님
    rationale: 요구된 현대 격식체에 맞추어 ‘듣지 못합니까?’로 조정합니다.
