translation:
  language: ko
  text: 그것을 자신의 새 무덤, 곧 그가 바위 속에 파서 만든 무덤에 두었습니다. 그리고 큰 돌을 무덤 입구[a]에 굴려 놓고 떠났습니다.
  philosophy: optimal-equivalence
