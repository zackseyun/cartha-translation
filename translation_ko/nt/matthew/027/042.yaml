revisions:
- from: 「그가 남은 구원하였으나 자기는 구원할 수 없다. 그가 이스라엘의 왕이라면 지금 십자가에서 내려오라, 그러면 우리가 그를 믿겠다.」
  to: 「그는 다른 사람들은 구원하였으나, 자신은 구원할 수 없습니다. 그는 이스라엘의 왕입니다. 지금 십자가에서 내려오십시오. 그러면 우리가 그를 믿겠습니다.」
  rationale: 원문의 두 절로 된 조롱을 한국어에서도 분명히 유지했습니다. ‘이스라엘의 왕입니다’는 원문의 직설을 보존하며, 영어 각주에 제시된 조건적 해석은 본문에 넣지 않았습니다. 별도 각주는 한국어 본문 이해나 본문비평상 필수 사항이 아니므로 두지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:44:43Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘남은’은 ἄλλους(다른 사람들)를 정확히 옮기지 못하며, ‘이라면’은 원문의 직설적 명사절 ‘이스라엘의 왕이다’를 조건문으로 바꿉니다. 원문은 조롱의 맥락에서도 조건절을 명시하지 않습니다.
  naturalness: ‘다른 사람들은 구원하였으나 자신은 구원할 수 없습니다’ 및 ‘지금 십자가에서 내려오십시오’는 현대 표준어 합쇼체로 자연스럽고, τρί인칭 명령의 도전적 어조를 무리 없이 전달합니다.
  terminology: σῴζω는 여기서 즉각적인 구출/치유의 주장과 더 넓은 의미를 함께 허용하도록 ‘구원하다’로 유지합니다. βασιλεὺς Ἰσραήλ은 ‘이스라엘의 왕’, σταυρός는 ‘십자가’, πιστεύω ἐπί + 대격은 ‘그를 믿다’로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘남은’
    rationale: Ἄλλους는 ‘나머지’가 아니라 ‘다른 사람들/다른 이들’입니다. ‘남은’은 특정 집단에서 남겨진 사람들을 뜻할 수 있어 원문의 대조를 왜곡합니다.
  - severity: high
    issue: ‘그가 이스라엘의 왕이라면’
    rationale: βασιλεὺς Ἰσραήλ ἐστιν은 조건문이 아닌 직설적 명사절입니다. 조롱의 화용론을 살리기 위해 ‘이라면’을 보충할 필요가 없으며, 그렇게 하면 문법적 의미가 달라집니다.
  - severity: low
    issue: 명령 및 미래 진술의 합쇼체 미준수
    rationale: 대상 변종이 현대 formal-polite 합쇼체이므로 ‘내려오십시오’, ‘믿겠습니다’로 통일하는 것이 적절합니다.
  revised_text: 「그는 다른 사람들은 구원하였으나, 자신은 구원할 수 없습니다. 그는 이스라엘의 왕입니다. 지금 십자가에서 내려오십시오. 그러면 우리가 그를 믿겠습니다.」
