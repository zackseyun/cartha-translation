  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
  footnotes:
  - marker: a
    text: Or, 'If he is the King of Israel, let him come down now from the cross, and we will believe in him.' Some English translations make the mockery explicit by supplying a conditional sense, but the Greek here states the title directly.
    reason: alternative_reading
translation:
  language: ko
  text: 「그는 다른 사람들은 구원하였으나, 자신은 구원할 수 없습니다. 그는 이스라엘의 왕입니다. 지금 십자가에서 내려오십시오. 그러면 우리가 그를 믿겠습니다.」
  philosophy: optimal-equivalence
