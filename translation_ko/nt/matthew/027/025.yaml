  source_fidelity: 현 초안의 ‘그의 피를 우리와 우리 자녀에게 돌리시오’는 그리스어의 명령 대상이 명시되지 않은 무동사 책임 귀속/저주적 발화를 한국어 직접 명령으로 바꾸며, ‘피를 …에게 돌리다’의 목적어 구성도 부자연스럽습니다. ‘그의 피가 …에게 돌아가기를 바랍니다’는 αἷμα와 ἐφ᾽ ἡμᾶς/ἐπὶ τὰ τέκνα ἡμῶν의 책임 귀속 및 기원적 힘을 보존합니다.
  naturalness: ‘그러자 온 백성이 대답했습니다’는 현대 표준어 합쇼체 서술로 자연스럽습니다. 인용문은 ‘피가 …에게 돌아가기를 바랍니다’로 처리하여 원문의 저주적·기원적 표현을 현대 한국어에서 명료하게 재현합니다.
  terminology: λαός는 장면 속 집합을 가리키는 ‘온 백성’으로 옮겼고, τέκνα는 의미를 넓히지 않고 ‘우리 자녀’로 옮겼습니다. ‘피’는 죽음에 대한 책임이라는 함의를 본문에서 해설하지 않고 그대로 유지했습니다.
