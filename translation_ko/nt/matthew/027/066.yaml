  source_fidelity: 초안의 ‘무덤을 굳게 지켰습니다’는 ἠσφαλίσαντο(무덤을 안전하게 하다/확보하다)를 실제 경비 행위로 좁혀 표현합니다. 또한 ‘돌에 인장을 찍고’는 σφραγίσαντες τὸν λίθον의 자연스러운 뜻인 ‘돌을 봉인하고’보다 부정확합니다. 수정문은 무덤을 확보한 행위와 돌을 봉인한 수단, 그리고 경비병과의 동반·관여를 보존합니다.
  naturalness: ‘그들은 가서 경비병과 함께 돌을 봉인하여 무덤을 안전하게 했습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘안전하게 했습니다’는 여기서 무덤 자체를 보호·확보했다는 뜻으로 문맥상 이해됩니다.
  terminology: τάφος는 ‘무덤’, κουστωδία는 특정 소속을 단정하지 않는 ‘경비병’으로 옮겼습니다. σφραγίζω는 ‘인장을 찍다’보다 ‘봉인하다’가 정확합니다.
