  verdict: revise
  source_fidelity: 원문의 현재분사 속격절은 ‘그가 재판석에 앉아 있을 때’로 잘 반영되어 있습니다. 그러나 ἀπέστειλεν πρὸς αὐτόν은 전달 내용을 보냈다는 뜻으로 보는 것이 적절하며, ‘사람을 보내어’는 원문에 없는 전달자 인물을 명시합니다. 또한 Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ는 단순한 친분·관계의 부재가 아니라 그 사람의 일에 관여하거나 그에게 불리한 조처를 하지 말라는 경고입니다.
  naturalness: ‘그에게 전갈을 보내어 이렇게 말했습니다’와 ‘그 일에 관여하지 마십시오’는 현대 표준 한국어 합쇼체로 자연스럽고, 인용문의 화자·수신자 관계도 분명합니다. ‘크게 시달렸습니다’보다 ‘큰 고통을 겪었습니다’가 πολλὰ ἔπαθον의 폭넓은 ‘고난을 겪다’라는 뜻을 더 중립적으로 전달합니다.
  terminology: βῆμα는 법정 맥락에서 ‘재판석’으로 적절합니다. δίκαιος의 주된 번역은 마태의 도덕적·법정적 울림을 함께 보존하는 ‘의로운’으로 유지하되, 법정 문맥상 가능한 ‘무죄한’은 각주로 제시합니다.
