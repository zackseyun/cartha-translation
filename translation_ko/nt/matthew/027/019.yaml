  - severity: medium
    issue: ‘저 의로운 사람과 아무 상관도 마십시오’
    rationale: 한국어에서는 수신자에게 ‘아무 상관도 마십시오’라고 하는 표현이 부자연스럽고, 그리스어 관용구의 경고, 곧 그 사람의 일에 개입하거나 그에게 불리한 일을 하지 말라는 의미가 충분히 드러나지 않습니다.
  - severity: low
    issue: ‘크게 시달렸습니다’
    rationale: πάσχω는 특정한 괴롭힘을 당했다기보다 고통을 겪었다는 넓은 표현입니다. ‘큰 고통을 겪었습니다’가 원문의 의미를 제한하지 않습니다.
