  terminology: σταυρόω는 관용적이며 정확한 ‘십자가에 못 박다’로 유지했습니다. ἱμάτια는 ‘자기 옷’으로 옮겨 모욕용 겉옷과 예수 자신의 옷의 대조를 살렸습니다.
