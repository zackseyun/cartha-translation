  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
  footnotes:
  - marker: a
    text: Or 'the robe.' The Greek χλαμύς denotes a cloak, often an outer garment; in context it is the mock royal garment placed on Jesus.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그를 조롱한 뒤에, 그에게서 겉옷[a]을 벗기고 그의 자기 옷을 입힌 뒤, 그를 십자가에 못 박으려고 데리고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘망토’, ‘외투’. 그리스어 χλαμύς는 겉에 걸치는 옷을 가리키며, 여기서는 예수님에게 입혀 조롱하던 옷입니다.
    reason: χλαμύς의 어휘 범위를 밝혀 ‘겉옷’의 가능한 대안을 제시합니다.
