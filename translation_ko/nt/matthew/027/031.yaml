  to: 그들이 그를 조롱한 뒤에, 그에게서 겉옷[a]을 벗기고 그의 자기 옷을 입힌 뒤, 그를 십자가에 못 박으려고 데리고 갔습니다.
  rationale: 동사의 의미 범위를 넘는 ‘끌고 나갔다’를 중립적인 호송 표현으로 고쳤고, χλαμύς와 ἱμάτια의 대비를 유지했습니다. 목적을 나타내는 εἰς τὸ σταυρῶσαι는 ‘십자가에 못 박으려고’로 보존했습니다.
