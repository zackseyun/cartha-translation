  source_fidelity: 원문의 현재분사 λέγοντες는 앞 절의 서술에 이어지는 ‘말하며/말하면서’로 옮기는 것이 적절합니다. 또한 ἐν τρισὶν ἡμέραις는 ‘사흘 만에’보다 기간 내 완성을 나타내는 ‘사흘 안에’가 더 직접적입니다. 나머지 도발적 호격, 조건문, 명령은 원문에 충실합니다.
