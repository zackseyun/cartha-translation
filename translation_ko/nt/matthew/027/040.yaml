  terminology: ναός는 ‘성전’, σταυρός는 ‘십자가’, υἱὸς τοῦ θεοῦ는 ‘하나님의 아들’로 일관되고 자연스럽게 옮겼습니다. ‘하나님’은 표준 한국어 성서 번역에서 널리 쓰이는 호칭이며, 원문의 신적 칭호를 축소하거나 확대하지 않습니다.
