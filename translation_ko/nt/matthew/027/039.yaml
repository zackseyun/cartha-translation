  text: 지나가던 사람들은 그를 모독하면서 머리를 흔들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에게 모욕적인 말을 하면서.” 그리스어 동사는 하나님을 향한 신성 모독뿐 아니라 사람을 향한 모욕적·비방적 말을 뜻할 수도 있습니다. 머리를 흔드는 것은 경멸이나 조롱을 나타내는 몸짓입니다(시편 22:7 참조).
    reason: βλασφημέω의 문맥상 어휘 범위를 밝히고, 머리를 흔드는 몸짓의 의미를 설명한다.
