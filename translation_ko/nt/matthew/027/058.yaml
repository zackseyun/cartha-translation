  terminology: '''시신''은 죽은 예수의 σώμα를 문맥에 맞게 자연스럽게 옮깁니다. ''내주다''는 ἀποδοθῆναι의 인도·양도 의미를 무리 없이 반영합니다. 빌라도와 예수의 표기는 표준적입니다.'
