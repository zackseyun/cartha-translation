  source_fidelity: 원문의 수동태 ἀνεῴχθησαν(‘열렸다’)와 ἠγέρθησαν(‘일으킴을 받다/일어나다’), 그리고 ‘잠든 성도들의 많은 몸’이라는 수식 관계를 대체로 충실히 옮겼습니다. 다만 ‘잠자던’은 일반적인 실제 수면으로도 쉽게 이해될 수 있어, 죽음의 완곡 표현이라는 원문의 관용적 용법을 번역 주석으로 밝혀 주는 것이 적절합니다.
  naturalness: ‘잠들어 있던 성도들의 많은 몸’이 ‘잠자던 성도들의 많은 몸’보다 현대 표준어에서 더 자연스럽고, 죽음을 가리키는 문맥에도 더 잘 맞습니다. 문장 종결의 ‘-으며’는 이어지는 다음 절과 연결되는 본문 구조에 적절합니다.
  terminology: ἅγιοι는 신약의 통상 용례를 따라 ‘성도들’로 유지했습니다. ἐγείρω는 사건의 성격을 과도하게 규정하지 않도록 ‘일어났으며’로 옮겼습니다. ‘잠들어 있던’에는 죽음을 완곡하게 나타내는 표현이라는 주석을 붙입니다.
  issues:
