    issue: ‘잠자던’의 관용적 의미가 주석 없이 불분명할 수 있음
    rationale: κεκοιμημένων은 이 문맥에서 죽음을 가리키는 흔한 완곡 표현입니다. 한국어 ‘잠자던’은 문자 그대로 잠을 자던 것으로도 읽힐 수 있으므로, 더 자연스러운 표현으로 다듬고 주석으로 의미를 명시하는 편이 좋습니다.
