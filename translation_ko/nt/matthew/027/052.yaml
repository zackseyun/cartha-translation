  source_fidelity: 원문의 수동태 ἀνεῴχθησαν(열렸다)와 ἠγέρθησαν(일으킴을 받았다), 그리고 ‘잠든’이라는 죽음의 완곡 표현을 반영해야 합니다. 초안의 ‘일어났으며’는 가능한 해석이지만 수동태와 죽음에서 일으켜짐이라는 뜻을 충분히 드러내지 못합니다.
  naturalness: ‘잠자던 성도들의 많은 몸’은 현대 한국어에서 다소 어색하고 ‘잠자던’이 실제 수면으로 읽힐 여지가 있습니다. ‘잠든 성도들 가운데 많은 이들의 몸’은 자연스러우면서도 원문의 수량 범위와 표현을 보존합니다.
  terminology: ἅγιοι는 신약의 통상 용례에 따라 ‘성도들’로 옮기고, ἠγέρθησαν은 부활의 성격을 이 절만으로 규정하지 않도록 ‘일으킴을 받았다’로 중립적으로 번역합니다.
  issues:
  - severity: medium
    issue: ἠγέρθησαν의 수동태가 ‘일어났으며’에서 약화됩니다.
    rationale: 원문은 ‘일으킴을 받았다’라는 수동 표현입니다. ‘일어났다’는 결과를 전달하지만 행위의 수동성과 죽음에서 일으켜짐의 어감을 덜 명시합니다.
  - severity: low
    issue: ‘잠자던 성도들의 많은 몸’이 어색하고 ‘잠자던’이 문자적 수면으로 읽힐 수 있습니다.
    rationale: κεκοιμημένων은 여기서 죽음을 가리키는 관용적 완곡 표현입니다. ‘잠든’과 주석으로 이를 보존하고 명료하게 할 수 있습니다.
  revised_text: 무덤들이 열리고, 잠든 성도들 가운데 많은 이들의 몸이 일으킴을 받았으며,
  revised_footnotes:
