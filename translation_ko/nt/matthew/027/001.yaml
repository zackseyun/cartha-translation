- from: 아침이 되자, 모든 대제사장들과 백성의 장로들이 예수를 죽이려고 그를 거슬러 의논하였습니다.
  to: 아침이 되자, 모든 대제사장들과 백성의 장로들은 예수를 죽이려고 그를 대적할 방도를 의논하였습니다.
  rationale: The revision preserves the temporal genitive absolute ('아침이 되자'), πάντες ('모든'), the leadership designations, the adversative force of κατά ('그를 대적할'), the deliberative force of συμβούλιον ἔλαβον ('방도를 의논하였습니다'), and the lethal purpose expressed by ὥστε θανατῶσαι ('예수를 죽이려고').
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:26:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the temporal transition, the comprehensive participation of the chief priests and elders, Jesus as the object of hostile deliberation, and the purpose of putting him to death. However, '그를 거슬러 의논하였습니다' is an unnatural Korean rendering of συμβούλιον ἔλαβον κατὰ τοῦ Ἰησοῦ and obscures the deliberative sense.
  naturalness: The formal-polite register is appropriate. Recasting the hostile deliberation as discussion of a course of action against Jesus is more idiomatic in modern standard Korean while retaining the source's adversative force.
  terminology: '''대제사장들'' is the established Korean rendering for οἱ ἀρχιερεῖς, and ''백성의 장로들'' accurately reflects οἱ πρεσβύτεροι τοῦ λαοῦ. ''죽이다'' appropriately renders θανατῶσαι without over-specifying the manner of death.'
  issues:
  - severity: medium
    issue: '''그를 거슬러 의논하였습니다'' is awkward and semantically underspecified in Korean.'
    rationale: The Greek idiom denotes holding a deliberation/council directed against Jesus. Korean '거슬러 의논하다' is not a natural collocation; '그를 대적할 방도를 의논하다' makes the hostile object and deliberative action clear without strengthening it to 'conspire.'
  revised_text: 아침이 되자, 모든 대제사장들과 백성의 장로들은 예수를 죽이려고 그를 대적할 방도를 의논하였습니다.
  revised_footnotes: []
  revision_rationale: The revision preserves the temporal genitive absolute ('아침이 되자'), πάντες ('모든'), the leadership designations, the adversative force of κατά ('그를 대적할'), the deliberative force of συμβούλιον ἔλαβον ('방도를 의논하였습니다'), and the lethal purpose expressed by ὥστε θανατῶσαι ('예수를 죽이려고').
