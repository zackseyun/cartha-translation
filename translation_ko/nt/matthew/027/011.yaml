    rationale: Ὁ δέ는 여기서 독립적인 시간 부사 ‘이제’를 요구하지 않습니다.
  - severity: medium
    issue: ‘총독이 그에게 물어 말하였습니다’는 어색한 중복 표현입니다.
    rationale: ἐπηρώτησεν αὐτόν λέγων은 자연스럽게 ‘그분에게 물었습니다’로 옮길 수 있으며, 인용문이 질문 내용을 나타냅니다.
  - severity: medium
    issue: ‘당신이 말하였습니다’는 Σὺ λέγεις의 현재형과 타원적 뉘앙스를 충분히 살리지 못합니다.
    rationale: ‘당신이 그렇게 말합니다’는 상대방의 진술로 되돌리는 간결하고 유보적인 응답을 보존합니다.
