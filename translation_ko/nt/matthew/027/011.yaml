  source_fidelity: ‘이제’는 헬라어 본문에 없는 시간·담화 표지이므로 삭제해야 합니다. 또한 Σὺ λέγεις는 현재형의 절제되고 타원적인 응답이므로 ‘당신이 말하였습니다’보다 ‘당신이 그렇게 말합니다’가 더 가깝고 자연스럽습니다.
  naturalness: ‘총독이 그에게 물어 말하였습니다’는 현대 표준 한국어로 어색합니다. ‘총독이 그분에게 물었습니다’로 옮기면 합쇼체 문체와 법정 장면의 격식에 잘 맞습니다.
  terminology: ἡγεμών은 ‘총독’, βασιλεὺς τῶν Ἰουδαίων은 관용적 정치적 칭호인 ‘유대인의 왕’으로 유지합니다. Ἰουδαίων의 ‘유대인/유대 지방 사람들’ 가능성과 Σὺ λέγεις의 대안은 해당 구절에 정확히 닻표를 붙인 각주로 제시합니다.
