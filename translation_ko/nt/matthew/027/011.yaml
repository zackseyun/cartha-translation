source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Now Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
  footnotes:
  - marker: a
    text: Or, “You say it,” or “It is as you say.” Jesus’ reply is concise and somewhat elliptical in Greek.
    reason: alternative_reading
  - marker: b
    text: Or “the King of the Judeans.” The Greek term can refer either to Jews more broadly or, in some contexts, to Judeans specifically.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 총독 앞에 서셨습니다. 총독이 그분에게 물었습니다. “당신이 유대인의 왕입니까?”[a] 예수께서 말씀하셨습니다. “당신이 그렇게 말합니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대 지방 사람들의 왕.” 그리스어는 더 넓은 의미의 유대인들을 가리킬 수도 있고, 문맥에 따라 유대 지방 사람들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “당신이 그렇게 말하셨습니다” 또는 “말씀하신 대로입니다.” 그리스어 표현은 간결하고 다소 타원적입니다.
    reason: alternative_reading
