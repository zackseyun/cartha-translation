  source_fidelity: 초안의 ‘그들에게는 … 있었습니다’는 εἶχον의 능동적 ‘가지고/구금하고 있었다’라는 표현을 비인칭적 존재문으로 약화합니다. 또한 원문이 채택한 이름 ‘예수 바라바’를 본문에 보존해야 하며, 짧은 이문은 각주로 밝혀야 합니다.
  naturalness: ‘예수 바라바라 하는’도 이해되지만, 현대 표준어 합쇼체에서는 ‘예수 바라바라고 불리는’이 더 자연스럽습니다. ‘구금하고 있었습니다’는 이 재판·수감 문맥에서 εἶχον과 δέσμιον을 자연스럽고 정확하게 함께 살립니다.
  terminology: ‘바라바’는 한국어 성서 전통에 맞는 인명 표기이며 유지합니다. ἐπίσημον은 이 문맥에서 ‘악명 높은’으로 옮기는 것이 적절합니다.
