    rationale: ‘그들에게는 … 죄수가 있었습니다’는 사실상 ‘there was’에 가까워, 원문의 ‘그들이 … 두고 있었다/구금하고 있었다’라는 동사적 의미와 불특정 복수 주어를 충분히 드러내지 못합니다.
  - severity: medium
    issue: 본문의 ‘예수’ 이문에 대한 각주가 없음
    rationale: SBLGNT 본문은 Ἰησοῦν Βαραββᾶν을 읽으므로 본문에는 ‘예수 바라바’를 유지하되, 많은 사본의 짧은 읽기를 각주로 알려야 합니다.
