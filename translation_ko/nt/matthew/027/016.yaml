  rationale: 원문의 τότε를 ‘그때’로, δέ의 약한 연결은 한국어 문장 흐름에 자연스럽게 반영했습니다. εἶχον과 δέσμιον은 ‘그들은 … 죄수를 구금하고 있었습니다’로 옮겨 수감·관리의 의미를 보존했습니다. SBLGNT의 ‘예수 바라바’를 본문에 따르고, 생략 이문은 각주로 처리했습니다.
