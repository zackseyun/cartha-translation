  source_fidelity: 그리스어의 대조적 조건문(ἐὰν δὲ μὴ), 사람들에 대한 용서(τοῖς ἀνθρώποις), 그리고 그에 상응하는 아버지의 용서 거부(οὐδὲ ... ἀφήσει)를 정확히 반영합니다. ‘아버지’에 ‘하늘’ 등의 수식어를 첨가하지 않았고, 반복되는 ἀφίημι를 모두 ‘용서’로 일관되게 옮겼습니다.
