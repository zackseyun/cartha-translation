  terminology: ‘허물’은 παραπτώματα의 도덕적 잘못·범과라는 의미를 무리 없이 담아내며, 전통적 성경 한국어와 현대 독해 모두에 적합합니다. ‘사람들’은 ἀνθρώποις의 포괄적 의미를 잘 반영합니다.
