revisions:
- from: 땅에 여러분 자신을 위하여 보물을 쌓아 두지 마십시오. 거기는 좀과 부식이 망가뜨리고, 도둑들이 뚫고 들어와 훔쳐 가는 곳입니다.
  to: 땅에 자신을 위하여 보물을 쌓아 두지 마십시오. այնտեղ 좀과 부패가 그것들을 망가뜨리고[a], 도둑들이 뚫고 들어와[b] 훔쳐 갑니다.
  rationale: βρῶσις를 더 넓은 의미의 ‘부패’로 옮기고, 대명사 ‘그것들을’을 보충하여 ‘좀과 부패’가 보물을 손상한다는 의미를 자연스럽게 드러냈습니다. 반복된 ὅπου는 한국어에서 두 개의 절로 자연스럽게 표현했으며, ‘뚫고 들어와’는 본문에 유지하고 직역 및 배경은 주석으로 보완했습니다.
