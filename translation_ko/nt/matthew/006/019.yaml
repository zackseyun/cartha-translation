  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
  footnotes:
  - marker: a
    text: Or 'rust'; the Greek word can refer more broadly to consuming deterioration or decay, not only metal corrosion.
    reason: lexical_alternative
  - marker: b
    text: Literally 'dig through,' likely referring to thieves breaking through mud-brick walls.
    reason: cultural_note
translation:
  language: ko
  text: 땅에 자신을 위하여 보물을 쌓아 두지 마십시오. այնտեղ 좀과 부패가 그것들을 망가뜨리고[a], 도둑들이 뚫고 들어와[b] 훔쳐 갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘녹’. 그리스어는 금속의 녹뿐 아니라, 먹어 없어지거나 닳아 없어지는 더 넓은 의미의 부패를 가리킬 수 있습니다.
    reason: βρῶσις의 가능한 전통적 번역과 더 넓은 의미를 보존합니다.
  - marker: b
    text: 직역하면 ‘파고 들어와’. 흙벽이나 진흙 벽돌 벽을 파고 들어오는 일을 가리킬 수 있습니다.
    reason: διορύσσουσιν의 문자적 의미와 문화적 배경을 보존합니다.
