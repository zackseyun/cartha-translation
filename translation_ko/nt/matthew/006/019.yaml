review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the prohibition, the reflexive benefit ('for yourselves'), earthly location, moth damage, and theft. However, '부식' usually denotes corrosion and is too narrow for βρῶσις, which can denote consuming deterioration more broadly. The footnote-worthy literal sense of διορύσσω ('dig through') is also absent.
  naturalness: The register is appropriate modern formal-polite Korean. Recasting the second sentence with explicit coordinated predicates avoids the slightly stiff nominal ending '...가는 곳입니다' and reads more naturally while retaining the repeated ὅπου structure.
  terminology: '''보물을 쌓아 두다,'' ''좀,'' and ''도둑'' are suitable. ''부패'' is a broader and more natural rendering here than ''부식''; a note preserves the traditional/possible rendering ''녹.'''
  issues:
  - severity: medium
    issue: '''부식'' is overly narrow for βρῶσις.'
    rationale: In contemporary Korean, 부식 normally means corrosion, especially of metal. βρῶσις can refer more generally to consuming deterioration/decay. '부패' better retains the breadth; '녹' can be supplied as an alternative in a note.
  - severity: low
    issue: No note preserves the literal cultural force of διορύσσουσιν.
    rationale: The idiomatic '뚫고 들어오다' is appropriate, but the Greek literally means 'dig through,' plausibly referring to entry through earthen or mud-brick walls. A concise footnote preserves this audit-relevant detail.
  revised_text: 땅에 자신을 위하여 보물을 쌓아 두지 마십시오. այնտեղ 좀과 부패가 그것들을 망가뜨리고[a], 도둑들이 뚫고 들어와[b] 훔쳐 갑니다.
