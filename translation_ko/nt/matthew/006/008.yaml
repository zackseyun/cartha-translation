- from: 그러므로 그들과 같이 되지 마십시오. 여러분의 아버지께서는 여러분이 무엇이 필요한지 구하기 전에 이미 아십니다.
  to: 그러므로 그들과 같이 되지 마십시오. 여러분의 아버지께서는 여러분에게 필요한 것이 무엇인지 여러분이 그분께 구하기도 전에 아십니다.
  rationale: 문법적으로 어색한 필요 표현을 원문 의미에 맞게 자연화하고, 원문에 명시되지 않은 강조어 ‘이미’를 제거했습니다. ‘그들과 같이 되지 마십시오’는 수동형 ὁμοιωθῆτε의 ‘그들과 같아지다/같이 되다’라는 뉘앙스를 무리 없이 보존합니다.
