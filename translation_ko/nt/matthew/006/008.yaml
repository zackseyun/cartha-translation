review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘이미’는 원문에 명시된 부사가 아니므로 빼는 것이 좋으며, ‘여러분이 무엇이 필요한지’는 원문의 ‘필요로 하는 것’을 자연스럽게 옮하지 못합니다.
  naturalness: ‘여러분에게 필요한 것이 무엇인지’가 현대 표준 한국어에서 자연스럽고 문법적으로 분명합니다. ‘구하기도 전에’는 πρὸ τοῦ ... αἰτῆσαι의 시간 관계를 자연스럽게 나타냅니다.
  terminology: ‘아버지’는 원문 ὁ πατὴρ ὑμῶν에 충실하며, 원문에 없는 ‘하늘에 계신’을 보태지 않았습니다. 존대와 합쇼체도 적절합니다.
  issues:
  - severity: medium
    issue: ‘여러분이 무엇이 필요한지’의 표현
    rationale: 한국어에서는 이 문맥의 필요의 주체를 ‘여러분에게’로 표시하거나 ‘여러분에게 필요한 것’으로 표현하는 것이 자연스럽습니다. 원문의 ὧν χρείαν ἔχετε(‘여러분이 필요로 하는 것들’)도 후자가 더 직접적으로 반영합니다.
  - severity: low
    issue: ‘이미’의 첨가
    rationale: 하나님께서 구하기 전에 아신다는 의미상 선행성은 원문에 있으나, ‘이미’는 별도의 강조를 더합니다. 원문의 시간 표현만으로 충분합니다.
  revised_text: 그러므로 그들과 같이 되지 마십시오. 여러분의 아버지께서는 여러분에게 필요한 것이 무엇인지 여러분이 그분께 구하기도 전에 아십니다.
