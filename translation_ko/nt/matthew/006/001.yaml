revisions:
- from: 여러분의 의를 사람들에게 보이려고 그들 앞에서 행하지 않도록 조심하십시오. 그렇지 않으면 하늘에 계신 여러분의 아버지께로부터 상을 받지 못합니다.
  to: 그러나 사람들에게 보이려고 그들 앞에서 여러분의 의를 실천하지 않도록 조심하십시오. 그렇지 않으면 하늘에 계신 여러분의 아버지께 상이 없습니다.[a]
  rationale: 본문의 ‘의’는 δικαιοσύνη의 넓은 범위를 유지하도록 보존했습니다. ‘실천하다’는 이 문맥에서 지속적인 경건 행위를 자연스럽게 나타냅니다. 또한 ‘상이 없습니다’로 현재형 οὐκ ἔχετε를 반영했으며, 이문과 어휘적 대안을 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:29Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the warning, the purpose clause ('to be seen by them'), and the consequence of lacking reward. However, '상을 받지 못합니다' makes the consequence sound prospective, whereas οὐκ ἔχετε is present ('you do not have'). The preposition παρά with the Father is appropriately rendered as source.
  naturalness: The Korean is clear and appropriately formal-polite. '의를 ... 행하다' is understandable, but '의를 행하다' is somewhat less natural in contemporary Korean than '의를 실천하다' in this context. '하늘에 계신' is idiomatic Korean, though it does not preserve the source's plural form.
  terminology: '''의'' properly renders δικαιοσύνη and preserves its broad scope. ''상'' is an appropriate rendering of μισθός in this context. A note should preserve both the broader practical sense (''의로운 행위'') and the textual variant ''구제.'''
  issues:
  - severity: medium
    issue: The verb phrase '상을 받지 못합니다' shifts the Greek present statement οὐκ ἔχετε ('you do not have') toward a future inability to receive.
    rationale: The verse states the current absence of reward with the Father as the consequence of ostentatious practice. '상이 없습니다' more closely reflects the Greek tense/aspect without unnatural Korean.
  - severity: low
    issue: No footnote preserves the known textual variant or the broader practical sense of δικαιοσύνη.
    rationale: The SBLGNT text reads δικαιοσύνην, broadly 'righteousness,' while a textual variant reads ἐλεημοσύνην ('almsgiving'). The audit trail explicitly retains this ambiguity in a note.
  revised_text: 그러나 사람들에게 보이려고 그들 앞에서 여러분의 의를 실천하지 않도록 조심하십시오. 그렇지 않으면 하늘에 계신 여러분의 아버지께 상이 없습니다.[a]
