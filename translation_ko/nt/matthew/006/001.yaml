  revision_rationale: 본문의 ‘의’는 δικαιοσύνη의 넓은 범위를 유지하도록 보존했습니다. ‘실천하다’는 이 문맥에서 지속적인 경건 행위를 자연스럽게 나타냅니다. 또한 ‘상이 없습니다’로 현재형 οὐκ ἔχετε를 반영했으며, 이문과 어휘적 대안을 각주에 보존했습니다.
