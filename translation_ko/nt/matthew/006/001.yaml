id: MAT.6.1
reference: Matthew 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
  footnotes:
  - marker: a
    text: Or 'your acts of righteousness.' A textual variant reads 'your almsgiving.'
    reason: textual_variant
  - marker: b
    text: Greek 'in the heavens'; many English versions simplify to 'in heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 사람들에게 보이려고 그들 앞에서 여러분의 의를 실천하지 않도록 조심하십시오. 그렇지 않으면 하늘에 계신 여러분의 아버지께 상이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 의로운 행위’. 일부 사본은 ‘여러분의 구제’를 읽습니다.
    reason: δικαιοσύνη의 넓은 실천적 의미를 보존하고, ἐλεημοσύνη(‘구제’)라는 본문 이문을 표시합니다.
