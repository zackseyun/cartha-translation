  to: 그러나 여러분은 먼저 그분의 나라와 그분의 의[a]를 구하십시오. 그리하면 이 모든 것이 여러분에게 더해질 것입니다.
  rationale: δέ의 대조를 ‘그러나’로 반영하고, 미래 수동형 ‘더해질 것입니다’로 προστεθήσεται의 형태를 보존했습니다. ‘그리하면’은 앞선 명령과 뒤따르는 결과의 자연스러운 한국어 연결이며, ‘의’의 폭넓은 뜻은 각주에서 ‘정의’ 대안과 함께 밝혔습니다.
