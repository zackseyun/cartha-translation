    issue: δέ의 대조가 본문에서 누락되었습니다.
    rationale: 앞 단락의 염려 및 이방인의 추구와 대비되는 전환이므로 ‘그러나’를 보충하는 것이 적절합니다.
  - severity: low
    issue: προστεθήσεται의 미래 수동형이 ‘더하여 주실 것입니다’에서 능동적 신적 행위로 명시됩니다.
    rationale: 문맥상 하나님이 행위자임은 분명하지만, 원문은 수동형입니다. ‘더해질 것입니다’가 문법적 형태와 표현의 절제를 더 잘 보존합니다.
  - severity: low
    issue: δικαιοσύνη의 ‘정의’라는 유효한 어휘 대안에 대한 각주가 없습니다.
    rationale: 기본 번역 ‘의’를 유지하되, 영어 POB 감사 기록의 어휘 대안을 한국어 각주로 보존하면 투명성이 높아집니다.
