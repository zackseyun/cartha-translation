  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
  footnotes:
  - marker: a
    text: Or 'his justice.' The Greek word can denote righteousness or justice; here 'righteousness' is retained as the default rendering because the context includes right relation and conduct before God, not only judicial or social justice.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분은 먼저 그분의 나라와 그분의 의[a]를 구하십시오. 그리하면 이 모든 것이 여러분에게 더해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정의’. 그리스어 단어는 ‘의’ 또는 ‘정의’를 뜻할 수 있습니다. 여기서는 하나님 앞에서의 바른 관계와 삶을 포함하는 넓은 뜻을 살려 ‘의’로 옮겼습니다.
    reason: lexical_alternative
