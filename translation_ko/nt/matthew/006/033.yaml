  verdict: revise
  source_fidelity: 초안은 βασιλείαν, δικαιοσύνην, πρῶτον, ταῦτα πάντα의 핵심 뜻을 대체로 충실히 옮겼습니다. 다만 δέ의 대조적 전환(“그러나”)이 빠져 있으며, 미래 수동형 προστεθήσεται를 ‘더하여 주실 것입니다’로 옮기면 행위자를 명시하고 능동·존대 표현을 보태게 됩니다. 수동 표현을 유지하는 편이 원문에 더 가깝습니다.
  naturalness: ‘여러분은 먼저’와 ‘그분의 나라와 그분의 의를 구하십시오’는 현대 표준어 합쇼체로 자연스럽습니다. ‘이 모든 것이 여러분에게 더해질 것입니다’는 다소 문어적이지만 성서 문맥에서 자연스럽고, 원문의 ‘더해지다’ 비유를 보존합니다.
  terminology: ‘나라’는 βασιλεία의 넓은 의미를 보존하며, ‘의’는 마태복음 및 한국어 성서 용례에서 δικαιοσύνη의 적절한 기본어입니다. ‘정의’라는 가능한 어휘적 대안은 각주로 남기는 것이 좋습니다.
  issues:
