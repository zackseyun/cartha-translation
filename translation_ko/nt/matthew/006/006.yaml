  timestamp: '2026-07-13T06:19:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the imperatives, the private setting, the repeated hiddenness language, and the future divine response. However, it changes the Greek singular emphatic addressee (σὺ ... σου ... σοι) into plural ‘여러분,’ which is avoidable in Korean and weakens the individual-directed contrast.
  naturalness: The sentence is generally fluent in modern formal-polite Korean. Omitting repeated explicit second-person possessives where Korean naturally supplies them improves flow while retaining the singular, individually applicable force. ‘은밀한 가운데’ is retained to reflect the source’s deliberately repeated, somewhat open expression.
  terminology: ‘골방’ suitably renders ταμεῖον as an interior private room, and ‘아버지’ appropriately preserves the plain relational designation. ‘갚아 주실 것입니다’ preserves the semantic range of ἀποδώσει without specifying the form of the response.
  issues:
  - severity: medium
    issue: ‘여러분’ and ‘여러분의’ render a singular Greek addressee as plural.
    rationale: The verse repeatedly uses singular forms and contrasts the individual disciple with the preceding hypocrites. Korean can preserve this without the awkward formal-polite use of ‘너는’ by using an implicit addressee and ‘자기 골방.’
  revised_text: 그러나 기도할 때에는 자기 골방에 들어가 문을 닫고, 은밀한 가운데 계신 아버지께 기도하십시오. 그러면 은밀한 가운데 보시는 아버지께서 갚아 주실 것입니다.
  revised_footnotes: []
  revision_rationale: The revision removes the unwarranted pluralization while maintaining modern 합쇼체. It retains the repeated ‘은밀한 가운데’ to mirror ἐν τῷ κρυπτῷ and avoid deciding whether the expression is exclusively locative or adverbial. No footnotes are required for this concise rendering.
