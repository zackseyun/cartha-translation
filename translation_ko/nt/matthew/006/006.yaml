revisions:
- from: 그러나 여러분은 기도할 때에 자기의 골방에 들어가, 문을 닫고 은밀한 가운데 계신 여러분의 아버지께 기도하십시오. 그러면 은밀한 가운데 보시는 여러분의 아버지께서 여러분에게 갚아 주실 것입니다.
  to: 그러나 기도할 때에는 자기 골방에 들어가 문을 닫고, 은밀한 가운데 계신 아버지께 기도하십시오. 그러면 은밀한 가운데 보시는 아버지께서 갚아 주실 것입니다.
  rationale: The revision removes the unwarranted pluralization while maintaining modern 합쇼체. It retains the repeated ‘은밀한 가운데’ to mirror ἐν τῷ κρυπτῷ and avoid deciding whether the expression is exclusively locative or adverbial. No footnotes are required for this concise rendering.
