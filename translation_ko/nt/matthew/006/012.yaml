  english_pob_choice: debts
  chosen_korean: 빚
  alternatives_korean:
  - 죄
  - 허물
  lexicon: BDAG
  rationale: ὀφείλημα는 본의 「빚」이며, 마태가 의도적으로 경제적 어휘로 죄의 무게를 그린다. 한국어에서도 「빚」을 보존해 마태의 어휘 선택을 살린다. 6:14-15의 「παράπτωμα(허물)」와 어휘적 변주가 분명해진다.
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 ‘빚/빚진 이들’ 비유와 비교절은 대체로 충실히 옮겼습니다. 다만 ἀφήκαμεν은 문맥상 완료를 반드시 표시할 수 없는 부정과거이므로 한국어에서는 단순 과거 ‘용서하였듯이’가 가장 절제된 대응입니다. 문두의 καὶ도 ‘그리고’로 반영하는 편이 좋습니다.
  naturalness: 초안의 ‘용서하여 주옵소서’는 현대 표준어 합쇼체보다 고어적·격식 과잉의 기도체입니다. ‘용서해 주십시오’가 현대적이면서도 공손한 기도 문체에 맞습니다. ‘빚진 이들’은 ‘우리에게 빚진 자들’보다 자연스럽습니다.
  terminology: ὀφειλήματα와 ὀφειλέται의 동족어 관계를 ‘빚’과 ‘빚진 이들’로 유지했습니다. 이는 ‘죄’나 ‘허물’로 본문을 해석적으로 바꾸지 않으면서도 원문의 비유를 보존합니다.
  issues:
  - severity: medium
    issue: ‘주옵소서’의 문체
    rationale: 현대 표준어/합쇼체라는 목표 변종에 비해 고어적 종결입니다.
  - severity: low
    issue: 문두 καὶ 미반영
    rationale: 직역을 강제할 요소는 아니지만, 최적 등가 번역에서는 이어지는 청원을 나타내는 ‘그리고’를 반영할 수 있습니다.
  - severity: low
    issue: ἀφήκαμεν의 시제 표현
    rationale: ‘용서한’도 가능하지만, 부정과거의 단순 과거 용법을 보다 분명히 드러내도록 ‘용서하였듯이’로 다듬었습니다.
  revised_text: 그리고 우리가 우리에게 빚진 이들을 용서하였듯이, 우리의 빚을 용서해 주십시오.
  revised_footnotes:
  - marker: a
    text: ‘빚’은 문자적으로는 갚아야 할 것을 뜻하며, 여기서는 죄나 잘못을 가리키는 비유로 이해될 수 있습니다. 또는 ‘허물’.
    reason: lexical_alternative
  - marker: b
    text: '그리스어는 단순 과거로도 옮길 수 있습니다: ‘용서했듯이’.'
    reason: lexical_alternative
  revision_rationale: 현대 합쇼체에 맞추어 고어적 기도 종결을 바꾸고, 문두 접속사와 부정과거의 절제된 과거성을 반영했습니다. ‘빚’과 ‘빚진 이들’은 원문의 의도적인 비유 및 어휘 연결을 보존합니다.
