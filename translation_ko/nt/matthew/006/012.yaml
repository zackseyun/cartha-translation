  source_fidelity: 핵심 은유인 ὀφειλήματα/ὀφειλέταις를 각각 ‘빚’과 ‘빚진 이들’로 일관되게 옮긴 점은 원문에 충실합니다. 다만 δεύτερον καὶ의 강조는 ‘우리도’로 드러내는 것이 좋고, ‘우리의 빚’이 단순한 금전 채무로만 읽히지 않도록 주석이 필요합니다. ἀφήκαμεν의 부정과거는 ‘용서한’으로 자연스럽게 반영됩니다.
