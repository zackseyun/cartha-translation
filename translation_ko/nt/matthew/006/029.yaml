- from: 그러나 내가 여러분에게 말합니다. 솔로몬의 모든 영광으로도 이것들 중 하나만큼 차려입지 못하였습니다.
  to: 그러나 내가 여러분에게 말합니다. 솔로몬도 온갖 영화를 누렸지만 이들 중 하나처럼 차려입지는 못했습니다.
  rationale: 솔로몬의 ‘모든 영광’이 가리키는 왕적 화려함을 “온갖 영화”로 자연스럽게 옮기고, οὐδέ의 ‘심지어 …도 아닌’ 강조를 “솔로몬도 … 못했습니다”로 유지했습니다. 또한 꽃들을 가리키는 τούτων과 그중 하나를 가리키는 ἓν의 단수 비교를 “이들 중 하나처럼”으로 보존했습니다.
