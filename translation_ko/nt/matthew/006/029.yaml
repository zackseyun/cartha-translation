    rationale: ὡς ἓν τούτων은 ‘이들 중 하나처럼’이라는 단수 비교입니다. 수정문은 단수성과 앞 절의 꽃들을 가리키는 지시성을 유지하면서 한국어 문장을 매끄럽게 합니다.
