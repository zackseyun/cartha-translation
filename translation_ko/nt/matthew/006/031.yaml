  source_fidelity: 원문의 οὖν은 ‘그러므로’로, μὴ ... μεριμνήσητε는 ‘염려하지 마십시오’로 적절히 옮겼습니다. λέγοντες의 내용 연결도 ‘하고’로 자연스럽게 반영되었으며, 세 개의 숙고형 질문과 반복된 ἤ는 ‘또는’의 반복으로 보존되었습니다. περιβαλώμεθα도 문맥상 ‘무엇을 입을까?’가 정확하고 자연스럽습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 직접 인용과 ‘하고 염려하지 마십시오’의 연결도 무리 없습니다. ‘염려하다’는 여기서 물질적 필요에 대한 불안한 걱정을 나타내기에 적절한 격식어입니다.
  terminology: ‘염려하지 마십시오’는 본문 문맥의 불안한 걱정을 나타내며, 신중한 계획 일반을 금한다는 식의 해석을 덧붙이지 않습니다. 주요 신학 용어 또는 인명은 없습니다.
