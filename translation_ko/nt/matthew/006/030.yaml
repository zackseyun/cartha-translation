  text: 오늘 있다가 내일 화덕에 던져질 들풀도 하나님께서 이렇게 입히시거든, 하물며 여러분에게는 얼마나 더 입혀 주시지 않겠습니까, 믿음이 적은 사람들아?
  philosophy: optimal-equivalence
