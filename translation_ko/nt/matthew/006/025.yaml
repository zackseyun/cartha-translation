    text: 또는 ‘영혼’. 헬라어 ψυχή는 ‘영혼’을 뜻할 수도 있지만, 여기서는 먹는 것과 입는 것의 문맥상 ‘목숨’ 또는 ‘삶’을 가리킵니다.
    reason: lexical_alternative
