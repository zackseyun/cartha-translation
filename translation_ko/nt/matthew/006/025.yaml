  terminology: ‘목숨’ appropriately renders ψυχή in this material-needs context and avoids importing a technical sense of the immaterial soul. ‘음식,’ ‘몸,’ and ‘옷’ are natural equivalents. A lexical note records the possible alternative ‘영혼’ without favoring it in this context.
