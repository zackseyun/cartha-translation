  source_fidelity: The draft accurately conveys the prohibition against anxious concern, the food/clothing pair, and the comparative force of πλεῖον. However, the final Greek sentence is one rhetorical question joining both comparisons; rendering it as two separate questions slightly alters its syntactic and rhetorical unity.
