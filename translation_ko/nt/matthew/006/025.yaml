  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
  footnotes:
  - marker: a
    text: Or 'soul' for 'life' (ψυχή), though here the context of eating and clothing favors 'life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 여러분에게 말합니다. 여러분의 목숨[a]을 위하여 무엇을 먹을까, 또는 여러분의 몸을 위하여 무엇을 입을까 염려하지 마십시오. 목숨이 음식보다 더 소중하고 몸이 옷보다 더 소중하지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
