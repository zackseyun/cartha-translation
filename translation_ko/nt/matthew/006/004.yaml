  source_fidelity: 핵심 의미는 대체로 반영했지만, ὅπως가 이끄는 목적절을 설명문인 “이는 … 위함입니다”로 풀어 원문의 앞 절 의존성과 권면의 흐름이 약해졌습니다. 또한 καί를 “그러면”으로 옮긴 것은 조건적·추론적 뉘앙스를 더합니다. “은밀한 곳에서 보시는”은 ἐν τῷ κρυπτῷ의 반복을 자연스럽게 보존합니다.
  naturalness: “구제가 은밀하게 되게 하기”는 현대 한국어에서 다소 어색합니다. “구제가 은밀히 이루어지게 하십시오”가 합쇼체 권면 문맥에서 자연스럽습니다. “보상해 주실 것입니다”는 이 문맥에서 자연스럽되, 보상의 구체적 형태를 한정하지 않습니다.
  terminology: ἐλεημοσύνη는 일반적 자선보다 가난한 이들을 위한 구제를 가리키므로 “구제”가 적절합니다. ἀποδώσει는 긍정적 보응을 뜻하므로 “보상해 주실 것입니다”로 옮기고, 직역적 대안 “갚아 주실 것입니다”를 각주로 제시합니다. “여러분의 아버지”는 원문에 없는 “하늘”을 보태지 않아 적절합니다.
