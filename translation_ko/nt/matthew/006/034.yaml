revisions:
- from: 그러므로 내일을 위하여 염려하지 마십시오. 내일은 내일이 스스로 염려할 것입니다. 그날의 괴로움은 그날로 족합니다.
  to: 그러므로 내일을 염려하지 마십시오. 내일은 자기 자신을 염려할 것입니다. 하루에는 그날의 어려움[a]이 충분합니다.
  rationale: 재귀대명사 αὑτῆς를 ‘자기 자신’으로 명시하여 내일의 의인화와 역설을 보존했습니다. 마지막 격언은 원문의 일반적·분배적 ‘하루’와 그날에 속한 κακία의 관계를 현대 한국어로 명료하게 표현했으며, κακία의 가능한 대안 의미는 해당 위치의 각주로 처리했습니다.
