  - severity: low
    issue: 마지막 절의 ‘그날로 족합니다’가 현대어로 다소 문어적이며 일반적 하루의 의미가 약함
    rationale: ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς는 각 하루에 그날 자체의 어려움이 이미 충분하다는 격언입니다. ‘하루에는 그날의 어려움이 충분합니다’가 이를 더 분명하고 자연스럽게 전달합니다.
