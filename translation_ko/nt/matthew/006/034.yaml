  verdict: revise
  source_fidelity: 첫 문장의 ‘내일을 위하여 염려하지 마십시오’는 εἰς τὴν αὔριον의 미래를 향한 염려를 대체로 잘 전달합니다. 그러나 ‘내일은 내일이 스스로 염려할 것입니다’는 주어를 중복하여 한국어로 부자연스럽고, αὑτῆς의 재귀적 대상도 불명확합니다. 마지막 절의 ‘그날의 괴로움은 그날로 족합니다’는 뜻은 가깝지만 현대 표준어에서는 다소 문어적이며, 여격 τῇ ἡμέρᾳ의 일반적·분배적 범위가 약해집니다.
  naturalness: ‘내일은 자기 자신을 염려할 것입니다’는 의도된 의인법과 재귀성을 자연스럽게 보존합니다. ‘하루에는 그날의 어려움이 충분합니다’는 원문의 간결한 격언적 진술을 현대 합쇼체 문장 안에서 자연스럽게 표현합니다.
  terminology: μεριμνάω는 앞뒤 절에서 모두 ‘염려하다’로 일관되게 옮겼습니다. κακία는 이 문맥에서 도덕적 ‘악’보다는 그날에 닥치는 고난·곤란을 가리키므로 ‘어려움’으로 옮기되, 가능한 ‘악’의 의미는 각주로 밝혔습니다.
