  source_fidelity: 그리스어의 장소 상관 표현(ὅπου…ἐκεῖ), 소유 표현, 미래형 ἔσται, 그리고 설명 접속사 γάρ를 충실히 반영합니다. ‘있을 것이기 때문입니다’는 앞 절의 가르침을 뒷받침하는 γάρ의 기능을 문맥적으로 자연스럽게 살립니다.
