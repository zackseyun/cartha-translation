  terminology: ‘보물’과 ‘마음’은 θησαυρός와 καρδία의 비유적·포괄적 의미를 불필요하게 좁히지 않는 적절한 표준 역어입니다. ‘여러분의’는 청중을 향한 현대 공손체에 알맞습니다.
