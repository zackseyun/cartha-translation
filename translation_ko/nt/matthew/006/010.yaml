    text: 또는 “아버지의 나라가 오게 하시고, 아버지의 뜻이 이루어지게 하소서. 하늘에서와 같이 땅에서도.”로, “하늘에서와 같이 땅에서도”가 앞의 두 간청 모두에 걸린다고 이해할 수 있습니다.
    reason: The Greek comparative phrase most immediately follows the second petition, but its scope may also be understood to include both preceding petitions; punctuation does not settle this question.
