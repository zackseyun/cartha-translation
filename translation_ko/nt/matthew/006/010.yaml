  source_fidelity: 'The draft omits the possessive force of σου in both petitions and renders the second imperative as though God''s will has already been accomplished in heaven ("이루어진 것같이"). γενηθήτω is a prospective petition: that the will be done. The revision retains the Greek''s two coordinated petitions and its comparatival phrase.'
  naturalness: '"하옵소서/이루어지옵소서" is elevated archaic prayer diction rather than the requested modern formal-polite register. "오게 하시고 ... 이루어지게 하소서" is natural, reverent Korean prayer language while avoiding unnecessary archaism.'
  terminology: '"아버지의 나라" and "아버지의 뜻" appropriately express σου in the immediate prayer context, where God has just been addressed as Father (6:9). "나라" and "뜻" are established, clear equivalents for βασιλεία and θέλημα. "하늘에서와 같이 땅에서도" naturally renders the heaven/earth comparison.'
  issues:
  - severity: high
    issue: The possessives σου are not represented.
    rationale: '"나라" and "뜻" without an explicit referent leave both "your kingdom" and "your will" underspecified in this standalone verse. The immediate context supplies "Father," which Korean can use naturally.'
  - severity: high
    issue: '"하늘에서 이루어진 것같이" changes the temporal/modal force of γενηθήτω.'
    rationale: The Greek is an aorist imperative petition, not a statement that the will has already been done in heaven. "이루어지게 하소서" preserves the requested, prospective sense.
  - severity: medium
    issue: The draft's prayer endings are more archaic than the specified modern formal-polite register.
    rationale: Replacing "하옵소서/이루어지옵소서" with "하게 하시고/하게 하소서" maintains reverence and formal prayer register in more current Korean.
  revised_text: 아버지의 나라가 오게 하시고, 아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지게 하소서.[a]
