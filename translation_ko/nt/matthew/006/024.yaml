base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
  footnotes:
  - marker: a
    text: Or 'wealth' or 'money.' The Greek uses the loanword 'mammon,' which can personify riches as a rival master.
    reason: lexical_alternative
translation:
  language: ko
  text: 아무도 두 주인을 섬길 수 없습니다. 한 주인을 미워하고 다른 주인을 사랑하거나, 한 주인에게 충실하고 다른 주인을 업신여길 것이기 때문입니다. 여러분은 하나님과 맘몬[a]을 섬길 수 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맘몬’은 재물 또는 돈을 뜻하는 아람어 차용어입니다. 여기서는 재물이 하나님과 맞서는 주인처럼 의인화되어 있습니다.
    reason: lexical_alternative
