  source_fidelity: 첫 절은 그리스어의 대조(사람들에게 금식하는 것으로 드러나지 않되 아버지께는 드러남)를 충분히 반영하지 못합니다. 특히 초안의 ‘금식하는 것을 보이기’는 능동적으로 하나님께 보인다는 뜻으로 들릴 수 있습니다. 개정문은 수동적 ‘드러나다’와 ‘사람들에게는 … 아버지께만’의 대조를 보존합니다. ‘은밀한 가운데’의 반복도 원문의 반복을 따릅니다.
  naturalness: 개정문은 현대 표준 한국어 합쇼체로 자연스럽고, 긴 대조 구문을 ‘드러내지 않고 … 드러나게 하려는 것입니다’로 명료하게 표현합니다.
  terminology: ‘아버지’는 원문의 관계적 호칭을 보존합니다. ἀποδώσει의 문맥상 보응 의미는 ‘보상해 주실 것입니다’로 옮겨, 단순한 반환이나 보복으로 좁혀질 수 있는 ‘갚아 주실 것입니다’보다 분명하게 했습니다.
  issues:
  - severity: medium
    issue: 첫 문장의 대조와 태가 불분명함
    rationale: ‘사람들에게가 아니라 … 아버지께 금식하는 것을 보이기’는 원문의 ‘사람들에게 금식하는 사람으로 보이지 않되 아버지께 [보이도록]’이라는 대조를 능동적 ‘보이기’로 바꾸어 의미를 다소 흐립니다.
  - severity: low
    issue: ‘갚아 주실 것입니다’의 의미 범위
    rationale: ἀποδίδωμι는 여기서 경건 행위에 대한 보상/보응을 가리킵니다. 한국어 ‘갚다’는 반환 또는 보복의 뉘앙스도 있어 ‘보상하다’가 문맥을 더 정확히 드러냅니다.
