- from: 이는 사람들에게가 아니라 은밀한 가운데 계신 여러분의 아버지께 금식하는 것을 보이기 위함입니다. 그러면 은밀한 가운데 보시는 여러분의 아버지께서 여러분에게 갚아 주실 것입니다.
  to: 이는 여러분이 금식하고 있음을 사람들에게는 드러내지 않고, 은밀한 가운데 계신 여러분의 아버지께만 드러나게 하려는 것입니다. 그러면 은밀한 가운데 보시는 여러분의 아버지께서 여러분에게 보상해 주실 것입니다.
  rationale: 원문의 ὅπως μὴ … ἀλλὰ 대조와 φαίνω의 ‘드러나다/보이다’ 의미를 한국어에서 명시적으로 살렸습니다. ‘은밀한 가운데’는 두 번 모두 동일하게 옮겨 κρυφαίῳ의 반복을 보존했으며, 본문에 없는 장소나 보상의 구체적 내용을 덧붙이지 않았습니다.
