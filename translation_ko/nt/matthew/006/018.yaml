  text: 이는 여러분이 금식하고 있음을 사람들에게는 드러내지 않고, 은밀한 가운데 계신 여러분의 아버지께만 드러나게 하려는 것입니다. 그러면 은밀한 가운데 보시는 여러분의 아버지께서 여러분에게 보상해 주실 것입니다.
