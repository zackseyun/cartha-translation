    issue: 길쌈도 하지 않습니다
    rationale: νήθουσιν means 'they spin' (especially spin thread). 길쌈하다 can include weaving and is therefore semantically broader. 실을 잣다 preserves the specific activity.
  - severity: low
    issue: 그것들은
    rationale: Although grammatically valid, this pronoun is less idiomatic than a Korean generic noun subject for a general statement about lilies.
