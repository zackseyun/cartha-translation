review_pass:
  verdict: revise
  source_fidelity: The draft conveys the main sense accurately, including the warning against performative fasting and the idiomatic sense that the hypocrites have already received their full reward. However, ‘금식하는 것을 보이려고’ slightly shifts the purpose clause from appearing to people as fasting to showing people that they are fasting.
  naturalness: The Korean is generally clear and appropriately formal-polite. ‘침울한 표정을 짓지 마십시오’ is more idiomatic than ‘침울한 얼굴을 하지 마십시오,’ while retaining the intended outwardly gloomy demeanor.
  terminology: ‘위선자들,’ ‘금식,’ and ‘상’ are established, suitable terms in a formal Korean Bible translation. ‘사람들에게’ naturally represents τοῖς ἀνθρώποις in its general human sense.
  issues:
  - severity: low
    issue: ‘침울한 얼굴을 하지 마십시오’ is awkward Korean collocation.
    rationale: Korean normally says that one makes/wears a gloomy expression (침울한 표정을 짓다), rather than ‘does a gloomy face.’
  - severity: medium
    issue: The purpose clause is slightly less precise in ‘금식하는 것을 보이려고.’
    rationale: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες means ‘so that they may appear to people as fasting.’ Rendering it as ‘자신들이 금식하고 있는 것으로 보이려고’ preserves both the appearance-oriented verb and the participial sense.
  revised_text: 여러분이 금식할 때에는 위선자들처럼 침울한 표정을 짓지 마십시오. 그들은 사람들이 자신들이 금식하고 있는 것으로 보이려고 자기 얼굴을 흉하게 합니다. 진실로 내가 여러분에게 말합니다. 그들은 이미 자기들의 상을 다 받았습니다.
