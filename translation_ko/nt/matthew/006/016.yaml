  to: 여러분이 금식할 때에는 위선자들처럼 침울한 표정을 짓지 마십시오. 그들은 사람들이 자신들이 금식하고 있는 것으로 보이려고 자기 얼굴을 흉하게 합니다. 진실로 내가 여러분에게 말합니다. 그들은 이미 자기들의 상을 다 받았습니다.
