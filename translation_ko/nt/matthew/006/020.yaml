- from: 오히려 하늘에 여러분 자신을 위하여 보물을 쌓아 두십시오. 거기는 좀도 부식도 망가뜨리지 못하고, 도둑들이 뚫고 들어가 훔쳐 가지도 못하는 곳입니다.
  to: 오히려 여러분을 위하여 하늘에 보물을 쌓아 두십시오. 그곳에서는 좀이나 부식[a]도 망가뜨리지 않으며, 도둑들도 뚫고 들어와[b] 훔치지 않습니다.
  rationale: 본문은 대조를 나타내는 ‘오히려’, 지속적으로 쌓으라는 명령, ‘하늘에 있는 보물’의 비유를 유지했습니다. βρῶσις의 의미를 교리적으로 좁히지 않고 본문과 각주로 처리했으며, 도둑의 침입 동작도 원문의 구체성을 보존했습니다.
