review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 βρῶσις를 단지 금속의 ‘부식’으로 읽기보다 더 넓은 소모적 훼손으로 처리하고, διορύσσω의 ‘뚫고 들어가다’라는 구체적 이미지는 각주로 보완하는 것이 원문에 더 충실합니다. 원문의 직설적 현재형에 맞춰 ‘망가뜨리지 않으며/훔치지 않는’으로 옮겼습니다.
  naturalness: 초안은 자연스럽지만, ‘거기는 … 곳입니다’가 다소 중복됩니다. ‘그곳에서는’으로 연결하면 현대 표준 한국어 합쇼체에서 더 매끄럽습니다. ‘여러분 자신을 위하여’는 원문의 재귀적 이익 여격을 살리되 ‘여러분을 위하여’로 간결하게 표현할 수 있습니다.
  terminology: ‘하늘에 보물을 쌓아 두십시오’는 적절합니다. βρῶσις는 본문에서 ‘부식’으로 두되 그것이 녹만을 뜻하지 않을 수 있음을 각주로 밝혔습니다. ‘좀’과 ‘도둑’ 및 ‘보물’은 정착된 자연스러운 성서 용어입니다.
  issues:
  - severity: medium
    issue: βρῶσις를 ‘부식’으로만 제시
    rationale: 이 말은 녹·부식에만 한정되지 않고 재물을 소모하거나 훼손하는 현상을 더 넓게 가리킬 수 있습니다. 본문 표현은 유지할 수 있으나 어휘 범위를 각주로 밝혀야 합니다.
  - severity: low
    issue: διορύσσουσιν의 구체적 행동에 대한 보완 부재
    rationale: ‘뚫고 들어가’는 좋은 번역이지만, 흙벽 등을 파고 뚫고 들어가는 행위를 가리킬 수 있다는 문화적·어휘적 정보를 각주로 제공하면 원문의 이미지를 보존합니다.
  - severity: low
    issue: ‘거기는 … 곳입니다’의 중복적 연결
    rationale: 의미 오류는 아니나 ‘그곳에서는’이 관계부사 ὅπου의 반복을 한국어에서 더 자연스럽게 처리합니다.
