source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
  footnotes:
  - marker: a
    text: Or 'rust.' The Greek word can refer more broadly to consuming deterioration or corrosion.
    reason: lexical_alternative
  - marker: b
    text: Literally 'dig through,' likely referring to thieves breaking through the walls of a house.
    reason: cultural_note
translation:
  language: ko
  text: 오히려 여러분을 위하여 하늘에 보물을 쌓아 두십시오. 그곳에서는 좀이나 부식[a]도 망가뜨리지 않으며, 도둑들도 뚫고 들어와[b] 훔치지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘녹’. 그리스어는 녹이나 부식에만 한정되지 않고, 재물을 소모하거나 훼손하는 것을 더 넓게 가리킬 수 있습니다.
    reason: βρῶσις의 폭넓은 어휘 범위와 가능한 대안을 보존합니다.
  - marker: b
    text: 직역하면 ‘파고 들어와’. 아마도 도둑이 집의 흙벽 등을 뚫고 들어가는 일을 가리킵니다.
    reason: διορύσσουσιν의 문자적·문화적 배경을 설명합니다.
