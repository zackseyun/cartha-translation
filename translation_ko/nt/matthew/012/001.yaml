  verdict: revise
  source_fidelity: The draft correctly conveys the temporal setting, Jesus' passage through grainfields, the Sabbath setting, the disciples' hunger, and their eating. However, '이삭을 잘라' means cutting the heads of grain and does not accurately render τίλλειν, 'pluck/pull off.' Also, '곡식밭 사이로' can suggest passing between grainfields rather than through them.
  naturalness: The draft is generally clear and appropriately uses modern formal-polite 합쇼체. '배가 고파' is natural, but '배가 고파져' more directly reflects the ingressive sense of ἐπείνασαν ('became hungry').
  terminology: '''안식일,'' ''곡식밭,'' and ''이삭'' are suitable standard Korean biblical terms. ''예수님'' is consistent with respectful Korean Bible usage.'
  issues:
  - severity: medium
    issue: '''이삭을 잘라'' renders the action as cutting.'
    rationale: τίλλειν denotes plucking or pulling off, not cutting. '이삭을 따서' preserves the intended manual action without adding an instrument.
  - severity: low
    issue: '''곡식밭 사이로'' may imply movement between fields.'
    rationale: διὰ τῶν σπορίμων refers to going through the grainfields. '곡식밭을 지나가셨습니다' is more direct and natural.
  revised_text: 그때에 예수님께서 안식일에 곡식밭을 지나가셨습니다. 그분의 제자들이 배가 고파져 이삭을 따서 먹기 시작했습니다.
  revised_footnotes: []
  revision_rationale: The revision replaces '잘라' with '따서' to render plucking rather than cutting, clarifies movement through the grainfields, and retains the narrative sequence and ingressive sense of the disciples becoming hungry in natural modern formal Korean.
