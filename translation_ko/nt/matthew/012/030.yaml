    issue: ‘흩는 자’는 부자연스럽고 표준적인 현대 한국어 표현이 아닙니다.
    rationale: σκορπίζει는 ‘흩뜨리다/흩어 버리다’처럼 능동적으로 흩어지게 하는 뜻으로 옮겨야 합니다. ‘흩뜨리는 사람’은 원문의 현재형 대조와 의미를 자연스럽게 보존합니다.
  - severity: low
    issue: 띄어쓰기와 문체를 현대 표준어 합쇼체에 맞출 필요가 있습니다.
    rationale: ‘함께하지’로 붙여 쓰고, ‘사람입니다’로 종결하면 독자에게 더 자연스럽고 요청된 문체에 부합합니다.
