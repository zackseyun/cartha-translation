  source_fidelity: 초안은 두 병행절의 대조와 ‘나와 함께’라는 표현을 대체로 충실히 옮겼습니다. 그러나 ‘흩는’은 현대 표준어에서 자연스럽거나 적절한 동사 형태가 아니므로, σκορπίζει의 능동적 의미를 드러내는 표준 표현으로 고쳐야 합니다.
  naturalness: ‘나와 함께 하지’는 이 문맥에서 ‘나와 함께하지’로 붙여 쓰는 것이 자연스럽습니다. 또한 현대 한국어에서는 ‘자’보다 ‘사람’이 더 자연스럽고, 합쇼체 문장 종결은 ‘입니다’가 적절합니다.
  terminology: κατ’ ἐμοῦ는 ‘나를 거스르는’으로, συνάγων과 σκορπίζει는 각각 ‘모으는’과 ‘흩뜨리는’으로 옮겨 원문의 대조를 유지합니다. 특정 교리적 해석을 덧붙이지 않았습니다.
  issues:
