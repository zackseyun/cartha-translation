  to: 남방의 여왕[a]은 심판 때에 이 세대와 함께 일어나 이 세대를 정죄할 것입니다. 그 여왕은 솔로몬의 지혜를 들으려고 땅 끝에서 왔기 때문입니다. 보십시오, 솔로몬보다 더 큰 것이 여기 있습니다[b].
