  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
  footnotes:
  - marker: a
    text: Or, more idiomatically in English, “Is it lawful to heal on the Sabbath?” The Greek has the plural “on the Sabbaths,” a common way of referring to Sabbath days.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 손이 오그라든 한 사람이 있었습니다. 그들은 그분을 고발하려고 그분께 물었습니다. “안식일에[a] 병을 고치는 것이 율법상 허용됩니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 복수형으로 “안식일들에”라고 합니다. 이는 안식일을 가리키는 일반적인 표현입니다.
    reason: The Greek dative plural τοῖς σάββασιν is rendered by idiomatic Korean singular in the text; the note preserves the source form.
