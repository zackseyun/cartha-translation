  source_fidelity: 개정안은 δέ의 완만한 대조를 ‘그러나’로, πᾶν ῥῆμα ἀργόν을 ‘모든 무익한 말’로, ἀποδιδόναι λόγον의 관용구를 ‘해명해야 하다’로 옮겨 원문의 경고와 책임의 뜻을 보존합니다. ‘그것에 관해 답해야’는 한국어에서 지시 대상이 다소 어색하고 법정적 책임을 나타내는 관용구로는 덜 정확합니다.
  naturalness: 초안의 ‘말한다’는 요구된 현대 합쇼체와 일치하지 않으며, ‘그것에 관해 답해야 할 것이다’는 중복되고 부자연스럽습니다. ‘말합니다’ 및 ‘해명해야 할 것입니다’가 현대 표준어의 격식 있는 문체에 자연스럽습니다.
  terminology: ‘심판의 날’은 ἡμέρᾳ κρίσεως에 정확하고 한국어 성경 문맥에서도 익숙합니다. ἀργόν의 의미 범위는 본문에서 ‘무익한’으로 유지하되, ‘헛된’ 및 ‘부주의한’의 가능성은 각주로 밝혀 해석을 과도하게 좁히지 않았습니다.
