    rationale: ‘내가 너희에게 말한다’는 평서체이므로 지정된 현대 formal-polite 합쇼체에 맞지 않습니다.
  - severity: medium
    issue: 회계/책임 관용구의 번역
    rationale: ἀποδώσουσιν περὶ αὐτοῦ λόγον은 해당 말에 관하여 책임 있게 설명하거나 حساب을 해야 한다는 뜻입니다. ‘그것에 관해 답해야’는 한국어에서 어색하며 그 관용적 법정 의미를 충분히 드러내지 못합니다.
