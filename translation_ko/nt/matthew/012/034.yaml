  source_fidelity: 핵심 의미는 대체로 충실합니다. γεννήματα ἐχιδνῶν의 강한 비난, πονηροί의 도덕적 평가, 그리고 마음의 충만함과 말의 관계를 보존합니다. 다만 마지막 문장의 ‘마음에 가득 찬 것에서 입이 말하기’는 한국어 문장 구조가 부자연스럽습니다.
  naturalness: ‘-겠느냐?’와 ‘-기 때문이다’는 지정된 현대 합쇼체와 일관되지 않습니다. 질문과 이유 절을 각각 ‘-겠습니까?’, ‘-기 때문입니다’로 고쳐 현대 표준어의 격식 있는 존대 문체를 유지해야 합니다.
  terminology: ‘독사의 자식들아’는 γεννήματα ἐχιδνῶν의 혈통·성품 비유와 책망의 어조를 무리 없이 살립니다. ‘악한’과 ‘마음’도 각각 πονηροί와 καρδία에 적절합니다.
  issues:
