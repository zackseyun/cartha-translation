  rationale: 행위자의 방향을 원문대로 바로잡고, 현재분사 및 담화 접속을 반영했습니다. ‘대답하여 말씀하셨습니다’는 원문의 관용적 ‘대답하고 말씀하셨다’를 한국어 문체에 맞게 유지한 것이므로 별도 각주는 필요하지 않습니다.
