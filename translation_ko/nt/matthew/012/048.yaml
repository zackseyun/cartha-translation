review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그에게 말한 자에게’는 원문의 τῷ λέγοντι αὐτῷ(‘그에게 말하고 있던 사람에게’)에서 대명사 관계가 뒤바뀌어, 예수님이 그 사람에게 말했다는 뜻이 됩니다. 이를 바로잡고, ὁ δὲ의 담화 전환을 ‘그러나’로 반영했습니다. ἀποκριθεὶς εἶπεν은 한국어에서 자연스럽게 ‘대답하여 말씀하셨습니다’로 옮길 수 있습니다.
  naturalness: ‘자신에게 말하던 사람에게’는 현재분사의 진행성을 자연스러운 현대 한국어로 반영합니다. 인용문의 ‘누가 내 어머니이며, 누가 내 형제들입니까?’는 현대적인 합쇼체를 유지하면서 두 수사 의문문의 병렬을 보존합니다.
  terminology: μήτηρ는 ‘어머니’, ἀδελφοί는 이 장면의 남성 가족 지시를 따라 ‘형제들’로 옮겼습니다. 후속 문맥의 해석을 본문에 덧붙이지 않았습니다.
  issues:
  - severity: high
    issue: 대명사 관계의 역전
    rationale: ‘그에게 말한 자’는 예수님이 그 사람에게 말한 것처럼 읽히지만, 원문은 그 사람이 예수님에게 말하고 있음을 뜻합니다.
  - severity: low
    issue: δέ의 담화 전환 미반영
    rationale: ‘그러나’를 보충하면 앞 발화에 대한 응답이라는 전환이 더 충실하게 드러납니다.
  revised_text: 그러나 예수님께서는 자신에게 말하던 사람에게 대답하여 말씀하셨습니다. “누가 내 어머니이며, 누가 내 형제들입니까?”
