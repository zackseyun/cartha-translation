  source_fidelity: 그리스어의 생생한 현재(λέγει, εὑρίσκει)와 부정한 영을 가리키는 문맥상 주체를 한국어에서 자연스럽게 반영할 필요가 있습니다. 원문의 ‘내 집’, ‘내가 나온 곳’, 그리고 세 상태(비어 있음/쓸림/정돈됨)는 유지되어야 합니다.
