  terminology: ‘영’은 앞 절의 부정한 영을 자연스럽게 지시하며, ‘집’은 비유를 해설하지 않고 그대로 보존합니다. σχολάζοντα는 여기서 ‘비어 있고’로, κεκοσμημένον은 ‘정돈되어 있고’로 옮겨 과도한 해석 없이 의미 범위를 반영합니다.
