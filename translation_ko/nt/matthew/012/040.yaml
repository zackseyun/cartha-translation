  naturalness: ‘사흘 낮과 사흘 밤을 있었던’ is not idiomatic because 있다 requires a locative complement and the duration should be marked as a temporal phrase. Adding 동안 and retaining the locative produces natural modern formal Korean.
  terminology: 인자 is the established Korean biblical rendering of ὁ υἱὸς τοῦ ἀνθρώπου. 큰 바다 생물 retains the breadth of κῆτος without selecting ‘fish,’ while 땅의 심장부 preserves the source metaphor without deciding its referent.
  issues:
