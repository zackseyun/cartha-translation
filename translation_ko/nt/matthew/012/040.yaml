    issue: 큰 물고기 is overly specific for τοῦ κήτους.
    rationale: The Greek term is broader than a zoologically specific ‘fish’; ‘큰 바다 생물’ retains its lexical breadth.
  - severity: high
    issue: 땅 속 does not render ‘the heart of the earth.’
    rationale: It substitutes a general location for the Greek metaphor and may prematurely narrow the phrase’s disputed reference.
  - severity: medium
    issue: 사흘 낮과 사흘 밤을 있었던 is grammatically and idiomatically deficient.
    rationale: The duration needs to be marked with 동안, while 있다 must be linked to its location.
