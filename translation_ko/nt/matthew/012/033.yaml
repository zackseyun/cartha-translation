  source_fidelity: 초안은 두 개의 부정과거 명령형(ποιήσατε)을 조건문·서술문(‘만들면 … 된다’)으로 바꾸고, ἤ … ἤ의 양자택일 대구를 약화합니다. 이를 명령형과 ‘아니면’의 대조로 복원해야 합니다. 마지막 절의 ‘열매로 알 수 있습니다’는 ἐκ ... γινώσκεται를 자연스럽게 충실히 옮깁니다.
