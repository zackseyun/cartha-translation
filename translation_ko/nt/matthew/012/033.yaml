  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
  footnotes:
  - marker: a
    text: Or 'bad' instead of 'rotten' for σαπρός; the Greek can denote something spoiled, corrupt, or worthless.
    reason: lexical_alternative
  - marker: b
    text: The repeated 'make' may function rhetorically as 'consider' or 'show to be,' but the Greek form is imperative.
    reason: alternative_reading
translation:
  language: ko
  text: 나무를 좋게 만들고 그 열매도 좋게 만드십시오[a]. 아니면 나무를 썩게 만들고 그 열매도 썩게 만드십시오. 나무는 그 열매로 알 수 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만드십시오’는 원문의 명령형입니다. 이 표현은 문맥상 ‘좋은 것으로 여기거나 드러내십시오’라는 수사적 뉘앙스를 가질 수도 있습니다.
    reason: alternative_reading
