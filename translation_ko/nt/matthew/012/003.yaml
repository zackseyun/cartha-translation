  source_fidelity: 원문은 다윗이 배고팠다는 것을 단수 동사로 명시하고, ‘그와 함께 있던 사람들’에 대해서는 동사가 생략되어 있습니다. 초안은 동행자들까지 배고팠다고 명시하며 원문의 생략에서 생기는 여지를 해소하므로, 이를 각주로 밝혀야 합니다. 또한 δέ의 응답 연결을 ‘그러나’로 반영하는 것이 적절합니다.
  naturalness: 초안의 ‘읽지 못하였느냐’는 현대 표준어 합쇼체 목표에 맞지 않습니다. ‘읽지 않으셨습니까?’가 현대적이면서도 수사적 질문의 힘을 자연스럽게 살립니다. 인용부호의 닫는 부호도 필요합니다.
  terminology: ‘다윗’은 표준적인 인명 표기입니다. ‘그와 함께 있던 사람들’은 οἱ μετ’ αὐτοῦ를 자연스럽고 과도한 해석 없이 옮깁니다. 문맥상 화자가 예수님임을 밝히는 것은 허용되지만, 원문의 대명사에 비해 약간 명시적입니다.
