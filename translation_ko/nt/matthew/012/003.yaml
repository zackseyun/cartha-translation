  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
  footnotes:
  - marker: a
    text: Or, “Did you not read what David did when he and those with him were hungry?” The Greek can be understood with the hunger applying to both David and those with him, though the singular verb explicitly refers to David.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 예수님께서 그들에게 말씀하셨습니다. 「다윗과 그와 함께 있던 사람들이 배고팠을 때에 그가 한 일을 너희가 읽지 않으셨습니까?[a]」
  philosophy: optimal-equivalence
  footnotes:
