    text: 그리스어에서 ‘배고팠다’는 단수 동사로 다윗에게 명시적으로 연결됩니다. 그러나 문맥상 그와 함께 있던 사람들에게도 배고픔이 적용되는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
