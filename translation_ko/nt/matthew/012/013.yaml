  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
  footnotes:
  - marker: a
    text: Or “it was healed”; the Greek verb emphasizes restoration to a proper condition.
    reason: lexical_alternative
  - marker: b
    text: Literally, “healthy as the other,” with “other” referring to the man's other hand.
    reason: lexical_alternative
translation:
