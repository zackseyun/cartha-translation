revisions:
- from: 그러고 나서 예수님이 그 사람에게 말씀하셨습니다. 「네 손을 펴라.」 그가 손을 펴니, 다른 손처럼 회복되어 건강해졌습니다.
  to: 그때 예수님께서 그 사람에게 말씀하셨습니다. 「네 손을 펴라.」 그가 손을 폈더니, 그 손은 다른 손처럼 건강하게 회복되었습니다.
  rationale: The revision makes the hand—not the man—the explicit subject of restoration, preserves the restoration nuance of ἀπεκατεστάθη, and renders the comparison “healthy like the other [hand]” clearly. “그때” gives a direct, natural rendering of τότε.
  reviewer_model: gpt-5.6-terra
