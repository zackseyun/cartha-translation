review_pass:
  verdict: revise
  source_fidelity: 초안은 문장의 기본 구조와 심판·회개라는 핵심 의미를 충실히 옮겼습니다. 그러나 중성 비교급 πλεῖον을 인격 남성으로 한정하는 ‘더 큰 분’은 원문의 표현 범위를 좁힙니다. 또한 εἰς τὸ κήρυγμα은 단순히 ‘듣고’라는 청취 행위보다 요나의 선포에 대한 반응을 나타내므로 이를 직접 반영하는 편이 더 정확합니다.
  naturalness: ‘심판 때에’, ‘이 세대와 함께 일어나’, ‘정죄할 것입니다’는 현대 표준어 합쇼체에서 자연스럽습니다. 담화 표지 ἰδού는 ‘보십시오’로 옮겨 현대적이면서도 강조의 기능을 유지했습니다.
  terminology: μετενόησαν은 ‘회개하였습니다’로, κατακρινοῦσιν은 ‘정죄할 것입니다’로 유지했습니다. ἄνδρες의 명시된 남성 복수는 ‘니느웨 남자들’로 반영했습니다. πλεῖον의 중성 표현은 본문에서 ‘더 큰 것이’로 보존하고, 인격적 번역 가능성은 각주로 제시했습니다.
  issues:
