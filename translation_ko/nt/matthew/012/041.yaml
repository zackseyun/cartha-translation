revisions:
- from: 니느웨 사람들이 심판 때에 이 세대와 함께 일어나 이 세대를 정죄할 것이다. 그들이 요나의 선포를 듣고 회개하였기 때문이다. 그런데 보라, 요나보다 더 큰 분이 여기 있다.
  to: 니느웨 남자들이 심판 때에 이 세대와 함께 일어나 그 세대를 정죄할 것입니다. 그들이 요나의 선포에 회개하였기 때문입니다. 보십시오, 요나보다 더 큰 것이 여기 있습니다.[a]
  rationale: 원문의 어순과 논리를 유지하면서, ‘듣고’가 추가하던 구체적 행위를 제거하고 εἰς의 반응 의미를 직접 옮겼습니다. 중성 πλεῖον은 ‘더 큰 것’으로 번역하고 대안적 인격 번역을 각주로 제시하여 문맥적 지시와 문법 형태를 함께 보존했습니다. 문장 종결과 ‘보십시오’는 요청된 현대 합쇼체에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
