    rationale: 니느웨 사람들이 요나의 선포에 반응하여 회개했다는 뜻이므로 ‘요나의 선포에 회개하였습니다’가 더 직접적입니다.
  - severity: low
    issue: ‘니느웨 사람들’은 ἄνδρες의 명시적 남성 복수를 중화합니다.
    rationale: 한국어에서는 다소 표시된 표현이지만, 원문의 성별 명시성을 보존하기 위해 ‘니느웨 남자들’로 옮깁니다.
