  source_fidelity: 초안은 ἐλπιοῦσιν의 미래 의미와 ‘그의 이름에 소망을 두다’를 대체로 잘 옮겼습니다. 그러나 καὶ가 빠졌고, ἔθνη를 ‘이방인들’로만 옮겨 이사야 인용문의 더 넓은 ‘민족들/나라들’ 범위를 좁혔습니다.
  naturalness: ‘민족들이 그의 이름에 소망을 둘 것입니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 성서 문맥의 표현도 유지합니다. 인용문의 종결 부호는 앞 문맥에서 이어지는 것으로 보이므로 보존했습니다.
  terminology: ἔθνη는 본문에서 ‘민족들’로 옮기고, 문맥상 가능한 ‘이방인들’은 각주로 제시합니다. ‘이름’과 ‘소망을 두다’는 원문의 신학적·관용적 울림을 과도하게 해석하지 않고 보존합니다.
  issues:
