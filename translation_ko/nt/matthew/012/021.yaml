  - severity: medium
    issue: ἔθνη를 ‘이방인들이’로 한정했습니다.
    rationale: 이 문맥에서 ‘이방인들’은 가능한 해석이지만, 원문의 기본 범위와 인용문의 열방적 전망을 보존하려면 본문은 ‘민족들’이 더 적절합니다. ‘이방인들’은 각주 대안으로 남깁니다.
