  source_fidelity: 개정이 필요합니다. 초안은 πῶς(‘어떻게’)를 빠뜨렸고, SBLGNT 본문의 복수 ἔφαγον을 ‘그가 … 먹었다’라는 단수로 옮겼습니다. 또한 ‘자기와 함께 있는 자들’은 본문상 그 자신과 나란히 먹는 것이 허락되지 않은 이들입니다.
  naturalness: ‘진설병’은 현대 표준어 성경 문맥에서도 통용되는 정확한 제의 용어입니다. 복수 주어와 제한 조항을 분명히 하도록 문장을 재구성하면 자연스럽고 오해가 없습니다.
  terminology: ‘하나님의 집’, ‘진설병’, ‘제사장들’, ‘허락되지 않은’은 원문의 제의적·법적 의미를 적절히 보존합니다. ‘허락되지 않은’은 ἐξὸν의 허용/합법성 의미를 자연스럽게 반영합니다.
  issues:
  - severity: high
    issue: πῶς의 의미가 누락되었습니다.
    rationale: 본문은 다윗이 하나님의 집에 ‘어떻게 들어가서’ 진설병을 먹었는지를 예로 듭니다. 초안에는 이 의문·방식 요소가 없습니다.
  - severity: high
    issue: ἔφαγον의 복수 주어가 단수 ‘그가 … 먹었다’로 변경되었습니다.
    rationale: 제공된 SBLGNT 본문은 복수형 ἔφαγον을 읽으므로, 본문은 ‘그들이 먹었다’로 번역하고 단수 독법은 각주에 밝혀야 합니다.
  - severity: medium
    issue: 먹는 것이 허락되지 않은 대상의 병렬이 불명확합니다.
    rationale: 원문은 ‘그 자신에게도, 그와 함께 있던 이들에게도’ 허락되지 않았다고 말합니다. 초안은 동행자만 먹을 수 없었던 것처럼 읽힐 수 있습니다.
  revised_text: 그가 어떻게 하나님의 집에 들어가서, 자신도 그와 함께 있던 사람들도 먹는 것이 허락되지 않고 오직 제사장들에게만 허락된 진설병을 그들이 먹었는지를 말입니다.
  revised_footnotes:
  - marker: a
    text: 일부 사본과 독법에는 ‘그가 먹었다’라고 되어 있습니다.
    reason: textual_variant
  revision_rationale: SBLGNT의 πῶς와 복수 ἔφαγον을 본문에 반영했습니다. 진설병을 먹는 것이 다윗 자신과 동행자들에게 모두 허락되지 않았으며 제사장들에게만 허락되었다는 제한을 명확히 했습니다. 단수 독법은 본문에 채택하지 않고 각주로 보존했습니다.
