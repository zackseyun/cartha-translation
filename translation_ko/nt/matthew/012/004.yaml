  source_fidelity: 개정이 필요합니다. SBLGNT 본문은 ἔφαγον(복수)을 읽으므로, 다윗이 동행자들과 함께 진설병을 먹었다는 뜻을 본문에 드러내야 합니다. 또한 πῶς(‘어떻게’)가 초안에서 빠졌습니다.
  naturalness: ‘진설병’은 한국어 성경 문맥에서 자연스럽고 알아볼 수 있는 용어입니다. 다만 ‘먹을 수 없고’는 허용·규정의 뉘앙스를 충분히 나타내지 못하며, 원문의 관계절 구조도 다소 불명확합니다.
  terminology: ‘하나님의 집’, ‘진설병’, ‘제사장들’은 적절합니다. ἐξὸν의 제의적·규범적 의미는 ‘먹는 것이 허락되지 않은’으로 옮기는 것이 안전합니다.
  issues:
  - severity: high
    issue: ἔφαγον의 복수 주어가 반영되지 않음
    rationale: 초안의 ‘그가 … 먹었다’는 다윗만을 먹은 주체로 제시합니다. SBLGNT의 본문은 복수형이므로 동행자들도 함께 먹은 것으로 번역해야 합니다.
  - severity: medium
    issue: πῶς(‘어떻게’)가 누락됨
    rationale: 이 절은 예수님의 질문에 속한 간접의문 내용으로, 다윗의 행동 방식을 도입하는 πῶς를 보존해야 합니다.
  - severity: medium
    issue: ‘먹을 수 없고’가 ἐξὸν의 허용·법규 의미를 약화함
    rationale: 문맥은 제사장에게만 허용된 성별된 빵에 관한 규정이므로 ‘먹는 것이 허락되지 않은’이 원문의 의미를 더 정확히 전달합니다.
  revised_text: 그가 어떻게 하나님의 집에 들어가서, 그와 함께 있던 이들과 함께 오직 제사장들만 먹는 것이 허락된 진설병을 먹었는지를 말입니다.
  revised_footnotes:
  - marker: a
    text: 일부 사본은 ‘그가 먹었다’라는 단수형을 읽습니다.
    reason: textual_variant
  revision_rationale: SBLGNT의 복수형 ‘그들이 먹었다’를 ‘그와 함께 있던 이들과 함께 … 먹었다’로 반영하고, 누락된 ‘어떻게’를 복원했습니다. 제사장들만 먹는 것이 허락되었다는 표현으로 원문의 배타적 제의 규정을 자연스럽게 전달했습니다. 단수 읽기는 본문에 채택하지 않고 각주로 보존했습니다.
