  verdict: revise
  source_fidelity: The draft accurately preserves the crowds’ astonishment, the plural collective subject, and the title ‘Son of David.’ However, ‘아니냐?’ normally invites an affirmative answer in Korean, whereas μήτι frames a hesitant question tending toward a negative expectation. The imperfect ἐξίσταντο is also better represented as a continuing/intense reaction than by the connective ‘놀라며.’
  naturalness: ‘모든 무리가 크게 놀라 말했습니다’ is natural formal Korean narrative prose. ‘설마 …이겠습니까?’ naturally conveys an astonished, hesitant question with a negative-leaning expectation without turning it into a categorical denial.
  terminology: ‘다윗의 자손’ is the established Korean biblical rendering and retains the source title’s Davidic-messianic force without interpretively replacing it with ‘메시아.’
  issues:
  - severity: medium
    issue: The Korean question ‘이 사람이 다윗의 자손이 아니냐?’ has the wrong pragmatic tendency for μήτι.
    rationale: In ordinary Korean, -아니냐? commonly seeks confirmation of a positive proposition (‘Isn’t he?’), while μήτι conventionally signals hesitation and often anticipates a negative response. ‘설마 …이겠습니까?’ retains the question and its negative-leaning force.
  - severity: low
    issue: ‘놀라며’ weakens the imperfect reaction into a simple connective action.
    rationale: ἐξίσταντο depicts the crowds as being greatly astonished. ‘크게 놀라’ better expresses the intensity while remaining idiomatic Korean.
  revised_text: 모든 무리가 크게 놀라 말했습니다. “이 사람이 설마 다윗의 자손[a]이겠습니까?”[b]
