    rationale: 초안의 ‘낸다’는 평서체 해라체이므로, 지정된 현대 formal-polite 합쇼체에 맞게 ‘내놓습니다’로 고쳐야 합니다.
  - severity: low
    issue: ‘곳간’의 어휘 선택
    rationale: θησαυρός는 보물, 보화, 저장된 귀중한 것을 뜻합니다. ‘곳간’은 storehouse/granary라는 물리적 장소의 의미가 두드러져 비유의 원어 의미를 다소 좁힙니다.
  revised_text: 선한 사람은 자기의 선한 보화에서 선한 것을 내놓습니다. 악한 사람은 자기의 악한 보화에서 악한 것을 내놓습니다.
