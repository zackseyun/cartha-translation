  source_fidelity: 그리스어의 대칭 구조와 ‘선한 것/악한 것’의 넓은 의미는 대체로 보존했습니다. 그러나 θησαυρός는 ‘곳간’보다 ‘보화/보물’에 가깝고, 본문의 비유적 ‘저장된 보물’의 뜻을 더 잘 드러내야 합니다.
  naturalness: 초안의 종결형 ‘낸다’는 요청된 현대 표준어 합쇼체와 맞지 않습니다. ‘내놓습니다’로 하면 ἐκβάλλει의 밖으로 내는 동작을 자연스럽게 나타냅니다.
  terminology: ἀγαθός와 πονηρός의 반복은 각각 ‘선한’과 ‘악한’으로 유지했습니다. θησαυρός는 비유적 표현을 살려 ‘보화’로 옮겼습니다. ‘곳간’은 구체적인 저장 건물이라는 뜻이 강해 여기에는 덜 적절합니다.
