    reason: lexical_alternative
translation:
  language: ko
  text: 「보십시오, 내가 택한 나의 종, 내 마음이 기뻐한 내가 사랑하는 이입니다. 내가 나의 영을 그 위에 둘 것이며, 그는 민족들에게 정의[a]를 선포할 것입니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심판’.
    reason: lexical_alternative; κρίσις는 이 문맥에서 ‘정의’로 옮겼으나 ‘심판’의 뜻도 가능합니다.
  - marker: b
    text: 또는 ‘민족들에게’를 ‘이방인들에게’로 옮길 수 있습니다.
    reason: lexical_alternative; ἔθνη는 문맥에 따라 ‘민족들’ 또는 ‘이방인들’을 뜻할 수 있습니다.
