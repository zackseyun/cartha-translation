  source_fidelity: 초안의 ‘내 마음에 기뻐하는’은 εὐδόκησεν ἡ ψυχή μου(‘내 마음이 기뻐하였다’)의 주어와 구문을 정확히 반영하지 못합니다. 이를 ‘내 마음이 기뻐한’으로 고쳐, 하나님의 마음이 그 사랑하는 이에게 기뻐하였다는 뜻을 보존했습니다. 또한 ἐπ’ αὐτόν은 ‘그 위에’로, κρίσις는 본문에서 ‘정의’로 옮겼습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체에서 자연스럽고, 이사야 인용문의 격조도 유지합니다. ‘보라’보다 ‘보십시오’가 요청된 현대 formal-polite register에 더 알맞습니다.
  terminology: παῖς는 이사야의 종 본문 맥락에 따라 ‘종’으로, ἀγαπητός는 ‘내가 사랑하는 이’로, πνεῦμα는 하나님의 영을 가리키므로 ‘나의 영’으로 번역했습니다. ἔθνη는 포괄적 의미를 살려 ‘민족들’로 옮기고, 대안인 ‘이방인들’을 각주에 제시했습니다.
