  text: 예수님께서 대답하여 그들에게 말씀하셨습니다. “악하고 음란한 세대가 표적을 구하나, 예언자 요나의 표적 외에는 그 세대에게 표적이 주어지지 않을 것입니다.”
  philosophy: optimal-equivalence
