review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 잘 옮겼습니다. 다만 원문의 μοιχαλὶς는 문자적 간음의 함의와 예언서적 비유를 함께 지닌 말이므로, 본문의 ‘음란한’은 유지하되 그 범위를 각주로 밝혀 두는 것이 좋습니다. αὐτῇ는 ‘세대’를 가리키므로 ‘그 세대에게’로 명시해 한국어의 지시 관계를 자연스럽게 했습니다.
  naturalness: 합쇼체 문장과 ‘표적’은 현대 한국어 성경 문맥에서 자연스럽습니다. 직접 인용문의 닫는 따옴표가 누락되어 있어 구조상 반드시 보완해야 합니다. ‘그것에게’보다 ‘그 세대에게’가 자연스럽습니다.
  terminology: ‘세대’, ‘표적’, ‘예언자 요나’는 적절합니다. ‘악하고 음란한 세대’는 한국어 성경 전통과 자연스러운 사용에 맞으며, ‘음란한’의 언약 불성실 비유 가능성은 각주에서만 설명하여 본문의 긴장을 보존합니다.
  issues:
  - severity: medium
    issue: 직접 인용문의 닫는 따옴표가 누락됨
    rationale: 번역문이 구조적으로 미완성이므로 닫는 인용 부호를 추가해야 합니다.
  - severity: low
    issue: ‘그것에게’의 지시 대상 표현
    rationale: 원문의 여성 단수 대명사는 ‘세대’를 받습니다. 한국어에서는 ‘그 세대에게’가 더 자연스럽고 의미도 분명합니다.
  - severity: low
    issue: ‘음란한’의 비유적 함의가 본문에서만으로는 충분히 드러나지 않음
    rationale: μοιχαλὶς는 간음과 언약적 불성실의 예언서적 비유를 함께 환기할 수 있습니다. 해석을 본문에 덧붙이지 않고 각주로 보완하는 것이 적절합니다.
  revised_text: 예수님께서 대답하여 그들에게 말씀하셨습니다. “악하고 음란한 세대가 표적을 구하나, 예언자 요나의 표적 외에는 그 세대에게 표적이 주어지지 않을 것입니다.”
  revised_footnotes:
  - marker: a
    text: ‘음란한’은 문자적인 간음뿐 아니라, 예언서에서 하나님께 대한 언약적 불성실을 가리키는 비유를 환기할 수도 있습니다.
    reason: μοιχαλὶς의 문자적·비유적 함의를 보존하기 위한 설명
  revision_rationale: 인용문의 누락된 닫는 따옴표를 보완하고, 대명사의 한국어 지시 대상을 자연스럽게 명시했습니다. ‘음란한’을 ‘불충실한’ 등으로 해석적으로 바꾸지 않아 원문의 표현과 신학적 긴장을 보존했으며, 필요한 비유적 함의만 각주로 제시했습니다.
