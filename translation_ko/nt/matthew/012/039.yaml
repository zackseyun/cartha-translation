  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
  footnotes:
  - marker: a
    text: Or “the sign of the prophet Jonah.”
    reason: lexical_alternative
  - marker: b
    text: “Adulterous” likely evokes covenant unfaithfulness as well as literal sexual immorality; compare prophetic uses of adultery imagery for spiritual infidelity.
    reason: cross_reference
