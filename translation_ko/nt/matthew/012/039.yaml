review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the future passive exclusion ('no sign will be given ... except') and preserves 'the sign of Jonah the prophet.' However, '음란한' is broader than μοιχαλὶς and does not as clearly retain the adultery/covenant-infidelity imagery. The final quotation mark is also missing.
  naturalness: The narrative formula is natural in formal Korean as '대답하여 ... 말씀하셨습니다.' Replacing the impersonal '그것에게' with '그 세대에게' is idiomatic Korean while making the pronoun’s antecedent explicit.
  terminology: Use '간음하는' for μοιχαλὶς rather than '음란한,' preserving the source term’s literal force and its established prophetic metaphorical resonance without reducing it to an interpretation such as '불충실한.' '표적' appropriately renders σημεῖον, and '예언자' appropriately renders προφήτης.
  issues:
  - severity: medium
    issue: '''음란한'' for μοιχαλὶς'
    rationale: '''음란한'' can denote sexual obscenity or general immorality, whereas μοιχαλὶς specifically evokes adultery and, in biblical idiom, covenantal infidelity. ''간음하는'' better preserves that lexical and intertextual force.'
  - severity: medium
    issue: Unnatural Korean pronoun in '그것에게'
    rationale: 'Although αὐτῇ refers grammatically to the singular feminine ''generation,'' Korean naturally repeats the collective antecedent here: ''그 세대에게.'''
  - severity: high
    issue: Unclosed direct quotation
    rationale: The draft lacks the closing Korean quotation mark, creating a structural punctuation error.
  revised_text: 예수님께서 대답하여 그들에게 말씀하셨습니다. “악하고 간음하는 세대가 표적을 구하나, 예언자 요나의 표적 외에는 그 세대에게 아무 표적도 주어지지 않을 것입니다.”
  revised_footnotes:
  - marker: a
    text: ‘간음하는’은 문자적인 간음의 뜻과 더불어, 예언서에서처럼 하나님께 대한 언약적 불충실을 비유적으로 암시할 수 있습니다.
    reason: μoiχαλὶς의 문자적 의미와 예언서적 비유를 보존하되, 본문에서 어느 한 의미로 한정하지 않기 위함
  revision_rationale: 'The revision corrects the incomplete quotation and makes the Korean idiomatic while preserving the Greek wording’s key distinctions: the moral indictment is retained as ''악하고 간음하는,'' σημεῖον remains ''표적,'' the future passive remains explicit, and the meaning of Jonah’s sign is not imported from the following context. The note preserves the recognized prophetic resonance of μοιχαλὶς without making it the sole meaning.'
