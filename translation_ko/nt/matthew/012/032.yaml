  source_fidelity: 수정안은 ὃς ἐὰν/ὃς δ᾽ ἂν의 포괄적 조건을 ‘누구든지’로, κατά의 적대적 뜻을 ‘거슬러’로, ‘인자’와 ‘성령’을 각각 보존합니다. ἀφεθήσεται의 수동 미래도 ‘용서받을 것입니다/못할 것입니다’로 일관되게 옮겼습니다. αἰών의 시간적 대조는 세대(동시대 사람들)로 오해될 여지가 적은 ‘이 시대/오는 시대’로 반영했습니다.
  naturalness: 초안은 전반적으로 자연스럽지만, 지정된 현대 합쇼체에 맞추어 문장 종결을 ‘것입니다’로 바꾸어야 합니다. 또한 ‘성령을 거슬러 말하는 자’보다 두 절을 평행하게 한 ‘성령을 거슬러 말하면’이 원문의 조건 구조와 현대 한국어 문체에 더 자연스럽습니다.
  terminology: ‘인자’와 ‘성령’은 확립된 성경 용어로 적절합니다. 여기서 αἰών은 사람들의 한 세대를 뜻할 수도 있는 ‘세대’보다 시대적·종말론적 대조를 드러내는 ‘시대’가 더 정확합니다.
