  to: 누구든지 인자를 거슬러 한마디 말하면, 그 사람은 용서받을 것입니다. 그러나 누구든지 성령을 거슬러 말하면, 이 시대에서도 오는 시대에서도 용서받지 못할 것입니다.
  rationale: 합쇼체를 일관되게 적용하고, 두 조건절의 평행을 회복했습니다. 또한 ‘시대’로 옮겨 αἰών과 μέλλων의 현재 시대/오는 시대 대조를 자연스럽고 정확하게 드러냈습니다. 원문이 성령을 거슬러 하는 말을 더 구체적으로 정의하지 않으므로 해석적 설명은 덧붙이지 않았습니다.
