    rationale: 원문은 ‘이 시대’와 ‘오는 시대’의 시간적 대조입니다. ‘세대’는 특정 세대의 사람들을 가리키는 뜻으로도 자연스럽게 읽혀 의미가 좁아질 수 있습니다.
