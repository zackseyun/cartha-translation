revisions:
- from: 만일 사탄이 사탄을 쫓아낸다면, 그는 스스로 분쟁한 것이다. 그러면 그의 나라가 어떻게 서겠느냐?
  to: 그리고 만일 사탄이 사탄을 내쫓는다면, 그는 자기 자신을 거슬러 분열된 것입니다. 그러면 그의 왕국이 어떻게 서겠습니까?
  rationale: 원문의 접속사 καὶ를 '그리고'로, 조건과 논증의 흐름을 유지했습니다. '자기 자신을 거슬러 분열된 것입니다'는 ἐφ’ ἑαυτὸν ἐμερίσθη의 대립 관계와 수동적 분열을 보존하면서 현대 합쇼체로 자연스럽게 옮긴 것입니다. 미래형 수사 질문은 '어떻게 서겠습니까?'로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:20:07Z'
review_pass:
  verdict: revise
  source_fidelity: 조건절(καὶ εἰ)과 사탄이 사탄을 내쫓는다는 가정, 그 결과로서 자기 자신을 거슬러 분열되었다는 논리, 그리고 그의 왕국이 존립할 수 있겠느냐는 미래적 수사를 대체로 담고 있습니다. 다만 '스스로 분쟁한 것이다'는 ἐφ’ ἑαυτὸν ἐμερίσθη의 '자기 자신을 거슬러 분열되었다'는 뜻을 충분히 정확하고 자연스럽게 전달하지 못합니다.
  naturalness: '''쫓아낸다면''과 ''나라가 어떻게 서겠느냐?''는 현대 한국어에서 이해 가능하지만, 귀신을 내쫓는 문맥의 관용적 표현으로는 ''내쫓는다면''이 더 자연스럽고, 합쇼체의 현대적 격식에는 ''서겠습니까?''가 적절합니다. ''분쟁한 것이다''는 이 문맥에서 어색합니다.'
  terminology: Σατανᾶς는 통용 표기인 '사탄'으로 유지합니다. ἐκβάλλει는 '내쫓다', βασιλεία는 문맥상 '왕국'으로 옮기는 것이 안정적입니다. '분열되었다'는 수동태와 내적 대립의 논리를 보존합니다.
  issues:
  - severity: medium
    issue: '''스스로 분쟁한 것이다'''
    rationale: ἐφ’ ἑαυτὸν은 '자기 자신을 거슬러/대적하여'이고 ἐμερίσθη는 '분열되었다'입니다. '분쟁하다'는 능동적 행위처럼 들리며, 자기 자신을 거슬러 분열된 상태라는 표현을 흐립니다.
  - severity: low
    issue: '''쫓아낸다면'''
    rationale: 오역은 아니지만, ἐκβάλλω의 축출 의미와 해당 문맥의 관용을 위해 '내쫓는다면'이 더 적절합니다.
  - severity: low
    issue: 종결 표현 '서겠느냐?'
    rationale: 요구된 현대 표준어 합쇼체에 맞춰 '서겠습니까?'로 고치는 것이 좋습니다.
  revised_text: 그리고 만일 사탄이 사탄을 내쫓는다면, 그는 자기 자신을 거슬러 분열된 것입니다. 그러면 그의 왕국이 어떻게 서겠습니까?
