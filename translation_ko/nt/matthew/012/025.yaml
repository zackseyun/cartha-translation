id: MAT.12.25
reference: Matthew 12:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
  footnotes:
  - marker: a
    text: Or 'reasonings' or 'intentions' for 'thoughts.'
    reason: lexical_alternative
  - marker: b
    text: Or 'becomes desolate' or 'is brought to ruin.'
    reason: lexical_alternative
  - marker: c
    text: '''House'' may also carry the sense of ''household'' in this context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 예수님께서는 그들의 생각[a]을 아시고 그들에게 말씀하셨습니다. “내부적으로 분열된 나라는 모두 황폐해지며[b], 내부적으로 분열된 도시나 집[c]은 서지 못할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속생각’, ‘속으로 하는 생각’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘폐허가 된다’, ‘파멸에 이른다’.
    reason: lexical_alternative
  - marker: c
    text: ‘집’은 여기서 ‘가정’ 또는 ‘한 집안’을 뜻할 수도 있습니다.
    reason: lexical_alternative
