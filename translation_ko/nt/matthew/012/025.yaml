  rationale: 원문의 격언적 현재형(ἐρημοῦται)과 미래형(οὐ σταθήσεται)의 대비를 ‘황폐해지며/서지 못할 것입니다’로 유지했습니다. ‘내부적으로 분열된’은 자기 자신을 거스르는 분열이라는 뜻을 자연스러운 현대 한국어로 옮깁니다. 인용부호를 완결하고, 영어 감사 추적의 어휘 대안에 상응하는 한국어 각주 표지를 적절한 어휘에 배치했습니다.
