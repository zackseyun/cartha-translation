  verdict: revise
  source_fidelity: 초안은 βασιλεία/πόλις/οἰκία의 기본 대조와 미래형 οὐ σταθήσεται를 대체로 반영하지만, μερισθεῖσα καθ’ ἑαυτῆς는 단순한 ‘분쟁’보다 자기 내부를 거슬러 갈라진 상태를 뜻합니다. 또한 인용부호가 닫히지 않아 본문 구조를 바로잡아야 합니다.
  naturalness: ‘스스로 분쟁하는’은 현대 표준어에서 다소 부자연스럽고 행위 주체가 불명확합니다. ‘내부적으로 분열된’이 격언적 문맥에서 자연스럽고 뜻을 보존합니다. ‘도시’는 ‘성읍’보다 현대 표준어에 알맞습니다.
  terminology: 예수님, 나라, 도시, 집의 표현은 현대 합쇼체 성경 문맥에 적절합니다. οἰκία의 ‘가정/식구’ 가능성은 본문에서는 ‘집’으로 두고 각주로 제시합니다. 예수께서 생각을 아신 방식은 본문이 밝히지 않으므로 해석을 덧붙이지 않았습니다.
