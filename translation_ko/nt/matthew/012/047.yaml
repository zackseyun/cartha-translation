review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the main content accurately: an unidentified person speaks to Jesus; his mother and brothers are outside and wish to speak to him. However, the Korean second-person pronoun "당신" is pragmatically unsuitable when addressing Jesus in modern formal Korean and can sound confrontational or overly intimate. The source''s perfect ἑστήκασιν is better represented by "서 계십니다," preserving the ongoing state while observing Korean honorific usage.'
  naturalness: '"그분께" is understandable but less natural than identifying Jesus directly in this short stand-alone verse. In direct address, "선생님" is a natural respectful Korean form, whereas "당신" is generally avoided in this context. "말씀드리려고" naturally renders the purpose of seeking to speak, with honorific orientation required by Korean usage.'
  terminology: '"어머니" and "형제들" accurately render μήτηρ and ἀδελφοί. "선생님" is used only as a contextually required Korean address form, not as an interpretive theological title. A textual-variant note must be retained because the supplied English audit trail identifies omission of this verse in some manuscripts.'
  issues:
  - severity: medium
    issue: Direct-address pronoun "당신" is unsuitable in this formal Korean address to Jesus.
    rationale: Although σου means "your," "당신" commonly carries confrontational, intimate, or marital connotations in contemporary Korean. "선생님" provides a natural respectful form of address without altering the referent.
  - severity: low
    issue: The significant textual-variant footnote is absent.
    rationale: The verse is bracketed/disputed in the supplied source context, and the audit trail explicitly requires notice that some manuscripts omit it.
  revised_text: 그때 어떤 사람이 예수님께 말했습니다. “보십시오, 선생님의 어머니와 형제들이 밖에 서 계시며 선생님께 말씀드리려고 합니다.”
  revised_footnotes:
  - marker: a
    text: 일부 사본에는 이 절이 없습니다.
    reason: textual_variant
  revision_rationale: The revision preserves every explicit element of the Greek while using natural modern formal-polite Korean. "그때" reflects the mild narrative connection of δέ; "어떤 사람이" preserves τις; "보십시오" renders ἰδού; "밖에 서 계시며" represents the present result of the perfect ἑστήκασιν; and "말씀드리려고 합니다" expresses the participial purpose ζητοῦντες ... λαλῆσαι. The footnote transparently preserves the documented manuscript variation.
