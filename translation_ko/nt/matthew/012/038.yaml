  source_fidelity: ‘예수님께’는 문맥상 가리키는 대상은 맞지만, 본문의 αὐτῷ는 단지 ‘그에게’이므로 본문 표현을 그대로 살리는 편이 더 충실합니다. τινες의 부분성, ἀπὸ σοῦ의 출처 의미, σημεῖον의 넓은 의미는 수정문에서 보존했습니다.
  naturalness: ‘대답하여 말했습니다’는 한국어에서 다소 중복적으로 들립니다. 직접 인용이 뒤따르므로 ‘대답했습니다’가 자연스럽고, 현대 표준 합쇼체에도 잘 맞습니다.
  terminology: γραμματεῖς는 ‘서기관들’, Φαρισαῖοι는 ‘바리새인들’, Διδάσκαλε는 ‘선생님’, σημεῖον은 ‘표적’으로 옮겼습니다. ‘표적’은 이 문맥의 기적적 함의를 수용하면서도 원문의 ‘sign’보다 좁게 확정하지 않습니다.
  issues:
  - severity: low
    issue: ‘예수님께’가 원문의 대명사를 명시적 이름으로 확장합니다.
    rationale: αὐτῷ는 ‘그에게’이며, 문맥상 지시 대상은 분명하더라도 원문의 표현 수준을 유지하는 것이 최적등가 번역에 더 적절합니다.
  - severity: low
    issue: ‘대답하여 말했습니다’가 다소 중복적입니다.
    rationale: ἀπεκρίθησαν과 λέγοντες가 함께 있으나, 한국어 직접화법에서는 ‘대답했습니다’만으로도 자연스럽게 발화 도입 기능을 전달합니다.
  revised_text: 그때 서기관들과 바리새인들 중 몇몇이 그에게 대답했습니다. “선생님, 우리는 당신에게서 표적을 보고 싶습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “기적적인 표적.” 그리스어 ‘표적’은 기적적 의미를 지닌 표징을 가리킬 수 있으나, 본문에서는 더 넓은 뜻의 ‘표적’으로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: 원문 대명사 αὐτῷ를 ‘그에게’로 유지하고, 한국어에서 중복적으로 들리는 발화 도입을 간결하게 다듬었습니다. 또한 영어 감사 기록의 σημεῖον 관련 어휘 대안을 한국어 각주로 보존했습니다.
