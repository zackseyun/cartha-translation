    issue: 합쇼체 종결 및 불필요한 인용부호
    rationale: 초안은 ‘때문이다’로 끝나 현대 공식-공손체(합쇼체) 요구에 맞지 않으며, 문맥상 열리지 않은 닫는 인용부호(」)가 남아 있습니다.
  - severity: low
    issue: 2인칭 소유 표현의 격식
    rationale: ‘네 말’은 친밀하거나 문어적·고어적인 느낌을 줄 수 있습니다. ‘당신의 말’은 이 독립 문맥에서 현대 격식체로 더 일관됩니다.
  revised_text: 당신의 말로 의롭다 하심을 받고, 당신의 말로 정죄를 받을 것이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘의롭다고 인정받을 것입니다’, ‘무죄로 판정받을 것입니다.’ 그리스어 동사는 법정적으로 옳다고 선언되거나 무죄로 판정되는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  revision_rationale: γάρ의 설명·근거 기능을 ‘때문입니다’로, ἐκ의 판단 근거 기능을 반복된 ‘당신의 말로’로 옮겼습니다. δικαιωθήσῃ와 καταδικασθήσῃ의 미래 수동 법정 대조는 각각 ‘의롭다 하심을 받고’와 ‘정죄를 받을’로 유지했습니다. 합쇼체 종결로 고치고 잘못 남은 인용부호를 제거했습니다.
