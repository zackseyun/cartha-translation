  source_fidelity: 그리스어의 γάρ(이유를 나타내는 접속사), 반복되는 ἐκ τῶν λόγων σου(당신의 말에 근거하여), 그리고 법정적 대조를 이루는 미래 수동태 δικαιωθήσῃ/καταδικασθήσῃ를 충실히 반영해야 합니다. 초안의 핵심 의미는 대체로 맞지만, 끝의 닫는 인용부호는 구조상 불필요하며, 합쇼체 요구에 맞춘 종결이 필요합니다.
  naturalness: ‘당신의 말로 의롭다 하심을 받고, 당신의 말로 정죄를 받을 것이기 때문입니다.’는 현대 표준어의 격식 있는 합쇼체로 자연스럽고, 병행 구조와 법정적 어조를 유지합니다.
  terminology: ‘의롭다 하심을 받다’는 δικαιόω의 수동적·법정적 의미를 보존하며, ‘정죄를 받다’는 καταδικάζω와 자연스럽게 대조됩니다. 영어 감사 기록의 ‘justified’와 신학적 연속성도 보존하되, 본문 자체 이상의 교리적 의미를 부가하지 않습니다.
  issues:
