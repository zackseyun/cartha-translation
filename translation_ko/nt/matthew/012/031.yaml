review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 미래 수동태의 용서 의미는 잘 옮겼습니다. 다만 πᾶσα ἁμαρτία καὶ βλασφημία의 포괄성을 더 직접적으로 나타내고, τοῦ πνεύματος는 본문에 ‘성령’을 보충하지 않은 채 ‘영’으로 유지하되 문맥상 지시 대상을 각주로 밝혀 두는 것이 좋습니다.
  naturalness: 초안의 ‘내가 너희에게 말한다’와 ‘용서받을 것이다’는 평서체이므로, 요청된 현대 합쇼체에 맞추어 ‘말합니다’와 ‘용서받을 것입니다’로 고쳤습니다. ‘사람들이 짓는 모든 죄’는 원문에 없는 동사 의미를 보태므로 ‘사람들은 모든 죄와 모독을 용서받을 것입니다’로 자연스럽게 재구성했습니다.
  terminology: βλασφημία는 이 문맥에서 ‘모독’이 자연스럽고 충분히 정확합니다. ‘영’은 원문의 πνεύματος에 충실한 번역이며, 문맥상 성령을 가리킨다는 점은 각주로 처리했습니다. ‘신성모독’은 한국어에서 다소 경직되고, ‘영을 거스르는 신성모독’은 중복적·비자연적입니다.
  issues:
  - severity: medium
    issue: 합쇼체 불일치
    rationale: ‘말한다’, ‘용서받을 것이다’는 현대 formal-polite 합쇼체가 아닙니다.
  - severity: low
    issue: 원문에 없는 ‘짓는’의 보충
    rationale: ἁμαρτία에는 ‘죄’라는 뜻만 있으며, ‘짓는’을 넣지 않아도 자연스럽고 더 직접적으로 번역할 수 있습니다.
  - severity: low
    issue: ‘신성모독’ 및 ‘영을 거스르는 신성모독’의 어색한 결합
    rationale: βλασφημία는 ‘모독’으로 옮기는 편이 자연스럽고, τοῦ πνεύματος의 목적 관계는 ‘영을 모독하는 것’으로 명료하게 표현할 수 있습니다.
  revised_text: 그러므로 내가 너희에게 말합니다. 사람들은 모든 죄와 모독을 용서받을 것입니다. 그러나 영을 모독하는 것은 용서받지 못할 것입니다.[a]
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘그 영의 모독’입니다. 이 구절은 단지 ‘영’이라고 말하지만, 앞뒤 문맥에서는 성령을 가리킵니다.
    reason: alternative_reading
  revision_rationale: 문체를 합쇼체로 통일하고, 첫 절의 수동 표현을 자연스러운 한국어로 재구성했습니다. 원문이 ‘영’이라고만 하는 점은 본문에서 보존했으며, ‘성령’이라는 문맥상 이해는 각주에 한정했습니다. ‘용서받지 못할 것입니다’라는 강한 미래 부정은 그대로 유지했습니다.
