review_pass:
  verdict: revise
  source_fidelity: 초안은 διὰ τοῦτο의 추론 관계와 두 대조 절, 그리고 미래 수동태의 용서/용서되지 않음을 대체로 충실히 옮깁니다. 다만 「사람들이 짓는」은 원문의 수여 대상(τοῖς ἀνθρώποις)을 행위 주체로 재구성하므로, 사람들에게 용서가 주어진다는 문장 구조를 직접 반영하는 편이 더 정확합니다. 또한 정관사가 있는 「그 영」을 반영하고, 문맥상 성령을 가리킨다는 점은 각주로 밝혀 두는 것이 적절합니다.
  naturalness: 「말한다」는 지정된 현대 합쇼체 문체와 맞지 않습니다. 「말합니다」와 「용서되지 않을 것입니다」로 고치면 현대의 정중하고 격식 있는 성경 문체에 맞습니다. 「영을 거스르는 신성모독」보다 「그 영을 모독하는 것」이 한국어에서 더 자연스럽고 원문의 대상 관계도 명료합니다.
  terminology: βλασφημία는 이 문맥에서 「모독」으로 옮길 수 있으며, 「그 영을 모독하는 것」은 Spirit을 향한 모독이라는 뜻을 분명히 합니다. 본문에는 ἁγίου가 없으므로 본문을 「성령」으로 확대하지 않고 「그 영」으로 두되, 문맥상 성령이라는 이해는 각주에서 제시합니다.
  issues:
  - severity: medium
    issue: 합쇼체 불일치
    rationale: 「내가 너희에게 말한다」는 평서체이므로, 요청된 현대 정중체에 맞게 「말합니다」로 고쳐야 합니다.
  - severity: low
    issue: 수여 대상의 의미가 행위 주체로 재구성됨
    rationale: 「사람들이 짓는 모든 죄와 신성모독」은 τοῖς ἀνθρώποις를 '죄를 짓는 사람들'로 처리합니다. 원문은 죄와 모독이 '사람들에게' 용서된다고 말하므로 이를 직접 드러내는 번역이 더 가깝습니다.
  - severity: low
    issue: 영의 지시성과 문맥상 referent 미표시
    rationale: τοῦ πνεύματος의 정관사는 특정한 영을 가리킵니다. 본문에는 '성령'을 보충하지 않되 「그 영」과 각주로 원문 및 문맥을 함께 보존할 수 있습니다.
  revised_text: 그러므로 내가 너희에게 말합니다. 모든 죄와 모독은 사람들에게 용서될 것이나, 그 영을 모독하는 것은 용서되지 않을 것입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘그 영을 모독하는 것’입니다. 이 절에는 단지 ‘그 영’이라고 되어 있으나, 앞뒤 문맥에서는 성령을 가리킵니다.
    reason: 원문에는 ἁγίου(‘거룩한’)가 없음을 보존하면서 문맥상의 지시 대상을 밝혀 줌
  revision_rationale: 문체를 합쇼체로 통일하고, 용서의 수혜자인 「사람들에게」를 직접 반영했습니다. 또한 영을 향한 모독이라는 원문의 관계를 자연스러운 한국어로 명료하게 옮겼습니다. ‘성령’은 본문에 보충하지 않고 각주에서만 문맥상 지시 대상으로 밝혀 원문의 어휘 범위와 영어 POB 감사 기록의 결정을 함께 보존했습니다.
