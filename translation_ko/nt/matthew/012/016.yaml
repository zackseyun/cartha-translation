    issue: 금지 내용의 주체가 불분명하고 의미가 바뀜
    rationale: ‘그분이 자신을 드러내지 못하도록’은 그분 자신이 자신을 드러내지 못하게 한다는 뜻으로 해석될 수 있습니다. 원문은 그들이 그분을 알려지게 하지 말라는 명령 내용입니다.
  - severity: medium
    issue: ‘못하도록’이 금지를 능력 제한처럼 표현함
    rationale: ἵνα μὴ ... ποιήσωσιν은 이 문맥에서 ‘하지 말라’는 경고·지시의 내용이지, 할 수 없게 한다는 뜻이 아닙니다.
  revised_text: 그리고 예수님께서는 그들에게 자신을 알리지 말라고 엄히 경고하셨습니다.
