  terminology: ἐπετίμησεν의 문맥상 강한 지시·경고의 뉘앙스를 ‘엄히 경고하셨습니다’로 보존했습니다. φανερὸν ποιήσωσιν은 ‘자신을 알리다’로 옮겨 공개적으로 알려지게 하지 말라는 뜻을 전달합니다.
  issues:
