  source_fidelity: 초안의 ‘자신을 드러내지 못하도록’은 문법상 예수님 자신이 자신을 드러낼 수 없게 하는 뜻으로 읽히기 쉬우며, 헬라어의 주어인 ‘그들’이 예수님을 공개하지 말라는 내용을 정확히 반영하지 못합니다. 또한 μή와 접속법은 능력의 불가능보다 금지의 내용을 나타냅니다.
