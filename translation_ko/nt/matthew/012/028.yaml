id: MAT.12.28
reference: Matthew 12:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
  footnotes:
  - marker: a
    text: Or 'in the Spirit of God.' The Greek phrase can be rendered either way; here it is taken as expressing means or agency.
    reason: lexical_alternative
  - marker: b
    text: Or 'has overtaken you' or 'has arrived upon you.' The Greek verb emphasizes that God's kingdom has reached them in Jesus' works.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 하나님의 영으로[a] 귀신들을 쫓아낸다면, 하나님의 나라가 너희에게 임하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 영 안에서.’ 그리스어 표현은 수단이나 행위자를 나타내는 말로도, ‘… 안에서’로도 옮길 수 있습니다. 여기서는 수단 또는 행위자를 나타내는 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희에게 이르렀습니다’ 또는 ‘너희에게 닥쳤습니다.’ 그리스어 동사는 하나님의 나라가 예수님의 사역을 통하여 그들에게 이르렀음을 나타냅니다.
    reason: lexical_alternative
