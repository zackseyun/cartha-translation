revisions:
- from: 그때 귀신들린 한 사람을 그분께 데려왔습니다. 그는 눈멀고 말 못 하는 자였습니다. 예수님이 그를 고치시니, 그 말 못 하던 자가 말을 하고 보게 되었습니다.
  to: 그때 눈이 멀고 말을 하지 못하는[a] 귀신 들린 사람을 그분께 데려왔습니다. 그분이 그를 고치시니, 말을 하지 못하던 사람이 말을 하고 보게 되었습니다.
  rationale: 원문의 대명사 지시를 ‘그분’으로 유지하고, 문맥이 뒷받침하는 κωφός의 ‘말을 하지 못하는’ 의미를 자연스러운 현대 한국어로 옮겼습니다. 동시에 해당 단어의 가능한 ‘귀먹은’ 의미를 각주로 밝혀 어휘적 모호성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:20:11Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문은 예수님의 이름을 이 절에서 다시 명시하지 않고 대명사(‘그에게’, ‘그가’)로 지시하므로, 번역도 이를 유지하는 편이 더 직접적입니다. κωφός는 문맥상 말하지 못함을 가리키지만 ‘귀먹음’의 의미도 가능한 어휘이므로 각주로 밝혀야 합니다.
  naturalness: ‘눈멀고 말 못 하는 자’보다 ‘눈이 멀고 말을 하지 못하는 … 사람’이 현대 표준어 합쇼체에서 더 자연스럽고 존중 표현에도 잘 맞습니다. ‘그 말 못 하던 자’도 ‘말을 하지 못하던 사람이’로 다듬는 것이 자연스럽습니다.
  terminology: δαιμονιζόμενος는 ‘귀신 들린’으로, θεραπεύω는 ‘고치시다’로 옮겨 원문의 명시적인 귀신 관련 표현과 치유 행위를 보존했습니다. κωφός의 문맥상 선택은 ‘말을 하지 못하는’으로 하되, 가능한 다른 의미는 각주에서 보존합니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘예수님’의 재명시
    rationale: 이 절의 SBLGNT 본문은 αὐτῷ/ἐθεράπευσεν(‘그에게’/‘그가 고치셨다’)만 사용합니다. 선행 문맥의 지시 대상이 예수님인 것은 분명하지만, 이 절 자체의 대명사 표현을 유지하는 것이 원문 형식에 더 충실합니다.
  - severity: low
    issue: κωφός의 어휘적 대안 미표시
    rationale: 문맥은 말하게 된 결과를 제시하므로 ‘말을 하지 못하는’이 적절하지만, κωφός는 ‘귀먹은’을 뜻할 수도 있습니다. 번역 선택을 유지하면서 각주로 대안을 표시해야 합니다.
  - severity: low
    issue: ‘눈멀고 말 못 하는 자’의 현대적 자연스러움
    rationale: 뜻은 전달되지만 다소 압축적이고 구어적으로 들릴 수 있습니다. ‘눈이 멀고 말을 하지 못하는 귀신 들린 사람’이 더 자연스럽고 명료합니다.
  revised_text: 그때 눈이 멀고 말을 하지 못하는[a] 귀신 들린 사람을 그분께 데려왔습니다. 그분이 그를 고치시니, 말을 하지 못하던 사람이 말을 하고 보게 되었습니다.
