base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
  footnotes:
  - marker: a
    text: Or 'deaf.' The Greek word can refer to someone who is deaf or unable to speak; here the context favors 'unable to speak' because the result is that he spoke and saw.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 눈이 멀고 말을 하지 못하는[a] 귀신 들린 사람을 그분께 데려왔습니다. 그분이 그를 고치시니, 말을 하지 못하던 사람이 말을 하고 보게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀먹은’. 그리스어 κωφός는 귀먹은 사람 또는 말을 하지 못하는 사람을 가리킬 수 있습니다. 여기서는 그 사람이 말을 하게 된 결과 때문에 ‘말을 하지 못하는’으로 옮겼습니다.
    reason: lexical_alternative
