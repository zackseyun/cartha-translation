    issue: ἀνεχώρησεν의 뉘앙스
    rationale: 초안의 ‘떠나셨습니다’도 가능한 번역이나, 마태복음에서 반대와 위협의 상황에 대응해 물러나는 뜻을 지닌 동사의 뉘앙스가 약해집니다.
  - severity: low
    issue: γνούς의 암시된 목적어
    rationale: ‘이것을’은 앞 절을 따라 자연스럽게 보충한 것이지만, 그 목적어가 헬라어 본문에는 명시되지 않았으므로 각주로 이를 표시하는 것이 적절합니다.
  revised_text: 예수님께서는 이것을[a] 아시고 그곳에서 물러나셨습니다. 많은 사람이 그분을 따라왔고, 그분은 그들을 모두 고쳐 주셨습니다.
