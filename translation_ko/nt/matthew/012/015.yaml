  source_fidelity: γνούς의 목적어는 본문에 명시되지 않았으나 앞 절의 내용을 가리키므로 ‘이것을’로 보충할 수 있습니다. ἀνεχώρησεν은 단순한 이동보다 반대 상황에서의 물러남의 뉘앙스가 있어 ‘떠나셨습니다’보다 ‘물러나셨습니다’가 더 가깝습니다. ‘많은 사람’, ‘그분을 따라왔고’, ‘그들을 모두 고쳐 주셨습니다’는 각각 πολλοί, ἠκολούθησαν αὐτῷ, ἐθεράπευσεν αὐτοὺς πάντας를 충실히 반영합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. ‘물러나셨습니다’는 문맥상 피신이나 비겁함을 단정하지 않으면서도 원문의 의도적인 철수를 잘 전달합니다.
  terminology: ‘예수님’, ‘그분’, ‘고쳐 주셨습니다’는 한국어 성경 문맥에서 자연스럽고 존중의 합쇼체 문체에 적합합니다. γνούς에 보충한 ‘이것’의 선행 내용이 원문에 명시되지 않았음을 각주로 밝혀 해석의 여지를 보존합니다.
  issues:
