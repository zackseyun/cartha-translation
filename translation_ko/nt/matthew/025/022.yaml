  source_fidelity: 핵심 내용은 대체로 충실합니다. 그러나 δὲ καὶ의 순차성과 추가를 더 자연스럽게 드러내고, παρέδωκας의 완료된 보고를 '-는데'가 아닌 독립 문장으로 옮기는 편이 적절합니다. ‘달란트’의 화폐 단위 의미에는 주석 표지가 필요합니다.
  naturalness: ‘앞으로 나아와’와 ‘주여’는 현대 표준 한국어 합쇼체에서는 다소 문어적·고풍스럽습니다. ‘다가와’, ‘주님’, ‘말했습니다’ 및 한국어식 직접화법 문장부호가 더 자연스럽습니다. 주인을 향한 호칭으로 ‘당신께서’보다 ‘주님께서’가 존대 관계를 자연스럽게 나타냅니다.
  terminology: κύριε는 영어 POB의 기본 선택인 ‘Lord’에 맞추어 ‘주님’으로 옮기고, 이 비유의 사회적 문맥에서 가능한 ‘주인님’은 대안 주석으로 제시합니다. τάλαντα는 전통 용어 ‘달란트’를 유지하되, 타고난 능력이 아니라 큰 화폐 단위임을 주석으로 분명히 합니다.
