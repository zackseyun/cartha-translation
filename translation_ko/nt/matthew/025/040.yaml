source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
  footnotes:
  - marker: a
    text: Or, more literally, “Amen, I say to you.”
    reason: lexical_alternative
  - marker: b
    text: “Brothers” translates the masculine plural Greek term. The phrase “these brothers of mine” may refer specifically to Jesus’ disciples, to believers more generally, or more broadly to the vulnerable; the translation preserves the wording without deciding the interpretive question.
    reason: alternative_reading
translation:
  language: ko
  text: 왕이 그들에게 대답하여 말씀하실 것입니다. “내가 진실로 너희에게 말합니다[a]. 너희가 이 지극히 작은 내 형제들[b] 가운데 한 사람에게 한 것이 곧 내게 한 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면, “아멘, 내가 너희에게 말합니다.”
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 그리스어의 남성 복수 표현을 옮긴 것입니다. ‘이 내 형제들’이 예수님의 제자들을 특별히 가리키는지, 신자들을 더 넓게 가리키는지, 또는 취약한 이들을 포괄하여 가리키는지는 논쟁이 있습니다. 번역은 이를 결정하지 않고 원문의 표현을 유지합니다.
    reason: alternative_reading
