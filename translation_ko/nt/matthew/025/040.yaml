  naturalness: 초안의 ‘그러면’은 단순 접속사 καί에 비해 추론적 뉘앙스를 더하고, ‘말하노니’는 요청된 현대 합쇼체와 맞지 않습니다. 수정안은 현대 표준어 합쇼체의 문장 종결과 인용부호를 사용하면서도 엄숙한 선언의 어조를 유지합니다.
