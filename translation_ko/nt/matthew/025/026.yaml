  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
  footnotes:
  - marker: a
    text: Or, 'Wicked and lazy slave.' The Greek word doulos can mean either 'servant' or 'slave,' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'You knew that I reap where I did not sow and gather where I did not scatter seed.' The Greek may be read as a statement rather than a rhetorical question.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그의 주인은 그에게 대답하여 말했습니다. “악하고 게으른 종아[a], 네가 내가 심지 않은 곳에서 거두고 흩뿌리지 않은 곳에서 모으는 줄을 알았느냐[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “노예”. 그리스어 δοῦλος는 문맥에 따라 “종” 또는 “노예”를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 평서문으로, “네가 내가 심지 않은 곳에서 거두고 흩뿌리지 않은 곳에서 모으는 줄을 알았다.” 그리스어는 수사 의문문이 아니라 진술로도 읽을 수 있습니다.
    reason: alternative_reading
