review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the three neglected acts and the hospitality sense of ξένος/συνάγω. However, its final clause can be read as a single combined circumstance ('when I was sick and imprisoned'), whereas the Greek coordinates sickness and imprisonment as distinct conditions. The rendering of ἐπεσκέψασθε as '돌보지 않았다' conveys care but does not explicitly retain the concrete sense of visiting.
  naturalness: 'Several expressions are understandable but less natural for contemporary formal Korean: ''나그네 되었을 때에'' is better as ''나그네였을 때,'' and the repeated ''-때에'' is unnecessarily archaic. Most importantly, the draft''s final ''-않았다'' is plain declarative rather than the required modern formal-polite 합쇼체.'
  terminology: '''나그네,'' ''영접하다,'' ''헐벗다,'' and ''옥에 갇히다'' are suitable, recognizable Scripture-register terms. ''찾아보다'' retains the concrete visitation action of ἐπισκέπτομαι; a note can preserve its attendant nuance of caring concern.'
  issues:
  - severity: high
    issue: The translation does not consistently use the required modern formal-polite 합쇼체.
    rationale: The final predicate, '돌보지 않았다,' is plain declarative. A direct saying in this target variant should use '-지 않았습니다.'
  - severity: medium
    issue: The wording '병들었을 때와 옥에 갇혔을 때에' is improved by explicitly coordinating the two circumstances while retaining one response verb.
    rationale: The Greek has 'sick and in prison' followed by one verb. Explicitly presenting sickness and imprisonment as two circumstances avoids suggesting that imprisonment qualifies sickness or that both must occur simultaneously.
  - severity: medium
    issue: '''돌보지 않았다'' omits the explicit visitation component of ἐπεσκέψασθε.'
    rationale: The verb denotes visiting with concerned attention. '찾아보지 않았습니다' preserves the concrete action; a footnote supplies the care nuance without over-translating.
  revised_text: “내가 나그네였을 때 너희는 나를 영접하지 않았고, 헐벗었을 때 나를 입히지 않았으며, 병들었을 때와 옥에 갇혔을 때 나를 찾아보지 않았습니다[a].”
