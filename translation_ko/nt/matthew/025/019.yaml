  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. ‘오랜 시간이 지난 후에’는 μετὰ δὲ πολὺν χρόνον을 자연스럽게 옮기며, ‘그 종들의 주인’은 이 비유의 비신학적·가정경제적 κύριος 및 δοῦλοι 관계를 적절히 나타냅니다. 현재형 ‘와서 … 합니다’도 그리스어 역사적 현재를 보존합니다. 다만 συναίρει λόγον μετ’ αὐτῶν은 단순히 ‘셈을 하다’보다 회계적 결산·정산의 뜻이 분명하므로 이를 명시하는 편이 정확합니다.
  naturalness: ‘그들과 셈을 합니다’는 이해되지만, 현대 한국어에서는 계산을 하거나 다투어 따지는 뜻으로도 들릴 수 있습니다. ‘그들과 حساب을 결산합니다’는 비유의 상업·회계 문맥과 ‘계산을 결산하다’라는 관용적 표현을 더 분명하고 자연스럽게 전달합니다.
  terminology: ‘종’과 ‘주인’은 한국어 성경 문체에서 δοῦλοι와 κύριος의 관계를 자연스럽게 표현합니다. 여기서 ‘주인’은 그리스도의 직접 호칭으로 단정하지 않고 비유 속 소유주·주인의 역할을 나타내므로 적절합니다.
  issues:
  - severity: medium
    issue: ‘그들과 셈을 합니다’가 συναίρει λόγον의 회계적 결산 의미를 충분히 특정하지 못합니다.
    rationale: 이 그리스어 관용구는 종들과 حساب을 맞추고 결산하는 행위를 뜻합니다. ‘셈을 하다’는 한국어에서 산술 계산 또는 따짐의 의미로도 넓게 쓰이므로, ‘계산을 결산하다’가 문맥상 더 정확합니다.
  revised_text: 오랜 시간이 지난 후에 그 종들의 주인이 와서 그들과 계산을 결산합니다.
