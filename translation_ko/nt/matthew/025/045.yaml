  source_fidelity: 수정안은 τότε의 시간적 전개, ἀποκριθήσεται αὐτοῖς λέγων의 ‘그들에게 대답하여 말씀하실 것입니다’, 엄숙한 선언 공식 Ἀμὴν λέγω ὑμῖν, 그리고 ἐφ’ ὅσον의 범위·정도 표현을 보존합니다. ἑνί의 단수 ‘한 사람’과 복수 집단 ‘이 가장 보잘것없는 이들’도 유지하며, 두 번째 절의 ‘나에게도’는 οὐδέ의 상관적 강조를 반영합니다.
  naturalness: 초안의 ‘여기 가장 작은 자 하나에게 하지 않은 것이’는 현대 표준어로 다소 부자연스럽고, ‘가장 작은 자’는 한국어에서 신체적 크기로도 쉽게 읽힐 수 있습니다. ‘이 가장 보잘것없는 이들 가운데 한 사람에게 해 주지 않은 만큼’은 현대적이면서도 본문의 의도적 포괄성을 유지합니다. 인용문 안에서는 합쇼체 종결인 ‘말합니다/것입니다’를 사용했습니다.
  terminology: ‘가장 보잘것없는 이들’은 ἐλαχίστων의 최상급적 낮음·미천함을 자연스럽게 전달하되, 그들이 누구인지 특정하지 않습니다. ‘해 주다’는 문맥상 사람을 향한 행위를 나타내는 ποιέω의 목적어가 생략된 용법을 자연스러운 한국어로 보충합니다. 예수의 발화에는 ‘말합니다’를, 서술부에는 ‘말씀하실 것입니다’를 사용하여 현대 공적 성경 문체를 유지했습니다.
