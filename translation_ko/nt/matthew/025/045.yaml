base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
  footnotes:
  - marker: a
    text: Or, more formally, 'Amen, I say to you.'
    reason: lexical_alternative
  - marker: b
    text: '''The least of these'' may be understood specifically as Jesus'' disciples or more broadly as the lowly and needy; the translation leaves the phrase as stated in the text.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때에 그가 그들에게 대답하여 말씀하실 것입니다. ‘내가 진실로 너희에게 말합니다[a]. 너희가 이 가장 보잘것없는 이들[b] 가운데 한 사람에게 해 주지 않은 만큼, 나에게도 해 주지 않은 것입니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘아멘, 내가 너희에게 말한다.’
    reason: lexical_alternative
  - marker: b
    text: ‘이 가장 보잘것없는 이들’은 예수님의 제자들을 특별히 가리킨다고 이해될 수도 있고, 더 넓게는 낮고 궁핍한 이들을 가리킨다고 이해될 수도 있습니다. 번역문은 본문의 표현을 그대로 유지합니다.
    reason: alternative_reading
