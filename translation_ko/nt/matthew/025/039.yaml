  source_fidelity: 핵심 의미는 대체로 충실하나, ἤλθομεν πρὸς σέ의 단순한 이동 표현에 비해 ‘찾아갔습니까’는 ‘방문하다’의 뜻을 다소 더합니다. 본문은 이를 피하여 ‘당신께 갔습니까’로 옮기고, ‘찾아갔습니까’를 각주 대안으로 둡니다. ἀσθενοῦντα와 ἐν φυλακῇ는 각각 ‘병드시거나’와 ‘감옥에 갇혀 계신’을 통해 상태를 자연스럽게 나타냅니다.
  naturalness: 초안의 ‘당신이 … 갇히신’은 높임의 주격 표현과 서술 높임이 완전히 조응하지 않아 다소 어색합니다. ‘당신께서’ 및 ‘갇혀 계신’을 사용하면 현대 표준어 합쇼체에서 더 자연스럽고 일관됩니다. 인용부호도 한국어 인용부호로 바로잡습니다.
  terminology: ‘감옥’은 φυλακή(구금 장소)에 대한 현대적이고 명료한 번역입니다. 호칭이나 신학적 해석을 덧붙이지 않고, 원문의 2인칭 대명사를 ‘당신’으로 유지합니다.
