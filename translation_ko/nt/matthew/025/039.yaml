    rationale: ἤλθομεν πρὸς σέ는 문자적으로 ‘당신에게 갔습니다/왔습니다’이며, ‘찾아가다’는 방문 행위라는 뉘앙스를 추가할 수 있습니다. 본문은 더 직접적으로 옮기고 해당 표현은 각주 대안으로 제시하는 편이 안전합니다.
