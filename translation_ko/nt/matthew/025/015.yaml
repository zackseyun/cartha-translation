  source_fidelity: 개정이 필요합니다. SBLGNT 제시문에서 ἀπεδήμησεν 뒤에는 문장 종결점이 있으며, εὐθέως는 마태복음 25:16을 시작하는 말입니다. 따라서 25:15 본문에서는 ‘즉시’를 떠남에 연결하지 않아야 합니다. 나머지 분배와 ‘각자의 능력에 따라’라는 의미는 잘 반영되어 있습니다.
  naturalness: 수정문은 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다. ‘각 사람의 능력에 따라’는 ἑκάστῳ의 분배적 의미를 명료하게 드러냅니다.
  terminology: ‘달란트’는 화폐·중량 단위를 보존하는 적절한 용어입니다. 현대적 의미의 타고난 재능으로 오해될 수 있으므로 본문에서는 그대로 두는 것이 좋습니다.
  issues:
