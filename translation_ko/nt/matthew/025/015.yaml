- from: 그리고 한 사람에게는 다섯 달란트를, 다른 사람에게는 두 달란트를, 또 다른 사람에게는 한 달란트를 — 각자의 능력에 따라 — 주고는 즉시 떠났습니다.
  to: 그리고 한 사람에게는 다섯 달란트를, 다른 사람에게는 두 달란트를, 또 다른 사람에게는 한 달란트를 주었습니다. 각 사람의 능력에 따라 그렇게 하신 뒤, 그는 떠나셨습니다.
  rationale: 절 경계상 다음 절에 속하는 εὐθέως와 그에 따른 ‘즉시’를 제거했습니다. 또한 ‘각 사람의 능력에 따라’를 독립적으로 배치하여 각 수령인에게 적용되는 분배적 의미를 자연스럽고 명확하게 보였습니다. 달란트는 역사적 화폐 단위라는 원문의 의미를 보존하여 유지했습니다.
