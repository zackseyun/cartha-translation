    rationale: εὐθέως는 제시된 SBLGNT 본문에서 마침표 뒤에 놓여 다음 절(25:16)을 시작합니다. 이를 25:15에 포함하여 ἀπεδήμησεν을 수식하면 절 경계와 문장 구분을 바꾸게 됩니다.
