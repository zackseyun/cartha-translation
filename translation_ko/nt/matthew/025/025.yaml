  source_fidelity: 원문의 두 분사(φοβηθεὶς, ἀπελθὼν)가 나타내는 이유와 행동 순서는 대체로 반영되어 있습니다. 그러나 「감추어 두었습니다」의 ‘두다’는 원문 κρύπτω에 없는 지속·보존의 뉘앙스를 약간 더하며, 마지막 「당신의 것이 당신에게 있습니다」는 ἴδε ἔχεις τὸ σόν의 반환 상황과 한국어 관용에 비해 부자연스럽습니다.
  naturalness: 「내가 두려워하여」와 「당신의 것이 당신에게 있습니다」는 현대 표준 한국어 합쇼체로 다소 어색합니다. 「두려워서」 및 「보십시오, 여기 당신의 것이 있습니다」가 자연스럽고 원문의 발화 기능을 보존합니다.
  terminology: 「달란트」는 역사적 화폐·무게 단위인 τάλαντον의 전통적이고 적절한 음역입니다. 현대 한국어의 ‘재능’ 의미로 오해될 수 있으므로, 원문의 화폐 의미를 밝히는 주석을 붙이는 것이 필요합니다. 「당신」은 주인에게 직접 말하는 문맥에서 유지할 수 있습니다.
