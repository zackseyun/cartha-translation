  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
  footnotes:
  - marker: a
    text: Or 'to the wedding banquet' or simply 'to the wedding.' The Greek plural can refer to the wedding celebration as a whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그들이 사러 가는 동안, 신랑이 왔고, 준비가 되어 있던 처녀들은 그와 함께 혼인 잔치[a]에 들어갔으며, 문은 닫혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼인 연회’ 또는 단순히 ‘혼인’. 그리스어 복수형은 혼인 축제 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
