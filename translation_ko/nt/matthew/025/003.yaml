    issue: The translation ends with '않았으나,'
    rationale: Greek has no adversative conjunction here, and the Korean '-으나' requires a following contrasting clause. It both changes the relationship between the actions and produces an incomplete sentence.
  - severity: medium
    issue: γάρ is not represented.
    rationale: The connective introduces an explanation for the preceding statement; '이는 ... 때문입니다' preserves that discourse function in natural Korean.
  - severity: low
    issue: The lexical-alternative footnote for λαμπάδες is absent.
    rationale: The English audit trail records 'torches' as a viable alternative to 'lamps'; retaining this note supports transparency without changing the main rendering.
