  terminology: '''등불'' is an appropriate rendering of λαμπάδες in this context. The possible sense ''횃불'' should be retained as a lexical-alternative footnote, following the audit trail. ''어리석은 이들'' naturally refers back to the women/virgins without adding an unnecessary repeated noun.'
  issues:
