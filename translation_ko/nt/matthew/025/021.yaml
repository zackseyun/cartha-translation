  source_fidelity: 전반적으로 원문의 호칭과 대조 구조를 잘 옮겼습니다. 다만 ἐπὶ πολλῶν은 단순히 물리적으로 ‘위에 세우다’라기보다 더 많은 일을 맡겨 감독하게 한다는 뜻이므로, 한국어에서는 ‘많은 일을 맡기겠다’가 의미를 더 정확하고 자연스럽게 전달합니다.
  naturalness: 서술부의 합쇼체는 적절합니다. 직접 인용문의 ‘들어오너라’는 이 문맥에서 가능한 명령형이나, ‘들어가라’가 현대 표준어에서 더 자연스럽습니다. 또한 말하기 도입 뒤에는 쉼표보다 콜론을 쓰는 것이 적절합니다.
  terminology: κύριος는 비유 안의 관계를 따라 ‘주인’으로, δοῦλος는 ‘종’으로 옮긴 것이 적절합니다. ‘종’은 이 문맥에서 종속적 신분 관계를 보존하며, 대안적 완화 표현인 ‘하인’을 각주로 제시할 수 있습니다. πιστός의 반복은 ‘신실한/신실하였으니’로 유지되었습니다.
  issues:
  - severity: low
    issue: 말하기 도입 뒤의 문장부호
    rationale: 직접 인용을 이끄는 ‘말하였습니다’ 뒤에는 쉼표보다 콜론이 한국어 문장부호상 더 적절합니다.
  - severity: medium
    issue: ‘많은 일 위에 세우겠다’의 자연성과 의미 전달
    rationale: καταστήσω ἐπὶ πολλῶν은 더 많은 책임을 맡기거나 감독자로 임명한다는 뜻입니다. ‘많은 일을 맡기겠다’가 한국어에서 자연스럽고 문맥상의 위임 의미를 분명히 합니다.
  - severity: low
    issue: 직접 명령문의 현대성
    rationale: ‘들어오너라’도 가능하지만, 현대 표준어에서는 ‘들어가라’가 εἴσελθε εἰς를 더 자연스럽게 옮깁니다.
  revised_text: '그의 주인이 그에게 말하였습니다: “잘하였다, 선하고 신실한 종아. 네가 적은 일에 신실하였으니, 내가 너에게 많은 일을 맡기겠다. 네 주인의 기쁨에 들어가라.”'
  revised_footnotes:
  - marker: a
    text: 또는 ‘하인’. 그리스어 도울로스(δοῦλος)는 문맥에 따라 ‘종’ 또는 ‘하인’으로 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 비유적 주종 관계와 충성의 반복을 유지하면서, 책임을 더 크게 맡긴다는 καταστήσω ἐπὶ πολλῶν의 의미를 자연스러운 현대 한국어로 다듬었습니다. 직접 인용부의 문장부호와 명령형도 현대 표준어에 맞추었습니다.
