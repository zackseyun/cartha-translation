  text: 그의 주인이 그에게 말하였습니다. “잘하였다, 착하고 충성된 종아. 네가 적은 일에 충성하였으니, 내가 너에게 많은 일을 맡기겠다. 네 주인의 기쁨에 들어오너라.”
  philosophy: optimal-equivalence
