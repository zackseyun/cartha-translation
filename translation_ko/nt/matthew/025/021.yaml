review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, ‘많은 일 위에 세우겠다’는 한국어에서 수임·감독의 뜻이 자연스럽게 드러나지 않습니다. ἐπὶ πολλῶν σε καταστήσω는 많은 일을 맡기거나 그 일을 관장하게 한다는 뜻입니다. 또한 영어 감사 기록에서 보존한 δοῦλος의 ‘slave’ 대안은 한국어에서도 각주로 남기는 편이 적절합니다.
  naturalness: ‘그에게 말하였습니다,’ 뒤의 쉼표는 직접 인용을 여는 한국어 문장부호로 부자연스럽고, ‘작은 일’보다 ‘적은 일’이 원문의 대조(적은 것/많은 것)에 더 자연스럽습니다. ‘많은 일을 맡기겠다’가 현대 표준어에서 가장 명료합니다.
  terminology: κύριος는 비유 안의 관계를 따라 ‘주인’으로, δοῦλος는 본문에서 자연스러운 ‘종’으로 옮깁니다. ἀγαθός와 πιστός의 관용적 짝은 ‘착하고 충성된’으로 옮겨 칭찬의 어조와 반복되는 πιστός의 의미를 유지합니다.
  issues:
  - severity: medium
    issue: ‘많은 일 위에 세우겠다’
    rationale: 직역 흔적이 남아 있으며 한국어에서는 사람을 ‘일 위에 세운다’고 하지 않습니다. καθίστημι의 임명·책임 위임 의미를 ‘많은 일을 맡기겠다’로 명료하게 나타내야 합니다.
  - severity: low
    issue: 직접 인용 앞 쉼표 및 인용부호
    rationale: 한국어 문장에서는 콜론과 통상적인 큰따옴표가 자연스럽습니다.
  - severity: low
    issue: δοῦλος의 대안 번역 각주 누락
    rationale: 영어 POB 감사 기록이 ‘slave’라는 유효한 어휘 대안을 보존하므로, 본문 ‘종’의 역사적 종속 신분 뉘앙스를 각주로 밝혀 감사 가능성을 유지하는 것이 좋습니다.
  revised_text: 그의 주인이 그에게 말하였습니다. “잘하였다, 착하고 충성된 종아. 네가 적은 일에 충성하였으니, 내가 너에게 많은 일을 맡기겠다. 네 주인의 기쁨에 들어오너라.”
  revised_footnotes:
  - marker: a
    text: ‘종’은 그리스어 δοῦλος를 옮긴 말입니다. 문맥에 따라 ‘노예’로도 번역할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 문장을 현대 표준어에 맞게 다듬고, ‘적은 일/많은 일’의 대조와 책임을 더 크게 맡긴다는 원문의 의미를 분명히 했습니다. 비유의 이야기 수준에서 κύριος는 ‘주인’으로 유지했으며, δοῦλος의 가능한 ‘노예’ 번역은 각주로 보존했습니다.
