- from: 그때에 그가 또 왼편에 있는 자들에게 말할 것입니다, ʻ저주받은 자들아, 내게서 떠나, 마귀와 그의 천사들을 위해 예비된 영원한 불 속으로 들어가라.ʼ
  to: 그때에 그가 또 왼편에 있는 사람들에게 말씀하실 것입니다. ‘저주받은 자들아, 내게서 떠나 마귀와 그의 천사들을 위해 예비된 영원한 불 속으로 들어가십시오.’
