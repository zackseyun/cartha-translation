review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sequence, addressees at the left, separation from the speaker, the cursed addressees, entry into the eternal fire, and its preparation for the devil and his angels. However, the quoted imperatives are in informal plain command forms (떠나, 들어가라), which do not meet the stipulated modern formal-polite 합쇼체 register.
  naturalness: ‘왼편에 있는 자들’ is understandable but less natural than ‘왼편에 있는 사람들’; ‘말할 것입니다’ and the imperative forms also create a register mismatch. Formal-polite imperative endings make the direct speech consistent and natural.
  terminology: ‘저주받은 자들’, ‘마귀’, ‘천사들’, ‘영원한 불’, and ‘예비된’ appropriately represent the Greek terms without adding doctrinal interpretation. ‘마귀’ is the standard Korean biblical designation for διάβολος.
  issues:
  - severity: medium
    issue: Direct-speech imperatives do not use the required 합쇼체 register.
    rationale: ‘내게서 떠나, … 들어가라’ uses non-polite command forms. The target specification requires modern formal-polite Korean; ‘떠나십시오’ and ‘들어가십시오’ satisfy this without changing the force of Πορεύεσθε.
  - severity: low
    issue: ‘왼편에 있는 자들’ is somewhat stilted in contemporary Korean.
    rationale: ‘왼편에 있는 사람들’ is more natural modern formal Korean and retains the contextual sense of τοῖς ἐξ εὐωνύμων.
  revised_text: 그때에 그가 또 왼편에 있는 사람들에게 말씀하실 것입니다. ‘저주받은 자들아, 내게서 떠나 마귀와 그의 천사들을 위해 예비된 영원한 불 속으로 들어가십시오.’
