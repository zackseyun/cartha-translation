review_pass:
  verdict: revise
  source_fidelity: τραπεζίταις는 이 문맥에서 이자를 받는 예금을 맡길 대상으로서 ‘은행가들’이 적절합니다. 초안의 ‘환전상들’은 가능한 어휘 범위 중 하나이나, τόκος(이자)와 결합된 본문의 금융 맥락을 충분히 반영하지 못합니다. ‘맡겨 두었어야 했다’는 βαλεῖν의 예치 의미와 ἔδει의 과거의 당위를 자연스럽게 옮깁니다.
  naturalness: 현대 표준 한국어 합쇼체에 맞추어 ‘너는 마땅히 … 했어야 했다’와 ‘내가 와서 … 받았을 것이다’를 유지하되, 예금 행위는 ‘맡겨 두다’로 명료하게 표현했습니다.
  terminology: ἀργύριά는 문맥상 ‘돈’, τραπεζίταις는 ‘은행가들’, τόκος는 가치 판단을 덧붙이지 않는 ‘이자’로 옮겼습니다. 이 비유의 금융 언어가 이자 행위 일반에 대한 승인 또는 비난을 직접 주장하는 것으로 확대되지 않도록 중립적으로 번역했습니다.
  issues:
