    issue: ‘환전상들에게’
    rationale: τραπεζίτης가 환전업자도 가리킬 수 있으나, 돈을 맡겨 이자를 받는다는 본절의 직접 문맥에서는 은행 업무를 하는 사람들, 곧 ‘은행가들’이 더 정확합니다.
