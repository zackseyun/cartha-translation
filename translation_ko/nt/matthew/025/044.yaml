  text: 그때 그들도 대답하여 말할 것입니다. ‘주님, 우리가 언제 주님께서 굶주리시거나 목마르시거나 나그네로 계시거나 헐벗으시거나 병드시거나 옥에 갇히신 것을 보고도 주님을 섬겨 드리지 않았습니까?[a]’
