source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
  footnotes:
  - marker: a
    text: Or 'looked after me' for 'visited me'; the Greek verb can include the sense of visiting with care or concern.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'you came to me.'
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 헐벗었을 때 너희가 내게 옷을 입혀 주었으며, 내가 병들었을 때 너희가 나를 찾아보았고, 내가 옥에 갇혔을 때 너희가 내게 왔습니다.”
  philosophy: optimal-equivalence
