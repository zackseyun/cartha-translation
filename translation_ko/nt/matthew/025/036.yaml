revisions:
- from: ʻ내가 헐벗었을 때에 너희가 나를 입혔으며, 내가 병들었을 때에 너희가 나를 돌보았고, 내가 옥에 갇혔을 때에 너희가 나를 찾아왔다.ʼ
  to: “내가 헐벗었을 때 너희가 내게 옷을 입혀 주었으며, 내가 병들었을 때 너희가 나를 찾아보았고, 내가 옥에 갇혔을 때 너희가 내게 왔습니다.”
  rationale: 원문의 세 병렬 절과 동사들의 구별을 유지했습니다. 특히 병든 이를 ‘찾아보다’와 갇힌 이에게 ‘오다’를 구별하여, 돌봄의 함의를 과도하게 본문에 명시하지 않았습니다. 영어 감사 기록의 각주 표지는 ‘visited me’ 관련 주석이 clothed에, ‘came to me’ 관련 주석이 visited에 연결되어 있어 서로 어긋나지만, 한국어 본문에는 각주가 없으므로 한국어 각주 구조에는 영향을 주지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:26:10Z'
review_pass:
  verdict: revise
  source_fidelity: ‘돌보았고’는 ἐπεσκέψασθέ의 돌봄/관심의 함의를 반영할 수 있으나, 기본 동작인 ‘찾아보다/방문하다’를 ‘돌보다’로 확정하여 다소 확장합니다. 또한 ἤλθατε πρός με는 ‘내게 왔다’로 옮겨 앞 절의 방문 동사와 구별하는 것이 좋습니다. ‘내게 옷을 입혀 주었다’는 γυμνός와 περιεβάλετέ με의 대응을 자연스럽고 분명하게 드러냅니다.
  naturalness: ‘나를 입혔다’도 가능하지만 현대 한국어에서는 ‘내게 옷을 입혀 주었다’가 더 자연스럽고 의미가 명확합니다. 문장 전체는 현대 표준어 합쇼체에 맞추어 종결을 ‘왔습니다’로 다듬었습니다.
  terminology: ‘헐벗다’, ‘병들다’, ‘옥에 갇히다’는 본문의 간결한 표현과 문맥에 적합합니다. ‘찾아보다’는 병든 이를 관심 있게 방문한다는 의미를 유지하면서 ‘돌보다’보다 해석적 확장을 줄입니다.
  issues:
  - severity: medium
    issue: ἐπεσκέψασθέ με를 ‘나를 돌보았고’로 번역함
    rationale: 이 동사는 돌봄의 뉘앙스를 포함할 수 있지만 우선적으로 ‘찾아보다/방문하다’라는 행위를 가리킵니다. ‘돌보다’는 실제 지속적 간호·보호를 명시하는 듯하여 원문의 직접적 표현보다 강합니다.
  - severity: low
    issue: ἤλθατε πρός με의 ‘내게’가 번역에서 생략됨
    rationale: ‘나를 찾아왔다’도 자연스럽지만, 원문의 단순한 ‘내게 왔다’를 유지하면 바로 앞 절의 ἐπεσκέψασθέ와의 어휘적 구별이 더 잘 보존됩니다.
  revised_text: “내가 헐벗었을 때 너희가 내게 옷을 입혀 주었으며, 내가 병들었을 때 너희가 나를 찾아보았고, 내가 옥에 갇혔을 때 너희가 내게 왔습니다.”
