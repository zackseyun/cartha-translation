revisions:
- from: ʻ누구든지 가진 자에게는 더 주어 그가 풍족하게 될 것이며, 없는 자에게서는 그 있는 것마저도 빼앗길 것이다.ʼ
  to: “가진 모든 사람에게는 더 주어져 그가 풍성해질 것이며, 가지지 않은 사람에게서는 그가 가진 것마저도 빼앗길 것입니다.”
  rationale: 원문의 분배적 대조(‘가진 모든 사람’/‘가지지 않은 사람’), 미래 수동태(‘주어져’, ‘빼앗길 것입니다’), 그리고 καί의 강조(‘마저도’)를 보존하면서 현대 표준어 합쇼체로 다듬었습니다. περισσευθήσεται는 수동형이지만 여기서는 ‘풍성해질 것입니다’라는 결과 상태의 표현이 자연스럽고 원문의 의미를 충실히 전달합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:26:03Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 대조 구조와 미래 수동태는 대체로 반영되었습니다. 그러나 첫 절의 τῷ ... ἔχοντι παντί는 ‘가진 자에게는’보다 ‘가진 모든 사람에게는’이 παντί의 분배적 강조를 더 충실히 드러냅니다. 또한 περισσευθήσεται는 ‘풍족하게 될 것이다’로 옮길 수 있으나, 원문의 ‘더 풍성해질 것이다/풍성히 가지게 될 것이다’의 결과적 풍요를 더 직접적으로 나타내는 표현이 적절합니다.
  naturalness: 초안은 자연스럽지만 ‘더 주어’는 현대 표준어에서는 ‘더 주어져’가 문법적으로 더 명료하며, ‘없는 자에게서는 그 있는 것마저도’는 ‘가지지 않은 사람에게서는 그가 가진 것마저도’로 하면 병렬과 지시 관계가 분명하고 합쇼체 성경 문체에도 자연스럽습니다.
  terminology: ‘빼앗길 것이다’는 ἀρθήσεται의 미래 수동태와 ἀπ’ αὐτοῦ의 분리 의미를 적절히 반영합니다. ‘가진/가지지 않은 사람’은 문맥상 소유의 비유적 범위를 불필요하게 좁히지 않으면서 현대 한국어에 자연스럽습니다.
  issues:
  - severity: medium
    issue: παντί의 분배적 강조가 ‘가진 자’에서 충분히 드러나지 않습니다.
    rationale: τῷ γὰρ ἔχοντι παντί는 ‘가진 모든 사람에게’라는 분배적 표현입니다. 한국어에서 ‘가진 모든 사람에게는’이 이를 더 명시적으로 보존합니다.
  - severity: low
    issue: ‘더 주어’의 연결이 다소 생략적입니다.
    rationale: δοθήσεται는 미래 수동태이므로 ‘더 주어져’가 수동성과 절 연결을 더 분명하게 드러냅니다.
  - severity: low
    issue: ‘그 있는 것’은 현대 한국어에서 다소 부자연스럽고 선행 인물과의 관계가 약합니다.
    rationale: ὃ ἔχει는 ‘그가 가진 것’으로 옮기면 자연스럽고 의미가 명료합니다.
  revised_text: “가진 모든 사람에게는 더 주어져 그가 풍성해질 것이며, 가지지 않은 사람에게서는 그가 가진 것마저도 빼앗길 것입니다.”
  revised_footnotes: []
  revision_rationale: 원문의 분배적 대조(‘가진 모든 사람’/‘가지지 않은 사람’), 미래 수동태(‘주어져’, ‘빼앗길 것입니다’), 그리고 καί의 강조(‘마저도’)를 보존하면서 현대 표준어 합쇼체로 다듬었습니다. περισσευθήσεται는 수동형이지만 여기서는 ‘풍성해질 것입니다’라는 결과 상태의 표현이 자연스럽고 원문의 의미를 충실히 전달합니다.
