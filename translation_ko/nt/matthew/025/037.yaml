  to: 그때에 의인들이 그분께 대답할 것입니다. ‘주님, 우리가 언제 주님께서 굶주리신 것을 보고 먹을 것을 드렸으며, 목마르신 것을 보고 마실 것을 드렸습니까?’
  rationale: 원문의 시간 순서, 미래 시제, 대답의 대상, ‘의인들’과 ‘주님’이라는 핵심 용어를 유지하되, 먹이고 마시게 한 행위를 한국어에서 분명하고 자연스럽게 ‘먹을 것/마실 것을 드리다’로 옮겼습니다. 영어의 ‘give you drink’에 관한 문체적 각주는 한국어 본문에 필요한 원문상 변이나 해석상 쟁점이 아니므로 추가하지 않았습니다.
