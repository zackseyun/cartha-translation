    issue: ‘먹게 하였으며, 마시게 하였습니까’의 행위 주체와 의미가 모호합니다.
    rationale: ἐθρέψαμεν과 ἐποτίσαμεν은 굶주린 이에게 먹을 것과 마실 것을 제공하는 행위를 가리킵니다. 현 번역은 ‘먹고 마시도록 하다’라는 사역의 뜻으로 읽힐 수 있으므로, 제공 행위를 명시하는 편이 원문에 더 정확합니다.
  - severity: low
