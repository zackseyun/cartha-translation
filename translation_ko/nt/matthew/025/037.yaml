  source_fidelity: 원문의 미래 동사(ἀποκριθήσονται), ‘의인들’(οἱ δίκαιοι), 주님을 향한 호칭(Κύριε), 그리고 굶주림과 목마름의 병렬 질문을 충실히 옮겼습니다. 다만 ‘먹게 하였으며/마시게 하였습니까’는 한국어에서 먹고 마시도록 시킨다는 뜻으로도 읽힐 수 있어, τρέφω와 ποτίζω의 돌봄·제공 행위를 더 분명히 나타내는 표현으로 고치는 것이 안전합니다.
  naturalness: ‘당신’은 주님께 드리는 직접 호칭 뒤에서 현대 한국어 존대 문맥에 다소 부자연스럽고 거리감이 있습니다. ‘주님께서’와 ‘주님께’를 사용하면 합쇼체의 공적·경건한 문체가 자연스럽습니다. 또한 직접 인용문 앞의 문장 종결을 정리하면 더 매끄럽습니다.
  terminology: οἱ δίκαιοι는 ‘의인들’, Κύριε는 ‘주님’으로 유지했습니다. 피동적·신학적으로 과도한 해석을 더하지 않았습니다.
  issues:
