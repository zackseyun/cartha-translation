    issue: Register mismatch in ‘너희가’
    rationale: ‘너희’ is not suitable for a translation specified in modern formal-polite 합쇼체, particularly alongside ‘-십시오’ and ‘-입니다.’
  - severity: low
    issue: ‘그 시’ is less natural and less exact in this context than ‘그 시각’
    rationale: While ‘시’ can denote an hour, ‘시각’ is idiomatic for an unknown point/time and clearly represents ὥρα without interpretive expansion.
  revised_text: 그러므로 깨어 있으십시오[a]. 여러분이 그 날도 그 시각도 알지 못하기 때문입니다.
