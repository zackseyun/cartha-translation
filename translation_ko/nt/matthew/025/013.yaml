  verdict: revise
  source_fidelity: The draft accurately renders the inferential οὖν, the present imperative γρηγορεῖτε, and the causal statement that the hearers do not know the day or the hour. ‘그 시’ is understandable, but ‘그 시각’ more naturally conveys ὥρα here. The negative pairing is best expressed without a comma as ‘그 날도 그 시각도.’
  naturalness: ‘너희가’ clashes with the stipulated modern formal-polite 합쇼체. Replacing it with ‘여러분이’ gives a consistent respectful plural address. The revised wording remains concise and idiomatic.
  terminology: ‘깨어 있으십시오’ appropriately retains the vigilance/sleep imagery of γρηγορεῖτε. ‘그 날’ and ‘그 시각’ preserve the definite but unspecified temporal expressions without adding an eschatological referent.
  issues:
