review_pass:
  verdict: revise
  source_fidelity: The draft conveys the verse’s commendation, faithfulness in limited responsibility, future appointment over greater responsibility, and command to enter the master’s joy. However, ‘많은 일 위에 세우겠다’ is not idiomatic Korean for καθίστημι in this stewardship context; ‘많은 일을 맡기겠다’ more naturally conveys appointment to greater charge.
  naturalness: A colon is needed after the speech-introduction verb rather than a comma. ‘적은 일’/‘많은 일’을 use natural Korean while retaining the Greek contrast. The authoritative quoted imperative ‘들어오너라’ is natural for a master addressing a servant within the parable, while the narration remains in formal-polite style.
  terminology: ‘주인’ appropriately renders κύριος in this parabolic household context. ‘종’ is a natural Korean rendering of δοῦλος, but the source term can also denote ‘slave’; an anchored note preserves that lexical alternative. ‘신실한’ consistently renders πιστός/πιστέ.
  issues:
  - severity: medium
    issue: ‘많은 일 위에 세우겠다’ is awkward and imprecise in Korean.
    rationale: καταστήσω with ἐπὶ πολλῶν means appointing the servant over or entrusting him with many things. ‘많은 일을 맡기겠다’ expresses this naturally without altering the meaning.
  - severity: low
    issue: The direct-speech introduction is punctuated with a comma.
    rationale: Modern Korean typography more naturally uses a colon before a full quoted utterance in this construction.
  - severity: low
    issue: The lexical breadth of δοῦλος is not documented.
    rationale: Because ‘종’ may be understood more broadly than the source term, a brief note that it can also mean ‘노예’ preserves the English audit trail and source-level transparency.
  revised_text: '그의 주인이 그에게 말하였습니다: “잘하였다, 선하고 신실한 종[a]아. 네가 적은 일에 신실하였으니, 내가 너에게 많은 일을 맡기겠다. 네 주인의 기쁨에 들어오너라.”'
  revised_footnotes:
  - marker: a
    text: 그리스어 도울로스(δοῦλος)는 문맥에 따라 ‘종’ 또는 ‘노예’를 뜻할 수 있습니다.
    reason: alternative_reading
  revision_rationale: The revision corrects punctuation and replaces an unnatural expression of appointment with an idiomatic stewardship expression. It preserves the source’s repeated ‘faithful,’ the contrast between few and many responsibilities, the human-parabolic sense of ‘master,’ and the imperative image of entering the master’s joy. The note is anchored to ‘종’ and records the viable alternative sense of δοῦλος.
