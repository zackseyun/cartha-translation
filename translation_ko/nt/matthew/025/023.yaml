review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal sense accurately, including the master's commendation, faithfulness in limited responsibility, future appointment over greater responsibility, and the command to enter the master's joy. However, "작은 일" underrepresents the plural ὀλίγα, and "많은 일 위에 세우겠다" is a rigid, unnatural rendering of appointment over greater responsibilities.
  naturalness: The comma after "말하였습니다" is not appropriate before direct quotation in standard Korean punctuation. "많은 일 위에 세우겠다" and "들어오너라" are less natural in contemporary Korean; the latter also introduces a 'come here' nuance not present in εἴσελθε.
  terminology: '"주인" appropriately renders κύριος in this parabolic household setting. "종" is a contextually suitable rendering of δοῦλος, while a footnote should retain "노예" as an explicit alternative. "신실한" consistently reflects πιστός/πιστέ.'
  issues:
  - severity: medium
    issue: Punctuation after the speech introducer
    rationale: A comma after "말하였습니다" before a direct quotation is nonstandard and interrupts natural Korean sentence flow.
  - severity: low
    issue: Plurality and idiom in the responsibilities clause
    rationale: '"작은 일" is singular despite ὀλίγα (''a few things''), and "많은 일 위에 세우겠다" is not idiomatic modern Korean for καθίστημι in this stewardship context.'
  - severity: low
    issue: Command wording at the conclusion
    rationale: '"들어오너라" can imply movement toward the speaker and has an archaic flavor. "들어가거라" naturally renders εἴσελθε while preserving the entering metaphor.'
  revised_text: 그의 주인이 그에게 말하였습니다. “잘하였다, 선하고 신실한 종아. 네가 몇 가지 일에 신실하였으니, 내가 너에게 많은 일을 맡기겠다. 네 주인의 기쁨에 들어가거라.”
  revised_footnotes:
  - marker: a
    text: 또는 “노예”. 그리스어 δοῦλος는 문맥에 따라 종이나 노예를 가리킬 수 있습니다.
    reason: alternative_reading
  revision_rationale: The revision preserves the source's contrast between a few and many responsibilities, renders the future appointment idiomatically as entrusting greater responsibilities, and retains the concrete metaphor of entering the master's joy. It also uses standard Korean direct-speech punctuation and supplies the audit-trail alternative for δοῦλος.
