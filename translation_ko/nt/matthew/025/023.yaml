  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
  footnotes:
  - marker: a
    text: Or “slave.” The Greek word is δοῦλος, which can denote a servant or a slave depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: '그의 주인이 그에게 말하였습니다: “잘하였다, 선하고 신실한 종[a]아. 네가 적은 일에 신실하였으니, 내가 너에게 많은 일을 맡기겠다. 네 주인의 기쁨에 들어오너라.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 도울로스(δοῦλος)는 문맥에 따라 ‘종’ 또는 ‘노예’를 뜻할 수 있습니다.
    reason: alternative_reading
