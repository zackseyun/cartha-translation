review_pass:
  verdict: revise
  source_fidelity: The draft conveys both acts of mercy, but ‘나그네 되신’ is an unnatural rendering of predicative ξένον, and ‘영접하다’ can suggest a formal or ceremonial reception rather than providing hospitality. ‘맞아들이다’ more directly represents συνηγάγομεν in context.
  naturalness: Replace the awkward ‘나그네 되신 것을’ with ‘나그네이신 것을.’ Avoid repeating ‘보고’ in the second clause, since the Greek has one governing verb, while retaining clear Korean syntax.
  terminology: ‘나그네’ appropriately conveys ξένος in its hospitality sense. ‘헐벗으신’ and ‘옷을 입혀 드렸습니까’ naturally convey γυμνόν and περιεβάλομεν, with suitable honorific language for the king addressed in the parable.
  issues:
  - severity: medium
    issue: ‘나그네 되신’ is not idiomatic Korean for ξένον.
    rationale: The Greek presents the addressed person as ‘a stranger’; Korean naturally expresses this as ‘나그네이신 것을.’
  - severity: medium
    issue: ‘영접하였으며’ can be overly formal or ceremonial for συνηγάγομεν.
    rationale: In this context the verb denotes taking someone in or offering hospitality. ‘맞아들이다’ preserves that concrete hospitality sense.
  - severity: low
    issue: The draft repeats ‘보고’ in the second alternative.
    rationale: This is understandable, but the source uses εἴδομεν once for both predicates. Omitting the repetition produces smoother Korean without loss of meaning.
  revised_text: 또 우리가 언제 당신께서 나그네이신 것을 보고 맞아들였으며, 헐벗으신 것을 옷을 입혀 드렸습니까?
  revised_footnotes:
  - marker: a
    text: 또는 ‘외국인’. 그리스어는 낯선 이, 알지 못하는 이, 또는 공동체 밖에서 온 이를 가리킬 수 있습니다. 여기서는 환대가 필요한 사람이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘함께 모아들였다’ 또는 ‘받아들였다’. 여기서는 손님으로 맞아들여 환대한 것을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘제대로 옷을 입지 못한’. 그리스어는 문자적으로 벌거벗은 상태나 충분한 옷이 없는 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision uses idiomatic modern formal-polite Korean, preserves the source’s two coordinated alternatives and its hospitality sense, and retains the lexical breadth of ξένος and γυμνός in notes. Honorific forms appropriately reflect the addressee in the parable without adding theological interpretation.
