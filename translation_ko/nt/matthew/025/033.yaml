  source_fidelity: στήσει는 두 집단을 특정 위치에 ‘세우다/배치하다’라는 뜻입니다. 초안의 ‘둘 것입니다’도 가능하지만, 여기서는 심판 장면에서 두 집단을 세워 구분하는 동작이므로 ‘세울 것입니다’가 더 직접적입니다. ἐρίφια는 일반적인 ‘염소’보다 ‘어린 염소/새끼 염소’를 가리킬 수 있으므로 각주로 그 뉘앙스를 보완했습니다.
  naturalness: ‘그는 양들을 자기 오른편에, 염소들을 왼편에 세울 것입니다’는 현대 표준 한국어의 격식 있는 합쇼체에 자연스럽고, 두 대조 항목의 병렬도 분명합니다.
  terminology: ‘양’과 ‘염소’는 문맥상 적절합니다. ‘오른편/왼편’은 원문의 공간적 대조를 자연스럽게 보존하며, 우대·불이익이라는 해석을 본문에 덧붙이지 않습니다.
