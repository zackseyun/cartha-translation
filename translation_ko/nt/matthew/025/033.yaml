  source_fidelity: στήσει는 타동사로 두 무리를 각각 일정한 위치에 세우거나 배치한다는 뜻입니다. 초안의 ‘둘 것입니다’도 의미상 가능하지만, ‘세울 것입니다’가 원문의 장면성과 동사 의미를 더 직접적으로 반영합니다. ἐρίφια에는 ‘어린 염소/새끼 염소’라는 어휘적 뉘앙스가 있으므로, 본문에서는 자연스러운 ‘염소들’을 쓰되 각주로 대안을 밝혀 보존하는 것이 적절합니다.
  naturalness: ‘그는 양들을 자기 오른편에, 염소들을 왼편에 세울 것입니다’는 현대 표준어 합쇼체로 자연스럽고, 두 대상을 대비하는 μὲν ... δὲ의 구조를 명료하게 드러냅니다. ‘왼편’은 앞의 ‘자기’와 병렬되어 그를 기준으로 한 위치임이 자연스럽게 이해됩니다.
  terminology: ‘양들’, ‘염소들’, ‘오른편’, ‘왼편’은 한국어 성서 문맥에서 널리 이해되는 중립적 표현입니다. ‘염소들’에 ἐρίφια의 연령 뉘앙스를 본문에 과도하게 넣지 않고 각주로 제시합니다.
  issues:
  - severity: low
    issue: ‘둘 것입니다’는 στήσει의 ‘세우다/배치하다’라는 장면적 의미를 다소 약하게 전달합니다.
    rationale: 심판 장면에서 양과 염소를 좌우에 구분해 세우는 동작을 나타내므로 ‘세울 것입니다’가 더 충실합니다.
  - severity: low
    issue: ἐρίφια의 ‘어린 염소’ 뉘앙스가 초안에서 표시되지 않습니다.
    rationale: ‘염소들’은 자연스러운 본문 번역이지만, 가능한 더 구체적인 어휘 의미를 각주로 보존하는 것이 최적 등가 원칙에 부합합니다.
  revised_text: 그리고 그는 양들을 자기 오른편에, 염소들을 왼편에 세울 것입니다.
  revised_footnotes:
  - marker: a
    text: ‘염소들’은 그리스어로 ‘어린 염소들’ 또는 ‘새끼 염소들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 미래 능동 동사 στήσει를 ‘세울 것입니다’로 옮겨 두 무리를 구분하여 배치하는 동작을 더 충실히 반영했습니다. ἐρίφια는 자연스러운 한국어 본문에서는 ‘염소들’로 번역하고, 연령 뉘앙스는 각주로 보존했습니다. 오른편과 왼편의 상징적 의미는 본문에 해설로 덧붙이지 않았습니다.
