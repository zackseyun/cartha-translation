  source_fidelity: 원문의 강한 명령형 ἐκβάλετε와 ‘바깥 어둠’ 및 그곳에서의 울음과 이를 갊이라는 마태복음의 정형 표현을 보존하도록 다듬었습니다. ‘슬피’는 원문이 직접 명시하지 않는 뉘앙스이므로 제외했습니다.
  naturalness: 초안의 ‘바깥 어두운 데’는 현대 표준어에서 다소 부자연스럽습니다. ‘바깥 어둠으로’와 ‘그곳에서는 … 것입니다’가 자연스럽고 합쇼체 문체에도 맞습니다. 인용부호는 본문 자체에 필요하지 않아 제거했습니다.
  terminology: δοῦλος의 예속된 신분이 비유의 설정에서 두드러지므로 ‘노예’로 옮기고, ‘종’이라는 가능한 대안을 각주로 밝혔습니다. ‘이를 갈다’는 βρυγμὸς τῶν ὀδόντων의 확립된 한국어 성경 표현으로 유지했습니다.
