  naturalness: 'The revision uses natural modern formal-polite Korean: ‘나아와 … 가져와 말하였습니다’ is suitably clear, direct-speech punctuation is normalized, and ‘제게’ avoids the awkward deferential mismatch of ‘당신께서 내게’ in an address to a superior.'
  terminology: ‘달란트’ retains the source term and is explained as a large monetary unit. ‘주여’ follows the project’s κύριος convention; the alternative ‘주인’ is noted without forcing a theological interpretation. ‘벌었습니다’ appropriately renders the profitable gain expressed by ἐκέρδησα.
