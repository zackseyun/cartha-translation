review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents receiving five talents, going, using them productively, and gaining five additional talents. However, “그것으로 일을 하여” is less idiomatic Korean and leaves the financial use of the funds somewhat unclear. “운용하여” naturally conveys the active, profit-seeking use denoted by ἠργάσατο ἐν αὐτοῖς without narrowing it to a particular commercial method.
  naturalness: “다섯 달란트를 받은 사람은 가서 그것들을 운용하여 다섯 달란트를 더 벌었습니다” is clear, modern standard Korean in formal-polite style. The plural “그것들을” agrees naturally with the five talents, and “더” idiomatically renders ἄλλα πέντε.
  terminology: “달란트” preserves the established monetary term. A brief note is advisable because modern Korean can also understand “talent” as an innate ability; here it is a large monetary unit.
  issues:
  - severity: low
    issue: “그것으로 일을 하여” is awkward and semantically broad in Korean.
    rationale: While not incorrect, it can sound like merely working by means of something rather than putting the received money into productive use. The Greek construction refers to active employment of the funds resulting in profit.
  revised_text: 다섯 달란트[a]를 받은 사람은 가서 그것들을 운용하여 다섯 달란트를 더 벌었습니다.
  revised_footnotes:
