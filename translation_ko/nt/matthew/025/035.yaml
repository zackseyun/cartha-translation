  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ξένος ... συνηγάγετέ με는 나그네를 받아들이는 환대의 뜻이므로, 현대 한국어에서는 ‘나그네 되었을 때에 ... 영접하였고’보다 ‘나그네였을 때 ... 맞아들여 주셨습니다’가 그 의미를 더 정확히 드러냅니다.
  naturalness: 초안의 ‘주릴 때에’, ‘나그네 되었을 때에’, ‘영접하였고’는 현대 표준어 합쇼체로는 다소 문어적·고풍스럽고, ‘너희가’와 서술어도 요청된 존대 종결 방식에 맞지 않습니다. 자연스러운 현대 합쇼체로 다듬었습니다.
  terminology: ‘배고프다’, ‘목마르다’, ‘나그네’, ‘맞아들이다’는 본문의 일상적 필요와 낯선 이를 환대하는 의미를 자연스럽게 보존합니다. ‘나그네’는 ξένος의 문맥상 의미에 적절하며, 현대의 특정 법적·정치적 범주를 덧붙이지 않습니다.
