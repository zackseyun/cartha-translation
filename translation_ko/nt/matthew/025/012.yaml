  terminology: ‘진실로 너희에게 말합니다’는 Ἀμὴν λέγω ὑμῖν의 엄숙한 강조를 자연스럽게 반영합니다. ‘알지 못합니다’는 ‘인정하지 않습니다’처럼 해석을 좁히지 않고 원문의 표현을 유지합니다.
