translation:
  language: ko
  text: 그러자 어리석은 처녀들이 지혜로운 처녀들에게 말하였습니다. “여러분의 기름을 조금 우리에게 주십시오. 우리 등불[a]이 꺼져 가고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘등불’(그리스어 λαμπάδες)은 ‘횃불’로도 옮길 수 있습니다. 이 말은 손에 들고 불을 밝히는 기구를 가리킬 수 있으며, 장면을 어떻게 이해하는지에 따라 번역이 달라집니다.
    reason: lexical_alternative
