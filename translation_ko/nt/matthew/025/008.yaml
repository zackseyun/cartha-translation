  terminology: '''어리석은 이들/슬기로운 이들''은 비유 안의 대조를 자연스럽고 절제되게 보존합니다. ''등불''은 문맥상 적절하나 λαμπάδες에는 ''횃불''이라는 가능한 대안이 있으므로 각주로 보존합니다.'
  issues:
