  - severity: low
    issue: λαμπάδες의 어휘 대안 미보존
    rationale: 문맥상 '등불'을 채택할 수 있으나, 이 단어는 '횃불'도 뜻할 수 있어 영어 감사 기록의 어휘 각주를 한국어에도 반영하는 것이 좋습니다.
  revised_text: 그러자 어리석은 이들이 슬기로운 이들에게 말했습니다. “당신들의 기름을 조금 우리에게 주십시오. 우리의 등불이 꺼져 가고 있습니다.”
