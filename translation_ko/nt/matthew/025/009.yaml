  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
  footnotes:
  - marker: a
    text: Or, more formally, 'lest there should by no means be enough for us and for you.' The Greek uses an emphatic negation with 'lest,' expressing strong concern that the supply would prove insufficient.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 지혜로운 처녀들이 대답했습니다. “안 됩니다[a]. 혹시 우리와 여러분 모두에게 전혀 충분하지 않게 될까 염려됩니다. 차라리 파는 사람들에게 가서 여러분 자신을 위해 사십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “우리와 여러분 모두에게 결코 충분하지 않을까 하여.” 그리스어는 ‘혹시’와 강조 부정을 함께 써서 공급이 부족하게 될 것에 대한 강한 우려를 나타냅니다.
    reason: lexical_alternative
