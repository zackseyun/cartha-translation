  to: 그때에 한 달란트를 받은 자도 와서 말하였습니다. ‘주여, 저는 당신이 엄한 분이시며, 심지 않은 곳에서 거두고 흩어 놓지 않은 곳에서 모으시는 분인 줄 알았습니다.’
