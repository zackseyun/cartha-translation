review_pass:
  verdict: revise
  source_fidelity: The draft retains the narrative sequence, the identification of the servant who received one talent, and the two agricultural expressions. However, 굳은 분 is not an idiomatic Korean characterization for σκληρὸς ἄνθρωπος in this context and can suggest physical hardness or steadfastness rather than severity.
  naturalness: The overall 합쇼체 narrative is appropriate, but 굳은 분 and 흩지 않은 데 are unnatural in modern Korean. 엄한 분 and 흩어 놓지 않은 곳 make the accusation readable while retaining its character as the servant's claim.
  terminology: 달란트 and 주여 are appropriate established biblical terms. 엄한 분 conveys σκληρός without making a stronger interpretive claim such as ‘cruel.’
  issues:
  - severity: medium
    issue: ‘굳은 분’ is not a natural contextual rendering of σκληρὸς ἄνθρωπος.
    rationale: In contemporary Korean, 굳은 commonly describes something physically hard or a firm resolve. Here σκληρός characterizes the master's severity; 엄한 분 is natural and preserves the servant's evaluative accusation without endorsing it.
  - severity: medium
    issue: ‘흩지 않은 데’ is grammatically and idiomatically awkward.
    rationale: 흩다/흩어 놓다 is the natural Korean expression for scattering. ‘흩어 놓지 않은 곳’ leaves the unstated object unexpressed, as in the Greek, while remaining comprehensible.
  revised_text: 그때에 한 달란트를 받은 자도 와서 말하였습니다. ‘주여, 저는 당신이 엄한 분이시며, 심지 않은 곳에서 거두고 흩어 놓지 않은 곳에서 모으시는 분인 줄 알았습니다.’
