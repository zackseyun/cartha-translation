review_pass:
  verdict: revise
  source_fidelity: ‘빼앗아’는 여기서 ἄρατε(αἴρω)의 기본 뜻인 ‘가져가라/거두어 가라’보다 강제적 박탈의 뉘앙스를 더합니다. 또한 τὸ τάλαντον의 정관사는 문맥상 특정한 ‘그 달란트’로 옮기는 것이 좋습니다.
  naturalness: ‘그에게서 그 달란트를 가져가서 열 달란트를 가진 사람에게 주십시오’는 현대 표준어 합쇼체로 자연스럽고, 복수 명령의 수신자에게 하는 지시도 무리 없이 드러냅니다.
  terminology: τάλαντον은 현대어의 ‘재능’으로 오해될 수 있으므로 역사적 화폐·무게 단위라는 뜻을 각주로 밝혀 둡니다. ‘달란트’라는 전통적 용어 자체는 유지합니다.
  issues:
  - severity: medium
    issue: ‘빼앗아’
    rationale: αἴρω는 이 문맥에서 그 물건을 그 사람에게서 가져가라는 명령입니다. ‘빼앗다’는 원문에 명시되지 않은 강탈·폭력의 뉘앙스를 보태므로 ‘가져가서’가 더 중립적이고 충실합니다.
  - severity: low
    issue: τὸ τάλαντον의 정관사 미반영
    rationale: 앞 문맥에서 문제 된 특정 한 달란트를 가리키므로 ‘그 달란트’가 원문의 지시성을 더 잘 반영합니다.
  - severity: low
    issue: 달란트의 역사적 의미에 대한 안내 부재
    rationale: 현대 한국어에서 ‘달란트’가 타고난 재능이라는 뜻으로 널리 쓰이므로, 본문의 화폐·무게 단위 의미를 밝히는 각주가 독해에 도움이 됩니다.
  revised_text: 그러므로 그에게서 그 달란트를 가져가서 열 달란트를 가진 사람에게 주십시오.[a]
