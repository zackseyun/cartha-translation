- from: ʻ그러므로 그에게서 달란트를 빼앗아 열 달란트를 가진 자에게 주라.ʼ
  to: 그러므로 그에게서 그 달란트를 가져가서 열 달란트를 가진 사람에게 주십시오.[a]
  rationale: 명령의 논리적 연결(‘그러므로’), ἀπ’ αὐτοῦ의 분리 의미(‘그에게서’), αἴρω의 중립적인 제거·회수 의미(‘가져가서’), 특정한 한 달란트(‘그 달란트’), 그리고 이미 열 달란트를 가진 사람이라는 지시를 보존했습니다. 달란트는 재능으로 의역하지 않고 역사적 용어로 유지하되 각주로 의미를 안내했습니다.
  reviewer_model: gpt-5.6-terra
