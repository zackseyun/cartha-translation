  - severity: medium
    issue: 명령형과 발화가 합쇼체가 아닙니다.
    rationale: 대상 문체가 현대 정중한 합쇼체이므로 ‘두어라/말하리라/모으라’보다 ‘두십시오/말하겠습니다/모으십시오’가 지정된 등록에 맞습니다.
  - severity: low
    issue: 가라지의 어휘적 대안에 대한 각주가 없습니다.
    rationale: ζιζάνια의 구체적 식물 동정에는 불확실성이 있으므로, 본문 용어를 유지하면서 대안을 각주로 안내하는 것이 영어 감사 기록의 어휘 결정을 적절히 반영합니다.
