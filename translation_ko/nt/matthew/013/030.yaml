  source_fidelity: 핵심 의미는 대체로 충실합니다. ἄφετε συναυξάνεσθαι ἀμφότερα는 ‘둘 다 함께 자라도록 두십시오’로, 순서 표지 πρῶτον과 대조 τὸν δὲ σῖτον도 보존해야 합니다. 다만 현재 문안의 인용부호가 구조적으로 잘못되어 있고, 합쇼체 요구에 맞게 명령과 발화를 정비할 필요가 있습니다.
  naturalness: ‘추수 때가 되면’과 ‘추수꾼들’은 현대 표준어에서 자연스럽습니다. ‘단으로 묶고’도 가능하나, 복수 δέσμας와 행위의 결과를 더 또렷하게 드러내는 ‘단으로 묶으십시오’가 문맥상 자연스럽습니다.
  terminology: ζιζάνια는 본문에서 ‘가라지’로 옮기는 것이 한국어 성경 전통 및 비유의 식별 가능성에 적절합니다. 다만 정확한 식물 동정은 확정하기 어려우므로 ‘가라지(독보리로도 알려진 해로운 잡초)’라는 선택지를 각주로 제시합니다. σῖτος는 ‘밀’, ἀποθήκη는 ‘곳간’으로 적절합니다.
