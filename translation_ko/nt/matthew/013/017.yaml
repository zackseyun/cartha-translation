- from: 진실로 내가 너희에게 말한다. 많은 예언자들과 의인들이 너희가 보는 것들을 보기를 사모하였으나 보지 못하였고, 너희가 듣는 것들을 듣기를 사모하였으나 듣지 못하였다.
  to: 내가 너희에게 진실로 말합니다. 이는 많은 예언자들과 의인들이 너희가 보는 것을 보기를 간절히 바랐으나 보지 못했고, 너희가 듣는 것을 듣기를 간절히 바랐으나 듣지 못했기 때문입니다.
  rationale: γάρ의 설명 관계를 ‘이는 … 때문입니다’로 명시하고, 전체를 현대 합쇼체로 통일했습니다. ἐπεθύμησαν은 ‘간절히 바랐으나’로, 두 상대절(‘너희가 보는 것/듣는 것’)과 두 부정 과거 진술은 대칭적으로 유지했습니다. 원문과 영어 감사 기록에 있는 δίκαιοι의 대안은 한국어 ‘의인들’이 충분히 전달하므로 별도 각주는 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
