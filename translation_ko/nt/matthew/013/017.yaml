  - severity: medium
    issue: 합쇼체 종결과 불일치
    rationale: ‘말한다’, ‘못하였다’는 해라체입니다. 과업에서 지정한 현대 공식-공손 합쇼체에 맞추어 ‘말합니다’, ‘못했습니다’로 고쳐야 합니다.
  - severity: low
    issue: ‘사모하였으나’의 현대성 및 문장 흐름
    rationale: 의미상 오류는 없지만, ‘간절히 바랐으나’가 ἐπεθύμησαν의 강한 소망을 현대어로 더 자연스럽게 표현합니다.
