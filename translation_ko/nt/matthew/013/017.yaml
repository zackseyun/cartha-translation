review_pass:
  verdict: revise
  source_fidelity: 초안은 절의 핵심 의미와 병렬 구조를 대체로 보존하지만, γάρ(‘왜냐하면/이는’)의 설명적 연결이 빠져 있으며, 합쇼체 지정에 비해 종결 표현이 해라체입니다. ‘사모하다’는 강한 소망을 나타낼 수 있으나 현대 일반 문체에서는 다소 종교적·문어적인 어감을 띱니다.
  naturalness: ‘너희가 보는 것들을 보기를’은 문법적으로 가능하지만 ‘것들’과 ‘보기를’의 중복으로 다소 무겁습니다. ‘너희가 보는 것을 보기를 간절히 바랐으나’가 현대 표준어에서 자연스럽고 원문의 강한 소망과 목적어를 함께 살립니다.
  terminology: ‘예언자’, ‘의인’은 적절합니다. δίκαιοι의 복수 실체용법은 ‘의인들’로 자연스럽게 드러나며, 특정 교리적 해석을 더하지 않습니다. 본문이 명시하지 않는 보거나 듣는 대상도 그대로 유지했습니다.
