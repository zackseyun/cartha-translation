translation:
  language: ko
  text: 내가 너희에게 진실로 말합니다. 이는 많은 예언자들과 의인들이 너희가 보는 것을 보기를 간절히 바랐으나 보지 못했고, 너희가 듣는 것을 듣기를 간절히 바랐으나 듣지 못했기 때문입니다.
  philosophy: optimal-equivalence
