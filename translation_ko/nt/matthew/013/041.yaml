  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
  footnotes:
  - marker: a
    text: Or 'all stumbling blocks.' The Greek σκάνδαλα can refer to things that cause people to sin or fall away.
    reason: lexical_alternative
  - marker: b
    text: Or 'those who do lawlessness.' The wording emphasizes ongoing, characteristic rebellion against God's law.
    reason: lexical_alternative
translation:
  language: ko
  text: 인자께서 자기 천사들을 보내실 것이며, 그들이 그의 나라에서 모든 걸림돌[a]과 불법을 행하는 자들[b]을 모아 낼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 걸려 넘어지게 하는 것들’. 그리스어 σκάνδαλα는 사람이 죄를 짓거나 믿음에서 떠나게 하는 원인이나 장애물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불법을 행하는 자들’. 이 표현은 하나님의 법을 거스르는 일을 지속적으로 행하는 사람들을 가리킵니다.
    reason: lexical_alternative
