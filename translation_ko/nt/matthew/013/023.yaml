  text: 그러나 좋은 땅에 뿌려진 이는 말씀을 듣고 깨닫는 사람입니다. 그는 참으로 열매를 맺어, 어떤 것은 백 배, 어떤 것은 육십 배, 어떤 것은 삼십 배를 냅니다.
  philosophy: optimal-equivalence
