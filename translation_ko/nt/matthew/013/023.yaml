  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 σπαρείς는 비유에서 씨가 가리키는 사람을 뜻하므로 ‘뿌려진 이’가 ‘뿌려진 것’보다 자연스럽고 정확합니다. δὴ의 강조는 ‘참으로’로 무리 없이 반영할 수 있습니다. 수확량의 분배도 유지했습니다.
  naturalness: 초안의 ‘좋은 땅에 뿌려진 것, 이것은’은 한국어에서 다소 부자연스럽고, 문장 끝의 닫는 인용 부호(」)는 짝이 없습니다. 현대 표준어 합쇼체에 맞추어 문장을 매끄럽게 정리했습니다.
  terminology: λόγος는 문맥상 ‘말씀’으로 유지했고, συνιείς는 ‘깨닫는’, καρποφορεῖ/ποιεῖ는 ‘열매를 맺어 … 배를 냅니다’로 각각의 농경 비유를 보존했습니다. ‘좋은 땅’은 καλὴ γῆ의 비유적 농경 문맥에 적절합니다.
  issues:
