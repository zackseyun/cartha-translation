  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
  footnotes:
  - marker: a
    text: Or 'upon the good ground.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'one a hundred, one sixty, and one thirty'; that is, varying crop yields. Many English versions express this as 'a hundredfold ... sixty ... thirty.'
    reason: lexical_alternative
translation:
