    issue: ‘뿌려진 것’이라는 지시 표현
    rationale: 원문의 남성 단수 분사는 비유 속 씨가 상징하는 사람을 가리킵니다. ‘뿌려진 이’가 한국어에서도 더 명료하고 자연스럽습니다.
  - severity: low
    issue: 짝 없는 닫는 인용 부호(」)
    rationale: 열리는 인용 부호 없이 닫는 부호만 있어 문장부호상 오류입니다.
