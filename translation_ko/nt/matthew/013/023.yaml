  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 σπαρείς가 비유 속에서 사람을 가리키므로 ‘뿌려진 것’보다 ‘뿌려진 이’가 더 정확합니다. δὴ의 강조는 ‘참으로’로 자연스럽게 반영할 수 있습니다. 수확량의 분배 표현도 유지했습니다.
  naturalness: 초안의 문장 자체는 대체로 자연스럽지만, ‘뿌려진 것, 이것은’은 사람을 설명하는 문맥에서 다소 부자연스럽습니다. 또한 끝의 닫는 인용부호(」)는 짝이 없는 문장부호입니다.
  terminology: ‘말씀’, ‘깨닫다’, ‘열매를 맺다’는 복음서 문맥에 적합하고 현대 표준어 합쇼체에도 잘 맞습니다. ‘좋은 땅’은 농경 비유에서 자연스러우며, ‘좋은 토양’은 각주 대안으로 제시할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘뿌려진 것’
    rationale: ὁ ... σπαρείς는 씨 자체를 통하여 표상되는 사람을 가리키며, 뒤의 ‘말씀을 듣고 깨닫는 자’와도 연결됩니다. 한국어에서는 ‘뿌려진 이’가 이 인물 지시를 더 분명히 합니다.
  - severity: low
    issue: 짝이 없는 닫는 인용부호(」)
    rationale: 본문에 여는 인용부호가 없으므로 삭제해야 합니다.
  - severity: low
    issue: ‘진실로’의 어감
    rationale: δὴ는 여기서 화자의 진실성 주장이라기보다 강조를 더합니다. ‘참으로’가 강조를 더 직접적이고 자연스럽게 나타냅니다.
  revised_text: 그러나 좋은 땅에 뿌려진 이는 말씀을 듣고 깨닫는 사람입니다. 그는 참으로 열매를 맺고, 어떤 것은 백 배, 어떤 것은 육십 배, 어떤 것은 삼십 배를 냅니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘좋은 토양에’.
    reason: ‘좋은 땅’에 해당하는 그리스어는 농경 문맥에서 ‘좋은 토양’으로도 옮길 수 있습니다.
  - marker: b
    text: 직역하면 ‘하나는 백, 하나는 육십, 하나는 삼십’입니다. 문맥상 각각의 수확량을 가리킵니다.
    reason: 분배를 나타내는 그리스어 표현과 수확량이라는 문맥적 의미를 설명합니다.
  revision_rationale: 사람을 가리키는 비유적 지시를 ‘이’로 명료하게 하고, 강조의 뉘앙스를 ‘참으로’로 반영했으며, 구조상 오류인 고립된 닫는 인용부호를 삭제했습니다. 본문은 듣기, 깨닫기, 열매 맺기와 서로 다른 수확량만을 진술하며 그 이상으로 교리적 해석을 덧붙이지 않았습니다.
