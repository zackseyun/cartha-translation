  source_fidelity: ‘큰 무리’는 ὄχλοι πολλοί(많은/수많은 무리들)의 수적 강조를 충분히 드러내지 못합니다. 또한 ὥστε의 결과 관계가 더 분명히 표현되는 것이 좋습니다. 개정문은 배에 들어가 앉으신 것과 군중이 호숫가에 서 있었던 장면을 충실히 보존합니다.
