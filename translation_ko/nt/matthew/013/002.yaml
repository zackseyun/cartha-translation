    rationale: ‘모여들어서’를 사용하면 군중이 모여든 결과 예수께서 배에 올라 앉으신 흐름을 자연스럽게 나타낼 수 있습니다.
  revised_text: 많은 무리가 그분께 모여들어서, 그분께서는 배에 올라가 앉으셨고, 온 무리는 호숫가에 서 있었습니다.
