source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
  footnotes:
  - marker: a
    text: Or “yeast.” The Greek word refers to a leavening agent used in dough.
    reason: lexical_alternative
  - marker: b
    text: Greek “three seahs of flour,” a large quantity.
    reason: cultural_note
  - marker: c
    text: Or “mixed into” or “worked into”; Greek literally “hid in.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수님께서 그들에게 또 다른 비유를 말씀하셨습니다. “하늘 나라는 누룩[a]과 같습니다. 어떤 여인이 그것을 가져다가 가루 서 말[b] 속에 숨겨 두어[c], 온통 누룩이 들 때까지였습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스트.” 그리스어는 반죽을 부풀게 하는 발효제를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 “가루 사타 세 개.” 사타는 건량 단위이며, 여기서는 많은 양입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “섞어 넣어” 또는 “반죽에 넣어.” 그리스어 본문은 문자적으로 “숨겼다”입니다.
    reason: lexical_alternative
