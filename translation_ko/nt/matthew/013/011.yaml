  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 직접 발화 내용은 ὅτι로 시작하는 내용절이며, 한국어에서는 ‘…때문이다’로 끝내기보다 완결된 인용문으로 옮기는 것이 자연스럽고 정확합니다. 두 번의 완료 수동형 δέδοται는 ‘허락되었습니다/허락되지 않았습니다’로 대칭되게 보존했습니다.
  naturalness: 초안은 인용부호가 닫히지 않아 문장 구조가 불완전합니다. 또한 ‘허락되지 않았기 때문이다’는 앞선 질문이나 이유를 한국어 문맥상 명시적으로 요구하는 종결이라, 본절만으로는 어색합니다. ‘그러나’로 대조를 드러내고 완결된 합쇼체 문장으로 다듬었습니다.
  terminology: ‘하늘 나라’, ‘비밀들’, ‘허락되었습니다’를 유지했습니다. ‘비밀들’은 μυστήρια의 복수와 계시된 비밀이라는 문맥을 무리 없이 반영합니다. 수동 표현의 주체는 본문에서 명시하지 않았습니다.
