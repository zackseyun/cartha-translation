source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
  footnotes:
  - marker: a
    text: Or “the secrets of the kingdom of heaven.”
    reason: lexical_alternative
  - marker: b
    text: The passive “has been given” leaves the giver implicit; the sense is that this knowledge is granted by God.
    reason: cross_reference
translation:
  language: ko
  text: 예수님께서 그들에게 대답하여 말씀하셨습니다. “너희에게는 하늘 나라의 비밀들[a]을 아는 것이 허락되었습니다[b]. 그러나 그들에게는 허락되지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘 나라의 비밀들” 대신 “하늘 나라의 감추어진 것들”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘허락되었습니다’라는 수동 표현은 허락하신 분을 명시하지 않습니다. 문맥상 이 앎은 하나님께서 주시는 것으로 이해될 수 있으나, 본문은 그분을 직접 밝히지 않습니다.
    reason: cross_reference
