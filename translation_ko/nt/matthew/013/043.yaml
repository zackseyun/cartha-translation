  - severity: low
    issue: ‘자기들의 아버지’의 부자연스러운 소유 표현
    rationale: 원문의 αὐτῶν은 ‘그들의’로 자연스럽게 옮길 수 있습니다. ‘자기들의’는 한국어에서 반복적이고 어색하며, 여기서는 재귀성을 특별히 강조할 근거가 없습니다.
