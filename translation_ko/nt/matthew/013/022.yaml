  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
  footnotes:
  - marker: a
    text: Or 'the cares of this world.' The Greek more literally says 'the worries of this age.'
    reason: alternative_reading
  - marker: b
    text: Or 'the deceit of riches.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가시덤불 사이에 뿌려진 이는 말씀을 듣는 사람이지만, 이 시대의 염려[a]와 재물의 미혹[b]이 말씀을 질식시켜 그는 열매를 맺지 못하게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이 세상의 염려'. 그리스어는 더 직역하면 '이 시대의 염려'입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '재물의 속임'.
    reason: lexical_alternative
