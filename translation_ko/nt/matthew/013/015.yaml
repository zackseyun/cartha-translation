revisions:
- from: 이 백성의 마음이 둔해졌고, 그들이 귀로는 무겁게 들으며, 자기들의 눈을 감았으니, 이는 그들이 눈으로 보고, 귀로 듣고, 마음으로 깨닫고, 돌이켜서 내가 그들을 고치는 일이 없도록 함이다.」
  to: 이 백성의 마음이 둔해졌고[a], 그들은 귀로 듣기를 더디 하며, 자기들의 눈을 감았습니다. 이는 그들이 눈으로 보고 귀로 듣고 마음으로 깨닫고 돌이켜서[b], 내가 그들을 고치게 되는 일이 없도록 하려는 것입니다.[c]
  rationale: 원문의 인과 접속사 γάρ, 마음의 둔화, 귀의 둔한 청취, 능동적으로 눈을 감은 행위, 그리고 μήποτε 이하의 긴장된 목적절을 보존했습니다. ‘내가 그들을 고치게 되는 일이 없도록’은 ἰάσομαι의 미래형을 한국어의 자연스러운 결과 표현으로 옮기면서도, 심판과 인간 책임에 관한 신학적 긴장을 해소하거나 재해석하지 않습니다.
  reviewer_model: gpt-5.6-terra
