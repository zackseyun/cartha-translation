- from: 이는 예언자를 통해 말씀하신 것을 이루기 위함이었습니다. 「내가 비유로 내 입을 열어, 창세부터 감추어진 것을 말하리라.」
  to: 이는 예언자를 통하여 말씀하신 바가 이루어지게 하려는 것이었습니다. 말씀하시기를, “내가 비유로 내 입을 열어, 기초가 놓인 때부터 감추어진 것들을 말하리라.”[a]
  rationale: 원문 우선 원칙에 따라 ἀπὸ καταβολῆς에 없는 ‘세상’ 또는 ‘창세’의 명시를 본문에 보태지 않았습니다. 동시에 한국어 문장으로서 자연스럽도록 ‘기초가 놓인 때부터’로 옮겼고, 널리 알려진 더 긴 사본 읽기는 해당 위치의 각주에 제시했습니다. 또한 λέγοντος를 ‘말씀하시기를’으로 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:20:21Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ἀπὸ καταβολῆς를 ‘창세부터’로 옮겨 원문에 없는 창조 개념을 다소 구체화하며, 인용을 도입하는 λέγοντος(‘말씀하시기를’)를 명시적으로 반영하지 않습니다. 개정문은 ‘기초가 놓인 때부터’로 원문의 생략된 목적어를 보존하고, 더 긴 사본 읽기를 각주로 처리합니다.
  naturalness: ‘예언자를 통하여 말씀하신 바’와 ‘말씀하시기를’은 현대 표준어의 격식 있는 성경 문체에서 자연스럽습니다. ‘기초가 놓인 때부터’는 시적 인용문 안에서 자연스러우며, 원문의 압축된 표현도 보존합니다.
  terminology: ‘비유’, ‘예언자’, ‘이루어지다’는 마태복음의 관용적 용례와 잘 맞습니다. ‘말씀하신 바’는 수동형 τὸ ῥηθέν의 한국어 성경식 관용 표현으로 적절하며, 발화자를 원문 이상으로 특정하지 않습니다.
