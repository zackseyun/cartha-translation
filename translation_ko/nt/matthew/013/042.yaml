  - severity: medium
    issue: 둘째 절의 존재 구문이 행위 구문으로 바뀜
    rationale: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς는 문자적으로 ‘거기에는 울음과 이를 갊이 있을 것이다’입니다. ‘그곳에서 … 갈 것이다’는 문맥상 가능한 함의이나 원문의 구문과 강조를 약화합니다.
