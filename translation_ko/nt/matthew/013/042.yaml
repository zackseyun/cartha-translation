  source_fidelity: 첫 문장은 βαλοῦσιν αὐτούς의 미래 능동 의미와 κάμινον τοῦ πυρός의 비유를 대체로 충실히 옮겼습니다. 그러나 둘째 문장의 ἔσται는 ‘그들이 울고 이를 갈 것이다’라는 행위 주체를 명시하기보다, 그곳에 ‘울음과 이를 갊이 있을 것’이라는 존재 구문입니다. 이를 보존하는 편이 더 정확합니다.
  naturalness: ‘던질 것이다’는 현대 표준어이나, 지정된 합쇼체에는 ‘던질 것입니다’가 적절합니다. ‘거기에는 … 일이 있을 것입니다’는 한국어에서 원문의 정형적 심판 표현을 자연스럽게 유지합니다.
  terminology: ‘불 풀무’는 κάμινος τοῦ πυρός에 대한 확립되고 자연스러운 번역이며, 종말론적 이미지를 ‘지옥’ 등으로 해석하여 한정하지 않습니다. ‘울며 이를 가는 일’은 κλαυθμός καὶ βρυγμὸς τῶν ὀδόντων의 두 요소를 보존합니다.
  issues:
