  verdict: revise
  source_fidelity: 원문의 ‘사람들이 자는 동안’, ‘그의 원수’, ‘밀 사이에 가라지를 뿌리고 떠났다’는 의미를 충실히 옮겼습니다. 다만 ἀπῆλθεν은 단순히 ‘떠났다’라는 뜻이므로 ‘가 버렸다’의 완료·유감 뉘앙스는 피하는 것이 좋습니다.
  naturalness: ‘자고 있는 동안에’와 ‘밀 가운데 가라지를 뿌리고’는 자연스럽습니다. 다만 목표 문체인 현대 합쇼체에 맞추어 문장 종결을 ‘-습니다’로 해야 합니다.
  terminology: ‘가라지’는 ζιζάνια의 전통적이고 널리 이해되는 번역으로 적절합니다. ‘사람들’은 τοὺς ἀνθρώπους에 충실하며, 영어 감사본의 ‘men’보다 성별을 한정하지 않습니다.
  issues:
