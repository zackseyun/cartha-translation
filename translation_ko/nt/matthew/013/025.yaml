    rationale: ‘가 버렸다’는 해라체 종결입니다. 지정된 현대 정중 문체에는 ‘떠났습니다’가 적합합니다.
  - severity: low
    issue: ‘가 버렸다’가 원문보다 추가 뉘앙스를 가짐
    rationale: ἀπῆλθεν은 ‘떠났다/가버렸다’ 중 전자의 단순 이동 의미에 가깝습니다. ‘버리다’는 완료성 또는 화자의 정서적 뉘앙스를 더할 수 있습니다.
  revised_text: 그러나 사람들이 자고 있는 동안에 그의 원수가 와서 밀 가운데 가라지를 뿌리고 떠났습니다.
