    text: 또는 ‘독보리’. 그리스어 ‘지자니아’는 초기에는 밀과 닮은 해로운 잡초를 가리키며, 아마도 독보리일 것입니다.
    reason: ζιζάνια의 전통적 번역인 ‘가라지’를 유지하면서, 어휘의 가능한 구체적 식물 지시와 일반적 의미를 밝혀 줍니다.
