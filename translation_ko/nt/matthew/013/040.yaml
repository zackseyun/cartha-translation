review_pass:
  verdict: revise
  source_fidelity: 초안은 비교 구조와 불에 태워지는 심판의 비유를 대체로 전달하지만, τοῦ αἰῶνος를 ‘세대’로 옮긴 것은 ‘generation’으로 이해될 수 있어 αἰών의 ‘시대/세상’ 의미를 충분히 반영하지 못합니다.
  naturalness: ‘세대의 마침’은 현대 표준어에서 부자연스럽고 의미도 불명확합니다. 합쇼체 종결도 ‘것이다’보다 ‘것입니다’가 목표 문체에 맞습니다.
  terminology: ζιζάνια는 현대적으로 ‘잡초들’로 옮기고 전통적 표현 ‘가라지’를 각주로 제시하는 것이 적절합니다. αἰών은 본문에서 ‘시대’로 옮기며, 전통적 ‘세상 끝’은 대안으로 각주 처리합니다.
  issues:
  - severity: high
    issue: ‘세대의 마침’
    rationale: τοῦ αἰῶνος는 여기서 한 세대(generation)가 아니라 시대(age)의 종결을 가리킵니다. 또한 ‘세대의 마침’은 현대 한국어에서 자연스럽지 않습니다.
  - severity: medium
    issue: 합쇼체 종결 불일치
    rationale: ‘될 것이다’는 평서체이므로, 지정된 현대 격식체 합쇼체에 맞게 ‘될 것입니다’로 고쳐야 합니다.
  - severity: low
    issue: ‘가라지’에 대한 어휘 안내 부재
    rationale: 전통적 성경 용어인 ‘가라지’는 유지 가능한 대안이지만 현대 독자에게는 ‘잡초들’이 더 명확합니다. 각주로 전통 용례를 안내하면 정확성과 접근성을 함께 확보합니다.
  revised_text: 그러므로 잡초들이 모아져 불에 태워지는 것처럼, 시대의 끝[a]에도 그렇게 될 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘세상 끝’. 그리스어는 ‘시대의 끝’을 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: ‘잡초들’은 전통적으로 ‘가라지’로 옮겼습니다. 그리스어는 해로운 잡초, 아마도 독보리를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: ‘세대의 마침’을 ‘시대의 끝’으로 바꾸어 αἰών의 시간적·종말론적 의미를 보존하고, 자연스러운 현대 한국어 표현으로 다듬었습니다. 비교 표현과 수동태, 불의 이미지를 유지했으며, 합쇼체 종결로 통일했습니다. ‘잡초들’ 관련 보충 각주는 해당 단어에 직접 표지할 수 있도록 본문 표지를 포함해 ‘잡초들[a]’ 및 ‘시대의 끝[b]’으로 조정하는 것이 바람직합니다.
