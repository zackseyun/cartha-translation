  verdict: revise
  source_fidelity: ‘세대의 마침’은 τοῦ αἰῶνος의 뜻에 맞지 않습니다. αἰών은 여기서 한 ‘세대’가 아니라 ‘시대/세상 시대’를 가리키므로, 이를 ‘시대가 끝날 때’로 바로잡아야 합니다. 나머지 비교 구조와 불에 태움의 이미지는 원문에 충실합니다.
  naturalness: ‘가라지가 모아져 불에 태워지듯이’는 문어적이지만 현대 한국어 성경 문체에서 자연스럽습니다. ‘시대가 끝날 때에도 그렇게 될 것입니다’는 합쇼체로 자연스럽고 문맥상 명료합니다.
  terminology: ‘가라지’는 ζιζάνια에 대한 한국어 성경의 정착된 표현이며, 문맥상 유지할 수 있습니다. αἰών은 ‘세대’가 아니라 ‘시대’로 옮겨야 합니다. ‘시대가 끝날 때’는 종말의 시점을 나타내되 특정 종말론 체계를 덧붙이지 않습니다.
  issues:
  - severity: high
    issue: ‘세대의 마침’
    rationale: 그리스어 αἰών은 이 문맥에서 ‘세대’(generation)가 아니라 ‘시대’(age)를 뜻합니다. 또한 ‘마침’보다 ‘끝’ 또는 ‘완성’이 συντέλεια의 종결·완결 의미를 더 자연스럽게 전달합니다.
  revised_text: 그러므로 가라지가 모아져 불에 태워지듯이, 시대가 끝날 때에도 그렇게 될 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘세상의 끝날 때’. 그리스어는 ‘시대의 끝’이라는 뜻입니다.
    reason: alternative_reading
  revision_rationale: αἰών의 의미를 ‘세대’에서 ‘시대’로 수정하고, ἐν τῇ συντελείᾳ를 자연스러운 한국어로 ‘시대가 끝날 때’로 옮겼습니다. 원문의 비교 표현, 수동적 처리 이미지, 미래 진술은 유지했습니다.
