    reason: lexical_alternative
translation:
  language: ko
  text: 그날 예수님께서는 집에서 나와 바다 곁에 앉아 계셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로 그날’. 앞선 문맥과의 연속성을 강조하는 것으로 이해할 경우 가능합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘바닷가에’. 그리스어 표현은 바다 가까이에 있음을 나타내며, 해안선에서의 정확한 거리는 특정하지 않습니다.
