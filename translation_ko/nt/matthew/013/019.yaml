  source_fidelity: 첫 문장은 대체로 원문의 의미를 충실히 옮겼고, ‘악한 자’는 ὁ πονηρός의 인격적 용법을 적절히 보존합니다. 그러나 마지막의 ‘이것이 길가에 뿌려진 것이다’는 남성 단수 분사 ὁ ... σπαρείς가 가리키는 사람을 ‘것’으로 바꾸어 원문의 비유 해석 대상(말씀을 듣는 사람)을 약화합니다.
  naturalness: ‘그 나라의 말씀’은 한국어에서 지시 대상이 불분명하고 다소 어색합니다. 문맥상 왕국/하나님 나라를 가리키는 표현을 명시하는 편이 자연스럽습니다. ‘그 사람의 마음’은 대표적 단수인 αὐτοῦ를 자연스러운 현대 한국어로 드러냅니다.
  terminology: βασιλεία는 이 문맥에서 ‘하나님 나라’로 옮겨 신학적·문맥적 지시를 자연스럽게 전달합니다. λόγος는 ‘말씀’, ὁ πονηρός는 ‘악한 자’, καρδία는 ‘마음’으로 유지합니다.
  issues:
  - severity: medium
    issue: ‘그 나라의 말씀’의 지시 대상이 불명확함
    rationale: τῆς βασιλείας는 이 비유 문맥의 하나님 나라를 가리키며, 독립된 절로 제시될 때 ‘그 나라’는 선행 지시어 없이 어색하고 의미가 불투명합니다.
  - severity: high
    issue: 마지막 절이 사람을 ‘것’으로 바꿈
    rationale: ὁ παρὰ τὴν ὁδὸν σπαρείς는 비유적으로 씨 뿌려진 사람, 곧 길가에 해당하는 사람을 가리킵니다. ‘것’은 원문의 남성 인칭 지시와 해석적 기능을 보존하지 못합니다.
  revised_text: 누구든지 하나님 나라의 말씀을 듣고도 깨닫지 못하면, 악한 자가 와서 그 사람의 마음에 뿌려진 것을 빼앗아 갑니다. 이것은 길가에 뿌려진 사람입니다.
