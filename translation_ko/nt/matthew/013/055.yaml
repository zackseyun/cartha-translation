  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
  footnotes:
  - marker: a
    text: Or 'relatives' or 'kinsmen' for 'brothers'; the Greek word ordinarily means 'brothers,' but some understand it more broadly in this context.
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read 'Joses' instead of 'Joseph.'
    reason: textual_variant
translation:
  language: ko
  text: 이 사람은 그 목수의 아들이 아닙니까? 그의 어머니는 마리아[b]라고 불리고, 그의 형제들[a]은 야고보와 요셉과 시몬과 유다가 아닙니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘친족들’. 그리스어는 보통 ‘형제들’을 뜻하지만, 이 문맥에서는 더 넓은 친족 관계를 가리킨다고 이해하는 이들도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본에는 ‘요셉’ 대신 ‘요세’로 되어 있습니다.
