  source_fidelity: 원문의 Ταῦτα πάντα는 ‘이 모든 것을’, ἐν παραβολαῖς는 ‘비유로’, τοῖς ὄχλοις는 ‘무리에게’로 충실히 옮겼습니다. δεύτε 절의 χωρὶς παραβολῆς οὐδὲν ἐλάλει αὐτοῖς도 ‘비유 없이는 그들에게 아무것도 말씀하지 않으셨습니다’로 자연스럽고 정확하게 반영합니다. 한국어 과거 부정 표현은 여기서 그리스어 미완료의 반복적·관습적 뉘앙스를 문맥상 무리 없이 전달합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘비유 없이는’은 단수 παραβολῆς를 한국어의 일반적 단수로 매끄럽게 살리며, 불필요하게 ‘비유들’이라고 복수화하지 않습니다.
  terminology: ‘예수님’, ‘무리’, ‘비유’, ‘말씀하시다’는 한국어 성경 문체와 현대 공적 존대 문체에 잘 맞습니다. 교파적 해석을 덧붙이지 않았습니다.
