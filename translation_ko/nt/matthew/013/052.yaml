- from: 예수님이 그들에게 말씀하셨습니다. 「그러므로 하늘 나라의 제자가 된 모든 서기관은, 자기 곳간에서 새것과 옛것을 내는 집 주인과 같다.」
  to: 예수님이 그들에게 말씀하셨습니다. “그러므로 하늘 나라의 제자가 된 모든 서기관은 자기 곳간에서 새것과 옛것을 꺼내는 집의 주인과 같습니다.”
  rationale: The revision resolves the required honorific-register inconsistency and makes the household-treasury action more idiomatic. “하늘 나라의 제자가 된” is retained because μαθητευθείς can denote becoming a disciple; in this context it preserves the Greek participle’s discipleship sense without forcing a more specific account of how the scribe was formed.
