review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential connector, the image of a scribe formed as a disciple in relation to the kingdom of heaven, the household master, the treasury/store, and the contrast of new and old. Naming Jesus is contextually correct, though the Greek verse itself uses only “he.”
  naturalness: The wording is generally natural Standard Korean. However, the final predicate “같다” breaks the required modern formal-polite 합쇼체 after “말씀하셨습니다”; it should be “같습니다.” “꺼내는” is also a more idiomatic rendering than “내는” for drawing items from a store.
  terminology: “하늘 나라,” “서기관,” and “제자” are appropriate. “곳간” suitably conveys the storage sense of θησαυρός while retaining the metaphor’s domestic setting. No doctrinal narrowing is introduced.
  issues:
  - severity: low
    issue: Register inconsistency in the final predicate
    rationale: The translation begins in 합쇼체 (“말씀하셨습니다”) but ends with the plain-form copula “같다.” The required target register calls for “같습니다.”
  - severity: low
    issue: Verb choice for ἐκβάλλει
    rationale: In this context ἐκβάλλει means bringing items out from storage. “꺼내는” more naturally expresses this than the broader “내는,” without changing the sense.
  revised_text: 예수님이 그들에게 말씀하셨습니다. “그러므로 하늘 나라의 제자가 된 모든 서기관은 자기 곳간에서 새것과 옛것을 꺼내는 집의 주인과 같습니다.”
  revised_footnotes: []
  revision_rationale: The revision resolves the required honorific-register inconsistency and makes the household-treasury action more idiomatic. “하늘 나라의 제자가 된” is retained because μαθητευθείς can denote becoming a disciple; in this context it preserves the Greek participle’s discipleship sense without forcing a more specific account of how the scribe was formed.
