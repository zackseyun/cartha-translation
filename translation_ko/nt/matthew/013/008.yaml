    rationale: ‘어떤 것은 … 배가 되었다’는 씨앗 자체가 그렇게 되었다는 인상을 줄 수 있습니다. ‘그중 어떤 것은 … 배였습니다’로 결실량의 차이를 자연스럽게 표현할 수 있습니다.
