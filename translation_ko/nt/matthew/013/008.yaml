  naturalness: 초안의 서술 종결(‘맺었으니’, ‘되었다’)은 요청된 현대 표준 합쇼체와 맞지 않습니다. ‘씨앗들’과 ‘그중 어떤 것은’은 자연스럽고, 수확량의 분배 관계도 명료하게 합니다.
  terminology: ‘좋은 땅’은 농경 비유에서는 가능하지만 ‘좋은 토양’이 γῆ의 농업적 의미를 더 정확하고 현대적으로 전달합니다. ‘열매를 맺었습니다’는 καρπόν을 자연스럽게 보존합니다.
