  source_fidelity: 그리스어의 화자와 대화 구조는 대체로 반영했으나, Ἐχθρὸς ἄνθρωπος를 옮긴 ‘원수인 사람’은 한국어에서 부자연스럽습니다. 또한 συλλέξωμεν은 단순히 ‘모으다/거두다’이지 ‘뽑다’를 명시하지 않으므로 ‘뽑아 모으다’는 의미를 다소 보탭니다.
