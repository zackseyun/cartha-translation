  terminology: δοῦλοι는 비유의 주인에게 속한 종속적 인물을 가리키므로 본문에서는 전통적이고 자연스러운 ‘종들’로 옮기고, ‘노예들’이라는 가능한 번역을 각주에 제시했습니다. ‘원수’는 Ἐχθρὸς ἄνθρωπος가 가리키는 개별 적대자를 한국어 관용에 맞게 충분히 나타냅니다.
  issues:
