review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ‘예수님으로 인해 걸려 넘어졌습니다’는 ἐσκανδαλίζοντο ἐν αὐτῷ의 비유를 대체로 보존하지만, 현대 한국어에서는 ‘예수님에게 걸려 넘어졌습니다’가 원문의 대인 관계적 용법을 더 직접적으로 반영합니다. 속담의 논리적 형태도 ‘존경받지 못하는 곳이 없다’보다 원문의 ‘…외에는 없다’ 구문으로 명료하게 옮기는 것이 좋습니다.
  naturalness: ‘자기 고향과 자기 집을 제외하고는 존경받지 못하는 곳이 없다’는 부정 표현이 겹쳐 다소 무겁고, ‘자기 집’은 건물로 이해되기 쉽습니다. ‘자기 고향과 자기 집안 외에는 존경받지 못하는 곳이 없습니다’가 현대 표준 한국어에서 자연스럽고 의미도 분명합니다.
  terminology: ‘예언자’는 προφήτης의 적절한 표준 번역입니다. οἰκίᾳ αὐτοῦ는 이 문맥에서 건물보다 가정·가족 범위를 가리킬 수 있으므로 ‘자기 집안’으로 옮기고 각주에서 ‘자기 집’ 가능성을 밝혀 둡니다.
  issues:
  - severity: medium
    issue: ‘자기 집’이 οἰκία의 사회적 의미를 충분히 드러내지 못함
    rationale: οἰκία는 집 건물뿐 아니라 household/family circle을 뜻할 수 있으며, 이 속담에서는 가까운 가정·가족 범위가 자연스럽습니다.
  - severity: low
    issue: 속담의 부정-예외 구문이 한국어에서 다소 난삽함
    rationale: 원문의 ‘οὐκ ... εἰ μὴ’ 구조를 ‘…외에는 … 없습니다’로 옮기면 원문의 수사적 형태와 뜻을 모두 더 명료하게 보존합니다.
  revised_text: 그들은 예수님에게 걸려 넘어졌습니다. 그러나 예수님께서 그들에게 말씀하셨습니다. “예언자가 존경을 받지 못하는 곳은 자기 고향과 자기 집안 외에는 없습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “그들은 예수님 때문에 불쾌해했습니다.” 직역하면 “그들은 예수님 안에서 걸려 넘어졌습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “고향 땅” 또는 “출신지.”
    reason: lexical_alternative
  - marker: c
    text: 또는 “자기 집.” 그리스어는 집 건물 또는 집안·가족의 범위를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: ἐσκανδαλίζοντο ἐν αὐτῷ의 비유적 ‘걸려 넘어짐’을 본문에 유지하되, 한국어에서 사람을 대상으로 하는 관계를 분명히 하기 위해 ‘예수님에게’를 사용했습니다. ‘그러나’는 δέ의 완만한 대조를 반영합니다. 속담은 원문의 예외 구문을 자연스러운 한국어로 보존했고, πατρίς와 οἰκία의 의미 범위는 각주로 제시했습니다.
