  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
  footnotes:
  - marker: a
    text: Or “they were offended by him”; literally, “they were caused to stumble in him.”
    reason: lexical_alternative
  - marker: b
    text: Or “native place” or “homeland.”
    reason: lexical_alternative
  - marker: c
    text: Or “in his own house.” The Greek can refer to a house or a household/family circle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 예수님으로 인해 걸려 넘어졌습니다. 그러나 예수님이 그들에게 말씀하셨습니다. 「예언자가 자기 고향과 자기 집을 제외하고는 존경받지 못하는 곳이 없다.」
  philosophy: optimal-equivalence
