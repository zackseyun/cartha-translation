review_pass:
  verdict: revise
  source_fidelity: The draft renders ἐσκανδαλίζοντο ἐν αὐτῷ as literal physical stumbling ('걸려 넘어졌습니다'), which is misleading in this context. It denotes taking offense at or being offended by Jesus. The proverb's exception sense is otherwise broadly represented, but a more natural Korean formulation can retain it clearly.
  naturalness: The literal '예수님으로 인해 걸려 넘어졌습니다' is unnatural and obscures the intended figurative meaning. The revised wording is idiomatic standard Korean in formal-polite narrative style.
  terminology: '''예언자'' appropriately renders προφήτης without importing a particular denominational convention. ''존경을 받습니다'' conveys the honor/shame sense of ἄτιμος, and ''자기 집'' preserves the Greek term''s house/household range with a note.'
  issues:
  - severity: medium
    issue: Figurative idiom rendered as literal stumbling
    rationale: ἐσκανδαλίζοντο ἐν αὐτῷ refers here to the people's taking offense at Jesus, not to physically stumbling because of him.
  - severity: low
    issue: No note preserves the lexical ambiguity of the offense idiom and οἰκία
    rationale: Brief notes allow the Korean to read naturally while documenting the Greek's literal idiom and the possible 'house/household' sense.
  revised_text: 그들은 예수님을 못마땅하게 여겼습니다[a]. 그러나 예수님께서 그들에게 말씀하셨습니다. “예언자는 자기 고향[b]과 자기 집[c] 외에서는 존경을 받습니다.”
  revised_footnotes:
