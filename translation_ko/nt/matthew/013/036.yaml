  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
  footnotes:
  - marker: a
    text: Or “the parable of the tares of the field”; the Greek term may refer more specifically to darnel, a weed resembling wheat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예수님께서는 무리를 떠나 그 집으로 들어가셨습니다. 제자들이 예수님께 다가와 말했습니다. “밭의 가라지[a] 비유를 저희에게 설명해 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
