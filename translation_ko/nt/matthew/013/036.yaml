  to: 그때 예수님께서는 무리를 떠나 그 집으로 들어가셨습니다. 제자들이 예수님께 다가와 말했습니다. “밭의 가라지[a] 비유를 저희에게 설명해 주십시오.”
  rationale: 원문의 ἀφεὶς를 ‘무리를 떠나’로 바로잡아 예수님이 무리를 해산시키셨다는 추가 의미를 제거했습니다. 정관사 τὴν οἰκίαν은 문맥상 알려진 장소를 가리키므로 ‘그 집’으로 옮겼습니다. 식물명은 본문에서 통용되는 ‘가라지’를 유지하되, 구체적 식물 동정의 불확실성은 각주에 보존했습니다.
