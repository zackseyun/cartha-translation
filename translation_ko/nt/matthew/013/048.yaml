    rationale: ἣν은 앞 절의 그물을 가리키므로 ‘그물이 가득 차자’라고 밝혀 주는 것이 자연스럽고 정확합니다.
  - severity: low
    issue: ‘좋은 것은’과 ‘썩은 것은’에 물고기라는 지시 대상이 충분히 드러나지 않습니다.
    rationale: 원문은 중성 복수 형용사를 명사적으로 사용하지만, 이는 그물 안의 물고기를 가리킵니다. ‘좋은 물고기들은’이라고 한쪽을 보충하면 문맥이 명료해지고, 다른 쪽은 ‘상한 것들’로 유지할 수 있습니다.
  revised_text: 그물이 가득 차자, 그들은 그것을 물가로 끌어올려 앉아서 좋은 물고기들은 그릇들에 모으고, 상한 것들은 밖으로 버렸습니다.
  revised_footnotes:
