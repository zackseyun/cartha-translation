  source_fidelity: 초안은 그물과 물고기를 문맥상 자연스럽게 보충하고, 가득 참·끌어올림·앉음·분류·버림의 순서를 대체로 잘 보존합니다. 다만 τὰ καλὰ와 τὰ σαπρά가 물고기를 가리킨다는 점을 한국어에서 분명히 하는 편이 정확하며, ἄγγη의 복수와 일반적 용기라는 뜻도 반영하는 것이 좋습니다.
  naturalness: ‘그것이’는 바로 앞 절의 ‘그물’을 받지만 한국어에서는 지시 대상이 다소 흐립니다. ‘그물이 가득 차자’로 명시하고, 서술을 합쇼체 종결로 정리하면 현대 표준 한국어 성경 문체로 더 자연스럽습니다.
  terminology: ‘물가’는 αἰγιαλός(해안/물가)를 과도하게 특정하지 않습니다. ‘그릇들’은 ἄγγη의 일반적인 ‘용기들’을 적절히 옮기며, ‘상한 것들’은 σαπρά의 썩은/상한/쓸모없는 물고기라는 구체적 이미지를 자연스럽게 보존합니다.
  issues:
