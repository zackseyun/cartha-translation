  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
  footnotes:
  - marker: a
    text: Or 'vessels.' The Greek term is a general word for containers, not necessarily baskets.
    reason: lexical_alternative
  - marker: b
    text: Or 'the bad ones.' The Greek word can mean 'rotten,' 'spoiled,' or more generally 'worthless.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그물이 가득 차자, 사람들이 그것을 해안으로 끌어올린 뒤 앉아서 좋은 물고기는 그릇들[a]에 모으고, 상한 물고기는[b] 밖으로 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용기들’. 그리스어는 바구니에 한정되지 않는 일반적인 용기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나쁜 물고기들’ 또는 ‘쓸모없는 물고기들’. 그리스어는 ‘상한’, ‘썩은’, 또는 더 넓게 ‘쓸모없는’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
