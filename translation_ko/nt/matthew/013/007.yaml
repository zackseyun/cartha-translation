    reason: lexical_alternative
  revision_rationale: 원문의 순차적 연결과 복수의 씨를 분명히 하되, ‘가시덤불 사이에’라는 자연스러운 농경 표현에는 원문의 문자적 전치사 의미를 각주로 보완했습니다. ‘막아 버렸다’를 ‘질식시켰습니다’로 고쳐 πνίγω의 의미와 비유의 강도를 보존했습니다.
