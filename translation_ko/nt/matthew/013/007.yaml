  source_fidelity: 초안의 ‘가시덤불 사이에’는 농경 문맥상 가능한 의역이지만, ἐπὶ τὰς ἀκάνθας의 문자적 ‘가시덤불 위에/위로’를 각주로 밝혀야 합니다. 또한 ἔπνιξαν은 단순히 ‘막아 버렸다’보다 ‘질식시켰습니다’가 직접적이고 충실합니다.
  naturalness: ‘또 다른 씨들은 … 떨어졌고, 가시덤불이 자라나 그것들을 질식시켰습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 비유의 생생한 농경 이미지를 보존합니다.
  terminology: ἄκανθαι는 문맥상 ‘가시덤불’로 일관되게 옮겼습니다. ἔπνιξαν의 비유적이면서도 강한 뜻은 ‘질식시켰습니다’로 보존했습니다.
  issues:
  - severity: medium
    issue: ‘막아 버렸다’는 ἔπνιξαν의 의미를 약화합니다.
    rationale: πνίγω는 ‘질식시키다, 숨 막히게 하다’라는 강한 표현입니다. 단순한 성장 저해로 옮기면 원문의 비유적 강도가 줄어듭니다.
  - severity: low
    issue: ‘가시덤불 사이에’는 해석적으로 자연스럽지만 원문의 전치사 표현에 대한 각주가 없습니다.
    rationale: ἐπί와 대격의 기본 뜻은 ‘위에/위로’입니다. 농경 문맥의 자연스러운 번역을 유지할 수 있으나, 문자적 표현을 각주로 제시하는 것이 최적 등가 원칙에 맞습니다.
  revised_text: 또 다른 씨들은 가시덤불 사이에 떨어졌고, 가시덤불이 자라나 그것들을 질식시켰습니다.
  revised_footnotes:
