  source_fidelity: καὶ προσελθόντες는 ‘제자들이 다가와’로, 예수님께 가까이 온 뒤 말한 선행 동작을 자연스럽게 반영합니다. εἶπαν αὐτῷ, Διὰ τί, ἐν παραβολαῖς λαλεῖς αὐτοῖς도 각각 ‘예수님께 말했습니다’, ‘어찌하여’, ‘그들에게 비유로 말씀하십니까’로 충실히 옮겼습니다. ‘비유로’는 한국어에서 복수 παραβολαῖς의 방식·매체 의미를 자연스럽게 나타냅니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽고, 예수님을 가리키는 존칭 ‘말씀하십니까’도 한국어 성경 문맥에 적절합니다. ‘어찌하여’는 다소 문어적이지만 현대 성경 문체 안에서 이해 가능하며 격식 있는 질문에 잘 맞습니다.
  terminology: ‘제자들’, ‘예수님’, ‘비유’, ‘말씀하십니까’는 일관되고 적절한 성경 용어입니다. 원문에 명시되지 않은 ‘그의’를 덧붙이지 않고 ‘제자들’로 둔 점도 좋습니다.
