  terminology: ‘하늘 나라’는 마태복음의 특징적인 표현을 보존합니다. ‘그물’은 σαγήνη의 구체성(큰 끌그물)을 완전히 드러내지는 않지만 본문에서 자연스럽고 충분히 정확합니다.
