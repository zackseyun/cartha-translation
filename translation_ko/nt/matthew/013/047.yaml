  source_fidelity: 원문의 Πάλιν은 ‘또’로, ἡ βασιλεία τῶν οὐρανῶν은 ‘하늘 나라’로 옮겼습니다. σαγήνη가 바다에 ‘던져진’ 뒤 온갖 종류를 ‘모으는’ 현재적 기능을 나타내므로, 초안의 과거형 ‘모은’은 현재형으로 바로잡았습니다. ‘물고기’는 문맥상 함의되지만 그리스어에 명시되지 않았으므로 본문에는 보충하지 않았습니다.
