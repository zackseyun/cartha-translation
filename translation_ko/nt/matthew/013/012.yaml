review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two contrasting outcomes and the emphatic ‘even’ in ‘가진 것마저.’ However, it omits γάρ (‘for’), and ‘가지지 못한’ can suggest inability to possess rather than the simple negated possession of οὐκ ἔχει.
  naturalness: The phrasing is generally clear, but ‘가지지 않은 사람’ is more natural and semantically direct here than ‘가지지 못한 자.’ The revised wording uses modern formal-polite declarative style consistently.
  terminology: No specialized theological term is introduced by the Greek, and the implicit object of ‘has’ is appropriately left unspecified. ‘더’ is a reasonable contextual supplementation, consistent with the English audit trail and the following promise of abundance.
  issues:
  - severity: medium
    issue: γάρ is not represented.
    rationale: The Greek begins with an explanatory connective (‘for’). Rendering it as ‘왜냐하면’ preserves the verse’s connection to the preceding saying without adding interpretation.
  - severity: medium
    issue: ‘가지지 못한’ may imply inability.
    rationale: οὐκ ἔχει simply means ‘does not have’; ‘가지지 않은’ more directly preserves that negated possession.
  - severity: low
    issue: Register is not fully aligned with the stated 합쇼체 target.
    rationale: ‘될 것이다/빼앗길 것이다’ is formal written style, but ‘될 것입니다/빼앗길 것입니다’ explicitly conforms to modern formal-polite 합쇼체.
  revised_text: 왜냐하면 가진 사람에게는 더 주어져 풍성하게 될 것입니다. 그러나 가지지 않은 사람에게서는 가진 것마저 빼앗길 것입니다.
