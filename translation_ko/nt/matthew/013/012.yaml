  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
  footnotes:
  - marker: a
    text: Or, more literally, 'will be given to him, and he will abound.'
    reason: lexical_alternative
  - marker: b
    text: 'The Greek uses masculine singular pronouns generically: ''to him'' ... ''from him.'''
    reason: cultural_note
