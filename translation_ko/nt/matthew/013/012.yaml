revisions:
- from: 가진 자에게는 더 주어져 풍성하게 될 것이나, 가지지 못한 자에게서는 가진 것마저 빼앗길 것이다.
  to: 왜냐하면 가진 사람에게는 더 주어져 풍성하게 될 것입니다. 그러나 가지지 않은 사람에게서는 가진 것마저 빼앗길 것입니다.
  rationale: The revision restores the explanatory force of γάρ, replaces wording that can imply inability with a direct expression of lacking possession, and regularizes the declared register to 합쇼체. It retains the source’s unspecified object and the ascensive force of καί (‘마저’).
