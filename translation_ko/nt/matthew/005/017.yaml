  terminology: “율법이나 예언서” appropriately renders the scriptural-corpus sense of τὸν νόμον ἢ τοὺς προφήτας. “폐하다” appropriately conveys καταλύω in this context. “성취하다” is suitable for πληρόω; an explanatory note preserves the possible nuances of completion and full expression.
