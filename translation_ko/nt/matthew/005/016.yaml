  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 τὰ καλὰ ἔργα는 지속적 품행을 뜻할 수 있는 ‘선한 행실’보다 구체적인 ‘선한 행위’가 더 직접적입니다. 또한 τοῖς οὐρανοῖς의 복수형은 한국어 본문에서 관용적으로 ‘하늘에’라고 옮기되 주석으로 밝혀 두는 것이 적절합니다.
  naturalness: 합쇼체와 문장 흐름은 자연스럽습니다. ‘빛을 … 비추십시오’는 한국어에서 자연스러운 명령형이며, 뒤의 ‘그리하여’는 ὅπως가 나타내는 목적을 분명히 드러냅니다.
  terminology: ‘영광을 돌리다’는 δοξάζω에 대한 확립되고 자연스러운 번역입니다. ‘여러분의 아버지’도 원문의 관계적 표현을 보존합니다. ‘선한 행위’는 καλὰ ἔργα에 더 밀착합니다.
  issues:
