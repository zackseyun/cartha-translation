    rationale: 원문의 τοῖς οὐρανοῖς는 복수형입니다. 본문에서 ‘하늘에’라는 자연스러운 한국어 관용을 유지할 수 있으나, 원문 형태는 주석으로 표시하는 것이 최적 등가 원칙에 부합합니다.
