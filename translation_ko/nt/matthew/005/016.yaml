    issue: ‘선한 행실’의 의미 범위
    rationale: ‘행실’은 전반적 처신·품행을 가리키기 쉬운 반면, ἔργα는 여기서 사람들이 볼 수 있는 행위들 또는 선한 일을 뜻합니다. ‘선한 행위’가 더 정확합니다.
  - severity: low
