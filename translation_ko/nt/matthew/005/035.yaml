source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
  footnotes:
  - marker: a
    text: Or 'by Jerusalem.' The Greek uses 'toward/into Jerusalem' (εἰς Ἱεροσόλυμα), which may function idiomatically in oath language.
    reason: lexical_alternative
  - marker: b
    text: 'An allusion to Isaiah 66:1: ''the earth is the footstool of my feet.'''
    reason: cross_reference
  - marker: c
    text: An allusion to Psalm 48:2, where Jerusalem is called 'the city of the great King.'
    reason: cross_reference
  - marker: d
    text: Or 'toward Jerusalem'.
    reason: previous_rendering
translation:
  language: ko
  text: 땅을 두고도 맹세하지 마십시오. 땅은 그분의 발받침[a]이기 때문입니다. 예루살렘을 두고도 맹세하지 마십시오[b]. 예루살렘은 위대한 왕의 도성이기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이사야 66:1을 암시합니다. “땅은 내 발의 발받침이다.”
    reason: cross_reference
  - marker: b
    text: 그리스어는 직역하면 ‘예루살렘을 향하여/안으로’라는 뜻의 εἰς를 사용합니다. 이 문맥에서는 맹세 표현에서 관용적으로 ‘예루살렘을 두고’라는 뜻으로 쓰인 것으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 시편 48:2에서 예루살렘은 ‘큰 왕의 도성’으로 불립니다.
    reason: cross_reference
