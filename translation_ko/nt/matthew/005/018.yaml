source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
  footnotes:
  - marker: a
    text: 'Or: "one jot" for "one iota"; the Greek names the smallest letter.'
    reason: lexical_alternative
  - marker: b
    text: 'Or: "one tittle" for "one stroke"; that is, a tiny written mark distinguishing letters.'
    reason: lexical_alternative
  - marker: c
    text: 'Or: "until all is accomplished" / "until everything comes to pass."'
    reason: alternative_reading
translation:
  language: ko
  text: 왜냐하면 내가 진실로 여러분에게 말합니다. 하늘과 땅이 없어지기 전에는, 모든 것이 이루어질 때까지 율법에서 한 이오타[a]나 한 획도 결코 없어지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이오타’는 그리스어 알파벳에서 가장 작은 글자입니다. 또는 ‘한 글자’로 옮길 수 있습니다.
    reason: lexical_alternative
