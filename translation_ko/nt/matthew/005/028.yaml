review_pass:
  verdict: revise
  source_fidelity: ‘여자’ is possible, but in this formal modern register ‘여성’ is preferable. More importantly, ‘음욕을 품고 보는’ can describe accompanying desire rather than the purposive force of πρὸς τὸ ἐπιθυμῆσαι. ‘음욕을 품으려고 … 바라보는’ explicitly retains the intended-purpose nuance. ‘이미 마음으로’ is retained as ‘이미 마음속으로.’
  naturalness: The revision uses modern formal-polite Korean and avoids the potentially brusque colloquial sense of ‘여자.’ ‘바라보다’ naturally conveys a directed look in this context, while the word order remains fluent.
  terminology: ‘간음하다’ accurately renders μοιχεύω. ‘음욕’ appropriately conveys the sexual force made clear by the adultery context, without treating ordinary noticing as the issue; the purposive phrase marks the intended desire. A footnote preserves the γυναῖκα ‘woman/wife’ ambiguity.
  issues:
  - severity: medium
    issue: Purpose nuance is underrepresented by ‘음욕을 품고 보는’.
    rationale: πρὸς τὸ ἐπιθυμῆσαι expresses purpose/directed intention. The connective ‘-고’ may be read merely as simultaneous action or state, whereas ‘음욕을 품으려고’ conveys the source construction’s purposive sense.
  - severity: low
    issue: ‘여자’ is less suitable for the requested modern formal-polite register.
    rationale: Although not inherently inaccurate, ‘여성’ is more neutral and appropriately formal in a public Korean Bible translation. The lexical possibility of ‘wife’ should remain available in a note rather than be imposed in the text.
  revised_text: 그러나 나는 여러분에게 말합니다. 여성을¹ 음욕을 품으려고 바라보는 사람은 누구나 이미 마음속으로 그 여성과 간음한 것입니다.
  revised_footnotes:
  - marker: ¹
    text: 그리스어 γυνή는 문맥에 따라 ‘여성’ 또는 ‘아내’를 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 'The revised wording preserves the contrastive declaration, the universal scope, and especially the Greek purposive construction: the culpable look is one directed toward cultivating sexual desire. It also retains the source’s non-specification of the woman’s marital status in the main text and records that ambiguity in a footnote.'
