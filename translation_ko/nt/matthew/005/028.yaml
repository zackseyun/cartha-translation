    reason: lexical_alternative
  revision_rationale: The revision retains the draft's faithful interpretation while using more idiomatic Korean word order, a more fitting verb for deliberate looking, and formal-polite completion. The lexical note preserves the contextual ambiguity of γυναῖκα without altering the broad main-text rendering.
