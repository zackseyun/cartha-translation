  source_fidelity: The draft accurately conveys the contrast, universal scope, inward setting, and completed force of ἤδη ἐμοίχευσεν. However, placing the object before the purpose/desire phrase is less clear in Korean, and a small syntactic revision better reflects the Greek sequence and purposive sense of πρὸς τὸ ἐπιθυμῆσαι.
  naturalness: '"누구든지 여자를 음욕을 품고 보는 사람은" is understandable but syntactically cumbersome. "여자를 음욕을 품고 바라보는 사람은 누구나" is natural modern formal Korean. "바라보다" is also more appropriate than the neutral "보다" for βλέπων in this ethical saying.'
  terminology: '"음욕" appropriately makes explicit the sexual sense supplied by the adultery context without imposing a narrower marital-status meaning on γυναῖκα. "간음했습니다" is clear, formal-polite, and faithfully represents ἐμοίχευσεν. The footnote records that γυναῖκα may also mean "아내," while retaining the source''s ambiguity in the main text.'
  issues:
