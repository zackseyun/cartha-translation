    issue: Awkward word order and construction
    rationale: The phrase "누구든지 여자를 음욕을 품고 보는 사람은" combines a generic pronoun with "사람은" awkwardly and interrupts the verbal phrase. Reordering improves readability without changing meaning.
  - severity: low
    issue: Lexical ambiguity of γυναῖκα is unnoted
    rationale: The main rendering "여자" is appropriate, but a brief note preserves the possible "아내" sense in an adultery context without artificially narrowing the main text.
  revised_text: 그러나 나는 여러분에게 말합니다. 여자를 음욕을 품고 바라보는 사람은 누구나 이미 마음속으로 그녀와 간음했습니다.[a]
