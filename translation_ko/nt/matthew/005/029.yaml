id: MAT.5.29
reference: Matthew 5:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
  footnotes:
  - marker: a
    text: 'Or: ''causes you to sin.'''
    reason: lexical_alternative
  - marker: b
    text: Gehenna is the Greek form of a name associated with the Valley of Hinnom; traditionally rendered 'hell.'
    reason: alternative_reading
translation:
  language: ko
  text: 만일 당신의 오른 눈이 당신을 걸려 넘어지게 한다면[a], 그것을 뽑아 멀리 던져 버리십시오. 당신의 지체 하나를 잃는 것이 온몸이 게헨나에 던져지는 것보다 당신에게 낫습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 죄를 짓게 한다면.’
    reason: σκανδαλίζω의 문맥상 해석 가능성을 제시하되, 본문에서는 원문의 걸림/넘어짐 은유를 보존합니다.
  - marker: b
    text: ‘게헨나’는 힌놈 골짜기와 관련된 이름의 그리스어 형태입니다. 전통적으로 ‘지옥’으로 번역합니다.
    reason: γέεννα라는 고유한 역사적·언어적 표현을 본문에 보존하고, 통용 번역을 설명합니다.
