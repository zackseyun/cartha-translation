  source_fidelity: 초두의 ‘그러므로’는 그리스어 본문에 없으므로 삭제해야 합니다. 또한 τούτων은 앞의 ‘예/아니오’ 응답들을 가리키는 복수이므로 ‘이보다’보다 ‘이것들을 넘는’이 더 충실합니다. τοῦ πονηροῦ는 인격적 ‘악한 자’와 비인격적 ‘악’ 사이에 문법적 의미 범위가 있어, 본문은 가능한 인격적 독법을 따르되 각주로 대안을 보존하는 것이 적절합니다.
  naturalness: ‘예면 예, 아니오면 아니오가 되게 하십시오’는 의미는 통하지만 현대 한국어에서는 다소 부자연스럽습니다. ‘예는 예로, 아니오는 아니오로 하십시오’는 간결하고 격식 있는 합쇼체이며, 반복된 ναί/οὔ의 강조도 자연스럽게 살립니다.
  terminology: ‘악한 자’는 마태복음에서 가능한 인격적 지시를 반영하는 적절한 표현입니다. 다만 이를 ‘마귀’로 특정하면 원문의 논쟁적 모호성을 좁히므로 피해야 합니다. ‘악’이라는 비인격적 대안은 각주에 제시합니다.
