  lexicon: BDAG
  rationale: 아람어 욕설 רֵיקָא(빈 머리)의 음역을 그대로 보존한다.
- source_word: Μωρέ
  english_pob_choice: Fool
  chosen_korean: 바보
  alternatives_korean:
  - 미련한 자
  - 멍청이
  lexicon: BDAG
  rationale: μωρός의 모욕적 무게를 현대 한국어 「바보」로 옮기되, 본문이 의도한 인격 비하의 결을 살린다.
- source_word: γέενναν τοῦ πυρός
  english_pob_choice: Gehenna of fire
  chosen_korean: 불 게헨나
  alternatives_korean:
  - 불타는 게헨나
  - 지옥 불
  lexicon: BDAG
  rationale: 게헨나(힌놈 골짜기)의 지명 어원과 종말론적 함의를 동시에 보존하기 위해 음역 「게헨나」를 그대로 두고, 한국 전통의 「지옥」으로 평면화하지 않는다.
review_pass:
  verdict: revise
  source_fidelity: 초안은 ἔνοχος ἔσται(법적 책임/처벌 대상이 됨)의 세 번 반복되는 법정적 점층을 각각 ‘심판을 받을 것’, ‘회부될 것’, ‘던져질 것’로 바꾸어 옮겼습니다. 특히 마지막 ‘던져질 것’은 원문의 ‘게헨나에 대해 책임이 있다/처벌 대상이다’보다 더 구체적인 동작을 도입합니다. 또한 γέενναν τοῦ πυρός는 ‘불 게헨나’보다 ‘불의 게헨나’가 속격 관계를 더 자연스럽고 분명하게 반영합니다.
  naturalness: 합쇼체는 적절합니다. 다만 ‘책임이 있습니다’ 구문을 병렬적으로 사용하면 원문의 법적 책임과 점층 구조를 자연스러운 현대 표준어로 유지할 수 있습니다.
  terminology: ‘라가’와 ‘게헨나’의 음역은 적절합니다. συνέδριον은 본문에서 ‘공의회’로 유지하고, ‘산헤드린’ 가능성은 각주에 남깁니다. ἀδελφός는 원문의 남성 단수에 따라 ‘형제’로 옮기되 대표적 용법은 각주로 설명합니다.
  issues:
  - severity: medium
    issue: ἔνοχος ἔσται의 반복이 세 절에서 서로 다른 결과 진술로 번역되었습니다.
    rationale: 원문은 심판·공의회·불의 게헨나에 대한 법적 책임이라는 동일한 술어를 반복하여 점층을 형성합니다. ‘회부될 것입니다’와 특히 ‘던져질 것입니다’는 원문보다 절차와 집행을 구체화합니다.
  - severity: low
    issue: γέενναν τοῦ πυρός가 ‘불 게헨나’로 번역되었습니다.
    rationale: 한국어에서는 ‘불의 게헨나’가 ‘불의’라는 속격 수식을 더 명확하고 자연스럽게 전달합니다.
  - severity: medium
    issue: 원문 및 영어 POB 감사 기록의 본문 주석 앵커가 한국어 본문에 없습니다.
    rationale: ‘이유 없이’ 첨가의 본문 이문, 라가·공의회·형제·게헨나에 관한 설명을 해당 위치에 앵커로 연결해야 합니다.
