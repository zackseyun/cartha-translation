review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the three escalating sayings and transliterates Ῥακά and γέεννα. However, it repeatedly turns ἔνοχος ἔσται (''will be liable/answerable'') into final judicial outcomes: ''심판을 받을 것입니다,'' ''공의회에 회부될 것입니다,'' and especially ''불 게헨나에 던져질 것입니다.'' The final phrase adds ''cast/thrown,'' which is absent from the Greek. The SBLGNT reading also omits the variant ''without cause,'' which should be documented at the relevant anchor.'
  naturalness: The Korean is generally clear and maintains formal-polite register. '불 게헨나' is less natural than '불의 게헨나,' and the revised wording gives each clause a parallel legal-juridical force without sounding overly technical.
  terminology: ‘라가’ appropriately retains the Aramaic insult; ‘바보’ is a suitable modern rendering of Μωρέ. ‘게헨나’ correctly avoids conflating γέεννα with the broader Korean term ‘지옥.’ ‘공의회’ is an acceptable rendering of συνέδριον, with ‘산헤드린’ noted as an alternative.
  issues:
  - severity: high
    issue: The three occurrences of ἔνοχος ἔσται are rendered as imposed outcomes rather than liability or accountability.
    rationale: The Greek states that the person will be liable to judgment, to the council, and to the Gehenna of fire. ‘공의회에 회부될’ adds a procedural action, and ‘던져질’ adds an action not present in the source.
  - severity: medium
    issue: The textual variant concerning ‘without cause’ is not footnoted.
    rationale: SBLGNT omits εἰκῇ, while some manuscripts add it after ‘his brother.’ A note preserves the adopted reading and alerts readers to the disputed wording.
  - severity: low
    issue: ‘불 게헨나’ is syntactically compressed and less idiomatic in contemporary Korean.
    rationale: ‘불의 게헨나’ naturally represents τοῦ πυρός while preserving the source term ‘Gehenna.’
  revised_text: 그러나 나는 여러분에게 말합니다. 자기 형제에게[a] 화를 내는 사람은 누구나 심판에 책임을 지게 될 것입니다. 자기 형제에게 ‘라가’라고 말하는 사람은 공의회에 책임을 지게 될 것입니다. 또 ‘바보’라고 말하는 사람은 불의 게헨나에 책임을 지게 될 것입니다.
  revised_footnotes:
  - marker: a
    text: 일부 사본에는 ‘자기 형제에게’ 뒤에 ‘까닭 없이’가 덧붙어 있습니다. 가장 이르고 잘 뒷받침되는 본문에는 이 말이 없습니다.
    reason: textual_variant
  - marker: b
    text: ‘라가’는 ‘빈 머리’, ‘쓸모없는 자’ 정도를 뜻하는 아람어 경멸 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘산헤드린’, 유대의 통치 공의회.
    reason: alternative_reading
  - marker: d
    text: ‘형제’는 남성 단수 표현이지만, 이 말씀은 남성 형제자매에게만 한정되지 않고 널리 적용됩니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘불의 지옥’. ‘게헨나’는 심판의 이미지와 관련된 힌놈 골짜기에서 유래한 특정 용어를 보존한 번역입니다.
    reason: alternative_reading
  revision_rationale: The revision restores the source’s repeated judicial-liability expression without adding referral to a court or being thrown into Gehenna. It retains the draft’s appropriate transliterations and formal register, improves the Korean genitive expression in ‘불의 게헨나,’ and supplies the textual-variant and explanatory notes required for the relevant terms. Footnotes b–e are retained as part of the complete note set but have no anchors in the supplied plain-text format; production should attach them respectively to ‘라가,’ ‘공의회,’ the first ‘형제,’ and ‘게헨나.’
