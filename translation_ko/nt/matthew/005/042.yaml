  source_fidelity: 첫 절의 '여러분에게 구하는 사람'은 한국어에서 무엇을 구하는지 불분명하고, 사람을 구한다는 뜻으로도 읽힐 수 있습니다. αἰτεῖν의 수혜 대상(σε)을 '여러분에게 달라고 하는'으로 분명히 드러내는 것이 적절합니다. δεύτε 절의 '꾸려는'은 δανίσασθαι(빌리다)에 비해 현대 표준어 용례상 부정확하거나 매우 비표준적으로 들립니다.
  naturalness: '''여러분에게 달라고 하는 이''와 ''여러분에게서 빌리려는 사람''은 현대 한국어 합쇼체 문맥에서 자연스럽습니다. ''외면하지 마십시오''는 ἀποστραφῇς의 비유적 표현을 잘 보존합니다.'
  terminology: δός는 '주십시오', αἰτοῦντι는 '달라고 하는 이', δανίσασθαι는 '빌리려는 사람', μὴ ἀποστραφῇς는 '외면하지 마십시오'로 옮겼습니다. 원문의 일반적 명령과 직접성을 유지하며 자격이나 제한을 덧붙이지 않았습니다.
