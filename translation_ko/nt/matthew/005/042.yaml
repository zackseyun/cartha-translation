    rationale: αἰτοῦντί σε는 '당신에게 [무엇을] 달라고 하는 사람'이라는 뜻입니다. 한국어 '사람을 구하다'로도 해석될 여지가 있어 요청의 방향을 명시할 필요가 있습니다.
