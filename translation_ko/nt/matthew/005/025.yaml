  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
  footnotes:
  - marker: a
    text: Or, more idiomatically in this legal context, 'Come to terms quickly with your accuser.'
    reason: lexical_alternative
translation:
  language: ko
  text: 고발자와 함께 길에 있는 동안, 그에게 속히 호의적으로 대하십시오[a]. 그렇지 않으면 그 고발자가 여러분을 재판관에게 넘기고, 재판관이 집행관에게 넘겨, 여러분이 감옥에 던져질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 이 법률 문맥에서는, ‘고발자와 속히 합의하십시오.’
    reason: εὐνοέω는 기본적으로 호의적인 태도를 뜻하지만, 법적 분쟁의 문맥에서는 신속히 타결하라는 뜻으로 관용적으로 이해될 수 있습니다.
