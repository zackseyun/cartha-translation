- from: 여러분의 고발자와 함께 길에 있는 동안 속히 그와 화해하십시오. 그렇지 않으면 고발자가 여러분을 재판관에게 넘기고, 재판관이 집행관에게 넘겨, 여러분이 감옥에 던져질 것입니다.
  to: 고발자와 함께 길에 있는 동안, 그에게 속히 호의적으로 대하십시오[a]. 그렇지 않으면 그 고발자가 여러분을 재판관에게 넘기고, 재판관이 집행관에게 넘겨, 여러분이 감옥에 던져질 것입니다.
  rationale: 주번역을 εὐνοέω의 핵심 의미인 ‘호의적으로 대하다’에 맞추고, 법적 합의라는 자연스러운 문맥적 해석은 각주로 보존했습니다. 원문의 시간절, 법적 이양 순서, 그리고 감옥에 ‘던져지는’ 수동 표현을 유지했습니다.
