  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
  footnotes:
  - marker: a
    text: Or "take you to court." The Greek literally refers to being judged in a legal setting.
    reason: lexical_alternative
  - marker: b
    text: '"Tunic" refers to the inner garment; "cloak" refers to the outer garment.'
    reason: cultural_note
translation:
  language: ko
  text: 당신을 고소하여[a] 당신의 속옷[b]을 가져가려는 사람에게, 겉옷도 내어 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신을 법정에 세우려는.” 그리스어는 법적 판결의 맥락을 가리킵니다.
    reason: κρίνω의 법적·사법적 의미를 보완하여 ‘고소하다’라는 자연스러운 번역이 지나치게 협소하게 이해되지 않도록 한다.
  - marker: b
    text: ‘속옷’은 몸에 가까이 입는 안쪽 옷이고, ‘겉옷’은 그 위에 걸치는 바깥 옷을 가리킵니다.
    reason: χίτων과 ἱμάτιον의 역사적 의복 구별을 보존하고 현대 한국어 ‘속옷’의 오해를 방지한다.
