review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the legal action, the taking of the χιτών, and the imperative to yield the ἱμάτιον as well. However, σοι is singular, whereas ‘여러분’ is plural, and ‘속옷’ without explanation strongly suggests modern underwear rather than the ancient inner garment.
  naturalness: ‘여러분을 고소하여 여러분의 속옷을 가져가려는 사람에게는’ is understandable but cumbersome and mismatches the singular address. ‘당신을 고소하여 당신의 속옷을 가져가려는 사람에게’ is a natural formal-polite rendering in this direct-address context.
  terminology: ‘속옷’ and ‘겉옷’ preserve the χιτών/ἱμάτιον contrast when accompanied by a cultural footnote. The legal expression ‘고소하다’ is idiomatic; a note can retain the broader judicial sense of κριθῆναι.
  issues:
  - severity: medium
    issue: Number mismatch in the addressee
    rationale: The Greek σοι and σου are singular. The draft’s ‘여러분’ changes the address to plural without a source-based reason.
  - severity: medium
    issue: ‘속옷’ is liable to a modern misunderstanding
    rationale: χίτων denotes an inner garment, not specifically modern underwear. A footnote is needed to preserve the historical garment distinction.
