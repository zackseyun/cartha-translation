review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional warning, the comparison with the scribes and Pharisees, the emphatic negation, and 'kingdom of heaven.' However, it does not clearly represent γάρ ('for'), and '더 낫지' is somewhat broader and less precise than the comparative force of περισσεύσῃ ('exceeds/surpasses').
  naturalness: The proposed revision uses natural contemporary standard Korean in formal-polite style. '바리새인' is more idiomatic and established than '바리새파 사람들,' while '율법학자' remains a clear rendering of γραμματεῖς.
  terminology: Retain '의' for δικαιοσύνη, which suits this Matthean context and has established Korean biblical usage. A footnote records the viable lexical alternative '정의.' Retain '하늘 나라' for βασιλεία τῶν οὐρανῶν.
  issues:
  - severity: medium
    issue: The connective γάρ is not represented clearly.
    rationale: The opening '내가 여러분에게 말합니다' translates λέγω γὰρ ὑμῖν only partially. '말하는데' naturally carries the explanatory/discourse-linking force in Korean.
  - severity: low
    issue: '''더 낫지'' is less exact than the source comparison.'
    rationale: περισσεύσῃ πλεῖον conveys exceeding or surpassing in measure. '더 뛰어나지' expresses this comparison more directly without adding interpretation.
  - severity: low
    issue: '''바리새파 사람들'' is unnecessarily cumbersome.'
    rationale: Φαρισαῖοι is a recognized group name; the standard Korean form '바리새인' is natural and accurate.
  revised_text: 내가 여러분에게 말하는데, 여러분의 의[a]가 율법학자들과 바리새인들의 의보다 더 뛰어나지 않으면, 여러분은 결코 하늘 나라에 들어가지 못할 것입니다.
