  text: 내가 여러분에게 말하는데, 여러분의 의[a]가 율법학자들과 바리새인들의 의보다 더 뛰어나지 않으면, 여러분은 결코 하늘 나라에 들어가지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
