  text: 또 이렇게 말해졌습니다. ‘누구든지 자기 아내와 이혼하는 사람은 그 아내에게 이혼 증서를 주어야 합니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 아내를 내보내는 사람은 그 아내에게 이혼 증서를 주어야 합니다.” 그리스어 동사는 “보내다” 또는 “내보내다”를 뜻할 수도 있지만, 여기서는 혼인과 법률 문서의 문맥에서 이혼을 가리킵니다.
    reason: lexical_alternative
