  source_fidelity: 초안은 Ἐρρέθη(‘말해졌다’)를 ‘여러분은 들었습니다’로 바꾸어 앞 절의 표현과 조화시켰으므로 본문의 직접적 표현을 보존하지 못합니다. 또한 ἀπολύσῃ의 주어가 아내를 이혼하는 행위라는 법률적 구문도 더 분명히 나타낼 필요가 있습니다.
  naturalness: ‘자기 아내와 이혼하는 사람’은 현대 한국어로 자연스럽고, 인용된 법률적 명령은 ‘주어야 합니다’로 옮기면 합쇼체를 유지하면서도 이해하기 쉽습니다.
  terminology: ἀποστάσιον은 문서성을 지닌 ‘이혼 증서’로 옮기는 것이 적절합니다. γυνή는 이 문맥에서 ‘아내’이며, αὐτῇ는 ‘그 아내에게’로 명시하여 수여 대상을 분명히 합니다.
  issues:
  - severity: high
    issue: ‘여러분은 들었습니다’라는 도입
    rationale: 그리스어는 Ἐρρέθη δέ, 곧 ‘그러나/또 말해졌다’이며, ‘여러분은 들었습니다’(ἠκούσατε)는 본 절에 없습니다. 앞선 절과의 조화에 따른 첨가를 피해야 합니다.
  - severity: medium
    issue: 인용문 안의 이혼 행위와 명령의 표현
    rationale: 초안의 ‘자기 아내와 이혼하는 사람은’은 자연스럽지만, 인용문 전체를 명확한 법률적 일반 명령으로 제시하고 ‘이혼 증서’를 수여하는 대상을 밝혀 주는 편이 원문의 구문과 문서적 의미를 더 잘 반영합니다.
  revised_text: 또 이렇게 말해졌습니다. “누구든지 자기 아내와 이혼하는 사람은 그 아내에게 이혼 증서를 주어야 합니다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘자기 아내를 내보내는 사람은 … 이혼 문서를 주어야 합니다.’ 여기서 그리스어 동사는 ‘내보내다’를 뜻할 수도 있으나, 혼인과 법률 문서의 문맥에서는 이혼을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 본문의 수동적 인용 도입(‘말해졌다’)을 보존하고, 법률적 혼인 문맥의 ἀπολύω를 ‘이혼하다’로, ἀποστάσιον을 문서성을 드러내는 ‘이혼 증서’로 옮겼습니다. 원문의 명령형은 현대 합쇼체 법률 문장에 자연스러운 ‘주어야 합니다’로 표현했으며, 이 절 자체가 이혼 절차를 승인하거나 부정한다는 해석은 덧붙이지 않았습니다.
