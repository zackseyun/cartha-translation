    issue: The draft includes “여러분은 들었습니다.”
    rationale: The Greek text begins “Ἐρρέθη δέ” (“But/and it was said”) and does not contain an address to the hearers or a verb meaning “you heard.”
  - severity: high
    issue: The quoted legal saying is mistranslated syntactically.
    rationale: Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον means that whoever divorces his wife is to give her a divorce document. The draft’s “자기 아내와 이혼하는 사람은 그녀에게…” requires correction for a clear, complete legal formulation.
  revised_text: 또 이렇게 말해졌습니다. ‘누구든지 자기 아내와 이혼하는 사람은 그 아내에게 이혼 증서를 주어야 합니다.’[a]
