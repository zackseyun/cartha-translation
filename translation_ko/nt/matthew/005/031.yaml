  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
  footnotes:
  - marker: a
    text: Or 'sends away his wife ... a writ of divorce.' The Greek verb can mean 'send away,' but here in legal marital context it refers to divorce.
