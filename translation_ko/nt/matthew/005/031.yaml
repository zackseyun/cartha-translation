  terminology: “이혼 증서” accurately conveys ἀποστάσιον as a written divorce document. “자기 아내” preserves the marital sense of γυναῖκα αὐτοῦ, and the footnote retains the lexical possibility of “내보내다/보내다” while explaining why “이혼하다” is appropriate here.
  issues:
