  source_fidelity: The draft adds “여러분은 들었습니다” (“you have heard”), which is not present in Matthew 5:31 and belongs to the preceding antithesis formula rather than this verse. It also reverses the legal statement’s syntax and obscures the imperative that the husband give his wife the document.
