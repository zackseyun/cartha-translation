revisions:
- from: 그래야 여러분이 하늘에 계신 여러분의 아버지의 아들이 될 것입니다. 그분께서는 자기의 해를 악한 자에게나 선한 자에게나 떠오르게 하시고, 의인에게나 불의한 자에게나 비를 내려 주시기 때문입니다.
  to: 그리하여 여러분이 하늘에 계신 여러분의 아버지의 아들이 되게 하려는 것입니다. 그분께서는 자신의 해를 악한 사람들과 선한 사람들 위에 떠오르게 하시며, 의인들과 불의한 사람들 위에 비를 내리시기 때문입니다.
  rationale: 'The revision uses “그리하여 … 되게 하려는 것입니다” to express the purpose introduced by ὅπως while preserving γένησθε as “되게.” It retains the explicit masculine filial wording “아들,” represents the plural human categories explicitly, and keeps the parallel divine actions and explanatory ὅτι clause. No footnote is necessary: “하늘에 계신” is idiomatic Korean for the Matthean expression, and the plural form of οὐρανοῖς does not require a note in this concise verse.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the Father's impartial beneficence and retains the explicit filial term “아들.” However, “그래야 … 될 것입니다” turns the purposive subjunctive (ὅπως γένησθε) into a stronger conditional-future assertion. A purpose construction better represents the Greek.
  naturalness: The wording is generally clear and appropriately formal. Replacing the conditional-future opening with a natural Korean purpose expression and using plural personal nouns gives the balanced pairs a more natural and explicit rendering.
  terminology: “아버지,” “아들,” “의인,” and “불의한 사람들” appropriately preserve the source’s filial and ethical vocabulary. “해를 떠오르게 하시고” and “비를 내리시며” naturally retain God’s agency without adding a benefactive nuance.
  issues:
  - severity: medium
    issue: The opening conditional-future wording does not adequately represent the purpose force of ὅπως with the aorist subjunctive γένησθε.
    rationale: '“그래야 … 아들이 될 것입니다” means roughly “only then you will become sons,” introducing conditional necessity and future certainty. The Greek states the purpose of the preceding instruction: “so that you may become ….”'
  - severity: low
    issue: The substantival plural adjectives are rendered as singular generic nouns.
    rationale: Korean singular generics can be acceptable, but “악한 사람들과 선한 사람들 … 의인들과 불의한 사람들” more directly preserves the plural, parallel human groups in the Greek.
  revised_text: 그리하여 여러분이 하늘에 계신 여러분의 아버지의 아들이 되게 하려는 것입니다. 그분께서는 자신의 해를 악한 사람들과 선한 사람들 위에 떠오르게 하시며, 의인들과 불의한 사람들 위에 비를 내리시기 때문입니다.
