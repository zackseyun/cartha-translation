  text: 그리하여 여러분이 하늘에 계신 여러분의 아버지의 아들이 되게 하려는 것입니다. 그분께서는 자신의 해를 악한 사람들과 선한 사람들 위에 떠오르게 하시며, 의인들과 불의한 사람들 위에 비를 내리시기 때문입니다.
  philosophy: optimal-equivalence
