theological_decisions:
- issue: 맹세 본문의 「주」를 「야훼」로 회복할지
  chosen_reading: 주께 한 맹세
  alternative_readings:
  - 야훼께 한 맹세
  rationale: 이 구절은 특정 OT 본문의 직접 인용이 아니라 율법 정신의 요약(레 19:12; 민 30:2; 신 23:21의 합성)이다. 직접 인용의 야훼 회복 규칙을 적용하지 않고 「주」를 유지한다.
  doctrine_reference: 'Glossary policy: restore 야훼 only on direct OT YHWH citations'
revisions:
- from: 또 옛 사람들에게 『거짓 맹세를 하지 마라. 주께 한 맹세는 지키라』라고 말한 것을 여러분은 들었습니다.
  to: 또 여러분은 옛적 사람들에게 이렇게 말한 것을 들었습니다. ‘거짓으로 맹세하지 말고, 주께 한 맹세는 지켜라.’
  rationale: 원문의 비인칭 수동 표현(‘말해졌다’)을 한국어의 자연스러운 「이렇게 말한 것을」으로 보존하고, 「옛적 사람들」로 역사적 지시 대상을 명확히 했습니다. 또한 거짓 맹세 금지를 동사적 표현으로 다듬었습니다. 의미를 바꾸거나 신적 화자를 본문에 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:31Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 「옛 사람들에게」는 현대 한국어에서 다소 어색하고 고령자를 가리키는 것으로도 들릴 수 있어, τοῖς ἀρχαίοις의 역사적 의미를 더 분명히 할 필요가 있습니다. 「거짓 맹세를 하지 마라」도 가능하지만, ἐπιορκήσεις의 ‘거짓으로 맹세하다’라는 동작을 직접 드러내는 표현이 더 적절합니다.
  naturalness: 문장 순서를 조정하고 「옛적 사람들」 및 「거짓으로 맹세하지 말고」를 사용하면 현대 표준어 합쇼체 문맥에서 더 자연스럽고 명료합니다. 인용문 안의 명령형은 인용된 옛 율법적 발화이므로 「말고/지켜라」를 유지할 수 있습니다.
  terminology: κύριος는 이 율법 요약의 문맥에서 「주」로 옮기는 것이 적절합니다. ὅρκος는 「맹세」로 일관되게 옮겼습니다. 「야훼」로 특정하지 않아 그리스어 본문과 간접적 율법 요약이라는 성격을 보존합니다.
  issues:
  - severity: low
    issue: 「옛 사람들에게」의 의미 및 어감
    rationale: τοῖς ἀρχαίοις는 과거 시대의 사람들을 가리킵니다. 「옛적 사람들」이 시간적·역사적 뜻을 더 자연스럽게 전달합니다.
  - severity: low
    issue: 「거짓 맹세를 하지 마라」의 표현
    rationale: 한국어 「거짓 맹세」는 명사구로는 가능하나, 원문의 ‘거짓으로 맹세하지 말라’라는 금지를 직접 나타내는 「거짓으로 맹세하지 말고」가 더 명료합니다.
  revised_text: 또 여러분은 옛적 사람들에게 이렇게 말한 것을 들었습니다. ‘거짓으로 맹세하지 말고, 주께 한 맹세는 지켜라.’
