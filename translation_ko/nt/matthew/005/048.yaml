review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential οὖν, the emphatic addressee, the comparison with the heavenly Father, and the exhortational force of the future indicative. However, rendering τέλειος as “완전” without qualification can suggest an abstract or absolute perfection more readily than the contextual sense of wholeness and undivided integrity in love. “온전” better represents the semantic range while retaining the deliberate repetition in the Greek.
  naturalness: The sentence is generally natural in modern formal-polite Korean. Adding “도” makes the explicitly addressed disciples clearer within the comparison, and spacing “것 같이” follows standard contemporary orthography.
  terminology: “하늘에 계신 여러분의 아버지” is an established, reverent Korean rendering of ὁ πατὴρ ὑμῶν ὁ οὐράνιος. “온전” is a suitable established biblical ethical term for τέλειος. A lexical footnote is warranted to preserve the acknowledged alternatives without imposing a doctrinally narrowed reading.
  issues:
  - severity: medium
    issue: “완전” may over-specify τέλειος as absolute perfection.
    rationale: In this immediate context τέλειος concerns completeness or wholeness in love. “온전” communicates that sense more naturally in Korean while still allowing the comparison to God to retain its full ethical force.
  - severity: low
    issue: No footnote preserves the semantic alternatives for τέλειος.
    rationale: The English audit trail explicitly records “complete,” “whole,” and “mature” as viable senses. A Korean lexical note protects this range and avoids treating the main rendering as exhaustive.
  - severity: low
    issue: “것같이” should be spaced as “것 같이.”
    rationale: This is the standard modern orthographic form in this construction.
  revised_text: 그러므로 여러분도 하늘에 계신 여러분의 아버지께서 온전하신 것 같이 온전해야 합니다.[a]
  revised_footnotes:
