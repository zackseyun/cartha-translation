review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the command against murder and the consequent judicial liability. However, 「옛 사람들」 can readily mean elderly people in modern Korean; 「옛적 사람들」 more clearly represents τοῖς ἀρχαίοις, people of former times. 「살인하지 말라」 is a more appropriate elevated legal-command form than the informal-sounding 「살인하지 마라」.
  naturalness: The revised word order is natural Korean while retaining the Matthean discourse formula. The quotation uses a suitably formal biblical/legal register, and the surrounding sentence remains modern formal-polite 합쇼체.
  terminology: 「살인」 appropriately renders φονεύω rather than the broader 「죽이다」. 「심판을 받게 될 것이다」 retains the future judicial consequence of ἔνοχος ἔσται τῇ κρίσει without prematurely identifying the particular court or importing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: 「옛 사람들에게」 may be understood as “to elderly people.”
    rationale: τοῖς ἀρχαίοις denotes people of former times, not people advanced in age. 「옛적 사람들에게」 is clearer in contemporary standard Korean.
  - severity: low
    issue: The quoted command uses 「마라」.
    rationale: Although intelligible, 「마라」 has a comparatively informal imperative tone. 「말라」 better fits the solemn legal-command citation and Korean Bible register.
  revised_text: 여러분은 옛적 사람들에게 ‘살인하지 말라. 살인하는 자는 누구든지 심판을 받게 될 것이다’라고 말한 것을 들었습니다.
  revised_footnotes: []
  revision_rationale: The revision clarifies the historical reference of τοῖς ἀρχαίοις and adjusts the command’s register, while preserving the source’s passive/unspecified saying formula, the distinction of murder from killing in general, and the future judicial consequence.
