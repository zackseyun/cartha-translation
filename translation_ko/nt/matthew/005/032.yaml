review_pass:
  verdict: revise
  source_fidelity: The draft correctly distinguishes πορνεία ("음행") from μοιχεία ("간음") and conveys the exception clause and both adultery statements. However, its phrasing weakens the referential connection to the wife and does not preserve the notable passive-form nuance of μοιχευθῆναι.
  naturalness: '"음행의 이유 외에" and "그녀가 간음하게 만드는 것입니다" are awkward in modern formal Korean. "음행의 경우 외에는" and a finite formal-polite predicate are more natural.'
  terminology: '"음행" is an appropriate established Korean biblical rendering for πορνεία and should remain distinct from "간음." "이혼한 여자" is understandable, but "이혼한 여성" is more neutral and natural in this register.'
  issues:
  - severity: medium
    issue: Awkward exception and predicate phrasing
    rationale: '"음행의 이유 외에" is less idiomatic than "음행의 경우 외에는," and "만드는 것입니다" is an unnatural explanatory ending rather than a direct translation in 합쇼체.'
  - severity: medium
    issue: The wife is not explicitly maintained as the referent
    rationale: The Greek αὐτή refers to the divorcing man's wife. Rendering "그 아내" makes this connection clear in Korean.
  - severity: low
    issue: Passive-form ambiguity of μοιχευθῆναι is unrepresented
    rationale: The main rendering "간음하게 만듭니다" is idiomatic and defensible, but the infinitive is passive in form. A footnote should retain the alternative resultative sense without deciding the debated nuance.
