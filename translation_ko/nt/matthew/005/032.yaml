revisions:
- from: 그러나 나는 여러분에게 말합니다. 누구든지 음행의 이유 외에 자기 아내와 이혼하는 사람은 그녀가 간음하게 만드는 것입니다. 그리고 이혼한 여자와 결혼하는 사람도 간음하는 것입니다.
  to: 그러나 나는 여러분에게 말합니다. 누구든지 음행의 경우 외에는 자기 아내와 이혼하면, 그 아내가 간음하게 만듭니다[1]. 또 누구든지 이혼한 여성과 결혼하면 간음합니다.
  rationale: The revision retains the genuine exception for πορνεία, preserves the established distinction between 음행 and 간음, uses modern formal-polite Korean, and supplies a note for the passive-form ambiguity of μοιχευθῆναι. "아내와 이혼하다" is retained as the ordinary Korean expression for divorce while "그 아내" keeps the Greek referent explicit.
