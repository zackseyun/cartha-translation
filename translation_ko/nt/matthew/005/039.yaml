translation:
  language: ko
  text: 그러나 나는 여러분에게 말합니다. 악한 사람[a]에게 맞서지 마십시오. 도리어 누가 여러분의 오른쪽 뺨을 때리거든, 그에게 다른 뺨도 돌려 대십시오.
  philosophy: optimal-equivalence
  footnotes:
