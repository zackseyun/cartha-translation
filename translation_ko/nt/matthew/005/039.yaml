    text: 또는 ‘악에 맞서지 마십시오’; ‘악한 이에게 맞서지 마십시오’로도 옮길 수 있습니다.
    reason: τῷ πονηρῷ는 문법적으로 중성의 ‘악’ 또는 인격적 표현으로 읽힐 수 있으므로, 본문의 문맥상 선택을 유지하면서 대안을 보존합니다.
