review_pass:
  verdict: revise
  source_fidelity: The draft conveys the prohibition and its causal basis accurately. However, the Greek oath idiom ἐν τῇ κεφαλῇ σου is more naturally represented in Korean as ‘머리를 두고 맹세하다’ than ‘머리로 맹세하다.’ μήτε continues the preceding negative series and is suitably rendered here with ‘또.’
  naturalness: ‘여러분의 머리로도 맹세하지 마십시오’ is understandable but somewhat less idiomatic in modern Korean. ‘여러분의 머리를 두고 맹세하지 마십시오’ is the conventional, clear oath-taking expression. ‘머리카락 한 올도’ is natural while retaining the singular emphatic sense of μίαν τρίχα.
  terminology: ‘맹세하다,’ ‘희게 하거나 검게 하다,’ and the formal-polite prohibitive ending ‘-하지 마십시오’ are appropriate. No doctrinal expansion is introduced.
  issues:
  - severity: low
    issue: Korean rendering of the oath formula is slightly literal and less idiomatic.
    rationale: With ‘swear,’ the Greek phrase means to invoke one’s head in an oath. Korean normally expresses this as ‘머리를 두고 맹세하다.’
  - severity: low
    issue: The connective force of μήτε can be made clearer.
    rationale: ‘또’ naturally continues the preceding coordinated prohibitions without adding interpretation.
  revised_text: 또 여러분의 머리를 두고 맹세하지 마십시오. 여러분은 머리카락 한 올도 희게 하거나 검게 할 수 없기 때문입니다.
