  - severity: low
    issue: ‘형제’에 대한 설명 각주 부재
    rationale: 원문 ἀδελφῷ는 남성 단수이므로 본문은 ‘형제’로 유지하는 것이 적절합니다. 다만 문맥의 윤리적 원칙을 성급히 제한하지 않도록 간단한 설명 각주를 두는 것이 영어 감사 기록의 취지와 부합합니다.
