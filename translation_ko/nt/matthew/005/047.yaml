  source_fidelity: 초안은 조건절, '오직', 인사, 이방인들의 동일한 행위를 충실히 옮깁니다. 다만 τί περισσὸν ποιεῖτε의 '무엇을 ... 하는가'라는 행위 중심의 수사 의문문이 '무엇이 특별하겠습니까?'에서는 다소 약화됩니다.
  naturalness: 합쇼체와 전반적 문장은 자연스럽습니다. 그러나 '여러분이 자기 형제들에게'보다 '여러분의 형제들에게'가 소유 관계를 더 명료하게 드러내며, 중간 의문문은 동사를 밝혀 주는 편이 현대 표준어에서 더 자연스럽고 원문에도 가깝습니다.
  terminology: '''형제들''은 ἀδελφοί의 문법적 남성형을 보존하고, ''이방인들''은 이 문맥의 ἐθνικοί에 적절합니다. 두 낱말의 가능한 범위와 περισσόν의 대안적 뉘앙스는 각주로 보존하는 것이 좋습니다.'
  issues:
  - severity: medium
    issue: 중간 수사 의문문의 행위 동사 약화
    rationale: τί περισσὸν ποιεῖτε는 직역하면 '무엇을 특별히/더 하고 있습니까?'입니다. '무엇이 특별하겠습니까?'도 취지는 전달하지만 ποιεῖτε와 질문의 직접적 대상을 생략합니다.
  - severity: low
    issue: 소유 표현의 명료성
    rationale: '''자기 형제들''도 가능하지만, 복수 청자인 ''여러분''과 함께 쓰일 때 ''여러분의 형제들''이 ὑμῶν을 더 명시적으로 반영합니다.'
  revised_text: 여러분이 여러분의 형제들에게만 인사한다면, 무엇을 특별히 하는 것이겠습니까?[b] 이방인들도 그렇게 하지 않습니까?[c]
  revised_footnotes:
  - marker: a
    text: 또는 ‘형제자매들’. 그리스어는 ‘형제들’이라고 하지만, 여기서는 더 넓게 자기 집단의 구성원들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무엇을 더 하는 것입니까?’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이교도들’.
    reason: alternative_reading
  revision_rationale: 'ποιεῖτε의 행위 의미와 περισσόν의 ‘특별히/남달리’라는 수사적 힘을 본문에서 드러내도록 중간 질문을 고쳤습니다. ἀδελφοί의 더 넓은 지시 가능성은 원문의 남성형을 본문에서 유지한 채 각주 [a]로 보존했습니다. [a]는 본문에 표지하지 않아 구조적으로 연결되지 않으므로, 조판 시 ‘형제들에게’ 뒤에 [a]를 붙여야 합니다. 수정된 완전 본문은 다음과 같아야 합니다: ‘여러분이 여러분의 형제들에게[a]만 인사한다면, 무엇을 특별히 하는 것이겠습니까?[b] 이방인들도 그렇게 하지 않습니까?[c]’'
