review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the conditional, the restriction 'only,' greeting, and the rhetorical comparison with the Gentiles. However, '무엇이 특별하겠습니까?' shifts the Greek question about what the hearers do (τί περισσὸν ποιεῖτε) into a question about what is special. A small revision retains the action explicitly.
  naturalness: The draft is generally natural modern Korean in formal-polite style. Replacing the middle clause with '무엇을 특별히 하는 것이겠습니까?' is both idiomatic and closer to the Greek rhetorical force. '여러분의 형제들' is preferable to reflexive '자기 형제들' in this address.
  terminology: '''인사하다'' appropriately renders ἀσπάζομαι in this context, and ''이방인들'' is the established, direct rendering of ἐθνικοί. ''형제들'' retains the Greek wording; a note preserves the plausible broader in-group sense without deciding it in the text.'
  issues:
  - severity: medium
    issue: The phrase '무엇이 특별하겠습니까?' does not explicitly express the verb ποιεῖτε ('are you doing').
    rationale: The Greek asks what extraordinary thing the addressees are doing, not merely whether something is special. The proposed wording keeps the action and rhetorical force.
  - severity: low
    issue: '''자기 형제들'' is less natural in a plural formal address and may more readily suggest each person''s literal male siblings.'
    rationale: '''여러분의 형제들'' is clearer Korean while retaining the source term; the note records that the referent may extend to one''s own group.'
  revised_text: 여러분이 여러분의 형제들에게만 인사한다면, 무엇을 특별히 하는 것이겠습니까? 이방인들도 그렇게 하지 않습니까?
  revised_footnotes:
  - marker: a
    text: 또는 ‘형제자매들’. 그리스어는 ‘형제들’이라고 하지만, 더 넓게는 자기 집단의 구성원을 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision explicitly renders the action implied by ποιεῖτε, improves the Korean possessive phrasing, and retains the source's potentially broader sense of ἀδελφοί in a footnote. It preserves the established rendering '이방인들' for ἐθνικοί and the formal-polite register.
