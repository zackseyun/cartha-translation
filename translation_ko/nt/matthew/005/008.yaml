  source_fidelity: 그리스어 μακάριοι οἱ καθαροὶ τῇ καρδίᾳ를 「마음이 정결한 사람은 복이 있습니다」로, ὅτι αὐτοὶ τὸν θεὸν ὄψονται를 「그들이 하나님을 볼 것이기 때문입니다」로 충실히 옮겼습니다. τῇ καρδίᾳ의 내면적 범위와 καθαροί의 도덕적·영적 정결의 의미가 자연스럽게 유지되며, 미래 약속인 ὄψονται도 보존됩니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 팔복의 간결하고 격조 있는 문체에도 잘 맞습니다. 「복이 있습니다」와 「볼 것입니다/볼 것이기 때문입니다」는 모두 자연스러운 문어적 표현입니다.
  terminology: 「정결한」은 καθαροί에 적절하며, 「하나님」은 한국어 성경 문맥에서 자연스러운 신명칭입니다. 「하나님을 볼 것이다」를 해석적으로 확장하지 않아 본문의 신학적 여지를 보존합니다.
