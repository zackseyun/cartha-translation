  text: 또 만일 여러분의 오른손이 여러분을 걸려 넘어지게 하거든, 그것을 잘라 내어 버리십시오. 여러분의 지체 하나가 없어지는 것이 여러분의 온몸이 게헨나에 들어가는 것보다 여러분에게 유익하기 때문입니다.
