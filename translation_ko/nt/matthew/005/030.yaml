review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional warning, the right hand, the stumbling metaphor, the contrast between one bodily member and the whole body, and the destination 'Gehenna.' However, '찍어' is not the most natural or precise contemporary Korean equivalent for ἔκκοψον when referring to a hand; '잘라 내어' more clearly conveys cutting off. The second imperative βάλε ἀπὸ σοῦ should also be represented explicitly as discarding it.
  naturalness: The formal-polite register is consistent. '여러분에게서 던져 버리십시오' is grammatically understandable but awkward and overly literal in Korean. '잘라 내어 버리십시오' is natural and forceful while conveying removal and disposal.
  terminology: '''게헨나'' appropriately preserves γέεννα rather than prematurely equating it with a later doctrinally loaded Korean term for hell. ''지체'' is a suitable formal rendering of μέλος. ''걸려 넘어지게 하거든'' preserves the metaphor of σκανδαλίζει without reducing it solely to ''sin.'''
  issues:
  - severity: medium
    issue: '''찍어 여러분에게서 던져 버리십시오'' is awkward and only imprecisely expresses the paired commands.'
    rationale: ἔκκοψον means 'cut off,' and βάλε ἀπὸ σοῦ means 'throw/cast away from yourself.' In modern Korean, '잘라 내어 버리십시오' naturally conveys decisive severance and disposal without the unnatural phrase '여러분에게서 던져 버리십시오.'
  revised_text: 또 만일 여러분의 오른손이 여러분을 걸려 넘어지게 하거든, 그것을 잘라 내어 버리십시오. 여러분의 지체 하나가 없어지는 것이 여러분의 온몸이 게헨나에 들어가는 것보다 여러분에게 유익하기 때문입니다.
