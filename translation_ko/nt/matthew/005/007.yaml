review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders μακάριοι, the substantival plural οἱ ἐλεήμονες, and the future passive ἐλεηθήσονται. Revising the Korean subject to an overt plural better reflects the Greek plural and removes the minor singular/plural mismatch. ‘그들도’ appropriately conveys the emphasis of αὐτοὶ without identifying the unstated agent of the passive.
  naturalness: ‘긍휼히 여김을 받다’ is a natural, established formal Korean biblical expression. The plural wording ‘사람들은 … 그들도’ is smoother and more internally consistent than generic singular ‘사람은’ followed by plural ‘그들이.’
  terminology: ‘긍휼히 여기다’ preserves the lexical correspondence between ἐλεήμονες and ἐλεηθήσονται and is suitable for modern formal-polite Korean. No agent for the promised mercy is added.
  issues:
  - severity: low
    issue: Number consistency and emphasis
    rationale: The draft begins with generic singular ‘사람은’ but continues with plural ‘그들이.’ The Greek uses plural forms throughout, and αὐτοὶ is emphatic. Using ‘사람들은’ and ‘그들도’ preserves both features naturally.
  revised_text: 긍휼히 여기는 사람들은 복이 있습니다. 그들도 긍휼히 여김을 받을 것이기 때문입니다.
