review_pass:
  verdict: approve
  source_fidelity: 원문의 복수 실체화 형용사 οἱ πραεῖς를 일반적 복수 의미의 ‘온유한 사람’으로, 미래 동사 κληρονομήσουσι를 ‘유업으로 받을 것’으로 충실히 옮겼습니다. τὴν γῆν의 ‘땅’은 ‘땅/온 세상’ 어느 쪽으로도 들릴 수 있어 원문의 범위와 시편 37:11의 반향에 관한 열려 있는 의미를 보존합니다.
  naturalness: ‘온유한 사람은 복이 있습니다. 그들이 땅을 유업으로 받을 것이기 때문입니다.’는 현대 표준어 합쇼체로 자연스럽고, 간결한 복 선언의 문체에도 잘 맞습니다. ‘유업으로 받다’는 일상어보다는 성서적 문맥에 어울리는 자연스러운 정형 표현입니다.
  terminology: ‘온유한’은 πραεῖς의 온화함·겸양·절제된 힘을 적절히 담으며, ‘겸손한’이나 ‘유순한’보다 이 구절과 시편 37:11의 전통적 어휘 연계를 잘 보존합니다. ‘복이 있습니다’와 ‘유업’도 한국어 성서 문맥에서 안정된 용어입니다.
  issues: []
  revised_text: 온유한 사람은 복이 있습니다. 그들이 땅을 유업으로 받을 것이기 때문입니다.
