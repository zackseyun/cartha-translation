id: MAT.19.9
reference: Matthew 19:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
  footnotes:
  - marker: a
    text: Or 'except on the ground of sexual immorality.' The Greek phrase may also be rendered more narrowly as 'except for fornication' or interpreted by some as 'except for sexual unfaithfulness.'
    reason: lexical_alternative
  - marker: b
    text: 'Some manuscripts omit: ''and whoever marries a divorced woman commits adultery.'''
    reason: textual_variant
translation:
  language: ko
  text: 그러나 내가 여러분에게 말합니다. 누구든지 성적 부도덕을 제외하고[a] 자기 아내와 이혼하고 다른 여자와 결혼하면, 간음합니다. 그리고 이혼한 여자와 결혼하는 사람도 간음합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성적 부도덕을 근거로 한 경우가 아니면.’ 그리스어 단어는 더 좁게 ‘음행’ 또는 ‘혼전 성관계’를 가리키는 것으로 이해될 수도 있고, 일부는 ‘성적 불성실’로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본은 ‘그리고 이혼한 여자와 결혼하는 사람도 간음합니다’를 생략합니다.
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  english_pob_choice: But I tell you
  chosen_korean: 내가 여러분에게 말합니다
  alternatives_korean:
  - 하지만 내가 여러분에게 말합니다
  - 내가 여러분에게 말합니다
  lexicon: BDAG
  rationale: δέ의 약한 전환을 한국어에서는 별도 ‘하지만’보다 문맥상 자연스러운 선언형으로 처리할 수 있어, 예수의 권위 있는 발화를 살리면서도 합쇼체를 유지했습니다.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  english_pob_choice: divorces his wife
  chosen_korean: 자기 아내를 버리고
  alternatives_korean:
  - 자기 아내와 이혼하고
  - 자기 아내를 내보내고
  lexicon: BDAG
  rationale: ἀπολύω는 이혼 맥락에서 ‘버리다/내보내다’와 ‘이혼하다’ 사이의 범위를 가지므로, 본문이 드러내는 결혼 파기 행위를 살리면서도 법률 용어로 과도하게 좁히지 않기 위해 ‘버리고’를 택했습니다.
- source_word: μὴ ἐπὶ πορνείᾳ
  english_pob_choice: except for sexual immorality
  chosen_korean: 음행을 이유로 하지 않고
  alternatives_korean:
  - 음행을 제외하고
  - 성적 부정을 제외하고
  - 성적 부도덕을 이유로 하지 않고
  lexicon: BDAG
  rationale: πορνεία의 범위를 POB의 ‘sexual immorality’처럼 넓게 유지하되, 한국어에서는 예수의 조건절 의미를 자연스럽게 풀어 ‘이유로 하지 않고’로 옮겼습니다.
- source_word: γυναῖκα ... ἄλλην
  english_pob_choice: wife ... another
  chosen_korean: 아내 ... 다른 여자
  alternatives_korean:
  - 아내 ... 다른 사람
  - 아내 ... 다른 여자
  lexicon: BDAG
  rationale: ἄλλην은 여성형이므로 문맥상 ‘다른 여자’가 가장 직접적이며, 한국어에서 ‘다른 여자와 결혼하다’는 자연스럽고 원문 대조도 분명합니다.
- source_word: ἀπολελυμένην γαμήσας
  english_pob_choice: marries a divorced woman
  chosen_korean: 버림받은 여자와 결혼하는 사람
  alternatives_korean:
  - 이혼한 여자와 결혼하는 사람
  - 버려진 여자와 결혼하는 사람
  lexicon: BDAG
  rationale: 완료 수동 분사 ἀπολελυμένην은 ‘이혼된/버림받은’ 상태를 가리키므로, 첫 절의 ἀπολύω와 대응되도록 ‘버림받은 여자’로 옮겨 반복되는 행위-상태 연결을 드러냈습니다.
theological_decisions:
- issue: πορνεία의 범위와 예외절 처리
  chosen_reading: 예외절을 ‘음행을 이유로 하지 않고’로 두어, 예외의 범위를 좁히지 않은 채 독자가 해석상의 긴장을 보도록 했습니다.
  alternative_readings:
  - 간음 때문에만
  - 성적 부정 때문에만
  - 간음 외의 성적 부정 때문에
  rationale: 원어 πορνεία는 간음보다 넓을 수 있어, 특정 교리적 결론을 미리 확정하지 않고 POB의 소스-직결 원칙에 맞게 넓은 범위를 유지하는 것이 적절합니다.
  doctrine_reference: 혼인·이혼 본문에서 해석이 갈리는 예외절이므로, 원문 범위를 보존하고 신학적 긴장을 해소하지 않습니다.
- issue: 마지막 절의 본문 포함 여부
  chosen_reading: SBLGNT 본문에 있는 마지막 절을 본문에 포함하고, 각주로 사본 차이를 밝혔습니다.
  alternative_readings:
  - 마지막 절을 본문에서 생략
  - 각주 없이 본문에만 포함
  rationale: 제공된 원문이 해당 절을 포함하고 있으므로 번역 본문에도 반영하되, 사본 변이를 독자가 확인할 수 있도록 주석화했습니다.
  doctrine_reference: 원문 우선과 변이 기록의 투명성
