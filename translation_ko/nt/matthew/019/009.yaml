  verdict: revise
  source_fidelity: ‘버리고’와 ‘버림받은 여자’는 혼인 맥락의 ἀπολύω 및 완료수동분사 ἀπολελυμένην이 가리키는 이혼의 법적·관계적 의미를 충분히 명시하지 못합니다. 각각 ‘이혼하고’, ‘이혼한 여자’로 옮기는 것이 원문에 더 충실합니다. 예외절은 πορνεία의 넓은 범위를 보존하여 ‘성적 부도덕을 제외하고’로 번역하고, 대안은 각주에 남겼습니다.
  naturalness: ‘자기 아내를 버리고’와 ‘버림받은 여자’는 현대 표준어 성경 문맥에서 이혼보다 유기나 방치를 우선 떠올리게 할 수 있습니다. ‘자기 아내와 이혼하고’, ‘이혼한 여자’가 자연스럽고 의미가 명확합니다. 각주 표지는 해당 예외절과 본문 비평상 변이가 있는 마지막 절에 직접 붙였습니다.
  terminology: ἀπολύω 계열은 두 절에서 일관되게 ‘이혼하다/이혼한’으로 처리했습니다. πορνεία는 ‘성적 부도덕’으로 넓게 옮겨 ‘간음’으로 한정하지 않았으며, μοιχᾶται는 ‘간음합니다’로 유지했습니다.
  issues:
