  source_fidelity: 원문의 병렬 구조(καὶ … καὶ), ‘많은 무리’의 추종, 그리고 그 자리에서의 치유를 충실히 전달합니다. ‘예수께서는’은 문맥상 αὐτός의 지시 대상을 명시한 것으로, 의미를 부당하게 확장하지 않습니다.
  naturalness: ‘그리고 많은 무리가 그를 따랐고, 예수께서는 거기에서 그들을 고쳐 주셨습니다’는 현대 표준 한국어 합쇼체로 자연스럽고 읽기 쉽습니다. ‘고쳐 주셨습니다’는 복음서 치유 서술에 자연스러운 존대 표현입니다.
  terminology: ‘따랐고’는 ἀκολουθέω의 서술적 의미를 중립적으로 유지하며, ‘많은 무리’와 ‘고쳐 주셨습니다’도 각각 ὄχλοι πολλοί와 ἐθεράπευσεν에 적절합니다. 별도의 신학적 전문용어 또는 교파적 해석을 덧붙이지 않았습니다.
