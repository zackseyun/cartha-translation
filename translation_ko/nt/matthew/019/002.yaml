id: MAT.19.2
reference: Matthew 19:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοί, καὶ ἐθεράπευσεν αὐτοὺς ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/002.yaml
  text: And large crowds followed him, and he healed them there.
translation:
  language: ko
  text: 그리고 많은 무리가 그를 따랐고, 예수께서는 거기에서 그들을 고쳐 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν αὐτῷ
  english_pob_choice: followed him
  chosen_korean: 그를 따랐고
  alternatives_korean:
  - 그 뒤를 따랐고
  - 그를 따라갔고
  lexicon: BDAG
  rationale: ἀκολουθέω의 서술적 의미를 자연스럽게 살리되, 이 문맥에서 제자도 뉘앙스를 과도하게 추가하지 않도록 ‘따랐고’로 옮겼습니다.
- source_word: ὄχλοι πολλοί
  english_pob_choice: large crowds
  chosen_korean: 많은 무리
  alternatives_korean:
  - 큰 무리
  - 수많은 무리
  lexicon: BDAG
  rationale: 직역의 어색함을 피하면서도 ‘many crowds’의 중의적 복수를 자연스럽게 드러내는 한국어 표현으로 ‘많은 무리’를 택했습니다.
- source_word: ἐθεράπευσεν
  english_pob_choice: he healed
  chosen_korean: 고쳐 주셨습니다
  alternatives_korean:
  - 치유하셨습니다
  - 낫게 하셨습니다
  lexicon: BDAG
  rationale: 복음서 서술에서 θεραπεύω의 넓은 치유 의미를 살리되, 한국어에서 행위의 자비성과 결과를 함께 드러내는 ‘고쳐 주셨습니다’가 가장 자연스럽습니다.
- source_word: ἐκεῖ
  english_pob_choice: there
  chosen_korean: 거기에서
  alternatives_korean:
  - 거기서
  - 그곳에서
  lexicon: BDAG
  rationale: 장소 부사의 단순한 위치 의미를 보존하되, 이어지는 동작의 장소를 분명히 하는 표준어 표현으로 옮겼습니다.
theological_decisions:
- issue: 군중이 예수를 ‘따랐다’는 서술의 범위
  chosen_reading: 일반적인 추종/동행의 서술로 읽고, 제자도 선언으로 확대하지 않았습니다.
  alternative_readings:
  - 제자적 추종을 함축하는 표현으로 읽을 수 있음
  - 단순 이동 동작으로만 읽을 수 있음
  rationale: 본문은 예수의 치유 사역을 배경으로 군중의 이동과 예수의 행위를 병렬로 제시할 뿐이므로, 문맥이 요구하는 범위를 넘지 않도록 중립적으로 처리했습니다.
  doctrine_reference: 복음서 서술 맥락과 ἀκολουθέω의 문맥적 의미
