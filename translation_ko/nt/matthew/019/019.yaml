  rationale: πλησίον은 레위기 19:18과 예수의 용법에서 관계적 ‘이웃’을 뜻하므로, 표준적이면서도 성경적 의미를 유지하는 ‘이웃’이 적절합니다.
- source_word: ὡς σεαυτόν
