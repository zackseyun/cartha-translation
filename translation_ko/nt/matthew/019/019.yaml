  rationale: 미래형이지만 계명 인용문 맥락에서는 명령으로 기능하므로, 현대 한국어에서는 직접 명령형으로 옮겨 같은 윤리적 힘을 유지합니다.
- source_word: τὸν πλησίον σου
  english_pob_choice: your neighbor
  chosen_korean: 이웃
