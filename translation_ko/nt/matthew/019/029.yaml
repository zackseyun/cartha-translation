  source_fidelity: 원문의 항목 열거(집, 형제, 자매, 아버지, 어머니, 아내, 자녀, 밭), ‘내 이름을 위하여’라는 동기, ‘백 배’와 영원한 생명의 상속을 충실히 반영합니다. 다만 한국어에서는 ‘내 이름을 위해’가 열거 뒤에서 ‘밭’에만 걸리는 듯 읽힐 수 있어, 수식 범위를 분명히 하는 편이 좋습니다. κληρονομήσει는 ‘상속받다’가 더 직접적입니다.
  naturalness: ‘내 이름을 위하여’를 목적어 열거 앞에 두고, ‘백 배를 받을 것이며’로 다듬으면 현대 표준어 합쇼체에서 더 자연스럽고 문장 구조가 명료합니다.
  terminology: ‘내 이름’, ‘영원한 생명’, ‘상속받다’는 원문의 관용 및 핵심 어휘를 적절히 보존합니다. 기존 각주는 ‘백 배’ 자체를 전통적으로 풀어 옮긴 표현이라고 설명하여 실제 표현 및 각주 목적과 맞지 않으므로, 가능한 대안을 제시하도록 고칩니다.
