id: MAT.19.29
reference: Matthew 19:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
  footnotes:
  - marker: a
    text: Or, more traditionally, 'a hundredfold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 누구든지 내 이름을 위하여 집이나 형제나 자매나 아버지나 어머니나 아내나 자녀나 밭을 버린 사람은 백 배를 받을 것이며 영원한 생명을 상속받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백 곱절’.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὅστις
  english_pob_choice: everyone who
  chosen_korean: 누구든지
  alternatives_korean:
  - 모든 사람으로서
  - 누구나
  lexicon: BDAG
  rationale: 분배적·일반적 조건문을 자연스러운 현대 한국어로 살리기 위해 ‘누구든지’로 옮겼습니다.
- source_word: ἀφῆκεν
  english_pob_choice: has left
  chosen_korean: 버린
  alternatives_korean:
  - 떠난
  - 내버린
  - 포기한
  lexicon: BDAG
  rationale: 문맥이 가족과 소유를 위해 의도적으로 관계와 소유를 내려놓는 뜻이므로, 단순한 이동보다 결단성을 드러내는 ‘버린’이 적절합니다.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  english_pob_choice: for the sake of my name
  chosen_korean: 내 이름을 위해
  alternatives_korean:
  - 내 이름 때문에
  - 내 이름을 위하여
  - 내 이름을 위하는 까닭에
  lexicon: BDAG
  rationale: ‘이름’이라는 성경적 관용구를 유지하면서도 한국어로 자연스럽게 읽히도록 ‘내 이름을 위해’로 옮겼습니다.
- source_word: ἑκατονταπλασίονα
  english_pob_choice: a hundredfold / a hundred times as much
  chosen_korean: 백 배
  alternatives_korean:
  - 백 배나
  - 백 곱절
  lexicon: BDAG
  rationale: 전통적이면서도 간결한 수량 표현을 택해 원문의 과장된 보상을 직접적으로 드러냈습니다.
theological_decisions:
- issue: 가족·소유 포기의 범위
  chosen_reading: 가족과 소유를 위한 제자도의 대가를 분명히 드러내는 표현으로 읽었습니다.
  alternative_readings:
  - 비유적 헌신 일반
  - 과장된 수사
  rationale: 열거된 항목들이 실제 관계와 재산을 가리키므로, 추상화하지 않고 구체적 포기의 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §4
- issue: ‘이름’의 보존
  chosen_reading: ‘내 이름’은 단순히 ‘나’를 바꾸어 말한 것이 아니라 예수의 인격과 권위를 가리키는 관용구로 보존했습니다.
  alternative_readings:
  - 나를 위해
  - 내 명예를 위해
  rationale: 소스의 신학적 무게를 유지하기 위해 ‘이름’이라는 표현을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §6
