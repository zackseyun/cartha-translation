review_pass:
  verdict: revise
  source_fidelity: 수정안은 Ἄφετε의 허용 명령, μὴ κωλύετε의 금지, πρός με의 ‘내게’, 그리고 γάρ가 제시하는 근거를 모두 유지합니다. τοιούτων은 ‘이런 이들’로 옮겨 현장의 아이들과 그들이 대표할 수 있는 부류 사이의 범위를 확정하지 않습니다.
  naturalness: 초안의 ‘아이들이 내게 오는 것을 허락하고’도 이해되지만 다소 행정적이며, ‘아이들이 내게 오도록 두고’가 현대 표준어 합쇼체에서 더 자연스럽습니다. 또한 ‘하늘 나라는 바로 … 것입니다’는 γάρ의 인과를 명시하지 않으므로 ‘… 것이기 때문입니다’로 다듬었습니다.
  terminology: ‘예수님’, ‘하늘 나라’는 한국어 성경 문체와 마태복음의 χαρακτηρισ적 표현에 잘 맞습니다. ‘이런 이들’은 ‘어린아이와 같은 사람들’처럼 본문이 밝히지 않는 특성을 해석적으로 보충하지 않습니다.
  issues:
  - severity: low
    issue: Ἄφετε의 한국어 표현이 다소 행정적입니다.
    rationale: ‘허락하고’는 의미상 가능하나, 이 문맥의 직접적인 허용 명령에는 ‘오도록 두고’가 더 자연스럽습니다.
  - severity: medium
    issue: γάρ의 근거 제시가 번역문에서 충분히 드러나지 않습니다.
    rationale: ‘하늘 나라는 바로 이런 사람들의 것입니다’는 진술 자체는 전달하지만, 앞선 명령의 이유를 제시하는 γάρ를 명시적으로 반영하지 않습니다.
  revised_text: 예수님께서 말씀하셨습니다. “아이들이 내게 오도록 두고, 그들이 내게 오는 것을 막지 마십시오. 하늘 나라는 이런 이들의 것이기 때문입니다.”[a]
  revised_footnotes:
