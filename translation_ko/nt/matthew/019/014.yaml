id: MAT.19.14
reference: Matthew 19:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
  footnotes:
  - marker: a
    text: Or, more literally, “for of such is the kingdom of heaven.”
    reason: lexical_alternative
  - marker: b
    text: “Such as these” can refer not only to the children present but also to people of such a kind.
    reason: alternative_reading
translation:
  language: ko
  text: 예수님께서 말씀하셨습니다. “아이들이 내게 오도록 두고, 그들이 내게 오는 것을 막지 마십시오. 하늘 나라는 이런 이들의 것이기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이런 이들’은 눈앞의 아이들뿐 아니라 그들이 대표하는 부류를 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφετε
  english_pob_choice: Let
  chosen_korean: 허락하고
  alternatives_korean:
  - 가게 하십시오
  - 두십시오
  lexicon: BDAG
  rationale: Ἄφετε는 여기서 단순한 방치가 아니라 ‘오게 하라/허락하라’는 명령으로 기능하므로, 한국어에서는 자연스럽고 직접적인 ‘허락하고’로 옮겼습니다.
- source_word: τὰ παιδία
  english_pob_choice: the children
  chosen_korean: 아이들이
  alternatives_korean:
  - 어린아이들이
  - 어린이들이
  lexicon: BDAG
  rationale: παιδία는 문맥상 아이들을 가리키며, ‘아이들’이 과도한 축소 없이 가장 자연스럽고 포괄적인 표현입니다.
- source_word: μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με
  english_pob_choice: do not hinder them from coming to me
  chosen_korean: 그들이 내게 오는 것을 막지 마십시오
  alternatives_korean:
  - 그들이 내게 오는 것을 방해하지 마십시오
  - 내게 오지 못하게 하지 마십시오
  lexicon: BDAG
  rationale: κωλύω는 ‘막다, 방해하다, 못 하게 하다’의 뜻이므로, 한국어에서는 ‘막지 마십시오’가 간결하면서도 금지의 힘을 잘 살립니다.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  english_pob_choice: the kingdom of heaven
  chosen_korean: 하늘 나라
  alternatives_korean:
  - 하늘의 나라
  - 하나님의 나라
  lexicon: BDAG
  rationale: 마태복음의 특징적 표현이므로 관용적으로 굳어진 ‘하늘 나라’를 유지했습니다. 한국어에서 ‘하늘의 나라’는 더 직역적이지만 덜 자연스럽습니다.
- source_word: τοιούτων
  english_pob_choice: such as these
  chosen_korean: 이런 사람들의
  alternatives_korean:
  - 이런 이들의
  - 이런 아이들의
  lexicon: BDAG
  rationale: τοιούτων은 눈앞의 아이들만이 아니라 그들이 대표하는 ‘그런 부류’를 가리킬 수 있으므로, 대표성을 살려 ‘이런 사람들의’로 옮겼습니다.
theological_decisions:
- issue: τοιούτων이 가리키는 범위
  chosen_reading: 문맥상의 아이들을 직접 가리키되, 그들이 대표하는 ‘그런 종류의 사람들’까지 열어 두는 번역을 택했습니다.
  alternative_readings:
  - 오직 눈앞의 아이들만 가리킨다고 좁게 번역
  - ‘어린아이와 같은 사람들’로 해석을 확정
  rationale: 본문은 아이들을 분명히 지시하지만, 예수님의 말씀은 그들로 상징되는 부류를 함께 시사합니다. 한국어도 이 긴장을 유지하도록 ‘이런 사람들의’로 처리했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
