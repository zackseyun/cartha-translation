    reason: alternative_reading
  revision_rationale: 명령의 자연스러운 한국어 표현을 사용하고, γάρ의 인과 관계를 ‘것이기 때문입니다’로 분명히 했습니다. ‘이런 이들’과 각주를 통해 τοιούτων의 대표적 범위를 보존했습니다.
