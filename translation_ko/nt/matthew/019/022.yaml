id: MAT.19.22
reference: Matthew 19:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
  footnotes:
  - marker: a
    text: Or 'this statement.' Greek 'the word' here refers to Jesus' preceding saying.
    reason: lexical_alternative
  - marker: b
    text: Or 'sorrowful.' The Greek participle describes his departing in a state of grief.
    reason: lexical_alternative
  - marker: c
    text: 'Traditionally ''great possessions.'' The Greek more literally emphasizes quantity: ''many possessions.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 그 젊은이는 이 말씀을 듣고 근심하며 떠나갔습니다. 그는 소유가 많았기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 말’로 옮길 수 있습니다. 여기서 λόγος는 예수의 앞선 발화를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘슬퍼하며’. 현재분사는 떠나는 동작과 함께 동반되는 상태를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로는 ‘큰 소유’로 옮겨지기도 하지만, 헬라어는 ποσότητα(수량)를 더 직접적으로 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νεανίσκος
  english_pob_choice: the young man
  chosen_korean: 그 젊은이
  alternatives_korean:
  - 그 젊은 사람
  - 젊은 청년
  lexicon: BDAG
  rationale: 본문은 이 인물을 단순히 ‘젊은이’로 지칭하므로, 병행복음의 추가 정보를 끌어오지 않고 자연스러운 한국어로 옮겼습니다.
- source_word: τὸν λόγον
  english_pob_choice: this word
  chosen_korean: 이 말씀
  alternatives_korean:
  - 이 말
  - 이 말씀이
  - 이 언급
  lexicon: BDAG
  rationale: 여기서 λόγος는 예수의 앞선 발화를 가리키므로, 문맥상 자연스럽고 복음서적 울림이 있는 ‘이 말씀’으로 옮겼습니다.
- source_word: λυπούμενος
  english_pob_choice: grieving
  chosen_korean: 근심하며
  alternatives_korean:
  - 슬퍼하며
  - 마음 아파하며
  - 비통해하며
  lexicon: BDAG
  rationale: 현재분사는 떠나는 동작과 함께 지속되는 내적 상태를 나타내므로, 한국어에서는 동작의 양태를 살리는 부사절로 풀어 ‘근심하며’로 옮겼습니다.
- source_word: κτήματα πολλά
  english_pob_choice: many possessions
  chosen_korean: 소유가 많았기 때문입니다
  alternatives_korean:
  - 많은 소유를 가지고 있었기 때문입니다
  - 재산이 많았기 때문입니다
  - 많은 재산을 가지고 있었기 때문입니다
  lexicon: BDAG
  rationale: πολλά는 전통적 ‘큰’보다 수량을 강조하므로, ‘많은 소유’의 의미를 살리되 한국어 문장에서는 이유절로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 부유함의 정도를 ‘great possessions’로 약화/의역할지 여부
  chosen_reading: ‘소유가 많았기 때문입니다’로 수량 중심을 유지했습니다.
  alternative_readings:
  - 재산이 컸기 때문입니다
  - 큰 소유가 있었기 때문입니다
  rationale: 본문의 πολλά는 크기보다 다수를 가리키므로, 전통적 관용을 따르기보다 양적 의미를 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: Original-language primacy over traditional ecclesial phrasing
