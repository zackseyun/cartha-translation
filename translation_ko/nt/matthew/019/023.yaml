language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
  footnotes:
  - marker: a
    text: Or, “Amen, I say to you.”
    reason: lexical_alternative
  - marker: b
    text: Or, “a wealthy man will hardly enter the kingdom of heaven.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 제자들에게 말씀하셨습니다. 「진실로 내가 여러분에게 말합니다. 부자는 하늘 나라에 들어가기가 어렵습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아멘, 내가 여러분에게 말합니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “부유한 사람은 하늘 나라에 겨우 들어갑니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δὲ Ἰησοῦς εἶπεν
  english_pob_choice: Then Jesus said
  chosen_korean: 예수께서 … 말씀하셨습니다
  alternatives_korean:
  - 그리고 예수께서 … 말씀하셨습니다
  - 그때 예수께서 … 말씀하셨습니다
  lexicon: SBLGNT
  rationale: δὲ의 전환 기능을 자연스러운 서술 연결로 처리했고, εἶπεν은 합쇼체 서술에서 가장 자연스러운 공손한 동사인 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  english_pob_choice: to his disciples
  chosen_korean: 제자들에게
  alternatives_korean:
  - 그의 제자들에게
  - 자신의 제자들에게
  lexicon: SBLGNT
  rationale: 관계가 문맥상 분명하므로 소유 대명사를 과도하게 반복하지 않고도 원문의 의미를 유지할 수 있습니다.
- source_word: Ἀμὴν λέγω ὑμῖν
  english_pob_choice: Truly I say to you
  chosen_korean: 진실로 내가 여러분에게 말합니다
  alternatives_korean:
  - 아멘, 내가 여러분에게 말합니다
  - 진실로 내가 너희에게 말합니다
  lexicon: SBLGNT
  rationale: Ἀμὴν의 엄숙한 서두는 ‘진실로’로 전달하되, 공적 خطاب에 맞게 ‘여러분’을 택해 현대 한국어 합쇼체의 자연스러움을 살렸습니다.
- source_word: πλούσιος δυσκόλως
  english_pob_choice: a rich man will enter ... with difficulty
  chosen_korean: 부자는 … 들어가기가 어렵습니다
  alternatives_korean:
  - 부자는 … 들어가기가 쉽지 않습니다
  - 부유한 사람은 … 들어가기가 어렵습니다
  lexicon: SBLGNT
  rationale: πλούσιος는 문장 구조상 실질적으로 ‘부자’라는 명사적 용법이므로 그대로 살렸고, δυσκόλως는 ‘어렵다’로 옮겨 ‘어렵게’보다 한국어 의미를 더 자연스럽게 전달했습니다.
- source_word: εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν
  english_pob_choice: will enter the kingdom of heaven
  chosen_korean: 하늘 나라에 들어가기가
  alternatives_korean:
  - 하늘 나라에 들어갈 것입니다
  - 하늘 나라 안으로 들어가기가
  lexicon: SBLGNT
  rationale: 마태복음의 고유 표현인 βασιλείαν τῶν οὐρανῶν은 관행에 따라 ‘하늘 나라’로 옮겼고, 미래 시제의 결과를 한국어 관용으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 하늘 나라 표현의 마태복음 관행 유지
  chosen_reading: 하늘 나라
  alternative_readings:
  - 천국
  - 하늘의 나라
  rationale: 마태의 βασιλεία τῶν οὐρανῶν은 단순한 장소가 아니라 하나님의 통치를 가리키므로, 전통적이지만 의미가 흐려질 수 있는 ‘천국’보다 ‘하늘 나라’가 본문 의도를 더 직접적으로 드러냅니다.
  doctrine_reference: POB translation philosophy §Kingdom terminology
- issue: Ἀμὴν λέγω ὑμῖν의 공적 발화 톤
  chosen_reading: 진실로 내가 여러분에게 말합니다
  alternative_readings:
  - 아멘, 내가 여러분에게 말합니다
  - 진실로 내가 너희에게 말합니다
  rationale: 예수의 권위 있는 선포를 보존하면서도 한국어 합쇼체의 청중 호칭을 사용해, 공개적 가르침의 엄숙함과 현대 독자의 가독성을 함께 살렸습니다.
  doctrine_reference: POB translation philosophy §Register
