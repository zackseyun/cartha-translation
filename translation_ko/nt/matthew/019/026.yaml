source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
  footnotes:
  - marker: a
    text: Or “With human beings this is impossible.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들을 바라보시고 그들에게 말씀하셨습니다. “사람에게는 이것이 불가능하지만, 하나님께는 모든 것이 가능합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  english_pob_choice: looked at
  chosen_korean: 바라보시고
  alternatives_korean:
  - 보시고
  - 유심히 바라보시고
  - 눈을 고정하시고
  lexicon: BDAG
  rationale: ἐμβλέπω의 핵심은 대상을 향해 시선을 두는 것이므로, 자연스러운 서술로 '바라보시고'를 택해 응시의 방향성을 살렸습니다.
- source_word: παρὰ ἀνθρώποις
  english_pob_choice: With men
  chosen_korean: 사람으로는
  alternatives_korean:
  - 사람에게는
  - 인간에게는
  - 사람의 관점에서는
  lexicon: BDAG
  rationale: παρά + 여격은 여기서 기준·관점의 의미를 띠므로, 직역투의 '사람으로는'이 대조 구조를 가장 간결하게 드러냅니다.
- source_word: ἀδύνατόν ἐστιν
  english_pob_choice: is impossible
  chosen_korean: 불가능하지만
  alternatives_korean:
  - 불가능합니다만
  - 할 수 없지만
  - 불가능하나
  lexicon: BDAG
  rationale: 문맥상 뒤의 대조절과 함께 읽히므로, 형용사구를 자연스럽게 연결하는 '불가능하지만'을 사용했습니다.
- source_word: πάντα δυνατά
  english_pob_choice: all things are possible
  chosen_korean: 모든 것이 가능합니다
  alternatives_korean:
  - 모든 것이 가능한 것입니다
  - 모든 것이 가능합니다만
  - 모든 것이 할 수 있습니다
  lexicon: BDAG
  rationale: πάντα + δυνατά의 전면적 선언을 한국어의 표준적인 가능 표현으로 옮겨, 속담적·선언적 힘을 유지했습니다.
theological_decisions:
- issue: ἄνθρωποις의 일반적 인간성 표지
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 사람들
  - 인류
  rationale: 여기서는 예수께서 인간의 한계를 일반적으로 말씀하시는 문맥이므로, 남성 복수의 대표성을 살리되 현대 한국어에서 무리 없는 일반명사 '사람'으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
