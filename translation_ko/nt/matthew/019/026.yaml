- from: 예수께서 그들을 바라보시고 말씀하셨습니다. "사람으로는 이것이 불가능하지만, 하나님으로는 모든 것이 가능합니다."[a]
  to: 예수께서 그들을 바라보시고 그들에게 말씀하셨습니다. “사람에게는 이것이 불가능하지만, 하나님께는 모든 것이 가능합니다.”
  rationale: 원문의 ἐμβλέψας, εἶπεν αὐτοῖς, 그리고 ‘사람’과 ‘하나님’의 παρά + 여격 대조를 보존했습니다. 불필요하고 내용상 중복된 각주는 삭제했으며, 본문을 현대 표준어 합쇼체로 다듬었습니다.
