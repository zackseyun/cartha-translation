id: MAT.19.21
reference: Matthew 19:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
  footnotes:
  - marker: a
    text: Or “perfect.” The Greek word can mean “perfect,” “complete,” or “mature.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. 「당신이 온전하기를[a] 원하시면, 가서 당신의 소유를 팔아 가난한 사람들에게 주십시오. 그러면 하늘에 보화를 얻게 될 것입니다. 그런 다음 와서 나를 따르십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “완전하기를”, “성숙하기를”. 그리스어 단어는 “완전한”, “온전한”, “성숙한”을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  english_pob_choice: said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: BDAG
  rationale: 예수의 직접 화행을 자연스러운 현대 서술로 옮기되, 합쇼체 서술과 잘 맞는 공손한 동사인 ‘말씀하셨습니다’를 택했습니다.
- source_word: τέλειος
  english_pob_choice: complete
  chosen_korean: 완전하기를
  alternatives_korean:
  - 완전무결하기를
  - 온전하기를
  - 완성되기를
  lexicon: BDAG
  rationale: POB의 audited sense처럼 τέλειος의 핵심은 죄 없는 완벽성보다 결핍 없는 온전함에 가깝지만, 한국어 본문에서는 그 긴장을 살리기 위해 직설적으로 ‘완전하기를’로 옮겼습니다.
- source_word: τὰ ὑπάρχοντα
  english_pob_choice: your possessions
  chosen_korean: 네 소유
  alternatives_korean:
  - 네 재산
  - 네가 가진 것들
  - 네 소유물
  lexicon: BDAG
  rationale: 물질적 소유를 가리키는 표현이므로, 소유의 범위를 과도하게 좁히지 않는 ‘네 소유’가 가장 직접적입니다.
- source_word: πτωχοῖς
  english_pob_choice: the poor
  chosen_korean: 가난한 사람들에게
  alternatives_korean:
  - 가난한 이들에게
  - 빈자들에게
  lexicon: BDAG
  rationale: 명사적 표현을 한국어에서 자연스럽게 풀어, 집합명사 느낌이 살아 있는 ‘가난한 사람들에게’로 옮겼습니다.
- source_word: θησαυρὸν ἐν οὐρανοῖς
  english_pob_choice: treasure in heaven
  chosen_korean: 하늘에 보물을
  alternatives_korean:
  - 하늘들에 보물을
  - 하늘 나라에 보물을
  lexicon: BDAG
  rationale: 그리스어 복수형 ‘하늘들’의 형태는 살리되, 한국어에서는 관용적으로 ‘하늘에’로 두어 의미를 자연스럽게 전달했습니다.
- source_word: ἀκολούθει μοι
  english_pob_choice: follow me
  chosen_korean: 나를 따르십시오
  alternatives_korean:
  - 나를 따르세요
  - 나를 따르라
  lexicon: BDAG
  rationale: 제자도 초청의 표준 표현을 살리면서, 본문의 직접 명령을 합쇼체로 옮겼습니다.
theological_decisions:
- issue: τέλειος의 신학적 뉘앙스
  chosen_reading: ‘완전하기를’로 옮겨, 단순한 도덕적 흠없음이 아니라 예수께 대한 전인적 순종과 결핍 없는 헌신의 요구를 드러냈습니다.
  alternative_readings:
  - 온전하기를
  - 성숙하기를
  - 완벽하기를
  rationale: 문맥은 재물에 대한 집착을 내려놓고 제자도를 완성하라는 요구이므로, ‘완전’은 그 요구의 강도를 유지하면서도 종교적 정형어로 약화되지 않게 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
