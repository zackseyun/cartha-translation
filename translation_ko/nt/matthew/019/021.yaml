  naturalness: ‘네가’와 ‘주십시오/따르십시오’의 결합은 현대 합쇼체에서 호응이 다소 어색합니다. ‘당신이/당신의’로 통일하고, ‘보물을 차지하게’는 ‘보화를 얻게’로 다듬으면 자연스럽습니다.
  terminology: τέλειος는 문맥상 죄 없는 완전성을 단정하지 않도록 ‘온전하기를’을 본문으로 택하고, ‘완전하기를’과 ‘성숙하기를’을 각주 대안으로 제시합니다. θησαυρός는 성서 한국어의 자연스러운 표현인 ‘보화’로 옮깁니다.
