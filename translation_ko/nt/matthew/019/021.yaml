- from: 예수께서 그에게 말씀하셨습니다. 「네가 완전하기를 원하면, 가서 네 소유를 팔아 가난한 사람들에게 주십시오. 그러면 하늘에 보물을 차지하게 될 것입니다. 그리고 와서 나를 따르십시오.」[a]
  to: 예수께서 그에게 말씀하셨습니다. 「당신이 온전하기를[a] 원하시면, 가서 당신의 소유를 팔아 가난한 사람들에게 주십시오. 그러면 하늘에 보화를 얻게 될 것입니다. 그런 다음 와서 나를 따르십시오.」
  rationale: τέλειος의 의미 범위를 본문과 각주에 함께 보존하되, 본문은 문맥상 ‘온전하기를’로 번역했습니다. 각주를 실제 대안으로 고치고 표지를 해당 어휘에 붙였습니다. 또한 합쇼체 문체를 일관되게 하고 ‘보화’를 사용하여 자연스러운 성서 한국어 표현으로 다듬었습니다.
