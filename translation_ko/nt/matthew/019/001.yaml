  - marker: a
    text: Or "across the Jordan."
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 이 말씀들을 마치셨을 때, 갈릴리에서 떠나 유대 지방, 요단 강 건너편으로 가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “요단 강 건너편으로.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  english_pob_choice: And it happened
  chosen_korean: 그때 일이 이렇게 되었습니다
  alternatives_korean:
  - 그리고 이런 일이 일어났습니다
  - 그때 이렇게 되었습니다
  lexicon: BDAG
  rationale: 마태복음의 서술 전환을 자연스러운 현대 한국어로 옮기되, 단순 접속보다 사건 전개를 여는 서술 뉘앙스를 살렸습니다.
- source_word: ὅτε ἐτέλεσεν τοὺς λόγους τούτους
  english_pob_choice: when ... had finished these words
  chosen_korean: 이 말씀들을 마치셨을 때
  alternatives_korean:
  - 이 말씀들을 끝내셨을 때
  - 이 말씀들을 다 마치신 뒤
  lexicon: BDAG
  rationale: 앞선 긴 가르침의 종결을 분명히 드러내기 위해 ‘마치셨을 때’를 택했습니다.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  english_pob_choice: the region of Judea
  chosen_korean: 유대 지방
  alternatives_korean:
  - 유대의 지역
  - 유대의 경계
  lexicon: BDAG
  rationale: ὅρια는 이 문맥에서 경계선보다 지역/영역을 가리키므로, 지리적 흐름이 살아나는 ‘유대 지방’이 적절합니다.
- source_word: πέραν τοῦ Ἰορδάνου
  english_pob_choice: beyond the Jordan
  chosen_korean: 요단 강 건너편
  alternatives_korean:
  - 요단 강 너머
  - 요단 강 건너쪽
  lexicon: BDAG
  rationale: 방향성을 살리면서도 한국어 지리 표현으로 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 서술 전환의 톤
  chosen_reading: 직역 투보다 한국어 서술 흐름을 우선하되, 사건 연결과 예수의 이동을 분명히 유지했습니다.
  alternative_readings:
  - ‘그리고 일이 일어났습니다’처럼 더 직역적으로 옮기는 방식
  rationale: 이 절은 신학적 난점보다 내러티브 연결이 핵심이므로, 현대 한국어 독자가 자연스럽게 따라가도록 하면서 원문의 사건 전환 기능은 보존했습니다.
  doctrine_reference: 복음서 서술 문체
