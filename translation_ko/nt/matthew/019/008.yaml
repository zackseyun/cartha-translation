id: MAT.19.8
reference: Matthew 19:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
  footnotes:
  - marker: a
    text: Or, “for your hard-heartedness.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “to send away your wives”; in this context the meaning is divorce.
    reason: lexical_alternative
  - marker: c
    text: That is, this concession did not reflect the original order from creation.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. “너희 마음이 완악하기 때문에[a] 모세가 너희에게 아내들과 이혼하도록[b] 허용했습니다. 그러나 처음부터는 그렇지 않았습니다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 마음의 완악함 때문에’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희 아내들을 보내도록’입니다. 이 문맥에서는 이혼을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 이 허용은 창조 때의 원래 질서를 반영한 것이 아니었습니다.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  english_pob_choice: He said to them
  chosen_korean: 예수께서 그들에게 말씀하셨습니다
  alternatives_korean:
  - 예수께서 그들에게 이르십니다
  - 그들에게 말씀하십니다
  lexicon: SBLGNT
  rationale: 서술 문맥에서는 역사적 현재를 한국어 자연문에 맞게 과거 서술로 옮기되, 화자 표시는 예수의 직접 발화를 분명히 드러내기 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  english_pob_choice: Because of your hardness of heart
  chosen_korean: 너희 마음이 완악하기 때문에
  alternatives_korean:
  - 너희 마음의 완악함 때문에
  - 너희의 완악한 마음 때문에
  lexicon: BDAG
  rationale: πρός + 대격의 원인/근거를 ‘때문에’로 자연스럽게 살렸고, ‘마음이 완악하다’는 성경적 관용을 보존했습니다.
- source_word: ἐπέτρεψεν
  english_pob_choice: permitted
  chosen_korean: 허용했지만
  alternatives_korean:
  - 허락했지만
  - 용납했지만
  lexicon: BDAG
  rationale: 모세의 행위가 명령이 아니라 허가/양보라는 점을 분명히 하기 위해 ‘허용하다’를 사용했습니다.
- source_word: ἀπολῦσαι τὰς γυναῖκας ὑμῶν
  english_pob_choice: to divorce your wives
  chosen_korean: 너희에게 너희 아내를 버리도록
  alternatives_korean:
  - 너희 아내와 이혼하도록
  - 너희 아내를 보내도록
  lexicon: BDAG
  rationale: 문자적으로는 ‘보내다/내보내다’이지만 이 결혼 문맥에서는 이혼을 가리키므로, POB 영어의 해석을 따라 한국어로도 법적 의미를 드러냈습니다.
- source_word: ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως
  english_pob_choice: but from the beginning it has not been so
  chosen_korean: 하지만 처음부터 그렇게 된 것은 아니었습니다
  alternatives_korean:
  - 하지만 처음부터 그렇게 된 것은 아니었습니다
  - 그러나 처음부터 그런 것은 아니었습니다
  lexicon: BDAG
  rationale: γέγονεν의 완료 시상에 맞춰 현재까지의 상태를 반영하는 자연스러운 한국어로 옮겼으며, 창조 질서에 대한 함의를 본문 수준에서 과도하게 풀어내지 않았습니다.
theological_decisions:
- issue: 모세의 조치의 성격
  chosen_reading: 허용/양보로 이해했습니다
  alternative_readings:
  - 명령으로 이해했습니다
  - 단순 허가로만 이해했습니다
  rationale: ἐπέτρεψεν은 명령이 아니라 허용을 뜻하므로, 예수의 논증에서 모세의 규정은 타락한 인간 상태에 대한 양보로 제시되어야 합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘처음부터’의 창조 논지
  chosen_reading: 본문의 표현을 유지하고 창조 질서는 암시로 남겼습니다
  alternative_readings:
  - 하나님의 창조 뜻이 아니었습니다로 확장
  - 원래 그렇게 되어 있지 않았습니다로 완화
  rationale: 예수의 논지는 분명 창조 질서를 가리키지만, 본문이 직접 말하는 범위를 넘는 신학적 확장은 본문으로부터 분리해 두는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3
