  source_fidelity: 핵심 동사 ἀπολῦσαι는 이혼 문맥에서 ‘이혼하다’로 옮기는 것이 적절합니다. 초안의 ‘아내를 버리도록’은 법적·혼인 관계의 의미를 ‘버리다’로 바꾸어, 원문의 이혼 의미보다 넓고 부정적인 유기 의미를 불필요하게 덧붙입니다. 마지막 절은 원문의 상태 진술을 자연스럽게 보존하여 ‘처음부터는 그렇지 않았습니다’로 옮겼습니다.
  naturalness: ‘아내들과 이혼하도록’은 현대 표준 한국어에서 자연스럽고, 대상이 복수인 그리스어의 뜻도 무리 없이 전달합니다. 각 주석 표지를 해당 어구에 붙여 독자가 주석의 적용 대상을 명확히 알 수 있게 했습니다.
  terminology: ‘마음이 완악하다’, ‘허용하다’, ‘이혼하다’는 본문의 종교적·법적 문맥에 맞는 현대적이고 격식 있는 표현입니다. ‘허용했습니다’는 ἐπέτρεψεν이 명령이나 적극적 승인보다 허가를 뜻한다는 점을 보존합니다.
