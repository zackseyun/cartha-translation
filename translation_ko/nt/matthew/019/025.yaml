  verdict: revise
  source_fidelity: 원문의 시간적 분사 ἀκούσαντες는 ‘그 말을 들은’으로, 강한 놀라움 ἐξεπλήσσοντο σφόδρα는 ‘몹시 놀라서’로, 추론의 ἄρα는 ‘그렇다면’으로, σωθῆναι는 구원 문맥에 맞게 ‘구원을 받을 수 있습니까’로 충실히 옮겼습니다. 다만 원문의 ‘놀라움’과 발화를 연결하는 한국어 표현은 수정이 필요합니다.
  naturalness: ‘몹시 놀라며 말했습니다’는 놀라는 행위와 말하는 행위가 단순 병렬·동시 진행처럼 들려 다소 어색합니다. 원문의 반응-발화 관계를 자연스럽게 드러내는 ‘몹시 놀라서 말했습니다’가 현대 표준 한국어 합쇼체 서술에 더 적합합니다.
  terminology: ‘제자들’, ‘구원’, ‘구원을 받을 수 있습니까’는 복음서 문맥과 한국어 성서 번역 관습에 맞고, 특정 교리적 해석을 덧붙이지 않습니다. 기존 각주는 본문과 사실상 같은 의미의 어색한 직역을 제시할 뿐 번역상 필요한 정보를 제공하지 않으므로 삭제하는 편이 낫습니다.
  issues:
  - severity: low
    issue: ‘몹시 놀라며 말했습니다’의 연결 표현
    rationale: λέγοντες는 놀란 제자들이 이어서 한 발화를 나타냅니다. 한국어에서는 ‘놀라서 말했습니다’가 이 반응과 발화의 관계를 더 자연스럽고 명확하게 전달합니다.
  - severity: low
    issue: 불필요하고 비자연스러운 각주
    rationale: ‘누가 구원될 수 있습니까?’는 본문의 ‘누가 구원을 받을 수 있습니까?’와 의미상 차이가 거의 없고, 한국어로도 덜 자연스럽습니다. 원문의 수동태를 설명해야 할 번역상 필요가 없으므로 각주를 두지 않는 것이 좋습니다.
  revised_text: 그 말을 들은 제자들은 몹시 놀라서 말했습니다. “그렇다면 누가 구원을 받을 수 있습니까?”
