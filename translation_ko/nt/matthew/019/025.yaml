  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: ko
  text: 그 말을 들은 제자들은 몹시 놀라며 말했습니다. 「그렇다면 누가 구원을 받을 수 있습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “누가 구원될 수 있습니까?”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  english_pob_choice: When [they] heard this
  chosen_korean: 그 말을 들은
  alternatives_korean:
  - 그것을 들은
  - 듣고서
  lexicon: BDAG
  rationale: 앞선 예수님의 말씀을 가리키므로 ‘그 말’을 보충해 한국어 인과·시간 관계를 자연스럽게 드러냈습니다.
- source_word: ἐξεπλήσσοντο σφόδρα
  english_pob_choice: were greatly astonished
  chosen_korean: 몹시 놀라며
  alternatives_korean:
  - 크게 놀라며
  - 매우 놀라며
  - 크게 경악하며
  lexicon: BDAG
  rationale: 미완료 시상의 지속되는 반응을 살려 ‘놀라며’로 처리하고, σφόδρα의 강도를 ‘몹시’로 자연스럽게 반영했습니다.
- source_word: Τίς ἄρα
  english_pob_choice: Who then
  chosen_korean: 그렇다면 누가
  alternatives_korean:
  - 그러면 누가
  - 도대체 누가
  lexicon: BDAG
  rationale: ἄρα의 추론적·귀결적 뉘앙스를 ‘그렇다면’으로 옮겨, 제자들의 놀라움 속에서 나온 결론적 질문임을 살렸습니다.
- source_word: σωθῆναι
  english_pob_choice: be saved
  chosen_korean: 구원을 받을 수 있습니까
  alternatives_korean:
  - 구원받을 수 있습니까
  - 구원을 얻을 수 있습니까
  - 구원될 수 있습니까
  lexicon: BDAG
  rationale: 구원 문맥의 신학적 무게를 유지하면서 한국어에서 가장 자연스러운 수동 표현으로 옮겼습니다.
theological_decisions:
- issue: σωθῆναι의 의미 범위
  chosen_reading: 여기서는 단순한 위험 회피가 아니라 종말론적·구원론적 ‘구원’을 뜻합니다.
  alternative_readings:
  - 구출받다
  - 건짐을 받다
  rationale: 문맥상 부자와 하나님 나라의 प्रवेश 불가능성에 대한 반응이므로, 임시적 구출보다 구원론적 의미를 유지하는 것이 적절합니다.
  doctrine_reference: 마태복음 19:23-26 문맥; 구원론
