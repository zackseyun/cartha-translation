id: MAT.19.11
reference: Matthew 19:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
  footnotes:
  - marker: a
    text: Or “this saying” or “this teaching.”
    reason: lexical_alternative
  - marker: b
    text: The passive “it has been given” likely implies God as the giver, but the Greek does not state the subject explicitly.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 그들에게 말씀하셨습니다. 「이 말을 모든 사람이 받아들일 수 있는 것은 아닙니다. 다만 그것이 주어진 사람들만 그렇습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그는 예수님을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘말’은 여기서 앞 문맥의 발언이나 가르침을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  english_pob_choice: said
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했습니다
  - 이르셨습니다
  lexicon: BDAG
  rationale: 서술 도입의 기본 의미는 ‘말하다’이지만, 예수의 발화를 자연스럽고 정중하게 드러내기 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: Οὐ πάντες
  english_pob_choice: Not everyone
  chosen_korean: 모든 사람이 ... 것은 아닙니다
  alternatives_korean:
  - 모두가 ... 것은 아닙니다
  - 사람마다 다 ...
  lexicon: BDAG
  rationale: 부정된 보편 진술을 한국어에서 가장 자연스럽게 살리기 위해 ‘모든 사람이’ 구성을 사용했습니다.
- source_word: χωροῦσι τὸν λόγον τοῦτον
  english_pob_choice: can accept this word
  chosen_korean: 이 말을 ... 받아들일 수 있는
  alternatives_korean:
  - 이 말을 ... 받을 수 있는
  - 이 말씀을 ... 이해할 수 있는
  - 이 가르침을 ... 받아들일 수 있는
  lexicon: BDAG
  rationale: λόγος는 여기서 바로 앞 문맥의 발언/가르침을 가리키므로, 한국어에서는 의미를 분명하게 하는 ‘말’을 택했고 χωρέω의 뜻은 ‘받아들이다’로 옮겼습니다.
- source_word: δέδοται
  english_pob_choice: it has been given
  chosen_korean: 주어진
  alternatives_korean:
  - 주어졌습니다
  - 허락된
  lexicon: BDAG
  rationale: 완료 수동의 결과 상태를 살리되, 원문이 주체를 밝히지 않으므로 ‘주어진’으로 옮겨 주어가 암시되면서도 명시되지 않게 했습니다.
theological_decisions:
- issue: δέδοται의 암시된 주체
  chosen_reading: 본문은 주는 분을 명시하지 않고 수동형을 유지해, 선물/허락의 출처를 암시만 합니다.
  alternative_readings:
  - 하나님이 주셨습니다
  - 하나님께서 허락하신 사람들만 그렇습니다
  rationale: 그리스어는 주체를 밝히지 않으므로, 본문이 지닌 신학적 여백을 보존하는 것이 더 정확합니다.
  doctrine_reference: divine passive 유지
