  naturalness: ‘이 말을 모든 사람이 받아들일 수 있는 것은 아닙니다’는 자연스럽고 적절합니다. 후반은 ‘그렇습니다’ 대신 ‘받아들일 수 있습니다’를 반복하는 편이 현대 표준어에서 훨씬 분명합니다.
