id: MAT.19.12
reference: Matthew 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
  footnotes:
  - marker: a
    text: Or 'castrated themselves'; many interpreters understand this figuratively as choosing celibacy for the sake of God’s kingdom.
    reason: alternative_reading
  - marker: b
    text: Or 'The one able to receive this, let him receive it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사실 태어날 때부터 그러한 고자들이 있고, 사람들에게 그렇게 된 고자들이 있으며, 하늘 나라를 위하여 스스로 고자 된 사람들도 있습니다. 받아들일 수 있는 사람은 받아들이십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스스로 고자 된’은 문자적 거세를 가리킬 수도 있고, 하나님의 나라를 위한 자발적 독신을 비유적으로 가리킬 수도 있습니다.
    reason: theological_note
  - marker: b
    text: 또는 ‘이것을 받을 수 있는 사람은 받아들이라’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  english_pob_choice: eunuchs
  chosen_korean: 고자들
  alternatives_korean:
  - 환관들
  - 은둔자들
  lexicon: BDAG
  rationale: εὐνοῦχος의 핵심 의미를 살리되, 한국어에서 “고자”가 이 본문처럼 생래적·타의적·자발적 상태를 모두 포괄하는 직설적 대응으로 가장 가깝습니다. “환관”은 궁정 관료 뉘앙스가 강하고, “은둔자들”은 해석을 미리 넣습니다.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  english_pob_choice: were born that way from their mother’s womb
  chosen_korean: 사실 태어날 때부터 그러한
  alternatives_korean:
  - 어머니의 뱃속에서부터 그러한
  - 모태에서부터 그러한
  lexicon: BDAG
  rationale: 출생의 기원을 나타내는 관용을 자연스러운 한국어로 옮기되, ‘태어날 때부터’로 상태의 시작을 분명히 했습니다. ‘모태’는 가능하지만 본문의 생생한 표현보다 전통적·문어적입니다.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  english_pob_choice: were made eunuchs by men
  chosen_korean: 사람들에게 그렇게 된 고자들이
  alternatives_korean:
  - 사람들에게 고자로 만들어진
  - 사람들에 의해 환관이 된
  lexicon: BDAG
  rationale: 동사형과 명사형의 연결을 유지하면서, 주체인 ‘사람들’에 의한 타의성을 드러냈습니다. ‘만들어진’도 가능하지만 한국어에서 다소 기계적으로 들릴 수 있어 본문 흐름에 맞게 다듬었습니다.
- source_word: εὐνούχισαν ἑαυτοὺς
  english_pob_choice: made themselves eunuchs
  chosen_korean: 스스로 고자 된
  alternatives_korean:
  - 스스로 고자가 된
  - 자신을 고자로 만든
  lexicon: BDAG
  rationale: 원문의 도발적 표현을 그대로 살리면서도 한국어 문장으로는 과도한 반복을 줄였습니다. 해석을 ‘금욕’으로 미리 환원하지 않고, 본문의 긴장을 유지합니다.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  english_pob_choice: The one able to accept this should accept it
  chosen_korean: 받아들일 수 있는 사람은 받아들이십시오.
  alternatives_korean:
  - 받아들일 수 있는 사람은 받아들이라
  - 이것을 받을 수 있는 사람은 받으십시오
  lexicon: BDAG
  rationale: χωρέω의 관용적 의미를 현대 한국어의 ‘받아들이다’로 옮겨, 난해한 가르침을 수용하라는 뉘앙스를 살렸습니다. 직역적 ‘받다’보다 자연스럽고, 청중에게 주는 권고형 어조도 유지됩니다.
theological_decisions:
- issue: εὐνούχισαν ἑαυτοὺς를 문자적 거세로 고정할지, 자발적 독신으로 해석할지
  chosen_reading: 본문의 표현을 그대로 살려 ‘스스로 고자 된’으로 두고, 의미를 독신으로 미리 풀어 쓰지 않았습니다.
  alternative_readings:
  - 스스로 거세한
  - 하나님의 나라를 위해 독신을 택한
  rationale: 본문은 세 번째 부류를 설명하지만, 그 행위가 문자적 거세인지 비유적 독신 선택인지를 명시적으로 해명하지 않습니다. 번역은 이 긴장을 지키고, 해석은 주석에서 다루는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 본문이 풀지 않은 해석적 긴장은 번역에서 보존합니다.'
- issue: 마지막 권고문의 높임말 처리
  chosen_reading: 직접 권고형으로 ‘받아들이십시오’를 사용했습니다.
  alternative_readings:
  - 받아들이라
  - 받아들이소서
  rationale: 예수의 말씀으로서 현대 표준어의 공손한 명령형을 쓰는 것이 가장 자연스럽고, 청중에게 주는 권면의 힘도 유지합니다.
  doctrine_reference: '한국어 문체 원칙: 현대 합쇼체의 직접 권고문을 사용합니다.'
