  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
  footnotes:
  - marker: a
    text: Or more literally, 'But many first will be last, and last first.' The Greek is notably terse and proverbial.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 먼저 된 사람들 가운데 많은 이들이 마지막이 되고, 마지막인 이들이 먼저 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 매우 간결한 속담체 표현입니다. 더 문자적으로는 ‘그러나 많은 첫째가 마지막이 되고, 마지막이 첫째가 됩니다’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  english_pob_choice: many
  chosen_korean: 많은 이들
  alternatives_korean:
  - 많은 사람들
  - 많은 자들
  lexicon: BDAG
  rationale: 주어가 특정 집단명사라기보다 넓은 범주의 사람들을 가리키므로, 한국어에서는 자연스럽고 간결한 ‘많은 이들’로 살렸습니다.
- source_word: πρῶτοι
  english_pob_choice: first
  chosen_korean: 먼저 된
  alternatives_korean:
  - 첫째인
  - 첫 사람들인
  - 앞선
  lexicon: BDAG
  rationale: 여기서 ‘first’는 시간 순서보다 지위·우선성을 뜻하므로, 뒤의 ‘마지막’과의 대비가 드러나는 ‘먼저 된’으로 옮겼습니다.
- source_word: ἔσχατοι
  english_pob_choice: last
  chosen_korean: 마지막인
  alternatives_korean:
  - 나중인
  - 끝인
  - 뒤처진
  lexicon: BDAG
  rationale: πρῶτοι와의 직접 대조를 유지하기 위해 ‘마지막인’으로 번역하여, 서술적이면서도 격언적인 평행을 살렸습니다.
- source_word: καὶ ἔσχατοι πρῶτοι
  english_pob_choice: and the last first
  chosen_korean: 마지막인 이들이 먼저 됩니다
  alternatives_korean:
  - 그리고 마지막인 이들은 먼저 됩니다
  - 마지막이 먼저 됩니다
  lexicon: BDAG
  rationale: 둘째 절은 그리스어에서 동사가 생략된 간결한 표현이므로, 한국어에서는 의미를 분명히 하되 절의 대칭성을 유지하도록 보충했습니다.
theological_decisions:
- issue: 역전 선언의 범위
  chosen_reading: 이 구절은 지위와 순서의 역전을 말하는 격언으로 유지하고, 그 범위를 구원·보상·사회적 지위 중 어느 하나로 좁히지 않았습니다.
  alternative_readings:
  - 구체적으로 하나님 나라 입장을 말하는 것으로 제한
  - 제자들 사이의 보상 순서를 가리키는 것으로 제한
  - 일반적인 사회적 역전으로 읽음
  rationale: 본문 자체가 역전의 말을 간단히 제시할 뿐, 바로 이 절만으로 적용 범위를 확정하지 않으므로 해석을 과도하게 특정하지 않았습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 문맥을 넘어선 교리를 덧붙이지 않음.
