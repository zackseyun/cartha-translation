revisions:
- from: 그리고 말씀하셨습니다. 「이런 이유로 남자는 자기 아버지와 어머니를 떠나 자기 아내와 합쳐질 것이며, 두 사람이 한 몸이 될 것입니다」.[a]
  to: 또 말씀하셨습니다. 「이 때문에 남자가 자기 아버지와 어머니를 떠나 자기 아내와 결합할 것이며, 두 사람이 한 몸이 될 것입니다.[a]」
  rationale: 원문의 인과 표현, 남성 단수와 ‘자기 아내’라는 성별·소유 표지, 미래형, ‘두 사람’과 ‘한 몸’의 결혼 인용을 보존했습니다. ‘합쳐지다’를 ‘결합하다’로 바꾸어 κολληθήσεται의 긴밀한 결합 의미를 현대 표준 한국어로 더 자연스럽게 전달했고, 각주도 해당 동사의 가능한 표현들을 정확히 제시하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:36Z'
