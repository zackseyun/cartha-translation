  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
  footnotes:
  - marker: a
    text: Or 'be united to' or 'cling to his wife.' The Greek verb denotes close attachment.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 말씀하셨습니다. 「이 때문에 남자가 자기 아버지와 어머니를 떠나 자기 아내와 결합할 것이며, 두 사람이 한 몸이 될 것입니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 아내와 연합할 것입니다’ 또는 ‘자기 아내에게 붙어 있을 것입니다’. 그리스어 동사는 가까이 결합하거나 밀접하게 붙어 있음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  english_pob_choice: For this reason
  chosen_korean: 이런 이유로
  alternatives_korean:
  - 이 까닭에
  - 그러므로
  lexicon: BDAG
  rationale: 원인·근거를 밝히는 연결 표현으로서 문맥의 논증적 힘을 살리면서 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: καταλείψει
  english_pob_choice: will leave
  chosen_korean: 떠날 것입니다
  alternatives_korean:
  - 버릴 것입니다
  - 떠나갈 것입니다
  lexicon: BDAG
  rationale: 가정법적·미래적 인용 구조를 유지하되, 부모를 향한 관계적 분리를 한국어에서 가장 자연스럽게 표현했습니다.
- source_word: κολληθήσεται
  english_pob_choice: be joined to
  chosen_korean: 합쳐질 것입니다
  alternatives_korean:
  - 연합할 것입니다
  - 붙들릴 것입니다
  - 결합될 것입니다
  lexicon: BDAG
  rationale: 결혼 결합의 밀착성과 결과성을 드러내면서도 ‘붙다/매달리다’의 거친 뉘앙스를 피했고, 본문 주해상 ‘배우자와의 결합’이라는 뜻을 분명히 했습니다.
- source_word: εἰς σάρκα μίαν
  english_pob_choice: one flesh
  chosen_korean: 한 몸
  alternatives_korean:
  - 한 육체
  - 한 살
  lexicon: BDAG
  rationale: 한국어 성경에서 관용적으로 통하는 표현을 따르되, 결혼의 실재적 연합을 전달하도록 ‘하나’보다 ‘한 몸’을 택했습니다.
theological_decisions:
- issue: 결혼 인용문의 성별 표지 유지
  chosen_reading: 남자는 … 자기 아내
  alternative_readings:
  - 사람은 … 배우자
  rationale: 본문은 창세기 결혼 공식을 인용하며 남성과 여성의 결합을 전제하므로, 중성화하지 않고 원문의 성별 표지를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: ‘한 몸’의 결합 결과성
  chosen_reading: 두 사람이 한 몸이 될 것입니다
  alternative_readings:
  - 두 사람은 한 몸입니다
  rationale: ἔσονται εἰς는 단순 상태 진술보다 새 결합 상태로의 도달을 나타내므로, ‘될 것입니다’로 결과성과 움직임을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
