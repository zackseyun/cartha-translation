review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 οὐκέτι는 상태 변화의 시간적 부정이므로 ‘이제’보다 ‘더 이상’이 더 직접적으로 반영합니다. σὰρξ μία의 ‘한 몸’은 한국어 성경 문맥에서 확립된 자연스러운 표현으로, 창세기 인용의 결혼 결합 언어를 충분히 보존합니다. συνέζευξεν은 ‘짝지어 주신’으로 옮기면 ‘함께 결합시키다’라는 어근의 뜻이 더 선명합니다.
  naturalness: ‘사람이 나누어서는 안 됩니다’도 이해되지만, 혼인 결합을 대상으로 하는 χωριζέτω에는 ‘갈라놓아서는 안 됩니다’가 현대 표준어에서 더 자연스럽고 정확합니다. 합쇼체의 명령·금지 표현도 적절합니다.
  terminology: ‘한 몸’은 σὰρξ μία에 대한 한국어 성경의 관용적 대응어로 유지할 수 있습니다. ἄνθρωπος는 일반적 인간을 가리키므로 ‘사람이’가 정확하며, 성별 한정으로 오해될 여지가 없습니다. 따라서 이를 설명하는 현 각주는 번역문에서 이미 자연스럽게 드러나는 내용을 반복하므로 불필요합니다.
  issues:
  - severity: medium
    issue: οὐκέτι가 ‘이제’로 다소 약하게 반영됨
    rationale: οὐκέτι는 ‘더 이상 ~ 아니다/no longer’라는 시간적 부정입니다. ‘더 이상’이 의미를 더 명시적으로 보존합니다.
  - severity: low
    issue: ‘나누어서는 안 됩니다’의 관계적 의미가 다소 불분명함
    rationale: χωρίζω는 여기서 하나님이 결합하신 것을 분리하거나 갈라놓는다는 뜻입니다. ‘갈라놓아서는 안 됩니다’가 혼인 결합 문맥에 더 자연스럽습니다.
  - severity: low
    issue: 각주가 번역문에 이미 드러난 일반적 의미를 반복함
    rationale: 한국어 ‘사람’은 이 문맥에서 특정 성별의 사람으로 제한되지 않으므로, 원문의 ἄνθρωπος가 일반적 인간을 가리킨다는 설명을 별도로 붙일 필요가 없습니다.
  revised_text: 그러므로 더 이상 둘이 아니라 한 몸입니다. 그러므로 하나님께서 짝지어 주신 것을 사람이 갈라놓아서는 안 됩니다.
  revised_footnotes: []
