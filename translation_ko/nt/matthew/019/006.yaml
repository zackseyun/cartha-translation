revisions:
- from: 그러므로 이제 둘이 아니라 한 몸입니다. 그러므로 하나님께서 맺어 주신 것을 사람이 나누어서는 안 됩니다.[a]
  to: 그러므로 더 이상 둘이 아니라 한 몸입니다. 그러므로 하나님께서 짝지어 주신 것을 사람이 갈라놓아서는 안 됩니다.
  rationale: 시간적 부정 ‘더 이상’으로 οὐκέτι를 명확히 반영하고, 하나님의 결합 행위와 인간의 분리 금지를 각각 ‘짝지어 주신’과 ‘갈라놓아서는 안 됩니다’로 더 정확하고 자연스럽게 옮겼습니다. ‘한 몸’은 창세기와의 상호본문성 및 한국어 성경 관용을 보존하므로 유지했습니다. 번역 자체로 충분히 포괄적인 ‘사람’을 사용했으므로 중복적인 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
