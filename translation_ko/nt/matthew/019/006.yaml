id: MAT.19.6
reference: Matthew 19:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
  footnotes:
  - marker: a
    text: '''Man'' here has a generic sense: that is, no human being should separate what God has joined together.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 더 이상 둘이 아니라 한 몸입니다. 그러므로 하나님께서 짝지어 주신 것을 사람이 갈라놓아서는 안 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  english_pob_choice: So
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 그러므로
  - 그래서
  lexicon: BDAG
  rationale: 앞절의 결과를 받는 추론 표지이므로 한국어에서는 문맥상 자연스러운 ‘그러므로’로 옮기고, 시간적 전환을 덧붙여 ‘이제’로 현재 상태의 변화를 살렸습니다.
- source_word: σὰρξ μία
  english_pob_choice: one flesh
  chosen_korean: 한 몸
  alternatives_korean:
  - 한 육체
  - 한 몸 된 것
  lexicon: BDAG
  rationale: 결혼 맥락에서는 관용구 ‘one flesh’를 직역하면 ‘한 육체’가 되지만, 한국어에서 성경적 결합의 의미를 자연스럽게 전달하는 표준 표현으로 ‘한 몸’을 택했습니다. 다만 원문의 문구성은 유지했습니다.
- source_word: συνέζευξεν
  english_pob_choice: has joined together
  chosen_korean: 맺어 주신
  alternatives_korean:
  - 함께 맺으신
  - 결합하신
  lexicon: BDAG
  rationale: 혼인 관계를 하나님이 주도적으로 결합하셨다는 뜻을 살려 ‘맺어 주신’으로 옮겼습니다. 단순한 결합보다 관계를 맺어 주는 뉘앙스가 한국어에서 더 분명합니다.
- source_word: ἄνθρωπος
  english_pob_choice: man
  chosen_korean: 사람이
  alternatives_korean:
  - 인간이
  - 누구든지
  lexicon: BDAG
  rationale: 원문의 단수 일반명사는 특정 남성이 아니라 일반 인간을 가리키므로, 한국어에서는 성별로 오해되지 않도록 ‘사람이’로 옮겼습니다. 이는 영어 주석의 일반적 의미와도 부합합니다.
- source_word: μὴ χωριζέτω
  english_pob_choice: must not separate
  chosen_korean: 나누어서는 안 됩니다
  alternatives_korean:
  - 갈라놓아서는 안 됩니다
  - 헤어지게 해서는 안 됩니다
  lexicon: BDAG
  rationale: 금지 명령의 힘을 현대 한국어로 분명하게 전달하기 위해 ‘…해서는 안 됩니다’ 구문을 사용했습니다. ‘separate’의 관계적 의미를 혼인 유대에 맞게 ‘나누다’로 옮겼습니다.
theological_decisions:
- issue: ἄνθρωπος의 일반적 지시 대상과 성별 표지
  chosen_reading: ‘사람이’로 번역해 일반 인간을 가리키는 의미를 드러냈습니다.
  alternative_readings:
  - 남자가
  - 누구든지
  rationale: 원문은 문법상 남성형 단수이지만 기능상 일반적 인간을 뜻합니다. 한국어에서는 성별을 불필요하게 띄우기보다 포괄적 의미를 자연스럽게 전달하는 것이 본문의 의도에 더 정확합니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, point 4
- issue: 혼인 결합의 주체를 하나님께 돌리는 표현
  chosen_reading: ‘하나님께서 맺어 주신 것’으로 주도권을 분명히 했습니다.
  alternative_readings:
  - 하나님이 결합하신 것
  - 하나님이 한 것
  rationale: 원문은 하나님이 혼인 결합의 행위자이심을 강조합니다. 한국어에서 ‘맺어 주신’은 단순한 제도적 결합보다 인격적이고 주도적인 행위를 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy, points 1 and 5
