    issue: ‘보라’의 문체
    rationale: 본문 전체의 합쇼체 기준에서 ‘보라’보다 ‘보십시오’가 현대적 공손 문체에 적합하며 ἰδού의 환기 기능도 보존합니다.
  - severity: low
    issue: 각주 표지의 위치 및 각주 내용
    rationale: 각주는 τί ἀγαθόν에 관한 것이므로 해당 표현 바로 뒤에 붙여야 합니다. 현 각주는 가능한 대안 표현을 제시하기보다 선택 번역을 설명하므로, ‘선한 행위’라는 대안을 명시하는 편이 lexical_alternative 목적에 맞습니다.
  revised_text: 보십시오, 한 사람이 그에게 다가와 말했습니다. “선생님, 영생을 얻으려면 제가 어떤 선한 일[a]을 해야 합니까?”
