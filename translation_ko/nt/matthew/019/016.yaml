id: MAT.19.16
reference: Matthew 19:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
  footnotes:
  - marker: a
    text: Or 'what good deed shall I do ... ?' The Greek τί ἀγαθὸν can refer to a 'good thing' or, by implication with 'do,' a 'good deed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보라, 한 사람이 그에게 와서 말했습니다. 「선생님, 내가 어떤 선한 일을 해야 영생을 얻을 수 있습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어떤 선한 일’은 헬라어 τί ἀγαθόν의 가능한 뜻으로, 문맥상 ‘선한 행위’의 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  english_pob_choice: And behold
  chosen_korean: 보라
  alternatives_korean:
  - 그리고 보라
  - 그런데 보라
  lexicon: BDAG
  rationale: 장면 전환과 주목을 끄는 담화표지를 간결하게 살리되, 한국어에서는 접속사적 기능보다 호흡을 강조하는 ‘보라’가 자연스럽습니다.
- source_word: εἷς
  english_pob_choice: one
  chosen_korean: 한 사람
  alternatives_korean:
  - 어떤 사람
  - 한 이
  lexicon: BDAG
  rationale: 본문은 아직 인물을 구체화하지 않으므로, ‘한 사람’으로 옮겨 POB의 비특정성을 유지했습니다.
- source_word: Διδάσκαλε
  english_pob_choice: Teacher
  chosen_korean: 선생님
  alternatives_korean:
  - 스승님
  - 선생
  lexicon: BDAG
  rationale: 호칭의 기본 뜻인 ‘teacher/instructor’를 현대 한국어의 직접적이고 공손한 호칭인 ‘선생님’으로 옮겼습니다.
- source_word: τί ἀγαθὸν ποιήσω
  english_pob_choice: what good thing must I do
  chosen_korean: 내가 어떤 선한 일을 해야
  alternatives_korean:
  - 내가 어떤 좋은 일을 해야
  - 내가 무엇을 선하게 해야
  lexicon: BDAG
  rationale: τί ἀγαθόν의 열린 표현을 ‘어떤 선한 일’로 살려, ‘무슨 선행’처럼 도덕적 결론을 미리 좁히지 않았습니다.
- source_word: ἵνα σχῶ ζωὴν αἰώνιον
  english_pob_choice: so that I may have eternal life
  chosen_korean: 영생을 얻을 수 있습니까
  alternatives_korean:
  - 영생을 가질 수 있습니까
  - 영원한 생명을 얻을 수 있습니까
  lexicon: BDAG
  rationale: ἵνα의 목적 의미와 σχῶ의 ‘가지다/얻다’를 한국어 관용으로 자연스럽게 풀어 ‘얻을 수 있습니까’로 옮겼습니다.
theological_decisions:
- issue: τί ἀγαθόν의 해석 범위
  chosen_reading: ‘어떤 선한 일’로 옮겨, 행위 중심의 질문이지만 ‘공로’나 교리적 결론은 덧붙이지 않습니다.
  alternative_readings:
  - ‘무슨 선행’
  - ‘어떤 좋은 일’
  rationale: 본문은 예수의 응답 전에 질문만 제시하므로, 한국어도 행위의 초점은 살리되 구원론적 판정을 미리 만들지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
