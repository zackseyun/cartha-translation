revisions:
- from: 보라, 한 사람이 그에게 와서 말했습니다. 「선생님, 내가 어떤 선한 일을 해야 영생을 얻을 수 있습니까?」[a]
  to: 보십시오, 한 사람이 그에게 다가와 말했습니다. “선생님, 영생을 얻으려면 제가 어떤 선한 일[a]을 해야 합니까?”
  rationale: 현대 합쇼체에 맞게 ἰδού를 ‘보십시오’로 옮기고, προσελθών의 종속된 선행 동작을 ‘다가와’로 반영했습니다. ἵνα의 목적 관계는 한국어의 자연스러운 구성인 ‘영생을 얻으려면’으로 옮겼습니다. ‘어떤 선한 일’의 의미 범위를 보존하도록 각주를 해당 어구에 연결하고 대안을 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:36Z'
review_pass:
  verdict: revise
  source_fidelity: ‘한 사람’과 ‘선생님’은 각각 εἷς와 Διδάσκαλε를 충실히 반영합니다. 다만 προσελθών은 발화에 앞선 접근을 나타내므로 ‘다가와’로 명시하는 것이 더 적절하며, ἵνα σχῶ의 목적 관계는 ‘영생을 얻으려면’으로 자연스럽고 직접적으로 드러낼 수 있습니다.
  naturalness: ‘보라’는 현대 표준어 합쇼체의 서술 흐름에서는 다소 문어적·비격식적으로 들립니다. ‘보십시오’가 ἰδού의 주목 환기 기능을 유지하면서 요구된 현대 공손체에 맞습니다. 질문도 ‘제가 … 해야 합니까?’가 자연스럽습니다.
  terminology: ‘영생’은 ζωὴν αἰώνιον의 확립된 한국어 성경 용어로 적절합니다. τί ἀγαθόν은 ‘어떤 선한 일’로 유지하되, 각주는 ‘선한 행위’라는 가능한 구체화만 제시하여 본문의 열린 표현을 보존합니다.
  issues:
