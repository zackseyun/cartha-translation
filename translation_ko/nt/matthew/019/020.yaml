lexical_decisions:
- source_word: λέγει
  english_pob_choice: says
  chosen_korean: 말합니다
  alternatives_korean:
  - 말했습니다
  - 이야기합니다
  lexicon: BDAG
  rationale: 서술 현재를 한국어 현재형으로 살려, 대화의 즉시성과 자연스러움을 유지했습니다.
- source_word: ὁ νεανίσκος
  english_pob_choice: the young man
  chosen_korean: 그 청년
  alternatives_korean:
  - 젊은 사람
  - 젊은이
  lexicon: BDAG
  rationale: νεανίσκος는 단순히 ‘젊은 남자’를 가리키므로, 문맥에 없는 ‘관리’ 등의 정보를 넣지 않고 자연스러운 ‘청년’으로 옮겼습니다.
- source_word: Πάντα ταῦτα
  english_pob_choice: All these
  chosen_korean: 이 모든 것
  alternatives_korean:
  - 이 모든 것들
  - 이 모든
  lexicon: BDAG
  rationale: 직전 문맥의 계명들을 가리키는 구절이므로, 지시성을 분명히 하면서도 과도하게 장황하지 않게 ‘이 모든 것’으로 옮겼습니다.
- source_word: ἐφύλαξα
  english_pob_choice: I have kept
  chosen_korean: 제가 지켰습니다
  alternatives_korean:
  - 제가 지켜 왔습니다
  - 제가 준수했습니다
  lexicon: BDAG
  rationale: φυλάσσω는 이 문맥에서 계명을 지키다/준수하다의 뜻이므로, 교회적 문체를 과하게 더하지 않는 ‘지켰습니다’를 택했습니다.
- source_word: ὑστερῶ
  english_pob_choice: do I still lack
  chosen_korean: 아직 부족합니까
  alternatives_korean:
  - 아직 모자랍니까
  - 아직 결핍되어 있습니까
  lexicon: BDAG
  rationale: ὑστερέω의 핵심은 부족함/결핍이므로, 자연스러운 질문형으로 ‘무엇이 아직 부족합니까’라고 옮겼습니다.
theological_decisions:
- issue: 청년의 자기평가를 번역이 판정하지 않음
  chosen_reading: 청년의 진술을 그 자체로 평이하게 제시하고, 번역문에서 진위나 비판적 뉘앙스를 덧씌우지 않았습니다.
  alternative_readings:
  - 의미상 빈틈을 드러내는 식의 역설적 표현
  - 암시적으로 과장된 자기변호로 재구성
  rationale: 그리스어 본문은 단순한 발화를 제시할 뿐이므로, 해석적 판단은 본문 전체의 맥락에 맡기고 이 절에서는 긴장을 보존했습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존하고 번역이 판정하지 않도록 합니다.
