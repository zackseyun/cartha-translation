  source_fidelity: 핵심 비교와 낙타·바늘구멍의 과장 이미지는 정확히 보존합니다. 다만 πάλιν δὲ λέγω ὑμῖν의 화자·청자 지시를 본문에서 생략했고, ‘말씀드립니다’는 청자에게 자신을 낮추는 겸양 표현이므로 예수의 직접 발화에 적절하지 않습니다.
  naturalness: ‘낙타가 바늘구멍으로 들어가는 것이 … 더 쉽습니다’는 자연스럽고 명료합니다. ‘다시 여러분에게 말합니다’가 현대 표준어 합쇼체에서 직접 발화의 어조와 문법적 관계를 더 자연스럽게 나타냅니다.
