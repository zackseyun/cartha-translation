id: MAT.19.24
reference: Matthew 19:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
  footnotes:
  - marker: a
    text: Or, 'through a needle's eye.'
    reason: lexical_alternative
  - marker: b
    text: Some have suggested 'rope' instead of 'camel,' but the Greek text here reads 'camel.'
    reason: alternative_reading
translation:
  language: ko
  text: 다시 여러분에게 말합니다. 낙타가 바늘구멍으로 들어가는 것이 부자가 하나님의 나라에 들어가는 것보다 더 쉽습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바늘귀로.’
    reason: lexical_alternative
  - marker: b
    text: 일부는 ‘낙타’ 대신 ‘밧줄’을 제안하지만, 여기의 헬라어 본문은 ‘낙타’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  english_pob_choice: Again I tell you
  chosen_korean: 다시 말씀드립니다
  alternatives_korean:
  - 또 말씀드립니다
  - 다시 여러분에게 말씀드립니다
  lexicon: BDAG
  rationale: πάλιν은 반복을 나타내는 ‘다시’로 자연스럽게 살리고, λέγω ὑμῖν의 직접 화법은 합쇼체의 공손한 발화로 옮겼습니다.
- source_word: εὐκοπώτερόν ἐστιν
  english_pob_choice: it is easier
  chosen_korean: 더 쉽습니다
  alternatives_korean:
  - 더 수월합니다
  - 더 가능합니다
  lexicon: BDAG
  rationale: 비교급 표현의 핵심은 ‘쉽다’의 정도 비교이므로, 현대 한국어에서 가장 직관적인 ‘더 쉽습니다’로 옮겼습니다.
- source_word: διὰ ⸀τρυπήματος ῥαφίδος
  english_pob_choice: through the eye of a needle
  chosen_korean: 바늘구멍으로
  alternatives_korean:
  - 바늘의 눈으로
  - 바늘귀로
  lexicon: BDAG
  rationale: 직역적 ‘바늘의 눈’도 가능하지만, 한국어에서는 ‘바늘구멍’이 같은 이미지를 자연스럽게 전달하며 구멍을 통과한다는 의미를 분명히 합니다.
- source_word: πλούσιον
  english_pob_choice: a rich man
  chosen_korean: 부자가
  alternatives_korean:
  - 부유한 사람이
  - 부유한 남자가
  lexicon: BDAG
  rationale: 남성 단수 형식을 유지하면서도 한국어에서는 일반 명사 ‘부자’가 자연스럽고 대표성을 잘 살립니다.
theological_decisions:
- issue: 낙타-바늘구멍 비유의 강도 유지
  chosen_reading: 불가능에 가까운 과장법으로 그대로 유지했습니다.
  alternative_readings:
  - ‘밧줄’로 완화하여 읽기
  - 예루살렘의 ‘바늘문’ 같은 특정 문으로 해석하기
  rationale: 원문은 κάμηλον(낙타)을 분명히 제시하므로, 난해함을 완화하는 해석을 본문에 들이지 않고 비유의 충격과 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙; 해석 전통보다 사본이 제시하는 표현의 힘을 유지
