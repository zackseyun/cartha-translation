id: MAT.19.17
reference: Matthew 19:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
  footnotes:
  - marker: a
    text: Some manuscripts and the parallel accounts read, 'Why do you call me good? No one is good except one—God.' Matthew's SBLGNT text instead reads, 'Why do you ask me about what is good? One is the good one.'
    reason: textual_variant
  - marker: b
    text: Or more idiomatically, 'There is one who is good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말씀하셨습니다. "왜 너는 나에게 무엇이 선한지 묻습니까?[a] 선한 분은 한 분뿐입니다. 그러나 네가 생명 안으로 들어가고자 한다면[b], 계명들을 지키십시오."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본과 평행 본문은 ‘왜 나를 선하다고 부르느냐? 선한 이가 한 분 외에는 아무도 없다—하나님만이 그렇다’로 읽습니다. 그러나 마태복음의 SBLGNT 본문은 ‘왜 나에게 무엇이 선한지 묻느냐? 선한 분은 한 분뿐이다’로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 좀 더 자연스럽게는 ‘생명에 들어가고자 한다면’이라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  english_pob_choice: Why do you ask me about what is good?
  chosen_korean: 왜 너는 나에게 무엇이 선한지 묻습니까?
  alternatives_korean:
  - 왜 나에게 선한 것에 대해 묻습니까?
  - 왜 나에게 무엇이 선한가를 묻습니까?
  lexicon: BDAG
  rationale: τοῦ ἀγαθοῦ의 중성 용법을 추상적으로 받아 '무엇이 선한지'로 옮겨, 마태복음의 현재 문맥을 그대로 살렸습니다.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  english_pob_choice: One is good.
  chosen_korean: 선한 분은 한 분뿐입니다.
  alternatives_korean:
  - 한 분만 선하십니다.
  - 오직 한 분만 선합니다.
  lexicon: BDAG
  rationale: ὁ ἀγαθός의 서술적 표현을 한국어에서 자연스럽게 인격적 주어로 풀어, ‘한 분뿐’이라는 배타성을 분명히 했습니다.
- source_word: εἰ δὲ θέλεις
  english_pob_choice: But if you want
  chosen_korean: 그러나 네가 … 하고자 한다면
  alternatives_korean:
  - 그런데 네가 … 원한다면
  - 하지만 네가 … 하고자 한다면
  lexicon: BDAG
  rationale: δέ의 약한 대조를 '그러나'로 반영하되, θέλω는 현대 한국어에서 자연스러운 '하고자 하다'로 옮겼습니다.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  english_pob_choice: to enter into life
  chosen_korean: 생명 안으로 들어가고자 한다면
  alternatives_korean:
  - 생명으로 들어가고자 한다면
  - 생명에 들어가고자 한다면
  lexicon: BDAG
  rationale: εἰς의 방향성을 살리면서도 한국어에서 어색하지 않게 '안으로 들어가다'로 옮겼고, '생명'만 두어 본문의 범위를 넘는 해석을 피했습니다.
- source_word: τήρησον τὰς ἐντολάς
  english_pob_choice: keep the commandments
  chosen_korean: 계명들을 지키십시오
  alternatives_korean:
  - 계명들을 지키라
  - 계명들을 준수하십시오
  lexicon: BDAG
  rationale: τηρέω는 이 문맥에서 '지키다'가 가장 직접적이며, τὰς ἐντολάς는 복수성을 살려 '계명들'로 옮겼습니다.
theological_decisions:
- issue: Matthew 19:17의 독특한 마태 본문과 공관복음 평행구의 차이
  chosen_reading: 평행본문의 '왜 나를 선하다고 부르느냐'로 맞추지 않고, 마태의 현재 본문처럼 '무엇이 선한지'에 대한 질문과 '선한 분은 한 분뿐'이라는 답을 유지했습니다.
  alternative_readings:
  - 평행본문에 맞춰 '왜 나를 선하다고 부릅니까? … 하나님 외에는 아무도 선하지 않습니다'로 옮김
  rationale: SBLGNT 마태 본문을 우선해야 하므로, 평행구와의 조화를 위해 문장을 바꾸지 않았습니다. 이 번역은 예수님의 선하심이나 신성을 부정하지 않고, 본문 자체의 형식을 보존합니다.
  doctrine_reference: Translation philosophy items 1 and 3; Affirmations
