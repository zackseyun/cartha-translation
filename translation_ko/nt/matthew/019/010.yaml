id: MAT.19.10
reference: Matthew 19:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
  footnotes:
  - marker: a
    text: Or “If such is the case of a man with a wife.” The Greek phrase is compact and may also be rendered “the matter” or “the situation” instead of “the case.”
    reason: lexical_alternative
translation:
  language: ko
  text: 제자들이 그에게 말했습니다. 「만일 남자와 그의 아내의 사정이 그렇다면, 결혼하는 것은 유익하지 않습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남자와 아내의 경우가 그러하다면.” 여기의 헬라어 표현은 매우 압축적이어서 “사정”, “문제”, “상황”으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  english_pob_choice: said to him
  chosen_korean: 그에게 말했습니다
  alternatives_korean:
  - 그에게 말하였다
  - 그에게 이르렀습니다
  lexicon: SBLGNT / narrative historical present
  rationale: 서술문의 역사적 현재를 한국어 자연스러운 서술 과거로 옮겼습니다. '말했습니다'가 대화 도입에 가장 평이하고 현대적입니다.
- source_word: οἱ μαθηταί
  english_pob_choice: disciples
  chosen_korean: 제자들이
  alternatives_korean:
  - 따르는 이들이
  - 학생들이
  lexicon: BDAG
  rationale: 복음서에서 예수의 μαθηταί는 통상 '제자들'이 가장 직접적이며, '학생들'은 어색하고 '따르는 이들'은 관계를 약화시킵니다.
- source_word: ἡ αἰτία
  english_pob_choice: the case
  chosen_korean: 사정이
  alternatives_korean:
  - 경우가
  - 사실이
  - 문제가
  lexicon: BDAG
  rationale: αἰτία는 여기서 엄밀한 '원인'보다 앞선 말씀을 가리키는 상황·사정의 뜻이 자연스럽습니다. '사정'이 간결하게 그 상황 판단을 살립니다.
- source_word: μετὰ τῆς γυναικός
  english_pob_choice: with his wife
  chosen_korean: 남자와 그의 아내의
  alternatives_korean:
  - 남자와 아내의
  - 남자와 여자의
  lexicon: BDAG
  rationale: 혼인 문맥에서 γυνή는 '아내'로 옮기는 것이 맞고, ελλην어의 관계를 한국어에서는 '남자와 그의 아내'로 자연스럽게 풀었습니다.
- source_word: οὐ συμφέρει
  english_pob_choice: it is not beneficial
  chosen_korean: 유익하지 않습니다
  alternatives_korean:
  - 이롭지 않습니다
  - 좋지 않습니다
  - 득이 되지 않습니다
  lexicon: BDAG
  rationale: συμφέρει는 '유익/이익이 되다'의 뜻이므로 '유익하지 않습니다'가 가장 직접적입니다. 문맥상 결혼의 실용적 이익이 없다는 제자들의 반응을 살립니다.
- source_word: γαμῆσαι
  english_pob_choice: to marry
  chosen_korean: 결혼하는 것은
  alternatives_korean:
  - 결혼하는 것은
  - 장가드는 것은
  - 시집가는 것은
  lexicon: BDAG
  rationale: 동사의 일반적 의미를 한국어에서는 '결혼하다'로 옮겼습니다. 성별이 한쪽으로 기울지 않도록 중립적인 동사형을 사용했습니다.
theological_decisions:
- issue: 남자-아내의 혼인 관계를 성별적으로 유지할지 여부
  chosen_reading: ‘남자와 그의 아내’로 유지해 예수의 앞선 혼인 가르침에 대한 제자들의 반응을 그대로 드러냈습니다.
  alternative_readings:
  - ‘사람과 배우자’로 중성화
  - ‘남편과 아내’로 재구성
  rationale: 본문은 남녀 혼인을 전제로 한 응답이므로, 성별적 구조를 약화시키지 않고 source-direct로 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
