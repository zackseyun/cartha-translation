id: MAT.19.28
reference: Matthew 19:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
  footnotes:
  - marker: a
    text: Or 'the regeneration,' 'the new world,' or 'the rebirth.' Here the phrase refers to the future renewal associated with the Son of Man's reign, not most likely to individual new birth.
    reason: lexical_alternative
  - marker: b
    text: '''Judging'' may also carry the sense of exercising rule or governance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. 「진실로 여러분에게 말합니다. 여러분은 나를 따라온 사람들로서, 인자께서 자기 영광의 보좌에 앉으실 때, 새 하늘과 새 땅의 새로워짐 속에서 여러분도 열두 보좌에 앉아 이스라엘의 열두 지파를 심판할 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘중생,’ ‘새 세계,’ ‘새로남.’ 여기서 이 표현은 개인의 거듭남이 아니라 인자와 관련된 미래의 갱신을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘심판하다’는 통치하거나 다스리는 뜻을 함께 가질 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  english_pob_choice: Truly I say to you
  chosen_korean: 진실로 여러분에게 말합니다
  alternatives_korean:
  - 아멘, 여러분에게 말합니다
  - 참으로 여러분에게 말합니다
  lexicon: BDAG
  rationale: 엄숙한 권위 있는 발언 도입 공식이므로, 의미를 살리면서도 현대 한국어에서 자연스러운 ‘진실로’로 옮겼습니다.
- source_word: ὑμεῖς οἱ ἀκολουθήσαντές μοι
  english_pob_choice: you who have followed me
  chosen_korean: 여러분은 나를 따라온 사람들로서
  alternatives_korean:
  - 나를 따라온 여러분
  - 나를 따랐던 여러분
  lexicon: BDAG
  rationale: 과거의 추종 행위를 기준으로 대상을 규정하는 분사 구조를 살려, 단순 호칭이 아니라 자격을 나타내는 표현으로 옮겼습니다.
- source_word: ἐν τῇ παλιγγενεσίᾳ
  english_pob_choice: in the renewal
  chosen_korean: 새 하늘과 새 땅의 새로워짐 속에서
  alternatives_korean:
  - 새로워짐 속에서
  - 새 창조 속에서
  - 중생 속에서
  lexicon: BDAG
  rationale: 개인적 중생보다 종말론적 새로움이라는 문맥을 살리면서, 본문이 가리키는 미래적 갱신을 한국어로 분명하게 드러냈습니다.
- source_word: κρίνοντες
  english_pob_choice: judging
  chosen_korean: 심판할 것입니다
  alternatives_korean:
  - 판단할 것입니다
  - 다스릴 것입니다
  - 재판할 것입니다
  lexicon: BDAG
  rationale: 본문의 직접적 동사는 ‘심판하다’이므로 이를 기본값으로 유지했고, 통치까지 포함될 수 있는 넓은 뉘앙스는 본문 자체를 넘지 않게 했습니다.
theological_decisions:
- issue: παλιγγενεσία의 범위
  chosen_reading: 종말론적 새로워짐을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 개인적 거듭남
  - 새 시대
  - 새 세계
  rationale: 문맥이 인자와 보좌, 지파 심판에 관한 미래 장면이므로, 개인 구원의 순간보다 우주적·역사적 갱신을 가리키는 뜻을 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: κρίνοντες의 의미 범위
  chosen_reading: 주된 의미는 ‘심판하다’로 유지했습니다.
  alternative_readings:
  - 다스리다
  - 통치하다
  rationale: 동사의 기본 의미를 보존해 해석을 과도하게 확장하지 않되, 통치적 함의는 본문 수용자가 스스로 읽어낼 수 있도록 남겼습니다.
  doctrine_reference: Translation philosophy §3
