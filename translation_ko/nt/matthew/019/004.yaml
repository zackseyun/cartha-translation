id: MAT.19.4
reference: Matthew 19:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
  footnotes:
  - marker: a
    text: Or, “Did you not read…?”
    reason: lexical_alternative
  - marker: b
    text: Greek “the one who created”; alternatively, “the Creator.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하여 말씀하셨습니다. “여러분은 읽어 보지 못했습니까? 시작부터 그들을 지으신 분이 그들을 남자와 여자로 만드셨습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “읽어 보지 못했습니까…?”
    reason: lexical_alternative
  - marker: b
    text: 그리스어의 ‘지으신 분’; 또는, ‘창조자’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  english_pob_choice: He answered
  chosen_korean: 대답하여 말씀하셨습니다
  alternatives_korean:
  - 대답하셨습니다
  - 대답하며 말씀하셨습니다
  lexicon: BDAG
  rationale: 그리스어의 분사+동사 결합을 한국어에서는 자연스럽게 ‘대답하여 말씀하셨습니다’로 옮겨 응답 행위를 분명히 드러냈습니다.
- source_word: Οὐκ ἀνέγνωτε
  english_pob_choice: Have you not read
  chosen_korean: 여러분은 읽어 보지 못했습니까?
  alternatives_korean:
  - 읽어 보지 못했습니까?
  - 읽지 않았습니까?
  lexicon: BDAG
  rationale: 성경을 상기시키며 따지는 뉘앙스를 살려, 단순 과거보다 현재와 연결된 ‘읽어 보지 못했습니까?’로 옮겼습니다.
- source_word: ὁ κτίσας
  english_pob_choice: the one who created
  chosen_korean: 지으신 분
  alternatives_korean:
  - 창조하신 분
  - 창조자
  lexicon: BDAG
  rationale: 아티클이 붙은 분사를 제목화한 영어 선택을 따라, 자연스러운 한국어로는 ‘지으신 분’이 가장 직접적이며 ‘창조자’보다 덜 해석적입니다.
- source_word: ἄρσεν καὶ θῆλυ
  english_pob_choice: male and female
  chosen_korean: 남자와 여자로
  alternatives_korean:
  - 남성과 여성으로
  - 남자와 여자
  lexicon: BDAG
  rationale: 창세기 인용의 생물학적/창조 질서를 그대로 살리기 위해 ‘남자와 여자로’라고 옮겼습니다.
theological_decisions:
- issue: ἀπ’ ἀρχῆς의 수식 범위
  chosen_reading: ‘시작부터’가 ‘지으신 분’과 연결되도록 배치했습니다.
  alternative_readings:
  - 여러분은 읽어 보지 못했습니까? 시작부터…
  - 시작부터 그들을 지으신 분이…
  rationale: 그리스어에서 ἀπ’ ἀρχῆς는 ‘지으신 분’을 수식하는 것이 자연스러우므로, 창조 행위의 시점을 분명히 드러내는 구조를 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
- issue: 창조 진술의 직접성
  chosen_reading: ‘남자와 여자로’라는 본문의 창조적 짝을 본문에서 그대로 유지했습니다.
  alternative_readings:
  - 남성과 여성으로 만드셨습니다
  - 남자와 여자이게 하셨습니다
  rationale: 예수의 말씀은 창조 기사에 직접 호소하므로, 본문의 표현을 완화하거나 재해석하지 않고 그대로 살리는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
