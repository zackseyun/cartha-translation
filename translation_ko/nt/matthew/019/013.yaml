id: MAT.19.13
reference: Matthew 19:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
  footnotes:
  - marker: a
    text: The final 'them' may refer either to the children or to those who brought them.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 사람들이 아이들을 예수께 데려와 예수께서 그들에게 손을 얹고 기도하시게 하려 하였으나, 제자들이 그들을 꾸짖었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 ‘그들을’은 아이들을 가리킬 수도 있고, 아이들을 데려온 사람들을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그리하여
  - 그때에
  lexicon: BDAG
  rationale: 문맥상 이야기의 진행을 표시하는 시간 부사이므로, 현대 한국어에서는 간결한 ‘그때’가 자연스럽습니다.
- source_word: προσηνέχθησαν αὐτῷ
  english_pob_choice: were brought to him
  chosen_korean: 예수께 데려와
  alternatives_korean:
  - 예수께 데려와졌습니다
  - 그에게 데려와졌습니다
  - 예수 앞으로 데려왔습니다
  lexicon: BDAG
  rationale: 수동형 ‘were brought’의 의미를 한국어에서는 자연스러운 ‘데려오다/데려가다’ 구문으로 풀어, 누가 아이들을 이동시켰는지의 수동성을 살렸습니다.
- source_word: τὰς χεῖρας ἐπιθῇ
  english_pob_choice: he might lay his hands on them
  chosen_korean: 손을 얹고
  alternatives_korean:
  - 안수하고
  - 손을 얹으시고
  - 그들 위에 손을 얹고
  lexicon: BDAG
  rationale: 헬라어 관용구 ἐπιτίθημι τὰς χεῖρας를 직역보다 자연스러운 ‘손을 얹다’로 옮겼고, 예수의 손을 뜻하는 것은 문맥상 분명하므로 별도의 소유격을 덧붙이지 않았습니다.
- source_word: προσεύξηται
  english_pob_choice: pray
  chosen_korean: 기도하시게 하려 하였으나
  alternatives_korean:
  - 기도하시도록 하려 하였으나
  - 기도하시게 하고자 하였으나
  - 기도하게 하려 하였으나
  lexicon: BDAG
  rationale: 동사의 목적을 드러내되, 원문에 없는 ‘그들을 위해’라는 목적어를 임의로 넣지 않고 단순히 ‘기도하시게 하다’로 표현했습니다.
- source_word: αὐτοῖς
  english_pob_choice: them
  chosen_korean: 그들을
  alternatives_korean:
  - 아이들을
  - 데려온 사람들을
  lexicon: BDAG
  rationale: 끝의 αὐτοῖς는 아이들일 수도, 데려온 사람들일 수도 있어 한국어에서도 의도적으로 ‘그들을’로 남겨 모호성을 보존했습니다.
theological_decisions:
- issue: 마지막 대명사 αὐτοῖς의 지시 대상
  chosen_reading: ‘그들을’로 두어 아이들과 데려온 사람들 중 어느 쪽인지 확정하지 않습니다.
  alternative_readings:
  - ‘아이들을’로 특정함
  - ‘데려온 사람들을’로 특정함
  rationale: 본문이 실제로 남겨 둔 지시상의 긴장을 해소하지 않고, POB의 기존 주석처럼 독자가 문맥 안에서 판단하도록 두는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'Translation philosophy: preserve genuine ambiguity rather than resolving it unnecessarily.'
