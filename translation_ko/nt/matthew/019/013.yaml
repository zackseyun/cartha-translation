revisions:
- from: 그때 사람들이 아이들을 예수께 데려와 예수께서 그들에게 손을 얹고 기도하시게 하려 하였으나, 제자들이 그들을 꾸짖었습니다.[a]
  to: 그때 아이들을 예수께 데려온 것은 예수께서 그들에게 손을 얹고 기도하시게 하려는 것이었습니다. 그러나 제자들은 그들을 꾸짖었습니다.[a]
  rationale: 명시되지 않은 행위자 ‘사람들’을 삭제하여 원문의 수동적 표현이 남기는 비특정성을 보존했습니다. ‘아이들을 예수께 데려온 것은 … 하려는 것이었습니다’는 한국어에서 자연스럽게 목적을 나타내며, 예수께서 손을 얹고 기도하신다는 내용을 유지합니다. 마지막 ‘그들을’과 각주를 그대로 두어 αὐτοῖς의 지시 대상 모호성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:37Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 사람들을 명시적으로 보충하여 원문 수동태가 남겨 둔 행위자를 특정합니다. 또한 ‘그때 사람들이’는 헬라어에 없는 주어입니다. 목적과 마지막 αὐτοῖς의 모호성은 유지되어야 합니다.
  naturalness: ‘예수께 데려와 예수께서 … 하시게 하려’는 문법적으로 가능하지만, 목적 구문의 실질 주체가 불분명하여 다소 걸립니다. 행위자를 보충하지 않은 채 목적을 자연스럽게 연결하는 표현이 더 좋습니다.
  terminology: ‘아이들’, ‘손을 얹고’, ‘기도하시다’, ‘제자들’, ‘꾸짖다’는 현대 표준어 합쇼체 및 복음서 문맥에 적절합니다. ‘안수’ 같은 교파적·기술적 표현을 도입할 필요가 없습니다.
