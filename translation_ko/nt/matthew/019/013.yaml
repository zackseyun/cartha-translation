    rationale: προσηνέχθησαν은 ‘데려와졌다/데려왔다’라는 수동 표현이며, 누가 데려왔는지는 명시하지 않습니다. ‘사람들’은 문맥상 가능한 추론이지만 본문에 없는 행위자 특정입니다.
  - severity: low
    issue: 목적 구문 ‘예수께서 … 하시게 하려’의 연결이 다소 어색합니다.
    rationale: ‘데려와’ 뒤의 생략 주어와 ‘예수께서’가 이어져 목적을 누가 의도했는지가 한국어 문장에서는 불필요하게 흔들립니다. 명사화한 목적 구문으로 자연스럽게 처리할 수 있습니다.
