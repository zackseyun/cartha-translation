translation:
  language: ko
  text: 그리고 그들에게 손을 얹으신 뒤, 그곳을 떠나셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 손을 얹으시고, 그곳을 떠나셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθεὶς
  english_pob_choice: after laying
  chosen_korean: 손을 얹으신 뒤
  alternatives_korean:
  - 손을 얹으시고
  - 손을 얹은 후
  lexicon: BDAG
  rationale: aorist 분사로서 주동사보다 앞선 동작을 나타내므로, 한국어에서는 자연스럽게 ‘-신 뒤’로 앞선 행위를 살렸습니다.
- source_word: τὰς χεῖρας αὐτοῖς
  english_pob_choice: his hands on them
  chosen_korean: 그들에게 손을 얹으신
  alternatives_korean:
  - 그들에게 그의 손을 얹으신
  - 그들에게 손을 얹으신
  lexicon: BDAG
  rationale: ‘손을 얹다’는 예수의 안수 행위를 직접 드러내는 관용 표현이라 그대로 살렸고, 주어가 예수이므로 소유격은 한국어에서 자연스럽게 드러나도록 했습니다.
- source_word: ἐπορεύθη
  english_pob_choice: he went on
  chosen_korean: 떠나셨습니다
  alternatives_korean:
  - 가셨습니다
  - 그곳을 떠나셨습니다
  lexicon: BDAG
  rationale: 문맥상 계속 이동하는 의미이지만, 앞선 안수 후 자리를 옮기는 흐름을 가장 자연스럽게 전달하는 말로 ‘떠나셨습니다’를 선택했습니다.
- source_word: ἐκεῖθεν
  english_pob_choice: from there
  chosen_korean: 그곳을
  alternatives_korean:
  - 거기서
  - 그곳에서
  lexicon: BDAG
  rationale: 장소 부사구를 한국어의 목적어형 표현으로 풀어 ‘그곳을 떠나셨습니다’라고 옮기면 간결하면서도 ‘from there’의 출발점을 분명히 드러냅니다.
theological_decisions:
- issue: 안수 행위의 성격
  chosen_reading: 본문의 구체적 동작인 ‘손을 얹다’를 유지하고, 본문에 없는 ‘축복하셨다’는 표현으로 바꾸지 않았습니다.
  alternative_readings:
  - ‘그들을 축복하신 뒤’로 의역
  rationale: 헬라어는 결과가 아니라 안수라는 행위를 직접 말하므로, 소스가 보증하는 범위를 넘지 않기 위해 물리적 행위를 본문에 그대로 반영했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 허용하는 의미 이상으로 의역하지 않음.
