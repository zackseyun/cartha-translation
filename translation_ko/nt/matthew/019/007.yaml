  verdict: approve
  source_fidelity: 헬라어의 역사적 현재 λέγουσιν은 서술 문맥에 맞게 과거형 ‘말했습니다’로 자연스럽게 옮겼습니다. Τί οὖν의 논쟁적 연결과 의문은 ‘그렇다면 … 왜’에 보존되어 있으며, ἐνετείλατο의 상대방 측 주장을 ‘명령했습니까’로 유지했습니다. δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι αὐτήν은 ‘이혼 증서를 주고 그 여자를 내보내라고’로 충실히 반영합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 질문의 어순도 무리가 없습니다. ‘그 여자를 내보내다’는 오늘날 다소 문자적으로 들릴 수 있으나, 이혼 증서와 결합된 본문 문맥 및 각주가 법적 이혼의 의미를 충분히 밝혀 줍니다.
  terminology: ‘이혼 증서’는 βιβλίον ἀποστασίου의 법적 문서성을 적절히 나타냅니다. ‘내보내다’는 ἀπολύω의 표면적 표현을 보존하면서 이 문맥의 이혼 의미를 각주로 설명합니다. 예수께 대한 존대와 본문 인물 지칭도 일관됩니다.
