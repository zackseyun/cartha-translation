id: MAT.19.7
reference: Matthew 19:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
  footnotes:
  - marker: a
    text: Or 'and to divorce her.' The Greek verb can mean 'to send away' and, in this context, functions as a term for divorce.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 예수께 말했습니다. "그렇다면 모세가 이혼 증서를 주고 그 여자를 내보내라고 왜 명령했습니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내보내다’는 이 문맥에서 이혼을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  english_pob_choice: They said to him
  chosen_korean: 그들은 예수께 말했습니다
  alternatives_korean:
  - 그들은 그에게 말했습니다
  - 그들이 예수께 말했습니다
  lexicon: BDAG
  rationale: 서술 흐름에 맞게 역사적 현재를 자연스러운 과거형으로 옮겼고, αὐτῷ는 문맥상 예수님을 가리켜 ‘예수께’로 구체화했습니다.
- source_word: Τί οὖν
  english_pob_choice: Why then
  chosen_korean: 그렇다면
  alternatives_korean:
  - 왜 그렇다면
  - 무엇을 그렇다면
  lexicon: BDAG
  rationale: 앞선 말씀에 대한 반박적 질문이므로 단순한 ‘무엇’보다 인과·논쟁의 연결을 드러내는 ‘그렇다면’이 더 적절합니다.
- source_word: βιβλίον ἀποστασίου
  english_pob_choice: a certificate of divorce
  chosen_korean: 이혼 증서
  alternatives_korean:
  - 이혼 서류
  - 이혼 문서
  - 이혼 증명서
  lexicon: BDAG
  rationale: 신명기 24장의 법적 문서를 가리키는 표현이므로, 현대 한국어에서 기능을 분명히 하는 ‘이혼 증서’로 옮겼습니다.
- source_word: ἀπολῦσαι αὐτήν
  english_pob_choice: to send her away
  chosen_korean: 그 여자를 내보내라고
  alternatives_korean:
  - 그 여자를 보내라고
  - 그 여자를 버리라고
  - 그 여자를 이혼시키라고
  lexicon: BDAG
  rationale: ἀπολύω의 직역적 이미지인 ‘내보내다’를 살리되, 이 문맥에서의 혼인 해소 의미가 앞의 ‘이혼 증서’로 이미 드러나도록 했습니다.
theological_decisions:
- issue: 예수님의 뒤이은 설명을 미리 반영해 ‘허락했다’로 완화할지 여부
  chosen_reading: 본문의 도전적 표현을 따라 ‘명령했습니까’로 유지했습니다
  alternative_readings:
  - 허락했습니까
  - 허용했습니까
  rationale: 헬라어는 분명히 ἐνετείλατο(명령했다)를 사용하므로, 상대방의 논쟁적 프레임을 보존하고 다음 절의 교정을 미리 삽입하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
