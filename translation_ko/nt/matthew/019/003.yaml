id: MAT.19.3
reference: Matthew 19:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
  footnotes:
  - marker: a
    text: Or “on any ground” or “for every cause.” The Greek phrase reflects a broad legal question about permissible grounds for divorce.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바리새인들이 그에게 다가와 그를 시험하며 말했습니다. “남자가 어떤 이유로든 자기 아내와 이혼하는 것이 허용됩니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 이유로”, “어떤 근거로든”. 그리스어 표현은 이혼이 허용되는 근거의 범위를 넓게 묻는 질문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  english_pob_choice: came up to
  chosen_korean: 와서
  alternatives_korean:
  - 다가와서
  - 예수께 나아와
  lexicon: BDAG
  rationale: 접근의 동작을 자연스러운 현대 한국어 서술로 살리되, 대화 진입을 분명하게 나타냈습니다.
- source_word: πειράζοντες
  english_pob_choice: testing
  chosen_korean: 예수를 시험하며
  alternatives_korean:
  - 예수를 시험하고
  - 예수를 떠보며
  - 예수를 시험하려고
  lexicon: BDAG
  rationale: 호의적 ‘유혹’이 아니라 적대적 검증의 의미를 살리기 위해 ‘시험하다’를 택했습니다.
- source_word: ἔξεστιν
  english_pob_choice: is it lawful
  chosen_korean: 합법적입니까
  alternatives_korean:
  - 허용됩니까
  - 정당합니까
  - 법적으로 가능합니까
  lexicon: BDAG
  rationale: 결혼/이혼을 둘러싼 공적·법적 논쟁의 성격을 드러내면서도, 현대 한국어에서 자연스럽게 들리는 표현을 택했습니다.
- source_word: ἀπολῦσαι τὴν γυναῖκα αὐτοῦ
  english_pob_choice: to divorce his wife
  chosen_korean: 자기 아내를 버리는
  alternatives_korean:
  - 자기 아내와 이혼하는
  - 자기 아내를 이혼하는
  - 자기 아내를 보내는
  lexicon: BDAG
  rationale: ἀπολύω의 직역상 ‘보내다/버리다’의 뉘앙스를 지니지만, 혼인 해소의 법적 의미를 문맥상 분명히 하기 위해 ‘버리다’를 사용했습니다. 다만 한국어 청중이 즉시 이해하도록 ‘합법적입니까’와 결합해 이혼 질문으로 읽히게 했습니다.
- source_word: κατὰ πᾶσαν αἰτίαν
  english_pob_choice: for any cause
  chosen_korean: 어떤 이유로든
  alternatives_korean:
  - 어떤 사유로든
  - 모든 이유로
  - 어떤 근거로든
  lexicon: BDAG
  rationale: 광범위한 허용 범위를 나타내는 표현으로, POB의 ‘for any cause’에 대응되는 가장 자연스러운 한국어를 사용했습니다.
theological_decisions:
- issue: 이혼 질문의 법적·논쟁적 성격을 한국어에서 어떻게 보존할 것인가
  chosen_reading: “사람이 어떤 이유로든 자기 아내를 버리는 것이 합법적입니까?”
  alternative_readings:
  - “사람이 어떤 이유로든 자기 아내와 이혼하는 것이 허용됩니까?”
  - “사람이 어떤 사유로든 자기 아내를 내치는 것이 합법적입니까?”
  rationale: 본문은 예수께 던지는 논쟁적 법률 질문이므로, 특정 교파적 결론을 미리 담지 않고 질문의 폭을 그대로 유지했습니다. ‘합법적입니까’는 ἔξεστιν의 공적 허용 가능성을 살립니다.
  doctrine_reference: 이혼 논쟁의 본문적 긴장 보존
- issue: ‘시험하며’의 적대적 태도를 어떤 정도로 드러낼 것인가
  chosen_reading: 예수를 시험하며
  alternative_readings:
  - 예수를 떠보며
  - 예수를 함정에 빠뜨리려 하며
  rationale: πειράζοντες의 의미를 과장하지 않으면서도 바리새인들의 적대적 의도를 충분히 드러내는 중립적 표현을 택했습니다.
  doctrine_reference: 본문의 서사적 적대성 유지
