  verdict: revise
  source_fidelity: ‘자기 아내를 버리는’은 ἀπολύω의 문자적 배경은 일부 반영하지만, 현대 한국어에서는 법적 혼인 해소보다 유기·방치의 뜻으로 쉽게 읽힙니다. 이 문맥의 관용적 법률 의미인 ‘이혼하다’를 명시하는 편이 충실합니다. 또한 ἔξεστιν은 현대 국가법의 적법성을 강하게 암시하는 ‘합법적입니까’보다 ‘허용됩니까’가 본문의 규범적·논쟁적 질문을 더 정확히 보존합니다.
  naturalness: ‘바리새인들이 그에게 다가와 그를 시험하며 말했습니다’와 ‘자기 아내와 이혼하는 것이 허용됩니까?’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘와서, 예수를 시험하며’의 쉼표와 예수의 반복도 정리했습니다.
