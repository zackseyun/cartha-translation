- from: 그리고 바리새인들이 예수께 와서, 예수를 시험하며 말했습니다. “사람이 어떤 이유로든 자기 아내를 버리는 것이 합법적입니까?”[a]
  to: 그리고 바리새인들이 그에게 다가와 그를 시험하며 말했습니다. “남자가 어떤 이유로든 자기 아내와 이혼하는 것이 허용됩니까?”[a]
  rationale: 이혼 문맥에서 ἀπολῦσαι의 관용적 법률 의미를 현대 한국어로 분명히 하고, ἔξεστιν의 폭넓은 규범적 허용 여부를 보존했습니다. ‘어떤 이유로든’과 각주를 통해 κατὰ πᾶσαν αἰτίαν의 넓은 범위를 유지했으며, 본문이 아직 제시하지 않는 이혼 교리에 관한 결론을 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:35Z'
