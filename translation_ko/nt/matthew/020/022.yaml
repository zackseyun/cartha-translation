id: MAT.20.22
reference: Matthew 20:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
  footnotes:
  - marker: a
    text: Or, more explicitly, 'the cup of suffering that I am about to drink.' The Greek keeps the metaphor 'cup,' a common biblical image for one's appointed portion, especially suffering.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 대답하여 말씀하셨습니다. “너희는 무엇을 구하는지 알지 못합니다. 내가 마시려는 잔을 너희가 마실 수 있습니까?” 그들이 그에게 말하였습니다. “마실 수 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘잔’이지만, 성경에서는 흔히 사람에게 정해진 몫, 특히 고난을 가리키는 상징으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  english_pob_choice: But Jesus answered and said
  chosen_korean: 예수께서 대답하여 말씀하셨습니다
  alternatives_korean:
  - 그리고 예수께서 대답하여 말씀하셨습니다
  - 예수께서 대답하셨습니다
  lexicon: SBLGNT / BDAG
  rationale: δὲ의 완만한 전환과 ἀποκριθεὶς εἶπεν의 관용구를 함께 살려, 한국어에서도 응답의 형식을 자연스럽게 드러냈습니다.
- source_word: τί αἰτεῖσθε
  english_pob_choice: what you are asking
  chosen_korean: 무엇을 구하는지
  alternatives_korean:
  - 무엇을 요청하는지
  - 무엇을 구하고 있는지
  lexicon: BDAG
  rationale: αἰτέω의 요청/구함을 한국어에서 가장 자연스럽게 나타내는 ‘구하다’를 택했고, 직접적인 지시절로 질문 내용을 유지했습니다.
- source_word: τὸ ποτήριον
  english_pob_choice: the cup
  chosen_korean: 잔
  alternatives_korean:
  - 그 잔
  - 술잔
  lexicon: BDAG
  rationale: 본문의 상징적 ‘컵’ 이미지를 유지하되, 한국어 성경 문맥에서 비유적 대상은 ‘잔’이 가장 널리 이해되므로 직역과 가독성의 균형을 택했습니다.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  english_pob_choice: that I am about to drink
  chosen_korean: 내가 마시려는
  alternatives_korean:
  - 내가 곧 마실
  - 내가 마시게 될
  lexicon: BDAG
  rationale: μέλλω의 임박성을 한국어의 의도/근접 미래 표현으로 살려, 예수의 다가오는 행위를 자연스럽게 표현했습니다.
- source_word: Δυνάμεθα
  english_pob_choice: We are able
  chosen_korean: 마실 수 있습니다
  alternatives_korean:
  - 할 수 있습니다
  - 마실 수 있어요
  lexicon: BDAG
  rationale: 앞선 ‘마시다’와 어휘를 맞추어 능력의 응답을 분명히 했으며, 단순한 가능성보다 실제 감당 가능성을 드러냈습니다.
theological_decisions:
- issue: ‘잔’의 비유를 본문에서 어떻게 처리할지
  chosen_reading: 본문에서는 ‘잔’을 그대로 유지하고, 그것을 곧바로 ‘고난’이나 ‘죽음’으로 풀어쓰지 않았습니다.
  alternative_readings:
  - 고난의 잔
  - 내가 곧 겪을 고난의 잔
  rationale: 영문 POB의 판단처럼 이 이미지는 성경적 상징으로서 의도적으로 열려 있으므로, 본문에서 의미를 과도하게 특정하지 않고 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
