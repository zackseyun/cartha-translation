review_pass:
  verdict: revise
  source_fidelity: 본문은 대체로 SBLGNT를 충실히 옮겼습니다. ‘무엇을 구하는지’, ‘마시려는 잔’, 능력을 묻고 긍정하는 응답이 원문의 의미와 비유를 보존합니다. 다만 각주가 본문 단어의 ‘직역’이라고 설명하는 방식은, 본문 자체가 이미 ‘잔’으로 번역되어 있어 부정확합니다.
  naturalness: 합쇼체 서술과 대화가 자연스럽습니다. ‘그들이 그에게 말하였습니다’도 문법적으로 문제없으나, 각주 표지는 설명 대상인 ‘잔’ 바로 뒤에 두는 편이 독자의 이해와 주석 연결에 더 자연스럽습니다.
  terminology: ‘잔’은 ποτήριον의 성경적 비유를 보존하는 적절한 용어입니다. 각주는 이를 ‘고난’으로 단정하지 않고 특히 고난과 관련될 수 있음을 밝히되, ‘사람에게 정해진 몫’이라는 넓은 의미를 함께 유지해야 합니다.
