  to: 예수께서 대답하여 말씀하셨습니다. “너희는 무엇을 구하는지 알지 못합니다. 내가 마시려는 잔[a]을 너희가 마실 수 있습니까?” 그들이 그에게 말하였습니다. “마실 수 있습니다.”
  rationale: 본문의 ‘잔’ 비유와 μέλλω의 가까운 미래성을 보존했습니다. 각주는 본문 번역을 ‘직역’으로 중복 설명하지 않고 비유적 용례만 간결하게 밝혔으며, 표지를 ‘잔’에 직접 연결했습니다.
