base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your slave[a].
  footnotes:
  - marker: a
    text: Or 'servant.' The Greek word is doulos, a stronger term than the one in the previous verse and often denotes a slave or bonded servant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 여러분 가운데서 첫째가 되고자 하는 사람은 여러분의 종이 되어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘섬기는 사람’. 그리스어 δοῦλος는 앞절의 표현보다 더 강한 말로, 보통 노예나 종속된 종을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  english_pob_choice: whoever wants
  chosen_korean: 여러분 가운데서 첫째가 되고자 하는 사람은
  alternatives_korean:
  - 누구든지 원하면
  - 누구든지 바라면
  lexicon: BDAG
  rationale: ἄν + 접속법이 나타내는 일반적·비한정적 조건을 한국어의 ‘-고자 하는 사람은’으로 자연스럽게 옮겨, 단순한 가능성보다 의지의 방향을 살렸습니다.
- source_word: ἐν ὑμῖν
  english_pob_choice: among you
  chosen_korean: 여러분 가운데서
  alternatives_korean:
  - 여러분 안에서
  - 여러분 사이에서
  lexicon: BDAG
  rationale: 이 문맥에서는 집단 내부의 서열을 가리키므로, 위치감이 분명한 ‘여러분 가운데서’가 가장 적절합니다.
- source_word: ἔσται
  english_pob_choice: will be
  chosen_korean: 되어야 합니다
  alternatives_korean:
  - 일 것입니다
  - 될 것입니다
  lexicon: BDAG
  rationale: 미래형이지만 여기서는 규범적·명령적 힘을 가지므로, 한국어에서는 단순 예고보다 요구를 드러내는 표현으로 옮겼습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종된 사람
  lexicon: BDAG
  rationale: 앞절의 διάκονος보다 더 강한 종속 관계를 드러내지만, 한국어에서는 마태복음의 제자도 훈시에서 ‘노예’가 지나치게 현대적 충격을 줄 수 있어 기본어 ‘종’을 택하되, 원문의 강도를 보존했습니다.
theological_decisions:
- issue: 제자 공동체 안의 위계 역전 표현
  chosen_reading: 첫째가 되려는 사람은 섬김의 신분으로 내려가야 한다는 역설을 유지했습니다.
  alternative_readings:
  - 첫째가 되려는 사람은 섬기는 사람이 되어야 한다
  - 첫째가 되려는 사람은 노예가 되어야 한다
  rationale: 예수의 말씀은 사회적 상승 욕구를 뒤집는 제자도 원리를 말하므로, 단순한 예절 수준으로 약화하지 않고 규범적 요구를 살렸습니다.
  doctrine_reference: Translation philosophy §1, §5; DOCTRINE.md Contested terms table for δοῦλος
