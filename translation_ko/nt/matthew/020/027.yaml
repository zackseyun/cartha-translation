  source_fidelity: 핵심 문장 구조와 규범적 미래의 의미는 대체로 충실합니다. 그러나 δοῦλος는 앞절의 διάκονος보다 강한 신분·예속의 표현이므로, 본문의 ‘종’만으로는 그 대조가 충분히 드러나지 않을 수 있습니다.
  naturalness: ‘여러분 가운데서 첫째가 되고자 하는 사람’도 이해되지만, ‘여러분 가운데에서 첫째가 되기를 원하는 사람’이 현대 표준 한국어에서 더 자연스럽고 직접적입니다. 현 각주는 ‘종속된 종’이라는 표현이 중복적이고 부자연스럽습니다.
