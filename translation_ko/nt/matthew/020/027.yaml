  to: 그리고 여러분 가운데에서 첫째가 되기를 원하는 사람은 여러분의 노예가 되어야 합니다.[a]
  rationale: ‘첫째가 되기를 원하는 사람’으로 일반적·의지적 조건을 자연스럽게 옮기고, 규범적 미래는 ‘되어야 합니다’로 유지했습니다. δοῦλος는 ‘노예’로 번역하여 앞절의 διάκονος보다 강한 표현이라는 원문의 대조를 보존했으며, ‘종’은 각주에 대안으로 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:37Z'
