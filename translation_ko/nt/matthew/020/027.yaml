    rationale: ‘종’은 한국어에서 servant와 slave 양쪽을 포괄할 수 있어, 앞절의 διάκονος와 대비되는 δοῦλος의 더 강한 예속 관계가 흐려질 수 있습니다. 본문은 ‘노예’로 하고 ‘종’을 각주 대안으로 제시하는 편이 원문의 수사적 강도를 더 잘 보존합니다.
