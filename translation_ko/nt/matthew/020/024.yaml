lexical_decisions:
- source_word: οἱ δέκα
  english_pob_choice: the ten
  chosen_korean: 열두 제자
  alternatives_korean:
  - 열 명
  - 열 사람
  - 열 제자
  lexicon: δέκα
  rationale: 문맥상 이전에 야고보와 요한을 제외한 제자단 전체를 가리키므로, 한국어에서는 자연스럽게 ‘열두 제자’로 풀어 주어 대조가 분명해지도록 했습니다.
- source_word: ἠγανάκτησαν
  english_pob_choice: became indignant
  chosen_korean: 분개하였습니다
  alternatives_korean:
  - 화를 냈습니다
  - 분노하였습니다
  - 노여워하였습니다
  lexicon: ἀγανακτέω
  rationale: 단순한 감정 변화가 아니라 도덕적·상황적 불만이 드러나는 동사이므로, 비교적 강한 ‘분개하다’로 옮겼습니다.
- source_word: περὶ τῶν δύο ἀδελφῶν
  english_pob_choice: about the two brothers
  chosen_korean: 두 형제 때문에
  alternatives_korean:
  - 두 형제에 대해
  - 두 형제와 관련하여
  - 두 형제에게
  lexicon: περί + genitive
  rationale: 여기서 περί는 대상에 대한 분노의 초점을 나타내므로, 한국어에서는 원인·대상 관계가 드러나는 ‘때문에’가 가장 자연스럽습니다.
theological_decisions:
- issue: 제자단 전체를 가리키는 수 표현과 대상 명시
  chosen_reading: ‘열두 제자’로 풀어 문맥상 집단 전체의 반응을 명확히 했습니다.
  alternative_readings:
  - ‘열 명’
  - ‘열 사람이’
  rationale: 본문의 수사적 초점은 남은 제자 전체가 두 형제의 행동에 반응했다는 점이므로, 독자가 인물 관계를 즉시 이해하도록 했습니다.
