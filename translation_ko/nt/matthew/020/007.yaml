base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
  footnotes:
  - marker: a
    text: Greek uses a historical present in both 'They say' and 'He says'; English may also be rendered with past tense ('They said ... He said') for smoother narrative flow.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말합니다[a]. “아무도 우리를 고용하지 않았기 때문입니다.” 그가 그들에게 말합니다. “너희도 포도원으로 가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘그들이 말합니다’와 ‘그가 말합니다’에 역사적 현재를 사용합니다. 한국어에서는 서술의 흐름에 따라 과거형으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  english_pob_choice: They said
  chosen_korean: 그들이 ... 말합니다
  alternatives_korean:
  - 그들이 ... 말했습니다
  lexicon: SBLGNT
  rationale: 원문은 역사적 현재형이므로, 한국어 본문에서는 서술의 생동감을 살리기 위해 현재형으로 옮겼습니다. 다만 자연스러운 문어체를 위해 과도한 구어화는 피했습니다.
- source_word: ἐμισθώσατο
  english_pob_choice: has hired
  chosen_korean: 고용하지 않았습니다
  alternatives_korean:
  - 고용한 사람이 없습니다
  - 일을 맡긴 사람이 없습니다
  lexicon: BDAG
  rationale: 동사는 일자리를 주기 위해 고용하다의 뜻이므로, 문맥상 ‘아무도 우리를 고용하지 않았다’가 가장 직접적입니다. 결과 상태를 드러내는 영어 현재완료의 뉘앙스도 한국어 부정 과거로 자연스럽게 전달됩니다.
- source_word: Ὑπάγετε
  english_pob_choice: go
  chosen_korean: 가십시오
  alternatives_korean:
  - 가세요
  - 가십시오들
  lexicon: BDAG
  rationale: 명령형의 직접성을 살리되, 합쇼체 문체에 맞게 정중한 명령인 ‘가십시오’로 옮겼습니다.
- source_word: ἀμπελῶνα
  english_pob_choice: vineyard
  chosen_korean: 포도원
  alternatives_korean:
  - 포도밭
  lexicon: BDAG
  rationale: 표준적 대응은 ‘포도원’이며, 농경지 일반이 아니라 포도 재배지를 뜻하는 원의 의미를 분명하게 유지합니다.
theological_decisions:
- issue: 역사적 현재의 재현 여부
  chosen_reading: 서술 동사들을 현재형으로 유지해 대화의 즉시성과 장면의 긴박함을 드러냈습니다.
  alternative_readings:
  - 과거형으로 평탄하게 옮김
  rationale: 원문이 λέγουσιν, λέγει의 역사적 현재를 사용하므로, 이를 모두 과거형으로 평준화하면 장면의 생동감이 약해집니다. 한국어에서도 현재형 서술이 충분히 자연스럽습니다.
  doctrine_reference: 본문 서사 스타일에 관한 번역 판단
