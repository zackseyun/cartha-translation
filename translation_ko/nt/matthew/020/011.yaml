review_pass:
  verdict: revise
  source_fidelity: λαμβάνειν의 완료된 선행 동작과 κατὰ+속격의 대상을 향한 적대적 불만은 잘 포착했습니다. 다만 οἰκοδεσπότης는 단순히 주택을 소유한 사람으로 흔히 이해되는 현대 한국어 ‘집주인’보다 한 집안/가산의 주인을 뜻하므로 표현을 조정하는 것이 더 정확합니다. 미완료 과거 ἐγόγγυζον은 진행·반복 또는 개시의 뉘앙스를 가질 수 있어 ‘불평하기 시작했습니다’는 가능한 번역입니다.
  naturalness: ‘그들이 받고 나서’는 목적어가 생략되어 약간 미완성으로 들리고, ‘투덜거리기’는 현대적이지만 비유의 서술에서는 다소 구어적입니다. ‘그들은 받은 뒤 … 불평하기 시작했습니다’가 현대 표준어 합쇼체에서 더 자연스럽고 명료합니다.
  terminology: οἰκοδεσπότης는 이 문맥에서 포도원의 소유주이기도 한 집안의 주인입니다. ‘그 집안의 주인’은 ‘집주인’이 유발할 수 있는 임대인·주택 소유자라는 현대적 연상을 피하면서 원어의 의미 범위를 보존합니다.
