  - 원망하기 시작했습니다
  - 불평하기 시작했습니다
  - 투덜거렸습니다
  lexicon: BDAG
  rationale: 반복적·불만 섞인 뉘앙스를 살리면서도 한국어에서 자연스러운 진행 개시를 나타내기 위해 ‘투덜거리기 시작했습니다’를 선택했습니다.
- source_word: οἰκοδεσπότου
  english_pob_choice: the master of the house
  chosen_korean: 집주인
  alternatives_korean:
