lexical_decisions:
- source_word: λαβόντες
  english_pob_choice: after receiving it
  chosen_korean: 받고 나서
  alternatives_korean:
  - 받은 뒤
  - 받자마자
  lexicon: BDAG
  rationale: 앞선 동작을 나타내는 부사절 분사로 보고, 한국어에서는 시간 선후를 자연스럽게 드러내는 ‘-고 나서’가 가장 분명합니다.
- source_word: ἐγόγγυζον
