  alternative_readings:
  - ‘주인’
  - ‘집안주인’
  rationale: 이 구절은 신학적 용어보다는 비유의 인물 호칭이 핵심이므로, 독자가 장면을 즉시 파악할 수 있는 중립적 표현을 택했습니다. 전통 교회어를 덧씌우기보다 원문 의미를 가깝게 전달하는 것이 적절합니다.
  doctrine_reference: 마태복음의 천국 비유 문맥
