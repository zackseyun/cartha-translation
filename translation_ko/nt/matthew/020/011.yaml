  - 원망하기 시작했습니다
  - 불평하기 시작했습니다
  - 투덜거렸습니다
  lexicon: BDAG
  rationale: 반복적·불만 섞인 뉘앙스를 살리면서도 한국어에서 자연스러운 진행 개시를 나타내기 위해 ‘투덜거리기 시작했습니다’를 선택했습니다.
- source_word: οἰκοδεσπότου
  english_pob_choice: the master of the house
  chosen_korean: 집주인
  alternatives_korean:
  - 가장의
  - 집안주인
  - 집의 주인
  lexicon: BDAG
  rationale: 직역형 ‘집의 주인’보다 비유 문맥에서 즉각 이해되는 표현을 택했습니다. 다만 ‘landowner’보다 원어의 집/가정-지배 의미를 더 직접적으로 드러내는 중립적 대응으로 보았습니다.
theological_decisions:
- issue: 예수의 비유 속 인물 지칭을 어떻게 한국어로 처리할지
  chosen_reading: οἰκοδεσπότης를 ‘집주인’으로 옮겨 비유의 서사적 역할을 유지했습니다.
  alternative_readings:
  - ‘주인’
  - ‘집안주인’
  rationale: 이 구절은 신학적 용어보다는 비유의 인물 호칭이 핵심이므로, 독자가 장면을 즉시 파악할 수 있는 중립적 표현을 택했습니다. 전통 교회어를 덧씌우기보다 원문 의미를 가깝게 전달하는 것이 적절합니다.
  doctrine_reference: 마태복음의 천국 비유 문맥
