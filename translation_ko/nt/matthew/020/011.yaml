    issue: ‘집주인’의 의미가 οἰκοδεσπότης보다 좁고 현대적으로 들립니다.
    rationale: 현대 한국어에서 ‘집주인’은 주로 주택 소유자 또는 임대인을 가리킵니다. 원어는 가정·가산의 주인, 이 비유에서는 포도원 주인을 가리키므로 ‘그 집안의 주인’이 더 충실합니다.
  - severity: low
    issue: ‘그들이 받고 나서’에서 받은 대상이 문법적으로 다소 불분명합니다.
    rationale: 원문의 목적어는 생략되어 있으나, 한국어에서는 ‘그들은 받은 뒤’가 문맥상 품삯을 자연스럽게 가리키면서 문장 흐름도 좋습니다.
  revised_text: 그들은 받은 뒤 그 집안의 주인에게 불평하기 시작했습니다.[a]
