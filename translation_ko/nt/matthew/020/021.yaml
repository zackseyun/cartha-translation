id: MAT.20.21
reference: Matthew 20:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
  footnotes:
  - marker: a
    text: Or “one on your right and one on your left.”
    reason: lexical_alternative
  - marker: b
    text: “Say” could be rendered “command” or, more interpretively, “grant,” but the Greek verb is simply “say.”
    reason: lexical_alternative
  - marker: c
    text: “Kingdom” may also be understood as “reign” or “royal rule.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그녀에게 말했습니다. “무엇을 원하십니까?” 그녀가 그에게 말했습니다. “이 두 아들인 제 아들들이 하나는 당신의 오른쪽에, 하나는 당신의 왼쪽에 앉게 명령해 주십시오. 당신의 나라에서 말입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “당신의 오른쪽에 하나, 당신의 왼쪽에 하나”로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: Εἰπὲ는 문자적으로는 “말하다”이지만, 여기서는 요청의 힘을 살려 “명령하다”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: βασιλεία는 “나라” 외에도 “통치” 또는 “왕권”으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  english_pob_choice: What do you want?
  chosen_korean: 무엇을 원하십니까?
  alternatives_korean:
  - 무엇을 바라십니까?
  - 무엇을 원하세요?
  lexicon: BDAG
  rationale: θέλω의 직접적인 질문으로서 요청의 내용을 묻는 말이므로, 현대 한국어에서는 자연스럽고 직설적인 “원하십니까”가 가장 적절합니다.
- source_word: Εἰπὲ
  english_pob_choice: Command
  chosen_korean: 명령해 주십시오
  alternatives_korean:
  - 말해 주십시오
  - 말씀해 주십시오
  - 허락해 주십시오
  lexicon: BDAG
  rationale: 문자적으로는 “말하다”이지만, 이어지는 ἵνα절을 포함한 요청의 맥락에서는 단순 발화보다 결과를 일으키는 요청으로 이해되므로, 본문의 힘을 살려 “명령해 주십시오”로 옮겼습니다.
- source_word: οὗτοι οἱ δύο υἱοί μου
  english_pob_choice: these two sons of mine
  chosen_korean: 이 두 아들인 제 아들들이
  alternatives_korean:
  - 이 두 아들
  - 제 두 아들
  lexicon: BDAG
  rationale: οὗτοι와 οἱ δύο, μου의 중첩된 소유 관계를 살려 “이 두 아들”과 “제 아들들”을 함께 드러냈습니다. 다만 한국어에서는 과도한 직역보다 관계가 분명해야 하므로 자연스러운 어순으로 정리했습니다.
- source_word: ἐν τῇ βασιλείᾳ σου
  english_pob_choice: in your kingdom
  chosen_korean: 당신의 나라에서
  alternatives_korean:
  - 당신의 왕국에서
  - 당신의 통치에서
  lexicon: BDAG
  rationale: βασιλεία는 여기서 왕권의 통치 영역을 가리키며, 문맥상 자리와 지위를 요청하는 말이므로 “나라”가 가장 자연스럽고 본문이 가진 왕적 의미도 보존합니다.
theological_decisions:
- issue: 오른쪽과 왼쪽의 좌석 요청이 가리키는 의미
  chosen_reading: 예수의 나라 안에서 최고의 명예 자리를 요청하는 말로 번역하되, 그 나라를 지상적 왕국이나 종말론적 완성 형태로 특정하지 않았습니다.
  alternative_readings:
  - 지상 메시아 왕국에서의 자리
  - 완성된 하늘 나라에서의 자리
  rationale: 헬라어는 단지 예수의 나라 안에서 오른쪽과 왼쪽의 자리를 요청한다고 말할 뿐이므로, 해석을 한 단계 더 밀어 특정 종말론 도식으로 고정하지 않고 긴장을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
