id: MAT.20.25
reference: Matthew 20:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
  footnotes:
  - marker: a
    text: Or “the rulers of the nations.”
    reason: alternative_reading
  - marker: b
    text: Or “their great ones” or “their high officials.”
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 그들을 가까이 불러 말씀하셨습니다. “너희는 이방 사람들의 통치자들이 그들을 지배하고, 그들의 큰 사람들은 그들 위에 권세를 부린다는 것을 알고 있습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘열방의 통치자들’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들의 큰 자들’, ‘그들의 높은 관리들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  english_pob_choice: calling them to himself
  chosen_korean: 그들을 가까이 불러
  alternatives_korean:
  - 그들을 불러
  - 자기에게 불러
  lexicon: BDAG
  rationale: 중간태 뉘앙스는 예수께서 단순히 부르신 것이 아니라 자기 곁으로 불러 말씀하신 행동을 가리키므로, 자연스러운 현대 한국어로 그 뜻을 살렸습니다.
- source_word: ἄρχοντες τῶν ἐθνῶν
  english_pob_choice: the rulers of the Gentiles
  chosen_korean: 이방 사람들의 통치자들
  alternatives_korean:
  - 열방의 통치자들
  - 이방 민족들의 통치자들
  lexicon: BDAG
  rationale: ἐθνῶν은 유대적 대조 속에서 ‘이방 사람들’로 옮기는 것이 문맥을 가장 잘 드러내며, ἄρχοντες는 정치적 지배자를 가리켜 ‘통치자들’이 적절합니다.
- source_word: κατακυριεύουσιν
  english_pob_choice: lord it over
  chosen_korean: 그들을 지배하고
  alternatives_korean:
  - 그들 위에 군림하고
  - 그들 위에서 군림하며
  lexicon: BDAG
  rationale: 복합동사의 압제적이고 군림하는 뉘앙스를 살리되, 한국어에서 지나치게 구어적인 ‘군림하다’보다 본문의 비판적 의미를 유지하는 ‘지배하다’로 옮겼습니다.
- source_word: κατεξουσιάζουσιν
  english_pob_choice: exercise authority over
  chosen_korean: 그들 위에 권세를 부린다는
  alternatives_korean:
  - 그들 위에 권위를 행사한다는
  - 그들 위에 통치권을 행사한다는
  lexicon: BDAG
  rationale: ἔ권한을 행사한다는 중립적 표현보다, 앞절의 ‘지배하다’와 평행을 이루는 압박감이 있는 ‘권세를 부리다’가 원문의 부정적 뉘앙스를 더 잘 드러냅니다.
- source_word: οἱ μεγάλοι
  english_pob_choice: their great men
  chosen_korean: 그들의 큰 사람들
  alternatives_korean:
  - 그들의 큰 자들
  - 그들의 고관들
  lexicon: BDAG
  rationale: 남성 복수형의 직설성을 유지하면서도 현대 한국어에서 자연스럽게 읽히도록 직역에 가까운 ‘큰 사람들’을 택했습니다.
theological_decisions:
- issue: ἐθνῶν의 번역
  chosen_reading: 이방 사람들
  alternative_readings:
  - 열방
  - 민족들
  rationale: 예수의 유대적 맥락에서 제자들에게 대비되는 지배 양식을 가리키므로, ‘이방 사람들’이 독자에게 문맥적 대비를 가장 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
