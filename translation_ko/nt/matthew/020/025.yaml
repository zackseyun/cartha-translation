  to: 예수께서 그들을 가까이 불러 말씀하셨습니다. “너희는 이방 사람들의 통치자들[a]이 그들을 지배하고, 그들의 유력자들[b]이 그들 위에 권세를 행사한다는 것을 알고 있습니다.”
