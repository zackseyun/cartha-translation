  verdict: revise
  source_fidelity: 현 초안은 ‘하늘 나라를 한 집 주인과 같으니’에서 비교 구문의 조사가 문법적으로 맞지 않으며, ἀνθρώπῳ οἰκοδεσπότῃ의 ‘한 사람, 곧 집 주인’이라는 병치가 축약되어 있습니다. 또한 ‘품삯에 고용하러’는 μισθώσασθαι를 불필요하게 중복·부자연스럽게 풀어낸 표현입니다.
  naturalness: ‘하늘 나라는 한 사람, 곧 집 주인과 같습니다’가 현대 표준 한국어의 자연스러운 비유 도입이며, 합쇼체 문장으로도 적절합니다. ‘이른 아침에’와 ‘고용하려고 나갔습니다’는 원문의 시간 및 목적 표현을 매끄럽게 반영합니다.
  terminology: ‘하늘 나라’, ‘집 주인’, ‘포도원’, ‘일꾼’은 마태복음의 문맥과 한국어 성서 문체에 무리 없이 맞습니다. ‘일꾼들을 고용하려고’는 고용 행위를 정확히 나타내며, 본 절에는 별도 각주가 필요하지 않습니다.
  issues:
