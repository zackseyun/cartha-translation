    issue: 비교 구문의 조사 오류
    rationale: ‘하늘 나라를 한 집 주인과 같으니’는 ‘같다’의 비교 대상에 필요한 ‘과/와’가 아닌 목적격 조사 ‘를’을 사용하여 비문이 됩니다.
  - severity: medium
    issue: ‘한 사람, 집 주인’의 병치 축약
    rationale: ἀνθρώπῳ οἰκοδεσπότῃ는 ‘한 사람, 곧 집 주인’이라는 표현을 포함합니다. 단순히 ‘한 집 주인’으로만 하면 ἄνθρωπος의 명시적 요소가 사라집니다.
  - severity: low
