  to: 하늘 나라는 이른 아침에 자기 포도원에 일꾼들을 고용하려고 나간 한 사람, 곧 집 주인과 같습니다.
  rationale: 비교 구문을 문법적으로 바로잡고, 원문의 ‘한 사람, 곧 집 주인’ 병치를 보존했습니다. 고용 목적과 포도원으로의 방향을 자연스럽고 충실하게 ‘자기 포도원에 일꾼들을 고용하려고’로 옮겼습니다.
