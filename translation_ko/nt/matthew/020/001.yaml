id: MAT.20.1
reference: Matthew 20:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: ko
  text: 하늘 나라를 한 집 주인과 같으니, 그가 이른 아침에 자기 포도원에서 일할 일꾼들을 품삯에 고용하러 나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  english_pob_choice: the kingdom of heaven
  chosen_korean: 하늘 나라
  alternatives_korean:
  - 하늘의 나라
  - 천국
  lexicon: βασιλεία τοῦ θεοῦ / τῶν οὐρανῶν
  rationale: 마태복음의 관용적 표현을 살리되, 한국어에서 자연스러운 직역형인 ‘하늘 나라’로 옮겨 하늘을 소유격으로 처리하지 않았습니다.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  english_pob_choice: a man, a master of a house
  chosen_korean: 한 집 주인
  alternatives_korean:
  - 한 사람, 집 주인
  - 한 가정의 주인
  lexicon: οἰκοδεσπότης
  rationale: 본문의 ‘사람’과 ‘집 주인’의 이중 표현을 한국어에서는 설명적으로 ‘한 집 주인’으로 압축해 어색한 중복을 피했습니다.
- source_word: μισθώσασθαι ἐργάτας
  english_pob_choice: to hire workers
  chosen_korean: 품삯에 고용하러
  alternatives_korean:
  - 일꾼들을 고용하러
  - 품꾼들을 사려고
  lexicon: μισθόω / ἐργάτης
  rationale: ‘일꾼들’을 기본으로 하되, 동사의 고용 행위를 드러내기 위해 ‘품삯에 고용하러’로 옮겨 노동 보상 관계를 분명히 했습니다.
- source_word: τὸν ἀμπελῶνα
  english_pob_choice: his vineyard
  chosen_korean: 자기 포도원
  alternatives_korean:
  - 그의 포도원
  - 자신의 포도원
  lexicon: ἀμπελών
  rationale: 소유 대명사 αὐτοῦ를 자연스럽게 살려 ‘자기’로 번역했습니다.
theological_decisions:
- issue: 비유의 첫 진술에서 ‘하늘 나라’의 비교 방식
  chosen_reading: “~와 같습니다”보다 서술형 “~를 한 …과 같으니”를 써서 비유 도입의 문장 구조를 보존했습니다.
  alternative_readings:
  - “하늘 나라는 …와 같습니다”
  - “하늘 나라는 …와 같습니다”
  rationale: 헬라어 Ὁμοία γάρ ἐστιν의 직접적인 비유 도입을 한국어 서술체로 옮겨, 문장 힘을 유지하면서도 읽기 자연성을 확보했습니다.
  doctrine_reference: 비유 해석의 문학적 형식 보존
- issue: ‘일꾼들’의 사회경제적 뉘앙스
  chosen_reading: ‘일꾼’으로 번역해 단순한 일반 노동자보다 임시 고용 노동자의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 노동자들
  - 품꾼들
  rationale: 문맥상 포도원에 하루 품을 팔 인력을 구하는 장면이므로, 고용 관계가 드러나는 표현을 택했습니다.
  doctrine_reference: 본문의 사회경제적 배경 보존
