id: MAT.20.2
reference: Matthew 20:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
  footnotes:
  - marker: a
    text: A denarius was a standard daily wage for a laborer.
    reason: cultural_note
translation:
  language: ko
  text: 그는 일꾼들과 하루 한 데나리온으로 합의한 뒤[a] 자기 포도원으로 그들을 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 데나리온은 노동자의 표준적인 하루 품삯이었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  english_pob_choice: After agreeing
  chosen_korean: 합의한 뒤
  alternatives_korean:
  - 동의한 뒤
  - 합의한 후에
  - 약정한 뒤
  lexicon: BDAG
  rationale: aorist 분사로서 주동사보다 앞선 합의 완료를 나타내므로, 자연스러운 한국어 시간 연결인 '...한 뒤'로 옮겼습니다.
- source_word: ἐργατῶν
  english_pob_choice: workers
  chosen_korean: 일꾼들
  alternatives_korean:
  - 노동자들
  - 일하는 사람들
  - 품꾼들
  lexicon: BDAG
  rationale: 포도원 고용 문맥에서 현대 한국어로 가장 자연스럽고 무난한 대응어로 '일꾼들'을 택했습니다.
- source_word: ἐκ δηναρίου τὴν ἡμέραν
  english_pob_choice: for one denarius for the day
  chosen_korean: 하루 한 데나리온으로
  alternatives_korean:
  - 하루에 한 데나리온으로
  - 하루치 한 데나리온으로
  - 하루 임금으로 한 데나리온
  lexicon: BDAG
  rationale: 합의된 일당을 뜻하므로 수량과 시간 범위를 함께 살려 '하루 한 데나리온으로'라고 압축해 옮겼습니다.
- source_word: ἀμπελῶνα
  english_pob_choice: vineyard
  chosen_korean: 포도원
  alternatives_korean:
  - 포도밭
  - 포도 재배지
  lexicon: BDAG
  rationale: 정착된 성경적 표준어인 '포도원'이 원어의 의미를 가장 직접적으로 전달합니다.
