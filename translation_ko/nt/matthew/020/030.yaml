id: MAT.20.30
reference: Matthew 20:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: ko
  text: 보십시오, 길가에 앉아 있던 눈먼 두 사람이 예수께서 지나가신다는 말을 듣고 큰 소리로 외쳤습니다. “주님, 우리에게 자비를 베풀어 주십시오, 다윗의 아들이시여!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  english_pob_choice: And behold
  chosen_korean: 그런데 보니
  alternatives_korean:
  - 보십시오
  - 보라
  lexicon: BDAG
  rationale: ἰδοὺ의 주의 환기와 장면 전환 효과를 한국어에서 자연스럽게 살리기 위해 서술 흐름을 여는 표현으로 옮겼습니다.
- source_word: τυφλοὶ
  english_pob_choice: blind men
  chosen_korean: 맹인
  alternatives_korean:
  - 눈먼 사람들
  - 소경
  lexicon: BDAG
  rationale: 두 사람 모두를 가리키는 남성 복수이지만, 현대 합쇼체에서 자연스럽고 간결한 표현으로 '맹인'을 택했습니다.
- source_word: παρὰ τὴν ὁδόν
  english_pob_choice: by the road
  chosen_korean: 길가에
  alternatives_korean:
  - 길 옆에
  - 도로 옆에
  lexicon: BDAG
  rationale: 장소 관계를 간명하게 드러내는 한국어 관용을 우선해, 도로의 가장자리에 앉아 있음을 자연스럽게 표현했습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 선생님
  lexicon: BDAG
  rationale: 예수께 대한 직접 호칭으로서 κύριε의 경외성과 메시아적 호소를 살리기 위해 '주님'을 사용했습니다.
- source_word: ἐλέησον ἡμᾶς
  english_pob_choice: have mercy on us
  chosen_korean: 우리에게 자비를 베풀어 주십시오
  alternatives_korean:
  - 우리를 불쌍히 여겨 주십시오
  - 우리에게 은혜를 베풀어 주십시오
  lexicon: BDAG
  rationale: 동사의 자비 요청을 한국어의 청유형으로 옮기되, 단순 감정이 아니라 구체적 호의를 구하는 의미를 분명히 했습니다.
- source_word: υἱὸς Δαυίδ
  english_pob_choice: Son of David
  chosen_korean: 다윗의 아들이시여
  alternatives_korean:
  - 다윗의 아들
  - 다윗의 자손이시여
  lexicon: BDAG
  rationale: 메시아 칭호를 유지하되, 예수께 대한 호칭으로 한국어 어순에 맞게 종결 호격을 살렸습니다.
theological_decisions:
- issue: 예수께 대한 κύριε의 호칭 수준
  chosen_reading: 주님
  alternative_readings:
  - 주여
  - 선생님
  rationale: 본문은 단순한 예의 호칭보다 메시아적 호소를 담고 있으므로, 한국어에서도 경외를 담는 '주님'이 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: contested terms, κύριος → 주님'
- issue: 다윗의 아들 칭호의 보존
  chosen_reading: 다윗의 아들이시여
  alternative_readings:
  - 다윗의 아들
  - 다윗의 자손이시여
  rationale: 이 표현은 단순 족보 설명이 아니라 마태복음의 메시아 칭호이므로, 호칭으로서의 긴박함과 의미를 함께 드러내도록 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: translate titles; preserve messianic force'
