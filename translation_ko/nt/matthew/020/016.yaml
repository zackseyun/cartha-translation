  text: 이처럼 마지막인 이들이 첫째가 되고, 첫째인 이들이 마지막이 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  english_pob_choice: So
  chosen_korean: 이처럼
  alternatives_korean:
  - 그리하여
  - 그러므로
  - 이와 같이
  lexicon: BDAG
  rationale: 결론적·귀결적 연결을 자연스럽게 살리면서도, 단순 인과보다 비유적 역전 진술의 도입으로 들리게 하기 위해 ‘이처럼’으로 옮겼습니다.
- source_word: οἱ ἔσχατοι
  english_pob_choice: the last
  chosen_korean: 마지막 사람들
  alternatives_korean:
  - 뒤에 있는 사람들
  - 나중 사람들
  - 마지막 자들
  lexicon: BDAG
  rationale: 단순한 시간 순서만이 아니라 문맥상 지위의 역전을 함께 담아, 한국어에서 자연스럽고 문맥 친화적인 복수 표현으로 옮겼습니다.
- source_word: πρῶτοι
  english_pob_choice: first
  chosen_korean: 먼저 된 사람들
  alternatives_korean:
  - 첫 사람들이
  - 앞선 사람들
  - 처음 사람들
  lexicon: BDAG
  rationale: ‘first’를 직역해도 되지만, 한국어에서는 두 절이 대칭을 이룰 때 ‘먼저 된’이 원문의 순서/지위 대비를 더 분명히 드러냅니다.
- source_word: ἔσχατοι / πρῶτοι
  english_pob_choice: the last / the first
  chosen_korean: 마지막 / 먼저 된
  alternatives_korean:
  - 나중 / 먼저
  - 뒤 / 앞
  lexicon: BDAG
  rationale: 원문의 반전 격언 구조를 유지하기 위해 동일한 대비축을 살렸고, 해석을 특정한 보상론이나 구원론으로 좁히지 않았습니다.
theological_decisions:
- issue: ‘first/last’ 역전의 범위
  chosen_reading: 이 말씀을 짧은 역전 격언으로 유지하여, 순서·지위·보상·구원 질서 중 어느 하나로도 미리 한정하지 않았습니다.
  alternative_readings:
  - 사회적 역전으로 한정
  - 제자도 보상의 역전으로 한정
  - 구원 서열에 대한 진술로 한정
  rationale: 그리스어 문장 자체가 역전의 선언만 제시하므로, 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
