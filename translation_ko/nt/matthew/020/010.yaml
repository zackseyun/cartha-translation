  source_fidelity: 원문의 시간적 분사 καὶ ἐλθόντες(‘오자/왔을 때’)가 초안에서는 드러나지 않습니다. ‘먼저 온 사람들’은 이 도착과 οἱ πρῶτοι의 선행 집단을 함께 자연스럽게 반영합니다. ‘더 받을 줄로 생각했지만’과 ‘그들도 한 데나리온씩 받았습니다’는 ἐνόμισαν, πλεῖον λήμψονται, καὶ αὐτοί 및 분배적 ἀνά를 충실히 옮깁니다.
  naturalness: ‘그 첫 사람들’은 현대 표준 한국어에서 다소 직역투입니다. ‘먼저 온 사람들’이 비유의 서술 흐름에서 더 자연스럽고, 합쇼체 종결도 적절합니다.
  terminology: ‘데나리온’은 통용되는 화폐명 음역이며, ‘한 데나리온씩’은 각 사람이 동일하게 받은 분배 의미를 정확히 나타냅니다. 문화 주석의 표지는 해당 화폐명에 붙이는 것이 적절합니다.
