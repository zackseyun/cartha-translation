id: MAT.20.10
reference: Matthew 20:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
  footnotes:
  - marker: a
    text: Or 'the first'; the phrase refers to the laborers hired first in the parable.
    reason: lexical_alternative
  - marker: b
    text: A denarius was a common daily wage for a laborer.
    reason: cultural_note
translation:
  language: ko
  text: 그 첫 사람들[a]은 더 받을 줄[b]로 생각했지만, 그들도 한 데나리온씩 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 첫째들’. 이 표현은 비유에서 먼저 고용된 일꾼들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 데나리온은 품꾼의 통상적인 하루 품삯이었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ πρῶτοι
  english_pob_choice: the first ones
  chosen_korean: 그 첫 사람들
  alternatives_korean:
  - 그 첫째들
  - 먼저 온 사람들
  lexicon: BDAG
  rationale: 비유의 앞선 고용자 집단을 가리키므로, 단순한 서열 표현보다 ‘그 첫 사람들’이 집단성을 살리면서도 자연스럽습니다.
- source_word: ἐνόμισαν
  english_pob_choice: they thought
  chosen_korean: …로 생각했지만
  alternatives_korean:
  - …라고 여겼지만
  - …라고 추측했지만
  lexicon: BDAG
  rationale: 기대와 추정을 나타내므로, 결과를 단정하지 않는 ‘생각했지만’이 문맥에 맞습니다.
- source_word: πλεῖον
  english_pob_choice: more
  chosen_korean: 더 받을 줄
  alternatives_korean:
  - 더 많이
  - 더 큰 몫을
  lexicon: BDAG
  rationale: 비교급 의미를 한국어에서 가장 간결하게 살리기 위해 ‘더’로 옮겼습니다.
- source_word: τὸ ἀνὰ δηνάριον
  english_pob_choice: a denarius each
  chosen_korean: 한 데나리온씩
  alternatives_korean:
  - 데나리온 한 닢씩
  - 한 데나리온마다
  lexicon: BDAG
  rationale: ἀνά의 분배적 용법을 ‘-씩’으로 자연스럽게 반영했고, 화폐명은 ‘데나리온’으로 음역했습니다.
