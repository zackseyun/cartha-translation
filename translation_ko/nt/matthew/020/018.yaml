review_pass:
  verdict: revise
  source_fidelity: ‘사형에 처할 것입니다’는 실제로 사형을 집행한다는 뜻으로 이해되기 쉬워, κατακρινοῦσιν αὐτὸν θανάτῳ의 법정적 판결 행위(‘그에게 사형을 선고하다’)를 정확히 나타내지 못합니다. 또한 각주 표지는 해당 어구에 붙어야 합니다.
  naturalness: 본문은 전반적으로 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘보십시오’와 ‘예루살렘으로 올라가고 있습니다’는 주의를 환기하는 표현 및 ἀναβαίνομεν의 상승 이동을 적절히 살립니다.
  terminology: ‘인자’, ‘대제사장들’, ‘서기관들’, ‘넘겨지다’는 복음서 문맥과 원문의 어휘 범위를 잘 보존합니다. ‘인자’와 παραδοθήσεται 관련 각주의 표지 위치 및 παραδοθήσεται의 대안 어구는 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: ‘사형에 처할 것입니다’는 κατακρίνω의 판결 의미보다 사형 집행을 뜻할 수 있습니다.
    rationale: κατακρινοῦσιν αὐτὸν θανάτῳ는 그를 죽이는 행위 자체가 아니라 그에게 죽음의 형벌을 선고하는 법정적 판단을 가리킵니다.
  - severity: low
    issue: 각주 [b]와 [c]가 해당 본문 어구에 붙어 있지 않으며, 각주 [b]의 첫 대안이 본문 선택어와 동일합니다.
    rationale: '[b]는 παραδοθήσεται(‘넘겨질 것이며’)에, [c]는 ‘인자’에 붙어야 독자가 주석 대상을 명확히 알 수 있습니다. 동일한 표현을 대안으로 제시하는 것은 유의미한 대안이 아닙니다.'
  revised_text: 보십시오, 우리는 예루살렘으로 올라가고 있습니다. 그리고 인자[c]는 대제사장들과 서기관들에게 넘겨질 것이며[b], 그들은 그에게 사형을 선고할 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “보라.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “내어주어질 것이며”; 이 동사는 더 좁은 문맥에서는 “배반당할 것이다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: “인자”는 예수의 특징적 자기지칭이며 다니엘 7:13–14를 암시할 수 있습니다.
    reason: cross_reference
  revision_rationale: κατακρινοῦσιν αὐτὸν θανάτῳ의 법정적 의미를 ‘그에게 사형을 선고할 것입니다’로 수정했습니다. 각주 [b]와 [c]를 각각 ‘넘겨질 것이며’와 ‘인자’ 바로 뒤에 배치했고, [b]의 중복된 대안은 수동태의 넓은 의미를 유지하는 ‘내어주어질 것이며’로 교정했습니다. 나머지 표현은 원문의 의미, 문체, 그리고 한국어 성경 용례에 충실하므로 유지했습니다.
