review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 문장 구조는 대체로 원문에 충실합니다. 다만 κατακρινοῦσιν αὐτὸν θανάτῳ는 실제 처형의 집행보다 사형이라는 형벌에 대한 법적 유죄 판결/선고를 가리키므로, ‘사형에 처할 것입니다’보다 ‘사형을 선고할 것입니다’가 더 정확합니다.
  naturalness: ‘보십시오’와 ‘예루살렘으로 올라가고 있습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. 접속사 ‘그리고’도 허용되나, 한국어 문장 흐름상 생략하는 편이 더 매끄럽습니다.
  terminology: ‘인자’, ‘대제사장들’, ‘서기관들’은 복음서의 확립된 한국어 성경 용어이며 적절합니다. ‘인자’ 관련 주석은 해당 어구 바로 뒤에, παραδοθήσεται 관련 주석은 ‘넘겨질 것이며’ 뒤에 배치해야 합니다.
  issues:
  - severity: medium
    issue: ‘사형에 처할 것입니다’는 κατακρίνω의 법적 판결과 뒤이은 실제 처형을 혼동할 수 있습니다.
    rationale: 원문은 ‘그를 죽음에 대하여/사형으로 유죄 판결할 것이다’라는 뜻입니다. 이 절에서는 처형을 집행한다는 뜻보다 사형을 선고한다는 법정적 행위가 정확합니다.
  - severity: medium
    issue: 주석 b의 대안이 본문 선택어 ‘넘겨질 것이며’와 동일하여 어휘 대안 주석으로 기능하지 않습니다.
    rationale: 영어 감사 기록의 ‘will be delivered over’에 상응하는 한국어 대안은 ‘내어주어질 것이며’ 또는 ‘넘겨 넘겨질 것이며’처럼 실제로 다른 표현이어야 합니다.
  - severity: low
    issue: 각주 표지가 관련 어구가 아니라 문장 끝에 한데 배치되어 있습니다.
    rationale: a는 Ἰδοὺ, b는 παραδοθήσεται, c는 ‘인자’에 관한 주석이므로 각각 해당 낱말 또는 구 뒤에 붙여야 독자가 주석 대상을 분명히 알 수 있습니다.
  revised_text: 보십시오[a], 우리는 예루살렘으로 올라가고 있습니다. 인자[c]는 대제사장들과 서기관들에게 넘겨질 것이며[b], 그들은 그에게 사형을 선고할 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “보라.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “내어주어질 것이며”; 이 동사는 더 좁은 문맥에서는 “배반당할 것이다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: “인자”는 예수의 특징적인 자기지칭이며, 다니엘 7:13–14를 암시할 수 있습니다.
    reason: cross_reference
  revision_rationale: 사형에 관한 법적 판결 의미를 정확히 드러내도록 ‘사형을 선고할 것입니다’로 수정했습니다. 또한 어휘 대안 주석 b를 실질적인 대안으로 고치고, 모든 주석 표지를 해당 원어 어구의 한국어 번역 바로 뒤로 옮겼습니다. ‘인자’, ‘대제사장들’, ‘서기관들’, ‘넘겨질 것이다’는 원문의 용어와 의도적 범위를 보존합니다.
