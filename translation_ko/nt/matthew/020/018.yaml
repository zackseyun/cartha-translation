id: MAT.20.18
reference: Matthew 20:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
  footnotes:
  - marker: a
    text: Or "Behold."
    reason: lexical_alternative
  - marker: b
    text: Or "will be delivered over"; the verb can also be rendered "will be betrayed" in a narrower context.
    reason: lexical_alternative
  - marker: c
    text: '"Son of Man" is Jesus'' characteristic self-designation and may echo Daniel 7:13–14.'
    reason: cross_reference
translation:
  language: ko
  text: 보십시오, 우리는 예루살렘으로 올라가고 있습니다. 그리고 인자는 대제사장들과 서기관들에게 넘겨질 것이며, 그들은 그를 사형에 처할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보라.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “넘겨질 것이며”; 이 동사는 더 좁은 문맥에서는 “배반당할 것이다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: “인자”는 예수의 특징적 자기지칭이며 다니엘 7:13–14를 암시할 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  - 보십시오
  lexicon: BDAG
  rationale: 주의를 끄는 담화 표지로서의 힘을 살리되, 현대 한국어 합쇼체에 맞게 정중하고 자연스럽게 옮겼습니다.
- source_word: ἀναβαίνομεν εἰς Ἱεροσόλυμα
  english_pob_choice: we are going up to Jerusalem
  chosen_korean: 예루살렘으로 올라가고 있습니다
  alternatives_korean:
  - 예루살렘으로 가고 있습니다
  - 예루살렘으로 올라갑니다
  lexicon: BDAG
  rationale: 현재형 이동 표현을 진행형으로 살리고, 예루살렘 ‘올라감’의 지리적·성경적 뉘앙스를 유지했습니다.
- source_word: παραδοθήσεται
  english_pob_choice: will be handed over
  chosen_korean: 넘겨질 것이며
  alternatives_korean:
  - 전달될 것이며
  - 배신당할 것이며
  - 내어주어질 것이며
  lexicon: BDAG
  rationale: 직역보다 넓은 ‘넘겨지다’로 옮겨, 즉각적 배신의 주체를 본문 밖에서 미리 특정하지 않으면서 수동태의 의미를 살렸습니다.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자이신 분
  lexicon: BDAG
  rationale: 복음서에서 예수의 자기지칭으로 굳어진 표현을 한국어 성경 관용에 따라 ‘인자’로 유지해 단순 인류 일반을 뜻하는 말로 평평하게 만들지 않았습니다.
- source_word: τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν
  english_pob_choice: to the chief priests and scribes
  chosen_korean: 대제사장들과 서기관들에게
  alternatives_korean:
  - 대제사장들과 율법학자들에게
  - 대제사장들과 학자들에게
  lexicon: BDAG
  rationale: 성경적 관용과 직결되는 직무명칭을 유지해, 제의 권력과 문서 해석 권위를 함께 드러냈습니다.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  english_pob_choice: they will condemn him to death
  chosen_korean: 그들은 그를 사형에 처할 것입니다
  alternatives_korean:
  - 그들은 그에게 사형을 선고할 것입니다
  - 그들은 그를 죽음에 이르게 할 것입니다
  lexicon: BDAG
  rationale: 법정적 판단의 결과를 한국어 법률 감각에 맞는 ‘사형에 처하다’로 옮겨, 단순한 감정적 비난이 아니라 공적 판결임을 드러냈습니다.
theological_decisions:
- issue: ‘인자’ 칭호의 유지와 해석 가능성
  chosen_reading: 예수의 자기지칭으로서 ‘인자’를 유지합니다.
  alternative_readings:
  - ‘사람의 아들’로 풀어쓰기
  - 의미를 풀어 ‘인간의 아들’로 번역
  rationale: 본절의 표현은 단순한 인간 일반이 아니라 복음서에서 예수의 특징적 자기호칭이므로, 전통적이면서도 본문 연결성을 살리는 ‘인자’를 유지했습니다.
  doctrine_reference: 마 20:18의 기독론적 자기지칭; 단 7:13–14 연관 가능성
- issue: παραδοθήσεται의 범위
  chosen_reading: 배신자를 미리 특정하지 않는 ‘넘겨질 것’으로 번역합니다.
  alternative_readings:
  - ‘배반당할 것’으로 번역
  - ‘팔려 넘겨질 것’로 구체화
  rationale: 헬라어 수동태는 ‘타인의 권력 아래로 넘겨짐’을 말하며, 이 절 자체는 행위자의 정체를 밝히지 않으므로 문맥보다 좁은 ‘배신’으로 제한하지 않았습니다.
  doctrine_reference: 본문 문맥과 서술 초점
