revisions:
- from: 무리가 그들을 꾸짖어 잠잠하게 하려고 했습니다. 그러나 그들은 더욱 크게 외치며 말했습니다. 「주님, 우리에게 자비를 베푸소서. 다윗의 아들이시여!」[a][b]
  to: 무리는 그들이 잠잠하도록 그들을 꾸짖었습니다. 그러나 그들은 더욱 크게[a] 외쳤습니다. 「주님, 우리에게 자비를 베푸소서. 다윗의 아들이시여![b]」
  rationale: 목적절을 ‘그들이 잠잠하도록’으로 고쳐 ἵνα σιωπήσωσιν의 목적 관계를 보존하면서 본문에 없는 시도 뉘앙스를 제거했습니다. 또한 직접 인용의 도입을 간결하게 다듬고, 각 주석 표지를 해당 표현에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:39Z'
review_pass:
  verdict: revise
  source_fidelity: ‘잠잠하게 하려고 했습니다’는 ἵνα σιωπήσωσιν의 목적을 대체로 전달하지만, ‘하려고 했습니다’는 본문에 없는 시도·미완료의 뉘앙스를 더합니다. 또한 ‘외치며 말했습니다’는 κράζω와 λέγω를 한국어에서 다소 중복되게 옮깁니다.
  naturalness: ‘그들이 잠잠하도록 그들을 꾸짖었습니다’는 목적 관계를 자연스럽고 분명하게 나타냅니다. 직접 인용은 ‘더욱 크게 외쳤습니다’ 뒤에 바로 제시하는 편이 현대 표준어 문체에서 더 간결하고 자연스럽습니다.
  terminology: ‘주님’, ‘자비를 베푸소서’, ‘다윗의 아들이시여’는 각각 Κύριε, ἐλέησον ἡμᾶς, υἱὸς Δαυίδ를 충실하게 반영하며, 메시아적 칭호를 보존합니다. ‘무리’도 ὄχλος에 적절합니다.
  issues:
  - severity: medium
    issue: ‘잠잠하게 하려고 했습니다’가 본문의 목적 표현에 시도라는 추가 뉘앙스를 부여합니다.
    rationale: ἐπετίμησεν과 ἵνα σιωπήσωσιν은 무리가 그들을 꾸짖은 목적이 침묵하게 하는 데 있었음을 말합니다. 한국어 ‘하려고 했습니다’는 실제 제지 행위보다 시도 자체를 부각할 수 있으므로 목적절을 직접 나타내는 표현이 더 안전합니다.
  - severity: low
    issue: ‘더욱 크게 외치며 말했습니다’가 한국어에서 다소 중복됩니다.
    rationale: λέγοντες는 외침의 내용을 도입하지만, 한국어 직접 인용에서는 ‘외쳤습니다’만으로도 내용 도입 기능이 자연스럽게 수행됩니다.
