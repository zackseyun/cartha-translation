id: MAT.20.31
reference: Matthew 20:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
  footnotes:
  - marker: a
    text: Or 'more loudly.' The Greek comparative may emphasize either increased intensity generally ('all the more') or volume specifically.
    reason: lexical_alternative
  - marker: b
    text: '''Son of David'' is a messianic title, not merely a statement of ancestry.'
    reason: cultural_note
translation:
  language: ko
  text: 무리가 그들을 꾸짖어 잠잠하게 하려고 했습니다. 그러나 그들은 더욱 크게 외치며 말했습니다. 「주님, 우리에게 자비를 베푸소서. 다윗의 아들이시여!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더욱 크게’는 비교급의 강도 증가를 살린 번역이며, 경우에 따라 ‘더 큰 소리로’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다윗의 아들이시여’는 단순한 혈통 진술이 아니라 마태복음에서의 메시아적 칭호를 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  english_pob_choice: the crowd
  chosen_korean: 무리
  alternatives_korean:
  - 군중
  - 사람들
  lexicon: BDAG
  rationale: ὄχλος는 여기서 예수를 따르던 ‘군중’이라기보다 맥락상 주변의 ‘무리’로 자연스럽게 읽히며, 한국어에서도 간결하고 구어적 부담이 적습니다.
- source_word: ἐπετίμησεν
  english_pob_choice: rebuked
  chosen_korean: 꾸짖어
  alternatives_korean:
  - 책망하여
  - 엄하게 나무라
  lexicon: BDAG
  rationale: ἐπιτιμάω의 강한 제지 뉘앙스를 살리면서도 한국어 서술에서는 ‘꾸짖다’가 가장 직접적이고 자연스럽습니다.
- source_word: μεῖζον
  english_pob_choice: all the more
  chosen_korean: 더욱 크게
  alternatives_korean:
  - 더욱
  - 한층 더 크게
  - 더 큰 소리로
  lexicon: BDAG
  rationale: 비교급이 단순한 강도의 증가를 나타내므로, ‘더욱 크게’로 소리의 증폭과 긴박감을 함께 드러냈습니다.
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 선생님
  lexicon: BDAG
  rationale: 예수께 직접 부르는 호칭으로서 ‘주님’이 합쇼체와 잘 맞고, 경외와 신앙적 호칭의 힘도 보존합니다.
- source_word: υἱὸς Δαυίδ
  english_pob_choice: Son of David
  chosen_korean: 다윗의 아들이시여
  alternatives_korean:
  - 다윗의 아들
  - 다윗의 자손이시여
  lexicon: BDAG
  rationale: 메시아적 칭호를 그대로 유지하되, 직접 호소하는 감탄형을 한국어에서 자연스럽게 살리기 위해 호격을 반영했습니다.
theological_decisions:
- issue: 메시아 칭호의 보존
  chosen_reading: υἱὸς Δαυίδ를 ‘다윗의 아들이시여’로 옮겨 메시아적 함의를 드러냈습니다.
  alternative_readings:
  - 다윗의 아들
  - 다윗의 자손
  rationale: 마태복음에서 이 표현은 단순한 계보 설명이 아니라 예수의 왕적·메시아적 정체성을 호소하는 칭호이므로, 축약하지 않고 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§2, 3; messianic title usage in Matthew
- issue: 예수께 대한 직접 호칭의 높임말
  chosen_reading: ‘주님’과 ‘-시여’로 예의를 표하면서도 본문의 간절한 외침을 보존했습니다.
  alternative_readings:
  - 주여
  - 선생님
  rationale: 대중에게 예수의 지위와 위상을 드러내는 호칭이므로, 지나치게 평면적인 ‘선생님’보다 ‘주님’이 더 적절하며, 한국어에서는 호격 ‘-시여’가 간청의 절박함을 살려 줍니다.
  doctrine_reference: 'Contested terms: κύριος → Lord'
