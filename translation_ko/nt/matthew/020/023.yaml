id: MAT.20.23
reference: Matthew 20:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
  footnotes:
  - marker: a
    text: Or, 'to sit on my right and on my left.'
    reason: lexical_alternative
  - marker: b
    text: The 'cup' is a metaphor for the suffering or destiny appointed to Jesus, which his disciples will also share.
    reason: cross_reference
translation:
  language: ko
  text: 그가 그들에게 말씀하셨습니다. 「너희는 참으로 내 잔[b]을 마실 것입니다. 그러나 내 오른편과 왼편[a]에 앉는 것은 내가 줄 일은 아닙니다. 그것은 내 아버지께서 예비해 두신 이들을 위한 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 오른쪽과 왼쪽에’.
    reason: lexical_alternative
  - marker: b
    text: ‘잔’은 예수께서 받으실 고난이나 그에게 정해진 운명을 가리키는 비유입니다. 제자들도 그것을 함께 겪게 됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  english_pob_choice: He said to them
  chosen_korean: 그가 그들에게 말씀하셨습니다
  alternatives_korean:
  - 그가 그들에게 말합니다
  - 그가 그들에게 이르셨습니다
  lexicon: BDAG
  rationale: 역사적 현재형이지만 한국어 서술문에서는 자연스러운 과거형이 적절하며, 예수의 발화를 존중하는 문맥상 ‘말씀하셨습니다’가 무난합니다.
- source_word: ποτήριόν μου
  english_pob_choice: my cup
  chosen_korean: 내 잔
  alternatives_korean:
  - 내 컵
  - 내 술잔
  lexicon: BDAG
  rationale: 직역적 이미지인 ‘잔’을 살려 고난과 운명의 비유를 본문에서 바로 드러내되, 해석은 본문 밖으로 넘깁니다.
- source_word: ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  english_pob_choice: at my right and at my left
  chosen_korean: 내 오른쪽과 왼쪽
  alternatives_korean:
  - 내 오른편과 왼편
  - 내 오른쪽에서와 왼쪽에서
  lexicon: BDAG
  rationale: 명예의 자리라는 의미를 한국어의 자연스러운 공간 표현으로 옮기되, ‘앉는’과 결합해 문맥을 유지했습니다.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  english_pob_choice: is not mine to grant
  chosen_korean: 내가 줄 수 있는 일이 아닙니다
  alternatives_korean:
  - 내가 주는 일이 아닙니다
  - 내가 허락할 일이 아닙니다
  lexicon: BDAG
  rationale: δοῦναι의 ‘주다’ 의미를 유지하면서도, 명예의 좌석을 정해 주는 맥락에서는 ‘허락’보다 ‘줄 수 있는 일’이 보다 직접적입니다.
- source_word: ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου
  english_pob_choice: but it is for those for whom it has been prepared by my Father
  chosen_korean: 오직 내 아버지께서 그것을 예비해 두신 사람들을 위한 것입니다
  alternatives_korean:
  - 그러나 그것은 내 아버지께서 예비해 두신 사람들을 위한 것입니다
  - 오직 그것은 내 아버지께서 마련해 두신 이들을 위한 것입니다
  lexicon: BDAG
  rationale: 완료 수동의 결과 상태를 ‘예비해 두신’으로 살리고, 문맥상 생략된 목적어를 ‘그것’으로 보충해 한국어 문장을 분명하게 했습니다.
theological_decisions:
- issue: 예수의 권한 진술과 아버지의 예비하심 사이의 관계
  chosen_reading: 예수의 발언을 완화하지 않고, 좌우의 자리가 아버지께서 예비하신 사람들에게 속한다는 문장 구조를 그대로 유지했습니다.
  alternative_readings:
  - ‘아버지와 함께 정하시는 것이다’처럼 조화시키는 표현
  - 예수의 권한이 약해 보이지 않도록 의역하는 표현
  rationale: 본문은 예수의 말씀과 아버지의 예비하심을 구별하여 말하므로, 번역에서 그 긴장을 보존하는 것이 소스에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
