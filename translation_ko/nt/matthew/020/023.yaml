revisions:
- from: 그가 그들에게 말씀하셨습니다. 「너희는 참으로 내 잔을 마시겠지만, 내 오른쪽과 왼쪽에 앉는 것은 내가 줄 수 있는 일이 아닙니다. 오직 내 아버지께서 그것을 예비해 두신 사람들을 위한 것입니다.」[a][b]
  to: 그가 그들에게 말씀하셨습니다. 「너희는 참으로 내 잔[b]을 마실 것입니다. 그러나 내 오른편과 왼편[a]에 앉는 것은 내가 줄 일은 아닙니다. 그것은 내 아버지께서 예비해 두신 이들을 위한 것입니다.」
  rationale: 원문의 대조 구조와 예수의 진술에 담긴 긴장을 유지하면서, ‘줄 수 있는’이 유발할 수 있는 능력 중심의 뉘앙스를 ‘줄 일은 아니다’로 바로잡았습니다. 자리 표현은 현대 표준어에서 더 자연스러운 ‘오른편과 왼편’으로 조정했으며, 각주 표지를 각주 대상에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:41Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 οὐκ ἔστιν ἐμὸν δοῦναι는 단순한 능력의 부정이라기보다 ‘내가 줄 일이 아니다/내 소관이 아니다’라는 진술이므로 ‘내가 줄 수 있는 일이 아닙니다’보다 더 직접적으로 옮기는 편이 좋습니다. 또한 ἀλλά의 대조는 ‘오직’보다 ‘그러나’가 문맥과 문법에 더 가깝습니다.
  naturalness: 합쇼체 서술과 예수의 발화는 자연스럽습니다. 다만 자리의 맥락에서는 ‘오른편과 왼편’이 ‘오른쪽과 왼쪽’보다 더 관용적이고 격조에 맞습니다. 각주 표지는 해당 낱말·구절 바로 뒤에 두어야 합니다.
  terminology: ‘잔’, ‘아버지’, ‘예비해 두신’은 적절합니다. ‘오른편과 왼편’을 사용하여 존귀한 자리라는 문맥을 자연스럽게 보존하되, 본문에 해석을 보태지 않았습니다.
  issues:
  - severity: medium
    issue: ‘내가 줄 수 있는 일이 아닙니다’는 원문의 ‘내가 주는 일이 아니다’보다 능력의 부정으로 들릴 수 있습니다.
    rationale: οὐκ ἔστιν ἐμὸν δοῦναι는 예수께서 그 자리를 수여하는 것이 자신의 역할·소관이 아니라고 말하는 구조입니다. ‘내가 줄 일은 아닙니다’가 이를 더 정확히 보존합니다.
  - severity: low
    issue: 각주 표지 [a]와 [b]가 문장 끝에 함께 배치되어 각주의 대상이 불명확합니다.
    rationale: '[a]는 좌우 자리 표현에, [b]는 ‘잔’에 각각 붙여야 독자가 각주 대상을 정확히 알 수 있습니다.'
  - severity: low
    issue: ‘오직’은 ἀλλά의 단순 대조를 다소 배타적으로 강화할 수 있습니다.
    rationale: ‘그러나’는 원문의 대조를 충분히 나타내면서 불필요한 강조를 피합니다.
