id: MAT.20.13
reference: Matthew 20:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
  footnotes:
  - marker: a
    text: Or, 'I am doing you no wrong.'
    reason: lexical_alternative
  - marker: b
    text: A denarius was a standard Roman silver coin, commonly understood as a typical day's wage for a laborer.
    reason: cultural_note
translation:
  language: ko
  text: 그가 대답하여 그들 중 한 사람에게 말했습니다. 「친구여, 나는 당신에게 잘못을 저지르지 않았습니다. 당신이 나와 함께 한 데나리온에 합의하지 않았습니까?」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘나는 당신에게 아무 잘못도 하지 않았습니다.’
    reason: lexical_alternative
  - marker: b
    text: 데나리온은 로마의 표준 은화로, 보통 노동자의 하루 품삯으로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  english_pob_choice: answering
  chosen_korean: 대답하여
  alternatives_korean:
  - 대답하면서
  - 응답하여
  - 대답하고
  lexicon: BDAG
  rationale: 분사로서 이어지는 발화를 여는 기능을 살려, 현대 한국어에서도 자연스러운 ‘대답하여’로 옮겼습니다.
- source_word: ἑνὶ αὐτῶν
  english_pob_choice: to one of them
  chosen_korean: 그들 중 한 사람에게
  alternatives_korean:
  - 그들 가운데 한 사람에게
  - 그들 중 한 명에게
  lexicon: BDAG
  rationale: 복수 집단에서 특정 개인 한 사람을 지칭하는 의미를 분명히 하면서, 구어적이기보다 문어적인 흐름을 유지했습니다.
- source_word: Ἑταῖρε
  english_pob_choice: Friend
  chosen_korean: 친구여
  alternatives_korean:
  - 벗이여
  - 동무여
  lexicon: BDAG
  rationale: 호격의 직접성을 살리되, 현대 한국어에서 가장 자연스러운 대응어를 택했습니다. 문맥상 따뜻한 친밀감보다 다소 거리감 있는 호칭일 수 있으나 그 긴장은 본문에서 보존했습니다.
- source_word: οὐκ ἀδικῶ σε
  english_pob_choice: I am not wronging you
  chosen_korean: 나는 당신에게 잘못을 저지르지 않았습니다
  alternatives_korean:
  - 나는 당신을 부당하게 대하지 않았습니다
  - 나는 당신에게 아무 잘못도 하지 않았습니다
  lexicon: BDAG
  rationale: ἀδικέω의 ‘부당하게 대하다/해를 끼치다/잘못하다’의 범위를 살리면서, 단순한 법적 판단보다 상대에게 끼친 ‘잘못’이라는 직접성을 드러냈습니다.
- source_word: δηναρίου
  english_pob_choice: for a denarius
  chosen_korean: 한 데나리온에
  alternatives_korean:
  - 데나리온 한 닢에
  - 데나리온 한 개에
  lexicon: BDAG
  rationale: 가격·보수의 기준이 되는 화폐를 보존하기 위해 음역어 ‘데나리온’을 유지하고, 한국어에서는 관용적으로 ‘~에’로 가격 합의를 표현했습니다.
theological_decisions:
- issue: 예수의 비유 속 주인의 말투와 호칭
  chosen_reading: 주인이 종들에게가 아니라 그들 중 한 사람에게 직접 ‘친구여’라고 부르며, 정당성 항변을 분명하고 단호하게 말하는 흐름을 살렸습니다.
  alternative_readings:
  - 호칭을 완화해 더 다정한 말투로 읽는 방식
  - ‘친구’의 거리감을 약화시키는 번역
  rationale: 본문은 따뜻한 위로보다 논쟁적 변론의 성격이 강하므로, 호칭의 표면적 친근함과 실제 문맥의 긴장을 함께 유지해야 합니다.
  doctrine_reference: 비유 해석의 문맥 보존
