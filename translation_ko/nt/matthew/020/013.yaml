  source_fidelity: 핵심 의미는 대체로 충실하나, ‘나와 함께 한 데나리온에 합의하다’는 원문의 가격·보수 조건을 두 사람이 함께 합의한 것처럼 읽히게 할 수 있습니다. συμφωνέω의 과거 합의와 δηναρίου의 보수 조건을 ‘한 데나리온을 받기로’로 명확히 해야 합니다. 또한 ἀδικῶ는 현재형이므로 ‘저지르지 않았습니다’보다 현재의 ‘부당하게 대하지 않습니다’가 더 적절합니다.
  naturalness: ‘당신에게 잘못을 저지르지 않았습니다’는 한국어에서 다소 부자연스럽고 완료된 행위를 가리키기 쉽습니다. ‘당신을 부당하게 대하지 않습니다’는 현대 표준어 합쇼체에서 자연스럽고 문맥의 항변을 잘 전달합니다.
  terminology: ‘데나리온’의 음역은 적절합니다. Ἑταῖρε의 ‘친구여’도 원문의 직접 호칭과 문맥상의 절제된 거리를 보존하는 안전한 표현입니다.
