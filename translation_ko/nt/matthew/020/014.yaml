base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
  footnotes:
  - marker: a
    text: Or, 'to this last one the same as to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 것을 가지고 가십시오. 나는 이 마지막 사람에게도 당신에게 주듯이 주고 싶습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 마지막 사람에게도 당신에게 하듯이 주고 싶습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἆρον
  english_pob_choice: Take
  chosen_korean: 가지고 가십시오
  alternatives_korean:
  - 받으십시오
  - 취하십시오
  lexicon: BDAG
  rationale: 여기서 aorist imperative는 소유물을 챙겨 떠나라는 뜻의 퇴장 명령이므로, 한국어에서는 직접적이면서도 자연스러운 “가지고 가십시오”가 가장 잘 맞습니다.
- source_word: τὸ σὸν
  english_pob_choice: what is yours
  chosen_korean: 네 것
  alternatives_korean:
  - 당신의 것
  - 네 몫
  lexicon: BDAG
  rationale: 중성 실질구는 상대가 자기 것으로 여기는 것을 가리키므로, “네 것”이 의미를 간결하게 살리고 추가 해석을 덜어 줍니다.
- source_word: ὕπαγε
  english_pob_choice: go
  chosen_korean: 가십시오
  alternatives_korean:
  - 가세요
  - 떠나십시오
  lexicon: BDAG
  rationale: 문맥상 해고가 아니라 퇴장을 지시하는 명령이므로, 짧고 단호한 “가십시오”가 원문의 기능을 그대로 전달합니다.
- source_word: τούτῳ τῷ ἐσχάτῳ
  english_pob_choice: to this last man
  chosen_korean: 이 마지막 사람에게도
  alternatives_korean:
  - 이 마지막 이에게도
  - 이 나중 사람에게도
  lexicon: BDAG
  rationale: 마지막에 온 특정 인물을 가리키는 표현이므로, 한국어에서는 남성형을 과도하게 표지하지 않되 인격적 지시가 드러나도록 “이 마지막 사람”으로 옮겼습니다.
theological_decisions:
- issue: 주인의 의사 표명과 비교 구문의 강조
  chosen_reading: “나는 … 주고 싶습니다”와 “당신에게 준 것과 같이”로, 주인의 자발적 의지와 동일 대우를 분명히 드러냈습니다.
  alternative_readings:
  - “주겠습니다”
  - “당신과 같이”
  rationale: θέλω는 단순 미래가 아니라 의지/원함을 나타내므로, “주고 싶습니다”가 발화의 의도를 더 직접적으로 반영합니다. ὡς καὶ σοί는 동등성을 말하므로 “준 것과 같이”로 비교를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2-4
