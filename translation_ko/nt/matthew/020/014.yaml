  source_fidelity: 첫 문장의 ‘네 것’은 합쇼체 ‘가십시오’와 높임 등급이 충돌합니다. 또한 ‘당신에게 준 것과 같이’는 원문의 현재 발화에 없는 과거 ‘준 것’을 보태며, 비교 대상도 ‘당신에게 [주는 것]’이라는 뜻으로 옮기는 편이 더 충실합니다.
  naturalness: ‘당신의 것을 가지고 가십시오’는 표준 현대 한국어의 일관된 합쇼체입니다. ‘이 마지막 사람에게도 당신에게 주듯이 주고 싶습니다’는 비교의 생략된 동사를 자연스럽게 보충하면서 원문의 의지 표현을 유지합니다.
  terminology: ‘마지막 사람’은 비유 속 개별 노동자를 가리키는 표현으로 무리 없이 사용할 수 있습니다. ‘주고 싶습니다’는 θέλω의 의지 표명을 보존합니다.
