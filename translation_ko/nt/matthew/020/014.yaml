    rationale: ‘당신에게 준 것과 같이’는 원문에 없는 과거 ‘준 것’을 명시합니다. ὡς καὶ σοί는 여기서 ‘당신에게도 주듯이/주는 것처럼’이라는 동등한 수여의 비교입니다.
