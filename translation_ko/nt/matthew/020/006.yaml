id: MAT.20.6
reference: Matthew 20:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
  footnotes:
  - marker: a
    text: Or, 'about eleven o’clock.' Literally, 'about the eleventh hour.'
    reason: lexical_alternative
  - marker: b
    text: 'Or, ''he said to them.'' The Greek uses a historical present: ''he says.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 한 시각쯤에 나가서 또 다른 이들이 서 있는 것을 보고, 그들에게 말합니다. “왜 여러분은 온종일 여기서 빈둥거리며 서 있습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열한 시쯤에’. 직역하면 ‘제십일 시쯤’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 그들에게 말했습니다’. 그리스어는 역사적 현재인 ‘말합니다’를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  english_pob_choice: about the eleventh hour
  chosen_korean: 한 시각쯤에
  alternatives_korean:
  - 열한 시쯤에
  - 제십일 시쯤에
  lexicon: BDAG
  rationale: περὶ + 대격의 근사 의미를 살려 ‘쯤에’로 옮겼고, 비유의 시간표현이 자연스럽게 읽히도록 했습니다.
- source_word: ἐξελθὼν
  english_pob_choice: he went out
  chosen_korean: 나가서
  alternatives_korean:
  - 나간 뒤
  - 밖으로 나가
  lexicon: BDAG
  rationale: 분사로서 앞선 동작을 나타내지만, 한국어에서는 앞뒤 관계를 자연스럽게 풀어 ‘나가서’로 옮기는 편이 원문 흐름을 더 잘 드러냅니다.
- source_word: ἄλλους ἑστῶτας
  english_pob_choice: others standing there
  chosen_korean: 또 다른 이들이 서 있는 것을
  alternatives_korean:
  - 다른 이들이 서 있는 것을
  - 다른 사람들을 서 있는 채로
  lexicon: BDAG
  rationale: ἄλλους의 실질적 명사용법을 ‘또 다른 이들’로 살리고, ἑστῶτας는 지속 상태를 나타내는 ‘서 있는’으로 옮겼습니다.
- source_word: καὶ λέγει αὐτοῖς
  english_pob_choice: and he says to them
  chosen_korean: 그들에게 말합니다
  alternatives_korean:
  - 그들에게 말합니다
  - 그들에게 말하셨습니다
  lexicon: BDAG
  rationale: 그리스어 현재형의 역사적 현재를 반영해 ‘말합니다’를 택했습니다.
- source_word: Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί
  english_pob_choice: Why have you been standing here idle all day?
  chosen_korean: 왜 여러분은 온종일 여기서 빈둥거리며 서 있습니까?
  alternatives_korean:
  - 왜 여러분은 온종일 여기서 놀고 있습니까?
  - 왜 여러분은 하루 종일 여기 서 있습니까?
  lexicon: BDAG
  rationale: Τί는 문맥상 ‘왜’로, ὧδε는 ‘여기서’로, ἑστήκατε는 지속적 상태를 나타내는 ‘서 있습니까’로 옮겼습니다. ἀργοί는 단순한 ‘일하지 않음’보다 현장의 무위·나태를 드러내는 ‘빈둥거리며’가 한국어에서 더 직접적입니다.
theological_decisions:
- issue: 역사적 현재(λέγει)의 처리
  chosen_reading: 서술의 생동감을 살리기 위해 현재형 ‘말합니다’를 유지했습니다.
  alternative_readings:
  - 말했습니다
  - 말하십니다
  rationale: 본문의 서사적 현재를 보존해 장면의 즉시성을 드러내려는 선택입니다.
  doctrine_reference: n/a
