  to: 또 제삼 시쯤 나가셔서 시장에 서서 일하지 않고 있는 다른 사람들을 보셨습니다.[a][b]
  rationale: 고대 유대식 시간 표현은 본문에서 ‘제삼 시쯤’으로 보존하고, 약 오전 9시라는 환산은 각주로 제시했습니다. ἀργούς는 ‘놀다’의 자발적 여가 뉘앙스를 피하여 ‘일하지 않고 있는’으로 옮겼습니다. 두 분사(‘서 있는’, ‘일하지 않는’)가 ‘다른 사람들’을 함께 수식하는 원문 구조도 한국어 문장 안에서 유지했습니다.
  reviewer_model: gpt-5.6-terra
