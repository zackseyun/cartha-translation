id: MAT.20.3
reference: Matthew 20:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
  footnotes:
  - marker: a
    text: Or 'about nine in the morning.' The phrase 'the third hour' reflects Jewish daytime reckoning from sunrise.
    reason: cultural_note
  - marker: b
    text: Or 'unemployed.' The Greek says 'idle,' describing that they were not at work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 세 시쯤 나가서 시장에 서 있는 다른 사람들을 보았습니다. 그들은 놀고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침 아홉 시쯤’입니다. ‘세 시’는 해 뜬 뒤부터 낮 시간을 세는 유대식 계산을 반영합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘실업 상태인’. 헬라어는 ‘게으른/한가한’에 가까워, 일하고 있지 않음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  english_pob_choice: going out
  chosen_korean: 나가서
  alternatives_korean:
  - 나가며
  - 나간 뒤
  lexicon: BDAG
  rationale: 아오리스트 분사로 이어지는 순차적 동작을 한국어 연결 어미로 자연스럽게 살렸습니다.
- source_word: περὶ τρίτην ὥραν
  english_pob_choice: about the third hour
  chosen_korean: 세 시쯤
  alternatives_korean:
  - 세 번째 시쯤
  - 아홉 시쯤
  lexicon: BDAG
  rationale: 주간을 유대식으로 세는 표현을 시간 감각이 드러나도록 풀어 옮기되, 본문 의미를 유지했습니다.
- source_word: ἀγορᾷ
  english_pob_choice: marketplace
  chosen_korean: 시장
  alternatives_korean:
  - 시장터
  - 광장
  lexicon: BDAG
  rationale: ἀγορά의 공적 집결 장소를 현대 한국어에서 자연스럽게 드러내는 말로 옮겼습니다.
- source_word: ἀργούς
  english_pob_choice: idle
  chosen_korean: 놀고 있었습니다
  alternatives_korean:
  - 한가해 있었습니다
  - 일이 없었습니다
  lexicon: BDAG
  rationale: 문맥상 ‘일하지 않고 있음’을 보여 주되, 현대 한국어에서 상태가 바로 이해되도록 표현했습니다.
theological_decisions:
- issue: 시간 표현을 유대식 절기로 유지할지 현대 시간으로 풀지 여부
  chosen_reading: 본문에는 ‘세 시쯤’을 두어 서술의 흐름을 살리고, 주석 없이도 자연스럽게 읽히게 했습니다.
  alternative_readings:
  - ‘세 번째 시쯤’으로 직역
  - ‘아홉 시쯤’으로 풀이
  rationale: 원문은 유대식 낮 시간 계산을 반영하지만, 한국어 본문은 독자가 즉시 이해할 수 있는 시간 표현이 더 적절합니다. 다만 본문의 사건 순서는 보존했습니다.
  doctrine_reference: 성경 본문의 역사적·문화적 배경을 전달하는 번역 원리
