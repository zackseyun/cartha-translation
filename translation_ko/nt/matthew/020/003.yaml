base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
  footnotes:
  - marker: a
    text: Or 'about nine in the morning.' The phrase 'the third hour' reflects Jewish daytime reckoning from sunrise.
    reason: cultural_note
  - marker: b
    text: Or 'unemployed.' The Greek says 'idle,' describing that they were not at work.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 제삼 시쯤 나가셔서 시장에 서서 일하지 않고 있는 다른 사람들을 보셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아침 아홉 시쯤’입니다. ‘제삼 시’는 해 뜬 뒤부터 낮 시간을 세는 유대식 계산을 반영합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘일이 없는’입니다. 그리스어는 ‘일하지 않는, 한가한’을 뜻하며, 이들이 일하고 있지 않았음을 가리킵니다.
    reason: lexical_alternative
