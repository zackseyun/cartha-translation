id: MAT.20.17
reference: Matthew 20:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: ko
  text: 예수께서 예루살렘으로 올라가시는 길에 열두 제자를 따로 데리고 가셔서, 길에서 그들에게 말씀하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  english_pob_choice: was going up
  chosen_korean: 올라가시는 길에
  alternatives_korean:
  - 올라가며
  - 상경하시며
  lexicon: BDAG
  rationale: 예루살렘으로의 지리적 ‘올라감’과 진행 중인 동작을 함께 살리기 위해 자연스러운 현재 진행형 표현으로 옮겼습니다.
- source_word: παρέλαβεν
  english_pob_choice: took
  chosen_korean: 따로 데리고 가셔서
  alternatives_korean:
  - 데리고 가셔서
  - 데려가셔서
  - 붙들어
  lexicon: BDAG
  rationale: 단순한 ‘취하다’보다 문맥상 제자들을 자신과 함께 특정한 자리로 이끈 뉘앙스를 반영했습니다.
- source_word: τοὺς δώδεκα μαθητὰς
  english_pob_choice: the twelve disciples
  chosen_korean: 열두 제자
  alternatives_korean:
  - 열두 사람
  - 열두 학습자
  lexicon: BDAG
  rationale: μαθητάς는 복음서 문맥에서 표준적으로 ‘제자’로 옮기는 것이 가장 정확하고 자연스럽습니다.
- source_word: κατ’ ἰδίαν
  english_pob_choice: aside by themselves
  chosen_korean: 따로
  alternatives_korean:
  - 따로 그들끼리
  - 은밀히
  - 따로 자신들끼리
  lexicon: BDAG
  rationale: 이 관용구는 다른 이들과 분리된 사적 상황을 뜻하므로, 한국어에서는 ‘따로’로 간결하게 살리되 앞뒤 문맥으로 비공개성을 드러냈습니다.
