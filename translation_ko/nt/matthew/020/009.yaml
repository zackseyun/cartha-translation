translation:
  language: ko
  text: 그리고 열한 번째 시각쯤에 온 사람들도 각각 한 데나리온씩 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 데나리온은 로마의 표준 은화로, 흔히 일꾼의 하루 품삯 정도로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리하여
  lexicon: BDAG
  rationale: 문맥을 이어 주는 단순 연결사로서, 한국어에서는 자연스러운 서술 연결인 ‘그리고’가 가장 적절합니다.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  english_pob_choice: those who came about the eleventh hour
  chosen_korean: 열한 번째 시각쯤에 온 사람들
  alternatives_korean:
  - 열한 번째 시각쯤 온 사람들
  - 열한 번째 시각 무렵에 온 사람들
  lexicon: BDAG
  rationale: περὶ + 시간을 ‘쯤에/무렵에’로 옮겨 대략성을 살렸고, 참여자를 가리키는 정관사구를 한국어의 자연스러운 명사구로 처리했습니다.
- source_word: ἔλαβον ἀνὰ δηνάριον
  english_pob_choice: received a denarius each
  chosen_korean: 각각 한 데나리온씩 받았습니다
  alternatives_korean:
  - 한 데나리온씩 받았습니다
  - 각 사람당 한 데나리온을 받았습니다
  lexicon: BDAG
  rationale: ἀνά의 분배적 의미를 ‘각각 …씩’으로 살렸고, δηνάριον은 역사적 화폐명인 ‘데나리온’으로 직역했습니다.
