  naturalness: ‘열한 번째 시각’은 현대 한국어에서 다소 직역투이며 시간 표현으로도 어색할 수 있습니다. ‘제십일시쯤’은 이 비유의 고대 시간 단위를 자연스럽게 가리킵니다. 또한 ‘각각 …씩’은 분배 표지가 중복되므로 ‘한 데나리온씩’으로 간결하게 옮기는 편이 자연스럽습니다.
