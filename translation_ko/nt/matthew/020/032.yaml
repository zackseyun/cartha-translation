  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
  footnotes:
  - marker: a
    text: Or, more formally, 'What do you desire that I should do for you?'
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 멈추시고 그들을 부르셔서 말씀하셨습니다. 「내가 너희를 위해 무엇을 해 주기를 바라느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멈추시고’는 στὰς의 관용적 의미를 자연스럽게 옮긴 것입니다. 더 직역하면 ‘서서’ 또는 ‘멈춰 서서’가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  english_pob_choice: stopped
  chosen_korean: 멈추시고
  alternatives_korean:
  - 서시고
  - 멈추셨습니다
  lexicon: BDAG
  rationale: 동작을 멈추었다는 서술을 자연스럽게 살리기 위해 ‘멈추시고’를 택했습니다. ‘서시고’는 동작의 중단보다 자세만을 부각할 수 있습니다.
- source_word: ἐφώνησεν
  english_pob_choice: called
  chosen_korean: 부르셔서
  alternatives_korean:
  - 불러서
  - 호명하셔서
  lexicon: BDAG
  rationale: 두 사람을 향해 소리 내어 부르는 뉘앙스를 살려 ‘부르셔서’로 옮겼습니다. 문맥상 단순한 호칭보다 부름의 행위가 더 분명합니다.
- source_word: Τί θέλετε ποιήσω ὑμῖν;
  english_pob_choice: What do you want me to do for you?
  chosen_korean: 내가 너희를 위해 무엇을 해 주기를 바라느냐?
  alternatives_korean:
  - 내가 너희에게 무엇을 해 주기를 원하느냐?
  - 너희를 위해 내가 무엇을 해 주기를 바라느냐?
  lexicon: BDAG
  rationale: 희망·의지를 나타내는 θέλετε를 ‘바라느냐’로 옮겨, 공손하지만 직접적인 질문의 힘을 살렸습니다. ποιήσω는 한국어에서 자연스러운 ‘해 주다’로 풀어 의미를 분명하게 했습니다.
theological_decisions:
- issue: 예수의 질문 어조
  chosen_reading: 권위적 명령이 아니라, 상대의 필요를 묻는 직접적이고 자비로운 초청으로 읽었습니다.
  alternative_readings:
  - 더 형식적인 질문으로 읽는 번역
  - 단순 정보 확인 질문으로 읽는 번역
  rationale: 문맥상 예수께서 당사자들의 소원을 직접 묻는 장면이므로, 한국어에서도 친절하지만 위엄 있는 직접성을 유지했습니다.
  doctrine_reference: '번역 원칙: 원문의 힘과 인격적 접촉을 보존'
