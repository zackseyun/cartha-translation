id: MAT.20.8
reference: Matthew 20:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: ko
  text: 저녁이 되자 포도원 주인이 자기 청지기에게 말합니다. “일꾼들을 불러 마지막 사람들부터 시작해서 첫 사람들까지 그들에게 품삯을 주십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  english_pob_choice: When evening came
  chosen_korean: 저녁이 되자
  alternatives_korean:
  - 저녁이 되었습니다
  - 저녁이 되자마자
  lexicon: ὀψία
  rationale: 시간 부사구를 자연스러운 현대 한국어로 옮기되, 사건 진행을 나타내는 문맥에 맞게 ‘-자’를 써서 다음 동작으로 이어지는 흐름을 살렸습니다.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  english_pob_choice: the master of the vineyard
  chosen_korean: 포도원 주인
  alternatives_korean:
  - 포도원의 주인
  - 포도원의 주인
  - 포도원 주인님
  lexicon: κύριος / ἀμπελών
  rationale: κύριος를 이 비유 문맥에서는 신학적 호칭보다 소유주를 가리키는 말로 보고, 자연스럽고 직역에 가까운 ‘주인’으로 옮겼습니다.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  english_pob_choice: to his steward
  chosen_korean: 자기 청지기에게
  alternatives_korean:
  - 자기 관리인에게
  - 자기 집사에게
  - 자기 감독에게
  lexicon: ἐπίτροπος
  rationale: ἐπίτροπος는 맡겨진 일을 관리하는 사람을 뜻하므로, 한국어 성경 전통과 문맥 모두를 고려해 ‘청지기’로 옮겼습니다.
- source_word: τοὺς ἐργάτας
  english_pob_choice: the workers
  chosen_korean: 일꾼들을
  alternatives_korean:
  - 노동자들을
  - 품꾼들을
  - 일하는 사람들을
  lexicon: ἐργάτης
  rationale: 포도원 고용 노동자라는 문맥을 살리면서도 현대 한국어에서 간결하고 자연스러운 ‘일꾼’이 가장 적절합니다.
- source_word: τὸν μισθὸν
  english_pob_choice: their wages
  chosen_korean: 품삯을
  alternatives_korean:
  - 임금을
  - 삯을
  - 보수를
  lexicon: μισθός
  rationale: 일용 노동의 대가라는 뉘앙스를 살리기 위해 ‘품삯’을 택했습니다. 한국어로도 고용 보상의 구체성이 분명합니다.
theological_decisions:
- issue: 직설적 현재형인 λέγει의 처리
  chosen_reading: ‘말합니다’로 옮겨 현재시제를 유지했습니다.
  alternative_readings:
  - 말했습니다
  - 말하십니다
  rationale: 본문의 현재형은 서술의 생동감과 장면 현장감을 주므로, 영어 POB의 ‘says’를 따라 한국어에서도 현재형을 유지했습니다.
  doctrine_reference: 서술적 현재의 문체 선택
