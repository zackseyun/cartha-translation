revisions:
- from: 저녁이 되자 포도원 주인이 자기 청지기에게 말합니다. “일꾼들을 불러 마지막 사람부터 시작하여 첫 사람에 이르기까지 품삯을 주십시오.”[a]
  to: 저녁이 되자 포도원 주인이 자기 청지기에게 말합니다. “일꾼들을 불러 마지막 사람들부터 시작해서 첫 사람들까지 그들에게 품삯을 주십시오.”
  rationale: 역사적 현재 ‘말합니다’와 기존의 핵심 용어는 유지했습니다. 다만 원문의 복수 표현인 ‘마지막 사람들’과 ‘첫 사람들’을 복수로 바로잡고, 품삯을 받는 대상인 ‘그들에게’를 명시했습니다. 번역 문체에 관한 비본문 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:25:37Z'
review_pass:
  verdict: revise
  source_fidelity: ‘말합니다’는 λέγει의 역사적 현재를 적절히 반영하며, ‘포도원 주인’, ‘청지기’, ‘일꾼들’, ‘품삯’도 문맥과 어휘에 잘 맞습니다. 그러나 τῶν ἐσχάτων와 τῶν πρώτων은 복수의 명사화된 표현이므로 ‘마지막 사람’과 ‘첫 사람’이라는 단수보다 복수로 옮기는 것이 원문에 더 충실합니다. 또한 αὐτοῖς(‘그들에게’)를 번역문에 명시하는 편이 지급의 수혜자를 분명히 합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지합니다. ‘마지막 사람들부터 시작해서 첫 사람들까지’는 원문의 지급 순서를 자연스럽게 드러내며, ‘그들에게 품삯을 주십시오’는 명령의 대상과 내용을 명료하게 합니다.
  terminology: ‘포도원 주인’은 비유 문맥의 κύριος에 적합하고, ‘청지기’는 ἐπίτροπος의 전통적이면서도 이해 가능한 번역입니다. ‘품삯’은 μισθός가 가리키는 노동의 대가를 잘 전달합니다.
  issues:
  - severity: medium
    issue: ‘마지막 사람’과 ‘첫 사람’이 단수로 번역됨
    rationale: 원문 τῶν ἐσχάτων과 τῶν πρώτων은 모두 복수 정관사와 형용사가 명사적으로 쓰인 표현이며, 문맥상 일꾼들의 집단을 가리킵니다. 복수로 번역해야 수와 지시 대상이 더 정확해집니다.
  - severity: low
    issue: αὐτοῖς(‘그들에게’)가 명시되지 않음
    rationale: 한국어에서는 목적어 생략이 가능하지만, 원문이 일꾼들을 불러 그들에게 품삯을 지급하라고 명시하므로 이를 드러내면 문장의 관계가 더 분명해집니다.
  - severity: low
    issue: 현재형 사용을 설명하는 문체 각주가 본문 주석으로 남아 있음
    rationale: 이 각주는 원문의 본문 의미나 본문비평상 변이를 설명하지 않고 번역 선택을 메타적으로 설명합니다. 번역문 자체가 현재형을 충분히 반영하므로 삭제하는 편이 독자용 본문에 더 적절합니다.
