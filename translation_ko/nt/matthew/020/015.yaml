source:
  edition: SBLGNT
  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
  footnotes:
  - marker: a
    text: 'Or: ''Are you envious because I am good?'' The expression ''your eye is evil'' is a Greek idiom for envy or begrudging resentment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 것을 가지고 내가 원하는 대로 하는 것이 내게 허용되지 않습니까? 아니면 내가 선하다고 해서 당신의 눈이 악한 것입니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: “내가 선하므로 당신이 시기합니까?” “당신의 눈이 악하다”는 표현은 시기나 못마땅해하는 원망을 뜻하는 그리스어 관용구입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔξεστίν μοι
  english_pob_choice: is it lawful for me
  chosen_korean: 내게 합법적이지 않습니까
  alternatives_korean:
  - 내게 허용되지 않습니까
  - 내게 할 권리가 없습니까
  lexicon: BDAG
  rationale: ἔξεστίν은 허용/합법의 의미를 가지므로, 예수님의 비유 안에서 주인의 권리·정당성을 드러내는 표현으로 옮겼습니다. '합법적'은 현대 한국어에서 다소 법정적이지만 원문의 권리 주장과 잘 맞습니다.
- source_word: ὃ θέλω ποιῆσαι
  english_pob_choice: to do what I want
  chosen_korean: 내 뜻대로 하는 것
  alternatives_korean:
  - 내가 원하는 것을 하는 것
  - 내가 하고 싶은 것을 하는 것
  lexicon: BDAG
  rationale: θέλω는 개인적 의지/원함을 나타내므로, 자연스러운 한국어로 '내 뜻대로'를 택해 주인의 자의적 의지가 아니라 자유로운 의사 결정을 살렸습니다.
- source_word: ἐν τοῖς ἐμοῖς
  english_pob_choice: with what is mine
  chosen_korean: 내 것을 가지고
  alternatives_korean:
  - 내 소유로
  - 내 것들로
  - 내 소유에 대하여
  lexicon: BDAG
  rationale: 이 구문은 소유물을 가리키는 관용적 표현이므로 '내 것'으로 풀어 소유권을 분명히 했습니다. '가지고'는 동사와 결합해 한국어에서 자연스럽습니다.
- source_word: ὀφθαλμός σου πονηρός
  english_pob_choice: is your eye evil
  chosen_korean: 당신의 눈이 악합니까
  alternatives_korean:
  - 당신은 시기합니까
  - 당신의 눈이 나쁩니까
  lexicon: BDAG
  rationale: 직역적 이미지를 유지해 원문의 관용구를 드러내되, 한국어에서는 '악한 눈'보다 문장형으로 풀어 자연성을 확보했습니다. 본문은 관용적 의미를 즉시 해소하지 않도록 보존했습니다.
theological_decisions:
- issue: ὀφθαλμός σου πονηρός의 관용구를 본문에서 어떻게 처리할지
  chosen_reading: 본문은 '당신의 눈이 악합니까'로 직역 이미지를 살리고, 해석을 강제하지 않았습니다.
  alternative_readings:
  - 당신이 시기합니까
  - 당신이 내가 선하므로 질투합니까
  rationale: 비유의 대비는 주인의 선함과 상대의 '악한 눈' 사이에 있습니다. 본문에서 의미를 단일 해석으로 좁히기보다, 독자가 원문의 긴장을 보도록 두는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3, 원문 이미지와 신학적 긴장 보존
