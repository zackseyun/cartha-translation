  source_fidelity: 첫 절은 소유물에 관하여 자신의 뜻대로 행할 권리/허용을 묻는 원문의 수사 의문문을 대체로 잘 반영합니다. 후반부도 ‘악한 눈’의 비유적 표현과 ‘내가 선하다’는 인과절을 보존합니다.
