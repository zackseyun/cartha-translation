  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
  footnotes:
  - marker: a
    text: Or 'as they departed from Jericho.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 여리고에서 나가고 있을 때에 많은 무리가 그를 따랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 여리고를 떠나고 있을 때에”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένων αὐτῶν
  english_pob_choice: as they were going out
  chosen_korean: 그들이 … 나가고 있을 때에
  alternatives_korean:
  - 그들이 … 떠나고 있을 때에
  - 그들이 … 나갈 때에
  lexicon: BDAG
  rationale: 현재분사적 시간 배경을 살려 진행 중인 동작으로 옮겼습니다. '나가고 있을 때에'가 자연스러운 현대 한국어이면서 원문의 진행성을 보존합니다.
- source_word: ἀπὸ Ἰεριχώ
  english_pob_choice: from Jericho
  chosen_korean: 여리고에서
  alternatives_korean:
  - 여리고로부터
  - 여리고를 떠나
  lexicon: BDAG
  rationale: ἀπό의 분리·이탈 의미를 한국어 조사 '에서'로 간결하게 살렸습니다. '떠나'는 의미를 덧붙여 해석을 넓힐 수 있어 기본 문장에서는 피했습니다.
- source_word: ἠκολούθησεν αὐτῷ
  english_pob_choice: followed him
  chosen_korean: 그를 따랐습니다
  alternatives_korean:
  - 그 뒤를 따랐습니다
  - 그에게서 뒤따랐습니다
  lexicon: BDAG
  rationale: ἀκολουθέω의 기본적 서술을 현대 한국어의 '따르다'로 옮겼습니다. 목적어 '그'는 예수님을 가리키는 단수 대명사를 그대로 반영합니다.
- source_word: ὄχλος πολύς
  english_pob_choice: a large crowd
  chosen_korean: 많은 무리가
  alternatives_korean:
  - 큰 무리가
  - 많은 군중이
  lexicon: BDAG
  rationale: 수량적 강조를 '많은'으로, 집합 명사를 '무리'로 옮겨 자연스러운 한국어 문장을 만들었습니다. '군중'은 다소 문어적이고 거리감이 있어 덜 적합합니다.
theological_decisions:
- issue: 복수 주어 뒤의 단수 대명사 αὐτῷ의 지시 대상
  chosen_reading: '''그''는 예수님을 가리키며, 무리가 예수님을 따랐다는 구조를 그대로 드러냅니다.'
  alternative_readings:
  - 단순히 앞의 복수 집단을 가리키는 것으로 완화
  - 문맥상 지시를 뭉뚱그려 '그들을'로 처리
  rationale: 헬라어는 복수 분사 뒤에 단수 대명사로 전환하여 초점을 예수님에게 둡니다. 한국어도 이 전환을 평준화하지 않고 보존했습니다.
  doctrine_reference: 원문 초점 보존 원칙
