  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
  footnotes:
  - marker: a
    text: Or, 'It is not so among you.' The Greek uses a future verb ('shall be'), which may express how things are not to be among Jesus' followers.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데서는 그렇게 되지 않을 것입니다. 그러나 너희 가운데서 큰 사람이 되기를 원하는 사람은 너희를 섬기는 사람이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 가운데서는 그렇게 되지 않을 것입니다’는 헬라어 미래형 ἔσται를 살린 번역입니다. 문맥에 따라 ‘너희 가운데서는 그렇지 않습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  english_pob_choice: It shall not be so among you
  chosen_korean: 그렇지 않을 것입니다
  alternatives_korean:
  - 너희 가운데서는 그렇지 않습니다
  - 너희 가운데서는 그러하지 않을 것입니다
  lexicon: BDAG
  rationale: 미래형 ἔσται의 앞으로의 규범적 진술을 살려 ‘~일 것입니다’로 옮기되, ἐν ὑμῖν의 공동체적 의미는 문맥상 앞 문장과 이어지는 한국어 문장으로 자연스럽게 드러냈습니다.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  english_pob_choice: But whoever wants
  chosen_korean: 그러나 너희 가운데서 큰 사람이 되고자 하는 사람은
  alternatives_korean:
  - 그러나 누구든지 원하면
  - 그러나 누구든지 바라면
  lexicon: BDAG
  rationale: ὃς ἂν θέλῃ의 일반적·포괄적 조건을 ‘~하는 사람은’으로 풀어, 희망의 방향이 ‘큰 사람’이 되려는 의지에 있음을 자연스럽게 살렸습니다.
- source_word: μέγας γενέσθαι
  english_pob_choice: to become great
  chosen_korean: 큰 사람이 되고자 하는
  alternatives_korean:
  - 크게 되려는
  - 위대해지려는
  lexicon: BDAG
  rationale: γενέσθαι의 ‘되다’라는 도착점을 살려 단순한 상태 묘사보다 ‘되어 가려는/되고자 하는’ 의미를 반영했고, μέγας는 문맥상 서열적 ‘큰 사람’이 가장 직접적입니다.
- source_word: διάκονος
  english_pob_choice: servant
  chosen_korean: 종이 되어야 합니다
  alternatives_korean:
  - 종이 되어야 합니다
  - 섬기는 사람이 되어야 합니다
  - 집사가 되어야 합니다
  lexicon: BDAG
  rationale: διάκονος는 여기서 교회 직분이 아니라 섬기는 사람을 뜻하므로, 영어 POB의 ‘servant’에 맞춰 ‘종’으로 옮겼습니다. ‘집사’는 제도적 직분을 연상시키고, ‘섬기는 사람’은 뜻은 분명하지만 본문의 압축성을 약화합니다.
theological_decisions:
- issue: 제자 공동체 안의 위계 전복
  chosen_reading: 세속적 크기와 지배의 질서를 뒤집는 규범적 선언으로 읽되, 후대 교회 직분 체계로 제도화하지 않았습니다.
  alternative_readings:
  - ‘종’을 지나치게 일반적 봉사로 완화하는 읽기
  - ‘집사’로 직분화하는 읽기
  rationale: 문맥상 예수의 제자들에게 주는 공동체 규범이므로, 구체적 종-섬김 언어를 유지하면서도 직분적 의미로 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
