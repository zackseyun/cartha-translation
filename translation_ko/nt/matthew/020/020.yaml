source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
  footnotes:
  - marker: a
    text: Or 'worshiping'; the Greek verb can mean bowing in reverence, paying homage, or worship, depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 세베대의 아들들의 어머니가 자기 아들들과 함께 예수께 나아와 절하며 그분께 무엇인가를 청하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경배하며’. 이 그리스어 동사는 문맥에 따라 경의를 나타내며 절하는 것 또는 경배를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  english_pob_choice: Then
  chosen_korean: 그때에
  alternatives_korean:
  - 그때
  - 그 후에
  lexicon: BDAG
  rationale: 문맥상 다음 사건으로 이어지는 시간 연결어이므로, 서술 흐름을 자연스럽게 살리는 ‘그때에’가 적절합니다.
- source_word: προσῆλθεν αὐτῷ
  english_pob_choice: came to him
  chosen_korean: 예수께 와서
  alternatives_korean:
  - 그에게 다가와
  - 그에게 나아와
  lexicon: BDAG
  rationale: 동사는 단순한 접근/도착을 뜻하므로, 한국어에서는 자연스러운 ‘예수께 와서’로 옮기되 목적지를 분명히 했습니다.
- source_word: προσκυνοῦσα
  english_pob_choice: bowing down
  chosen_korean: 절하며
  alternatives_korean:
  - 엎드려 절하며
  - 경배하며
  - 예배하며
  lexicon: BDAG
  rationale: 이 동사는 문맥에 따라 경배와 경의 표시 사이의 폭이 있어, 행위의 몸짓을 드러내는 ‘절하며’로 두어 과도한 신학적 확정을 피했습니다.
- source_word: αἰτοῦσά τι παρ’ αὐτοῦ
  english_pob_choice: asking something from him
  chosen_korean: 그에게 무엇인가를 청하였습니다
  alternatives_korean:
  - 그에게 무엇인가를 요청하였습니다
  - 그에게 한 가지를 구하였습니다
  lexicon: BDAG
  rationale: τι는 막연한 목적어이므로 ‘무엇인가’를 살렸고, παρά + 속격의 출처/대상 관계는 ‘그에게’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: προσκυνέω를 예수께 대한 태도로 어떻게 번역할지
  chosen_reading: 절하며
  alternative_readings:
  - 경배하며
  - 예배하며
  - 엎드려 절하며
  rationale: 본문은 청원 장면이며, προσκυνέω의 의미 범위를 열어 두는 것이 좋습니다. 본문에는 몸짓 중심의 ‘절하며’를 두고, 더 강한 예배 의미는 번역문에 고정하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 (Preserve theological tension rather than resolve it)'
