id: MAT.20.4
reference: Matthew 20:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
  footnotes:
  - marker: a
    text: Or “whatever is just” or “whatever is fair.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 말씀하셨습니다. 「너희도 포도밭으로 가라. 그러면 옳은 것은 무엇이든지 너희에게 주겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정당한 것은 무엇이든지” 또는 “공정한 것은 무엇이든지.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  english_pob_choice: to them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그 사람들에게
  - 저들에게
  lexicon: BDAG
  rationale: 지시대명사의 복수 여격을 자연스러운 한국어 여격 표현으로 옮겼으며, 문맥상 앞서 언급된 다른 품꾼들을 가리키므로 ‘그들에게’가 가장 간결합니다.
- source_word: Ὑπάγετε καὶ ὑμεῖς
  english_pob_choice: You also go
  chosen_korean: 너희도 가라
  alternatives_korean:
  - 너희도 가십시오
  - 너희도 가서
  lexicon: BDAG
  rationale: ‘και ὑμεις’의 포함적 강조를 ‘너희도’로 살렸고, 직접명령형은 예수의 직접화법에 맞게 간결한 명령문으로 처리했습니다.
- source_word: ἀμπελῶνα
  english_pob_choice: vineyard
  chosen_korean: 포도밭
  alternatives_korean:
  - 포도원
  - 포도나무밭
  lexicon: BDAG
  rationale: 비유의 배경상 ἀμπελῶνα는 표준적으로 ‘포도밭’으로 옮길 수 있으며, 현대 한국어에서 자연스럽고 의미도 분명합니다.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  english_pob_choice: whatever is right
  chosen_korean: 옳은 것은 무엇이든지
  alternatives_korean:
  - 정당한 것은 무엇이든지
  - 공정한 것은 무엇이든지
  lexicon: BDAG
  rationale: δίκαιον의 윤리적·판단적 뉘앙스를 살리면서도, 임금 계약 맥락에서 지나치게 법률적이거나 구어체적인 ‘공정한’보다 ‘옳은’이 원문에 더 가깝습니다.
- source_word: δώσω ὑμῖν
  english_pob_choice: I will give you
  chosen_korean: 너희에게 주겠습니다
  alternatives_korean:
  - 너희에게 지급하겠습니다
  - 너희에게 주실 것입니다
  lexicon: BDAG
  rationale: δώσω의 기본 의미는 ‘주다’이므로, 보수 지급의 맥락이 있어도 원문을 따라 ‘주겠습니다’로 옮겼습니다.
theological_decisions:
- issue: δίκαιον의 번역 범위
  chosen_reading: ‘옳은 것’으로 옮겨, 도덕적/판단적 적합성을 드러내면서도 ‘정당하다’라는 법률적 뉘앙스로 좁히지 않았습니다.
  alternative_readings:
  - 정당한 것
  - 공정한 것
  - 옳고 바른 것
  rationale: 본문은 품삯을 약속하는 장면이지만, 그리스어는 단순히 ‘right/just/fair’의 범위를 열어 둡니다. 한국어에서도 한 가지 해석으로 고정하지 않고 원문의 유동성을 보존하는 것이 좋습니다.
  doctrine_reference: Translation philosophy §§1, 5
