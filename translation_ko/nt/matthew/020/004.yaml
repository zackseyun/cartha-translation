review_pass:
  verdict: revise
  source_fidelity: ‘그러면’은 원문의 καί를 조건·결과 관계로 좁혀, 주인이 포도밭으로 가라는 명령의 결과로 보수를 약속하는 듯한 뉘앙스를 더합니다. 이를 삭제해야 원문의 단순한 접속과 발화의 병렬성이 보존됩니다. 또한 ὃ ἐὰν ᾖ δίκαιον은 ‘옳은 것은 무엇이든지’로 적절히 반영되어 있으며, δώσω의 기본 뜻도 ‘주겠습니다’로 잘 살렸습니다.
  naturalness: ‘너희도 포도밭으로 가라’는 서사적 성경 문체로는 가능하지만, 지정된 현대 합쇼체와는 맞지 않습니다. 직접화법을 ‘여러분도 포도밭으로 가십시오’로 통일하면 현대 표준어의 격식체로 자연스럽습니다.
  terminology: ‘포도밭’은 ἀμπελών의 자연스럽고 정확한 번역입니다. δίκαιον은 본문에서 ‘옳은 것’으로 두고, ‘정당한/공정한’의 가능한 뉘앙스는 각주로 제시하는 것이 적절합니다. 각주는 해당 표현 바로 뒤에 붙여 참조 범위를 분명히 했습니다.
