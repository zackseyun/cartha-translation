lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  english_pob_choice: So they went away
  chosen_korean: 그러자 그들은 떠났습니다
  alternatives_korean:
  - 그들은 떠났습니다
  - 그래서 그들은 가버렸습니다
  lexicon: BDAG
  rationale: δέ는 앞문맥을 잇는 완만한 연결이므로 한국어에서는 ‘그러자’로 자연스럽게 처리했고, ἀπῆλθον은 단순한 이동을 넘어 장면 전환을 보여 주어 ‘떠났습니다’가 무난합니다.
- source_word: ἐξελθὼν
  english_pob_choice: Going out
  chosen_korean: 다시 나가서
  alternatives_korean:
  - 나가서
  - 밖으로 나가 다시
  lexicon: BDAG
  rationale: 분사 ἐξελθὼν의 서술적 진행을 살리기 위해 부사 ‘다시’와 연결해 연속 동작으로 옮겼습니다.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  english_pob_choice: about the sixth and ninth hour
  chosen_korean: 여섯째 시간과 아홉째 시간쯤에
  alternatives_korean:
  - 정오와 오후 세 시쯤에
  - 대략 여섯째 시간과 아홉째 시간에
  lexicon: BDAG
  rationale: 유대식 시간 표현을 본문 형태에 가깝게 보존하되, περὶ를 반영해 ‘쯤에’로 불확실성을 드러냈습니다.
- source_word: ὡσαύτως
  english_pob_choice: likewise
  chosen_korean: 똑같이 했습니다
  alternatives_korean:
  - 그와 같이 했습니다
  - 마찬가지로 했습니다
  lexicon: BDAG
  rationale: ὡσαύτως의 비교 의미를 한국어에서 가장 분명하게 드러내기 위해 동사구와 결합한 ‘똑같이 했습니다’로 옮겼습니다.
