id: MAT.20.34
reference: Matthew 20:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
  footnotes:
  - marker: a
    text: Or 'they saw again.' The Greek verb can mean 'to regain sight' or more literally 'to look up,' but in this context it refers to the restoration of sight.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 불쌍히 여기시어 그들의 눈을 만지시니, 곧 그들이 보게 되었고 그를 따랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보게 되었습니다’는 이 문맥에서 ἀνέβλεψαν의 의미를 자연스럽게 옮긴 것으로, 문자적으로는 ‘다시 보게 되다/올려다보다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  english_pob_choice: moved with compassion
  chosen_korean: 불쌍히 여기시어
  alternatives_korean:
  - 측은히 여기시어
  - 긍휼히 여기시어
  lexicon: BDAG
  rationale: 이 분사는 깊은 내적 연민을 나타내므로, 현대 한국어에서 감정의 강도를 자연스럽게 살리는 ‘불쌍히 여기시어’를 선택했습니다.
- source_word: ἥψατο τῶν ὀμμάτων αὐτῶν
  english_pob_choice: touched their eyes
  chosen_korean: 그들의 눈을 만지시니
  alternatives_korean:
  - 그들의 눈에 손대시니
  - 그들의 눈을 접촉하시니
  lexicon: BDAG
  rationale: 치유 장면의 물리적 접촉을 간명하게 드러내는 동사로 ‘만지시다’를 썼고, 관용적으로 ‘눈을’의 직접 목적어 형태로 옮겼습니다.
- source_word: ἀνέβλεψαν
  english_pob_choice: received their sight
  chosen_korean: 그들이 보게 되었고
  alternatives_korean:
  - 시력을 회복했고
  - 다시 보게 되었고
  lexicon: BDAG
  rationale: 문맥상 실명 치유의 결과이므로 ‘보게 되다’로 자연스럽게 옮기되, 단순히 ‘올려다보다’로 읽히지 않게 했습니다.
- source_word: ἠκολούθησαν αὐτῷ
  english_pob_choice: followed him
  chosen_korean: 그를 따랐습니다
  alternatives_korean:
  - 그를 따라갔습니다
  - 그의 뒤를 따랐습니다
  lexicon: BDAG
  rationale: ἀκολουθέω의 기본 의미를 살리면서도, 제자도를 과도하게 설명하지 않는 가장 직접적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 치유의 즉시성
  chosen_reading: 예수의 동작과 동시에 시력이 즉시 회복된 것으로 읽습니다.
  alternative_readings:
  - 단순히 점차 보이기 시작했다는 읽기
  - 비유적으로 눈을 떴다는 읽기
  rationale: εὐθέως가 치유의 결과를 즉각적으로 규정하므로, 본문이 말하는 실제적이고 즉각적인 회복을 그대로 반영했습니다.
  doctrine_reference: Translation philosophy 1 and 3
- issue: ‘따랐다’의 제자도 함의
  chosen_reading: 본문의 진술은 실제로 예수를 뒤따랐음을 말하지만, 여기서 곧바로 완전한 제자직을 단정하지는 않습니다.
  alternative_readings:
  - 곧바로 제자가 되었다는 읽기
  rationale: ἀκολούθησαν αὐτῷ는 분명한 추종/동행을 뜻하지만, 본문 자체가 그 관계의 범위를 더 설명하지 않으므로 번역도 그 수준에 맞췄습니다.
  doctrine_reference: Translation philosophy 3
