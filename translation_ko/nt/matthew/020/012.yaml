source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
  footnotes:
  - marker: a
    text: Or 'you treated them as equal to us.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이렇게 말했습니다. ‘이 마지막 사람들은 한 시간만 일했는데도, 당신은 그들을 하루의 짐과 타는 듯한 더위를 견딘 우리와 같게 하셨습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신은 그들을 우리와 동등하게 대하셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  english_pob_choice: saying
  chosen_korean: 이르되
  alternatives_korean:
  - 말하며
  - 말하기를
  lexicon: BDAG
  rationale: 앞절의 서술과 이어지는 현재분사적 흐름을 한국어에서는 ‘이르되’로 간결하게 살려, 계속되는 발화를 자연스럽게 연결했습니다.
- source_word: μίαν ὥραν ἐποίησαν
  english_pob_choice: worked one hour
  chosen_korean: 한 시간만 일했는데도
  alternatives_korean:
  - 한 시간 일했는데도
  - 한 시간 동안 일했는데도
  lexicon: BDAG
  rationale: 시간 표현과 함께 쓰인 ποιέω는 실제 노동의 지속을 뜻하므로 ‘일했다’로 옮겼고, 비교·불만의 뉘앙스를 살려 ‘만’과 ‘-는데도’를 더했습니다.
- source_word: ἴσους ... ἐποίησας
  english_pob_choice: you made them equal to us
  chosen_korean: 그들을 같게 하셨습니다
  alternatives_korean:
  - 그들을 우리와 같게 하셨습니다
  - 그들을 우리와 동등하게 하셨습니다
  lexicon: BDAG
  rationale: ἴσος의 핵심은 ‘같다/동등하다’이므로 직설적으로 ‘같게 하셨습니다’로 옮겼고, 뒤의 ‘우리와’가 이미 비교 대상을 분명히 하므로 중복을 줄였습니다.
- source_word: τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα
  english_pob_choice: the burden of the day and the scorching heat
  chosen_korean: 하루의 무거운 짐과 타는 듯한 더위
  alternatives_korean:
  - 그날의 짐과 타는 듯한 더위
  - 하루의 부담과 뜨거운 더위
  lexicon: BDAG
  rationale: βάρος는 단순한 ‘무게’보다 노동의 고된 짐을 가리키므로 ‘무거운 짐’으로, καύσων은 압도적인 폭열이므로 ‘타는 듯한 더위’로 옮겼습니다.
theological_decisions:
- issue: 비교 대상과 불만의 어조를 어떻게 드러낼지
  chosen_reading: 이 절은 품삯의 공정성에 대한 일꾼들의 항의를 직접 전달하므로, 해석을 덧씌우지 않고 불평의 말투를 그대로 살렸습니다.
  alternative_readings:
  - 하나님의 공의에 대한 신학적 논평이 드러나게 다듬는 방식
  - 불평을 누그러뜨려 중립적으로 옮기는 방식
  rationale: 비유 안의 발화 자체가 핵심이므로, 독자가 등장인물의 불만을 즉시 느끼도록 하되 본문의 긴장을 해소하지 않았습니다.
  doctrine_reference: 'POB translation philosophy: preserve tension and speaker intent without over-interpretation.'
