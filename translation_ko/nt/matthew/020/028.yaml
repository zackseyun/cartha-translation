review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 현 초안은 비교 접속사 ὥσπερ(‘…와 같이’)를 본문에서 사실상 빠뜨렸습니다. 또한 부정과 대조를 나타내는 부정과거 부정사들은 ‘…하려는 것’보다 목적을 나타내는 ‘…하러 온 것’으로 옮기는 편이 더 직접적입니다. ψυχή는 ‘자기 목숨’, λύτρον은 ‘속전’으로 적절히 반영되었습니다.
  naturalness: ‘섬김을 받으려는 것이 아니라 섬기려는 것이며’는 뜻은 통하지만 의도·성향처럼 들릴 수 있습니다. ‘섬김을 받으러 온 것이 아니라 섬기고’가 현대 표준어 합쇼체 문맥에서 더 자연스럽고 원문의 목적·대조 구조를 잘 드러냅니다. 비교절을 독립적으로 제시하는 데에는 ‘…온 것과 같습니다’가 필요합니다.
  terminology: ‘인자’, ‘섬기다’, ‘목숨’, ‘속전’은 정착된 성서 용어이면서 현대 독해에도 무리가 없습니다. ἀντί의 대체 의미는 각주에서 보존하는 것이 적절합니다. 다만 ‘많은 사람 대신의 속전’은 한국어 결합이 다소 부자연스럽고, 속전 자체가 사람을 대신한다는 뜻으로 읽힐 수 있으므로 ‘많은 사람을 대신하여’로 명료하게 제시하는 편이 좋습니다.
  issues:
  - severity: high
    issue: ὥσπερ의 비교 기능이 본문에 반영되지 않음
    rationale: 원문은 앞선 가르침과 연결하여 ‘인자가 … 온 것과 같이’라는 비교를 이룹니다. ‘인자가 온 것은’만으로는 이 비교 연결이 소실됩니다.
  - severity: medium
    issue: ‘…하려는 것’이 목적 부정사의 의미를 약화함
    rationale: διακονηθῆναι, διακονῆσαι, δοῦναι는 오심의 목적을 나타냅니다. ‘…하러 온 것’이 원문의 구조와 한국어 용법에 더 정확합니다.
  - severity: low
    issue: 각주의 ‘많은 사람 대신의 속전’이 부자연스럽고 수식 관계가 불분명함
    rationale: ἀντί πολλῶν의 대체 의미는 ‘많은 사람을 대신하여’로 제시하면 자연스럽고, 이 전치사구가 ‘주다’의 행위와 관련됨을 더 잘 보여 줍니다.
