id: MAT.20.28
reference: Matthew 20:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'as a ransom in place of many.'
    reason: lexical_alternative
translation:
  language: ko
  text: 인자가 온 것은 섬김을 받으려는 것이 아니라 섬기려는 것이며, 많은 사람을 위한 속전으로 자기 목숨을 주려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 사람 대신의 속전’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  english_pob_choice: just as
  chosen_korean: -라는 것처럼
  alternatives_korean:
  - 마치
  - -와 같이
  lexicon: BDAG
  rationale: 앞선 말씀과의 비교·유비를 자연스럽게 살리기 위해 결과절 앞에 직접 대응하는 서술로 옮겼습니다.
- source_word: διακονηθῆναι / διακονῆσαι
  english_pob_choice: to be served / but to serve
  chosen_korean: 섬김을 받으려는 것 / 섬기려는 것
  alternatives_korean:
  - 시중을 받으려는 것 / 시중들려는 것
  - 봉사받으려는 것 / 봉사하려는 것
  lexicon: BDAG
  rationale: 동일 어근의 대조를 살리면서도 현대 한국어에서 자연스럽고, 위계적 뉘앙스를 지나치게 약화하지 않는 ‘섬기다’ 계열로 맞췄습니다.
- source_word: τὴν ψυχὴν αὐτοῦ
  english_pob_choice: his life
  chosen_korean: 자기 목숨
  alternatives_korean:
  - 자기 생명
  - 자기 혼
  lexicon: BDAG
  rationale: 문맥상 ψυχή는 죽음에 내어주는 생명을 가리키므로, 영혼보다 ‘목숨’이 더 직접적이고 본문 긴장을 잘 드러냅니다.
- source_word: λύτρον ἀντὶ πολλῶν
  english_pob_choice: a ransom for many
  chosen_korean: 많은 사람을 위한 속전
  alternatives_korean:
  - 많은 사람을 위한 대가
  - 많은 사람 대신의 속전
  lexicon: BDAG
  rationale: λύτρον은 해방을 위한 지불 대가이므로 ‘속전’이 핵심 의미를 압축해 살립니다. ἀντί의 대체·대가 뉘앙스는 주본문에서 너무 풀지 않고 보존했습니다.
theological_decisions:
- issue: ἀντί의 대체/대리 뉘앙스
  chosen_reading: 주본문은 ‘많은 사람을 위한 속전’으로 옮기되, ἀντί가 지닌 대체의 힘은 과도하게 평준화하지 않았습니다.
  alternative_readings:
  - 많은 사람 대신의 속전
  - 많은 사람을 위하여
  rationale: 본문은 예수의 죽음을 많은 사람을 위한 대속적 행위로 제시하므로, 한국어에서도 단순 목적어처럼만 읽히지 않도록 ‘속전’과 ‘위한’을 함께 유지했습니다.
  doctrine_reference: 대속의 대표성·대리성은 분명히 보존하되, 한 표현으로만 교리화를 고정하지 않습니다.
