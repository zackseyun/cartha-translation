  naturalness: ‘넘겨주어 조롱하고…하게 할’은 한국어에서 행위 주체가 불명확하고 다소 어색합니다. 목적절의 주어를 명시하면 현대 표준 한국어 합쇼체로 더 자연스럽고 정확합니다. ‘일으켜질 것입니다’는 다소 문어적이지만 수동형을 보존하는 표현으로 사용 가능합니다.
