id: MAT.20.19
reference: Matthew 20:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
  footnotes:
  - marker: a
    text: Or, 'he will rise.' The Greek verb is passive ('he will be raised'), a common resurrection expression that can imply God's action.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 이방인들이 그를 조롱하고 채찍질하고 십자가에 못 박도록 그를 이방인들에게 넘겨줄 것이며, 셋째 날에 그는 일으켜질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그는 일어날 것입니다.’ 그리스어 동사는 수동형(‘그는 일으켜질 것입니다’)으로, 부활을 가리키는 흔한 표현이며 하나님의 행위를 암시할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  english_pob_choice: will hand ... over
  chosen_korean: 넘겨주어
  alternatives_korean:
  - 내어주어
  - 전달하여
  lexicon: BDAG
  rationale: hostile 권력의 손에 넘기는 뜻을 살리면서, 현대 한국어에서 자연스럽고 간결한 동작 흐름을 유지합니다.
- source_word: τοῖς ἔθνεσιν
  english_pob_choice: to the Gentiles
  chosen_korean: 이방인들에게
  alternatives_korean:
  - 열방에게
  - 이교도들에게
  lexicon: BDAG
  rationale: 유대인-이방인 대조가 분명한 수난 예고 문맥이므로, 여기서는 민족 일반보다 비유대인 권력을 가리키는 ‘이방인들’이 가장 적확합니다.
- source_word: ἐμπαῖξαι / μαστιγῶσαι / σταυρῶσαι
  english_pob_choice: to mock and flog and crucify
  chosen_korean: 조롱하고 채찍질하고 십자가에 못 박게 할
  alternatives_korean:
  - 비웃고 매질하고 십자가형에 처하게 할
  - 모욕하고 태형하고 십자가에 못 박게 할
  lexicon: BDAG
  rationale: 연속된 부정과 고난의 행위를 세 개의 동사로 그대로 살리되, ‘십자가에 못 박다’는 한국어 성경에서 널리 통용되는 직접적 표현을 유지했습니다.
- source_word: ἐγερθήσεται
  english_pob_choice: he will be raised
  chosen_korean: 일으켜질 것입니다
  alternatives_korean:
  - 다시 살아날 것입니다
  - 살아나실 것입니다
  lexicon: BDAG
  rationale: 미래 수동태를 살려 ‘일으켜질’로 옮겨, 부활 진술의 수동형과 하나님의 행위를 암시하는 여지를 보존했습니다.
theological_decisions:
- issue: 부활 동사의 수동태 보존
  chosen_reading: ‘일으켜질 것입니다’로 옮겨 수동형을 유지합니다.
  alternative_readings:
  - ‘살아날 것입니다’로 능동적 의미를 자연화할 수 있습니다.
  rationale: 그리스어 미래 수동태 ἐγερθήσεται의 형식을 보존하여, 부활이 단순한 자력 회복이 아니라 하나님께서 행하시는 일이라는 뉘앙스를 남깁니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
