  to: 그리고 그들은 이방인들이 그를 조롱하고 채찍질하고 십자가에 못 박도록 그를 이방인들에게 넘겨줄 것이며, 셋째 날에 그는 일으켜질 것입니다.[a]
  rationale: 목적을 나타내는 그리스어 εἰς τὸ + 부정사 구문의 행위 주체가 문맥상 이방인들임을 한국어 문장에서 명시했습니다. 그 밖에는 원문의 연속된 세 행위, ‘이방인들’이라는 역사·문맥적 지시, 그리고 ἐγερθήσεται의 미래 수동형을 유지했습니다.
