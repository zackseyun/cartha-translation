revisions:
- from: 그런데 우리 가운데 일곱 형제가 있었습니다. 첫째가 결혼하였다가 죽었는데, 후손이 없었으므로 그의 아내를 자기 형제에게 남겼습니다.
  to: 그런데 우리 가운데 일곱 형제가 있었습니다. 첫째는 결혼한 뒤 죽었습니다. 그는 후손을 남기지 못하고 그의 아내를 그의 형제에게 남겼습니다.[a]
  rationale: 분사 γήμας의 시간적 선행성과 μὴ ἔχων σπέρμα의 비인과적 상태를 더 정확히 반영하도록 문장을 조정했습니다. ‘아내를 그의 형제에게 남겼습니다’라는 원문의 간결하고 관습을 전제한 표현은 유지하고, 관습적 배경만 각주로 설명했습니다.
