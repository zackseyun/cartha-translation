review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘그런데’는 δέ의 약한 연결 기능을 무리 없이 반영합니다. 그러나 γήμας의 선행 동작은 ‘결혼하였다가’보다 ‘결혼한 뒤’가 더 분명하며, μὴ ἔχων σπέρμα는 단순한 상태를 나타내므로 ‘후손이 없었으므로’라는 강한 인과 표현은 피하는 편이 좋습니다. ‘그의 아내를 그의 형제에게 남겼습니다’는 ἀφῆκεν … τῷ ἀδελφῷ αὐτοῦ를 직역적이면서도 문맥에 맞게 보존합니다.
  naturalness: ‘첫째’는 일곱 형제 가운데 순서를 자연스럽게 나타냅니다. 다만 ‘결혼하였다가 죽었는데’는 한국어에서 다소 구어적·느슨하게 들리고, ‘자기 형제’는 소유·지시 범위가 순간적으로 모호할 수 있습니다. ‘그의 형제’로 명시하고 문장을 나누면 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: σπέρμα는 이 문맥에서 생물학적 씨 자체가 아니라 후손을 뜻하므로 ‘후손’이 적절합니다. 레위라트 관습은 본문에 ‘결혼시키다/결혼하다’로 확대하지 않고, 필요한 경우 각주로만 설명하는 것이 원문의 함축성을 보존합니다.
  issues:
  - severity: medium
    issue: ‘후손이 없었으므로’가 μὴ ἔχων의 분사 구문을 명시적 인과로 강화합니다.
    rationale: 그리스어는 ‘후손이 없는 채/후손을 남기지 못하고’라는 동반 상태를 표현합니다. 문맥상 인과는 이해되지만, 본문에서는 강한 인과 접속을 피하는 것이 더 충실합니다.
  - severity: low
    issue: ‘결혼하였다가’는 γήμας가 나타내는 선행 순서를 충분히 명료하게 드러내지 못합니다.
    rationale: ‘결혼한 뒤’는 결혼이 죽음보다 앞섰음을 자연스럽고 정확하게 전달합니다.
  - severity: low
    issue: ‘자기 형제’의 지시 대상이 문맥상 분명하나 표현상 잠시 모호할 수 있습니다.
    rationale: 원문의 αὐτοῦ는 첫째 형제를 가리키므로 ‘그의 형제’가 더 명료합니다.
  revised_text: 그런데 우리 가운데 일곱 형제가 있었습니다. 첫째는 결혼한 뒤 죽었습니다. 그는 후손을 남기지 못하고 그의 아내를 그의 형제에게 남겼습니다.[a]
