- from: 그때에 임금이 시중드는 자들에게 말하였습니다, 「그의 발과 손을 묶어 바깥 어두운 데로 내쫓아라. 거기서 슬피 울며 이를 갈 것이다.」
  to: 그때에 임금이 시중드는 사람들에게 말하였습니다. “그의 발과 손을 묶어서 바깥 어둠 속으로 내쫓으십시오. 거기에는 울음과 이를 갊이 있을 것입니다.”
