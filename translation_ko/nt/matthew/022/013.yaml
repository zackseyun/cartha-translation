review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the king, the attendants, binding the man’s feet and hands in the Greek order, expulsion, and the Matthean image of outer darkness. However, ‘슬피’ adds an intensity not explicit in κλαυθμός, and the verbal clause ‘울며 이를 갈 것이다’ shifts the Greek nominal future construction (‘there will be weeping and gnashing of teeth’) into an assertion about an implied individual.
  naturalness: ‘시중드는 사람들’ and ‘바깥 어둠 속으로’ are natural contemporary Korean. Rendering the final clause as ‘울음과 이를 갊이 있을 것입니다’ is idiomatic while preserving the source structure and the requested formal-polite register.
  terminology: ‘임금’ appropriately renders βασιλεύς in this parable, and ‘시중드는 사람들’ suitably renders διάκονοι without ecclesial connotations. ‘바깥 어둠’ preserves the established Matthean expression without doctrinal interpretation.
  issues:
  - severity: medium
    issue: The expression ‘슬피 울며’ is interpretively stronger than the Greek.
    rationale: κλαυθμός denotes weeping/wailing, but the adverb ‘슬피’ is not stated and should not be added in an optimal-equivalence rendering.
  - severity: medium
    issue: The final clause does not retain the Greek’s impersonal nominal construction.
    rationale: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων is more faithfully represented by ‘there will be weeping and gnashing of teeth,’ rather than a finite verb phrase with an implied subject.
  - severity: low
    issue: The direct command is not in the specified modern formal-polite register.
    rationale: ‘내쫓아라’ is a plain imperative. ‘내쫓으십시오’ consistently reflects the requested 합쇼체 target style.
  revised_text: 그때에 임금이 시중드는 사람들에게 말하였습니다. “그의 발과 손을 묶어서 바깥 어둠 속으로 내쫓으십시오. 거기에는 울음과 이를 갊이 있을 것입니다.”
