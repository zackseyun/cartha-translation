  source_fidelity: ἀμελήσαντες는 초대에 대해 무관심하거나 개의치 않는 태도를 뜻합니다. 초대라는 목적어는 문맥상 암시되지만 헬라어 본문에는 명시되지 않았으므로, 이를 본문에 직접 보충하지 않는 표현이 적절합니다. ὃς μὲν ... ὃς δὲ의 분배 구문, ἴδιον의 ‘자기’, 그리고 ἐμπορία의 사업·상업 활동의 뜻을 보존했습니다.
  naturalness: 초안의 ‘무관심하여’는 상태 서술로 다소 압축되어 있고 ‘떠나갔으니’는 현대 합쇼체 문장에서는 다소 문어적입니다. ‘개의치 않고 떠나갔습니다’와 두 개의 짧은 문장으로 고치면 자연스럽고 분명합니다.
  terminology: ‘밭’은 ἀγρός의 직접적인 대응이며, ‘자기 사업을 하러’는 ἐπὶ τὴν ἐμπορίαν αὐτοῦ가 가리키는 상업 활동을 자연스러운 한국어로 옮깁니다. 특정 신학적 해석은 덧붙이지 않았습니다.
