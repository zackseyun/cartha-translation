  source_fidelity: 그리스어의 대조적 전환(δὲ), 시간적 분사(ἀκούσαντες), 예수께서 사두개인들을 논쟁에서 침묵시키셨다는 뜻(ἐφίμωσεν), 그리고 바리새인들이 함께 모였다는 내용(συνήχθησαν ἐπὶ τὸ αὐτό)을 충실히 반영합니다. 한국어에서 생략될 수 있는 주어를 ‘예수께서’로 밝혀 문맥도 분명합니다.
