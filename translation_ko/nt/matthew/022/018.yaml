  source_fidelity: 그리스어 γνοὺς … τὴν πονηρίαν αὐτῶν은 예수께서 그들의 악의적 동기/악의를 아셨음을 나타내며, 초안의 ‘그들의 악한 의도’를 무리 없이 반영합니다. πειράζετε는 여기서 예수를 함정에 빠뜨리려는 ‘시험하다’라는 뜻으로 적절합니다. 다만 원문의 호격 ὑποκριταί는 질문 뒤에 두어 원문의 강조와 어순에 더 가깝게 옮길 수 있습니다.
  naturalness: 합쇼체 서술과 ‘말씀하셨습니다’는 현대 표준 한국어 성경 문체에 자연스럽습니다. 인용문 앞의 쉼표는 마침표로 고치고, 한국어 인용 부호를 사용해야 문장부호가 자연스럽고 완결됩니다.
  terminology: ‘위선자들’은 ὑποκριταί의 확립된 번역이며, ‘악한 의도’는 πονηρία의 문맥상 악의/악한 동기를 잘 전달합니다. 특정 교리적 해석을 덧붙이지 않습니다.
