  source_fidelity: 원문의 ἐπιδείξατέ는 단순히 가져오라는 뜻보다 ‘보여/제시하라’는 뜻이므로, 명령문은 이를 유지해야 합니다. τοῦ κήνσου는 로마의 특정 세금을 가리키며, 본문에서는 과도하게 특정하지 않고 ‘세금으로 낼’로 자연스럽게 옮기되 각주로 가능한 의미를 밝혀야 합니다. προσήνεγκαν αὐτῷ δηνάριον은 ‘그들이 그에게 데나리온 한 닢을 가져왔다’로 충실히 번역됩니다.
  naturalness: ‘세금에 쓰이는 동전’은 해당 세금의 납부용 동전이라는 문맥보다 일반적으로 세금에 사용되는 동전처럼 들릴 수 있습니다. ‘세금으로 낼 동전’이 현대 표준 한국어에서 더 직접적이고 자연스럽습니다. ‘보이십시오’는 합쇼체 명령으로 적절합니다.
