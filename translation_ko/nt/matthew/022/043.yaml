  source_fidelity: The draft conveys the main elements, but its comma after the reporting clause and the unfinished quotation syntax do not naturally represent the Greek question and its citation introducer. Rendering ἐν πνεύματι as “성령 안에서” follows the likely contextual referent while retaining the Greek prepositional form.
  naturalness: “어찌하여 … 부르며 이르기를” is stiff and leaves the Korean sentence structurally incomplete. Recasting it as a direct Korean question with “이렇게 말합니까?” is natural modern formal-polite Korean and still introduces the quotation that continues in the next verse.
  terminology: “주” appropriately preserves κύριος as a title in the Psalm argument. “성령” is suitable for πνεύματι in this context; a note records the possible alternative “영으로.”
  issues:
  - severity: medium
    issue: The punctuation and quotation syntax are malformed/unnatural in Korean.
    rationale: The reporting clause should introduce Jesus’ question with a colon, and λέγων introduces the following Scripture quotation. The Korean wording needs to remain grammatically complete while leading into the next verse.
  - severity: low
    issue: The phrase “영 안에서” is overly literal and less idiomatic in this context.
    rationale: “성령 안에서” is a natural Korean formal rendering of the likely referent, while the footnote preserves the possible agency-oriented alternative.
  revised_text: '그분이 그들에게 말씀하셨습니다: 「그러면 다윗이 성령 안에서 어떻게 그를 ‘주’라고 부르며 이렇게 말합니까?'
  revised_footnotes:
  - marker: a
    text: 또는 “성령으로.” 그리스어 표현은 영역 또는 수단을 나타낼 수 있습니다. “성령 안에서”는 원문의 표현을 더 가깝게 따릅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “주인.” 그리스어 κύριος는 일반적으로 “주”로 옮깁니다.
    reason: alternative_reading
  revision_rationale: The revision makes the verse a complete, idiomatic Korean question, accurately retains its function as an introduction to the quotation in the following verse, and uses standard title terminology. Footnotes preserve the material lexical alternatives for ἐν πνεύματι and κύριος.
