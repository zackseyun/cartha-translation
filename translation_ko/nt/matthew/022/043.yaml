  terminology: ‘영 안에서’ retains the compact ambiguity of ἐν πνεύματι; a note supplies the viable agency rendering. ‘주’ preserves κύριος as the scriptural title and is appropriately marked with a note for the alternative ‘주인.’
  issues:
