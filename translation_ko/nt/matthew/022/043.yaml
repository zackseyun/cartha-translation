  source_fidelity: The draft conveys the main syntax and key terms, but its punctuation is not natural Korean and its final archaic connective (이르기를) does not adequately render the participial introduction λέγων in modern formal Korean. The verse intentionally introduces a quotation that continues in the next verse, so the continuation must be signaled clearly.
