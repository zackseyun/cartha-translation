    issue: Comma before the direct quotation and unclosed/uncued continuation
    rationale: ‘말씀하셨습니다, 「’ is not standard Korean punctuation. Since the quotation continues into Matthew 22:44, a colon after the introductory question provides a clear and structurally appropriate continuation.
  - severity: medium
    issue: ‘이르기를’ is archaic and syntactically awkward in this modern formal-polite translation
    rationale: It is neither natural modern 합쇼체 nor a clear rendering of λέγων. ‘말하며 이렇게 말합니까:’ preserves the participial relation and prepares for the ensuing citation.
  - severity: low
    issue: Audit-trail footnote alternatives are absent
    rationale: Notes at ‘영 안에서’ and ‘주’ preserve the stated lexical alternatives without burdening the main text.
