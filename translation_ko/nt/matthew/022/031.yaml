  naturalness: The proposed revision uses natural modern formal Korean while retaining the rhetorical and quotation-introducing form appropriate to the passage.
  terminology: '''죽은 자들의 부활'' is an appropriate standard rendering of ἀνάστασις τῶν νεκρῶν. ''하나님'' is consistent with the draft''s established divine name. The wording avoids adding an interpretive emphasis absent from the source.'
  issues:
