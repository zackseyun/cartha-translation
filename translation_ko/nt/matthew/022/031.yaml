    issue: The word '친히' adds emphasis not represented by the Greek.
    rationale: ὑπὸ τοῦ θεοῦ marks God as the agent of the speech, but does not include an adverb equivalent to 'personally.'
  - severity: medium
    issue: '''읽어 보지 못하였느냐'' may suggest that the hearers were unable to read.'
    rationale: οὐκ ἀνέγνωτε is a rhetorical challenge concerning whether they have read Scripture, not an assertion of inability.
