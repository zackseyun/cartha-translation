- from: 그러나 죽은 자들의 부활에 관하여서는, 너희에게 하나님께서 친히 말씀하신 것을 너희가 읽어 보지 못하였느냐, 이르시기를,
  to: 죽은 자들의 부활에 관하여는[a], 하나님께서 너희에게 말씀하신 바를 너희가 읽지 않았느냐? 하나님께서 이렇게 말씀하셨다.
