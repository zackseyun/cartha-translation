  text: 그들이 「카이사르의 것입니다.」 하고 그에게 대답하니, 그때 그가 그들에게 말씀하셨습니다, 「그러면 카이사르의 것은 카이사르에게, 하나님의 것은 하나님께 바치십시오.」
