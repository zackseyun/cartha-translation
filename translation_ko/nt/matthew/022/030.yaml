  source_fidelity: 원문의 ἐν τῇ ἀναστάσει를 ‘부활 때에는’으로 자연스럽게 옮겼고, γαμοῦσιν/γαμίζονται의 짝을 ‘장가들지도, 시집가지도’로 한국어 관용에 맞게 구별했습니다. ‘하늘에 있는 하나님의 천사들과 같습니다’는 ὡς(비교), θεοῦ, ἐν τῷ οὐρανῷ를 모두 반영하며, 사람이 천사가 된다는 동일시를 피합니다.
  naturalness: 표준어 현대 합쇼체로 매끄럽습니다. ‘장가들다/시집가다’는 이 문맥에서 서로 짝을 이루는 관용적 표현이며, 문장 종결과 연결도 자연스럽습니다.
  terminology: ‘부활’, ‘하나님’, ‘천사’는 한국어 성경 문맥에서 통용되는 적절한 용어입니다. ‘도리어’는 앞의 부정과 뒤의 비교를 대조하는 ἀλλά를 자연스럽게 드러냅니다.
