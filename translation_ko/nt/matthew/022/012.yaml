review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the wedding garment and the guest's inability to respond. However, ‘어찌하여’ ordinarily asks ‘why,’ whereas πῶς asks ‘how/in what way.’ The final clause is acceptable in sense, but ‘말문이 막혔습니다’ more directly conveys the passive resultant sense of ἐφιμώθη.
  naturalness: The draft mixes present narrative style (‘말합니다’), archaic plain interrogative style (‘들어왔는가?’), and formal-polite past (‘못하였습니다’). A consistent modern formal-polite narrative is needed.
  terminology: ‘친구여’ appropriately preserves the formally addressed, somewhat distancing Ἑταῖρε without importing hostility. ‘혼인 예복’ is a clear and suitably literal rendering of ἔνδυμα γάμου.
  issues:
  - severity: medium
    issue: ‘어찌하여’ renders πῶς as a question of reason.
    rationale: πῶς asks how the man entered, not why he did so. ‘어떻게’ preserves the Greek adverb's manner/means question.
  - severity: medium
    issue: Inconsistent register and tense in the Korean narration and direct speech.
    rationale: Modern formal-polite 합쇼체 requires consistent polite endings; ‘말합니다’ and ‘들어왔는가?’ do not match the surrounding formal-polite past narration.
  revised_text: 그가 그에게 말하였습니다. “친구여, 혼인 예복을 입지 않고 어떻게 여기 들어왔습니까?” 그러나 그는 말문이 막혔습니다.
