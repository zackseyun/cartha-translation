  source_fidelity: The draft improperly replaces the first Greek κύριος with “야훼.” Although Psalm 110:1’s Hebrew source distinguishes the divine name from ‘my lord,’ the supplied Greek source uses κύριος for both instances; that formal correspondence should be retained in the Korean text. The command and the ‘under your feet’ image are otherwise represented accurately.
  naturalness: “앉아 있어라” is a plain/informal imperative and does not meet the required modern formal-polite 합쇼체 register. “앉아 계십시오” is natural and appropriately formal in this elevated quotation.
  terminology: Render both occurrences of κύριος as “주” / “나의 주,” in line with the Greek source and the English POB audit trail. The Hebrew-background distinction may be stated carefully as an alternative in a footnote, but must not be imposed on the main text.
  issues:
