    issue: The first κύριος is translated as “야훼.”
    rationale: “야훼” reflects the Hebrew Vorlage of Psalm 110:1, not the wording of the cited SBLGNT text, which has κύριος in both positions. This changes the source-level lexical parallelism and conflicts with the English audit trail’s deliberate rendering of both terms as “Lord.”
  - severity: medium
    issue: The imperative “앉아 있어라” does not use the required 합쇼체 register.
    rationale: The requested target register is modern formal-polite Korean. “앉아 계십시오” supplies an idiomatic formal imperative.
  - severity: medium
    issue: The footnote states that the main text preserves the Hebrew distinction and presents that distinction as the translation’s basis.
    rationale: That statement is inaccurate after review of the Greek source. A note may mention the Hebrew idiom only as an alternative rendering/background, without overriding the Greek wording.
