review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the conditional-inferential argument and David's address of the referent as ‘Lord.’ However, υἱὸς αὐτοῦ is ‘his son,’ not the broader ‘his descendant’; the latter weakens the deliberately stated filial relationship. The draft also has an unmatched closing quotation mark.
  naturalness: ‘그분을 ‘주’라고 부른다면, 그분이 어떻게 다윗의 아들입니까?’ is natural modern standard Korean in formal-polite register. ‘그러므로’ appropriately conveys οὖν while the conditional is retained by ‘-다면.’
  terminology: ‘다윗,’ ‘주,’ and ‘그분’ are appropriate. ‘아들’ is required here rather than ‘자손.’ The contextual identification with the Messiah is best retained in a footnote, not inserted into the main text.
  issues:
  - severity: medium
    issue: ‘다윗의 자손’ renders υἱὸς αὐτοῦ too broadly.
    rationale: The Greek explicitly says ‘his son.’ Although Davidic sonship can imply descent in context, ‘자손’ removes the text's chosen familial expression and softens the rhetorical tension.
  - severity: medium
    issue: The main text ends with an unmatched closing quotation mark.
    rationale: This is a punctuation/structural defect and must be removed.
  - severity: low
    issue: The contextual clarification footnote present in the English audit trail is absent.
    rationale: A footnote can identify the pronoun's antecedent from the context without expanding the Greek main text.
  revised_text: 그러므로 다윗이 그분을[a] ‘주’라고 부른다면, 그분이 어떻게 다윗의 아들입니까?
