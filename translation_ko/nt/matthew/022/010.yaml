review_pass:
  verdict: revise
  source_fidelity: 초안은 사람들을 ‘악한 자와 선한 자’ 모두 모았다는 핵심을 대체로 반영합니다. 그러나 καὶ를 인과적인 ‘그래서’로 옮기고, εὗρον을 ‘만나는’으로 옮긴 것은 원문의 단순한 서술 연결 및 ‘찾아낸’ 의미를 약화합니다. 또한 ἀνακειμένων의 식사 시 기대어 앉는 모습을 명시할 필요가 있습니다.
  naturalness: ‘혼인 잔치 자리’는 다소 어색하고 의미가 중복됩니다. ‘혼인 잔치에는 … 가득 찼습니다’가 현대 표준 한국어에서 자연스러우면서도 γάμος가 잔치 또는 그 잔칫자리 장면을 가리키는 문맥상 유연성을 유지합니다.
  terminology: δοῦλοι는 비유의 왕에게 예속된 신분을 드러내므로 ‘종들’보다 ‘노예들’이 더 직접적입니다. πονηρούς τε καὶ ἀγαθούς는 ‘악한 사람들과 선한 사람들’로, ἀνακειμένων은 고대 연회 자세를 반영하여 ‘식탁에 기대어 앉은 사람들’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘그래서’
    rationale: καὶ는 여기서 원칙적으로 단순 접속이며, 앞절과의 인과관계를 명시하지 않습니다.
  - severity: medium
    issue: ‘만나는 자’
    rationale: εὗρον은 ‘찾아낸/발견한’이라는 완료된 발견 행위를 가리키며, ‘만나는’은 우연한 조우라는 뉘앙스로 바뀝니다.
  - severity: medium
    issue: ἀνακειμένων의 연회 자세가 생략됨
    rationale: 원문은 단순히 손님이 있다는 말이 아니라 식사 자리에서 기대어 앉아 있는 이들을 명시합니다.
  - severity: low
    issue: ‘혼인 잔치 자리’의 어색함
    rationale: γὰμος의 문맥상 의미를 전달하려는 의도는 적절하나, 해당 표현은 자연스럽지 않습니다.
  revised_text: 그 노예들은 길로 나가서 찾아낸 모든 사람, 곧 악한 사람들과 선한 사람들을 다 모아 왔습니다. 그래서 혼인 잔치에는 식탁에 기대어 앉은 사람들이 가득 찼습니다.
  revised_footnotes:
  - marker: a
    text: ‘식탁에 기대어 앉은’은 당시 정식 식사에서 흔하던 기대어 먹는 자세를 가리킵니다.
    reason: cultural_note
  revision_rationale: 단순 서술 접속을 유지하고 ‘찾아낸 모든 사람’으로 포괄성과 발견의 의미를 보존했습니다. ‘노예들’은 δοῦλοι의 사회적 신분을 흐리지 않으며, 연회 장면의 기대어 앉는 자세는 본문과 주석으로 명시했습니다. ‘혼인 잔치에는’은 γάμος가 문맥에서 잔치 및 그 잔칫자리 장면을 가리키는 범위를 과도하게 한정하지 않습니다.
