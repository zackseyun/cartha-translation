  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
  footnotes:
  - marker: a
    text: Or 'to the crossroads' or 'to the road exits'; the Greek refers to places where roads branch out or meet.
    reason: lexical_alternative
  - marker: b
    text: Greek 'to the weddings,' an idiom meaning the wedding celebration or banquet.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 길들이 갈라지거나 만나는 곳[a]으로 가서, 너희가 만나는 사람은 누구든지 혼인 잔치[b]에 초대하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘길목들로’ 또는 ‘길의 출구들로’. 그리스어는 길이 갈라지거나 서로 만나는 지점을 가리킵니다.
    reason: διέξοδοι τῶν ὁδῶν의 공간적 의미에는 ‘교차로’와 ‘길의 출구/갈림길’이라는 해석 가능성이 함께 있으므로, 본문은 자연스러운 포괄 표현을 쓰고 각주로 대안을 제시합니다.
  - marker: b
    text: 그리스어는 직역하면 ‘혼인들’이며, 여기서는 혼인 축하의 잔치나 연회를 뜻합니다.
    reason: 복수형 γάμοι는 여러 혼인을 뜻하기보다 혼인 축하 행사, 특히 잔치의 관용적 표현입니다.
