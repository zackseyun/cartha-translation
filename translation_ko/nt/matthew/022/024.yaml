base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
  footnotes:
  - marker: a
    text: Or, more formally, “his brother shall perform the duty of a husband's brother to the widow.” The Greek refers specifically to levirate marriage.
    reason: lexical_alternative
translation:
  language: ko
  text: 「선생님, 모세는 ‘만일 어떤 사람이 자녀 없이 죽으면, 그 사람의 형제가 죽은 사람의 아내를 아내로 맞아[a] 죽은 형제를 위해 후손을 세워야 한다’고 말하였습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면, “그의 형제가 그 아내와 결혼의 의무를 이행해야 한다.” 이는 죽은 형제의 아내와 결혼하여 죽은 형제의 대를 잇게 하는 계대결혼의 관습을 가리킵니다.
    reason: lexical_alternative
