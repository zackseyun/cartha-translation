  source_fidelity: οἱ δὲ λοιποὶ의 δέ는 앞절에서 초청을 무시하고 떠난 이들과 대조되는 흐름이므로 ‘그리고’보다 ‘그러나’가 적절합니다. κρατήσαντες는 ‘붙잡아’로 자연스럽게 반영되었고, ἀπέκτειναν도 ‘죽였습니다’로 충실합니다. 다만 ὕβρισαν은 단순한 말의 모욕보다 수치스럽고 가혹한 학대를 포함하므로 ‘학대하고’가 더 정확합니다.
  naturalness: ‘그러나 나머지 사람들은’은 현대 표준어 합쇼체에서 자연스럽고, 비유의 문맥상 ‘그의 종들’을 유지하는 것이 간결합니다.
  terminology: δοῦλοι는 비유 속 왕의 소유된 사자들을 가리킵니다. 본문에서는 한국어 성경의 자연스러운 용례인 ‘종들’을 사용하되, 사회적 신분 의미를 보존하도록 ‘노예들’이라는 대안을 각주에 제시합니다.
