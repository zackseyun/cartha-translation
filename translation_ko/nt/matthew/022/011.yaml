  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
  footnotes:
  - marker: a
    text: Or 'a man not wearing a wedding garment.'
    reason: lexical_alternative
  - marker: b
    text: The Greek says 'those reclining,' reflecting the customary posture of guests at a formal banquet.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 임금이 식탁에 기대어 있는 손님들을[a] 보려고 들어와 보니, 거기에 혼인 예복을 입지 않은 한 남자가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘기대어 있는 이들’이라고 하며, 이는 정식 연회에서 손님들이 식탁에 기대어 누워 식사하던 관습을 반영합니다.
    reason: cultural_note
