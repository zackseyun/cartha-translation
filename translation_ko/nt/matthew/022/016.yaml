review_pass:
  verdict: revise
  source_fidelity: 원문의 현재형 ἀποστέλλουσιν은 한국어 복음서 서술에서는 자연스러운 과거형으로 옮길 수 있습니다. 그러나 초안의 ‘보내어 말하게 하였습니다’는 λέγοντες를 사역 구문으로 바꾸어, 그들이 제자들에게 말하도록 시켰다는 뜻을 부각합니다. 원문은 파송된 무리가 말하는 장면을 단순히 연결하므로 이를 직접적으로 표현하는 편이 더 충실합니다. 또한 οὐ μέλει σοι περὶ οὐδενός는 문맥상 누구의 영향력이나 평판에도 좌우되지 않는다는 뜻인데, ‘누구에게도 매이지 않으심’은 종속·속박의 뉘앙스를 다소 강하게 더합니다.
  naturalness: ‘진리 안에서 가르치시며’는 직역적이지만 현대 한국어에서는 ‘진리대로 가르치시며’가 자연스럽습니다. ‘누구의 눈치도 보지 않으시며’는 해당 관용구의 문맥상 의미를 현대 합쇼체로 자연하게 전달합니다. ‘사람을 외모로 보지 않으시기 때문입니다’는 원문의 γάρ와 ‘얼굴을 보다’ 관용구의 뜻을 명료하게 살립니다.
  terminology: ‘헤롯 당원들’, ‘선생님’, ‘하나님의 길’은 문맥과 한국어 성경 용례에 적절합니다. ἀληθής는 여기서 예수의 진실성과 신뢰성을 가리키므로 ‘진실하시고’가 자연스럽습니다.
