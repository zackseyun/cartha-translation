  - severity: medium
    issue: ‘누구에게도 매이지 않으심’의 의미 과잉
    rationale: οὐ μέλει σοι περὶ οὐδενός는 일반적으로 누구의 의견·지위에도 좌우되지 않음을 뜻합니다. ‘매이다’는 속박 또는 의존을 더 강하게 암시할 수 있습니다.
  - severity: low
    issue: ‘진리 안에서’의 비자연스러운 직역
    rationale: ἐν ἀληθείᾳ의 뜻을 보존하면서도 현대 한국어로는 ‘진리대로’가 더 자연스럽습니다.
