review_pass:
  verdict: revise
  source_fidelity: The three present imperatives, the future forms, and the two explicit datives are represented. However, repeating ‘그러면’ translates καί with a stronger inferential ‘then/if so’ connection than the Greek’s simple coordination. ‘발견할 것입니다’ is possible but less idiomatic here than the conventional resultative Korean expression ‘찾게 될 것입니다.’
  naturalness: The revised wording retains the compact, parallel cadence of the source and uses modern formal-polite Korean. ‘찾게 될 것입니다’ is natural with the object left unstated, as in the Greek.
  terminology: ‘구하십시오,’ ‘찾으십시오,’ and ‘두드리십시오’ are suitable formal imperative renderings. The passive promises ‘주어질 것입니다’ and ‘열릴 것입니다’ preserve the Greek passives without supplying God as agent.
  issues:
  - severity: medium
    issue: ‘그러면’ is inserted in each clause.
    rationale: Greek καί means ‘and’; while a consequential relationship is readily inferred, ‘그러면’ explicitly adds a ‘then/if so’ nuance. Simple sentence juxtaposition preserves the source’s coordination and rhetorical parallelism more closely.
  - severity: low
    issue: ‘발견할 것입니다’ is less natural in this objectless parallel construction.
    rationale: The source leaves the object unstated. ‘찾게 될 것입니다’ naturally conveys the promised finding in Korean without requiring an expressed object.
  revised_text: 구하십시오. 여러분에게 주어질 것입니다. 찾으십시오. 찾게 될 것입니다. 두드리십시오. 여러분에게 열릴 것입니다.
  revised_footnotes:
  - marker: a
    text: 그리스어 현재 명령법은 계속적인 의미로도 이해될 수 있습니다. 곧 ‘계속 구하십시오 … 계속 찾으십시오 … 계속 두드리십시오’라는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: The repeated inferential connector was removed to avoid strengthening the force of καί beyond simple coordination. ‘발견할 것입니다’ was revised to ‘찾게 될 것입니다’ for idiomatic Korean while retaining the unstated object and future result. A footnote preserves the documented possible ongoing nuance of the present imperatives without imposing it on the main text.
