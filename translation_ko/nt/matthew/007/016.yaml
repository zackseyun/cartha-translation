  source_fidelity: 첫 문장은 ἀπὸ τῶν καρπῶν αὐτῶν과 ἐπιγνώσεσθε αὐτούς를 충실히 옮겼습니다. 그러나 ‘거두지는 못하지 않습니까?’는 συλλέγω의 행위 자체보다 불가능함을 부각하므로, 부정 답변을 기대하는 μήτι 의문문을 직접적으로 살리는 표현으로 고치는 것이 더 정확합니다.
  naturalness: ‘사람들이 … 거두겠습니까?’는 현대 표준 한국어의 자연스러운 수사 의문문이며, 문맥상 ‘아니요’라는 답을 분명히 기대하게 합니다. 합쇼체 문장과도 잘 맞습니다.
  terminology: ‘열매’, ‘포도’, ‘무화과’, ‘가시나무’, ‘엉겅퀴’는 본문의 농경 비유와 전통적 신학 용례를 무리 없이 보존합니다. ‘알아볼 것입니다’도 관찰을 통한 식별이라는 ἐπιγινώσκω의 뜻에 적절합니다.
  issues:
