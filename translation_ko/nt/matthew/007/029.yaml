  - severity: low
    issue: ‘그들의 율법학자들’
    rationale: 의미상 가능하지만, γραμματεῖς의 복음서 내 정형적 집단 명칭에는 ‘서기관들’이 더 직접적이며, 소유 표현도 더 자연스럽게 연결됩니다.
