  rationale: ‘권위를 지니신 분으로서’로 ὡς ἐξουσίαν ἔχων의 권위 보유를 명확히 하되 권위의 신학적 근거는 해석적으로 보충하지 않았습니다. 두 절의 가르침을 한국어에서 반복하여 대조 구조를 분명히 했고, αὐτῶν은 ‘그들의’로 보존했습니다.
