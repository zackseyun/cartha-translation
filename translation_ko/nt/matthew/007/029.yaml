  naturalness: 초안의 ‘권위 있는 분처럼’은 한국어에서 권위가 있는 다른 사람을 닮았다는 뜻으로도 들릴 수 있습니다. ‘권위를 지니신 분으로서’가 자연스럽고 원문의 의미를 더 정확히 드러냅니다. 또한 ‘그들의 율법학자들’보다 복음서 문맥에서 통용되는 ‘그들의 서기관들’이 간결하고 자연스럽습니다.
