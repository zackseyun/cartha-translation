revisions:
- from: 좁은 문으로 들어가십시오. 멸망으로 이끄는 문은 넓고 그 길은 평탄하여, 그 문으로 들어가는 사람들이 많기 때문입니다.
  to: 좁은 문으로 들어가십시오. 문은 넓고 멸망으로 이끄는 길은 널찍하여, 그 문으로 들어가는 사람이 많기 때문입니다.
  rationale: 원문의 명령형과 이유를 나타내는 ὅτι를 ‘들어가십시오’와 ‘때문입니다’로 보존했습니다. πλατεῖα와 εὐρύχωρος의 공간적 대조를 각각 ‘넓고’와 ‘널찍하여’로 옮겼으며, 길을 수식하는 ἀπάγουσα의 관계를 ‘멸망으로 이끄는 길’로 분명히 했습니다. ‘그 문으로’는 원문 여성 단수 대명사의 자연스러운 지시 대상을 명료하게 나타내되 의미를 더하지 않습니다.
