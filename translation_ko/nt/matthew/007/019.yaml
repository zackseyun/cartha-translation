  source_fidelity: 원문의 분배적 표현 πᾶν δένδρον을 ‘나무마다’로, 현재분사 μὴ ποιοῦν을 ‘맺지 않는’으로 자연스럽고 충실하게 옮겼습니다. ἐκκόπτεται와 εἰς πῦρ βάλλεται의 현재 수동도 ‘찍혀 ... 던져집니다’로 보존되었습니다.
