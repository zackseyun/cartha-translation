  terminology: ‘좋은 열매’는 καρπὸν καλὸν의 문맥상 평가적 의미를 적절히 유지합니다. ‘불’은 정죄/심판의 비유적 이미지이되 그 범위나 시기를 특정하지 않아 원문의 신학적 비결정성을 보존합니다.
