  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
  footnotes:
  - marker: a
    text: 'Or, more traditionally, ''your Father in heaven.'' The Greek is plural: ''in the heavens.'''
    reason: lexical_alternative
  - marker: b
    text: Some translations read 'give good gifts' in the second clause, but the Greek says simply 'give good things.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 여러분이 악하면서도 자기 자녀들에게 좋은 선물을 줄 줄 안다면, 하늘에[a] 계신 여러분의 아버지께서는 그분께 구하는 사람들에게 좋은 것들을 얼마나 더 주시겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 복수형으로, 직역하면 “하늘들에 계신”입니다.
    reason: lexical_alternative
