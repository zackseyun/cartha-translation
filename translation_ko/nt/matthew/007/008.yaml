  terminology: ‘구하다/받다’, ‘찾다/찾아내다’, ‘두드리다/열리다’는 본문의 단순하고 병렬적인 어휘를 적절히 살립니다. 마지막 표현은 ‘문’ 같은 명사를 보태지 않아 그리스어의 미명시성을 보존합니다.
