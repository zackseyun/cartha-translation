  source_fidelity: 그리스어 οὕτως의 비교·귀결 기능은 ‘이와 같이’로, πᾶν δένδρον ἀγαθόν의 분배적 의미는 ‘좋은 나무마다’로 정확히 옮겼습니다. ‘좋은 열매를 맺고’는 καρποὺς καλοὺς ποιεῖ의 비유적·관용적 한국어 표현이며, ‘썩은 나무’와 ‘나쁜 열매’는 각각 σαπρόν 및 πονηρούς의 대조와 농업 비유를 보존합니다.
