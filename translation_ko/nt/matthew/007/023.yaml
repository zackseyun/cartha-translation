lexical_decisions:
- source_word: ἀνομίαν
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 무법
  - 율법을 벗어남
  lexicon: BDAG
  rationale: ἀνομία는 「토라 없음」의 함의를 가진다. 한국 성서 정형 「불법」을 채택한다.
theological_decisions:
- issue: 심판의 선언 — 예수의 자기 권위적 발화
  chosen_reading: 『나는 너희를 도무지 알지 못한다. …내게서 떠나가라.』
  alternative_readings:
  - 『나는 너희를 알지 못한다. …떠나가십시오.』
  rationale: 심판자로서의 예수의 권위적 직접 발화는 합쇼체로 옮기지 않는다. 평어 명령형 「떠나가라」가 심판의 결정성·단호함을 본문 그대로 살린다. 본 번역의 합쇼체 원칙의 의도적 예외(심판 선언).
  doctrine_reference: 'Korean register policy: judgment declarations preserve decisive force'
revisions:
- from: 그때에 내가 그들에게 분명히 말하겠습니다. 『나는 너희를 도무지 알지 못한다. 불법을 행하는 자들아, 내게서 떠나가라.』
  to: 그때 내가 그들에게 선언하겠습니다. 『나는 너희를 결코 알지 못하였다. 불법을 행하는 자들아, 내게서 떠나가라.』
  rationale: The revision restores the explicit ‘never’ sense of Οὐδέποτε ἔγνων and renders ὁμολογήσω with a formal declarative verb suitable to the setting. It retains the established term 「불법」, the participial characterization 「행하는 자들」, and the decisive direct command, without resolving the relational meaning of ‘know’ into a theological interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal sequence, dismissal command, and the characterization of the addressees as those who do lawlessness. However, 「나는 너희를 도무지 알지 못한다」 is present-tense and does not adequately represent the emphatic temporal absoluteness of Οὐδέποτε ἔγνων (‘I never knew you’). 「분명히 말하겠습니다」 conveys clarity but is less precise than ὁμολογήσω, which here denotes a solemn, open declaration.
  naturalness: The wording is generally natural in modern Korean, and the direct judgment command 「떠나가라」 is appropriate for the quoted authoritative pronouncement. 「그때」 is slightly more current and concise than 「그때에」. 「선언하겠습니다」 better fits the formal public force of the verb while retaining modern formal-polite narration.
  terminology: 「불법을 행하는 자들」 is an established and suitable rendering of οἱ ἐργαζόμενοι τὴν ἀνομίαν. It preserves the moral-legal force of ἀνομία without narrowing it to a particular doctrinal interpretation. No footnotes are required; the relational force of ‘know’ is best left unexpanded in the main text.
  issues:
  - severity: medium
    issue: Οὐδέποτε ἔγνων is rendered as a present-tense denial.
    rationale: 「도무지 알지 못한다」 can mean ‘I do not know [you] at all’ now, whereas the Greek explicitly says ‘I never knew you.’ 「결코 알지 못하였다」 preserves both the past reference and the absolute negation without doctrinal expansion.
  - severity: low
    issue: ὁμολογήσω is rendered too generically as 「분명히 말하겠습니다」.
    rationale: Although understandable, it foregrounds clarity rather than the verb’s solemn/open declarative force in this judicial context. 「선언하겠습니다」 is more exact and natural.
  revised_text: 그때 내가 그들에게 선언하겠습니다. 『나는 너희를 결코 알지 못하였다. 불법을 행하는 자들아, 내게서 떠나가라.』
  revised_footnotes: []
  revision_rationale: The revision restores the explicit ‘never’ sense of Οὐδέποτε ἔγνων and renders ὁμολογήσω with a formal declarative verb suitable to the setting. It retains the established term 「불법」, the participial characterization 「행하는 자들」, and the decisive direct command, without resolving the relational meaning of ‘know’ into a theological interpretation.
