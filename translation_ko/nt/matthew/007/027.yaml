  verdict: revise
  source_fidelity: The draft conveys the storm sequence and the climactic destruction well. However, the connective in “들이치니” subordinates the striking of the house to a resulting clause more strongly than the source’s repeated coordinate καί clauses. Rendering the action as an independent sentence more closely preserves the sequence. “강물” naturally conveys the contextual force of ποταμοί, while a note preserves the literal ‘rivers’/contextual ‘floodwaters’ range.
  naturalness: The revision uses natural contemporary standard Korean in formal-polite style. “그 집을 들이쳤습니다” is idiomatic for wind striking a house, and “그 무너짐은 컸습니다” retains the terse, emphatic closing without awkward inversion.
  terminology: No specialized theological terminology occurs. “무너졌습니다 / 무너짐” appropriately reflects the related Greek ideas of falling and fall without expanding the image into an interpretive statement of judgment.
  issues:
  - severity: low
    issue: The clause “바람이 불어 그 집에 들이치니” uses a subordinating connective.
    rationale: The Greek coordinates the rain, rivers, winds striking the house, its fall, and the greatness of that fall. Independent coordination in Korean better retains the source’s deliberate narrative cadence.
  - severity: low
    issue: No note preserves the lexical range of ποταμοί.
    rationale: The Korean contextual rendering “강물이 밀려오고” is natural, but the English audit trail specifically records the literal sense ‘rivers’ and contextual possibility ‘floodwaters.’ A concise note makes that choice transparent.
  revised_text: 비가 내리고, 강물이[a] 밀려오고, 바람이 불어 그 집을 들이쳤습니다. 그 집은 무너졌고, 그 무너짐은 컸습니다.
