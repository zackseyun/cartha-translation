    reason: lexical_alternative
  - marker: c
    text: Or 'tear you apart.'
    reason: lexical_alternative
  - marker: d
    text: Or 'and, turning, tear you to pieces'.
    reason: previous_rendering
translation:
  language: ko
  text: 거룩한 것을 개들에게 주지 마십시오. 또 여러분의 진주를 돼지들 앞에 던지지 마십시오. 그러지 않으면 돼지들이 그것들을 발로 짓밟고, 돌아서서 여러분을 찢어 버릴지도 모릅니다.
  philosophy: optimal-equivalence
