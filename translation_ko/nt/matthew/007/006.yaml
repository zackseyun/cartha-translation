review_pass:
  verdict: revise
  source_fidelity: 개와 돼지, 거룩한 것과 진주의 비유적 이미지는 잘 보존했습니다. 그러나 μήποτε가 나타내는 경고의 결과를 초안의 “...때문입니다”가 인과적 설명처럼 처리하며, ‘진주’를 밟는 대상도 대명사로 다소 불명확합니다. ῥήξωσιν은 단순히 ‘물어뜯다’보다 ‘찢다/찢어 버리다’가 더 직접적입니다.
  naturalness: 합쇼체는 일관되고 전반적으로 자연스럽습니다. 다만 마지막 문장은 “그러지 않으면”으로 경고를 명시하고, ‘돼지들이’를 반복하여 주어를 분명히 하면 더 매끄럽고 정확합니다.
  terminology: ‘거룩한 것’, ‘개들’, ‘진주’, ‘돼지들’은 원문의 폭넓고 불편한 비유를 완화하거나 해석적으로 한정하지 않고 적절히 옮겼습니다.
  issues:
  - severity: medium
    issue: μήποτε의 경고/부정 목적 관계가 “...때문입니다”로 인과적 설명처럼 표현됨
    rationale: 원문은 ‘그렇게 하지 않도록/그러지 않으면’이라는 경고의 결과를 제시합니다. 한국어에서는 “그러지 않으면 ...지도 모릅니다”가 이를 자연스럽게 보존합니다.
  - severity: low
    issue: ‘그것들이 발로 밟고’에서 주어와 목적어의 지시가 다소 불명확함
    rationale: 원문에서 돼지들이 진주들을 짓밟습니다. ‘돼지들이 그것들을 발로 짓밟고’라고 하면 두 지시 대상이 분명해집니다.
  - severity: medium
    issue: ῥήξωσιν을 ‘물어뜯다’로 옮김
    rationale: ῥήγνυμι는 찢거나 갈가리 찢는 강한 폭력의 이미지입니다. ‘찢어 버리다’가 원문의 강도를 더 충실히 반영합니다.
