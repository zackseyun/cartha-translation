  to: 그날에 많은 사람이 나에게 말할 것입니다. ‘주여, 주여, 우리가 주님의 이름으로 예언하지 않았습니까? 주님의 이름으로 귀신을 쫓아내지 않았습니까? 주님의 이름으로 많은 기적을 행하지 않았습니까?[a]’
