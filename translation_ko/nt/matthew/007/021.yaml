revisions:
- from: 나에게 『주여, 주여』 하는 사람마다 다 하늘 나라에 들어가는 것이 아닙니다. 다만 하늘에 계신 내 아버지의 뜻을 행하는 사람만 들어갈 것입니다.
  to: 나에게 ‘주여, 주여’라고 말하는 사람이 모두 하늘나라에 들어가는 것은 아닙니다. 그러나 하늘에 계신 내 아버지의 뜻을 행하는 사람은 들어갈 것입니다.
  rationale: The revision clarifies the source's partial negation, uses a direct Korean adversative for ἀλλά, and regularizes ‘하늘나라.’ It retains the explicit second-clause future verb, which naturally conveys the sense supplied by the Greek contrast, without adding theological conclusions.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the partial negation ('not everyone'), the repeated vocative, entry into the kingdom, and the contrast with doing the Father's will. A small recasting more directly reflects the Greek adversative ἀλλά and makes the Korean partial-negation scope unambiguous.
  naturalness: ‘사람마다 다 … 것이 아닙니다’ is understandable but somewhat heavy. ‘… 사람이 모두 … 것은 아닙니다’ is smoother modern formal Korean. ‘하늘나라’ is the conventional closed compound in contemporary Korean Bible prose.
  terminology: ‘주여, 주여’ appropriately preserves the emphatic repeated vocative in a scriptural register. ‘하늘나라,’ ‘내 아버지,’ and ‘뜻을 행하다’ are faithful, established Korean renderings. No doctrinal interpretation is added.
  issues:
  - severity: low
    issue: Partial-negation phrasing is slightly cumbersome.
    rationale: ‘나에게 … 하는 사람마다 다 … 것이 아닙니다’ can be read less smoothly than a construction that explicitly places ‘모두’ with the subject group. The source has οὐ πᾶς, requiring ‘not everyone,’ rather than a total negation.
  - severity: low
    issue: The adversative may be represented more directly.
    rationale: ‘다만’ is possible, but ‘그러나’ more plainly corresponds to ἀλλά while retaining the contrast between saying and doing.
  - severity: low
    issue: Compound spacing.
    rationale: ‘하늘나라’ is the conventional spelling for the theological expression in modern Korean Bible translation.
  revised_text: 나에게 ‘주여, 주여’라고 말하는 사람이 모두 하늘나라에 들어가는 것은 아닙니다. 그러나 하늘에 계신 내 아버지의 뜻을 행하는 사람은 들어갈 것입니다.
