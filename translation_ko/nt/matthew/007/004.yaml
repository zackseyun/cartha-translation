review_pass:
  verdict: revise
  source_fidelity: 그리스어의 수사 의문문, 허락을 청하는 명령형(Ἄφες), 그리고 주의를 환기하는 καὶ ἰδού를 더 직접적으로 반영할 필요가 있습니다. 초안의 ‘여러분/자기/너의’는 단수인 그리스어 2인칭과 호응하지 않습니다.
  naturalness: ‘당신이 … 말하겠습니까?’와 ‘제가 … 빼도록 허락해 주십시오’는 현대 표준어 합쇼체에서 자연스럽고, 인용문 안팎의 화자 관계도 분명합니다.
  terminology: ‘티’는 κάρφος의 자연스러운 기본 번역이며, ‘들보’는 δοκός의 큰 목재라는 대조를 보존합니다. ἀδελφός는 원문의 남성 단수에 따라 ‘형제’로 옮깁니다.
  issues:
  - severity: medium
    issue: 인칭과 재귀 표현의 불일치
    rationale: 원문은 ‘당신의 형제/당신의 눈’이라는 단수 2인칭인데, 초안은 ‘여러분’, ‘자기’, ‘너의’를 혼용합니다.
  - severity: medium
    issue: Ἄφες의 허락 요청 기능이 불분명함
    rationale: ‘빼게 해 다오’도 가능하지만, 현대 합쇼체에서는 ‘빼도록 허락해 주십시오’가 ‘내가 빼게 해 달라’는 요청을 더 명확히 나타냅니다.
  - severity: low
    issue: ἰδού의 주의 환기 표지가 약화됨
    rationale: ‘정작’은 대조를 전달하지만, ‘보십시오’가 원문의 직접적인 환기 기능을 더 충실히 살립니다.
  revised_text: 또는 당신이 어떻게 당신의 형제에게 ‘제가 당신의 눈에서 티를 빼도록 허락해 주십시오’라고 말하겠습니까? 그런데 보십시오, 당신의 눈에는 들보가 있습니다.
  revised_footnotes:
  - marker: a
    text: ‘티’로 옮긴 그리스어 카르포스(κάρφος)는 마른 물질의 작은 조각을 가리키며, ‘가시’ 또는 ‘작은 조각’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘들보’로 옮긴 그리스어 도코스(δοκός)는 큰 목재를 가리키며, ‘널빤지’ 또는 ‘통나무’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 ‘당신의 형제’라는 남성 단수 표현입니다. 여기서는 대표적으로 동료 제자를 가리킬 수 있습니다.
    reason: cultural_note
  revision_rationale: 단수 2인칭을 일관되게 유지하고, 허락을 구하는 표현과 ‘보십시오’라는 환기 표지를 명시하여 원문의 문법과 수사적 흐름을 보존했습니다. ‘티/들보’의 의도적인 크기 대조도 유지했습니다.
