  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
  footnotes:
  - marker: a
    text: Or 'splinter' for 'speck' (Greek κάρφος), a small bit of dry material.
    reason: lexical_alternative
  - marker: b
    text: Or 'plank' or 'log' for 'beam' (Greek δοκός), a large piece of timber.
    reason: lexical_alternative
  - marker: c
    text: Greek 'your brother'; the masculine singular may refer to a fellow disciple in a representative sense.
    reason: cultural_note
translation:
  language: ko
  text: 또는 어떻게 자신의 형제[a]에게 ‘제가 당신의 눈에서 티를 빼게 해 주십시오’라고 말하겠습니까? 보십시오[c], 자신의 눈에는 들보[b]가 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제’에 해당하는 그리스어 ἀδελφός는 남성 단수이다. 문맥에서는 대표적으로 동료 제자를 가리킬 수도 있다.
    reason: cultural_note
  - marker: b
    text: ‘들보’(그리스어 δοκός)는 큰 목재를 가리킨다. ‘널빤지’ 또는 ‘통나무’로도 옮길 수 있다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어 ἰδού는 주의를 환기하는 표현으로, ‘보라’ 또는 ‘보십시오’라는 뜻이다.
    reason: discourse_marker
