  source_fidelity: 원문의 반복 구조(κρίματι/κρίνετε/κριθήσεσθε 및 μέτρῳ/μετρεῖτε/μετρηθήσεται)와 수동태의 행위자 미표시는 대체로 보존되어야 합니다. 초안의 ‘여러분에게도’는 원문에 명시되지 않은 ‘되돌림’의 뉘앙스를 다소 강화하므로 본문에서는 생략하는 편이 더 안전합니다.
  naturalness: ‘심판하는 그 심판’, ‘헤아리는 그 헤아림’은 현대 표준 한국어에서 지나치게 직역투입니다. ‘내리는 심판’과 ‘재는 잣대/재어지다’로 옮기면 현대 합쇼체의 자연스러움과 원문의 병행 표현을 함께 살릴 수 있습니다.
  terminology: κρίμα는 ‘심판’, κρίνω는 ‘심판하다/심판을 받다’로 통일했습니다. μέτρον은 비유적 기준을 가리키므로 ‘잣대’가 자연스럽고, μετρεῖν의 어휘 연결은 ‘재는/재어지다’로 보존했습니다. 수동태의 주체는 특정하지 않았습니다.
  issues:
  - severity: medium
    issue: 현대 한국어에서 부자연스러운 중복 명사구
    rationale: ‘심판하는 그 심판’과 ‘헤아리는 그 헤아림’은 원문의 동족어 반복을 기계적으로 옮긴 형태입니다. 의미를 유지하면서 자연스러운 동사-명사 결합으로 다듬을 필요가 있습니다.
  - severity: low
    issue: ‘여러분에게도’의 첨가
    rationale: ὑμῖν은 ‘여러분에게’이지만, ‘도’는 상응·반환의 의미를 추가로 강조합니다. 그 상응성은 문맥상 암시되나 원문에 ‘back’처럼 명시되지는 않았으므로 본문에서는 생략합니다.
