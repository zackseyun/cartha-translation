review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 Πάντα의 포괄적 범위(‘모든 일에서’)를 명시하지 않으며, οἱ προφῆται는 ‘예언서’보다 문맥상 정형 표현을 보존하는 ‘예언자들’이 더 직접적입니다.
  naturalness: ‘사람들에게 받기를 원하는 것’도 이해되지만, 원문의 ‘사람들이 여러분에게 해 주기를’이라는 ἵνα 절을 드러내면 더 자연스럽고 정확합니다. ‘해 주십시오’는 현대 표준어 합쇼체로 적절합니다.
  terminology: ὁ νόμος καὶ οἱ προφῆται는 마태복음의 정형적 성경 요약 표현이므로 ‘율법과 예언자들’로 옮겼습니다. ἄνθρωποι는 포괄적인 ‘사람들’로 번역했습니다.
  issues:
  - severity: medium
    issue: Πάντα의 범위가 명시되지 않음
    rationale: 원문은 ‘그러므로 모든 일에서/모든 경우에’라는 포괄적 부사적 범위를 제시합니다. ‘무엇이든지’만으로도 일부 포괄성은 전달되나, Πάντα와 ὅσα의 결합이 충분히 드러나지 않습니다.
  - severity: medium
    issue: οἱ προφῆται를 ‘예언서’로 번역함
    rationale: 그리스어는 ‘예언자들’이며, ‘율법과 예언자들’은 유대 경전과 그 윤리적 증언을 가리키는 정형 표현입니다. ‘예언서’는 의미상 인접하지만 원문의 인칭 복수 명사를 범주명으로 바꿉니다.
  revised_text: 그러므로 모든 일에서, 사람들이 여러분에게 해 주기를 여러분이 원하는 것은 무엇이든지, 여러분도 그들에게 똑같이 해 주십시오. 이것이 율법과 예언자들입니다.
