theological_decisions:
- issue: 황금률(7:12) — 율법과 예언서의 요약
  chosen_reading: 무엇이든지…똑같이 행하십시오. 이것이 율법이요 예언서이기 때문입니다
  alternative_readings:
  - 남에게 대접받고자 하는 대로 너희도 남을 대접하라
  rationale: 마태가 명시적으로 「이것이 율법과 예언자」라고 봉합한다(5:17의 「내가 율법이나 예언서를 폐하러…」와 인클루지오). 한국어에서도 「율법이요 예언서」 정형을 유지해 산상수훈의 구조적 연결을 살린다.
  doctrine_reference: 'Preserve Matthew''s inclusio: 5:17 ↔ 7:12'
revisions:
- from: 그러므로 무엇이든지 여러분이 사람들에게 받기를 원하는 것을, 여러분도 그들에게 똑같이 행하십시오. 이것이 율법이요 예언서이기 때문입니다.
  to: 그러므로 모든 일에서, 사람들이 여러분에게 해 주기를 여러분이 원하는 것은 무엇이든지, 여러분도 그들에게 똑같이 해 주십시오. 이것이 율법과 예언자들입니다.
  rationale: ‘모든 일에서’로 Πάντα의 보편적 범위를 보존하고, ‘사람들이 여러분에게 해 주기를’으로 θέλητε ἵνα ποιῶσιν ὑμῖν의 원하는 행위를 명료하게 반영했습니다. ‘율법과 예언자들’은 원문의 확립된 마태적 표현을 직역적으로 유지하며, 특정 교리적 해석을 덧붙이지 않습니다.
