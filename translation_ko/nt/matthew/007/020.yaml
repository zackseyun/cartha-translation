  source_fidelity: 그리스어의 추론적 접속 표현 ἄρα γε, ‘그들의 열매로’(ἀπὸ τῶν καρπῶν αὐτῶν), 미래형 ‘알아볼 것입니다’(ἐπιγνώσεσθε), 그리고 목적어 ‘그들을’(αὐτούς)을 모두 충실히 반영합니다. ‘그러므로’는 ἄρα γε의 결론적 용법을 자연스럽게 옮기며, 별도의 강조 부사는 한국어 본문에서 필수적이지 않습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘여러분은’은 원문의 2인칭 복수를 명료하게 드러내고, ‘열매로 그들을 알아볼 것입니다’는 비유를 보존하면서도 문맥상 식별·분별의 뜻을 적절히 전달합니다.
  terminology: ‘열매’는 원문의 복수 καρποί 및 앞뒤 문맥의 은유를 그대로 살린 적절한 표현입니다. ‘알아보다’는 여기서 사람의 실체나 정체를 식별한다는 ἐπιγινώσκω의 문맥적 의미에 잘 맞으며, 특정 교리적 해석을 덧붙이지 않습니다.
