  source_fidelity: 그리스어의 두 대칭 절, 즉 좋은 나무의 나쁜 열매 생산 불가능성과 썩은 나무의 좋은 열매 생산 불가능성을 충실히 옮겼습니다. δύναται의 범주적 불가능은 “맺을 수 없다”로 적절히 보존되었고, ποιεῖν과 καρπούς의 결합도 한국어 관용인 “열매를 맺다”로 자연스럽게 표현되었습니다.
