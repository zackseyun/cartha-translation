  source_fidelity: 원문의 복수형 ‘이 말씀들’(τοὺς λόγους τούτους)과 이를 가리키는 복수 목적어(αὐτούς)를 한국어에서도 드러내고, 비교 대상인 ἀνδρί의 남성 명사를 보존하는 편이 더 충실합니다. 미래의 비교(ὁμοιωθήσεται)도 ‘같게 될 것입니다’로 자연스럽게 옮길 수 있습니다.
