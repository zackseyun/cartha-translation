  terminology: λόγοι는 여기서 예수의 가르침을 가리키므로 ‘말씀들’이 적절합니다. μωρός는 ‘어리석은’, οἰκία는 비유의 건물 이미지에 맞게 ‘집’, ἄμμος는 ‘모래’로 유지했습니다.
