  source_fidelity: The draft correctly renders ἰχθὺν as “생선,” ὄφιν as “뱀,” and preserves the negative-answer-expected rhetorical question. However, the Greek construction presents a conditional example (“if [he] asks for a fish”), for which Korean -는데 is less precise and can imply a contrasting or background relation rather than the intended condition.
  naturalness: “생선을 달라고 하는데” is understandable, but “생선을 달라고 하면” is the natural modern Korean conditional form. Stating “아들이” clarifies the implicit requester in the immediate literary context and prevents the Korean wording from momentarily suggesting that the one asking is also the one giving the snake.
  terminology: “생선” and “뱀” are natural, accurate standard Korean equivalents. No theological terminology is involved.
  issues:
  - severity: medium
    issue: Conditional relation is rendered with -는데.
    rationale: αἰτήσει in this paired rhetorical example is best represented in Korean by a conditional clause, “달라고 하면,” rather than the potentially contrastive/background connective “달라고 하는데.”
  - severity: low
    issue: The requester is left unclear in Korean.
    rationale: Adding “아들이” reflects the immediately preceding father-son analogy and makes the roles of requester and giver clear without adding doctrinal interpretation.
  revised_text: 또는 아들이 생선을 달라고 하면, 그에게 뱀을 주겠습니까?
