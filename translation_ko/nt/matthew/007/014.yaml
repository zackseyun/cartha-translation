revisions:
- from: 그러나 생명으로 이끄는 문은 좁고 그 길은 협착하여, 그것을 찾는 사람이 적습니다.
  to: 이는 생명으로 이끄는 문은 좁고 그 길은 험난하며, 그것을 찾는 사람은 적기 때문입니다.
