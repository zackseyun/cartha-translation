  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:38Z'
review_pass:
  verdict: revise
  source_fidelity: The opening ὅτι is causal (“for/because”), not adversative; therefore “그러나” reverses the logical connection. The draft otherwise retains the gate/way distinction, life, and the small number who find the way.
  naturalness: “그 길은 협착하여” is not idiomatic modern standard Korean in this context; “협착” is chiefly technical/medical in current usage. “험난하며” naturally conveys the δρόμος as τεθλιμμένη—pressed/constricted and thus difficult—without reducing it merely to physical narrowness.
  terminology: “생명,” “문,” and “길” are appropriate. No theological terminology requires adjustment.
  issues:
  - severity: high
    issue: “그러나” translates the causal conjunction ὅτι as an adversative.
    rationale: The Greek explains the preceding exhortation (“for/because”), whereas “그러나” means “however” and creates an unsupported contrast.
  - severity: medium
    issue: “협착하여” is unnatural in modern Korean for a way/path.
    rationale: Although it reflects older Korean Bible diction and the constricted sense of τεθλιμμένη, modern readers commonly associate it with a medical narrowing. “험난하며” communicates the contextual sense of a difficult, pressured way and accords with the English audit’s “hard.”
  revised_text: 이는 생명으로 이끄는 문은 좁고 그 길은 험난하며, 그것을 찾는 사람은 적기 때문입니다.
