  source_fidelity: The draft accurately conveys the rebuke, the priority marked by πρῶτον, the large-versus-small contrast of δοκός and κάρφος, and the future result of διαβλέψεις. Replacing reflexive 자기 with explicit 당신 better represents the Greek second-person possessives and prevents Korean ambiguity.
  naturalness: The repetition in “그러면 그때에” is awkward in modern Korean, and “똑똑히” is somewhat colloquial for this formal register. “그 후에” and “분명히” are natural in modern formal-polite Korean.
  terminology: “위선자,” “들보,” “티,” and “형제” are appropriate. Footnote anchors are supplied for the two materially broad lexical images, with anchors attached to the corresponding Korean terms.
  issues:
