  terminology: '"예수님," "따르십시오," and "장사 지내다" are suitable. The repeated "죽은 자들" should remain unqualified in the text so that the source''s wordplay is not doctrinally resolved. A footnote may cautiously note the common metaphorical understanding of the first occurrence.'
