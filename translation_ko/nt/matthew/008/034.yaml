review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the principal actions, but '그러자' introduces a sequential/causal nuance not expressed by καὶ ἰδού, and '온 동네 사람들' is less direct than the collective expression '온 동네' for πᾶσα ἡ πόλις. The territorial sense of τῶν ὁρίων should be retained, with its literal 'boundaries/borders' sense noted.
  naturalness: The sentence is natural in modern formal-polite Korean. Recasting the opening as '보십시오, 온 동네가' is more idiomatic while retaining the discourse-marking force of ἰδού.
  terminology: '''예수님'' is appropriate standard Korean Christian usage. ''간청했습니다'' suitably renders the earnest force of παρεκάλεσαν. ''지역'' is acceptable for ὅρια in context, provided a lexical note preserves the alternative territorial/boundary sense.'
  issues:
  - severity: low
    issue: '''그러자'' is added at the opening.'
    rationale: The Greek begins καὶ ἰδού ('and behold/look'), an attention marker; it does not explicitly mark a consequential transition. Omitting '그러자' avoids adding this relation.
  - severity: low
    issue: '''온 동네 사람들이'' renders πᾶσα ἡ πόλις.'
    rationale: Although understandable, '온 동네가' more directly preserves the Greek's corporate idiom ('the whole town/city') without making an unnecessary explicit shift to individual people.
  - severity: low
    issue: No note accompanies '지역' for ὅρια.
    rationale: The source term can mean region, territory, or more literally boundaries/borders. A note preserves this lexical range without affecting the natural main text.
  revised_text: 보십시오, 온 동네가 예수님을 만나려고 나왔고, 그분을 보고 자기들의 지역에서 떠나 달라고 간청했습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘자기들의 영토에서’; 더 직역하면 ‘자기들의 경계에서’.
    reason: ὅρια는 문맥상 ‘지역’을 가리키지만, ‘영토’ 또는 문자적으로 ‘경계/경계선’이라는 뜻도 가능합니다.
  revision_rationale: Opening attention marker ἰδού is rendered without adding a consequential transition. The corporate expression πᾶσα ἡ πόλις is represented by ‘온 동네가,’ while the remaining wording retains the temporal sequence, earnest request, and unstated motive of the Greek. A footnote records the lexical range of ὅρια.
