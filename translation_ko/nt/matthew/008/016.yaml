translation:
  language: ko
  text: 저녁이 되자 사람들이 귀신 들린 사람들을 많이 예수님께 데려왔습니다. 예수님께서는 말씀 한마디로 그 영들을 쫓아내시고, 병든 사람들을 모두 고쳐 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαιμονιζομένους
  english_pob_choice: demon-possessed
  chosen_korean: 귀신들린
  alternatives_korean:
  - 귀신 들린 자들
  lexicon: BDAG
  rationale: 귀신(δαιμόνια) 어휘 통일에 따라 「귀신들린」으로 옮긴다.
- source_word: πνεύματα
  english_pob_choice: spirits
  chosen_korean: 영들
  alternatives_korean:
  - 그 귀신들
  lexicon: BDAG
  rationale: 문맥상 앞 절의 δαιμόνια를 가리키지만, 본문 어휘는 πνεύματα이므로 「영들」을 유지한다.
