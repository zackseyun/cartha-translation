base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
  footnotes:
  - marker: a
    text: Or 'many afflicted by demons.' The Greek participle refers to people under demonic influence; 'demon-possessed' is the conventional concise rendering.
