  verdict: revise
  source_fidelity: The draft correctly identifies the swineherds, their flight, their entry into the city, and their report. However, ‘동네’ weakens πόλις (‘city’), and ‘귀신들렸던 자들’ unnecessarily places the participial description in the past. The Greek phrase τὰ τῶν δαιμονιζομένων is broad (‘the matters concerning the demon-possessed people’); the revised wording retains this scope and supplies a literal alternative in a note.
  naturalness: ‘돼지 치던 자들’ is understandable but colloquial and less suitable for a modern formal-polite Bible register. ‘돼지를 치던 사람들이’ is natural and appropriately formal. The revised syntax avoids the repeated and awkward ‘일과 … 일’ construction while retaining the inclusive sense.
  terminology: ‘귀신 들린 사람들’ is established, natural Korean biblical terminology for δαιμονιζόμενοι and does not add doctrinal distinctions beyond the text. ‘그 도시’ accurately represents εἰς τὴν πόλιν.
  issues:
  - severity: medium
    issue: ‘동네’ for πόλις
    rationale: πόλις denotes a city/town in this narrative setting; ‘동네’ is more colloquial and can suggest a small neighborhood or village. ‘그 도시’ is closer and more formal.
  - severity: low
    issue: Past tense in ‘귀신들렸던 자들’
    rationale: The present participle δαιμονιζομένων describes the people as demon-possessed at the time of reference; a past-relative form is not required.
  - severity: low
    issue: Register and phrasing
    rationale: ‘돼지 치던 자들’ is colloquial, and the coordination ‘모든 일과 … 일’ is stylistically repetitive. A concise inclusive construction is more natural while reflecting the source.
  revised_text: 돼지를 치던 사람들이 달아나 그 도시로 들어가, 모든 일, 곧 귀신 들린 사람들에게 관한 일을 알렸습니다.[a]
  revised_footnotes:
