translation:
  language: ko
  text: 예수님께서 이 말을 들으시고 놀라셨습니다. 그리고 예수님을 따르던 사람들에게 말씀하셨습니다. “내가 진실로 너희에게 말합니다. 이스라엘의 그 누구에게서도 이만한 믿음을 찾지 못했습니다.”
  philosophy: optimal-equivalence
