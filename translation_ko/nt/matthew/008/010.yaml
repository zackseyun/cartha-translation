revisions:
- from: 예수님이 이 말을 듣고 놀라시며 따르는 자들에게 말씀하셨습니다. 「진실로 너희에게 말한다. 이스라엘에서 누구에게서도 이런 큰 믿음을 본 적이 없다.
  to: 예수님께서 이 말을 들으시고 놀라셨습니다. 그리고 예수님을 따르던 사람들에게 말씀하셨습니다. “내가 진실로 너희에게 말합니다. 이스라엘의 그 누구에게서도 이만한 믿음을 찾지 못했습니다.”
  rationale: 원문의 두 주동사(‘들으시고 놀라셨다’, ‘말씀하셨다’)를 자연스러운 한국어 문장으로 분명히 구분했습니다. ‘이만한 믿음’은 τοσαύτην의 정도 강조를 보존하며, ‘찾지 못했습니다’는 εὗρον의 완료된 경험적 진술을 현대 한국어 합쇼체로 자연스럽게 옮깁니다. 본문에 필요한 원문상 불확실성이나 필수 대안이 없으므로 각주는 두지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:44Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 예수께서 들으시고 놀라신 뒤 따르는 이들에게 말씀하신 기본 의미와 이스라엘 안에서 그와 같은 믿음을 찾지 못하셨다는 진술을 대체로 담고 있습니다. 그러나 현재분사 τοῖς ἀκολουθοῦσιν의 현장성을 ‘예수님을 따르던 사람들’로 드러내고, παρ’ οὐδενὶ의 인칭 범위를 ‘그 누구에게서도’로 옮기는 편이 더 정확합니다.
  naturalness: ‘놀라시며’보다 사건의 순서를 자연스럽게 나타내는 ‘놀라셨습니다. 그리고’가 적절합니다. 또한 인용문 안의 ‘말한다/없다’는 합쇼체와 맞지 않으므로 ‘말합니다/찾지 못했습니다’로 고쳤습니다. 초안에는 인용문 닫는 부호도 누락되어 있습니다.
  terminology: πίστις는 문맥과 기본 용례에 따라 ‘믿음’으로 유지했습니다. Ἀμήν λέγω ὑμῖν은 엄숙한 선언 공식으로 ‘내가 진실로 너희에게 말합니다’로 옮겼습니다. ‘이스라엘’은 지명·공동체를 아우르는 원문의 표현을 보존합니다.
  issues:
  - severity: medium
    issue: 인용문 종결 부호 누락 및 인용문 안 종결 어미의 등록 불일치
    rationale: 초안은 닫는 인용 부호가 없고, 서술부는 합쇼체인데 예수님의 발화는 ‘말한다/없다’로 끝납니다. 완결된 문장과 지정된 현대 합쇼체가 필요합니다.
  - severity: low
    issue: ‘따르는 자들’의 자연성과 지시 대상
    rationale: ‘따르는 자들’은 현대 한국어에서 다소 어색하며 누구를 따르는지 명시되지 않습니다. ‘예수님을 따르던 사람들’이 τοῖς ἀκολουθοῦσιν을 자연스럽고 정확하게 전달합니다.
  - severity: low
    issue: ‘누구에게서도’의 범위 표현
    rationale: ‘이스라엘에서 누구에게서도’도 이해되지만, ‘이스라엘의 그 누구에게서도’가 사람들 가운데서 믿음을 발견한다는 παρά 구문의 의미를 더 분명하게 나타냅니다.
