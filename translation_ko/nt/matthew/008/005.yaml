  verdict: revise
  source_fidelity: ‘들어가시자’ can imply an immediate ‘as soon as’ sequence that the aorist genitive absolute does not require. ‘들어가셨을 때’ more neutrally represents the temporal relation. The centurion’s approach and earnest request are otherwise conveyed accurately.
  naturalness: The revision is natural modern formal-polite Korean. Repeating ‘그분께’ before ‘간청하며’ makes the participial phrase’s object explicit and avoids any momentary ambiguity in this verse fragment.
  terminology: ‘가버나움’ and ‘백부장’ are standard Korean biblical forms. Honorific forms for Jesus are appropriate to the requested register. ‘간청하며’ suitably renders παρακαλῶν without over-intensifying it.
  issues:
  - severity: low
    issue: Temporal connective is overly specific
    rationale: ‘-시자’ often conveys immediate succession, whereas Εἰσελθόντος δὲ αὐτοῦ is a temporal genitive absolute that need not specify immediacy.
  - severity: low
    issue: English audit-trail footnote a is misanchored
    rationale: Its stated alternative (‘approached him’) concerns προσῆλθεν αὐτῷ, not ‘Capernaum.’ The Korean revision places the corresponding alternative at ‘와서.’
