- from: 예수님이 그들에게 말씀하셨습니다. 「믿음이 작은 자들아, 어찌하여 두려워하느냐?」 그러고 나서 일어나 바람과 호수를 꾸짖으시자, 큰 고요가 임했습니다.
  to: 예수님께서 그들에게 말씀하셨습니다. 「믿음이 작은 자들아, 왜 이렇게 두려워하느냐?」 그러고 나서 일어나시어 바람과 바다를 꾸짖으시니, 큰 고요가 일었습니다.
  rationale: 원문의 ‘바다’를 보존하고, 분사와 결과절의 관계를 자연스러운 현대 한국어 합쇼체로 다듬었습니다.
