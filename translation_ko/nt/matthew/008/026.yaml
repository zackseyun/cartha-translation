review_pass:
  verdict: revise
  source_fidelity: ‘호수’는 본문의 τῇ θαλάσσῃ(바다)를 좁혀 옮긴 것이므로 ‘바다’로 고쳐야 합니다. 또한 ἐγερθεὶς는 ‘일어나시어’로, ἐγένετο γαλήνη μεγάλη는 ‘큰 고요가 일었다’로 자연스럽게 반영할 수 있습니다.
  naturalness: 합쇼체 문장과 직접화법은 자연스럽습니다. ‘바람과 바다를 꾸짖으시니, 큰 고요가 일었습니다’는 한국어 문맥에서도 매끄럽고 원문의 결과 연결을 보존합니다.
  terminology: ὀλιγόπιστοι는 ‘믿음이 작은 자들’로 유지했습니다. δειλοί의 질책 어조는 ‘왜 이렇게 두려워하느냐?’로 무리 없이 나타냈으며, 특정 교리적 해석을 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘호수’
    rationale: 그리스어 본문은 θάλασσα(바다)라고 하므로, 지리적 배경을 근거로 ‘호수’로 특정하지 않는 편이 원문 충실성에 맞습니다.
  - severity: low
    issue: ‘큰 고요가 임했습니다’
    rationale: 의미는 통하지만, ἐγένετο(일어났다/되었다)의 서술을 ‘큰 고요가 일었습니다’로 옮기면 더 직접적이고 자연스럽습니다.
