revisions:
- from: 제자들 중 또 한 사람이 그분께 말했습니다. 「주님, 먼저 가서 제 아버지를 장사 지내도록 허락해 주십시오.」
  to: 그런데 제자들 가운데 다른 한 사람이 그분께 말했습니다. “주님, 먼저 가서 제 아버지를[a] 장사 지내도록 허락해 주십시오.”
  rationale: ‘다른 한 사람’으로 ἕτερος의 구별 의미를 더 분명히 하고, δέ의 가벼운 연결을 ‘그런데’로 반영했습니다. 본문은 요청을 직역적으로 유지하되, 해석이 갈리는 장사 요청의 시간적 의미는 각주에서만 밝혔습니다.
