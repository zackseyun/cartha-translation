source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
  footnotes:
  - marker: a
    text: Or 'allow me' or 'let me.'
    reason: lexical_alternative
  - marker: b
    text: The request may refer either to an immediate burial or more broadly to fulfilling filial duty until his father dies; the Greek does not specify.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 제자들 가운데 다른 한 사람이 그분께 말했습니다. “주님, 먼저 가서 제 아버지를[a] 장사 지내도록 허락해 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 요청은 아버지가 이미 죽어 즉시 장사 지내야 한다는 뜻일 수도 있고, 아버지가 죽을 때까지 자녀의 의무를 다하겠다는 더 넓은 뜻일 수도 있습니다. 그리스어 본문은 이를 특정하지 않습니다.
    reason: cultural_note
