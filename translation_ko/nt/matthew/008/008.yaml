base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
  footnotes:
  - marker: a
    text: Or “say the word.” The Greek literally reads “speak a word.”
    reason: lexical_alternative
  - marker: b
    text: Or “boy” or “child” for “servant”; the Greek word can refer to a child, youth, or servant depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 백부장이 대답했습니다. “주님, 주님께서 제 지붕 아래로 들어오실 만큼 저는 합당하지 않습니다. 다만 한 말씀만 하십시오[a]. 그러면 제 종[b]이 나을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “말씀만 하십시오.” 헬라어는 직역하면 “말씀으로 말하십시오”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “아이”나 “소년.” 헬라어 파이스는 문맥에 따라 아이, 소년, 또는 종을 뜻할 수 있습니다.
    reason: alternative_reading
