  terminology: ‘큰 풍랑’ is an apt contextual rendering of σεισμὸς μέγας in this maritime setting. ‘바다’ follows the Greek term without imposing the geographical gloss ‘lake.’ ‘그분’ preserves the source pronoun and its contrast without unnecessarily replacing it with an explicit name.
