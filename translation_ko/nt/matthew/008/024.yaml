    text: Or 'was being covered'.
    reason: previous_rendering
translation:
  language: ko
  text: 그런데 보십시오, 바다에 큰 풍랑이 일어나 배가 파도에 덮이고 있었으나, 그분은 주무시고 계셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
