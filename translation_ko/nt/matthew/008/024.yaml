    issue: ‘배가 파도에 덮일 지경이었으나’ weakens καλύπτεσθαι.
    rationale: The Greek present passive infinitive describes the boat as being covered by the waves, not merely approaching that condition.
  - severity: low
    issue: The lexical ambiguity of σεισμός is not documented.
    rationale: In this context ‘풍랑’ is the natural rendering, but a note can transparently indicate that the word can literally denote a shaking or earthquake.
