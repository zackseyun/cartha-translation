    text: ‘큰 풍랑’으로 옮긴 그리스어 단어는 문자적으로 ‘큰 흔들림’ 또는 ‘큰 지진’을 뜻하기도 합니다. 여기서는 바다와 파도라는 문맥상 거센 풍랑을 가리킵니다.
    reason: lexical_alternative
