  verdict: revise
  source_fidelity: 핵심 대조와 심판의 이미지는 대체로 충실합니다. 다만 εἰς τὸ σκότος τὸ ἐξώτερον은 목적지의 뉘앙스를 살려 ‘바깥 어둠 속으로’로 옮기는 것이 더 정확하며, κλαυθμός에는 ‘슬피’라는 강도를 별도로 덧붙이지 않는 편이 좋습니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 종결을 ‘것입니다’로 통일해야 합니다. 또한 본문 끝의 닫는 인용 부호(」)는 문장부호 오류이므로 삭제해야 합니다. ‘그곳에서는 울며 이를 갈 것입니다’는 한국어에서 자연스럽고 원문의 정형적 표현도 유지합니다.
  terminology: ‘그 나라의 아들들’은 υἱοὶ τῆς βασιλείας의 직역적이며 문맥상 의도된 표현을 보존합니다. ‘바깥 어둠’과 ‘이를 갈다’도 마태복음의 심판 이미지를 과도하게 해석하지 않고 적절히 전달합니다.
  issues:
  - severity: medium
    issue: 합쇼체 종결 불일치
    rationale: 초안의 ‘쫓겨날 것이다’, ‘이를 갈 것이다’는 서술체 해라체이므로, 지정된 현대 공식 존대체(합쇼체)와 일치하지 않습니다.
  - severity: low
    issue: 불필요한 의미 강화와 목적지 표현의 약화
    rationale: ‘슬피’는 κλαυθμός가 직접 명시하지 않은 강도를 더하며, ‘바깥 어둠으로’보다 ‘바깥 어둠 속으로’가 εἰς의 진입·목적지 표현을 더 자연스럽게 반영합니다.
  - severity: medium
    issue: 본문 끝의 고립된 닫는 인용 부호
    rationale: 닫는 인용 부호 ‘」’에 대응하는 여는 부호가 없으므로 문장부호상 오류입니다.
  revised_text: 그러나 그 나라의 아들들은 바깥 어둠 속으로 쫓겨날 것입니다. 그곳에서는 울며 이를 갈 것입니다.
