  source_fidelity: 원문의 주어는 명시되지 않았으므로 ‘제자들이’는 문맥상 가능하지만 본절 자체에는 없는 정보를 보탭니다. 또한 ἀπολλύμεθα는 현재형으로, ‘죽게 되었습니다’보다 현재 진행 중인 절박한 위기를 나타내는 표현이 더 가깝습니다.
  naturalness: 합쇼체와 대화체는 자연스럽습니다. 다만 ‘깨우며 말했습니다’는 두 동작의 관계를 다소 흐리므로, 순서를 드러내는 ‘깨우고 말했습니다’가 더 명료합니다.
  terminology: Κύριε는 ‘주님’으로 적절합니다. σῶσον은 긴급한 구원의 청원으로 ‘우리를 구해 주십시오’가 자연스럽고 충실합니다.
  issues:
  - severity: medium
    issue: ‘제자들이’가 원문에 명시되어 있지 않습니다.
    rationale: καὶ προσελθόντες의 주어는 문맥에서 알 수 있으나 이 절의 그리스어에는 ‘제자들’이라는 명사가 없습니다. 한국어에서는 ‘그들이’로 처리하여 문맥적 지시를 유지하면서도 원문이 명시하지 않은 명사를 추가하지 않는 편이 안전합니다.
  - severity: medium
    issue: ‘우리가 죽게 되었습니다’가 현재형 ἀπολλύμεθα의 진행성과 긴박성을 약화합니다.
    rationale: ἀπολλύμεθα는 ‘우리는 망해 가고/죽어 가고 있습니다’라는 현재의 절박한 상황을 표현합니다. ‘죽어 가고 있습니다’가 이를 더 잘 반영합니다.
