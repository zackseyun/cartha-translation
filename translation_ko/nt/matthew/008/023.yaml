  source_fidelity: 원문의 시간적 분사(ἐμβάντι)는 “배에 오르시자”로 자연스럽게 반영되며, 제자들이 예수님을 물리적으로 ‘따랐다’는 ἠκολούθησαν의 의미와 그 함축을 모두 보존합니다. πλοῖον의 무관사성도 한국어의 관사 없는 “배에”가 불필요하게 확정하거나 한정하지 않아 적절히 유지합니다.
  naturalness: “예수님이 배에 오르시자, 제자들이 그분을 따랐습니다.”는 현대 표준 한국어 합쇼체로 자연스럽고 명료합니다. “-시자”는 원문의 선행하는 시간 관계를 간결하게 나타냅니다.
  terminology: “제자들”은 μαθηταί의 정착된 복음서 용어이며, “따랐습니다”는 ἀκολουθέω의 서술적 의미와 제자도 관련 여지를 과도한 해석 없이 보존합니다. “예수님/그분”의 존칭도 목표 문체에 적합합니다.
