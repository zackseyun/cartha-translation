  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
  footnotes:
  - marker: a
    text: Some manuscripts read “Gergesenes” or “Gerasenes” instead of “Gadarenes.”
    reason: textual_variant
  - marker: b
    text: Or “very fierce.”
    reason: lexical_alternative
  - marker: c
    text: Or 'pass by that road'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수님이 건너편 가다라[a] 지방에 이르시자, 귀신 들린 두 사람이 무덤들에서 나와 그분을 만났습니다. 그들은 몹시 사나워서 아무도 그 길로 지나갈 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 ‘거라사인들’ 또는 ‘게르게세인들’로 되어 있다. SBLGNT 본문은 ‘가다라인들’로 읽는다.
    reason: textual_variant
