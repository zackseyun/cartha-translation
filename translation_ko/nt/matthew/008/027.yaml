  source_fidelity: ‘호수’는 갈릴리 호수라는 문맥에는 맞을 수 있으나, 본문의 θάλασσα는 ‘바다’이므로 번역에서도 ‘바다’로 옮기는 것이 원문 어휘와 마태의 표현을 보존합니다. ‘순종하다’는 ὑπακούουσιν을 적절히 반영합니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 인용문 질문의 종결을 ‘순종합니까?’로 고쳤습니다. ‘놀라서 말했습니다’는 분사 λέγοντες와 앞선 놀람의 연계를 자연스럽게 나타냅니다.
  terminology: ‘이분’, ‘그분께’, ‘순종하다’는 예수를 가리키는 문맥과 존중하는 한국어 성경 문체에 자연스럽습니다. Ποταπός의 놀라움과 성격을 묻는 힘은 ‘도대체 어떤 분이시기에’에 유지됩니다.
  issues:
