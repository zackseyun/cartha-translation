review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the command, the exit and entry into the pigs, the whole herd, the steep descent, and death in the waters. However, θάλασσαν is explicitly “sea”; rendering it “lake” replaces the source term with a geographical interpretation.
  naturalness: The Korean is clear and appropriately uses modern formal-polite narrative style. “그런데 보십시오” effectively retains the vivid attention marker ἰδού, and “가파른 비탈을 따라 … 내달려 들어가” naturally conveys the forceful descent.
  terminology: “돼지들” is a suitable contemporary rendering of χοίρους. “물 속에서 죽었습니다” preserves ἀπέθανον ἐν τοῖς ὕδασιν without adding the interpretive term “익사했습니다.” “바다” should be retained for θάλασσα.
  issues:
  - severity: medium
    issue: “호수” renders θάλασσαν.
    rationale: The Greek source says “sea.” Although the body of water is geographically a lake, the translation should retain the source wording rather than introduce that explanatory geographical gloss.
  revised_text: 예수님이 그들에게 말씀하셨습니다. “가라.” 그러자 귀신들이 나와서 돼지들 속으로 들어갔습니다. 그런데 보십시오, 온 돼지 떼가 가파른 비탈을 따라 바다로 내달려 들어가 물 속에서 죽었습니다.
