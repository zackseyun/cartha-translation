- from: 예수님이 그들에게 말씀하셨습니다. 「가라.」 그러자 귀신들이 나와서 돼지들 속으로 들어갔습니다. 그런데 보십시오, 온 떼가 가파른 비탈을 따라 호수로 달려 들어가 물 속에서 죽었습니다.
  to: 예수님이 그들에게 말씀하셨습니다. “가라.” 그러자 귀신들이 나와서 돼지들 속으로 들어갔습니다. 그런데 보십시오, 온 돼지 떼가 가파른 비탈을 따라 바다로 내달려 들어가 물 속에서 죽었습니다.
