  source_fidelity: 초안은 백부장, 믿음에 따른 결과, 종의 치유라는 핵심 의미를 대체로 반영합니다. 그러나 γενηθήτω의 선언적·명령적 뉘앙스를 더 자연스럽게 살리고, παῖς의 의미 범위에 관한 원문의 각주를 보존해야 합니다. 또한 '바로'는 ἐν τῇ ὥρᾳ ἐκείνῃ보다 강한 즉시성을 덧붙입니다.
