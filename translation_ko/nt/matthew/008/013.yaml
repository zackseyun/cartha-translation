base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
  footnotes:
  - marker: a
    text: Or “the boy” or “the child”; Greek παῖς can refer to a servant or to a young person. In this context, “servant” best fits the centurion’s subordinate.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예수님께서 백부장에게 말씀하셨습니다. “가십시오. 당신이 믿은 대로 당신에게 이루어질 것입니다.” 그러자 그 종[a]이 그 시각에 치유되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “소년” 또는 “아이”. 그리스어 파이스(παῖς)는 종이나 젊은 사람을 가리킬 수 있습니다. 이 문맥에서는 백부장의 부하를 뜻하는 “종”이 가장 알맞습니다.
    reason: lexical_alternative
