  - severity: low
    issue: ‘간청하며 말했습니다’의 중복적 연결
    rationale: 간청의 내용을 직접 인용으로 제시하므로 ‘말했습니다’를 별도로 둘 필요가 없고, 지속성을 반영한 서술로 더 매끄럽게 정리할 수 있습니다.
