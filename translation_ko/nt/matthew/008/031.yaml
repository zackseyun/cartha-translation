  source_fidelity: 대체로 충실합니다. 그러나 παρεκάλουν은 미완료 과거로, 계속되거나 거듭된 간청을 나타내므로 이를 번역에 반영하는 편이 좋습니다. ἀπόστειλον은 단순히 ‘보내 주십시오’로 옮길 수 있으며, ‘저’는 원문에 없지만 한국어 지시어로 큰 의미 변화는 없습니다.
  naturalness: 합쇼체는 자연스럽습니다. 다만 ‘간청하며 말했습니다’는 미완료의 지속성을 충분히 드러내지 못하므로 ‘계속 간청했습니다’가 더 자연스럽고 정확합니다. 직접 인용 앞의 ‘말했습니다’는 중복되므로 생략할 수 있습니다.
  terminology: ‘귀신들’은 이 문맥의 δαίμονες에 대한 한국어 성경 전통 및 현대 표준어 용례에 맞습니다. ‘돼지 떼’는 ἀγέλην τῶν χοίρων을 자연스럽게 옮깁니다. ‘예수님’은 한국어 존칭 관습에 맞습니다.
  issues:
