  to: 그리고 예수님께서 그에게 말씀하셨습니다. 「아무에게도 말하지 않도록 조심하십시오. 그러나 가서 제사장에게 자신을 보이고, 모세가 명한 예물을 드려 그들에게 증거가 되도록 하십시오.」
