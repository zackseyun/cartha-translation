review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 αὐτοῦ는 문맥상 베드로를 가리키므로, 한국어의 ‘그의 장모’는 예수님을 가리키는 것으로도 잠시 읽힐 수 있어 명시하는 편이 낫습니다. πυρέσσουσαν은 단순히 열이 나는 상태를 뜻하므로 ‘열이 나서’가 자연스럽고 직접적입니다.
  naturalness: ‘예수님이 … 들어가셔서’와 ‘보셨습니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘베드로의 장모가 열이 나서 누워 있는’은 명료하고 자연스러운 병렬 표현입니다.
  terminology: ‘예수님’, ‘베드로’, ‘장모’는 적절합니다. ‘베드로의 장모’로 친족 관계의 선행사를 명시하여 원문의 문맥상 지시를 분명히 합니다.
  issues:
  - severity: low
    issue: ‘그의 장모’의 선행사가 한국어에서 모호할 수 있음
    rationale: 그리스어 αὐτοῦ는 문맥상 베드로를 가리키지만, 한국어 문장에서는 가장 가까운 남성 선행사인 예수님으로 오해될 여지가 있습니다. ‘베드로의 장모’로 명시하면 의미를 바꾸지 않고 모호성을 제거합니다.
  - severity: low
    issue: ‘열병으로’는 다소 특정 질병명처럼 들릴 수 있음
    rationale: πυρέσσουσαν은 ‘열이 나다/열병을 앓다’라는 상태를 나타냅니다. 현대 한국어에서는 ‘열이 나서’가 더 직접적이며 불필요하게 병명을 특정하지 않습니다.
  revised_text: 예수님께서 베드로의 집에 들어가셔서 베드로의 장모가 열이 나서 누워 있는 것을 보셨습니다.
