    text: 헬라어 λεπρός. 전통적으로 「나병」으로 번역하지만, 이 말이 현대 의학에서 말하는 한센병과 정확히 일치하는지는 분명하지 않다. 여기서는 전통적 번역어를 사용하되, 사람을 지칭할 때 비하적 표현인 「문둥병자」는 피했다.
    reason: lexical_alternative
  revision_rationale: 원문의 주의 환기 표현은 유지하고 부가된 대조 의미는 제거했습니다. 접근의 의미와 καθαρίζω의 정결 의미를 더 정확히 반영했으며, 질병 용어 각주가 고대 어휘를 현대 질병 분류와 동일시하지 않도록 수정했습니다.
