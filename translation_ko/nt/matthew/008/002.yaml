  source_fidelity: 본문의 요청 내용(‘원하시면 … 깨끗하게 하실 수 있습니다’)과 προσκυνέω의 신체적·경의적 행동을 ‘그분 앞에 엎드려’로 옮긴 것은 충실합니다. 다만 καὶ ἰδού는 대조를 뜻하지 않으므로 ‘그런데’는 삭제하는 것이 좋습니다. 또한 각주가 λεπρός를 한센병을 포함하는 특정한 의학적 범주로 단정하는 방식은 원문의 포괄성과 역사적 불확실성을 지나치게 좁힙니다.
  naturalness: ‘보십시오, 한 나병 환자가 다가와 그분 앞에 엎드려 말했습니다’는 현대 표준어 합쇼체 서사에 자연스럽고, 원문의 주의를 환기하는 표현도 유지합니다.
  terminology: ‘주님’과 ‘깨끗하게 하다’는 각각 Κύριε와 καθαρίσαι의 존칭 및 정결 어휘를 잘 살립니다. ‘나병 환자’는 비하적 전통 표현을 피하는 현대적인 표현이지만, λεπρός가 현대 의학상의 한센병만을 정확히 지칭한다고 보지 않도록 각주를 절제해 수정해야 합니다.
  issues:
  - severity: low
    issue: ‘그런데’가 καὶ ἰδού에 대조적 연결을 더합니다.
    rationale: 여기서 καὶ ἰδού는 주로 서술을 잇고 독자의 주의를 환기합니다. ‘보십시오’만으로 그 기능을 충분히 옮길 수 있습니다.
  - severity: medium
    issue: 각주가 λεπρός의 지시 대상을 ‘한센병을 포함한 … 피부병’으로 설명하며 의식적 불결까지 단정합니다.
    rationale: 고대의 λεπρός/‘나병’ 계열 용어와 현대 질병 분류는 일대일로 대응하지 않습니다. 본문만으로 특정 질병 또는 포괄적 의식 상태를 확정하지 말고, 전통적 용어가 다양한 피부 질환을 가리킬 수 있음을 밝혀야 합니다.
  revised_text: 보십시오, 한 나병 환자가 다가와 그분 앞에 엎드려 말했습니다. 「주님, 원하시면 저를 깨끗하게 하실 수 있습니다.」
  revised_footnotes:
  - marker: a
    text: 헬라어 λεπρός. 이 용어는 전통적으로 「나병」으로 옮겨졌으나, 현대 의학의 특정 질병과 반드시 일치하지 않으며 여러 피부 질환을 가리킬 수 있다. 비하적 함의가 있는 전통 표현 대신 「나병 환자」로 옮겼다.
    reason: lexical_alternative
  revision_rationale: 대조 의미를 덧붙이는 ‘그런데’를 삭제하여 καὶ ἰδού의 주의 환기 기능을 ‘보십시오’로 옮겼습니다. 또한 나병 관련 각주에서 원문이 허용하지 않는 현대 의학적·의식적 범주의 단정을 제거하면서, 용어의 역사적 범위와 현대 한국어 표현 선택을 간결하게 밝혔습니다.
