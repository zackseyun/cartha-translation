review_pass:
  verdict: revise
  source_fidelity: 「그런데」는 καὶ ἰδού에 없는 대조·전환의 뉘앙스를 더하므로 삭제하는 것이 좋습니다. προσελθών의 접근 의미는 「다가와」로 분명히 드러내고, καθαρίσαι는 단순한 위생적 깨끗함보다 질병 및 의례적 정결의 공명을 지니므로 「정결하게 하시다」가 더 적절합니다.
  naturalness: 「보십시오, 한 나병 환자가 다가와 그분 앞에 엎드려 말했습니다」는 현대 표준어 합쇼체 서술로 자연스럽습니다. 「나병 환자」는 띄어쓰기를 적용했습니다.
  terminology: 「주님」은 Κύριε에 적절하며, 「엎드려」는 προσκυνέω의 신체적 부복과 경의의 의미를 유지하면서 ‘경배’라는 해석을 본문에 선결하지 않습니다. 각주에서는 λεπρός를 현대 의학의 한센병과 동일시하지 않도록 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: 「그런데」가 원문에 없는 대조적 연결을 첨가함
    rationale: καὶ ἰδού는 장면에 주의를 환기하는 연결(‘그리고 보라’)이지, 문맥상 대조를 표시하는 접속사는 아닙니다.
  - severity: medium
    issue: 「깨끗하게 하실 수 있습니다」가 καθαρίσαι의 정결 의미를 약화함
    rationale: 이 동사는 이 문맥에서 신체적 치유와 의례적 정결의 함의를 함께 지니므로 「정결하게 하시다」가 더 충실합니다.
  - severity: medium
    issue: 각주가 λεπρός의 지시 대상을 지나치게 단정함
    rationale: 고대의 λεπρός가 현대 의학적 한센병과 정확히 일치하는지는 확정할 수 없습니다. ‘의식적·신체적 불결을 일으키는 피부병 환자’라는 설명도 본문 어휘의 지시 범위를 과도하게 규정합니다.
  revised_text: 보십시오, 한 나병 환자[a]가 다가와 그분 앞에 엎드려 말했습니다. 「주님, 원하시면 저를 정결하게 하실 수 있습니다.」
  revised_footnotes:
