  source_fidelity: 원문의 목적절(ὅπως ... πληρωθῇ), ‘예언자 이사야를 통하여 하신 말씀’, 그리고 인용문의 두 동사(ἔλαβεν ‘취하다’, ἐβάστασεν ‘짊어지다’)의 구별을 반영하도록 수정이 필요합니다. 초안은 인용문에서 두 동사의 대응을 바꾸었습니다.
  naturalness: ‘이사야를 통해 말씀하신 것’은 한국어에서 누가 말씀했는지가 다소 불분명합니다. ‘이사야 예언자를 통하여 하신 말씀’이 현대 표준어 문어체에서 더 자연스럽고 분명합니다. ‘이루어지도록 하기 위함이었습니다’는 문맥에 맞는 합쇼체 서술입니다.
  terminology: ἀσθενείας는 이 문맥에서 신체적 병약함을 가리키지만 ‘연약함’도 가능한 폭넓은 번역이므로 유지했습니다. νόσους는 ‘질병’으로, ἐβάστασεν은 ‘짊어지셨다’로 옮겨 두 명사의 병렬과 동사 구별을 살렸습니다. ‘담당하셨다’는 가능하지만 여기서는 ‘짊어지셨다’가 βαστάζω에 더 직접적입니다.
  issues:
