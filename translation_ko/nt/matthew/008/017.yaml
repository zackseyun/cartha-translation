  to: 이는 이사야 예언자를 통하여 하신 말씀이 이루어지도록 하기 위함이었습니다. “그가 친히 우리의 연약함을 취하시고 우리의 질병을 짊어지셨다.”
  rationale: 목적을 나타내는 성취 공식과 이사야의 예언자 지위를 명료하게 하고, 인용문에서 ‘취하다’와 ‘짊어지다’의 원문상 동사 구별을 회복했습니다. ‘연약함’은 ἀσθενείας의 의미 범위를 보존하며, 바로 뒤의 ‘질병’과도 구별됩니다.
