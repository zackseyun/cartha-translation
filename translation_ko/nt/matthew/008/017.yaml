    rationale: 그리스어는 ‘우리의 연약함을 취하셨고(ἔλαβεν), 우리의 질병을 짊어지셨다(ἐβάστασεν)’라고 합니다. 초안은 ‘연약함을 짊어지시고 질병을 담당하셨다’로 첫 동사를 바꾸었습니다.
  - severity: low
