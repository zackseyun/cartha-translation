  naturalness: '''그들이 외치며 말했습니다''도 이해되지만, 현대 표준어 합쇼체 성경 문맥에서는 ''그들이 외쳐 말했습니다''가 더 간결하고 자연스럽습니다. ''보십시오''는 ἰδού의 독자 환기 기능을 적절히 살립니다.'
  terminology: '''하나님의 아들이여''는 υἱὲ τοῦ θεοῦ의 직접 호칭을 충실히 반영합니다. ''우리가 당신과 무슨 상관이 있습니까?''는 Τί ἡμῖν καὶ σοί의 관용적 거리 두기·대결의 뜻을 자연스럽게 전달합니다. βασανίσαι의 경우 ''괴롭히려고''는 과도하게 구체화하지 않으면서 심한 고통의 의미를 유지합니다.'
  issues:
