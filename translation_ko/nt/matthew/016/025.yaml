source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: ko
  text: 「왜냐하면 누구든지 자기 생명을 구하려고 하는 사람은 그것을 잃을 것이지만, 누구든지 나를 위하여 자기 생명을 잃는 사람은 그것을 찾을 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 본문 전체에서 「영혼」. 헬라어 ψυχή는 문맥에 따라 「생명」, 「자신」 또는 「영혼」을 가리킬 수 있다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχὴν
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 영혼
  - 자기 자신
  lexicon: BDAG
  rationale: ψυχή는 「생명·자아·영혼」의 폭. 본문의 「구하다·잃다·찾다」 문맥에서 「생명」이 자연스럽고, 「영혼」 가능성은 각주로 보존한다.
- source_word: ἕνεκεν ἐμοῦ
  english_pob_choice: for my sake
  chosen_korean: 나 때문에
  alternatives_korean:
  - 나를 위하여
  lexicon: BDAG
  rationale: ἕνεκεν의 원인적 의미. 「나 때문에」가 자연스러우면서 충성도의 함의를 담는다.
