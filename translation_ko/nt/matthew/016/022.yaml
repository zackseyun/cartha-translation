  source_fidelity: ‘옆으로 데리고 가서’와 ‘책망하기 시작하며’는 προσλαβόμενος 및 ἤρξατο ἐπιτιμᾶν의 의미를 대체로 반영합니다. 그러나 Ἵλεώς σοι와 뒤따르는 οὐ μὴ ἔσται σοι τοῦτο를 모두 사실상 ‘그런 일은 안 된다’로 옮겨 반복하여, 서로 구별되는 두 절의 기능과 후자의 강한 미래 부정을 충분히 드러내지 못합니다.
  naturalness: 합쇼체 서술에는 ‘말합니다’보다 과거 사건 서술인 ‘말했습니다’가 자연스럽습니다. 또한 예수께 직접 말하는 자리에서 ‘당신’보다 ‘주님께’가 현대 표준어 성경 문체에서 더 자연스럽고 공손합니다.
  terminology: ‘베드로’, ‘주님’, ‘책망하다’는 적절합니다. 관용구 Ἵλεώς σοι는 하나님을 본문에 명시적으로 보태지 않는 ‘결코 그럴 수 없습니다’로 본문에서 처리하고, ‘하나님께서 금하시기를’은 가능한 해석적 대안으로 각주에 남기는 것이 안전합니다.
