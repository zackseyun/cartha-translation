  text: 베드로가 그분을 따로 데리고 가서 책망하기 시작하며 말했습니다. 「주님, 결코 그럴 수 없습니다.[a] 이 일이 주님께는 결코 일어나지 않을 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
