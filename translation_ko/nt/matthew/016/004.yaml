source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: ko
  text: 「악하고 음란한[a] 세대가 표적을 구하지만, 요나의 표적[b] 외에는 그 세대에게 어떤 표적도 주어지지 않을 것입니다.」 그리고 그가 그들을 남겨 두고 떠나가셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「언약에 신실하지 못한 세대」. 헬라어는 「음란한」으로, 언약 불성실에 관한 예언서의 비유적 언어를 반향할 가능성이 높습니다.
    reason: lexical_alternative
  - marker: b
    text: 「요나의 표적」에 관해서는 마태복음 12:39~40을 보십시오. 그곳에서는 요나의 사흘 낮과 사흘 밤의 패턴이 인자에게 적용됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: μοιχαλὶς
  english_pob_choice: adulterous
  chosen_korean: 음란한
  alternatives_korean:
  - 언약에 신실하지 못한
  lexicon: BDAG
  rationale: 예언서의 「영적 음행」 비유를 반향한다. 한국어 「음란한」이 정착어이며 비유적 무게를 보존한다.
- source_word: Ἰωνᾶ
  english_pob_choice: Jonah
  chosen_korean: 요나
  lexicon: BDAG
  rationale: 한국 성경 정착어.
