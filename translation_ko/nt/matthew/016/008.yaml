  verdict: revise
  source_fidelity: 초안의 ‘자기들끼리’는 예수께서 제자들에게 직접 말씀하시는 문맥에서 인칭 지시가 어긋납니다. 또한 ὅτι절은 제자들이 의논하는 내용, 곧 빵이 없다는 사실을 나타내므로 이를 한국어에서 직접 드러내는 편이 충실합니다.
  naturalness: ‘너희끼리 왜 의논하느냐?’는 현대 표준어에서 자연스럽고, 인용된 예수님의 책망에는 해라체 의문 종결이 적절합니다. 서술문은 합쇼체로 유지했습니다.
  terminology: ὀλιγόπιστοι에는 마태복음에서 익숙한 표현인 ‘믿음이 작은 사람들아’를 사용했습니다. ἄρτους는 문맥상 자연스러운 질량명사 ‘빵’으로 옮겼으며, 복수 ‘빵들’을 기계적으로 재현하지 않았습니다.
  issues:
