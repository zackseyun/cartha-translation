- from: 예수께서 이것을 아시고 말씀하셨습니다. 「믿음이 작은 자들아, 어찌하여 너희가 빵을 가져오지 않았다고 자기들끼리 의논하느냐?」
  to: 예수께서 이를 아시고 말씀하셨습니다. “믿음이 작은 사람들아, 너희에게 빵이 없다고 너희끼리 왜 의논하느냐?”
  rationale: 인칭 지시를 바로잡고, 빵을 ‘가져오지 않았다’는 문맥적 추론보다 원문의 내용절과 결과 상태에 가까운 표현으로 조정했습니다. 원문의 책망과 질문의 어조는 유지했습니다.
  reviewer_model: gpt-5.6-terra
