    issue: ‘자기들끼리’의 인칭 지시
    rationale: 원문의 ἐν ἑαυτοῖς는 예수께서 مخاطبة하는 제자들 사이를 가리키므로, 한국어 직접 화법에서는 ‘너희끼리’가 자연스럽고 정확합니다.
  - severity: low
    issue: ὅτι절의 표현
    rationale: ‘빵을 가져오지 않았다고’도 문맥상 가능하지만, 원문은 문자상 ‘빵이 없다/받지 않았다’에 해당합니다. ‘너희에게 빵이 없다고’는 결과 상태를 자연스럽게 나타내면서 불필요하게 ‘가져오다’를 확정하지 않습니다.
