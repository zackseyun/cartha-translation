  source_fidelity: 그리스어의 역사적 현재 λέγει는 현재형인 「말씀하십니다」로 잘 반영되었습니다. 다만 δέ는 앞선 사람들의 견해와 제자들의 답을 대조하므로 「그러면」보다 「그러나」가 더 정확합니다. 명시된 Ὑμεῖς의 강조도 「너희는」으로 보존됩니다.
  naturalness: 「그가 그들에게 말씀하십니다」와 「너희는 나를 누구라고 말하느냐?」는 현대 표준 한국어 합쇼체 서술 및 직접화법으로 자연스럽습니다.
  terminology: 예수께 적용된 「말씀하십니다」는 한국어 성서 문체에서 자연스럽고 공손한 높임말입니다. 신학적 해석을 덧붙이지 않았습니다.
