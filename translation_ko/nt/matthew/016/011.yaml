- from: 「내가 빵에 관해서 너희에게 말한 것이 아님을 어찌하여 깨닫지 못하느냐? 다만 바리새인들과 사두개인들의 누룩을 조심하라.」[a][b]
  to: 「내가 너희에게 빵에 관하여 말한 것이 아님을 어찌하여 깨닫지 못합니까? 그러나 바리새인들과 사두개인들의 누룩을 조심하십시오[a][b].」
