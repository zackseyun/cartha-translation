  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: ko
  text: 「내가 너희에게 빵에 관하여 말한 것이 아님을 어찌하여 깨닫지 못합니까? 그러나 바리새인들과 사두개인들의 누룩을 조심하십시오[a][b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「바리새인들과 사두개인들의 누룩을 경계하십시오」.
    reason: lexical_alternative
  - marker: b
    text: 「누룩」은 여기서 비유이며, 다음 절에서 바리새인들과 사두개인들의 가르침으로 설명됩니다.
    reason: cross_reference
