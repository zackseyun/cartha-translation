  naturalness: ‘어찌하여 … 깨닫지 못합니까?’와 ‘조심하십시오’는 현대 표준어의 격식 있는 직접 발화로 자연스럽습니다. 각주 표지는 해당 표현 뒤에 두어 적용 범위를 분명히 했습니다.
