  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], "If anyone wants to come after me, let him deny himself and take up his cross and follow me."
translation:
  language: ko
  text: 그때 예수께서 제자들에게 말씀하셨습니다. “누구든지[a] 나를 따라오고자 하면, 자신을 부인하고 자기 십자가를 지고 나를 따라야 합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 ‘누구든지’에 이어 단수 남성형을 사용하지만, 여기서는 일반적으로 사람을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπαρνησάσθω ἑαυτὸν
  english_pob_choice: let him deny himself
  chosen_korean: 자기 자신을 부인하고
  alternatives_korean:
  - 자기 자신을 거부하고
  lexicon: BDAG
  rationale: ἀπαρνέομαι의 명령형. 한국 성경 정착어 「부인하다」가 자기에 대한 단호한 거부의 의미를 살린다.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  english_pob_choice: take up his cross
  chosen_korean: 자기 십자가를 지고
  lexicon: BDAG
  rationale: αἴρω는 「들다·짊어지다」. 한국어에서는 「짊어지다」보다 「지다」가 더 자연스럽고 한국 성경 정착어이다.
