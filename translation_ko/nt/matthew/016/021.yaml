  source_fidelity: 본문의 ‘예루살렘에 올라가’는 ἀπελθεῖν(‘가다’)보다 지형적·전통적 뉘앙스를 더하며, ἐγερθῆναι의 수동태가 ‘살아나야 한다’에서 드러나지 않습니다. 또한 δεῖ가 뒤의 모든 부정사에 걸리는 필연성을 한국어 문장에서도 분명히 하는 편이 좋습니다.
