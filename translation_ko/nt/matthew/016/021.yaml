  to: 그때부터 예수께서 자기 제자들에게 자신이 반드시 예루살렘으로 가셔서 장로들과 대제사장들과 서기관들에게서 많은 고난을 받으시고[a], 죽임을 당하시며, 사흘째 되는 날에 일으킴을 받으셔야 한다는 것을 보여 주기 시작하셨습니다.[b][c]
  rationale: ‘가다’로 ἀπελθεῖν을 직접 옮기고, δεῖ의 필연성이 병렬된 행위 전체에 미치도록 ‘반드시 … 하셔야 한다’로 구성했습니다. ἐγερθῆναι는 수동형을 본문에서 ‘일으킴을 받으셔야 한다’로 보존했습니다. 각주 표지는 해당 어구와의 연결이 명확하도록 재배치했습니다.
