  terminology: ‘빵’, ‘광주리’는 현대 표준어로 적절합니다. ‘오천 명을 먹인’은 τῶν πεντακισχιλίων가 가리키는 오천 명 급식 사건을 자연스럽게 드러내며, 교파적 해석을 더하지 않습니다.
