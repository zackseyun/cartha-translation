  terminology: 「가이사랴 빌립보」와 「인자」는 한국어 성경에서 널리 정착한 용어이며 유지하는 것이 적절합니다. 각주도 「인자」의 의미를 설명하도록 바로잡아야 합니다. 현 초안의 각주는 표지 b가 문장 내에서 가리키는 대상과 연결은 되지만, 영어 감사 기록의 표지 배정과 달리 발화 동사에 관한 표지가 아니라 「인자」에 관한 설명으로 쓰이고 있어, 그 내용을 더 정확하고 자연스럽게 다듬습니다.
