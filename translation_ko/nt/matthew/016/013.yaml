  source_fidelity: 본문의 지명 「가이사랴 빌립보」와 「인자」는 원문의 Καισαρείας τῆς Φιλίππου 및 τὸν υἱὸν τοῦ ἀνθρώπου를 정확히 반영합니다. 다만 「물어 말씀하셨습니다」는 ἠρώτα λέγων을 지나치게 직역하여 한국어에서는 동작이 중복되어 들립니다. 직접 인용을 이끄는 「이렇게 물으셨습니다」가 원문의 질문과 발화의 관계를 자연스럽고 충실하게 나타냅니다.
