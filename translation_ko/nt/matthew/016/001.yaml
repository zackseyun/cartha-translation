  to: 그리고 바리새인들과 사두개인들이 다가와 그를 시험하며[a] 그들에게 하늘에서 온 표적을 보여 달라고 그에게 청했습니다.
  rationale: 현재분사의 상과 문장 내 수식 관계를 보존하도록 ‘그를 시험하며’로 고치고, 각주를 해당 표현에 붙였습니다. 표적의 출처를 나타내는 전치사구는 불필요한 진행성을 피하여 ‘하늘에서 온 표적’으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
