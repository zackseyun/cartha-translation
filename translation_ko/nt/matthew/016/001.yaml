    issue: ‘시험하려고’가 πειράζοντες를 목적 표현으로 바꾸고, 각주 표지가 문장 끝에 있어 해당 어휘에 직접 연결되지 않습니다.
    rationale: 원문은 ‘그를 시험하며/시험하면서’라는 동반 상황의 현재분사입니다. 대안 번역 각주는 해당 표현 바로 뒤에 붙여야 합니다.
  - severity: low
    issue: ‘하늘로부터 오는 표적’의 ‘오는’은 원문에 없는 진행·도래의 뉘앙스를 더할 수 있습니다.
    rationale: ἐκ τοῦ οὐρανοῦ는 표적의 출처를 나타내므로 ‘하늘에서 온 표적’이 더 직접적입니다.
  - severity: low
    issue: 기존 각주의 ‘그를 시험에 빠뜨리려고’는 πειράζοντες의 가능한 대안으로 자연스럽지 않습니다.
    rationale: ‘유혹하며’는 어휘적 대안이지만, ‘시험에 빠뜨리려고’는 한국어에서 의미가 어색하고 원문의 직접적 대안도 아닙니다.
