review_pass:
  verdict: revise
  source_fidelity: 원문의 현재분사 πειράζοντες는 청원의 목적을 나타내는 부정사라기보다 그들이 예수를 시험하는 태도로 요청했음을 나타냅니다. 또한 ἐκ τοῦ οὐρανοῦ는 표적의 출처를 가리키므로 ‘하늘에서 온 표적’으로 옮겼습니다.
  naturalness: ‘그를 시험하며’와 ‘그들에게 … 보여 달라고 그에게 청했습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 누가 누구에게 요청했는지도 분명히 합니다.
  terminology: ‘바리새인들’, ‘사두개인들’, ‘표적’, ‘하늘’은 한국어 성경에서 널리 쓰이며 본문의 어휘 범위를 보존합니다. ‘시험하며’는 적대적 뉘앙스를 보존하되 ‘함정에 빠뜨리다’처럼 해석을 본문에 넣지 않습니다.
  issues:
