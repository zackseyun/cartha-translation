revisions:
- from: 「그리고 아침에는 ‘오늘 폭풍우가 오겠다, 하늘이 붉고 흐리다’ 하고 말한다. 너희는 하늘의 모양은 분별할 줄 알면서, 시대의 표적들은 분별할 수 없는 것이다.」[a][b]
  to: 「또 아침에는 ‘오늘은 궂은 날씨가 되겠습니다. 하늘이 붉고 어둡기 때문입니다’ 하고 말합니다. 너희는 하늘의 모습[a]은 분별할 줄 알면서도 시대의 표적[b]은 분별하지 못합니다.」
  rationale: ‘궂은 날씨’로 χειμών의 일반적 기상 의미를 보존하고, ‘… 때문입니다’로 γάρ의 인과 관계를 반영했습니다. ‘어둡다’는 στυγνάζων의 음울하고 어두운 뉘앙스를 간결하게 살립니다. ‘시대의 표적’은 해석상 열려 있는 καιροί의 의미를 좁히지 않으며, 각주 표지는 각각의 관련 본문 어구에 배치했습니다.
