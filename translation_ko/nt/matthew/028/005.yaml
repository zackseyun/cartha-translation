base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
  footnotes:
  - marker: a
    text: 'The Greek explicitly includes ''you'' for emphasis: the reassurance is directed particularly to the women.'
    reason: lexical_alternative
  - marker: b
    text: Or, more compactly, 'Jesus the crucified one' or 'Jesus who was crucified.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 천사가 여자들에게 대답하여 말하였습니다. 「여러분은[a] 두려워하지 마십시오. 나는 여러분이 십자가에 못 박히신 예수를 찾고 있다는 것을 압니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에는 ‘여러분은’에 해당하는 대명사가 명시되어 있어 강조합니다. 이 안심의 말은 특히 여자들에게 향해 있습니다.
    reason: 원문의 명시적 인칭대명사 ὑμεῖς의 강조를 설명합니다.
  - marker: b
    text: 직역하면 ‘십자가에 못 박힌 분이신 예수’ 또는 ‘십자가에 못 박히신 예수’입니다. 그리스어의 완료 수동 분사는 십자가 처형이 이루어진 사실을 가리킵니다.
    reason: τὸν ἐσταυρωμένον의 명사화된 완료 수동분사에 대한 번역 가능성을 제시합니다.
