  to: 말하였습니다. 「그의 제자들이 밤에 와서 우리가 자고 있는 동안 그를 훔쳐 갔다고 말하십시오.」
  rationale: 원문의 현재분사 λέγοντες는 문맥상 선행 서술에 이어지는 발화로 ‘말하였습니다’로 옮기고, 복수 명령 Εἴπατε는 현대 합쇼체 ‘말하십시오’로 반영했습니다. ὅτι가 이끄는 보고 내용은 한국어의 ‘…다고 말하십시오’로 자연스럽게 처리했습니다. αὐτόν은 ‘그를’로 보존하여 ‘시체’라는 설명을 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:44:44Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 내용(제자들이 밤에 와서 그를 훔쳐 갔다는 주장과 경비병들이 자고 있었다는 상황)을 대체로 전달합니다. 그러나 그리스어의 명령 Εἴπατε(복수형 명령법)와 그 내용절 ὅτι의 관계가 인용문 안에서 다소 어색하게 중첩되어 있으며, ‘우리가 자고 있을 동안에’의 위치도 원문의 ‘우리가 자고 있는 동안’이라는 상황을 더 자연스럽게 나타낼 수 있습니다.
  naturalness: ‘말하였습니다, 「…고 말하라.」’는 한국어 문장부호와 인용 구조상 부자연스럽습니다. 서술문을 마친 뒤 직접 명령을 인용하고, 합쇼체 명령형 ‘말하십시오’를 쓰는 것이 현대 표준 한국어의 문체와 지정된 합쇼체에 맞습니다.
  terminology: αὐτόν은 해석적으로 ‘그의 시체’로 확대하지 않고 ‘그를’로 유지했습니다. ‘그의 제자들’도 원문의 소유 관계를 그대로 반영합니다. ‘밤에’는 νυκτός의 시간적 용법을 자연스럽게 옮깁니다.
  issues:
  - severity: medium
    issue: 명령문의 문체와 인용 구조가 부자연스럽습니다.
    rationale: Εἴπατε는 복수형 명령이므로 ‘말하십시오’가 합쇼체에 맞습니다. 또한 ‘말하였습니다,’ 뒤에 다시 ‘…고 말하라’를 넣는 방식보다, 발화 서술 뒤에 명령문을 직접 인용하는 편이 자연스럽고 원문의 발화 구조를 잘 드러냅니다.
  - severity: low
    issue: ‘우리가 자고 있을 동안에’의 어순을 다듬을 필요가 있습니다.
    rationale: ἡμῶν κοιμωμένων은 ‘우리가 자고 있는 동안’이라는 동시 상황을 나타내므로, 이를 도둑질 행위 바로 앞에 두면 한국어에서 더 명료합니다.
  revised_text: 말하였습니다. 「그의 제자들이 밤에 와서 우리가 자고 있는 동안 그를 훔쳐 갔다고 말하십시오.」
