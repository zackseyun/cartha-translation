  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
  footnotes:
  - marker: a
    text: Or 'until the end of the age'; traditionally, 'until the end of the world.' The Greek speaks of the consummation of the age (αἰών), not specifically the physical world.
