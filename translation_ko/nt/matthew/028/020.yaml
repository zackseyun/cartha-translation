review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the teaching/obedience relationship and Jesus’ presence, but ‘세상 끝 날’ renders αἰών as the physical world and adds ‘날’ in a way not supported by the Greek. The source refers to the consummation/end of the age. The Greek present εἰμι is also better represented by a present Korean assurance than by a simple future.
  naturalness: The revised wording uses modern formal-polite 합쇼체 consistently. ‘보십시오’ naturally conveys the emphatic attention marker ἰδού, and ‘언제나’ is idiomatic Korean for the durative force of ‘all the days.’
  terminology: ‘명령한’ preserves the authoritative force of ἐνετειλάμην. ‘이 시대의 끝’ renders αἰών as an age rather than ‘world’ and renders συντέλεια as its end/consummation without imposing a doctrinal interpretation.
  issues:
  - severity: high
    issue: ‘세상 끝 날까지’ translates αἰών as ‘world’ and introduces ‘end days.’
    rationale: The Greek phrase ἕως τῆς συντελείας τοῦ αἰῶνος refers to the end/consummation of the age, not specifically to the physical world or to ‘the last days.’
  - severity: medium
    issue: ‘있을 것이다’ changes the present εἰμι to a simple future.
    rationale: Although a future can be idiomatic in a promise, ‘함께 있습니다’ more directly preserves the Greek present and its continuing assurance.
  revised_text: 「내가 너희에게 명령한 모든 것을 지키도록 그들을 가르치십시오. 그리고 보십시오, 내가 이 시대의 끝까지 너희와 언제나 함께 있습니다.」
  revised_footnotes:
  - marker: a
    text: 그리스어는 ‘세상’(물질 세계)보다 ‘시대’를 뜻하는 말(αἰών)을 사용합니다. 따라서 이 표현은 ‘이 시대의 끝까지’라는 뜻입니다.
    reason: alternative_reading
  revision_rationale: The revision corrects the central lexical error in ‘세상 끝 날’ by rendering αἰών as ‘시대’ and συντέλεια as ‘끝.’ It retains the comprehensive command to teach obedience, gives ἰδού an appropriately emphatic formal-polite rendering, and represents Jesus’ present, continuing presence with ‘함께 있습니다.’
