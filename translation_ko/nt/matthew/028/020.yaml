translation:
  language: ko
  text: 「내가 너희에게 명령한 모든 것을 지키도록 그들을 가르치십시오. 보십시오, 내가 시대가 마칠 때까지 모든 날에 너희와 함께 있습니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘시대의 종결까지.’ 또는 ‘시대의 끝까지.’ 전통적으로는 ‘세상 끝날까지’라고 번역하기도 하지만, 그리스어 αἰών은 여기서 물리적 세계 자체보다 시대 또는 시대적 질서를 가리킵니다.
    reason: alternative_reading
