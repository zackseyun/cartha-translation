review_pass:
  verdict: revise
  source_fidelity: 초안은 διδάσκοντες, τηρεῖν, ἐνετειλάμην의 핵심 뜻을 대체로 반영합니다. 그러나 「세상 끝 날까지」는 αἰῶνος를 물리적 세계로, συντελείας를 단일한 ‘끝 날’로 좁혀 번역하여 원문의 ‘시대의 종결/완성’이라는 표현과 맞지 않습니다. 또한 ἐγὼ ... εἰμι는 현재형이므로 「함께 있을 것이다」보다 현재의 보증을 나타내는 표현이 적절합니다.
  naturalness: 「보아라」는 현대 표준어 합쇼체 요구와 맞지 않으므로 「보십시오」로 고쳤습니다. 「모든 날에」는 πάσας τὰς ἡμέρας의 포괄적·지속적 표현을 비교적 직역적으로 살리면서도 자연스럽습니다.
  terminology: ἐντέλλομαι는 「명령하다」, τηρέω는 「지키다」로 유지했습니다. συντέλεια τοῦ αἰῶνος는 「시대가 마칠 때」로 옮겨 ‘세상의 물리적 종말’로 단정하지 않았습니다.
  issues:
  - severity: high
    issue: 「세상 끝 날까지」
    rationale: τοῦ αἰῶνος는 ‘세상’(κόσμος)이 아니라 ‘시대/시대적 질서’를 가리키며, συντέλεια는 단일한 ‘끝 날’ 자체보다 그 종결 또는 완성을 뜻합니다.
  - severity: medium
    issue: 「내가 ... 함께 있을 것이다」
    rationale: 원문 εἰμι는 현재형입니다. 미래적 지속을 함축하는 문맥이지만, 현재의 약속/현존을 「함께 있습니다」로 보존하는 편이 더 충실합니다.
  - severity: medium
    issue: 「보아라」
    rationale: 요청된 현대 정중 합쇼체와 일치하지 않습니다. ἰδού의 주의 환기 기능은 「보십시오」로 살릴 수 있습니다.
  revised_text: 「내가 너희에게 명령한 모든 것을 지키도록 그들을 가르치십시오. 보십시오, 내가 시대가 마칠 때까지 모든 날에 너희와 함께 있습니다[a].」
  revised_footnotes:
  - marker: a
    text: 직역하면, ‘시대의 종결까지.’ 또는 ‘시대의 끝까지.’ 전통적으로는 ‘세상 끝날까지’라고 번역하기도 하지만, 그리스어 αἰών은 여기서 물리적 세계 자체보다 시대 또는 시대적 질서를 가리킵니다.
    reason: alternative_reading
