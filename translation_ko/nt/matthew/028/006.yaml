  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
  footnotes:
  - marker: a
    text: Or, 'He has risen.' The Greek verb is passive in form ('has been raised'), though English tradition often renders it actively.
    reason: alternative_reading
  - marker: b
    text: Or, 'where he lay' or 'where he had been laid.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「그분은 여기 계시지 않습니다. 말씀하신 대로 일으켜지셨기 때문입니다.[a] 오셔서, 그분께서 누워 계셨던 곳을 보십시오.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살아나셨습니다.’ 그리스어 동사는 수동형입니다(‘일으켜지셨습니다’).
    reason: alternative_reading
  - marker: b
    text: 또는 ‘누우셨던 곳’ 또는 ‘뉘였던 곳.’
    reason: lexical_alternative
