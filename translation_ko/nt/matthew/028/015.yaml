  - severity: low
    issue: τὰ ἀργύρια의 ‘은’ 의미가 본문에서 사라짐
    rationale: ‘돈’도 문맥상 가능하지만, 원문과 영어 감사 기록이 보존한 은의 구체성을 ‘은돈’으로 드러내는 편이 더 충실합니다.
