  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 τὰ ἀργύρια의 구체적인 ‘은’을 ‘돈’으로만 옮기면 원문의 어휘적 뉘앙스가 약해지며, δέ를 인과가 강한 ‘그래서’로 처리한 것은 문맥상 필수적이지 않습니다.
  naturalness: ‘그 지시받은 대로’는 현대 한국어 문장으로 다소 불완전하게 들립니다. ‘지시받은 대로’ 또는 ‘가르침받은 대로’가 자연스럽습니다. 합쇼체 서술은 유지되어야 합니다.
  terminology: Ἰουδαίοις는 이 문맥에서 ‘유대인들 사이에’가 직접적이고 자연스럽습니다. λόγος는 여기서 경비병들이 유포한 설명을 가리키므로 ‘이 이야기’가 가능하며, ‘소문/전언’의 대안은 각주로 보존할 수 있습니다.
