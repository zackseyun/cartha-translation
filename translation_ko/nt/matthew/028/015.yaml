- from: 그래서 그들이 그 돈을 받고 그 지시받은 대로 행하였습니다. 그리고 이 이야기가 오늘날까지 유대인들 사이에 퍼져 있습니다.
  to: 그들은 그 은돈을 받고 지시받은 대로 하였습니다. 이 이야기는 오늘날까지 유대인들 사이에 퍼져 있습니다.[a]
  rationale: 원문의 서술 연결을 과도한 인과 없이 옮기고, 은을 가리키는 ἀργύρια의 구체성을 보존했습니다. ‘지시받은 대로 하였습니다’는 ὡς ἐδιδάχθησαν의 수동 의미와 현대 합쇼체 문체를 자연스럽게 반영합니다. λόγος의 폭넓은 의미는 본문 ‘이 이야기’와 각주의 대안으로 보존했습니다.
