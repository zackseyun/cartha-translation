review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘평안하십시오!’는 χαίρετε의 어휘적 의미와 맞지 않으며, ‘보아라’는 합쇼체 register에 맞지 않습니다. 또한 ‘그에게 경배하였습니다’는 지시 대상이 다소 불필요하게 반복됩니다. 수정문은 ἰδού의 주의 환기, 복수형 인사 χαίρετε, 신체 접촉을 나타내는 ἐκράτησαν αὐτοῦ τοὺς πόδας, 그리고 προσκυνέω의 문맥상 강한 의미를 유지합니다.
  naturalness: ‘그런데 보십시오’와 ‘기뻐하십시오!’는 현대 표준어 합쇼체로 자연스럽게 읽히며, 서술의 격식을 유지합니다. ‘그분의 발을 붙잡고 그분께 경배하였습니다’는 한국어 문장 연결과 높임 표현에 적절합니다.
  terminology: ‘경배하다’는 이 부활 서사에서 προσεκύνησαν을 옮기는 데 적절하지만, 몸을 굽히거나 경의를 표한다는 의미 범위도 있으므로 각주로 밝혔습니다. 예수에 대한 높임은 ‘그분’ 및 서술 높임으로 일관되게 처리했습니다.
  issues:
  - severity: medium
    issue: ‘평안하십시오!’가 χαίρετε를 잘못 옮김
    rationale: χαίρετε는 문자적으로 ‘기뻐하십시오’인 복수 명령형이며 이 문맥에서는 인사말로 기능합니다. ‘평안하십시오’는 본문에 없는 평안의 의미를 도입합니다.
  - severity: medium
    issue: ‘보아라’가 목표 register와 불일치
    rationale: 현대 formal-polite 합쇼체에서 ‘보아라’는 해라체입니다. ἰδού의 주의 환기 기능은 ‘보십시오’로 유지할 수 있습니다.
  - severity: low
    issue: 문장부호와 인용 연결이 부자연스러움
    rationale: ‘말씀하셨습니다,’보다 마침표 뒤 직접 인용을 쓰는 것이 현대 한국어 문장 규범과 읽기 흐름에 맞습니다.
  revised_text: 그런데[a] 보십시오, 예수께서 그들을 만나셔서 말씀하셨습니다. “기뻐하십시오!” 그들이 다가가 그분의 발을 붙잡고 그분께 경배하였습니다.[b]
  revised_footnotes:
  - marker: a
    text: 또는 “보라.” 그리스어 ἰδού는 주의를 환기하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그분께 절하였다” 또는 “그분께 경의를 표하였다.” 그리스어 προσεκύνησαν은 엎드리거나 경의를 표하는 행위를 뜻할 수 있습니다. 여기서는 부활 문맥상 ‘경배하였다’로 옮겼습니다.
    reason: alternative_reading
  revision_rationale: χαίρετε를 ‘기뻐하십시오!’로 바로 옮기되, 관습적 인사말로도 쓰인다는 점을 본문 밖 각주에서 보완할 수 있습니다. ἰδού는 생략하지 않고 합쇼체 ‘보십시오’로 옮겼습니다. προσκυνέω는 본문 문맥을 반영하여 ‘경배하다’로 번역하되, 해석상 가능한 의미 범위를 각주에 보존했습니다.
