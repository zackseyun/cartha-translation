review_pass:
  verdict: revise
  source_fidelity: 초안의 사건 순서와 ‘발을 붙잡음’은 원문에 충실합니다. 그러나 ἰδού는 서술 독자의 주의를 환기하는 표현이므로 ‘보아라’보다 합쇼체에 맞는 ‘보십시오’가 적절하며, Χαίρετε를 ‘평안하십시오’로 옮기면 그리스어의 일반 인사말 기능과 어휘적 연관이 충분히 드러나지 않습니다.
  naturalness: ‘보아라’는 목표 문체인 현대 합쇼체와 맞지 않습니다. ‘그런데 보십시오’와 ‘안녕하십니까!’는 현대 표준 한국어의 정중한 서술 및 인사 표현으로 자연스럽습니다.
  terminology: προσεκύνησαν은 부활 맥락에서 ‘경배하였습니다’로 번역할 수 있으나, 절 자체만으로 동작의 의미 범위를 완전히 좁히지 않도록 ‘절하다/경의를 표하다’라는 대안을 각주로 남깁니다.
  issues:
  - severity: medium
    issue: ‘보아라’의 문체 불일치
    rationale: 명령형 반말이므로 현대 공식-정중체(합쇼체) 번역의 서술 register와 일치하지 않습니다.
  - severity: medium
    issue: Χαίρετε를 ‘평안하십시오’로 번역
    rationale: χαίρετε는 문자적으로 복수 명령형이지만 이 문맥에서는 통상적인 인사말입니다. ‘평안’은 히브리어 샬롬 계열의 의미를 연상시켜 그리스어 표현의 어휘적 의미와 기능을 정확히 반영하지 못합니다.
  revised_text: 그런데 보십시오, 예수께서 그들을 만나시며 말씀하셨습니다. “안녕하십니까!” 그러자 그들이 다가와 그의 발을 붙잡고 그에게 경배하였습니다[b]
  revised_footnotes:
  - marker: a
    text: 또는 “기뻐하십시오!” 그리스어 χαίρετε는 문자적으로 복수 명령형이지만, 여기서는 인사말로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그에게 절하였습니다” 또는 “그에게 경의를 표하였습니다.” 그리스어 προσεκύνησαν은 몸을 엎드리거나 경의를 표하는 뜻을 나타낼 수 있으며, 여기서는 부활 문맥상 ‘경배하였습니다’로 번역할 수 있습니다.
    reason: alternative_reading
  revision_rationale: 원문의 주의 환기 표현, 정중한 인사말의 기능, 그리고 προσκυνέω의 의미 범위를 반영하도록 수정했습니다. 각주 a를 보존하려면 본문 인사말 뒤에 [a] 표지를 두어야 합니다.
