  source_fidelity: 원문은 큰 지진이 일어났음을 말한 뒤, γάρ로 주의 천사가 하늘에서 내려와 다가가 돌을 굴려 내고 그 위에 앉아 있었음을 연결합니다. 초안의 ‘내려와 와서’는 προσέρχομαι(다가가다)를 정확히 옮기지 못하고 중복됩니다. 영어 감사 기록의 ‘came up’은 그리스어 원문보다 ‘다가가’에 더 잘 맞는 번역이 아니므로 따르지 않았습니다.
