  terminology: ‘주의 천사’, ‘하늘’, ‘돌’은 원문의 용어와 한국어 성경 문체에 무리 없이 대응합니다. ‘굴려 내고’는 ἀπεκύλισε의 ‘굴려 치우다/굴려 내다’의 뜻을 자연스럽게 반영합니다.
