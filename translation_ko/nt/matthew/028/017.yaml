  source_fidelity: 그리스어의 시간적 분사 ἰδόντες는 ‘보았을 때’로 자연스럽게 드러내는 것이 좋습니다. προσεκύνησαν은 부활하신 예수께 드린 행위라는 문맥에서 ‘경배했습니다’가 적절합니다. οἱ δὲ는 앞의 집단 안 일부를 가리키므로 ‘그들 중 몇몇은’으로 명시하는 편이 충실합니다. ἐδίστασαν의 ‘의심하다/주저하다/망설이다’ 범위는 본문과 각주로 보존해야 합니다.
  naturalness: 초안의 ‘그리고 그들이 그를 보고 그에게’는 ‘그’의 반복과 접속이 다소 어색하며, ‘어떤 자들’은 현대 표준어 성경 문체에서는 덜 자연스럽습니다. ‘그들이 그분을 보았을 때 … 그들 중 몇몇은’이 현대적이고 합쇼체에 맞습니다.
  terminology: 예수를 가리킬 때 ‘그분’을 사용하고, προσκυνέω는 ‘그분께 경배했습니다’로 옮깁니다. διστάζω는 본문에서 전통적이고 직접적인 ‘의심했습니다’를 유지하되, 그 불확실성·망설임의 뉘앙스를 각주로 밝협니다.
  issues:
  - severity: low
    issue: 시간 관계와 접속 표현
    rationale: ‘그리고 그들이 그를 보고’보다 ἰδόντες의 시간적 기능을 반영한 ‘그들이 그분을 보았을 때’가 자연스럽고 명료합니다.
  - severity: medium
    issue: οἱ δὲ의 부분 집단 표현
    rationale: ‘어떤 자들은’도 가능하지만, 앞서 언급된 이들 가운데 일부라는 대조·부분성을 ‘그들 중 몇몇은’으로 드러내는 편이 원문에 더 가깝습니다.
  - severity: low
    issue: διστάζω의 의미 범위에 대한 각주 누락
    rationale: ‘의심했습니다’는 가능하지만, 이 말이 확고한 불신보다 망설임이나 흔들림을 뜻할 수도 있으므로 원문의 열린 뉘앙스를 각주로 보존해야 합니다.
  revised_text: 그들이 그분을 보았을 때, 그분께 경배했습니다. 그러나 그들 중 몇몇은 의심했습니다[a].
  revised_footnotes:
