  source_fidelity: 그리스어의 ἰδόντες는 '보고'로, προσεκύνησαν은 부활하신 예수께 드린 행위라는 문맥에 맞게 '경배하였습니다'로 옮기는 것이 충실합니다. οἱ δὲ는 앞선 집단 안의 일부를 대조하므로 '몇몇은'이 적절합니다. ἐδίστασαν의 '의심하다'는 가능하나, 머뭇거림/망설임의 뉘앙스를 각주로 보존해야 합니다.
  naturalness: 초안의 '어떤 자들은'은 현대 표준어 합쇼체 성경 문장으로 다소 부자연스럽고 구식입니다. '몇몇은'이 더 자연스럽습니다. '그를/그에게'보다 문맥상 존칭 대명사 '그분을/그분께'가 현대 한국어에서 자연스럽습니다.
  terminology: '''경배하였습니다''는 προσκυνέω의 문맥상 강도를 적절히 반영합니다. ''의심하였습니다''는 본문에 두되, διστάζω가 확정된 불신보다 망설임이나 동요를 가리킬 수도 있음을 각주로 제시합니다.'
  issues:
  - severity: medium
    issue: διστάζω의 대안적 뉘앙스를 보존하는 각주가 없습니다.
    rationale: 원어는 '의심하다' 외에 '망설이다, 흔들리다'의 뜻을 가질 수 있으므로, 번역이 그 의미를 단정하지 않도록 각주가 필요합니다.
  - severity: low
    issue: ‘어떤 자들은’이 현대 한국어 문체에서 다소 부자연스럽습니다.
    rationale: οἱ δὲ가 나타내는 집단 내 일부의 대조는 ‘몇몇은’이 더 자연스럽고 정확하게 드러냅니다.
  revised_text: 그들이 그분을 보고 그분께 경배하였으나, 몇몇은 의심하였습니다.ᵃ
  revised_footnotes:
  - marker: ᵃ
    text: 또는 ‘망설였습니다’ 또는 ‘흔들렸습니다’. 그리스어는 확정된 불신이라기보다 주저하거나 확신하지 못하는 상태를 가리킬 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 현대 표준어 합쇼체에 맞추어 ‘어떤 자들’을 ‘몇몇’으로 고치고, 부활 문맥에서 προσκυνέω의 의미를 ‘경배하였습니다’로 유지했습니다. 또한 ἐδίστασαν의 의미 범위를 각주로 보존하여 본문의 해석상 모호성을 과도하게 좁히지 않았습니다.
