  source_fidelity: 그리스어의 두 미래 동사(‘일어날 것이다’, ‘미혹할 것이다’)와 주어·목적어의 수량 표현을 충실히 옮겼습니다. ‘일어나’는 ἐγερθήσονται의 이 문맥상 자연스러운 ‘등장하다/일어나다’의 뜻을 잘 반영하며, 불필요하게 부활의 의미를 부여하지 않습니다. ‘미혹할 것입니다’는 πλανήσουσιν의 넓은 의미를 보존합니다.
  naturalness: 표준어 현대 합쇼체로 자연스럽고 간결합니다. ‘많은 사람을’은 집합적 단수 목적어로 자연스러우며, 문맥상 ‘많은 사람들을’로 고칠 필요가 없습니다.
  terminology: ‘거짓 예언자들’은 ψευδοπροφῆται에 대한 정확하고 통용되는 성경적 표현입니다. ‘미혹하다’도 교리적·도덕적·영적 측면을 특정하지 않아 원문의 포괄성을 유지합니다.
