  source_fidelity: 원문의 γάρ는 앞 문맥과의 연결을 암시하는데, 한국어에서는 문장 흐름상 별도 접속사 없이 자연스럽게 처리될 수 있습니다. ἐγερθήσεται … ἐπὶ …의 적대적 관용구는 “민족이 민족을 거슬러, 나라가 나라를 거슬러 일어날 것”으로 충실히 옮겨졌습니다. λιμοὶ, σεισμοὶ, κατὰ τόπους도 각각 “기근”, “지진”, “곳곳에”로 정확합니다.
  naturalness: 표준어 현대 한국어이며 합쇼체 종결인 “있을 것입니다”가 일관됩니다. “거슬러 일어나다”는 다소 문어적이지만 성서의 엄숙한 문맥에 자연스럽고, 현대 독자에게도 이해됩니다.
  terminology: ἔθνος와 βασιλεία의 병렬을 “민족”과 “나라”로 구별하여 보존했고, 기근·지진 등 핵심 용어도 적절합니다. 특정 교리적 해석을 덧붙이지 않았습니다.
