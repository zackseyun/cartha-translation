  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
  footnotes:
  - marker: a
    text: Or 'your presence' or 'your arrival' for 'your coming.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the consummation of the age'; traditionally, 'the end of the world.'
    reason: alternative_reading
translation:
  language: ko
  text: 그분이 감람산에 앉아 계실 때, 제자들이 따로 그분께 와서 말하였습니다. 「우리에게 말씀해 주십시오. 이런 일들이 언제 있겠으며, 주님의 오심[a]과 시대의 끝[b]의 표적은 무엇이겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘임재’ 또는 ‘도래’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시대의 완성’. 전통적으로 ‘세상 끝’.
    reason: alternative_reading
