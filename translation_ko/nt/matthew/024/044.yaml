    text: 또는 “너희가 생각하지 않는 시각에.” 그리스어 동사는 “생각하다,” “여기다,” 또는 문맥상 “예상하다”라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s causal sequence and ongoing command while replacing an unnatural and temporally misleading expression with idiomatic Korean. The footnote preserves the lexical range of δοκεῖτε without forcing a single nuance beyond the context.
