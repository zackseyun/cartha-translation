review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential connection, the command to readiness, the title “Son of Man” (인자), and the future coming. However, “너희가 생각하지 않은 시각” is not a natural Korean rendering of ᾗ οὐ δοκεῖτε ὥρᾳ and can suggest a past failure to think rather than an hour that is not expected.
  naturalness: “준비하고 있으십시오” is an acceptable modern formal-polite rendering of the ongoing imperative. Replacing “생각하지 않은 시각” with “예상하지 못하는 시각” makes the warning idiomatic and clear in standard Korean.
  terminology: “인자” is the established Korean biblical rendering of ὁ υἱὸς τοῦ ἀνθρώπου and should be retained. “예상하지 못하는” appropriately communicates the contextual force of δοκεῖτε while a note preserves the more literal lexical alternative.
  issues:
  - severity: medium
    issue: “너희가 생각하지 않은 시각” is awkward and semantically imprecise.
    rationale: The Greek present δοκεῖτε means “you think/suppose,” and in this context naturally conveys expectation. The Korean past adnominal “생각하지 않은” changes the temporal sense and is not idiomatic with “시각.”
  revised_text: 그러므로 너희도 준비하고 있으십시오. 인자는 너희가 예상하지 못하는 시각에 오실 것이기 때문입니다.[a]
  revised_footnotes:
