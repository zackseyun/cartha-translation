  naturalness: ‘마음속에 … 하고’보다 ‘마음속으로 … 말하면’이 현대 표준어 문장으로 더 자연스럽습니다. 본문이 다음 절로 이어지는 조건절이므로 끝의 쉼표를 유지했습니다.
