translation:
  language: ko
  text: 그러나 만일 그 악한 종[1]이 마음속으로 ‘내 주인[2]이 오는 것이 늦어진다’라고 말하면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 또는 ‘그 악한 노예’. 그리스어 δοῦλος는 문맥에 따라 ‘종’ 또는 ‘노예’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: '2'
    text: 또는 ‘내 주’. 여기서는 비유의 가정 내 관계를 나타내므로 ‘주인’으로 옮겼습니다. 그리스어는 κύριος입니다.
    reason: lexical_alternative
