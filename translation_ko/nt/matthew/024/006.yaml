id: MAT.24.6
reference: Matthew 24:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
  footnotes:
  - marker: a
    text: Or 'rumors of wars.' The Greek phrase can denote reports, news, or rumors.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 여러분은 전쟁들과 전쟁들에 관한 소식[ㄱ]을 듣게 될 것입니다. 놀라지 않도록 주의하십시오. 반드시 이런 일이 일어나야 합니다. 그러나 아직 끝은 아닙니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 또는 “전쟁들에 관한 소문.” 그리스어는 전쟁에 관한 소식, 보고, 또는 소문을 뜻할 수 있습니다.
    reason: lexical_alternative
