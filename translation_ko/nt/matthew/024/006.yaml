revisions:
- from: 또 너희는 전쟁들과 전쟁의 소문들을 듣게 될 것입니다. 보아라, 너희는 두려워하지 마십시오. 반드시 그런 일이 있어야 하지만, 끝은 아직 아닙니다.
  to: 또한 여러분은 전쟁들과 전쟁들에 관한 소식[ㄱ]을 듣게 될 것입니다. 놀라지 않도록 주의하십시오. 반드시 이런 일이 일어나야 합니다. 그러나 아직 끝은 아닙니다.
  rationale: The revision corrects the inconsistent speech level, renders the warning idiomatically, and uses the neutral "소식" for ἀκοή while preserving "소문" in a footnote. The short declarative clauses reflect the Greek’s emphasis and retain the ambiguity and breadth of "the end."
