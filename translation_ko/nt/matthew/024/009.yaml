  source_fidelity: 원문의 시간 부사(Τότε), ‘넘겨주다’(παραδώσουσιν), 환난/고난(εἰς θλῖψιν), 죽임, 모든 민족에게서 받는 미움, 그리고 ‘내 이름 때문에’라는 인과관계가 충실히 반영되었습니다. ‘환난’은 이 문맥의 θλῖψις가 지닌 박해·고난 및 종말론적 무게를 과도하게 해석하지 않고 잘 보존합니다.
  naturalness: ‘그때에 … 것입니다’는 현대 표준어 합쇼체로 자연스럽고, 예언적 진술의 흐름도 분명합니다. ‘모든 민족에게 미움을 받을 것입니다’도 한국어 성경 문체에서 자연스럽습니다.
  terminology: ‘환난’, ‘내 이름 때문에’, ‘모든 민족’은 핵심 용어를 적절히 옮깁니다. 특히 ἔθνη를 ‘이방인’으로 좁히지 않고 ‘모든 민족’으로 번역한 것은 문맥상 적절합니다.
