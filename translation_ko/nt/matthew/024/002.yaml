  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
  footnotes:
  - marker: a
    text: Or “will be destroyed.” The Greek verb can denote dismantling or demolition; “thrown down” preserves the image of stones cast from their place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그분이 그들에게 대답하여 말씀하셨습니다. “너희가 이 모든 것을 보지 못합니까? 진실로 내가 너희에게 말합니다. 여기에서 돌 하나도 다른 돌 위에 남아 있지 않고, 모두 무너질 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “허물어질 것입니다” 또는 “철거될 것입니다.” 그리스어 동사는 건축물이 무너지거나 허물어지는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
