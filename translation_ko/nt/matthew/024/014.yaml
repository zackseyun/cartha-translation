revisions:
- from: 그리고 이 나라의 좋은 소식이 모든 민족에게 증언이 되기 위해 온 세상에 선포될 것이며, 그때에 끝이 올 것입니다.
  to: 또 이 하나님 나라의 기쁜 소식이 모든 민족에게 증언하기 위하여 온 세상에 두루 선포될 것이며, 그때에 끝이 올 것입니다.
  rationale: The revision removes the Korean ambiguity of “이 나라,” preserves the established theological referent of “the kingdom” in context, and retains the source’s broad geographical and ethnic scope without importing a particular eschatological interpretation. “두루” makes the distributive force of ἐν ὅλῃ τῇ οἰκουμένῃ explicit in idiomatic Korean.
  reviewer_model: gpt-5.6-terra
