  - severity: medium
    issue: '''어떤 육체도''는 부자연스럽고 문맥상 관용 의미를 충분히 전달하지 못합니다.'
    rationale: πᾶσα σάρξ는 여기서 육체 일반이 아니라 사람, 곧 아무도 살아남지 못함을 가리키는 셈어적/성경적 관용 표현입니다. '아무도'가 현대 한국어에서 자연스럽습니다.
