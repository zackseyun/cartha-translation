  to: 그리고 그 날들이 단축되지 않았더라면 아무도 구원받지 못했을 것입니다. 그러나 택하신 자들을 위하여 그 날들은 단축될 것입니다.
  rationale: 반사실 조건문의 시간 관계를 바로잡고, '모든 육체'라는 관용구를 자연스러운 한국어로 옮겼습니다. σῴζω는 '구원받다'로 유지하여 생존과 구원의 의미 가능성을 불필요하게 좁히지 않았으며, ἐκλεκτοί도 해석을 확장하지 않고 '택하신 자들'로 보존했습니다.
