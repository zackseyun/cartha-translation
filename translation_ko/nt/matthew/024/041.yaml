    text: 그리스어는 단지 ‘한 여자는 데려감을 당하고 한 여자는 남겨진다’라고만 하며, 여기서는 데려감을 당하는 것이 구원을 위한 것인지 심판을 위한 것인지를 밝히지 않습니다.
    reason: alternative_reading
