  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
  footnotes:
  - marker: a
    text: Or 'Two women grinding at the mill'; the Greek participle is feminine plural, making the subjects specifically women.
    reason: lexical_alternative
  - marker: b
    text: Or 'at the handmill' or 'with the millstone'; the Greek can refer to the mill apparatus more specifically.
    reason: lexical_alternative
  - marker: c
    text: The Greek says simply 'one is taken and one is left,' without specifying here whether the taking is for salvation or judgment.
    reason: alternative_reading
