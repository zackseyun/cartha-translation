  verdict: revise
  source_fidelity: The draft accurately conveys the master's unexpected arrival and preserves the temporal day/hour pairing. However, 종 ('servant') softens δοῦλος in this master–slave household setting, where 'slave' is contextually salient. The omitted explicit subject in the second temporal clause can also allow momentary ambiguity in Korean.
  naturalness: The clause is generally natural and appropriately retains an open, continuing ending corresponding to the Greek comma and the continuation in the next verse. Repeating 그가 makes both 'does not expect' and 'does not know' unambiguously refer to the slave.
  terminology: 주인 is appropriate for κύριος as a human household superior in this parable. 노예 is the clearer Korean equivalent for δοῦλος here; it preserves the socially bonded status without importing a divine-title sense into 주인.
  issues:
