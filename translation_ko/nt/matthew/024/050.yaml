    issue: 종 is used for δοῦλος.
    rationale: 종 can denote a servant or attendant and does not reliably express the enslaved status signaled by δοῦλος in the immediate κύριος–δοῦλος household contrast. 노예 better preserves the source's social relation.
  - severity: low
    issue: The second relative temporal clause lacks an explicit subject.
    rationale: In '그가 예상하지 못한 날, 알지 못하는 시각,' the understood subject is recoverable, but adding 그가 preserves the Greek's parallel clauses and avoids ambiguity about who does not know.
  revised_text: 그 노예의 주인은 그가 예상하지 못한 날, 그가 알지 못하는 시각에 와서,
