  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Now learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
  footnotes:
  - marker: a
    text: Or 'the lesson' or 'the illustration' for 'the parable.'
    reason: lexical_alternative
  - marker: b
    text: Or 'sprouts leaves.'
    reason: lexical_alternative
  - marker: c
    text: θέρος can denote 'summer' and, in some contexts, the harvest season; here the seasonal sense best fits the fig tree imagery.
    reason: lexical_alternative
