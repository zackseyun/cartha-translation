review_pass:
  verdict: revise
  source_fidelity: The initial '이제' gives δέ a temporal force ('now') not explicit in the Greek; it should be omitted. The remaining clauses broadly convey the Greek sequence and seasonal image.
  naturalness: The draft mixes the formal imperative '배우십시오' with non-honorific '너희는 … 압니다.' In modern formal-polite Korean, consistent addressee treatment is preferable. '무화과나무에게서' naturally expresses the source of the lesson, and '부드러워지고' is clear contemporary botanical wording for ἁπαλός.
  terminology: '''비유'' appropriately renders παραβολή, and ''여름'' appropriately renders θέρος in this context. No theological interpretation should be added to the fig-tree image.'
  issues:
  - severity: medium
    issue: Unwarranted temporal marker
    rationale: '''이제'' normally means ''now,'' whereas δέ is a mild connective here and does not require a temporal rendering.'
  - severity: medium
    issue: Inconsistent formal-polite address
    rationale: '''배우십시오'' is 합쇼체, but ''너희는 … 압니다'' is non-honorific and stylistically discordant in the requested register.'
  - severity: low
    issue: Expression of learning source
    rationale: '''무화과나무에게서'' more idiomatically conveys ἀπὸ τῆς συκῆς (''from the fig tree'') than the locative-sounding ''무화과나무에서.'''
  revised_text: 무화과나무에게서 그 비유를 배우십시오. 그 가지가 부드러워지고 잎이 돋으면, 여러분은 여름이 가까운 것을 아십니다.
