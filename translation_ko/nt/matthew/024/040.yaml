review_pass:
  verdict: revise
  source_fidelity: ‘두 사람’ correctly reflects δύο with the masculine reference appropriately made explicit in this paired male-field scene. The draft’s ‘데려가심을 받고’ introduces an honorific element not present in παραλαμβάνεται and is an unnecessarily marked passive construction. The revision keeps the neutral contrast of being taken and being left, without deciding whether the taking is for rescue or judgment.
  naturalness: The mixed construction ‘있을 것이니 ... 남겨질 것입니다’ is stylistically uneven, and ‘데려가심을 받고’ is unnatural in modern formal Korean. Parallel future passive forms are clear and natural enough in this context.
  terminology: ‘밭’ is an appropriate rendering of ἀγρός. ‘데려가질 것이다’ and ‘남겨질 것이다’ preserve the passive contrast and avoid the adverse or doctrinal implications that ‘당하다,’ ‘버려지다,’ or ‘휴거되다’ could introduce.
  issues:
  - severity: medium
    issue: ‘데려가심을 받고’ contains an unsupported honorific and is stylistically marked.
    rationale: The honorific -시- can imply respect for an unexpressed agent, which the Greek does not mark. It also makes the clause less idiomatic than a direct passive.
  - severity: low
    issue: The sentence endings are not fully parallel.
    rationale: ‘있을 것이니’ followed by ‘남겨질 것입니다’ mixes connective and final styles. Two complete, parallel sentences better suit modern formal-polite Korean.
  revised_text: 그때 두 사람이 밭에 있을 것입니다. 한 사람은 데려가질 것이고, 한 사람은 남겨질 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘한 사람은 데려가질 것입니다.’ 여기서 ‘데려가다’라는 동사 자체는 그 데려감이 구원을 위한 것인지 심판을 위한 것인지를 스스로 명시하지 않습니다.
    reason: lexical_alternative
  revision_rationale: Revised the unsupported honorific nominal-passive expression to a neutral passive and regularized the sentence structure. The footnote preserves the source and English audit trail’s lexical and theological ambiguity concerning παραλαμβάνεται.
