  source_fidelity: 원문의 τότε, δύο(남성형 문맥), ἐν τῷ ἀγρῷ 및 두 사람의 대조를 대체로 충실히 옮겼습니다. 그러나 παραλαμβάνεται는 단순히 ‘데려가심을 받다’라고 하기보다 중립적으로 ‘데려가다’로 옮기는 편이 자연스럽고, 원문이 구원이나 심판 어느 쪽인지 확정하지 않는 여지를 보존합니다.
  naturalness: ‘데려가심을 받고’는 ‘-심’이 불필요한 존대·경어의 뉘앙스를 만들어 내며, 행위자를 하나님으로 특정하는 듯하게 들릴 수 있습니다. 또한 이 문맥의 현대 표준어 합쇼체로는 다소 부자연스럽습니다. 능동형에 미표시 행위자를 둔 ‘데려갈 것이고’가 자연스럽습니다.
  terminology: ‘두 남자’는 이 절의 남성형 수사 및 다음 절의 여성 병행 예시를 한국어에서 드러내는 안전한 선택입니다. ‘남겨 둘’은 ἀφίεται의 중립적 ‘남겨지다’를 자연스럽게 전달하며, ‘버리다’나 ‘남겨 두고 가다’처럼 의미를 강화하지 않습니다.
  issues:
  - severity: medium
    issue: ‘데려가심을 받고’의 부적절한 존대 명사화
    rationale: 원문의 수동태는 행위자를 명시하거나 존대하지 않습니다. ‘-심’은 존대의 함의를 더할 수 있고, ‘데려가심을 받다’도 현대 한국어로 매끄럽지 않습니다.
  revised_text: 그때에 두 남자가 밭에 있을 것인데, 한 사람은 데려갈 것이고 한 사람은 남겨 둘 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “한 사람은 데려가질 것이고.” ‘데려가다’라는 말 자체는 그 데려감이 구원인지 심판인지를 확정하지 않습니다.
    reason: lexical_alternative
  revision_rationale: 수동형을 기계적으로 명사화하면서 생긴 부자연스러운 존대 뉘앙스를 제거했습니다. ‘데려갈 것이고/남겨 둘 것입니다’는 한국어에서 행위자를 밝히지 않은 채 원문의 대조와 해석상 중립성을 보존합니다. 각주에는 παραλαμβάνεται의 해석상 중립성을 명시했습니다.
