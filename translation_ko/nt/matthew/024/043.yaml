  source_fidelity: 원문의 조건문(‘알았더라면 … 했을 것입니다’), 밤의 ‘경점/야경’(φυλακή), 깨어 있음(ἐγρηγόρησεν), 그리고 침입을 허용하지 않음(οὐκ ἂν εἴασεν)을 보존해야 합니다. 초안은 대체로 뜻을 전달하지만 ‘어느 야경 시각’은 현대 표준 한국어에서 부자연스럽고, ‘집을 뚫지 못하게’는 원문의 수동 표현과 침입 상황을 다소 거칠게 처리합니다.
  naturalness: ‘밤의 어느 경점’은 본문에서 역사적 시간 구분을 간결하게 나타내며, 뜻은 각주로 풀이할 수 있습니다. ‘자기 집에 침입하도록 내버려 두지 않았을 것입니다’는 합쇼체 문체에서 자연스럽고, 허용하지 않았다는 원문의 의미를 분명히 합니다.
