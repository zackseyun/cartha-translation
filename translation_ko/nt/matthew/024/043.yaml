source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
  footnotes:
  - marker: a
    text: Or, more explicitly, 'in which watch of the night.'
    reason: cultural_note
  - marker: b
    text: Literally, 'be dug through,' reflecting houses that could be breached through a wall or roof in the ancient setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이것을 알아 두십시오. 집주인이 도둑이 밤의 어느 경점에 올지를 알았더라면[a], 깨어 있어 자기 집에 침입하도록 내버려 두지 않았을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경점’은 밤을 나눈 시간 단위입니다.
    reason: cultural_note
  - marker: b
    text: 직역하면, ‘자기 집이 뚫려 들어가도록’입니다. 이는 고대의 벽이나 지붕을 뚫고 침입할 수 있었던 상황을 반영합니다.
    reason: lexical_alternative
