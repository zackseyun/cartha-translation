  source_fidelity: 초안은 미래의 큰 환난, 전례 없음, 그리고 미래의 재발 부정이라는 핵심 의미를 대체로 충실히 전달합니다. 그러나 οἵα가 수식하는 대상은 '그런 일' 일반이라기보다 '큰 환난'이므로, 이를 명시하여 비교의 초점을 보존하는 편이 더 정확합니다. γάρ의 설명적 연결도 '이는'으로 드러낼 수 있습니다.
