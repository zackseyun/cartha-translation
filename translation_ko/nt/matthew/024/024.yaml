- from: 거짓 메시아들과 거짓 예언자들이 일어나 큰 표적들과 기적들을 행하여, 할 수만 있다면 택하신 자들까지도 미혹하려 할 것입니다.
  to: 거짓 메시아들과 거짓 예언자들이 일어나, 가능하다면 택하신 자들까지도 미혹할 만큼 큰 표적들과 기적들을 행할 것입니다.
  rationale: The revision removes the unsupported attempt nuance and renders ὥστε πλανῆσαι with ‘미혹할 만큼,’ preserving the close connection between the extraordinary signs and their potential to mislead. ‘가능하다면’ retains the concise conditional εἰ δυνατὸν without resolving its theological implication.
