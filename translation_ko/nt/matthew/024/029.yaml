review_pass:
  verdict: revise
  source_fidelity: 개정안은 Εὐθέως의 강한 시간성을 ‘곧’으로, μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων을 ‘그 날들의 환난이 있은 뒤’로 옮깁니다. 미래 수동 σκοτισθήσεται와 σαλευθήσονται는 미래 표현으로 유지했으며, ‘하늘의 능력들’은 αἱ δυνάμεις τῶν οὐρανῶν의 우주적 힘·천체·천상 존재 등을 특정하지 않는 폭을 보존합니다.
  naturalness: 초안의 ‘환난 후에 즉시’는 뜻은 전달하지만 한국어 어순상 다소 경직됩니다. ‘환난이 있은 뒤에는 곧’이 현대 표준어 문장 흐름에 자연스럽습니다. 또한 나열된 사건들을 일관되게 미래형으로 표현했습니다.
  terminology: ‘환난’은 θλῖψις의 문맥상 무게를 보존합니다. ‘권세들’은 한국어에서 통치 권위나 영적 존재로 더 좁게 들릴 수 있어, 해석을 제한하지 않는 ‘능력들’을 채택했습니다. ‘하늘’은 οὐρανός의 ‘하늘/하늘나라’ 범위를 문맥상 자연스럽게 유지하며, 각주에서 ‘하늘’ 대신 ‘하늘(공중)’이라는 대안 가능성을 안내합니다.
  issues:
  - severity: medium
    issue: 시간 부사의 위치와 미래 시제의 일관성
    rationale: ‘그 날들의 환난 후에 즉시’는 원문의 뜻을 담지만 한국어로는 ‘환난이 있은 뒤에는 곧’이 더 자연스럽습니다. 초안의 ‘달은 … 내지 않으며’는 예언적 미래 나열에서 앞뒤 미래 표현과 시제가 덜 일관됩니다.
  - severity: medium
    issue: ‘하늘의 권세들’이 원문의 의도적 폭을 좁힐 가능성
    rationale: δυνάμεις는 권위 있는 존재만이 아니라 힘·세력·천체적 힘을 가리킬 수 있습니다. ‘능력들’과 설명 각주가 해석을 확정하지 않고 원문의 모호성을 더 잘 보존합니다.
  revised_text: 그러나 그 날들의 환난이 있은 뒤에는 곧 해가 어두워질 것이고, 달은 그 빛을 내지 않을 것이며, 별들은 하늘에서 떨어질 것이고, 하늘의 능력들이 흔들릴 것입니다.[b]
  revised_footnotes:
  - marker: a
    text: ‘하늘’은 여기서 ‘공중’ 또는 ‘하늘’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘의 능력들’은 우주적 힘, 천체, 또는 천상적 능력들을 가리킬 수 있습니다. 그리스어 표현은 의도적으로 넓은 뜻을 지닙니다.
    reason: lexical_alternative
  revision_rationale: 원문의 시간적 강조, 미래적 예언 서술, 우주적 이미지, 그리고 ‘하늘의 능력들’이라는 표현의 해석상 개방성을 보존하도록 문장을 다듬었습니다. 영어 감사 기록의 각주 a는 본문에서 ‘heaven’에 붙지 않고 ‘those days’에 붙어 있어 앵커가 내용과 맞지 않습니다. 한국어 개정문에서는 해당 어휘 대안 각주를 제시하되, 본문에 사용하지 않은 각주 a는 본문 앵커로 붙이지 않았고, 실제 해석상 중요한 모호성은 ‘능력들’ 뒤의 b로 연결했습니다.
