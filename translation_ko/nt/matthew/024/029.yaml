  text: 그러나 그 날들의 환난 후에 즉시 해는 어두워지고, 달은 그 빛을 내지 않으며, 별들은 하늘에서 떨어지고, 하늘의 권세들이 흔들릴 것입니다.
  philosophy: optimal-equivalence
