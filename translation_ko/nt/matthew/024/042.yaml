  source_fidelity: The draft accurately conveys the imperative, inferential conjunction, reason clause, unknown day, and the possessive title. However, '오실지' renders ἔρχεται as a simple future and loses the Greek present-form vividness retained in the English audit trail.
  naturalness: ‘깨어 있으십시오’ is natural modern formal-polite Korean. Replacing the mixed/archaic second-person pronoun ‘너희’ with ‘여러분’ gives consistent contemporary 합쇼체 address.
  terminology: ‘주님’ is the standard natural Korean rendering of κύριος in this context and preserves the established NT title. ‘어느 날에’ naturally renders ποίᾳ ἡμέρᾳ.
  issues:
  - severity: medium
    issue: Present-tense ἔρχεται is translated as the simple future ‘오실지.’
    rationale: The Greek is present indicative and the audited English intentionally retains its vivid present force (‘is coming’). ‘오시는지’ is idiomatic in Korean in this future-oriented context while better preserving the source form without asserting a timetable.
  - severity: low
    issue: The address ‘너희’ is not optimal for modern formal-polite Korean.
    rationale: ‘여러분’ is contemporary standard usage and matches the -십시오 register.
  revised_text: 그러므로 깨어 있으십시오. 여러분의 주님께서 어느 날에 오시는지 여러분이 알지 못하기 때문입니다.
