  source_fidelity: σκανδαλισθήσονται는 여기서 단순한 물리적 넘어짐이 아니라 압박 속에서 걸려 넘어지거나 신앙적으로 이탈하는 뜻을 가질 수 있습니다. 초안의 ‘떨어져 나가’는 이탈 의미를 잘 포착하지만 무엇으로부터 떨어져 나가는지 한국어에서 다소 불분명하고 구어적으로 들립니다. ‘넘어질 것이다’와 각주로 대안을 제시하면 원문의 의미 범위를 보존합니다. ‘서로를 배반하고’와 ‘서로를 미워할 것입니다’는 ἀλλήλους, παραδώσουσιν, μισήσουσιν을 충실히 옮깁니다.
  naturalness: ‘그때에 많은 사람이 넘어질 것이며’는 현대 표준어 합쇼체 문맥에서 자연스럽고, 뒤의 병렬 미래 서술과도 잘 연결됩니다. 목적격을 드러낸 ‘서로를’의 반복은 원문의 상호성을 명료하게 합니다.
