    text: ‘종’으로 옮긴 그리스어 단어는 문맥에 따라 ‘노예’ 또는 ‘종/하인’을 뜻할 수 있습니다. 여기서는 주인에게 예속되어 집안의 일을 맡은 사람이라는 비유의 사회적 관계를 가리킵니다.
