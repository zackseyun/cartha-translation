  source_fidelity: 현 번역은 주요 어휘를 대체로 반영하지만, 마지막의 “...한 자가 아니겠습니까?”가 원문의 직접 의문문을 부정 의문문과 사실상 답변하는 구조로 바꾸며, ‘종’이 주인이 세운 대상이라는 관계도 흐립니다. 원문은 주인이 그 종을 집안 식구들 위에 세워 양식을 주게 한 ‘신실하고 슬기로운 종’이 누구인지 묻습니다.
  naturalness: ‘그렇다면’과 ‘신실하고 지혜로운 종’은 자연스럽습니다. 다만 현 문장은 수식 관계가 길고 ‘한 자가 아니겠습니까?’가 어색하며 원문의 물음을 정확히 살리지 못합니다. 수식절을 ‘종’ 앞에 두면 현대 표준어 합쇼체에서 더 명료합니다.
  terminology: δοῦλος는 역사적 사회관계가 포함된 ‘종’으로 옮기되, ‘노예’라는 가능한 번역을 주석으로 밝혔습니다. φρόνιμος는 마태복음의 실제적 분별·지혜의 뉘앙스를 살려 ‘슬기로운’으로, κύριος는 비유의 가정 경영 문맥에 맞게 ‘주인’으로 옮겼습니다. οἰκετεία는 단순 건물보다 그 안의 구성원을 가리키므로 ‘집안 사람들’로 번역했습니다.
