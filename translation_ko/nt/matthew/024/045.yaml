  text: Who then is the faithful and wise slave[b][a], whom the master has appointed over his household to give them their food at the proper time?
  footnotes:
  - marker: a
    text: Or 'servant.' The Greek word can mean either 'slave' or 'servant' depending on context; here 'slave' preserves the stronger sense of one under a master's authority.
    reason: lexical_alternative
  - marker: b
    text: Or 'Lord.' In this household image, the Greek word is rendered 'master' to fit the parable's social setting.
    reason: alternative_reading
translation:
