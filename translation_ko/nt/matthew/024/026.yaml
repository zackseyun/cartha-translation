review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the inferential opening, the indefinite plural subject, both reported location claims, and the two prohibitions. However, 할지라도 introduces a concessive force (‘even if/although’) not expressed by ἐὰν, and repeating it makes the second report appear as a separately framed conditional rather than the second parallel report within the one conditional construction.
  naturalness: The syntax is understandable, but ‘…할지라도 … 말고, …할지라도 … 마십시오’ is heavier and less natural than a single modern Korean conditional followed by parallel prohibitions. ‘안쪽 방들’ communicates ταμεῖα more broadly and naturally than 골방, which can suggest specifically a small, cramped room.
  terminology: ‘광야’ is appropriate for ἐρήμῳ and Matthew’s established usage. ‘안쪽 방들’ preserves the plural and the sense of inner/private rooms without narrowing it to storerooms or imposing the stronger sense of secret chambers. ‘보십시오’ is a modern formal-polite rendering of ἰδού suitable to the requested register.
  issues:
  - severity: medium
    issue: Concessive conditional ‘할지라도’
    rationale: ἐὰν εἴπωσιν is an ordinary prospective conditional (‘if they say’), not explicitly concessive. Render it with -면/-한다면 rather than ‘even if/although.’
  - severity: low
    issue: ‘골방’ is narrower than ταμείοις
    rationale: ταμεῖα can denote inner, private, or storage rooms. ‘골방’ may evoke a small cramped room; ‘안쪽 방들’ better preserves the broader plural sense.
  revised_text: 그러므로 사람들이 너희에게 ‘보십시오, 그가 광야에 있다’라고 말하면, 나가지 마십시오. ‘보십시오, 그가 안쪽 방들에 있다’라고 하면, 믿지 마십시오.
  revised_footnotes: []
  revision_rationale: The revision uses ordinary Korean conditional phrasing for ἐὰν, preserves the two parallel reported claims without inserting an ‘or,’ maintains the formal-polite register in the prohibitions, and renders ταμεῖα with a broad plural expression. No footnote is needed because the main rendering is sufficiently faithful and natural.
