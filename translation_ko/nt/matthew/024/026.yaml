revisions:
- from: 그러므로 그들이 너희에게 ʻ보아라, 그가 광야에 있다ʼ 할지라도 나가지 말고, ʻ보아라, 그가 골방에 있다ʼ 할지라도 믿지 마십시오.
  to: 그러므로 사람들이 너희에게 ‘보십시오, 그가 광야에 있다’라고 말하면, 나가지 마십시오. ‘보십시오, 그가 안쪽 방들에 있다’라고 하면, 믿지 마십시오.
  rationale: The revision uses ordinary Korean conditional phrasing for ἐὰν, preserves the two parallel reported claims without inserting an ‘or,’ maintains the formal-polite register in the prohibitions, and renders ταμεῖα with a broad plural expression. No footnote is needed because the main rendering is sufficiently faithful and natural.
