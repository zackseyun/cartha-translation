  naturalness: ‘하늘 이 끝’은 명백한 띄어쓰기 오류이며, ‘사방에서, 곧’은 원문의 병렬된 범위 표현을 다소 해설적으로 만듭니다. ‘네 바람에서, 하늘 이 끝에서 저 끝까지’는 현대 표준어 합쇼체 안에서 성서적 이미지를 보존하면서도 자연스럽습니다.
  terminology: ‘자기 천사들’과 ‘자기 택하신 자들’은 문맥 및 한국어 성서 용례에 적절합니다. ‘큰 나팔 소리’는 μεγάλη σάλπιγγος를 자연스럽게 옮긴 표현이며, ‘큰 나팔’ 또는 ‘나팔 소리’라는 대안은 각주로 밝혀 모호성을 보존합니다.
