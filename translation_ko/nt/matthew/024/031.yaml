  to: 그가 큰 나팔 소리와 함께[a] 자기 천사들을 보내실 것이며, 그들은 네 바람에서[c], 곧 하늘 이 끝에서 저 끝까지[d] 자기 택하신 자들을[b] 모을 것입니다.
  rationale: 원문의 두 범위 표현을 해설로 축소하지 않고 ‘네 바람’ 및 ‘하늘 이 끝에서 저 끝까지’로 보존했습니다. 미래 시제와 천사들이 ‘모을’ 것이라는 문법적 관계를 명확히 했으며, 한국어 문장 흐름과 합쇼체를 유지했습니다. 각주는 본문의 의미를 바꾸지 않고 주요 어휘 및 관용 표현의 대안을 투명하게 제시합니다.
