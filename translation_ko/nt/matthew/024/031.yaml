source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
  footnotes:
  - marker: a
    text: 'Or: “with a great trumpet” or “with a trumpet blast.”'
    reason: lexical_alternative
  - marker: b
    text: 'Or: “his elect.”'
    reason: lexical_alternative
  - marker: c
    text: The expression “the four winds” is an idiom for the farthest reaches in every direction.
    reason: cultural_note
  - marker: d
    text: Greek “from the ends of the heavens to their ends,” an idiom meaning from one extreme to the other.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 큰 나팔 소리와 함께[a] 자기 천사들을 보내실 것이며, 그들은 네 바람에서[c], 곧 하늘 이 끝에서 저 끝까지[d] 자기 택하신 자들을[b] 모을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “큰 나팔과 함께” 또는 “나팔 소리와 함께.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “자기 선택된 이들을.”
    reason: lexical_alternative
  - marker: c
    text: ‘네 바람’은 모든 방향의 가장 먼 곳을 가리키는 관용 표현입니다.
    reason: cultural_note
  - marker: d
    text: 그리스어로는 “하늘들의 끝들에서 그 끝들까지.” 한 극단에서 다른 극단까지를 뜻하는 관용 표현입니다.
    reason: lexical_alternative
