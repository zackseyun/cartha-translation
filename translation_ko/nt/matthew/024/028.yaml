  source_fidelity: 그리스어 πτῶμα는 ‘주검/시체’를 뜻하며, ὅπου ἐὰν ᾖ의 불특정적 의미는 ‘있는 곳에는’으로 자연스럽게 나타낼 수 있습니다. ἀετοί는 기본적으로 ‘독수리들’이지만, 시체 주위에 모이는 문맥에서는 독수리를 포함한 시체를 먹는 큰 새들, 곧 ‘독수리류/대머리독수리류’를 가리킬 수 있습니다. 본문은 어휘의 기본 의미를 유지하고 그 문맥적 대안을 각주로 보존합니다.
  naturalness: ‘주검’도 가능하지만, 현대 표준어 합쇼체에서는 ‘시체가 있는 곳에는 독수리들이 모여들 것입니다’가 간결하고 자연스럽습니다. ‘모여들 것입니다’는 미래 수동형 συναχθήσονται가 이 문맥에서 나타내는 새들이 함께 모이는 모습을 자연스럽게 전달합니다.
  terminology: ‘시체’는 πτῶμα에 적절합니다. ‘독수리들’은 ἀετοί의 통상적 번역이며, 문맥상 ‘대머리독수리들/시체를 먹는 큰 새들’이라는 가능성은 각주로 처리하여 영어 POB의 문맥 판단과 원문의 어휘적 범위를 함께 보존합니다.
  issues:
  - severity: medium
    issue: ἀετοί의 문맥적 어휘 대안이 누락됨
    rationale: 초안의 ‘독수리들’은 가능한 번역이지만, 시체 주위에 모이는 문맥에서는 영어 POB가 채택한 ‘vultures’에 해당하는 해석적 가능성이 있습니다. 원어의 어휘적 범위를 보존하는 각주가 필요합니다.
  - severity: low
    issue: ‘주검이 있는 곳에’의 연결 표현
    rationale: 의미상 큰 오류는 없으나, ‘시체가 있는 곳에는’이 불특정적·일반적 속담 표현을 더 매끄럽게 나타내고 뒤 절과의 대조도 분명히 합니다.
  revised_text: 시체가 있는 곳에는 독수리들이 모여들 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘대머리독수리들’ 또는 시체를 먹는 큰 새들. 그리스어는 보통 ‘독수리들’을 뜻하지만, 여기서는 시체 주위에 모이는 새들을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 본문은 ἀετοί의 기본 번역인 ‘독수리들’을 사용하되, 시체에 모이는 새라는 문맥에서 가능한 ‘대머리독수리들/시체를 먹는 큰 새들’이라는 이해를 각주로 밝혔습니다. 이는 본문에 특정한 종이나 비유의 해석을 강요하지 않으면서 영어 감사 기록의 어휘적 판단을 반영합니다. ‘시체’와 ‘모여들 것입니다’는 각각 πτῶμα와 συναχθήσονται에 자연스럽게 대응합니다.
