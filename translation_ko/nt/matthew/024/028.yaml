  source_fidelity: 초안은 πτῶμα를 ‘주검’으로, ἀετοί를 통상적 한국어 대응어인 ‘독수리들’로 옮겨 기본 의미를 잘 보존합니다. 그러나 ὅπου ἐὰν ᾖ의 불특정·반복적 의미(‘어디든/곳마다’)가 ‘있는 곳에’에서는 충분히 드러나지 않습니다.
