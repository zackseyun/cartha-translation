  terminology: ‘주검’은 πτῶμα에 적절합니다. ἀετοί는 기본적으로 ‘독수리들’로 옮기되, 문맥상 시체에 모이는 새라는 점 때문에 ‘대머리수리들’로 이해될 가능성을 각주에 보존하는 것이 원문과 영어 감사 기록의 어휘적 긴장을 모두 반영합니다.
