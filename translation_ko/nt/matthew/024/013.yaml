  source_fidelity: 그리스어의 대조 접속사 δέ는 ‘그러나’로, ὁ ... ὑπομείνας는 ‘끝까지 견디는 자’로, εἰς τέλος는 ‘끝까지’로, 미래 수동형 σωθήσεται는 ‘구원을 받을 것입니다’로 충실히 옮겼습니다. οὗτος의 강조·재지시는 한국어의 주어 구성에서 자연스럽게 흡수되었으며 의미 손실이 없습니다.
  naturalness: ‘그러나 끝까지 견디는 자는 구원을 받을 것입니다.’는 현대 표준 한국어의 정중한 합쇼체로 자연스럽고, 성경 본문의 절제된 문체에도 적절합니다.
  terminology: ‘견디는’은 ὑπομένω의 고난 아래 지속하여 버티는 뜻을 직접적으로 전달합니다. ‘구원을 받을 것입니다’는 σῴζω의 구원/구출 범위를 특정 교리적 해석으로 좁히지 않는 적절한 표현입니다.
