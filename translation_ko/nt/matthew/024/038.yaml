  terminology: ‘홍수’, ‘노아’, ‘방주’는 성경 문맥에서 확립되어 있고 적절합니다. γαμοῦντες/γαμίζοντες의 구별은 ‘결혼하고/혼인시키며’로 보존하되, 후자의 용법상 가능한 대안은 각주로 제시합니다.
