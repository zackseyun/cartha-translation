  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
  footnotes:
  - marker: a
    text: Or 'marrying and being given in marriage.' The Greek distinguishes γαμοῦντες and γαμίζοντες; the latter can refer to being given in marriage or to giving someone in marriage.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 홍수 전의 날들에 사람들이 먹고 마시고 장가들고 시집보내며[a], 노아가 방주에 들어간 날까지 그렇게 계속하였던 것과 같기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시집가며.’ 그리스어는 γαμοῦντες(장가들다/결혼하다)와 γαμίζοντες를 구별합니다. 후자는 ‘시집보내다’ 또는 ‘시집가다’를 뜻할 수 있습니다.
    reason: lexical_alternative
