  source_fidelity: 초안은 홍수 전의 일상적 행위와 노아의 방주 입성이라는 시간적 종결을 대체로 옮겼습니다. 그러나 γὰρ ὡς의 설명적 비교(‘이는/…처럼’)가 빠져 있고, γαμίζοντες는 능동형으로서 단순히 ‘시집가다’보다 ‘혼인시키다/시집보내다’의 의미를 우선 반영하는 것이 더 정확합니다.
