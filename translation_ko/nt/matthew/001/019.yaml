revisions:
- from: 그녀의 남편 요셉은 의로운 사람이라 마리아를 공개적으로 망신 주고 싶지 않아, 조용히 이혼하려고 마음먹었습니다.
  to: 그녀의 남편[a] 요셉은 의로운 사람이었고, 그녀를 공개적으로 수치스럽게 하기를 원하지 않았으므로, 남몰래 그녀와 이혼하기로 마음먹었습니다.[b]
  rationale: The revision retains the Greek pronouns and participial logic, uses formal modern Korean, explicitly carries the object of the intended divorce, and preserves the historically legal sense of Joseph and Mary's betrothal in restrained footnotes. It does not determine whether Joseph's righteousness should be understood primarily as legal observance or mercy.
  reviewer_model: gpt-5.6-terra
