review_pass:
  verdict: revise
  source_fidelity: The draft conveys Joseph's righteousness, his refusal to shame Mary publicly, and his intended private legal dissolution. However, it supplies 'Mary' where the Greek uses a pronoun, renders the participial background too colloquially, and leaves the object of 'divorce' implicit.
  naturalness: ‘공개적으로 망신 주고 싶지 않아’ is conversational and not suitable for a modern formal-polite Bible register. ‘공개적으로 수치스럽게 하기를 원하지 않았으므로’ and ‘남몰래 그녀와 이혼하기로 마음먹었습니다’ are natural, formal, and clear.
  terminology: ‘의로운’ appropriately renders δίκαιος without resolving its ethical or legal nuance. ‘이혼’ appropriately communicates the legal force of ἀπολῦσαι in this betrothal setting. ‘남몰래’ accurately preserves λάθρᾳ better than the potentially understated ‘조용히.’
  issues:
  - severity: medium
    issue: Register is too colloquial in ‘망신 주고 싶지 않아.’
    rationale: The construction is informal spoken Korean and does not maintain the specified modern formal-polite biblical register. It also weakens the deliberate volitional force of μὴ θέλων.
  - severity: low
    issue: The draft replaces the Greek pronoun with the name ‘마리아.’
    rationale: Mary is the clear discourse referent from the preceding context, but this verse itself says ‘her.’ Retaining ‘그녀’ more closely follows the source while remaining clear.
  - severity: low
    issue: The object of ‘이혼하려고’ is unexpressed.
    rationale: Although inferable, explicitly stating ‘그녀와 이혼하기로’ preserves the object αὐτήν and prevents the Korean phrase from sounding incomplete.
  revised_text: 그녀의 남편[a] 요셉은 의로운 사람이었고, 그녀를 공개적으로 수치스럽게 하기를 원하지 않았으므로, 남몰래 그녀와 이혼하기로 마음먹었습니다.[b]
