source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
  footnotes:
  - marker: a
    text: Or 'her betrothed.' The Greek says 'her man/husband,' reflecting the legal force of Jewish betrothal.
    reason: lexical_alternative
  - marker: b
    text: Or 'to make an example of her' or 'to disgrace her publicly.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to send her away privately.' In context this refers to formal divorce during betrothal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 남편[a] 요셉은 의로운 사람이었고, 그녀를 공개적으로 수치스럽게 하기를 원하지 않았으므로, 남몰래 그녀와 이혼하기로 마음먹었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 약혼자’. 당시 유대의 약혼은 법적으로 구속력이 있었으므로, 이를 끝내려면 정식 이혼이 필요했습니다.
    reason: ‘그녀의 남편’은 ἀνὴρ αὐτῆς의 자연스러운 번역이며, 약혼 단계라는 역사적·법적 맥락을 밝혀 줍니다.
  - marker: b
    text: ‘남몰래’는 ‘비공개로’ 또는 ‘은밀히’로도 옮길 수 있습니다. 여기서 이혼은 약혼 관계를 법적으로 해소하는 것을 가리킵니다.
    reason: λάθρᾳ와 ἀπολῦσαι의 가능한 뉘앙스 및 법적 의미를 보존합니다.
