  to: 그는 그녀가 아들을 낳기까지[a][b] 그녀와 동침하지 않았습니다. 그리고 그의 이름을 예수라고 하였습니다.[c]
  rationale: 대조적 접속사 ‘그러나’를 원문의 단순 접속에 맞게 ‘그리고’로 고쳤습니다. 목적어와 소유 대명사를 명시하여 원문의 지시 관계를 보존했으며, ‘~까지’에 관한 후대의 신학적 결론은 본문에 덧붙이지 않고 주석으로 한정했습니다.
