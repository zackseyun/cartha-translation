base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
  footnotes:
  - marker: a
    text: Or more explicitly, 'he did not have marital relations with her.' The Greek says 'did not know her,' using 'know' as a euphemism.
    reason: lexical_alternative
  - marker: b
    text: '''Until'' marks what was true up to Jesus''s birth; by itself it does not decide what happened afterward.'
    reason: alternative_reading
  - marker: c
    text: Or, more idiomatically, 'he named him Jesus.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그녀가 아들을 낳기까지[a][b] 그녀와 동침하지 않았습니다. 그리고 그의 이름을 예수라고 하였습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면, ‘그녀를 알지 않았다’입니다. 여기서 그리스어 ‘알다’는 부부 관계를 가리키는 완곡한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘~까지’는 예수님의 출생 때까지 그러했다는 뜻을 나타내며, 그 자체로 그 이후에 어떤 일이 있었는지를 결정하지는 않습니다.
    reason: alternative_reading
  - marker: c
    text: 관용적으로, ‘그에게 예수라는 이름을 지었습니다’라고 옮길 수 있습니다.
    reason: lexical_alternative
