  naturalness: ‘아들을 낳을 것이요’는 문어적 성경체로 가능하지만, 요청된 현대 표준어 합쇼체에는 ‘아들을 낳을 것이며’와 ‘부를 것입니다’가 더 자연스럽고 일관됩니다.
  terminology: ‘처녀’, ‘임마누엘’, ‘하나님’은 적절합니다. 이름의 풀이도 본문의 진술을 넘어서지 않도록 유지했습니다.
