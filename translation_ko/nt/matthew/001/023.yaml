  - severity: low
    issue: 문장 종결의 문체가 현대 합쇼체와 완전히 일치하지 않습니다.
    rationale: 초안은 ‘것이요’, ‘부를 것이다’, ‘뜻입니다’가 섞여 있습니다. 합쇼체 요구에 맞추어 ‘것이며’, ‘부를 것입니다’, ‘뜻입니다’로 통일할 수 있습니다.
