    reason: lexical_alternative
  - marker: c
    text: Also transliterated 'Emmanuel.'
    reason: lexical_alternative
  - marker: d
    text: Or 'which translated means'.
    reason: previous_rendering
translation:
  language: ko
  text: 「보라, 처녀가 잉태하여 아들을 낳을 것이며, 그들이 그의 이름을 임마누엘이라 부를 것입니다.」 임마누엘은 번역하면 「하나님이 우리와 함께 계시다」라는 뜻입니다.
  philosophy: optimal-equivalence
