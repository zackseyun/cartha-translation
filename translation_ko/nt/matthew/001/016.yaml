lexical_decisions:
- source_word: ἐξ ἧς ἐγεννήθη Ἰησοῦς
  english_pob_choice: from whom Jesus was born
  chosen_korean: 마리아에게서…예수가 나셨습니다
  alternatives_korean:
  - 마리아에게서 예수께서 태어나셨습니다
  lexicon: BDAG
  rationale: 수동태 ἐγεννήθη는 마태가 의도적으로 「요셉이 낳았다」 정형을 깬다. 한국어에서도 「요셉이 예수를 낳았다」가 아니라 「마리아에게서 예수가 나셨다」로 옮겨 처녀 잉태로의 전환을 표시한다.
- source_word: ὁ λεγόμενος χριστός
  english_pob_choice: who is called the Messiah
  chosen_korean: 메시아라 불리는
  alternatives_korean:
  - 그리스도라 불리는
  lexicon: BDAG
  rationale: 칭호로서의 Χριστός를 「메시아」로 일관되게 옮긴다.
theological_decisions:
- issue: 족보의 정형(능동태 「낳았다」)이 16절에서 수동태로 전환되는 신학적 의미
  chosen_reading: 마리아에게서…예수가 나셨습니다
  alternative_readings:
  - 요셉이 예수를 낳았다
  rationale: 마태는 14대-14대-14대 정형을 의도적으로 깨뜨려, 요셉이 예수의 생물학적 아버지가 아님을 헬라어 수동태로 표시한다. 한국어 번역도 능동 정형을 깨고 수동 구문으로 옮겨야 같은 신학적 강조가 살아난다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension; virgin conception affirmation'
revisions:
- from: 야곱은 마리아의 남편 요셉을 낳았는데, 마리아에게서 메시아라 불리는 예수가 나셨습니다.
  to: 야곱은 또 마리아의 남편 요셉을 낳았는데, 마리아에게서 메시아라 불리는 예수께서 태어나셨습니다.
  rationale: 연결사 δέ를 ‘또’로 반영하고, 출생 표현을 현대 표준어 합쇼체에 맞게 ‘예수께서 태어나셨습니다’로 다듬었습니다. 이 표현은 마리아를 가리키는 여성 단수 관계사와 예수의 출생을 나타내는 수동태를 보존하며, 본문이 명시하지 않는 사항을 덧붙이지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:10Z'
review_pass:
  verdict: revise
  source_fidelity: 마리아에게서 예수가 태어났다는 수동 구문과 ‘메시아라 불리는’은 원문을 충실히 반영합니다. 그러나 Ἰακὼβ δὲ의 가벼운 연결은 ‘야곱은’보다 ‘야곱은 또’가 더 잘 드러내며, τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας의 수식 관계도 유지해야 합니다.
  naturalness: ‘예수가 나셨습니다’는 존칭 주격 표지 없이 쓰여 현대 표준어 합쇼체에서 다소 어색합니다. ‘예수께서 태어나셨습니다’가 자연스럽고, 원문의 출생 수동 표현도 무리 없이 전달합니다.
  terminology: ‘메시아’는 χριστός의 칭호적 용법을 적절히 번역합니다. ‘마리아의 남편 요셉’도 ἀνήρ의 문맥상 ‘남편’을 정확히 반영합니다.
  issues:
  - severity: low
    issue: δέ의 연결 기능이 번역에서 빠져 있습니다.
    rationale: 대조를 강하게 할 필요는 없으나, 족보를 이어 가는 δέ는 ‘또’로 자연스럽게 나타낼 수 있습니다.
  - severity: medium
    issue: ‘예수가 나셨습니다’의 높임 표현이 어색합니다.
    rationale: 표준 현대 한국어에서는 높임 종결 ‘-셨습니다’와 함께 주체 높임 표지 ‘께서’를 쓰는 것이 자연스럽습니다. ‘태어나셨습니다’는 ἐγεννήθη의 수동적 출생 의미를 적절히 옮기며, 요셉이 예수를 낳았다고 하지 않는 원문의 전환을 보존합니다.
  revised_text: 야곱은 또 마리아의 남편 요셉을 낳았는데, 마리아에게서 메시아라 불리는 예수께서 태어나셨습니다.
