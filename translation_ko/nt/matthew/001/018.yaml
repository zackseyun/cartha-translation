    rationale: 문맥상 이 표현은 혼인 결합, 특히 그 완성으로 이해될 수 있는 완곡어입니다. ‘함께하기 전에’로 본문의 절제된 표현을 보존하고, 각주에서 가능한 혼인 결합의 의미를 설명하는 편이 더 안전합니다.
  - severity: low
    issue: 정혼/약혼의 문화적·법적 성격 및 ‘함께하기’의 완곡한 의미를 안내하는 각주가 없습니다.
    rationale: 영어 POB 감사 기록의 문화·어휘 주석에 해당하는 정보를 한국어 독자에게도 제공하면 오해를 줄이고 번역의 절제성을 유지할 수 있습니다.
