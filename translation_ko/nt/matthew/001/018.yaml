lexical_decisions:
- source_word: γένεσις
  english_pob_choice: birth
  chosen_korean: 나심
  alternatives_korean:
  - 탄생
  - 태어나심
  - 기원
  lexicon: BDAG
  rationale: 여기서 γένεσις는 1:1의 「족보」와 결을 다르게 하여 출생 사건을 가리킨다. 한국어 「나심」은 합쇼체 서사 안에서 존칭과 사건성을 함께 담는다.
- source_word: μνηστευθείσης
  english_pob_choice: betrothed
  chosen_korean: 약혼한
  alternatives_korean:
  - 정혼한
  lexicon: BDAG
  rationale: 1세기 유대 관습의 약혼은 법적 결혼에 가까운 결속이었다. 「약혼」으로 옮기되 그 무게는 19절의 「이혼」(ἀπολῦσαι)이 드러내도록 한다.
- source_word: ἐκ πνεύματος ἁγίου
  english_pob_choice: from the Holy Spirit
  chosen_korean: 성령으로
  alternatives_korean:
  - 성령에 의하여
  - 성령으로부터
  lexicon: BDAG
  rationale: πνεῦμα ἅγιον의 정형 용법을 한국어 「성령」으로 옮긴다.
revisions:
- from: 예수 메시아의 나심은 이러합니다. 그분의 어머니 마리아가 요셉과 약혼한 뒤, 동거하기 전에 성령으로 잉태한 사실이 드러났습니다.
  to: 예수 메시아께서 태어나신 일은 이렇습니다. 그분의 어머니 마리아가 요셉과 약혼한 뒤[a], 두 사람이 함께하기 전에[b], 마리아가 성령으로 잉태한 것이 드러났습니다.
  rationale: ‘동거하기 전에’를 본문의 완곡성과 의미 범위를 더 잘 보존하는 ‘두 사람이 함께하기 전에’로 고치고, 혼인 결합의 함의는 각주로 밝혔습니다. 또한 문장 전체를 현대 합쇼체에 맞게 ‘예수 메시아께서 태어나신 일’로 다듬었으며, 약혼의 역사적 성격을 각주로 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:19:20Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. γένεσις를 출생 사건으로, μνηστευθείσης를 약혼으로, ἐκ πνεύματος ἁγίου를 성령으로 옮긴 것은 적절합니다. 다만 συνελθεῖν을 단순히 ‘동거하다’로 한정하면 현대 한국어에서는 함께 거주한다는 뜻이 우세하여, 혼인 결합/성관계라는 본문의 완곡한 함의를 충분히 전달하지 못할 수 있습니다.
  naturalness: ‘예수 메시아께서 태어나신 일’과 ‘두 사람이 함께하기 전에’는 현대 표준 한국어 합쇼체 문맥에서 자연스럽습니다. 후자는 본문의 완곡성을 유지하며, 각주로 혼인 결합의 함의를 밝혀 독자의 이해를 돕습니다.
  terminology: ‘메시아’는 Χριστός의 칭호성을 살리고, ‘성령’은 πνεύματος ἁγίου의 문맥상 지시 대상을 적절히 반영합니다. ‘약혼’에는 현대의 가벼운 약혼과 구별되는 법적·사회적 성격을 설명하는 각주가 필요합니다.
