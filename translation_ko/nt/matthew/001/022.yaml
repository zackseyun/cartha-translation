revisions:
- from: 이 모든 일이 일어난 것은 주께서 예언자를 통하여 하신 말씀이 이루어지게 하려 함이었으니, 곧
  to: 이 모든 일은 주께서 예언자를 통하여 말씀하신 것이 이루어지도록 일어났으니, 곧
  rationale: 'The revision preserves the Greek sequence and agency distinction: all the events occurred; the Lord spoke through the prophet; and the spoken word was to be fulfilled. It also retains the sentence’s unfinished quotation-introducing “곧,” which properly leads into the citation in the next verse. No Korean footnote is required: the English alternative concerning an initial “Now” does not represent a distinct lexical meaning that needs to be carried in this Korean rendering.'
