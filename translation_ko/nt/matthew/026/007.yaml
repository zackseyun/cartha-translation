  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
  footnotes:
  - marker: a
    text: Or 'an alabaster flask of very costly ointment.' The Greek μύρον can refer to perfumed oil or ointment, not only modern liquid perfume.
    reason: lexical_alternative
  - marker: b
    text: That is, reclining in the customary posture for a meal.
    reason: cultural_note
translation:
  language: ko
  text: 한 여자가 매우 값비싼 향유[a]가 든 설화석고 병을 들고 그에게 다가와서, 그가 식탁에 기대어 앉아 계실 때[b] 그의 머리에 부었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “매우 값비싼 향유가 든 설화석고 향유병.” 그리스어 μύρον은 현대적인 액체 향수만이 아니라 향기 나는 기름이나 연고를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 당시 식사할 때 관습적으로 기대어 앉는 자세를 가리킵니다.
    reason: cultural_note
