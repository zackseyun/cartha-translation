  source_fidelity: 초안은 πῶς οὖν의 논리적 질문과 성경의 성취라는 핵심을 대체로 담고 있으나, 첫머리의 ‘그러나’는 원문의 οὖν(그러면/그렇다면)에 없는 대조를 더합니다. 또한 ‘이런 일이 반드시 이렇게 되리라는 성경’은 ὅτι절이 성경의 내용이라는 관계를 어색하게 처리하고, δεῖ γενέσθαι의 ‘반드시 이렇게 되어야 한다’를 미래 직설 ‘되리라’로 바꿉니다.
