  verdict: revise
  source_fidelity: The draft accurately conveys the central contrast, but it omits γάρ ('for/because') and renders both present-tense occurrences of ἔχετε with future-oriented wording. The revised wording restores the explanatory particle and more closely reflects the Greek's ongoing-presence contrast while retaining natural Korean expression of the impending separation.
  naturalness: ‘가난한 자들’ is understandable but somewhat archaic in contemporary standard Korean. ‘가난한 사람들’ is natural and respectful. ‘언제나 … 함께 있지는 않을 것입니다’ naturally expresses the negated ‘not always’ without implying that Jesus is never with them.
  terminology: No specialized theological term requires adjustment. ‘가난한 사람들’ faithfully renders τοὺς πτωχούς as a collective designation.
  issues:
  - severity: medium
    issue: γάρ is not represented.
    rationale: The verse opens with an explanatory conjunction, grounding the preceding statement. ‘왜냐하면’ preserves this connection.
  - severity: medium
    issue: The draft’s ‘함께 있겠지만’ shifts the first present-tense ἔχετε into a simple future expression.
    rationale: The Greek contrasts the poor's continual presence with Jesus' non-permanent presence. ‘함께 있습니다’ better retains the ongoing sense.
  - severity: low
    issue: ‘가난한 자들’ is less natural in modern formal Korean.
    rationale: ‘가난한 사람들’ is current standard usage and preserves the collective reference without changing meaning.
