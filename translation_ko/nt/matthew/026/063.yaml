- from: 그러나 예수께서는 잠잠하셨습니다. 그러자 대제사장이 그에게 말하였습니다, 「내가 살아 계신 하나님을 두고 너를 맹세하게 한다. 네가 메시아, 곧 하나님의 아들이라면 우리에게 말하라.」
  to: 그러나 예수께서는 계속 잠잠히 계셨습니다. 그러자 대제사장이 예수께 말하였습니다. 「나는 살아 계신 하나님을 두고 너에게 맹세시킨다[a]. 네가 메시아[b], 곧 하나님의 아들인지 우리에게 말하라.」
  rationale: ‘인지’로 εἰ가 이끄는 간접 의문을 정확히 반영하여, 대제사장이 예수께 자신의 신분 여부를 답하라고 요구하는 뜻을 보존했습니다. 또한 ἐσιώπα의 지속성을 ‘계속’으로 드러내고, 엄숙한 법정적 명령 공식과 ‘메시아’의 대체 번역을 각주로 밝혔습니다.
