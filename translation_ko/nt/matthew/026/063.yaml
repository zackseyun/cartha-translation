  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
  footnotes:
  - marker: a
    text: Or “Christ.” The Greek title is Christos, here rendered “Messiah” because it functions as a title rather than a name.
    reason: alternative_reading
  - marker: b
    text: Or “I adjure you by the living God.” The Greek is a solemn oath formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 예수께서는 계속 잠잠히 계셨습니다. 그러자 대제사장이 예수께 말하였습니다. 「나는 살아 계신 하나님을 두고 너에게 맹세시킨다[a]. 네가 메시아[b], 곧 하나님의 아들인지 우리에게 말하라.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “살아 계신 하나님을 두고 네게 엄숙히 명한다.” 이는 하나님을 증인으로 불러 행하는 엄숙한 서약·명령의 표현이다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그리스도.” 그리스어 칭호는 그리스도스이며, 여기서는 이름이 아니라 칭호로 쓰였다.
    reason: alternative_reading
