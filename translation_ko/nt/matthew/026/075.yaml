review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's remembering, Jesus' prediction, the threefold denial, and his departure. However, '통곡하였습니다' can specifically imply loud wailing and is stronger than ἔκλαυσεν πικρῶς ('wept bitterly').
  naturalness: The repeated '말씀' around the quotation is awkward in modern Korean. A single reporting construction is smoother while retaining the source's reference to Jesus' spoken word.
  terminology: '''부인할 것이다'' appropriately renders ἀπαρνήσῃ in this context. ''예수'' correctly follows the source without adding a title. ''비통하게 울었습니다'' conveys πικρῶς without introducing the possible audible intensity of ''통곡하다.'''
  issues:
  - severity: medium
    issue: '''통곡하였습니다'' overstates the manner of weeping.'
    rationale: The Greek says that Peter wept bitterly; it does not explicitly state that he wailed or cried aloud. '비통하게 울었습니다' is more source-proportionate.
  - severity: low
    issue: The phrase '예수께서 하신 말씀, … 하신 말씀' repeats the same noun and verb unnecessarily.
    rationale: The repetition is not required by ῥῆμα and εἰρηκότος and makes the Korean less natural.
  revised_text: 그리고 베드로는 예수께서 「닭이 울기 전에 네가 세 번 나를 부인할 것이다」라고 하신 말씀을 기억하고, 밖으로 나가 비통하게 울었습니다.
