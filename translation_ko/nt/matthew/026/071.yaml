  - severity: low
    issue: 출입구 표현 및 문장 연결
    rationale: πυλών은 ‘대문간/출입구’이며, ἐξελθόντα δέ 뒤의 진행을 한국어에서는 ‘나가자’로 연결하면 더 자연스럽습니다.
