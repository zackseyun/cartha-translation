  source_fidelity: 그리스어의 사건 배열과 핵심 인물·지명은 대체로 반영되어 있습니다. 다만 πυλών은 단순한 ‘문간’보다 출입구/대문간을 가리키며, 본문은 εἶδεν(보았다) 뒤에 현재형 λέγει(말합니다)를 사용하므로 이를 자연스럽게 유지하는 편이 좋습니다.
  naturalness: ‘그가 문간으로 나갔을 때에’는 가능하지만, 완료된 동작 뒤의 다음 사건을 잇는 ‘나가자’가 더 자연스럽습니다. 또한 합쇼체 목표에 맞추어 인용 발화도 ‘있었습니다’로 통일하고, 인용문 앞 문장부호를 한국어 문장 흐름에 맞게 고쳤습니다.
  terminology: ‘나사렛 예수’는 Ἰησοῦ τοῦ Ναζωραίου를 자연스럽고 정확하게 옮깁니다. ‘대문간’은 πυλών의 출입구/문간 의미를 더 분명히 합니다.
  issues:
