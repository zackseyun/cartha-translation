- from: 그리고 잔을 들어 감사 기도를 드리시고, 그들에게 주시며 말씀하셨습니다, 「너희가 다 이것을 마시십시오.」
  to: 또 잔을 들고 감사하신 뒤에 그들에게 주시고 말씀하셨습니다. “너희는 모두 이 잔에서 마시십시오.”
