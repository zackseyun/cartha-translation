  source_fidelity: 그리스어의 παραλαβών을 ‘데리고 가시며’로, ‘베드로와 세베대의 두 아들’을 원문의 식별 표현 그대로 옮겼습니다. ἤρξατο와 두 부정사 λυπεῖσθαι καὶ ἀδημονεῖν도 ‘슬퍼하고 심히 괴로워하기 시작하셨습니다’로 빠짐없이 반영합니다. ‘심히 괴로워하다’는 두 번째 동사의 강한 내적 고뇌를 과장 없이 전달합니다.
