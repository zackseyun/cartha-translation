  source_fidelity: 원문의 시간 표지 «Τότε»는 “그때에”로, 제사장 지도자들과 백성의 장로들이 함께 모인 사실은 “모여”로 적절히 옮겼습니다. «εἰς τὴν αὐλὴν»의 집결 장소도 “관저 뜰에”로 자연스럽게 반영했으며, 가야바가 대제사장임을 수식하는 관계도 정확합니다.
  naturalness: “그때에 대제사장들과 백성의 장로들이 가야바라 하는 대제사장의 관저 뜰에 모여,”는 다음 절로 이어지는 문맥에서 자연스럽게 기능하는 문어적 성경 한국어입니다. 합쇼체 본문에서 절 연결형 종결은 문장 연속 구조에 적절합니다.
  terminology: “대제사장들”은 복수 ἀρχιερεῖς에, “대제사장”은 단수 ἀρχιερεύς에 맞습니다. “백성의 장로들”과 정착된 인명 표기 “가야바”도 적절합니다. “관저 뜰”은 αὐλή의 문맥상 의미인 큰 거처의 뜰/궁정 뜰을 무리 없이 전달합니다.
