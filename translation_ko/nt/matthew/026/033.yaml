  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
  footnotes:
  - marker: a
    text: Or “stumble” or “be caused to stumble.” The Greek verb can denote being tripped up, taking offense, or falling away.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 베드로가 대답하여 말했습니다. “모든 사람이 주님 때문에 넘어질지라도[a], 저는 결코 넘어지지 않겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “실족할지라도.” 그리스어 동사는 문자적으로 걸려 넘어지는 것, 마음에 걸려 반감을 품는 것, 또는 그로 인해 떠나가는 것을 가리킬 수 있습니다.
    reason: σκανδαλισθήσονται의 의미 범위를 밝혀, 본문의 ‘넘어지다’가 단순한 육체적 넘어짐으로만 이해되지 않도록 합니다.
