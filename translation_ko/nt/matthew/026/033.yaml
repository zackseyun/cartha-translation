review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그러나’와 베드로의 강한 자기 대조 및 ‘결단코’는 원문의 δέ, 강조된 ἐγώ, οὐδέποτε를 대체로 잘 반영합니다. 그러나 σκανδαλισθήσονται/σκανδαλισθήσομαι를 ‘떨어져 나가다’로 옮긴 표현은 현대 한국어에서 사람의 반응을 나타내기에 부자연스럽고, 원어의 ‘걸려 넘어지다/실족하다’라는 어휘적 폭을 충분히 드러내지 못합니다.
  naturalness: ‘대답하였습니다, 「…」’의 쉼표 연결은 한국어 직접화법 문장부호와 호응상 어색합니다. ‘대답하여 말했습니다’와 마침표로 처리하고, ‘걸려 넘어지다’를 사용하면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: σκανδαλίζω는 여기서 제자들이 예수와 관련하여 실족하거나 떠나는 뜻을 가집니다. 본문은 직역적이고 폭넓은 ‘걸려 넘어지다’로 두고, 각주에서 ‘실족하다’ 및 ‘떠나가다’의 문맥상 가능성을 밝혀 해석을 과도하게 확정하지 않습니다. 한국어 직접 호칭의 ‘당신’이 가질 수 있는 부자연스러운 뉘앙스를 피하기 위해 문맥상 지시 대상인 ‘주님’을 사용했습니다.
  issues:
  - severity: medium
    issue: ‘떨어져 나가다’의 의미 및 자연스러움
    rationale: σκανδαλίζω는 물리적으로 분리되어 떨어진다는 뜻이 아니라 걸려 넘어지다, 실족하다, 문맥상 떠나다를 뜻합니다. ‘사람이 당신으로 인해 떨어져 나가다’는 현대 한국어에서 비관용적입니다.
  - severity: low
    issue: 직접화법 앞 쉼표
    rationale: ‘대답하였습니다, 「…」’보다 서술문을 마침표로 끝낸 뒤 인용문을 시작하는 편이 자연스러운 한국어 문장부호입니다.
  revised_text: 그러나 베드로가 대답하여 말했습니다. “모든 사람이 주님 때문에 걸려 넘어질지라도, 저는 결코 걸려 넘어지지 않겠습니다.”
  revised_footnotes:
  - marker: a
    text: ‘걸려 넘어지다’는 ‘실족하다’ 또는 문맥상 ‘떠나가다’로도 옮길 수 있습니다. 그리스어 동사는 걸려 넘어지게 되다, 불쾌하게 여기다, 또는 신앙적 충성을 저버리게 되다를 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 대조, 강조, 미래 부정은 유지하면서, 반복된 σκανδαλίζω를 한국어에서 자연스럽고 의미 범위도 보존하는 ‘걸려 넘어지다’로 일관되게 수정했습니다. 각주가 문맥상 더 강한 ‘떠나가다’의 가능성을 보존합니다.
