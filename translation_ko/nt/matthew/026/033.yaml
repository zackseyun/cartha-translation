review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 반영했으나, σκανδαλισθήσονται를 ‘떨어져 나가다’로 옮긴 표현은 현대 한국어에서 부자연스럽고 원문의 ‘걸려 넘어짐/실족/이탈’이라는 의미 범위를 충분히 살리지 못합니다. 또한 εἶπεν을 포함한 발화 도입을 자연스럽게 반영하는 편이 좋습니다.
  naturalness: ‘당신으로 인해 떨어져 나간다’와 ‘나는 결단코 떨어져 나가지 않겠습니다’는 현대 표준어 성서 문맥에서 어색하고, ‘당신’은 존대 대화에서 거칠거나 거리감 있게 들릴 수 있습니다. ‘주님 때문에 넘어지다’와 ‘저는 결코 넘어지지 않겠습니다’가 합쇼체 대화로 자연스럽습니다.
  terminology: ‘넘어지다’는 σκανδαλίζω의 비유적 용법을 자연스럽게 보존하며, 각주에서 ‘실족하다’ 및 ‘떠나가다’의 가능성을 밝혀 의미를 과도하게 한정하지 않습니다. 본문에서 ‘주님’은 한국어의 존대 호칭 관습상 자연스러운 보완입니다.
  issues:
  - severity: medium
    issue: ‘떨어져 나가다’의 어색한 반복
    rationale: 한국어에서 사람의 신앙적 실패나 관계 이탈을 ‘떨어져 나가다’라고 반복하면 부자연스럽습니다. 원문의 σκανδαλίζω는 비유적으로 걸려 넘어지거나 실족하는 뜻이며, 문맥상 이탈까지 함축할 수 있습니다.
  - severity: low
    issue: 직접 호칭으로서의 ‘당신’
    rationale: 예수께 드리는 베드로의 존대 발화에서 ‘당신’은 현대 표준 한국어에 다소 거칠게 들립니다. ‘주님’은 한국어 성서 번역의 자연스러운 존대 호칭입니다.
  - severity: low
    issue: 발화 도입의 축소
    rationale: ἀποκριθεὶς ... εἶπεν은 한국어에서 ‘대답하여 말했습니다’로 자연스럽게 반영할 수 있습니다.
  revised_text: 그러나 베드로가 대답하여 말했습니다. “모든 사람이 주님 때문에 넘어질지라도[a], 저는 결코 넘어지지 않겠습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 “실족할지라도.” 그리스어 동사는 문자적으로 걸려 넘어지는 것, 마음에 걸려 반감을 품는 것, 또는 그로 인해 떠나가는 것을 가리킬 수 있습니다.
    reason: σκανδαλισθήσονται의 의미 범위를 밝혀, 본문의 ‘넘어지다’가 단순한 육체적 넘어짐으로만 이해되지 않도록 합니다.
  revision_rationale: 본문은 두 차례의 σκανδαλίζω를 동일하게 ‘넘어지다’로 옮겨 반복과 강조를 보존했습니다. 각주는 이 동사의 관련 의미 범위를 제시하되, 문맥상의 제자도 실패를 특정 교리적 결론으로 확대하지 않습니다. ‘저는’과 ‘결코’는 ἐγώ와 οὐδέποτε의 대조와 강한 부정을 자연스럽게 드러냅니다.
