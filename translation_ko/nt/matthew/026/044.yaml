  source_fidelity: 원문에는 πάλιν(‘다시’)이 두 번 나옵니다. 초안은 ‘다시 가서’로 첫 번째 반복은 어느 정도 반영하지만, ‘같은 말씀을 하며’에는 마지막 πάλιν이 반영되지 않았습니다. 또한 ἀφεὶς와 ἀπελθών의 연속 동작은 ‘떠나 가셔서’로 자연스럽게 옮길 수 있습니다.
