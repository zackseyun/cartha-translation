  terminology: λόγον은 이 문맥에서 기도 가운데 한 ‘말/말씀’을 가리킵니다. 예수님의 발화를 가리키는 ‘말씀’은 한국어 성경 문체에서 자연스럽고, 여기서 로고스에 대한 별도의 신학적 의미를 부과하지 않습니다.
