  terminology: 「찬송」은 찬양을 노래한다는 원문의 의미를 적절히 전달합니다. 「올리브 산」은 원문의 지명 의미를 투명하게 보존한 현대 한국어 표기입니다. 별도의 교리적 해석이나 불필요한 역사적 특정화가 없습니다.
