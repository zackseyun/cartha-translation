  source_fidelity: 「찬송을 부른 후에」는 ὑμνήσαντες의 선행 완료 행동을, 「올리브 산으로 나갔습니다」는 ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν을 충실히 옮깁니다. 단수형 「찬송」은 한국어에서 찬송을 부르는 행위를 포괄적으로 나타내는 자연스러운 표현이며, 원문의 수를 부당하게 한 곡으로 제한하지 않습니다.
