  source_fidelity: The draft accurately represents the antecedent participle ('after singing') and the departure to the geographic destination. However, '감람산' is the established Korean biblical designation for τὸ Ὄρος τῶν Ἐλαιῶν and is preferable to the descriptive modern rendering '올리브 산.'
  naturalness: The revised wording is concise, idiomatic modern standard Korean in formal-polite narrative style. Removing the initial '그리고' avoids an unnecessarily marked connective while retaining the narrative sequence through '-ㄴ 뒤.'
  terminology: Use '감람산' as the conventional Korean biblical place name. '찬송을 부르다' naturally conveys ὑμνήσαντες; a note preserves the broader lexical possibility of singing praise.
  issues:
  - severity: low
    issue: Place name rendered as '올리브 산' rather than '감람산.'
    rationale: '''감람산'' is the conventional Korean biblical toponym for the Mount of Olives and is more appropriate for a scripture translation.'
  revised_text: 그들은 찬송을 부른 뒤 감람산으로 나갔습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “찬양을 부른 뒤.” 그리스어 동사는 일반적으로 찬양을 노래한다는 뜻일 수 있으나, 여기서는 ‘찬송을 부르다’로 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek sequence and sense while adopting the established Korean biblical place name. The footnote records the lexical breadth of ὑμνέω without asserting a specific liturgical identification.
