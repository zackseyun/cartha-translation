translation:
  language: ko
  text: 조금 후에 거기 서 있던 사람들이 베드로에게 다가와 말하였습니다. 「당신도 분명히 그들 가운데 한 사람입니다. 당신의 말씨[a]도 당신을 드러내기 때문입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말’ 또는 ‘말하는 방식’. 그리스어 λαλιά는 말, 말하는 방식, 억양이나 사투리를 가리킬 수 있습니다.
    reason: lexical_alternative
