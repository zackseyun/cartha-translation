base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
  footnotes:
  - marker: a
    text: That is, the cup of suffering mentioned in the previous verse; Greek here says simply 'this' and 'it.'
    reason: cross_reference
  - marker: b
    text: Or 'if it is not possible for this to pass unless I drink it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다시, 두 번째로 떠나가셔서 기도하여 말씀하셨습니다. 「내 아버지여, 만일 이것[a]이 내가 그것을[b] 마시지 않고서는 지나갈 수 없다면, 아버지의 뜻이 이루어지소서.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직전 절에서 언급된 고난의 잔을 가리킵니다. 그리스어 본문은 여기서 단지 ‘이것’과 ‘그것’이라고 합니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘만일 내가 그것을 마시지 않고서는 이것이 지나가는 것이 가능하지 않다면.’
    reason: lexical_alternative
