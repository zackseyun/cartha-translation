    rationale: ‘이것이 내가 마시지 않고는 지나갈 수 없는 것이라면’보다 ‘이것이 내가 그것을 마시지 않고서는 지나갈 수 없다면’이 εἰ οὐ δύναται ... ἐὰν μὴ ...의 직접적인 조건 구조와 두 지시어를 더 잘 보존합니다.
  - severity: low
