  source_fidelity: 원문의 πάλιν과 ἐκ δευτέρου를 모두 살려 ‘다시, 두 번째로’로 옮기고, ἀπελθών의 ‘떠나가다’와 τοῦτο/αὐτό의 지시 표현을 유지했습니다. 초안의 ‘이것이 … 것이라면’은 의미상 가능하지만 원문의 직접적인 조건문보다 우회적입니다.
  naturalness: ‘다시 두 번째 가서’는 현대 한국어에서 다소 부자연스럽고, ‘기도하시며 말씀하셨습니다’도 기도의 발화를 표현하기에는 덜 매끄럽습니다. ‘다시, 두 번째로 떠나가셔서 기도하여 말씀하셨습니다’가 문맥과 합쇼체 성경 문체에 자연스럽습니다.
  terminology: ‘내 아버지여’와 ‘아버지의 뜻이 이루어지소서’는 원문의 호격, 소유 표현, 기원형 명령법을 충실히 반영하며, 마태복음 6:10의 기도 표현과도 일관됩니다.
