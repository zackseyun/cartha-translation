  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
  footnotes:
  - marker: a
    text: That is, the cup of suffering mentioned in the previous verse; Greek here says simply 'this' and 'it.'
    reason: cross_reference
  - marker: b
    text: Or 'if it is not possible for this to pass unless I drink it.'
