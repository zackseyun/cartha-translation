- from: 그가 아직 말씀하고 계실 때에, 보아라, 열둘 중 하나인 유다가 왔는데, 그와 함께 대제사장들과 백성의 장로들에게서 온 큰 무리가 칼과 몽둥이를 가지고 있었습니다.
  to: 그가 아직 말씀하고 계실 때에, 보십시오, 열둘 중 한 사람인 유다가 왔습니다. 그와 함께 칼과 몽둥이를 든 큰 무리가 대제사장들과 백성의 장로들에게서 왔습니다.
  rationale: Revised the register, the personal partitive expression, and sentence structure for clear modern Korean. The main text deliberately retains "대제사장들과 백성의 장로들에게서" for ἀπό and does not intensify it to "보냄을 받은." No footnote is required because the wording preserves the source's ambiguity directly.
