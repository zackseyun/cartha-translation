  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
  footnotes:
  - marker: a
    text: Or 'sent by the chief priests and elders of the people.' The Greek more literally says 'from the chief priests and elders of the people.'
    reason: alternative_reading
  - marker: b
    text: Or 'sticks.' The Greek term literally refers to pieces of wood, here likely used as clubs.
    reason: lexical_alternative
