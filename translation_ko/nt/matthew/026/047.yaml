  text: 그가 아직 말씀하고 계실 때에, 보십시오, 열둘 중 한 사람인 유다가 왔습니다. 그와 함께 칼과 몽둥이를 든 큰 무리가 대제사장들과 백성의 장로들에게서 왔습니다.
