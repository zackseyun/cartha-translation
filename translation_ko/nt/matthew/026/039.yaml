review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus going a short distance, prostrating himself, praying, the address to the Father, the request concerning the cup, and the concluding contrast. However, "내 뜻대로 마시고" means "drink according to my will" and does not translate οὐχ ὡς ἐγὼ θέλω ("not as I will/want"); it is a substantive mistranslation.
  naturalness: The narrative is natural in modern formal-polite Korean. The revised prayer uses consistent reverent formal prayer language and makes the final elliptical contrast clear without adding interpretation.
  terminology: '"잔" appropriately retains ποτήριον and its biblical metaphor. "나의 아버지" faithfully expresses Πάτερ μου with a natural reverent Korean register. "원하시는 대로" renders θέλω without imposing a doctrinal gloss.'
  issues:
  - severity: high
    issue: '"그러나 내 뜻대로 마시고"'
    rationale: '"마시고" is the connective form of "마시다" (to drink), whereas the Greek contrasts Jesus'' will with the Father''s will. It must be replaced with wording expressing "not as I will, but as you will."'
  revised_text: 그리고 조금 더 나아가 얼굴을 땅에 대고 엎드려 기도하시며 말씀하셨습니다. 「나의 아버지, 가능하다면 이 잔을 내게서 지나가게 하여 주십시오. 그러나 제가 원하는 대로가 아니라 아버지께서 원하시는 대로 되게 하소서.」
