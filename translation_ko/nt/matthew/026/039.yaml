  to: 그리고 조금 더 나아가 얼굴을 땅에 대고 엎드려 기도하시며 말씀하셨습니다. 「나의 아버지, 가능하다면 이 잔을 내게서 지나가게 하여 주십시오. 그러나 제가 원하는 대로가 아니라 아버지께서 원하시는 대로 되게 하소서.」
