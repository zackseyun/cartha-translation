review_pass:
  verdict: revise
  source_fidelity: ‘이제’는 δέ의 온건한 이야기 전환을 시간 부사로 한정하여 옮긴 것이므로 삭제하는 편이 좋습니다. 또한 ‘함께 있던 자입니다’는 원문의 과거 사실 진술(ἦσθα μετὰ)을 신분·정체성 규정으로 바꾸므로, ‘함께 있었습니다’로 고쳐야 합니다. ‘바깥뜰’은 ἔξω ἐν τῇ αὐλῇ를 자연스럽게 반영합니다.
  naturalness: ‘말하였습니다, 「…」’보다 ‘말했습니다. “…”’가 현대 표준어 합쇼체 서술과 인용 연결에 더 자연스럽습니다. 직접 발화도 합쇼체로 유지했습니다.
  terminology: ‘여종’은 παιδίσκη의 여성 하인이라는 사회적 역할을 간결하게 전달합니다. 다만 노예 신분을 포함할 수 있는 낱말이므로 각주에서 그 가능성을 밝혔습니다. ‘갈릴리 사람 예수’는 τοῦ Γαλιλαίου의 식별적 호칭을 자연스럽게 보존합니다.
  issues:
  - severity: medium
    issue: ‘이제’가 삽입됨
    rationale: δέ는 여기서 명시적인 시간 부사 ‘이제’를 뜻하지 않으며, 서사 전환은 한국어 문장 연결로 충분히 처리할 수 있습니다.
  - severity: high
    issue: ‘함께 있던 자입니다’가 원문의 진술을 정체성 규정으로 변경함
    rationale: ἦσθα μετὰ는 ‘함께 있었다’라는 과거의 관계/동행을 말합니다. ‘~자입니다’는 원문에 없는 분류·단정을 더합니다.
