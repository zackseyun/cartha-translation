review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the principal sense, including the unnamed but particular individual, the nearness of Jesus' time, and the Passover observance with his disciples. However, πρὸς σέ literally means "with you/toward you" and only contextually implies the host's place; the draft's "너의 집에서" makes that implication explicit without noting it. The present λέγει is also better represented by a present reporting formula.
  naturalness: '"그에게 이르라" and the nested quotation structure are archaic and awkward for modern formal-polite Korean. "아무개" is possible but sounds colloquial or dismissive in this context. The revised wording uses clear, contemporary formal-polite speech and unambiguous quotation structure.'
  terminology: '"선생님," "때," "유월절," and "제자들" are appropriate. "어떤 사람" preserves the intentionally unspecified yet particular referent of τὸν δεῖνα. "당신 댁" is idiomatic in the message to the prospective host, while a note preserves the Greek wording''s literal form.'
  issues:
  - severity: medium
    issue: πρὸς σέ is rendered as "너의 집에서" without qualification.
    rationale: The Greek does not explicitly mention a house, though the hosting setting naturally supports "at your place." A footnote should retain the literal "with you" and indicate the contextual sense.
  - severity: medium
    issue: The reporting and quotation style is archaic and syntactically unnatural.
    rationale: '"그에게 이르라, … 하신다" does not meet the requested modern formal-polite register as naturally as "전하십시오" with a clear reported message.'
  - severity: low
    issue: '"아무개" is not the best register for τὸν δεῖνα here.'
    rationale: '"어떤 사람" clearly communicates an unnamed but particular person in modern formal Korean without the colloquial connotations of "아무개."'
  revised_text: 그가 말씀하셨습니다. “성안으로 들어가 어떤 사람에게 가서 이렇게 전하십시오. ‘선생님께서 말씀하십니다. “내 때가 가까이 왔습니다. 나는 제자들과 함께 당신 댁에서 유월절을 지키겠습니다.”’”
  revised_footnotes:
  - marker: a
    text: 그리스어로는 ‘당신과 함께’라는 뜻입니다. 문맥상 그 사람의 댁 또는 그가 마련한 장소에서 유월절을 지킨다는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘어떤 사람’은 이름을 밝히지 않은, 그러나 특정한 한 사람을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: The revision retains the source's deliberate ambiguity about the unnamed man and the scope of Jesus' approaching time, updates the Korean to modern formal-polite usage, and supplies a note where the contextual Korean rendering "당신 댁에서" is more explicit than the Greek πρὸς σέ.
