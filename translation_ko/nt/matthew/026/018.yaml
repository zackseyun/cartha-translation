review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. πρὸς σέ는 문자적으로 ‘너와 함께/네게’이며 본문에 ‘집’이 명시되어 있지 않습니다. 초안의 ‘너의 집에서’는 문맥상 가능한 해석이지만 원문보다 구체화합니다. 또한 ποιῶ는 현재형이므로 ‘지키고 있다’로 옮겨 원문의 임박한 현재 표현을 보존하는 편이 적절합니다.
  naturalness: ‘내 제자들과 함께 너와 함께’라는 직역식 배열은 부자연스럽습니다. ‘너와 내 제자들과 함께’로 병렬 관계를 명료하게 하면 현대 표준 한국어에서 자연스럽습니다. 인용문 안의 ‘선생님이 말씀하시기를 … 하신다’는 전달 발화로 자연스럽게 유지할 수 있습니다.
  terminology: ‘아무개’는 이름은 밝히지 않되 특정한 사람을 가리키는 τὸν δεῖνα를 잘 반영합니다. ‘선생님’, ‘유월절’, ‘제자들’도 문맥과 한국어 성경 용례에 적절합니다. ‘내 때’는 καιρός의 범위를 좁히지 않아 유지합니다.
  issues:
  - severity: medium
    issue: ‘너의 집에서’가 πρὸς σέ를 ‘집’으로 명시한다.
    rationale: 원문은 ‘너와 함께/네게’라고만 하며 집을 직접 언급하지 않습니다. 환대의 장소라는 문맥적 함의는 가능하지만 번문에서 확정하지 않는 것이 원문 충실성에 더 맞습니다.
  - severity: low
    issue: ‘지키겠다’가 ποιῶ의 현재형을 미래형으로 바꾼다.
    rationale: 축제 준수를 가리키는 ποιῶ τὸ πάσχα는 한국어로 ‘유월절을 지키고 있다’라고 할 수 있으며, 임박한 행위의 현재 표현을 보존합니다.
  - severity: low
    issue: 두 ‘함께’의 직역적 중복으로 문장이 어색하다.
    rationale: πρὸς σέ와 μετὰ τῶν μαθητῶν μου를 모두 보존하되 ‘너와 내 제자들과 함께’로 병렬화할 수 있습니다.
  revised_text: 그가 말씀하셨습니다. “성안의 아무개에게 가서 그에게 이렇게 말하여라. ‘선생님께서 말씀하십니다. 내 때가 가까이 왔으니, 나는 너와 내 제자들과 함께 유월절을 지키고 있다.’”
  revised_footnotes:
  - marker: a
    text: ‘아무개’는 이름을 밝히지 않지만 특정한 사람을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너와 함께’입니다. 문맥상 그가 마련한 장소에서라는 뜻을 함축할 수 있으나, 본문은 ‘집’을 명시하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘유월절을 지키고 있다’는 직역하면 ‘유월절을 행하고 있다’인 그리스어 관용 표현입니다. ‘유월절을 지낸다’ 또는 ‘유월절을 기념한다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: ‘너의 집에서’를 원문이 명시하는 ‘너와 함께’로 바로잡아 불필요한 구체화를 피했습니다. 현재형 ‘지키고 있다’와 ‘내 때가 가까이 왔다’를 유지하여 원문의 시간적 긴장과 범위를 보존했습니다. 어색한 중복은 병렬 표현으로 다듬었고, 인용 구조와 합쇼체 서술을 현대적인 문장부호로 정리했습니다.
