- from: 그러나 예수께서 이것을 아시고 그들에게 말씀하셨습니다, 「어찌하여 이 여자를 괴롭게 합니까? 그가 내게 아름다운 일을 하였습니다.」
  to: 그러나 예수께서는 이를 아시고 그들에게 말씀하셨습니다. “어찌하여 이 여자를 괴롭게 합니까? 그는 나를 위해 훌륭한 일을 하였습니다.”
  rationale: The revision retains the source's implied object of γνούς ('이를 아시고'), preserves the rebuking question, and renders εἰς ἐμέ idiomatically as '나를 위해.' '훌륭한 일' conveys the positive, noble quality of καλὸν ἔργον naturally in standard Korean.
  reviewer_model: gpt-5.6-terra
