  naturalness: 합쇼체와 전반적 문체는 적절합니다. 그러나 ‘마치 강도를 잡으러 나온 것처럼’이 현대 표준 한국어에서 더 자연스럽고 수사적 질문의 뜻을 명료하게 합니다. ‘성전에 앉아 가르치고 있었는데도’는 미완료 과거와 동시적 분사의 뉘앙스를 자연스럽게 반영합니다.
  terminology: ‘무리’, ‘성전’, ‘강도’는 문맥과 현대 성서 문체에 적합합니다. λῃστής는 상황에 따라 산적·무장 강도 등의 폭넓은 뜻을 가질 수 있으나, 본문에는 일반적인 ‘강도’가 안전하며 별도 각주는 필수적이지 않습니다.
