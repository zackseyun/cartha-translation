  to: 그때 예수께서 무리에게 말씀하셨습니다. “너희가 마치 강도를 잡으러 나온 것처럼 칼과 몽둥이를 가지고 나를 체포하러 나왔습니까? 내가 날마다 성전에 앉아 가르치고 있었는데도, 너희는 나를 붙잡지 않았습니다.”
