revisions:
- from: 「내가 진실로 너희에게 말합니다, 온 세상 어디에서든지 이 좋은 소식이 선포되는 곳에서는, 이 여자가 한 일도 그를 기억하여 말하여질 것입니다.」
  to: 「내가 진실로 너희에게 말합니다. 온 세상 어디에서 이 좋은 소식이 선포되든지, 이 여자가 한 일도 그녀를 기념하는 것으로 전해질 것입니다.」
  rationale: The revision preserves the Greek future passive and the indefinite universal condition while correcting the feminine referent and rendering the memorial sense clearly. “전해질 것입니다” idiomatically represents that the woman’s deed will be spoken of, and “그녀를 기념하는 것으로” retains the function expressed by εἰς μνημόσυνον αὐτῆς.
