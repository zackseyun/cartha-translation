  terminology: ‘명절’은 ἑορτή의 문맥상 자연스러운 번역이며, ‘백성 가운데’와 ‘소동’도 각각 ἐν τῷ λαῷ와 θόρυβος를 적절히 옮깁니다. 신학 용어상의 문제는 없습니다.
