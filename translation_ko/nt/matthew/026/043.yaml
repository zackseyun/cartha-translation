  source_fidelity: 원문의 ἐλθὼν πάλιν은 ‘다시 오셔서’로 자연스럽게 옮길 수 있고, εὗρεν은 단순히 ‘보셨다’보다 ‘찾아내셨다/발견하셨다’가 더 가깝습니다. 또한 βεβαρημένοι는 완료 수동 분사로, 눈이 이미 ‘무거워진 상태’였음을 나타냅니다. 초안의 인과관계는 대체로 맞지만 ‘보셨으니’는 γάρ의 설명적 연결을 다소 흐립니다.
  naturalness: ‘다시 와서’는 주어가 생략되어 다소 불완전하게 들리며, ‘그들이 자고 있는 것을 보셨으니’보다 ‘그들이 자고 있는 것을 다시 발견하셨습니다’가 현대 한국어 서술과 원문의 진행 상태를 더 자연스럽게 반영합니다.
  terminology: 특별한 신학 용어는 없습니다. 존칭 서술을 유지하여 문맥상의 예수님을 적절히 가리킵니다.
