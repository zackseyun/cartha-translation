translation:
  language: ko
  text: 「그러나 내가 너희에게 말합니다. 이제부터는 내가 내 아버지의 나라에서 너희와 함께 그것을 새롭게 마실 그날까지, 이 포도나무 열매에서 난 것을 결코 마시지 않겠습니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '새롭게: 또는 ‘새것으로’ 또는 ‘새로이’. 그리스어는 새로움의 성격이나 질을 가리킬 수도 있으며, 다가오는 나라에서 새로운 방식으로 마시는 것을 뜻할 수도 있습니다.'
    reason: καινόν의 의미가 ‘새로운’ 혹은 ‘새로이’ 사이에서 완전히 확정되지 않으므로, 본문에서는 자연스러운 한국어로 옮기고 가능한 뉘앙스를 각주에 보존합니다.
