  source_fidelity: 초안의 ‘이제’는 δέ의 완만한 접속 기능을 시간 부사로 과도하게 구체화합니다. 또한 ‘그를 거짓으로 고발할 증언’은 ψευδομαρτυρίαν(거짓 증언)을 다소 풀어쓴 표현입니다. 수정문은 미완료 과거의 진행성, 예수를 대상으로 한 거짓 증언, 그리고 죽이려는 목적을 보존합니다.
