  source_fidelity: 첫 문장의 조건절 배열이 그리스어와 달라, 유다가 먼저 넘겨주겠다고 조건을 제시하고 대가를 묻는 듯한 뜻이 됩니다. 원문은 상대가 줄 대가를 먼저 묻고, 그에 따라 넘겨주겠다는 제안입니다. 또한 παραδώσω의 넓은 의미를 본문에서 중립적으로 유지하고 각주로 대안을 밝혀야 합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 협상 장면의 직접화법을 명료하게 전달합니다. ‘은 삼십’은 액수나 화폐 단위를 원문보다 구체화하지 않는 자연스러운 성경 문체입니다.
  terminology: παραδίδωμι는 ‘넘겨주다’로 옮겨 원문의 중립적 표현을 보존합니다. ‘배반하다’는 문맥상 가능한 해석이므로 각주에만 제시합니다. τριάκοντα ἀργύρια는 특정 주화 종류를 단정하지 않고 ‘은 삼십’으로 옮깁니다.
  issues:
  - severity: medium
    issue: 직접화법의 조건·순서가 원문과 다릅니다.
    rationale: 원문은 ‘당신들이 내게 무엇을 주시겠습니까? 그러면 내가 그를 당신들에게 넘겨주겠습니다’라는 제안입니다. 초안의 ‘내가 ... 넘겨주면’은 유다의 넘겨줌을 선행 조건으로 만들어 논리적 초점과 발화 순서를 바꿉니다.
  - severity: low
    issue: παραδώσω의 문맥상 대안에 대한 각주가 없습니다.
    rationale: 본문의 ‘넘겨주다’는 적절하지만, 이 동사는 문맥상 ‘배반하다’로도 번역될 수 있으므로 영어 감사 기록의 어휘적 투명성을 반영하는 각주가 유익합니다.
  revised_text: 그가 말하였습니다. 「당신들은 나에게 무엇을 주시겠습니까? 그러면 내가 그를 당신들에게 넘겨주겠습니다.」 그러자 그들은 그에게 은 삼십을 달아 주었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 “그를 당신들에게 배반하겠습니다.” 그리스어 동사는 “넘겨주다”, “내주다”, 또는 문맥상 “배반하다”를 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 질문 뒤에 이어지는 제안이라는 통사·담화 순서를 회복했습니다. ‘넘겨주다’는 παραδίδωμι의 의미 범위를 과도하게 도덕적으로 해석하지 않으며, ‘배반하다’라는 문맥상 가능한 번역은 각주에 보존했습니다. ‘은 삼십’과 ‘달아 주었습니다’는 원문의 은 화폐/은 조각 및 지급 행위를 자연스럽게 반영합니다.
