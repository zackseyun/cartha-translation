review_pass:
  verdict: revise
  source_fidelity: 원문의 καὶ ἰδού는 ‘그리고 보십시오’로, εἷς τῶν μετὰ Ἰησοῦ는 ‘예수와 함께 있던 사람들 가운데 한 사람이’로 옮겨 서술의 돌발성과 인물 식별의 비특정성을 보존했습니다. ἐκτείνας, ἀπέσπασεν, πατάξας, ἀφεῖλεν의 연속 동작도 ‘손을 뻗어… 뽑아… 쳐… 잘랐습니다’로 충실히 반영했습니다. ‘귀를 잘라 떨어뜨렸습니다’는 원문의 ‘귀를 제거하다/잘라 내다’보다 한국어에서 다소 부자연스럽고, 떨어진 양상을 별도로 부각하므로 ‘귀를 잘랐습니다’로 바로잡았습니다.
  naturalness: 초안의 ‘보아라’는 반말 명령형이어서 합쇼체 본문과 어울리지 않습니다. ‘보십시오’가 현대 한국어의 공적·성경 서술 문체에 자연스럽습니다. 또한 ‘쳐서 그의 귀를 잘랐습니다’는 두 폭력 행위를 자연스럽게 연결하면서도 결과를 분명히 합니다.
  terminology: ‘대제사장’과 ‘종’은 한국어 성경 번역 전통 및 원문의 ἀρχιερεύς와 δοῦλος에 적절합니다. 여기서 ‘종’은 대제사장에게 속한 하위를 뜻하며, 본문에 없는 신분의 세부를 덧붙이지 않습니다. ‘칼’은 μάχαιρα의 일반적이고 안전한 번역입니다.
  issues:
  - severity: medium
    issue: ‘보아라’의 높임말 불일치
    rationale: 요구된 현대 formal-polite 합쇼체와 달리 반말 명령형입니다. ‘보십시오’로 고쳐야 합니다.
  - severity: low
    issue: ‘잘라 떨어뜨렸습니다’의 부자연스러움과 과도한 구체화
    rationale: ἀφεῖλεν은 귀를 잘라 없앤 결과를 뜻하지만, ‘떨어뜨렸다’는 절단된 귀가 떨어지는 모습까지 별도로 강조합니다. ‘귀를 잘랐습니다’가 자연스럽고 원문에 충실합니다.
  revised_text: 그리고 보십시오, 예수와 함께 있던 사람들 가운데 한 사람이 손을 뻗어 자기 칼을 뽑아 대제사장의 종을 쳐서 그의 귀를 잘랐습니다.
