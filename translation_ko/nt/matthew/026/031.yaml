revisions:
- from: 그때에 예수께서 그들에게 말씀하셨습니다, 「오늘 밤에 너희가 다 나로 인해 떨어져 나갈 것입니다. 기록되었기를, ʻ내가 목자를 칠 것이며, 양 떼의 양들이 흩어질 것이다ʼ 하였기 때문입니다.」
  to: 그때 예수께서 그들에게 말씀하십니다. “오늘 밤 너희는 모두 나 때문에 걸려 넘어질 것입니다.[a] 기록되어 있기 때문입니다. ‘내가 목자를 칠 것이며, 그 양 떼의 양들이 흩어질 것이다.’[b]”
  rationale: 본문은 역사적 현재, σκανδαλισθήσεσθε의 비유적 표현, γέγραπται의 성경 인용 공식을 자연스러운 현대 합쇼체로 반영했습니다. ‘그 양 떼의 양들’은 τὰ πρόβατα τῆς ποίμνης에 있는 두 명사를 생략하지 않으면서 한국어 문맥을 매끄럽게 합니다. 어휘 범위와 인용 출처는 각주로 처리하여 본문의 모호성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T06:26:14Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 제자들이 그날 밤 예수님 때문에 넘어지거나 떠날 것을 예고하고, 목자와 양 떼의 인용을 포함한다는 점에서 대체로 원문을 반영합니다. 그러나 σκανδαλισθήσεσθε를 ‘떨어져 나가다’로 옮긴 표현은 한국어에서 부자연스럽고 관계적 이탈이라는 의미도 충분히 분명하지 않습니다. 또한 λέγει의 역사적 현재와 γέγραπται의 현재적 ‘기록되어 있다’ 공식을 더 충실히 반영할 수 있습니다.
  naturalness: ‘그때에’보다 ‘그때’가 현대 표준어 서사에 자연스럽고, ‘양 떼의 양들’은 원문의 의도적인 중복(양/양 떼)을 보존하면서도 ‘그 양 떼의 양들’로 약간 다듬는 편이 자연스럽습니다. 인용문 안의 쉼표 연결보다 문장과 인용부호를 분명히 구분하는 것이 합쇼체 문장에 적절합니다.
  terminology: ‘걸려 넘어지다’는 σκανδαλίζω의 기본 비유를 보존하며, 문맥상 제자들의 이탈이라는 해석 가능성은 각주로 제시합니다. ‘목자’, ‘양 떼’, ‘기록되어 있다’는 성경 인용의 어휘와 격식을 유지합니다. 특정 교파적 의미를 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘나로 인해 떨어져 나갈 것입니다’
    rationale: σκανδαλισθήσεσθε의 문맥상 이탈 의미를 겨냥하지만, 현대 한국어에서 ‘떨어져 나가다’는 물리적 분리의 뉘앙스가 강하고 대상인 예수님에게서 떠난다는 뜻이 불명확합니다.
  - severity: low
    issue: ‘기록되었기를 … 하였기 때문입니다’
    rationale: γέγραπται는 완료 수동의 관용적 성경 인용 공식으로, 현대 한국어에서는 ‘기록되어 있기 때문입니다’가 더 자연스럽고 원문의 현재적 효력을 잘 드러냅니다.
  - severity: low
    issue: 역사적 현재 λέγει 미반영
    rationale: 영어 POB의 번역 방침과 그리스어 현재형을 반영하여 ‘말씀하십니다’로 옮길 수 있습니다. 한국어 서사에서도 문맥상 자연스럽습니다.
  revised_text: 그때 예수께서 그들에게 말씀하십니다. “오늘 밤 너희는 모두 나 때문에 걸려 넘어질 것입니다.[a] 기록되어 있기 때문입니다. ‘내가 목자를 칠 것이며, 그 양 떼의 양들이 흩어질 것이다.’[b]”
