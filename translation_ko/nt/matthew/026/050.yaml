  terminology: Ἑταῖρε는 ‘친구여’가 자연스럽고, 친밀하거나 긍정적인 우정을 과도하게 암시하지 않습니다. κρατέω는 법률 용어인 ‘체포하다’보다 물리적 행위를 살리는 ‘붙잡다’가 적절합니다.
