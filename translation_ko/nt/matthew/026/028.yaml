  source_fidelity: 초안은 핵심 어휘(언약, 피, 많은 사람, 죄 사함)를 대체로 반영하지만, 현재분사 수동형 ἐκχυννόμενον을 ‘흘리는’으로 옮겨 피가 흘려짐을 나타내는 원문의 표현을 충분히 보존하지 못합니다. 또한 τοῦτο와 γάρ의 설명 관계를 더 자연스럽고 정확하게 드러낼 수 있습니다.
  naturalness: ‘언약의 내 피’는 성경적 문체에서는 이해 가능하며, ‘이는 … 피이기 때문입니다’라는 문장은 현대 표준어 합쇼체로 자연스럽습니다. ‘죄 사함을 얻게 하려고’보다 ‘죄 사함을 위하여’가 εἰς ἄφεσιν ἁμαρτιῶν의 목적 표현을 더 직접적으로 반영합니다.
