  - severity: low
    issue: 각주 표지의 의미상 위치
    rationale: ‘유월절 식사’라는 대안은 무교절이 아니라 τὸ πάσχα(유월절)에 관한 것이므로, 해당 표지는 ‘유월절’ 뒤에 두는 것이 적절합니다. 연대기 관련 주석은 ‘무교절 첫날’에 붙이는 것이 내용과 일치합니다.
