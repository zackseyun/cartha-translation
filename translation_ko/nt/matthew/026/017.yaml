    rationale: 헬라어에는 ‘자리’에 해당하는 명사가 없습니다. 이를 넣으면 준비 대상이 유월절 식사 자체에서 식사 장소로 좁혀져 원문의 표현을 과도하게 구체화합니다.
  - severity: low
