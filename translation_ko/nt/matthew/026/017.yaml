  source_fidelity: 개정이 필요합니다. 초안의 ‘자리를’은 헬라어 본문에 없는 목적어를 보충하여 ‘준비하다’의 대상을 식사 장소로 한정합니다. 본문은 제자들이 예수께서 유월절을 드실 수 있도록 준비할 장소를 묻는 표현이므로, 장소를 명시적으로 삽입하지 않는 편이 원문에 더 충실합니다.
  naturalness: ‘당신께서’는 한국어에서 예수께 직접 드리는 말로 부자연스럽고 불필요합니다. ‘우리가 어디에서 유월절을 잡수시도록 준비하기를 원하십니까?’는 현대 표준어 합쇼체로 자연스럽고, 질문의 주체와 존대 관계를 분명히 합니다.
  terminology: ‘무교절’, ‘유월절’, ‘제자들’, ‘예수’는 통용되는 성경 용어입니다. 예수를 향한 직접 발화에는 한국어의 일반적 존대법에 따라 ‘잡수시도록’과 ‘원하십니까’를 사용했습니다. 이는 원문의 신학적 높임을 추가하려는 것이 아니라 한국어 대화 관습을 반영한 것입니다.
