review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sequence, address to the disciples, intense grief, remaining there, and staying awake with Jesus. However, ψυχή is more closely represented by ‘영혼’ than ‘마음’; ‘마음’ is idiomatic but narrows the explicitly stated noun. The command γρηγορεῖτε is adequately conveyed by ‘깨어 있으십시오.’
  naturalness: The wording is natural modern Korean in formal-polite style. Replacing the comma after ‘말씀하셨습니다’ with a colon is required for standard Korean quotation punctuation. ‘죽을 만큼 몹시 슬픕니다’ is natural and retains the idiomatic extremity of ἕως θανάτου.
  terminology: ‘영혼’ preserves the explicit ψυχή without requiring a technical doctrinal interpretation. ‘몹시 슬픕니다’ conveys περίλυπος faithfully. ‘깨어 있으십시오’ retains both literal wakefulness and watchful attentiveness sufficiently in this context.
  issues:
  - severity: medium
    issue: ‘내 마음’ translates ψυχή less explicitly than the source.
    rationale: While ‘마음’ is a natural Korean idiom for inner sorrow, the Greek explicitly says ‘my soul.’ In this solemn biblical statement, ‘내 영혼’ preserves the source wording and its semantic breadth more closely.
  - severity: low
    issue: Quotation punctuation after ‘말씀하셨습니다’ uses a comma.
    rationale: A colon is the standard punctuation before a direct quotation in this construction and resolves the minor structural/punctuation defect.
