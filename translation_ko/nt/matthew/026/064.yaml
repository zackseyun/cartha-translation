source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
  footnotes:
  - marker: a
    text: Or “You said it.” The Greek wording is an idiomatic affirmative reply.
    reason: lexical_alternative
  - marker: b
    text: “Power” is a reverential way of referring to God.
    reason: cultural_note
  - marker: c
    text: An allusion to Daniel 7:13 and Psalm 110:1.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 그에게 말씀하셨습니다. “당신이 그렇게 말하였습니다.[a] 그러나 내가 여러분에게 말씀드립니다. 이제부터 여러분은 인자가 권능[b]의 오른편에 앉아 있고 하늘의 구름을 타고 오는 것을 보게 될 것입니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신이 말하였습니다.” 그리스어 표현은 관용적인 긍정의 대답입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘권능’은 하나님을 가리키는 경칭적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 다니엘 7:13과 시편 110:1을 암시합니다.
    reason: cross_reference
