  source_fidelity: 초안은 핵심 어휘와 구조를 대체로 보존하지만, 두 분사(‘앉아 있는’과 ‘오는’)가 모두 ‘인자’를 수식한다는 구문이 ‘앉은 것과 … 오는 것을’로 분리되어 불명확해졌습니다. 이를 ‘인자가 … 앉아 있고 … 오는 것을’으로 바로잡아야 합니다. 또한 ἀπ’ ἄρτι는 ‘이제부터’로 적절하며, ‘권능’은 하나님을 직접 밝히지 않는 경칭으로 유지하는 것이 좋습니다.
  naturalness: ‘예수께서 그에게 말씀하셨습니다,’ 뒤의 쉼표와 인용 방식, 그리고 인용문 안의 ‘네가 말하였다/말하노니/볼 것이다’는 현대 표준어 합쇼체와 맞지 않습니다. 현대적 정중체로 ‘당신이 그렇게 말하였습니다 … 말씀드립니다 … 보게 될 것입니다’로 통일하는 것이 자연스럽습니다.
  terminology: ‘인자’, ‘권능’, ‘오른편’, ‘하늘의 구름을 타고 오다’는 본문의 전통적·상호본문적 표현을 잘 보존합니다. ‘권능’의 지시 대상을 본문에서 ‘하나님’으로 확정하지 않고 주석으로만 설명해야 합니다.
  issues:
  - severity: high
    issue: 분사 수식 구조가 분리되어 번역되었습니다.
    rationale: καθήμενον과 ἐρχόμενον은 모두 ‘인자’를 수식합니다. 초안의 ‘인자가 권능의 우편에 앉은 것과 하늘 구름을 타고 오는 것을’은 ‘앉은 것’을 별도 관찰 대상으로 읽히게 하므로, 인자가 앉아 있고 오는 것을 본다는 원문의 구조를 명료하게 반영해야 합니다.
  - severity: medium
    issue: 직접화법의 높임말과 문장부호가 목표 문체와 일치하지 않습니다.
    rationale: 현대 formal-polite 합쇼체를 요구하므로 인용문 안의 서술을 ‘말하였습니다/말씀드립니다/보게 될 것입니다’로 통일하고, 한국어 인용부호 앞의 불필요한 쉼표를 제거하는 편이 적절합니다.
  - severity: low
    issue: 영어 감사 기록에 있는 관용적 긍정, ‘권능’의 경칭, 다니엘·시편 암시를 반영하는 주석이 초안에 없습니다.
    rationale: 본문 의미를 과도하게 해석하지 않으면서 독자가 Σὺ εἶπας의 뉘앙스와 ‘권능’의 우회적 신칭, 본문의 성경적 암시를 확인할 수 있도록 앵커 주석을 제공하는 것이 좋습니다.
