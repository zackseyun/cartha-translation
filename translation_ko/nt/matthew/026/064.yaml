  to: 예수께서 그에게 말씀하셨습니다. “당신이 그렇게 말하였습니다.[a] 그러나 내가 여러분에게 말씀드립니다. 이제부터 여러분은 인자가 권능[b]의 오른편에 앉아 있고 하늘의 구름을 타고 오는 것을 보게 될 것입니다.[c]”
  rationale: 원문의 인용문 구조와 두 현재분사의 공동 수식을 보존하고, 현대 표준어 합쇼체로 문체를 일관되게 다듬었습니다. ‘당신이 그렇게 말하였습니다’는 긍정이면서도 단순한 ‘예’로 평준화하지 않는 Σὺ εἶπας의 표현을 반영합니다. ‘권능’을 유지하여 원문의 경칭적 절제를 보존했으며, ‘이제부터’와 미래형을 통해 시간적·종말론적 범위를 특정 해석으로 제한하지 않았습니다.
