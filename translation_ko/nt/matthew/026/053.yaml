  source_fidelity: 초안은 παραστήσει μοι를 ‘내게 두실’로 대체로 옮겼으나, ‘내가 ... 청하면’ 뒤에 ‘그분이 ... 두실 수 없는 줄로’라고 하여 원문의 부정(‘내가 청할 수 없다’)의 범위와 미래 확언(‘그분이 세우실 것이다’)을 모두 ‘그분의 불가능’으로 바꾸었습니다. 이를 바로잡아 예수께서 아버지께 청할 능력과 아버지께서 즉시 천사들을 제공하실 것이라는 뜻을 유지했습니다.
  naturalness: 합쇼체의 직접 질문으로 자연스럽게 다듬었습니다. ‘내 곁에 세우다’는 παραστήσει μοι의 ‘곁에 두어 이용 가능하게 하다’라는 뜻을 비교적 직역적으로 보존하면서도 한국어 문맥에서 이해됩니다.
  terminology: ‘아버지’, ‘천사’, ‘군단’은 본문의 호칭과 군사 비유를 보존합니다. ‘열두 군단보다 더 많은 천사들’은 πλείω δώδεκα λεγιῶνας ἀγγέλων을 충실히 반영합니다.
  issues:
  - severity: high
    issue: 부정과 미래 서술의 범위가 바뀜
    rationale: 초안의 ‘그분이 ... 두실 수 없는 줄로’는 아버지께서 천사들을 두실 수 없다는 능력 부정이 됩니다. 원문은 ‘내가 아버지께 청할 수 없다’는 반문 뒤에, 아버지께서 즉시 제공하실 것이라는 미래 서술을 둡니다.
  - severity: low
    issue: ‘두실’의 의미가 다소 불분명함
    rationale: παραστήσει μοι는 단순히 소유하게 ‘두다’보다 ‘내 곁에 세우다/내게 제공하다’의 뜻입니다.
