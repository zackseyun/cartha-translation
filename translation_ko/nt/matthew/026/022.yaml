review_pass:
  verdict: revise
  source_fidelity: The draft conveys the disciples' intense distress, the ingressive sense of ἤρξαντο λέγειν, the distributive εἷς ἕκαστος, and the negative-answer expectation of μήτι. However, '한 사람씩' is not a natural way to express the distributive response in this context, and the quotation punctuation is incorrectly separated by a comma.
  naturalness: '''몹시 슬퍼하며 저마다 그에게 묻기 시작하였습니다'' is natural modern formal Korean and retains the ongoing sorrow and individual questioning. ''설마 제가 아니겠지요?'' idiomatically expresses the negatively oriented Greek question.'
  terminology: '''주님'' is the standard natural Korean form of address for κύριε when addressing Jesus and retains the project''s intended ''Lord'' rendering without importing additional interpretation.'
  issues:
  - severity: medium
    issue: '''한 사람씩'' is awkward and can suggest grouping or turn-taking in a non-idiomatic way.'
    rationale: εἷς ἕκαστος means that each disciple responded individually; '저마다' directly and naturally conveys this.
  - severity: low
    issue: A comma separates '묻기 시작하였습니다' from the following direct quotation.
    rationale: Korean direct speech should follow the reporting clause without this comma; the revised wording uses a standard full stop before the quotation.
  - severity: low
    issue: '''심히 근심하여'' is understandable but less direct and natural here than an expression of grief.'
    rationale: λυπούμενοι σφόδρα denotes being deeply grieved. '몹시 슬퍼하며' gives the emotional sense naturally while preserving the participial ongoing state.
  revised_text: 그러자 그들은 몹시 슬퍼하며 저마다 그에게 묻기 시작하였습니다. “주님, 설마 제가 아니겠지요?”
  revised_footnotes:
  - marker: a
    text: 그리스어의 μήτι는 부정적인 대답을 예상하는 질문을 이끕니다. 곧 “설마 제가 아니겠지요?”라는 뜻입니다.
    reason: lexical_alternative
  revision_rationale: The revision corrects the Korean distributive expression and quotation punctuation, renders the intensified participle λυπούμενοι σφόδρα more naturally, and preserves the rhetorical negative expectation of μήτι. The explicit object of the question remains unstated, as in the Greek context.
