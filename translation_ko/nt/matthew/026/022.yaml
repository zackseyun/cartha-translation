review_pass:
  verdict: revise
  source_fidelity: ‘심히 근심하여’ is broadly possible for λυπούμενοι σφόδρα, but ‘몹시 슬퍼하여’ more directly conveys the sorrow expressed by the Greek. The distributive εἷς ἕκαστος and μήτι's expectation of a negative answer should be made clearer.
  naturalness: The draft has an unnatural comma before the quotation and the sequence ‘그에게 한 사람씩 묻기 시작하였습니다’ is less fluent than placing ‘한 사람씩’ with the speaking action. ‘설마 … 아니겠지요?’ is natural modern formal-polite Korean for the negative-expected question.
  terminology: ‘주님’ is an appropriate Korean rendering of κύριε when Jesus is addressed in this context. ‘제가’ retains the emphatic first-person reference without adding interpretation.
  issues:
  - severity: medium
    issue: The wording does not explicitly convey the negative-expected force of μήτι.
    rationale: ‘저는 아니지요?’ can function as a simple confirmation question, whereas ‘설마 제가 아니겠지요?’ naturally signals the speaker's expectation that the answer is no.
  - severity: low
    issue: Punctuation and word order are awkward in the Korean draft.
    rationale: A full stop before the direct speech and ‘한 사람씩 그분께 묻기 시작하였습니다’ provide natural Korean syntax while preserving the ingressive ‘began to say.’
  revised_text: 그러자 그들은 몹시 슬퍼하여 한 사람씩 그분께 묻기 시작하였습니다. “주님, 설마 제가 아니겠지요?”
  revised_footnotes: []
  revision_rationale: The revision more closely reflects λυπούμενοι σφόδρα (‘몹시 슬퍼하여’), ἤρξαντο λέγειν (‘묻기 시작하였습니다’), εἷς ἕκαστος (‘한 사람씩’), and μήτι (‘설마 … 아니겠지요?’). It retains the respectful address ‘주님’ and uses modern formal-polite Korean.
