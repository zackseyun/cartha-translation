  source_fidelity: ‘살아난 후에’는 문맥상 부활을 잘 전달하지만, 원문의 수동형 부정과거 부정사(‘내가 일으켜진 후에’)가 드러나지 않습니다. 또한 ‘너희보다 먼저’는 의미상 가능하나 ‘너희보다 앞서’가 προάξω의 ‘앞서 가다’를 더 직접적으로 나타냅니다.
  naturalness: ‘내가 일으켜진 뒤에’는 현대 한국어에서 다소 문어적이지만, 성경 문맥에서는 자연스럽게 이해되며 합쇼체 문장과 어울립니다. ‘갈 것입니다’도 적절합니다.
  terminology: ‘갈릴리’는 통용되는 지명 표기이며, 부활을 가리키는 ‘일으켜지다’는 원문의 수동 표현을 보존합니다. 수동형의 직역적 성격은 각주로 보완합니다.
  issues:
  - severity: medium
    issue: 수동형 ἐγερθῆναι가 본문에서 반영되지 않음
    rationale: ‘내가 살아난 후에’는 자연스럽지만 능동·자동사 표현이어서, ‘내가 일으켜진 후에’라는 원문의 수동형을 보존하지 못합니다.
  - severity: low
    issue: προάξω의 방향적 의미를 더 명시할 필요
    rationale: ‘너희보다 먼저 갈릴리로 갈 것입니다’도 대체로 맞지만, ‘너희보다 앞서’가 ‘너희보다 앞서 가다/go ahead of you’를 더 직접적으로 표현합니다.
  revised_text: 「그러나 내가 일으켜진 뒤에 너희보다 앞서 갈릴리로 갈 것입니다.」
  revised_footnotes:
