    text: 직역하면, “내가 일으켜진 뒤에.” 그리스어는 수동형을 사용합니다. 또는 “내가 살아난 뒤에.”
    reason: 원문의 수동형 부활 표현을 밝히고, 자연스러운 한국어 대안을 제시하기 위함입니다.
  revision_rationale: 원문의 시간 관계와 δέ의 가벼운 대조를 ‘그러나 … 뒤에’로 유지했습니다. ἐγερθῆναι의 수동형은 본문에서 ‘일으켜진’으로 보존하고, 한국어에서 더 관용적인 표현은 각주에 제시했습니다. προάξω는 ‘너희보다 앞서 … 가다’로 옮겨 방향적 선행 의미를 명확히 했습니다.
