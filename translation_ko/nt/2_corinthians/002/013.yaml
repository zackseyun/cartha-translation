  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother, but after taking leave of them, I went on to Macedonia.
  footnotes:
  - marker: a
    text: Or "for my spirit."
    reason: lexical_alternative
  - marker: b
    text: '"My brother" means Titus as Paul''s fellow believer and coworker.'
    reason: cultural_note
  - marker: c
    text: Or "after bidding them farewell."
    reason: lexical_alternative
translation:
  language: ko
  text: 나의 형제 디도[a]를 만나지 못했기 때문에 내 영이 안정을 얻지 못했습니다. 그러나 그들에게 작별을 고하고 마게도냐로 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나의 형제’는 디도가 바울의 신앙 공동체 안의 형제이자 동역자임을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: Τίτον
  english_pob_choice: Titus
  chosen_korean: 디도
  alternatives_korean: []
  lexicon: BDAG
  rationale: 한국 성경 정립 표기.
- source_word: πνεύματί
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 심령
  lexicon: BDAG
  rationale: 본 문맥의 πνεῦμα는 바울 자신의 「영혼·심령」을 가리키며, 신적 영이 아니다.
- source_word: ἄνεσιν
  english_pob_choice: rest
  chosen_korean: 편하다
  alternatives_korean:
  - 안식
  - 여유
  lexicon: BDAG
  rationale: ἄνεσις는 「풀려남·쉼」. 한국어로 「편하지 못하다」로 자연스럽게 옮긴다.
- source_word: ἀποταξάμενος
  english_pob_choice: taking leave
  chosen_korean: 작별을 고하다
  alternatives_korean:
  - 하직하다
  lexicon: BDAG
  rationale: 공식적 작별 인사.
