  source_fidelity: 원문의 완료형 ἔσχηκα는 이 서술 맥락에서 과거의 상태로 옮길 수 있으며, τῷ μὴ εὑρεῖν의 이유 관계와 ἀποταξάμενος의 선행 행위도 번역에 반영되어 있습니다. 다만 ἄνεσις는 단순한 신체적·일상적 ‘불편함’보다 내적인 쉼 또는 안정을 뜻하므로 이를 더 정확히 드러내는 표현이 적절합니다.
  naturalness: ‘내 영이 편하지 못하여’도 이해되지만 현대 표준어에서는 다소 직역적이고 ‘편하다’의 일상적 의미가 강합니다. ‘내 영이 안정을 얻지 못했습니다’가 문맥상 더 자연스럽고 원문의 내적 불안을 잘 전달합니다.
  terminology: ‘디도’, ‘마게도냐’는 한국어 성경의 통용 표기와 일치합니다. ἀδελφός의 은유를 본문에서는 ‘나의 형제’로 보존하고, 신앙 공동체 안의 관계임을 각주로 밝혀 생물학적 형제로 한정될 가능성을 줄였습니다.
