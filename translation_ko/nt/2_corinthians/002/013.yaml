    rationale: ἄνεσις는 이 문맥에서 바울의 내적 쉼·안정의 부재를 나타냅니다. ‘안정을 얻지 못했습니다’가 현대 한국어에서 더 자연스럽고 의미 범위도 더 잘 보존합니다.
