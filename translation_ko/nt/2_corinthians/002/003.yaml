translation:
  language: ko
  text: 내가 바로 이 일을 쓴 것은, 내가 갔을 때 나를 기쁘게 해야 할 사람들에게서[a] 도리어 슬픔을 겪지 않기 위해서입니다. 이는 나의 기쁨이 여러분 모두의 기쁨이라는 것을, 여러분 모두에 대해 확신하고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역, “내가 기뻐해야 할 이들에게서.”
    reason: ἀφ’ ὧν ἔδει με χαίρειν의 어순과 관계 표현을 보완하여, 본문의 자연스러운 관계적 번역이 지닌 해석적 요소를 투명하게 제시합니다.
