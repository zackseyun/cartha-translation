translation:
  language: ko
  text: 여러분이 누구의 어떤 잘못이든 용서하면, 나도 그렇게 합니다. 사실 나도, 내가 용서한 것이 있다면—내가 무엇인가를 용서했다면—그것을 여러분을 위하여 메시아 앞에서[a] 용서한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “메시아를 대신하여.”
    reason: ἐν προσώπῳ Χριστοῦ는 문자적으로 ‘메시아의 얼굴/면전 안에서’이며, 문맥상 메시아 앞에서 행한다는 뜻과 메시아의 인격 또는 대리로 행한다는 뜻으로 이해될 수 있다.
