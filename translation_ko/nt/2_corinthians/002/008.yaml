  terminology: ‘권합니다’와 ‘확증해 주십시오’는 본문의 권면 및 공식적 확증의 뉘앙스를 무리 없이 전달합니다. ‘굳게’는 원문의 의미를 과도하게 바꾸지는 않지만, κυρῶσαι 자체에 이미 확증의 강도가 있으므로 생략하는 편이 더 절제되고 정확합니다.
