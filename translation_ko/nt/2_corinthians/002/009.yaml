    issue: ‘내가 또한 쓴 것도’라는 표현
    rationale: ‘또한’과 ‘-것도’가 중복되어 문장이 어색합니다.
  - severity: medium
    issue: ‘그 시험을 통과한 증거’라는 δοκιμή 번역
    rationale: 원문의 명사 δοκιμή를 ‘시험’과 ‘통과한 증거’로 확대하여 표현하고, ‘그’의 선행 내용도 불명확합니다. δοκιμή가 시험 자체인지 시험을 통해 드러난 입증/검증됨인지의 어휘적 여지를 각주로 남기는 편이 안전합니다.
