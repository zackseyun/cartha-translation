  source_fidelity: 초안의 ‘시험을 통과한 증거’는 δοκιμή를 이중으로 풀어 쓰면서, 바울이 알고자 한 대상이 ‘여러분의 검증됨/입증됨’이라는 점을 다소 부자연스럽게 만듭니다. 또한 ‘내가 또한 쓴 것도’는 문법적으로 겹칩니다. 개정문은 εἰς τοῦτο γὰρ καὶ ἔγραψα, ἵνα γνῶ와 εἰ 이하의 간접의문문을 보존합니다.
  naturalness: ‘내가 또한 이렇게 쓴 것은 바로 이 때문입니다’는 현대 표준어 합쇼체에 자연스럽습니다. ‘여러분의 검증됨’은 다소 문어적이지만 δοκιμή의 결과적 의미를 과도하게 해석하지 않고 보존하는 데 적합하며, 각주로 대안을 제시합니다.
  terminology: ὑπήκοοι는 ‘순종하는지’로 일관되게 옮겼습니다. δοκιμή는 특정 교리적 의미를 덧붙이지 않고 ‘검증됨’으로 옮기며, ‘시험’ 및 ‘입증’의 어휘 범위는 각주에서 밝혔습니다.
  issues:
