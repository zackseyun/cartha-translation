  to: 누가 슬픔을 끼쳤다면, 그는 나를 슬프게 한 것이 아니라, 어느 정도는 여러분 모두를 슬프게 한 것입니다. 내가 여러분 모두에게 너무 큰 부담을 지우지 않으려고 이렇게 말합니다.
