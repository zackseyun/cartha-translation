review_pass:
  verdict: revise
  source_fidelity: 초안은 ἀπὸ μέρους를 ‘어느 정도’로 옮긴 점은 적절합니다. 그러나 ἐπιβαρῶ는 기본적으로 ‘부담을 지우다/짐을 더하다’이며, ‘과도하게 말하다’는 본문의 부담 비유를 ‘말의 과장’으로 지나치게 해석하여 바꿉니다. 또한 “「어느 정도」라고 합니다”는 원문에 없는 직접적인 해설 발화입니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, ‘이렇게 말합니다’는 ἵνα 절이 나타내는 바울의 완화된 진술 목적을 한국어 문장 구조 안에서 무리 없이 드러냅니다.
  terminology: λυπέω의 반복은 ‘슬픔을 끼치다/슬프게 하다’로 연결해 보존했습니다. ἐπιβαρέω는 ‘너무 큰 부담을 지우다’로 옮겨 원어의 짐 비유와 수신자 ‘여러분 모두’를 유지했습니다.
  issues:
  - severity: medium
    issue: ἐπιβαρῶ를 ‘과도하게 말하지 않다’로 번역함
    rationale: 이는 원문의 ‘부담을 지우다’라는 표현을 ‘과장하다’로 좁혀 바꾸며, 비유의 어휘적 연결을 보존하지 못합니다.
  - severity: medium
    issue: ‘「어느 정도」라고 합니다’라는 직접 해설을 추가함
    rationale: 원문은 바울이 자신의 표현을 완화하는 목적을 나타내지만, 인용 표현을 직접 발화로 제시하지는 않습니다.
