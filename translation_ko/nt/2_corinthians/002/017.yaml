translation:
  language: ko
  text: 우리는 많은 이들처럼 하나님의 말씀을 이익을 위해 팔아 장사하지 않습니다. 오히려 진실함에서, 하나님께로부터, 하나님 앞에서 메시아 안에서 말합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καπηλεύοντες
  english_pob_choice: peddling
  chosen_korean: 장사하다
  alternatives_korean:
  - 행상하다
  - 이익을 위해 팔다
  lexicon: BDAG
  rationale: κάπηλος는 「소매상·행상」으로, 이익을 위해 물건을 섞어 파는 부정적 함의. 「장사하다」가 본문의 비판적 어조를 담는다.
- source_word: εἰλικρινείας
  english_pob_choice: sincerity
  chosen_korean: 진실함
  alternatives_korean:
  - 순전함
  lexicon: BDAG
  rationale: 1:12와 일관되게 「진실함」.
- source_word: κατέναντι θεοῦ
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님 면전에서
  lexicon: BDAG
  rationale: 책임적 임재 의식의 정형구.
