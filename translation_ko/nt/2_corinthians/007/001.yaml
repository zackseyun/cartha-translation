revisions:
- from: 그러므로 사랑하는 자 여러분, 우리에게 이런 약속이 있으니, 육과 영의 모든 더러움에서 우리 자신을 깨끗하게 하고, 하나님을 두려워하는 가운데 거룩함을 온전히 이루어 가십시다.
  to: 그러므로 사랑하는 여러분, 우리에게 이러한 약속들이 있으므로 육과 영의 온갖 더러움에서 우리 자신을 깨끗하게 하고, 하나님을 경외하는 가운데 거룩함을 완성해 갑시다.
  rationale: The revision corrects the nonstandard hortatory form, improves the vocative’s naturalness, and makes the completion nuance of ἐπιτελοῦντες more explicit. “경외하는” is used for the idiomatic Korean expression of fear of God; it denotes reverent fear rather than reducing the phrase to mere terror.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:24:15Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential οὖν, the inclusive hortatory force of καθαρίσωμεν, the comprehensive scope of defilement affecting flesh and spirit, and holiness pursued before God. The wording for ἐπιτελοῦντες should more clearly retain the sense of bringing holiness to its intended completion.
  naturalness: Most of the verse is natural modern Korean. However, “사랑하는 자 여러분” is less idiomatic than “사랑하는 여러분,” and “이루어 가십시다” is not the standard 합쇼체 inclusive hortatory form; “이루어 갑시다” is required.
  terminology: “육과 영,” “더러움,” and “거룩함” appropriately preserve the source’s terminology without importing a doctrinally narrowed meaning. “하나님을 경외하는 가운데” naturally conveys φόβῳ θεοῦ as reverent fear while retaining its biblical gravity.
  issues:
  - severity: low
    issue: 호칭 “사랑하는 자 여러분”
    rationale: ἀγαπητοί is naturally rendered in contemporary formal Korean as “사랑하는 여러분.” The added “자” is understandable but stylistically stiff.
  - severity: medium
    issue: “이루어 가십시다”의 청유형 형태
    rationale: The standard formal-polite first-person plural exhortation is “이루어 갑시다,” not “이루어 가십시다.” This must be corrected for the requested register.
  - severity: low
    issue: “온전히 이루어 가다”의 완료 뉘앙스
    rationale: ἐπιτελοῦντες denotes carrying holiness through to completion. “거룩함을 완성해 갑시다” expresses this more explicitly while preserving the ongoing, exhortative sense.
  revised_text: 그러므로 사랑하는 여러분, 우리에게 이러한 약속들이 있으므로 육과 영의 온갖 더러움에서 우리 자신을 깨끗하게 하고, 하나님을 경외하는 가운데 거룩함을 완성해 갑시다.
  revised_footnotes: []
  revision_rationale: The revision corrects the nonstandard hortatory form, improves the vocative’s naturalness, and makes the completion nuance of ἐπιτελοῦντες more explicit. “경외하는” is used for the idiomatic Korean expression of fear of God; it denotes reverent fear rather than reducing the phrase to mere terror.
