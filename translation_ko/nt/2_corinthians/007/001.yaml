  - marker: b
    text: Or 'perfecting holiness in the fear of God.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'fear of God' carries the sense of reverent awe before God, not mere terror.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 사랑하는 여러분, 우리에게 이러한 약속들이 있으므로 육과 영의 온갖 더러움에서 우리 자신을 깨끗하게 하고, 하나님을 경외하는 가운데 거룩함을 완성해 갑시다.
  philosophy: optimal-equivalence
