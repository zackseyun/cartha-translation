    reason: textual_variant
  revision_rationale: The text is revised to express the concessive force of εἰ καί, to render ὑπὲρ ἡμῶν as concern directed toward Paul and his companions, and to retain the deliberately difficult syntax of the printed text through '여러분 가운데.' The manuscript variant is supplied in a footnote rather than adopted, and the lexical range of σπουδή is noted.
