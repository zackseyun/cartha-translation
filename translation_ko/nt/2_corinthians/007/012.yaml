    text: Or 'your diligence,' 'your zeal,' or 'your deep concern.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 비록 내가 여러분에게 편지를 썼더라도, 그것은 불의를 행한 사람 때문도, 불의를 당한 사람 때문도 아니라, 우리를 향한 여러분의 열심[a]이 하나님 앞에서 여러분 가운데 드러나게 하려는 것이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 부지런함’, ‘여러분의 열정’, 또는 ‘여러분의 깊은 관심’.
    reason: lexical_alternative
  - marker: b
    text: 어떤 사본에는 ‘하나님 앞에서 여러분 가운데 여러분을 향한 우리의 열심이 드러나게 하려는 것이었습니다’라고 되어 있습니다.
    reason: textual_variant
