  text: 우리는 그가 온 것으로만 위로를 받은 것이 아니라, 그가 여러분으로 말미암아 받은 위로로도 위로를 받았습니다. 그는 우리에게 여러분의 사모함과 애통함과 나를 향한 여러분의 열심을 전해 주었고, 그 결과 나는 더욱 기뻐하였습니다.
