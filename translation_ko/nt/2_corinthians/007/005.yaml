  source_fidelity: 원문의 완료형 표현(‘쉼을 얻지 못했다’)과 수동 분사 θλιβόμενοι(‘압박을 받았다’) 및 외적·내적 대조를 충실히 반영하도록 다듬었습니다. σάρξ는 윤리적 의미가 아닌 인간의 연약한 육체를 가리키므로 ‘육신’을 유지했습니다.
  naturalness: ‘우리 육신에는 안식이 전혀 없었습니다’는 현대 한국어에서 다소 경직되고 ‘안식’이 예배·종말론적 의미로 들릴 수 있습니다. ‘우리 육신은 조금도 쉼을 얻지 못했습니다’가 원문의 뜻을 보존하면서 더 자연스럽습니다. ‘밖으로는 … 안으로는 …’의 압축된 대조는 유지했습니다.
  terminology: ‘육신’은 σάρξ의 문자적 표현을 보존합니다. ἄνεσις는 여기서 신학적 ‘안식’보다는 고난 가운데 누리는 ‘쉼/안도’이므로 ‘쉼’을 사용했습니다. μάχαι는 실제 전투로 한정하지 않고 ‘다툼’, φόβοι는 ‘두려움’으로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘안식’의 어감
    rationale: ἄνεσις는 이 문맥에서 압박으로부터의 쉼·안도를 뜻합니다. ‘안식’은 현대 한국어에서 예배일이나 종말론적 안식을 연상시킬 수 있어, ‘쉼’이 더 자연스럽고 문맥에 맞습니다.
  - severity: low
    issue: ‘모든 면에서 환난을 당하였으니’의 연결
    rationale: 원문은 대조 접속사 ἀλλά와 분사로 ‘그러나/오히려 모든 면에서 압박을 받는’ 상태를 말합니다. 이를 분명히 드러내면 논리 관계가 더 잘 살아납니다.
  revised_text: 사실 우리가 마게도냐에 이르렀을 때에도, 우리 육신은 조금도 쉼을 얻지 못했습니다. 오히려 모든 면에서 압박을 받았습니다. 밖으로는 다툼이 있고 안으로는 두려움이 있었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘우리 자신은 조금도 쉼을 얻지 못했습니다.’ 그리스어는 문자적으로 ‘우리 육신’을 말합니다.
    reason: lexical_alternative
  revision_rationale: 원문의 설명적 강조(Καὶ γάρ)는 ‘사실’로, 시간적 상황은 ‘이르렀을 때에도’로 반영했습니다. ‘육신’을 본문에 유지하되, 현대어 독자가 해당 표현을 육체 자체에만 한정하지 않도록 대안적 의미를 각주에 제시했습니다. 외적 다툼과 내적 두려움이라는 대조와, 압박이 전방위적이었다는 표현을 보존했습니다.
