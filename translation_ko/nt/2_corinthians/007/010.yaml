base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret, but worldly sorrow produces death.
  footnotes:
  - marker: a
    text: Or 'according to God' sorrow. The Greek phrase is more literally 'sorrow according to God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a repentance not to be regretted leading to salvation.' The adjective 'without regret / not to be regretted' may be understood as describing the repentance more directly.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님 뜻에 따른 슬픔은 후회할 것이 없는, 구원에 이르는 회개를 낳지만[b], 세상의 슬픔은 죽음을 낳습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘후회할 것이 없는’은 그리스어에서 ‘회개’를 직접 수식하는 것으로, 또는 ‘구원에 이르는 회개’ 전체와 관련된 것으로 이해될 수 있습니다.
    reason: lexical_alternative
