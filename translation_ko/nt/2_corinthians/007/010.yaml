  source_fidelity: 현 문안의 ‘하나님께서 원하시는’은 κατὰ θεόν의 뜻을 대체로 전달하지만, ‘하나님 뜻에 따른’이 원문의 ‘하나님에 부합하는/하나님을 기준으로 하는’ 뉘앙스를 더 직접적으로 보존합니다. 또한 ‘후회 없는 구원’은 ἀμεταμέλητον을 구원에만 연결해 보이게 하므로, 원문의 문법적 수식 범위 논점을 각주로 밝혀야 합니다.
  naturalness: ‘슬픔은 … 회개를 이루지만’과 ‘슬픔은 죽음을 이룹니다’는 현대 한국어에서 다소 부자연스럽습니다. 두 절의 평행을 유지하여 ‘낳습니다’를 쓰는 편이 자연스럽고 명료합니다.
  terminology: ‘회개’, ‘구원’, ‘죽음’은 확립된 성서 한국어 용어이며 적절합니다. ‘하나님 뜻에 따른 슬픔’은 합쇼체의 현대 표준어로 자연스럽고, 특정 교리적 해석을 덧붙이지 않습니다.
  issues:
  - severity: medium
    issue: ἀμεταμέλητον의 수식 범위가 본문에서 ‘구원’으로 사실상 고정됨
    rationale: 이 형용사는 문법상 ‘회개’ 또는 ‘구원’과 관련하여 이해될 수 있으며, 영어 감사 기록도 그 논점을 각주로 보존합니다. 한국어 본문은 자연스러운 한 해석을 택하되 대안적 연결을 각주로 밝혀야 합니다.
  - severity: low
    issue: ‘이루다’의 결합이 부자연스러움
    rationale: 슬픔이 회개나 죽음을 ‘이룬다’는 표현은 현대 한국어에서 어색합니다. ἐργάζεται/κατεργάζεται의 결과 산출 의미와 대구를 ‘낳습니다’로 자연스럽게 옮길 수 있습니다.
  - severity: low
    issue: κατὰ θεόν의 표현이 다소 의역적임
    rationale: ‘하나님께서 원하시는’도 가능한 해석이지만, ‘하나님 뜻에 따른’이 원문의 기준·일치의 의미를 더 투명하게 나타냅니다.
  revised_text: 하나님 뜻에 따른 슬픔은 후회할 것이 없는, 구원에 이르는 회개를 낳지만[b], 세상의 슬픔은 죽음을 낳습니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘하나님에 따른 슬픔’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘후회할 것이 없는’은 그리스어에서 ‘회개’를 직접 수식하는 것으로, 또는 ‘구원에 이르는 회개’ 전체와 관련된 것으로 이해될 수 있습니다.
    reason: lexical_alternative
  revision_rationale: κατὰ θεόν을 ‘하나님 뜻에 따른’으로 옮겨 원문의 의미를 더 투명하게 반영했습니다. ἀμεταμέλητον은 한국어 본문에서 자연스럽게 ‘회개’에 연결하되, 수식 범위에 관한 원문의 해석상 여지를 각주로 보존했습니다. 두 동사는 한국어의 자연스러운 대구를 위해 모두 ‘낳습니다’로 옮겼습니다.
