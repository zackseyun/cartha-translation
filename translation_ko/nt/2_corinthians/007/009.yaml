base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice, not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God, so that you might suffer no loss from us.
  footnotes:
  - marker: a
    text: Or 'to repentance.'
