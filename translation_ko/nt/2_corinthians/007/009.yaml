translation:
  language: ko
  text: 이제 나는 기뻐합니다. 여러분이 슬퍼하게 되었기 때문이 아니라, 슬퍼하여 회개에 이르게 되었기 때문입니다. 여러분이 하나님의 뜻대로 슬퍼했으므로, 여러분이 우리로 말미암아 아무런 손해도 입지 않게 하려는 것이었습니다.
  philosophy: optimal-equivalence
