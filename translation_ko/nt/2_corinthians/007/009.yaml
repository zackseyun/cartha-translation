    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내가 기뻐하는 것은 여러분이 슬퍼했기 때문이 아니라, 여러분이 슬픔으로 회개에 이르렀기 때문입니다. 이는 여러분이 하나님께서 원하시는 방식으로 슬퍼했기에, 우리로 인해 어떤 손해도 입지 않게 하려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάνοιαν
  english_pob_choice: change of mind
  chosen_korean: 회개
  alternatives_korean:
  - 생각의 변화
  lexicon: BDAG
  rationale: μετάνοια는 「생각·방향의 전환」. 한국어 「회개」 정립.
- source_word: κατὰ θεόν
  english_pob_choice: according to God
  chosen_korean: 하나님께서 원하시는 방식으로
  alternatives_korean:
  - 하나님을 따라
  lexicon: BDAG
  rationale: 하나님의 뜻에 부합한 슬픔의 양식.
- source_word: ζημιωθῆτε
  english_pob_choice: suffer loss
  chosen_korean: 손해를 입다
  alternatives_korean: []
  lexicon: BDAG
  rationale: ζημία는 「손실·손해」.
