review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 τὸ κατὰ θεὸν λυπηθῆναι는 ‘하나님 뜻대로 슬퍼한 바로 그 일’로 옮기는 것이 자연스럽고, πόσην은 감탄문의 ‘얼마나 큰’으로 보존해야 합니다. 또한 κατειργάσατο의 목적어는 뒤따르는 일곱 항목 전체입니다. 현 초안은 첫 ‘열심’을 먼저 ‘이루었습니까’의 목적어로 처리한 뒤 나머지 항목을 별도 문장에 연결하여 원문의 병렬 구조를 흐립니다. ἐκδίκησιν은 문맥상 잘못에 대하여 취한 바로잡는 조치를 가리키므로, 특정한 ‘신원’으로 한정하지 않는 편이 안전합니다.
  naturalness: ‘슬퍼한 바로 그 일’ 및 ‘자신이 깨끗하다는 것’은 다소 어색하거나 지시 대상이 불분명합니다. ‘하나님 뜻대로 슬퍼한 바로 그 일’, ‘그 일에 대하여 자신들이 깨끗함’으로 하면 현대 표준어 합쇼체에서 더 자연스럽고 명료합니다. 반복되는 ἀλλά의 열거는 ‘그뿐 아니라 …도’의 누적으로 살렸습니다.
  terminology: σπουδή는 ‘간절함’, ζῆλος는 ‘열심’으로 구별했습니다. ἀπολογία는 여기서 법률 대리인을 뜻하기 쉬운 ‘변호’보다 ‘해명’이 문맥에 맞습니다. ἁγνούς는 도덕적·사건 관련 결백을 포괄하는 ‘깨끗함’으로 유지했습니다.
  issues:
  - severity: medium
    issue: 일곱 항목의 병렬 목적어 구조가 분리되어 있습니다.
    rationale: πόσην κατειργάσατο ὑμῖν σπουδήν 뒤의 ἀλλά 반복은 σπουδή를 포함한 연속된 반응들을 열거합니다. 초안은 ‘열심’을 첫 문장에 고정하고 나머지를 별도 술어에 연결합니다.
  - severity: medium
    issue: ἐκδίκησιν을 ‘신원’으로 한정했습니다.
    rationale: ‘신원’은 누명을 벗기거나 원한을 풀어 줌의 뜻으로 좁게 들립니다. 이 문맥의 ἐκδίκησις는 잘못에 대한 처분·시정·정의의 실현을 포함하므로 ‘시정 조치’가 덜 한정적입니다.
  - severity: low
    issue: ἀπολογίαν의 ‘변호’는 한국어에서 법률 대리 행위를 연상시킬 수 있습니다.
    rationale: 고린도 교인들이 자신들의 태도와 무관함을 밝혔다는 문맥에는 ‘해명’이 더 직접적입니다.
