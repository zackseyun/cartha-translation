revisions:
- from: 보십시오, 하나님께서 원하시는 방식으로 슬퍼한 바로 그 일이 여러분에게 얼마나 큰 열심을 이루었습니까. 또한 변호와 분개와 두려움과 사모함과 열심과 신원을 이루었습니다. 여러분은 모든 면에서 이 일에 자신이 깨끗하다는 것을 입증하였습니다.
  to: 보십시오. 하나님 뜻대로 슬퍼한 바로 그 일이 여러분 안에 얼마나 큰 간절함을 이루어 냈습니까! 그뿐 아니라 해명[ㅏ]도, 분개도, 두려움도, 사모함도, 열심도, 시정 조치[ㅂ]도 이루어 냈습니다. 여러분은 모든 면에서 그 일에 대하여 자신들이 깨끗함을 입증하였습니다.
  rationale: 원문의 감탄문과 일곱 겹의 누적 열거를 한국어 문장 안에서 보존했습니다. ‘하나님 뜻대로’는 κατὰ θεόν의 자연스러운 한국어 표현이며, 그 대안적 표현은 본문에 불필요한 해석을 더하지 않습니다. ἐκδίκησις의 논쟁 가능한 뉘앙스는 본문에서 포괄적으로 옮기고 각주로 대안을 제시했습니다.
