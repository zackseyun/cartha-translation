  to: 내가 여러분에 대하여 그에게 조금이라도 자랑했다면, 나는 부끄러움을 당하지 않았습니다. 도리어 우리가 여러분에게 모든 것을 진실하게 말한 것 같이, 디도에게 한 우리의 자랑도 진실한 것으로 드러났습니다.
