  text: For even if I grieved you with the letter, I do not regret it—though I did regret it, for I see that that letter grieved you, though only for a time.
  footnotes:
  - marker: a
    text: Or 'though I was regretting it.' The Greek imperfect may emphasize a past state of regret.
