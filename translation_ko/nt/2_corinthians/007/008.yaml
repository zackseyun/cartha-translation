  to: 내가 편지로 여러분을 슬프게 하였더라도, 나는 후회하지 않습니다. 비록 내가 후회하기도 하였지만, 이는 내가 그 편지가 비록 잠시 동안 여러분을 슬프게 했음을 알기 때문입니다.
  rationale: 원문의 μεταμέλομαι/μετεμελόμην의 대조는 ‘후회하지 않습니다/후회하기도 하였지만’으로 유지했습니다. 두 차례의 εἰ καὶ는 각각 ‘…하였더라도’와 ‘비록 … 동안’으로 반영했으며, πρὸς ὥραν은 문자적 한 시간이 아니라 짧은 기간이라는 뜻으로 ‘잠시 동안’으로 옮겼습니다. 괄호는 한국어 본문에서 별도 괄호 없이도 자연스럽게 종속 구조로 처리하되, 원문의 설명적 인과 관계는 ‘이는 … 때문입니다’로 보존했습니다.
