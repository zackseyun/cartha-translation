translation:
  language: ko
  text: 내가 편지로 여러분을 슬프게 하였더라도, 나는 후회하지 않습니다. 비록 내가 후회하기도 하였지만, 이는 내가 그 편지가 비록 잠시 동안 여러분을 슬프게 했음을 알기 때문입니다.
  philosophy: optimal-equivalence
