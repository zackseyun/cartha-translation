  rationale: 디도의 σπλάγχνα를 ‘깊은 애정’으로 명확히 하고, 그 애정이 고린도 성도들을 향해 ‘더욱 커진다’는 비교의 뜻을 자연스럽게 살렸습니다. 또한 ὡς절을 ‘순종’의 구체적 내용으로 매끄럽게 연결했으며, ‘두려움과 떨림’은 본문에 유지하고 각주로 가능한 관용적 뉘앙스를 제시했습니다.
