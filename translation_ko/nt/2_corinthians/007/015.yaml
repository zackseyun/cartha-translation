  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you, how you received him with fear and trembling.
  footnotes:
  - marker: a
    text: Or 'with reverence and trembling'; the phrase 'fear and trembling' is a Pauline idiom for serious, humble responsiveness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 여러분 모두의 순종, 곧 여러분이 두려움과 떨림으로[a] 그를 영접한 일을 기억할 때, 여러분을 향한 그의 깊은 애정은 더욱 커집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경외함과 떨림으로’. ‘두려움과 떨림’은 바울이 गंभीर하고 겸손한 태도를 나타낼 때 사용하는 표현입니다.
    reason: ‘두려움과 떨림’이라는 직역적이고 전통적인 표현을 본문에 보존하면서, 문맥상 그것이 단순한 공포만을 뜻하지 않는다는 점을 밝혀 줍니다.
