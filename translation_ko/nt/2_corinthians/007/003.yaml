base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you, for I have said before that you are in our hearts, to die together and to live together.
  footnotes:
  - marker: a
    text: Or 'for condemnation' or 'with a view to condemnation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for dying together and living together.' The Greek emphasizes shared solidarity in both death and life.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 말을 하는 것은 여러분을 정죄하려는 뜻이 아닙니다.[a] 나는 이미 여러분이 함께 죽고 함께 살기까지 우리 마음속에 있다고 말했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정죄를 목적으로’ 또는 ‘정죄하려는 의도로’.
    reason: πρὸς κατάκρισιν은 목적 또는 지향을 나타낼 수 있습니다.
  - marker: b
    text: 또는 ‘여러분은 우리 마음속에 있습니다. 함께 죽고 함께 살기까지.’ 그리스어는 죽음과 삶 모두에서 나누는 연대를 강조합니다.
    reason: εἰς τὸ συναποθανεῖν καὶ συζῆν의 수식 관계와 εἰς의 뉘앙스는 다소 논의되며, 두 συν- 동사의 공동성을 분명히 할 필요가 있습니다.
