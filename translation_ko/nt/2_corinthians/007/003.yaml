review_pass:
  verdict: revise
  source_fidelity: 초안은 κατάκρισιν을 ‘정죄’로 옮기고 συναποθανεῖν/συζῆν의 공동성을 ‘함께 죽고 함께 살다’로 보존한 점은 적절합니다. 그러나 ‘앞서 말한 대로’는 προείρηκα γὰρ ὅτι의 직접 인용 내용을 충분히 드러내지 못하며, ‘살게 되어 있습니다’는 원문에 없는 예정·필연의 뉘앙스를 더합니다.
  naturalness: ‘여러분은 우리 마음에 있어’는 현대 합쇼체 문장으로 다소 어색하고, 뒤의 ‘함께 죽고 함께 살게 되어 있습니다’와의 연결도 부자연스럽습니다. ‘우리 마음속에 있습니다’와 ‘함께 죽고 함께 살기까지’를 사용하면 자연스러우면서도 강한 연대의 수사를 유지합니다.
  terminology: ‘정죄’는 바울 서신의 용례 및 고린도후서 3:9의 표현과 일관되어 적절합니다. ‘마음속’은 καρδία의 비유적 용법을 자연스럽게 전달하며, ‘함께 죽고 함께 살다’는 두 συν- 동사의 병행과 공동성을 보존합니다.
  issues:
  - severity: medium
    issue: προείρηκα γὰρ ὅτι의 내용 관계가 약화됨
    rationale: ‘앞서 말한 대로’는 ‘나는 이미 …이라고 말했습니다’라는 완결된 발화와 그 내용을 직접적으로 나타내지 않습니다.
  - severity: medium
    issue: ‘살게 되어 있습니다’가 원문에 없는 예정성·필연성을 첨가함
    rationale: συζῆν은 ‘함께 살다’이며, εἰς τὸ συναποθανεῖν καὶ συζῆν은 상호 연대의 강도를 표현합니다. ‘-게 되어 있다’는 그 의미를 미래의 운명 또는 정해진 상태로 바꿀 수 있습니다.
  - severity: low
    issue: ‘우리 마음에 있어’의 현대 한국어 자연스러움 부족
    rationale: 비유적 애정을 표현하는 문맥에서는 ‘우리 마음속에 있습니다’가 더 자연스럽고 정중한 문장입니다.
  revised_text: 내가 이 말을 하는 것은 여러분을 정죄하려는 뜻이 아닙니다.[a] 나는 이미 여러분이 함께 죽고 함께 살기까지 우리 마음속에 있다고 말했습니다.[b]
