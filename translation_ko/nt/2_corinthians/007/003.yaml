  source_fidelity: 개정이 필요합니다. 초안의 ‘앞서 말한 대로’는 γὰρ προείρηκα ὅτι(‘내가 이미 말했기 때문입니다’)의 인과절과 ὅτι절의 구조를 ‘~한 대로’로 바꾸어 약화합니다. 또한 ‘함께 죽고 함께 살게 되어 있습니다’는 εἰς τὸ συναποθανεῖν καὶ συζῆν에 예정·필연의 뜻을 더합니다. 원문은 바울과 고린도 교인들의 죽음과 삶의 연대를 강하게 표현합니다.
