- from: 이런 까닭에 우리가 위로를 받았습니다. 우리의 위로에 더하여 우리는 디도의 기쁨으로 인해 더욱 풍성히 기뻐하였습니다. 이는 그의 영이 여러분 모두로 인해 안식을 얻었기 때문입니다.
  to: 이런 까닭에 우리가 위로를 받았습니다. 우리의 위로에 더하여 우리는 디도가 기뻐한 것을 두고 더욱더 기뻐하였습니다. 그의 영이 여러분 모두에게서 새 힘을 얻었기 때문입니다.
  rationale: The revision retains the source's perfect-result nuance in natural Korean, keeps '영' for πνεῦμα without identifying it as the Holy Spirit, and replaces the less contextual '안식' with '새 힘' to convey interpersonal refreshment. '디도가 기뻐한 것을 두고' naturally represents rejoicing over Titus's joy, and '더욱더' reflects the emphatic comparative expression περισσοτέρως μᾶλλον.
