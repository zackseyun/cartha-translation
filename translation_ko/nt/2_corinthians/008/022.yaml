  to: 우리는 또 그들과 함께 우리 형제를 보냈습니다. 그는 우리가 여러 일에서 여러 차례 시험해 보아 열심을 보이는 사람임을 확인한 사람인데, 이제는 여러분에 대한 큰 확신 때문에 훨씬 더 열심을 내고 있습니다.
  rationale: 수정문은 συνεπέμψαμεν의 ‘그들과 함께 보냈습니다’, ἐν πολλοῖς πολλάκις의 범위와 반복성, ἐδοκιμάσαμεν의 검증 의미, σπουδαῖος 및 강화 비교급 πολὺ σπουδαιότερον을 자연스러운 현대 한국어로 반영합니다. πεποιθήσει ... τῇ εἰς ὑμᾶς는 문맥상 이 형제의 여러분을 향한 큰 확신이 더 큰 열심의 근거가 된다는 뜻으로 옮겼습니다. 영어 주석의 ‘because of/through’ 차이는 한국어 「때문에」가 충분히 포괄하며 별도 각주가 필수적이지 않습니다.
