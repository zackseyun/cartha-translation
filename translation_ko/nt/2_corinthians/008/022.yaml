  source_fidelity: 그리스어의 핵심 요소(그들과 함께 보냄, 여러 일에서 여러 차례 검증함, 열심, 현재의 더 큰 열심, 독자들을 향한 큰 확신)는 대체로 반영했습니다. 다만 「시험하여 열심이 있는 자로 인정한 사람」은 ἐδοκιμάσαμεν ... σπουδαῖον ὄντα의 검증 결과를 다소 부자연스럽게 풀어 내며, 「열심을 품고 있습니다」는 σπουδαιότερον의 적극적이고 비교적인 의미를 충분히 드러내지 못합니다.
  naturalness: 현대 표준어 합쇼체로는 「여러 일에서 자주 시험하여 열심이 있는 자로 인정한 사람」보다 「여러 일에서 여러 차례 시험해 보아 열심을 보이는 사람임을 확인한」이 더 자연스럽습니다. 「훨씬 더 열심을 내고 있습니다」는 πολὺ σπουδαιότερον의 강화된 비교를 분명하고 자연스럽게 옮깁니다.
  terminology: 「우리 형제」는 익명의 남성 동역자를 가리키는 ἀδελφὸν ἡμῶν의 직역적 교회 언어를 잘 보존합니다. πεποίθησις는 여기서 독자들을 향한 신뢰/확신을 뜻하며 「여러분에 대한 큰 확신 때문에」로 무리 없이 옮길 수 있습니다.
