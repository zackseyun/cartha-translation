    reason: καλά는 넓게 ‘선한 일’을 뜻할 수 있으며, 이 문맥에서는 공적으로 흠잡을 데 없는 ‘명예로운 일’ 또는 ‘옳은 일’의 뉘앙스도 가능합니다.
