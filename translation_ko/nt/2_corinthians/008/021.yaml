  verdict: revise
  source_fidelity: The draft correctly reflects the forward-looking sense of προνοοῦμεν and the twofold sphere ‘before the Lord’ and ‘before people.’ However, its nominalized construction (‘…것은 …하려는 것입니다’) adds an explanatory purpose and obscures the Greek’s direct assertion.
  naturalness: ‘선한 것을 미리 생각하는 것은 … 그렇게 하려는 것입니다’ is unnatural and repetitive in modern Korean. A direct finite clause is clearer and appropriately formal.
  terminology: ‘주님’ appropriately renders κυρίου, and ‘사람들’ accurately represents generic ἀνθρώπων. καλὰ is rendered ‘선한 일,’ with its contextually apt alternatives supplied in a footnote.
  issues:
  - severity: medium
    issue: The sentence changes the direct assertion into an explanatory nominal construction.
    rationale: The Greek states ‘For we take thought for what is good …’; ‘…것은 …하려는 것입니다’ introduces ‘trying/intending to do so’ and makes ‘그렇게’ refer back ambiguously.
  - severity: low
    issue: The Korean wording is stylistically awkward and repetitive.
    rationale: ‘선한 것을 미리 생각하는 것은’ followed by ‘그렇게 하려는 것입니다’ does not read as natural modern formal Korean.
  revised_text: 우리는 주님 앞에서뿐만 아니라 사람들 앞에서도 선한 일을 하도록 미리 살핍니다.[a]
