  rationale: The revision restores a direct statement corresponding to προνοοῦμεν γάρ, retains the deliberate forethought of προνοοῦμεν with ‘미리 살핍니다,’ and renders the ethical neuter plural καλά naturally as ‘선한 일.’ The footnote preserves viable contextual lexical alternatives without narrowing the main text.
