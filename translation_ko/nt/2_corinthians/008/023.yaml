  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 κοινωνός와 συνεργός를 각각 「동역자」와 「함께 일하는 자」로 옮긴 현재 표현은 의미가 겹치고, 「여러분을 위한 함께 일하는 자」는 εἰς ὑμᾶς의 관계를 자연스럽게 드러내지 못합니다. 「교회들의 사절」은 문맥상 교회가 파송한 대표자라는 비기술적 의미를 보존합니다.
  naturalness: 「디도로 말하자면」, 「우리 형제들로 말하자면」 및 「여러분을 위한 함께 일하는 자」는 현대 표준어 합쇼체 성경 문장으로 다소 어색합니다. 「…에 관해서는」 및 「여러분을 위해 함께 일하는 협력자」로 다듬는 편이 자연스럽습니다.
  terminology: Χριστός는 프로젝트 방침과 영어 POB의 선택에 따라 「메시아」로 유지합니다. ἀπόστολοι는 이 문맥에서 「사절」로 번역하되, 「사도들」이라는 가능한 직역은 각주에서 밝혀 본문의 비기술적 해석을 과도하게 단정하지 않도록 합니다.
