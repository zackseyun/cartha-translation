  text: For I do not mean that there should be relief for others and hardship for you[a], but equality—
translation:
  language: ko
  text: 이는 다른 이들이 부담을 덜고 여러분이 어려움을 겪게 하려는 것이 아니라, 오히려 평등[a]을 이루려는 것입니다—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
