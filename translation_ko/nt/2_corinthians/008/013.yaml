  source_fidelity: 초안은 θλῖψις를 경제적 맥락에 맞게 ‘어려움’으로 옮긴 점은 적절합니다. 그러나 ἄνεσις의 ‘부담이 경감됨/구제’라는 뜻을 ‘여유가 있음’으로 옮기면 단순한 풍족함으로 기울 수 있습니다. 또한 ἐξ ἰσότητος는 뒤 절과 연결되는 대조를 나타내므로, 한국어에서는 ‘평등을 이루려는’으로 목적상 자연스럽게 풀어 주었습니다.
  naturalness: ‘내 말은’은 원문에 명시된 동사가 아니며 다소 구어적입니다. ‘이는 … 하려는 것이 아니라’는 합쇼체 성경 문체에서 자연스럽게 원문의 생략된 의도를 보충합니다. ‘균등’은 현대 한국어에서 수량의 동일 배분을 강하게 시사하므로 이 문맥에는 ‘평등’이 더 자연스럽습니다.
  terminology: ἄνεσις는 ‘부담을 덜다’로 문맥화하여 구제·경감의 뜻을 보존했습니다. ἰσότης는 본문에서 ‘평등’으로 유지하되, 소유의 엄격한 동일화를 뜻한다고 단정하지 않도록 각주에 ‘공평’의 가능성을 밝혔습니다.
  issues:
