  source_fidelity: 초안은 περίσσευμα와 ὑστέρημα의 대조 및 상호 공급이라는 핵심을 대체로 반영합니다. 그러나 ‘이는 … 채워서 … 위함입니다’는 헬라어의 목적·결과 관계와 상호성을 다소 뭉뚱그리며, ἰσότης의 번역어 ‘균등’은 여기서 다소 부자연스럽고 의미를 지나치게 균일 분배 쪽으로 좁힐 수 있습니다.
  naturalness: ‘지금은’보다 ‘지금 이때에는’이 ἐν τῷ νῦν καιρῷ의 상황적 한정을 더 자연스럽게 드러냅니다. 또한 목적 구조를 ‘… 채우게 되어 … 이루어지게 하려는 것입니다’로 정리하면 현대 한국어 합쇼체 문장으로 매끄럽습니다.
