    reason: lexical_alternative
  revision_rationale: The revision retains the adopted Greek wording and its ambiguity as far as Korean permits, corrects the force of Paul’s exhortation, and keeps “은혜” in the main text for χάρις. The footnotes now accurately distinguish the difficult adopted phrase, its interpretive alternative, and the manuscript variant, while explaining the collection as the concrete referent of “this grace.”
