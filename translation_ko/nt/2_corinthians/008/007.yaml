revisions:
- from: 그러나 여러분이 모든 일에—믿음과 말과 지식과 모든 열심과 우리에게서 나와 여러분 안에 있는 사랑[a]에—풍성한 것처럼, 이 은혜로운 일[b]에서도 풍성하기 바랍니다.
  to: 그러나 여러분이 모든 일에—믿음과 말과 지식과 모든 열심과 우리에게서 비롯되어 여러분 안에 있는 사랑[a]에—풍성한 것처럼, 이 은혜[b]에서도 풍성하게 하십시오.
  rationale: The revision retains the adopted Greek wording and its ambiguity as far as Korean permits, corrects the force of Paul’s exhortation, and keeps “은혜” in the main text for χάρις. The footnotes now accurately distinguish the difficult adopted phrase, its interpretive alternative, and the manuscript variant, while explaining the collection as the concrete referent of “this grace.”
  reviewer_model: gpt-5.6-terra
