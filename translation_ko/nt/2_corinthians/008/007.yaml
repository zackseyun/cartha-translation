    text: 또는 「여러분이 우리를 향해 가진 사랑」. 그리스어 구문은 해석하기 어렵습니다. 일부 사본에는 「우리 안에 있는 여러분의 사랑」으로 읽힙니다.
    reason: alternative_reading
