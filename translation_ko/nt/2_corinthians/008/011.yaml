review_pass:
  verdict: revise
  source_fidelity: 초안은 ἐπιτελέσατε를 ‘완성하십시오’로 옮긴 점과 ἐκ τοῦ ἔχειν을 가진 자원과 연결한 점은 적절합니다. 그러나 ‘원하는 일에 보였던’은 τοῦ θέλειν(하려는 것/의지함)을 특정 ‘일’로 바꾸고, ‘그렇게 하십시오’는 후반부의 ‘완수’와 ‘가진 것에 따른’ 한정을 충분히 드러내지 못합니다.
  naturalness: ‘그 일을 하려는 자원하는 마음이 있었던 것처럼’과 ‘여러분이 가진 것에 따라’는 현대 표준어 합쇼체에서 자연스럽고, 원문의 비교와 목적 관계를 명료하게 보존합니다.
  terminology: προθυμία는 이 문맥에서 ‘자원하는 마음’으로 적절합니다. ἐπιτελέω의 반복은 ‘끝마치다’로 일관되게 옮겨 시작한 일을 실제로 마무리하라는 뜻을 드러냅니다. ‘여러분이 가진 것에 따라’는 ἐκ τοῦ ἔχειν의 가용한 자원이라는 의미를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: ‘원하는 일에 보였던’
    rationale: τοῦ θέλειν은 ‘원하는 일’이 아니라 하려는 의지의 내용을 나타냅니다. 또한 원문에는 ‘보였던’에 해당하는 표현이 없습니다.
  - severity: medium
    issue: ‘가진 것으로 그것을 완성하기까지 그렇게 하십시오’
    rationale: 후반부는 앞선 자원함과 균형을 이루는 ‘완수’가 가진 것에 따라 이루어지게 하라는 뜻입니다. 초안의 ‘그렇게 하십시오’는 이 대칭과 한정을 모호하게 만듭니다.
  revised_text: 이제는 그 일을 하는 것도 끝마치십시오. 그 일을 하려는 자원하는 마음[a]이 있었던 것처럼, 여러분이 가진 것에 따라[b] 그 일을 끝마치는 것도 이루어지게 하십시오.
