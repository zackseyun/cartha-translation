  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 「칭찬이 … 알려진 사람」은 ὁ ἔπαινος의 직접적인 뜻인 그 형제가 받는 칭찬을, 칭찬이라는 정보가 알려진다는 뜻으로 약간 바꿉니다. 또한 「복음 안에서」는 한국어에서 다소 부자연스럽습니다.
  naturalness: 「복음과 관련하여 모든 교회에서 칭찬을 받는」이 현대 표준어 합쇼체 문맥에서 자연스럽고, ἐν τῷ εὐαγγελίῳ의 넓은 관련성을 유지합니다. 「그 형제」는 특정하게 알려진 남성 신자를 가리키는 정관사의 뉘앙스를 적절히 반영합니다.
  terminology: 「복음」과 「교회」는 적절합니다. 「칭찬을 받는」은 ἔπαινος에 자연스럽고 충실한 대응입니다. 복음과의 관계를 특정한 전도·사역으로 한정하지 않았습니다.
  issues:
  - severity: medium
    issue: 「칭찬이 모든 교회에 두루 알려진 사람」
    rationale: 원문은 그 형제의 칭찬이 복음과 관련하여 모든 교회에 걸쳐 있다는 뜻입니다. 현 번역은 ‘칭찬’ 자체가 알려졌다는 정보 전달의 의미를 더하며, 원문의 수동적 평가 의미를 덜 직접적으로 나타냅니다.
  revised_text: 우리는 또 그와 함께, 복음과 관련하여 모든 교회에서 칭찬을 받는 그 형제를 보냈습니다—
  revised_footnotes:
