    text: 또는 “복음 안에서 모든 교회에 두루 칭찬이 있는 형제.”
    reason: ἐν τῷ εὐαγγελίῳ와 διὰ πασῶν τῶν ἐκκλησιῶν의 관계를 보다 직역적으로 나타낼 수 있는 번역을 제시합니다.
  revision_rationale: 문장을 한 문장으로 유지하여 ‘그와 함께 보낸’ 특정 형제와 그를 수식하는 관계절의 결속을 분명히 했습니다. 「복음과 관련하여」는 ἐν τῷ εὐαγγελίῳ를 전도나 직분으로 좁히지 않으면서 자연스럽게 옮기며, 「모든 교회에서 칭찬을 받는」은 그 형제가 널리 인정받았다는 원문의 의미를 직접 반영합니다. 끝의 대시는 원문의 문장 계속 표지를 보존합니다.
