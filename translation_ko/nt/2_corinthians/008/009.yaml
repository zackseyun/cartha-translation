review_pass:
  verdict: revise
  source_fidelity: 본문의 부요함/가난함 대조와 목적절은 대체로 반영했지만, 현 번역은 ‘은혜’가 가리키는 내용을 문장 구조상 다소 불분명하게 만들며, 각주가 본문이 명시하지 않는 성육신·구원론·헌금 적용을 단정적으로 해설합니다.
  naturalness: ‘메시아 예수’는 현대 표준 한국어에서 다소 어색한 명사 배열입니다. 또한 ‘가난하게 되신 것은 … 위함입니다’는 문법적으로 가능하나, 은혜의 내용과 그 목적의 관계를 더 자연스럽고 명료하게 연결할 수 있습니다.
  terminology: κύριος는 ‘주’, χάρις는 ‘은혜’, πλούσιος/πτωχός의 대조는 ‘부요하다/가난하게 되다’로 유지합니다. Χριστός의 칭호 의미를 살려 ‘예수 메시아’로 배열합니다. 원문이 부요와 가난의 구체적 의미를 규정하지 않으므로 각주에서 특정 교리적 해석을 부과하지 않습니다.
  issues:
  - severity: medium
    issue: 각주가 원문을 넘어 특정 신학적 해석을 단정함
    rationale: ‘성육신’, ‘구원의 은혜’, ‘신자의 베풂을 위한 신학적 근거’는 가능한 해석 및 문맥적 적용이지만, 이 절 자체가 그 은유의 내용을 명시적으로 정의하지는 않습니다. 독자가 본문의 열린 은유를 유지하도록 각주를 중립적으로 고쳐야 합니다.
  - severity: low
    issue: ‘메시아 예수’의 어순이 비자연적임
    rationale: 한국어에서는 인명 뒤에 칭호를 놓은 ‘예수 메시아’가 번역된 칭호를 유지하면서도 더 자연스럽습니다.
  - severity: low
    issue: 은혜의 내용과 목적절의 연결이 불명료함
    rationale: ‘그가 … 되신 것은’이라는 구조보다, 그리스도의 행위를 먼저 진술하고 ‘이는’으로 목적을 잇는 편이 ὅτι와 ἵνα의 관계를 한국어로 더 분명하게 드러냅니다.
  revised_text: 여러분은 우리 주 예수 메시아의 은혜를 알고 있습니다. 곧 그분은 부요하셨으나 여러분을 위하여 가난하게 되셨습니다. 이는 여러분이 그분의 가난으로 말미암아 부요하게 되도록 하시기 위함입니다.
  revised_footnotes:
  - marker: a
    text: ‘부요하셨으나’와 ‘가난하게 되셨다’ 및 ‘부요하게 되다’는 대조를 이룹니다. 바울은 여기서 이 표현들의 구체적인 의미를 더 규정하지 않습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 ‘은혜’와 그리스도의 부요함·가난함의 대조 및 목적절을 보존하되, 문장을 자연스러운 현대 한국어로 재구성했습니다. 본문이 명시하지 않는 성육신, 구원의 범위, 헌금 윤리에 관한 해석적 단정은 각주에서 제거하고, 원문의 은유적 열린 의미를 보존했습니다.
