    reason: lexical_alternative
  - marker: b
    text: 또는 「입증하며」, 「시험에 부치며」. 헬라어 δοκιμάζω는 시험하거나 검증하여 참됨을 확인하는 일을 가리킵니다.
    reason: lexical_alternative
