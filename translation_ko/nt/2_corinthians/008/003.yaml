  source_fidelity: 초안은 κατὰ δύναμιν, παρὰ δύναμιν, αὐθαίρετοι의 핵심 뜻을 대체로 잘 살립니다. 그러나 ὅτι의 설명적 접속 기능이 빠졌고, 자원하여에서 문장이 끝나므로 문맥상 분명히 함의된 ‘드리다’를 보충해야 한국어 문장으로 완결됩니다. 또한 καί는 단순 첨가·강조인데 ‘아니’는 앞말을 정정하는 뉘앙스를 낼 수 있습니다.
  naturalness: ‘힘닿는 대로’와 ‘힘에 넘치도록’은 자연스럽지만, 이 구절에서는 ‘능력에 따라, 또 능력을 넘어’가 원문의 반복·대조와 측정의 의미를 더 직접적으로 보존합니다. 완결된 합쇼체 문장으로 다듬었습니다.
  terminology: ‘자원하여’는 αὐθαίρετοι의 자발성 및 비강제성을 적절히 나타냅니다. ‘드렸습니다’는 헌금/나눔의 문맥에서 자연스러우며, 원문의 타동사 생략을 문맥적으로만 보충합니다.
  issues:
  - severity: medium
    issue: ὅτι의 설명적 기능이 번역문에 반영되지 않음
    rationale: 이 절은 앞 절의 내용을 뒷받침하는 진술입니다. ‘이는 … 때문입니다’로 그 담화 기능을 살릴 수 있습니다.
  - severity: medium
    issue: 번역문이 ‘자원하여’에서 끝나 문법적으로 미완결됨
    rationale: 그리스어의 생략된 행위는 앞뒤의 기부 문맥에서 분명하지만, 한국어에서는 ‘드렸습니다’를 보충해야 자연스러운 완결 문장이 됩니다.
  - severity: low
    issue: ‘아니’가 καί보다 강한 정정·수정의 뉘앙스를 줄 수 있음
    rationale: καί는 여기서 ‘그리고/또’의 첨가이며, ‘또 능력을 넘어’가 원문의 연결을 더 중립적으로 보존합니다.
  revised_text: 이는 내가 증언하는 바와 같이, 그들이 능력에 따라, 또 능력을 넘어, 자원하여 드렸기 때문입니다.[a]
