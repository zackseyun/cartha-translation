review_pass:
  verdict: revise
  source_fidelity: 원문의 ὅτι는 바울의 증언 내용을 이끄므로, 한국어에서는 “그들이 … 드렸다고 나는 증언합니다”와 같이 종속절로 처리하는 편이 충실합니다. 또한 καὶ παρὰ δύναμιν은 단순 접속의 누적이므로 초안의 “아니”는 원문에 없는 정정·대조의 뉘앙스를 더합니다. αὐθαίρετοι에 대해 문맥상 ‘드렸다’를 보충하는 것은 정당합니다.
  naturalness: 초안은 문장 종결이 없어 독립 본문으로는 미완성처럼 보입니다. “할 수 있는 만큼, 그 이상으로, 자원하여 드렸다고 나는 증언합니다”는 현대 표준어 합쇼체에서 자연스럽고, 원문의 병렬과 강조를 유지합니다.
  terminology: “자원하여”는 αὐθαίρετοι의 자발성·자기 주도성을 잘 전달하며, 헌신이나 기부라는 특정 종교 용어를 불필요하게 덧붙이지 않습니다. “드렸다”는 앞뒤 문맥의 기부 행위를 최소한으로 보충한 것입니다.
  issues:
  - severity: medium
    issue: 접속사 καὶ를 “아니”로 옮김
    rationale: καὶ는 ‘그리고/또한’의 누적 접속인데, “아니”는 앞 진술을 정정하거나 더 강한 대안을 내세우는 한국어 표현입니다. 강조의 효과는 있으나 원문의 논리 관계를 정확히 보존하지 못합니다.
  - severity: medium
    issue: 본문이 완결된 문장으로 제시되지 않음
    rationale: “자원하여” 뒤에 서술어와 종결이 없어, 독립적으로 제시된 이 절의 번역문으로는 불완전합니다. 문맥상 암시된 기부 행위를 보충해 완결하는 것이 영어 POB의 처리 및 원문의 의미에 부합합니다.
  - severity: low
    issue: ὅτι가 이끄는 증언 내용의 문장 관계가 약함
    rationale: “내가 증언합니다. 그들은 …”도 가능하지만, ‘…했다고 나는 증언합니다’로 처리하면 ὅτι가 도입하는 내용절 관계가 한국어에서 더 분명해집니다.
  revised_text: 그들이 할 수 있는 만큼, 그 이상으로, 자원하여 드렸다고 나는 증언합니다.
  revised_footnotes:
  - marker: a
    text: 또는 「자발적으로」, 「기꺼이」. 헬라어 αὐθαίρετοι는 강요 없이 스스로의 결단으로 행함을 가리킨다.
    reason: lexical_alternative
  revision_rationale: 원문의 병렬 “κατὰ δύναμιν, … καὶ παρὰ δύναμιν”을 “할 수 있는 만큼, 그 이상으로”로 옮겨 능력의 범위와 그 초과를 자연스럽게 보존했습니다. 원문과 영어 감사 번역에서 문맥상 보충된 기부 행위는 “드렸다”로 최소 보충했으며, ὅτι의 내용절은 “드렸다고 나는 증언합니다”로 표현했습니다. 기존 각주 표지는 본문에 더 이상 남지 않으므로 제거했습니다.
