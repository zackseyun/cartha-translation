  source_fidelity: 그리스어는 그들이 바울 일행에게 ‘많은 간청을 하면서’ 성도들을 위한 섬김에 관련된 ‘은혜와 참여’를 요청했음을 말합니다. 초안의 ‘자기들도 참여하게 해 달라고’는 참여라는 의미를 다시 서술하여 두 목적어의 병렬 구조를 흐리고, ‘은혜’ 자체에 참여한다는 인상을 줄 수 있습니다.
  naturalness: ‘은혜와 동참함에 자기들도 참여하게’는 현대 한국어에서 어색하고 의미가 중복됩니다. ‘은혜와 동참을 허락해 달라고’로 하면 병렬 목적어와 요청의 내용을 자연스럽게 유지합니다.
  terminology: χάρις는 본문에서 ‘은혜’로 유지하고, κοινωνία는 구제 섬김에 대한 실제적 참여라는 문맥을 반영하여 ‘동참’으로 옮깁니다. διακονία와 ἅγιοι는 각각 ‘섬김’과 ‘성도들’이 적절합니다. ‘이’는 문맥상 알려진 섬김을 가리키는 자연스러운 보충입니다.
  issues:
  - severity: medium
    issue: ‘은혜와 동참함에 자기들도 참여하게’라는 구성이 병렬 목적어를 흐리고 의미를 중복합니다.
    rationale: τὴν χάριν καὶ τὴν κοινωνίαν은 δεόμενοι의 두 직접 목적어입니다. ‘동참함’ 뒤에 다시 ‘참여하게’를 붙이면 κοινωνία의 의미가 중복되며, 두 명사를 함께 ‘참여’의 대상으로 처리하는 듯한 어색함이 생깁니다.
  revised_text: 성도들을 위한 이 섬김의 은혜와 동참을 허락해 달라고 우리에게 몹시 간청하였습니다—
