  source_fidelity: 원문의 목적절(ἵνα)과 ‘전에 시작한 것처럼 … 또한 완성하도록’이라는 비교·첨가 구조는 대체로 반영되었습니다. 다만 ‘여러분 가운데서도’의 ‘도’는 원문의 καί가 가리키는 ‘이 은혜의 일도’가 아니라 장소구에 붙어 의미 연결이 다소 흐려집니다.
