    issue: The syntactic role of ἔνδειξιν is obscured.
    rationale: In “여러분의 사랑과 여러분에 대한 우리의 자랑을 증거로 보이십시오,” the accusative phrase is presented as what serves as evidence. The Greek calls for showing a proof/demonstration concerning both their love and Paul's boasting about them.
  revised_text: 그러므로 교회들 앞에서 그들에게 여러분의 사랑과 여러분에 대한 우리의 자랑이 참됨을 보여 주십시오.
