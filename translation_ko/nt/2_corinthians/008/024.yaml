  verdict: revise
  source_fidelity: 'The draft retains the main referents and the public setting. However, its construction “사랑과 … 자랑을 증거로 보이십시오” makes the love and boasting themselves function as evidence, whereas ἔνδειξιν is the object to be displayed: Paul requests a demonstration/evidence of their love and of his boasting about them.'
  naturalness: The proposed revision is clear, modern Standard Korean in formal-polite 합쇼체. “참됨을 보여 주십시오” idiomatically expresses the requested public demonstration without the unnatural or ambiguous “~을 증거로 보이다.”
  terminology: “교회들,” “사랑,” and “자랑” appropriately render ἐκκλησιῶν, ἀγάπη, and καύχησις. “여러분에 대한 우리의 자랑” correctly represents the boast concerning the Corinthians.
  issues:
