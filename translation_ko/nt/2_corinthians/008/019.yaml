    rationale: ‘이 은혜로운 사역에 함께하게 되었습니다’는 그가 사역에 참여하게 되었다는 뜻이 됩니다. 원문은 그가 ‘우리가 수행하는 이 은혜의 선물과 함께’ 가는 동행자로 교회들에 의해 지명되었음을 말합니다.
