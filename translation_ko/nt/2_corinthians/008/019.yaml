  source_fidelity: 현 번역은 χειροτονηθείς와 συνέκδημος를 대체로 잘 옮겼지만, χάριτι를 ‘은혜로운 사역’으로, σὺν τῇ χάριτι를 ‘이 사역에 함께하게 되었습니다’로 옮겨 헌금/은혜의 선물과 함께 여행하는 관계를 그 사역에 참여하는 관계로 바꾸었습니다. 또한 διακονουμένῃ는 수동형이므로 ‘우리가 맡아 섬기고 있는’보다 ‘우리가 수행하고 있는’이 원문 형식과 의미에 더 가깝습니다.
  naturalness: ‘교회들이 … 임명한 우리의 여행 동행자’는 현대 표준 한국어로 자연스럽고, ‘이 은혜의 선물과 함께’는 여행 동행자의 임무와 선물의 관계를 유지합니다. 문맥상 불완전 문장인 원문의 대시도 보존했습니다.
  terminology: χάρις는 이 문맥에서 수금의 구체적 선물을 가리키므로 ‘은혜의 선물’이 적절합니다. κύριος는 ‘주님’으로 유지했습니다. αὐτοῦ τοῦ κυρίου의 해석상 가능성이 있으므로 본문은 영어 POB의 집중적 해석을 따르되 대안은 각주로 남겼습니다.
