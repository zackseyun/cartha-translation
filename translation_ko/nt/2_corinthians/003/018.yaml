  to: 우리 모두는 베일을 벗은 얼굴로 거울로 보듯 주님의 영광을 바라보며[a], 그 같은 형상으로 영광에서 영광으로 변화되어 갑니다. 이 변화는 주님, 곧 영께로부터 옵니다[b].
  rationale: 본문은 현재 수동태 μεταμορφούμεθα의 진행성을 ‘변화되어 갑니다’로 유지합니다. κατοπτριζόμενοι와 ἀπὸ κυρίου πνεύματος의 다툼 있는 의미는 본문에서 한 해석을 과도하게 강요하지 않고, 영어 POB의 감사 기록에 맞춘 선택과 각주 대안을 함께 제시했습니다.
