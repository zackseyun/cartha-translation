  terminology: '''죽음의 사역'', ''영광'', ''이스라엘 자손들'', ''똑바로 바라보다''는 문맥과 격식에 적절합니다. καταργουμένην은 보이는 영광을 수식하므로 ''사라져 가는''을 유지하되 대안적 의미는 각주로 밝혀야 합니다.'
