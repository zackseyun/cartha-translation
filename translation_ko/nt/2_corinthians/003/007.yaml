  revised_text: 그러나 돌들에 글자로 새겨진 죽음의 사역도 영광 가운데 이루어져서, 이스라엘 자손들이 사라져 가는 모세의 얼굴의 영광 때문에 그의 얼굴을 똑바로 바라볼 수 없었다면,
