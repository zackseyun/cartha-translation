  source_fidelity: 초안은 핵심 어휘를 대체로 충실히 옮겼으나, εἰ δέ가 이끄는 조건절을 직설문으로 바꾸었고, ἐγενήθη의 사건적 의미를 '임하였습니다'로 다소 부정확하게 처리했습니다. 또한 원문의 미완결 조건절 구조를 보존해야 합니다.
