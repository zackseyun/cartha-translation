translation:
  language: ko
  text: 여러분은 우리가 섬겨 전한 메시아의 편지임이 드러납니다. 이 편지는 먹물로 쓴 것이 아니라 살아 계신 하나님의 영으로 쓴 것이며, 돌판에 쓴 것이 아니라 살로 된 마음판에 쓴 것입니다.
