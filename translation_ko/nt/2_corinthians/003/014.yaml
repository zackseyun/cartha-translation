review_pass:
  verdict: revise
  source_fidelity: ‘완고하여졌습니다’는 ἐπωρώθη의 둔감해지고 굳어지는 뜻보다 의지적 고집을 다소 강하게 나타냅니다. 또한 마지막 절은 καταργεῖται의 주어를 ‘그 베일’로 확정하고 ‘오직’이라는 배타적 강조를 더합니다. 헬라어의 문법적 지시 대상은 베일이 가장 자연스럽지만 옛 언약을 가리킬 가능성도 논의되므로, 번역에서는 이를 확정하지 않는 것이 안전합니다.
  naturalness: ‘생각이 둔해졌습니다’, ‘벗겨지지 않은 채로 남아 있습니다’는 현대 표준어 합쇼체로 자연스럽고, 지속을 나타내는 μένει와 수동 분사 μὴ ἀνακαλυπτόμενον의 관계를 분명히 합니다.
  terminology: ‘옛 언약’은 παλαιᾶς διαθήκης에 충실하며 ‘구약’보다 본문의 언약 언어를 보존합니다. Χριστῷ는 프로젝트 원칙에 따라 ‘메시아 안에서’로 유지합니다. καταργεῖται는 ‘폐해집니다’로 옮기되, 대명사와 주석을 통해 베일/언약의 지시 대상 논의를 보존합니다.
  issues:
  - severity: medium
    issue: ἐπωρώθη를 ‘완고하여졌습니다’로 번역함
    rationale: 이 말은 완고함이라는 자발적·성격적 뉘앙스를 강하게 줄 수 있습니다. 본문의 πωρόω는 지각이나 이해가 굳고 둔해진 상태를 가리키므로 ‘둔해졌습니다’가 더 가깝습니다.
  - severity: high
    issue: 마지막 문장이 ‘그 베일’을 καταργεῖται의 주어로 확정하고 ‘오직…만’을 첨가함
    rationale: 가장 가까운 선행사는 베일이지만, ‘옛 언약’을 주어로 보는 해석도 있으며 본문은 이를 완전히 해소하지 않습니다. 또한 ‘오직’에 해당하는 헬라어 표현은 없습니다. 대명사와 주석으로 모호성을 보존해야 합니다.
  revised_text: 그러나 그들의 생각은 둔해졌습니다. 오늘날까지도 옛 언약을 읽을 때에 같은 베일이 벗겨지지 않은 채로 남아 있습니다. 이는 그것이 메시아 안에서 폐해지기 때문입니다.[a]
  revised_footnotes:
  - marker: a
    text: ‘그것’은 가장 자연스럽게는 ‘베일’을 가리키지만, ‘옛 언약’을 가리킨다고 보는 해석도 있습니다. 또는 “메시아 안에서 그것이 없어집니다.”
    reason: καταργεῖται의 지시 대상에 관한 문법적·해석적 모호성과 가능한 번역을 보존함
  revision_rationale: 지각의 둔화라는 ἐπωρώθη의 의미를 더 충실히 반영하고, 베일이 벗겨지지 않은 채 남아 있다는 분사 구조를 명료하게 했습니다. 마지막 절에서 원문에 없는 배타적 강조를 제거하고, καταργεῖται의 지시 대상에 관한 논쟁적 모호성을 번역과 각주에서 보존했습니다.
