review_pass:
  verdict: revise
  source_fidelity: ‘오직’은 헬라어 본문에 없는 제한을 더하며, 마지막 절의 생략된 주어를 ‘그 베일’로 명시하면 καταργεῖται의 지시 대상에 관한 문법적·해석적 여지를 좁힙니다. 또한 ‘벗겨지지 아니합니다’는 현재의 일반 진술처럼 들리므로, μένει μὴ ἀνακαλυπτόμενον의 ‘벗겨지지 않은 채 남아 있다’는 관계를 더 직접적으로 드러내는 편이 좋습니다.
  naturalness: ‘생각이 완고하여졌습니다’와 ‘폐하여지기’는 이해 가능하지만 다소 문어적입니다. ‘생각은 완고해졌습니다’ 및 ‘벗겨지지 않은 채 그대로 남아 있습니다’는 현대 표준어 합쇼체로 자연스럽고 원문의 지속성을 잘 살립니다.
  terminology: ‘옛 언약’은 παλαιᾶς διαθήκης에 충실하며, ‘메시아’는 프로젝트의 Χριστός 방침과 일치합니다. κάλυμμα는 문맥의 모세 베일 비유를 보존하는 ‘베일’이 적절합니다. καταργεῖται는 ‘폐하여지다’로 유지할 수 있으나, 그 생략된 주어가 베일인지 옛 언약인지에 대해서는 각주로 유의해야 합니다.
  issues:
  - severity: medium
    issue: ‘오직 …에서만’이 추가됨
    rationale: ἐν Χριστῷ에는 ‘오직’이나 ‘만’에 해당하는 제한 표현이 없습니다.
  - severity: medium
    issue: 마지막 절의 주어를 ‘그 베일’로 단정함
    rationale: 가까운 선행사는 ‘베일’이지만, καταργεῖται의 주어를 옛 언약으로 보거나 의도적으로 여지를 남긴다고 보는 해석도 있습니다. 본문은 생략된 주어를 유지하고 각주에서 이 문제를 밝혀야 합니다.
  - severity: low
    issue: ‘벗겨지지 아니합니다’가 분사와 μένει의 결합을 충분히 반영하지 못함
    rationale: μὴ ἀνακαλυπτόμενον은 베일이 ‘벗겨지지 않은 채’ 남아 있음을 수식합니다.
  revised_text: 그러나 그들의 생각은 완고해졌습니다. 오늘날까지도 옛 언약을 읽을 때 같은 베일이 벗겨지지 않은 채 그대로 남아 있습니다. 이는 메시아 안에서 폐하여지기 때문입니다.¹
  revised_footnotes:
  - marker: '1'
    text: ‘폐하여지기’의 생략된 주어는 바로 앞의 ‘베일’을 가리킬 수 있습니다. 그러나 일부는 ‘옛 언약’을 가리킨다고 보거나, 두 해석 사이의 여지를 남긴 표현으로 봅니다.
    reason: 원문의 καταργεῖται에 생략된 주어의 해석상 여지를 보존함
  revision_rationale: 원문에 없는 ‘오직’과 ‘만’을 삭제했습니다. 마지막 절의 주어를 본문에서 명시하지 않아 헬라어의 해석상 여지를 보존하고, 필요한 설명은 각주로 옮겼습니다. 또한 ‘벗겨지지 않은 채 … 남아 있습니다’로 분사와 주동사 사이의 관계를 더 충실하고 자연스럽게 반영했습니다.
