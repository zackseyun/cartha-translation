- from: 여러분이 우리의 편지입니다. 우리 마음에 새겨졌으며, 모든 사람에게 알려지고 또 읽힙니다.
  to: 여러분은 우리 마음속에 기록되어 있고 모든 사람이 알고 읽는 우리의 편지입니다.
  rationale: The revision preserves the Greek participial descriptions as modifiers of 'our letter,' renders the perfect passive with an existing-state expression, and makes all people the agents who know and read the letter. It uses standard modern formal-polite Korean and does not introduce interpretive content.
