revisions:
- from: 하나님께서 또한 우리를 새 언약의 일꾼으로 감당하게 하셨으니, 곧 문자가 아니라 영의 일꾼입니다. 문자는 죽이고, 영은 살립니다.
  to: 하나님께서는 또한 우리를 새 언약의 일꾼, 곧 문자의 일꾼이 아니라 영의 일꾼으로 섬길 자격을 갖추게 하셨습니다. 문자는 죽이지만 영은 살립니다.
  rationale: The revision restores the Greek syntactic relation by making both ‘새 언약의 일꾼’ and ‘문자의 일꾼이 아니라 영의 일꾼’ complements of God’s qualifying action. It uses natural formal Korean while retaining ‘일꾼,’ ‘문자,’ and ‘영.’ ‘하지만’ marks the δέ contrast without adding interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:24:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the major lexical contrasts: ‘새 언약,’ ‘문자,’ ‘영,’ and the forceful present-tense pair ‘죽이고 … 살립니다.’ However, ‘곧 문자가 아니라 영의 일꾼입니다’ changes the Greek construction into an independent copular statement and leaves the initial ‘새 언약의 일꾼으로’ syntactically incomplete. The phrase οὐ γράμματος ἀλλὰ πνεύματος modifies ‘servants/ministers’ and must remain within the same predicate.'
  naturalness: ‘새 언약의 일꾼으로 감당하게 하셨으니’ is somewhat awkward in contemporary formal Korean. ‘… 일꾼으로 섬길 자격을 갖추게 하셨습니다’ naturally expresses God’s making the apostles sufficient/qualified without reducing the phrase to a mere appointment.
  terminology: ‘일꾼’ appropriately avoids importing a later church-office sense. ‘문자’ and ‘영’ preserve Paul’s compact, interpretively open contrast; rendering πνεῦμα as ‘성령’ would unnecessarily settle an ambiguity that the Greek orthography and context do not conclusively settle. No footnote is required, since Korean ‘영’ itself retains the ambiguity.
  issues:
  - severity: high
    issue: The ‘not of letter but of spirit’ qualification is detached from ‘servants.’
    rationale: 'Greek: διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος—‘servants of a new covenant, not of letter but of spirit.’ The draft’s ‘곧 문자가 아니라 영의 일꾼입니다’ makes ‘we are workers’ a separate assertion rather than completing the object/predicate governed by ‘made us competent.’'
  - severity: medium
    issue: ‘감당하게 하셨으니’ is an unnatural rendering of ἱκάνωσεν in this construction.
    rationale: Although it aims to retain the connection with 3:5, Korean normally says that someone is equipped or qualified to serve in a role. The revision communicates divine enablement rather than mere ability to bear a burden.
  revised_text: 하나님께서는 또한 우리를 새 언약의 일꾼, 곧 문자의 일꾼이 아니라 영의 일꾼으로 섬길 자격을 갖추게 하셨습니다. 문자는 죽이지만 영은 살립니다.
  revised_footnotes: []
  revision_rationale: The revision restores the Greek syntactic relation by making both ‘새 언약의 일꾼’ and ‘문자의 일꾼이 아니라 영의 일꾼’ complements of God’s qualifying action. It uses natural formal Korean while retaining ‘일꾼,’ ‘문자,’ and ‘영.’ ‘하지만’ marks the δέ contrast without adding interpretation.
