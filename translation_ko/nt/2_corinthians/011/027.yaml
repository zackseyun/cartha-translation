  text: 수고와 고난, 잦은 밤샘, 굶주림과 목마름, 잦은 금식[a], 추위와 헐벗음[b]을 겪었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잦은 단식’. 그리스어는 반복된 금식을 뜻하며, 이것이 자발적인 금식이었는지 상황 때문에 어쩔 수 없이 음식이 부족했던 것인지는 본문이 밝히지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘벌거벗음’. 여기서는 문자 그대로의 나체라기보다, 옷이 충분하지 않아 추위와 외부 환경에 노출된 상태를 뜻할 수 있습니다.
    reason: lexical_alternative
