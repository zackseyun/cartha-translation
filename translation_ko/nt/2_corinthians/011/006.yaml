  terminology: ἰδιώτης τῷ λόγῳ는 일반적 무지나 비전문성을 뜻하기보다 말하기, 특히 수사적 표현의 미숙함을 가리키므로 「말하는 데에는 서툴다」가 적절합니다. γνῶσις는 「지식」으로 유지합니다. φανερώσαντες는 문맥상 「분명히 드러내었습니다」로 옮길 수 있습니다.
