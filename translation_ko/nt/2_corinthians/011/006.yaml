  source_fidelity: 수정이 필요합니다. 초안의 「모든 사람 앞에」는 ἐν πᾶσιν을 ‘모든 사람 가운데/앞에서’로 특정하는 해석이며, 본문 자체가 허용하는 더 넓고 논쟁적인 ‘모든 일에서/모든 면에서’의 뜻을 좁힙니다. 또한 두 ἀλλά의 대조·첨가 흐름을 더 분명히 살릴 필요가 있습니다.
