base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: ko
  text: 그들이 메시아의 일꾼입니까? 정신 나간 사람처럼 말합니다만, 나는 더욱 그러합니다. 수고는 더 많이 하고, 옥에 갇히는 일도 더 많이 겪고, 매 맞는 일은 헤아릴 수 없이 많이 당하고, 죽음의 위기[a]도 자주 겪었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “죽음들 가운데서 자주”입니다. 반복하여 죽음에 가까운 위험을 겪었다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι Χριστοῦ
  english_pob_choice: servants of Messiah
  chosen_korean: 메시아의 일꾼
  lexicon: BDAG
  rationale: 칭호 보존. 11:15와 같이 「일꾼」 일관.
  alternatives_korean:
