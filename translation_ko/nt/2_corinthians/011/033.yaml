  source_fidelity: 첫 접속사 καί는 단순 접속(‘그리고/또’)인데, 초안의 ‘그러나’는 원문에 없는 대조를 더합니다. 또한 διὰ θυρίδος와 διὰ τοῦ τείχους는 창문과 벽을 통한 탈출을 나타내므로 ‘벽에 난 창문을 통해’로 자연스럽게 함께 반영하는 것이 적절합니다. 나머지 ‘광주리에 담겨’, 수동의 ‘내려졌고’, ‘그의 손에서 벗어났습니다’는 원문의 의미를 충실히 전달합니다.
  naturalness: ‘창문으로 성벽을 통해’는 한국어에서 두 통로 표현의 결합이 다소 부자연스럽고 관계가 불명확합니다. ‘벽에 난 창문을 통해’는 현대 표준어 합쇼체 문장으로 자연스럽습니다.
  terminology: ‘광주리’는 σαργάνη의 엮은 용기라는 의미와 한국어 성경 문체에 잘 맞습니다. ‘그의 손에서 벗어났습니다’는 τὰς χεῖρας αὐτοῦ의 관용적 표현을 보존합니다. τείχος에 ‘성벽’이라는 ‘성’의 정보를 명시할 근거는 본절 자체에 없으므로 ‘벽’이 더 절제된 번역입니다.
  issues:
