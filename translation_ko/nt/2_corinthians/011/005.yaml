  chosen_korean: 「대단한 사도들」
  lexicon: BDAG
  rationale: 바울의 풍자적 표현. 한국어에서 인용부호와 「대단한」으로 비꼬는 어조를 살린다. 12:11에서 동일 표현 재등장—일관 유지.
