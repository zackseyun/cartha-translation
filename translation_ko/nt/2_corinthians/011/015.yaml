revisions:
- from: 그러므로 사탄의 일꾼들도 의의 일꾼인 양 가장하는 것이 큰일이 아닙니다. 그들의 마지막은 그들의 행위대로 될 것입니다.
  to: 그러므로 사탄의 일꾼들도 의[a]의 일꾼으로 가장한다 해도 놀랄 일이 아닙니다. 그들의 결말은 그들의 행위대로 될 것입니다.
  rationale: 원문의 논리적 연결과 가장한다는 의미를 자연스러운 합쇼체로 다듬고, 최종 결과를 뜻하는 τέλος를 ‘결말’로 수정했습니다. δικαιοσύνη의 기본 번역 ‘의’는 유지하면서 어휘적 대안을 각주로 보존했습니다.
