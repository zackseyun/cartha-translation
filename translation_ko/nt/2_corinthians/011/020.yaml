revisions:
- from: 여러분은 누가 여러분을 종으로 부리거나, 누가 여러분을 잡아먹거나, 누가 빼앗아 가거나, 누가 우쭐대거나, 누가 여러분의 뺨을 치더라도 참아 줍니다.
  to: 왜냐하면 누가 여러분을 노예로 삼거나, 누가 여러분을 잡아먹거나, 누가 여러분에게서 빼앗아 가거나, 누가 스스로를 높이거나, 누가 여러분의 얼굴을 때리더라도, 여러분은 참아 냅니다.
  rationale: 원문의 반복된 조건절과 열거 구조를 유지하면서, ‘노예로 삼다’로 강제 예속을 직접적으로 나타냈습니다. ‘여러분에게서 빼앗아 가다’는 λαμβάνει의 문맥상 착취적 취득을 반영하되 무엇을 빼앗는지 본문에 불필요하게 특정하지 않습니다. ‘참아 냅니다’는 ἀνέχεσθε의 감내 의미와 비꼬는 어조에 맞고, ‘얼굴을 때리다’는 원문의 범위를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:24:30Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 καταδουλοῖ, κατεσθίει, ἐπαίρεται, δέρει의 강한 표현을 대체로 보존하지만, λαμβάνει의 착취적 ‘취함’에는 ‘여러분에게서’가 명시되는 편이 충실합니다. 또한 ἀνέχεσθε를 ‘참아 줍니다’로 옮기면 가해자에게 호의를 베푼다는 뜻이 생길 수 있으므로 ‘참아 냅니다’가 더 정확합니다. γάρ의 설명적 연결도 ‘왜냐하면’으로 반영했습니다.
  naturalness: ‘누가 … 하더라도’의 반복은 원문의 εἴ τις 반복이 만드는 수사적 열거를 자연스러운 현대 한국어로 살립니다. ‘여러분의 얼굴을 때리다’는 εἰς πρόσωπον을 과도하게 ‘뺨’으로 한정하지 않으면서도 자연스럽습니다.
  terminology: ‘종으로 부리다’는 강제적 예속의 뜻을 전달하나, ‘노예로 삼다’가 καταδουλοῖ의 노예화 의미를 더 직접적으로 보존합니다. ‘스스로를 높이다’는 ἐπαίρεται의 자기 고양을, ‘여러분에게서 빼앗아 가다’는 문맥상 착취적인 λαμβάνει를 보존합니다.
  issues:
  - severity: medium
    issue: ‘참아 줍니다’
    rationale: ἀνέχεσθε는 용인·감내한다는 뜻입니다. ‘-아 주다’는 상대를 위한 호의 또는 허용의 뉘앙스를 더하여 바울의 비꼬는 질책과 맞지 않을 수 있습니다.
  - severity: medium
    issue: λαμβάνει의 대상이 불분명함
    rationale: ‘빼앗아 가다’만으로도 가능하지만, 원문의 ὑμᾶς를 직접 목적어로 받는 ‘착취적으로 취하다’의 의미를 한국어에서 ‘여러분에게서’로 밝혀 주는 것이 자연스럽고 충실합니다.
  - severity: low
    issue: γάρ의 연결이 미반영됨
    rationale: 문맥을 잇는 설명적 γάρ를 ‘왜냐하면’으로 반영하는 것이 원문의 논증 흐름을 보존합니다.
  - severity: low
    issue: ‘뺨’으로의 한정
    rationale: πρόσωπον은 ‘얼굴’입니다. ‘뺨’도 가능한 구체화이나, 본문은 폭행 부위를 뺨으로 특정하지 않으므로 ‘얼굴’을 유지하는 편이 안전합니다.
  revised_text: 왜냐하면 누가 여러분을 노예로 삼거나, 누가 여러분을 잡아먹거나, 누가 여러분에게서 빼앗아 가거나, 누가 스스로를 높이거나, 누가 여러분의 얼굴을 때리더라도, 여러분은 참아 냅니다.
