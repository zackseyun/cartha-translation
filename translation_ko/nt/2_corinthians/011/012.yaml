revisions:
- from: 그러나 내가 하는 일은 계속할 것입니다. 이는 기회를 노리는 자들의 기회를 끊어 버리고, 그들이 자랑하는 그 일에서도 우리와 같이 평가받게 하려는 것입니다.
  to: 그러나 내가 하고 있는 일은 앞으로도 계속하겠습니다. 이는 기회를 얻고자 하는 사람들에게서 그 기회[a]를 끊어 버려, 그들이 자랑하는 일에서 우리와 같이 드러나게 하려는 것입니다.
  rationale: ‘평가받게’를 원문의 수동 동사가 나타내는 ‘드러나게’로 바로잡아 의미를 보존했습니다. 현재형과 미래형의 결합, ἀφορμή의 반복, 그리고 ‘그들이 자랑하는 일에서’라는 비교의 범위를 유지했습니다. ‘빌미’처럼 더 부정적인 해석은 본문에 강제하지 않고 각주에만 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:24:26Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘평가받게’는 εὑρεθῶσιν(‘발견되다, 드러나다’)에 없는 평가 행위를 첨가합니다. 또한 ‘계속할 것입니다’는 미래 ποιήσω의 지속 의지를 어느 정도 전달하지만, 현재 ποιῶ와 미래의 병치를 ‘하고 있는 일…계속하겠습니다’로 더 분명히 나타낼 수 있습니다.
  naturalness: 개정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘기회를 얻고자 하는 사람들에게서 그 기회를’은 원문의 의도적인 ἀφορμή 반복을 유지하면서도 문맥상 이해됩니다.
  terminology: ἀφορμή는 본문에서 중립적으로 ‘기회’로 옮기고, ‘빌미’와 ‘계기’의 가능성은 주에 남깁니다. ἐκκόπτω의 비유적 강도는 ‘끊어 버려’로 보존했습니다. εὑρίσκω 수동은 ‘드러나게’로 옮겨 불필요한 해석적 의미를 피했습니다.
  issues:
  - severity: medium
    issue: ‘평가받게’
    rationale: εὑρεθῶσιν은 ‘발견되다/드러나다’이지 ‘평가받다’가 아닙니다. ‘평가’라는 외부 판단 행위를 더하므로 원문의 의미 범위를 좁힙니다.
  - severity: low
    issue: 현재와 미래 동사의 병치가 약함
    rationale: Ὃ ποιῶ καὶ ποιήσω는 현재의 행위와 앞으로도 행하겠다는 결의를 함께 나타냅니다. ‘내가 하고 있는 일은 앞으로도 계속하겠습니다’가 이를 더 직접적으로 반영합니다.
  revised_text: 그러나 내가 하고 있는 일은 앞으로도 계속하겠습니다. 이는 기회를 얻고자 하는 사람들에게서 그 기회[a]를 끊어 버려, 그들이 자랑하는 일에서 우리와 같이 드러나게 하려는 것입니다.
