  revision_rationale: 원문의 ‘다른 교회들’을 ἐσύλησα의 직접 목적어로 유지하고, 지원을 받는 행위와 고린도 교회를 섬기는 사역의 관계를 ‘~을 받아 … 섬김으로써’로 드러냈습니다. ‘약탈하였습니다’는 실제 범죄 고백이 아니라 바울의 의도적인 과장적·자조적 수사라는 원문의 강도를 보존합니다.
