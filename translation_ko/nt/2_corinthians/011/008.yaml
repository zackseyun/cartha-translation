  source_fidelity: 수정이 필요합니다. ἐσύλησα의 직접 목적어는 ‘다른 교회들’인데, 초안의 ‘다른 교회들의 것을 빼앗았습니다’는 원문에 없는 ‘것’을 보충하여 표현을 약화하고 초점을 옮깁니다. 또한 ὀψώνιον은 여기서 사역을 위해 받은 물질적 지원을 가리키며, ‘사례’는 현대 한국어에서 감사의 뜻으로 주는 금품이라는 뉘앙스가 강해 적합하지 않습니다.
  naturalness: ‘다른 교회들의 지원을 받아 여러분을 섬김으로써, 그 교회들을 약탈하였습니다’는 현대 표준어 합쇼체로 자연스럽고, 바울의 의도적인 과장·자조적 비유도 유지합니다.
  terminology: ἐκκλησία는 ‘교회들’, διακονία는 문맥상 ‘섬기다’로 옮깁니다. ὀψώνιον은 본문에서 ‘지원’으로 자연스럽게 번역하고, 문자적 의미인 ‘임금/급료’는 각주로 제시합니다. ‘약탈하다’는 συλάω의 강한 수사적 어조를 보존합니다.
  issues:
  - severity: medium
    issue: ‘다른 교회들의 것을 빼앗았습니다’
    rationale: 원문은 ‘다른 교회들을 약탈하였다’라고 직접 진술합니다. ‘것’을 넣으면 원문의 도발적인 비유와 직접 목적어가 흐려집니다.
  - severity: medium
    issue: ὀψώνιον을 ‘사례’로 번역함
    rationale: ‘사례’는 감사·답례 성격의 금품을 뜻하기 쉬우나, 여기서는 다른 교회들이 제공한 사역 수행을 위한 지원 또는 문자적으로 임금/급료를 가리킵니다.
  revised_text: 다른 교회들의 지원을 받아 여러분을 섬김으로써, 그 교회들을 약탈하였습니다.
