  verdict: revise
  source_fidelity: 원문의 직접 목적어인 ‘다른 교회들’과 강한 동사 ἐσύλησα를 살려야 합니다. ‘교회들의 것을 빼앗았습니다’는 소유물로 목적어를 바꾸어 원문의 의도적인 수사적 충격을 다소 약화합니다. ὀψώνιον은 여기서 받은 재정적 보조를 가리키지만, 본래 ‘보수/급료’라는 어휘이므로 ‘보수’가 적절합니다.
  naturalness: ‘다른 교회들을 약탈했습니다’는 실제 범죄의 고백이 아니라 문맥상 바울의 과장적·자조적 표현으로 자연스럽게 이해될 수 있으며, 합쇼체에도 맞습니다. ‘여러분을 섬기려고’는 목적을 간결하고 자연스럽게 나타냅니다.
  terminology: ἐκκλησία는 바울 문맥에서 ‘교회들’로, διακονία는 ‘섬기다’로 옮깁니다. ‘보수’는 ὀψώνιον의 문자적 급여·품삯의 뜻을 보존하면서도 해당 사역을 위한 지원이라는 문맥에 맞습니다.
  issues:
  - severity: medium
    issue: ‘다른 교회들의 것을 빼앗았습니다’가 원문의 목적어를 변경함
    rationale: 그리스어는 ‘다른 교회들’을 직접 ‘약탈했다/털었다’고 하며, 이것이 재정 지원을 두고 쓰는 의도적 과장입니다. 소유물로 바꾸면 이 수사적 표현이 약해집니다.
  - severity: low
    issue: ‘사례’의 의미 범위
    rationale: ‘사례’는 감사의 뜻으로 드리는 답례·사례금의 뉘앙스가 강할 수 있습니다. ὀψώνιον의 ‘보수, 급료’라는 기본 뜻에는 ‘보수’가 더 가깝습니다.
  revised_text: 나는 여러분을 섬기려고 보수를 받음으로써 다른 교회들을 약탈했습니다.[a]
  revised_footnotes:
