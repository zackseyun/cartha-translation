base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: ko
  text: 다시 말합니다[a]. 아무도 나를 어리석은 자라고 생각하지 않기를 바랍니다. 그러나 그렇지 않다면, 어리석은 자로라도 나를 받아 주십시오. 나도 조금 자랑할 수 있도록 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아무도 나를 어리석다고 생각하지 않기를 바랍니다 … 어리석은 사람으로라도 나를 받아 주십시오.” 그리스어 형용사 ἄφρων은 형용사적으로 “어리석은” 또는 명사적으로 “어리석은 자/사람”으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
