- from: 다시 말합니다. 아무도 나를 어리석은 자로 여기지 마십시오—그렇지 않다면 어리석은 자로라도 나를 받아 주십시오. 나도 조금 자랑하게 말입니다.
  to: 다시 말합니다[a]. 아무도 나를 어리석은 자라고 생각하지 않기를 바랍니다. 그러나 그렇지 않다면, 어리석은 자로라도 나를 받아 주십시오. 나도 조금 자랑할 수 있도록 말입니다.
  rationale: 문장의 마지막을 ἵνα 목적절에 맞는 자연스러운 합쇼체 표현으로 고쳤고, 부정 요청을 한국어다운 화자 중심의 바람 표현으로 다듬었습니다. ‘어리석은 자’, ‘받아 주십시오’, ‘자랑’은 원문의 반복과 아이러니를 보존합니다. 영어 POB 감사 기록의 ἄφρων 어휘 대안은 한국어 주석으로 반영했습니다.
