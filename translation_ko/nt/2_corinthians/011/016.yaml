    rationale: ‘나도 조금 자랑하게 말입니다’는 현대 표준 한국어에서 자연스러운 종결이나 목적 구문이 아니며, ἵνα 이하의 ‘그래서/그렇게 하여 나도 조금 자랑할 수 있도록’이라는 의미를 충분히 드러내지 못합니다.
  - severity: low
