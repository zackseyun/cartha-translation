  naturalness: ‘여러 차례 여행하는 가운데’와 각 항목의 ‘…에서/에게서 오는 위험’ 반복은 현대 표준 한국어에서 자연스럽고, 원문의 누적적 수사 효과를 유지합니다. 종결은 합쇼체 ‘겪었습니다’로 유지했습니다.
  terminology: ‘동족’, ‘이방인’, ‘광야’, ‘거짓 형제들’은 각각 γένους, ἐθνῶν, ἐρημίᾳ, ψευδαδέλφοις에 적절합니다. ‘거짓 형제들’은 원문의 남성 복수 및 자칭 형제 관계를 불필요하게 약화하거나 확대하지 않습니다.
