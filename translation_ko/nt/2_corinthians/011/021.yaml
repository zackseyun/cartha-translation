- from: 내가 부끄러워하며 말합니다. 우리는 마치 약했던 자들 같습니다. 그러나 누가 무엇으로 담대히 자랑하든—내가 어리석은 말을 합니다—나도 그렇게 담대합니다.
  to: 우리에게 수치가 되는 말이지만, 이렇게 말합니다. 마치 우리가 약했던 것처럼 말입니다. 그러나 누구든지 무엇에 관하여 감히 자랑한다면—어리석게 말하는 것이지만—나도 감히 자랑합니다.
  rationale: The revision corrects the sense of the shame/disgrace idiom, preserves the ironic force of the completed 'weakness' statement, and retains the repeated daring/boasting rhetoric. The contextual object '자랑' is made explicit in both matched clauses for clear Korean, as supported by the immediate context and the English POB audit trail.
