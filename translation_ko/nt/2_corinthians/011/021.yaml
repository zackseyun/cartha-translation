  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: ko
  text: 우리에게 수치가 되는 말이지만, 이렇게 말합니다. 마치 우리가 약했던 것처럼 말입니다. 그러나 누구든지 무엇에 관하여 감히 자랑한다면—어리석게 말하는 것이지만—나도 감히 자랑합니다.
  philosophy: optimal-equivalence
