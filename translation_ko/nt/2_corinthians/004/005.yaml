review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 마지막 절을 ‘우리 자신은 … 종이 됨을 전파합니다’로 옮겨, 바울 일행이 종이 되는 사건 자체를 전파한다는 뜻으로 바꾸었습니다. 헬라어는 κηρύσσομεν의 목적어로 ‘우리 자신’을 다시 제시하여, 자신들을 예수님 때문에 고린도 성도들의 종/노예로 선포한다는 대조를 이룹니다. 또한 ‘주로’는 ‘mainly’로도 읽힐 수 있어 κύριον의 칭호를 분명히 하지 못합니다.
  naturalness: ‘메시아 예수님을 주님으로 전파하며’와 ‘우리 자신을 여러분의 노예로 전파합니다’는 현대 표준 한국어의 격식 있는 문체에서 자연스럽고, 원문의 병렬과 생략된 동사를 무리 없이 드러냅니다.
  terminology: Χριστός의 칭호적 용법은 ‘메시아’로, κύριος는 존칭 칭호로 분명한 ‘주님’으로 옮겼습니다. δούλους는 영어 POB의 결정 및 원문의 강한 종속 의미에 따라 ‘노예’로 옮겼습니다. ‘종’도 가능한 어휘이나 여기서는 원문의 대조와 POB 용어 결정을 충분히 보존하지 못합니다.
  issues:
  - severity: high
    issue: ‘우리 자신은 예수 때문에 여러분의 종이 됨을 전파합니다’는 문장 구조와 의미를 변경합니다.
    rationale: ἑαυτοὺς δὲ δούλους ὑμῶν은 ‘우리 자신을 여러분의 노예로’라는 κηρύσσομεν의 병렬 목적어입니다. ‘종이 됨’을 전파한다는 명사절은 원문에 없는 사건화된 의미를 더합니다.
  - severity: medium
    issue: ‘메시아 예수를 주로’의 ‘주로’가 칭호로 명확하지 않습니다.
    rationale: 한국어 ‘주로’는 흔히 부사(‘mainly’)로 이해될 수 있습니다. κύριον의 고백적 칭호는 ‘주님으로’로 명시하는 것이 정확합니다.
  - severity: medium
    issue: δούλους를 ‘종’으로 약화하고 그 근거로 다른 본문과의 신학적 대비를 제시합니다.
    rationale: 이 절의 문맥은 예수님이 ‘주님’이심과 바울 일행이 성도들의 δούλοι임을 대조합니다. 영어 POB의 ‘slaves’ 결정에도 맞추어 ‘노예’가 종속의 강도를 더 충실히 보존합니다.
  revised_text: 우리는 우리 자신을 전파하는 것이 아니라, 메시아 예수님을 주님으로 전파하며, 예수님 때문에 우리 자신을 여러분의 노예로 전파합니다.
