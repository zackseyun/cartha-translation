    rationale: A footnote preserves the source’s possible senses (‘the many’ / ‘a greater number’) while retaining the contextually apt main rendering ‘더 많은 사람.’
  - severity: low
    issue: The participial relation of πλεονάσασα can be expressed more clearly.
    rationale: ‘풍성해짐으로써’ naturally conveys grace’s increase as the means/background for thanksgiving’s overflowing, without over-specifying the aorist participle’s temporal force.
