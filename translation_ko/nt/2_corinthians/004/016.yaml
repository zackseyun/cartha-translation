- from: 그러므로 우리는 낙심하지 않습니다. 비록 우리의 겉사람은 낡아 가지만, 우리의 속사람은 날마다 새로워집니다.
  to: 그러므로 우리는 낙심하지 않습니다. 우리의 겉사람이 비록 쇠하여 가더라도, 우리의 속사람은 날마다 새로워지고 있습니다.
  rationale: The revision explicitly marks the concessive relation (‘비록 …더라도’), uses ‘쇠하여 가다’ for the ongoing deterioration of the outer person, and retains the established paired terms ‘겉사람/속사람.’ ‘날마다 새로워지고 있습니다’ conveys the continuing renewal in modern formal-polite Korean.
