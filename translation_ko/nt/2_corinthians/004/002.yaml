  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἀπειπάμεθα의 단호한 포기를 단순한 ‘버리고’보다 ‘단념하였으며’로 옮기는 것이 더 정확하며, τὰ κρυπτὰ τῆς αἰσχύνης는 ‘부끄러움의 은밀한 것들’보다 자연스럽게 표현할 필요가 있습니다.
  naturalness: ‘부끄러움의 은밀한 것들’과 ‘우리 자신을 추천합니다’는 현대 표준어에서 다소 직역투입니다. 또한 완료된 포기를 현재형 ‘버리고’로 이어 가는 것보다 시제를 드러내는 편이 자연스럽습니다.
  terminology: ‘간교함’, ‘하나님의 말씀’, ‘왜곡하다’, ‘진리를 환히 드러냄’, ‘양심’, ‘하나님 앞에서’는 적절합니다. φανέρωσις를 ‘환히 드러냄’으로 옮긴 것은 단지 말로 선포하는 행위로 좁히지 않아 좋습니다.
  issues:
  - severity: medium
    issue: ἀπειπάμεθα의 단호한 포기와 완료된 행위가 충분히 드러나지 않습니다.
    rationale: ‘버리고’는 연결 표현으로 가능하지만, 본문의 부정과 결별의 선언을 ‘단념하였으며’로 옮기면 aorist middle의 결정적인 거부를 더 잘 반영합니다.
  - severity: low
    issue: τὰ κρυπτὰ τῆς αἰσχύνης의 한국어 표현이 다소 부자연스럽습니다.
    rationale: ‘부끄러움의 은밀한 것들’은 명사 연쇄가 어색합니다. ‘부끄러운 은밀한 일들’은 숨겨진 행위가 수치와 관련된다는 원문의 의미를 자연스럽게 보존합니다.
