  to: 그러나 우리는 부끄러운 은밀한 일들을 단념하였으며, 간교하게 행하거나 하나님의 말씀을 왜곡하지 않습니다. 오히려 진리를 환히 드러냄으로써 하나님 앞에서 모든 사람의 양심에 우리 자신을 추천합니다.
  rationale: 첫 ἀλλά는 앞 절과의 대조를 따라 ‘그러나’로, 두 번째 ἀλλά는 긍정적 대안을 나타내도록 ‘오히려’로 구분했습니다. ‘단념하였으며’는 ἀπειπάμεθα의 단호한 포기를, ‘부끄러운 은밀한 일들’은 τὰ κρυπτὰ τῆς αἰσχύνης를 자연스럽게 반영합니다. φανέρωσις의 공개적 드러냄은 유지하고, 별도의 각주는 본문 이해에 필수적이지 않아 두지 않았습니다.
