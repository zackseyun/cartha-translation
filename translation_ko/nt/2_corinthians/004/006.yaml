source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God, who said, "Light will shine out of darkness," has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
  footnotes:
  - marker: a
    text: Or, “in the person of Christ.” The Greek phrase can be understood more concretely as “in the face of the Messiah,” preserving the imagery of visible divine glory.
    reason: alternative_reading
  - marker: b
    text: Greek Χριστοῦ, traditionally “Christ”; here rendered “Messiah” because the term functions as a title.
    reason: lexical_alternative
  - marker: c
    text: The quotation echoes Genesis 1:3 and uses creation-light imagery for God's revelatory work in believers.
    reason: cross_reference
translation:
  language: ko
  text: 「어둠에서 빛이 비칠 것이다」라고 말씀하신 하나님께서, 메시아의 얼굴에 있는 하나님의 영광을 아는 지식을 밝히시려고 우리 마음에 빛을 비추셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “메시아의 인격 안에서.” 그리스어 표현은 더 구체적으로 “메시아의 얼굴에”라고 이해할 수 있으며, 이는 눈에 보이는 하나님의 영광이라는 비유를 보존합니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 Χριστοῦ는 전통적으로 “그리스도”로 옮깁니다. 여기서는 칭호로 기능하므로 “메시아”로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 인용은 창세기 1:3을 반향하며, 믿는 이들 안에서 이루어지는 하나님의 계시 사역을 창조의 빛 이미지로 나타냅니다.
    reason: cross_reference
lexical_decisions:
- source_word: σκότους / φῶς
  english_pob_choice: darkness / light
  chosen_korean: 어둠 / 빛
  alternatives_korean: []
  lexicon: BDAG
  rationale: 창 1:3 인유. 한국어 정립 어휘 「어둠/빛」.
- source_word: λάμψει
  english_pob_choice: will shine
  chosen_korean: 비치다
  alternatives_korean:
  - 빛나다
  lexicon: BDAG
  rationale: 창세기 1장 어휘의 인유.
- source_word: φωτισμὸν
  english_pob_choice: illumination
  chosen_korean: 빛 비춤
  alternatives_korean:
  - 조명
  lexicon: BDAG
  rationale: 「밝히 비춤」.
