translation:
  language: ko
  text: 그러나 우리는 기록된 바, “내가 믿었으므로 말하였다”와 같은 믿음의 영[a]을 가지고 있으므로, 우리도 믿습니다. 그러므로 또한 말합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “같은 믿음의 성령.” 여기서 ‘영’을 공유된 믿음의 태도나 원동력으로 이해할 수도 있고, 성령을 가리키는 것으로 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 시편 116:10(칠십인역 115:1)을 인용합니다.
    reason: cross_reference
