  source_fidelity: 수정안은 δέ의 전환을 ‘그러나’로, ἔχοντες의 분사 관계를 ‘가지고 있으므로’로, τὸ αὐτὸ πνεῦμα τῆς πίστεως를 ‘같은 믿음의 영’으로, 성경 인용과 바울 자신의 믿음·말함의 병행을 충실히 반영합니다. 초안은 ‘기록된 것과 같이’가 다소 부자연스럽고, 인용문 뒤의 어순 때문에 ‘같은’의 비교 대상과 논리적 병행이 덜 분명했습니다.
  naturalness: ‘기록된 바와 같이’는 현대 한국어 성경 문체에서 자연스럽고 격식 있는 인용 도입 표현입니다. 두 개의 독립된 현재 진술은 ‘우리도 믿습니다. 그러므로 또한 말합니다.’로 나누어 명료하게 했습니다.
