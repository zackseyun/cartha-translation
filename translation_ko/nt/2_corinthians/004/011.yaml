review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central sense, including ongoing delivery to death, the causal force of διὰ Ἰησοῦν, and the purpose clause. However, it does not explicitly represent καί ('also') with '예수의 생명,' and its purpose-clause wording is less direct than the Greek.
  naturalness: ‘우리 살아 있는 자들은’ is understandable but stiff in modern standard Korean. ‘살아 있는 우리는’ is more natural while retaining the participial contrast. ‘예수님’ is appropriate in modern formal-polite Bible Korean.
  terminology: ‘죽을 육신’ accurately retains θνητῇ σαρκί and should not be replaced with a doctrinally loaded expression. ‘넘겨집니다’ suitably renders the present passive παραδιδόμεθα. Footnotes preserve both the causal alternatives for διὰ Ἰησοῦν and the literal bodily sense of ‘육신.’
  issues:
  - severity: medium
    issue: The correspondence marker καί is not represented.
    rationale: καί in ‘ἡ ζωὴ τοῦ Ἰησοῦ’ marks the corresponding manifestation of Jesus’ life; ‘또한’ should be included.
  - severity: low
    issue: The opening noun phrase is unnaturally ordered for modern Korean.
    rationale: ‘살아 있는 우리는’ is more idiomatic than ‘우리 살아 있는 자들은’ without changing the sense.
  - severity: low
    issue: The purpose clause is somewhat paraphrastic.
    rationale: ‘나타나도록 하기 위함입니다’ more transparently reflects ἵνα … φανερωθῇ while retaining formal-polite register.
  revised_text: 살아 있는 우리는 예수님 때문에[a] 항상 죽음에 넘겨집니다. 이는 예수님의 생명도 우리의 죽을 육신[b] 안에 나타나도록 하기 위함입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘예수님으로 말미암아’ 또는 ‘예수님을 위하여’.
    reason: διὰ Ἰησοῦν은 문맥상 원인·이유를 나타내며, 한국어로는 몇 가지 표현이 가능합니다.
  - marker: b
    text: ‘육신’은 여기서 ‘죄된 본성’이 아니라 죽을 수밖에 없는 몸의 존재를 가리킵니다.
    reason: θνητῇ σαρκί는 문자적이고 죽을 수밖에 없는 신체적 존재를 가리킵니다.
  revision_rationale: The revision improves idiomatic modern Korean, explicitly renders ‘also,’ preserves the passive and purposive structure, and supplies anchored notes for the two documented lexical/theological matters. It does not resolve disputed Pauline terminology beyond the immediate mortal-bodily context.
