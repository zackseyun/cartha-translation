review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘우리 살아 있는 자들은’은 그리스어의 실체화된 분사를 지나치게 직역하여 한국어 어순이 부자연스럽습니다. ‘이는 … 하려는 것입니다’는 목적절에 의도 주체를 다소 강하게 암시할 수 있으므로, 목적을 직접 나타내는 표현이 더 안전합니다.
  naturalness: ‘살아 있는 우리는’이 현대 표준 한국어에서 자연스럽습니다. ‘죽을 육신’은 θνητῇ σαρκί의 신체적·죽을 운명이라는 뜻을 잘 보존하며, ‘우리의 죽을 육신에도’는 καί의 대응 관계도 자연스럽게 드러냅니다.
  terminology: σάρξ는 여기서 윤리적 의미의 ‘죄된 본성’이 아니라 죽을 수 있는 육체적 존재를 가리키므로 ‘육신’을 유지하는 것이 적절합니다. 성경 한국어의 일반적인 경어 관습과 합쇼체 문체에 맞추어 ‘예수님’으로 표기했습니다.
  issues:
  - severity: medium
    issue: ‘우리 살아 있는 자들은’이라는 어순
    rationale: 원문의 οἱ ζῶντες를 반영하려 한 표현이나 현대 한국어에서는 어색합니다. ‘살아 있는 우리는’이 의미와 대조를 보존하면서 자연스럽습니다.
  - severity: low
    issue: 목적절 ‘이는 … 하려는 것입니다’
    rationale: ἵνα의 목적을 옮기지만, ‘하려는’은 암시적 의도 주체를 다소 부각할 수 있습니다. ‘… 나타나도록 하기 위함입니다’가 목적 관계를 더 직접적으로 나타냅니다.
  revised_text: 살아 있는 우리는 예수님 때문에 항상 죽음에 넘겨집니다. 이는 예수님의 생명이 우리의 죽을 육신에도 나타나도록 하기 위함입니다.
  revised_footnotes:
  - marker: a
    text: 또는 “예수님을 위하여.”
    reason: διὰ Ἰησοῦν은 문맥상 ‘예수님 때문에’라는 이유를 나타내며, ‘예수님을 위하여’로도 옮길 수 있습니다.
  - marker: b
    text: 여기서 ‘육신’은 ‘죄된 본성’이 아니라 죽을 수 있는 육체적 존재를 가리킵니다.
    reason: θνητῇ σαρκί는 문자적·신체적 죽을 운명을 가리키므로, 바울 서신에서 가능한 윤리적 의미와 구별할 필요가 있습니다.
  revision_rationale: 어순을 현대 표준어에 맞게 다듬고, ἵνα 목적절을 보다 직접적으로 옮겼습니다. παραδιδόμεθα의 지속적 수동 의미(‘항상 … 넘겨집니다’), διὰ Ἰησοῦν의 이유 의미, 그리고 θνητῇ σαρκί의 문자적 ‘죽을 육신’은 보존했습니다. 각주 표지는 각각 ‘예수님 때문에’와 ‘육신’에 배치합니다.
