source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus' sake, so that the life of Jesus also may be revealed in our mortal flesh.
  footnotes:
  - marker: a
    text: Or 'because of Jesus' or 'for Jesus.'
    reason: lexical_alternative
  - marker: b
    text: '''Flesh'' here refers to mortal bodily existence, not to the ''sinful nature.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 살아 있는 우리는 예수님 때문에[a] 항상 죽음에 넘겨집니다. 이는 예수님의 생명도 우리의 죽을 육신[b] 안에 나타나도록 하기 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예수님으로 말미암아’ 또는 ‘예수님을 위하여’.
    reason: διὰ Ἰησοῦν은 문맥상 원인·이유를 나타내며, 한국어로는 몇 가지 표현이 가능합니다.
  - marker: b
    text: ‘육신’은 여기서 ‘죄된 본성’이 아니라 죽을 수밖에 없는 몸의 존재를 가리킵니다.
    reason: θνητῇ σαρκί는 문자적이고 죽을 수밖에 없는 신체적 존재를 가리킵니다.
