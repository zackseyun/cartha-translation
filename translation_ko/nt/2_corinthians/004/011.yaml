- source_word: θνητῇ σαρκὶ
  english_pob_choice: mortal flesh
  chosen_korean: 죽을 육신
  alternatives_korean:
  - 죽을 몸
  lexicon: BDAG
  rationale: θνητός(죽을 운명)와 σάρξ(육신)의 조합.
