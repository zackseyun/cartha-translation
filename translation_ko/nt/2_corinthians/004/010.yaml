translation:
  language: ko
  text: 우리는 언제나 예수의 죽음[1]을 몸에 짊어지고 다닙니다. 이는 예수의 생명도 우리의 몸에 나타나도록 하기 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 또는 ‘예수께서 겪으신 죽어 감’. 그리스어 명사는 몸에 지닌 죽음의 상태나 경험을 강조할 수 있습니다.
    reason: ‘죽음’이라는 본문의 간결한 번역을 유지하면서 νέκρωσις의 상태적·경험적 뉘앙스를 밝혀 줍니다.
lexical_decisions:
- source_word: νέκρωσιν
  english_pob_choice: death
  chosen_korean: 죽음
  alternatives_korean:
  - 죽임의 흔적
  - 죽음의 과정
  lexicon: BDAG
  rationale: νέκρωσις는 단순 죽음(θάνατος)보다 「죽어 감의 과정·죽임 당함의 상태」를 가리킨다. 한국어 한 단어로 옮기기 어려워 「죽음」을 채택하되 진행성 함의를 「짊어지고 다니다」로 보강.
- source_word: περιφέροντες
