  source_fidelity: 초안의 ‘사형 선고를 받은 것처럼 여겼는데’는 ἀπόκριμα τοῦ θανάτου를 ‘사형’으로 지나치게 특정하고, ‘것처럼 여겼다’를 첨가하여 본문의 단정적 표현 ἐσχήκαμεν을 약화합니다. 또한 ‘하나님을 의지하게 하시려’는 하나님을 목적절의 명시적 행위자로 만들지만, 헬라어는 목적 자체를 제시합니다.
