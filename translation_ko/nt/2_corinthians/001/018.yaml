  to: 하나님께서 신실하신 것처럼, 우리가 여러분에게 전한 말도 ‘예’이면서 ‘아니요’인 것이 아닙니다.
  rationale: The revision preserves the Greek asseverative appeal to God's faithfulness, renders λόγος as a message Paul and his coworkers delivered to the readers, and clearly retains the deliberately paired ‘Yes’ and ‘No’ expression. It uses contemporary standard Korean in formal-polite scripture register.
