  - severity: low
    issue: 아가야의 지역적 범위 표현
    rationale: ἐν ὅλῃ τῇ Ἀχαΐᾳ는 아가야 전체에 걸친 범위를 뜻하므로 ‘아가야 전역에 있는’이 자연스럽고 명확합니다.
