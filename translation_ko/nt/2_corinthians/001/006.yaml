id: 2CO.1.6
reference: 2 Corinthians 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted, it is for your comfort and salvation; or if we are comforted, it is for your comfort, which is at work in enduring the same sufferings that we also suffer.
  footnotes:
  - marker: a
    text: 'Some manuscripts omit: ''or if we are comforted, it is for your comfort.'''
    reason: textual_variant
  - marker: b
    text: Or 'encouragement' for 'comfort' throughout this verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 환난을 당하여도[a] 여러분의 위로와 구원을 위함이요, 우리가 위로를 받아도 여러분의 위로를 위함이니[b], 이 위로는 우리도 겪는 같은 고난을 견뎌 내는 가운데 역사합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 “우리가 위로를 받아도 여러분의 위로를 위함이니”가 없습니다.
    reason: textual_variant
  - marker: b
    text: 이 절 전체에서 ‘위로’는 ‘격려’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  english_pob_choice: are afflicted
  chosen_korean: 환난을 당하다
  alternatives_korean:
  - 고난당하다
  - 눌리다
  lexicon: BDAG
  rationale: 명사 θλῖψις와 동근의 동사. 「환난을 당하다」로 통일한다.
- source_word: σωτηρίας
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean: []
  lexicon: BDAG
  rationale: 바울의 정립된 신학 어휘.
- source_word: ἐν ὑπομονῇ
  english_pob_choice: in enduring
  chosen_korean: 견뎌 내는 가운데
  alternatives_korean:
  - 인내 가운데
  lexicon: BDAG
  rationale: ὑπομονή는 능동적 견딤을 가리키며, 「견뎌 내는」이 능동성을 잘 담는다.
