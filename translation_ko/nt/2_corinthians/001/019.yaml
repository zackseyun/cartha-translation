  to: 우리, 곧 나와 실루아노와 디모데를 통하여 여러분 가운데 전파된 하나님의 아들이신 예수 메시아는 「예」도 되고 「아니요」도 되신 적이 없고, 도리어 그분 안에서 「예」가 되셨습니다.
  rationale: ‘하면서’를 병렬 표현인 ‘도 되고 …도’로 고쳐 Ναὶ καὶ Οὔ의 수사적 대조를 보존하고, 동격을 ‘아들이신’으로 자연스럽게 표시했습니다. 나머지 표현은 원문의 반복된 διὰ, κηρυχθείς의 수동태, 그리고 ἐγένετο/γέγονεν의 ‘되다’ 어휘를 유지했습니다.
