  source_fidelity: 그리스어의 미완료 과거 ἐβουλόμην은 과거의 의도이므로, 초안의 ‘가기를 원했으니’보다 ‘가려고 했습니다’가 더 정확합니다. ἵνα 이하의 목적도 ‘…하려는 것이었습니다’로 자연스럽게 보존됩니다. δευτέραν χάριν은 이 문맥에서 방문으로 얻게 될 두 번째 유익/호의를 가리키므로 ‘두 번째 유익’이 문맥상 가장 분명하며, ‘은혜’는 각주로 보존합니다.
