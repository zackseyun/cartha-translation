review_pass:
  verdict: revise
  source_fidelity: 그리스어는 앞 절의 하나님을 가리켜 ‘우리에게 인을 치시고 우리 마음에 그 영의 아르라본을 주신 분’이라고 말합니다. 초안의 ‘영을 보증으로 주셨습니다’는 ἀρραβῶνα τοῦ πνεύματος를 ‘영을 보증으로’로 재구성하여, 영이 보증물이라는 해석을 본문에 확정합니다. 원문의 간결한 속격 관계와 상업적 비유를 더 직접적으로 보존하는 편이 적절합니다.
  naturalness: ‘인을 치시고’는 현대 표준어 성경 문체에서 자연스럽고 격식 있는 표현입니다. ‘우리 마음에’보다 ‘우리 마음속에’가 ἐν의 내적 위치를 더 자연스럽게 드러내며, ‘보증금’은 오늘날 반환 가능한 예치금의 뜻으로도 흔히 쓰여 여기에는 부적절합니다.
  terminology: 하나님을 가리키는 ‘영’은 문맥상 성령을 뜻하므로 표준 한국어 성경 용례 및 독자의 명료성을 위해 ‘성령’이 적절합니다. ἀρραβών은 ‘보증’보다 첫 지급분이라는 상업적 은유를 남기는 ‘계약금’이 더 가깝습니다. 다만 속격의 관계를 해석으로 고정하지 않도록 ‘성령의 계약금’으로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘영을 보증으로’가 ἀρραβῶνα τοῦ πνεύματος의 속격 관계를 ‘영 자체가 보증’이라는 한 해석으로 확정합니다.
    rationale: 원문은 ‘그 영의 아르라본/계약금’이라는 압축된 표현이며, 영어 POB도 ‘down payment of the Spirit’으로 이를 보존합니다. 한국어도 ‘성령의 계약금’으로 직역적 긴장을 유지할 수 있습니다.
  - severity: medium
    issue: ‘보증’은 ἀρραβών의 선지급·첫 분량이라는 상업적 비유를 약화합니다.
    rationale: ἀρραβών은 장차 전부가 지급될 것을 보장하는 최초의 지급분을 가리킵니다. ‘계약금’은 현대 한국어에서 이 비유를 비교적 자연스럽게 유지합니다.
  - severity: low
    issue: ‘영’은 이 문맥에서 지시 대상이 다소 불명확합니다.
    rationale: 바울의 문맥상 하나님의 영을 가리키므로 ‘성령’이 표준 한국어 독자에게 명료합니다.
  revised_text: 하나님께서는 또한 우리에게 인을 치시고 우리 마음속에 성령의 계약금을 주셨습니다.
  revised_footnotes:
  - marker: a
    text: ‘계약금’은 장차 전부가 주어질 것을 보장하는 첫 지급분을 뜻합니다. 또는 ‘성령의 보증’으로 옮길 수 있습니다.
    reason: ἀρραβών의 상업적 은유와 ‘보증’이라는 가능한 어휘 대안을 밝혀, 본문의 속격 관계를 과도하게 해석하지 않도록 합니다.
  revision_rationale: 초안의 문체와 ‘인을 치다’를 유지하되, ἀρραβῶνα τοῦ πνεύματος의 압축된 표현 및 상업적 비유를 보존하도록 ‘성령의 계약금’으로 바로잡았습니다. ‘마음속에’로 ἐν의 위치 관계를 자연스럽게 드러냈습니다.
