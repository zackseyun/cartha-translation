review_pass:
  verdict: revise
  source_fidelity: σφραγίζω와 ἀρραβών의 비유를 유지하고, τοῦ πνεύματος를 ‘영을 보증으로’로 옮겨 성령이 보증/선불의 역할을 한다는 자연스러운 해석을 반영합니다. 다만 ἀρραβών의 상업적 비유는 ‘보증’만으로 다소 약해질 수 있으므로 각주로 보완합니다.
  naturalness: ‘인 치시고’는 현대 표준 표기와 자연스러운 문장에 맞게 ‘인을 치시고’로 고치는 것이 안전합니다. 쉼표를 넣어 병렬 동작도 분명히 했습니다.
  terminology: ‘영’은 원문의 πνεύματος 및 제시된 번역 방침에 부합합니다. ‘보증’은 한국어 성경 문맥에서 통용되지만, ‘보증금’은 현대 한국어에서 대개 임대차의 security deposit을 뜻하므로 본문 대안으로 적절하지 않습니다.
  issues:
  - severity: low
    issue: ‘인 치시고’의 띄어쓰기와 어휘 형태
    rationale: 현대 표준어에서는 ‘인을 치다’가 더 자연스럽고 명료합니다. ‘인치다’도 종교 문맥에서 쓰이나 다소 전문적·관습적 표현입니다.
  - severity: low
    issue: ἀρραβών의 상업적 비유가 ‘보증’에서 약화될 수 있음
    rationale: ἀρραβών은 장차 전부가 지급될 것을 보장하는 선불금/계약금의 구체적 비유입니다. 본문의 전통적이고 자연스러운 ‘보증’을 유지하되, 각주에서 비유의 대안을 밝혀야 합니다.
  revised_text: 하나님께서는 또한 우리에게 인을 치시고, 우리 마음에 영을 보증으로 주셨습니다.
  revised_footnotes:
  - marker: a
    text: ‘보증’은 장차 완성을 보장하는 선불금 또는 계약금을 가리키는 말입니다.
    reason: lexical_alternative
  revision_rationale: 본문의 의미와 원문의 병렬 구조를 보존하면서, 비표준적으로 보일 수 있는 ‘인 치시고’를 현대적인 ‘인을 치시고’로 바로잡았습니다. ἀρραβών은 본문에서 통용되는 ‘보증’으로 유지하되, 상업적 은유를 각주로 드러냈습니다.
