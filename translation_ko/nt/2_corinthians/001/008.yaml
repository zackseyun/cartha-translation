    rationale: ἐξαπορηθῆναι는 바울 일행이 삶에 대해서까지 절망하게 된 결과를 말합니다. ‘소망이 끊어졌다’는 비인칭적 상태보다 ‘삶마저도 포기할 정도였습니다’가 해당 결과와 주체를 더 분명히 나타냅니다.
