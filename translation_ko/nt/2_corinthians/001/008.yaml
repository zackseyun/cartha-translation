    issue: 「여러분이 모르기를 원치 않습니다」의 부정 범위가 한국어에서 모호합니다.
    rationale: 원문은 ‘여러분이 알지 못하는 상태에 있기를 우리가 원하지 않는다’는 뜻입니다. 초안은 표면상 ‘여러분이 모르기를 바란다’로 오해될 수 있습니다.
  - severity: medium
