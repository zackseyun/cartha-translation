  terminology: ῥύομαι를 ‘건지다’로 일관되게 옮긴 것은 적절합니다. θανάτου를 ‘죽음’으로 유지하여 ‘치명적인 위험’으로 해석을 앞세우지 않은 점도 원문 충실성에 맞습니다. ‘소망을 두다’는 εἰς ὃν의 인격적 소망의 대상을 자연스럽게 표현합니다.
