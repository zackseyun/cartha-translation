  source_fidelity: 초안의 첫 절은 대체로 원문의 압축된 표현을 따르지만, 후반절은 ‘우리도 아멘으로 하나님께 영광을 돌립니다’로 풀어 써서 원문의 ‘그분을 통하여 … 우리를 통하여 아멘이 된다’라는 병행 구조와 ‘영광을 위하여’의 목적 표현을 바꾸었습니다.
  naturalness: ‘아멘이 됩니다’는 다소 압축적이지만, 이 구절의 의도적인 수사적 생략을 보존하는 데 적절합니다. 어순을 조정하면 현대 한국어 합쇼체에서도 이해 가능합니다.
  terminology: ‘약속’, ‘아멘’, ‘영광’은 적절합니다. ‘예’는 그리스어 τὸ Ναί의 강조된 명사적 용법을 자연스럽게 살립니다.
  issues:
  - severity: medium
    issue: 후반절의 주체와 관계를 ‘우리도 「아멘」으로 하나님께 영광을 돌립니다’로 명시화함
    rationale: 원문은 δι’ αὐτοῦ(그분을 통하여), τὸ Ἀμήν(그 아멘), πρὸς δόξαν(영광을 위하여), δι’ ἡμῶν(우리를 통하여)의 압축된 병행을 사용합니다. 초안은 ‘우리’가 아멘으로 영광을 돌리는 주체라는 해석을 본문에 확정하고, ‘영광을 위하여’를 직접 목적어 구문으로 바꾸었습니다.
  revised_text: 하나님의 약속은 얼마나 많든지 그분 안에서 「예」가 됩니다. 그러므로 또한 그분을 통하여, 하나님께 영광이 되도록 우리를 통하여 「아멘」이 됩니다.
  revised_footnotes:
  - marker: a
    text: 「아멘」은 히브리어에서 온 말로, ‘참으로’ 또는 ‘그대로 이루어지기를’이라는 뜻의 확언입니다.
    reason: cultural_note
