review_pass:
  verdict: revise
  source_fidelity: 초안의 첫 절은 ‘그분 안에서 「예」가 됩니다’라고 하여 γίνομαι(되다)를 보충하고, 둘째 절은 ‘우리도 … 영광을 돌립니다’라고 하여 우리를 행위의 주체로 명시합니다. 원문은 각각 ‘그분 안에서 그 약속들은 예이다’와 ‘그분을 통하여 아멘도 … 드려진다’라는 압축된 표현이므로, 이를 더 가깝게 보존할 필요가 있습니다.
  naturalness: 수정문은 현대 표준어의 격식 있는 합쇼체로 자연스럽습니다. 원문의 수사적 병렬인 「예」와 「아멘」도 유지합니다.
  terminology: ἐπαγγελίαι는 ‘약속’, δόξα는 ‘영광’, Ἀμήν은 한국어에 정착한 음역 ‘아멘’으로 옮기는 것이 적절합니다. ‘언약’으로 바꾸지 않습니다.
  issues:
  - severity: medium
    issue: ‘그분 안에서 「예」가 됩니다’
    rationale: 원문은 ‘그분 안에서 [그 약속들은] 예이다’라는 생략적 진술이며, ‘됩니다’는 원문에 없는 변화·성립의 동사를 도입합니다.
  - severity: high
    issue: ‘우리도 「아멘」으로 하나님께 영광을 돌립니다’
    rationale: καὶ는 ‘우리도’라는 주어 추가가 아니며, 원문은 ‘아멘’을 하나님께 드려지는 것으로 말합니다. 또한 δι’ ἡμῶν은 ‘우리를 통하여’라는 매개 표현으로 남겨야 합니다.
  revised_text: 하나님의 약속이 아무리 많아도, 그 약속들은 그분 안에서 「예」입니다. 그러므로 그분을 통하여 「아멘」도 우리를 통하여 하나님께 영광이 되도록 하나님께 드려집니다.
  revised_footnotes:
  - marker: a
    text: 「아멘」은 ‘참으로’, ‘그대로 이루어지기를’과 같은 뜻을 지닌 확언의 말입니다.
    reason: cultural_note
  revision_rationale: 첫 문장에서는 복수인 ‘약속들’을 보충하여 한국어 문장으로 자연스럽게 하되, 원문의 압축된 ‘예이다’를 보존했습니다. 둘째 문장에서는 그리스어의 병렬 구조와 ‘그분을 통하여’ 및 ‘우리를 통하여’를 유지하고, 한국어에서 필요한 최소한의 수동 서술어만 보충했습니다.
