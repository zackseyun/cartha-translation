  to: 여러분에 대한 우리의 소망은 확고합니다. 여러분이 고난에 참여하는 것처럼 위로[a]에도 참여한다는 것을 우리가 알기 때문입니다.
  rationale: 문장을 두 문장으로 유지하면서 βεβαία의 서술을 자연스럽게 「소망은 확고합니다」로 다듬었습니다. 현재형 ἐστε에 맞추어 「동참한」을 「참여하는」으로 고쳤고, ὡς ... οὕτως καί의 상관 구조를 「… 것처럼 …에도」로 보존했습니다. 원문의 반복된 참여 개념을 유지하기 위해 양쪽에 「참여하다」를 사용했습니다.
