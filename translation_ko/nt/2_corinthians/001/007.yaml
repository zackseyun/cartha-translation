  source_fidelity: 핵심 의미는 대체로 잘 옮겼으나, 현재형 ἐστε를 「동참한」으로 과거화한 점은 고쳐야 합니다. 또한 고난과 위로 모두에 대한 동일한 참여의 병행을 현재적으로 유지하는 편이 원문에 더 가깝습니다.
  naturalness: 「고난에 동참한 것같이」는 현대 한국어에서 다소 어색할 뿐 아니라 완료된 과거 사건처럼 들립니다. 「고난에 참여하는 것처럼, 위로에도 참여한다」는 합쇼체 문맥에서 자연스럽고 병행 구조도 분명합니다.
