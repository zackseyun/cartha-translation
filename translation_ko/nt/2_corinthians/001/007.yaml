    issue: 「동참한」이 현재 직설법 ἐστε를 과거형으로 옮김
    rationale: 원문은 수신자들이 현재 고난의 참여자임을 말하며, 이어지는 위로의 참여와 병행합니다. 「동참한」은 그 참여가 이미 완료된 일이라는 인상을 줍니다.
  - severity: low
    issue: 영어 POB의 παράκλησις 어휘 대안 각주가 한국어 본문에 반영되지 않음
