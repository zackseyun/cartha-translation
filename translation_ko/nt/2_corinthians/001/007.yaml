source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm, because we know that just as you share in the sufferings, so also you share in the comfort.
  footnotes:
  - marker: a
    text: Or "encouragement" for "comfort" (παράκλησις).
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분에 대한 우리의 소망은 확고합니다. 여러분이 고난에 참여하는 것처럼 위로[a]에도 참여한다는 것을 우리가 알기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘격려’.
    reason: παράκλησις는 이 문맥에서 ‘위로’로 옮기는 것이 적절하지만 ‘격려’라는 의미도 가능합니다.
lexical_decisions:
- source_word: ἐλπὶς
  english_pob_choice: hope
  chosen_korean: 소망
  alternatives_korean:
  - 희망
  lexicon: BDAG
  rationale: 바울의 신학 어휘로 「소망」이 정립된 등가어. 「희망」은 일반어로 신학적 무게가 약하다.
- source_word: βεβαία
  english_pob_choice: firm
  chosen_korean: 확고하다
  alternatives_korean:
  - 굳건하다
  - 견고하다
  lexicon: BDAG
  rationale: βέβαιος는 흔들리지 않는 확실성을 가리킨다.
- source_word: κοινωνοί
  english_pob_choice: share in
  chosen_korean: 동참하다
  alternatives_korean:
  - 함께 나누다
  - 교제하다
  lexicon: BDAG
  rationale: κοινωνός는 적극적 참여자를 가리키며, 본 문맥에서 「동참하다」가 가장 적절하다.
