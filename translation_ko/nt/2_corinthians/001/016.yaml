  source_fidelity: 초안은 여행 계획의 기본 순서(고린도→마게도냐→고린도→유대)를 잘 반영합니다. 그러나 καί를 「곧」으로 옮긴 것은 원문의 단순 접속을 설명·동격으로 바꾸며, ὑφ’ ὑμῶν προπεμφθῆναι의 여행 전송 의미는 「여러분의 도움으로」보다 「여러분의 전송을 받아」가 더 직접적으로 드러냅니다.
  naturalness: 수정문은 현대 표준 한국어의 합쇼체 문장으로 자연스럽고, 앞 절에서 언급된 바울의 의도를 받아 완결되는 「-려 한 것입니다」를 유지합니다. 「여러분을 거쳐」는 이동 경로를 간결하게 나타냅니다.
  terminology: 「마게도냐」와 「유대」는 한국어 성경에서 널리 쓰이는 지명 표기이며 적절합니다. προπεμφθῆναι는 단순히 떠나게 됨이 아니라 공동체가 여행자를 전송하고 필요한 지원을 제공하는 상황을 가리킬 수 있으므로, 본문에는 「전송을 받아」를 쓰고 주석으로 그 함의를 밝혔습니다.
