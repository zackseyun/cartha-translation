review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the overall contrast, shared work for the Corinthians' joy, and their firm standing by faith. However, both occurrences of "되려는" add an intentional/future nuance not present in the Greek present indicatives κυριεύομεν and ἐσμεν. The text states what Paul and his colleagues are not and are, not what they seek to become.
  naturalness: The revised wording is natural modern standard Korean in formal-polite style. "믿음에 군림하다" more idiomatically and forcefully conveys κυριεύομεν than "믿음을 주관하다," while "함께 일하는 이들" clearly expresses συνεργοί without requiring ecclesial jargon.
  terminology: '"믿음" consistently renders πίστις. "군림하다" preserves the domineering/lordship sense of κυριεύω. "기쁨을 위해 함께 일하는 이들" represents συνεργοί ... τῆς χαρᾶς ὑμῶν as collaboration directed toward their joy. "믿음으로 굳게 서" appropriately reflects the dative and the resultative perfect ἑστήκατε.'
  issues:
  - severity: medium
    issue: '"되려는 것입니다" is used for both κύριεύομεν and συνεργοί ἐσμεν.'
    rationale: This changes present assertions ("we do not lord it over" / "we are fellow workers") into aspirations or intentions ("we are trying to...").
  - severity: low
    issue: '"주관하다" weakens the sense of κυριεύω.'
    rationale: In this context κυριεύω denotes exercising lordly, domineering control. "믿음에 군림하다" retains that force in idiomatic Korean.
  revised_text: 우리는 여러분의 믿음에 군림하는 것이 아니라, 여러분의 기쁨을 위해 함께 일하는 이들입니다. 여러분이 믿음으로 굳게 서 있기 때문입니다.
  revised_footnotes: []
  revision_rationale: The revision removes the unwarranted volitional nuance, strengthens the rendering of κυριεύω, and retains the source's concise causal conclusion and its ambiguity-free Korean rendering of τῇ πίστει as "믿음으로."
