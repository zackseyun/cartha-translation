  source_fidelity: 수정이 필요합니다. συνυπουργούντων는 직설적인 명령이 아니라 바울의 진술에 딸린 현재 능동 분사이므로, 초안의 ‘도와주십시오’는 원문의 서술을 권면으로 바꿉니다. 또한 διὰ πολλῶν은 두 번째 ‘많은’을 이루며 해석상 연결이 논쟁적인 요소인데 초안은 이를 ‘여러 사람이’로 바꾸어 첫 번째 πολλῶν과 중복시키고, ‘많은 사람의 입을 통하여’는 ἐκ πολλῶν προσώπων의 관용적 의미를 지나치게 문자화합니다.
