revisions:
- from: 이는 우리가 여러분 너머의 지역에서 복음을 전하고, 다른 사람의 사역 영역에서 이미 마련된 일들로 자랑하지 않으려는 것입니다.
  to: 이는 우리가 여러분 너머의 지역들에서 복음을 전하고, 다른 이의 영역에서 이미 준비된 것들을 두고 자랑하지 않기 위함입니다.
  rationale: The revision retains the verse’s purpose-oriented structure, renders κανών as ‘영역’ without unnecessary expansion, and changes the Korean relation of boasting from instrumental ‘-로’ to the source-faithful referential expression ‘것들을 두고.’ No footnote is required because the rendering itself is clear and no unresolved textual ambiguity is introduced.
  reviewer_model: gpt-5.6-terra
