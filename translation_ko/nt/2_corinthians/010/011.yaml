  source_fidelity: 현 번역은 λογιζέσθω의 명령적 요구와 ‘말/행동’ 대조를 대체로 반영합니다. 그러나 οἷοί ἐσμεν … τοιοῦτοι의 현재적 동등 비교를 ‘그렇게 할 것입니다’라는 미래 행위 예고로 바꾸었고, παρόντες를 ‘함께 있을 때’로 옮겨 ‘직접 대면해 있을 때’라는 뜻이 불분명해졌습니다.
  naturalness: ‘편지로 말로 하는’은 조사 배열이 부자연스럽고, ‘함께 있을 때’는 문맥상 상대와 동행한다는 뜻으로도 읽힐 수 있습니다. ‘편지로 하는 말’ 및 ‘직접 있을 때’가 현대 표준 한국어에서 더 자연스럽고 명확합니다.
