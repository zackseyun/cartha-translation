- from: 나 바울이 친히 메시아의 온유와 너그러우심으로 여러분에게 권면합니다—나는 여러분과 얼굴을 마주할 때는 비천하지만 떠나 있을 때에는 여러분을 향해 담대합니다.
  to: 바울인 내가 친히 메시아의 온유함과 너그러움으로 여러분에게 권면합니다—나는 여러분과 함께 있을 때에는 겸손하지만[a], 자리를 비울 때에는 여러분에게 대하여 담대합니다.
