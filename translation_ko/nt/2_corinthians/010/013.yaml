  - 구역
- source_word: μέτρον
  english_pob_choice: measure
  chosen_korean: 분수
  lexicon: BDAG
  rationale: 한국어 「분수」가 측량·할당의 함의를 자연스럽게 담는다.
  alternatives_korean:
  - 측정
  - 한계
