review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies God's allotted sphere as including the Corinthians, but its repeated use of "분수" is not a faithful rendering of μέτρον in this context. In contemporary Korean, 분수 primarily means one's social station or proper place and introduces an unintended moralizing nuance. "사역" is interpretive rather than explicit in the Greek.
  naturalness: '"분수 이상으로" and "사역 영역의 분수" are awkward and semantically misleading in modern formal Korean. "한도를 넘어" and "범위의 분량" are natural enough while retaining the passage''s linked measure/extent imagery.'
  terminology: Render κανών as "범위" here, reflecting a God-allotted sphere or extent without importing the notion of a moral rule or the explicit but unstated term "사역." Render μέτρον as "분량," preserving its repetition and its relation to the extent that reaches the recipients.
  issues:
  - severity: medium
    issue: '"분수" is used for μέτρον.'
    rationale: Although etymologically related to measuring, modern Korean 분수 commonly denotes one's proper social standing ('know one's place'). This obscures Paul's measure/assigned-extent metaphor and can wrongly suggest boasting beyond one's status.
  - severity: low
    issue: '"사역" is added in "사역 영역."'
    rationale: The context concerns Paul's apostolic work, but κανών itself denotes the allotted sphere/boundary. "범위" conveys the source term without adding an explicit interpretive noun.
  - severity: low
    issue: The second μέτρου should remain visibly connected to the measure that extends to the Corinthians.
    rationale: The source repeats μέτρον and presents the allotted extent as reaching to the audience. Retaining "그 분량" preserves this feature clearly.
  revised_text: 그러나 우리는 한도를 넘어 자랑하지 않고, 하나님께서 우리에게 나누어 주신 범위의 분량에 따라 자랑할 것입니다. 그 분량은 여러분에게까지 이릅니다—
  revised_footnotes: []
