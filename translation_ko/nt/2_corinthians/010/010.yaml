  verdict: revise
  source_fidelity: 수정안은 ὅτι가 이끄는 바울 비판자들의 인용을 보존하고, 복수 ἐπιστολαί, 대조 μέν…δέ, 신체적 παρουσία, 그리고 ἐξουθενημένος의 타인에 의한 경멸이라는 뉘앙스를 반영합니다. φησίν은 문법상 단수이나 문맥상 대표적·인용 관용 표현으로 보아 ‘사람들이 말합니다’로 옮기고 각주에서 그 점을 밝혔습니다.
  naturalness: 초안의 ‘몸으로 마주할 때’는 παρουσία를 만남의 행위로 다소 좁힐 수 있어, 현대 표준 한국어에서 직접적이고 자연스러운 ‘그가 몸으로 있을 때’로 다듬었습니다. ‘업신여김을 받습니다’는 인용된 적대적 평가임을 드러내면서도 자연스럽습니다.
  terminology: ‘편지들’, ‘무게 있고 힘이 있다’, ‘몸으로 있을 때’, ‘말’은 각각 ἐπιστολαί, βαρεῖαι καὶ ἰσχυραί, παρουσία τοῦ σώματος, λόγος에 충실합니다. ‘업신여김을 받습니다’는 ἐξουθενημένος를 말 자체의 객관적 가치 판단으로 단정하지 않고, 멸시하는 측의 처우로 표현합니다.
  issues:
  - severity: medium
    issue: ‘어떤 이가 말합니다’
    rationale: φησίν은 형태상 단수이지만 이 문맥에서는 바울 비판자들의 보고된 견해를 도입합니다. ‘어떤 이’는 비판을 한 개인의 말로 과도하게 특정하며, 문맥과 영어 감사 기록의 대표적 인용 이해를 충분히 반영하지 못합니다.
  - severity: medium
    issue: ‘몸으로 마주할 때’
    rationale: παρουσία는 바울의 대면한 현존·외적 উপস্থিত을 뜻합니다. 현 문구는 ‘마주하는 때’라는 상호 행위로 의미를 좁힐 수 있습니다.
  - severity: medium
    issue: ‘말은 보잘것없다’
    rationale: ἐξουθενημένος는 멸시받거나 업신여김을 받는다는 평가·처우의 뜻입니다. ‘보잘것없다’도 가능하지만, 말의 내재적 무가치로 읽히기 쉬워 수동적 뉘앙스가 약해집니다.
  revised_text: 사람들이 말합니다[a]. “그의 편지들은 무게 있고 힘이 있지만, 그가 몸으로 있을 때에는 약하며 그의 말은 업신여김을 받습니다[b].”
