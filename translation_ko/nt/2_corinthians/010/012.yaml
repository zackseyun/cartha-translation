revisions:
- from: 우리는 스스로를 추천하는 어떤 이들과 자신을 같이 끼워 넣거나 비교할 엄두를 내지 못합니다. 그들은 스스로를 자기 자신으로 재고 자기 자신과 비교하니, 깨닫지 못합니다.
  to: 우리는 자기를 내세우는 어떤 사람들과 우리 자신을 같은 부류에 넣거나 비교할 엄두를 내지 못합니다[a]. 그러나 그들은 자기들끼리 자기 자신을 재고 자기 자신을 자기 자신과 비교하니[b], 깨닫지 못합니다.
  rationale: 원문의 반복되는 재귀대명사와 συγκρίνω의 반복을 보존하면서, ἐγκρῖναι를 ‘같은 부류에 넣다’로 정확하고 자연스러운 표준 한국어로 다듬었습니다. ‘자기를 내세우는’은 재귀적 자기 천거를 자연스럽게 표현합니다. ἐν ἑαυτοῖς의 해석상 여지를 각주에서 직역으로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:24:27Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ‘같이 끼워 넣다’는 ἐγκρῖναι의 ‘같은 부류에 넣다/동류로 여기다’라는 뜻을 다소 구어적으로 전달하지만, 정식 본문에는 더 정확하고 자연스러운 표현이 적절합니다. δεύτε 절의 ἐν ἑαυτοῖς는 문맥상 자기들끼리를 기준으로 삼는다는 뜻이며, 반복되는 재귀 표현을 살려 옮겨야 합니다. αὐτοὶ의 대조적 강조도 ‘그러나 그들은’으로 드러내는 것이 좋습니다.
  naturalness: ‘자신을 같이 끼워 넣다’는 현대 표준어 성경 문체로 어색합니다. ‘우리 자신을 … 같은 부류에 넣다’와 ‘자기들끼리 자기 자신을 재다’가 더 자연스럽고 합쇼체에도 맞습니다.
  terminology: συνιστάνω의 재귀 용법은 단순한 상품·인물 ‘추천’보다 ‘자기를 내세우다’가 자연스럽고, 2고린도전서 10장의 자기 추천/자기 과시 문맥을 잘 반영합니다. συγκρίνω는 두 번 모두 ‘비교하다’로 일관되게 옮깁니다.
  issues:
  - severity: medium
    issue: ‘같이 끼워 넣거나’
    rationale: ἐγκρῖναι의 동류로 분류하거나 같은 범주에 포함한다는 의미를 지나치게 구어적으로 표현하며, ‘자신을 … 끼워 넣다’는 문장도 부자연스럽습니다.
  - severity: low
    issue: ‘스스로를 추천하는’
    rationale: 원문의 재귀적 자기 천거를 문자적으로 반영하려 했으나, 한국어에서는 ‘자기를 내세우는’이 더 자연스럽고 문맥에 맞습니다.
  - severity: low
    issue: αὐτοὶ의 강조와 ἐν ἑαυτοῖς의 문맥적 의미가 약함
    rationale: ‘그러나 그들은’과 ‘자기들끼리’를 사용하면 바울 일행과 상대자들의 대조 및 자기들만을 기준으로 삼는 비판을 더 분명히 전달합니다.
