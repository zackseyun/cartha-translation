  text: 우리는 다른 사람들의 수고를 가지고 분수에 넘치게 자랑하지 않습니다. 다만 여러분의 믿음이 자라감에 따라, 우리의 사역이 여러분 가운데서 우리에게 정해진 범위에 따라 더욱 넓어지기를 바랍니다.[a]
