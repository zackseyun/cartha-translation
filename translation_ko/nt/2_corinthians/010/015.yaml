  to: 우리는 다른 사람들의 수고를 가지고 분수에 넘치게 자랑하지 않습니다. 다만 여러분의 믿음이 자라감에 따라, 우리의 사역이 여러분 가운데서 우리에게 정해진 범위에 따라 더욱 넓어지기를 바랍니다.[a]
  rationale: ‘다른 사람들의 수고를 가지고’로 ἐν ἀλλοτρίοις κόποις의 자랑 근거를 자연스럽게 표현했습니다. ἐν ὑμῖν을 ‘여러분 가운데서’로 명시하고, μεγαλυνθῆναι를 사도적 활동의 확장이라는 문맥에 맞추어 ‘우리의 사역이 … 넓어지다’로 옮겼습니다. κανών의 배정된 범위라는 뜻과 εἰς περισσείαν의 증대 방향은 본문 및 각주에서 보존했습니다.
