source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: ko
  text: 그러나 내가 간청합니다. 내가 여러분과 함께 있을 때에는, 우리를 육신을 따라 행한다고 여기는 어떤 이들에게 감히 맞설 생각을 하고 있는 그 확신을 가지고 담대하게 나설 필요가 없게 해 주십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간적인 기준에 따라 살아간다고.’
    reason: κατὰ σάρκα는 본문에서 바울의 표현을 살려 ‘육신을 따라’로 옮기되, 문맥상 가능한 비유적·사회적 의미를 제시합니다.
lexical_decisions:
- source_word: δέομαι
  english_pob_choice: beg
  chosen_korean: 간청합니다
  lexicon: BDAG
  rationale: 강한 부탁. 「간청」이 적절.
- source_word: πεποιθήσις
  english_pob_choice: confidence
  chosen_korean: 확신
  lexicon: BDAG
  rationale: 8:22, 9:4와 일관성 유지.
- source_word: τολμῆσαι
  english_pob_choice: daring
  chosen_korean: 담대히 맞서리라고
  lexicon: BDAG
  rationale: 동사 τολμάω. 두려움 없이 맞서는 행위.
  alternatives_korean:
  - 감히 ~하리라고
- source_word: κατὰ σάρκα
  english_pob_choice: according to the flesh
  chosen_korean: 육신을 따라
  lexicon: BDAG
  rationale: 바울의 핵심 신학 표현. 「육신을 따라」가 정착된 한국어 표준.
  alternatives_korean:
  - 육체를 따라
