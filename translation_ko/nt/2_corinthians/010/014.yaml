    rationale: ὑπερεκτείνομεν ἑαυτούς의 ‘자신을 지나치게 뻗다/범위를 넘어서 뻗다’라는 비유는 보존해야 하나, 기존 표현은 문법적으로도 문체적으로도 매끄럽지 않습니다.
