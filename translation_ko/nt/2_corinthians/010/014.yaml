  source_fidelity: 핵심 논지는 보존되어 있습니다. 그러나 ὑπερεκτείνομεν ἑαυτούς의 비유적 표현을 옮긴 ‘자신을 지나치게 뻗치는’은 한국어에서 부자연스럽고, ἐν τῷ εὐαγγελίῳ는 ‘복음을 가지고’보다 ‘복음으로’가 수단/사역의 맥락을 더 직접적으로 드러냅니다.
