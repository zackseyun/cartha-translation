  lexicon: BDAG
  rationale: 전쟁 비유의 핵심 어휘. 표준 등가어.
- source_word: σαρκικά
  english_pob_choice: fleshly
  chosen_korean: 육신적인
  lexicon: BDAG
  rationale: 앞 절의 κατὰ σάρκα와 호응.
- source_word: ὀχυρωμάτων
  english_pob_choice: strongholds
  chosen_korean: 견고한 진
  lexicon: BDAG
  rationale: 군사 어휘로서 「요새, 보루」. 한국어 성경 전통의 「견고한 진」이 그 비유를 가장 잘 담는다.
