- source_word: λογισμούς
  english_pob_choice: arguments
  chosen_korean: 주장들
  lexicon: BDAG
  rationale: 여기서 λογισμός는 단순한 「생각」이 아니라 하나님 지식에 맞서 세워진 「주장·논증」이다. 「주장들」로 옮겨 다음 절 νοήματα(「생각」)와 변별한다.
  alternatives_korean:
  - 생각
  - 논증
