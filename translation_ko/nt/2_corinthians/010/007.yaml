  to: 여러분은 겉으로 드러난 것만 보고 있습니다.[a] 누구든지 자신이 메시아께 속해 있다고 확신한다면, 자신에 대하여 다시 생각해 보십시오. 자신이 메시아께 속한 것처럼 우리도 메시아께 속해 있다는 것을 말입니다.
