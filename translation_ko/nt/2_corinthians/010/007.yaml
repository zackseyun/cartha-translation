source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: ko
  text: 여러분은 겉으로 드러난 것만 보고 있습니다.[a] 누구든지 자신이 메시아께 속해 있다고 확신한다면, 자신에 대하여 다시 생각해 보십시오. 자신이 메시아께 속한 것처럼 우리도 메시아께 속해 있다는 것을 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, “여러분은 겉모습에 따라 보고 있습니다.” 또는 “여러분 앞에 있는 것을 보십시오.”
    reason: Τὰ κατὰ πρόσωπον βλέπετε는 문맥상 외적 모습에 따른 판단을 꾸짖는 서술문으로 읽는 것이 자연스럽지만, 형태상 ‘눈앞에 있는 것을 보라’라는 명령으로도 해석될 수 있다.
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  english_pob_choice: outward appearances
  chosen_korean: 겉모습
  lexicon: BDAG
  rationale: 「얼굴에 따라」의 관용 표현. 「겉모습」이 한국어에서 분명하다.
  alternatives_korean:
  - 외양
- source_word: Χριστοῦ εἶναι
  english_pob_choice: belongs to Messiah
  chosen_korean: 메시아께 속한 자
  lexicon: BDAG
  rationale: 속격 + εἰμί 구조. 칭호적 「메시아」 보존.
  alternatives_korean:
  - 그리스도께 속한 자
- source_word: πέποιθεν
  english_pob_choice: is confident
  chosen_korean: 확신한다면
  lexicon: BDAG
  rationale: 완료 능동. 「확신하다」가 표준.
