  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 εἰδώλων은 복수이므로 ‘우상들’로 옮기는 것이 정확하며, καθώς의 성경 인용 연결도 ‘말씀하신 것과 같습니다’로 드러내는 편이 낫습니다. ἐν αὐτοῖς는 공동체적 문맥상 ‘그들 가운데’가 자연스럽지만 ‘그들 안에’라는 가능한 번역을 각주로 보존합니다.
  naturalness: ‘하나님의 성전이 우상과 어떤 합의가 있겠습니까?’는 성전 자체가 합의의 주체처럼 들리고 ‘어떤 합의’도 이 문맥에서 다소 어색합니다. ‘하나님의 성전과 우상들이 무슨 합의가 있겠습니까?’가 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘하나님의 성전’, ‘우상들’, ‘살아 계신 하나님’, ‘내 백성’은 본문의 제의적·언약적 어휘와 한국어 성서 문체에 잘 맞습니다. 기존 각주의 ‘바울은 LXX 형태로 인용한다’는 단정은 이 인용이 여러 구약 본문을 결합한 형태라는 점을 충분히 반영하지 못하므로 완화합니다.
  issues:
