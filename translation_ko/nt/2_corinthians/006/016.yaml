    issue: ‘하나님의 성전이 우상과 어떤 합의가 있겠습니까?’
    rationale: 원문의 비교 대상은 ‘하나님의 성전’과 복수의 ‘우상들’입니다. ‘성전과 우상들이 무슨 합의가 있겠습니까?’로 고치면 복수와 수사 의문문의 관계가 분명하고 자연스럽습니다.
