revisions:
- from: 슬퍼하는 자 같으나 항상 기뻐하고, 가난한 자 같으나 많은 사람을 부유하게 하며, 아무것도 없는 자 같으나 모든 것을 소유한 자입니다.
  to: 슬퍼하는 듯하나 언제나 기뻐하고, 가난한 듯하나 많은 사람을 부요하게 하며, 아무것도 가진 것이 없는 듯하나 모든 것을 소유한 사람들입니다.
  rationale: 본문은 ὡς의 반복을 '…듯하나'로 유지하고, λυπούμενοι·χαίροντες·πλουτίζοντες·ἔχοντες·κατέχοντες의 진행적 병렬을 '-하고/-하며/사람들입니다'로 자연스럽게 연결했습니다. '부요하게'와 '모든 것을 소유한'은 그 부요와 소유의 성격을 본문에서 해석적으로 한정하지 않습니다.
  reviewer_model: gpt-5.6-terra
