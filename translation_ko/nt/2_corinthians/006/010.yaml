review_pass:
  verdict: revise
  source_fidelity: 초안은 세 역설의 기본 대조와 '항상' 및 '많은 사람'을 대체로 충실히 옮깁니다. 그러나 반복되는 ὡς의 비교적 틀과 복수 분사들의 병렬성이 한국어에서 다소 불균형하며, 마지막의 단수형 '소유한 자입니다'는 앞 절들과의 연결이 부자연스럽습니다.
  naturalness: '''슬퍼하는 자 같으나''와 ''가난한 자 같으나''는 문맥상 이해되지만, 현대 표준 한국어 합쇼체에서는 ''…듯하나''의 반복 병렬과 복수 주어를 드러내는 종결이 더 자연스럽습니다. ''가진 것이 없다''도 ''아무것도 없다''보다 μηδὲν ἔχοντες의 소유 표현을 잘 살립니다.'
  terminology: '''부요하게 하다''는 πλουτίζοντες의 ''부유하게/풍성하게 하다''를 간결하게 옮기며, 물질적·비물질적 의미를 본문에서 한쪽으로 한정하지 않습니다. ''소유하다''는 κατέχοντες에 적절합니다.'
  issues:
  - severity: medium
    issue: 반복되는 비교 구문과 병렬의 불균형
    rationale: 헬라어는 세 항목 모두 ὡς로 시작하는 병렬 구조입니다. 초안의 마지막 '아무것도 없는 자 같으나 모든 것을 소유한 자입니다'는 앞의 동사형 종결들과 달리 명사 서술로 끝나고 단수처럼 들려, 복수 분사들의 열거가 약해집니다.
  - severity: low
    issue: μηδὲν ἔχοντες의 소유 뉘앙스
    rationale: '''아무것도 없는''도 가능하나, ''아무것도 가진 것이 없는''은 ἔχοντες(가지고 있는)의 대조를 뒤의 ''소유한''과 함께 더 분명히 보존합니다.'
  revised_text: 슬퍼하는 듯하나 언제나 기뻐하고, 가난한 듯하나 많은 사람을 부요하게 하며, 아무것도 가진 것이 없는 듯하나 모든 것을 소유한 사람들입니다.
