  - severity: medium
    issue: The clause containing ἰδού is syntactically awkward in the draft.
    rationale: Korean needs an explicit subject or a recast predicate after “보십시오.” “보십시오, 우리는 살아 있으며” is natural, formal, and retains the attention-getting particle.
