  - marker: b
    text: 직역하면 ‘넓혀지십시오’. 문맥에서는 마음과 애정을 넓게 열라는 뜻입니다.
    reason: πλατύνθητε의 문자적 비유와 앞 절들의 문맥적 의미를 함께 제시합니다.
