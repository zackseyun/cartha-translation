  source_fidelity: 개정이 필요합니다. ὡς τέκνοις λέγω는 ‘내가 자녀에게 말하듯 말합니다’보다, 독자에게 자녀들에게 하듯 말한다는 삽입 설명으로 옮기는 것이 문장 구조와 수신자 관계를 더 정확히 드러냅니다. 또한 ‘답례’는 사례나 답례품의 뉘앙스를 띨 수 있어, ἀντιμισθίαν의 상응·상호성의 뜻에는 ‘상응하는 보답’이 더 적절합니다. πλατύνθητε는 문맥상 ‘마음을 넓히십시오’로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: 원문의 삽입구와 권면의 흐름을 긴 대시로 유지하되, 한국어에서는 ‘그에 상응하는 보답으로’와 ‘여러분도 마음을 넓히십시오’가 자연스럽습니다. ‘자녀들에게 말하듯이 여러분에게 말합니다’는 다소 반복되지만 원문의 목회적 삽입을 보존합니다.
  terminology: ‘상응하는 보답’은 금전적 보상으로 한정하지 않고 상호적인 응답이라는 ἀντιμισθία의 의미를 전달합니다. ‘마음을 넓히십시오’는 직역 ‘넓혀지십시오’의 비유를 살린 관용적 표현이며, 앞 절들의 문맥이 가리키는 애정과 수용성의 의미를 과도하게 교리화하지 않습니다.
  issues:
