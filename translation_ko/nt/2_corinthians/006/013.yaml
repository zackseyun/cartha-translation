    issue: ὡς τέκνοις λέγω의 한국어 구조가 부정확하고 어색합니다.
    rationale: ‘내가 자녀에게 말하듯 말합니다’는 ‘말하듯 말하다’라는 중복을 만들고, 바울이 수신자에게 자녀들에게 하듯 말한다는 삽입적 호소의 기능을 충분히 나타내지 못합니다.
  - severity: low
    issue: ‘같은 답례’가 ἀντιμισθίαν의 상응성 및 상호성을 충분히 전달하지 못합니다.
    rationale: ‘답례’는 한국어에서 답례품이나 의례적 감사의 뜻으로도 흔히 쓰입니다. 문맥상 바울이 요청하는 것은 그들이 받은 열린 마음에 상응하여 자신들도 마음을 넓히는 응답입니다.
