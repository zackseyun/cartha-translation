review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the prohibition, the contrast of righteousness and lawlessness, and the light/darkness parallel. However, 「짝지어 함께」 is redundant and does not idiomatically express the διαφορόζυγος (mismatched-yoke) image. The relational questions are more faithfully and naturally expressed with 「사이에」.
  naturalness: 「의가 불법과 어떤 동참이」 and 「빛이 어둠과 어떤 사귐이」 are grammatically understandable but unnatural in contemporary formal Korean. 「의와 불법 사이에 무슨 동참이」 and the corresponding second question are idiomatic while retaining the distinct terms.
  terminology: 「의」 appropriately renders δικαιοσύνη in this Pauline ethical contrast, and 「불법」 appropriately renders ἀνομία. 「동참」 and 「사귐」 preserve a measured lexical distinction between μετοχή and κοινωνία. A footnote should retain ‘정의’ as a lexical alternative for δικαιοσύνη, and the yoke metaphor merits an explanatory note.
  issues:
  - severity: medium
    issue: The opening phrase is redundant and weakens the mismatched-yoke metaphor.
    rationale: 「짝지어 함께 멍에를 메다」 duplicates the idea of joining and does not clearly convey ἑτεροζυγοῦντες, being yoked in a mismatched way. 「짝이 맞지 않는 멍에를 메다」 is clearer and more idiomatic.
  - severity: medium
    issue: The two rhetorical questions use unnatural Korean relational syntax.
    rationale: The Greek datives express the relationship between the paired terms. Adding 「사이에」 produces natural Korean and accurately conveys the intended contrast.
  - severity: low
    issue: The draft omits the audit-trail notes for the yoke image and the alternative ‘justice’ sense of δικαιοσύνη.
    rationale: These notes preserve relevant lexical and intertextual information without over-interpreting the verse.
  revised_text: 믿지 않는 이들과 짝이 맞지 않는 멍에를 메지 마십시오.[a] 의와 불법 사이에 무슨 동참이 있겠습니까?[b] 빛과 어둠 사이에 무슨 사귐이 있겠습니까?
  revised_footnotes:
  - marker: a
    text: 「짝이 맞지 않는 멍에」는 서로 다른 종류의 짐승을 한 멍에에 매는 모습을 떠올리게 합니다. 신명기 22:10을 보십시오.
    reason: cross_reference
  - marker: b
    text: 「의」는 「정의」로도 옮길 수 있습니다(δικαιοσύνη).
    reason: lexical_alternative
  revision_rationale: The revision removes redundancy, makes the two rhetorical questions idiomatic in modern formal Korean, and maintains the Greek metaphor and lexical contrasts. The footnotes preserve the English audit trail’s intertextual and lexical alternatives.
