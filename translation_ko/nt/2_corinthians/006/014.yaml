  verdict: revise
  source_fidelity: 첫 명령은 ἑτεροζυγοῦντες의 ‘서로 다른 종류와 한 멍에를 메는’ 비유를 드러내려 하나, 현행 ‘짝지어 함께’는 중복되고 이질성의 뜻이 불분명합니다. 또한 ‘의가 불법과 어떤 동참이 있겠습니까?’는 한국어 문법과 결합이 부자연스럽습니다. 수정문은 명령의 진행·상태 변화(γίνεσθε)와 두 수사 의문의 대조를 보존합니다.
  naturalness: ‘어울리지 않는 짝으로 한 멍에를 메다’는 비유를 한국어에서 이해 가능하게 유지하며, ‘무슨 관계/사귐’은 현대 표준어 합쇼체의 자연스러운 수사 의문입니다.
  terminology: ἀπίστοις는 ‘믿지 않는 이들’, δικαιοσύνη는 ‘의’, ἀνομία는 ‘불법’, κοινωνία는 ‘사귐’으로 옮겼습니다. μετοχή의 관계·공동 참여 의미는 ‘관계’로 자연스럽게 번역하되, 다음 절의 ‘사귐’과의 어휘적 차이는 유지했습니다.
  issues:
  - severity: medium
    issue: ‘짝지어 함께 멍에를 메지 마십시오’의 중복 및 의미 불명확성
    rationale: ‘짝지어’와 ‘함께’가 중복되며, ἑτεροζυγοῦντες가 나타내는 부적합하거나 서로 다른 짝이라는 핵심 비유가 충분히 드러나지 않습니다.
  - severity: medium
    issue: ‘의가 불법과 어떤 동참이 있겠습니까?’의 부자연스러운 결합
    rationale: ‘동참이 있다’는 이 문맥에서 자연스러운 한국어 서술이 아닙니다. μετοχή의 공동 관계라는 뜻을 ‘무슨 관계가 있겠습니까?’로 옮기는 것이 자연스럽습니다.
  revised_text: 여러분은 믿지 않는 이들과 어울리지 않는 짝으로 한 멍에를 메지 마십시오. 의가 불법과 무슨 관계가 있겠습니까? 빛이 어둠과 무슨 사귐이 있겠습니까?
