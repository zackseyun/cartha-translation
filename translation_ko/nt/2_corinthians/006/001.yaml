    issue: The explicit partner in “하나님과 함께” is interpretively supplied without a note.
    rationale: Συνεργοῦντες does not name the party with whom Paul is working. The preceding context strongly supports God, but the alternative, less explicit construal should remain available through a footnote.
  - severity: low
    issue: “일하는 자로서 또한” is stylistically stiff.
    rationale: The Greek uses a present participle; “일하며, 우리는 또한” is idiomatic Korean and preserves the verbal, attendant-force relationship more directly.
  revised_text: 하나님과 함께 일하며[a], 우리는 또한 여러분에게 권합니다. 하나님의 은혜를 헛되이 받지 마십시오.
