  verdict: revise
  source_fidelity: 초안은 ἐν의 반복과 διά의 수단적 의미, 그리고 ‘의의 무기’를 대체로 반영합니다. 그러나 ‘좌우의 의의 무기’는 원문의 ‘오른쪽과 왼쪽’이 무기를 수식하는 관계를 한국어에서 불분명하게 만들며, ‘좌우’가 방향·진영을 뜻하는 것으로도 읽힐 수 있습니다.
  naturalness: ‘진리의 말씀 가운데, 하나님의 능력 가운데’는 이해할 수 있으나, 이 병렬된 ἐν구는 한국어에서 ‘… 안에서’가 더 자연스럽고 분명합니다. ‘오른손과 왼손에 든’은 원문이 함축하는 손의 이미지를 자연스럽게 풀어 줍니다.
  terminology: ‘의’는 δικαιοσύνη의 통상적이고 적절한 번역이며, ‘정의’라는 가능한 어휘 범위는 각주로 보존하는 것이 좋습니다. ὅπλα는 ‘무기’가 적절합니다.
  issues:
  - severity: medium
    issue: ‘좌우의 의의 무기’의 수식 관계가 불명확함
    rationale: τῶν δεξιῶν καὶ ἀριστερῶν은 ‘무기’와 연결되어 오른손과 왼손의 군사적 이미지를 이룹니다. ‘좌우의’는 한국어에서 ‘양쪽의’ 또는 ‘좌우 진영의’라는 뜻으로도 읽혀, 손과 무기의 관계를 선명히 나타내지 못합니다.
  - severity: low
    issue: ἐν의 병렬 표현이 다소 직역투임
    rationale: ‘말씀 가운데/능력 가운데’도 가능하지만, 이 문맥에서는 ‘말씀과 능력 안에서’가 현대 표준 한국어에서 더 자연스럽고 원문의 병렬도 유지합니다.
  revised_text: 진리의 말씀과 하나님의 능력 안에서, 오른손과 왼손에 든 의의 무기를 통하여,
  revised_footnotes:
  - marker: a
    text: ‘의’는 ‘정의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘오른쪽의 것들과 왼쪽의 것들’입니다. 문맥상 오른손과 왼손에 쓰는 무기를 가리키는 것으로 이해됩니다.
    reason: cultural_note
  revision_rationale: ‘오른손과 왼손에 든’을 사용하여 원문의 생략된 손의 이미지를 한국어에서 명확히 하되, 무기가 공격과 방어를 각각 가리킨다고 단정하지 않았습니다. ‘통하여’는 διά의 수단적 용법을 반영합니다. δικαιοσύνη는 본문에서 ‘의’로 유지하고 대안은 각주에 보존했습니다.
