  rationale: 「어떤 일에서도」로 ἐν μηδενί의 포괄적 범위를, 「아무에게도 걸림돌이 되지 않으며」로 μηδεμίαν ... διδόντες προσκοπήν의 관용적 의미를 자연스럽게 옮겼습니다. 「사역」은 διακονία의 문맥상 의미를 유지하고, 「사역이 비난받지 않도록 합니다」는 ἵνα μὴ μωμηθῇ의 목적을 보존합니다.
