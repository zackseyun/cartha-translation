review_pass:
  verdict: revise
  source_fidelity: 원문의 명령형 복수(ἐξέλθατε, ἀφορίσθητε, μὴ ἅπτεσθε), 현재형 인용 공식(λέγει κύριος), 그리고 미래의 약속(κἀγὼ εἰσδέξομαι ὑμᾶς)을 직접화법 안에서 각각 분명히 반영하도록 수정했습니다. 초안의 ‘그리하면’은 원문에 명시된 조건 접속사가 아니므로 제거했습니다.
  naturalness: ‘따로 떨어지라’보다 수동 명령의 뉘앙스와 현대 표준어에 맞는 ‘구별되십시오’가 자연스럽습니다. 합쇼체에 맞추어 인용문 안의 명령과 발화 공식을 ‘-십시오/-십니다’로 통일했습니다.
  terminology: κύριος는 영어 POB의 결정 및 그리스어 본문에 따라 ‘주’로 유지했습니다. ἀκάθαρτος는 포괄적 단수 표현인 ‘부정한 것’으로, εἰσδέξομαι는 호의적인 수용을 나타내는 ‘받아들이겠습니다’로 옮겼습니다.
  issues:
  - severity: medium
    issue: 인용 공식의 시제와 문장 틀
    rationale: 초안은 직접 인용 뒤에 ‘라고 하셨습니다’를 덧붙여 λέγει κύριος(‘주께서 말씀하신다/말씀하십니다’)의 현재형 예언자적 인용 공식을 과거 서술로 바꾸고, 인용문 안의 ‘주께서 말씀하신다’와 중복시킵니다.
  - severity: medium
    issue: ‘그리하면’의 추가
    rationale: κἀγώ는 ‘그리고 나도/그리고 내가’이지 명시적 조건절이 아닙니다. 문맥상 연관은 있으나 한국어의 ‘그리하면’은 원문보다 조건 관계를 더 노골적으로 만듭니다.
  - severity: low
    issue: 각주의 근거 설명
    rationale: 초안 각주는 본문 번역에 불필요한 LXX·히브리어 신명 표기 설명을 길게 포함하며, ‘겔 20:34의 결합 인용’만으로는 ‘받아들이겠다’에 관련된 에스겔 20:41 등의 배경을 충분히 나타내지 못합니다. 본문의 구약 예언서 반향을 간결하고 정확하게 제시하는 편이 낫습니다.
