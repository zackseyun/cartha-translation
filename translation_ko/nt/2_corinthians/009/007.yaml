  source_fidelity: 'The draft accurately conveys the inward prior decision (προῄρηται τῇ καρδίᾳ), the contrasts of sorrow (ἐκ λύπης) and compulsion (ἐξ ἀνάγκης), and God''s love for a cheerful giver. However, ‘할 것이며’ is semantically underspecified: in this context the implied action is giving, which should be stated in Korean as it is in the English audit translation.'
