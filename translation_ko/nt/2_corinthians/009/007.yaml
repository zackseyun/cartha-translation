    issue: The phrase ‘마음에 정한 대로 할 것이며’ leaves the required action unspecified.
    rationale: Although the Greek verb ‘give’ is ellipted in this clause and supplied from context, Korean ‘하다’ is too vague. The context and the English audit correctly supply ‘give’; ‘드려야 하며’ makes this explicit.
