  source_fidelity: 그리스어의 감사 감탄문(χάρις τῷ θεῷ), 감사의 근거를 나타내는 ἐπί+여격, 그리고 ‘그의/하나님의 형언할 수 없는 선물’을 대체로 정확히 옮겼습니다. 다만 한국어 본문에서는 소유 관계를 더 자연스럽고 명료하게 드러내기 위해 ‘하나님께서 주신’으로 표현하는 것이 좋습니다. 이는 δωρεά와 αὐτοῦ가 함께 나타내는 하나님의 선물이라는 뜻을 바꾸지 않습니다.
