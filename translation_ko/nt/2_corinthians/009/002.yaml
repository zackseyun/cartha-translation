  text: 나는 여러분의 자원하는 마음을 알고 있습니다. 나는 여러분을 두고 마게도냐 사람들에게 아가야가 작년부터 준비되어 있다고 자랑합니다. 그리고 여러분의 열심은 그들 대다수를 분발하게 했습니다.
