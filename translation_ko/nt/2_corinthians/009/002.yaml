review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘 선택(‘자원하는 마음’, ‘아가야’, ‘마게도냐 사람들’, ‘열심’)은 대체로 원문에 충실합니다. 그러나 초안의 ‘자랑하기를, … 합니다’는 καυχῶμαι의 현재 직설법 및 이어지는 ὅτι절의 내용을 한국어 문장으로 정확하고 자연스럽게 연결하지 못합니다. 또한 τοὺς πλείονας는 ‘많은 이’보다 ‘대다수’를 뜻합니다.
  naturalness: 초안은 ‘그것을 여러분을 위하여 마게도냐 사람들에게 자랑하기를’의 어순과 연결이 현대 표준 한국어로 부자연스럽고, 문장의 주체와 발화 내용이 불명료합니다. ‘여러분을 두고 … 자랑합니다. 곧 …’으로 고치면 합쇼체의 자연스러운 문장이 됩니다.
  terminology: ‘아가야’와 ‘마게도냐 사람들’은 한국어 성경 전통 및 지명·민족명 표기에 적절합니다. ‘자원하는 마음’과 ‘열심’도 이 문맥에서 유지할 수 있습니다. ‘그들 대다수’는 마게도냐 사람들을 가리키는 원문의 함축된 선행사를 자연스럽게 반영합니다.
  issues:
  - severity: medium
    issue: ‘자랑하기를, 아가야는 … 한다고 합니다’의 문장 연결
    rationale: 원문의 ‘나는 … 자랑합니다, 곧/즉 아가야가 … 준비되어 있다고’라는 구조를 한국어에서 부정확하고 부자연스럽게 처리합니다. 바울이 현재 마게도냐 사람들에게 자랑한다는 뜻이 드러나야 합니다.
  - severity: medium
    issue: ‘많은 이’
    rationale: τοὺς πλείονας는 단순히 많은 사람이 아니라 해당 집단의 ‘대다수/대부분’을 뜻합니다.
