revisions:
- from: 이것은 곧, 적게 뿌리는 자는 적게 거두고, 복 가운데 뿌리는 자는 복 가운데 거둘 것이라는 것입니다.
  to: '이 말씀은 이렇습니다: 적게 뿌리는 사람은 적게 거두고, 풍성히 뿌리는 사람은 풍성히 거둘 것입니다[a].'
  rationale: 그리스어의 두 절 병행(적게/적게, εὐλογίαις/εὐλογίαις)과 미래 수확의 대응을 자연스러운 한국어로 재현했습니다. εὐλογίαις의 문맥상 관용 의미는 본문에서 「풍성히」로 번역하되, ‘복’이라는 명사의 어휘적 배경과 가능한 문자적 대안은 각주에 보존했습니다. 이는 영어 감사 기록의 ‘with blessings’ 선택을 기계적으로 따르기보다 한국어에서의 원문의 의미와 자연스러움을 우선한 것입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:24:23Z'
