  naturalness: 「이것은 곧, …것이라는 것입니다」는 한국어 문장으로 중복적이고 어색합니다. 「이 말씀은 이렇습니다:」와 「사람은 … 것입니다」의 병행이 현대 표준어 합쇼체에 자연스럽습니다.
