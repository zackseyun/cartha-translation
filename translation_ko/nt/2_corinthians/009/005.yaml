revisions:
- from: 그러므로 내가 형제들에게 권면하여 먼저 여러분에게 가서, 여러분이 전에 약속한 복[a]을 미리 준비해 두는 것이 필요하다고 여겼습니다. 이는 그 복이 인색함이 아니라 복답게 준비되어 있게 하려는 것입니다.
  to: 그러므로 나는 형제들에게 여러분에게 먼저 가서 여러분이 전에 약속한 복[a]을 미리 준비해 두라고 권면할 필요가 있다고 여겼습니다. 그것이 이와 같이 복으로 준비되어, 탐욕으로 준비된 것이 아니게 하려는 것입니다.
  rationale: 'The revision restores the Greek clause structure: Paul considered it necessary to urge the brothers, so that they would go ahead and prepare the previously promised contribution. It preserves εὐλογία twice as 「복」, revises πλεονεξία to the source-nearer 「탐욕」, and places context-dependent alternatives in the footnote rather than in the main text.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:24:23Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies εὐλογία as the promised contribution and retains its repetition as 「복」. However, it restructures the purpose clause so that Paul seems to deem the brothers' going and preparing necessary, rather than deeming it necessary to urge them to go ahead and prepare. Its rendering of πλεονεξία as 「인색함」 is contextually possible but does not preserve the source word's primary sense of greed/covetousness or the English audit trail's chosen sense.
  naturalness: The current Korean is generally comprehensible, but 「그 복이 인색함이 아니라 복답게 준비되어 있게」 is unnatural and makes the contrast difficult to follow. A direct purpose construction and a more explicit antecedent for 「그것」 read naturally in modern formal-polite Korean.
  terminology: 「복」 appropriately preserves the deliberate repetition of εὐλογία; a note can identify the referent as the promised contribution. 「탐욕」 is the source-nearer rendering of πλεονεξία. The context-specific nuance of a grudgingly exacted contribution may be noted without replacing the main-text term.
  issues:
  - severity: high
    issue: The syntax of ἀναγκαῖον ... ἡγησάμην παρακαλέσαι is not represented accurately.
    rationale: Paul says that he considered it necessary to urge the brothers; the urging has the purpose that they go ahead and prepare the contribution. The draft instead makes the brothers' going and preparation itself the object judged necessary.
  - severity: medium
    issue: 「인색함」 for πλεονεξία weakens and shifts the lexical sense.
    rationale: πλεονεξία ordinarily denotes greed/covetousness. Although the collection context has led some to render the contrast as a grudging exaction, 「탐욕」 better retains the Greek's lexical value; the contextual alternative belongs in a note.
  - severity: medium
    issue: The final clause is awkward and obscures the intended contrast.
    rationale: 「복답게 준비되어 있게」 is not an idiomatic way to render οὕτως ὡς εὐλογίαν. The text should state that the promised contribution is to stand ready as a blessing, not as greed.
  revised_text: 그러므로 나는 형제들에게 여러분에게 먼저 가서 여러분이 전에 약속한 복[a]을 미리 준비해 두라고 권면할 필요가 있다고 여겼습니다. 그것이 이와 같이 복으로 준비되어, 탐욕으로 준비된 것이 아니게 하려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 여기서 「복」은 고린도 교회가 약속한 헌금을 가리킵니다. 「너그러운 선물」 또는 「풍성한 헌금」으로도 옮길 수 있습니다. 마지막의 「탐욕」은 문맥상 「마지못해 뜯어낸 것」이라는 뜻으로 이해되기도 합니다.
    reason: lexical_alternative
  revision_rationale: 'The revision restores the Greek clause structure: Paul considered it necessary to urge the brothers, so that they would go ahead and prepare the previously promised contribution. It preserves εὐλογία twice as 「복」, revises πλεονεξία to the source-nearer 「탐욕」, and places context-dependent alternatives in the footnote rather than in the main text.'
