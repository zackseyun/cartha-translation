source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers to go on ahead to you and prepare in advance your previously promised blessing[c][b][a], so that it might be ready in this way as a blessing and not as greed.
translation:
  language: ko
  text: 그러므로 나는 형제들에게 여러분에게 먼저 가서 여러분이 전에 약속한 복[a]을 미리 준비해 두라고 권면할 필요가 있다고 여겼습니다. 그것이 이와 같이 복으로 준비되어, 탐욕으로 준비된 것이 아니게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 「복」은 고린도 교회가 약속한 헌금을 가리킵니다. 「너그러운 선물」 또는 「풍성한 헌금」으로도 옮길 수 있습니다. 마지막의 「탐욕」은 문맥상 「마지못해 뜯어낸 것」이라는 뜻으로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογία
  english_pob_choice: blessing
  chosen_korean: 복
  lexicon: BDAG
  rationale: 여기서 εὐλογία는 헌금을 「복」으로 표현하는 바울의 어휘. 단순한 인사어가 아니므로 「복」으로 옮긴다.
  alternatives_korean:
  - 축복
- source_word: προεπηγγελμένην
  english_pob_choice: previously promised
  chosen_korean: 전에 약속한
  lexicon: BDAG
  rationale: 완료 수동분사. 「약속된 분량」.
- source_word: πλεονεξία
  english_pob_choice: greed
  chosen_korean: 인색함
  lexicon: BDAG
  rationale: 여기서 πλεονεξία는 본래 「탐욕」이지만 문맥상 「아쉬워 짜내는 인색함」을 가리킨다. 영어 POB의 「greed」와 같은 대비를 한국어에서는 「인색함」으로 옮긴다.
  alternatives_korean:
  - 탐욕
  - 아쉬워하며 내놓는 것
