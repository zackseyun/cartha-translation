review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘많은 사람의 감사가 하나님께 흘러넘치게 합니다’는 ‘많은 사람’을 본문에 명시적으로 더하고, λειτουργία/διακονία 자체가 감사를 산출한다는 인과 표현을 강화합니다. 헬라어는 이 봉사의 직무가 성도들의 결핍을 채우며 하나님께 드리는 많은 감사로/통하여 넘쳐 난다고 말합니다.
  naturalness: ‘성도들의 부족을 채워 줄’은 미래·의지의 뉘앙스를 띠어 현재의 서술적 분사와 다소 어긋납니다. ‘성도들에게 부족한 것을 채울’이 자연스럽고 의미도 분명합니다. ‘이 봉사의 직무’는 두 관련 명사를 불필요하게 같은 말로 만들지 않으면서 현대 표준어에서 자연스럽습니다.
  terminology: διακονία와 λειτουργία의 결합은 ‘봉사의 직무’로 옮겨 관련되지만 구별되는 두 명사를 보존했습니다. ἅγιοι는 바울의 교회론적 용례를 반영하여 ‘성도들’로 유지했습니다. ‘감사’는 εὐχαριστίαι를, ‘하나님께 드리는’은 τῷ θεῷ를 충실히 반영합니다.
  issues:
  - severity: medium
    issue: ‘많은 사람의 감사가 하나님께 흘러넘치게 합니다’
    rationale: πολλῶν εὐχαριστιῶν은 ‘많은 사람의 감사’라고 사람을 특정하지 않으며, περισσεύουσα의 주어는 봉사의 직무입니다. ‘~하게 합니다’는 본문의 ‘넘쳐 난다’보다 인과관계를 더 강하게 만듭니다.
  - severity: low
    issue: ‘성도들의 부족을 채워 줄’
    rationale: προσαναπληροῦσα는 현재 분사로, 미래·의지처럼 들릴 수 있는 ‘채워 줄’보다 서술적인 ‘채울’이 적절합니다.
  revised_text: 이 봉사의 직무는 성도들에게 부족한 것을 채울 뿐만 아니라, 하나님께 드리는 많은 감사로 넘쳐납니다—
