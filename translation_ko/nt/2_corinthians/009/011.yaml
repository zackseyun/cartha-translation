    text: 그리스어 ἁπλότης는 ‘관대함’, ‘너그러움’을 뜻할 수 있습니다. 다른 문맥에서는 ‘단순함’이나 ‘진실함’을 뜻하기도 하지만, 여기서는 헌금과 나눔의 문맥상 관대함을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: 목적/결과를 나타내는 εἰς를 ‘베풀 수 있게’로 명확히 하고, 헌금 문맥의 ἁπλότης를 자연스러운 현대 한국어인 ‘관대함’으로 통일했습니다. 원문의 매개 표현 δι’ ἡμῶν과 하나님께 드려지는 감사도 유지했습니다.
