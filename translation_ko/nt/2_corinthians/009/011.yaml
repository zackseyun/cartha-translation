  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 εἰς πᾶσαν ἁπλότητα는 부요하게 되는 목적/결과가 ‘온갖 관대함을 베풀 수 있게 됨’임을 나타내므로, ‘온갖 후한 베풂에 이르게 되며’보다 이를 분명히 드러내는 표현이 적절합니다. πλουτιζόμενοι의 수동 의미도 ‘부요하게 되어’로 자연스럽게 유지됩니다. δι’ ἡμῶν은 바울 일행을 통한 매개를 뜻하므로 ‘우리를 통하여’로 보존했습니다.
  naturalness: ‘후한 베풂에 이르다’는 현대 표준 한국어에서 다소 어색하고, ‘후한 베풂’은 명사구로서 반복될 때 매끄럽지 않습니다. ‘관대함을 베풀 수 있게’와 ‘이 관대함은’이 합쇼체 문맥에서 더 자연스럽고 명료합니다.
  terminology: ἁπλότης는 이 헌금·나눔 문맥에서 ‘관대함’으로 옮기는 것이 적절합니다. ‘감사’는 εὐχαριστίαν의 자연스러운 대응어이며, ‘하나님께 감사가 드려지게 합니다’는 하나님을 향한 감사를 명시합니다.
  issues:
  - severity: medium
    issue: ‘온갖 후한 베풂에 이르게 되며’가 εἰς πᾶσαν ἁπλότητα의 목적/가능 의미를 충분히 자연스럽게 드러내지 못함
    rationale: 원문은 부요하게 됨이 관대하게 베풀도록 하는 방향임을 나타냅니다. 한국어에서는 ‘관대함을 베풀 수 있게 되고’가 이 관계를 더 정확하고 자연스럽게 표현합니다.
  - severity: low
    issue: ‘후한 베풂’의 반복이 다소 부자연스러움
    rationale: 문맥상 ἁπλότης는 성품 일반보다 구체적인 너그러움/관대함을 가리키므로 ‘관대함’이 간결하고 자연스럽습니다.
  revised_text: 여러분은 모든 면에서 부요하게 되어 온갖 관대함을 베풀 수 있게 되고, 이 관대함은 우리를 통하여 하나님께 감사가 드려지게 합니다—
  revised_footnotes:
