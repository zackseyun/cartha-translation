  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: ko
  text: 혹시 마케도니아 사람들이 나와 함께 와서 여러분이 준비되어 있지 않은 것을 보게 되면, 우리가—여러분은 말할 것도 없이—이러한 확신을 품고[a] 수치를 당할까 염려합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이러한 확신의 일에서.’ 여기서 ‘확신’으로 옮긴 말은 문맥에 따라 ‘일’ 또는 ‘상황’을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρασκευάστους
  english_pob_choice: unprepared
  chosen_korean: 준비되지 않은
  lexicon: BDAG
  rationale: 앞 절 παρεσκευασμένοι와 부정 대비.
- source_word: καταισχυνθῶμεν
  english_pob_choice: put to shame
  chosen_korean: 부끄러움을 당하게
  lexicon: BDAG
  rationale: 수동태 「수치를 당하다」. 「부끄러움」이 자연스럽다.
  alternatives_korean:
  - 수치를 당하게
- source_word: ὑπόστασις
  english_pob_choice: confidence
  chosen_korean: 확신
  lexicon: BDAG
  rationale: 여기서는 자신감/근거의 의미. 「확신」이 11:17의 같은 어휘와 호응한다.
  alternatives_korean:
  - 근거
  - 기반
