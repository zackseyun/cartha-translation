    rationale: ‘이 확신의 일에서’는 한국어로 다소 경직되고 의미 범위가 불분명합니다. ‘이러한 확신을 품고’는 ‘in this confidence’를 자연스럽게 재현하며, 대안적 문맥 의미는 각주로 보존할 수 있습니다.
