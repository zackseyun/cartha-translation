  source_fidelity: 헬라어의 조건적 우려(μή πως ἐὰν), 마케도니아 사람들이 바울과 함께 오는 상황, 준비되지 않은 상태, 수동적 수치, 그리고 ‘우리—여러분은 말할 것도 없이—’라는 삽입을 대체로 잘 반영했습니다. 다만 ‘확신의 일에서’는 ἐν τῇ ὑποστάσει ταύτῃ의 문맥상 의미를 다소 부자연스럽게 명사화하므로, ‘이러한 확신을 품고’가 더 직접적이고 자연스럽습니다.
  naturalness: ‘마게도냐’는 현대 표준 표기인 ‘마케도니아’로 고쳐야 합니다. 또한 ‘우리—여러분이라고 말하지 않더라도—가’는 조사의 위치와 삽입 표현이 어색합니다. ‘우리가—여러분은 말할 것도 없이—’가 현대 한국어 합쇼체 성경 문체에 자연스럽습니다.
  terminology: καταισχυνθῶμεν은 사회적 수치를 당한다는 수동적 의미이므로 ‘수치를 당하다’가 정확합니다. ὑπόστασις는 여기서 후대의 기술적 의미가 아니라 바울의 확신/자신감을 가리키므로 ‘확신’을 유지하되, 문맥상 가능한 ‘일/상황’의 뉘앙스는 각주로 밝혔습니다.
