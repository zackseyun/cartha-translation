  source_fidelity: 인용 도입구 καθὼς γέγραπται는 ‘기록된 바와 같이’가 더 직접적입니다. Ἐσκόρπισεν의 널리 흩어 나누는 이미지는 ‘흩어’로 유지할 수 있으며, τοῖς πένησιν, ἔδωκεν, μένει εἰς τὸν αἰῶνα도 충실히 반영됩니다.
  naturalness: ‘기록된 바와 같습니다’도 이해되지만, 성경 인용을 여는 현대 한국어 문장으로는 ‘기록된 바와 같이’가 더 자연스럽고 원문의 접속 표현에 맞습니다. ‘가난한 이들’은 존중을 갖춘 현대 표준어입니다.
  terminology: δικαιοσύνη는 바울 서신에서 ‘의’로 옮기는 것이 적절합니다. 다만 원어가 ‘정의’의 의미도 가질 수 있으므로 해당 단어에 각주를 붙여 대안을 보존해야 합니다.
  issues:
  - severity: low
    issue: 인용 도입구의 접속 표현
    rationale: ‘기록된 바와 같습니다’보다 ‘기록된 바와 같이’가 καθὼς(‘~와 같이’)를 정확히 반영하고, 이어지는 인용문을 자연스럽게 도입합니다.
  - severity: medium
    issue: 영어 감사 기록의 δικαιοσύνη 대안이 한국어 본문에 연결된 각주로 보존되지 않음
    rationale: 영어 POB는 ‘justice’를 각주 대안으로 보존합니다. 한국어에서도 ‘의’ 뒤에 각주를 두어 ‘정의’라는 가능한 의미를 밝혀야 합니다. 기존 영어 각주의 표지는 scattered abroad 뒤에 있으나 내용상 δικαιοσύνη에 해당하므로, 한국어에서는 의미상 올바른 위치에 둡니다.
  revised_text: 기록된 바와 같이, “그가 흩어 가난한 이들에게 주었으니, 그의 의[a]가 영원히 머무릅니다.”
