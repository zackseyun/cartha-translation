review_pass:
  verdict: revise
  source_fidelity: 첫 절의 「약함 가운데서」는 ἐξ ἀσθενείας의 원인·근거 뉘앙스를 공간적 ‘가운데서’로 약화합니다. 또한 「여러분을 위하여」는 εἰς ὑμᾶς의 방향·관계성을 수혜의 의미로 한정합니다. 이를 각각 「약하심으로」와 「여러분을 향하여」로 고쳐 그리스어의 압축성과 대조를 보존합니다.
  naturalness: 「약하심으로 십자가에 못 박히셨으나」, 「그분 안에서 약합니다」, 「여러분을 향하여 … 살 것입니다」는 현대 표준어 합쇼체에서 자연스럽고 문맥상 분명합니다.
  terminology: 「십자가에 못 박히셨다」, 「하나님의 능력」, 「그분 안에서」, 「그분과 함께」는 정착된 성서 용어를 유지합니다. 「약하심」은 그리스도를 가리키는 문맥에 맞는 존대 명사형이며, 그 약함의 성격을 교리적으로 해설하지 않습니다.
  issues:
  - severity: medium
    issue: ἐξ ἀσθενείας를 「약함 가운데서」로 번역함
    rationale: ἐξ는 여기서 약함을 십자가 처형의 원인·근거 또는 조건으로 제시합니다. 「가운데서」는 ἐν에 가까운 공간·영역 표현이므로 「약하심으로」가 더 충실합니다.
  - severity: medium
    issue: εἰς ὑμᾶς를 「여러분을 위하여」로 번역함
    rationale: 「위하여」는 수혜 의미를 확정하지만, εἰς는 바울의 생명/능력이 고린도 교인들을 향해 또는 그들과의 관계에서 나타남을 가리킵니다. 「여러분을 향하여」가 더 넓은 의미를 보존합니다.
  revised_text: 그분은 약하심으로 십자가에 못 박히셨으나 하나님의 능력으로 살아 계십니다. 우리도 그분 안에서 약하지만, 하나님의 능력으로 여러분을 향하여 그분과 함께 살 것입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘약함으로’입니다. 그리스어 ἐξ는 약함을 십자가 처형의 원인·근거나 조건으로 제시합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘하나님의 능력에서’입니다. 그리스어 ἐκ는 앞선 ‘약함으로’와 대조되도록 하나님의 능력을 생명의 근원으로 제시합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그분과 함께 살 것입니다’는 고린도 교인들과의 관계에서 나타날 바울의 그리스도-능력의 삶을 가리킬 수 있으며, 더 넓은 부활 생명의 주제도 울릴 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘여러분에게’, ‘여러분 가운데서’로 옮길 수 있습니다. 그리스어 εἰς ὑμᾶς는 방향, 관계, 또는 효력을 압축하여 나타냅니다.
    reason: lexical_alternative
  revision_rationale: 원문의 반복되는 ἐξ/ἐκ 대조와 εἰς의 방향성을 한국어에서 가능한 한 보존하되, 미래의 ‘삶’이 현세 사역만인지 종말론적 부활 생명만인지는 확정하지 않았습니다.
