- from: 우리는 여러분이 어떤 악도 행하지 않기를 하나님께 기도합니다. 이는 우리가 인정받은 자로 보이려는 것이 아니라, 여러분이 선한 일을 행하게 하려는 것입니다. 우리는 검증을 통과하지 못한 자처럼 보여도 좋습니다.
  to: 우리는 여러분이 아무 악도 행하지 않기를 하나님께 기도합니다. 이는 우리가 인정받은 사람들로 드러나기 위해서가 아니라, 여러분이 선을 행하도록 하기 위해서입니다. 우리가 인정받지 못한 사람들처럼 되더라도 말입니다.
