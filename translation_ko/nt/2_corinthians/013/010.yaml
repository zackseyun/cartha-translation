revisions:
- from: 내가 떠나 있으면서 이것들을 쓰는 것은, 함께 있을 때에 주께서 세우려고 주신, 무너뜨리려고 주신 것이 아닌 그 권위를 따라 엄하게 다루지 않으려는 것입니다.
  to: 그러므로 내가 떠나 있을 때에 이것들을 쓰는 것은, 내가 곁에 있을 때 주께서 나에게 주신 권위에 따라 엄하게 대하지 않기 위해서입니다. 그 권위는 세우기 위한 것이지 무너뜨리기 위한 것이 아닙니다.
  rationale: 'The revision restores the Greek structure and meaning: Paul writes while absent so that he will not need to act sharply when present, in accordance with authority given by the Lord. It makes explicit that this authority is for building up rather than tearing down, without adding a doctrinally specific referent for ''the Lord'' or an unstated object for the sharp treatment.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:24:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft reverses and obscures the Greek syntax in the final authority clause: it repeats ''주신'' as though both building up and tearing down were purposes for which the authority was given. The source states that the authority was given for building up, not for tearing down. It also needs the explicit purpose relationship introduced by ἵνα more clearly represented.'
  naturalness: The draft is syntactically cumbersome and difficult to parse, especially '주께서 세우려고 주신, 무너뜨리려고 주신 것이 아닌 그 권위.' The revision uses natural modern formal-polite Korean while retaining the contrast between absence and presence.
  terminology: '''주'' appropriately renders ὁ κύριος without specifying the referent. ''권위,'' ''세우기,'' and ''무너뜨리기'' preserve the source''s authority language and construction metaphor. ''엄하게 대하다'' naturally conveys ἀποτόμως χρήσωμαι in context.'
  issues:
  - severity: high
    issue: The final phrase wrongly implies that the authority was given both to build up and, negatively, to tear down.
    rationale: 'εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν modifies the purpose of the authority: it is for building up and not for tearing down.'
  - severity: medium
    issue: The purpose clause and absent/present contrast are not clearly represented.
    rationale: 'ἵνα expresses Paul''s purpose in writing while absent: that when present he may not have to deal sharply.'
  - severity: medium
    issue: The phrase '함께 있을 때' lacks a clear subject and the overall sentence is unnaturally ordered.
    rationale: Explicitly retaining Paul's presence as '내가 곁에 있을 때' yields a clear, idiomatic Korean contrast with '떠나 있을 때.'
  revised_text: 그러므로 내가 떠나 있을 때에 이것들을 쓰는 것은, 내가 곁에 있을 때 주께서 나에게 주신 권위에 따라 엄하게 대하지 않기 위해서입니다. 그 권위는 세우기 위한 것이지 무너뜨리기 위한 것이 아닙니다.
  revised_footnotes: []
  revision_rationale: 'The revision restores the Greek structure and meaning: Paul writes while absent so that he will not need to act sharply when present, in accordance with authority given by the Lord. It makes explicit that this authority is for building up rather than tearing down, without adding a doctrinally specific referent for ''the Lord'' or an unstated object for the sharp treatment.'
