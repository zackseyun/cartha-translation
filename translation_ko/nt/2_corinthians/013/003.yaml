  source_fidelity: 현 초안은 δοκιμήν(‘증거’)과 ‘내 안에서 메시아께서 말씀하시는’이라는 표현을 적절히 반영합니다. 그러나 ἐπεὶ의 인과적 연결(‘~하므로/왜냐하면’)이 빠져 있고, ἐν ὑμῖν을 ‘여러분 가운데서’로 옮긴 경우 가능한 직역적 대안인 ‘여러분 안에서’를 주석으로 보존하는 것이 좋습니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 바울의 논증적 문맥을 명료하게 드러냅니다. ‘증거를 요구하고 있으므로’는 원문의 지속적 요구와 인과관계를 자연스럽게 표현합니다.
  terminology: Χριστός는 칭호로서 ‘메시아’로 유지했습니다. δυνατεῖ는 ‘능력을 나타내십니다’로 번역하여 ‘약하지 않으시고’와의 대조를 살렸습니다. εἰς ὑμᾶς는 ‘여러분을 향하여’로 번역해 관계적 방향성을 보존했습니다.
  issues:
