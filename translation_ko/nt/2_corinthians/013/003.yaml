  source_fidelity: 'The causal conjunction ἐπεὶ (“since/because”) is omitted in the draft. The remaining major elements are represented well: δοκιμήν is appropriately rendered “증거,” Christ’s speaking ἐν ἐμοί is retained as “내 안에서,” and the contrast of weakness and power is preserved. “여러분 가운데서” is a defensible contextual rendering of ἐν ὑμῖν for plural addressees.'
