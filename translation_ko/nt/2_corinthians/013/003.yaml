    issue: ἐπεὶ의 인과적 의미가 누락됨
    rationale: ‘여러분은 … 구하고 있습니다’만으로는 ‘왜냐하면/…하므로’라는 원문의 논리적 연결이 드러나지 않습니다.
  - severity: low
    issue: ἐν ὑμῖν의 대안적 의미에 대한 주석 부재
    rationale: 본문의 ‘여러분 가운데서’는 복수 공동체를 고려한 자연스러운 번역이지만, ‘여러분 안에서’도 가능한 의미이므로 각주로 보존하는 것이 적절합니다.
  revised_text: 여러분이 내 안에서 메시아께서 말씀하신다는 증거를 요구하고 있으므로, 그분은 여러분을 향하여 약하지 않으시고, 도리어 여러분 가운데서 능력을 나타내십니다.[a]
