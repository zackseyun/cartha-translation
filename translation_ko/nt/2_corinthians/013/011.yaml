  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: ko
  text: 마지막으로[a] 형제 여러분[b], 기뻐하십시오. 온전하게 되십시오[c]. 격려를 받으십시오[d]. 같은 마음을 품으십시오[e]. 평화롭게 지내십시오. 그리고 사랑과 평화의 하나님께서 여러분과 함께 계실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘작별 인사를 하십시오’. χαίρετε는 마치는 인사로도 쓰일 수 있으나, 여기서는 뒤따르는 권면들과 나란히 ‘기뻐하십시오’라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제 여러분’은 회중을 향한 집합적 호칭이며, 남성과 여성을 모두 포함할 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘회복되십시오’, ‘바로잡히십시오’, ‘준비를 갖추십시오’.
    reason: lexical_alternative
  - marker: d
