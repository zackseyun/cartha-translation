    issue: ‘온전케 되십시오’의 문체
    rationale: ‘-케’는 현대 표준어 합쇼체 번역에서는 고풍스럽습니다. ‘온전하게 되십시오’가 같은 의미를 자연스럽게 전달합니다.
  - severity: medium
    issue: ‘화평하십시오’의 자연스러움
    rationale: εἰρηνεύετε는 공동체 안에서 평화롭게 살아가라는 현재 명령입니다. ‘평화롭게 지내십시오’가 현대 한국어에서 더 명료하고 자연스럽습니다.
  - severity: low
    issue: ‘그러면’이 첨가하는 인과성
    rationale: 원문은 καί로 하나님의 함께하심을 앞선 권면에 연결할 뿐, 명시적으로 ‘그러면’이라는 조건·결과 구문을 만들지는 않습니다. ‘그리고’가 더 가깝습니다.
