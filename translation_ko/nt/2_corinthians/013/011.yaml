  source_fidelity: 대체로 원문의 명령 연쇄와 미래 약속을 충실히 반영합니다. 다만 ‘그러면’은 헬라어의 단순 접속사 καί보다 인과관계를 더 분명히 하므로 제거하는 것이 좋습니다. καταρτίζεσθε는 ‘온전하게 되십시오’로 옮겨 원문의 회복·정비·온전함의 폭을 유지할 수 있습니다.
  naturalness: ‘온전케’는 현대 표준어 문체에서는 다소 고풍스럽고, ‘화평하십시오’는 현대 한국어에서 어색하거나 의미가 불명료합니다. ‘온전하게 되십시오’, ‘평화롭게 지내십시오’, ‘같은 마음을 품으십시오’가 합쇼체의 자연스러움과 원문의 권면 형식을 함께 살립니다.
  terminology: ‘사랑과 평화의 하나님’은 ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης에 적절합니다. ἀδελφοί는 본문에서 ‘형제 여러분’으로 유지하되, 회중 전체를 향한 호칭일 가능성을 각주로 밝혀 성별 형태와 실제 호칭 범위를 모두 보존합니다.
