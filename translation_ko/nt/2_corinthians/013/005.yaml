- source_word: Ἰησοῦς Χριστός
  english_pob_choice: Jesus the Messiah
  chosen_korean: 메시아 예수
  lexicon: BDAG
  rationale: 칭호 보존. 한국어 어순상 「메시아 예수」.
  alternatives_korean:
