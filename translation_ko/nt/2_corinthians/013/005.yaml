- source_word: ἀδόκιμοι
  english_pob_choice: disqualified
  chosen_korean: 검증을 통과하지 못한 자들
  lexicon: BDAG
  rationale: 13:6-7과 호응. 「검증을 통과하지 못한」으로 동족 어휘를 살린다.
