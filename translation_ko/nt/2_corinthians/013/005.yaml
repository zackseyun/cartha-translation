  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: ko
  text: 여러분이 믿음 안에 있는지[a] 스스로 시험해 보십시오. 여러분 자신을 검증해 보십시오. 메시아이신 예수께서[b] 여러분 안에[c] 계신다는 것을 여러분 자신이 알지 못합니까?—혹시 여러분이 검증을 통과하지 못한 사람들이라면 모를까.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿음 안에’는 그리스도교 신앙 안에 머무는 것을 뜻할 수도 있고, 참된 믿음을 지니는 것을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예수 그리스도’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘여러분 가운데’.
    reason: alternative_reading
