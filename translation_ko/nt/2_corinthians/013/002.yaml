  to: 내가 두 번째로 여러분과 함께 있었을 때에도 이미 말했고, 지금 떠나 있는 동안에도 전에 죄를 지은 사람들과 그 밖의 모든 사람에게 미리 말합니다. 내가 다시[a] 가면, 결코 봐주지 않겠습니다.
