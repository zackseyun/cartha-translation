  verdict: revise
  source_fidelity: 현 번역은 προείρηκα(‘이미/전에 말했습니다’)를 누락하고, 이를 ‘다시 말합니다’로 대체하여 완료형과 προλέγω의 구별을 흐립니다. 또한 οὐ φείσομαι는 여기서 단순히 ‘용서하지 않겠다’보다 징계에서 ‘봐주지 않겠다/관용을 베풀지 않겠다’라는 뜻에 가깝습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 압축된 대조(두 번째로 함께 있었을 때/지금 떠나 있음)를 분명히 드러냅니다.
  terminology: ‘전에 죄를 지은 사람들’은 προημαρτηκόσιν의 선행성을 보존합니다. ‘결코 봐주지 않겠습니다’는 φείδομαι의 엄중한 경고와 문맥상 징계의 뉘앙스를 보존하면서 ‘용서’라는 별도 개념을 피합니다.
