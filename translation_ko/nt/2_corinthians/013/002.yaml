base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: ko
  text: 내가 두 번째로 여러분과 함께 있었을 때에도 이미 말했고, 지금 떠나 있는 동안에도 전에 죄를 지은 사람들과 그 밖의 모든 사람에게 미리 말합니다. 내가 다시[a] 가면, 결코 봐주지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다시 가면’입니다. 문맥상 바울의 세 번째 방문을 가리킬 수 있지만, 그 횟수는 본문이 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα / προλέγω
  english_pob_choice: said before / say beforehand
  chosen_korean: 말합니다 ... 미리 말합니다
  lexicon: BDAG
  rationale: 동족 반복. 한국어에서도 「말합니다 ... 미리 말합니다」로 강조 보존.
- source_word: προημαρτηκόσιν
  english_pob_choice: sinned previously
  chosen_korean: 전에 죄를 지은 자들
  lexicon: BDAG
  rationale: 12:21과 호응.
- source_word: φείσομαι
  english_pob_choice: spare
  chosen_korean: 용서치 않겠습니다
  lexicon: BDAG
  rationale: 동사 φείδομαι. 한국어에서 「용서치 않다」가 강한 어조를 담는다.
  alternatives_korean:
  - 가만두지 않겠습니다
