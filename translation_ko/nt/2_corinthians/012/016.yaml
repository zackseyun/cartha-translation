review_pass:
  verdict: revise
  source_fidelity: 현 초안은 κατεβάρησα를 ‘짐을 지우지 않았다’로 적절히 옮겼습니다. 그러나 ἔστω δέ의 양보적·가정적 수사 기능이 ‘그러나 말입니다’에 반영되지 않았고, 원문에 없는 인용부호와 의문문 ‘고 합니까?’가 추가되어 진술문의 형태와 바울의 아이러니를 과도하게 해석합니다. ἔλαβον은 이 문맥에서 책략으로 ‘붙잡다/손에 넣다’라는 비난의 어감을 낼 수 있으므로 ‘붙잡았습니다’로 옮겼습니다.
  naturalness: ‘그렇다 하더라도’는 현대 표준 한국어에서 자연스러우며, 양보적 전환을 드러냅니다. ‘교활하여, 속임수로 여러분을 붙잡았습니다’는 합쇼체 문체를 유지하면서도 원문의 비난조 진술을 보존합니다.
  terminology: ‘짐을 지우다’, ‘교활하다’, ‘속임수’는 각각 문맥상 적절합니다. 원문의 아이러니 여부는 본문에서 단정하지 않고 주석으로 밝혔습니다.
  issues:
