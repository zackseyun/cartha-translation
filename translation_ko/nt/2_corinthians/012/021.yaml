  rationale: The revision removes colloquial overtones, strengthens the rendering of πενθήσω to match its mourning sense, and uses formal, clear Korean while preserving the Greek syntax and the distinct vice terms. No footnotes are necessary because the Korean renderings do not require an essential unresolved alternative.
