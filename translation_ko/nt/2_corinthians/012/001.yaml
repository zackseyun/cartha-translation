  source_fidelity: ‘자랑해야만 합니다’ adds the exclusive force of ‘only’ (만), which δεῖ does not express. ‘넘어가겠습니다’ is understandable but is less natural here than a discourse-transition expression such as ‘나아가겠습니다.’ The genitive κυρίου should remain noncommittal as ‘주의,’ rather than be explained in the lexical rationale as necessarily source-related.
  naturalness: ‘자랑할 필요가 있습니다. 유익하지는 않지만, 나는 … 나아가겠습니다’ is natural modern formal Korean and represents the contrast without an awkward duplicated concessive/adversative construction.
  terminology: ‘환상들,’ ‘계시들,’ and ‘주’ are appropriate established terms. A note on ‘주의’ preserves the Greek genitive’s possible source relationship without imposing it in the text.
  issues:
  - severity: medium
    issue: ‘자랑해야만 합니다’ overtranslates δεῖ.
    rationale: The particle 만 introduces exclusivity/emphasis (‘must specifically/only’), whereas δεῖ indicates necessity only.
  - severity: low
    issue: ‘넘어가겠습니다’ is a less idiomatic rendering of ἐλεύσομαι εἰς in this discourse context.
    rationale: Paul is proceeding to a new topic; ‘…로 나아가겠습니다’ is more natural Korean while retaining the transition.
  - severity: medium
    issue: The rationale for ‘주의’ resolves κυρίου as source-related despite the translation’s ambiguous wording.
    rationale: The Greek genitive can indicate source but does not require that interpretation; the Korean text and supporting note should retain the ambiguity.
