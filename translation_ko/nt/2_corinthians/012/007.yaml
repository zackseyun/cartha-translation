revisions:
- from: 그 계시들이 너무나 컸기에—내가 너무 높아지지 않게 하려고—나에게 육체에 가시[a]가 주어졌습니다. 곧 사탄의 사자입니다. 그것이 나를 치게 하여, 내가 너무 높아지지 않게 하시려는 것입니다.
  to: 그 계시들이 지극히 크기 때문에—내가 지나치게 높아지지 않도록—내 육체에 가시[a], 곧 사탄의 사자[b]가 내게 주어졌습니다. 이는 그가 나를 주먹으로 치고[c], 내가 지나치게 높아지지 않도록 하기 위해서였습니다.
  rationale: 원문의 동격 구조와 두 차례 반복되는 목적절을 유지하되, 수동태가 남기는 행위자 문제를 해소하려 하지 않았습니다. ‘가시’의 정체와 ‘사탄의 사자’의 존재론적 성격은 본문이나 각주에서 특정하지 않았고, 필요한 어휘 대안만 각주로 제시했습니다.
