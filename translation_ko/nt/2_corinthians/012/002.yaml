source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: ko
  text: 나는 메시아 안에 있는 한 사람을 압니다[a]. 그는 십사 년 전에—그가 몸 안에 있었는지 나는 모릅니다. 몸 밖에 있었는지도 나는 모릅니다[b]. 하나님이 아십니다—그가 셋째 하늘[c]까지 붙들려 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 ‘그리스도 안에’. 그리스어는 ἐν Χριστῷ이며, 여기서는 칭호의 의미를 살려 ‘메시아 안에’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 바울은 이 일이 몸 안에서 일어났는지 몸 밖에서 일어났는지 명시하지 않습니다. 본문은 그 경험의 양식을 미해결 상태로 남겨 둡니다.
    reason: lexical_alternative
  - marker: c
    text: ‘셋째 하늘’은 가장 높은 하늘 또는 낙원을 가리킬 수 있는 고대 유대의 우주론적 표현을 반영합니다. 번역은 이를 해석하지 않고 그대로 보존합니다.
    reason: cultural_note
