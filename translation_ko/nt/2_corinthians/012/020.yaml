  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: ko
  text: 내가 두려워하는 것은, 혹시 내가 가서 여러분을 내가 바라는 모습으로 만나지 못하고, 나도 여러분에게서 여러분이 바라지 않는 모습으로 드러나며, 또 혹시 다툼과 시기와 격분과 이기적 야망과 비방과 수군거림과 교만과 무질서가 있을까 하는 것입니다.
  philosophy: optimal-equivalence
