review_pass:
  verdict: revise
  source_fidelity: 첫 절의 「비용을 쓰고」는 δαπανήσω의 지출/소비 비유를 다소 부자연스럽게 제한하며, 「나 자신마저 다 쓸 것입니다」는 ἐκδαπανηθήσομαι의 수동형과 ‘자신까지 소진됨’이라는 대조를 충분히 드러내지 못합니다. 또한 ἥδιστα는 두 동사에 걸쳐 ‘가장 기쁘게’로 수식하는 것이 적절합니다. 둘째 절은 εἰ의 조건 형식과 περισσοτέρως의 비교 강도를 보존할 필요가 있습니다.
  naturalness: 「나 자신까지도 소진될 것입니다」는 현대 표준 한국어에서 자연스럽고, 앞의 「기꺼이 쓰고」와 짝을 이루어 자원과 자기 자신을 모두 내어 주는 비유를 명료하게 전달합니다. 「더 많이 사랑한다면, 더 적게 사랑받습니까?」는 수사적 질문의 어조와 합쇼체를 자연스럽게 살립니다.
  terminology: ψυχαί는 본문에서 「영혼」으로 유지하되, 문맥상 ‘생명/여러분 자신’의 가능성을 밝히는 각주를 두는 것이 적절합니다. 「위하여」는 ὑπέρ의 수혜 의미를 충실히 옮깁니다.
  issues:
  - severity: medium
    issue: 「비용을 쓰고」 및 「나 자신마저 다 쓸 것입니다」
    rationale: 전자는 한국어 관용상 어색하고 δαπανάω의 포괄적 ‘쓰다/소비하다’를 지나치게 ‘비용’으로 명시합니다. 후자는 자신이 소진되는 수동적·강조적 의미를 불명확하게 합니다.
  - severity: low
    issue: 「더욱 많이 사랑할수록」
    rationale: 원문의 εἰ는 조건절 형식입니다. ‘-ㄹ수록’도 문맥상 가능하지만, 여기서는 「-한다면」이 형식과 수사적 조건을 더 직접적으로 보존합니다.
