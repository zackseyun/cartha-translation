  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: ko
  text: 내가 자랑하고자 한다 해도, 어리석은 사람이 되지는 않을 것입니다. 나는 진실을 말할 것이기 때문입니다. 그러나 나는 그것을 삼갑니다. 아무도 자기가 내게서 보는 것이나 내게서 무엇인가 듣는 것보다 나를 더 높게 여기지 않도록 하려는 것입니다.
  philosophy: optimal-equivalence
