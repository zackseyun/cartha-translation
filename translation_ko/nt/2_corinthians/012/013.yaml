  to: 그렇다면 여러분이 다른 교회들보다 못한 대우를 받은 점이 무엇입니까? 바로 내가 여러분에게 짐이 되지 않았다는 것 외에는 없습니다. 이 잘못을 나에게 용서해 주십시오.
