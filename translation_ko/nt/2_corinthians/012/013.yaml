review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central contrast and the irony of Paul's request for forgiveness. However, the exception clause is more explicitly rendered by stating that no other disadvantage existed, and αὐτὸς ἐγώ warrants a modest emphatic rendering ('바로 내가').
  naturalness: ‘못한 대우를 받은 것이 무엇입니까?’ is understandable, but ‘못한 대우를 받은 점이 무엇입니까?’ is more idiomatic in this comparative rhetorical question. ‘이 부당한 일’ can suggest an objectively unjust act; ‘이 잘못’ better preserves Paul’s ironic designation of his own conduct.
  terminology: ‘짐이 되지 않았다’ is a natural and contextually accurate rendering of κατενάρκησα. ‘용서해 주십시오’ appropriately renders the formal-plural imperative and maintains modern formal-polite register.
  issues:
  - severity: medium
    issue: The exception relation is underrepresented.
    rationale: εἰ μὴ ὅτι means ‘except that’; the revision makes clear that the sole alleged respect in which they were disadvantaged was Paul's not burdening them.
  - severity: low
    issue: The emphatic subject αὐτὸς ἐγώ is not reflected.
    rationale: ‘바로 내가’ preserves the personal emphasis without overtranslating it.
  - severity: low
    issue: ‘이 부당한 일’ is less suited to the ironic force of τὴν ἀδικίαν ταύτην.
    rationale: ‘이 잘못’ naturally identifies the supposed offense while leaving the irony implicit, as in the Greek.
  revised_text: 그렇다면 여러분이 다른 교회들보다 못한 대우를 받은 점이 무엇입니까? 바로 내가 여러분에게 짐이 되지 않았다는 것 외에는 없습니다. 이 잘못을 나에게 용서해 주십시오.
  revised_footnotes: []
  revision_rationale: The revision preserves the rhetorical question, comparative disadvantage, explicit exception, Paul's emphatic personal role, and the understated irony of the final imperative in natural modern formal Korean.
