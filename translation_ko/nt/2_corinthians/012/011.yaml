base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: ko
  text: 내가 어리석은 사람이 되었습니다. 여러분이 나를 그렇게 만들었습니다. 사실 나는 여러분에게서 인정을 받았어야 했습니다. 나는 비록 아무것도 아니지만, 그 지극히 뛰어난 사도들[a]보다 조금도 뒤지지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 뛰어난 사도들’. 그리스어 표현은 매우 강조적이며, 문맥상 풍자적으로 이해될 수도 있습니다.
    reason: alternative_reading
