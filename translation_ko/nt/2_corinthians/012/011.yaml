  source_fidelity: 수정이 필요합니다. 초안은 핵심 비교 표현(οὐδὲν ... ὑστέρησα)과 양보절(εἰ καὶ οὐδέν εἰμι)을 대체로 충실히 옮겼으나, 첫 γάρ의 설명 관계가 본문에서 빠져 있습니다. 또한 「대단한 사도들」은 ὑπερλίαν의 강한 강조를 충분히 반영하지 못하고, 인용부호로 풍자를 본문에서 단정합니다.
  naturalness: ‘어리석은 사람이 되었습니다’, ‘여러분이 나를 인정해 주었어야 했습니다’, ‘조금도 뒤지지 않았습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘사실’은 여기서 앞말을 설명하는 γάρ를 무리 없이 나타냅니다.
  terminology: συνίστασθαι는 이 문맥에서 단순한 개인적 칭찬보다 공동체의 인정·추천을 뜻하므로 ‘인정해 주었어야 했습니다’로 옮겼습니다. ὑπερλίαν ἀπόστολοι는 본문에서 ‘지극히 뛰어난 사도들’로 번역하고, 비풍자적 대안 및 문맥상 가능한 풍자는 각주에서 보존합니다.
  issues:
