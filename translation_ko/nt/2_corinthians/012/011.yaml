  to: 내가 어리석은 사람이 되었습니다. 여러분이 나를 그렇게 만들었습니다. 사실 나는 여러분에게서 인정을 받았어야 했습니다. 나는 비록 아무것도 아니지만, 그 지극히 뛰어난 사도들[a]보다 조금도 뒤지지 않았습니다.
