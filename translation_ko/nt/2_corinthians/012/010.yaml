base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: ko
  text: 그러므로 나는 메시아[a]를 위하여 약함과 모욕과 궁핍과 박해와 곤경을 기쁘게 여깁니다. 이는 내가 약할 때에 바로 그때에 강하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로, “그리스도.”
    reason: alternative_reading
