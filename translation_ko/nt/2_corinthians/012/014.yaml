  source_fidelity: 핵심 의미는 대체로 충실하나, 「그래도」는 원문의 단순 접속사 καί에 없는 양보·대조의 뉘앙스를 더합니다. 또한 마지막 절의 「그렇게 하기」는 θησαυρίζειν(쌓아 두다/저축하다)의 내용을 지나치게 대용 표현으로 처리하여 대조의 선명함을 약화시킵니다.
  naturalness: 합쇼체는 전반적으로 적절합니다. 다만 「이번이 내가 여러분에게 갈 준비를 갖춘 세 번째입니다」보다 「내가 여러분에게 갈 준비가 되어 있는 것은 이번으로 세 번째입니다」가 현대 한국어에서 더 자연스럽습니다. 「여러분을 구하다」는 ‘구원하다’로도 읽힐 수 있으므로 목적어 대조를 살리면서 ‘여러분 자신’을 쓰는 편이 분명합니다.
  terminology: καταναρκάω는 문맥상 물질적으로 부담을 주는 뜻을 포함하므로 「짐이 되다」와 보충 각주가 적절합니다. θησαυρίζειν은 「저축하다」도 가능하나, 원문의 ‘쌓아 두다’라는 저장·축적의 표현을 살려 「재물을 쌓아 두다」로 옮기는 것이 더 충실합니다. τέκνα와 γονεῖς는 각각 「자녀」와 「부모」로 적절합니다.
