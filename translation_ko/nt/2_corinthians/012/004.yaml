  source_fidelity: ‘낙원’은 παράδεισον에 충실합니다. 그러나 ἡρπάγη는 단순히 ‘이끌려’라기보다 갑자기 붙들려/끌려 올라간 수동의 강한 뉘앙스가 있으며, ἄρρητα ῥήματα와 οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι의 두 진술은 각각 보존하는 편이 좋습니다.
