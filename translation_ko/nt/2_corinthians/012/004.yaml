  - severity: medium
    issue: ῥήματα를 ‘말씀들’로 번역함
    rationale: 문맥상 하나님 말씀이라는 특수 용례를 확정하지 않으므로, 일반적인 ‘말들’이 원문의 의미를 불필요하게 신학화하지 않습니다.
