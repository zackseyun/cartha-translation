review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the tent imagery, groaning, burden, and the contrast between being unclothed and clothed over. However, its final clause, “이는 … 하려는 것입니다,” can make the purpose sound like the speakers’ intention; the Greek ἵνα clause states the intended outcome, with ζωή as the agent by whom the mortal is swallowed up.
  naturalness: The wording is generally natural in modern formal Korean. “덧입기를” is understandable, but “덧입는 것을” is smoother and makes the infinitival contrast fully parallel with “벗는 것을.”
  terminology: “장막,” “탄식합니다,” “벗는 것,” “덧입는 것,” “죽을 것,” “생명,” and “삼켜지다” preserve Paul’s connected clothing and consumption metaphors without imposing an interpretation of the intermediate state.
  issues:
  - severity: medium
    issue: The purpose clause is potentially mis-scoped and lacks an explicit agent.
    rationale: “이는 죽을 것이 생명에 의해 삼켜지게 하려는 것입니다” may imply that “we” intend to cause this outcome. The Greek ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς means “so that what is mortal may be swallowed up by life.” Recasting it as an objective purpose clause and using “생명에게” better preserves the passive agency.
  - severity: low
    issue: The paired infinitival expressions are not fully idiomatic/parallel.
    rationale: Replacing “벗기를 … 덧입기를” with “벗는 것을 … 덧입는 것을” is more natural modern Korean while retaining the clothing metaphor and contrast.
  revised_text: 참으로 우리는 이 장막에 있는 동안 무거운 짐에 눌려 탄식합니다. 우리가 원하는 것은 벗는 것이 아니라 덧입는 것이며, 이는 죽을 것이 생명에게 삼켜지게 하기 위함입니다.
