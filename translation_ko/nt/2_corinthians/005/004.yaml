- from: 참으로 우리는 이 장막에 있는 동안 무거운 짐에 눌려 탄식합니다. 그 이유는 우리가 벗기를 원하는 것이 아니라 덧입기를 원하기 때문이며, 이는 죽을 것이 생명에 의해 삼켜지게 하려는 것입니다.
  to: 참으로 우리는 이 장막에 있는 동안 무거운 짐에 눌려 탄식합니다. 우리가 원하는 것은 벗는 것이 아니라 덧입는 것이며, 이는 죽을 것이 생명에게 삼켜지게 하기 위함입니다.
