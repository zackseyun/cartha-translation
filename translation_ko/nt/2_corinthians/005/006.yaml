  source_fidelity: 그리스어의 논리적 연결(οὖν), 지속적 확신(Θαρροῦντες πάντοτε), 확정된 앎(εἰδότες), 그리고 ‘몸 안에 거함’과 ‘주에게서 떠나 있음’의 대조를 충실히 옮겼습니다. ‘동안에는’은 ἐνδημοῦντες의 현재적·상황적 의미를 자연스럽게 나타냅니다.
  naturalness: “그러므로 우리는 항상 담대하며, 몸에 거하는 동안에는 주에게서 떠나 있는 줄을 압니다”는 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다. 합쇼체 종결 ‘압니다’도 적절합니다.
  terminology: ‘담대하며’, ‘몸에 거하다’, ‘주’, ‘떠나 있다’는 문맥 및 한국어 성경 번역 관행에 맞습니다. 특히 ‘주에게서 떠나 있다’는 현재 육체적 삶과 주님께 온전히 함께함 사이의 비유적 긴장을 과도하게 해석하지 않고 보존합니다.
