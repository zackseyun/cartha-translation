    issue: ‘하나님께로부터 났습니다’의 현대성 및 의미 명료성
    rationale: 문법적으로 틀리지는 않지만 현대어에서는 출생의 뉘앙스도 있을 수 있습니다. ‘하나님께로부터 온 것입니다’이 근원·출처를 더 투명하게 나타냅니다.
  - severity: low
