- source_word: διακονίαν τῆς καταλλαγῆς
  english_pob_choice: ministry of reconciliation
  chosen_korean: 화목의 사역
  alternatives_korean:
  - 화목의 직분
  lexicon: BDAG
  rationale: 본 단락의 핵심 어휘.
