  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: Now the one who prepared us for this very thing is God, who gave us the down payment of the Spirit.
  footnotes:
  - marker: a
    text: Or 'guarantee,' 'deposit,' or 'first installment' of the Spirit.
    reason: lexical_alternative
  - marker: b
    text: The phrase may mean that the Spirit himself is the down payment, or that God has given a down payment that guarantees what the Spirit will bring to completion.
    reason: alternative_reading
translation:
  language: ko
  text: 바로 이 일을 위해 우리를 준비하신 분은 하나님이시며, 그분께서는 성령을 보증으로 우리에게 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보증’은 장차 전부가 주어질 것을 보장하는 계약금, 선금, 또는 첫 지급분을 뜻합니다. 직역하면 ‘성령의 보증’이며, 성령 자신이 그 보증이라는 뜻으로도, 성령과 관련된 보증이라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative_and_alternative_reading
