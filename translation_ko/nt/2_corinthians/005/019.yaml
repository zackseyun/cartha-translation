  text: 곧 하나님께서 메시아 안에서[a] 세상을 자신과 화목하게 하고 계셨으며, 그들의 허물을 그들에게 돌리지 않으시고, 우리 안에[b] 화목의 말씀을 두셨다는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께서 메시아 안에서 세상을 자신과 화목하게 하고 계셨다.”
    reason: θεὸς ἦν ἐν Χριστῷ의 어순과 연결 방식은 문장 전체의 내용으로 읽거나 독립된 진술로 읽을 수 있습니다.
  - marker: b
