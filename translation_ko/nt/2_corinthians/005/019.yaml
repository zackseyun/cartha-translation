  source_fidelity: 원문의 ἐν Χριστῷ와 ἐν ἡμῖν을 각각 ‘메시아 안에서’와 ‘우리 안에’로 유지하고, 미완료 시제 ἦν과 현재분사 καταλλάσσων의 진행 중인 배경 행위를 ‘화목하게 하고 계셨으며’로 반영했습니다. παραπτώματα는 법률적 뉘앙스가 강한 ‘범죄’보다 문맥상 ‘허물’이 더 정확합니다.
  naturalness: 기존 문장은 자연스럽지만 ‘우리에게 맡기셨다’는 ἐν ἡμῖν의 직역적 표현과 그에 따른 해석 여지를 없앱니다. 수정문은 표준어 현대 합쇼체를 유지하면서도 한국어 문장으로 무리 없이 읽힙니다.
  terminology: Χριστός는 프로젝트의 제목어 원칙에 따라 ‘메시아’로 유지했습니다. καταλλάσσω/καταλλαγή는 ‘화목하게 하다’와 ‘화목의 말씀’으로 일관되게 옮겼습니다. λόγος는 이 문맥에서 선포·위탁된 내용이므로 ‘말씀’이 적절합니다.
  issues:
