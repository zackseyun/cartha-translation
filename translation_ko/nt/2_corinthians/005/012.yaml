review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the denial of repeated self-commendation and the purpose of equipping the Corinthians to respond. However, ‘마음에 있지 아니하고 외모를 자랑하는’ does not faithfully represent the Greek parallelism ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ (‘boasting in outward appearance and not in heart’); it instead suggests something ‘not being in the heart.’
  naturalness: The proposed revision uses natural modern formal-polite Korean. Dividing the long Greek sentence into three sentences improves readability without reducing the logical connection.
  terminology: ‘추천하다’ is an appropriate modern rendering of συνιστάνομεν, and ‘자랑할 근거’ appropriately renders ἀφορμὴν καυχήματος. ‘겉모습’ and ‘마음’ preserve the source’s external/internal contrast. ‘자랑하며 ... 자랑하지 않는’ keeps the deliberate lexical repetition of καυχάομαι.
  issues:
  - severity: medium
    issue: The final contrast is grammatically and semantically distorted.
    rationale: ‘마음에 있지 아니하고’ treats καρδίᾳ as the location of an unstated state rather than as the contrasting sphere of boasting. The Greek describes persons who boast ‘in outward appearance’ but not ‘in heart.’
  - severity: low
    issue: The draft’s formal negative construction is less natural in the target register.
    rationale: ‘아니하고’ is possible but somewhat stilted here; ‘아닙니다. 오히려’ is clear, modern 합쇼체 and preserves the adversative relation.
  revised_text: 우리가 다시 여러분에게 우리 자신을 추천하는 것이 아닙니다. 오히려 여러분이 우리를 자랑할 근거를 드리는 것입니다. 이는 겉모습으로 자랑하며 마음으로는 자랑하지 않는 사람들에게 여러분이 대답할 수 있게 하려는 것입니다.
  revised_footnotes: []
  revision_rationale: The revision corrects the misrendered final antithesis while preserving the ambiguity of ‘in heart’ rather than expanding it into a doctrinal interpretation such as sincerity or inward reality. It also retains the recurring boast/자랑 wordplay and renders the purpose clause explicitly and naturally.
