- from: 우리가 다시 여러분에게 우리 자신을 추천하는 것이 아니라, 우리를 자랑할 근거를 여러분에게 주는 것입니다. 이는 마음에 있지 아니하고 외모를 자랑하는 자들에게 여러분이 대답할 수 있게 하려는 것입니다.
  to: 우리가 다시 여러분에게 우리 자신을 추천하는 것이 아닙니다. 오히려 여러분이 우리를 자랑할 근거를 드리는 것입니다. 이는 겉모습으로 자랑하며 마음으로는 자랑하지 않는 사람들에게 여러분이 대답할 수 있게 하려는 것입니다.
  rationale: The revision corrects the misrendered final antithesis while preserving the ambiguity of ‘in heart’ rather than expanding it into a doctrinal interpretation such as sincerity or inward reality. It also retains the recurring boast/자랑 wordplay and renders the purpose clause explicitly and naturally.
  reviewer_model: gpt-5.6-terra
