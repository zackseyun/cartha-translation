  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us, because we have concluded this: that one died on behalf of all; therefore all died.'
  footnotes:
  - marker: a
    text: Or 'the Messiah's love' or 'love for the Messiah'; the Greek genitive can be understood either way.
