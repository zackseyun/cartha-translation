  source_fidelity: 개정이 필요합니다. 초안의 「주께로 가서」는 그리스어의 두 병렬 부정사(‘몸으로부터 떠나’ / ‘주를 향하여 본향에 거하다’)를 시간적·공간적 이동의 순서로 바꾸며, ἐνδημέω의 ‘거함’ 이미지를 약화합니다. 「주와 함께 거하다」는 πρὸς τὸν κύριον의 인격적 임재를 자연스럽게 드러내면서 불필요한 ‘가다’를 더하지 않습니다.
  naturalness: 「우리는 담대합니다. 우리는 차라리 … 바랍니다」는 현대 표준어 합쇼체로 자연스럽고, 두 동사 θαρροῦμεν과 εὐδοκοῦμεν을 분명히 보존합니다. 「차라리」는 μᾶλλον이 나타내는 선호를 자연스럽게 전달합니다.
  terminology: 「몸」과 「주」는 본문의 핵심 용어를 유지합니다. 「거하다」는 ἐνδημέω의 본향/거처 은유를 한국어에서 과도하게 해석하지 않고 보존합니다. 사후 상태나 천국 등의 교리적 설명을 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: 「주께로 가서」가 원문의 병렬 구조에 이동·순서의 의미를 첨가함
