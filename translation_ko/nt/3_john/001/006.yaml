id: 3JN.1.6
reference: 3 John 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love, and you will do well to send them on their way in a manner worthy of God.
translation:
  language: ko
  text: 그들이 회중[a] 앞에서 그대의 사랑을 증언했습니다. 그들을 하나님께 합당한 방식으로 보내어 주시면 좋겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「교회」. 헬라어 ἐκκλησία는 1세기 문맥에서 「모인 회중」을 가리킨다. 본 절에서는 일반적 회중 모임을 가리키므로 「회중」으로 옮기되, 9·10절의 디오드레베 사건에서는 특정 지역 교회 공동체를 가리키므로 「교회」로 옮긴다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν σου τῇ ἀγάπῃ
  english_pob_choice: testified ... about your love
  chosen_korean: 그대의 사랑을 증언했습니다
  alternatives_korean:
  - 그대의 사랑에 대해 증언했습니다
  - 그대의 사랑을 증거했습니다
  lexicon: BDAG
  rationale: μαρτυρέω + 여격은 「~에 관해 증언하다」. 「~을 증언하다」로 자연스럽게 옮긴다.
- source_word: ἐνώπιον ἐκκλησίας
  english_pob_choice: before the church
  chosen_korean: 회중 앞에서
  alternatives_korean:
  - 교회 앞에서
  - 모임 앞에서
  lexicon: BDAG
  rationale: 본 절은 무관사 ἐκκλησίας — 일반적 모임을 가리킨다. 9·10절의 정관사 τῇ ἐκκλησίᾳ(특정 지역 교회)와 구별하기 위해 「회중」으로 옮긴다.
- source_word: καλῶς ποιήσεις προπέμψας
  english_pob_choice: you will do well to send them on their way
  chosen_korean: 보내어 주시면 좋겠습니다
  alternatives_korean:
  - 보내드리면 잘하시는 것입니다
  - 길을 떠나도록 도와주시면 좋겠습니다
  lexicon: BDAG
  rationale: '「καλῶς ποιήσεις + 분사」는 헬라어 정중한 부탁 정형(「~해 주시면 좋겠습니다」). προπέμπω는 여행자에게 양식·노자를 갖춰 떠나보내는 환대 동사. 「보내어 주시면 좋겠습니다」가 정중함과 의미를 모두 살린다.'
- source_word: ἀξίως τοῦ θεοῦ
  english_pob_choice: in a manner worthy of God
  chosen_korean: 하나님께 합당한 방식으로
  alternatives_korean:
  - 하나님께 합당하게
  - 하나님께 어울리는 방식으로
  lexicon: BDAG
  rationale: 부사 ἀξίως + 속격을 「~께 합당한 방식으로」로 옮겨, 환대 행위가 하나님 자신을 향한 섬김임을 함의한다.
