    rationale: 무관사 ἐκκλησία가 반드시 일반적 모임을 뜻하는 것은 아니며, 본문에는 그러한 번역상 구별을 요구하는 표지가 없습니다. 각주는 영어 POB 감사 기록에 있는 προπέμπω의 여행 지원 뉘앙스를 설명하는 데 쓰는 것이 더 근거 있고 유익합니다.
