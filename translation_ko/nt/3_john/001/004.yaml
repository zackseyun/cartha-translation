  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth.'
translation:
  language: ko
  text: 내게는 내 자녀들이 진리 안에서 행하고 있다는 소식을 듣는 것보다 더 큰 기쁨이 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μειζοτέραν τούτων ... χαράν
  english_pob_choice: no greater joy than this
  chosen_korean: 이보다 더 큰 기쁨
  alternatives_korean:
  - 이것보다 더 큰 기쁨
  lexicon: BDAG
  rationale: 이중 비교급 μειζοτέραν의 강조를 한국어 「더 큰」으로 자연스럽게 옮긴다. 「이보다」가 지시대명사 τούτων을 자연스럽게 받는다.
- source_word: ἵνα ἀκούω
  english_pob_choice: to hear
  chosen_korean: 듣는 것입니다
  alternatives_korean:
  - 듣는 것
  lexicon: BDAG
  rationale: 설명적 ἵνα + 가정법 현재를 「~는 것입니다」로 옮겨 「큰 기쁨」의 내용을 명시한다.
- source_word: τὰ ἐμὰ τέκνα
  english_pob_choice: my children
  chosen_korean: 내 자녀들
  alternatives_korean:
  - 나의 자녀들
  - 내 아이들
  lexicon: BDAG
  rationale: 영적 부자 관계의 정형 호칭 「내 자녀들」을 유지한다. 강조 형용사 ἐμά는 「나의」로 살려도 좋으나, 한국어 어순상 「내」가 더 자연스럽다.
- source_word: ἐν τῇ ἀληθείᾳ περιπατοῦντα
  english_pob_choice: walking in the truth
  chosen_korean: 진리 안에서 행하고 있다는
  alternatives_korean:
  - 진리 가운데 살아가고 있다는
  lexicon: BDAG
  rationale: 2요한 4절·6절·3요한 3절과 일관된 정형 어휘.
