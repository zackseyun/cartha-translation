  yaml_path: translation/nt/3_john/001/005.yaml
  text: Beloved, you are acting faithfully in whatever you do for the brothers, and especially when they are strangers.
translation:
  language: ko
  text: 사랑하는 이여, 형제들을 위하여, 그것도 나그네인 이들을 위하여 무슨 일을 하든, 신실하게 행하고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστὸν ποιεῖς
  english_pob_choice: you are acting faithfully
  chosen_korean: 신실한 일입니다
  alternatives_korean:
  - 신실하게 행하고 있습니다
  - 충실히 행하고 있습니다
  lexicon: BDAG
  rationale: 「πιστὸν ποιεῖς」는 「신실한 일을 행한다」의 의미. 「신실한 일입니다」로 옮겨 행위의 충실성과 신앙적 함의를 함께 살린다.
- source_word: ὃ ἐὰν ἐργάσῃ
  english_pob_choice: in whatever you do
  chosen_korean: 무엇이든 행하는 일은
  alternatives_korean:
  - 어떤 일을 하든
  - 무슨 일을 하든
  lexicon: BDAG
  rationale: 부정관계대명사 + ἐάν의 일반적 함의를 「무엇이든」으로 옮긴다.
- source_word: εἰς τοὺς ἀδελφοὺς καὶ τοῦτο ξένους
  english_pob_choice: for the brothers, and especially when they are strangers
  chosen_korean: 형제들에게, 더욱이 나그네 된 자들에게
  alternatives_korean:
  - 형제들에게, 특별히 그들이 손님일 때에
  - 형제들에게, 그것도 나그네인 그들에게
  lexicon: BDAG
  rationale: 강조 구문 καὶ τοῦτο(「그것도」, 「더욱이」)를 「더욱이」로 옮긴다. ξένους는 본문 맥락상 환대를 받아야 할 「나그네」를 가리키며, 6-8절의 손님 대접(ξενοδοχέω 의미장) 흐름을 살린다.
