  to: 사랑하는 이여, 형제들을 위하여, 그것도 나그네인 이들을 위하여 무슨 일을 하든, 신실하게 행하고 있습니다.
  rationale: The revision restores a direct verbal rendering of πιστὸν ποιεῖς, uses idiomatic modern formal-polite Korean, and represents καὶ τοῦτο ξένους with “그것도 나그네인 이들을 위하여.” It does not overdefine ξένοι as ethnic foreigners or impose a theological interpretation.
