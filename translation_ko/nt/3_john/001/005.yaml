review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the indefinite scope of ὃ ἐὰν ἐργάσῃ and the commendation expressed by πιστὸν ποιεῖς. However, its predicate, “신실한 일입니다,” recasts the Greek verbal commendation as a nominal statement and is less direct. The rendering of ξένους as “나그네 된 자들” is unnatural and obscures the phrase’s sense of brothers who are strangers to the recipient.
  naturalness: “나그네 된 자들” is not idiomatic contemporary Korean. “형제들에게, 더욱이 나그네 된 자들에게” also sounds as though two unrelated recipient groups are intended. A verbal predicate and the connective “그것도” provide a more natural, formal-polite Korean sentence.
  terminology: “사랑하는 이여” retains the warm epistolary vocative of Ἀγαπητέ. “형제들” appropriately retains the masculine plural term without importing a gender-neutral expansion. “나그네인 이들” is suitable in this hospitality context and avoids implying ethnic foreignness.
  issues:
  - severity: medium
    issue: The predication “신실한 일입니다” is a less faithful and less natural restructuring of πιστὸν ποιεῖς.
    rationale: 'The Greek directly commends the addressee’s conduct: “you act/do faithfully.” Korean “신실하게 행하고 있습니다” preserves this verbal force and better matches the source.'
  - severity: medium
    issue: “나그네 된 자들” is awkward and the coordination can imply a separate class from the brothers.
    rationale: ξένους denotes strangers/unknown traveling persons in the hospitality setting; “그것도 나그네인 이들을 위하여” clearly retains the intensifying addition while allowing these persons to be understood in relation to the brothers.
  revised_text: 사랑하는 이여, 형제들을 위하여, 그것도 나그네인 이들을 위하여 무슨 일을 하든, 신실하게 행하고 있습니다.
  revised_footnotes: []
  revision_rationale: The revision restores a direct verbal rendering of πιστὸν ποιεῖς, uses idiomatic modern formal-polite Korean, and represents καὶ τοῦτο ξένους with “그것도 나그네인 이들을 위하여.” It does not overdefine ξένοι as ethnic foreigners or impose a theological interpretation.
