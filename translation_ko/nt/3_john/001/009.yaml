  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church, but Diotrephes, who loves to be first among them, does not receive us.
translation:
  language: ko
  text: 내가 그 교회에 무엇인가를[a] 썼습니다만, 그들 가운데 으뜸 되기를 좋아하는 디오드레베가 우리를 받아들이지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 교회에 짧은 글을 썼습니다.’ 그리스어 본문은 ‘무엇인가를 썼습니다’라는 불특정 표현을 사용하며, 일부 사본은 이 표현을 더 길게 확장합니다.
    reason: textual_variant
lexical_decisions:
- source_word: τῇ ἐκκλησίᾳ
  english_pob_choice: to the church
  chosen_korean: 그 교회에
  alternatives_korean:
  - 그 회중에
  lexicon: BDAG
  rationale: 정관사 τῇ가 특정 지역 교회 공동체를 가리키며, 디오드레베가 권력을 행사하는 제도적 회중을 가리키므로 「교회」로 옮긴다. (6절의 무관사 ἐκκλησίας는 「회중」으로 구별.)
- source_word: ὁ φιλοπρωτεύων αὐτῶν
  english_pob_choice: who loves to be first among them
  chosen_korean: 그들 가운데 으뜸 되기를 좋아하는
  alternatives_korean:
  - 그들 가운데 제일이 되기를 좋아하는
  - 그들 중에 으뜸이 되고자 하는
  lexicon: BDAG
  rationale: φιλοπρωτεύω(NT 단 1회 출현)는 「첫째 자리를 사랑하다」. 「으뜸 되기를 좋아하는」이 권력 욕구의 부정적 함의를 살린다.
- source_word: Διοτρέφης
  english_pob_choice: Diotrephes
  chosen_korean: 디오드레베
  alternatives_korean:
  - 디오트레페스
  lexicon: BDAG
  rationale: 한국 교회의 정착 표기 「디오드레베」를 따른다.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  english_pob_choice: does not receive us
  chosen_korean: 우리를 받아들이지 않습니다
  alternatives_korean:
  - 우리를 영접하지 않습니다
  - 우리의 권위를 인정하지 않습니다
  lexicon: BDAG
  rationale: ἐπιδέχομαι는 「(상위의·권위 있는 자를) 받아들이다」. 「받아들이지 않습니다」로 옮겨 환대 거부와 권위 부정의 이중 함의를 살린다.
