    rationale: Ἔγραψά τι는 문자적으로 ‘나는 무엇인가를 썼습니다’이며, τι가 무엇인지는 본문이 밝히지 않습니다. ‘써 보냈습니다’도 문맥상 가능하나, 원문의 표현상 남겨진 불특정성을 보존하는 편이 더 안전합니다.
