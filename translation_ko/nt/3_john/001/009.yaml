  source_fidelity: ‘써 보냈는데’는 편지 전달을 어느 정도 함축하여, 단지 ‘무엇인가를 썼다’는 SBLGNT의 불특정 표현 τι보다 약간 구체적입니다. 또한 이 난해한 본문 형태와 관련된 본문비평 주석의 표지가 본문에 필요합니다. 나머지 구절은 원문의 대조, 디오드레베의 으뜸 추구, 그리고 ἐπιδέχεται의 넓은 의미를 충실히 반영합니다.
  naturalness: ‘그 교회에 무엇인가를 썼습니다만’은 현대 표준 한국어 합쇼체로 자연스럽고, ‘그들 가운데 으뜸 되기를 좋아하는’ 및 ‘우리를 받아들이지 않습니다’도 명료합니다.
  terminology: ‘교회’, ‘디오드레베’, ‘받아들이지 않습니다’는 적절합니다. 특히 ‘받아들이지 않습니다’는 환대의 거부와 인정의 거부 중 어느 하나로 의미를 좁히지 않습니다.
