id: 3JN.1.3
reference: 3 John 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth, just as you are walking in truth.
translation:
  language: ko
  text: 형제들이 와서 그대의 진리에 대하여 증언할 때, 나는 크게 기뻐했습니다. 그것은 그대가 진리 안에서 살아가고 있는 것과 같았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐχάρην ... λίαν
  english_pob_choice: I rejoiced greatly
  chosen_korean: 크게 기뻐했습니다
  alternatives_korean:
  - 매우 기뻐했습니다
  - 심히 기뻐했습니다
  lexicon: BDAG
  rationale: 2요한 4절과 일관되게 부정과거 + λίαν을 「크게 기뻐했습니다」로 옮긴다.
- source_word: ἐρχομένων ἀδελφῶν
  english_pob_choice: when brothers came
  chosen_korean: 형제들이 와서
  alternatives_korean:
  - 형제들이 와서는
  lexicon: BDAG
  rationale: 속격 절대 구문을 「~때」 의미의 종속절로 자연스럽게 옮긴다.
- source_word: μαρτυρούντων σου τῇ ἀληθείᾳ
  english_pob_choice: testified to your truth
  chosen_korean: 그대의 진리를 증언했을 때
  alternatives_korean:
  - 그대의 진실됨을 증언했을 때
  - 그대 안에 있는 진리를 증언했을 때
  lexicon: BDAG
  rationale: σου τῇ ἀληθείᾳ는 「그대의 진리」(가이오가 붙들고 있는 진리)로 옮겨, 인격적 진실성보다 요한 문헌 정형 「진리」 어휘를 보존한다.
- source_word: ἐν ἀληθείᾳ περιπατεῖς
  english_pob_choice: walking in truth
  chosen_korean: 진리 안에서 행하고 있는
  alternatives_korean:
  - 진리 가운데 살아가고 있는
  - 진리를 따라 걷고 있는
  lexicon: BDAG
  rationale: 2요한 4절·6절과 일관된 정형 어휘. 현재시제 περιπατεῖς를 「행하고 있는」 진행상으로 옮긴다.
