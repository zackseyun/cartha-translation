  source_fidelity: 초안의 「장로」, 「사랑하는 가이오」, 「진리 안에서」는 각각 ὁ πρεσβύτερος, τῷ ἀγαπητῷ Γαΐῳ, ἐν ἀληθείᾳ를 대체로 충실히 반영합니다. 그러나 「장로는 … 편지합니다」는 발신자 자기호칭을 삼인칭 서술처럼 만들고, 원문의 명시된 ἐγώ와 발신자-화자의 동일성을 충분히 드러내지 못합니다. 「장로인 나는」으로 바로잡는 것이 안전합니다.
  naturalness: 「장로인 나는 사랑하는 가이오에게 편지합니다」는 한국어 서신 첫머리로 자연스럽고 현대 합쇼체에 맞습니다. 이어지는 「나는 진리 안에서 그를 사랑합니다」도 원문의 강조된 ἐγώ를 무리 없이 반영합니다.
