revisions:
- from: 그러므로 우리는 그러한 사람들을 손님으로 맞아들여야 합니다. 그리하여 우리가 진리를 위한 동역자가 되도록 말입니다.
  to: 그러므로 우리는 그러한 이들을 받아들여야 합니다. 이는 우리가 진리를 위한[a] 동역자가 되기 위함입니다.
  rationale: The revision retains the verse’s inference, obligation, reception of the described workers, and purpose of becoming fellow workers. It avoids placing the contextually likely but lexically more specific idea of receiving persons ‘as guests’ in the main text, improves Korean syntax and register, and supplies a footnote for the disputed nuance of τῇ ἀληθείᾳ.
