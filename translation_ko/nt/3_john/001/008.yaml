id: 3JN.1.8
reference: 3 John 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore, we ought to receive such people, so that we may become fellow workers for the truth.
translation:
  language: ko
  text: 그러므로 우리는 그러한 사람들을 손님으로 맞아들여야 합니다. 그리하여 우리가 진리를 위한 동역자가 되도록 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφείλομεν ὑπολαμβάνειν
  english_pob_choice: we ought to receive
  chosen_korean: 손님으로 맞아들여야 합니다
  alternatives_korean:
  - 영접해야 합니다
  - 받아들여야 합니다
  - 후원해야 합니다
  lexicon: BDAG
  rationale: 'ὑπολαμβάνω는 본문 맥락에서 「밑에서 떠받쳐 맞아들이다·후원하다」의 의미(ξενοδοχέω 의미장). 5-7절의 손님 대접 흐름을 살려 「손님으로 맞아들이다」로 옮겨 환대의 실천적 무게를 명시한다.'
- source_word: τοὺς τοιούτους
  english_pob_choice: such people
  chosen_korean: 그러한 사람들
  alternatives_korean:
  - 이와 같은 자들
  - 그런 이들
  lexicon: BDAG
  rationale: 「그 이름을 위해 나간」 자들을 가리키는 지시 어구를 「그러한 사람들」로 자연스럽게 옮긴다.
- source_word: συνεργοὶ γινώμεθα τῇ ἀληθείᾳ
  english_pob_choice: become fellow workers for the truth
  chosen_korean: 진리를 위한 동역자가 되도록
  alternatives_korean:
  - 진리를 위한 함께 일하는 자가 되도록
  - 진리와 함께 일하는 자가 되도록
  lexicon: BDAG
  rationale: συνεργός는 「함께 일하는 자·동역자」. 한국 교회 정착 용어 「동역자」를 사용한다. 여격 τῇ ἀληθείᾳ는 「~을 위한」(목적·이익) 또는 「~과 함께」(동반) 두 해석이 모두 가능하나, 본문 흐름상 진리를 섬기는 「~을 위한」으로 옮긴다.
