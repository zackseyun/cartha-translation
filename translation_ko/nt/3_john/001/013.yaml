  rationale: κάλαμος는 갈대로 만든 필기구. 현대 한국어에서 「펜」이 가장 자연스러우나 고대 도구임을 살리려면 「갈대 펜」도 가능. 「먹」은 2요한 12절과 일관성 유지.
