lexical_decisions:
- source_word: Πολλὰ εἶχον γράψαι σοι
  english_pob_choice: I had many things to write to you
  chosen_korean: 그대에게 쓸 것이 많이 있었지만
  alternatives_korean:
  - 그대에게 쓸 일이 많았지만
  - 그대에게 쓸 말이 많았으나
  lexicon: BDAG
  rationale: 미완료 εἶχον + 부정사 γράψαι의 「쓰려고 했었다」의 의도 표현을 「많이 있었다」로 자연스럽게 옮긴다.
- source_word: διὰ μέλανος καὶ καλάμου
  english_pob_choice: with ink and pen
  chosen_korean: 먹과 펜으로는
  alternatives_korean:
  - 잉크와 갈대 펜으로
  - 먹과 갈대로
  lexicon: BDAG
  rationale: κάλαμος는 갈대로 만든 필기구. 현대 한국어에서 「펜」이 가장 자연스러우나 고대 도구임을 살리려면 「갈대 펜」도 가능. 「먹」은 2요한 12절과 일관성 유지.
