  to: 평안이 있기를 바랍니다. 친구들이 문안합니다. 친구들에게 한 사람 한 사람 이름을 불러 문안해 주십시오.
  rationale: The revision removes the literary second-person pronoun while preserving the singular, direct epistolary address in idiomatic Korean. It keeps φίλοι as ‘친구들,’ retains the greeting sense of ἀσπάζομαι, and renders κατ’ ὄνομα with its individualizing force. No footnote is required because the Korean wording does not introduce a material ambiguity beyond the source text.
