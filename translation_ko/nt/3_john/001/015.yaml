  text: Peace to you. The friends greet you. Greet the friends by name.
translation:
  language: ko
  text: 평안이 있기를 바랍니다. 친구들이 문안합니다. 친구들에게 한 사람 한 사람 이름을 불러 문안해 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰρήνη σοι
  english_pob_choice: Peace to you
  chosen_korean: 그대에게 평강이 있기를 빕니다
  alternatives_korean:
  - 그대에게 평강을 빕니다
  - 평강이 그대에게 있기를
  lexicon: BDAG
  rationale: 히브리식 인사 「샬롬」의 헬라어 형식. 「평강」은 한국 교회 정착 어휘로 단순한 평화 이상의 안녕·온전함을 함의한다. 합쇼체 격식을 위해 「있기를 빕니다」 형식을 더한다.
- source_word: ἀσπάζονταί σε οἱ φίλοι
  english_pob_choice: The friends greet you
  chosen_korean: 친구들이 그대에게 문안합니다
  alternatives_korean:
  - 친구들이 그대에게 안부를 전합니다
  - 벗들이 그대에게 인사합니다
  lexicon: BDAG
  rationale: 요한 문헌의 「친구」 개념(요 15:13-15)을 살려 「친구」로 옮긴다. ἀσπάζομαι는 서신 종결 정형 「문안하다」.
- source_word: ἀσπάζου τοὺς φίλους κατ’ ὄνομα
  english_pob_choice: Greet the friends by name
  chosen_korean: 친구들에게 한 사람 한 사람 이름을 불러 문안해 주십시오
  alternatives_korean:
  - 친구들에게 이름마다 문안해 주십시오
  - 친구들 각자에게 이름을 부르며 문안해 주십시오
  lexicon: BDAG
  rationale: κατ’ ὄνομα(「이름에 따라」)의 분배·개별 함의를 「한 사람 한 사람 이름을 불러」로 살려, 공동체 구성원 각자를 향한 개인적 인사의 무게를 명시한다.
