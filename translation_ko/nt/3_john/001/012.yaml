  verdict: revise
  source_fidelity: 대체로 충실합니다. 다만 ὑπὸ αὐτῆς τῆς ἀληθείας는 앞의 ὑπὸ πάντων과 마찬가지로 증언의 행위자/근원으로 진리를 제시하므로, 한국어에서는 ‘진리 자체로부터’보다 ‘진리 자체에게서도’가 더 자연스럽고 병렬이 분명합니다. μεμαρτύρηται의 완료 수동은 ‘증언을 받았습니다’로 무리 없이 옮겼으며, ‘좋은’과 같은 평가 형용사를 보태지 않았습니다.
  naturalness: ‘그대는 … 압니다’는 현대 표준어 합쇼체 문맥에서 다소 문어적·비자연스럽습니다. 독자에게 직접 호칭하는 ‘당신’을 피하고 주어를 생략하여 ‘… 알고 있습니다’로 하면 현대적인 정중 서술체를 유지하면서도 2인칭 의미가 보존됩니다. 두 번째 καί/δέ의 연결은 ‘우리도 증언하며’로 자연스럽게 연결할 수 있습니다.
  terminology: ‘데메드리오’, ‘증언’, ‘진리 자체’, ‘참되다’는 적절합니다. ‘진리 자체’의 강조와 요한 문헌 특유의 표현을 보존했습니다. 영어 감사 기록의 대안 해석은 ‘진리 자체’ 구절에 붙여야 하므로, 기존 영어의 b 표지 위치와 달리 한국어에서는 해당 어구에 각주 표지를 둡니다.
  issues:
