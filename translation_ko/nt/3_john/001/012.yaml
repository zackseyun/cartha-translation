  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone, and from the truth itself. We also testify, and you know that our testimony is true.
translation:
  language: ko
  text: 데메드리오는 모든 사람에게서[a], 또 진리 자체에게서도[b] 증언을 받았습니다. 우리도 증언하며, 우리의 증언이 참되다는 것을 알고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람이 데메드리오에 대하여 증언했습니다.’ 그리스어는 ‘증언하다’라는 동사의 완료 수동태를 사용하여, 이미 확립된 추천 또는 평판을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘진리 자체’는 데메드리오의 삶이 진리에 부합한다는 뜻일 수도 있고, 더 넓게는 복음 또는 진리가 그에게 유리하게 증언한다는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων
  english_pob_choice: Demetrius has received testimony from everyone
  chosen_korean: 데메드리오는 모든 이들에게서 ... 증언을 받았습니다
  alternatives_korean:
  - 데메드리오는 모든 사람에게 좋은 평을 받았습니다
  - 데메드리오에 대해 모두가 증언했습니다
  lexicon: BDAG
  rationale: 완료수동 μεμαρτύρηται의 결과상태를 「증언을 받았다」로 옮긴다. 한국 교회 정착 표기 「데메드리오」를 따른다.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  english_pob_choice: from the truth itself
  chosen_korean: 진리 자체로부터
  alternatives_korean:
  - 진리 자신에 의해
  - 진리 그 자체로부터
  lexicon: BDAG
  rationale: 강조 αὐτῆς의 「자체·바로 그」 의미를 「자체」로 살린다. 요한 문헌의 인격화된 「진리」 의미장을 보존한다.
- source_word: ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν
  english_pob_choice: our testimony is true
  chosen_korean: 우리의 증언이 참되다
  alternatives_korean:
  - 우리의 증거가 참됩니다
  - 우리의 증언은 진실입니다
  lexicon: BDAG
  rationale: 요한 문헌의 정형 표현(요 21:24와 평행). ἀληθής를 「참되다」로 옮겨 일관성을 유지한다.
