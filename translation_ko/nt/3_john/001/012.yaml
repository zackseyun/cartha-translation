    issue: ‘진리 자체로부터’의 어색한 행위자 표현
    rationale: 원문의 ὑπό는 수동문의 행위자를 나타냅니다. 추상 명사가 증언의 주체로 의인화된 표현임을 살려 ‘진리 자체에게서도 증언을’으로 옮기는 편이 자연스럽고 문법 관계가 명확합니다.
  - severity: low
    issue: ‘그대는 … 압니다’의 현대 합쇼체 부적합
    rationale: ‘그대’와 ‘압니다’의 결합은 현대 표준어 정중체에서 부자연스럽습니다. 주어를 생략한 ‘알고 있습니다’가 원문의 2인칭을 문맥상 유지하면서 목표 register에 맞습니다.
