  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name, taking nothing from the Gentiles.
translation:
  language: ko
  text: 그들은 그 이름[a]을 위하여 나갔으며, 이방인들에게서 아무것도 받지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 이름’. 초기 기독교 문맥에서는 예수 또는 주님을 가리키는 경건한 약칭으로 이해될 수 있다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ τοῦ ὀνόματος
  english_pob_choice: for the sake of the Name
  chosen_korean: 그 이름을 위해
  alternatives_korean:
  - 그 이름을 위하여
  - 그 이름 때문에
  lexicon: BDAG
  rationale: ὑπέρ + 속격의 「~을 위하여」 의미. 「그 이름」은 초기 기독교에서 예수 그리스도의 이름을 가리키는 정형 표현(행 5:41, 9:16 등).
- source_word: ἐξῆλθον
  english_pob_choice: they went out
  chosen_korean: 나갔으며
  alternatives_korean:
  - 떠났으며
  - 나섰으며
  lexicon: BDAG
  rationale: 부정과거 ἐξῆλθον의 선교 여행 출발 의미를 「나갔다」로 옮긴다.
- source_word: μηδὲν λαμβάνοντες ἀπὸ τῶν ἐθνικῶν
  english_pob_choice: taking nothing from the Gentiles
  chosen_korean: 이방인들에게서는 아무것도 받지 않았습니다
  alternatives_korean:
  - 이방인들로부터 아무것도 받지 않으며
  - 이방인들에게서 아무 도움도 받지 않았습니다
  lexicon: BDAG
  rationale: ἐθνικός는 「이방인·비유대인」을 가리키며, 여기서는 「복음을 모르는 자들」 일반을 함의한다. 보조 「~에게서는」으로 대조를 살려 「믿는 자들의 환대에 의존했다」는 5-8절의 흐름을 명확히 한다.
