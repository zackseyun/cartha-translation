id: 3JN.1.2
reference: 3 John 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved, I pray that in all respects you may prosper and be healthy, just as your soul prospers.
translation:
  language: ko
  text: 사랑하는 이여, 그대의 영혼이 잘되고 있는 것처럼, 그대가 모든 면에서 잘되고 건강하기를 기도합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπητέ
  english_pob_choice: Beloved
  chosen_korean: 사랑하는 자여
  alternatives_korean:
  - 사랑받는 자여
  - 친애하는 이여
  lexicon: BDAG
  rationale: 호격 ἀγαπητέ를 「사랑하는 자여」로 옮겨 서신의 친밀한 음조를 살린다. 한국어 정착 호칭.
- source_word: περὶ πάντων εὔχομαί σε εὐοδοῦσθαι
  english_pob_choice: I pray that in all respects you may prosper
  chosen_korean: 모든 일에 그대가 잘되고 ... 기도합니다
  alternatives_korean:
  - 범사에 그대가 잘되기를 기도합니다
  - 모든 면에서 그대가 형통하기를 기도합니다
  lexicon: BDAG
  rationale: εὐοδόω의 「잘되다·형통하다」 의미를 「잘되다」로 자연스럽게 옮긴다. περὶ πάντων을 「모든 일에」로.
- source_word: ὑγιαίνειν
  english_pob_choice: be healthy
  chosen_korean: 건강하기
  alternatives_korean:
  - 강건하기
  - 평안하기
  lexicon: BDAG
  rationale: ὑγιαίνω는 신체적 건강을 가리킨다. 현대 한국어 「건강하다」가 정확한 등가어.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  english_pob_choice: your soul prospers
  chosen_korean: 그대의 영혼이 잘됨같이
  alternatives_korean:
  - 그대의 영혼이 형통함같이
  - 그대의 마음이 잘되는 것처럼
  lexicon: BDAG
  rationale: ψυχή의 「영혼·내면」 의미를 「영혼」으로 보존한다. καθώς 비교절을 「~같이」로 옮긴다.
