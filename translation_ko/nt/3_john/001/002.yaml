review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 「그대의 영혼이 잘됨같이」는 헬라어 현재형 εὐοδοῦται의 진행·지속되는 상태를 자연스러운 현대 한국어로 충분히 드러내지 못하며, 「모든 일에」보다 「모든 면에서」가 περὶ πάντων의 범위적 용법을 더 명확히 반영합니다.
  naturalness: 「사랑하는 자여」와 「잘됨같이」는 문어적·전통 성서 번역투가 강합니다. 현대 표준어 합쇼체에는 「사랑하는 이여」 및 「잘되고 있는 것처럼」이 더 자연스럽습니다.
  terminology: ἀγαπητέ는 「사랑하는 이여」로, ψυχή는 원문의 여지를 보존하여 「영혼」으로 유지합니다. εὐοδοῦσθαι는 문맥상 외적 안녕과 형편이 잘됨을 가리키므로 「모든 면에서 잘되고」로, ὑγιαίνειν은 신체적 건강을 가리키므로 「건강하기를」로 옮깁니다.
  issues:
  - severity: medium
    issue: 「그대의 영혼이 잘됨같이」의 현대성 및 동사상 표현
    rationale: 명사화된 「잘됨」과 「~같이」의 결합은 현대 합쇼체에서 부자연스럽고, εὐοδοῦται의 현재 상태도 약화합니다. 「영혼이 잘되고 있는 것처럼」이 비교와 현재적 상태를 자연스럽게 살립니다.
  - severity: low
    issue: περὶ πάντων의 범위 표현
    rationale: 「모든 일에」도 가능하지만 사건·업무의 뜻으로 좁게 들릴 수 있습니다. 「모든 면에서」는 ‘모든 점에 관하여/in all respects’라는 범위 의미를 더 분명하게 전달합니다.
  revised_text: 사랑하는 이여, 그대의 영혼이 잘되고 있는 것처럼, 그대가 모든 면에서 잘되고 건강하기를 기도합니다.
