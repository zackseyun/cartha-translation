lexical_decisions:
- source_word: ἐλπίζω δὲ εὐθέως σε ἰδεῖν
  english_pob_choice: I hope to see you soon
  chosen_korean: 곧 그대를 만나 뵙기를 바랍니다
  alternatives_korean:
  - 곧 그대를 보기를 소망합니다
  - 머지않아 그대를 만나기를 바랍니다
  lexicon: BDAG
  rationale: ἰδεῖν의 「보다·만나다」 의미를 「만나 뵙다」로 옮겨 합쇼체 격식을 살린다. εὐθέως는 「곧·머지않아」.
- source_word: στόμα πρὸς στόμα λαλήσομεν
  english_pob_choice: we will speak face to face
  chosen_korean: 얼굴을 마주 보고 이야기하게 될 것입니다
  alternatives_korean:
  - 직접 만나 이야기하게 될 것입니다
  - 대면하여 말하게 될 것입니다
  lexicon: BDAG
  rationale: 2요한 12절과 일관되게 「입에서 입으로」 직역 대신 「얼굴을 마주 보고」로 옮긴다. 미래 λαλήσομεν은 「~게 될 것입니다」.
