  source_fidelity: 전체 의미와 문장 관계는 대체로 충실합니다. 다만 ὑπομνήσω는 여기서 그의 행위를 공동체에 다시 상기시키고 지적하겠다는 뜻이므로, 다소 구어적이고 폭로의 뉘앙스가 강한 «들춰내겠습니다»보다 «지적하겠습니다»가 더 절제되고 안전합니다. 또한 λόγοις πονηροῖς φλυαρῶν ἡμᾶς는 ‘우리를 두고/우리에게 대하여’ 악한 말을 늘어놓는다는 뜻으로 표현하는 편이 한국어 문법과 원문의 대상을 더 분명히 반영합니다.
  naturalness: 합쇼체는 일관되며 전반적으로 자연스럽습니다. 그러나 «우리를 헐뜯어 떠벌리고»는 목적어와 ‘떠벌리다’의 결합이 다소 어색합니다. «우리를 두고 악한 말을 늘어놓으며»는 현대 표준어에서 자연스럽고, 적대적이며 헛된 말을 한다는 뜻을 보존합니다.
  terminology: «형제들», «교회», «쫓아냅니다»는 적절합니다. ἐπιδέχεται에는 환대의 뜻이 있으므로 «받아들이다»를 본문에 유지하되 ‘영접하다’라는 대안을 각주로 제시할 수 있습니다. τοὺς ἀδελφούς가 문맥상 순회하는 그리스도인 형제들을 가리킬 가능성도 각주에서 설명하는 것이 영어 POB 감사 기록과 부합합니다.
  issues:
