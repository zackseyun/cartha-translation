id: 3JN.1.10
reference: 3 John 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason, if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers, and he hinders those who want to do so and throws them out of the church.
translation:
  language: ko
  text: 그러므로 내가 가게 되면, 그가 하는 일들을 지적하겠습니다. 그는 우리를 두고 악한 말을 늘어놓으며, 그런 일들로도 그치지 않고 자신도 형제들을 받아들이지 않으며[a][b], 받아들이려는 사람들까지 막아 교회에서 쫓아냅니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형제들을 영접하지 않으며.’ 여기서 ‘받아들이다’는 특히 환대하여 맞아들인다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 문맥상 여행 중인 그리스도인 형제들, 곧 순회하는 일꾼들을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘교회에서 추방합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομνήσω αὐτοῦ τὰ ἔργα
  english_pob_choice: I will call attention to the works he is doing
  chosen_korean: 그가 하고 있는 일들을 들춰내겠습니다
  alternatives_korean:
  - 그의 행위를 상기시키겠습니다
  - 그의 행적을 지적하겠습니다
  lexicon: BDAG
  rationale: ὑπομιμνῄσκω는 「상기시키다·기억나게 하다」. 본 문맥에서는 책망의 어조를 띠므로 「들춰내다」가 자연스럽다.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  english_pob_choice: maliciously babbling against us with evil words
  chosen_korean: 악한 말로 우리를 헐뜯어 떠벌리고
  alternatives_korean:
  - 악한 말로 우리에 대해 헛소리를 늘어놓고
  - 악한 말로 우리를 비방하고
  lexicon: BDAG
  rationale: φλυαρέω는 「공허하게·악의적으로 떠벌리다」. 「헐뜯어 떠벌리다」가 비방의 함의와 무책임한 발화를 함께 담는다.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  english_pob_choice: not content with these things
  chosen_korean: 그것으로도 만족하지 못하여
  alternatives_korean:
  - 이런 것들에 만족하지 않고
  - 이것으로 그치지 않고
  lexicon: BDAG
  rationale: ἀρκέω의 「만족하다·충분하다」 의미를 「만족하지 못하여」로 옮긴다.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  english_pob_choice: he himself does not receive the brothers
  chosen_korean: 자기 스스로도 형제들을 받아들이지 않을 뿐만 아니라
  alternatives_korean:
  - 자신도 형제들을 영접하지 않을 뿐 아니라
  lexicon: BDAG
  rationale: 9절의 ἐπιδέχομαι와 일관되게 「받아들이다」로 옮긴다. 강조 αὐτός를 「자기 스스로」로 살린다.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  english_pob_choice: throws them out of the church
  chosen_korean: 교회에서 쫓아냅니다
  alternatives_korean:
  - 교회 밖으로 내쫓습니다
  - 교회에서 추방합니다
  lexicon: BDAG
  rationale: ἐκβάλλω의 강한 추방 함의를 「쫓아내다」로 살린다. 9절과 일관되게 ἐκκλησία를 「교회」로 옮긴다.
