  - severity: low
    issue: «악한 말로 우리를 헐뜯어 떠벌리고»
    rationale: 한국어에서 ‘우리를 떠벌리다’라는 결합은 부자연스럽습니다. 원문의 ἡμᾶς는 비방의 대상이므로 «우리를 두고 악한 말을 늘어놓으며»로 옮기면 뜻과 문법이 분명해집니다.
  - severity: low
