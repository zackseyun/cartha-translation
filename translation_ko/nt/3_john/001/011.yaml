source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved, do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: ko
  text: 사랑하는 이여, 악한 것을 본받지 말고 선한 것을 본받으십시오. 선을 행하는 사람은 하나님에게서 났습니다. 악을 행하는 사람은 하나님을 본 적이 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν
  english_pob_choice: do not imitate what is evil, but what is good
  chosen_korean: 악한 것을 본받지 말고 선한 것을 본받으십시오
  alternatives_korean:
  - 악을 본받지 말고 선을 본받으십시오
  - 나쁜 것을 따라하지 말고 좋은 것을 따라하십시오
  lexicon: BDAG
  rationale: μιμέομαι를 「본받다」로 옮겨 도덕적 모범 따름의 정형을 살린다. 중성 정관사 + 형용사를 「~한 것」으로 자연스럽게 옮긴다.
- source_word: ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν
  english_pob_choice: the one who does good is from God
  chosen_korean: 선을 행하는 자는 하나님께 속한 자요
  alternatives_korean:
  - 선을 행하는 자는 하나님으로부터 났습니다
  - 선을 행하는 자는 하나님께로부터 옵니다
  lexicon: BDAG
  rationale: ἐκ τοῦ θεοῦ εἶναι는 요한 문헌에서 「하나님께 속함·출원함」을 가리키는 정형. 「하나님께 속한 자」로 옮겨 신앙적 정체성을 명시한다.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  english_pob_choice: has not seen God
  chosen_korean: 하나님을 본 적이 없습니다
  alternatives_korean:
  - 하나님을 보지 못했습니다
  - 하나님을 알지 못했습니다
  lexicon: BDAG
  rationale: 완료 ἑώρακεν의 「과거 본 결과 현재 알고 있는 상태」를 「본 적이 없습니다」로 옮긴다. 요한 문헌의 「보다 = 인식·체험하다」 의미장.
