    rationale: δὲ는 앞 절과의 완만한 대조 또는 전환을 표시하므로 ‘그러나’로 반영하는 것이 적절합니다.
  - severity: medium
    issue: ‘일깨움으로 여러분을 분발시키는’은 διεγείρειν과 ἐν ὑπομνήσει의 의미 관계를 흐립니다.
    rationale: διεγείρειν은 ‘일깨우다/각성시키다’이고, ἐν ὑπομνήσει는 그 수단인 ‘상기시킴으로써’입니다. ‘분발시키다’는 원문보다 좁고 해석적인 표현입니다.
  - severity: high
    issue: 각주의 ‘영혼이 잠시 거하는 거처’라는 설명은 원문이 명시하지 않는 해석을 추가합니다.
    rationale: σκήνωμα는 여기서 베드로의 죽을 몸 또는 현세의 육신적 삶을 가리키는 장막 은유입니다. 영혼과 몸의 관계에 관한 특정한 설명을 각주에 삽입해서는 안 됩니다.
