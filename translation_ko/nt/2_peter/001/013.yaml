  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
  footnotes:
  - marker: a
    text: Or 'dwelling' or 'body'; Greek 'tent,' a metaphor for Peter's present mortal life in the body.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 이 장막[a] 안에 있는 동안에는, 여러분에게 상기시켜 여러분을 일깨우는 것이 옳다고 생각합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 ‘장막’은 베드로의 죽을 몸, 곧 현세의 육신적 삶을 가리키는 비유이다.
    reason: lexical_alternative
