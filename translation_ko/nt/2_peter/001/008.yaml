  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus Messiah.
  footnotes:
  - marker: a
    text: Or 'abound.'
    reason: lexical_alternative
  - marker: b
    text: Or 'full knowledge' of our Lord Jesus Messiah.
    reason: lexical_alternative
  - marker: c
    text: Greek 'Jesus Christ'; here rendered 'Jesus Messiah' to preserve the title's meaning.
    reason: alternative_reading
translation:
  language: ko
  text: 이러한 것들이 여러분에게 있고 더욱 풍성해진다면, 그것들은 여러분이 우리 주 예수 메시아를 아는 지식에 있어서 무익하거나 열매 없는 사람이 되지 않게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλεονάζοντα
  english_pob_choice: increasing
  chosen_korean: 점점 풍성해지다
  alternatives_korean:
  - 넘치다
  - 많아지다
  lexicon: BDAG
  rationale: 현재 분사의 진행 의미를 살린다.
- source_word: ἀργοὺς οὐδὲ ἀκάρπους
  english_pob_choice: ineffective or unfruitful
  chosen_korean: 게으르지도 열매 없지도 않게
  alternatives_korean:
  - 쓸모없거나 열매 없지
  lexicon: BDAG
  rationale: ἀργός는 「일하지 않는·쓸모없는」을 뜻하며, 한국어 「게으르다」가 그 무위·무용의 의미를 자연스럽게 전한다.
- source_word: ἐπίγνωσιν
  english_pob_choice: knowledge
  chosen_korean: 참지식
  lexicon: BDAG
  rationale: 1:2, 3과 일관.
