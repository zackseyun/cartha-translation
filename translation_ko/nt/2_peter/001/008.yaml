  to: 이러한 것들이 여러분에게 있고 더욱 풍성해진다면, 그것들은 여러분이 우리 주 예수 메시아를 아는 지식에 있어서 무익하거나 열매 없는 사람이 되지 않게 합니다.
  rationale: 현재분사 ὑπάρχοντα καὶ πλεονάζοντα의 조건적 상황을 ‘있고 더욱 풍성해진다면’으로, καθίστησιν의 결과를 ‘되지 않게 합니다’로 자연스럽게 옮겼습니다. ἀργούς는 문맥상 ‘무익한’으로, ἐπίγνωσιν은 과도한 해석을 피하여 ‘지식’으로 번역했습니다.
