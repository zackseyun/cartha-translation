  source_fidelity: 개정이 필요합니다. 「온갖 힘을 다하여」는 σπουδὴν πᾶσαν의 뜻을 대체로 전달하지만, 「온갖 열심을 기울여」가 '온갖 부지런함/열성을 들여'라는 표현과 παρεισενέγκαντες의 수반 행동을 더 직접적으로 반영합니다. 「더하여 공급하십시오」는 ἐπιχορηγήσατε의 '더하다/넉넉히 마련하다'라는 한 동작을 중복하여 부자연스럽게 만듭니다.
  naturalness: 「믿음에 덕을, 덕에 지식을 더하여 공급하십시오」는 동사 결합이 어색합니다. 한국어에서는 반복되는 연쇄를 「믿음에 덕을 더하고 덕에 지식을 더하십시오」로 표현하는 것이 자연스럽고 명료합니다. 「바로 이 때문에」도 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
  terminology: 「믿음」「덕」「지식」은 각각 πίστις, ἀρετή, γνῶσις에 적절하며 1:3의 「덕」과의 일관성도 유지합니다. ἐπιχορηγέω의 풍성히 보태는 뉘앙스는 본문의 자연스러운 「더하다」와 각주로 함께 보완할 수 있습니다.
