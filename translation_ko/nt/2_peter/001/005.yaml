translation:
  language: ko
  text: 바로 이 때문에, 온갖 열심을 기울여 믿음에 덕을 더하고 덕에 지식을 더하십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헬라어 ἐπιχορηγέω는 「풍성하게 공급하다」 또는 「더하다」를 뜻한다. 여기서는 믿음에 덕을, 덕에 지식을 차례로 더하는 구조이다.
    reason: lexical_alternative
