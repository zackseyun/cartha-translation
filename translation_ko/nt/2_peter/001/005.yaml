  to: 바로 이 때문에, 온갖 열심을 기울여 믿음에 덕을 더하고 덕에 지식을 더하십시오[a].
  rationale: 수반 분사 παρεισενέγκαντες는 「온갖 열심을 기울여」로, 명령형 ἐπιχορηγήσατε는 한국어 연쇄 목록에 자연스러운 「더하고 … 더하십시오」로 옮겼습니다. 이는 ἐν의 반복 구조를 보존하면서도 원문의 한 명령이 두 항목에 걸쳐 적용되는 점을 드러냅니다. 핵심 용어는 유지했으며, 각주는 ἐπιχορηγέω의 풍성히 보태는 뉘앙스와 문맥상 연쇄를 간결하게 설명하도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
