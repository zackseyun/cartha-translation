  source_fidelity: 원문은 Συμεών(시므온)이라고 읽는데, 초안 본문의 「시몬」은 친숙성을 위해 원문 형태를 바꾼 것입니다. 또한 δοῦλος에 관한 각주 표지가 「노예」가 아니라 후행하는 예수 메시아에 붙어 있어, 각주 앵커가 가리키는 말이 잘못되었습니다. 본문에 명시적 동사는 없지만 서신의 수신자 표지라는 문맥에서 「편지합니다」는 한국어의 완결된 합쇼체 문장으로 무리 없이 보충될 수 있습니다.
  naturalness: 「우리와 동등하게 귀한 믿음」도 이해되지만, 「우리의 믿음과 동등하게 귀한 믿음」이 비교 대상과 동등성의 범위를 더 자연스럽고 명료하게 드러냅니다. 「노예이며 사도인」과 「하나님이시며 구주이신」은 현대의 격식 있는 문체에 적절합니다.
