  to: '예수 메시아의 노예[b]이며 사도인 시므온 베드로[a]는 우리 하나님이시며 구주이신 예수 메시아[c]의 의 안에서 우리의 믿음과 동등하게 귀한 믿음을 받은 이들에게 편지합니다:'
