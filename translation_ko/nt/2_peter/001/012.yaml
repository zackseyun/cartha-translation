base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
  footnotes:
  - marker: a
    text: Or 'in the truth you now have.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 여러분이 이런 것들을 알고 현재 여러분에게 있는 진리 안에서 굳게 세워져 있음에도, 나는 언제나 여러분에게 이런 것들을 상기시키겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “현재의 진리 안에서.”
    reason: παρούσῃ는 ‘현재의’로 직역될 수도 있고, 독자들에게 현재 있는/가까이 있는 것으로 이해될 수도 있다. 본문은 후자의 자연스러운 한국어 표현을 사용하되 대안을 보존한다.
