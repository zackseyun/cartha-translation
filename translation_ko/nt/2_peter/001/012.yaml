  rationale: 미래의 결의(μελλήσω), 반복성(ἀεί), 기억나게 함(ὑπομιμνῄσκειν), 그리고 완료 수동의 확립된 상태(ἐστηριγμένους)를 더 정확히 반영하도록 고쳤습니다. ‘현재 여러분에게 있는 진리’와 각주는 παρούσῃ의 의미 범위를 보존하며 특정 교리적 해석을 부과하지 않습니다.
