  source_fidelity: 초안은 Διὸ의 추론, καίπερ의 양보, 그리고 독자들이 이미 알고 굳게 서 있다는 기본 뜻을 대체로 전달합니다. 그러나 μελλήσω의 미래적 결의를 ‘하려 합니다’로 옮기면 현재의 의향으로 약화되며, ἐστηριγμένους의 완료 수동 상태도 ‘굳게 서 있을’보다 ‘굳게 세워져’가 더 충실합니다. παρούσῃ는 단순한 시간적 ‘지금’뿐 아니라 독자들 가운데/에게 현존하는 진리라는 뉘앙스를 지닐 수 있습니다.
  naturalness: ‘일깨우다’는 문맥에 따라 깨닫게 하거나 각성시키는 뜻으로 들릴 수 있어, 이미 알고 있는 내용을 다시 기억하게 한다는 ὑπομιμνῄσκειν에는 ‘상기시키다’가 더 정확하고 현대적 격식체에 자연스럽습니다. 문장 순서를 원문의 진행에 가깝게 조정했습니다.
