review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders τοῦτο πρῶτον γινώσκοντες and προφητεία γραφῆς. However, γίνεται is more directly a statement of how prophecy comes about than a passive assertion that it is not interpreted. Rendering it as ‘해석되지 않습니다’ can be read chiefly as a rule about readers’ interpretive activity.
  naturalness: ‘사사로이 해석되지 않습니다’ is intelligible but somewhat formulaic and permits an unintended reader-interpretation sense. ‘사사로운 해석으로 이루어지는 것이 아닙니다’ is natural modern formal Korean and retains the source’s compact ambiguity concerning ἐπίλυσις.
  terminology: ‘성경의 모든 예언’ appropriately represents προφητεία γραφῆς. ‘사사로운 해석’ preserves the contested/ambiguous force of ἰδίας ἐπιλύσεως without importing a denominational conclusion.
  issues:
  - severity: medium
    issue: ‘해석되지 않습니다’ shifts γίνεται toward passive interpretation.
    rationale: The Greek says that prophecy of Scripture does not γίνεσθαι ‘come about/be’ by ἰδίας ἐπιλύσεως. A Korean expression with ‘해석으로 이루어지다’ better reflects this while not deciding the debated nuance of ἐπίλυσις.
  revised_text: '무엇보다 먼저 이것을 아십시오: 성경의 모든 예언은 사사로운 해석으로 이루어지는 것이 아닙니다.'
