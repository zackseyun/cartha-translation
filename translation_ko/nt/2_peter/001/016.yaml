    issue: παρουσία를 ‘임재’로 확정하고 각주가 변화산과 종말적 재림의 동시 함의를 단정함
    rationale: παρουσία는 임재·도래·오심의 폭을 지니며, 이 절 자체는 변화산 사건이나 재림의 관계를 명시하지 않습니다. 가능한 종말론적 문맥을 번역 본문과 각주에서 확정적으로 해석하지 않는 편이 안전합니다.
  - severity: low
    issue: ‘목격자가 되었기 때문입니다’가 대조적 참여구문을 인과절로 처리함
    rationale: 원문은 ‘신화를 따른 것이 아니라 … 목격자가 되어’라는 대조를 구성합니다. 한국어에서도 대조 구조를 유지하면 논증의 흐름이 더 선명합니다.
