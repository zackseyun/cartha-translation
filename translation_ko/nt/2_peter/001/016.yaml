revisions:
- from: 우리가 우리 주 예수 메시아의 능력과 임재[a]를 여러분에게 알린 것은 교묘하게 꾸민 신화들을 따른 것이 아니라, 그분의 위엄을 직접 본 목격자가 되었기 때문입니다.
  to: 우리는 교묘하게 꾸며 낸 신화들을 따라 여러분에게 메시아이신 우리 주 예수의 능력과 오심[a]을 알린 것이 아닙니다. 오히려 우리는 그분의 위엄을 직접 본 목격자들로서 그것을 알렸습니다.
  rationale: 원문의 부정과 ἀλλά 대조를 두 문장으로 명확히 하고, παρουσία의 해석상 여지를 보존했습니다. 변화산 및 재림에 관한 설명은 본 절이 직접 말하는 범위를 넘어가므로 삭제했습니다. 각주 표지는 본문 ‘오심’에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:38Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 대조는 대체로 반영되었으나, παρουσία를 본문에서 ‘임재’로 확정하고 각주에서 변화산 사건 및 종말적 재림을 ‘함께 함의한다’고 단정한 것은 어휘적 범위와 본문의 직접 진술을 넘습니다. ‘오심’은 영어 POB의 ‘coming’과도 일치하면서 ‘임재/도래’의 가능성을 각주에 보존합니다. 또한 ‘목격자가 되었기 때문입니다’는 원문의 대조적 참여구문을 인과절로 다소 바꾸므로, ‘목격자로서 알렸습니다’로 대조와 증거의 관계를 더 직접 드러냈습니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘우리가 … 알린 것은’ 구문보다 ‘우리는 … 알린 것이 아닙니다. 오히려 … 알렸습니다’가 부정과 대조를 명료하게 전달합니다.
  terminology: σεσοφισμένοις μύθοις는 ‘교묘하게 꾸며 낸 신화들’로, ἐπόπται는 ‘직접 본 목격자들’로 옮겼습니다. Χριστός의 칭호적 의미를 반영하여 ‘메시아’는 유지하되, 자연스러운 한국어 호칭 배열로 ‘메시아이신 우리 주 예수’로 표현했습니다. παρουσία는 교리적으로 특정하지 않고 ‘오심’으로 번역하며 각주에서 ‘임재’와 ‘도래’의 어휘적 가능성을 제시합니다.
