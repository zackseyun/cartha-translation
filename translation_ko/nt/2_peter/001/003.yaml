  source_fidelity: 개정이 필요합니다. 초안은 θείας δυνάμεως, πάντα τὰ πρὸς ζωὴν καὶ εὐσέβειαν, 그리고 διὰ τῆς ἐπιγνώσεως의 기본 의미를 대체로 반영합니다. 그러나 「분을 참지식으로 앎으로써」는 ἐπίγνωσις를 부자연스럽게 중복하여 표현하고, '그분에 대한 지식'이라는 속격 관계를 흐립니다. 또한 ἰδίᾳ δόξῃ καὶ ἀρετῇ의 논쟁적인 여격을 수단으로 본 번역은 가능하지만, 영어 POB의 감사 기록처럼 다른 이해 가능성을 각주로 보존해야 합니다.
  naturalness: 「우리를 자기의 영광과 덕으로 부르신 분에 대한 참지식을 통하여」가 현대 표준 한국어의 합쇼체 문맥에서 더 자연스럽고, 수단 및 대상 관계를 명확히 합니다. 「신적 능력은 ... 주셨습니다」는 문법적으로 자연스럽습니다.
  terminology: 「신적 능력」, 「생명」, 「경건」은 적절합니다. 프로젝트의 1:3과 1:5 일관성 결정에 따라 ἀρετή를 「덕」으로 유지할 수 있습니다. 다만 이 절의 여격구 전체에 관한 대안적 구문 이해를 각주로 제시해야 하므로, 기존의 단순 어휘 대안 각주는 교체하는 것이 적절합니다.
