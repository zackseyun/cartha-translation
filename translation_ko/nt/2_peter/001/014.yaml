  - marker: b
    text: Greek 'Jesus Christ'; rendered 'Jesus Messiah' here because Χριστός is treated as a title.
    reason: alternative_reading
  - marker: c
    text: Or 'is soon'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리 주 예수 메시아께서 내게 분명히 알려 주신 것처럼, 내 장막을 벗을 날이 가까운 것을 알고 있습니다.[c][b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 장막을 벗어 놓는 일’. 베드로는 임박한 죽음을 임시 거처를 벗어 놓는 것으로 비유하여 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘예수 그리스도’입니다. 여기서 Χριστός는 칭호로 쓰였으므로 ‘메시아’로 옮겼습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘곧’.
    reason: previous_rendering
