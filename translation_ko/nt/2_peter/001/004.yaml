- from: 이로써 그분께서는 보배롭고도 지극히 위대한 약속들을 우리에게 주셨으니, 이는 여러분이 이것들을 통하여 정욕으로 인한 세상의 부패를 피하고 신성의 본성에 참여하는 자[a]가 되게 하시려는 것입니다.
  to: 이로써 그분께서는 우리에게 보배롭고 지극히 큰 약속들을 주셨으니, 이는 여러분이 이 약속들을 통하여 정욕으로 말미암아 세상에 있는 부패를 피하여 신적 본성에 참여하는 자가 되게 하시려는 것입니다.
  rationale: 원문의 어순과 목적 관계를 유지하되, θείας φύσεως를 현대 한국어에서 자연스럽고 널리 이해되는 ‘신적 본성’으로 고쳤습니다. ἀποφυγόντες는 ‘피하여’로 옮겨 참여자 됨과 연결된 참여 분사 관계를 보존했습니다. 본문 자체가 의미를 충분히 전달하므로, 교리적 확장을 포함한 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
