  rationale: ‘주와 구주께서 여러분의 사도들을 통하여 주신 명령’으로 다듬어 명령의 궁극적 근원이 주와 구주이며 사도들이 그 전달 통로라는 가장 자연스러운 관계를 한국어로 표현했습니다. 동시에 각주로 다른 속격 연결 가능성을 보존했습니다. ‘미리 말한 말씀’은 예언자들의 발화를 미래 예고에 한정하지 않고 원문의 시간적 의미를 유지합니다.
