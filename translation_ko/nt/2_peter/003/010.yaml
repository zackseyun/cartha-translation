  to: 그러나 주님의 날은 도둑같이 올 것입니다. 그 날에는 하늘이 굉음을 내며 사라지고, 원소들[a]은 불에 타서 풀어질 것이며, 땅과 그 안에 있는 행위들은 발견될 것입니다[b][c].
  rationale: εὑρεθήσεται의 난해한 SBLGNT 독법을 ‘발견될 것입니다’로 직역에 가깝게 보존하고, ‘드러나다’ 계열의 해석과 ‘불타 없어지다’라는 사본 이문을 পৃথ개의 각주로 분리했습니다. στοιχεῖα도 ‘원소들’로 유지하되 각주에서 지시 대상의 불확실성을 보존했습니다.
