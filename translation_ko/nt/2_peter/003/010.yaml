  terminology: ‘주님의 날’, ‘원소들’, ‘땅’은 적절합니다. στοιχεῖα의 지시 대상과 마지막 절의 해석적 가능성 및 사본 변이는 각주에서 분리하여 제시하는 것이 투명합니다.
