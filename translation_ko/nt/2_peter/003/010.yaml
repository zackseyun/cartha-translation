  source_fidelity: 마지막 동사 εὑρεθήσεται의 기본 뜻은 ‘발견되다’인데, 초안의 ‘드러나게 되다’는 가능한 해석을 본문으로 확정합니다. SBLGNT의 어려운 독법을 본문에서 보존해야 합니다. 나머지 절의 순서와 ‘불에 타서 풀어지다’는 원문의 묘사를 적절히 반영합니다.
