    issue: ‘하늘’이 단수로 번역됨
    rationale: οὐρανοὶ는 복수형입니다. 한국어에서는 집합적으로 ‘하늘’이라고도 하지만, 이 창조론적 진술에서는 ‘하늘들이’가 원문의 수를 더 직접적으로 보존합니다.
  - severity: high
    issue: ‘하나님의 말씀으로’의 수식 범위가 하늘의 존재에도 걸림
    rationale: 원문의 τῷ τοῦ θεοῦ λόγῳ는 땅이 물에서 나와 물을 통하여 συνεστῶσα(이루어진/구성된) 것에 문법적으로 연결됩니다. 현재 어순은 하나님의 말씀으로 하늘이 존재하게 되었다는 별도 진술로 읽히게 합니다.
