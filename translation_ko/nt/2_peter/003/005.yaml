  source_fidelity: 개정이 필요합니다. 원문의 복수형 οὐρανοὶ는 ‘하늘들이’로 드러내는 것이 적절하며, τῷ τοῦ θεοῦ λόγῳ는 문법상 ‘하늘들이 있었고’ 전체가 아니라 땅이 물에서 나와 물을 통하여 이루어진 일에 연결됩니다. 현 번역은 ‘하나님의 말씀으로 하늘이 있었고’로 배열되어 그 수식 범위가 달라집니다.
  naturalness: ‘옛적부터’, ‘물에서 나와 물을 통하여 이루어졌으며’는 현대 표준어 합쇼체 문맥에서 자연스럽고, 문장의 미완결 쉼표도 원문의 다음 절 연결을 보존합니다. ‘일부러 외면합니다’는 ‘못 본 체합니다’보다 실제로 이미 알고 있다고 단정하는 뉘앙스를 줄이면서 의지적인 무시를 자연스럽게 나타냅니다.
  terminology: ‘하나님의 말씀’은 λόγος를 인격적 로고스로 과도하게 특정하지 않으면서 원문의 표현을 충실히 옮깁니다. ‘물에서’와 ‘물을 통하여’는 ἐξ와 διά의 구별을 보존합니다.
  issues:
