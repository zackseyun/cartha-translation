review_pass:
  verdict: revise
  source_fidelity: 「재림」은 문맥상 가리키는 바와 부합하지만, παρουσία 자체가 지닌 ‘옴/도래’의 표현을 ‘재(再)’라는 해석으로 한 단계 구체화합니다. 「그분께서 오신다는 약속」은 원문의 ‘그의 오심의 약속’을 더 직접적으로 재현하면서도 문맥상의 종말적 기대를 보존합니다. 또한 ἀπ’ ἀρχῆς κτίσεως는 ‘창조가 시작된 때부터’로 옮기면 시간적 기준점이 더 분명합니다.
  naturalness: 현행문도 이해할 수 있으나, 합쇼체 기준에서 인용문의 「어디 있느냐?」는 「어디 있습니까?」로 고치는 것이 적절합니다. 「창조의 시작부터」보다 「창조가 시작된 때부터」가 현대 한국어에서 자연스럽고, 두 시간 표현의 관계도 명료합니다.
  terminology: παρουσία는 본문에서 「오심」으로 번역하고, 각주에서 ‘도래/임재’의 어휘 가능성과 문맥상 미래의 그리스도 오심을 설명합니다. κοιμάομαι의 죽음 완곡 표현은 「잠들다」로 보존하며, 이에 해당하는 각주 앵커도 보완합니다. ‘헬라어’ 대신 현대 학술·표준 용례인 ‘그리스어’를 사용합니다.
  issues:
  - severity: medium
    issue: 본문의 「재림」이 παρουσία의 어휘적 표현을 구체화함
    rationale: 문맥은 그리스도의 미래 오심을 가리키지만, 원문과 영어 감사 기록은 παρουσία를 ‘coming’으로 두고 있습니다. 「그분께서 오신다는 약속」은 문맥을 훼손하지 않으면서 ‘재-’라는 추가 명시를 피합니다.
  - severity: low
    issue: 인용문의 종결 표현이 목표 합쇼체와 불일치함
    rationale: 「어디 있느냐?」는 해라체입니다. 번역의 지정된 현대 공식-공손 문체에 맞추어 「어디 있습니까?」로 조정하는 것이 안전합니다.
  - severity: low
    issue: ‘잠든’에 대응하는 죽음 완곡 표현 각주 앵커가 없음
    rationale: 영어 POB 감사 기록의 b 각주와 원문의 완곡 표현을 반영하기 위해 각주를 추가하는 것이 어휘 선택과 독자 이해에 도움이 됩니다.
  revised_text: 그들은 이렇게 말합니다. 「그분께서 오신다는 약속이 어디 있습니까? 조상들이 잠든 이래로 모든 것이 창조가 시작된 때부터 그대로 계속되고 있습니다.」
  revised_footnotes:
  - marker: a
    text: 그리스어 파루시아(παρουσία)는 ‘임재’, ‘도래’ 또는 ‘오심’을 뜻할 수 있습니다. 이 문맥에서는 그리스도의 미래 오심을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘잠들다’는 죽음을 완곡하게 이르는 그리스어 표현입니다.
    reason: lexical_alternative
  revision_rationale: 원문의 현재분사 λέγοντες는 「그들은 이렇게 말합니다」로 자연스럽게 연결했습니다. παρουσία는 문맥의 종말론적 의미를 각주에서 밝혀 두되, 본문에서는 원문의 표현 범위를 더 직접적으로 보존하는 「오신다는」으로 번역했습니다. ἐκοιμήθησαν의 비유는 유지하고, ἀπ’ ἀρχῆς κτίσεως의 시간적 의미를 명료하게 했습니다.
