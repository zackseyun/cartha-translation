  revised_footnotes:
  - marker: a
    text: 헬라어 παρουσία는 「임재」「도래」「오심」을 뜻할 수 있다. 이 문맥에서는 그리스도의 미래의 오심, 곧 재림을 가리킨다.
    reason: lexical_alternative
  - marker: b
    text: 「잠든」은 죽음을 가리키는 헬라어의 완곡한 표현이다.
    reason: lexical_alternative
  revision_rationale: 문맥상 종말론적 기대를 유지하되, 본문은 παρουσία의 표현 폭을 보존하는 「오심」으로 옮겼습니다. 접속된 분사 λέγοντες를 「또 이렇게 말합니다」로 반영했고, 죽음의 완곡 표현 「잠든」에 해당 각주를 추가했습니다. 나머지 표현은 원문의 시간적 주장과 포괄적 범위를 자연스러운 합쇼체로 유지합니다.
