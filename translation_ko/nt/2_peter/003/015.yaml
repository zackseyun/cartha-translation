translation:
  language: ko
  text: 그리고 우리 주님의 오래 참으심을 구원으로 여기십시오.[a] 우리의 사랑하는 형제 바울도 그에게 주어진 지혜를 따라 여러분에게 썼습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘관용’. 여기서는 주님의 지연이 무관심 때문이 아니라 구원을 위한 것이라는 뜻입니다.
    reason: lexical_alternative
