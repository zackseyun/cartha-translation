  to: 그는 자신의 모든 편지에서도 이 일들에 관하여 말합니다. 그 편지들에는 이해하기 어려운 부분들이 더러 있는데, 무지하고 확고하지 못한 사람들이 나머지 성경들도 왜곡하듯이 그것들을 왜곡하여 자기들의 멸망을 자초합니다.
  rationale: The revision preserves the source’s two-part structure, identifies the letters as the location of the difficult material, and retains the comparison with the rest of the Scriptures. “멸망을 자초합니다” naturally expresses the result denoted by πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν without adding a technical theological sense.
