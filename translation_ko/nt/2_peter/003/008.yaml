    rationale: 각주는 시편 90:4의 반영을 간결하게 밝혀야 하며, κύριος를 YHWH로 단정하는 정책 설명은 본문 충실성에 필요한 주석이 아닙니다.
  - severity: low
    issue: 「잊지 마십시오」의 의미 범위
    rationale: 자연스럽지만 λανθανέτω의 ‘주의에서 벗어나다’에 비해 기억 상실의 뉘앙스가 강할 수 있습니다. 「놓치지 마십시오」가 원문에 더 가깝습니다.
