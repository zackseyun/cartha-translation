    issue: κύριος를 「야훼」로 단정함
    rationale: 시편 90:4의 반영은 각주로 제시할 수 있으나, 본문의 κύριος가 누구를 가리키는지를 번역문에서 YHWH로 확정하는 것은 원문의 지시 범위와 해석상 여지를 좁힙니다. 영어 POB도 「the Lord」로 유지합니다.
  - severity: low
