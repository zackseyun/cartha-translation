  naturalness: 「하나님의 날의 도래를 고대하고 또 앞당기며」는 한국어에서 자연스럽고, 앞 절과 연결되는 분사적 흐름도 유지합니다. 「그 날 때문에」는 δι’ ἣν의 인과 관계를 간결하게 드러내며, 「불에 타 풀어지고 … 불타 녹을 것입니다」는 종말론적 묘사를 과도하게 해석하지 않고 자연스럽게 전달합니다.
