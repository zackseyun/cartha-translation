  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἀγαπητοί의 호격은 ‘사랑하는 여러분’이 현대 한국어에서 더 자연스럽고, τοῦ ἰδίου στηριγμοῦ는 ‘자신의 굳건함에서 떨어지다’보다 확고한 자리/상태의 비유를 살려 표현하는 편이 명료합니다. συναπαχθέντες의 ‘함께 휩쓸려’는 복합동사의 동반·수동 뉘앙스를 잘 반영합니다.
  naturalness: ‘사랑하는 자들이여’와 ‘스스로 지키십시오’는 현대 합쇼체 성경 문장으로 다소 어색합니다. ‘사랑하는 여러분’ 및 ‘여러분 자신을 지키십시오’가 자연스럽고, 목적절의 수식 관계도 더 분명해집니다.
  terminology: ‘무법한 자들’, ‘미혹’, ‘함께 휩쓸려’는 적절합니다. στηριγμός은 ‘굳건함’도 가능하나, 이 문맥에서는 ‘굳건한 자리’가 ἐκπέσητε(떨어지다)의 공간적 비유와 더 자연스럽게 연결됩니다. 구원 상실이나 배교라는 교리적 해석은 본문에 추가하지 않았습니다.
  issues:
  - severity: low
    issue: 호격 ‘사랑하는 자들이여’
    rationale: ἀγαπητοί를 옮길 수는 있으나, 현대 표준어 합쇼체에서는 ‘사랑하는 여러분’이 더 자연스럽고 목회 서신의 따뜻한 호격을 잘 전달합니다.
  - severity: medium
