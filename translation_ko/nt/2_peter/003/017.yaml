    rationale: φυλάσσεσθε의 재귀 의미는 ‘여러분 자신을 지키십시오’로 명확히 하고, στηριγμός과 ἐκπέσητε의 비유는 ‘자신의 굳건한 자리에서 떨어지지 않도록’으로 연결하는 것이 자연스럽습니다.
