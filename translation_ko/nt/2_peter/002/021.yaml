  source_fidelity: 핵심 비교 구조와 ‘의의 길,’ ‘거룩한 계명’은 원문에 충실합니다. 다만 ὑποστρέψαι는 이미 알게 된 뒤 그 계명으로부터 되돌아서는 움직임을 나타내므로, ‘등지다’보다 ‘돌아서다’가 원문의 방향성과 문맥상의 이탈을 더 직접적으로 드러냅니다. παραδοθείσης는 여기서 ‘전수된’도 가능하지만, 특정 전통의 기술어로 들릴 수 있어 ‘전해진’이 더 중립적이고 자연스럽습니다.
  naturalness: 합쇼체 문장과 비교 구문은 자연스럽습니다. ‘그들에게는’과 ‘자기들에게’의 반복을 ‘그들에게’로 통일하고, ‘전해진 거룩한 계명에서 돌아서는 것’으로 표현하면 현대 표준어에서 더 매끄럽습니다.
  terminology: ‘의의 길’과 ‘거룩한 계명’은 적절합니다. ‘전해진’은 παραδίδωμι의 수동 의미를 유지하면서도 불필요하게 전통-기술어적 뉘앙스를 부여하지 않습니다.
