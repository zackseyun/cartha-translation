source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
  footnotes:
  - marker: a
    text: 'Or: "cast them into hell." The Greek verb specifically means to consign to Tartarus, so the main text preserves that more exact term.'
    reason: lexical_alternative
  - marker: b
    text: Some manuscripts read "pits of gloom/darkness" instead of "chains of gloom."
    reason: textual_variant
translation:
  language: ko
  text: 하나님께서 죄를 지은 천사들을 아끼지 않으시고 타르타로스에 던지시며[a] 흑암의 사슬에 넘기시어 심판을 위하여 지키게 하셨다면,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지옥에 던지시며’. 헬라어 동사는 특별히 타르타로스에 넘긴다는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본에는 ‘흑암의 사슬’ 대신 ‘흑암의 구덩이들’이라고 되어 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ταρταρώσας
  english_pob_choice: cast them into Tartarus
  chosen_korean: 지옥(타르타로스)에 가두다
  alternatives_korean:
  - 타르타로스로 던지다
  - 지옥에 던지다
  lexicon: BDAG
  rationale: 신약 유일례. 헬라 사상의 타르타로스(지하 깊은 곳)를 직접 옮기되, 한국 독자를 위해 「지옥」을 본문에 두고 원어를 괄호로 보존.
- source_word: σειραῖς ζόφου
  english_pob_choice: chains of gloom
  chosen_korean: 흑암의 사슬
  alternatives_korean:
  - 어둠의 사슬
  lexicon: BDAG
  rationale: ζόφος는 깊고 짙은 어둠.
- source_word: οὐκ ἐφείσατο
  english_pob_choice: did not spare
  chosen_korean: 아끼지 아니하다
  lexicon: BDAG
  rationale: 표준 등가어.
