  source_fidelity: 초안은 ἀρχαίου κόσμου, δικαιοσύνης κήρυκα, ἀσεβῶν을 대체로 충실하게 옮겼습니다. 그러나 ὄγδοον Νῶε의 압축적이고 논쟁 가능한 표현을 본문에서 '일곱 사람과 함께'라고 해석적으로 확정하고, 각주도 이를 단정합니다. 또한 '보존하시면서 ... 내리셨으며'는 ἐφύλαξεν(주동사)과 ἐπάξας(분사)의 문법적 관계를 한국어에서 다소 흐립니다.
  naturalness: '''의의 선포자인 노아''와 ''불경건한 자들의 세상''은 현대 표준어 합쇼체 문맥에서 자연스럽습니다. ''여덟째 사람으로''는 다소 압축적이지만 원문의 의도적인 압축성과 모호성을 보존하는 안전한 표현입니다. ''홍수를 내리실 때''는 분사의 시간 관계를 자연스럽게 표현합니다.'
  terminology: '''의'', ''선포자'', ''불경건한 자들'', ''홍수''는 각각 δικαιοσύνη, κῆρυξ, ἀσεβῶν, κατακλυσμός에 적절합니다. ''선포자''는 κῆρυξ의 공적 선언 의미를 보존하며 특정 교파적 용어를 강요하지 않습니다.'
