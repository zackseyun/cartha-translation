    issue: 본문이 ὄγδοον Νῶε를 ‘일곱 사람과 함께’로 확정함
    rationale: 이 표현은 ‘여덟째 노아’ 또는 노아를 포함한 여덟 사람 가운데 하나라는 뜻으로 이해될 수 있는 압축 표현입니다. ‘일곱 사람과 함께’는 후자의 해석을 본문에 확정적으로 삽입하므로, 본문에서는 원문의 표현을 더 가깝게 보존하고 각주에서 설명해야 합니다.
  - severity: low
    issue: ‘보존하시면서’가 홍수를 내린 행위와 보존의 문법적 관계를 흐림
    rationale: ἐπάξας는 ‘홍수를 내리신 때에/내리시고’라는 분사로 ἐφύλαξεν에 연결됩니다. 시간 관계를 명시하면 한국어 문장이 더 명료해집니다.
  revised_text: 옛 세상도 아끼지 않으시고, 불경건한 자들의 세상에 홍수를 내리실 때 의의 선포자인 노아를 여덟째 사람으로[a] 보존하셨으며,
