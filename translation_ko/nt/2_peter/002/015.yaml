  source_fidelity: 본문의 「브올」은 SBLGNT의 Βοσόρ(보솔)를 따르지 않아 수정이 필요합니다. 또한 「미혹되어」는 외부의 기만을 더 강하게 암시할 수 있으므로, 여기서 도덕적·비유적 일탈을 나타내는 ἐπλανήθησαν에는 「길을 잃었습니다」가 더 적절합니다.
  naturalness: 「바른 길을 버리고 … 길을 잃었습니다」는 길의 비유를 자연스럽게 유지하며, 「발람의 길을 따라」는 ἐξακολουθήσαντες의 수단적 관계를 한국어로 매끄럽게 드러냅니다. 합쇼체에도 맞습니다.
  terminology: εὐθεῖαν ὁδόν은 「바른 길」로, μισθὸν ἀδικίας는 「불의의 대가」로 옮겨 원문의 윤리적 표현과 성경적 문체를 보존했습니다. Βοσόρ는 본문에서 「보솔」로 음역하고, 익숙한 구약 형태 「브올」은 각주에 제시합니다.
