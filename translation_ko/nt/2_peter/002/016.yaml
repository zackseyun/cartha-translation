revisions:
- from: 그러나 그는 자기의 잘못으로 인하여 책망을 받았으니, 말 못하는 짐승이 사람의 음성으로 말함으로써 그 예언자의 광기를 막았던 것입니다.
  to: 그러나 그는 자신의 불법에 대하여 책망을 받았습니다. 짐을 나르는 말 못 하는 짐승이 사람의 음성으로 말하여 그 예언자의 광기를 제지했습니다.[a][b]
  rationale: 원문의 법적·도덕적 비난의 강도를 ‘불법’으로 회복하고, ὑποζύγιον의 일반적이면서도 구체적인 ‘짐을 나르는 짐승’이라는 뜻을 보존했습니다. 역사적 배경상 나귀임을 본문에 삽입하지 않고 각주로 처리하여 원문의 표현 범위를 유지했습니다. 두 개의 과거 사건은 현대 합쇼체 서술에 맞게 ‘받았습니다/제지했습니다’로 옮겼습니다.
