review_pass:
  verdict: revise
  source_fidelity: ‘잘못’은 παρανομία의 법을 거스르는 행위라는 강한 뜻을 약화합니다. 또한 ‘말 못하는 짐승’은 ὑποζύγιον의 짐을 나르는 짐승이라는 뜻을 충분히 드러내지 못합니다. ‘불법’과 ‘짐을 나르는 짐승’으로 옮기면 원문의 범위와 강조를 더 충실히 보존합니다. ‘사람의 음성으로 말하여’와 ‘예언자의 광기’는 각각 ἐν ἀνθρώπου φωνῇ φθεγξάμενον 및 παραφρονίαν을 적절히 반영합니다.
  naturalness: 현대 표준어 합쇼체로 ‘자신의 불법에 대하여 책망을 받았습니다’ 및 ‘제지했습니다’가 명료하고 자연스럽습니다. ‘짐을 나르는 말 못 하는 짐승’은 다소 설명적이지만, 원문의 일반적 표현을 ‘나귀’로 과도하게 특정하지 않으면서 ὑποζύγιον을 자연스럽게 살립니다.
  terminology: παρανομία는 ‘잘못’보다 ‘불법’이 적절합니다. ὑποζύγιον은 본문에서 ‘짐을 나르는 짐승’으로 유지하고, 발람의 나귀라는 역사적 지시는 각주에서만 밝힙니다. ἄνθρωπος는 동물과 대비되는 인간을 뜻하므로 ‘사람의 음성’이 적절합니다.
  issues:
