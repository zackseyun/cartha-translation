  - severity: medium
    issue: ‘말 못하는 짐승’이 ὑποζύγιον의 의미를 축소함
    rationale: ὑποζύγιον은 일반적인 짐승이 아니라 멍에를 지거나 짐을 나르는 짐승을 뜻합니다. 본문에서 ‘나귀’로 한정하지 않되 이 의미는 드러내야 합니다.
  - severity: low
    issue: 영어 POB 감사 추적의 각주 정보가 한국어 본문에 반영되지 않음
    rationale: 발람의 나귀라는 배경 및 ‘사람의 음성’의 대안적 표현을 각주로 제공하면 본문의 일반성을 보존하면서 독자의 이해를 돕습니다.
