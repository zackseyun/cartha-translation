  source_fidelity: 핵심 의미와 SBLGNT의 ἀπάταις(‘속임수’) 본문은 정확히 반영되었습니다. 다만 ἀδικούμενοι는 문맥상 불의에 대한 보응을 겪는다는 뜻이므로 ‘대가를 받으며’보다 ‘대가를 치르며’가 부정적 보응의 뉘앙스를 더 분명히 드러냅니다.
  naturalness: ‘대낮의 향락을 쾌락으로 여깁니다’는 원문의 병행 표현을 따르지만 한국어로는 다소 중복되고 어색합니다. 또한 ‘얼룩이요 흠으로서’와 ‘속임수 가운데 흥청거립니다’는 현대 표준어 문장 흐름상 부자연스럽습니다.
  terminology: ‘불의’, ‘향락’, ‘오점과 흠’, ‘속임수’는 문맥과 현대 격식체에 적절합니다. ἀπάταις/ἀγάπαις의 본문 선택과 이문 주석도 적절합니다.
  issues:
