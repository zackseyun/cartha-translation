    issue: ‘대낮의 향락을 쾌락으로’라는 표현
    rationale: ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν의 의미는 보존하되, 한국어에서는 ‘대낮에 향락을 누리는 것을 즐거움으로’라고 옮기는 편이 자연스럽습니다.
  - severity: low
    issue: ‘얼룩이요 흠으로서’ 및 ‘속임수 가운데’
    rationale: 스πίλοι καὶ μῶμοι는 서술적으로 ‘오점과 흠입니다’라고 하는 것이 자연스럽고, ἐν ταῖς ἀπάταις αὐτῶν은 ‘자기들의 속임수 속에서’가 현대 한국어에 더 맞습니다.
