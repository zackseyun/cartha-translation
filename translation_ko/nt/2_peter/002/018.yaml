review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘허영의 부풀린 말’은 ματαιότητος가 말의 성격·내용이 공허함을 나타내는 용법을 한국어에서 부자연스럽게 처리합니다. 또한 ἀσελγείαις는 단순한 성적 ‘음란’보다 절제 없는 방탕한 행실을 포괄하므로 ‘방탕’이 더 적절합니다.
  naturalness: ‘허영의 부풀린 말’과 ‘미혹 가운데 사는 자들에게서’는 문어적으로 다소 어색하거나 일시적으로 수식 관계가 불분명합니다. ‘공허하고 과장된 말’, ‘미혹 가운데 살아가는 사람들에게서’로 하면 현대 표준어 합쇼체에서 자연스럽고 의미도 분명합니다.
  terminology: σάρξ의 비유적 도덕 의미를 ‘육체의’로 유지하여 과도하게 교리화하지 않았습니다. ἀσελγεία는 ‘방탕’으로 옮겨 성적 의미에만 한정하지 않고 원문의 폭을 보존합니다.
  issues:
  - severity: medium
    issue: ‘허영의 부풀린 말’이라는 표현
    rationale: ματαιότης는 여기서 말이 공허하고 실질이 없음을 나타냅니다. ‘허영의’는 의미상 가능하나 한국어에서는 뒤의 ‘부풀린 말’과의 관계가 어색하며, 원문의 수사적 성격도 충분히 드러나지 않습니다.
  - severity: low
    issue: ἀσελγείαις를 ‘음란’으로 한정함
    rationale: ἀσέλγεια는 음란성을 포함하지만 더 넓게는 방종·무절제·방탕한 행실을 뜻합니다. ‘방탕’이 문맥과 어휘 범위를 더 잘 반영합니다.
  - severity: low
    issue: ‘미혹 가운데 사는 자들에게서’의 어색한 연결
    rationale: 원문의 ‘그릇됨 가운데 살아가는 이들에게서 벗어나는 이들’이라는 대상을 명확히 하도록 ‘살아가는 사람들에게서’가 더 자연스럽습니다.
  revised_text: 그들은 공허하고 과장된 말을 늘어놓으며, 육체의 정욕과 방탕으로 미혹 가운데 살아가는 사람들에게서 가까스로 벗어나고 있는 이들을 유혹합니다.
