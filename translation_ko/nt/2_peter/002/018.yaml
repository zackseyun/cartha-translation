- from: 그들은 허영의 부풀린 말을 내뱉으면서, 미혹 가운데 사는 자들에게서 가까스로 벗어나는 자들을 육체의 정욕과 음란으로 유혹합니다.
  to: 그들은 공허하고 과장된 말을 늘어놓으며, 육체의 정욕과 방탕으로 미혹 가운데 살아가는 사람들에게서 가까스로 벗어나고 있는 이들을 유혹합니다.
  rationale: φθεγγόμενοι의 지속적인 발화를 ‘말을 늘어놓으며’로, ὑπέρογκα ματαιότητος를 ‘공허하고 과장된 말’로 자연스럽게 옮겼습니다. ὀλίγως ἀποφεύγοντας의 불안정하고 진행 중인 상태는 ‘가까스로 벗어나고 있는’으로 보존했습니다. ‘방탕’은 ἀσελγείαις의 포괄적 의미를 유지하며, ‘육체의’는 σάρξ의 은유를 교리적으로 과도하게 해석하지 않습니다.
