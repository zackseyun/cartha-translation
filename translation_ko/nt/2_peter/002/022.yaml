  source_fidelity: 개정이 필요합니다. 「참된 속담에 이른 말」은 한국어 문법과 관용에 맞지 않으며, τὸ τῆς ἀληθοῦς παροιμίας의 타원적 표현을 자연스럽게 전달하지 못합니다. 또한 δεύτε 구절의 「다시」는 그리스어 본문에 명시되어 있지 않으므로 넣지 않는 편이 안전합니다. 개정문은 συμβέβηκεν의 완료상 결과를 「일어났습니다」로, 두 속담의 적용을 자연스럽게 보존합니다.
  naturalness: 「참된 속담의 말이 그들에게 일어났습니다」는 현대 표준 한국어에서 자연스럽고, 인용문도 속담체로 무리 없이 읽힙니다. 「자기가 토한 것으로 돌아가고」는 ἐπὶ τὸ ἴδιον ἐξέραμα의 ‘자기 자신의 토사물로/위로 돌아감’을 자연스럽게 나타냅니다.
  terminology: παροιμία는 「속담」이 적절합니다. βόρβορος와 κυλισμός은 「진창에서 뒹군다」로 자연스럽고 충분히 생생하게 옮겼습니다. ὗς의 암컷 뉘앙스는 한국어 「돼지」만으로는 드러나지 않지만, 본문에서 이를 위해 부자연스러운 「암퇘지」를 강제할 필요는 없습니다.
  issues:
