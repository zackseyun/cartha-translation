    rationale: τὸ τῆς ἀληθοῦς παροιμίας는 직역적으로 ‘참된 속담의 말/내용’이며, 한국어로는 「참된 속담의 말」 또는 「참된 속담에서 말한 바」가 자연스럽습니다.
