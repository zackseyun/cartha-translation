    rationale: 개가 ‘돌아감’은 ἐπιστρέψας에 있으나, 씻은 돼지의 구절에는 πάλιν/다시 같은 부사가 없습니다. 속담의 함의로 이해될 수 있어도 번역 본문에는 추가하지 않는 것이 좋습니다.
