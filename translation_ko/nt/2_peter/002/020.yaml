  source_fidelity: 개정이 필요합니다. 초안의 ‘참지식’은 ἐπίγνωσις의 어휘적 뉘앙스를 지나치게 확정하며, ‘제압당한다’에 해당하는 ἡττῶνται가 빠져 있습니다. 또한 조건절의 ‘피한 뒤’와 완료 시제의 결과를 반영할 필요가 있습니다.
