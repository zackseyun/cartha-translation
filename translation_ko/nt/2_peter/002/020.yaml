  - severity: high
    issue: ἡττῶνται의 의미 누락
    rationale: 초안의 ‘다시 그것들에 얽혀 지면’은 ‘다시 얽히다’와 ‘제압당하다’라는 두 술어를 충분히 구별해 반영하지 못하며, ‘지면’은 문법적으로도 조건 연결이 부자연스럽습니다.
