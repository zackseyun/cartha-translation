translation:
  language: ko
  text: 특히 더러운 정욕을 따라 육체를 좇으며 권위를 멸시하는 자들에 대해서는 더욱 그러합니다. 그들은 무모하고 독단적이며, 영광스러운 자들[a]을 모독하면서도 두려워하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
