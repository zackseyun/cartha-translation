base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
  footnotes:
  - marker: a
    text: Or 'unreasoning animals.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'born natural'; the phrase means creatures governed by instinct or nature.
    reason: lexical_alternative
  - marker: c
    text: Or 'reviling about things they do not know.'
    reason: lexical_alternative
  - marker: d
    text: The Greek repeats related words for 'destruction'/'be destroyed,' preserving a wordplay between ruin and perishing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이 사람들은 본능을 따라 포획되고 멸망하도록 태어난 이성 없는 짐승과 같아서, 자신들이 알지 못하는 것들을 모독하며, 그들의 멸망 가운데서 그들도 멸망할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분별 없는 짐승’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘본성적으로 태어난’입니다. 여기서는 이성보다는 본능의 지배를 받는 피조물이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자신들이 알지 못하는 일들에 대하여 헐뜯으며’.
    reason: lexical_alternative
  - marker: d
    text: 그리스어는 ‘멸망’과 ‘멸망할 것이다’에 관련된 같은 어근을 반복합니다.
    reason: lexical_alternative
