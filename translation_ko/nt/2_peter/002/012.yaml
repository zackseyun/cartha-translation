  source_fidelity: 원문의 비유 구조와 핵심 어휘는 대체로 반영했으나, 현행문의 ‘그 짐승들의 멸망’은 αὐτῶν(그들의)을 짐승들에게 연결하여 지시 대상을 바꿉니다. 이는 비방하는 ‘이 사람들’ 자신이 멸망한다는 원문의 경고와 반복 어법을 흐립니다.
