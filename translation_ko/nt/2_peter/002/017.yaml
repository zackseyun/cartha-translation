  source_fidelity: 원문의 두 비유와 심판의 비인칭 수동 표현은 초안에 대체로 충실합니다. 다만 ζόφος τοῦ σκότους의 강조적 중첩은 ‘흑암의 어둠’보다 ‘어둠의 암흑’이 한국어에서 조금 더 명료하게 살아납니다. SBLGNT의 비평 괄호는 ‘καὶ ὁμίχλαι’의 본문상 불확실성을 나타내므로 이를 각주로 밝혀야 합니다.
  naturalness: ‘광풍에 밀려가는 안개로서’도 이해되지만, ‘폭풍에 밀려가는 안개입니다’가 현대 표준어 합쇼체에서 더 자연스럽고 문장 구조가 분명합니다.
  terminology: ‘물 없는 샘’은 πηγαὶ ἄνυδροι의 역설을 잘 보존합니다. ‘폭풍’은 λαῖλαψ의 격렬한 폭풍이라는 뜻을 자연스럽게 전달하며, ‘어둠의 암흑’은 ζόφος와 σκότος의 중첩을 유지합니다. ‘예비되어 있습니다’는 τετήρηται의 완료 수동 및 심판 맥락의 ‘보류되어 있음’을 적절히 전달합니다.
  issues:
