review_pass:
  verdict: revise
  source_fidelity: 핵심 비유와 마지막 절의 수동 완료 표현은 대체로 충실합니다. 다만 λαῖλαψ는 일반적으로 강한 폭풍을 가리키므로 ‘광풍’보다 ‘폭풍’이 더 직접적이며, ζόφος τοῦ σκότους의 강조된 어둠은 ‘흑암의 어둠’보다 현대 표준어에서 자연스러운 ‘캄캄한 어둠’으로 옮기는 편이 적절합니다.
  naturalness: ‘이들은 … 샘이요, … 안개로서’는 문법상 가능하지만 현대 합쇼체 성경 문체로는 병렬 서술을 분명히 한 ‘샘이며, … 안개입니다’가 더 자연스럽습니다. ‘폭풍에 몰려가는’은 수동으로 내몰리는 참여사의 뜻을 자연스럽게 드러냅니다.
  terminology: ‘물 없는 샘’은 πηγαὶ ἄνυδροι를 정확히 반영합니다. ‘안개’는 ὁμίχλαι에 적합하며, ‘그들을 위하여’는 비유적 여성 복수 명사가 아니라 거짓 교사들을 가리키는 οἷς의 인칭 지시를 보존합니다. ‘예비되어 있습니다’는 τετήρηται의 완료 수동과 비인칭적 심판 진술을 유지합니다.
  issues:
  - severity: low
    issue: ‘광풍에 밀려가는’
    rationale: λαῖλαψ의 폭풍성을 ‘폭풍’으로, ἐλαυνόμεναι의 내몰림을 ‘몰려가는’으로 표현하면 더 직접적이고 자연스럽습니다.
  - severity: medium
    issue: ‘흑암의 어둠’
    rationale: 원문의 두 어둠 어휘가 만드는 강조는 보존하려 하나, 이 표현은 현대 한국어에서 다소 부자연스럽고 의미상 중복이 두드러집니다. ‘캄캄한 어둠’은 강조를 자연스럽게 전달합니다.
  revised_text: 이들은 물 없는 샘이며, 폭풍에 몰려가는 안개입니다. 그들을 위하여 캄캄한 어둠이 예비되어 있습니다.
  revised_footnotes: []
  revision_rationale: 원문의 두 비유를 자연스러운 현대 합쇼체 병렬문으로 정리하고, 폭풍에 의해 내몰리는 안개의 수동적 이미지를 유지했습니다. 마지막 절은 심판의 주체를 추가하지 않고, 어둠의 강조와 완료 수동의 의미를 보존했습니다.
