  - severity: medium
    issue: 비평 괄호로 표시된 ‘그리고 안개들’의 본문상 불확실성에 대한 각주 부재
    rationale: SBLGNT는 καὶ ὁμίχλαι를 비평 괄호로 표시합니다. 번역에 이 구절을 포함할 경우, 일부 사본의 생략 가능성을 각주로 알려 독자가 본문 불확실성을 인지하도록 해야 합니다.
