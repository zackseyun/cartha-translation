source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
  footnotes:
  - marker: a
    text: Or 'a blasphemous judgment' or 'a reviling judgment.' The Greek adjective can denote abusive, reviling, or slanderous speech.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'them' likely refers back to the 'glorious ones' in the previous verse, but Peter does not identify them more explicitly here.
    reason: alternative_reading
translation:
  language: ko
  text: 반면에 천사들은 힘과 능력에서 더 뛰어나지만, 그들을 거슬러 모욕적인[a] 판결을 내리지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비방하는’ 또는 ‘신성모독적인’. 그리스어 형용사는 모욕적이거나 비방하는 말을, 경우에 따라 신성을 모독하는 말을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들’은 앞 절의 ‘영광스러운 존재들’을 가리킬 가능성이 크지만, 베드로는 여기서 그들을 더 구체적으로 밝히지 않습니다.
    reason: alternative_reading
