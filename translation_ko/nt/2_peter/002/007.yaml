  source_fidelity: 그리스어의 수동 현재분사 καταπονούμενον은 지속적으로 가해지는 압박·고통을 나타내며, ‘시달리고 있던’이 이를 자연스럽게 반영합니다. ἀναστροφή는 ‘행실’로, ἐν ἀσελγείᾳ는 그 행실의 성격을 나타내는 ‘방탕한’으로 옮기는 것이 적절합니다. καὶ도 ‘또한’으로 반영했습니다.
  naturalness: 현 초안은 ‘의로운 롯은’으로 화제를 제시한 뒤 목적격 대명사 ‘그를’로 다시 받기 때문에 문장 구조가 부자연스럽습니다. 롯을 처음부터 목적어로 두면 한국어 문장이 자연스럽고 원문의 구문도 잘 드러납니다.
  terminology: ‘무법한 자들’은 ἀθέσμων의 법·도덕 질서 무시라는 뉘앙스를 보존합니다. ‘음란한’은 성적 의미로 다소 좁게 읽힐 수 있으므로, 수치 없는 방종 전반을 가리키는 ἀσέλγεια에는 ‘방탕한’이 더 포괄적입니다. δίκαιον Λὼτ은 ‘의로운 롯’으로 유지했습니다.
