  source_fidelity: 핵심 구조는 잘 반영했으나, 「가두어 두실」은 τηρεῖν(지키다·보존하다·유보하다)에 물리적 감금을 덧붙입니다. 또한 κολαζομένους의 현재적 형벌 상태는 「형벌 아래 두실」로 더 직접적이고 과도한 함의 없이 옮길 수 있습니다.
  naturalness: 「형벌 아래 가두어 두다」는 이 문맥에서 다소 부자연스럽고 뜻을 좁힙니다. 종결의 대시(—)도 문장부호로 불필요합니다. 수정문은 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: 「주님」, 「경건한 사람들」, 「시험」, 「불의한 사람들」, 「심판의 날」은 적절합니다. πειρασμός의 다른 가능성(유혹)과 κολαζομένους/εἰς 구문의 해석상 여지는 각주로 보존하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 「가두어 두실」이 τηρεῖν에 물리적 감금의 의미를 추가합니다.
    rationale: τηρεῖν은 여기서 불의한 이들을 심판의 날을 향해 보존·유지한다는 뜻이며, 감금 장소나 방식은 본문이 명시하지 않습니다.
  - severity: low
    issue: κόλαζομένους의 현재 분사와 πειρασμός의 어휘적 여지가 각주 없이 평면화됩니다.
    rationale: 본문은 형벌을 받는 상태라는 읽기를 자연스럽게 지지하지만, 심판의 날의 형벌로 읽는 구문적 가능성도 있으며, 「시험」에는 「유혹」의 가능성이 있습니다.
  - severity: low
    issue: 문장 끝의 대시가 불필요합니다.
    rationale: 한국어 성경 본문에서 문장을 미완처럼 보이게 하며 원문의 문장 구조를 반영하지 않습니다.
  revised_text: 주님께서는 경건한 사람들을 시험에서 건져 내시고, 불의한 사람들을 심판의 날까지 형벌 아래 두실 줄 아십니다.
  revised_footnotes:
  - marker: a
    text: 또는 “유혹에서.” 그리스어는 “시험” 또는 “유혹”을 뜻할 수 있으나, 여기서는 문맥상 “시험”이 더 잘 어울립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “불의한 사람들을 심판의 날을 위하여 벌받게 하여 보존하실 줄.” 그리스어 현재 분사는 계속되는 형벌 상태를 가리킬 수도 있고, 다가올 심판과 관련된 형벌을 가리킬 수도 있습니다.
    reason: alternative_reading
  revision_rationale: 「가두어 두실」을 「형벌 아래 두실」로 바꾸어 τηρεῖν의 넓은 의미를 유지하면서 κολαζομένους가 나타내는 형벌 상태를 반영했습니다. 불필요한 대시를 제거했고, 원문의 어휘 및 구문상 대안을 각주로 보존했습니다.
