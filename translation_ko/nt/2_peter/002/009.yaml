reference: 2 Peter 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
  footnotes:
  - marker: a
    text: Or "from temptation." The Greek word can mean either temptation or trial/testing; here the context favors deliverance from trial.
    reason: lexical_alternative
  - marker: b
    text: Or "to keep the unrighteous for the day of judgment to be punished"; the Greek participle may be taken as describing ongoing punishment or punishment associated with the coming judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 주님께서는 경건한 이들을 시험에서 건져 내시고[a], 불의한 이들을 심판의 날까지 벌을 받는 상태로 남겨 두실 줄 아십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유혹에서.” 그리스어 단어는 유혹 또는 시험·시련을 뜻할 수 있습니다. 여기서는 앞 문맥상 시련에서의 구출이라는 뜻이 더 어울립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “불의한 이들을 심판의 날을 위하여 벌하실 자들로 남겨 두실 줄.” 그리스어 현재분사는 그들이 지금 벌을 받는 상태임을 나타낼 수도 있고, 다가올 심판 때의 처벌과 관련하여 이해될 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν κύριος ... ῥύεσθαι
  english_pob_choice: the Lord knows how to rescue
