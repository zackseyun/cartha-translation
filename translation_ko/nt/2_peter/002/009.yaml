review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 「가두어 두실」은 τηρεῖν(지키다, 보존하다, 남겨 두다/유보하다)에 구금·감금이라는 뜻을 과도하게 부여합니다. 또한 κολαζομένους의 현재분사적 뉘앙스와 그 해석상 논쟁 가능성은 각주로 보존하는 편이 적절합니다.
  naturalness: 「형벌 아래 가두어 두다」는 현대 표준 한국어에서 다소 부자연스럽고, 형벌의 상태와 감금 행위를 중복·혼합합니다. 「벌을 받는 상태로 ... 남겨 두시다」가 더 자연스럽고 원문의 진행 중인 상태를 잘 반영합니다.
  terminology: 「주님」, 「경건한 이들」, 「불의한 이들」, 「심판의 날」은 적절합니다. πειρασμός의 넓은 의미를 위해 「시험」을 유지하되, ‘유혹’이라는 대안은 각주로 밝혀야 합니다.
  issues:
  - severity: medium
    issue: τηρεῖν을 「가두어 두다」로 번역함
    rationale: τηρεῖν은 여기서 불의한 이들을 심판을 향해 보존·유지·남겨 둔다는 뜻이며, 물리적 감금을 뜻하는 표현은 원문보다 좁고 강합니다.
  - severity: low
    issue: πειρασμός와 κολαζομένους의 해석상 대안을 각주 없이 단정함
    rationale: 「시험」은 문맥상 적절하지만 ‘유혹’도 가능한 어휘 의미입니다. κολαζομένους는 현재 벌을 받는 상태라는 독해와 심판 때의 처벌과 연결하는 독해가 논의되므로, 본문은 현재분사의 뉘앙스를 살리고 각주에서 대안을 밝혀야 합니다.
  revised_text: 그러므로 주님께서는 경건한 이들을 시험에서 건져 내시고[a], 불의한 이들을 심판의 날까지 벌을 받는 상태로 남겨 두실 줄 아십니다[b].
  revised_footnotes:
  - marker: a
    text: 또는 “유혹에서.” 그리스어 단어는 유혹 또는 시험·시련을 뜻할 수 있습니다. 여기서는 앞 문맥상 시련에서의 구출이라는 뜻이 더 어울립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “불의한 이들을 심판의 날을 위하여 벌하실 자들로 남겨 두실 줄.” 그리스어 현재분사는 그들이 지금 벌을 받는 상태임을 나타낼 수도 있고, 다가올 심판 때의 처벌과 관련하여 이해될 수도 있습니다.
    reason: alternative_reading
