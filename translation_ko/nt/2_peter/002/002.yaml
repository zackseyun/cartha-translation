  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
  footnotes:
  - marker: a
    text: Or 'debauchery,' 'licentiousness,' or 'lewdness.' The Greek term denotes shameless, unrestrained conduct, often with sexual overtones.
    reason: lexical_alternative
  - marker: b
    text: Or 'the way of truth.' This phrase likely refers to the Christian faith and manner of life as the true way.
    reason: lexical_alternative
  - marker: c
    text: Or 'will be reviled' or 'will be spoken against.'
    reason: lexical_alternative
