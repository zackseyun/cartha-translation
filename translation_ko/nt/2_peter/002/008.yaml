  source_fidelity: 수정이 필요합니다. 원문의 ἐβασάνιζεν은 능동태이며, 의인이 자신의 의로운 ψυχή를 계속 괴롭혔다는 표현입니다. 초안의 ‘영혼이 괴롭힘을 당하였기’는 수동태로 바꾸어 원문의 문법적 초점과 행위 주체를 흐립니다. 또한 βλέμματι καὶ ἀκοῇ는 ‘보고 들은 것’으로, ἀνόμοις ἔργοις는 그 무법한 행위가 고통의 원인/수단임을 나타내도록 옮기는 것이 적절합니다.
  naturalness: ‘보고 듣는 것으로 인하여’와 ‘자기의 … 영혼이 괴롭힘을 당하였기’는 다소 무겁고 부자연스럽습니다. ‘보고 들은 것 때문에’ 및 ‘자신의 의로운 영혼을 괴롭혔기’가 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
  terminology: ‘의인’, ‘무법한 행위’, ‘의로운 영혼’은 원문의 반복과 도덕·법적 어감을 잘 보존합니다. ‘영혼’은 여기서 내적 존재/자아를 가리키며, 별도의 인류학적 교리를 함축하도록 해석하지 않습니다.
