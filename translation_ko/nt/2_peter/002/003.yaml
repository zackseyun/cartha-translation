  text: 그들은 탐욕으로 꾸며 낸 말로 여러분을 이용해[a] 이익을 취할 것입니다. 그들에 대한 심판은 옛적부터 지체하지 않으며, 그들의 멸망은 잠들지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
