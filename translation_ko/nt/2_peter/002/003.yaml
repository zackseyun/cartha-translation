  source_fidelity: 원문의 핵심 의미는 대체로 충실합니다. 다만 κρίμα가 ‘게으르다’고 하는 표현은 한국어에서 부자연스러우므로, ἀργεῖ의 문맥상 뜻을 살려 ‘지체하지 않다’로 옮기는 것이 더 정확하고 자연스럽습니다. ἐμπορεύσονται의 상업 비유는 본문에서 ‘이용해 이익을 취하다’로 드러내고 각주로 보완합니다.
  naturalness: ‘심판은 오래 전부터 게으르지 않으며’는 현대 표준 한국어에서 어색합니다. ‘심판은 옛적부터 지체하지 않으며’는 법정적·종말론적 문맥에서 자연스럽고, 합쇼체 문체에도 맞습니다. ‘꾸며 낸’은 보조 용언 띄어쓰기를 반영했습니다.
  terminology: ‘탐욕’, ‘꾸며 낸 말’, ‘심판’, ‘멸망’은 적절합니다. ‘이용해 이익을 취하다’는 사람을 이윤의 대상으로 삼는 ἐμπορεύομαι의 비유를 명료하게 전달하며, 상업적 은유는 각주에서 보존합니다.
  issues:
