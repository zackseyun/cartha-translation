  terminology: ‘하나님의 영광’, ‘어린양’, ‘등불’은 각각 δόξα, ἀρνίον, λύχνος를 적절히 반영합니다. ‘어린양’은 계시록의 정착된 그리스도론적 호칭으로 띄어쓰기 없이 쓰는 것이 자연스럽습니다. ἐφώτισεν은 ‘빛나게 하시고’보다 ‘비추셨고’가 ‘그 성을 비추다’라는 직접 목적어 구조와 더 잘 맞습니다.
