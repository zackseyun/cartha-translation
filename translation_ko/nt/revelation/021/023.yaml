  source_fidelity: 초안은 도시가 해와 달의 비침을 필요로 하지 않으며, 하나님의 영광이 도시를 비추고 어린양이 그 등불이라는 본문의 핵심 의미를 충실히 옮깁니다. 다만 첫 절의 표현을 다듬으면 ἵνα φαίνωσιν αὐτῇ(그 성을 비추기 위해)를 더 직접적이고 자연스럽게 반영할 수 있습니다.
