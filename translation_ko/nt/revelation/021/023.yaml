- from: 그리고 그 성은 해나 달이 비추는 것을 필요로 하지 아니합니다. 하나님의 영광이 그 성을 빛나게 하시고, 어린 양이 그 성의 등불이시기 때문입니다.
  to: 그 성에는 해나 달이 비출 필요가 없습니다. 하나님의 영광이 그 성을 비추셨고, 그 성의 등불은 어린양이시기 때문입니다.
