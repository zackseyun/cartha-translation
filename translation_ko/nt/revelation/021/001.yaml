  source_fidelity: 원문의 대조 구조(‘새 하늘과 새 땅’/‘처음 하늘과 처음 땅’)와 인과절은 대체로 반영되어 있습니다. 그러나 초안의 ‘바다도 더 이상 없었기 때문입니다’는 현재형 οὐκ ἔστιν ἔτι를 과거로 옮깁니다. ‘없기 때문입니다’로 고쳐 현재적 진술을 보존합니다.
  naturalness: ‘그리고 나는’도 가능하지만 환상 서술의 문맥에서는 ‘또 나는’이 더 자연스럽고 간결합니다. ‘처음 하늘과 처음 땅’은 성경 문체에서 통용되는 현대 표준어 표현으로, 원문의 ‘첫/이전 질서’라는 대비를 유지합니다.
  terminology: ‘새 하늘과 새 땅’, ‘바다’는 원문의 우주적·묵시적 어휘를 무리 없이 반영합니다. καινός를 ‘새’로 번역하여 갱신인지 완전한 교체인지를 본문에서 결정하지 않았습니다. πρῶτος의 가능한 ‘이전의’ 뉘앙스와 바다의 상징적 연상은 각주로만 제시합니다.
