id: REV.21.1
reference: Revelation 21:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
  footnotes:
  - marker: a
    text: Or 'the former heaven and the former earth.' The Greek says 'the first heaven and the first earth,' which may denote the earlier order in contrast to the new one.
    reason: lexical_alternative
  - marker: b
    text: '''The sea'' may be read literally, though in Revelation it can also carry associations of chaos, danger, or separation.'
    reason: cultural_note
translation:
  language: ko
  text: 또 나는 새 하늘과 새 땅을 보았습니다. 처음 하늘과 처음 땅[a]이 사라졌고, 바다[b]도 더 이상 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이전 하늘과 이전 땅’. 그리스어는 ‘처음 하늘과 처음 땅’이라고 하며, 새 질서와 대조되는 앞선 질서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바다’는 문자 그대로 읽을 수도 있습니다. 다만 요한계시록에서는 혼돈, 위험 또는 분리와 관련된 연상을 지닐 수도 있습니다.
    reason: cultural_note
