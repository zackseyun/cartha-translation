  text: 그때 마지막 일곱 재앙으로 가득 찬 일곱 대접을 가지고 있던 일곱 천사 가운데 하나가 와서 나와 말하였습니다. “이리 오십시오. 내가 당신에게 어린양의 신부, 곧 어린양의 아내를 보여 주겠습니다.”
