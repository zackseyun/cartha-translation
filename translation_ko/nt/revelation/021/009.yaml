review_pass:
  verdict: revise
  source_fidelity: The draft conveys the main sequence and imagery, but ‘그분의 아내’ replaces the explicit repeated genitive ‘of the Lamb’ with a pronoun. The Greek explicitly identifies her as ‘the bride, the wife of the Lamb,’ so ‘어린양의 아내’ should be retained. ‘나에게 말하였습니다’ also weakens μετ’ ἐμοῦ (‘spoke with me’), though Korean idiom permits a modest adjustment.
  naturalness: 'The proposed revision uses natural modern formal-polite Korean consistently: ‘나와 말하였습니다,’ ‘이리 오십시오,’ and ‘보여 주겠습니다.’ ‘그대’ and the mixed style ‘오시오/보여 주겠소’ are not suitable for the requested modern 합쇼체 register.'
  terminology: ‘대접’ appropriately renders φιάλαι in Revelation; ‘마지막 일곱 재앙’ renders τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων; and ‘어린양’ consistently renders the christological title ἀρνίον. Both ‘신부’ and ‘아내’ are retained for the appositional νύμφη / γυνή imagery.
  issues:
  - severity: medium
    issue: The phrase ‘곧 그분의 아내’ omits the explicit wording ‘of the Lamb.’
    rationale: τοῦ ἀρνίου directly modifies γυναῖκα. A pronoun is understandable in Korean but obscures the source’s deliberate repetition of the Lamb title.
  - severity: medium
    issue: The direct speech uses ‘오시오’ and ‘보여 주겠소,’ which do not conform to the specified modern formal-polite 합쇼체.
    rationale: Use ‘오십시오’ and ‘보여 주겠습니다’ for consistent requested register.
  - severity: low
    issue: ‘나에게 말하였습니다’ does not reflect the relational force of μετ’ ἐμοῦ as closely as ‘나와 말하였습니다.’
    rationale: Korean ‘나와 말하였습니다’ is natural and better preserves ‘spoke with me,’ without making an unwarranted distinction in the event itself.
  revised_text: 그때 마지막 일곱 재앙으로 가득 찬 일곱 대접을 가지고 있던 일곱 천사 가운데 하나가 와서 나와 말하였습니다. “이리 오십시오. 내가 당신에게 어린양의 신부, 곧 어린양의 아내를 보여 주겠습니다.”
