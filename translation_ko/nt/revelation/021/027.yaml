  to: 그리고 어떤 부정한 것도[a], 가증한 것을 행하거나 거짓을 행하는 사람도[b] 결코 그 성에 들어가지 못할 것입니다. 오직 어린양의 생명책에 기록된 사람들만 들어갈 것입니다.
