id: REV.21.27
reference: Revelation 21:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
  footnotes:
  - marker: a
    text: Or 'nothing profane' or 'nothing defiled' for 'nothing unclean' (πᾶν κοινόν).
    reason: lexical_alternative
  - marker: b
    text: Literally, 'doing abomination and falsehood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 어떤 부정한 것도[a], 가증한 것을 행하거나 거짓을 행하는 사람도[b] 결코 그 성에 들어가지 못할 것입니다. 오직 어린양의 생명책에 기록된 사람들만 들어갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속된 것’ 또는 ‘더럽혀진 것’.
    reason: κοινόν의 문맥상 가능한 어휘적 대안을 제시합니다.
  - marker: b
    text: 직역하면 ‘가증한 것과 거짓을 행하는 사람’.
    reason: ποιῶν이 ‘가증한 것’과 ‘거짓’에 함께 걸리는 원문의 표현을 밝힙니다.
