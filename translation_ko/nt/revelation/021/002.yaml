review_pass:
  verdict: revise
  source_fidelity: The draft conveys the holy city, its descent from heaven as originating with God, and the bridal comparison. However, the demonstrative clause "그것은" weakens the direct syntactic connection between the city and both Greek participles, and the Korean phrasing can more closely retain that connection.
  naturalness: The sentence is generally understandable, but "그것은" is an unnatural referential continuation for a city in this elevated vision context. Integrating both descriptions under "보았습니다" reads more naturally in modern formal-polite Korean. "신부처럼" is also more idiomatic than the unspaced "신부같이."
  terminology: '"거룩한 성," "새 예루살렘," "하나님," "신부," and "남편" are appropriate and preserve the source imagery without importing interpretation. "성" is suitable for the biblical designation of Jerusalem.'
  issues:
  - severity: low
    issue: The second clause uses "그것은" to resume the city.
    rationale: Both καταβαίνουσαν (coming down) and ἡτοιμασμένην (having been prepared) modify "the holy city" in Greek. Keeping both within the object of "보았습니다" better represents the source structure and avoids an unnatural Korean pronoun.
  - severity: low
    issue: '"신부같이" is less natural orthographically and stylistically.'
    rationale: '"신부처럼" is an idiomatic modern Korean comparative expression and clearly renders ὡς, "like/as."'
  revised_text: 또 나는 거룩한 성, 새 예루살렘이 하나님께로부터 하늘에서 내려오며 자기 남편을 위해 단장한 신부처럼 준비되어 있는 것을 보았습니다.
