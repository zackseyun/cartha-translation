- from: 그리고 나는 거룩한 성, 새 예루살렘이 하나님께로부터 하늘에서 내려오는 것을 보았는데, 그것은 자기 남편을 위하여 단장한 신부같이 준비되어 있었습니다.
  to: 또 나는 거룩한 성, 새 예루살렘이 하나님께로부터 하늘에서 내려오며 자기 남편을 위해 단장한 신부처럼 준비되어 있는 것을 보았습니다.
  rationale: The revision retains the established Korean biblical wording "하나님께로부터 하늘에서 내려오는" for the two source expressions while placing the descent and prepared-bride descriptions together as modifiers of the holy city. It also improves formal-polite narrative style and comparative idiom without adding ecclesiological interpretation.
