translation:
  language: ko
  text: 그는 그 성벽을 측량했습니다. 사람의 단위, 곧 천사의 단위로 144규빗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “사람의 측량, 곧 천사의 [측량]”입니다. 그리스어는 천사가 인간에게 익숙한 단위를 사용했다는 뜻으로도, 여기서 인간과 천사의 측량 단위가 상응한다는 뜻으로도 이해될 수 있습니다.
    reason: 원문의 압축된 표현과 그에 따른 해석상의 여지를 보존합니다.
