  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
  footnotes:
  - marker: a
    text: Or, 'by a man’s measure, that is, an angel’s.' The Greek may stress either that the angel used a human unit of measurement or that human and angelic measure correspond here.
