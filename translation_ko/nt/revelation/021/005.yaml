  text: 그리고 보좌에 앉으신 분이 말씀하셨습니다. 「보십시오, 내가 만물을 새롭게 하고 있습니다.」 또 말씀하셨습니다. 「기록하십시오. 이 말씀들은 믿을 만하고 참되기 때문입니다.」
  philosophy: optimal-equivalence
