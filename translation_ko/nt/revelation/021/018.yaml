  source_fidelity: 원문의 두 병렬 서술을 충실히 옮겼습니다. ἐνδώμησις는 ‘성벽의 재료’로, ἴασπις는 관용적인 보석명인 ‘벽옥’으로, χρυσίον καθαρόν은 ‘순금’으로 적절히 번역되었습니다. ‘맑은 유리 같은’은 ὅμοιον ὑάλῳ καθαρῷ의 비교를 자연스럽게 재현합니다.
  naturalness: ‘그리고 그 성벽의 재료는 벽옥이었고, 그 성은 맑은 유리 같은 순금이었습니다’는 현대 표준 한국어이며 합쇼체 문체에도 잘 맞습니다. 수식 범위도 ‘맑은 유리 같은’이 ‘순금’을 수식하는 것으로 자연스럽습니다.
  terminology: ‘성벽’, ‘벽옥’, ‘순금’, ‘유리’는 요한계시록의 묘사와 한국어 성서 문맥에 모두 적합합니다. ‘벽옥’은 고대 ἴασπις가 현대 광물학상의 특정 돌과 완전히 일치하는지 불확실한 점을 과도하게 단정하지 않는 전통적 음역 명칭입니다.
