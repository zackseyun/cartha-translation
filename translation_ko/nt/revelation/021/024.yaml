  source_fidelity: ‘그 빛 가운데’는 διὰ τοῦ φωτὸς αὐτῆς의 수단/매개의 뜻보다 ‘그 빛 안에서’라는 위치적 뜻을 강하게 냅니다. 또한 φέρουσιν은 문맥상 앞선 미래와 연결되는 서술이므로 한국어에서도 미래로 통일하는 것이 적절합니다.
