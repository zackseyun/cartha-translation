  terminology: τὰ ἔθνη는 ‘민족들’, οἱ βασιλεῖς τῆς γῆς는 ‘땅의 왕들’, δόξα는 성서적 울림을 보존하는 ‘영광’으로 옮겼습니다. αὐτῆς/αὐτήν의 지시 대상은 문맥상 새 예루살렘 성이므로 ‘그 성’으로 명시했습니다.
