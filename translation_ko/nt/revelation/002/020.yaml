  naturalness: 「내가 너를 책망할 것이 있으니 … 것이다」는 현대 표준어 합쇼체 성경 문체로 다소 부자연스럽습니다. 「나는 너를 책망할 것이 있습니다. 네가 … 용납하기 때문입니다」가 더 자연스럽고 직접적입니다. 또한 목적·결과 관계는 「…하도록 가르치고 미혹합니다」로 명료하게 표현할 수 있습니다.
  terminology: 「그 여자 이세벨」은 τὴν γυναῖκα Ἰεζάβελ을 보존하며, 「내 노예들」은 이 문맥에서 δούλους의 소유·예속 관계를 드러내는 일관된 번역입니다. προφῆτιν의 여성형은 「여예언자」로 명시하는 것이 안전합니다. εἰδωλόθυτα는 「우상에게 바친 제물」로 자연스럽고 정확합니다.
