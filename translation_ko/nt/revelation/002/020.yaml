  to: 그러나 나는 너를 책망할 것이 있습니다. 네가 그 여자 이세벨[a]을 용납하기 때문입니다. 그는 자신을 여예언자[b]라고 하며, 내 노예들에게 음행을 하고 우상에게 바친 제물을 먹도록 가르치고 미혹합니다[c].
