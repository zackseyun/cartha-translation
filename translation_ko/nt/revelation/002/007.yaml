review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘열매’는 그리스어 ξύλον(나무) 및 ἐκ τοῦ ξύλου(그 나무에서/그 나무로부터)를 ‘열매’로 한정하여 추가합니다. 또한 ‘회중들’보다 계 2–3장의 ἐκκλησίαις에는 ‘교회들’이 적절합니다. τὸ πνεῦμα은 이 정형 문맥에서 ‘성령’으로 옮길 수 있습니다.
  naturalness: 초안의 ‘들으라’는 합쇼체가 아니라 하라체이며, 끝의 닫는 인용부호도 짝이 없습니다. ‘귀 있는 사람은 … 들으십시오’와 ‘먹도록 해 주겠습니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 권면과 약속의 문체를 보존합니다.
  terminology: ‘성령’, ‘교회들’, ‘이기는 사람’, ‘하나님의 낙원’, ‘생명나무’는 문맥 및 한국어 성경 번역 전통과 조화됩니다. νικῶν은 지속적 참여분사의 의미를 과도하게 해석하지 않고 ‘이기는 사람’으로, παράδεισος는 ‘낙원’으로 유지했습니다.
  issues:
  - severity: high
    issue: '문체 불일치: ‘들으라’'
    rationale: 요구된 번역 변종은 현대 표준어 합쇼체이나, ‘들으라’는 하라체 명령입니다.
  - severity: medium
    issue: ‘생명나무의 열매’라는 첨가
    rationale: 원문은 ‘생명나무에서 먹다’(φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς)라고 하며, 먹는 대상을 ‘열매’라고 명시하지 않습니다.
  - severity: medium
    issue: ‘회중들’
    rationale: ἐκκλησίαις는 요한계시록 2–3장의 일곱 교회에 대한 반복 정형에서 ‘교회들’로 옮기는 것이 용례와 문맥에 더 충실합니다.
  - severity: low
    issue: 짝 없는 닫는 인용부호
    rationale: 본문 끝의 ‘」’는 대응하는 여는 인용부호가 없어 제거해야 합니다.
