  source_fidelity: 'The draft correctly makes the Nicolaitans'' actions, rather than the people themselves, the object of hatred. However, it divides the Greek relative clause into an independent sentence and uses a singular demonstrative (''그것'') after a plural antecedent. The revision retains the explicit linkage: the works that the church hates are also those hated by the speaker.'
