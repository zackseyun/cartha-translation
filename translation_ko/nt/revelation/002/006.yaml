  - severity: low
    issue: Relative-clause connection and plurality are weakened
    rationale: Greek ἃ is plural and directly refers to 'works.' Rendering the final clause as '나도 그것을 미워한다' makes it a separate statement and shifts to singular; '그 행위들을 나도 미워합니다' preserves the connection and plural reference.
