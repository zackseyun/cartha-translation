    rationale: 원문은 '그들이 ... 회개하지 않으면'이라는 조건 아래, 간음하는 자들을 큰 환난에 던진다는 내용을 직접 연결합니다. 조건절을 앞에 배치하여 해당 동작을 명시하면 원문의 통사 관계가 더 분명해집니다.
  - severity: low
