    rationale: '''보라'', ''아니하면'', ''던지리라''는 성경적 문체로 이해되지만, 지정된 현대 표준어 합쇼체에는 ''보십시오'', ''않으면'', ''던져 넣겠습니다''가 더 적합합니다.'
  - severity: low
    issue: 큰 환난에 관한 어휘 대안 각주가 없습니다.
    rationale: 영어 감사 기록은 θλῖψις μεγάλη의 대안으로 'great tribulation'을 보존합니다. 한국어에서도 본문은 '큰 환난'으로 두되 '큰 고난'을 각주로 제공하면 어휘 범위와 앵커 대응을 보완할 수 있습니다.
