id: REV.2.22
reference: Revelation 2:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
  footnotes:
  - marker: a
    text: Or 'onto a sickbed.' The Greek says literally 'onto a bed'; in context many understand it as a bed of suffering or illness as judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'into great tribulation.' Here the phrase refers to severe affliction or distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 그들이 그 여자의 행위를 회개하지 않으면, 내가 그 여자를 침상[a]에 던져 넣고 그 여자와 간음하는 자들을 큰 환난[b]에 던져 넣겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘병상’. 헬라어는 문자적으로 ‘침상’이라고 한다. 문맥상 많은 이들은 이를 심판으로 인한 고통이나 질병의 자리로 이해한다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘큰 고난’. 헬라어 표현은 심한 고통이나 곤경을 가리킨다.
    reason: lexical_alternative
