review_pass:
  verdict: revise
  source_fidelity: 원문의 현재형 βάλλω가 심판 선언에서 지닌 임박성과, 두 대상(그 여자 및 그와 간음하는 자들)에게 각각 내려지는 심판을 충실히 반영해야 합니다. 조건절은 '그들이 그 여자의 행위를 회개하지 않으면'으로, 원문의 복수 주어와 αὐτῆς('그 여자의')를 유지하는 것이 적절합니다.
  naturalness: 초안의 '보라'와 '아니하면'은 전통 성경 문체로는 가능하지만, 요청된 현대 합쇼체에는 '보십시오'와 '않으면'이 더 자연스럽습니다. 또한 조건절을 심판 선언 앞에 두면 '그러하리라' 같은 지시어 없이도 문장이 명료해집니다.
  terminology: κλίνη는 본문에서 '침상'으로 유지하고 병상이라는 해석은 각주에 둡니다. θλῖψις μεγάλη는 '큰 환난'이 가능하며, '큰 환난'이 종말론적 전문어로만 오해되지 않도록 '큰 고난'이라는 대안을 각주로 제시합니다. μοιχεύοντας는 '간음하는 자들'로 보존합니다.
  issues:
