revisions:
- from: 보라, 내가 그 여자를 침상[a]에 던지고, 그 여자와 더불어 간음하는 자들도 큰 환난에 던지리라. 만일 그들이 그 여자의 행위를 회개하지 아니하면 그러하리라.
  to: 보십시오, 그들이 그 여자의 행위를 회개하지 않으면, 내가 그 여자를 침상[a]에 던져 넣고 그 여자와 간음하는 자들을 큰 환난[b]에 던져 넣겠습니다.
  rationale: 본문은 κλίνη를 해석적으로 ‘병상’으로 바꾸지 않고 ‘침상’으로 유지합니다. 간음의 문자적 표현과 ‘그 여자의 행위’라는 소유 관계도 보존했습니다. 현대 합쇼체에 맞게 문체를 다듬고, 조건절과 심판 선언의 관계를 원문에 가깝게 명시했으며, 영어 감사 기록의 두 어휘 대안에 대응하는 각주 앵커를 마련했습니다.
