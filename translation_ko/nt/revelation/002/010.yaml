  verdict: revise
  source_fidelity: 초안은 전반적인 문장 구조와 핵심 어휘를 잘 반영하지만, μέλλω의 임박성(‘장차’), ἰδού의 주의 환기, 그리고 합쇼체 요구가 충분히 반영되지 않았습니다. 또한 ‘옥’은 현대 표준어 문맥에서 ‘감옥’보다 문어적·고어적이며, ‘환난을 받다’보다 ‘환난을 겪다’가 자연스럽습니다.
  naturalness: ‘보십시오’, ‘두려워하지 마십시오’, ‘충성하십시오’, ‘주겠습니다’로 현대 정중한 합쇼체를 일관되게 적용했습니다. 원문의 단수에서 복수로, 다시 단수로 바뀌는 호칭은 한국어에서 불필요한 대명사를 절제하면서 ‘여러분’을 사용해 자연스럽게 보존했습니다.
  terminology: ‘마귀’, ‘환난’, ‘생명의 면류관’은 정착된 성경 용어로 유지했습니다. στέφανος의 비왕권적 성격은 각주로 설명했습니다. πειρασθῆτε의 ‘시험’은 문맥상 적절하되 ‘유혹/시련’ 가능성을 각주에 남겼고, ἄχρι θανάτου의 죽음까지의 충성이라는 범위를 각주로 보존했습니다.
  issues:
  - severity: medium
    issue: 합쇼체 불일치
    rationale: ‘두려워하지 말라’, ‘보라’, ‘신실하라’, ‘주리라’는 하라체이므로 지정된 현대 정중한 합쇼체와 맞지 않습니다.
  - severity: medium
    issue: μέλλω의 임박성 약화
    rationale: ‘장차’는 일반적인 미래를 나타낼 수 있으나, 두 차례의 μέλλω는 곧 닥칠 일을 가리킵니다. ‘곧 겪게 될’, ‘던지려 하고 있습니다’로 이를 반영하는 것이 안전합니다.
  - severity: low
    issue: 현대적 어휘와 결합
    rationale: ‘옥’은 현대 표준어에서는 다소 고어적이며, ‘환난을 받을 것이다’보다 ‘환난을 겪을 것입니다’가 자연스럽습니다.
  - severity: low
    issue: 영어 감사 기록의 의미상 각주 미반영
    rationale: 초안에는 στέφανος 각주만 있습니다. πειρασθῆτε와 ἄχρι θανάτου의 번역상 가능한 의미 범위를 각주로 남기면 원문의 해석 여지를 더 충실히 보존합니다.
  revised_text: 곧 겪게 될 일을 두려워하지 마십시오. 보십시오, 마귀가 여러분 가운데 몇 사람을 감옥에 던져 여러분이 시험을 받게 하려고 하고 있습니다. 여러분은 열흘 동안 환난을 겪을 것입니다. 죽음에 이르기까지 충성하십시오[c]. 그러면 내가 당신에게 생명의 면류관[a]을 주겠습니다.
  revised_footnotes:
  - marker: a
    text: 헬라어 στέφανος는 승리자에게 주는 화관 또는 상을 가리키며, 왕권의 관인 διάδημα를 뜻하지는 않습니다.
    reason: cultural_note
  - marker: b
    text: ‘시험을 받게 하려고’로 옮긴 헬라어 동사는 문맥에 따라 ‘시련을 겪게 하려고’ 또는 ‘유혹받게 하려고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘죽음에 이르기까지’는 ‘죽을 때까지’ 또는 죽음이 요구되더라도 충성하라는 뜻을 포함할 수 있습니다.
