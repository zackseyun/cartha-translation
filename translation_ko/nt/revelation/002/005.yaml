revisions:
- from: 그러므로 네가 어디서 떨어졌는지 기억하고, 회개하여 처음 행위를 행하라. 그렇지 않고 회개하지 아니하면, 내가 네게로 가서 네 등잔대[a]를 그 자리에서 옮겨 버리리라.
  to: 그러므로 그대가 어디서[a] 떨어졌는지 기억하고, 회개하여 처음에 하던 일들을 하십시오. 그러나 그렇지 않으면, 내가 그대에게 가서 그대의 등잔대[b]를 그 자리에서 옮길 것입니다. 그대가 회개하지 않으면 그렇게 할 것입니다.
  rationale: 합쇼체를 일관되게 적용하고, 어색한 ‘처음 행위를 행하라’를 자연스러운 현대어로 고쳤습니다. 경고 도입의 ‘그렇지 않으면’과 절말의 ‘회개하지 않으면’을 모두 번역하여 원문의 반복된 조건과 강조를 보존했습니다. 등잔대의 의미는 본문에서 해설하지 않고 교차참조 주석으로만 제시했습니다.
