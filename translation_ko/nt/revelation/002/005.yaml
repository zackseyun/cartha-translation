  verdict: revise
  source_fidelity: 원문의 명령 연쇄와 등잔대의 상징은 대체로 반영되었으나, 초안은 εἰ δὲ μή와 절 끝의 ἐὰν μὴ μετανοήσῃς가 이루는 경고의 조건을 한 번의 조건절로 합쳐 원문의 반복·강조를 약화합니다. 또한 πόθεν의 직역적 공간 은유에 관한 주석 앵커가 빠져 있습니다.
  naturalness: ‘처음 행위를 행하라’는 현대 표준어에서 부자연스럽고, 해라체 ‘행하라/버리리라’는 요청된 합쇼체와 일치하지 않습니다. ‘처음에 하던 일들을 하십시오’가 자연스럽습니다.
  terminology: ‘회개’, ‘등잔대’는 적절합니다. 다만 계 1:20의 λυχνίαι는 교회들을 가리키므로, 주석의 ‘회중’보다 ‘교회’가 원문 및 해당 절의 표현에 더 정확합니다.
  issues:
  - severity: medium
    issue: 마지막 회개 조건의 반복·강조가 소실됨
    rationale: 원문은 ‘그렇지 않으면’으로 경고를 도입한 뒤, 끝에서 다시 ‘네가 회개하지 않으면’을 둡니다. 초안은 ‘그렇지 않고 회개하지 아니하면’으로 이를 하나의 조건절로 합쳤습니다.
  - severity: medium
    issue: 요청된 합쇼체 register와 불일치
    rationale: ‘행하라’, ‘버리리라’는 해라체입니다. 현대 formal-polite 합쇼체로 고쳐야 합니다.
  - severity: low
    issue: ‘처음 행위를 행하라’의 어색한 중복
    rationale: ποιέω와 ἔργα를 기계적으로 반복한 표현입니다. ‘처음에 하던 일들을 하십시오’가 의미를 보존하면서 자연스럽습니다.
  - severity: low
    issue: πόθεν 관련 주석 앵커 누락 및 교차참조 주석의 용어 부정확성
    rationale: ‘어디서’는 직역적 표현이며 ‘어떤 높이에서’라는 해석 가능성을 주석으로 밝혀 둘 수 있습니다. 또한 계 1:20은 등잔대들을 ‘교회들’로 해석합니다.
