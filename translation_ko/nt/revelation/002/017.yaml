id: REV.2.17
reference: Revelation 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
  footnotes:
  - marker: a
    text: Or 'the one who overcomes.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'white stone' may evoke a voting pebble, a token of acquittal, or an admission stone; the text itself does not specify which background is intended.
    reason: cultural_note
  - marker: c
    text: Or 'and on the stone a new name written'.
    reason: previous_rendering
translation:
  language: ko
  text: 귀 있는 자는 영이 교회들에게 하시는 말씀을 들으라. 이기는 자에게는 내가 감추어진 만나를 줄 것이며, 흰 돌[a]도 줄 것입니다. 그 돌 위에는 새 이름이 기록되어 있으며, 그 이름을 아는 사람은 받는 사람뿐입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「흰 돌」은 투표용 조약돌, 무죄 판결의 표식, 또는 입장 표지를 연상시킬 수 있으나, 본문 자체는 어느 배경을 의도하는지 명시하지 않습니다.
    reason: cultural_note
