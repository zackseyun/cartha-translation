review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ταῖς ἐκκλησίαις는 여기서 계시록의 반복되는 수신자 표현이므로 ‘회중들’보다 ‘교회들에게’가 더 직접적이고 일관됩니다. 또한 원문의 세 번째 약속은 돌 위에 기록된 새 이름을 포함하며, 그 이름은 받는 사람만 안다는 관계를 더 분명히 드러내는 것이 좋습니다.
  naturalness: ‘감추인’은 현대 표준어 문체에서는 다소 낡은 느낌이 있어 ‘감추어진’이 자연스럽습니다. ‘귀 있는 자’와 ‘이기는 자’는 계시록의 관용적 문체로 유지할 수 있으나, 나머지 문장은 현대 합쇼체에 맞게 더 매끄럽게 정리할 수 있습니다. 원문의 범위 밖의 닫는 인용 부호도 제거해야 합니다.
  terminology: ‘영’, ‘교회들’, ‘만나’, ‘흰 돌’, ‘새 이름’은 적절합니다. 각주에서 ‘무죄 방면’은 현대 한국어에서 부자연스럽고 의미도 불분명하므로 ‘무죄 판결의 표식’으로 고칩니다. 본문은 흰 돌의 상징적 배경을 특정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘회중들에게’
    rationale: ἐκκλησίαις는 계시록 2–3장의 정형적 표현에서 ‘교회들에게’로 옮기는 것이 원문 용례와 한국어 성경 문맥에 더 충실합니다.
  - severity: low
    issue: ‘감추인’
    rationale: 의미는 맞지만 현대 표준어 합쇼체에서는 ‘감추어진’이 더 자연스럽습니다.
  - severity: medium
    issue: 새 이름과 수령자의 관계가 다소 느슨하게 표현됨
    rationale: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων은 새 이름을 받는 이 외에는 아무도 알지 못함을 말합니다. 한국어에서도 ‘그 이름을 아는 사람은 ...뿐입니다’라고 하여 선행사를 분명히 하는 편이 좋습니다.
  - severity: low
    issue: 각주의 ‘무죄 방면’
    rationale: 통상적 현대 한국어 표현이 아니므로, 가능한 문화적 연상을 과도하게 확정하지 않으면서 ‘무죄 판결의 표식’으로 고칩니다.
  - severity: low
    issue: 본문 끝의 닫는 인용 부호
    rationale: 짝이 없는 문장부호이므로 제거합니다.
