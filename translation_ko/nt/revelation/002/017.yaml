revisions:
- from: 귀 있는 자는 영이 회중들에게 하시는 말씀을 들으라. 이기는 자에게는 내가 감추인 만나를 줄 것이며, 또 흰 돌[a]을 줄 것이다. 그 돌 위에 새 이름이 기록되어 있는데, 받는 자 외에는 아무도 알지 못한다.」
  to: 귀 있는 자는 영이 교회들에게 하시는 말씀을 들으라. 이기는 자에게는 내가 감추어진 만나를 줄 것이며, 흰 돌[a]도 줄 것입니다. 그 돌 위에는 새 이름이 기록되어 있으며, 그 이름을 아는 사람은 받는 사람뿐입니다.
  rationale: 계시록의 정형 표현인 ‘교회들에게’를 사용하고, 현대 표준어에 맞게 ‘감추어진’으로 고쳤습니다. 새 이름이 돌 위에 기록되어 있고 그 이름은 받는 사람만 안다는 원문의 관계를 명료하게 했습니다. 흰 돌의 의미는 본문에서 결정하지 않고 각주에서도 가능한 배경만 중립적으로 제시했습니다.
