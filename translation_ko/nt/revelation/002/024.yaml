revisions:
- from: 두아디라에 있는 나머지 너희, 곧 이 가르침을 받아들이지 아니한 너희, 그들이 「사탄의 깊은 것」이라 부르는 것을 알지 못한 너희에게 내가 말한다. 내가 너희에게 다른 짐을 지우지 아니하리라.
  to: 그러나 두아디라에 있는 나머지 여러분, 곧 이 가르침을 따르지 않고 그들이 말하는 ‘사탄의 깊은 것들’[a]을 알지 못한 여러분에게 말합니다. 나는 여러분에게 다른 짐을 지우지 않습니다.
  rationale: 현재형을 유지하고 현대 합쇼체로 다듬었습니다. ‘그들이 말하는’은 원문의 압축된 보고 표현을 보존하며, 거짓 교사의 주장인지 저자의 풍자적 명명인지 단정하지 않습니다. 각주 표지는 해당 어휘가 나오는 ‘사탄의 깊은 것들’에 직접 연결했습니다.
