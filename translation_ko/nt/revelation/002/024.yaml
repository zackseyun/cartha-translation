id: REV.2.24
reference: Revelation 2:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
  footnotes:
  - marker: a
    text: Or, 'the depths of Satan.' The Greek expression may echo a claim to possessing 'deep' spiritual insight, which John rejects.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 두아디라에 있는 나머지 여러분, 곧 이 가르침을 따르지 않고 그들이 말하는 ‘사탄의 깊은 것들’[a]을 알지 못한 여러분에게 말합니다. 나는 여러분에게 다른 짐을 지우지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사탄의 깊음들’. 그리스어 표현은 ‘깊은’ 영적 통찰을 지녔다는 주장에 반향을 일으킬 수 있으나, 누가 이 명칭을 사용했는지와 그 정확한 의도는 본문이 명시하지 않습니다.
    reason: βαθέα의 가능한 어휘적 번역을 제시하고, ὡς λέγουσιν의 화자·수사적 기능에 관한 본문상의 모호성을 보존합니다.
