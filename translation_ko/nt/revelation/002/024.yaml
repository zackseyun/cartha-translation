    issue: ‘내가 너희에게 다른 짐을 지우지 아니하리라’가 현재형 οὐ βάλλω를 미래형으로 바꿉니다.
    rationale: 원문은 ‘나는 ... 지우지 않습니다/부과하지 않습니다’라는 현재형 선언입니다. 미래 약속으로 한정하지 않는 편이 원문에 가깝습니다.
  - severity: low
    issue: ‘그들이 「사탄의 깊은 것」이라 부르는 것’은 현대 한국어에서 다소 무겁고, ‘그들’의 발화가 보고된 표현이라는 점이 덜 자연스럽습니다.
    rationale: ὡς λέγουσιν의 화자 지시를 해석적으로 특정하지 않으면서 ‘그들이 말하는’으로 옮기면 자연스럽습니다. ‘것들’은 τὰ βαθέα의 복수도 반영합니다.
