  source_fidelity: The draft represents all major Greek elements, including works, labor, endurance, refusal to tolerate evil persons, testing self-styled apostles, and finding them false. However, its opening coordination ('알며 ... 안다') is syntactically awkward, and the final wording can more explicitly retain ψευδεῖς as a characterization of the persons tested.
  naturalness: A revision is needed for fluent modern standard Korean and the requested formal-polite 합쇼체. Splitting the long sentence improves clarity while retaining the source's coordinated content.
  terminology: 행위, 수고, 인내, 악한 자들, 사도, 시험하다 are appropriate. '사도라고 자칭하나 사도가 아닌 자들' accurately conveys λέγοντας ἑαυτοὺς ἀποστόλους, καὶ οὐκ εἰσίν. '거짓된 자들' retains the predicate characterization ψευδεῖς without unnecessarily narrowing it to 'liars.'
  issues:
