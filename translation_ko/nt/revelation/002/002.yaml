    issue: The phrase '알며 ... 안다' is not natural Korean sentence construction.
    rationale: The Greek has one governing 'I know' with coordinated objects and clauses, but Korean should use '알고 있습니다' directly or separate the clauses into clear sentences.
  - severity: medium
    issue: The draft does not consistently use the stipulated modern formal-polite 합쇼체.
    rationale: The ending '안다' is plain declarative (한다체); '알고 있습니다' conforms to the requested register.
  - severity: low
    issue: '''그들이 거짓됨을'' is somewhat abstract and can leave the referent less explicit.'
    rationale: The Greek says that the tested people themselves were found ψευδεῖς. '그들이 거짓된 자들임을' makes the personal predicate explicit while preserving its broad sense.
