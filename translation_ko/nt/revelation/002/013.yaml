review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 의미를 대체로 전달하지만, ὁ μάρτυς μου, ὁ πιστός μου의 두 호칭을 「내 충성된 증인」으로 합쳐 원문의 병렬·반복 구조를 축소했습니다. 또한 마지막의 「사탄이 사는 곳」이 안디바의 죽임당함을 수식하는 듯한 어순이 되어, 원문의 독립적인 장소 반복을 더 분명히 살릴 필요가 있습니다. τὴν πίστιν μου의 모호성도 본문에서 가능한 한 보존하는 편이 적절합니다.
  naturalness: 「내 증인, 내 신실한 이」는 원문의 호칭 반복을 보존하면서 현대 한국어 문장 안에서 이해 가능합니다. 종결은 현대 합쇼체에 맞추어 「안다 / 붙들고 있으며 / 부인하지 않았다」로 정리했습니다.
  terminology: 「사탄」, 「보좌」, 「이름」, 「증인」, 「신실한 이」는 원문 및 한국어 성서 문체에 충실합니다. μάρτυς의 ‘순교자’ 가능성은 각주에만 남기고, 본문은 「증인」으로 유지했습니다.
  issues:
  - severity: medium
    issue: 두 개의 안디바 호칭이 하나로 합쳐짐
    rationale: ὁ μάρτυς μου, ὁ πιστός μου는 각각 「내 증인, 내 신실한 이」라는 병렬 호칭입니다. 「내 충성된 증인」은 뜻은 가깝지만 반복과 강조를 축소합니다.
  - severity: medium
    issue: τὴν πίστιν μου의 모호성이 본문에서 해소됨
    rationale: 「나에 대한 믿음」은 가능한 해석이지만 목적격 해석을 선택합니다. 원문의 압축성을 반영하여 「내 믿음」을 본문에 두고 대안을 각주로 제시하는 것이 더 충실합니다.
  - severity: low
    issue: 마지막 장소 구절의 연결이 불분명함
    rationale: 원문은 끝에서 「사탄이 사는 곳」을 반복합니다. 이를 독립 문장으로 처리하여 안디바의 죽음과의 문법적 결속을 피하고 반복 강조를 살렸습니다.
  revised_text: 나는 네가 사는 곳, 곧 사탄의 보좌가 있는 곳을 안다. 너는 내 이름을 굳게 붙들고 있으며, 안디바, 곧 내 증인, 내 신실한 이가 너희 가운데서 죽임을 당한 날들에도 내 믿음[a]을 부인하지 않았다. 그곳은 사탄이 사는 곳이다.
  revised_footnotes:
  - marker: a
    text: 또는 「나에 대한 믿음」 또는 「내 신실함」. 헬라어 「내 믿음」은 압축된 표현으로 여러 방식으로 이해될 수 있다.
    reason: alternative_reading
  - marker: b
    text: 또는 「내 순교자」. 헬라어 μάρτυς는 「증인」을 의미하며, 고난이나 죽음의 문맥에서는 「순교자」라는 뜻도 지닐 수 있다.
    reason: lexical_alternative
  revision_rationale: 원문의 절 구조와 반복을 보존하도록 안디바의 두 호칭을 분리하고, 사탄이 사는 곳이라는 마지막 반복을 분명하게 옮겼습니다. 「내 믿음」을 본문에 두어 τὴν πίστιν μου의 해석상 모호성을 유지했으며, 가능한 해석들은 각주에 제시했습니다. b 각주는 본문에 표지가 없으므로 삭제하지 않고 제공된 각주 세트에 유지할 경우에는 「증인」 뒤에 [b]를 붙여야 합니다.
