  to: 내가 너의 환난과 가난을 안다. 그러나 너는 부요하다. 또 자신들이 유대인이라고 말하지만 유대인이 아니며, 도리어 사탄의 회당[a]인 자들이 하는 비방도 안다.
  rationale: 원문의 세 대상(환난, 가난, 비방)을 모두 ‘안다’의 대상으로 유지하고, πλούσιος εἶ는 자연스럽게 「너는 부요하다」로 옮겼습니다. 논쟁적인 표현인 「유대인」 및 「사탄의 회당」은 완화하거나 해설적으로 확대하지 않고 원문의 직접적이면서 집합적인 서술을 보존했습니다. 각주는 「사탄의 회당」에 정확히 연결했습니다.
