- from: 그러나 내가 너를 책망할 것이 몇 가지 있으니, 네 가운데 발람의 가르침을 붙드는 자들이 있다는 것이다. 발람은 발락을 가르쳐 이스라엘 자손 앞에 걸림돌을 놓아, 우상 제물을 먹게 하고 음행하게 하였다.
  to: 그러나 내가 네게 책망할 일이 몇 가지 있습니다. 네가 그곳에서 발람의 가르침을 붙드는 사람들을 두고 있기 때문입니다. 발람은 발락에게 이스라엘 자손 앞에 걸림돌을 놓아, 그들이 우상 제물을 먹고 음행하도록 가르쳤습니다.
  rationale: 첫 문장을 합쇼체에 맞게 자연스럽게 다듬고, ‘발락에게 … 놓도록 가르쳤다’는 원문의 통사 관계를 드러냈습니다. 또한 우상 제물을 먹고 음행하는 주체가 이스라엘 자손임을 ‘그들이’로 명시하여 의미의 연결을 보존했습니다.
