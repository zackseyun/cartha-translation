  text: 그러나 내가 네게 책망할 일이 몇 가지 있습니다. 네가 그곳에서 발람의 가르침을 붙드는 사람들을 두고 있기 때문입니다. 발람은 발락에게 이스라엘 자손 앞에 걸림돌을 놓아, 그들이 우상 제물을 먹고 음행하도록 가르쳤습니다.
