  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
  footnotes:
  - marker: a
    text: Or 'will rule them with an iron rod.' The verb literally means 'to shepherd,' but in this Psalm 2 allusion it also carries the sense of royal rule.
    reason: alternative_reading
  - marker: b
    text: An allusion to Psalm 2:9, where the nations are broken like pottery.
    reason: cross_reference
translation:
  language: ko
  text: 그가 쇠 막대기[a]로 그들을 목양하실 것이며, 그들은 토기 그릇들이 산산이 부서지듯 부서질 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쇠 막대기로 그들을 다스리실 것입니다.’ 동사는 문자적으로 ‘목양하다’이지만, 시편 2편의 반향 안에서는 왕적 통치의 의미도 지닙니다.
    reason: alternative_reading
  - marker: b
    text: 시편 2:9를 반향합니다. այնտեղ 열방은 토기처럼 부서집니다.
    reason: cross_reference
