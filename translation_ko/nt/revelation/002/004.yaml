  text: 그러나 내가 너에게 책망할 것이 있습니다. 네가 처음에 가졌던 사랑[a]을 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 처음 사랑을 버렸습니다.” 여기서 ‘사랑’은 주님을 향한 사랑, 서로를 향한 사랑, 또는 둘 다를 가리킬 수 있습니다.
    reason: ‘처음에 가졌던 사랑’은 ‘네 첫 사랑’이라는 그리스어 표현의 시간적 의미를 자연스럽게 드러낸다. 각주에는 가능한 직역을 제시하고 사랑의 대상을 특정하지 않는다.
