  to: 또 그 여자의 자녀들을 죽음으로[a] 죽이겠습니다. 그러면 모든 교회가 내가 콩팥과 마음을 살피는 이[b]가 바로 나임을 알게 될 것입니다. 또 나는 너희 각 사람에게 너희 행위에 따라 갚겠습니다.
  rationale: 교회를 가리키는 용어를 정비하고 현대 합쇼체로 문체를 통일했습니다. '자녀들'의 문자적·비유적 가능성은 그대로 두었고, '죽음으로 죽이겠다'는 원문의 강하고 난해한 표현을 본문에서 보존하되 가능한 대안은 각주로 처리했습니다. 콩팥과 마음의 원문 순서도 유지했습니다.
