id: REV.2.23
reference: Revelation 2:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
  footnotes:
  - marker: a
    text: Or 'with pestilence'; the Greek literally says 'with death,' an idiom that may intensify the judgment or echo Old Testament judgment language.
    reason: lexical_alternative
  - marker: b
    text: Literally 'kidneys and hearts,' a biblical idiom for the inner person, including motives, thoughts, and desires.
    reason: cultural_note
translation:
  language: ko
  text: 또 그 여자의 자녀들을 죽음으로[a] 죽이겠습니다. 그러면 모든 교회가 내가 콩팥과 마음을 살피는 이[b]가 바로 나임을 알게 될 것입니다. 또 나는 너희 각 사람에게 너희 행위에 따라 갚겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어를 직역하면 「죽음으로」이다. 심판을 강조하는 표현이거나 구약의 심판 언어를 반향하는 표현일 수 있다. 또는 「전염병으로」.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 「콩팥과 마음」. 동기·생각·욕망을 포함한 내면 전체를 가리키는 성경적 관용 표현이다.
    reason: cultural_note
