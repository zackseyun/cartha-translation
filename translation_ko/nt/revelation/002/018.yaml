source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
  footnotes:
  - marker: a
    text: Or 'messenger' for 'angel.'
    reason: alternative_reading
  - marker: b
    text: The Greek term rendered 'burnished bronze' is rare and may refer more generally to a refined, glowing metal or alloy.
    reason: lexical_alternative
translation:
  language: ko
  text: 두아디라에 있는 교회의 천사[a]에게 이렇게 쓰십시오. “하나님의 아들, 곧 그의 눈이 불꽃 같고 그의 발이 빛나는 청동[b]과 같은 이가 이렇게 말씀하십니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천사’는 ‘전령’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 그리스어 ‘칼콜리바논’은 드문 말로, 정련되어 빛나는 금속이나 합금을 더 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
