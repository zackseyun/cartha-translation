  source_fidelity: 초안은 짐승이 하나님과 하나님의 이름·장막 및 하늘의 거주자들을 모독한다는 핵심을 대체로 전달합니다. 그러나 ‘그 입’은 한국어에서 부자연스럽고, ‘발하였으니’는 현대 합쇼체와 잘 맞지 않습니다. 또한 마지막 대격구의 문법적 관계가 논쟁적인데, 본문에서 ‘곧’을 사용해 동격으로 처리했으면 가능한 병렬 목적어 해석을 각주로 보존해야 합니다.
  naturalness: ‘그 짐승은 입을 열어 … 말들을 하였고’ 및 ‘하늘에 거하는 이들’은 현대 표준 한국어의 정중한 문체에서 자연스럽습니다. ‘신성 모독의 말들’은 복수형 βλασφημίας의 반복적·다양한 발화를 드러냅니다.
  terminology: ‘하나님’, ‘신성 모독’, ‘이름’, ‘장막’은 적절합니다. σκηνή의 ‘장막’은 원어의 천막/거처 이미지를 보존하며, ‘거처’라는 대안은 각주에서 제시합니다. 마지막 ‘곧’은 영어 POB의 동격적 처리와 부합하지만, 이를 유일한 문법 해석으로 고정하지 않도록 대안 각주가 필요합니다.
  issues:
  - severity: medium
    issue: 마지막 구절의 대안적 문법 해석이 누락되었습니다.
    rationale: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας는 ‘그분의 장막’에 대한 동격/설명으로도, ‘이름’과 ‘장막’에 이어지는 세 번째 모독 목적어로도 읽힐 수 있습니다. 본문에서 동격을 택할 경우 병렬 해석을 각주로 보존해야 합니다.
  - severity: low
    issue: ‘그 입’과 ‘신성 모독을 발하였으니’의 문체가 부자연스럽습니다.
    rationale: ‘그 짐승은 입을 열어’가 자연스럽고, ‘신성 모독의 말들을 하였습니다’가 현대적인 합쇼체이며 복수형의 뉘앙스도 더 잘 살립니다.
  revised_text: 그 짐승은 입을 열어 하나님을 향한 신성 모독의 말들을 하였고, 그분의 이름과 그분의 장막, 곧 하늘에 거하는 이들을 모독하였습니다[a].
  revised_footnotes:
  - marker: a
    text: 또는 “그분의 이름과 그분의 장막과 하늘에 거하는 이들을 모독하였습니다.” 마지막 구절을 ‘그분의 장막’을 설명하는 동격이 아니라, ‘모독하였습니다’의 세 번째 목적으로 이해할 수 있습니다.
    reason: alternative_reading
