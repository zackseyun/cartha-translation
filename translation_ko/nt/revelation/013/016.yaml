  source_fidelity: 핵심 의미는 잘 옮겼습니다. 다만 ποιεῖ는 현재형이므로 과거형 「받게 하였고」보다 현재의 「받게 합니다」가 원문에 더 충실합니다. 또한 ἵνα δῶσιν αὐτοῖς χάραγμα은 문법·본문상 난해한 표현이므로, 수동적 본문 번역을 유지하되 직역 가능성을 각주로 밝혀야 합니다.
  naturalness: 「모든 자」와 「하였고」는 다소 문어적이고 이전 번역체로 들립니다. 「모든 사람」 및 합쇼체 현재형 「받게 합니다」가 현대 표준어 성서 문체에 더 자연스럽습니다. 「작은 자와 큰 자」, 「부자와 가난한 자」, 「자유인과 노예」는 계시록의 열거 리듬을 자연스럽게 보존합니다.
  terminology: χάραγμα의 「표」는 적절합니다. 자유인과 대조되는 δοῦλος를 「노예」로 옮긴 것도 사회적 신분 대조를 정확히 드러냅니다. 기존 각주의 「헬라어」는 현대 학술 용례인 「그리스어」로 바꿀 수 있으나, 여기서는 어휘 설명보다 난해한 수여 구문의 직역을 보존하는 각주가 더 필요합니다.
