  source_fidelity: 본문은 θηρίον, 열 뿔, 일곱 머리, 열 διαδήματα, 그리고 ὀνόματα βλασφημίας를 모두 빠짐없이 옮겼습니다. 다만 διάδημα의 왕권적·특수한 어휘 뉘앙스와 βλασφημίας의 속격 표현에 대한 대안은 각 해당 위치에 주석으로 보존하는 것이 영어 POB의 번역 결정을 더 충실히 반영합니다. 영어 감사 기록의 각주 표지는 본문 위치와 뒤바뀌어 있으나, 한국어 개정본에서는 올바른 위치에 배치합니다.
  naturalness: 초안은 전반적으로 자연스럽고 합쇼체도 일관됩니다. 다만 ‘그 뿔들/그 머리들’보다 ‘그 짐승의 뿔들/머리들’이 지시 대상이 더 선명하며, ‘신성을 모독하는 이름들’이 현대 한국어에서 ‘신성 모독의 이름들’보다 자연스럽습니다.
  terminology: ‘짐승’은 요한계시록의 θηρίον에 적절합니다. διάδημα의 기본 번역으로 ‘왕관’을 유지하되 ‘디아뎀’이라는 더 구체적인 대안을 주석에서 밝혀야 합니다. βλασφημία는 ‘신성을 모독하는’으로 옮겨 의미를 명료하게 유지합니다.
  issues:
