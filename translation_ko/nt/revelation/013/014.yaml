  to: 그리고 이 짐승은 그 짐승 앞에서 행하도록 자신에게 허락된 표적들로 땅에 거하는 자들을 미혹하며[a], 땅에 거하는 자들에게 칼의 상처를 지니고 살아 있던 그 짐승을 위한 형상을 만들라고 말합니다.[b][c]
