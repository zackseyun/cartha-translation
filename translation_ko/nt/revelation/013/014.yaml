    issue: ‘첫째 짐승’으로 특정함
    rationale: 원문은 ἐνώπιον τοῦ θηρίου 및 τῷ θηρίῳ에서 단지 ‘그 짐승’이라고 하며, 이 절 안에서 ‘첫째’라는 수식어를 사용하지 않습니다. 문맥적 지시를 번역 본문에서 불필요하게 명시하지 않아야 합니다.
  - severity: medium
    issue: 현재 시제 πλανᾷ를 ‘미혹하였고’로 번역함
    rationale: 현재형 서술을 ‘미혹하며’로 유지하는 편이 원문에 더 가깝고, 뒤따르는 λέγων의 현재 분사와도 잘 연결됩니다.
  - severity: medium
    issue: λέγων을 ‘명하여’로 번역함
    rationale: λέγων은 ‘말하며/말하여’이며, 명령의 강도를 명시하지 않습니다. ‘만들라고 말합니다’가 원문의 절제된 표현을 보존합니다.
  - severity: low
