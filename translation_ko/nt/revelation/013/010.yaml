  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
  footnotes:
  - marker: a
    text: Or, 'If anyone goes into captivity, into captivity he goes'; the line may also be understood as a statement of appointed destiny rather than a command.
    reason: alternative_reading
  - marker: b
    text: Some manuscripts/readings differ in this clause, including forms that read, 'If anyone kills with the sword, he must be killed with the sword.' The adopted text is retained here, but the variant is significant for interpretation.
    reason: textual_variant
  - marker: c
    text: Or 'faithfulness of the saints.'
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 포로로 끌려갈[a] 사람은 포로로 끌려갈 것이며, 누구든지 칼로 죽임을 당할[b] 사람은 칼로 죽임을 당할 것입니다. 바로 여기에 성도들의 인내와 믿음[c]이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “누구든지 포로로 끌려가면, 포로로 끌려간다.” 이 말은 명령이라기보다 정해진 운명에 대한 진술로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 일부 사본과 본문 읽기에는 이 절과 다른 형태가 있으며, “누구든지 칼로 죽이는 사람은 칼로 죽임을 당해야 한다”라고 읽기도 합니다. 여기서는 채택한 본문을 따르지만, 이 이문은 해석상 중요합니다.
    reason: textual_variant
  - marker: c
    text: 또는 “성도들의 신실함.”
    reason: lexical_alternative
