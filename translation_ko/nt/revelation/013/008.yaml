  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
  footnotes:
  - marker: a
    text: Or, 'everyone whose name has not been written from the foundation of the world in the book of life of the Lamb who was slain.' The Greek can be taken to connect 'from the foundation of the world' either with 'was slain' or with 'has been written.'
