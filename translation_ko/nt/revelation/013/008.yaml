translation:
  language: ko
  text: 땅에 사는 모든 사람, 곧 세상이 창조된 때부터[a] 죽임당하신 어린 양의 생명책에 자기 이름이 기록되지 않은 모든 사람이 그에게 경배할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세상이 창조된 때부터’는 ‘죽임당하신’을 수식할 수도 있고, ‘기록되지 않은’을 수식할 수도 있습니다. 후자로 이해하면 ‘세상이 창조된 때부터 어린 양의 생명책에 자기 이름이 기록되지 않은’이라는 뜻입니다.
    reason: alternative_reading
