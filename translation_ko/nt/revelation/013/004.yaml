review_pass:
  verdict: revise
  source_fidelity: 개정안은 ὅτι의 인과 관계를 ‘~했기 때문에’로 명시하고, δράκων·θηρίον·ἐξουσία를 각각 ‘용’·‘짐승’·‘권세’로 충실히 옮깁니다. πολεμῆσαι μετ’ αὐτοῦ는 문맥상 적대적 대결이므로 ‘맞서 싸우다’로 번역하는 것이 ‘더불어 싸우다’보다 정확합니다.
  naturalness: ‘그들은’과 인과절의 어순을 사용하면 현대 표준 한국어 합쇼체에서 더 자연스럽고 명료합니다. ‘누가 … 수 있겠습니까?’는 수사 의문문의 자연스러운 격식체 표현입니다.
  terminology: ‘경배하다’, ‘용’, ‘짐승’, ‘권세’는 요한계시록의 문맥과 한국어 성서 용례에 적절합니다. 짐승을 다시 명사로 받아 ‘그 짐승과 맞서’라고 하여 그리스어 중성 대명사에 대한 인격화 여부를 불필요하게 결정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘그와 더불어 싸울 수 있으랴’
    rationale: μετά + 속격은 여기서 짐승과 함께 싸운다는 뜻이 아니라 짐승을 상대로 전쟁을 벌인다는 적대적 의미입니다. 따라서 ‘그 짐승과 맞서 싸울’ 또는 ‘그 짐승에게 전쟁을 벌일’로 고쳐야 합니다.
  - severity: low
    issue: 인과 관계와 주어의 명료성
    rationale: 원문의 ὅτι는 용에게 경배한 이유를 제시합니다. ‘용이 그 짐승에게 권세를 주었기 때문에, 그들은 …’으로 배열하면 관계가 더 분명합니다.
  revised_text: 용이 그 짐승에게 권세를 주었기 때문에, 그들은 용에게 경배하였고, 또 짐승에게 경배하며 말하였습니다. “누가 그 짐승과 같으며, 누가 그 짐승과 맞서 싸울 수 있겠습니까?”
  revised_footnotes:
  - marker: a
    text: '‘누가 그 짐승과 같으며’라는 외침은 하나님과 견줄 이 없음을 말하는 구약의 표현(예: 출애굽기 15:11; 시편 35:10)을 반향하는 것으로 보이며, 여기서는 그것이 짐승에게 적용됩니다.'
    reason: cross_reference
  revision_rationale: 원문의 인과절을 명시하고, 적대적 전쟁을 뜻하는 πολεμῆσαι μετ’ αὐτοῦ를 ‘맞서 싸우다’로 바로잡았습니다. 하나님의 비할 데 없으심을 반향하는 표현이라는 설명은 본문에 해석을 덧붙이지 않고 각주로만 제시했습니다.
