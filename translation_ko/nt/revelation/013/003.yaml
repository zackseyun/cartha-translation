translation:
  language: ko
  text: 그 머리들 가운데 하나는 죽임을 당해 죽은 것 같았으나[a], 그 치명적인 상처는 치유되었습니다. 그러자 온 땅이 놀라 그 짐승을 따라갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽임을 당해 죽은 듯했습니다.’ 그리스어 ὡς(‘마치, 듯’)는 실제로 죽었다고 단정하기보다 외관 또는 유사성을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
