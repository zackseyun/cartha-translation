  naturalness: ‘그 머리들 가운데 하나’, ‘치명적인 상처’, ‘온 땅이 놀라 그 짐승을 따라갔습니다’는 현대 표준어 합쇼체에서 자연스럽고 읽기 쉽습니다. 절 끝의 쉼표는 마침표로 고쳤습니다.
  terminology: θηρίον은 계시록의 일관된 용어인 ‘짐승’으로 유지했습니다. πληγὴ τοῦ θανάτου는 문맥상 죽음에 이르는 상처를 뜻하므로 ‘치명적인 상처’로 옮기되, 원문의 표현과 해석상 여지를 밝히는 각주를 두었습니다. ‘온 땅’은 여기서는 전 지구적 범위를 가리키는 것으로 보이나 γῆ의 ‘땅/나라’ 가능성도 각주에 보존했습니다.
