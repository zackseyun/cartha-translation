  source_fidelity: 원문의 οὕτως(‘이와 같이’), 흰 옷, οὐ μὴ의 강한 부정(‘결코 … 않다’), 생명책, 그리고 아버지와 그의 천사들 앞에서 이름을 공개적으로 인정한다는 약속이 모두 보존되어 있습니다. 다만 ‘그 천사들’은 한국어에서 소유 관계가 다소 불분명할 수 있으므로, 그리스어 αὐτοῦ가 직접 가리키는 ‘내 아버지’와의 관계를 ‘그분의 천사들’로 밝혔습니다.
  naturalness: ‘흰옷’은 띄어쓰기상 ‘흰 옷’이 자연스럽고, 문체를 요청된 현대 합쇼체로 일관되게 정리했습니다. ‘시인하다’는 이 문맥에서 공개적으로 인정한다는 뜻을 충실히 전달합니다.
