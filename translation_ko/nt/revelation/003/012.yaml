- from: 이기는 자, 내가 그를 내 하나님의 성전에 기둥이 되게 하리니, 그는 결코 다시는 거기서 나가지 아니하리라[a]. 또 내가 그 위에 내 하나님의 이름과 내 하나님의 성, 곧 새 예루살렘—이것은 내 하나님께로부터 하늘에서 내려오는 성이다—의 이름과, 나의 새 이름을 기록하리라.
  to: 이기는 사람은 내가 그를 내 하나님의 성전에 기둥이 되게 하겠습니다. 그는 결코 다시는 그곳에서 나가지 않을 것입니다[a]. 또 내가 그 위에 내 하나님의 이름과 내 하나님의 도성, 곧 하늘에서 내 하나님에게서 내려오는 새 예루살렘의 이름과 나의 새 이름을 기록하겠습니다.
  rationale: 원문의 미래 약속 형식, ‘내 하나님’의 네 차례 반복, 성전의 기둥이라는 비유, 새 예루살렘의 하강, 그리고 마지막 ‘나의 새 이름’을 모두 유지했습니다. 도시를 뜻하는 πόλις는 현대적 오해를 피하기 위해 ‘도성’으로 바로잡았고, 관계절의 어순을 자연스럽게 조정했습니다. 강조 부정에 대한 각주는 해당 구절에 유지하되 현대 학술 용어로 정리했습니다.
