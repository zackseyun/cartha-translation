  verdict: revise
  source_fidelity: 핵심 구조와 반복되는 ‘내 하나님’은 대체로 잘 보존되었습니다. 다만 ‘성’은 현대 한국어에서 도시를 뜻하기보다 성곽으로 이해될 수 있어 πόλις의 의미를 정확히 전달하지 못하며, ‘내 하나님께로부터 하늘에서’는 원문의 ‘하늘에서, 내 하나님에게서’라는 출처의 순서와 관계를 다소 불분명하게 합니다.
  naturalness: 합쇼체의 미래 약속 표현으로 다듬고, 삽입 대시로 분리된 관계절을 명사구 안에 자연스럽게 통합했습니다. ‘결코 다시는’은 강조 부정을 자연스럽게 나타냅니다.
  terminology: ναός는 ‘성전’, στῦλος는 ‘기둥’, πόλις는 ‘도성’, καινὴ Ἰερουσαλήμ은 ‘새 예루살렘’으로 옮겼습니다. ‘도성’은 여기서 하나님의 도시라는 종말론적·상징적 표현을 보존하면서 ‘성’의 현대적 모호성을 피합니다.
