  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
  footnotes:
  - marker: a
    text: '''The key of David'' likely alludes to Isaiah 22:22, an image of royal authority to open and shut.'
    reason: cross_reference
  - marker: b
    text: Or 'messenger' for 'angel' (ἀγγέλῳ).
    reason: alternative_reading
translation:
  language: ko
  text: 빌라델비아에 있는 회중의 천사에게 써라. 「거룩하신 분, 참되신 분, 다윗의 열쇠를 가지신 분, 여시면 아무도 닫지 못하고 닫으시면 아무도 열지 못하시는 분[a]께서 이같이 말씀하신다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「다윗의 열쇠」는 이사야 22:22의 반향이며, 열고 닫는 왕적 권세의 이미지이다.
    reason: cross_reference
