revisions:
- from: 네가 내 인내의 말씀[a]을 지켰으므로, 나도 너를 장차 온 세상에 임할 시험의 때에서[b] 지키리니, 이는 땅에 거하는 자들을 시험하기 위함이다.
  to: 네가 내 인내의 말씀[a]을 지켰으므로, 나도 너를 온 사람이 사는 세상 전체에 닥쳐와 땅에 거하는 자들을 시험할 시험의 때로부터[b] 지키겠다.
  rationale: 수정문은 τηρέω의 과거와 미래의 대응을 「지켰으므로/지키겠다」로 유지하고, τηρήσω ἐκ는 「시험의 때로부터 지키겠다」로 명료하게 옮겼습니다. 이 표현은 환난 전 제거, 시험 중 보호, 시험의 효력으로부터의 면제 가운데 어느 하나를 단정하지 않습니다. 「온 사람이 사는 세상 전체」는 οἰκουμένη ὅλη의 범위를, 「땅에 거하는 자들」은 계시록의 반복 표현을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:03Z'
review_pass:
  verdict: revise
  source_fidelity: 주요 의미와 반복되는 τηρέω의 연결을 대체로 잘 살렸습니다. 다만 「시험의 때에서 지키리니」는 τηρήσω ἐκ의 ‘~로부터 지키다’를 충분히 명료하게 드러내지 못하며, 「온 세상」은 οἰκουμένη의 ‘사람이 사는 세계’라는 뉘앙스를 다소 평준화합니다. 목적 부정사 πειράσαι는 시험의 때가 닥치는 목적을 나타내므로 문장 안에서 그 수식 관계를 더 분명히 하는 편이 좋습니다.
  naturalness: 합쇼체의 격식 있는 문체는 대체로 적절합니다. 그러나 「온 세상에 임할 시험의 때에서」는 수식이 길고 「때에서 지키다」가 다소 어색합니다. 「온 사람이 사는 세상 전체에 닥쳐와 … 시험할 시험의 때로부터」로 하면 자연스러우면서도 원문의 구조를 유지합니다.
  terminology: 「인내의 말씀」, 「시험」, 「땅에 거하는 자들」은 계시록의 표현과 신학적 중립성을 잘 유지합니다. 각주에서는 「헬라어」보다 현대 학술 표준어인 「그리스어」가 더 적절하며, 「인내를 부르는」은 한국어로 부자연스러워 「인내를 요구하는」으로 고치는 것이 좋습니다.
