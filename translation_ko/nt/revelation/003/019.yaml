  verdict: revise
  source_fidelity: The draft correctly represents the sequence of loving correction (ἐλέγχω καὶ παιδεύω), the inferential οὖν, zeal, and repentance. However, 「무릇」 does not naturally render the indefinite relative construction ὅσους ἐὰν, and the final imperatives are not in the required modern formal-polite 합쇼체.
  naturalness: 「무릇」 is archaic and syntactically unnatural in this context. 「내가 사랑하는 사람은 누구든지」 is idiomatic contemporary Korean and conveys the open-ended class indicated by ὅσους ἐὰν. The revision also consistently uses 합쇼체.
  terminology: 「책망하다」 appropriately renders ἐλέγχω, 「징계하다」 is a suitable established rendering of παιδεύω when qualified by the supplied explanatory footnote, 「열심을 내다」 accurately conveys ζήλευε, and 「회개하다」 is the standard precise rendering of μετανόησον.
  issues:
  - severity: medium
    issue: Register mismatch in the imperative forms
    rationale: 「열심을 내고 회개하라」 is plain imperative (해라체), whereas the requested target register is modern formal-polite 합쇼체.
  - severity: low
    issue: Archaic and imprecise rendering of ὅσους ἐὰν
    rationale: 「무릇」 is not natural modern Korean here and does not clearly express the indefinite sense, ‘all/any whom.’
  - severity: low
    issue: Unnecessary repeated subject pronoun
    rationale: 「내가 사랑하는 자를 내가」 is grammatically possible but marked and less natural. The source’s emphatic ἐγώ can be represented naturally by initial 「나는」 without repeating 「내가」 before both verbs.
