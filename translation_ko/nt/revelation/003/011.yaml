  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
  footnotes:
  - marker: a
    text: Or 'quickly.' The Greek adverb can emphasize either nearness in time or swiftness of action.
    reason: alternative_reading
  - marker: b
    text: The Greek word refers to a victor's wreath or honor-crown, not specifically a royal diadem.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 곧 오겠습니다[a]. 네가 가진 것을 굳게 붙드십시오. 아무도 네 면류관[b]을 빼앗지 못하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「속히 오겠습니다」. 헬라어 부사는 시간적 가까움이나 행동의 신속함을 모두 강조할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 헬라어는 승리자의 화관이나 명예의 관을 가리키며, 특별히 왕권을 상징하는 왕관(디아뎀)을 뜻하지는 않습니다.
    reason: lexical_alternative
