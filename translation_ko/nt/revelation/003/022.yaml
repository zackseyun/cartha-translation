    rationale: 계시록 2–3장의 정형구에서 τὸ πνεῦμα는 성령을 가리킵니다. 한국어에서는 ‘성령’으로 옮기는 것이 문맥 충실성과 자연스러운 신학 용어 사용에 부합합니다.
  - severity: medium
    issue: ἐκκλησίαις를 ‘회중들에게’로 옮겼습니다.
    rationale: 문맥상 여러 지역 교회를 수신자로 하는 표현이므로 ‘교회들에게’가 더 직접적이고 확립된 번역입니다.
  - severity: low
