  source_fidelity: 초안은 ‘귀 있는 자’, ‘영’, ‘회중들에게’, ‘들으라’로 원문의 기본 구조를 대체로 반영합니다. 다만 계시록 2–3장의 반복된 문맥에서 τὸ πνεῦμα는 성령을 가리키며, ἐκκλησίαις는 ‘교회들에게’가 더 정확하고 확립된 대응어입니다.
  naturalness: ‘귀 있는 자는 … 들으라’는 이해 가능하나 현대 표준어 합쇼체로는 ‘귀 있는 사람은 … 들으십시오’가 더 자연스럽고 지정된 높임말 문체에 맞습니다. 초안 끝의 닫는 인용부호는 짝이 없어 삭제해야 합니다.
  terminology: ‘성령’은 본문 문맥상 τὸ πνεῦμα의 지시 대상을 자연스럽게 드러내며, ‘교회들’은 계시록의 수신 공동체를 가리키는 ἐκκλησίαις의 통상적이고 문맥상 적절한 번역입니다. ‘회중’은 가능한 일반어이나 여기서는 ‘교회들’보다 덜 적합합니다.
  issues:
