base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
  footnotes:
  - marker: a
    text: Or 'the source/origin of God's creation' or 'the ruler over God's creation.' The Greek word archē can mean 'beginning,' 'origin,' or 'ruler.'
    reason: alternative_reading
  - marker: b
    text: Or 'messenger' of the church in Laodicea.
    reason: lexical_alternative
translation:
  language: ko
  text: 라오디게아에 있는 교회의 천사에게 이렇게 쓰십시오. “아멘이시며 신실하고 참된 증인이시고 하나님의 창조의 시작[a]이신 분께서 이렇게 말씀하십니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 창조의 근원” 또는 “하나님의 창조의 통치자.” 헬라어 ἀρχή는 “시작”, “근원”, 또는 “통치자”를 뜻할 수 있다.
    reason: alternative_reading
