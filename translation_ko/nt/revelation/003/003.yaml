revisions:
- from: 그러므로 네가 어떻게 받았고 들었는지를 기억하고, 그것을 지키며 회개하라. 그러므로 만일 네가 깨어 있지 아니하면, 내가 도둑같이 가리니[a], 어느 시각에 너에게 가겠는지 너는 결코 알지 못하리라.
  to: 그러므로 당신이 어떻게 받았고 들었는지를 기억하고, 그것을 지키며 회개하십시오. 그러므로 당신이 깨어 있지 않으면, 내가 도둑처럼 오겠습니다[a]. 내가 어느 시각에 당신에게 올지 당신은 결코 알지 못할 것입니다.
  rationale: The revision retains πῶς (“어떻게”) rather than resolving it into the content received, keeps the command to guard what was received and heard, and leaves the scope of Christ’s unexpected coming unspecified. It updates the whole passage and its footnote to modern formal-polite Korean, makes the future coming explicit, and preserves the Greek emphatic negation.
