review_pass:
  verdict: revise
  source_fidelity: The draft conveys the sequence of imperatives and the warning accurately overall. However, “도둑같이 가리니” uses an archaic and potentially ambiguous form; ἥξω means “I will come,” not simply “go.” The revision renders the future coming explicitly and retains the emphatic force of οὐ μὴ γνῷς as “결코 … 못할 것입니다.”
  naturalness: The draft's “깨어 있지 아니하면,” “가리니,” and “못하리라” are archaic and do not meet the requested modern formal-polite 합쇼체 register. The revision uses contemporary formal-polite forms while preserving the direct address and solemn warning.
  terminology: “기억하고,” “지키며,” and “회개하십시오” are appropriate renderings of μνημόνευε, τήρει, and μετανόησον. “도둑처럼” naturally expresses ὡς κλέπτης without implying that the coming itself is theft. “어느 시각에” preserves the specificity of ποίαν ὥραν.
  issues:
  - severity: medium
    issue: “도둑같이 가리니” is archaic and does not clearly express the future verb ἥξω (“I will come”).
    rationale: Modern Korean readers may take “가리니” as a literary/archaic form, and it is less direct than the Greek future warning. “도둑처럼 오겠습니다” is both faithful and natural in the required register.
  - severity: medium
    issue: Several verbal endings are not modern formal-polite 합쇼체.
    rationale: “지키며 회개하라,” “있지 아니하면,” and “알지 못하리라” conflict with the specified target register. Formal-polite imperative and future forms correct this without altering meaning.
  - severity: low
    issue: The existing footnote quotes the draft's archaic wording rather than the revised wording.
    rationale: Its quoted lemma should match the translated text and should describe unexpected coming without deciding its referent.
  revised_text: 그러므로 당신이 어떻게 받았고 들었는지를 기억하고, 그것을 지키며 회개하십시오. 그러므로 당신이 깨어 있지 않으면, 내가 도둑처럼 오겠습니다[a]. 내가 어느 시각에 당신에게 올지 당신은 결코 알지 못할 것입니다.
