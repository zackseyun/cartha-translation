review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 어휘와 비유를 대체로 충실히 옮깁니다. 다만 ‘적은 힘을 가지고 있으면서도’는 원문의 접속사 καί를 양보·대조의 ‘-면서도’로 특정합니다. 원문은 ‘힘이 미약하고, 말씀을 지키며, 이름을 부인하지 않은’ 사실들을 ὅτι 아래 병렬로 제시하므로, 이를 병렬적으로 유지하는 편이 더 정확합니다.
  naturalness: ‘열린 문’과 ‘문을 두었습니다’는 자연스럽고 현대 표준어에 맞습니다. 합쇼체 요구에 맞추어 서술을 ‘알고 있습니다/두었습니다/때문입니다’로 통일했습니다.
  terminology: ‘행위’, ‘열린 문’, ‘내 말’, ‘내 이름을 부인하다’는 계시록의 반복 표현과 신학적 함의를 불필요하게 해설하지 않고 보존합니다. ‘열린’은 완료 수동 분사가 나타내는, 열려진 문의 상태를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: ‘-면서도’가 원문의 병렬을 양보 관계로 바꿈
    rationale: ὅτι 이하의 μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησας, καὶ οὐκ ἠρνήσω는 καί로 연결된 진술입니다. ‘힘이 미약하고… 지켰으며… 부인하지 않았기 때문입니다’로 옮겨 원문의 관계를 보존합니다.
  - severity: low
    issue: 초안의 종결 표현이 합쇼체 요구와 일관되지 않음
    rationale: ‘안다’, ‘두었으니’, ‘아니하였다’는 문어적 평서체입니다. 요청된 현대 공식-공손 합쇼체에 맞게 종결을 조정합니다.
  - severity: low
    issue: 영어 감사 기록의 ‘열린 문’ 관련 각주 표지가 한국어 초안에 없음
    rationale: 어휘적 대안과 그리스어 분사의 명시성을 알리는 각주를 해당 명사에 붙여 감사 추적을 보존합니다.
