revisions:
- from: 네가 말하기를, 「나는 부자이며 부요해졌으니 아무 부족함이 없다」 하지만, 너 자신이 곤고하고 가련하고 가난하고 눈멀고 벌거벗은 자임을 너는 알지 못한다.
  to: 이는 네가 ‘나는 부자이고 부유해졌으며 아무것도 필요하지 않다’라고 말하고, 네가 바로 곤고하고 가련하며 가난하고 눈멀고 벌거벗었다는 것을 알지 못하기 때문이다.
