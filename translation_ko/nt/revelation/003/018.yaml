review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the three metaphorical commodities and their purposes. However, it renders the Greek purpose clauses (ἵνα) as independent imperatives (''부요하게 되라'' etc.), which weakens the syntactic relationship: the buying is counseled in order that the stated results may follow. The supplied repetition of ''사서'' with the white garments and eye medicine is a natural Korean expression of the Greek''s coordinated, ellipted objects and is acceptable.'
  naturalness: The draft is generally clear, but the shift from '권하노니' to repeated blunt imperatives is less smooth in modern formal-polite Korean. '권합니다' with purpose-oriented '…하도록 하십시오' is natural 합쇼체 and better reflects the source syntax. '안연고' more precisely communicates a salve/medicinal preparation applied to the eyes than the broader term '안약.'
  terminology: '''불로 정련된 금,'' ''흰 옷,'' and ''벌거벗은 모습의 수치'' preserve the imagery without importing an interpretation. ''안연고'' and its cultural note retain the medical sense of κολλούριον without imposing sacramental meaning.'
  issues:
  - severity: medium
    issue: Purpose clauses are rendered as direct commands.
    rationale: The three ἵνα clauses express the intended results of obtaining and using the commodities. Korean '…하도록 하십시오/…않도록 하십시오' preserves this relationship more faithfully than '부요하게 되라' and '보게 하라.'
  - severity: low
    issue: The term '안약' is broader than the medicinal salve denoted by κολλούριον.
    rationale: While understandable, '안연고' better conveys a preparation applied to the eyes, in accord with the Greek and the audit note.
  revised_text: 내가 너에게 권합니다. 내게서 불로 정련된 금을 사서 부요하게 되도록 하십시오. 또 흰 옷을 사서 입어 네 벌거벗은 모습의 수치가 드러나지 않도록 하십시오. 또 안연고[a]를 사서 네 눈에 발라 보도록 하십시오.
