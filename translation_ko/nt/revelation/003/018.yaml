  to: 내가 너에게 권합니다. 내게서 불로 정련된 금을 사서 부요하게 되도록 하십시오. 또 흰 옷을 사서 입어 네 벌거벗은 모습의 수치가 드러나지 않도록 하십시오. 또 안연고[a]를 사서 네 눈에 발라 보도록 하십시오.
