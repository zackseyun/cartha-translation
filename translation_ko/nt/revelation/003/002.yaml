  source_fidelity: γίνου γρηγορῶν calls for ongoing watchfulness; ‘깨어 일어나’ adds a redundant rising nuance. ἃ ἔμελλον ἀποθανεῖν is preserved by ‘죽어 가려는,’ and πεπληρωμένα is accurately conveyed as works being ‘온전히 이루어진.’
