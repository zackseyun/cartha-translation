  text: 거기에 앉아 계신 분은 벽옥과 홍옥수[a]처럼 보이셨고, 보좌 주위에는 에메랄드처럼 보이는 무지개[b]가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
