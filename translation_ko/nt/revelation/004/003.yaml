  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
  footnotes:
  - marker: a
    text: Or 'sardius,' a traditional rendering for the gemstone here translated 'carnelian.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a halo' for 'rainbow'; the Greek term can denote a rainbow-like radiance.
    reason: lexical_alternative
translation:
