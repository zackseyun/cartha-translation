  rationale: 원문의 ἐγενόμην이 나타내는 상태 진입은 ‘있게 되었습니다’로 유지하고, ἐν πνεύματι의 해석상 열린 의미는 본문 ‘영 안에’와 정확한 대안 각주로 보존했습니다. 잘못된 ‘들리었다’ 대안을 제거했으며, 보좌에 앉은 이를 원문의 명사화 분사에 맞게 ‘한 분’으로 옮겼습니다.
