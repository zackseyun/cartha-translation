  source_fidelity: 본문은 대체로 원문의 순서와 의미를 충실히 옮깁니다. 다만 ἐν πνεύματι의 대안 각주는 원문이 뜻하지 않는 ‘들리었다’를 제시하여 수정이 필요합니다. ἐγενόμην의 상태로 들어가는 뉘앙스는 ‘있게 되었습니다’로 보존할 수 있습니다.
  naturalness: ‘곧’보다 ‘곧바로’가 εὐθέως의 즉각성을 더 자연스럽게 드러냅니다. ‘그 보좌 위에 앉으신 분이 계셨습니다’도 이해되나, ‘한 분이 앉아 계셨습니다’가 그리스어의 명사화 분사와 문장 흐름을 더 직접적으로 반영합니다.
