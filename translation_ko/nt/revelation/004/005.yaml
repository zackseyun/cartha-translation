  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
  footnotes:
  - marker: a
    text: Or 'voices' for 'sounds.'
    reason: lexical_alternative
  - marker: b
    text: Or 'seven torches of fire burning before the throne.'
    reason: lexical_alternative
  - marker: c
    text: Many understand 'the seven spirits of God' as a symbolic way of speaking about the fullness of the one Holy Spirit; the Greek text itself reads 'seven spirits.'
    reason: alternative_reading
translation:
  language: ko
  text: 보좌에서 번개와 소리[a]와 우렛소리가 나옵니다. 또 보좌 앞에는 불의 일곱 등불[b]이 타오르고 있으며, 이 일곱 등불은 하나님의 일곱 영[c]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「음성」.
    reason: lexical_alternative
  - marker: b
    text: 또는 「보좌 앞에서 타오르는 일곱 불의 횃불」.
    reason: lexical_alternative
  - marker: c
    text: 「하나님의 일곱 영」을 한 분이신 성령의 충만함을 상징적으로 가리키는 표현으로 이해하는 이들이 많다. 본문 자체는 「일곱 영」이라고 한다.
    reason: alternative_reading
