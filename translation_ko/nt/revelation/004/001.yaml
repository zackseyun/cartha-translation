revisions:
- from: 이 일들 후에 내가 보니, 보라, 하늘에 열린 문이 있었습니다. 그리고 내가 처음에 들었던 그 음성, 곧 나에게 말씀하시던 나팔 소리 같은 그 음성이 이르시기를, 「이리로 올라오라[a]. 내가 이 일들 후에 반드시 일어날 일들을 네게 보이리라」 하셨습니다.
  to: 이 일들 후에 내가 보니, 보라, 하늘에 문이 열려 있었습니다. 그리고 내가 처음 들었던 음성[a], 곧 나와 말하던 나팔 소리 같은 그 음성이 말했습니다. 「이리로 올라오라. 내가 이 일들 후에 반드시 일어나야 할 일들을 네게 보여 주겠다.」
  rationale: 각주 표지를 해당 선행사로 이동하고, 열린 문의 지속 상태와 δεῖ의 필연성을 더 명확히 했습니다. 또한 현대 표준어 합쇼체에 맞게 고어적 종결과 중복된 발화 도입을 다듬었습니다. 반복된 ‘이 일들 후에’와 나팔에 비유된 음성이라는 원문의 표현은 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:12Z'
review_pass:
  verdict: revise
  source_fidelity: 개역 초안은 하늘의 열린 문, 음성, 위로 올라오라는 명령, 그리고 반복되는 시간 표현을 대체로 충실히 옮겼습니다. 그러나 δεῖ의 필연성은 ‘반드시 일어날’보다 ‘반드시 일어나야 할’이 더 직접적이며, 완료 수동 분사의 결과 상태는 ‘열려 있는/열려 있었습니다’로 분명히 하는 것이 좋습니다. 또한 ‘처음의 음성’에 관한 주석 표지가 본문에서는 ‘이리로 올라오라’에 붙어 있어 해당 어구로 옮겨야 합니다.
  naturalness: ‘보이리라’는 현대 표준어 합쇼체 번역문으로는 다소 고어적이므로 ‘보여 주겠다’로 고쳤습니다. ‘이르시기를 … 하셨습니다’의 이중 서술도 ‘말했습니다’로 간결하게 정리했습니다. ‘보라’는 ἰδού의 환기 기능을 보존하는 성서적 담화 표지로 유지할 수 있습니다.
  terminology: ‘음성’과 ‘하늘’은 적절합니다. ‘나팔 소리 같은’은 음성의 비유임을 유지하되, ‘나와 말하던’으로 μετ’ ἐμοῦ의 ‘나와’라는 표현을 보존했습니다. 원문 자체가 그 비유구의 정확한 수식 범위에 다소 압축적인 표현을 쓰므로 이를 과도하게 해석하지 않았습니다.
  issues:
  - severity: medium
    issue: 각주 a의 앵커가 ‘이리로 올라오라’에 붙어 있습니다.
    rationale: 각주는 ‘내가 처음 들었던 음성’(ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα) 및 계 1:10과의 관련을 설명하므로 그 어구에 붙어야 합니다.
  - severity: medium
    issue: ‘이 일들 후에 반드시 일어날 일들’이 δεῖ의 필연성을 충분히 명시하지 않습니다.
    rationale: δεῖ는 단순 미래가 아니라 ‘일어나야 한다’는 필연·필수의 표현입니다.
  - severity: low
    issue: ‘보이리라’와 ‘이르시기를 … 하셨습니다’가 현대적 문체와 다소 거리가 있습니다.
    rationale: 현대 합쇼체 서술에서는 ‘보여 주겠다’, ‘말했습니다’가 자연스럽고 의미 손실이 없습니다.
