  source_fidelity: 개정이 필요합니다. 그리스어의 세 동사 πεσοῦνται, προσκυνήσουσιν, βαλοῦσιν은 모두 미래형인데, 초안의 ‘엎드려, 경배하며, 던지며 이렇게 말합니다’는 현재적 서술로 읽힙니다. ‘보좌에 앉으신 분’, ‘영원무궁토록 살아 계신 분’, ‘면류관’은 원문의 의미를 적절히 반영합니다.
  naturalness: ‘앉아 계신 분’은 존대 주체에 더 자연스러운 현대 표준어입니다. 미래의 일련된 행동을 ‘…하고, …하고, …던지며 이렇게 말할 것입니다’로 연결하면 합쇼체 문체 안에서 자연스럽고 원문의 순서를 유지합니다.
  terminology: ‘장로’, ‘보좌’, ‘경배’, ‘면류관’은 요한계시록 문맥에서 통용되는 적절한 용어입니다. στέφανος의 ‘승리 화관’ 뉘앙스와 εἰς τοὺς αἰῶνας τῶν αἰώνων의 직역 가능성은 각주로 보존합니다.
  issues:
