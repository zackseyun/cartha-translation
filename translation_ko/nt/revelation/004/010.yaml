  - severity: low
    issue: 영어 감사 추적의 각주 위치와 내용 불일치
    rationale: 영어 본문의 [a]는 ‘보좌’ 뒤에 있으나 각주 내용은 ‘영원무궁토록’에 관한 것입니다. 한국어에서는 해당 표현 뒤에 각주를 배치해 의미상 올바른 고정을 제공합니다.
  revised_text: 스물네 장로들은 보좌에 앉아 계신 분 앞에 엎드리고, 영원무궁토록[a] 살아 계신 분께 경배하고, 자기들의 면류관을 보좌 앞에 던지며 이렇게 말할 것입니다.
  revised_footnotes:
