  source_fidelity: 그리스어의 반복된 ἀριθμός는 본문에서 ‘수’로 반복하여 살리는 것이 좋습니다. δισμυριάδες μυριάδων는 계산 가능한 수인 2억을 가리키므로 본문에 ‘이억’을 쓰고 직역을 각주로 제시하는 것이 정확하고 이해하기 쉽습니다. ‘기마병 군대’는 한국어에서 다소 중복적이고 부자연스러우며, στρατευμάτων τοῦ ἱππικοῦ는 ‘기병 부대들’로 옮기는 편이 자연스럽습니다.
  naturalness: ‘기병 부대들의 수’와 ‘나는 그 수를 들었습니다’는 현대 표준 한국어의 합쇼체 문장으로 자연스럽습니다. 기존의 ‘이만만’은 일반 독자에게 불투명하므로 본문에서는 ‘이억’이 적절합니다.
  terminology: ἱππικόν은 집합적 군사 용어로 ‘기병’/‘기병대’를 뜻하며, στρατεύματα의 복수를 반영하여 ‘기병 부대들’로 번역했습니다. 수 표현의 직역은 본문의 수치와 구별하여 각주에 남겼습니다.
