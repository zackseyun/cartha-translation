  source_fidelity: 개정이 필요합니다. 초안은 전반적인 장면을 충실히 옮기지만, ἐκπορεύεται의 현재 시제를 과거진행형(“나오고 있었습니다”)으로 옮겼습니다. 또한 ‘이러하였습니다’는 말들과 그 위의 사람들을 한데 묶어 서술하는 원문의 구조를 다소 흐립니다.
