  terminology: θώρακες는 ‘흉배’로 유지했습니다. πυρίνους, ὑακινθίνους, θειώδεις는 시각적 묘사라는 문맥을 반영하되, 색조를 지나치게 특정하지 않도록 ‘불 같은, 히아신스색의, 유황색의’로 옮겼습니다. θεῖον은 현대어 ‘유황’이 적절합니다.
  issues:
