  to: 나는 환상에서 말들과 그 위에 앉아 있는 이들을 이렇게 보았습니다. 그들은 불 같은, 히아신스색의, 유황색의 흉배를 갖추고 있었습니다. 말들의 머리는 사자들의 머리와 같았고, 그 입들에서는 불과 연기와 유황이 나옵니다.
