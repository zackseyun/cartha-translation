  source_fidelity: 첫 문장의 '괴롭게 하라는 것이 주어졌습니다'는 허락/위임의 수동 표현과 목적 내용을 대체로 전달하지만, 한국어로는 다소 부자연스럽고 명령 자체가 주어진 것처럼 들릴 수 있습니다. '괴롭게 하도록 ... 허락이 주어졌습니다'로 옮기면 ἐδόθη와 두 ἵνα절의 대조를 더 충실히 드러냅니다. δεύτε 문장의 '그것들의 괴롭힘'은 αὐτῶν이 가리키는 그들이 가하는 고통을 충분히 자연스럽게 나타내지 못합니다.
  naturalness: '''그것들의 괴롭힘''은 현대 표준 한국어에서 행위자의 고통인지, 그들이 겪는 괴로움인지 불분명하고 어색합니다. ''그것들이 주는 고통'' 및 ''전갈이 사람을 쏠 때의 고통''이 자연스럽고 문맥상 명료합니다.'
  terminology: βασανισθήσονται/βασανισμός의 반복은 '괴롭게 하다/고통'으로 유지했습니다. '전갈이 ... 쏠 때'는 전갈의 문맥에서 자연스러운 표현이나, παίω의 더 넓은 기본 의미를 반영하는 대안을 각주로 남깁니다. 신적 수동태의 행위자는 명시하지 않았습니다.
