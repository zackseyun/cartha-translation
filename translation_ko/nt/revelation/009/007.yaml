translation:
  language: ko
  text: 메뚜기들의 모양들은 전쟁을 위해 준비된 말들과 같았고, 그들의 머리 위에는 금과 같은 왕관 같은 것들[a]이 있었으며, 그들의 얼굴은 사람들의 얼굴과 같았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘승리 화관들’. 그리스어 στέφανοι는 명예나 승리와 관련된 화관 모양의 관을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘사람들의 얼굴들’입니다. 이 표현은 남성에만 한정되지 않는 일반적 표현입니다.
    reason: lexical_alternative
