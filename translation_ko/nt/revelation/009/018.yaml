  source_fidelity: 초안은 ‘이 세 재앙’, ‘인류의 삼분의 일’, ‘죽임을 당하다’, 불·연기·유황 및 입에서 나옴이라는 핵심 요소를 대체로 충실히 옮겼습니다. 다만 ‘그것들의 입’은 선행 대상이 불분명하며, 헬라어 복수 소유격은 앞 문맥의 말들을 가리킵니다. 또한 ‘재앙으로 인하여 … 때문이었습니다’는 원문의 수단·원인 구조를 한국어에서 중복되고 어색하게 만듭니다.
