  verdict: revise
  source_fidelity: The draft accurately conveys the locust-like beings, their scorpion-like tails, stingers, and their authority/power to harm people for five months. However, the Greek plural possessive αὐτῶν and plural «tails» are more clearly represented by «그들의 꼬리에는» than by the collective-singular «그 꼬리에».
  naturalness: The sentence is natural modern formal-polite Korean. «전갈 같은» is idiomatic, and «침» suitably renders κέντρα in this scorpion image. The small revision improves referential clarity without making the Korean cumbersome.
  terminology: «권세» is an established and appropriate rendering of ἐξουσία in Revelation; in this context «사람들을 … 해할 권세» naturally expresses the operative authority/capacity intended. «사람들» correctly conveys the generic force of τοὺς ἀνθρώπους.
  issues:
  - severity: low
    issue: The phrase «그 꼬리에» uses a collective singular reference where the Greek has «in their tails».
    rationale: Although understandable in Korean, «그들의 꼬리에는» more directly preserves both the plural anatomy and the possessive relation in the source.
  revised_text: 또 그것들은 전갈 같은 꼬리와 침을 가지고 있었으며, 그들의 꼬리에는 사람들을 다섯 달 동안 해할 권세가 있었습니다.
