  source_fidelity: 개정이 필요합니다. πεπτωκότα는 완료분사이므로 요한이 별을 보았을 때 그 별은 이미 하늘에서 땅으로 떨어진 상태였음을 본문에서 드러내야 합니다. 또한 φρέαρ는 단순한 ‘굴’보다 ‘구덩이/갱의 통로’ 계열이 적절합니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. 다만 ‘떨어졌고’는 보는 행위와 낙하를 동시 사건처럼 읽히게 할 수 있어 ‘떨어진 한 별을 보았습니다’가 더 정확하고 자연스럽습니다. ‘무저갱의 구덩이’는 다소 중첩적으로 들리지만 원문의 ‘abyss의 shaft/pit’라는 구별을 보존합니다.
  terminology: ‘천사’, ‘나팔’, ‘하늘’, ‘무저갱’은 적절합니다. 별을 천사나 사탄으로 본문에서 특정하지 않고, 수여자의 남성 지시를 ‘그에게’로 유지해야 합니다.
  issues:
