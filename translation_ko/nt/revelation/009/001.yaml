    issue: 완료분사 πεπτωκότα의 시제·상 반영
    rationale: 초안의 ‘별이 … 떨어졌고’는 요한이 본 뒤 또는 그와 동시적으로 떨어진 사건으로도 읽힐 수 있습니다. 원문은 별이 이미 떨어진 상태에서 요한이 그것을 보았음을 나타냅니다.
  - severity: medium
    issue: φρέαρ를 ‘굴’로 번역
    rationale: φρέαρ는 우물·구덩이·수직 갱(shaft)을 뜻합니다. ‘굴’은 동굴이나 짐승의 굴을 연상시켜 접근 통로/구덩이라는 원문의 이미지를 충분히 반영하지 못합니다.
  - severity: low
    issue: 별의 인격적 지시 가능성에 관한 주석 누락
    rationale: 본문은 ‘별’을 유지해야 하지만, 뒤의 남성 단수 대명사 αὐτῷ는 인격적 존재를 시사할 수 있습니다. 이는 본문 해석을 강제하지 않는 범위에서 주석으로 밝혀 둘 수 있습니다.
