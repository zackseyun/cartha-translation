- from: 그것들은 철 흉배 같은 흉배를 가지고 있었고, 그것들의 날갯소리는 많은 말을 단 병거가 싸움터로 달려가는 소리 같았습니다.
  to: 그것들은 철 흉갑 같은 흉갑을 가지고 있었고, 그것들의 날개 소리는 많은 말이 끄는 병거들이 싸움터로 달려가는 소리 같았습니다.
