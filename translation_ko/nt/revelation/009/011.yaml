  source_fidelity: 그리스어 현재형 ἔχουσιν과 반복되는 명명 표현을 반영해야 합니다. 초안의 과거형 「가지고 있었으니」는 현재 서술인 원문과 맞지 않으며, 「곧 … 천사입니다」는 왕과 천사를 동격으로 처리하여 문장 구조가 다소 부정확합니다.
  naturalness: 「그들은 자기들 위에 왕으로 … 두고 있습니다」가 현대 표준어 합쇼체로 자연스럽고 원문의 ‘have … as king’ 구조를 충실히 나타냅니다. 언어명은 현대 표준어인 「그리스어」를 사용했습니다.
  terminology: βασιλέα는 「왕」, ἄγγελον τῆς ἀβύσσου는 「무저갱의 천사」로 옮겼습니다. 고유명사 「아바돈」과 「아폴리온」은 음역으로 유지하고 각주에서 뜻을 밝혔습니다. 「무저갱」의 전통적 대안인 「끝없는 구덩이」도 각주로 제시했습니다.
  issues:
