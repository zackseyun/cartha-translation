review_pass:
  verdict: revise
  source_fidelity: 초안은 장로들 가운데 한 사람이 요한에게 응답하고, 흰 옷 입은 이들의 정체와 출처를 묻는다는 원문의 핵심 의미를 대체로 충실히 옮겼습니다. 다만 ἀπεκρίθη는 ‘대답하여’로 명시하는 편이 정확하며, περιβεβλημένοι의 현재적 상태는 ‘입고 있는’이 더 잘 드러냅니다.
  naturalness: ‘말하여 이르기를 … 하였습니다’는 직접 인용문과 결합할 때 현대 표준어 합쇼체로 다소 부자연스럽고 서술 종결도 우회적입니다. ‘대답하여 말했습니다’ 및 인용문 안의 ‘왔습니까?’가 자연스럽고 일관된 합쇼체입니다.
  terminology: ‘장로’, ‘두루마기’는 요한계시록의 문맥과 한국어 성경 전통에서 모두 무난합니다. ‘흰 두루마기’는 τὰς στολὰς τὰς λευκάς를 충실히 반영합니다.
  issues:
