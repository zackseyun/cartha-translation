  rationale: 원문의 ‘대답하다’와 완료분사의 상태성을 보존하고, 직접화법 및 문장 종결을 현대 표준어 합쇼체로 자연스럽게 정리했습니다. πόθεν ἦλθον은 출처를 묻는 과거형 질문으로 ‘어디에서 왔습니까?’라고 옮겼습니다.
