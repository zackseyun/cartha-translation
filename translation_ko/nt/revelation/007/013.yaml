    rationale: ‘말하여 이르기를 … 하였습니다’는 ἀπεκρίθη의 ‘대답하다’를 직접 반영하지 못하고, 직접화법 뒤의 ‘하였습니다’가 현대적 문장 흐름에 어색합니다.
  - severity: low
    issue: 합쇼체 일관성
    rationale: 인용문 끝의 ‘왔느냐?’는 현대 formal-polite 합쇼체가 아닙니다. ‘왔습니까?’로 바꾸는 것이 지정된 등록에 맞습니다.
  - severity: low
    issue: 완료분사의 상태성
    rationale: περιβεβλημένοι는 입혀진 결과의 현재 상태를 가리키므로 ‘입은’보다 ‘입고 있는’이 이를 더 분명히 나타냅니다.
