review_pass:
  verdict: revise
  source_fidelity: ‘다시 주리지 아니하며’ can be read as ‘will not hunger again,’ whereas the negated ἔτι in this consolatory future promise more naturally means ‘no longer.’ The final clause should also convey the emphatic οὐδὲ μή negation. ‘그 어떤 뜨거운 열기’ appropriately represents πᾶν καῦμα under negation.
  naturalness: The repeated ‘-지 아니하며’ is grammatical but somewhat stiff in modern formal Korean. ‘더 이상 … -지도 않고 … -지도 않으며’ is natural, maintains the parallel clauses, and retains a formal-polite conclusion.
  terminology: ‘주리다,’ ‘목마르다,’ ‘해,’ and ‘뜨거운 열기’ are clear and suitably noninterpretive. ‘내리쬐다’ naturally expresses the sun’s or scorching heat’s impact without importing a theological interpretation.
  issues:
  - severity: medium
    issue: ‘다시 주리지 아니하며’ is potentially ambiguous.
    rationale: It can suggest that they will not become hungry again, rather than that hunger has ceased permanently. ‘더 이상 주리지도 않고’ clearly conveys οὐ … ἔτι.
  - severity: low
    issue: The emphatic future negation in the final clause is not explicit.
    rationale: οὐδὲ μὴ πέσῃ is an emphatic negation. Adding ‘결코’ safely reflects this force while retaining the concrete image.
  revised_text: 그들은 더 이상 주리지도 않고 목마르지도 않으며, 해나 그 어떤 뜨거운 열기도 결코 그들 위에 내리쬐지 않을 것입니다.
