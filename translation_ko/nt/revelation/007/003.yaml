    text: 또는 「종들」 또는 「종속된 사람들」. 헬라어 δούλους는 주인에게 속한 사람들을 가리킬 수 있으며, 여기서는 그 귀속의 뉘앙스를 살려 「노예들」로 옮겼습니다.
    reason: lexical_alternative
