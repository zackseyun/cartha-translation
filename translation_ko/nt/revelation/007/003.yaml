  source_fidelity: 핵심 어휘와 문장 관계는 대체로 충실합니다. ἀδικήσητε는 심판의 물리적 손상을 가리키므로 「해치다」가 적절하고, γῆ/θάλασσα/δένδρα 및 ἄχρι의 시간 한계도 보존됩니다. 「우리 하나님의 노예들」은 τοὺς δούλους τοῦ θεοῦ ἡμῶν의 소유·귀속의 뉘앙스를 유지합니다.
  naturalness: 현행 인용문 안의 「해하지 말라」는 현대 합쇼체 지정과 맞지 않습니다. 「해치지 마십시오」가 현대의 격식 있는 명령 표현으로 자연스럽습니다. 또한 「… 하였습니다」보다 「…라고 말했습니다」가 λέγων을 한국어 서술에 자연스럽게 연결합니다.
  terminology: 「인」과 「이마에 인을 치다」는 σφραγίζω의 묵시문학적 표지 행위를 적절히 옮깁니다. 「노예들」은 프로젝트의 δοῦλος 원칙과 영어 POB 결정을 따릅니다. 다만 각주의 「매인 자들」은 현대 한국어에서 δοῦλος의 자연스러운 어휘 대안이 아니므로 「종들」 및 「종속된 사람들」로 정리합니다.
