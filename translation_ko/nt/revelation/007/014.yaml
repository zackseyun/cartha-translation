  source_fidelity: 개정문은 καί를 인과적 의미의 「그래서」가 아니라 접속적 「그리고」로 옮기고, 현재분사 οἱ ἐρχόμενοι를 「나오는 이들」로 유지합니다. θλίψεως τῆς μεγάλης는 해석을 덧붙이지 않고 「큰 환난」으로, ἐν τῷ αἵματι는 역설적 이미지를 보존하는 「어린 양의 피에」로 옮겼습니다.
  naturalness: 초안의 「아시나이다」「자들이라」「하였느니라」는 목표인 현대 합쇼체와 맞지 않습니다. 이를 일관되게 「아십니다」「이들입니다」「했습니다」로 고쳤습니다. 「나리」는 천상 장로에게 드리는 존칭으로서 κύριέ μου의 존중의 호격을 나타내되, 이를 하나님이나 그리스도에 대한 칭호로 단정하지 않습니다.
  terminology: 「큰 환난」, 「어린 양」, 「두루마기」는 계시록의 어휘와 상징을 적절히 보존합니다. 「어린 양의 피에」라는 표현은 도구적 번역으로 평준화하지 않았으며, 각주는 그 가능한 이해를 설명합니다.
