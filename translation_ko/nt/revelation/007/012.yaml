  source_fidelity: 송영의 일곱 항목과 순서는 잘 보존했고, ‘권능’과 ‘힘’으로 δύναμις와 ἰσχύς도 구별했습니다. 그러나 λέγοντες는 앞 절의 경배 행위에 딸린 현재분사인데, 초안의 ‘말하기를, … 하였습니다’는 부자연스럽고 불필요하게 완료된 서술처럼 들립니다. 한국어에서는 인용을 직접 이끄는 ‘말했습니다’가 가장 자연스럽습니다. 또한 본문의 무동사 송영은 ‘우리 하나님의 것입니다’로 명료하게 나타낼 수 있습니다.
  naturalness: ‘말하기를, … 하였습니다’는 현대 표준 한국어 산문에서 어색한 이중 서술입니다. ‘말했습니다. “…”’로 고치고, ‘영원무궁토록’ 대신 현대적이면서도 송영의 격조를 유지하는 ‘영원토록’을 사용했습니다. 종결은 합쇼체를 유지합니다.
  terminology: ‘아멘’, ‘찬송’, ‘영광’, ‘지혜’, ‘감사’, ‘존귀’, ‘권능’, ‘힘’, ‘우리 하나님’은 계시록의 예배·송영 문맥에 적절합니다. ‘찬송’은 εὐλογία의 하나님께 돌리는 찬양/복의 의미를 자연스럽게 전달합니다.
