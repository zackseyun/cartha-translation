  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 σκηνώσει ἐπ’ αὐτούς의 장막 이미지와 ‘그들 위에’라는 방향성을 더 자연스럽고 직접적으로 드러내기 위해 ‘자신의 장막을 펴 주실 것입니다’보다 ‘그들 위에 장막을 치실 것입니다’가 적절합니다. ‘주실’은 원문에 없는 수혜적 뉘앙스를 덧붙일 수 있습니다.
  naturalness: ‘하나님의 보좌 앞에 있어’는 가능하지만 ‘하나님의 보좌 앞에 있으며’가 현대 한국어 문장 연결에서 더 자연스럽습니다. 또한 ‘밤낮으로’가 ‘ἡμέρας καὶ νυκτός’의 지속적 의미를 한국어에서 매끄럽게 전달합니다.
