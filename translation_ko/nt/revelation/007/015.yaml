  issues:
  - severity: medium
    issue: ‘자신의 장막을 펴 주실 것입니다’의 표현
    rationale: ‘펴 주실’은 원문의 미래 동사에 수혜적 의미를 더할 수 있고, ‘자신의’도 한국어에서는 불필요하게 강조됩니다. ‘그들 위에 장막을 치실 것입니다’는 σκηνόω의 장막 이미지를 보존하면서 ἐπί의 방향성을 자연스럽게 반영합니다.
