  source_fidelity: 초안의 ‘예수에 대한 믿음’은 τὴν πίστιν Ἰησοῦ의 가능한 객관적 속격 해석 하나를 본문에서 확정합니다. 원문은 ‘예수의 믿음’(또는 예수께 대한 믿음/예수의 신실하심)으로도 이해될 수 있으므로, 본문에서는 속격의 모호성을 보존하고 각주로 대안을 제시해야 합니다. 또한 οἱ τηροῦντες는 성도들을 설명하는 동격 표현이며, 개정문은 이를 자연스럽게 반영합니다.
  naturalness: ‘여기에 성도들의 인내가 있습니다’와 ‘하나님의 계명과 예수의 믿음을 지키는 이들’은 현대 표준어 합쇼체에서 자연스럽고, 성경 문맥에 알맞은 격조를 유지합니다. ‘곧’은 원문의 동격적 설명을 무리 없이 연결합니다.
  terminology: ἅγιοι는 ‘성도들’, ὑπομονή는 ‘인내’, ἐντολαί는 ‘계명’으로 옮겼습니다. πίστις Ἰησοῦ는 교리적으로 논쟁적인 속격 구조이므로 ‘예수의 믿음’으로 직역적 긴장을 유지하고 각주에서 ‘예수에 대한 믿음’ 및 ‘예수의 신실하심’을 밝혔습니다.
  issues:
