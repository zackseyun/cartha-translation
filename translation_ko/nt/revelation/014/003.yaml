  source_fidelity: 수정안은 ᾄδουσιν의 현재성을 ‘부르고 있습니다’로, ὡς의 비교·현상 묘사를 ‘새 노래인 듯한 노래’로 반영합니다. 또한 수동 분사 οἱ ἠγορασμένοι를 ‘땅에서 사들여진’으로 옮겨, 초안의 능동형 ‘사신’이 만들어 낸 주체 역전과 구매자의 명시를 제거합니다.
  naturalness: 초안의 ‘새 노래 같은 것을’은 한국어에서 대상이 불명확하고 다소 어색합니다. ‘새 노래인 듯한 노래’는 반복이 있으나 원문의 ὡς와 ‘노래’라는 명사를 모두 보존하는 자연스러운 절충입니다. ‘네 생물’과 ‘장로들’은 요한계시록 문맥에서 통용되는 간결한 명칭입니다.
  terminology: ‘보좌’, ‘네 생물’, ‘장로들’, ‘십사만 사천 명’은 문맥상 적절합니다. ἀγοράζω의 직접적인 매매 비유는 본문에서 ‘사들여진’으로 유지하고, ‘속량된’이라는 신학적으로 익숙한 대안은 각주에만 제시합니다.
