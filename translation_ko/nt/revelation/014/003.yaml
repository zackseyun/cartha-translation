source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
  footnotes:
  - marker: a
    text: Or 'as a new song' / 'like a new song.' The Greek uses appearance-language common in Revelation's visions.
    reason: lexical_alternative
  - marker: b
    text: Or 'redeemed from the earth.' The Greek verb is literally 'purchased' or 'bought.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 보좌 앞과 네 생물과 장로들 앞에서 새 노래인 듯한 노래를 부르고 있습니다[a]. 그리고 땅에서 사들여진 십사만 사천 명[b] 외에는 아무도 그 노래를 배울 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “새 노래로” 또는 “새 노래처럼.” 그리스어는 환상 묘사에서 흔히 쓰이는 현상·비교 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “땅에서 속량된.” 그리스어 동사는 문자적으로 “사다” 또는 “사들이다”라는 뜻입니다.
    reason: alternative_reading
