translation:
  language: ko
  text: 그리고 그들의 입에서 거짓이 발견되지 않았습니다. 그들은 흠이 없습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “흠 없는 사람들입니다” 또는 “책망할 것이 없는 사람들입니다.” 그리스어는 제물의 흠 없는 상태를 떠올리게 하는 정결의 이미지를 지닐 수도 있고, 도덕적으로 흠잡을 데 없다는 뜻을 나타낼 수도 있습니다.
    reason: ἄμωμοι의 ‘흠 없음’과 ‘책망할 것이 없음’이라는 가능한 의미 범위 및 제의적 정결의 뉘앙스를 보존합니다.
