    rationale: ‘순결한’은 해석적으로 일반화한 표현입니다. 원문은 ‘virgins’라는 구체적 표현을 사용하므로, 본문에서는 ‘동정인’ 등으로 보존해야 합니다.
  - severity: high
    issue: ἠγοράσθησαν(‘사들여졌다/구속되었다’)를 ‘값을 치르고 사신 자들’로 번역함
    rationale: 그리스어는 수동태이며 구매 행위의 주체를 이들이 아니라 문맥상 외부의 행위자로 제시합니다. 초안은 이들이 값을 지불하여 구매한 것으로 오해될 수 있습니다.
  - severity: medium
    issue: 각주가 상징적 의미를 단정함
