  source_fidelity: 수정이 필요합니다. παρθένοι는 구체적으로 ‘처녀/동정인, virgin’을 뜻하는데, 초안의 ‘순결한 자들’은 그 의미를 넓혀 번역했습니다. 또한 ἠγοράσθησαν은 수동태인데 ‘값을 치르고 사신 자들’은 이들이 구매 주체인 것처럼 읽힙니다.
  naturalness: 합쇼체 문체는 대체로 자연스럽습니다. 다만 ‘값을 치르고 사신 자들’은 문법적 주체와 의미가 불명확하고, ‘동정인’은 다소 문어적이지만 성별을 특정하지 않으면서 원문의 구체적 표현을 보존하는 데 적절합니다.
  terminology: ‘어린 양’, ‘하나님’, ‘첫 열매’는 요한계시록의 관습적이고 적절한 핵심 용어입니다. παρθένοι는 본문에서 ‘동정인’으로 옮기고, 상징적 독해의 가능성은 원문의 의미를 단정하지 않는 각주로 남기는 것이 좋습니다.
  issues:
