  source_fidelity: 원문의 두 이름(어린양의 이름과 그 아버지의 이름)을 모두 유지하고, 완료 수동 분사 γεγραμμένον의 상태를 ‘기록되어 있었습니다’로 옮기는 것이 더 직접적입니다. 현 초안의 ‘새겨 가지고 있었습니다’는 기록됨과 소유함을 한 표현에 섞어 원문의 구조를 다소 흐립니다.
  naturalness: ‘그리고 나는 보았습니다. 보십시오’는 문법적으로 가능하지만 환상 서술의 전환으로는 다소 어색합니다. ‘또 내가 보았습니다. 보십시오’가 더 자연스럽고, 이름이 이마에 기록되었다는 내용을 별도 서술로 처리하면 문장이 명료해집니다.
  terminology: ‘어린 양’, ‘시온 산’, ‘그분의 이름’, ‘그분의 아버지의 이름’은 계시록의 표준적 용례와 원문의 구별된 두 명칭을 잘 반영합니다. ‘기록되어’는 γράφω의 의미를 보존하며, ‘새겨’보다 과도하게 구체화하지 않습니다.
