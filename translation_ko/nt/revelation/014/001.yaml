  rationale: SBLGNT 본문의 ‘그분의 이름과 그분의 아버지의 이름’을 명시적으로 유지하고, 이름들이 이마에 ‘기록되어’ 있다는 완료 수동의 상태를 자연스러운 한국어로 옮겼습니다. 본문에서 두 이름의 관계를 해석적으로 동일시하지 않았으며, ‘그분의 이름’을 생략하는 사본 읽기는 각주로 보존했습니다.
