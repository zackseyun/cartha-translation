  text: 또 내가 보았습니다. 보십시오, 어린 양이 시온 산에 서 계셨고, 그분과 함께 십사만 사천 명이 있었으며, 그들의 이마에는 그분의 이름과 그분의 아버지의 이름이 기록되어 있었습니다[a].
