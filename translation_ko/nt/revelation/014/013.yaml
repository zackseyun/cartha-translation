revisions:
- from: 그리고 나는 하늘에서 나는 음성을 들었습니다. 「기록하라. 「이제부터 주 안에서 죽는 자들은 복이 있다.」」 「그렇다.」 영이 말씀하십니다. 「그들이 자기들의 수고를 그치고 쉬리니, 그들의 행한 일이 그들을 따라가기 때문이다.」
  to: 그리고 나는 하늘에서 한 음성이 이렇게 말하는 것을 들었습니다. “기록하라. 이제부터 주 안에서 죽는 이들은 복이 있습니다.” “그렇습니다.” 영이 말씀하십니다. “그들이 자기들의 수고에서 쉬게 될 것입니다. 그들의 행위가 그들과 함께 따라가기 때문입니다.”
  rationale: ‘수고를 그치고’를 ‘수고에서 쉬게 될 것입니다’로 고쳐 ἐκ τῶν κόπων과 ἵνα 뒤의 미래형을 반영했습니다. 마지막 절은 ‘그들과 함께 따라가기’로 μετ’ αὐτῶν을 살리고, ἔργα를 ‘행위’로 옮겨 불필요한 교리적 해석을 피했습니다. 원문과 영어 감사 기록이 지닌 ἵνα의 목적/결과 뉘앙스는 한국어의 미래 진술로 과도하게 확정하지 않고 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:16Z'
