  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문의 ‘하늘에서 [오는] 음성’, 기록하라는 명령, ‘이제부터 주 안에서 죽는 이들’이라는 선언, 성령의 확언, 수고로부터의 쉼, 그리고 행위가 그들과 함께 따른다는 진술을 보존해야 합니다. 초안의 ‘수고를 그치고’는 ἐκ τῶν κόπων(‘그들의 수고로부터’)에 없는 별도 행위를 덧붙입니다.
  naturalness: 초안의 중첩 인용부호와 짧게 끊긴 ‘그렇다. 영이 말씀하십니다.’는 현대 한국어 문장으로 다소 부자연스럽습니다. 또한 ‘그들의 행한 일이 그들을 따라가기’는 ‘μετ’ αὐτῶν’의 ‘그들과 함께’를 반영하지 못하고 한국어로도 어색합니다.
  terminology: κύριος는 ‘주’, πνεῦμα는 ‘영’, κόποι는 ‘수고’, ἔργα는 넓은 뜻을 유지하는 ‘행위’로 옮겼습니다. ‘주 안에서’는 해석적으로 풀어 쓰지 않아 원문의 신학적 폭을 보존합니다.
  issues:
