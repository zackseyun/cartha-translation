    reason: alternative_reading
  - marker: b
    text: Or 'for their deeds follow them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 하늘에서 한 음성이 이렇게 말하는 것을 들었습니다. “기록하라. 이제부터 주 안에서 죽는 이들은 복이 있습니다.” “그렇습니다.” 영이 말씀하십니다. “그들이 자기들의 수고에서 쉬게 될 것입니다. 그들의 행위가 그들과 함께 따라가기 때문입니다.”
  philosophy: optimal-equivalence
