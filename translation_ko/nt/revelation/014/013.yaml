  - severity: medium
    issue: ‘그들의 행한 일이 그들을 따라가기’
    rationale: μετ’ αὐτῶν은 ‘그들과 함께’를 뜻합니다. 또한 ‘행한 일’보다 ‘행위’가 ἔργα의 넓은 의미를 더 자연스럽게 보존합니다.
