source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
  footnotes:
  - marker: a
    text: Or 'in the middle of the sky' or 'in midair'; the Greek term is a distinctive apocalyptic expression.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to those sitting/seated on the earth'; in Revelation this expression functions idiomatically for the earth's inhabitants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 또 다른 천사가 하늘 한가운데를 날아가며, 땅에 거하는 자들과 모든 민족과 족속과 언어와 백성에게 전할 영원한 복음을 가지고 있는 것을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘 한가운데’는 직역하면 ‘중천’이며, 하늘의 중앙 또는 그 높은 곳을 가리키는 묵시적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘땅에 앉아 있는 자들’입니다. 여기서는 땅에 사는 사람들을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
