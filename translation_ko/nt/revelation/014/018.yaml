source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
  footnotes:
  - marker: a
    text: Or 'Put in your sharp sickle.' The Greek verb is literally 'send,' but in harvest imagery some render it idiomatically as 'put in.'
    reason: lexical_alternative
  - marker: b
    text: '''The vine of the earth'' is an apocalyptic image; the text does not explicitly identify the referent here, though the surrounding context is one of judgment.'
    reason: cross_reference
translation:
  language: ko
  text: 또 다른 천사가 제단에서 나왔습니다. 그는 불에 대한 권세를 가진 이였습니다. 그는 날카로운 낫을 가진 이에게 큰 소리로 외쳐 말하였습니다. “네 날카로운 낫을 보내어[a] 땅의 포도나무[b]의 송이들을 거두어라. 그 포도알들이 무르익었기 때문이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 날카로운 낫을 대어라.’ 그리스어 동사는 문자적으로 ‘보내다’라는 뜻이지만, 수확의 문맥에서는 관용적으로 이렇게 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅의 포도나무’는 묵시적 이미지입니다. 이 절 자체는 그것이 가리키는 대상을 명시하지 않지만, 주변 문맥은 심판의 문맥입니다.
    reason: cross_reference
