review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the three imperatives, the arrival of God's judgment hour, and the Creator designation. However, '큰 음성으로' is an overly literal and unnatural Korean rendering of ἐν φωνῇ μεγάλῃ, and '물들의 근원' is less direct than the concrete plural πηγὰς ('springs').
  naturalness: Use '큰 소리로' in modern standard Korean. '물의 샘들' is clearer and more concrete in this creation list than '물들의 근원.'
  terminology: '''하나님,'' ''영광을 돌리십시오,'' ''심판의 때,'' and ''경배하십시오'' are appropriate formal-polite biblical terminology. ''두려워하고'' properly preserves the reverential fear and judgmental gravity of Φοβήθητε without reducing it to mere respect.'
  issues:
  - severity: low
    issue: '''큰 음성으로'' is unnatural Korean.'
    rationale: Although formally close to the Greek, contemporary Korean idiom is '큰 소리로.'
  - severity: low
    issue: '''물들의 근원'' is less concrete than πηγὰς ὑδάτων.'
    rationale: The Greek refers to springs/sources of waters in the plural. '물의 샘들' retains the concrete imagery and plural referent more clearly.
