  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
  footnotes:
  - marker: a
    text: Or 'revere God.' The Greek verb can denote reverential fear as well as fear in the face of judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'springs of water.' The Greek literally has 'springs of waters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 큰 소리로 말하였습니다. “하나님을 두려워하고 그분께 영광을 돌리십시오. 그분의 심판의 때가 이르렀기 때문입니다. 하늘과 땅과 바다와 물의 샘들을 지으신 분께 경배하십시오.”
  philosophy: optimal-equivalence
