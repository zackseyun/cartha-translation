  to: 그는 큰 소리로 말하였습니다. “하나님을 두려워하고 그분께 영광을 돌리십시오. 그분의 심판의 때가 이르렀기 때문입니다. 하늘과 땅과 바다와 물의 샘들을 지으신 분께 경배하십시오.”
