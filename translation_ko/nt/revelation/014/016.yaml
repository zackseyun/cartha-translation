  source_fidelity: 원문의 주어(‘구름 위에 앉아 계신 분’), 소유격(‘자기 낫’), 낫을 사용하는 추수 행위, 그리고 ‘땅이 추수되었다’라는 수동 표현을 충실히 보존합니다. ‘땅 위에 휘두르셨고’는 ἔβαλεν ... ἐπὶ τὴν γῆν의 수확 문맥상 동작을 자연스럽게 옮긴 표현입니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 계시록의 장중한 서사 문체에도 잘 맞습니다. ‘땅이 추수되었습니다’는 원문의 의도적인 수동태와 묵시적 이미지를 유지합니다.
  terminology: ‘구름’, ‘낫’, ‘땅’, ‘추수’는 본문의 농경 및 심판 이미지를 정확하고 일관되게 전달합니다. 본문이 밝히지 않는 인물의 정체를 ‘분’으로만 서술하여 해석을 덧붙이지 않았습니다.
