  source_fidelity: 초안은 αὐτὸς καί의 첨가적 강조(“그도”), 두 진노 어휘(θυμός/ὀργή)의 구별, 미래 수동형, 그리고 거룩한 천사들과 어린양 앞이라는 표현을 대체로 잘 반영합니다. 그러나 ‘섞임 없이 부어진’은 κεκερασμένου(섞어 마련된/혼합된)를 ‘부어진’으로 바꾸어 버리고, ἐν τῷ ποτηρίῳ도 다소 불분명하게 처리합니다. ‘섞어 놓되 물을 타지 않은’은 고대 포도주 관용구의 두 요소를 자연스럽게 보존합니다.
  naturalness: ‘마실 것이고 … 당할 것입니다’는 연결 종결과 문장 종결의 높임 단계가 매끄럽지 않습니다. ‘마실 것이며’로 고치고, ‘불과 유황 가운데서’로 옮기면 현대 표준어 합쇼체로 자연스럽고 원문의 ἐν을 더 직접적으로 드러냅니다.
  terminology: ‘하나님의 진노’와 ‘그분의 분노’는 θυμός와 ὀργή의 근접한 구별을 유지하는 적절한 선택입니다. ‘어린양’은 현대 한국어 성경 용례에 맞는 통일된 표기입니다. θείῳ는 현대어로 ‘유황’이 적절합니다.
