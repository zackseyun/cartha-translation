  - severity: medium
    issue: ‘수금 타는 자들’의 현대성 및 행위의 명료성
    rationale: ‘타다’는 악기 연주에 쓰이는 전통적 표현이지만 현대 합쇼체에서는 ‘연주하다’가 더 자연스럽습니다. 원문의 연주자와 연주 행위를 모두 드러내야 합니다.
