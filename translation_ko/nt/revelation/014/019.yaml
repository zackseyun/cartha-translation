  source_fidelity: 그리스어 ἔβαλεν ... εἰς τὴν γῆν은 낫을 땅에 ‘휘두른’ 동작을 가리키므로 ‘땅에 휘둘러’는 가능하나, 한국어에서는 낫을 땅에 직접 휘두르는 듯 다소 어색합니다. 영어 감사본의 ‘over the earth’와도 맞게 ‘땅 위로 휘둘러’가 자연스럽습니다. ἐτρύγησεν은 포도를 거두는 수확을 뜻하며, 목적어 ἄμπελον은 ‘포도나무’로 옮길 수 있습니다. ληνός는 포도주틀이고, ‘하나님의 진노의 큰 포도주틀’은 속격 관계를 충실히 반영합니다.
  naturalness: ‘그러자’와 합쇼체 종결은 문맥 및 문체에 적절합니다. 다만 ‘자기 낫을 땅에 휘둘러’보다 ‘자기 낫을 땅 위로 휘둘러’가 현대 한국어에서 동작의 방향을 더 명료하고 자연스럽게 전달합니다.
  terminology: ‘천사’, ‘낫’, ‘포도나무’, ‘포도주틀’, ‘하나님의 진노’는 모두 적절합니다. 원문에 고유한 신학적 해석을 덧붙이지 않았습니다.
  issues:
  - severity: low
    issue: ‘땅에 휘둘러’의 방향 표현
    rationale: 원문의 εἰς τὴν γῆν은 낫질의 대상·범위를 나타내며, 한국어에서는 ‘땅 위로 휘둘러’가 낫을 휘두르는 동작과 그 범위를 자연스럽게 표현합니다.
  revised_text: 그러자 그 천사가 자기 낫을 땅 위로 휘둘러 땅의 포도나무를 거두고, 그것을 하나님의 진노의 큰 포도주틀에 던졌습니다.
