  source_fidelity: 개정이 필요합니다. 초안은 βασανισμός의 심판 고통, 연기가 계속 올라가는 현재 시제, 짐승과 그 형상에 대한 경배, 이름의 표라는 핵심 이미지를 대체로 보존합니다. 그러나 οὐκ ἔχουσιν(‘쉼이 없다’)을 미래형 ‘없을 것입니다’로 옮긴 것은 현재의 지속적 진술을 약화하며, 끝의 고립된 닫는 인용부호는 삭제되어야 합니다. 최종 절의 εἴ τις(‘누구든지/누가 … 하면’)는 한국어에서 자연스럽게 일반화하되, 각주로 그리스어의 다소 갑작스러운 문법 전환을 밝혔습니다.
  naturalness: ‘그들이 받는 고통’보다 ‘그들이 겪는 고통’이 현대 표준어에서 더 자연스럽고, ‘쉼이 없습니다’는 합쇼체의 격식과 ἀνάπαυσις의 의미를 충실히 살립니다. ‘누구든지’는 한국어에서 포괄적 조건을 자연스럽게 표현합니다.
  terminology: ‘고통’, ‘연기’, ‘영원토록’, ‘짐승’, ‘형상’, ‘경배하다’, ‘표’, ‘쉼’은 계시록의 반복 어휘와 원문의 의미 영역에 적절합니다. ‘그 이름의 표’는 τοῦ ὀνόματος αὐτοῦ의 다소 압축적인 속격 표현을 보존합니다.
