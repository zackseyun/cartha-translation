    rationale: 원문은 복수 분사(‘경배하는 자들’) 뒤에 단수 부정 조건절(‘누가 표를 받으면’)을 덧붙입니다. 한국어 본문에서는 자연스럽게 ‘표를 받는 사람이 누구든지’로 옮기되, 각주에서 원문의 형태를 알려 주는 것이 적절합니다.
