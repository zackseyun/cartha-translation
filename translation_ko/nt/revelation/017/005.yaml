id: REV.17.5
reference: Revelation 17:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
  footnotes:
  - marker: a
    text: 'Or, ''a name was written, a mystery: Babylon the Great, the mother of prostitutes and of the abominations of the earth,'' taking ''mystery'' as introducing the symbolic meaning of the name rather than as part of the inscription itself.'
    reason: alternative_reading
translation:
  language: ko
  text: '그리고 그 여자의 이마에는 한 이름이 기록되어 있었습니다: 「비밀[a], 큰 바벨론, 땅의 창녀들과 가증한 것들의 어머니」.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 이름이 기록되어 있었으니, 곧 신비로서 큰 바벨론, 땅의 창녀들과 가증한 것들의 어머니.’ ‘비밀’을 이마에 기록된 이름의 일부가 아니라, 뒤따르는 상징적 이름을 소개하는 말로 볼 수 있습니다.
    reason: alternative_reading
