  terminology: '''대접'' is the established Korean rendering for φιάλαι in Revelation. ''창녀'' directly preserves the force of πόρνη in its prophetic-apocalyptic metaphorical use; a note records the traditional alternative ''음녀.'' ''심판'' appropriately retains the breadth of κρίμα.'
