  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
  footnotes:
  - marker: a
    text: Or 'the condemnation' or 'the punishment' of the great prostitute.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''the great harlot.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 일곱 대접을 가진 일곱 천사 가운데 하나가 와서 나에게 말했습니다. “이리 오십시오. 많은 물 위에 앉아 있는 큰 창녀[b]에 대한 심판[a]을 내가 당신에게 보여 주겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정죄’ 또는 ‘형벌’.
    reason: κρίμα는 판결, 정죄, 처벌을 포괄할 수 있으므로 ‘심판’의 폭넓은 의미를 보완한다.
  - marker: b
    text: 전통적으로 ‘큰 음녀’.
    reason: πόρνη의 전통적 한국어 성경 용례를 제시하되, 본문의 은유적이고 polemical한 표현을 완화하거나 해석으로 대체하지 않는다.
