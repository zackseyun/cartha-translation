id: REV.17.17
reference: Revelation 17:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
  footnotes:
  - marker: a
    text: Or 'to be of one mind' or 'to have one purpose.' The Greek literally says 'to make one purpose.'
    reason: lexical_alternative
  - marker: b
    text: Or 'until the words of God are completed' or 'come to pass.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 그들의 마음에 자기의 뜻을 행하게 하시고, 한 뜻을 품고 자기들의 나라를 그 짐승에게 주게 하셨기 때문입니다. 하나님의 말씀들이 이루어질 때까지입니다.
  philosophy: optimal-equivalence
