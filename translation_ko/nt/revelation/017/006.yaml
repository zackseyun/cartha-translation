review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 잘 옮겼습니다. μεθύουσαν의 지속적 상태는 ‘피에 취해 있는’으로 나타내면 더 분명하며, ἰδὼν αὐτήν은 여성을 가리키므로 ‘그 여자를 보고’로 바로잡아야 합니다.
  naturalness: 합쇼체와 문장 흐름은 자연스럽습니다. 다만 ‘그를 보고’는 앞의 ‘그 여자’와 성별 지시가 어긋나므로 명백한 오류입니다. ‘성도들의 피와 예수의 증인들의 피에 취해 있는’은 두 피가 모두 ‘취함’의 근거임을 자연스럽게 드러냅니다.
  terminology: ‘성도들’은 ἁγίων에 적절합니다. μαρτύρων은 본문에서 ‘증인들’로 유지할 수 있으나, 피가 언급되는 문맥상 ‘순교자들’이라는 뜻도 강하게 가능하므로 각주로 밝혀야 합니다. ‘예수의 증인들’은 원문의 압축된 소유격/관련 속격의 여지를 보존합니다.
  issues:
  - severity: high
    issue: ‘그를 보고’
    rationale: 원문 αὐτήν은 여성 단수 대격으로 ‘그 여자’를 가리킵니다. 한국어 ‘그’는 통상 남성 지시로 이해되어 선행사와 불일치합니다.
  - severity: low
    issue: μεθύουσαν의 진행·상태성
    rationale: 현재분사 μεθύουσαν은 여자가 피로 취해 있는 상태를 묘사합니다. ‘취해 있는’이 이 상태성을 더 충실히 반영합니다.
  revised_text: 그리고 나는 그 여자가 성도들의 피와 예수의 증인들의 피에 취해 있는 것을 보았습니다. 그 여자를 보고 나는 크게 놀랐습니다.
  revised_footnotes:
  - marker: a
    text: ‘예수의 증인들’은 ‘예수를 증언한 이들’ 또는, 이들의 피가 언급되는 문맥에서는 ‘예수 때문에 죽임당한 순교자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 여성 선행사를 남성형으로 가리킨 지시어를 ‘그 여자’로 수정했습니다. 또한 현재분사의 상태성을 ‘취해 있는’으로 반영했습니다. μαρτύρων의 기본 의미인 ‘증인들’은 본문에 유지하되, 문맥상 가능한 ‘순교자들’의 의미는 해당 어휘에 각주를 달아 보존했습니다.
