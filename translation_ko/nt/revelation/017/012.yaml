  to: 또 당신이 본 열 뿔은 열 왕입니다. 그들은 아직 왕국을 받지 못했지만, 짐승과 함께 한 시간[a] 동안 왕으로서 권세를 받습니다.
  rationale: 현대 합쇼체에 맞게 종결형을 정비하고, βασιλεία와 ἐξουσία의 의미상 구별을 ‘왕국’과 ‘권세’로 보존했습니다. 현재형 λαμβάνουσιν은 ‘받습니다’로 유지했으며, ‘한 시간’의 묵시적 비유 가능성은 본문을 해석적으로 바꾸지 않고 각주에 남겼습니다.
