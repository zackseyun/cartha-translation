  naturalness: ‘그대’와 ‘받소’의 결합은 현대 공적 성경 문체로 부자연스럽고 종결 높임이 일관되지 않습니다. ‘당신이 … 받습니다’는 이 직접 발화 문맥에서 현대 합쇼체로 자연스럽습니다.
  terminology: κέρατα는 ‘뿔’, βασιλεῖς는 ‘왕’, βασιλεία는 ‘왕국’, ἐξουσία는 ‘권세’, θηρίον은 ‘짐승’으로 구별해 옮기는 것이 적절합니다. μίαν ὥραν은 본문에서 ‘한 시간 동안’으로 보존하고 짧은 기간이라는 가능성은 각주에서 제시합니다.
