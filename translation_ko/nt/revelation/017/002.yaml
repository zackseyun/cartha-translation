  source_fidelity: 그리스어의 여성 관계대명사(μεθ’ ἧς)는 앞 절의 여자를 가리키므로, 초안의 ‘그와’는 한국어에서 남성 또는 성별 불명의 대상으로 읽힐 수 있습니다. 또한 ἐμεθύσθησαν의 결과 상태는 ‘취하였습니다’로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘하였소’는 하오체로서 요청된 현대 합쇼체와 맞지 않습니다. ‘그 여자와 … 취하였습니다’는 문맥상 지시 대상과 높임말 문체를 분명히 합니다. 초안 끝의 닫는 인용부호도 본 절 단독 본문에서는 제거하는 것이 적절합니다.
  terminology: ‘음행’은 계시록의 πορνεύω/πορνεία의 성적 은유를 보존하면서 한국어 성경 문체에도 부합합니다. 본문에서 우상숭배나 정치적 타협으로 단정하지 않고, 주석에서 상징적 기능을 알립니다.
