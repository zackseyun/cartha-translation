review_pass:
  verdict: revise
  source_fidelity: 초안은 짐승의 과거·현재 부재·미래의 움직임, 무저갱, 생명책, 땅에 거하는 자들의 놀람이라는 주요 요소를 대체로 담고 있습니다. 그러나 「창세 이후로」는 ἀπὸ καταβολῆς κόσμου(‘세상의 기초가 놓인 때부터’)보다 범위를 좁히며, 「다시 나타날」은 παρέσται에 ‘다시’라는 의미를 추가합니다.
  naturalness: 「가오」는 현대 표준어 합쇼체에 맞지 않는 문어적·고어적 종결입니다. 「갑니다/것입니다」로 통일하는 것이 자연스럽습니다. 또한 마지막 절은 놀람의 대상과 이유를 구별하여 표현하는 편이 한국어 문장 구조상 더 분명합니다.
  terminology: 「짐승」, 「무저갱」, 「멸망」, 「생명책」은 요한계시록의 문맥과 한국어 성서 용례에 적절합니다. 「땅에 거하는 사람들」도 반복되는 묵시문학적 표현을 잘 보존합니다.
  issues:
  - severity: medium
    issue: 「창세 이후로」
    rationale: καταβολὴ κόσμου는 ‘창세’ 자체보다 ‘세상의 기초가 놓임/세상이 세워짐’을 가리킵니다. 「세상이 창조된 때부터」가 더 직접적입니다.
  - severity: medium
    issue: 「장차 다시 나타날」
    rationale: παρέσται는 ‘장차 있을 것이다/현존하게 될 것이다’라는 미래의 παρουσία를 나타냅니다. 본문에는 ‘다시’가 없으며, ‘나타나다’도 가능한 해석이나 현존의 대조를 약화시킬 수 있습니다.
  - severity: medium
    issue: 「가오」
    rationale: 요청된 현대 표준어 합쇼체와 맞지 않으므로 「갑니다」로 고쳐야 합니다.
  - severity: low
    issue: 마지막 절의 인과 관계
    rationale: ὅτι는 인과적 ‘왜냐하면/…이므로’ 또는 내용절로 이해될 수 있습니다. 본문에서는 인과적 번역을 유지하되, 각주로 대안을 밝혀 모호성을 보존하는 것이 안전합니다.
  revised_text: 그대가 본 그 짐승은 전에 있었으나 지금은 없고, 장차 무저갱에서 올라와 멸망으로 갑니다. 그리고 땅에 거하는 사람들, 곧 세상이 창조된 때부터 자기 이름이 생명책에 기록되지 않은 사람들은 그 짐승을 보고, 그 짐승이 전에 있었으나 지금은 없고 장차 있을 것이므로 놀랄 것입니다.¹
  revised_footnotes:
  - marker: '1'
    text: 또는, “그 짐승이 전에 있었으나 지금은 없고 장차 있을 것이라고 보고 놀랄 것입니다.” 헬라어 접속사 ὅτι는 ‘…이므로’라는 이유 또는 ‘…라고’라는 내용으로 이해될 수 있습니다. 「장차 있을 것이다」는 미래형 παρέσται를 옮긴 것입니다.
    reason: alternative_reading
  revision_rationale: 현대 합쇼체로 종결을 정비하고, ‘세상의 기초가 놓인 때부터’라는 시간 표현을 자연스러운 한국어로 충실히 옮겼습니다. παρέσται에 없는 ‘다시’를 제거하고 ‘장차 있을 것이다’로 옮겨 현재의 부재와 미래의 현존 사이의 대조를 보존했습니다. ὅτι의 문법적 모호성은 본문에서 인과적으로 번역하고 각주에서 내용절 가능성을 제시했습니다.
