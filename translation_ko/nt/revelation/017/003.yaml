translation:
  language: ko
  text: 그가 나를 영 안에서[a] 광야로 데리고 갔습니다. 그리고 나는 한 여자가 진홍색 짐승 위에 앉아 있는 것을 보았습니다. 그 짐승은 신성을 모독하는 이름들로 가득하였고, 일곱 머리와 열 뿔을 가지고 있었습니다.
  philosophy: optimal-equivalence
