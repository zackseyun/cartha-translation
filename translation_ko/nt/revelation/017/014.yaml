revisions:
- from: 이들은 어린 양과 더불어 싸울 것이지만, 어린 양이 그들을 이기실 것이오. 그분은 주의 주시요 왕의 왕[a]이시며, 그분과 함께 있는 자들은 부르심을 받고 택하심을 입은 신실한 자들이기 때문이오.」
  to: 이들은 어린양을 상대로 싸움을 벌일 것이고, 어린양께서는 그들을 이기실 것입니다. 이는 그분이 주 중의 주시며 왕 중의 왕이시기 때문입니다. 또 그분과 함께 있는 이들은 부름받고 택함받고 신실한 이들입니다.
  rationale: 적대적 전쟁의 방향을 한국어에서 분명히 하고, 원문에 없는 강한 양보 접속을 제거했습니다. 칭호는 원문의 순서와 최상급적 의미를 보존하면서 현대 한국어 관용에 맞게 고쳤고, 불필요한 교차참조 각주와 구조적으로 고립된 인용부호를 삭제했습니다. κλητοὶ, ἐκλεκτοὶ, πιστοί의 세 서술어는 교리적으로 해석을 덧붙이지 않고 그대로 유지했습니다.
