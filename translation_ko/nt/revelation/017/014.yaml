translation:
  language: ko
  text: 이들은 어린양을 상대로 싸움을 벌일 것이고, 어린양께서는 그들을 이기실 것입니다. 이는 그분이 주 중의 주시며 왕 중의 왕이시기 때문입니다. 또 그분과 함께 있는 이들은 부름받고 택함받고 신실한 이들입니다.
  philosophy: optimal-equivalence
