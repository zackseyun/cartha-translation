  source_fidelity: 수정이 필요합니다. 원문의 μετὰ τοῦ ἀρνίου는 문맥상 어린양에 맞서 싸운다는 뜻으로 분명히 드러내야 하며, καὶ를 '하지만'으로 옮겨 원문에 없는 양보·대조를 강하게 넣지 않는 편이 좋습니다. 또한 '주의 주/왕의 왕'은 한국어에서 부자연스럽고, 통상적이면서도 원문의 최상급적 소유격 표현을 충실히 살리는 '주 중의 주, 왕 중의 왕'이 적절합니다.
  naturalness: 초안의 '것이오', '주시요'는 요청된 현대 표준어 합쇼체에 맞지 않거나 지나치게 고풍스럽습니다. '것입니다', '이십니다'와 같은 현대 합쇼체가 자연스럽습니다. 문장 끝의 닫는 인용부호도 근거 없이 삽입되어 삭제해야 합니다.
  terminology: '''어린양'', ''이기시다'', ''부름받고 택함받고 신실한''은 요한계시록의 용어와 문맥을 자연스럽게 반영합니다. ''주 중의 주, 왕 중의 왕''은 전통적인 ''만주의 주, 만왕의 왕''이 덧붙이는 만(萬)을 사용하지 않으면서도 한국어 관용에 맞습니다.'
  issues:
  - severity: medium
    issue: μετὰ τοῦ ἀρνίου의 적대적 문맥이 '어린 양과 더불어 싸울'로는 충분히 드러나지 않습니다.
    rationale: '''더불어 싸우다''는 어린양과 함께 싸운다는 연합의 의미로도 쉽게 읽힙니다. πολεμέω의 전쟁 문맥에서는 어린양을 상대로 싸운다는 뜻을 명시하는 것이 필요합니다.'
  - severity: medium
