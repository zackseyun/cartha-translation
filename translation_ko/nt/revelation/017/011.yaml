  verdict: revise
  source_fidelity: 초안은 θηρίον, ὄγδοός, ἀπώλεια의 기본 뜻을 대체로 옮겼습니다. 그러나 ἐκ τῶν ἑπτά을 과거형의 특정한 소속 관계인 “일곱에 속하였고”로 번역하여 현재형 ἐστιν 및 ‘~로부터/from’의 열린 관계를 좁혔습니다.
  naturalness: “가오”는 현대 표준어 합쇼체 문체에 맞지 않습니다. “갑니다”가 자연스럽고 일관된 현대 격식체입니다. “일곱에서 나왔고”는 다소 압축적이지만, 원문의 의도적인 모호성을 유지하는 데 적절하며 주석으로 보완합니다.
  terminology: “짐승”, “여덟째”, “멸망”은 요한계시록의 상징적·종말론적 어휘와 원문에 잘 부합합니다. 원문에 없는 ‘왕’은 본문에 보충하지 않고 각주에서 가능한 해석으로 제시합니다.
  issues:
  - severity: medium
    issue: “일곱에 속하였고”
    rationale: ἐκ τῶν ἑπτά은 직역하면 ‘일곱으로부터/일곱에서’이며, 단순한 과거 소속을 뜻한다고 단정하지 않습니다. 또한 동사 ἐστιν은 현재형입니다.
  - severity: medium
    issue: “멸망으로 가오”
    rationale: ‘가오’는 현대 표준어 합쇼체로 부자연스럽고 고풍스럽습니다. 현대 격식체 ‘갑니다’로 고쳐야 합니다.
  revised_text: 또 전에 있었으나 지금은 없는 그 짐승은 바로 여덟째이며, 일곱에서 나왔고, 멸망으로 갑니다.
  revised_footnotes:
  - marker: a
    text: 또는 “여덟째 왕”. 문맥상 ‘왕’이 암시될 수 있으나, 그 명사는 그리스어 본문에 직접 쓰이지 않았습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “일곱 중 하나”. 그리스어는 더 직역하면 “일곱에서/일곱으로부터”이며, 기원·소속·밀접한 관계를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: ἐκ τῶν ἑπτά의 해석상 모호성을 보존하도록 “일곱에서 나왔고”로 고치고, ὑπάγει의 현재성을 현대 합쇼체 “갑니다”로 옮겼습니다. ‘여덟째’에 암시된 명사는 본문에서 보충하지 않았으며, 가능한 ‘왕’ 해석은 각주로만 제시했습니다.
