  terminology: ‘인봉하다’는 계시를 봉하여 감추거나 닫는다는 본문의 문맥과 다니엘서의 반향을 적절히 살립니다. ‘예언의 말씀’은 λόγους τῆς προφητείας를 과도하게 해석하지 않고 반영합니다.
