  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
  footnotes:
  - marker: a
    text: Or 'to testify to you these things in the churches' or 'concerning the churches.' The Greek phrase ἐπὶ ταῖς ἐκκλησίαις allows more than one nuance.
    reason: lexical_alternative
  - marker: b
    text: Or 'the root and the offspring of David.'
    reason: alternative_reading
translation:
  language: ko
  text: 나 예수는 교회들을 위하여[a] 이 일들을 너희에게 증언하도록 내 천사를 보냈습니다. 나는 다윗의 뿌리와 자손이며, 빛나는 새벽별입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “교회들에 관하여” 또는 “교회들에서.” 그리스어 ἐπὶ ταῖς ἐκκλησίαις는 하나 이상의 뉘앙스를 가질 수 있습니다.
