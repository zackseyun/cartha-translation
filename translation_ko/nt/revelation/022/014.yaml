review_pass:
  verdict: revise
  source_fidelity: The draft follows the SBLGNT reading ‘those who wash their robes’ and retains access to the tree of life and entry into the city. However, ‘빨다’ is less suitable for the symbolic washing imagery, and the causal ‘것이기 때문이다’ does not represent the ἵνα purpose/result clause well.
  naturalness: ‘복이 있도다’ is archaic rather than modern formal-polite 합쇼체. ‘생명 나무에 나아가는 권리’ is also less idiomatic than ‘생명나무에 나아갈 권리.’ ‘도성’ clearly conveys the visionary city without suggesting a fortified castle.
  terminology: ‘두루마기’ is retained for στολάς, a conventional rendering for the visionary robe imagery. ‘씻는’ better reflects πλύνοντες. ‘권리’ appropriately renders ἐξουσία here as rightful access, not dominion. The textual-variant, cross-reference, and lexical-alternative notes should be supplied with clear anchors.
  issues:
  - severity: medium
    issue: Register is archaic.
    rationale: ‘복이 있도다’ does not meet the requested modern formal-polite 합쇼체 register; ‘복이 있습니다’ does.
  - severity: medium
    issue: The wash verb and clause relation need revision.
    rationale: ‘빨다’ can denote laundering but is less apt for Revelation’s symbolic washing; ‘씻다’ is more direct. ‘것이기 때문이다’ makes the second sentence a causal explanation, whereas ἵνα introduces the intended/resulting access and entry.
  - severity: low
    issue: Footnotes from the audit trail are absent.
    rationale: The prominent textual variant, the Revelation 7:14 imagery note, and the alternative rendering of the gate phrase require anchors and corresponding notes.
