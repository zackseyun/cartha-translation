source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
  footnotes:
  - marker: a
    text: Some manuscripts read, 'Blessed are those who do his commandments' or 'keep his commandments,' instead of 'wash their robes.'
    reason: textual_variant
  - marker: b
    text: The imagery of washing robes echoes Revelation 7:14, where robes are washed and made white in the blood of the Lamb.
    reason: cross_reference
  - marker: c
    text: Or 'through the gates.'
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 두루마기를 씻는[a][b] 사람들은 복이 있습니다. 그리하여 그들은 생명나무에 나아갈 권리를 얻고 문들을 통해[c] 그 도성 안으로 들어갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 ‘자기 두루마기를 씻는’ 대신 ‘그의 계명들을 행하는’ 또는 ‘그의 계명들을 지키는’이라고 되어 있습니다.
    reason: textual_variant
  - marker: b
    text: 두루마기를 씻는 이 표현은 요한계시록 7:14을 떠올리게 합니다. այնտեղ에서는 두루마기를 어린양의 피에 씻어 희게 하였습니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘문들을 통하여’.
    reason: lexical_alternative
