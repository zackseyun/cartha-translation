  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
  footnotes:
  - marker: a
    text: Or 'scroll' for 'book' (βιβλίον), reflecting the ancient physical form of the writing.
    reason: lexical_alternative
  - marker: b
    text: Or 'I bear witness to'; the opening verb is testimony language, not merely a generic warning.
    reason: lexical_alternative
