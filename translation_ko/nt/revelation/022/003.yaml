translation:
  language: ko
  text: 어떤 저주도 더 이상 없을 것입니다[a]. 또 하나님과 어린 양의 보좌가 그 도성에 있을 것이며, 그분의 종들이 그분을 섬길 것입니다[d][c][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주받은 어떤 것’ 또는 ‘저주 아래 있는 어떤 것’.
    reason: κατάθεμα는 문맥상 ‘저주’로 번역할 수 있으나, 저주받은 대상이나 것을 가리키는 의미도 가능합니다.
  - marker: b
    text: 그리스어는 ‘하나님과 어린 양의 보좌’라고 하면서 ‘그분의 종들’과 ‘그분을’에 단수를 사용합니다. 이는 하나님과 어린 양의 구별과 그들의 공동 통치를 함께 보존합니다.
    reason: 원문의 단수 보좌와 단수 대명사, 그리고 병렬된 두 명사의 긴장을 번역에서 해소하지 않도록 설명합니다.
  - marker: c
    text: 또는 ‘종속된 이들’ 또는 ‘노예들’.
    reason: δοῦλοι는 소속과 예속의 관계를 나타내며, ‘종들’은 한국어 성경 문체에서 자연스러운 기본 번역입니다.
  - marker: d
    text: 또는 ‘예배할 것입니다’ 또는 ‘거룩한 섬김을 드릴 것입니다’.
    reason: λατρεύω는 하나님께 드리는 예배 또는 성전적·거룩한 봉사를 가리킬 수 있습니다.
