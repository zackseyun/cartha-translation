base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
  footnotes:
  - marker: a
    text: Or 'I am coming quickly.' The Greek ταχύ can emphasize either nearness ('soon') or swiftness/suddenness ('quickly').
    reason: lexical_alternative
translation:
  language: ko
  text: 「보십시오, 내가 곧[a] 오겠습니다. 내 상이 나와 함께 있으니, 각 사람의 행위에 따라 갚아 주겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 빨리 오겠습니다.’ 헬라어 ταχύ는 시간적 근접성(‘곧’)을 뜻할 수도 있고, 신속함이나 돌발성(‘빨리’)을 뜻할 수도 있습니다.
    reason: lexical_alternative
