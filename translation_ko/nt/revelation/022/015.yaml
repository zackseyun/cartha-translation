id: REV.22.15
reference: Revelation 22:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
  footnotes:
  - marker: a
    text: Or 'everyone who loves and practices a lie.'
    reason: lexical_alternative
  - marker: b
    text: '''Dogs'' is likely metaphorical here, a term of exclusion and moral impurity; some interpreters take it more specifically.'
    reason: cultural_note
translation:
  language: ko
  text: 개들[b]과 마술을 행하는 자들과 성적으로 부도덕한 자들과 살인하는 자들과 우상 숭배자들과 거짓[a]을 사랑하고 행하는 모든 자는 밖에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 거짓말’을 사랑하고 행하는 모든 자.
    reason: lexical_alternative
  - marker: b
    text: ‘개들’은 여기서 배제와 도덕적 부정을 나타내는 비유적 표현일 가능성이 큽니다. 일부 해석자는 이를 더 구체적으로 이해합니다.
    reason: cultural_note
