  to: 개들[b]과 마술을 행하는 자들과 성적으로 부도덕한 자들과 살인하는 자들과 우상 숭배자들과 거짓[a]을 사랑하고 행하는 모든 자는 밖에 있습니다.
  rationale: 합쇼체 종결로 바로잡고, φάρμακοι와 πόρνοι를 현대 표준어에서 의미가 분명한 표현으로 조정했습니다. κύνες는 원문의 구체적 비유 이미지를 보존하여 ‘개들’로 유지했으며, 논쟁적인 세부 해석은 주석에만 제시했습니다. ψεῦδος는 포괄적 의미의 ‘거짓’으로 번역하고 가능한 단수적 대안을 주석으로 보완했습니다.
