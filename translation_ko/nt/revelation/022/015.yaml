review_pass:
  verdict: revise
  source_fidelity: 원문의 ἔξω는 문두에 놓여 배제의 의미를 강조하며, ‘밖에 있습니다’가 이를 충실히 옮깁니다. κύνες는 본문에서 ‘개들’로 유지해야 하며, φάρμακοι는 단순한 공연 마술사가 아니라 주술·마술 행위자이므로 ‘마술을 행하는 자들’로 옮기는 것이 더 정확합니다. πᾶς φιλῶν καὶ ποιῶν ψεῦδος는 ‘거짓을 사랑하고 행하는 모든 자’가 원문의 포괄성 및 지속적 행위를 보존합니다.
  naturalness: 초안은 종결형 ‘있다’가 지정된 현대 합쇼체와 맞지 않습니다. 또한 ‘마술하는 자들’보다 ‘마술을 행하는 자들’이 현대 표준어 문맥에서 더 자연스럽고 의미가 분명합니다. 나열 구조는 원문의 반복된 καί를 반영해 유지했습니다.
  terminology: ‘음행하는 자들’은 전통적 성서 용어로 가능하지만 현대 한국어에서는 범위가 다소 불분명할 수 있어 ‘성적으로 부도덕한 자들’로 명료하게 했습니다. ‘우상 숭배자들’, ‘살인하는 자들’ 및 ‘거짓’은 원문의 윤리적 목록과 어휘 범위를 보존합니다. ‘개들’의 구체적 지시 대상은 논쟁적이므로 본문에서 해석하지 않고 주석으로 제한했습니다.
