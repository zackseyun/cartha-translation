- from: 그러자 그가 나에게 말하였습니다. 「그리하지 마시오! 나는 그대와 그대의 형제 예언자들과 이 책의 말씀을 지키는 자들과 함께한 동료 종일 뿐이오. 하나님께 경배하시오.」
  to: 그러자 그가 내게 말했습니다. “그렇게 하지 마십시오! 나는 당신과 당신의 형제들인 예언자들, 그리고 이 책의 말씀을 지키는 사람들의 동료 종입니다. 하나님께 경배하십시오.”
  rationale: The revision removes the unsupported restrictive particle, uses consistent contemporary formal-polite Korean, and makes the appositional phrase 'your brothers, the prophets' explicit. It retains the source's direct designation 'fellow slave' as '동료 종' and preserves the distinct third group, those who keep the words of this book.
