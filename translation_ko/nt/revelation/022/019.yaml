review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the SBLGNT reading ‘tree of life’ and preserves the reciprocal warning of taking away and God taking away. However, ‘이 예언의 책의 말씀’ is an awkward stacked genitive, and the final modifier ‘이 책에 기록된’ is positioned so that its source function is less clear. The Greek describes the tree of life and holy city as written in this book; it does not merely describe a generic book.
  naturalness: ‘이 예언의 책에 있는 말씀들 가운데서’ is natural formal Korean and renders ἀπὸ τῶν λόγων clearly. ‘그가 받을 몫을 빼앗으실 것입니다’ expresses removal of one’s allotted share naturally without introducing doctrinal interpretation.
  terminology: ‘예언,’ ‘생명나무,’ ‘거룩한 성,’ and ‘몫’ are appropriate standard Korean biblical terms. The significant textual variant ‘book of life’ must be supplied in a footnote.
  issues:
  - severity: medium
    issue: Awkward and potentially unclear genitive phrase
    rationale: ‘이 예언의 책의 말씀’ is not idiomatic modern Korean. The source means ‘the words of the book of this prophecy,’ naturally conveyed as ‘이 예언의 책에 있는 말씀들.’
  - severity: medium
    issue: No footnote for the ‘tree of life’ / ‘book of life’ textual variant
    rationale: The source text reads ‘tree of life,’ but the supplied audit trail identifies ‘book of life’ as a notable manuscript variant. It should be retained in a footnote.
  revised_text: 또 누구든지 이 예언의 책에 있는 말씀들 가운데서 빼면, 하나님께서 이 책에 기록된 생명나무와 거룩한 성에서 그가 받을 몫을 빼앗으실 것입니다.[a]
  revised_footnotes:
  - marker: a
    text: 어떤 사본들은 ‘생명나무’ 대신 ‘생명책’으로 읽습니다.
    reason: textual_variant
  revision_rationale: The revision improves Korean syntax, keeps the conditional warning and its verbal reciprocity, makes clear that the tree of life and holy city are those recorded in this book, and adds the required significant textual-variant note.
