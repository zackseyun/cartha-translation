lexical_decisions:
- source_word: ἔρχου κύριε Ἰησοῦ
  english_pob_choice: Come, Lord Jesus
  chosen_korean: 주 예수여, 오시옵소서
  alternatives_korean:
  - 주 예수님, 오십시오
  - 주 예수여, 오소서
  lexicon: BDAG
  rationale: 마라나타(고전 16:22)의 헬라어 형태로, 직접 호격 기도의 절박한 어조를 살리기 위해 합쇼체 안에서도 「오시옵소서」 청유 호소형을 사용한다.
theological_decisions:
- issue: 22:20 ἔρχου κύριε Ἰησοῦ — 합쇼체 안에서의 직접 호격 기도 어조 보존
  chosen_reading: 「주 예수여, 오시옵소서.」 (호격 + 「하옵소서」체 청유로 마라나타의 절박함 보존)
  alternative_readings:
  - 「주 예수님, 오십시오.」(평범한 합쇼체)
  rationale: 마라나타(μαρανα θα/ἔρχου κύριε)는 초기 교회의 가장 오래된 기도 정식 중 하나로, 직접적이고 절박한 호격 호소이다. 본문 전체가 합쇼체이지만, 이 마지막 기도-호소만은 「오시옵소서」의 청유 호소형으로 옮겨 본문의 호흡과 어조를 보존한다.
  doctrine_reference: 'DOCTRINE.md: Preserve liturgical register of foundational prayer formulas'
revisions:
- from: 이것들을 증언하시는 분이 말씀하십니다. 「그렇다, 내가 속히 오리라.」 아멘. 「주 예수여, 오시옵소서.」[a]
  to: 이것들을 증언하시는 분이 말씀하십니다. “그렇습니다. 내가 곧[a] 오겠습니다.” 아멘. “주 예수님, 오십시오.”
  rationale: 부정확한 마라나타 관련 주석을 삭제하고, 원문의 ταχύ가 지닌 해석상 중요한 양의성을 ‘곧’의 앵커 주석으로 보존했습니다. 또한 전체를 현대 표준어 합쇼체로 맞추되, 마지막 기도의 직접적인 호소와 존대를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:30Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ταχύ의 시간적·방식적 양의성을 주석으로 보존하지 않았고, 현 주석은 ἔρχου κύριε Ἰησοῦ를 ‘마라나타의 헬라어 형태’라고 단정하여 본문 및 언어사적으로 정확하지 않습니다. 계 22:20의 기도는 고전 16:22의 마라나타와 주제상 밀접하지만, 마라나타 자체의 헬라어 형태는 아닙니다.
  naturalness: ‘오리라’와 ‘오시옵소서’는 현대 표준어 합쇼체 목표에 비해 고풍스럽습니다. 직접 기도는 ‘주 예수님, 오십시오’로 옮기면 현대적인 존대와 직접 호소의 간결함을 함께 살릴 수 있습니다. 예수의 약속도 ‘그렇습니다. 내가 곧 오겠습니다’가 합쇼체에 맞습니다.
  terminology: ‘증언하시는 분’, ‘아멘’, ‘주 예수님’은 적절합니다. 한국어의 자연스러운 호칭 존대를 위해 ‘예수님’을 사용했습니다. ‘곧’에는 ταχύ의 ‘속히/신속히’라는 대안적 뉘앙스를 주석으로 남겨야 합니다.
  issues:
  - severity: medium
    issue: 주석이 ‘ἔρχου κύριε Ἰησοῦ는 ... 마라나타의 헬라어 형태’라고 서술함
    rationale: 계 22:20의 헬라어 기도와 고전 16:22의 아람어 표현 마라나타는 관련된 종말론적 기도 전통을 반영할 수 있으나, 전자가 후자의 ‘헬라어 형태’라는 말은 지나치게 단정적이며 정확하지 않습니다.
  - severity: medium
    issue: ταχύ의 양의성이 번역 또는 주석에서 보존되지 않음
    rationale: ταχύ는 ‘곧’(시간적 가까움)과 ‘신속히/빠르게’(도래·행위의 신속성)를 모두 뜻할 수 있습니다. 영어 감사 기록도 이 대안을 주석으로 보존하므로, 한국어에서도 앵커 주석이 필요합니다.
  - severity: low
    issue: ‘오리라’, ‘오시옵소서’의 문체
    rationale: 두 표현은 현대 표준어 합쇼체보다 고풍스럽습니다. 본 작업의 목표 문체에 맞춰 현대적인 합쇼체로 정리하는 편이 적절합니다.
