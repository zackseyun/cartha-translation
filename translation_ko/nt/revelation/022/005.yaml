  text: 그리고 밤이 더 이상 없을 것이며, 그들에게는 등불의 빛이나 햇빛이 필요하지 않을 것입니다. 주 하나님께서 그들에게 빛을 비추실 것이며, 그들은 영원무궁토록 다스릴 것입니다.
