review_pass:
  verdict: revise
  source_fidelity: 그리스어의 병렬 명령(Ἔρχου, εἰπάτω, ἐρχέσθω, λαβέτω)과 ‘생명의 물을 값없이’ 받으라는 초청을 충실히 반영하도록 수정했습니다. 처음 두 ‘오십시오’의 수신자는 본문에서 명시하지 않아 그 모호성을 보존했습니다.
  naturalness: 초안의 ‘듣는 자도 말하기를’, ‘오게 하시오’, ‘받게 하시오’는 현대 표준 합쇼체에서 부자연스럽거나 제삼자에게 허용을 지시하는 뜻으로 읽힐 수 있습니다. 직접 인용과 일반적 청자에게 하는 정중한 명령으로 고쳐 자연스럽게 했습니다.
  terminology: 문맥상 τὸ πνεῦμα는 ‘성령’으로, νύμφη는 계시록의 상징을 해석하지 않고 ‘신부’로 옮겼습니다. ὕδωρ ζωῆς는 ‘생명수’로, δωρεάν은 ‘값없이’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘듣는 자도 말하기를’
    rationale: εἰπάτω는 ‘말하게 하라/말하십시오’에 해당하는 명령인데, 초안의 표현은 현대어 문장으로 미완결적이고 부자연스럽습니다.
  - severity: medium
    issue: ‘목마른 자는 오게 하시오’ 및 ‘원하는 자는 … 받게 하시오’
    rationale: 그리스어의 제삼인칭 명령은 목마르고 원하는 사람에게 오는 것과 받는 것을 권하는 초청입니다. ‘-게 하시오’는 청자에게 그들을 허용하라고 지시하는 뜻으로 바뀔 수 있습니다.
  - severity: low
    issue: ‘영’
    rationale: 이 문맥의 τὸ πνεῦμα는 성령을 가리키는 것이 가장 자연스럽습니다. 한국어 성경 문체와 지시 대상의 명료성을 위해 ‘성령’이 적절합니다.
  revised_text: 성령과 신부가 말합니다. “오십시오.” 듣는 사람도 “오십시오”라고 말하십시오. 목마른 사람은 오십시오. 원하는 사람은 생명수를 값없이 받으십시오.[a][b]
