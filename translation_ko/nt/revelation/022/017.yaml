revisions:
- from: 그리고 영과 신부가 말합니다. 「오시오.」 그리고 듣는 자도 말하기를 「오시오.」 그리고 목마른 자는 오게 하시오. 원하는 자는 생명수를 값없이 받게 하시오.
  to: 성령과 신부가 말합니다. “오십시오.” 듣는 사람도 “오십시오”라고 말하십시오. 목마른 사람은 오십시오. 원하는 사람은 생명수를 값없이 받으십시오.[a][b]
  rationale: 현대 표준 합쇼체에 맞추어 각 명령을 자연스럽게 옮기되, 첫 두 ‘오십시오’의 수신자와 ‘원하는 사람’의 욕망의 대상을 본문에 덧붙이지 않았습니다. ‘성령’과 ‘신부’라는 계시록의 상징적 표현도 유지했습니다.
  reviewer_model: gpt-5.6-terra
