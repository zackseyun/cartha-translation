source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
  footnotes:
  - marker: a
    text: Or “without cost” or “as a gift.”
    reason: lexical_alternative
  - marker: b
    text: The first two calls, “Come,” are commonly understood as an appeal for the Lord’s coming; the following clauses then invite the thirsty and willing person to come and receive life.
    reason: alternative_reading
  - marker: c
    text: Or 'the one who wants it'.
    reason: previous_rendering
translation:
  language: ko
  text: 성령과 신부가 말합니다. “오십시오.” 듣는 사람도 “오십시오”라고 말하십시오. 목마른 사람은 오십시오. 원하는 사람은 생명수를 값없이 받으십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거저”, “선물로”.
    reason: δωρεάν의 어휘적 대안을 제시합니다.
  - marker: b
    text: 처음 두 번의 “오십시오”는 수신자를 명시하지 않습니다. 흔히 주님의 오심을 바라는 부르짖음으로 이해되지만, 본문은 그 수신자를 직접 밝히지 않습니다.
    reason: 반복되는 Ἔρχου의 수신자에 관한 해석적 모호성을 본문에서 해소하지 않도록 보존합니다.
