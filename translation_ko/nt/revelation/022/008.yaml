source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
  footnotes:
  - marker: a
    text: Or 'to bow down before' or 'to pay homage to.' The Greek verb can denote an act of prostration or reverence; here it is rendered 'worship' because of its regular force in Revelation and the rebuke that follows.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 일들을 듣고 보고 있는 이는 나 요한입니다. 내가 듣고 보았을 때에, 이 일들을 나에게 보여 주던 천사의 발 앞에 엎드려 경배하려고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경배하려고’로 번역한 그리스어는 ‘엎드려 절하다’ 또는 ‘경의를 표하다’라는 뜻도 가질 수 있습니다. 여기서는 요한계시록에서의 일반적인 용례와 이어지는 천사의 제지를 고려하여 ‘경배하다’로 옮겼습니다.
    reason: lexical_alternative
