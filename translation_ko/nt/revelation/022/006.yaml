  to: 그리고 그가 내게 말했습니다. “이 말씀은 믿을 만하고 참됩니다. 주, 곧 예언자들의 영들의 하나님께서 자신의 천사를 보내셔서 자신의 종들에게 곧 일어나야 할 일들을 보여 주셨습니다.[a][b]”
  rationale: 현대 합쇼체로 문체를 통일하고, “보내셔서 ... 보여 주셨습니다”로 ἀπέστειλεν ... δεῖξαι의 목적 관계를 자연스럽게 반영했습니다. ἐν τάχει의 논쟁되는 뉘앙스와 δούλοι의 어휘적 범위는 해당 어구에 정확히 연결된 각주로 보존했습니다.
