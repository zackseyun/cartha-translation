revisions:
- from: 그 여인은 광야로 도망쳤습니다. 거기에 하나님께서 그를 위해 예비하신 처소가 있었으니, 그곳에서 천이백육십 일 동안 그를 양육하기 위함이었습니다.
  to: 그 여인은 광야로 도망쳤습니다. 그곳에는 하나님께서 예비하신 처소가 그 여인에게 있습니다. 이는 사람들이 그곳에서 그 여인을 천이백육십 일 동안 양육하도록 하기 위함입니다.
  rationale: The revision retains the present sense of ἔχει, removes the unsupported phrase “그를 위해,” and renders the indefinite plural active τρέφωσιν as “사람들이 … 양육하도록,” preserving its unspecified agent. The purpose clause and stated duration are retained.
  reviewer_model: gpt-5.6-terra
