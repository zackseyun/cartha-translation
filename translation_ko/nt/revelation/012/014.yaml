  source_fidelity: 수정이 필요합니다. 접속사 καὶ는 ‘그러나’가 아니라 단순 연결의 ‘그리고/또’이며, 여성 단수 주어인 γυνή를 남성 대명사 ‘그가’로 받은 것은 원문과 맞지 않습니다. 또한 ἵνα 이하의 목적 표현과 ἀπὸ προσώπου τοῦ ὄφεως(뱀의 낯/면전을 피하여)를 명확히 반영해야 합니다.
  naturalness: ‘그 여인’으로 주어를 반복하면 현대 표준 한국어에서 성별과 지시 대상이 분명해집니다. ‘양육을 받도록 하기 위함입니다’는 수동태와 목적절을 자연스러운 합쇼체로 옮깁니다.
  terminology: γυνή는 문맥상 ‘여인’, ἔρημος는 ‘광야’, ὄφις는 ‘뱀’으로 유지했습니다. 묵시적 기간 표현 ‘한 때와 두 때와 반 때’는 해석을 덧붙이지 않고 직역적으로 보존했습니다.
