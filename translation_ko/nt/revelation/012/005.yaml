source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
  footnotes:
  - marker: a
    text: Or 'who will rule all the nations with an iron rod.' The Greek verb literally means 'shepherd,' but in this context it echoes Psalm 2 and carries royal authority.
    reason: alternative_reading
translation:
  language: ko
  text: 여인이 아들, 곧 사내아이를 낳았습니다. 그 아이는 쇠막대기로 모든 민족을 목자로 다스리게 될 분이십니다[a]. 그리고 그 아이는 하나님께로, 또 그분의 보좌로 낚아채어져 들려 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “쇠막대기로 모든 민족을 다스리게 될 분.” 헬라어 ποιμαίνω는 본래 목자가 양을 돌보는 것을 뜻합니다. 여기서는 시편 2:9의 칠십인역을 반향하여 왕적 통치의 뜻도 지닙니다.
    reason: lexical_alternative
