  to: 여인이 아들, 곧 사내아이를 낳았습니다. 그 아이는 쇠막대기로 모든 민족을 목자로 다스리게 될 분이십니다[a]. 그리고 그 아이는 하나님께로, 또 그분의 보좌로 낚아채어져 들려 올라갔습니다.
  rationale: 본문은 ποιμαίνω의 목자 비유를 ‘목자로 다스리다’로 보존하면서도 시편 2편이 환기하는 왕권적 의미를 자연스럽게 전달하도록 고쳤습니다. μέλλει의 미래·예정 지향은 ‘다스리게 될’로, ἡρπάσθη의 갑작스러운 강제성은 ‘낚아채어져’로 반영했습니다. υἱόν/ἄρσεν과 τέκνον의 어휘 변화는 각각 ‘아들, 곧 사내아이’와 ‘그 아이’로 유지했습니다.
