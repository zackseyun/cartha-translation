    issue: ποιμαίνειν을 본문에서 단순히 ‘다스릴’로 번역함
    rationale: ποιμαίνω는 본래 ‘목양하다/목자로 돌보다’입니다. 이 문맥에서는 왕적 통치를 함축하지만, 본문의 비유를 단순한 해석어로 대체하지 않는 편이 원문에 더 충실합니다.
  - severity: medium
    issue: ‘다스릴 자였습니다’가 μέλλει의 미래 지향을 과거 서술로 처리함
    rationale: μέλλει ποιμαίνειν은 미래의 또는 예정된 행위를 가리킵니다. ‘목자로 다스리게 될 분입니다’가 이를 자연스럽게 나타냅니다.
  - severity: medium
    issue: ἡρπάσθη의 강제성과 돌발성이 본문에서 충분히 드러나지 않음
