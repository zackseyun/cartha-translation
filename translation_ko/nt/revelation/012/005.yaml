  source_fidelity: 개역문은 ποιμαίνειν을 ‘다스리다’로 본문에서 해석하여 목자 비유를 지웠고, μέλλει의 미래·예정 지향도 과거형 ‘자였습니다’로 약화합니다. 또한 ἡρπάσθη의 갑작스럽고 강제적인 이동은 ‘들려 올라갔습니다’만으로는 충분히 드러나지 않습니다.
  naturalness: ‘목자로 다스리게 될 분입니다’는 현대 표준어 합쇼체에서 자연스럽고, 왕적 통치와 목자 은유를 함께 보존합니다. ‘하나님께로, 또 그분의 보좌로’는 반복된 πρὸς를 무리 없이 반영합니다.
  terminology: ‘쇠막대기’는 ῥάβδῳ σιδηρᾷ에 충실합니다. ‘목자로 다스리다’는 ποιμαίνω의 목자 어휘와 시편 2편의 왕권적 반향을 모두 보존하며, 각주에서 ‘다스리다’라는 가능한 번역을 밝혀야 합니다.
  issues:
