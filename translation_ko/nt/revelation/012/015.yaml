  text: 그러자 그 뱀은 자기 입에서 강물 같은 물을 여인 뒤로[a] 내뿜었습니다. 이는 여인을 강물에 휩쓸려 가게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
