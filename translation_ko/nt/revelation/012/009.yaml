lexical_decisions:
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  english_pob_choice: the ancient serpent
  chosen_korean: 옛 뱀
  alternatives_korean:
  - 태초의 뱀
  lexicon: BDAG
  rationale: 창세기 3장의 뱀과의 연속성을 분명히 한다. 「옛」은 ἀρχαῖος의 「원시의/태초부터의」 함의를 자연스럽게 담는다.
- source_word: Διάβολος
  english_pob_choice: the Devil
  chosen_korean: 마귀
  alternatives_korean:
  - 고발자
  lexicon: BDAG
  rationale: 헬라어 「고발자」를 한국어 전통의 「마귀」로 옮긴다. 본문의 다음 절(10절)이 「참소자」를 따로 사용한다.
- source_word: Σατανᾶς
  english_pob_choice: Satan
  chosen_korean: 사탄
  alternatives_korean:
  - 대적자
  lexicon: BDAG
  rationale: 히브리어 차용어 שטן의 음역으로 굳어진 「사탄」을 유지한다.
theological_decisions:
- issue: 12:9의 네 가지 이름의 사슬(용/옛 뱀/마귀/사탄) 보존
  chosen_reading: 옛 뱀, 곧 마귀라고도 하고 사탄이라고도 부르는 자
  alternative_readings:
  - 옛 뱀 곧 사탄
  - 큰 용 마귀
  rationale: 본문은 한 인물을 네 이름(δράκων μέγας / ὄφις ἀρχαῖος / Διάβολος / Σατανᾶς)으로 동시에 식별하며, 창세기 3장의 뱀과 묵시문학의 용을 결합한 정체 폭로다. 한국어에서 이 사슬을 압축하면 묵시적 폭로가 약화되므로 네 이름을 모두 보존한다.
  doctrine_reference: 'DOCTRINE.md: Preserve identifying name-chains in apocalyptic disclosure'
revisions:
- from: 그래서 그 큰 용, 곧 「옛 뱀, 마귀라고도 하고 사탄이라고도 부르는 자」, 온 세상을 미혹하는 자가 내쫓겼습니다. 그가 땅으로 던져졌고, 그의 천사들도 그와 함께 던져졌습니다.
  to: 그 큰 용, 곧 옛 뱀이며 마귀와 사탄이라 불리는 자, 온 세상을 미혹하는 자가 내던져졌습니다. 그가 땅으로 내던져졌고, 그의 천사들도 그와 함께 내던져졌습니다.
  rationale: καί를 무표지로 처리하여 인과를 첨가하지 않았습니다. δράκων, ὄφις, Διάβολος, Σατανᾶς의 식별 연쇄와 ὁ πλανῶν의 현재분사적 성격을 보존했습니다. 세 차례의 βάλλω 수동태는 모두 ‘내던져졌습니다’로 옮겨 원문의 반복 및 강제적 추방 이미지를 유지했습니다. 본문 자체로 의미가 충분히 전달되므로 각주가 반드시 필요하지 않으며, 영어 감사 기록의 대안 독법과 교차참조는 한국어 본문의 필수 각주로 옮기지 않았습니다.
