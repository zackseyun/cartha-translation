  source_fidelity: 개정이 필요합니다. 초안의 ‘그래서’는 καί의 단순 연결을 인과 관계로 강화하며, 첫 번째 ἐβλήθη를 ‘내쫓겼습니다’로, 뒤의 두 반복을 ‘던져졌습니다’로 달리 옮겨 원문의 의도적인 동사 반복과 강제적 아래로 던져짐의 이미지를 충분히 보존하지 못합니다.
