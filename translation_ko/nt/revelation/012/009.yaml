translation:
  language: ko
  text: 그 큰 용, 곧 옛 뱀이며 마귀와 사탄이라 불리는 자, 온 세상을 미혹하는 자가 내던져졌습니다. 그가 땅으로 내던져졌고, 그의 천사들도 그와 함께 내던져졌습니다.
  philosophy: optimal-equivalence
