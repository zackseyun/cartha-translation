    rationale: 본문은 ἐβλήθη를 두 번, ἐβλήθησαν을 한 번 반복합니다. ‘내던져졌습니다’를 일관되게 사용하여 강제적 추방과 반복 강조를 보존하는 것이 안전합니다.
