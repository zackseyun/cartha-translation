id: REV.12.12
reference: Revelation 12:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
  footnotes:
  - marker: a
    text: Or 'the land and the sea.' The Greek γῆ can mean either 'earth' or 'land'; here 'earth' is preferred because the context is cosmic in scope.
    reason: lexical_alternative
  - marker: b
    text: Or 'having great wrath.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'he has a little time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 하늘들이여, 그리고 그 안에 거하는 이들이여, 기뻐하십시오. 땅과 바다에 화가 있습니다. 마귀가 자신에게 남은 시간이 얼마 되지 않은 것을 알고 큰 분노를 품은 채 너희에게 내려왔기 때문입니다.
  philosophy: optimal-equivalence
