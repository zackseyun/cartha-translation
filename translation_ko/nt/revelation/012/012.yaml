revisions:
- from: 그러므로 하늘들이여, 그리고 그 안에 거하는 자들이여, 기뻐하십시오. 그러나 땅과 바다에는 화가 있을 것입니다. 마귀가 자기에게 시간이 얼마 남지 않은 줄을 알고 큰 분노를 품고 너희에게 내려갔기 때문입니다.
  to: 그러므로 하늘들이여, 그리고 그 안에 거하는 이들이여, 기뻐하십시오. 땅과 바다에 화가 있습니다. 마귀가 자신에게 남은 시간이 얼마 되지 않은 것을 알고 큰 분노를 품은 채 너희에게 내려왔기 때문입니다.
  rationale: 원문의 논리 연결(διὰ τοῦτο), 하늘을 향한 호격과 명령, οὐαὶ의 현재적·감탄적 심판 선언, 그리고 마귀가 남은 시간이 짧음을 알고 분노한 채 내려온 상황을 보존했습니다. ‘너희’는 바로 앞의 땅과 바다로 표상된 지상 영역의 대상들을 가리키는 원문의 복수 지시를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:01Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘그러나’는 원문의 접속이나 대조 표지가 아니며, ‘화가 있을 것입니다’는 현재의 감탄적 심판 선언인 οὐαὶ를 미래 예언으로 바꿉니다. 또한 ‘자기에게’는 마귀를 가리키는 재귀 표현으로 의미가 어색하고, 원문의 ‘그가 … 알고’에 맞지 않습니다.
  naturalness: 호격을 ‘하늘들이여 … 자들이여’로 살리고 합쇼체 명령형 ‘기뻐하십시오’을 유지하는 것은 자연스럽습니다. 다만 ‘땅과 바다에는 화가 있을 것입니다’보다 ‘땅과 바다에 화가 있습니다’가 원문의 선언적 경고를 더 자연스럽고 정확하게 드러냅니다.
  terminology: ‘마귀’, ‘큰 분노’, ‘시간’은 표준적이고 적절합니다. σκηνοῦντες는 이 문맥에서 ‘거하는 이들’로 옮겨도 충분하며, ‘큰 분노를 품은 채’는 ἔχων의 동반 상황을 잘 반영합니다.
  issues:
  - severity: high
    issue: ‘그러나’가 추가되었습니다.
    rationale: διὰ τοῦτο는 ‘그러므로’이며, 이어지는 οὐαὶ 앞에 원문에는 ‘그러나’에 해당하는 대조 접속사가 없습니다.
  - severity: high
    issue: ‘화가 있을 것입니다’가 οὐαὶ의 시제·화행을 변경합니다.
    rationale: οὐαὶ는 ‘화가 있습니다/화가 임합니다’와 같은 감탄적 심판 선언이며, 단순한 미래형으로 한정할 근거가 없습니다.
  - severity: high
    issue: ‘마귀가 자기에게 시간이 얼마 남지 않은 줄을 알고’의 ‘자기에게’는 잘못된 지시입니다.
    rationale: εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει는 마귀가 ‘자신에게 남은 시간이 얼마 되지 않음을’ 안다는 뜻입니다. 한국어에서는 ‘자기에게’보다 ‘자신에게’ 또는 주어를 드러낸 표현이 명확합니다.
  - severity: medium
    issue: ‘큰 분노를 품고’의 동반 상황을 더 명확히 할 수 있습니다.
    rationale: ἔχων θυμὸν μέγαν은 마귀가 큰 분노를 지닌 상태로 내려온 것을 나타내므로 ‘큰 분노를 품은 채’가 자연스럽습니다.
  revised_text: 그러므로 하늘들이여, 그리고 그 안에 거하는 이들이여, 기뻐하십시오. 땅과 바다에 화가 있습니다. 마귀가 자신에게 남은 시간이 얼마 되지 않은 것을 알고 큰 분노를 품은 채 너희에게 내려왔기 때문입니다.
  revised_footnotes: []
  revision_rationale: 원문의 논리 연결(διὰ τοῦτο), 하늘을 향한 호격과 명령, οὐαὶ의 현재적·감탄적 심판 선언, 그리고 마귀가 남은 시간이 짧음을 알고 분노한 채 내려온 상황을 보존했습니다. ‘너희’는 바로 앞의 땅과 바다로 표상된 지상 영역의 대상들을 가리키는 원문의 복수 지시를 유지합니다.
