review_pass:
  verdict: revise
  source_fidelity: 첫 접속사 καὶ는 단순 연결의 ‘그리고/또’인데, 초안의 ‘그러나’는 대조를 추가합니다. 또한 ἔβαλεν은 ‘내뿜다’보다 ‘내던지다/쏟아 내다’의 강한 방출 행위를 더 직접적으로 나타냅니다.
  naturalness: 합쇼체 문장으로 전반적으로 자연스럽습니다. 다만 ‘그 입’은 바로 앞의 ‘땅’과 연결되어 용의 입을 가리키는지 잠시 모호할 수 있으므로 ‘자기 입’으로 분명히 하는 것이 좋습니다.
  terminology: γῆ는 종말론적·우주적 이미지에 맞게 ‘땅’, γυνή는 해석을 덧붙이지 않은 ‘여인’, δράκων은 ‘용’, ποταμός은 ‘강’으로 옮겼습니다. ‘강물’도 가능하나 원문의 명사에 맞추어 ‘강’을 유지했습니다.
  issues:
  - severity: medium
    issue: ‘그러나’가 καὶ에 없는 대조를 첨가합니다.
    rationale: 원문은 두 절을 καὶ로 연결하며 대조 접속사를 사용하지 않습니다.
  - severity: low
    issue: ‘그 입’의 지시 대상이 잠시 모호합니다.
    rationale: 앞 절에서 땅의 입이 언급되므로, 용의 입은 재귀 표현으로 명시하는 편이 한국어에서 자연스럽고 정확합니다.
  - severity: low
    issue: ‘내뿜은’은 ἔβαλεν의 ‘던지다/내보내다’보다 다소 해석적입니다.
    rationale: 용이 강을 입에서 강하게 내보낸 이미지를 보존하기 위해 ‘내던진’이 더 가까운 대응입니다.
  revised_text: 그리고 땅이 여인을 도왔습니다. 땅이 그 입을 벌려, 용이 자기 입에서 내던진 강을 삼켜 버렸습니다.
