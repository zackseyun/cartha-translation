  terminology: ‘구원’, ‘능력’, ‘나라’, ‘권세’, ‘메시아’, ‘참소하는 자’는 원문의 핵심 용어와 구별(δύναμις/ἐξουσία)을 잘 보존합니다. ‘형제들’은 ἀδελφῶν의 남성 복수를 그대로 반영합니다.
  issues:
