  to: 또 나는 하늘에서 큰 음성이 이렇게 말하는 것을 들었습니다. 「이제 우리 하나님의 구원과 능력과 나라와 그분의 메시아의 권세가 임하였습니다. 우리 형제들을 참소하는 자, 곧 우리 하나님 앞에서 밤낮으로 그들을 참소하는 자가 내던져졌기 때문입니다.」
  rationale: 원문의 동사상과 어휘적 이미지를 보존하도록 ‘참소하던’과 ‘내쫓겼습니다’를 각각 ‘참소하는’과 ‘내던져졌습니다’로 고쳤습니다. 그 밖의 표현은 원문의 병렬 구조와 정중한 현대 한국어 문체를 적절히 반영하므로 유지했습니다.
