    issue: ὁ κατηγορῶν을 ‘참소하던 자’로 번역함
    rationale: 원문은 현재분사이므로 하나님 앞에서 밤낮으로 계속 참소하는 행위를 나타냅니다.
  - severity: low
    issue: Καὶ를 ‘그러자’로 번역함
    rationale: ‘그러자’는 앞 사건의 결과나 강한 시간적 전개를 덧붙일 수 있습니다. 이 절에서는 단순 연결인 ‘또’가 안전합니다.
