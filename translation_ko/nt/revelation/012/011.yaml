    text: 또는 ‘생명’, ‘자아’, ‘영혼’. 그리스어 프쉬케(ψυχή)는 ‘생명’, ‘자아’, ‘영혼’을 뜻할 수 있으며, 여기서는 죽음의 문맥상 ‘목숨’을 가리킵니다.
