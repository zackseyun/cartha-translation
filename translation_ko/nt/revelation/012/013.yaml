  source_fidelity: 초안의 ‘박해하였습니다’는 διώκω의 가능한 의미이지만, 이 문맥의 구체적인 적대적 추격이라는 서사적 의미를 좁혀 버립니다. 또한 ‘내쫓긴’은 ἐβλήθη의 강제적으로 땅에 던져짐이라는 표현을 충분히 드러내지 못합니다.
  naturalness: ‘땅으로 내던져진 것을 보고’와 ‘그 여인을 뒤쫓았습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 묵시적 장면의 긴장도 유지합니다. ‘남자아이’는 여기서 명사화된 ‘남성’을 한국어로 자연스럽게 보충합니다.
  terminology: δράκων은 ‘용’, γυνή는 해석을 덧붙이지 않는 ‘여인’으로 옮겼습니다. τὸν ἄρσενα의 성별 강조는 ‘남자아이’로 보존했습니다. διώκω의 ‘박해하다’ 가능성은 각주에 남겨 본문의 의미를 단정하지 않았습니다.
  issues:
