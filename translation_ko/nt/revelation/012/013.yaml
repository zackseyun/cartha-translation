  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
  footnotes:
  - marker: a
    text: Or 'persecuted the woman.' The Greek verb can mean either 'pursued' or 'persecuted'; here it likely includes both hostile pursuit and persecution.
