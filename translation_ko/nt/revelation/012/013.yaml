    issue: διώκω를 ‘박해하였습니다’로만 번역함
    rationale: 이 동사는 박해를 뜻할 수 있으나, 본 절에서는 용이 여인을 뒤따르는 직접적 행동을 가리키는 ‘뒤쫓다/추격하다’가 우선적입니다. ‘박해하다’만으로는 이 서사적 움직임이 사라집니다.
  - severity: low
    issue: ἐβλήθη를 ‘내쫓긴’으로 번역함
    rationale: ‘내쫓기다’는 추방의 결과는 전달하지만, βάλλω의 수동형이 나타내는 강제적 던져짐 및 ‘땅으로’의 방향성을 약화합니다.
