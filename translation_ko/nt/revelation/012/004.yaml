- from: 그 꼬리가 하늘의 별들의 삼분의 일을 쓸어 땅에 던졌습니다. 그 용은 해산하려는 여인 앞에 섰는데, 여인이 아이를 낳자마자 그 아이를 삼키려는 것이었습니다.
  to: 그 꼬리가 하늘의 별들 삼분의 일을 쓸어 땅에 던졌습니다. 그 용은 아이를 낳으려는 여인 앞에 서 있었습니다. 이는 여인이 아이를 낳을 때 그 아이를 삼키려는 것이었습니다.
  rationale: 원문에 없는 ‘자마자’의 즉각성을 제거하고, 용이 여인 앞에 서 있는 상태와 그 목적을 더 충실하게 반영했습니다. 의미상 해석을 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:01Z'
review_pass:
  verdict: revise
  source_fidelity: '첫 절은 σύρει(현재: ‘쓸어 가며’)와 ἔβαλεν(과거: ‘던졌다’)의 시제 대비를 자연스럽게 대체로 반영합니다. 그러나 후반부의 ἵνα ὅταν τέκῃ는 ‘낳자마자’가 아니라 ‘낳을 때/낳으면’이라는 목적절이며, 즉각성을 덧붙이지 않는 편이 원문에 충실합니다. ἕστηκεν은 완료형으로, 용이 여인 앞에 이미 서 있는 상태를 나타내므로 ‘서 있었습니다’가 적절합니다.'
  naturalness: ‘해산’도 가능하지만, 이 문맥에서는 ‘아이를 낳다’가 현대 표준어에서 더 직접적이고 자연스럽습니다. 목적 관계를 독립 문장으로 명료하게 드러내되 합쇼체 서술을 유지했습니다.
  terminology: ‘용’은 δράκων의 통상적이고 적절한 번역입니다. ‘하늘의 별들’, ‘삼분의 일’, ‘아이’도 문맥과 한국어 성경 문체에 자연스럽습니다.
  issues:
  - severity: medium
    issue: ‘낳자마자’가 원문에 없는 즉각성을 추가합니다.
    rationale: ὅταν τέκῃ는 ‘그녀가 낳을 때/낳으면’이라는 시간 조건을 나타낼 뿐, ‘곧바로’라는 의미를 포함하지 않습니다.
  - severity: low
    issue: ‘섰는데’는 ἕστηκεν의 지속된 상태와 목적절의 연결을 다소 약하게 드러냅니다.
    rationale: 완료형 ἕστηκεν과 ἵνα 목적절을 ‘서 있었습니다. 이는 … 것이었습니다’로 옮기면 서 있는 행위의 목적이 더 분명해집니다.
  revised_text: 그 꼬리가 하늘의 별들 삼분의 일을 쓸어 땅에 던졌습니다. 그 용은 아이를 낳으려는 여인 앞에 서 있었습니다. 이는 여인이 아이를 낳을 때 그 아이를 삼키려는 것이었습니다.
