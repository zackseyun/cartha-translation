  to: 그러나 용은 이기지 못하였고[a], 그들이 있을 자리는 더 이상 하늘에서 발견되지 않았습니다.
  rationale: 첫 절은 단수 동사의 선행사인 용을 명시하고, ἰσχύω는 전투 문맥에 맞게 ‘이기지 못하였습니다’로 옮겼습니다. 둘째 절은 εὑρέθη의 수동태를 ‘발견되지 않았습니다’로 보존했으며, αὐτῶν은 앞 절의 용과 그의 천사들을 가리키는 문맥적 복수 대명사로서 ‘그들이 있을 자리’로 자연스럽게 표현했습니다. ἔτι의 부정적 시간 의미는 ‘더 이상’으로 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:01Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘그들이 ... 찾지 못하였습니다’는 εὑρέθη(‘발견되었다/찾아졌다’)의 수동 표현을 그들이 행하는 능동 행위로 바꿉니다. 또한 ἴσχυσεν의 단수 주어는 앞 절의 용을 가리키므로 ‘용은 이기지 못하였고’가 적절합니다.
  naturalness: ‘그들이 있을 자리는 더 이상 하늘에서 발견되지 않았습니다’는 현대 표준어 합쇼체로 자연스러우며, 원문의 수동 구문과 ‘더 이상’을 함께 보존합니다.
  terminology: ‘용’, ‘하늘’, ‘이기다’는 요한계시록 문맥 및 한국어 성서 문체에 적절합니다. ‘이기지 못하다’는 ἰσχύω의 문맥상 ‘이기다/우세하다’라는 뜻을 자연스럽게 드러내며, 어휘적 대안은 각주로 남깁니다.
  issues:
  - severity: medium
    issue: 수동태 εὑρέθη가 능동태로 전환됨
    rationale: ‘그들이 ... 찾지 못하였습니다’는 ‘그들로 인해 자리가 발견되지 않았다’가 아니라 ‘그들이 자리를 찾는 데 실패했다’는 뜻이 되어, 원문의 문법적 표현과 초점이 달라집니다.
  - severity: low
    issue: 영어 POB의 ἰσχύω 어휘 대안 각주가 한국어 초안에 없음
    rationale: ‘이기지 못하다’는 적절하지만, ‘충분히 강하지 못하다’라는 직접적 어휘 대안을 각주로 제시하면 감사 추적과 해석의 폭을 보존합니다.
  revised_text: 그러나 용은 이기지 못하였고[a], 그들이 있을 자리는 더 이상 하늘에서 발견되지 않았습니다.
