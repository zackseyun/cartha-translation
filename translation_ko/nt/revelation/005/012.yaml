translation:
  language: ko
  text: 그들은 큰 소리로 말했습니다. 「죽임을 당하신 어린양은 권능과 부와 지혜와 힘과 존귀와 영광과 찬송을 받으시기에 합당하십니다.」
  philosophy: optimal-equivalence
