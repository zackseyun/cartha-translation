  source_fidelity: 핵심 구문과 대상은 대체로 충실합니다. 그러나 「안팎으로」는 ἔσωθεν καὶ ὄπισθεν의 대조, 곧 안쪽과 두루마리의 뒷면(반대쪽 면)을 충분히 드러내지 못합니다. 이를 본문에서 더 구체적으로 보존하는 편이 안전합니다.
  naturalness: 「보좌에 앉아 계신 분의 오른손에 … 두루마리가 있는 것을 보았습니다」 및 「안쪽과 뒷면에 기록되어 있고」는 현대 표준어 합쇼체 서술로 자연스럽습니다. 「일곱 인으로 봉인된」은 요한계시록 문맥에서 통용되는 교회어를 유지하면서도 문장 안에서 자연스럽게 연결됩니다.
  terminology: 「두루마리」는 βιβλίον의 당대 매체와 본문의 양면 기록·봉인 이미지를 잘 반영합니다. 「인」은 σφραγῖς의 전통적 번역으로 유지할 수 있습니다. 각주 a의 단정적 표현은 원문의 문맥상 개연성을 말하는 표현으로 완화하는 것이 영어 감사 기록 및 학문적 신중성과 더 잘 맞습니다.
