source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
  footnotes:
  - marker: a
    text: Or, more traditionally, “the Lion of the tribe of Judah.”
    reason: lexical_alternative
  - marker: b
    text: Or “has overcome.” The Greek verb is a key Revelation term for victorious conquest.
    reason: lexical_alternative
  - marker: c
    text: The phrase “so that he can open” renders a Greek infinitive that may also be translated more literally as “to open.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 장로들 중 한 사람이 나에게 말했습니다. 「울지 마십시오. 보십시오. 유다 지파에서 나온 사자, 곧 다윗의 뿌리께서 이기셔서[a] 두루마리와 그 일곱 봉인을 여실 수 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「승리하셔서」. 헬라어 동사는 계시록에서 승리를 나타내는 핵심 용어이다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  english_pob_choice: the Lion from the tribe of Judah
  chosen_korean: 유다 지파에서 난 사자
  alternatives_korean:
  - 유다 지파의 사자
  lexicon: BDAG
  rationale: 창세기 49:9와 결합된 메시아 이미지. 「~에서 난」으로 출신을 명시한다.
