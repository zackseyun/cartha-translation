  to: 그러자 장로들 중 한 사람이 나에게 말했습니다. 「울지 마십시오. 보십시오. 유다 지파에서 나온 사자, 곧 다윗의 뿌리께서 이기셔서[a] 두루마리와 그 일곱 봉인을 여실 수 있습니다.」
  rationale: 현대 합쇼체를 일관되게 적용하고, 봉인에 대한 자연스러운 한국어 동사를 사용했습니다. ‘이기셔서 … 여실 수 있습니다’는 ἐνίκησεν 뒤의 부정사 ἀνοῖξαι를 승리의 결과로 열 수 있게 되었다는 의미로 표현하되, ‘합당함’ 같은 추가 개념은 도입하지 않습니다.
