  to: 또 내가 보니, 보좌 한가운데와 네 생물들 한가운데에, 또 장로들 한가운데에, 죽임을 당한 듯 서 계신 한 어린 양이 있었습니다[a]. 그분께는 일곱 뿔과 일곱 눈이 있었는데, 그 눈들은 온 땅으로 보내심을 받은 하나님의 일곱 영입니다[b].
  rationale: 반복된 공간 표현을 ‘한가운데’로 유지하고, ‘네 생물들’을 명시했습니다. ὡς ἐσφαγμένον은 ‘죽임을 당한 듯’으로, ἑστηκὸς는 ‘서 계신’으로 옮겨 어린 양이 살아 서 있으나 죽임당한 흔적을 지닌다는 원문의 역설을 보존했습니다. 관계절의 선행사인 ‘일곱 눈’을 명시하여 하나님의 일곱 영과의 동일시를 문법적으로 분명히 했습니다. ‘하나님의 일곱 영’은 해석적으로 바꾸지 않고 주석에서만 가능한 이해를 제한적으로 안내했습니다.
