translation:
  language: ko
  text: 그분께서 두루마리를 받으시자, 네 생물과 스물네 장로가 어린 양 앞에 엎드렸습니다. 그들은 각각 수금[a]과 향이 가득 담긴 금 대접들을 들고 있었습니다. 이 대접들은 성도들의[b] 기도입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「리라」.
    reason: lexical_alternative
  - marker: b
    text: 또는 「거룩한 자들」.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιάλας χρυσᾶς
