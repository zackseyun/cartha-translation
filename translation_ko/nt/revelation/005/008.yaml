  source_fidelity: 원문의 분배적 표현(ἕκαστος)과 수량을 반영해야 합니다. 각 존재가 수금 한 개와 금 대접들(φιάλας, 복수)을 가지고 있으며, 마지막 관계절은 문법상 금 대접들을 가리킵니다. 현 초안의 단수 「금 대접」은 복수 원문을 충분히 반영하지 못합니다.
  naturalness: 「그분께서 두루마리를 받으시자」와 「어린 양 앞에 엎드렸습니다」는 자연스럽고 합쇼체 문체에 적절합니다. 다만 마지막 절은 「그것」보다 「이 대접들은」으로 받으면 선행사가 분명해지고, 상징적 동일시도 직접적으로 살아납니다.
  terminology: 「두루마리」, 「네 생물」, 「장로」, 「어린 양」, 「수금」, 「금 대접」, 「성도」는 문맥과 요한계시록의 용례에 적절합니다. 「수금」의 대안인 「리라」 및 「성도들」의 대안인 「거룩한 자들」은 각각 해당 낱말에 각주를 분리하여 연결해야 합니다.
