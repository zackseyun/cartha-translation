  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
  footnotes:
  - marker: a
    text: Or "the book." The Greek word βιβλίον can mean either, but in this setting "scroll" best fits the ancient form and the imagery of opening it.
    reason: lexical_alternative
  - marker: b
    text: Or "to look at it." The phrase may mean simply seeing it, but in context likely refers to looking into its contents.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 두루마리를 열거나 그것을 보기에 합당한 사람은 아무도 발견되지 않았기 때문에, 나는 크게 울고 있었습니다.
  philosophy: optimal-equivalence
