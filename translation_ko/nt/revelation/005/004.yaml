revisions:
- from: 그래서 내가 크게 울었으니, 이는 그 두루마리를 펴거나 그것을 들여다보기에 합당한 자가 발견되지 아니하였기 때문입니다.
  to: 그 두루마리를 열거나 그것을 보기에 합당한 사람은 아무도 발견되지 않았기 때문에, 나는 크게 울고 있었습니다.
  rationale: This revision follows the Greek word order and sense without adding an inferential transition. It renders the imperfect ἔκλαιον with an ongoing past expression, retains the passive ‘was found,’ uses 두루마리 for βιβλίον, and renders βλέπειν broadly as 보다 rather than interpreting it as inspection of the contents.
  reviewer_model: gpt-5.6-terra
