  - severity: medium
    issue: 「왕의 왕이요 주의 주」가 원문의 복수 속격을 충분히 반영하지 못합니다.
    rationale: βασιλέων과 κυρίων은 복수입니다. 「왕들의 왕이시며 주들의 주」가 문법적 수와 칭호의 최상급적 의미를 더 명확히 보존합니다.
