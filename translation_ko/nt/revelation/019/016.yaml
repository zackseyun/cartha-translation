  chosen_reading: 「왕의 왕이요 주의 주」 (각주로 헬라어 대문자 명문 형식 명시)
  alternative_readings:
  - 전통적 「만왕의 왕이요 만주의 주」
  rationale: 헬라어 본문은 명문(inscription) 형식으로 대문자로 기록되어, 옷과 넓적다리에 새겨진 칭호의 시각적 권위를 강조한다. 한국어 대문자가 없으므로 따옴표(「」)로 명문 형식을 표시하고 각주로 원문 표기를 보존한다. 「왕의 왕」/「주의 주」의 헬라어 소유격 구조를 직역하여 「만(萬)」을 첨가하지 않는다.
  doctrine_reference: 'DOCTRINE.md: Preserve epigraphic form; do not domesticate titular constructions'
revisions:
- from: 그리고 그분은 자기 옷과 자기 넓적다리에 이런 이름이 기록되어 있습니다. 「왕의 왕이요 주의 주」[a].
  to: 그리고 그분은 옷과 넓적다리 위에 기록된 이름을 지니고 계십니다. 「왕들의 왕이시며 주들의 주」[a]
  rationale: ἔχει는 「지니고 계십니다」로, ὄνομα γεγραμμένον은 「기록된 이름」으로 옮겨 현재의 소유와 완료 수동 분사의 결과 상태를 보존했습니다. 두 ἐπί 구는 해석적으로 조화시키지 않고 「옷과 넓적다리 위에」로 유지했습니다. 제목은 복수 속격을 반영해 「왕들의 왕이시며 주들의 주」로 고쳤습니다. 근거 없는 대문자·명문 형식 설명과 그에 따른 따옴표의 시각적 정당화는 삭제하고, 원문의 범위 안에서 가능한 어휘적 대안을 제시했습니다.
