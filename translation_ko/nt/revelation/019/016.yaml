  source_fidelity: 현재 번역은 ἔχει의 현재 시제와 기록된 이름이라는 핵심 뜻을 대체로 전달합니다. 그러나 βασιλέων 및 κυρίων은 모두 복수 속격인데, 「왕의 왕이요 주의 주」는 한국어에서 단수 소유 관계로 읽히기 쉬워 복수와 최상급적 용법을 충분히 드러내지 못합니다. 또한 본문은 대문자 명문 형식으로 기록되어 있지 않으며, 제시된 SBLGNT 본문에 근거하여 그러한 서지적·시각적 주장을 할 수 없습니다.
  naturalness: 「그분은 옷과 넓적다리 위에 기록된 이름을 지니고 계십니다」는 원문의 소유 동사와 분사 수식을 자연스러운 현대 합쇼체로 옮깁니다. 제목은 「왕들의 왕이시며 주들의 주」가 현대 한국어에서 자연스럽고 복수 속격 구조도 드러냅니다.
  terminology: 「왕들의 왕이시며 주들의 주」는 왕과 주라는 칭호를 보존하면서 헬라어의 복수형을 반영합니다. 「넓적다리」는 μηρός의 직접적인 번역입니다. 각주는 인쇄상의 대문자나 명문 형식이라는 근거 없는 설명 대신, γεγραμμένον의 가능한 번역을 제한적으로 제시해야 합니다.
