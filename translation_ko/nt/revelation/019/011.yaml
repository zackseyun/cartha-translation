review_pass:
  verdict: revise
  source_fidelity: 초안은 열린 하늘, 흰 말, 그 위에 앉은 이, 그의 칭호, 의로운 심판과 전쟁이라는 그리스어의 핵심 내용을 대체로 충실히 옮깁니다. 다만 πολεμεῖ의 군사적 의미는 ‘싸우십니다’보다 ‘전쟁을 하십니다’가 더 분명하게 보존합니다.
  naturalness: ‘보십시오, 흰 말이 있었고’는 한국어에서 다소 부자연스럽고 시제 연결도 매끄럽지 않습니다. ‘보십시오, 흰 말이 있고’는 ἰδού의 현장감과 원문의 명사절적 제시를 자연스럽게 살립니다. 칭호는 인용부호와 명사 반복 없이 서술하는 편이 자연스럽습니다.
  terminology: πιστός와 ἀληθινός은 문맥상 칭호적 용법을 살려 ‘신실하시고 참되신 분’으로 옮겼습니다. δικαιοσύνη의 기본 번역은 ‘의’로 유지하고, 영어 감사 기록의 ‘justice’ 대안을 ‘정의’ 각주로 보존했습니다.
  issues:
  - severity: medium
    issue: πολεμεῖ를 ‘싸우십니다’로 번역함
    rationale: ‘싸우다’는 개인적 싸움도 뜻할 수 있어 πολεμέω의 전쟁 수행 의미가 약해질 수 있습니다. ‘전쟁을 하십니다’가 원문의 의미 범위를 더 직접적으로 보존합니다.
  - severity: low
    issue: ‘보십시오, 흰 말이 있었고’의 어색한 연결
    rationale: ἰδού 뒤의 흰 말 제시는 서술 과거보다 현재적 제시인 ‘흰 말이 있고’가 더 자연스럽고 묵시적 현장감을 살립니다.
