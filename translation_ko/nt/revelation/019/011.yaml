revisions:
- from: 그리고 나는 하늘이 열려 있는 것을 보았습니다. 보십시오, 흰 말이 있었고, 그 위에 앉으신 분은 「신실하신 분」이요 「참되신 분」이라 불리시며, 의로 심판하시고 싸우십니다.
  to: 또 나는 하늘이 열려 있는 것을 보았습니다. 보십시오, 흰 말이 있고, 그 위에 앉으신 분은 신실하시고 참되신 분이라 불리십니다. 그분은 의로[a] 심판하시고 전쟁을 하십니다.
  rationale: 문장의 현대 표준 한국어 자연스러움을 높이면서 원문의 ἰδού가 주는 제시 효과를 보존했습니다. 칭호적 형용사는 존칭 문맥에 맞게 ‘신실하시고 참되신 분’으로 처리했으며, πολεμεῖ는 전쟁의 뜻을 명시했습니다. δικαιοσύνη의 번역 대안은 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
