- from: 그분의 심판은 참되고 의로우시기 때문이다. 그분께서 자기 음행으로 땅을 부패케 한 큰 창녀를 심판하시고, 그의 손에서 자기 종들의 피를 갚아 주셨도다.」
  to: 이는 그분의 심판이 참되고 의로우며, 그분께서 자기 음행으로 땅을 타락시킨 큰 창녀를 심판하시고 그 여자의 손에 묻은 자기 종들의 피를 갚아 주셨기 때문입니다.
