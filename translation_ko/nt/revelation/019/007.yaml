review_pass:
  verdict: revise
  source_fidelity: The draft incorrectly renders γάμος as “혼인 잔치” (wedding feast). In this verse γάμος denotes the marriage/wedding; the feast is explicitly mentioned in the following verse. The threefold summons is otherwise broadly represented, but the heightened force of ἀγαλλιῶμεν is better retained with a distinct expression.
  naturalness: “우리가 … 하자” is natural, but “기뻐하고 즐거워하며” weakens the distinct, intensified pairing of χαίρωμεν and ἀγαλλιῶμεν. “기뻐하고 크게 즐거워하며” is fluent modern formal Korean and preserves the parallelism.
  terminology: “어린 양,” “영광을 돌리다,” and “신부” are appropriate established Korean biblical terminology. A note should preserve the lexical possibility of “아내” for γυνή in this wedding context.
  issues:
  - severity: high
    issue: “혼인 잔치” adds ‘feast’ to γάμος.
    rationale: The Greek text says that the Lamb’s marriage/wedding has come; the marriage supper/feast is stated in Revelation 19:9, not here. Rendering it as “혼인” avoids importing material from the next verse.
  - severity: low
    issue: The paired joy verbs are insufficiently differentiated.
    rationale: ἀγαλλιῶμεν intensifies χαίρωμεν. Adding “크게” retains the emphatic second verb without becoming unnatural.
  - severity: low
    issue: No note preserves the contextually secondary lexical rendering of γυνή.
    rationale: “신부” is the best contextual rendering, while “아내” remains a lexical alternative and can be supplied in a concise footnote.
  revised_text: 우리가 기뻐하고 크게 즐거워하며 그분께 영광을 돌립시다. 어린 양의 혼인이 이르렀고, 그분의 신부[a]가 자신을 준비하였기 때문입니다.
