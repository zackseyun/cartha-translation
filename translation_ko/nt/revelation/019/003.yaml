  source_fidelity: 개정이 필요합니다. αὐτῆς는 문맥상 여성으로 의인화된 바벨론을 가리키는데, 초안의 ‘그의’는 남성 소유 대명사이므로 이를 충실히 반영하지 못합니다. 또한 ἀναβαίνει는 현재형이므로 인용문 안에서 현재형으로 옮기는 것이 적절합니다. εἰς τοὺς αἰῶνας τῶν αἰώνων은 ‘영원토록’으로 자연스럽게 옮기되, 직역적 관용구는 각주로 밝혔습니다.
  naturalness: ‘그들이 두 번째로 말하였습니다’는 δεύτερον의 순차성을 보존하면서 현대 표준어 합쇼체에 자연스럽습니다. 인용문 전체를 직접 인용으로 처리하고, ‘올라갑니다’로 현재의 생생한 묘사를 살렸습니다.
  terminology: ‘할렐루야’는 본문의 예배적 감탄사 Ἁλληλουϊά를 관례적으로 음역한 것입니다. ‘그녀의’는 바벨론의 여성 의인화를 보존합니다. ‘영원토록’은 그리스어 관용구의 통상적이고 자연스러운 번역입니다.
