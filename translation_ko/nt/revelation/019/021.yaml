revisions:
- from: 그리고 나머지는 말을 타신 분의 입에서 나오는 칼로 죽임을 당하였고, 모든 새들이 그들의 살로 배를 채웠습니다.
  to: 그리고 그 나머지 사람들은 말을 타신 분의 입에서 나온 칼에 죽임을 당하였습니다[a]. 그리고 모든 새들이 그들의 살로 배를 채웠습니다[b].
  rationale: ‘나오는 칼’을 그리스어의 완료된 동작을 반영하는 ‘나온 칼’로 고쳤습니다. 또한 선행 문맥에서 가리키는 대상을 분명히 하되, 본문의 묵시적 이미지를 해석으로 대체하지 않았습니다. 영어 POB 감사 기록의 두 주석을 한국어에 맞게 유지하고 해당 표현에 연결했습니다.
