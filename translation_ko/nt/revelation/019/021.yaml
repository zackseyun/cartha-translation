translation:
  language: ko
  text: 그리고 그 나머지 사람들은 말을 타신 분의 입에서 나온 칼에 죽임을 당하였습니다[a]. 그리고 모든 새들이 그들의 살로 배를 채웠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “살해되었습니다.”
    reason: ‘죽임을 당하였습니다’에 대한 가능한 어휘적 대안입니다.
  - marker: b
    text: 그분의 입에서 나온 “칼”은 묵시적 이미지입니다. 요한계시록 19:15을 보십시오.
    reason: 칼의 이미지를 본문에서 해석하지 않고, 관련 본문을 제시합니다.
