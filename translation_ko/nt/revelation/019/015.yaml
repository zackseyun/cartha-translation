  to: 그분의 입에서는 날카로운 칼이 나옵니다. 그것으로 민족들을 치시려고 하시는 것이며, 그분은 친히 쇠 지팡이로 그들을 목양하실 것입니다[a]. 또 그분은 전능하신 하나님의 진노에서 비롯된 격노의 포도주 틀을 친히 밟으십니다.
