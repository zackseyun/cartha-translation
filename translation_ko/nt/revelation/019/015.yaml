id: REV.19.15
reference: Revelation 19:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
  footnotes:
  - marker: a
    text: Or, 'he will rule them with an iron rod.' The Greek verb literally means 'shepherd,' echoing Psalm 2 while retaining the pastoral metaphor.
    reason: alternative_reading
  - marker: b
    text: Traditional English often has 'with a rod of iron.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 입에서는 날카로운 칼이 나옵니다. 그것으로 민족들을 치시려고 하시는 것이며, 그분은 친히 쇠 지팡이로 그들을 목양하실 것입니다[a]. 또 그분은 전능하신 하나님의 진노에서 비롯된 격노의 포도주 틀을 친히 밟으십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 다스리실 것입니다.’ 그리스어 동사는 문자적으로는 ‘목양하다’라는 뜻이며, 시편 2편을 반향하면서도 목자의 비유를 유지합니다. ‘쇠 지팡이’는 전통적으로 ‘철장’ 또는 ‘쇠막대기’로도 옮깁니다.
    reason: alternative_reading
