review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal actions and preserves the ambiguous genitive in “예수의 증언.” However, “그래서” adds a consequential nuance not expressed by καί, and the construction for σύνδουλός ... καὶ τῶν ἀδελφῶν σου is awkward and does not clearly state that the angel shares slave-status with both John and his brothers.
  naturalness: The mixture of archaic “그대/뿐이오/때문이오” with the stated modern formal-polite register is uneven. Modern 합쇼체 is better maintained with “당신/하십시오/입니다,” while retaining the solemn direct-speech style.
  terminology: “경배,” “종,” “예수의 증언,” and “예언의 영” are suitable. “종” appropriately represents σύνδουλος without importing an interpretive distinction, and “예수의 증언” retains the source’s disputed subjective/objective-genitive ambiguity.
  issues:
  - severity: medium
    issue: Unwarranted connective and unclear fellowship syntax
    rationale: καί is additive (“And”), not necessarily consequential (“그래서”). Also, “그대와 그대의 형제들 ... 함께한 동료 종” is syntactically strained. The Greek states that the speaker is a fellow slave with John and with John’s brothers who have the testimony of Jesus.
  - severity: low
    issue: Register is not consistently modern formal-polite
    rationale: “그대,” “뿐이오,” and “때문이오” sound archaic or literary beside surrounding 합쇼체. The requested target is modern formal-polite Korean.
  - severity: low
    issue: Ambiguity of μαρτυρία Ἰησοῦ should be documented
    rationale: The Korean wording “예수의 증언” is appropriately noncommittal, but a note should explicitly preserve the possible senses “Jesus에 관한 증언” and “Jesus께서 하신 증언,” applying to both occurrences.
  revised_text: 나는 그에게 경배하려고 그의 발 앞에 엎드렸습니다. 그러나 그가 나에게 말하였습니다. “조심하십시오. 그러지 마십시오! 나는 당신과 예수의 증언을 지닌 당신의 형제들과 같은 종입니다. 하나님께 경배하십시오. 예수의 증언이 곧 예언의 영이기 때문입니다.”
  revised_footnotes:
  - marker: a
    text: ‘예수의 증언’은 ‘예수에 관한 증언’ 또는 ‘예수께서 하신 증언’을 뜻할 수 있습니다. 이 모호성은 이 절의 두 경우 모두에 적용됩니다.
    reason: alternative_reading
  revision_rationale: The revision removes the added causal force of “그래서,” clarifies that the angel is a fellow slave with John and the brothers who have the testimony of Jesus, and regularizes the direct speech in modern formal-polite 합쇼체. It retains “예수의 증언” and “예언의 영” without resolving the Greek genitive or flattening πνεῦμα.
