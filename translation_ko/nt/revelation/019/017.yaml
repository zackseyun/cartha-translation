  text: 그리고 나는 한 천사가 태양 속에 서 있는 것을 보았습니다. 그가 하늘 한가운데를 날아다니는 모든 새들에게 큰 소리로 외치며 말하였습니다. 「오십시오. 하나님의 큰 만찬에 함께 모이십시오.[a]」
