review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘먹으리라’는 ἵνα 아래의 목적/결과를 나타내는 접속법 φάγητε를 미래 서술로 바꾸므로 수정이 필요합니다. 또한 ‘말들과 그것을 탄 자들의 살’은 ‘살’의 반복과 복수 선행사를 충분히 드러내지 못합니다.
  naturalness: ‘천부장들’, ‘힘센 자들’, ‘그 위에 앉은 자들’ 및 ‘먹게 하려는 것입니다’는 현대 표준어 합쇼체에서 자연스러우면서도 원문의 열거와 목적 관계를 보존합니다.
  terminology: χιλίαρχοι는 군사 직책으로 ‘천부장들’로, δοῦλοι는 자유인과의 사회적 신분 대조에 맞추어 ‘종’으로 옮겼습니다. μικροί καὶ μεγάλοι의 포괄적 대조는 ‘작은 자와 큰 자’로 유지했습니다.
  issues:
  - severity: high
    issue: ‘먹으리라’가 목적절을 미래 단언으로 번역함
    rationale: ἵνα φάγητε는 앞 절의 소집에 이어 ‘먹게 하려는’ 목적을 나타내며, 단순 미래형은 이 문법적 연결을 약화하거나 바꿉니다.
  - severity: medium
    issue: 말과 그 위에 탄 자들에 대한 ‘살’의 병렬 반복이 불명확함
    rationale: σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ αὐτῶν은 말들의 살과 그 위에 앉은 자들의 살을 가리킵니다. ‘말들과 그것을 탄 자들의 살’은 말들에 대한 ‘살’을 독립적으로 명시하지 않고 ‘그것’의 복수 지시도 부자연스럽습니다.
  revised_text: 왕들의 살과 천부장들의 살과 힘센 자들의 살과 말들의 살과 그 위에 앉은 자들의 살과, 모든 자유인과 종, 작은 자와 큰 자들의 살을 먹게 하려는 것입니다.」
