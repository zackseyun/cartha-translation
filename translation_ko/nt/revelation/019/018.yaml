- from: 왕들의 살과 군대장관들의 살과 강한 자들의 살과 말들과 그것을 탄 자들의 살, 그리고 자유인이든 종이든, 작은 자든 큰 자든, 모든 사람의 살을 먹으리라.」
  to: 왕들의 살과 천부장들의 살과 힘센 자들의 살과 말들의 살과 그 위에 앉은 자들의 살과, 모든 자유인과 종, 작은 자와 큰 자들의 살을 먹게 하려는 것입니다.」
  rationale: 목적 접속사 ἵνα와 접속법 φάγητε를 ‘먹게 하려는 것입니다’로 반영하고, 원문에서 반복되는 ‘살’을 각 병렬 항목에 명시했습니다. αὐτῶν은 복수인 말들을 가리키므로 ‘그 위에’로 자연스럽게 옮겼습니다. 인용문의 시작은 앞 절에 있으므로 제공된 절의 닫는 인용 부호는 유지했습니다.
  reviewer_model: gpt-5.6-terra
