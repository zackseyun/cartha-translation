- from: 그리고 그가 나에게 말하였습니다. 「기록하시오. 「어린 양의 혼인 잔치에 초대받은 자들은 복이 있도다.」」 또 그가 나에게 말하였습니다. 「이것은 하나님의 참된 말씀이오.」
  to: 그가 내게 말했습니다. 「기록하십시오. 어린양의 혼인 잔치에 초대받은 사람들은 복이 있습니다.」 또 그가 내게 말했습니다. 「이 말씀들은 하나님의 참된 말씀입니다.」
