review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the fiery eyes, the many royal headpieces, and the exclusive knowledge of the name. However, the final Korean clause presents the name merely as existing in a written state and does not clearly express that the rider has/bears that written name (ἔχων ὄνομα γεγραμμένον). Its reflexive phrase is also less clearly anchored to the rider than it should be.
  naturalness: The overall sentence is fluent in modern formal-polite Korean. Recasting the last clause with an explicit subject and object makes the rider’s possession of the written name clear while retaining a natural descriptive sequence.
  terminology: ‘왕관’ is an acceptable accessible rendering of διαδήματα, though the term specifically denotes royal diadems. ‘불꽃 같았고’ is idiomatic Korean for the Greek nominal fiery description and does not impose a doctrinal interpretation. ‘기록된 이름’ suitably represents ὄνομα γεγραμμένον.
  issues:
  - severity: medium
    issue: The final clause does not explicitly express ἔχων (‘having/bearing’).
    rationale: ‘이름이 기록되어 있었습니다’ states that a name was written, but the Greek participle describes the rider as having a written name. The revision explicitly makes the rider the bearer of the name.
  - severity: low
    issue: ‘자기 외에는’ has a potentially less explicit antecedent in Korean.
    rationale: Because the immediately relevant verb has ‘아무도’ as its negative subject, ‘자신 외에는’ more clearly identifies the rider as the sole knower.
  revised_text: 그분의 눈은 불꽃 같았고, 그분의 머리에는 많은 왕관이 있었으며, 그분은 자신 외에는 아무도 알지 못하는 기록된 이름을 지니고 계셨습니다.
  revised_footnotes:
  - marker: a
    text: ‘왕관’에 해당하는 그리스어는 특히 왕권을 나타내는 관, 곧 ‘디아뎀’을 가리킵니다.
    reason: διαδήματα의 왕권적·기술적 뉘앙스를 보존하는 어휘 주석입니다.
  revision_rationale: 'The revision preserves the source’s compact, majestic description while explicitly rendering the participial construction: the rider bears a name that has been written, and no one except the rider knows it. The footnote supplies the more specific royal sense of διαδήματα without making the main Korean text unnecessarily technical.'
