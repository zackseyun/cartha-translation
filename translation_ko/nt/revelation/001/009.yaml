review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘함께 참여한 자’는 완료된 과거 참여로 읽힐 수 있으나, συγκοινωνός는 요한이 독자들과 현재 공유하는 처지를 가리킵니다. 또한 ἐγενόμην ἐν τῇ νήσῳ는 여기서 섬에 ‘있었다’는 뜻이며, ‘있게 되었습니다’는 본문에 없는 도착·변화의 뉘앙스를 더할 수 있습니다.
  naturalness: ‘여러분의 형제요, … 나 요한은’이라는 도입은 현대 표준어 합쇼체 성경 문체에서 자연스럽습니다. ‘밧모라고 하는 섬에 있었습니다’도 원문의 관용적 위치 표현을 자연스럽게 반영합니다.
  terminology: ‘환난’, ‘나라’, ‘인내’는 θλίψις, βασιλεία, ὑπομονή를 적절히 반영합니다. ‘예수의 증언’은 원문의 속격이 지닌 주관적·객관적 가능성을 본문에서 보존하므로, ‘예수에 관한 증언’이라는 대안을 각주로 제시해야 합니다.
  issues:
  - severity: medium
    issue: ‘함께 참여한 자’의 시제·상태 표현
    rationale: συγκοινωνός는 명사로서 독자들과 공유하는 동료 참여자라는 현재적 관계를 나타냅니다. ‘참여한 자’는 과거에 끝난 행위처럼 들릴 수 있습니다.
  - severity: medium
    issue: ‘밧모라는 섬에 있게 되었습니다’의 추가 뉘앙스
    rationale: ἐγενόμην은 이 문맥에서 위치 상태를 나타내므로 ‘있었습니다’가 적절합니다. ‘있게 되었습니다’는 섬에 이르게 된 경위나 변화가 본문에 명시된 것처럼 암시할 수 있습니다.
  - severity: low
    issue: 예수의 증언에 관한 각주 누락
    rationale: μαρτυρία Ἰησοῦ의 속격은 예수께서 하신 증언과 예수에 관한 증언 양쪽으로 해석될 수 있습니다. 본문은 모호성을 보존하고, 대안은 각주로 밝혀야 합니다.
  revised_text: 여러분의 형제요, 예수 안에서 환난과 나라와 인내를 여러분과 함께 나누는 나 요한은, 하나님의 말씀과 예수의 증언 때문에 밧모라고 하는 섬에 있었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘예수에 관한 증언’. 그리스어 속격은 예수께서 하신 증언 또는 예수에 관한 증언을 뜻할 수 있습니다.
    reason: alternative_reading
  revision_rationale: 공동 참여의 현재적 의미를 ‘여러분과 함께 나누는’으로 자연스럽게 옮기고, 섬에 있었다는 위치 표현은 원문이 말하지 않는 이동·도착의 뉘앙스 없이 번역했습니다. ‘예수의 증언’은 원문의 모호성을 유지했으며, 객관적 속격 가능성은 각주에 보존했습니다.
