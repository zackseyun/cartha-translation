    issue: ‘나팔 소리 같은’은 σάλπιγγος에 ‘소리’라는 명사를 보탭니다.
    rationale: σάλπιγγος는 ‘나팔’이며, 음성의 성격을 나팔에 비유합니다. 한국어에서도 ‘나팔 같은 큰 음성’으로 충분히 자연스럽고 더 가깝게 옮길 수 있습니다.
