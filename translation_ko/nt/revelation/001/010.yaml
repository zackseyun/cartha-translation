  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ὡς σάλπιγγος는 직역하면 ‘나팔 같은’이며, ‘나팔 소리 같은’은 비교 대상에 ‘소리’를 덧붙입니다. 또한 ἐν πνεύματι의 번역상 모호성을 설명하는 각주가 필요합니다.
  naturalness: ‘영 안에 있게 되었습니다’는 본문의 ἐγενόμην의 상태 진입을 보존하면서도 한국어 성경 문체에서 이해 가능한 표현입니다. 문장을 접속하여 원문의 καί를 자연스럽게 반영했습니다.
  terminology: ‘주의 날’은 κυριακῇ ἡμέρᾳ의 형식을 보존하며 ‘주일’로 특정하지 않습니다. 종말론적 독법은 본문과 동일한 한국어 표기로 나타날 수 있으므로, 각주에서 의미상의 대안임을 밝혔습니다. ‘영 안에’는 성령으로 단정하지 않아 원문의 해석 여지를 보존합니다.
  issues:
