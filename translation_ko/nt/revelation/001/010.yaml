    rationale: 대안은 어휘의 한국어 표기가 아니라 종말론적 ‘주의 날’이라는 해석입니다. 또한 κυριακῇ ἡμέρᾳ가 통상적인 ‘주의 날’ 종말론 표현과 다르다는 점을 명확히 설명해야 합니다.
