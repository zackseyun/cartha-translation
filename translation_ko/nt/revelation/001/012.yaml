    rationale: Καὶ는 여기서 단순 연결이며, 인과를 명시하는 ‘그래서’는 원문보다 논리 관계를 강화합니다.
  - severity: low
    issue: ‘말씀하시는’
    rationale: ἐλάλει는 단순히 ‘말하고 있었다/말하고 있던’이며, 높임 표현은 헬라어 동사에 표지되지 않은 화자에 대한 존대를 첨가합니다.
  revised_text: 그리고 나는 나와 말하고 있던 음성을 보려고 돌아섰습니다. 돌아서서 일곱 금 등잔대를 보았습니다.
