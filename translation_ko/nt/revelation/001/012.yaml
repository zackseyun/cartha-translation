  naturalness: ‘나에게 말씀하시는 음성’은 문법적으로 가능하나, 원문의 화자 정체가 아직 드러나지 않은 문맥에서 높임말이 다소 앞서갑니다. ‘나와 말하고 있던 음성’은 μετά + 속격의 ‘with me’를 보존하면서 현대 한국어 문장으로도 자연스럽습니다.
  terminology: ‘등잔대’는 λυχνία를 ‘등잔’ 자체나 ‘촛대’로 혼동하지 않게 하는 적절한 번역입니다. ‘금 등잔대’도 자연스럽고 정확합니다.
