  rationale: 수정문은 하나님이 계시를 예수에게 주셨다는 사실과 예수가 자신의 노예들에게 이를 보이고 천사를 통하여 요한에게 알렸다는 원문의 전달 순서를 명확히 합니다. 속격의 해석상 모호성은 「예수 메시아의 계시」 및 각주로 보존했습니다. δεῖ의 필연성은 「일어나야 할」로, ἐν τάχει의 해석 가능성은 「곧」 및 각주로 보존했습니다.
