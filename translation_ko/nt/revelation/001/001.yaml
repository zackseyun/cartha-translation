review_pass:
  verdict: revise
  source_fidelity: 현 번역은 핵심 어휘와 속격의 모호성을 대체로 잘 보존합니다. 그러나 「하나님께서 … 자기 노예들에게 보이게 하셨으며」는 δεῖξαι의 목적 주체인 예수를 하나님과 혼동하게 하며, 뒤의 「자신의 천사」「자기 노예 요한」의 소유 관계도 불분명하게 만듭니다. 하나님이 계시를 예수에게 주시고, 예수가 자신의 종들에게 그것을 보이며 천사를 통하여 요한에게 알리는 전달 구조를 드러낼 필요가 있습니다. 또한 ἐν τάχει의 ‘신속히’ 가능성을 보존하는 각주가 필요합니다.
  naturalness: 합쇼체 문장으로 자연스럽지만, 반복되는 「자기」는 한국어에서 선행자가 하나님인지 예수인지 불명확합니다. 「예수께서 자신의 …」으로 주체를 명시하면 자연스럽고 오독을 막습니다. 「곧 일어날 일들」보다 「곧 일어나야 할 일들」이 δεῖ의 필연성을 더 충실히 반영합니다.
  terminology: 「계시」, 「메시아」, 「노예」는 프로젝트의 선택 및 원문의 어감을 잘 반영합니다. 「표징으로 알리다」는 σημαίνω의 표지·상징 전달의 뉘앙스를 보존할 수 있으나, 해당 표현에 대한 각주 표지는 본문에서 분명히 연결되어야 합니다.
