    rationale: 현 [c] 각주는 ἐσήμανεν을 설명하지만 본문 표지는 「노예 요한」 뒤에 있어 어느 표현을 설명하는지 다소 불명확합니다. 「표징을 통해 알려 주셨습니다」에 직접 표지를 붙이는 편이 낫습니다.
