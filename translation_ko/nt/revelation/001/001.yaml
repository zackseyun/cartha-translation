    issue: ἐν τάχει의 대안적 의미에 대한 각주 누락
    rationale: 「곧」은 가능한 번역이지만, 이 표현은 시간적 임박뿐 아니라 일이 시작될 때 신속히 이루어진다는 뜻으로도 이해될 수 있습니다. 영어 POB 감사 기록의 해당 대안을 한국어에서도 보존해야 합니다.
