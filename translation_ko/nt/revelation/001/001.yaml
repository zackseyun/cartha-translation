    issue: δεῖξαι의 행위 주체와 αὐτοῦ의 선행자가 불명확함
    rationale: 「하나님께서 … 자기 노예들에게 보이게 하셨으며」는 하나님이 자신의 노예들에게 직접 보이신다는 뜻으로 읽히기 쉽습니다. 문맥상 하나님은 계시를 예수에게 주시고, 예수는 자신의 노예들에게 그것을 보이도록 되어 있습니다.
