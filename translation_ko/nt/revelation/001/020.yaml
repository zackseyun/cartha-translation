review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the explanatory structure, the seven stars, the golden lampstands, and the identification of stars with angels and lampstands with churches. However, “내 오른손에서” is not the natural Korean expression for the stars’ location in/on the speaker’s right hand, and “회중” is less appropriate than “교회” for ἐκκλησίαι in this Revelation context.
  naturalness: The sentence is generally clear, but “내 오른손에서 네가 본” is awkward because -에서 normally marks the place of an action rather than the location of objects being held. “네가 내 오른손에 있는 것을 본 일곱 별” is also avoidable; reordering to “네가 내 오른손에서 본 일곱 별” is natural and clear in Korean.
  terminology: Use “교회” for ἐκκλησίαι, consistent with the source-contextual sense and standard modern Korean biblical terminology. “천사들” suitably retains the main-text rendering of ἄγγελοι. In the note, “전령들” is clearer modern Korean than “사자들,” which can be archaic or ambiguous in contemporary usage.
  issues:
  - severity: medium
    issue: “내 오른손에서 네가 본” is an unnatural rendering of ἐπὶ τῆς δεξιᾶς μου.
    rationale: The Greek depicts the stars as being at/in the speaker’s right hand. Korean “-에서” immediately before “네가 본” can sound as though the seeing originated from the hand. Reordering the phrase yields a natural locative expression while retaining the source meaning.
  - severity: medium
    issue: “회중” should be revised to “교회.”
    rationale: Although “회중” can denote an assembly or congregation, ἐκκλησίαι in Revelation 1:20 refers to the seven churches addressed in the following chapters. “교회” is the standard, natural Korean rendering and aligns with the English POB audit trail.
  - severity: low
    issue: The footnote’s alternative “사자들” is dated and potentially unclear in modern Korean.
    rationale: “전령들” naturally conveys the human-messenger sense of ἄγγελοι without deciding that interpretation in the main text.
  revised_text: '네가 내 오른손에서 본 일곱 별과 일곱 금 등잔대의 비밀은 이러하다: 일곱 별은 일곱 교회의 천사들[a]이며, 일곱 등잔대는 일곱 교회이다.」'
  revised_footnotes:
  - marker: a
    text: 또는 「일곱 교회의 전령들」. 헬라어 ἄγγελος는 천사나 사람의 전령을 가리킬 수 있다.
    reason: alternative_reading
