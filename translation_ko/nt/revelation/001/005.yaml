revisions:
- from: 또한 신실한 증인이시며, 죽은 자들 가운데서 처음 나신 분이시며, 땅의 왕들의 통치자이신 예수 메시아께로부터, 은혜와 평강이 여러분에게 있기를 빕니다. 우리를 사랑하시고 자기 피로 우리를 우리의 죄들에서 풀어 주신[a] 그분—
  to: 그리고 메시아이신 예수께로부터, 곧 신실한 증인이시며 죽은 이들 가운데서 처음 나신 분이시며 땅의 왕들의 통치자이신 분께로부터 [옵니다]. 우리를 사랑하시고 자기 피로 우리를 우리 죄들에서 풀어 주신[a] 그분께—
  rationale: 제공된 1:5 원문에 없는 인사말을 삭제했습니다. Χριστοῦ의 칭호성을 「메시아이신」으로 명시하고, 원문의 병렬 칭호와 Τῷ ἀγαπῶντι의 여격을 반영했습니다. 본문은 SBLGNT의 λύσαντι(풀어 주신)를 따르며, λούσαντι(씻으신) 이문은 기존 각주로 보존했습니다. 대괄호의 「옵니다」는 한국어에서 절 4의 선행 술어가 생략된 문맥을 표시할 수 있는 보충이며, 독립 본문으로 제시할 경우에는 삭제하거나 상위 문맥의 「은혜와 평강이 ... 있기를 빕니다」와 결합해 조판할 수 있습니다.
  reviewer_model: gpt-5.6-terra
