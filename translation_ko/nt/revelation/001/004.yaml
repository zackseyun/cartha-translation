  source_fidelity: 수신자 표기와 은혜·평강의 문안, 그리고 두 ἀπό 구문의 출처 관계는 대체로 충실합니다. 다만 ἐκκλησίαις는 이 서신의 기독교 공동체 문맥에서 「교회」가 가장 표준적이고 정확한 대응어입니다. 「지금 계시고 전에 계셨으며 장차 오실 분」은 원문의 현재·과거·현재분사(오고 계시는 분)의 시간적 배열과 칭호성을 자연스럽게 보존합니다.
  naturalness: 합쇼체 문안 양식으로 자연스럽게 다듬었습니다. 「요한이 … 편지합니다」보다 「요한은 …에 편지합니다」가 표제적 서신 도입에서 더 매끄럽고, 「지금도」보다 「지금」이 원문의 단순 현재를 불필요하게 강조하지 않습니다.
  terminology: 「교회」는 계시록의 ἐκκλησία에 대한 확립된 표준어이며 제도교회만을 뜻하도록 한정되지 않습니다. 「은혜와 평강」, 「보좌」, 「일곱 영」은 적절합니다. 신적 칭호에 관한 각주는 출애굽기 3:14와의 관련을 단정하지 않고 가능성으로 표현하여 본문의 해석상 여지를 보존했습니다.
