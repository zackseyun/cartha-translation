source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
  footnotes:
  - marker: a
    text: Or more literally, 'unto the ages of ages.'
    reason: lexical_alternative
  - marker: b
    text: Some later manuscripts read 'kings and priests' instead of 'a kingdom, priests.' The main text follows the provided Greek reading.
    reason: textual_variant
translation:
  language: ko
  text: 우리를 한 나라로, 그분의 하나님 곧 아버지께 드리는 제사장들로 삼으신 그분께 영광과 권세가 영원무궁하기를[a] 빕니다. 아멘.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, 「세세토록」. 헬라어는 「세세의 세세에」라는 관용어를 사용한다.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλείαν, ἱερεῖς
  english_pob_choice: a kingdom, priests
  chosen_korean: 나라가 되게 하시고, … 제사장이 되게 하신
  alternatives_korean:
  - 왕들과 제사장들
  lexicon: BDAG
  rationale: SBLGNT 본문(「나라, 제사장들」)을 그대로 따르며, 일부 후대 사본의 「왕들과 제사장들」 독법은 채택하지 않는다.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁하기를
  alternatives_korean:
  - 세세토록
  lexicon: BDAG
  rationale: 한국어 송영 정형으로 「영원무궁」을 채택해 송영의 음악성을 살린다.
