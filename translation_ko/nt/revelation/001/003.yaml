  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
  footnotes:
  - marker: a
    text: Or 'the one who reads'; the Greek likely refers to a public reader in the assembly, hence 'reads aloud.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the appointed time is near.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 예언의 말씀을 낭독하는 자[a]와 듣고 그 안에 기록된 것을 지키는 자들은 복이 있습니다. 때가[b] 가깝기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘읽는 자’. 그리스어는 한 명의 읽는 사람과 여러 듣는 사람을 구별하며, 회중에서 공적으로 낭독하는 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정해진 때가 가깝기 때문입니다’.
    reason: lexical_alternative
