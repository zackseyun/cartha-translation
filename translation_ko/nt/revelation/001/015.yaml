translation:
  language: ko
  text: 그분의 발은 마치 풀무에서 달구어져 빛나는 청동[a]과 같았으며, 그분의 음성은 많은 물 소리 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어의 희귀어로, 정확한 금속 종류는 확실하지 않습니다. 정련되거나 빛나는 금속 합금을 가리킬 수 있으며, ‘고운 놋쇠’ 또는 ‘광택 나는 청동’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαλκολιβάνῳ
