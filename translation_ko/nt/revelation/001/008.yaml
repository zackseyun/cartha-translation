  source_fidelity: 본문의 주요 호칭과 자기 선언은 잘 옮겼습니다. 다만 ὁ ἐρχόμενος는 현재분사이므로 본문에서는 ‘오시는 분’으로 옮겨 진행 중인 도래의 뉘앙스를 보존하는 편이 더 직접적입니다. 영어 감사본에 보존된 ‘장차 오실 분’ 대안은 각주로 제시할 수 있습니다.
