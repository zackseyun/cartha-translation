  terminology: ‘주 하나님’, ‘알파와 오메가’, ‘전능하신 분’은 원문의 신적 칭호와 한국어 성서적 용례에 적절합니다. ‘전능하신 분’은 ὁ παντοκράτωρ의 명사적 호칭을 잘 반영합니다.
  issues:
