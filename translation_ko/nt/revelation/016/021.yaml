  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
  footnotes:
  - marker: a
    text: Or, 'weighing about a talent'—that is, roughly the weight of a talent each; the Greek expresses comparison rather than exact measurement.
    reason: lexical_alternative
  - marker: b
    text: Or, 'for its plague is very great.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 무게가 한 달란트쯤 되는 큰 우박[a]이 하늘에서 사람들 위로 내려옵니다. 사람들은 그 우박의 재앙 때문에 하나님을 모독하였습니다. 그 재앙이 매우 심하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 달란트 무게의’. 달란트는 고대의 무게 단위이며, 그리스어는 정확한 측정이라기보다 비교를 나타냅니다.
    reason: lexical_alternative
