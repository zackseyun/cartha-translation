  - severity: medium
    issue: ‘의로우십니다’의 주어-서술어 존칭 불일치
    rationale: ‘심판’은 하나님의 행위/판결을 가리키며 존칭 대상이 아닙니다. 복수 주어 αἱ κρίσεις에 맞춰 ‘의롭습니다’가 적절합니다.
