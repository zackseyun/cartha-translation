  source_fidelity: 초안의 ‘제단에서 나는 음성’은 원문에 없는 ‘음성’을 보충하고, 제단 자체가 말하는 묵시적 의인화를 약화합니다. τοῦ θυσιαστηρίου λέγοντος는 문맥상 ‘제단이 말하는 것을’으로 옮기는 것이 가장 직접적입니다. 또한 κρίσεις는 복수이므로 ‘의로우십니다’보다 ‘의롭습니다’가 문법적으로 정확합니다.
  naturalness: ‘또 나는 제단이 말하는 것을 들었습니다’는 현대 표준 한국어에서 자연스러우면서 원문의 의인화를 유지합니다. 하나님의 호칭에는 존칭 호격 ‘전능하신 분이시여’를 사용하고, 하나님의 소유는 현대 공적 성경 문체에 알맞게 ‘주님의’으로 처리했습니다.
  terminology: κύριε, ὁ θεός, ὁ παντοκράτωρ를 ‘주 하나님, 전능하신 분이시여’로 모두 보존했습니다. κρίσεις는 법정적·종말론적 의미를 유지하여 ‘심판’으로, ἀληθιναὶ καὶ δίκαιαι는 ‘참되고 의롭습니다’로 옮겼습니다.
