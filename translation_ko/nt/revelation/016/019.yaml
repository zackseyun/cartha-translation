translation:
  language: ko
  text: 그리고 큰 도성이 세 부분으로 갈라졌고, 여러 민족의 도시들이 무너졌습니다. 또 큰 바벨론은 하나님 앞에 기억되었습니다. 이는 하나님께서 그 도성에 그분의 진노의 격노의 포도주 잔을 주시기 위함이었습니다.
