  source_fidelity: 원문의 μεγάλης φωνῆς는 여기서 ‘큰 음성’보다 ‘큰 소리/큰 목소리’, λεγούσης는 그 소리가 일곱 천사들에게 말하는 것으로 옮기는 것이 정확합니다. Ὑπάγετε와 ἐκχέετε는 복수 명령이므로 합쇼체 명령으로 옮겼으며, ‘대접을 땅 위에 쏟아붓다’는 φιάλας 및 εἰς τὴν γῆν의 심상을 보존합니다.
  naturalness: 초안의 ‘말씀하시는 큰 음성’은 무생물인 ‘음성’에 높임말을 적용하여 부자연스럽고, 인용문의 ‘쏟아라’는 표준 현대 합쇼체와 맞지 않습니다. ‘일곱 천사들에게 말하는 큰 소리’와 ‘쏟아부으십시오’가 자연스럽습니다.
  terminology: ‘성소’는 계시록의 ναός에 대한 적절한 선택이며, ‘하나님의 진노’, ‘일곱 대접’은 각각 θυμός τοῦ θεοῦ와 φιάλας를 충실히 반영합니다. 별도 각주는 필요하지 않습니다.
  issues:
  - severity: medium
    issue: ‘말씀하시는 큰 음성’
    rationale: λεγούσης의 주어는 φωνῆς(음성/소리)이며, 원문은 발화자를 하나님으로 명시하지 않습니다. ‘말씀하시다’는 높임말과 암시적 신적 화자를 도입하고, ‘음성’과의 결합도 부자연스럽습니다.
  - severity: medium
    issue: ‘쏟아라’
    rationale: 원문의 명령은 일곱 천사를 향한 복수형이며, 목표 문체인 현대 합쇼체에 맞게 복수 수신자에게 하는 공손한 명령으로 옮겨야 합니다.
  - severity: low
    issue: ‘큰 음성’
    rationale: μεγάλης φωνῆς는 문맥상 소리의 크기를 가리키므로 현대 한국어에서는 ‘큰 소리’가 더 자연스럽습니다.
