  - severity: low
    issue: 후반부 수식절의 문장 흐름을 다듬을 필요가 있습니다.
    rationale: 원문의 ‘전례 없는 지진’과 ‘이처럼 큰 지진’이라는 강조를 한국어에서 명료하게 연결할 수 있습니다.
