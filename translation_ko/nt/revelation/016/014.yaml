translation:
  language: ko
  text: 이들은 표적들을 행하는 귀신들의 영들입니다[a]. 이들은 온 세상의 왕들에게 나아가[b], 전능하신 하나님의 큰 날의 전쟁을 위하여 그들을 모으려고 합니다—
  philosophy: optimal-equivalence
  footnotes:
