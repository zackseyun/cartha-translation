  source_fidelity: 개정이 필요합니다. 초안의 ‘모으는 것이었습니다’는 헬라어 목적 부정사 συναγαγεῖν(‘모으려고/모으기 위하여’)를 과거의 서술·명사절로 바꾸며, 현재형 ἐκπορεύεται의 흐름도 살리지 못합니다. 또한 ‘온 천하의 왕들에게 나가’는 행위 주체와 목적이 다소 불분명합니다.
  naturalness: ‘이들은 … 영들로서’ 뒤에 ‘… 모으는 것이었습니다’가 이어지는 문장은 현대 한국어로 부자연스럽고 의미 관계가 흐립니다. 두 절로 나누어 현재의 동작과 목적을 분명히 하는 것이 자연스럽습니다.
  terminology: πνεύματα δαιμονίων은 원문의 복수 속격을 보존하여 ‘귀신들의 영들’로 옮겼습니다. σημεῖα는 해석을 덧붙이지 않고 ‘표적들’, παντοκράτωρ는 통용되는 신적 칭호인 ‘전능하신’으로 옮겼습니다. οἰκουμένη는 γῆ와 구별되는 전 세계적 인간 세계의 뜻을 고려해 ‘온 세상’으로 번역했습니다.
