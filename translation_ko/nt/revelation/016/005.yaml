- from: 그리고 나는 물들을 다스리는 천사가 이렇게 말하는 것을 들었습니다. 「지금도 계시고 전에도 계셨던 거룩하신 분이시여, 당신이 이렇게 심판하신 것이 의로우십니다.
  to: 또 나는 물들의 천사가 말하는 것을 들었습니다.[a] “지금도 계시고 전에도 계셨던 거룩하신 분이시여,[b] 주께서는 이 일들을 심판하셨으므로 의로우십니다.[c]”
  rationale: 본문은 SBLGNT의 ‘물들의 천사’, ‘지금도 계시고 전에도 계셨던’, ‘거룩하신 분’, ‘이 일들을 심판하셨으므로’를 빠짐없이 반영합니다. 더 긴 계시록식 신적 칭호는 본문에 조화시켜 넣지 않고 본문비평 각주로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:27Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘물들을 다스리는 천사’는 문맥상 가능한 해석이지만, τοῦ ἀγγέλου τῶν ὑδάτων의 소유격 표현을 해석적으로 확정합니다. 또한 ‘이렇게 심판하신 것’은 ταῦτα(‘이 일들을’)를 충분히 반영하지 못합니다. 수정문은 ‘물들의 천사’와 ‘이 일들을 심판하셨으므로’를 사용하여 그리스어의 표현과 인과관계를 보존합니다.
  naturalness: ‘당신’ 대신 존칭 호격 ‘거룩하신 분이시여’와 주어 ‘주께서는’을 사용해 현대 표준 한국어의 예배·선언 문맥에 자연스러운 합쇼체로 다듬었습니다. 인용부호를 닫아 문장 구조도 완결했습니다.
  terminology: ὅσιος는 이 문맥에서 정착된 칭호인 ‘거룩하신 분’으로 옮겼습니다. δίκαιος는 하나님의 심판의 도덕적·법정적 정당성을 함께 나타내는 ‘의로우십니다’로 유지했습니다. ‘물들의 천사’는 ‘물을 다스리는 천사’보다 원문의 표현을 더 직접적으로 보존합니다.
  issues:
