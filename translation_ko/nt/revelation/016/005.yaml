    issue: ‘물들을 다스리는 천사’가 원문의 소유격을 관리·통치라는 해석으로 구체화함
    rationale: τοῦ ἀγγέλου τῶν ὑδάτων은 직역하면 ‘물들의 천사’이며, ‘물을 다스리는/관할하는 천사’는 가능한 해석이지만 본문에서 확정할 필요는 없습니다.
