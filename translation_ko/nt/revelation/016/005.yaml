  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
  footnotes:
  - marker: a
    text: Some manuscripts read a fuller title such as 'the one who is and who was and who is to come,' likely harmonized to similar formulas elsewhere in Revelation. The printed text here reads 'the one who is and who was, the Holy One.'
    reason: textual_variant
  - marker: b
    text: Or 'Just are you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the angel over the waters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 나는 물들의 천사가 말하는 것을 들었습니다.[a] “지금도 계시고 전에도 계셨던 거룩하신 분이시여,[b] 주께서는 이 일들을 심판하셨으므로 의로우십니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물들을 다스리는 천사’.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본은 ‘지금도 계시고 전에도 계셨고 장차 오실 분이시여’와 같은 더 긴 칭호를 읽습니다. 이는 요한계시록의 다른 유사한 표현에 맞춘 독법일 가능성이 있습니다. 본문은 ‘지금도 계시고 전에도 계셨던 거룩하신 분’을 따릅니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘정의로우십니다’.
    reason: lexical_alternative
