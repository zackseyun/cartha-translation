- from: 여섯 번째 천사가 자기 대접을 큰 강 유프라테스 위에 쏟았습니다. 그러자 그 물이 말라, 해 돋는 곳에서 오는 왕들의 길이 예비되었습니다.
  to: 여섯째가 자기 대접을 큰 강 유프라테스에 쏟아부었습니다. 그러자 그 강의 물이 말랐습니다. 이는 해 돋는 곳에서 오는 왕들의 길이 마련되도록 하려는 것이었습니다.
