  verdict: revise
  source_fidelity: 개정이 필요합니다. 원문은 관사와 서수만으로 ‘여섯째’를 말하며, 이 절 자체에는 ‘천사’라는 명사가 없습니다. 또한 ἵνα ἑτοιμασθῇ는 왕들의 길이 마련되는 목적을 나타내므로, 단순 결과로 ‘예비되었습니다’라고 하기보다 목적 관계를 드러내야 합니다.
  naturalness: 초안은 전반적으로 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 ‘그 물’은 선행사인 강을 다시 밝혀 ‘그 강의 물’로 하는 편이 더 명료하며, 두 문장으로 나누어 목적 표현을 자연스럽게 처리할 수 있습니다.
  terminology: ‘대접’, ‘큰 강 유프라테스’, ‘해 돋는 곳’은 각각 φιάλη, Εὐφράτης, ἀνατολή ἡλίου의 이미지와 문체를 적절히 보존합니다. ‘해 돋는 곳’을 ‘동쪽’으로 평이화하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘여섯 번째 천사’가 원문에 없는 명사를 보충합니다.
    rationale: ὁ ἕκτος는 문맥상 여섯째 대접을 쏟는 존재를 가리키지만, 이 절에서는 ‘천사’가 명시되지 않습니다. 원문 우선 원칙에 따라 타원 표현을 보존하는 것이 안전합니다.
  - severity: medium
    issue: ‘길이 예비되었습니다’가 ἵνα 이하의 목적 표현을 결과 진술로 바꿉니다.
    rationale: ἵνα + 접속법 수동태는 물이 마른 일이 왕들의 길이 마련되도록 하는 목적과 연결됨을 나타냅니다. 한국어에서도 ‘마련되도록’으로 그 관계를 드러내야 합니다.
