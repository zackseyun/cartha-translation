review_pass:
  verdict: revise
  source_fidelity: 원문의 반복된 αὐτῶν(‘그들의’)과 원인적 ἐκ(‘~ 때문에’) 및 복수형 ἑλκῶν을 반영해야 합니다. ‘하늘의 하나님’, ‘모독하다’, ‘회개하다’는 원문의 호칭과 의미를 적절히 보존합니다.
  naturalness: 초안의 ‘자기들의 행위를 회개하다’는 현대 한국어에서 다소 부자연스럽습니다. ‘행위에서 돌이켜 회개하다’가 ἐκ τῶν ἔργων αὐτῶν의 이탈·전환의 뜻을 자연스럽게 드러냅니다.
  terminology: ‘종기’는 ἕλκος의 가능한 번역이지만 원문이 복수이므로 ‘종기들’로 옮겼습니다. 이는 의학적으로 지나치게 특정하지 않으면서 재앙 문맥의 ‘상처/종기’ 의미를 전달합니다.
  issues:
  - severity: low
    issue: ἑλκῶν의 복수형이 단수 ‘종기’로 표현되었습니다.
    rationale: 한국어에서 집합 단수도 가능하지만, 원문의 복수와 각자의 고통·종기라는 병렬을 더 충실히 반영하려면 ‘종기들’이 적절합니다.
  - severity: medium
    issue: ‘자기들의 행위를 회개하지 아니하였습니다’의 결합이 현대 한국어에서 어색하며 ἐκ의 ‘~에서 돌이키는’ 뉘앙스가 약합니다.
    rationale: ‘자기들의 행위에서 돌이켜 회개하지 않았습니다’는 회개의 대상이자 떠나야 할 이전 행위라는 원문의 관계를 자연스럽게 나타냅니다.
  revised_text: 그들은 자기들의 고통과 종기들 때문에 하늘의 하나님을 모독하였고, 자기들의 행위에서 돌이켜 회개하지 않았습니다.
