  to: 그들은 자기들의 고통과 종기들 때문에 하늘의 하나님을 모독하였고, 자기들의 행위에서 돌이켜 회개하지 않았습니다.
  rationale: 문장의 주어를 명시하고, 종기의 복수형을 반영했으며, 마지막 절을 현대 표준어 합쇼체로 자연스럽게 다듬었습니다. ‘돌이켜’는 μετανοέω와 ἐκ τῶν ἔργων의 결합이 지닌 이전 행위로부터의 전환을 해설 없이 한국어 문법 안에서 나타냅니다.
