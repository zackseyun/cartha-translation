  source_fidelity: 현 번역은 ‘일곱 번째 천사’를 보충하여 원문의 생략을 드러내지 않고, ‘성전 안 보좌로부터’가 ἐκ τοῦ ναοῦ와 ἀπὸ τοῦ θρόνου의 병렬 출처를 ‘성전 안에 있는 보좌’라는 관계로 바꿉니다. 또한 ‘다’는 Γέγονεν에 없는 총체성을 더합니다. 수정문은 원문의 생략, 병렬 출처, 완료·결과의 선언을 보존합니다.
  naturalness: ‘일곱째가’는 앞선 일곱 대접 문맥에서 자연스럽게 지시 대상을 이어 가며, ‘성소에서, 보좌로부터’는 다소 엄정한 묵시 문체 안에서도 자연스럽습니다. 음성이 발화하는 표현에는 비인격적 주어에도 무리 없는 ‘말했습니다’를 사용했습니다.
  terminology: φιάλη는 ‘대접’, ναός는 더 넓은 성전 구역과 구별되는 ‘성소’로 옮겼습니다. Γέγονεν은 완료된 성취 상태를 나타내도록 ‘이루어졌다’로 번역했으며, 전통적 대안 ‘다 이루어졌다’는 본문에 없는 ‘다’를 포함하므로 각주에만 제시합니다.
