review_pass:
  verdict: revise
  source_fidelity: 주문은 대체로 원문을 충실히 옮깁니다. 다만 ‘떼시자’는 ὅτε의 단순한 시간 관계보다 즉각적인 계기 관계를 다소 강하게 만들 수 있으므로 ‘떼실 때에’가 더 정확합니다. 각주의 ‘나오라’는 말 탄 자에게 내리는 명령으로 이해할 때의 ‘Go forth’를 충분히 나타내지 못합니다.
  naturalness: ‘네 생물’, ‘우레 같은 음성’, ‘말하는 것을 들었습니다’는 현대 표준어 합쇼체 문맥에서 자연스럽습니다. 직접 인용문의 ‘오라’는 원문의 단수 명령형과 계시록의 문체에 알맞습니다.
  terminology: ἀρνίον은 계시록의 정착된 그리스도론적 칭호인 ‘어린 양’으로 적절하며, ζῷα는 일반 동물이 아닌 천상 존재를 가리키는 ‘생물’로 적절합니다. σφραγίς의 ‘인’도 한국어 성경 용례에 맞습니다.
  issues:
  - severity: low
    issue: ‘떼시자’의 시간적 뉘앙스
    rationale: ὅτε는 ‘when’의 단순한 시간 접속사입니다. ‘-시자’는 곧바로 이어졌다는 인상을 줄 수 있으므로 ‘-실 때에’가 원문의 열린 시간 관계를 더 잘 보존합니다.
  - severity: medium
    issue: 대안 번역 각주의 ‘나오라’
    rationale: 말 탄 자를 향한 명령으로 이해하는 대안은 ‘Go forth’ 곧 출발·전진하라는 뜻입니다. ‘나오라’는 ‘come out’에 가까워 해석상의 대안을 정확히 전달하지 못합니다.
  revised_text: 또 내가 보니, 어린 양께서 일곱 인 중 하나를 떼실 때에 네 생물 중 하나가 우레 같은 음성으로 “오라[a]” 하고 말하는 것을 들었습니다.
