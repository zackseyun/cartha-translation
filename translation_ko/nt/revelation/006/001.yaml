  rationale: 시간 접속사 ὅτε를 ‘떼실 때에’로 옮겨 원문의 단순한 시간 관계를 유지하고, 대안 해석의 명령을 ‘나아가라’로 고쳐 말 탄 자에게 출발을 명하는 의미를 정확히 나타냈습니다. 나머지 핵심 용어와 직접 명령의 모호성은 유지했습니다.
