  source_fidelity: 초안의 「그들의 동료 노예들과 그들의 형제들, 곧 그들처럼 죽임을 당하게 될 자들」은 σύνδουλοι, ἀδελφοί, μέλλοντες ἀποκτέννεσθαι, ὡς καὶ αὐτοί를 대체로 충실히 반영합니다. 그러나 「그들의 수가 차기까지」는 πληρωθῶσιν에 원문에 없는 「수」를 명시적으로 보충하여, 사람들/집단의 완성이라는 수동적이고 다소 열린 표현을 수적 충족으로 한정합니다. 이를 본문에서 제거해야 합니다.
  naturalness: 「그들에게 말씀하시기를 … 하였습니다」는 발화 주체를 높이는 표현을 도입하면서 문장 연결도 다소 부자연스럽습니다. 원문의 수동 표현은 「… 하라는 말을 들었습니다」로 자연스럽게 옮길 수 있습니다. 「각자에게」보다 「각 사람에게」가 ἑκάστῳ의 분배적 의미를 더 분명히 드러냅니다.
  terminology: 「흰 두루마기」와 「동료 노예들」은 적절합니다. 「형제들」은 ἀδελφοί의 문법적 형태를 보존합니다. πληρωθῶσιν은 「완성되다」로 옮기고, ‘수’라는 해석적 보충은 각주에서만 설명합니다.
