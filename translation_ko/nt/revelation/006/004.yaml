id: REV.6.4
reference: Revelation 6:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
  footnotes:
  - marker: a
    text: Or 'red horse.' The Greek adjective πυρρός more specifically suggests a fire-like red, hence 'fiery red.'
    reason: lexical_alternative
  - marker: b
    text: Or 'land' instead of 'earth'; the Greek γῆ can mean either, but here the broader sense fits Revelation's global-apocalyptic context.
    reason: lexical_alternative
  - marker: c
    text: The verb translated 'slaughter' is stronger than a generic word for 'kill' and conveys violent bloodshed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 다른 말 한 마리, 곧 불같이 붉은 말이 나왔습니다[a]. 그 위에 앉은 이에게는 땅[b]에서 평화를 빼앗아 사람들이 서로 학살하게[c] 하는 일이 허락되었고, 그에게 큰 칼이 주어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘붉은 말’. 그리스어 πυρρός는 더 구체적으로 불빛 같은 붉은색을 가리키므로, 여기서는 ‘불같이 붉은’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅’ 대신 ‘지역’ 또는 ‘나라’. 그리스어 γῆ는 둘 다 뜻할 수 있으나, 여기서는 요한계시록의 넓은 묵시적 문맥에 따라 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘학살하게’로 옮긴 동사는 일반적인 ‘죽이다’보다 강하며, 폭력적인 살육을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος πυρρός
  english_pob_choice: fiery red horse
  chosen_korean: 불타는 듯한 붉은 말
  alternatives_korean:
  - 적마
  lexicon: BDAG
  rationale: πυρρός는 불빛 같은 붉음을 가리키며 단순한 적색보다 강한 이미지이다.
- source_word: σφάξουσιν
  english_pob_choice: slaughter
  chosen_korean: 죽이게 하는
  alternatives_korean:
  - 서로 학살하게
  lexicon: BDAG
  rationale: σφάζω는 「학살하다」의 강한 어휘이나, 일반 살해 동사로 자연스러운 한국어 흐름을 위해 「죽이다」로 옮긴다.
