  source_fidelity: 원문의 시간절(‘다섯째 인을 여셨을 때’), 공간 표현(‘제단 아래’), 환상에서 본 대상(‘영혼들’), 죽임의 원인인 하나님의 말씀과 증언을 충실히 반영했습니다. ἐσφαγμένων의 강한 폭력성과 제단 문맥의 희생적 울림을 위해 ‘도살당한’을 사용하되, 각주에서 더 일반적인 대안을 제시했습니다.
  naturalness: 기존의 ‘내가 보니, … 영혼들이 있었습니다’도 이해되지만, ‘나는 … 영혼들을 보았습니다’가 εἶδον의 직접 목적어 구조를 더 자연스럽고 분명하게 재현합니다. ‘그들이 지닌 증언’은 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
  terminology: ‘인’, ‘제단’, ‘하나님의 말씀’, ‘영혼’, ‘증언’은 요한계시록의 관습적이고 적절한 용어입니다. μαρτυρία의 가능한 의미인 ‘증인/증거’가 아니라 명사적 내용인 ‘증언’을 본문에 두고, ‘증거’를 각주 대안으로 남겼습니다.
