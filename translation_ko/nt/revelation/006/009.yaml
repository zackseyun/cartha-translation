    rationale: ‘죽임을 당한’은 가능하지만 σφάζω가 지닌 도살·희생의 강한 어감을 충분히 드러내지 못합니다. 제단 이미지와 함께 ‘도살당한’이 더 가깝습니다.
  - severity: medium
    issue: 현 각주의 대안과 설명이 서로 맞지 않음
