  revision_rationale: '본문의 ‘도살당한’은 σφάζω의 강도와 제단 문맥의 희생적 울림을 보존합니다. 문장을 ‘영혼들을 보았습니다’로 고쳐 원문의 εἶδον과 목적어를 직접적으로 반영했습니다. 다만 개정 본문에는 ‘증언’ 각주 앵커가 실제로 표시되어야 하므로, 완전한 조판 텍스트에서는 ‘증언[b]’으로 표기해야 합니다. 수정된 완전 문장은 다음과 같습니다: 그분께서 다섯째 인을 떼셨을 때에, 나는 제단 아래에 하나님의 말씀과 그들이 지닌 증언[b] 때문에 도살당한[a] 이들의 영혼들을 보았습니다.'
