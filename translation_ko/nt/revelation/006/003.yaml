  naturalness: ‘그분께서 둘째 인을 여셨을 때, 저는 둘째 생물이 “오라” 하고 말하는 것을 들었습니다’는 현대 표준 한국어의 격식 있는 성경 서술 문체로 자연스럽습니다. 인용된 명령형 ‘오라’는 직접 발화이므로 합쇼체 서술과 충돌하지 않습니다.
  terminology: ‘인’은 σφραγίς의 정착된 성경 용어이며, ‘생물’은 요한계시록 4–6장의 ζῷον을 동물로 오해하지 않게 하는 적절한 용어입니다. Ἔρχου의 문맥상 대안인 ‘가라’와 수신자 문제는 각주로 보존합니다.
