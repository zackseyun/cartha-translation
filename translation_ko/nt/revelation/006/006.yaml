  naturalness: ‘음성과 같은 것을 들었는데, 말하기를’은 현대 한국어 문장으로 다소 직역투이고, 종결의 ‘하였습니다’도 인용된 명령과의 연결이 매끄럽지 않습니다. ‘…음성이 이렇게 말하는 것을 들었습니다’가 표준어 합쇼체에서 자연스럽습니다.
