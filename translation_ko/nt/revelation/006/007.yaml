  source_fidelity: 핵심 어휘인 ‘넷째 인’, ‘넷째 생물’, 명령형 ‘오라’는 대체로 충실합니다. 다만 원문의 구조는 ‘넷째 생물의 음성을 들었다’이며, 현 번역의 ‘음성이 … 말하는 것을’은 한국어 문장 구조상 부자연스럽습니다. 또한 ‘오라’의 수신자가 명시되지 않은 원문의 모호성을 주석으로 보존하는 것이 적절합니다.
  naturalness: ‘넷째 생물이 “오라” 하고 말하는 음성’은 현대 표준어 합쇼체 서술로 자연스럽고, 계시록의 반복적 환상 서술에도 잘 맞습니다.
