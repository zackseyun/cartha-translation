review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the loud cry, the divine address, the delayed judgment, and the plea for retribution. However, 「심판을 미루시며」 interprets the Greek negated present verbs as postponement rather than directly retaining the appeal, “do you not/will you not judge and avenge?” A direct Korean negated-question form better preserves the source expression.
  naturalness: 「큰 음성으로」 is a literal but unnatural Korean collocation; 「큰 소리로」 is standard modern usage. The quotation’s 「하시나이까」 is archaic elevated speech rather than the requested modern formal-polite 합쇼체. The revision uses natural, modern formal-polite forms.
  terminology: 「주재」 is an established Korean rendering for δεσπότης and appropriately distinguishes it from 「주」 for κύριος. The existing footnote alternative 「주권자 주」 is unnatural and misleading because the Greek has one title, not a two-part title. It should simply offer 「주권자」.
  issues:
  - severity: medium
    issue: 「심판을 미루시며」 is more interpretive than the Greek wording.
    rationale: οὐ κρίνεις καὶ ἐκδικεῖς, framed by ἕως πότε, directly asks how long the addressee will not judge and avenge. A direct negated question preserves this wording without unnecessarily specifying “delay.”
  - severity: medium
    issue: The quoted question uses archaic non-합쇼체 「하시나이까」.
    rationale: The target register is modern formal-polite 합쇼체. 「않으시겠습니까」 is modern, reverent, and formally polite.
  - severity: low
    issue: 「큰 음성으로」 is unnatural in modern Korean, and the footnote alternative is structurally awkward.
    rationale: 「큰 소리로」 is idiomatic Korean. 「주권자 주」 adds an unrepresented second title; 「주권자」 is the suitable lexical alternative.
  revised_text: 그들은 큰 소리로 외쳐 말하였습니다. “거룩하시고 참되신 주재[a]여, 언제까지 심판하지 않으시고 땅에 거하는 자들에게 우리 피의 원수를 갚지 않으시겠습니까?”
