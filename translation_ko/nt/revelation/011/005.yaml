  to: 또 누구든지 그들을 해치려 하면, 그들의 입에서 불이 나와 그들의 원수들을 삼킵니다. 누구든지 그들을 해치려 한다면, 그 사람은 이와 같이 반드시 죽임을 당해야 합니다.
