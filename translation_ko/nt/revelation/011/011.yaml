  source_fidelity: 수정이 필요합니다. 원문의 첫 접속사 Καὶ는 단순 연결(‘그리고/그런데’)인데, 초안의 ‘그러나’는 대조를 추가합니다. 또한 πνεῦμα ζωῆς의 의미 범위를 본문과 각주에서 더 정확하고 자연스럽게 보존할 필요가 있습니다.
  naturalness: ‘사흘 반 후에’, ‘그들 안에 들어가’, ‘자기들의 발로 일어섰습니다’, ‘그들을 지켜보던 사람들에게 큰 두려움이 덮쳤습니다’는 현대 표준어 합쇼체로 자연스럽고 원문의 장면 전개를 잘 드러냅니다.
  terminology: πνεῦμα ζωῆς는 본문에서 ‘생명의 숨결’로 옮겨 생명을 불어넣는 이미지와 비특정성을 유지하고, 각주에서 ‘생명의 영’ 및 ‘생명의 성령’ 가능성을 제시합니다. 성령으로 단정하지 않습니다.
  issues:
  - severity: medium
    issue: Καὶ를 ‘그러나’로 번역함
    rationale: 원문에는 역접을 표시하는 접속사가 없습니다. ‘그러나’는 앞 문맥과의 대조를 명시하여 원문 이상의 의미를 더합니다.
  - severity: low
    issue: πνεῦμα의 각주 설명과 대안 표현이 부정확하고 다소 어색함
    rationale: ‘거룩하신 영’은 여기서 가능한 해석을 명료하게 제시하지 못하며, ‘하나님의 생명의 영’은 ἐκ τοῦ θεοῦ를 소유격처럼 바꿉니다. 신적 기원을 유지한 ‘하나님께로부터 온 생명의 영/성령’이 더 충실합니다.
  revised_text: 사흘 반 후에 하나님께로부터 온 생명의 숨결이 그들 안에 들어가자, 그들이 자기들의 발로 일어섰습니다. 그러자 그들을 지켜보던 사람들에게 큰 두려움이 덮쳤습니다.
  revised_footnotes:
  - marker: a
    text: 또는 「하나님께로부터 온 생명의 영」; 아마도 「하나님께로부터 온 생명의 성령」. 헬라어 πνεῦμα는 숨, 영 또는 성령을 뜻할 수 있다.
    reason: alternative_reading
