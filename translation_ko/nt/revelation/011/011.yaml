translation:
  language: ko
  text: 그러나 사흘 반 후에 하나님께로부터 생명의 영[a]이 그들 안에 들어가 그들이 자기 발로 일어섰고, 그들을 지켜보던 자들 위에 큰 두려움이 임하였습니다.
  philosophy: optimal-equivalence
  footnotes:
