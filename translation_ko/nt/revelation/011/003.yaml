  source_fidelity: 「권세를」은 그리스어 δώσω의 생략된 목적어를 해석적으로 보충한 것으로, 본문에는 명시되어 있지 않습니다. 이를 삭제하고 ‘주겠으니’로 옮겨 원문의 의도적인 생략을 보존했습니다. 또한 원문에 없는 닫는 인용부호와 「하셨습니다」를 삭제했습니다.
