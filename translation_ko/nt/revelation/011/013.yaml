translation:
  language: ko
  text: 그 시각에 큰 지진이 났고, 그 성의 십분의 일이 무너졌으며, 지진으로 칠천 명의 사람[a]이 죽임을 당하였습니다. 남은 사람들은 두려워하여 하늘의 하나님께 영광을 돌렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘사람들의 이름 칠천’입니다. 이는 죽은 사람의 수가 칠천 명이라는 뜻의 표현입니다.
    reason: lexical_alternative
