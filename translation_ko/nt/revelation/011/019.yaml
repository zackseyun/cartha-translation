id: REV.11.19
reference: Revelation 11:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
  footnotes:
  - marker: a
    text: Or 'sanctuary' for 'temple' (Greek ναός), emphasizing the inner holy dwelling rather than the broader temple complex.
    reason: lexical_alternative
  - marker: b
    text: Or 'the ark of the covenant'; the Greek explicitly says 'his covenant.'
    reason: lexical_alternative
  - marker: c
    text: Or 'sounds' or 'rumblings' for 'voices'; Revelation often uses this theophanic expression in scenes of divine majesty and judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 하늘에 있는 하나님의 성전이 열렸고[a], 그분의 성전 안에 그분의 언약궤가 보였으며[b], 번개와 음성들과 천둥소리들과 지진과 큰 우박이 있었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성전’(그리스어 나오스)은 성전 전체 परिसर보다 안쪽의 거룩한 처소를 강조하는 ‘성소’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘언약궤’. 그리스어 본문은 ‘그분의 언약궤’라고 하여 하나님의 언약임을 명시합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘음성들’은 ‘소리들’ 또는 ‘울림들’로도 옮길 수 있습니다. 요한계시록에서는 하나님의 위엄과 심판의 장면에서 반복되는 표현입니다.
    reason: lexical_alternative
