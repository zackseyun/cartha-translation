review_pass:
  verdict: revise
  source_fidelity: 원문의 복수형 αὐτῶν(‘그들의’)은 각 장로의 보좌들을 가리키는데, 초안의 ‘자기 보좌’는 단수로 되어 이를 충분히 반영하지 못합니다. 또한 ἔπεσαν(‘엎드렸다/쓰러졌다’)의 동작은 ‘얼굴을 대고 엎드려’에도 대체로 담기지만, 한국어 관용 표현으로 더 분명하게 옮길 수 있습니다.
  naturalness: ‘스물네 명의 장로들’, ‘각자의 보좌에 앉아 있던’, ‘얼굴을 땅에 대고 엎드려’는 현대 표준 한국어 합쇼체에서 자연스럽고 장면의 흐름을 잘 드러냅니다.
  terminology: πρεσβύτεροι는 계시록의 천상 존재들을 가리키는 관례적 표현인 ‘장로들’로 유지했습니다. προσκυνέω는 하나님이 명시적 대상으로 제시된 문맥에 맞게 ‘경배하였습니다’로 옮겼습니다. ‘보좌’ 역시 계시록의 왕좌·천상 통치 이미지에 적절합니다.
  issues:
  - severity: medium
    issue: ‘자기 보좌’가 원문의 복수형 ‘그들의 보좌들’을 단수로 처리함
    rationale: 각 장로가 자기 보좌에 앉아 있는 모습을 뜻하므로 ‘각자의 보좌’가 원문의 수와 분배적 의미를 자연스럽게 반영합니다.
  - severity: low
    issue: ‘얼굴을 대고 엎드려’의 대상이 한국어에서 다소 생략됨
    rationale: 원문의 ‘자기들의 얼굴 위로 엎드렸다’는 얼굴을 아래로 향해 엎드리는 경배 자세입니다. ‘얼굴을 땅에 대고 엎드려’는 자연스러운 한국어 관용구로 이 자세를 명료하게 전달합니다.
  revised_text: 그리고 스물네 명의 장로들은 하나님 앞에서 각자의 보좌에 앉아 있다가, 얼굴을 땅에 대고 엎드려 하나님께 경배하였습니다.
