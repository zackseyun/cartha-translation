    rationale: 원문은 ‘그들의 시체’(단수) 다음에 ‘그들의 시체들’(복수)을 사용합니다. 한국어의 ‘시체’는 복수 표지가 없으면 수가 불분명할 수 있으므로, 뒤 절에 ‘-들’을 쓰고 첫 언급에 각주를 달아 원문의 변화를 밝혀야 합니다.
  - severity: low
