  source_fidelity: 초안은 ἐκ의 부분적 의미, 네 집단의 열거, 사흘 반의 기간, 매장을 허락하지 않는다는 핵심을 대체로 반영합니다. 그러나 첫째 πτῶμα(단수)와 둘째 πτώματα(복수)의 의도적인 수 변화가 한국어에서 충분히 드러나지 않으며, 이에 대한 주석도 필요합니다.
  naturalness: “백성들과 족속들과 언어들과 나라들 중에서 사람들이”도 이해되지만, “가운데서 나온 사람들이”가 ἐκ의 ‘~에서 나온 일부’라는 부분성을 더 자연스럽고 분명하게 나타냅니다. “시체들을 무덤에 두지 못하게 합니다”는 다소 어색하게 들릴 수 있어, ‘무덤에 놓도록 허락하지 않습니다’가 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: λαοί, φυλαί, γλῶσσαι, ἔθνη는 각각 ‘백성들, 족속들, 언어들, 나라들’로 옮겨 구별을 유지합니다. πτῶμα는 ‘시체’, μνῆμα는 ‘무덤’으로 적절합니다. 첫 단수와 뒤 복수는 번역문과 각주에서 보존합니다.
  issues:
