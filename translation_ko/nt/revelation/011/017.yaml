  source_fidelity: 원문의 복수 현재분사 λέγοντες는 앞 절의 장로들이 한 말을 잇습니다. 현 번역의 단수·문어체 「이르되」는 현대 표준어 합쇼체에 맞지 않습니다. 또한 εἴληφας와 ἐβασίλευσας의 완료/아오리스트 연쇄는 「큰 권능을 취하시고 다스리기 시작하셨기 때문입니다」로 자연스럽게 보존할 수 있습니다. 「장차 오실」이 본문에 없다는 점도 유지했습니다.
  naturalness: 「이제도 계시고 전에도 계신 분」과 「권능을 잡으시고」는 다소 부자연스럽거나 의미가 좁아질 수 있습니다. 「현재도 계시고 전에도 계셨던 분」 및 「큰 권능을 취하시고」가 현대의 격식 있는 예배 언어로 더 자연스럽습니다.
  terminology: κύριε ὁ θεός ὁ παντοκράτωρ는 「전능하신 주 하나님」으로, δύναμις는 「권능」으로 옮겼습니다. βασιλεύω의 진입/통치 개시 가능성은 본문에서 「다스리기 시작하셨습니다」로 표현하고 각주에서 대안을 밝혔습니다.
