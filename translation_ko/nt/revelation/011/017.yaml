    rationale: 현 각주는 어구 생략을 종말론적 현실의 직접적 설명으로 단정합니다. 본문상 확실한 것은 해당 어구의 부재이므로 이를 중심으로 밝혀야 합니다. 또한 「다스리기 시작하셨습니다」는 가능한 해석이므로 어휘 대안을 각주로 제시하는 것이 적절합니다.
