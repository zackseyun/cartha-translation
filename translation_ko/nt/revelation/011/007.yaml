    issue: ‘그들과 더불어 전쟁을 일으켜’의 관계 표현
    rationale: μετά+속격의 ‘전쟁을 만들다/벌이다’ 관용구는 이 문맥에서 짐승이 두 증인을 공격한다는 뜻입니다. ‘더불어’는 공조 또는 공동 참여로 오해될 여지가 있습니다.
  - severity: low
