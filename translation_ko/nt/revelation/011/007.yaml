  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 μετ’ αὐτῶν πόλεμον ποιήσει는 문맥상 그들을 향해 전쟁을 벌인다는 적대적 관용 표현이므로, ‘그들과 더불어 전쟁을 일으켜’는 현대 한국어에서 함께 전쟁한다는 뜻으로도 읽힐 수 있습니다. ‘그들을 상대로 전쟁을 벌여’가 문맥과 의미를 정확히 드러냅니다.
  naturalness: ‘전쟁을 일으켜’보다 ‘전쟁을 벌여’가 현대 표준어에서 자연스럽고, 뒤의 ‘이기고 ... 죽일 것입니다’와도 잘 연결됩니다. 불필요한 ‘자기들의’는 ‘그들의’로 다듬었습니다.
  terminology: ‘무저갱’, ‘짐승’, ‘증언’은 계시록의 용례와 원문의 어휘를 적절히 반영합니다. 다만 현 각주는 ‘lexical_alternative’로 분류되어 있으나 번역 대안이 아니라 해설이므로, 본 절에서는 원문의 적대 관계에 관한 번역 대안 각주로 교체하는 것이 적절합니다.
  issues:
