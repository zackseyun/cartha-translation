    rationale: 번역문이 닫는 인용부호(」) 없이 끝나 문장 구조가 완결되지 않습니다.
  - severity: low
    issue: 현재형을 과거형으로 번역
    rationale: ᾄδουσιν은 현재 직설법이며, 환상 서술의 생생한 현재를 한국어에서도 ‘노래합니다’로 유지할 수 있습니다. λέγοντες도 이에 맞춰 ‘말합니다’로 옮기는 것이 적절합니다.
  - severity: medium
    issue: ‘당신의 길은 의롭고 참되십니다’의 존대 종결
