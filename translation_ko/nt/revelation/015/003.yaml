revisions:
- from: 그들은 하나님의 종 모세의 노래와 어린 양의 노래를 부르며 말하였습니다. 「주 하나님, 전능하신 분이시여, 당신의 행하신 일들이 크고 놀랍습니다. 만세의 왕이시여[a], 당신의 길은 의롭고 참되십니다.
  to: 그들은 하나님의 종 모세의 노래와 어린 양의 노래를 부르며 이렇게 말합니다. 「주 하나님, 전능하신 분이시여, 주께서 하신 일은 크고 놀랍습니다. 만세의 왕이시여[a], 주님의 길은 의롭고 참됩니다.」
  rationale: 닫는 인용부호를 보완하고, 원문의 현재 시제와 노래의 직접 발화를 유지했습니다. 하나님께 드리는 호칭은 합쇼체의 격식 있는 문체로 다듬었으며, ‘길’에 적용된 부자연스러운 존대 종결을 일반 서술 종결로 고쳤습니다. 본문은 SBLGNT의 τῶν αἰώνων을 번역하고, 중요한 이독 τῶν ἐθνῶν은 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:26Z'
review_pass:
  verdict: revise
  source_fidelity: 주요 어휘와 본문 이독(τῶν αἰώνων / τῶν ἐθνῶν)은 대체로 충실히 반영했습니다. 그러나 현재 본문은 인용부호가 닫히지 않았고, 직설법 현재 ᾄδουσιν 및 분사 λέγοντες의 표현을 과거형으로 옮겼습니다. 또한 ‘길’에 존대 종결을 사용한 것은 한국어 문법상 자연스럽지 않습니다.
  naturalness: ‘당신의’보다 하나님께 드리는 직접 호칭에서는 ‘주님의’이 현대 표준어의 격식 있는 예배·찬양 문맥에 더 자연스럽습니다. ‘주께서 하신 일’은 ‘당신의 행하신 일들’보다 간결하고 자연스럽습니다.
  terminology: ‘하나님의 종 모세’, ‘어린 양’, ‘전능하신 분’, ‘만세의 왕’은 원문의 호칭과 계시록의 엄숙한 문체를 적절히 살립니다. ‘만세의 왕’은 αἰώνων을 따르며, 민족들 이독은 각주로 보존해야 합니다.
