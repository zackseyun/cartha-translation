  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
  footnotes:
  - marker: a
    text: Or "your righteous judgments"; the Greek term can also refer to judicial verdicts or ordinances, but here likely points to God's just deeds now made visible.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 누가 주님을 두려워하고 주님의 이름을 영화롭게 하지 않겠습니까? 오직 주님만 거룩하시기 때문입니다. 모든 민족이 와서 주님 앞에 경배할 것입니다. 주님의 의로운 행위들[a]이 드러났기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님의 의로운 심판들”. 그리스어는 사법적 판결이나 규례를 가리킬 수도 있으나, 여기서는 드러난 하나님의 의로운 행위들을 가리키는 듯합니다.
