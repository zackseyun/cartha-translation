  source_fidelity: 그리스어의 핵심 의미는 대체로 반영되어 있습니다. 다만 ναός는 이 문맥에서 더 구체적인 신적 거처를 가리키므로 ‘성소’가 적절하며, καί를 ‘그러자’로 옮기면 원문에 없는 강한 결과·전환의 뉘앙스가 더해집니다. τελεσθῶσιν의 수동적 완료를 ‘다 이루어지기까지’로 반영하는 것이 더 충실합니다.
  naturalness: 수정문은 현대 표준 한국어의 엄숙한 합쇼체로 자연스럽습니다. ‘하나님의 영광과 그분의 능력에서 나온 연기’는 두 출처를 모두 자연스럽게 수식합니다.
  terminology: ναός는 ‘성소’로 일관되게 옮겼습니다. πληγαί는 계시록의 심판 문맥에 맞게 ‘재앙’으로, δόξα·δύναμις는 ‘영광’·‘능력’으로 유지했습니다.
  issues:
  - severity: medium
    issue: ναός를 두 차례 모두 ‘성전’으로 번역함
    rationale: 영어 POB의 어휘 결정 및 계시록의 문맥상 ναός는 넓은 성전 구역보다 하나님의 거처인 성소를 가리키는 것이 적절합니다.
  - severity: low
    issue: καί를 ‘그러자’로 번역함
    rationale: ‘그러자’는 앞 절의 사건에 따른 결과나 뚜렷한 전환을 시사합니다. 원문의 단순 접속은 ‘또’가 더 절제되어 있습니다.
  - severity: low
    issue: τελεσθῶσιν을 ‘마무리되기까지’로 번역함
    rationale: 의미는 가능하지만, 수동태와 종결의 뜻은 ‘다 이루어지기까지’가 더 직접적으로 드러냅니다.
