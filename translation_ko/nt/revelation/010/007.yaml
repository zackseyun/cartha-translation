  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own slaves, the prophets.
  footnotes:
  - marker: a
    text: Or 'his own servants.' The Greek word can mean 'servants' or 'slaves'; here it emphasizes belonging to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 일곱째 천사의 음성이 들리는 날들에, 곧 그가 나팔을 불려고 할 때에, 하나님께서 자신의 노예들인 예언자들에게 좋은 소식을 전하신 대로 하나님의 비밀이 완성될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑαυτοῦ δούλους τοὺς προφήτας
  english_pob_choice: his own slaves, the prophets
  chosen_korean: 자기 노예들인 예언자들
  alternatives_korean:
  - 자기 종들인 예언자들
  lexicon: BDAG
  rationale: 1:1과 일관되게 δοῦλος를 「노예」로 옮긴다. 하나님께 매여 보내심을 받은 예언자들의 정체를 살린다.
