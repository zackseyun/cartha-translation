revisions:
- from: 그러나 일곱째 천사가 그의 음성을 내는 날들에, 곧 그가 나팔을 불려고 할 때에, 하나님의 비밀이 완성될 것입니다. 이는 그분께서 자기 노예들인 예언자들에게 복음으로 전하신 것과 같습니다.
  to: 그러나 일곱째 천사의 음성이 들리는 날들에, 곧 그가 나팔을 불려고 할 때에, 하나님께서 자신의 노예들인 예언자들에게 좋은 소식을 전하신 대로 하나님의 비밀이 완성될 것입니다.
  rationale: 비교절을 ‘하나님께서 … 전하신 대로’로 재배치하여 ὡς εὐηγγέλισεν이 하나님의 비밀의 완성을 수식하도록 했습니다. φωνή의 ‘음성/소리’ 의미와 εὐαγγελίζω의 ‘좋은 소식을 전하다’ 의미를 자연스러운 현대 합쇼체로 옮겼으며, 미래 지향성과 δοῦλος의 ‘노예’ 선택은 유지했습니다.
