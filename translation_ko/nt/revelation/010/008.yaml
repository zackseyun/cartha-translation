  source_fidelity: 원문의 πάλιν, 두 개의 분사(λαλοῦσαν, λέγουσαν), 명령형 Ὕπαγε와 λάβε, 그리고 ‘천사의 손에 있는’ 두루마리라는 수식 관계를 충실히 반영하도록 다듬었습니다. ‘받으라’는 λάβε(‘취하다, վերց다’)보다 다소 수동적으로 들릴 수 있어 ‘가지십시오’로 고쳤습니다.
  naturalness: 초안의 ‘음성이 다시 나와 함께 말하며 이르기를 … 하였습니다’는 주어가 ‘음성’인 문장에서 다소 부자연스럽고, 직접 인용 뒤의 ‘하였습니다’도 연결이 매끄럽지 않습니다. 현대 한국어 합쇼체의 자연스러운 서술과 인용으로 정리했습니다.
  terminology: βιβλίον은 ‘두루마리’, ἄγγελος는 계시록의 환상 문맥에 맞게 ‘천사’, ἠνεῳγμένον은 결과 상태를 드러내는 ‘펴져 있는’으로 옮겼습니다. γῆ는 바다와 대조되는 장면상 ‘땅’으로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘나와 함께 말하며 이르기를 … 하였습니다’의 문장 연결과 화행 표현
    rationale: μετ’ ἐμοῦ는 직역하면 ‘나와 함께’이나, 하늘의 음성이 요한에게 명령을 전달하는 한국어 문맥에서는 ‘나에게 다시 말씀하셨습니다’가 자연스럽습니다. 직접 인용을 도입하는 방식으로 λαλοῦσαν과 λέγουσαν의 연속도 자연스럽게 반영할 수 있습니다.
  - severity: low
    issue: λάβ ε의 번역 ‘받으라’
    rationale: λαβέ는 여기서 천사의 손에 있는 두루마리를 직접 취하라는 명령입니다. ‘가지십시오’가 수령 행위보다 취하는 동작을 더 잘 나타냅니다.
  revised_text: 그리고 내가 하늘에서 들었던 그 음성이 다시 나에게 말씀하셨습니다. “가서 바다 위와 땅 위에 서 있는 천사의 손에 있는 펴져 있는 두루마리를 가지십시오.”
