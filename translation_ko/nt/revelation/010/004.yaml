- from: 그 일곱 우레가 말했을 때 내가 기록하려고 하였습니다. 그러나 내가 하늘에서 나는 한 음성을 들었는데, 「일곱 우레가 말한 것을 봉인하고, 그것을 기록하지 말라」 하였습니다.
  to: 일곱 우레가 말하였을 때, 나는 기록하려던 참이었습니다. 그리고 하늘에서 한 음성이 말하는 것을 들었습니다. “일곱 우레가 말한 것들을 봉인하고, 그것들을 기록하지 마십시오.”
  rationale: 임박성을 나타내는 ἤμελλον을 ‘기록하려던 참이었습니다’로 바로잡고, 하늘에서 들린 음성이라는 표현을 자연스러운 현대 한국어로 다듬었습니다. 관계대명사 ἃ와 대명사 αὐτά의 복수성을 ‘말한 것들/그것들’로 보존했으며, 음성의 정체에 관한 해석은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
