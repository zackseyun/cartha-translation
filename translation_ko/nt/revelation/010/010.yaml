  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
  footnotes:
  - marker: a
    text: Or "little book." The Greek term is a diminutive and may denote a small written document; "little scroll" best fits the likely ancient form.
    reason: lexical_alternative
  - marker: b
    text: Or "my belly became bitter."
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 그 천사의 손에서 작은 두루마리[a]를 받아 먹었습니다. 그것은 내 입에서는 꿀처럼 달았으나, 그것을 먹은 뒤에는 내 배가 쓰게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “작은 책.” 그리스어는 작은 문서를 가리키는 지소형이며, 당시의 문서 형태를 고려하면 “작은 두루마리”가 적절합니다.
    reason: lexical_alternative
