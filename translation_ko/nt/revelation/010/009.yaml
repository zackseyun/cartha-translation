revisions:
- from: 그래서 내가 그 천사에게로 가서, 그 작은 두루마리를 나에게 달라고 말하였습니다. 그러자 그가 나에게 이르기를, 「받아 그것을 먹어 버려라. 그것이 네 배를 쓰게 하리라. 그러나 네 입에서는 꿀같이 달리라」 하였습니다.
  to: 그리고 내가 그 천사에게 가서 나에게 그 작은 두루마리를 달라고 말했습니다. 그러자 그가 내게 말했습니다. “받아 먹으십시오. 그것이 배를 쓰게 할 것입니다. 그러나 입에서는 꿀처럼 달 것입니다.”
