  text: 또 내가 보니, 또 다른 힘센 천사가 하늘에서 내려오는 것을 보았습니다. 그는 구름을 옷처럼 두르고 있었고, 그의 머리 위에는 무지개[a]가 있었으며, 그의 얼굴은 해 같고 그의 발은 불기둥 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
