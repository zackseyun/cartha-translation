id: REV.20.9
reference: Revelation 20:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
  footnotes:
  - marker: a
    text: Or 'over the breadth of the earth.' The Greek expression is literally 'upon the breadth of the earth,' referring to a vast expanse.
    reason: lexical_alternative
  - marker: b
    text: Or 'encircled.'
    reason: lexical_alternative
  - marker: c
    text: The text does not explicitly identify 'the beloved city'; interpreters commonly understand it as Jerusalem or, more broadly, the city of God.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들은 땅의 넓은 곳에 올라와 성도들의 진영과 사랑받는 도성[a]을 포위했습니다. 그리고 하늘에서 불이 내려와 그들을 삼켜 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 ‘사랑받는 도성’이 어느 도성인지 명시하지 않습니다. 이를 예루살렘 또는 더 넓게 하나님의 도성으로 이해하는 해석들이 있습니다.
    reason: alternative_reading
