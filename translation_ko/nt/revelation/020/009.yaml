review_pass:
  verdict: revise
  source_fidelity: 핵심 동작과 대상을 충실히 옮겼습니다. 다만 ‘땅의 너비 위로’는 ἐπὶ τὸ πλάτος τῆς γῆς의 공간적 이미지를 한국어에서 지나치게 직역하여 부자연스럽습니다. ‘땅의 넓은 곳에’는 πλάτος의 넓은 공간이라는 뜻을 보존합니다. ‘사랑받는 도성’은 ἠγαπημένην의 수동적 표현을 유지하며, 그 도성을 본문에서 특정하지 않습니다.
  naturalness: 합쇼체의 서술은 적절합니다. ‘땅의 넓은 곳에 올라와’와 ‘포위했습니다’가 현대 표준 한국어에서 더 자연스럽고, ‘그리고’는 καὶ의 단순 접속을 보존하여 ‘그러자’가 암시할 수 있는 인과성을 피합니다.
  terminology: ‘성도들’, ‘진영’, ‘도성’, ‘하늘’은 계시록 문맥과 한국어 성경 문체에 잘 맞습니다. ‘사랑받는 도성’의 정체를 예루살렘 등으로 본문에서 확정하지 않도록 주석을 붙였습니다.
  issues:
  - severity: medium
    issue: ‘땅의 너비 위로’가 한국어에서 비문에 가깝고 공간 관계가 불분명합니다.
    rationale: πλάτος는 ‘너비/넓은 공간’을 뜻하지만, 한국어에서 ‘너비 위로’라고 하면 측정치 위를 이동하는 듯한 인상이 납니다. ‘땅의 넓은 곳에’는 원문의 넓은 지표라는 이미지를 자연스럽게 전달합니다.
  - severity: low
    issue: ‘그러자’는 두 번째 절에 원문에 없는 인과적 뉘앙스를 줄 수 있습니다.
    rationale: καὶ는 여기서 단순한 접속입니다. ‘그리고’가 사건의 연속을 더 중립적으로 나타냅니다.
  - severity: low
    issue: ‘에워쌌습니다’도 가능하나 ‘포위했습니다’가 진영을 둘러싸는 군사적 장면을 더 명확히 드러냅니다.
    rationale: ἐκύκλευσαν과 παρεμβολή의 결합은 포위 장면을 나타냅니다. 이는 해석을 추가하지 않고 어휘의 자연스러운 결합을 살립니다.
