revisions:
- from: 그리고 나는 크고 흰 보좌와 그 위에 앉으신 분을 보았습니다. 그분의 면전에서 땅과 하늘이 도망쳤고, 그들에게 머물 곳이 없었습니다.
  to: 그리고 나는 크고 흰 보좌와 그 위에 앉으신 분을 보았습니다. 그분의 면전[a]에서 땅과 하늘이 달아났으며, 그들을 위한 곳은 발견되지 않았습니다.
  rationale: The revision preserves the Greek's deliberately unnamed enthroned figure, the vivid flight imagery, and the passive clause concerning the disappearance of a place for earth and heaven. It also supplies a concise lexical note for the literal sense of πρόσωπον ('face') behind the idiomatic Korean '면전.'
  reviewer_model: gpt-5.6-terra
