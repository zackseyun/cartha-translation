review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the great white throne, the unnamed one seated on it, and the earth and heaven fleeing from his presence. However, '그들에게 머물 곳이 없었습니다' recasts the source's impersonal passive ('no place was found for them') as a statement about a place in which they could remain. A closer passive rendering is preferable.
  naturalness: The Korean is generally natural and suitably solemn in modern formal-polite style. '달아났으며' is a somewhat more elevated narrative equivalent for the apocalyptic image than '도망쳤고,' and '발견되지 않았습니다' maintains the source's passive form.
  terminology: '''보좌,'' ''면전,'' ''땅과 하늘,'' and the non-identifying expression ''그 위에 앉으신 분'' are appropriate. The honorific participial expression is idiomatic in this throne setting and does not explicitly identify the enthroned figure.'
  issues:
  - severity: medium
    issue: '''그들에게 머물 곳이 없었습니다'' does not preserve the passive wording of τόπος οὐχ εὑρέθη αὐτοῖς.'
    rationale: The Greek says that no place was found for the earth and heaven, rather than directly that they had nowhere to stay. Revising to '그들을 위한 곳은 발견되지 않았습니다' retains the impersonal passive and the referential ambiguity.
  - severity: low
    issue: The lexical alternative represented by the English footnote is not anchored in the Korean draft.
    rationale: '''면전'' is a sound idiomatic rendering of πρόσωπον in context, but a note can document the literal sense, ''face,'' without changing the translation.'
  revised_text: 그리고 나는 크고 흰 보좌와 그 위에 앉으신 분을 보았습니다. 그분의 면전[a]에서 땅과 하늘이 달아났으며, 그들을 위한 곳은 발견되지 않았습니다.
