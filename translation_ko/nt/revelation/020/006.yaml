  to: 첫째 부활에 참여하는 사람은 복되고 거룩합니다. 이들에게는 둘째 사망이 권세를 갖지 못하며, 그들은 하나님과 메시아의 제사장이 되어 그분과 함께 천 년 동안 왕으로 다스릴 것입니다.
  rationale: 'The revision retains the draft''s faithful terminology and formal-polite register, while making the royal sense of βασιλεύσουσιν explicit. No footnote is needed: the Korean rendering ''메시아'' appropriately reflects Χριστός as a title, and the verse itself does not require an explanatory note.'
