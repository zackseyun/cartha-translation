  source_fidelity: ‘살아나지 못하였습니다’는 οὐκ ἔζησαν을 ‘살아날 수 없었다’라는 능력·불가능의 뜻으로 바꾸므로 적절하지 않습니다. 단순 부정 과거로 옮겨야 합니다. ‘살아나지 않았습니다’는 문맥의 부활 언어를 자연스럽게 드러내면서도 해석을 덧붙이지 않습니다.
  naturalness: ‘천 년이 끝나기까지’와 ‘첫째 부활’은 현대 표준 한국어의 합쇼체 문맥에서 자연스럽고 명료합니다.
  terminology: ἀνάστασις는 일관되게 ‘부활’로, πρώτη는 ‘첫째’로 번역했습니다. ‘나머지 죽은 자들’은 앞 절의 집단과 대조되는 οἱ λοιποὶ τῶν νεκρῶν을 충실히 반영합니다.
  issues:
