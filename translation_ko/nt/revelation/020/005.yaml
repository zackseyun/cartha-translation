    issue: ‘살아나지 못하였습니다’
    rationale: ‘-지 못하다’는 능력이나 가능성의 결여를 함축할 수 있으나, 그리스어 οὐκ ἔζησαν은 단순히 ‘살지 않았다/살아나지 않았다’라고 진술합니다.
  revised_text: 나머지 죽은 자들은 천 년이 끝나기까지 살아나지 않았습니다. 이것이 첫째 부활입니다.
  revised_footnotes:
