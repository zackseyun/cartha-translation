    text: 또는 “천 년이 끝나기까지 살지 않았습니다.”
    reason: ζάω의 어휘적 대안을 제시하되, 본문의 부활 문맥에 맞춘 ‘살아나다’ 번역을 유지합니다.
  revision_rationale: 부정문의 양태적 함의를 제거하여 원문의 단순 진술을 보존했습니다. ‘이것이 첫째 부활입니다’는 지시 대상에 관한 종말론적 논쟁을 번역에 반영하지 않고 원문의 넓은 지시를 유지합니다.
