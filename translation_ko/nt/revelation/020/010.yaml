    text: 그리스어를 직역하면 ‘시대들의 시대들까지’입니다. 이 표현은 매우 긴 지속을 강조하는 관용구입니다.
    reason: lexical_alternative
  revision_rationale: The revision preserves the source's past passive for the devil's being thrown in and future passive for the collective punishment. It explicitly identifies the three members of the plural subject, preventing Korean pronoun ambiguity. The footnote is anchored to "영원토록" and gives the literal form of the Greek idiom without using the note to settle doctrinal questions beyond the verse.
