    issue: The antecedent of "그들은" is unclear in Korean.
    rationale: In Greek, the plural verb refers to the devil together with the beast and false prophet. In the Korean sequence, the nearest explicit antecedent is singular "마귀," so restating the collective subjects is a safe clarity correction.
  revised_text: 그리고 그들을 미혹하던 마귀는 불과 유황의 못, 곧 짐승과 거짓 예언자도 있는 곳에 던져졌습니다. 그곳에서 마귀와 짐승과 거짓 예언자는 밤낮으로 영원토록 고통을 받을 것입니다.
  revised_footnotes:
