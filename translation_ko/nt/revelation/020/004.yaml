  terminology: θρόνοι는 ‘보좌들’, ψυχαί는 ‘영혼들’, πεπελεκισμένων은 ‘참수당한’, θηρίον/εἰκών/χάραγμα은 각각 ‘짐승/형상/표’, Χριστός는 문맥상 칭호인 ‘메시아’로 일관되게 옮겼습니다.
