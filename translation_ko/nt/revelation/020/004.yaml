revisions:
- from: 그리고 나는 보좌들을 보았습니다. 그것들 위에 앉은 자들이 있었고, 그들에게 심판하는 권한이 주어졌습니다. 또 나는 예수의 증언과 하나님의 말씀 때문에 목 베임을 당한 자들의 영혼들과, 짐승이나 그 형상에게 경배하지 아니하고 자기 이마와 손에 그 표를 받지 아니한 자들을 보았습니다. 그들이 살아나서 메시아와 함께 천 년 동안 다스렸습니다.
  to: 또 나는 보좌들을 보았고, 그들이 그 위에 앉았으며, 심판이 그들에게 주어졌습니다. 또 나는 예수의 증언[a]과 하나님의 말씀 때문에 참수당한 사람들의 영혼들과, 짐승과 그 형상에게 경배하지 않고 자기들의 이마와 손에 그 표를 받지 않은 사람들을 보았습니다. 그들이 살아나서 메시아[b]와 함께 천 년 동안 다스렸습니다.
  rationale: 원문의 능동 서술과 불특정 복수 주어를 회복하고, ‘심판’의 의미 범위를 보존했습니다. 참수 표현을 현대 표준어로 자연스럽게 조정했으며, 본문이 유지하는 두 가지 모호성(‘예수의 증언’의 속격 및 κρίμα의 의미 범위)을 교리적으로 해소하지 않았습니다. 영어 감사 기록의 주석 b는 본문상 표지 위치가 어긋나 있으므로, 한국어에서는 실제 대안어가 있는 ‘메시아’ 뒤에 배치했습니다.
