review_pass:
  verdict: revise
  source_fidelity: 그리스어의 기본 구조와 핵심 어휘는 대체로 충실합니다. 다만 ‘큰 자와 작은 자가’는 복수의 ‘죽은 자들’과의 호응이 매끄럽지 않고, ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις는 단순한 ‘~에 따라’보다 기록된 내용이 심판의 근거임을 드러내는 표현이 더 정확합니다.
  naturalness: 현대 표준 한국어 합쇼체는 유지되어 있습니다. ‘책들이 펼쳐졌고’도 가능하지만, ἀνοίγω의 일반적이고 자연스러운 대응인 ‘열렸습니다’를 쓰는 편이 명료합니다. 복수 병렬을 정리하면 문장이 더 자연스럽습니다.
  terminology: ‘보좌’, ‘생명책’, ‘심판을 받았습니다’, ‘행위’는 문맥과 한국어 성서 용례에 적절합니다. ‘생명책’은 ‘생명의 책’보다 간결하며 통용되는 표현입니다.
  issues:
  - severity: medium
    issue: 복수 병렬 및 주어 호응
    rationale: τοὺς μεγάλους καὶ τοὺς μικρούς는 복수 대상을 가리킵니다. ‘큰 자와 작은 자가’보다 ‘큰 자들과 작은 자들’로 옮기면 원문의 복수와 한국어 문장 호응이 살아납니다.
  - severity: low
    issue: ‘책들에 기록된 것에 따라’의 근거 관계
    rationale: ἐκ는 심판의 근거나 출처를 나타냅니다. 이어지는 κατὰ τὰ ἔργα αὐτῶν와 한국어에서 같은 ‘~에 따라’가 반복되므로, 앞부분을 ‘기록된 것에 근거하여’로 구별하면 두 표현의 역할을 보존하면서도 자연스럽습니다.
  - severity: low
    issue: ‘펼쳐졌고’
    rationale: ἀνοίγω는 여기서 ‘열리다’가 가장 직접적이고 통상적인 번역입니다. ‘펼쳐지다’는 책의 물리적 형식에 관한 뉘앙스를 더할 수 있습니다.
  revised_text: 그리고 나는 죽은 자들, 곧 큰 자들과 작은 자들이 보좌 앞에 서 있는 것을 보았습니다. 책들이 열렸고, 또 다른 책이 열렸는데, 그것은 생명책이었습니다. 죽은 자들은 책들에 기록된 것에 근거하여, 자기들의 행위에 따라 심판을 받았습니다.
