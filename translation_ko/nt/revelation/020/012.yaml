  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
  footnotes:
  - marker: a
    text: Or 'according to their deeds.'
    reason: lexical_alternative
  - marker: b
    text: '''Books'' could also be rendered ''scrolls,'' reflecting the ancient medium.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 나는 죽은 자들, 곧 큰 자들과 작은 자들이 보좌 앞에 서 있는 것을 보았습니다. 책들이 열렸고, 또 다른 책이 열렸는데, 그것은 생명책이었습니다. 죽은 자들은 책들에 기록된 것에 근거하여, 자기들의 행위에 따라 심판을 받았습니다.
  philosophy: optimal-equivalence
