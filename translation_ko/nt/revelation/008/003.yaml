translation:
  language: ko
  text: 또 다른 천사가 와서 제단 곁에 섰습니다. 그는 금 향로를 가지고 있었습니다. 그리고 그가 보좌 앞에 있는 금 제단 위에 모든 성도의 기도와 함께[a] 향을 드리도록, 많은 향이 그에게 주어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
