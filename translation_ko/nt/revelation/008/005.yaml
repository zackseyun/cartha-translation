    reason: φωναί의 의미 범위(‘소리’/‘음성들’)를 보존하여, 본문의 모호성을 유지합니다.
  revision_rationale: The revision preserves the Greek narrative actions and the broad apocalyptic sense of γῆ as ‘땅,’ while rendering φωναί as the noncommittal ‘소리’ and documenting the possible ‘음성들’ reading. It also clarifies that the censer is filled and then thrown.
