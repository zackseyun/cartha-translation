  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
  footnotes:
  - marker: a
    text: Or "voices" for "sounds." The Greek term can denote either articulated voices or sounds/noises in a theophanic setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 천사는 향로를 가져다가 제단의 불로 그것을 채우고, 그것을 땅에 던졌습니다. 그러자 천둥소리와 소리[a]와 번개와 지진이 일어났습니다.
  philosophy: optimal-equivalence
  footnotes:
