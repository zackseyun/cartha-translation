review_pass:
  verdict: revise
  source_fidelity: 그리스어 ὅταν ἤνοιξεν은 서술 맥락에서 ‘그가 … 열었을 때’가 자연스럽습니다. 초안의 ‘그분께서 … 떼시자’는 주체를 높이는 동시에 ἀνοίγω(열다)를 ‘떼다’로 다소 의역합니다. ἐγένετο σιγὴ는 ‘침묵이 있었습니다’로 잘 반영되며, ὡς ἡμιώριον은 ‘약 반 시간 동안’으로 기간을 명시하는 편이 정확합니다.
  naturalness: 합쇼체로 ‘그가 일곱째 인을 여셨을 때, 하늘에 약 반 시간 동안 침묵이 있었습니다’는 자연스럽고 문어적 성경 문체에 맞습니다. ‘그분’은 한국어에서 불필요하게 경칭·신학적 해석을 부각하므로 피하는 것이 좋습니다.
  terminology: ‘인’은 계시록의 σφραγίς에 대해 정착된 적절한 용어입니다. ‘열다’는 원문의 기본 어휘를 보존합니다. 본문만으로 암시된 주어를 ‘어린양’으로 명시하지 않습니다.
  issues:
  - severity: medium
    issue: ‘인을 떼시자’
    rationale: ἀνοίγω는 ‘열다’이며, ‘떼다’는 관용적 번역일 수 있으나 원문의 어휘적 표현보다 해석적입니다. ‘열었을 때’로 옮기는 것이 최적 등가에 더 맞습니다.
  - severity: low
    issue: ‘그분께서’
    rationale: 원문은 3인칭 단수의 암시된 주어일 뿐 경칭을 표시하지 않습니다. ‘그가’는 선행 문맥의 지시를 유지하면서 불필요한 존칭을 덧붙이지 않습니다.
  - severity: low
    issue: ‘약 반 시간쯤’
    rationale: ‘약’과 ‘쯤’이 근사 표현을 중복합니다. ὡς의 근사성과 기간을 ‘약 반 시간 동안’으로 간결하고 분명하게 옮길 수 있습니다.
  revised_text: 그가 일곱째 인을 여셨을 때, 하늘에 약 반 시간 동안 침묵이 있었습니다.
