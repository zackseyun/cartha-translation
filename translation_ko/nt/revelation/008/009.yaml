  source_fidelity: 그리스어의 두 ‘삼분의 일’ 구조와 바다의 생명 있는 피조물 및 배의 파괴라는 대조를 정확히 반영합니다. ψυχάς는 이 문맥에서 동물의 생명을 가리키므로 ‘생명’으로 옮기는 것이 자연스럽고, 각주에서 어휘적 범위를 밝혀 둘 수 있습니다.
