  terminology: κτίσματα는 문맥상 바다의 생물들을 가리키지만 ‘피조물’은 원문의 어휘를 보존합니다. ψυχάς는 기술적 의미의 ‘영혼’으로 한정하지 않고 ‘생명’으로 번역합니다. πλοῖα는 ‘배들’, διεφθάρησαν은 재난 문맥에 맞게 ‘파괴되었습니다’로 유지합니다.
