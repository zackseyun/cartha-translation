source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
  footnotes:
  - marker: a
    text: Or 'land' for 'earth' (γῆ); the Greek term can denote either, but the broader apocalyptic context favors 'earth' here.
    reason: lexical_alternative
  - marker: b
    text: Or 'mingled with blood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째가 나팔을 불었습니다. 그러자 피가 섞인 우박과 불이 생겨나 땅[a]에 던져졌습니다. 땅의 삼분의 일이 불타 버렸고, 나무의 삼분의 일이 불타 버렸으며, 모든 푸른 풀이 불타 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅’은 ‘육지’ 또는 ‘지역’을 뜻할 수 있습니다. 그러나 여기서는 묵시적 재앙의 더 넓은 범위에 따라 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
