revisions:
- from: 또 내가 보고 들었습니다. 한 독수리가 공중 한복판을 날며 큰 음성으로 말하기를, 「화 있다, 화 있다, 화 있다, 땅에 거하는 자들이여. 아직 나팔을 불려고 하는 세 천사의 남은 나팔 소리 때문이라」 하였습니다.
  to: 또 나는 보았고 들었습니다. 한 독수리[a]가 하늘 한가운데[b]를 날아가면서 큰 소리로 말하였습니다. “곧 나팔을 불 세 천사의 남은 나팔 소리 때문에 땅에 사는 자들에게 화가 있다, 화가 있다, 화가 있다!”
  rationale: The revision maintains the SBLGNT’s ‘one eagle,’ the repeated prophetic woe, the imminent action of the three angels, and the causal force of the remaining trumpet sounds. It also supplies the relevant anchored notes and uses modern formal Korean.
