  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
  footnotes:
  - marker: a
    text: Some manuscripts read “one angel” instead of “one eagle.”
    reason: textual_variant
  - marker: b
    text: Or “in midair”; the Greek term refers to the sky at its highest point.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 나는 보았고 들었습니다. 한 독수리[a]가 하늘 한가운데[b]를 날아가면서 큰 소리로 말하였습니다. “곧 나팔을 불 세 천사의 남은 나팔 소리 때문에 땅에 사는 자들에게 화가 있다, 화가 있다, 화가 있다!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 어떤 사본들에는 ‘한 천사’라고 되어 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘공중에서’. 그리스어는 하늘의 가장 높은 곳 또는 머리 위의 탁 트인 하늘을 가리킵니다.
    reason: lexical_alternative
