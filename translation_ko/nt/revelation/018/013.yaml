  source_fidelity: ‘종, 곧 사람의 목숨’은 노예 거래라는 문맥상의 이해를 본문에서 확정하며, σώματα(‘몸들’)와 ψυχὰς ἀνθρώπων(‘사람들의 영혼/생명’)의 병렬 및 그 비인격화하는 표현을 충분히 보존하지 못합니다. 이를 문자적으로 옮기되, 문맥적 이해는 각주로 제한하는 편이 안전합니다. ῥεδῶν은 로마 시대의 운송·고급 차량을 가리키므로 ‘마차’는 적절합니다.
  naturalness: 열거를 ‘… 물품이었습니다’로 마무리하는 방식은 앞 문맥의 상업 목록을 한국어에서 자연스럽게 연결합니다. ‘사람들의 몸과 영혼’은 문자성을 유지하면서도 현대 표준어에서 이해 가능합니다.
  terminology: κιννάμωμον은 ‘계피’, ἄμωμον은 포괄적으로 ‘향료’로 옮기고 구체적 후보인 아모뭄은 각주로 제시합니다. θυμιάματα/λίβανον의 구별은 ‘향’/‘유향’으로 유지했습니다. σώματα를 ‘종’으로 번역하지 않고 ‘몸’으로 두어 원문의 수사와 해석상 여지를 보존했습니다.
