  text: 그 여자가 갚은 대로 그 여자에게 갚아 주십시오. 그 여자의 행위에 따라 그 여자에게 두 배로 갚아 주십시오.[a] 그 여자가 섞은 잔에 그 여자를 위해 두 배로 섞으십시오.
