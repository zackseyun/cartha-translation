revisions:
- from: 그리고 그와 더불어 음행하고 사치하였던 땅의 왕들이, 그의 불타는 연기를 볼 때에 그를 위하여 울며 가슴을 칠 것입니다.
  to: 그리고 그 여자와 음행하고 사치에 빠져 살았던 땅의 왕들은 그 여자가 불타는 연기를 볼 때, 그 여자를 두고 울며 가슴을 칠 것입니다.
  rationale: 애도의 대상에 대한 전치사구를 ‘그 여자를 두고’로 바로잡고, 원문의 여성 대명사가 가리키는 바벨론을 문맥상 ‘그 여자’로 일관되게 밝혔습니다. ‘음행’, ‘사치에 빠져 살다’, ‘울며 가슴을 치다’는 원문의 비유와 애도 관용구를 보존합니다.
