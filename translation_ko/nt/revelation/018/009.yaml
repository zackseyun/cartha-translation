review_pass:
  verdict: revise
  source_fidelity: 그리스어의 두 미래 동사(‘울고’ ‘가슴을 치다’), 왕들의 정체, 바벨론과의 음행 및 사치, 불타는 연기를 보는 때라는 순서는 대체로 잘 반영되었습니다. 다만 ἐπ’ αὐτήν은 ‘그를 위하여’보다 애도의 대상을 나타내는 ‘그 여자를 두고’가 더 정확합니다. 또한 문맥상 바벨론을 가리키는 αὐτήν을 ‘그 여자’로 밝혀 대명사 지시를 분명히 하는 것이 안전합니다.
  naturalness: 합쇼체는 적절합니다. ‘그와 더불어’와 ‘그를 위하여’는 현대 한국어 성경 문맥에서 지시 대상이 다소 불분명하고 후자는 목적·수혜의 뜻으로도 읽힐 수 있습니다. ‘그 여자와 … 그 여자를 두고’는 자연스럽고 애가 장면에 맞습니다.
  terminology: ‘음행’은 계시록의 성적·은유적 이미지를 보존하며, 이를 교리적으로 축소하지 않습니다. κόπτονται는 여기서 애도의 관용 표현이므로 ‘가슴을 칠 것입니다’가 ‘울며’와 함께 의미를 충실히 전달합니다. στρηνιάσαντες는 ‘사치에 빠져 살았던’으로 옮겨 향락적 사치의 뉘앙스를 살렸습니다.
  issues:
  - severity: medium
    issue: ‘그를 위하여 울며’
    rationale: ἐπ’ αὐτήν은 애도하는 대상을 가리킵니다. 한국어 ‘~을 위하여’는 그를 위한 행동 또는 유익을 뜻할 수 있으므로, ‘~을 두고’가 문맥과 용법에 더 정확합니다.
  - severity: low
    issue: 대명사 ‘그’의 지시 불명확성
    rationale: 원문의 여성 단수 대명사는 문맥상 바벨론을 가리킵니다. 한국어에서는 ‘그 여자’로 명시하면 음행의 상대와 불타는 대상 및 애도의 대상이 일관되게 드러납니다.
  revised_text: 그리고 그 여자와 음행하고 사치에 빠져 살았던 땅의 왕들은 그 여자가 불타는 연기를 볼 때, 그 여자를 두고 울며 가슴을 칠 것입니다.
