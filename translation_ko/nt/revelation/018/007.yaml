review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 남성 대명사(그가/그에게)는 여성 단수로 의인화된 바빌론과 일치하지 않습니다. 또한 πένθος는 단순한 ‘슬픔’보다 상실과 심판에 따른 ‘애도’ 또는 ‘애통’에 가깝고, οὐ μὴ ἴδω의 강한 부정도 분명히 드러내는 것이 좋습니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서, 명령형과 인용문의 자신만만한 어조를 자연스럽게 옮깁니다. ‘여왕으로 앉아 있습니다’는 왕좌에 앉은 안전과 지배의 이미지를 보존합니다.
  terminology: ‘영화롭게 하다’는 ἐδόξασεν αὑτὴν의 자기 고양을, ‘사치스럽게 살다’는 ἐστρηνίασεν의 사치·방종의 뜻을 반영합니다. βασανισμός는 ‘고통’, πένθος는 두 번 모두 ‘애도’로 일관되게 번역했습니다.
  issues:
  - severity: high
    issue: 여성 의인화의 성 불일치
    rationale: 원문은 αὑτὴν, αὐτῇ, αὐτῆς 및 βασίλισσα/χήρα를 통해 바빌론을 일관되게 여성으로 의인화합니다. 초안의 ‘그가/그에게’는 이를 남성으로 바꾸므로 수정해야 합니다.
  - severity: medium
    issue: πένθος의 번역
    rationale: ‘슬픔’은 넓은 정서어인 반면 πένθος는 특히 상실에 따른 애도·애통을 뜻합니다. 같은 단어가 두 차례 반복되므로 ‘애도’로 통일하는 것이 의미와 반복을 살립니다.
  - severity: medium
    issue: 강조 부정의 약화
    rationale: οὐ μὴ ἴδω는 매우 강한 부정입니다. ‘결코 ... 않을 것입니다’로 바빌론의 단언적 확신을 나타내야 합니다.
  revised_text: 그녀가 자신을 영화롭게 하고 사치스럽게 산 만큼, 그녀에게 그만큼 고통과 애도를 주십시오. 이는 그녀가 마음속으로 ‘나는 여왕으로 앉아 있으며, 과부가 아니고, 결코 애도를 겪지 않을 것입니다’라고 말하기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘방종하게 살았다’ 또는 ‘감각적 쾌락을 누리며 살았다’. 그리스어 동사는 사치스럽고 방종적인 삶을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘결코 애도를 겪지 않을 것입니다’에 쓰인 그리스어 표현은 강한 부정으로, 애도를 절대로 겪지 않을 것이라는 확신을 나타냅니다.
    reason: lexical_alternative
  revision_rationale: 여성 단수 의인화를 회복하고, 심판의 결과인 πένθος를 ‘애도’로 일관되게 옮겼습니다. 명령의 복수형은 한국어에서 자연스러운 정중 명령인 ‘주십시오’로 처리했으며, 최종 인용문에는 원문의 강조 부정을 반영했습니다. 각주 b는 영어 감사 기록과 같이 강조 부정이 있는 마지막 구절에 연결되어야 합니다.
