    rationale: ἑστηκότες와 λέγοντες는 이 환상 장면에서 그들이 서서 말하는 모습을 묘사합니다. 미래형은 원문에 없는 미래성을 도입합니다.
  - severity: medium
    issue: 「그의 고통」의 대명사 성별이 부정확합니다.
    rationale: αὐτῆς는 여성 단수이며, 여성으로 의인화된 바벨론을 가리킵니다. 「그녀가 받는 고통」으로 명확히 해야 합니다.
  - severity: low
    issue: 바벨론에 대한 동격 호칭의 배열이 다소 불분명합니다.
    rationale: 원문은 ‘큰 도성, 바벨론, 강한 도성’이라고 바벨론을 두 호칭과 동격으로 놓습니다. 호격을 분명히 하면 구조가 더 잘 드러납니다.
