  source_fidelity: 수정이 필요합니다. 초안의 미래시제 「말할 것입니다」는 과거 분사 ἑστηκότες 및 λέγοντες가 서술하는 장면과 맞지 않습니다. 또한 「그의」는 여성 단수 소유격 αὐτῆς가 가리키는 바벨론에 부적절합니다. 「한 시간 만에」는 μιᾷ ὥρᾳ의 급작스러운 시간 범위를 자연스럽게 보존합니다.
  naturalness: 「멀리 떨어져 서서 말하였습니다」는 현대 표준어 문장으로 자연스럽고, 인용문도 합쇼체로 통일하였습니다. 「큰 도성 바벨론아, 강한 도성아」는 바벨론을 두 도성 호칭에 동격으로 둔 원문의 호격적 열거를 명료하게 드러냅니다.
  terminology: βασανισμός은 「고통」, κρίσις는 「심판」으로 옮겼습니다. Βαβυλών은 초안의 표기 관례를 따라 「바벨론」으로 유지했습니다. οὐαὶ οὐαί는 애가와 심판의 힘을 유지하도록 「화가 있습니다, 화가 있습니다」로 번역했습니다.
  issues:
