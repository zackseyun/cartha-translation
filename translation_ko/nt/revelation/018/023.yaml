review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two emphatic irreversible-negation clauses, the personified second-person address, the merchants, and the deception of all nations. However, "권세자들" narrows μεγιστᾶνες to rulers/authorities, whereas the term more broadly denotes the earth's prominent or powerful people. "마술" is possible, but "주술" more clearly conveys φαρμακεία in this judgment context.
  naturalness: '"등불 빛" is nonstandard and redundant in modern Korean; "등불의 빛" is natural. The requested modern formal-polite register is better maintained with "-것입니다" than with the elevated biblical-style "-하리라."'
  terminology: Use "유력자들" for μεγιστᾶνες to avoid the over-specific political sense of "권세자들." Use "주술" for φαρμακεία as a clear Korean equivalent for sorcery/magical practice without reducing it to medicine or drugs.
  issues:
  - severity: medium
    issue: '"땅의 권세자들" over-specifies οἱ μεγιστᾶνες τῆς γῆς.'
    rationale: The Greek denotes leading, eminent, or powerful persons broadly; it need not identify them specifically as political rulers.
  - severity: low
    issue: '"등불 빛" is awkward and redundant.'
    rationale: The genitive phrase φῶς λύχνου is naturally rendered "등불의 빛."
  - severity: low
    issue: The draft uses "-하리라," rather than the requested modern formal-polite 합쇼체.
    rationale: Using "-것입니다" keeps the prophetic future sense while conforming to the stated target register.
  revised_text: 등불의 빛은 네 안에서 결코 다시 비치지 않을 것이며, 신랑과 신부의 음성은 네 안에서 결코 다시 들리지 않을 것입니다. 이는 네 상인들이 땅의 유력자들이었고, 너의 주술로 모든 민족이 미혹되었기 때문입니다.
