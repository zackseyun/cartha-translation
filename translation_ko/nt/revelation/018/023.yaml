- from: 등불 빛도 네 안에서 결코 다시는 비치지 아니하리라. 신랑과 신부의 음성도 네 안에서 결코 다시는 들리지 아니하리라. 네 상인들이 땅의 권세자들이었기 때문이며, 너의 마술로 모든 민족이 미혹되었기 때문이다.
  to: 등불의 빛은 네 안에서 결코 다시 비치지 않을 것이며, 신랑과 신부의 음성은 네 안에서 결코 다시 들리지 않을 것입니다. 이는 네 상인들이 땅의 유력자들이었고, 너의 주술로 모든 민족이 미혹되었기 때문입니다.
  rationale: The revision makes the lamp expression idiomatic, retains the emphatic "never again" force of οὐ μή with ἔτι, avoids narrowing μεγιστᾶνες to political rulers, and renders φαρμακεία as "주술." It also consistently uses modern formal-polite Korean.
