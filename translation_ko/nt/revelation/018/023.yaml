  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
  footnotes:
  - marker: a
    text: Or 'by your magic arts' or 'by your witchcraft.' The Greek φαρμακεία refers to sorcery or magical deception.
    reason: lexical_alternative
  - marker: b
    text: Or 'the magnates of the earth.' The Greek term refers to people of great prominence or power.
    reason: lexical_alternative
translation:
  language: ko
  text: 등불의 빛은 네 안에서 결코 다시 비치지 않을 것이며, 신랑과 신부의 음성은 네 안에서 결코 다시 들리지 않을 것입니다. 이는 네 상인들이 땅의 유력자들이었고, 너의 주술로 모든 민족이 미혹되었기 때문입니다.
  philosophy: optimal-equivalence
