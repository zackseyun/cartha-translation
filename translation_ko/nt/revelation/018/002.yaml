review_pass:
  verdict: revise
  source_fidelity: 현 초안은 바벨론을 남성 대명사 ‘그’로 받아 지시 대상이 불명확해졌고, ‘미움받는’이라는 수식어를 원문에 없는 ‘새’에도 첨가했습니다. 또한 마지막 인용부호가 누락되어 있습니다. 수정문은 δαιμονίων, κατοικητήριον, 반복된 φυλακή, 그리고 마지막 θηρίον에만 붙는 ἀκαθάρτου καὶ μεμισημένου를 반영합니다.
  naturalness: ‘힘찬 음성으로 외쳐 말했습니다’는 현대 표준어 합쇼체로 자연스럽습니다. 선언부는 ‘무너졌다, 무너졌다, 큰 바벨론이!’로 두어 원문의 반복과 예언적 선포의 어조를 보존했고, 서술부는 ‘바벨론은’으로 명시하여 한국어에서 자연스럽게 연결했습니다.
  terminology: ‘귀신들’, ‘더러운 영’, ‘감옥’, ‘짐승’은 원문의 어휘 범위와 계시록의 문체에 맞습니다. θηρίον은 이 문맥에서 특정한 묵시적 칭호가 아니라 일반 명사이므로 ‘짐승’으로 옮겼습니다. φυλακή의 대안적 ‘소굴/서식처’ 가능성과 마지막 절의 본문 이문은 각주로 보존했습니다.
  issues:
  - severity: high
    issue: 바벨론을 ‘그가’로 지칭함
    rationale: Βαβυλών은 도시이며, 한국어의 남성 인칭대명사 ‘그’는 원문에 없는 인격·성별 지시를 부여하고 문맥상 혼동을 만듭니다.
  - severity: high
    issue: ‘미움받는’이 ‘새’에도 수식되도록 번역됨
    rationale: μεμισημένου는 원문에서 마지막 θηρίου만 수식합니다. 새는 ‘모든 더러운 새’입니다.
  - severity: medium
    issue: 인용문의 닫는 따옴표 누락 및 ‘되었도다’의 문체 불일치
    rationale: 구조상 인용부호를 닫아야 하며, ‘되었도다’는 요청된 현대 합쇼체보다 고어적 종결입니다.
  revised_text: 그는 힘찬 음성으로 외쳐 말했습니다. “무너졌다, 무너졌다, 큰 바벨론이! 바벨론은 귀신들의 거처가 되었고, 모든 더러운 영의 감옥이 되었으며, 모든 더러운 새의 감옥이 되었고, 모든 더럽고 미움받는 짐승의 감옥이 되었습니다.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘모든 더러운 영의 소굴, 모든 더러운 새의 소굴, 모든 더럽고 미움받는 짐승의 소굴’. 여기서 ‘감옥’으로 옮긴 그리스어는 사람이 살거나 자주 드나드는 장소를 뜻할 수도 있습니다.
    reason: φυλακή의 어휘적 대안을 보존합니다.
  - marker: b
    text: 일부 사본은 ‘그리고 모든 더럽고 미움받는 짐승의 감옥이 되었고’를 생략합니다.
    reason: 마지막 θηρίου 구절에 관한 본문 이문을 보존합니다.
  revision_rationale: 바벨론을 명시적 도시명으로 바로잡고, 수식어의 원문상 결속 범위를 회복했으며, 현대 합쇼체 종결과 인용부호를 정비했습니다. 각주 표지는 본문에서 각각 첫 ‘감옥’ 뒤와 마지막 ‘짐승의 감옥’ 뒤에 붙여 사용하면 됩니다.
