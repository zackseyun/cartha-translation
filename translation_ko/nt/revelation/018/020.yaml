  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
  footnotes:
  - marker: a
    text: 'Or, more interpretively, ''because God has judged her for your sake'' or ''because God has avenged you on her.'' The Greek is compressed: literally, ''God judged your judgment from her.'''
    reason: alternative_reading
translation:
  language: ko
  text: 하늘이여, 성도들과 사도들과 예언자들이여, 그 여자를 두고 기뻐하십시오. 하나님께서 그 여자에게 너희를 위한 심판을 내리셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “하나님께서 그 여자에게서 너희의 심판을 심판하셨기 때문입니다.”입니다. 그리스어 표현은 압축되어 있으며, 하나님께서 그들을 위하여 그 여자에게 심판을 내리심으로 그들을 변호하거나 바로잡으셨다는 뜻으로도 이해될 수 있습니다.
    reason: The phrase τὸ κρίμα ὑμῶν ἐξ αὐτῆς is syntactically compressed. The main text gives a natural judicial rendering; the note preserves the literal form and signals the interpretive uncertainty.
