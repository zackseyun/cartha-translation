  terminology: ἔμποροι는 ‘상인들’, τῆς γῆς는 계시록의 넓은 범위를 보존하는 ‘땅의’, γόμον은 ‘화물’로 옮겼습니다. 바빌론을 해석적으로 도시나 체계로 바꾸지 않고 ‘그 여자’로 인칭 여성 이미지를 보존했습니다.
