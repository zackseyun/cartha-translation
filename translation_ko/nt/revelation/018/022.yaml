revisions:
- from: 수금 타는 자들과 음악가들과 피리 부는 자들과 나팔 부는 자들의 소리가 네 안에서 결코 다시는 들리지 아니하리라. 각종 기술자도 네 안에서 결코 다시는 발견되지 아니하리라. 맷돌 소리도 네 안에서 결코 다시는 들리지 아니하리라.
  to: 수금 연주자들과 음악가들과 피리 연주자들과 나팔수들의 소리는 네 안에서 결코 다시는 들리지 않을 것입니다[a]. 어떠한 기술 분야의 기술자도 네 안에서 결코 다시는 찾아볼 수 없을 것입니다. 맷돌 소리도 네 안에서 결코 다시는 들리지 않을 것입니다[b].
  rationale: 원문의 직접적인 2인칭 도시 의인화(‘네 안에서’), 세 차례의 단호한 종결 선언, 그리고 열거 구조를 보존했습니다. 동시에 현대 표준어 합쇼체로 문체를 정돈하고, 기술자의 포괄성을 명시했으며, 논쟁적이라기보다 어휘 범위와 관련된 두 지점에 주석을 제공했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:46Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 세 번 반복되는 강한 부정(οὐ μὴ)과 ‘더 이상/다시는’(ἔτι), 그리고 음악·기술 노동·맷돌의 소리가 차례로 사라지는 구조는 초안에 대체로 충실합니다. 다만 πᾶς τεχνίτης πάσης τέχνης의 포괄성은 ‘각종 기술자도’보다 ‘어떠한 기술 분야의 기술자도’로 더 분명하게 드러납니다.
  naturalness: 초안의 ‘수금 타는 자들’, ‘피리 부는 자들’ 및 ‘-아니하리라’는 문어적·고전적 성경체에 가깝습니다. 요구된 현대 표준어 합쇼체에 맞추어 ‘연주자들’과 ‘-않을 것입니다’로 고쳤습니다.
  terminology: ‘수금’은 κιθάρα 계열 악기를 가리키는 전통적 성경 용어로 유지하되, ‘연주자’와 결합해 자연스럽게 했습니다. αὐλητής는 현대 플루트와 동일하지 않은 고대 관악기 연주자이므로 ‘피리 연주자’로 번역하고 주석에서 한계를 밝혔습니다. μύλος는 맷돌 또는 제분 장치를 가리킬 수 있어 ‘맷돌 소리’에 관련 주석을 달았습니다.
  issues:
  - severity: medium
    issue: 문체가 현대 합쇼체 요구와 일치하지 않음
    rationale: ‘들리지 아니하리라/발견되지 아니하리라’는 고전적 성경 문체입니다. 현대 정중 서술인 ‘들리지 않을 것입니다/찾아볼 수 없을 것입니다’가 지정된 변이에 더 맞습니다.
  - severity: low
    issue: 기술자 표현의 포괄성이 다소 약함
    rationale: πᾶς τεχνίτης πάσης τέχνης는 모든 종류의 기술에 속한 모든 장인을 포괄합니다. ‘어떠한 기술 분야의 기술자도’가 이를 더 명시적으로 반영합니다.
  - severity: low
    issue: αὐλητής 및 μύλος의 어휘 범위에 대한 주석 앵커 부재
    rationale: 고대 αὐλός는 현대 플루트와 동일시할 수 없고, μύλος는 맷돌 또는 제분 장치를 가리킬 수 있습니다. 영어 감사 기록의 어휘상 유보를 한국어 주석으로 보존했습니다.
