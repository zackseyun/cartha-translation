- from: 모든 민족이 그 음행의 진노의 포도주를 마셨고, 땅의 왕들이 그와 더불어 음행하였으며, 땅의 상인들이 그의 사치의 능력으로 부유해졌기 때문이다.」
  to: 모든 민족이 그녀의 음행으로 인한 진노의 포도주 때문에 쓰러졌고[a], 땅의 왕들이 그녀와 더불어 음행을 저질렀으며, 땅의 상인들이 그녀의 사치의 힘으로 부유해졌기 때문입니다.[b]
  rationale: 원문 우선 원칙에 따라 πέπτωκαν을 ‘쓰러졌다’로 바로잡았습니다. ‘포도주’의 은유와 음행의 표현은 보존하되, 한국어에서 이해 가능한 수식 관계가 되도록 풀었습니다. 영어 감사 기록에 있는 ‘have drunk’는 그리스어 본문과 충돌하므로 따르지 않았습니다. 각주 표지는 해당 어휘에만 연결했고, 영어 기록의 중복·잘못된 표지 순서를 답습하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:55:45Z'
