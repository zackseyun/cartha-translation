  source_fidelity: 핵심 동사 πέπτωκαν은 πίνω(마시다)가 아니라 πίπτω(쓰러지다/무너지다)의 완료형이므로, ‘마셨고’는 원문과 맞지 않습니다. ἐκ는 이 문맥에서 그 포도주로 인한 결과를 나타내므로 ‘때문에’로 옮길 수 있습니다. 나머지 두 절의 병렬 구조와 상인들이 사치의 힘으로 부유해졌다는 뜻은 유지해야 합니다.
  naturalness: 현행 ‘그 음행의 진노의 포도주’ 및 ‘그의 사치의 능력’은 한국어 소유·수식 연쇄로 다소 부자연스럽고, 바빌론을 가리키는 여성 단수 대명사도 분명하지 않습니다. ‘그녀의 음행으로 인한 진노의 포도주’, ‘그녀의 사치의 힘’이 현대 표준어에서 더 자연스럽습니다. 문맥상 앞 절의 이유를 제시하는 절이므로 합쇼체 종결은 ‘때문입니다’가 적절하며, 불필요한 닫는 인용 부호는 삭제해야 합니다.
  terminology: πορνεία/πορνεύω의 성적 이미지는 해석적으로 ‘우상 숭배’ 등으로 바꾸지 않고 ‘음행’ 및 ‘음행을 저질렀다’로 보존했습니다. στρῆνος는 단순한 안락함보다 방종적·사치스러운 과잉을 뜻하므로 본문에서는 ‘사치’를 유지하고 주석으로 보완했습니다. θυμός는 ‘진노’와 ‘격정’의 의미 가능성이 있어 주석에서 대안을 제시합니다.
