review_pass:
  verdict: revise
  source_fidelity: 대체로 충실합니다. ‘이 일들 후에,’ ‘또 다른 천사,’ ‘큰 권세,’ ‘하늘에서 내려오는 것’은 각각 Μετὰ ταῦτα, ἄλλον ἄγγελον, ἐξουσίαν μεγάλην, καταβαίνοντα ἐκ τοῦ οὐρανοῦ를 잘 반영합니다. 다만 ἐφωτίσθη는 수동태이므로, 땅 자체가 빛을 낸다는 뜻으로도 읽힐 수 있는 ‘땅이 빛났습니다’보다 수동 의미를 드러내는 표현이 더 정확합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽습니다. ‘권세를 가진’은 ‘권세를 가지고’보다 관형 구조에서 더 매끄럽고, 두 절을 나누어 환상 서술의 흐름도 분명하게 했습니다.
  terminology: ‘권세’는 ἐξουσία의 권위·권한이라는 의미를 유지하며, ‘영광’은 δόξα의 성경적 용례에 적절합니다. ‘밝혀졌습니다’는 영광을 광명의 근원/수단으로 제시하면서 수동태를 보존합니다.
  issues:
  - severity: low
    issue: 수동태의 표현
    rationale: ‘땅이 빛났습니다’는 한국어에서 땅이 스스로 빛을 발했다는 능동적 인상도 줄 수 있습니다. 그리스어 ἐφωτίσθη의 수동태를 반영하여 ‘땅은 그의 영광으로 밝혀졌습니다’로 수정하는 것이 안전합니다.
  revised_text: 이 일들 후에 나는 큰 권세를 가진 또 다른 천사가 하늘에서 내려오는 것을 보았습니다. 그리고 땅은 그의 영광으로 밝혀졌습니다.
