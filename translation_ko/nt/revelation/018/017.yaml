  language: ko
  text: “한 시간에 그토록 큰 재물이 황폐해졌도다.” 그리고 모든 선장과 어느 곳으로 항해하는 모든 사람[a]과 선원들과 바다에서 일하는 모든 사람이 멀리 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어느 항구로 항해하는 모든 사람’ 또는 ‘어디든 항해하는 모든 사람’. 그리스어 표현은 다소 관용적이며, 목적지를 향해 바다로 이동하는 사람들을 넓게 가리킬 수 있습니다.
    reason: ὁ ἐπὶ τόπον πλέων의 정확한 범위가 논의되므로, 본문에서는 목적지 지향성을 유지하고 각주에서 가능한 더 넓거나 좁은 이해를 보존합니다.
