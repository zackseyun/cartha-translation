review_pass:
  verdict: revise
  source_fidelity: The draft broadly follows the Greek sequence and imagery, but its masculine pronoun (그의) obscures the antecedent, since the referent is the city, and its wording for the city's τιμιότης is imprecise. The revision makes the city's referent explicit and renders the commercial source of enrichment naturally.
  naturalness: ‘울며 슬퍼하여 외쳐 말하였습니다’ is redundant and stiff. ‘울고 슬퍼하며 외쳤습니다’ is natural modern Korean. The revised quotation consistently uses modern formal-polite endings rather than the archaic -도다 style.
  terminology: ‘티끌을 머리에 뿌리다’ is the conventional Korean expression for the mourning gesture. ‘그 도성의 부’ conveys the economic sense of τιμιότης while a note retains its possible nuances of costly splendor or luxury. ‘화가 있습니다’ retains the judgmental-lament force of οὐαί in a modern formal-polite form.
  issues:
  - severity: medium
    issue: The pronoun ‘그의’ is masculine and has an unclear antecedent.
    rationale: αὐτῆς refers to ‘the great city.’ Korean should name the city directly rather than use a masculine possessive pronoun.
  - severity: medium
    issue: The quotation uses archaic endings (‘화로다,’ ‘되었도다’) despite the requested modern formal-polite register.
    rationale: Modern formal-polite Korean is better maintained with ‘-습니다’ forms, without altering the lament and judgment force.
  - severity: low
    issue: ‘울며 슬퍼하여 외쳐 말하였습니다’ is repetitive and unnatural.
    rationale: The Greek participles κλαίοντες and πενθοῦντες modify ‘cried out’; ‘울고 슬퍼하며 외쳤습니다’ represents this relationship clearly.
  revised_text: 그리고 그들은 티끌을 자기들의 머리에 뿌리고, 울고 슬퍼하며 외쳤습니다. “화가 있습니다, 화가 있습니다, 큰 도성이여! 바다에 배를 가진 모든 사람이 그 도성의 부로[a] 부유해졌는데, 한 시간 만에 황폐해졌습니다.”
