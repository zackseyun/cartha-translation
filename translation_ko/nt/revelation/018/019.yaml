- from: 그리고 그들은 자기들의 머리에 흙먼지를 뿌리고 울며 슬퍼하여 외쳐 말하였습니다. 「화로다, 화로다, 큰 도성이여! 바다에 배를 가진 모든 자가 그의 부유함으로 부유해졌더니, 한 시간에 그가 황폐하게 되었도다.」
  to: 그리고 그들은 티끌을 자기들의 머리에 뿌리고, 울고 슬퍼하며 외쳤습니다. “화가 있습니다, 화가 있습니다, 큰 도성이여! 바다에 배를 가진 모든 사람이 그 도성의 부로[a] 부유해졌는데, 한 시간 만에 황폐해졌습니다.”
