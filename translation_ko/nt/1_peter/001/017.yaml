    issue: ‘편견 없이’는 ἀπροσωπολήμπτως의 의미를 다소 좁힐 수 있습니다.
    rationale: 이 말은 심판자가 사람의 신분이나 외적 조건에 따라 편파적으로 대하지 않는다는 뜻입니다. ‘차별 없이’가 본문의 공정성과 비편파성을 더 직접적으로 나타냅니다.
