  to: 여러분이 각 사람의 행위에 따라 차별 없이 심판하시는 분을 아버지라고 부른다면, 나그네로 살아가는 동안 두려움 가운데 처신하십시오.
  rationale: 하나님이 각 사람의 행위를 기준으로 편파 없이 심판하신다는 의미를 보존하도록 ‘편견 없이’를 ‘차별 없이’로 조정했습니다. 또한 현대 표준어의 자연스러운 인용 표현을 위해 ‘아버지라’를 ‘아버지라고’으로 바꾸었습니다. ‘두려움’과 ‘나그네로 살아가는 동안’은 각각 φόβος와 παροικία의 긴장과 임시 거주의 비유를 유지하므로 그대로 두었습니다.
