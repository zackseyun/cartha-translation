    issue: 「이 마지막 때에」에 원문에 없는 「이」가 들어감
    rationale: ἐπ’ ἐσχάτου τῶν χρόνων에는 ‘이/these’에 해당하는 지시사가 없습니다. ‘마지막 때에’로 옮겨 원문의 종말론적 시간 표현을 보존해야 합니다.
  - severity: low
    issue: 「창세 전에」가 καταβολῆς κόσμου의 표상을 축약함
    rationale: 뜻은 통하지만 ‘세상의 기초가 놓이기 전에’가 ‘세상의 기초/foundation of the world’를 더 명시적으로 반영합니다.
  revised_text: 그분은 세상의 기초가 놓이기 전에 미리 아신 바 되셨으나[a], 마지막 때에[b] 여러분을 위하여 나타나셨습니다.
