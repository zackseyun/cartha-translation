- from: 그분은 창세 전에 미리 아신 바 되셨고, 이 마지막 때에 여러분을 위하여 나타나셨습니다.
  to: 그분은 세상의 기초가 놓이기 전에 미리 아신 바 되셨으나[a], 마지막 때에[b] 여러분을 위하여 나타나셨습니다.
  rationale: 원문에 없는 지시어 「이」를 본문에서 제거하고, ‘세상의 기초’를 명시했습니다. προγινώσκω의 가능한 목적론적 해석은 각주에만 두어 본문이 ‘미리 아심’과 ‘미리 택정’ 사이의 해석적 긴장을 성급히 해소하지 않도록 했습니다. μέν…δέ의 대조는 「-으나」로 살렸습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:00Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 대조(μέν…δέ)와 수동 분사 구조는 대체로 반영되었으나, 「이 마지막 때에」의 「이」는 헬라어에 명시되지 않은 직시성을 더합니다. 또한 「창세 전」은 관용적으로 가능하지만, καταβολὴ κόσμου의 ‘세상의 기초/기초 놓임’을 본문에서 드러내는 편이 더 충실합니다.
  naturalness: 「미리 아신 바 되셨고」는 문어적 성서 문체로 가능하나, 대조 접속을 「-으나」로 명시하면 현대 표준어 합쇼체에서 문장 관계가 더 자연스럽고 분명해집니다.
  terminology: προεγνωσμένου는 해석적으로 ‘미리 택정되셨다’로 좁히지 않고 「미리 아신 바 되셨다」로 유지합니다. φανερωθέντος의 「나타나셨습니다」는 자연스럽고 적절합니다. 「세상의 기초가 놓이기 전에」는 창조 이전이라는 관용적 의미를 보존하면서 원문의 표상을 더 직접적으로 반영합니다.
  issues:
