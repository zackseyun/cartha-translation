revisions:
- from: 여러분은 썩어질 씨가 아니라 썩지 아니하는 씨로, 살아 있고 영원히 머무는 하나님의 말씀으로 말미암아 거듭난 자들이기 때문입니다.
  to: 여러분은 썩어 없어질 씨에서 난 것이 아니라 썩지 않을 씨에서 나고, 살아 있고 지속되는 하나님의 말씀[a]을 통하여 거듭난 사람들이기 때문입니다.
  rationale: 완료 수동분사 ἀναγεγεννημένοι의 결과 상태는 「거듭난 사람들」로 유지했습니다. ἐκ의 출처 의미를 「씨에서 난」으로 분명히 하고, μένοντος에는 본문에 없는 시간 부사를 보태지 않은 「지속되는」을 사용했습니다. 주된 수식 관계는 본문의 흐름과 다음 절에 따라 ‘말씀’으로 번역하되, 가능한 대안 수식 관계는 각주로 보존했습니다.
