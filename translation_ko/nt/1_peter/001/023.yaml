review_pass:
  verdict: revise
  source_fidelity: 「영원히 머무는」은 μένοντος의 지속·존속 의미를 잘 겨냥하지만, 본문에 명시되지 않은 ‘영원히’를 앞당겨 넣습니다. 또한 ἐκ의 출발점 의미는 「씨에서」로 드러내는 편이 더 정확합니다. 두 분사의 수식 범위에 관한 가능한 대안은 각주로 보존할 필요가 있습니다.
  naturalness: 「거듭난 자들」보다 「거듭난 사람들」이 현대 표준 한국어에서 자연스럽습니다. 「살아 있고 지속되는」은 합쇼체 문맥에서 자연스럽고 μένων의 진행·지속 의미를 과도하게 해석하지 않습니다.
  terminology: 「거듭난」, 「씨」, 「하나님의 말씀」은 베드로전서의 표현과 신학적 핵심어를 적절히 반영합니다. 「썩어 없어질/썩지 않을」은 φθαρτός/ἄφθαρτος의 대조를 자연스럽게 보존합니다.
  issues:
  - severity: medium
    issue: 「영원히 머무는」이 μένοντος에 ‘영원히’라는 명시되지 않은 시간 한정을 더합니다.
    rationale: μέ νοντος는 ‘머무는, 지속되는, 남아 있는’이라는 현재분사이며, 바로 다음 절의 인용이 영속성을 더 전개합니다. 이 절에서는 「지속되는」으로 옮겨 의미를 보존하는 것이 안전합니다.
  - severity: low
    issue: ἐκ σπορᾶς의 기원·출처 의미가 「씨로」에서는 다소 약합니다.
    rationale: 「씨에서 난 것이 아니라 … 씨에서 난」으로 옮기면 ἐκ의 ‘~에서/from’와 출생 비유의 연결이 분명해집니다.
  - severity: medium
    issue: ζῶντος와 μένοντος의 수식 범위에 관한 대안 독법을 알리는 각주가 없습니다.
    rationale: 주문은 문맥상 「말씀」을 수식하는 것으로 번역할 수 있으나, 영어 POB 감사 기록이 보존한 가능한 대안, 곧 「살아 있고 지속되는 하나님」이라는 연결 가능성도 각주로 밝혀야 합니다.
  revised_text: 여러분은 썩어 없어질 씨에서 난 것이 아니라 썩지 않을 씨에서 나고, 살아 있고 지속되는 하나님의 말씀[a]을 통하여 거듭난 사람들이기 때문입니다.
