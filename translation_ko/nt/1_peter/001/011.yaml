  to: 그들 안에 계신 메시아의 영께서 메시아에 관한 고난들[a]과 그 뒤에 따를 영광들을 미리 증언하시면서 어느 사람 또는 어떤 때를 가리키고 계시는지를 그들이 살폈습니다.
  rationale: 예언자들의 계속된 탐구를 「살폈습니다」로 회복하고, 성령의 미리 증언 및 가리키심과 예언자들의 탐구를 문법적으로 구분했습니다. εἰς Χριστόν의 관계는 주본문에서 과도하게 확정하지 않고, 유력한 전통적 이해를 각주로 보존했습니다.
