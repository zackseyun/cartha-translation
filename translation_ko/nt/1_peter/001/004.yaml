review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘들은 대체로 적절하지만, 현행문은 κληρονομίαν(유업)을 한 절 안에서 두 번 반복하여 원문에 없는 중복을 만들고 문장 구조를 흐립니다. τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς는 ‘여러분을 위하여 하늘에 간직되어 있는’으로 충실히 반영할 수 있습니다.
  naturalness: ‘유업 … 유업에 이르게 하셨습니다’는 현대 한국어에서 부자연스럽고, 앞 문맥에서 이어지는 ‘이르게 하셨습니다’의 목적어를 중복 없이 구성하는 편이 자연스럽습니다. 합쇼체 서술 종결도 유지됩니다.
  terminology: ‘유업’, ‘썩지 아니하고’, ‘더럽지 아니하고’, ‘시들지 아니하는’, ‘하늘에 간직되어 있는’은 각각 κληρονομία, ἄφθαρτον, ἀμίαντον, ἀμάραντον, τετηρημένην ἐν οὐρανοῖς에 적절합니다. ‘더럽지 아니하고’는 수동형을 강제하지 않으면서 ἀμίαντον의 상태를 자연스럽게 옮깁니다.
  issues:
  - severity: medium
    issue: ‘유업’의 중복
    rationale: 원문에는 κληρονομίαν이 한 번만 나오는데, 번역문은 ‘유업[a]’와 ‘유업에’로 두 번 반복합니다. 이는 의미를 더하지 않으며 문장 구조를 어색하게 만듭니다.
  - severity: low
    issue: 각주 앵커 및 각주의 불필요성
    rationale: 각주는 본문 의미에 필요한 이문·번역 대안을 제공하지 않고 음운상의 관찰만 제시합니다. 또한 중복된 첫 ‘유업’에 붙어 있어 수정 후에는 앵커가 남을 수 없습니다. 본 절에서는 각주 없이 본문을 명료하게 제시하는 것이 적절합니다.
  revised_text: 곧 썩지 아니하고 더럽지 아니하고 시들지 아니하는, 여러분을 위하여 하늘에 간직되어 있는 유업에 이르게 하셨습니다.
  revised_footnotes: []
  revision_rationale: 원문의 단일한 ‘유업’을 유지하고, 세 형용사와 ‘하늘에 간직되어 있는’이라는 완료 수동분사 수식어를 모두 유업에 연결했습니다. ‘이르게 하셨습니다’는 앞 절의 문장 흐름을 이어 받는 종결로 보존했습니다. 의미상 필수적이지 않은 각주는 삭제했습니다.
