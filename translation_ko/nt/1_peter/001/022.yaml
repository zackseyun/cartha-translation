  source_fidelity: 핵심 의미는 잘 반영합니다. 다만 φιλαδελφία는 한국어에서 ‘형제애’가 더 자연스럽고, 본문에 포함된 두 주석(형제 사랑의 범위 및 ‘순결한 마음’이라는 이문)을 한국어에도 보존하는 것이 영어 POB 감사 기록과 본문 비평 정보를 충실히 반영합니다.
  naturalness: 합쇼체 명령문과 문장 구조는 자연스럽습니다. ‘거짓 없는 형제애’는 ‘거짓 없는 형제 사랑’보다 현대 표준 한국어에서 더 간결하고 자연스럽습니다. ‘마음에서’는 ἐκ καρδίας의 자연스러운 한국어 표현입니다.
  terminology: ‘진리에 순종함으로’, ‘영혼’, ‘정결하게 하여’, ‘형제애’, ‘사랑하십시오’는 각각 원문의 어휘와 문장 내 φιλαδελφία/ἀγαπάω의 표현상 구별을 무리 없이 반영합니다. ‘뜨겁게’는 ἐκτενῶς의 강도와 지속성을 자연스럽게 전달합니다.
  issues:
