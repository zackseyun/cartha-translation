    rationale: φιλαδελφία는 문자적으로 형제적·가족적 사랑을 가리키지만, 이 문맥에서는 여성 신자도 포함하는 공동체 안의 사랑입니다. 영어 POB의 관련 주석을 한국어에도 보존하는 편이 좋습니다.
