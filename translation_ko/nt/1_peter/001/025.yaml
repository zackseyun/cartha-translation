  source_fidelity: 그리스어의 κύριος는 본문상 ‘주님’으로 옮기는 것이 가장 직접적입니다. 이 절이 이사야 40:8을 인용한다는 사실은 중요하지만, 인용의 히브리어 배경을 근거로 그리스어 본문의 ‘주님’을 ‘야훼’로 대체하면 베드로전서 본문의 표현 및 영어 POB 감사 기록과의 대응이 약해집니다. τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς는 ‘여러분에게 좋은 소식으로 선포된 말씀’으로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: ‘…함과 같습니다’는 τοῦτο δέ ἐστιν(‘그리고/그런데 이것은 …이다’)의 서술·동일시 구조를 반영하지 못하며 현대 한국어에서도 부자연스럽습니다. ‘그리고 이것이 곧 … 말씀입니다’가 명료하고 합쇼체 문체에 맞습니다.
  terminology: κύριος는 ‘주님’, ῥῆμα는 두 절에서 일관되게 ‘말씀’, εὐαγγελισθέν은 ‘좋은 소식으로 선포된’으로 옮깁니다. ‘복음으로 선포된’은 가능한 어휘 대안으로 각주에 제시합니다.
