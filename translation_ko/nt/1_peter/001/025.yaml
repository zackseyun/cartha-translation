  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you.
translation:
  language: ko
  text: 그러나 주님의 말씀은 영원히 머뭅니다. 그리고 이것이 곧 여러분에게 좋은 소식으로 선포된 말씀입니다[a].
  philosophy: optimal-equivalence
  footnotes:
