  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 δι’ αὐτοῦ는 이 문맥에서 그리스도를 통한 매개를 나타내므로 「그분을 통하여」가 「그분으로 말미암아」보다 더 직접적입니다. ὥστε는 앞선 하나님의 행위에서 비롯되는 결과를 나타내므로 이를 분명히 드러냈습니다.
  naturalness: 초안은 이해 가능하나, 「그분」의 반복은 하나님과 그리스도의 지시 대상을 잠시 불분명하게 할 수 있습니다. 문맥상 지시 대상을 유지하면서 문장을 나누어 현대 표준 한국어 합쇼체로 다듬었습니다.
  terminology: πιστούς εἰς θεόν은 「하나님을 믿는 사람들」로, ἐκ νεκρῶν은 「죽은 자들 가운데서」로, δόξα는 「영광」으로, πίστις와 ἐλπίς는 각각 「믿음」과 「소망」으로 적절히 옮겼습니다.
  issues:
