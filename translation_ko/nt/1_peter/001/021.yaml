  to: 여러분은 그분을 통하여 하나님을 믿는 사람들입니다. 하나님께서는 그분을 죽은 자들 가운데서 일으키시고 그분에게 영광을 주셨습니다. 그 결과 여러분의 믿음과 소망은 하나님께 있습니다.
  rationale: 그리스도를 가리키는 대명사는 원문의 문맥을 따라 유지하되, 문장을 나누어 하나님께서 부활시키시고 영광을 주신 분이 앞서 언급된 그분임을 자연스럽게 나타냈습니다. 「그 결과」로 ὥστε의 결과적 연결을 보존했으며, 원문이나 영어 감사 기록의 대안적 의미를 본문에 과도하게 부가하지 않았습니다.
