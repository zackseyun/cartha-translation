  source_fidelity: 원문의 강한 대조 접속사 ἀλλά는 “도리어”로, τιμίῳ αἵματι는 “보배로운 피로”로 적절히 옮겼습니다. ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου의 비교는 “흠 없고 점 없는 어린 양의 피와 같은”으로 피에 대한 비교임을 분명히 하며, 두 수식어도 보존합니다. Χριστοῦ는 칭호 의미를 살려 “메시아의”로 정확히 처리했습니다.
  naturalness: “도리어 … 피로 된 것입니다”는 앞 절의 ‘속량됨’에 이어지는 문장 구조로 자연스럽고, 현대 표준어의 격식 있는 합쇼체에 맞습니다. “흠 없고 점 없는”은 다소 성서적 어조이지만 제의적·문학적 맥락에 잘 어울리며 현대 독해에도 무리가 없습니다.
  terminology: “메시아”, “보배로운 피”, “어린 양”, “흠 없고 점 없는”은 원문의 칭호성과 희생 제의 어휘를 과도한 해석 없이 유지합니다. 특히 ‘메시아’를 ‘그리스도’로 바꾸지 않은 것은 제공된 번역 방침 및 영어 POB의 선택과 일치합니다.
