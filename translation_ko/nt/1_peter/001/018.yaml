  source_fidelity: 원문의 부정된 수단(‘은이나 금 같은 썩어질 것들로’)과 구속의 출발점(조상들에게서 물려받은 헛된 삶의 방식)을 유지하되, 원안의 ‘~것으로 된 것이 아닌’은 수단이 아니라 구성 재료를 뜻하는 것으로 읽힐 수 있어 바로잡았습니다.
  naturalness: 수정안은 현대 표준 한국어 합쇼체에서 자연스러운 문장 구조입니다. ‘~아니라는 것을 알고 있습니다’는 εἰδότες ὅτι의 참여사 연결과 내용절을 무리 없이 반영합니다.
  terminology: ‘속량받은’은 λυτρόω의 값을 통한 해방·구원 이미지를 보존하면서 현대 한국어에서 ‘구속받다’가 체포의 뜻으로 오해될 여지를 피합니다. ‘조상들에게서 물려받은’은 πατροπαράδοτος의 전승·상속 의미를 자연스럽게 전달합니다.
