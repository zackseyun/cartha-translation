  to: 여러분은 조상들에게서 물려받은 헛된 삶의 방식에서 은이나 금 같은 썩어질 것들로 속량받은 것이 아니라는 것을 알고 있습니다.[a]
  rationale: 원문의 문법적 관계를 분명히 하기 위해 ‘은이나 금’이 구속의 수단으로 부정됨을 직접 표현했습니다. ‘행실’보다 ἀναστροφή의 넓은 의미를 담는 ‘삶의 방식’을 사용했고, 불필요하게 다음 절이나 특정 속죄 이해를 해설하던 각주는 어휘 대안 주석으로 교체했습니다.
