    issue: 각주 표지의 대상 불일치
    rationale: '[a]가 「성령의 거룩하게 하심으로」에 붙어 있지만, 각주 내용은 「피 뿌림」의 구약 언약·정결 배경을 설명합니다. 표지를 「피 뿌림」에 붙여야 각주 앵커와 설명 대상이 일치합니다.'
  - severity: low
    issue: 「순종함」 및 「메시아 예수」의 어색한 명사 결합
    rationale: 원문의 명사 병렬(ὑπακοήν καὶ ῥαντισμόν)은 「순종과 ... 피 뿌림」이 더 자연스럽습니다. 「메시아이신 예수」는 Χριστός의 칭호를 보존하면서도 현대 한국어 문법에 맞습니다.
  revised_text: 곧 아버지 하나님의 미리 아심을 따라, 성령의 거룩하게 하심으로, 순종과 메시아이신 예수의 피 뿌림을 위하여 택하심을 받은 자들입니다. 은혜와 평강이 여러분에게 더욱 풍성하기를 빕니다.
  revised_footnotes:
  - marker: a
    text: 「피 뿌림」은 출애굽기 24:8 등 구약의 언약 체결과 정결 의식의 심상을 환기합니다.
    reason: cross_reference
  revision_rationale: 각주 표지를 「피 뿌림」에 배치하여 구조적 불일치를 바로잡았습니다. 「순종함」을 「순종」으로 고쳐 원문의 명사 병렬을 자연스럽게 살렸고, 「메시아 예수」를 「메시아이신 예수」로 고쳐 Χριστός의 칭호적 의미와 현대 표준 한국어의 자연스러움을 함께 보존했습니다. 「택하심을 받은 자들」은 1:1의 선행 수식 대상이 1:2에서 계속되는 문맥을 한국어 문장으로 완결하기 위해 유지했습니다.
