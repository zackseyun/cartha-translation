  - severity: medium
    issue: 「메시아 예수의 피 뿌림」의 수식 관계가 모호합니다.
    rationale: 원문 αἵματος Ἰησοῦ Χριστοῦ는 예수 메시아의 피를 가리킵니다. 현행 한국어는 예수가 피를 뿌리는 것으로도 읽힐 수 있으므로 「메시아이신 예수의 피를 뿌림받음」으로 피의 소유와 뿌림의 수혜 관계를 명확히 합니다.
  - severity: low
    issue: 「순종함」은 다소 부자연스럽습니다.
    rationale: ὑπακοή는 현대 한국어에서 「순종」으로 자연스럽게 옮길 수 있으며 의미 손실이 없습니다.
  revised_text: 곧 아버지 하나님의 미리 아심을 따라, 성령께서 거룩하게 하심으로, 순종과 메시아이신 예수의 피를 뿌림받음[a]을 위하여 택하심을 받은 자들입니다. 은혜와 평강이 여러분에게 더욱 풍성하기를 빕니다.
