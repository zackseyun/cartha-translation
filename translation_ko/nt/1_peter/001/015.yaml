  to: 오히려 여러분을 부르신 분이 거룩하신 것처럼, 여러분도 모든 행실에서 거룩한 사람이 되십시오.[a][b]
  rationale: 대조를 「오히려」로, 하나님의 거룩하심과 수신자의 거룩함 사이의 대응 관계를 「거룩하신 것처럼」으로 명시했습니다. 또한 반복되는 ἅγιος를 보존하고, ἀναστροφή는 「행실」로 유지했으며, γενήθητε는 현대적인 합쇼체 「거룩한 사람이 되십시오」로 옮겼습니다. 각주가 사용될 경우 원문 어휘와 일치하는 위치에 배치했습니다.
