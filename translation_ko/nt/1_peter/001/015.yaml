  verdict: revise
  source_fidelity: 원문의 대조(ἀλλά)와 하나님의 거룩하심을 본으로 삼는 비교 관계(κατὰ ... ἅγιον)는 대체로 반영되어 있습니다. 그러나 「거룩하신 분을 따라」는 원문의 ‘부르신 분이 거룩하신 것에 상응하여’라는 비교를 다소 느슨하게 만들며, 「거룩한 자가 되십시오」는 현대 표준어에서 다소 문어적·명사화된 표현입니다.
  naturalness: 「도리어」도 가능하지만 이 문맥의 권면에서는 「오히려」가 더 자연스럽습니다. 「여러분을 부르신 분이 거룩하신 것처럼」은 한국어 문장 구조상 비교와 근거를 명료하게 드러냅니다. 「거룩한 사람이 되십시오」는 합쇼체의 현대적이고 자연스러운 명령 표현입니다.
  terminology: ἅγιος의 반복은 「거룩하신/거룩한」으로 유지하는 것이 적절합니다. ἀναστροφή의 「행실」은 정착된 성서 어휘로 적합합니다. 다만 영어 감사 기록의 각주 앵커는 내용과 서로 뒤바뀌어 있으므로, 한국어 각주를 둘 경우 해당 어휘 뒤에 각각 바르게 배치해야 합니다.
