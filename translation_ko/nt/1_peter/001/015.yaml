  text: ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/015.yaml
  text: but as the Holy One who called you is holy, you yourselves also be holy in all your conduct,
translation:
  language: ko
  text: 오히려 여러분을 부르신 분이 거룩하신 것처럼, 여러분도 모든 행실에서 거룩한 사람이 되십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “삶의 방식에서.” 그리스어는 사람의 전반적인 삶의 방식이나 행실을 가리킬 수 있습니다.
    reason: ἀναστροφῇ의 어휘적 대안을 해당 표현 뒤에 바르게 제시합니다.
  - marker: b
    text: 또는 “거룩하게 되십시오.” 그리스어 명령형은 그러한 상태에 이르거나 그것을 드러내라는 뉘앙스를 나타낼 수 있으나, 여기서는 “거룩한 사람이 되십시오”가 자연스럽습니다.
    reason: γενήθητε의 ‘되다’라는 어휘적 가능성을 명령형 뒤에 바르게 제시합니다.
lexical_decisions:
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  english_pob_choice: as the Holy One who called you is holy
  chosen_korean: 여러분을 부르신 거룩하신 분을 따라
  alternatives_korean:
  - 너희를 부르신 거룩한 이를 본받아
  - 너희를 부르신 그 거룩하신 분처럼
  lexicon: BDAG
  rationale: κατά + 대격의 기준·표준 의미를 「~을 따라」로 살리고, ἅγιον을 칭호적으로 옮긴다.
- source_word: ἀναστροφῇ
  english_pob_choice: conduct
  chosen_korean: 행실
  alternatives_korean:
  - 삶의 방식
  - 처신
  lexicon: BDAG
  rationale: 「행실」은 한국 성서 전통에서 ἀναστροφή의 정착 등가어다.
- source_word: γενήθητε
  english_pob_choice: be
  chosen_korean: 되십시오
  alternatives_korean:
  - 이루십시오
  lexicon: BDAG
  rationale: 부정 과거 수동 명령으로 「~이 되다」의 의미. 합쇼체 명령형으로 옮긴다.
