  text: ὃν οὐκ ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him, you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: ko
  text: 여러분은 그분을 보지 못하였지만 사랑합니다. 지금도 그분을 보지 못하지만 믿으며, 말로 다 할 수 없고 영광스러운[a] 기쁨으로 크게 기뻐합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “영광으로 가득한 기쁨” 또는 “영광을 입은 기쁨”.
    reason: δεδοξασμένῃ(완료 수동분사)는 문맥상 ‘영광스러운’으로 자연스럽게 옮길 수 있으나, ‘영광으로 가득한’ 및 수동적 뉘앙스를 살린 표현도 가능한 번역이다.
lexical_decisions:
- source_word: οὐκ ἰδόντες ἀγαπᾶτε
  english_pob_choice: Though you have not seen him, you love him
  chosen_korean: 보지 못하였으되 사랑하고
  alternatives_korean:
  - 보지 못했지만 사랑하며
  lexicon: BDAG
  rationale: 양보의 분사 구문을 「~으되 ~하고」 어미로 자연스럽게 옮긴다.
- source_word: ἀνεκλαλήτῳ
  english_pob_choice: inexpressible
  chosen_korean: 말로 다 할 수 없는
  alternatives_korean:
  - 형언할 수 없는
  - 이루 말할 수 없는
  lexicon: BDAG
  rationale: ἀνεκλάλητος는 신약 단 한 번 쓰인 강한 표현이며, 한국어 「말로 다 할 수 없는」이 가장 자연스럽게 그 강도를 살린다.
- source_word: δεδοξασμένῃ
  english_pob_choice: glorious
  chosen_korean: 영광스러운
  alternatives_korean:
  - 영광에 가득 찬
  - 영광스럽게 된
  lexicon: BDAG
  rationale: 완료 수동분사 「영광으로 채워진」을 한국어로 평이하게 「영광스러운」으로 옮긴다.
- source_word: ἀγαλλιᾶσθε
  english_pob_choice: you rejoice
  chosen_korean: 크게 기뻐합니다
  alternatives_korean:
  - 환희합니다
  lexicon: BDAG
  rationale: 1:6과 같은 동사 — 종말적 환희이므로 「크게 기뻐합니다」로 통일.
