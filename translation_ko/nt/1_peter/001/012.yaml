  to: 그들에게는 그들이 자기들을 위해서가 아니라 여러분을 위해 이 일들을 섬기고 있었다는 사실이 계시되었습니다. 이 일들은 이제 하늘에서 보내심을 받은 성령에 힘입어 여러분에게 복음을 전한 사람들을 통하여 여러분에게 전해진 것이며, 천사들도 들여다보기를[a] 갈망하는 것입니다.
  rationale: 원문의 수동적 ‘계시되었다’와 ‘전해졌다’를 유지하고, ‘자기들을 위해서가 아니라 여러분을 위해’라는 여격 수혜자 대조를 명시했습니다. αὐτά는 ‘이 일들’로 보존하되, 한국어에서 가능한 표현인 ‘이 일들을 섬기고 있었다’로 예언자들의 봉사와 그 내용을 연결했습니다. 복음 선포자는 ‘성령에 힘입어’ 선포했으며, 성령은 ‘하늘에서 보내심을 받은’ 분사구의 수식을 받습니다. 각주는 παρακύψαι의 어휘적 뉘앙스만 보완하며 해석을 강요하지 않습니다.
