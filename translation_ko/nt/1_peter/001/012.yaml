  source_fidelity: 개정이 필요합니다. 초안의 첫 문장은 αὐτά(‘이 일들’)와 διηκόνουν(‘섬기고 있었다’)의 관계를 ‘그것들이 … 섬기던 일’로 처리하여, ‘일들’ 자체가 섬겼다는 뜻처럼 읽힙니다. 또한 δεύτε 문장의 ‘전해진 것들’은 ἃ νῦν ἀνηγγέλη의 수동적 선포를 불필요하게 명사화하고 반복합니다. 개정문은 예언자들에게 계시된 내용, 수혜자의 대조, 현재의 복음 선포, 성령의 수단적 역할, 천사들의 지속적인 열망을 보존합니다.
  naturalness: 초안에는 ‘그들에게는 그것들이 … 일이라는 것이’ 및 ‘전해진 것들’처럼 한국어 문장 구조상 무겁고 지시 관계가 불분명한 표현이 있습니다. 개정문은 현대 표준어 합쇼체를 유지하면서도 긴 원문의 논리적 연결을 자연스럽게 드러냅니다.
