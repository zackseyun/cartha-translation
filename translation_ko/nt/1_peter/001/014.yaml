  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience, not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: ko
  text: 순종의 자녀들[a]로서, 전에 여러분이 무지할 때에 품었던 정욕들에 자신을 맞추지 마시고,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “순종하는 자녀들.” 그리스어는 직역하면 “순종의 자녀들”입니다.
    reason: τέκνα ὑπακοῆς의 직역적 속격 표현과 자연스러운 형용사적 대안을 함께 제시합니다.
lexical_decisions:
- source_word: τέκνα ὑπακοῆς
  english_pob_choice: children of obedience
  chosen_korean: 순종의 자녀들
  alternatives_korean:
  - 순종하는 자녀들
  - 순종에 속한 자녀들
  lexicon: BDAG
  rationale: 셈어식 속격 표현(「~의 자녀」)을 보존하여 본문의 특성을 살린다.
- source_word: μὴ συσχηματιζόμενοι
  english_pob_choice: not conforming yourselves
  chosen_korean: 자신을 맞추지 마시고
  alternatives_korean:
  - 본받지 마시고
  - 동화되지 마시고
  lexicon: BDAG
  rationale: 외형적 동조를 가리키는 συσχηματίζω의 의미를 「자신을 맞추다」로 살린다 (롬 12:2와 동일 어근).
- source_word: πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν
  english_pob_choice: formerly in your ignorance
  chosen_korean: 전에 무지하던 때
  alternatives_korean:
  - 이전에 무지함 가운데
  lexicon: BDAG
  rationale: 시간적·정황적 「전에」를 자연스럽게 옮긴다.
- source_word: ἐπιθυμίαις
  english_pob_choice: desires
  chosen_korean: 정욕들
  alternatives_korean:
  - 욕망들
  - 사욕들
  lexicon: BDAG
  rationale: 부정적 함의의 ἐπιθυμία를 한국 성서 전통의 「정욕」으로 옮긴다.
