    issue: 현대 합쇼체와 맞지 않는 문체
    rationale: ‘기록되었기를’, ‘거룩할지니’, ‘때문이라’, ‘함과 같습니다’는 고전적·문어적 표현으로, 지정된 현대 표준어 합쇼체에 부합하지 않습니다.
