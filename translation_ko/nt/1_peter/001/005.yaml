  source_fidelity: 수정이 필요합니다. 본문의 「구원에 이르기까지」는 εἰς σωτηρίαν의 목적·지향을 어느 정도 반영하지만, ‘~할 때까지’라는 시간적 한계를 강하게 암시하여, 마지막 때에 계시될 구원을 향한 보호라는 구문을 흐릴 수 있습니다. 또한 현 각주 표지는 ‘구원에 이르기까지’ 뒤에 있으나 각주 내용은 ἐν καιρῷ ἐσχάτῳ에 관한 것이므로 닻 위치가 맞지 않습니다. 수정문은 지속 수동의 보호, 하나님의 능력, 믿음을 통한 수단, 미래에 계시될 구원을 모두 보존합니다.
  naturalness: 「여러분은 … 보호받고 있는 사람들입니다」는 현대 표준 한국어 합쇼체 문장으로 자연스럽습니다. 「마지막 때에 나타나도록 이미 준비되어 있는 구원」은 ἑτοίμην ἀποκαλυφθῆναι의 ‘계시될 준비가 되어 있음’을 자연스럽게 드러냅니다.
  terminology: 「하나님의 능력」, 「믿음」, 「구원」, 「마지막 때」는 문맥과 한국어 성서 문체에 적절합니다. φρουρουμένους의 지속적 수동 의미는 「보호받고 있는」으로 유지했습니다. πίστις의 대안과 마지막 때의 전치사적 뉘앙스는 해당 어구에 각주로 연결했습니다.
