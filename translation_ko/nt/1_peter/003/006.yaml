  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ὡς는 앞 절의 권면에 이어지는 비교 표현이므로 구어적인 보충 설명처럼 들리는 “것처럼 말입니다”보다 직접적인 비교 구문으로 옮기는 편이 낫습니다. ἀγαθοποιοῦσαι와 μὴ φοβούμεναι의 조건적 뉘앙스는 “한다면”으로 무리 없이 드러납니다.
  naturalness: 현대 표준어 합쇼체에서 “곧 … 것처럼 말입니다”는 성경 본문으로 다소 부자연스럽고 문장 연결도 모호합니다. “사라가 … 한 것처럼”으로 고치면 자연스럽고 앞 문맥과의 연결도 유지됩니다. “된 것입니다”보다 “되었습니다”가 본문의 서술에 더 간결하고 자연스럽습니다.
  terminology: κύριον은 신적 칭호가 아닌 사라가 아브라함에게 쓰는 존칭이므로 “주인”은 가능한 번역입니다. τέκνα는 문법적으로 중성이지만, 여성 수신자 및 여성 복수 분사와의 문맥상 “딸들”은 정당합니다. πτόησις의 의미 범위(공포/두렵게 하는 것)를 각주로 보존해야 합니다.
  issues:
  - severity: low
    issue: “곧 사라가 … 것처럼 말입니다”
    rationale: ὡς의 비교 기능을 구어적 설명처럼 처리하여 문체가 어색하고 앞 절과의 문법적 연결이 흐려집니다.
  - severity: low
    issue: πτόησις의 대안 의미에 대한 각주가 없음
    rationale: 본문의 “위협”은 문맥상 가능하지만, ‘공포’ 또는 ‘두렵게 하는 것’이라는 어휘적 범위도 있으므로 감사 추적에 따른 각주가 필요합니다.
  revised_text: 사라가 아브라함에게 순종하고 그를 「주인」이라 부른 것처럼, 여러분도 선을 행하고 어떤 위협도[a] 두려워하지 아니한다면 사라의 딸들이 되었습니다.
  revised_footnotes:
