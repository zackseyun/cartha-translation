    text: 또는 “어떤 공포도”, “두려움을 일으키는 어떤 것도”.
    reason: πτόησις는 문맥상 ‘위협’으로 번역할 수 있으나 ‘공포·놀람’ 또는 ‘두려움을 일으키는 것’이라는 의미 범위도 있습니다.
  revision_rationale: 비교절을 주절에 연결하여 그리스어의 구문과 한국어의 완결성을 함께 살렸습니다. 여성 수신자라는 문맥은 유지하되 τέκνα의 기본 의미를 반영하여 '자녀들'로 옮겼습니다. 두 분사의 조건적 뉘앙스는 영어 POB 감사 기록과 조화되도록 '…않으면'으로 유지했습니다.
