review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ὡς가 이끄는 비교를 '곧 ... 것처럼 말입니다'라고 독립 문장처럼 처리한 것은 한국어 문장 구조상 부자연스럽고, τέκνα는 문맥상 여성 독자에게 적용되더라도 기본적으로 '자녀들'이므로 '딸들'로 한정하지 않는 편이 원문 어휘를 더 직접적으로 보존합니다.
  naturalness: 초안의 첫 문장은 '것처럼 말입니다'로 끝나 미완결적으로 들립니다. 비교절을 뒤의 주절과 직접 연결하면 현대 표준어 합쇼체에서 자연스럽고 명료합니다. '두려워하지 아니한다면'도 가능하나, 현대 합쇼체에는 '두려워하지 않으면'이 더 자연스럽습니다.
  terminology: κύριον은 신적 칭호가 아닌 사라의 존칭이므로 인용부호를 사용한 '주인'은 가능한 선택입니다. 다만 한국어에서 소유 관계를 강하게 암시할 수 있으므로, 문맥상 인용된 호칭임을 분명히 유지했습니다. πτόησις는 '위협'으로 옮길 수 있으며, '두려움/공포'라는 어휘적 범위는 각주로 보존하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 비교절이 미완결 문장처럼 분리됨
    rationale: ὡς Σάρρα ...는 뒤의 '그의 자녀가 되었습니다'와 연결되는 비교 구조입니다. '것처럼 말입니다'는 한국어에서 담화적 덧말처럼 들리고 본문의 문장 관계를 흐립니다.
  - severity: low
    issue: τέκνα를 '딸들'로 특정함
    rationale: 여성형 분사 때문에 수신자가 여성임은 분명하지만, τέκνα 자체는 '자녀들'입니다. '자녀들'은 본문의 가족 비유를 보존하면서도 불필요한 어휘적 한정을 피합니다.
  - severity: low
    issue: πτόησις의 대안 의미에 대한 각주 부재
    rationale: '''위협''은 문맥상 적절하지만 이 명사는 ''공포, 놀람, 두려움을 일으키는 것''의 의미도 가질 수 있으므로 짧은 대안 각주가 번역의 범위를 투명하게 합니다.'
  revised_text: 사라가 아브라함에게 순종하여 그를 「주인」이라 부른 것처럼, 여러분도 선을 행하고 어떤 위협도 두려워하지 않으면 그의 자녀들이 되었습니다.
  revised_footnotes:
