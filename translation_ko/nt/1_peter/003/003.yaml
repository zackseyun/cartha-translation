review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 부정 명령(ἔστω οὐχ)을 한국어의 완결된 합쇼체 명령으로 분명히 드러내고, 세 가지 외적 단장의 항목을 병렬적으로 표현하는 편이 더 정확합니다. 「차려입는」은 원문의 단순한 ‘옷을 입음’보다 꾸밈의 뉘앙스를 다소 덧붙입니다.
  naturalness: 「외적인 것이 되지 말고」는 문장 끝의 연결 표현이라 이 절만으로는 다소 미완성이고, ‘단장’이 ‘외적인 것’이 된다는 표현도 자연스럽지 않습니다. 「외적인 단장이 되어서는 안 됩니다」가 현대 표준어 합쇼체로 더 자연스럽습니다.
  terminology: κόσμος는 「단장」으로, ἐμπλοκῆς τριχῶν은 「머리를 땋는 일」으로 적절합니다. περιθέσεως χρυσίων은 자연스러운 한국어로 「금장신구를 하는 일」이라 할 수 있습니다. ἐνδύσεως ἱματίων은 해석을 더하지 않고 「옷을 입는 일」로 옮깁니다.
  issues:
  - severity: medium
    issue: 부정 명령과 절의 종결이 불분명함
    rationale: 「되지 말고」는 다음 절을 직접 연결하는 형태여서, 본문 단위로 제시될 때 원문의 ἔστω οὐχ가 지닌 명령의 완결성이 충분히 전달되지 않습니다.
  - severity: low
    issue: 「차려입는」이 원문보다 의미를 좁힘
    rationale: ἐνδύσεως ἱματίων은 ‘옷을 입음’이며, 「차려입다」는 특별히 잘 갖추어 입는다는 뉘앙스를 추가할 수 있습니다.
  - severity: low
    issue: 세 항목의 병렬 관계를 더 명료하게 할 필요
    rationale: 원문은 머리 땋기, 금 장신구 착용, 옷 입기를 외적 단장의 예로 열거합니다. 각 항목을 「일」로 병렬하면 한국어에서 그 구조가 분명해집니다.
  revised_text: 여러분의 단장은 머리를 땋는 일과 금장신구를 하는 일이나 옷을 입는 일 같은 외적인 단장이 되어서는 안 됩니다.
