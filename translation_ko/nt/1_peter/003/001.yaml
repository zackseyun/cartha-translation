review_pass:
  verdict: revise
  source_fidelity: 복종 권면과 ‘말씀에 순종하지 않는’이라는 표현은 원문의 의미를 대체로 충실히 반영합니다. 그러나 ‘얻어지게 하려는 것입니다’는 원문의 미래 수동형 κερδηθήσονται를 부자연스러운 비인칭 목적 표현으로 바꾸며, 누가 얻어지는지와 결과가 흐려집니다. 또한 ‘이는’ 뒤의 목적 구문은 헬라어의 ἵνα 절을 충분히 자연스럽게 구현하지 못합니다.
  naturalness: ‘아내 된 여러분’과 ‘말 없이’는 현대 표준어 합쇼체 성경 문체로 다소 어색합니다. ‘아내들이여’, ‘말 한마디 없이’가 더 자연스럽고, ‘얻어지게’ 대신 ‘마음을 돌이키게 될 것입니다’는 κερδαίνω의 문맥상 ‘얻다/얻어 오다’의 결과를 자연스럽게 전달합니다.
  terminology: ὑποτασσόμεναι는 본문과 앞 단락의 어휘 연속성을 고려해 ‘복종하십시오’로 유지할 수 있습니다. ἀπειθοῦσιν τῷ λόγῳ는 ‘말씀에 순종하지 않는’으로 유지하되, 복음의 말씀을 거부한다는 문맥적 의미는 각주로 보완합니다. ‘말씀’은 λόγος의 성경적 표현을 보존합니다.
  issues:
  - severity: medium
    issue: ‘얻어지게 하려는 것입니다’가 κερδηθήσονται의 의미와 문장 구조를 불명료하게 만듭니다.
    rationale: κερδηθήσονται는 말씀에 불순종하는 남편들(τινες)이 ‘얻어지는/얻음을 받는’ 결과를 나타내는 미래 수동형입니다. 현 번역은 비인칭 ‘얻어지게’와 ‘하려는 것’으로 처리하여 대상과 결과를 모호하게 하며, 한국어로도 어색합니다.
  - severity: low
    issue: ‘아내 된 여러분’ 및 ‘말 없이’의 문체가 다소 부자연스럽습니다.
    rationale: 현대 표준어 합쇼체에서는 호격 ‘아내들이여’와 관용적 표현 ‘말 한마디 없이’가 더 매끄럽습니다.
  revised_text: 아내들이여, 이와 같이 여러분의 남편에게 복종하십시오. 이는 그들 가운데 말씀에 순종하지 않는 이들이 있더라도, 아내들의 행실을 통하여 말 한마디 없이 마음을 돌이키게 하려는 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘말씀을 따르지 않는 이들’. 여기서 ‘말씀’은 복음의 말씀을 가리킵니다.
    reason: ἀπειθοῦσιν τῷ λόγῳ는 불순종과 복음 거부의 뉘앙스를 함께 가질 수 있으므로, 본문의 표현을 유지하면서 문맥적 대안을 제시합니다.
  revision_rationale: 원문의 권면, 목적, 양보의 뉘앙스(‘…이 있더라도’), 그리고 아내의 행실과 말 없는 증언의 대조를 보존했습니다. κερδηθήσονται는 한국어에서 자연스럽게 전달되도록 ‘마음을 돌이키게 될 것입니다’로 옮겼으며, 이것이 구원의 기계적 보장이나 특정 교리적 설명을 뜻하도록 확장하지 않았습니다.
