review_pass:
  verdict: revise
  source_fidelity: ‘아내 된 여러분도 마찬가지로’와 ‘자기 남편에게 복종하십시오’는 Ὁμοίως 및 ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν을 대체로 충실히 반영합니다. 그러나 ‘어떤 이’는 문맥상 아내들의 남편들을 가리키므로 관계를 드러내는 편이 정확합니다. 또한 κερδηθήσονται의 수동적 ‘얻어짐/얻음’은 구원이라는 결과를 명시하지 않은 채 ‘설득되다’로 자연스럽게 옮길 수 있습니다. 이는 ‘얻어지게 하려는 것입니다’보다 한국어 문법과 의미가 명료합니다.
  naturalness: ‘아내 된 여러분’과 특히 ‘말 없이 아내들의 행실로 말미암아 얻어지게 하려는 것입니다’는 현대 표준어 합쇼체에서 어색하고, 목적절의 주체와 대상도 불분명합니다. ‘아내인 여러분’, ‘그들이 아내들의 행실을 통하여 말 한마디 없이 설득되도록’으로 고치면 자연스럽고 원문의 목적 구조를 보존합니다.
  terminology: ‘복종하십시오’는 ὑποτάσσω의 관계적 질서를 강하게도 약하게도 만들지 않는 적절한 번역입니다. λόγος는 본문에서 ‘말씀’으로 유지하되, ἀπειθοῦσιν이 복음 메시지를 거부한다는 뜻도 낼 수 있음을 각주에 제시합니다. κερδηθήσονται는 ‘구원을 받다’로 확대하지 않고 ‘설득되다’로 번역합니다.
  issues:
  - severity: medium
    issue: ‘얻어지게 하려는 것입니다’가 κερδηθήσονται의 대상과 ἵνα 목적절의 구조를 불명료하고 비자연스럽게 처리합니다.
    rationale: 원문에서 말씀을 따르지 않는 남편들이 아내들의 행실을 통해 ‘얻어지는/설득되는’ 대상입니다. 한국어 ‘얻어지다’는 이 문맥에서 비문에 가깝고 무엇을 얻는지 오해하게 합니다.
  - severity: low
    issue: ‘어떤 이’는 아내들과의 관계가 드러나지 않습니다.
    rationale: τῶν γυναικῶν 및 앞선 ‘남편들’의 문맥에 따라, 불순종하는 이들은 해당 아내들의 남편들입니다. ‘그들 가운데’라고 하여 이를 자연스럽게 밝혀야 합니다.
  - severity: low
    issue: ‘아내 된 여러분’은 현대 문어에서 다소 부자연스럽습니다.
    rationale: ‘아내인 여러분’이 같은 뜻을 더 자연스럽고 공적인 합쇼체 문체로 전달합니다.
  revised_text: 아내인 여러분도 마찬가지로 각자의 남편에게 복종하십시오. 그들 가운데 어떤 이들이 말씀[a]에 순종하지 않는다 해도, 그들이 아내들의 행실을 통하여 말 한마디 없이 설득되도록 하십시오.
  revised_footnotes:
  - marker: a
    text: 또는 “복음의 말씀을 받아들이지 않는다.”
    reason: ἀπειθοῦσιν τῷ λόγῳ는 직역하면 ‘말씀에 순종하지 않는다’이며, 문맥상 복음의 메시지를 거부한다는 뜻도 낼 수 있다.
  revision_rationale: 명령의 대상과 목적을 분명히 하면서, 원문의 Ὁμοίως, ὑποτασσόμεναι, ἵνα, καὶ εἴ τινες, ἄνευ λόγου의 연결을 보존했습니다. ‘설득되다’는 κερδηθήσονται의 ‘얻다/얻어지다, 마음을 얻다’라는 비유를 한국어로 자연스럽게 표현하며, 본문에 없는 구원·회심의 결과를 단정적으로 보태지 않습니다.
