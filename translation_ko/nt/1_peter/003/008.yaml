  source_fidelity: 「마지막으로」는 Τὸ δὲ τέλος를 적절히 반영하지만, 「한 마음이 되고」는 현재의 요구를 변화의 과정으로 들리게 할 수 있고, 「동정심」은 συμπαθεῖς의 상호적 공감보다 일방적 연민을 뜻하기 쉽습니다. 마지막 이문에 관한 주석도 보존할 필요가 있습니다.
  naturalness: 합쇼체와 열거 구조는 대체로 자연스럽습니다. 다만 「뜻을 같이하고, 서로 공감하며」가 현대 표준어에서 더 자연스럽고 원문의 병렬적 권면을 잘 드러냅니다.
  terminology: φιλάδελφοι는 「형제자매를 사랑하고」로 공동체 안의 가족적 사랑을 자연스럽게 나타냅니다. εὔσπλαγχνοι는 「마음이 따뜻하며」로, ταπεινόφρονες는 「겸손한 마음을 품으십시오」로 옮기는 것이 적절합니다. SBLGNT 본문의 ταπεινόφρονες를 본문에 유지하고 φιλόφρονες 이문은 각주로 처리합니다.
