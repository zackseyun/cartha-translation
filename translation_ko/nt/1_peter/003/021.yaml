  revised_text: 그것에 상응하는 세례[a]가 이제 여러분도 구원합니다. 이는 육체의 더러움을 벗겨 내는 일이 아니라, 선한 양심을 위하여 하나님께 드리는 간구[b]이며, 이 구원은 예수 메시아의 부활을 통해 이루어집니다.
