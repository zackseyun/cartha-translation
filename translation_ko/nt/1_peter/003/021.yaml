revisions:
- from: 그 일에 상응하는 것 곧 세례[a]가 이제 여러분도 구원합니다. 세례는 육체의 더러움을 벗기는 일이 아니라, 선한 양심으로 하나님께 드리는 답변[b]이며, 메시아 예수의 부활하심으로 말미암습니다.
  to: 그것에 상응하는 세례[a]가 이제 여러분도 구원합니다. 이는 육체의 더러움을 벗겨 내는 일이 아니라, 선한 양심을 위하여 하나님께 드리는 간구[b]이며, 이 구원은 예수 메시아의 부활을 통해 이루어집니다.
  rationale: 세례가 구원한다는 원문의 직접적 진술을 약화하지 않았습니다. ἐπερώτημα는 εἰς θεόν의 방향성을 반영하여 본문에서는 ‘하나님께 드리는 간구’로 옮기고, 경쟁하는 해석은 각주에 유지했습니다. 마지막 전치사구가 구원에 연결됨을 한국어 문장 구조로 명확히 했으며, ἀντίτυπον 각주의 과도한 유형론적 확정을 중립적 설명으로 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:07Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 진술인 ‘세례가 이제 여러분도 구원합니다’는 보존되어야 합니다. 그러나 초안의 ‘세례는 … 답변이며, 메시아 예수의 부활하심으로 말미암습니다’는 문법적으로 부활이 ‘답변’에 걸리는 듯하며, δι’ ἀναστάσεως가 구원에 수단적으로 연결되는 원문 구조를 충분히 드러내지 못합니다. ἐπερώτημα를 본문에서 단정적으로 ‘답변’으로 택한 것도 영어 감사 기록의 선택(appeal) 및 εἰς θεόν과의 결합보다 덜 적절합니다.
  naturalness: ‘그 일에 상응하는 것 곧 세례’는 다소 번역투이지만 이해 가능합니다. 다만 ‘선한 양심으로 하나님께 드리는 답변’은 한국어에서 누가 무엇에 답변하는지 불분명하고 자연스럽지 않습니다. ‘선한 양심을 위하여 하나님께 드리는 간구’가 현대 표준어 합쇼체 문맥에서 더 자연스럽습니다.
  terminology: ‘세례’, ‘구원합니다’, ‘육체’, ‘양심’, ‘하나님’, ‘예수 메시아’는 적절합니다. Χριστός의 칭호성을 살린 ‘예수 메시아’를 유지합니다. ἐπερώτημα의 논쟁적 의미는 본문에서 ‘간구’로 번역하되, ‘약속’과 ‘응답’을 각주에 보존해야 합니다.
  issues:
  - severity: high
    issue: 마지막 구절의 통사적 연결이 불명확합니다.
    rationale: δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ는 세례가 구원하는 방식/수단에 연결됩니다. 초안은 ‘세례는 … 답변이며, 메시아 예수의 부활하심으로 말미암습니다’라고 하여 부활의 수식 대상이 불분명합니다.
  - severity: medium
    issue: ἐπερώτημα를 ‘답변’으로 단정한 본문 번역이 방향성 εἰς θεόν 및 영어 POB의 ‘appeal’ 선택과 잘 맞지 않습니다.
    rationale: 이 명사는 간구·요청, 약속·서약, 응답 등으로 논쟁되어 왔습니다. εἰς θεόν과 함께 ‘하나님께 드리는 간구’가 본문상 무리 없이 자연스러우며, 다른 가능성은 각주로 남겨야 합니다.
  - severity: medium
    issue: 각주 a가 대응 관계를 지나치게 확정하고 ‘대응형’을 기술 용어처럼 제시합니다.
