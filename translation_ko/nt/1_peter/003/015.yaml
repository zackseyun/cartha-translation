  to: 그러나 여러분의 마음속에서 메시아를 주님으로 거룩히 여기고[a], 여러분 안에 있는 소망에 관하여 설명을 요구하는 모든 사람에게 변론할 준비를 항상 갖추십시오,
  rationale: ‘오직’을 문맥상 더 적절한 ‘그러나’로 조정하고, ‘메시아를 주님으로 거룩히 여기다’로 원문의 보어 관계와 ἁγιάσατε의 의미를 명료하게 했습니다. 또한 ‘소망에 관하여 설명을 요구하는’으로 λόγον의 내용을 보완하고, ‘변론할 준비’로 ἀπολογία의 설명·변호적 성격을 보존했습니다. 각주는 본문의 가능한 이사야 인유만 언급하고 논쟁 가능한 그리스도론적 결론은 단정하지 않도록 수정했습니다.
