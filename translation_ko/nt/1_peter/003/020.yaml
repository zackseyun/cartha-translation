  to: 그 영들은 전에 순종하지 않았던 자들입니다. 노아의 시대에 방주가 준비되고 있을 때, 하나님의 오래 참으심이 기다리고 계셨습니다. 그 방주 안으로 들어간 적은 수, 곧 여덟 사람[a]은 물을 통하여 안전하게 보존되었습니다[b].
