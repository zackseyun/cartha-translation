review_pass:
  verdict: revise
  source_fidelity: 첫 두 대조와 ‘도리어 축복하라’는 권면은 원문의 의미를 잘 반영합니다. 그러나 후반부의 ‘이는 … 까닭이며, 또한 … 하려는 것입니다’는 ὅτι의 이유와 ἵνα의 목적을 한국어에서 다소 불분명하게 만들며, ‘복을 유업으로 받게 하려는’ 주체도 불명확합니다. 이를 명시적으로 구분하는 것이 안전합니다.
  naturalness: ‘악을 악으로 갚지 말고 욕을 욕으로 갚지 마십시오’와 ‘도리어 축복하십시오’는 현대 표준어 합쇼체로 자연스럽습니다. 후반부는 두 절로 나누어 인과와 목적을 드러내면 더 명료하고 자연스럽습니다.
  terminology: ‘욕’은 λοιδορία의 모욕적·비방적 말을 간결하게 옮기며 문맥에 적절합니다. ‘축복하십시오’는 εὐλογοῦντες의 간결한 표현을 보존합니다. ‘복을 유업으로 받다’는 κληρονομέω의 상속·유업 이미지를 유지하므로 적절합니다.
  issues:
  - severity: medium
    issue: 후반부의 인과·목적 관계와 목적절의 주체가 불명확함
    rationale: ὅτι는 ‘여러분이 이를 위하여 부르심을 받았기 때문’이라는 근거를, ἵνα는 ‘여러분이 복을 유업으로 받게 하려는’ 목적을 나타냅니다. 현 번역의 ‘이는 … 까닭이며, 또한’은 이 관계를 흐리며, ‘하려는 것입니다’의 주체를 드러내지 않습니다.
