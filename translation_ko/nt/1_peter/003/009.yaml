  to: 악을 악으로 갚지 말고 욕을 욕으로 갚지 마십시오. 도리어 축복하십시오. 여러분은 이를 위하여 부르심을 받았습니다. 이는 여러분이 복을 유업으로 받게 하려는 것입니다.
