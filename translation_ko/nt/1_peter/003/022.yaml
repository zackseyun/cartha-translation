  terminology: 「하나님의 오른편」은 성서적 관용구를 보존하며, 「천사들, 권세들, 능력들」은 ἀγγέλων, ἐξουσιῶν, δυνάμεων의 구별을 유지합니다. 「복종하게 되었습니다」는 ὑποταγέντων의 수동적이고 완료된 종속 의미를 무리 없이 전달합니다.
