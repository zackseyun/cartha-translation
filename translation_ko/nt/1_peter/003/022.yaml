  source_fidelity: 원문의 주절은 그리스도께서 ‘하나님의 오른편에 계신다’는 사실이며, ‘하늘에 들어가신’ 것은 이에 앞선 부정과거 분사입니다. 초안의 의미는 대체로 맞지만, ‘하늘로 가셔서 … 계시며’는 원문의 주절 중심과 ‘εἰς οὐρανόν’의 진입 방향을 다소 약화합니다. ‘하늘에 들어가신 후’로 옮기면 이를 더 충실히 반영합니다. 마지막 절의 ‘복종하게 되었습니다’는 수동적 결과를 자연스럽게 전달합니다.
  naturalness: ‘하늘에 들어가신 후 하나님의 오른편에 계시며’는 현대 표준어 합쇼체 문체에서 자연스럽고, 분사와 주절의 시간 관계도 명료합니다. ‘하나님의 오른편’은 한국어 성서 문체에 정착된 표현입니다.
  terminology: ‘하나님의 오른편’, ‘천사들’, ‘권세들’, ‘능력들’, ‘복종하다’는 본문의 정형적·신학적 어휘를 불필요하게 해석하지 않고 유지합니다. 권세들과 능력들의 정체나 도덕적 성격을 특정하지 않았습니다.
  issues:
  - severity: low
    issue: ‘하늘로 가셔서’는 εἰς οὐρανόν의 방향성과 분사의 선행 동작을 충분히 드러내지 못할 수 있습니다.
    rationale: ‘하늘에 들어가신 후’는 ‘into heaven’ 및 주절 ‘is at the right hand of God’와의 시간적 관계를 더 직접적으로 반영합니다.
  revised_text: 그분은 하늘에 들어가신 후 하나님의 오른편에 계시며, 천사들과 권세들과 능력들이 그분께 복종하게 되었습니다.
  revised_footnotes:
