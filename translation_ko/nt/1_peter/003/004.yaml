  source_fidelity: 현 초안은 원문의 대조 구조와 핵심 어휘를 대체로 반영하지만, 원문에 없는 명령형 「단장하십시오」를 넣었고, 「마음에 감춰진 사람으로, 곧 … 아름다움으로」는 숨은 사람과 아름다움을 동격으로 처리하여 원문의 문법적 관계를 흐립니다. 「아름다움」은 앞 절의 꾸밈과의 대조에서 보충 가능한 말이나, 각주로 밝혀야 합니다.
  naturalness: 「마음에 감춰진 사람」은 한국어에서 다소 부자연스럽고 실제로 숨겨 둔 사람을 연상시킬 수 있습니다. 「마음의 숨은 사람」은 성경적 문체를 유지하면서도 내면의 사람이라는 뜻을 더 잘 전달합니다. 절 단위로 자연스러운 한국어 문장을 이루도록 「…단장하는 것이」로 연결했습니다.
  terminology: 「온유한」은 πραΰς에 적절하며, ἡσύχιος는 침묵의 명령으로 오해되지 않도록 「고요한」으로 옮겼습니다. πνεῦμα는 「영」으로 유지했습니다. ἀφθάρτῳ는 「썩지 않는」, πολυτελές는 「매우 귀한」으로 옮겨 가치의 강조를 보존했습니다.
