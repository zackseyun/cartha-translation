    rationale: 한국어에서는 물리적으로 감춰진 사람처럼 들릴 수 있습니다. 「마음의 숨은 사람」이 κρυπτὸς τῆς καρδίας ἄνθρωπος의 비유적 내면성을 더 자연스럽게 보존합니다.
