  source_fidelity: 원문은 동사 없이 앞 절의 ‘단장’ 대조를 이어 가며, ‘마음에 감추어진 사람’과 ‘온유하고 조용한 영의 썩지 않는 [아름다움]’을 제시합니다. 초안의 ‘사람으로 … 아름다움으로 단장하십시오’는 두 개의 ‘-으로’가 병렬되어 문장 관계가 불명확하고, ‘사람으로 단장하다’라는 표현도 원문의 관계를 적절히 드러내지 못합니다.
  naturalness: ‘감춰진’보다 ‘감추어진’이 이 문맥에서 더 자연스럽고, ‘썩지 아니하는’은 문어적이어서 현대 표준어로는 ‘썩지 않는’이 더 매끄럽습니다. 원문의 생략된 명사를 보충한 ‘아름다움’은 각주로 밝혀야 합니다.
  terminology: ‘온유하고 조용한 영’, ‘하나님 앞에서’, ‘매우 값진’은 원문의 핵심 어휘와 현대 합쇼체에 잘 부합합니다. ἡσύχιος의 ‘조용한’은 침묵 강요가 아니라 평온한 성품을 가리킬 수 있음을 각주로 명확히 합니다.
