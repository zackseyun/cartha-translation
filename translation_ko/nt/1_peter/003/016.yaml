  source_fidelity: 그리스어는 앞 절의 ‘변증하다’에 이어지는 분사구문입니다. 초안의 ‘그리하며’는 앞 절의 내용을 보충해 가리키므로 본문에 없는 지시어를 더하며, φόβος를 ‘하나님에 대한 두려움’으로 단정한 해설은 본문의 의도적 개방성을 넘습니다. 또한 ἵνα 목적절은 ‘이는 … 하려는 것입니다’보다 ‘그리하여 … 하게 하려는 것입니다’로 옮기는 편이 구조를 더 충실히 드러냅니다.
  naturalness: ‘메시아 안의 여러분의 선한 행실’은 수식 관계가 다소 부자연스럽습니다. ‘메시아 안에서 살아가는 여러분의 선한 행실’로 하면 ἐν Χριστῷ의 범위를 자연스럽게 연결하면서도 뜻을 과도하게 보충하지 않습니다. ‘비방당하는 일’도 ‘비방을 받는 일’이 현대 한국어에 더 자연스럽습니다.
  terminology: ‘온유함’, ‘두려움’, ‘선한 양심’, ‘비방’, ‘메시아’, ‘선한 행실’은 적절합니다. φόβος의 대상은 확정하지 않고, ‘경외함’과 ‘존중함’을 각주로 제시합니다. Χριστῷ는 정책에 따라 ‘메시아’로 유지하고 전통적 표현 ‘그리스도 안에서’를 각주로 둡니다.
