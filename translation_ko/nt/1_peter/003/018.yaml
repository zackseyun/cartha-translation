  rationale: 본문비평 각주를 SBLGNT 본문과 이문에 맞게 바로잡고, πνεύματι의 해석상 모호성을 보존하는 대안 각주를 추가했습니다. 또한 한국어 문장을 자연스럽게 다듬되, ‘의로운 분/의롭지 못한 자들’, ‘육체/영’의 대조와 하나님께 인도하려는 목적을 유지했습니다.
