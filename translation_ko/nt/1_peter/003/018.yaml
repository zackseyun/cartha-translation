  source_fidelity: 본문은 대체로 SBLGNT의 의미를 충실히 옮깁니다. 그러나 본문이 ἔπαθεν(‘고난을 받으셨다’)을 채택했는데도 각주 a가 사본 읽기를 반대로 설명하여 본문비평 정보가 사실과 다릅니다. 또한 πνεύματι의 여격이 지닌 ‘영으로/성령에 의해’의 모호성은 별도 각주로 보존하는 것이 영어 POB 감사 기록 및 원문의 불확정성에 더 충실합니다.
  naturalness: ‘곧 … 그러하셨습니다’는 현대 표준 한국어 합쇼체에서 다소 지시 대상이 불분명하고 문장이 경직됩니다. ‘의로운 분께서 … 고난을 받으신 것은’으로 명시하면 자연스럽고 원문의 대조와 목적절 관계도 분명해집니다.
  terminology: ‘메시아’, ‘단번에’, ‘육체’, ‘영’은 원문의 핵심 용어와 프로젝트의 선택을 적절히 반영합니다. ‘영’은 성령으로 단정하지 않아 πνεύματι의 해석상 모호성을 보존합니다.
  issues:
  - severity: high
    issue: 각주 a가 본문비평 읽기를 반대로 기술합니다.
    rationale: SBLGNT 본문은 ἔπαθεν(‘고난을 받으셨다’)이며, 일부 사본의 이문은 ἀπέθανεν(‘죽으셨다’)입니다. 현 각주는 일부 사본이 ‘고난당하셨다’로 읽는다고 하여 본문과 이문을 뒤바꿉니다.
