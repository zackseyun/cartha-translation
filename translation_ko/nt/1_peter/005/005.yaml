review_pass:
  verdict: revise
  source_fidelity: 「젊은 사람들」은 헬라어 남성 복수 호격 νεώτεροι의 성별 표지를 충분히 보존하지 못합니다. 또한 「서로에게 겸손을 두르십시오」는 겸손을 상대방에게 입히는 듯한 결합으로 읽힐 수 있으므로, ἀλλήλοις가 수식하는 상호 관계를 더 분명히 나타낼 필요가 있습니다. 나머지 내용, 특히 장로를 교회 장로로 이해한 점과 하나님의 교만한 자들에 대한 대적 및 겸손한 자들에게 주시는 은혜의 대조는 원문에 충실합니다.
  naturalness: 현대 합쇼체로 「젊은 남자들은 마찬가지로 장로들에게 복종하십시오」와 「서로를 대할 때 겸손을 두르십시오」가 자연스럽습니다. 인용의 근거를 「이는 하나님께서 … 때문입니다」로 연결하면 문장 구조도 매끄럽습니다.
  terminology: πρεσβυτέροις는 직전 문맥(5:1–4)의 교회 지도자들을 가리키므로 「장로들」이 적절합니다. ὑποτάγητε는 문맥상 「복종하십시오」로 유지할 수 있습니다. ταπεινοφροσύνη와 ἐγκομβώσασθε의 의복 비유는 「겸손을 두르십시오」로 유지하되, 상호성을 「서로를 대할 때」로 명시했습니다. 「은혜를 베푸십니다」는 δίδωσιν χάριν을 자연스러운 한국어 존대 문체로 옮긴 것입니다.
  issues:
  - severity: medium
    issue: 「젊은 사람들」이 νεώτεροι의 남성 복수 표지를 중화함
    rationale: 원문은 남성 복수 호격이며, 영어 감사 기록도 이를 ‘you younger men’으로 보존합니다. 한국어에서는 「젊은 남자들」로 옮기는 것이 가능한 범위에서 이를 더 충실히 반영합니다.
  - severity: medium
    issue: 「서로에게 겸손을 두르십시오」의 수식 관계가 불명확함
    rationale: ἀλλήλοις는 겸손을 입는 행위의 상호·대인 관계적 방향을 나타냅니다. 현 문구는 겸손을 서로에게 입힌다는 뜻으로 오해될 수 있어 「서로를 대할 때」로 풀어 주는 편이 명료합니다.
