- from: 믿음에 굳게 서서 그를 대적하십시오. 세상에 있는 여러분의 형제자매들도 동일한 고난들을 겪고 있음을 알기 때문입니다.
  to: 믿음에 굳게 서서 그를 대적하십시오. 세상에 있는 여러분의 형제자매들도 같은 고난을 겪고 있음을 아십시오.[a]
