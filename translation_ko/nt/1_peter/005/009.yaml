review_pass:
  verdict: revise
  source_fidelity: The imperative and the call to be firm in faith are conveyed accurately. However, rendering εἰδότες as "알기 때문입니다" makes the clause explicitly causal and turns the verse into two disconnected Korean sentences. The participle is better retained as an accompanying exhortation, "…을 아십시오." The plural expression τὰ αὐτὰ τῶν παθημάτων is naturally represented by "같은 고난."
  naturalness: '"동일한 고난들을" is understandable but stiff in contemporary formal Korean; "같은 고난" is more idiomatic. "아십시오" gives the concluding participial clause a clear, natural relation to the preceding imperative.'
  terminology: '"그를 대적하십시오" appropriately renders the referent carried over from verse 8 and the force of ἀντίστητε. "믿음에 굳게 서서" is apt. "형제자매들" is an acceptable inclusive Korean rendering of ἀδελφότης, provided a note identifies it as the community of fellow believers rather than biological siblings.'
  issues:
  - severity: medium
    issue: The phrase "알기 때문입니다" over-specifies εἰδότες as a causal statement and produces an awkward sentence division.
    rationale: The Greek participle can carry a supporting/basis nuance, but it does not require an explicit Korean "because." "…을 아십시오" preserves the exhortatory connection without deciding the participle's precise nuance.
  - severity: low
    issue: '"동일한 고난들을" is unnecessarily formal and heavy.'
    rationale: '"같은 고난" is standard modern Korean and adequately conveys the Greek idiom without suggesting that every event is numerically identical.'
  revised_text: 믿음에 굳게 서서 그를 대적하십시오. 세상에 있는 여러분의 형제자매들도 같은 고난을 겪고 있음을 아십시오.[a]
  revised_footnotes:
  - marker: a
    text: '"형제자매들"은 생물학적 형제자매만이 아니라, 세상에 있는 모든 믿는 이들의 공동체를 가리킵니다.'
    reason: cultural_note
  revision_rationale: The revision preserves the Greek imperative-plus-participle structure more closely, improves modern Korean idiom, and clarifies the collective sense of ἀδελφότης without imposing a denominational interpretation.
