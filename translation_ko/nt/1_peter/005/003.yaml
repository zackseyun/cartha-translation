    reason: lexical_alternative
lexical_decisions:
- source_word: κατακυριεύοντες
  english_pob_choice: domineering
  chosen_korean: 주관하려 들지
  alternatives_korean:
  - 군림하지
  - 다스리려 하지
  lexicon: BDAG
  rationale: κατακυριεύω의 「위에서 강압적으로 주관함」을 「주관하려 들다」로 옮겨 부정적 강도 살림 (마 20:25과 동일 어휘).
- source_word: τῶν κλήρων
  english_pob_choice: those allotted to your care
  chosen_korean: 맡겨진 자들
  alternatives_korean:
  - 분담받은 자들
  - 맡은 자들
  lexicon: BDAG
  rationale: κλῆρος는 「제비뽑힌 분깃·할당된 부분」. 여기서는 「장로에게 맡겨진 신자들」을 가리키므로 「맡겨진 자들」로 옮긴다.
- source_word: τύποι γινόμενοι τοῦ ποιμνίου
  english_pob_choice: becoming examples to the flock
  chosen_korean: 양 무리에게 본이 되십시오
  alternatives_korean:
  - 양떼의 모범이 되십시오
  - 양들에게 본보기가 되십시오
  lexicon: BDAG
  rationale: τύπος의 「본·모형」을 한국 성서 전통의 「본」으로 옮긴다.
