revisions:
- from: 바벨론[a]에 있는, 여러분과 함께 택하심을 받은 자가 여러분에게 안부를 전합니다. 또한 내 아들 마가도 그러합니다.
  to: 바벨론[a]에 있는, 여러분과 함께 택하심을 받은 분[b]이 여러분에게 문안합니다. 내 아들[c] 마가도 여러분에게 문안합니다.
  rationale: 본문은 원문의 미완결 여성 단수 표현을 해석으로 채우지 않고 ‘분’으로 유지했습니다. 바벨론을 로마로 바꾸지 않았고, 마가에 대한 문안 동작을 명시적으로 반복했습니다. 각주는 바벨론의 상징적 이해, συνεκλεκτή의 암시된 명사, ‘내 아들’의 관계를 각각 분리하여 설명하며 어느 하나를 본문 의미로 단정하지 않습니다.
  reviewer_model: gpt-5.6-terra
