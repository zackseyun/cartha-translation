reference: 1 Peter 5:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon, chosen together with you, greets you, and so does Mark, my son.
translation:
  language: ko
  text: 바벨론[a]에 있는, 여러분과 함께 택하심을 받은 분[b]이 여러분에게 문안합니다. 내 아들[c] 마가도 여러분에게 문안합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「바벨론」은 본문에 쓰인 지명입니다. 초기 그리스도교 문헌의 용례에 비추어 로마를 가리키는 상징적 표현으로 이해하는 견해가 있으나, 본문 자체는 이를 명시하지 않습니다.
    reason: cultural_note
  - marker: b
    text: 그리스어는 여성 단수 표현을 쓰지만 그 명사를 밝히지 않습니다. 이를 바벨론에 있는 교회로 이해하는 견해가 있으나, 특정 여성이나 다른 대상을 가리킬 가능성도 논의됩니다.
    reason: alternative_reading
  - marker: c
    text: 「내 아들」은 영적 관계를 나타내는 표현일 수 있으나, 본문은 관계의 성격을 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαβυλῶνι
  english_pob_choice: Babylon
  chosen_korean: 바벨론
  alternatives_korean: []
  lexicon: BDAG
  rationale: 정착된 표기.
- source_word: ἡ ... συνεκλεκτὴ
  english_pob_choice: She who is ... chosen together with you
  chosen_korean: 여러분과 함께 택하심을 받은 자
  alternatives_korean:
  - 너희와 함께 택하심을 입은 여자
  - 함께 선택된 자매 (교회)
  lexicon: BDAG
  rationale: 여성 단수 분사. 베드로의 아내 또는 로마 교회 공동체(의인화)로 해석됨. 본문은 어느 쪽도 닫지 않고 「여러분과 함께 택하심을 받은 자」로 옮긴다.
- source_word: Μᾶρκος ὁ υἱός μου
  english_pob_choice: Mark, my son
  chosen_korean: 내 아들 마가
  alternatives_korean:
  - 나의 아들 마르코
  lexicon: BDAG
  rationale: 「마가」는 정착된 표기. 「아들」은 영적 자녀의 의미.
