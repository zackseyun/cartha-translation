revisions:
- from: 그러므로 나는 여러분 가운데 있는 장로들에게, 동료 장로요 메시아의 고난들의 증인이며 장차 나타날 영광에 함께 참여할 자로서 권합니다.
  to: 그러므로 여러분 가운데 있는 장로들에게, 나 역시 동료 장로이며 메시아의 고난의 증인이고 장차 드러날 영광의 동참자로서 권합니다.
  rationale: 원문의 호소 동사 παρακαλῶ와 화자의 세 가지 자기 규정(동료 장로, 메시아의 고난의 증인, 장차 드러날 영광의 동참자)을 유지했습니다. 단, 한국어 관용에 맞게 복수형 ‘고난들’을 집합적 단수로 다듬고, 영광의 미래적 드러남과 참여 관계를 더 명료하게 표현했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:02Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 문장 구조는 대체로 충실합니다. 다만 τῆς μελλούσης ἀποκαλύπτεσθαι δόξης의 수동적 ‘드러남’과 κοινωνός의 명사적 관계를 더 직접적으로 반영할 수 있습니다.
  naturalness: ‘메시아의 고난들의 증인’은 복수형을 기계적으로 드러낸 표현이라 현대 한국어에서 부자연스럽습니다. ‘메시아의 고난의 증인’은 집합적 의미를 자연스럽게 전달합니다. ‘장차 나타날 영광에 함께 참여할 자’도 뜻은 통하지만, ‘영광의 동참자’가 더 간결하고 자연스럽습니다.
  terminology: ‘장로’, ‘메시아’, ‘증인’은 문맥과 프로젝트의 용어 원칙에 적절합니다. ‘동료 장로’는 συμπρεσβύτερος의 연대적 의미를 잘 보존합니다.
  issues:
  - severity: low
    issue: ‘고난들의’라는 복수 표지가 부자연스럽습니다.
    rationale: πάθημα의 복수는 그리스어에서 그 고난들의 여러 국면을 가리키지만, 한국어에서는 ‘고난’의 집합적 단수로 자연스럽게 옮기는 것이 의미 손실 없이 더 관용적입니다.
  - severity: low
    issue: ‘장차 나타날 영광에 함께 참여할 자’는 다소 장황하며 ἀποκαλύπτεσθαι의 ‘드러남’ 뉘앙스가 약합니다.
    rationale: ‘장차 드러날 영광의 동참자’는 수동적 계시/드러남과 κοινωνός의 참여 관계를 더 직접적이고 자연스럽게 전달합니다.
  revised_text: 그러므로 여러분 가운데 있는 장로들에게, 나 역시 동료 장로이며 메시아의 고난의 증인이고 장차 드러날 영광의 동참자로서 권합니다.
