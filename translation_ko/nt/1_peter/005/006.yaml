- source_word: ἐν καιρῷ
  english_pob_choice: at the proper time
  chosen_korean: 때가 되면
  alternatives_korean:
  - 적절한 때에
  - 그분의 때에
  lexicon: BDAG
  rationale: καιρός의 결정적 시점을 「때가 되면」으로 자연스럽게 옮긴다.
