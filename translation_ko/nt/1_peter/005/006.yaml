review_pass:
  verdict: revise
  source_fidelity: Ταπεινώθητε is appropriately rendered with reflexive force as ‘자신을 낮추십시오,’ and ‘하나님의 강하신 손 아래에서’ faithfully retains the biblical metaphor. However, ‘이는 그분이 때가 되면 여러분을 높여 주시려는 것입니다’ turns the ἵνα purpose clause into an explanatory nominal statement and is less natural Korean. A purpose-oriented construction is needed. ‘알맞은 때에’ more clearly represents ἐν καιρῷ as a fitting/appointed time.
  naturalness: The revised wording uses modern formal-polite Korean and makes the relation between the command and God’s subsequent exaltation clear without the awkward ‘이는 ... 것입니다’ construction.
  terminology: ‘하나님의 강하신 손’ is a sound, recognizable rendering of κραταιὰ χείρ. ‘높여 주시다’ naturally conveys God’s exaltation of the humble. A footnote is supplied at the imperative to preserve the Greek passive-form ambiguity reflected in the English audit trail.
  issues:
  - severity: medium
    issue: The clause ‘이는 그분이 때가 되면 여러분을 높여 주시려는 것입니다’ does not naturally render ἵνα.
    rationale: ἵνα introduces the intended result/purpose of humbling oneself under God’s hand. The draft’s ‘이는 ... 것입니다’ recasts it as an explanation and produces an awkward Korean sentence.
  - severity: low
    issue: No footnote preserves the passive-form alternative of Ταπεινώθητε.
    rationale: Although the reflexive Korean rendering is idiomatic and defensible, the supplied audit trail identifies a meaningful grammatical alternative that can be retained without burdening the text.
