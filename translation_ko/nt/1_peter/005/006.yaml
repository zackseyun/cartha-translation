  rationale: 부정 과거 수동 명령. 「자신을 낮추다」로 옮긴다 (눅 14:11; 마 23:12과 통일).
- source_word: τὴν κραταιὰν χεῖρα τοῦ θεοῦ
  english_pob_choice: the mighty hand of God
  chosen_korean: 하나님의 강하신 손
  alternatives_korean:
