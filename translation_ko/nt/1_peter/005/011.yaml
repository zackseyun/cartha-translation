  source_fidelity: 「권능」도 κράτος의 가능한 뜻이지만, 이 송영에서는 하나님께 속한 통치 권세를 가리키므로 「권세」가 더 정확합니다. 또한 「…하기를 빕니다」는 원문에 없는 화자의 기원 행위를 덧붙입니다. 원문의 무동사 송영은 한국어에서 최소한의 서술어로 보완할 수 있습니다.
  naturalness: 「그분께 권세가 영원히 있습니다. 아멘.」은 현대 표준 한국어의 합쇼체로 자연스럽고, 송영의 간결한 문체를 유지합니다. 「영원무궁하기를 빕니다」보다 현대적이며 불필요한 1인칭 기원 뉘앙스가 없습니다.
  terminology: κράτος는 여기서 단순한 능력보다 주권적 권세/통치권의 뜻이 두드러지므로 「권세」를 선택했습니다. εἰς τοὺς αἰῶνας τῶν αἰώνων은 「영원히」로 관용적으로 옮겨 지속성과 강조를 전달합니다. 「아멘」은 유지합니다.
