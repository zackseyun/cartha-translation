review_pass:
  verdict: revise
  source_fidelity: ‘써 보냈습니다’는 γράφω(‘쓰다’)에 ‘보내다’라는 뜻을 더하므로, 본문에서는 ‘썼습니다’가 더 정확합니다. 또한 ‘이로써’는 ταύτην/‘이것’이 가리키는 범위를 번역자가 다소 좁힐 수 있어, 지시어를 유지하는 편이 낫습니다. 마지막 명령은 SBLGNT의 στῆτε를 따라 유지하되, 사본 이문은 각주로 밝혀야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하며, ‘간략히 … 썼습니다’, ‘권면하고 또 … 증언합니다’는 편지 맺음말의 문체와 참여구문의 기능을 자연스럽게 드러냅니다.
  terminology: Σιλουανός는 ‘실루아노’, πιστός ἀδελφός는 ‘신실한 형제’, χάρις τοῦ θεοῦ는 ‘하나님의 참된 은혜’로 옮겨 원문의 명칭과 신학 용어를 보존했습니다. ‘그 은혜 안에’는 여성 관계대명사의 선행사인 ‘은혜’를 한국어에서 명확히 합니다.
  issues:
  - severity: medium
    issue: ‘써 보냈습니다’가 원문의 γράφω에 ‘보내다’의 의미를 추가합니다.
    rationale: διά Σιλουανοῦ는 실루아노의 매개·수단을 나타내지만, 그의 역할을 편지 전달자로 단정하거나 γράφω를 ‘보내다’로 번역하지 않습니다.
  - severity: low
    issue: ‘이로써’는 ταύτην(‘이것’)의 지시 범위를 다소 특정합니다.
    rationale: 원문은 편지의 내용, 권면, 증언과 관련된 ‘이것’의 범위를 열어 둡니다. ‘이것이’로 보존하는 것이 더 충실합니다.
  - severity: medium
    issue: 최종 절의 사본 이문에 대한 각주가 없습니다.
    rationale: SBLGNT 본문은 명령법 ‘굳게 서십시오’이지만, 일부 사본은 ‘여러분이 서 있습니다’라는 직설법 계열을 지지합니다. 이문을 각주로 표시해야 합니다.
  revised_text: 내가 신실한 형제로 여기는 실루아노를 통하여 여러분에게 간략히 썼습니다. 권면하고 또 이것이 하나님의 참된 은혜임을 증언합니다. 그 은혜 안에 굳게 서십시오[a].
  revised_footnotes:
