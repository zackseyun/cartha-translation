  to: 내가 신실한 형제로 여기는 실루아노를 통하여 여러분에게 간략히 썼습니다. 권면하고 또 이것이 하나님의 참된 은혜임을 증언합니다. 그 은혜 안에 굳게 서십시오[a].
  rationale: 원문의 γράφω를 ‘썼습니다’로 정확히 옮기고, 지시어의 열린 범위를 ‘이것’으로 보존했습니다. 마지막 절은 비평 본문의 명령법을 번역하되, 의미 있는 사본 이문을 각주에 제시했습니다.
