review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 네 미래동사의 연쇄는 대체로 충실합니다. 다만 「온전케」는 현대 표준어 합쇼체의 자연스러운 문체와 맞지 않으며, θεμελιώσει의 기초 비유는 「견고하게 하시고」만으로는 충분히 드러나지 않습니다. 「고난당한」보다 「고난을 겪은」이 자연스럽습니다.
  naturalness: 「자신의 영원한 영광으로」는 하나님을 가리키는 소유 표현으로 가능하나, 문장 전체는 관계절의 주어를 명시하고 현대적인 동사를 사용하면 더 명료하고 자연스럽습니다. 「온전케 하시고」는 구어적·현대적 표준 문체에서는 「온전하게 하시고」 또는 문맥상 「회복시키시고」가 적절합니다.
  terminology: 「모든 은혜의 하나님」, 「메시아 안에서」는 적절합니다. καταρτίσει는 고난 뒤의 회복이라는 문맥을 살려 「회복시키시고」로 옮기되, 대안 의미를 각주로 보완합니다. θεμελιώσει는 「견고한 기초 위에 세우시고」로 번역하여 기초 이미지를 보존합니다.
  issues:
  - severity: medium
    issue: 「온전케 하시고」는 현대 표준어 합쇼체에 맞지 않는 축약·고풍 표현입니다.
    rationale: 요청된 목표 문체가 현대적 합쇼체이므로 「온전하게 하시고」 또는 문맥에 맞는 「회복시키시고」가 필요합니다.
  - severity: medium
    issue: 「견고하게 하시고」는 θεμελιώσει의 기초/토대 비유를 명시하지 못합니다.
    rationale: 앞선 στηρίξει와 의미가 겹치며, 원문의 네 번째 동사가 지닌 foundation imagery를 보존할 필요가 있습니다.
  - severity: low
    issue: 「고난당한」은 이 문맥에서 다소 부자연스럽습니다.
    rationale: παθόντας는 한국어에서 「고난을 겪은」으로 옮기는 편이 자연스럽고 의미도 충실합니다.
  revised_text: 모든 은혜의 하나님, 곧 메시아 안에서 여러분을 자신의 영원한 영광으로 부르신 그분께서, 여러분이 잠시 고난을 겪은 뒤에 친히 여러분을 회복시키시고, 굳게 세우시고, 강하게 하시고, 견고한 기초 위에 세우실 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘그리스도 안에서’. 그리스어 칭호 Χριστός는 ‘메시아’ 또는 전통적으로 ‘그리스도’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘온전하게 하시고’ 또는 ‘완전하게 하시고’. 이 동사에는 손상된 것을 본래의 온전한 상태로 회복한다는 뜻이 포함됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘기초를 놓으시고’ 또는 ‘기초를 굳게 하시고’. 그리스어는 기초의 비유를 사용합니다.
    reason: lexical_alternative
  revision_rationale: 현대 표준어 합쇼체에 맞게 고풍스러운 「온전케」를 「회복시키시고」로 고치고, 해당 어휘의 ‘온전하게 하다’라는 대안은 각주에 남겼습니다. 마지막 동사는 원문의 기초 비유를 보존하도록 「견고한 기초 위에 세우시고」로 고쳤습니다. 메시아라는 칭호 번역과 εἰς의 목표 방향을 나타내는 「영원한 영광으로」는 유지했습니다.
