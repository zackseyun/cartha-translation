review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the address to 'the God of all grace,' the calling to eternal glory in Messiah, the limited duration of suffering, the emphatic divine action, and the sequence of four future verbs. However, '견고하게 하시고' for θεμελιώσει does not adequately retain the verb's foundation imagery and is semantically too close to the preceding verbs.
  naturalness: The overall sentence is clear and appropriately formal-polite. '온전케 하시고' is now archaic/marked; '온전하게 하시고' is the natural modern standard form. '잠시 고난을 겪은 뒤에' is also more idiomatic than '잠시 고난당한 후에.'
  terminology: '''모든 은혜의 하나님'' and ''메시아 안에서'' are appropriate and preserve the source and the English audit trail without importing doctrinal interpretation. ''자신의 영원한 영광'' naturally refers to God in this construction.'
  issues:
  - severity: medium
    issue: θεμελιώσει is rendered '견고하게 하시고.'
    rationale: θεμελιόω specifically carries the image of founding or providing a firm foundation. The proposed rendering preserves that image while retaining the fourfold verbal cadence.
  - severity: low
    issue: The expression '온전케 하시고' is dated.
    rationale: Modern standard Korean normally uses '온전하게 하시고'; this is a stylistic modernization with no change in meaning.
  revised_text: 모든 은혜의 하나님, 곧 메시아 안에서 여러분을 자신의 영원한 영광으로 부르신 분께서, 여러분이 잠시 고난을 겪은 뒤에 친히 여러분을 온전하게 하시고, 굳게 세우시고, 강하게 하시고, 기초를 굳게 하실 것입니다.
  revised_footnotes: []
  revision_rationale: Modernized the dated connective form and revised the final verb to retain θεμελιώσει의 기초·토대 이미지를 살렸습니다. Other wording, including '메시아 안에서' and '영원한 영광으로,' is retained because it faithfully reflects the source and preserves the audit trail's interpretive restraint.
