  lexicon: BDAG
  rationale: 1:4의 ἀμάραντον(시들지 아니하는)과 어휘 일관성. στέφανος는 한국 성서 전통의 「면류관」.
- source_word: κομιεῖσθε
  english_pob_choice: you will receive
  chosen_korean: 받게 됩니다
