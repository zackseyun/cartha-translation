    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἀρχιποίμενος
  english_pob_choice: the Chief Shepherd
  chosen_korean: 목자장
  alternatives_korean:
  - 으뜸 목자
  - 큰 목자
  lexicon: BDAG
  rationale: 한국 성서 전통의 「목자장」 채택. 2:25의 ποιμήν(목자)과 어근 동일.
- source_word: τὸν ἀμαράντινον τῆς δόξης στέφανον
  english_pob_choice: the unfading crown of glory
  chosen_korean: 시들지 아니하는 영광의 면류관
