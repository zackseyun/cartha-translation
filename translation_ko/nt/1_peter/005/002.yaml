  source_fidelity: ποιμάνατε의 목자/양 떼 비유와 ἐπισκοποῦντες의 돌봄·감독 행위는 살려야 합니다. 현 번역의 「감독하기를」은 문법적으로 부자연스럽고, 「하나님의 뜻을 따라」는 κατὰ θεόν의 가능한 해석이지만 본문의 압축된 표현을 단정적으로 해석합니다. 또한 「기꺼이」는 앞의 자원성과 뒤의 적극성을 구별하지 못합니다.
  naturalness: 「양 무리를 치십시오」는 이해 가능하나 현대 표준어에서는 「양 떼를 치십시오」가 더 자연스럽습니다. 「감독하기를 억지로 하지 말고」는 자연스러운 한국어 연결이 아니므로, 감독·돌봄의 행위를 「살피되」로 연결하는 편이 좋습니다.
