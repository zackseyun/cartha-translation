    issue: 'Unwarranted addition: “더욱 그러합니다.”'
    rationale: This conclusion is not present in εἰ ἐγεύσασθε ὅτι χρηστὸς ὁ κύριος. The Greek conditional clause depends on the preceding context; it must not be supplied with a new assertion.
  - severity: high
    issue: κύριος is rendered “야훼” in the main text.
    rationale: The Psalm allusion may explain the background of κύριος, but the Greek text itself says “the Lord.” Rendering it as “야훼” removes the source wording’s intertextual and referential openness.
  - severity: medium
    issue: “이미” adds emphasis not explicit in the Greek.
    rationale: The aorist ἐγεύσασθε refers to a prior tasting/experience, but “이미” is not necessary and can overstate temporal emphasis.
