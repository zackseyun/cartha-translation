  verdict: revise
  source_fidelity: 초안은 핵심 어휘를 대체로 충실히 옮겼으나, 「여러분을 거류민이며 나그네로 여기고 권합니다」는 ὡς가 독자의 정체성을 나타내는 용법임을 바울의 주관적 판단처럼 들리게 할 수 있습니다. 또한 명령문으로 분리한 방식보다 παρακαλῶ + 부정사의 권면 구조를 보존하는 편이 더 정확합니다.
  naturalness: 「거류민과 나그네인 여러분에게 … 멀리하라고 권합니다」는 현대 표준 한국어 합쇼체로 자연스럽고, 수식 관계와 권면의 범위가 분명합니다. 「정욕들」보다 「욕망」이 ἐπιθυμίαι의 범위를 불필요하게 성적인 것으로 좁히지 않습니다.
  terminology: πάροικοι와 παρεπίδημοι의 구별은 「거류민과 나그네」로 유지했습니다. σαρκικαὶ ἐπιθυμίαι는 「육신의 욕망」으로, ψυχή는 본문의 전통적·어휘적 무게를 살려 「영혼」으로 옮겼습니다. 「싸움을 벌이다」는 στρατεύονται의 지속적인 군사 비유를 자연스럽게 보존합니다.
  issues:
