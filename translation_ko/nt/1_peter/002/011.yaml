  - severity: low
    issue: 「정욕들」이 ἐπιθυμίαι의 의미 범위를 다소 좁힘
    rationale: 문맥상 부정적인 욕망이지만, 「정욕」은 현대 한국어에서 성적 욕망으로 특히 좁게 들릴 수 있습니다. 「욕망」은 원문의 더 넓은 범위를 보존합니다.
  - severity: low
    issue: 기존 각주가 본문의 어휘 대안을 충분히 설명하지 못함
    rationale: 두 신분 용어의 결합을 설명하는 각주를 해당 표현에 연결하고, 불필요하게 단정적인 신학적 해석은 피하는 것이 좋습니다.
