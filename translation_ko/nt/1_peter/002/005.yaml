revisions:
- from: 여러분 자신도 산 돌들로서 신령한 집으로 세워져, 거룩한 제사장 직분을 이루며, 메시아 예수로 말미암아 하나님이 기쁘게 받으시는 신령한 제사를 드리는 자들이 됩니다.
  to: 여러분도 산 돌들처럼 영적인 집으로 세워지고 있습니다. 그리하여 여러분은 거룩한 제사장 공동체가 되어, 메시아이신 예수를 통하여 하나님께서 기쁘게 받으실 영적인 제사들을 드리게 됩니다.
  rationale: The revision retains the ongoing passive building image, expresses the corporate sense of ἱεράτευμα, restores the plural “sacrifices,” and preserves Χριστός semantically as “Messiah.” The two-sentence Korean rendering naturally represents the source’s linked result/purpose sequence without assigning an unstated agent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:08Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the building and sacrificial imagery, but it weakens the present passive sense of οἰκοδομεῖσθε by ending with future/resultative 「됩니다」 and renders the plural θυσίας as a singular. 「제사장 직분을 이루며」 also makes the readers’ role sound overly active and does not naturally express εἰς ἱεράτευμα ἅγιον as the corporate goal/result of being built.
  naturalness: 「신령한」 is a recognizable traditional church term but is less natural in modern standard Korean; 「영적인」 is clearer without specifying the Spirit as the source. The revised wording uses modern formal-polite prose and retains the metaphorical sequence without an awkward final predicate.
  terminology: ἱεράτευμα denotes a priestly body/community, not merely an individual office. 「거룩한 제사장 공동체」 conveys its corporate force more accurately than 「거룩한 제사장 직분」 in this syntax. 「메시아이신 예수」 idiomatically renders Ἰησοῦ Χριστοῦ while retaining Χριστός as the title “Messiah,” in line with the English POB audit trail.
  issues:
  - severity: medium
    issue: The final 「드리는 자들이 됩니다」 changes the construction and obscures the present passive of οἰκοδομεῖσθε.
    rationale: The source depicts the readers as presently being built up; it does not say that they will become people who offer sacrifices.
  - severity: medium
    issue: 「신령한 제사」 is singular although πνευματικὰς θυσίας is plural.
    rationale: The plural should be retained as 「영적인 제사들」 (or equivalent).
  - severity: medium
    issue: 「거룩한 제사장 직분을 이루며」 is an imprecise and syntactically awkward rendering of εἰς ἱεράτευμα ἅγιον.
    rationale: The phrase refers to a holy priestly body/community as the goal or result associated with their being built, rather than simply an office that the readers actively perform.
  revised_text: 여러분도 산 돌들처럼 영적인 집으로 세워지고 있습니다. 그리하여 여러분은 거룩한 제사장 공동체가 되어, 메시아이신 예수를 통하여 하나님께서 기쁘게 받으실 영적인 제사들을 드리게 됩니다.
  revised_footnotes: []
  revision_rationale: The revision retains the ongoing passive building image, expresses the corporate sense of ἱεράτευμα, restores the plural “sacrifices,” and preserves Χριστός semantically as “Messiah.” The two-sentence Korean rendering naturally represents the source’s linked result/purpose sequence without assigning an unstated agent.
