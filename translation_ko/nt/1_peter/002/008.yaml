  to: 또한 「걸려 넘어지게 하는 돌이요 거치게 하는 바위」[a]입니다. 그들은 말씀에 순종하지 않기 때문에 걸려 넘어집니다. 또한 그들은 이를 위하여 정해졌습니다.
