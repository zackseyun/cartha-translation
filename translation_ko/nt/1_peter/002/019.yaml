    rationale: τοῦτο γὰρ χάρις εἰ는 조건절이 가리키는 바를 ‘은혜’라고 진술합니다. 「…때문입니다」는 γάρ를 한국어의 문장 종결 인과로 재구성하며, 「은혜로운 일」은 평가적 의미를 본문에 고정합니다.
