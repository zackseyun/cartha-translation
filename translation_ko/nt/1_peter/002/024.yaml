  source_fidelity: 개정이 필요합니다. 초안의 「자신의 몸에 짊어지시고 나무 위에 올리셨으니」는 그리스어가 그리스도께서 죄를 짊어지신 장소/상황으로 표현하는 「자기 몸으로 나무 위에서」를, 죄를 나무 위에 올리는 동작처럼 읽히게 하여 의미와 통사 관계를 바꿉니다. 또한 ἵνα 목적절은 한국어에서 자연스럽게 목적을 드러내도록 다듬는 것이 적절합니다.
  naturalness: 「죄들에 대해 죽은 자가 되어」「의에 대해 살게」는 직역 흔적이 강합니다. 「죄에 대하여 죽고 의를 위하여 살도록」이 현대 표준어 합쇼체에서 더 자연스럽고, 원문의 대조와 목적 관계를 유지합니다. 마지막 절은 인용부호 없이도 본문 흐름과 이사야의 반향을 충분히 보존합니다.
  terminology: ξύλον은 본문에서 「나무」로 유지하여 「십자가」보다 원문 어휘와 신명기 21:23의 반향을 투명하게 보존합니다. μώλωψ는 현대어로 「상처」가 자연스러우며, 각주에서 「채찍 자국/멍 자국」의 가능성과 이사야 53:5의 반향을 밝협니다. δικαιοσύνη는 「의」로 유지합니다.
  issues:
