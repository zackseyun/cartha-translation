  - severity: medium
    issue: 목적절의 한국어 표현이 지나치게 직역적이다.
    rationale: 「죄들에 대해 죽은 자가 되어 의에 대해 살게」보다 「죄에 대하여 죽고 의를 위하여 살도록」이 ἀπογενόμενοι와 ἵνα ... ζήσωμεν의 관계를 자연스럽게 전달한다.
  - severity: low
