revisions:
- from: 여러분이 그분께 나아가니, 그분은 사람들에게는 버림받았으나 하나님께는 택하심을 받고 보배로우신 산 돌이십니다.
  to: 여러분이 그분께 나아갈 때, 그분은 사람들에게는 버림받으셨으나 하나님께는 택하심을 받으셨고 귀하신 산 돌이십니다.
  rationale: 분사의 시간적·진행적 뉘앙스를 「나아갈 때」로 명료하게 하고, 그리스도를 가리키는 높임을 통일했습니다. ‘사람들’은 ἀνθρώπων의 일반적 인간 집단을 자연스럽게 나타내며, 원문의 사람들과 하나님 사이의 평가 대조를 유지합니다. 본문 자체에 텍스트상 필요한 각주 표지는 없습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:00Z'
review_pass:
  verdict: revise
  source_fidelity: 「나아가니」는 현재분사 προσερχόμενοι를 조건·이유처럼 들리게 할 수 있습니다. 시간적·진행적 관계를 더 분명히 드러내는 「나아갈 때」가 안전합니다. 또한 그리스어의 수식 구조와 대조(사람들에게는/하나님께는), ‘산 돌’ 비유, 선택됨과 존귀함을 보존했습니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 그리스도를 가리키는 서술에 적절한 높임을 일관되게 사용합니다. 「보배로우신」도 가능하지만, 「귀하신」이 ἔντιμος의 ‘존귀하고 가치 있음’을 현대 한국어에서 더 자연스럽게 전달합니다.
  terminology: λίθον ζῶντα는 문맥의 건축 비유를 살려 「산 돌」로 유지했습니다. ἀποδεδοκιμασμένον은 「버림받으셨으나」, ἐκλεκτός는 「택하심을 받으셨고」로 옮겨 문맥상 하나님의 선택을 보존했습니다. ἔντιμος는 「귀하신」으로 옮겼습니다.
  issues:
  - severity: medium
    issue: 「나아가니」의 연결 의미
    rationale: 현재분사 προσερχόμενοι는 ‘나아가면서/나아갈 때’라는 상황적 진행을 나타냅니다. 「-니」는 한국어에서 이유나 그에 따른 결과를 암시할 수 있어, 원문의 열린 분사 연결을 다소 좁힐 수 있습니다.
  - severity: low
    issue: 그리스도를 가리키는 높임의 불일치
    rationale: 초안의 「버림받았으나」와 「택하심을 받고」는 뒤의 「이십니다」와 달리 높임이 없습니다. 현대 한국어 성서 문체에서는 같은 지시 대상에 높임을 일관되게 쓰는 편이 자연스럽습니다.
  revised_text: 여러분이 그분께 나아갈 때, 그분은 사람들에게는 버림받으셨으나 하나님께는 택하심을 받으셨고 귀하신 산 돌이십니다.
