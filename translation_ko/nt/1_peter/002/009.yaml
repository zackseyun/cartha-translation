  to: 그러나 여러분은 택하심을 받은 족속이며, 왕 같은 제사장 직분이며, 거룩한 나라이며, 그분의 소유가 된 백성입니다[a]. 이는 여러분을 어둠에서 그분의 놀라운 빛으로 부르신 분의 탁월하심을 여러분이 선포하도록 하시기 위함입니다.
