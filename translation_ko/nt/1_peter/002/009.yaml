review_pass:
  verdict: revise
  source_fidelity: 핵심 네 칭호와 목적절, 어둠에서 빛으로의 부르심은 대체로 충실합니다. 다만 λαὸς εἰς περιποίησιν의 소유 관계가 ‘소유된 백성’에서는 부자연스럽고 소유주가 드러나지 않습니다. 문맥상 가리키는 분을 밝혀 ‘그분의 소유가 된 백성’으로 하는 것이 안전합니다. τὰς ἀρετὰς는 복수이지만 한국어의 집합적 추상명사 ‘탁월하심’으로 포괄할 수 있습니다.
  naturalness: ‘소유된 백성’은 현대 표준어에서 부자연스러운 피동 표현입니다. 또한 ‘왕같은’은 의존 명사 ‘같은’을 띄어 써서 ‘왕 같은’으로 쓰는 것이 표준적입니다. 병렬 서술어도 ‘-이며’로 연결하면 현대 합쇼체 문장으로 더 매끄럽습니다.
  terminology: ‘택하심을 받은 족속’, ‘왕 같은 제사장 직분’, ‘거룩한 나라’는 원문의 집단적 언약 칭호를 보존합니다. ‘그분의 소유가 된 백성’은 περιποίησις의 특별한 소유·귀속 의미와 영어 감사본의 ‘his own possession’을 자연스럽게 반영합니다. OT 관련 주석은 이를 엄밀한 단일 직접 인용으로 단정하기보다 두 본문을 반영한 표현으로 기술하는 편이 정확합니다.
  issues:
  - severity: medium
    issue: ‘소유된 백성’이 소유 관계를 불분명하고 부자연스럽게 표현함
    rationale: λαὸς εἰς περιποίησιν은 하나님께 특별히 속한 백성을 가리킵니다. 한국어 피동형 ‘소유된’은 소유주도 드러내지 않고 통상적 용법도 아닙니다.
  - severity: low
    issue: ‘왕같은’의 띄어쓰기
    rationale: 현대 표준 표기에서는 ‘왕 같은’으로 띄어 쓰는 것이 적절합니다.
  - severity: low
    issue: 주석의 ‘결합한 인용’ 표현이 지나치게 단정적임
    rationale: 본문은 출애굽기 19:5-6과 이사야 43:20-21의 어휘와 주제를 반영하지만, 이를 단순한 결합 직접 인용으로 규정하기보다 ‘반영한 표현’으로 하는 것이 문헌 관계를 더 정확히 보존합니다.
  revised_text: 그러나 여러분은 택하심을 받은 족속이며, 왕 같은 제사장 직분이며, 거룩한 나라이며, 그분의 소유가 된 백성입니다[a]. 이는 여러분을 어둠에서 그분의 놀라운 빛으로 부르신 분의 탁월하심을 여러분이 선포하도록 하시기 위함입니다.
