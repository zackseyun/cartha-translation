review_pass:
  verdict: revise
  source_fidelity: 「바로 이것에 부르심을 받았습니다」는 εἰς τοῦτο의 목적 용법을 한국어에서 부자연스럽게 처리합니다. 「바로 이를 위하여 부르심을 받았습니다」가 목적성과 앞 문맥을 더 정확히 보존합니다. 또한 「고난을 당하시면서」는 고난과 본을 남김의 동시성을 암시하므로, 그리스어의 주절 ἔπαθεν과 분사 ὑπολιμπάνων의 관계를 더 중립적으로 옮기는 편이 안전합니다.
  naturalness: 합쇼체와 존칭은 적절하나, 「이것에 부르심을 받았습니다」는 현대 표준 한국어에서 어색합니다. 「여러분에게 본보기를 남기셨기 때문입니다」는 자연스럽고, ‘남기다’는 ὑπολιμπάνων의 의미도 살립니다.
  terminology: Χριστός의 칭호적 의미를 「메시아」로 유지하고, ὑπὲρ ὑμῶν은 교리적으로 좁히지 않고 「여러분을 위하여」로 옮깁니다. ὑπογραμμός는 본문에서 「본보기」로 번역하고, 학습자가 따라 쓰는 본이라는 구체적 뉘앙스는 각주로 보완합니다.
