  - severity: low
    issue: ἔντιμον의 번역
    rationale: ‘보배로운’은 가능한 번역이지만 가치의 뉘앙스에 치우칠 수 있습니다. ‘존귀한’은 존중받음/귀함의 의미를 직접 반영하고 바로 뒤 문맥의 ‘존귀’ 주제와도 잘 맞습니다.
