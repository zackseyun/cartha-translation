review_pass:
  verdict: revise
  source_fidelity: 초두의 διότι는 앞선 진술의 근거를 제시하므로 ‘~하기 때문입니다’로 분명히 드러내는 편이 좋습니다. περιέχει ἐν γραφῇ는 한국어에서 ‘성경에 이렇게 기록되어 있습니다’가 자연스럽고, ἐκλεκτόν과 ἔντιμον은 각각 ‘택하심을 받은’과 ‘존귀한’으로 구별해 옮기는 것이 원문에 가깝습니다. οὐ μή의 강한 부정은 ‘결코 … 아니할 것입니다’로 보존했습니다.
  naturalness: 현행 문장은 긴 인용문 뒤에 ‘하기 때문입니다’가 붙어 다소 불안정합니다. 근거를 먼저 제시하고 인용문을 이어 주면 현대 표준어 합쇼체 문장으로 자연스럽습니다. ‘모퉁잇돌’은 굳어진 합성어 표기입니다.
  terminology: ‘시온’, ‘모퉁잇돌’, ‘택하심을 받은’은 정착된 성서 어휘이면서도 현대 독해가 가능합니다. ἔντιμον은 ‘보배로운’도 가능하나, 여기서는 ‘존귀한’이 ‘honored’ 및 원어의 존귀·가치 의미를 더 직접적으로 반영합니다. αὐτῷ는 문법상 돌을 가리킬 수도 있으나 베드로의 직접 문맥상 인격적 적용이 자연스러우므로, 존칭을 덧붙이지 않은 ‘그를’로 옮겨 해석적 강도를 낮췄습니다.
