  verdict: approve
  source_fidelity: 그리스어의 선행·준비적 부정과거 중간분사 Ἀποθέμενοι를 「벗어 버리고」로 적절히 옮겼으며, οὖν의 논리적 연결은 「그러므로」로 보존했습니다. κακία, δόλος, ὑποκρίσεις, φθόνους, καταλαλιάς의 항목과 πᾶς가 반복하여 주는 총체성도 충실히 반영되어 있습니다.
  naturalness: 「그러므로 여러분은 … 벗어 버리고,」는 다음 절의 권면으로 이어지는 문맥에서 자연스러운 현대 표준어입니다. 「위선들」「시기들」은 한국어에서 다소 표시적인 복수이나, 다양한 행태를 나열하는 그리스어 복수형을 보존하는 데 무리가 없습니다.
  terminology: 「악의」「속임수」「위선」「시기」「비방」은 윤리적 악덕 목록이라는 문맥에 잘 맞고, 특히 「비방」은 καταλαλιάς의 타인을 헐뜯는 말을 간결하고 정확하게 전달합니다. 신학적으로 부당한 확대나 특정 교리적 해석은 없습니다.
