revisions:
- from: 그러므로 믿는 여러분에게는 그 보배로움이 있으나, 믿지 아니하는 자들에게는 「건축자들이 버린 돌이 도리어 모퉁이의 머릿돌이 되었다」[a] 함과 같습니다.
  to: 그러므로 믿는 여러분에게는 존귀함이 있습니다. 그러나 믿지 않는 이들에게는 “건축자들이 버린 돌, 바로 이 돌이 모퉁이의 머릿돌이 되었습니다”라는 말씀이 있습니다.[a]
  rationale: 본문의 대조(믿는 이들/믿지 않는 이들)를 유지하면서 τιμή를 ‘존귀함’으로 번역했습니다. 인용문에서는 ‘바로 이 돌’로 οὗτος를 반영하고, 전통적이면서도 원문의 건축 비유를 보존하는 ‘모퉁이의 머릿돌’을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:02Z'
review_pass:
  verdict: revise
  source_fidelity: 「그 보배로움」은 직전 절의 ‘보배로운’과 연결될 수 있는 해석이지만, 여기의 ἡ τιμή는 믿는 이들에게 돌아가는 ‘존귀함/영예’를 더 직접적으로 가리킵니다. 또한 οὗτος(‘바로 이 돌’)의 지시를 번역문에 드러내고, 원문에 없는 ‘도리어’는 제거하는 편이 충실합니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 ‘믿지 아니하는 자들’보다 ‘믿지 않는 이들’을 사용하고, 그리스어의 인용문 뒤에 생략된 연결을 한국어에서 자연스럽게 ‘…라는 말씀이 있습니다’로 보완했습니다.
  terminology: τιμή는 문맥상 ‘존귀함’으로 옮겨 직전 절의 ‘보배로움’이라는 가능한 연상은 강요하지 않으면서도 honor의 의미를 보존했습니다. κεφαλὴ γωνίας는 원문의 비유를 보존한 ‘모퉁이의 머릿돌’로 유지했습니다.
  issues:
  - severity: medium
    issue: ἡ τιμή를 ‘그 보배로움’으로 번역함
    rationale: 이는 그 돌이 신자에게 보배롭다는 가능한 해석을 본문에 확정하지만, 문법적으로는 ‘존귀함/영예’가 믿는 이들에게 있다는 뜻이 더 직접적입니다.
  - severity: low
    issue: οὗτος의 강조와 ἀπεδοκίμασαν의 의미가 충분히 반영되지 않음
    rationale: ‘도리어’는 원문의 지시대명사 οὗτος를 번역하지 않고 대조를 보충합니다. ‘바로 이 돌’을 사용하여 지시와 반전의 문맥을 보존할 수 있습니다.
  - severity: low
    issue: 인용문 뒤의 ‘함과 같습니다’가 불명확함
    rationale: 원문의 생략된 연결을 한국어에서 자연스럽게 표시하려면 인용을 ‘…라는 말씀이 있습니다’로 연결하는 것이 더 분명합니다.
  revised_text: 그러므로 믿는 여러분에게는 존귀함이 있습니다. 그러나 믿지 않는 이들에게는 “건축자들이 버린 돌, 바로 이 돌이 모퉁이의 머릿돌이 되었습니다”라는 말씀이 있습니다.[a]
