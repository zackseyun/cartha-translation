  text: as free people, and not using freedom as a cover for evil, but as slaves of God.
translation:
  language: ko
  text: 자유인으로서, 자유를 악을 가리는 덮개로 삼지 말고, 하나님의 종으로서 행하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
