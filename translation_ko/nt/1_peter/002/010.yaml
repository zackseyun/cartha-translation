    rationale: 원문은 νῦν δὲ λαὸς θεοῦ(‘이제는 하나님의 백성’)라는 명사 술어이며, 변화의 결과는 문맥상 함의될 수 있지만 ‘되다’로 번역하면 표현을 한 단계 해석적으로 만듭니다.
  - severity: low
    issue: ‘자비를 얻다’는 수동태 ἠλεημένοι/ἐλεηθέντες의 의미를 다소 약화합니다.
    rationale: 긍휼의 수여를 받는다는 수동 의미는 ‘긍휼을 받다’로 더 투명하게 나타납니다.
  - severity: low
