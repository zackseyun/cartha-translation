  source_fidelity: 첫 대조는 그리스어의 ‘전에는 백성이 아니었으나 이제는 하나님의 백성’이라는 서술을 보존해야 합니다. 초안의 ‘하나님의 백성이 되었고’는 γίνομαι(되다)가 없는 원문보다 변화 사건을 더 명시합니다. 둘째 대조의 수동태는 ‘긍휼을 받다’로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: ‘여러분은 전에는 … 아니었으나, 이제는 …입니다’ 및 ‘긍휼을 받지 못했으나 … 받았습니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 병행과 대조도 유지합니다.
  terminology: λαὸς θεοῦ는 ‘하나님의 백성’이 적절합니다. ἐλεέω 계열은 성서적 용례와 수동 의미를 살리는 ‘긍휼을 받다’가 ‘자비를 얻다’보다 더 직접적입니다. 각주는 베드로가 호세아를 ‘인용’한다는 단정 대신 관련 본문을 반영/환기한다는 표현으로 절제합니다.
  issues:
