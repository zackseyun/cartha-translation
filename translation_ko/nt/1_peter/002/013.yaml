  source_fidelity: 개정이 필요합니다. 「모든 사람이 세운 제도」는 ‘모든 사람이 함께 세운 제도’라는 뜻으로 읽힐 수 있어, 분배적인 πάσῃ와 ἀνθρωπίνῃ κτίσει의 수식 관계를 충분히 드러내지 못합니다. 「사람이 세운 모든 제도」가 원문의 ‘모든 인간 제도’를 정확히 반영합니다. 「위에 있는 자로서의 왕」은 ὡς ὑπερέχοντι를 직역적으로 따라가지만 현대 한국어로 부자연스럽습니다.
