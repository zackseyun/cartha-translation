  verdict: revise
  source_fidelity: 원문의 명령적 분사 ἔχοντες, ὡς κακοποιῶν(‘악을 행하는 사람들처럼’), 그리고 ἵνα 이하의 목적절을 더 직접적으로 반영할 필요가 있습니다. ἐπισκοπῆς는 하나님의 찾아오심/돌보심/심판의 함의를 지니므로 어느 하나로 교리적으로 한정하지 않는 표현이 적절합니다.
  naturalness: ‘행실을 선하게 가지십시오’와 ‘그 일에서’는 현대 한국어로 다소 부자연스럽고, 문장 끝의 ‘하려는 것입니다’는 명령문과 목적절의 연결을 약화합니다. ‘행실을 훌륭하게 하십시오’ 및 ‘…영광을 돌리게 하십시오’가 자연스럽습니다.
  terminology: ἀναστροφή는 기존 용례에 맞춰 ‘행실’로 유지할 수 있습니다. κακοποιῶν은 ‘행악자’보다 현대어인 ‘악을 행하는 사람들’이 적절합니다. ἐπισκοπῆς는 ‘하나님께서 돌아보시는 날’로 옮겨 방문과 심판을 포함할 수 있는 여지를 보존합니다.
  issues:
  - severity: medium
    issue: ‘선하게 가지십시오’
    rationale: καλήν은 여기서 행실의 도덕적 훌륭함/존중받을 만함을 가리키며, 해당 결합은 현대 한국어에서 어색합니다.
  - severity: high
    issue: ‘행악자라’ 및 ‘그 일에서’
    rationale: ὡς κακοποιῶν의 ‘…처럼’이라는 비교·평가의 뉘앙스가 약화되었고, ἐν ᾧ를 ‘그 일에서’로 옮긴 표현도 자연스럽지 않습니다.
  - severity: medium
    issue: ‘권고하시는 날’
    rationale: ‘권고’는 현대어에서 주로 충고·권면을 뜻하여 ἐπισκοπή의 방문·돌보심·심판이라는 의미 범위를 잘 전달하지 못합니다.
  - severity: medium
    issue: ‘돌리게 하려는 것입니다’
    rationale: ἵνα ... δοξάσωσι의 목적절은 앞선 권면의 목적이므로 ‘돌리게 하십시오’로 명령문에 연결하는 편이 정확합니다.
