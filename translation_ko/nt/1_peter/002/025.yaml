  source_fidelity: 개정이 필요합니다. 초안은 ὡς πρόβατα πλανώμενοι와 ἐπεστράφητε의 핵심 뜻을 대체로 잘 전달하고, 그리스도의 칭호도 보존합니다. 그러나 문두의 γάρ(앞 절의 근거를 제시하는 ‘왜냐하면/이는’)가 번역에서 빠졌습니다. 또한 ‘길 잃은 양’은 결과 상태를 잘 나타내지만, 현재분사 πλανώμενοι의 진행성은 ‘헤매고 있었다’로 더 직접적으로 드러낼 수 있습니다.
  naturalness: ‘여러분의 영혼의’는 소유 표현이 겹쳐 다소 무겁습니다. ‘여러분 영혼의’가 더 자연스럽습니다. γάρ와 ἀλλά의 연결을 한국어 문장 안에서 ‘…었지만, 이제는 … 돌아왔기 때문입니다’로 처리하면 합쇼체의 자연스러움과 앞 절에 대한 논리적 연결을 함께 살릴 수 있습니다.
  terminology: ‘목자’와 ‘감독자’는 ποιμήν과 ἐπίσκοπος를 충실하게 옮깁니다. ‘감독’만으로 줄이지 않고 ‘감독자’로 둔 것은 교회 직분으로 과도하게 한정하지 않는 데 유익합니다. ‘영혼’도 ψυχῶν의 어휘적 표현을 보존합니다.
