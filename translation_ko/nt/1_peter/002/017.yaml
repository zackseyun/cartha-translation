  source_fidelity: 「모든 사람을 존중하십시오」와 「왕을 존중하십시오」는 τιμάω의 반복을 잘 보존하며, 「하나님을 경외하십시오」는 하나님께 대한 φοβεῖσθε를 왕에 대한 존중과 적절히 구별합니다. 다만 ἀδελφότητα는 단순히 개별 ‘형제자매들’을 뜻하기보다 신자들의 연대된 공동체를 가리키는 집합명사이므로, 현 번역은 그 공동체적 의미를 약화합니다.
