- from: 이것을 위하여 죽은 자들에게도 좋은 소식이 전해졌습니다.[a] 곧 그들이 비록 육체로는 사람들을 따라 심판을 받지만, 영으로는 하나님을 따라 살게 하려는 것입니다.
  to: 이것을 위하여 죽은 자들에게도 복음이 전해졌습니다.[a] 이는 그들이 육체로는 사람들의 기준에 따라 심판을 받되, 영으로는 하나님의 기준에 따라 살게 하려는 것입니다.[b]
  rationale: 본문의 논쟁적 대상을 특정하지 않은 채 ‘죽은 자들’로 유지했습니다. κατά의 병렬적 기준·관점 의미를 자연스러운 한국어로 드러내고, ἵνα 아래의 심판과 삶의 대조를 ‘심판을 받되 ... 살게’로 보존했습니다. 각주는 원문이 밝히지 않는 장소나 특정 교리를 제시하지 않고, 필요한 해석상 모호성만 표시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:05Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 ‘죽은 자들’의 모호성은 대체로 보존했지만, 본문의 ‘사람들에 따라/하나님에 따라’가 ‘사람들을 따라/하나님을 따라’로 번역되어 기준·관점의 뜻보다 사람이나 하나님을 본받는다는 뜻으로 읽힐 수 있습니다. 또한 ‘심판을 받지만’은 그리스어의 목적절 안의 대조를 현재의 양보절로 다소 바꿉니다.
  naturalness: ‘영으로는 하나님을 따라 살게 하려는 것입니다’는 현대 한국어에서 어색하고 의미가 불분명합니다. ‘사람들의 기준에 따라’와 ‘하나님의 기준에 따라’로 병렬을 명료하게 하고, ‘심판을 받되’로 대조를 살리는 편이 자연스럽습니다.
  terminology: εὐηγγελίσθη는 여기서 단순한 일반 소식보다 복음 선포를 가리키므로 ‘복음이 전해졌습니다’가 한국어 성경의 신학적 용례와 원문의 복음 동사를 더 잘 반영합니다. σάρξ/πνεῦμα는 각각 ‘육체’와 ‘영’으로 유지합니다.
  issues:
  - severity: medium
    issue: ‘사람들을 따라/하나님을 따라’
    rationale: κατὰ ἀνθρώπους 및 κατὰ θεόν은 사람들과 하나님을 각각 기준 또는 관점으로 삼는 병렬 표현입니다. 현 번역은 각각 사람들과 하나님을 따르거나 본받는다는 의미로 자연스럽게 읽힙니다.
  - severity: medium
    issue: ‘심판을 받지만’의 시제·구문 처리
    rationale: κρίνω와 ζάω는 모두 ἵνα 아래의 접속법이며 μὲν...δὲ 대조를 이룹니다. 현재형 양보절 ‘받지만’보다 ‘심판을 받되 ... 살게’가 목적절의 병렬과 대조를 더 잘 보존합니다.
  - severity: low
    issue: 각주의 과도한 해석적 상세와 ‘음부’ 언급
    rationale: 원문은 ‘죽은 자들’의 정체나 선포 장소를 밝히지 않습니다. 현 각주는 특정 연관 본문과 장소를 예시하면서 본문보다 더 구체적인 그림을 제시합니다. 논쟁 자체와 중립적 번역 원칙만 간결하게 밝혀야 합니다.
  - severity: low
    issue: ‘좋은 소식’
    rationale: 일반적 의미로는 가능하지만, εὐαγγελίζω의 복음 선포 의미를 한국어에서 가장 안정적으로 전달하는 용어는 ‘복음’입니다.
