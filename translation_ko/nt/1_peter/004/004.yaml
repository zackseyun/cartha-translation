- from: 이 일에서 그들은 여러분이 자기들과 함께 같은 방탕의 홍수에 뛰어들지 않는 것을 이상히 여기며 여러분을 비방합니다.
  to: 이 때문에, 그들은 여러분이 그들과 함께 같은 방탕의 홍수에 뛰어들지 않는 것을 이상히 여기며 여러분을 비방합니다.
  rationale: The revision improves the Korean idiom for the opening relative expression and smooths the pronoun reference, while retaining the source’s imagery, its present-tense hostile response, and the participial linkage of their surprise and reviling.
