  to: 사랑하는 여러분, 여러분 가운데서 여러분을 시험하려고 일어나고 있는 불 같은 시련을, 마치 여러분에게 낯선 일이 일어나고 있는 것처럼 이상하게 여기지 마십시오.
  rationale: 수정문은 시련이 ‘여러분을 시험하려고’ 일어난다는 목적 관계와 두 현재분사의 진행성을 명확히 하였습니다. ‘불 같은 시련’으로 πυρώσις의 불 이미지를 보존하고, 마지막 절은 원문의 ‘낯선 일이 여러분에게 일어나는 것처럼’이라는 표현을 유지합니다. 특정 교리적 해석은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:01Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 두 번째 ὑμῖν(‘여러분을/여러분에게’)과 현재 진행을 더 분명히 드러내는 편이 좋습니다. πρὸς πειρασμόν은 문맥상 ‘시험하려고’가 적절하며, πυρώσις의 불 이미지도 유지되어야 합니다.
  naturalness: 초안은 대체로 자연스럽지만, ‘시험을 위해 일어나는’은 무엇을 시험하는지 목적어가 생략되어 다소 추상적입니다. ‘여러분을 시험하려고 일어나고 있는’이 현대 표준어로 더 명료합니다.
  terminology: ‘사랑하는 여러분’, ‘불 같은 시련’, ‘시험’은 목회적 호칭과 불의 비유 및 시험의 의미를 적절히 전달합니다. ξενίζεσθε/ξένου의 연결은 ‘이상하게 여기지 마십시오/낯선 일’로 의미상 유지됩니다.
  issues:
  - severity: medium
    issue: πρὸς πειρασμὸν ὑμῖν의 대상이 번역문에서 명시되지 않음
    rationale: ‘시험을 위해’만으로는 시련이 누구를 시험하는지 अस्पष्ट해질 수 있습니다. 원문은 ‘여러분을 시험하려고’라는 목적을 나타냅니다.
  - severity: low
    issue: 현재분사 γινομένῃ와 συμβαίνοντος의 진행성이 약하게 반영됨
    rationale: ‘일어나는’도 가능하지만, ‘일어나고 있는’은 현재 진행 중인 사건이라는 원문의 상을 더 분명히 나타냅니다.
  revised_text: 사랑하는 여러분, 여러분 가운데서 여러분을 시험하려고 일어나고 있는 불 같은 시련을, 마치 여러분에게 낯선 일이 일어나고 있는 것처럼 이상하게 여기지 마십시오.
