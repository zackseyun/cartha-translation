    rationale: δέ는 강한 대조는 아니지만 앞 문맥에서 긴급한 권면으로 넘어가는 전환을 표시합니다. ‘그러나’로 자연스럽게 반영할 수 있습니다.
  revised_text: 그러나 모든 것의 끝이 가까이 왔습니다. 그러므로 기도할 수 있도록 분별력을 지니고 정신을 차리십시오.
