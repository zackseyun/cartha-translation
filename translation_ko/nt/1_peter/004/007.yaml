  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘만물의 끝이 가까이 왔습니다’는 Πάντων δὲ τὸ τέλος ἤγγικεν의 종말론적 진술과 완료상의 현재적 상태를 적절히 전달합니다. 그러나 δέ의 담화 전환이 빠져 있고, σωφρονήσατε의 건전한 판단·절제의 의미를 ‘정신을 차리고’로 옮긴 뒤 νήψατε를 ‘깨어 있으십시오’로 옮기면 두 명령의 의미 구분이 충분히 드러나지 않습니다. 특히 ‘깨어 있다’는 경계·파수의 뜻으로 이해되기 쉬워, 여기서 기도를 위한 맑고 절제된 정신 상태를 요청하는 νήψατε보다 다소 넓거나 다른 뉘앙스가 됩니다.
  naturalness: ‘모든 것의 끝’과 ‘분별력을 지니고 정신을 차리십시오’는 현대 표준어 합쇼체에서 자연스럽고, 두 병렬 명령의 차이도 명료합니다. εἰς προσευχάς의 목적은 ‘기도할 수 있도록’으로 자연스럽게 나타낼 수 있습니다.
  terminology: ‘끝’은 τέλος의 직접적이고 신학적으로 비편향적인 번역입니다. ‘분별력’은 σωφρονέω의 건전한 판단을, ‘정신을 차리다’는 νήφω의 비유적 절제와 정신적 각성을 각각 전달합니다. 특정 종말론 체계나 금주 교리를 덧붙이지 않습니다.
  issues:
