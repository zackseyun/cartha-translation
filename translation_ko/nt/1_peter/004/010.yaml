review_pass:
  verdict: revise
  source_fidelity: The draft preserves the main sense, but ‘받은 은사대로’ can mean ‘in proportion to/as appropriate to the gift received,’ rather than simply marking the correspondence expressed by καθὼς (‘as each has received’). Recasting the clause removes that unintended nuance. ‘청지기’ accurately renders οἰκονόμοι, and ‘하나님의 여러 가지 은혜’ faithfully represents ποικίλης χάριτος θεοῦ.
  naturalness: The revised wording is natural in modern formal-polite Korean. ‘은사를 가지고’ and ‘청지기답게’ make the exhortation clear without the awkward implication that the gift itself is being served.
  terminology: ‘은사,’ ‘은혜,’ and ‘청지기’ are accurate, established Korean biblical terms. The footnote retains the community-sphere alternative for εἰς ἑαυτούς while the main text uses the natural reciprocal expression ‘서로.’
  issues:
  - severity: medium
    issue: ‘받은 은사대로’ may introduce a proportional or manner-related sense.
    rationale: καθὼς ἔλαβεν means ‘as [each] received,’ identifying the gift each person has received; it does not explicitly instruct service according to the measure or kind of that gift.
  - severity: low
    issue: The lexical ambiguity of εἰς ἑαυτούς is not represented in the Korean draft.
    rationale: ‘서로’ is a sound main-text rendering, but the phrase can also be understood as ‘among yourselves’; a brief footnote preserves this alternative.
  revised_text: 각 사람은 받은 은사를 가지고, 하나님의 여러 가지 은혜를 맡은 선한 청지기답게 서로[a] 섬기십시오.
