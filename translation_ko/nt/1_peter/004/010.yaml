    reason: εἰς ἑαυτούς는 상호적인 의미(“서로”)로 이해할 수 있으며, 공동체 안에서라는 의미로도 이해할 수 있다.
  revision_rationale: The revision removes the potentially misleading ‘-대로’ construction, retains the individual distribution of the received gift, and expresses the steward metaphor idiomatically. A footnote preserves the source phrase’s plausible communal-sphere nuance.
