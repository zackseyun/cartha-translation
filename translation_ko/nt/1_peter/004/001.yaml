source:
  edition: SBLGNT
  text: Χριστοῦ οὖν παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ παθὼν σαρκὶ πέπαυται ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore, since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin,
translation:
  language: ko
  text: 그러므로 메시아[a]께서 육체[b]로 고난을 당하셨으므로, 여러분도 같은 마음가짐으로 무장하십시오. 이는 육체로 고난을 당한 사람은 죄에서 그쳤기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘메시아’는 그리스어 그리스도스(Christos)를 칭호의 뜻으로 옮긴 것입니다. ‘그리스도’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘육체’는 그리스어 사르크스(sarx)를 여기서 문자적으로 옮긴 것입니다. 이는 몸을 지닌 인간적 존재를 가리키며, 반드시 ‘죄된 본성’을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
  - marker: c
    text: ‘육체로 고난을 당한 사람은 죄에서 그쳤습니다’라는 절은 해석상 논쟁적입니다. 메시아를 특별히 가리킨다는 해석, 그분의 본을 따르는 신자들을 가리킨다는 해석, 또는 죄와의 결정적 단절에 관한 일반 원칙이라는 해석이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: τὴν αὐτὴν ἔννοιαν ὁπλίσασθε
  english_pob_choice: arm yourselves with the same mindset
  chosen_korean: 같은 마음으로 무장하십시오
  alternatives_korean:
  - 같은 생각으로 무장하라
  - 같은 결심으로 자신을 무장하라
  lexicon: BDAG
  rationale: ἔννοια의 「의도·결의」를 「마음」으로 옮긴다. ὁπλίσασθε의 군사적 「무장하다」 어감을 보존.
- source_word: πέπαυται ἁμαρτίας
  english_pob_choice: has ceased from sin
  chosen_korean: 죄에서 멈추었기 때문
  alternatives_korean:
  - 죄와 결별하였기 때문
  - 죄로부터 그쳤기 때문
  lexicon: BDAG
  rationale: παύω의 「그치다·멈추다」를 「멈추다」로 옮긴다. 완료 어법(현재까지 지속된 결과)을 「멈추었다」로 살린다.
