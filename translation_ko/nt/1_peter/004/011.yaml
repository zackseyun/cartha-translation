revisions:
- from: 누가 말한다면 하나님의 말씀처럼 하고, 누가 섬긴다면 하나님이 공급하시는 힘으로 하는 것처럼 하십시오. 이는 모든 일에서 메시아 예수로 말미암아 하나님이 영광을 받으시게 하려는 것입니다. 그분께 영광과 권능이 영원무궁하기를 빕니다. 아멘.
  to: 누구든지 말하려거든 하나님의 말씀을 전하듯이 말하십시오. 누구든지 섬기려거든 하나님께서 공급하시는 힘으로 섬기십시오. 이는 모든 일에서 예수 메시아를 통하여 하나님께서 영광을 받으시게 하려는 것입니다. 그분께[a] 영광과 권능이 영원무궁토록 있습니다. 아멘.
  rationale: The revision restores the direct parallelism of the source’s two conditional clauses, explicitly renders service as being performed by God-supplied strength, and preserves the indicative force of the closing doxology. The footnote records, without deciding doctrinally, the recognized ambiguity concerning the recipient of the final doxology.
