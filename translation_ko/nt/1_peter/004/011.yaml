review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the main contrasts of speaking and serving and correctly retains God as the one glorified through Jesus the Messiah. However, "하나님이 공급하시는 힘으로 하는 것처럼 하십시오" does not naturally or accurately express the second conditional exhortation: it makes "as if doing [it] by strength" modify an unspecified action. The closing optative "영원무궁하기를 빕니다" changes the indicative assertion ᾧ ἐστιν (''to whom belong'') into a wish or prayer.'
  naturalness: The proposed revision uses clear modern formal-polite Korean, keeps the two conditional clauses parallel, and renders the doxology as an assertion rather than an unnatural literal construction or a prayer wish.
  terminology: '"하나님의 말씀" is an appropriate established rendering of λόγια θεοῦ in this context. "예수 메시아" retains the project’s titular rendering of Χριστός while sounding more natural in Korean than "메시아 예수." "권능" suitably renders κράτος in the doxology.'
  issues:
  - severity: medium
    issue: The second exhortation is syntactically awkward and semantically blurred.
    rationale: '"힘으로 하는 것처럼 하십시오" does not directly say that the person should serve from the strength God supplies. Greek διακονεῖ requires a corresponding service verb in Korean.'
  - severity: medium
    issue: The doxology is rendered as a wish rather than a statement.
    rationale: ἐστιν states that glory and dominion belong to the referent; "빕니다" introduces an optative/prayer sense absent from the source.
  - severity: low
    issue: The disputed antecedent of ᾧ is left without a note.
    rationale: The nearest antecedent is Jesus the Messiah, but the English audit trail appropriately records that some understand the doxology to refer to God. A footnote preserves this interpretive ambiguity.
  revised_text: 누구든지 말하려거든 하나님의 말씀을 전하듯이 말하십시오. 누구든지 섬기려거든 하나님께서 공급하시는 힘으로 섬기십시오. 이는 모든 일에서 예수 메시아를 통하여 하나님께서 영광을 받으시게 하려는 것입니다. 그분께[a] 영광과 권능이 영원무궁토록 있습니다. 아멘.
  revised_footnotes:
  - marker: a
    text: 그리스어의 “그분께”는 바로 앞의 “예수 메시아”를 가장 자연스럽게 가리킵니다. 그러나 앞 절에서 하나님께서 예수 메시아를 통하여 영광을 받으신다고 한 점에 비추어, 이 송영을 하나님께 드리는 것으로 이해하는 견해도 있습니다.
    reason: alternative_reading
  revision_rationale: The revision restores the direct parallelism of the source’s two conditional clauses, explicitly renders service as being performed by God-supplied strength, and preserves the indicative force of the closing doxology. The footnote records, without deciding doctrinally, the recognized ambiguity concerning the recipient of the final doxology.
