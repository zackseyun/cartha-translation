  to: 심판이 하나님의 집안에서부터 시작될 때가 되었기 때문입니다. 그것이 우리에게서 먼저 시작된다면, 하나님의 복음에 순종하지 않는 자들의 결말은 어떻게 되겠습니까?
  rationale: 공동체를 가리키는 οἶκος의 문맥적 의미를 ‘집안’으로 밝혔고, τέλος를 ‘결말’로 옮겨 결과·귀결의 의미를 살렸습니다. 그 밖에는 원문의 인과관계, 심판의 시작점, 조건절, 그리고 ‘하나님의 복음에 순종하지 않는 자들’이라는 표현을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T11:53:01Z'
review_pass:
  verdict: revise
  source_fidelity: ‘하나님의 집’은 οἶκος의 가능한 직역이지만, 이 문맥에서는 뒤의 ‘우리’와 연결되는 하나님의 공동체를 가리킵니다. ‘하나님의 집안’이 그 의미를 더 분명하고 자연스럽게 전달합니다. 또한 τέλος는 단순한 시간상의 ‘마지막’보다 ‘결말’이 문맥의 결과·귀결 의미를 더 잘 보존합니다.
  naturalness: 합쇼체 문장 구성은 적절합니다. 다만 ‘순종하지 아니하는’은 현대 표준어에서는 ‘순종하지 않는’이 더 자연스럽고, 본문의 격식도 유지합니다.
  terminology: ‘심판’, ‘하나님의 복음’, ‘순종하지 않는 자들’은 κρίμα, εὐαγγέλιον, ἀπειθοῦντες의 의미와 성서적 문체를 적절히 반영합니다. ‘심판’은 징계나 정죄로 좁히지 않아 원문의 긴장을 보존합니다.
  issues:
  - severity: low
    issue: ‘하나님의 집’이 건물을 가리키는 것으로 읽힐 여지가 있습니다.
    rationale: οἶκος는 ‘집’과 ‘가족/권속’을 모두 뜻하지만, ‘우리’라는 후속 표현상 하나님의 백성 공동체가 지시 대상입니다. ‘하나님의 집안’은 이를 자연스럽게 드러냅니다.
  - severity: medium
    issue: ‘마지막’은 τέλος의 결과·귀결 의미를 충분히 나타내지 못할 수 있습니다.
    rationale: 수사적 질문은 불순종하는 이들의 시간적 종점 자체보다 그들이 맞을 최종 결과를 묻습니다. ‘결말’이 이 의미를 더 정확히 전달합니다.
  revised_text: 심판이 하나님의 집안에서부터 시작될 때가 되었기 때문입니다. 그것이 우리에게서 먼저 시작된다면, 하나님의 복음에 순종하지 않는 자들의 결말은 어떻게 되겠습니까?
