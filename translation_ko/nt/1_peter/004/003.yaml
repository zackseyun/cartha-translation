- from: 지나간 때는 이방인들의 뜻을 행하기에 충분합니다. 곧 호색과 정욕과 술 취함과 방탕한 잔치와 술자리와 무법한 우상숭배 가운데서 살아왔습니다.
  to: 여러분이 방종과 정욕과 술 취함과 흥청거림과 술자리와 법에 어긋나는 우상 숭배 가운데서 살아오며 이방인들의 뜻을 행한 지나간 때로 충분합니다.
  rationale: 독자들을 명시하여 원문의 완료 부사분사 πεπορευμένους와 완료부정사 κατειργάσθαι가 나타내는 과거의 삶을 한국어 문장 안에서 자연스럽게 연결했습니다. ἀσελγείαις는 ‘방종’으로 넓게 옮기고, κώμοις는 ‘흥청거림’으로 구별했습니다. 나머지 열거와 ‘이방인들의 뜻’, ‘법에 어긋나는 우상 숭배’는 원문의 의미 범위를 유지했습니다.
  reviewer_model: gpt-5.6-terra
