review_pass:
  verdict: revise
  source_fidelity: 초안은 βούλημα를 ‘뜻’, ἐθνῶν을 ‘이방인들’, πότοις를 ‘술자리’로 옮긴 점은 대체로 적절합니다. 그러나 πεπορευμένους가 가리키는 독자들의 과거 삶이 문장상 명시되지 않아 ‘곧 … 살아왔습니다’가 앞 절과 느슨하게 연결됩니다. 또한 ἀσέλγεια는 성적 의미에만 한정되지 않는 방종·무절제의 뜻이므로 ‘호색’보다 넓은 표현이 적절합니다.
  naturalness: ‘지나간 때는 … 충분합니다. 곧 … 살아왔습니다’는 주어와 수식 관계가 불분명합니다. 독자를 명시하고 과거의 생활상을 ‘살아온’으로 연결하면 현대 표준 한국어 합쇼체에서 자연스럽고 원문의 분사 구조도 드러납니다. ‘방탕한 잔치’는 κῶμος에 적절하나, ‘흥청거림’이 보다 간결하고 현대적입니다.
  terminology: ‘이방인들’, ‘정욕’, ‘우상 숭배’는 문맥과 한국어 성서 용례에 잘 맞습니다. ἀθεμίτοις는 단순히 범죄성을 뜻하기보다 허용되지 않고 법·규범에 어긋남을 가리키므로 ‘법에 어긋나는’으로 자연스럽게 옮겼습니다. 이 번역은 특정 교리적 해석을 추가하지 않습니다.
  issues:
