  - severity: medium
    issue: ‘호색’이 ἀσελγείαις의 의미를 지나치게 좁힘
    rationale: ἀσέλγεια는 성적 문란을 포함할 수 있지만, 기본적으로 수치심 없는 방종과 무절제를 가리킵니다. ‘방종’이 문맥상 더 넓고 정확합니다.
  - severity: low
    issue: ‘방탕한 잔치’와 앞의 ‘호색’의 의미 영역이 다소 겹치고 표현이 무거움
    rationale: κῶμοις는 흥청거리는 향연·흥청거림을 뜻하므로 ‘흥청거림’이 자연스럽고, ἀσελγείαις에는 별도로 ‘방종’을 사용할 수 있습니다.
  revised_text: 여러분이 방종과 정욕과 술 취함과 흥청거림과 술자리와 법에 어긋나는 우상 숭배 가운데서 살아오며 이방인들의 뜻을 행한 지나간 때로 충분합니다.
