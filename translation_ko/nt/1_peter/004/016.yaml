id: 1PE.4.16
reference: 1 Peter 4:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian, let him not be ashamed, but let him glorify God in this name.
translation:
  language: ko
  text: 그러나 그리스도인으로서 고난을 받는다면, 부끄러워하지 말고 이 이름으로 하나님께 영광을 돌리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 이름 때문에 하나님께 영광을 돌리십시오.’ 그리스어는 직역하면 ‘이 이름 안에서 하나님께 영광을 돌리십시오’입니다. 일부 사본에는 ‘이 일에서’라는 읽기가 있습니다.
    reason: ‘이 이름’이라는 본문 표현을 유지하면서 ἐν의 의미 범위와 사본상 다른 읽기를 밝혀, 해석적 불확실성을 본문에 강요하지 않습니다.
lexical_decisions:
- source_word: Χριστιανός
  english_pob_choice: a Christian
  chosen_korean: 그리스도인
  alternatives_korean:
  - 메시아인
  - 크리스천
  lexicon: BDAG
  rationale: Χριστιανός는 신약 단 세 번(행 11:26; 26:28; 본 절) 등장하는 외부에서 붙인 별칭. 한국어로 굳은 「그리스도인」을 채택. 본문 외 다른 곳에서 Χριστός를 「메시아」로 옮긴 정책과 별개로, 이 명사는 외부 호칭으로서 정착된 음역.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  english_pob_choice: in this name
  chosen_korean: 이 이름으로
  alternatives_korean:
  - 이 이름 안에서
  - 이 호칭으로
  lexicon: BDAG
  rationale: 일부 사본은 ἐν τῷ μέρει τούτῳ(이 일에서)로 읽지만, 「이 이름으로」가 더 잘 입증됨.
