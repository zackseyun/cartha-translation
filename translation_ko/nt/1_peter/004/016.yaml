  source_fidelity: 원문의 조건절은 문자적으로 ‘그리스도인으로서라면’이며, 문맥상 고난/박해를 받는 경우를 가리킵니다. 초안의 ‘고난을 받는다면’은 앞 문맥을 보충한 것으로 수용 가능하나, ‘도리어’는 단순 대조의 δέ보다 강합니다. 또한 ἐν τῷ ὀνόματι τούτῳ의 ‘이 이름’은 본문에서 유지하고, 해석상 가능한 의미는 각주로 밝혀야 합니다.
  naturalness: ‘영광을 돌리게 하십시오’는 일반적 제3인칭 명령을 한국어 청자에게 향한 명령처럼 다소 부자연스럽게 옮긴 표현입니다. 조건절의 일반적 권면으로 ‘영광을 돌리십시오’가 현대 표준 한국어 합쇼체에서 자연스럽습니다.
  terminology: ‘그리스도인’, ‘하나님께 영광을 돌리다’는 정착된 성서 한국어 표현이며 적절합니다. ‘이 이름으로’는 그리스도인이라는 호칭과의 연결을 보존합니다.
