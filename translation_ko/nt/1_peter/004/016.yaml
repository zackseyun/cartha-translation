  - severity: medium
    issue: ‘영광을 돌리게 하십시오’의 명령 형식이 부자연스럽습니다.
    rationale: 그리스어 제3인칭 명령은 조건절의 일반적 대상에게 하는 권면입니다. 한국어에서는 ‘부끄러워하지 말고 … 돌리십시오’가 자연스럽고 명령의 힘을 보존합니다.
  - severity: low
    issue: ‘이 이름’의 의미 가능성을 밝히는 각주가 없습니다.
