  source_fidelity: 초안은 핵심 어휘를 대체로 충실히 옮기며, 「겨우」, 「경건치 아니한 자와 죄인」, 「어디에서 나타나겠는가」는 원문의 수사적 대비를 보존합니다. 그러나 원문에 없는 「함과 같습니다」를 덧붙여 인용 소개 문구를 삽입했고, καὶ(‘또/그리고’)는 반영하지 않았습니다. 또한 현대 표준어 합쇼체에는 「경건치 아니한」보다 「경건하지 않은」이 적절합니다.
  naturalness: 「경건치 아니한」과 「…겠는가」는 문어적·고전적 색채가 강합니다. 현대 정중체로 「경건하지 않은」, 「…겠습니까?」라고 하면 자연스럽고, 원문의 격식 있는 수사 의문문의 힘도 유지됩니다.
  terminology: 「의인」, 「구원을 받다」, 「경건하지 않은 자」, 「죄인」은 성서 문맥에서 자연스럽고 ἀσεβής와 ἁμαρτωλός의 구별을 보존합니다. 「구원을 받는다면」은 σῴζεται의 현재 수동태를 무리 없이 반영하며, 「겨우」는 μόλις가 나타내는 어려움을 유지합니다.
