  text: מִֽ/הְיוֹתָ֥/ם בָּא֙ אֶל עֲרֵמַ֣ת עֶשְׂרִ֔ים וְ/הָיְתָ֖ה עֲשָׂרָ֑ה בָּ֣א אֶל הַ/יֶּ֗קֶב לַ/חְשֹׂף֙ חֲמִשִּׁ֣ים פּוּרָ֔ה וְ/הָיְתָ֖ה עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/016.yaml
  text: When one came to a heap of twenty measures[a], there were only ten; when one came to the wine vat to draw fifty measures, there were only twenty.
  footnotes:
  - marker: a
    text: Hebrew 'fifty purah,' a liquid measure or container of uncertain exact size.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 스무 단의 더미에 왔으나, 열 단밖에 없었고, 포도즙틀에 와서 오십 포라를 퍼내려 했으나, 스무 단밖에 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פּוּרָה는 정확한 크기가 확정되지 않은 액체 단위 또는 그릇을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא אֶל
  english_pob_choice: when one came
  chosen_korean: 사람이 …에 왔으나
  alternatives_korean:
  - 누군가 …에 왔으나
  - 한 사람이 …에 와도
  lexicon: HALOT
  rationale: 히브리어의 일반적·비특정적 단수 용법을 한국어에서 자연스럽게 풀어, 특정 인물이 아니라 누구에게나 반복된 상황임을 드러냈습니다.
- source_word: עֲרֵמַת עֶשְׂרִים
  english_pob_choice: a heap of twenty measures
  chosen_korean: 스무 단의 더미
  alternatives_korean:
  - 스무 측량의 더미
  - 스무 단의 무더기
  lexicon: HALOT
  rationale: עֲרֵמָה는 곡물 더미를 가리키므로 ‘더미’로 옮기되, 원문에 명시되지 않은 단위는 한국어에서 가장 덜 과장된 ‘단’으로 처리해 수량의 불완전함을 살렸습니다.
- source_word: וְהָיְתָה עֲשָׂרָה
  english_pob_choice: there were only ten
  chosen_korean: 열 단밖에 없었고
  alternatives_korean:
  - 겨우 열 단이었고
  - 열 단뿐이었고
  lexicon: HALOT
  rationale: 수확의 부족과 실망을 나타내는 문맥이므로 ‘밖에 없었고’로 짧은 결핍감을 살렸습니다.
- source_word: הַיֶּקֶב לַחְשֹׂף חֲמִשִּׁים פּוּרָה
  english_pob_choice: the wine vat to draw fifty measures
  chosen_korean: 포도즙틀에 와서 오십 포라를 퍼내려 했으나
  alternatives_korean:
  - 포도즙틀에서 오십 포라를 길어내려 했으나
  - 포도즙틀에 와서 오십 포라를 빼내려 했으나
  lexicon: HALOT
  rationale: יֶקֶב은 포도주 생산과 연결된 틀이므로 ‘포도즙틀’로 옮겼고, לַחְשֹׂף는 액체를 ‘퍼내다/길어내다’는 뜻이 자연스러워 그 동작을 드러냈습니다. פּוּרָה는 정확한 한국어 대응이 불확실하므로 본문에는 음역을 유지했습니다.
