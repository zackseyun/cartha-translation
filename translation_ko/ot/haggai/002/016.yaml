  text: When one came to a heap of twenty measures[a], there were only ten; when one came to the wine vat to draw fifty measures, there were only twenty.
  footnotes:
  - marker: a
    text: Hebrew 'fifty purah,' a liquid measure or container of uncertain exact size.
    reason: lexical_alternative
translation:
  language: ko
  text: 스무 단위 분량의 곡식 더미에 가 보니 열 단위 분량밖에 없었고, 포도즙틀에 가서 오십 포라[a]를 퍼내려 하였으나 스무 포라밖에 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘포라’는 정확한 크기가 확정되지 않은 액체 단위 또는 그릇을 가리킵니다.
    reason: lexical_alternative
