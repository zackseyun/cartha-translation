  - severity: medium
    issue: ‘단’이 원문에 없는 구체적 곡식 단위를 도입합니다.
    rationale: עֲרֵמַת עֶשְׂרִים의 단위는 본문에 명시되지 않았습니다. ‘단위 분량’은 이를 불필요하게 특정하지 않습니다.
  - severity: low
    issue: 각주 표지가 절 끝에 있어 포라와의 연결이 덜 명확합니다.
    rationale: פּוּרָה의 의미를 설명하는 각주는 본문의 첫 ‘포라’에 붙이는 편이 정확합니다.
