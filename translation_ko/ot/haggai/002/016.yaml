  source_fidelity: 개정이 필요합니다. 두 번째 수량인 עֶשְׂרִים은 앞의 곡식 더미 단위가 아니라 바로 앞의 פּוּרָה(포라)를 이어받으므로, ‘스무 단’으로 옮기면 원문의 액체 단위와 곡식 수량을 혼동하게 됩니다. יֶקֶב은 포도주 생산에 쓰이는 통/틀을 가리키므로 ‘포도즙틀’은 문맥상 수용 가능합니다.
  naturalness: ‘스무 단의 더미’와 ‘열 단’은 현대 한국어에서 곡식 단(묶음)을 뜻하는 것으로 읽히기 쉬우며, 원문이 명시하지 않은 단위를 지나치게 특정합니다. ‘단위 분량’으로 처리하면 수량 단위가 불특정이라는 원문 상태를 보존하면서도 자연스럽습니다. 결과를 나타내는 ‘가 보니’와 ‘퍼내려 하였으나’도 한국어 문맥에 자연스럽습니다.
  terminology: פּוּרָה는 본문에서 ‘포라’로 음역하고, 두 번째 결과도 ‘스무 포라’로 일관되게 옮겨야 합니다. 각주 표지는 해당 낱말의 첫 등장인 ‘포라’에 붙이는 것이 적절합니다.
  issues:
