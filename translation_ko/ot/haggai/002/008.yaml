id: HAG.2.8
reference: Haggai 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ֥/י הַ/כֶּ֖סֶף וְ/לִ֣/י הַ/זָּהָ֑ב נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/008.yaml
  text: The silver is mine[a], and the gold is mine[b], declares Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'The silver is mine, and the gold is mine,' an emphatic assertion of the LORD's ownership of both.
    reason: lexical_alternative
translation:
  language: ko
  text: 은도 내 것이고 금도 내 것입니다[a]. 만군의 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘은은 내 것이고 금도 내 것’입니다. 히브리어는 소유 관계를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי / וְלִי
  english_pob_choice: is mine / and ... is mine
  chosen_korean: 내 것이고 / 내 것입니다
  alternatives_korean:
  - 저에게 속합니다
  - 제 소유입니다
  - 제 것입니다
  lexicon: HALOT
  rationale: 히브리어의 1인칭 단수 소유 표현을 한국어의 자연스러운 소유 서술로 옮기되, 반복을 살려 야훼의 소유권을 강조했습니다.
- source_word: הַכֶּסֶף
  english_pob_choice: the silver
  chosen_korean: 은
  alternatives_korean:
  - 은도
  - 은돈
  - 은붙이
  lexicon: HALOT
  rationale: 문맥상 금과 병렬을 이루는 귀금속을 가리키므로 ‘은’으로 간결하게 옮겼습니다. 한국어에서는 이 구문에 정관사가 따로 필요하지 않습니다.
- source_word: הַזָּהָב
  english_pob_choice: the gold
  chosen_korean: 금
  alternatives_korean:
  - 금도
  - 황금
  lexicon: HALOT
  rationale: 문맥상 물질로서의 금을 가리키며, 앞의 ‘은’과 평행을 이루도록 같은 방식으로 옮겼습니다.
- source_word: נְאֻם
  english_pob_choice: declares
  chosen_korean: 말씀입니다
  alternatives_korean:
  - 선언하십니다
  - 말합니다
  - 이르십니다
  lexicon: HALOT
  rationale: 예언 문맥의 공식 종결구로서 단순 화법보다 권위 있는 선포를 드러내는 한국어 종결 표현을 택했습니다.
- source_word: יְהוָה צְבָאֽוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 야훼 만군의 하나님
  - 군대의 야훼
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값대로 ‘야훼’로 옮기고, צְבָאוֹת는 전통적 ‘만군’ 표현을 사용해 하나님의 군사적·주권적 칭호를 유지했습니다.
theological_decisions:
- issue: 고유 이름 יהוה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 표기된 신적 고유 이름을 제목어로 바꾸지 않고 음역해, 야훼의 직접 소유 선언이라는 본문의 힘을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: צְבָאוֹת의 의미 전달
  chosen_reading: 만군
  alternative_readings:
  - of hosts를 반영한 ‘호스트의’
  - 군대들
  rationale: 전통 교회어를 그대로 답습하기보다, 하나님의 절대적 주권과 전쟁의 이미지가 드러나는 역사적 관용 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 6
