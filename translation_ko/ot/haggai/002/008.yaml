  naturalness: 문장은 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. 첫 절의 연결형과 끝의 종결형 결합은 한국어 병렬 문장에서 무리 없이 쓰입니다. ‘만군의 야훼의 말씀입니다’도 예언서의 נְאֻם 공식에 알맞은 자연스러운 표현입니다.
