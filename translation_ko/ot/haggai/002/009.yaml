  source_fidelity: 히브리어의 비교 구문(‘이 집의 나중 영광’과 ‘이전 [영광]’) 및 두 차례의 ‘만군의 야훼’는 대체로 충실히 반영되었습니다. 다만 끝맺음인 נְאֻם은 ‘만군의 야훼의 말씀이십니다’로 옮기면 소유격과 높임 표현이 부자연스럽고, 발화 선언이라는 기능도 흐려집니다.
  naturalness: ‘이 집의 뒤의 영광’은 현대 표준어에서 어색하므로 ‘이 집의 나중 영광’이 자연스럽습니다. ‘처음의 영광’보다 ‘이전 영광’이 הָרִאשׁוֹן(전자의 것/이전의 것)과 대조를 더 매끄럽게 드러냅니다. ‘평강’은 전통적 성서 어휘이지만 현대어 본문에는 ‘평화’가 더 자연스럽습니다.
