id: HAG.2.9
reference: Haggai 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גָּד֣וֹל יִֽהְיֶ֡ה כְּבוֹד֩ הַ/בַּ֨יִת הַ/זֶּ֤ה הָ/אַֽחֲרוֹן֙ מִן הָ֣/רִאשׁ֔וֹן אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וּ/בַ/מָּק֤וֹם הַ/זֶּה֙ אֶתֵּ֣ן שָׁל֔וֹם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/009.yaml
  text: The latter glory of this house will be greater than the former[a], says Yahweh of Armies; and in this place I will give peace[b], declares Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: '''Peace'' (shalom) can also carry the sense of well-being or wholeness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 집의 나중 영광은 이전 영광보다 더 클 것입니다[a]. 만군의 야훼께서 말씀하십니다. 또 이곳에 내가 평화를 주겠습니다[b]. 만군의 야훼께서 선언하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영광’은 존귀나 광채를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평화’(shalom)는 평안, 복리, 온전함을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל יִהְיֶה
  english_pob_choice: will be greater
  chosen_korean: 더 클 것입니다
  alternatives_korean:
  - 크게 될 것입니다
  - 더 위대할 것입니다
  lexicon: HALOT
  rationale: גָּדוֹל과 היה의 비교적 용법을 한국어 자연문으로 옮기되, ‘greater’의 비교 의미를 직접 드러내기 위해 ‘더 크다’로 렌더링했습니다.
- source_word: כְּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 광채
  lexicon: HALOT
  rationale: 성전 문맥에서 כָּבוֹד는 하나님의 임재와 관련된 ‘영광’이 가장 직접적이며, 예배적·신학적 뉘앙스를 살립니다.
- source_word: הַבַּיִת הַזֶּה
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 전
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현인 ‘집’을 유지해, POB의 원문 밀착성과 성전/하나님의 집이라는 언약적 울림을 보존했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 전승적 ‘만군의’는 유지하되, POB의 원칙에 따라 יְהוָה는 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘이 집’과 ‘뒤의 영광’의 역사적 범위
  chosen_reading: 본문이 말하는 비교를 그대로 살려, 뒤의 영광이 처음의 영광보다 크다고만 진술하고 구체적 역사 해석은 본문 밖으로 미루었습니다.
  alternative_readings:
  - 솔로몬 성전과 제2성전의 비교
  - 같은 성전 부지의 이전 상태와 이후 상태의 비교
  - 메시아적/종말론적 성취를 염두에 둔 비교
  rationale: 히브리어 자체는 비교를 분명히 말하지만, 그 비교가 어떤 역사적 단계들을 가리키는지는 규정하지 않습니다. 번역문은 그 긴장을 지우지 않도록 중립적으로 유지했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 하나님의 이름의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה를 직접 반영해 언약적 이름을 드러내고, POB의 표준 용례를 따랐습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
