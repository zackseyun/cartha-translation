base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/014.yaml
  text: Then Haggai answered and said[a], “So is this people, and so is this nation before me,” declares Yahweh, “and so is every work of their hands[b]; and what they offer there is unclean.”
  footnotes:
  - marker: a
    text: Or 'Thus is this people ... and thus is this nation.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'this people,' a marked expression that can sound distancing or reproachful.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 학개가 대답하여 말했습니다. "이 백성도 이 민족도 내 앞에서는 이와 같습니다." 여호와의 말씀입니다. "그들이 손으로 하는 모든 일도 이와 같고, 거기에서 바치는 것도 부정합니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 백성은 이와 같고 이 민족은 이와 같습니다.”
    reason: alternative_reading
  - marker: b
    text: 직역하면 “그들이 손으로 한 모든 일”이며, 지시적·비판적 어조를 지닌 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  english_pob_choice: so is
  chosen_korean: 이와 같습니다
  alternatives_korean:
  - 이렇습니다
  - 그와 같습니다
  lexicon: HALOT
  rationale: 반복되는 비교·판정 형식을 살리기 위해 단순한 상태 묘사보다 판단적 의미가 드러나는 표현으로 옮겼습니다.
- source_word: הָעָם הַזֶּה
  english_pob_choice: this people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 사람들
  - 이 민족
  lexicon: HALOT
  rationale: 예언자적 호칭으로서의 집합 명사를 자연스러운 한국어로 옮기되, 거리감 있는 지시성을 유지했습니다.
- source_word: הַגּוֹי הַזֶּה
  english_pob_choice: this nation
  chosen_korean: 이 민족
  alternatives_korean:
  - 이 나라
  - 이 백성
  lexicon: HALOT
  rationale: people과 평행을 이루는 지시 표현을 살리면서, 공동체 전체를 가리키는 corporate한 뉘앙스를 담기 위해 '민족'을 택했습니다.
- source_word: לְפָנַי
  english_pob_choice: before me
  chosen_korean: 내 앞에서는
  alternatives_korean:
  - 내 면전에서는
  - 내가 보는 앞에서는
  lexicon: HALOT
  rationale: 하나님 앞에 서 있는 언약적·심판적 위치를 드러내는 관용구로 옮겼습니다.
- source_word: טָמֵא הוּא
  english_pob_choice: is unclean
  chosen_korean: 부정합니다
  alternatives_korean:
  - 부정합니다
  - 더럽습니다
  - 불결합니다
  lexicon: HALOT
  rationale: 제의적 정결 범주를 한국어 성경 용례에 맞게 '부정'으로 옮겨, 단순한 위생적 '더러움'으로 약화되지 않게 했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 여호와가 아니라 여호와의 이름을 번역 관행상 '여호와' 대신 본문 내에서 '여호와의 말씀입니다'로 유지하지 않고, 본문 원형의 신명성을 해치지 않도록 '여호와'를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절의 원문은 예언 신탁의 공식으로 야훼의 직접 발화를 표시합니다. 한국어 가독성과 현재 POB 표기 체계를 고려해, 본문에는 '여호와' 대신 '여호와의 말씀입니다'가 아닌 '여호와의 말씀입니다'를 둘 수 없으므로, 여기서는 예시적으로 '여호와' 표기를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
