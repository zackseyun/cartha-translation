base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/014.yaml
  text: Then Haggai answered and said[a], “So is this people, and so is this nation before me,” declares Yahweh, “and so is every work of their hands[b]; and what they offer there is unclean.”
  footnotes:
  - marker: a
    text: Or 'Thus is this people ... and thus is this nation.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'this people,' a marked expression that can sound distancing or reproachful.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 학개가 대답하여 말했습니다. "이 백성도 이 민족도 내 앞에서는 이와 같습니다." 여호와의 말씀입니다. "그들이 손으로 하는 모든 일도 이와 같고, 거기에서 바치는 것도 부정합니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 백성은 이와 같고 이 민족은 이와 같습니다.”
    reason: alternative_reading
  - marker: b
    text: 직역하면 “그들이 손으로 한 모든 일”이며, 지시적·비판적 어조를 지닌 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
