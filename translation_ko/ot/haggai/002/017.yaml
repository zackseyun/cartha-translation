source:
  edition: WLC
  text: הִכֵּ֨יתִי אֶתְ/כֶ֜ם בַּ/שִּׁדָּפ֤וֹן וּ/בַ/יֵּֽרָקוֹן֙ וּ/בַ/בָּרָ֔ד אֵ֖ת כָּל מַעֲשֵׂ֣ה יְדֵי/כֶ֑ם וְ/אֵין אֶתְ/כֶ֥ם אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/017.yaml
  text: I struck you with blight and mildew and hail[a], all the work of your hands; yet you did not turn to me, declares Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'and you were not to me' or 'and none of you was toward me'; the sense in context is that they did not return to the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 마름병과 황변병과 우박으로 너희와 너희 손으로 한 모든 일을 쳤으나, 너희는 내게로 돌아오지 않았습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “너희는 내게로 향하지 않았다” 또는 “너희 중 아무도 내게로 향하지 않았다”에 가깝습니다. 문맥상 너희가 야훼께 돌아오지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֵּיתִי
  english_pob_choice: I struck
  chosen_korean: 내가 … 쳐서
  alternatives_korean:
  - 내가 … 때렸으나
  - 내가 … 치셨으나
  - 내가 … 치셨습니다
  lexicon: WLC; HALOT
  rationale: נכה의 직접적 의미를 살리면서, 심판 행위의 문맥에 자연스러운 한국어 동사 ‘치다’를 사용했습니다.
- source_word: בַּשִּׁדָּפוֹן
  english_pob_choice: with blight
  chosen_korean: 깜부기병
  alternatives_korean:
  - 마름병
  - 블라이트
  - 시들음
  lexicon: HALOT
  rationale: שִׁדָּפוֹן은 곡물을 해치는 농작물 재앙을 가리키므로, 한국어로는 농업 맥락에서 이해되는 병명인 ‘깜부기병’을 선택했습니다.
- source_word: וּבַיֵּרָקוֹן
  english_pob_choice: and mildew
  chosen_korean: 노균병
  alternatives_korean:
  - 누렇게 됨
  - 곰팡이병
  - 마름병
  lexicon: HALOT
  rationale: יֵרָקוֹן의 황변/쇠약 계열 의미를 농작물 질병 표현인 ‘노균병’으로 옮겨, 앞말과 함께 재앙의 병렬성을 살렸습니다.
- source_word: וּבַבָּרָד
  english_pob_choice: and hail
  chosen_korean: 우박
  alternatives_korean:
  - 우박과
  - 싸락눈
  lexicon: HALOT
  rationale: בָּרָד는 일반적으로 ‘우박’이므로 그대로 옮겼습니다.
- source_word: וְאֵין אֶתְכֶם אֵלַי
  english_pob_choice: yet you did not turn to me
  chosen_korean: 너희는 내게로 돌아오지 않았습니다
  alternatives_korean:
  - 너희는 내게 있지 않았습니다
  - 너희 중 아무도 내게로 오지 않았습니다
  - 너희는 내 쪽이 아니었습니다
  lexicon: HALOT
  rationale: 생략된 동사가 있는 관용구를, 문맥상 회개의 거부라는 뜻이 분명하게 드러나는 ‘돌아오다’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼의 말씀이니라
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם을 현대 합쇼체로 자연스럽게 풀어, 신적 화자의 종결감을 살렸습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 신명기적 고유명사를 제목이 아닌 이름으로 드러내기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: POB glossary default; transliteration policy
- issue: וְאֵין אֶתְכֶם אֵלַי의 함의
  chosen_reading: 징계 이후에도 하나님께 돌아오지 않은 언약적 불응
  alternative_readings:
  - 단순히 하나님과 함께 있지 않음
  - 하나님께 오지 않음
  rationale: 문맥상 문제는 거리감 자체가 아니라 회개로의 복귀 거절이므로, 직역보다 예언서의 언약적 의미를 드러내는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §3, §6
