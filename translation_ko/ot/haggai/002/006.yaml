id: HAG.2.6
reference: Haggai 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֥וֹד אַחַ֖ת מְעַ֣ט הִ֑יא וַ/אֲנִ֗י מַרְעִישׁ֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וְ/אֶת הַ/יָּ֖ם וְ/אֶת הֶ/חָרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/006.yaml
  text: 'For this is what Yahweh of Armies says: Yet once more[a], in a little while[b], I will shake the heavens and the earth and the sea and the dry land.'
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew is compressed: ''Yet once more, it is a little while''; the sense is that after a short time the LORD will shake all creation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 만군의 야훼께서 말씀하시는 것입니다. “아직 한 번 더, 잠시 후에, 내가 하늘과 땅과 바다와 마른 땅을 흔들겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축적이어서 직역하면 ‘아직 한 번 더, 잠시 후에’에 가깝습니다. 반복성/마지막성의 뉘앙스를 함께 담았습니다.
    reason: source_note
  - marker: b
    text: ‘만군’은 전통적 ‘hosts’의 관용 번역이지만, 여기서는 צְבָאוֹת의 군사적·우주적 위상을 드러내는 번역으로 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: יְהוָה는 본명 표기로 야훼를 따르고, צְבָאוֹת는 전통적 ‘of hosts’보다 군사적 실체가 드러나는 ‘만군’으로 옮겼습니다.
- source_word: כִּי כֹה אָמַר
  english_pob_choice: For this is what ... says
  chosen_korean: 이는 ... 말씀하시는 것입니다
  alternatives_korean:
  - 이는 ... 이르시는 것입니다
  - '... 이렇게 말씀하십니다'
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 문체를 살리되, 현대 한국어에서 자연스러운 공손한 서술로 옮겼습니다.
- source_word: עוֹד אַחַת מְעַט הִיא
  english_pob_choice: Yet once more, in a little while
  chosen_korean: 아직 한 번 더, 잠시 후에
  alternatives_korean:
  - 다시 한 번, 얼마 지나지 않아
  - 한 번 더, 조금 있으면
  lexicon: HALOT
  rationale: 히브리어의 압축된 시간 표현을 ‘한 번 더’와 ‘잠시 후에’로 나누어, 반복성/최종성과 임박성을 함께 드러냈습니다.
- source_word: הֶחָרָבָה
  english_pob_choice: the dry land
  chosen_korean: 마른 땅
  alternatives_korean:
  - 마른 땅덩이
  - 마른 육지
  lexicon: HALOT
  rationale: ‘바다’와 대조되는 생성 질서의 항목으로서 ‘dry land’를 직역하되, 현대 한국어에서 가장 자연스러운 ‘마른 땅’을 택했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문의 신명사יהוה를 대체 호칭이 아니라 고유명으로 드러내기 위해 야훼를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언 문체의 직접 인용
  chosen_reading: “... 말씀하시는 것입니다”와 인용문 안의 미래형 “흔들겠습니다”
  alternative_readings:
  - ‘... 말씀하십니다’
  - ‘... 흔듭니다’
  rationale: 예언 발화의 선언성을 유지하면서, 한국어 본문에서는 공손한 합쇼체를 유지하고 직접 인용 안에서도 원문의 신적 행위 미래성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #1 and #3'
