source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שְׁאַל נָ֧א אֶת הַ/כֹּהֲנִ֛ים תּוֹרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/011.yaml
  text: 'Thus says Yahweh of hosts: Ask the priests for a ruling[a], saying,'
  footnotes:
  - marker: a
    text: Or 'about the law' or 'instruction.' The Hebrew torah here likely means a priestly legal ruling or instruction, not necessarily the Torah as a book.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이처럼 말씀하십니다. 「제사장들에게 율법에 관해 물어보십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 히브리어 תּוֹרָה는 일반적으로 ‘율법’이라고 번역될 수 있으나, 문맥상 제사장적 법적 판단이나 지침을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה / כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이처럼 말씀하십니다
  alternatives_korean:
  - 이렇게 말씀하십니다
  - 주께서 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 공식을 한국어 합쇼체로 자연스럽게 옮기되, 선지자 서문의 격식을 유지했습니다.
- source_word: יְהוָה צְבָא֑וֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  lexicon: HALOT
  rationale: POB의 야훼 원칙을 따르고, צְבָאוֹת은 관용적으로 ‘만군의’로 옮겨 신적 칭호의 위엄을 살렸습니다.
- source_word: שְׁאַל נָא
  english_pob_choice: Ask ...
  chosen_korean: 물어보십시오
  alternatives_korean:
  - 묻고 확인하십시오
  - 여쭈어보십시오
  lexicon: HALOT
  rationale: 제사장들에게 답을 구하라는 직접 명령으로서, 문맥상 ‘물어보십시오’가 가장 평이하고 명료합니다. 나아의 간청 뉘앙스는 정중한 어미에 흡수했습니다.
- source_word: תּוֹרָה
  english_pob_choice: for a ruling
  chosen_korean: 율법에 관해
  alternatives_korean:
  - 판결에 관해
  - 지침에 관해
  - 법에 관해
  lexicon: HALOT
  rationale: 여기서는 토라 책 전체보다 제사장적 법적 판단/가르침을 가리키므로, POB의 해석을 따라 ‘율법에 관해’로 옮겼습니다.
- source_word: אֶת הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들에게
  alternatives_korean:
  - 제사장들을
  - 제사장들에게서
  lexicon: HALOT
  rationale: 문맥상 질문의 수신자를 나타내므로 한국어에서는 여격으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 야훼의 이름이 직접 나오므로, 프로젝트 기본 원칙에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH → 야훼'
- issue: תּוֹרָה의 범위
  chosen_reading: 제사장적 율법 판단/가르침
  alternative_readings:
  - 모세오경
  - 율법 책 전체
  - 지침
  rationale: 뒤이어 나오는 문맥이 특정 제의·법적 사례에 대한 제사장의 판단을 다루므로, כאן의 토라는 성경 본문 전체가 아니라 실무적 판결을 뜻합니다.
  doctrine_reference: English audit trail lexical note on תּוֹרָה
