  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/ע֤וֹד הַ/זֶּ֨רַע֙ בַּ/מְּגוּרָ֔ה וְ/עַד הַ/גֶּ֨פֶן וְ/הַ/תְּאֵנָ֧ה וְ/הָ/רִמּ֛וֹן וְ/עֵ֥ץ הַ/זַּ֖יִת לֹ֣א נָשָׂ֑א מִן הַ/יּ֥וֹם הַ/זֶּ֖ה אֲבָרֵֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/019.yaml
  text: Is the seed still in the storehouse? Even the vine[a], the fig tree, the pomegranate, and the olive tree have not borne fruit. From this day on I will bless you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''I will bless,'' with the object implied by context; English supplies ''you'' for clarity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아직 종자[씨앗]가 곳간에 있습니까? 포도나무와 무화과나무와 석류나무와 감람나무는 열매를 맺지 못했습니다. 이 날부터 내가 너희에게 복을 주겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내가 복을 주겠다’로 되어 있으며 목적어는 문맥상 암시됩니다. 한국어는 자연성을 위해 대상 ‘너희’를 드러냈습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַע֤וֹד הַזֶּרַע
  english_pob_choice: Is the seed still in the storehouse?
  chosen_korean: 아직 종자[씨앗]가 곳간에 있습니까?
  alternatives_korean:
  - 아직 씨가 곳간에 있습니까?
  - 아직 종자가 저장실에 있습니까?
  lexicon: HALOT
  rationale: עוֹד의 지속 여부를 묻는 질문으로 보고 “아직”을 썼고, זֶרַע는 문맥상 파종용 종자이므로 “종자”를 기본으로 하되 현대 독자를 위해 “씨앗”을 병기했습니다.
- source_word: בַּמְּגוּרָה
  english_pob_choice: in the storehouse
  chosen_korean: 곳간에
  alternatives_korean:
  - 곡간에
  - 저장고에
  lexicon: HALOT
  rationale: מְגוּרָה는 곡식 저장 공간을 가리키므로, 한국어로는 농경적 뉘앙스가 살아 있는 “곳간”이 자연스럽습니다.
- source_word: וְעַד הַגֶּפֶן ... וְעֵץ הַזַּיִת
  english_pob_choice: Even the vine, the fig tree, the pomegranate, and the olive tree
  chosen_korean: 포도나무와 무화과나무와 석류나무와 감람나무
  alternatives_korean:
  - 포도덩굴과 무화과나무와 석류나무와 올리브나무
  - 포도나무와 무화과나무와 석류나무와 올리브나무
  lexicon: HALOT
  rationale: עַד의 확장적 연결을 한국어에서는 과도하게 드러내지 않고 병렬 목록으로 살렸습니다. גֶּפֶן은 문맥상 포도나무, עֵץ הַזַּיִת는 직역해 “감람나무”로 옮겼습니다.
- source_word: לֹא נָשָׂא
  english_pob_choice: have not borne fruit
  chosen_korean: 열매를 맺지 못했습니다
  alternatives_korean:
  - 열매를 맺지 않았습니다
  - 열매를 맺지 못한 상태였습니다
  lexicon: HALOT
  rationale: נָשָׂא는 문자적으로 ‘지니다/맺다’의 넓은 뜻이지만, 열매 맺는 수목 문맥에서는 한국어 관용구 “열매를 맺다”가 가장 직접적입니다. 영어 POB의 fruit를 한국어에서는 동사구로 자연스럽게 풀었습니다.
- source_word: אֲבָרֵךְ
  english_pob_choice: I will bless you
  chosen_korean: 이 날부터 내가 너희에게 복을 주겠습니다.
  alternatives_korean:
  - 이 날부터 내가 너희를 축복하겠습니다.
  - 이 날부터 내가 복을 주겠습니다.
  lexicon: HALOT
  rationale: ברך의 약속형을 미래로 옮겼고, 대상은 문맥상 공동체이므로 단수보다 복수 대명사 “너희”가 적절합니다. “복을 주다”는 구약 언어의 직접성을 살립니다.
theological_decisions:
- issue: 야훼의 약속이 암시하는 수신자 보충
  chosen_reading: 동사 목적어를 한국어에서 분명히 하여 “너희에게”를 넣었습니다.
  alternative_readings:
  - 목적어를 생략해 “내가 복을 주겠습니다”라고 할 수 있음
  rationale: 히브리어는 목적어를 생략하지만, 본문은 언약 공동체를 향한 예언이므로 한국어에서는 수신자를 밝혀 약속의 방향을 명료하게 했습니다. 이는 의미 추가가 아니라 암시된 대상의 명시입니다.
  doctrine_reference: Translation philosophy §1, §6
