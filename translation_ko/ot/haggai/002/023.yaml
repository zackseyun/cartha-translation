revisions:
- from: 그날에—만군의 야훼의 말씀입니다—내가 너를 데려오겠습니다, 스알디엘의 아들 스룹바벨, 내 종아. 만군의 야훼의 말씀입니다. 내가 너를 인장 반지처럼 만들겠습니다. 이는 내가 너를 선택하였기 때문입니다. 만군의 야훼의 말씀입니다.[a][b]
  to: 그날에 만군의 야훼께서 선언하십니다.[a] “내가 너를 데려오겠습니다. 스알디엘의 아들 스룹바벨아, 나의 종아.” 야훼께서 선언하십니다. “내가 너를 인장 반지처럼 삼겠습니다.[b] 이는 내가 너를 선택하였기 때문입니다.” 만군의 야훼께서 선언하십니다.
  rationale: 신탁 선언의 반복과 각 선언에 붙은 신명칭의 차이를 보존했습니다. ‘데려오겠습니다’는 אֶקָּחֲךָ의 기본 의미를 유지하면서, 뒤에 명시된 ‘선택하였습니다’와 같은 뜻으로 중복시키지 않습니다. 원문의 호격성 호칭은 자연스러운 한국어 어순으로 분리하였고, 인장 비유의 해석적 확장은 각주에만 제한했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:46Z'
