id: HAG.2.23
reference: Haggai 2:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֣וּא נְאֻם יְהוָ֣ה צְבָא֡וֹת אֶ֠קָּחֲ/ךָ זְרֻבָּבֶ֨ל בֶּן שְׁאַלְתִּיאֵ֤ל עַבְדִּ/י֙ נְאֻם יְהוָ֔ה וְ/שַׂמְתִּ֖י/ךָ כַּֽ/חוֹתָ֑ם כִּֽי בְ/ךָ֣ בָחַ֔רְתִּי נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/023.yaml
  text: On that day[a], declares Yahweh of Armies, I will take you, Zerubbabel son of Shealtiel, my servant, declares Yahweh, and I will make you like a signet ring, for I have chosen you[b], declares Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, traditionally, 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: b
    text: The image of a 'signet ring' suggests valued authority, ownership, and authentication; compare Jeremiah 22:24.
    reason: cross_reference
translation:
  language: ko
  text: 그날에 만군의 야훼께서 선언하십니다.[a] “내가 너를 데려오겠습니다. 스알디엘의 아들 스룹바벨아, 나의 종아.” 야훼께서 선언하십니다. “내가 너를 인장 반지처럼 삼겠습니다.[b] 이는 내가 너를 선택하였기 때문입니다.” 만군의 야훼께서 선언하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군의 야훼’는 히브리어 야훼 체바오트의 번역입니다. 전통적으로는 ‘만군의 여호와’ 또는 영어 ‘the LORD of Hosts’로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인장 반지’는 권위, 소유, 인증의 이미지를 함께 담습니다. 예레미야 22:24과 비교해 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그 날에
  - 그날
  lexicon: HALOT
  rationale: 예언적 시간 표지를 현대 한국어로 자연스럽게 옮기되, 종말론적·선포적 뉘앙스를 보존했습니다.
- source_word: נְאֻם יְהוָה צְבָא֡וֹת
  english_pob_choice: declares Yahweh of Armies
  chosen_korean: 만군의 야훼의 말씀입니다
  alternatives_korean:
  - 만군의 주님의 말씀입니다
  - 만군의 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: נְאֻם은 단순한 '말하다'보다 예언 선포 공식을 드러내므로 '말씀입니다'로 처리했고, יְהוָה는 본문 원칭을 따라 야훼로 옮겼습니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 하인
  - 내 노예
  lexicon: HALOT
  rationale: 이 문맥에서는 선택된 다윗계 통치자를 향한 소명/봉사 호칭이므로, 본문 의미를 과장하지 않는 '종'이 적절합니다.
- source_word: וְשַׂמְתִּ֖י/ךָ כַּֽ/חוֹתָ֑ם
  english_pob_choice: and I will make you like a signet ring
  chosen_korean: 내가 너를 인장 반지처럼 만들겠습니다
  alternatives_korean:
  - 내가 너를 도장처럼 만들겠습니다
  - 내가 너를 인장처럼 만들겠습니다
  lexicon: HALOT
  rationale: חותם은 단순한 인장보다 왕권·인증·소유의 이미지를 띠므로, 현대 독자가 즉시 떠올릴 수 있는 '인장 반지'로 구체화했습니다.
- source_word: כִּי בְךָ֣ בָחַ֔רְתִּי
  english_pob_choice: for I have chosen you
  chosen_korean: 이는 내가 너를 선택하였기 때문입니다
  alternatives_korean:
  - 내가 너를 택하였기 때문입니다
  - 내가 너를 선택했기 때문입니다
  lexicon: HALOT
  rationale: בחר의 핵심은 '선택하다'이므로, 앞선 상징을 뒷받침하는 이유절로 한국어 문장 구조를 분명히 했습니다.
theological_decisions:
- issue: 야훼의 이름과 만군의 칭호 처리
  chosen_reading: YHWH를 야훼로, צְבָאוֹת를 만군으로 옮겨 '만군의 야훼'를 유지했습니다.
  alternative_readings:
  - 여호와
  - 주 만군의 하나님
  rationale: 본문이 직접 사용하는 신명칭과 군대/군세의 호칭을 분리해 보존해야 하므로, 전통적 우회표현보다 원문 직결형을 택했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH → 야훼'
- issue: '''인장 반지''의 상징적 의미를 본문 밖으로 확장하지 않음'
  chosen_reading: 메시아적·다윗왕조적 함의를 암시하되 본문 본문에는 비유만 유지했습니다.
  alternative_readings:
  - 내 왕실의 인장 반지처럼
  - 내 선택된 왕의 표징처럼
  rationale: 예레미야 22:24와의 연관은 중요하지만, 히브리어 본문 자체는 비유를 넘어서지 않으므로 해석을 본문에 과잉 주입하지 않았습니다.
  doctrine_reference: Translation philosophy §3
