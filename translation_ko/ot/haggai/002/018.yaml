  naturalness: ‘이날부터, 곧 … 날부터, 곧 … 날부터’라는 현 문장은 쉼표와 ‘곧’의 반복으로 다소 부자연스럽습니다. ‘이날부터 계속하여, 곧 … 날부터 …’로 정리하면 현대 한국어 합쇼체에서 자연스럽고 원문의 시간 표지를 유지합니다. ‘마음에 새기십시오’의 반복도 한국어에서 권면의 강조로 자연스럽습니다.
