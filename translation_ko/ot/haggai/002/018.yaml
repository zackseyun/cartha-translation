translation:
  language: ko
  text: 이날부터 계속하여, 곧 아홉째 달 스물넷째 날부터 야훼의 성전 기초가 놓인 날부터 너희는 마음에 새기십시오. 마음에 새기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 성전이 세워지기 시작한 날부터’.
    reason: 히브리어 수동형 יֻסַּד는 성전의 기초가 놓인 일을 가리키며, 한국어로는 성전 건축의 시작이라는 표현으로도 옮길 수 있습니다.
lexical_decisions:
- source_word: שִׂימוּ נָא לְבַבְכֶם
  english_pob_choice: set your heart
  chosen_korean: 마음에 새기십시오
  alternatives_korean:
  - 마음을 두십시오
  - 깊이 생각하십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 인지보다 주의 깊은 내적 집중과 숙고를 요구하므로, 한국어에서는 자연스럽고도 강한 권면인 ‘마음에 새기십시오’로 옮겼습니다.
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  english_pob_choice: from this day onward
  chosen_korean: 이날부터
  alternatives_korean:
  - 이날 이후로
  - 이날로부터 앞으로
  lexicon: HALOT
  rationale: 현재 시점에서 앞으로 이어지는 시간을 가리키므로, 현대 한국어에서 간결하고 분명한 ‘이날부터’가 적절합니다.
- source_word: הֵיכַל יְהוָה
  english_pob_choice: the temple of Yahweh
  chosen_korean: 야훼의 성전
  alternatives_korean:
  - 야훼의 성소
  - 야훼의 궁전
  lexicon: HALOT
  rationale: 문맥상 הֵיכַל은 예루살렘 성전 건물을 가리키므로 ‘성전’이 가장 직접적입니다. 여호와 대신 야훼를 사용하여 원어의 신명 표기를 반영했습니다.
- source_word: יֻסַּד
  english_pob_choice: was founded
  chosen_korean: 기초가 놓인
  alternatives_korean:
  - 기초가 세워진
  - 세워진
  lexicon: HALOT
  rationale: יסד의 수동형은 건축의 기초가 놓이는 이미지를 담고 있으므로, ‘기초가 놓인’이 가장 소스에 가깝습니다.
theological_decisions:
- issue: 히브리어 명령형의 반복과 강도
  chosen_reading: 앞의 권면과 마지막 반복을 모두 살려 ‘마음에 새기십시오. 깊이 생각하십시오.’로 번역했습니다.
  alternative_readings:
  - ‘잘 살펴보십시오’
  - 중복을 하나로 줄여 ‘마음에 새기십시오’만 사용
  rationale: 본문은 같은 명령을 반복하여 주의를 환기하고 강조합니다. 한국어에서도 두 번의 권면을 남겨 반복 효과를 보존했습니다.
