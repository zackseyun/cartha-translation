id: HAG.2.2
reference: Haggai 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱמָר נָ֗א אֶל זְרֻבָּבֶ֤ל בֶּן שַׁלְתִּיאֵל֙ פַּחַ֣ת יְהוּדָ֔ה וְ/אֶל יְהוֹשֻׁ֥עַ בֶּן יְהוֹצָדָ֖ק הַ/כֹּהֵ֣ן הַ/גָּד֑וֹל וְ/אֶל שְׁאֵרִ֥ית הָ/עָ֖ם לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/002.yaml
  text: Speak now to Zerubbabel son of Shealtiel[a], governor of Judah, and to Joshua son of Jehozadak, the high priest, and to the remnant of the people, saying[b],
  footnotes:
  - marker: a
    text: Or 'the rest of the people.' The Hebrew term can denote those who remain and may also carry prophetic 'remnant' overtones.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Joshua'; some English traditions use 'Jeshua' where the shorter form of the name appears elsewhere.
    reason: alternative_reading
translation:
  language: ko
  text: “지금 스알디엘의 아들 스룹바벨, 유다의 총독과, 여호사닥의 아들 대제사장 여호수아와, 백성의 남은 자에게 말하여 이르라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름 형태를 따라 “스알디엘”로 옮겼습니다. 일부 영어 전통은 그리스어/영어형 “살라디엘” 계열을 씁니다.
    reason: alternative_reading
  - marker: b
    text: שְׁאֵרִית은 문맥상 “남은 자”와 “나머지”의 의미를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  english_pob_choice: Speak now
  chosen_korean: “지금 … 말하여 이르라”
  alternatives_korean:
  - “말하라”
  - “지금 말하라”
  lexicon: HALOT
  rationale: אֱמָר은 명령형으로 즉시 전달을 요구하며, נָא는 공손함보다 긴급성과 즉시성을 띱니다. 한국어에서는 “지금 … 말하여 이르라”로 이를 자연스럽게 살렸습니다.
- source_word: פַּחַת יְהוּדָה
  english_pob_choice: governor of Judah
  chosen_korean: 유다의 총독
  alternatives_korean:
  - 유다의 지방장관
  - 유다의 관원
  lexicon: HALOT
  rationale: פַּחַת은 페르시아 시대의 지방 통치관을 가리키므로, 현대어로는 “총독”이 가장 명확하고 관용적입니다.
- source_word: הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 수제사장
  lexicon: HALOT
  rationale: 직분 명칭으로 굳어진 표현인 “대제사장”이 히브리어 관직을 가장 분명하게 전달합니다.
- source_word: שְׁאֵרִית הָעָם
  english_pob_choice: the remnant of the people
  chosen_korean: 백성의 남은 자
  alternatives_korean:
  - 백성의 남은 무리
  - 백성의 남은 자들
  lexicon: HALOT
  rationale: שְׁאֵרִית은 문맥상 단순한 “나머지”를 넘어서 선지서적 “남은 자” 뉘앙스를 가질 수 있어, 그 긴장을 살려 번역했습니다.
theological_decisions:
- issue: שְׁאֵרִית의 선지서적 의미를 본문에서 어떻게 보존할지
  chosen_reading: “백성의 남은 자”로 옮겨, 단순 잔존 집단이면서도 선지서적 ‘남은 자’ 울림을 남겼습니다.
  alternative_readings:
  - “백성의 나머지”
  - “백성의 남은 무리”
  rationale: 하나님의 역사 속에 남겨진 공동체라는 암시를 지우지 않되, 본문이 말하는 범위를 넘겨 신학을 과잉 주입하지 않기 위함입니다.
  doctrine_reference: 예언서의 ‘남은 자’ 모티프를 보존하되 과도하게 체계화하지 않음
