revisions:
- from: 그러나 이제는 스룹바벨아, 힘내십시오—야훼의 선언입니다. 여호사닥의 아들 대제사장 여호수아야, 힘내십시오. 그리고 그 땅의 모든 백성도 힘내십시오—야훼의 선언입니다. 일하십시오. 내가 여러분과 함께하기 때문입니다—만군의 야훼의 선언입니다.[a]
  to: 그러나 이제 스룹바벨아, 힘내십시오. 야훼께서 선언하십니다. 대제사장 여호사닥의 아들 여호수아야, 힘내십시오. 이 땅의 모든 백성아, 힘내십시오. 야훼께서 선언하십니다. 내가 여러분과 함께하니, 일하십시오. 만군의 야훼께서 선언하십니다.[a]
  rationale: 문장 구조를 현대 표준 한국어 합쇼체에 맞추되, 원문의 반복되는 명령과 선언 공식을 유지했습니다. כִּי의 인과 관계는 한국어의 자연스러운 어순상 앞에 배치했으며, 의미는 변경하지 않았습니다. 각주 표지는 ‘만군의 야훼’에 직접 연결하여 전통적 명칭 대안의 범위를 분명히 했습니다.
  reviewer_model: gpt-5.6-terra
