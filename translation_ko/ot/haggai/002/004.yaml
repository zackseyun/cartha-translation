base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/004.yaml
  text: But now[a], be strong, Zerubbabel, declares Yahweh, and be strong, Joshua son of Jehozadak, the high priest, and be strong, all the people of the land, declares Yahweh, and work, for I am with you, declares Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이제는 스룹바벨아, 힘내십시오—야훼의 선언입니다. 여호사닥의 아들 대제사장 여호수아야, 힘내십시오. 그리고 그 땅의 모든 백성도 힘내십시오—야훼의 선언입니다. 일하십시오. 내가 여러분과 함께하기 때문입니다—만군의 야훼의 선언입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 전통적으로는 ‘만군의 여호와’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그러나 이제는
  alternatives_korean:
  - 이제
  - 그리고 이제는
  lexicon: HALOT
  rationale: 이전의 낙심/중단 상황에서 전환되는 대조를 살리기 위해 ‘그러나’로 adversative 힘을 드러냈습니다.
- source_word: חֲזַק / וַחֲזַק / וַחֲזַק
  english_pob_choice: be strong
  chosen_korean: 힘내십시오
  alternatives_korean:
  - 강해지십시오
  - 담대하십시오
  - 견고하십시오
  lexicon: HALOT
  rationale: 반복 명령의 핵심은 단순한 감정 위로보다 실제적 기력과 결단을 요구하는 것이어서, 현대 한국어에서 자연스럽고 명령의 뉘앙스를 살리는 ‘힘내십시오’를 택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: 예언 공식의 격식을 살리면서도 현대어로 자연스럽게 옮기기 위해 ‘선언입니다’를 사용했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 군대의 야훼
  lexicon: HALOT
  rationale: POB의 의미 중심 번역을 반영하되 한국어 성경 독자에게 익숙한 어순으로 ‘만군의 야훼’를 택했습니다.
theological_decisions:
- issue: 여호사닥의 아들 대제사장 여호수아에 대한 직함 처리
  chosen_reading: ‘대제사장’으로 제도적 직함을 분명히 드러냈습니다.
  alternative_readings:
  - ‘큰 제사장’
  - ‘최고 제사장’
  rationale: הַכֹּהֵן הַגָּדוֹל은 성전 제의의 공식 직함이므로, 한국어에서 표준적으로 이해되는 ‘대제사장’이 본문의 공적 권위를 가장 분명하게 전달합니다.
  doctrine_reference: 용례상 확립된 성경 직함 번역 원칙
