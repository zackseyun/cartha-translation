id: HAG.2.22
reference: Haggai 2:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָֽפַכְתִּי֙ כִּסֵּ֣א מַמְלָכ֔וֹת וְ/הִ֨שְׁמַדְתִּ֔י חֹ֖זֶק מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וְ/הָפַכְתִּ֤י מֶרְכָּבָה֙ וְ/רֹ֣כְבֶ֔י/הָ וְ/יָרְד֤וּ סוּסִים֙ וְ/רֹ֣כְבֵי/הֶ֔ם אִ֖ישׁ בְּ/חֶ֥רֶב אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/022.yaml
  text: I will overturn the throne of kingdoms[a], and I will destroy the strength of the kingdoms of the nations. I will overturn the chariot and its rider, and horses and their riders will go down[b], each by the sword of his brother.
  footnotes:
  - marker: a
    text: Or, 'I will overthrow the throne of kingdoms.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each by the sword of his brother,' an idiom for mutual slaughter or civil strife among the attackers.
    reason: cultural_note
translation:
  language: ko
  text: 내가 여러 왕국의 왕좌를 뒤엎고, 여러 민족의 왕국들의 세력을 멸망시키며, 병거와 거기에 탄 자들을 뒤엎겠습니다. 말들과 그 탄 자들은 각각 자기 형제의 칼에 쓰러질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘각각 자기 형제의 칼에’는 서로를 죽이는 일이나 내부 분쟁을 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָפַכְתִּי
  english_pob_choice: I will overturn
  chosen_korean: 뒤엎고
  alternatives_korean:
  - 엎고
  - 뒤집고
  - 뒤엎을 것이며
  lexicon: HALOT
  rationale: 판결 맥락의 הפך는 단순한 회전보다 권세를 전복하는 이미지를 가지므로, ‘뒤엎다’로 구체성과 강도를 살렸습니다.
- source_word: כִּסֵּא מַמְלָכ֔וֹת
  english_pob_choice: the throne of kingdoms
  chosen_korean: 나라들의 왕좌
  alternatives_korean:
  - 왕국들의 왕좌
  - 왕들의 보좌
  - 여러 나라의 왕좌
  lexicon: HALOT
  rationale: 히브리어가 단수 ‘왕좌’를 쓰므로, 한국어도 단수적 상징성을 유지하되 자연스러운 복수 속성을 반영해 ‘나라들의 왕좌’로 옮겼습니다.
- source_word: וְרֹכְבֶ֔י/הָ ... וְרֹכְבֵי/הֶ֔ם
  english_pob_choice: its rider ... their riders
  chosen_korean: 그 탄 자 ... 그 탄 자들
  alternatives_korean:
  - 그 위에 탄 자 ... 그 위에 탄 자들
  - 기마병 ... 기병들
  lexicon: HALOT
  rationale: רֹכֵב 계열은 문자적으로 ‘탄 자’이므로, 병거·말과의 병행 이미지를 살리기 위해 해설적 단어를 덧붙이지 않았습니다.
- source_word: אִישׁ בְּחֶרֶב אָחִיו
  english_pob_choice: each by the sword of his brother
  chosen_korean: 각각 자기 형제의 칼로
  alternatives_korean:
  - 각각 그의 형제의 칼로
  - 서로의 칼에 의해
  - 자기 형제의 칼에 의해
  lexicon: HALOT
  rationale: 관용구의 핵심은 상호 살육이므로, POB의 의미를 따라 ‘각각’으로 분배적 의미를 드러내면서도 히브리어의 직설적 이미지를 보존했습니다.
theological_decisions:
- issue: 전쟁 이미지의 직설성 유지
  chosen_reading: 병거와 그 탄 자, 말들과 그 탄 자들이 각각 자기 형제의 칼로 쓰러진다고 직설적으로 옮겼습니다.
  alternative_readings:
  - 전쟁 세력으로 완화해 옮김
  - 서로 싸워 무너진다고 의역함
  rationale: 본문은 심판으로 인해 적대 세력이 내부적으로 붕괴하는 장면을 구체적 전투 이미지로 제시하므로, 이를 완화하지 않고 그대로 드러내는 편이 본문의 힘을 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
