  to: 내가 여러 왕국의 왕좌를 뒤엎고, 여러 민족의 왕국들의 세력을 멸망시키며, 병거와 거기에 탄 자들을 뒤엎겠습니다. 말들과 그 탄 자들은 각각 자기 형제의 칼에 쓰러질 것입니다.[a]
