  naturalness: 합쇼체는 일관되고 자연스럽습니다. 그러나 ‘자기 옷자락에 넣어 나르다가’보다 ‘옷자락에 싸서 들고 가다가’가 옷자락의 접힌 부분(כָּנָף)에 고기를 담아 운반한다는 장면을 더 자연스럽고 분명하게 나타냅니다.
