id: HAG.2.12
reference: Haggai 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣ן יִשָּׂא אִ֨ישׁ בְּשַׂר קֹ֜דֶשׁ בִּ/כְנַ֣ף בִּגְד֗/וֹ וְ/נָגַ֣ע בִּ֠/כְנָפ/וֹ אֶל הַ/לֶּ֨חֶם וְ/אֶל הַ/נָּזִ֜יד וְ/אֶל הַ/יַּ֧יִן וְ/אֶל שֶׁ֛מֶן וְ/אֶל כָּל מַאֲכָ֖ל הֲ/יִקְדָּ֑שׁ וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ לֹֽא׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/012.yaml
  text: Suppose a man carries holy meat in the fold of his garment[a], and with his fold touches bread, stew, wine, oil, or any food—does it become holy? And the priests answered and said[b], “No.”
  footnotes:
  - marker: a
    text: Or “consecrated meat”; Hebrew “holy flesh.”
    reason: lexical_alternative
  - marker: b
    text: Or “corner/skirt of his garment.”
    reason: lexical_alternative
translation:
  language: ko
  text: 「만약 한 사람이 거룩한 고기를 자기 옷자락에 넣어 나르다가, 그 옷자락으로 빵이나 찌개나 포도주나 기름이나 어떤 음식에라도 닿는다면, 그것이 거룩하게 되겠습니까?」 제사장들이 대답하여 말했습니다. 「아닙니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성별된 고기”; 히브리어로는 “거룩한 육체”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “옷자락/끝자락”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: Suppose
  chosen_korean: 만약
  alternatives_korean:
  - 가령
  - 보십시오
  - 혹시
  lexicon: HALOT
  rationale: 가정적 사례를 제시하는 도입부로서, 한국어에서는 ‘만약’이 질문 상황의 조건문을 가장 자연스럽게 드러냅니다.
- source_word: בְּשַׂר קֹדֶשׁ
  english_pob_choice: holy meat
  chosen_korean: 거룩한 고기
  alternatives_korean:
  - 성별된 고기
  - 거룩한 육체
  - 성물의 고기
  lexicon: HALOT
  rationale: '제의적 성격의 고기를 가리키므로 ‘거룩한 고기’가 원문의 직역성과 가독성을 함께 살립니다. '
- source_word: בִּכְנַף בִּגְדוֹ
  english_pob_choice: in the fold of his garment
  chosen_korean: 자기 옷자락에 넣어 나르다가
  alternatives_korean:
  - 자기 옷의 끝자락에
  - 자기 옷자락 안에
  - 자기 겉옷의 날개에
  lexicon: HALOT
  rationale: כָּנָף는 옷자락/끝자락/날개를 가리킬 수 있는데, 여기서는 물건을 담아 운반하는 기능이 핵심이므로 한국어에서는 ‘옷자락에 넣어 나르다’로 기능을 드러냈습니다.
- source_word: הֲיִקְדָּשׁ
  english_pob_choice: does it become holy?
  chosen_korean: 거룩하게 되겠습니까?
  alternatives_korean:
  - 성별되겠습니까?
  - 거룩해지겠습니까?
  - 성물이 되겠습니까?
  lexicon: HALOT
  rationale: 접촉으로 거룩함이 전이되는지를 묻는 제의적 질문이므로, 상태 변화의 의미를 살려 ‘거룩하게 되다’로 옮겼습니다.
theological_decisions:
- issue: 제의적 거룩함의 전이 여부
  chosen_reading: 이 질문은 도덕적 거룩함이 아니라, 성물 접촉을 통해 다른 음식이 제의적으로 거룩해지는지 여부를 묻는 것으로 유지했습니다.
  alternative_readings:
  - 더 넓은 의미의 ‘거룩함’으로 일반화할 수 있음
  - 윤리적 정결의 문제로 확대할 수 있음
  rationale: 히브리어 문맥은 제사장들에게 던지는 성소법적 사례문이므로, 신학적 확대를 피하고 원문의 법적·제의적 긴장을 그대로 보존하는 것이 적절합니다.
  doctrine_reference: 원문 우선, 제의법의 의미를 도덕화하지 않음
