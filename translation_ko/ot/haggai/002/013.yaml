base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/013.yaml
  text: Then Haggai said[a], “If one who is unclean by contact with a dead body touches any of these, does it become unclean?” And the priests answered and said, “It becomes unclean.”
  footnotes:
  - marker: a
    text: Hebrew 'unclean of a person/soul,' an idiom meaning unclean through contact with a dead body.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 학개가 말했습니다. “시체로 말미암아 부정하게 된 사람[a]이 이 모든 것 중 하나를 만지면 그것이 부정하게 됩니까?” 제사장들이 대답하여 말했습니다. “부정하게 됩니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 טְמֵא נֶפֶשׁ는 이 문맥에서 시체와 접촉하여 부정하게 된 사람을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר חַגַּי
  english_pob_choice: Then Haggai said
  chosen_korean: 그러자 학개가 말했습니다
  alternatives_korean:
  - 그리고 학개가 말했습니다
  - 그때 학개가 말했습니다
  lexicon: WLC; HALOT
  rationale: 와우-연속의 순차적 진행을 한국어의 자연스러운 연결어 ‘그러자’로 살리면서, 이름은 통용 표기 ‘학개’로 옮겼습니다.
- source_word: טְמֵא נֶפֶשׁ
  english_pob_choice: one who is unclean by contact with a dead body
  chosen_korean: 시체로 말미암아 부정하게 된 사람
  alternatives_korean:
  - 죽은 몸과 접촉하여 부정하게 된 사람
  - 시체 접촉으로 부정한 사람
  lexicon: HALOT; priestly purity idiom
  rationale: 직역하면 ‘혼/생명’ 관련 표현이 되지만, 여기서는 মৃত체 접촉에 의한 부정이라는 관용구이므로 기능적으로 풀어 옮겼습니다.
- source_word: בְּכָל אֵלֶּה
  english_pob_choice: any of these
  chosen_korean: 이 모든 것 중 하나를
  alternatives_korean:
  - 이것들 중 아무것이나
  - 이 모든 것 가운데 하나를
  lexicon: HALOT
  rationale: 문맥상 앞선 제사물들을 가리키며, 조건문의 분배적 의미를 한국어에서 ‘중 하나’로 자연스럽게 반영했습니다.
- source_word: יִטְמָא
  english_pob_choice: does it become unclean? / It becomes unclean.
  chosen_korean: 부정하게 됩니까? … 부정하게 됩니다
  alternatives_korean:
  - 부정해집니까? … 부정해집니다
  - 부정하게 되겠습니까? … 부정하게 됩니다
  lexicon: HALOT
  rationale: 같은 어근을 질문과 대답에서 반복해 성소 정결 판정을 명확히 드러내기 위해 ‘부정하게 되다’를 유지했습니다.
theological_decisions:
- issue: 정결/부정 언어의 성격
  chosen_reading: 도덕적 타락이 아니라 제의적·의식적 부정을 뜻하는 것으로 옮겼습니다.
  alternative_readings:
  - 도덕적으로 더럽혀지다
  - 종교적으로 더럽혀지다
  rationale: 학개 2:13의 문맥은 토라의 정결 규정에 따른 상태 변화를 묻는 것이므로, 부정의 범주를 의식적 정결 개념으로 유지해야 합니다.
  doctrine_reference: 레위기 정결법, 학개 2:11-14 문맥
