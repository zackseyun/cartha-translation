  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה שֵׁנִית֙ אֶל חַגַּ֔י בְּ/עֶשְׂרִ֧ים וְ/אַרְבָּעָ֛ה לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/020.yaml
  text: And the word of Yahweh came a second time to Haggai on the twenty-fourth day of the month[a], saying,
  footnotes:
  - marker: a
    text: Or 'Yahweh.' The Hebrew has the divine name יְהוָה.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 말씀이 둘째로 학개에게 임하였는데, 그 달 스물넷째 날에 이르러 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '야훼'. 히브리어 본문에는 하나님의 이름 יְהוָה가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  english_pob_choice: And the word of Yahweh came
  chosen_korean: 야훼의 말씀이 임하였는데
  alternatives_korean:
  - 야훼의 말씀이 왔는데
  - 야훼의 말씀이 있었습니다
  lexicon: HALOT
  rationale: 예언서의 정형적 계시 공식인 “말씀이 임하다”를 살려 מקור의 사건성을 자연스럽게 옮겼습니다. '오다'도 가능하지만, 한국어 성경 문체에서는 '임하다'가 더 공적이고 계시적입니다.
- source_word: שֵׁנִית
  english_pob_choice: a second time
  chosen_korean: 둘째로
  alternatives_korean:
  - 두 번째로
  - 다시
  lexicon: HALOT
  rationale: '''다시''보다 ''둘째로''가 반복의 순서를 더 분명히 드러내며, 원문의 부사적 의미를 간결하게 반영합니다.'
- source_word: אֶל חַגַּי
  english_pob_choice: to Haggai
  chosen_korean: 학개에게
  alternatives_korean:
  - 학개에게로
  - 학개를 향해
  lexicon: HALOT
  rationale: 발화·계시 동사와 함께 쓰인 אֶל은 한국어에서 자연스럽게 여격 '에게'로 옮기는 것이 가장 직접적입니다.
- source_word: בְּעֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ
  english_pob_choice: on the twenty-fourth day of the month
  chosen_korean: 그 달 스물넷째 날에
  alternatives_korean:
  - 그 달의 스물넷째 날에
  - 그 달 스물네째 날에
  lexicon: HALOT
  rationale: 달력 표현을 한국어 관용으로 자연화하되, חודש의 정관적 의미를 살려 '그 달'로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시되
  - 말하여
  lexicon: HALOT
  rationale: 다음 절의 직접화법을 여는 표지이므로, 한국어에서는 종결을 미루는 방식보다 앞 문장에 매끄럽게 연결되는 서술로 처리했습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: יהוה는 '야훼'로 옮기고, 제목어 '주'로 대체하지 않았습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 고유한 언약 이름 יְהוָה를 직접 사용하므로, 본 프로젝트의 기준에 따라 개인 이름성을 보존하는 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
