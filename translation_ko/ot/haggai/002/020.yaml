revisions:
- from: 야훼의 말씀이 둘째로 학개에게 임하였는데, 그 달 스물넷째 날에 이르러 말씀하셨습니다.[a]
  to: 야훼의 말씀이 그 달 스물넷째 날 학개에게 두 번째로 임했습니다. 말씀하시기를,[a]
  rationale: 히브리어 어순과 기능에 맞게 날짜를 계시 사건에 직접 연결하고, שֵׁנִית를 ‘두 번째로’로 명료화했습니다. 또한 לֵאמֹר가 다음 절의 직접화법을 도입하는 기능을 보존했습니다. 야훼라는 신명 표기는 유지하되, 중복된 ‘또는 야훼’ 각주를 원문 근거를 설명하는 각주로 수정했습니다.
