  rationale: 다음 절의 직접화법을 여는 표지이므로, 한국어에서는 종결을 미루는 방식보다 앞 문장에 매끄럽게 연결되는 서술로 처리했습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: יהוה는 '야훼'로 옮기고, 제목어 '주'로 대체하지 않았습니다.
  alternative_readings:
