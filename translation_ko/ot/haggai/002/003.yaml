id: HAG.2.3
reference: Haggai 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֤י בָ/כֶם֙ הַ/נִּשְׁאָ֔ר אֲשֶׁ֤ר רָאָה֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה בִּ/כְבוֹד֖/וֹ הָ/רִאשׁ֑וֹן וּ/מָ֨ה אַתֶּ֜ם רֹאִ֤ים אֹת/וֹ֙ עַ֔תָּה הֲ/ל֥וֹא כָמֹ֛/הוּ כְּ/אַ֖יִן בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/003.yaml
  text: Who among you is left who saw this house in its former glory? And how do you see it now? Is it not as nothing in your eyes?[a][b]
  footnotes:
  - marker: a
    text: Or 'this temple.' The Hebrew literally says 'this house,' a common way to refer to the temple.
    reason: lexical_alternative
  - marker: b
    text: Or 'in its first glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 가운데 이 집[a]이 이전의 영광을 지니고 있던 때에[b] 본 사람이 누가 있습니까? 너희가 이제 그것을 어떻게 봅니까? 그것이 너희 눈에 아무것도 아닌 것처럼 보이지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성전.” 히브리어는 문자적으로 “이 집”이라고 하며, 이 문맥에서는 성전을 가리키는 흔한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그 처음의 영광을 지니고 있던 때에.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם הַנִּשְׁאָר
  english_pob_choice: Who among you is left
  chosen_korean: 너희 가운데에 남은 자 중에서 누가
  alternatives_korean:
  - 너희 가운데에 남은 사람이 누가
  - 너희 중에 남아 있는 자가 누가
  lexicon: HALOT
  rationale: 남은 자/남아 있는 자는 히브리어 니팔 분사의 잔존·생존 뉘앙스를 살리며, ‘너희 가운데에’는 집단 내부에서 물음을 던지는 구조를 자연스럽게 드러냅니다.
- source_word: הַבַּיִת הַזֶּה
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 전
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘집’이지만 이 문맥에서 성전을 가리키므로, 원문 어휘를 보존하되 한국어에서는 이해가 쉬운 ‘이 집’으로 옮겼습니다.
- source_word: בִּכְבוֹדוֹ הָרִאשׁוֹן
  english_pob_choice: in its former glory
  chosen_korean: 그전의 영광 속에서
  alternatives_korean:
  - 이전의 영광 속에서
  - 처음의 영광 속에서
  lexicon: HALOT
  rationale: כָבוֹד의 ‘영광/위엄’ 의미와 시간 대비를 함께 살리기 위해 ‘그전의 영광’으로 옮겼고, 소유격 ‘-וֹ’는 앞의 집을 가리키도록 처리했습니다.
- source_word: בְּעֵינֵיכֶם
  english_pob_choice: in your eyes
  chosen_korean: 너희 눈에는
  alternatives_korean:
  - 너희 보기에
  - 너희 생각에는
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 평가·판단의 관점을 드러내되, 한국어에서도 자연스러운 ‘눈에는’ 표현을 유지했습니다.
theological_decisions:
- issue: 수사적 질문의 강도와 평가적 의미
  chosen_reading: 연속된 수사 의문문으로 옮겨, 백성에게 옛 성전과 현재 성전의 대비를 스스로 판단하게 하는 톤을 유지했습니다.
  alternative_readings:
  - 부드러운 진술형으로 완화
  - 명시적 비판문으로 의역
  rationale: 본문은 정보 전달보다 평가와 자각을 촉구하는 수사적 질문이므로, 질문형을 유지해야 원문의 예언적 압박감이 보존됩니다.
  doctrine_reference: 예언서 수사와 회개 촉구의 문맥
