id: HAG.2.5
reference: Haggai 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶֽת הַ/דָּבָ֞ר אֲשֶׁר כָּרַ֤תִּי אִתְּ/כֶם֙ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרַ֔יִם וְ/רוּחִ֖/י עֹמֶ֣דֶת בְּ/תוֹכְ/כֶ֑ם אַל תִּירָֽאוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/005.yaml
  text: As for the promise that I made with you when you came out of Egypt[a], and my Spirit is standing in your midst[b]; do not fear.
  footnotes:
  - marker: a
    text: Or 'the word that I cut with you,' that is, covenant language; compare the idiom 'cut a covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my Spirit remains among you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이집트에서 너희를 이끌어 내던 날 너희와 맺은 말씀은 이러합니다[a]. 내 영은 너희 가운데 서 있습니다[b]. 그러니 두려워하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희와 끊은 말씀’, 곧 언약을 가리키는 표현입니다. ‘언약을 맺다’와 같은 관용을 비교해 보십시오.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 영이 너희 가운데 머물러 있습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַדָּבָר
  english_pob_choice: As for the promise
  chosen_korean: 말씀은 이러합니다
  alternatives_korean:
  - 약속은 이렇습니다
  - 말씀이었습니다
  - 언약은 이렇습니다
  lexicon: HALOT
  rationale: דָּבָר는 기본적으로 ‘말씀/일’을 뜻하지만, 여기서는 출애굽 때 맺은 언약적 맥락을 가리키므로 직역만으로는 어색합니다. 한국어 본문에는 소스의 ‘말씀’과 관계를 살리되, 문맥상 지시를 드러내는 표현으로 옮겼습니다.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  english_pob_choice: that I made with you
  chosen_korean: 너희와 맺은
  alternatives_korean:
  - 너희와 언약을 맺은
  - 너희와 끊은
  - 너희와 체결한
  lexicon: HALOT
  rationale: כרת는 언약을 ‘맺다/끊다’의 관용을 띠므로, 한국어에서는 자연스러운 ‘맺은’으로 처리하되 언약 관계의 의미를 보존했습니다. ‘끊은’은 소스의 비유적 감각은 살리지만 한국어 본문으로는 너무 생경합니다.
- source_word: וְרוּחִי
  english_pob_choice: and my Spirit
  chosen_korean: 내 영은
  alternatives_korean:
  - 내 영은
  - 내 성령은
  - 나의 영은
  lexicon: HALOT
  rationale: 여기서는 하나님의 임재를 가리키는 ‘영’으로 보되, 히브리어의 범위를 지나치게 좁히지 않기 위해 ‘성령’ 대신 ‘영’을 택했습니다. 소유 관계를 분명히 하는 가장 간결한 형태는 ‘내 영’입니다.
- source_word: עֹמֶדֶת בְּתוֹכְכֶם
  english_pob_choice: my Spirit is standing in your midst
  chosen_korean: 너희 가운데 서 있습니다
  alternatives_korean:
  - 너희 가운데 머물러 있습니다
  - 너희 가운데 있습니다
  - 너희 안에 서 있습니다
  lexicon: HALOT
  rationale: 분사 עֹמֶדֶת는 지속적 현재를 나타내므로, 영어 POB의 ‘is standing’을 따라 ‘서 있습니다’로 옮겼습니다. ‘머물러 있습니다’는 뜻은 자연스럽지만, 동작 이미지가 약해집니다.
- source_word: אַל תִּירָאוּ
  english_pob_choice: do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워하지 마라
  - 두려워하지 마세요
  lexicon: HALOT
  rationale: 예언적 권면의 종결 명령으로서 표준적이고 격식을 갖춘 합쇼체가 적절합니다. ‘두려워하지 마십시오’는 소스의 엄중한 금지와도 잘 맞습니다.
theological_decisions:
- issue: 여호와의 출애굽 언약 문맥을 한국어에서 어떻게 드러낼지
  chosen_reading: ‘내가 이집트에서 너희를 이끌어 내던 날 너희와 맺은 말씀’으로, 언약 어휘를 노골적으로 ‘언약’이라 바꾸기보다 맥락 속 의미를 드러내는 방식으로 처리했습니다.
  alternative_readings:
  - ‘너희와 맺은 언약’
  - ‘너희와 언약을 맺은 말씀’
  rationale: 히브리어 본문은 명사 ‘언약’이 아니라 ‘말씀/것’(דָּבָר)을 쓰므로, 한국어 본문도 그 어휘를 완전히 대체하지 않도록 했습니다. 동시에 כרת의 언약적 무게는 ‘맺은’으로 보존했습니다.
  doctrine_reference: 'Translation philosophy #1, #5'
- issue: ‘내 영’의 번역에서 성령 용어를 사용할지 여부
  chosen_reading: ‘내 영’
  alternative_readings:
  - ‘내 성령’
  - ‘내 숨’
  rationale: 문맥상 하나님의 능동적 임재를 가리키지만, 히브리어 רוּחַ의 기본 의미 범위를 고려하면 여기서 곧바로 교회적 용어인 ‘성령’을 고정하는 것은 과합니다. 따라서 소스의 긴장을 유지하는 ‘영’을 택했습니다.
  doctrine_reference: Glossary defaults for πνεῦμα / רוח
