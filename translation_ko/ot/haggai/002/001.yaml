  rationale: 히브리어의 인용 도입 표지를 한국어에서는 중복 어미를 피하면서도 직접 발화를 자연스럽게 여는 방식으로 처리했습니다.
theological_decisions:
- issue: 예언 공식의 인격적·중개적 표현
  chosen_reading: ‘야훼의 말씀이 선지자 학개의 손을 통하여 임하여 말씀하셨습니다’로, 계시의 도래와 예언자 매개의 양쪽을 모두 살렸습니다.
  alternative_readings:
  - ‘야훼의 말씀이 학개에게 임하셨습니다’
  - ‘야훼의 말씀이 학개를 통하여 왔습니다’
  rationale: 본문은 단순 전달보다 ‘말씀이 임함’과 ‘손을 통한 대리’를 함께 강조하므로, 두 층위를 모두 드러내는 표현이 원문의 신학적 긴장을 가장 잘 보존합니다.
  doctrine_reference: 예언 계시와 예언자 매개에 관한 일반적 성경신학
