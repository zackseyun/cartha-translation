  text: וְ/הִרְעַשְׁתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וּ/בָ֖אוּ חֶמְדַּ֣ת כָּל הַ/גּוֹיִ֑ם וּ/מִלֵּאתִ֞י אֶת הַ/בַּ֤יִת הַ/זֶּה֙ כָּב֔וֹד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/007.yaml
  text: And I will shake all the nations[a], and the treasures of all the nations will come, and I will fill this house with glory, says Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, following a traditional rendering, 'the desire of all the nations will come.' The Hebrew may also mean 'the desirable things' or 'treasures' of the nations; the plural verb favors a collective sense.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 모든 민족들을 뒤흔들겠습니다. 모든 민족의 보물들이 올 것이며, 내가 이 집에 영광을 채우겠습니다. 만군의 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적 번역을 따라 ‘만국의 소망이 올 것이다.’ 히브리어는 ‘모든 민족의 소중한 것들’ 또는 ‘보물들’을 뜻할 수도 있으며, 복수 동사는 집합적 의미를 더 강하게 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְעַשְׁתִּי
  english_pob_choice: I will shake
  chosen_korean: 뒤흔들겠습니다
  alternatives_korean:
  - 흔들겠습니다
  - 떨리게 하겠습니다
  lexicon: HALOT
  rationale: 히필형의 ‘흔들게 하다’라는 사역적 의미를 살리면서, 현대 한국어에서 하나님의 주권적 개입을 자연스럽게 드러냅니다.
- source_word: כָּל הַגּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 민족들
  alternatives_korean:
  - 모든 나라들
  - 모든 이방 민족들
  lexicon: HALOT
  rationale: 예언서 문맥에서 גּוֹיִם은 민족/나라들을 가리키므로, 신학적 범주화보다 문맥상 평이한 ‘민족들’을 택했습니다.
- source_word: חֶמְדַּת כָּל הַגּוֹיִם
  english_pob_choice: the treasures of all the nations
  chosen_korean: 모든 민족의 보물들
  alternatives_korean:
  - 모든 민족의 소원
  - 모든 민족의 귀한 것들
  lexicon: HALOT
  rationale: 복수 동사와 결합한 점을 따라 단수 인격적 해석보다 집합적·물질적 의미를 살려 ‘보물들’로 옮겼습니다.
- source_word: כָּבוֹד
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 광채
  lexicon: HALOT
  rationale: 성전과 하나님의 임재 맥락에서 כָּבוֹד는 ‘영광’이 가장 직접적으로 본래 의미와 신학적 울림을 보존합니다.
theological_decisions:
- issue: חֶמְדַּת כָּל־הַגּוֹיִם의 해석
  chosen_reading: ‘모든 민족의 보물들’이라는 집합적 해석을 본문에 반영했습니다.
  alternative_readings:
  - '전통적 메시아적 독법: ‘만국의 소망’'
  - ‘모든 민족의 귀한 것들’
  rationale: 히브리어 복수 동사 וּבָאוּ가 단수 인물보다 복수 집합을 지지하므로, 전통 번역의 메시아적 가능성은 본문 각주 대신 의미 차이로만 남겼습니다.
  doctrine_reference: 원문 우선과 해석의 긴장 보존
