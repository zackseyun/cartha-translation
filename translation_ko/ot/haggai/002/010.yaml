  yaml_path: translation/ot/haggai/002/010.yaml
  text: On the twenty-fourth day of the ninth month, in the second year of Darius, the word of Yahweh came to Haggai the prophet, saying,
translation:
  language: ko
  text: 다리오 왕의 제이년, 제구월 스무 나흗날에 야훼의 말씀이 예언자 학개에게 임하여 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 예언 공식의 היה는 단순한 존재보다 말씀의 ‘도래/임함’을 가리키는 관용구로 이해했습니다.
    reason: theological_note
lexical_decisions:
- source_word: בְּ/עֶשְׂרִים וְ/אַרְבָּעָה לַ/תְּשִׁיעִי
  english_pob_choice: on the twenty-fourth day of the ninth month
  chosen_korean: 제구월 스무 나흗날에
  alternatives_korean:
  - 구월 스물넷째 날에
  - 제구월 이십사일에
  lexicon: HALOT
  rationale: 히브리어 날짜 공식은 한국어에서도 관용적으로 ‘-날에’로 풀어야 자연스럽고, 서수형 ‘스무 나흗날’이 원문의 날짜 표지를 가장 직접적으로 반영합니다.
- source_word: בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָוֶשׁ
  english_pob_choice: in the second year of Darius
  chosen_korean: 다리오 왕의 제이년
  alternatives_korean:
  - 다리오의 이년
  - 다리오 왕 제2년
  lexicon: HALOT
  rationale: בִּשְׁנַת은 즉위 연호 공식이므로 ‘제이년’으로 옮기되, לְדָרְיָוֶשׁ은 소유보다 연호의 기준 인물을 나타내므로 ‘다리오 왕의’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 신명은 제목이 아니라 고유명사이므로 POB의 원칙대로 ‘야훼’로 옮겨, 예언 공식에서 하나님의 이름 자체가 드러나게 했습니다.
- source_word: הָיָה דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh came
  chosen_korean: 야훼의 말씀이 … 임하여
  alternatives_korean:
  - 야훼의 말씀이 … 왔습니다
  - 야훼의 말씀이 … 있었습니다
  lexicon: HALOT
  rationale: 히브리어 היה + דְּבַר는 예언 공식으로서 단순한 ‘있었다’보다 ‘임하다’가 전달력이 높고, 말씀의 도래라는 문맥 효과를 더 잘 살립니다.
- source_word: אֶל חַגַּי הַ/נָּבִיא
  english_pob_choice: to Haggai the prophet
  chosen_korean: 예언자 학개에게
  alternatives_korean:
  - 학개 선지자에게
  - 학개 예언자에게
  lexicon: HALOT
  rationale: הַנָּבִיא는 호칭으로서 직분을 밝히므로 ‘예언자’가 원문 기능을 직접 반영합니다. 고유명사 ‘학개’는 한국어 성서 관용형을 따랐습니다.
theological_decisions:
- issue: 예언 공식에서 신적 말씀의 도래를 어떻게 표현할지
  chosen_reading: ‘야훼의 말씀이 예언자 학개에게 임하여 말씀하셨습니다’로, 말씀의 도래와 직접 화법의 개시를 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼의 말씀이 예언자 학개에게 왔습니다’
  - ‘야훼의 말씀이 예언자 학개에게 있었습니다’
  rationale: 히브리어 예언 수식구는 단순 정보 전달이 아니라 하나님의 계시 개시를 나타내므로, ‘임하다’가 그 신학적 무게를 가장 잘 전달합니다.
  doctrine_reference: 예언과 계시의 매개에 대한 성경적 표현 관례
