translation:
  language: ko
  text: “유다 총독 스룹바벨에게 이렇게 말하십시오. ‘나는 하늘과 땅을 흔들고 있습니다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 하늘과 땅을 흔들 것입니다.” 히브리어 분사는 임박한 미래 또는 단순 미래로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  english_pob_choice: Speak
  chosen_korean: 말하여라
  alternatives_korean:
  - 말하시오
  - 전하라
  lexicon: HALOT
  rationale: 예언적 전달 명령의 힘을 살리면서도 한국어에서 자연스러운 직접 명령형으로 옮겼습니다.
- source_word: פַּחַת יְהוּדָה
  english_pob_choice: governor of Judah
  chosen_korean: 유다 총독
  alternatives_korean:
  - 유다 지방관
  - 유다 관장
  lexicon: HALOT
  rationale: פַּחַת은 행정 관직을 가리키므로, 현대 독자가 즉시 이해할 수 있는 ‘총독’을 택했습니다.
- source_word: מַרְעִישׁ
  english_pob_choice: am shaking
  chosen_korean: 흔들고 있습니다
  alternatives_korean:
  - 흔듭니다
  - 흔들 것입니다
  lexicon: HALOT
  rationale: 히필 분사의 지속·진행 감각을 살려 현재진행형으로 옮겼고, 영어 POB의 ‘am shaking’과도 맞췄습니다.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  english_pob_choice: the heavens and the earth
  chosen_korean: 하늘과 땅
  alternatives_korean:
  - 하늘과 지상
  - 하늘과 온 땅
  lexicon: HALOT
  rationale: 우주적 총체성을 유지하면서도 한국어 성경 문맥에서 가장 자연스러운 짝을 선택했습니다.
theological_decisions:
- issue: 미래성 대 현재진행형
  chosen_reading: 하나님이 이미 시작하신 심판적 흔들림을 현재진행형으로 표현했습니다.
  alternative_readings:
  - ‘흔들 것입니다’처럼 단순 미래로 옮길 수 있습니다.
  - ‘흔들고 있습니다’는 임박한 미래를 뜻하는 것으로도 읽힙니다.
  rationale: 히브리어 분사는 문맥상 임박한 미래 또는 현재적 진행으로 읽힐 수 있으므로, 본문이 가진 긴박감과 선언성을 살리되 단정적 미래로 고정하지 않았습니다.
  doctrine_reference: 예언적 분사의 시상 해석
