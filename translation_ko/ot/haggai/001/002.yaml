base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/002.yaml
  text: 'Thus says Yahweh of hosts: These people say[a], “The time has not come[b], the time for the house of Yahweh to be rebuilt.”'
  footnotes:
  - marker: a
    text: Or, more literally, “This people says.” The Hebrew wording may carry a tone of distance or rebuke.
    reason: lexical_alternative
  - marker: b
    text: Or “to be built.” The Hebrew infinitive itself does not explicitly include the prefix re-, but the post-exilic context indicates rebuilding.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. “이 백성이[a] 말합니다. ‘야훼의 집이 다시 건축될[b] 때가 아직 오지 않았다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하여, “이 백성이 말한다.” 히브리어의 이 표현에는 거리감이나 책망의 어조가 담길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “건축될.” 히브리어 부정사는 자체로 ‘다시’라는 뜻을 명시하지 않지만, 포로기 이후의 문맥은 성전 재건을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
