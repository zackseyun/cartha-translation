id: HAG.1.2
reference: Haggai 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר הָ/עָ֤ם הַ/זֶּה֙ אָֽמְר֔וּ לֹ֥א עֶת בֹּ֛א עֶת בֵּ֥ית יְהוָ֖ה לְ/הִבָּנֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/002.yaml
  text: 'Thus says Yahweh of hosts: These people say[a], “The time has not come[b], the time for the house of Yahweh to be rebuilt.”'
  footnotes:
  - marker: a
    text: Or, more literally, “This people says.” The Hebrew wording may carry a tone of distance or rebuke.
    reason: lexical_alternative
  - marker: b
    text: Or “to be built.” The Hebrew infinitive itself does not explicitly include the prefix re-, but the post-exilic context indicates rebuilding.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. “이 백성이 말하기를, ‘야훼의 집을 지을 때가 아직 오지 않았다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 말씀하시기를
  lexicon: WLC + POB messenger formula
  rationale: 예언자적 전언 공식의 엄숙한 문체를 살리되, 현대 한국어에서 자연스러운 합쇼체로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 주
  - 만군의 여호와
  lexicon: WLC
  rationale: 고유명사 יְהוָה는 기본 원칙대로 야훼로 옮기고, צְבָאוֹת는 성경적 관용구인 ‘만군의’로 처리해 직역성과 가독성을 함께 살렸습니다.
- source_word: הָעָם הַזֶּה
  english_pob_choice: These people
  chosen_korean: 이 백성이
  alternatives_korean:
  - 이 백성은
  - 저 백성이
  lexicon: WLC
  rationale: 지시 대명사의 거리감과 약한 책망 뉘앙스를 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘이 백성’이 적절합니다.
- source_word: לֹא עֶת בֹּא עֶת
  english_pob_choice: The time has not come, the time
  chosen_korean: 때가 아직 오지 않았다
  alternatives_korean:
  - 때가 아직 이르지 않았다
  - 지금은 때가 아니다
  lexicon: WLC
  rationale: 히브리어의 압축된 반복을 한국어에서는 과도하게 어색하지 않게 ‘때가…오지 않았다’로 옮겨, 부정과 지연의 의미를 유지했습니다.
- source_word: בֵּית יְהוָה לְהִבָּנוֹת
  english_pob_choice: the house of Yahweh ... to be rebuilt
  chosen_korean: 야훼의 집을 지을
  alternatives_korean:
  - 야훼의 집을 다시 지을
  - 야훼의 집을 세울
  lexicon: WLC
  rationale: 히브리어는 기본적으로 ‘지어지다/건축되다’의 의미이며, 문맥상 성전 재건을 가리키므로 한국어는 간결하게 ‘지을’로 처리했습니다.
theological_decisions:
- issue: 성전 재건의 함의
  chosen_reading: ‘야훼의 집을 지을 때가 아직 오지 않았다’로 옮겨, 단순한 건축이 아니라 포로기 이후 성전 재건을 가리키는 문맥을 유지했습니다.
  alternative_readings:
  - ‘야훼의 집이 세워질 때가 아직 오지 않았다’
  - ‘야훼의 집을 다시 지을 때가 아직 오지 않았다’
  rationale: 문맥상 재건이 분명하지만, 본문 자체의 동사를 지나치게 풀어 쓰면 원문 표현을 넘을 수 있으므로 가장 절제된 방식으로 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
- issue: 야훼의 이름 표기
  chosen_reading: 고유명사 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 실제로 신적 고유명을 사용하므로, 호칭 대체 없이 이름 자체를 드러내는 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
