base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/010.yaml
  text: Therefore the heavens above you have withheld the dew[a], and the earth has withheld its produce.
  footnotes:
  - marker: a
    text: Or 'the land has withheld its yield.' The Hebrew אֶרֶץ can mean 'earth' or 'land,' and יְבוּל can be rendered 'produce' or 'yield.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희 위의 하늘은 이슬을 내리지 않았고, 땅은 그 소산을 내지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘국토’를 뜻할 수 있고, יְבוּל은 ‘소산’ 또는 ‘소출’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 이에
  lexicon: HALOT
  rationale: 앞선 책망과 결과를 잇는 인과·결과 접속어로 자연스럽고, 본문의 추론 흐름을 분명하게 드러냅니다.
- source_word: שָמַיִם
  english_pob_choice: the heavens
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘
  lexicon: HALOT
  rationale: 한국어에서는 복수형을 굳이 드러내기보다 ‘하늘’이 자연스럽고, ‘너희 위의’와 결합해 공간적 대조를 살릴 수 있습니다.
- source_word: כָּלְאוּ ... מִטָּל
  english_pob_choice: have withheld the dew
  chosen_korean: 이슬을 거두어들이고
  alternatives_korean:
  - 이슬을 막고
  - 이슬을 보류하고
  - 이슬을 거두지 않고
  lexicon: HALOT
  rationale: כלא는 ‘막다/가두다’의 뜻이지만 이 문맥에서는 하늘이 이슬을 내리지 않도록 ‘거두어들이다’로 풀어 주면, 비·이슬의 공급 중단이라는 효과를 자연스럽게 전달합니다.
- source_word: יְבוּל
  english_pob_choice: its produce
  chosen_korean: 그 소산
  alternatives_korean:
  - 그 산출
  - 그 수확
  - 그 생산물
  lexicon: HALOT
  rationale: יְבוּל은 농경적 ‘산출물/소출’을 가리키므로, 보다 성경적인 어감의 ‘소산’이 본문의 농업적 의미를 짧고 정확하게 담습니다.
theological_decisions:
- issue: 천상·지상 병행 구조
  chosen_reading: ‘하늘’과 ‘땅’을 병렬로 두어, 위로부터의 생명 공급이 차단되고 아래의 생산도 막힌다는 심판의 대응 구조를 살렸습니다.
  alternative_readings:
  - ‘하늘들’과 ‘땅’으로 더 문자적으로 옮기는 방법
  - ‘하늘’과 ‘대지’로 시적으로 조정하는 방법
  rationale: 히브리어는 상하 대조와 총체적 결핍을 함께 보여 줍니다. 한국어에서도 이 병행을 유지해야 본문의 심판 의미가 흐려지지 않습니다.
  doctrine_reference: 예언서의 언약적 심판과 자연 질서의 차단이라는 주제
