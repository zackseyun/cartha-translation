  terminology: ‘하늘’, ‘땅’, ‘이슬’, ‘소산’은 적절합니다. יְבוּל의 대안인 ‘소출’ 및 אֶרֶץ의 ‘국토/땅’ 가능성은 각주에서 제한적으로 밝혀 둘 수 있습니다.
