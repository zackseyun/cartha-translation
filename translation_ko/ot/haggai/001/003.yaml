id: HAG.1.3
reference: Haggai 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה בְּ/יַד חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/003.yaml
  text: Then the word of Yahweh came by the hand of Haggai the prophet[a], saying,
  footnotes:
  - marker: a
    text: 'Or: ''through Haggai the prophet.'' The Hebrew literally says ''by the hand of Haggai,'' an idiom for mediated agency.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 말씀이 예언자 학개의 손을 통해 임하여 말씀하셨습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: “예언자 학개를 통해.” 히브리어는 문자적으로 ‘학개의 손을 통해’라고 하며, 매개된 행위를 나타내는 관용구입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 임하여
  alternatives_korean:
  - 그리고 ... 있었습니다
  - 그리고 ... 일어났습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 와우 연속형을 한국어의 자연스러운 시간 연결로 풀어, 다음 사건의 도래를 분명히 하면서도 예언 공식의 문체를 유지했습니다.
- source_word: דְּבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 메시지
  - 일
  lexicon: HALOT
  rationale: 예언 서두의 דָּבָר는 하나님의 계시 말씀을 가리키므로, 한국어 성경 문맥에 맞는 ‘말씀’이 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기적 고유명사 יְהוָה는 호칭이 아니라 고유명 ‘야훼’로 옮겨, 원문이 지닌 언약 이름을 보존했습니다.
- source_word: בְּיַד
  english_pob_choice: by the hand of
  chosen_korean: 손을 통해
  alternatives_korean:
  - 손에 의해
  - 을/를 통하여
  lexicon: HALOT
  rationale: 직역적인 ‘손’ 이미지를 완전히 지우지 않으면서도 한국어에서 이해되는 매개·도구의 의미를 살려, 예언의 매개성을 드러냈습니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자이신
  lexicon: HALOT
  rationale: 히브리어 נָבִיא는 예언 기능을 가리키므로, 현대 한국어에서 비교적 직접적인 ‘예언자’를 선택했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יהוה가 직접 나오므로, 전통적 대체어 ‘여호와’나 칭호 ‘주님’ 대신 고유명 ‘야훼’를 사용해 계시된 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘by the hand of’의 예언적 매개성
  chosen_reading: 예언자 학개의 손을 통해
  alternative_readings:
  - 예언자 학개를 통해
  - 예언자 학개의 손으로
  rationale: 히브리어 관용구의 매개 행위를 보존하되 한국어 독자가 오해하지 않도록 ‘통해’로 자연스럽게 풀어, 하나님의 말씀이 인간 대언자를 거쳐 임하는 구조를 드러냈습니다.
  doctrine_reference: 예언 계시의 매개성과 하나님의 주권
