id: HAG.1.8
reference: Haggai 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עֲל֥וּ הָ/הָ֛ר וַ/הֲבֵאתֶ֥ם עֵ֖ץ וּ/בְנ֣וּ הַ/בָּ֑יִת וְ/אֶרְצֶה בּ֥/וֹ ו/אכבד אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/008.yaml
  text: Go up into the hills[a], bring wood, and build the house, so that I may take pleasure in it and be glorified[c][b], says Yahweh.
  footnotes:
  - marker: a
    text: Or 'the mountain' or 'the hill country.' The Hebrew הָהָר can refer to a mountain, hill, or upland region.
    reason: lexical_alternative
  - marker: b
    text: That is, the temple; Hebrew 'the house.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and I will be honored.' The Hebrew verb can mean either 'be glorified' or 'be honored.'
    reason: alternative_reading
translation:
  language: ko
  text: 산에 올라가서 나무를 가져오고, 그 집을 건축하십시오. 그러면 내가 그것을 기뻐하고 영광을 받겠습니다[a][b][c]. 야훼의 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הָהָר는 산, 언덕, 산지로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 즉 성전을 가리킵니다. 히브리어는 ‘집’이라고 합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영광을 받게 되겠습니다.’ 히브리어 동사는 ‘영광을 받다’ 또는 ‘영광을 얻다’의 뜻이 될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲלוּ הָהָר
  english_pob_choice: Go up into the hills
  chosen_korean: 산에 올라가서
  alternatives_korean:
  - 언덕들로 올라가서
  - 산지로 올라가서
  lexicon: HALOT
  rationale: 히브리어 הָהָר는 문맥에 따라 산, 언덕, 산지를 가리킬 수 있으므로, 목재를 구하러 가는 명령이라는 맥락을 살려 자연스러운 ‘산에 올라가서’로 옮겼습니다.
- source_word: וַהֲבֵאתֶם עֵץ
  english_pob_choice: bring wood
  chosen_korean: 나무를 가져오고
  alternatives_korean:
  - 목재를 가져오고
  - 나무를 들여오고
  lexicon: HALOT
  rationale: עֵץ는 여기서 재료를 가리키는 집합적 표현이므로, 한국어에서도 넓고 자연스러운 ‘나무’를 택해 명령의 간결함을 살렸습니다.
- source_word: וּבְנוּ הַבָּיִת
  english_pob_choice: build the house
  chosen_korean: 그 집을 건축하십시오
  alternatives_korean:
  - 그 집을 세우십시오
  - 그 집을 지으십시오
  lexicon: HALOT
  rationale: הַבָּיִת는 문맥상 성전을 뜻하지만 히브리어는 ‘집’이라고 하므로, 사물을 드러내면서도 현대 문어체에 맞는 ‘건축하십시오’를 사용했습니다.
- source_word: וְאֶרְצֶה בּוֹ
  english_pob_choice: so that I may take pleasure in it
  chosen_korean: 그러면 내가 그것을 기뻐하고
  alternatives_korean:
  - 그리하면 내가 그것을 기쁘게 여기고
  - 그것을 받아들이고
  lexicon: HALOT
  rationale: רצה는 여기서 ‘기뻐하다/마음에 들어 하다’의 뜻이 자연스러우므로, 목적·결과 흐름을 드러내는 ‘그러면’과 함께 옮겼습니다.
- source_word: וְאֶכְבָּד
  english_pob_choice: and be glorified
  chosen_korean: 영광을 받겠습니다
  alternatives_korean:
  - 영광을 얻겠습니다
  - 영광스럽게 되겠습니다
  - 영광을 받으시겠습니다
  lexicon: HALOT
  rationale: נפעל형 כבד는 수동적 의미의 ‘영광을 받다/영광스럽게 되다’로 옮길 수 있어, 하나님의 영화라는 신학적 뉘앙스를 살리면서도 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유명사이므로, 프로젝트 기준에 따라 대체 титуль이 아닌 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 성전의 완곡어 ‘house’ 보존
  chosen_reading: 그 집
  alternative_readings:
  - 성전
  - 집
  rationale: 문맥상 성전을 가리키지만 본문은 ‘집’이라고 말하므로, 원문 관용구를 보존해 독자가 문맥으로 식별하도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
