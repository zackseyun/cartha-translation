  source_fidelity: 명령들(‘올라가라/가져와라/지어라’)과 성전 문맥의 ‘그 집’은 대체로 충실합니다. 다만 각주 표지가 모두 절 끝에 몰려 있어 해당 어휘를 즉시 식별하기 어렵고, ‘그것을 기뻐하고’는 원문의 지시 대상을 살리면서도 한국어에서는 다소 부자연스럽습니다. ‘영광을 받겠습니다’는 נִפְעַל형의 ‘영광을 받다/존귀하게 되다’를 적절히 반영합니다.
  naturalness: ‘산으로 올라가 나무를 가져와 그 집을 지으십시오’가 병렬 명령을 현대 표준 한국어로 자연스럽게 전달합니다. ‘내가 그 집을 기쁘게 여기고’는 무생물인 건물에 대한 하나님의 호의·수납을 자연스럽게 표현합니다. ‘야훼께서 말씀하십니다’는 현대 합쇼체의 예언자적 발화 표지로 적절합니다.
  terminology: ‘야훼’는 프로젝트의 YHWH 표기 원칙에 맞습니다. 히브리어 בַּיִת의 직역적 표현인 ‘그 집’을 유지하고, 각주에서 성전 지시 대상임을 밝혔습니다. ‘영광을 받다’는 וְאֶכָּבְדָה의 수동적 의미를 보존하며, ‘영광을 얻다’처럼 능동적 의미로 기울 수 있는 대안은 피했습니다.
