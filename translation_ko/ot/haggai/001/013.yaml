id: HAG.1.13
reference: Haggai 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חַגַּ֞י מַלְאַ֧ךְ יְהוָ֛ה בְּ/מַלְאֲכ֥וּת יְהוָ֖ה לָ/עָ֣ם לֵ/אמֹ֑ר אֲנִ֥י אִתְּ/כֶ֖ם נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/013.yaml
  text: Then Haggai[a], the messenger of Yahweh, spoke to the people with Yahweh’s message, saying[b], “I am with you,” declares Yahweh.
  footnotes:
  - marker: a
    text: Or “by the commission of the LORD” or “as the LORD’s messenger.” The Hebrew phrase can denote the capacity or commission in which Haggai spoke.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “messenger of the LORD.” Here it refers to Haggai as the LORD’s envoy, not to an angelic being.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼의 사자인 학개가[a] 야훼의 위임을 받아[b] 백성에게 이렇게 말했습니다. “나는 너희와 함께 있습니다.” 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “야훼의 사자”입니다. 여기서는 천사가 아니라 야훼의 사자로서의 학개를 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “야훼의 위임으로”, “야훼의 사자로서”라고도 옮길 수 있습니다. 히브리어 표현은 학개가 어떤 자격과 위임 아래 말했는지를 함께 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the messenger of Yahweh
  chosen_korean: 야훼의 메신저
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 천사
  lexicon: HALOT
  rationale: 학개가 사람 이름으로 명시되어 있으므로 천사로 읽기보다 야훼의 파견된 전달자라는 뜻을 살려 ‘메신저’로 옮겼습니다.
- source_word: בְּ/מַלְאֲכ֥וּת יְהוָ֖ה
  english_pob_choice: with Yahweh’s message
  chosen_korean: 야훼의 메시지로
  alternatives_korean:
  - 야훼의 위임으로
  - 야훼의 사명으로
  - 야훼의 메신저 자격으로
  lexicon: HALOT
  rationale: 이 표현은 단순히 전달 내용이 아니라 파견·위임의 성격까지 띠지만, 문맥상 학개가 야훼의 말씀을 받아 전한다는 뜻이 핵심이므로 현대어로 자연스러운 ‘메시지로’를 택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 선언하셨습니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언자적 공식을 한국어에서 가장 분명하게 드러내기 위해 ‘선언하셨습니다’로 옮겼습니다. 이는 단순한 말이 아니라 권위를 지닌 직접 선언임을 보여 줍니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말하며
  alternatives_korean:
  - 말하여 이르되
  - 말하여
  lexicon: HALOT
  rationale: 직접인용을 여는 연결어로서 ‘말하며’가 본문의 문장 구조를 자연스럽게 살립니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원어의 고유한 신명 사상을 보존하기 위해 전통적 대체 표기 ‘주’ 대신 음역형을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: '학개의 신분: 천사인가, 인간 사자인가'
  chosen_reading: 학개를 인간 예언자이자 야훼의 사자/메신저로 읽었습니다.
  alternative_readings:
  - 천사적 존재
  - 상징적 화자
  rationale: 이 구절은 학개를 이름으로 지칭한 뒤 그의 발화를 설명하므로, 본문이 말하는 것은 초월적 천사가 아니라 예언자적 위임을 받은 인간 전달자입니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy)
