  text: זְרַעְתֶּ֨ם הַרְבֵּ֜ה וְ/הָבֵ֣א מְעָ֗ט אָכ֤וֹל וְ/אֵין לְ/שָׂבְעָה֙ שָׁת֣וֹ וְ/אֵין לְ/שָׁכְרָ֔ה לָב֖וֹשׁ וְ/אֵין לְ/חֹ֣ם ל֑/וֹ וְ/הַ֨/מִּשְׂתַּכֵּ֔ר מִשְׂתַּכֵּ֖ר אֶל צְר֥וֹר נָקֽוּב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/006.yaml
  text: You have sown much[a], but brought in little. You eat, but there is not enough to be satisfied; you drink, but there is not enough to be filled; you clothe yourselves, but no one is warm[c][b]; and the one who earns wages earns them for a bag with holes.
  footnotes:
  - marker: a
    text: Or 'but harvested little.' The Hebrew is literally 'but brought in little,' an idiom for meager agricultural return.
    reason: lexical_alternative
  - marker: b
    text: Or 'you drink, but not to drunkenness.' The Hebrew specifically refers to becoming intoxicated, not merely to thirst being quenched.
    reason: lexical_alternative
  - marker: c
    text: Literally 'but there is no warmth for him.' The singular pronoun has a generic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 많이 뿌리셨으나 적게 거두셨습니다. 먹으나 만족할 만큼은 아니고, 마시나 채울 만큼은 아니며, 옷을 입으나 따뜻하지 않습니다. 품삯을 받는 자도 구멍 난 자루에 넣는 셈입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '적게 들여오다'이지만, 농작물의 미미한 수확을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 '그에게는 따뜻함이 없다'입니다. 단수 대명사는 일반적 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרַעְתֶּם הַרְבֵּה
  english_pob_choice: You have sown much
  chosen_korean: 많이 뿌리셨으나
  alternatives_korean:
  - 많이 씨를 뿌리셨으나
  - 많이 파종하셨으나
  lexicon: HALOT
  rationale: 완료된 파종 행위와 그에 대한 예언적 책망을 자연스러운 합쇼체로 옮겼습니다. '뿌리셨으나'가 히브리어의 직접성을 가장 간결하게 반영합니다.
- source_word: וְהָבֵא מְעָט
  english_pob_choice: but brought in little
  chosen_korean: 적게 거두셨습니다
  alternatives_korean:
  - 적게 들여오셨습니다
  - 조금만 거두셨습니다
  lexicon: HALOT
  rationale: 직역인 '들여오다'보다 농업 맥락에서 결과를 드러내는 '거두다'가 한국어 독자에게 더 분명하되, 수확의 미미함이라는 본뜻은 유지합니다.
- source_word: שָׁת֣וֹ וְאֵין לְשָׁכְרָה
  english_pob_choice: you drink, but there is not enough to be filled
  chosen_korean: 마시나 채울 만큼은 아니며
  alternatives_korean:
  - 마시나 취할 만큼은 아니며
  - 마시나 충분하지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 핵심은 갈증 해소가 아니라 '충분히 채워지지 않음'입니다. POB의 개정 취지를 따라 과도한 '취함'보다 원문의 결핍을 살렸습니다.
- source_word: לָב֖וֹשׁ וְאֵין לְחֹ֣ם ל֑וֹ
  english_pob_choice: you clothe yourselves, but no one is warm
  chosen_korean: 옷을 입으나 따뜻하지 않습니다
  alternatives_korean:
  - 옷을 입으나 몸이 따뜻해지지 않습니다
  - 옷을 입으나 어느 누구도 따뜻하지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 단수 대명사는 일반적 의미로 쓰였으므로 한국어에서는 자연스럽게 일반화했습니다. '따뜻하지 않습니다'가 결과 상태를 가장 간결하게 보여 줍니다.
- source_word: וְ/הַמִּשְׂתַּכֵּר מִשְׂתַּכֵּר אֶל צְר֥וֹר נָקֽוּב
  english_pob_choice: and the one who earns wages earns them for a bag with holes
  chosen_korean: 품삯을 받는 자도 구멍 난 자루에 넣는 셈입니다
  alternatives_korean:
  - 품삯을 버는 자도 구멍 난 자루를 위하는 셈입니다
  - 품삯을 받는 자도 구멍 난 자루를 위해 받는 셈입니다
  lexicon: HALOT
  rationale: 반복 어근이 주는 강조를 '품삯을 받는 자도'로 살리고, 비유는 한국어 관용에 맞게 '구멍 난 자루에 넣는 셈'으로 옮겨 유실되는 헛수고의 이미지를 보존했습니다.
theological_decisions:
