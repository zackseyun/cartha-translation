- source_word: וְ/הַמִּשְׂתַּכֵּר מִשְׂתַּכֵּר אֶל צְר֥וֹר נָקֽוּב
  english_pob_choice: and the one who earns wages earns them for a bag with holes
  chosen_korean: 품삯을 받는 자도 구멍 난 자루에 넣는 셈입니다
  alternatives_korean:
  - 품삯을 버는 자도 구멍 난 자루를 위하는 셈입니다
