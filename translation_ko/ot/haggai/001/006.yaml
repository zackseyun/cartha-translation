  alternative_readings:
  - 완곡한 경고문체로 풀어 쓰기
  - 해석적 덧붙임을 넣어 의미를 설명하기
  rationale: 이 구절은 농사·식사·의복·노임 전반의 실패를 병렬로 나열하는 예언적 논박이므로, 해석을 덧붙이기보다 원문의 날카로운 대조를 보존하는 것이 적절합니다.
  doctrine_reference: 예언서의 책망과 언약적 무기력의 묘사
