  source_fidelity: 원문의 세 차례 반복되는 ‘영’과 ‘백성의 모든 남은 자’, 그리고 ‘와서 … 집에서 일을 하였다’라는 서술을 전반적으로 충실히 반영합니다. 다만 ‘깨우셨습니다’는 잠에서 깨우는 뜻이 더 강하게 들릴 수 있어, 행동하도록 내적으로 움직이셨다는 וַיָּעַר의 문맥에는 ‘일깨우셨습니다’가 더 적합합니다. 또한 שַׁלְתִּיאֵל의 표준적인 한국어 음역은 ‘스알디엘’입니다.
  naturalness: 대시로 삽입한 인물 설명은 가능하나, 이 절의 긴 병렬 구조에서는 쉼표와 ‘곧’을 사용해 관계를 명확히 하면 현대 한국어 합쇼체 문장으로 더 자연스럽습니다. ‘남은 모든 백성’보다 ‘백성 가운데 남은 모든 사람’이 ‘백성의 모든 남은 자’라는 원문의 범위를 더 분명히 드러냅니다.
  terminology: ‘야훼’, ‘유다의 총독’, ‘대제사장’, ‘영’, ‘만군의 야훼’는 원문 및 프로젝트의 명명 원칙에 부합합니다. ‘스룹바벨’과 ‘여호수아’, ‘여호사닥’도 통용되는 성경 인명 표기입니다. ‘스알디엘’로 바로잡아야 합니다.
