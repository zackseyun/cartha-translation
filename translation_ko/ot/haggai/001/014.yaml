base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/014.yaml
  text: And Yahweh stirred up the spirit of Zerubbabel son of Shealtiel[a], governor of Judah, and the spirit of Joshua son of Jehozadak, the high priest, and the spirit of all the remnant of the people; and they came and did work on the house of Yahweh of Armies, their God.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 유다의 총독 스룹바벨, 스알디엘의 아들의 영과 대제사장 여호수아, 여호사닥의 아들의 영과 백성 가운데 남은 모든 사람의 영을 일깨우셨습니다. 그들은 와서 만군의 야훼, 곧 그들의 하나님의 집에서 일을 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, ‘만군의 주님’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  english_pob_choice: stirred up
  chosen_korean: 깨우셨습니다
  alternatives_korean:
  - 불러일으키셨습니다
  - 자극하셨습니다
  - 흔드셨습니다
  lexicon: HALOT
  rationale: 히브리어는 사람들을 행동으로 움직이게 하거나 각성시키는 뜻이므로, 문맥에 맞게 ‘깨우다’를 사용해 동기를 불러일으킨 뉘앙스를 살렸습니다.
- source_word: רוּחַ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 마음
  - 내적 태도
  - 정신
  lexicon: HALOT
  rationale: 여기서는 사람의 내적 동기와 기세를 가리키므로, 신학적 함의를 남기면서도 과도하게 심리화하지 않는 ‘영’이 적절합니다.
- source_word: פַּחַת יְהוּדָה
  english_pob_choice: governor of Judah
  chosen_korean: 유다의 총독
  alternatives_korean:
  - 유다의 지방관
  - 유다의 태수
  lexicon: HALOT
  rationale: פַּחַת은 페르시아 시대 행정 직함이므로, 현대 한국어에서 가장 자연스럽고 기능적으로 대응되는 ‘총독’을 택했습니다.
- source_word: הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 수제사장
  lexicon: HALOT
  rationale: 이 직함은 한국어 성경에서 널리 쓰이는 ‘대제사장’이 원문의 공식 직함을 가장 자연스럽게 옮깁니다.
- source_word: כֹּל שְׁאֵרִית הָעָם
  english_pob_choice: all the remnant of the people
  chosen_korean: 남은 모든 백성
  alternatives_korean:
  - 백성의 모든 남은 자
  - 모든 남은 백성
  lexicon: HALOT
  rationale: שְׁאֵרִית의 ‘남은 자/남은 무리’ 뉘앙스를 살리되, 한국어에서는 ‘남은 모든 백성’이 가장 자연스럽고 문맥상 공동체 전체를 가리키는 느낌을 유지합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 주님
  lexicon: HALOT
  rationale: צְבָאוֹת는 전통적으로 ‘만군’으로 굳어져 있으나, 본 프로젝트의 원칙에 따라 여호와 대체어가 아닌 고유 신명 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 야훼의 이름과 군사적 칭호 결합
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 야훼 만군
  - 만군의 주님
  - 주님 만군의 하나님
  rationale: 원문의 יְהוָה צְבָאוֹת는 신명과 군사적 칭호가 결합된 표현이므로, 제목을 풀어쓰지 않고 이름을 보존한 ‘만군의 야훼’로 옮겨 신학적 강도를 유지했습니다.
