source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע זְרֻבָּבֶ֣ל בֶּֽן שַׁלְתִּיאֵ֡ל וִ/יהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/כֹ֣ל שְׁאֵרִ֣ית הָ/עָ֗ם בְּ/קוֹל֙ יְהוָ֣ה אֱלֹֽהֵי/הֶ֔ם וְ/עַל דִּבְרֵי֙ חַגַּ֣י הַ/נָּבִ֔יא כַּ/אֲשֶׁ֥ר שְׁלָח֖/וֹ יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/עָ֖ם מִ/פְּנֵ֥י יְהוָֽה׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/012.yaml
  text: Then Zerubbabel son of Shealtiel[a], and Joshua son of Jehozadak, the high priest, and all the remnant of the people, listened to the voice of Yahweh their God and to the words of Haggai the prophet, as Yahweh their God had sent him[d][c][b]; and the people feared before Yahweh.
  footnotes:
  - marker: a
    text: Or 'heard' or 'obeyed'; the Hebrew verb can carry the sense of hearing with responsive heed.
    reason: lexical_alternative
  - marker: b
    text: Or 'the rest of the people'; 'remnant' preserves the prophetic resonance of the surviving covenant community.
    reason: lexical_alternative
  - marker: c
    text: Or 'because the LORD their God had sent him.'
    reason: alternative_reading
  - marker: d
    text: Or 'stood in awe before the LORD'; the Hebrew can express reverent fear as well as dread.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 스알디엘의 아들 스룹바벨과 대제사장 여호사닥의 아들 여호수아와 남은 모든 백성이 자기들의 하나님 야훼의 음성과 야훼 자기들의 하나님께서 그를 보내셨으므로 예언자 학개의 말에 귀를 기울였고, 백성은 야훼 앞에서 두려워하였습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들었습니다’ 혹은 ‘순종하였습니다’; 히브리어 동사는 듣는 행위와 그에 대한 응답을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘백성의 남은 자’; ‘남은 자’는 예언서에서 남은 언약 공동체의 신학적 울림을 살립니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야훼 그들의 하나님께서 그를 보내셨으므로’.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘야훼 앞에서 경외하였습니다’; 히브리어는 경외와 공포를 함께 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: listened
  chosen_korean: 귀를 기울였고
  alternatives_korean:
  - 들었고
  - 순종하였고
  lexicon: HALOT
  rationale: שׁמע는 단순 청취보다 응답적 수용까지 포함할 수 있어, ‘귀를 기울이다’로 hearing과 heed의 긴장을 함께 살렸습니다.
- source_word: שְׁאֵרִית הָעָם
  english_pob_choice: the remnant of the people
  chosen_korean: 남은 모든 백성
  alternatives_korean:
  - 백성의 남은 자
  - 백성의 나머지
  lexicon: HALOT
  rationale: 예언서 문맥의 신학적 뉘앙스를 살리면서도 한국어에서 자연스러운 집합 표현을 위해 ‘남은 모든 백성’으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי/הֶם
  english_pob_choice: Yahweh their God
  chosen_korean: 자기들의 하나님 야훼
  alternatives_korean:
  - 그들의 하나님 야훼
  - 야훼 그들의 하나님
  lexicon: HALOT
  rationale: 소유 대명사와 신명호칭의 관계를 자연스럽게 드러내기 위해 ‘자기들의 하나님 야훼’로 배치했습니다.
- source_word: דִּבְרֵי חַגַּי הַנָּבִיא
  english_pob_choice: the words of Haggai the prophet
  chosen_korean: 예언자 학개의 말
  alternatives_korean:
  - 예언자 학개의 말씀
  - 학개 선지자의 말
  lexicon: HALOT
  rationale: דָּבָר의 복수형은 여기서 ‘말들/말씀’의 범주를 가리키므로, 직역성을 유지하면서도 현대 한국어에서 자연스러운 ‘말’로 옮겼습니다.
- source_word: מִפְּנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼 앞에서부터
  - 야훼의 면전에서
  lexicon: HALOT
  rationale: 관용구의 경외적 자세를 한국어 관용 표현으로 자연스럽게 살리기 위해 ‘앞에서’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 신명호를 고유명사로 드러내어, 본문이 지닌 언약적 호칭을 보존했습니다.
  doctrine_reference: Translation philosophy §5 (consistent divine-name rendering)
- issue: וַיִּירְאוּ의 정서적 범위
  chosen_reading: 두려워하였습니다
  alternative_readings:
  - 경외하였습니다
  - 두려워 떨었습니다
  rationale: 이 동사는 공포와 경외를 함께 담을 수 있으므로, 해석을 한쪽으로 고정하지 않는 ‘두려워하다’ 계열을 선택했습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
