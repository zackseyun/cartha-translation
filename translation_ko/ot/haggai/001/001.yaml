source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת שְׁתַּ֨יִם֙ לְ/דָרְיָ֣וֶשׁ הַ/מֶּ֔לֶךְ בַּ/חֹ֨דֶשׁ֙ הַ/שִּׁשִּׁ֔י בְּ/י֥וֹם אֶחָ֖ד לַ/חֹ֑דֶשׁ הָיָ֨ה דְבַר יְהוָ֜ה בְּ/יַד חַגַּ֣י הַ/נָּבִ֗יא אֶל זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ פַּחַ֣ת יְהוּדָ֔ה וְ/אֶל יְהוֹשֻׁ֧עַ בֶּן יְהוֹצָדָ֛ק הַ/כֹּהֵ֥ן הַ/גָּד֖וֹל לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/001.yaml
  text: 'In the second year of King Darius[a], in the sixth month, on the first day of the month, the word of Yahweh came by the hand of Haggai the prophet to Zerubbabel son of Shealtiel, governor of Judah, and to Joshua son of Jehozadak, the high priest, saying:'
  footnotes:
  - marker: a
    text: Or 'through Haggai the prophet.' The Hebrew idiom is literally 'by the hand of Haggai.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다리오 왕 제이년, 여섯째 달, 그 달 첫째 날에 야훼의 말씀이 예언자 학개를 통해 유다 총독 스알디엘의 아들 스룹바벨과 대제사장 여호사닥의 아들 여호수아에게 임했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘예언자 학개의 손으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 본문의 신명은 יְהוָה이므로 프로젝트 기본값에 따라 고유 신명인 야훼로 옮겨, ‘the LORD’처럼 일반 호칭으로 평준화하지 않았습니다.
- source_word: בְּיַד חַגַּי הַנָּבִיא
  english_pob_choice: by the hand of Haggai the prophet
  chosen_korean: 예언자 학개를 통해
  alternatives_korean:
  - 예언자 학개의 손으로
  - 예언자 학개를 매개로
  lexicon: WLC
  rationale: 히브리어 관용구인 ‘손으로/by the hand of’는 예언적 매개를 뜻하므로, 한국어에서는 자연스럽게 ‘-를 통해’로 옮기되 예언자적 중개라는 의미를 보존했습니다.
- source_word: פַּחַת יְהוּדָה
  english_pob_choice: governor of Judah
  chosen_korean: 유다 총독
  alternatives_korean:
  - 유다 지방장관
  - 유다 총독관
  lexicon: HALOT
  rationale: פַּחַת은 페르시아 시대 지방 통치관을 가리키므로, 가장 자연스럽고 역사적으로 맞는 ‘총독’을 사용했습니다.
- source_word: הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 수제사장
  lexicon: HALOT
  rationale: 고정된 직함이므로 한국어 성경에서 널리 통용되는 ‘대제사장’이 원뜻과 문맥을 가장 분명하게 전달합니다.
theological_decisions:
- issue: 다리오 왕의 연호 표기
  chosen_reading: 다리오 왕 제이년
  alternative_readings:
  - 다리오 왕의 둘째 해
  - 다리오 왕 제2년
  rationale: 왕의 재위 연호를 한국어 역사 문맥에 맞게 간결하게 표현하면서도, ‘둘째 해’라는 시점 정보를 그대로 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 예언 전달의 매개성
  chosen_reading: 예언자 학개를 통해
  alternative_readings:
  - 예언자 학개의 손으로
  - 예언자 학개를 매개로
  rationale: 본문은 예언의 직접성뿐 아니라 매개된 전달을 함께 나타내므로, 한국어에서 무리 없는 표현으로 옮기되 중개 구조를 약화시키지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
