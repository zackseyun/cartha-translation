id: HAG.1.9
reference: Haggai 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּנֹ֤ה אֶל הַרְבֵּה֙ וְ/הִנֵּ֣ה לִ/מְעָ֔ט וַ/הֲבֵאתֶ֥ם הַ/בַּ֖יִת וְ/נָפַ֣חְתִּי ב֑/וֹ יַ֣עַן מֶ֗ה נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת יַ֗עַן בֵּיתִ/י֙ אֲשֶׁר ה֣וּא חָרֵ֔ב וְ/אַתֶּ֥ם רָצִ֖ים אִ֥ישׁ לְ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/009.yaml
  text: You looked for much[a], but behold, it was little; and when you brought it home, I blew it away. Why? declares Yahweh of Armies. Because of my house, which lies in ruins[b], while each of you runs to his own house.
  footnotes:
  - marker: a
    text: Or, 'I blew on it.' The Hebrew verb literally means 'to blow/breathe'; here it likely implies that the produce was blown away or reduced by God's judgment.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''the LORD of Hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 많은 것을 바랐으나, 보십시오, 그것은 적었습니다. 너희가 그것을 집으로 가져왔을 때, 내가 그것을 불어 날려 버렸습니다.[a] 왜입니까? 만군의 야훼의 말씀입니다.[b] 내 집은 황폐한 채 있는데, 너희는 저마다 자기 집으로 달려가기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그것에 입김을 불었다’입니다. 히브리어 동사는 ‘불다/숨을 내쉬다’를 뜻하며, 여기서는 하나님께서 심판으로 수확물을 흩어지거나 사라지게 하셨다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통 번역은 ‘만군의 여호와’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנֹה אֶל הַרְבֵּה
  english_pob_choice: You looked for much
  chosen_korean: 당신들은 많은 것을 기대했으나
  alternatives_korean:
  - 당신들은 많은 것을 바라보았으나
  - 당신들은 풍성함을 바라보았으나
  lexicon: HALOT
  rationale: 문맥상 수확의 기대가 좌절되는 장면이므로, 단순한 ‘보다’보다 ‘기대하다/바라다’가 idiom의 뜻을 더 자연스럽게 드러냅니다.
- source_word: וְהִנֵּה לִמְעָט
  english_pob_choice: but behold, it was little
  chosen_korean: 보십시오, 그것은 적었습니다
  alternatives_korean:
  - 그런데 보십시오, 그것은 적었습니다
  - 보라, 그것은 적었습니다
  lexicon: HALOT
  rationale: 히브리어의 הִנֵּה는 청중의 주의를 환기하는 표현이므로 ‘보십시오’로 옮겨 긴박한 대조를 살렸습니다.
- source_word: וְנָפַחְתִּי בוֹ
  english_pob_choice: I blew it away
  chosen_korean: 내가 그것을 날려 버렸습니다
  alternatives_korean:
  - 내가 그것에 입김을 불었습니다
  - 내가 그것을 불어 흩어 버렸습니다
  lexicon: HALOT
  rationale: נפח는 문자적으로는 ‘불다/숨쉬다’이지만, 여기서는 심판으로 산물을 사라지게 하는 효과가 핵심이므로 ‘날려 버리다’가 원문 효과를 가장 잘 전달합니다.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  english_pob_choice: declares Yahweh of Armies
  chosen_korean: 만군의 야훼께서 선언하십니다
  alternatives_korean:
  - 만군의 야훼께서 말씀하십니다
  - 만군의 야훼의 선언입니다
  lexicon: HALOT
  rationale: יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로, נְאֻם은 예언적 공식을 따라 ‘선언하십니다’로 옮겼습니다. צְבָאוֹת은 전통적 ‘만군’을 유지하되 뜻을 살렸습니다.
- source_word: וְאַתֶּם רָצִים אִישׁ לְבֵיתוֹ
  english_pob_choice: while each of you runs to his own house
  chosen_korean: 너희는 각기 자기 집으로 달려가기 때문입니다
  alternatives_korean:
  - 너희는 각자 자기 집으로 달려가기 때문입니다
  - 너희는 사람마다 자기 집으로 달려가기 때문입니다
  lexicon: HALOT
  rationale: 아쉬운 대비는 ‘하나님의 집’ 대신 ‘자기 집’으로 달려가는 우선순위에 있으므로, ‘달려가기 때문입니다’로 원인의 연결을 분명히 했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 직접 나타나는 Tetragrammaton을 가려 쓰지 않고, 본 프로젝트 기본값대로 ‘야훼’로 드러내어 언약 სახელ의 식별성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: צְבָאוֹת의 번역
  chosen_reading: 만군의
  alternative_readings:
  - 군대들의
  - 군대의
  rationale: ‘만군’은 히브리어 복수적 군사 표지를 한국어에서 가장 안정적으로 전달하며, 전통적 표현을 유지하되 의미를 숨기지 않습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2, §6
