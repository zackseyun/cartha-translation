review_pass:
  verdict: revise
  source_fidelity: The draft generally conveys the agricultural disappointment, divine action, rhetorical question, ruined temple, and contrast with private houses. A revision is needed to preserve the Hebrew causal/contrastive construction more transparently and to anchor the notes to the terms they explain.
  naturalness: The alternation of ‘당신들은,’ ‘여러분이,’ and ‘너희는’ is stylistically inconsistent. ‘내 집이 황폐한데’ can sound merely adversative; ‘내 집은 황폐한 채 있는데’ better retains the condition of Yahweh’s house alongside the people's haste to their own houses. ‘불어 날려 버렸습니다’ is natural and retains the literal blowing image.
  terminology: ‘야훼’ appropriately renders יהוה under the project decision, and ‘만군’ is an established Korean rendering of צבאות. The prophetic formula is more idiomatic in Korean as ‘만군의 야훼의 말씀입니다.’
  issues:
  - severity: medium
    issue: Inconsistent second-person address
    rationale: The draft uses ‘당신들은,’ ‘여러분이,’ and ‘너희는’ within one verse. A single plural address should be retained; ‘너희’ fits the prophetic address and the formal-polite sentence endings.
  - severity: medium
    issue: Footnote anchors are placed only at the verse end
    rationale: Footnote a explains the verb ‘blew,’ and footnote b explains the divine title. They should be attached directly to ‘불어 날려 버렸습니다’ and ‘만군의 야훼,’ respectively.
  - severity: low
    issue: The causal contrast is slightly obscured
    rationale: Rendering the clause as ‘내 집은 황폐한 채 있는데, 너희는…’ better reflects the ruined state of Yahweh’s house in contrast with each person's running to his own house.
  revised_text: 너희는 많은 것을 바랐으나, 보십시오, 그것은 적었습니다. 너희가 그것을 집으로 가져왔을 때, 내가 그것을 불어 날려 버렸습니다.[a] 왜입니까? 만군의 야훼의 말씀입니다.[b] 내 집은 황폐한 채 있는데, 너희는 저마다 자기 집으로 달려가기 때문입니다.
  revised_footnotes:
