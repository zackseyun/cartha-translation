revisions:
- from: 당신들은 많은 것을 기대했으나, 보십시오, 그것은 적었습니다. 여러분이 그것을 집으로 가져왔을 때, 내가 그것을 날려 버렸습니다. 왜입니까? 만군의 야훼께서 선언하십니다. 내 집이 황폐한데, 너희는 각기 자기 집으로 달려가기 때문입니다.[a][b]
  to: 너희는 많은 것을 바랐으나, 보십시오, 그것은 적었습니다. 너희가 그것을 집으로 가져왔을 때, 내가 그것을 불어 날려 버렸습니다.[a] 왜입니까? 만군의 야훼의 말씀입니다.[b] 내 집은 황폐한 채 있는데, 너희는 저마다 자기 집으로 달려가기 때문입니다.
  rationale: The revision standardizes the addressee, uses an idiomatic Korean prophetic declaration formula, preserves the literal image of blowing while retaining its contextual force, more clearly represents the contrast between the ruined temple and private houses, and relocates both footnote anchors to their relevant words.
  reviewer_model: gpt-5.6-terra
