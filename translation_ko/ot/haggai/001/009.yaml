    text: 직역하면 ‘그것에 입김을 불었다’입니다. 히브리어 동사는 ‘불다/숨을 내쉬다’를 뜻하며, 여기서는 하나님께서 심판으로 수확물을 흩어지거나 사라지게 하셨다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통 번역은 ‘만군의 여호와’입니다.
    reason: lexical_alternative
  revision_rationale: The revision standardizes the addressee, uses an idiomatic Korean prophetic declaration formula, preserves the literal image of blowing while retaining its contextual force, more clearly represents the contrast between the ruined temple and private houses, and relocates both footnote anchors to their relevant words.
