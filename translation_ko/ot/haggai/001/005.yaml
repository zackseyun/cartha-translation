lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now therefore
  chosen_korean: 이제 그러므로
  alternatives_korean:
  - 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 접속사와 시간 부사가 앞선 책망에서 이어지는 권면으로 전환하는 기능을 함께 가지므로, 한국어에서는 “이제 그러므로”로 추론적 전환을 드러냈습니다.
- source_word: יְהוָה צְבָא֑וֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 야훼로, צְבָאוֹת은 관용적 결합인 “만군의”로 옮겨 예언자적 칭호를 자연스럽게 살렸습니다.
- source_word: שִׂ֥ימוּ לְבַבְ/כֶ֖ם
  english_pob_choice: Set your heart
  chosen_korean: 마음에 두라
  alternatives_korean:
  - 마음을 두십시오
  - 깊이 생각하십시오
  - 마음을 기울이라
  lexicon: HALOT
  rationale: 직역하면 ‘마음을 두다/놓다’에 가까우나, 본문의 관용적 요구는 자기 성찰과 주의 환기이므로 한국어에서 의미를 유지하면서도 자연스러운 “마음에 두라”로 옮겼습니다.
- source_word: עַל דַּרְכֵי/כֶם
  english_pob_choice: on your ways
  chosen_korean: 자기의 길
  alternatives_korean:
  - 너희의 길 위에
  - 너희의 삶의 길
  - 너희의 행실
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적 의미를 살리되 한국어에서 ‘길’이 곧 삶의 방향과 행실을 함께 떠올리게 하므로, 문맥상 반성의 대상이 되는 자기 삶을 간결하게 드러냈습니다.
theological_decisions:
- issue: 예언자적 전달 공식에서의 음성 재현
  chosen_reading: “이렇게 말씀하십니다”로 현재적 선포를 살리되, 직접 인용문은 명령형으로 옮겼습니다.
  alternative_readings:
  - “말씀하셨다”
  - “말하신다”
  rationale: כֹּה אָמַר은 예언적 전달 공식으로서 단순 과거 진술보다 현재적 권위 선포가 더 적절하므로, 한국어에서도 선지자적 현장성을 유지했습니다.
  doctrine_reference: 예언자적 발화 형식
