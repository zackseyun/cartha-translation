  source_fidelity: 가뭄을 대상으로 ‘내리라고 불렀습니다’라고 한 표현은 히브리어 וָאֶקְרָא의 ‘불러오다/불러일으키다’라는 의미를 부자연스럽게 분리합니다. 또한 ‘손수 수고하여 얻는 모든 것’은 손의 수고 자체를 가리키는 원문을 그 수고의 산물로 한정합니다.
  naturalness: ‘가뭄을 불러왔습니다’가 심판으로 가뭄을 초래하신다는 뜻을 현대 한국어 합쇼체로 자연스럽게 전달합니다. ‘모든 손수고’는 원문의 관용적 표현과 포괄성을 간결하게 유지합니다.
  terminology: אָדָם은 짐승과 병렬되는 일반적 인간을 뜻하므로 ‘사람’이 적절합니다. יִצְהָר는 일반 기름과 구별되는 농산물로서 ‘신선한 기름’으로 옮기고, 올리브기름일 가능성은 주석으로 남깁니다. 주석 표지는 해당 낱말 바로 뒤에 배치했습니다.
