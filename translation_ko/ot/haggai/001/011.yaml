base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/011.yaml
  text: And I called for a drought on the land and on the mountains[a], on the grain, on the new wine, on the fresh oil, on what the ground produces, on man and on beast[b], and on all the labor of the hands.
  footnotes:
  - marker: a
    text: Or 'humankind' for 'man.' The Hebrew אָדָם here is a generic singular for human beings.
    reason: alternative_reading
  - marker: b
    text: Or 'fresh oil'; the Hebrew likely refers specifically to olive oil as an agricultural product.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 땅과 산들과 곡식과 새 포도주와 신선한 기름[b], 땅이 내는 것과 사람[a]과 짐승과 모든 손수고 위에 가뭄을 불러왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 성별이 특정되지 않은 일반적인 인간을 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 יִצְהָר는 보통 올리브기름, 곧 농산물로 얻는 신선한 기름을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרָא
  english_pob_choice: I called for
  chosen_korean: 불렀습니다
  alternatives_korean:
