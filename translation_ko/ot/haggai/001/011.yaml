- source_word: חֹרֶב
  english_pob_choice: drought
  chosen_korean: 가뭄
  alternatives_korean:
  - 메마름
  - 건조함
  lexicon: HALOT
  rationale: 농경 심판 맥락에서 חֹרֶב는 단순한 ‘메마름’보다 구체적인 자연재해인 ‘가뭄’이 더 적절합니다.
- source_word: הַתִּירוֹשׁ / הַיִּצְהָר
  english_pob_choice: the new wine / the fresh oil
  chosen_korean: 새 포도주와 새 기름
  alternatives_korean:
  - 새 포도주와 신선한 기름
  - 새 포도주와 올리브 기름
  lexicon: HALOT
  rationale: תִּירוֹשׁ와 יִצְהָר를 각각 농산물로 병렬 유지하되, POB의 구별을 따라 ‘새’로 두 항목의 생명력/수확성을 함께 드러냈습니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 남자
  lexicon: HALOT
  rationale: 히브리어의 일반적 인간을 가리키는 단수 용법을 살리면서도 현대 한국어에서는 성별 오해를 줄이기 위해 ‘사람’이 가장 자연스럽습니다.
theological_decisions:
- issue: הָאָדָם의 일반적 인간 의미와 성별 오해 가능성
  chosen_reading: ‘사람’으로 번역하여 일반 인간을 뜻하게 했습니다.
  alternative_readings:
  - ‘인간’
  - ‘남자’
  rationale: 본문은 짐승과의 대구 안에서 인류 전체를 가리키는 일반 명사로 쓰였으므로, 성별을 특정하지 않는 ‘사람’이 문맥과 독자 이해 모두에 가장 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #4; Contested terms table for אָדָם'
