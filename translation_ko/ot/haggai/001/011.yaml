  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶקְרָ֨א חֹ֜רֶב עַל הָ/אָ֣רֶץ וְ/עַל הֶ/הָרִ֗ים וְ/עַל הַ/דָּגָן֙ וְ/עַל הַ/תִּיר֣וֹשׁ וְ/עַל הַ/יִּצְהָ֔ר וְ/עַ֛ל אֲשֶׁ֥ר תּוֹצִ֖יא הָ/אֲדָמָ֑ה וְ/עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַ֖ל כָּל יְגִ֥יעַ כַּפָּֽיִם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/011.yaml
  text: And I called for a drought on the land and on the mountains[a], on the grain, on the new wine, on the fresh oil, on what the ground produces, on man and on beast[b], and on all the labor of the hands.
  footnotes:
  - marker: a
    text: Or 'humankind' for 'man.' The Hebrew אָדָם here is a generic singular for human beings.
    reason: alternative_reading
  - marker: b
    text: Or 'fresh oil'; the Hebrew likely refers specifically to olive oil as an agricultural product.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 땅과 산들, 곡식과 새 포도주와 새 기름, 땅이 내는 것과 사람과 짐승, 그리고 손수 수고하여 얻는 모든 것 위에 가뭄을 내리라고 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 성별이 특정되지 않은 일반적인 인간을 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 יִצְהָר는 보통 올리브의 산물인 신선한 기름을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרָא
  english_pob_choice: I called for
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 선포했습니다
  - 불러들였습니다
  lexicon: HALOT
  rationale: 심판을 ‘불러오는’ 동사의 기능을 살리되, 한국어에서 자연스럽고 주어의 주권적 행위를 드러내는 표현으로 옮겼습니다.
- source_word: חֹרֶב
  english_pob_choice: drought
  chosen_korean: 가뭄
  alternatives_korean:
  - 메마름
  - 건조함
  lexicon: HALOT
  rationale: 농경 심판 맥락에서 חֹרֶב는 단순한 ‘메마름’보다 구체적인 자연재해인 ‘가뭄’이 더 적절합니다.
- source_word: הַתִּירוֹשׁ / הַיִּצְהָר
  english_pob_choice: the new wine / the fresh oil
  chosen_korean: 새 포도주와 새 기름
  alternatives_korean:
  - 새 포도주와 신선한 기름
  - 새 포도주와 올리브 기름
  lexicon: HALOT
  rationale: תִּירוֹשׁ와 יִצְהָר를 각각 농산물로 병렬 유지하되, POB의 구별을 따라 ‘새’로 두 항목의 생명력/수확성을 함께 드러냈습니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 남자
  lexicon: HALOT
  rationale: 히브리어의 일반적 인간을 가리키는 단수 용법을 살리면서도 현대 한국어에서는 성별 오해를 줄이기 위해 ‘사람’이 가장 자연스럽습니다.
theological_decisions:
- issue: הָאָדָם의 일반적 인간 의미와 성별 오해 가능성
  chosen_reading: ‘사람’으로 번역하여 일반 인간을 뜻하게 했습니다.
  alternative_readings:
  - ‘인간’
  - ‘남자’
  rationale: 본문은 짐승과의 대구 안에서 인류 전체를 가리키는 일반 명사로 쓰였으므로, 성별을 특정하지 않는 ‘사람’이 문맥과 독자 이해 모두에 가장 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #4; Contested terms table for אָדָם'
