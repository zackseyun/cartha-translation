translation:
  language: ko
  text: 이 집이 폐허로 남아 있는데, 너희 자신이 널판으로 마감한 집들에 살 때입니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘널판으로 마감한’은 히브리어 סְפוּנִים을 풀어 옮긴 것으로, 덮어 마감하거나 널판으로 안을 댄 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֵת
  english_pob_choice: Is it a time
  chosen_korean: 어찌하여
  alternatives_korean:
  - 이때입니까
  - 지금이 그런 때입니까
  lexicon: HALOT
  rationale: 의문문 전체의 책망 어조를 자연스러운 현대 한국어로 살리기 위해, 시간 명사 자체를 직역하기보다 원문의 반문 기능을 드러내는 표현을 택했습니다.
- source_word: לָכֶם אַתֶּם
  english_pob_choice: for you yourselves
  chosen_korean: 너희 자신이
  alternatives_korean:
