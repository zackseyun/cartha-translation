  text: הַ/עֵ֤ת לָ/כֶם֙ אַתֶּ֔ם לָ/שֶׁ֖בֶת בְּ/בָתֵּי/כֶ֣ם סְפוּנִ֑ים וְ/הַ/בַּ֥יִת הַ/זֶּ֖ה חָרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/004.yaml
  text: Is it a time for you yourselves to live in your paneled houses while this house lies in ruins?[a]
  footnotes:
  - marker: a
    text: Or 'ceiled houses'—that is, houses finished or lined with paneling.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 자신이 판자로 마감한 집에 살고 있는데, 이 집은 어찌하여 무너진 채로 있습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘판자로 마감한 집’은 히브리어 סְפוּנִים의 의미를 풀어 옮긴 것으로, 덮어 마감하거나 널판으로 안을 댄 집을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֵת
  english_pob_choice: Is it a time
  chosen_korean: 어찌하여
  alternatives_korean:
  - 이때입니까
  - 지금이 그런 때입니까
  lexicon: HALOT
  rationale: 의문문 전체의 책망 어조를 자연스러운 현대 한국어로 살리기 위해, 시간 명사 자체를 직역하기보다 원문의 반문 기능을 드러내는 표현을 택했습니다.
- source_word: לָכֶם אַתֶּם
  english_pob_choice: for you yourselves
  chosen_korean: 너희 자신이
  alternatives_korean:
  - 너희가
  - 너희들 자신이
  lexicon: HALOT
  rationale: לָכֶם의 2인칭 복수와 독립대명사 אַתֶּם의 강조를 함께 반영해, 단순한 ‘너희가’보다 강조된 ‘너희 자신이’로 옮겼습니다.
- source_word: בְּבָתֵּיכֶם סְפוּנִים
  english_pob_choice: in your paneled houses
  chosen_korean: 판자로 마감한 집에
  alternatives_korean:
  - 널판으로 덮은 집에
  - 패널로 치장한 집에
  lexicon: HALOT
  rationale: סְפוּנִים은 목재로 덮어 마감한 상태를 가리키므로, 고전적 교회어보다 의미가 분명한 ‘판자로 마감한’으로 옮겼습니다.
- source_word: הַבַּיִת הַזֶּה חָרֵב
  english_pob_choice: this house lies in ruins
  chosen_korean: 이 집은 무너진 채로
  alternatives_korean:
  - 이 집은 폐허로
  - 이 집은 황폐한 채로
  lexicon: HALOT
  rationale: ‘이 집’은 문맥상 성전을 가리키지만 본문 표현을 유지했고, חָרֵב의 지속 상태를 ‘무너진 채로’로 살려 현재적 방치를 드러냈습니다.
theological_decisions:
- issue: ‘this house’의 지시 대상
  chosen_reading: 본문은 ‘이 집’을 유지하되, 문맥상 야훼의 성전을 가리킨다고 이해합니다.
  alternative_readings:
  - 본문에 ‘성전’을 명시함
  - 일반적인 집으로 이해함
  rationale: 하나님께서 꾸짖는 대상이 성전이라는 것은 바로 앞뒤 문맥에서 분명하지만, 원문의 지시 표현을 유지하는 것이 수사적 긴장을 보존합니다.
  doctrine_reference: 문맥 해석과 성전 신학
