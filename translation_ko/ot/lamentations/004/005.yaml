  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָ/אֹֽכְלִים֙ לְ/מַ֣עֲדַנִּ֔ים נָשַׁ֖מּוּ בַּ/חוּצ֑וֹת הָ/אֱמֻנִים֙ עֲלֵ֣י תוֹלָ֔ע חִבְּק֖וּ אַשְׁפַּתּֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/005.yaml
  text: Those who used to eat delicacies are desolate in the streets[a]; those who were brought up on scarlet embrace ash heaps.
  footnotes:
  - marker: a
    text: Or 'refuse heaps' or 'dung heaps'; the Hebrew term refers to places of discarded waste and conveys extreme humiliation.
    reason: lexical_alternative
translation:
  language: ko
  text: 맛있는 것을 먹던 사람들은 거리에서 황폐해졌습니다[a]. 주홍빛에 길러지던 사람들은 재더미를 껴안습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '쓰레기더미'나 '거름더미'일 수 있습니다. 히브리어는 버려진 폐기물이 쌓인 곳을 가리켜 극심한 수치를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹכְלִים / לְמַעֲדַנִּים
  english_pob_choice: those who used to eat delicacies
  chosen_korean: 맛있는 것을 먹던 사람들
  alternatives_korean:
  - 진미를 먹던 사람들
  - 진수성찬을 먹던 사람들
  - 사치를 누리던 사람들
  lexicon: HALOT
  rationale: פעל사적 표현을 한국어의 과거 습관 표현으로 옮겨, 이전의 풍요와 현재의 몰락이 대비되도록 했습니다. '맛있는 것'은 'delicacies'의 현대적이고 과장되지 않은 대응입니다.
- source_word: נָשַׁמּוּ
  english_pob_choice: are desolate
  chosen_korean: 황폐해졌습니다
  alternatives_korean:
  - 황량해졌습니다
  - 폐허가 되었습니다
  - 황망해졌습니다
  lexicon: HALOT
  rationale: 동사가 말하는 핵심은 내부적 낙담보다 파괴와 황폐입니다. 한국어로는 상태 완료를 나타내는 '황폐해졌습니다'가 가장 직접적입니다.
- source_word: הָאֱמֻנִים עֲלֵי תוֹלָע
  english_pob_choice: those who were brought up on scarlet
  chosen_korean: 주홍빛에 길러지던 사람들
  alternatives_korean:
  - 주홍 옷에 자라던 사람들
  - 진홍색에 양육되던 사람들
  - 주홍 천 위에서 자라던 사람들
  lexicon: HALOT
  rationale: אמן의 수동/양육 의미를 살려 '길러지다'로 옮겼고, תוֹלָע는 값비싼 주홍색을 가리키므로 색채 이미지가 살아 있는 '주홍빛'을 택했습니다.
- source_word: חִבְּק֖וּ אַשְׁפַּתּוֹת
  english_pob_choice: embrace ash heaps
  chosen_korean: 재더미를 껴안습니다
  alternatives_korean:
  - 재더미를 품습니다
  - 쓰레기더미를 껴안습니다
  - 거름더미를 껴안습니다
  lexicon: HALOT
  rationale: 동사의 직유적·육체적 이미지를 살려 '껴안다'로 옮겼습니다. 'ash heaps'는 문자 그대로 재더미이지만, 극도의 굴욕을 보여 주는 이미지라는 점을 유지했습니다.
