id: LAM.4.19
reference: Lamentations 4:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַלִּ֤ים הָיוּ֙ רֹדְפֵ֔י/נוּ מִ/נִּשְׁרֵ֖י שָׁמָ֑יִם עַל הֶ/הָרִ֣ים דְּלָקֻ֔/נוּ בַּ/מִּדְבָּ֖ר אָ֥רְבוּ לָֽ/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/019.yaml
  text: Our pursuers were swifter than the eagles of the heavens[a]; on the mountains they pursued us; in the wilderness they lay in wait for us.
  footnotes:
  - marker: a
    text: Or 'than the eagles of the sky'; the Hebrew נֶשֶׁר can also denote a vulture in some contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 추격자들은 하늘의 독수리보다 더 빨랐습니다[a]. 그들은 산들 위에서 우리를 추격했고, 광야에서는 우리를 노리고 숨어 기다렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘의 독수리들보다.” 히브리어 נֶשֶׁר는 문맥에 따라 독수리 또는 대머리수리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלִּים
  english_pob_choice: swifter
  chosen_korean: 더 빨랐습니다
  alternatives_korean:
  - 더 날쌔었습니다
  - 더 재빨랐습니다
  lexicon: HALOT
  rationale: 비교 표현 מִן이 암시하는 상대적 우위를 한국어로 자연스럽게 살리되, 시적 속도를 유지하기 위해 ‘더 빨랐습니다’로 옮겼습니다.
- source_word: רֹדְפֵינוּ
  english_pob_choice: our pursuers
  chosen_korean: 우리의 추격자들
  alternatives_korean:
  - 우리를 뒤쫓는 자들
  - 우리의 박해자들
  lexicon: HALOT
  rationale: 직접적인 पीछ성(chasing) 이미지를 살리기 위해 ‘추격자들’을 택했고, ‘박해자들’은 의미를 지나치게 신학화할 수 있어 피했습니다.
- source_word: מִנִּשְׁרֵי שָׁמָיִם
  english_pob_choice: than the eagles of the heavens
  chosen_korean: 하늘의 독수리들보다
  alternatives_korean:
  - 하늘의 독수리보다
  - 하늘의 독수리들보다 더
  lexicon: HALOT
  rationale: נשר의 일반적 동물명인 ‘독수리’를 기본으로 하고, לשמים의 격조를 ‘하늘의’로 반영했습니다. 본문의 시적 비교 구조상 ‘보다’가 필요합니다.
- source_word: דְּלָקֻנוּ
  english_pob_choice: they pursued us
  chosen_korean: 그들이 우리를 추격했고
  alternatives_korean:
  - 그들이 우리를 뒤쫓았고
  - 그들이 우리를 쫓았고
  lexicon: HALOT
  rationale: 동사 דלק의 강한 추적 의미를 살리면서 앞의 ‘추격자들’과 어근 대응을 맞추기 위해 ‘추격했습니다/추격했고’를 택했습니다.
- source_word: אָרְבוּ לָנוּ
  english_pob_choice: they lay in wait for us
  chosen_korean: 우리를 매복했습니다
  alternatives_korean:
  - 우리에게 매복했습니다
  - 우리를 노리고 숨어 있었습니다
  lexicon: HALOT
  rationale: אָרב은 ‘매복하다, 숨어 기다리다’의 의미이므로 본문 후반의 전략적 위협을 간결하게 살리기 위해 ‘매복했습니다’로 옮겼습니다.
theological_decisions:
- issue: 시적 과장과 문자성 사이의 긴장
  chosen_reading: 비교 표현과 전투/추격 이미지를 문자 그대로 유지하되, 한국어 시어는 과도한 장식 없이 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘독수리처럼’의 비유적 완화
  - ‘사냥했다’ 같은 더 관용적인 표현
  rationale: 애가의 탄식 문맥에서는 감정의 압박과 위협의 속도를 그대로 전달하는 것이 중요하므로, 의미를 완화하지 않았습니다.
  doctrine_reference: 본문의 시적 진술은 교리적 주장이 아니라 역사적-수사적 탄식입니다.
