  - severity: medium
    issue: 각주에서 נֶשֶׁר의 대안으로 ‘솔개’를 제시함
    rationale: נֶשֶׁר의 주요 어휘적 범위는 독수리와 대머리수리(vulture)이며, 솔개(kite)는 적절한 대안이 아닙니다. 또한 본문과 각주의 ‘하늘의 독수리들/하늘의 독수리’ 차이는 유의미한 어휘 대안이 아닙니다.
