  rationale: ‘매복하다’의 부자연스러운 타동사 용법을 ‘우리를 노리고 숨어 기다렸습니다’로 고쳐 אָרַב의 잠복·대기 의미와 לָנוּ의 대상 관계를 보존했습니다. 각주는 נֶשֶׁר의 실제 어휘적 모호성(독수리/대머리수리)을 반영하고, 부적절한 ‘솔개’ 대안을 제거했습니다. 총칭적 동물명에는 자연스러운 단수형 ‘독수리’를 사용하되, 히브리어 복수형은 각주에 보존했습니다.
