base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/002.yaml
  text: The precious sons of Zion[a], weighed out against fine gold—how they are regarded as clay jars[b], the work of a potter’s hands.
  footnotes:
  - marker: a
    text: Or 'worth fine gold,' 'comparable to fine gold,' or 'esteemed as fine gold.' The Hebrew expression may emphasize valuation rather than the more concrete image of weighing.
    reason: lexical_alternative
  - marker: b
    text: Or 'earthen jars' or 'clay pots.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시온의 귀한 아들들이 순금에 견줄 만큼 값졌는데[a], 어찌 토기장이의 손으로 만든 질그릇들처럼[b] 여김을 받게 되었습니까!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘순금에 버금가는 값어치의’, ‘순금처럼 귀하게 여겨졌던’. 히브리어 표현은 실제로 저울에 달아 값어치를 매기는 이미지를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘토기 항아리들’ 혹은 ‘질그릇들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי צִיּוֹן
  english_pob_choice: the sons of Zion
  chosen_korean: 시온의 귀한 아들들
  alternatives_korean:
  - 시온의 자녀들
  - 시온의 사람들
  lexicon: HALOT
  rationale: בְּנֵי는 문자적으로 ‘아들들’이므로 성별을 지우지 않고 살리되, 시적 수사에 맞게 ‘귀한’과 결합해 전체 대상의 존귀함을 드러냈습니다.
- source_word: הַמְסֻלָּאִים בַּפָּז
  english_pob_choice: weighed out against fine gold
  chosen_korean: 순금에 견줄 만큼 값졌던
  alternatives_korean:
  - 순금과 맞먹도록 달아 올린
  - 순금에 비해 달아진
  - 순금처럼 귀하게 여겨졌던
  lexicon: HALOT
  rationale: 히브리어는 단순한 ‘가치’보다 금과의 저울질 이미지를 살리므로, 자연스러운 한국어로 옮기되 ‘값졌던’과 ‘견줄 만큼’으로 평가·비교의 긴장을 함께 보존했습니다.
- source_word: לְנִבְלֵי חֶרֶשׂ
  english_pob_choice: as clay jars
  chosen_korean: 질그릇으로
  alternatives_korean:
  - 토기 그릇으로
  - 흙그릇으로
  lexicon: HALOT
  rationale: חֶרֶשׂ의 흙으로 구운 그릇이라는 뜻을 한국어 성경어휘에 익숙한 ‘질그릇’으로 옮겨, 귀한 금과의 강한 대비를 살렸습니다.
- source_word: מַעֲשֵׂה יְדֵי יוֹצֵר
  english_pob_choice: the work of a potter’s hands
  chosen_korean: 토기장이의 손으로 만든
  alternatives_korean:
  - 토기장이의 손이 만든
  - 토기장이의 작품인
  lexicon: HALOT
  rationale: 직역하면 ‘토기장이의 손의 일’이므로, 제작의 손맛을 살리면서도 한국어에서 자연스러운 ‘손으로 만든’으로 풀었습니다.
theological_decisions:
- issue: 시적 감탄과 절망의 어조
  chosen_reading: “어찌 … 여겨졌는가!”로 옮겨, 원문의 حیر/애가적 탄식과 놀라움을 살렸습니다.
  alternative_readings:
