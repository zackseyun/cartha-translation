base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/014.yaml
  text: They wandered blind through the streets[a], defiled with blood[b], so that they could not touch their garments.
  footnotes:
  - marker: a
    text: Or, 'They wandered like blind men through the streets, defiled with blood, so that people could not touch their garments.' The Hebrew is compressed, and the subject of 'could not touch' is not explicit.
    reason: alternative_reading
  - marker: b
    text: '''Defiled with blood'' likely carries impurity language, not merely the idea of being physically bloodstained.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 눈먼 사람처럼 거리들을 헤매며 다녔습니다[a]. 피에 더럽혀져서 자기 옷에 손을 댈 수 없었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “그들은 눈먼 사람들처럼 거리들을 헤매며 다녔습니다.” 히브리어는 압축되어 있어 비교의 의미가 명시되지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘피에 더럽혀져서’는 단순한 혈흔보다 부정과 오염의 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָעוּ
  english_pob_choice: they wandered
  chosen_korean: 헤매며 다녔습니다
  alternatives_korean:
  - 방황했습니다
  - 비틀거리며 다녔습니다
  lexicon: HALOT
  rationale: נוע는 방향 없이 움직이거나 비틀거리는 동작을 나타내므로, 애가 문맥에 맞게 자연스러운 ‘헤매며 다녔습니다’로 옮겼습니다.
- source_word: עִוְרִים
  english_pob_choice: blind
  chosen_korean: 눈먼 사람처럼
  alternatives_korean:
  - 눈먼
  - 장님처럼
  lexicon: HALOT
  rationale: 히브리어는 비교 표지가 없이 ‘눈먼 자들’이라는 이미지를 압축적으로 제시하므로, 문맥상 비유성을 드러내기 위해 ‘사람처럼’을 보탰습니다.
- source_word: נְגֹאֲלוּ בַּדָּם
  english_pob_choice: defiled with blood
  chosen_korean: 피에 더럽혀져서
  alternatives_korean:
  - 피로 더럽혀져서
  - 피로 부정해져서
  lexicon: HALOT
  rationale: 여기서는 단순한 혈흔보다 부정/오염의 뉘앙스가 중요하므로 ‘더럽혀져서’로 옮겨 혈에 의한 오염성을 살렸습니다.
- source_word: יִּגְּעוּ בִּלְבֻשֵׁיהֶם
  english_pob_choice: they could not touch their garments
  chosen_korean: 자기 옷에 손을 댈 수 없었습니다
  alternatives_korean:
  - 그들의 옷에 닿을 수 없었습니다
  - 옷을 만질 수 없었습니다
  lexicon: HALOT
  rationale: 히브리어는 접촉 금지를 간명하게 말하므로, 한국어에서는 ‘손을 대다’로 접촉 금지의 뜻을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 피로 더럽혀짐의 의미
  chosen_reading: 단순한 혈흔 묘사보다 부정과 오염의 언어로 읽었습니다.
  alternative_readings:
  - 물리적으로 피가 묻은 상태로만 이해하는 읽기
  rationale: נְגֹאֲלוּ는 의식적/도덕적 더러움의 뉘앙스를 띠므로, 예언적 애가의 정결-부정 배경을 보존했습니다.
  doctrine_reference: 율법의 정결 개념과 레위기적 부정 규례
