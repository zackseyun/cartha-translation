  text: They wandered blind through the streets[a], defiled with blood[b], so that they could not touch their garments.
  footnotes:
  - marker: a
    text: Or, 'They wandered like blind men through the streets, defiled with blood, so that people could not touch their garments.' The Hebrew is compressed, and the subject of 'could not touch' is not explicit.
    reason: alternative_reading
  - marker: b
    text: '''Defiled with blood'' likely carries impurity language, not merely the idea of being physically bloodstained.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 눈먼 이들처럼 거리에서 헤매고 다녔습니다[a]. 그들은 피로 더럽혀진 채[b] 그들의 옷에 손을 댈 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “눈먼 이들이 거리에서 헤매고 다녔습니다.” 히브리어에는 비교를 나타내는 말이 명시되어 있지 않습니다.
    reason: alternative_reading
  - marker: b
    text: ‘피로 더럽혀진’은 단순히 피가 묻었다는 뜻을 넘어 부정과 오염의 의미를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
