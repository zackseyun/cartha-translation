source:
  edition: WLC
  text: גַּם תנין חָ֣לְצוּ שַׁ֔ד הֵינִ֖יקוּ גּוּרֵי/הֶ֑ן בַּת עַמִּ֣/י לְ/אַכְזָ֔ר כי ענים בַּ/מִּדְבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/003.yaml
  text: Even jackals offer the breast[a]; they nurse their young. The daughter of my people has become cruel[b], like ostriches in the wilderness.
  footnotes:
  - marker: a
    text: Or 'sea monsters' or 'dragons' for תנין; here 'jackals' is preferred because the verse describes nursing their young, which fits a land animal comparison better in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'like owls in the wilderness'; the Hebrew ענים is traditionally understood as 'ostriches,' especially in light of Job 39:13–17.
    reason: lexical_alternative
translation:
  language: ko
  text: 들개들도 젖을 내어 새끼를 먹이는데[a], 내 백성의 딸은 마치 광야의 타조[b]처럼 잔혹하게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다 괴물’이나 ‘용’으로도 옮길 수 있지만, 여기서는 새끼를 먹이는 장면과 맞는 땅짐승인 ‘들개’를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광야의 올빼미’로도 볼 수 있지만, 히브리어 ענים은 특히 욥기 39:13–17의 연관성에서 ‘타조’로 이해하는 것이 전통적이고 타당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּנִּין
  english_pob_choice: jackals
  chosen_korean: 들개
  alternatives_korean:
  - 자칼
  - 바다 괴물
  - 용
  lexicon: HALOT
  rationale: 이 문맥은 새끼를 먹이는 지상 동물을 요구하므로, 한국어에서는 현대 독자가 바로 이해할 수 있는 ‘들개’가 적절합니다. ‘바다 괴물/용’은 문맥과 맞지 않아 배제했습니다.
- source_word: חָלְצוּ שַׁד
  english_pob_choice: offer the breast
  chosen_korean: 젖을 내어
  alternatives_korean:
  - 가슴을 드러내어
  - 젖을 드러내어
  - 가슴을 바치며
  lexicon: HALOT
  rationale: 동사는 젖을 먹이기 위해 젖을 내어 보이는 행위를 가리키므로, 직역적이면서도 한국어로 자연스러운 ‘젖을 내어’로 옮겼습니다.
- source_word: הֵינִיקוּ גּוּרֵיהֶן
  english_pob_choice: they nurse their young
  chosen_korean: 새끼를 먹이는데
  alternatives_korean:
  - 새끼에게 젖을 먹이는데
  - 새끼를 젖먹이는데
  - 새끼를 기르는데
  lexicon: HALOT
  rationale: יַנִיק 동사의 핵심은 젖을 먹이는 행위이므로 ‘먹이다’보다 구체적인 ‘젖을 먹이다’ 계열 표현이 필요합니다. 문장 흐름상 ‘새끼를 먹이는데’로 간결하게 살렸습니다.
- source_word: בַּת עַמִּי
  english_pob_choice: the daughter of my people
  chosen_korean: 내 백성의 딸
  alternatives_korean:
  - 내 백성의 딸
  - 내 백성의 딸이
  - 내 백성
  lexicon: HALOT
  rationale: 민족 전체를 여성화한 시적 표현을 그대로 살려 ‘내 백성의 딸’로 옮겼습니다. 이는 공동체에 대한 애통과 인격화를 함께 드러냅니다.
- source_word: לְאַכְזָר
  english_pob_choice: has become cruel
  chosen_korean: 잔혹하게 되었습니다
  alternatives_korean:
  - 잔혹해졌습니다
  - 잔인하게 되었습니다
  - 잔인해졌습니다
  lexicon: HALOT
  rationale: 전치사 לְ가 결과 상태를 나타내므로 단순 형용사보다 ‘되다’의 변화를 드러내는 표현이 적절합니다. ‘잔혹’은 극심한 비인정성을 더 강하게 전달합니다.
- source_word: כִּי עֲנִים
  english_pob_choice: like ostriches
  chosen_korean: 마치 광야의 타조처럼
  alternatives_korean:
  - 마치 올빼미처럼
  - 마치 타조처럼
  lexicon: HALOT
  rationale: 이 어휘는 전통적으로 ‘타조’로 이해되는 것이 가장 타당하며, 욥기 39장과의 연관성도 반영됩니다. 비교 대상의 생태를 분명히 하기 위해 ‘광야의’를 보강했습니다.
theological_decisions:
- issue: 시적 인물화 표현인 ‘내 백성의 딸’의 처리
  chosen_reading: 공동체를 여성 인물로 의인화한 시적 표현을 그대로 유지했습니다.
  alternative_readings:
  - 내 백성
  - 내 민족의 딸
  rationale: 이 표현은 단순한 지칭이 아니라 애가의 정서와 예언자적 탄식을 전달하므로, 평이화하지 않고 원문의 인격화 효과를 보존하는 것이 필요합니다.
  doctrine_reference: 시적·예언문학의 인물화 유지
- issue: ‘광야의 타조’의 비교 의미
  chosen_reading: 타조가 새끼를 돌보지 않는 잔혹한 이미지로 기능한다는 해석을 반영했습니다.
  alternative_readings:
  - 올빼미
  - 사막의 새
  rationale: 히브리어 전승과 문맥상 타조가 가장 설득력 있으며, 이 비교는 백성의 돌봄 상실과 냉혹함을 강조합니다.
  doctrine_reference: 욥 39:13-17과의 상호본문성
