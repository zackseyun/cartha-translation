    rationale: 직역 관용구는 ‘얼굴을 들어 주다’이며, 여기서는 제사장들에게 존중·호의·특별한 배려를 보이지 않았다는 뜻입니다. ‘돌아보다’는 단순히 쳐다보지 않거나 돌보지 않는 뜻으로 흐를 수 있습니다.
