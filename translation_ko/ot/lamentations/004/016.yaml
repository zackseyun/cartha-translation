id: LAM.4.16
reference: Lamentations 4:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פְּנֵ֤י יְהוָה֙ חִלְּקָ֔/ם לֹ֥א יוֹסִ֖יף לְ/הַבִּיטָ֑/ם פְּנֵ֤י כֹהֲנִים֙ לֹ֣א נָשָׂ֔אוּ זקנים לֹ֥א חָנָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/016.yaml
  text: The face of Yahweh has scattered them[a]; he will no longer look on them. They showed no regard for priests[c][b]; they showed no favor to elders.
  footnotes:
  - marker: a
    text: Or 'The presence of the LORD has divided/dispersed them; he will no longer look at them.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'they did not lift up the face of priests'; an idiom meaning they showed no regard or favor.
    reason: lexical_alternative
  - marker: c
    text: Or 'they had no mercy on elders.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 얼굴이 그들을 흩으셨습니다[a]. 그분은 더 이상 그들을 바라보지 않으십니다. 그분은 제사장들을 존중하지 않으셨고[b], 장로들에게도 은혜를 베풀지 않으셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 임재가 그들을 나누어 흩으셨다; 그분은 더 이상 그들을 바라보지 않으신다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘제사장들의 얼굴을 들어 올리지 않으셨다’로, 관용적으로는 제사장들에게 존중이나 호의를 보이지 않으셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘장로들에게 자비를 베풀지 않으셨다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי יְהוָה
  english_pob_choice: The face of Yahweh
  chosen_korean: 야훼의 얼굴
  alternatives_korean:
  - 야훼의 임재
  - 주님의 얼굴
  lexicon: HALOT
  rationale: פְּנֵי는 문자적으로 ‘얼굴’이지만 시적 문맥에서 인격적 임재를 가리킬 수 있으므로, 본문 이미지를 살려 ‘얼굴’로 두고 יְהוָה는 고유명 ‘야훼’로 옮겼습니다.
- source_word: חִלְּקָם
  english_pob_choice: has scattered them
  chosen_korean: 그들을 흩으셨습니다
  alternatives_korean:
  - 그들을 나누셨습니다
  - 그들을 분산시키셨습니다
  lexicon: HALOT
  rationale: 분배·나눔의 기본 뜻이 있지만, 심판 문맥에서는 그 결과가 흩어짐이므로 한국어에서는 자연스럽게 ‘흩으셨습니다’로 옮겼습니다.
- source_word: לֹא יוֹסִיף לְהַבִּיטָם
  english_pob_choice: he will no longer look on them
  chosen_korean: 더 이상 그들을 바라보지 않으십니다
  alternatives_korean:
  - 더 이상 그들을 돌보지 않으십니다
  - 더 이상 그들을 바라보지 않겠다고 하십니다
  lexicon: HALOT
  rationale: יוֹסִיף + 부정은 ‘더 이상’의 뉘앙스를 주고, לְהַבִּיט은 단순 시선보다 관계적 주목을 포함하므로 ‘바라보다’로 유지했습니다.
- source_word: לֹא נָשָׂאוּ / זקנים / לֹא חָנָנוּ
  english_pob_choice: They showed no regard for priests; they showed no favor to elders.
  chosen_korean: 제사장들의 얼굴을 돌아보지 않았고, 장로들에게도 은혜를 베풀지 않았습니다
  alternatives_korean:
  - 제사장들을 존중하지 않았고, 장로들에게도 불쌍히 여기지 않았습니다
  - 제사장들에게도 호의를 보이지 않았고, 장로들에게도 자비를 베풀지 않았습니다
  lexicon: HALOT
  rationale: ‘얼굴을 들어주다’의 관용을 살려 נָשָׂאוּ를 ‘얼굴을 돌아보다’로 풀었고, חָנָן은 ‘은혜/호의/자비’ 가운데 문맥상 가장 직선적인 ‘은혜를 베풀다’로 처리했습니다. ‘זקנים’은 공동체 지도층을 가리키는 ‘장로들’이 적합합니다.
theological_decisions:
- issue: יהוה의 번역과 의인화 표현 보존
  chosen_reading: ‘야훼의 얼굴’이라는 의인화 이미지를 유지했습니다.
  alternative_readings:
  - ‘야훼의 임재’로 추상화하기
  - ‘주님이’로 주어를 완화하기
  rationale: 시적·예언적 탄식의 구체성을 살리기 위해 얼굴 이미지를 유지했으며, 이는 하나님을 육체적으로 묘사하려는 것이 아니라 히브리 시의 관용적 표현으로 보존한 것입니다.
  doctrine_reference: 원문 우선 번역 원칙; 시적 의인화는 신학적으로 해설하지 않고 보존
