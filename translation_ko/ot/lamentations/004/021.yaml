id: LAM.4.21
reference: Lamentations 4:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׂ֤ישִׂי וְ/שִׂמְחִי֙ בַּת אֱד֔וֹם יושבתי בְּ/אֶ֣רֶץ ע֑וּץ גַּם עָלַ֨יִ/ךְ֙ תַּעֲבָר כּ֔וֹס תִּשְׁכְּרִ֖י וְ/תִתְעָרִֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/021.yaml
  text: Rejoice and be glad[a], daughter of Edom, you who dwell in the land of Uz[b]; the cup will also pass to you—you will become drunk and strip yourself bare.
  footnotes:
  - marker: a
    text: Or, 'the cup will also come to you.' The image is the cup of judgment.
    reason: lexical_alternative
  - marker: b
    text: Or, 'and be exposed' or 'and uncover yourself.' The Hebrew conveys shameful nakedness.
    reason: lexical_alternative
translation:
  language: ko
  text: 딸 에돔아, 너는 기뻐하고 즐거워하라. 우스 땅에 사는 너야, 잔이 너에게도 지나갈 것이니 — 너는 술에 취하고 스스로 벌거벗게 될 것이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '잔이 너에게도 이를 것이다.' 여기서 잔은 심판의 이미지입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '벌거벗게 되다' 혹은 '드러나게 되다.' 히브리어는 수치스러운 나체 상태를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂישִׂי וְשִׂמְחִי
  english_pob_choice: Rejoice and be glad
  chosen_korean: 기뻐하고 즐거워하라
  alternatives_korean:
  - 기뻐하라
  - 환호하라
  lexicon: HALOT
  rationale: 두 명령형의 병렬을 살리면서도 현대 한국어에서 자연스럽고 강한 감정의 고조를 표현하는 조합으로 옮겼습니다.
- source_word: בַּת אֱדוֹם
  english_pob_choice: daughter of Edom
  chosen_korean: 딸 에돔
  alternatives_korean:
  - 에돔의 딸
  - 에돔아
  lexicon: HALOT
  rationale: 열방을 여성으로 의인화한 예언적 호칭을 그대로 살리기 위해 '딸'을 유지했고, 호격으로 자연스럽게 읽히도록 했습니다.
- source_word: יֹשַׁבְתִּי בְּאֶרֶץ עוּץ
  english_pob_choice: you who dwell in the land of Uz
  chosen_korean: 우스 땅에 사는 너야
  alternatives_korean:
  - 우스 땅에 거하는 너여
  - 우스 땅에 거주하는 너
  lexicon: HALOT
  rationale: משך되는 거주 상태를 나타내는 분사 뉘앙스를 '사는'으로 자연스럽게 살렸고, 지명은 관용적으로 '우스 땅'으로 옮겼습니다.
- source_word: תַּעֲבָר כּוֹס
  english_pob_choice: the cup will also pass to you
  chosen_korean: 잔이 너에게도 지나갈 것이니
  alternatives_korean:
  - 그 잔도 너에게 이를 것이니
  - 그 잔이 너에게도 넘어갈 것이니
  lexicon: HALOT
  rationale: 심판의 상징인 '잔' 이미지를 보존하되, '지나갈'로 פָּאס 동사의 흐름과 도래성을 살렸습니다.
- source_word: תִּשְׁכְּרִי וְתִתְעָרִי
  english_pob_choice: you will become drunk and strip yourself bare
  chosen_korean: 너는 술에 취하고 스스로 벌거벗게 될 것이다
  alternatives_korean:
  - 너는 취하여 드러나게 될 것이다
  - 너는 술에 취해 몸을 드러낼 것이다
  lexicon: HALOT
  rationale: '''취함''과 ''벌거벗음''의 수치를 분명히 드러내되, 히트파엘의 반사성을 ''스스로''로 반영했습니다.'
theological_decisions:
- issue: 심판의 '잔' 이미지 보존
  chosen_reading: '''잔''을 심판의 상징으로 유지하고, 해석적 의역으로 바꾸지 않았습니다.'
  alternative_readings:
  - 형벌이 너에게 닥칠 것이다
  - 심판이 너에게 이를 것이다
  rationale: 예언서의 반복되는 '잔' 이미지는 신학적·문학적 연결고리이므로, 이를 살려 본문 상호연관성을 유지하는 것이 더 적절합니다.
  doctrine_reference: 예언적 심판 상징과 성경 내 상호본문성
