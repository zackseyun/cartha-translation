source:
  edition: WLC
  text: שִׂ֤ישִׂי וְ/שִׂמְחִי֙ בַּת אֱד֔וֹם יושבתי בְּ/אֶ֣רֶץ ע֑וּץ גַּם עָלַ֨יִ/ךְ֙ תַּעֲבָר כּ֔וֹס תִּשְׁכְּרִ֖י וְ/תִתְעָרִֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/021.yaml
  text: Rejoice and be glad[a], daughter of Edom, you who dwell in the land of Uz[b]; the cup will also pass to you—you will become drunk and strip yourself bare.
  footnotes:
  - marker: a
    text: Or, 'the cup will also come to you.' The image is the cup of judgment.
    reason: lexical_alternative
  - marker: b
    text: Or, 'and be exposed' or 'and uncover yourself.' The Hebrew conveys shameful nakedness.
    reason: lexical_alternative
translation:
  language: ko
  text: 에돔의 딸아, 우스 땅에 사는 자야, 기뻐하고 즐거워하라. 잔도 네게 이를 것이다[a]. 너는 술에 취하고 벌거벗을 것이다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잔도 네게로 지나갈 것이다.’ 잔은 심판의 이미지입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 몸을 드러낼 것이다’ 또는 ‘드러나게 될 것이다.’ 히브리어는 수치스러운 나체 상태를 가리킵니다.
    reason: lexical_alternative
