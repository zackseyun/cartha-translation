- source_word: תִּשְׁכְּרִי וְתִתְעָרִי
  english_pob_choice: you will become drunk and strip yourself bare
  chosen_korean: 너는 술에 취하고 스스로 벌거벗게 될 것이다
  alternatives_korean:
  - 너는 취하여 드러나게 될 것이다
  - 너는 술에 취해 몸을 드러낼 것이다
  lexicon: HALOT
  rationale: '''취함''과 ''벌거벗음''의 수치를 분명히 드러내되, 히트파엘의 반사성을 ''스스로''로 반영했습니다.'
theological_decisions:
- issue: 심판의 '잔' 이미지 보존
  chosen_reading: '''잔''을 심판의 상징으로 유지하고, 해석적 의역으로 바꾸지 않았습니다.'
  alternative_readings:
  - 형벌이 너에게 닥칠 것이다
  - 심판이 너에게 이를 것이다
  rationale: 예언서의 반복되는 '잔' 이미지는 신학적·문학적 연결고리이므로, 이를 살려 본문 상호연관성을 유지하는 것이 더 적절합니다.
  doctrine_reference: 예언적 심판 상징과 성경 내 상호본문성
