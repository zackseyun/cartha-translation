  - severity: medium
    issue: ‘그들은 ... 자기들에게’의 지시 대상이 문법적으로 잠시 불분명합니다.
    rationale: 직전 주어가 ‘손’이므로 ‘그들’이 여인들인지 자녀들인지 독자가 되짚어야 합니다. 원문의 의미대로 자녀를 명시하고 ‘그들에게’로 받으면 여인들이 먹는 이들이라는 관계가 선명해집니다.
  - severity: low
    issue: 각주 a가 실질적인 번역 대안을 제시하지 않습니다.
    rationale: ‘삶아 익혔습니다’는 본문의 ‘삶았습니다’와 의미상 중복됩니다. ‘요리했습니다’를 대안으로 제시하고, 히브리어 동사가 흔히 삶는 조리를 가리킨다는 설명을 유지하는 것이 유익합니다.
