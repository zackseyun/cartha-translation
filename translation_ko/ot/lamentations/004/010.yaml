id: LAM.4.10
reference: Lamentations 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְדֵ֗י נָשִׁים֙ רַחֲמָ֣נִיּ֔וֹת בִּשְּׁל֖וּ יַלְדֵי/הֶ֑ן הָי֤וּ לְ/בָרוֹת֙ לָ֔/מוֹ בְּ/שֶׁ֖בֶר בַּת עַמִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/010.yaml
  text: The hands of compassionate women cooked their own children[b][a]; they became food for them in the destruction of the daughter of my people.
  footnotes:
  - marker: a
    text: Or "boiled their children." The Hebrew verb specifically refers to cooking, often by boiling.
    reason: lexical_alternative
  - marker: b
    text: '"The daughter of my people" is a Hebrew poetic expression personifying my people, especially Jerusalem/Zion, in her devastation.'
    reason: cultural_note
translation:
  language: ko
  text: 자비로운 여인들의 손이 자기 자녀를 삶았으니[a], 그들은 내 백성의 딸의 멸망 속에서 자기들에게 음식이 되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자녀를 삶아 익혔습니다.” 히브리어 동사는 특히 삶는 조리를 가리키며, 흔히 끓여 익히는 뜻으로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 백성의 딸’은 내 백성, 특히 예루살렘/시온을 의인화한 히브리 시적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְדֵי נָשִׁים
  english_pob_choice: The hands of ... women
  chosen_korean: 자비로운 여인들의 손
  alternatives_korean:
  - 여인들의 손
  - 자비로운 여자들의 손
  lexicon: HALOT
  rationale: 히브리어의 ‘손’은 행위의 충격을 앞세우는 구조이므로 살리되, ‘여인들’로 자연스럽게 옮겨 현대 한국어에서 매끄럽게 읽히도록 했습니다.
- source_word: רַחֲמָנִיּוֹת
  english_pob_choice: compassionate
  chosen_korean: 자비로운
  alternatives_korean:
  - 동정심 많은
  - 긍휼한
  lexicon: HALOT
  rationale: 여인의 성격을 단순히 감정이 많은 것으로 약화시키지 않고, 본문의 반전 효과를 살리는 ‘자비로운’으로 옮겼습니다.
- source_word: בִּשְּׁלוּ
  english_pob_choice: cooked
  chosen_korean: 삶았으니
  alternatives_korean:
  - 요리했으니
  - 끓였으니
  lexicon: HALOT
  rationale: 동사는 단순 조리가 아니라 끓여 익히는 행위를 가리키므로, 한국어에서는 더 직접적인 ‘삶다’가 본문의 잔혹함을 가장 정확히 드러냅니다.
- source_word: לְבָרוֹת
  english_pob_choice: food
  chosen_korean: 음식이 되었습니다
  alternatives_korean:
  - 먹을 것이 되었습니다
  - 식량이 되었습니다
  lexicon: HALOT
  rationale: 문맥상 아이들이 소비될 대상이 되었음을 나타내므로, ‘음식’으로 옮겨 본문의 충격을 그대로 유지했습니다.
- source_word: בְּשֶׁבֶר בַּת עַמִּי
  english_pob_choice: in the destruction of the daughter of my people
  chosen_korean: 내 백성의 딸의 멸망 속에서
  alternatives_korean:
  - 내 백성의 딸이 무너질 때
  - 내 백성의 딸의 파멸 속에서
  lexicon: HALOT
  rationale: ‘딸’은 예루살렘/백성을 의인화한 시적 표현이므로 직역을 유지했고, ‘멸망’으로 재앙의 결과를 분명히 했습니다.
theological_decisions:
- issue: ‘자기 자녀를 삶았다’의 직설성을 유지할지 여부
  chosen_reading: 직설적으로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘자녀를 먹을 것으로 삼았다’처럼 풀어쓰기
  - ‘삶다’ 대신 일반적인 ‘요리하다’ 사용
  rationale: 언약 심판의 참혹함을 흐리지 않기 위해 본문의 충격을 완화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘내 백성의 딸’이라는 의인화 표현 처리
  chosen_reading: 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘내 백성’으로 평문화
  - ‘예루살렘’으로 해설적 대체
  rationale: 예언적 애가의 문학적·신학적 힘은 의인화된 표현 자체에 있으므로, 이를 보존하는 것이 본문의 의도를 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
