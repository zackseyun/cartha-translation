id: LAM.4.1
reference: Lamentations 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵיכָה֙ יוּעַ֣ם זָהָ֔ב יִשְׁנֶ֖א הַ/כֶּ֣תֶם הַ/טּ֑וֹב תִּשְׁתַּפֵּ֨כְנָה֙ אַבְנֵי קֹ֔דֶשׁ בְּ/רֹ֖אשׁ כָּל חוּצֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/001.yaml
  text: How the gold has grown dim[b][a], how the fine gold has changed! The holy stones are poured out at the head of every street.
  footnotes:
  - marker: a
    text: Or 'the sacred stones' or 'the stones of the sanctuary.' The Hebrew may refer to consecrated temple stones or precious holy stones in poetic imagery.
    reason: lexical_alternative
  - marker: b
    text: Literally 'at the head of every street'; this may mean the street corners or entrances to the streets.
    reason: cultural_note
translation:
  language: ko
  text: 어찌 금이 빛을 잃고, 순금이 변하였습니까! 거룩한 돌들[a]이 모든 거리의 어귀[b]에 쏟아져 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 돌들’은 ‘성스러운 돌들’ 또는 ‘성전의 돌들’로도 옮길 수 있습니다. 히브리어는 성별된 성전 돌들을 가리킬 수도 있고, 시적 이미지로서 거룩하고 귀한 돌들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어를 직역하면 ‘모든 거리의 머리에’입니다. 이는 거리의 어귀, 입구, 또는 모퉁이를 뜻할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֵיכָה
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
  - 어떻게
  - 아, 어찌하여
  lexicon: HALOT
  rationale: 탄식의 감탄사로서 비탄과 놀람을 함께 살리기 위해 현대 한국어에서 자연스러운 ‘어찌하여’를 선택했습니다.
- source_word: יוּעַם
  english_pob_choice: has grown dim
  chosen_korean: 빛을 잃고
  alternatives_korean:
  - 어두워지고
  - 희미해지고
  lexicon: HALOT
  rationale: 금의 광택이 사라지는 이미지를 한국어 관용으로 옮기면서도 ‘dim’의 시각적 약화를 유지했습니다.
- source_word: הַכֶּתֶם הַטּוֹב
  english_pob_choice: the fine gold
  chosen_korean: 순금
  alternatives_korean:
  - 고운 금
  - 귀한 금
  lexicon: HALOT
  rationale: ‘fine gold’의 정제된 고급 금속 이미지를 간결하게 살리되, ‘금’과의 평행을 유지하도록 ‘순금’으로 옮겼습니다.
- source_word: אַבְנֵי קֹדֶשׁ
  english_pob_choice: the holy stones
  chosen_korean: 거룩한 돌들
  alternatives_korean:
  - 성소의 돌들
  - 성별된 돌들
  lexicon: HALOT
  rationale: 이 표현의 다의성을 보존하기 위해 해석을 특정하지 않고 원문의 직설성을 따라 ‘거룩한 돌들’로 번역했습니다.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  english_pob_choice: at the head of every street
  chosen_korean: 길거리들마다 머리 부분에
  alternatives_korean:
  - 모든 길모퉁이에
  - 모든 거리의 입구에
  lexicon: HALOT
  rationale: 직역적 이미지와 장소적 함의를 함께 살리기 위해 ‘머리 부분’을 유지하되, 분포 의미는 ‘마다’로 드러냈습니다.
theological_decisions:
- issue: אַבְנֵי קֹדֶשׁ의 지시 대상
  chosen_reading: ‘거룩한 돌들’이라는 표현을 유지하여 성전 돌인지, 성별된 귀한 돌인지, 혹은 시적 표상인지 확정하지 않았습니다.
  alternative_readings:
  - 성전의 돌들
  - 성별된 보석들
  - 시온의 자녀를 가리키는 비유
  rationale: 본문이 의도적으로 남겨 둔 시적 긴장을 보존하기 위해 구체적 해석을 주석으로 밀어두고 본문은 모호성을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
