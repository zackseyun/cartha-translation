revisions:
- from: 어찌하여 금이 빛을 잃고, 순금이 변하였습니까! 거룩한 돌들이 길거리들마다 머리 부분에 쏟아져 있습니다.[a][b]
  to: 어찌 금이 빛을 잃고, 순금이 변하였습니까! 거룩한 돌들[a]이 모든 거리의 어귀[b]에 쏟아져 있습니다.
  rationale: 탄식의 감탄사인 אֵיכָה의 기능을 ‘어찌’로 더 직접적으로 드러내고, 부자연스러운 ‘길거리들마다 머리 부분’을 현대 한국어의 ‘모든 거리의 어귀’로 고쳤습니다. 각주에서 히브리어의 문자적 이미지와 장소 표현의 범위를 보존했으며, ‘거룩한 돌들’의 지시 대상을 특정하지 않았습니다.
