source:
  edition: WLC
  text: כִּלָּ֤ה יְהוָה֙ אֶת חֲמָת֔/וֹ שָׁפַ֖ךְ חֲר֣וֹן אַפּ֑/וֹ וַ/יַּצֶּת אֵ֣שׁ בְּ/צִיּ֔וֹן וַ/תֹּ֖אכַל יְסוֹדֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/011.yaml
  text: Yahweh has exhausted his wrath[a]; he has poured out his burning anger. He kindled a fire in Zion[b], and it consumed her foundations.
  footnotes:
  - marker: a
    text: Or 'has completed his wrath' or 'has spent his wrath fully.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the burning of his anger' or 'the fierceness of his anger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그의 진노를 다 쏟으셨고, 그의 타오르는 분노를 부으셨습니다. 그분은 시온에 불을 지르셨고, 그것이 그 기초들을 삼켜 버렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 분노를 끝냈다’ 또는 ‘그의 분노를 다 써 버렸다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 분노의 타오름’ 또는 ‘그의 분노의 맹렬함’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문 고유명사를 보존하기 위해 음역형을 택했으며, POB의 기준 표기와도 맞추어 ‘야훼’로 옮겼습니다.
- source_word: כִּלָּה
  english_pob_choice: has exhausted
  chosen_korean: 다 쏟으셨고
  alternatives_korean:
  - 다하셨고
  - 끝내셨고
  - 완전히 거두셨고
  lexicon: HALOT
  rationale: 문맥상 진노를 한계까지 소진·완결했다는 뜻을 살리기 위해, 한국어에서는 ‘다 쏟으셨고’로 자연스럽게 옮겼습니다.
- source_word: חֲרוֹן אַפּוֹ
  english_pob_choice: his burning anger
  chosen_korean: 타오르는 분노
  alternatives_korean:
  - 불타는 분노
  - 맹렬한 분노
  - 격렬한 분노
  lexicon: HALOT
  rationale: ‘אַף’의 분노 관용구와 열기 이미지를 살려, 두드러진 감각적 표현인 ‘타오르는 분노’로 옮겼습니다.
- source_word: וַיַּצֶּת אֵשׁ ... וַתֹּאכַל
  english_pob_choice: He kindled a fire ... it consumed
  chosen_korean: 불을 지르셨고, 그것이 ... 삼켜 버렸습니다
  alternatives_korean:
  - 불을 붙이셨고, 그것이 ... 삼켰습니다
  - 불을 일으키셨고, 그것이 ... 먹어 버렸습니다
  lexicon: HALOT
  rationale: 불을 ‘지르다’와 ‘삼키다’는 화재와 파괴의 이미지를 직접적으로 전달하며, 원문의 동작 연쇄를 자연스럽게 재현합니다.
theological_decisions:
- issue: 야훼의 진노와 분노를 병렬로 유지할지 여부
  chosen_reading: ‘진노’를 다 쏟으셨고 ‘타오르는 분노’를 부으셨다고 구분해 유지했습니다.
  alternative_readings:
  - 둘을 합쳐 단순히 ‘분노’를 반복
  - 한 표현으로 평탄화
  rationale: 히브리어는 서로 가까운 두 표현을 병렬로 두어 심판의 강도를 높이므로, 한국어에서도 구분을 유지해 시적 중첩과 신학적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 and #5'
