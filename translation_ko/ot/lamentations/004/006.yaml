id: LAM.4.6
reference: Lamentations 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּגְדַּל֙ עֲוֺ֣ן בַּת עַמִּ֔/י מֵֽ/חַטַּ֖את סְדֹ֑ם הַֽ/הֲפוּכָ֣ה כְמוֹ רָ֔גַע וְ/לֹא חָ֥לוּ בָ֖/הּ יָדָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/006.yaml
  text: For the iniquity of the daughter of my people has grown greater than the sin of Sodom[a], which was overthrown in a moment[b], though no hands labored against her.
  footnotes:
  - marker: a
    text: Or, 'the guilt of the daughter of my people is greater than the guilt of Sodom'; the Hebrew word for 'iniquity' can also imply guilt or its punishment.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult Hebrew; alternatively, 'and no hands were wrung over her' or 'no hands came upon her.'
    reason: alternative_reading
translation:
  language: ko
  text: 내 백성의 딸의 죄악이 소돔의 죄보다 더 커졌습니다[a]. 소돔은 순식간에 뒤엎어졌고[b], 그곳에서는 아무 손도 수고하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 백성의 딸의 죄책이 소돔의 죄책보다 더 크다’로도 옮길 수 있습니다. 히브리어 עָוֹן은 ‘죄악’뿐 아니라 ‘죄책’ 또는 그에 따른 형벌을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절의 히브리어는 난해합니다. 달리 ‘그곳에 손이 닿지 않았다’ 또는 ‘그곳에서 손들이 뒤틀리지 않았다’로 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגְדַּל
  english_pob_choice: has grown greater
  chosen_korean: 더 커졌습니다
  alternatives_korean:
  - 더 크다
  - 더 커졌습니다
  lexicon: HALOT
  rationale: גדל의 기본 뜻인 ‘커지다/더 크다’를 살리되, 비교 구문에서 자연스러운 현대 한국어로 옮겼습니다.
- source_word: עֲוֺן
  english_pob_choice: iniquity
  chosen_korean: 죄악
  alternatives_korean:
  - 악행
  - 죄책
  lexicon: HALOT
  rationale: עָוֹן은 ‘죄악’과 ‘죄책/죄의 결과’까지 포괄할 수 있지만, 여기서는 소돔의 ‘죄’와 직접 대비되므로 도덕적 악을 드러내는 ‘죄악’이 적절합니다.
- source_word: הַהֲפוּכָה
  english_pob_choice: which was overthrown
  chosen_korean: 뒤엎어졌는데
  alternatives_korean:
  - 뒤집어졌는데
  - 전복되었는데
  lexicon: HALOT
  rationale: 소돔의 멸망을 가리키는 뒤엎음의 이미지를 살리기 위해, 너무 추상적인 ‘전복’보다 동적이고 구체적인 ‘뒤엎어지다’를 택했습니다.
- source_word: וְלֹא חָלוּ בָהּ יָדָיִם
  english_pob_choice: though no hands labored against her
  chosen_korean: 그 위에 손도 대지 않았습니다
  alternatives_korean:
  - 그 위에 손이 수고하지 않았습니다
  - 그 위에 손이 닿지 않았습니다
  lexicon: HALOT
  rationale: 마지막 절은 히브리어가 난해하므로, 확정적으로 풀기보다 POB의 조심스러운 해석을 따라 ‘손도 대지 않았다’로 옮겨 원문의 불확실성을 과장하지 않았습니다.
theological_decisions:
- issue: עָוֹן의 의미 범위
  chosen_reading: 여기서는 죄의 성격 자체를 가리키는 말로 읽었습니다.
  alternative_readings:
  - 죄책
  - 죄의 형벌
  rationale: 본문은 ‘소돔의 죄’와 비교하므로, 형벌보다 죄 자체의 심각성을 드러내는 해석이 더 직접적입니다.
  doctrine_reference: 'translation philosophy: preserve lexical tension without resolving it prematurely'
- issue: 마지막 절의 난해한 표현
  chosen_reading: 소돔은 급작스럽게 멸망했으며, 인간의 장기간 손길이 개입된 것으로 말하지 않습니다.
  alternative_readings:
  - 그 위에 손이 없었다
  - 그 위에 손이 닿지 않았다
  rationale: 히브리어는 압축적이고 애매하지만, 문맥상 소돔의 갑작스러운 멸망과 예루살렘의 더 긴 고통을 대비하는 흐름을 유지하는 것이 중요합니다.
  doctrine_reference: 'translation philosophy: preserve theological tension rather than resolve it'
