theological_decisions:
- issue: ‘피를 쏟다’의 직설성과 한국어 관용의 균형
  chosen_reading: 살해의 책임을 완화하지 않고 ‘쏟아부었습니다’로 직접적으로 표현했습니다.
  alternative_readings:
  - ‘피를 흘렸습니다’
  - ‘죽였습니다’
  rationale: 본문은 지도자들의 폭력을 고발하므로, 완곡한 표현보다 원문의 충격을 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 예언자와 제사장에 대한 예언자적 고발의 수사 유지
- issue: ‘의인들’의 의미 범주
  chosen_reading: 윤리적·언약적 의로움의 범주를 유지했습니다.
  alternative_readings:
  - 무죄한 사람들
  - 정당한 사람들
  rationale: 히브리어 צַדִּיקִים는 단순한 법정 무죄보다 더 넓은 ‘의로운 자들’을 뜻하므로, 그 신학적 층위를 보존했습니다.
  doctrine_reference: 의(義) 관련 어휘의 일관성
