  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זַכּ֤וּ נְזִירֶ֨י/הָ֙ מִ/שֶּׁ֔לֶג צַח֖וּ מֵ/חָלָ֑ב אָ֤דְמוּ עֶ֨צֶם֙ מִ/פְּנִינִ֔ים סַפִּ֖יר גִּזְרָתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/007.yaml
  text: Her princes were purer than snow[a], whiter than milk; their bodies were more ruddy than corals[c][b], their form was like sapphire.
  footnotes:
  - marker: a
    text: Or 'her Nazirites' or 'her consecrated ones.' The Hebrew term can refer to those set apart by vow, but here may denote Jerusalem's distinguished nobles or princes.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word rendered 'corals' is uncertain; it may also refer to rubies, pearls, or another precious red jewel.
    reason: lexical_alternative
  - marker: c
    text: The ancient term rendered 'sapphire' may refer to lapis lazuli rather than the modern sapphire gemstone.
    reason: cultural_note
translation:
  language: ko
  text: 그의 나실인들은 눈보다 더 깨끗하고, 우유보다 더 희었으며, 그들의 몸은 홍보석보다 더 붉고, 그들의 형상은 사파이어 같았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 나실인들’ 혹은 ‘그의 성별된 자들’입니다. 이 히브리어는 서원으로 구별된 사람들을 가리킬 수 있지만, 여기서는 예루살렘의 두드러진 귀족이나 지도층을 뜻할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘홍보석’으로 옮긴 히브리어는 뜻이 확실하지 않으며, 산호, 루비, 진주, 다른 붉은 보석을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 고대의 ‘사파이어’는 오늘날의 사파이어보다 청금석을 가리켰을 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: נְזִירֶיהָ
  english_pob_choice: her princes
  chosen_korean: 그의 나실인들은
  alternatives_korean:
  - 그의 귀족들은
  - 그의 성별된 자들은
  lexicon: HALOT
  rationale: 본문의 히브리어는 ‘나실인/구별된 자’와 ‘귀족·지도층’의 뜻이 모두 가능하므로, 영어 주석이 남긴 어휘적 긴장을 반영해 직역 쪽을 본문에 두고 문맥적 이해는 각주로 보완했습니다.
- source_word: זַכּוּ
  english_pob_choice: were purer
  chosen_korean: 더 깨끗하고
  alternatives_korean:
  - 더 순결하고
  - 더 정결하고
  lexicon: HALOT
  rationale: 비교문맥에서 ‘purer’의 의미를 한국어로 자연스럽게 살리기 위해 ‘더 깨끗하고’로 옮겼습니다.
- source_word: צַחוּ
  english_pob_choice: whiter
  chosen_korean: 더 희었으며
  alternatives_korean:
  - 더 밝았으며
  - 더 빛났으며
  lexicon: HALOT
  rationale: 우유와의 비교를 고려해 색채 의미를 직접 드러내는 ‘희다’ 계열로 옮겼습니다.
- source_word: פְּנִינִים
  english_pob_choice: corals
  chosen_korean: 홍보석
  alternatives_korean:
  - 산호
  - 루비
  - 진주
  lexicon: HALOT
  rationale: 히브리어의 정확한 대상은 불확실하지만, 다음 절의 ‘붉음’과 맞물리는 붉은 보석 계열을 본문에 두었습니다. 영어 주석이 밝힌 어휘 불확실성은 각주로 남겼습니다.
- source_word: גִּזְרָתָם
  english_pob_choice: their form
  chosen_korean: 그들의 형상
  alternatives_korean:
  - 그들의 모습
  - 그들의 체형
  lexicon: HALOT
  rationale: 외형적 형상과 비유적 아름다움을 함께 담기 위해 ‘형상’으로 옮겼습니다.
- source_word: סַפִּיר
  english_pob_choice: sapphire
  chosen_korean: 사파이어
  alternatives_korean:
  - 청옥
  - 라피스 라줄리
  lexicon: HALOT
  rationale: 전통적 음역을 유지하되, 고대의 돌 이름이 현대의 사파이어와 정확히 일치하지 않을 수 있다는 점은 각주로 표시했습니다.
theological_decisions:
- issue: נְזִירֶיהָ의 의미가 ‘나실인’인지 ‘귀족/지도층’인지
  chosen_reading: 본문은 ‘나실인들’로 두고, 문맥상 예루살렘의 두드러진 지도층을 가리킬 수 있다는 점을 각주로 보완했습니다.
  alternative_readings:
  - 그의 귀족들은
  - 그의 성별된 자들은
  rationale: 시적 병렬이 외적 아름다움과 쇠락을 묘사하므로, 본문에는 원어의 어휘 긴장을 보존하는 쪽이 유리합니다.
  doctrine_reference: 문맥 주해 및 어휘 선택
- issue: פְּנִינִים와 סַפִּיר의 고대 광물/보석 지칭
  chosen_reading: 본문에는 ‘홍보석’, ‘사파이어’를 사용하되, 고대 명칭의 불확실성을 각주로 밝혔습니다.
  alternative_readings:
  - 산호/루비/진주
  - 라피스 라줄리
  rationale: 독자가 시적 비유를 읽는 데 필요한 이미지성을 확보하면서도, 확정하기 어려운 고대 보석 명칭의 불확실성을 숨기지 않기 위함입니다.
  doctrine_reference: 문맥 주해 및 어휘 선택
