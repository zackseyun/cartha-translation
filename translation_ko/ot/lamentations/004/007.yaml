  lexicon: HALOT
  rationale: 본문의 히브리어는 ‘나실인/구별된 자’와 ‘귀족·지도층’의 뜻이 모두 가능하므로, 영어 주석이 남긴 어휘적 긴장을 반영해 직역 쪽을 본문에 두고 문맥적 이해는 각주로 보완했습니다.
