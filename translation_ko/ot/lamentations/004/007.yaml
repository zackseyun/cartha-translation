  lexicon: HALOT
  rationale: 히브리어의 정확한 대상은 불확실하지만, 다음 절의 ‘붉음’과 맞물리는 붉은 보석 계열을 본문에 두었습니다. 영어 주석이 밝힌 어휘 불확실성은 각주로 남겼습니다.
- source_word: גִּזְרָתָם
  english_pob_choice: their form
  chosen_korean: 그들의 형상
