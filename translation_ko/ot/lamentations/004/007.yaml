  rationale: 우유와의 비교를 고려해 색채 의미를 직접 드러내는 ‘희다’ 계열로 옮겼습니다.
- source_word: פְּנִינִים
  english_pob_choice: corals
  chosen_korean: 홍보석
  alternatives_korean:
  - 산호
