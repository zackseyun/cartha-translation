source:
  edition: WLC
  text: זַכּ֤וּ נְזִירֶ֨י/הָ֙ מִ/שֶּׁ֔לֶג צַח֖וּ מֵ/חָלָ֑ב אָ֤דְמוּ עֶ֨צֶם֙ מִ/פְּנִינִ֔ים סַפִּ֖יר גִּזְרָתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/007.yaml
  text: Her princes were purer than snow[a], whiter than milk; their bodies were more ruddy than corals[c][b], their form was like sapphire.
  footnotes:
  - marker: a
    text: Or 'her Nazirites' or 'her consecrated ones.' The Hebrew term can refer to those set apart by vow, but here may denote Jerusalem's distinguished nobles or princes.
    reason: alternative_reading
  - marker: b
    text: The Hebrew word rendered 'corals' is uncertain; it may also refer to rubies, pearls, or another precious red jewel.
    reason: lexical_alternative
  - marker: c
    text: The ancient term rendered 'sapphire' may refer to lapis lazuli rather than the modern sapphire gemstone.
    reason: cultural_note
translation:
  language: ko
  text: 그녀의 귀족들은[a] 눈보다 깨끗하고 우유보다 희었으며, 그들의 몸은 산호보다[b] 더 붉었고, 그들의 모습은 사파이어[c] 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 나실인들’ 또는 ‘그녀의 성별된 자들’입니다. 이 히브리어는 서원으로 구별된 사람들을 가리킬 수 있지만, 여기서는 예루살렘의 두드러진 귀족이나 지도층을 뜻할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘산호’로 옮긴 히브리어는 뜻이 확실하지 않으며, 루비, 진주, 또는 다른 붉은빛의 귀한 물질을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 고대의 ‘사파이어’는 오늘날의 사파이어보다 청금석을 가리켰을 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: נְזִירֶיהָ
  english_pob_choice: her princes
  chosen_korean: 그의 나실인들은
  alternatives_korean:
