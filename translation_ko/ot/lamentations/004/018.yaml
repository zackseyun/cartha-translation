id: LAM.4.18
reference: Lamentations 4:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צָד֣וּ צְעָדֵ֔י/נוּ מִ/לֶּ֖כֶת בִּ/רְחֹבֹתֵ֑י/נוּ קָרַ֥ב קִצֵּ֛י/נוּ מָלְא֥וּ יָמֵ֖י/נוּ כִּי בָ֥א קִצֵּֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/018.yaml
  text: They hunted our steps[a], so that we could not walk in our streets. Our end drew near; our days were fulfilled[c][b], for our end had come.
  footnotes:
  - marker: a
    text: Or 'They tracked our steps' or 'They lay in wait for our steps.' The Hebrew verb conveys hostile pursuit.
    reason: lexical_alternative
  - marker: b
    text: '''Our days were full'' is a Hebrew idiom meaning that the allotted time had run out or been completed.'
    reason: cultural_note
  - marker: c
    text: Or 'our doom' for 'our end'; the Hebrew word means 'end' and in context implies destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 우리의 걸음[a]을 사냥하여 우리가 거리에서 걸어 다니지 못하게 했습니다. 우리의 끝이 가까워졌고, 우리의 날이 찼으며[b], 우리의 끝이 이르렀기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 발걸음’을 뜻합니다. 히브리어는 추적당하는 움직임을 구체적으로 그립니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리의 날이 찼다’는 히브리어 관용구로, 정해진 시간이 다했음을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘우리의 운명’입니다. 여기서 히브리어 단어는 ‘끝’을 뜻하지만 문맥에서는 멸망을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוּ
  english_pob_choice: They hunted
  chosen_korean: 사냥하여
  alternatives_korean:
  - 추적하여
  - 매복하여
  - 뒤쫓아
  lexicon: HALOT
  rationale: 문맥상 적대적 추격과 사냥의 이미지를 살려, 공격성과 지속성을 드러내는 ‘사냥하다’ 계열로 옮겼습니다.
- source_word: צְעָדֵינוּ
  english_pob_choice: our steps
  chosen_korean: 우리의 걸음
  alternatives_korean:
  - 우리의 발걸음
  - 우리의 걸음걸이
  - 우리의 발자국
  lexicon: HALOT
  rationale: 직역적 이미지를 유지하되 한국어에서 자연스러운 표현으로 ‘걸음’을 택해, 추적당하는 움직임 전체를 드러냈습니다.
- source_word: מִלֶּכֶת
  english_pob_choice: so that we could not walk
  chosen_korean: 우리가 ... 걸어 다니지 못하게 했습니다
  alternatives_korean:
  - 우리가 ... 다니지 못하게 했습니다
  - 우리가 ... 갈 수 없게 했습니다
  - 우리가 ... 걸을 수 없게 했습니다
  lexicon: HALOT
  rationale: מִן+부정사 구문이 방해/금지를 나타내므로, 결과절로 풀어 한국어에서 자연스럽게 제약의 뜻을 전달했습니다.
- source_word: מָלְאוּ יָמֵינוּ
  english_pob_choice: our days were full
  chosen_korean: 우리의 날이 찼으며
  alternatives_korean:
  - 우리의 날이 가득 찼으며
  - 우리의 날이 다 찼으며
  - 우리의 날이 채워졌으며
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘차다/가득 차다’ 이미지를 살려, 정해진 기간이 끝났음을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: קֵץ의 의미가 단순한 시간의 끝인지, 심판적 멸망을 내포하는지
  chosen_reading: ‘끝’으로 옮기되 문맥이 멸망의 뜻을 띠도록 두었습니다.
  alternative_readings:
  - ‘운명’
  - ‘파멸’
  - ‘종말’
  rationale: 본문은 קֵץ를 반복하여 우리 삶의 끝과 도시의 붕괴를 함께 암시하므로, 어휘 자체는 ‘끝’으로 유지하고 문맥이 심판적 의미를 부여하도록 했습니다.
  doctrine_reference: 애가 4:18 문맥의 예루살렘 심판/멸망
- issue: ‘우리의 날이 찼다’의 관용성을 한국어에서 어떻게 드러낼지
  chosen_reading: 직역적 관용을 살리되 자연스러운 종결 표현으로 읽히게 했습니다.
  alternative_readings:
  - ‘우리의 날이 완료되었다’
  - ‘우리의 날이 끝났다’
  - ‘우리의 정해진 날이 다했다’
  rationale: 히브리어 관용구의 의미는 ‘정해진 시간이 끝났다’는 것이므로, 한국어에서도 시간의 완결을 드러내되 과도하게 해석하지 않았습니다.
  doctrine_reference: 히브리어 관용구의 의미론
