    issue: 인과절의 연결 범위
    rationale: ‘우리의 날이 찼으며, 우리의 끝이 이르렀기 때문입니다’는 이유가 바로 앞 절에만 걸리는 듯 읽힐 수 있습니다. 문장 분리는 원문의 반복과 이유 제시를 더 선명하게 합니다.
