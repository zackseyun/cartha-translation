  source_fidelity: 비교 구문과 ‘칼에 죽은 자들/굶주림에 죽은 자들’의 대조는 대체로 충실합니다. 그러나 둘째 문장의 ‘그들’은 한국어에서 선행하는 어느 집단을 가리키는지 다소 느슨하며, 현재형 ‘찔려 있습니다’는 과거 재난을 회고하는 시적 진술 안에서 어색합니다. 히브리어의 난해한 표현은 ‘밭의 소산이 없어 꿰찔린 채 쇠약해져 가는’으로 옮기고 각주에서 대안을 보존하는 것이 안전합니다.
  naturalness: ‘굶주림에 죽은 자들’도 이해되지만 ‘굶주림으로 죽임을 당한 이들’이 חַלְלֵי의 피동적 ‘죽임을 당한 자들’을 더 분명히 드러냅니다. 수식 대상을 ‘굶주림으로 죽임을 당한 이들’에 직접 연결하여 지시 대상의 모호성을 줄였습니다.
  terminology: ‘칼’, ‘굶주림’, ‘밭의 소산’은 현대 표준어의 격식 있는 성경 문체에 알맞습니다. מְדֻקָּרִים의 생생한 ‘꿰찔린’을 유지하되, 이것이 기근의 고통을 묘사하는 난해한 이미지라는 점은 각주로 보완합니다.
