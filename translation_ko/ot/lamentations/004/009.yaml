id: LAM.4.9
reference: Lamentations 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: טוֹבִ֤ים הָיוּ֙ חַלְלֵי חֶ֔רֶב מֵֽ/חַלְלֵ֖י רָעָ֑ב שֶׁ֣/הֵ֤ם יָז֨וּבוּ֙ מְדֻקָּרִ֔ים מִ/תְּנוּבֹ֖ת שָׂדָֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/009.yaml
  text: Better were those slain by the sword than those slain by hunger[a], who waste away, pierced through for lack of the produce of the field.
  footnotes:
  - marker: a
    text: Or 'who pine away, pierced through, because there is no produce from the field.' The Hebrew of this clause is difficult, especially the verb rendered 'waste away' and the force of the preposition in 'from/for lack of the produce of the field.'
    reason: lexical_alternative
translation:
  language: ko
  text: 칼에 죽임을 당한 이들이 밭의 소산이 없어 꿰찔린 채 쇠약해져 가는 굶주림으로 죽임을 당한 이들보다 더 나았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밭의 소산으로부터 멀어져 꿰찔린 채 시들어 가는 굶주림으로 죽임을 당한 이들보다.’ 히브리어 이 절은 특히 ‘쇠약해져 가다’로 옮긴 동사의 뜻과 ‘밭의 소산이 없어’로 옮긴 전치사의 의미가 어려워 해석이 갈립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבִים הָיוּ
  english_pob_choice: Better were / Better off were
  chosen_korean: 더 나았습니다
  alternatives_korean:
  - 더 좋았습니다
  - 더 나은 처지였습니다
  lexicon: HALOT
  rationale: טוֹב + היה의 비교적 용법을 살려 도덕적 ‘선함’이 아니라 상대적 상태의 우위를 간결하게 나타냈습니다.
- source_word: חַלְלֵי חֶרֶב / מֵחַלְלֵי רָעָב
  english_pob_choice: those slain by the sword / those slain by hunger
  chosen_korean: 칼에 죽은 자들 / 굶주림에 죽은 자들
  alternatives_korean:
  - 칼에 쓰러진 자들 / 기근에 쓰러진 자들
  - 칼로 죽임을 당한 자들 / 굶주림으로 죽임을 당한 자들
  lexicon: HALOT
  rationale: חָלָל의 ‘죽임을 당한 자’라는 뜻을 살리고, מ의 비교를 ‘~보다’로 자연스럽게 옮겼습니다.
- source_word: יָזוּבוּ
  english_pob_choice: waste away
  chosen_korean: 쇠약해지며
  alternatives_korean:
  - 시들어 가며
  - 말라 가며
  - 기운이 빠져 가며
  lexicon: HALOT
  rationale: 문맥상 굶주림으로 소진되는 상태를 가리키므로, 직역적인 ‘흘러가다’보다 의미를 드러내는 ‘쇠약해지다’가 적절합니다.
- source_word: מְדֻקָּרִים
  english_pob_choice: pierced through
  chosen_korean: 찔려 있습니다
  alternatives_korean:
  - 꿰뚫려 있습니다
  - 찔린 채 있습니다
  - 상처를 입고 있습니다
  lexicon: HALOT
  rationale: דקר의 기본 의미인 ‘찌르다, 꿰뚫다’를 유지하되, 굶주림의 비유적 고통을 무리 없이 살렸습니다.
- source_word: מִתְּנוּבֹת שָׂדָי
  english_pob_choice: for lack of the produce of the field
  chosen_korean: 밭의 소산이 없어서
  alternatives_korean:
  - 밭의 소산이 없으므로
  - 밭의 열매가 없어서
  - 밭의 생산물이 없어
  lexicon: HALOT
  rationale: מ의 결핍/원인 용법을 반영해 ‘없어서’로 옮겼고, תְּנוּבוֹת שָׂדַי를 ‘밭의 소산’으로 번역했습니다.
theological_decisions:
- issue: 비극적 비교의 강조
  chosen_reading: 이 절은 도덕 평가가 아니라 극한 기근 속에서의 상대적 비참을 비교하는 탄식으로 읽었습니다.
  alternative_readings:
  - 일반적인 죽음의 선호 표현으로 읽는 해석
  - 전쟁 죽음의 잔혹함을 강조하는 해석
  rationale: 비교 구문 וטוֹבִים הָיוּ와 문맥이 ‘어느 쪽이 더 낫다’는 탄식적 대비를 만들며, 본문은 죽음의 선호를 정당화하기보다 재난의 심각성을 드러냅니다.
  doctrine_reference: 문맥 중심의 시가/예언문 해석
