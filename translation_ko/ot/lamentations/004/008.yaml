  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 살려 ‘recognize’의 자연스러운 한국어인 ‘알아볼 수 없다’로 옮겼습니다.
- source_word: צָפַד עוֹרָם עַל עַצְמָם
  english_pob_choice: their skin has shriveled on their bones
  chosen_korean: 그들의 피부는 뼈에 쪼그라들었고
