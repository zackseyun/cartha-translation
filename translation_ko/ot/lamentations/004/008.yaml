id: LAM.4.8
reference: Lamentations 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָשַׁ֤ךְ מִ/שְּׁחוֹר֙ תָּֽאֳרָ֔/ם לֹ֥א נִכְּר֖וּ בַּ/חוּצ֑וֹת צָפַ֤ד עוֹרָ/ם֙ עַל עַצְמָ֔/ם יָבֵ֖שׁ הָיָ֥ה כָ/עֵֽץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/008.yaml
  text: Their appearance is darker than soot[a]; they are not recognized in the streets. Their skin has shriveled on their bones[b]; it has become dry like wood.
  footnotes:
  - marker: a
    text: Or 'darker than blackness.' The Hebrew term may denote blackness generally; 'soot' is chosen for a concrete image.
    reason: lexical_alternative
  - marker: b
    text: Or 'their skin clings to their bones.' The Hebrew verb can be understood as skin contracting tightly over the bones.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 모습은 그을음보다 더 어둡습니다[a]. 그들은 거리에서 알아볼 수 없습니다. 그들의 피부는 뼈에 쪼그라들었고[b], 나무처럼 말라 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘검음보다 더 어둡습니다.’ 히브리어는 일반적인 흑색을 가리킬 수 있으므로, 여기서는 더 구체적인 이미지를 위해 ‘그을음’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 피부가 그들의 뼈에 달라붙었습니다.’ 히브리어 동사는 피부가 뼈 위로 바짝 수축한 상태로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁךְ מִשְּׁחוֹר
  english_pob_choice: is darker than soot
  chosen_korean: 그을음보다 더 어둡습니다
  alternatives_korean:
  - 검은 것보다 더 어둡습니다
  - 숯보다 더 어둡습니다
  lexicon: HALOT
  rationale: 비교 표현 미ן과 שחור의 결합은 단순한 ‘검다’보다 더 짙어진 상태를 가리키므로, 한국어에서는 구체적 이미지인 ‘그을음’을 살려 시각적 충격을 전달했습니다.
- source_word: לֹא נִכְּרוּ
  english_pob_choice: they are not recognized
  chosen_korean: 알아볼 수 없습니다
  alternatives_korean:
  - 인정받지 못합니다
  - 알아보지 못합니다
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 살려 ‘recognize’의 자연스러운 한국어인 ‘알아볼 수 없다’로 옮겼습니다.
- source_word: צָפַד עוֹרָם עַל עַצְמָם
  english_pob_choice: their skin has shriveled on their bones
  chosen_korean: 그들의 피부는 뼈에 쪼그라들었고
  alternatives_korean:
  - 그들의 피부는 뼈에 달라붙었고
  - 그들의 피부는 뼈 위로 죄어 들었고
  lexicon: HALOT
  rationale: צפד는 굶주림으로 수축·오그라드는 모습을 가리키므로, ‘쪼그라들다’로 육체의 쇠약함을 분명하게 드러냈습니다.
- source_word: יָבֵשׁ הָיָה כָעֵץ
  english_pob_choice: it has become dry like wood
  chosen_korean: 나무처럼 말라 버렸습니다
  alternatives_korean:
  - 나무처럼 건조해졌습니다
  - 나무처럼 마른 상태가 되었습니다
  lexicon: HALOT
  rationale: עץ는 생명 없는 ‘나무/목재’의 건조함을 강조하므로, 문맥상 자연스러운 ‘말라 버리다’로 종결 이미지를 살렸습니다.
theological_decisions:
- issue: 시적 과장과 신체 묘사의 강도
  chosen_reading: 본문의 참혹한 굶주림 묘사를 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘매우 초췌합니다’로 조정
  - 신체적 디테일을 덜 드러내는 표현
  rationale: 예레미야 애가의 탄식 문맥에서는 육체의 붕괴를 생생하게 제시하는 것이 저자의 의도이므로, 이미지의 강도를 유지하는 편이 본문 충실성에 부합합니다.
  doctrine_reference: 시가서/예언서의 탄식 문맥 이해
- issue: 직접 인용표시 없이 병렬 서술 유지
  chosen_reading: 히브리어의 세 개 짧은 절을 한국어에서도 병렬적으로 유지했습니다.
  alternative_readings:
  - 문장을 하나로 매끈하게 합침
  - 의역하여 설명적 문장으로 확장
  rationale: 짧은 병렬은 붕괴와 황폐의 리듬을 형성하므로, 구조를 보존하는 것이 원문의 효과를 더 잘 전달합니다.
  doctrine_reference: 시적 평행법 보존
