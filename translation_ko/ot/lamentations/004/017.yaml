source:
  edition: WLC
  text: עוד/ינה תִּכְלֶ֣ינָה עֵינֵ֔י/נוּ אֶל עֶזְרָתֵ֖/נוּ הָ֑בֶל בְּ/צִפִּיָּתֵ֣/נוּ צִפִּ֔ינוּ אֶל גּ֖וֹי לֹ֥א יוֹשִֽׁעַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/017.yaml
  text: Still our eyes failed[a], looking in vain for our help; in our watching we watched for a nation that could not save.
  footnotes:
  - marker: a
    text: Or 'we waited for a nation that did not save.' The Hebrew verb can be rendered 'watched for,' 'waited for,' or 'looked for,' and the final clause may be understood as inability or failure.
    reason: lexical_alternative
translation:
  language: ko
  text: 아직도 우리의 눈은 헛되이 우리의 도움을 바라다 지쳤습니다. 우리가 살피며 살피던 것은 구원하지 못하는 한 나라였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 구원하지 못하는 한 나라를 기다렸다’로도 옮길 수 있습니다. 히브리어 동사는 ‘살피다/기다리다/바라보다’로 옮길 수 있고, 마지막 절은 능력의 부재 또는 실제 실패로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּכְלֶינָה עֵינֵינוּ
  english_pob_choice: our eyes failed
  chosen_korean: 우리의 눈은 … 지쳤습니다
  alternatives_korean:
  - 우리의 눈은 실패했습니다
  - 우리의 눈은 소진되었습니다
  - 우리의 눈은 끝났습니다
  lexicon: HALOT
  rationale: 눈이 기다림 속에서 다 닳아 힘이 빠진 상태를 한국어로 자연스럽게 옮기되, 시적 이미지인 ‘눈’은 유지했습니다.
- source_word: אֶל עֶזְרָתֵנוּ הָבֶל
  english_pob_choice: looking in vain for our help
  chosen_korean: 헛되이 우리의 도움을 바라다
  alternatives_korean:
  - 우리의 헛된 도움을 바라며
  - 허망하게 우리의 도움을 기다리며
  - 우리의 도움을 향해 헛되이
  lexicon: HALOT
  rationale: הבל의 ‘헛됨/허망함’을 분명히 드러내기 위해 ‘헛되이’를 넣고, 도움을 기대하던 방향성을 ‘바라다’로 살렸습니다.
- source_word: בְּצִפִּיָּתֵנוּ צִפִּינוּ
  english_pob_choice: in our watching we watched for
  chosen_korean: 우리가 살피며 살피던 것은
  alternatives_korean:
  - 우리가 기다리며 기다리던 것은
  - 우리가 바라며 바라던 것은
  - 우리가 기대하며 기대하던 것은
  lexicon: HALOT
  rationale: 같은 어근의 반복을 한국어에서도 ‘살피며 살피던’으로 살려, 간절한 감시적 기다림과 시적 평행을 반영했습니다.
- source_word: גּוֹי
  english_pob_choice: a nation
  chosen_korean: 한 나라
  alternatives_korean:
  - 한 민족
  - 한 나라의 백성
  - 한 나라(국가)
  lexicon: HALOT
  rationale: 여기서는 구원 기대의 대상인 정치적 실체를 가리키므로 ‘나라’가 가장 자연스럽습니다.
- source_word: לֹא יוֹשִׁיעַ
  english_pob_choice: could not save
  chosen_korean: 구원하지 못하는
  alternatives_korean:
  - 구원할 수 없는
  - 구원하지 않는
  - 구원해 주지 못하는
  lexicon: HALOT
  rationale: 미래적·능력적 무능을 포함한 부정 표현으로, 애가의 후회 섞인 탄식을 한국어 현재분사형으로 압축해 옮겼습니다.
theological_decisions:
- issue: 헛된 도움의 대상이 되는 외국 세력에 대한 탄식의 어조
  chosen_reading: 본문의 핵심은 정치적 동맹에 대한 기대가 완전히 무너진 절망을 드러내는 것이므로, ‘헛되이’와 ‘구원하지 못하는’으로 그 실패를 직접 표현했습니다.
  alternative_readings:
  - 도움을 얻지 못했다는 중립적 서술
  - 단순히 기다림의 지연으로 완화하는 읽기
  rationale: 애가의 문맥상 단순 지연이 아니라 실제로 기대가 좌절된 탄식이므로, 실패의 강도를 약화시키지 않았습니다.
  doctrine_reference: Lamentations 4장의 시적 탄식과 역사적 심판의 문맥
- issue: צִפִּינוּ의 반복 효과
  chosen_reading: 동일 어근의 반복을 ‘살피며 살피던’으로 옮겨, 집요하게 지켜보는 기다림의 긴장을 보존했습니다.
  alternative_readings:
  - ‘기다리며 기다리던’으로 일반화
  - ‘바라며 바라던’으로 정서화
  rationale: 원문의 반복은 단순한 중복이 아니라 절박한 기대의 강조이므로, 한국어에서도 반복감을 유지하는 편이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 시적 평행법과 수사적 반복
