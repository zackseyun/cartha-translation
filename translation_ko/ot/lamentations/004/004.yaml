    rationale: 각주는 ‘입천장’에 해당하는 히브리어 명사의 소유 접미사와 가능한 자연스러운 번역을 밝혀야 합니다. 영어 POB의 표현을 설명하는 것은 한국어 독자용 본문 각주의 기능이 아닙니다.
  - severity: medium
    issue: 각주 [b]의 ‘펴다/나누다’ 설명은 불명확하며, 원문의 생략된 구문을 충분히 반영하지 못합니다.
    rationale: פֹּרֵשׂ는 여기서 문맥상 빵을 떼어 나누어 주는 사람을 뜻합니다. ‘그들에게 빵을 떼어 줄 이가 없다’라는 직역적 구조를 제시하면 해석의 근거와 본문의 압축성을 더 정확히 보존할 수 있습니다.
