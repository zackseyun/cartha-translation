id: LAM.4.4
reference: Lamentations 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דָּבַ֨ק לְשׁ֥וֹן יוֹנֵ֛ק אֶל חכּ֖/וֹ בַּ/צָּמָ֑א עֽוֹלָלִים֙ שָׁ֣אֲלוּ לֶ֔חֶם פֹּרֵ֖שׂ אֵ֥ין לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/004.yaml
  text: The tongue of the nursing infant sticks to the roof of his mouth because of thirst[a]; children ask for bread[b], but no one breaks it for them.
  footnotes:
  - marker: a
    text: Or 'to his palate.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'there is none for them breaking [bread].' The sense is that no one breaks or distributes bread to them.
    reason: lexical_alternative
translation:
  language: ko
  text: 젖먹이의 혀가 목마름 때문에 입천장에 들러붙고, 어린아이들이 빵을 달라고 하지만 그들에게 떼어 줄 사람이 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘입천장’은 히브리어 חך의 직역에 가깝고, 영어 POB의 ‘roof of his mouth’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘떼어 줄’은 본문의 ‘펴다/나누다’라는 배급 행위를 한국어로 풀어낸 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבַק
  english_pob_choice: sticks
  chosen_korean: 들러붙고
  alternatives_korean:
  - 붙어 있고
  - 달라붙고
  lexicon: HALOT
  rationale: 동사 דבק의 ‘달라붙다/붙다’ 의미를 한국어에서 가장 자연스럽게 살려, 극심한 탈수 상태의 생생한 이미지를 전달했습니다.
- source_word: אֶל חכּוֹ
  english_pob_choice: to the roof of his mouth
  chosen_korean: 입천장에
  alternatives_korean:
  - 혀에
  - 입천장 끝에
  lexicon: HALOT
  rationale: חך는 입천장/입천장 쪽을 가리키므로, 현대 한국어에서 즉시 이해되는 ‘입천장에’로 옮겼습니다.
- source_word: עוֹלָלִים
  english_pob_choice: children
  chosen_korean: 어린아이들
  alternatives_korean:
  - 아이들
  - 어린이들
  lexicon: HALOT
  rationale: 문맥상 유아기에 가까운 연약한 아이들을 가리키므로, 단순한 ‘아이들’보다 더 구체적인 ‘어린아이들’이 מקור의 비참함을 잘 드러냅니다.
- source_word: פֹּרֵשׂ
  english_pob_choice: breaks it
  chosen_korean: 떼어 줄 사람이 없습니다
  alternatives_korean:
  - 나누어 줄 사람이 없습니다
  - 잘라 줄 사람이 없습니다
  lexicon: HALOT
  rationale: 히브리어는 빵을 ‘펴다/나누다’는 방식으로 배급의 부재를 말하므로, 한국어에서는 빵을 실제로 떼어 나누는 행위를 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 전쟁·기근 묘사의 직설성 유지
  chosen_reading: 완곡하게 풀지 않고, 굶주림으로 인한 신체적 붕괴 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 더 부드럽게 ‘입이 바싹 마르고’ 정도로 순화하기
  - ‘목이 마르다’로 일반화하기
  rationale: 예레미야애가의 애도시는 참혹함을 의도적으로 노출하므로, 소스의 충격 강도를 약화하지 않는 것이 본문 의도에 부합합니다.
  doctrine_reference: 애가의 예언적 애도와 심판 묘사
- issue: 무인칭 표현의 처리
  chosen_reading: ‘그들에게 떼어 줄 사람이 없습니다’로 무인칭/부재를 한국어에서 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘그들을 위해 빵을 나누는 자가 없습니다’
  - ‘그들에게는 빵을 쪼개는 이가 없습니다’
  rationale: 히브리어의 אֵין לָהֶם는 단순한 존재 부정이므로, 주어를 과하게 특정하지 않으면서도 문맥상 뜻이 분명한 한국어로 옮겼습니다.
  doctrine_reference: 문법적 부재 표현
