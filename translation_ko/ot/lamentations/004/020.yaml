id: LAM.4.20
reference: Lamentations 4:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ר֤וּחַ אַפֵּ֨י/נוּ֙ מְשִׁ֣יחַ יְהוָ֔ה נִלְכַּ֖ד בִּ/שְׁחִיתוֹתָ֑/ם אֲשֶׁ֣ר אָמַ֔רְנוּ בְּ/צִלּ֖/וֹ נִֽחְיֶ֥ה בַ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/020.yaml
  text: The breath of our nostrils[a], Yahweh’s anointed, was captured in their pits—he of whom we said, “Under his shadow we will live among the nations.”
  footnotes:
  - marker: a
    text: Or 'in their traps' or 'in their snares.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 콧구멍의 숨결, 야훼의 메시아가 그들의 구덩이에 붙잡혔습니다[a] — 그분에 대해 우리가 말하기를, “그분의 그늘 아래에서 우리는 민족들 가운데서 살 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 함정에’ 또는 ‘그들의 올무에’로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֤וּחַ אַפֵּינוּ
  english_pob_choice: the breath of our nostrils
  chosen_korean: 우리 콧구멍의 숨결
  alternatives_korean:
  - 우리 숨결
  - 우리 코의 숨결
  - 우리 생명
  lexicon: HALOT
  rationale: רוּחַ와 אַפֵּינוּ의 결합된 신체적 은유를 살리기 위해 직역에 가깝게 옮겼습니다. ‘콧구멍’은 현대 한국어에서 다소 생소하지만, 본문의 생명-의존 이미지를 유지하는 데 가장 직접적입니다.
- source_word: מְשִׁיחַ יְהוָה
  english_pob_choice: Yahweh’s anointed
  chosen_korean: 야훼의 메시아
  alternatives_korean:
  - 야훼의 기름부음 받은 자
  - 야훼의 기름부음 받은 왕
  - 주님의 기름부음 받은 자
  lexicon: HALOT
  rationale: 기름부음 받은 왕을 가리키는 역사적 표현이면서도, 한국어 기본 용례상 ‘메시아’가 제목성을 가장 압축적으로 드러냅니다. 다만 본문은 예언적 그리스도 호칭이 아니라 포로로 잡힌 다윗 왕조의 왕을 가리키므로, 문맥을 따라 번역했습니다.
- source_word: נִלְכַּד בִּשְׁחִיתוֹתָם
  english_pob_choice: was captured in their pits
  chosen_korean: 그들의 구덩이에 붙잡혔습니다
  alternatives_korean:
  - 그들의 함정에 붙잡혔습니다
  - 그들의 올무에 사로잡혔습니다
  - 그들의 구덩이에서 붙잡혔습니다
  lexicon: HALOT
  rationale: נלכד는 ‘붙잡히다/사로잡히다’의 의미이고, בִּשְׁחִיתוֹתָם은 문자적으로 ‘그들의 구덩이들/파괴적인 함정들’을 가리킬 수 있습니다. 본문 이미지를 살리면서도 한국어로 자연스럽게 읽히도록 ‘구덩이’로 두었습니다.
- source_word: בְּצִלּוֹ
  english_pob_choice: Under his shadow
  chosen_korean: 그분의 그늘 아래에서
  alternatives_korean:
  - 그분의 그늘에서
  - 그분의 보호 아래에서
  lexicon: HALOT
  rationale: 보호의 은유를 설명어로 바꾸지 않고 ‘그늘’ 이미지를 유지했습니다. 한국어에서는 ‘그늘 아래’가 안전과 보호를 함께 떠올리게 하므로 원문의 비유를 잘 전달합니다.
- source_word: בַגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 열방 가운데서
  - 나라들 가운데서
  - 이방 민족들 가운데서
  lexicon: HALOT
  rationale: 이 문맥의 גוים는 이방 ‘민족들’을 뜻하므로, 구약적 어감을 유지하되 NT식 ‘이방인’으로 좁히지 않기 위해 ‘민족들’로 옮겼습니다.
theological_decisions:
- issue: מְשִׁיחַ יְהוָה를 한국어에서 ‘메시아’로 옮길지, 역사적 왕 호칭으로 풀어낼지
  chosen_reading: ‘야훼의 메시아’로 옮기되, 본문은 포로로 잡힌 다윗 왕조의 왕을 가리키는 역사적 칭호로 이해합니다.
  alternative_readings:
  - 야훼의 기름부음 받은 자
  - 야훼의 기름부음 받은 왕
  rationale: 히브리어 원어는 후대의 종말론적 메시아 개념과 같은 어근을 공유하지만, 예레미야애가의 문맥에서는 실제 왕이 포로가 된 상황을 말합니다. 따라서 본문 의미를 과도하게 기독론화하지 않으면서도, 제목성은 유지했습니다.
  doctrine_reference: Translation philosophy; historical-context reading of מָשִׁיחַ
