source:
  edition: WLC
  text: ס֣וּרוּ טָמֵ֞א קָ֣רְאוּ לָ֗/מוֹ ס֤וּרוּ ס֨וּרוּ֙ אַל תִּגָּ֔עוּ כִּ֥י נָצ֖וּ גַּם נָ֑עוּ אָֽמְרוּ֙ בַּ/גּוֹיִ֔ם לֹ֥א יוֹסִ֖יפוּ לָ/גֽוּר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/015.yaml
  text: “Turn aside! Unclean!” they cried to them[a]. “Turn aside, turn aside, do not touch!” For they have fled; they have even wandered. Among the nations they said[b], “They will stay no longer.”
  footnotes:
  - marker: a
    text: Or, “they have been driven away” for “they have fled”; the Hebrew verb is rare and its nuance is debated in this context.
    reason: lexical_alternative
  - marker: b
    text: Or, “They will no longer sojourn,” preserving the sense of residing as foreigners.
    reason: lexical_alternative
translation:
  language: ko
  text: “비켜 가시오! 부정하다!” 그들이 그들에게 외쳤습니다. “비켜 가시오, 비켜 가시오, 만지지 마시오!” 그들은 달아났고[a], 심지어 떠돌아다니기까지 했습니다. 민족들 가운데서 그들이 말했습니다. “그들은 더 이상 머물지 않을 것이다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 쫓겨났다”로 옮길 수 있습니다. 이 히브리어 동사는 드물며, 이 문맥에서 그 뉘앙스가 논의됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들은 더 이상 나그네로 머물지 않을 것이다”로 옮길 수 있습니다. ‘거류하다/나그네로 머물다’의 뜻을 더 직접적으로 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  english_pob_choice: Turn aside
  chosen_korean: 돌아가시오
  alternatives_korean:
  - 비키시오
  - 돌아서시오
  lexicon: HALOT
  rationale: 분사적 외침으로서의 명령을 살리되, 한국어에서 즉각적인 회피·이탈의 경고를 자연스럽게 드러내기 위해 ‘돌아가시오’를 택했습니다.
- source_word: טָמֵא
  english_pob_choice: Unclean
  chosen_korean: 부정하다
  alternatives_korean:
  - 부정한 자다
  - 불결하다
  lexicon: HALOT
  rationale: 제의적·사회적 오염 판정을 드러내기 위해 명사형 감탄보다 형용사형 판단문으로 옮겼고, 성경 문맥의 ‘unclean’에 해당하는 표준어로 ‘부정하다’를 선택했습니다.
- source_word: נָצוּ
  english_pob_choice: they have fled
  chosen_korean: 달아났고
  alternatives_korean:
  - 도망쳤고
  - 쫓겨났고
  lexicon: HALOT
  rationale: 어근의 의미가 이 문맥에서 ‘도망/추방’의 긴장을 가지므로, POB의 기본 선택을 따라 ‘달아나다’로 옮겨 도주와 축출의 여운을 함께 남겼습니다.
- source_word: לָגוּר
  english_pob_choice: They will stay no longer
  chosen_korean: 더 이상 머물지 못할 것이다
  alternatives_korean:
  - 더 이상 거류하지 못할 것이다
  - 더 이상 나그네로 살지 못할 것이다
  lexicon: HALOT
  rationale: גור의 ‘거주하다/나그네로 머물다’의 뜻을 살리되, 현대 한국어에서 자연스러운 미래 부정으로 옮겨 ‘더 이상 머물지 못할 것이다’라고 했습니다.
theological_decisions:
- issue: 부정 선언의 사회-제의적 의미
  chosen_reading: ‘부정하다’는 단순 위생 표현이 아니라, 공동체에서 접촉을 금지해야 하는 제의적·사회적 오염 판정으로 이해했습니다.
  alternative_readings:
  - ‘불결하다’로 완화하여 위생적 의미로 읽는 해석
  rationale: 본문의 외침은 단순한 청결 문제가 아니라, 추방된 자들을 가까이하지 말라는 공동체적 배제를 반영합니다.
  doctrine_reference: 레위기 정결 규례의 제의적 언어
