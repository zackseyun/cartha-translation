  naturalness: ‘그들은 믿지 않았습니다. 땅의 왕들도 … 믿지 않았습니다’는 선행사가 불명확하고 불필요한 중복입니다. 한 문장으로 ‘땅의 왕들도 세상의 모든 주민도’가 공동 주어가 되게 하면 현대 한국어 문장으로 자연스럽습니다. ‘성문들로’보다 집합명사로 쓰이는 ‘성문으로’가 자연스럽습니다.
