  text: לֹ֤א הֶאֱמִ֨ינוּ֙ מַלְכֵי אֶ֔רֶץ ו/כל יֹשְׁבֵ֣י תֵבֵ֑ל כִּ֤י יָבֹא֙ צַ֣ר וְ/אוֹיֵ֔ב בְּ/שַׁעֲרֵ֖י יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/012.yaml
  text: The kings of the earth did not believe[a], nor did any of the inhabitants of the world, that an adversary and an enemy would enter the gates of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'that an adversary and an enemy would come into the gates of Jerusalem.' The Hebrew verb is simply 'come'; 'enter' makes the sense explicit in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅의 왕들도 세상의 모든 주민도, 적대자와 원수가 예루살렘 성문으로 들어오리라고[a] 믿지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘적대자와 원수가 예루살렘 성문에 오리라고.’ 히브리어 동사는 단순히 ‘오다’를 뜻하며, 여기서는 성문을 통하여 들어오는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא הֶאֱמִינוּ
  english_pob_choice: did not believe
  chosen_korean: 믿지 않았습니다
  alternatives_korean:
  - 신뢰하지 않았습니다
  - 그럴 리 없다고 생각하지 않았습니다
  lexicon: HALOT
  rationale: הֶאֱמִינוּ는 여기서 어떤 사실이 일어날 것이라는 점을 믿지 않다는 뜻이므로, 가장 직접적인 대응인 ‘믿지 않았습니다’를 택했습니다.
- source_word: מַלְכֵי אֶרֶץ
  english_pob_choice: the kings of the earth
  chosen_korean: 땅의 왕들
  alternatives_korean:
  - 세상의 왕들
  - 온 땅의 왕들
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 세계 전반을 가리키는 넓은 범위를 띠므로, 자연스러운 한국어로 ‘땅의 왕들’이라 옮겼습니다.
- source_word: יֹשְׁבֵי תֵבֵל
  english_pob_choice: the inhabitants of the world
  chosen_korean: 세상의 모든 주민
  alternatives_korean:
  - 세계의 모든 주민
  - 거주하는 온 세상 사람들
  lexicon: HALOT
  rationale: תֵבֵל은 ‘거주하는 세계’를 뜻하므로, 병렬성을 살리면서도 현대 한국어에 자연스러운 ‘세상의 모든 주민’으로 옮겼습니다.
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  english_pob_choice: the gates of Jerusalem
  chosen_korean: 예루살렘 성문들로
  alternatives_korean:
  - 예루살렘 성문으로
  - 예루살렘의 문들로
  lexicon: HALOT
  rationale: 동사 ‘들어오다’와 결합할 때 בְּ는 진입 지점을 나타내므로, 의미를 분명히 하여 ‘성문들로’라고 옮겼습니다.
theological_decisions:
- issue: 직접 화행 없이 서술적 선언 형태를 어떻게 살릴지
  chosen_reading: 시인은 예루살렘 함락의 충격을 과장 없이 서술하면서, 누구도 이런 침입을 예상하지 못했다는 사실을 강조합니다.
  alternative_readings:
  - ‘믿지 않았다’만 간명하게 번역
  - ‘그럴 줄은 아무도 몰랐다’로 의역
  rationale: 본문은 감정 과잉보다 집단적 불신을 진술하므로, 서술형으로 압축하되 놀라움의 강도를 유지했습니다.
  doctrine_reference: 시적 예언문맥의 문법-수사적 기능
