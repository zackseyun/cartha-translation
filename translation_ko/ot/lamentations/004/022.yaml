  naturalness: ‘딸 시온아/딸 에돔아’는 히브리 시의 인격화된 호칭을 보존하면서 한국어에서도 자연스럽습니다. 첫 절을 ‘네 형벌은 끝났습니다’로 바꾸고, 뒤 절의 병렬 동사를 ‘벌하시고 … 드러내셨습니다’로 연결하면 더 매끄럽습니다.
  terminology: ‘형벌’은 여기서 עָוֹן의 결과·형벌 의미를 문맥적으로 나타냅니다. ‘죄악’은 에돔에 관한 פָּקַד의 목적어로 유지하고, חַטֹּאת는 ‘죄’로 옮깁니다. 암시된 신적 주어는 별도 명사로 보충하지 않고 존대 동사로 처리합니다.
