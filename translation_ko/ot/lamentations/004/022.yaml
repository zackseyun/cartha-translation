id: LAM.4.22
reference: Lamentations 4:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּם עֲוֺנֵ/ךְ֙ בַּת צִיּ֔וֹן לֹ֥א יוֹסִ֖יף לְ/הַגְלוֹתֵ֑/ךְ פָּקַ֤ד עֲוֺנֵ/ךְ֙ בַּת אֱד֔וֹם גִּלָּ֖ה עַל חַטֹּאתָֽיִ/ךְ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/022.yaml
  text: Your punishment is finished[a], daughter Zion; he will not exile you again. He has punished your iniquity, daughter Edom[c][b]; he has uncovered your sins.
  footnotes:
  - marker: a
    text: Or 'Your iniquity is finished' or 'Your guilt is ended.' The Hebrew word can mean iniquity, guilt, or the punishment resulting from guilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'he has visited your iniquity'—that is, he has called it to account in judgment.
    reason: lexical_alternative
  - marker: c
    text: Or 'he has exposed your sins' or 'revealed your sins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 딸 시온아, 네 죄악은 끝났습니다[a]. 그는 너를 다시는 포로로 끌고 가지 않을 것입니다. 딸 에돔아, 네 죄악을 벌하셨고[b] 네 죄를 드러내셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 죄악이 끝났습니다’ 또는 ‘네 죄책이 끝났습니다.’ 히브리어는 죄악, 죄책, 또는 그로 인한 형벌을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 죄악을 찾아내셨습니다’ — 곧 심판에서 그것을 책임 있게 다루셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘네 죄를 폭로하셨습니다’ 또는 ‘네 죄를 드러내셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּם עֲוֺנֵךְ
  english_pob_choice: Your punishment is finished
  chosen_korean: 네 죄악은 끝났습니다
  alternatives_korean:
  - 네 형벌은 끝났습니다
  - 네 죄책은 끝났습니다
  - 네 죄악은 완료되었습니다
  lexicon: HALOT
  rationale: עָוֹן은 문맥에 따라 죄악, 죄책, 또는 그 결과로서의 형벌을 뜻할 수 있으므로, 시온의 포로 생활이 끝난다는 문맥을 살려 ‘끝났습니다’로 옮겼습니다.
- source_word: בַּת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 딸 시온
  alternatives_korean:
  - 시온의 딸
  - 시온의 딸아
  lexicon: HALOT
  rationale: 예언시의 인격화된 호칭을 보존하기 위해 ‘딸 시온’ 구조를 살렸고, 한국어 어순에 맞게 자연스럽게 배치했습니다.
- source_word: לֹא יוֹסִיף לְהַגְלוֹתֵךְ
  english_pob_choice: he will not exile you again
  chosen_korean: 그는 너를 다시는 포로로 끌고 가지 않을 것입니다
  alternatives_korean:
  - 그는 너를 다시는 포로로 보내지 않을 것입니다
  - 그는 너를 다시는 유배하지 않을 것입니다
  lexicon: HALOT
  rationale: יוֹסִיף + 부정 부정사 구문은 ‘다시/더 이상’의 반복 금지를 뜻하므로, 현대 한국어에서 자연스러운 ‘다시는 … 않을 것입니다’로 옮겼습니다.
- source_word: פָּקַד עֲוֺנֵךְ
  english_pob_choice: He has punished your iniquity
  chosen_korean: 네 죄악을 벌하셨고
  alternatives_korean:
  - 네 죄악을 찾아내셨고
  - 네 죄악을 심판하셨고
  - 네 죄악을 돌보셨고
  lexicon: HALOT
  rationale: פָּקַד은 여기서 심판적 ‘벌하다/책망하다’의 뜻이므로, 전통적 ‘방문하다’보다 현대 독자가 판단 의미를 바로 이해하도록 ‘벌하셨고’로 옮겼습니다.
- source_word: גִּלָּה עַל חַטֹּאתָיִךְ
  english_pob_choice: he has uncovered your sins
  chosen_korean: 네 죄를 드러내셨습니다
  alternatives_korean:
  - 네 죄를 폭로하셨습니다
  - 네 죄를 드러내셨고
  - 네 죄를 밝혀내셨습니다
  lexicon: HALOT
  rationale: גִּלָּה는 ‘드러내다/덮개를 벗기다’의 뜻이어서, 은유를 살리면서도 한국어에서 자연스러운 ‘드러내셨습니다’로 번역했습니다.
theological_decisions:
- issue: עָוֹן의 의미 범위와 첫 행의 종결 선언
  chosen_reading: 시온의 형벌/죄책이 끝났다는 선언으로 읽되, 본문에는 ‘죄악은 끝났습니다’로 유지했습니다.
  alternative_readings:
  - ‘네 형벌은 끝났습니다’
  - ‘네 죄책은 끝났습니다’
  rationale: 히브리어 עָוֹן은 죄악과 그 결과를 함께 가리킬 수 있으므로, 시온의 징계가 समाप्त된다는 문맥을 살리면서도 원어의 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (문맥적 의미 우선, 용례 차이 허용)
- issue: 암시된 주어의 처리
  chosen_reading: 히브리어의 암시된 주어를 한국어에서 ‘그는’으로 유지했습니다.
  alternative_readings:
  - 여호와께서
  - 주께서
  rationale: 본문에는 주어가 명시되지 않으므로, 원문의 절제된 표현을 보존하기 위해 직접 하나님의 이름을 보충하지 않았습니다.
  doctrine_reference: Translation philosophy §1 (원어 우선성과 보충 최소화)
