id: LAM.1.4
reference: Lamentations 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דַּרְכֵ֨י צִיּ֜וֹן אֲבֵל֗וֹת מִ/בְּלִי֙ בָּאֵ֣י מוֹעֵ֔ד כָּל שְׁעָרֶ֨י/הָ֙ שֽׁוֹמֵמִ֔ין כֹּהֲנֶ֖י/הָ נֶאֱנָחִ֑ים בְּתוּלֹתֶ֥י/הָ נּוּג֖וֹת וְ/הִ֥יא מַר לָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/004.yaml
  text: The roads of Zion mourn[a], because no one comes to the appointed feast; all her gates are desolate, her priests groan, her virgins grieve[b], and she herself is bitter.
  footnotes:
  - marker: a
    text: Or 'the appointed festival' or 'the appointed time'; Hebrew mo'ed can denote an appointed time or a festal assembly.
    reason: lexical_alternative
  - marker: b
    text: Or 'her maidens.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시온의 길들은 슬퍼합니다[a]. 이는 절기 때에 오는 이가 없기 때문입니다. 그 성문들은 모두 황폐하고, 제사장들은 신음하며, 그 처녀들은 근심하고[b], 그 자신은 쓰라립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정해진 절기’ 혹은 ‘정해진 때’. 히브리어 mo‘ed는 정해진 시간이나 축제 집회를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 여인들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי צִיּוֹן
  english_pob_choice: The roads of Zion
  chosen_korean: 시온의 길들은
  alternatives_korean:
  - 시온의 도로들은
  - 시온의 길들
  lexicon: HALOT
  rationale: דֶּרֶךְ의 복수는 문자적으로는 길/도로를 뜻하며, 여기서는 순례자들이 오가던 접근로를 가리키는 시적 의인화이므로 ‘길들’로 자연스럽게 살렸습니다.
- source_word: מִבְּלִי בָּאֵי מוֹעֵד
  english_pob_choice: because no one comes to the appointed feast
  chosen_korean: 절기 때에 오는 이가 없기 때문입니다
  alternatives_korean:
  - 정해진 때에 오는 이가 없기 때문입니다
  - 절기에 오는 순례자가 없기 때문입니다
  lexicon: HALOT
  rationale: מִבְּלִי는 ‘~이 없기 때문에/결핍 때문에’의 뜻이고, מוֹעֵד는 문맥상 절기·축제의 뜻이 우선이므로, ‘절기 때’로 구체화하되 과도하게 풀이하지 않았습니다.
- source_word: שׁוֹמֵמִין
  english_pob_choice: are desolate
  chosen_korean: 황폐하고
  alternatives_korean:
  - 황량하고
  - 버려져 있고
  lexicon: HALOT
  rationale: 참사의 공허함과 폐허 상태를 드러내는 말이므로, 문맥의 애가 어조에 맞는 ‘황폐하고’를 택했습니다.
- source_word: בְּתוּלֹתֶיהָ
  english_pob_choice: her virgins
  chosen_korean: 그 처녀들은
  alternatives_korean:
  - 그 동녀들은
  - 그 젊은 여자들은
  lexicon: HALOT
  rationale: בְּתוּלָה는 기본적으로 ‘처녀/미혼의 젊은 여자’를 뜻하므로, 어휘의 직접성을 살려 ‘처녀들’로 옮겼습니다.
- source_word: מַר לָהּ
  english_pob_choice: is bitter
  chosen_korean: 쓰라립니다
  alternatives_korean:
  - 괴롭습니다
  - 고통스럽습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 내면의 쓰라린 고통을 가리키므로, 감각적으로도 정서적으로도 가까운 ‘쓰라립니다’를 사용했습니다.
theological_decisions:
- issue: 시온/예루살렘의 여성 의인화 유지
  chosen_reading: ‘그 성문들’, ‘그 자신은’처럼 여성형 소유·인칭을 살려 시온을 애가의 여인으로 드러냈습니다.
  alternative_readings:
  - 도시를 중성적으로 ‘그것’으로 옮기는 방식
  rationale: 히브리어의 여성형 표현이 시 전체의 탄식 수사와 긴밀히 연결되므로, 의인화를 지우지 않는 것이 본문의 정서와 구조에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
