revisions:
- from: 시온의 길들은 슬퍼합니다[a]. 이는 절기 때에 오는 이가 없기 때문입니다. 그 성문들은 모두 황폐하고, 제사장들은 신음하며, 그 처녀들은 근심하고[b], 그 자신은 쓰라립니다.
  to: 시온의 길들은 절기에[a] 오는 이가 없어서 슬퍼합니다. 그녀의 모든 성문은 황폐하고, 그녀의 제사장들은 신음하며, 그녀의 처녀들은 근심하고[b], 그녀 자신은 쓰라림에 잠겨 있습니다.
