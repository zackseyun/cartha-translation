revisions:
- from: 백성들은 다 신음하며 빵을 찾습니다. 그들은 생명을 회복하려고 자기의 귀한 것들을 먹을 것으로 내주었습니다. 야훼여, 보시고 살피소서. 내가 멸시를 당하게 되었기 때문입니다.
  to: 그 성의 모든 백성은 신음하며 빵을 찾습니다. 그들은 생명을 회복하려고 자기들의 귀한 것들을 먹을 것과 바꾸었습니다[a][b]. 야훼여, 보시고 살펴보소서. 내가 멸시받는 처지가 되었습니다[c].
  rationale: 소유 관계(‘그 성의 모든 백성’)를 복원하고, 귀중품과 식량의 교환 관계를 ‘먹을 것과 바꾸었습니다’로 명시했습니다. 마지막 절은 원문의 완료된 비참한 상태를 자연스러운 한국어로 반영했습니다. 어휘상 열려 있는 표현들은 본문을 과도하게 좁히지 않도록 각주로 보완했습니다.
