id: LAM.1.11
reference: Lamentations 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל עַמָּ֤/הּ נֶאֱנָחִים֙ מְבַקְּשִׁ֣ים לֶ֔חֶם נָתְנ֧וּ מחמודי/הם בְּ/אֹ֖כֶל לְ/הָשִׁ֣יב נָ֑פֶשׁ רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה כִּ֥י הָיִ֖יתִי זוֹלֵלָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/011.yaml
  text: All her people groan[a], seeking bread; they have given their precious things for food to restore life. Look, O Yahweh, and see[c][b], for I have become despised.
  footnotes:
  - marker: a
    text: Or 'their treasures' / 'their desirable things.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'to restore the soul/life'; here the sense is to regain strength or preserve life.
    reason: lexical_alternative
  - marker: c
    text: Or 'for I have become vile' / 'contemptible.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성의 모든 백성은 신음하며 빵을 찾습니다. 그들은 생명을 회복하려고 자기들의 귀한 것들을 먹을 것과 바꾸었습니다[a][b]. 야훼여, 보시고 살펴보소서. 내가 멸시받는 처지가 되었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀한 것들’은 ‘보물들’, ‘소중한 물건들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘생명(네페시)을 회복하려고’입니다. 여기서는 기력을 되찾거나 생명을 보존한다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘멸시받는’은 ‘비천한’, ‘경멸할 만한’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱנָחִים
  english_pob_choice: groan
  chosen_korean: 신음하며
  alternatives_korean:
  - 탄식하며
  - 끙끙거리며
  lexicon: HALOT
  rationale: 가뭄과 멸망의 상황에서 들리는 고통의 소리를 자연스럽게 살리면서, ‘신음’이 문맥의 무게를 잘 전달합니다.
- source_word: מְבַקְּשִׁים לֶחֶם
  english_pob_choice: seeking bread
  chosen_korean: 빵을 찾습니다
  alternatives_korean:
  - 빵을 구합니다
  - 먹을 것을 찾습니다
  lexicon: HALOT
  rationale: ‘빵’은 생존을 위한 식량을 가리키는 직설적 표현이므로, 문맥상 일반적 음식보다 더 원문에 가깝게 유지했습니다.
- source_word: מחמודיהם
  english_pob_choice: their precious things
  chosen_korean: 자기의 귀한 것들
  alternatives_korean:
  - 그들의 보물
  - 그들의 소중한 것들
  - 그들의 값진 물건들
  lexicon: HALOT
  rationale: 이 명사는 단순한 재산보다 ‘바라던/귀중한 물건들’을 넓게 가리키므로, ‘귀한 것들’이 지나치게 좁히지 않으면서도 의미를 보존합니다.
- source_word: לְהָשִׁיב נָפֶשׁ
  english_pob_choice: to restore life
  chosen_korean: 생명을 회복하려고
  alternatives_korean:
  - 생명을 되찾으려고
  - 기력을 회복하려고
  - 목숨을 부지하려고
  lexicon: HALOT
  rationale: נֶפֶשׁ를 여기서는 ‘영혼’이 아니라 생명/목숨으로 이해해야 하므로, 생존의 의미를 드러내는 ‘생명을 회복’으로 옮겼습니다.
- source_word: זוֹלֵלָה
  english_pob_choice: despised
  chosen_korean: 멸시를 당하게 되었기
  alternatives_korean:
  - 천대받게 되었기
  - 경멸받게 되었기
  - 비천하게 되었기
  lexicon: HALOT
  rationale: 문맥상 ירושלים의 수치와 사회적 경멸을 나타내므로, 상태 형용사보다 수동적 결과를 드러내는 표현이 더 자연스럽습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼로 옮기고 직접 부르는 호격은 ‘야훼여’로 유지했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트의 표준에 따라 YHWH를 ‘야훼’로 유지해야 하며, 탄식 속 기도문이므로 호격을 살려 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
