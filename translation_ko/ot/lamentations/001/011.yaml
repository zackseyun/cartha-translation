  source_fidelity: 수정이 필요합니다. 초안은 기근 가운데 신음하며 빵을 찾고, 귀중품을 먹을 것과 바꾸어 생명을 회복하려 한다는 뜻을 대체로 충실히 옮겼습니다. 그러나 כָּל־עַמָּהּ(‘그 성의/그녀의 모든 백성’)의 소유 관계가 ‘백성들은 다’에서 빠졌고, הָיִיתִי זוֹלֵלָה는 완료된 상태 변화인 ‘내가 멸시받는 처지가 되었습니다’에 더 가깝습니다.
  naturalness: 합쇼체의 기도체와 서술체는 자연스럽습니다. 다만 ‘그 성의 모든 백성은’ 및 ‘멸시받는 처지가 되었습니다’가 문맥상 화자인 예루살렘과 현재의 참상을 더 또렷하고 자연스럽게 드러냅니다.
  terminology: ‘야훼’는 프로젝트 표기 원칙에 맞고, נֶפֶשׁ를 ‘생명’으로 옮긴 것도 적절합니다. מַחֲמַדִּים은 ‘귀한 것들’로 유지하되, ‘보물/소중한 물건들’이라는 폭넓은 어휘 가능성은 각주로 밝혀 두는 것이 좋습니다.
