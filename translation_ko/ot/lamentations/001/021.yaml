id: LAM.1.21
reference: Lamentations 1:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמְע֞וּ כִּ֧י נֶאֱנָחָ֣ה אָ֗נִי אֵ֤ין מְנַחֵם֙ לִ֔/י כָּל אֹ֨יְבַ֜/י שָׁמְע֤וּ רָֽעָתִ/י֙ שָׂ֔שׂוּ כִּ֥י אַתָּ֖ה עָשִׂ֑יתָ הֵבֵ֥אתָ יוֹם קָרָ֖אתָ וְ/יִֽהְי֥וּ כָמֽוֹ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/021.yaml
  text: They have heard that I groan[a]; there is no one to comfort me. All my enemies have heard of my trouble; they rejoice that you have done it. You have brought the day you proclaimed[c][b]; let them become like me.
  footnotes:
  - marker: a
    text: Or 'my calamity' or 'my misery' for 'my trouble.' The Hebrew term can denote disaster or affliction.
    reason: lexical_alternative
  - marker: b
    text: Or 'You have brought the day you announced.' The verb can mean 'proclaimed' or 'announced' in this context.
    reason: lexical_alternative
  - marker: c
    text: Or 'and they will be like me.' The Hebrew form may be read as a wish ('let them become like me') or as a future statement, though the wish fits the lament context well.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 내가 신음하는 것을 들었습니다. 나를 위로할 자가 없습니다. 내 모든 원수들이 내 재앙을 들었습니다. 당신이 그것을 행하셨기 때문에 그들이 기뻐합니다. 당신이 선포하신 그 날을 가져오셨으니, 그들이 나와 같이 되게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '내 재앙', '내 불행'으로도 옮길 수 있습니다. 히브리어는 재난과 고통을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '당신이 알리신 그 날을 가져오셨으니'로도 옮길 수 있습니다. 이 동사는 이 문맥에서 '선포하다' 또는 '알리다'의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그들이 나와 같이 될 것이다'로도 읽을 수 있습니다. 히브리어 형태는 미래 진술로도, 여기처럼 바람의 표현으로도 읽힐 수 있으나, 애가의 문맥에는 바람의 의미가 더 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶאֱנָחָה
  english_pob_choice: I groan
  chosen_korean: 내가 신음하는 것
  alternatives_korean:
  - 내가 탄식하는 것
  - 내가 한숨 쉬는 것
  lexicon: HALOT
  rationale: אנח의 distress-groaning을 현대 한국어에서 자연스럽게 살리려면 '신음하다'가 가장 직접적이며, '탄식하다'보다 육체적·정서적 고통이 더 강하게 드러납니다.
- source_word: אֵין מְנַחֵם לִי
  english_pob_choice: there is no one to comfort me
  chosen_korean: 나를 위로할 자가 없습니다
  alternatives_korean:
  - 나를 위로하는 이가 없습니다
  - 나를 달래 줄 자가 없습니다
  lexicon: HALOT
  rationale: אֵין + 분사 구조의 부재를 한국어에서 가장 자연스럽게 '...할 자가 없습니다'로 옮겨, 위로의 부재를 분명하게 전달했습니다.
- source_word: רָעָתִי
  english_pob_choice: my trouble
  chosen_korean: 내 재앙
  alternatives_korean:
  - 내 고통
  - 내 불행
  - 내 곤경
  lexicon: HALOT
  rationale: 문맥상 단순한 '문제'보다 공동체의 파괴와 심판의 성격이 있는 재난/재앙이 더 강하게 드러나므로, POB의 'trouble'을 한국어에서 더 긴장감 있게 옮겼습니다.
- source_word: הֵבֵאתָ יוֹם קָרָאתָ
  english_pob_choice: You have brought the day you proclaimed
  chosen_korean: 당신이 선포하신 그 날을 가져오셨으니
  alternatives_korean:
  - 당신이 알리신 그 날을 가져오셨으니
  - 당신이 선언하신 그 날을 가져오셨으니
  lexicon: HALOT
  rationale: קרא는 이 문맥에서 단순히 '부르다'보다 심판의 날을 '선포하다/공포하다'는 의미가 자연스러워, POB의 'proclaimed'를 따라 '선포하신'으로 옮겼습니다.
- source_word: וְיִהְיוּ כָמוֹנִי
  english_pob_choice: let them become like me
  chosen_korean: 그들이 나와 같이 되게 하십시오
  alternatives_korean:
  - 그들이 나와 같게 되기를 바랍니다
  - 그들이 나처럼 되게 하십시오
  lexicon: HALOT
  rationale: 문맥상 예언적 진술보다 탄원/저주에 가까운 요청이므로, 한국어 명령·청원형으로 옮겨 원문의 간청적 힘을 보존했습니다.
theological_decisions:
- issue: 재앙의 원인으로서 하나님의 직접적 행위
  chosen_reading: 원문이 하나님을 직접 향해 '당신이 그것을 행하셨기 때문에'라고 말하므로, 이를 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 원인을 흐리게 하는 수동적 표현
  - 하나님의 행위를 덜 직접적으로 표현하는 완곡한 번역
  rationale: 애가의 신학적 긴장은 심판의 주체를 하나님께 직접 돌리는 데 있으므로, 번역이 그 긴장을 희석하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
