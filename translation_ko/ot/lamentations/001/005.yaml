  source_fidelity: 전반적으로 히브리어의 병행 구조와 야훼의 직접적 행위, 예루살렘의 죄책을 충실히 반영합니다. 다만 עוֹלָלֶיהָ는 일반적인 ‘자녀들’보다 취약한 어린아이들을 더 구체적으로 가리키므로 이를 본문에 반영하는 편이 안전합니다. פְּשָׁעֶיהָ도 법률적 범죄로 좁혀질 수 있는 ‘범죄’보다 언약적 위반을 포괄하는 ‘죄악’이 더 적절합니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. ‘머리가 되었다’는 직역적 이미지를 보존하지만 한국어에서는 ‘우두머리가 되었다’가 더 자연스럽고, 지배적 지위라는 관용적 의미도 명확히 전달합니다.
