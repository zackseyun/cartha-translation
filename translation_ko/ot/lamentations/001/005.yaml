source:
  edition: WLC
  text: הָי֨וּ צָרֶ֤י/הָ לְ/רֹאשׁ֙ אֹיְבֶ֣י/הָ שָׁל֔וּ כִּֽי יְהוָ֥ה הוֹגָ֖/הּ עַ֣ל רֹב פְּשָׁעֶ֑י/הָ עוֹלָלֶ֛י/הָ הָלְכ֥וּ שְׁבִ֖י לִ/פְנֵי צָֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/005.yaml
  text: Her foes have become the head[a]; her enemies prosper, because Yahweh has afflicted her for the multitude of her transgressions[b]. Her children have gone away into captivity before the foe.
  footnotes:
  - marker: a
    text: Or 'are at ease' / 'live securely' for 'prosper.' The Hebrew verb can denote ease or security as well as flourishing.
    reason: lexical_alternative
  - marker: b
    text: Or 'her little ones' or 'her infants.' The Hebrew term refers to young children and emphasizes their vulnerability.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 원수들은 머리가 되었고[a], 그녀의 적들은 번성했습니다. 야훼께서 그녀의 많은 범죄 때문에 그녀를 괴롭게 하셨기 때문입니다. 그녀의 자녀들은 원수 앞에서 포로로 끌려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지배자가 되었다’, ‘우두머리가 되었다’. 히브리어 표현은 우위와 통치를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: צָרֶיהָ / אֹיְבֶיהָ
  english_pob_choice: her foes / her enemies
  chosen_korean: 그녀의 원수들 / 그녀의 적들
  alternatives_korean:
  - 그녀의 대적들
  - 그녀를 해치는 자들
  lexicon: HALOT
  rationale: צַר·אויב의 적대 관계를 한국어의 자연스러운 병렬로 살리되, 두 표현을 구분해 원문 병행 구조를 드러냈습니다.
- source_word: לְרֹאשׁ
  english_pob_choice: have become the head
  chosen_korean: 머리가 되었고
  alternatives_korean:
  - 우두머리가 되었고
  - 정상이 되었고
  lexicon: HALOT
  rationale: 히브리어 관용구의 지배·우위 이미지를 살려 직역에 가깝게 옮겼습니다.
- source_word: שָׁל֔וּ
  english_pob_choice: prosper
  chosen_korean: 번성했습니다
  alternatives_korean:
  - 평안합니다
  - 안전하게 삽니다
  lexicon: HALOT
  rationale: 문맥상 예루살렘의 반전된 현실을 보여 주는 말로서 단순한 ‘평안’보다 ‘번성’이 더 강하게 대비됩니다.
- source_word: הוֹגָהּ
  english_pob_choice: has afflicted her
  chosen_korean: 그녀를 괴롭게 하셨습니다
  alternatives_korean:
  - 그녀를 괴롭게 하셨다
  - 그녀에게 고통을 주셨습니다
  lexicon: HALOT
  rationale: י־ג־ה의 인과적 뉘앙스를 살리면서도 한국어에서 자연스럽게 들리는 고난·괴로움의 표현을 택했습니다.
- source_word: עַל רֹב פְּשָׁעֶיהָ
  english_pob_choice: for the multitude of her transgressions
  chosen_korean: 그녀의 많은 범죄 때문에
  alternatives_korean:
  - 그녀의 많은 허물 때문에
  - 그녀의 수많은 반역 때문에
  lexicon: HALOT
  rationale: רֹב의 ‘많음’과 פֶּשַׁע의 언약적 위반을 반영하되, 문장 흐름상 가장 분명한 원인 절로 처리했습니다.
- source_word: עוֹלָלֶיהָ
  english_pob_choice: her children
  chosen_korean: 그녀의 자녀들
  alternatives_korean:
  - 그녀의 어린아이들
  - 그녀의 젖먹이들
  lexicon: HALOT
  rationale: עוֹלָל의 취약한 어린 생명을 가리키는 폭을 유지하면서도, 문맥에 맞게 포괄적인 ‘자녀들’을 택했습니다.
- source_word: שְׁבִי
  english_pob_choice: into captivity
  chosen_korean: 포로로
  alternatives_korean:
  - 포로 상태로
  - 포로로서
  lexicon: HALOT
  rationale: ‘포로 상태’라는 결과를 한국어 동사구로 압축해 ‘끌려갔습니다’와 자연스럽게 연결했습니다.
theological_decisions:
- issue: 야훼의 직접적 징계와 인간의 죄책을 함께 보존할 것인지
  chosen_reading: 야훼께서 그녀의 많은 범죄 때문에 그녀를 괴롭게 하셨습니다
  alternative_readings:
  - 야훼께서 그녀에게 고통을 주셨습니다
  - 그녀의 죄 때문에 고난이 닥쳤습니다
  rationale: 원문이 분명히 하나님(야훼)의 행위와 예루살렘의 범죄를 함께 진술하므로, 원인과 책임의 긴장을 완화하지 않고 그대로 유지했습니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장 보존); יְהוָה → 야훼
- issue: ‘원수 앞에서’의 이미지 보존 여부
  chosen_reading: 원수 앞에서 포로로 끌려갔습니다
  alternative_readings:
  - 적 앞에서 포로가 되었습니다
  - 적에게 끌려갔습니다
  rationale: לִפְנֵי צָר의 공간적·굴욕적 이미지를 살려, 단순한 결과 진술보다 ‘앞에서’의 수치를 드러냈습니다.
  doctrine_reference: Source image preservation principle
