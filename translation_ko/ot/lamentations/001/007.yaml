  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리면서, 시가체의 압박감을 유지했습니다.
- source_word: רָאוּהָ צָרִים / foes saw her
  english_pob_choice: foes saw her
  chosen_korean: 대적들이 그를 보았고
  alternatives_korean:
  - 원수들이 그를 보았고
  - 적들이 그를 보았고
  lexicon: HALOT
  rationale: 복수형의 적대자를 한국어 시적 문맥에 맞게 ‘대적들’로 옮겼습니다.
- source_word: עַל מִשְׁבַּתֶּהָ / at her downfall
