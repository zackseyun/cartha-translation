  chosen_korean: 그의 무너짐
  alternatives_korean:
  - 그의 멸망
  - 그의 황폐함
  lexicon: HALOT
  rationale: 논쟁적인 명사의 의미를 ‘무너짐’으로 처리해, 붕괴·몰락의 시각적 이미지를 보존했습니다.
theological_decisions:
- issue: 예루살렘의 의인화와 대명사 처리
  chosen_reading: 예루살렘과 그 백성을 모두 시의 대상에 맞게 ‘그’로 받아 자연스럽게 연결했습니다.
  alternative_readings:
  - 예루살렘을 계속 ‘그녀’로 일관해 옮기는 방식
  - ‘도와줄 자가 없었으므로’를 더 문어적으로 처리하는 방식
  rationale: 히브리어는 예루살렘을 여성 단수로 의인화하지만, 한국어에서는 도시와 백성을 함께 포함하는 시적 호칭을 과도하게 성별화하지 않는 편이 본문의 비탄을 더 सीधे 전달합니다.
  doctrine_reference: 시가의 의인화와 집합적 지시 처리
- issue: ‘무너짐’의 번역
  chosen_reading: ‘무너짐’으로 옮겨 폐허와 몰락의 이중 의미를 남겼습니다.
  alternative_readings:
  - ‘멸망’으로 확정하는 방식
  - ‘황폐함’으로 상태를 강조하는 방식
  rationale: 히브리어의 논쟁적 어휘가 가리키는 붕괴·황폐의 긴장을 단일한 개념으로 과도하게 좁히지 않기 위해 중립적이면서도 구체적인 표현을 택했습니다.
  doctrine_reference: 예루살렘 파괴에 대한 시적 애도
