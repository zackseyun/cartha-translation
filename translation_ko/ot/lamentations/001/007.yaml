  lexicon: HALOT
  rationale: 희귀한 어휘의 논쟁성을 고려해, 이동·유랑의 구체적 이미지를 살리면서도 한국어 문맥에 자연스럽게 맞췄습니다.
- source_word: כֹּל מַחֲמֻדֶיהָ / all her precious things
  english_pob_choice: all her precious things
  chosen_korean: 자기의 모든 귀한 것들
  alternatives_korean:
  - 자기의 모든 보물들
  - 자기의 모든 소중한 것들
  lexicon: HALOT
  rationale: 단지 재물만이 아니라 귀하게 여겼던 모든 것을 포괄하도록 넓게 옮겼습니다.
- source_word: בְּיַד צָר / into the hand of the foe
