  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גָּֽלְתָ֨ה יְהוּדָ֤ה מֵ/עֹ֨נִי֙ וּ/מֵ/רֹ֣ב עֲבֹדָ֔ה הִ֚יא יָשְׁבָ֣ה בַ/גּוֹיִ֔ם לֹ֥א מָצְאָ֖ה מָנ֑וֹחַ כָּל רֹדְפֶ֥י/הָ הִשִּׂיג֖וּ/הָ בֵּ֥ין הַ/מְּצָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/003.yaml
  text: Judah has gone into exile because of affliction and because of great servitude; she dwells among the nations and finds no rest[a]. All her pursuers have overtaken her in the narrow places.
  footnotes:
  - marker: a
    text: Or 'between the straits'; the Hebrew may also echo the idea of distress, portraying Judah as trapped with no escape.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 고난과 무거운 종살이 때문에 유배를 떠났습니다. 그녀는 민족들 가운데 살지만 쉼을 얻지 못합니다. 그녀를 뒤쫓는 자들이 모두 그녀를 좁은 곳들 사이에서[a] 따라잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좁은 해협들 사이에서’라는 뜻일 수 있습니다. 히브리어는 고난과 압박의 뜻을 함께 암시하여, 빠져나갈 길이 없는 상태를 그릴 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְתָה
  english_pob_choice: has gone into exile
  chosen_korean: 포로로 끌려갔습니다
  alternatives_korean:
  - 유배되었습니다
  - 포로가 되었습니다
  lexicon: HALOT
  rationale: גלה의 문맥상 결과를 살려 유배 상태를 단순 진술하기보다 ‘포로로 끌려감’으로 옮겨, 시가 전하는 패배와 강제성을 분명히 드러냈습니다.
- source_word: מֵעֹנִי וּמֵרֹב עֲבֹדָה
  english_pob_choice: because of affliction and because of great slavery
  chosen_korean: 고난과 큰 노역 때문에
  alternatives_korean:
  - 환난과 큰 종살이 때문에
  - 고통과 혹독한 강제노동 때문에
  lexicon: HALOT
  rationale: עֹנִי는 넓은 의미의 고난으로, עֲבֹדָה는 여기서 단순 노동보다 압박적이고 강제적인 노역을 가리키므로 ‘큰 노역’이 자연스러우면서도 강도를 살립니다.
- source_word: בַגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데
  alternatives_korean:
  - 열방 가운데
  - 나라들 가운데
  lexicon: HALOT
  rationale: גּוֹיִם의 기본 의미를 따라 ‘민족들’을 사용하되, 포로 상태의 타향 거주를 보여 주는 ‘가운데’로 관계를 살렸습니다.
- source_word: לֹא מָצְאָה מָנוֹחַ
  english_pob_choice: finds no rest
  chosen_korean: 안식[a]을 얻지 못합니다
  alternatives_korean:
  - 쉬지 못합니다
  - 쉬는 곳을 찾지 못합니다
  lexicon: HALOT
  rationale: מָנוֹחַ의 ‘쉼/안식’ 의미를 살리되, 한국어에서는 ‘안식을 얻다’가 더 자연스럽고 시적이어서 선택했습니다.
- source_word: בֵּין הַמְּצָרִים
  english_pob_choice: in the narrow places
  chosen_korean: 좁은 곳에서
  alternatives_korean:
  - 좁은 사이에서
  - 협곡들 사이에서
  - 환난 가운데
  lexicon: HALOT
  rationale: 직역의 공간적 이미지를 유지해 ‘좁은 곳’으로 옮겼고, 주해상 여운은 각주로 처리해 본문을 과도하게 해석하지 않도록 했습니다.
theological_decisions:
- issue: 유다를 가리키는 인칭과 시적 의인화
  chosen_reading: 본문의 ‘유다’와 뒤이은 대명사들은 포로기 예루살렘/유다를 의인화한 것으로 보아, 한국어에서도 동일한 시적 인격체로 유지했습니다.
  alternative_readings:
  - 국가 전체의 집합명사로 평이하게 처리
  - 예루살렘으로 대체
  rationale: 히브리어 시는 유다를 여성형 인칭으로 다루므로, 의인화를 보존해야 본문의 정서와 수사가 살아납니다.
  doctrine_reference: 시적 의인화와 역사적 포로 상황
