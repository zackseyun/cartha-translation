  source_fidelity: 수정이 필요합니다. 초안의 “그들이 나에게 한 것처럼”은 히브리어 עוֹלַלְתָּ לִי의 2인칭 단수 주어, 곧 기도 대상이신 주님께서 화자에게 행하신 일을 적대자들이 행한 일로 바꾸어 놓습니다. 또한 ‘내 모든 허물 때문에’는 주님께서 화자에게 행하신 일에 연결되어야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체 기도문으로 자연스럽습니다. ‘주님의 앞에 이르게 하시고’와 ‘그들에게 행하소서’는 원문의 탄원 및 사법적 호소의 어조를 유지합니다.
  terminology: ‘악’, ‘허물’, ‘탄식’, ‘마음이 병들었습니다’는 רָעָה, פְּשָׁעַי, אַנְחֹתַי, לִבִּי דַוָּי의 의미 범위를 무리 없이 반영합니다. 동일 어근 עלל의 반복은 ‘행하신 것처럼/행하소서’로 보존했습니다.
