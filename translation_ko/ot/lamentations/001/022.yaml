source:
  edition: WLC
  text: תָּבֹ֨א כָל רָעָתָ֤/ם לְ/פָנֶ֨י/ךָ֙ וְ/עוֹלֵ֣ל לָ֔/מוֹ כַּ/אֲשֶׁ֥ר עוֹלַ֛לְתָּ לִ֖/י עַ֣ל כָּל פְּשָׁעָ֑/י כִּֽי רַבּ֥וֹת אַנְחֹתַ֖/י וְ/לִבִּ֥/י דַוָּֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/022.yaml
  text: Let all their evil come before you[a], and deal with them as you have dealt with me because of all my transgressions; for my groans are many[c][b], and my heart is sick.
  footnotes:
  - marker: a
    text: Or 'their wickedness'; רָעָה can also mean 'calamity' in some contexts, but here likely refers to culpable evil.
    reason: lexical_alternative
  - marker: b
    text: Or 'do to them as you have done to me.' The Hebrew repeats the same verb in both clauses.
    reason: lexical_alternative
  - marker: c
    text: Or 'my sighs are many.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 모든 악이 주님의 앞에 이르게 하시고, 주님께서 내 모든 허물 때문에 내게 행하신 것처럼 그들에게 행하소서. 내 탄식이 많고 내 마음은 병들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악’은 여기서 ‘악행’ 또는 ‘죄악’으로도 옮길 수 있습니다. רָעָה는 문맥에 따라 ‘재앙’을 뜻할 수도 있지만, 이 구절에서는 책임 있는 악의 의미가 더 강합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘행하신 것처럼’과 ‘행하소서’는 원문에서 같은 어근의 동사가 반복되는 것을 반영합니다. ‘내 모든 허물 때문에’는 주님께서 화자에게 행하신 일에 연결됩니다.
    reason: lexical_alternative
  - marker: c
    text: ‘탄식’은 ‘신음’ 또는 ‘한숨’으로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָתָם
  english_pob_choice: their evil
  chosen_korean: 그들의 모든 악
  alternatives_korean:
  - 그들의 모든 악행
  - 그들의 죄악
  - 그들의 재앙
  lexicon: HALOT
  rationale: רָעָה는 문맥에 따라 악이나 재앙이 될 수 있으나, 여기서는 회개·호소의 맥락에서 책임 있는 악을 가리키므로 ‘악’이 가장 직접적입니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 주님의 앞에
  alternatives_korean:
  - 주님 앞에
  - 주님의 면전에
  - 주님의 얼굴 앞에
  lexicon: HALOT
  rationale: 하나님께서 보시는 자리라는 기도적·재판적 관용구를 현대 한국어로 자연스럽게 살리기 위해 ‘주님의 앞에’로 옮겼습니다.
- source_word: וְעוֹלֵל לָמוֹ / כַּאֲשֶׁר עוֹלַלְתָּ לִי
  english_pob_choice: and deal with them / as you have dealt with me
  chosen_korean: 그들에게도 행하소서 / 그들이 나에게 한 것처럼
  alternatives_korean:
  - 그들에게도 해주십시오 / 당신이 나에게 하신 것처럼
  - 그들을 다루소서 / 나를 다루신 것처럼
  - 그들에게 행하소서 / 주님이 나에게 행하신 것처럼
  lexicon: HALOT
  rationale: 같은 동사의 반복을 한국어에서도 유지하면서, ‘행하다’로 과도한 해석 없이 대응시켜 비교 구조를 분명하게 했습니다.
- source_word: אַנְחֹתַי
  english_pob_choice: my groans are many
  chosen_korean: 내 탄식이 많고
  alternatives_korean:
  - 내 신음이 많고
  - 내 한숨이 많고
  - 내 괴로운 탄식이 많고
  lexicon: HALOT
  rationale: אַנְחָה는 슬픔에서 나오는 탄식/신음이므로, 시적이면서도 현대적인 ‘탄식’이 적절합니다.
- source_word: לִבִּי דַוָּי
  english_pob_choice: my heart is sick
  chosen_korean: 내 마음이 병들었습니다
  alternatives_korean:
  - 내 마음이 아픕니다
  - 내 마음이 쇠약합니다
  - 내 심장이 아픕니다
  lexicon: HALOT
  rationale: דַוָּי의 병듦·쇠약함을 비유적으로 살려, 감정의 통증을 넘는 내적 병증의 이미지를 보존했습니다.
theological_decisions:
- issue: 원문이 요청하는 심판의 성격
  chosen_reading: 원문대로 하나님께서 그들의 악을 보시고, 그에 상응하게 행해 달라는 탄원으로 유지했습니다.
  alternative_readings:
  - 보복적 저주를 강하게 드러내는 번역
  - 단순히 악을 알아봐 달라는 약한 번역
  rationale: 히브리어는 적대자에 대한 감정 표출이 아니라, 시온에게 행하신 것과 같은 방식의 대응을 하나님께 청하는 기도문입니다. 따라서 심판의 긴장감을 보존하되 과도한 확대나 완화는 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
