  to: 그들의 모든 악이 주님의 앞에 이르게 하시고, 주님께서 내 모든 허물 때문에 내게 행하신 것처럼 그들에게 행하소서. 내 탄식이 많고 내 마음은 병들었습니다.[a][b][c]
  rationale: 원문의 2인칭 단수 동사를 반영하여 비교절의 주어를 주님으로 바로잡고, ‘내 모든 허물 때문에’를 그 과거 처사의 근거로 명확히 연결했습니다. 이로써 원문이 요청하는 바, 하나님께서 시온에게 행하신 심판에 상응하여 적대자들을 다루어 달라는 탄원을 보존합니다.
