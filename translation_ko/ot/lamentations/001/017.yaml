revisions:
- from: 시온은 자기 손을 폈으나, 그를 위로할 자가 없습니다. 야훼께서 야곱에 대하여 명령하셔서 그의 원수들이 사방에서 그를 에워싸게 하셨습니다. 예루살렘은 그들 가운데서 부정한 것이 되었습니다.[a]
  to: 시온은 두 손을 펼쳤습니다. 시온을 위로할 이는 없습니다. 야훼께서는 야곱에 대하여, 그의 원수들이 사방에서 그를 에워싸도록 명령하셨습니다. 예루살렘은 그들 가운데서 부정한 것이 되었습니다.[a]
  rationale: 원문의 병렬적 전개를 보존하기 위해 근거 없는 역접을 제거하고, ‘두 손’으로 손을 펴는 몸짓을 자연스럽게 표현했습니다. 야곱과 그의 원수들을 가리키는 대명사 관계는 유지했으며, נִדָּה의 구체적 의례 함의는 교단적 해석을 덧붙이지 않고 각주에서만 밝혔습니다.
