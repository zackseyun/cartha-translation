  source_fidelity: 첫 절의 וְ접속은 단순 연결이며 역접을 명시하지 않습니다. 또한 צִוָּה יְהוָה לְיַעֲקֹב은 야곱과 관련하여 야훼께서 명령하신 내용이 그의 원수들의 포위라는 뜻으로 옮길 수 있습니다. 수정문은 이 관계를 유지하면서도 불필요한 역접을 피합니다.
  naturalness: ‘자기 손’보다 관용적으로 ‘두 손’을 쓰고, 시온을 받는 목적어를 명시하여 의인화된 지시 대상이 자연스럽고 분명하게 드러나게 했습니다. ‘부정한 것’은 현대 한국어에서 의례적 부정의 의미를 무리 없이 전달합니다.
  terminology: 야훼, 시온, 야곱, 예루살렘의 표기를 유지했습니다. נִדָּה의 의례적·월경 관련 함의는 본문에서 ‘부정한 것’으로, 각주에서 ‘월경 부정’으로 보완했습니다.
