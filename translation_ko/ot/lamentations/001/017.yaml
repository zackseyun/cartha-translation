id: LAM.1.17
reference: Lamentations 1:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פֵּֽרְשָׂ֨ה צִיּ֜וֹן בְּ/יָדֶ֗י/הָ אֵ֤ין מְנַחֵם֙ לָ֔/הּ צִוָּ֧ה יְהוָ֛ה לְ/יַעֲקֹ֖ב סְבִיבָ֣י/ו צָרָ֑י/ו הָיְתָ֧ה יְרוּשָׁלִַ֛ם לְ/נִדָּ֖ה בֵּינֵי/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/017.yaml
  text: Zion has spread out her hands; there is no one to comfort her[a]. Yahweh has commanded concerning Jacob that his enemies surround him; Jerusalem has become an unclean thing among them.
  footnotes:
  - marker: a
    text: Or, more specifically, 'like a menstruant' or 'as menstrual impurity'; the Hebrew term carries ritual-impurity imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 시온은 두 손을 펼쳤습니다. 시온을 위로할 이는 없습니다. 야훼께서는 야곱에 대하여, 그의 원수들이 사방에서 그를 에워싸도록 명령하셨습니다. 예루살렘은 그들 가운데서 부정한 것이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 구체적으로는 ‘월경 중인 여자와 같은 것’ 또는 ‘월경 부정’으로 옮길 수 있습니다. 히브리어는 의례적 부정의 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרְשָׂה / בְּיָדֶיהָ
  english_pob_choice: has spread out her hands
  chosen_korean: 자기 손을 폈으나
  alternatives_korean:
  - 두 손을 펼쳤으나
  - 손을 내밀었으나
  lexicon: HALOT
  rationale: 펼치다/펴다로 פתיחה의 동작을 살리되, 애원하는 자세를 자연스러운 한국어로 옮겼습니다. '손'은 원문 복수감도 유지합니다.
- source_word: אֵין מְנַחֵם לָהּ
  english_pob_choice: there is no one to comfort her
  chosen_korean: 그를 위로할 자가 없습니다
  alternatives_korean:
  - 그녀를 위로할 이가 없습니다
  - 위로하는 이가 없습니다
  lexicon: HALOT
  rationale: '''위로할 자가 없다''는 존재 부정을 그대로 살려, 애가서의 반복 주제를 드러냈습니다. 시온을 지칭하는 대명사는 뒤 문장의 ''그''와 맞추어 공동체/성읍 의인화의 흐름을 유지했습니다.'
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신성명 יְהוָה는 '야훼'로 옮겨, 단순 호칭인 '주님'과 구별했습니다.
- source_word: צִוָּה ... לְיַעֲקֹב
  english_pob_choice: has commanded concerning Jacob
  chosen_korean: 야곱에 대하여 명령하셔서
  alternatives_korean:
  - 야곱에 대해 명하셔서
  - 야곱에게 명령하셔서
  lexicon: HALOT
  rationale: לְיַעֲקֹב의 범위를 넓게 보아 '대하여'로 처리해, 명령의 대상/관련 대상을 특정 방식으로 과잉 해석하지 않았습니다. '명령하셔서'는 원문의 완료 동작과 이어지는 결과를 자연스럽게 연결합니다.
- source_word: סְבִיבָיו צָרָיו
  english_pob_choice: his enemies surround him
  chosen_korean: 그의 원수들이 사방에서 그를 에워싸게 하셨습니다
  alternatives_korean:
  - 그의 적들이 둘러싸게 하셨습니다
  - 그의 원수들이 둘러싸게 하셨습니다
  lexicon: HALOT
  rationale: סביביו를 '사방에서'로 풀어 포위의 공간감을 살리고, צָרָיו는 맥락상 '원수들'이 가장 직접적입니다. 동사 에워싸다로 적대적 포위를 드러냈습니다.
- source_word: לְנִדָּה
  english_pob_choice: an unclean thing
  chosen_korean: 부정한 것이
  alternatives_korean:
  - 부정한 존재가
  - 정결하지 않은 것이
  lexicon: HALOT
  rationale: נִדָּה의 정결/부정 맥락을 살리되, 본문 기능상 이방인들 사이에서 거부되는 상태를 간결하게 옮겼습니다. 한국어 독자를 위해 과도한 생물학적 표현은 본문 밖으로 미뤘습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 문맥의 신적 주권을 흐리지 않으면서도 고유한 언약 이름을 드러내기 위해 '야훼'를 사용했습니다. '주님'은 כאן에서 일반 호칭처럼 읽힐 수 있어 구별이 필요합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: לְנִדָּה의 부정성 강도
  chosen_reading: 부정한 것이
  alternative_readings:
  - 월경 부정과 같은 것
  - 불결한 것
  rationale: 원문은 정결법상의 오염과 사회적 혐오를 함께 암시하므로, 본문에는 간명한 표현을 두고 세부 이미지는 주해 없이도 감지되게 했습니다. 이는 의미를 약화시키지 않으면서 한국어 독해 가능성을 높입니다.
  doctrine_reference: Translation philosophy §§1, 6
