translation:
  language: ko
  text: 딸 시온에게서 그 모든 위엄이 떠났습니다[a]. 그녀의 지도자들은 풀밭을 찾지 못하는 사슴들[b]처럼 되었고, 추격자 앞에서 힘없이 걸어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 모든 화려함” 또는 “그 모든 아름다움”입니다.
