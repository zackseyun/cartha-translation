  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א מן בת צִיּ֖וֹן כָּל הֲדָרָ֑/הּ הָי֣וּ שָׂרֶ֗י/הָ כְּ/אַיָּלִים֙ לֹא מָצְא֣וּ מִרְעֶ֔ה וַ/יֵּלְכ֥וּ בְ/לֹא כֹ֖חַ לִ/פְנֵ֥י רוֹדֵֽף־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/006.yaml
  text: From daughter Zion all her splendor has departed[a]; her princes have become like deer that find no pasture[b]; they went without strength before the pursuer.
  footnotes:
  - marker: a
    text: Or "all her majesty" or "all her beauty has gone out from daughter Zion."
    reason: lexical_alternative
  - marker: b
    text: Or "like stags that found no pasture."
    reason: lexical_alternative
translation:
  language: ko
  text: 딸 시온에게서 그 모든 화려함이 사라졌습니다[a]. 그녀의 지도자들은 꼴을 찾지 못하는 사슴들[b]처럼 되었고, 추격자 앞에서 힘없이 걸어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 모든 위엄” 또는 “그 모든 아름다움”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “사슴들이 꼴을 찾지 못한”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מן בת צִיּוֹן
  english_pob_choice: From daughter Zion all her splendor has departed
  chosen_korean: “딸 시온에게서 … 사라졌습니다”
  alternatives_korean:
  - “딸 시온으로부터 … 떠났습니다”
  - “시온의 딸에게서 … 나갔습니다”
  lexicon: WLC / HALOT
  rationale: וַיֵּצֵא의 기본 의미는 ‘나가다’이지만, 문맥상 대상은 ‘화려함’이므로 한국어에서는 단순 이동보다 상실을 드러내는 ‘사라졌습니다’가 자연스럽습니다. ‘딸 시온’은 시온을 여성 인격화한 표현을 그대로 살렸습니다.
- source_word: כָּל הֲדָרָהּ
  english_pob_choice: all her splendor
  chosen_korean: “그 모든 화려함”
  alternatives_korean:
  - “그 모든 위엄”
  - “그 모든 아름다움”
  - “그 모든 영광”
  lexicon: HALOT
  rationale: הדר는 위엄, 장식, 아름다움, 찬란함의 폭이 있으나, 애가 문맥에서는 도시의 외적 영화와 품격이 무너진 느낌을 살리는 ‘화려함’이 가장 적절합니다.
- source_word: שָׂרֶיהָ
  english_pob_choice: her princes
  chosen_korean: “그녀의 지도자들”
  alternatives_korean:
  - “그녀의 방백들”
  - “그녀의 고관들”
  - “그녀의 귀족들”
  lexicon: HALOT
  rationale: שָׂרִים은 직역하면 ‘방백/귀족/지도자들’이지만, 현대 한국어에서 계급 호칭보다 공동체의 통치자라는 기능이 더 분명한 ‘지도자들’이 문맥상 자연스럽습니다.
- source_word: כְּאַיָּלִים לֹא מָצְאוּ מִרְעֶה
  english_pob_choice: like deer that find no pasture
  chosen_korean: “꼴을 찾지 못하는 사슴들처럼”
  alternatives_korean:
  - “초지를 찾지 못하는 사슴들처럼”
  - “풀밭을 찾지 못하는 사슴들처럼”
  lexicon: HALOT
  rationale: מִרְעֶה는 목초지/사료가 있는 곳이지만, 한국어 비유에서는 가축·야생동물 모두에 통하는 ‘꼴’이 간결하고 원문의 결핍 이미지를 강하게 전달합니다.
- source_word: לִפְנֵי רוֹדֵף
  english_pob_choice: before the pursuer
  chosen_korean: “추격자 앞에서”
  alternatives_korean:
  - “뒤쫓는 자 앞에서”
  - “추격하는 자의 앞에서”
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘앞에서, 면전에서’의 의미로, 여기서는 적에게 쫓겨 밀려나는 상황을 나타냅니다. ‘추격자 앞에서’가 가장 간결하게 압박과 패배의 방향성을 드러냅니다.
theological_decisions:
- issue: 시온의 인격화된 표현과 시의적 수사 유지
  chosen_reading: ‘딸 시온’과 ‘그녀의 지도자들’을 그대로 살려 도시를 인격화한 애가의 정서를 유지했습니다.
  alternative_readings:
  - 시온의 딸
  - 예루살렘의 딸
  rationale: 이 구절은 단순한 지리 묘사가 아니라 멸망한 도시를 애도하는 시적 인격화입니다. 한국어에서도 그 수사적 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: Lamentations as poetic lament; city personification
