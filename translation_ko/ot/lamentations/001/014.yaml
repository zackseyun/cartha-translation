id: LAM.1.14
reference: Lamentations 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִשְׂקַד֩ עֹ֨ל פְּשָׁעַ֜/י בְּ/יָד֗/וֹ יִשְׂתָּֽרְג֛וּ עָל֥וּ עַל צַוָּארִ֖/י הִכְשִׁ֣יל כֹּחִ֑/י נְתָנַ֣/נִי אֲדֹנָ֔/י בִּ/ידֵ֖י לֹא אוּכַ֥ל קֽוּם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/014.yaml
  text: The yoke of my transgressions is bound by his hand[a]; they are woven together, they have come up upon my neck; he has made my strength fail[c][b]. The Lord has given me into hands from which I cannot rise.
  footnotes:
  - marker: a
    text: Or 'is watched over'; the Hebrew verb is rare and difficult. The context favors the sense that the yoke is fastened or bound.
    reason: lexical_alternative
  - marker: b
    text: Or 'they are intertwined' or 'twisted together.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'into hands'; the expression leaves the oppressors indefinite.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 허물의 멍에는 그의 손에 묶여 있습니다[a]. 그것들은 서로 엮여 내 목 위로 올라왔고, 그는 내 힘이 꺾이게 하셨습니다[b]. 주님은 내가 일어날 수 없는 손들로 나를 넘기셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지켜지고 있습니다’일 수 있습니다. 히브리어 동사가 드물고 어려워 문맥상 ‘묶이다/채워지다’가 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘서로 뒤엉켜 있습니다’ 혹은 ‘비틀려 있습니다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 직역하면 ‘손들로’입니다. 적대 세력을 특정하지 않은 채로 남겨 두는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׂקַד
  english_pob_choice: is bound
  chosen_korean: 묶여 있습니다
  alternatives_korean:
  - 감시를 받고 있습니다
  - 채워져 있습니다
  - 단단히 묶여 있습니다
  lexicon: HALOT
  rationale: 희귀하고 난해한 동사이지만, 문맥상 ‘멍에’ 이미지와 이어져 억압적으로 ‘묶이다/매이다’는 뜻이 가장 자연스럽습니다.
- source_word: עֹל פְּשָׁעַי
  english_pob_choice: the yoke of my transgressions
  chosen_korean: 내 허물의 멍에
  alternatives_korean:
  - 내 죄과의 멍에
  - 내 범죄의 멍에
  - 내 반역의 멍에
  lexicon: HALOT
  rationale: עֹל은 억압적 ‘멍에’로 옮기고, פְּשָׁעַי는 도덕적·언약적 책임을 드러내는 ‘허물’로 옮겨 현재적 한국어에서 지나친 교회어체를 피했습니다.
- source_word: יִשְׂתָּרְגוּ
  english_pob_choice: they are woven together
  chosen_korean: 서로 엮여
  alternatives_korean:
  - 서로 얽혀
  - 뒤엉켜
  - 서로 짜여
  lexicon: HALOT
  rationale: 희귀 동사가 가리키는 ‘엮임/얽힘’의 이미지를 살리되, 한국어에서 자연스러운 동적 표현으로 압축했습니다.
- source_word: הִכְשִׁיל כֹּחִי
  english_pob_choice: he has made my strength fail
  chosen_korean: 내 힘이 꺾이게 하셨습니다
  alternatives_korean:
  - 내 힘이 무너지게 하셨습니다
  - 내 힘이 넘어지게 하셨습니다
  - 내 힘을 쇠약하게 하셨습니다
  lexicon: HALOT
  rationale: כשל의 ‘넘어지게 하다’라는 기본 감각을 유지하면서, ‘힘’과 결합할 때의 결과를 한국어 관용으로 ‘꺾이다’로 자연스럽게 옮겼습니다.
- source_word: בִּידֵי לֹא אוּכַל קוּם
  english_pob_choice: into hands from which I cannot rise
  chosen_korean: 일어날 수 없는 손들로
  alternatives_korean:
  - 일어날 수 없는 손에
  - 내가 일어설 수 없는 손들로
  - 내가 일어날 수 없는 손에
  lexicon: HALOT
  rationale: 히브리어의 ‘손들’(복수)과 ‘~로/에 넘기다’의 이미지를 살리면서, 재기 불가능한 상태를 한국어로 간결하게 표현했습니다.
theological_decisions:
- issue: 주어 대명사와 신적 행위의 귀속
  chosen_reading: 초반의 ‘그의/그는’은 문맥상 주님의 판단적 행위를 가리키는 것으로 읽고, 마지막 절에서 이를 ‘주님은… 넘기셨습니다’로 분명히 했습니다.
  alternative_readings:
  - 초반 대명사를 멍에 자체나 비인칭적으로 볼 수 있습니다
  - 신적 행위를 완화해 일반적 재난 묘사로 볼 수 있습니다
  rationale: 애가의 문맥은 예루살렘의 고난을 야훼의 심판으로 해석하므로, 본문의 긴장을 지우지 않으면서 신적 주체성을 드러내는 번역이 가장 적절합니다.
  doctrine_reference: 본문의 신정론적 긴장을 보존합니다.
