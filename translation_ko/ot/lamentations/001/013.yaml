id: LAM.1.13
reference: Lamentations 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/מָּר֛וֹם שָֽׁלַח אֵ֥שׁ בְּ/עַצְמֹתַ֖/י וַ/יִּרְדֶּ֑/נָּה פָּרַ֨שׂ רֶ֤שֶׁת לְ/רַגְלַ/י֙ הֱשִׁיבַ֣/נִי אָח֔וֹר נְתָנַ֨/נִי֙ שֹֽׁמֵמָ֔ה כָּל הַ/יּ֖וֹם דָּוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/013.yaml
  text: From on high he sent fire into my bones[a], and it prevailed against them; he spread a net for my feet; he turned me back; he made me desolate[b], faint all day long.
  footnotes:
  - marker: a
    text: Or 'and it subdued them'; the Hebrew verb can carry the sense of ruling, subduing, or overpowering.
    reason: lexical_alternative
  - marker: b
    text: Or 'sick all day long' or 'languishing all day long.'
    reason: lexical_alternative
translation:
  language: ko
  text: 높은 곳에서 그가 불을 내 뼛속으로 보내어 그것이 그것들을 이겨 버렸습니다[a]. 그는 내 발을 위해 그물을 쳤고, 나를 뒤로 돌려세웠으며, 나를 황폐하게 하셨습니다[b]. 나는 온종일 쇠약합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것이 그들을 지배했다’, ‘그것이 그들을 굴복시켰다’. 히브리어 동사는 다스림, 제압함, 압도함의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 황폐하게 하여’, ‘나를 병들게 하셨습니다’, ‘나를 쇠잔하게 하셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּרוֹם
  english_pob_choice: From on high
  chosen_korean: 높은 곳에서
  alternatives_korean:
  - 위로부터
  - 하늘에서
  lexicon: HALOT
  rationale: מָרוֹם은 높은 곳, 높은 지점을 가리키므로 ‘높은 곳에서’가 시적 이미지를 살리면서도 ‘하늘’로 더 특정하지 않습니다.
- source_word: בְּעַצְמֹתַי
  english_pob_choice: into my bones
  chosen_korean: 뼛속으로
  alternatives_korean:
  - 내 뼈에
  - 내 뼈들 속으로
  lexicon: HALOT
  rationale: 전치사 ב의 침투적 뉘앙스를 살려 고통이 뼈 속까지 스며드는 느낌을 자연스럽게 드러냅니다.
- source_word: וַיִּרְדֶּנָּה
  english_pob_choice: and it overcame them
  chosen_korean: 그것이 그것들을 이겨 버렸습니다
  alternatives_korean:
  - 그것이 그것들을 다스렸습니다
  - 그것이 그것들을 굴복시켰습니다
  - 그것이 그것들을 압도했습니다
  lexicon: HALOT
  rationale: רדה는 다스리다/지배하다/굴복시키다의 범위를 가지지만, 여기서는 불이 뼈를 제압하는 역동을 살려 ‘이겨 버렸습니다’로 옮겼습니다.
- source_word: דָּוָה
  english_pob_choice: faint all day long
  chosen_korean: 온종일 쇠약합니다
  alternatives_korean:
  - 온종일 아픕니다
  - 온종일 기운이 빠집니다
  - 온종일 쇠잔합니다
  lexicon: HALOT
  rationale: דָּוָה는 병약함, 쇠약함, 지침을 나타내므로 현대 한국어에서 가장 자연스럽고 포괄적인 ‘쇠약합니다’를 택했습니다.
theological_decisions:
- issue: 서술상의 주어와 절망의 화자 유지
  chosen_reading: 본문의 3인칭 남성 단수를 그대로 따라 ‘그’로 두되, 문맥상 화자의 고통을 직접 말하는 1인칭 표현은 유지했습니다.
  alternative_readings:
  - 주어를 ‘주님’으로 명시하기
  - 주어를 아예 생략하기
  rationale: 히브리어는 이 구절 자체에서 신적 이름을 명시하지 않으므로, 문맥이 지시하는 행위자를 암시하되 본문 밖의 식별을 덧붙이지 않는 편이 더 원문에 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
