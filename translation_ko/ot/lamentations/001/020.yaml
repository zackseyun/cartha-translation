- from: 야훼여, 보시옵소서. 제가 고통 속에 있습니다. 제 속이 끓어오르고, 제 마음이 제 안에서 뒤집혔습니다. 제가 크게 반역하였기 때문입니다. 밖에서는 칼이 자녀를 잃게 하고, 집 안에서는 죽음과 같습니다.[a][b][c]
  to: 야훼여, 보십시오. 제가 곤경에 처했습니다. 제 속[b]이 끓어오르고, 제 마음이 제 안에서 뒤집혔습니다. 제가 참으로 거역했기[a] 때문입니다. 밖에서는 칼이 사람들을 앗아가고, 집 안은 죽음과도 같습니다[c].
  rationale: 현대 합쇼체에 맞추어 호소를 ‘보십시오’로 조정했습니다. ‘칼이 사람들을 앗아가고’는 שִׁכְּלָה의 상실·사별 이미지를 보존하면서도 ‘자녀’로 의미를 한정하지 않습니다. 마지막 행은 원문의 대조와 비교 표현을 살려 ‘집 안은 죽음과도 같습니다’로 옮겼습니다. 각주 표지는 해당 표현에 직접 붙이고, 각주 내용도 원문 및 영어 감사 기록의 대안 가능성을 정확히 반영하도록 정비했습니다.
  reviewer_model: gpt-5.6-terra
