id: LAM.1.20
reference: Lamentations 1:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְאֵ֨ה יְהוָ֤ה כִּֽי צַר לִ/י֙ מֵעַ֣/י חֳמַרְמָ֔רוּ נֶהְפַּ֤ךְ לִבִּ/י֙ בְּ/קִרְבִּ֔/י כִּ֥י מָר֖וֹ מָרִ֑יתִי מִ/ח֥וּץ שִׁכְּלָה חֶ֖רֶב בַּ/בַּ֥יִת כַּ/מָּֽוֶת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/020.yaml
  text: Look[a], O Yahweh, for I am in distress; my inward parts are churning; my heart is overturned within me, because I have been very rebellious[b]. Outside the sword bereaves[c]; inside the house it is like death.
  footnotes:
  - marker: a
    text: Or 'for I have grievously rebelled' or 'for I have bitterly rebelled.' The Hebrew intensifies the verb 'rebel' by pairing a cognate form with it.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my inward parts,' an embodied expression for deep inner anguish.
    reason: cultural_note
  - marker: c
    text: Or 'inside the house, there is death.' The Hebrew is terse and elliptical.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼여, 보시옵소서. 제가 고통 속에 있습니다. 제 속이 끓어오르고, 제 마음이 제 안에서 뒤집혔습니다. 제가 크게 반역하였기 때문입니다. 밖에서는 칼이 자녀를 잃게 하고, 집 안에서는 죽음과 같습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 반복 강조(‘크게 반역하다’)를 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘제 속’은 히브리어의 몸-감정 표현인 ‘내장/속’의 관용적 의미를 반영합니다.
    reason: cultural_note
  - marker: c
    text: ‘집 안에는 죽음이 있습니다’로도 옮길 수 있으나, כאן의 비교구문은 ‘~과 같습니다’로 살릴 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה יְהוָה
  english_pob_choice: Look, O Yahweh
  chosen_korean: 야훼여, 보시옵소서
  alternatives_korean:
  - 살피소서
  - 보아 주십시오
  - 보시옵소서, 야훼여
  lexicon: HALOT
  rationale: רהאה의 직접적인 호소를 살려 현대적이면서도 간구체인 ‘보시옵소서’로 옮기고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
- source_word: צַר לִי
  english_pob_choice: I am in distress
  chosen_korean: 제가 고통 속에 있습니다
  alternatives_korean:
  - 제가 곤경에 있습니다
  - 제가 괴로움에 있습니다
  - 제가 답답합니다
  lexicon: HALOT
  rationale: 개인적 압박과 संकट 상태를 자연스러운 현대어로 전달하기 위해 ‘고통 속에 있습니다’를 택했습니다.
- source_word: מֵעַי חֳמַרְמָרוּ
  english_pob_choice: my inward parts are churning
  chosen_korean: 제 속이 끓어오르고
  alternatives_korean:
  - 제 내장이 뒤틀리고
  - 제 속이 요동치고
  - 제 속이 끓습니다
  lexicon: HALOT
  rationale: 몸의 내부를 가리키는 비유를 직역하기보다, 내면의 격렬한 동요를 한국어 관용으로 살리는 방식으로 옮겼습니다.
- source_word: נֶהְפַּךְ לִבִּי בְּקִרְבִּי
  english_pob_choice: my heart is overturned within me
  chosen_korean: 제 마음이 제 안에서 뒤집혔습니다
  alternatives_korean:
  - 제 마음이 제 안에서 전복되었습니다
  - 제 마음이 제 속에서 뒤집어졌습니다
  - 제 마음이 제 안에서 뒤집혔습니다
  lexicon: HALOT
  rationale: הפך의 ‘뒤집히다/전복되다’ 이미지를 유지하면서도, 현대 한국어에서 자연스러운 심리적 혼란으로 읽히도록 했습니다.
- source_word: כִּי מָרוֹ מָרִיתִי
  english_pob_choice: because I have been very rebellious
  chosen_korean: 제가 크게 반역하였기 때문입니다
  alternatives_korean:
  - 제가 몹시 반역하였기 때문입니다
  - 제가 심히 거역하였기 때문입니다
  - 제가 참으로 반역하였기 때문입니다
  lexicon: HALOT
  rationale: 형용사+동사형의 강한 강조를 ‘크게’로 반영해, 단순한 불순종이 아니라 심각한 반역이라는 중첩된 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 본문의 마지막 행 ‘כַּמָּוֶת’과 ‘שִׁכְּלָה חֶרֶב’의 압축된 병렬성
  chosen_reading: ‘밖에서는 칼이 자녀를 잃게 하고, 집 안에서는 죽음과 같습니다’로 옮겨, 첫 절의 동사적 이미지와 둘째 절의 비유를 함께 살렸습니다.
  alternative_readings:
  - ‘밖에서는 칼이 사람을 잃게 하고, 집 안에서는 죽음이 있습니다’
  - ‘밖에서는 칼이 빼앗고, 집 안에는 죽음이 있습니다’
  rationale: 히브리어는 매우 압축적이어서, ‘죽음’의 단정적 진술과 비교구문 ‘~과 같습니다’를 모두 반영하는 것이 문맥의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 시가서 번역의 시적 압축성 유지 원칙
