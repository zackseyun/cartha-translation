  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָד/וֹ֙ פָּ֣רַשׂ צָ֔ר עַ֖ל כָּל מַחֲמַדֶּ֑י/הָ כִּֽי רָאֲתָ֤ה גוֹיִם֙ בָּ֣אוּ מִקְדָּשָׁ֔/הּ אֲשֶׁ֣ר צִוִּ֔יתָה לֹא יָבֹ֥אוּ בַ/קָּהָ֖ל לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/010.yaml
  text: The enemy has stretched out his hand over all her precious things[c][b][a], for she has seen nations enter her sanctuary—those whom you commanded not to enter your assembly.
  footnotes:
  - marker: a
    text: Or 'her treasures' / 'her desirable things.'
    reason: lexical_alternative
  - marker: b
    text: '''Nations'' could also be rendered ''Gentiles,'' referring to foreign peoples entering the sacred precinct.'
    reason: lexical_alternative
  - marker: c
    text: Compare Deuteronomy 23, where certain peoples are forbidden to enter the assembly of the LORD.
    reason: cross_reference
translation:
  language: ko
  text: 원수가 그의 손을 그녀의 모든 보배 위로 펼쳤습니다. 그녀는 이방 나라들이 자기 성소에 들어오는 것을 보았습니다. 당신께서 그들에게 “그들은 당신의 회중에 들어오지 말라”고 명하셨는데도 말입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘회중’은 קָהָל의 예배적·언약적 집합성을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַשׂ יָדוֹ עַל
  english_pob_choice: stretches out his hand over
  chosen_korean: 그의 손을 … 위로 펼쳤습니다
  alternatives_korean:
  - 그의 손을 … 위에 뻗었습니다
  - 그의 손을 … 위로 내밀었습니다
  lexicon: פָּרַשׂ
  rationale: 동작의 확장과 점유를 함께 드러내기 위해 ‘펼쳤습니다’를 택했습니다. 손을 ‘펴다/펼치다’는 히브리어 표현의 공격성과 침탈감을 비교적 직접적으로 살립니다.
- source_word: כָּל מַחֲמַדֶּיהָ
  english_pob_choice: all her precious things
  chosen_korean: 그녀의 모든 보배
  alternatives_korean:
  - 그녀의 모든 귀한 것
  - 그녀의 모든 소중한 것
  lexicon: מַחֲמַד
  rationale: מַחֲמַדֶּיהָ는 단순한 애정 대상보다 소중하고 값진 소유물을 가리키므로, 의미를 보존하면서도 압축적인 ‘보배’로 옮겼습니다.
- source_word: גוֹיִם
  english_pob_choice: nations
  chosen_korean: 이방 나라들
  alternatives_korean:
  - 열국
  - 민족들
  - 나라들
  lexicon: גּוֹיִם
  rationale: 문맥상 성소에 들어온 주체가 언약 밖의 민족들이라는 점을 분명히 하기 위해 ‘이방 나라들’로 옮겼습니다.
- source_word: בָּאוּ מִקְדָּשָׁהּ
  english_pob_choice: entered her sanctuary
  chosen_korean: 자기 성소에 들어오는 것을
  alternatives_korean:
  - 그녀의 성소에 들어오는 것을
  - 성소에 들어오는 것을
  lexicon: מִקְדָּשׁ
  rationale: 히브리어 대명사 접미사와 앞선 여성 형식을 따라 ‘자기 성소’로 했습니다. ‘성소’는 제의적 공간의 침범을 직접 보여 줍니다.
- source_word: לֹא יָבֹאוּ בַקָּהָל לָךְ
  english_pob_choice: not enter your assembly
  chosen_korean: “그들은 당신의 회중에 들어오지 말라”
  alternatives_korean:
  - “그들은 당신의 모임에 들어오지 말라”
  - “그들은 당신의 공동체에 들어오지 말라”
  lexicon: קָהָל
  rationale: קָהָל의 기본 뜻은 공식적 집회이지만, 신앙 공동체의 언어로는 ‘회중’이 가장 직접적입니다. 직접 명령형으로 처리해 문장의 법적·제의적 긴장을 살렸습니다.
theological_decisions:
- issue: 예루살렘의 회중에서의 배제와 하나님의 명령의 역설
  chosen_reading: 포로와 멸망의 상황을 반영해, 원래 이방인의 प्रवेश 금지 명령이 성소 침탈의 죄책과 수치를 강조하는 방식으로 읽습니다.
  alternative_readings:
  - 단순한 역사 서술로만 읽는 해석
  - 정결 규례의 기술적 언급으로만 축소하는 해석
  rationale: 이 구절은 침입의 사실 자체보다 ‘명령하셨음에도’ 그 금지가 무너진 역설을 강조합니다. 따라서 직접 화법을 유지해 하나님의 언약 질서를 배반한 현실을 드러냅니다.
  doctrine_reference: 언약 질서, 성소의 거룩함, 심판의 수치
