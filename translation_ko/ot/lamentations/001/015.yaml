base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/015.yaml
  text: The Lord has rejected all my mighty men in my midst[a]; he has summoned an appointed time against me to crush my young men[b]. The Lord has trodden the winepress for the virgin daughter of Judah.
  footnotes:
  - marker: a
    text: Or 'he proclaimed a set time against me' or 'he called an assembly against me.' The Hebrew מוֹעֵד can mean an appointed time or an appointed gathering.
    reason: lexical_alternative
  - marker: b
    text: The image of treading a winepress is a metaphor for severe divine judgment.
    reason: cultural_note
translation:
  language: ko
  text: 주님께서는 내 한가운데에 있던 모든 용사를 내치셨습니다. 내 젊은이들을 부수시려고 나를 대적하여 정한 때를 선포하셨습니다[a]. 주님께서는 유다의 처녀 딸을 포도주틀에서 밟으셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 대적하여 정한 때를 선포하셨습니다’ 또는 ‘나를 대적하여 한 모임을 부르셨습니다’. 히브리어 מוֹעֵד는 정한 때나 정한 모임을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 포도주틀을 밟는 이미지는 매우 엄한 하나님의 심판을 가리키는 은유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: סִלָּה
  english_pob_choice: has rejected
  chosen_korean: 거절하셨습니다
  alternatives_korean:
  - 버리셨습니다
  - 내치셨습니다
  - 저버리셨습니다
  lexicon: HALOT
  rationale: 문맥상 예루살렘의 전사들을 단호히 거부·배척하신 뜻이므로, 완곡한 표현보다 ‘거절하셨습니다’가 POB의 judgment sense를 가장 직접적으로 반영합니다.
- source_word: אַבִּירַי
  english_pob_choice: my mighty men
  chosen_korean: 내 용사들
  alternatives_korean:
  - 내 강한 자들
  - 내 군사들
  - 내 장사들
  lexicon: HALOT
  rationale: אַבִּיר는 힘센 자/전사들의 의미가 있어, 한국어에서는 군사적 뉘앙스를 살리면서도 자연스러운 ‘용사들’이 가장 적절합니다.
- source_word: מוֹעֵד
  english_pob_choice: an appointed time
  chosen_korean: 한 정한 때
  alternatives_korean:
  - 정한 회중
  - 정한 모임
  - 정한 절기
  lexicon: HALOT
  rationale: 본문의 מוֹעֵד는 여기서 절기보다 ‘정해진 시기’가 핵심이므로, 해석을 과도하게 좁히지 않는 ‘한 정한 때’로 옮겼습니다.
- source_word: גַּת דָּרַךְ
  english_pob_choice: has trodden the winepress
  chosen_korean: 포도주틀을 밟으셨습니다
  alternatives_korean:
  - 포도즙틀을 밟으셨습니다
  - 포도틀을 밟으셨습니다
  - 포도주틀을 밟아 짓밟으셨습니다
  lexicon: HALOT
  rationale: 심판의 은유를 살리기 위해 ‘밟다’의 이미지가 필요하며, 한국어 성경에서 익숙한 ‘포도주틀’이 포도압착의 상징을 잘 전달합니다.
- source_word: לִבְתוּלַת בַּת יְהוּדָה
  english_pob_choice: for the virgin daughter of Judah
  chosen_korean: 유다의 처녀 딸
  alternatives_korean:
  - 유다의 동정녀 딸
  - 유다의 처녀인 딸
  - 유다의 처녀 같은 딸
  lexicon: HALOT
  rationale: 의인화된 표현을 살려 ‘처녀 딸’로 직역에 가깝게 두었고, POB의 비유적·심판적 어조를 유지했습니다.
theological_decisions:
- issue: 주님의 심판 행위를 포도주틀 짓밟기로 표현하는 은유
  chosen_reading: ‘포도주틀을 밟으셨습니다’로 심판의 폭력성과 비유성을 그대로 유지했습니다.
  alternative_readings:
  - ‘포도주틀을 짓밟으셨습니다’
  - ‘포도를 짜듯 심판하셨습니다’
  rationale: 본문은 전쟁 심판을 농경적 이미지로 형상화하므로, 의미를 풀어 설명하기보다 은유 자체를 보존하는 편이 원문의 충격과 강도를 더 잘 드러냅니다.
  doctrine_reference: Lamentations 1:15의 심판 은유; source note on metaphor
