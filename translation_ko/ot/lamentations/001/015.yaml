revisions:
- from: 주님께서 내 가운데의 모든 내 용사들을 거절하셨습니다[a]. 주님께서 내게 대하여 한 정한 때를 불러 내 젊은이들을 무너뜨리셨습니다. 주님께서 유다의 처녀 딸을 위해 포도주틀을 밟으셨습니다[b].
  to: 주님께서는 내 한가운데에 있던 모든 용사를 내치셨습니다. 내 젊은이들을 부수시려고 나를 대적하여 정한 때를 선포하셨습니다[a]. 주님께서는 유다의 처녀 딸을 포도주틀에서 밟으셨습니다[b].
  rationale: 문법적으로 성립하지 않는 ‘정한 때를 불러’를 קָרָא עָלַי מוֹעֵד의 문맥상 가능한 뜻인 ‘나를 대적하여 정한 때를 선포하셨습니다’로 바로잡았습니다. מוֹעֵד의 ‘때/모임’ 양의성은 각주에서 보존했으며, a 표지를 해당 낱말에 옮겼습니다. 마지막 절은 포도주틀 은유를 해설로 바꾸지 않고 유지하되, 유다의 처녀 딸이 짓밟힘의 대상이라는 문맥을 한국어에서 분명히 했습니다. b 표지는 포도주틀 표현에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:36:54Z'
