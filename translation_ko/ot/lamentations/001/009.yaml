id: LAM.1.9
reference: Lamentations 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: טֻמְאָתָ֣/הּ בְּ/שׁוּלֶ֗י/הָ לֹ֤א זָֽכְרָה֙ אַחֲרִיתָ֔/הּ וַ/תֵּ֣רֶד פְּלָאִ֔ים אֵ֥ין מְנַחֵ֖ם לָ֑/הּ רְאֵ֤ה יְהוָה֙ אֶת עָנְיִ֔/י כִּ֥י הִגְדִּ֖יל אוֹיֵֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/009.yaml
  text: Her uncleanness was in her skirts[a]; she did not remember her end. So she came down astonishingly; there was no comforter for her. Look, O Yahweh, my affliction[c][b], for the enemy has magnified himself.
  footnotes:
  - marker: a
    text: Or 'she did not remember her future' or 'she did not consider her outcome.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'she came down astonishingly'; the sense is a shocking, extraordinary downfall.
    reason: lexical_alternative
  - marker: c
    text: Or 'for the enemy has exalted himself.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀의 더러움이 그녀의 치마 끝에 있었습니다[a]. 그녀는 자기의 끝을 기억하지 못했습니다. 그래서 그녀는 놀랍도록 내려갔습니다[b]. 그녀를 위로하는 이가 없었습니다. 보십시오, 야훼여, 저의 고난을[c], 원수가 스스로를 크게 높였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀가 자기의 미래를 기억하지 못했다’ 혹은 ‘자신의 결과를 헤아리지 않았다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘놀랍게 내려갔다’이며, 여기서는 충격적이고 비정상적인 추락을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘원수가 스스로를 높였기 때문입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתָהּ
  english_pob_choice: her uncleanness
  chosen_korean: 그녀의 더러움
  alternatives_korean:
  - 그녀의 부정함
  - 그녀의 불결함
  lexicon: HALOT
  rationale: 라멧의 오염 이미지를 살리되, 의례적·도덕적 의미를 과도하게 특정하지 않도록 ‘더러움’을 택했습니다.
- source_word: בְּשׁוּלֶיהָ
  english_pob_choice: in her skirts
  chosen_korean: 그녀의 치마 끝에
  alternatives_korean:
  - 그녀의 옷자락에
  - 그녀의 옷단에
  lexicon: HALOT
  rationale: שׁוּל의 하단·자락 이미지를 한국어로 자연스럽게 옮기면서, 더러움이 ‘보이는 자리’에 붙어 있다는 감각을 유지했습니다.
- source_word: אַחֲרִיתָהּ
  english_pob_choice: her end
  chosen_korean: 자기의 끝
  alternatives_korean:
  - 자기의 미래
  - 그 결과
  lexicon: HALOT
  rationale: 문맥상 ‘미래’보다 히브리어의 압축된 ‘끝/결말’이 더 직접적이어서, POB의 보존적 선택을 따라 ‘끝’으로 옮겼습니다.
- source_word: פְּלָאִים
  english_pob_choice: astonishingly
  chosen_korean: 놀랍도록
  alternatives_korean:
  - 경이롭게
  - 충격적으로
  - 기이하게
  lexicon: HALOT
  rationale: 긍정적 ‘경이’가 아니라 심판 아래서의 충격적 추락을 가리키므로, 한국어에서는 ‘놀랍도록’으로 자연스럽게 충격성을 살렸습니다.
- source_word: רְאֵה יְהוָה
  english_pob_choice: Look, O Yahweh
  chosen_korean: 보십시오, 야훼여
  alternatives_korean:
  - 보소서, 야훼여
  - 돌보십시오, 야훼여
  lexicon: HALOT
  rationale: 직접 호소의 명령형을 현대 합쇼체로 살리되, 본문이 요구하는 간절한 주목 요청을 ‘보십시오’로 표현했습니다.
- source_word: עָנְיִי
  english_pob_choice: my affliction
  chosen_korean: 저의 고난
  alternatives_korean:
  - 저의 환난
  - 저의 고통
  lexicon: HALOT
  rationale: 예레미야애가의 탄식 어휘에 맞추어 ‘affliction’의 고난성·압박성을 유지했습니다.
- source_word: כִּי הִגְדִּיל אוֹיֵב
  english_pob_choice: for the enemy has magnified himself
  chosen_korean: 원수가 스스로를 크게 높였기 때문입니다
  alternatives_korean:
  - 원수가 스스로를 크게 만들었기 때문입니다
  - 원수가 교만해졌기 때문입니다
  lexicon: HALOT
  rationale: הִגְדִּיל의 타동적·자기고양적 힘을 살려, 단순히 ‘크게 되다’가 아니라 ‘스스로를 크게 높이다’로 옮겼습니다.
theological_decisions:
- issue: 여호와 이름 YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 직설적 신명 표기로, POB 원칙에 따라 전통적 대체 호칭 대신 고유 이름을 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접 호소문의 높임말 처리
  chosen_reading: 보십시오, 야훼여
  alternative_readings:
  - 보소서, 야훼여
  - 보아 주십시오, 야훼여
  rationale: 예언적 탄식 속에서 하나님께 드리는 직접 호소는 합쇼체로 유지하되, 너무 평이하거나 과장된 경어는 피했습니다.
  doctrine_reference: Korean style guide — direct address to God
