  source_fidelity: 히브리어의 핵심 이미지와 문법적 관계는 대체로 반영되어 있습니다. 다만 현행 각주 a는 본문의 ‘치마 끝’에 붙어 있으면서 실제로는 ‘그녀의 끝/결말’(אַחֲרִיתָהּ)에 관한 대안을 설명하므로, 각주 앵커가 잘못 배치되어 있습니다. 또한 ‘보십시오, 야훼여, 저의 고난을’은 한국어 문장부호와 목적어 배치상 다소 어색합니다.
  naturalness: ‘치맛자락’, ‘결말’, ‘위로자’가 현대 표준 한국어의 문어적 탄식 문맥에 자연스럽습니다. 하나님께 드리는 직접 호소는 합쇼체로 ‘야훼여, 저의 고난을 보십시오’라고 하는 것이 명료합니다.
