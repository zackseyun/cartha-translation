revisions:
- from: 그녀의 더러움이 그녀의 치마 끝에 있었습니다[a]. 그녀는 자기의 끝을 기억하지 못했습니다. 그래서 그녀는 놀랍도록 내려갔습니다[b]. 그녀를 위로하는 이가 없었습니다. 보십시오, 야훼여, 저의 고난을[c], 원수가 스스로를 크게 높였기 때문입니다.
  to: 그녀의 부정함이 치맛자락에 있었습니다. 그녀는 자신의 결말을 기억하지 않았습니다[a]. 그리하여 그녀는 놀랍게 내려갔습니다[b]. 그녀에게는 위로자가 없었습니다. 야훼여, 저의 고난을 보십시오. 원수가 스스로를 크게 높였기 때문입니다[c].
  rationale: 의미를 바꾸지 않고, טֻמְאָה의 부정·오염 이미지를 ‘부정함’으로, שׁוּל의 의복 하단 이미지를 ‘치맛자락’으로 다듬었습니다. אַחֲרִית의 압축된 의미는 ‘결말’로 유지하고 대안은 해당 어구에 각주로 달았습니다. 모든 각주 앵커를 설명 대상에 맞게 재배치했으며, 마지막 호소문은 현대 합쇼체에서 자연스러운 어순으로 바로잡았습니다.
