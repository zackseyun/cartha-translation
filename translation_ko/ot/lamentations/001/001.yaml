source:
  edition: WLC
  text: אֵיכָ֣ה יָשְׁבָ֣ה בָדָ֗ד הָ/עִיר֙ רַבָּ֣תִי עָ֔ם הָיְתָ֖ה כְּ/אַלְמָנָ֑ה רַּבָּ֣תִי בַ/גּוֹיִ֗ם שָׂרָ֨תִי֙ בַּ/מְּדִינ֔וֹת הָיְתָ֖ה לָ/מַֽס׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/001.yaml
  text: How she sits alone[a], the city once full of people! She has become like a widow, she who was great among the nations, a princess among the provinces; she has become subject to forced labor.
  footnotes:
  - marker: a
    text: Or 'for tribute.' The Hebrew מַס can refer either to tribute imposed by a conqueror or to forced labor; the main text chooses the labor sense because it best fits the reversal from 'princess' to subjugation.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 그 도시가 홀로 앉아 있습니까? 전에 사람으로 가득하던 그 성읍이! 그것은 마치 과부가 된 것 같습니다. 민족들 가운데서 크던 그 도시, 지방들 가운데서 한 공주 같던 그 성읍이 이제는 강제 노역에 종속되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조공을 위해’. 히브리어 מַס는 정복자가 부과한 조공이나 강제 노역을 가리킬 수 있으며, 본문은 앞의 ‘공주’ 이미지와 대비되는 예속 상태를 분명히 하기 위해 강제 노역의 뜻을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
  - 어찌
  - 어째서
  - 어떻게
  lexicon: HALOT
  rationale: 애가의 탄식 서두로서 단순 정보 질문이 아니라 놀람과 비통을 드러내므로, 현대 한국어에서 자연스럽고 탄식 뉘앙스가 살아 있는 「어찌하여」를 택했습니다.
- source_word: יָשְׁבָה בָדָד
  english_pob_choice: sits alone
  chosen_korean: 홀로 앉아 있습니까
  alternatives_korean:
  - 외롭게 앉아 있습니다
  - 홀로 거하고 있습니다
  - 혼자 앉아 있습니다
  lexicon: HALOT
  rationale: ישב는 시적 문맥에서 현재의 처지를 그리는 동작상으로 읽을 수 있어, 정적·비참함을 살리는 「홀로 앉아 있습니까」로 옮겼습니다.
- source_word: רַבָּתִי עָם / רַבָּתִי בַגּוֹיִם / שָׂרָתִי בַּמְּדִינוֹת
  english_pob_choice: once full of people / great among the nations / a princess among the provinces
  chosen_korean: 전에 사람으로 가득하던 / 민족들 가운데서 크던 / 지방들 가운데서 한 공주
  alternatives_korean:
  - 사람이 많던 / 민족들 가운데서 위대하던 / 지방들 가운데서 한 공주
  - 백성이 많던 / 나라들 가운데서 크던 / 속주들 가운데서 한 공주
  lexicon: HALOT
  rationale: 반복되는 과거의 위상을 평행적으로 살리기 위해 「전에 사람으로 가득하던」, 「민족들 가운데서 크던」, 「지방들 가운데서 한 공주」로 대응시켰습니다. '공주'는 שָׂרָה의 지위 이미지를 가장 직접적으로 전달합니다.
- source_word: לָמַס
  english_pob_choice: subject to forced labor
  chosen_korean: 강제 노역에 종속되었습니다
  alternatives_korean:
  - 조공을 바치게 되었습니다
  - 강제 노역을 하게 되었습니다
  - 부역에 내몰렸습니다
  lexicon: HALOT
  rationale: מַס는 조공과 강제 노역 모두 가능하지만, 문맥의 전락과 굴욕을 분명히 드러내는 쪽은 ‘강제 노역’입니다. 다만 원어의 종속·예속감을 살리기 위해 「종속되었습니다」를 붙였습니다.
theological_decisions:
