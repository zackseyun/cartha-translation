source:
  edition: WLC
  text: אֵיכָ֣ה יָשְׁבָ֣ה בָדָ֗ד הָ/עִיר֙ רַבָּ֣תִי עָ֔ם הָיְתָ֖ה כְּ/אַלְמָנָ֑ה רַּבָּ֣תִי בַ/גּוֹיִ֗ם שָׂרָ֨תִי֙ בַּ/מְּדִינ֔וֹת הָיְתָ֖ה לָ/מַֽס׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/001.yaml
  text: How she sits alone[a], the city once full of people! She has become like a widow, she who was great among the nations, a princess among the provinces; she has become subject to forced labor.
  footnotes:
  - marker: a
    text: Or 'for tribute.' The Hebrew מַס can refer either to tribute imposed by a conqueror or to forced labor; the main text chooses the labor sense because it best fits the reversal from 'princess' to subjugation.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 사람이 많던 그 성읍이 홀로 앉아 있습니까! 민족들 가운데서 위대하던 이, 지방들 가운데서 공주였던 이가 과부처럼 되었습니다. 강제 노역을 하게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조공을 바치게 되었습니다.’ 히브리어 מַס는 정복자가 부과한 조공이나 강제 노역을 가리킬 수 있습니다. 본문은 공주였던 이의 예속된 처지와 대비를 나타내기 위해 강제 노역의 뜻을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
