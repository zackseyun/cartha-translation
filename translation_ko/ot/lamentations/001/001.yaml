  lexicon: HALOT
  rationale: 애가의 탄식 서두로서 단순 정보 질문이 아니라 놀람과 비통을 드러내므로, 현대 한국어에서 자연스럽고 탄식 뉘앙스가 살아 있는 「어찌하여」를 택했습니다.
- source_word: יָשְׁבָה בָדָד
  english_pob_choice: sits alone
  chosen_korean: 홀로 앉아 있습니까
