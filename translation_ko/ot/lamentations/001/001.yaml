  - 강제 노역을 하게 되었습니다
  - 부역에 내몰렸습니다
  lexicon: HALOT
  rationale: מַס는 조공과 강제 노역 모두 가능하지만, 문맥의 전락과 굴욕을 분명히 드러내는 쪽은 ‘강제 노역’입니다. 다만 원어의 종속·예속감을 살리기 위해 「종속되었습니다」를 붙였습니다.
theological_decisions:
- issue: 시가적 탄식문의 수사적 형태
  chosen_reading: 직역형 질문이지만 실제로는 정보를 묻는 것이 아니라 애가의 비탄과 경악을 드러내는 탄식으로 처리했습니다.
  alternative_readings:
