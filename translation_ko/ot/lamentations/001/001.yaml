- from: 어찌하여 그 도시가 홀로 앉아 있습니까? 전에 사람으로 가득하던 그 성읍이! 그것은 마치 과부가 된 것 같습니다. 민족들 가운데서 크던 그 도시, 지방들 가운데서 한 공주 같던 그 성읍이 이제는 강제 노역에 종속되었습니다.[a]
  to: 어찌하여 사람이 많던 그 성읍이 홀로 앉아 있습니까! 민족들 가운데서 위대하던 이, 지방들 가운데서 공주였던 이가 과부처럼 되었습니다. 강제 노역을 하게 되었습니다.[a]
  rationale: 수사적 탄식의 형식과 원문의 시적 병렬을 보존하면서, 과부 비유와 공주의 지위 표현을 원문에 맞게 바로잡았습니다. מַס의 의미 범위는 각주에서 유지하되, 한국어 대안 문장을 완결된 의미로 수정했습니다.
