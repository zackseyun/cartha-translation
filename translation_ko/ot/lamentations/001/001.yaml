  - 혼자 앉아 있습니다
  lexicon: HALOT
  rationale: ישב는 시적 문맥에서 현재의 처지를 그리는 동작상으로 읽을 수 있어, 정적·비참함을 살리는 「홀로 앉아 있습니까」로 옮겼습니다.
- source_word: רַבָּתִי עָם / רַבָּתִי בַגּוֹיִם / שָׂרָתִי בַּמְּדִינוֹת
  english_pob_choice: once full of people / great among the nations / a princess among the provinces
  chosen_korean: 전에 사람으로 가득하던 / 민족들 가운데서 크던 / 지방들 가운데서 한 공주
  alternatives_korean:
  - 사람이 많던 / 민족들 가운데서 위대하던 / 지방들 가운데서 한 공주
  - 백성이 많던 / 나라들 가운데서 크던 / 속주들 가운데서 한 공주
  lexicon: HALOT
  rationale: 반복되는 과거의 위상을 평행적으로 살리기 위해 「전에 사람으로 가득하던」, 「민족들 가운데서 크던」, 「지방들 가운데서 한 공주」로 대응시켰습니다. '공주'는 שָׂרָה의 지위 이미지를 가장 직접적으로 전달합니다.
- source_word: לָמַס
  english_pob_choice: subject to forced labor
  chosen_korean: 강제 노역에 종속되었습니다
  alternatives_korean:
