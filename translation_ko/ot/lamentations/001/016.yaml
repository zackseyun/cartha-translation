id: LAM.1.16
reference: Lamentations 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל אֵ֣לֶּה אֲנִ֣י בוֹכִיָּ֗ה עֵינִ֤/י עֵינִ/י֙ יֹ֣רְדָה מַּ֔יִם כִּֽי רָחַ֥ק מִמֶּ֛/נִּי מְנַחֵ֖ם מֵשִׁ֣יב נַפְשִׁ֑/י הָי֤וּ בָנַ/י֙ שֽׁוֹמֵמִ֔ים כִּ֥י גָבַ֖ר אוֹיֵֽב־׀׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/016.yaml
  text: For these things I am weeping; my eye[a], my eye runs down with water, because the comforter who restores my soul is far from me. My children have become desolate, because the enemy has prevailed.
  footnotes:
  - marker: a
    text: Or 'who restores my soul.' Hebrew nephesh can mean 'life,' 'self,' or 'soul' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들 때문에 내가 울고 있습니다. 내 눈에서, 내 눈에서 물이 흘러내립니다. 내 생명[a]을 회복시키는 위로자가 나에게서 멀리 있기 때문입니다. 내 자녀들은 황폐해졌습니다. 원수가 이겼기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼을 회복시키는’. 히브리어 네페쉬는 문맥에 따라 ‘생명’, ‘자기’, 또는 ‘영혼’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אֵלֶּה
  english_pob_choice: For these things
  chosen_korean: 이것들 때문에
  alternatives_korean:
  - 이 일들 때문에
  - 이런 것들로 인해
  lexicon: HALOT
  rationale: 원인의 뉘앙스를 살리면서도 한국어로 자연스러운 탄식 표현을 위해 ‘이것들 때문에’로 옮겼습니다.
- source_word: בוֹכִיָּה
  english_pob_choice: I am weeping
  chosen_korean: 내가 울고 있습니다
  alternatives_korean:
  - 나는 웁니다
  - 내가 울고 있어요
  lexicon: HALOT
  rationale: 지속되는 탄식의 흐름을 현대 한국어의 진행형으로 살렸습니다.
- source_word: יֹרְדָה מַּיִם
  english_pob_choice: runs down with water
  chosen_korean: 물로 흘러내립니다
  alternatives_korean:
  - 물로 떨어집니다
  - 눈물이 흘러내립니다
  lexicon: HALOT
  rationale: 히브리어의 직역상 ‘물’ 이미지를 유지하되, 한국어에서는 ‘흘러내립니다’가 가장 자연스럽습니다. ‘눈물’은 원문보다 해석을 덧붙이므로 본문에서는 피했습니다.
- source_word: מֵשִׁיב נַפְשִׁי
  english_pob_choice: who restores my life
  chosen_korean: 나의 생명을 회복시키는
  alternatives_korean:
  - 내 영혼을 회복시키는
  - 내 생명을 돌이키는
  lexicon: HALOT
  rationale: נֶפֶשׁ을 여기서 ‘생명/자기 존재’로 이해해, 추상적인 ‘영혼’보다 ‘생명’이 문맥에 더 잘 맞습니다.
- source_word: בָנַי
  english_pob_choice: My children
  chosen_korean: 내 자녀들은
  alternatives_korean:
  - 내 아들들은
  - 내 아이들은
  lexicon: HALOT
  rationale: 문맥상 시온의 주민 전체를 가리키므로 성별이 제한되는 ‘아들들’보다 포괄적인 ‘자녀들’이 적절합니다.
- source_word: שׁוֹמֵמִים
  english_pob_choice: have become desolate
  chosen_korean: 황폐하게 되었습니다
  alternatives_korean:
  - 황폐해졌습니다
  - 황량해졌습니다
  lexicon: HALOT
  rationale: 예레미야애가의 반복 어휘에 맞춰 멸망과 폐허의 상태를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: גָבַר אוֹיֵב
  english_pob_choice: the enemy has prevailed
  chosen_korean: 원수가 이겼기 때문입니다
  alternatives_korean:
  - 원수가 우세했기 때문입니다
  - 원수가 강해졌기 때문입니다
  lexicon: HALOT
  rationale: גבר의 ‘우세/승리’ 의미를 한국어 관용 표현인 ‘이기다’로 자연스럽게 전달했습니다.
theological_decisions:
- issue: נַפְשִׁי의 번역
  chosen_reading: ‘영혼’보다 ‘생명’으로 옮겨, 상실된 존재 전체의 회복을 강조했습니다.
  alternative_readings:
  - 내 영혼
  - 내 혼
  rationale: 이 절은 위로의 부재와 공동체의 붕괴를 말하므로, נֶפֶשׁ을 비물질적 영혼으로 좁히기보다 생명/자기 존재로 읽는 것이 문맥에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
