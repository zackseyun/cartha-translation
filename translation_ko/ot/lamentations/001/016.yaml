  source_fidelity: 본문은 대체로 히브리어 원문에 충실합니다. עֵינִי의 반복, מַיִם(‘물’)의 비유적 표현, נֶפֶשׁ의 ‘생명’ 이해, בָנַי의 포괄적 ‘자녀들’, גָבַר의 ‘이김/우세’가 적절히 반영되었습니다. 다만 각주 표지가 נַפְשִׁי 관련 대안이 아니라 절 끝의 ‘원수가 이겼기 때문입니다’에 붙어 있어, 원문의 해당 어휘와 연결되지 않습니다.
  naturalness: ‘내 눈, 내 눈이 물로 흘러내립니다’는 원문의 반복을 살리려는 의도는 좋으나 한국어로는 다소 어색합니다. ‘내 눈에서, 내 눈에서 물이 흘러내립니다’가 반복과 시적 강조를 유지하면서 더 자연스럽습니다. ‘나에게서 멀리 떠나 있기’는 원문이 명시하지 않는 ‘떠남’을 다소 보태므로 ‘나에게서 멀리 있기’가 더 직접적입니다.
  terminology: נֶפֶשׁ를 ‘생명’으로 번역한 것은 이 문맥에서 안전하고 적절합니다. 대안 독법은 ‘영혼’이므로, 각주는 실제 대안 표현을 제시해야 합니다. ‘위로자’는 מְנַחֵם의 명사화된 분사에 적합합니다.
  issues:
