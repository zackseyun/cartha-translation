  to: 야훼는 의로우십니다. 내가 그의 말씀을 거역했기 때문입니다[a]. 모든 백성들아[b], 부디 들으십시오. 나의 고통을 보십시오. 내 처녀들과 내 젊은 남자들이 포로로 끌려갔습니다.
