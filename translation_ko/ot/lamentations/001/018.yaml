id: LAM.1.18
reference: Lamentations 1:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צַדִּ֥יק ה֛וּא יְהוָ֖ה כִּ֣י פִ֣י/הוּ מָרִ֑יתִי שִׁמְעוּ נָ֣א כָל עמים וּ/רְאוּ֙ מַכְאֹבִ֔/י בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י הָלְכ֥וּ בַ/שֶּֽׁבִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/018.yaml
  text: 'Yahweh is righteous[a], for I have rebelled against his word. Hear, please, all peoples[b], and see my pain: my virgins and my young men have gone into captivity.'
  footnotes:
  - marker: a
    text: Literally, 'his mouth'; that is, what he spoke or commanded.
    reason: lexical_alternative
  - marker: b
    text: Or 'my maidens' / 'my young women.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 의로우십니다[a]. 내가 그의 말씀을 거역했기 때문입니다. 모든 백성[b]아, 이제 들으십시오. 그리고 나의 고통을 보십시오. 내 처녀들과 내 젊은이들이 포로로 끌려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 입’입니다. 여기서는 그가 말씀하시거나 명령하신 것을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 민족들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק / יְהוָה
  english_pob_choice: Yahweh is righteous
  chosen_korean: 야훼는 의로우십니다
  alternatives_korean:
  - 야훼는 의롭습니다
  - 주님은 의로우십니다
  lexicon: HALOT
  rationale: צַדִּיק은 하나님의 언약적·도덕적 올바름을 나타내므로 ‘의로우십니다’가 가장 직접적입니다. יְהוָה는 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: פִּיהוּ
  english_pob_choice: his mouth
  chosen_korean: 그의 말씀
  alternatives_korean:
  - 그의 입
  - 그의 명령
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그의 입’이지만, 문맥상 야훼께서 말씀하시거나 명령하신 바를 가리키는 환유이므로 본문에는 자연스럽고 의미가 분명한 ‘그의 말씀’을 두었습니다. 영어 POB의 각주 취지를 반영합니다.
- source_word: כָל עַמִּים
  english_pob_choice: all peoples
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 민족들
  - 모든 나라들
  lexicon: HALOT
  rationale: עַמִּים은 ‘백성들/민족들’을 뜻하지만, 애가의 호소문맥에서 한국어로는 ‘모든 백성’이 가장 자연스럽고 넓은 청중을 드러냅니다.
- source_word: בְּתוּלֹתַי וּבַחוּרַי
  english_pob_choice: my virgins and my young men
  chosen_korean: 내 처녀들과 내 젊은이들
  alternatives_korean:
  - 내 동정녀들과 내 젊은이들
  - 내 처녀들과 내 청년들
  lexicon: HALOT
  rationale: בְּתוּלֹתַי는 문자적으로 ‘처녀들/미혼 여자들’, בַּחוּרַי는 ‘젊은이들’입니다. 한국어에서는 병렬성을 살리면서도 과도하게 교회적이거나 옛말이 되지 않도록 ‘처녀들’과 ‘젊은이들’을 택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: ‘야훼’로 음역하여 인명적·계약적 신적 이름을 보존했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: 본문은 칭호가 아니라 여호와/야훼라는 고유한 신명을 직접 사용합니다. 프로젝트 기본 원칙에 따라 ‘야훼’를 유지하여 원문이 가진 언약적 호칭의 구별성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: פִּיהוּ의 직역과 해석
  chosen_reading: 본문에는 의미역으로 ‘그의 말씀’을 두고, 문자적 환유는 각주로 보존할 수 있는 방향을 취했습니다.
  alternative_readings:
  - 그의 입
  - 그의 명령
  rationale: 히브리어 표현은 문자적으로는 ‘입’이지만, 실제 의미는 하나님께서 선포하신 말씀/명령입니다. 한국어 본문에서 ‘입’은 오해 소지가 크므로, 원문 의미를 분명히 드러내는 쪽이 바람직합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1, #3, #5'
