  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּכ֨וֹ תִבְכֶּ֜ה בַּ/לַּ֗יְלָה וְ/דִמְעָתָ/הּ֙ עַ֣ל לֶֽחֱיָ֔/הּ אֵֽין לָ֥/הּ מְנַחֵ֖ם מִ/כָּל אֹהֲבֶ֑י/הָ כָּל רֵעֶ֨י/הָ֙ בָּ֣גְדוּ בָ֔/הּ הָ֥יוּ לָ֖/הּ לְ/אֹיְבִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/002.yaml
  text: She weeps bitterly in the night[a], with her tears on her cheeks; among all her lovers she has no comforter. All her companions have dealt treacherously with her[b]; they have become her enemies.
  footnotes:
  - marker: a
    text: Or 'among all her allies.' The Hebrew 'lovers' preserves the poem's personification of the city as a woman and may also imply political partners.
    reason: lexical_alternative
  - marker: b
    text: Or 'all her friends' or 'all her allies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 밤에 그녀는 슬피 웁니다[a]. 그녀의 눈물은 뺨 위에 있고, 그녀의 모든 연인들 가운데 그녀를 위로하는 이가 없습니다. 그녀의 모든 친구들이 그녀를 배반하였고[b], 그들은 그녀의 원수가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀의 모든 동맹자들 가운데’. 원문의 ‘연인들’은 도시를 여성으로 의인화한 표현을 보존하며, 정치적 동맹을 암시할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀의 모든 친구들이’ 또는 ‘그녀의 모든 동맹자들이’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּכ֨וֹ תִבְכֶּה
  english_pob_choice: she weeps bitterly
  chosen_korean: 슬피 웁니다
  alternatives_korean:
  - 몹시 웁니다
  - 통곡합니다
  - 간절히 웁니다
  lexicon: HALOT
  rationale: 부정사 절대형과 미완료형의 강조를 한국어 자연문으로 옮기되, 시적 강도를 살려 ‘슬피’로 압축했습니다.
- source_word: בַּ/לַּ֗יְלָה
  english_pob_choice: in the night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤중에
  - 밤 동안
  - 밤에
  lexicon: HALOT
  rationale: 시간 부사를 간결한 표준어로 처리해 시구의 흐름을 해치지 않으면서도 원문의 시간 표지를 보존했습니다.
- source_word: מִ/כָּל אֹהֲבֶ֑י/הָ
  english_pob_choice: among all her lovers
  chosen_korean: 그녀의 모든 연인들 가운데
  alternatives_korean:
  - 그녀를 사랑하던 이들 가운데
  - 그녀의 모든 동맹자들 가운데
  lexicon: HALOT
  rationale: 원문의 의인화와 관계적 긴장을 살리기 위해 ‘연인들’을 유지했습니다. 이는 단순한 ‘동맹자들’로 평평하게 만들지 않으려는 선택입니다.
- source_word: בָּגְדוּ בָ֔/הּ
  english_pob_choice: have dealt treacherously with her
  chosen_korean: 그녀를 배반하였고
  alternatives_korean:
  - 그녀에게 불성실하였고
  - 그녀를 저버렸고
  - 그녀에게 간악하게 행동하였고
  lexicon: HALOT
  rationale: בגד의 핵심 의미는 배신과 불성실이므로, 시적 문맥에서 자연스러운 ‘배반하다’로 옮겼습니다.
- source_word: אֹיְבִֽים
  english_pob_choice: enemies
  chosen_korean: 원수
  alternatives_korean:
  - 적
  - 대적
  lexicon: HALOT
  rationale: 관계의 전환을 강조하는 서술이므로, 최종 상태를 나타내는 ‘원수’로 옮겨 대립의 강도를 살렸습니다.
theological_decisions:
- issue: ‘lovers’ 은유를 정치적 동맹으로 평탄화할지 여부
  chosen_reading: 원문의 의인화된 은유를 유지해 ‘연인들’로 번역했습니다.
  alternative_readings:
  - 동맹자들
  - 친구들
  rationale: 예레미야애가의 비탄시는 도시를 여성으로 의인화하며 관계 파탄을 드러내므로, 은유를 풀어버리기보다 그대로 보존하는 편이 원문의 정서와 신학적 긴장을 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve literary-theological tension'
