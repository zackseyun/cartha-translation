id: LAM.1.19
reference: Lamentations 1:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קָרָ֤אתִי לַֽ/מְאַהֲבַ/י֙ הֵ֣מָּה רִמּ֔וּ/נִי כֹּהֲנַ֥/י וּ/זְקֵנַ֖/י בָּ/עִ֣יר גָּוָ֑עוּ כִּֽי בִקְשׁ֥וּ אֹ֨כֶל֙ לָ֔/מוֹ וְ/יָשִׁ֖יבוּ אֶת נַפְשָֽׁ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/019.yaml
  text: I called to my lovers[a]; they deceived me[b]. My priests and my elders perished in the city while they sought food for themselves to restore their lives.
  footnotes:
  - marker: a
    text: '''My lovers'' is a metaphorical expression that likely refers to Jerusalem''s political allies or other objects of misplaced trust.'
    reason: cultural_note
  - marker: b
    text: Or 'for they sought food for themselves to revive themselves.' The Hebrew can be read with a more explicitly causal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 제 사랑하는 이들을 불렀으나, 그들이 저를 속였습니다. 제 제사장들과 장로들은 성읍에서 기근으로 죽었는데, 그들이 자기들의 생명을 되찾을 양식을 찾고 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 사랑하는 이들’은 문자적으로는 ‘내 사랑하는 자들’이며, 이 애가에서 정치적 동맹이나 잘못 의지한 대상들을 가리키는 은유일 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘그들이 자기들의 생명을 되찾을 양식을 찾고 있었기 때문입니다’는 히브리어를 원인으로 읽은 표현입니다. 더 직접적으로는 ‘그들이 자기들의 생명을 되살릴 양식을 찾고 있었으므로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְאַהֲבַי
  english_pob_choice: my lovers
  chosen_korean: 제 사랑하는 이들
  alternatives_korean:
  - 제 연인들
  - 제 동맹자들
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현을 살리되, 한국어에서 오해를 줄이기 위해 직역형인 “사랑하는 이들”을 택했습니다. 문맥상 정치적 동맹을 가리킬 수 있지만, 본문이 유지하는 은유를 본문 안에서 보존하는 것이 더 적절합니다.
- source_word: הֵמָּה רִמּוּנִי
  english_pob_choice: they deceived me
  chosen_korean: 그들이 저를 속였습니다
  alternatives_korean:
  - 그들이 저를 배신했습니다
  - 그들이 저를 기만했습니다
  lexicon: HALOT
  rationale: רמה의 기본 의미인 ‘속이다’를 가장 직접적으로 옮겼습니다. 애가의 탄식적 어조에도 잘 맞습니다.
- source_word: כֹּהֲנַי וּזְקֵנַי
  english_pob_choice: my priests and my elders
  chosen_korean: 제 제사장들과 장로들
  alternatives_korean:
  - 제 사제들과 원로들
  - 제 제사장들과 노인들
  lexicon: HALOT
  rationale: כֹּהֲנִים은 표준적인 ‘제사장’, זְקֵנִים은 연로한 남자보다 공동체 지도자를 가리키므로 ‘장로들’이 문맥상 더 정확합니다.
- source_word: גָּוָעוּ
  english_pob_choice: perished
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 숨졌습니다
  - 끊어졌습니다
  - 멸망했습니다
  lexicon: HALOT
  rationale: 시적·비극적 맥락에서 ‘perished’의 의미를 자연스럽게 전달하면서도 과장된 신학적 해석을 덧붙이지 않기 위해 ‘죽었습니다’로 옮겼습니다.
- source_word: כִּי בִקְשׁוּ אֹכֶל לָמוֹ וְיָשִׁיבוּ אֶת נַפְשָׁם
  english_pob_choice: while they sought food for themselves to restore their lives
  chosen_korean: 그들이 자기들의 생명을 되찾을 양식을 찾고 있었기 때문입니다
  alternatives_korean:
  - 그들이 자기들의 생명을 되살릴 양식을 찾고 있었기 때문입니다
  - 자기들의 생명을 회복하려고 양식을 구했기 때문입니다
  lexicon: HALOT
  rationale: כִּי의 원인/상황 관계를 한국어의 자연스러운 원인 절로 처리했습니다. נֶפֶשׁ은 여기서 ‘영혼’보다 ‘생명’이 적절하며, וְיָשִיבוּ는 ‘되찾다/회복하다’의 의미를 살렸습니다.
theological_decisions:
- issue: נפש의 의미 범위
  chosen_reading: ‘생명’을 택해 내적 영혼보다 생존 자체를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - ‘영혼’
  - ‘목숨’
  rationale: 본문은 굶주림 속에서 양식을 구하다 죽는 상황을 말하므로, נֶפֶשׁ을 비물질적 영혼으로 읽기보다 생명/목숨의 의미로 이해하는 것이 문맥에 충실합니다.
  doctrine_reference: 인간론 용어의 문맥적 범위
