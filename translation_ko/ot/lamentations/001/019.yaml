revisions:
- from: 제가 제 사랑하는 이들을 불렀으나, 그들이 저를 속였습니다. 제 제사장들과 장로들은 성읍에서 기근으로 죽었는데, 그들이 자기들의 생명을 되찾을 양식을 찾고 있었기 때문입니다.[a][b]
  to: 나는 나를 사랑하던 이들을 불렀으나[a], 그들은 나를 속였습니다. 내 제사장들과 장로들은 성읍에서, 자신들의 생명을 회복하려고 양식을 구하던 중 죽었습니다.[b]
  rationale: 원문에 없는 ‘기근으로’를 제거하고, ‘사랑하는 이들’의 관계 방향을 원문대로 바로잡았습니다. 양식을 구한 행동과 죽음의 관계는 본문에서 시간·상황적으로 표현하여 כִּי의 해석상 여지를 보존했으며, 인과적 독법은 각주로 제시했습니다. 각주 표지도 각각 해당 표현과 문장에 직접 붙였습니다.
