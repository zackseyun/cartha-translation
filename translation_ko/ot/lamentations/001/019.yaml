    issue: ‘성읍에서 기근으로 죽었는데’의 ‘기근으로’
    rationale: גָּוָעוּ בָּעִיר는 ‘성읍에서 죽었다’이며, 본문은 양식을 찾았다는 사실을 말하지만 사망 원인을 ‘기근’이라고 명시하지 않습니다.
  - severity: medium
    issue: ‘제 사랑하는 이들’ 및 각주에 제시된 문자적 설명
    rationale: לַמְאַהֲבַי의 소유 접미사는 화자를 사랑하는 자들(‘my lovers’)을 가리킵니다. 현 번역은 한국어상 화자가 그들을 사랑한다는 방향으로 더 쉽게 읽히며, 각주의 ‘문자적으로는 내 사랑하는 자들’도 관계 방향을 충분히 반영하지 못합니다.
