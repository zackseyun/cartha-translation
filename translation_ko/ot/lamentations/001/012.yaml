revisions:
- from: 길을 지나가는 모든 사람들아, 이것이 너희에게 아무 의미가 없습니까? 보십시오. 내 고통과 같은 고통이 있는지 보아라. 이것은 내게 가해진 것인데, 야훼께서 그의 맹렬한 분노의 날에 내게 이렇게 고통을 주셨습니다.[a][b]
  to: 길을 지나는 모든 이들이여, 이것이 여러분에게는 아무것도 아닙니까?[a] 살펴보고 보십시오. 내게 가해진 내 고통, 곧 야훼께서 그의 맹렬한 분노의 날에 내게 가하신 고통과 같은 고통이 있는지 보십시오.[b]
  rationale: 합쇼체로 문체를 통일하고, 각주 표지를 해당 어구에 배치했습니다. '내게 가해진 내 고통'은 עוֹלַל לִי를, 이어지는 '야훼께서 ... 내게 가하신'은 הוֹגָה יְהוָה를 각각 반영합니다. 첫 구절의 문법적 생략이 지닌 호소와 가능한 해석 범위는 각주에서 보존했습니다.
