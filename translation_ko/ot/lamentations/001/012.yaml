id: LAM.1.12
reference: Lamentations 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ל֣וֹא אֲלֵי/כֶם֮ כָּל עֹ֣בְרֵי דֶרֶךְ֒ הַבִּ֣יטוּ וּ/רְא֗וּ אִם יֵ֤שׁ מַכְאוֹב֙ כְּ/מַכְאֹבִ֔/י אֲשֶׁ֥ר עוֹלַ֖ל לִ֑/י אֲשֶׁר֙ הוֹגָ֣ה יְהוָ֔ה בְּ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/012.yaml
  text: Is it nothing to you[a], all you who pass by on the road? Look and see whether there is any sorrow like my sorrow, which was dealt to me[b], with which Yahweh afflicted me in the day of his fierce anger.
  footnotes:
  - marker: a
    text: Or, 'Does it not concern you, all you who pass by?' The Hebrew opening is elliptical, literally 'not to you,' and can be understood as an appeal for attention or sympathy.
    reason: lexical_alternative
  - marker: b
    text: Or 'pain' or 'affliction' instead of 'sorrow' for the repeated Hebrew word.
    reason: lexical_alternative
translation:
  language: ko
  text: 길을 지나가는 모든 사람들아, 이것이 너희에게 아무 의미가 없습니까? 보십시오. 내 고통과 같은 고통이 있는지 보아라. 이것은 내게 가해진 것인데, 야훼께서 그의 맹렬한 분노의 날에 내게 이렇게 고통을 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 시작은 축약형으로, 문자적으로는 '너희에게 아니다/아니냐'에 가깝습니다. 문맥에서는 지나가는 이들에게 관심과 공감을 호소하는 표현입니다.
    reason: source_note
  - marker: b
    text: מַכְאוֹב는 문맥에 따라 '고통', '아픔', '슬픔'으로 옮길 수 있습니다. 여기서는 탄식의 맥락을 따라 '고통'으로 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֣וֹא אֲלֵיכֶם
  english_pob_choice: Is it nothing to you
  chosen_korean: 이것이 너희에게 아무 의미가 없습니까?
  alternatives_korean:
  - 너희에게 아무것도 아니란 말입니까?
  - 너희와는 상관없습니까?
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '너희에게 아니냐'라는 생략된 표현이어서, 문맥상 행인들에게 주의를 끌고 공감을 호소하는 뉘앙스를 한국어의 자연스러운 질문형으로 옮겼습니다.
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  english_pob_choice: all you who pass by on the road
  chosen_korean: 길을 지나가는 모든 사람들아
  alternatives_korean:
  - 길을 지나는 모든 이들아
  - 지나가는 모든 행인들아
  lexicon: HALOT
  rationale: '''길/도로를 지나가는 자들''이라는 구체적 이미지는 유지하되, 호소문형 주소로 자연스럽게 다듬었습니다.'
- source_word: הַבִּיטוּ וּרְאוּ
  english_pob_choice: Look and see
  chosen_korean: 보십시오…보아라
  alternatives_korean:
  - 보십시오
  - 살펴보십시오
  lexicon: HALOT
  rationale: 두 명령은 강한 호소를 이루므로 한국어도 반복을 살려 긴급성과 시각적 확인의 요구를 드러냈습니다. 뒤의 '보아라'는 화자의 탄식적 직접 어조를 보존합니다.
- source_word: מַכְאוֹב ... כְּמַכְאֹבִי
  english_pob_choice: sorrow ... like my sorrow
  chosen_korean: 내 고통과 같은 고통
  alternatives_korean:
  - 내 슬픔과 같은 슬픔
  - 내 아픔과 같은 아픔
  lexicon: HALOT
  rationale: מַכְאוֹב는 신체적 아픔과 정서적 슬픔을 함께 가질 수 있어, '고통'이 반복 비교의 힘을 가장 직접적으로 살립니다.
- source_word: אֲשֶׁר עוֹלַל לִי
  english_pob_choice: which was dealt to me
  chosen_korean: 이것은 내게 가해진 것인데
  alternatives_korean:
  - 내게 행해진 것인데
  - 내게 저질러진 것인데
  lexicon: HALOT
  rationale: עוֹלַל은 단순 발생이 아니라 가혹하게 '당하다/겪다'는 뉘앙스를 지니므로, 수동적으로 '가해진 것'으로 옮겨 피해성을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 기록된 신명사 יְהוָה는 POB 기준에 따라 '야훼'로 옮겨, 본문이 직접 부르는 하나님의 고유명을 보존했습니다.
theological_decisions:
- issue: '''분노의 날''에서 야훼의 심판적 정서 표현'
  chosen_reading: 그의 맹렬한 분노의 날
  alternative_readings:
  - 그의 진노의 날
  - 그의 불타는 분노의 날
  rationale: חֲרוֹן אַף은 단순한 감정이 아니라 격렬한 진노의 관용구이므로, '맹렬한 분노'로 강도를 살리되 과도하게 해석을 확장하지 않았습니다.
  doctrine_reference: 애가 1:12의 시적 탄식과 야훼의 심판 표현
- issue: 직접 호소와 탄식의 어조
  chosen_reading: …보아라
  alternative_readings:
  - …보십시오
  - …보세요
  rationale: 예언적 탄식의 직접 호소를 살리기 위해, 문맥상 화자의 절박함을 드러내는 반말형 종결을 일부 유지했습니다. 이는 청중에게 던지는 시적 수사로 이해됩니다.
  doctrine_reference: 애가의 시적-탄식적 화법
