  text: Rise[a], cry out in the night, at the beginning of the watches; pour out your heart like water before the face of the Lord. Lift up your hands to him for the lives of your little children, who are faint with hunger at the head of every street.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'at every street corner.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나십시오. 밤에, 밤의 파수 시간이 시작될 때마다 부르짖으십시오. 주님 앞에서 물처럼 당신의 마음을 쏟으십시오. 모든 길모퉁이에서 굶주림으로 기진한 당신의 어린 자녀들의 생명을 위하여 그분께 두 손을 들어 올리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모든 거리의 머리에서’입니다. 여기서는 거리의 어귀나 길모퉁이를 가리킵니다.
    reason: lexical_alternative
