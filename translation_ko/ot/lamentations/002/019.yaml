base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/019.yaml
  text: Rise[a], cry out in the night, at the beginning of the watches; pour out your heart like water before the face of the Lord. Lift up your hands to him for the lives of your little children, who are faint with hunger at the head of every street.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'at every street corner.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일어나 밤에 외치십시오. 야경이 시작될 때에. 물처럼 당신의 마음을 쏟아내어 주님 얼굴 앞에 하십시오. 당신의 손을 그분께 들어 올리십시오 — 굶주림에 기운이 빠진 당신의 어린 자녀들의 생명을 위하여, 길거리마다 머리맡에 있는 그들을 위하여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길거리마다 머리맡에 있는’은 ‘at the head of every street’를 가능한 한 가까이 옮긴 표현입니다. 더 관용적으로는 ‘모퉁이마다’로도 옮길 수 있습니다.
    reason: lexical_alternative
