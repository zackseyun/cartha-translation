  - 온 세상의 기쁨
  lexicon: HALOT
  rationale: 관용적 칭호로서의 표현을 간결하게 살려, 예루살렘의 옛 명성을 드러냈습니다.
theological_decisions:
- issue: 수사적 조롱과 탄식의 톤
  chosen_reading: 본문의 질문과 몸짓을 모두 조롱의 언어로 읽어, ‘야유하며’와 인용문 안의 반문을 통해 멸시의 분위기를 유지했습니다.
  alternative_readings:
  - 단순한 관찰 서술로 완화하는 읽기
  - 감정 중립적으로 옮기는 읽기
  rationale: 이 절은 지나가는 자들의 공개적 조롱을 묘사하므로, 정서적 강도를 낮추면 본문의 비극성과 수치가 약화됩니다.
  doctrine_reference: 예루살렘의 멸망에 대한 애가 문맥(Lamentations 2장)
