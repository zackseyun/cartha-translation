  lexicon: HALOT
  rationale: 문맥상 단순한 소리보다 멸시와 조롱의 행위를 드러내는 한국어가 더 적절하여, ‘야유하다’로 풀었습니다.
- source_word: עַל בַּת יְרוּשָׁלָם
  english_pob_choice: over daughter Jerusalem
  chosen_korean: 딸 예루살렘에 대하여
