  text: סָֽפְק֨וּ עָלַ֤יִ/ךְ כַּפַּ֨יִם֙ כָּל עֹ֣בְרֵי דֶ֔רֶךְ שָֽׁרְקוּ֙ וַ/יָּנִ֣עוּ רֹאשָׁ֔/ם עַל בַּ֖ת יְרוּשָׁלִָ֑ם הֲ/זֹ֣את הָ/עִ֗יר שֶׁ/יֹּֽאמְרוּ֙ כְּלִ֣ילַת יֹ֔פִי מָשׂ֖וֹשׂ לְ/כָל הָ/אָֽרֶץ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/015.yaml
  text: 'All who pass along the road clap their hands at you[a]; they hiss and shake their heads over daughter Jerusalem: “Is this the city that they called the perfection of beauty[c][b], the joy of all the earth?”'
  footnotes:
  - marker: a
    text: Or 'whistle'; the Hebrew verb can denote a sharp sound of derision, whether rendered 'hiss' or 'whistle.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'daughter Jerusalem,' a poetic personification of the city.
    reason: cultural_note
  - marker: c
    text: Or 'perfect in beauty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 길을 지나가는 모든 사람이 너를 향해 손뼉을 치고, 야유하며 자기 머리를 흔듭니다. 딸 예루살렘에 대하여 말하기를 “이것이 사람들이 ‘완전한 아름다움, 온 땅의 기쁨’이라고 불렀던 도시입니까?” 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야유하다’는 כאן의 동사가 가리킬 수 있는 날카로운 멸시의 소리를 의역한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘딸 예루살렘’은 도시를 의인화한 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘완전한 아름다움’은 ‘아름다움의 완전함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָפְקוּ ... כַּפַּיִם
  english_pob_choice: clap their hands
  chosen_korean: 손뼉을 치고
  alternatives_korean:
