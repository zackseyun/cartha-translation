  text: גָּדַ֣ע בָּֽ/חֳרִי אַ֗ף כֹּ֚ל קֶ֣רֶן יִשְׂרָאֵ֔ל הֵשִׁ֥יב אָח֛וֹר יְמִינ֖/וֹ מִ/פְּנֵ֣י אוֹיֵ֑ב וַ/יִּבְעַ֤ר בְּ/יַעֲקֹב֙ כְּ/אֵ֣שׁ לֶֽהָבָ֔ה אָכְלָ֖ה סָבִֽיב׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/003.yaml
  text: In burning anger he has cut down every horn of Israel[a]; he has drawn back his right hand from before the enemy[b], and he has burned in Jacob like a flaming fire that devours all around.
  footnotes:
  - marker: a
    text: '''Horn'' is a Hebrew metaphor for strength or power.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he has withdrawn his right hand before the enemy.' The image is of God pulling back his power or protection.
    reason: lexical_alternative
translation:
  language: ko
  text: 맹렬한 분노로 그는 이스라엘의 모든 뿔을 잘라 내셨습니다[a]. 그는 원수 앞에서 자기 오른손을 거두셨고[b], 야곱 가운데에서 불꽃 같은 불처럼 타오르셔서 사방을 삼키셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’은 히브리어에서 힘이나 권세를 가리키는 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘원수 앞에서 그의 오른손을 뒤로 물리셨고’라고 옮길 수 있습니다. 이는 하나님이 자신의 능력이나 보호를 거두시는 모습을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַע
  english_pob_choice: has cut down
  chosen_korean: 꺾으셨습니다
  alternatives_korean:
  - 잘라 내셨습니다
  - 찍어 쓰러뜨리셨습니다
  lexicon: HALOT
  rationale: 이 동사는 단순 제거보다 폭력적인 절단·파괴의 뉘앙스를 가지므로, 한국어에서는 권세의 꺾임을 자연스럽게 드러내는 ‘꺾다’가 적절합니다.
- source_word: כֹּל קֶרֶן יִשְׂרָאֵל
  english_pob_choice: every horn of Israel
  chosen_korean: 이스라엘의 모든 뿔
  alternatives_korean:
  - 이스라엘의 모든 힘
  - 이스라엘의 모든 권세
  lexicon: HALOT
  rationale: ‘뿔’은 힘과 권세의 비유이므로 의미로 풀지 않고 원문 이미지를 살려 번역했습니다. 주석으로 비유임을 밝힐 수 있습니다.
- source_word: הֵשִׁיב אָחוֹר יְמִינוֹ מִפְּנֵי אוֹיֵב
  english_pob_choice: he has drawn back his right hand from before the enemy
  chosen_korean: 원수 앞에서 자기 오른손을 거두셨고
  alternatives_korean:
  - 원수 앞에서 자기 오른손을 물리치셨고
  - 원수 앞에서 자기 오른손을 뒤로 거두셨고
  lexicon: HALOT
  rationale: ‘오른손’은 능력과 보호의 상징이므로, 그 손을 ‘거두다’로 옮겨 의도적인 철수와 보호의 중단을 드러냈습니다. ‘from before the enemy’는 ‘원수 앞에서’로 자연스럽게 처리했습니다.
- source_word: וַיִּבְעַר בְּיַעֲקֹב כְּאֵשׁ לֶהָבָה
  english_pob_choice: he has burned in Jacob like a flaming fire
  chosen_korean: 야곱 가운데에서 불처럼 타올라 사방을 삼키는 불길이 되셨습니다
  alternatives_korean:
  - 야곱 가운데서 불같이 타올라 사방을 삼키셨습니다
  - 야곱 가운데에서 불꽃처럼 타올라 둘레를 삼키는 불이 되셨습니다
  lexicon: HALOT
  rationale: בער의 타오름과 뒤이은 소멸 이미지를 함께 살리기 위해 ‘타올라’와 ‘삼키는 불길’을 사용했습니다. ‘사방’은 סָבִיב의 포괄적 파괴를 자연스럽게 옮깁니다.
theological_decisions:
- issue: 하나님의 심판을 나타내는 신체·불 이미지 보존
  chosen_reading: ‘뿔’, ‘오른손’, ‘불길’ 이미지를 그대로 살려 야훼의 징계와 보호 철회의 상징을 유지했습니다.
  alternative_readings:
  - ‘뿔’을 ‘힘’으로 의역한다
  - ‘오른손’을 ‘권능’으로 바꾼다
  rationale: 본문은 문학적으로 누적되는 상징을 통해 심판을 표현하므로, 이미지를 풀어쓰면 신학적 긴장과 시적 힘이 약해집니다. 원문 비유를 보존하는 편이 독자에게 더 정확한 의미를 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
