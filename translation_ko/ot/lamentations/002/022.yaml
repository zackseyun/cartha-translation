source:
  edition: WLC
  text: תִּקְרָא֩ כְ/י֨וֹם מוֹעֵ֤ד מְגוּרַ/י֙ מִ/סָּבִ֔יב וְ/לֹ֥א הָיָ֛ה בְּ/י֥וֹם אַף יְהוָ֖ה פָּלִ֣יט וְ/שָׂרִ֑יד אֲשֶׁר טִפַּ֥חְתִּי וְ/רִבִּ֖יתִי אֹיְבִ֥/י כִלָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/022.yaml
  text: You summoned my terrors from every side as on an appointed day[a], and on the day of Yahweh’s anger there was no survivor or remnant. Those whom I nurtured and raised[b], my enemy destroyed them.
  footnotes:
  - marker: a
    text: Or 'as on a feast day' / 'like a festival day'; the Hebrew compares the gathering of terrors to the assembling of people on an appointed festival occasion.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my terrors from every side'; some understand this more broadly as 'those who terrorize me on every side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 정해진 절기의 날처럼[a] 사방에서 내 두려움들[b]을 불러 모으셨습니다. 야훼의 진노의 날에는 피하여 살아남은 자도 남은 자도 없었습니다. 내가 품어 기르고 키운 자들을 내 원수가 모두 멸하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정해진 날처럼’, ‘절기 날처럼’으로 옮길 수 있습니다. 히브리어는 두려움들의 집결을 정해진 절기 때의 모임에 비유합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내 두려움들’을 뜻합니다. 일부는 이를 더 넓게 ‘사방에서 나를 위협하는 자들’로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרָא
  english_pob_choice: You summoned
  chosen_korean: 불러 모으셨습니다
  alternatives_korean:
  - 부르셨습니다
  - 소집하셨습니다
  lexicon: HALOT
  rationale: 상대적으로 단순한 ‘부르다’보다, 두려움들이 사방에서 집결하는 장면을 살리는 ‘불러 모으셨습니다’가 source의 집합·소집 뉘앙스를 더 잘 드러냅니다.
- source_word: כְיוֹם מוֹעֵד
  english_pob_choice: as on an appointed day
  chosen_korean: 마치 정해진 날에 하듯
  alternatives_korean:
  - 절기 날처럼
  - 정해진 절기처럼
  lexicon: HALOT
  rationale: מוֹעֵד의 ‘정해진 때/절기’ 범위를 살리면서, 두려움의 집결을 절기 모임에 비유하는 아이러니를 한국어로 자연스럽게 옮겼습니다.
- source_word: פָּלִיט וְשָׂרִיד
  english_pob_choice: survivor or remnant
  chosen_korean: 도망한 자도 남은 자도
  alternatives_korean:
  - 살아남은 자도 남은 자도
  - 생존자도 잔존자도
  lexicon: HALOT
  rationale: 두 명사가 ‘남아 있는 자’와 ‘빠져나온 자’의 대비를 이루므로, 의미를 구분해 ‘도망한 자’와 ‘남은 자’로 옮겨 total destruction의 강도를 보존했습니다.
- source_word: טִפַּחְתִּי וְרִבִּיתִי
  english_pob_choice: Those whom I nurtured and raised
  chosen_korean: 내가 품어 기르고 자라게 한 자들
  alternatives_korean:
  - 내가 길러 키운 자들
  - 내가 양육하고 키운 자들
  lexicon: HALOT
  rationale: 두 동사의 결합은 자녀를 돌보고 키우는 친밀한 양육을 가리키므로, ‘품어 기르고 자라게 한’으로 정서와 성장의 의미를 함께 살렸습니다.
- source_word: אֹיְבִי
  english_pob_choice: my enemy
  chosen_korean: 내 원수
  alternatives_korean:
  - 나의 적
  - 내 적
  lexicon: HALOT
  rationale: 1인칭 소유형이므로 ‘내 원수’가 직역성과 한국어 자연성을 함께 만족합니다.
- source_word: כִלָּם
  english_pob_choice: destroyed them
  chosen_korean: 모두 멸망시켰습니다
  alternatives_korean:
  - 모두 멸하였습니다
  - 모두 끝장냈습니다
  lexicon: HALOT
  rationale: כּלה의 완결·파멸 의미를 반영하면서, 문어체로서의 무게를 유지하는 표현을 선택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 신명 Tetragrammaton을 전통적 대체어로 희석하지 않고, 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 시적 탄식에서 1인칭 화자의 고통 표현
  chosen_reading: ‘내 두려움들’과 ‘품어 기르고 자라게 한 자들’의 병렬을 유지
  alternative_readings:
  - ‘나를 두렵게 하는 자들’로 확대 해석
  - ‘자녀들’로 명시
  rationale: 히브리어의 모호성과 시적 긴장을 지우지 않기 위해, POB가 표시한 lexical tension을 본문 속에서 그대로 유지했습니다.
  doctrine_reference: 시편·예레미야애가의 탄식 수사와 정서적 병렬
