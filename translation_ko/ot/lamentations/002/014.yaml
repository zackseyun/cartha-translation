review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘당신의 포로 됨을 회복하게 하지 않았습니다’는 히브리어 관용구 לְהָשִׁיב שְׁבִיתֵךְ의 회복 의미를 한국어에서 역전시킬 수 있고, ‘하게 하지 않았습니다’라는 사역 구문도 원문의 목적 관계를 부정확하게 만듭니다. 본문은 죄악을 드러내지 않았기에 예루살렘의 처지/형편이 회복되지 못했다는 뜻입니다. ‘미혹’과 ‘신탁’은 각각 מַדּוּחִים와 מַשְׂאוֹת에 적절합니다.
  naturalness: 개정문은 현대 표준 한국어 합쇼체를 유지하면서, 목적을 나타내는 ‘~하도록’ 구문으로 원문의 논리 관계를 자연스럽게 드러냅니다. ‘당신의 형편을 회복시키다’는 포로·유배 배경을 지닌 히브리어 관용구를 자연스럽게 옮기며, 그 문자적 가능성은 각주에서 보존합니다.
  terminology: ‘예언자들’, ‘죄악’, ‘신탁’은 적절합니다. מַדּוּחִים의 ‘미혹’은 사람을 그릇된 길로 이끄는 내용을 간결하게 전달합니다. 각주 b는 ‘신탁’ 자체가 전통적 의미라는 기존 설명 대신, מַשְׂאוֹת의 문자적 대안인 ‘짐’을 명시해야 합니다.
  issues:
  - severity: high
    issue: ‘당신의 포로 됨을 회복하게 하지 않았습니다’
    rationale: ‘포로 됨’을 ‘회복’한다고 하면 포로 상태 자체를 다시 세운다는 뜻으로 읽힐 수 있습니다. 또한 원문은 예언자들이 죄악을 드러내어 회복을 이루도록 하지 않았다는 목적절이지, 별도의 사역 행위를 막았다는 뜻이 아닙니다.
  - severity: medium
    issue: 각주 a의 위치와 내용
    rationale: 각주 a는 לְהָשִׁיב שְׁבִיתֵךְ 관용구를 설명하지만 초안에서는 절 끝의 두 표지 중 하나로만 제시되어 연결 대상이 불명확합니다. 해당 표현 바로 뒤에 붙이고, ‘포로 상태’ 및 ‘포로들’이라는 가능한 문자적 이해를 자연스러운 한국어로 제시해야 합니다.
  - severity: medium
    issue: 각주 b의 설명
    rationale: מַשְׂאוֹת의 어휘 대안은 문자적 ‘짐’(burdens)입니다. 기존 설명은 ‘신탁’을 전통적 의미라고 하여 영어 POB 감사 기록 및 어휘상의 대안 관계를 불명확하게 합니다.
