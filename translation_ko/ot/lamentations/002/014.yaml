id: LAM.2.14
reference: Lamentations 2:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נְבִיאַ֗יִ/ךְ חָ֤זוּ לָ/ךְ֙ שָׁ֣וְא וְ/תָפֵ֔ל וְ/לֹֽא גִלּ֥וּ עַל עֲוֺנֵ֖/ךְ לְ/הָשִׁ֣יב שבית/ך וַ/יֶּ֣חֱזוּ לָ֔/ךְ מַשְׂא֥וֹת שָׁ֖וְא וּ/מַדּוּחִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/014.yaml
  text: Your prophets saw for you falsehood and folly[a], and they did not uncover your iniquity to restore your fortunes; instead[b], they saw for you false oracles and delusions.
  footnotes:
  - marker: a
    text: Or, more literally, “to turn back your captivity” or “to restore your captives.” The Hebrew idiom often refers to restoring a people from calamity or exile.
    reason: alternative_reading
  - marker: b
    text: Or “burdens,” a traditional rendering of the prophetic term translated here as “oracles.”
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 예언자들은 당신을 위해 거짓과 어리석음을 보았고, 당신의 형편을 회복시키도록 당신의 죄악을 드러내지 않았습니다.[a] 오히려 그들은 당신을 위해 거짓 신탁[b]과 미혹을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 더 문자적으로 “당신의 포로 상태를 되돌리다” 또는 “당신의 포로들을 돌아오게 하다”로 이해될 수 있습니다. 이 표현은 재난이나 유배에서의 회복을 가리키기도 합니다.
    reason: alternative_reading
  - marker: b
    text: ‘신탁’으로 옮긴 히브리어 מַשְׂאוֹת는 더 문자적으로 ‘짐’으로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאַיִךְ
  english_pob_choice: your prophets
  chosen_korean: 당신의 예언자들은
  alternatives_korean:
  - 당신의 선지자들은
  - 당신의 예언자들
  lexicon: WLC
  rationale: 여기서는 2인칭 여성 단수 어미가 붙은 복수형으로, 예루살렘을 향한 직접 호칭이므로 ‘당신의 예언자들’이 자연스럽고 원문의 소속/대상 관계를 드러냅니다.
- source_word: שָׁוְא וְתָפֵל
  english_pob_choice: falsehood and folly
  chosen_korean: 거짓과 어리석음
  alternatives_korean:
  - 허무와 어리석음
  - 거짓과 헛됨
  - 거짓과 무미건조함
  lexicon: HALOT
  rationale: 두 어휘가 병렬로 예언의 내용이 공허하고 잘못되었음을 강조하므로, ‘거짓과 어리석음’이 현대 한국어에서 가장 분명하게 그 대조를 살립니다.
- source_word: עַל עֲוֺנֵךְ לְהָשִׁיב שביתך
  english_pob_choice: did not uncover your iniquity to restore your fortunes
  chosen_korean: 당신의 죄악을 드러내어 당신의 포로 됨을 회복하게 하지 않았습니다
  alternatives_korean:
  - 당신의 죄악을 드러내어 당신의 운명을 돌이키게 하지 않았습니다
  - 당신의 죄악을 드러내어 당신의 포로 됨을 되돌리게 하지 않았습니다
  - 당신의 죄악을 폭로하여 당신의 포로들을 돌아오게 하지 않았습니다
  lexicon: HALOT
  rationale: עָוֹן은 단순한 ‘죄’보다 책임과 죄책이 있는 ‘죄악’이 적절하며, לְהָשִׁיב שְׁבִיתֵךְ는 문자적으로는 포로/포로 됨의 회복을 가리키므로 본문 의미를 살려 ‘포로 됨을 회복하게’로 옮겼습니다.
- source_word: מַשְׂאוֹת שָׁוְא וּמַדּוּחִים
  english_pob_choice: false oracles and delusions
  chosen_korean: 거짓 신탁과 미혹
  alternatives_korean:
  - 거짓 신탁과 속임수
  - 거짓 예언과 미혹
  - 거짓 신탁과 잘못된 환상
  lexicon: HALOT
  rationale: מַשְׂאוֹת는 예언적 ‘신탁’으로 옮기는 것이 POB의 ‘oracles’와 대응되며, מַדּוּחִים는 사람을 그릇된 길로 끌어가는 ‘미혹’이 원뜻을 간명하게 드러냅니다.
theological_decisions:
- issue: לְהָשִׁיב שְׁבִיתֵךְ의 한국어 처리
  chosen_reading: ‘포로 됨을 회복하다’로 옮기고, literal하게 ‘포로’ 자체를 복수화하지 않았습니다.
  alternative_readings:
  - ‘포로들을 돌려보내다’
  - ‘포로 된 상태를 회복하다’
  - ‘포로 생활을 끝내다’
  rationale: 이 관용구는 포로 귀환만이 아니라 재난과 멸망 상태의 전환까지 포함할 수 있으므로, 여기서는 문맥에 맞는 회복의 뜻을 살리되 ‘포로 됨’으로 문자적 배경을 남겼습니다.
  doctrine_reference: 번역 원칙 §3, §6
- issue: 예언적 문체의 평가성 유지
  chosen_reading: 예언자들의 비전이 단지 틀린 것이 아니라, 공동체를 회개와 회복으로 이끌지 못한 책임 있는 실패로 제시합니다.
  alternative_readings:
  - 단순히 잘못 본 것
  - 도덕적 비난을 약화시키는 중립적 서술
  rationale: 본문은 환상의 오류와 더불어 죄악을 드러내지 않은 책임을 함께 비판하므로, 한국어에서도 그 신학적 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 예레미야애가 2:14의 예언자 비판 맥락
