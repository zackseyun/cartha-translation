id: LAM.2.8
reference: Lamentations 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חָשַׁ֨ב יְהוָ֤ה לְ/הַשְׁחִית֙ חוֹמַ֣ת בַּת צִיּ֔וֹן נָ֣טָה קָ֔ו לֹא הֵשִׁ֥יב יָד֖/וֹ מִ/בַּלֵּ֑עַ וַ/יַּֽאֲבֶל חֵ֥ל וְ/חוֹמָ֖ה יַחְדָּ֥ו אֻמְלָֽלוּ׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/008.yaml
  text: Yahweh determined to destroy the wall of daughter Zion[a]; he stretched out a measuring line; he did not hold back his hand from swallowing up, and he made rampart and wall mourn[b]; together they languish.
  footnotes:
  - marker: a
    text: Or 'the wall of the daughter of Zion.' The Hebrew personifies Zion/Jerusalem as a daughter.
    reason: lexical_alternative
  - marker: b
    text: Or 'he did not turn back his hand from consuming.' The Hebrew literally says 'from swallowing up,' a vivid image of total destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 딸 시온의 성벽을 무너뜨리기로 정하셨습니다[a]. 그는 측량줄을 드리우셨고, 삼키는 데서 손을 거두지 않으셨으며, 성루와 성벽을 함께 애곡하게 하셨습니다. 그것들이 함께 쇠약해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시온의 딸의 성벽’입니다. 히브리어는 시온/예루살렘을 딸로 의인화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 יְהוָה는 고유한 하나님의 이름이므로, POB의 원칙에 따라 관용적 대치어 ‘주’가 아니라 음역 ‘야훼’로 옮겼습니다.
- source_word: חָשַׁב
  english_pob_choice: determined
  chosen_korean: 정하셨습니다
  alternatives_korean:
  - 결정하셨습니다
  - 계획하셨습니다
  - 의도하셨습니다
  lexicon: HALOT
  rationale: 여기서는 여호와의 심판에 대한 확정된 의도를 나타내므로, 현대 한국어에서 자연스러운 ‘정하다’가 가장 직접적입니다.
- source_word: חוֹמַת בַּת צִיּוֹן
  english_pob_choice: the wall of daughter Zion
  chosen_korean: 딸 시온의 성벽
  alternatives_korean:
  - 시온의 딸의 성벽
  - 딸 시온의 벽
  lexicon: HALOT
  rationale: ‘딸 시온’이라는 인격화된 표현을 유지하되, 시를 살리면서도 대상이 분명하도록 ‘성벽’으로 옮겼습니다.
- source_word: נָטָה קָו
  english_pob_choice: stretched out a measuring line
  chosen_korean: 측량줄을 드리우셨고
  alternatives_korean:
  - 줄을 펴셨고
  - 기준줄을 늘이셨고
  lexicon: HALOT
  rationale: 이 관용구는 파괴를 위한 측량 이미지를 담으므로, ‘줄’보다 구체적인 ‘측량줄’을 쓰고 동작은 예언적·시적 어감의 ‘드리우셨고’로 살렸습니다.
- source_word: מִבַּלֵּעַ
  english_pob_choice: from swallowing up
  chosen_korean: 삼키는 데서
  alternatives_korean:
  - 삼키는 일에서
  - 집어삼키는 데서
  lexicon: HALOT
  rationale: POB가 유지한 ‘swallowing up’의 생생한 파괴 이미지를 살리기 위해, 의미를 완화하지 않고 ‘삼키는 데서’로 옮겼습니다.
- source_word: חֵל וְחוֹמָה
  english_pob_choice: rampart and wall
  chosen_korean: 성루와 성벽
  alternatives_korean:
  - 방벽과 성벽
  - 토루와 성벽
  lexicon: HALOT
  rationale: 두 방어 구조물의 병렬을 살리되, 한국어 시적 문맥에서 자연스러운 군사·도시 방어 용어로 정리했습니다.
- source_word: אֻמְלָלוּ
  english_pob_choice: they languish
  chosen_korean: 쇠약해졌습니다
  alternatives_korean:
  - 시들었습니다
  - 애처로워졌습니다
  - 기운을 잃었습니다
  lexicon: HALOT
  rationale: 의인화된 성루와 성벽의 상태를 나타내므로, ‘languish’의 약화·쇠잔의 뜻을 살리는 ‘쇠약해졌습니다’가 적절합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה를 어떻게 옮길지
  chosen_reading: ‘야훼’로 음역하여 고유명사를 보존했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 신적 칭호가 아니라 언약의 이름을 직접 사용하므로, 대치어보다 고유명을 드러내는 번역이 원문 이해에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
