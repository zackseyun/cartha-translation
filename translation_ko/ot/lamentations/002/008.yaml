source:
  edition: WLC
  text: חָשַׁ֨ב יְהוָ֤ה לְ/הַשְׁחִית֙ חוֹמַ֣ת בַּת צִיּ֔וֹן נָ֣טָה קָ֔ו לֹא הֵשִׁ֥יב יָד֖/וֹ מִ/בַּלֵּ֑עַ וַ/יַּֽאֲבֶל חֵ֥ל וְ/חוֹמָ֖ה יַחְדָּ֥ו אֻמְלָֽלוּ׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/008.yaml
  text: Yahweh determined to destroy the wall of daughter Zion[a]; he stretched out a measuring line; he did not hold back his hand from swallowing up, and he made rampart and wall mourn[b]; together they languish.
  footnotes:
  - marker: a
    text: Or 'the wall of the daughter of Zion.' The Hebrew personifies Zion/Jerusalem as a daughter.
    reason: lexical_alternative
  - marker: b
    text: Or 'he did not turn back his hand from consuming.' The Hebrew literally says 'from swallowing up,' a vivid image of total destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 딸 시온의 성벽을 무너뜨리기로 정하셨습니다[a]. 그는 측량줄을 드리우셨고, 삼키는 데서 그의 손을 거두지 않으셨으며[b], 방벽과 성벽이 애곡하게 하셨습니다. 둘은 함께 쇠약해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시온의 딸의 성벽’입니다. 히브리어는 시온, 곧 예루살렘을 딸로 의인화합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘삼켜 버리는 일에서 그의 손을 돌이키지 않으셨으며’입니다. 히브리어는 ‘삼키다’를 사용하여 철저한 파괴를 생생하게 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 יְהוָה는 고유한 하나님의 이름이므로, POB의 원칙에 따라 관용적 대치어 ‘주’가 아니라 음역 ‘야훼’로 옮겼습니다.
- source_word: חָשַׁב
  english_pob_choice: determined
  chosen_korean: 정하셨습니다
  alternatives_korean:
