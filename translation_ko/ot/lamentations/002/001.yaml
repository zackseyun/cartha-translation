id: LAM.2.1
reference: Lamentations 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵיכָה֩ יָעִ֨יב בְּ/אַפּ֤/וֹ אֲדֹנָ/י֙ אֶת בַּת צִיּ֔וֹן הִשְׁלִ֤יךְ מִ/שָּׁמַ֨יִם֙ אֶ֔רֶץ תִּפְאֶ֖רֶת יִשְׂרָאֵ֑ל וְ/לֹא זָכַ֥ר הֲדֹם רַגְלָ֖י/ו בְּ/י֥וֹם אַפּֽ/וֹ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/001.yaml
  text: How the Lord in his anger has clouded over daughter Zion! He has cast from heaven to earth the beauty of Israel[c][b][a], and he did not remember his footstool in the day of his anger.
  footnotes:
  - marker: a
    text: Or 'has darkened' or 'has covered with a cloud.' The Hebrew verb evokes the imagery of clouding over.
    reason: lexical_alternative
  - marker: b
    text: '''His footstool'' may refer to Zion, the temple, or the ark as the place associated with God''s earthly presence.'
    reason: alternative_reading
  - marker: c
    text: Or 'the glory of Israel' or 'the splendor of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 주께서 진노하셔서 어찌 이토록 시온의 딸을 구름으로 덮으셨습니까![a] 주께서는 이스라엘의 아름다움[c]을 하늘에서 땅으로 내던지셨고, 진노하신 날에 그분의 발판[b]을 기억하지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어둡게 하셨다’ 또는 ‘구름으로 덮으셨다’로 옮길 수 있습니다. 히브리어 동사는 구름이 드리워지는 이미지를 불러일으킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그분의 발판’은 시온, 성전, 또는 하나님의 지상 임재와 연결된 언약궤를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘이스라엘의 영광’ 또는 ‘이스라엘의 영화’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  english_pob_choice: How
  chosen_korean: 어찌 그리
  alternatives_korean:
  - 어찌
  - 어찌 그리도
  - 아, 어찌
  lexicon: HALOT
  rationale: 탄식의 서두를 질문문이 아닌 감탄형으로 살리되, 현대 한국어에서 시편/예레미야적 애가의 정서를 자연스럽게 드러내기 위해 ‘어찌 그리’를 택했습니다.
- source_word: יָעִיב
  english_pob_choice: has clouded over
  chosen_korean: 어둡게 하셨습니까
  alternatives_korean:
  - 구름으로 덮으셨습니까
  - 그늘지게 하셨습니까
  - 어둡게 하셨습니까
  lexicon: HALOT
  rationale: 이 동사는 구름으로 덮어 가리우는 이미지를 띠므로, 직역적이면서도 한국어로는 ‘어둡게 하다’가 시적·자연스러운 대응이 됩니다.
- source_word: בַּת צִיּוֹן
  english_pob_choice: daughter Zion
  chosen_korean: 시온의 딸
  alternatives_korean:
  - 딸 시온
  - 시온 딸
  - 시온의 처녀
  lexicon: HALOT
  rationale: 의인화된 도시/백성 표현을 한국어에서도 관계격으로 보존하여, ‘시온의 딸’이라는 시적 결합을 유지했습니다.
- source_word: תִּפְאֶרֶת יִשְׂרָאֵל
  english_pob_choice: the beauty of Israel
  chosen_korean: 이스라엘의 아름다움
  alternatives_korean:
  - 이스라엘의 영광
  - 이스라엘의 영화
  - 이스라엘의 아름다움
  lexicon: HALOT
  rationale: POB가 ‘beauty’를 택한 점을 따라, תפארת의 미적·명예적 뉘앙스를 한국어에서 가장 넓게 담을 수 있는 ‘아름다움’을 사용했습니다.
- source_word: הֲדֹם רַגְלָיו
  english_pob_choice: his footstool
  chosen_korean: 자신의 발판
  alternatives_korean:
  - 그의 발판
  - 발등상
  - 발판
  lexicon: HALOT
  rationale: 문맥상 하나님의 임재와 연결되는 비유적 표현이므로, 대상을 특정하지 않고 ‘발판’으로 옮겨 이미지의 모호성을 보존했습니다.
theological_decisions:
- issue: ‘his footstool’의 지시 대상을 본문에서 특정할지 여부
  chosen_reading: 본문에는 ‘자신의 발판’을 유지하고, 성전·시온·언약궤 중 하나로 단정하지 않았습니다.
  alternative_readings:
  - 성전
  - 시온/예루살렘
  - 언약궤
  rationale: 히브리어 표현은 상징적이며 복수의 가능한 지시 대상을 열어 둡니다. 본문이 결론을 강요하지 않으므로, 번역은 이미지를 보존하고 해석은 주석에 맡기는 것이 더 충실합니다.
  doctrine_reference: 해석적 긴장 보존
- issue: 아애문 서두의 정서적 톤
  chosen_reading: 감탄형 탄식으로 시작해 비탄과 놀람을 함께 드러냈습니다.
  alternative_readings:
  - 직설적 서술문
  - 단순 감탄문
  rationale: אֵיכָה는 정보 질문이 아니라 탄식의 외침이므로, 한국어에서도 애가 장르의 정서를 유지하는 방향이 본문 의도에 가장 가깝습니다.
  doctrine_reference: 문학 장르 보존
