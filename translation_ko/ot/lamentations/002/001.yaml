  source_fidelity: 본문의 핵심 의미와 순서는 대체로 충실합니다. 다만 יָעִיב의 구름 이미지가 본문에서는 단순히 ‘어둡게’로 약화되어 있고, 각주 표지가 관련 어구가 아닌 문장 끝에 한꺼번에 놓여 있어 각주의 대응 관계가 불명확합니다.
  naturalness: ‘어찌 그리 … 하셨습니까!’는 애가의 수사적 탄식으로 현대 합쇼체에서 허용됩니다. 그러나 ‘주께서’ 뒤에 ‘그가’로 받는 것은 높임과 문체의 일관성을 약화시키므로 ‘주께서는’으로 통일하는 것이 자연스럽습니다. ‘그분의 발판’도 지시가 더 명료합니다.
  terminology: ‘시온의 딸’, ‘이스라엘의 아름다움’, ‘발판’은 원문의 의인화·시적 표현 및 지시 대상의 모호성을 적절히 보존합니다. יָעִיב에는 ‘구름으로 덮으셨습니까’를 채택하여 원문의 구름 이미지와 영어 POB의 선택을 반영합니다.
