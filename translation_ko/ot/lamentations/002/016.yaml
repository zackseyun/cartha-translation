id: LAM.2.16
reference: Lamentations 2:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּצ֨וּ עָלַ֤יִ/ךְ פִּי/הֶם֙ כָּל א֣וֹיְבַ֔יִ/ךְ שָֽׁרְקוּ֙ וַ/יַּֽחַרְקוּ שֵׁ֔ן אָמְר֖וּ בִּלָּ֑עְנוּ אַ֣ךְ זֶ֥ה הַ/יּ֛וֹם שֶׁ/קִּוִּינֻ֖/הוּ מָצָ֥אנוּ רָאִֽינוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/016.yaml
  text: All your enemies open their mouths against you[a]; they hiss and gnash their teeth. They say, “We have swallowed you up! Surely this is the day we hoped for; we have found it[b], we have seen it.”
  footnotes:
  - marker: a
    text: Hebrew 'hiss'; the verb can also be rendered 'whistle,' but here it expresses derision from enemies.
    reason: lexical_alternative
  - marker: b
    text: Or 'We have devoured her.' Hebrew 'swallowed her up' is a vivid metaphor for total destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 모든 원수들이 당신을 향해 입을 벌리고, 혀를 차며 이를 갈았습니다. 그들이 말합니다. “우리가 당신을 삼켜 버렸다! 참으로 이것은 우리가 바라던 날이다. 우리가 그것을 찾아냈고, 우리가 그것을 보았다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘휘파람을 불다’로도 옮길 수 있지만, 여기서는 원수들의 조롱을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리가 그녀를 삼켜 버렸다.’ 히브리어 ‘삼켜 버렸다’는 완전한 파괴를 생생하게 보여 주는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצ֨וּ עָלַ֤יִךְ פִּי־הֶם
  english_pob_choice: open their mouths against you
  chosen_korean: 당신을 향해 입을 벌리고
  alternatives_korean:
  - 당신에게 입을 벌리고
  - 당신을 향해 입을 크게 벌리고
  lexicon: HALOT
  rationale: פָּצוּ는 입을 크게 여는 동작이고, עָלַיִךְ는 적대적 ‘~을 향해/~에 대하여’의 뜻이므로, 한국어에서는 간결하게 ‘당신을 향해 입을 벌리고’로 옮겨 적대성을 살렸습니다.
- source_word: שָׁרְקוּ
  english_pob_choice: hiss
  chosen_korean: 혀를 차며
  alternatives_korean:
  - 휘파람을 불며
  - 조롱하며
  lexicon: HALOT
  rationale: 이 동사는 조롱과 비웃음의 표시로서의 ‘쉿/휘익’ 소리를 가리킬 수 있어, 한국어에서는 자연스럽게 경멸을 드러내는 ‘혀를 차며’로 풀어 옮겼습니다.
- source_word: וַיַּחַרְקוּ שֵׁן
  english_pob_choice: gnash their teeth
  chosen_korean: 이를 갈았습니다
  alternatives_korean:
  - 이를 부득부득 갈았습니다
  - 이를 갈며
  lexicon: HALOT
  rationale: 이는 분노와 적대의 관용적 표현이므로, 표준적이고 힘 있는 표현인 ‘이를 갈다’를 사용했습니다.
- source_word: בִּלָּעְנוּ
  english_pob_choice: We have swallowed you up
  chosen_korean: 우리가 당신을 삼켜 버렸다
  alternatives_korean:
  - 우리가 당신을 집어삼켰다
  - 우리가 당신을 먹어 치웠다
  lexicon: HALOT
  rationale: בּלע의 핵심은 ‘삼키다/집어삼키다’이며 파괴의 은유를 유지해야 하므로, 직역성을 살린 ‘삼켜 버렸다’로 번역했습니다.
- source_word: מָצָאנוּ רָאִינוּ
  english_pob_choice: we have found it, we have seen it
  chosen_korean: 우리가 그것을 찾아냈고, 우리가 그것을 보았다
  alternatives_korean:
  - 우리가 그것을 찾았고, 우리가 그것을 보았다
  - 우리가 그것을 발견했고, 우리가 그것을 보았다
  lexicon: HALOT
  rationale: 두 동사는 승리의 확신을 강조하는 병렬 구조이므로, 동일한 목적어 ‘그것’을 보존해 반복의 힘을 살렸습니다.
theological_decisions:
- issue: 시온/예루살렘을 향한 원수들의 조롱과 파괴의 은유를 어떻게 보존할지
  chosen_reading: ‘삼켜 버렸다’와 ‘찾아냈다/보았다’의 반복을 유지해, 단순한 승전 선언이 아니라 완전한 멸망을 확신하는 조롱으로 읽히게 했습니다.
  alternative_readings:
  - ‘먹어 치웠다’처럼 더 구어적으로 풀기
  - ‘멸하였다’로 의미만 요약하기
  rationale: 본문은 감정적 조롱과 파괴의 은유가 핵심이므로, 의미를 약화시키는 요약보다 원문의 이미지와 반복을 보존하는 것이 더 충실합니다.
  doctrine_reference: 시적 탄식문맥의 의미 보존 원칙
