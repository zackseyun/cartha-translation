source:
  edition: WLC
  text: וַ/יַּחְמֹ֤ס כַּ/גַּן֙ שֻׂכּ֔/וֹ שִׁחֵ֖ת מוֹעֲד֑/וֹ שִׁכַּ֨ח יְהוָ֤ה בְּ/צִיּוֹן֙ מוֹעֵ֣ד וְ/שַׁבָּ֔ת וַ/יִּנְאַ֥ץ בְּ/זַֽעַם אַפּ֖/וֹ מֶ֥לֶךְ וְ/כֹהֵֽן׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/006.yaml
  text: He has laid waste his shelter like a garden[a]; he has destroyed his appointed meeting place. Yahweh has caused appointed feast and Sabbath to be forgotten in Zion[c][b], and in the indignation of his anger he has spurned king and priest.
  footnotes:
  - marker: a
    text: Or 'his booth' or 'his tabernacle.' The Hebrew term can denote a shelter or booth; the exact image here is debated.
    reason: lexical_alternative
  - marker: b
    text: Or 'his appointed place of assembly'; possibly 'his tent of meeting.' The Hebrew word is related to the term later rendered 'appointed feast.'
    reason: lexical_alternative
  - marker: c
    text: Or 'appointed time' or 'festival.' In this context, paired with 'Sabbath,' the word likely refers to the set feast times.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 정원처럼 그의 초막[a]을 황폐하게 하셨고, 그의 정해진 모임의 장소[b]를 파괴하셨습니다. 야훼께서는 시온에서 절기[c]와 안식일을 잊히게 하셨으며, 그의 맹렬한 분노 가운데 왕과 제사장을 멸시하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 장막’ 또는 ‘그의 피난처’로 옮길 수 있습니다. 히브리어는 초막, 보호처, 덮개를 가리킬 수 있으며, 여기의 정확한 이미지는 논란이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 정해진 장소’ 또는 ‘그의 회막’으로 옮길 수 있습니다. 이 말은 뒤의 ‘절기’와 같은 어근에 속하지만, 여기서는 파괴의 대상이므로 모임의 장소를 가리키는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘정한 때’ 또는 ‘축제’로 옮길 수 있습니다. 여기서는 안식일과 짝을 이루므로 정해진 절기를 가리키는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹס
  english_pob_choice: has laid waste
  chosen_korean: 황폐하게 하셨고
  alternatives_korean:
  - 유린하셨고
  - 폐허로 만드셨고
  - 짓밟아 버리셨고
  lexicon: HALOT
  rationale: 문맥상 단순한 훼손이 아니라 파괴적 황폐를 뜻하므로, 자연스러운 현대 한국어로 ‘황폐하게 하셨다’가 힘을 살립니다.
- source_word: שֻׂכּוֹ
  english_pob_choice: his shelter
  chosen_korean: 자신의 초막
  alternatives_korean:
  - 자신의 피난처
  - 자신의 장막
  - 자신의 부스
  lexicon: HALOT
  rationale: 히브리어는 초막/덮개/피난처의 폭이 있어, 시적 이미지와 후속 각주를 살리기 위해 가장 기본적인 ‘초막’을 채택했습니다.
- source_word: מוֹעֲדוֹ
  english_pob_choice: his appointed meeting place
  chosen_korean: 자기의 정해진 모임
  alternatives_korean:
  - 자기의 지정된 회막
  - 자기의 정해진 집회 장소
  - 자기의 회막
  lexicon: HALOT
  rationale: 뒤의 ‘절기들’과 같은 어근 계열이지만, 여기서는 파괴의 대상이 되는 장소적 의미가 자연스러워 ‘정해진 모임’으로 옮겼습니다.
- source_word: מוֹעֵד
  english_pob_choice: appointed feast
  chosen_korean: 정하신 절기들
  alternatives_korean:
  - 정한 때들
  - 절기
  - 모임
  lexicon: HALOT
  rationale: 안식일과 병렬되고 복수 개념이므로 시간/절기 의미가 우세합니다. 한국어에서는 예배·절기 문맥을 살려 ‘정하신 절기들’로 번역했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유 신명(神名)을 보존하기 위해 전통적 대치어 대신 음역형 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘진노하는 분노’의 어조
  chosen_reading: 진노하시는 분노 가운데
  alternative_readings:
  - 분노의 격렬함 가운데
  - 그의 맹렬한 분노 가운데
  rationale: ‘בְּזַעַם אַפּוֹ’의 중첩된 분노 표현을 약화하지 않기 위해, 관용적이면서도 중복 강도를 드러내는 표현을 택했습니다.
  doctrine_reference: 시적 심판 언어 보존 원칙
