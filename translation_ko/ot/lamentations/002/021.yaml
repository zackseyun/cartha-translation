  naturalness: ‘거리의 땅에’는 현대 표준 한국어에서 부자연스럽고 의미 관계도 모호합니다. ‘거리에서 땅에 누워 있고’는 공적 도시 공간과 땅 위에 쓰러진 상태를 자연스럽게 나타냅니다. ‘도살하셨으나’는 원문의 강한 동사와 이어지는 ‘아끼지 않으셨습니다’를 명료하게 연결합니다.
