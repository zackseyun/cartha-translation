  text: שָׁכְב֨וּ לָ/אָ֤רֶץ חוּצוֹת֙ נַ֣עַר וְ/זָקֵ֔ן בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י נָפְל֣וּ בֶ/חָ֑רֶב הָרַ֨גְתָּ֙ בְּ/י֣וֹם אַפֶּ֔/ךָ טָבַ֖חְתָּ לֹ֥א חָמָֽלְתָּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/021.yaml
  text: Young and old lie on the ground in the streets[a]; my virgins and my young men have fallen by the sword. You killed them in the day of your anger[b]; you slaughtered without pity.
  footnotes:
  - marker: a
    text: Or 'my maidens'; Hebrew בְּתוּלֹתַי more literally means 'my virgins.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you did not spare.'
    reason: lexical_alternative
translation:
  language: ko
  text: 거리에서 젊은이와 늙은이가 땅에 누워 있고, 내 처녀들[a]과 내 청년들은 칼에 쓰러졌습니다. 당신께서 진노하신 날에 그들을 죽이시고, 도살하셨으나 아끼지 않으셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 동녀들’. 히브리어 בְּתוּלֹתַי는 더 문자적으로는 ‘내 처녀들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불쌍히 여기지 않으셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְבוּ לָאָרֶץ חוּצוֹת
  english_pob_choice: lie on the ground in the streets
  chosen_korean: 거리의 땅에 눕고
  alternatives_korean:
