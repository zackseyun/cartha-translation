  - 길거리 땅에 눕고
  - 거리에 누워 있고
  lexicon: HALOT
  rationale: שׁכב의 결과 상태를 자연스럽게 살리면서, חוּצוֹת의 공개적 도시 공간을 ‘거리’로 옮겨 공적 비탄의 장면을 분명히 드러냈습니다.
- source_word: נַעַר וְזָקֵן
  english_pob_choice: Young and old
  chosen_korean: 젊은이와 늙은이가
  alternatives_korean:
  - 어린이와 노인이
  - 청년과 노인이
  - 젊은 자와 늙은 자가
  lexicon: HALOT
  rationale: 대구적 총칭을 한국어의 자연스러운 연령 대립으로 옮겨, 단순한 개별 인물보다 ‘모든 연령층’이라는 뜻을 살렸습니다.
- source_word: בְּתוּלֹתַי
  english_pob_choice: my virgins
  chosen_korean: 내 처녀들
  alternatives_korean:
  - 내 동녀들
  - 내 젊은 여자들
  - 내 미혼 여성들
  lexicon: HALOT
  rationale: בְּתוּלָה의 직접적 의미를 살려 ‘처녀들’로 옮겼고, 소유격 ‘내’를 유지해 시온/예루살렘의 탄식 화자를 반영했습니다.
- source_word: וּבַחוּרַי
  english_pob_choice: my young men
  chosen_korean: 내 청년들
  alternatives_korean:
  - 내 젊은 남자들
  - 내 총각들
  - 내 젊은이들
  lexicon: HALOT
  rationale: בחור를 이 문맥의 연령·생명력 중심 의미에 따라 ‘청년들’로 옮겨, ‘선택된 사람들’ 같은 오해를 피했습니다.
- source_word: לֹא חָמָלְתָּ
  english_pob_choice: without pity
  chosen_korean: 불쌍히 여기지 않으셨습니다
  alternatives_korean:
  - 긍휼히 여기지 않으셨습니다
  - 아끼지 않으셨습니다
  - 가엾게 여기지 않으셨습니다
  lexicon: HALOT
  rationale: 문맥상 ‘동정/긍휼을 베풀지 않음’의 뜻을 한국어 관용으로 자연스럽게 나타냈으며, POB의 대안인 ‘did not spare’와도 대응되게 했습니다.
theological_decisions:
- issue: 하나님을 직접적 가해자로 부르는 탄식의 수위
  chosen_reading: ‘당신께서… 그들을 죽이시고, 불쌍히 여기지 않으셨습니다’로 직접적인 2인칭 책임 진술을 유지했습니다.
  alternative_readings:
  - 수동태로 완화하기
  - ‘허락하셨습니다’처럼 간접화하기
  rationale: 히브리어가 하나님께 직접 말을 건네며 폭력의 원인을 정면으로 고백하므로, 신학적 긴장을 완화하지 않고 그대로 드러냈습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
