  source_fidelity: 개정이 필요합니다. 초안은 원수/적의 비교, 활, 오른손, 죽임, 딸 시온, 불 같은 분노를 대체로 보존합니다. 그러나 히브리어의 בְּאֹהֶל בַּת־צִיּוֹן(‘딸 시온의 장막 안에서’)은 죽임의 장소와 연결되어야 하는데, 초안의 문장 분리는 이를 뒤 절의 ‘분노를 쏟아부음’에만 연결되게 합니다. 또한 מַחֲמַדֵּי עָיִן은 이 문맥에서 사람을 가리키는 번역이 자연스럽고 영어 감사본의 선택과도 부합합니다.
  naturalness: ‘눈에 기쁘던 모든 것’은 현대 한국어에서 부자연스럽고, 바로 뒤의 ‘죽이셨습니다’와 결합될 때 사람인지 사물인지가 불필요하게 어색해집니다. ‘눈에 보기에 사랑스럽고 귀한 모든 이’로 하되 각주에서 원문의 더 넓은 어휘 범위를 밝혀 주는 편이 자연스럽습니다. 한 절 안에서 하나님을 높이는 서술어와 비높임 서술어가 섞인 점도 합쇼체 성경 문체에 맞게 통일했습니다.
