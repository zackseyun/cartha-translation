base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/004.yaml
  text: He bent his bow like an enemy; his right hand stood ready like a foe[a], and he killed all who were pleasing to the eye in the tent of daughter Zion; he poured out his wrath like fire.
  footnotes:
  - marker: a
    text: Or 'all that was delightful to the eye.' The Hebrew expression may refer more broadly to what was beautiful or precious, though here it likely points to beloved people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 원수처럼 자신의 활을 당기고, 적처럼 자기 오른손을 세워 두었으며, 눈에 기쁘던 모든 것을 죽이셨습니다. 딸 시온의 장막에 불처럼 자신의 분노를 쏟아부으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘눈에 기쁘던 것들’은 문자적으로는 사물도 가리킬 수 있지만, 이 문맥에서는 사랑받던 사람들을 더 넓게 포함할 가능성이 큽니다.
    reason: lexical_alternative
