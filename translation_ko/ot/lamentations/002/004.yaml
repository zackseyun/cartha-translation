theological_decisions:
- issue: 하나님께서 원수처럼 행하신다는 표현
  chosen_reading: 본문의 비교를 그대로 살려, 야훼의 심판 행위를 ‘원수처럼’이라고 직설적으로 옮겼습니다.
  alternative_readings:
