id: LAM.2.18
reference: Lamentations 2:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צָעַ֥ק לִבָּ֖/ם אֶל אֲדֹנָ֑/י חוֹמַ֣ת בַּת צִ֠יּוֹן הוֹרִ֨ידִי כַ/נַּ֤חַל דִּמְעָה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אַֽל תִּתְּנִ֤י פוּגַת֙ לָ֔/ךְ אַל תִּדֹּ֖ם בַּת עֵינֵֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/018.yaml
  text: 'Their heart cried out to the Lord[a], O wall of daughter Zion: let tears run down like a stream day and night; give yourself no relief[c][b]; let not the apple of your eye rest.'
  footnotes:
  - marker: a
    text: Or 'their hearts cried out to the Lord.' The Hebrew has singular 'heart' with a plural suffix, likely a collective expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'let tears flow like a wadi/torrent.' The Hebrew נחל can refer to a streambed or torrent valley.
    reason: lexical_alternative
  - marker: c
    text: Literally 'let not the daughter of your eye be still,' an idiom for the pupil/eye and thus for unceasing weeping.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 마음이 주님께 부르짖었습니다[a]. 딸 시온의 성벽이여, 눈물을 시내처럼 밤낮으로 흘리십시오[b]. 스스로에게 조금도 쉼을 주지 마십시오. 당신의 눈동자가 잠잠하지 않게 하십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 마음들’로 옮길 수 있습니다. 히브리어는 단수 ‘마음’에 복수 접미사가 붙은 집합적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘눈물을 와디/급류처럼 흘리십시오’로 옮길 수 있습니다. נחל은 시내, 마른 하천 바닥, 또는 급류가 흐르는 골짜기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘당신의 눈의 딸이 잠잠하지 않게 하라’입니다. 이는 눈동자 또는 동공을 가리키는 관용구이며, 끊이지 않는 눈물을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָעַק לִבָּם
  english_pob_choice: Their heart cried out
  chosen_korean: 그들의 마음이 주님께 부르짖습니다
  alternatives_korean:
  - 그들의 마음이 주님께 외칩니다
  - 그들의 마음이 주님께 울부짖습니다
  lexicon: HALOT
  rationale: 히브리어는 단수 ‘마음’에 복수 접미사가 붙은 집합적 표현이므로, 한국어도 ‘마음’ 단수로 옮겨 집합성을 살렸습니다. ‘부르짖다’는 단순한 ‘외치다’보다 절박한 탄원의 힘을 더 잘 드러냅니다.
- source_word: חוֹמַת בַּת צִיּוֹן
  english_pob_choice: O wall of daughter Zion
  chosen_korean: 시온의 딸의 성벽이여
  alternatives_korean:
  - 시온의 딸이여, 성벽이여
  - 딸 시온의 성벽이여
  lexicon: HALOT
  rationale: 원문의 호격 구조를 살려 ‘성벽이여’로 직접 부르고, ‘딸 시온’의 인격화된 도시 이미지는 ‘시온의 딸’로 보존했습니다. ‘성벽’은 חוֹמָה의 기본 의미를 따라 직역했습니다.
- source_word: הוֹרִידִי כַנַּחַל דִּמְעָה יוֹמָם וָלַיְלָה
  english_pob_choice: let tears run down like a stream day and night
  chosen_korean: 눈물이 시내처럼 밤낮으로 흘러내리게 하십시오
  alternatives_korean:
  - 눈물이 와디처럼 밤낮으로 흘러내리게 하십시오
  - 눈물을 시내처럼 밤낮으로 흘리십시오
  lexicon: HALOT
  rationale: הוֹרִידִי는 여기서 눈물에 대해 ‘흘러내리게 하다’로 자연스럽게 옮기는 것이 적절합니다. נחל은 시내/와디를 가리킬 수 있으므로, 한국어에서는 ‘시내’가 의미를 살리면서도 읽기 자연스럽습니다.
- source_word: אַל תִּתְּנִי פוּגַת לָךְ
  english_pob_choice: give yourself no relief
  chosen_korean: 스스로에게 아무런 위로도 주지 마십시오
  alternatives_korean:
  - 스스로에게 아무런 휴식도 주지 마십시오
  - 스스로를 조금도 쉬게 하지 마십시오
  lexicon: HALOT
  rationale: פוּגָה는 ‘잠’보다 ‘잠깐 멈춤/위로/완화’의 뉘앙스가 강하므로, 문맥상 애가의 절규를 살려 ‘위로’로 옮겼습니다. ‘스스로에게’는 목적어의 재귀성을 드러냅니다.
- source_word: בַּת עֵינֵךְ
  english_pob_choice: the apple of your eye
  chosen_korean: 눈동자여
  alternatives_korean:
  - 눈의 딸이여
  - 눈동자 속의 딸이여
  - 눈의 동자여
  lexicon: HALOT
  rationale: 히브리어 관용구는 눈동자/동공을 가리키는 표현이므로, 한국어에서는 바로 이해되는 ‘눈동자’로 옮겼습니다. POB의 관용적 ‘apple of your eye’는 한국어에서 오해를 낳을 수 있어, 원문 이미지에 더 가까운 형태를 택했습니다.
theological_decisions:
- issue: אֲדֹנָי의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주인님
  - 나의 주
  rationale: 이 문맥의 אֲדֹנָי는 인간 상관이 아니라 이스라엘의 하나님을 가리키므로, 프로젝트 기본값에 따라 ‘주님’으로 옮겼습니다. 한국어 합쇼체 본문에서는 직접적인 신적 호칭으로 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: divine title אֲדֹנָי/κύριος → 주님'
