id: LAM.2.20
reference: Lamentations 2:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה לְ/מִ֖י עוֹלַ֣לְתָּ כֹּ֑ה אִם תֹּאכַ֨לְנָה נָשִׁ֤ים פִּרְיָ/ם֙ עֹלֲלֵ֣י טִפֻּחִ֔ים אִם יֵהָרֵ֛ג בְּ/מִקְדַּ֥שׁ אֲדֹנָ֖/י כֹּהֵ֥ן וְ/נָבִֽיא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/020.yaml
  text: Look[a], O Yahweh, and see—to whom have you done this? Should women eat their offspring[b], the children they have cared for? Should priest and prophet be killed in the sanctuary of the Lord?
  footnotes:
  - marker: a
    text: Hebrew 'their fruit,' that is, their own offspring.
    reason: lexical_alternative
  - marker: b
    text: Or 'their pampered children' / 'the little ones they have dandled.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와여, 보시고 살펴보소서 — 주께서 누구에게 이렇게 행하셨습니까? 여인들이 그들의 소산을, 곧 보살피던 아이들을 먹어야 합니까? 제사장과 예언자가 주의 성소에서 죽임을 당해야 합니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 '그들의 열매'이며, 곧 자기 자녀를 가리키는 관용입니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 '애지중지하던 아이들' 또는 '품에 안아 기르던 아이들'로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה / וְהַבִּיטָה
  english_pob_choice: Look / and see
  chosen_korean: 보시고 살펴보소서
  alternatives_korean:
  - 보시고 보아 주소서
  - 살피시고 보아 주십시오
  lexicon: HALOT
  rationale: 두 명령형의 짝을 살려 첫 동사는 직접 호소, 둘째 동사는 시각적 확인의 뉘앙스로 옮겼습니다. 하나님께 드리는 직접 호소이므로 공손한 청원형을 썼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: project default
  rationale: 이 절의 기존 영어 POB는 יְהוָה를 Yahweh로 처리하지만, 한국어 본문은 POB의 통상적 한국어 독자성을 고려해 성서 독서에서 즉시 알아볼 수 있는 고유형을 사용했습니다.
- source_word: פִּרְיָם
  english_pob_choice: their offspring / their own fruit
  chosen_korean: 그들의 소산
  alternatives_korean:
  - 그들의 자식
  - 그들의 열매
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지는 '열매'이지만, 문맥상 자녀를 가리키는 관용이므로 그 이미지를 너무 풀지 않으면서 한국어로는 '소산'을 택했습니다.
- source_word: עֹלֲלֵי טִפֻּחִים
  english_pob_choice: the children they have cared for / their pampered children
  chosen_korean: 곧 보살피던 아이들
  alternatives_korean:
  - 곧 어루만지던 아이들
  - 곧 품에 안아 기르던 아이들
  lexicon: HALOT
  rationale: 단순한 '아이들'보다 돌봄과 애지중지의 뉘앙스를 살리기 위해 '보살피던'을 붙였고, 과장 없이 문맥의 정서를 보존했습니다.
- source_word: בְּמִקְדַּשׁ אֲדֹנָי
  english_pob_choice: in the sanctuary of the Lord
  chosen_korean: 주의 성소에서
  alternatives_korean:
  - 주님의 성소에서
  - 주 하나님의 성소에서
  lexicon: HALOT
  rationale: מקדש는 '성소'가 가장 직접적이며, אֲדֹנָי의 존칭은 한국어 자연문맥에서 '주'로 간명하게 옮겼습니다.
theological_decisions:
- issue: 호소문 전체의 문체
  chosen_reading: 예언자의 애가적 탄원으로 보고, 하나님께 대한 직접 호칭과 청원형을 유지했습니다.
  alternative_readings:
  - 서술형으로 완화하여 번역
  - 중립적 진술처럼 번역
  rationale: 본문은 사실 진술이 아니라 재난의 도덕적 충격을 드러내는 탄원입니다. 따라서 반문과 호소의 긴장을 약화하지 않도록 했습니다.
  doctrine_reference: 애가 문학의 수사와 기도체
- issue: 여호와/주의 구분
  chosen_reading: 본문의 두 신적 호칭을 모두 유지하되, 한국어에서는 문맥상 각각 '여호와'와 '주'로 처리했습니다.
  alternative_readings:
  - 둘 다 '주'로 통일
  - 둘 다 '하나님'으로 처리
  rationale: 히브리어는 יְהוָה와 אֲדֹנָי를 구분해 사용합니다. 이를 구분 없이 통일하면 원문의 어조와 신명 사용의 차이가 사라집니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
