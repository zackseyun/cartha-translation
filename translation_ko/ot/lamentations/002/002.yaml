id: LAM.2.2
reference: Lamentations 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּלַּ֨ע אֲדֹנָ֜/י לא חָמַ֗ל אֵ֚ת כָּל נְא֣וֹת יַעֲקֹ֔ב הָרַ֧ס בְּ/עֶבְרָת֛/וֹ מִבְצְרֵ֥י בַת יְהוּדָ֖ה הִגִּ֣יעַ לָ/אָ֑רֶץ חִלֵּ֥ל מַמְלָכָ֖ה וְ/שָׂרֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/002.yaml
  text: The Lord has swallowed up[a], without pity, all the pastures of Jacob; in his wrath he has torn down the strongholds of daughter Judah; he has brought them down to the ground[c][b]; he has defiled the kingdom and its princes.
  footnotes:
  - marker: a
    text: Or 'the dwellings of Jacob' or 'the habitations of Jacob.' The Hebrew term can refer to pastures or dwelling places.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'daughter Judah,' a poetic personification of Judah.
    reason: cultural_note
  - marker: c
    text: Or 'has profaned the kingdom and its princes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 야곱의 모든 초장을 삼키셨고[a], 긍휼히 여기지 않으셨습니다. 진노 가운데서 유다의 딸의 견고한 요새를 허무시고, 그것들을 땅에 무너뜨리셨으며[c][b], 왕국과 그 방백들을 더럽히셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱의 거처들’ 혹은 ‘야곱의 주거지들’. 히브리어 נְאוֹת는 초장과 거처를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘유다의 딸’은 유다를 가리키는 시적 의인화입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘왕국과 그 방백들을 더럽히셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  english_pob_choice: has swallowed up
  chosen_korean: 삼키셨습니다
  alternatives_korean:
  - 집어삼키셨습니다
  - 삼켜 버리셨습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 문자적으로 ‘삼키다/먹어치우다’의 생생한 이미지를 가지므로, 한국어에서도 ‘삼키셨습니다’가 파괴의 충격을 가장 직접적으로 살립니다.
- source_word: אֲדֹנָי
  english_pob_choice: The Lord
  chosen_korean: 주께서는
  alternatives_korean:
  - 주님께서는
  lexicon: HALOT
  rationale: 이 표현은 여호와 이름이 아니라 ‘아도나이’라는 호칭이므로, 호칭으로 자연스럽게 옮겨 ‘주께서는’으로 처리했습니다.
- source_word: נְאוֹת יַעֲקֹב
  english_pob_choice: the pastures of Jacob
  chosen_korean: 야곱의 모든 초장
  alternatives_korean:
  - 야곱의 거처들
  - 야곱의 거주지들
  lexicon: HALOT
  rationale: נְאוֹת는 문맥상 목초지/초장과 거처의 뜻을 둘 다 가질 수 있지만, 시적 이미지의 구체성을 살려 기본 번역은 ‘초장’으로 두었습니다.
- source_word: בַת יְהוּדָה
  english_pob_choice: daughter Judah
  chosen_korean: 유다의 딸
  alternatives_korean:
  - 유다 딸
  lexicon: HALOT
  rationale: 히브리어의 시적 의인화를 한국어에서 가장 자연스럽게 드러내는 형태는 ‘유다의 딸’입니다. 직역형 ‘유다 딸’은 한국어 문장 흐름이 거칩니다.
- source_word: הִגִּיעַ לָאָרֶץ
  english_pob_choice: has brought them down to the ground
  chosen_korean: 땅에 무너뜨리셨으며
  alternatives_korean:
  - 땅으로 끌어내리셨으며
  - 땅에 떨어뜨리셨으며
  lexicon: HALOT
  rationale: 강한 요새를 ‘땅으로’ 내리누르는 이미지를 한국어 동사 ‘무너뜨리다’가 잘 전달합니다. 대상 ‘그것들’은 앞의 요새들을 가리킵니다.
- source_word: חִלֵּל
  english_pob_choice: has defiled
  chosen_korean: 더럽히셨습니다
  alternatives_korean:
  - 속되게 하셨습니다
  - 더럽게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘성스럽게 된 것을 속되게 만들다/더럽히다’의 뜻이므로, 현대 한국어에서 이해가 쉬운 ‘더럽히셨습니다’를 택했습니다.
- source_word: מַמְלָכָה וְשָׂרֶיהָ
  english_pob_choice: the kingdom and its princes
  chosen_korean: 왕국과 그 방백들
  alternatives_korean:
  - 나라와 그 통치자들
  - 왕정과 그 방백들
  lexicon: HALOT
  rationale: מַמְלָכָה는 추상적 ‘왕권’보다 정치적 실체인 ‘왕국’이 자연스럽고, שָׂרִים는 문맥상 ‘방백들’이 격식과 계층감을 함께 살립니다.
theological_decisions:
- issue: 예루살렘 애가의 심판 묘사에서 하나님의 주어를 유지하는 방식
  chosen_reading: 주께서 직접 행동하시는 것으로 번역해 심판의 주체성을 분명히 했습니다.
  alternative_readings:
  - 수동적으로 돌려 ‘...되었다’로 옮김
  - 인칭을 약화해 서술만 남김
  rationale: 히브리어 원문은 연속된 능동 동사를 통해 야훼의 심판 행위를 강하게 제시합니다. 이를 완화하지 않고 주어를 유지하는 것이 본문의 신학적 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: source-directed rendering; do not soften divine agency'
- issue: בַת יְהוּדָה의 의인화 처리
  chosen_reading: ‘유다의 딸’로 옮겨 시적 의인화를 보존했습니다.
  alternative_readings:
  - ‘유다’로 평문화
  - ‘유다 백성’으로 해설화
  rationale: 이 표현은 단순 지리명이 아니라 애가의 시적 인격화이므로, 해설적으로 풀기보다 원문의 형상을 유지하는 편이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: preserve poetic personification where source warrants'
