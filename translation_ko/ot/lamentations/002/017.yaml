id: LAM.2.17
reference: Lamentations 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָשָׂ֨ה יְהוָ֜ה אֲשֶׁ֣ר זָמָ֗ם בִּצַּ֤ע אֶמְרָת/וֹ֙ אֲשֶׁ֣ר צִוָּ֣ה מִֽ/ימֵי קֶ֔דֶם הָרַ֖ס וְ/לֹ֣א חָמָ֑ל וַ/יְשַׂמַּ֤ח עָלַ֨יִ/ךְ֙ אוֹיֵ֔ב הֵרִ֖ים קֶ֥רֶן צָרָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/017.yaml
  text: Yahweh has done what he planned[a]; he has fulfilled his word, which he commanded from days of old. He has torn down and has not shown pity; he has made the enemy rejoice over you[c][b]; he has exalted the horn of your foes.
  footnotes:
  - marker: a
    text: Or 'carried out' or 'executed' his word.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from days of old,' that is, from long ago.
    reason: lexical_alternative
  - marker: c
    text: '''Horn'' is a biblical image for strength, power, or honor.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 그가 계획하신 것을 이루셨습니다[a]. 그는 자기 말씀을, 곧 오래전부터 명하신 것을 성취하셨습니다. 그는 무너뜨리시고도 긍휼을 베풀지 않으셨으며, 원수가 당신 위에서 기뻐하게 하셨고[c][b], 당신의 적들의 뿔을 높이셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '실행하신' '집행하신'으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '오래전부터'라는 뜻의 시간 관용구를 담고 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '''뿔''은 힘, 권세, 명예를 가리키는 성경적 상징입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신적 고유명사는 주를 대체하는 호칭이 아니라 고유명사로 처리해야 하므로, POB의 야훼를 따랐습니다.
- source_word: זָמָם
  english_pob_choice: planned
  chosen_korean: 계획하신
  alternatives_korean:
  - 의도하신
  - 뜻하신
  - 꾀하신
  lexicon: HALOT
  rationale: 의도된 판단 행위를 자연스럽게 드러내면서도 단순한 생각이 아니라 사전에 세운 뜻임을 살렸습니다.
- source_word: בִּצַּע אֶמְרָתוֹ
  english_pob_choice: has fulfilled his word
  chosen_korean: 말씀을 이루셨습니다
  alternatives_korean:
  - 말씀을 성취하셨습니다
  - 말씀을 집행하셨습니다
  - 말씀을 실행하셨습니다
  lexicon: HALOT
  rationale: 예언된 선언을 실제로 완수했다는 뜻을 한국어로 가장 자연스럽게 옮기기 위해 '이루다'를 사용했습니다.
- source_word: מִימֵי קֶדֶם
  english_pob_choice: from days of old
  chosen_korean: 오래전부터
  alternatives_korean:
  - 옛날부터
  - 옛적부터
  - 태초부터
  lexicon: HALOT
  rationale: 시간적 관용구의 의미를 살리되 현대 한국어에서 읽기 자연스러운 표현으로 옮겼습니다.
- source_word: קֶרֶן
  english_pob_choice: horn
  chosen_korean: 뿔
  alternatives_korean:
  - 권세
  - 힘
  - 영광
  lexicon: HALOT
  rationale: 성경적 상징인 '뿔'을 그대로 유지해 힘과 높아짐의 이미지를 보존했습니다.
theological_decisions:
- issue: 하나님의 직접 행위와 심판의 긴장
  chosen_reading: 주어를 흐리지 않고, 야훼께서 계획·성취·무너뜨리심·긍휼을 거두심·원수의 승리를 허락하심을 그대로 드러냈습니다.
  alternative_readings:
  - 허용하셨다로 완화하기
  - 사역적 표현을 줄여 우회적으로 옮기기
  rationale: 히브리어 동사들이 하나님을 직접 주어로 제시하므로, 심판의 신학적 긴장을 완화하지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
