    rationale: a는 말씀을 이루신 행위의 대안 번역에 관한 각주이므로 '이루셨습니다'에, b는 '옛적부터'에, c는 '뿔'에 붙어야 합니다. 현 표지들은 각각 계획, 원수의 기쁨에 붙어 있어 참조 대상이 불명확합니다.
