    rationale: עשה אשר זמם은 '계획하신 대로 행하셨습니다'이고, ביצע אמרתו는 '말씀을 이루셨습니다'입니다. 현 문장은 앞 절에 '이루셨습니다', 다음 절에 '성취하셨습니다'를 사용하여 원문의 진행과 구별을 약화합니다.
  - severity: medium
