theological_decisions:
- issue: 하나님의 직접 행위와 심판의 긴장
  chosen_reading: 주어를 흐리지 않고, 야훼께서 계획·성취·무너뜨리심·긍휼을 거두심·원수의 승리를 허락하심을 그대로 드러냈습니다.
  alternative_readings:
  - 허용하셨다로 완화하기
  - 사역적 표현을 줄여 우회적으로 옮기기
  rationale: 히브리어 동사들이 하나님을 직접 주어로 제시하므로, 심판의 신학적 긴장을 완화하지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
