  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: טָבְע֤וּ בָ/אָ֨רֶץ֙ שְׁעָרֶ֔י/הָ אִבַּ֥ד וְ/שִׁבַּ֖ר בְּרִיחֶ֑י/הָ מַלְכָּ֨/הּ וְ/שָׂרֶ֤י/הָ בַ/גּוֹיִם֙ אֵ֣ין תּוֹרָ֔ה גַּם נְבִיאֶ֕י/הָ לֹא מָצְא֥וּ חָז֖וֹן מֵ/יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/009.yaml
  text: Her gates have sunk into the earth; he has destroyed and broken her bars[a]. Her king and her princes are among the nations; there is no law. Even her prophets have found no vision from Yahweh.
  footnotes:
  - marker: a
    text: Or 'there is no instruction'; Hebrew torah can denote law, instruction, or teaching.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 성문들은 땅속으로 가라앉았습니다. 그가 그의 빗장을 파괴하고 부러뜨렸습니다. 그의 왕과 그의 지도자들은 여러 나라 가운데 있습니다. 율법이 없습니다. 심지어 그의 예언자들도 야훼께로부터 환상을 얻지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '가르침이 없습니다.' 히브리어 תּוֹרָה는 율법, 교훈, 가르침을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְע֤וּ בָאָרֶץ שְׁעָרֶיהָ
  english_pob_choice: Her gates have sunk into the earth
  chosen_korean: 그의 성문들은 땅속으로 가라앉았습니다
  alternatives_korean:
  - 그의 성문들은 땅으로 가라앉았습니다
  - 그의 성문들은 땅속에 잠겼습니다
  lexicon: HALOT
  rationale: 가라앉다로 침몰·함몰의 이미지를 살리고, '땅속으로'로 결과/방향을 자연스럽게 옮겼습니다.
- source_word: אִבַּד וְשִׁבַּר בְּרִיחֶיהָ
  english_pob_choice: he has destroyed and broken her bars
  chosen_korean: 그가 그의 빗장을 파괴하고 부러뜨렸습니다
  alternatives_korean:
  - 그가 그의 빗장을 없애고 부수었습니다
  - 그가 그의 빗장을 무너뜨리고 깨뜨렸습니다
  lexicon: HALOT
  rationale: '''destroyed and broken''의 이중 동작을 유지하되, 빗장에 대한 한국어로는 ''파괴하고 부러뜨리다''가 가장 직접적입니다.'
- source_word: מַלְכָּהּ וְשָׂרֶיהָ בַגּוֹיִם
  english_pob_choice: Her king and her princes are among the nations
  chosen_korean: 그의 왕과 그의 지도자들은 여러 나라 가운데 있습니다
  alternatives_korean:
  - 그의 왕과 그의 방백들은 여러 나라 가운데 있습니다
  - 그의 왕과 그의 귀족들은 민족들 가운데 있습니다
  lexicon: HALOT
  rationale: שָׂרִים는 정치적 고위층을 가리키므로, 한국어에서는 너무 고어적인 '방백'보다 의미가 분명한 '지도자들'을 택했습니다.
- source_word: אֵין תּוֹרָה
  english_pob_choice: there is no law
  chosen_korean: 율법이 없습니다
  alternatives_korean:
  - 법이 없습니다
  - 가르침이 없습니다
  lexicon: HALOT
  rationale: 이 문맥의 תּוֹרָה는 언약적 질서와 공적 지침의 붕괴를 가리키므로, 본문에는 '율법'을 두어 핵심 의미를 살렸습니다.
- source_word: חָזוֹן מֵיְהוָה
  english_pob_choice: vision from Yahweh
  chosen_korean: 야훼께로부터 환상을 얻지 못했습니다
  alternatives_korean:
  - 야훼께로부터 계시를 얻지 못했습니다
  - 야훼께로부터 이상을 보지 못했습니다
  lexicon: HALOT
  rationale: חָזוֹן은 예언적 '환상/이상'인데, 여기서는 예언자들의 수신 실패를 드러내므로 '환상'을 사용했습니다.
theological_decisions:
- issue: אִבַּד וְשִׁבַּר의 암시적 주어
  chosen_reading: 주어를 본문에 드러내지 않고 앞 절의 문맥이 지시하는 행위자로 읽히게 두었습니다.
  alternative_readings:
  - 그가 곧 야훼께서 그의 빗장을 파괴하고 부러뜨렸습니다
  - 야훼께서 그의 빗장을 파괴하고 부러뜨렸습니다
  rationale: 히브리어는 3인칭 단수 동사만 두고 주어를 생략하므로, 문맥상 분명한 경우에도 번역문에서 과도하게 명시하지 않는 쪽이 स्रोत에 가깝습니다.
  doctrine_reference: 원문 우선 원칙, 암시적 주어 보존
- issue: תּוֹרָה의 의미
  chosen_reading: 본문은 '율법'으로 번역하고, 보다 넓은 'instruction/교훈' 가능성은 주석으로 남겼습니다.
  alternative_readings:
  - 가르침이 없습니다
  - 토라가 없습니다
  rationale: 애가의 문맥에서는 공적·언약적 질서의 붕괴가 강조되므로 '율법'이 가장 간결하고 본문 기능을 잘 드러냅니다.
  doctrine_reference: 어휘 중층성 보존
