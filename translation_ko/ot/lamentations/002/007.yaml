  lexicon: HALOT
  rationale: 제사장적·언약적 거부의 의미를 한국어 동사로 직접 살리되, 뒤의 더 강한 동사와 구별되게 했습니다.
- source_word: נִאֵר
  english_pob_choice: has abandoned
  chosen_korean: 버리셨습니다
  alternatives_korean:
  - 내치셨습니다
  - 경멸하셨습니다
  - 버리셨습니다
  lexicon: HALOT
  rationale: 앞의 זָנַח보다 더 강한 거절/폐기의 뉘앙스를 살려, 성소를 단순히 떠난 것이 아니라 내버린 의미로 옮겼습니다.
- source_word: הִסְגִּיר בְּיַד אוֹיֵב
  english_pob_choice: has given ... into the hand of the enemy
  chosen_korean: 원수의 손에 넘기셨습니다
  alternatives_korean:
  - 원수의 손에 맡기셨습니다
  - 원수에게 넘기셨습니다
  - 원수의 손에 넘기셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 풀어도 ‘힘 아래로 넘겨줌’이라는 압박감을 유지했습니다.
- source_word: בְּבֵית יְהוָה / יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 주님의 집
  - 여호와의 집
  - 야훼의 집
  lexicon: HALOT
  rationale: 본문의 신명기적 이름 יְהוָה를 프로젝트 기본값에 따라 야훼로 옮기고, ‘집’은 원문 표현을 보존했습니다.
theological_decisions:
- issue: 여호와/야훼의 처리
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 구절은 신명기적 이름을 직접 사용하므로, 제목어 ‘주님’으로 바꾸지 않고 고유명을 보존하는 쪽이 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 의인화된 예루살렘의 지시 대상
  chosen_reading: ‘그녀의 궁궐들’은 예루살렘/시온의 여성 의인화를 그대로 살렸습니다.
  alternative_readings:
  - 그의 궁궐들
  - 예루살렘의 궁궐들
  rationale: 히브리어 여성 접미사를 중화하지 않고 유지해, 시가의 애가적 의인화를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (source-form sensitivity)
