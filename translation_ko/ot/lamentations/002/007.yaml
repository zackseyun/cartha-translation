source:
  edition: WLC
  text: זָנַ֨ח אֲדֹנָ֤/י מִזְבְּח/וֹ֙ נִאֵ֣ר מִקְדָּשׁ֔/וֹ הִסְגִּיר֙ בְּ/יַד אוֹיֵ֔ב חוֹמֹ֖ת אַרְמְנוֹתֶ֑י/הָ ק֛וֹל נָתְנ֥וּ בְּ/בֵית יְהוָ֖ה כְּ/י֥וֹם מוֹעֵֽד׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/007.yaml
  text: The Lord has rejected his altar[a]; he has abandoned his sanctuary. He has given the walls of her palaces into the hand of the enemy[c][b]. They raised a shout in the house of Yahweh as on the day of an appointed feast.
  footnotes:
  - marker: a
    text: Or 'has abhorred his sanctuary.' The Hebrew verb is stronger than the previous 'has rejected.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into the hand of the enemy,' an idiom meaning to hand over to an enemy's power.
    reason: lexical_alternative
  - marker: c
    text: Or 'as on a feast day' or 'as on the day of an appointed festival.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 자신의 제단[a]을 거절하시고 자신의 성소를 버리셨습니다. 그분께서는 원수의 손[b]에 그녀의 궁궐들의 성벽을 넘기셨습니다. 그들이 야훼의 집에서 절기 날처럼 큰 소리[c]를 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 성소를 미워하셨습니다.’ 앞의 ‘거절하셨습니다’보다 더 강한 동사입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘원수의 손 안으로’입니다. 적의 권세에 넘겨주었다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘절기 날에’ 혹은 ‘지정된 절기의 날처럼’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
