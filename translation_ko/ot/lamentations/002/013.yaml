source:
  edition: WLC
  text: מָֽה אֲעִידֵ֞/ךְ מָ֣ה אֲדַמֶּה לָּ֗/ךְ הַ/בַּת֙ יְר֣וּשָׁלִַ֔ם מָ֤ה אַשְׁוֶה לָּ/ךְ֙ וַ/אֲנַֽחֲמֵ֔/ךְ בְּתוּלַ֖ת בַּת צִיּ֑וֹן כִּֽי גָד֥וֹל כַּ/יָּ֛ם שִׁבְרֵ֖/ךְ מִ֥י יִרְפָּא לָֽ/ךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/013.yaml
  text: What can I testify for you? What can I compare you to[a], daughter Jerusalem? What can I liken to you, so that I may comfort you, virgin daughter Zion? For your fracture is as great as the sea[b]; who can heal you?
  footnotes:
  - marker: a
    text: Or 'What can I bear witness to for you?' The Hebrew verb can carry a witness/testimony sense; the line is difficult, and some understand it more broadly as 'What can I say about you?'
    reason: lexical_alternative
  - marker: b
    text: Or 'your wound,' 'your ruin,' or 'your brokenness.' The Hebrew term denotes a breaking or collapse and is rendered here as 'fracture' to match the following question about healing.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너에 관하여 무엇을 증언하겠습니까?[a] 예루살렘의 딸아, 내가 너를 무엇에 비하겠습니까? 처녀 딸 시온아, 내가 너를 무엇에 견주어 너를 위로하겠습니까? 네 상처가 바다처럼 크니, 누가 너를 치유할 수 있겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너를 위해 무엇을 증언하겠습니까?’ 또는 ‘내가 네게 무엇을 증언하겠습니까?’ 히브리어 동사는 증언하거나 증거를 제시하는 뜻을 지닙니다. 이 구절의 어법은 난해하여, ‘내가 너에 관하여 무엇을 말하겠습니까?’로 넓게 이해하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 무너짐,’ ‘네 파괴,’ 또는 ‘네 깨어짐.’ 히브리어는 깨짐이나 붕괴를 가리키며, 여기서는 뒤따르는 ‘치유하다’와 연결되는 비유를 살려 ‘상처’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲעִידֵךְ
  english_pob_choice: What can I testify for you?
  chosen_korean: 내가 너를 위해 무엇을 증언하겠느냐?
  alternatives_korean:
  - 내가 너를 위해 무엇을 증언할 수 있겠느냐?
  - 내가 너를 위해 무엇을 증거하겠느냐?
  lexicon: HALOT
  rationale: 히필형 עוּד의 증언/증거 언어를 살려, 단순한 ‘말하다’보다 법정적·공적 뉘앙스를 유지했습니다. benefactive לָּךְ는 ‘너를 위해’로 옮겨 원문의 수혜 관계를 드러냈습니다.
- source_word: אֲדַמֶּה לָּךְ / אַשְׁוֶה לָּךְ
  english_pob_choice: compare you to / liken to you
  chosen_korean: 너를 무엇에 비기겠느냐? / 너를 무엇에 견주어
  alternatives_korean:
  - 너를 무엇과 비교하겠느냐?
  - 너를 무엇에 비유하겠느냐?
  lexicon: HALOT
  rationale: 두 동사는 반복 수사를 이루므로 한국어에서도 ‘비기다/견주다’로 약간 달리 옮겨 중복을 살렸습니다. ‘비유하다’보다 직접적이고, ‘비교하다’보다 시적 대구가 살아납니다.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  english_pob_choice: virgin daughter Zion
  chosen_korean: 처녀 시온의 딸아
  alternatives_korean:
  - 동정녀 시온의 딸아
  - 처녀 딸 시온아
  lexicon: HALOT
  rationale: בְּתוּלָה의 기본 의미를 완화하지 않고 ‘처녀’로 유지하되, 도시를 의인화한 호격 구조를 자연스럽게 살렸습니다. ‘시온의 딸’은 personification을 유지하는 표준적인 직역입니다.
- source_word: שִׁבְרֵךְ
  english_pob_choice: your fracture
  chosen_korean: 네 파괴는
  alternatives_korean:
  - 네 상처는
  - 네 깨어짐은
  - 네 무너짐은
  lexicon: HALOT
  rationale: שבר는 문맥상 깨짐/붕괴/파괴의 폭을 가질 수 있어, 바다처럼 큰 상태를 강조하는 맥락에 맞게 ‘파괴’로 옮겼습니다. 이는 치유를 묻는 다음 질문과도 긴밀히 연결됩니다.
- source_word: מִי יִרְפָּא לָךְ
  english_pob_choice: who can heal you?
  chosen_korean: 누가 너를 고치겠느냐?
  alternatives_korean:
  - 누가 너를 치유하겠느냐?
  - 누가 너를 낫게 하겠느냐?
  lexicon: HALOT
  rationale: רפא의 치료 이미지를 살리면서, 한국어에서 상처·붕괴의 회복을 폭넓게 담는 ‘고치다’를 택했습니다. ‘치유하다’는 자연스럽지만 다소 종교적·추상적으로 들릴 수 있어, 앞의 ‘파괴’와 함께 더 직접적인 대응을 이루게 했습니다.
theological_decisions:
- issue: 예루살렘과 시온을 향한 의인화된 애가의 정서
  chosen_reading: 도시를 여성 호격으로 직접 부르며, 탄식과 애도의 어조를 한국어에서도 유지했습니다.
  alternative_readings:
  - 서술형으로 풀어 ‘예루살렘은…’처럼 옮기기
  - 감정 표현을 완화해 더 중립적으로 번역하기
  rationale: 본문은 위로하려 하지만 궁극적으로는 위로의 불가능성과 파괴의 극단성을 드러냅니다. 의인화와 호격을 살려야 애가의 신학적 긴장이 보존됩니다.
  doctrine_reference: 애가 문학의 탄식과 심판 이후의 회복 불가능성 표현
- issue: ‘증언하다’의 법정적 언어 보존
  chosen_reading: ‘증언하다’로 옮겨, 하나님 앞에서의 공적 진술과 원문의 무게를 살렸습니다.
  alternative_readings:
  - ‘말하다’로 완화하기
  - ‘변호하다’로 해석하기
  rationale: 문맥상 단순 정보 전달이 아니라, 예루살렘을 위해 어떤 증거를 제시할 수 있는지 묻는 수사입니다. 법정적 색채를 유지하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: 히필 동사 עוּד의 증언/증거 뉘앙스
