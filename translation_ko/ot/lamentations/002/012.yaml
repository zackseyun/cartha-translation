id: LAM.2.12
reference: Lamentations 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/אִמֹּתָ/ם֙ יֹֽאמְר֔וּ אַיֵּ֖ה דָּגָ֣ן וָ/יָ֑יִן בְּ/הִֽתְעַטְּפָ֤/ם כֶּֽ/חָלָל֙ בִּ/רְחֹב֣וֹת עִ֔יר בְּ/הִשְׁתַּפֵּ֣ךְ נַפְשָׁ֔/ם אֶל חֵ֖יק אִמֹּתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/012.yaml
  text: They say to their mothers[a], “Where are grain and wine?” as they faint like the wounded in the streets of the city[c][b], as their life is poured out into their mothers’ bosom.
  footnotes:
  - marker: a
    text: Or “like the slain.” The Hebrew חָלָל can refer to one slain, pierced, or mortally wounded; here it likely evokes children collapsing as if battlefield casualties.
    reason: lexical_alternative
  - marker: b
    text: Hebrew nephesh, often rendered “soul,” here likely means “life” in the sense of life ebbing away.
    reason: lexical_alternative
  - marker: c
    text: Or “into their mothers’ arms” or “on their mothers’ lap.” Hebrew “bosom” is a literal, intimate maternal image.
    reason: lexical_alternative
translation:
  language: ko
  text: 아이들은 자기 어머니들에게 “곡식과 포도주가 어디 있습니까?” 하고 말합니다. 그들은 성읍의 거리에서 죽임을 당한 사람처럼[a] 기절하고, 그들의 생명[b]은 어머니들의 품[c]에 쏟아집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘치명상을 입은 사람처럼’. 히브리어 חָלָל은 죽임을 당한 사람, 칼에 찔린 사람, 또는 치명상을 입은 사람을 가리킬 수 있습니다. 여기서는 아이들이 거리에서 전쟁 희생자처럼 쓰러지는 모습을 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נֶפֶשׁ는 흔히 ‘영혼’으로 옮기지만, 여기서는 빠져나가고 소진되는 ‘생명’ 또는 ‘목숨’을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘어머니들의 팔에’ 또는 ‘어머니들의 무릎에’. 히브리어 חֵיק은 문자적으로 가슴이나 품, 무릎을 가리키며 친밀한 모성의 이미지를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
