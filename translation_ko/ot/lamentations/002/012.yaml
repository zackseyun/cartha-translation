language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/אִמֹּתָ/ם֙ יֹֽאמְר֔וּ אַיֵּ֖ה דָּגָ֣ן וָ/יָ֑יִן בְּ/הִֽתְעַטְּפָ֤/ם כֶּֽ/חָלָל֙ בִּ/רְחֹב֣וֹת עִ֔יר בְּ/הִשְׁתַּפֵּ֣ךְ נַפְשָׁ֔/ם אֶל חֵ֖יק אִמֹּתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/012.yaml
  text: They say to their mothers[a], “Where are grain and wine?” as they faint like the wounded in the streets of the city[c][b], as their life is poured out into their mothers’ bosom.
  footnotes:
  - marker: a
    text: Or “like the slain.” The Hebrew חָלָל can refer to one slain, pierced, or mortally wounded; here it likely evokes children collapsing as if battlefield casualties.
    reason: lexical_alternative
  - marker: b
    text: Hebrew nephesh, often rendered “soul,” here likely means “life” in the sense of life ebbing away.
    reason: lexical_alternative
  - marker: c
    text: Or “into their mothers’ arms” or “on their mothers’ lap.” Hebrew “bosom” is a literal, intimate maternal image.
    reason: lexical_alternative
translation:
  language: ko
  text: 어린아이들은 그들의 어머니에게 “곡식과 포도주가 어디 있습니까?”라고 말합니다. 그들은 성읍의 거리에서 상한 사람처럼 기절해 가고, 그들의 생명은 어머니의 품으로 쏟아져 들어갑니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽임을 당한 사람처럼’. 히브리어 חָלָל은 죽은 자, 칼에 찔린 자, 치명상을 입은 자를 가리킬 수 있으며, 여기서는 아이들이 전장에서 쓰러진 피해자처럼 보인다는 뉘앙스를 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נפש는 종종 ‘영혼’으로 옮기지만, 여기서는 생명이 빠져나가고 소진되는 뜻으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘어머니의 팔에’ 혹은 ‘어머니의 무릎에’. 히브리어 ‘품’은 문자적이면서도 친밀한 모성 이미지를 지닌 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִמֹּתָם
  english_pob_choice: to their mothers
  chosen_korean: 그들의 어머니에게
  alternatives_korean:
  - 어머니들에게
  - 자기 어머니들에게
  lexicon: HALOT
  rationale: ל 접두사의 방향성은 한국어에서 여격 ‘-에게’로 자연스럽게 나타낼 수 있고, 복수 소유 관계는 문맥상 ‘그들의 어머니’로 충분히 드러납니다.
- source_word: דָּגָן וָיָיִן
  english_pob_choice: grain and wine
  chosen_korean: 곡식과 포도주
  alternatives_korean:
  - 곡물과 포도주
  - 양식과 포도주
  lexicon: HALOT
  rationale: דָּגָן은 일반적인 식량이라기보다 곡식/곡물 생산물을 가리키므로 ‘곡식’이 가장 직접적이고, יָיִן은 표준적으로 ‘포도주’로 옮기는 것이 적절합니다.
- source_word: כֶּחָלָל
  english_pob_choice: like the wounded
  chosen_korean: 상한 사람처럼
  alternatives_korean:
  - 죽임을 당한 사람처럼
  - 부상당한 사람처럼
  lexicon: HALOT
  rationale: חָלָל은 ‘죽임을 당한 자’ 또는 ‘치명상을 입은 자’를 모두 포함할 수 있으므로, 아이들이 거리에서 쓰러지는 장면에는 죽음 여부를 특정하지 않는 ‘상한 사람처럼’이 문맥상 균형이 좋습니다.
- source_word: אֶל חֵיק אִמֹּתָם
  english_pob_choice: into their mothers’ bosom
  chosen_korean: 어머니의 품으로
  alternatives_korean:
  - 어머니의 품 안으로
  - 어머니의 가슴으로
  lexicon: HALOT
  rationale: חֵיק은 문자적으로 ‘가슴/품/무릎’의 친밀한 신체 이미지를 가지므로, 현대 한국어에서는 ‘품’이 가장 자연스럽고 모성적 애잔함을 잘 보존합니다.
theological_decisions:
- issue: נפש의 의미를 ‘영혼’으로 고정할지 ‘생명’으로 옮길지
  chosen_reading: ‘그들의 생명’으로 옮겼습니다.
  alternative_readings:
  - 그들의 영혼
  - 그들의 목숨
  rationale: הִשְׁתַּפֵּךְ נַפְשָׁם는 생명이 소진되고 쏟아지는 이미지를 나타내므로, 여기서는 전통적 ‘영혼’보다 ‘생명’이 원문 비유를 더 직접적으로 전달합니다.
  doctrine_reference: 인간의 נפש는 문맥에 따라 ‘생명/자기/영혼’을 가리킬 수 있음
