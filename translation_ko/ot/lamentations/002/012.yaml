  english_pob_choice: to their mothers
  chosen_korean: 그들의 어머니에게
  alternatives_korean:
  - 어머니들에게
  - 자기 어머니들에게
  lexicon: HALOT
  rationale: ל 접두사의 방향성은 한국어에서 여격 ‘-에게’로 자연스럽게 나타낼 수 있고, 복수 소유 관계는 문맥상 ‘그들의 어머니’로 충분히 드러납니다.
- source_word: דָּגָן וָיָיִן
  english_pob_choice: grain and wine
  chosen_korean: 곡식과 포도주
  alternatives_korean:
  - 곡물과 포도주
  - 양식과 포도주
  lexicon: HALOT
  rationale: דָּגָן은 일반적인 식량이라기보다 곡식/곡물 생산물을 가리키므로 ‘곡식’이 가장 직접적이고, יָיִן은 표준적으로 ‘포도주’로 옮기는 것이 적절합니다.
- source_word: כֶּחָלָל
  english_pob_choice: like the wounded
  chosen_korean: 상한 사람처럼
  alternatives_korean:
  - 죽임을 당한 사람처럼
  - 부상당한 사람처럼
  lexicon: HALOT
  rationale: חָלָל은 ‘죽임을 당한 자’ 또는 ‘치명상을 입은 자’를 모두 포함할 수 있으므로, 아이들이 거리에서 쓰러지는 장면에는 죽음 여부를 특정하지 않는 ‘상한 사람처럼’이 문맥상 균형이 좋습니다.
- source_word: אֶל חֵיק אִמֹּתָם
  english_pob_choice: into their mothers’ bosom
  chosen_korean: 어머니의 품으로
  alternatives_korean:
  - 어머니의 품 안으로
  - 어머니의 가슴으로
  lexicon: HALOT
  rationale: חֵיק은 문자적으로 ‘가슴/품/무릎’의 친밀한 신체 이미지를 가지므로, 현대 한국어에서는 ‘품’이 가장 자연스럽고 모성적 애잔함을 잘 보존합니다.
theological_decisions:
- issue: נפש의 의미를 ‘영혼’으로 고정할지 ‘생명’으로 옮길지
  chosen_reading: ‘그들의 생명’으로 옮겼습니다.
  alternative_readings:
  - 그들의 영혼
  - 그들의 목숨
  rationale: הִשְׁתַּפֵּךְ נַפְשָׁם는 생명이 소진되고 쏟아지는 이미지를 나타내므로, 여기서는 전통적 ‘영혼’보다 ‘생명’이 원문 비유를 더 직접적으로 전달합니다.
  doctrine_reference: 인간의 נפש는 문맥에 따라 ‘생명/자기/영혼’을 가리킬 수 있음
