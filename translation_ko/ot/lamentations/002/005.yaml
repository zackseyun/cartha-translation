  text: הָיָ֨ה אֲדֹנָ֤/י כְּ/אוֹיֵב֙ בִּלַּ֣ע יִשְׂרָאֵ֔ל בִּלַּע֙ כָּל אַרְמְנוֹתֶ֔י/הָ שִׁחֵ֖ת מִבְצָרָ֑י/ו וַ/יֶּ֨רֶב֙ בְּ/בַת יְהוּדָ֔ה תַּאֲנִיָּ֖ה וַ/אֲנִיָּֽה׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/005.yaml
  text: The Lord became like an enemy; he swallowed up Israel. He swallowed up all her palaces; he destroyed his strongholds[a], and he multiplied mourning and lamentation in Daughter Judah.
  footnotes:
  - marker: a
    text: Hebrew 'his strongholds'; some translations smooth this to 'her strongholds' to match 'her palaces,' but the Masoretic Text reads a masculine singular suffix.
    reason: textual_variant
translation:
  language: ko
  text: 주님은 원수처럼 되셨습니다. 그분은 이스라엘을 삼키셨습니다. 그분은 그 모든 궁전들을 삼키시고, 그 성채들을 무너뜨리셨으며[a], 유다의 딸 안에서 애통과 탄식을 더욱 불러일으키셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 단수 접미사 ‘그의 성채들’로 되어 있습니다. 일부 번역은 앞의 ‘그녀의 궁전들’에 맞추어 ‘그녀의 성채들’로 다듬지만, 마소라 본문은 남성형을 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: אֲדֹנָי
  english_pob_choice: The Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인
  - 주
  lexicon: HALOT
  rationale: 하나님을 가리키는 주권 칭호이므로 한국어 성경의 자연스러운 경어인 ‘주님’으로 옮겼습니다.
- source_word: כְּאוֹיֵב
  english_pob_choice: became like an enemy
  chosen_korean: 원수처럼 되셨습니다
  alternatives_korean:
  - 원수같이 되셨습니다
  - 원수이셨습니다
  lexicon: HALOT
  rationale: 비교격 כְּ의 ‘~처럼’을 살려 동일시가 아니라 비유를 유지했습니다.
- source_word: בִּלַּע
  english_pob_choice: swallowed up
  chosen_korean: 삼키셨습니다
  alternatives_korean:
  - 집어삼키셨습니다
  - 먹어 삼키셨습니다
  lexicon: HALOT
  rationale: ‘삼키다’는 파괴의 생생한 이미지를 직접 보존하며, 시적 문맥에도 자연스럽습니다.
- source_word: כָּל אַרְמְנוֹתֶיהָ
  english_pob_choice: all her palaces
  chosen_korean: 그 모든 궁전들
  alternatives_korean:
  - 그 모든 왕궁들
  - 그 모든 궁성들
  lexicon: HALOT
  rationale: אַרְמוֹן의 기본 의미를 살려 ‘궁전’으로 옮기고, 지시대명사를 보충해 앞의 여성형 인칭접미사를 한국어에서 자연스럽게 반영했습니다.
- source_word: מִבְצָרָיו
  english_pob_choice: his strongholds
  chosen_korean: 그 성채들
  alternatives_korean:
  - 그의 요새들
  - 그의 성루들
  lexicon: HALOT
  rationale: 본문의 남성 단수 접미사를 POB처럼 매끄럽게 지우지 않고, ‘성채들’로 옮기되 한국어에서는 중립적 명사구로 처리했습니다.
theological_decisions:
- issue: ‘주님이 원수처럼 되셨다’는 표현을 어떻게 처리할지
  chosen_reading: 원수처럼 되셨습니다
  alternative_readings:
  - 원수이셨습니다
  - 원수처럼 여기셨습니다
  rationale: 히브리어는 비교를 쓰므로, 하나님의 본질을 원수로 규정하지 않고 심판 가운데 원수처럼 행동하시는 긴장을 그대로 남겼습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
