  source_fidelity: 히브리어의 비교 표현(‘원수처럼’), 반복되는 ‘삼키다’, 그리고 애통과 탄식을 증가시키는 인과를 대체로 충실히 옮겼습니다. 그러나 본문에 있는 소유 접미사의 대비, 곧 ‘그녀의 모든 궁전들’(여성 단수)과 ‘그의 성채들’(남성 단수)은 번역 본문에서도 드러나야 합니다. 현행 ‘그 모든 궁전들/그 성채들’은 그 대비를 중화합니다.
