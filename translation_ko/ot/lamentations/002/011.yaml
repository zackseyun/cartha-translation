id: LAM.2.11
reference: Lamentations 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל֨וּ בַ/דְּמָע֤וֹת עֵינַ/י֙ חֳמַרְמְר֣וּ מֵעַ֔/י נִשְׁפַּ֤ךְ לָ/אָ֨רֶץ֙ כְּבֵדִ֔/י עַל שֶׁ֖בֶר בַּת עַמִּ֑/י בֵּֽ/עָטֵ֤ף עוֹלֵל֙ וְ/יוֹנֵ֔ק בִּ/רְחֹב֖וֹת קִרְיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/011.yaml
  text: My eyes are spent with tears[a]; my inward parts churn; my liver is poured out to the earth because of the destruction of the daughter of my people[d][c][b], because infant and nursing child faint in the streets of the city.
  footnotes:
  - marker: a
    text: Or 'my inward parts are troubled' for 'my inward parts churn'; the Hebrew uses visceral body imagery for deep anguish.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my liver is poured out to the earth,' a concrete bodily image for profound grief and collapse.
    reason: cultural_note
  - marker: c
    text: Or 'because of the brokenness of the daughter of my people.'
    reason: alternative_reading
  - marker: d
    text: '''The daughter of my people'' is a Hebrew poetic personification for the people/city.'
    reason: cultural_note
translation:
  language: ko
  text: 내 눈은 눈물로 지쳤습니다. 내 속이 뒤틀립니다[a]. 내 간은 내 백성의 딸이 당한 파괴 때문에[c][d] 땅에 쏟아졌습니다[b]. 어린아이와 젖먹이가 도시의 거리에서 기절하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 속이 괴롭습니다’라고 옮길 수 있습니다. 히브리어는 깊은 비애를 내장 기관의 이미지로 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내 간이 땅에 쏟아졌습니다’라고 말합니다. 이는 깊은 슬픔과 무너짐을 나타내는 구체적인 신체 이미지입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘내 백성의 딸이 당한 무너짐 때문에’라고 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: ‘내 백성의 딸’은 히브리 시에서 백성이나 도시를 가리키는 의인화 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כָּלוּ בַדְּמָעוֹת עֵינַי
  english_pob_choice: My eyes are spent with tears
  chosen_korean: 눈물이 떨어져 내 눈이 지쳤습니다
  alternatives_korean:
  - 내 눈이 눈물로 다 닳았습니다
  - 내 눈이 눈물에 지쳤습니다
  lexicon: HALOT
  rationale: ‘지쳤습니다’는 눈이 눈물로 소진된 상태를 자연스러운 현대 한국어로 옮기면서도, 원문의 신체적 소모 이미지를 유지합니다.
- source_word: חֳמַרְמְרוּ מֵעַי
  english_pob_choice: my inward parts churn
  chosen_korean: 내 속이 뒤틀립니다
  alternatives_korean:
  - 내 창자가 뒤틀립니다
  - 내 내장이 끓어오릅니다
  lexicon: HALOT
  rationale: 히브리어의 장기적·내장적 비애 이미지를 살리되, 한국어에서 과도하게 거칠거나 생소한 표현은 피했습니다.
- source_word: נִשְׁפַּךְ לָאָרֶץ כְּבֵדִי
  english_pob_choice: my liver is poured out to the earth
  chosen_korean: 내 간이 땅에 쏟아졌습니다
  alternatives_korean:
  - 내 간이 땅에 부어졌습니다
  - 내 간이 땅바닥에 쏟아졌습니다
  lexicon: HALOT
  rationale: ‘간’은 본문이 쓰는 구체적 장기 이미지를 그대로 보존해야 하므로 일반화하지 않았고, ‘쏟아졌습니다’로 붕괴와 소진의 감각을 살렸습니다.
- source_word: בַּת עַמִּי
  english_pob_choice: the daughter of my people
  chosen_korean: 내 백성의 딸
  alternatives_korean:
  - 내 백성의 딸 된 도시
  - 내 백성의 딸 같은 공동체
  lexicon: HALOT
  rationale: 히브리어의 의인화 표현을 직역해, 예루살렘/백성 전체를 가리키는 시적 관용구를 독자가 보도록 했습니다.
- source_word: בְּעָטֵף עוֹלֵל וְיוֹנֵק
  english_pob_choice: because infant and nursing child faint
  chosen_korean: 어린아이와 젖먹이가 … 기절합니다
  alternatives_korean:
  - 유아와 젖먹이가 … 쓰러집니다
  - 아기와 젖먹이가 … 기절합니다
  lexicon: HALOT
  rationale: ‘어린아이’와 ‘젖먹이’는 병렬된 두 표현의 취지를 살리면서도 현대 한국어로 분명하게 전달합니다. ‘기절합니다’는 쇠약해져 쓰러지는 장면을 자연스럽게 옮깁니다.
theological_decisions:
- issue: ‘백성의 딸’의 의인화 유지
  chosen_reading: 예루살렘/공동체를 가리키는 시적 의인화를 그대로 보존했습니다.
  alternative_readings:
  - 공동체의 파괴
  - 예루살렘의 파괴
  rationale: 본문의 애가적 수사 자체가 의미를 이루므로, 해설적으로 풀어 쓰기보다 원문의 인격화 표현을 남겨 독자가 시적 긴장을 느끼게 했습니다.
  doctrine_reference: 시적 의인화와 예언적 애가의 문학적 관습
- issue: ‘기절합니다’로 번역한 비참의 정도
  chosen_reading: 유아와 젖먹이가 거리에서 실제로 쓰러질 정도의 극심한 기근·파멸 상황으로 읽었습니다.
  alternative_readings:
  - 단순히 쇠약해집니다
  - 맥을 잃습니다
  rationale: 원문은 추상적 슬픔이 아니라 공동체 붕괴의 육체적 결과를 강조하므로, 약한 표현보다 구체적이고 강한 표현이 더 충실합니다.
  doctrine_reference: 애가 2장의 심판과 황폐화 묘사
