reference: Lamentations 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יֵשְׁב֨וּ לָ/אָ֤רֶץ יִדְּמוּ֙ זִקְנֵ֣י בַת צִיּ֔וֹן הֶֽעֱל֤וּ עָפָר֙ עַל רֹאשָׁ֔/ם חָגְר֖וּ שַׂקִּ֑ים הוֹרִ֤ידוּ לָ/אָ֨רֶץ֙ רֹאשָׁ֔/ן בְּתוּלֹ֖ת יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/010.yaml
  text: The elders of daughter Zion sit on the ground in silence[a]; they have thrown dust on their heads and put on sackcloth[b]; the virgins of Jerusalem have bowed their heads to the ground.
  footnotes:
  - marker: a
    text: Or 'the maidens of Jerusalem.' The Hebrew term refers specifically to virgins/young unmarried women, and in context functions as a poetic social group in mourning.
    reason: lexical_alternative
  - marker: b
    text: '''Daughter Zion'' is a poetic personification of Zion/Jerusalem, preserved from the Hebrew rather than paraphrased away.'
    reason: cultural_note
translation:
  language: ko
  text: 딸 시온의 장로들은 땅에 앉아 잠잠합니다[b]. 그들은 머리에 티끌을 뿌리고 베옷을 입었으며, 예루살렘의 처녀들은 머리를 땅으로 숙였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘의 젊은 여성들’. 히브리어는 특히 처녀들 또는 미혼의 젊은 여성들을 가리키며, 여기서는 애도하는 한 사회 집단을 시적으로 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘딸 시온’은 시온/예루살렘을 의인화한 시적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ לָאָרֶץ יִדְּמוּ
  english_pob_choice: sit on the ground in silence
  chosen_korean: 땅에 앉아 침묵하고 있습니다
  alternatives_korean:
  - 땅에 앉아 있습니다
  - 땅에 앉아 잠잠합니다
  - 땅에 앉아 고요히 있습니다
  lexicon: HALOT
  rationale: ישב는 기본적으로 ‘앉다’이고, דמם은 이 탄식 문맥에서 ‘침묵하다/잠잠하다’의 상태를 나타내므로, 자세와 상태를 함께 살려 옮겼습니다.
- source_word: זִקְנֵי בַת צִיּוֹן
  english_pob_choice: the elders of daughter Zion
  chosen_korean: 시온의 딸의 장로들
  alternatives_korean:
  - 시온의 딸 장로들
  - 딸 시온의 장로들
  - 시온의 장로들
  lexicon: HALOT
  rationale: ‘시온의 딸’은 의인화된 시적 표현이므로 풀어 쓰지 않고 보존했습니다. זִקְנֵי는 단순한 나이보다 공동체적 지위를 함께 담아 ‘장로들’로 옮겼습니다.
- source_word: הֶעֱלוּ עָפָר עַל רֹאשָׁם חָגְרוּ שַׂקִּים
  english_pob_choice: have thrown dust on their heads and put on sackcloth
  chosen_korean: 머리에 먼지를 뿌렸고 베옷을 입었으며
  alternatives_korean:
  - 머리에 먼지를 던졌고 베옷을 둘렀으며
  - 머리 위에 먼지를 올렸고 베옷을 입었으며
  - 머리에 먼지를 뿌리고 베옷을 두르고
  lexicon: HALOT
  rationale: 장례·애도 표지인 관용구를 현대 한국어로 자연스럽게 살렸습니다. שַׂקִּים은 직역보다 관용적인 ‘베옷’이 의미를 분명히 전달합니다.
- source_word: בְּתוּלֹת יְרוּשָׁלִָם
  english_pob_choice: the virgins of Jerusalem
  chosen_korean: 예루살렘의 처녀들
  alternatives_korean:
  - 예루살렘의 젊은 여자들
  - 예루살렘의 소녀들
  - 예루살렘의 동정녀들
  lexicon: HALOT
  rationale: בְּתוּלֹת는 기본적으로 ‘처녀들/미혼 여성들’을 가리키므로, 현대어에서 가장 직접적인 ‘처녀들’을 유지했습니다.
theological_decisions:
- issue: ‘시온의 딸’의 의인화 보존 여부
  chosen_reading: 의인화된 시적 표현으로 유지했습니다.
  alternative_readings:
  - ‘시온의 주민들’처럼 집단 의미로 풀어쓰기
  - ‘예루살렘’으로 단순화
  rationale: 본문은 슬픔의 장면을 ‘시온의 딸’이라는 시적 인격화로 제시하므로, 의미를 평면화하지 않고 원문의 수사적 효과를 살렸습니다.
  doctrine_reference: 시적 예언 문맥의 문학적 형상 유지
- issue: בְּתוּלֹת의 번역 수위
  chosen_reading: ‘처녀들’로 옮겨 성별·혼인 상태의 표지를 분명히 했습니다.
  alternative_readings:
  - ‘젊은 여자들’
  - ‘소녀들’
  rationale: 본문의 사회적·시적 대비를 흐리지 않도록 어휘의 직접성을 유지했습니다.
  doctrine_reference: 어휘적 투명성 우선 원칙
