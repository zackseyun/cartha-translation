translation:
  language: ko
  text: 야훼여, 그들의 모욕과 저를 향한 그들의 모든 계략을 들으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 חֶרְפָּה는 ‘모욕’, ‘수치’, ‘치욕’을, מַחְשְׁבוֹת는 ‘생각’, ‘계획’, ‘계략’을 뜻할 수 있습니다. 여기서는 저자를 향한 적대적 맥락을 고려해 ‘모욕’과 ‘계략’으로 옮겼습니다.
    reason: lexical_alternative
