  verdict: revise
  source_fidelity: 첫 절의 ‘온 백성’은 히브리어 עַמִּי(‘내 백성’)의 1인칭 소유 접미사를 드러내지 않습니다. 또한 ‘그들의 노래가 온종일 이어집니다’는 원문의 명사적 병렬을 ‘노래의 지속’이라는 서술로 바꾸어, 화자가 그들의 노래/조롱 노래의 대상이 되었다는 뜻을 약화합니다.
  naturalness: ‘내 백성 모두에게’와 ‘온종일 그들의 노래가 되었습니다’는 현대 표준어 합쇼체로 자연스럽고, 히브리어의 병렬과 생략된 술어를 무리 없이 반영합니다.
  terminology: ‘웃음거리’는 שְׂחֹק에 적절합니다. נְגִינָתָם은 본문에서 ‘노래’로 두고 조롱의 가능성을 각주에 보존하는 것이 적절합니다.
