base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/014.yaml
  text: I have become a laughingstock to all my people[a], their song all day long.
  footnotes:
  - marker: a
    text: Or 'their taunt-song' or 'their mocking song.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 백성 모두에게 웃음거리가 되었고, 온종일 그들의 노래가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 조롱 노래’, ‘그들의 비웃는 노래’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי
  english_pob_choice: I have become
  chosen_korean: 나는 … 되었습니다
  alternatives_korean:
  - 나는 … 되었습니다
  - 나는 …이었습니다
  lexicon: WLC/HALOT
  rationale: 히브리어 완료형 1인칭 단수는 시편적 탄식 문맥에서 현재에 이어진 상태를 나타내므로, 단순 과거보다 결과 상태를 드러내는 표현으로 옮겼습니다.
- source_word: שְּׂחֹק
  english_pob_choice: a laughingstock
  chosen_korean: 웃음거리
  alternatives_korean:
  - 비웃음거리
  - 조롱거리
  - 웃음거리
  lexicon: HALOT
  rationale: 명사 שְׂחֹק은 단순한 ‘웃음’보다 조롱의 대상이라는 뜻이 강하므로, 한국어 관용 표현인 ‘웃음거리’가 predicative 용법을 자연스럽게 반영합니다.
- source_word: נְגִינָתָם
  english_pob_choice: their song
  chosen_korean: 그들의 노래
  alternatives_korean:
  - 그들의 조롱노래
  - 그들의 비웃는 노래
  - 그들의 노래
  lexicon: HALOT
  rationale: 기본 의미는 ‘노래/음악’이지만 문맥상 조롱 섞인 노래일 수 있으므로, 본문에는 중립적으로 두고 그 뉘앙스는 주석으로 보완했습니다.
- source_word: כָּל הַיּוֹם
  english_pob_choice: all day long
  chosen_korean: 온종일
  alternatives_korean:
  - 하루 종일
  - 온종일
  - 종일
  lexicon: HALOT
  rationale: 관용적 시간 표현을 현대 한국어에서 가장 자연스럽고 간결한 ‘온종일’로 옮겼습니다.
