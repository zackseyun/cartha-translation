  lexicon: HALOT
  rationale: 가리키는 대상을 넓게 열어 두는 지시대명사로, 문맥상 앞뒤 내용을 가리키는 ‘This’를 자연스럽게 받습니다.
- source_word: אָשִׁיב אֶל לִבִּי
  english_pob_choice: I call to mind
  chosen_korean: 내 마음에 되새깁니다
  alternatives_korean:
  - 내 마음으로 되돌립니다
  - 내 마음에 돌이킵니다
  - 기억해냅니다
  lexicon: HALOT
  rationale: 히필 שוב의 ‘되돌리다/가져오다’와 ‘마음/속사람’의 관용을 살리면서, 현대 한국어에서 자연스럽게 ‘마음에 다시 가져와 숙고하다’는 뜻을 전달합니다.
- source_word: עַל כֵּן
  english_pob_choice: therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그래서
  lexicon: HALOT
  rationale: 기억의 행위와 이어지는 결과를 나타내는 인과 접속으로, 문맥의 논리적 연결을 그대로 드러냅니다.
- source_word: אוֹחִיל
  english_pob_choice: I have hope
  chosen_korean: 나는 희망합니다
  alternatives_korean:
  - 나는 소망합니다
  - 나는 기다립니다
  - 나는 희망을 둡니다
  lexicon: HALOT
  rationale: 히필 יחל의 ‘희망하다/기대하다’는 의미를 살리되, 시적 문맥에서 지나치게 약하지 않은 표준어 표현으로 옮겼습니다.
theological_decisions:
- issue: לֵב/마음의 관용적 의미
  chosen_reading: ‘마음’은 감정보다 내적 기억과 숙고의 자리로 이해하여 ‘내 마음에 되새깁니다’로 옮겼습니다.
  alternative_readings:
  - 내 마음에 되돌립니다
  - 내 마음에 간직합니다
  rationale: 히브리어 לֵב는 단순한 감정 기관이 아니라 기억, 사유, 결단을 포함하므로, ‘되새기다’가 POB의 ‘call to mind’와 가장 가깝습니다.
  doctrine_reference: 성서 히브리어의 인지적 ‘마음’ 관용구
