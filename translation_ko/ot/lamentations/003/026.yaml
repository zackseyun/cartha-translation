  text: It is good to wait quietly for the salvation of Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'It is good to hope and be silent for the LORD’s salvation'; the Hebrew verb can carry the sense of hopeful waiting, and 'quietly' may also be rendered 'in silence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기다리며 조용히 야훼의 구원을 바라는 것이 좋습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘희망하며 침묵하는 것이 야훼의 구원을 바라는 것이다’로도 옮길 수 있습니다. 히브리어 동사는 희망하며 기다리는 뜻을 포함할 수 있고, ‘조용히’는 ‘침묵하며’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is good
  chosen_korean: …하는 것이 좋습니다
  alternatives_korean:
  - 좋습니다
  - 선합니다
  - 마땅합니다
  lexicon: HALOT
  rationale: 히브리어 형용사 טוב가 서술적 절로 쓰였으므로, 한국어에서는 자연스럽게 판단문으로 옮겨 ‘…하는 것이 좋습니다’라고 표현해 평가의 힘을 살렸습니다.
- source_word: יָחִיל
  english_pob_choice: to wait
  chosen_korean: 기다리며 … 바라는
  alternatives_korean:
  - 기다리다
  - 희망하며 기다리다
  - 기대하며 기다리다
  lexicon: HALOT
  rationale: יחל에는 단순 대기가 아니라 희망을 품은 기다림이 함께 있으므로, 본문과 각주를 살려 ‘기다리며 … 바라는’으로 옮겼습니다.
- source_word: דוּמָם
  english_pob_choice: quietly
  chosen_korean: 조용히
  alternatives_korean:
  - 침묵하며
  - 잠잠히
  - 소리 없이
  lexicon: HALOT
  rationale: 두맘은 침묵/고요의 부사로, 한국어에서는 문맥상 가장 자연스러운 ‘조용히’가 기다림의 태도를 잘 드러냅니다.
- source_word: לִתְשׁוּעַת יְהוָה
  english_pob_choice: for the salvation of Yahweh
  chosen_korean: 야훼의 구원을
  alternatives_korean:
  - 야훼의 구출을
  - 야훼의 구원을 기다리는
  - 주님의 구원을
  lexicon: HALOT
  rationale: תשועה는 구원/구출의 뜻을 가지며, כאן에서는 야훼에게서 오는 구원을 가리키므로 ‘야훼의 구원’이 본문의 신학적 무게를 가장 잘 보존합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 있는 신명사 표기 יְהוָה를 본문에서 직접 드러내기 위해 공용 번역 관행 대신 ‘야훼’를 사용했습니다. 이는 본문이 특정 호칭이 아니라 언약적 고유명을 말한다는 점을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
