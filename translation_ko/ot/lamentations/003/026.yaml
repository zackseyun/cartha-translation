  source_fidelity: 본문의 ‘기다리며 조용히 야훼의 구원을 바라는 것’은 히브리어의 중심 동사 יָחִיל(희망하며 기다리다)과 그 대상 ‘야훼의 구원’을 다소 중복되고 불분명하게 처리합니다. ‘야훼의 구원을 잠잠히 기다리는 것’이 원문의 구문과 의미를 더 정확히 반영합니다.
