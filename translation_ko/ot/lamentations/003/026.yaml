lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is good
  chosen_korean: …하는 것이 좋습니다
  alternatives_korean:
  - 좋습니다
  - 선합니다
  - 마땅합니다
  lexicon: HALOT
  rationale: 히브리어 형용사 טוב가 서술적 절로 쓰였으므로, 한국어에서는 자연스럽게 판단문으로 옮겨 ‘…하는 것이 좋습니다’라고 표현해 평가의 힘을 살렸습니다.
- source_word: יָחִיל
  english_pob_choice: to wait
  chosen_korean: 기다리며 … 바라는
  alternatives_korean:
  - 기다리다
