    rationale: בָּאֵפֶר는 기본적으로 ‘재 안에/재 가운데에서’를 뜻하며, 동사의 정확한 의미도 논쟁적입니다. 따라서 본문은 ‘재 속에’로 두어 불필요한 해석적 이동을 피하는 것이 안전합니다.
