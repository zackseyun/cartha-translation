id: LAM.3.16
reference: Lamentations 3:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּגְרֵ֤ס בֶּֽ/חָצָץ֙ שִׁנָּ֔/י הִכְפִּישַׁ֖/נִי בָּ/אֵֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/016.yaml
  text: He has ground my teeth with gravel[b][a]; he has pressed me down into the ashes.
  footnotes:
  - marker: a
    text: Or 'He has broken my teeth with pebbles.'
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'has pressed me down' is rare and may also be understood as 'has made me cower,' 'has humbled me,' or similarly 'has brought me low in ashes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 내 이빨을 자갈로 갈아버리셨고, 나를 재 속으로 짓눌러 놓으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자갈’은 여기서 치아를 갈아 손상시키는 작은 돌조각들의 이미지를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 희귀 동사 הִכְפִּישַׁנִי는 ‘나를 낮추다/굴복시키다’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגְרֵס
  english_pob_choice: has ground
  chosen_korean: 갈아버리셨고
  alternatives_korean:
  - 부숴버리셨고
  - 으깨버리셨고
  lexicon: HALOT
  rationale: 이 동사는 치아를 돌로 문질러 손상시키는 강한 이미지를 담고 있으므로, 한국어에서는 ‘갈다’를 써서 물리적 파괴감을 살렸습니다.
- source_word: בֶּחָצָץ
  english_pob_choice: with gravel
  chosen_korean: 자갈로
  alternatives_korean:
  - 조약돌로
  - 돌멩이로
  lexicon: HALOT
  rationale: חָצָץ는 작은 돌무더기나 자갈을 가리키므로, 문맥상 가장 직접적인 ‘자갈로’를 택했습니다.
- source_word: הִכְפִּישַׁנִי
  english_pob_choice: has pressed me down
  chosen_korean: 짓눌러 놓으셨습니다
  alternatives_korean:
  - 내리누르셨습니다
  - 낮추어 놓으셨습니다
  - 굴복시키셨습니다
  lexicon: HALOT
  rationale: 희귀 동사로서 물리적으로 눌러 낮추는 의미와 굴욕의 뉘앙스를 함께 담아야 하므로, ‘짓눌러 놓으셨습니다’로 옮겼습니다.
- source_word: בָּאֵפֶר
  english_pob_choice: into the ashes
  chosen_korean: 재 속으로
  alternatives_korean:
  - 재 가운데로
  - 재 안으로
  - 재 속에
  lexicon: HALOT
  rationale: אֵפֶר는 ‘재’이며, 전치사의 방향성을 살려 ‘속으로’로 옮기면 앞 동사와 함께 내려꽂히는 움직임이 드러납니다.
theological_decisions:
- issue: 시편적/애가적 과장 표현의 강도 유지
  chosen_reading: 고통의 신체적 이미지를 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 비유적으로 완화해 표현하기
  - ‘상하게 하셨다’처럼 일반화하기
  rationale: 본문은 비유가 아니라 극심한 고난을 감각적으로 제시하므로, 독자의 충격을 줄이기보다 원문의 절망감을 보존하는 쪽이 적절합니다.
  doctrine_reference: 애가 문학의 수사와 정서 보존
- issue: 하나님 주어의 한국어 높임
  chosen_reading: 주어를 ‘그분은’으로 두고 서술어에 높임을 적용했습니다.
  alternative_readings:
  - ‘주님께서’로 직접 명시하기
  - 무표지 3인칭으로 두기
  rationale: 문맥상 야훼의 행위를 가리키지만 직접 호칭은 아니므로, 3인칭 존칭을 사용해 경외를 나타내면서도 본문의 거리감을 유지했습니다.
  doctrine_reference: 직접 호칭과 서술적 지칭의 구분
