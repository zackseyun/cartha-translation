  source_fidelity: 첫 절은 자갈(חָצָץ)로 이를 갈아 부수는 강렬한 이미지를 충실히 보존합니다. 둘째 절의 희귀 동사 הִכְפִּישַׁנִי는 뜻이 확정적이지 않으므로, 본문에서는 물리적·굴욕적 의미를 모두 가능한 범위에서 유지하고 각주에서 대안을 밝혔습니다. בָּאֵפֶר의 전치사는 자체로 방향성을 확정하지 않으므로 ‘재 속에’가 ‘재 속으로’보다 원문에 더 절제되어 있습니다.
  naturalness: ‘이빨’보다 문어적 성경 문체에 어울리는 ‘이’를 사용하고, ‘짓눌러 놓으셨습니다’의 불필요한 완료·방치 뉘앙스는 ‘짓누르셨습니다’로 정리했습니다. ‘갈아 부수셨고’는 한국어에서 자갈로 치아가 손상되는 뜻을 자연스럽고 선명하게 전달합니다.
  terminology: ‘자갈’, ‘이’, ‘재’는 각각 חָצָץ, שִׁנַּי, אֵפֶר에 적절합니다. ‘그분께서는’과 합쇼체 높임은 현 문맥의 서술적 하나님 지칭과 일관됩니다.
