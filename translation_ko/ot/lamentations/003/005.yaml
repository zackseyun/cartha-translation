translation:
  language: ko
  text: 그분은 나를 대적하여 쌓으시고, 쓴 물질과 고난으로 나를 둘러싸셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘독성 있는 물질과 고난으로’; רֹאשׁ는 독성이 있거나 쓴 물질을 가리킬 수 있으며, 전통적으로는 ‘쓸개’로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그분은 나를 대적하여 쌓으셨습니다’입니다. 이 표현은 포위전의 이미지를 암시하는 것으로 보입니다.
    reason: source_note
lexical_decisions:
- source_word: בָּנָה עָלַי
  english_pob_choice: He has built against me
  chosen_korean: 저를 대적하여 성을 쌓고
  alternatives_korean:
  - 저를 대하여 쌓고
  - 저를 향해 쌓고
  - 저를 대적하여 세우고
  lexicon: HALOT
  rationale: בָּנָה는 문자적으로 ‘짓다/쌓다’이므로, 문맥의 포위 공격 이미지를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘성을 쌓고’로 옮겼습니다. עָלַי의 적대적 방향성은 ‘대적하여’로 반영했습니다.
- source_word: וַיַּקַּף
  english_pob_choice: surrounded me
  chosen_korean: 저를 둘러쌌습니다
  alternatives_korean:
  - 저를 에워쌌습니다
  - 저를 감쌌습니다
  - 저를 포위했습니다
  lexicon: HALOT
  rationale: 동사는 ‘둘러싸다/에워싸다’의 뜻이므로, 앞의 성 쌓기 이미지와 연결되게 ‘둘러쌌습니다’로 옮겼습니다.
- source_word: רֹאשׁ
  english_pob_choice: bitterness
  chosen_korean: 쓴 것
  alternatives_korean:
  - 쓴맛
  - 독
  - 쑥
  lexicon: HALOT
  rationale: רֹאשׁ는 이 문맥에서 쓴맛/쓴 물질/독성을 가리킬 수 있어, 해석을 과도하게 좁히지 않으면서도 한국어에서 시적이고 직접적인 표현인 ‘쓴 것’으로 옮겼습니다.
- source_word: וּתְלָאָה
  english_pob_choice: hardship
  chosen_korean: 고난
  alternatives_korean:
  - 수고
  - 곤고
  - 피로
  lexicon: HALOT
  rationale: 명사는 ‘고난, 수고, 고통’의 범위를 가지며, 앞의 ‘쓴 것’과 병렬을 이루는 압박의 의미를 살려 ‘고난’으로 번역했습니다.
theological_decisions:
- issue: 전쟁/포위 비유의 보존
  chosen_reading: 직역적 이미지를 유지해 ‘성을 쌓고… 둘러쌌습니다’로 번역했습니다.
  alternative_readings:
  - ‘포위했습니다’로 의미만 평탄화
  - ‘공격했습니다’로 비유를 약화
  rationale: 이 절은 단순한 감정 묘사보다 적대적 포위의 은유가 핵심이므로, 독자가 원문의 장면을 보도록 이미지성을 유지했습니다.
  doctrine_reference: 문학적-신학적 정직성 원칙
