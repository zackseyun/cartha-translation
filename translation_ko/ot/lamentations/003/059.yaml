reference: Lamentations 3:59
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָאִ֤יתָה יְהוָה֙ עַוָּ֣תָתִ֔/י שָׁפְטָ֖/ה מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/059.yaml
  text: You have seen[a], O Yahweh, the wrong done to me[b]; judge my case.
  footnotes:
  - marker: a
    text: Or "the injustice against me"; the Hebrew noun can denote wrong, distortion, or injustice.
    reason: lexical_alternative
  - marker: b
    text: Or "vindicate my cause."
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님께서는 제게 닥친 그릇됨을 보셨습니다. 제 사정을 판단해 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그릇됨’은 히브리어 עַוָּתָתִי의 의미 범위(왜곡, 불의, 잘못)를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사정’은 מִשְׁפָּטִי의 법정적 의미를 현대 한국어로 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה / יְהוָה
  english_pob_choice: You have seen, O Yahweh
  chosen_korean: 주님, 주님께서는…보셨습니다
  alternatives_korean:
  - 주님, 주님께서는…보셨습니다
  - 주님, 야훼께서는…보셨습니다
  lexicon: HALOT
  rationale: 직접 호소하는 משפט적(법정적) 탄원으로 읽혀 현재 완료의 뉘앙스를 살리되, 한국어는 자연스러운 과거완료형보다 ‘보셨습니다’로 간결하게 옮겼습니다. יְהוָה는 본문 원문 기준으로 고유명성이 강하지만, 시가 기도문맥에서 화자를 향한 직접 호칭은 ‘주님’이 가장 자연스럽습니다.
- source_word: עַוָּתָתִי
  english_pob_choice: the wrong done to me
  chosen_korean: 제게 닥친 그릇됨
  alternatives_korean:
  - 제게 닥친 불의
  - 제게 행해진 잘못
  - 제게 닥친 부당함
  lexicon: HALOT
  rationale: 이 단어는 화자의 자기 죄가 아니라 ‘당한 왜곡/그릇됨/불의’를 가리키므로, 원문의 피해자적 의미를 살려 ‘제게 닥친 그릇됨’으로 옮겼습니다. ‘그릇됨’은 도덕적 비난을 화자에게 돌리지 않으면서도 משפט적 억울함을 보존합니다.
- source_word: שָׁפְטָה
  english_pob_choice: judge my case
  chosen_korean: 제 사정을 판단해 주십시오
  alternatives_korean:
  - 제 일을 판결해 주십시오
  - 제 사건을 판단해 주십시오
  - 제 사정을 심판해 주십시오
  lexicon: HALOT
  rationale: 원문의 명령형은 하나님께 법정적 판정을 요청하는 표현이므로 ‘판단해 주십시오’로 옮겨 משפט적 의미를 유지했습니다. ‘제 사정’은 מִשְׁפָּטִי의 유연한 현대어 대응으로, 딱딱한 ‘사건’보다 탄원문맥에 자연스럽습니다.
- source_word: מִשְׁפָּטִי
  english_pob_choice: my case
  chosen_korean: 제 사정
  alternatives_korean:
  - 제 사건
  - 제 권리
  - 제 송사
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 추상적 ‘정의’보다 ‘법적 사안/호소의 건’에 가깝기 때문에, 현대 한국어의 자연스러운 법정·탄원 표현인 ‘사정’으로 처리했습니다. 이는 POB의 ‘my case’가 의도한 포괄적 법정 의미를 유지합니다.
theological_decisions:
- issue: YHWH의 한국어 표기와 기도문 호칭
  chosen_reading: 본문의 יְהוָה는 고유명성을 보존하되, 직접 탄원형 기도에서는 ‘주님’ 호칭으로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 야훼
  - 여호와
  - LORD
  rationale: 시적 탄원에서 반복되는 직접 호칭을 한국어 기도문체에 맞추면서도, 원문의 하나님 직접 호소라는 기능을 유지하기 위한 선택입니다. 독자에게는 신명기적 언약 이름의 엄숙함보다 간구의 음성이 더 전면에 드러납니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: עַוָּתָתִי의 피해자적 의미
  chosen_reading: 이 표현은 화자의 도덕적 과오가 아니라 그가 당한 부당함을 가리킨다고 보아 ‘제게 닥친 그릇됨’으로 번역했습니다.
  alternative_readings:
  - 제 죄
  - 제 잘못
  - 제 불의
  rationale: 문맥의 법정적 병행구(‘제 사정을 판단해 주십시오’)상, 화자는 자신의 죄를 고백하는 것이 아니라 억울한 처지를 호소하고 있습니다. 이를 보존해야 탄원의 신학적 방향이 뒤집히지 않습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1, #3'
