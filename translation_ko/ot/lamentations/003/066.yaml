revisions:
- from: 주께서는 그들을 분노로 추적하시고, 야훼의 하늘 아래에서 그들을 멸하실 것입니다.[a][b]
  to: 주께서는 분노로 그들을 뒤쫓으시고, 야훼의 하늘 아래에서 그들을 멸하실 것입니다.[a][b]
  rationale: ‘추적하시고’를 직접적 추격을 뜻하는 ‘뒤쫓으시고’로 바꾸어 원문의 רדף를 더 자연스럽고 정확하게 반영했습니다. 미완료형의 미래적 번역은 영어 POB의 주된 선택과 같이 본문에 유지하되, 기도적 청원이라는 유력한 대안은 각주에서 보존했습니다. 야훼의 이름, 멸망 동사의 강도, 그리고 ‘하늘 아래’의 시적 공간 표현은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:37:01Z'
