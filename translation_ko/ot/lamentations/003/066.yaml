id: LAM.3.66
reference: Lamentations 3:66
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תִּרְדֹּ֤ף בְּ/אַף֙ וְ/תַשְׁמִידֵ֔/ם מִ/תַּ֖חַת שְׁמֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/066.yaml
  text: You will pursue them in anger and destroy them from under the heavens of Yahweh[a][b].
  footnotes:
  - marker: a
    text: Or, 'May you pursue them in anger and destroy them,' reflecting the prayer-like force of the Hebrew imperfect verbs.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'from under the heavens of the LORD,' a poetic expression for total removal from the world under God's heavens.
    reason: cultural_note
translation:
  language: ko
  text: 주께서는 분노로 그들을 뒤쫓으시고, 야훼의 하늘 아래에서 그들을 멸하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분노로 그들을 뒤쫓으시고 멸하소서.’ 히브리어 미완료형은 기도와 같은 청원의 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘야훼의 하늘들 아래에서’입니다. 야훼의 하늘 아래에 있는 세상에서 완전히 제거됨을 나타내는 시적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: תִּרְדֹּף
  english_pob_choice: You will pursue
  chosen_korean: 추적하시고
  alternatives_korean:
  - 뒤쫓으시고
  - 추격하시고
  - 쫓으시고
  lexicon: HALOT
  rationale: 히브리어 동사 רדף의 구체적 의미를 살리면서, 기도문 맥락의 직접 호소를 자연스럽게 담기 위해 ‘추적하시고’로 옮겼습니다.
- source_word: בְּאַף
  english_pob_choice: in anger
  chosen_korean: 분노로
  alternatives_korean:
  - 진노로
  - 노여움 가운데
  - 분노 가운데
  lexicon: HALOT
  rationale: 전치사 ב의 수단·동반 의미를 한국어 조사로 과도하게 풀기보다, 감정의 상태를 간결하게 드러내는 ‘분노로’가 시의적절합니다.
- source_word: וְתַשְׁמִידֵם
  english_pob_choice: and destroy them
  chosen_korean: 그들을 멸하실 것입니다
  alternatives_korean:
  - 그들을 파멸시키실 것입니다
  - 그들을 멸망시키실 것입니다
  - 그들을 없애실 것입니다
  lexicon: HALOT
  rationale: שׁמד의 강한 파괴 의미를 유지하면서도, 현대 한국어에서 성경 문체로 자연스러운 동사인 ‘멸하다’를 택했습니다.
- source_word: שְׁמֵי יְהוָה
  english_pob_choice: the heavens of Yahweh
  chosen_korean: 야훼의 하늘
  alternatives_korean:
  - 야훼의 하늘들
  - 야훼의 하늘 아래
  - 야훼의 하늘들 아래
  lexicon: HALOT
  rationale: 시적 표현인 ‘하늘들/하늘’의 중의성을 살리되, 한국어에서는 소유격 구조가 가장 자연스러워 ‘야훼의 하늘’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 고유명사 יְהוָה를 직접 사용하므로, POB 기준에 따라 제목화된 대체어가 아니라 이름 자체를 드러내는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 기도문 안의 히브리어 미완료형
  chosen_reading: 미래형처럼 들리는 청원적 진술(‘멸하실 것입니다’)
  alternative_readings:
  - ‘멸하소서’의 청유형
  - ‘멸하시리이다’의 예언형
  rationale: 문맥상 화자가 하나님께 드리는 호소이지만, 한국어 합쇼체에서는 직설적인 청유보다 미래형 진술이 시적 긴장과 엄숙함을 더 잘 유지합니다.
  doctrine_reference: 문맥상 기도/탄식시의 volitive imperfect
