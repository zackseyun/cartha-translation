- source_word: נָשִׁיתִי טוֹבָה
  english_pob_choice: I have forgotten goodness
  chosen_korean: 선함을 잊었습니다
  alternatives_korean:
  - 좋은 것을 잊었습니다
  - 복을 잊었습니다
  - 번영을 잊었습니다
  lexicon: HALOT
  rationale: טוֹבָה를 특정한 물질적 번영으로 좁히지 않고, POB의 ‘goodness’에 맞춰 ‘선함’으로 번역해 의미 범위를 보존했습니다.
theological_decisions:
- issue: 3인칭 여성형 동사로 시작하지만 의미상 화자는 하나님을 향해 말하고 있습니다.
  chosen_reading: 직접 호칭을 덧붙여 ‘주께서는’으로 옮겨, 시적 탄원의 대상을 분명히 했습니다.
  alternative_readings:
  - 그분은
  - 당신은
  rationale: 문맥상 lament의 수신자는 하나님이므로, 한국어에서 자연스러운 기도/탄식의 직접 호칭을 사용해 원문의 호소력을 살렸습니다.
  doctrine_reference: 시편적 탄식의 화자-청자 관계
- issue: שָׁלוֹם의 범위를 ‘평강’으로 유지할지 ‘평화/안녕’으로 풀어낼지
  chosen_reading: ‘평강’을 택해 전인적 안녕과 관계적 평화를 함께 담도록 했습니다.
  alternative_readings:
  - 평화
  - 안녕
  - 복지
  rationale: 이 구절은 상실된 삶의 상태 전체를 말하므로, 교회적 관용과 본문 의미를 함께 살리는 ‘평강’이 가장 적합합니다.
  doctrine_reference: 샬롬의 전인적 의미
