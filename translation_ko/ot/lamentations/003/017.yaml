id: LAM.3.17
reference: Lamentations 3:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּזְנַ֧ח מִ/שָּׁל֛וֹם נַפְשִׁ֖/י נָשִׁ֥יתִי טוֹבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/017.yaml
  text: You have thrust my soul away from peace[c][b][a]; I have forgotten goodness.
  footnotes:
  - marker: a
    text: Or, 'You rejected my soul from peace,' or more idiomatically, 'my soul is deprived of peace.'
    reason: lexical_alternative
  - marker: b
    text: '''Peace'' translates Hebrew shalom, which can also mean well-being or wholeness.'
    reason: lexical_alternative
  - marker: c
    text: Or simply, 'I have forgotten good/prosperity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 제 영혼을 평강에서 밀어내셨고[a][b], 저는 선함을 잊었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘주께서는 제 영혼을 평강에서 거절하셨습니다’ 혹은 더 관용적으로, ‘제 영혼은 평강을 박탈당했습니다’.
    reason: lexical_alternative
  - marker: b
    text: ‘평강’은 히브리어 샬롬을 옮긴 것으로, 평화뿐 아니라 안녕과 온전함까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 단순히, ‘좋음/번영을 잊었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנַח
  english_pob_choice: You have thrust away
  chosen_korean: 밀어내셨고
  alternatives_korean:
  - 버리셨고
  - 내치셨고
  - 거절하셨고
  lexicon: HALOT
  rationale: זנח의 핵심은 단순 거절보다 강한 ‘내침/배척’의 뉘앙스이므로, 관계적·정서적 단절을 살리는 ‘밀어내셨고’로 옮겼습니다.
- source_word: מִשָּׁלוֹם
  english_pob_choice: from peace
  chosen_korean: 평강에서
  alternatives_korean:
  - 평화에서
  - 안녕에서
  - 복지에서
  lexicon: HALOT
  rationale: שָׁלוֹם의 기본값인 ‘평강’을 유지하되, 시적 문맥에서 내적·전인적 안녕까지 포괄하도록 했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 제 영혼
  alternatives_korean:
  - 제 목숨
  - 저 자신
  - 제 생명
  lexicon: HALOT
  rationale: 히브리어 נֶפֶשׁ의 인격적·내면적 의미를 살리기 위해 ‘영혼’을 택했고, 1인칭 시적 탄식을 자연스럽게 표현했습니다.
- source_word: נָשִׁיתִי טוֹבָה
  english_pob_choice: I have forgotten goodness
  chosen_korean: 선함을 잊었습니다
  alternatives_korean:
  - 좋은 것을 잊었습니다
  - 복을 잊었습니다
  - 번영을 잊었습니다
  lexicon: HALOT
  rationale: טוֹבָה를 특정한 물질적 번영으로 좁히지 않고, POB의 ‘goodness’에 맞춰 ‘선함’으로 번역해 의미 범위를 보존했습니다.
theological_decisions:
- issue: 3인칭 여성형 동사로 시작하지만 의미상 화자는 하나님을 향해 말하고 있습니다.
  chosen_reading: 직접 호칭을 덧붙여 ‘주께서는’으로 옮겨, 시적 탄원의 대상을 분명히 했습니다.
  alternative_readings:
  - 그분은
  - 당신은
  rationale: 문맥상 lament의 수신자는 하나님이므로, 한국어에서 자연스러운 기도/탄식의 직접 호칭을 사용해 원문의 호소력을 살렸습니다.
  doctrine_reference: 시편적 탄식의 화자-청자 관계
- issue: שָׁלוֹם의 범위를 ‘평강’으로 유지할지 ‘평화/안녕’으로 풀어낼지
  chosen_reading: ‘평강’을 택해 전인적 안녕과 관계적 평화를 함께 담도록 했습니다.
  alternative_readings:
  - 평화
  - 안녕
  - 복지
  rationale: 이 구절은 상실된 삶의 상태 전체를 말하므로, 교회적 관용과 본문 의미를 함께 살리는 ‘평강’이 가장 적합합니다.
  doctrine_reference: 샬롬의 전인적 의미
