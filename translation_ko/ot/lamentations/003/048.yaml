  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּלְגֵי מַ֨יִם֙ תֵּרַ֣ד עֵינִ֔/י עַל שֶׁ֖בֶר בַּת עַמִּֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/048.yaml
  text: Streams of water run down from my eyes over the destruction of the daughter of my people[a][b].
  footnotes:
  - marker: a
    text: Or 'the ruin' or 'the brokenness of the daughter of my people.'
    reason: lexical_alternative
  - marker: b
    text: '''The daughter of my people'' is a Hebrew poetic expression personifying the people, often Zion/Judah, as a daughter.'
    reason: cultural_note
translation:
  language: ko
  text: 내 눈에서 물의 시내가 흘러내립니다. 그것은 내 백성의 딸의 무너짐 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물의 시내’는 히브리어의 시적 이미지로, 눈물의 흐름을 강물처럼 묘사한 표현입니다.
    reason: source_note
  - marker: b
    text: ‘내 백성의 딸’은 히브리어의 관용적 의인화로, 종종 시온 또는 유다 공동체를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  english_pob_choice: Streams of water
  chosen_korean: 물의 시내
  alternatives_korean:
  - 물줄기
  - 물의 흐름
  - 물의 개울
  lexicon: HALOT
  rationale: פַּלְגֵי מַיִם는 시적 표현으로 물이 갈라져 흐르는 모습을 가리키므로, 자연스럽고 비유를 살릴 수 있는 ‘물의 시내’로 옮겼습니다.
- source_word: תֵּרַד
  english_pob_choice: run down
  chosen_korean: 흘러내립니다
  alternatives_korean:
  - 내려갑니다
  - 흐릅니다
  - 쏟아집니다
  lexicon: HALOT
  rationale: 동사 ירד의 ‘내려가다’라는 방향성을 눈물의 흐름에 맞게 살려, 한국어에서는 ‘흘러내리다’가 가장 직접적이고 자연스럽습니다.
- source_word: שֶׁבֶר
  english_pob_choice: the destruction
  chosen_korean: 무너짐
  alternatives_korean:
  - 파괴
  - 파멸
  - 파손
  lexicon: HALOT
  rationale: שֶׁבֶר은 문맥상 공동체의 붕괴와 재난을 가리키므로, 추상적 내면 상태보다 외적인 재앙을 드러내는 ‘무너짐’이 적절합니다.
- source_word: בַּת עַמִּי
  english_pob_choice: the daughter of my people
  chosen_korean: 내 백성의 딸
  alternatives_korean:
  - 내 백성의 딸
  - 내 백성의 여인
  - 내 백성의 자녀
  lexicon: HALOT
  rationale: 히브리어의 의인화 표현을 그대로 살려, 공동체를 ‘딸’로 부르는 애가의 수사를 보존했습니다.
theological_decisions:
- issue: 의인화된 표현 בַּת עַמִּי를 어떻게 처리할지
  chosen_reading: 공동체를 지칭하는 시적 의인화를 유지해 ‘내 백성의 딸’로 직역하였습니다.
  alternative_readings:
  - 내 백성
  - 내 백성의 딸인 예루살렘
  - 내 사랑하는 백성
  rationale: 본문은 개인적 감정이 아니라 공동체/도시의 재난을 애가로 표현하므로, 비유를 풀어쓰지 않고 그대로 보존하는 편이 원문의 정서를 더 정확히 전달합니다.
  doctrine_reference: 애가의 시적 의인화와 공동체 탄식
