  rationale: 직역투인 ‘물의 시내’를 자연스러운 시적 표현인 ‘물줄기’로 바꾸고, 원문의 인과 관계를 직접 연결했습니다. ‘내 백성의 딸’이라는 의인화는 보존했으며, שֶׁבֶר의 의미 범위는 ‘파멸’과 주석의 대안 번역으로 충실하게 반영했습니다. 주석 표지는 각각 해당 표현 바로 뒤에 두어 연결 대상을 분명히 했습니다.
  reviewer_model: gpt-5.6-terra
