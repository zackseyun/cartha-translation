lexical_decisions:
- source_word: צ֥וֹד צָד֛וּ/נִי
  english_pob_choice: hunted me
  chosen_korean: 사냥하였습니다
  alternatives_korean:
  - 뒤쫓았습니다
  - 추적하였습니다
  - 사냥하듯 쫓아왔습니다
  lexicon: HALOT
  rationale: 어근 צוד의 사냥·추적 이미지를 살리되, 한국어에서 자연스럽고 문어체에 맞는 동사를 택했습니다. "사냥하였습니다"는 대상이 단순히 따라온 것이 아니라 적대적으로 먹잇감처럼 몰아붙였다는 점을 드러냅니다.
- source_word: כַּ/צִּפּ֖וֹר
  english_pob_choice: like a bird
  chosen_korean: 새처럼
  alternatives_korean:
  - 한 마리 새처럼
  - 참새처럼
  - 새를 사냥하듯
  lexicon: HALOT
  rationale: צִפּוֹר는 특정 종이 아니라 일반적인 작은 새를 가리키므로, 과도한 구체화 없이 "새처럼"으로 옮겼습니다. 비유 구조를 그대로 유지합니다.
- source_word: אֹיְבַ֥/י
  english_pob_choice: my enemies
  chosen_korean: 원수들이
  alternatives_korean:
  - 적들이
  - 내 원수들이
  - 내 적들이
  lexicon: HALOT
  rationale: 히브리어의 복수형 소유 표현을 자연스럽게 한국어 주어로 옮기되, 시편적·예언서적 적대 관계의 강도를 살리기 위해 "원수들"을 택했습니다.
- source_word: חִנָּֽם
  english_pob_choice: without cause
  chosen_korean: 아무 까닭 없이
  alternatives_korean:
  - 무고하게
  - 이유 없이
  - 헛되이
  lexicon: HALOT
  rationale: חִנָּם은 정당한 이유 없는 적대라는 도덕적 주장입니다. "아무 까닭 없이"는 이 억울함을 현대 한국어로 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 원수의 추적을 나타내는 사냥 은유
  chosen_reading: ‘사냥하였습니다’로 적대적 추격과 포획 의도를 분명히 드러냈습니다.
  alternative_readings:
  - 뒤쫓았습니다
  - 추적하였습니다
  - 사냥하듯 쫓아왔습니다
  rationale: 본문의 동사는 단순 이동이 아니라 먹잇감을 겨냥한 공격적 추적을 뜻하므로, 은유를 약화시키지 않는 번역을 선택했습니다.
  doctrine_reference: 시편적 탄식과 박해 묘사의 수사적 정직성
- issue: ‘without cause’의 윤리적 평가
  chosen_reading: ‘아무 까닭 없이’로 번역해, 적대가 정당하지 않다는 고발을 유지했습니다.
  alternative_readings:
  - 무고하게
  - 이유 없이
  - 헛되이
  rationale: 이 표현은 단순한 사정 설명이 아니라 억울한 박해를 선언하는 말이므로, 원문의 윤리적 긴장을 보존해야 합니다.
  doctrine_reference: 의인/피해자의 무고한 고난을 말하는 탄식 전통
