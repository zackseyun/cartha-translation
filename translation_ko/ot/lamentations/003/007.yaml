base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/007.yaml
  text: He has walled me in so that I cannot get out[a]; he has made my chain heavy.
  footnotes:
  - marker: a
    text: Or 'my bronze fetter' or simply 'my chain.' The Hebrew term is related to 'bronze' and likely refers to a metal restraint.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 나를 둘러쌓아 내가 나갈 수 없게 하셨습니다. 그가 내 놋 쇠사슬을 무겁게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 놋 족쇄’ 또는 단순히 ‘내 쇠사슬’로 옮길 수 있습니다. 히브리어는 ‘놋/구리’와 관련된 금속 구속구를 가리키는 말로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר בַּעֲדִי
  english_pob_choice: has walled me in
  chosen_korean: 나를 둘러쌓아
  alternatives_korean:
  - 나를 둘러막아
  - 나를 둘러싸서
  - 나를 가두어
  lexicon: HALOT
  rationale: גָּדַר는 둘러막아 울타리나 담을 치는 이미지를 가지므로, 한국어도 물리적 포위감을 살리는 ‘둘러쌓다’로 옮겼습니다.
- source_word: וְלֹא אֵצֵא
  english_pob_choice: so that I cannot get out
  chosen_korean: 내가 나갈 수 없게
  alternatives_korean:
  - 내가 나가지 못하게
  - 내가 빠져나갈 수 없게
  - 내가 도망칠 수 없게
  lexicon: HALOT
  rationale: 직역하면 ‘내가 나가지 못한다’이지만, 문맥상 봉쇄 결과를 자연스럽게 드러내는 ‘나갈 수 없게’가 원문의 제약을 잘 전달합니다.
- source_word: הִכְבִּיד
  english_pob_choice: has made ... heavy
  chosen_korean: 무겁게 하셨습니다
  alternatives_korean:
  - 무겁게 만드셨습니다
  - 짐지게 하셨습니다
  - 더 무겁게 하셨습니다
  lexicon: HALOT
  rationale: 히필형의 기본 뜻인 ‘무겁게 하다’를 그대로 살려, 구체적 물체의 무게가 증가한 이미지를 유지했습니다.
- source_word: נְחָשְׁתִּי
  english_pob_choice: my chain / my bronze fetter
  chosen_korean: 내 놋 쇠사슬
  alternatives_korean:
  - 내 놋 족쇄
  - 내 쇠사슬
  - 내 놋 사슬
  lexicon: HALOT
  rationale: 어근이 ‘놋/구리’와 연결되며 금속 구속구를 가리킬 가능성이 크므로, 재질을 보존하되 한국어에서 자연스러운 구속 장치인 ‘쇠사슬’로 옮겼습니다.
theological_decisions:
- issue: 시편/애가 특유의 수동적 피동 구조를 한국어에서 어떻게 살릴지
  chosen_reading: 주어를 하나님으로 분명히 밝히는 존칭 수동 표현을 사용했습니다.
  alternative_readings:
  - 그가 나를 둘러쌌습니다
  - 그가 나를 가두셨습니다
  rationale: 히브리어는 행위자를 생략하지 않으므로, 문맥상 하나님이 하신 일이라는 점을 드러내면서도 원문의 강한 억압 이미지를 보존했습니다.
  doctrine_reference: '문학적-신학적 일치: 탄식시의 주권적 행위 표지 보존'
