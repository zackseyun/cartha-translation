translation:
  language: ko
  text: 그가 나를 둘러막으셔서 나는 나갈 수 없습니다. 그가 내 놋 사슬[a]을 무겁게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 놋 족쇄’ 또는 단순히 ‘내 사슬’로 옮길 수 있습니다. 히브리어 표현은 ‘놋/구리’와 관련되어 있으며, 여기서는 금속 구속구를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר בַּעֲדִי
  english_pob_choice: has walled me in
  chosen_korean: 나를 둘러쌓아
  alternatives_korean:
