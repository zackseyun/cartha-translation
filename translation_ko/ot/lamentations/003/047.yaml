  text: Terror and pitfall have come upon us, devastation and destruction.
translation:
  language: ko
  text: 두려움과 함정이 우리에게 닥쳤고, 황폐와 파멸이 닥쳤습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘두려움과 함정’입니다. 영어 POB는 후자를 ‘pitfall’로 풀어 재난의 함정성을 강조했습니다.
