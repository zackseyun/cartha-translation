lexical_decisions:
- source_word: פַּחַד
  english_pob_choice: Terror
  chosen_korean: 두려움
  alternatives_korean:
  - 공포
  - 경악
  - 테러
  lexicon: פַּחַד
  rationale: 시편·예레미야계의 재난 문맥에서 일반적 심리 상태로서의 두려움을 자연스럽게 살리되, 현대 한국어에서 과도하게 폭력적 뉘앙스가 있는 ‘테러’는 피했습니다.
- source_word: וָפַחַת
  english_pob_choice: pitfall
  chosen_korean: 함정
  alternatives_korean:
  - 올무
  - 구덩이
  - 덫
  lexicon: פַּחַת
  rationale: 영어 POB의 ‘pitfall’은 단순한 물리적 구덩이보다 떨어지게 만드는 위험한 덫의 이미지를 전하므로, 표준 한국어에서 그 위협성을 유지하는 ‘함정’이 가장 가깝습니다.
- source_word: הַשֵּׁאת
  english_pob_choice: devastation
  chosen_korean: 황폐
  alternatives_korean:
  - 황폐함
  - 파괴
  - 유린
  lexicon: שׁאה
  rationale: 폐허가 된 상태를 가리키는 재난 표현으로서, 명사형 ‘황폐’가 문맥의 상태성과 응축된 시적 힘을 함께 살립니다.
- source_word: וְהַשָּׁבֶר
  english_pob_choice: destruction
  chosen_korean: 파멸
  alternatives_korean:
  - 파괴
  - 멸망
  - 붕괴
  lexicon: שׁבר
  rationale: ‘파멸’은 뒤따르는 파괴의 결과와 최종성을 함께 드러내며, 앞의 ‘황폐’와도 어울리는 대구를 이룹니다.
theological_decisions:
- issue: 재난의 누적을 묘사하는 시적 병렬
  chosen_reading: ‘두려움과 함정’, ‘황폐와 파멸’을 병렬로 살려, 단순한 사건 나열이 아니라 포위된 공동체가 겪는 총체적 붕괴를 드러냈습니다.
  alternative_readings:
  - ‘공포와 덫’처럼 더 직설적으로 재난 도상을 살리는 읽기
  - ‘두려움과 구덩이’처럼 문자상을 더 가까이 옮기는 읽기
  rationale: 히브리어 원문의 짧고 겹치는 재난 이미지가 핵심이므로, 시적 압축을 유지하면서도 한국어에서 자연스러운 대칭 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 예레미야애가 3:47의 탄식 시학
