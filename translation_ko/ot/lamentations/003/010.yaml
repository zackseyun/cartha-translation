translation:
  language: ko
  text: 그는 나를 노리는 곰이며, 은밀한 곳의 사자입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은밀한 곳에 있는 사자’로도 옮길 수 있습니다.
