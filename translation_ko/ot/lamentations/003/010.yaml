lexical_decisions:
- source_word: דֹּב
  english_pob_choice: bear
  chosen_korean: 곰
  alternatives_korean:
  - 호랑이
  - 곰 한 마리
  lexicon: HALOT
  rationale: 히브리어 דֹּב는 곰을 뜻하므로 직역해 이미지의 거침과 위협성을 살렸습니다.
- source_word: אֹרֵב
  english_pob_choice: lying in wait
  chosen_korean: 노리는
  alternatives_korean:
  - 매복하는
  - 숨어 기다리는
  lexicon: HALOT
  rationale: 분사형 ארב는 공격할 기회를 엿보며 매복하는 동작을 나타내므로, 현대 한국어에서 자연스럽고 공격 의도를 드러내는 ‘노리는’으로 옮겼습니다.
- source_word: לִי
  english_pob_choice: for me
  chosen_korean: 나를
  alternatives_korean:
  - 나에게
  - 나를 향해
  lexicon: HALOT
  rationale: 문맥상 단순 방향이 아니라 적대적 표적을 가리키므로, 한국어에서는 ‘나를 노리는’으로 연결해 자연스럽게 처리했습니다.
- source_word: אַרְיֵה
  english_pob_choice: a lion
  chosen_korean: 사자
  alternatives_korean:
  - 한 사자
  - 사자 한 마리
  lexicon: HALOT
  rationale: 평행법을 살리기 위해 한국어에서는 관사를 따로 두지 않고 명사만 써서 서술적 이미지를 유지했습니다.
- source_word: בְּמִסְתָּרִים
  english_pob_choice: in hiding places
  chosen_korean: 은밀한 곳의
  alternatives_korean:
  - 숨은 곳의
  - 비밀한 곳의
  lexicon: HALOT
  rationale: 복수형 장소 표현 מִסְתָּרִים는 ‘숨은/은밀한 곳들’을 뜻하므로, 시적 병렬 구조에 맞게 ‘은밀한 곳의’로 압축했습니다.
theological_decisions:
- issue: 히브리어 시문의 병렬 은유 보존
  chosen_reading: ‘곰’과 ‘사자’의 이중 동물을 그대로 유지해 시인이 느끼는 위협의 중첩을 드러냈습니다.
  alternative_readings:
  - 둘 중 하나를 완화해 자연화하는 번역
  - 동물을 설명적으로 풀어 쓰는 번역
  rationale: 본문은 두 겹의 포식자 이미지를 나란히 놓아 공포를 강화하므로, 이를 약화하지 않는 것이 원문의 효과를 살립니다.
  doctrine_reference: 시적 은유의 직접성 보존
- issue: 전치사 לִי의 적대적 방향성
  chosen_reading: ‘나를 노리는’으로 옮겨 화자의 표적성을 분명히 했습니다.
  alternative_readings:
  - ‘나에게’
  - ‘내게’
  rationale: 단순한 수혜/방향이 아니라 공격의 대상으로 향하는 관계이므로, 문맥상 적대성을 드러내는 번역이 더 정확합니다.
  doctrine_reference: 문맥 우선의 의미역 처리
