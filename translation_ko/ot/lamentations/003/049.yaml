  lexicon: HALOT
  rationale: 히브리어는 1인칭 단수 소유의 단수형이므로, 시적 탄식의 관용적 용법을 살려 ‘내 눈’으로 옮겼습니다. 한국어에서도 단수로 눈물 흘림의 기관을 지시할 수 있습니다.
- source_word: נִגְּרָה
