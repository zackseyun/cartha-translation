  lexicon: HALOT
  rationale: 눈물의 아래로 흐름을 구체적으로 살리되, ‘runs down’의 동적 이미지를 자연스러운 현대 한국어로 재현했습니다.
- source_word: תִדְמֶה
  english_pob_choice: cease
  chosen_korean: 그치지 않습니다
  alternatives_korean:
  - 멈추지 않습니다
  - 잠잠해지지 않습니다
  - 쉬지 않습니다
  lexicon: HALOT
  rationale: 문맥상 눈물이 계속 흐른다는 뜻이므로 ‘그치다’가 중단의 의미를 가장 직접적으로 전달합니다. ‘잠잠해지다’는 소리의 이미지가 강해 덜 적합합니다.
- source_word: הֲפֻגוֹת
  english_pob_choice: interruption
  chosen_korean: 쉼 없이
  alternatives_korean:
  - 중단 없이
  - 휴식 없이
  - 멈춤 없이
  lexicon: HALOT
  rationale: 마지막 명사는 ‘멈춤/휴지/숨고르기’의 결핍을 가리키므로, 한국어에서는 부사구로 압축해 앞 절의 ‘그치지 않습니다’와 의미를 겹쳐 강화했습니다.
theological_decisions:
