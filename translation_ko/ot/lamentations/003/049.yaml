  chosen_reading: ‘그치지 않습니다’와 ‘쉼 없이’를 병치해, 눈물의 지속성과 중단 부재를 모두 드러냈습니다.
  alternative_readings:
  - ‘멈추지 않습니다, 쉬지 않고’
  - ‘중단되지 않습니다, 쉼도 없이’
  rationale: 본문은 단순한 순간적 흐름이 아니라 끊임없는 애통을 강조하므로, 동사와 부사구를 함께 써서 원문의 정서를 보존했습니다.
  doctrine_reference: 애가 3장의 탄식 문맥
