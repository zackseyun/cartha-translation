  text: עֵינִ֧/י נִגְּרָ֛ה וְ/לֹ֥א תִדְמֶ֖ה מֵ/אֵ֥ין הֲפֻגֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/049.yaml
  text: My eye runs down and does not cease[a], without interruption,
  footnotes:
  - marker: a
    text: Or 'My eye flows and is not still, without respite.' The Hebrew verb rendered 'cease' can also carry the sense 'be still,' and the final noun can be rendered 'pause,' 'respite,' or 'relief.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 눈이 흘러내리고 그치지 않습니다[a], 쉼 없이.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 눈이 흘러내리고 잠잠하지 않습니다, 쉼 없이’라고 옮길 수 있습니다. 히브리어 동사는 ‘그치다’ 외에 ‘잠잠하다’의 뜻도 지니며, 끝의 명사는 ‘멈춤’, ‘휴지’, ‘숨 고르기’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינִי
  english_pob_choice: My eye
  chosen_korean: 내 눈
  alternatives_korean:
  - 내 눈들
  lexicon: HALOT
  rationale: 히브리어는 1인칭 단수 소유의 단수형이므로, 시적 탄식의 관용적 용법을 살려 ‘내 눈’으로 옮겼습니다. 한국어에서도 단수로 눈물 흘림의 기관을 지시할 수 있습니다.
- source_word: נִגְּרָה
  english_pob_choice: runs down
  chosen_korean: 흘러내리고
  alternatives_korean:
  - 내려가고
  - 줄줄 흘러
  - 흘러내려
  lexicon: HALOT
  rationale: 눈물의 아래로 흐름을 구체적으로 살리되, ‘runs down’의 동적 이미지를 자연스러운 현대 한국어로 재현했습니다.
- source_word: תִדְמֶה
  english_pob_choice: cease
  chosen_korean: 그치지 않습니다
  alternatives_korean:
  - 멈추지 않습니다
  - 잠잠해지지 않습니다
  - 쉬지 않습니다
  lexicon: HALOT
  rationale: 문맥상 눈물이 계속 흐른다는 뜻이므로 ‘그치다’가 중단의 의미를 가장 직접적으로 전달합니다. ‘잠잠해지다’는 소리의 이미지가 강해 덜 적합합니다.
- source_word: הֲפֻגוֹת
  english_pob_choice: interruption
  chosen_korean: 쉼 없이
  alternatives_korean:
  - 중단 없이
  - 휴식 없이
  - 멈춤 없이
  lexicon: HALOT
  rationale: 마지막 명사는 ‘멈춤/휴지/숨고르기’의 결핍을 가리키므로, 한국어에서는 부사구로 압축해 앞 절의 ‘그치지 않습니다’와 의미를 겹쳐 강화했습니다.
theological_decisions:
- issue: 시적 탄식에서 반복적 무중단 상태를 어떻게 드러낼지
  chosen_reading: ‘그치지 않습니다’와 ‘쉼 없이’를 병치해, 눈물의 지속성과 중단 부재를 모두 드러냈습니다.
  alternative_readings:
  - ‘멈추지 않습니다, 쉬지 않고’
  - ‘중단되지 않습니다, 쉼도 없이’
  rationale: 본문은 단순한 순간적 흐름이 아니라 끊임없는 애통을 강조하므로, 동사와 부사구를 함께 써서 원문의 정서를 보존했습니다.
  doctrine_reference: 애가 3장의 탄식 문맥
