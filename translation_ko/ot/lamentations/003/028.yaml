  source_fidelity: 첫 절의 권고적 의미와 고독·침묵의 뜻은 대체로 잘 반영되었습니다. 그러나 '내리신'은 히브리어에 없는 존대 주어를 전제하며, 사실상 신적 행위자를 암시합니다. 또한 원문의 נָטַל עָלָיו는 '그에게 (무엇을) 지우다/얹다'의 구조이므로 이를 더 직접적으로 옮기는 편이 적절합니다.
  naturalness: '''혼자 앉아 말없이 있어야 합니다''는 현대 표준어 합쇼체로 자연스럽고, 고난 가운데 잠잠히 있는 의미를 분명히 전달합니다. ''그가 그에게 그것을 지웠기 때문입니다''는 대명사의 반복이 다소 무겁지만, 원문의 주어 및 대상의 미확정성을 보존하는 데 필요하며 문법적으로 무리가 없습니다.'
  terminology: '''말없이''는 וְיִדֹּם의 침묵을 적절히 옮깁니다. ''지웠다''는 נָטַל과 עַל의 결합이 문맥상 나타내는 부과의 의미를 보존하면서, ''내리셨다''가 유발하는 존대 및 신적 주어의 확정을 피합니다.'
  issues:
