base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/028.yaml
  text: Let him sit alone and be silent[a], for he has laid it on him.
  footnotes:
  - marker: a
    text: Or, 'for he has imposed a burden on him.' The Hebrew leaves both the subject ('he') and the object ('it') implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 혼자 앉아 조용히 있어야 합니다. 그것을 그에게 내리신 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 동사 נָטַל의 주어와 목적어를 드러내지 않아, 영어 POB처럼 '그것을'을 보완해 읽을 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: יֵשֵׁב
  english_pob_choice: Let him sit
  chosen_korean: 혼자 앉아 있어야 합니다
  alternatives_korean:
  - 혼자 앉게 하십시오
  - 혼자 앉으십시오
  lexicon: HALOT
  rationale: 여기서는 3인칭 미완료형이 주변 문맥의 권고/훈계 흐름에서 권고적 의미를 띠므로, 한국어도 명령형보다는 의무를 나타내는 표현으로 옮겼습니다.
- source_word: בָּדָד
  english_pob_choice: alone
  chosen_korean: 혼자
  alternatives_korean:
  - 홀로
  - 고립되어
  lexicon: HALOT
  rationale: 외로움과 분리를 자연스럽게 드러내면서도 현대 한국어에서 가장 무리 없는 표현입니다.
- source_word: וְיִדֹּם
  english_pob_choice: and be silent
  chosen_korean: 조용히 있어야 합니다
  alternatives_korean:
  - 침묵해야 합니다
  - 말없이 있어야 합니다
  lexicon: HALOT
  rationale: 문맥상 단순한 '말하지 않음'보다 애도와 고난 아래의 잠잠함을 함께 담는 표현이어서, '조용히 있어야 합니다'가 가장 자연스럽습니다.
- source_word: נָטַל עָלָיו
  english_pob_choice: has laid it on him
  chosen_korean: 그에게 내리신
  alternatives_korean:
  - 그에게 지우신
  - 그에게 얹으신
  lexicon: HALOT
  rationale: 동사 נטל은 כאן에서 על과 함께 짐이나 고통을 '지우다/내리다'는 관용적 의미로 쓰이므로, 명시되지 않은 대상의 무게를 살려 '내리신'으로 옮겼습니다.
theological_decisions:
- issue: 동사의 주어와 목적어가 생략된 표현
  chosen_reading: 주어와 대상이 본문에 드러나지 않은 상태를 유지하기 위해 '그것을'과 수동적 뉘앙스를 살렸습니다.
  alternative_readings:
  - 주님께서 그것을 그에게 내리셨기 때문입니다
  - 그가 그것을 그에게 지웠기 때문입니다
  rationale: 히브리어는 주어와 목적어를 명시하지 않으므로, 해석을 단정적으로 좁히지 않고 본문이 남긴 모호성을 보존하는 것이 더 적절합니다.
  doctrine_reference: 본문의 의도적 생략과 신학적 긴장을 보존
