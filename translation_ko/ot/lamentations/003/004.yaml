lexical_decisions:
- source_word: בִּלָּה
  english_pob_choice: has worn away
  chosen_korean: 닳아 없어지게 하셨고
  alternatives_korean:
  - 없애셨고
  - 소모되게 하셨고
  - 약해지게 하셨고
  lexicon: HALOT
  rationale: בלה의 핵심은 ‘닳아 없어지다/마모되다’의 이미지이므로, 육체가 점차 소진되는 고통을 드러내는 표현으로 옮겼습니다.
- source_word: בְשָׂרִי / וְעוֹרִי
  english_pob_choice: my flesh and my skin
  chosen_korean: 제 살과 제 피부
  alternatives_korean:
  - 제 육체와 제 피부
  - 제 몸과 제 피부
  - 제 살과 제 살갗
  lexicon: HALOT
  rationale: בשר와 עור의 병렬을 살리기 위해 ‘살’과 ‘피부’를 직역에 가깝게 유지했고, 문맥의 육체적 참상을 분명히 했습니다.
- source_word: שִׁבַּר
  english_pob_choice: has broken
  chosen_korean: 부수셨습니다
  alternatives_korean:
  - 깨뜨리셨습니다
  - 꺾으셨습니다
  - 산산이 부수셨습니다
  lexicon: HALOT
  rationale: שבר의 기본 뜻인 ‘부수다/깨뜨리다’를 따라, 뼈에 가해진 파괴를 자연스럽게 드러내는 동사로 옮겼습니다.
- source_word: עַצְמוֹתַי
  english_pob_choice: my bones
  chosen_korean: 제 뼈
  alternatives_korean:
  - 제 뼈들
  - 제 골격
  lexicon: HALOT
  rationale: 뼈의 복수성을 한국어에서는 보통 총칭 단수로 자연스럽게 나타내므로 ‘제 뼈’로 옮겼습니다.
theological_decisions:
- issue: 히브리 시의 3인칭 주어를 한국어에서 어떻게 드러낼지
  chosen_reading: 직접적 주어를 덧붙이지 않고, 시편적/예레미야애가적 맥락에서 ‘주께서는 … 하셨습니다’로 옮겨 고통의 원인을 행위자로 분명히 했습니다.
  alternative_readings:
  - ‘그가…’로 옮기는 방식
  - 주어를 생략하고 수동형으로 처리하는 방식
  rationale: 원문은 פעולה의 주체를 문맥상 분명히 가리키므로, 한국어에서도 주체를 드러내는 것이 탄식의 신학적 무게를 유지합니다.
  doctrine_reference: 탄식시의 주권적 섭리 표현
- issue: בִּלָּה의 의미 범위를 어떻게 반영할지
  chosen_reading: ‘닳아 없어지게 하셨고’로 번역해, 단순 소멸보다 점진적 마모와 쇠약의 이미지를 보존했습니다.
  alternative_readings:
  - ‘없애셨고’
  - ‘소진시키셨고’
  rationale: 본문의 신체적·점진적 파괴상을 살리면 하나님의 행위가 즉각적 파괴만이 아니라 지속적 소모로 체감된다는 점이 드러납니다.
  doctrine_reference: 애가 3장의 고난 묘사
