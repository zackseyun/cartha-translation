translation:
  language: ko
  text: 이는 주께서 영원히 버리시지 않기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내치시다’, ‘저버리시다’. 히브리어 동사 זנח는 거절, 경멸, 내침의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 이는 곧
  lexicon: HALOT
  rationale: 앞뒤 문맥의 근거를 제시하는 연결어로 기능하므로, 문장 흐름을 자연스럽게 이어 주는 ‘이는’으로 옮겼습니다.
- source_word: יִזְנַח
  english_pob_choice: will reject
  chosen_korean: 버리시지 않기
  alternatives_korean:
  - 거절하시지 않기
  - 내치시지 않기
  - 저버리시지 않기
  lexicon: HALOT
  rationale: זנח는 단순한 ‘거절’보다 관계적·언약적 맥락에서 ‘버리다/내치다/저버리다’의 뉘앙스를 띱니다. 여기서는 하나님이 자기 백성을 최종적으로 버리시지 않는다는 뜻을 살려 ‘버리시지 않기’로 옮겼습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
  - 평생
  lexicon: HALOT
  rationale: 부정과 결합해 ‘영원히’ 그렇게 하지 않으신다는 의미를 드러냅니다. 한국어에서도 가장 자연스럽고 시간적 지속성을 분명히 합니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 주인
  lexicon: HALOT
  rationale: 아도나이는 하나님의 호칭이므로 존칭을 유지해야 합니다. 한국어 문맥에서는 ‘주’가 간결하며, 뒤의 높임 종결어미와 함께 신적 호칭을 충분히 드러냅니다.
theological_decisions:
- issue: זנח의 관계적 강도
  chosen_reading: 하나님께서 자기 백성을 최종적으로 버리시지 않는다는 약속으로 읽었습니다.
  alternative_readings:
  - 단순한 감정적 외면
  - 일시적 징계 후 회복의 가능성만 암시
  rationale: 이 절은 예레미야애가의 탄식 속에서도 하나님의 지속적 신실하심을 진술합니다. לכן '버리다'는 전면적 단절의 뉘앙스를 살리되, 뒤의 '영원히'와 함께 최종 거절이 아님을 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: divine faithfulness in judgment and restoration'
