base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/031.yaml
  text: For the Lord will not reject forever[a].
  footnotes:
  - marker: a
    text: Or 'cast off' or 'forsake.' The Hebrew verb can denote rejecting, spurning, or casting off.
