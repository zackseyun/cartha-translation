id: LAM.3.37
reference: Lamentations 3:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֣י זֶ֤ה אָמַר֙ וַ/תֶּ֔הִי אֲדֹנָ֖/י לֹ֥א צִוָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/037.yaml
  text: Who is this who speaks and it happens[b][a], unless the Lord has commanded it?
  footnotes:
  - marker: a
    text: Or 'said ... and it came to pass'; the Hebrew uses past forms in a rhetorical statement of general truth.
    reason: lexical_alternative
  - marker: b
    text: Or 'if the Lord has not ordained/decreed it.' The Hebrew verb more literally means 'commanded.'
    reason: alternative_reading
translation:
  language: ko
  text: 누가 말한들 이루어지겠습니까? 주님께서 명령하지 않으셨다면 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말한들 … 이루어지겠습니까’는 히브리어의 과거형을 한국어의 수사적 현재/조건으로 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘명령하지 않으셨다면’은 ‘주님께서 명령하지 않으셨다면’의 자연스러운 축약형입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: מִי זֶה
  english_pob_choice: Who is this
  chosen_korean: 누가
  alternatives_korean:
  - 누구입니까
  - 이 사람이 누구입니까
  lexicon: HALOT
  rationale: מצ사 המִי זֶה의 수사적 질문을 한국어에서도 자연스럽게 압축해 옮기기 위해 ‘누가’로 시작했습니다.
- source_word: אָמַר
  english_pob_choice: speaks
  chosen_korean: 말한들
  alternatives_korean:
  - 말합니다
  - 말해도
  - 말하고
  lexicon: HALOT
  rationale: 직역 과거 ‘말했다’보다, 수사적 일반 진술의 힘을 살리는 현재적 조건 표현으로 ‘말한들’을 택했습니다.
- source_word: וַתֶּהִי
  english_pob_choice: and it happens
  chosen_korean: 이루어지겠습니까
  alternatives_korean:
  - 생기겠습니까
  - 일어나겠습니까
  - 되어지겠습니까
  lexicon: HALOT
  rationale: ‘일어나다/생기다’보다 결과가 현실화되는 뉘앙스를 살려 ‘이루어지다’로 옮겼습니다.
- source_word: לֹא צִוָּה
  english_pob_choice: has not commanded it
  chosen_korean: 명령하지 않으셨다면
  alternatives_korean:
  - 명령하지 않으셨다면 말입니다
  - 명하신 것이 아니라면
  - 지시하지 않으셨다면
  lexicon: HALOT
  rationale: צוה의 기본 뜻인 ‘명령하다’를 유지하되, 한국어에서는 뒤의 결과절을 받는 조건형으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 주권적 원인의 범위와 동사 선택
  chosen_reading: 하나님(주님)의 명령이 없이는 어떤 사건도 발생하지 않는다는 일반 진술로 읽었습니다.
  alternative_readings:
  - ‘주님께서 허락하지 않으셨다면’처럼 허용 개념으로 완화
  - ‘주님께서 예정하지 않으셨다면’처럼 예정론 용어로 강화
  rationale: 히브리어 צוה는 우선 ‘명령하다’이며, 본문은 그보다 강한 체계신학 용어를 요구하지 않습니다. 그래서 본문 뜻을 유지하되 ‘명령’으로 직접 옮겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
