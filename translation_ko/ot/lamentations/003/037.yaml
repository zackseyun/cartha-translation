  yaml_path: translation/ot/lamentations/003/037.yaml
  text: Who is this who speaks and it happens[b][a], unless the Lord has commanded it?
  footnotes:
  - marker: a
    text: Or 'said ... and it came to pass'; the Hebrew uses past forms in a rhetorical statement of general truth.
    reason: lexical_alternative
  - marker: b
    text: Or 'if the Lord has not ordained/decreed it.' The Hebrew verb more literally means 'commanded.'
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서 명령하지 않으셨다면[b], 누가 말한 것이 이루어질 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘누가 말하였고 그것이 이루어졌겠습니까?’입니다. 히브리어는 과거형을 사용하지만, 여기서는 일반적 진실을 묻는 수사 의문문입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘명령하다’는 히브리어 동사의 기본 뜻입니다. 문맥상 ‘정하다’ 또는 ‘작정하다’로 옮길 수도 있으나, 이는 해석을 더한 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי זֶה
  english_pob_choice: Who is this
  chosen_korean: 누가
  alternatives_korean:
