  source_fidelity: 히브리어는 하나님께 직접 말하며 ‘당신께서 그들의 모든 보복(נקמתם), 저를 향한/저에 관한 그들의 모든 생각·계획(מחשבותם)을 보셨습니다’라고 합니다. ‘보셨습니다’, 두 번의 ‘모든’, 그리고 ‘저를 향한’은 이를 충실히 반영합니다. 다만 נקמה에는 보복 행위의 뜻이 뚜렷하므로 현대 한국어에서는 ‘복수’보다 ‘보복’이 더 직접적이고 덜 구어적으로 들립니다.
  naturalness: ‘주님께서 … 보셨습니다’는 기도·탄식의 직접 호칭 문맥과 현대 합쇼체에 자연스럽습니다. ‘그들의 모든 보복’과 ‘저를 향한 모든 계략’의 병렬도 자연스럽습니다. 각주 표지는 설명하는 낱말 바로 뒤에 두는 편이 독자에게 더 명확합니다.
