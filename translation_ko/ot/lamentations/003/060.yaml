  yaml_path: translation/ot/lamentations/003/060.yaml
  text: You have seen all their vengeance[a], all their schemes against me.
  footnotes:
  - marker: a
    text: Or 'all their plans concerning me.' The Hebrew phrase can be rendered more neutrally, but the hostile context supports 'schemes against me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 그들의 모든 복수와 저를 향한 모든 계략을 보셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘복수’는 נקמה의 강한 보복 의미를 살린 번역입니다. 더 중립적으로는 ‘보복’이나 ‘원수갚음’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  english_pob_choice: You have seen
  chosen_korean: 보셨습니다
  alternatives_korean:
  - 보셨습니다
  - 보셨다
  - 살펴보셨습니다
  lexicon: HALOT
  rationale: 2인칭 남성 단수 완료형을 현대 한국어의 공손한 과거-현재 관련 표현으로 옮겨, 이미 이루어진 시각 행위가 지금까지 유효함을 살렸습니다.
- source_word: נִקְמָתָם
  english_pob_choice: their vengeance
  chosen_korean: 그들의 모든 복수
  alternatives_korean:
  - 그들의 모든 원수갚음
  - 그들의 모든 보복
  - 그들의 모든 원한의 갚음
  lexicon: HALOT
  rationale: נקמה의 보복 행위를 드러내되, 시편/예언문맥의 강한 감정을 살릴 수 있는 ‘복수’를 택했고, כָּל을 반영해 ‘모든’을 붙였습니다.
- source_word: מַחְשְׁבֹתָם
  english_pob_choice: their schemes
  chosen_korean: 모든 계략
  alternatives_korean:
  - 모든 계획
  - 모든 생각
  - 모든 음모
  lexicon: HALOT
  rationale: 호의적 중립인 ‘계획’보다 적대적 문맥에 맞는 ‘계략’이 מחשבות의 해로운 의도를 더 직접적으로 드러냅니다.
- source_word: לִי
  english_pob_choice: against me
  chosen_korean: 저를 향한
  alternatives_korean:
  - 저에 대한
  - 저를 거슬러
  - 저를 향하여
  lexicon: HALOT
  rationale: 전치사 ל의 관계·방향성을 한국어에서 자연스럽게 살리되, 적대적 문맥을 노골적으로 추가해 버리지 않는 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님에게 직접 드리는 탄식에서의 존칭 처리
  chosen_reading: ‘주님께서… 보셨습니다’로 주어를 높이고 동사를 공손형으로 맞췄습니다.
  alternative_readings:
  - ‘야훼께서… 보셨습니다’
  - ‘주님이… 보셨습니다’
  rationale: 이 절은 탄식의 기도 맥락에서 하나님께 직접 말하는 형식이므로, 한국어 합쇼체로 존칭을 유지하는 것이 화행에 가장 적절합니다.
  doctrine_reference: 기도/탄식의 화법
