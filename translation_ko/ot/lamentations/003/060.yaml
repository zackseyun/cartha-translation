  rationale: 이 절은 탄식의 기도 맥락에서 하나님께 직접 말하는 형식이므로, 한국어 합쇼체로 존칭을 유지하는 것이 화행에 가장 적절합니다.
  doctrine_reference: 기도/탄식의 화법
