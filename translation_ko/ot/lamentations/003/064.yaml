id: LAM.3.64
reference: Lamentations 3:64
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תָּשִׁ֨יב לָ/הֶ֥ם גְּמ֛וּל יְהוָ֖ה כְּ/מַעֲשֵׂ֥ה יְדֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/064.yaml
  text: You will repay them[a], O Yahweh[b], according to the work of their hands.
  footnotes:
  - marker: a
    text: Or, 'May you repay them, O LORD.' The Hebrew verb may be heard as a prayerful wish as well as a statement of confidence.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'according to the work of their hands,' an idiom referring to what they have done.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 그들의 손의 일대로 그들에게 갚으실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘주님, 그들에게 갚아 주십시오.’ 히브리어 동사는 확신의 진술처럼도, 기도하는 청원처럼도 들릴 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 관용구로, 문자적으로는 ‘그들의 손의 일대로’이며 그들이 한 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁ֨יב
  english_pob_choice: You will repay
  chosen_korean: 갚으실 것입니다
  alternatives_korean:
  - 보답하실 것입니다
  - 되돌려주실 것입니다
  - 갚아 주십시오
  lexicon: HALOT
  rationale: 히필형 שוב는 ‘되돌리다/갚다’의 보응 의미를 가질 수 있으므로, 문맥상 보응의 뉘앙스를 살려 ‘갚으실 것입니다’로 옮겼습니다. 기도문적 호소 가능성은 미래형에 담고, 별도 각주로 열어 두었습니다.
- source_word: גְּמוּל
  english_pob_choice: repay
  chosen_korean: 갚으실
  alternatives_korean:
  - 보응하실
  - 보상하실
  - 갚음
  lexicon: HALOT
  rationale: גְּמוּל은 ‘보응, 되갚음’의 뜻이므로, 한국어에서는 별도의 명사보다 동사 ‘갚다’로 자연스럽게 풀어 보응의 의미를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: DOCTRINE.md contested terms
  rationale: 이 절은 탄식의 기도문 안에서 직접 하나님께 호소하는 문맥이므로, 한국어 합쇼체의 직접 호칭으로 ‘주님’을 사용했습니다. 본문에는 직설적 호칭을 살리고, 절차상 야훼 표기는 각주로 보완할 수 있습니다.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  english_pob_choice: according to the work of their hands
  chosen_korean: 그들의 손의 일대로
  alternatives_korean:
  - 그들의 손이 한 대로
  - 그들이 행한 일대로
  - 그 손으로 한 일대로
  lexicon: HALOT
  rationale: 히브리어의 관용구로서 ‘손’은 행위의 환유이므로, 직역을 유지하되 한국어로는 ‘손의 일대로’라 하여 ‘그들이 행한 바’의 뜻을 보존했습니다.
theological_decisions:
- issue: תָּשִׁיב의 문법적 뉘앙스(미래/청원)
  chosen_reading: 미래형 ‘갚으실 것입니다’로 본문을 두고, 청원적 가능성은 각주로 보존했습니다.
  alternative_readings:
  - ‘갚아 주십시오’로 명령/청원형 처리
  - ‘갚으시리이다’ 식의 서원적 표현
  rationale: 애가의 기도 문맥에서 미완료형은 단순 예고와 청원의 긴장을 함께 가질 수 있으므로, 본문은 가독성 높은 미래형으로 두되 청원적 해석을 지우지 않기 위해 각주를 달았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
