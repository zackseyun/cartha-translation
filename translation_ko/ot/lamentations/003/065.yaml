  source_fidelity: 히브리어 תִּתֵּן은 하나님께 향한 2인칭 남성 단수 미완료형이며, 이 기도 문맥에서는 미래적 심판 선언 또는 청원적 저주로 읽힐 수 있습니다. 초안은 청원형을 택할 수는 있으나, 본문에서 ‘주께서’와 ‘하십시오’을 결합한 표현이 문체상 어색하고, 영어 POB의 주 독법인 미래적 선언을 본문에서 반영하지 않았습니다. מְגִנַּת לֵב의 희귀성과 불확실성은 각주에서 보존해야 합니다.
  naturalness: ‘마음의 굳어짐’은 뜻은 전달되지만 현대 표준 한국어에서 다소 비자연스럽습니다. ‘마음의 완고함’이 심판 문맥의 내적 완고함을 자연스럽게 나타냅니다. 또한 ‘주의 저주가 … 임하게 하십시오’보다 선언문에서는 ‘주의 저주가 … 임할 것입니다’가 자연스럽습니다.
  terminology: ‘주의 저주’는 תַּאֲלָתְךָ를 정확하고 자연스럽게 옮깁니다. ‘마음의 완고함’은 난해한 מְגִנַּת לֵב에 대한 문맥적 번역이며, 직역 가능성(‘마음의 덮개/방패’)은 어휘 각주로 남깁니다.
