base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/065.yaml
  text: You will give them hardness of heart[b][a]; your curse will be upon them.
  footnotes:
  - marker: a
    text: Or, 'May you give them hardness of heart, your curse to them.' The Hebrew imperfect may be heard as an imprecation.
    reason: alternative_reading
  - marker: b
    text: Literally, 'a covering/shield of heart.' The expression is rare; 'hardness of heart' reflects the likely sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 그들에게 마음의 완고함을 주실 것입니다[b]. 주의 저주가 그들에게 임할 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들에게 마음의 완고함을 주십시오. 주의 저주를 그들에게 내리십시오.’ 히브리어 미완료형은 저주를 구하는 청원으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘마음의 덮개/방패’입니다. 이 표현은 드물며, 문맥상 ‘마음의 완고함’으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  english_pob_choice: You will give
  chosen_korean: 주께서 … 주시고
  alternatives_korean:
  - 주께서 … 주실 것입니다
  - 주께서 … 주십시오
  lexicon: HALOT
  rationale: 히브리어 완료/미완료형이 탄원문맥에서 소원·저주로 들릴 수 있으므로, 한국어에서는 직접적인 청원형을 살려 하나님께 대한 간구로 읽히게 했습니다.
- source_word: מְגִנַּת לֵב
  english_pob_choice: hardness of heart
  chosen_korean: 마음의 굳어짐
  alternatives_korean:
  - 마음의 덮개
  - 마음의 가리개
  - 마음의 완고함
  lexicon: HALOT
  rationale: 직역하면 ‘마음의 덮개/방패’이지만, 문맥상 내면이 무뎌지고 굳어지는 상태를 가리키므로 POB의 해석을 따라 자연스러운 한국어로 옮겼습니다.
- source_word: תַּאֲלָתְךָ
  english_pob_choice: your curse
  chosen_korean: 주의 저주
  alternatives_korean:
  - 주의 저주 선언
  - 주의 저주 말씀
  - 주의 저주가
  lexicon: HALOT
  rationale: תַּאֲלָה를 저주로 이해하는 것이 문맥에 가장 직접적이며, 한국어에서는 주격을 드러내어 뒤 절과의 병행을 살렸습니다.
- source_word: לָהֶם ... לָהֶם
  english_pob_choice: them ... upon them
  chosen_korean: 그들에게 … 그들에게 임하게
  alternatives_korean:
  - 그들에게 … 그들에게
  - 그들에게 … 그들 위에
  lexicon: HALOT
  rationale: 반복된 전치사는 대상의 강조를 나타내므로, 첫 번째는 수혜/대상, 두 번째는 저주의 도달을 나타내는 ‘임하다’로 풀어 자연스러운 형식을 유지했습니다.
theological_decisions:
- issue: '65절의 화행: 예언적 진술인가, 저주적 청원인가'
  chosen_reading: 하나님께 직접 드리는 저주적 청원으로 읽히도록 번역했습니다.
  alternative_readings:
  - 예언적 미래 진술로 읽기
  - 부드러운 서술문으로 처리하기
  rationale: 애가의 기도문맥에서 이 절은 단순 서술이 아니라 심판을 구하는 탄원으로 기능하므로, 한국어도 간구형으로 처리해 본문의 긴장을 보존했습니다.
  doctrine_reference: 심판 청원과 시편적 저주의 장르 구분
