translation:
  language: ko
  text: 이는 그분께서 마음에서 우러나 사람들[b]을 괴롭히시거나 근심하게 하시는 분이 아니시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 마음에서’입니다. 문맥상 ‘기꺼이’ 또는 ‘마음에서 우러나’라는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 직역하여 ‘사람의 아들들’이며, 인간 일반을 가리키는 표현입니다.
    reason: lexical_alternative
