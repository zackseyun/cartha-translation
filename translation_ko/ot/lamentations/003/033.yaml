theological_decisions:
- issue: 하나님의 징계가 그의 내적 성향에서 나오지 않는다는 진술
  chosen_reading: 하나님은 사람을 괴롭히시는 분으로 묘사되지만, 그것이 그분의 마음에서 우러난 본심은 아니라는 뜻으로 읽었습니다.
  alternative_readings:
  - 하나님은 자의적으로 사람을 괴롭히지 않으신다는 뜻
  - 하나님은 기꺼이 사람을 괴롭히지 않으신다는 뜻
  rationale: 문자적 관용구 ‘from his heart’를 유지하면서도, 문맥상 하나님이 고난을 즐기지 않으신다는 신학적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §§3, 4, 6
- issue: 대표적 남성 표현의 처리
  chosen_reading: ‘사람의 자손’으로 남겨 남성형 표지를 유지했습니다.
  alternative_readings:
  - 인간들
  - 사람들
  rationale: 원문의 בְנֵי אִישׁ는 문법적으로 대표성 있는 남성 표현이므로, 중성화보다 원문 표지를 보존하는 쪽이 본문 긴장을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §4
