  text: לְ/דַכֵּא֙ תַּ֣חַת רַגְלָ֔י/ו כֹּ֖ל אֲסִ֥ירֵי אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/034.yaml
  text: to crush under his feet all the prisoners of the earth,[a]
  footnotes:
  - marker: a
    text: Or 'all the prisoners of the land.' The Hebrew אֶרֶץ can mean either 'earth' or 'land'; here 'earth' was chosen to preserve the verse's broad, poetic scope.
    reason: lexical_alternative
translation:
  language: ko
  text: 땅의 모든 갇힌 자들을 그의 발아래에서 짓밟는 것,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 모든 갇힌 자들’로 옮길 수 있습니다. 히브리어 אֶרֶץ는 ‘땅/세상’ 또는 ‘땅/나라’의 뜻을 가질 수 있으며, 여기서는 시적 범위를 넓게 살리기 위해 ‘땅’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/דַכֵּא
  english_pob_choice: to crush
  chosen_korean: 짓밟는 것
  alternatives_korean:
  - 부수는 것
  - 짓누르는 것
  - 짓밟아 부수는 것
  lexicon: HALOT
  rationale: 문맥상 폭력적이고 신체적인 억압의 이미지를 살리면서도, 한국어에서 자연스럽고 간결하게 읽히는 동작 표현으로 옮겼습니다.
- source_word: תַּחַת רַגְלָיו
  english_pob_choice: under his feet
  chosen_korean: 그의 발아래에서
  alternatives_korean:
  - 그의 발밑에
  - 그의 발 아래에서
  lexicon: HALOT
  rationale: ‘발아래’는 공간적 관계와 압박의 이미지를 함께 살리며, 시적 문맥에서 자연스럽습니다.
- source_word: אֲסִירֵי
  english_pob_choice: the prisoners of
  chosen_korean: 갇힌 자들
  alternatives_korean:
  - 포로들
  - 죄수들
  lexicon: HALOT
  rationale: אֲסִירֵי는 ‘묶인 자/갇힌 자’의 의미를 가지므로, 감금 상태를 폭넓게 드러내는 표현을 택했습니다.
- source_word: אָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 세상
  - 땅 위의
  lexicon: HALOT
  rationale: POB가 주석으로 인정한 ‘land’의 가능성을 염두에 두면서도, 한국어 시어법에서는 ‘땅’이 가장 무난하게 넓은 범위를 전달합니다.
theological_decisions:
- issue: 시적 열거 속 동사구의 독립성
  chosen_reading: 이 구절은 앞뒤 문맥과 연결된 잘못의 나열 중 하나로, 별도의 완전한 문장으로 풀지 않고 동작 구문을 그대로 유지했습니다.
  alternative_readings:
  - ‘…하는 자가’와 같은 절로 보강하기
  - 서술형으로 완전히 재구성하기
  rationale: 히브리어는 부정사구로 열거를 이루므로, 한국어에서도 원문의 압축성과 적대적 폭력 이미지를 보존하는 편이 더 충실합니다.
  doctrine_reference: 시적 문맥 보존 원칙
- issue: אֶרֶץ의 범위
  chosen_reading: ‘땅’으로 옮겨 원문이 허용하는 ‘land/earth’의 긴장을 보존했습니다.
  alternative_readings:
  - ‘세상’으로 보편화하기
  - ‘온 땅’으로 확대하기
  rationale: 영어 POB가 ‘earth’를 택했지만 각주에서 ‘land’ 가능성을 명시하므로, 한국어 본문은 더 중립적인 ‘땅’을 사용해 범위를 과도하게 좁히거나 넓히지 않았습니다.
  doctrine_reference: 어휘 중립성 원칙
