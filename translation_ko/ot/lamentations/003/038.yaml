  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/פִּ֤י עֶלְיוֹן֙ לֹ֣א תֵצֵ֔א הָ/רָע֖וֹת וְ/הַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/038.yaml
  text: Do not both calamities and good come from the mouth of the Most High?[a]
  footnotes:
  - marker: a
    text: Or 'evil' or 'disasters'; the Hebrew רָעוֹת can denote harmful or adverse things broadly. Here 'calamities' is used to avoid implying moral evil as such.
    reason: lexical_alternative
translation:
  language: ko
  text: 지극히 높으신 분의 입에서 재앙과 복이 나오지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악’이나 ‘재난’으로도 옮길 수 있습니다. 히브리어 רָעוֹת는 넓게는 해로운 일들을 가리킬 수 있으나, 여기서는 도덕적 악 자체를 뜻한다고 보지 않기 위해 ‘재앙’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/פִּי
  english_pob_choice: from the mouth of
  chosen_korean: 입에서
  alternatives_korean:
  - 입으로부터
  - 말에서
  - 명령에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 ‘말/명령의 근원’이므로, 한국어에서는 자연스러운 ‘입에서’로 옮겨 원문의 비유를 살렸습니다.
- source_word: עֶלְיוֹן
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  - 지극히 높으신 하나님
  lexicon: HALOT
  rationale: עֶלְיוֹן의 신적 칭호와 최상급 의미를 살리면서, 한국어에서 지나치게 교회식으로 굳지 않은 표현으로 옮겼습니다.
- source_word: הָ/רָעוֹת
  english_pob_choice: calamities
  chosen_korean: 재앙
  alternatives_korean:
  - 악
  - 재난
  - 해악
  lexicon: HALOT
  rationale: 여기서 רָעוֹת는 도덕적 ‘악’이 아니라 해로운 사건들을 가리키므로, ‘재앙’이 하나님의 도덕적 악의 조성을 암시하지 않으면서 문맥을 잘 드러냅니다.
- source_word: וְ/הַ/טּוֹב
  english_pob_choice: and good
  chosen_korean: 복
  alternatives_korean:
  - 선
  - 좋은 것
  - 평안
  lexicon: HALOT
  rationale: 히브리어의 명사적 ‘good’는 문맥상 유익하고 благ한 결과를 포괄하므로, 짝을 이루는 ‘재앙’과 대비되는 자연스러운 한국어로 ‘복’을 택했습니다.
theological_decisions:
- issue: 시편적/예언적 수사문을 의문문으로 보존할지 여부
  chosen_reading: 의문문으로 옮겨, ‘재앙과 복이… 나오지 않습니까?’라고 했습니다.
  alternative_readings:
  - 지극히 높으신 분의 입에서 재앙과 복이 나옵니다.
  - 지극히 높으신 분의 입에서 재앙과 복이 나오지 않습니까.
  rationale: 문맥상(3:37-39) 이 구절은 하나님의 주권 아래 있는 상반된 결과를 수사적으로 묻는 진술이므로, 한국어에서도 의문형이 그 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy items 1 and 6
