    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  english_pob_choice: Let him put
  chosen_korean: 그는 … 둘 것입니다
  alternatives_korean:
  - 그는 … 놓을 것입니다
  - 그는 … 두게 하십시오
  lexicon: HALOT
  rationale: נתן의 여기서의 사역적·권고적 힘을 한국어에서 자연스럽게 살리되, 명령형보다 문맥상 권면의 흐름에 맞는 미래형/의지 표현으로 옮겼습니다.
- source_word: בֶּעָפָר
  english_pob_choice: in the dust
  chosen_korean: 티끌 속에
  alternatives_korean:
  - 먼지 속에
  - 흙 속에
  - 티끌에
  lexicon: HALOT
  rationale: עָפָר는 ‘dust/earth’의 기본 뜻을 가지며, 한국어에서는 ‘티끌’이 낮아짐과 굴복의 이미지를 가장 잘 전달합니다.
- source_word: פִּיהוּ
  english_pob_choice: his mouth
  chosen_korean: 자기의 입
  alternatives_korean:
  - 그의 입
  - 입
  lexicon: HALOT
  rationale: 직역에 가깝게 구체적 신체 표현을 유지해, 침묵·굴복·비천함을 암시하는 관용적 이미지가 본문에서 드러나도록 했습니다.
- source_word: אוּלַי
  english_pob_choice: perhaps
  chosen_korean: 아마도
  alternatives_korean:
  - 어쩌면
  - 혹시
  lexicon: HALOT
  rationale: 불확실한 기대를 나타내는 어조를 살리기 위해, 현대 한국어에서 가장 자연스러운 ‘아마도’를 선택했습니다.
- source_word: תִּקְוָה
  english_pob_choice: hope
  chosen_korean: 희망
  alternatives_korean:
  - 소망
  - 기대
  lexicon: HALOT
  rationale: תִּקְוָה의 기본 의미를 반영해 ‘희망’으로 옮겼으며, 애가 문맥의 회복 가능성을 담기에 가장 직접적입니다.
theological_decisions:
- issue: ‘입을 티끌 속에 두다’라는 신체적 이미지의 처리
  chosen_reading: 비천함과 침묵의 의미를 해설로 풀지 않고, 본문의 구체적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 겸손히 엎드리다
  - 비천함으로 잠잠해지다
  rationale: 히브리어는 격렬한 자기 낮춤의 몸짓을 직접적으로 제시하므로, 해석을 앞세우기보다 이미지 자체를 보존하는 것이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 해석적 완화보다 이미지 보존'
