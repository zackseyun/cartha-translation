  text: 'You heard my voice: do not hide your ear from my plea for relief[a], from my cry for help.'
  footnotes:
  - marker: a
    text: Or 'do not close your ear to my relief, to my cry for help.' The Hebrew prepositional phrases are difficult, and some translators construe them with 'to' rather than 'from.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 제 목소리를 들으셨습니다. 제가 안도를 얻도록 드린 호소와 도움을 청하는 부르짖음에 주의 귀를 닫지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 안도와 제 도움을 청하는 부르짖음에서 귀를 닫지 마십시오’로 옮길 수 있습니다. 히브리어의 두 전치사구는 해석하기 어려우며, 이를 ‘…에’로 이해하는 번역도 있고 ‘…에서’로 이해하는 번역도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹלִי
  english_pob_choice: my voice
  chosen_korean: 제 목소리
  alternatives_korean:
  - 제 소리
  - 나의 음성
  lexicon: HALOT
  rationale: קוֹל은 ‘목소리/소리’의 뜻을 가지므로, 기도 맥락에서 자연스럽고 직접적인 ‘제 목소리’로 옮겼습니다.
- source_word: שָׁמָעְתָּ
  english_pob_choice: you heard
  chosen_korean: 들으셨습니다
  alternatives_korean:
  - 들으셨습니다
  - 들었습니다
  lexicon: HALOT
  rationale: 과거 완료 뉘앙스보다 화자와 청자 사이의 응답 관계를 살려, 하나님께 드리는 직접 호칭에 맞는 존칭 과거로 옮겼습니다.
- source_word: תַּעְלֵם אָזְנְךָ
  english_pob_choice: do not hide your ear
  chosen_korean: 주의 귀를 숨기지 마십시오
  alternatives_korean:
  - 주의 귀를 감추지 마십시오
  - 주의 귀를 닫지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘귀를 숨기다’는 은유를 유지하되, 한국어에서는 ‘숨기지 마십시오’가 가장 직역에 가깝고 시적 긴장을 보존합니다.
- source_word: לְרַוְחָתִי
  english_pob_choice: my plea for relief
  chosen_korean: 제 호소
  alternatives_korean:
  - 제 구제
  - 제 राहत를 위한 호소
  - 제 숨통 트임
  lexicon: HALOT
  rationale: 이 구절의 לְרַוְחָתִי는 의미가 कठिन하여 POB 주석처럼 ‘구원/안도에 대한 간구’의 방향을 담아, 한국어에서는 자연스러운 ‘제 호소’로 처리했습니다.
- source_word: לְשַׁוְעָתִי
  english_pob_choice: my cry for help
  chosen_korean: 제 도움의 부르짖음
  alternatives_korean:
  - 제 외침
  - 제 구원의 부르짖음
  lexicon: HALOT
  rationale: שַׁוְעָה의 긴급한 구원 요청을 살려 ‘도움의 부르짖음’으로 옮겼습니다.
theological_decisions:
- issue: 기도문에서 하나님께 드리는 직접 호칭의 존칭 처리
  chosen_reading: ‘주께서… 들으셨습니다 / 주의 귀를 숨기지 마십시오’처럼 하나님께는 존칭 종결과 2인칭 경어를 유지했습니다.
  alternative_readings:
  - ‘주께서… 들으셨습니다 / 주의 귀를 숨기지 말아 주십시오’
  - ‘주께서… 들으셨습니다 / 귀를 숨기지 마십시오’
  rationale: 시편적 탄원과 같은 예레미야애가의 기도체를 한국어 합쇼체로 살리면서도, 하나님께 드리는 직접 청원을 공손하고 분명하게 표현하기 위해서입니다.
  doctrine_reference: 기도 언어의 경외성과 직접성
