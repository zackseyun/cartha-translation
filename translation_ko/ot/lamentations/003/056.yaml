revisions:
- from: 주께서 제 목소리를 들으셨습니다. 제 호소에서, 제 도움의 부르짖음에서 주의 귀를 숨기지 마십시오.[a]
  to: 주께서 제 목소리를 들으셨습니다. 제가 안도를 얻도록 드린 호소와 도움을 청하는 부르짖음에 주의 귀를 닫지 마십시오.[a]
  rationale: 원문의 ‘목소리’, 과거의 청취, 귀의 은유, 그리고 두 병렬 전치사구를 보존했습니다. רְוָחָה의 안도·숨 돌림의 의미를 ‘안도를 얻도록 드린 호소’로 드러내고, 논쟁적인 전치사 관계는 각주에 남겼습니다. 직접 기도의 존칭과 현대 합쇼체도 유지했습니다.
  reviewer_model: gpt-5.6-terra
