  text: רַ֧בְתָּ אֲדֹנָ֛/י רִיבֵ֥י נַפְשִׁ֖/י גָּאַ֥לְתָּ חַיָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/058.yaml
  text: You have defended the cause of my soul[a], O Lord; you have redeemed my life.
  footnotes:
  - marker: a
    text: Or 'You have pleaded the case of my soul' or 'You have contended for my life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님, 주님께서는 내 영혼의 사정을 변호하셨고 내 생명을 속량하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 영혼의 사정/사건” 또는 “내 생명의 소송”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבְתָּ
  english_pob_choice: have defended
  chosen_korean: 변호하셨고
  alternatives_korean:
  - 두둔하셨고
  - 옹호하셨고
  - 대변하셨고
  lexicon: HALOT
  rationale: ריב의 법정적 의미를 살려, 주님이 화자의 사건을 법적으로 맡아 변론하신 뉘앙스를 자연스러운 한국어로 옮겼습니다.
- source_word: רִיבֵי
  english_pob_choice: the cause
  chosen_korean: 사정
  alternatives_korean:
  - 사건
  - 변론할 사안
  - 분쟁
  lexicon: HALOT
  rationale: 직역한 복수형보다, 시적·법정적 맥락에서 화자의 억울한 처지와 소송 사안을 함께 담는 말로 ‘사정’을 택했습니다.
- source_word: נַפְשִׁי
  english_pob_choice: of my soul
  chosen_korean: 내 영혼의
  alternatives_korean:
  - 내 생명의
  - 내 나의
  - 내 존재의
  lexicon: HALOT
  rationale: נֶפֶשׁ의 ‘영혼/생명/자기’ 의미를 유지하되, 뒤 절의 ‘내 생명’과 구별되도록 ‘내 영혼’을 사용했습니다.
- source_word: גָּאַלְתָּ
  english_pob_choice: have redeemed
  chosen_korean: 속량하셨습니다
  alternatives_korean:
  - 구속하셨습니다
  - 되찾으셨습니다
  - 구해내셨습니다
  lexicon: HALOT
  rationale: גאל의 구속자/속량자 이미지를 살려, 단순한 구조보다 언약적·법적 배경을 드러내는 ‘속량하다’를 택했습니다.
theological_decisions:
- issue: 법정 변호와 속량의 두 이미지 보존
  chosen_reading: 첫 절반은 주님의 법정적 변호를, 둘째 절반은 속량 행위를 분리해 표현했습니다.
  alternative_readings:
  - 둘 다 단순히 ‘도우셨습니다’나 ‘구원하셨습니다’로 평준화하는 읽기
  rationale: 히브리어는 ריב과 גאל이라는 서로 다른 동사로 두 이미지를 병렬합니다. 이를 구분해야 시와 신학의 긴장이 유지됩니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: אֲדֹנָי의 호격 처리
  chosen_reading: ‘주님’ 앞뒤 반복으로 직접 호격을 드러냈습니다.
  alternative_readings:
  - ‘내 주님’
  - 호격 없이 평서형으로 처리
  rationale: 본문은 하나님께 직접 부르는 호격이므로, 한국어에서도 청자 지시를 분명히 하는 것이 합당합니다.
  doctrine_reference: Direct address conventions
