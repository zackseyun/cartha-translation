    text: 또는 ‘주께서는 저를 어두운 곳에, 옛적에 죽은 이들처럼 앉히셨습니다.’
    reason: 히브리어 복수형 ‘어둠들’을 장소적 복수인 ‘어두운 곳’으로, 히필 동사를 보다 직역적으로 ‘앉히셨습니다’로 옮길 수 있습니다. ‘옛적에’는 עוֹלָם의 원격 과거 의미를 반영합니다.
lexical_decisions:
- source_word: בְּמַחֲשַׁכִּים
  english_pob_choice: in darkness
  chosen_korean: 어둠 속에
  alternatives_korean:
  - 어두운 곳에
  - 캄캄한 곳에
  lexicon: HALOT
  rationale: 전치사 ב가 붙은 복수형은 위치를 나타내므로, 영어 POB의 'in darkness'에 맞추어 한국어도 상태보다 장소성을 살린 '어둠 속에'로 옮겼습니다.
- source_word: הוֹשִׁיבַנִי
  english_pob_choice: He has made me dwell
  chosen_korean: 저를 ... 살게 하시되
  alternatives_korean:
  - 저를 앉히셨습니다
  - 저를 머물게 하셨습니다
  - 저를 살게 하셨습니다
  lexicon: HALOT
  rationale: 히필형 ישׁב은 '앉히다/살게 하다'의 사역 의미이므로, 강제된 처지를 자연스럽게 드러내는 '살게 하시되'로 옮겼습니다.
- source_word: כְּמֵתֵי עוֹלָם
  english_pob_choice: like those long dead
  chosen_korean: 오래전에 죽은 이들처럼
  alternatives_korean:
  - 옛날에 죽은 이들처럼
  - 오래 죽은 자들처럼
  - 오래전에 죽은 자들처럼
  lexicon: HALOT
  rationale: כְּ의 비교 의미와 עוֹלָם의 '먼 옛날/오래전' 뉘앙스를 함께 살려, 단순히 '죽은 이들'이 아니라 '오래전에 죽은 이들'로 구체화했습니다.
theological_decisions:
- issue: 시적 비교의 보존
  chosen_reading: '''처럼''으로 끝나는 비교문을 유지해, 실제 죽음이 아니라 죽은 자들과 같은 극도의 절망 상태라는 시적 비유를 보존했습니다.'
  alternative_readings:
  - 직설적으로 '죽은 자들입니다'로 옮김
  - '''죽은 이들 같게 하셨습니다''로 완화'
  rationale: 본문의 כְּ는 명확한 비교 표지이므로, 비유를 직설로 바꾸지 않는 것이 의미를 정확히 보존합니다.
  doctrine_reference: 시가서의 비유법과 문맥 충실 번역 원칙
