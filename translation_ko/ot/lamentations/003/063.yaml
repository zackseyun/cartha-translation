  text: 그들의 앉음과 일어섬을 보십시오[a]—저는 그들의 노래입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 조롱노래’ 또는 ‘그들의 비웃는 노래’. 히브리어는 ‘노래’나 ‘음악’을 뜻할 수 있으며, 이 문맥에서는 화자가 조롱의 대상이 되어 불려지는 노래를 가리킬 가능성이 큽니다.
    reason: alternative_reading
