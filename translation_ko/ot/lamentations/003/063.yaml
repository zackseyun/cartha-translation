  source_fidelity: 히브리어의 명령형 הַבִּיטָה를 하나님께 드리는 직접 탄원의 ‘보십시오’로 옮겼고, ‘그들의 앉음과 일어섬’은 שִׁבְתָּם וְקִימָתָם의 대구 및 그들의 전반적 행동을 가리키는 표현을 충실히 보존합니다. ‘저는 그들의 노래입니다’도 אֲנִי מַנְגִּינָתָם의 명시된 1인칭과 소유 접미사를 직역적이고 시적으로 유지합니다.
  naturalness: ‘그들의 앉음과 일어섬’은 일상 산문에서는 다소 문어적이지만, 애가의 시적·탄원적 문맥에서는 자연스럽고 간결합니다. 대시 뒤의 ‘저는 그들의 노래입니다’ 역시 한국어 성경 문체 안에서 의미가 통하며, 화자가 그들이 노래하는 대상이라는 문맥적 함의를 과도하게 본문에 풀어넣지 않습니다.
  terminology: ‘조롱노래’와 ‘비웃는 노래’를 각주 대안으로 제시한 것은 מַנְגִּינָה의 기본 뜻을 본문에 남기면서 문맥상 조롱의 함의를 적절히 알립니다. 합쇼체 ‘보십시오’도 하나님께 드리는 탄원의 높임말로 적합합니다.
