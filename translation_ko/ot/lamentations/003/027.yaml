  - 짐을 지는
  lexicon: HALOT
  rationale: נשא와 עֹל의 결합은 단순 소지가 아니라 감당하고 견디는 이미지를 담으므로, 한국어에서는 관용적으로 ‘멍에를 메다’로 살렸습니다.
- source_word: בִּנְעוּרָיו
  english_pob_choice: in his youth
  chosen_korean: 자기 젊은 시절에
  alternatives_korean:
