    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 자기 젊은 시절에 멍에를 메는 것이 좋습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גֶּבֶר는 문법상 남성형이지만 여기서는 일반적인 ‘사람’의 뜻으로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멍에를 메다’는 ‘멍에를 carry/bear하다’의 관용적 한국어 표현으로, 짐을 감당하고 견디는 이미지를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: It is good
  chosen_korean: 좋습니다
  alternatives_korean:
  - 유익합니다
  - 좋은 일입니다
  lexicon: HALOT
  rationale: 평가문으로 시작하는 히브리어 טוב의 진술성을 살려 한국어도 문장형 평가로 옮겼습니다.
- source_word: לַגֶּבֶר
  english_pob_choice: for a man
  chosen_korean: 사람이
  alternatives_korean:
