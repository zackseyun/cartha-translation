  - 어른이
  lexicon: HALOT
  rationale: 히브리어의 남성 단수는 문법상 형식이지만 문맥상 일반적 진술이므로, 한국어에서는 성별을 과도하게 좁히지 않고 대표적 인간 일반으로 옮겼습니다.
- source_word: יִשָּׂא עֹל
  english_pob_choice: he bear the yoke
  chosen_korean: 멍에를 메는
  alternatives_korean:
