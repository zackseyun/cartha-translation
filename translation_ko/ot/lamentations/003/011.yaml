  terminology: ‘주께서’, ‘제’, ‘황폐하게 만드셨습니다’는 현대 표준 한국어의 격식 있는 성경 번역 문체에 적절합니다. 희귀 동사 פשׁח의 대안은 본문에서 과도하게 특정하지 않고 각주에서 ‘사납게 할퀴다’의 가능성으로 제시합니다.
