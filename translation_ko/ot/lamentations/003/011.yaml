base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/011.yaml
  text: He turned my paths aside and tore me apart[a]; he made me desolate.
  footnotes:
  - marker: a
    text: Or 'mauled me.' The rare verb likely conveys violent tearing, possibly with animal imagery carried over from the surrounding context.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 제 길들을 빗나가게 하시고 저를 찢으셨습니다[a]. 주께서 저를 황폐하게 만드셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “저를 사납게 할퀴셨습니다.” 희귀 동사로, 주변 문맥의 맹수 이미지를 이어 받아 난폭하게 해친다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכַי
  english_pob_choice: my paths
  chosen_korean: 제 길들을
  alternatives_korean:
  - 제 방식들을
  - 제 길
  lexicon: HALOT
  rationale: 복수형과 소유격을 살려 “길들”로 옮겼습니다. 비유적으로 삶의 진행 방향을 가리키므로 “방식들”보다 원문 이미지가 더 직접적입니다.
- source_word: סוֹרֵר
  english_pob_choice: turned ... aside
  chosen_korean: 돌이키시고
  alternatives_korean:
  - 옆으로 돌려버리시고
  - 비켜가게 하시고
  - 벗어나게 하시고
  lexicon: HALOT
  rationale: 길을 대상화한 동사로서 ‘옆으로 빗나가게 하다’의 방향성을 살리되, 한국어에서는 자연스럽게 “돌이키시고”로 옮겼습니다.
- source_word: וַיְפַשְּׁחֵנִי
  english_pob_choice: tore me apart
  chosen_korean: 저를 찢으셨습니다
  alternatives_korean:
  - 저를 갈기갈기 찢으셨습니다
  - 저를 마구 찢으셨습니다
  - 저를 짓이기셨습니다
  lexicon: HALOT
  rationale: 희귀동사의 폭력성과 절단 이미지를 핵심으로 보아 직접적으로 “찢다”를 택했습니다. POB의 ‘mauled me’ 여지는 주석으로 처리하되 본문은 과도하게 해석하지 않았습니다.
- source_word: שֹׁמֵם
  english_pob_choice: desolate
  chosen_korean: 황폐하게
  alternatives_korean:
  - 황무하게
  - 폐허가 되게
  - 황량하게
  lexicon: HALOT
  rationale: 상태 형용사적 의미인 ‘폐허가 된, 황폐한’을 한국어 서술 구조로 풀어 “황폐하게”를 선택했습니다.
theological_decisions:
- issue: 주체를 가리키는 대명사와 합쇼체 적용
  chosen_reading: 본문의 행위 주체를 모두 ‘주께서’로 드러내고, 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - 그가
  - 하나님이
  rationale: 히브리어 문맥에서 고통의 원인을 암묵적으로 하나님께 돌리는 강한 진술이므로, 한국어에서도 주체를 흐리지 않았습니다. 다만 직접 화법이 아니므로 하나님께 드리는 호칭의 높임은 쓰지 않고 서술체를 유지했습니다.
  doctrine_reference: 하나님의 주권과 탄식 시편/애가의 정서
