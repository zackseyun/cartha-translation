  source_fidelity: ‘돌이키시고’만으로는 히브리어 סוֹרֵר의 ‘옆으로 돌리다/빗나가게 하다’라는 방향성이 충분히 드러나지 않을 수 있습니다. ‘제 길들을 빗나가게 하시고’는 복수 소유 표현과 그 방향성을 더 분명히 보존합니다. 나머지 표현은 원문의 폭력적 이미지와 황폐해진 결과 상태를 충실히 반영합니다.
