id: LAM.3.36
reference: Lamentations 3:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/עַוֵּ֤ת אָדָם֙ בְּ/רִיב֔/וֹ אֲדֹנָ֖/י לֹ֥א רָאָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/036.yaml
  text: to deny a man justice in his case—the Lord does not approve[a][b].
  footnotes:
  - marker: a
    text: Or 'to subvert a man in his lawsuit' or 'to pervert a person's case.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Lord does not see'; the phrase may also carry the sense 'the Lord does not approve.'
    reason: alternative_reading
translation:
  language: ko
  text: 사람의 송사를 굽게 하려는 것 — 주께서는 보지 않으십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 송사를 뒤엎으려는 것’ 혹은 ‘사람의 사건을 왜곡하려는 것’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘주께서 보지 않으신다’는 뜻이며, 문맥상 ‘주께서 승인하지 않으신다’는 의미로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְעַוֵּת
  english_pob_choice: to deny a man justice
  chosen_korean: 굽게 하려는 것
  alternatives_korean:
  - 정의를 빼앗으려는 것
  - 송사를 왜곡하려는 것
  - 사람을 억울하게 하려는 것
  lexicon: HALOT
  rationale: 법정 맥락에서 ‘굽다/왜곡하다’의 의미를 살리되, 한국어에서는 자연스럽게 목적적 표현으로 옮겼습니다. ‘정의’보다 본문의 행위 자체를 드러내는 ‘굽게 하다’가 원문의 긴장을 더 직접적으로 반영합니다.
- source_word: אָדָם
  english_pob_choice: a man
  chosen_korean: 사람의
  alternatives_korean:
  - 한 사람의
  - 어떤 사람의
  - 인간의
  lexicon: HALOT
  rationale: 히브리어 단수 אָדָם을 한국어에서 성별을 과하게 드러내지 않으면서도 개인을 가리키는 ‘사람’으로 옮겼습니다. 문맥상 특정 개인의 소송을 가리키므로 복수적·추상적 표현은 피했습니다.
- source_word: בְּרִיבוֹ
  english_pob_choice: in his case
  chosen_korean: 송사
  alternatives_korean:
  - 분쟁
  - 법정 다툼
  - 사건
  lexicon: HALOT
  rationale: רִיב의 법적·소송적 뉘앙스를 살리기 위해 ‘송사’를 선택했습니다. 한국어에서 다소 전통적이지만, 본문이 말하는 ‘사건’보다 법적 대립의 성격이 더 분명합니다.
- source_word: לֹא רָאָה
  english_pob_choice: the Lord does not see
  chosen_korean: 주께서는 보지 않으십니다
  alternatives_korean:
  - 주께서는 인정하지 않으십니다
  - 주께서는 승인하지 않으십니다
  - 주께서는 보지 않으십니다
  lexicon: HALOT
  rationale: 히브리어 동사 ‘보다’를 그대로 살려, 하나님이 부당함에 대해 ‘보지 않으신다’는 시적 긴장을 유지했습니다. ‘승인하지 않으십니다’는 의미를 풀어주지만 원문 이미지가 약해집니다.
theological_decisions:
- issue: לֹא רָאָה의 의미를 ‘보지 않으심’으로 유지할지, ‘승인하지 않으심’으로 풀어쓸지
  chosen_reading: 본문은 ‘주께서는 보지 않으십니다’로 두고, 평가적 의미는 독자가 문맥에서 읽게 합니다.
  alternative_readings:
  - 주께서는 승인하지 않으십니다
  - 주께서는 인정하지 않으십니다
  rationale: 예레미야애가 3:34-36의 문맥은 부당함에 대한 하나님의 관계를 시적으로 진술합니다. 원문의 ‘보다’를 보존하면 해석을 지나치게 앞당기지 않으면서도, 하나님의 무관심이 아니라 문맥적 긴장을 유지할 수 있습니다.
  doctrine_reference: '번역 철학 §3: 신학적 긴장은 해소하기보다 보존합니다.'
