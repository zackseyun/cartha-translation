translation:
  language: ko
  text: 우리의 길들을 살피고 그것들을 찾아내며, 야훼께로 돌아갑시다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 길을 찾아내고 조사하며’의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께로 돌아서라’는 뜻으로, 이 동사는 회개의 의미도 지닐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נַחְפְּשָׂה
  english_pob_choice: Let us examine
  chosen_korean: 살피고
  alternatives_korean:
  - 검토하고
  - 살펴보고
  - 조사하고
  lexicon: HALOT
  rationale: 공동체적 자기성찰의 청유형으로, 단순한 탐색보다 삶을 자세히 들여다보는 뉘앙스를 살리는 ‘살피다’가 자연스럽습니다.
- source_word: דְרָכֵינוּ
  english_pob_choice: our ways
  chosen_korean: 우리의 길들
  alternatives_korean:
  - 우리의 행실
  - 우리의 행도
  - 우리의 삶의 길
  lexicon: HALOT
  rationale: 히브리어의 ‘길’ 비유를 보존해 삶의 방식과 행실 전체를 드러내는 표현을 유지했습니다.
- source_word: וְנַחְקֹרָה
  english_pob_choice: search them out
  chosen_korean: 그것들을 찾아내며
  alternatives_korean:
  - 그것들을 조사하며
  - 그것들을 탐구하며
  - 그것들을 살펴보며
  lexicon: HALOT
  rationale: 앞 동사와 병렬을 이루되 더 깊이 파고드는 의미를 살려 ‘찾아내다’로 옮겼습니다.
- source_word: וְנָשׁוּבָה
  english_pob_choice: and let us return
  chosen_korean: 돌아갑시다
  alternatives_korean:
  - 돌아섭시다
  - 되돌아갑시다
  - 회개합시다
  lexicon: HALOT
  rationale: 기본 뜻은 ‘돌아가다’이므로 이를 살리되, 문맥상 하나님께로의 회복을 암시하도록 청유형으로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약의 고유명사를 대체 호칭이 아니라 음역으로 보존하는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 'שׁוּב의 범위: 단순 귀환인가, 회개인가'
  chosen_reading: ‘돌아가다’의 기본 의미를 유지하되 회복과 전환의 함의를 열어 둠
  alternative_readings:
  - 회개하다
  - 돌이키다
  rationale: 본문은 자기 성찰에서 야훼께로의 복귀를 말하지만, 동사 자체는 내면적 회개를 명시하지 않으므로 의미를 과도하게 좁히지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: theological tension을 해소하지 않고 보존'
