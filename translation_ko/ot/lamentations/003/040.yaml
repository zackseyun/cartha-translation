  - 되돌아갑시다
  - 회개합시다
  lexicon: HALOT
  rationale: 기본 뜻은 ‘돌아가다’이므로 이를 살리되, 문맥상 하나님께로의 회복을 암시하도록 청유형으로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
