  lexicon: HALOT
  rationale: 앞 동사와 병렬을 이루되 더 깊이 파고드는 의미를 살려 ‘찾아내다’로 옮겼습니다.
- source_word: וְנָשׁוּבָה
  english_pob_choice: and let us return
  chosen_korean: 돌아갑시다
  alternatives_korean:
