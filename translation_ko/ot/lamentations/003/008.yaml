  text: גַּ֣ם כִּ֤י אֶזְעַק֙ וַ/אֲשַׁוֵּ֔עַ שָׂתַ֖ם תְּפִלָּתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/008.yaml
  text: Even when I cry out and call for help[a], he shuts out my prayer.
  footnotes:
  - marker: a
    text: Or 'Even though I cry out and cry for help, he blocks my prayer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 부르짖고 도움을 청해도, 그는 내 기도를 막아 버리십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 부르짖고 도움을 청해도, 그는 내 기도를 차단하십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי
  english_pob_choice: Even when
  chosen_korean: -고도 / -해도
  alternatives_korean:
  - 비록 …라도
  - 설령 …해도
  lexicon: HALOT
  rationale: 문맥상 탄원에도 불구하고 뒤의 결과가 계속되는 양보·대조 관계이므로, 한국어에서는 종속 접속 형태로 자연스럽게 살렸습니다.
- source_word: אֶזְעַק
  english_pob_choice: I cry out
  chosen_korean: 부르짖고
  alternatives_korean:
  - 외치고
  - 소리치고
  lexicon: HALOT
  rationale: זקע는 단순 발화보다 절박한 외침을 가리키므로, 애가의 정서에 맞는 ‘부르짖다’를 택했습니다.
- source_word: וַאֲשַׁוֵּעַ
  english_pob_choice: and call for help
  chosen_korean: 도움을 청해도
  alternatives_korean:
  - 간구해도
  - 살려 달라고 외쳐도
  lexicon: HALOT
  rationale: שׁוע의 ‘간절히 도움을 구함’을 살리면서, 앞의 ‘부르짖다’와 중복되지 않도록 분리해 옮겼습니다.
- source_word: שָׂתַם
  english_pob_choice: he shuts out
  chosen_korean: 막아 버리십니다
  alternatives_korean:
  - 닫아 버리십니다
  - 차단하십니다
  - 막으십니다
  lexicon: HALOT
  rationale: 동사는 ‘막다/메우다’의 의미를 가지며, 기도가 응답에 닿지 못하게 되는 이미지를 한국어로 가장 직접적으로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 무생략 3인칭 주어의 처리
  chosen_reading: 주어를 ‘그는’으로 두되, 본문에 없는 ‘하나님/주님’을 덧붙이지 않았습니다.
  alternative_readings:
  - 그분은 내 기도를 막아 버리십니다
  - 하나님이 내 기도를 막아 버리십니다
  rationale: 히브리어는 3인칭 단수 동사만 두고 주어를 생략하므로, 인접 문맥이 주체를 가리키더라도 본문 자체의 간결함을 보존했습니다.
  doctrine_reference: '원문 우선 원칙: 문맥으로 식별되는 주어를 유지하되, 본문에 없는 호칭을 삽입하지 않음'
