base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/062.yaml
  text: the lips of those who rise against me[b][a], and their muttering against me all day long.
  footnotes:
  - marker: a
    text: Or 'the speech/words of those who rise against me.' Hebrew 'lips' is a concrete expression for speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'their meditation' or 'their whispering.' The Hebrew term can refer to inward musing or low utterance; here the hostile context favors 'muttering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나를 대적하여 일어나는 자들의 입술과, 그들이 나를 향해 중얼거리는 말이 온종일 계속됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘입술’은 여기서 ‘말’ 또는 ‘말하는 것’을 가리키는 구체적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘묵상’ 또는 ‘속삭임’도 뜻할 수 있으나, 여기서는 적대적 문맥상 ‘중얼거리는 말’로 옮겼습니다.
    reason: lexical_alternative
