theological_decisions:
- issue: 적대적 병행구에서 청자/화자의 방향성
  chosen_reading: 두 절구를 각각 ‘그를 대적하여 일어나는 자들’과 ‘그들의 나에 대한 속삭임’으로 분리해, 반복되는 נגד-לי 계열의 적대 의미를 분명히 드러냈습니다.
  alternative_readings:
  - ‘나를 반대하는 자들’로 단순화
  - ‘나를 향한 속삭임’으로 완화
  rationale: 본문은 단순한 언급이 아니라 지속적 적대와 압박을 강조하므로, 한국어에서도 그 긴장을 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 시편적 탄원과 예레미야애가의 고난-호소 문맥
