  text: שִׂפְתֵ֤י קָמַ/י֙ וְ/הֶגְיוֹנָ֔/ם עָלַ֖/י כָּל הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/062.yaml
  text: the lips of those who rise against me[b][a], and their muttering against me all day long.
  footnotes:
  - marker: a
    text: Or 'the speech/words of those who rise against me.' Hebrew 'lips' is a concrete expression for speech.
    reason: lexical_alternative
  - marker: b
    text: Or 'their meditation' or 'their whispering.' The Hebrew term can refer to inward musing or low utterance; here the hostile context favors 'muttering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 대적하여 일어나는 자들의 입술과, 그들의 나에 대한 속삭임이 온종일입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘입술’은 여기서 ‘말/말하는 것’을 가리키는 구체적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘묵상’ 또는 ‘속삭임’까지 뜻할 수 있으나, 여기서는 적대적 문맥상 ‘속삭임/중얼거림’이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  english_pob_choice: the lips of
  chosen_korean: 입술
  alternatives_korean:
  - 말
  - 말들
  - 입의 말
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현인 ‘입술’을 살려, 말 자체를 가리키는 신체 메타포를 보존했습니다.
- source_word: קָמַי
  english_pob_choice: those who rise against me
  chosen_korean: 그를 대적하여 일어나는 자들
  alternatives_korean:
  - 나를 대적하는 자들
  - 나를 치는 자들
  - 반역자들
  lexicon: HALOT
  rationale: 직역하면 ‘나를 향해 일어나는 자들’에 가깝고, 문맥상 적대행위를 뜻하므로 ‘대적하여 일어나는 자들’로 옮겼습니다.
- source_word: הֶגְיוֹנָם
  english_pob_choice: their muttering
  chosen_korean: 속삭임
  alternatives_korean:
  - 중얼거림
  - 명상
  - 묵상
  lexicon: HALOT
  rationale: 이 단어는 내적 묵상부터 낮은 소리의 발화까지 포괄하지만, 적대적 문맥에서는 낮게 내뱉는 말이라는 점을 살려 ‘속삭임’으로 번역했습니다.
- source_word: כָּל הַיּוֹם
  english_pob_choice: all day long
  chosen_korean: 온종일
  alternatives_korean:
  - 하루 종일
  - 온 하루 내내
  lexicon: HALOT
  rationale: 지속성과 반복성을 자연스러운 현대 한국어로 압축해 전달하는 표준적 표현입니다.
theological_decisions:
- issue: 적대적 병행구에서 청자/화자의 방향성
  chosen_reading: 두 절구를 각각 ‘그를 대적하여 일어나는 자들’과 ‘그들의 나에 대한 속삭임’으로 분리해, 반복되는 נגד-לי 계열의 적대 의미를 분명히 드러냈습니다.
  alternative_readings:
  - ‘나를 반대하는 자들’로 단순화
  - ‘나를 향한 속삭임’으로 완화
  rationale: 본문은 단순한 언급이 아니라 지속적 적대와 압박을 강조하므로, 한국어에서도 그 긴장을 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 시편적 탄원과 예레미야애가의 고난-호소 문맥
