    rationale: 요구된 현대 formal-polite register에 맞추어 직접 탄원의 성격을 유지하는 ‘기억해 주십시오’가 더 적절합니다.
  - severity: low
    issue: 각주 a가 히브리어 어휘를 설명하면서 ‘영어 POB’를 참조합니다.
    rationale: 번역 각주는 중간 언어가 아니라 원어 및 번역 선택을 직접 설명해야 하며, ‘떠돎’보다 자연스러운 본문 표현으로 바꾸면 각주도 그에 맞추어 갱신해야 합니다.
  - severity: low
    issue: 각주 b의 ‘문자적 이미지’는 רֹאשׁ의 어휘적 불확실성을 충분히 드러내지 않습니다.
    rationale: רֹאשׁ는 독성 식물 또는 독성·쓴맛 물질을 가리킬 수 있으므로, ‘쓸개’가 전통적 대응어임을 유지하면서도 그 범위를 밝혀야 합니다.
