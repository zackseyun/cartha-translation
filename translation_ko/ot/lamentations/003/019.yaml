  rationale: 현대 합쇼체를 위해 종결을 ‘기억해 주십시오’로 바꾸고, 더 자연스러운 현대 표준어인 ‘방랑’을 사용했습니다. 원문의 목적어 병렬과 쑥·쓸개의 구체적 이미지는 보존했습니다. 각주에서는 영어 번역을 언급하지 않고 히브리어의 의미 범위와 비유적 기능을 직접 설명했습니다.
