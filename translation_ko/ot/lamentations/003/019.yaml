  text: זְכָר עָנְיִ֥/י וּ/מְרוּדִ֖/י לַעֲנָ֥ה וָ/רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/019.yaml
  text: Remember my affliction and my wandering[b][a], the wormwood and the gall.
  footnotes:
  - marker: a
    text: Or 'my homelessness' for 'my wandering'; the Hebrew term suggests unsettled roaming or vagrancy.
    reason: lexical_alternative
  - marker: b
    text: '''Wormwood and gall'' are concrete images of bitterness and poison; the phrase may also be understood metaphorically as extreme bitterness.'
    reason: cultural_note
translation:
  language: ko
  text: 내 고난과 내 떠돎을 기억하소서 — 쑥과 쓸개를.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘떠돎’은 영어 POB의 ‘wandering’에 해당하는 히브리어가 정착하지 못한 유랑·방랑의 상태를 가리킨다는 점을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쑥과 쓸개’는 문자적 이미지이면서도, 문맥상 극심한 쓰라림과 독성을 비유적으로 드러낼 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: זְכָר
  english_pob_choice: Remember
  chosen_korean: 기억하소서
  alternatives_korean:
  - 기억하십시오
  - 기억해 주십시오
  lexicon: HALOT
  rationale: 히브리어 2인칭 남성 단수 명령형의 직접 탄원을 한국어 기도체 명령으로 옮기기 위해 ‘기억하소서’를 선택했습니다.
- source_word: עָנְיִי
  english_pob_choice: my affliction
  chosen_korean: 내 고난
  alternatives_korean:
  - 나의 고난
  - 내 고통
  - 내 환난
  lexicon: HALOT
  rationale: ‘affliction’의 ملم직한 고통·압박을 표준 한국어로 자연스럽게 살리기 위해 ‘고난’을 택했습니다.
- source_word: מְרוּדִי
  english_pob_choice: my wandering
  chosen_korean: 내 떠돎
  alternatives_korean:
  - 내 방랑
  - 내 유랑
  - 내 떠돌이됨
  lexicon: HALOT
  rationale: 원문의 떠돌며 정착하지 못하는 이미지를 유지하려고, 해석을 과도하게 좁히지 않는 ‘떠돎’을 사용했습니다.
- source_word: לַעֲנָה וָרֹאשׁ
  english_pob_choice: the wormwood and the gall
  chosen_korean: 쑥과 쓸개
  alternatives_korean:
  - 쑥과 독초
  - 쑥과 독
  - 쑥과 쓴 독
  lexicon: HALOT
  rationale: 두 식물/쓴맛 이미지를 직역에 가깝게 살리되 한국어에서 비유적으로도 통하는 고통·쓴맛의 병렬로 ‘쑥과 쓸개’를 선택했습니다.
theological_decisions:
- issue: 탄원 형식의 명령형을 어떻게 옮길지
  chosen_reading: 하나님께 드리는 직접 호소로 보고 ‘기억하소서’라는 기도체 명령을 사용했습니다.
  alternative_readings:
  - 기억하십시오
  - 기억해 주십시오
  - 기억하여 주옵소서
  rationale: 시편적/애가적 호소의 긴급성과 경건한 직접성을 함께 보존하기 위한 선택입니다.
  doctrine_reference: 성경의 탄원 기도 어법
