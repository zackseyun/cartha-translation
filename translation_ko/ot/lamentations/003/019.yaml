base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/019.yaml
  text: Remember my affliction and my wandering[b][a], the wormwood and the gall.
  footnotes:
  - marker: a
    text: Or 'my homelessness' for 'my wandering'; the Hebrew term suggests unsettled roaming or vagrancy.
    reason: lexical_alternative
  - marker: b
    text: '''Wormwood and gall'' are concrete images of bitterness and poison; the phrase may also be understood metaphorically as extreme bitterness.'
    reason: cultural_note
translation:
  language: ko
  text: 나의 고난과 방랑을 기억해 주십시오—쑥과 쓸개를.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘방랑’으로 옮긴 히브리어는 정착하지 못하고 떠도는 상태를 가리킵니다. ‘유랑’ 또는 ‘집 없는 떠돎’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘쑥과 쓸개’는 쓴맛과 독성을 지닌 구체적 이미지를 사용한 표현입니다. 특히 ‘쓸개’에 해당하는 히브리어는 독성 식물이나 독성 물질을 가리킬 수도 있으며, 여기서는 극심한 쓰라림을 비유적으로 드러냅니다.
    reason: cultural_note
