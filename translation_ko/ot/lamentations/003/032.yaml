  text: כִּ֣י אִם הוֹגָ֔ה וְ/רִחַ֖ם כְּ/רֹ֥ב חסד/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/032.yaml
  text: For if he causes grief[b][a], he will also show compassion according to the abundance of his steadfast love.
  footnotes:
  - marker: a
    text: Or 'Though he causes grief, yet he will have compassion according to the abundance of his steadfast love.' The Hebrew clause can be heard with a concessive nuance in context.
    reason: alternative_reading
  - marker: b
    text: '''Steadfast love'' renders Hebrew hesed, a term that can also be expressed as ''lovingkindness,'' ''covenant love,'' or ''mercy'' depending on context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 근심을 주실지라도, 자신의 넘치는 인자하심에 따라 또한 불쌍히 여기십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문맥상 ‘비록 그가 근심을 주실지라도’라는 양보적 뉘앙스로도 들릴 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘인자하심’은 히브리어 חסד를 옮긴 것으로, 문맥에 따라 ‘사랑’, ‘언약 사랑’, ‘긍휼’로도 표현될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: ~일지라도
  alternatives_korean:
  - 만일
  - 그러나 만일
  - 비록
  lexicon: HALOT
  rationale: 문맥상 앞 절과 이어지는 조건·양보의 긴장을 살리기 위해 직역형 조건문보다 양보 뉘앙스가 드러나는 ‘~일지라도’를 택했습니다.
- source_word: הוֹגָה
  english_pob_choice: he causes grief
  chosen_korean: 근심을 주실
  alternatives_korean:
  - 괴롭게 하실
  - 고통을 주실
  - 슬픔을 주실
  lexicon: HALOT
  rationale: 히필의 사역적 뜻을 살려 ‘근심을 주다’로 옮겼고, 시가체의 정서적 맥락에서 ‘괴롭게 하다’보다 덜 과격하면서도 충분히 아픔을 드러냅니다.
- source_word: וְרִחַם
  english_pob_choice: he will also show compassion
  chosen_korean: 불쌍히 여기십니다
  alternatives_korean:
  - 긍휼을 베푸십니다
  - 자비를 보이십니다
  - 가엾이 여기십니다
  lexicon: HALOT
  rationale: רחם의 핵심인 긍휼/불쌍히 여김을 살리면서, 후행 절과의 대응을 자연스럽게 드러내기 위해 동사형으로 옮겼습니다.
- source_word: חסד
  english_pob_choice: steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 언약 사랑
  - 인애
  lexicon: HALOT
  rationale: חסד의 언약적·신실한 사랑을 한국어 성경 어휘에서 가장 널리 이해되는 ‘인자하심’으로 옮겼습니다. ‘긍휼’과 구별되는 어감도 유지됩니다.
theological_decisions:
- issue: 히브리어 두 긍휼 표현(רחם / חסד)의 구별
  chosen_reading: ‘불쌍히 여기십니다’와 ‘인자하심’으로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘자비를 베푸십니다’ 계열로 통일
  - 둘 다 ‘긍휼’ 계열로 통일
  rationale: 본문은 고통을 주시는 행위와 그에 뒤따르는 긍휼을 병치하면서, 그 근거를 ‘넘치는 인자하심’에 둡니다. 두 어휘를 구별해야 원문의 신학적 긴장이 유지됩니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
