lexical_decisions:
- source_word: הֵבִיא
  english_pob_choice: drove
  chosen_korean: 쏘아 넣으셨습니다
  alternatives_korean:
  - 끌어 넣으셨습니다
  - 가져오셨습니다
  - 밀어 넣으셨습니다
  lexicon: HALOT
  rationale: 히필형의 강한 사역성을 살려, 단순한 ‘가져오다’보다 폭력적으로 몸 안으로 관통시키는 동작을 드러내는 표현을 택했습니다.
- source_word: בְּכִלְיוֹתַי
  english_pob_choice: into my kidneys
  chosen_korean: 내 내장 속으로
  alternatives_korean:
  - 내 콩팥 속으로
  - 내 신장 속으로
  - 내 속 깊은 곳으로
  lexicon: HALOT
  rationale: כִּלְיָה는 문자적으로는 ‘콩팥/신장’이지만, 여기서는 활에 맞은 신체 내부를 가리키는 시적·신체적 이미지가 핵심이어서 현대 한국어 독자가 바로 이해할 수 있는 ‘내장 속’으로 옮겼습니다.
- source_word: בְּנֵי אַשְׁפָּתוֹ
  english_pob_choice: the sons of his quiver
  chosen_korean: 그의 화살통의 아들들
  alternatives_korean:
  - 그의 화살통의 자식들
  - 그의 화살통에서 나온 것들
  - 그의 화살들
  lexicon: HALOT
  rationale: ‘아들들 of …’이라는 히브리어 관용구를 본문에서 유지해 원문의 생생한 수사를 보존했고, 주석 없이도 의미가 이어지도록 ‘화살통’과 병치했습니다.
