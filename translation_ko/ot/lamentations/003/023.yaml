  source_fidelity: 핵심 어휘와 구문은 대체로 충실합니다. חֲדָשִׁים의 복수형 및 앞절(3:22)의 복수 선행사를 반영한 ‘그것들은’, לַבְּקָרִים의 반복적 시간 표현인 ‘아침마다’, אֱמוּנָתֶךָ의 ‘주의 신실하심’은 적절합니다. 그러나 רַבָּה는 ‘크다’라는 술어만으로 충분히 옮겨지며, ‘참으로’는 원문에 없는 강조를 보탭니다.
  naturalness: ‘그것들은 아침마다 새롭습니다’는 문맥을 전제로 하면 자연스럽고 합쇼체에도 맞습니다. 두 절을 대시로 잇는 방식도 가능하나, 한국어 성경 문장에서는 마침표로 나누는 편이 더 자연스럽고 명료합니다.
  terminology: ‘주의 신실하심’은 하나님을 가리키는 אֱמוּנָה의 신뢰성·충실성을 현대 표준어로 잘 전달합니다. ‘참으로’는 제거하는 것이 바람직합니다.
