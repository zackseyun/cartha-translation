translation:
  language: ko
  text: 그것들은 아침마다 새롭습니다[a] — 주의 신실하심은 참으로 큽니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 앞줄의 대상을 더 집합적으로 이해하면, ‘그것은 아침마다 새롭습니다’로도 옮길 수 있습니다.
