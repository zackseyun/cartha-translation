lexical_decisions:
- source_word: חֲדָשִׁים
  english_pob_choice: new
  chosen_korean: 새롭습니다
  alternatives_korean:
  - 새롭습니다
  - 새로워집니다
  - 새 것입니다
  lexicon: HALOT
  rationale: 형용사 복수형의 상태를 자연스러운 현재 서술로 옮기되, 앞절의 ‘긍휼/자비’가 이어진다는 문맥을 살려 단순한 물건의 새로움보다 갱신된 상태를 드러냈습니다.
- source_word: לַבְּקָרִים
  english_pob_choice: every morning
  chosen_korean: 아침마다
  alternatives_korean:
  - 매일 아침
  - 아침마다
  - 아침마다마다
  lexicon: HALOT
  rationale: 반복적 시간 부사를 한국어에서 가장 자연스럽게 나타내는 표현으로, ‘매일 아침’보다 원문의 반복성에 더 직접적으로 대응합니다.
- source_word: רַבָּה
  english_pob_choice: great
  chosen_korean: 참으로 큽니다
  alternatives_korean:
  - 매우 큽니다
  - 크나큽니다
  - 풍성합니다
  lexicon: HALOT
  rationale: 앞의 ‘신실하심’을 수량이 아니라 정도가 큰 것으로 진술하는 서술이므로, ‘크다’를 쓰되 감탄을 과장하지 않도록 ‘참으로’로 강조했습니다.
- source_word: אֱמוּנָתֶךָ
  english_pob_choice: your faithfulness
  chosen_korean: 주의 신실하심
  alternatives_korean:
  - 주의 신실하심
  - 주의 믿음직하심
  - 주의 충실하심
  lexicon: HALOT
  rationale: 하나님에 대한 אֱמוּנָה는 ‘믿음’보다 언약적 신뢰성과 일관성을 뜻하므로, POB의 ‘faithfulness’를 따라 ‘신실하심’으로 옮겼습니다.
theological_decisions:
- issue: 주체가 생략된 첫 절의 처리
  chosen_reading: ‘그것들은’으로 앞절의 복수형 대상(주의 긍휼/자비)을 이어 받게 했습니다.
  alternative_readings:
  - ‘그것은 새롭습니다’
  - ‘그것은 아침마다 새롭습니다’
  rationale: 히브리어는 주어가 명시되지 않지만 바로 앞절의 복수 명사에 가장 자연스럽게 연결되므로, 복수 대명사로 문맥적 연계를 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
