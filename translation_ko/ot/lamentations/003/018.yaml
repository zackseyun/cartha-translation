id: LAM.3.18
reference: Lamentations 3:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמַר֙ אָבַ֣ד נִצְחִ֔/י וְ/תוֹחַלְתִּ֖/י מֵ/יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/018.yaml
  text: So I said[a], “My endurance has perished[b], and my hope from Yahweh.”
  footnotes:
  - marker: a
    text: Or 'My splendor has perished,' if נִצְחִי is taken in the sense of eminence or glory rather than endurance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'my hope from the LORD,' an elliptical expression that may mean hope that comes from the LORD or hope placed in the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 제가 말했습니다. "제 기력은 사라졌고, 야훼께 드리는 제 소망도 사라졌습니다."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: So I said
  chosen_korean: 그래서 제가 말했습니다
  alternatives_korean:
  - 그리고 제가 말했습니다
  - 그때 제가 말했습니다
  lexicon: HALOT
  rationale: 연속 동작을 이끄는 waw-consecutive의 흐름을 자연스럽게 살리되, 절망의 결론을 드러내는 ‘그래서’로 옮겼습니다.
- source_word: נִצְחִי
  english_pob_choice: my endurance
  chosen_korean: 제 기력
  alternatives_korean:
  - 제 인내
  - 제 견디는 힘
  - 제 دوام
  lexicon: HALOT
  rationale: 문맥상 생존·지속의 힘이 꺾였다는 탄식이므로 ‘지속성/영광’보다 실제적으로 무너진 내적 힘을 가리키는 ‘기력’이 가장 자연스럽습니다.
- source_word: וְתוֹחַלְתִּי
  english_pob_choice: and my hope
  chosen_korean: 제 소망도
  alternatives_korean:
  - 제 희망도
  - 제 기대도
  lexicon: HALOT
  rationale: תּוֹחֶלֶת의 기본 의미를 살려 ‘소망’으로 옮기고, 앞절과의 평행을 살리기 위해 ‘도’를 붙였습니다.
- source_word: מֵיְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼께 드리는
  alternatives_korean:
  - 야훼에게서 오는
  - 야훼께 속한
  - 야훼를 향한
  lexicon: HALOT
  rationale: 히브리어의 מִן은 직역상 ‘~에게서/로부터’이지만, 한국어에서는 소망의 방향을 드러내는 격조사로 풀어야 의미가 분명해집니다. 다만 본문이 압축적인 표현이므로 ‘드리는’으로 해 희망이 야훼를 향해 있음을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본 용례에 따라 신명(יהוה)은 ‘야훼’로 옮겼습니다. 본문에 직접 나타난 고유 신명을 보존하는 것이 문맥과 감사표현의 원형을 가장 잘 드러냅니다.
theological_decisions:
- issue: ‘from Yahweh’의 한국어화 방식
  chosen_reading: ‘야훼께 드리는’으로 옮겨, 소망의 방향이 야훼를 향한다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘야훼로부터’
  - ‘야훼께서 주시는’
  - ‘야훼 안에서’
  rationale: 히브리어는 매우 압축된 표현이라 단순 직역만 하면 한국어에서 관계가 모호해질 수 있습니다. 문맥상 시편적 희망의 대상이 야훼라는 점을 살리되, 신학적으로 ‘야훼께서 주시는 소망’으로 과도하게 확정하지 않도록 중간 강도의 표현을 택했습니다.
  doctrine_reference: 'POB translation philosophy: source-direct compression with auditable ellipsis'
- issue: 시적 탄식의 강도
  chosen_reading: ‘제 기력은 사라졌고, ... 제 소망도 사라졌습니다’로 절망의 중복을 보존했습니다.
  alternative_readings:
  - 문장을 완만하게 풀어 ‘힘이 없다’로 약화
  - 첫 절만 남기고 두 번째 절은 일반화
  rationale: אָבַד의 강한 소멸감을 두 번 반복되는 상실 구조로 유지해야 예레미야 탄식의 절망이 희석되지 않습니다.
  doctrine_reference: Lament genre fidelity
