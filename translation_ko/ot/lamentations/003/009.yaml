    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 행로들을 비틀어 놓으셨다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר
  english_pob_choice: has walled in
  chosen_korean: 둘러막으셨고
  alternatives_korean:
  - 담을 쌓아 막으셨고
  - 둘러싸 버리셨고
  - 울타리로 막으셨고
  lexicon: HALOT
  rationale: ‘가두다’보다 구체적인 방해와 봉쇄의 이미지를 살리기 위해, 앞의 길을 외부로부터 차단하는 동작을 나타내는 ‘둘러막다’를 택했습니다.
- source_word: בְּגָזִית
  english_pob_choice: with hewn stone
  chosen_korean: 다듬은 돌로
  alternatives_korean:
  - 깎은 돌로
  - 다듬어 깎은 돌로
  - 정으로 쪼갠 돌로
  lexicon: HALOT
  rationale: גָּזִית는 손질한 석재를 가리키므로, 자연스럽고 현대적인 표현인 ‘다듬은 돌’이 원문의 물질적 이미지를 잘 전달합니다.
- source_word: נְתִיבֹתַי
  english_pob_choice: my paths
  chosen_korean: 내 경로들
  alternatives_korean:
  - 내 길들
  - 내 오솔길들
  - 내 행로들
  lexicon: HALOT
  rationale: דְּרָכַי와의 평행을 유지하면서도 약간 더 시적이고 반복을 피하는 표현으로 ‘경로들’을 선택했습니다.
- source_word: עִוָּה
  english_pob_choice: has made crooked
  chosen_korean: 굽게 하셨습니다
  alternatives_korean:
  - 비틀어 놓으셨습니다
  - 삐뚤어지게 하셨습니다
  - 구부러지게 하셨습니다
  lexicon: HALOT
  rationale: 원문의 ‘굽게 하다’는 길의 형상을 왜곡하는 뜻이므로, 도덕적 의미를 덧씌우지 않는 ‘굽게 하다’가 가장 مستقیم하게 대응합니다.
theological_decisions:
- issue: 화자에게 닥친 장애를 하나님의 주권적 행위로 서술하는 표현
  chosen_reading: ‘그가 … 하셨고 … 하셨습니다’로 직역해, 장애의 주체를 숨기지 않고 유지했습니다.
  alternative_readings:
  - 수동적으로 ‘내 길이 막혔고’로 완화
  - 일반적 상황서술로 주체를 흐림
  rationale: 애가의 탄식은 고통의 원인을 하나님의 행위로 고백하는 문맥이므로, 주체를 분명히 드러내는 것이 본문의 신학적 긴장을 보존합니다.
  doctrine_reference: 애가 3장의 탄식과 하나님의 섭리에 대한 고백
- issue: ‘굽게 하다’의 의미를 도덕적 왜곡이 아니라 길의 물리적 비틀림으로 유지
  chosen_reading: ‘길/경로’의 형상적 장애로 읽고 ‘굽게 하셨습니다’로 옮겼습니다.
  alternative_readings:
  - ‘그릇되게 하셨습니다’처럼 도덕적 의미 강화
  - ‘방향을 바꾸셨습니다’처럼 완화
  rationale: 문맥상 이동 경로의 차단과 비틀림을 말하므로, 도덕적 판단어를 피하고 공간적 이미지를 보존해야 합니다.
  doctrine_reference: 히브리 시문의 평행법과 이미지 유지
