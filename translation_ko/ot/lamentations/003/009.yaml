translation:
  language: ko
  text: 그가 내 길을 둘러막으셨습니다[a]. 다듬은 돌로 말입니다[b]. 내 행로들을 굽게 하셨습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
