  yaml_path: translation/ot/lamentations/003/009.yaml
  text: He has walled in my ways with hewn stone[c][b][a]; he has made my paths crooked.
  footnotes:
  - marker: a
    text: Or 'has fenced in my ways.'
    reason: lexical_alternative
  - marker: b
