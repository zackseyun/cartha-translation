  lexicon: HALOT
  rationale: מרה는 권위에 대한 노골적 반항/거역을 뜻하므로, 앞의 ‘범죄하다’와 구별되도록 더 강한 ‘반역하다’를 사용했습니다.
- source_word: סָלָחְתָּ
