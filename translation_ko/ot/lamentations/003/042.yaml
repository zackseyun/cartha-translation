  - 용서하지 않으셨습니다
  lexicon: HALOT
  rationale: סלח는 특히 하나님의 용서를 가리키는 상용어이므로, 문맥을 살리되 현대 독자가 자연스럽게 이해할 수 있는 ‘용서하다’로 옮겼습니다.
