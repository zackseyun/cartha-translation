reference: Lamentations 3:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִתֵּ֧ן לְ/מַכֵּ֛/הוּ לֶ֖חִי יִשְׂבַּ֥ע בְּ/חֶרְפָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/030.yaml
  text: Let him give his cheek to the one who strikes him[a]; let him be filled with reproach.
  footnotes:
  - marker: a
    text: Or 'let him have his fill of disgrace/insult.' The Hebrew idiom literally speaks of being 'filled with reproach.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 치는 자에게 그의 뺨을 내어주십시오[a]. 그는 수치로 가득 차게 되십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 수치/모욕을 실컷 당하게 하십시오.” 히브리어 관용구는 문자적으로는 ‘수치로 채워지다’를 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  english_pob_choice: Let him give
  chosen_korean: 내어주십시오
  alternatives_korean:
  - 주십시오
  - 드리십시오
  lexicon: HALOT
  rationale: 문맥상 권고·권면의 뉘앙스를 살리면서, 뺨을 ‘내어준다’는 표현이 히브리어의 자기 내어줌/제공의 동작을 자연스럽게 드러냅니다.
- source_word: לְמַכֵּהוּ
  english_pob_choice: to the one who strikes him
  chosen_korean: 그를 치는 자에게
  alternatives_korean:
  - 그를 때리는 자에게
  - 그의 치는 자에게
  lexicon: HALOT
  rationale: 분사 구문을 한국어로 자연스럽게 옮겨, 단순한 직역보다 행위자를 분명히 드러내는 표현을 택했습니다.
- source_word: לֶחִי
  english_pob_choice: his cheek
  chosen_korean: 그의 뺨
  alternatives_korean:
  - 그의 볼
  - 그의 턱
  lexicon: HALOT
  rationale: 문맥상 폭행과 수치의 몸짓을 가리키므로, 표준적이고 직관적인 ‘뺨’이 가장 적절합니다.
- source_word: יִשְׂבַּע בְּחֶרְפָּה
  english_pob_choice: let him be filled with reproach
  chosen_korean: 수치로 가득 차게 되십시오
  alternatives_korean:
  - 수치로 채워지십시오
  - 모욕으로 배부르게 되십시오
  lexicon: HALOT
  rationale: ‘be filled’의 충만 이미지를 살리면서, בְּחֶרְפָּה의 사회적·공적 수치 의미를 한국어의 ‘수치’로 옮겼습니다.
theological_decisions:
- issue: 수동적 인내를 권하는 시적 명령의 어조
  chosen_reading: 반말이나 설교체로 완화하지 않고, 권면형 명령문을 현대 한국어 공손체로 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 청유형으로 부드럽게 조정
  rationale: 히브리어의 연속 권면 구조를 보존하려면 명령/권고의 힘이 약해지지 않아야 하므로, 합쇼체 명령으로 대응했습니다.
  doctrine_reference: 애가 3:27-30의 훈계적 시적 문맥
