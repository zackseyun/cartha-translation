  to: 그가 자기를 치는 자에게 자기 뺨을 내어주고 수치를 실컷 당하게 하십시오[a].
  rationale: 두 히브리어 동사의 연속된 권고적 어조를 한국어 합쇼체에서 자연스럽게 나타내기 위해 ‘그가 … 하게 하십시오’로 통일했습니다. ‘자기 뺨’으로 소유 관계를 명확히 했고, ‘수치를 실컷 당하다’로 ‘수치로 가득 차다’라는 히브리어 관용의 결과적 의미를 자연스럽게 옮겼습니다. 각주에는 원문의 충만 은유를 보존한 대안을 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:36:53Z'
