  naturalness: 초안의 ‘그는 수치로 가득 차게 되십시오’는 주제 표지 ‘그는’과 청자 높임 명령형 ‘되십시오’의 결합이 현대 표준 한국어에서 부자연스럽습니다. 또한 ‘그의 뺨’은 누구의 뺨인지 순간적으로 모호할 수 있으므로 ‘자기 뺨’이 자연스럽습니다.
