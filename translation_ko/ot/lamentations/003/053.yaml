    text: 또는 ‘내 위에 돌을 던졌습니다.’ 이는 단순한 투석이 아니라, 돌로 구덩이를 봉하는 장면을 가리킬 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְתוּ
  english_pob_choice: silenced
  chosen_korean: 잠잠하게 하였고
  alternatives_korean:
  - 끊어 버렸고
  - 끝장냈고
  - 죽였고
  lexicon: HALOT
  rationale: 이 동사는 단순한 '죽이다'보다 생명을 끝내거나 멈추게 하는 뉘앙스를 담으므로, 한국어에서는 '잠잠하게 하다'로 옮겨 생명력의 소멸 이미지를 살렸습니다.
- source_word: בַּבּוֹר
  english_pob_choice: in the pit
  chosen_korean: 구덩이 속에서
  alternatives_korean:
  - 구덩이 안에서
  - 감옥 구덩이에서
  - 우물 속에서
  lexicon: HALOT
  rationale: 보루(bôr)는 문맥상 감금과 죽음의 경계에 있는 'pit'이므로, 보다 구체적인 시설명보다 중립적인 '구덩이'가 원문 이미지를 잘 보존합니다.
- source_word: וַיַּדּוּ אֶבֶן בִּי
  english_pob_choice: threw a stone at me
  chosen_korean: 내게 돌을 던졌습니다
  alternatives_korean:
  - 내 위에 돌을 던졌습니다
  - 내게 돌을 던져 넣었습니다
  - 내게 돌을 올려놓았습니다
  lexicon: HALOT
  rationale: 기본 의미는 '던지다'이므로 본문에는 직역에 가까운 표현을 택하되, ב의 방향성은 자연스러운 한국어 조사 '내게'로 처리했습니다.
theological_decisions:
- issue: 'בִּי의 의미 범위: 단순 투석인지, 돌로 구덩이를 봉하는 이미지인지'
  chosen_reading: 본문은 '내게 돌을 던졌습니다'로 두고, 봉쇄 가능성은 주석으로만 열어 둡니다.
  alternative_readings:
  - 내 위에 돌을 던졌습니다
  - 돌로 구덩이를 봉했습니다
  rationale: 히브리어 전치사 ב는 적대적 접촉도, 위에 얹는 동작도 허용하므로 본문은 과도한 해석을 피하고, 대안 의미는 각주로 보존하는 것이 가장 투명합니다.
  doctrine_reference: 시적 본문 해석의 다의성 보존
