id: LAM.3.24
reference: Lamentations 3:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֶלְקִ֤/י יְהוָה֙ אָמְרָ֣ה נַפְשִׁ֔/י עַל כֵּ֖ן אוֹחִ֥יל לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/024.yaml
  text: “Yahweh is my portion,” says my soul[b][a]; “therefore I will hope in him.”
  footnotes:
  - marker: a
    text: Or 'The LORD is my share' or 'The LORD is my inheritance.'
    reason: lexical_alternative
  - marker: b
    text: Or 'therefore I will wait for him' or 'therefore I will wait expectantly for him.'
    reason: lexical_alternative
translation:
  language: ko
  text: “야훼는 나의 몫이십니다”라고 내 영혼이 말합니다. “그러므로 나는 그분을 바라겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나의 몫’은 ‘나의 분깃’ 또는 ‘나의 기업’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바라겠습니다’는 ‘기다리겠습니다’ 또는 ‘기다리며 바라겠습니다’의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקִי / יְהוָה
  english_pob_choice: my portion / Yahweh
  chosen_korean: 나의 몫이십니다
  alternatives_korean:
  - 나의 분깃이십니다
  - 나의 몫입니다
  - 나의 기업이십니다
  lexicon: HALOT
  rationale: חֵלֶק은 분깃·몫·기업의 범위를 가질 수 있지만, 시적·신앙고백 문맥에서는 ‘몫’이 가장 간결하게 개인에게 주어진 여호와의 배분을 살립니다. יְהוָה는 본문대로 야훼로 옮겼습니다.
- source_word: נַפְשִׁי
  english_pob_choice: my soul
  chosen_korean: 내 영혼이
  alternatives_korean:
  - 내 마음이
  - 내 속사람이
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 화자의 내적 자아를 가리키므로, 시적 등록을 유지하는 ‘영혼’이 적절합니다. 주어 표지로 자연스럽게 ‘내 영혼이’로 옮겼습니다.
- source_word: אוֹחִיל
  english_pob_choice: I will hope
  chosen_korean: 나는 … 바라겠습니다
  alternatives_korean:
  - 나는 … 소망하겠습니다
  - 나는 … 기다리겠습니다
  - 나는 … 바라며 기다리겠습니다
  lexicon: HALOT
  rationale: 이 동사는 단순 대기가 아니라 기대를 동반한 희망을 포함하므로 ‘바라겠습니다’가 한국어에서 가장 자연스럽게 그 긴장을 살립니다.
- source_word: לוֹ
  english_pob_choice: in him
  chosen_korean: 그분을
  alternatives_korean:
  - 그분 안에서
  - 그분에게
  - 그분께
  lexicon: HALOT
  rationale: 한국어에서는 ‘희망하다’의 대상이 되는 인격적 지시를 ‘그분을 바라다’로 표현하는 것이 자연스러워, 영어의 ‘in him’보다 문맥상 목적대상을 앞세운 표현을 택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명기적 언약 이름을 제목어로 바꾸지 않고 드러내기 위해 야훼를 유지했습니다. 이는 시편·예언문학의 인격적 신앙고백을 더 직접적으로 보여 줍니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 문장부호와 인용부 처리
  chosen_reading: 영혼의 직접 인용을 따옴표로 분리
  alternative_readings:
  - 한 문장으로 연속 처리
  - 대시로 구분
  rationale: 히브리어의 내적 발화 구조를 한국어에서도 보이도록 하여, 화자의 고백과 그에 따른 결론을 분명히 했습니다.
  doctrine_reference: POB Korean style guidance
