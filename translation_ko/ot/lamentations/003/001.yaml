    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그분의 분노의 막대 아래에서 고난을 본 사람입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 ב는 ‘아래에서’, ‘에 의해’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘고난’은 ‘환난’, ‘비참’, ‘고통’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I am
  chosen_korean: 나는 …입니다
  alternatives_korean:
  - 나는 …
  - 내가 …입니다
  lexicon: HALOT
  rationale: 문두의 독립 인칭대명사는 강조를 지니므로, 한국어에서도 주어를 살려 자기 규정의 힘을 드러냈습니다.
- source_word: הַגֶּבֶר
  english_pob_choice: the man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사내
  - 그 사람
  lexicon: HALOT
  rationale: 히브리어의 정관사와 남성 단수형을 반영하되, 문맥상 특정한 화자의 자기 지칭으로 자연스럽게 읽히도록 했습니다.
- source_word: עֳנִי
  english_pob_choice: affliction
  chosen_korean: 고난
  alternatives_korean:
  - 환난
  - 비참
  - 고통
  lexicon: HALOT
  rationale: עֳנִי는 단순한 감정 고통보다 겪는 곤경 전체를 가리키므로, 의미 범위를 넓게 담는 ‘고난’을 택했습니다.
- source_word: בְּשֵׁבֶט
  english_pob_choice: under the rod
  chosen_korean: 막대 아래에서
  alternatives_korean:
  - 막대 아래에서
  - 막대 아래에
  - 막대에 의해
  lexicon: HALOT
  rationale: ב의 용법은 ‘~아래에서/ ~에 의해’로 모두 가능하지만, 징계와 심판의 이미지를 살리면서 한국어에서 가장 자연스러운 ‘아래에서’를 본문에 두었습니다.
theological_decisions:
- issue: עֶבְרָתוֹ의 인칭대명사
  chosen_reading: ‘그분의’로 옮겨, 본문에는 명시하지 않지만 문맥상 분명한 신적 분노를 한국어에서 드러냈습니다.
  alternative_readings:
  - 그의 분노의
  - 야훼의 분노의
  rationale: 히브리어는 3인칭 남성 단수 접미사만 사용하지만, 예레미야애가의 문맥상 그 대상은 하나님이므로 한국어에서는 독자가 오해하지 않도록 ‘그분의’로 자연스럽게 처리했습니다.
  doctrine_reference: Lamentations 3장 문맥
