translation:
  language: ko
  text: 야훼께서 하늘에서 내려다보시고 보실 때까지입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내려다보다’와 ‘보다’의 짝을 이루어, 야훼께서 하늘에서 주의 깊게 살피신다는 뜻을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  english_pob_choice: until
  chosen_korean: ~할 때까지
  alternatives_korean:
  - ~까지
  - ~할 때까지
  lexicon: HALOT
  rationale: 이 전치사는 앞 절의 지속 상태가 끝나는 시점을 가리키므로, 한국어에서는 자연스럽고 간결한 종결 한정 표현으로 옮기는 것이 적절합니다.
- source_word: יַשְׁקִיף
  english_pob_choice: looks down
  chosen_korean: 내려다보시고
  alternatives_korean:
  - 굽어보시고
  - 살피시고
  - 내려다보시며
  lexicon: HALOT
  rationale: 높은 곳에서 아래를 향해 보는 동작을 살려, 하늘에서의 수직적 시선을 나타내는 표현으로 옮겼습니다.
- source_word: וְיֵרֶא
  english_pob_choice: and sees
  chosen_korean: 보실
  alternatives_korean:
  - 보시고
  - 보며
  - 주시고
  lexicon: HALOT
  rationale: 첫 동사와 구별되는 두 번째 인지 동사를 유지해, 단순 반복이 아니라 주의 깊은 관찰의 병행을 드러내었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 하나님의 고유 이름이므로, 전통적 호칭 대신 표준 음역인 ‘야훼’를 사용했습니다.
- source_word: מִשָּׁמַיִם
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘에서부터
  - 하늘로
  lexicon: HALOT
  rationale: 히브리어 복수형이지만 여기서는 신적 관찰의 공간을 가리키는 관용적 단수 의미이므로, 한국어에서도 자연스러운 ‘하늘에서’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 하나님의 언약적 고유 이름을 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 테트라그라마톤 יְהוָה를 직접 사용하므로, 호칭으로 대체하지 않고 고유 이름을 보존하는 것이 원문의 의미와 신학적 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 두 동사의 병렬성
  chosen_reading: ‘내려다보시고 보실’로 두 동작을 구분해 원문의 병렬/강조를 유지했습니다.
  alternative_readings:
  - ‘살피실 때까지’처럼 하나로 합치기
  - ‘굽어보시며 보실’
  rationale: 히브리어는 서로 다른 두 동사를 나란히 두어 하늘에서의 주의 깊은 관찰을 강조하므로, 한국어에서도 의미를 합쳐 약화시키지 않도록 구분해 옮겼습니다.
  doctrine_reference: 시적 병렬법의 보존
