    reason: lexical_alternative
lexical_decisions:
- source_word: סַכּוֹתָה
  english_pob_choice: you have covered yourself
  chosen_korean: 자신을 가리셔서
  alternatives_korean:
  - 자신을 덮으셔서
  - 자신을 가리셨습니다
  - 자신을 숨기셔서
  lexicon: HALOT
  rationale: 문맥상 לָךְ가 붙어 ‘스스로를’ 가리는 반사적 의미이므로, 한국어에서는 자연스럽게 ‘자신을 가리다’로 옮겼습니다. ‘숨기다’는 의미는 가깝지만 뒤의 구름 이미지보다 해석을 더 앞세울 수 있어 피했습니다.
- source_word: בֶּעָנָן
  english_pob_choice: with a cloud
  chosen_korean: 구름으로
  alternatives_korean:
  - 구름 안에
  - 구름과 함께
  - 구름으로써
  lexicon: HALOT
  rationale: ב + 명사구는 수단/매개를 나타내므로, 한국어에서는 ‘구름으로’가 가장 간결하고 원문의 차단 이미지를 잘 살립니다.
- source_word: מֵעֲבוֹר תְּפִלָּה
  english_pob_choice: so that prayer cannot pass through
  chosen_korean: 기도가 지나갈 수 없게
  alternatives_korean:
  - 기도가 통과하지 못하게
  - 기도가 지나가지 못하도록
  - 기도가 통과할 수 없도록
  lexicon: HALOT
  rationale: מִן + 부정사구는 ‘~이 지나가지 못하게/못하도록’의 차단 의미를 가지므로, 한국어에서는 결과·목적을 자연스럽게 드러내는 표현으로 옮겼습니다. ‘기도’는 일반적 단수 명사로 쓰인 תְּפִלָּה의 관용적 의미를 살렸습니다.
theological_decisions:
- issue: 하나님의 숨으심과 기도 차단의 직설적 이미지
  chosen_reading: 하나님이 구름으로 자신을 가리셔서 기도가 지나갈 수 없게 하셨다는 직설을 유지했습니다.
  alternative_readings:
  - ‘구름 속에 숨으셨다’로 완화하기
  - 인칭적 표지를 약화해 기도에 대한 일반적 장애로 바꾸기
  rationale: 히브리어는 하나님께 직접 호소하는 탄식의 문맥에서 노골적인 차단 이미지를 사용하므로, 이를 완화하지 않고 그대로 보존해야 본문의 신학적 긴장과 애가의 정서가 살아납니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
