  naturalness: ‘어둠 속을 걷게 하셨습니다. 빛 속이 아니라.’는 한국어 시적 문맥에서 자연스럽고 간결하며, 합쇼체 종결을 유지합니다.
  terminology: 본문에 신명을 직접 명시하지 않은 원문을 따라 ‘그분’으로 처리했습니다. 나머지 핵심어는 ‘어둠’, ‘빛’으로 표준적이고 안정적으로 옮겼습니다.
