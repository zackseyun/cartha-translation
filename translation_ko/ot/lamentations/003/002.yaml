  revision_rationale: ‘몰아내다’를 ‘몰다’로 바로잡고, ‘빛이 없게 하다’라는 해석적 결과절을 원문의 짧은 명사 대조인 ‘빛 속이 아니라’로 수정했습니다. ‘속’은 히브리어의 장소적 의미를 한국어에서 자연스럽게 드러내는 최소한의 보완입니다.
