translation:
  language: ko
  text: 그분은 저를 몰아 어둠 속을 걷게 하셨습니다. 빛 속이 아니라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분은 저를 이끄시어 어둠 속을 가게 하셨습니다. 빛 속이 아니라.”
    reason: נָהַג는 ‘몰다’ 외에 ‘이끌다’로, וַיּוֹלֶךְ는 ‘걷게 하다’ 외에 ‘가게 하다’로 옮길 수 있습니다.
lexical_decisions:
- source_word: אוֹתִי
  english_pob_choice: me
  chosen_korean: 저를
  alternatives_korean:
  - 저를
  - 나를
  lexicon: HALOT
  rationale: 첫인칭 직접목적어를 자연스러운 현대 한국어로 옮기되, 시적 문맥의 고백성을 살려 ‘저를’로 정했습니다.
- source_word: נָהַג
  english_pob_choice: has driven
  chosen_korean: 몰아내시고
  alternatives_korean:
  - 이끄시고
  - 인도하시고
  lexicon: HALOT
  rationale: 이 동사는 단순한 인도보다 강제적·압박적 뉘앙스가 있으므로, 탄식의 문맥에 맞게 ‘몰아내시고’로 옮겼습니다.
- source_word: וַיֹּלַךְ
  english_pob_choice: made me walk
  chosen_korean: 걸어가게 하시며
  alternatives_korean:
  - 가게 하시며
  - 걷게 하시며
  lexicon: HALOT
  rationale: 사역형의 ‘가게 하다’ 의미를 살리면서도 한국어에서 자연스러운 구문인 ‘걸어가게 하시며’로 표현했습니다.
- source_word: חֹשֶׁךְ וְלֹא אוֹר
  english_pob_choice: in darkness and not light
  chosen_korean: 어둠 속으로 ... 빛이 없게
  alternatives_korean:
  - 어둠 가운데 ... 빛이 없게
  - 어둠과 빛이 아닌 데로
  lexicon: HALOT
  rationale: 히브리어의 짧고 날카로운 대비를 유지하기 위해 ‘어둠’과 ‘빛’을 직설적으로 대비시켰고, ‘and not light’의 절제된 부정을 ‘빛이 없게’로 옮겼습니다.
theological_decisions:
- issue: 문장 주어와 신적 행위의 귀속
  chosen_reading: 주체는 암시된 야훼이며, 한국어 본문에서는 직접 호명하지 않고 ‘주께서’로 시작해 탄식의 대상을 분명히 했습니다.
  alternative_readings:
  - 하나님께서
  - 그분이
  rationale: 본문의 3인칭 신적 행위를 한국어로 자연스럽게 드러내되, 시 전체의 탄식 화자를 살리는 방식입니다.
  doctrine_reference: 시편적/예언적 탄식의 화행
- issue: ‘빛이 없게’의 압축성
  chosen_reading: ‘and not light’의 짧은 부정을 풀어 쓰지 않고, 한국어에서도 절제된 단문으로 어둠-빛 대조를 보존했습니다.
  alternative_readings:
  - 빛이 아니라
  - 빛이 전혀 없게
  rationale: 히브리어의 압축된 시적 평행을 너무 설명적으로 바꾸면 절망의 강도가 약해지므로, 간결한 부정형을 유지했습니다.
  doctrine_reference: 히브리 시가의 평행법
