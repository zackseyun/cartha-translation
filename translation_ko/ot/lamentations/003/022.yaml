source:
  edition: WLC
  text: חַֽסְדֵ֤י יְהוָה֙ כִּ֣י לֹא תָ֔מְנוּ כִּ֥י לֹא כָל֖וּ רַחֲמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/022.yaml
  text: The steadfast love of Yahweh never ceases[a]; his mercies never come to an end.
  footnotes:
  - marker: a
    text: 'Or, following the vocalization more directly: ''Because of the steadfast love of the LORD, we are not consumed,'' or ''The steadfast loves of the LORD—that we are not consumed.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 변함없는 사랑은 결코 끊어지지 않습니다[a] — 그의 긍휼은 결코 끝나지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는, 모음 표기를 더 직접적으로 따르면: ''야훼의 변함없는 사랑 때문에 우리는 소멸되지 않습니다,'' 혹은 ''야훼의 변함없는 사랑들—우리는 소멸되지 않습니다.'''
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְדֵי
  english_pob_choice: steadfast love
  chosen_korean: 변함없는 사랑
  alternatives_korean:
  - 언약적 사랑
  - 인자하심
  - 긍휼
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·지속적 성격을 살리되, 현대 한국어에서 자연스럽고 품위 있게 읽히는 표현으로 옮겼습니다. '변함없는 사랑'은 단순한 감정보다 신실하게 지속되는 사랑의 의미를 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 전통적 대치어가 아니라 음역으로 반영해, 본문이 하나님의 이름을 직접 말한다는 점을 유지했습니다.
- source_word: לֹא תָמְנוּ
  english_pob_choice: never ceases
  chosen_korean: 결코 끊어지지 않습니다
  alternatives_korean:
  - 우리는 소멸되지 않습니다
  - 끝나지 않습니다
  - 멈추지 않습니다
  lexicon: HALOT
  rationale: 영문 POB의 본문 읽기처럼 첫 절의 주어를 야훼의 חסדים으로 이해해, 지속성의 의미를 한국어에서 자연스럽게 드러냈습니다. '끊어지지 않습니다'는 시적 평행과 잘 맞습니다.
- source_word: רַחֲמָיו
  english_pob_choice: his mercies
  chosen_korean: 그의 긍휼
  alternatives_korean:
  - 그의 자비
  - 그의 불쌍히 여기심
  - 그의 긍휼들
  lexicon: HALOT
  rationale: 복수형이지만 한국어에서는 어색한 복수 명사보다 '긍휼'로 자연스럽게 옮기되, 자비로운 행위들의 풍성함을 유지했습니다. 시적 병행상 첫 절의 사랑과 짝을 이루도록 했습니다.
theological_decisions:
- issue: 첫 절의 문법적·시적 해석
  chosen_reading: 첫 절은 '야훼의 변함없는 사랑'을 주어로 읽고, '결코 끊어지지 않습니다'로 번역했습니다.
  alternative_readings:
  - 야훼의 변함없는 사랑 때문에 우리는 소멸되지 않습니다
  - 야훼의 변함없는 사랑들 때문에 우리는 소멸되지 않습니다
  rationale: 히브리어 자음형은 '우리는 소멸되지 않는다'로도 읽힐 수 있지만, 바로 뒤의 '그의 긍휼은 결코 끝나지 않습니다'와의 평행이 첫 절도 하나님의 חסד가 지속된다는 진술로 읽도록 강하게 이끕니다. 이 본문적 긴장을 주석[a]로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it; document ambiguity and preserve alternatives in a footnote.'
