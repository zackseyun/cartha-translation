source:
  edition: WLC
  text: סַכֹּ֤תָה בָ/אַף֙ וַֽ/תִּרְדְּפֵ֔/נוּ הָרַ֖גְתָּ לֹ֥א חָמָֽלְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/043.yaml
  text: You covered yourself with anger and pursued us[b][a]; you killed without pity.
  footnotes:
  - marker: a
    text: Or 'with anger' or 'in wrath.' The Hebrew idiom uses 'nose' for anger.
    reason: lexical_alternative
  - marker: b
    text: Or 'you did not spare' / 'you did not have compassion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 진노로 자신을 가리시고 우리를 뒤쫓으셨습니다. 주님께서 가엾이 여기지 않으시고 죽이셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַף는 문자적으로는 ‘코/콧구멍’이지만 관용적으로 ‘분노/진노’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘가엾이 여기지 않으시고’ 또는 ‘불쌍히 여기지 않으시고’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַכֹּתָה
  english_pob_choice: covered yourself
  chosen_korean: 자신을 가리시고
  alternatives_korean:
  - 자신을 덮으시고
  - 가리셨고
  lexicon: HALOT
  rationale: סכך의 기본 이미지를 한국어로는 ‘가리다’가 가장 자연스럽게 살리며, 직접적인 2인칭 호소를 유지합니다.
- source_word: בָאַף
  english_pob_choice: in anger
  chosen_korean: 진노로
  alternatives_korean:
  - 분노로
  - 노여움으로
  lexicon: HALOT
  rationale: אַף의 관용적 의미인 ‘노/분노’를 살리되, 시적·예언적 문맥의 강도를 반영해 ‘진노로’로 옮겼습니다.
- source_word: וַתִּרְדְּפֵנוּ
  english_pob_choice: and pursued us
  chosen_korean: 우리를 뒤쫓으셨습니다
  alternatives_korean:
  - 우리를 추격하셨습니다
  - 우리를 쫓으셨습니다
  lexicon: HALOT
  rationale: רדף는 단순한 이동이 아니라 집요한 추격의 뉘앙스가 있어 ‘뒤쫓다’가 가장 자연스럽고 강합니다.
- source_word: לֹא חָמָלְתָּ
  english_pob_choice: without pity
  chosen_korean: 가엾이 여기지 않으시고
  alternatives_korean:
  - 불쌍히 여기지 않으시고
  - 불쌍히 여기지 않으셨습니다
  lexicon: HALOT
  rationale: חמל은 ‘아끼다/불쌍히 여기다’의 뜻이므로, 결과적으로 ‘죽이셨습니다’와 결합되는 문맥에서 ‘가엾이 여기지 않으시고’가 가장 자연스럽게 무자비함을 드러냅니다.
theological_decisions:
- issue: 애가에서 하나님께 직접 돌리는 강한 고발의 어조
  chosen_reading: 직접적인 2인칭 진술을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘우리가 뒤쫓기도록 내버려 두셨습니다’처럼 우회적으로 완화
  - ‘죽이신 것처럼 보였습니다’처럼 주관화
  rationale: 히브리어 본문은 하나님께서 하신 일로 직접 말하며, 애가 장르는 이러한 긴장을 해소하지 않고 드러내는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
