  naturalness: 합쇼체의 존대 표현은 적절합니다. 다만 ‘진노로 자신을 가리시고’보다 ‘진노로 자신을 덮으시고’가 현대 한국어에서 더 자연스럽고 원문의 이미지도 분명합니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 명료합니다.
  terminology: ‘진노’는 אַף의 문맥상 의미로 적절하며, ‘뒤쫓으셨습니다’와 ‘죽이셨습니다’도 정확합니다. חמל은 단순히 감정을 느끼지 않는 것보다 ‘긍휼을 베풀지 않다/아끼지 않다’의 뜻을 포함하므로, 본문은 자연스러운 ‘가엾이 여기지 않으시고’를 유지하되 각주에서 그 대안을 밝혀야 합니다.
