  text: צָֽפוּ מַ֥יִם עַל רֹאשִׁ֖/י אָמַ֥רְתִּי נִגְזָֽרְתִּי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/054.yaml
  text: Waters closed over my head[a]; I said[b], “I am cut off.”
  footnotes:
  - marker: a
    text: Or “Waters flowed over my head.”
    reason: lexical_alternative
  - marker: b
    text: Or “I am doomed” or “I am destroyed.” The Hebrew says “I am cut off,” preserving the image of being severed from life or hope.
    reason: lexical_alternative
translation:
  language: ko
  text: 물이 내 머리 위를 뒤덮었습니다[a]. 나는 “나는 끊어졌습니다”라고 말했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “물이 내 머리 위로 흘러넘쳤습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “나는 죽게 되었습니다” 혹은 “나는 멸망했습니다.” 히브리어는 “나는 끊어졌습니다”라고 하여 생명이나 소망에서 잘려 나간 이미지를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוּ
  english_pob_choice: closed over
  chosen_korean: 덮쳤습니다
  alternatives_korean:
  - 덮었습니다
  - 뒤덮었습니다
  - 밀려왔습니다
  lexicon: HALOT
  rationale: 물이 머리 위를 완전히 감싸는 압박감을 살리기 위해 ‘덮쳤습니다’를 택했습니다. 단순한 ‘덮었습니다’보다 재난적 침수 이미지를 더 분명하게 전달합니다.
- source_word: מַיִם
  english_pob_choice: waters
  chosen_korean: 물이
  alternatives_korean:
  - 물들이
  - 물
  - 물결이
  lexicon: HALOT
  rationale: 히브리어 복수형의 시적 집합성을 살리되 한국어 자연스러움을 위해 ‘물이’로 옮겼습니다. ‘물들’은 어색하고, ‘물결’은 의미를 좁힙니다.
- source_word: אָמַרְתִּי
  english_pob_choice: I said
  chosen_korean: 나는 …라고 말했습니다
  alternatives_korean:
  - 나는 …라고 했습니다
  - 나는 …라고 생각했습니다
  lexicon: HALOT
  rationale: 히브리어의 직접적인 ‘말하다’를 따라 ‘말했습니다’로 옮겼습니다. 내면 독백의 가능성은 문맥이 드러내므로, 동사를 ‘생각했습니다’로 바꾸어 해석을 앞서지 않았습니다.
- source_word: נִגְזָרְתִּי
  english_pob_choice: I am cut off
  chosen_korean: 나는 “나는 끊어졌습니다”라고 말했습니다
  alternatives_korean:
  - 나는 버려졌습니다
  - 나는 끊겼습니다
  - 나는 끝장났습니다
  lexicon: HALOT
  rationale: ‘끊어지다’는 생명이나 소망에서 절단된다는 히브리어 이미지와 가장 가깝습니다. ‘버려졌습니다’나 ‘끝장났습니다’는 해석을 더 강하게 밀어넣습니다.
theological_decisions:
- issue: 절망을 나타내는 최종 진술의 강도
  chosen_reading: ‘나는 끊어졌습니다’라는 직역적 표현을 유지해, 생명·구원의 선에서 절단된 절망의 이미지를 보존했습니다.
  alternative_readings:
  - 나는 끝장났습니다
  - 나는 멸망했습니다
  - 나는 죽게 되었습니다
  rationale: 본문은 감정의 과장을 넘어 ‘잘려 나감’의 은유를 사용하므로, 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 시적 탄식에서의 구원 단절 이미지
