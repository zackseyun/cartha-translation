    reason: lexical_alternative
  - marker: b
    text: ‘성읍의 딸들’은 그 성읍의 여성 주민들 또는 주민들을 가리키는 표현일 수 있으나, 원문의 표현을 보존했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֵינִי / עֵינִ֙י
  english_pob_choice: My eye
  chosen_korean: 제 눈이
  alternatives_korean:
  - 내 눈이
  - 저의 눈이
  lexicon: 눈
  rationale: 히브리어의 1인칭 단수 ‘눈’ 주어를 자연스러운 한국어로 옮기되, 시적 문맥의 절박함을 살려 ‘제’로 다듬었습니다.
- source_word: עוֹלְלָה
  english_pob_choice: causes grief
  chosen_korean: 온통 아프게 합니다
  alternatives_korean:
  - 슬프게 합니다
  - 근심하게 합니다
  - 괴롭게 합니다
  lexicon: 아프다
  rationale: 동사의 기본 뜻은 ‘해를 끼치다/괴롭히다’에 가깝고, POB의 ‘causes grief’를 한국어로 직역하되 감정적 고통의 강도를 살리기 위해 ‘온통 아프게 합니다’로 옮겼습니다.
- source_word: לְנַפְשִׁי
  english_pob_choice: to my soul
  chosen_korean: 제 영혼을
  alternatives_korean:
  - 제 혼을
  - 제 생명을
  - 제 마음을
  lexicon: 영혼
  rationale: נֶפֶשׁ은 단순한 감정보다 인격 전체를 가리키므로, POB의 ‘my soul’을 그대로 반영해 ‘영혼’을 택했습니다.
- source_word: בְּנוֹת עִירִי
  english_pob_choice: the daughters of my city
  chosen_korean: 제 성읍의 모든 딸들 때문에
  alternatives_korean:
  - 제 성읍의 딸들 때문에
  - 제 도시의 딸들 때문에
  lexicon: 딸
  rationale: ‘딸들’은 문자적으로 여성들을 가리키며, 히브리어의 ‘도시의 딸들’ 관용을 보존해야 하므로 현대적으로 풀지 않고 유지했습니다.
theological_decisions:
- issue: 문장 구조와 인과 표현
  chosen_reading: 원문의 인과 관계를 살려 ‘…때문에’로 마무리했습니다.
  alternative_readings:
  - ‘…로 인해’
  - ‘…을 인하여’
  rationale: 히브리어 전치사 מִן의 원인 의미를 분명히 드러내면서도 시적 압박을 유지하기 위해 한국어의 직접적인 원인 표지를 사용했습니다.
  doctrine_reference: 문맥 충실성
- issue: 시적 인칭 진술의 강도
  chosen_reading: 감정의 추상화보다 신체적 고통의 이미지를 살려 번역했습니다.
  alternative_readings:
  - ‘슬픔이 밀려옵니다’
  - ‘마음이 무너집니다’
  rationale: 예레미야애가의 탄식체는 개인 내면의 상처를 직접적으로 드러내므로, 완곡한 정서어보다 원문의 거친 통증감을 유지하는 편이 본문의 기능에 더 부합합니다.
  doctrine_reference: 문학 장르 보존
