- source_word: מִבּוֹר תַּחְתִּיּוֹת
  english_pob_choice: from the depths of the pit
  chosen_korean: 구덩이의 깊은 곳에서
  alternatives_korean:
  - 구덩이의 가장 낮은 곳에서
  - 구덩이의 가장 깊은 곳에서
  - 깊은 구덩이에서
  lexicon: HALOT
  rationale: בּוֹר는 우물·구덩이·감옥적 함몰을 포괄하지만, 애가의 문맥에서는 죽음에 가까운 깊은 함몰을 가리키므로 ‘구덩이’가 적절합니다. תַּחְתִּיּוֹת의 ‘가장 낮은/깊은’ 뉘앙스는 ‘깊은 곳’으로 자연스럽게 살렸습니다.
