translation:
  language: ko
  text: 주님, 제가 당신의 이름을 부르짖었습니다. 구덩이의 깊은 곳에서.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘구덩이의 가장 낮은 곳에서’ 또는 ‘구덩이 아래의 깊은 곳에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרָאתִי
  english_pob_choice: I called on
  chosen_korean: 제가 …을 부르짖었습니다
  alternatives_korean:
  - 제가 …을 불렀습니다
  - 제가 …을 외쳤습니다
  lexicon: HALOT
  rationale: 히브리어 קרא는 여기서 하나님의 이름을 호출하는 기도적 행위를 가리키므로, 단순히 ‘불렀습니다’보다 ‘부르짖었습니다’가 간구의 절박함과 invocation의 의미를 함께 살립니다.
- source_word: שִׁמְךָ
  english_pob_choice: your name
  chosen_korean: 당신의 이름
  alternatives_korean:
  - 주님의 이름
  - 당신
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현을 살려 ‘이름’을 유지해야 본문의 호칭·호출 idiom이 드러나므로, 의미를 풀어 ‘당신’으로만 옮기지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 절은 기도적 직접호칭이므로 한국어 문장 흐름에서는 ‘주님’이 가장 자연스럽습니다. 다만 원문에는 여호와/야훼 대치가 아니라 신명호칭이 직접 놓였다는 점을 반영했습니다.
- source_word: מִבּוֹר תַּחְתִּיּוֹת
  english_pob_choice: from the depths of the pit
  chosen_korean: 구덩이의 깊은 곳에서
  alternatives_korean:
  - 구덩이의 가장 낮은 곳에서
  - 구덩이의 가장 깊은 곳에서
  - 깊은 구덩이에서
  lexicon: HALOT
  rationale: בּוֹר는 우물·구덩이·감옥적 함몰을 포괄하지만, 애가의 문맥에서는 죽음에 가까운 깊은 함몰을 가리키므로 ‘구덩이’가 적절합니다. תַּחְתִּיּוֹת의 ‘가장 낮은/깊은’ 뉘앙스는 ‘깊은 곳’으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 하나님 호칭의 한국어 처리
  chosen_reading: 직접호칭으로는 ‘주님’을 사용하되, 원문의 신명호칭이 기도 속에서 호출되고 있음을 보존했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  - 주
  rationale: 본문은 절박한 탄원의 1인칭 기도이므로 한국어 독자에게는 ‘주님’이 가장 직접적이고 자연스럽습니다. 동시에 원문의 יְהוָה가 단순한 일반 호칭이 아니라 언약의 이름이라는 점은 번역 구조 전체에서 유지했습니다.
  doctrine_reference: YHWH translation policy; prayer/direct address register
