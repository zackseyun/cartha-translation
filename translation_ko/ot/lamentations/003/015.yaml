  text: הִשְׂבִּיעַ֥/נִי בַ/מְּרוֹרִ֖ים הִרְוַ֥/נִי לַעֲנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/015.yaml
  text: He has filled me with bitterness[a]; he has made me drink wormwood.
  footnotes:
  - marker: a
    text: Or 'He has drenched me with wormwood' or 'He has given me my fill of wormwood.' The Hebrew verb can carry the sense of giving drink abundantly or saturating.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 나를 쓰디쓴 것들로 배부르게 하시고, 쑥으로 마시게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘쓴 것들’입니다. 히브리어 מרורים의 복수형이 남긴 거친 이미지를 살려 본문에서는 ‘쓰디쓴 것들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׂבִּיעַנִי
  english_pob_choice: has filled me
  chosen_korean: 배부르게 하시고
  alternatives_korean:
  - 채우셨습니다
  - 만족하게 하셨습니다
  - 가득하게 하셨습니다
  lexicon: HALOT
  rationale: Hiphil of שׂבע는 ‘채우다/배부르게 하다’의 뜻을 가지며, 여기서는 고통의 대상이므로 긍정적 뉘앙스의 ‘만족하게 하다’보다 ‘배부르게 하다’가 원문의 역설을 더 잘 살립니다.
- source_word: בַמְּרוֹרִים
  english_pob_choice: with bitterness
  chosen_korean: 쓰디쓴 것들로
  alternatives_korean:
  - 쓴 것들로
  - 쓴맛으로
  - 비통함으로
  lexicon: HALOT
  rationale: מרורים는 문자적으로 ‘쓴 것들/쓴 것들(복수)’을 가리키므로, 한국어에서는 ‘쓰디쓴 것들’로 구체적 이미지를 살리되 문맥상 고난의 체험임도 드러내도록 했습니다.
- source_word: הִרְוַנִי
  english_pob_choice: has made me drink
  chosen_korean: 마시게 하셨습니다
  alternatives_korean:
  - 마시도록 하셨습니다
  - 흠뻑 적셨습니다
  - 마시게 하여 배부르게 하셨습니다
  lexicon: HALOT
  rationale: רוה의 사역형은 ‘마시게 하다/흠뻑 적시다’의 뜻을 가지며, 뒤의 לענה와 병행되는 구체적 비유를 따라 ‘마시게 하셨습니다’가 가장 직접적입니다.
- source_word: לַעֲנָה
  english_pob_choice: wormwood
  chosen_korean: 쑥
  alternatives_korean:
  - 웜우드
  - 쓴 쑥
  - 압생트풀
  lexicon: HALOT
  rationale: לענה는 성경적 상징에서 매우 쓴 식물을 가리키며, 한국어 성경에서 널리 통용되는 ‘쑥’이 이미지와 관용을 함께 살립니다. 다만 식물학적 대응을 완전히 고정하지 않기 위해 본문에서는 간결하게 처리했습니다.
theological_decisions:
- issue: 고난을 주체적으로 행하시는 분의 표지 유지
  chosen_reading: ‘그분은 … 하셨습니다’로 번역해 시편/예언문맥에서 고난을 허용하시는 하나님 혹은 그분의 섭리를 드러냈습니다.
  alternative_readings:
  - 수동적으로 ‘나는 … 되었습니다’로만 옮김
  - 행위 주체를 생략함
  rationale: 히브리어 동사의 주어가 암시하는 행위성을 약화하지 않기 위해, 본문이 말하는 고난의 주체성을 유지했습니다.
  doctrine_reference: Lamentations 3의 탄식과 하나님의 섭리 이해
