  source_fidelity: 개정이 필요합니다. 히브리어 תְּשִׂימֵנוּ는 이 문맥에서 ‘우리를 …로 두다/만들다’라는 처지 부여를 뜻하며, 초안의 ‘…처럼 여기십니다’는 인식·평가로 의미를 약화하고 완결된 동작의 뉘앙스도 바꿉니다. ‘민족들 가운데에서’와 두 멸시 명사의 병렬은 보존해야 합니다.
  naturalness: ‘우리를 민족들 가운데에서 오물과 폐물로 만드셨습니다’는 현대 표준 한국어의 자연스러운 합쇼체이며, 원문의 강한 수치·멸시 표현을 불필요하게 완화하지 않습니다.
  terminology: ‘오물과 폐물’은 각각 סְחִי와 מָאוֹס가 함께 형성하는 극도의 비천함과 버려짐을 자연스럽고 구체적으로 전달합니다. ‘주님’은 문맥상 2인칭 신적 주어를 한국어에서 명시하는 방식으로 허용됩니다.
  issues:
  - severity: medium
    issue: ‘여기십니다’가 תְּשִׂימֵנוּ의 의미를 바꿉니다.
    rationale: שׂים은 두 목적어 구문에서 ‘…로 만들다/삼다’라는 실제 처지의 부여를 나타냅니다. ‘여기다’는 단지 그렇게 평가하거나 간주한다는 뜻이어서 원문의 진술보다 약합니다.
