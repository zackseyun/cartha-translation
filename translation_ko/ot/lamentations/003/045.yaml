id: LAM.3.45
reference: Lamentations 3:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סְחִ֧י וּ/מָא֛וֹס תְּשִׂימֵ֖/נוּ בְּ/קֶ֥רֶב הָ/עַמִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/045.yaml
  text: You have made us scum and refuse in the midst of the peoples[a][b].
  footnotes:
  - marker: a
    text: Or 'offscouring and refuse'; the two rare nouns together express extreme contempt and degradation.
    reason: lexical_alternative
  - marker: b
    text: Or 'among the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서는 우리를 여러 민족들 가운데서 찌꺼기와 버림받은 것처럼 여기십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 두 희귀 명사 '찌꺼기'와 '버림받은 것'은 함께 쓰여 극도의 멸시와 천대를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '여러 민족들 가운데'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְחִי
  english_pob_choice: scum
  chosen_korean: 찌꺼기
  alternatives_korean:
  - 오물
  - 쓰레기
  - 찌꺼기 같은 것
  lexicon: HALOT
  rationale: 극도의 멸시와 천대의 뜻을 짧고 생생하게 살리면서도 현대 한국어에서 자연스럽게 들리는 표현으로 옮겼습니다.
- source_word: וּמָאוֹס
  english_pob_choice: and refuse
  chosen_korean: 버림받은 것
  alternatives_korean:
  - 쓰레기
  - 폐물
  - 버려진 것
  lexicon: HALOT
  rationale: 단순한 '거절됨'보다 버려져 가치가 없어진 상태를 드러내어 앞의 '찌꺼기'와 강한 병렬을 이루게 했습니다.
- source_word: תְּשִׂימֵנוּ
  english_pob_choice: you have made us
  chosen_korean: 우리를 … 여기십니다
  alternatives_korean:
  - 우리로 … 만드셨습니다
  - 우리를 … 두셨습니다
  - 우리를 … 삼으셨습니다
  lexicon: HALOT
  rationale: שׂים의 ‘두다/만들다’ 의미를 한국어에서는 판정·처지 부여의 뉘앙스를 살려 ‘여기다’로 자연스럽게 풀었습니다.
- source_word: בְּקֶרֶב הָעַמִּים
  english_pob_choice: in the midst of the peoples
  chosen_korean: 여러 민족들 가운데서
  alternatives_korean:
  - 백성들 가운데서
  - 민족들 한가운데서
  - 여러 백성들 가운데서
  lexicon: HALOT
  rationale: עַמִּים를 단수적 '백성'보다 복수의 주변 집단을 드러내는 '여러 민족들'로 옮겨, 공간적·사회적 위치를 살렸습니다.
theological_decisions:
- issue: 하나님이 백성에게 주는 수치의 진술을 어떻게 현대어로 살릴지
  chosen_reading: 직설적 모욕어를 약화하지 않고 그대로 드러내되, 문장 전체는 합쇼체로 유지했습니다.
  alternative_readings:
  - '''하찮은 존재로 삼으십니다''처럼 완화하는 읽기'
  - '''버림받은 자로 만드십니다''로 도덕화하는 읽기'
  rationale: 본문은 포로 공동체의 극심한 수치와 멸시를 말하므로, 감정적 강도를 약화하지 않는 번역이 필요합니다. 다만 한국어 출판 문체는 합쇼체를 유지했습니다.
  doctrine_reference: 시편/애가의 탄식 언어
- issue: 원문의 주어가 야훼이므로 영어 POB의 'You'를 한국어에서 어떻게 처리할지
  chosen_reading: 주어를 '주님께서는'으로 명시해 직접 심판적 행위를 행하시는 하나님을 드러냈습니다.
  alternative_readings:
  - 주어 생략
  - '''하나님께서는'''
  rationale: 문맥상 언약의 주체는 야훼이므로, 한국어에서는 대명사보다 명시적 호칭이 자연스럽고 공손합니다. 본문 기능은 심판적 선언이므로 '주님'을 사용했습니다.
  doctrine_reference: 언약적 심판의 주체로서의 야훼
