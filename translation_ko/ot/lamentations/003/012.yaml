  rationale: 3인칭 남성 소유를 한국어에서는 자연스럽게 ‘자기’로 풀어 소유 관계와 행위 주체를 분명히 했습니다.
- source_word: וַיַּצִּיבֵנִי
  english_pob_choice: and set me up
