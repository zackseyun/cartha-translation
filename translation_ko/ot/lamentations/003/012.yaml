    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַךְ
  english_pob_choice: bent
  chosen_korean: 당기시고
  alternatives_korean:
  - 굽히시고
  - 장전하시고
  - 당기셨습니다
  lexicon: HALOT
  rationale: 활과 함께 쓰인 동사로서 ‘활시위를 당기다’의 이미지를 살려, 공격을 준비하는 동작을 자연스럽게 한국어로 옮겼습니다.
- source_word: קַשְׁתּוֹ
  english_pob_choice: his bow
  chosen_korean: 자기 활
  alternatives_korean:
  - 그의 활
  - 그 활
  lexicon: HALOT
  rationale: 3인칭 남성 소유를 한국어에서는 자연스럽게 ‘자기’로 풀어 소유 관계와 행위 주체를 분명히 했습니다.
- source_word: וַיַּצִּיבֵנִי
  english_pob_choice: and set me up
  chosen_korean: 나를 … 세우셨습니다
  alternatives_korean:
  - 나를 배치하셨습니다
  - 나를 세워 두셨습니다
  - 나를 두셨습니다
  lexicon: HALOT
  rationale: יצב의 ‘세우다, 두다’의 의미를 따라, 적대적으로 표적 자리에 놓이는 장면을 살렸습니다.
- source_word: כַּמַּטָּרָא לַחֵץ
  english_pob_choice: as a target for the arrow
  chosen_korean: 화살의 표적처럼
  alternatives_korean:
  - 화살의 과녁처럼
  - 화살을 위한 표적으로
  - 화살의 목표처럼
  lexicon: HALOT
  rationale: כ의 비교 의미와 מטרה의 ‘표적/과녁’을 반영해, 직역보다 한국어에서 자연스러운 ‘표적처럼’을 택했습니다.
theological_decisions:
- issue: 고난의 주체를 직접적으로 표현할지 여부
  chosen_reading: 본문의 공격 주체를 완화하지 않고 ‘그분은 … 세우셨습니다’로 옮겼습니다.
  alternative_readings:
  - 나를 겨누게 하셨습니다
  - 나를 표적으로 삼으셨습니다
  rationale: 히브리어의 적대적 이미지가 분명하므로, 하나님의 주권 아래 있는 고난의 직접성을 흐리지 않도록 유지했습니다.
  doctrine_reference: 예레미야애가의 탄식과 하나님의 주권적 심판/징계 모티프
