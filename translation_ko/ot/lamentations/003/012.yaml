  lexicon: HALOT
  rationale: 활과 함께 쓰인 동사로서 ‘활시위를 당기다’의 이미지를 살려, 공격을 준비하는 동작을 자연스럽게 한국어로 옮겼습니다.
- source_word: קַשְׁתּוֹ
