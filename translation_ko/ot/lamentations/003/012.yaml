  source_fidelity: 히브리어 דָּרַךְ קַשְׁתּוֹ의 활을 당겨 발사 준비를 하는 동작, וַיַּצִּיבֵנִי의 ‘나를 세우다/배치하다’, כַּמַּטָּרָא לַחֵץ의 ‘화살의 표적처럼’이라는 비유를 충실히 반영합니다. 단수 ‘화살’도 유지되었습니다.
  naturalness: ‘그분은 자기 활을 당기시고 나를 화살의 표적처럼 세우셨습니다’는 현대 표준 한국어로 자연스럽고, 합쇼체 문체도 일관됩니다. ‘표적처럼 세우셨습니다’는 공격 대상으로 위치시키는 본문의 이미지를 적절히 전달합니다.
