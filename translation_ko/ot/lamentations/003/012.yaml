  chosen_korean: 화살의 표적처럼
  alternatives_korean:
  - 화살의 과녁처럼
  - 화살을 위한 표적으로
  - 화살의 목표처럼
  lexicon: HALOT
  rationale: כ의 비교 의미와 מטרה의 ‘표적/과녁’을 반영해, 직역보다 한국어에서 자연스러운 ‘표적처럼’을 택했습니다.
theological_decisions:
- issue: 고난의 주체를 직접적으로 표현할지 여부
  chosen_reading: 본문의 공격 주체를 완화하지 않고 ‘그분은 … 세우셨습니다’로 옮겼습니다.
  alternative_readings:
  - 나를 겨누게 하셨습니다
  - 나를 표적으로 삼으셨습니다
  rationale: 히브리어의 적대적 이미지가 분명하므로, 하나님의 주권 아래 있는 고난의 직접성을 흐리지 않도록 유지했습니다.
  doctrine_reference: 예레미야애가의 탄식과 하나님의 주권적 심판/징계 모티프
