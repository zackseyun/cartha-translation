translation:
  language: ko
  text: 주께서 제가 주께 부르던 날에 가까이 오셨습니다. 주께서 말씀하셨습니다. “두려워하지 마십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרַבְתָּ
  english_pob_choice: You came near
  chosen_korean: 가까이 오셨습니다
  alternatives_korean:
  - 다가오셨습니다
  - 가까이 다가오셨습니다
  lexicon: HALOT
  rationale: קרב의 기본 의미인 ‘가까이 오다’를 살리면서, 하나님께 대한 직접 화법에서 자연스러운 공경 표현으로 옮겼습니다.
- source_word: בְּיוֹם אֶקְרָאֶךָּ
  english_pob_choice: on the day I called to you
  chosen_korean: 제가 부르던 날에
  alternatives_korean:
  - 제가 주님께 부르짖던 날에
  - 제가 주께 부르던 날에
  lexicon: HALOT
  rationale: בְּיוֹם은 시간 부사구로 유지하되, 시적 맥락에서 ‘부르다’가 기도적 호소를 포함할 수 있어 ‘부르던 날에’로 간결하게 옮겼습니다.
- source_word: אָמַרְתָּ אַל תִּירָא
  english_pob_choice: you said, “Do not fear.”
  chosen_korean: 주께서 말씀하셨습니다. “두려워하지 마라.”
  alternatives_korean:
  - 주께서 말씀하셨습니다. “두려워하지 마십시오.”
  - 주께서 이르셨습니다. “두려워하지 마라.”
  lexicon: HALOT
  rationale: אָמַר은 ‘말씀하다’보다 ‘말씀하셨습니다’가 문맥상 더 자연스럽고, אַל + תִּירָא의 금지형은 직설적 명령으로서 인용부 안에서 ‘두려워하지 마라’가 가장 직접적입니다.
theological_decisions:
- issue: 2인칭 단수의 대상 식별
  chosen_reading: 동사의 2인칭 남성 단수형을 따라, 이 말씀은 기도하는 화자가 하나님께 직접 말하는 것으로 이해해 ‘주께서’로 처리했습니다.
  alternative_readings:
  - 비인격적 주어로 완화하는 번역
  rationale: 문법상 2인칭 단수는 명백하며, 애가 전체의 탄원 맥락에서 하나님께 대한 직접 호소로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §3
