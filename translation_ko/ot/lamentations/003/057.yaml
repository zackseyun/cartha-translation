  naturalness: 초안의 인용문 ‘두려워하지 마라’는 서술의 합쇼체 및 목표 register와 어울리지 않는 반말입니다. ‘두려워하지 마십시오’가 현대 표준어의 일관된 합쇼체이며, 하나님 말씀의 직접 인용으로도 자연스럽습니다. ‘제가 주께 부르던 날에’는 원문의 ‘당신께 부르다’를 보존하는 다소 시적인 표현입니다.
