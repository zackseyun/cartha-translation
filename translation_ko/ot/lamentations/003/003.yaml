  lexicon: HALOT
  rationale: 문맥상 적대적 방향성을 드러내지만, 한국어에서는 ‘against me’의 노골적 전치사성을 그대로 옮기기보다 반복적 공격의 대상임을 보이도록 ‘제게서’로 처리했습니다.
- source_word: יָשֻׁב / יַהֲפֹךְ
  english_pob_choice: turns ... again and again
  chosen_korean: 손을 거듭 돌리시고
  alternatives_korean:
