  text: Surely against me he turns his hand again and again all day long[a].
  footnotes:
  - marker: a
    text: Or 'Surely against me he turns back; he turns his hand all day long.' The Hebrew uses two consecutive verbs ('turns/returns' and 'turns/overturns'), which may be rendered more formally or with an iterative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 제게서 그분이 손을 거듭 돌리시고, 하루 종일 계속하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘참으로 제게서 그분이 돌아서시고, 그분이 하루 종일 손을 돌리십니다.’ 히브리어는 ‘돌다/돌아오다’와 ‘돌리다/뒤집다’의 두 동사가 연속되어 있어, 더 직역하거나 반복성을 드러내어 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 분명히
  - 과연
  - 참으로도
  lexicon: HALOT
  rationale: אַךְ는 여기서 제한이 아니라 탄식 어린 강한 확언을 나타내므로, 한국어에서는 자연스러운 감탄·강조 부사인 ‘참으로’가 적절합니다.
- source_word: בִּי
  english_pob_choice: against me
  chosen_korean: 제게서
  alternatives_korean:
  - 저를 향해
  - 저에게
  - 저에게서
  lexicon: HALOT
  rationale: 문맥상 적대적 방향성을 드러내지만, 한국어에서는 ‘against me’의 노골적 전치사성을 그대로 옮기기보다 반복적 공격의 대상임을 보이도록 ‘제게서’로 처리했습니다.
- source_word: יָשֻׁב / יַהֲפֹךְ
  english_pob_choice: turns ... again and again
  chosen_korean: 손을 거듭 돌리시고
  alternatives_korean:
  - 손을 거듭 되돌리시고
  - 손을 다시 또 돌리시고
  - 손을 돌려 뒤집으시고
  lexicon: HALOT
  rationale: 두 동사는 연속된 반복 행동을 이르므로, 영어 POB의 반복 의미를 따라 ‘거듭’으로 iterative sense를 살리고 ‘돌리시고’로 동작 이미지를 유지했습니다.
- source_word: יָדוֹ
  english_pob_choice: his hand
  chosen_korean: 손
  alternatives_korean:
  - 그의 손
  - 손길
  - 힘
  lexicon: HALOT
  rationale: 히브리어의 구체적 이미지인 ‘손’을 살리는 것이 핵심이어서, 비유를 해설어인 ‘힘’으로 바꾸지 않고 그대로 유지했습니다.
- source_word: כָּל הַיּוֹם
  english_pob_choice: all day long
  chosen_korean: 하루 종일 계속하십니다
  alternatives_korean:
  - 온종일
  - 하루 내내
  - 온종일 계속하십니다
  lexicon: HALOT
  rationale: 끊임없는 지속을 드러내기 위해 시간 부사구를 자연스럽게 풀어 ‘하루 종일 계속하십니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 반복적 손길을 어떻게 표현할지
  chosen_reading: 주어를 명시하지 않고, 문맥상 하나님을 가리키는 ‘그분’과 능동적 진행형으로 옮겨 지속적 심판의 체감을 살렸습니다.
  alternative_readings:
  - 주어를 생략하여 더 압축적으로 옮김
  - 수동적으로 ‘제게서 손이 거듭 돌아갑니다’로 옮김
  rationale: 본문은 고난의 원인을 하나님의 계속되는 행위로 탄식하는 시이므로, 인격적 행위성을 약화시키지 않으면서도 한국어 문장으로 자연스럽게 표현했습니다.
  doctrine_reference: 신정론/섭리 이해에 관한 시편·예레미야 애가의 탄식 문맥
