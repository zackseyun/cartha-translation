    text: 또는 ‘참으로 그분은 저를 향해 돌아오시며, 온종일 손을 돌리십니다.’ 히브리어에는 ‘돌아오다/되돌아가다’와 ‘돌리다/뒤집다’라는 두 동사가 연속되어 있습니다. 이를 더 직역하여 옮길 수도 있고, 본문처럼 반복의 뜻을 드러내어 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
