  text: ט֤וֹב יְהוָה֙ לְ/קוָֹ֔/ו לְ/נֶ֖פֶשׁ תִּדְרְשֶֽׁ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/025.yaml
  text: Yahweh is good to those who wait for him[a], to the soul that seeks him.
  footnotes:
  - marker: a
    text: Or 'to those who hope in him'; the Hebrew verb includes the sense of waiting with expectation.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼는 그를 기다리는 이들과 그를 찾는 영혼에게 선하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그에게 소망하는 이들에게'로 옮길 수 있습니다. 히브리어 동사는 기대를 품고 기다리는 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문의 신명사표를 그대로 살려 인격적 이름을 드러내기 위해 '야훼'를 사용했습니다.
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 선하십니다
  alternatives_korean:
  - 좋으십니다
  - 은혜로우십니다
  - 친절하십니다
  lexicon: HALOT
  rationale: 하나님의 성품을 말하는 서술형 형용사로서 '선하다'가 가장 직접적이며, 한국어에서는 서술어로 자연스럽게 풀어 '선하십니다'로 옮겼습니다.
- source_word: לְקֹוָו
  english_pob_choice: to those who wait for him
  chosen_korean: 그를 기다리는 이들
  alternatives_korean:
  - 그에게 소망하는 이들
  - 그를 바라는 이들
  lexicon: HALOT
  rationale: קוה의 '기다리다/소망하다'의 긴장을 유지하되, 본문과 가장 자연스럽게 맞는 '기다리다'를 본문에 두었습니다.
- source_word: לְנֶפֶשׁ תִּדְרְשֶׁנּוּ
  english_pob_choice: to the soul that seeks him
  chosen_korean: 그를 찾는 영혼에게
  alternatives_korean:
  - 그를 찾는 사람에게
  - 그를 구하는 생명에게
  lexicon: HALOT
  rationale: נפש를 '영혼'으로 옮겨 히브리 시의 어조를 살렸고, דרש의 관계적 의미를 '찾다'로 간결하게 반영했습니다.
theological_decisions:
- issue: קוה의 의미 긴장
  chosen_reading: 본문에는 '기다리다'를 두고, 의미 폭은 주석 성격의 각주로 보존합니다.
  alternative_readings:
  - 소망하다
  - 바라다
  rationale: 예레미야애가의 탄식 문맥에서는 인내의 대기와 기대를 함께 담은 '기다리다'가 본문상 가장 적절합니다.
  doctrine_reference: 'Translation philosophy §3: genuine ambiguity는 본문과 각주로 함께 보존'
