  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+미완료형이 기억의 지속성과 강조를 나타내므로, 한국어에서는 '끊임없이'로 그 반복적 강세를 자연스럽게 살렸습니다.
- source_word: וְתָשִׁיחַ
  english_pob_choice: is bowed down
  chosen_korean: 꺾여 있습니다
  alternatives_korean:
