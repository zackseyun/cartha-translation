  rationale: 동사의 핵심은 혼이 아래로 꺾여 눌리는 형상입니다. '꺾여 있습니다'는 비유적이고도 물리적인 낮아짐을 살리면서 한국어로도 자연스럽습니다.
- source_word: עָלַי
  english_pob_choice: within me
  chosen_korean: 내 안에서
  alternatives_korean:
  - 내게
  - 내 위에
  - 내게서
  lexicon: HALOT
  rationale: 직역하면 '내 위에/나에게'이지만, 혼이 안에서 짓눌리는 문맥에서는 한국어로 '내 안에서'가 의미를 더 정확히 전달합니다.
- source_word: נַפְשִׁי
  english_pob_choice: My soul
  chosen_korean: 내 혼
  alternatives_korean:
  - 내 영혼
  - 내 생명
  - 내 속사람
  lexicon: HALOT
  rationale: נפשׁ는 시편적·애가적 문맥에서 '혼/생명/자기'의 의미를 가질 수 있습니다. 전통적 교회어보다 원문의 인간 내면 전체를 드러내는 '혼'을 택했습니다.
theological_decisions:
