  text: My soul continually remembers and is bowed down within me[a].
  footnotes:
  - marker: a
    text: Hebrew literally, 'Remembering, it remembers; and my soul is bowed down upon me.' The repetition intensifies the act of remembering.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 영혼이 끊임없이 기억하고 내 속에서 가라앉습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '기억하고 또 기억하니, 내 영혼이 내 위에 낮아진다'에 가깝습니다. '기억하고 또 기억하다'라는 반복은 기억의 강한 지속을 나타내며, '내 위에'는 여기서 내면의 깊은 낙담을 나타내는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכ֣וֹר תִּזְכּ֔וֹר
  english_pob_choice: continually remembers
  chosen_korean: 끊임없이 기억하며
  alternatives_korean:
  - 계속 기억하며
  - 분명히 기억하며
