  text: זָכ֣וֹר תִּזְכּ֔וֹר ו/תשיח עָלַ֖/י נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/020.yaml
  text: My soul continually remembers and is bowed down within me[a].
  footnotes:
  - marker: a
    text: Hebrew literally, 'Remembering, it remembers; and my soul is bowed down upon me.' The repetition intensifies the act of remembering.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 혼이 끊임없이 기억하며 내 안에서 꺾여 있습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '기억하며, 기억한다; 그리고 내 혼이 내 위에서 꺾인다'에 가깝습니다. 반복은 기억의 강세를 더합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכ֣וֹר תִּזְכּ֔וֹר
  english_pob_choice: continually remembers
  chosen_korean: 끊임없이 기억하며
  alternatives_korean:
  - 계속 기억하며
  - 분명히 기억하며
  - 거듭 기억하며
  lexicon: HALOT
  rationale: 히브리어의 부정사 절대형+미완료형이 기억의 지속성과 강조를 나타내므로, 한국어에서는 '끊임없이'로 그 반복적 강세를 자연스럽게 살렸습니다.
- source_word: וְתָשִׁיחַ
  english_pob_choice: is bowed down
  chosen_korean: 꺾여 있습니다
  alternatives_korean:
  - 낙심해 있습니다
  - 눌려 있습니다
  - 숙여져 있습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 혼이 아래로 꺾여 눌리는 형상입니다. '꺾여 있습니다'는 비유적이고도 물리적인 낮아짐을 살리면서 한국어로도 자연스럽습니다.
- source_word: עָלַי
  english_pob_choice: within me
  chosen_korean: 내 안에서
  alternatives_korean:
  - 내게
  - 내 위에
  - 내게서
  lexicon: HALOT
  rationale: 직역하면 '내 위에/나에게'이지만, 혼이 안에서 짓눌리는 문맥에서는 한국어로 '내 안에서'가 의미를 더 정확히 전달합니다.
- source_word: נַפְשִׁי
  english_pob_choice: My soul
  chosen_korean: 내 혼
  alternatives_korean:
  - 내 영혼
  - 내 생명
  - 내 속사람
  lexicon: HALOT
  rationale: נפשׁ는 시편적·애가적 문맥에서 '혼/생명/자기'의 의미를 가질 수 있습니다. 전통적 교회어보다 원문의 인간 내면 전체를 드러내는 '혼'을 택했습니다.
theological_decisions:
- issue: 히브리어 반복 구조의 강세 전달
  chosen_reading: 반복을 단순 중복이 아니라 내적 격심함을 드러내는 강조로 옮겼습니다.
  alternative_readings:
  - 그냥 '기억합니다'로 평이하게 번역
  - '''거듭 기억합니다''로 약화된 반복만 반영'
  rationale: 본문의 부정사 절대형+미완료형은 애가의 정서적 압박을 강화합니다. 한국어에서도 이 긴장을 드러내는 편이 본문의 정서와 수사에 더 충실합니다.
  doctrine_reference: 시적 본문 번역 원칙
