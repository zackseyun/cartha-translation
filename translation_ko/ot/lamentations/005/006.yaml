  text: מִצְרַ֨יִם֙ נָתַ֣נּוּ יָ֔ד אַשּׁ֖וּר לִ/שְׂבֹּ֥עַֽ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/006.yaml
  text: We have given the hand to Egypt and to Assyria[a], to get enough bread.
  footnotes:
  - marker: a
    text: Or 'We have given a hand to Egypt and Assyria'—that is, submitted to them, sought alliance with them, or appealed to them for help.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 먹을 빵을 얻으려고 이집트와 앗수르에 손을 내밀었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트와 앗수르에 손을 내밀었습니다’—곧 그들에게 굴복했거나 동맹을 구했거나 도움을 요청했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  lexicon: HALOT
  rationale: 지명은 현대 표준 외래어 표기인 ‘이집트’로 옮기고, 전통 교회어인 ‘애굽’은 본문 직접성보다 관습이 강하므로 채택하지 않았습니다.
- source_word: נָתַנּוּ יָד
  english_pob_choice: We have given the hand
  chosen_korean: 손을 내밀었습니다
  alternatives_korean:
  - 손을 주었습니다
  - 손을 내주었습니다
  - 항복했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손을 주다’의 문자 이미지를 한국어에서 자연스럽게 살리되, 이 문맥의 항복·동맹·구걸 가능성을 포괄할 수 있도록 ‘손을 내밀다’로 옮겼습니다.
- source_word: אַשּׁוּר
  english_pob_choice: Assyria
  chosen_korean: 앗수르
  alternatives_korean:
  - 아시리아
  lexicon: HALOT
  rationale: 성경 한국어에서 널리 인식되는 고유명사 형태인 ‘앗수르’를 사용했습니다.
- source_word: לִשְׂבֹּעַ
  english_pob_choice: to get enough
  chosen_korean: 얻으려고
  alternatives_korean:
  - 배부르려고
  - 만족하려고
  - 충분히 먹으려고
  lexicon: HALOT
  rationale: ‘배부르다/만족하다’의 결과 상태보다, 여기서는 빵을 구해 결핍을 해소하려는 목적이 핵심이므로 ‘얻으려고’로 기능을 드러냈습니다.
- source_word: לָחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 양식
  - 음식
  lexicon: HALOT
  rationale: 문자적 ‘빵’이지만 한국어에서 일상적이고 구체적인 식량 이미지를 가장 직접적으로 전달할 수 있어 ‘빵’으로 옮겼습니다.
theological_decisions:
- issue: 포로기/외세 의존의 굴욕을 드러내는 관용구 처리
  chosen_reading: ‘손을 내밀었습니다’로 옮겨, 단순한 도움 요청이 아니라 이집트와 앗수르에 의존하거나 굴복한 비참한 상황을 드러냈습니다.
  alternative_readings:
  - ‘항복했습니다’
  - ‘동맹을 맺었습니다’
  - ‘도움을 청했습니다’
  rationale: 본문의 핵심은 생존을 위해 강대국들에 의존해야 했던 수치를 고백하는 데 있으므로, 문맥상 가능한 여러 함의를 지우지 않는 표현을 택했습니다.
  doctrine_reference: 예레미야애가 5:6 문맥의 국가적 참회와 수치의 고백
