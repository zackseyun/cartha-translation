  yaml_path: translation/ot/lamentations/005/002.yaml
  text: Our inheritance has been turned over to strangers[a], our houses to foreigners.
  footnotes:
  - marker: a
    text: Or 'Our inheritance has been turned to strangers, our houses to foreigners.' The Hebrew verb can be rendered more literally as 'has been turned,' but here likely implies transfer of possession.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 기업이 낯선 이들에게 넘어가고, 우리의 집들이 외국인들에게 넘어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리의 기업은 낯선 이들의 것이 되고, 우리의 집들은 외국인들의 것이 되었습니다.” 히브리어 동사는 더 문자적으로 “바뀌다” 또는 “뒤바뀌다”로 옮길 수 있으나, 여기서는 소유가 다른 이들에게 넘어간 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתֵנוּ
  english_pob_choice: our inheritance
  chosen_korean: 우리의 기업
  alternatives_korean:
  - 우리의 유산
  - 우리의 상속 재산
  - 우리의 소유
  lexicon: HALOT
  rationale: נַחֲלָה는 토지 분배와 언약적 소유를 함께 담는 말이므로, 한국어에서는 단순한 물질 소유보다 공동체가 받은 몫을 드러내는 '기업'이 더 잘 맞습니다.
- source_word: נֶהֶפְכָה
  english_pob_choice: has been turned over
  chosen_korean: 넘어갔고
  alternatives_korean:
  - 뒤집혔고
  - 넘겨졌고
  - 전해졌고
  lexicon: HALOT
  rationale: נֶהֶפְכָה의 문자적 '뒤집히다'를 살리되, 문맥상 소유권 이전의 뜻이 강하므로 '넘어가다'로 옮겨 재산이 다른 이들에게 넘어간 느낌을 드러냈습니다.
- source_word: לְזָרִים
  english_pob_choice: to strangers
  chosen_korean: 낯선 사람들에게
  alternatives_korean:
  - 타인들에게
  - 이방인들에게
  - 외부인들에게
  lexicon: HALOT
  rationale: זָרִים은 공동체 바깥의 사람들을 가리키므로, '낯선 사람들'은 친족·공동체 밖이라는 감각을 자연스럽게 살리면서도 과도한 현대적 함의를 피합니다.
- source_word: לְנָכְרִים
  english_pob_choice: to foreigners
  chosen_korean: 외국인들에게
  alternatives_korean:
  - 이방인들에게
  - 타국인들에게
  - 외인들에게
  lexicon: HALOT
  rationale: נָכְרִים은 분명한 외래성과 타문화를 가리키므로, 앞 절의 זָרִים과 구별되게 '외국인들'로 옮겨 두 히브리어 어휘의 병행을 반영했습니다.
