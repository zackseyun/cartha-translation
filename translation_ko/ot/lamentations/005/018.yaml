  lexicon: HALOT
  rationale: POB의 기본 선택을 따라 가장 직접적인 의미인 ‘여우들’로 옮겼습니다. 본문이 야생 동물의 점유를 강조하므로 관용적 완화는 피했습니다.
theological_decisions:
