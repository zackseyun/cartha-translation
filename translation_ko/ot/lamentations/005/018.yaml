  - 황폐하게 되어
  - 폐허가 되어
  lexicon: HALOT
  rationale: 지속된 황폐 상태를 나타내는 동사를 한국어에서는 원인/상태로 압축해 전달하는 편이 자연스러워, 탄식의 맥락을 살린 표현을 사용했습니다.
