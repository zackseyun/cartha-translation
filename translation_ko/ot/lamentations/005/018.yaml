  chosen_reading: ‘시온 산이 황폐하므로’로, 앞선 애가의 이유를 드러내는 구조를 살렸습니다.
  alternative_readings:
  - ‘시온 산은 황폐하여’
  - ‘시온 산이 황폐합니다’
  rationale: 이 절은 단순 진술보다 예레미야 애가의 결말로서 이유를 제시하므로, 원문의 기능을 드러내는 연결이 더 적절합니다.
