    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  english_pob_choice: because
  chosen_korean: …하므로
  alternatives_korean:
  - …때문에
  - …이므로
  - …로 말미암아
  lexicon: HALOT
  rationale: 히브리어 עַל이 여기서는 단순한 위치가 아니라 앞선 탄식의 이유를 이끄는 용법이므로, 원문의 기능을 살려 원인 연결어로 옮겼습니다.
- source_word: הַר צִיּוֹן
