  lexicon: HALOT
  rationale: 고유명사와 산의 의미를 자연스럽게 살리기 위해 표준적인 ‘시온 산’을 택했습니다.
- source_word: שֶׁשָּׁמֵם
  english_pob_choice: lies desolate
  chosen_korean: 황폐하므로
  alternatives_korean:
