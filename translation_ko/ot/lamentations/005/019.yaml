  text: אַתָּ֤ה יְהוָה֙ לְ/עוֹלָ֣ם תֵּשֵׁ֔ב כִּסְאֲ/ךָ֖ לְ/דֹ֥ר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/019.yaml
  text: But you[a], O Yahweh, sit enthroned forever; your throne is from generation to generation.
  footnotes:
  - marker: a
    text: Or 'you remain forever'; the Hebrew verb literally means 'sit,' but in this context it carries the sense of royal enthronement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님, 주님은 영원히 앉아 계시며 주님의 왕좌는 세대에서 세대로 이어집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ‘앉다’는 여기서 왕좌에 앉아 다스리시는 의미를 내포할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  english_pob_choice: you
  chosen_korean: 주님
  alternatives_korean:
  - 주님, 주님은
  - 주님이
  lexicon: HALOT
  rationale: 문맥상 대조를 이루는 2인칭 강조를 살리기 위해 서두에 ‘그러나’와 호응하는 호격으로 옮기고, 이어지는 서술은 주어를 다시 드러내어 강조를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 구절의 한국어 본문은 예배적 호격과 가독성을 고려해 ‘주님’으로 두되, 원문은 다름 아닌 야훼 이름을 직접 가리킵니다. 본문 내부의 호격 반복을 자연스럽게 살렸습니다.
- source_word: תֵּשֵׁב
  english_pob_choice: sit enthroned
  chosen_korean: 앉아 계시며
  alternatives_korean:
  - 보좌에 앉아 계시며
  - 즉위하여 계시며
  lexicon: HALOT
  rationale: 히브리어의 기본 동사 의미를 살리되, 바로 뒤의 왕좌와 결합된 군왕적 의미는 한국어에서 ‘앉아 계시다’로 과도하게 해석하지 않고 맥락으로 드러내도록 했습니다.
- source_word: כִּסְאֲךָ
  english_pob_choice: your throne
  chosen_korean: 주님의 왕좌
  alternatives_korean:
  - 주님의 보좌
  - 주님의 왕위
  lexicon: HALOT
  rationale: כִּסֵּא는 통상 ‘왕좌/보좌’지만, 본문 병행구절에서 왕권의 지속을 나타내므로 ‘왕좌’로 옮겨 왕권적 이미지를 분명히 했습니다.
- source_word: לְדֹר וָדֹר
  english_pob_choice: from generation to generation
  chosen_korean: 세대에서 세대로
  alternatives_korean:
  - 대대로
  - 세대와 세대로
  lexicon: HALOT
  rationale: 히브리어 관용구의 반복성과 연속성을 살려, 영어 POB의 직역성을 반영하면서도 한국어 시적 표현으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 여호와의 이름을 한국어 본문에서 어떻게 처리할지
  chosen_reading: 본문에서는 ‘주님’으로 두고, 원문 대조 정보는 번역 결정의 배경으로 유지했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 탄식시의 직접 호격이며, 한국어 읽기에서 반복되는 ‘주님’이 운율과 호소를 유지합니다. 다만 원문 증거는 יְהוָה의 고유 이름임을 분명히 합니다.
  doctrine_reference: 'POB divine-name policy: source-grounded transparency with contextual readability'
- issue: תֵּשֵׁב의 왕권적 의미를 얼마나 드러낼지
  chosen_reading: ‘앉아 계시며’로 직역하되, 왕좌와의 병행으로 군왕적 의미를 드러냈습니다.
  alternative_readings:
  - 보좌에 앉아 계시며
  - 영원히 다스리시며
  rationale: 히브리어는 ‘앉다’ 동사를 쓰지만, 바로 뒤의 ‘왕좌’가 이를 왕권적 즉위로 규정합니다. 한국어에서는 과도한 해설적 의역보다 원문 동사를 보존하는 편이 더 안전합니다.
  doctrine_reference: POB optimal-equivalence; original-language primacy
