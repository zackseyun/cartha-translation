  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵימֵ֨י/נוּ֙ בְּ/כֶ֣סֶף שָׁתִ֔ינוּ עֵצֵ֖י/נוּ בִּ/מְחִ֥יר יָבֹֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/004.yaml
  text: We drink our water for silver[b][a]; our wood comes at a price.
  footnotes:
  - marker: a
    text: Or 'We drink our water with money.' The Hebrew says 'for/with silver,' using 'silver' as the medium of payment.
    reason: lexical_alternative
  - marker: b
    text: Or 'our wood is brought for a price.' The Hebrew verb is plural ('they come'), but English commonly smooths this with the mass noun 'wood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 우리의 물을 은을 주고 마시며,[a] 우리의 나무는 값을 치러야 들어옵니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘은으로/은을 가지고’라고 말합니다. 여기서 ‘은’은 지불 수단을 가리키므로, 한국어에서는 그 뜻을 분명히 하려고 ‘은을 주고’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 복수형으로 문자적으로는 ‘그들이 온다’입니다. ‘우리의 나무’를 가리키는 표현으로 이해할 수 있으며, 한국어에서는 ‘값을 치러야 들어옵니다’로 옮겨 원문의 ‘오다’라는 표현과 비용 부담의 뜻을 함께 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵימֵינוּ
  english_pob_choice: our water
  chosen_korean: 우리는 물
  alternatives_korean:
