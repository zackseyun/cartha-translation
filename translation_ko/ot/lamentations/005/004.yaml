  - 들어옵니다
  lexicon: HALOT
  rationale: 히브리어 동사는 직역하면 ‘온다’이지만, 문맥상 ‘우리의 나무가 우리에게 오려면 돈을 주어야 한다’는 뜻이므로 한국어에서는 결과를 드러내는 ‘얻습니다’가 더 명확합니다.
