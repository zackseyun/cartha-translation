- source_word: בִּמְחִיר
  english_pob_choice: at a price
  chosen_korean: 값을 치르고
  alternatives_korean:
  - 대가를 치르고
  - 값에
  lexicon: HALOT
  rationale: ‘값을 치르고’는 구매의 강제성과 착취감을 살리면서도 한국어로 자연스럽습니다. 단순히 ‘가격에’보다 행위의 부담이 더 분명합니다.
- source_word: יָבֹאוּ
  english_pob_choice: comes
  chosen_korean: 얻습니다
  alternatives_korean:
