  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מֵימֵ֨י/נוּ֙ בְּ/כֶ֣סֶף שָׁתִ֔ינוּ עֵצֵ֖י/נוּ בִּ/מְחִ֥יר יָבֹֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/004.yaml
  text: We drink our water for silver[b][a]; our wood comes at a price.
  footnotes:
  - marker: a
    text: Or 'We drink our water with money.' The Hebrew says 'for/with silver,' using 'silver' as the medium of payment.
    reason: lexical_alternative
  - marker: b
    text: Or 'our wood is brought for a price.' The Hebrew verb is plural ('they come'), but English commonly smooths this with the mass noun 'wood.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 물을 은으로 마시며, 우리의 나무도 값을 치르고 얻습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 בְּכֶסֶף는 문자적으로 ‘은으로/은을 가지고’라는 뜻이므로, 화폐 일반보다 구체적 금속 화폐 이미지를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사 יָבֹאוּ는 문자적으로 ‘그들이 온다’이지만, 문맥상 ‘우리의 나무가 값 주고서야 우리에게 들어온다’는 뜻으로 풀 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵימֵינוּ
  english_pob_choice: our water
  chosen_korean: 우리는 물
  alternatives_korean:
  - 우리의 물
  - 우리 물
  lexicon: HALOT
  rationale: 히브리어의 ‘우리의 물’은 소유를 드러내지만, 한국어에서는 문맥상 주어를 먼저 세워 ‘우리는 물을’로 자연스럽게 옮겼습니다. 소유의 압박은 뒤의 ‘은으로’가 함께 드러냅니다.
- source_word: בְּכֶסֶף
  english_pob_choice: for silver
  chosen_korean: 은으로
  alternatives_korean:
  - 돈으로
  - 은을 주고
  lexicon: HALOT
  rationale: בְּכֶסֶף는 문자적으로 ‘은으로/은을 가지고’라는 뜻이므로, 화폐를 일반화한 ‘돈’보다 ‘은으로’가 원문 이미지를 더 직접적으로 보존합니다.
- source_word: עֵצֵינוּ
  english_pob_choice: our wood
  chosen_korean: 우리의 나무
  alternatives_korean:
  - 우리의 땔나무
  - 우리 목재
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘우리의 나무’라고 하므로, 필요 이상으로 ‘땔나무’로 좁히지 않고 원문 범위를 유지했습니다.
- source_word: בִּמְחִיר
  english_pob_choice: at a price
  chosen_korean: 값을 치르고
  alternatives_korean:
  - 대가를 치르고
  - 값에
  lexicon: HALOT
  rationale: ‘값을 치르고’는 구매의 강제성과 착취감을 살리면서도 한국어로 자연스럽습니다. 단순히 ‘가격에’보다 행위의 부담이 더 분명합니다.
- source_word: יָבֹאוּ
  english_pob_choice: comes
  chosen_korean: 얻습니다
  alternatives_korean:
  - 옵니다
  - 들어옵니다
  lexicon: HALOT
  rationale: 히브리어 동사는 직역하면 ‘온다’이지만, 문맥상 ‘우리의 나무가 우리에게 오려면 돈을 주어야 한다’는 뜻이므로 한국어에서는 결과를 드러내는 ‘얻습니다’가 더 명확합니다.
theological_decisions:
- issue: 탄식 시 현재형/진술형 유지
  chosen_reading: 현재적 진술로 번역해, 단발적 과거 사건이 아니라 지속되는 수탈의 상태를 드러냈습니다.
  alternative_readings:
  - 과거형으로 옮겨 한 번의 사건처럼 표현
  - 미래형/가정형으로 완화
  rationale: 이 절은 포로 공동체의 현재적 고통을 토로하는 탄식이므로, 한국어도 현재 상황을 말하는 형식이 원문의 수사적 힘을 잘 보존합니다.
  doctrine_reference: 예레미야 애가의 탄식 문맥
