lexical_decisions:
- source_word: יְתוֹמִים
  english_pob_choice: orphans
  chosen_korean: 고아가 되었고
  alternatives_korean:
  - 아비 없는 자들이 되었고
  - 부모 없는 자들이 되었고
  lexicon: HALOT
  rationale: 히브리어 יְתוֹמִים은 보호자를 잃은 처지를 가리키므로, 현대 한국어에서는 가장 자연스러운 대응인 ‘고아’로 옮겼습니다. 동사 הָיִינוּ의 결과 상태도 반영해 ‘되었고’로 처리했습니다.
- source_word: אֵין אָב
  english_pob_choice: without a father
  chosen_korean: 아버지가 없으며
  alternatives_korean:
  - 아버지가 없고
  - 아버지 없이
  lexicon: HALOT
  rationale: 존재 부정 표현을 한국어로 매끄럽게 옮기면서, 아버지의 부재라는 뜻을 분명히 드러내기 위해 ‘아버지가 없으며’를 택했습니다.
- source_word: אִמֹּתֵינוּ
  english_pob_choice: our mothers
  chosen_korean: 우리 어머니들은
  alternatives_korean:
  - 우리의 어머니들은
  - 어머니들은
  lexicon: HALOT
  rationale: 직접적인 소유격 관계를 자연스러운 현대 한국어로 반영해 ‘우리 어머니들은’으로 옮겼습니다.
- source_word: כְּאַלְמָנוֹת
  english_pob_choice: like widows
  chosen_korean: 과부들처럼
  alternatives_korean:
  - 과부처럼
  - 마치 과부들인 것처럼
  lexicon: HALOT
  rationale: כ의 비교 의미를 보존하여 단정이 아니라 비유임을 살렸습니다. 한국어에서는 ‘~처럼’이 가장 간결하고 명확합니다.
theological_decisions:
- issue: 비유의 강도—‘과부들처럼’의 비교 유지
  chosen_reading: 어머니들이 실제로 과부라고 단정하지 않고, ‘과부들처럼’이라는 비교를 유지했습니다.
  alternative_readings:
  - 우리 어머니들은 과부입니다.
  - 우리 어머니들은 과부가 되었습니다.
  rationale: 히브리어는 비교 표지 כ를 사용하므로, 애가의 수사적 비통함은 살리되 원문이 말하지 않은 확정적 진술로 강화하지 않는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
