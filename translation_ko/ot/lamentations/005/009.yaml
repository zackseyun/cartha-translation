  rationale: 영어 주해가 제시하듯 소유격보다 장소/위험의 뉘앙스가 더 자연스러우므로, ‘광야의 칼’로 압축해 살렸습니다.
theological_decisions:
- issue: 생존의 절박함을 어떻게 드러낼 것인가
  chosen_reading: ‘생명을 걸고서야’로 번역해, 단순한 어려움이 아니라 목숨이 위태로운 상황임을 분명히 했습니다.
  alternative_readings:
  - ‘위험을 무릅쓰고서야’
  - ‘목숨을 걸고’
  rationale: 본문은 일상적 고생이 아니라 생명과 직결된 위협을 말하므로, 위험성을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문의 문맥적 의미 보존 원칙
