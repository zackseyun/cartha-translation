  text: At the risk of our lives we get our bread[b][a], because of the sword in the wilderness.
  footnotes:
  - marker: a
    text: Or 'we bring in our bread at the risk of our lives.' The Hebrew verb can be understood as 'bring' or more generally 'obtain/procure.'
    reason: lexical_alternative
  - marker: b
    text: Or 'because of the sword of the wilderness,' possibly referring to sword-bearing danger in the wilderness rather than a sword belonging to the wilderness itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 생명을 걸고서야 빵을 얻습니다[ [a] ], 광야의 칼 때문에입니다[ [b] ].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 생명을 걸고서 우리의 빵을 가져옵니다.’ 히브리어 동사는 ‘가져오다’ 또는 더 넓게 ‘얻다/구하다’로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘광야의 칼 때문에’. 이는 ‘광야에 속한 칼’이라기보다 광야에서 칼의 위협을 받는다는 뜻일 수 있습니다.
    reason: lexical_alternative
