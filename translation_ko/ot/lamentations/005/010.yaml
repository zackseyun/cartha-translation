translation:
  language: ko
  text: 우리의 살갗은 기근의 타는 열기 때문에 화덕처럼 달아올랐습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리의 살갗은 기근의 타는 열기 때문에 화덕처럼 그을렸습니다.” 히브리어 동사와 ‘타는 열기’로 옮긴 낱말은 모두 드물며, 열로 달아오른 상태뿐 아니라 그을림을 강조할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרֵנוּ
  english_pob_choice: Our skin
  chosen_korean: 우리의 살갗
  alternatives_korean:
  - 우리의 피부
  - 우리의 가죽
  lexicon: HALOT
  rationale: עוֹר는 사람의 몸에 대해서는 ‘피부/살갗’이 자연스럽습니다. ‘가죽’은 동물적 뉘앙스가 강하고, 현대 한국어에서는 지나치게 거칠게 들릴 수 있어 피했습니다.
- source_word: כְּתַנּוּר
  english_pob_choice: as hot as an oven
  chosen_korean: 마치 화덕처럼 뜨겁습니다
  alternatives_korean:
  - 화덕처럼
  - 오븐처럼 뜨겁습니다
  - 화덕만큼 뜨겁습니다
  lexicon: HALOT
  rationale: 비교 표지 כְּ와 תַנּוּר의 이미지를 살리되, 한국어에서는 상태 서술이 자연스럽도록 ‘마치 …처럼 뜨겁습니다’로 옮겼습니다. ‘화덕’은 본문의 강한 열 이미지를 잘 전달합니다.
- source_word: נִכְמָרוּ
  english_pob_choice: is as hot
  chosen_korean: 뜨겁습니다
  alternatives_korean:
  - 달아올랐습니다
  - 달궈졌습니다
  - 타들어 갑니다
  lexicon: HALOT
  rationale: 드문 니팔형으로, 문맥상 살갗이 열에 달아오른 상태를 가리킵니다. 한국어에서는 결과 상태를 간결하게 드러내는 ‘뜨겁습니다’가 가장 자연스럽습니다.
- source_word: זַלְעֲפוֹת
  english_pob_choice: burning heat
  chosen_korean: 타는 열기
  alternatives_korean:
  - 불타는 열기
  - 불같은 열기
  - 타는 더위
  lexicon: HALOT
  rationale: זַלְעֲפוֹת는 강렬한 열, 열병 같은 타는 느낌을 담을 수 있어 ‘타는 열기’로 옮겼습니다. 영어 주해가 ‘fever’보다 더 직접적인 열 이미지를 우선한 점도 반영했습니다.
- source_word: מִפְּנֵי
  english_pob_choice: because of
  chosen_korean: 때문에
  alternatives_korean:
  - ~로 말미암아
  - ~으로 인해
  - ~ 때문에
  lexicon: HALOT
  rationale: 여기서는 원인 표지이므로 한국어의 가장 직접적인 원인 표현인 ‘때문에’를 사용했습니다.
