id: LAM.5.16
reference: Lamentations 5:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָֽפְלָה֙ עֲטֶ֣רֶת רֹאשֵׁ֔/נוּ אֽוֹי נָ֥א לָ֖/נוּ כִּ֥י חָטָֽאנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/016.yaml
  text: The crown has fallen from our head[a]. Woe to us[b], for we have sinned.
  footnotes:
  - marker: a
    text: Or 'The crown of our head fell.' The Hebrew uses a poetic construct phrase, literally 'the crown of our head.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Alas for us.' The expression is a cry of lament.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 머리에서 왕관이 떨어졌습니다[a]. 우리에게 화가 있습니다[b], 우리가 죄를 지었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리 머리의 왕관’입니다. 히브리어는 시적 소유구문을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아, 우리에게 화가 있습니다.’ 여기서 감탄사는 탄식의 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָפְלָה / עֲטֶרֶת רֹאשֵׁנוּ
  english_pob_choice: The crown has fallen from our head
  chosen_korean: 우리 머리에서 왕관이 떨어졌습니다
  alternatives_korean:
  - 우리 머리의 왕관이 떨어졌습니다
  - 우리 머리의 왕관이 무너졌습니다
  lexicon: WLC; HALOT
  rationale: 히브리어는 ‘머리의 왕관’이라는 시적 소유구문을 쓰지만, 한국어에서는 ‘우리 머리에서 왕관이 떨어졌습니다’가 이미지와 상실감을 가장 자연스럽게 살립니다.
- source_word: אֽוֹי נָ֥א לָ֖נוּ
  english_pob_choice: Woe to us
  chosen_korean: 우리에게 화가 있습니다
  alternatives_korean:
  - 아, 우리에게 화가 있습니다
  - 오, 우리에게 화가 있습니다
  - 우리에게 화가 있도다
  lexicon: HALOT
  rationale: אוי는 애도의 탄식이며, נא는 여기서 공손표현이 아니라 탄식의 강도를 더합니다. ‘화가 있습니다’는 탄식과 재앙의 뉘앙스를 함께 살립니다.
- source_word: כִּ֥י חָטָֽאנוּ
  english_pob_choice: for we have sinned
  chosen_korean: 우리가 죄를 지었기 때문입니다
  alternatives_korean:
  - 우리가 죄를 지었습니다
  - 우리가 범죄했기 때문입니다
  lexicon: HALOT
  rationale: 원문은 상실의 이유를 명시적으로 ‘우리가 죄를 지었기 때문’이라고 연결합니다. 한국어에서는 인과를 분명히 드러내면서도 문어체 흐름을 자연스럽게 유지했습니다.
theological_decisions:
- issue: 공동체적 죄책 고백과 재앙의 인과 관계
  chosen_reading: 이 절은 공동체가 자기들의 상실을 하나님의 징계와 연결하며 죄책을 고백하는 탄식으로 옮겼습니다.
  alternative_readings:
  - 단순한 비탄으로만 읽는 번역
  - 죄 고백을 약화한 감정적 탄식
  rationale: 히브리어의 כִּי חָטָאנוּ는 원인을 분명히 밝히므로, 번역도 상실의 원인이 공동체의 죄라는 점을 흐리지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it.'
