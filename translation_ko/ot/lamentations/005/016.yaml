  source_fidelity: 첫 구절의 히브리어 עֲטֶרֶת רֹאשֵׁנוּ는 직역상 ‘우리 머리의 왕관’이라는 연계구문입니다. 초안의 ‘우리 머리에서 왕관이’도 가능한 해석적 표현이지만, 원문의 시적 이미지를 다소 풀어 씁니다. אוי נא לנו는 재앙의 단정이라기보다 공동체를 향한 탄식의 외침이므로, 한국어에서는 ‘화가 있습니다’보다 ‘화를 입었습니다’가 ‘화’의 현대적 ‘분노’ 의미와의 혼동을 피하면서 탄식의 뜻을 더 분명히 합니다. כּי는 인과로, ‘우리가 죄를 지었기 때문입니다’는 적절합니다.
  naturalness: ‘우리에게 화가 있습니다’는 현대 한국어에서 ‘우리에게 분노가 있다’로도 읽히며 탄식의 감탄사로는 다소 부자연스럽습니다. ‘아, 우리는 화를 입었습니다!’는 현대적이면서도 격식 있는 문체로 공동체적 비탄을 자연스럽게 전달합니다.
