translation:
  language: ko
  text: 우리 머리의 왕관이 떨어졌습니다[a]. 아, 우리는 화를 입었습니다[b]! 우리가 죄를 지었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
