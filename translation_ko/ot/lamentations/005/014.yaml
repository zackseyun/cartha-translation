    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵנִים
  english_pob_choice: the elders
  chosen_korean: 장로들
  alternatives_korean:
  - 늙은이들
  - 노인들
  lexicon: HALOT
  rationale: 문맥이 단순한 연령보다 공동체의 지도층을 가리키므로, 한국어에서도 사회적 기능을 살린 ‘장로들’이 가장 적절합니다.
- source_word: מִשַּׁעַר
  english_pob_choice: from the gate
  chosen_korean: 성문에서
  alternatives_korean:
  - 성문으로부터
  - 문에서
  - 성문에서부터
  lexicon: HALOT
  rationale: ‘문’보다 ‘성문’이 성읍의 공적 공간을 드러내며, מן + gate의 이탈/철수 의미를 자연스럽게 살립니다.
- source_word: שָׁבָתוּ
  english_pob_choice: have ceased
  chosen_korean: 물러갔고
  alternatives_korean:
  - 끊어졌고
  - 멈추었고
  - 중단되었고
  lexicon: HALOT
  rationale: 직역하면 ‘그쳤다’이지만, 성문이라는 공적 자리를 더 이상 차지하지 못하는 상황을 한국어로는 ‘물러갔고’가 가장 자연스럽게 드러냅니다.
- source_word: מִנְּגִינָתָם
  english_pob_choice: from their music
  chosen_korean: 그들의 음악에서
  alternatives_korean:
  - 그들의 연주에서
  - 그들의 노래에서
  - 그들의 악기 연주에서
  lexicon: HALOT
  rationale: נְגִינָה는 연주/음악을 넓게 가리킬 수 있으므로, 원문의 시적 평행을 살리되 과도하게 한정하지 않는 ‘음악’이 적절합니다.
theological_decisions:
- issue: 성문 이미지의 의미
  chosen_reading: ‘성문에서 물러갔다’로 번역해 공적 재판과 지도 활동의 중단을 암시하되, 본문에 없는 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘성문에서 그쳤다’
  - ‘성문을 떠났다’
  rationale: 예레미야 애가의 탄식 문맥에서 성문은 공동체의 삶과 재판의 중심이므로, 단순 위치보다 기능 상실의 뉘앙스를 살리는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 예레미야 애가 5장 전체의 공동체적 재난과 질서 붕괴의 묘사
- issue: ‘음악’의 범위
  chosen_reading: ‘음악’으로 두어 악기 연주를 포함할 수 있는 넓은 의미를 유지했습니다.
  alternative_readings:
  - ‘연주’
  - ‘노래’
  - ‘악기 연주’
  rationale: 본문 자체가 연주 방식까지 특정하지 않으므로, 시적 병렬성을 보존하면서도 의미를 과도하게 좁히지 않는 번역이 필요합니다.
  doctrine_reference: 히브리어 נְגִינָה의 의미 범위
