  text: Slaves rule over us[b][a]; there is no one to rescue us from their hand.
  footnotes:
  - marker: a
    text: Or 'servants rule over us.' The Hebrew עֲבָדִים can denote either servants or slaves; 'slaves' is chosen here to preserve the force of social humiliation in the lament.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from their hand,' an idiom for being under their power or control.
    reason: lexical_alternative
translation:
  language: ko
  text: 노예들이 우리를 다스립니다[a]. 그들의 손에서 우리를 건져 낼 사람은 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “종들이 우리를 다스립니다.” 히브리어 עֲבָדִים은 “종” 또는 “노예”를 뜻할 수 있습니다. 여기서는 사회적 굴욕을 더 강하게 드러내기 위해 “노예”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 “그들의 손에서”는 그들의 권세나 통제 아래에 있음을 나타내는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים
  english_pob_choice: Slaves
  chosen_korean: 노예들
  alternatives_korean:
  - 종들
