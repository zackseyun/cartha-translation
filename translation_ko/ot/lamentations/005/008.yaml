  text: עֲבָדִים֙ מָ֣שְׁלוּ בָ֔/נוּ פֹּרֵ֖ק אֵ֥ין מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/008.yaml
  text: Slaves rule over us[b][a]; there is no one to rescue us from their hand.
  footnotes:
  - marker: a
    text: Or 'servants rule over us.' The Hebrew עֲבָדִים can denote either servants or slaves; 'slaves' is chosen here to preserve the force of social humiliation in the lament.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from their hand,' an idiom for being under their power or control.
    reason: lexical_alternative
translation:
  language: ko
  text: 노예들이 우리를 다스리니[a] 우리를 그들의 손에서 건질 사람이 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “종들이 우리를 다스리니.” 히브리어 עֲבָדִים은 “종” 또는 “노예”를 뜻할 수 있는데, 여기서는 사회적 굴욕을 더 강하게 살리기 위해 “노예”를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그들의 손에서”입니다. 히브리어에서 ‘손’은 권세나 통제 아래 있음을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים
  english_pob_choice: Slaves
  chosen_korean: 노예들
  alternatives_korean:
  - 종들
  - 종이들
  - 하인들
  lexicon: HALOT
  rationale: 문맥이 사회적 굴욕과 전도된 질서를 강조하므로, 약한 '종'보다 bonded status를 더 분명히 드러내는 '노예'가 POB의 영어 선택과 가장 잘 맞습니다.
- source_word: מָשְׁלוּ בָנוּ
  english_pob_choice: rule over us
  chosen_korean: 우리를 다스리니
  alternatives_korean:
  - 우리를 통치하니
  - 우리를 지배하니
  - 우리를 군림하니
  lexicon: HALOT
  rationale: '''משל + ב''의 지배·통치 의미를 자연스러운 현대 한국어로 옮기되, 애가의 억압적 뉘앙스를 살리기 위해 ''다스리다''를 택했습니다.'
- source_word: פֹּרֵק
  english_pob_choice: to rescue
  chosen_korean: 건질
  alternatives_korean:
  - 구할
  - 구해낼
  - 풀어줄
  lexicon: HALOT
  rationale: 문맥상 권세 아래에서 벗어나게 하는 뜻이므로 '건지다'가 가장 간결하고, 'rescue'의 해방·구출 뉘앙스를 잘 반영합니다.
- source_word: מִיָּדָם
  english_pob_choice: from their hand
  chosen_korean: 그들의 손에서
  alternatives_korean:
  - 그들의 권세에서
  - 그들의 손아귀에서
  - 그들의 손으로부터
  lexicon: HALOT
  rationale: '''손''은 히브리어 관용적으로 권세·지배를 가리키므로, 이미지와 의미를 함께 보존하는 직역형 표현을 유지했습니다.'
theological_decisions:
- issue: עֲבָדִים의 사회적 강도
  chosen_reading: '''노예들''로 옮겨 신분적 굴욕과 억압을 분명히 드러냈습니다.'
  alternative_readings:
  - '''종들''로 완화해 옮길 수 있습니다.'
  - '''하인들''로 일반화할 수 있습니다.'
  rationale: 본문은 단순한 봉사 관계가 아니라 전도된 권력 관계로 인한 수치를 한탄하므로, 의미를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 애가의 정서적·사회적 현실을 그대로 드러내는 번역 원칙
