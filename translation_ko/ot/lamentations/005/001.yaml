lexical_decisions:
- source_word: זְכֹר
  english_pob_choice: Remember
  chosen_korean: 기억해 주십시오
  alternatives_korean:
  - 기억하십시오
  - 기억하소서
  - 기억해 주시옵소서
  lexicon: HALOT
  rationale: 하나님께 드리는 탄원형 명령으로서 단순 인지보다 언약적 호소의 뉘앙스를 살리기 위해 공손한 청유형 ‘기억해 주십시오’를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 사대문자 표기는 POB 기준에 따라 칭호가 아니라 고유명 ‘야훼’로 옮겼습니다.
- source_word: מֶה הָיָה לָנוּ
  english_pob_choice: what has happened to us
  chosen_korean: 우리에게 일어난 일
  alternatives_korean:
  - 우리에게 무슨 일이 닥쳤는지
  - 우리에게 무슨 일이 있었는지
  lexicon: HALOT
  rationale: 과거에 닥친 재난과 처지를 함께 가리키므로, 현대 한국어에서 자연스러운 ‘우리에게 일어난 일’로 옮겨 lament의 호소성을 살렸습니다.
- source_word: הביט וּרְאֵה
  english_pob_choice: look, and see
  chosen_korean: 살피시고, 보십시오
  alternatives_korean:
  - 보시고, 보십시오
  - 주시고, 살펴보십시오
  lexicon: HALOT
  rationale: 두 동사는 의미가 겹치지만 병렬이 주는 긴박함이 있으므로, ‘살피다’와 ‘보다’를 나누어 두 차례의 호소를 유지했습니다.
- source_word: חֶרְפָּתֵנוּ
  english_pob_choice: our disgrace
  chosen_korean: 우리 치욕
  alternatives_korean:
  - 우리의 수치
  - 우리의 모욕
  - 우리의 disgrace
  lexicon: HALOT
  rationale: חֶרְפָּה는 공개적 수치와 모욕을 포함하므로, 문맥상 외부에 드러난 부끄러움을 강조하는 ‘치욕’이 가장 적절합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 존칭 처리
  chosen_reading: ‘야훼여’로 직접 호명하여 탄원문의 대상을 분명히 했습니다.
  alternative_readings:
  - ‘야훼님’
  - ‘주님’
  rationale: 이 절은 애가의 직접 호소이므로 고유명 뒤에 호격 조사 ‘-여’를 붙여 기도적 부름을 자연스럽게 드러냈습니다.
