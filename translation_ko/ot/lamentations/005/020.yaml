base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/020.yaml
  text: Why do you forget us forever? Why do you abandon us for so many days?[a]
  footnotes:
  - marker: a
    text: Hebrew literally, 'for length of days,' an idiom meaning 'for a long time' or 'for many days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 주께서는 우리를 영원히 잊으십니까? 왜 주께서는 우리를 오랜 날 동안 버리십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘날들의 길이로’라는 뜻으로, ‘오랜 날 동안’이라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 어찌하여
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 탄식의 질문을 자연스러운 현대 한국어로 옮기기 위해 가장 직접적인 의문 부사인 ‘왜’를 선택했습니다.
- source_word: תִּשְׁכָּחֵנוּ
  english_pob_choice: do you forget us
  chosen_korean: 우리를 잊으십니까
  alternatives_korean:
  - 우리를 잊으십니까요
  - 우리를 잊으실 것입니까
  lexicon: HALOT
  rationale: 주어가 하나님께 향한 직접 탄원이므로 존대형 ‘잊으십니까’를 사용해 현재의 탄식 질문을 살렸습니다.
- source_word: תַּעַזְבֵנוּ
  english_pob_choice: do you abandon us
  chosen_korean: 우리를 버리십니까
  alternatives_korean:
  - 우리를 떠나십니까
  - 우리를 버리시겠습니까
  lexicon: HALOT
  rationale: עזב의 핵심 의미인 ‘떠나다/버리다’ 가운데, 시편적·예언적 탄식의 강도를 가장 분명히 드러내는 ‘버리다’를 택했습니다.
- source_word: לָנֶצַח
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 영구히
  lexicon: HALOT
  rationale: 지속성을 나타내는 לָנֶצַח을 한국어의 관용적 시간 부사 ‘영원히’로 옮겨, 탄식의 절박함을 자연스럽게 전달했습니다.
- source_word: לְאֹרֶךְ יָמִים
  english_pob_choice: for so many days
  chosen_korean: 오랜 날 동안
  alternatives_korean:
  - 오랫동안
  - 긴 날 동안
  - 많은 날 동안
  lexicon: HALOT
  rationale: 직역하면 ‘날들의 길이/오랜 기간’이라는 관용구이므로, ‘오랜 날 동안’으로 옮겨 시간의 길이를 살리되 어색한 직역을 피했습니다.
theological_decisions:
- issue: 탄원문의 직접 호칭과 존대법
  chosen_reading: 본문의 질문은 하나님을 향한 직접 탄원이므로, 한국어 본문에서는 주격을 드러내지 않고 ‘주께서는 … 하십니까’의 존대형으로 처리했습니다.
  alternative_readings:
  - 하나님께서는
  - 주님은
  rationale: 히브리어 2인칭 남성 단수 동사를 직접 질문으로 옮길 때, 표준어 합쇼체가 탄식의 예배적 호소를 가장 잘 보존합니다.
  doctrine_reference: 기도·탄식 문맥에서의 경외적 직접 호칭
