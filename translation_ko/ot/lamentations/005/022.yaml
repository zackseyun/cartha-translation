  naturalness: 현 문구 ‘만일 …하셨다면입니다’는 한국어 문법에 맞지 않으며, 절 단독으로도 부자연스럽습니다. 수정문은 21절의 탄원을 이어받는 종결부로 자연스럽고, 합쇼체 성경 문체에도 맞습니다.
