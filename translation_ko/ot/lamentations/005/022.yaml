translation:
  language: ko
  text: 만일 주께서 우리를 완전히 거부하시고 우리에게 크게 진노하셨다면입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 우리를 완전히 거부하시고 우리에게 크게 진노하셨다면’으로, 앞 절의 탄원에 대한 예외적 조건이 아니라 독립된 진술로 볼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘우리에게 대하여’ 또는 ‘우리 위에’ 진노하셨다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: unless
  chosen_korean: 만일 …이라면
  alternatives_korean:
  - 그렇지 않고는
  - 오직 …라면
  - 만약 …이라면
  lexicon: HALOT
  rationale: 문맥상 21절의 탄원에 이어지는 예외적 조건을 나타내므로, 한국어에서는 ‘만일 …이라면’으로 풀어 주어 예외적 뉘앙스를 살렸습니다.
- source_word: מָאֹס מְאַסְתָּנוּ
  english_pob_choice: you have utterly rejected us
  chosen_korean: 우리를 완전히 거부하시고
  alternatives_korean:
  - 우리를 철저히 버리시고
  - 우리를 완전히 미워하시고
  - 우리를 아주 거절하시고
  lexicon: HALOT
  rationale: 동사 어근의 반복이 강한 강조를 이루므로, 단순한 ‘거부하다’보다 ‘완전히 거부하시고’로 강도를 살렸습니다.
- source_word: קָצַפְתָּ עָלֵינוּ
  english_pob_choice: are angry with us
  chosen_korean: 우리에게 크게 진노하셨다면
  alternatives_korean:
  - 우리에게 분노하셨다면
  - 우리를 향해 진노하셨다면
  - 우리에 대하여 노하셨다면
  lexicon: HALOT
  rationale: ‘진노하다’는 하나님의 분노를 드러내는 한국어로 적절하며, 전치사 עַל의 관계를 자연스럽게 ‘우리에게’로 옮겼습니다.
- source_word: עַד מְאֹד
  english_pob_choice: exceedingly
  chosen_korean: 크게
  alternatives_korean:
  - 심히
  - 지극히
  - 지나치게
  lexicon: HALOT
  rationale: 시적 강조를 과장 없이 전달하려고 ‘크게’로 옮겼습니다. 더 강한 표현들도 가능하지만 한국어 문장 흐름을 해치지 않도록 절제했습니다.
theological_decisions:
- issue: 절 마지막 문장의 문법적·신학적 긴장 보존
  chosen_reading: 예외적 조건문으로 읽어 ‘만일 …이라면’ 형태를 유지했습니다.
  alternative_readings:
  - 독립 진술로 읽어 ‘주께서 우리를 완전히 거부하시고…’라고 단정함
  rationale: 히브리어 כִּי אִם의 예외적 용법을 따라, 회복을 청하는 책의 결말이 쉽게 닫히지 않도록 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
