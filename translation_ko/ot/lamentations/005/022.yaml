- from: 만일 주께서 우리를 완전히 거부하시고 우리에게 크게 진노하셨다면입니다.[a][b]
  to: 주께서 우리를 완전히 버리시고 우리에게 몹시 진노하신 것이 아니라면 말입니다.[a][b]
  rationale: 문법적으로 불가능한 조건절 종결을 고치고, 21절의 ‘회복시키소서’라는 탄원에 연결되는 כִּי אִם의 예외적 긴장을 ‘…것이 아니라면 말입니다’로 보존했습니다. ‘완전히 버리시고’와 ‘몹시 진노하신’은 각각 히브리어의 강조된 거절과 강한 진노를 자연스러운 현대 격식체로 옮깁니다. 각주들은 대안적 구문과 עַל의 문자적 방향성을 더 정확하고 자연스럽게 설명하도록 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:38:08Z'
