  text: unless you have utterly rejected us and are exceedingly angry with us[a][b].
  footnotes:
  - marker: a
    text: Or, 'For if you have utterly rejected us and are very angry with us,' taking the line as a more standalone statement rather than an exception to the plea in the previous verse.
