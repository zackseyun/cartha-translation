  text: נָשִׁים֙ בְּ/צִיּ֣וֹן עִנּ֔וּ בְּתֻלֹ֖ת בְּ/עָרֵ֥י יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/011.yaml
  text: Women in Zion were violated[a], virgins in the cities of Judah.
  footnotes:
  - marker: a
    text: Or 'were raped.' The Hebrew verb can denote humiliation or affliction more broadly, but in this context of women and virgins it likely refers to sexual violation.
    reason: lexical_alternative
translation:
  language: ko
  text: 시온의 여인들은 욕보임을 당하고, 유다의 여러 성읍의 처녀들도 그러했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '성폭행을 당하고.' 히브리어 동사는 더 넓게는 굴욕이나 고통을 뜻할 수 있지만, 여성과 처녀가 나오는 이 문맥에서는 성적 위반을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  english_pob_choice: Women
  chosen_korean: 여인들
  alternatives_korean:
  - 여자들
  - 여성들
  lexicon: HALOT
  rationale: 문맥이 단순한 성별 표지가 아니라 수난을 겪은 여성 피해자들을 가리키므로, 현대 한국어에서 자연스럽고 다소 품위 있는 '여인들'이 적절합니다.
- source_word: עִנּוּ
  english_pob_choice: were violated
  chosen_korean: 욕보임을 당하고
  alternatives_korean:
  - 성폭행을 당하고
  - 학대를 당하고
  - 굴욕을 당하고
  lexicon: HALOT
  rationale: ענה(Piel)는 굴욕·억압·성적 침해까지 포괄할 수 있으므로, 본문이 암시하는 성적 위반을 너무 좁히지 않으면서도 강도를 살리는 '욕보임을 당하고'로 옮겼습니다.
- source_word: בְּתֻלֹת
  english_pob_choice: virgins
  chosen_korean: 처녀들
  alternatives_korean:
  - 동정녀들
  - 젊은 여자들
  lexicon: HALOT
  rationale: 사회적·성적 상태를 드러내는 직접 대응으로 '처녀들'이 가장 분명하며, 앞의 '여인들'과 병렬도 잘 이룹니다.
- source_word: בְּ/עָרֵי יְהוּדָה
  english_pob_choice: in the cities of Judah
  chosen_korean: 유다의 여러 성읍의
  alternatives_korean:
  - 유다의 성읍들에 있는
  - 유다의 고을들에 있는
  lexicon: HALOT
  rationale: 히브리어의 장소 표지를 살려 '유다의 여러 성읍의'로 옮겨, 시온과 유다 성읍들 사이의 평행을 한국어에서도 유지했습니다.
theological_decisions:
- issue: עִנּוּ의 의미 범위와 성적 폭력의 암시
  chosen_reading: 본문은 단순한 일반적 고통보다 여성과 처녀에 대한 성적 위반을 강하게 암시한다고 보되, 한국어 본문에서는 '욕보임'으로 넓이를 조금 남겨 두었습니다.
  alternative_readings:
  - 성폭행으로 단정하는 번역
  - 단순히 '학대'로 완화하는 번역
  rationale: 영문 POB도 'were violated'를 채택하고 주석에서 성적 위반의 개연성을 밝히므로, 번역은 해석을 과도하게 축소하거나 확정하지 않도록 균형을 취했습니다.
  doctrine_reference: Lamentations 5:11, English POB footnote a
