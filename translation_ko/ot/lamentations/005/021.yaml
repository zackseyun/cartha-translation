id: LAM.5.21
reference: Lamentations 5:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲשִׁיבֵ֨/נוּ יְהוָ֤ה אֵלֶ֨י/ךָ֙ ו/נשוב חַדֵּ֥שׁ יָמֵ֖י/נוּ כְּ/קֶֽדֶם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/021.yaml
  text: Restore us to yourself[a], O Yahweh, that we may return[b]; renew our days as of old.
  footnotes:
  - marker: a
    text: Or, 'Bring us back to you, O LORD, and we will return.'
    reason: alternative_reading
  - marker: b
    text: Hebrew 'as formerly' or 'as in former times.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리에게 자비를 베푸셔서, 야훼여, 우리를 당신께로 돌이켜 주십시오[a] — 우리가 돌아가게 하시고[b] — 우리의 날들을 옛날처럼 새롭게 하여 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 당신께로 돌려보내 주십시오, 주님, 그러면 우리가 돌아오겠습니다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘옛적에’ 또는 ‘옛날처럼’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשִׁיבֵנוּ
  english_pob_choice: Restore us
  chosen_korean: 우리를 … 돌이켜 주십시오
  alternatives_korean:
  - 우리를 회복해 주십시오
  - 우리를 다시 데려와 주십시오
  lexicon: HALOT
  rationale: 히필 형태의 שוב은 ‘돌아가게 하다/되돌리다’의 사역 의미가 핵심이므로, 관계적·언약적 뉘앙스를 살리면서도 직접적으로 ‘돌이키다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문맥상 하나님의 고유명사인 여호와의 음역을 표준적으로 ‘야훼’로 반영하여, 본문의 호칭이 아니라 이름 자체를 드러냈습니다.
- source_word: וְנָשׁוּב
  english_pob_choice: that we may return
  chosen_korean: 우리가 돌아가게 하시고
  alternatives_korean:
  - 우리가 돌아오게 하시고
  - 그러면 우리가 돌아가겠습니다
  lexicon: HALOT
  rationale: 히브리어는 하나님의 회복 행위에 따른 결과·목적을 나타낼 수 있으므로, 단순 병렬보다 의존적 의미가 드러나도록 한국어로 자연스럽게 풀었습니다.
- source_word: כְּקֶדֶם
  english_pob_choice: as of old
  chosen_korean: 옛날처럼
  alternatives_korean:
  - 옛적처럼
  - 예전처럼
  lexicon: HALOT
  rationale: 직역의 ‘옛적/예전’보다 시적이고 간결한 한국어 표현인 ‘옛날처럼’이 ‘as of old’의 시간적 회귀를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: אָנָה/청원문의 호소가 갖는 직접성
  chosen_reading: 청원형을 높임말 명령·요청으로 유지해, 하나님께 드리는 간구의 직접성을 살렸습니다.
  alternative_readings:
  - 부드러운 서술형으로 완화
  - 간접화법으로 전환
  rationale: 이 본문은 공동체의 탄원으로서 하나님께 직접 호소하는 구조이므로, 한국어에서도 합쇼체의 정중한 요청형을 유지하는 것이 본문의 정서와 신학을 보존합니다.
  doctrine_reference: lament/prayer register preservation
- issue: וְנָשׁוּב의 의미를 결과/목적 관계로 읽는 문제
  chosen_reading: ‘우리가 돌아가게 하시고’로 번역해, 하나님의 회복이 인간의 귀환을 가능하게 한다는 의존성을 남겼습니다.
  alternative_readings:
  - 우리가 돌아오겠습니다
  - 우리가 돌아오게 됩니다
  rationale: 히브리어는 단순 미래 서술도 가능하지만, 문맥상 하나님의 선행적 회복이 사람의 회개·귀환을 낳는다는 흐름이 중요하므로 그 긴장을 보존했습니다.
  doctrine_reference: preserve theological tension rather than resolve it
