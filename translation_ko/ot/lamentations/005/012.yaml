    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִים
  english_pob_choice: Princes
  chosen_korean: 고관들
  alternatives_korean:
  - 지도자들
  - 귀족들
  - 방백들
  lexicon: HALOT
  rationale: שָׂרִים은 사회적 상층의 통치자·유력자를 가리키므로, 한국어에서는 위계와 공적 수치를 함께 드러내는 ‘고관들’이 문맥에 잘 맞습니다.
- source_word: בְּיָדָם נִתְלוּ
  english_pob_choice: were hung up by their hands
  chosen_korean: 손에 매달렸습니다
  alternatives_korean:
  - 손으로 매달렸습니다
  - 손에 의해 매달렸습니다
  - 그들의 손으로 매달렸습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘손’이 매달림의 부위임을 나타내는 표현이므로, 한국어에서는 자연스럽게 ‘손에 매달렸습니다’로 옮겨 원문 이미지를 보존했습니다.
- source_word: פְּנֵי זְקֵנִים לֹא נֶהְדָּרוּ
  english_pob_choice: the faces of elders were not honored
  chosen_korean: 장로들의 얼굴은 존중받지 못했습니다
  alternatives_korean:
  - 장로들은 존중받지 못했습니다
  - 장로들의 얼굴은 존귀하게 여겨지지 않았습니다
  - 장로들의 얼굴은 영광을 얻지 못했습니다
  lexicon: HALOT
  rationale: ‘얼굴’은 히브리어 관용구를 살리고, ‘존중받지 못했습니다’는 הדר의 수동 의미를 현대 한국어로 분명하게 전달합니다.
theological_decisions:
- issue: 히브리어 관용구 ‘얼굴’ 유지 여부
  chosen_reading: 직역 요소인 ‘얼굴’을 유지해 공개적 수치와 존엄 훼손의 이미지를 드러냈습니다.
  alternative_readings:
  - 장로들은 존중받지 못했습니다
  - 장로들의 위엄은 사라졌습니다
  rationale: 본문은 단순한 무례가 아니라 공개적 모욕의 장면을 묘사하므로, 관용구의 구체성을 보존하는 편이 원문 효과에 가깝습니다.
  doctrine_reference: 본문 해석상 이미지 보존 원칙
