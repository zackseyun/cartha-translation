id: LAM.5.7
reference: Lamentations 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲבֹתֵ֤י/נוּ חָֽטְאוּ֙ אינ/ם אנחנו עֲוֺנֹתֵי/הֶ֥ם סָבָֽלְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/007.yaml
  text: Our fathers sinned[a], and they are no more; but we bear their iniquities.
  footnotes:
  - marker: a
    text: Or 'we bear the punishment/consequences of their iniquities.' The Hebrew word can refer to iniquity itself, guilt, or its resulting burden.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 조상들은 죄를 지었고, 이제 그들은 더 이상 없습니다. 그러나 우리는 그들의 죄악을 짊어지고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 그들의 죄악의 형벌/결과를 짊어지고 있습니다.’ 히브리어 עָוֹן은 죄악 자체, 죄책, 또는 그로 인한 짐과 결과를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵינוּ
  english_pob_choice: Our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리 아버지들
  - 우리 선조들
  lexicon: HALOT
  rationale: 문맥상 단순한 생물학적 아버지보다 세대적·언약적 선조를 가리키므로, 한국어에서는 자연스럽게 ‘조상들’로 옮기되 소유격 ‘우리’를 유지해 공동체적 책임 의식을 살렸습니다.
- source_word: חָטְאוּ
  english_pob_choice: sinned
  chosen_korean: 죄를 지었고
  alternatives_korean:
  - 죄를 지었으며
  - 죄를 범했고
  lexicon: HALOT
  rationale: 동사의 기본 의미를 직접 반영하면서도 애가 문맥의 회고적 진술을 살리기 위해 과거형으로 처리했습니다.
- source_word: אֵינָם
  english_pob_choice: they are no more
  chosen_korean: 이제 그들은 더 이상 없습니다
  alternatives_korean:
  - 그들은 이제 없습니다
  - 그들은 사라졌습니다
  lexicon: HALOT
  rationale: 히브리어의 부정적 존재 진술을 한국어 관용에 맞게 풀어, 단순 부재가 아니라 더 이상 살아 있지 않은 상태를 암시하도록 했습니다.
- source_word: עֲוֺנֹתֵיהֶם
  english_pob_choice: their iniquities
  chosen_korean: 그들의 죄악
  alternatives_korean:
  - 그들의 죄책
  - 그들의 죄
  - 그들의 불의
  lexicon: HALOT
  rationale: עָוֹן이 죄, 죄책, 결과를 아우를 수 있으므로 본문은 의미를 과도하게 좁히지 않는 ‘죄악’을 택하고, 해석의 여지는 본문 자체에 남겼습니다.
- source_word: סָבָלְנוּ
  english_pob_choice: we bear
  chosen_korean: 짊어지고 있습니다
  alternatives_korean:
  - 지고 있습니다
  - 감당하고 있습니다
  - 메고 있습니다
  lexicon: HALOT
  rationale: ‘bear’의 부담-은유를 한국어로 가장 선명하게 드러내는 표현으로, 단순한 ‘견딤’보다 짐을 지는 이미지를 살렸습니다.
theological_decisions:
- issue: עָוֹן을 죄, 죄책, 혹은 그 결과/형벌로 좁히는 문제
  chosen_reading: ‘그들의 죄악을 짊어지고 있습니다’라고 두어, 죄책과 그 결과의 중첩 가능성을 열어 둡니다.
  alternative_readings:
  - 그들의 죄의 형벌을 짊어지고 있습니다
  - 그들의 죄책을 짊어지고 있습니다
  rationale: 히브리어 עָוֹן은 여러 층위를 가질 수 있으므로, 애가의 탄식을 신학적으로 단정하지 않고 본문이 허용하는 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
