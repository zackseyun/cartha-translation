base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/013.yaml
  text: Young men carry millstones[b][a], and boys stagger under wood.
  footnotes:
  - marker: a
    text: Or 'Young men bear grinding work' or 'Young men carry a mill.' The Hebrew term טְחוֹן is associated with grinding and may refer either to the labor itself or to the grinding apparatus.
    reason: lexical_alternative
  - marker: b
    text: Literally 'stumble under the wood' or 'stumble at/with wood,' likely describing boys collapsing beneath loads of wood.
    reason: lexical_alternative
translation:
  language: ko
  text: 청년들은 맷돌을 지고, 소년들은 나무 아래에서 비틀거립니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 טְחוֹן은 ‘갈기/맷돌질’과 관련되어, 여기서는 맷돌 자체를 가리키거나 맷돌질이라는 노동을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나무 아래에서 비틀거리다’에 가깝고, 무거운 짐 아래에서 소년들이 주저앉거나 휘청거리는 모습을 그립니다.
    reason: lexical_alternative
