  text: Young men carry millstones[b][a], and boys stagger under wood.
  footnotes:
  - marker: a
    text: Or 'Young men bear grinding work' or 'Young men carry a mill.' The Hebrew term טְחוֹן is associated with grinding and may refer either to the labor itself or to the grinding apparatus.
    reason: lexical_alternative
  - marker: b
    text: Literally 'stumble under the wood' or 'stumble at/with wood,' likely describing boys collapsing beneath loads of wood.
    reason: lexical_alternative
translation:
  language: ko
  text: 청년들은 맷돌을[a] 지고, 소년들은 나무를[b] 지고 비틀거립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 טְחוֹן은 ‘갈기’와 관련된 말입니다. 여기서는 맷돌 자체를 가리킬 수도 있고, 곡식을 가는 일을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나무로/나무와 함께 비틀거리다’에 가깝습니다. 무거운 나무 짐 때문에 소년들이 휘청거리거나 넘어지는 모습을 가리키는 것으로 보입니다.
    reason: lexical_alternative
