id: LAM.5.5
reference: Lamentations 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֤ל צַוָּארֵ֨/נוּ֙ נִרְדָּ֔פְנוּ יָגַ֖עְנוּ לא הֽוּנַ֖ח לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/005.yaml
  text: We are pursued at our necks[a]; we are weary[b]; no rest is given to us.
  footnotes:
  - marker: a
    text: Or, more literally, 'On our necks we are pursued.' The Hebrew preserves a vivid image of enemies pressing hard upon them.
    reason: lexical_alternative
  - marker: b
    text: The final clause could also be rendered 'we are given no rest' or 'rest is not granted to us.'
    reason: alternative_reading
translation:
  language: ko
  text: 우리는 목덜미까지 쫓겼습니다[a]. 우리는 지쳤습니다[b]. 우리에게는 쉼이 주어지지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리의 목덜미 위에서 우리는 추격당했습니다’입니다. 히브리어는 추격자들이 목덜미에 바짝 닥쳐 압박하는 생생한 이미지를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지쳤습니다’는 ‘쇠약해졌습니다’ 또는 문맥에 따라 ‘고되게 수고했습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל צַוָּארֵינוּ
  english_pob_choice: We are pursued at our necks
  chosen_korean: 우리의 목덜미까지 쫓겼습니다
  alternatives_korean:
  - 우리의 목에 쫓겼습니다
  - 우리의 목덜미 위로 쫓겼습니다
  - 우리의 목에 바짝 쫓겼습니다
  lexicon: HALOT
  rationale: עַל과 ‘목/목덜미’의 결합은 단순한 위치가 아니라 적이 바짝 들이닥쳐 압박하는 이미지를 살려야 하므로, 한국어에서는 ‘목덜미까지’로 구체성과 긴박감을 함께 전달했습니다.
- source_word: נִרְדָּפְנוּ
  english_pob_choice: we are pursued
  chosen_korean: 쫓겼습니다
  alternatives_korean:
  - 추격당하고 있습니다
  - 추격을 받습니다
  - 박해받고 있습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 실제로 뒤쫓기는 상태이므로 ‘쫓겼습니다’가 가장 직접적입니다. ‘박해받고 있습니다’는 의미를 넓혀 버리고, 현재형보다 시편/애가의 탄식적 진술에 맞는 완료적 서술이 더 자연스럽습니다.
- source_word: יָגַעְנוּ
  english_pob_choice: we are weary
  chosen_korean: 우리는 지쳤습니다
  alternatives_korean:
  - 우리는 피곤합니다
  - 우리는 쇠약해졌습니다
  - 우리는 지쳐 있습니다
  lexicon: HALOT
  rationale: 문맥상 계속된 추격의 결과로 생긴 소진 상태를 나타내므로 ‘지쳤습니다’가 가장 자연스럽고, 단순한 육체적 피로보다 탄식의 무게를 잘 담습니다.
- source_word: הוּנַח לָנוּ
  english_pob_choice: no rest is given to us
  chosen_korean: 우리에게는 쉼이 주어지지 않습니다
  alternatives_korean:
  - 우리에게는 안식이 허락되지 않습니다
  - 우리에게는 쉬는 것이 허락되지 않습니다
  - 우리에게는 아무런 쉼도 없습니다
  lexicon: HALOT
  rationale: 피동형의 뜻을 살려 ‘주어지지 않습니다’로 옮기되, הנח 계열이 가리키는 ‘쉼/휴식’의 의미를 한국어에서 가장 자연스럽게 드러내기 위해 ‘쉼’을 택했습니다. ‘안식’은 신학적 뉘앙스를 덧입힐 수 있어 여기서는 덜 적합합니다.
theological_decisions:
- issue: 탄식시의 압박 이미지와 정서적 강도
  chosen_reading: 적의 추격이 단지 따라오는 수준이 아니라 목덜미까지 바짝 들이닥친 상태로 표현했습니다.
  alternative_readings:
  - ‘우리의 목에 쫓겼습니다’처럼 더 직역적인 표현
  - ‘우리는 박해받고 있습니다’처럼 일반화된 표현
  rationale: 히브리어는 신체 일부를 통한 압박의 생생한 이미지를 유지하므로, 한국어에서도 그 긴박함을 보존하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 애가 5:5의 문학적 탄식과 역사적 고난의 묘사
