review_pass:
  verdict: revise
  source_fidelity: ‘그루터기’는 뿌리째 남은 밑동을 뜻하여, 쉽게 불타는 농작물 잔재를 가리키는 קַשׁ의 비유와 맞지 않습니다. 또한 וְדָלְקוּ בָהֶם은 불의 비유 안에서 ‘그들 가운데서 불붙다/타오르다’로 옮길 수 있으나, 현 번역의 ‘불타고’는 주어가 스스로 타는 듯하여 의미가 불명확합니다.
  naturalness: ‘불붙어’는 이 문맥에서 ‘불타고’보다 자연스럽고, 반복되는 대명사는 선행하는 세 집을 유지하면서도 문맥상 야곱과 요셉의 집이 에서의 집을 대상으로 한다는 병렬을 따를 수 있습니다. ‘생존자’는 현대 한국어에서 שָׂרִיד의 이 문맥상 의미를 가장 직접적으로 전달합니다.
  terminology: ‘야곱의 집/요셉의 집/에서의 집’, ‘불/불꽃’, 그리고 신명 ‘야훼’는 유지할 수 있습니다. שָׂרִיד은 ‘남은 자’보다 ‘생존자’가 완전한 멸절 선언을 더 분명하게 전달합니다.
  issues:
  - severity: high
    issue: לְקַשׁ을 ‘그루터기’로 번역함
    rationale: קַשׁ은 곡식의 짚·그루터기 같은 마른 농작물 잔재, 곧 불에 잘 타는 것을 가리킵니다. 한국어 ‘그루터기’는 대체로 베어 낸 나무의 밑동을 뜻하므로 어휘적으로 부정확합니다.
  - severity: medium
    issue: וְדָלְקוּ בָהֶם의 ‘그들 가운데서 불타고’ 표현
