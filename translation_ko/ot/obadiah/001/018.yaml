id: OBA.1.18
reference: Obadiah 1:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֩ בֵית יַעֲקֹ֨ב אֵ֜שׁ וּ/בֵ֧ית יוֹסֵ֣ף לֶהָבָ֗ה וּ/בֵ֤ית עֵשָׂו֙ לְ/קַ֔שׁ וְ/דָלְק֥וּ בָ/הֶ֖ם וַ/אֲכָל֑וּ/ם וְ/לֹֽא יִֽהְיֶ֤ה שָׂרִיד֙ לְ/בֵ֣ית עֵשָׂ֔ו כִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/018.yaml
  text: The house of Jacob will be a fire[a], and the house of Joseph a flame, and the house of Esau stubble. They will burn them and consume them, and there will be no survivor for the house of Esau[b], for Yahweh has spoken.
  footnotes:
  - marker: a
    text: Or 'They will set them ablaze and consume them.' The Hebrew of 'burn among them' is compact and may be understood more directly as hostile burning against the house of Esau.
    reason: lexical_alternative
  - marker: b
    text: Or 'no remnant.' Hebrew שָׂרִיד can mean 'survivor' or 'remnant'; 'survivor' is used here to avoid implying a preserved remnant of Esau in a verse announcing total destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 야곱의 집은 불이 되고[a], 요셉의 집은 불꽃이 되며, 에서의 집은 마른 짚이 될 것입니다. 그들은 그들 가운데서 불붙어 그들을 삼킬 것이며, 에서의 집에는 생존자가 하나도 없을 것입니다[b]. 이는 야훼께서 말씀하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 그들을 불태워 삼킬 것입니다.’ 히브리어의 ‘그들 가운데서 불붙다’는 압축된 표현이며, 에서의 집을 향한 적대적 소각으로 더 직접적으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘남은 자’. 히브리어 שָׂרִיד은 ‘생존자’ 또는 ‘남은 자’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית יַעֲקֹב / בֵית יוֹסֵף / בֵית עֵשָׂו
  english_pob_choice: the house of Jacob / the house of Joseph / the house of Esau
  chosen_korean: 야곱의 집 / 요셉의 집 / 에서의 집
  alternatives_korean:
  - 야곱 집안 / 요셉 집안 / 에서 집안
  - 야곱의 가문 / 요셉의 가문 / 에서의 가문
  lexicon: HALOT
  rationale: 히브리어의 비유적·공동체적 ‘집’ 표현을 살리면서, 예언문체의 평행구조와 족장 계열 전체를 가리키는 뜻을 유지했습니다.
- source_word: אֵשׁ / לֶהָבָה
  english_pob_choice: a fire / a flame
  chosen_korean: 불 / 불꽃
  alternatives_korean:
  - 불 / 화염
  - 불길 / 불꽃
  lexicon: HALOT
  rationale: 첫 번째 이미지는 기본적인 ‘불’, 두 번째는 그보다 강한 ‘불꽃’으로 대응시켜, 병렬과 점층을 자연스러운 한국어로 재현했습니다.
- source_word: לְקַשׁ
  english_pob_choice: stubble
  chosen_korean: 그루터기
  alternatives_korean:
  - 짚더미
  - 마른 지푸라기
  lexicon: HALOT
  rationale: 쉽게 타버리는 남은 농작물의 잔재를 나타내는 이미지로서, 한국어 독자에게 가장 직관적인 ‘그루터기’를 택했습니다.
- source_word: וְדָלְקוּ בָהֶם וַאֲכָלוּם
  english_pob_choice: They will burn them and consume them
  chosen_korean: 그들이 그들 가운데서 불타고 그들을 삼킬 것이며
  alternatives_korean:
  - 그들이 그들 위에 불붙어 그들을 삼킬 것이며
  - 그들이 그들을 불태우고 삼킬 것이며
  lexicon: HALOT
  rationale: POB의 주석을 반영해 בָהֶם을 단순한 직접목적어보다 ‘그들 가운데서’로 옮겨, 히브리어의 압축된 전치사 용법과 불의 이미지가 주는 공격성을 함께 드러냈습니다.
- source_word: שָׂרִיד
  english_pob_choice: survivor
  chosen_korean: 남은 자
  alternatives_korean:
  - 생존자
  - 남은 사람
  lexicon: HALOT
  rationale: 문맥상 ‘완전히 남지 않음’을 강조해야 하므로, 신학적으로 긍정적 함의를 띨 수 있는 ‘남은 자’ 대신 ‘남은 자가 하나도 없을 것입니다’로 처리해 절멸 선언을 분명히 했습니다.
- source_word: כִּי יְהוָה דִּבֵּר
  english_pob_choice: for Yahweh has spoken
  chosen_korean: 이는 야훼께서 말씀하셨기 때문입니다
  alternatives_korean:
  - 야훼께서 말씀하셨기 때문입니다
  - 주님께서 말씀하셨기 때문입니다
  lexicon: HALOT
  rationale: 예언의 종결 공식으로서 원문의 권위와 확실성을 살리되, 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: שָׂרִיד의 종말론적/언약적 뉘앙스
  chosen_reading: 이 구절에서는 보존된 ‘남은 자’가 아니라, 에서의 집에 대한 전면적 심판을 가리키는 소멸 선언으로 읽었습니다.
  alternative_readings:
  - 언약적 의미의 ‘남은 자’
  - 단순한 ‘생존자’
  rationale: 문맥이 에돔에 대한 완전한 멸망을 말하므로, 한국어에서도 구원사적 ‘남은 자’ 용례를 연상시키지 않도록 표현을 조정했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
- issue: בָהֶם의 전치사적 압축
  chosen_reading: ‘그들 가운데서 불타고’로 옮겨, 불이 에서의 집 내부로 파고드는 공격적 이미지와 히브리어의 압축성을 함께 살렸습니다.
  alternative_readings:
  - 그들을 불태우고
  - 그들 위에 불붙어
  rationale: POB의 주석처럼 이 구문은 직역보다 관계를 드러내는 번역이 더 적절할 수 있어, 과도한 평탄화를 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
