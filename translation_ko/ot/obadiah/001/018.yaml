revisions:
- from: 야곱의 집은 불이 되고, 요셉의 집은 불꽃이 되며, 에서의 집은 그루터기가 될 것입니다. 그들이 그들 가운데서 불타고 그들을 삼킬 것이며, 에서의 집에는 남은 자가 하나도 없을 것입니다. 이는 야훼께서 말씀하셨기 때문입니다.[a][b]
  to: 야곱의 집은 불이 되고[a], 요셉의 집은 불꽃이 되며, 에서의 집은 마른 짚이 될 것입니다. 그들은 그들 가운데서 불붙어 그들을 삼킬 것이며, 에서의 집에는 생존자가 하나도 없을 것입니다[b]. 이는 야훼께서 말씀하셨기 때문입니다.
  rationale: קַשׁ의 농경적·가연성 비유를 ‘마른 짚’으로 바로잡고, דלק의 불 이미지를 ‘불붙어’로 자연스럽게 옮겼습니다. שָׂרִיד은 ‘생존자’로 번역하여 에서의 집에 아무도 남지 않는다는 선언을 명료하게 했습니다. 각주는 실제 대안과 해당 본문 어휘에 연결되도록 수정했습니다.
