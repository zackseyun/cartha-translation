  terminology: ‘형제’, ‘야곱’, ‘폭력’, ‘수치’, ‘끊어지다’, ‘영원히’의 선택은 원문의 친족 언어, 고유명사, 공적 수치 및 심판 관용구를 적절히 보존합니다.
