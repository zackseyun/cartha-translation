lexical_decisions:
- source_word: מֵ/חֲמַס
  english_pob_choice: Because of the violence done to
  chosen_korean: …에게 행한 폭력 때문에
  alternatives_korean:
  - …에 대한 폭력 때문에
  - …에게 가한 폭력 때문에
  lexicon: HALOT
  rationale: מִן 접두사는 여기서 원인/근거를 나타내며, חָמָס는 단순한 ‘폭력’ 이상으로 폭력적 불의의 의미를 지닙니다. ‘행한 폭력 때문에’는 상대에게 가해진 폭력의 방향성과 원인을 함께 드러냅니다.
- source_word: אָחִי/ךָ יַעֲקֹב
  english_pob_choice: your brother Jacob
  chosen_korean: 네 형제 야곱
  alternatives_korean:
  - 네 형제인 야곱
  - 네 친족 야곱
  lexicon: HALOT
  rationale: אָח는 문자적으로 ‘형제’이므로 이를 살리고, 고유명사 야곱을 유지해 에돔과 야곱/이스라엘 사이의 혈연적 고발을 보존했습니다.
- source_word: תְּכַסְּ/ךָ
  english_pob_choice: will cover you
  chosen_korean: 너를 …가 덮을 것입니다
  alternatives_korean:
  - 너를 …가 뒤덮을 것입니다
  - 너를 …가 감쌀 것입니다
  lexicon: HALOT
  rationale: כסה는 ‘덮다/가리다/입히다’의 뜻이 있어, 주어인 수치가 대상을 덮는 관용 표현을 가장 직접적으로 살렸습니다.
- source_word: בוּשָׁה
  english_pob_choice: shame
  chosen_korean: 수치
  alternatives_korean:
  - 부끄러움
  - 치욕
  lexicon: HALOT
  rationale: בּוּשָׁה는 개인 감정만이 아니라 공개적 수치와 모욕의 뉘앙스를 가지므로, 한국어에서는 ‘수치’가 그 공적·윤리적 성격을 더 잘 드러냅니다.
- source_word: וְ/נִכְרַ֖תָּ לְ/עוֹלָֽם
  english_pob_choice: and you will be cut off forever
  chosen_korean: 너는 영원히 끊어질 것입니다
  alternatives_korean:
  - 너는 영원히 끊길 것입니다
  - 너는 영원히 제거될 것입니다
  lexicon: HALOT
  rationale: נכרת는 문자적으로 ‘잘려 나가다/끊기다’의 언약적·심판적 관용구이므로, ‘끊어질 것입니다’로 원형을 보존했습니다. לְעוֹלָם은 종결적 지속을 나타내어 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: 야곱의 지시 대상과 형제 고발의 힘
  chosen_reading: ‘야곱’을 그대로 두어, 단순한 민족명 보충 없이 형제에 대한 폭력을 고발하는 예언의 직접성을 살렸습니다.
  alternative_readings:
  - ‘이스라엘’로 옮겨 즉시성을 높이는 읽기
  rationale: 히브리어 본문이 ‘네 형제 야곱’이라고 말하므로, 족장명 보존이 원문의 친족적·언약적 책망을 가장 정확히 전달합니다. 문맥상 독자는 야곱이 이스라엘을 가리킴을 이해할 수 있습니다.
  doctrine_reference: 원어 우선, 고유명사 보존, 족장명-민족명 대응
