id: OBA.1.7
reference: Obadiah 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַֽד הַ/גְּב֣וּל שִׁלְּח֗וּ/ךָ כֹּ֚ל אַנְשֵׁ֣י בְרִיתֶ֔/ךָ הִשִּׁיא֛וּ/ךָ יָכְל֥וּ לְ/ךָ֖ אַנְשֵׁ֣י שְׁלֹמֶ֑/ךָ לַחְמְ/ךָ֗ יָשִׂ֤ימוּ מָזוֹר֙ תַּחְתֶּ֔י/ךָ אֵ֥ין תְּבוּנָ֖ה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/007.yaml
  text: All the men of your covenant have sent you to the border[a]; the men at peace with you have deceived you and prevailed against you[c][b]. Those who eat your bread have set a trap under you—there is no understanding in him.
  footnotes:
  - marker: a
    text: Or 'have driven you out to the border' or 'have escorted you to the border.' The Hebrew verb can carry either a neutral or hostile nuance in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'lay a snare beneath you.' The Hebrew word rendered 'trap' is rare and its precise nuance is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or 'there is no discernment in him,' possibly referring to Edom; some understand 'in it' or take the line differently because the Hebrew referent is ambiguous.
    reason: alternative_reading
translation:
  language: ko
  text: 너와 언약을 맺은 모든 이들이 너를 국경까지 보냈고[a], 너와 평화 관계에 있던 이들은 너를 속이고 이겼습니다. 네 빵을 먹는 이들이 네 아래에 덫을 놓았으니[b]—그에게는 분별이 없습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너를 국경으로 내쫓았고’, ‘너를 국경까지 호송했으며’로도 옮길 수 있습니다. 히브리어 동사는 문맥에 따라 중립적이거나 적대적인 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 아래에 올무를 놓았으니’로도 옮길 수 있습니다. 여기의 히브리어 단어는 드물게 쓰여 정확한 뉘앙스가 분명하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 안에는 분별이 없습니다’로도 옮길 수 있습니다. 히브리어의 지시 대상이 모호하여, 에돔을 가리키는지 다른 대상을 가리키는지 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד הַגְּבוּל / שִׁלְּחוּךָ
  english_pob_choice: have sent you to the border
  chosen_korean: 너를 경계까지 보내었고
  alternatives_korean:
  - 너를 국경까지 보냈고
  - 너를 경계선까지 내보냈고
  - 너를 경계까지 쫓아냈고
  lexicon: HALOT
  rationale: ‘경계’는 בּוּל/גְּבוּל의 공간 이미지를 살리면서도 한국어에서 자연스럽고, שִׁלְּחוּךָ는 문맥상 단순 파견보다 ‘보내다’로 두되 추방 가능성은 각주로 남겼습니다.
- source_word: אַנְשֵׁי בְרִיתֶךָ / אַנְשֵׁי שְׁלֹמֶךָ
  english_pob_choice: the men of your covenant / the men at peace with you
  chosen_korean: 네 언약의 모든 사람들 / 너와 평화로운 사람들
  alternatives_korean:
  - 네 언약의 사람들
  - 너와 평화 관계에 있는 사람들
  - 너의 동맹자들
  lexicon: HALOT
  rationale: ‘언약’과 ‘평화’의 관계어를 그대로 살려 정치적 동맹보다 더 직접적인 관계의 배신이라는 점이 드러나게 했습니다.
- source_word: הִשִּׁיאוּךָ / יָכְלוּ לְךָ
  english_pob_choice: have deceived you and prevailed against you
  chosen_korean: 너를 속이고 너를 이겼습니다
  alternatives_korean:
  - 너를 속이고 너를 이겼습니다
  - 너를 속이고 너를 압도했습니다
  - 너를 속이고 너에게서 우세를 점했습니다
  lexicon: HALOT
  rationale: 히필의 ‘속이다’와 יכל ל의 ‘이기다/우세를 점하다’의 대결 구도를 한국어로 간결하게 전달했습니다. ‘이겼습니다’는 관계적·군사적 우위를 모두 포괄합니다.
- source_word: לַחְמְךָ / מָזוֹר
  english_pob_choice: Those who eat your bread have set a trap under you
  chosen_korean: 네 빵을 먹는 사람들이 네 아래에 덫을 놓았으니
  alternatives_korean:
  - 네 빵을 먹는 사람들이 네 아래에 덫을 놓았으니
  - 네 음식을 먹는 사람들이 네 아래에 올무를 놓았으니
  - 네 빵을 먹는 사람들이 네 밑에 함정을 놓았으니
  lexicon: HALOT
  rationale: ‘빵’은 식탁 교제와 의존 관계를 보존하며, מָזוֹר는 희귀어라 ‘덫’으로 두되 한국어 각주로 ‘함정/올무’의 가능성을 열어 두었습니다.
- source_word: אֵין תְּבוּנָה בּוֹ
  english_pob_choice: there is no understanding in him
  chosen_korean: 그에게는 분별이 없습니다
  alternatives_korean:
  - 그에게는 분별이 없습니다
  - 그 안에는 분별이 없습니다
  - 그에게는 깨달음이 없습니다
  lexicon: HALOT
  rationale: 문맥상 अस्पष्ट한 지시대상을 그대로 유지하기보다, 히브리어의 추상명사 תְּבוּנָה를 한국어의 ‘분별’로 자연스럽게 옮기되, 3인칭 남성 단수의 모호함은 각주로 남겼습니다.
theological_decisions:
- issue: 마지막 행의 지시대상 모호성
  chosen_reading: ‘그에게는 분별이 없습니다’로 본문을 두고, 지시대상이 에돔인지 다른 대상인지 확정하지 않았습니다.
  alternative_readings:
  - ‘그 안에는 분별이 없습니다’
  - ‘그에게는 분별이 없었으니’
  rationale: 히브리어 בּוֹ의 지시대상이 본문만으로 단정되지 않으므로, 한국어도 동일한 모호성을 보존하는 것이 source-grounded합니다.
  doctrine_reference: 텍스트 비평/해석학적 보존 원칙
