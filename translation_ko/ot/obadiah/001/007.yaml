  source_fidelity: 히브리어의 병렬 구조와 핵심 어휘(언약, 평화, 빵, 덫, 분별)는 대체로 잘 보존되었습니다. 다만 ‘네 언약의 모든 사람들’과 ‘너와 평화로운 사람들’은 אַנְשֵׁי בְרִיתֶךָ 및 אַנְשֵׁי שְׁלֹמֶךָ의 관계적 의미를 한국어에서 다소 부자연스럽게 전달합니다. ‘너와 언약을 맺은 모든 이들’, ‘너와 평화 관계에 있던 이들’로 고치면 원문의 관계 표현과 배신의 문맥을 더 정확하고 자연스럽게 드러냅니다.
