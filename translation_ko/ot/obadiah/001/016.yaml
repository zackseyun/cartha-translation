  chosen_korean: 마치 존재한 적이 없었던 것처럼 될 것입니다
  alternatives_korean:
  - 마치 없었던 것처럼 될 것입니다
  - 마치 한 번도 존재하지 않았던 것처럼 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 뜻하는 완전한 소멸을 현대 한국어로 자연스럽게 풀되, 존재 자체의 지워짐을 분명히 했습니다.
theological_decisions:
- issue: ‘마시다’ 이미지의 의미
  chosen_reading: 에돔의 희롱과 성소 훼손에 대한 대응으로서, 열방이 하나님의 심판의 잔을 마시는 예언적 비유로 읽었습니다.
  alternative_readings:
  - 문자적 음주와 후속 파괴의 묘사
  - 폭력적 소멸을 가리키는 더 일반적인 이미지
  rationale: 문맥상 심판 선언이며, 선지서에서 ‘마시다’가 하나님의 심판을 받는 비유로 자주 쓰이므로, 본문은 비유를 유지한 채 직설적으로 번역했습니다.
  doctrine_reference: 예언적 심판 비유를 유지하고 과잉 해설은 피함
