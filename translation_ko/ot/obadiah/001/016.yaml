  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֗י כַּֽ/אֲשֶׁ֤ר שְׁתִיתֶם֙ עַל הַ֣ר קָדְשִׁ֔/י יִשְׁתּ֥וּ כָֽל הַ/גּוֹיִ֖ם תָּמִ֑יד וְ/שָׁת֣וּ וְ/לָע֔וּ וְ/הָי֖וּ כְּ/ל֥וֹא הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/016.yaml
  text: For just as you drank on my holy mountain[a], all the nations will drink continually; they will drink and swallow[b], and they will be as though they had never been.
  footnotes:
  - marker: a
    text: Or 'swallow'; the Hebrew verb may emphasize consuming the drink completely.
    reason: lexical_alternative
  - marker: b
    text: The drinking imagery likely refers to experiencing divine judgment, a common prophetic metaphor.
    reason: cross_reference
translation:
  language: ko
  text: 이는 곧 너희가 내 거룩한 산에서 마신 것처럼, 모든 나라가 계속 마시게 될 것이기 때문입니다. 그들은 마시고 삼키며, 마치 존재한 적이 없었던 것처럼 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘삼키며’. 히브리어 동사는 마시는 것을 끝까지 완전히 소비한다는 뉘앙스를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 마시기 이미지는 대개 하나님의 심판을 겪는 것을 가리키는 예언적 비유입니다.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  english_pob_choice: For just as
  chosen_korean: 이는 곧 …처럼 …이기 때문입니다
  alternatives_korean:
  - 왜냐하면 …처럼
  - 곧 …한 것처럼
  lexicon: HALOT
  rationale: תחילת 문장은 앞선 선언을 뒷받침하는 이유를 제시하므로, 한국어에서는 인과와 비교를 함께 살리는 표현으로 옮겼습니다.
- source_word: שְׁתִיתֶם / יִשְׁתּוּ
  english_pob_choice: you drank / will drink
  chosen_korean: 마신 것처럼 / 마시게 될 것이기
  alternatives_korean:
  - 마셨듯이 / 마실 것입니다
  - 마셨던 것처럼 / 마시게 됩니다
  lexicon: HALOT
  rationale: 과거의 에돔 행위와 장차 열방이 겪을 일을 대응시키는 대조를 살리기 위해, 과거형과 미래형을 분명히 구분했습니다.
- source_word: וְלָעוּ
  english_pob_choice: they will swallow
  chosen_korean: 삼키며
  alternatives_korean:
  - 삼켜 버리며
  - 벌컥 마시며
  lexicon: HALOT
  rationale: 이 동사는 마시는 행위를 완전히 끝까지 밀어붙이는 뉘앙스를 가지므로, 한국어에서는 간결하게 ‘삼키며’로 옮겨 과도한 의역을 피했습니다.
- source_word: וְהָיוּ כְּלֹא הָיוּ
  english_pob_choice: they will be as though they had never been
  chosen_korean: 마치 존재한 적이 없었던 것처럼 될 것입니다
  alternatives_korean:
  - 마치 없었던 것처럼 될 것입니다
  - 마치 한 번도 존재하지 않았던 것처럼 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 뜻하는 완전한 소멸을 현대 한국어로 자연스럽게 풀되, 존재 자체의 지워짐을 분명히 했습니다.
theological_decisions:
- issue: ‘마시다’ 이미지의 의미
  chosen_reading: 에돔의 희롱과 성소 훼손에 대한 대응으로서, 열방이 하나님의 심판의 잔을 마시는 예언적 비유로 읽었습니다.
  alternative_readings:
  - 문자적 음주와 후속 파괴의 묘사
  - 폭력적 소멸을 가리키는 더 일반적인 이미지
  rationale: 문맥상 심판 선언이며, 선지서에서 ‘마시다’가 하나님의 심판을 받는 비유로 자주 쓰이므로, 본문은 비유를 유지한 채 직설적으로 번역했습니다.
  doctrine_reference: 예언적 심판 비유를 유지하고 과잉 해설은 피함
