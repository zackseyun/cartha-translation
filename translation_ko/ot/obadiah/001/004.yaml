  lexicon: HALOT
  rationale: 조건문 형태이지만 문맥상 가정이 아니라 극대화된 높이조차 무력화하는 양보 의미이므로, 한국어도 양보 표현으로 옮기는 것이 원문 효과를 가장 잘 살립니다.
