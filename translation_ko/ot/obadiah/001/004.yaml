  lexicon: HALOT
  rationale: 비유 이미지를 살리면서 한국어로 자연스러운 고도를 드러내기 위해 ‘독수리처럼’으로 옮겼습니다.
- source_word: בֵּין כּוֹכָבִים
  english_pob_choice: among the stars
