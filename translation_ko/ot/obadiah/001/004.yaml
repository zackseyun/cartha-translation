  rationale: 예언서의 종결 공식인 נְאֻם을 한국어 성경 문체로는 ‘말씀이니라’가 가장 압축적으로 대응하며, 원문에 있는 신명은 프로젝트 기준대로 ‘야훼’로 반영했습니다.
theological_decisions:
