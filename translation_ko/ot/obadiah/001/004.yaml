base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/004.yaml
  text: Though you soar high like the eagle[a], and though you set your nest among the stars, from there I will bring you down, declares Yahweh.
  footnotes:
  - marker: a
    text: 'Or ''If you rise high like an eagle ... if you place your nest among the stars.'' The Hebrew conditional particle can be rendered ''if,'' but here it carries a concessive force: even at the greatest height, the LORD will bring Edom down.'
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 독수리처럼 높이 날아오르고, 비록 별들 사이에 둥지를 놓더라도 — 나는 거기서도 너를 끌어내리겠다. 야훼의 말씀이니라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִם은 여기서 단순한 ‘만일’보다 ‘비록 … 하더라도’의 양보 의미로 기능합니다. 따라서 높이의 극대화를 표현하는 문맥에서 그렇게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
