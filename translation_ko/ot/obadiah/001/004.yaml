  rationale: בֵּין의 공간적 범위를 그대로 드러내면서도, 시적 병행구에서 ‘among the stars’의 비현실적 높이를 한국어로 자연스럽게 표현했습니다.
- source_word: אוֹרִידְךָ
  english_pob_choice: I will bring you down
