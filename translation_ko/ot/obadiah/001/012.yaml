  lexicon: HALOT
  rationale: 히브리어 관용구의 직설적 이미지를 살리면서도 한국어 독자가 의미를 이해할 수 있도록 했습니다. ‘입을 크게 벌리다’는 보통 ‘떠벌리다/큰소리치다’의 뉘앙스를 전달합니다.
theological_decisions:
- issue: 형제 관계와 집단적 책임의 수사
  chosen_reading: ‘형제’와 ‘유다의 아들들’을 그대로 유지해 에돔의 조롱이 혈연적 배신이자 언약 백성에 대한 폭력이라는 점을 드러냈습니다.
  alternative_readings:
