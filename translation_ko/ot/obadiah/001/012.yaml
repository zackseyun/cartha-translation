id: OBA.1.12
reference: Obadiah 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַל תֵּ֤רֶא בְ/יוֹם אָחִ֨י/ךָ֙ בְּ/י֣וֹם נָכְר֔/וֹ וְ/אַל תִּשְׂמַ֥ח לִ/בְנֵֽי יְהוּדָ֖ה בְּ/י֣וֹם אָבְדָ֑/ם וְ/אַל תַּגְדֵּ֥ל פִּ֖י/ךָ בְּ/י֥וֹם צָרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/012.yaml
  text: Do not look on your brother in the day of his misfortune[a], and do not rejoice over the sons of Judah in the day of their destruction[c][b]; and do not make your mouth great in the day of distress.
  footnotes:
  - marker: a
    text: Or 'look on'—the Hebrew verb is literally 'see,' but here carries the sense of looking on with malicious satisfaction, hence 'gloat over.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the day of his calamity' or possibly 'the day he became a stranger/foreigner.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'make your mouth great,' that is, speak boastfully or arrogantly.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 형제에게 그가 불행을 당하던 날에 함부로 바라보지 말며[a], 유다의 아들들 위에 그들의 멸망의 날에 즐거워하지 말고[b], 환난의 날에 네 입을 크게 벌리지 말라[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘보다’이지만, 여기서는 적대적이고 비웃는 시선을 뜻하므로 ‘함부로 바라보다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 멸망/재난’ 또는 ‘그가 이방인이 된 날’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘네 입을 크게 만들다’로, 곧 거만하고 자랑스러운 말을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּרֶא
  english_pob_choice: gloat over
  chosen_korean: 함부로 바라보지 말라
  alternatives_korean:
  - 쳐다보지 말라
  - 우쭐대며 보지 말라
  lexicon: HALOT
  rationale: 히브리어는 단순한 시각 행위가 아니라 적대적·조롱 섞인 응시를 금하는 뜻이므로, 직역의 투명성과 문맥의 공격성을 함께 살린 표현을 택했습니다.
- source_word: אָחִיךָ
  english_pob_choice: your brother
  chosen_korean: 당신의 형제
  alternatives_korean:
  - 네 형제
  - 네 동족
  lexicon: HALOT
  rationale: 에돔과 유다의 형제 관계를 그대로 드러내어, 단순한 친족 이상인 배신의 수사를 보존했습니다.
- source_word: נָכְרוֹ
  english_pob_choice: his misfortune
  chosen_korean: 그가 불행을 당하던 날
  alternatives_korean:
  - 그의 재난의 날
  - 그가 이방인이 된 날
  lexicon: HALOT
  rationale: 문맥상 ‘낯섦/이방됨’의 어감이 있으나, 뒤의 ‘멸망’과 ‘환난’과 평행을 이루는 국가적 재앙의 상황을 가리키므로 한국어로는 자연스러운 ‘불행을 당하다’로 옮겼습니다.
- source_word: תַּגְדֵּל פִּיךָ
  english_pob_choice: make your mouth great
  chosen_korean: 네 입을 크게 벌리지 말라
  alternatives_korean:
  - 자랑스럽게 말하지 말라
  - 거만하게 떠벌리지 말라
  lexicon: HALOT
  rationale: 히브리어 관용구의 직설적 이미지를 살리면서도 한국어 독자가 의미를 이해할 수 있도록 했습니다. ‘입을 크게 벌리다’는 보통 ‘떠벌리다/큰소리치다’의 뉘앙스를 전달합니다.
theological_decisions:
- issue: 형제 관계와 집단적 책임의 수사
  chosen_reading: ‘형제’와 ‘유다의 아들들’을 그대로 유지해 에돔의 조롱이 혈연적 배신이자 언약 백성에 대한 폭력이라는 점을 드러냈습니다.
  alternative_readings:
  - ‘동족’으로 완화
  - ‘유다 백성’으로 평탄화
  rationale: 본문의 도덕적 충격은 형제 언어에 있으므로, 이를 중화하지 않고 유지하는 것이 원문의 수사와 신학적 압력을 더 정확히 반영합니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
