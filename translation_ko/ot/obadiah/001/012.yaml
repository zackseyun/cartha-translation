  lexicon: HALOT
  rationale: 문맥상 ‘낯섦/이방됨’의 어감이 있으나, 뒤의 ‘멸망’과 ‘환난’과 평행을 이루는 국가적 재앙의 상황을 가리키므로 한국어로는 자연스러운 ‘불행을 당하다’로 옮겼습니다.
- source_word: תַּגְדֵּל פִּיךָ
  english_pob_choice: make your mouth great
  chosen_korean: 네 입을 크게 벌리지 말라
  alternatives_korean:
