  lexicon: HALOT
  rationale: 에돔과 유다의 형제 관계를 그대로 드러내어, 단순한 친족 이상인 배신의 수사를 보존했습니다.
- source_word: נָכְרוֹ
  english_pob_choice: his misfortune
  chosen_korean: 그가 불행을 당하던 날
  alternatives_korean:
