  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֥ה קָטֹ֛ן נְתַתִּ֖י/ךָ בַּ/גּוֹיִ֑ם בָּז֥וּי אַתָּ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/002.yaml
  text: Look[a], I have made you small among the nations[b]; you are greatly despised.
  footnotes:
  - marker: a
    text: Or 'insignificant among the nations.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'I have given you small among the nations,' an idiom meaning 'I have made you small among the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보라, 내가 너를 나라들 가운데 작게 만들었습니다[a]; 너는 크게 멸시를 받습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나라들 가운데 보잘것없게.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보라
  alternatives_korean:
  - 여기 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 끌며 선언을 시작하는 감탄사로, 현대 한국어에서 예언적 경고의 힘을 살리기 위해 ‘보라’를 택했습니다.
- source_word: קָטֹן נְתַתִּיךָ
  english_pob_choice: I have made you small
  chosen_korean: 너를 … 작게 만들었습니다
  alternatives_korean:
  - 너를 … 작게 하였습니다
  - 너를 … 작게 되게 했습니다
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘주었습니다’보다, 문맥상 결과를 드러내는 사역적 의미를 살려 ‘작게 만들었습니다’로 옮겼습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 나라들 가운데
  alternatives_korean:
  - 민족들 가운데
  - 열국 가운데
  lexicon: HALOT
  rationale: 여기서는 특정 신학 용어로서의 ‘이방인’이 아니라 열국 전체를 가리키므로, 자연스럽고 직접적인 ‘나라들 가운데’를 선택했습니다.
- source_word: בָּזוּי אַתָּה מְאֹד
  english_pob_choice: you are greatly despised
  chosen_korean: 너는 크게 멸시를 받습니다
  alternatives_korean:
  - 너는 아주 멸시를 받습니다
  - 너는 크게 업신여김을 받습니다
  lexicon: HALOT
  rationale: 수동 분사 ‘멸시를 받다’로 수치를 드러내면서, 강도 부사 ‘מְאֹד’을 ‘크게’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 예언적 완료의 시제 처리
  chosen_reading: 과거 완료형으로 ‘만들었습니다’라고 옮겨, 이미 선포된 하나님의 결정이 현재 효력을 갖는다는 점을 살렸습니다.
  alternative_readings:
  - 만들 것입니다
  - 만듭니다
  rationale: 히브리어 완료형은 예언 문맥에서 확정된 판결을 나타낼 수 있으므로, 단순 미래 예고보다 선언적 완료를 반영하는 번역이 더 적절합니다.
  doctrine_reference: 예언적 완료(prohetic perfect)와 선언적 심판 어조의 보존
