id: OBA.1.21
reference: Obadiah 1:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָל֤וּ מֽוֹשִׁעִים֙ בְּ/הַ֣ר צִיּ֔וֹן לִ/שְׁפֹּ֖ט אֶת הַ֣ר עֵשָׂ֑ו וְ/הָיְתָ֥ה לַֽ/יהוָ֖ה הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/021.yaml
  text: Deliverers will go up on Mount Zion to judge the hill country of Esau[c][b][a], and the kingdom will belong to Yahweh.
  footnotes:
  - marker: a
    text: Or 'Saviors.' The Hebrew term refers here to agents who bring deliverance, not to a denial that ultimate salvation belongs to the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'Mount Esau' or 'the mountain of Esau'; the phrase likely refers to the mountainous territory of Edom.
    reason: lexical_alternative
  - marker: c
    text: Or 'the kingship' or 'the dominion will be the LORD's.'
    reason: lexical_alternative
translation:
  language: ko
  text: 구원자들이[a] 시온 산에 올라가 에서의 산지[b]를 심판할 것이며, 왕권[c]은 야훼께 속하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구출자들’. 히브리어는 구원이나 구출을 이루는 복수의 행위자들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘에서의 산’ 또는 ‘에서의 산지’. 이 표현은 에돔의 산악 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나라’ 또는 ‘통치권’. 히브리어는 왕국뿐 아니라 왕적 통치나 주권을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשִׁעִים
  english_pob_choice: Deliverers
  chosen_korean: 구원자들
  alternatives_korean:
  - 구출자들
  - 해방자들
  - 구원하는 이들
  lexicon: HALOT
  rationale: פּוֹעֵל 분사 복수로서 ‘구해 내는 이들’이라는 능동적 행위자를 가리키므로, 한국어에서는 기능을 살린 ‘구원자들’이 가장 자연스럽습니다.
- source_word: בְּהַר צִיּוֹן
  english_pob_choice: on Mount Zion
  chosen_korean: 시온 산으로
  alternatives_korean:
  - 시온 산 위로
  - 시온 산에
  lexicon: HALOT
  rationale: 원문은 ‘올라가다’와 결합해 시온으로의 상향 이동을 강조하므로, 목적지·도착의 뉘앙스를 살려 ‘시온 산으로’라고 옮겼습니다.
- source_word: לִשְׁפֹּט אֶת הַר עֵשָׂו
  english_pob_choice: to judge the hill country of Esau
  chosen_korean: 에서의 산지를 심판할
  alternatives_korean:
  - 에서의 산을 판결할
  - 에서의 산지를 다스릴
  lexicon: HALOT
  rationale: שפט의 핵심 의미를 보존해 ‘심판하다’로 옮겼고, הַר עֵשָׂו는 단일 산보다 에돔의 영역을 가리키는 문맥이므로 ‘산지’로 처리했습니다.
- source_word: הַמְּלוּכָה
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 통치권
  - 왕국
  lexicon: HALOT
  rationale: 히브리어가 왕권/통치를 포함할 수 있지만, 결말의 선언을 한국어로 가장 자연스럽고 압축적으로 전달하는 표현은 ‘나라’이며, 뒤의 ‘야훼의 것이 될 것입니다’가 소유 관계를 분명히 합니다.
theological_decisions:
- issue: מוֹשִׁעִים을 인간 사역자와 최종 구원자 사이의 긴장 속에서 어떻게 번역할지
  chosen_reading: 구원자들
  alternative_readings:
  - 구주들
  - 구출자들
  rationale: 이들은 야훼의 구원을 실행하는 도구들이며, 본절의 결론은 나라가 야훼께 속한다는 점입니다. 따라서 인간의 대리적 역할을 드러내되, 유일한 구원의 주체를 흐리지 않는 표현이 필요했습니다.
  doctrine_reference: 번역 원리 §1, §6
- issue: וְהָיְתָה לַיהוָה הַמְּלוּכָה의 소유·통치 의미
  chosen_reading: 나라가 야훼의 것이 될 것입니다
  alternative_readings:
  - 왕권이 야훼의 것이 될 것입니다
  - 통치권이 야훼의 것이 될 것입니다
  rationale: 히브리어는 왕권 자체와 그 통치를 함께 암시할 수 있지만, 최종 귀속을 분명히 하려면 ‘~의 것이 되다’라는 소유 표현이 가장 직접적입니다.
  doctrine_reference: 번역 원리 §3, §6
