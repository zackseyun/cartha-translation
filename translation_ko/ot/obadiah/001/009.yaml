id: OBA.1.9
reference: Obadiah 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חַתּ֥וּ גִבּוֹרֶ֖י/ךָ תֵּימָ֑ן לְמַ֧עַן יִכָּֽרֶת אִ֛ישׁ מֵ/הַ֥ר עֵשָׂ֖ו מִ/קָּֽטֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/009.yaml
  text: And your mighty men[a], Teman, will be shattered[c][b], so that every man from the mountain of Esau may be cut off by slaughter.
  footnotes:
  - marker: a
    text: Or 'will be dismayed' or 'will be terrified.' The Hebrew verb can emphasize panic as well as ruin.
    reason: lexical_alternative
  - marker: b
    text: Teman was a region or city of Edom; the name is related to 'south.'
    reason: cultural_note
  - marker: c
    text: Or 'everyone from the mountain of Esau will be cut off in the slaughter.' The final phrase may be taken with slightly different nuance.
    reason: alternative_reading
translation:
  language: ko
  text: 또 네 용사들, 데만이여, 무너질 것입니다. 그렇게 해서 에서의 산에서 각 사람이 살육으로 끊어지게 하려는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무너질 것입니다’는 히브리어 חתת의 공포와 붕괴를 함께 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘데만’은 에돔의 지역 또는 도시 이름으로, ‘남쪽’이라는 뜻과 관련이 있습니다.
    reason: cultural_note
  - marker: c
    text: ‘에서의 산’은 히브리어의 직역형으로, ‘에서의 산지’ 또는 ‘에서의 산에서’처럼 약간 다른 뉘앙스로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחַתּוּ
  english_pob_choice: will be shattered
  chosen_korean: 무너질 것입니다
  alternatives_korean:
  - 두려워할 것입니다
  - 경악할 것입니다
  - 산산이 부서질 것입니다
  lexicon: HALOT
  rationale: 전투적 붕괴와 공포의 의미를 함께 담기 위해 직역적이되 자연스러운 ‘무너질 것입니다’를 선택했습니다.
- source_word: גִבּוֹרֶיךָ
  english_pob_choice: your mighty men
  chosen_korean: 네 용사들
  alternatives_korean:
  - 네 강한 자들
  - 네 전사들
  - 네 영웅들
  lexicon: HALOT
  rationale: 군사적 맥락에서 גיבור의 힘센 전투인을 드러내는 말로 ‘용사들’이 가장 자연스럽습니다.
- source_word: תֵּימָן
  english_pob_choice: Teman
  chosen_korean: 데만
  alternatives_korean:
  - 테만
  - 남쪽
  lexicon: HALOT
  rationale: 고유명사로 처리해야 하므로 음역했고, 한국어 성경에서 통용되는 표기인 ‘데만’을 택했습니다.
- source_word: מֵהַר עֵשָׂו
  english_pob_choice: from the mountain of Esau
  chosen_korean: 에서의 산에서
  alternatives_korean:
  - 에서의 산으로부터
  - 에서의 산지에서
  - 에서의 산에서부터
  lexicon: HALOT
  rationale: 히브리어의 소유격 구문을 한국어의 자연스러운 속격으로 옮겨, 에돔 전체를 가리키는 지리·상징적 표현을 보존했습니다.
- source_word: מִקָּטֶל
  english_pob_choice: by slaughter
  chosen_korean: 살육으로
  alternatives_korean:
  - 도륙으로
  - 대량 학살로
  - 살해로
  lexicon: HALOT
  rationale: 전치 מ의 수단·동반 의미를 반영하면서, 명사 קטל의 참혹한 어감을 가장 직접적으로 살리는 표현으로 ‘살육으로’를 택했습니다.
theological_decisions:
- issue: לְמַעַן + יִכָּרֶת의 목적/결과 절 처리
  chosen_reading: 그렇게 해서 ... 끊어지게 하려는 것입니다
  alternative_readings:
  - 그래서 ... 끊어질 것입니다
  - 그리하여 ... 끊어지게 될 것입니다
  rationale: 히브리어 목적절의 의도성을 살리기 위해 단순 미래보다 목적·결과의 뉘앙스를 드러내는 표현을 사용했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 1
