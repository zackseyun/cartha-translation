revisions:
- from: 또 네 용사들, 데만이여, 무너질 것입니다. 그렇게 해서 에서의 산에서 각 사람이 살육으로 끊어지게 하려는 것입니다.[a][b][c]
  to: 또 네 용사들은, 데만아, 두려워 떨 것입니다. 그리하여 에서의 산 출신인 모든 사람이 살육으로 끊어질 것입니다.[a][b][c]
  rationale: The revision restores a clear Korean prophetic announcement, renders the military panic denoted by חתת more closely, and represents the לְמַעַן clause as a result-oriented consequence without supplying an unstated agent. The vocative ‘데만아’ reflects Teman’s direct address in the Hebrew syntax; a Hebrew vocative does not require a separate particle. Footnote c is aligned with the documented alternative syntactic nuance of the final phrase.
