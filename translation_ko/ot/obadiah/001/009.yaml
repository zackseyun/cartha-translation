source:
  edition: WLC
  text: וְ/חַתּ֥וּ גִבּוֹרֶ֖י/ךָ תֵּימָ֑ן לְמַ֧עַן יִכָּֽרֶת אִ֛ישׁ מֵ/הַ֥ר עֵשָׂ֖ו מִ/קָּֽטֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/009.yaml
  text: And your mighty men[a], Teman, will be shattered[c][b], so that every man from the mountain of Esau may be cut off by slaughter.
  footnotes:
  - marker: a
    text: Or 'will be dismayed' or 'will be terrified.' The Hebrew verb can emphasize panic as well as ruin.
    reason: lexical_alternative
  - marker: b
    text: Teman was a region or city of Edom; the name is related to 'south.'
    reason: cultural_note
  - marker: c
    text: Or 'everyone from the mountain of Esau will be cut off in the slaughter.' The final phrase may be taken with slightly different nuance.
    reason: alternative_reading
translation:
  language: ko
  text: 또 네 용사들은, 데만아, 두려워 떨 것입니다. 그리하여 에서의 산 출신인 모든 사람이 살육으로 끊어질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려워 떨 것입니다’로 옮긴 히브리어 동사는 ‘낙담할 것입니다’, ‘공포에 사로잡힐 것입니다’, 또는 ‘산산이 부서질 것입니다’로도 옮길 수 있습니다. 이 문맥에서는 공포와 군사적 붕괴를 함께 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘데만’은 에돔의 지역 또는 도시 이름이며, 그 이름은 ‘남쪽’이라는 뜻과 관련이 있습니다.
    reason: cultural_note
  - marker: c
    text: 마지막 구절은 ‘살육으로’가 ‘끊어질 것입니다’를 수식하는 것으로 옮겼습니다. ‘살육 가운데 에서의 산 출신인 모든 사람이 끊어질 것입니다’처럼 약간 다르게 연결하여 이해할 수도 있습니다.
    reason: alternative_reading
