id: OBA.1.20
reference: Obadiah 1:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גָלֻ֣ת הַֽ/חֵל הַ֠/זֶּה לִ/בְנֵ֨י יִשְׂרָאֵ֤ל אֲשֶֽׁר כְּנַעֲנִים֙ עַד צָ֣רְפַ֔ת וְ/גָלֻ֥ת יְרוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/סְפָרַ֑ד יִֽרְשׁ֕וּ אֵ֖ת עָרֵ֥י הַ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/020.yaml
  text: And the exiles of this host of the sons of Israel, who are among the Canaanites as far as Zarephath, and the exiles of Jerusalem who are in Sepharad, will possess the cities of the Negev.
translation:
  language: ko
  text: 그리고 이스라엘 자손의 이 군대의 포로들, 곧 가나안 사람들 가운데 사르밧까지 흩어진 자들과 예루살렘의 포로들, 곧 스바랏에 있는 자들이 네게브의 성읍들을 차지할 것입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 חֵל은 문맥상 ‘군대/무리’의 집합적 뉘앙스를 가지며, POB의 English audit trail도 ‘host’를 채택합니다.
    reason: lexical_alternative
  - marker: b
    text: 스바랏(Sepharad)은 본문에 나오는 지명 음역으로, 정확한 위치는 확정되지 않았습니다.
    reason: cultural_note
lexical_decisions:
- source_word: גָלֻת
  english_pob_choice: exiles
  chosen_korean: 포로들
  alternatives_korean:
  - 포로
  - 유배된 사람들
  - 사로잡힌 자들
  lexicon: גלה
  rationale: 포로 상태에 있는 사람들을 가리키는 말로, 문맥상 집단 복수형을 자연스럽게 살리기 위해 ‘포로들’로 옮겼습니다.
- source_word: הַחֵל
  english_pob_choice: this host
  chosen_korean: 이 군대
  alternatives_korean:
  - 이 무리
  - 이 진영
  - 이 군사들
  lexicon: חיל
  rationale: POB의 ‘host’를 따라 집합적 군사/무리 이미지를 살리되, 한국어에서 가장 직접적인 대응인 ‘군대’를 선택했습니다.
- source_word: יִרְשׁוּ
  english_pob_choice: will possess
  chosen_korean: 차지할 것입니다
  alternatives_korean:
  - 소유할 것입니다
  - 점유할 것입니다
  - 차지하게 될 것입니다
  lexicon: ירש
  rationale: 단순 소유보다 땅과 성읍을 상속·점유하는 의미를 드러내기 위해 ‘차지하다’를 사용했습니다.
- source_word: עָרֵי הַנֶּגֶב
  english_pob_choice: the cities of the Negev
  chosen_korean: 네게브의 성읍들
  alternatives_korean:
  - 남방의 성읍들
  - 네겝의 도시들
  lexicon: עָרִים / נֶגֶב
  rationale: 지명 ‘네게브’는 음역을 유지하고, עיר는 문맥상 ‘성읍’이 가장 적절하여 전통적 지리 표현을 살렸습니다.
theological_decisions:
- issue: 이 구절의 ‘군대’ 표현이 군사적 의미인지 포로 집단을 가리키는지
  chosen_reading: 여기서는 실제 전투 부대라기보다 흩어진 이스라엘 포로 공동체를 집합적으로 가리키는 표현으로 이해하되, 원문의 군사적 뉘앙스는 ‘군대’로 보존했습니다.
  alternative_readings:
  - ‘무리’로 완화하여 비군사적으로 읽기
  - ‘진영’으로 중립화하기
  rationale: WLC의 הַחֵל은 집합적 군사 이미지를 띠므로, 이를 지우기보다 본문이 주는 긴장감을 한국어에서도 유지하는 것이 좋습니다.
  doctrine_reference: 문맥적 어휘 선택
- issue: ‘포로들’과 ‘흩어진 자들’의 병렬 구조
  chosen_reading: 두 표현을 모두 살려, 흩어짐과 강제 이주의 이중 이미지를 유지했습니다.
  alternative_readings:
  - 둘 중 하나를 합쳐 중복을 줄이기
  - ‘유배된 자들’로 통일하기
  rationale: 히브리어는 두 개의 포로/유배 표현을 병렬로 두어 범위를 넓히므로, 한국어에서도 중복을 줄이기보다 병렬성을 보존했습니다.
  doctrine_reference: 원문 병렬 구조 보존
