  to: 갈림길[a]에 서서 그의 도망자들을 끊어 없애지 마십시오. 고난의 날에 그의 생존자들[c]을 넘겨주지도[b] 마십시오.
  rationale: ‘갈림길’은 הַפֶּרֶק의 기본 공간 이미지를 보존하고, ‘끊어 없애다’는 לְהַכְרִית의 제거 의미를 자연스러운 한국어로 전달합니다. 두 절을 합쇼체 금지 명령으로 병렬화했으며, 각주 표지를 각각의 해당 어휘에 배치했습니다. ‘생존자들’은 유지하여 본문이 요구하지 않는 기술적 ‘남은 자’ 개념을 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:43:24Z'
