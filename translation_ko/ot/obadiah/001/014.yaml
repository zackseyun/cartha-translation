id: OBA.1.14
reference: Obadiah 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַֽל תַּעֲמֹד֙ עַל הַ/פֶּ֔רֶק לְ/הַכְרִ֖ית אֶת פְּלִיטָ֑י/ו וְ/אַל תַּסְגֵּ֥ר שְׂרִידָ֖י/ו בְּ/י֥וֹם צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/014.yaml
  text: Do not stand at the crossroads to cut off his fugitives[c][b][a], and do not hand over his survivors in the day of distress.
  footnotes:
  - marker: a
    text: Or 'at the fork of the road' or 'at the mountain pass.' The Hebrew term refers to a place where fugitives could be intercepted.
    reason: lexical_alternative
  - marker: b
    text: Or 'deliver up' or 'surrender.' The Hebrew verb is literally 'shut/close,' here used in the sense of giving people over to an enemy.
    reason: lexical_alternative
  - marker: c
    text: Or 'his remnant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 갈림길[a]에 서서 그의 도망자들을 끊어 없애지 마십시오. 고난의 날에 그의 생존자들[c]을 넘겨주지도[b] 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘길이 갈라지는 곳’ 혹은 ‘산길의 고개’로 옮길 수 있습니다. 이 히브리어 낱말은 도망자들을 가로막을 수 있는 지점을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내주다’ 또는 ‘적의 손에 넘기다’입니다. 히브리어 동사는 문자적으로 ‘닫다/잠그다’라는 뜻이지만, 여기서는 적에게 넘겨주는 의미로 쓰였습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 남은 자들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תַּעֲמֹד
  english_pob_choice: Do not stand
  chosen_korean: 길목에 서서
  alternatives_korean:
  - 서지 말고
  - 자리를 지키지 말고
  - 가로막고 서지 말고
  lexicon: HALOT
  rationale: עמד의 기본 이미지인 ‘서다’를 살리되, 문맥상 도망자들을 가로막는 위치를 드러내기 위해 ‘길목에 서서’로 옮겼습니다.
- source_word: הַפֶּרֶק
  english_pob_choice: the crossroads
  chosen_korean: 길목
  alternatives_korean:
  - 갈림길
  - 교차로
  - 고개
  lexicon: HALOT
  rationale: 도주자를 가로채기 쉬운 분기점이라는 의미를 한국어로 자연스럽게 드러내기 위해 ‘길목’을 택했고, 문자적 ‘갈림길’보다 포획 지점을 더 분명히 보여 줍니다.
- source_word: לְהַכְרִית אֶת פְּלִיטָיו
  english_pob_choice: to cut off his fugitives
  chosen_korean: 그의 도망자들을 끊어버리지
  alternatives_korean:
  - 그의 도망자들을 멸하지
  - 그의 도망자들을 없애지
  - 그의 도망자들을 제거하지
  lexicon: HALOT
  rationale: כרת의 ‘잘라 내다/끊다’ 이미지를 보존하면서, 추격·차단의 맥락에 맞게 ‘끊어버리다’로 옮겼습니다.
- source_word: וְאַל תַּסְגֵּר שְׂרִידָיו
  english_pob_choice: and do not hand over his survivors
  chosen_korean: 그의 생존자들을 … 넘겨주지도 말아야 합니다
  alternatives_korean:
  - 그의 남은 자들을 넘겨주지도 말아야 합니다
  - 그의 생존자들을 넘기지도 말아야 합니다
  - 그의 남은 사람들을 내주지도 말아야 합니다
  lexicon: HALOT
  rationale: סגר의 ‘닫다’에서 파생된 ‘넘겨주다/내주다’의 관용적 의미를 살려, 적의 손에 넘기는 행위를 분명히 표현했습니다.
- source_word: שְׂרִידָיו
  english_pob_choice: his survivors
  chosen_korean: 그의 생존자들
  alternatives_korean:
  - 그의 남은 자들
  - 그의 남은 자녀들
  - 그의 남은 사람들
  lexicon: HALOT
  rationale: 여기서는 예언서의 기술적 ‘남은 자’보다 전쟁과 재난에서 살아남은 사람들을 가리키는 직접적 의미가 더 강하므로 ‘생존자들’이 적합합니다.
theological_decisions:
- issue: שְׂרִידָיו를 ‘남은 자/남은 자들’로 볼지 여부
  chosen_reading: ‘생존자들’로 옮겨, 특별한 신학적 ‘남은 자’ 개념을 전면에 두지 않았습니다.
  alternative_readings:
  - 남은 자들
  - 남은 자
  rationale: 본문은 에돔이 도망치는 유다 사람들을 배신하는 죄를 꾸짖는 맥락이므로, 여기서는 보존된 신앙 공동체라는 신학적 용어보다 실제로 살아남은 사람들을 가리키는 의미가 우선합니다.
  doctrine_reference: 예언서 번역에서는 문맥이 요구하지 않는 경우 ‘remnant’ 신학을 과도하게 주입하지 않습니다.
