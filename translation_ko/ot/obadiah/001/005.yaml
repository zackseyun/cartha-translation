  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם גַּנָּבִ֤ים בָּאֽוּ לְ/ךָ֙ אִם שׁ֣וֹדְדֵי לַ֔יְלָה אֵ֣יךְ נִדְמֵ֔יתָה הֲ/ל֥וֹא יִגְנְב֖וּ דַּיָּ֑/ם אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ הֲ/ל֖וֹא יַשְׁאִ֥ירוּ עֹלֵלֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/005.yaml
  text: If thieves came to you[a], if robbers by night—how you have been destroyed!—would they not steal only enough for themselves? If grape gatherers came to you[b], would they not leave gleanings?
  footnotes:
  - marker: a
    text: Or, 'how you are cut off' / 'how you have been ruined.' The Hebrew verb can be rendered in several closely related ways in this context of devastation.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'would they not steal their sufficiency?'—that is, only as much as was enough for them.
    reason: lexical_alternative
translation:
  language: ko
  text: 만약 밤에 온 도둑들이, 강도들이 왔다면—너는 얼마나 철저히 멸망했겠느냐!—그들이 자기들에게 충분한 만큼만 훔치지 않겠느냐? 만약 포도 따는 자들이 네게 왔다면, 그들이 이삭 줍는 것들을 남기지 않겠느냐?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들이 자기들의 충분함을 훔치지 않겠느냐’라는 뜻으로, 보통 도둑은 자기 몫만 가져간다는 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이삭 줍는 것들’은 포도 수확 뒤에 남는 잔여 열매를 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּנָּבִים
  english_pob_choice: thieves
  chosen_korean: 도둑들
  alternatives_korean:
  - 훔치는 자들
  - 절도범들
  lexicon: HALOT
  rationale: 일반적인 चोरी 행위자를 자연스러운 현대 한국어로 옮기면 ‘도둑들’이 가장 직접적입니다.
- source_word: שֹׁדְדֵי לַיְלָה
  english_pob_choice: robbers by night
  chosen_korean: 밤에 온 강도들
  alternatives_korean:
  - 밤의 약탈자들
  - 야간 강도들
  lexicon: HALOT
  rationale: שׁדד의 폭력적 약탈 뉘앙스를 살리되, ‘밤에 온’으로 시간 표현을 자연스럽게 풀어 옮겼습니다.
- source_word: אֵיךְ נִדְמֵיתָה
  english_pob_choice: how you have been destroyed
  chosen_korean: 너는 얼마나 철저히 멸망했겠느냐
  alternatives_korean:
  - 너는 얼마나 끊어졌겠느냐
  - 너는 얼마나 파멸되었겠느냐
  lexicon: HALOT
  rationale: 문맥상 에돔의 완전한 황폐를 드러내므로, ‘멸망했다’에 ‘철저히’를 더해 원문의 탄식과 파괴의 강도를 살렸습니다.
- source_word: דַּיָּם
  english_pob_choice: only enough for themselves
  chosen_korean: 자기들에게 충분한 만큼만
  alternatives_korean:
  - 자기 몫만
  - 필요한 만큼만
  lexicon: HALOT
  rationale: ‘충분함’의 의미를 풀어, 보통 도둑은 자기 몫만 가져간다는 대비를 분명히 했습니다.
- source_word: בֹּצְרִים
  english_pob_choice: grape gatherers
  chosen_korean: 포도 따는 자들
  alternatives_korean:
  - 포도 수확자들
  - 포도 채집자들
  lexicon: HALOT
  rationale: 포도 수확의 구체적 장면을 유지하면서 한국어로 가장 자연스러운 표현을 택했습니다.
- source_word: עֹלֵלוֹת
  english_pob_choice: gleanings
  chosen_korean: 이삭 줍는 것들
  alternatives_korean:
  - 남은 포도송이들
  - 줍는 열매들
  lexicon: HALOT
  rationale: 본문의 ‘남김’ 이미지를 전달하되, 한국어 성경 독자가 알아보기 쉬운 ‘이삭 줍는 것들’로 포도밭의 잔여물을 풀어 옮겼습니다.
theological_decisions:
- issue: 문장 마지막의 농경 이미지(포도 따는 자들과 남김)
  chosen_reading: 약탈과 수확의 일상적 한계를 들어 에돔의 전면적 파괴를 부각하는 풍자적 비교로 옮겼습니다.
  alternative_readings:
  - 단순한 농사 비유로 완화해서 옮김
  - 더 직설적인 심판 선언으로 재구성
  rationale: 원문은 질문 형식의 비교를 통해 ‘이 정도는 남긴다’는 상식을 깨며 에돔의 파괴가 그보다 훨씬 심각함을 드러냅니다. 이 구조를 유지하는 것이 핵심입니다.
  doctrine_reference: 문맥상 예언적 심판의 수사
