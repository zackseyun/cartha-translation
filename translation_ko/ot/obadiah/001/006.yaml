  text: אֵ֚יךְ נֶחְפְּשׂ֣וּ עֵשָׂ֔ו נִבְע֖וּ מַצְפֻּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/006.yaml
  text: How Esau has been searched out! His hidden treasures have been sought out![a][b]
  footnotes:
  - marker: a
    text: Esau here refers collectively to the people or land of Edom, Esau's descendants.
    reason: cross_reference
  - marker: b
    text: Or 'How Esau has been ransacked! His secret stores have been uncovered!'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌 에서가 수색을 당했습니까! 그의 숨은 보물들이 찾아내어졌습니다[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘에서’는 에서의 후손들, 곧 에돔을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘어찌 에서가 약탈당했습니까! 그의 비밀 저장물들이 드러났습니다!’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 어찌
  alternatives_korean:
  - 얼마나
  - 아, 어찌
  lexicon: HALOT
  rationale: 감탄형 수사 의문을 한국어에서 자연스럽게 살리되, 단순한 정보 질문이 아니라 놀라움을 드러내는 말로 옮겼습니다.
- source_word: נֶחְפְּשׂוּ
  english_pob_choice: has been searched out
  chosen_korean: 수색을 당했습니다
  alternatives_korean:
  - 샅샅이 찾아졌습니다
  - 철저히 수색당했습니다
  lexicon: HALOT
  rationale: 피동적·결과적 의미를 살려 ‘수색을 당하다’로 옮겼고, 문맥상 침탈당한 상태를 자연스럽게 드러냅니다.
- source_word: עֵשָׂו
  english_pob_choice: Esau
  chosen_korean: 에서
  alternatives_korean:
  - 에돔
  - 에서의 후손들
  lexicon: HALOT
  rationale: 본문의 고유명사를 그대로 살리되, 오바댜에서 집단·민족을 가리키는 메톤미로 쓰인 점은 주석으로 처리합니다.
- source_word: מַצְפֻּנָיו
  english_pob_choice: his hidden treasures
  chosen_korean: 그의 숨은 보물들
  alternatives_korean:
  - 그의 비밀 저장물
  - 그의 감추어 둔 것들
  lexicon: HALOT
  rationale: 숨겨져 있던 귀중품 또는 저장물을 가리키므로, ‘보물들’로 가치와 은폐성을 함께 살렸습니다.
theological_decisions:
- issue: 에서의 지시 대상
  chosen_reading: 본문의 ‘에서’는 개인 에서를 넘어서 에서의 후손들, 곧 에돔 전체를 가리키는 집합적 표현으로 이해했습니다.
  alternative_readings:
  - 개인 에서에 대한 직접 진술
  - 에돔으로 의역
  rationale: 영어 POB의 audit note와 오바댜 전체 문맥상, 본문의 이름은 민족적 대표명으로 기능합니다. 다만 본문 자체의 표면형은 보존했습니다.
  doctrine_reference: 역사-문맥 주해 / 집합적 고유명사
