  source_fidelity: 히브리어의 감탄적 אֵיךְ와 두 피동 완료형의 결과 상태를 반영해야 합니다. 초안은 대체로 의미를 전달하지만, ‘수색을 당하다’는 사람에 대한 경찰 수색을 연상시켜 집단·영토를 가리키는 ‘에서’와 결합할 때 부자연스럽습니다. 또한 ‘찾아내어졌습니다’는 현대 표준어 문장으로 매우 어색합니다.
  naturalness: ‘어찌나 … 뒤져졌습니까!’는 감탄적 수사의문을 합쇼체로 자연스럽게 표현합니다. ‘발견되었습니다’는 두 번째 피동 표현을 자연스럽게 살리며, ‘숨겨 둔 보물들’은 מַצְפֻּנָיו의 은닉성과 문맥상의 귀중품 의미를 전달합니다.
  terminology: ‘에서’는 본문의 고유명사를 보존하고, 각주에서 에돔을 집합적으로 가리킨다는 점을 설명하는 것이 적절합니다. ‘보물들’은 문맥상 안전한 해석이며, 대안 각주는 ‘비밀 저장물들’이라는 더 직역적인 가능성을 보존합니다.
