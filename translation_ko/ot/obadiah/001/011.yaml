id: OBA.1.11
reference: Obadiah 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/יוֹם֙ עֲמָֽדְ/ךָ֣ מִ/נֶּ֔גֶד בְּ/י֛וֹם שְׁב֥וֹת זָרִ֖ים חֵיל֑/וֹ וְ/נָכְרִ֞ים בָּ֣אוּ שער/ו וְ/עַל יְרוּשָׁלִַ֨ם֙ יַדּ֣וּ גוֹרָ֔ל גַּם אַתָּ֖ה כְּ/אַחַ֥ד מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/011.yaml
  text: On the day when you stood aloof[a], on the day strangers carried off his wealth, and foreigners entered his gates and cast lots over Jerusalem[c][b], you too were like one of them.
  footnotes:
  - marker: a
    text: Or 'you stood aloof' or 'you stood at a distance.' The Hebrew idiom literally speaks of standing opposite/from a distance.
    reason: lexical_alternative
  - marker: b
    text: Or 'his army' or 'his strength' for 'his wealth'; the Hebrew חֵיל can denote military force, strength, or resources/wealth.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'his gate,' likely referring to Jerusalem or Judah personified; some English translations render idiomatically 'his gates.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 멀찍이 서 있던 날[a], 낯선 자들이 그의 재물을 빼앗아 가고[b] 외국인들이 그의 성문으로 들어가[c] 예루살렘을 두고 제비를 뽑던 날, 너도 그들 가운데 하나와 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘맞은편에 서서’ 또는 ‘멀찍이 서서’라는 뜻입니다. 문맥에서는 재난을 보고도 거리를 둔 태도를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חֵיל은 ‘재물’ 외에 ‘군사력’, ‘힘’ 또는 ‘자원’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그의 성문’(단수형)입니다. 예루살렘 또는 유다가 인격화되어 가리켜진 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם עֲמָדְךָ מִנֶּגֶד
  english_pob_choice: you stood aloof
  chosen_korean: 서서 구경하던
  alternatives_korean:
  - 서서 물러서 있던
  - 서서 떨어져 있던
  - 서서 먼 데 있던
  lexicon: HALOT
  rationale: מִנֶּגֶד는 단순한 거리보다 ‘멀찍이 떨어져 있음/마주 서 있음’의 뉘앙스를 가지므로, 문맥상 책임 있는 방관을 드러내는 ‘서서 구경하던’으로 자연스럽게 옮겼습니다.
- source_word: שְׁבוֹת זָרִים חֵילוֹ
  english_pob_choice: strangers carried off his wealth
  chosen_korean: 이방인들이 그의 재물을 빼앗고
  alternatives_korean:
  - 낯선 자들이 그의 재산을 가져가고
  - 외국인들이 그의 재물을 빼앗고
  lexicon: HALOT
  rationale: חֵיל은 재물·재산·군사력/힘까지 넓게 가질 수 있으나, 약탈과 성문 침입의 문맥에서는 ‘재물’이 가장 자연스럽습니다.
- source_word: נָכְרִים בָּאוּ שַׁעְרָו
  english_pob_choice: foreigners entered his gates
  chosen_korean: 외국인들이 그의 문으로 들어가
  alternatives_korean:
  - 외국인들이 그의 성문들로 들어가
  - 낯선 자들이 그의 문으로 들어가
  lexicon: HALOT
  rationale: שַׁעַר는 도시의 ‘문/성문’이지만, 한국어에서는 단수형 ‘문’이 원문의 도시-인격화 표현을 과도하게 풀지 않으면서도 읽기 자연스럽습니다.
- source_word: יַדּוּ גוֹרָל
  english_pob_choice: cast lots
  chosen_korean: 제비를 뽑던
  alternatives_korean:
  - 제비를 던지던
  - 제비를 나누던
  lexicon: HALOT
  rationale: גורל은 소유 분배나 정복의 결과를 두고 행하는 관용적 행위이므로, 표준적인 한국어 성경 표현인 ‘제비를 뽑다’를 사용했습니다.
- source_word: כְּאַחַד מֵהֶם
  english_pob_choice: you too were like one of them
  chosen_korean: 너도 그들 가운데 하나와 같았습니다
  alternatives_korean:
  - 너도 그들 중 하나와 같았습니다
  - 너도 그들과 같은 편이었습니다
  lexicon: HALOT
  rationale: 비교구문을 유지하면서 에돔이 침략자들과 도덕적으로 한편이 되었음을 드러내기 위해 ‘그들 가운데 하나와 같았습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘서서 구경하던’이 드러내는 에돔의 책임성
  chosen_reading: 단순한 거리 유지가 아니라, 예루살렘의 재난 앞에서 책임 있게 개입하지 않은 방관이 죄로 규정됩니다.
  alternative_readings:
  - 중립적 거리두기의 묘사
  - 그저 물리적으로 멀리 서 있었다는 진술
  rationale: 문장의 결론인 ‘너도 그들 가운데 하나와 같았습니다’가 방관을 도덕적 동참으로 판정하므로, 한국어도 그 비난의 힘을 살려야 합니다.
  doctrine_reference: 예언자적 책망과 연대 책임
