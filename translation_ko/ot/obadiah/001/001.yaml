reference: Obadiah 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֲז֖וֹן עֹֽבַדְיָ֑ה כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לֶ/אֱד֗וֹם שְׁמוּעָ֨ה שָׁמַ֜עְנוּ מֵ/אֵ֤ת יְהוָה֙ וְ/צִיר֙ בַּ/גּוֹיִ֣ם שֻׁלָּ֔ח ק֛וּמוּ וְ/נָק֥וּמָה עָלֶי/הָ לַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/001.yaml
  text: 'The vision of Obadiah[a]. Thus says the Lord GOD concerning Edom: We have heard a report from Yahweh, and a messenger has been sent among the nations: “Rise up[c][b], and let us rise against her for battle.”'
  footnotes:
  - marker: a
    text: Or 'an envoy' or 'an ambassador' for 'a messenger.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'against her,' referring to Edom as a nation; English could also render 'against it.'
    reason: lexical_alternative
  - marker: c
    text: The identity of 'we' and 'let us' is not specified in the Hebrew and may be understood in more than one way.
    reason: alternative_reading
translation:
  language: ko
  text: 오바댜의 환상입니다. 주 야훼께서 에돔에 대하여 이렇게 말씀하십니다. 「우리가 야훼께로부터 소식을 들었습니다. 그리고 한 전령이 여러 민족들 가운데로 보내졌습니다. ‘일어나라. 우리가 그 나라를 치러 올라가자.’」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֲזוֹן은 ‘환상’ 외에도 ‘예언적 계시’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘그녀를 향하여’는 에돔이라는 나라를 가리키는 여성 단수 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 본문의 ‘우리’가 누구인지 히브리어는 밝히지 않으며, 여러 방식으로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  english_pob_choice: vision
  chosen_korean: 환상
  alternatives_korean:
  - 계시
  - 환시
  lexicon: HALOT
  rationale: 예언 서문의 חֲזוֹן은 예언적 ‘보임/계시’를 가리키므로, 문맥상 자연스럽고 직접적인 ‘환상’으로 옮겼습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: the Lord GOD
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 하나님
  - 주 여호와
  lexicon: HALOT
  rationale: 아도나이와 신명기적 이름의 결합을 한국어에서 구분해 드러내기 위해 ‘주 야훼’로 옮겼습니다.
- source_word: שְׁמוּעָה שָׁמַעְנוּ
  english_pob_choice: We have heard a report
  chosen_korean: 우리가 ... 소식을 들었습니다
  alternatives_korean:
  - 우리가 ... 보고를 들었습니다
  - 우리가 ... 소문을 들었습니다
  lexicon: HALOT
  rationale: שְׁמוּעָה는 중립적인 ‘소식/보고’의 뉘앙스가 있어, 불확실성을 강하게 띠는 ‘소문’보다 ‘소식’을 택했습니다.
- source_word: וְצִיר בַּגּוֹיִם שֻׁלָּח
  english_pob_choice: and a messenger has been sent among the nations
  chosen_korean: 그리고 한 전령이 여러 민족들 가운데로 보내졌습니다
  alternatives_korean:
  - 그리고 한 사자가 민족들 가운데로 보내졌습니다
  - 그리고 한 사신이 여러 민족들 가운데로 보내졌습니다
  lexicon: HALOT
  rationale: צִיר는 문맥상 전령/사신의 의미가 가능하므로, 너무 외교적인 ‘사신’보다 넓은 ‘전령’을 택했습니다.
- source_word: עָלֶיהָ
  english_pob_choice: against her
  chosen_korean: 그 나라를
  alternatives_korean:
  - 그것을
  - 에돔을
  lexicon: HALOT
  rationale: 히브리어는 에돔을 여성 단수 대명사로 가리키지만 한국어에서는 성 구분을 살릴 수 없어, 대상이 에돔이라는 점을 자연스럽게 드러내는 ‘그 나라’를 사용했습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: for battle
  chosen_korean: 치러 올라가자
  alternatives_korean:
  - 전쟁하러 가자
  - 싸우러 올라가자
  lexicon: HALOT
  rationale: 전쟁의 목적을 단순 명사로 두기보다, 군사적 소집의 동작을 살려 한국어 관용에 맞는 ‘치러 올라가자’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 신명기적 이름 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 학술적 음역인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 첫 사람 복수의 주체
  chosen_reading: ‘우리가’와 ‘우리’의 주체를 특정하지 않고 그대로 유지
  alternative_readings:
  - 예언자적 편집의 우리
  - 천상 회의의 우리
  - 열방의 화자
  rationale: 히브리어는 ‘우리가 들었습니다’와 ‘우리가 올라가자’의 화자를 명시하지 않으므로, 해석으로 좁히지 않고 복수형의 불확실성을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
