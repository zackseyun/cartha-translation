id: OBA.1.3
reference: Obadiah 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זְד֤וֹן לִבְּ/ךָ֙ הִשִּׁיאֶ֔/ךָ שֹׁכְנִ֥י בְ/חַגְוֵי סֶּ֖לַע מְר֣וֹם שִׁבְתּ֑/וֹ אֹמֵ֣ר בְּ/לִבּ֔/וֹ מִ֥י יוֹרִדֵ֖/נִי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/003.yaml
  text: The pride of your heart has deceived you[a], you who dwell in the clefts of the rock, whose dwelling is on high, who say in your heart[c][b], “Who will bring me down to the ground?”
  footnotes:
  - marker: a
    text: Or 'arrogance' or 'presumption' for 'pride.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the fissures of the rock.' The phrase evokes rocky strongholds and defensible cliff dwellings.
    reason: cultural_note
  - marker: c
    text: Or 'to the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 마음의 교만[a]이 너를 속였습니다. 너는 바위 틈[b]에 거하며 높은 곳에 거처를 두고, 마음속으로 “누가 나를 땅에[c] 끌어내리겠느냐?”라고 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오만’ 또는 ‘자만’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바위 틈’은 바위의 갈라진 틈이나 피난처를 가리키는 표현으로, 에돔의 험한 절벽 거처를 떠올리게 합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘땅으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְדוֹן
  english_pob_choice: pride
  chosen_korean: 교만
  alternatives_korean:
  - 오만
  - 자만
  - 거만
  lexicon: HALOT
  rationale: זְדוֹן은 단순한 감정이 아니라 자기확신으로 부풀어 오른 교만과 거만함을 가리키므로, 예언적 책망의 뉘앙스를 살려 ‘교만’으로 옮겼습니다.
- source_word: לִבְּךָ
  english_pob_choice: your heart
  chosen_korean: 네 마음
  alternatives_korean:
  - 네 심장
  - 네 속마음
  - 네 중심
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 내면 전체를 가리키는 관용어이므로, 한국어에서도 자연스럽게 내적 자만을 드러내는 ‘네 마음’으로 옮겼습니다.
- source_word: בְחַגְוֵי סֶּלַע
  english_pob_choice: in the clefts of the rock
  chosen_korean: 바위 틈에
  alternatives_korean:
  - 바위의 틈에
  - 절벽의 갈라진 틈에
  - 바위의 은신처에
  lexicon: HALOT
  rationale: חַגְוֵי는 바위의 갈라진 틈, 숨을 곳을 뜻하므로, 에돔의 난공불락한 산악 거처 이미지를 살려 ‘바위 틈’으로 압축해 옮겼습니다.
- source_word: מְרוֹם שִׁבְתּוֹ
  english_pob_choice: whose dwelling is on high
  chosen_korean: 거처를 높은 곳에 두고
  alternatives_korean:
  - 거주지가 높은 곳에 있고
  - 살림이 높은 데 있고
  - 거처가 높은 곳에 있으며
  lexicon: HALOT
  rationale: 직역하면 ‘그의 거처의 높음’이지만, 문맥상 높은 곳에 자리한 주거지를 뜻하므로 한국어에서 자연스러운 서술로 풀어 ‘거처를 높은 곳에 두고’라고 했습니다.
- source_word: אֹמֵר בְּלִבּוֹ
  english_pob_choice: who say in your heart
  chosen_korean: 마음속으로 말하기를
  alternatives_korean:
  - 네 마음속으로 말하며
  - 마음속으로 말하는 너는
  - 그 마음속으로 말하기를
  lexicon: HALOT
  rationale: 히브리어는 집합적 2인칭 대상에 대한 내적 독백을 가리키므로, 직접화법의 힘을 살리되 한국어 문장 흐름에 맞게 ‘마음속으로 말하기를’로 옮겼습니다.
- source_word: אָרֶץ
  english_pob_choice: to the ground
  chosen_korean: 땅에
  alternatives_korean:
  - 지면에
  - 땅바닥에
  - 땅으로
  lexicon: HALOT
  rationale: 여기서는 높은 거처와 대비되는 낮아짐을 가리키므로, 자연스럽고 간결한 ‘땅에’로 옮겨 수직적 대비를 살렸습니다.
theological_decisions:
- issue: 2인칭 직접 호칭과 3인칭 형태의 혼합
  chosen_reading: 예언자적 호칭을 따라 전체를 ‘너’ 중심의 직접 خطاب으로 정리했습니다.
  alternative_readings:
  - ‘거하는 자, 그의 거처, 그의 마음’처럼 3인칭을 더 가깝게 보존하는 읽기
  rationale: 히브리어는 2인칭과 3인칭 형태가 섞이지만, 대상은 일관되게 에돔에게 향한 책망이므로 한국어에서는 직접 호칭을 유지하는 편이 예언의 공격성과 응집성을 더 잘 드러냅니다.
  doctrine_reference: 예언서의 수사적 직접 خطاب과 집합적 단수 사용
