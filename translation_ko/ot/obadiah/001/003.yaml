revisions:
- from: 네 마음의 교만이 너를 속였습니다. 너는 바위 틈에 거하며, 거처를 높은 곳에 두고, 마음속으로 말하기를 “누가 나를 땅에 끌어내리겠느냐?” 하였습니다.[a][b][c]
  to: 네 마음의 교만[a]이 너를 속였습니다. 너는 바위 틈[b]에 거하며 높은 곳에 거처를 두고, 마음속으로 “누가 나를 땅에[c] 끌어내리겠느냐?”라고 말합니다.
  rationale: 원문의 완료형인 ‘너를 속였다’는 유지하고, 이어지는 분사형 거주·발언 묘사는 현재형 ‘거하며… 말합니다’로 바로잡았습니다. 또한 각주 표지를 해당 단어에 직접 붙였습니다. 2인칭 집합적 호칭은 한국어에서도 ‘너’로 유지하여 원문의 예언자적 직접 책망을 보존했습니다.
