source:
  edition: WLC
  text: אַל תָּב֤וֹא בְ/שַֽׁעַר עַמִּ/י֙ בְּ/י֣וֹם אֵידָ֔/ם אַל תֵּ֧רֶא גַם אַתָּ֛ה בְּ/רָעָת֖/וֹ בְּ/י֣וֹם אֵיד֑/וֹ וְ/אַל תִּשְׁלַ֥חְנָה בְ/חֵיל֖/וֹ בְּ/י֥וֹם אֵידֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/013.yaml
  text: Do not enter the gate of my people in the day of their disaster[a]; do not look on his calamity, even you, in the day of his disaster[b]; and do not lay hands on his wealth in the day of his disaster.
  footnotes:
  - marker: a
    text: Or 'look on'; the Hebrew verb is literally 'see,' but here likely carries the sense of looking with malicious satisfaction.
    reason: lexical_alternative
  - marker: b
    text: Or 'his army,' 'his strength,' or 'his resources'; the Hebrew word can denote military force or wealth. Here it is rendered 'wealth' because the context is plundering after disaster.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 백성의 성문으로 그 재앙의 날에 들어가지 말라[a]; 그 재난을 보지 말라—바로 너도—그 재난의 날에; 그 재난의 날에 그의 재산에 손을 대지 말라[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 재난을 보며 만족해하지 말라’의 뜻일 수 있습니다. 히브리어 동사는 문자적으로 ‘보다’이지만, 여기서는 적대적 조롱이나 관망의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 군대’, ‘그의 힘’, ‘그의 자원’일 수 있습니다. 문맥상 약탈을 가리키므로 여기서는 ‘재산’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבֹוא בְשַׁעַר עַמִּי
  english_pob_choice: enter the gate of my people
  chosen_korean: 내 백성의 성문으로 들어가지 말라
  alternatives_korean:
  - 내 백성의 문으로 들어가지 말라
  - 내 백성의 성문에 들어가지 말라
  lexicon: HALOT
  rationale: שַׁעַר는 단순한 문이 아니라 성읍의 출입문이자 공동체의 경계이므로, ‘성문’으로 옮겨 구체적 이미지를 살렸습니다.
- source_word: בְּיוֹם אֵידָם
  english_pob_choice: in the day of their disaster
  chosen_korean: 그 재앙의 날
  alternatives_korean:
  - 그 재난의 날
  - 그 환난의 날
  lexicon: HALOT
  rationale: אֵיד는 재앙/재난의 의미이므로, 문맥의 반복 효과를 살려 ‘재앙’으로 옮겼습니다.
- source_word: תֵּרֶא
  english_pob_choice: do not look on
  chosen_korean: 보지 말라
  alternatives_korean:
  - 쳐다보지 말라
  - 바라보지 말라
  - 그 모습을 보며 즐기지 말라
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘보다’이지만, 여기서는 적대적 상황을 관망하거나 즐겨 보는 태도를 금지하는 말이므로 기본 의미를 유지하되 문맥상 냉담한 관찰의 뉘앙스를 살렸습니다.
- source_word: בְרָעָתוֹ
  english_pob_choice: his calamity
  chosen_korean: 그 재난
  alternatives_korean:
  - 그 재앙
  - 그 불행
  - 그 환난
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 당한 재난을 가리키므로, 앞뒤 반복어와 맞추어 ‘재난’으로 일관되게 표현했습니다.
- source_word: תִּשְׁלַחְנָה בְחֵילוֹ
  english_pob_choice: do not lay hands on his wealth
  chosen_korean: 그 재산에 손을 대지 말라
  alternatives_korean:
  - 그 재물에 손을 대지 말라
  - 그 재산을 빼앗지 말라
  - 그 군대에 손을 대지 말라
  lexicon: HALOT
  rationale: חֵיל은 군사력/재물/재산 범위를 가지지만, 문맥이 약탈 금지이므로 ‘재산’으로 옮겨 침탈 행위를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 대상 지시어의 복수-단수 전환
  chosen_reading: ‘그들의 재앙’과 ‘그 재난/그의 재산’의 차이를 그대로 살렸습니다.
  alternative_readings:
  - 전부 복수로 통일
  - 전부 단수로 통일
  rationale: 히브리어는 처음에는 집단을, 뒤에서는 인격화된 민족을 가리키는 듯한 단수 표현으로 옮겨가므로, 그 수적 전환을 매끄럽게 지우지 않는 편이 본문의 수사에 더 충실합니다.
  doctrine_reference: 'Translation philosophy #3, #5'
