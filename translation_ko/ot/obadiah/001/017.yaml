  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/הַ֥ר צִיּ֛וֹן תִּהְיֶ֥ה פְלֵיטָ֖ה וְ/הָ֣יָה קֹ֑דֶשׁ וְ/יָֽרְשׁוּ֙ בֵּ֣ית יַֽעֲקֹ֔ב אֵ֖ת מוֹרָֽשֵׁי/הֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/017.yaml
  text: But on Mount Zion there will be deliverance[a], and it will be holy[c][b], and the house of Jacob will possess their possessions.
  footnotes:
  - marker: a
    text: Or "there will be survivors"; the Hebrew noun can denote either deliverance/escape or those who escape.
    reason: lexical_alternative
  - marker: b
    text: Or "will inherit their inheritance."
    reason: lexical_alternative
  - marker: c
    text: Possibly, "the house of Jacob will dispossess those who dispossessed them," if the final term is taken in an agentive sense.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 시온 산에는 구원이 있을 것이며[a], 시온 산은 거룩할 것입니다[c]. 야곱의 집은 그들의 소유를 차지할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “피하여 살아남은 자들이 있을 것이다”; 히브리어 명사는 구원이나 피함, 또는 피하여 살아남은 자들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들의 기업을 상속할 것이다.”
    reason: lexical_alternative
  - marker: c
    text: 일부는 마지막 말을 행위자적 의미로 보아, “야곱의 집이 자신들의 소유를 빼앗은 자들을 내쫓을 것이다”로 이해하기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְ/הַר צִיּוֹן
  english_pob_choice: But on Mount Zion
  chosen_korean: 시온 산에는
  alternatives_korean:
  - 그러나 시온 산에는
  - 시온 산 위에는
  lexicon: HALOT
  rationale: 히브리어 תחילית וּ는 앞절과의 강한 대조를 이루므로 ‘그러나’로 자연스럽게 살렸고, מקום 표현은 표준적 ‘시온 산’으로 옮겼습니다.
- source_word: פְלֵיטָה
  english_pob_choice: deliverance
  chosen_korean: 구원
  alternatives_korean:
  - 피난
  - 살아남은 자들
  - 피하여 살아남음
  lexicon: HALOT
  rationale: 이 명사는 ‘도피/탈출’과 그 결과인 ‘구원/생존’의 의미를 함께 가질 수 있으므로, 시온에 임할 종말론적 회복을 넓게 담는 ‘구원’으로 옮겼습니다.
- source_word: וְ/הָיָה קֹדֶשׁ
  english_pob_choice: and it will be holy
  chosen_korean: 거룩하게 될 것입니다
  alternatives_korean:
  - 거룩할 것입니다
  - 거룩함이 될 것입니다
  - 거룩한 곳이 될 것입니다
  lexicon: HALOT
  rationale: 문맥상 시온 산을 가리키는 서술로 보고, 현대 한국어에서 자연스럽고도 상태 변화를 잘 드러내는 ‘거룩하게 될 것입니다’로 옮겼습니다.
- source_word: מוֹרָשֵׁי/הֶם
  english_pob_choice: their possessions
  chosen_korean: 자기들의 소유
  alternatives_korean:
  - 그들의 기업
  - 그들의 상속 재산
  - 그들을 빼앗은 자들
  lexicon: HALOT
  rationale: 모라셰는 문맥에 따라 ‘소유/기업/상속 재산’이 될 수 있는데, 여기서는 회복된 소유권을 가장 직접적으로 드러내는 ‘자기들의 소유’를 택했습니다.
theological_decisions:
- issue: פְלֵיטָה의 의미 범위
  chosen_reading: ‘구원’으로 옮겨 시온에 남을 사람들, 탈출, 그리고 회복된 구원의 상태를 함께 포괄하게 했습니다.
  alternative_readings:
  - ‘살아남은 자들’로 좁혀 번역할 수 있습니다.
  - ‘도피/탈출’의 행위를 전면에 둘 수도 있습니다.
  rationale: 히브리어는 결과 상태와 생존자 개념을 겹쳐 담을 수 있으므로, 한쪽으로만 좁히지 않고 예언적 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 재산 회복과 상속 어감
  chosen_reading: ‘자기들의 소유를 차지할 것입니다’로 회복과 점유의 현실성을 살렸습니다.
  alternative_readings:
  - ‘그들의 기업을 상속할 것입니다’
  - ‘그들의 소유를 유업으로 받을 것입니다’
  rationale: 원문은 단순한 영적 비유보다 실제적 회복을 말하므로, 법적·상속적 뉘앙스를 유지하되 현대어로는 ‘차지하다’가 가장 자연스럽습니다.
  doctrine_reference: Maintain source-directed concreteness without over-legalizing the Hebrew.
