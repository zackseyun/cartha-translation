  naturalness: ‘거룩하게 될 것입니다’도 가능하지만, 상태 서술인 ‘거룩할 것입니다’가 더 자연스럽습니다. ‘그리고’는 불필요하게 영어식 연결을 만들므로, 절을 나누어 예언문다운 간결한 문장으로 다듬었습니다.
  terminology: ‘시온 산’, ‘구원’, ‘야곱의 집’, ‘소유’는 적절합니다. 대안 독법 각주에서는 ‘빼앗은 자들을 빼앗을 것이다’라는 어색하고 의미가 불명확한 표현을 ‘내쫓을 것이다’로 바로잡아 dispossess의 문맥상 의미를 전달했습니다.
