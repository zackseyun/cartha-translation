id: OBA.1.19
reference: Obadiah 1:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָרְשׁ֨וּ הַ/נֶּ֜גֶב אֶת הַ֣ר עֵשָׂ֗ו וְ/הַ/שְּׁפֵלָה֙ אֶת פְּלִשְׁתִּ֔ים וְ/יָרְשׁוּ֙ אֶת שְׂדֵ֣ה אֶפְרַ֔יִם וְ/אֵ֖ת שְׂדֵ֣ה שֹׁמְר֑וֹן וּ/בִנְיָמִ֖ן אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/019.yaml
  text: Those of the Negev will possess the hill country of Esau[a], and those of the Shephelah the land of the Philistines; they will also possess the territory of Ephraim and the territory of Samaria[b], and Benjamin will possess Gilead.
  footnotes:
  - marker: a
    text: Hebrew 'the Philistines'; the translation renders the territorial sense explicitly as 'the land of the Philistines.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will inherit' throughout; the Hebrew verb can denote inheriting or taking possession of land.
    reason: lexical_alternative
translation:
  language: ko
  text: 남쪽 사람들이 에서의 산지를 차지하고, 세펠라 사람들은 블레셋 사람들의 땅을 차지하며, 또 그들이 에브라임의 들과 사마리아의 들을 차지하고, 베냐민은 길르앗을 차지할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 민족명 ‘블레셋 사람들’을 쓰지만, 여기서는 영토 의미를 분명히 하기 위해 ‘블레셋 사람들의 땅’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ירשׁ는 문맥에 따라 ‘상속받다’ 또는 ‘차지하다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְשׁוּ
  english_pob_choice: will possess
  chosen_korean: 차지할 것입니다
  alternatives_korean:
  - 소유할 것입니다
  - 상속받을 것입니다
  - 점유할 것입니다
  lexicon: HALOT
  rationale: ירשׁ는 토지 문맥에서 ‘소유하다/차지하다/상속받다’의 폭이 있으므로, 전쟁·회복 맥락을 모두 담을 수 있는 ‘차지하다’로 옮겼습니다.
- source_word: הַנֶּגֶב
  english_pob_choice: those of the Negev
  chosen_korean: 남쪽 사람들
  alternatives_korean:
  - 네겝 사람들
  - 네겝의 사람들
  - 남쪽
  lexicon: HALOT
  rationale: 문맥상 지명이 주어를 대표하는 메토님이므로 ‘남쪽 사람들’로 풀어, 지역명과 그 거주민을 함께 드러냈습니다.
- source_word: הַר עֵשָׂו
  english_pob_choice: the hill country of Esau
  chosen_korean: 에서의 산지
  alternatives_korean:
  - 에서의 산악지대
  - 에서의 산들
  - 에돔의 산지
  lexicon: HALOT
  rationale: הַר은 단일 산보다 산지/산악 지역을 가리키는 경우가 많으므로, 에서와 연결된 산지라는 지리적 의미를 살려 ‘에서의 산지’로 옮겼습니다.
- source_word: פְּלִשְׁתִּים
  english_pob_choice: the land of the Philistines
  chosen_korean: 블레셋 사람들의 땅
  alternatives_korean:
  - 블레셋 땅
  - 블레셋 사람들
  - 블레셋 지역
  lexicon: HALOT
  rationale: 히브리어는 민족명을 쓰지만, 정복 대상은 영토이므로 POB의 해석을 따라 ‘블레셋 사람들의 땅’으로 명시했습니다.
theological_decisions:
- issue: 지리·민족 표기의 메토님 보존
  chosen_reading: 지역명/민족명을 한국어로 풀어, 땅을 차지하는 회복·역전의 예언임을 분명히 했습니다.
  alternative_readings:
  - 지명만 직역해 단순한 목록처럼 보이게 하는 읽기
  - 민족명을 모두 지명으로만 바꾸는 읽기
  rationale: 이 절은 단순한 지리 목록이 아니라 이스라엘의 회복과 주변 민족 영토의 역전이라는 예언적 선언이므로, 메토님을 풀어 의미를 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 예언서의 회복과 심판의 지리적 상징성
- issue: 차지하다의 동사 선택
  chosen_reading: ‘차지하다’로 번역해 상속과 정복의 양면적 뉘앙스를 유지했습니다.
  alternative_readings:
  - 상속받다
  - 소유하다
  - 점유하다
  rationale: ירשׁ는 단순 소유보다 ‘상속으로 받음’과 ‘정복하여 차지함’을 함께 품을 수 있어, 문맥의 예언적 역동성을 살리는 표현을 택했습니다.
  doctrine_reference: 토지 약속과 회복의 언어
