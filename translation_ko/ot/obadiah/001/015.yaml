    text: 또는 ‘모든 민족들을 향하여’. 전치사 עַל은 심판의 방향이 민족들을 향한다는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 갚음’ 또는 ‘네가 한 일’. 이 히브리어는 사람의 행위에 상응하여 그에게 되돌아오는 갚음, 또는 그 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision replaces an unidiomatic literalism with a natural Korean construction that retains the source’s imminent, judgment-oriented relation to all nations. It also moves footnote b to its proper lexical anchor and corrects its alternative glosses without altering the verse’s meaning or resolving its stated interpretive ambiguity.
