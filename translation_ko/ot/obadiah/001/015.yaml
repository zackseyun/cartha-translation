  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי קָר֥וֹב יוֹם יְהוָ֖ה עַל כָּל הַ/גּוֹיִ֑ם כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ יֵעָ֣שֶׂה לָּ֔/ךְ גְּמֻלְ/ךָ֖ יָשׁ֥וּב בְּ/רֹאשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/015.yaml
  text: For the day of Yahweh is near upon all the nations[a]. As you have done, it will be done to you[b]; your recompense will return on your own head.
  footnotes:
  - marker: a
    text: Or 'against all the nations.' The preposition can mark judgment directed toward the nations.
    reason: lexical_alternative
  - marker: b
    text: Or 'your repayment' or 'your dealing.' The Hebrew term refers to what comes back to a person in response to his actions.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼의 날이 모든 민족들 위에 가까이 왔기 때문입니다[a]. 네가 행한 대로 네게도 행해질 것이며[b], 네 보응이 네 머리 위로 돌아갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 민족들을 향하여’. 전치사 עַל은 심판의 방향이 민족들을 향한다는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네 갚음’이나 ‘네 처분’. 이 히브리어는 사람의 행위에 상응하여 되돌아오는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 … 입니다
  - …이기 때문입니다
  lexicon: HALOT
  rationale: 앞 절과의 인과·설명 관계를 자연스러운 현대 한국어로 드러내면서도, 예언적 선언의 단정성을 유지하기 위해 ‘이는 … 때문입니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 신적 호칭이 아니라 고유한 언약 이름이라는 점을 보존했습니다.
- source_word: עַל כָּל הַגּוֹיִם
  english_pob_choice: upon all the nations
  chosen_korean: 모든 민족들 위에
  alternatives_korean:
  - 모든 민족들에 대해
  - 모든 민족들을 향해
  lexicon: HALOT
  rationale: עַל의 방향성·임박한 심판 대상이라는 뉘앙스를 살리기 위해 ‘위에’로 옮겼고, ‘민족들’은 עמים/גוים의 집합적 대상을 자연스럽게 반영합니다.
- source_word: גְּמֻלְךָ
  english_pob_choice: your recompense
  chosen_korean: 네 보응
  alternatives_korean:
  - 네 갚음
  - 네 보상
  - 네 대가
  lexicon: HALOT
  rationale: 행위에 대한 되돌림이라는 보응/응보의 의미를 살리기 위해 ‘보응’을 택했습니다. ‘보상’은 긍정적 뉘앙스가 강해 문맥에 덜 맞습니다.
theological_decisions:
- issue: 우주적 심판 범위와 에돔 직접 대면의 긴장
  chosen_reading: 본문은 ‘모든 민족들’에 대한 야훼의 날을 선포하면서도, 곧바로 에돔에게 직접적인 보응 선언을 적용합니다.
  alternative_readings:
  - 에돔만을 가리키는 국지적 심판으로 축소하는 읽기
  - 모든 민족에 대한 보편적 선언만으로 에돔 직접성을 희석하는 읽기
  rationale: 한국어 본문도 ‘모든 민족들 위에’와 ‘네게도 행해질 것’의 병치를 그대로 살려, 심판의 보편성과 에돔에 대한 직접 적용을 둘 다 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it'
