id: OBA.1.8
reference: Obadiah 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֛וֹא בַּ/יּ֥וֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/הַאֲבַדְתִּ֤י חֲכָמִים֙ מֵֽ/אֱד֔וֹם וּ/תְבוּנָ֖ה מֵ/הַ֥ר עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/obadiah/001/008.yaml
  text: Will I not[a], on that day, declares Yahweh, destroy the wise men from Edom, and understanding from the mountain of Esau?
  footnotes:
  - marker: a
    text: Or 'from Mount Esau' or 'from the hill country of Esau.' The Hebrew literally reads 'from the mountain of Esau.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 내가 에돔에서 지혜로운 자들을 멸하고, 에서의 산에서 분별력을 없애지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘에서의 산’입니다. 문맥상 ‘에서의 산지’ 또는 ‘에돔의 산악 지대’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Will I not
  chosen_korean: …하지 않겠습니까?
  alternatives_korean:
  - …하지 않겠습니까
  - 참으로 …할 것입니다
  lexicon: HALOT
  rationale: 수사적 질문으로서 긍정의 답을 기대하는 표현이므로, 한국어에서도 의문형을 살려 예언적 반어를 유지했습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날에
  - 그날
  lexicon: HALOT
  rationale: 히브리어 관용적 시간 표현을 자연스러운 현대 한국어로 옮기되, 종말론적 심판의 특정성을 살렸습니다.
- source_word: חֲכָמִים
  english_pob_choice: the wise men
  chosen_korean: 지혜로운 자들
  alternatives_korean:
  - 지혜로운 사람들
  - 현자들
  lexicon: HALOT
  rationale: 히브리어 남성 복수형의 인칭성을 살리면서도 현대 한국어에서 과도하게 성별을 드러내지 않는 표현으로 옮겼습니다. '현자들'은 의미는 맞지만 다소 고전적입니다.
- source_word: תְבוּנָה
  english_pob_choice: understanding
  chosen_korean: 분별력
  alternatives_korean:
  - 이해
  - 통찰
  lexicon: HALOT
  rationale: 추상명사 תְבוּנָה는 단순 지식보다 판단하고 구별하는 능력을 가리키므로, 문맥상 자연스러운 '분별력'을 선택했습니다.
- source_word: מֵהַר עֵשָׂו
  english_pob_choice: from the mountain of Esau
  chosen_korean: 에서의 산에서
  alternatives_korean:
  - 에서의 산에서
  - 에서의 산에서부터
  - 에서의 산
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지를 유지해 '산(山)'을 살렸고, 지리적 배경인 에돔의 시적 별칭으로서 '에서의 산'을 보존했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신적 발화를 표시하는 יְהוָה는 고유명사로서 '야훼'를 사용해 전통적 대체표현보다 원어의 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언 선포문의 어조
  chosen_reading: 의문형 수사 질문을 유지했습니다.
  alternative_readings:
  - 평서형 선포로 바꾸기
  - 강한 단정형으로 완화하기
  rationale: הֲלֹוא는 단순 진술이 아니라 심판 선언의 확실성을 드러내는 수사적 질문이므로, 한국어도 질문형으로 남겨 원문의 압박감을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §2: Preserve rhetorical force'
