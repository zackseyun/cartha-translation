base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
  footnotes:
  - marker: a
    text: Or, 'my soul will be filled with them,' that is, 'I will have my fill of them.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'my hand will destroy them' or 'drive them out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 적군이 말했습니다[a]. ‘나는 추격하겠습니다. 따라잡겠습니다. 전리품을 나누겠습니다. 내 욕망은 그들 위에서 채워질 것입니다. 내 칼을 뽑겠습니다[b]. 내 손이 그들을 빼앗겠습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 영혼이 그들로 채워질 것이다’, 곧 ‘나는 그들로 배불리 만족할 것이다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 손이 그들을 멸하겠다’ 혹은 ‘그들을 몰아내겠다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר / אוֹיֵב
  english_pob_choice: The enemy said
  chosen_korean: 적군이 말했습니다
  alternatives_korean:
  - 원수가 말했습니다
  - 적이 말했습니다
  lexicon: HALOT
  rationale: אוֹיֵב은 대표적 단수이지만 문맥상 이스라엘을 추격하는 대적 집단을 가리키므로, 군사적 뉘앙스를 살린 ‘적군’으로 옮겼습니다.
- source_word: אֶרְדֹּף / אַשִּׂיג
  english_pob_choice: I will pursue, I will overtake
  chosen_korean: 나는 추격하겠습니다. 따라잡겠습니다.
  alternatives_korean:
  - 나는 뒤쫓겠습니다. 붙잡겠습니다.
  - 나는 추적하겠습니다. 따라잡겠습니다.
  lexicon: HALOT
  rationale: 두 동사는 연속된 전투 추격의 호언으로, ‘추격하다/따라잡다’가 원문의 진행과 긴박감을 가장 자연스럽게 드러냅니다.
- source_word: אֲחַלֵּק שָׁלָל
  english_pob_choice: I will divide the spoil
  chosen_korean: 전리품을 나누겠습니다
  alternatives_korean:
  - 노획물을 나누겠습니다
  - 약탈물을 나누겠습니다
  lexicon: HALOT
  rationale: 전쟁의 전리품을 가리키는 관용구이므로, 한국어에서 가장 분명한 ‘전리품’으로 옮겼습니다.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  english_pob_choice: my desire will be satisfied on them
  chosen_korean: 내 욕망은 그들 위에서 채워질 것입니다
  alternatives_korean:
  - 내 마음은 그들로 채워질 것입니다
  - 내 영혼은 그들로 채워질 것입니다
  - 그들로 인해 내가 흡족할 것입니다
  lexicon: HALOT
  rationale: נֶפֶשׁ의 감각적·충동적 욕구를 살려 ‘욕망’으로 옮겼고, POB의 호전적 의미를 유지하기 위해 ‘채워질 것입니다’로 처리했습니다.
- source_word: אָרִיק חַרְבִּי
  english_pob_choice: I will draw my sword
  chosen_korean: 내 칼을 뽑겠습니다
  alternatives_korean:
  - 내 칼을 빼겠습니다
  - 내 칼을 꺼내겠습니다
  lexicon: HALOT
  rationale: ריק의 관용적 용법은 무기를 ‘뽑다/빼다’는 뜻이므로, 현대 한국어에서 가장 직관적인 ‘뽑겠습니다’를 선택했습니다.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  english_pob_choice: my hand will dispossess them
  chosen_korean: 내 손이 그들을 빼앗겠습니다
  alternatives_korean:
  - 내 손이 그들을 몰아내겠습니다
  - 내 손이 그들을 쫓아내겠습니다
  - 내 손이 그들을 없애겠습니다
  lexicon: HALOT
  rationale: ירשׁ의 핵심은 단순 파괴보다 점유권을 빼앗아 차지하는 데 있으므로, ‘빼앗다’가 가장 압축적으로 그 의미를 전달합니다.
theological_decisions:
- issue: 적군의 자기과시적 독백의 직설성
  chosen_reading: 문맥의 폭력성과 오만을 누그러뜨리지 않고, 적군의 호전적 계획을 그대로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘승리하겠다’로 순화
  - 일반적인 ‘이기겠다’로 축약
  rationale: 노래 문맥에서 이 절은 공격자의 탐욕과 폭력을 강조하므로, 의미를 약화시키는 순화는 피했습니다.
  doctrine_reference: 출애굽기 15장의 승리 찬양과 심판 서사
