  source_fidelity: 첫째 행에는 히브리어의 호격 יהוה가 빠져 있고, 둘째 행에만 ‘야훼여’를 넣은 현재 배치는 두 절의 병행 구조를 바꿉니다. 각 행의 יְהוָה를 각각 ‘야훼여’로 옮겨야 합니다. 또한 ‘주의 오른손’은 יהוה를 ‘주’라는 칭호로 대체하므로, 본문 방침과 원문에 맞게 ‘야훼의 오른손’으로 고쳐야 합니다.
  naturalness: ‘야훼여, 야훼의 오른손은 …’이라는 어순은 현대 표준 한국어의 격조 있는 찬양시 문체에 자연스럽고, 두 행의 반복을 명료하게 보존합니다. ‘산산이 부수십니다’도 자연스럽습니다.
  terminology: יהוה는 일관되게 ‘야훼’로, יָמִין은 ‘오른손’으로, נֶאְדָּרִי בַּכֹּחַ는 ‘권능 가운데 장엄하십니다’로, תִּרְעַץ는 강도를 유지하여 ‘산산이 부수십니다’로 옮깁니다. ‘원수’는 집합적 단수로 가능한 번역입니다.
