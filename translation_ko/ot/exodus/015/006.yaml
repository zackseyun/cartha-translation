translation:
  language: ko
  text: 주의 오른손이 권능으로 장엄하십니다. 주의 오른손이, 야훼여, 원수를 산산이 부수십니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 'YHWH'; 전통적으로는 ‘주’로 옮깁니다.
    reason: source_note
  - marker: b
    text: 또는 ‘힘으로 장엄하십니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘원수를 부수십니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִינְךָ
  english_pob_choice: your right hand
  chosen_korean: 주의 오른손
  alternatives_korean:
  - 주의 오른손편
  - 주의 오른편
  lexicon: HALOT
  rationale: יָמִין은 문자적으로 ‘오른손/오른쪽’을 뜻하므로, 구체적 이미지를 살려 ‘오른손’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: O Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 신명기를 포함한 본문 전반의 관례에 따라 여호와 대신 하나님의 고유명 ‘야훼’를 사용했고, 호격은 문맥상 생략하지 않고 앞뒤 구문으로 보존했습니다.
- source_word: נֶאְדָּרִי בַּכֹּחַ
  english_pob_choice: is majestic in power
  chosen_korean: 권능으로 장엄하십니다
  alternatives_korean:
  - 힘으로 장엄하십니다
  - 권능 안에서 장엄하십니다
  - 권능이 장엄하십니다
  lexicon: HALOT
  rationale: נֶאְדָּר는 ‘장엄하다/영광스럽다’의 의미이고, בַּכֹּחַ는 수단·영역의 ב로 ‘권능으로’가 자연스럽습니다. ‘장엄하다’가 본문의 시적 위엄을 가장 잘 살립니다.
- source_word: תִּרְעַץ
  english_pob_choice: shatters
  chosen_korean: 산산이 부수십니다
  alternatives_korean:
  - 짓부수십니다
  - 으깨십니다
  - 부수십니다
  lexicon: HALOT
  rationale: רָעַץ의 강한 파괴 의미를 살리되, 시적이고 한국어에 자연스러운 ‘산산이 부수다’로 옮겼습니다.
- source_word: אוֹיֵב
  english_pob_choice: the enemy
  chosen_korean: 원수
  alternatives_korean:
  - 적
  - 원수들
  - 적군
  lexicon: HALOT
  rationale: 단수형이지만 집합적으로 쓰일 수 있어, 출애굽기 맥락의 대적을 가리키는 표준적 한국어 표현 ‘원수’를 사용했습니다.
theological_decisions:
- issue: יהוה를 한국어 본문에서 어떻게 호칭할지
  chosen_reading: 호격을 보존해 ‘야훼’로 직접 부르며, 시편적 찬양의 직접 호칭을 살렸습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 하나님의 이름을 직접 부르며 찬양하는 시구이므로, 대체 칭호보다 고유명 사용이 स्रोत의 힘을 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
