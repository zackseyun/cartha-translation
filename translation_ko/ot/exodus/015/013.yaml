source:
  edition: WLC
  text: נָחִ֥יתָ בְ/חַסְדְּ/ךָ֖ עַם ז֣וּ גָּאָ֑לְתָּ נֵהַ֥לְתָּ בְ/עָזְּ/ךָ֖ אֶל נְוֵ֥ה קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
  footnotes:
  - marker: a
    text: Or 'this people whom you redeemed.'
    reason: lexical_alternative
  - marker: b
    text: '''Your holy dwelling'' may refer broadly to the place of God''s holy presence; interpreters variously understand it as Sinai, the promised land, or Zion/temple.'
    reason: alternative_reading
translation:
  language: ko
  text: 주께서는 주의 한결같은 사랑으로 주께서 속량하신 백성[a]을 인도하셨으며, 주의 능력으로 그들을 주의 거룩한 처소[b]로 이끄셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께서 속량하신 이 백성’.
    reason: lexical_alternative
  - marker: b
    text: ‘주의 거룩한 처소’는 하나님의 거룩한 임재의 장소를 넓게 가리킬 수 있으며, 시내산, 약속의 땅, 시온 또는 성전으로 다양하게 이해됩니다.
    reason: theological_note
lexical_decisions:
- source_word: נָחִיתָ
  english_pob_choice: you have led
  chosen_korean: 인도하셨으며
  alternatives_korean:
  - 이끄셨으며
  - 인도하셨습니다
  lexicon: HALOT
  rationale: 출애굽 맥락에서 하나님이 백성을 앞으로 데려가시는 뜻을 살리기 위해 ‘인도하다’를 택했고, 앞절의 동사 반복을 피하면서도 시적 흐름을 유지하기 위해 연결형으로 두었습니다.
- source_word: בְחַסְדְּךָ
  english_pob_choice: in your steadfast love
  chosen_korean: 주의 한결같은 사랑으로
  alternatives_korean:
  - 주의 신실한 사랑으로
  - 주의 인자하심으로
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 충실성과 사랑의 뉘앙스를 함께 살리기 위해 ‘한결같은 사랑’을 사용했습니다. 전치사 ב는 여기서 수단/근거의 뉘앙스로 자연스럽게 ‘-으로’로 옮겼습니다.
- source_word: גָּאָלְתָּ
  english_pob_choice: you redeemed
  chosen_korean: 속량하신
  alternatives_korean:
  - 구속하신
  - 되찾으신
  lexicon: HALOT
  rationale: גאל은 속량·구속의 구원 행위를 가리키므로, 성경적·법정적 울림을 유지하는 ‘속량하다’를 택했습니다. 현재완료적 회고를 한국어에서는 관형형으로 자연스럽게 반영했습니다.
- source_word: נְוֵה קָדְשֶׁךָ
  english_pob_choice: your holy dwelling
  chosen_korean: 주의 거룩한 처소
  alternatives_korean:
  - 주의 거룩한 거처
  - 주의 거룩한 dwelling
  lexicon: HALOT
  rationale: נָוֶה는 거주처/처소의 뜻을 가지며, 문맥상 하나님의 거룩한 임재의 장소를 넓게 가리키므로 ‘처소’가 가장 중립적이고 source-direct합니다. 영어 POB가 의도적으로 열어 둔 해석의 폭도 유지됩니다.
theological_decisions:
- issue: ‘주의 거룩한 처소’의 지시 대상
  chosen_reading: 산이나 가나안, 시온/성전 가운데 하나로 좁히지 않고, 하나님의 거룩한 임재의 처소를 넓게 가리키는 표현으로 남겼습니다.
  alternative_readings:
  - 시내산을 가리킨다는 해석
  - 약속의 땅을 가리킨다는 해석
  - 시온/성전을 예표하는 표현이라는 해석
  rationale: 히브리어 표현 자체가 장소를 단정하지 않으므로, 본문이 가진 신학적 긴장과 시적 압축을 보존하기 위해 해석을 확정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
