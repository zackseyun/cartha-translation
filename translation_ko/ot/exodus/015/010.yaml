  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָשַׁ֥פְתָּ בְ/רוּחֲ/ךָ֖ כִּסָּ֣/מוֹ יָ֑ם צָֽלֲלוּ֙ כַּֽ/עוֹפֶ֔רֶת בְּ/מַ֖יִם אַדִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
  footnotes:
  - marker: a
    text: Or 'with your breath.' The Hebrew word can mean 'wind,' 'breath,' or 'spirit'; here the sea-crossing context favors 'wind.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 주의 바람으로 불어오시니 바다가 그들을 덮었습니다. 그들은 무거운 납처럼 깊은 물 속으로 가라앉았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 숨으로’. 히브리어 רוּחַ는 ‘바람’, ‘숨’, ‘영’을 뜻할 수 있으며, 여기서는 바다를 가르는 문맥상 ‘바람’이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  english_pob_choice: you blew
  chosen_korean: 불어오시니
  alternatives_korean:
  - 불으셨습니다
  - 숨을 내쉬셨습니다
  - 불어오셨습니다
  lexicon: HALOT
  rationale: נשף는 ‘불다/숨쉬다’의 뜻이지만, 본문은 바다를 가르는 하나님의 행동을 시적으로 묘사하므로 ‘불어오시니’가 가장 자연스럽고 동작성을 살립니다.
- source_word: בְרוּחֲךָ
  english_pob_choice: with your wind
  chosen_korean: 주의 바람으로
  alternatives_korean:
  - 주의 숨으로
  - 주의 영으로
  lexicon: HALOT
  rationale: רוּחַ는 ‘바람/숨/영’이 가능하지만, 앞의 ‘불어오시니’와 결합될 때 물리적 바람의 이미지가 가장 직접적이어서 기본 본문은 ‘바람’으로 옮겼습니다.
- source_word: כִּסָּמוֹ יָם
  english_pob_choice: the sea covered them
  chosen_korean: 바다가 그들을 덮었습니다
  alternatives_korean:
  - 바다가 그들을 가렸습니다
  - 바다가 그들을 삼켰습니다
  lexicon: HALOT
  rationale: כסה의 기본 의미는 ‘덮다’이므로 이를 그대로 살려, 해석을 덧붙이지 않는 ‘덮었습니다’를 선택했습니다.
- source_word: צָלֲלוּ
  english_pob_choice: they sank
  chosen_korean: 가라앉았습니다
  alternatives_korean:
  - 잠겼습니다
  - 내려앉았습니다
  lexicon: HALOT
  rationale: 이 동사는 물속으로 아래로 가라앉는 움직임을 나타내므로, 현대 한국어에서 가장 명확한 ‘가라앉았습니다’가 적절합니다.
- source_word: כַּעוֹפֶרֶת
  english_pob_choice: like lead
  chosen_korean: 무거운 납처럼
  alternatives_korean:
  - 납처럼
  - 쇳덩이처럼
  lexicon: HALOT
  rationale: עוֹפֶרֶת은 금속 ‘납’이며, 시각적·촉각적 무게감을 살리기 위해 ‘무거운 납처럼’으로 자연스럽게 옮겼습니다.
- source_word: בְּמַיִם אַדִּירִים
  english_pob_choice: in mighty waters
  chosen_korean: 깊은 물 속으로
  alternatives_korean:
  - 힘센 물 속으로
  - 장엄한 물 속으로
  - 거센 물 속으로
  lexicon: HALOT
  rationale: אַדִּירִים는 ‘힘센/위대한/장엄한’의 뜻이지만, 이 비유문맥에서는 물의 압도적 깊이와 무게가 핵심이므로 한국어에서는 ‘깊은 물 속’이 가장 자연스럽게 대응합니다.
theological_decisions:
- issue: רוּחַ의 번역에서 ‘바람’과 ‘숨/영’ 중 어느 의미를 본문에 둘 것인가
  chosen_reading: 본문은 ‘바람’으로 두고, 히브리어의 다의성은 별도 주석으로 남기지 않았습니다.
  alternative_readings:
  - 숨
  - 영
  rationale: 출애굽기 15장의 해상 심판 장면에서는 자연현상으로서의 바람 이미지가 직접적이며, 직전 동사 ‘불어오시니’와도 긴밀히 결합됩니다. 따라서 본문은 과도한 신학화 없이 물리적 이미지를 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (theological tension should be preserved, not prematurely resolved)
