revisions:
- from: 주님께서 주의 바람으로 불어오시니 바다가 그들을 덮었습니다. 그들은 무거운 납처럼 깊은 물 속으로 가라앉았습니다.[a]
  to: 주께서 주의 바람으로 부시니, 바다가 그들을 덮었습니다. 그들은 납처럼 거센 물속에 가라앉았습니다.[a]
  rationale: The revision removes the added directional nuance in ‘불어오시니,’ avoids adding ‘무거운,’ and replaces the unsupported ‘깊은’ with ‘거센’ to represent the power implied by אַדִּירִים. It keeps the direct, poetic structure and preserves the רוּחַ ambiguity in a properly anchored footnote.
