    rationale: 히브리어 טֻבְּעוּ는 푸알 완료형 복수로, 이들이 물에 잠기게 되거나 가라앉게 된 것을 말합니다. ‘잠겼습니다’는 죽음의 방식으로 과도하게 좁히지 않으면서 이 이미지를 더 정확히 전달합니다.
