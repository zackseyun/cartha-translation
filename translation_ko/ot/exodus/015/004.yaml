  rationale: 이 구절은 교리 쟁점이라기보다 번역 전통의 문제이므로, 원어 의미를 우선한 직역을 본문에 두고 전통 용어는 독자 안내용 주석으로 처리하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy)
