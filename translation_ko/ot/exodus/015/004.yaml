base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
  footnotes:
  - marker: a
    text: Traditionally rendered “Red Sea.” The Hebrew reads “Sea of Reeds.”
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오의 병거들과 그의 군대를 바다에 던지셨으며, 그의 정예 장교들은 갈대 바다에 빠졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 “홍해”로 번역됩니다. 히브리어는 “갈대 바다”를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  english_pob_choice: chariots
  chosen_korean: 병거들
  alternatives_korean:
  - 전차들
  - 병거
  - 전차
  lexicon: HALOT
  rationale: 전쟁용 수레를 가리키는 구체적 의미를 살려 표준 성서어인 '병거'를 사용했습니다.
- source_word: וְחֵילוֹ
  english_pob_choice: and his army
  chosen_korean: 그의 군대
  alternatives_korean:
  - 그의 군사들
  - 그의 군세
  - 그의 병력
  lexicon: HALOT
  rationale: 문맥상 כוח/חיל의 군사적 집합을 가리키므로 '군대'가 가장 자연스럽고 분명합니다.
- source_word: טֻבְּעוּ
  english_pob_choice: were sunk
  chosen_korean: 빠졌습니다
  alternatives_korean:
  - 가라앉았습니다
  - 잠겼습니다
  - 물에 잠겼습니다
  lexicon: HALOT
  rationale: 수동형으로 바닷물에 잠겨 들어가는 이미지를 살리되, 죽음만을 직접 진술하는 표현은 피했습니다.
- source_word: בְיַם סוּף
  english_pob_choice: Sea of Reeds
  chosen_korean: 갈대 바다
  alternatives_korean:
  - 홍해
  - 붉은 바다
  lexicon: HALOT
  rationale: 히브리어의 직역 의미를 반영해 본문에는 '갈대 바다'를 두고, 전통 번역인 '홍해'는 주석에서 안내하는 편이 원문 우선 원칙에 맞습니다.
theological_decisions:
- issue: יַם סוּף의 본문 처리
  chosen_reading: 본문에는 '갈대 바다'를 사용했습니다.
  alternative_readings:
  - 홍해
  rationale: 이 구절은 교리 쟁점이라기보다 번역 전통의 문제이므로, 원어 의미를 우선한 직역을 본문에 두고 전통 용어는 독자 안내용 주석으로 처리하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy)
