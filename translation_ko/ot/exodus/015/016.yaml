revisions:
- from: 그들에게 공포와 두려움이 임하여, 야훼의 큰 팔로 말미암아 돌처럼 잠잠하리니, 당신의 백성이 지나갈 때까지, 야훼여, 당신이 소유하신 이 백성이 지나갈 때까지라.
  to: 그들에게 공포와 두려움이 덮칠 것이며, 주의 크신 팔의 위력으로 그들은 돌처럼 잠잠해질 것입니다[a]. 야훼여, 주의 백성이 지나갈 때까지[b], 주께서 얻으신[c] 이 백성이 지나갈 때까지 그러할 것입니다.
  rationale: The revision makes a safe register and idiom correction, preserves the Hebrew poetic repetition and the metaphor of Yahweh's arm, and renders קָנִיתָ as ‘얻으신’ rather than imposing a more specific redemption term. ‘그러할 것입니다’ completes the Korean syntax while referring back to the nations’ stone-like stillness until Israel passes by.
