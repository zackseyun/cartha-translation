  timestamp: '2026-07-13T12:42:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the central imagery, but it weakens the Hebrew's direct address and uses an unnatural possessive expression for קָנִיתָ. The proposed revision retains the repeated 'until ... passes by,' the arm metaphor, and the acquired-possession sense without importing 'redeemed.'
  naturalness: ‘당신의’ and ‘당신이 소유하신’ are less natural and less reverent in modern formal Korean biblical register. Using ‘주’ in direct address and ‘주께서 얻으신’ is idiomatic while maintaining the Hebrew relationship and parallelism.
  terminology: ‘야훼’ properly renders יהוה. ‘공포와 두려움,’ ‘크신 팔,’ ‘돌처럼 잠잠해지다,’ and ‘얻으신 이 백성’ faithfully represent the key terms. The footnotes are anchored to the relevant Korean expressions.
  issues:
  - severity: medium
    issue: The draft uses ‘당신의 백성’ and ‘당신이 소유하신’ in address to Yahweh.
    rationale: This is stylistically awkward in Korean formal biblical discourse, and ‘소유하신’ can sound objectifying. ‘주의 백성’ and ‘주께서 얻으신 이 백성’ are natural and retain the covenantal possession language of עַמְּךָ and קָנִיתָ.
  - severity: low
    issue: The draft lacks the lexical-alternative footnote anchors reflected in the audit trail.
    rationale: Anchoring notes at ‘잠잠해질 것입니다,’ the repeated ‘지나갈 때까지,’ and ‘얻으신’ preserves relevant lexical ambiguity for readers.
  revised_text: 그들에게 공포와 두려움이 덮칠 것이며, 주의 크신 팔의 위력으로 그들은 돌처럼 잠잠해질 것입니다[a]. 야훼여, 주의 백성이 지나갈 때까지[b], 주께서 얻으신[c] 이 백성이 지나갈 때까지 그러할 것입니다.
