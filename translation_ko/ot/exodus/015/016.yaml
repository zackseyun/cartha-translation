  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
  footnotes:
  - marker: a
    text: Or 'they will be silent' or 'they will be motionless' for 'they will be still.'
    reason: lexical_alternative
  - marker: b
    text: Or 'until your people cross over ... until this people whom you acquired cross over.'
    reason: lexical_alternative
  - marker: c
    text: '''You acquired'' may also be rendered ''you purchased'' or, in a broader covenantal sense, ''you made your own.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 공포와 두려움이 덮칠 것이며, 주의 크신 팔의 위력으로 그들은 돌처럼 잠잠해질 것입니다[a]. 야훼여, 주의 백성이 지나갈 때까지[b], 주께서 얻으신[c] 이 백성이 지나갈 때까지 그러할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말을 잃을 것입니다’ 또는 ‘움직이지 못할 것입니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 백성이 건너갈 때까지, 주께서 얻으신 이 백성이 건너갈 때까지’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘얻으신’은 ‘사신’ 또는 더 넓은 언약적 의미에서 ‘자기 것으로 삼으신’으로도 옮길 수 있습니다.
