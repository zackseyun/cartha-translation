base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
  footnotes:
  - marker: a
    text: Hebrew 'Pharaoh’s horse ... with his chariot'; the singular may function collectively for Pharaoh’s mounted force and chariotry.
    reason: lexical_alternative
  - marker: b
    text: Or 'and the sons of Israel'; the Hebrew conjunction is simply 'and.' 'But' in the main text makes the contrast explicit in English.
    reason: alternative_reading
translation:
  language: ko
  text: 바로의 말들이 그의 병거들과 그의 기병들과 함께 바다로 들어갔습니다. 야훼께서 바다의 물을 그들 위로 되돌리셨지만, 이스라엘 자손은 바다 한가운데의 마른 땅 위를 걸어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 단수 ‘말’은 문맥상 바로의 기마 전력 전체를 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 접속사는 단순히 ‘그리고’입니다. 본문은 대비를 암시하지만, 한국어 본문에서는 문맥상 자연스러운 대조로 읽히게 했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: סוּס פַּרְעֹה
  english_pob_choice: Pharaoh’s horses
  chosen_korean: 바로의 말들
  alternatives_korean:
  - 바로의 말
  - 바로의 군마들
  lexicon: HALOT
  rationale: 히브리어 단수 סוּס이 문맥상 집합적으로 쓰인 점을 반영해 한국어 복수 ‘말들’로 자연스럽게 옮겼습니다.
- source_word: בְּרִכְבּוֹ וּבְפָרָשָׁיו
  english_pob_choice: with his chariots and with his horsemen
  chosen_korean: 그의 병거들과 그의 기병들과 함께
  alternatives_korean:
  - 그의 병거와 그의 기병과 함께
  - 그의 전차들과 그의 말탄 자들과 함께
  lexicon: HALOT
  rationale: רֶכֶב/פָרָשִׁים의 군사적 집합 의미를 살려 ‘병거들’과 ‘기병들’로 옮겼고, 원문의 병렬 구조를 보존했습니다.
- source_word: וַיָּשֶׁב יְהוָה
  english_pob_choice: Yahweh brought back
  chosen_korean: 야훼께서 … 되돌리셨습니다
  alternatives_korean:
  - 야훼께서 … 돌이키셨습니다
  - 주께서 … 되돌리셨습니다
  lexicon: HALOT
  rationale: 공동체적 전통어보다 본문 고유명 יְהוָה를 반영해 ‘야훼’로 직역하고, 히필형 שוב의 인과적 의미를 ‘되돌리다’로 살렸습니다.
- source_word: בְּתוֹךְ הַיָּם
  english_pob_choice: through the midst of the sea
  chosen_korean: 바다 한가운데의
  alternatives_korean:
  - 바다 한복판의
  - 바다 가운데의
  lexicon: HALOT
  rationale: ‘through the midst’의 공간적 중심성을 살리면서도 한국어 문맥에서는 ‘바다 한가운데’가 가장 자연스럽습니다.
theological_decisions:
- issue: 이 구절의 신적 행위와 군사적 대비를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘야훼께서 바다의 물을 그들 위로 되돌리셨지만’으로 옮겨, 인간 군대의 진입과 하나님의 주권적 반전을 선명하게 대비했습니다.
  alternative_readings:
  - ‘주께서 바다의 물을 그들 위로 돌이키셨지만’
  - ‘야훼께서 바다의 물을 그들 위에 다시 가져오셨지만’
  rationale: 본문의 중심은 단순한 자연 현상이 아니라 야훼의 통치적 개입이므로, 원문의 원인-결과와 심판의 반전을 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 출애굽기의 야훼 주권과 심판-구원 모티프
- issue: וּבְנֵי יִשְׂרָאֵל의 접속사 의미
  chosen_reading: ‘하지만’은 본문에 없는 대조를 해석상 드러내는 연결어로는 쓰지 않고, 단순한 ‘그리고/…하지만’의 긴장감을 문장 리듬으로만 살렸습니다.
  alternative_readings:
  - ‘그리고 이스라엘 자손은…’
  - ‘하지만 이스라엘 자손은…’
  rationale: 히브리어 접속사는 단순한 ‘and’이므로, 명시적 대조를 과도하게 삽입하지 않으면서도 문맥상 대비는 독자가 자연스럽게 느끼도록 했습니다.
  doctrine_reference: 히브리어 접속사 וְ의 문맥 기능
