  - 주님의 능력
  rationale: 히브리어는 의인화된 시적 이미지를 사용하므로, 의미를 풀이해 약화시키기보다 이미지를 보존하는 편이 본문의 신학적·문학적 힘을 유지합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
