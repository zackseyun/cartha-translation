  source_fidelity: 히브리어는 하나님께 직접 მიმართ하는 2인칭 남성 단수이며, ‘오른손을 내미셨습니다; 땅이 그들을 삼켰습니다’는 נָטִיתָ, יְמִינְךָ, תִּבְלָעֵמוֹ, אָרֶץ의 구체적 이미지와 문장 관계를 충실히 반영합니다. ‘주님께서 주님의’라는 기존 표기는 한국어에서 3인칭 서술처럼 들려 원문의 직접 호칭을 약화하므로, ‘주님,’이라는 호격으로 직접성을 드러내는 것이 안전합니다.
  naturalness: ‘주님, 주님께서 오른손을 내미셨습니다. 땅이 그들을 삼켰습니다.’는 현대 표준 한국어의 경건하고 격식 있는 합쇼체로 자연스럽습니다. 한국어에서는 직접 호칭의 문맥상 ‘주님의’를 반복하지 않아도 소유 관계가 분명합니다.
  terminology: ‘오른손’은 원문의 신체 이미지를 보존하며, ‘삼켰습니다’는 בלע의 생생한 비유를 자연스럽게 유지합니다. 각주도 원문의 יָמִין에 대한 실제 어휘 대안인 ‘오른팔’을 제시하도록 바로잡아야 합니다.
  issues:
