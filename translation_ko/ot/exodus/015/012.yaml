theological_decisions:
- issue: 하나님을 향한 2인칭 시적 묘사
  chosen_reading: ‘주님의 오른손’을 그대로 살려, 능력을 추상화하지 않고 구체적 행위를 드러냈습니다.
  alternative_readings:
