  text: מִֽי כָמֹ֤/כָה בָּֽ/אֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖/כָה נֶאְדָּ֣ר בַּ/קֹּ֑דֶשׁ נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: ko
  text: 신들 가운데서 주와 같은 이가 누구입니까? 거룩함이 빼어나신 주와 같은 이가 누구입니까? 찬양 가운데서 두려움을 일으키시며 놀라운 일을 행하시는 분이 누구입니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “신들 가운데서”; 본문은 야훼의 유일성을 다른 신적 존재들과의 비교 속에서 드러냅니다.
    reason: source_note
  - marker: b
    text: 문맥상 ‘찬양 가운데서’는 찬양이 하나님께 대한 경외를 불러일으키는 상황을 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: מִי כָמֹה בָּאֵלִם יְהוָה
  english_pob_choice: Who is like you among the gods, O LORD?
  chosen_korean: 신들 가운데서 주와 같은 이가 누구입니까?
  alternatives_korean:
  - 신들 중에 주와 같은 이가 누구입니까?
  - 신들 가운데 야훼와 같은 이가 누구입니까?
  lexicon: 가운데서 / 주
  rationale: בָּאֵלִם은 ‘신들 가운데서/중에’의 비교 구문으로 옮겼고, 본문 음성은 2인칭 직접호칭이므로 ‘주’로 자연스럽게 호명했습니다.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  english_pob_choice: majestic in holiness
  chosen_korean: 거룩함이 빼어나신
  alternatives_korean:
  - 거룩함 가운데 위엄 있으신
  - 거룩함에 있어 존귀하신
  lexicon: 빼어나신
  rationale: 네어다르(neʾdar)는 단순한 ‘위엄’보다 ‘두드러지게 탁월하고 찬란한’ 뉘앙스가 있어, 한국어에서는 ‘빼어나신’으로 응축했습니다.
- source_word: נוֹרָא תְהִלֹּת
  english_pob_choice: feared in praises
  chosen_korean: 찬양 가운데서 두려움을 일으키시며
  alternatives_korean:
  - 찬양 중에 경외를 불러일으키시는
  - 찬양받으실 때 두려우신
  lexicon: 두려움을 일으키시며
  rationale: POB의 ‘feared’는 단순 수동형이 아니라 ‘찬양을 받으실 때 경외/두려움을 불러일으키시는’ 의미를 살려야 하므로, 수용자 반응을 드러내는 동사구로 옮겼습니다.
- source_word: עֹשֵׂה פֶלֶא
  english_pob_choice: doing wonders
  chosen_korean: 놀라운 일을 행하시는 분
  alternatives_korean:
  - 기이한 일들을 행하시는 분
  - 기적을 행하시는 분
  lexicon: 놀라운 일을 행하시는 분
  rationale: 페레(פֶלֶא)는 단순한 ‘기적’보다 놀라움과 경이의 범위를 포함하므로, 문맥상 가장 포괄적인 ‘놀라운 일’을 택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문의 יְהוָה는 예배적 호칭으로서 한국어 본문에는 ‘주’로 두었습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 히브리어 본문 자체는 사족 없이 신명칭을 제시하지만, 이 구절의 직접 호칭과 예전적 울림을 고려해 POB 영어의 LORD에 대응하는 ‘주’를 사용했습니다.
  doctrine_reference: 출 15:11; POB 인명·신명 표준
- issue: תְהִלֹּת의 의미
  chosen_reading: ‘찬양 가운데서 두려움을 일으키시며’로 옮겨, 찬양이 곧 경외를 낳는다는 긴장을 유지했습니다.
  alternative_readings:
  - 찬양받으실 분
  - 찬양을 받으시는 분
  rationale: POB의 revised reading ‘feared in praises’를 따라, 단순한 수동적 칭송이 아니라 하나님 앞에서의 경외 반응을 드러내는 것으로 보존했습니다.
  doctrine_reference: 출 15:11 주해 전통
