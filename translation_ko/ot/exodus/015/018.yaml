  rationale: 원문의 신성호칭인 YHWH를 인격적 고유명사로 보존해야 하므로, 관용적 대체어인 ‘주님’ 대신 학술적 음역 ‘야훼’를 사용합니다.
- source_word: יִמְלֹךְ
  english_pob_choice: will reign
  chosen_korean: 통치하십니다
  alternatives_korean:
  - 다스리십니다
  - 왕이 되십니다
  - 통치하실 것입니다
  lexicon: HALOT
  rationale: 문맥이 출애굽 승리 찬가의 선언이므로 미래적 왕권 행위를 한국어 자연문으로 살려 ‘통치하십니다’로 옮겼습니다.
- source_word: לְעֹלָם וָעֶד
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 영원히
  - 세세토록
  - 영원히 또 영원히
  lexicon: HALOT
  rationale: 두 어절의 강조적 결합이 ‘영원무궁토록’이라는 한국어 관용에서 가장 간결하게 중첩된 영속성을 전달합니다.
theological_decisions:
- issue: יהוה를 번역어로 처리할지 고유명사로 보존할지
  chosen_reading: 원문과 영어 POB의 audit trail을 따라 ‘야훼’로 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 왕권 선언의 주어로 하나님의 언약 이름을 직접 사용하므로, 칭호로 완화하지 않고 고유명사를 유지하는 것이 신학적·문헌학적으로 타당합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
