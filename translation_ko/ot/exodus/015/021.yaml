  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 וַתַּעַן은 직접화법을 이끄는 동사로서 ‘응답했습니다’만으로 충분하며, ‘말했습니다’를 덧붙이면 원문에 없는 발화동사가 중복됩니다. וְרֹכְבוֹ는 말과 결합된 ‘그 기수’를 뜻하므로 이를 자연스럽고 분명하게 옮겼습니다.
  naturalness: ‘그 타는 자’는 현대 표준어에서 부자연스럽고 지시 대상도 잠시 불분명합니다. ‘그 기수’가 간결하고 자연스럽습니다. 직접 인용문 앞의 ‘응답하여 말했습니다’도 ‘응답했습니다’로 다듬었습니다.
  terminology: ‘미리암’, ‘야훼’, ‘노래하십시오’, ‘크게 승리하셨기 때문입니다’는 프로젝트 용어 및 합쇼체 문체에 적절합니다. ענה가 이 노래 문맥에서 화답하여 노래한다는 뉘앙스를 가질 수 있다는 점을 각주로 보존했습니다.
  issues:
