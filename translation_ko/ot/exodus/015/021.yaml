base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
  footnotes:
  - marker: a
    text: Or, 'Miriam sang responsively to them,' reflecting the verb 'answered' in a musical or antiphonal setting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew, 'he has exalted himself greatly' or 'he is highly exalted'; the translation 'he has triumphed gloriously' captures the idiom in this victory-song context.
    reason: lexical_alternative
translation:
  language: ko
  text: 미리암이 그들에게 응답했습니다[a]. “야훼께 노래하십시오. 그분께서 크게 승리하셨기 때문입니다[b]. 말과 그 기수를 바다에 던지셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미리암이 그들에게 화답하여 노래했다.’ ‘응답했다’라는 동사는 이 노래의 문맥에서 교창 또는 화답하여 노래하는 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그분께서 크게 높아지셨다’ 또는 ‘그분은 높이 높아지셨다’라는 뜻입니다. 이 승리의 노래 문맥에서는 ‘크게 승리하셨다’가 이 관용적 표현의 의미를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן לָהֶם
  english_pob_choice: And Miriam answered them
  chosen_korean: 미리암이 그들에게 응답하여 말했습니다
  alternatives_korean:
  - 미리암이 그들에게 대답했습니다
  - 미리암이 그들에게 응답했습니다
  - 미리암이 화답하여 노래했습니다
  lexicon: HALOT
  rationale: ענה는 기본적으로 '대답하다/응답하다'이며, 이 문맥의 응답 노래 가능성은 살리되 원뜻을 유지하기 위해 '응답하여 말했습니다'로 옮겼습니다.
- source_word: שִׁירוּ לַיהוָה
  english_pob_choice: Sing to Yahweh
  chosen_korean: 야훼께 노래하십시오
  alternatives_korean:
  - 야훼를 찬송하십시오
  - 여호와께 노래하십시오
  - 야훼께 찬양하십시오
  lexicon: HALOT
  rationale: 동사는 단순히 '노래하다'이므로 과도한 해석을 피했고, 여호와는 본 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: גָאֹה גָּאָה
  english_pob_choice: he has triumphed gloriously
  chosen_korean: 크게 승리하셨기 때문입니다
  alternatives_korean:
  - 지극히 높여지셨기 때문입니다
  - 크게 높으셨기 때문입니다
  - 영광스럽게 승리하셨기 때문입니다
  lexicon: HALOT
  rationale: 중첩 구조는 단순한 '높아지다'보다 승리 서사에서의 강한 승리를 드러내므로, POB의 해석을 따라 '크게 승리하셨다'로 옮겼습니다.
- source_word: וְרֹכְבוֹ
  english_pob_choice: and its rider
  chosen_korean: 그 타는 자
  alternatives_korean:
  - 그의 타는 자
  - 기수
  - 탄 사람
  lexicon: HALOT
  rationale: 문자적으로는 '말의 타는 자/탄 자'이며, 한국어에서는 소유를 자연스럽게 풀어 '그 타는 자'로 옮겨 말-기수 결합을 유지했습니다.
