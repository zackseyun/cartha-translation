id: EXO.15.7
reference: Exodus 15:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/רֹ֥ב גְּאוֹנְ/ךָ֖ תַּהֲרֹ֣ס קָמֶ֑י/ךָ תְּשַׁלַּח֙ חֲרֹ֣נְ/ךָ֔ יֹאכְלֵ֖/מוֹ כַּ/קַּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
  footnotes:
  - marker: a
    text: Or 'with the abundance of your grandeur.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you send forth your wrath.' The Hebrew literally refers to 'your burning anger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 크신 위엄으로 주께서 일어나 대적하는 자들을 무너뜨리시며[a], 주의 타오르는 분노를 보내시니 그것이 그들을 그루터기처럼 삼켜 버립니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의 위엄의 풍성함으로’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 분노를 보내시니’. 히브리어는 문자적으로 ‘주의 타오르는 분노’를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/רֹב גְּאוֹנְךָ
  english_pob_choice: And in the greatness of your majesty
  chosen_korean: 주의 크신 위엄으로
  alternatives_korean:
  - 주의 위엄의 크기로
  - 주의 크신 영광으로
  - 주의 장엄함으로
  lexicon: HALOT
  rationale: בְ+רֹב은 수단/범위를 나타낼 수 있어 한국어로는 ‘~으로’가 자연스럽고, גָּאוֹן은 이 문맥의 왕적 찬란함을 살려 ‘위엄’으로 옮겼습니다.
- source_word: תַּהֲרֹס קָמֶיךָ
  english_pob_choice: you overthrow those who rise up against you
  chosen_korean: 주께서 일어나 대적하는 자들을 무너뜨리시며
  alternatives_korean:
  - 주께서 일어서는 자들을 무너뜨리시며
  - 주께서 맞서는 자들을 허무시며
  - 주께서 대적들을 무너뜨리시며
  lexicon: HALOT
  rationale: הרס는 건물 파괴보다 ‘무너뜨리다’가 시편적 전투 문맥에 자연스럽고, קָמֶיךָ의 ‘일어나 대적하는 자들’이라는 동작성을 살렸습니다.
- source_word: תְּשַׁלַּח חֲרֹנְךָ
  english_pob_choice: you send out your burning anger
  chosen_korean: 주의 타오르는 분노를 보내시니
  alternatives_korean:
  - 주의 불붙는 분노를 내보내시니
  - 주의 분노를 보내시니
  - 주의 맹렬한 분노를 보내시니
  lexicon: HALOT
  rationale: חֲרוֹן은 단순한 ‘분노’보다 불타는 분노의 이미지를 지니므로 ‘타오르는 분노’로 옮겨 원문의 열기 이미지를 유지했습니다.
- source_word: יֹאכְלֵמוֹ כַּקַּשׁ
  english_pob_choice: it consumes them like stubble
  chosen_korean: 그것이 그들을 그루터기처럼 삼켜 버립니다
  alternatives_korean:
  - 그것이 그들을 지푸라기처럼 삼킵니다
  - 그것이 그들을 짚단처럼 먹어 치웁니다
  - 그것이 그들을 마른 짚처럼 삼켜 버립니다
  lexicon: HALOT
  rationale: כַּקַּשׁ은 추수 뒤 남는 마른 줄기/그루터기 이미지이므로, 한국어에서는 ‘그루터기’가 가장 가까운 자연어적 대응으로 판단했습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 형상 보존
  chosen_reading: 주께서 대적을 무너뜨리시고, 타오르는 분노가 그들을 삼켜 버린다고 직접 진술합니다.
  alternative_readings:
  - 심판을 완곡하게 표현하는 해석
  - 징계의 비유로 순화하는 해석
  rationale: 히브리어 시는 하나님의 파괴적 심판을 은유적으로나마 직접 말하므로, 그 강도를 약화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 시적 심판 언어의 직설성
- issue: 하나님께 대한 2인칭 직접호칭의 유지
  chosen_reading: 주의 … 주께서 … 주의 …
  alternative_readings:
  - 하나님이 … 하나님이 …
  rationale: 이 절은 하나님께 직접 부르는 노래이므로 2인칭 호칭을 유지해야 찬양의 호흡과 고백성이 살아납니다.
  doctrine_reference: 직접 화행과 예배 언어
