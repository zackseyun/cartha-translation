  text: וַ/יִּצְעַ֣ק אֶל יְהוָ֗ה וַ/יּוֹרֵ֤/הוּ יְהוָה֙ עֵ֔ץ וַ/יַּשְׁלֵךְ֙ אֶל הַ/מַּ֔יִם וַֽ/יִּמְתְּק֖וּ הַ/מָּ֑יִם שָׁ֣ם שָׂ֥ם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט וְ/שָׁ֥ם נִסָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: ko
  text: 그가 야훼께 부르짖었고, 야훼께서 그에게 나무를 보여 주셨습니다. 그가 그것을 물에 던지자 물이 달아졌습니다. 거기서 야훼께서 그들을 위하여 규례와 법도를 세우셨고, 거기서 그들을 시험하셨습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 עֵץ는 여기서 일반적으로 ‘나무’를 뜻합니다. POB는 이 구절에서 ‘tree’를 채택했습니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּצְעַק אֶל יְהוָה
  english_pob_choice: he cried out to the LORD
  chosen_korean: 야훼께 부르짖었습니다
  alternatives_korean:
  - 하나님께 부르짖었습니다
  - 야훼께 외쳤습니다
  lexicon: 야훼 / 부르짖다
  rationale: יַצְעַק은 단순한 '외치다'보다 절박한 호소를 나타내므로 '부르짖다'가 더 가깝고, יהוה는 본문 주석 원칙에 따라 야훼로 옮겼습니다.
- source_word: וַיּוֹרֵהוּ יְהוָה עֵץ
  english_pob_choice: the LORD showed him a tree
  chosen_korean: 야훼께서 그에게 나무를 보여 주셨습니다
  alternatives_korean:
  - 야훼께서 그에게 한 나무를 지시하셨습니다
  - 야훼께서 그에게 나무 한 그루를 보여 주셨습니다
  lexicon: ראה/ירה / 나무
  rationale: POB의 'tree'를 그대로 살리되, 히브리어 יורה는 '가르치다/보여 주다'의 방향성을 가지므로 '보여 주다'가 가장 자연스럽고 과하지 않습니다.
- source_word: חֹק וּמִשְׁפָּט
  english_pob_choice: a statute and a judgment
  chosen_korean: 규례와 법도
  alternatives_korean:
  - 율례와 판결
  - 규정과 판정
  lexicon: חֹק / מִשְׁפָּט
  rationale: 문맥상 토라적 규범을 가리키므로 חֹק은 '규례', מִשְׁפָּט은 여기서 법적 '판결'보다 공동체에 주어진 '법도'로 옮겨 POB의 구분을 유지했습니다.
theological_decisions:
- issue: כּאן נִסָּהוּ — 시험의 목적
  chosen_reading: 야훼께서 그들을 시험하셨습니다
  alternative_readings:
  - 야훼께서 그들을 검증하셨습니다
  - 야훼께서 그들을 시험해 보셨습니다
  rationale: נָסָה는 단순 유혹이 아니라 진정성/순종을 드러내는 시험·검증을 뜻하므로, 한국어로는 중립적인 '시험하다'가 가장 정확합니다.
  doctrine_reference: 하나님이 언약 백성을 훈련하고 드러내시는 시험의 의미
