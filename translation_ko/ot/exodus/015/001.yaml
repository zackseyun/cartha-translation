base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH'' (traditionally rendered ''the LORD''; alternatively ''Yahweh'').'
    reason: alternative_reading
  - marker: b
    text: Or 'he is highly exalted'; the Hebrew intensifies the verb with a repeated form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세와 이스라엘 자손들이 이 노래를 야훼께[a] 불렀고, 이렇게 말했습니다. “나는 야훼께 노래하겠습니다. 그분이 참으로 크게 승리하셨기[b] 때문입니다. 말과 그 기수를 바다에 던지셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘YHWH’. 전통적으로 ‘주’로 번역되며, ‘야훼’로도 옮깁니다.'
    reason: source_note
  - marker: b
    text: 또는 ‘그분은 지극히 높으시다’. 히브리어는 같은 어근을 반복하여 동사의 뜻을 강하게 강조합니다.
    reason: lexical_alternative
