  lexicon: HALOT
  rationale: 히브리어의 친족·계보 표현을 비교적 직접적으로 살리면서도 한국어에서 통용되는 자연스러운 형태로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: WLC/공통 용례
  rationale: 프로젝트 기본어인 야훼를 따랐고, 여격 조사 '-께'로 찬가의 향주성을 드러냈습니다.
- source_word: גָאֹה גָּאָה
  english_pob_choice: he has triumphed gloriously
  chosen_korean: 참으로 높이 높여지셨기 때문입니다
  alternatives_korean:
  - 크게 승리하셨기 때문입니다
  - 영광스럽게 높여지셨기 때문입니다
  lexicon: HALOT
  rationale: 어근 반복이 만드는 강세를 한국어의 반복 구조로 살리면서, 전쟁 승리의 맥락과 '높음/높여짐'의 의미를 함께 보존했습니다.
- source_word: סוּס וְרֹכְבוֹ
  english_pob_choice: horse and its rider
  chosen_korean: 말과 그 탄자
  alternatives_korean:
  - 말과 그 기수
  - 말과 탄 기병
  lexicon: HALOT
  rationale: 히브리어의 단수 병렬을 살리되, '탄자'로 말 탄 사람을 비교적 직역하여 시적 압축을 유지했습니다.
- source_word: רָמָה בַיָּם
  english_pob_choice: he has thrown into the sea
  chosen_korean: 바다에 던져 버리셨습니다
  alternatives_korean:
  - 바다로 던지셨습니다
  - 바다 속에 내던지셨습니다
  lexicon: HALOT
  rationale: 동사의 강한 투척 이미지를 살리면서 한국어에서는 결과의 완결성을 드러내는 '던져 버리셨습니다'가 자연스럽습니다.
