base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH'' (traditionally rendered ''the LORD''; alternatively ''Yahweh'').'
    reason: alternative_reading
  - marker: b
    text: Or 'he is highly exalted'; the Hebrew intensifies the verb with a repeated form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세와 이스라엘 자손들이 이 노래를 야훼께 불러 드리고, 이렇게 말했습니다. “나는 야훼께 노래하겠습니다. 그분이 참으로 높이 높여지셨기 때문입니다. 말과 그 탄자를 바다에 던져 버리셨습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ''YHWH'' (전통적으로는 ''the LORD''로 번역되며, 대안으로 ''Yahweh''가 있습니다).'
    reason: source_note
  - marker: b
    text: 또는 '그분은 지극히 높으시다'; 히브리어는 반복형으로 동사를 강하게 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그때에
  - 그런 다음
  lexicon: HALOT
  rationale: 이야기 흐름의 시간표지로 자연스럽게 앞선 사건 다음을 잇되, 지나치게 설명적으로 만들지 않기 위해 '그때'로 옮겼습니다.
- source_word: וּבְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
