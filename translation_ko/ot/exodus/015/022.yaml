  rationale: 출애굽기 본문을 현대 한국어로 읽을 때의 즉시성을 살리되, 원어의 의미와 기존 번역 전통 사이의 차이를 숨기지 않기 위해 이렇게 처리했습니다.
  doctrine_reference: 번역 투명성과 원문 우선 원칙
