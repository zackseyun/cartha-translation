  text: וַ/יַּסַּ֨ע מֹשֶׁ֤ה אֶת יִשְׂרָאֵל֙ מִ/יַּם ס֔וּף וַ/יֵּצְא֖וּ אֶל מִדְבַּר שׁ֑וּר וַ/יֵּלְכ֧וּ שְׁלֹֽשֶׁת יָמִ֛ים בַּ/מִּדְבָּ֖ר וְ/לֹא מָ֥צְאוּ מָֽיִם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
  footnotes:
  - marker: a
    text: Traditionally rendered 'Red Sea'; Hebrew 'Sea of Reeds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 이스라엘을 홍해[a]에서 이끌어 나가서 수르 광야로 들어가게 했습니다. 그들은 광야에서 사흘을 가다가 물을 찾지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘홍해’로 옮기지만, 히브리어는 ‘갈대바다’(Sea of Reeds)입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  english_pob_choice: led ... on
  chosen_korean: 이끌어 나가서
  alternatives_korean:
  - 떠나게 했습니다
  - 길을 나서게 했습니다
  - 진행하게 했습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려 모세가 이스라엘을 움직이게 한 주체임을 드러내되, 한국어에서는 자연스럽게 ‘이끌어 나가다’로 옮겼습니다.
- source_word: מִיַּם סוּף
  english_pob_choice: from the Sea of Reeds
  chosen_korean: 홍해
  alternatives_korean:
  - 갈대바다
  - 갈대의 바다
  lexicon: HALOT
  rationale: 본문의 히브리어는 직역상 ‘갈대바다’이지만, 한국어 독자에게는 전통적으로 ‘홍해’가 가장 즉시 이해되는 지명이라 본문에는 이를 두고, 각주로 원문 의미를 보완했습니다.
- source_word: מִדְבַּר שׁוּר
  english_pob_choice: the wilderness of Shur
  chosen_korean: 수르 광야
  alternatives_korean:
  - 수르의 황야
  - 수르의 광야
  lexicon: HALOT
  rationale: 지명 수르에 ‘광야’를 붙여 히브리어 מִדְבָּר의 사막이 아닌 광야/황야라는 기본 의미를 살렸습니다.
- source_word: לֹא מָצְאוּ מָיִם
  english_pob_choice: found no water
  chosen_korean: 물을 찾지 못했습니다
  alternatives_korean:
  - 물을 발견하지 못했습니다
  - 물을 얻지 못했습니다
  lexicon: HALOT
  rationale: 동사 ‘찾다/발견하다’의 직접성을 유지하면서, 한국어에서 자연스러운 부정 표현으로 옮겼습니다.
theological_decisions:
- issue: 지명 번역과 전통 번역의 긴장
  chosen_reading: 본문에는 ‘홍해’를 쓰고, 각주에서 히브리어가 ‘갈대바다’임을 밝혔습니다.
  alternative_readings:
  - 본문을 ‘갈대바다’로 직역함
  - 전통적 번역만 유지함
  rationale: 출애굽기 본문을 현대 한국어로 읽을 때의 즉시성을 살리되, 원어의 의미와 기존 번역 전통 사이의 차이를 숨기지 않기 위해 이렇게 처리했습니다.
  doctrine_reference: 번역 투명성과 원문 우선 원칙
