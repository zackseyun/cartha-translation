  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. 두 절의 연속 동작을 ‘떠나게 했고, 그들은 … 나아갔습니다’로 분명히 하였고, ‘사흘 동안 걸었으나’는 시간의 지속과 물을 얻지 못한 결과를 매끄럽게 나타냅니다.
