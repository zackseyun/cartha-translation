id: EXO.15.17
reference: Exodus 15:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
  footnotes:
  - marker: a
    text: Or 'and establish them.' The Hebrew verb literally means 'plant them,' preserving the image of secure settlement.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the mountain of your inheritance' may refer broadly to the land God gives his people or more specifically to the mountain of God's sanctuary.
    reason: alternative_reading
  - marker: c
    text: Hebrew has both the divine name (rendered 'LORD') and the title 'Lord' in this verse.
    reason: cultural_note
translation:
  language: ko
  text: 주님께서 그들을 들여오시고, 당신의 기업의 산에 심으실 것입니다. — 주님, 당신께서 거처하시려고 마련하신 곳, 곧 주님, 성소입니다. 당신의 손이 세우신 곳입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘심다’이며, 안전한 정착의 이미지를 지닌 비유를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기업의 산’은 하나님이 주시는 땅 전체를 가리킬 수도 있고, 하나님의 성소가 있는 산을 더 구체적으로 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 이 절에 신적 이름(יְהוָה)과 칭호(אֲדֹנָי)를 함께 사용합니다.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  english_pob_choice: You will bring them in
  chosen_korean: 그들을 들여오시고
  alternatives_korean:
  - 그들을 데려오시고
  - 그들을 이끌어 들이시고
  lexicon: HALOT
  rationale: 히필형의 사역적 ‘데려/들이다’ 의미를 살리면서, 목적지로 들어가게 하는 동작을 자연스러운 한국어로 옮겼습니다.
- source_word: וְתִטָּעֵמוֹ
  english_pob_choice: and plant them
  chosen_korean: 심으실 것입니다
  alternatives_korean:
  - 심어 놓으실 것입니다
  - 세우실 것입니다
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘심다’이므로, 정착의 비유를 평탄하게 풀어쓴 ‘세우다’보다 원이미지를 살린 ‘심으시다’를 택했습니다.
- source_word: בְּהַר נַחֲלָתְךָ
  english_pob_choice: on the mountain of your inheritance
  chosen_korean: 당신의 기업의 산에
  alternatives_korean:
  - 당신의 상속의 산에
  - 당신께서 기업으로 받으신 산에
  lexicon: HALOT
  rationale: נחלה를 한국어 성서어휘의 ‘기업’으로 옮겨 소유·분배의 뉘앙스를 유지했고, 산과의 관계는 단순한 수식 구조로 살렸습니다.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  english_pob_choice: the place ... that you made for your dwelling
  chosen_korean: 당신께서 거처하시려고 마련하신 곳
  alternatives_korean:
  - 당신의 거처를 위한 정한 곳
  - 당신이 거하실 고정된 곳
  lexicon: HALOT
  rationale: מכון은 ‘정해진 자리/장소’이지만 현대 한국어에서는 ‘곳’이 가장 자연스럽고, לְשִׁבְתְּךָ는 ‘거처하시려고’로 목적을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 이 구절의 히브리어 본문은 여호와이름 יְהוָה를 포함하므로, 한국어 본문에서는 예배적 독법을 고려해 ‘주님’으로 두고, 주석 없이도 두 번째 אַדֹנָי와 구별되게 했습니다.
- source_word: מִקְּדָשׁ אֲדֹנָי
  english_pob_choice: the sanctuary, Lord
  chosen_korean: 주님, 성소입니다
  alternatives_korean:
  - 주님의 성소입니다
  - 주님, 당신의 성소입니다
  lexicon: HALOT
  rationale: מקדש는 ‘성소’가 가장 직접적이며, 아도나이를 별도 호격처럼 유지해 히브리어의 두 호칭이 함께 나타나는 긴장을 보존했습니다.
- source_word: כּוֹנְנ֥וּ יָדֶי/ךָ
  english_pob_choice: that your hands established
  chosen_korean: 당신의 손이 세우신 곳입니다
  alternatives_korean:
  - 당신의 손이 견고히 세우신 곳입니다
  - 당신의 손이 굳게 마련하신 곳입니다
  lexicon: HALOT
  rationale: כון의 ‘세우다/견고히 하다’ 의미를 살리되, 한국어 문맥에서 가장 자연스러운 ‘세우시다’를 택했고 손의 의인화 이미지를 유지했습니다.
theological_decisions:
- issue: יְהוָה와 אֲדֹנָי가 한 절에 함께 나오는 호칭 처리
  chosen_reading: 두 호칭의 중복을 자연스럽게 드러내되, 한국어에서는 ‘주님’과 ‘주님, 성소입니다’로 호칭의 반복과 구분을 함께 살렸습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 동일화
  - 첫 번째를 ‘야훼’로, 두 번째를 ‘주님’으로 구별
  rationale: 히브리어 본문은 신적 이름과 칭호를 모두 포함하므로, 한국어도 이를 완전히 평준화하지 않고 호칭의 반복을 남겨 본문의 수사적 밀도를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — divine name rendering'
- issue: ‘기업의 산’과 ‘성소’의 지리적 의미를 좁혀 해석하지 않음
  chosen_reading: 산과 성소를 시온/성전산으로 단정하지 않고, 약속된 거처를 가리키는 시적 긴장을 유지했습니다.
  alternative_readings:
  - 시온으로 명시
  - 가나안 전체로 명시
  rationale: 본문은 거처와 성소의 이미지를 함께 제시할 뿐, 하나로 완전히 환원하지 않으므로 한국어 번역도 그 모호성을 보존하는 편이 더 충실합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
