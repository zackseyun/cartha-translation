  source_fidelity: 수정이 필요합니다. 히브리어의 יְהוָה와 אֲדֹנָי는 서로 다른 신적 호칭인데, 초안은 둘 다 ‘주님’으로 처리하여 본문에 있는 구별을 잃었습니다. 또한 ‘주님, 성소입니다’는 מִקְּדָשׁ אֲדֹנָי의 호격 및 이어지는 관계절 구조를 자연스럽게 전달하지 못합니다.
  naturalness: 초안의 ‘당신의 기업의 산’, ‘주님, 성소입니다’ 및 ‘당신의 손이 세우신 곳입니다’는 현대 표준 한국어 문장으로 다소 부자연스럽고, 마지막 ‘곳’은 선행사인 ‘성소’를 불필요하게 바꿉니다. 수정문은 시적 병렬과 호격을 유지하면서도 자연스러운 합쇼체로 정리했습니다.
  terminology: יְהוָה는 프로젝트 원칙과 영어 POB 감사 기록에 따라 ‘야훼’로, אֲדֹנָי는 ‘주님’으로 구별했습니다. נַחֲלָה는 성서적 소유·상속의 의미를 보존하도록 ‘기업’으로 유지하되, 한국어 수식 관계를 ‘주님의 기업인 산’으로 다듬었습니다. מִקְּדָשׁ은 ‘성소’로 유지했습니다.
  issues:
