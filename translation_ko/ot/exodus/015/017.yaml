  - severity: medium
    issue: ‘주님, 성소입니다’ 및 ‘당신의 손이 세우신 곳입니다’의 문장 구조
    rationale: 원문의 ‘성소, 주님, 당신의 손이 세우신’을 한국어에서 호격과 관계절로 자연스럽게 연결하지 못했습니다. 특히 마지막 ‘곳’은 원문에 없는 명사를 덧붙여 성소를 다시 지칭합니다.
