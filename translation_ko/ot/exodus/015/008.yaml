id: EXO.15.8
reference: Exodus 15:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
  footnotes:
  - marker: a
    text: Or 'By the breath of your nostrils.'
    reason: lexical_alternative
  - marker: b
    text: '''Like a heap'' reflects the Hebrew noun; some translations render it ''like a wall'' in light of related sea-crossing imagery.'
    reason: lexical_alternative
  - marker: c
    text: Or 'froze.' The Hebrew verb can denote becoming thickened or congealed.
    reason: lexical_alternative
  - marker: d
    text: Literally 'in the heart of the sea,' that is, in the midst of the sea.
    reason: lexical_alternative
translation:
  language: ko
  text: 주의 숨결에 물들이 쌓였고, 흐르던 물들이 무더기처럼 섰으며, 깊은 물들이 바다 한가운데에서 엉겨 붙었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘숨결’은 여기서 ‘바람/호흡’의 뜻을 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘무더기’는 히브리어 ‘heap’에 해당하는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘엉겨 붙었습니다’는 ‘얼다’보다 넓은 의미의 응고·굳어짐을 반영합니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘바다의 심장’ 곧 ‘바다 한가운데’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  english_pob_choice: At the blast of your nostrils
  chosen_korean: 주의 숨결에
  alternatives_korean:
  - 주의 콧김에
  - 주의 콧구멍의 바람에
  - 주의 호흡으로
  lexicon: HALOT
  rationale: רוּחַ는 ‘바람/숨/영’의 범위를 가지며, כאן에서는 신체적 이미지가 핵심이므로 ‘숨결’로 옮겨 강한 호흡의 뉘앙스를 살렸습니다. ‘콧김’도 가능하지만 문어적 품위를 고려해 조금 더 자연스러운 표현을 택했습니다.
- source_word: נֶעֶרְמוּ מַיִם
  english_pob_choice: the waters piled up
  chosen_korean: 물들이 쌓였고
  alternatives_korean:
  - 물들이 무더졌다
  - 물들이 포개졌고
  - 물들이 쌓여 올랐고
  lexicon: HALOT
  rationale: נֶעֶרְמוּ는 ‘쌓이다, 더미를 이루다’의 뜻이어서, 동적 장면을 살리면서도 현대 한국어에서 자연스러운 ‘쌓이다’를 사용했습니다.
- source_word: נִצְּבוּ כְמוֹ נֵד נֹזְלִים
  english_pob_choice: the flowing waters stood like a heap
  chosen_korean: 흐르던 물들이 무더기처럼 섰으며
  alternatives_korean:
  - 흐르던 물들이 더미처럼 섰으며
  - 흐르던 물들이 벽처럼 섰으며
  - 흐르던 물들이 무더기로 섰으며
  lexicon: HALOT
  rationale: נֵד은 문맥상 ‘더미/무더기’가 가장 직접적이므로 ‘무더기처럼’으로 옮겼습니다. POB가 보존한 ‘흐르던 물들’은 נֹזְלִים의 현재분사적 성격을 살린 표현입니다.
- source_word: קָפְאוּ תְהֹמֹת
  english_pob_choice: the depths congealed
  chosen_korean: 깊은 물들이 … 엉겨 붙었습니다
  alternatives_korean:
  - 깊은 물들이 얼었습니다
  - 깊은 물들이 굳었습니다
  - 깊은 물들이 응고되었습니다
  lexicon: HALOT
  rationale: קָפְאוּ는 ‘얼다’보다 더 넓게 ‘응고되다/엉기다’의 뜻을 가질 수 있어, 시적 이미지와 물질감이 살아 있는 ‘엉겨 붙다’를 택했습니다.
- source_word: בְּלֶב יָם
  english_pob_choice: in the heart of the sea
  chosen_korean: 바다 한가운데에서
  alternatives_korean:
  - 바다의 중심에서
  - 바다의 한복판에서
  - 바다의 심장부에서
  lexicon: HALOT
  rationale: 직역하면 ‘바다의 심장/중심’이지만, 한국어에서 ‘한가운데’가 같은 관용적 의미를 가장 자연스럽게 전달합니다. 시적 원문성을 해치지 않으면서 이해를 돕기 위한 선택입니다.
theological_decisions:
- issue: 하나님의 신체적 묘사 유지
  chosen_reading: ‘주의 숨결’처럼 신체적·감각적 이미지를 살려, 본문의 인간형 표현을 완화하지 않았습니다.
  alternative_readings:
  - ‘주의 분노에’처럼 추상화하는 읽기
  - ‘주의 바람에’처럼 비인격화하는 읽기
  rationale: 히브리어 본문은 하나님을 감각적으로 묘사하는 시어를 사용합니다. 이를 추상화하면 원문의 힘이 약해지므로, 본문이 의도한 시적 긴장과 장면성을 유지했습니다.
  doctrine_reference: 번역 원칙 §1, §3
