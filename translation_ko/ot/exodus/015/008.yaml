  terminology: ‘무더기’는 נֵד의 기본 뜻인 ‘더미·무더기’를 잘 반영하며 ‘벽’으로 특정하지 않습니다. ‘깊은 물들’은 תְהֹמֹת의 복수형 심연/깊은 물을 무리 없이 전달합니다. ‘바다 한가운데’는 בְּלֶב יָם의 관용적 의미를 자연스럽게 반영하되, 각주에서 직역적 시어를 밝혀 보완합니다.
