  text: וַ/יָּבֹ֣אוּ אֵילִ֔מָ/ה וְ/שָׁ֗ם שְׁתֵּ֥ים עֶשְׂרֵ֛ה עֵינֹ֥ת מַ֖יִם וְ/שִׁבְעִ֣ים תְּמָרִ֑ים וַ/יַּחֲנוּ שָׁ֖ם עַל הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
  footnotes:
  - marker: a
    text: Or 'and there were twelve springs of water and seventy palm trees.'
    reason: lexical_alternative
  - marker: b
    text: '''Palm trees'' could be rendered more specifically as ''date palms.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'they camped there by the waters.' The Hebrew uses a plural form for 'water,' often functioning collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 엘림에 이르렀습니다. 거기에는 물 샘 열둘과 종려나무 일흔 그루가 있었고, 그들은 거기 물가에 진을 쳤습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물 샘’은 문맥상 ‘샘들’ 또는 ‘샘물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘종려나무’는 더 구체적으로 ‘대추야자’로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘물가’는 히브리어의 복수형 ‘물들’을 집합적으로 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵילִמָה
  english_pob_choice: to Elim
  chosen_korean: 엘림에
  alternatives_korean:
  - 엘림으로
  - 엘림
  lexicon: 고유명사 표기
  rationale: 지명은 음역하고, 히브리어 방향격 어미는 한국어 처소격 조사로 자연스럽게 반영했습니다.
- source_word: שְׁתֵּים עֶשְׂרֵ֛ה עֵינֹ֥ת מַ֖יִם
  english_pob_choice: twelve springs of water
  chosen_korean: 물 샘 열둘
  alternatives_korean:
  - 열두 샘물
  - 열두 물 샘
  - 물 샘 열두 개
  lexicon: HALOT
  rationale: ‘샘’이 수원지라는 뜻을 살리되, 현대 한국어에서 간결하고 자연스럽게 ‘물 샘’으로 옮겼습니다.
- source_word: וְ/שִׁבְעִ֣ים תְּמָרִ֑ים
  english_pob_choice: seventy palm trees
  chosen_korean: 종려나무 일흔 그루
  alternatives_korean:
  - 야자나무 일흔 그루
  - 종려나무 칠십 그루
  lexicon: HALOT
  rationale: תְּמָרִים은 일반적으로 종려나무/야자나무를 가리키므로, 성경 문맥에서 익숙한 ‘종려나무’를 택하고 수사는 순한국어로 자연화했습니다.
- source_word: וַ/יַּחֲנוּ
  english_pob_choice: they camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프했습니다
  - 야영했습니다
  - 머물렀습니다
  lexicon: HALOT
  rationale: 출애굽기 광야 서술의 군사적·여정적 뉘앙스를 살려 ‘진을 치다’를 사용했습니다.
theological_decisions:
- issue: ‘waters’의 복수형과 한국어 자연성
  chosen_reading: ‘물가’로 옮기되, 복수 개념을 굳이 드러내지 않았습니다.
  alternative_readings:
  - 물들에
  - 여러 물가에
  rationale: 히브리어는 복수형 מַיִם를 쓰지만 여기서는 집합적 용법으로 오아시스의 물가를 뜻하므로, 한국어에서는 의미를 과장하지 않는 표현이 더 적절합니다.
  doctrine_reference: 본문 의미 보존과 문체 자연성
