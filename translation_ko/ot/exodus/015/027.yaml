  source_fidelity: 본문의 지명, 열두 샘, 일흔 종려나무, 물가에서의 숙영이라는 핵심 의미는 충실히 반영했습니다. 다만 ‘물 샘’은 히브리어 עֵינֹת מַיִם(물의 샘들)을 자연스러운 현대 한국어로 충분히 전달하지 못하므로 ‘샘 열두 곳’으로 다듬는 것이 적절합니다.
  naturalness: ‘물 샘 열둘’은 현대 표준어에서 다소 어색하며, ‘샘 열두 곳’이 자연스럽습니다. ‘진을 쳤습니다’는 광야 여정 서술에 알맞는 합쇼체 표현입니다.
  terminology: ‘엘림’, ‘종려나무’, ‘진을 치다’는 적절합니다. תְּמָרִים은 문맥상 대추야자나무를 가리킬 수 있으나, 본문은 일반적으로 ‘종려나무’로 옮기는 것이 안전합니다. 해당 각주에서는 ‘대추야자나무’라고 해야 나무를 가리키는 말로 정확합니다.
