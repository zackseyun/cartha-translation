revisions:
- from: 그들은 엘림에 이르렀습니다. 거기에는 물 샘 열둘과 종려나무 일흔 그루가 있었고, 그들은 거기 물가에 진을 쳤습니다.[a][b][c]
  to: 그들은 엘림에 이르렀습니다.[a] 그곳에는 샘 열두 곳과 종려나무 일흔 그루가 있었고, 그들은 그곳 물가에 진을 쳤습니다.[b][c]
  rationale: ‘샘 열두 곳’으로 고쳐 원문의 수원(水源) 의미를 자연스러운 한국어로 전달했습니다. 각주 표지를 관련 어구에 배치하고, 대추야자 관련 용어를 ‘대추야자나무’로 정확히 했습니다. 히브리어 מַיִם의 복수형은 한국어에서 집합적인 ‘물가’로 자연스럽게 유지했습니다.
