  text: 그들은 엘림에 이르렀습니다.[a] 그곳에는 샘 열두 곳과 종려나무 일흔 그루가 있었고, 그들은 그곳 물가에 진을 쳤습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
