revisions:
- from: 그때 에돔의 추장들은 떨었고, 모압의 지도자들은 떨림에 사로잡혔으며, 가나안의 모든 주민은 녹아내렸습니다.
  to: 그때 에돔의 지도자들은 두려움에 떨었고, 모압의 지도자들은 떨림에 사로잡혔으며, 가나안의 모든 주민은 녹아내렸습니다.
  rationale: 에돔 지도자들의 반응에 공포의 의미를 명시하여 נִבְהֲלוּ를 더 정확히 반영하고, ‘추장’이 지닐 수 있는 현대적·문화권 특수적 연상을 피했습니다. 모압의 지도자들에게 떨림이 ‘사로잡히는’ 표현 및 가나안 주민들이 ‘녹아내리는’ 은유는 원문의 이미지와 한국어 자연스러움을 함께 살리므로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:43:35Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 삼행 병행 구조와 주요 은유는 대체로 잘 반영되었습니다. 그러나 נִבְהֲלוּ는 단순히 ‘떨었다’보다 공포·경악에 사로잡힌 상태를 뜻하므로 ‘두려움에 떨었다’가 더 충실합니다. רָעַד가 모압의 유력자들을 붙드는 표현과, נָמֹגוּ의 ‘녹다’ 은유는 유지하는 것이 적절합니다.
  naturalness: 합쇼체 문장으로 자연스럽고 시적 병렬도 매끄럽습니다. 다만 고대 에돔의 집단 지도자를 ‘추장’이라 하면 현대 한국어에서 특정 문화권의 부족장이라는 연상이 강할 수 있어, 문맥상 중립적인 ‘지도자들’이 더 자연스럽습니다.
  terminology: אַלּוּפֵי는 ‘지도자들’로, אֵילֵי도 병행되는 정치·사회적 유력자라는 문맥에 따라 ‘지도자들’로 옮길 수 있습니다. 두 표현의 어휘적 차이는 한국어 본문에서 과도하게 만들지 않되, 원문의 병행을 존중합니다. 별도 각주는 필수적이지 않습니다.
  issues:
  - severity: low
    issue: ‘에돔의 추장들’
    rationale: ‘추장’은 현대 한국어에서 특정 부족 사회를 연상시키기 쉬워, 고대 에돔의 알루핌(집단의 우두머리·유력자)을 중립적으로 가리키는 ‘지도자들’이 더 적절합니다.
  - severity: medium
    issue: ‘떨었고’
    rationale: נִבְהֲלוּ는 단순 신체적 떨림보다 두려움과 경악에 빠짐을 나타냅니다. 뒤 행의 רָעַד(떨림)와도 구별되도록 ‘두려움에 떨었고’로 보완하는 것이 좋습니다.
  revised_text: 그때 에돔의 지도자들은 두려움에 떨었고, 모압의 지도자들은 떨림에 사로잡혔으며, 가나안의 모든 주민은 녹아내렸습니다.
  revised_footnotes: []
