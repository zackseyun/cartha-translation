source:
  edition: WLC
  text: אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖/מוֹ רָ֑עַד נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
  footnotes:
  - marker: a
    text: Or 'the mighty men of Moab.' The Hebrew expression is literally 'the strong ones/rams of Moab,' used here for prominent men or leaders.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 에돔의 지도자들은 두려움에 떨었고, 모압의 지도자들은 떨림에 사로잡혔으며, 가나안의 모든 주민은 녹아내렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그제야
  lexicon: HALOT
  rationale: 서술의 시간적 전환을 자연스럽게 표시하면서도, 시적 문맥에서 과도하게 해설적으로 보이지 않도록 했습니다.
- source_word: אַלּוּפֵי אֱדוֹם
  english_pob_choice: the chiefs of Edom
  chosen_korean: 에돔의 추장들
  alternatives_korean:
  - 에돔의 족장들
  - 에돔의 지도자들
  lexicon: HALOT
  rationale: אַלּוּף은 왕실 직함보다 부족/집단의 우두머리 뜻이 강하므로, '추장들'이 'chiefs'의 사회적 지위를 가장 잘 반영합니다.
- source_word: אֵילֵי מוֹאָב
  english_pob_choice: the leaders of Moab
  chosen_korean: 모압의 지도자들
  alternatives_korean:
  - 모압의 강한 자들
  - 모압의 용사들
  lexicon: HALOT
  rationale: 직역하면 '강한 자들/수양들'에 가깝지만, 병행구에서 정치적 수장들을 가리키는 문맥이므로 '지도자들'로 의미를 풀어 옮겼습니다.
- source_word: יֹאחֲזֵמוֹ רָעַד
  english_pob_choice: trembling seized
  chosen_korean: 떨림에 사로잡혔습니다
  alternatives_korean:
  - 떨림이 그들을 붙들었습니다
  - 전율이 덮쳤습니다
  lexicon: HALOT
  rationale: אחז의 '붙들다/사로잡다' 이미지를 살리면서, רָעַד의 감각적 공포를 한국어로 자연스럽게 전달했습니다.
- source_word: נָמֹגוּ
  english_pob_choice: melted away
  chosen_korean: 녹아내렸습니다
  alternatives_korean:
  - 녹아 버렸습니다
  - 기력이 빠졌습니다
  lexicon: HALOT
  rationale: מוג의 은유를 보존해 두려움으로 힘이 풀리는 장면을 생생하게 나타냅니다.
