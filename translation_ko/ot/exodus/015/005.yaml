    reason: lexical_alternative
  revision_rationale: 'The revision retains the Hebrew imagery and verbal distinction: the deep waters cover them, and they go down into the depths like a stone. It replaces literalized but unnatural Korean plurals with idiomatic collective wording and improves the formal register without adding interpretive content.'
