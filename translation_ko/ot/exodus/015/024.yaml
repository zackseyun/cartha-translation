lexical_decisions:
- source_word: וַיִּלֹּנוּ
  english_pob_choice: grumbled
  chosen_korean: 불평하며
  alternatives_korean:
  - 투덜거리며
  - 원망하며
  - 불평하고
  lexicon: HALOT
  rationale: 광야 불평 문맥에서 공동체적 불평을 나타내는 동사를 현대 한국어로 자연스럽게 옮기되, 단순 정보 전달보다 부정적 항의를 드러내기 위해 ‘불평하다’를 택했습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 그 백성이
  alternatives_korean:
  - 백성이
  - 그 사람들이
  - 이스라엘 백성이
  lexicon: HALOT
  rationale: 문맥상 특정 공동체를 가리키지만 원문이 단순히 ‘백성’을 말하므로, 해석을 덜 가하는 ‘그 백성’으로 유지했습니다.
- source_word: עַל
  english_pob_choice: against
  chosen_korean: 향하여
  alternatives_korean:
  - 대하여
  - against
  - 에게
  lexicon: HALOT
  rationale: 한국어에서 ‘모세를 향하여 불평하다’는 표현이 원문의 विरोध적 관계를 가장 자연스럽게 드러냅니다.
- source_word: נִּשְׁתֶּה
  english_pob_choice: shall we drink
  chosen_korean: 무엇을 마시겠습니까
  alternatives_korean:
  - 무엇을 마셔야 합니까
  - 무엇을 마실 수 있습니까
  - 무엇을 마시겠어요
  lexicon: HALOT
  rationale: 히브리어 수사 의문문을 한국어에서 실제 절박한 필요를 묻는 말로 살려, 현대적이면서도 직역에 갇히지 않게 옮겼습니다.
