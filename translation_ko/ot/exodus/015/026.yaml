  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
  footnotes:
  - marker: a
    text: Or, “for I am the LORD who heals you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다[a]. “너희가 만일 너희 하나님 야훼의 음성을 자세히 듣고, 그의 눈에 옳은 것을 행하며, 그의 명령들에 귀를 기울이고, 그의 모든 규례를 지키면, 내가 이집트에 내린 그 어떤 질병도 너희에게 내리지 않겠습니다. 나는 야훼, 너희를 고치는 이입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 너희를 고치는 야훼이기 때문이다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמ֨וֹעַ תִּשְׁמַ֜ע
  english_pob_choice: diligently listen
  chosen_korean: 자세히 듣고
  alternatives_korean:
  - 열심히 듣고
  - 귀 기울여 듣고
  - 충실히 듣고
  lexicon: HALOT
  rationale: 히브리어의 강조용 부정사절+동사 구조를 살려 단순한 청취가 아니라 주의 깊고 지속적인 경청을 나타내기 위해 ‘자세히 듣고’로 옮겼습니다.
- source_word: לְקוֹל יְהוָה אֱלֹהֶיךָ
  english_pob_choice: to the voice of Yahweh your God
  chosen_korean: 너희 하나님 야훼의 음성
  alternatives_korean:
  - 너희 하나님 야훼의 소리
  - 너희 하나님 야훼가 말씀하시는 소리
  lexicon: HALOT
  rationale: קוֹל의 기본 의미인 ‘음성’을 살리되, 청중이 하나님의 말씀에 귀를 기울이라는 뜻이 분명하게 드러나도록 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  english_pob_choice: what is right in his eyes
  chosen_korean: 그의 눈에 옳은 것
  alternatives_korean:
  - 그의 눈에 바른 것
  - 그의 보기에 선한 것
  - 그의 눈에 좋은 것
  lexicon: HALOT
  rationale: 관용구를 직역에 가깝게 살려 도덕적 기준이 하나님의 시선에 있음을 드러내기 위해 ‘그의 눈에 옳은 것’으로 번역했습니다.
- source_word: רֹפְאֶךָ
  english_pob_choice: your healer
  chosen_korean: 너희를 고치는 이
  alternatives_korean:
  - 너희의 치료자
  - 너희의 치유자
  - 너희를 고치시는 분
  lexicon: HALOT
  rationale: 분사형의 명사적 힘과 동사적 뉘앙스를 함께 살리기 위해 관계절보다 명사적 표현인 ‘고치는 이’를 택했습니다. 이 표현은 POB의 ‘your healer’와도 맞닿습니다.
theological_decisions:
- issue: YHWH의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 언약 이름을 가리는 전통적 대체어보다, 원문 고유명칭을 직접 드러내는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 질병에 대한 약속의 범위
  chosen_reading: 출애굽 사건과 언약 순종에 조건지어진 약속으로 이해
  alternative_readings:
  - 모든 개인에게 주어지는 무조건적 치유 보장
  - 영적 회복만을 뜻하는 상징적 진술
  rationale: 본문 자체가 순종 조건과 이집트에 내린 재앙을 연결하므로, 현대적 치유 일반론으로 확장하거나 전적으로 상징화하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1 and §3
