- from: 그가 말씀하셨습니다[a]. “너희가 만일 너희 하나님 야훼의 음성을 자세히 듣고, 그의 눈에 옳은 것을 행하며, 그의 명령들에 귀를 기울이고, 그의 모든 규례를 지키면, 내가 이집트에 내린 그 어떤 질병도 너희에게 내리지 않겠습니다. 나는 야훼, 너희를 고치는 이입니다.”
  to: 그가 말씀하셨습니다[a]. “네가 만일 네 하나님 야훼의 음성에 귀 기울여 듣고, 그분의 눈에 옳은 것을 행하며, 그분의 명령에 귀를 기울이고, 그분의 모든 규례를 지키면, 내가 이집트에 내렸던 모든 질병을 네게는 하나도 내리지 않겠습니다. 이는 내가 너를 고치는 야훼이기 때문입니다.”
