  naturalness: ‘나는 야훼, 너희를 고치는 이입니다’는 한국어에서 동격 구조가 다소 부자연스럽고, 합쇼체 문맥에서도 매끄럽지 않습니다. ‘이는 내가 너를 고치는 야훼이기 때문입니다’가 원문의 인과관계와 현대 한국어 문장을 함께 살립니다.
