  naturalness: 합쇼체와 시적 고백의 어조는 대체로 적절하지만, “나의 아버지의 하나님이시니”는 원문의 병렬 명사구를 이유절처럼 처리합니다. “그분은 내 아버지의 하나님이시며”가 현대 표준어로 더 자연스럽고 원문의 병렬을 보존합니다.
  terminology: יָהּ는 영어 POB의 ‘Yah’를 따라 한국어 음역 “야”로 구별했습니다. אֱלֹהִים은 문맥상 존칭을 반영하여 “하나님”으로, ישׁוּעָה는 “구원”으로 유지했습니다. 난해한 וְאַנְוֵהוּ는 본문에서 “찬양하다”로 옮기되 처소를 마련한다는 유력 대안을 각주에 보존했습니다.
