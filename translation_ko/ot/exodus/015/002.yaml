  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
  footnotes:
  - marker: a
    text: Or, 'I will prepare a dwelling for him.' The Hebrew verb here is difficult and may carry the sense of making a habitation or adorning/glorifying.
    reason: alternative_reading
translation:
  language: ko
  text: 「야훼는 나의 힘이시며 노래이십니다[a]. 그분은 나의 구원이 되셨습니다. 이분이 나의 하나님이시니, 나는 그분을 찬양하겠습니다. 나의 아버지의 하나님이시니, 나는 그분을 높이겠습니다。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 그분을 위해 처소를 마련하겠습니다.” 히브리어 동사는 어렵고, 거처를 마련하다 또는 영화롭게 하다의 뜻을 띨 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  english_pob_choice: my strength
  chosen_korean: 나의 힘
  alternatives_korean:
  - 나의 능력
  - 나의 강함
  lexicon: HALOT
  rationale: עֹז/עָז는 힘, 강함의 뜻이므로 한국어에서는 가장 자연스럽고 시편적 울림도 있는 “힘”으로 옮겼습니다.
- source_word: וְזִמְרָת יָהּ
  english_pob_choice: and song
  chosen_korean: 노래이시며
  alternatives_korean:
  - 찬양이시며
  - 노래와 찬양이시며
  lexicon: HALOT
  rationale: POB가 이 연을 “strength and song”으로 읽는 점을 따라, 시적 병행을 살려 “힘이시며 노래”로 옮겼습니다. יָהּ는 별도로 야훼의 축약형 이름이므로 합쳐서 일반 호칭으로 풀지 않았습니다.
- source_word: וַיְהִי לִי לִישׁוּעָה
  english_pob_choice: and he has become my salvation
  chosen_korean: 그분은 나의 구원이 되셨습니다
  alternatives_korean:
  - 그분은 나의 구원이 되었습니다
  - 그분은 나에게 구원이 되셨습니다
  lexicon: HALOT
  rationale: 히브리어의 되다/~가 되다 용법을 반영해 결과 상태를 살렸고, 시의 현재적 고백에 맞게 자연스러운 종결형으로 옮겼습니다.
- source_word: וְאַנְוֵהוּ
  english_pob_choice: and I will praise him
  chosen_korean: 나는 그분을 찬양하겠습니다
  alternatives_korean:
  - 나는 그분을 영화롭게 하겠습니다
  - 나는 그분을 위해 처소를 마련하겠습니다
  lexicon: HALOT
  rationale: 동사의 의미가 어려우나 문맥상 예배와 찬송의 평행을 살리는 번역이 적절합니다. POB의 본문 선택을 따라 “찬양하다”로 두되, 다른 가능성은 각주로 보존했습니다.
- source_word: אֱלֹהֵי אָבִי
  english_pob_choice: my father's God
  chosen_korean: 나의 아버지의 하나님
  alternatives_korean:
  - 내 아버지의 하나님
  - 아버지의 하나님
  lexicon: HALOT
  rationale: 소유격 연결 구조를 그대로 살려, 조상-언약의 관계를 드러내는 “나의 아버지의 하나님”으로 옮겼습니다.
- source_word: וַאֲרֹמְמֶנְהוּ
  english_pob_choice: and I will exalt him
  chosen_korean: 나는 그분을 높이겠습니다
  alternatives_korean:
  - 나는 그분을 높여 드리겠습니다
  - 나는 그분을 exalt하겠습니다
  lexicon: HALOT
  rationale: רומם의 기본 의미를 따라 예배 맥락에서 자연스러운 “높이다”를 선택했습니다.
theological_decisions:
- issue: יהּ의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 יהוה가 아니라 קצר형 יָהּ를 쓰지만, 이 절의 화자는 그 이름을 직접 부르고 있으므로 본문 자체의 신명성을 드러내기 위해 “야훼”로 옮겼습니다. 이는 POB의 YHWH 기본 관례와도 정합적입니다.
  doctrine_reference: Translation philosophy; Contested terms table on יהוה/YHWH
- issue: וְאַנְוֵהוּ의 의미 처리
  chosen_reading: 찬양하겠습니다
  alternative_readings:
  - 그분을 위해 처소를 마련하겠습니다
  - 그분을 영화롭게 하겠습니다
  rationale: 히브리어가 본질적으로 난해하므로 단정적 해석을 피하고, 본문 내 예배 고백의 흐름을 가장 직접적으로 드러내는 의미를 본문에 두었습니다. 다른 가능성은 각주로 남겨 독자가 본문의 해석 여지를 인지하게 했습니다.
  doctrine_reference: Translation philosophy §3
