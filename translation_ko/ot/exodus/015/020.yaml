translation:
  language: ko
  text: 그때 아론의 누이인 여예언자 미리암이 소고를 손에 들었습니다. 모든 여인이 소고를 들고 춤추며 그녀를 따라 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘춤들과 함께’. 히브리어 명사는 ‘춤’으로도, 복수형을 살려 ‘춤들’로도 옮길 수 있습니다.
    reason: lexical_alternative
