  to: 그때 아론의 누이인 여예언자 미리암이 소고를 손에 들었습니다. 모든 여인이 소고를 들고 춤추며 그녀를 따라 나왔습니다.[a]
  rationale: ‘소구’를 표준적이고 자연스러운 ‘소고’로 바로잡고, 여성형 예언자 호칭을 ‘여예언자’로 명시했습니다. 또한 ‘나왔습니다’로 יצא의 기본 뜻을 반영했습니다. ‘소고를 들고 춤추며’는 원문의 ‘소고들과 춤으로’라는 동반·수단의 병렬을 자연스러운 한국어로 옮긴 것입니다. 각주는 원문의 복수형에 관한 번역 가능성을 정확하고 이해하기 쉽게 수정했습니다.
