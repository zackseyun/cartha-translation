base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
  footnotes:
  - marker: a
    text: Or 'with dances.' The Hebrew noun can be rendered either as the activity ('dancing') or as the plural event form ('dances').
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아론의 누이이자 예언자였던 미리암이 손에 소구를 잡고, 모든 여인들이 그녀를 따라 소구와 춤으로 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘춤들로’. 히브리어 명사는 행위(‘춤’)로도, 복수의 사건형(‘춤들’)으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּבִיאָה
  english_pob_choice: the prophetess
  chosen_korean: 예언자였던
  alternatives_korean:
  - 여예언자였던
  - 예언자이셨던
  lexicon: HALOT
  rationale: 히브리어의 여성형 표지를 살리되, 한국어에서는 ‘예언자’에 서술격으로 여성성을 드러내는 방식이 가장 자연스럽습니다.
- source_word: אֲחוֹת אַהֲרֹן
  english_pob_choice: Aaron’s sister
  chosen_korean: 아론의 누이
  alternatives_korean:
  - 아론의 자매
  - 아론의 누이동생
  lexicon: HALOT
  rationale: 직역하면 ‘아론의 누이’가 가장 간결하고, 본문의 친족 표지를 보존합니다.
- source_word: הַתֹּף / בְּתֻפִּים
  english_pob_choice: the tambourine / with tambourines
  chosen_korean: 소구 / 소구와
  alternatives_korean:
  - 탬버린 / 탬버린과
  - 손북 / 손북과
  - 팀브럴 / 팀브럴과
  lexicon: HALOT
  rationale: תֹף은 고대 근동의 휴대 타악기로, 한국어에서 의미를 가장 무리 없이 전달하는 현대어로 ‘소구’를 택했습니다. 앞뒤 단수·복수도 한국어에서 자연스럽게 맞췄습니다.
- source_word: וּבִמְחֹלֹת
  english_pob_choice: and dancing
  chosen_korean: 춤으로
  alternatives_korean:
  - 춤과 함께
  - 춤들로
  - 춤으로 춤추며
  lexicon: HALOT
  rationale: 명사형 ‘춤’은 집단의 흥겨운 몸짓을 담을 수 있고, 도구격 ‘-로’가 앞의 악기 표현과 평행을 이루어 원문의 병렬성을 잘 살립니다.
theological_decisions:
- issue: 미리암의 호칭을 ‘예언자’로 살릴지 여부
  chosen_reading: ‘예언자였던 미리암’으로 옮겨, 여성형 직분/소명을 분명히 드러냈습니다.
  alternative_readings:
  - ‘예언자 미리암’
  - ‘예언하는 여인 미리암’
  rationale: 본문은 מיריָם을 단순한 이름이 아니라 예언자 정체성으로 규정하므로, 이를 약화하지 않고 한국어에서도 동일한 강조를 유지했습니다.
  doctrine_reference: 민수기 12:2; 미가 6:4
