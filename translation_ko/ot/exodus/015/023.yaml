    text: ‘마라’는 히브리어로 ‘쓴’이라는 뜻과 관련된 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: Then they came
  chosen_korean: 그들이 …에 이르렀습니다
  alternatives_korean:
  - 그들이 …에 왔습니다
  - 그들이 …에 도착했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 보여 주면서 도착의 완료를 담기 위해 ‘이르렀습니다’를 택했습니다.
- source_word: מָרָתָה
  english_pob_choice: to Marah
  chosen_korean: 마라에
  alternatives_korean:
  - 마라로
  - 마라로 향해
  lexicon: HALOT
  rationale: 지명은 음역하고, 이동의 방향은 한국어 조사로 간결하게 나타냈습니다.
- source_word: מִמָּרָה / כִּי מָרִים הֵם
  english_pob_choice: from Marah / because it was bitter
  chosen_korean: 그곳의 물을 마실 수 없었는데, 그것이 썼기 때문입니다
  alternatives_korean:
  - 그곳의 물은 마실 수 없었습니다. 그것이 썼기 때문입니다
  - 그곳의 물을 마실 수 없었으니, 그것이 썼습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘물’과 ‘썼다’의 연결을 살리면서, 한국어에서는 ‘물’의 질을 가리켜 ‘그것이 썼다’로 자연스럽게 옮겼습니다.
- source_word: עַל כֵּן קָרָא שְׁמָהּ מָרָה
  english_pob_choice: Therefore it was named Marah
  chosen_korean: 그러므로 그 이름을 마라라 하였습니다
  alternatives_korean:
  - 그러므로 그 이름을 마라라고 하였습니다
  - 그러므로 그곳을 마라라고 불렀습니다
  lexicon: HALOT
  rationale: 무주어 명명 구문을 한국어 수동형으로 과도하게 풀지 않고, 성경적 서술의 간결함을 유지했습니다.
theological_decisions:
- issue: 마라라는 지명과 ‘쓴다’는 어근의 말놀이를 어떻게 드러낼지
  chosen_reading: 지명은 그대로 ‘마라’로 음역하고, 쓴 맛은 ‘썼기 때문입니다’로 옮겨 이름 설명을 보존했습니다.
  alternative_readings:
  - ‘쓴맛이었기 때문입니다’
  - ‘쓴 곳이었기 때문입니다’
  rationale: 본문은 지명의 의미 설명을 의도하므로, 음역과 의미 번역을 함께 두어 독자가 이름의 유래를 이해하게 했습니다.
  doctrine_reference: 본문 내 어원 설명/서사적 명명 관습
