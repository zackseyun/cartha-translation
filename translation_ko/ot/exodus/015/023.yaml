translation:
  language: ko
  text: 그들이 마라에 이르렀습니다[a]. 그러나 마라의 물을 마실 수 없었습니다. 물이 썼기 때문입니다. 그래서 그곳의 이름을 마라라고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
