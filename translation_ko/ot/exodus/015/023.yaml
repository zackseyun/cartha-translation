  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 מִמָּרָה는 ‘그곳의 물’보다 ‘마라의 물’로 명시하는 편이 지명 반복과 명명 설명을 보존하며, 복수형 ‘물’에 대한 술어는 한국어에서 ‘물이 썼습니다’가 자연스럽습니다.
  naturalness: ‘그것이 썼기 때문입니다’는 선행사가 물임을 알 수 있으나 한국어 문장으로는 다소 부자연스럽고, ‘마실 수 없었는데 … 때문입니다’는 연결이 중복됩니다. 두 문장으로 나누어 자연스럽게 다듬었습니다.
