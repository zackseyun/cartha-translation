theological_decisions:
- issue: פְּלָשֶׁת의 지리적 지시 대상
  chosen_reading: ‘블레셋’의 주민들을 가리키는 지명으로 ‘블레셋의 주민들’이라고 옮겼습니다.
  alternative_readings:
  - ‘블레셋 사람들’
  - ‘블레셋 땅의 주민들’
  rationale: 원문은 민족명보다 지역명 פְּלָשֶׁת를 사용하므로, 사람 집단과 땅의 관계를 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 지리-민족 표지의 보존
- issue: 시적 병행 구조의 재현
  chosen_reading: ‘들었습니다—떨었습니다 / 공포가 사로잡았습니다’의 짧은 병행으로 원문의 압축된 운율을 살렸습니다.
  alternative_readings:
  - 한 문장으로 풀어쓰기
  - ‘떨었습니다’와 ‘사로잡혔습니다’를 연결하는 서술문
  rationale: 히브리 시의 응축과 강한 병행을 유지하는 편이 원문의 효과를 더 잘 전달합니다.
