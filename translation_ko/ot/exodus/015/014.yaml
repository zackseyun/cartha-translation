translation:
  language: ko
  text: 백성들이 들었습니다. 그들은 떨었습니다[a]. 블레셋의 주민들을 공포가 사로잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성들이 들었습니다. 그들은 떨고 있습니다. 공포가 블레셋의 주민들을 사로잡았습니다.’ 히브리어 시는 단순 과거뿐 아니라 생생한 현재적·미래적 뉘앙스도 허용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들은 적이 있습니다
  - 들어 버렸습니다
  lexicon: HALOT
  rationale: 완료형 서술을 한국어 과거형으로 자연스럽게 옮겨, 시의 서술 흐름을 살렸습니다.
- source_word: עַמִּים
  english_pob_choice: the peoples
  chosen_korean: 백성들이
  alternatives_korean:
  - 민족들이
  - 나라들이
  lexicon: HALOT
  rationale: 복수의 민족 집단을 가리키는 점을 살리되, 한국어 시어로는 ‘백성들’이 가장 자연스럽고 포괄적입니다.
- source_word: יִרְגָּזוּ/ן
  english_pob_choice: they trembled
  chosen_korean: 떨었습니다
  alternatives_korean:
  - 전율했습니다
  - 동요했습니다
  - 떨고 있었습니다
  lexicon: HALOT
  rationale: רָגַז의 ‘떨다/전율하다’ 의미를 직접적으로 반영했고, 영어 POB의 과거형 선택과도 맞췄습니다.
- source_word: חִיל
  english_pob_choice: anguish
  chosen_korean: 공포
  alternatives_korean:
  - 고통
  - 산통
  - 전율
  lexicon: HALOT
  rationale: 이 문맥에서는 내적 고통보다 겁에 질린 압도감을 드러내므로, ‘공포’가 가장 압축적으로 대응합니다.
theological_decisions:
- issue: פְּלָשֶׁת의 지리적 지시 대상
  chosen_reading: ‘블레셋’의 주민들을 가리키는 지명으로 ‘블레셋의 주민들’이라고 옮겼습니다.
  alternative_readings:
  - ‘블레셋 사람들’
  - ‘블레셋 땅의 주민들’
  rationale: 원문은 민족명보다 지역명 פְּלָשֶׁת를 사용하므로, 사람 집단과 땅의 관계를 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 지리-민족 표지의 보존
- issue: 시적 병행 구조의 재현
  chosen_reading: ‘들었습니다—떨었습니다 / 공포가 사로잡았습니다’의 짧은 병행으로 원문의 압축된 운율을 살렸습니다.
  alternative_readings:
  - 한 문장으로 풀어쓰기
  - ‘떨었습니다’와 ‘사로잡혔습니다’를 연결하는 서술문
  rationale: 히브리 시의 응축과 강한 병행을 유지하는 편이 원문의 효과를 더 잘 전달합니다.
  doctrine_reference: 시편/시가의 병행법 보존
