  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
  footnotes:
  - marker: a
    text: Or 'the dark cloud' or 'the gloom.' The Hebrew term can denote dense darkness associated with God's manifestation.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성은 멀리 서 있었고, 모세는 하나님이 계신 짙은 어둠 속으로 가까이 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹구름’ 또는 ‘어둠’입니다. 히브리어 용어는 하나님의 현현과 연관된 짙은 어둠을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  english_pob_choice: stood
  chosen_korean: 서 있었고
  alternatives_korean:
  - 섰고
  - 서 있었습니다
  lexicon: HALOT
  rationale: 서 있다를 써서 단순한 위치 유지와 긴장된 대면 상황을 자연스럽게 살렸습니다.
- source_word: מֵרָחֹק
  english_pob_choice: at a distance
  chosen_korean: 멀리
  alternatives_korean:
  - 거리를 두고
  - 먼 곳에서
  lexicon: HALOT
  rationale: 공간적 분리를 짧고 분명하게 드러내는 표현으로 옮겼습니다.
- source_word: נִגַּשׁ
  english_pob_choice: approached
  chosen_korean: 가까이 나아갔습니다
  alternatives_korean:
  - 다가갔습니다
  - 접근했습니다
  lexicon: HALOT
  rationale: 단순한 이동보다 경외 속에서 신에게 가까이 다가서는 뉘앙스를 살리기 위해 나아가다를 택했습니다.
- source_word: הָעֲרָפֶל
  english_pob_choice: the thick darkness
  chosen_korean: 짙은 어둠
  alternatives_korean:
  - 먹구름
  - 짙은 구름
  lexicon: HALOT
  rationale: עֲרָפֶל의 밀도 높은 어둠과 현현의 분위기를 담되, 본문이 허락하는 범위 안에서 자연스러운 현대어로 옮겼습니다.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  english_pob_choice: where God was
  chosen_korean: 하나님이 계신
  alternatives_korean:
  - 하나님이 계셨던
  - 하나님이 거하시는
  lexicon: HALOT
  rationale: 장소를 표시하는 관계절을 한국어의 관형절로 풀어, 신적 임재를 과장 없이 분명히 나타냈습니다.
theological_decisions:
- issue: 어둠 속의 하나님의 현현
  chosen_reading: ‘짙은 어둠’으로 직역에 가깝게 두어, 하나님의 임재가 오히려 접근 불가능한 신비와 연결된다는 긴장을 보존했습니다.
  alternative_readings:
  - 먹구름
  - 어둠 속에 계신 하나님
  rationale: 본문은 현현의 장소를 설명하기보다 경외와 거리의 역설을 보여 주므로, 자연현상으로 환원하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
