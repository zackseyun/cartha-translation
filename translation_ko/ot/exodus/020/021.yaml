  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
  footnotes:
  - marker: a
    text: Or 'the dark cloud' or 'the gloom.' The Hebrew term can denote dense darkness associated with God's manifestation.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성은 멀리 서 있었고, 모세는 하나님께서 계시는 짙은 어둠 가까이 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹구름’ 또는 ‘음울한 어둠’입니다. 히브리어 용어는 하나님의 현현과 연관된 짙은 어둠을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  english_pob_choice: stood
  chosen_korean: 서 있었고
  alternatives_korean:
  - 섰고
  - 서 있었습니다
  lexicon: HALOT
  rationale: 서 있다를 써서 단순한 위치 유지와 긴장된 대면 상황을 자연스럽게 살렸습니다.
- source_word: מֵרָחֹק
  english_pob_choice: at a distance
  chosen_korean: 멀리
  alternatives_korean:
