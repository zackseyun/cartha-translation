  text: וַ/יְדַבֵּ֣ר אֱלֹהִ֔ים אֵ֛ת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה לֵ/אמֹֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/001.yaml
  text: 'And God spoke all these words, saying:'
translation:
  language: ko
  text: '하나님이 이 모든 말씀을 하시고 말씀하셨습니다:'
  philosophy: formal
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: אלוהים
  rationale: 본문의 주어는 예언자나 사사가 아니라 언약의 하나님이므로, 프로젝트 기본값에 따라 표준 개신교 용례인 ‘하나님’으로 옮겼습니다.
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말했습니다
  - 이르셨습니다
  lexicon: דבר
  rationale: 단순 발화보다 권위 있는 선포의 뉘앙스가 있어, 한국어 성경 문맥에서 자연스러운 ‘말씀하시다’를 택했습니다.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말씀을
  alternatives_korean:
  - 이 모든 말들을
  - 이 모든 말씀들을
  lexicon: דבר
  rationale: 지시사 ‘이’와 총칭 ‘모든’을 살리면서, 십계명 서두의 공식문에 어울리는 ‘말씀’을 유지해 법조문적·언약적 중량감을 반영했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: '말씀하셨습니다:'
  alternatives_korean:
  - 이르시되
  - 말하여 이르시되
  lexicon: אמר
  rationale: 한국어에서는 뒤따르는 인용문을 여는 콜론으로 처리하는 것이 가장 자연스럽고, 영어 POB의 ‘saying:’도 이 구조를 지지합니다.
theological_decisions:
- issue: 시내산 언약 서문의 공적 선언성
  chosen_reading: ‘하나님이 이 모든 말씀을 하시고 말씀하셨습니다’로, 두 번째 동사를 포함해 엄숙한 선포 구조를 살렸습니다.
  alternative_readings:
  - ‘하나님이 이 모든 말씀을 하셨습니다’처럼 단일 동사로 축소
  - ‘하나님이 이 모든 말을 하셨습니다’로 일반화
  rationale: 원문은 ‘말하다’ 계열 동사를 중첩해 서술을 시작하므로, 이를 줄이면 인용 도입의 장중함과 구어적 개시 효과가 약해집니다.
  doctrine_reference: 출애굽기 20장의 십계명 도입부
