revisions:
- from: 또 만일 너희가 나를 위하여 돌 제단을 만들면, 다듬은 돌로 쌓지 말라. 네가 그것 위에 칼을 휘두르면 그것이 더럽혀지기 때문이다.[a][b]
  to: 또, 만일 당신이 나를 위하여 돌 제단을 만드시면, 다듬은 돌[a]로 그것을 쌓지 마십시오. 당신의 칼[b]을 그 위에 휘두르면 그것을 더럽히게 됩니다.
  rationale: 원문의 단수 수신자를 현대 합쇼체로 일관되게 반영하고, 제단을 더럽히는 주체가 상대방임을 능동적 인과 표현으로 복원했습니다. ‘칼’이라는 원문의 표현은 본문에 보존하되, 도구적 문맥 가능성은 각주에서만 설명했습니다.
