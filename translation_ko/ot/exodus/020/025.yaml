source:
  edition: WLC
  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
  footnotes:
  - marker: a
    text: Or 'hewn stone.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your sword'; in context this likely refers to a metal implement used on the stones.
    reason: cultural_note
translation:
  language: ko
  text: 또 만일 너희가 나를 위하여 돌 제단을 만들면, 다듬은 돌로 쌓지 말라. 네가 그것 위에 칼을 휘두르면 그것이 더럽혀지기 때문이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다듬은 돌’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘네 칼’이며, 문맥상 돌을 다루는 금속 도구를 가리킬 가능성이 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִזְבַּח אֲבָנִים
  english_pob_choice: an altar of stones
  chosen_korean: 돌 제단
  alternatives_korean:
  - 돌로 된 제단
  - 돌로 만든 제단
  lexicon: HALOT
  rationale: 히브리어의 구성 관계를 자연스러운 한국어로 옮기되, 재료를 분명히 드러내기 위해 ‘돌 제단’으로 간결하게 렌더링했습니다.
- source_word: גָּזִית
  english_pob_choice: cut stones
  chosen_korean: 다듬은 돌
  alternatives_korean:
  - 깎은 돌
  - 정으로 다듬은 돌
  - 쪼갠 돌
  lexicon: HALOT
  rationale: גזית는 가공·정제된 돌을 가리키므로, 예배용 제단의 문맥에 맞게 표준적인 ‘다듬은 돌’로 옮겼습니다.
- source_word: חַרְבְּךָ
  english_pob_choice: your sword
  chosen_korean: 칼
  alternatives_korean:
  - 네 검
  - 네 연장
  - 네 쇠 연장
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘네 칼’이지만, 돌을 다루는 도구 사용의 관용적 표현으로 이해되므로 한국어에서는 문맥상 자연스러운 ‘칼’로 유지했습니다.
- source_word: וַתְּחַלְלֶהָ
  english_pob_choice: you will profane it
  chosen_korean: 그것이 더럽혀지기 때문이다
  alternatives_korean:
  - 그것을 더럽히게 되기 때문이다
  - 그것이 거룩하지 않게 되기 때문이다
  - 그것이 속되게 되기 때문이다
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩한 것에 대한 훼손이므로, 제의적 함의를 살리면서도 현대 한국어로는 ‘더럽혀지다’가 가장 직관적입니다.
theological_decisions:
- issue: 제단의 훼손을 단순한 미관 문제가 아니라 거룩의 훼손으로 표현할지 여부
  chosen_reading: ‘더럽혀지다’로 옮겨 제의적 profane의 의미를 유지했습니다.
  alternative_readings:
  - ‘망가진다’로 완화해 표현한다
  - ‘속되게 된다’로 번역한다
  rationale: 본문의 핵심 동사는 חלל로, 단순한 손상보다 거룩함의 훼손을 가리킵니다. 따라서 미적 문제나 일반적 파손으로 낮추지 않고 제의적 의미를 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
