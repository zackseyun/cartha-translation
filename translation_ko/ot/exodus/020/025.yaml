  verdict: revise
  source_fidelity: 히브리어는 2인칭 남성 단수로 일관되며, 마지막 절은 ‘네가 그것을 더럽힌다/속되게 한다’는 능동 행위입니다. 초안은 첫 절에서 복수 ‘너희가’를 사용한 뒤 단수 ‘네가’로 바꾸고, 마지막 절을 수동형으로 옮겨 이 점을 충분히 반영하지 못했습니다. 또한 כִּי가 이끄는 근거 관계는 유지되어야 합니다.
  naturalness: 합쇼체에 맞추어 조건문과 명령문을 ‘만드시면/쌓지 마십시오’로 통일하고, 대명사의 지시 대상이 분명하도록 ‘그것’을 보완했습니다. 각주 표지는 해당 어휘에 직접 붙였습니다.
  terminology: ‘돌 제단’, ‘다듬은 돌’, ‘칼’은 적절합니다. חלל의 제의적 의미는 ‘더럽히다’로 유지할 수 있으나, 본문상 행위자는 사람이므로 ‘그것을 더럽히게 됩니다’로 옮기는 것이 더 정확합니다.
