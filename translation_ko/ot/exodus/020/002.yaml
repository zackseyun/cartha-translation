  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of slaves.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'from the house of slavery.' The Hebrew is literally 'from the house of slaves.'
