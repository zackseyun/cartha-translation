  - marker: b
    text: Hebrew YHWH, traditionally rendered 'the LORD'; alternatively transliterated 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 나는 야훼, 당신의 하나님입니다[a]. 내가 당신을 이집트 땅[b]에서, 종들의 집에서 이끌어 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 전통적으로 ‘주’로 옮기기도 하지만, 여기서는 신적 고유명 ‘야훼’를 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘이집트 땅’입니다.
    reason: source_note
lexical_decisions:
- source_word: אָנֹכִי
  english_pob_choice: I am
  chosen_korean: 나는 …입니다
  alternatives_korean:
  - 나는
  - 내가 …입니다
  lexicon: HALOT
  rationale: 독립 인칭 대명사의 강조를 한국어의 주어 표지와 서술어로 자연스럽게 살려, 선언적 자기소개를 「나는 …입니다」로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본절은 신명기적 호칭이 아니라 직접적인 여호와 이름이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 신적 고유명을 보존했습니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
  alternatives_korean:
  - 당신들의 하나님
  - 당신의 신
  lexicon: HALOT
  rationale: 단수 2인칭 접미사가 붙은 언약적 소유 관계를 살려 ‘당신의 하나님’으로 옮겼습니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slaves
  chosen_korean: 종들의 집에서
  alternatives_korean:
  - 노예들의 집에서
  - 노예 상태의 집에서
  - 종살이의 집에서
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘종들의 집’이며, 복수 명사 עֲבָדִים의 구체성을 보존하기 위해 추상화된 ‘종살이’보다 직접적인 소유격 구조를 선택했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 시내 산 언약 맥락에서 본절은 하나님의 고유명을 직접 제시하므로, 전통적 대체 титул보다 이름 자체를 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 출애굽의 해방 표현
  chosen_reading: 이끌어 냈습니다
  alternative_readings:
  - 데리고 나왔습니다
  - 구해 내셨습니다
  rationale: הוֹצֵאתִיךָ는 단순 이동이 아니라 종속 상태에서의 인도적 탈출을 뜻하므로, 출애굽의 구원-해방성을 드러내는 ‘이끌어 냈습니다’가 적절합니다.
  doctrine_reference: 출애굽기 20:2의 구속사적 문맥
