  lexicon: HALOT
  rationale: 단수 2인칭 접미사가 붙은 언약적 소유 관계를 살려 ‘당신의 하나님’으로 옮겼습니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slaves
  chosen_korean: 종들의 집에서
  alternatives_korean:
  - 노예들의 집에서
  - 노예 상태의 집에서
  - 종살이의 집에서
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘종들의 집’이며, 복수 명사 עֲבָדִים의 구체성을 보존하기 위해 추상화된 ‘종살이’보다 직접적인 소유격 구조를 선택했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 시내 산 언약 맥락에서 본절은 하나님의 고유명을 직접 제시하므로, 전통적 대체 титул보다 이름 자체를 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 출애굽의 해방 표현
  chosen_reading: 이끌어 냈습니다
  alternative_readings:
  - 데리고 나왔습니다
  - 구해 내셨습니다
  rationale: הוֹצֵאתִיךָ는 단순 이동이 아니라 종속 상태에서의 인도적 탈출을 뜻하므로, 출애굽의 구원-해방성을 드러내는 ‘이끌어 냈습니다’가 적절합니다.
  doctrine_reference: 출애굽기 20:2의 구속사적 문맥
