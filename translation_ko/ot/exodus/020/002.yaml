  lexicon: HALOT
  rationale: 독립 인칭 대명사의 강조를 한국어의 주어 표지와 서술어로 자연스럽게 살려, 선언적 자기소개를 「나는 …입니다」로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
