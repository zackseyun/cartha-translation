translation:
  language: ko
  text: 나는 야훼, 당신의 하나님입니다[a]. 내가 당신을 이집트 땅, 곧 노예들의 집[b]에서 이끌어 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 전통적으로 ‘주’로 옮기기도 하지만, 여기서는 신적 고유명 ‘야훼’를 따릅니다.
    reason: alternative_reading
  - marker: b
    text: 더 자연스럽게는 ‘노예살이하던 집’으로 옮길 수 있습니다. 히브리어는 직역하면 ‘노예들의 집’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
