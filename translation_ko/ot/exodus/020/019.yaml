  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה דַּבֵּר אַתָּ֥ה עִמָּ֖/נוּ וְ/נִשְׁמָ֑עָה וְ/אַל יְדַבֵּ֥ר עִמָּ֛/נוּ אֱלֹהִ֖ים פֶּן נָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
  footnotes:
  - marker: a
    text: Or 'we will hear.' The Hebrew verb can denote hearing in the sense of listening attentively or obeying responsively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 모세에게 말했습니다. 「당신이 우리에게 말씀하십시오. 그러면 우리가 듣겠습니다. 그러나 하나님께서 우리에게 말씀하지 않으시게 하십시오. 그렇지 않으면 우리가 죽을 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '우리가 들을 것입니다.' 히브리어 동사는 귀로 듣는다는 뜻뿐 아니라 주의 깊게 듣고 응답하여 순종한다는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  - 그들이 말하였습니다
  lexicon: WLC
  rationale: 이야기 진행을 자연스럽게 살리면서 히브리어 wayyiqtol의 단순 과거 서술을 반영했습니다.
- source_word: דַּבֵּר אַתָּה
  english_pob_choice: You speak
  chosen_korean: 당신이 말씀하십시오
  alternatives_korean:
  - 말씀하소서
  - 당신은 말씀하십시오
  lexicon: WLC
  rationale: 명령형과 강조 대명사 אַתָּה의 대비를 살려, 모세가 말하고 하나님은 말씀하지 않으시기를 요청하는 뉘앙스를 예의 있는 직접화법으로 옮겼습니다.
- source_word: וְנִשְׁמָעָה
  english_pob_choice: and we will listen
  chosen_korean: 그러면 우리가 듣겠습니다
  alternatives_korean:
  - 우리가 듣겠습니다
  - 우리가 들을 것입니다
  - 그리고 우리가 듣겠습니다
  lexicon: WLC
  rationale: 응답적·순종적 청취를 나타내는 뉘앙스를 살리기 위해 단순한 '듣다'보다 문맥상 결단이 드러나는 '듣겠습니다'를 택했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 하느님
  lexicon: WLC
  rationale: 문맥상 이스라엘의 한 분 하나님을 가리키므로 복수형 어감이 아닌 단수 호칭 '하나님'을 사용했습니다.
- source_word: פֶּן נָמוּת
  english_pob_choice: lest we die
  chosen_korean: 그렇지 않으면 우리가 죽을 것입니다
  alternatives_korean:
  - 죽지 않도록
  - 우리가 죽을까 하여
  lexicon: WLC
  rationale: פֶּן이 나타내는 두려운 결과를 현대 한국어에서 자연스럽게 전달하면서도, 요청의 긴박함과 경고성을 유지했습니다.
theological_decisions:
- issue: 하나님이 직접 말씀하시는 상황에 대한 두려움의 표현
  chosen_reading: 백성은 하나님의 직접 음성을 두려워하며 중보적 전달자 모세를 통해 듣기를 요청합니다.
  alternative_readings:
  - 단순히 소리가 크거나 놀라운 체험을 피하려는 요청으로 볼 수 있습니다.
  rationale: 본문은 시내산 언약 장면에서 하나님의 거룩한 임재 앞에 선 백성의 경외와 두려움을 드러내며, 모세를 통한 매개를 요구하는 흐름입니다.
  doctrine_reference: 출애굽기 20장 시내산 계시 문맥
- issue: 결과 절의 위협 강도
  chosen_reading: '''그렇지 않으면 우리가 죽을 것입니다''로 강한 결과 경고를 유지했습니다.'
  alternative_readings:
  - 완곡하게 '죽게 될 것입니다'로 완화할 수 있습니다.
  rationale: פֶּן + 미완료형이 가진 두려운 결과의 긴박성을 약화하지 않기 위해 직접적이고 경고적인 표현을 선택했습니다.
  doctrine_reference: 히브리어 결과절 표현
