revisions:
- from: 그들이 모세에게 말했습니다. 「당신이 우리에게 말씀하십시오. 그러면 우리가 듣겠습니다. 그러나 하나님께서 우리에게 말씀하지 않으시게 하십시오. 그렇지 않으면 우리가 죽을 것입니다.」[a]
  to: 그들이 모세에게 말했습니다. “모세께서 우리와 말씀해 주십시오. 그러면 우리가 듣겠습니다[a]. 그러나 하나님께서 우리와 말씀하지 않으시기를 바랍니다. 우리가 죽을까 합니다.”
  rationale: ‘모세께서’로 명령형의 명시된 주어가 지닌 대비와 강조를 보존하고, ‘우리와 말씀하다’로 עִם의 관계적 의미를 반영했습니다. 하나님의 발화를 막도록 모세에게 요구하는 듯한 표현 대신, 원문의 금지/청원 의미를 ‘말씀하지 않으시기를 바랍니다’로 옮겼습니다. פֶּן נָמוּת은 두려운 결과를 나타내므로 ‘우리가 죽을까 합니다’로 보존했습니다. 각주 표지는 설명 대상인 ‘듣겠습니다’에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:43:01Z'
