  naturalness: 현대 표준어 합쇼체에서 모세에게 직접 ‘당신이’라고 하는 표현은 다소 부자연스럽고 거리감이 있습니다. ‘모세께서’로 명시하면 원문의 강조를 자연스럽게 살릴 수 있습니다. 또한 각주 표지는 해당 어휘인 ‘듣겠습니다’ 바로 뒤에 두는 것이 적절합니다.
