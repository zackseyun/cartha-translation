    rationale: ‘너희와 함께’가 ‘너희에게’보다 직접적이라는 단정은 한국어 의미상 분명하지 않습니다. 원문의 전치사가 직역하면 ‘너희와’임을 밝히고, 문맥상 본문에서는 ‘너희에게’로 자연스럽게 옮겼다고 설명하는 편이 정확합니다.
