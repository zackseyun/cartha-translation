  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
  footnotes:
  - marker: a
    text: Or “the Israelites” or “the children of Israel.” The Hebrew is literally “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “I have spoken to you.” The Hebrew more literally says “with you,” emphasizing direct encounter.
    reason: lexical_alternative
  - marker: c
    text: Hebrew “from the heavens”; English idiom commonly renders this as “from heaven.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “너는 이스라엘의 자손들에게 이렇게 말하십시오. 너희는 내가 하늘에서 너희와 함께 말한 것을 직접 보았습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “이스라엘의 아들들”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “너희에게”보다 더 직접적인 뉘앙스의 “너희와 함께”라고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 “하늘들로부터”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 고유한 언약명 표기를 따라 יְהוָה는 ‘야훼’로 옮기고, 통상적 대체어인 ‘주’는 피했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 형식을 그대로 살리면서도 한국어에서 자연스러운 집단 지칭으로 옮겼습니다.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  english_pob_choice: I have spoken with you
  chosen_korean: 너희와 함께 말한
  alternatives_korean:
  - 너희에게 말한
  - 너희에게서 말한
  lexicon: HALOT
  rationale: עִם의 기본 의미인 ‘~와 함께’를 살려 단순한 일방향 발화보다 직접적 만남의 뉘앙스를 반영했습니다.
- source_word: מִן הַשָּׁמַיִם
  english_pob_choice: from heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘로부터
  - 하늘에서부터
  lexicon: HALOT
  rationale: 복수형 히브리어를 한국어 관용에 맞게 단수적 의미의 ‘하늘’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 발화 방식과 직접성
  chosen_reading: ‘너희와 함께 말한’으로 옮겨, 시내산에서의 직접적 현현과 만남의 성격을 드러냈습니다.
  alternative_readings:
  - ‘너희에게 말한’
  - ‘너희에게 말하였다’
  rationale: 본문은 단순한 정보 전달이 아니라 하나님이 백성과 직접 접촉하셨음을 강조하므로, עִם의 함의를 살리는 번역이 더 적절합니다.
  doctrine_reference: 출애굽기 20장 시내산 계시의 직접성
- issue: ‘이스라엘의 자손들’의 성별-정확성
  chosen_reading: 집단을 가리키되 남성 복수 형식을 유지했습니다.
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  rationale: 원문 형식을 완화하지 않고, 언약 공동체를 가리키는 남성 복수의 표지를 보존하는 것이 소스 충실성에 부합합니다.
  doctrine_reference: '번역 철학 §4: gender-accurate over gender-neutral'
