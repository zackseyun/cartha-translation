translation:
  language: ko
  text: 안식일을 기억하여, 그것을 거룩하게 지키십시오.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘그것을 거룩하게 하라’ 혹은 ‘거룩한 것으로 구별하라’.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  english_pob_choice: Remember
  chosen_korean: 기억하여
  alternatives_korean:
  - 기억하십시오
  - 명심하십시오
  - 기억해 두십시오
  lexicon: HALOT
  rationale: 히브리어 분사형 명령은 단순 인지가 아니라 의도적 기억과 그에 따른 행동을 요구하므로, 현대 한국어에서는 자연스럽게 연결되는 ‘기억하여’가 가장 직접적입니다.
- source_word: הַשַּׁבָּת
  english_pob_choice: the Sabbath
  chosen_korean: 안식일
  alternatives_korean:
  - 그 안식일
  - 사바트
  lexicon: HALOT
  rationale: שַׁבָּת의 표준적 성경 번역어는 ‘안식일’이며, 본문의 언약적·예배적 의미를 한국어 독자에게 가장 분명하게 전달합니다.
- source_word: לְקַדְּשׁוֹ
  english_pob_choice: to keep it holy
  chosen_korean: 거룩하게 지키십시오
  alternatives_korean:
  - 거룩하게 하십시오
  - 성별하십시오
  - 거룩하게 구별하십시오
  lexicon: HALOT
  rationale: קדשׁ의 목적 용법은 그 날을 거룩하게 여기고 다루라는 뜻이므로, 현대 한국어에서 ‘거룩하게 지키다’가 ‘keep it holy’의 기능과 신학적 무게를 함께 살립니다.
theological_decisions:
- issue: קדשׁ 동사의 목적 표현을 한국어로 어떻게 살릴지
  chosen_reading: ‘거룩하게 지키십시오’로 옮겨, 단순한 준수 규정이 아니라 하나님께 구별된 날로 대하라는 뜻을 드러냅니다.
  alternative_readings:
  - 거룩하게 하십시오
  - 성별하십시오
  rationale: 본문은 안식일을 단지 지키는 데 그치지 않고 거룩한 것으로 대하라는 목적을 말하므로, ‘지키다’와 ‘거룩하게’의 결합이 가장 자연스럽고 오해를 줄입니다.
  doctrine_reference: 출애굽기 20장의 안식일 계명; 거룩함의 구별 개념
