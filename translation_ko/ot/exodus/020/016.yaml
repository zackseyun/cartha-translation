lexical_decisions:
- source_word: לֹא
  english_pob_choice: not
  chosen_korean: ~해서는 안 됩니다
  alternatives_korean:
  - ~하지 마십시오
  - ~하면 안 됩니다
  lexicon: HALOT
  rationale: 계명문의 금지형을 현대 표준어 합쇼체로 자연스럽게 옮기기 위해 부정 명령 표현을 사용했습니다.
- source_word: תַעֲנֶה
  english_pob_choice: you shall bear witness
  chosen_korean: 증언을 하다
  alternatives_korean:
  - 증언하다
  - 증거하다
  - 답하다
  lexicon: HALOT
  rationale: 법정적 문맥에서 ענה는 ‘답하다’보다 ‘증언하다/증언을 하다’가 더 정확하며, POB의 ‘bear witness’에 대응하는 한국어로도 가장 자연스럽습니다.
- source_word: בְרֵעֲךָ
  english_pob_choice: against your neighbor
  chosen_korean: 이웃에 대하여
  alternatives_korean:
  - 이웃에게 대하여
  - 동료에 대하여
  - 이웃을 향하여
  lexicon: HALOT
  rationale: ב가 여기서는 해를 끼치는 방향성을 띤 법정 문맥으로 읽히므로 ‘~에 대하여’로 옮겨, 증언의 대상이 되는 사람을 분명히 했습니다.
- source_word: עֵד שָׁקֶר
  english_pob_choice: false witness
  chosen_korean: 거짓 증언
  alternatives_korean:
  - 거짓 증인
  - 거짓 증거
  - 가짜 증언
  lexicon: HALOT
  rationale: 히브리어는 ‘증인’이라는 인물보다 ‘거짓된 증언’이라는 행위 자체를 강조하므로, 한국어에서는 법정 관용에 맞는 ‘거짓 증언’이 가장 적절합니다.
theological_decisions:
- issue: 계명문의 법정적 금지 표현을 현대 한국어로 어떻게 유지할 것인가
  chosen_reading: 직설적이고 간명한 금지문으로 옮겨, 제6계명(출 20:16)의 공적·윤리적 무게를 보존했습니다.
  alternative_readings:
  - 이웃에게 거짓말하지 말아야 합니다
  - 이웃에 대해 거짓 증언하지 마십시오
  rationale: 본문은 단순한 일반적 거짓말 금지보다 법정에서의 허위 증언을 겨냥하므로, 윤리적 일반화보다 법정적 초점을 살리는 번역이 source-direct합니다.
  doctrine_reference: 출애굽기 20장 십계명 문맥
