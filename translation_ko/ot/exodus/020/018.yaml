base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: Now all the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
  footnotes:
  - marker: a
    text: Hebrew literally 'the sounds' or 'the voices'; in context this likely refers to thunder.
    reason: lexical_alternative
  - marker: b
    text: Or 'torches'; in this context the term likely refers to lightning-like flashes of fire.
    reason: lexical_alternative
  - marker: c
    text: Hebrew says the people were 'seeing' phenomena that include sound, preserving the overwhelming sensory character of the scene.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 백성이 우레[a]와 불꽃의 번쩍임[b], 나팔 소리와 연기 나는 산을 보고 있었으며[c], 백성은 그것을 보고 떨며 멀리 떨어져 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 소리들’ 또는 ‘그 목소리들’입니다. 이 문맥에서는 우레를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘횃불들’입니다. 이 문맥에서는 불꽃이나 번개 같은 번쩍임을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 소리를 포함한 현상들을 사람들이 ‘보고’ 있었다고 표현하여, 압도적인 현현의 감각 교차를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים / וַיַּרְא
  english_pob_choice: were seeing / saw it
  chosen_korean: “보고 있었는데 … 보고”
  alternatives_korean:
