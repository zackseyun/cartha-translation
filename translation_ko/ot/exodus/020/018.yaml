base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: Now all the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
  footnotes:
  - marker: a
    text: Hebrew literally 'the sounds' or 'the voices'; in context this likely refers to thunder.
    reason: lexical_alternative
  - marker: b
    text: Or 'torches'; in this context the term likely refers to lightning-like flashes of fire.
    reason: lexical_alternative
  - marker: c
    text: Hebrew says the people were 'seeing' phenomena that include sound, preserving the overwhelming sensory character of the scene.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 온 백성이 우레와 불꽃의 번쩍임[a], 그리고 나팔 소리와 산의 연기를 보고 있었는데, 백성이 그것을 보고[b][c] 떨며 멀리 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 소리들’ 또는 ‘그 목소리들’입니다. 이 문맥에서는 우레를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘보고 있던’ 상태를 이어가며, 사람들이 소리까지 포함한 현현을 ‘보고’ 있었다는 히브리어의 감각 교차 표현을 살립니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 사람들이 방금 열거된 현상 전체를 가리키는 대상을 함께 ‘보고’ 있다고 말합니다.
    reason: source_note
lexical_decisions:
- source_word: רֹאִים / וַיַּרְא
  english_pob_choice: were seeing / saw it
  chosen_korean: “보고 있었는데 … 보고”
  alternatives_korean:
  - 보았습니다
  - 지켜보고 있었습니다
  - 인지하고 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 진행적·반복적 느낌과, 소리까지 포함한 압도적 현현을 한꺼번에 받아들이는 장면을 살리기 위해 단순 과거보다 “보고 있었는데”로 옮겼습니다.
- source_word: הַקּוֹלֹת
  english_pob_choice: the thunder
  chosen_korean: “우레”
  alternatives_korean:
  - 천둥
  - 소리들
  - 목소리들
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 ‘소리’보다 시내 현현의 자연현상인 천둥/우레가 더 적절하므로, 한국어에서도 압축적이고 성경적 울림이 있는 “우레”를 택했습니다.
- source_word: הַלַּפִּידִם
  english_pob_choice: the flashes of fire
  chosen_korean: “불꽃의 번쩍임”
  alternatives_korean:
  - 횃불들
  - 번개 같은 불빛
  - 불의 번쩍임
  lexicon: HALOT
  rationale: 직역하면 ‘횃불들’이지만, 이 신현 맥락에서는 실제 횃불보다 눈부신 불의 번쩍임이 더 자연스럽고 원문 의도를 잘 드러내므로 그렇게 옮겼습니다.
- source_word: וְ/אֶת הָ/הָר עָשֵׁן
  english_pob_choice: the mountain smoking
  chosen_korean: “산의 연기”
  alternatives_korean:
  - 연기 나는 산
  - 연기 속의 산
  - 산이 연기나고
  lexicon: HALOT
  rationale: 히브리어의 상태 표현을 한국어에서 매끄럽게 풀어 “산의 연기”로 옮겼고, 장면의 시각적 인상을 유지했습니다.
theological_decisions:
- issue: 감각 교차 표현(‘소리’를 ‘보다’)을 어떻게 처리할지
  chosen_reading: ‘보고 있었습니다’와 ‘그것을 보고’로 유지해, 사람들이 소리를 포함한 현현을 ‘본’ 원문의 긴장을 보존했습니다.
  alternative_readings:
  - ‘천둥을 들었습니다’로 정상화하기
  - ‘현상을 목격했습니다’로 완화하기
  rationale: 본문은 청각적 현상을 시각적으로 ‘보는’ 표현을 의도적으로 사용하므로, 이를 매끈하게 정리하지 않고 원문의 압도감을 그대로 드러내는 것이 더 충실합니다.
  doctrine_reference: 출 20:18의 신현 묘사와 번역 원칙상 긴장 보존
