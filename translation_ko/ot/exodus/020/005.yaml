id: EXO.20.5
reference: Exodus 20:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
  footnotes:
  - marker: a
    text: Or 'prostrate yourself to them'; the Hebrew verb refers to bowing oneself down in reverence.
    reason: lexical_alternative
  - marker: b
    text: Or 'worship them'; the verb 'serve' here can refer to cultic service offered to idols.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'visiting the iniquity of fathers on children.' This wording preserves the Hebrew idiom; compare Deuteronomy 24:16 and Ezekiel 18 for related teaching on individual responsibility.
    reason: cross_reference
  - marker: d
    text: Or 'to the third and fourth generation of those who hate me.'
    reason: alternative_reading
translation:
  language: ko
  text: 너는 그들에게 절하지도 말고, 섬기지도 마십시오[a][b]. 나 야훼, 당신의 하나님은 질투하는 하나님입니다. 나는 아버지들의 죄악을 자녀들에게, 곧 나를 미워하는 자들의 삼대와 사대까지 살피고 갚습니다[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "그들에게 몸을 굽혀 절하지도 말고". 히브리어 동사는 경외의 자세로 몸을 굽히는 동작을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 "그들을 섬기지도 말고". 이 동사는 우상에게 드리는 제의적 섬김을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 "아버지들의 죄악을 자녀들에게"입니다. 이 표현은 히브리어 관용구를 보존한 것으로, 관련 본문인 신명기 24:16과 에스겔 18장을 함께 보십시오.
    reason: cross_reference
  - marker: d
    text: 또는 "나를 미워하는 자들의 삼대와 사대까지".
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  english_pob_choice: bow down
  chosen_korean: 절하지도 말고
  alternatives_korean:
  - 엎드려 절하지도 말고
  - 경배하지도 말고
  lexicon: HALOT
  rationale: 히브리어는 예배 행위보다 먼저 몸을 굽히는 구체적 동작을 가리키므로, 한국어도 '절하다'로 동작성을 살렸습니다.
- source_word: תָעָבְדֵם
  english_pob_choice: serve them
  chosen_korean: 섬기지도 마십시오
  alternatives_korean:
  - 예배하지도 마십시오
  - 노역하지도 마십시오
  lexicon: HALOT
  rationale: עבד는 기본적으로 '섬기다'이며, 우상 숭배 맥락에서도 앞 동사와 구별되는 종교적 봉사를 뜻할 수 있어 '섬기다'를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신적 고유명사는 '야훼'로 옮겨, 호칭이 아닌 고유 이름임을 드러냈습니다.
- source_word: אֵל קַנָּא
  english_pob_choice: a jealous God
  chosen_korean: 질투하는 하나님입니다
  alternatives_korean:
  - 열성적인 하나님입니다
  - 질투하시는 하나님입니다
  lexicon: HALOT
  rationale: 언약의 배타성을 드러내는 קַנָּא를 '질투하는'으로 옮겨, 단순한 열심보다 독점적 언약 관계의 긴장을 보존했습니다.
- source_word: פֹּקֵד עֲוֺן אָבֹת עַל בָּנִים
  english_pob_choice: visiting the iniquity of fathers on children
  chosen_korean: 아버지들의 죄악을 자녀들에게… 살피고 갚습니다
  alternatives_korean:
  - 아버지들의 죄악을 자녀들에게… 방문하십니다
  - 아버지들의 죄악을 자녀들에게… 벌하십니다
  lexicon: HALOT
  rationale: פּקד의 관용적 법정·감찰 의미를 살리면서, 한국어에서는 '살피고 갚다'로 하나님의 সক동적 심판을 자연스럽게 표현했습니다.
- source_word: אָבֹת / בָּנִים
  english_pob_choice: fathers / children
  chosen_korean: 아버지들 / 자녀들
  alternatives_korean:
  - 조상들 / 자손들
  - 부친들 / 아이들
  lexicon: HALOT
  rationale: 히브리어가 남성 복수형을 사용하므로 '아버지들'을 유지했고, descendants의 범위를 넓게 담기 위해 '자녀들'로 옮겼습니다.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  english_pob_choice: on the third and on the fourth generations
  chosen_korean: 삼대와 사대까지
  alternatives_korean:
  - 세대와 네 대까지
  - 3대와 4대까지
  lexicon: HALOT
  rationale: 히브리어의 세대 관용구를 한국어의 자연스러운 족계 표현인 '삼대와 사대'로 옮겨, 반복되는 수사와 범위를 간결하게 살렸습니다.
- source_word: לְשֹׂנְאָי
  english_pob_choice: of those who hate me
  chosen_korean: 나를 미워하는 자들
  alternatives_korean:
  - 나를 증오하는 자들
  - 나를 미워하는 사람들
  lexicon: HALOT
  rationale: 관계적 적대와 언약 위반을 나타내는 표현이므로, 직역성을 유지하되 한국어에서 자연스러운 '나를 미워하는 자들'로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름과 신적 호칭 구분
  chosen_reading: '"나 야훼, 당신의 하나님"'
  alternative_readings:
  - '"나는 주 당신의 하나님"'
  - '"나는 야훼 너의 하나님"'
  rationale: 야훼를 고유명사로 드러내고, 2인칭 대상을 공손한 '당신'으로 처리해 계명문의 직접성을 유지했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 아버지들의 죄악이 자녀들에게 미친다는 경고의 관용구
  chosen_reading: '"아버지들의 죄악을 자녀들에게… 살피고 갚습니다"'
  alternative_readings:
  - '"아버지들의 죄악을 자녀들에게 벌합니다"'
  - '"아버지들의 죄악을 자녀들에게 돌립니다"'
  rationale: 히브리어의 관용구를 너무 신학적으로 평탄화하지 않고 보존해, 출 20:5의 긴장을 유지하면서도 신명기 24:16, 에스겔 18장과의 정경적 읽기를 열어 둡니다.
  doctrine_reference: Translation philosophy §3
