translation:
  language: ko
  text: 그러나 수천에게[a], 곧 나를 사랑하고 내 계명을 지키는 이들에게 한결같은 사랑을 베푸십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천 세대에게’로 이해할 수 있습니다(신명기 5:10 비교). 여기의 히브리어는 단순히 ‘수천’이라고 되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  english_pob_choice: but showing
  chosen_korean: 그러나 인자하셔서
  alternatives_korean:
  - 그리고 인자하셔서
  - 또 인자하셔서
  lexicon: HALOT
  rationale: 앞절의 심판 선언과 대조되는 분사 용법을 살려 ‘그러나’로 역접을 드러내고, חֶסֶד의 행위를 ‘인자’로 옮겨 언약적 사랑의 뉘앙스를 살렸습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인자
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 자애
  lexicon: HALOT
  rationale: חֶסֶד는 단순한 ‘자비’보다 언약적이고 신실한 사랑을 가리키므로, 성경적 어법에서 친숙하면서도 의미를 넓게 담는 ‘인자’를 택했습니다.
- source_word: לַ/אֲלָפִ֑ים
  english_pob_choice: to thousands
  chosen_korean: 수천 대까지
  alternatives_korean:
  - 수천 명에게
  - 수천 세대까지
  lexicon: HALOT
  rationale: 히브리어 본문은 ‘천들/수천’만 말하고 ‘세대’는 직접 말하지 않으므로, 본문에 없는 해석을 덧붙이지 않도록 ‘수천 대까지’로 옮겼습니다.
- source_word: לְ/אֹהֲבַ֖/י
  english_pob_choice: to those who love me
  chosen_korean: 나를 사랑하고
  alternatives_korean:
  - 나를 사랑하는 이들에게
  - 내 사랑하는 자들에게
  lexicon: HALOT
  rationale: 1인칭 접미사가 붙은 분사구를 자연스러운 관계절/서술형으로 풀되, 언약적 충성의 대상을 분명히 하기 위해 ‘나를 사랑하고’로 옮겼습니다.
- source_word: וּ/לְ/שֹׁמְרֵ֥י
  english_pob_choice: and keep
  chosen_korean: 내 계명들을 지키는 이들에게는
  alternatives_korean:
  - 내 계명들을 지키는 자들에게는
  - 내 계명들을 지켜
  lexicon: HALOT
  rationale: שׁמר는 여기서 계명에 대한 준수·보존의 뜻이므로, 한국어 성경의 일반적이면서도 의미를 정확히 담는 ‘지키다’를 사용했습니다.
theological_decisions:
- issue: ‘to thousands’의 범위
  chosen_reading: 본문에 없는 ‘세대’를 덧붙이지 않고 ‘수천 대까지’로 보존했습니다.
  alternative_readings:
  - 수천 세대까지
  - 천대까지
  rationale: 출애굽기 20:6의 히브리어는 ‘천들/수천’만 말하므로, 신학적 전통 해석을 본문 자체로 오해하지 않게 하려면 직접 표현을 유지하는 것이 맞습니다. 다만 문맥상 매우 넓은 지속성을 암시하므로 그 효과는 살렸습니다.
  doctrine_reference: 원문 우선 원칙; 본문에 없는 해석 요소를 주석이 아닌 본문에 삽입하지 않음
