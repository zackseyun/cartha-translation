  source_fidelity: ‘수천 대까지’는 히브리어 לַאֲלָפִים에 없는 ‘대/세대’의 뜻을 본문에 도입합니다. 또한 현 번역은 ‘이들에게는’으로 끝나 문장이 미완결입니다. 본문은 ‘수천’을 유지하고, 세대 해석은 각주로 한정해야 합니다.
  naturalness: ‘인자하셔서’와 뒤의 ‘이들에게는’의 결합은 현대 한국어 문장으로 자연스럽지 않고 서술어가 빠져 있습니다. ‘한결같은 사랑을 베푸십니다’로 완결된 합쇼체 문장으로 다듬는 것이 자연스럽습니다.
  terminology: חֶסֶד는 여기서 ‘한결같은 사랑’으로 옮겨 신실하고 지속적인 사랑의 의미를 현대 표준어로 드러냈습니다. מִצְוֺתָי는 십계명 문맥에 맞게 ‘내 계명’을 유지했습니다.
