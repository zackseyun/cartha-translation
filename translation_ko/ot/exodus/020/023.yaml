  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
  footnotes:
  - marker: a
    text: Or 'with me' or 'beside me.' The Hebrew is literally 'with me'; 'beside me' is a common interpretive rendering emphasizing the prohibition of rival gods.
