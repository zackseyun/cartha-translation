translation:
  language: ko
  text: 너희는 내 곁에 둘[a] 은 신들을 만들지 말며, 너희 자신을 위하여 금 신들을 만들지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나와 함께’입니다. ‘내 곁에 둘’은 하나님과 병립시키는 신들을 만들지 말라는 문맥상의 뜻을 드러낸 번역입니다.
    reason: lexical_alternative
