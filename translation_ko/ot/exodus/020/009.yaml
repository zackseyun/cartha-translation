review_pass:
  verdict: revise
  source_fidelity: 히브리어는 ‘엿새’라는 기간과 두 동사(תעבד, ‘일하다/수고하다’; ועשית, ‘하다’)를 병렬로 두며, ‘네 모든 일’을 후자의 목적어로 둡니다. 본문은 대체로 이를 반영하지만, 각주 대안은 ‘네 모든 일’을 빠뜨려 원문의 범위를 보존하지 못합니다.
  naturalness: ‘엿새 동안은 수고하며 네 모든 일을 해야 합니다’는 현대 표준 한국어로 이해 가능하며 합쇼체의 규범적 어조도 적절합니다. 다만 병렬 동사를 더 직접적으로 드러내는 ‘수고하고’가 자연스럽고 명료합니다.
  terminology: ‘수고하다’는 עבד의 ‘일하다/노동하다’를 이 문맥에서 무리 없이 전달하며, ‘네 모든 일’은 כל־מלאכתך의 총괄적 의미를 보존합니다. 각주의 ‘일하다’는 수고하다의 적절한 어휘 대안이지만, 목적어를 포함해야 합니다.
  issues:
  - severity: medium
    issue: 각주 대안이 원문의 후반부를 누락합니다.
    rationale: ‘또는 ‘엿새 동안 일해야 합니다.’’는 ‘and do all your work’/ועשית כל מלאכתך를 포함하지 않아, 단순 어휘 대안이 아니라 내용 축소가 됩니다.
  - severity: low
    issue: 본문의 접속 표현을 더 직접적으로 다듬을 수 있습니다.
    rationale: ‘수고하고 네 모든 일을 해야 합니다’는 두 히브리어 동사의 병렬과 계명문의 지시적 힘을 더 분명하게 나타냅니다.
  revised_text: 엿새 동안은 수고하고 네 모든 일을 해야 합니다.[a]
