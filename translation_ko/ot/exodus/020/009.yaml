lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  english_pob_choice: Six days
  chosen_korean: 엿새 동안은
  alternatives_korean:
  - 여섯 날 동안은
  - 엿새는
  lexicon: HALOT
  rationale: 히브리어의 수사구를 한국어에서 가장 자연스럽게 살려, 기간을 나타내는 ‘엿새 동안’으로 옮겼습니다.
- source_word: תַּעֲבֹד
  english_pob_choice: you shall labor
  chosen_korean: 수고하며
  alternatives_korean:
  - 일하며
  - 노동하며
  - 일해야 합니다
  lexicon: HALOT
  rationale: עבד의 ‘일하다/노동하다’ 의미를 살리되, 안식일 계명 문맥에서 단순한 업무보다 강한 수고의 뉘앙스를 전달하려고 ‘수고하며’를 택했습니다.
- source_word: וְעָשִׂיתָ
  english_pob_choice: and do
  chosen_korean: 해야 합니다
  alternatives_korean:
  - 하고
  - 행하며
  - 하며
  lexicon: HALOT
  rationale: 앞 절의 명령적 문맥을 한국어 법령체로 자연스럽게 풀어, 병렬 동사를 하나의 명령으로 정리했습니다.
- source_word: מְלַאכְתֶּךָ
  english_pob_choice: your work
  chosen_korean: 네 모든 일
  alternatives_korean:
  - 네 일
  - 네 일거리
  - 네 직무
  lexicon: HALOT
  rationale: מְלָאכָה의 일반적 ‘일/업무’ 의미를 따라, ‘모든’과 결합된 총괄 표현으로 ‘네 모든 일’을 선택했습니다.
theological_decisions:
- issue: 계명문의 명령성 보존
  chosen_reading: 단순 서술이나 허락이 아니라 규범적 명령으로 읽히도록 ‘해야 합니다’로 옮겼습니다.
  alternative_readings:
  - 할 수 있습니다
  - 일합니다
  - 일해야 합니다
  rationale: 십계명의 법령적 어조를 유지하기 위해, 히브리어 미완료형의 지시적 기능을 한국어 명령문으로 반영했습니다.
  doctrine_reference: Translation philosophy §1, §5
