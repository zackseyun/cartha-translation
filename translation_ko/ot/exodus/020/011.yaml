base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
  footnotes:
  - marker: a
    text: Or 'he ceased' on the seventh day. The Hebrew verb can emphasize settling into rest or ceasing from work.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 엿새 동안 하늘과 땅과 바다와 그 안에 있는 모든 것을 만드시고, 일곱째 날에 쉬셨기 때문입니다[a]. 그러므로 야훼께서 안식일을 복되게 하시고 거룩하게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그치셨다’로도 옮길 수 있습니다. 히브리어 동사는 안식에 드는 것 또는 일을 그치는 것을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  english_pob_choice: in six days
  chosen_korean: 엿새 동안에
  alternatives_korean:
  - 여섯 날에
  - 엿새에
  lexicon: HALOT
  rationale: 시간의 범위를 자연스럽게 드러내면서도 창조 행위의 기간을 직접적으로 반영합니다.
