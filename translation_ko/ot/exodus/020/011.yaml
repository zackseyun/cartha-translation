  - 그치셨기 때문입니다
  lexicon: HALOT
  rationale: 안식일 근거 문맥에서는 ‘쉬다’가 가장 자연스럽지만, 단순한 피로가 아니라 창조 사역의 중지를 포함할 수 있는 긴장을 유지합니다.
theological_decisions:
- issue: ‘쉬셨다’가 하나님의 피곤함을 뜻하는지 여부
  chosen_reading: 일곱째 날에 쉬셨기 때문입니다
  alternative_readings:
  - 일곱째 날에 그치셨기 때문입니다
  rationale: 히브리어 동사는 안식과 중지를 모두 함의할 수 있으므로, 본문이 말하는 것은 피로가 아니라 안식일을 위한 모범이라는 점을 과잉 해석 없이 반영했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (preserve tension rather than over-resolve)
