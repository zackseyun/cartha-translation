base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
  footnotes:
  - marker: a
    text: Or 'he ceased' on the seventh day. The Hebrew verb can emphasize settling into rest or ceasing from work.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 엿새 동안에 야훼께서 하늘과 땅[a], 바다와 그 안에 있는 모든 것을 만드시고, 일곱째 날에 쉬셨기 때문입니다. 그러므로 야훼께서 안식일을 복 주시고 그것을 거룩하게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그치셨다’로도 옮길 수 있습니다. 히브리어 동사는 쉬어 들어감과 일에서 멈춤을 모두 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  english_pob_choice: in six days
  chosen_korean: 엿새 동안에
  alternatives_korean:
  - 여섯 날에
  - 엿새에
  lexicon: HALOT
  rationale: 시간의 범위를 자연스럽게 드러내면서도 창조 행위의 기간을 직접적으로 반영합니다.
- source_word: עָשָׂה
  english_pob_choice: made
  chosen_korean: 만드시고
  alternatives_korean:
  - 하셨고
  - 지으시고
  lexicon: HALOT
  rationale: 창조 행위라는 문맥에서 하나님의 주도적 ‘만드심’을 잘 드러내는 표준적 선택입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 하나님의 고유 이름이므로 тит울이 아니라 고유명사로 옮겨, 프로젝트 기본값을 따랐습니다.
- source_word: וַיָּנַח
  english_pob_choice: he rested
  chosen_korean: 쉬셨기 때문입니다
  alternatives_korean:
  - 쉬셨기 때문입니다
  - 그치셨기 때문입니다
  lexicon: HALOT
  rationale: 안식일 근거 문맥에서는 ‘쉬다’가 가장 자연스럽지만, 단순한 피로가 아니라 창조 사역의 중지를 포함할 수 있는 긴장을 유지합니다.
theological_decisions:
- issue: ‘쉬셨다’가 하나님의 피곤함을 뜻하는지 여부
  chosen_reading: 일곱째 날에 쉬셨기 때문입니다
  alternative_readings:
  - 일곱째 날에 그치셨기 때문입니다
  rationale: 히브리어 동사는 안식과 중지를 모두 함의할 수 있으므로, 본문이 말하는 것은 피로가 아니라 안식일을 위한 모범이라는 점을 과잉 해석 없이 반영했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (preserve tension rather than over-resolve)
