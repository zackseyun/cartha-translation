  source_fidelity: 히브리어의 반복된 금지, 첫 절의 ‘집’과 뒤따르는 별도 항목들의 구별, 그리고 마지막의 포괄 표현을 대체로 충실히 반영했습니다. 다만 ‘당신의 이웃’은 성서 한국어 문맥에서 불필요하게 직역투이며, 두 번째 목록에서 ‘그의’의 지시 대상을 더 분명히 하는 편이 안전합니다.
  naturalness: ‘당신의 이웃의’는 현대 표준 한국어에서 중복적이고 다소 부자연스럽습니다. 한국어에서는 소유·인칭이 문맥상 분명하므로 ‘이웃의’로 자연스럽게 표현할 수 있습니다. 또한 병렬 항목은 ‘남자 노예와 여자 노예, 소와 나귀’로 연결하면 더 매끄럽습니다.
  terminology: ‘탐내다’, ‘집’, ‘아내’, ‘남자 노예/여자 노예’, ‘소’, ‘나귀’는 원문의 법적·윤리적 어조와 어휘를 적절히 반영합니다. ‘노예’는 이 재산 목록에서 원문의 결박된 신분을 흐리지 않습니다.
  issues:
  - severity: low
    issue: ‘당신의 이웃의’라는 소유 표현
    rationale: 히브리어의 2인칭 소유는 한국어에서 문맥상 드러나므로 매번 ‘당신의’를 넣을 필요가 없습니다. 특히 ‘당신의 이웃의’는 직역투이고 현대 한국어 성서 문체로도 덜 자연스럽습니다.
  - severity: low
    issue: ‘그의 남자 노예, 여자 노예’의 병렬 및 지시 대상
    rationale: ‘그의’를 한 번만 두면 두 번째 항목에도 걸린다는 것은 알 수 있으나, ‘그 이웃의 남자 노예와 여자 노예’로 하면 소유 관계와 병렬이 더 명확하고 자연스럽습니다.
  revised_text: 이웃의 집을 탐내지 마십시오. 이웃의 아내나 그 이웃의 남자 노예와 여자 노예, 소와 나귀, 또는 이웃에게 속한 어떤 것도 탐내지 마십시오.
  revised_footnotes:
