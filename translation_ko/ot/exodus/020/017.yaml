    reason: lexical_alternative
  revision_rationale: 불필요한 ‘당신의’를 삭제하여 현대 표준 한국어의 자연스러움을 높이고, 목록 안의 소유 관계와 병렬을 명확히 했습니다. 금지의 반복, ‘집’의 일차적 의미, 노예 용어, 그리고 마지막의 포괄적 소유 표현은 유지했습니다.
