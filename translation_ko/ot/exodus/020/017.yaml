  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male slave, or his female slave, or his ox, or his donkey, or anything that belongs to your neighbor.
  footnotes:
  - marker: a
    text: Or 'your neighbor’s household.' The Hebrew word for 'house' can also refer to a household, though here 'house' fits the separate listing that follows.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 이웃의 집을 탐내지 마십시오. 당신의 이웃의 아내[a]나 그의 남자 노예, 여자 노예, 소, 나귀, 또는 당신의 이웃에게 속한 무엇이든 탐내지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이웃의 집안'일 수 있습니다. 히브리어 '집'은 가정/가문을 뜻할 수도 있지만, 여기서는 뒤의 개별 목록과 함께 볼 때 '집'이 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  english_pob_choice: covet
  chosen_korean: 탐내지 마십시오
  alternatives_korean:
  - 욕심내지 마십시오
  - 간절히 바라지 마십시오
  lexicon: HALOT
  rationale: המד의 이 계명용법은 단순한 바람보다 타인의 것을 불의하게 원하는 뜻이므로, 한국어로는 윤리적 금지의 힘을 살리는 '탐내다'가 가장 직접적입니다.
- source_word: בֵּית רֵעֶךָ
  english_pob_choice: your neighbor’s house
  chosen_korean: 당신의 이웃의 집
  alternatives_korean:
  - 당신의 이웃의 가문
  - 당신의 이웃의 집안
  lexicon: HALOT
  rationale: בַּיִת는 집/가문/가정을 가리킬 수 있지만, 뒤에 아내·노예·가축이 따로 열거되므로 여기서는 먼저 '집'으로 옮기는 것이 구조를 가장 잘 드러냅니다.
- source_word: עַבְדּוֹ / אֲמָתוֹ
  english_pob_choice: his male slave / his female slave
  chosen_korean: 그의 남자 노예, 여자 노예
  alternatives_korean:
  - 그의 남종, 여종
  - 그의 남자 종, 여자 종
  lexicon: HALOT
  rationale: 이 문맥은 재산 목록 안에서 결박된 신분을 분명히 드러내므로, 프로젝트 기준에 따라 완화된 '종'보다 '노예'가 원문 의미를 더 정확히 반영합니다.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  english_pob_choice: anything that belongs to your neighbor
  chosen_korean: 당신의 이웃에게 속한 무엇이든
  alternatives_korean:
  - 당신의 이웃의 어떤 것이든
  - 당신의 이웃에게 속한 모든 것
  lexicon: HALOT
  rationale: 마지막 포괄구는 앞의 항목들을 모두 묶는 총괄 표현이므로, 소유 관계를 분명히 하면서도 현대 한국어로 자연스러운 '무엇이든'으로 옮겼습니다.
theological_decisions:
- issue: 첫 절의 'house'를 '집'으로 유지할지 '가정/집안'으로 확장할지
  chosen_reading: '''집''을 유지했습니다.'
  alternative_readings:
  - '''집안'' 또는 ''가정''으로 확장'
  - '''가문''으로 해석'
  rationale: 본문은 뒤이어 아내, 노예, 가축을 개별 항목으로 나열하므로, 첫 항목을 '집'으로 두어 별개의 소유물 목록이라는 구조를 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
