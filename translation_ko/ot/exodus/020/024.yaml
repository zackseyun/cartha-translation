source:
  edition: WLC
  text: מִזְבַּ֣ח אֲדָמָה֮ תַּעֲשֶׂה לִּ/י֒ וְ/זָבַחְתָּ֣ עָלָ֗י/ו אֶת עֹלֹתֶ֨י/ךָ֙ וְ/אֶת שְׁלָמֶ֔י/ךָ אֶת צֹֽאנְ/ךָ֖ וְ/אֶת בְּקָרֶ֑/ךָ בְּ/כָל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אַזְכִּ֣יר אֶת שְׁמִ֔/י אָב֥וֹא אֵלֶ֖י/ךָ וּ/בֵרַכְתִּֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
  footnotes:
  - marker: a
    text: Or 'where I proclaim my name' or 'where I record my name.' The Hebrew verb is causative ('cause to be remembered/mentioned'), and the exact nuance may include proclamation, memorialization, or invocation of God's name.
    reason: lexical_alternative
translation:
  language: ko
  text: 흙으로 제단을 만드십시오[a]. 그 위에서 번제와 화목제를 드리되, 양 떼와 소 떼를 드리십시오. 내가 내 이름을 기억하게 하는 모든 곳에서, 내가 당신에게 와서 당신에게 복을 주겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 이름을 선포하게 하는 곳’ 혹은 ‘내 이름을 기록하게 하는 곳’. 히브리어 동사는 사역형으로, 정확한 뉘앙스는 선포, 기념, 기록, 호칭을 모두 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  english_pob_choice: an altar of earth
  chosen_korean: 흙으로 제단
  alternatives_korean:
  - 흙 제단
  - 땅의 제단
  - 흙으로 만든 제단
  lexicon: WLC + HALOT
  rationale: ‘아다마’는 땅/흙의 재료를 가리키므로, 재질을 드러내는 ‘흙으로 제단’이 본문의 구체성을 살리면서도 자연스럽습니다.
- source_word: וְזָבַחְתָּ עָלָיו
  english_pob_choice: and on it you shall sacrifice
  chosen_korean: 그 위에서 … 드리되
  alternatives_korean:
  - 그 위에서 … 제사드리되
  - 그 위에 … 제물로 바치되
  lexicon: HALOT
  rationale: 제의 문맥의 זבח는 단순한 도살이 아니라 제사를 드리는 행위이므로, 한국어에서는 ‘드리다’로 옮겨 제의성을 유지했습니다.
- source_word: עֹלֹתֶיךָ … שְׁלָמֶיךָ
  english_pob_choice: your burnt offerings and your peace offerings
  chosen_korean: 번제와 화목제
  alternatives_korean:
  - 번제와 화목제물
  - 번제와 평화제
  lexicon: HALOT
  rationale: 번제와 화목제는 한국어 성경에서 널리 통용되는 제의 용어이므로, 본문의 제사 종류를 분명하게 전달하는 쪽을 택했습니다.
- source_word: צֹאנְךָ וְאֶת בְּקָרֶךָ
  english_pob_choice: your sheep and your cattle
  chosen_korean: 양 떼와 소 떼
  alternatives_korean:
  - 양과 소
  - 가축 떼
  lexicon: HALOT
  rationale: צֹאן과 בָּקָר는 작은 가축과 큰 가축을 가리키므로, 집합적 뉘앙스를 살려 ‘양 떼와 소 떼’로 옮겼습니다.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  english_pob_choice: where I cause my name to be remembered
  chosen_korean: 내가 내 이름을 기억하게 하는 모든 곳
  alternatives_korean:
  - 내 이름을 부르게 하는 모든 곳
  - 내 이름을 기념하게 하는 모든 곳
  - 내 이름을 선포하게 하는 모든 곳
  lexicon: HALOT
  rationale: 히필형 ‘זכר’의 사역 의미를 따라 단순 ‘기억하다’가 아니라 ‘기억하게 하다’로 옮겨, 이름의 호출·기념·언급 가능성을 열어 두었습니다.
theological_decisions:
- issue: ‘내 이름을 기억하게 하는’의 신학적 범위
  chosen_reading: 하나님이 예배의 자리와 임재의 장소를 주권적으로 정하신다는 뜻을 살리되, 그 방식은 본문이 말하는 범위 안에서 열어 둡니다.
  alternative_readings:
  - 내 이름을 선포하는 곳
  - 내 이름을 새기는 곳
  - 내 이름을 부르는 곳
  rationale: 히필 동사의 사역적 의미를 보존하면, 이름의 현시 방식(선포, 기념, 호출)을 하나로 단정하지 않고 본문의 긴장을 유지할 수 있습니다.
  doctrine_reference: Translation philosophy §3 — Preserve theological tension rather than resolve it.
