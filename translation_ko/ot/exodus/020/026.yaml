revisions:
- from: 그리고 내 제단에 계단으로 올라오지 마십시오.[a] 그렇게 해서 당신의 벌거벗음이 그 위에서 드러나지 않게 하십시오.
  to: 또한, 당신의 알몸이 내 제단 위에 드러나지 않도록 계단을 밟고 내 제단에 올라가지 마십시오.[a]
  rationale: 목적절을 ‘…드러나지 않도록’으로 직접 연결하여 히브리어의 금지와 목적 관계를 보존했습니다. ‘계단을 밟고’는 בְּמַעֲלוֹת의 계단을 통한 상승을 자연스럽게 나타내며, ‘내 제단 위에’는 עָלָיו의 제단 지시를 분명히 합니다. 본문에 제의적·상징적 해석을 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:51Z'
