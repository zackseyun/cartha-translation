translation:
  language: ko
  text: 또한, 당신의 알몸이 내 제단 위에 드러나지 않도록 계단을 밟고 내 제단에 올라가지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 나체가 내 제단 위에 드러나지 않도록’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלֶה
  english_pob_choice: you shall not go up
  chosen_korean: 올라오지 마십시오
  alternatives_korean:
  - 올라가지 마십시오
  - 오르지 마십시오
  lexicon: HALOT
  rationale: עלה의 기본 뜻인 ‘올라가다/오르다’를 살리되, 제단을 향한 동작을 자연스럽게 나타내기 위해 ‘올라오다’를 택했습니다.
- source_word: בְּמַעֲלֹת
  english_pob_choice: by steps
  chosen_korean: 계단으로
  alternatives_korean:
  - 계단을 통해
  - 층계로
  lexicon: HALOT
  rationale: מַעֲלוֹת는 ‘계단, 층계’를 가리키므로, 전치사 ב의 수단/방식 의미를 살려 ‘계단으로’로 옮겼습니다.
- source_word: עֶרְוָתְךָ
  english_pob_choice: your nakedness
  chosen_korean: 벌거벗음
  alternatives_korean:
  - 나체
  - 맨몸
  lexicon: HALOT
  rationale: עֶרְוָה는 단순한 신체 노출을 넘어 수치스러운 ‘벌거벗음’의 뉘앙스를 가지므로, 현대 한국어에서 그 긴장을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 노출 금지의 이유를 어떻게 드러낼지
  chosen_reading: 본문이 명시하는 이유인 ‘벌거벗음이 드러나는 것’을 그대로 살리고, 추가적인 상징 해석은 본문에 넣지 않았습니다.
  alternative_readings:
  - 겸손을 상징하는 제의 규정으로 풀어 쓰기
  - 제사장의 복장 문제를 전면에 내세우기
  rationale: 히브리어는 노출 자체를 직접 금지 이유로 제시하므로, 번역도 그 명시된 근거를 유지하는 것이 가장 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
