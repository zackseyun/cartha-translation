  verdict: revise
  source_fidelity: 히브리어의 금지 명령, ‘계단/층계’라는 수단, 제단의 1인칭 소유, 그리고 벌거벗음이 제단 위에 드러나지 않게 한다는 목적절을 유지해야 합니다. 초안의 ‘그렇게 해서 … 않게 하십시오’는 목적절을 별도의 명령으로 바꾸어 문장 관계를 흐립니다.
  naturalness: ‘그렇게 해서 당신의 벌거벗음이 그 위에서 드러나지 않게 하십시오’는 현대 한국어에서 부자연스럽고, 독자에게 두 번째 명령처럼 들립니다. 목적절을 ‘…드러나지 않도록’으로 처리하고 ‘알몸’을 사용하면 자연스럽고 의미도 보존됩니다.
  terminology: ‘제단’은 적절합니다. עֶרְוָה는 여기서 ‘알몸/벌거벗음’으로 옮길 수 있으며, ‘알몸’은 현대 표준어에서 자연스럽고 과도하게 구체화하지 않습니다. ‘내 제단’ 및 제단을 가리키는 ‘위’는 원문의 소유와 지시 대상을 보존합니다.
