id: EXO.20.20
reference: Exodus 20:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ כִּ֗י לְ/בַֽ/עֲבוּר֙ נַסּ֣וֹת אֶתְ/כֶ֔ם בָּ֖א הָ/אֱלֹהִ֑ים וּ/בַ/עֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛/וֹ עַל פְּנֵי/כֶ֖ם לְ/בִלְתִּ֥י תֶחֱטָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
  footnotes:
  - marker: a
    text: Or 'Do not be afraid.' The Hebrew uses the same fear-root later in the verse ('the fear of him'), creating a deliberate contrast between panic and proper fear of God.
    reason: lexical_alternative
  - marker: b
    text: Or 'reverence for him.' The Hebrew noun can denote fear in the sense of reverent awe as well as dread.
    reason: lexical_alternative
  - marker: c
    text: Literally 'upon your faces,' an idiom for something kept before a person or continually present to awareness.
    reason: cultural_note
translation:
  language: ko
  text: 모세가 백성에게 말했습니다. “두려워하지 마십시오.[a] 하나님께서 여러분을 시험하시려고 오셨습니다. 또한 여러분이 죄를 짓지 않도록 그분에 대한 두려움[c]이 여러분 앞에 있게 하시려는 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 같은 어근이 뒤의 ‘그분에 대한 두려움’에도 반복됩니다. 여기서는 공포하지 말라는 명령과 하나님을 향한 합당한 두려움이 대비됩니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분의 얼굴 위에’입니다. 어떤 것이 계속 눈앞에 놓여 의식에 남아 있음을 나타내는 관용 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘두려움’은 문맥에 따라 경외의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָאוּ
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워하지 마세요
  lexicon: HALOT
  rationale: ירא는 문맥에 따라 두려워하다/경외하다를 아우르므로, 뒤의 ‘그에 대한 두려움’과 같은 어근 연결을 살리면서도 현대 한국어에서 자연스럽게 경고하는 표현으로 옮겼습니다.
- source_word: נַסּוֹת
  english_pob_choice: to test
  chosen_korean: 시험하시려고
  alternatives_korean:
  - 검증하시려고
  - 증명하시려고
  lexicon: HALOT
  rationale: נסים의 의미를 ‘시험하다’로 옮기면 하나님이 백성을 단련·검증하시는 목적이 드러나며, 유혹하여 악으로 끌어들이는 뜻은 포함하지 않습니다.
- source_word: יִרְאָתוֹ
  english_pob_choice: the fear of him
  chosen_korean: 그에 대한 두려움
  alternatives_korean:
  - 그를 향한 경외
  - 그분에 대한 두려움
  lexicon: HALOT
  rationale: 본문의 어근 반복을 한국어에서도 살리기 위해 ‘두려움’을 유지했습니다. ‘경외’는 해석을 더 많이 담아 의미를 좁힐 수 있어 본문에는 두려움으로 두었습니다.
- source_word: עַל פְּנֵי/כֶם
  english_pob_choice: before you
  chosen_korean: 여러분의 얼굴 앞에
  alternatives_korean:
  - 여러분 앞에
  - 여러분의 눈앞에
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴 위에/앞에’이지만, 사람 앞에 지속적으로 놓여 있는 상태라는 관용을 살리면서도 본문 이미지인 ‘얼굴’을 유지했습니다.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  english_pob_choice: so that you may not sin
  chosen_korean: 여러분이 죄를 짓지 않게 하시기 위해서입니다
  alternatives_korean:
  - 여러분이 죄를 짓지 않도록 하기 위해서입니다
  - 여러분이 죄 짓지 않게 하시려는 것입니다
  lexicon: HALOT
  rationale: 부정 목적을 자연스러운 합쇼체로 풀어, 결과적 목적과 예방의 의미를 분명히 하되 원문의 목적 구조를 유지했습니다.
theological_decisions:
- issue: ‘두려워하지 마십시오’와 ‘그에 대한 두려움’의 긴장
  chosen_reading: 두 표현 모두 ‘두려움’ 계열로 유지했습니다.
  alternative_readings:
  - 첫째는 ‘무서워하지 마십시오’, 둘째는 ‘경외’로 구분하기
  rationale: 히브리어는 같은 어근 ירא를 반복해 공포와 उचित한 경외의 대비를 만듭니다. 한국어에서도 같은 어휘 계열을 유지해야 본문이 의도한 긴장이 살아납니다.
  doctrine_reference: 'Translation philosophy: source-level lexical tension preservation'
- issue: 하나님의 ‘시험’
  chosen_reading: ‘시험하시려고’로 옮겨 유혹의 의미를 배제했습니다.
  alternative_readings:
  - ‘검증하시려고’
  - ‘단련하시려고’
  rationale: 본문은 하나님이 백성을 시험하시는 목적을 말하지만 죄로 유도하는 유혹은 말하지 않습니다. 따라서 ‘시험’이 가장 직접적이며 신학적 과잉해석을 피합니다.
  doctrine_reference: 출애굽기 20:20의 문맥적 목적 진술
