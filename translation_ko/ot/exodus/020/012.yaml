  source_fidelity: 본문 번역은 부모를 공경하라는 피엘 명령과, 하나님께서 주시는 땅에서 날들이 길어진다는 약속을 충실히 반영합니다. 다만 각주 a가 עַל의 뜻으로 ‘위하여’를 제시한 것은 어휘적으로 부정확하며, 각주 표지가 해당 구절에 붙어 있지 않아 수정이 필요합니다.
