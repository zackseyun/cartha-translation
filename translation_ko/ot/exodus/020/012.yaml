  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
  footnotes:
  - marker: a
    text: Or 'in the land.' The Hebrew preposition is literally 'on/upon,' but English idiom may also express this as 'in the land.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'your days may be long' is a Hebrew idiom for long life.
    reason: cultural_note
translation:
  language: ko
  text: 아버지와 어머니를 공경하십시오[b][a]. 그러면 당신의 날이 야훼 당신의 하나님이 당신에게 주시는 땅에서 길어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 עַל은 문자적으로는 ‘위에/위하여’이지만, 한국어에서는 자연스럽게 ‘땅에서’라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신의 날이 길어질 것입니다’는 히브리어 관용구로 장수의 약속을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  english_pob_choice: Honor
  chosen_korean: 공경하십시오
  alternatives_korean:
  - 존중하십시오
  - 귀히 여기십시오
  - 존귀하게 여기십시오
  lexicon: HALOT
  rationale: 히브리어 피엘 명령형의 핵심은 부모를 무겁고 가치 있게 대하라는 뜻이므로, 한국어에서는 관계적 예의보다 윤리적 책임을 드러내는 ‘공경하다’가 가장 적절합니다.
- source_word: יָמֶיךָ / יַאֲרִכוּן
  english_pob_choice: your days may be long
  chosen_korean: 당신의 날이 … 길어질 것입니다
  alternatives_korean:
  - 당신의 생명이 길어질 것입니다
  - 당신의 수명이 길어질 것입니다
  lexicon: HALOT
  rationale: ‘날들’의 직역을 살리되, 한국어에서는 자연스럽게 ‘길어지다’로 옮겨 히브리어 관용구가 말하는 장수의 약속을 보존했습니다.
- source_word: עַל הָאֲדָמָה
  english_pob_choice: on the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅 위에서
  - 그 땅 안에서
  lexicon: HALOT
  rationale: 전치사 עַל의 문자성은 유지하되 한국어에서는 ‘땅에서’가 가장 자연스럽고, 언약의 땅을 가리키는 문맥도 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문자적으로 드러난 신명기 표기를 따라 한국어에서도 고유명 ‘야훼’를 사용하여, 번역본이 본문의 하나님의 이름을 대체하지 않도록 했습니다.
theological_decisions:
- issue: ‘땅’의 범위
  chosen_reading: 이스라엘에게 주시는 언약의 땅을 가리키는 ‘땅’으로 번역했습니다.
  alternative_readings:
  - ‘세상’으로 일반화하기
  - ‘약속의 땅’으로 명시하기
  rationale: 본문은 십계명의 언약 문맥 안에서 주어지므로, 보편적 ‘세상’으로 확장하지 않고 역사적·언약적 지시를 유지했습니다. 다만 본문에 없는 ‘약속의’는 덧붙이지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 언약 문맥 보존
