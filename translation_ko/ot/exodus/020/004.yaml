  lexicon: HALOT
  rationale: תְּמוּנָה는 형상, 모습, 모양을 뜻하지만 여기서는 금지 범위를 넓히는 표현이므로, 한국어에서 자연스럽고 포괄적인 ‘어떤 형상도’로 옮겼습니다.
- source_word: לְךָ
  english_pob_choice: for yourself
  chosen_korean: 너를 위하여
  alternatives_korean:
