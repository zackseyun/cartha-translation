  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
  footnotes:
  - marker: a
    text: Or 'graven image.' The Hebrew refers specifically to an image made by carving; 'idol' is more interpretive.
    reason: lexical_alternative
  - marker: b
    text: Or 'any form' or 'any representation' for 'likeness.'
    reason: lexical_alternative
  - marker: c
    text: 'The verse describes the created realms in ancient cosmological terms: the heavens above, the earth beneath, and the waters under the earth.'
    reason: cultural_note
translation:
  language: ko
  text: 너는 너를 위하여 새긴 형상[a]이나, 하늘 위의 것[b][c]이나, 땅 아래의 것, 또는 땅 아래 물속에 있는 것의 어떤 형상도 만들지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘새긴 우상’. 히브리어는 새겨 만든 형상을 구체적으로 가리키며, ‘우상’은 더 해석적인 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘들 위의 것’. 히브리어의 복수형 ‘하늘들’은 고대 우주관의 표현을 반영합니다.
    reason: cultural_note
  - marker: c
    text: 고대 우주론적 표현으로, 하늘 위, 땅 아래, 땅 아래 물속이라는 창조 세계의 범주를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: פֶסֶל
  english_pob_choice: a carved image
  chosen_korean: 새긴 형상
  alternatives_korean:
  - 조각한 형상
  - 새긴 우상
  - 조각상
  lexicon: HALOT
  rationale: פֶסֶל은 새겨 만들어진 형상을 가리키므로, 해석을 덧붙인 ‘우상’보다 원문의 제작 방식을 드러내는 ‘새긴 형상’이 더 정확합니다.
- source_word: וְכָל תְּמוּנָה
  english_pob_choice: any likeness
  chosen_korean: 어떤 형상도
  alternatives_korean:
  - 어떤 모양도
  - 어떤 모습도
  - 어떤 형상이나 모습도
  lexicon: HALOT
  rationale: תְּמוּנָה는 형상, 모습, 모양을 뜻하지만 여기서는 금지 범위를 넓히는 표현이므로, 한국어에서 자연스럽고 포괄적인 ‘어떤 형상도’로 옮겼습니다.
- source_word: לְךָ
  english_pob_choice: for yourself
  chosen_korean: 너를 위하여
  alternatives_korean:
  - 자기를 위하여
  - 스스로를 위해
  - 너 자신을 위해
  lexicon: HALOT
  rationale: 여기서는 소유나 이익을 위한 용법이므로, 명령의 직접성을 살리면서도 문맥에 맞는 ‘너를 위하여’가 가장 자연스럽습니다.
- source_word: בַּשָּׁמַיִם מִמַּעַל ... בָּאָרֶץ מִתָּחַת ... בַּמַּיִם מִתַּחַת לָאָרֶץ
  english_pob_choice: what is in the heavens above ... on the earth beneath ... in the waters under the earth
  chosen_korean: 하늘 위의 것 ... 땅 아래의 것, 또는 땅 아래 물속에 있는 것
  alternatives_korean:
  - 하늘 위에 있는 것 ... 땅 아래에 있는 것 ... 땅 아래의 물속에 있는 것
  - 위의 하늘에 있는 것 ... 아래의 땅에 있는 것 ... 땅 아래의 물속에 있는 것
  lexicon: HALOT
  rationale: 히브리어의 삼중 우주적 범위를 한국어로 과장 없이 살리기 위해 직역에 가까운 ‘하늘 위/땅 아래/땅 아래 물속’ 구성을 택했습니다. ‘위의 것’은 문장을 간결하게 하면서 대상 범주를 유지합니다.
theological_decisions:
- issue: 이 절의 금지 범위와 다음 절의 관계
  chosen_reading: 이 절은 ‘만들지 말라’는 금지 자체를 말하고, 예배 행위의 금지는 다음 절이 이어서 보완합니다.
  alternative_readings:
  - 이미 우상숭배 전체를 뜻하므로 본문에 ‘우상’으로 명시해야 한다
  - 모든 시각 예술을 전면 금지하는 뜻으로 확장해야 한다
  rationale: 원문은 제작 금지와 창조계 전체 목록을 제시할 뿐, 예배 동작은 다음 절에서 드러납니다. 따라서 본문을 ‘우상’이나 ‘예배용’으로 미리 좁히거나 넓히지 않고 긴장을 유지했습니다.
  doctrine_reference: 본문의 점진적 맥락 해석을 보존합니다.
