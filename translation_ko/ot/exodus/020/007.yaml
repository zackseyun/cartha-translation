translation:
  language: ko
  text: 당신의 하나님 야훼의 이름을 헛되이[a] 지녀서는 안 됩니다. 야훼께서는 자기 이름을 헛되이 지니는 자를 결코 무죄로 여기지 않으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '전통적 번역: “너는 네 하나님 여호와의 이름을 망령되이 일컫지 말라.” 히브리어는 문자적으로 “이름을 … 헛되이 지니다”에 가깝습니다. 이 표현은 거짓 맹세, 공허한 호명, 또는 하나님의 이름을 그릇되게 대표하는 일을 포함할 수 있습니다.'
    reason: lexical_alternative
