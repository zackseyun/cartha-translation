  - 결코 유죄에서 풀어 주지 않으실 것입니다
  - 결코 책임을 면하게 하지 않으실 것입니다
  lexicon: HALOT
  rationale: נקה의 법정적 의미를 살리면서도 한국어에서 자연스러운 경고문으로 읽히도록 ‘무죄로 두다’라는 표현을 택했습니다. 이는 단순 감정적 제재가 아니라 판결/책임의 문제임을 드러냅니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
  alternatives_korean:
  - 네 하나님
  - 그대의 하나님
  lexicon: HALOT
  rationale: 둘째 인칭 단수 소유를 분명히 하되, 합쇼체 본문에 맞게 ‘당신의 하나님’으로 옮겨 언약적 직접성을 유지했습니다.
theological_decisions:
- issue: '계명의 범위: 단순한 욕설 금지인가, 하나님의 이름을 잘못 짊어지는 행위 전반인가'
  chosen_reading: 본문은 단지 발화 습관의 금지가 아니라, 야훼의 이름을 공허하고 거짓된 방식으로 지니는 행위를 폭넓게 금합니다.
  alternative_readings:
  - false oath에 한정된 금지
  - 모독적 발언에 한정된 금지
  rationale: נשא와 שֵׁם, 그리고 반복되는 שָׁוְא의 결합은 맹세, 대표성, 헛된 소유/호명까지 포괄할 수 있습니다. 그래서 본문을 좁혀 ‘욕설 금지’처럼 읽히지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
