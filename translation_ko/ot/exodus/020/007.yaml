base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
  footnotes:
  - marker: a
    text: 'Traditional English: ''You shall not take the name of the LORD your God in vain.'' The Hebrew is broader, literally ''bear/carry the name ... for emptiness,'' which can include false oaths, empty invocation, or wrongful representation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 야훼 당신의 하나님의 이름을[ [a] ] 헛되이 지녀서는 안 됩니다. 야훼는 자기의 이름을 헛되이 지니는 자를 결코 무죄로 두지 않으실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적 번역의 “여호와의 이름을 망령되이 일컫지 말라”는 관용적 표현입니다. 히브리어는 문자적으로 “이름을 … 헛되이 지니다”에 더 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  english_pob_choice: bear / bears
  chosen_korean: 지니다
  alternatives_korean:
  - 들다
  - 메다
  - 짊어지다
  - 사용하다
  lexicon: HALOT
  rationale: נשא의 기본 의미인 ‘들다/지니다/짊어지다’를 살려, 하나님의 이름을 단지 말하는 행위보다 더 넓게 ‘감당하여 지니는’ 책임을 드러내기 위해 ‘지니다’를 택했습니다.
- source_word: לַשָּׁוְא
  english_pob_choice: falsely
  chosen_korean: 헛되이
  alternatives_korean:
  - 공허하게
  - 거짓되이
  - 무의미하게
  - 쓸데없이
  lexicon: HALOT
  rationale: שָׁוְא는 ‘헛됨, 공허함, 거짓됨, 무가치함’을 아우르므로, 한국어에서는 관용적이면서도 범위를 지나치게 좁히지 않는 ‘헛되이’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 사용자 지침의 기본 용례에 따라 신명기는 인명적 고유명으로서 ‘야훼’를 유지하여, 칭호 ‘주’로 대체하지 않았습니다.
- source_word: יְנַקֶּה (נקה)
  english_pob_choice: will not leave unpunished
  chosen_korean: 결코 무죄로 두지 않으실 것입니다
  alternatives_korean:
  - 결코 벌하지 않으실 것입니다
  - 결코 유죄에서 풀어 주지 않으실 것입니다
  - 결코 책임을 면하게 하지 않으실 것입니다
  lexicon: HALOT
  rationale: נקה의 법정적 의미를 살리면서도 한국어에서 자연스러운 경고문으로 읽히도록 ‘무죄로 두다’라는 표현을 택했습니다. 이는 단순 감정적 제재가 아니라 판결/책임의 문제임을 드러냅니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
  alternatives_korean:
  - 네 하나님
  - 그대의 하나님
  lexicon: HALOT
  rationale: 둘째 인칭 단수 소유를 분명히 하되, 합쇼체 본문에 맞게 ‘당신의 하나님’으로 옮겨 언약적 직접성을 유지했습니다.
theological_decisions:
- issue: '계명의 범위: 단순한 욕설 금지인가, 하나님의 이름을 잘못 짊어지는 행위 전반인가'
  chosen_reading: 본문은 단지 발화 습관의 금지가 아니라, 야훼의 이름을 공허하고 거짓된 방식으로 지니는 행위를 폭넓게 금합니다.
  alternative_readings:
  - false oath에 한정된 금지
  - 모독적 발언에 한정된 금지
  rationale: נשא와 שֵׁם, 그리고 반복되는 שָׁוְא의 결합은 맹세, 대표성, 헛된 소유/호명까지 포괄할 수 있습니다. 그래서 본문을 좁혀 ‘욕설 금지’처럼 읽히지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
