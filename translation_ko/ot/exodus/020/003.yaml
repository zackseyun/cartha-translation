lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  english_pob_choice: You shall have no
  chosen_korean: 두어서는 안 됩니다
  alternatives_korean:
  - 가지면 안 됩니다
  - 있어서는 안 됩니다
  - 두지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 부정 금지형은 단순 존재 진술보다 ‘소유/배치’를 금하는 뜻으로 읽히므로, 한국어에서는 관계를 살린 자연스러운 금지 표현으로 옮겼습니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들
  alternatives_korean:
  - 다른 하나님들
  - 이방 신들
  - 타신들
  lexicon: HALOT
  rationale: 여기서는 여호와와 대비되는 경쟁 신들을 가리키므로, 평이하고 직접적인 ‘다른 신들’이 원문의 대조를 가장 분명하게 드러냅니다.
- source_word: עַל פָּנָי
  english_pob_choice: before me
  chosen_korean: 내 앞에
  alternatives_korean:
  - 내 앞에서
  - 내 면전에서
  - 나 외에
  lexicon: HALOT
  rationale: 직역하면 ‘내 얼굴 앞에’이지만, 한국어에서는 공간적·관계적 긴장을 유지하는 ‘내 앞에’가 가장 자연스럽고, 본문의 금지 범위도 충분히 살립니다.
theological_decisions:
- issue: עַל פָּנָי의 번역이 배타성인지 존재-앞의 표현인지
  chosen_reading: 내 앞에
  alternative_readings:
  - 나 외에
  - 내 앞에서
  - 내 면전에서
  rationale: 이 표현은 ‘내 앞에/내 면전에서’라는 উপস্থিত 의미와 더불어 언약적 배타성도 함축하므로, 본문은 해석을 한쪽으로만 좁히지 않고 직접적인 표현을 유지합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than collapse it into a paraphrase.'
