  - 그들의 윗부분
  lexicon: HALOT
  rationale: 문자적으로는 ‘머리’이지만 기둥의 상단을 뜻하므로, 오해를 줄이기 위해 ‘꼭대기’로 풀었습니다.
- source_word: וְחִשַּׁק אֹתָם
  english_pob_choice: and made bands for them
  chosen_korean: 그들을 위한 띠를 만들었습니다
  alternatives_korean:
  - 그들을 띠로 연결했습니다
  - 그들을 띠로 둘렀습니다
  - 그들에게 띠를 둘러 주었습니다
  lexicon: HALOT
  rationale: חִשַּׁק은 이 문맥에서 기둥에 연결 띠나 장식 띠를 마련하는 뜻이므로, POB의 해석을 따라 ‘띠를 만들었습니다’로 옮겨 기능을 드러냈습니다.
