  - 그 천칠백칠십오를 가지고
  lexicon: WLC
  rationale: 수량이 앞 절의 은 총량을 이어 받는 맥락이므로, 한국어에서는 수단·재료를 나타내는 조사 ‘-로’를 써서 자연스럽게 연결했습니다.
- source_word: וָוִים
  english_pob_choice: hooks
  chosen_korean: 갈고리
  alternatives_korean:
  - 후크
  - 걸쇠
  lexicon: HALOT
  rationale: 성막 기구 문맥에서 금속 부속을 가리키므로, 현대 한국어에서 기능이 분명한 ‘갈고리’로 옮겼습니다.
- source_word: רָאשֵׁיהֶם
  english_pob_choice: their tops
  chosen_korean: 그들의 꼭대기
  alternatives_korean:
