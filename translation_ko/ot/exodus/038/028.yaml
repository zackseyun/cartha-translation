  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
  footnotes:
  - marker: a
    text: Or 'and joined them with bands'; the Hebrew verb here refers to furnishing the pillars with connecting bands or fillets.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 천칠백칠십오로 기둥들을 위한 갈고리를 만들고, 그들의 꼭대기를 입히고, 그들을 위한 띠를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 띠로 연결했다”; 여기서 히브리어 동사는 기둥에 연결 띠나 테두리 띠를 갖추게 하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  english_pob_choice: with the one thousand seven hundred and seventy-five
  chosen_korean: 그 천칠백칠십오로
