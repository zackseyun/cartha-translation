  source_fidelity: 수량은 앞 절의 은 사용량을 이어 받는 것으로, 수단을 나타내는 ‘-로’ 번역은 가능합니다. 다만 기둥의 상단을 입히고 띠를 갖추게 했다는 동작의 대상은 기둥임을 한국어에서 더 분명히 해야 합니다.
