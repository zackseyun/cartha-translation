base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
  footnotes:
  - marker: a
    text: Or 'He brought the poles into the rings.' The Hebrew verb can be rendered more literally as 'brought,' but in context it refers to placing the poles into position.
    reason: lexical_alternative
  - marker: b
    text: Literally 'hollow, boards.' The phrase likely means the altar was made as a hollow structure of boards.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 막대들을 제단의 옆면에 있는 고리들에 꽂아[a], 그 막대들로 제단을 운반할 수 있도록 했습니다. 그는 그것을 판자로 속이 비게[b] 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘꽂아’로 옮긴 말은 더 직역하면 ‘가져다 놓아’입니다. 여기서는 막대들을 고리 안에 제자리에 넣는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘속이 빈, 판자들’입니다. 압축된 표현으로, 제단을 판자로 만들어 속이 빈 구조가 되게 했다는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  english_pob_choice: He put
  chosen_korean: 꽂아
  alternatives_korean:
  - 넣어
  - 두어
  - 가져다
  lexicon: HALOT
  rationale: 막대가 고리들 안에 자리 잡도록 하는 동작을 자연스럽게 드러내기 위해 ‘꽂아’를 선택했습니다. 단순한 ‘가져다’보다 위치 관계가 분명합니다.
- source_word: הַבַּדִּים
  english_pob_choice: the poles
  chosen_korean: 막대들
  alternatives_korean:
  - 장대들
  - 들보들
  - 운반 막대들
  lexicon: HALOT
  rationale: 성막 기구 운반용 막대라는 뜻을 현대 한국어로 풀어 ‘막대들’이라 했습니다. ‘장대들’보다 짧고, 본문 맥락상 기능도 유지됩니다.
- source_word: נְבוּב לֻחֹת
  english_pob_choice: hollow, with boards
  chosen_korean: 속이 비고 판자들로 이루어진
  alternatives_korean:
  - 속이 빈 판자 구조의
  - 판자들로 된 속 빈
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 두 요소로 나누어, 제단이 내부가 빈 구조이며 판자 재질로 구성되었음을 함께 드러냈습니다.
