id: EXO.38.12
reference: Exodus 38:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/פְאַת יָ֗ם קְלָעִים֙ חֲמִשִּׁ֣ים בָּֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֥ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָ֑ה וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשׁוּקֵי/הֶ֖ם כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
  footnotes:
  - marker: a
    text: Or 'their fillets were silver.' The Hebrew term for these pillar fittings is technical and may refer to bands, rods, or decorative connecting pieces.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 서쪽 면에는 길이 오십 규빗의 휘장이 있었고, 그 기둥은 열 개이며 그 받침도 열 개였습니다. 기둥의 갈고리와 그 연결띠[a]는 은으로 되어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘연결띠’는 히브리어 기술 용어를 현대 한국어로 풀어 옮긴 것입니다. 정확한 형태나 기능은 확실하지 않으며, ‘띠’, ‘테두리 장식’, ‘연결 막대’로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  english_pob_choice: And for the west side
  chosen_korean: 그리고 서쪽 면에는
  alternatives_korean:
  - 그리고 서쪽 편에는
  - 그리고 바다 쪽에는
  lexicon: HALOT
  rationale: יָם은 성막 문맥에서 관용적으로 ‘서쪽’을 뜻하므로 방향 의미를 분명히 드러내는 ‘서쪽 면’으로 옮겼습니다.
- source_word: קְלָעִים
  english_pob_choice: hangings
  chosen_korean: 휘장
  alternatives_korean:
  - 걸개
  - 천막
  lexicon: HALOT
  rationale: 성막 뜰의 경계를 이루는 직물 요소이므로, 한국어 성경에서 널리 쓰이면서도 과도하게 교회적이지 않은 ‘휘장’을 택했습니다.
- source_word: וָוֵי הָעַמֻּדִים וַחֲשׁוּקֵיהֶם
  english_pob_choice: the hooks of the pillars and their bands
  chosen_korean: 기둥의 고리와 그 연결띠
  alternatives_korean:
  - 기둥의 갈고리와 그 띠
  - 기둥의 고리와 그 띠
  lexicon: HALOT
  rationale: וָוֵי는 성막 장치의 ‘고리/갈고리’에 해당하고, חֲשׁוּקִים은 정확한 기능이 다소 전문적이어서 POB의 ‘bands’ 취지를 살려 ‘연결띠’로 옮겼습니다.
- source_word: כָּסֶף
  english_pob_choice: were silver
  chosen_korean: 은이었습니다
  alternatives_korean:
  - 은으로 되어 있었습니다
  - 은제였습니다
  lexicon: HALOT
  rationale: 마지막 חומר 표지는 재질을 서술하므로, 한국어에서 자연스러운 서술형으로 ‘은이었습니다’라고 처리했습니다.
theological_decisions:
- issue: 서쪽 방향의 표기
  chosen_reading: ‘서쪽 면’은 성막 구조 설명의 평면적 방향 지시를 그대로 드러내는 표현입니다.
  alternative_readings:
  - ‘서쪽 편’
  - ‘바다 쪽’
  rationale: 본문의 יָם은 문자적으로는 ‘바다’이나, 성막 기술문맥에서는 서쪽을 가리키는 관용어이므로 직역보다 기능적 의미를 우선했습니다.
  doctrine_reference: 성막 기술 본문의 기술적·지리적 관용어 처리
- issue: 문장 내 기둥·받침 수량의 배열
  chosen_reading: ‘그 기둥은 열 개이며 그 받침도 열 개였습니다’로 수량을 분명히 나열했습니다.
  alternative_readings:
  - ‘열 개의 기둥과 열 개의 받침’
  - ‘그 기둥 열 개와 그 받침 열 개’
  rationale: 히브리어의 병렬적 목록 구조를 한국어에서 명료하게 풀어, 소유격과 수량을 함께 보이도록 했습니다.
  doctrine_reference: 성막 물품 목록의 수사적 병렬성
