  terminology: 인명은 본문의 ‘오홀리압’을 유지하고, 이형 표기 ‘아홀리압’을 각주로 제시했습니다. 청색·자색·홍색 실 및 가는 베실은 성막 직물 문맥에 맞게 일관되게 옮겼습니다.
