base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
  footnotes:
  - marker: a
    text: Or 'Aholiab.' English transliterations of this Hebrew name vary.
    reason: lexical_alternative
  - marker: b
    text: '''Scarlet yarn'' renders a Hebrew expression for scarlet-dyed textile material; alternatively, simply ''scarlet.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그와 함께한 자는 아히사막의 아들 오홀리압이었는데, 그는 단 지파의 조각가이며, 설계자이며, 청색과 자색과 홍색 실과 가는 베실로 수놓는 자였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 ‘오홀리압’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘홍색 실’은 붉게 물들인 직물 재료를 가리키는 표현으로, 단순히 ‘홍색’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  english_pob_choice: And with him was
  chosen_korean: 그리고 그와 함께한 자는
  alternatives_korean:
  - 그리고 그와 함께 있던 사람은
  - 그리고 그와 함께한 사람은
  lexicon: HALOT
  rationale: 앞절의 브살렐과 연결되는 동반 관계를 자연스럽게 살리면서, 히브리어의 무동사 구문을 한국어 서술로 풀었습니다.
- source_word: חָרָשׁ
  english_pob_choice: an engraver
  chosen_korean: 조각가
  alternatives_korean:
  - 장인
  - 새기는 사람
  lexicon: HALOT
  rationale: 이 문맥은 성막 직물과 관련된 숙련 기술자 목록이므로, '조각가'를 택해 POB의 특정한 기술 직함을 한국어로 옮겼습니다.
- source_word: וְחֹשֵׁב
  english_pob_choice: a designer
  chosen_korean: 설계자
  alternatives_korean:
  - 무늬를 짜는 사람
  - 디자이너
  - 기교 있는 장인
  lexicon: HALOT
  rationale: 문양과 구성을 고안하는 뜻을 살려 '설계자'로 옮겼으며, 단순한 미적 표현보다 의도적 제작 기능을 드러냅니다.
- source_word: וְרֹקֵם
  english_pob_choice: an embroiderer
  chosen_korean: 수놓는 자
  alternatives_korean:
  - 자수 놓는 자
  - 자수공
  lexicon: HALOT
  rationale: 직물에 무늬를 놓는 작업을 뜻하므로 자수 기능을 직접 보이되, 문맥상 직역보다 자연스러운 '수놓는 자'를 사용했습니다.
theological_decisions:
- issue: 직물 재료 목록의 반복 접속과 색채 표현
  chosen_reading: ‘청색과 자색과 홍색 실과 가는 베실’처럼 접속을 유지해 히브리어의 열거 리듬을 살렸습니다.
  alternative_readings:
  - 청색, 자색, 홍색 실과 가는 베실
  - 청색과 자색과 홍색의 실과 가는 베실
  rationale: 원문은 성막 재료를 연쇄적으로 나열하므로, 한국어에서도 반복된 ‘과’를 통해 장엄한 목록 구조를 보존하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 출애굽기 성막 기술 묘사의 문학적 형식 보존
