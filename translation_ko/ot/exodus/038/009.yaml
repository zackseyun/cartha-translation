    text: Or 'the curtains of the courtyard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 뜰을 만들었습니다. 남쪽, 곧 남쪽 면의 뜰 휘장은 꼬아 만든 고운 베실로 만들었으며, 길이가 백 규빗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뜰의 휘장들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 지어 놓았습니다
  lexicon: HALOT
  rationale: 성막 뜰의 제작·구성 맥락에서 단순한 ‘하다’보다 ‘만들다’가 자연스럽고, 완료 서술로서의 진행도 잘 드러냅니다.
- source_word: הֶחָצֵר
  english_pob_choice: the courtyard
  chosen_korean: 뜰
  alternatives_korean:
  - 안마당
  - 마당
  - 뜰
  lexicon: HALOT
  rationale: 성막 문맥에서 הֶחָצֵר는 외곽 공간인 ‘뜰’을 가리키므로, 교회 전통어를 피하고 본문 기능을 직접 드러내는 ‘뜰’이 적절합니다.
- source_word: קַלְעֵי הֶחָצֵר
  english_pob_choice: the hangings of the courtyard
  chosen_korean: 뜰 휘장
  alternatives_korean:
  - 뜰의 휘장
  - 뜰 장막
  - 뜰 휘장들
  lexicon: HALOT
  rationale: tabernacle 문맥의 קְלָעִים는 경계를 이루는 천 걸개를 뜻하므로, ‘휘장’이 가장 간명하고 ‘뜰 휘장’으로 소유 관계를 자연스럽게 나타낼 수 있습니다.
- source_word: שֵׁשׁ מָשְׁזָר
  english_pob_choice: finely twisted linen
  chosen_korean: 꼬아 만든 고운 베실
  alternatives_korean:
  - 정교하게 꼰 가는 베실
  - 꼬아 만든 세마포
  - 고운 꼰 베
  lexicon: HALOT
  rationale: שֵׁשׁ의 고급 아마포/베의 질감과 מָשְׁזָר의 ‘꼬다/비틀다’를 함께 살리기 위해, 재료성을 드러내는 ‘베실’과 제조 과정을 드러내는 ‘꼬아 만든’을 결합했습니다.
- source_word: מֵאָה בָּאַמָּה
  english_pob_choice: a hundred cubits long
  chosen_korean: 길이가 백 규빗이었습니다
  alternatives_korean:
  - 백 규빗이었습니다
  - 백 규빗 길이였습니다
  - 길이가 백 규빗이었습니다
  lexicon: HALOT
  rationale: 히브리어의 치수 구문을 한국어로 완결되게 옮기되, 길이 정보임을 분명히 하기 위해 ‘길이가’를 보완했습니다.
