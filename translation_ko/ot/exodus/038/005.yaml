    reason: lexical_alternative
translation:
  language: ko
  text: 그는 청동 그물망의 네 모퉁이에 네 개의 고리를 주조하여, 채를 끼우는 받침으로 삼았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 모퉁이’는 ‘네 끝’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘받침’은 문자적으로는 ‘집들’이지만, 여기서는 채를 받아 고정하는 끼움 장치를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  english_pob_choice: He cast
  chosen_korean: 부어 만들어
  alternatives_korean:
  - 주조했습니다
  - 부었습니다
  lexicon: HALOT
  rationale: 금속을 만들기 위한 주조의 뜻을 살려, 단순한 액체 ‘붓기’보다 제작 행위를 드러내는 표현을 택했습니다.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  english_pob_choice: on the four corners
  chosen_korean: 네 모퉁이에
  alternatives_korean:
  - 네 끝에
  - 네 가장자리에
  lexicon: HALOT
  rationale: 그물망의 네 위치를 기능적으로 자연스럽게 전달하면서, 각도/끝의 위치감을 보존했습니다.
- source_word: בָּתִּים לַבַּדִּים
  english_pob_choice: holders for the poles
  chosen_korean: 채를 끼우는 받침
  alternatives_korean:
  - 채를 넣는 집
  - 채를 받는 소켓
  - 채꽂이
  lexicon: HALOT
  rationale: 직역하면 ‘집들’이지만 문맥상 막대기를 받는 끼움 장치를 뜻하므로, 기능을 드러내는 ‘받침’으로 옮겼습니다.
- source_word: לַבַּדִּים
  english_pob_choice: for the poles
  chosen_korean: 채를
  alternatives_korean:
  - 장대를
  - 운반 채를
  lexicon: HALOT
  rationale: 성막 기구를 운반하는 막대를 뜻하므로, 한국어 성경에서 낯설지 않으면서도 기능을 살리는 ‘채’로 옮겼습니다.
