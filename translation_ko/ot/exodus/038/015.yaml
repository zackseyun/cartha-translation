base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
  footnotes:
  - marker: a
    text: Or 'on either side of the gate of the courtyard.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their sockets three' for 'their bases three.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 뜰 문 이쪽과 저쪽의 다른 한편에는[a] 십오 규빗의 휘장이 있었으며, 그 기둥은 셋이고 그 받침도 셋이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “뜰 문 양쪽에.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכָּתֵף הַשֵּׁנִית
  english_pob_choice: for the other side
  chosen_korean: “다른 쪽”
  alternatives_korean:
  - “둘째 쪽”
  - “다른 어깨/쪽”
  lexicon: HALOT
  rationale: כָּתֵף는 문자적으로 ‘어깨/쪽’이지만, 뜰 문 구조를 설명하는 문맥에서는 공간적 ‘다른 쪽’이 자연스럽고 의미를 정확히 전달합니다.
- source_word: מִזֶּה וּמִזֶּה
  english_pob_choice: on this side and on that side
  chosen_korean: “이쪽과 저쪽”
  alternatives_korean:
  - “이편과 저편”
  - “양쪽에”
  lexicon: HALOT
  rationale: 문 좌우를 분배적으로 가리키는 표현이므로, ‘양쪽에’보다 대응 관계가 드러나는 ‘이쪽과 저쪽’이 원문 감각을 더 잘 살립니다.
- source_word: קְלָעִים
  english_pob_choice: hangings
  chosen_korean: “휘장”
  alternatives_korean:
  - “행잉”
  - “커튼”
  lexicon: HALOT
  rationale: 뜰 둘레의 천 장막을 가리키는 탭내클 용어로서, 현대 한국어 성경에서 통용되면서도 내부 장막의 뉘앙스를 피하는 ‘휘장’이 적절합니다.
- source_word: אַדְנֵיהֶם
  english_pob_choice: their bases
  chosen_korean: “받침”
  alternatives_korean:
  - “소켓”
  - “기초”
  lexicon: HALOT
  rationale: 성막 구조물 문맥에서 אֶדֶן은 기둥을 떠받치는 구조물을 뜻하므로, 현대 독자에게 가장 이해하기 쉬운 ‘받침’으로 옮겼습니다.
theological_decisions:
- issue: 수치·도식적 열거를 유지할지 여부
  chosen_reading: 서술을 풀어쓰되, 원문의 목록형 도식을 유지해 기둥과 받침의 수를 그대로 보존했습니다.
  alternative_readings:
  - 문장형으로 완전히 평문화
  - ‘세 개의 기둥과 세 개의 받침이 있었다’처럼 더 매끈하게 재구성
  rationale: 본문은 성막 제작 기록의 계측·재료 목록이므로, 문학적 유려함보다 원문의 도식성과 정밀성이 우선입니다.
  doctrine_reference: 출애굽기 성막 규례의 역사-서술적 정확성
