  - ‘구리’로 직역
  rationale: 원문 נְחֹשֶׁת의 정확한 금속 범주는 문맥상 넓을 수 있지만, 성막 기물의 재료를 한국어 독자에게 가장 안정적으로 전달하는 전통 용례는 ‘놋’입니다.
  doctrine_reference: 출애굽기 성막 재료 용례
