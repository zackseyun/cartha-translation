  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  lexicon: HALOT
  rationale: 서사적 완료 동사를 자연스러운 합쇼체로 옮기되, 제작·공예 문맥을 살려 단순한 ‘행하다’보다 ‘만들다’를 택했습니다.
- source_word: הַבַּדִּים
  english_pob_choice: the poles
  chosen_korean: 그 채
  alternatives_korean:
  - 막대기
  - 운반 막대
  lexicon: HALOT
  rationale: 성막 기구를 운반하는 용도의 막대를 가리키므로, 한국어 성막 문맥에서 기능을 드러내는 ‘채’를 썼습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로
  alternatives_korean:
  - 시팀 나무로
  - 아카시아 목재로
  lexicon: HALOT
  rationale: 히브리어 관용구를 현대 독자가 이해할 수 있도록 ‘아카시아 나무’로 옮기되, 재료 표시인 조사 ‘로’로 앞 구문과 자연스럽게 연결했습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 구리
  - 청동
  lexicon: HALOT
  rationale: 성막 문맥에서 전통적으로 쓰이는 금속명은 한국어 성경의 표준어인 ‘놋’이 가장 자연스럽고, 본문의 재료 의미도 충분히 전달합니다.
theological_decisions:
- issue: 금속 용어의 현대화 여부
  chosen_reading: ‘놋’으로 유지했습니다.
  alternative_readings:
