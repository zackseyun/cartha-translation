base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
  footnotes:
  - marker: a
    text: Or 'sockets' for 'bases.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'bands' is traditionally translated 'fillets'; the exact architectural feature is uncertain, but it refers to silver fittings associated with the pillars.
    reason: cultural_note
translation:
  language: ko
  text: 기둥들의 받침대[a]는 청동으로 되어 있었고, 기둥들의 갈고리와 띠[b]는 은이었으며, 기둥 꼭대기에 입힌 것도 은이었습니다. 뜰의 모든 기둥은 은 띠를 두르고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘받침대’는 히브리어 אֲדָנִים을 옮긴 말이며, ‘소켓’으로 번역할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘띠’로 옮긴 히브리어 표현은 정확한 건축 요소가 다소 불확실합니다. 전통적으로는 ‘필릿(fillet)’ 등으로도 번역됩니다.
    reason: cultural_note
