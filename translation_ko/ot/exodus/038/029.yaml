source:
  edition: WLC
  text: וּ/נְחֹ֥שֶׁת הַ/תְּנוּפָ֖ה שִׁבְעִ֣ים כִּכָּ֑ר וְ/אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/029.yaml
  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
  footnotes:
  - marker: a
    text: Or 'copper'; Hebrew נְחֹשֶׁת can refer broadly to copper or bronze depending on context.
    reason: lexical_alternative
  - marker: b
    text: '''Wave offering'' is a technical term for something presented before the LORD by a ritual waving motion; some render more generally as ''offering presented'' or ''contribution.'''
    reason: cultural_note
translation:
  language: ko
  text: 또 요제[b]로 드린 놋[a]은 칠십 달란트와 이천사백 세겔이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구리’. 히브리어 네호셋은 문맥에 따라 구리 또는 청동을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘요제’는 여호와 앞에 흔들어 바치는 제의적 봉헌을 가리킵니다. 여기서는 그러한 봉헌에 속한 놋을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 구리
  - 청동
  lexicon: HALOT
  rationale: 제사장/성막 목록 문맥에서는 נְחֹשֶׁת을 한국어 성서 전통의 ‘놋’으로 옮기는 것이 가장 자연스럽고, 영어 POB의 ‘bronze’와도 대응됩니다.
- source_word: הַתְּנוּפָה
  english_pob_choice: the wave offering
  chosen_korean: 거제물
  alternatives_korean:
  - 요제로 드린 것
  - 흔든 제물
  - 거제
  lexicon: HALOT
  rationale: תְּנוּפָה는 제의적으로 ‘들어 올려/흔들어’ 바치는 예물로, 한국어 성서어휘에서는 ‘거제물’이 이 전문 용어를 가장 간결하게 반영합니다.
- source_word: שִׁבְעִים כִּכָּר
  english_pob_choice: seventy talents
  chosen_korean: 칠십 달란트
  alternatives_korean:
  - 일흔 달란트
  lexicon: HALOT
  rationale: כִּכָּר은 고대 중량 단위이므로 고유 단위를 유지했고, 수사는 한자어 수사로 자연스럽게 옮겼습니다.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  english_pob_choice: and 2,400 shekels
  chosen_korean: 이천사백 세겔
  alternatives_korean:
  - 2,400 세겔
  - 이천사백 שקל
  lexicon: HALOT
  rationale: שֶׁקֶל도 고대 중량 단위이므로 ‘세겔’로 유지했고, 수량은 현대 한국어 표기인 ‘이천사백’으로 처리했습니다.
theological_decisions:
- issue: הַתְּנוּפָה의 제의적 성격
  chosen_reading: 단순한 금속이 아니라 여호와께 제의적으로 바쳐진 ‘거제물’의 놋이라고 읽었습니다.
  alternative_readings:
  - 거제로 흔든 예물의 놋
  - 바쳐진 놋
  rationale: 이 표현은 소유 표지가 아니라 성막 봉헌 회계의 항목이므로, 제의적 의미를 드러내는 번역이 본문 의도를 더 잘 살립니다.
  doctrine_reference: 성막 제물과 봉헌 규정(출 29장; 레 7장)
