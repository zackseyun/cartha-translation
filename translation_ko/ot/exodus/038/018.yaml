id: EXO.38.18
reference: Exodus 38:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מָסַ֞ךְ שַׁ֤עַר הֶ/חָצֵר֙ מַעֲשֵׂ֣ה רֹקֵ֔ם תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר וְ/עֶשְׂרִ֤ים אַמָּה֙ אֹ֔רֶךְ וְ/קוֹמָ֤ה בְ/רֹ֨חַב֙ חָמֵ֣שׁ אַמּ֔וֹת לְ/עֻמַּ֖ת קַלְעֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
  footnotes:
  - marker: a
    text: Or 'curtain for the entrance of the courtyard.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'blue and purple and scarlet'; 'yarn' is supplied in English because the list names textile materials/colors used in the woven screen.
    reason: lexical_alternative
  - marker: c
    text: Or 'five cubits in height, by width,' a Hebrew dimensional expression likely indicating that the screen matched the height of the courtyard hangings.
    reason: alternative_reading
translation:
  language: ko
  text: 또 울타리 문을 위한 덮개는 수놓은 사람의 작업이었습니다. 곧 청색과 자주색과 홍색 실과 가늘게 꼰 베실로 만들었고, 길이는 스무 규빗, 높이는 다섯 규빗이었으며, 울타리의 휘장들과 너비가 같았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘울타리 출입구를 위한 휘장’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 청색과 자주색과 홍색을 나열하며, 영어에서는 직물 재료의 의미를 살리기 위해 ‘실’을 보탰습니다.
    reason: source_note
  - marker: c
    text: 또는 ‘다섯 규빗은 높이로, 너비로는…’로도 옮길 수 있습니다. 히브리어의 치수 표현은 울타리 휘장의 높이와 대응을 나타내는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָסַךְ שַׁעַר
  english_pob_choice: the screen for the gate
  chosen_korean: 울타리 문을 위한 덮개
  alternatives_korean:
  - 문막이
  - 출입문 휘장
  - 문 휘장
  lexicon: HALOT
  rationale: מָסַךְ은 성막 울타리 문맥에서 출입구를 가리는 천막성 장막을 가리키므로, 기능을 드러내는 ‘덮개’로 옮겼습니다. שַׁעַר은 여기서 ‘문/출입구’의 뜻으로 이해해 ‘울타리 문’으로 자연스럽게 처리했습니다.
- source_word: מַעֲשֵׂה רֹקֵם
  english_pob_choice: the work of an embroiderer
  chosen_korean: 수놓은 사람의 작업
  alternatives_korean:
  - 자수하는 사람의 작업
  - 수놓은 자의 작품
  - 수놓은 공예품
  lexicon: HALOT
  rationale: 직역적인 ‘자수하는 사람’도 가능하지만, מקור의 공예 표현을 살리면서 현대 한국어로 자연스럽게 ‘수놓은 사람의 작업’이라고 옮겼습니다.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  english_pob_choice: blue and purple and scarlet yarn
  chosen_korean: 청색과 자주색과 홍색 실
  alternatives_korean:
  - 파란색과 자주색과 주홍색 실
  - 청색과 자색과 진홍색 실
  - 청색과 자주색과 붉은 실
  lexicon: HALOT
  rationale: 색채 목록은 성막 직물의 재료·색상을 함께 가리키므로, POB처럼 ‘실’을 뒤에 두되 한국어에서는 병렬된 색채로 간명하게 처리했습니다. ‘홍색’은 תוֹלַעַת שָׁנִי의 적색 계열을 무리 없이 반영합니다.
- source_word: שֵׁשׁ מָשְׁזָר
  english_pob_choice: fine twined linen
  chosen_korean: 가늘게 꼰 베실
  alternatives_korean:
  - 가는 꼰 베실
  - 고운 꼰 아마포
  - 가늘게 꼰 모시
  lexicon: HALOT
  rationale: 성막 직물 용례의 고급 리넨을 가리키는 관용구로 보고, 현대 독자가 이해하기 쉬운 ‘베실’과 ‘가늘게 꼰’으로 옮겼습니다. ‘아마포’보다 기능과 재질이 덜 경직되게 드러납니다.
- source_word: לְעֻמַּת קַלְעֵי הֶחָצֵר
  english_pob_choice: corresponding in width to the hangings of the courtyard
  chosen_korean: 울타리의 휘장들과 너비가 같았습니다
  alternatives_korean:
  - 울타리 휘장들의 너비에 맞았습니다
  - 울타리의 휘장들과 폭이 대응했습니다
  - 울타리 휘장들과 같은 너비였습니다
  lexicon: HALOT
  rationale: לְעֻמַּת은 단순한 ‘맞물림’이 아니라 대응·상응을 뜻하므로, 치수를 자연스럽게 풀어 ‘너비가 같았습니다’로 옮겼습니다. קַלְעֵי הֶחָצֵר는 울타리를 이루는 휘장이므로 ‘울타리의 휘장들’로 처리했습니다.
theological_decisions:
- issue: 치수 표현에서 Hebrew의 ‘높이/너비’ 관계를 어떻게 살릴지
  chosen_reading: ‘높이는 다섯 규빗이었으며 … 울타리의 휘장들과 너비가 같았습니다’로, 본문의 수치와 상응 관계를 분리해 제시했습니다.
  alternative_readings:
  - ‘다섯 규빗 높이, 너비로는…’
  - ‘다섯 규빗 높이로서 너비에 맞았고…’
  rationale: 히브리어는 치수 뒤에 관계절처럼 상응성을 덧붙이므로, 한국어에서는 독자가 오해하지 않도록 수치와 대응 관계를 분리해 명료하게 표현했습니다.
  doctrine_reference: 본문의 측량 정보 전달 문제로, 교리 쟁점은 아닙니다.
