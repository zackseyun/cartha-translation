  - severity: medium
    issue: מַעֲשֵׂה רֹקֵם을 ‘수놓은 사람의 작업’으로 번역함
    rationale: 이 표현은 ‘수놓은 사람’이 아니라 수놓는 장인의 공예 작업을 뜻합니다. 현 번역은 사람이 이미 수놓였다는 듯하게 읽힐 수 있습니다.
  - severity: medium
    issue: 치수의 상응 관계를 ‘울타리의 휘장들과 너비가 같았습니다’라고 단정함
    rationale: בְּרֹחַב 및 לְעֻמַּת의 연결 범위와 치수 관계는 해석상 논의가 있습니다. 원문의 모호성을 보존하고 주석에서 대안을 제시하는 편이 안전합니다.
