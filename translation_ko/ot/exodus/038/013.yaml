lexical_decisions:
- source_word: וְ/לִ/פְאַת
  english_pob_choice: And for the ... side
  chosen_korean: 그리고 ... 편
  alternatives_korean:
  - 그리고 ... 쪽
  - 그리고 ... 변
  lexicon: HALOT
  rationale: פאה는 ‘면/변/쪽’의 뜻이 있어 문맥상 측량 문장에 자연스러운 ‘편’으로 옮겼습니다. 접속사와 전치사의 누적 기능은 한국어의 문두 연결어 ‘그리고’로 살렸습니다.
- source_word: קֵדְמָה
  english_pob_choice: east
  chosen_korean: 동쪽
  alternatives_korean:
  - 동편
  - 동쪽 방향
  - 동
  lexicon: HALOT
  rationale: 여기서는 ‘앞’보다 방향 표지가 분명한 ‘동쪽’이 가장 직접적입니다.
- source_word: מִזְרָחָה
  english_pob_choice: toward the sunrise
  chosen_korean: 해 뜨는 쪽으로
  alternatives_korean:
  - 해돋이 쪽으로
  - 동쪽으로
  - 일출 쪽으로
  lexicon: HALOT
  rationale: מִזְרָח은 ‘해가 뜨는 곳/동방’이라는 어원을 드러내므로, 앞의 ‘동쪽’과 중복되면서도 의미를 보강하는 표현으로 ‘해 뜨는 쪽으로’를 택했습니다.
- source_word: חֲמִשִּׁים אַמָּה
  english_pob_choice: fifty cubits
  chosen_korean: 오십 규빗
  alternatives_korean:
  - 쉰 규빗
  - 50 규빗
  lexicon: HALOT
  rationale: 수량과 도량형을 그대로 살려 측량 문장의 간결성을 유지했습니다.
