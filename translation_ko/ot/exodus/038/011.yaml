  text: וְ/לִ/פְאַ֤ת צָפוֹן֙ מֵאָ֣ה בָֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֣ם עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָֽ/עַמּוּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
  footnotes:
  - marker: a
    text: Or 'their fillets were of silver.' The Hebrew term refers to silver architectural fittings on the pillars; the precise form is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 북쪽 면은 백 규빗으로, 기둥 스물 개와 그 받침 스물 개는 놋으로 만들었으며, 그 기둥의 갈고리와 띠는 은으로 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘띠’에 해당하는 히브리어는 기둥 상부와 관련된 은제 건축 부속물을 가리키는 것으로 보이며, 정확한 형태는 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  english_pob_choice: for the north side
  chosen_korean: 북쪽 면에는
  alternatives_korean:
  - 북쪽 편에는
  - 북쪽 변에는
  lexicon: HALOT
  rationale: פאה는 면, 변, 쪽의 뜻이 있어 탭니다. 성막 둘레의 목록 문맥에서는 자연스럽게 ‘북쪽 면’으로 옮기는 것이 적절합니다.
- source_word: מֵאָה בָאַמָּה
  english_pob_choice: a hundred cubits
  chosen_korean: 백 규빗이었고
  alternatives_korean:
  - 백 규빗이며
  - 백 규빗이었습니다
  lexicon: HALOT
  rationale: 치수 진술이므로 ‘백 규빗’으로 직역하되, 목록 문맥에 맞게 서술형으로 연결했습니다.
- source_word: עַמּוּדֵיהֶם / אַדְנֵיהֶם
  english_pob_choice: their twenty pillars / their twenty bases
  chosen_korean: 그 기둥이 스물 개이며 그 받침도 스물 개로서
  alternatives_korean:
  - 그 기둥 스물 개와 그 받침 스물 개
  - 그 기둥이 스물이고 그 소켓도 스물
  lexicon: HALOT
  rationale: עַמּוּדִים은 성막 문맥의 ‘기둥’, אַדְנִים은 받치는 ‘받침’으로 옮기는 것이 현대 한국어에서 가장 분명합니다. ‘소켓’은 기술적이지만 본문 가독성을 위해 피했습니다.
- source_word: וָוֵי הָעַמּוּדִים וַחֲשֻׁקֵיהֶם כָּסֶף
  english_pob_choice: the hooks of the pillars and their bands were of silver
  chosen_korean: 그 기둥의 갈고리와 그 띠는 은이었습니다
  alternatives_korean:
  - 그 기둥의 갈고리와 그 띠는 은으로 되어 있었습니다
  - 그 기둥의 고리와 그 띠는 은이었습니다
  lexicon: HALOT
  rationale: וָוִים은 성막 기둥에 달린 ‘갈고리’로 보는 것이 문맥상 타당합니다. חֲשֻׁקִים은 정확한 형태가 다소 불확실하지만, 현대어로는 전통적 ‘띠’를 택해 은 재질을 간명하게 드러냈습니다.
