  source_fidelity: 초안은 פְּקוּדֵי를 ‘기록’으로, מִשְׁכַּן הָעֵדֻת를 ‘증거의 회막’으로, עַל־פִּי מֹשֶׁה를 ‘모세의 명령에 따라’로 옮긴 점은 대체로 적절합니다. 그러나 ‘레위인들의 봉사를 바탕으로 아론의 아들 제사장 이다말의 감독 아래 있었습니다’는 주어인 ‘기록’이 감독 아래 있었다는 뜻으로 읽히며, 레위인들의 봉사와 이다말의 감독이라는 원문의 관계를 정확히 전달하지 못합니다.
  naturalness: ‘기록이니’ 뒤에 ‘기록되었고 … 아래 있었습니다’가 이어져 문장 구조와 지시 관계가 부자연스럽습니다. ‘명세입니다’와 ‘레위인들이 맡아 한 일입니다’로 문장을 분명히 나누면 현대 표준어 합쇼체로 자연스럽고 원문의 행정적·봉사적 문맥도 유지됩니다.
  terminology: ‘회막’, ‘증거’, ‘레위인’, ‘제사장’, ‘이다말’은 표준 성경 용어로 적절합니다. פְּקוּדֵי에는 단순한 서술 기록보다 공식적 산정·명세의 뉘앙스가 있으므로 ‘명세’가 더 정확합니다. 각주 a의 ‘표준 성막 용어’라는 표현은 선택한 본문 용어 ‘회막’과 혼동될 수 있어 바로잡았습니다.
