revisions:
- from: 이것들은 회막—증거의 회막—의 기록이니, 모세의 명령에 따라 기록되었고, 레위인들의 봉사를 바탕으로 아론의 아들 제사장 이다말의 감독 아래 있었습니다.[a][b][c]
  to: 이것들은 회막[a], 곧 증거의 회막[b]에 관한 명세입니다. 이는 모세의 명령에 따라 작성된 것으로서, 아론의 아들인 제사장 이다말의 감독 아래[c] 레위인들이 맡아 한 일입니다.
  rationale: 원문의 명사적·병렬적 구조를 한국어에서 두 문장으로 풀어, 명세가 모세의 명령에 따라 작성되었으며 그 업무가 레위인들에게 맡겨지고 이다말의 감독 아래 수행되었다는 관계를 분명히 했습니다. ‘증거’의 구체적 대상을 본문에서 단정하지 않고 각주에서 가능성으로만 밝혔으며, 각주 표지도 해당 낱말 또는 구절 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:54:19Z'
