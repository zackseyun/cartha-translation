id: EXO.38.21
reference: Exodus 38:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
  footnotes:
  - marker: a
    text: Or 'inventory' or 'accounts' of the tabernacle; the Hebrew term refers to an official reckoning.
    reason: lexical_alternative
  - marker: b
    text: '''The testimony'' likely refers to the covenant testimony, especially the tablets placed in the ark.'
    reason: cultural_note
  - marker: c
    text: Literally 'by the hand of Ithamar,' an idiom for agency or supervision.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 회막—증거의 회막—의 기록이니, 모세의 명령에 따라 기록되었고, 레위인들의 봉사를 바탕으로 아론의 아들 제사장 이다말의 감독 아래 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회막’은 히브리어 מִשְׁכָּן의 표준 성막 용어입니다.
    reason: cultural_note
  - marker: b
    text: ‘증거’는 언약의 증거물, 곧 증거판과 연결되는 표현일 가능성이 큽니다.
    reason: cross_reference
  - marker: c
    text: 히브리어 ‘by the hand of’는 여기서 ‘감독 아래’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  english_pob_choice: records
  chosen_korean: 기록
  alternatives_korean:
  - 명세
  - 계수
  - 장부
  lexicon: HALOT
  rationale: 명목형 פְקוּדֵי는 회막 물자의 공식적 계산·점검을 가리키므로, 행정적 어감을 살린 ‘기록’이 문맥에 가장 자연스럽습니다.
- source_word: הַמִּשְׁכָּן / מִשְׁכַּן הָעֵדֻת
  english_pob_choice: the tabernacle / the tabernacle of the testimony
  chosen_korean: 회막 / 증거의 회막
  alternatives_korean:
  - 장막 / 증거의 장막
  - 성막 / 증거의 성막
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기 제의 문맥의 정형 표현이므로 ‘회막’이 적절하며, הָעֵדֻת은 핵심어 ‘증거’를 살려 반복 구조를 보존했습니다.
- source_word: עֲבֹדַת הַלְוִיִּם
  english_pob_choice: by the service of the Levites
  chosen_korean: 레위인들의 봉사를 바탕으로
  alternatives_korean:
  - 레위인들의 봉사로
  - 레위인들의 일로
  - 레위인들의 섬김으로
  lexicon: HALOT
  rationale: עֲבֹדָה는 여기서 성막 업무에 대한 지정된 봉사·노무를 뜻하므로 ‘봉사’로 옮기되, 영어의 전치사적 도구 의미를 살려 문맥상 행정적 수행 근거를 드러냈습니다.
- source_word: בְּיַד אִיתָמָר
  english_pob_choice: under the direction of Ithamar
  chosen_korean: 아론의 아들 제사장 이다말의 감독 아래
  alternatives_korean:
  - 이다말의 손 아래
  - 이다말의 지휘 아래
  - 이다말의 관리 아래
  lexicon: HALOT
  rationale: בְּיַד는 문자적으로 ‘손으로’이지만 여기서는 감독·관리의 관용구이므로, 의미를 분명히 하는 ‘감독 아래’로 옮겼습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 그 제사장
  - 사제
  lexicon: HALOT
  rationale: Aaron의 신분 표지를 직접 밝히는 직함이므로 표준 성경 용례에 맞춰 ‘제사장’으로 유지했습니다.
theological_decisions:
- issue: 증거(הָעֵדֻת)의 의미를 본문에서 어떻게 처리할지
  chosen_reading: ‘증거’로 직역을 유지하되, ‘증거의 회막’이라는 반복 구조로 본문 안에서 연결했습니다.
  alternative_readings:
  - ‘언약 증거’로 풀어쓰기
  - ‘언약궤의 증거’로 구체화
  rationale: 히브리어는 성막을 ‘증거’와 연결하지만, 본문 자체는 그 증거의 구체적 내용을 여기서 설명하지 않으므로, 주석적 확대 없이 핵심어를 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: 출 25:16, 21-22의 증거궤/증거 개념과 연결되는 문맥
