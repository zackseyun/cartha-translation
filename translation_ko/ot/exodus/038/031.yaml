translation:
  language: ko
  text: 그리고 뜰의 주위 기둥받침들과 뜰 문 기둥받침들과 성막의 모든 말뚝들과 뜰의 주위 모든 말뚝들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기둥받침’은 본문의 אַדְנֵי를 기능 중심으로 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘말뚝’은 본문의 יִתְדֹת을 현대 한국어로 풀어 옮긴 표현으로, 성막 고정 부속품의 의미를 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  english_pob_choice: bases
  chosen_korean: 기둥받침
  alternatives_korean:
  - 받침대
  - 소켓
  lexicon: HALOT
  rationale: 성막 문맥에서 אַדְן은 기둥이나 판재를 받치는 하부 구조물을 가리키므로, 현대 한국어로는 기능을 드러내는 ‘기둥받침’이 자연스럽고 ‘소켓’보다 덜 기술적입니다.
- source_word: חָצֵר
  english_pob_choice: courtyard
  chosen_korean: 뜰
  alternatives_korean:
  - 마당
  - 안뜰
  lexicon: HALOT
  rationale: 성막의 외곽 공간을 가리키는 말로 ‘뜰’이 성막 본문에서 가장 직접적이고 익숙한 대응어입니다.
- source_word: יִתְדֹת
  english_pob_choice: pegs
  chosen_korean: 말뚝
  alternatives_korean:
  - 못
  - 말뚝받침
  lexicon: HALOT
  rationale: 성막과 뜰을 고정하는 부속품이므로, 건축·텐트 문맥에서 ‘말뚝’이 ‘pegs/stakes’의 구체적 기능을 가장 잘 살립니다.
- source_word: מִּשְׁכָּן
  english_pob_choice: tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: 출애굽기에서 이미 정착된 성막 용어이므로, 전통적이면서도 본문 특유의 성소 개념을 분명히 드러내는 ‘성막’을 유지했습니다.
