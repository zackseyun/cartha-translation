source:
  edition: WLC
  text: בֶּ֚קַע לַ/גֻּלְגֹּ֔לֶת מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ לְ/כֹ֨ל הָ/עֹבֵ֜ר עַל הַ/פְּקֻדִ֗ים מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
  footnotes:
  - marker: a
    text: A beka was equal to half a shekel by the sanctuary standard.
    reason: cultural_note
  - marker: b
    text: Literally 'per skull,' a Hebrew idiom meaning each individual person counted.
    reason: lexical_alternative
  - marker: c
    text: Or 'for everyone who passed among those numbered.' The Hebrew uses census language with the imagery of passing over into registration.
    reason: alternative_reading
translation:
  language: ko
  text: 한 사람당 한 베카[a], 곧 성소 세겔로 반 세겔이었습니다. 이는 스무 살 이상으로 계수된 사람들 가운데에 든 모든 사람[b][c], 곧 육십만 삼천오백오십 명에 대한 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 한 베카는 성소 표준으로 반 세겔에 해당합니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 문자적으로 ‘계수된 자들 위로/사이로 지나가는’이라는 인구 조사 관용구를 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘계수된 사람들 가운데로 들어가는 모든 사람’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  english_pob_choice: a beka
  chosen_korean: 한 베카
  alternatives_korean:
  - 반 세겔짜리 베카
  - 베카
  lexicon: HALOT
  rationale: 전문 화폐 단위는 음역을 유지하되, 문맥상 값이 뒤따라 설명되므로 한국어에서는 자연스럽게 ‘한 베카’로 옮겼습니다.
- source_word: לַגֻּלְגֹּלֶת
  english_pob_choice: per head
  chosen_korean: 머리당
  alternatives_korean:
  - 머릿수당
  - 두상당
  - 사람마다
  lexicon: HALOT
  rationale: 직역하면 ‘두개골/머리’이지만, 계수 관용구로서 개인별 부과를 드러내는 말이므로 ‘머리당’이 가장 자연스럽습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: by the sanctuary shekel
  chosen_korean: 성소 세겔로
  alternatives_korean:
  - 성소의 세겔로
  - 성소 기준 세겔로
  lexicon: HALOT
  rationale: 무게 표준을 뜻하므로 전치사적 표현을 살려 ‘…로’ 처리했고, 예배적 기준임을 보이기 위해 ‘성소’로 옮겼습니다.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  english_pob_choice: for everyone who passed over to those counted
  chosen_korean: 등록된 모든 사람에게 해당하는
  alternatives_korean:
  - 계수된 무리 가운데로 넘어간 모든 사람에게
  - 계수된 자들 사이를 지나간 모든 사람에게
  lexicon: HALOT
  rationale: 히브리어는 인구 조사 등록을 가리키는 관용구이므로, 한국어에서는 그 의미를 분명히 하되 지나친 직역의 어색함을 피했습니다.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  english_pob_choice: from twenty years old and upward
  chosen_korean: 스무 살 이상
  alternatives_korean:
  - 스무 살부터
  - 스무 살 이상부터
  lexicon: HALOT
  rationale: 연령 기준의 관용적 공식이므로 한국어에서 가장 간결하고 표준적인 연령 표현으로 옮겼습니다.
theological_decisions:
- issue: 인구 조사 등록 표현의 의미
  chosen_reading: ‘등록된’으로 옮겨, 단순한 이동이 아니라 공적 계수와 편입을 뜻하는 점을 드러냈습니다.
  alternative_readings:
  - ‘계수된’
  - ‘명부에 오른’
  rationale: 본문은 전쟁 연령 인구를 세는 제의적·행정적 계수 문맥이므로, 의미를 분명히 하면서도 히브리어의 등록 뉘앙스를 보존하는 번역이 적절합니다.
  doctrine_reference: 민수기/출애굽기의 공동체 계수와 성소 관련 헌물 문맥
