lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  lexicon: HALOT
  rationale: 사실 서술의 단순한 동사 עשה를 현대 한국어의 자연스러운 과거형으로 옮겼습니다. '지었습니다'보다 덜 건축물 전용이고, '제작했습니다'보다 덜 기술적입니다.
- source_word: מִזְבַּח הָעֹלָה
  english_pob_choice: the altar of burnt offering
  chosen_korean: 번제단
  alternatives_korean:
  - 번제의 제단
  - 번제물을 드리는 제단
  lexicon: HALOT
  rationale: 히브리어의 제단-번제 결합을 간결하게 살리면서, 제의적 기능을 분명히 드러내는 표준적 한국어 표현입니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로
  alternatives_korean:
  - 시팀 나무로
  - 아카시아 목재로
  lexicon: HALOT
  rationale: שִׁטִּים은 아카시아를 가리키므로 현대 독자가 이해하기 쉬운 식물명으로 옮겼습니다. 재료를 나타내는 -로도 자연스럽게 연결됩니다.
- source_word: רָבוּעַ
  english_pob_choice: square
  chosen_korean: 네모지고
  alternatives_korean:
  - 정사각형이며
  - 사방이 같으며
  lexicon: HALOT
  rationale: 문맥상 치수를 설명하는 형용사이므로 '네모지고'로 형태를 자연스럽게 전달했습니다. '정사각형이며'도 가능하지만 다소 도식적입니다.
