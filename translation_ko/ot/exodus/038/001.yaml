translation:
  language: ko
  text: 그는 아카시아 나무로 번제단을 만들었습니다. 그것은 길이가 다섯 규빗, 너비가 다섯 규빗인 정사각형이었고[a], 높이는 세 규빗이었습니다.
  philosophy: optimal-equivalence
  footnotes:
