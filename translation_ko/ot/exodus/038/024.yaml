  text: כָּל הַ/זָּהָ֗ב הֶֽ/עָשׂוּי֙ לַ/מְּלָאכָ֔ה בְּ/כֹ֖ל מְלֶ֣אכֶת הַ/קֹּ֑דֶשׁ וַ/יְהִ֣י זְהַ֣ב הַ/תְּנוּפָ֗ה תֵּ֤שַׁע וְ/עֶשְׂרִים֙ כִּכָּ֔ר וּ/שְׁבַ֨ע מֵא֧וֹת וּ/שְׁלֹשִׁ֛ים שֶׁ֖קֶל בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
  footnotes:
  - marker: a
    text: Or, 'according to the sanctuary shekel.'
    reason: lexical_alternative
  - marker: b
    text: '''Wave offering'' is the standard rendering of the Hebrew term for an offering presented before the LORD with a ritual motion.'
    reason: cultural_note
translation:
  language: ko
  text: 성소의 모든 공사에 쓰인 금은 모두, 곧 요제로 드린 금[a]은 스물아홉 달란트와 칠백삼십 세겔이었습니다. 이는 성소 세겔[b]을 기준으로 한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요제’는 히브리어 תְּנוּפָה를 옮긴 제의 용어로, 제물을 의식적으로 흔들어 드리거나 제시하는 행위를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘성소 세겔’은 성막 관련 계량에 사용된 표준 세겔을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  english_pob_choice: that was used for the work
  chosen_korean: 쓰인
  alternatives_korean:
  - 사용된
  - 일에 쓰인
  - 공사에 사용된
  lexicon: HALOT
  rationale: 금이 ‘만들어진’ 것이 아니라 제작 공정에 ‘사용된’ 것임을 살리되, 한국어에서는 간결하게 ‘쓰인’이 자연스럽습니다.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  english_pob_choice: in all the work of the sanctuary
  chosen_korean: 성소의 모든 공사
  alternatives_korean:
  - 성소의 모든 일
  - 거룩한 곳의 모든 일
  - 성소의 모든 작업
  lexicon: HALOT
  rationale: 이 문맥은 성막 건축의 총계 보고이므로 ‘공사’가 현대 한국어에서 가장 분명하게 전체 프로젝트를 가리킵니다.
- source_word: זְהַב הַתְּנוּפָה
  english_pob_choice: the gold of the wave offering
  chosen_korean: 흔들어 드린 제물의 금
  alternatives_korean:
  - 요제의 금
  - 흔든 제물의 금
  - 흔들어 바친 금
  lexicon: HALOT
  rationale: תְּנוּפָה의 제의적 동작을 드러내면서도, 한국어 독자가 제의적 용례를 바로 이해하도록 설명적으로 옮겼습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the sanctuary shekel
  chosen_korean: 성소 세겔에 따른
  alternatives_korean:
  - 성소 세겔로
  - 성소 세겔 기준으로
  - 거룩한 세겔에 따른
  lexicon: HALOT
  rationale: 측량 기준을 나타내는 표현이므로 ‘...에 따른’이 가장 정확하고, ‘성소 세겔’은 표준 중량 단위를 간명하게 전달합니다.
theological_decisions:
- issue: 제의 용어 תְּנוּפָה의 처리
  chosen_reading: ‘흔들어 드린 제물’로 옮겨 제의적 동작과 봉헌의 성격을 함께 드러냈습니다.
  alternative_readings:
  - ‘요제’로 음역 유지
  - ‘흔든 제물’로 단순화
  rationale: 본문은 단순한 금의 수량이 아니라 야훼께 구별하여 바친 금의 출처를 기록하므로, 제의적 의미가 드러나는 번역이 본문의 기능을 더 잘 보존합니다.
  doctrine_reference: 제의어의 서술 기능 보존
