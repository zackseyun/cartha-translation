revisions:
- from: 사용된 모든 금은, 곧 성소의 모든 공사에 쓰인 금—흔들어 드린 제물의 금—은 스물아홉 달란트와 칠백삼십 세겔이었으니, 성소 세겔에 따른 것입니다.[a][b]
  to: 성소의 모든 공사에 쓰인 금은 모두, 곧 요제로 드린 금[a]은 스물아홉 달란트와 칠백삼십 세겔이었습니다. 이는 성소 세겔[b]을 기준으로 한 것입니다.
  rationale: The revision removes redundant wording, uses the established and source-faithful cultic term “요제” with a concise explanatory note, improves the weight-standard idiom, and relocates each note marker to the word it explains. It retains the Hebrew’s appositional identification of the gold and all stated quantities.
  reviewer_model: gpt-5.6-terra
