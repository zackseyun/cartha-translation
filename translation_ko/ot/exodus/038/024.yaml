    text: ‘요제’는 히브리어 תְּנוּפָה를 옮긴 제의 용어로, 제물을 의식적으로 흔들어 드리거나 제시하는 행위를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘성소 세겔’은 성막 관련 계량에 사용된 표준 세겔을 가리킵니다.
    reason: cultural_note
  revision_rationale: The revision removes redundant wording, uses the established and source-faithful cultic term “요제” with a concise explanatory note, improves the weight-standard idiom, and relocates each note marker to the word it explains. It retains the Hebrew’s appositional identification of the gold and all stated quantities.
