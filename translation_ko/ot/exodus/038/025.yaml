  yaml_path: translation/ot/exodus/038/025.yaml
  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
  footnotes:
  - marker: a
    text: Or 'the silver of those who were counted from the assembly.'
    reason: lexical_alternative
  - marker: b
    text: That is, measured according to the sanctuary standard weight.
    reason: cultural_note
translation:
  language: ko
  text: 또 회중 가운데서 계수된 사람들의 은은 백 달란트와 천칠백칠십오 세겔이었으며, 성소 세겔에 따른 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회중의 계수된 사람들의 은’으로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 곧 성소에서 사용하는 표준 무게인 세겔에 따라 잰 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֶסֶף
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은전
  - 돈
  lexicon: HALOT
  rationale: 여기서는 금액이 아니라 실제로 계수된 예물의 재질·무게를 말하므로 ‘은’이 가장 직접적입니다.
- source_word: פְּקוּדֵי הָעֵדָה
  english_pob_choice: those counted from the congregation
  chosen_korean: 회중에서 계수된 이들
  alternatives_korean:
  - 회중에서 등록된 이들
  - 회중의 계수된 자들
  lexicon: HALOT
  rationale: פקד의 행정적·인구조사적 의미를 살리되, 한국어에서는 ‘계수된 이들’이 가장 자연스럽고 본문 맥락도 유지합니다.
- source_word: מְאַת כִּכָּר
  english_pob_choice: one hundred talents
  chosen_korean: 백 달란트
  alternatives_korean:
  - 일백 달란트
  - 백 킷카르
  lexicon: HALOT
  rationale: כִּכָּר의 관용적 대응은 ‘달란트’이며, 수량은 간결하게 ‘백’으로 옮겼습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the sanctuary shekel
  chosen_korean: 성소 세겔 기준으로 계산한 것입니다
  alternatives_korean:
  - 성소 세겔에 따라
  - 성소 세겔로
  lexicon: HALOT
  rationale: 이 구는 단순한 명칭이 아니라 측정 표준을 밝혀 주므로, 한국어에서는 ‘기준으로 계산한 것입니다’로 기능을 드러냈습니다.
theological_decisions:
- issue: 회중(עֵדָה)과 계수된 자들의 관계
  chosen_reading: ‘회중에서 계수된 이들’로 옮겨, 공동체 전체와 그 가운데 계수된 구성원을 함께 보이게 했습니다.
  alternative_readings:
  - ‘회중의 계수된 자들’
  - ‘공동체에서 조사된 이들’
  rationale: 본문은 단순한 숫자 보고가 아니라 언약 공동체의 인구조사 결과를 기록하므로, ‘회중’과 ‘계수된’의 연결을 유지하는 것이 중요합니다.
  doctrine_reference: 출애굽기 30–38장의 성막 헌물·계수 기록
