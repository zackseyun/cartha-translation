  source_fidelity: 히브리어의 두 동사 반복, 제단 기구의 열거, 그리고 재료 표시는 대체로 반영되었습니다. 다만 현 문안의 열거 뒤 서술어 ‘입니다’는 과거 사건을 서술하는 문맥과 문법적으로 연결되지 않아, 열거를 첫 문장의 목적어 안에 자연스럽게 통합해야 합니다. נְחֹשֶׁת는 청동 또는 구리를 가리킬 수 있으므로, 현대어 본문에서는 ‘청동’으로 옮기고 대안을 각주로 남기는 것이 적절합니다.
  naturalness: ‘그는 … 만들었습니다. 곧 …입니다.’는 시제와 문장 기능이 어색합니다. ‘곧’ 이하를 ‘…을 만들었습니다’의 목적어로 연결하면 현대 표준 한국어 합쇼체로 자연스럽고 명료합니다. ‘청동’은 ‘놋’보다 현대 표준어에 더 가깝습니다.
  terminology: ‘제단’, ‘기구’, ‘솥’, ‘삽’, ‘대야’, ‘갈고리’는 문맥에 적절합니다. מַחְתֹּת는 숯이나 불을 담아 옮기는 기구이므로 ‘불 옮기는 그릇’은 지나치게 특정 제의 기능을 덧붙이지 않으면서 의미를 전달합니다. נְחֹשֶׁת는 본문에서 ‘청동’으로 번역하되 ‘구리’ 가능성을 각주로 보존합니다.
