reference: Exodus 38:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ אֶֽת כָּל כְּלֵ֣י הַ/מִּזְבֵּ֗חַ אֶת הַ/סִּירֹ֤ת וְ/אֶת הַ/יָּעִים֙ וְ/אֶת הַ/מִּזְרָקֹ֔ת אֶת הַ/מִּזְלָגֹ֖ת וְ/אֶת הַ/מַּחְתֹּ֑ת כָּל כֵּלָ֖י/ו עָשָׂ֥ה נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
  footnotes:
  - marker: a
    text: Or 'copper' for 'bronze.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'pots' may refer more specifically to vessels used for removing ashes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 제단의 모든 기구를 만들었습니다. 곧 솥, 삽, 대야, 갈고리, 그리고 불 옮기는 그릇입니다. 그는 그 제단의 모든 기구를 놋으로 만들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  english_pob_choice: the utensils of the altar
  chosen_korean: 제단의 모든 기구
  alternatives_korean:
  - 제단의 모든 도구
  - 제단의 모든 용기
  - 제단의 모든 기물
  lexicon: HALOT
  rationale: כְּלִי는 기구·도구·그릇을 포괄하는 넓은 말이므로, 제단의 기능적 장비를 자연스럽게 드러내는 ‘기구’가 가장 안정적입니다.
- source_word: הַסִּירֹת
  english_pob_choice: the pots
  chosen_korean: 솥
  alternatives_korean:
  - 냄비
  - 재 솥
  - 그릇
  lexicon: HALOT
  rationale: 이 항목은 제단 부속품의 한 종류로서 일반적인 ‘솥’이 가장 간결하고, 본문 자체가 재를 명시하지 않으므로 ‘재 솥’으로 좁히지 않았습니다.
- source_word: הַמִּזְרָקֹת
  english_pob_choice: the basins
  chosen_korean: 대야
  alternatives_korean:
  - 그릇
  - 바리
  lexicon: HALOT
  rationale: 의식용 액체를 담는 כלי이므로, 일상적이면서도 넓은 그릇인 ‘대야’가 기능을 잘 살립니다.
- source_word: הַמִּזְלָגֹת
  english_pob_choice: the forks
  chosen_korean: 갈고리
  alternatives_korean:
  - 포크
  - 고기갈고리
  lexicon: HALOT
  rationale: 히브리어는 단순히 갈래진 도구를 가리키므로, 현대 한국어에서 제의 도구로 자연스러운 ‘갈고리’를 택했고, 본문이 특정 용도를 말하지 않으므로 ‘고기갈고리’는 피했습니다.
- source_word: הַמַּחְתֹּת
  english_pob_choice: the firepans
  chosen_korean: 불 옮기는 그릇
  alternatives_korean:
  - 숯그릇
  - 향로
  - 화로
  lexicon: HALOT
  rationale: מַחְתָּה는 숯이나 불을 옮기는 데 쓰는 그릇이므로, 제의적 기능이 드러나도록 ‘불 옮기는 그릇’으로 풀어 옮겼습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 구리
  - 청동
  lexicon: HALOT
  rationale: 성막·성전 기구 문맥에서 נְחֹשֶׁת은 전통적으로 ‘놋’으로 대응되는 합금명으로 쓰이며, 한국어 성경 용례와 문맥적 적합성을 함께 반영했습니다.
theological_decisions:
- issue: 반복되는 ‘그는 만들었습니다’의 보존
  chosen_reading: 첫 문장과 마지막 문장 모두 ‘만들었습니다’를 유지해 히브리어의 반복 구조를 드러냈습니다.
  alternative_readings:
  - 한 번만 묶어 ‘... 모든 기구를, 곧 ... 만들었습니다’로 압축
  - 마지막 문장을 생략적 재진술로 처리
  rationale: 본문은 עשה를 앞뒤로 반복해 완결성을 강조하므로, 한국어에서도 반복을 살려 공예적·서술적 리듬을 유지했습니다.
  doctrine_reference: 본문 구조 보존
- issue: ‘갈고리’의 구체화 정도
  chosen_reading: 단순한 도구명으로 두고, ‘고기갈고리’처럼 용도를 단정하지 않았습니다.
  alternative_readings:
  - 고기갈고리
  - 제의용 갈고리
  rationale: 히브리어는 이 항목의 세부 용도를 명시하지 않으므로, 본문이 말하는 범위 안에서만 번역했습니다.
  doctrine_reference: 본문 한정성
