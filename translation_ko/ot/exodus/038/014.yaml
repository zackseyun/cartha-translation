lexical_decisions:
- source_word: קְלָעִים
  english_pob_choice: hangings
  chosen_korean: 행길이
  alternatives_korean:
  - 휘장
  - 걸개
  lexicon: HALOT
  rationale: 출입구 주변의 천을 가리키는 성막/뜰 문맥이므로, 내부 휘장보다 구조물의 ‘hangings’에 해당하는 뜻을 살려 ‘행길이’로 옮겼습니다.
- source_word: חֲמֵשׁ עֶשְׂרֵ֥ה אַמָּ֖ה
  english_pob_choice: fifteen cubits
  chosen_korean: 열다섯 규빗
  alternatives_korean:
  - 열다섯 규빗 길이
  - 열다섯 규빗의 길이
  lexicon: HALOT
  rationale: 히브리어가 길이 수치를 직접 제시하므로, 한국어도 간결하게 ‘열다섯 규빗’으로 대응했습니다.
- source_word: אֶל הַכָּתֵף
  english_pob_choice: for one side
  chosen_korean: 한쪽에는
  alternatives_korean:
  - 한쪽을 향하여
  - 한편에는
  - 한쪽을 위해
  lexicon: HALOT
  rationale: כָּתֵף의 기본 뜻인 ‘어깨/옆면’이 성막 구조 설명에서는 한쪽 면을 뜻하므로, POB의 공간 의미를 살려 ‘한쪽에는’로 옮겼습니다.
- source_word: אַדְנֵיהֶם
  english_pob_choice: their bases
  chosen_korean: 밑받침
  alternatives_korean:
  - 소켓
  - 받침대
  lexicon: HALOT
  rationale: 성막 기둥의 금속 받침을 한국어로 자연스럽게 드러내면서도 기술적 의미를 유지하기 위해 ‘밑받침’을 택했습니다.
