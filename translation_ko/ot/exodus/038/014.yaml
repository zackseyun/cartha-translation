  verdict: revise
  source_fidelity: 히브리어는 뜰 출입구 한쪽의 포장/걸개가 열다섯 규빗이고, 그것에 딸린 기둥과 받침이 각각 셋임을 말합니다. ‘행길이’는 קְלָעִים의 뜻을 전달하지 못하며, ‘휘장’이 이 문맥의 천으로 된 둘레막을 자연스럽고 정확하게 가리킵니다. ‘한쪽의’는 אֶל הַכָּתֵף의 공간적 용법을 무리 없이 반영합니다.
  naturalness: ‘행길이’는 현대 표준 한국어에서 통용되는 건축·성막 용어가 아니어서 문장이 이해되기 어렵습니다. ‘한쪽의 휘장은 길이가 열다섯 규빗이었고’로 하면 자연스럽고 측정 대상도 분명해집니다. 지시 관계도 ‘그 기둥’, ‘그 받침’으로 명료하게 처리했습니다.
  terminology: קְלָעִים은 이 문맥에서 뜰을 이루는 천 걸개/휘장을 뜻하므로 ‘휘장’으로 옮겼습니다. אַדָנִים은 기둥을 세우는 받침 또는 소켓을 가리키므로 본문은 ‘받침’으로, 각주는 가능한 기술적 대안인 ‘소켓’으로 제시했습니다. 기존 각주 표지는 기둥에 붙어 있었으나 실제 대안어는 받침을 대상으로 하므로 해당 낱말로 옮겼습니다.
