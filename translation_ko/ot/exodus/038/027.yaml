source:
  edition: WLC
  text: וַ/יְהִ֗י מְאַת֙ כִּכַּ֣ר הַ/כֶּ֔סֶף לָ/צֶ֗קֶת אֵ֚ת אַדְנֵ֣י הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת אַדְנֵ֣י הַ/פָּרֹ֑כֶת מְאַ֧ת אֲדָנִ֛ים לִ/מְאַ֥ת הַ/כִּכָּ֖ר כִּכָּ֥ר לָ/אָֽדֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
  footnotes:
  - marker: a
    text: Or 'sockets' instead of 'bases' for the tabernacle’s metal foundation pieces.
    reason: lexical_alternative
  - marker: b
    text: '''Veil'' refers to the inner curtain that separated the holy place from the most holy place.'
    reason: cultural_note
translation:
  language: ko
  text: 은 백 달란트의 은은 성소의 받침과 휘장의 받침을 만드는 데 쓰였으니, 곧 백 달란트에 백 개의 받침이었고 각 받침에 한 달란트씩이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘받침’은 성막의 금속 기초부를 가리킵니다. 전통적으로 ‘소켓’으로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘휘장’은 성소와 지성소를 가르는 내부 막을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: were
  chosen_korean: 쓰였으니
  alternatives_korean:
  - 되었습니다
  - 있었습니다
  lexicon: HALOT
  rationale: 이 절은 상태 변화보다 은의 용도와 배분을 말하므로, 결과를 나타내는 ‘쓰였으니’가 장부식 문맥을 자연스럽게 드러냅니다.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  english_pob_choice: the hundred talents of silver
  chosen_korean: 백 달란트의 은
  alternatives_korean:
  - 은 백 달란트
  - 백 달란트 은
  lexicon: HALOT
  rationale: 수량+재료의 관계를 한국어 소유격으로 풀어, ‘백 달란트의 은’이란 측정 표현을 명확하게 옮겼습니다.
- source_word: אַדְנֵי
  english_pob_choice: bases
  chosen_korean: 받침
  alternatives_korean:
  - 소켓
  - 기초
  lexicon: HALOT
  rationale: 성막의 금속 기초부를 가리키는 말로서, ‘받침’이 본문 기능을 비교적 직관적으로 전달하면서도 예배용 구조물의 전문성을 유지합니다.
- source_word: הַפָּרֹכֶת
  english_pob_choice: the veil
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 커튼
  lexicon: HALOT
  rationale: פָּרֹכֶת는 지성소와 성소를 가르는 내부 막이므로, 교회 전통에서 널리 쓰이는 ‘휘장’이 용례와 구별을 가장 잘 보존합니다.
theological_decisions:
- issue: 성소/휘장의 받침을 병렬로 제시하는 성막 구조 표현
  chosen_reading: ‘성소의 받침과 휘장의 받침’으로 성막의 두 구획에 속한 금속 받침을 구분해 표현했습니다.
  alternative_readings:
  - ‘성막의 받침’으로 통합
  - ‘거룩한 곳의 소켓과 휘장의 소켓’으로 직역
  rationale: 본문은 은의 사용처를 두 범주로 나누어 제시하므로, 구조적 구분을 한국어에서도 그대로 보존하는 것이 의미를 가장 분명하게 전달합니다.
  doctrine_reference: 출애굽기 26–27장의 성막 구조 묘사
