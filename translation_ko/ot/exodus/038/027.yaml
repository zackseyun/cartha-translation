    rationale: ‘은 백 달란트의 은’은 ‘은’이 두 번 나타나며, 원문의 ‘은 백 달란트’를 정확하고 자연스럽게 재현하지 못합니다.
  - severity: medium
    issue: 주조 의미의 약화
    rationale: לָצֶקֶת는 받침을 금속으로 주조하는 목적을 나타내므로 ‘만드는 데’만으로는 공정의 구체적 의미가 사라집니다.
  - severity: low
    issue: 각주 표지의 범위가 불명확함
    rationale: 두 각주가 문장 끝에 함께 붙어 있어 ‘받침’과 ‘휘장’ 중 어느 말에 대응하는지 즉시 알기 어렵습니다.
