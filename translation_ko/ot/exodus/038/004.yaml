translation:
  language: ko
  text: 그는 제단을 위하여 그물 세공으로 만든 놋 격자[a][b]를 만들었습니다. 그 격자는 제단의 턱[c] 아래에, 아래쪽에서부터 제단의 중간까지 이르게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그물’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그물의 세공’ 또는 ‘그물로 만든 작품’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 제단의 구조적 돌출부를 가리키며, ‘테두리’, ‘두름’, 또는 ‘가장자리’로도 옮길 수 있습니다.
    reason: lexical_alternative
