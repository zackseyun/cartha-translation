  rationale: 본문의 핵심은 제단의 구조물 위치를 정확히 묘사하는 데 있으므로, 함축보다 공간 관계를 분명히 드러내는 쪽을 택했습니다.
  doctrine_reference: 성막/제단 묘사의 기술적 정확성
