base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/004.yaml
  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
  footnotes:
  - marker: a
    text: Or 'a grate, the work of a net, of bronze.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for the altar's structural feature may also be rendered 'rim,' 'molding,' or 'surround.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from below to its middle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 제단을 위해 놋으로 된 그물[a], 곧 그물 모양의 제작물[b]을 만들었는데, 그것은 그 제단의 가장자리 아래, 아래쪽에서[c], 그 중간 높이까지 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘격자’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그물의 작품’ 또는 ‘그물 짜임’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아래에서’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 그는 … 만들었습니다
  alternatives_korean:
  - 그리고 그는 … 만들었습니다
  - 그는 … 제작했습니다
  lexicon: WLC
  rationale: 서술 전개를 자연스럽게 살리면서 히브리어 완료형 서술의 단순 진행을 반영했습니다.
- source_word: מִכְבָּר
  english_pob_choice: a grating
  chosen_korean: 놋으로 된 그물
  alternatives_korean:
  - 놋 격자
  - 놋 난간
  lexicon: HALOT
  rationale: מִכְבָּר의 격자·그물 구조를 살리되, 뒤의 מַעֲשֵׂה רֶשֶׁת과 연결되는 ‘그물’로 풀어 자연스럽게 옮겼습니다.
- source_word: מַעֲשֵׂה רֶשֶׁת
  english_pob_choice: a network
  chosen_korean: 그물 모양의 제작물
  alternatives_korean:
  - 그물의 일
  - 그물 짜임
  lexicon: HALOT
  rationale: 직역하면 ‘그물의 일/작품’이지만, 한국어에서는 제작된 구조물이라는 점을 드러내는 표현이 더 분명합니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: of bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성막 기물 문맥에서 관용적으로 쓰이는 금속 명칭을 따라 ‘놋’으로 옮겼습니다.
- source_word: כַּרְכֻּבּוֹ
  english_pob_choice: its ledge
  chosen_korean: 가장자리
  alternatives_korean:
  - 턱
  - 몰딩
  - 둘레
  lexicon: HALOT
  rationale: 구조적 돌출부를 가리키는 말로, 한국어에서는 독자가 즉시 이해할 수 있는 ‘가장자리’가 가장 무난합니다.
theological_decisions:
- issue: 제단 내부 구조를 가리키는 공간 관계 표현
  chosen_reading: ‘아래쪽에서 … 그 중간 높이까지’로 옮겨, 그물의 위치와 범위를 시각적으로 드러냈습니다.
  alternative_readings:
  - ‘밑에서 … 반쯤까지’
  - ‘아래에서 … 중간까지’
  rationale: 본문의 핵심은 제단의 구조물 위치를 정확히 묘사하는 데 있으므로, 함축보다 공간 관계를 분명히 드러내는 쪽을 택했습니다.
  doctrine_reference: 성막/제단 묘사의 기술적 정확성
