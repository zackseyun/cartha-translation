  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
  footnotes:
  - marker: a
    text: Or 'their twenty sockets were bronze.'
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'their fillets were silver.' The Hebrew likely refers to bands or connecting elements associated with the pillars.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 기둥은 스무 개였고, 그 스무 받침은 놋이었습니다.[a] 기둥의 갈고리들과 띠들은 은이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 스무 소켓은 놋이었습니다.”
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 “그들의 필렛은 은이었습니다.”라고 옮겼습니다. 그러나 히브리어는 기둥에 딸린 띠나 연결 부속을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  english_pob_choice: their pillars
  chosen_korean: 그들의 기둥
  alternatives_korean:
  - 그들의 받침기둥
  - 그들의 ستون
  lexicon: HALOT
  rationale: 성막 구조물 문맥에서 עַמּוּדִים은 건축용 기둥을 가리키므로, 자연스러운 현대 한국어인 ‘기둥’으로 옮겼습니다. 소유격도 영어 POB처럼 ‘그들의’로 반영했습니다.
- source_word: אַדְנֵיהֶם
  english_pob_choice: their twenty bases
  chosen_korean: 그들의 스무 받침
  alternatives_korean:
  - 그들의 스무 소켓
  - 그들의 스무 기초
  lexicon: HALOT
  rationale: 성막 용어 אֶדֶן은 기둥을 받치는 받침/소켓을 뜻하므로, 과도하게 기술적이거나 낯선 ‘소켓’보다 읽기 쉬운 ‘받침’이 문맥에 더 적합합니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 구리
  - 청동
  lexicon: HALOT
  rationale: 성막 재료 표현에서는 한국어 성경에서 널리 쓰이는 ‘놋’이 가장 자연스럽고, 금속 재질을 가리키는 מקור의 범위도 무리 없이 반영합니다.
- source_word: חֲשֻׁקֵיהֶם
  english_pob_choice: their bands
  chosen_korean: 그 띠
  alternatives_korean:
  - 그들의 띠
  - 그들의 연결띠
  - 그들의 고리띠
  lexicon: HALOT
  rationale: 전통적 ‘필렛’은 한국어에서 뜻이 불분명하므로, 기둥을 연결하는 부속물이라는 문맥을 살려 ‘띠’로 옮겼습니다. 영어 POB의 ‘bands’와도 대응됩니다.
