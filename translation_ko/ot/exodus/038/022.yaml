  lexicon: HALOT
  rationale: 앞의 접속사 וּ를 살려 서술의 연결을 보존했고, 인명은 현대 음역으로 옮겼습니다.
- source_word: בֶּן אוּרִי בֶן ח֖וּר
  english_pob_choice: son of Uri, son of Hur
  chosen_korean: 훌의 아들, 우리의 아들로서
  alternatives_korean:
  - 우리의 아들, 훌의 손자로서
  - 우리 아들인 훌의 아들로서
  lexicon: HALOT
  rationale: 족보식 반복 구조를 한국어로 자연스럽게 유지하되, 직계 관계를 분명히 드러내기 위해 ‘A의 아들, B의 아들’ 형식을 따랐습니다.
- source_word: לְ/מַטֵּה יְהוּדָה
  english_pob_choice: of the tribe of Judah
  chosen_korean: 유다 지파의
  alternatives_korean:
  - 유다 지파에 속한
  - 유다 지파에서
  lexicon: HALOT
  rationale: מַטֶּה의 족속/지파 의미를 표준적인 ‘지파’로 옮기고, 소속 관계는 속격으로 처리했습니다.
- source_word: עָשָׂה אֵת כָּל אֲשֶׁר צִוָּה
  english_pob_choice: made all that ... had commanded
  chosen_korean: 야훼께서 모세에게 명령하신 모든 것을 만들었습니다
  alternatives_korean:
  - 야훼께서 모세에게 시키신 모든 것을 하였습니다
  - 야훼께서 모세에게 명하신 모든 일을 했습니다
  lexicon: HALOT
  rationale: 성막 제작 문맥에서 עָשָׂה는 단순한 ‘하다’보다 실제 제작을 드러내는 ‘만들다’가 더 정확합니다. צִוָּה는 명령의 권위를 살려 ‘명령하신’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 번역상 칭호가 아니라 고유명으로 처리해 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 족보 호칭의 한국어 배열
  chosen_reading: ‘훌의 아들, 우리의 아들’로 직계 족보를 유지했습니다.
  alternative_readings:
  - ‘우리의 아들, 훌의 손자’로 순서를 바꾸는 방식
  - ‘우리의 아들 훌의 아들’로 압축하는 방식
  rationale: 히브리어의 연속된 בן 구조는 혈통의 층위를 드러내므로, 한국어에서도 그 중첩을 보존하는 편이 본문의 정보량을 더 정확히 전달합니다.
