base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
  footnotes:
  - marker: a
    text: Or 'its horns were integral with it' (literally, 'from it were its horns'), indicating they were not made separately and then attached.
    reason: lexical_alternative
  - marker: b
    text: Hebrew neḥoshet can refer to bronze or copper; 'bronze' is the conventional rendering in tabernacle contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 제단의 네 모퉁이에 뿔들을 만들었습니다. 그 뿔들은 제단 본체와 한 덩어리였습니다[a]. 그는 제단을 청동으로 입혔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그것으로부터 그 뿔들이 있었다’입니다. 뿔들을 따로 만들어 붙인 것이 아니라 제단 본체와 함께 만들어진 일체형이었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נְחֹשֶׁת는 문맥에 따라 청동이나 구리를 가리킬 수 있습니다. 성막 문맥에서는 보통 청동으로 옮깁니다.
    reason: lexical_alternative
