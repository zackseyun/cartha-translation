base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/020.yaml
  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
  footnotes:
  - marker: a
    text: Or 'copper.' The Hebrew נְחֹשֶׁת can denote copper or bronze depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 성막과 그 주위 뜰에 쓰인 모든 말뚝은 청동으로 만들었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구리’. 히브리어 נְחֹשֶׁת은 문맥에 따라 구리나 청동을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל / הַיְתֵדֹת
  english_pob_choice: And all the pegs
  chosen_korean: 모든 말뚝
  alternatives_korean:
  - 모든 못
  - 모든 팩 말뚝
  - 모든 장막말뚝
  lexicon: HALOT
  rationale: יָתֵד는 여기서 구조물을 고정하는 말뚝을 가리키므로, 현대 한국어에서는 ‘말뚝’이 가장 자연스럽고 의미도 분명합니다. ‘못’은 너무 작게 들릴 수 있고, ‘장막말뚝’은 다소 설명적입니다.
- source_word: לַמִּשְׁכָּן
  english_pob_choice: for the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기 문맥에서 성막을 가리키는 표준 용어이므로, 한국어 성경에서 널리 쓰이는 ‘성막’으로 옮겼습니다.
- source_word: וְלֶחָצֵר סָבִיב
  english_pob_choice: and for the surrounding courtyard
  chosen_korean: 그 주변 뜰
  alternatives_korean:
  - 그 둘러싼 뜰
  - 사방의 뜰
  - 둘레 뜰
  lexicon: HALOT
  rationale: חָצֵר는 성막을 둘러싼 울타리 안의 뜰을 뜻하므로 ‘뜰’로 옮기고, סָבִיב의 공간적 의미는 ‘주변’으로 자연스럽게 살렸습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 구리
  - 청동
  lexicon: HALOT
  rationale: 출애굽기 성막 자재 목록에서는 נְחֹשֶׁת을 전통적으로 ‘놋’으로 옮기는 것이 한국어 성경 문맥에 가장 잘 맞습니다. POB의 ‘bronze’는 문맥상 합금 계열을 가리키지만, 한국어에서는 ‘놋’이 그 기능을 가장 정확히 전달합니다.
theological_decisions:
- issue: 성막 용어의 표준화
  chosen_reading: מִשְׁכָּן을 ‘성막’으로 번역해 독자가 문맥상 이스라엘의 예배 처소를 즉시 알아보도록 했습니다.
  alternative_readings:
  - 장막
  - 거처
  rationale: 출애굽기의 기술적 문맥에서는 ‘성막’이 가장 안정적인 대응어이며, 본문의 물질 목록 성격도 해치지 않습니다.
  doctrine_reference: 출애굽기 25–40장의 성막 서술 관례
