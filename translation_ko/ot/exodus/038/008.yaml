    rationale: 이 어근은 이 문맥에서 봉사/섬김뿐 아니라 모임 또는 집결의 뉘앙스로도 이해될 수 있습니다. 본문의 불확실성을 보존하기 위해 대안 독법을 주석으로 제공하는 것이 좋습니다.
