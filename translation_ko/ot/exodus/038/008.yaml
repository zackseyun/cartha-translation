revisions:
- from: 그는 회막 어귀에서 봉사하던 여인들의 거울로 놋 대야와 그 받침을 만들었습니다.
  to: 그는 회막 어귀에서 봉사하던 여인들의 거울로 청동 대야와 청동 받침을 만들었습니다.[a][b]
  rationale: ‘놋’을 현대어 ‘청동’으로 바꾸고, 원문이 대야와 받침 각각에 붙이는 재질 표현을 모두 번역했습니다. 여성들의 활동을 ‘봉사’로 절제해 번역하되, 집결이라는 가능한 의미는 주석에서 보존했습니다. 문화적 배경 주석도 번역하여 거울의 재료에 관한 오해를 막았습니다.
  reviewer_model: gpt-5.6-terra
