    rationale: 원문은 ‘청동 대야와 청동 받침’이라고 두 기물의 재질을 각각 밝힙니다. 한국어의 수식 범위에 의존하지 말고 반복하여 원문의 명시성을 보존하는 것이 안전합니다.
