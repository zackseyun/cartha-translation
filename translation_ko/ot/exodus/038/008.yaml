reference: Exodus 38:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֗עַשׂ אֵ֚ת הַ/כִּיּ֣וֹר נְחֹ֔שֶׁת וְ/אֵ֖ת כַּנּ֣/וֹ נְחֹ֑שֶׁת בְּ/מַרְאֹת֙ הַ/צֹּ֣בְאֹ֔ת אֲשֶׁ֣ר צָֽבְא֔וּ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
  footnotes:
  - marker: a
    text: Or 'the women who assembled at the entrance to the tent of meeting.' The Hebrew may emphasize organized gathering as well as service.
    reason: alternative_reading
  - marker: b
    text: Or 'from the polished metal mirrors.' Ancient mirrors were typically made of polished bronze rather than glass.
    reason: cultural_note
translation:
  language: ko
  text: 그는 회막 어귀에서 봉사하던 여인들의 거울로 청동 대야와 청동 받침을 만들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회막 어귀에 모여 있던 여인들’. 히브리어는 조직적으로 모이거나 봉사하는 뜻을 함께 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘광택을 낸 금속 거울로’. 고대의 거울은 보통 유리가 아니라 광택을 낸 청동으로 만들었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 제작했습니다
  - 지었습니다
  lexicon: HALOT
  rationale: 성막 기물 제작 맥락에서 물건을 ‘만들다’가 가장 자연스럽고, 공예적 제작의 뜻도 충분히 드러냅니다.
- source_word: כִּיּוֹר
  english_pob_choice: basin
  chosen_korean: 대야
  alternatives_korean:
  - 물두멍
  - 세수대야
  lexicon: HALOT
  rationale: 성막의 큰 씻는 그릇을 가리키므로 ‘대야’가 현대 독자에게 명료합니다. 전통적 ‘물두멍’은 익숙하지만 다소 교회어적입니다.
- source_word: כַּן
  english_pob_choice: stand
  chosen_korean: 받침
  alternatives_korean:
  - 대
  - 기단
  - 받침대
  lexicon: HALOT
  rationale: 대야를 떠받치는 구조물이라는 점을 간결하게 드러내며, ‘받침대’보다 성막 기물의 부속 구조로서 더 자연스럽습니다.
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  english_pob_choice: the women who served
  chosen_korean: 봉사하던 여인들
  alternatives_korean:
  - 모여 있던 여인들
  - 집결하여 섬기던 여인들
  - 봉사하러 모였던 여인들
  lexicon: HALOT
  rationale: צבא의 집합·봉사 뉘앙스를 반영하되, 본문이 여성들의 정확한 제의 직무를 규정하지 않으므로 ‘봉사하던’으로 절제해 옮겼습니다.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance to the tent of meeting
  chosen_korean: 회막 어귀에서
  alternatives_korean:
  - 회막 입구에서
  - 회막의 문앞에서
  lexicon: HALOT
  rationale: 관용적 성막 표현을 살리면서도 한국어로 자연스럽게 압축했습니다. ‘어귀’는 ‘פתח’의 공간적 경계감을 잘 드러냅니다.
- source_word: בְּמַרְאֹת
  english_pob_choice: from the mirrors
  chosen_korean: …거울로
  alternatives_korean:
  - …거울들로
  - …광택낸 금속 거울로
  lexicon: HALOT
  rationale: 재료 출처를 나타내는 전치사 בְּ를 반영해 ‘…로’로 옮겼고, POB의 문화적 주석처럼 고대 거울의 금속성은 본문에 과도하게 덧붙이지 않았습니다.
theological_decisions:
- issue: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ의 역할 규정
  chosen_reading: ‘봉사하던 여인들’로 옮겨, 집합·봉사의 뉘앙스를 살리되 제의적 직분을 단정하지 않았습니다.
  alternative_readings:
  - ‘모여 있던 여인들’
  - ‘섬기던 여인들’
  rationale: 본문은 이 여인들의 직무를 상세히 규정하지 않으므로, 여성의 봉사 사실은 드러내되 후대의 제도적 개념을 덧씌우지 않는 번역이 필요합니다.
  doctrine_reference: 본문이 허용하는 범위 안에서 여성의 성막 관련 봉사를 기술하되, 직분론은 유보합니다.
