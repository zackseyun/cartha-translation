source:
  edition: WLC
  text: וְ/עַמֻּֽדֵי/הֶם֙ אַרְבָּעָ֔ה וְ/אַדְנֵי/הֶ֥ם אַרְבָּעָ֖ה נְחֹ֑שֶׁת וָוֵי/הֶ֣ם כֶּ֔סֶף וְ/צִפּ֧וּי רָאשֵׁי/הֶ֛ם וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
  footnotes:
  - marker: a
    text: Or 'sockets' for 'bases.' The Hebrew term refers to the supporting metal pieces at the foot of the pillars.
    reason: lexical_alternative
  - marker: b
    text: Or 'plating of their tops.' The Hebrew is literally 'the overlay of their heads/tops.'
    reason: lexical_alternative
  - marker: c
    text: Traditionally 'fillets.' The exact form of these silver elements is uncertain; 'bands' is a clear modern rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 네 기둥과 그들의 네 놋 받침[a], 그들의 은 갈고리[c][b], 그리고 그들의 머리 위 덮개와 그들의 은 띠였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소켓’. 히브리어 용어는 기둥 발치의 지지 금속 부품을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기둥 꼭대기의 도금’. 히브리어는 문자적으로 ‘그들의 머리/꼭대기의 덮개’입니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로 ‘필렛’이라고도 합니다. 이 은 부속물의 정확한 형태는 불확실하지만, ‘띠’가 현대어로 더 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  english_pob_choice: their pillars
  chosen_korean: 그들의 기둥
  alternatives_korean:
  - 그들의 받침기둥
  - 그들의 ستون
  lexicon: HALOT
  rationale: 막 성막/성막뜰 문맥에서 עַמּוּד는 구조물을 떠받치는 ‘기둥’으로 옮기는 것이 가장 자연스럽고, POB의 pillar 선택과도 맞습니다.
- source_word: אַדְנֵיהֶם
  english_pob_choice: their bases
  chosen_korean: 그들의 놋 받침
  alternatives_korean:
  - 그들의 놋 소켓
  - 그들의 받침대
  lexicon: HALOT
  rationale: 이 단어는 기둥 아래를 받치는 금속 부품을 가리키므로, POB의 bases를 따라 현대 한국어로는 ‘받침’이 가장 분명하며 재료를 드러내기 위해 ‘놋’을 덧붙였습니다.
- source_word: וָוֵיהֶם
  english_pob_choice: their hooks
  chosen_korean: 그들의 은 갈고리
  alternatives_korean:
  - 그들의 은 고리
  - 그들의 걸쇠
  lexicon: HALOT
  rationale: 성막 구조물의 결속용 부속물로서 וָו는 일반적으로 ‘갈고리/고리’ 계열이지만, POB의 hooks를 따라 기능이 드러나는 ‘갈고리’로 옮겼습니다.
- source_word: צִפּוּי רָאשֵׁיהֶם
  english_pob_choice: the overlay of their tops
  chosen_korean: 그들의 머리 위 덮개
  alternatives_korean:
  - 그들의 꼭대기 덮개
  - 그들의 머리의 덮개
  lexicon: HALOT
  rationale: 히브리어는 ‘그들의 머리/꼭대기 위의 덮개’라는 명사구이므로, ‘덮개’로 옮겨 입체적 구조를 살리되 ‘머리 위’로 원문 구성을 반영했습니다.
- source_word: חֲשֻׁקֵי/הֶם
  english_pob_choice: their bands
  chosen_korean: 그들의 은 띠
  alternatives_korean:
  - 그들의 은 테
  - 그들의 은 연결띠
  lexicon: HALOT
  rationale: 이 용어는 전통적으로 ‘필렛’으로도 옮겨지지만 정확한 형상은 불확실하므로, POB의 bands를 따라 현대 독자가 이해하기 쉬운 ‘띠’를 택했습니다.
