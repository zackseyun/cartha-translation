  terminology: ‘야훼’, ‘고난’, ‘압제자들’, ‘고통’은 원문의 의미 범위와 프로젝트의 야훼 표기를 잘 따릅니다. ‘감독관들’은 נֹגְשָׂיו의 가능한 대안으로 적절합니다.
