  lexicon: WLC
  rationale: נֹגֵשׂ의 착취·억압적 기능을 한국어로 직접 드러내되, 출애굽 문맥의 강압성을 유지했습니다.
- source_word: מַכְאֹבָיו
  english_pob_choice: their sufferings
  chosen_korean: 그들의 고통
  alternatives_korean:
  - 그들의 아픔
  - 그들의 괴로움
  lexicon: WLC
  rationale: 신체적 고통과 더 넓은 삶의 고난을 함께 포괄하는 표현으로, 복수적 집합 의미를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 여호와의 인격적 지식과 강한 확인의 표현
  chosen_reading: 나는 … 분명히 보았고 … 들었으며 … 알고 있습니다
  alternative_readings:
