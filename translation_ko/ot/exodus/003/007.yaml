base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
  footnotes:
  - marker: a
    text: Or “I have indeed seen” (Hebrew uses an infinitive absolute with the finite verb for emphasis).
    reason: lexical_alternative
  - marker: b
    text: Or “their outcry.”
    reason: lexical_alternative
  - marker: c
    text: Or “because of their taskmasters.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 말씀하셨습니다. “나는 이집트에 있는 내 백성의 고난을 분명히 보았고[a], 그들의 부르짖음[b]을 그들의 압제자들[c] 때문에 들었으며, 그들의 고통을 알고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 참으로 보았다” (히브리어는 강조를 위해 부정사 절대형과 완료형 동사를 함께 씁니다).
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들의 외침”.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그들의 감독관들 때문에”.
    reason: lexical_alternative
