  verdict: revise
  source_fidelity: 본문 번역은 히브리어의 강조된 ‘분명히 보았다’, 이집트에 있는 ‘내 백성’, 압제자들로 말미암은 부르짖음, 그리고 그들의 고통을 아신다는 진술을 충실히 반영합니다. 다만 각주 표지가 해당 어구에 직접 붙어 있지 않아, 특히 a 표지가 ‘말씀하셨습니다’에 붙어 강조 구문을 가리키는 구조가 부정확합니다.
