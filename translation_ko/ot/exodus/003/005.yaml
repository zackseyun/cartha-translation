  edition: WLC
  text: וַ/יֹּ֖אמֶר אַל תִּקְרַ֣ב הֲלֹ֑ם שַׁל נְעָלֶ֨י/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔י/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֤ר אַתָּה֙ עוֹמֵ֣ד עָלָ֔י/ו אַדְמַת קֹ֖דֶשׁ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
  footnotes:
  - marker: a
    text: Or 'Do not approach here.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'ground of holiness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 말씀하셨습니다. 「여기 가까이 오지 마십시오. 당신의 발에서 신발을 벗으십시오. 당신이 서 있는 곳은 거룩한 땅이기 때문입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '여기 가까이 오지 마십시오.'
    reason: alternative_reading
  - marker: b
    text: 직역하면 '거룩함의 땅'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then he said
  chosen_korean: 그분이 말씀하셨습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그때 말씀하셨습니다
  lexicon: HALOT
  rationale: 문맥상 발화 주체를 자연스럽게 이어 주기 위해 과거 서술로 옮겼고, 신적 발화 맥락이므로 평이한 '말하다'보다 '말씀하다'를 택했습니다.
- source_word: אַל תִּקְרַב הֲלֹם
  english_pob_choice: Do not come near here
  chosen_korean: 여기 가까이 오지 마십시오
  alternatives_korean:
  - 여기 오지 마십시오
  - 이리 접근하지 마십시오
  lexicon: HALOT
  rationale: קרב의 공간적 금지를 현대 한국어에서 가장 자연스럽게 살리기 위해 '가까이 오다'를 썼고, 금지 명령의 공손한 형태를 유지했습니다.
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  english_pob_choice: Remove your sandals from your feet
  chosen_korean: 당신의 발에서 신발을 벗으십시오
  alternatives_korean:
  - 당신의 발에서 샌들을 벗으십시오
  - 신발을 발에서 벗으십시오
  lexicon: HALOT
  rationale: 히브리어는 발에서 신발을 떼어 내라는 뜻이지만, 한국어에서는 '신발을 벗다'가 가장 직접적이고 자연스러워 발화의 명령성을 유지했습니다. '샌들'은 문화적 구체성을 살리지만 한국어 문맥에서는 다소 설명적입니다.
- source_word: אַדְמַת קֹדֶשׁ
  english_pob_choice: holy ground
  chosen_korean: 거룩한 땅
  alternatives_korean:
  - 성스러운 땅
  - 거룩한 땅
  lexicon: HALOT
  rationale: construct 표현의 핵심 의미는 '거룩함이 부여된 땅'이므로, 영어 POB의 'holy ground'에 대응되는 표준적이고 직역에 가까운 '거룩한 땅'을 선택했습니다.
theological_decisions:
- issue: 거룩함의 성격을 설명할지 여부
  chosen_reading: 본문의 진술을 그대로 따라, 그 땅이 '거룩한 땅'이라고만 말하고 추가 설명은 넣지 않았습니다.
  alternative_readings:
  - 하나님의 임재 때문에 거룩하다는 해설을 덧붙임
  - '''성지''로 의역함'
  rationale: 본문 자체는 거룩함의 근거를 즉시 설명하지 않으므로, 해설을 보태지 않고 서술의 힘을 보존하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: Translation philosophy §1, §3
