  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 복수형 신발은 한국어에서 집합적으로 자연스럽게 표현할 수 있으며, '당신의 발에서 신발을'은 불필요한 소유 표현과 어순 때문에 다소 부자연스럽습니다. 각주 a는 본문과 완전히 동일하여 영어 감사 기록의 실제 어휘 대안(approach)을 반영하지 못합니다.
  naturalness: 합쇼체의 명령문은 적절하지만, '당신의 발에서 신발을 벗으십시오'보다 '발에서 신발을 벗으십시오'가 현대 표준어에서 훨씬 자연스럽습니다. 신적 화자를 가리키는 문맥상 '그분께서 말씀하셨습니다'가 '그분이 말씀하셨습니다'보다 자연스러운 존대 서술입니다.
