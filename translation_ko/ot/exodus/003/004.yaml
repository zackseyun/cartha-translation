translation:
  language: ko
  text: 야훼께서[a] 그가 보려고 돌아선 것을 보시고, 하나님께서 떨기나무[c] 한가운데서[b] 그를 부르시며 말씀하셨습니다. 「모세, 모세!」 그러자 그가 말했습니다. 「제가 여기 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 하나님의 이름 יְהוָה는 여기서 ‘주님’으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: '히브리어: ‘떨기나무 한가운데서’; 또는 ‘떨기나무 안에서’.'
    reason: lexical_alternative
  - marker: c
    text: ‘떨기나무’는 더 구체적으로 가시나무 떨기일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: DOCTRINE.md contested terms / YHWH
  rationale: POB의 원칙에 따라 여호와 대신 신명기적 고유명칭을 음역한 야훼를 본문에 유지하여, 본문이 드러내는 하나님의 개인적 이름을 보존했습니다.
- source_word: סָר לִרְאוֹת
  english_pob_choice: had turned aside to look
  chosen_korean: 보려고 옆으로 비켜선
  alternatives_korean:
  - 돌아서서 보러 간
  - 보려고 돌이킨
  lexicon: HALOT
  rationale: סוּר의 핵심 의미인 ‘비켜서다/돌이키다’를 살리되, 목적을 나타내는 לִרְאוֹת는 자연스러운 한국어로 ‘보려고’로 옮겨 사건의 진행과 목적을 함께 드러냈습니다.
- source_word: מִתּוֹךְ הַסְּנֶה
  english_pob_choice: from the midst of the bush
  chosen_korean: 떨기나무 한가운데서
  alternatives_korean:
  - 떨기나무 가운데서
  - 떨기나무 속에서
  lexicon: HALOT
  rationale: ‘from the midst of’의 공간적 중심성을 유지하면서도, 한국어에서는 ‘한가운데서’가 가장 자연스럽고 장면의 긴박함을 잘 전달합니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: HALOT
  rationale: 본문의 אֱלֹהִים은 한국어 성경의 일반적 대응인 하나님으로 옮겨, 앞절의 야훼와 구별되는 서술적 호칭을 유지했습니다.
- source_word: הִנֵּנִי
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 제가 여기 있습니다
  - 예, 여기 있습니다
  - 제가 있습니다
  lexicon: HALOT
  rationale: הִנֵּנִי는 단순 위치 진술을 넘어 응답과 준비의 태도를 담으므로, 합쇼체로도 자연스럽고 즉각적 반응을 드러내는 ‘제가 여기 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 야훼와 하나님이 같은 장면에 연속해 등장하는 문제
  chosen_reading: 야훼와 하나님을 함께 유지해, 본문이 의도적으로 보여 주는 고유명칭과 보편적 호칭의 병치를 보존했습니다.
  alternative_readings:
  - 둘 다 하나님으로 통일
  - 둘 다 주님으로 통일
  rationale: 히브리어는 같은 절 안에서 יְהוָה와 אֱלֹהִים을 구별해 사용하므로, 이를 한국어에서도 지우지 않는 편이 원문 투명성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
