  source_fidelity: ‘잠깐’은 אָסֻרָה נָּא의 시간적 의미가 아니며, ‘타 없어지지 않는다’는 문맥상 함의를 본문에 앞당겨 넣습니다. 히브리어는 여기서 기본적으로 떨기나무가 ‘타지’ 않는 이유를 묻습니다.
  naturalness: 직접 인용문에서 ‘옆으로 비켜서’와 ‘보겠습니다’는 현대 표준어 합쇼체로 자연스럽습니다. 두 절로 나누어 모세의 관찰과 의문을 명료하게 제시할 수 있습니다.
  terminology: ‘모세’, ‘떨기나무’는 통용되는 성경 용례이며 적절합니다. הַמַּרְאֶה הַגָּדֹל은 해석적으로 강화한 ‘놀라운’보다 ‘큰 광경’이 원문의 표현을 더 직접적으로 보존합니다.
