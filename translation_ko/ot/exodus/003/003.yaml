lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  english_pob_choice: Then Moses said
  chosen_korean: 그때 모세가 말했습니다
  alternatives_korean:
  - 그리고 모세가 말했습니다
  - 그때 모세가 말하였습니다
  lexicon: WLC / narrative waw-consecutive
  rationale: 와우 연속형의 서사 진행을 한국어의 자연스러운 시간 표지인 ‘그때’로 살렸고, 본문 서술체에 맞게 평서형 공손체로 옮겼습니다.
- source_word: אָסֻרָה נָּא
  english_pob_choice: Let me turn aside
  chosen_korean: 잠깐 옆으로 가서
  alternatives_korean:
  - 제가 옆으로 비켜서서
  - 제가 잠시 돌아서서
  lexicon: HALOT
  rationale: ‘돌이켜 옆으로 가다/비켜 가다’의 동작을 자연스럽게 풀어 옮겼고, נָא의 완곡함은 ‘잠깐’으로 최소한만 반영했습니다.
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  english_pob_choice: this great sight
  chosen_korean: 이 놀라운 광경
  alternatives_korean:
  - 이 큰 광경
  - 이 위대한 모습
  lexicon: HALOT
  rationale: מַרְאֶה는 ‘보이는 것/광경’이므로 ‘광경’이 적절하고, הַגָּדֹל은 단순 크기보다 경이성을 띠어 ‘놀라운’으로 풀었습니다.
- source_word: הַסְּנֶה
  english_pob_choice: the bush
  chosen_korean: 떨기나무
  alternatives_korean:
  - 덤불
  - 가시나무
  lexicon: HALOT
  rationale: סְּנֶה는 관례적 한국어 성경 용례에 맞는 ‘떨기나무’가 가장 분명하며, 일반적인 ‘bush’보다 본문의 불타는 떨기나무 장면을 더 정확히 드러냅니다.
theological_decisions:
- issue: 마지막 절구의 의미를 ‘타 없어지다’로 풀지 여부
  chosen_reading: ‘어찌하여 떨기나무가 타 없어지지 않는지’
  alternative_readings:
  - ‘왜 떨기나무가 타지 않는지’
  - ‘왜 떨기나무가 소멸되지 않는지’
  rationale: 히브리어 בָּעַר는 기본적으로 ‘타다’이며, 본문의 기이함은 ‘불타면서도 없어지지 않는’ 역설에 있습니다. 한국어에서는 그 역설을 자연스럽게 드러내기 위해 ‘타 없어지지 않는다’고 옮겼습니다.
  doctrine_reference: Exodus 3:3의 표징 묘사—어휘적 역설 보존
