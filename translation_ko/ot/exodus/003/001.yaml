base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Now Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
  footnotes:
  - marker: a
    text: Or 'to the far side of the wilderness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 그의 장인 곧 미디안의 제사장 이드로의 양 떼를 치고 있었습니다. 그는 그 양 떼를 광야 너머로[a] 이끌고 가서 하나님의 산 호렙에 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘광야의 저쪽으로’.
    reason: אַחַר הַמִּדְבָּר의 공간적 의미에 대한 자연스러운 대안 번역입니다.
lexical_decisions:
- source_word: וּמֹשֶׁה הָיָה רֹעֶה
  english_pob_choice: Now Moses was shepherding
  chosen_korean: 이제 모세는 … 양 떼를 치고 있었습니다
  alternatives_korean:
  - 이제 모세는 … 양 떼를 돌보고 있었습니다
  - 이제 모세는 … 목자 일을 하고 있었습니다
  lexicon: HALOT
  rationale: 지속 과거의 서술을 살리면서 רעה의 목양 이미지를 한국어의 자연스러운 동사 ‘치다’로 옮겼습니다.
- source_word: צֹאן
  english_pob_choice: the flock
  chosen_korean: 양 떼
  alternatives_korean:
  - 떼
  - 가축 떼
  lexicon: HALOT
  rationale: צֹאן은 집합적으로 작은 가축을 가리키므로, 문맥상 목양 장면에 가장 자연스러운 ‘양 떼’를 택했습니다.
- source_word: כֹּהֵן מִדְיָן
  english_pob_choice: the priest of Midian
  chosen_korean: 미디안의 제사장
  alternatives_korean:
  - 미디안의 사제
  - 미디안의 종교 지도자
  lexicon: HALOT
  rationale: 히브리어 소유/소속 관계를 직접 반영하여, 이드로의 신분을 설명하는 부가구로 옮겼습니다.
- source_word: אַחַר הַמִּדְבָּר
  english_pob_choice: beyond the wilderness
  chosen_korean: 광야의 저쪽으로
  alternatives_korean:
  - 광야 너머로
  - 광야의 반대편으로
  lexicon: HALOT
  rationale: אַחַר의 공간적 용법을 한국어에서 방향성을 가진 표현으로 옮겨, ‘광야를 지나 더 멀리’라는 이동감을 살렸습니다.
- source_word: הַר הָאֱלֹהִים חֹרֵבָה
  english_pob_choice: the mountain of God, Horeb
  chosen_korean: 하나님의 산 호렙
  alternatives_korean:
  - 하나님의 산, 호렙
  - 호렙, 하나님의 산
  lexicon: HALOT
  rationale: 구문의 병렬성을 유지하면서도 한국어에서는 지명과 호칭을 한 덩어리로 읽기 쉽도록 배치했습니다.
theological_decisions:
- issue: הַר הָאֱלֹהִים를 성화된 산으로 미리 해석할지 여부
  chosen_reading: 하나님의 산
  alternative_readings:
  - 거룩한 산
  - 하나님께 속한 산
  rationale: 본문의 표현을 직역해, 이 산의 신학적 의미를 설명으로 앞서 확정하지 않고 서술상의 긴장을 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
