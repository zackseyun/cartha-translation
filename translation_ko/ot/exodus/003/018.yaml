base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
  footnotes:
  - marker: a
    text: Or 'has encountered us.' The Hebrew phrase can denote that the LORD has come upon or met with them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 그들은 그대의 말을 들을 것입니다. 그대와 이스라엘의 장로들은 이집트 왕에게 가서 그에게 이렇게 말하십시오. “히브리 사람들의 하나님이신 야훼께서 우리를 만나셨습니다.[a] 이제 부디 우리가 광야로 사흘 길을 가서 우리 하나님 야훼께 제사를 드리도록 허락해 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 찾아오셨습니다.’ 히브리어 표현은 야훼께서 우리를 만나시거나 우리에게 다가오셨다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  english_pob_choice: they will listen to your voice
  chosen_korean: 그들이 당신의 말을 들을 것입니다
  alternatives_korean:
  - 그들이 당신의 소리를 들을 것입니다
  - 그들이 당신의 음성을 들을 것입니다
  - 그들이 당신의 말에 귀를 기울일 것입니다
  lexicon: HALOT
  rationale: 히브리어의 '듣다/경청하다'는 맥락상 수용과 응답을 함께 담으므로, 한국어에서는 자연스러운 '말을 듣다'로 옮겨 음성 자체보다 메시지 수용을 드러냈습니다.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  english_pob_choice: you and the elders of Israel will go
  chosen_korean: 당신과 이스라엘의 장로들은 이집트 왕에게 가서
  alternatives_korean:
  - 당신과 이스라엘의 장로들은 가서
  - 당신은 이스라엘의 장로들과 함께 가서
  - 당신과 이스라엘의 장로들은 들어가서
  lexicon: HALOT
  rationale: 방향상 파라오를 향해 나아가는 장면이므로 '가다'를 택했고, '이스라엘의 장로들'은 구성 요소를 분명히 살렸습니다.
- source_word: יְהוָה אֱלֹהֵי הָעִבְרִיִּים
  english_pob_choice: Yahweh, the God of the Hebrews
  chosen_korean: 히브리 사람의 하나님 야훼
  alternatives_korean:
  - 히브리 사람들의 하나님 야훼
  - 히브리인의 하나님 야훼
  - 히브리 사람들의 하나님, 야훼
  lexicon: HALOT
  rationale: יְהוָה는 본문 관례에 따라 '야훼'로 옮기고, אֱלֹהֵי הָעִבְרִיִּים는 민족 표지인 '히브리 사람의 하나님'으로 직역해 원문의 호칭을 유지했습니다.
- source_word: נִקְרָה עָלֵינוּ
  english_pob_choice: has met with us
  chosen_korean: 우리를 만나셨습니다
  alternatives_korean:
  - 우리에게 나타나셨습니다
  - 우리를 만나셨습니다
  - 우리를 찾아오셨습니다
  lexicon: HALOT
  rationale: 이 동사는 신적 현현/대면의 뉘앙스를 담을 수 있어, 지나치게 해석하지 않으면서도 자연스러운 한국어로 '만나셨습니다'를 선택했습니다.
- source_word: נֵלֲכָה נָּא דֶּרֶךְ שְׁלֹשֶׁת יָמִים בַּמִּדְבָּר
  english_pob_choice: please let us go a journey of three days into the wilderness
  chosen_korean: 제발 우리로 하여금 광야로 사흘 길이를 가게 하셔서
  alternatives_korean:
  - 제발 우리를 광야로 사흘 길이 가게 하셔서
  - 부디 우리로 광야에서 사흘 길을 가게 하셔서
  - 제발 우리에게 광야로 사흘 길을 가게 하셔서
  lexicon: HALOT
  rationale: נָא의 간청을 '제발'로 살리고, '사흘 길이'는 히브리 관용을 비교적 가깝게 유지하면서 한국어로 이해 가능하게 옮겼습니다.
- source_word: וְנִזְבְּחָה לַיהוָה אֱלֹהֵינוּ
  english_pob_choice: so that we may sacrifice to Yahweh our God
  chosen_korean: 거기서 우리 하나님 야훼께 희생제를 드리게 하십시오
  alternatives_korean:
  - 거기서 우리 하나님 야훼께 제사를 드리게 하십시오
  - 거기서 우리 하나님 야훼께 희생을 드리게 하십시오
  - 거기서 우리 하나님 야훼께 희생제를 바치게 하십시오
  lexicon: HALOT
  rationale: זבח의 제의적 의미를 살리기 위해 '희생제'를 선택했고, 목적절의 요구를 한국어 명령형 종결로 자연스럽게 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문의 יְהוָה는 '야훼'로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 그 주
  rationale: 본문이 신적 고유명을 직접 사용하므로, 관례적 대체어 대신 음역형 '야훼'를 써서 언약적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 신적 현현 표현 נִקְרָה עָלֵינוּ의 범위
  chosen_reading: '''우리를 만나셨습니다''는 현현/대면을 넓게 담되, 더 강한 ''부르셨다''로 좁히지 않았습니다.'
  alternative_readings:
  - 우리를 만났습니다
  - 우리를 찾아오셨습니다
  - 우리에게 나타나셨습니다
  rationale: 문맥은 하나님이 모세와 이스라엘에게 실제로 자신을 드러내신 사건을 말하지만, 본문 자체는 '호출'보다 '대면/만남'을 말하므로 그 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
