  to: 그러면 그들은 그대의 말을 들을 것입니다. 그대와 이스라엘의 장로들은 이집트 왕에게 가서 그에게 이렇게 말하십시오. “히브리 사람들의 하나님이신 야훼께서 우리를 만나셨습니다.[a] 이제 부디 우리가 광야로 사흘 길을 가서 우리 하나님 야훼께 제사를 드리도록 허락해 주십시오.”
