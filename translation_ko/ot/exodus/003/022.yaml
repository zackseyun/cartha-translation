  to: 각 여인은 이웃 여인과 자기 집에 머무는 여인[b]에게서 은으로 된 물건과 금으로 된 물건[a], 그리고 옷을 구하여, 그것들을 너희 아들들과 너희 딸들에게 걸치게 하십시오. 그러면 너희는 이집트를 약탈할 것입니다[c].
  rationale: כְּלִי의 넓은 의미를 살리고, 은·금 물품과 의복을 함께 자녀에게 두는 행위를 자연스럽게 표현했습니다. 또한 모든 각주 표지를 해당 어구에 재배치했습니다. ‘구하다’와 ‘약탈하다’는 각각 שׁאל 및 נצל의 문맥상 의미를 보존합니다.
