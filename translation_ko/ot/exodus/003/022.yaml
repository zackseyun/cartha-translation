id: EXO.3.22
reference: Exodus 3:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
  footnotes:
  - marker: a
    text: Or 'shall request'; traditionally, some render 'shall borrow,' but the Hebrew verb more basically means 'ask' or 'request.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the sojourner/resident woman in her house.'
    reason: lexical_alternative
  - marker: c
    text: Or 'despoil' or 'strip' Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: 각 여인은 이웃 여인과 자기 집에 머무는 여인에게서 은그릇과 금그릇[a], 그리고 옷을 구하여, 그것들을 너희 아들과 너희 딸에게 입혀야 합니다[b][c]. 그렇게 해서 너희는 이집트를 약탈할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요청할 것입니다’. 전통적으로 ‘빌릴 것입니다’로 옮기기도 하지만, 히브리어 동사는 기본적으로 ‘묻다/요청하다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 집에 머무는/체류하는 여인에게서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이집트를 노략질할 것입니다’ 혹은 ‘이집트를 벗겨낼 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  english_pob_choice: shall ask
  chosen_korean: 구하여
  alternatives_korean:
  - 요청하여
  - 빌려
  lexicon: HALOT
  rationale: שׁאל의 기본 의미는 ‘묻다/요청하다’이므로, ‘빌려’처럼 반환 의무를 암시하는 표현은 피하고 ‘구하다’로 요청의 의미를 살렸습니다.
- source_word: מִשְּׁכֶנְתָּהּ
  english_pob_choice: from her neighbor
  chosen_korean: 이웃 여인에게서
  alternatives_korean:
  - 이웃에게서
  - 여자 이웃에게서
  lexicon: HALOT
  rationale: 문법상 여성형이지만 한국어에서는 자연스럽게 ‘이웃 여인’으로 옮겨 여성성을 살리되 지나치게 어색한 반복은 피했습니다.
- source_word: וּמִגָּרַת בֵּיתָהּ
  english_pob_choice: from the woman staying in her house
  chosen_korean: 자기 집에 머무는 여인에게서
  alternatives_korean:
  - 자기 집에 사는 여인에게서
  - 그 집에 체류하는 여인에게서
  lexicon: HALOT
  rationale: גור의 거주/체류 뉘앙스를 ‘머무는’으로 옮겨, 임시 거주 또는 함께 사는 여인이라는 뜻을 현대 한국어로 자연스럽게 전달했습니다.
- source_word: כְּלֵי כֶסֶף / וּכְלֵי זָהָב
  english_pob_choice: articles of silver / articles of gold
  chosen_korean: 은그릇과 금그릇
  alternatives_korean:
  - 은 물건과 금 물건
  - 은 제품과 금 제품
  lexicon: HALOT
  rationale: כְּלִי는 포괄적으로 ‘그릇/도구/물건’을 뜻하지만, 한국어에서는 “은그릇/금그릇”이 재질이 드러나면서도 자연스럽게 넓은 물품군을 가리킵니다.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  english_pob_choice: So you will plunder Egypt
  chosen_korean: 그렇게 해서 너희는 이집트를 약탈할 것입니다
  alternatives_korean:
  - 그렇게 해서 너희는 이집트를 노략질할 것입니다
  - 그렇게 해서 너희는 이집트를 빼앗을 것입니다
  lexicon: HALOT
  rationale: נצל의 여기서는 강한 ‘탈취/약탈’ 의미가 있으므로, ‘약탈할 것입니다’로 도덕적 완화 없이 공적 성격을 드러냈습니다.
theological_decisions:
- issue: 이집트의 재물을 가져가는 행위를 어떻게 표현할지
  chosen_reading: ‘약탈할 것입니다’로 직설적으로 옮겨, 종살이의 보상과 역전이라는 본문의 힘을 유지했습니다.
  alternative_readings:
  - ‘가져갈 것입니다’
  - ‘빼앗을 것입니다’
  rationale: 본문은 단순한 차용이 아니라 억압의 역전을 말하므로, ‘빌리다’나 중립적 표현은 본문 의도를 약화시킵니다.
  doctrine_reference: Translation philosophy §1, §3
