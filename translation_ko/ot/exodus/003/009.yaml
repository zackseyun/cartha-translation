id: EXO.3.9
reference: Exodus 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
  footnotes:
  - marker: a
    text: Or 'the children of Israel' or 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the outcry of the sons of Israel has reached me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 보십시오. 이스라엘 자손[a]의 부르짖음이 내게 이르렀으며[b], 나는 또한 이집트 사람들이 그들을 압제하는 압제를 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역적 표현이며, 문맥상 ‘이스라엘 사람들’ 또는 ‘이스라엘의 자녀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내게 이르렀으며’는 히브리어의 ‘내게 왔다’는 표현을 자연스럽게 옮긴 것으로, ‘내게 닿았으며’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 문맥 전환과 시간 부사를 자연스럽게 살리되, 현대 한국어에서는 ‘이제’가 가장 간결하고 유려합니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: HALOT
  rationale: 주의 환기와 직시를 요청하는 감탄적 표지로서, 합쇼체 서술에서 ‘보십시오’가 가장 적절합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 관용구를 직접 반영하여, 성별 중립화보다 원문의 언약적 표현을 보존했습니다.
- source_word: צַעֲקַת ... בָּאָה אֵלַי
  english_pob_choice: the cry ... has come to me
  chosen_korean: 부르짖음이 내게 이르렀고
  alternatives_korean:
  - 외침이 내게 닿았고
  - 부르짖음이 내게 도달했고
  lexicon: HALOT
  rationale: ‘부르짖음’은 고통 속의 절규를 잘 드러내며, ‘이르렀다’는 히브리어 도착 동사의 이미지를 자연스럽게 옮깁니다.
- source_word: הַלַּחַץ ... לֹחֲצִים
  english_pob_choice: the oppression with which the Egyptians are oppressing them
  chosen_korean: 그 압제 ... 압제하는
  alternatives_korean:
  - 그 학대 ... 학대하는
  - 그 억압 ... 억압하는
  lexicon: HALOT
  rationale: 명사와 동사의 어근 반복을 살려 ‘압제/압제하는’으로 대응시켜, 원문의 수사적 중복과 긴박함을 보존했습니다.
theological_decisions:
- issue: 히브리어 친족 호칭의 성별-정확성 보존
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  rationale: 원문이 가진 집단적·언약적 호칭을 약화시키지 않기 위해, 중립화보다 직역적 관용구를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: 하나님의 직접 발화에서의 문체
  chosen_reading: 보십시오
  alternative_readings:
  - 보라
  rationale: 본문이 하나님의 말씀이라는 점은 존대 종결과 직접호격을 통해 자연스럽게 드러내되, 현대 합쇼체 문체를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6
