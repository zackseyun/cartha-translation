revisions:
- from: 그때 야훼의 천사가 떨기나무 한가운데에서 불꽃 가운데 그에게 나타났습니다. 모세는 바라보았는데, 보십시오, 떨기나무는 불에 타고 있었지만 떨기나무는 사라지지 않았습니다.[a]
  to: 그때 야훼의 천사[a]가 떨기나무 한가운데의 불꽃 속에서 그에게 나타났습니다. 그가 보니, 떨기나무가 불에 타고 있었지만 떨기나무는 타서 없어지지 않았습니다.
  rationale: 수식 관계를 바로잡아 천사가 떨기나무 가운데의 불꽃 속에서 나타난 장면을 명료하게 옮겼습니다. 또한 ‘소비되지 않다’의 의미를 ‘타서 없어지지 않았다’로 드러내고, 서술문에 맞게 표현을 다듬었습니다. ‘야훼의 천사’라는 본문상의 표현과 그 어휘적 대안은 그대로 보존했습니다.
