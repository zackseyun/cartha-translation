base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
  footnotes:
  - marker: a
    text: Or 'the messenger of the LORD.' The Hebrew word can mean either 'angel' or 'messenger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 천사가 떨기나무 한가운데에서 불꽃 가운데 그에게 나타났습니다. 모세는 바라보았는데, 보십시오, 떨기나무는 불에 타고 있었지만 떨기나무는 사라지지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 사자’. 히브리어 מַלְאַךְ는 ‘천사’와 ‘사자/메신저’를 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהֹוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ는 ‘천사’와 ‘사자/메신저’ 모두 가능하지만, 이 신현 문맥에서는 한국어 독자가 즉각 이해할 수 있는 기본 대응인 ‘천사’를 택하되, 주석에서 의미의 폭을 열어 두는 편이 원문에 충실합니다.
- source_word: בְּלַבַּת אֵשׁ
  english_pob_choice: in a flame of fire
  chosen_korean: 불꽃 가운데
  alternatives_korean:
  - 불꽃 속에서
  - 불타는 불꽃 가운데
  lexicon: HALOT
  rationale: 히브리어는 ‘불꽃/화염’ 이미지를 분명히 하므로, 단순히 ‘불로’가 아니라 ‘불꽃 가운데’로 옮겨 원문의 시각적 강도를 살렸습니다.
- source_word: מִתּוֹךְ הַסְּנֶה
  english_pob_choice: from the midst of the bush
  chosen_korean: 떨기나무 한가운데에서
  alternatives_korean:
  - 떨기나무 속에서
  - 덤불 한가운데에서
  lexicon: HALOT
  rationale: סְּנֶה는 이 본문에서 관용적으로 ‘떨기나무’로 옮기는 것이 가장 안정적이며, מִתּוֹךְ는 ‘한가운데에서’로 번역해 원문의 ‘가운데로부터’라는 공간감을 보존했습니다.
- source_word: אֵינֶנּוּ אֻכָּל
  english_pob_choice: was not consumed
  chosen_korean: 사라지지 않았습니다
  alternatives_korean:
  - 타서 없어지지 않았습니다
  - 소멸되지 않았습니다
  lexicon: HALOT
  rationale: אכל의 기본 의미는 ‘먹다’지만 여기서는 ‘삼켜져 없어지다/소모되다’의 뉘앙스이므로, 불에 탔지만 사라지지 않는 역설을 자연스럽게 드러내는 ‘사라지지 않았습니다’를 택했습니다.
theological_decisions:
- issue: 야훼의 천사와 야훼의 직접 현현 사이의 긴장
  chosen_reading: 본문 표면에는 ‘야훼의 천사’가 나타난다고 유지하고, 본문 자체가 계시하는 현현의 신비는 해석으로 평면화하지 않습니다.
  alternative_readings:
  - ‘야훼께서 나타나셨다’로 직접 번역
  - ‘야훼의 사자’로 약화
  rationale: 원문은 매개적 존재를 분명히 말하면서도 곧이어 신현의 장면으로 들어가므로, 한국어도 그 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
