    rationale: 어휘 대안 각주는 ‘천사’ 바로 뒤에 붙이는 편이 명확합니다. ‘그가 보니’는 וְהִנֵּה가 이끄는 주목의 효과를 자연스러운 한국어 서술 안에서 전달합니다.
