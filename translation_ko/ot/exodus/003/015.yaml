base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; alternatively rendered ''Yahweh.'''
    reason: alternative_reading
  - marker: b
    text: Or 'my remembrance' or 'the name by which I am remembered.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 모세에게 또 말씀하셨습니다. 「이스라엘 자손에게 이렇게 말하십시오. ‘야훼[a], 너희 조상들의 하나님, 곧 아브라함의 하나님, 이삭의 하나님, 야곱의 하나님께서 나를 너희에게 보내셨습니다.’ 이것이 영원히 내 이름이며, 이것이 대대로 나를 기억하게 하는 이름입니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 신명은 YHWH이며, 여기서는 이를 ‘야훼’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어 זִכְרִי는 ‘나의 기억’, ‘나의 기념’ 또는 ‘나를 기억하게 하는 이름’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유한 신명(神名)을 지칭하므로 전통적 대치어인 ‘주’보다 음역인 ‘야훼’를 택해, 본문이 드러내는 언약적 이름을 보존했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 표현을 직접 반영하되, 한국어에서는 관용적이면서도 본문에 가까운 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  english_pob_choice: the God of your fathers
  chosen_korean: 너희 조상들의 하나님
  alternatives_korean:
  - 너희 아버지들의 하나님
  - 너희 선조들의 하나님
  lexicon: HALOT
  rationale: 히브리어가 문자적으로는 ‘아버지들’을 뜻하지만, 한국어에서는 혈통적 계승을 자연스럽게 드러내는 ‘조상들’이 문맥상 적절합니다.
- source_word: שְׁלָחַנִי
  english_pob_choice: has sent me
  chosen_korean: 나를 보내셨습니다
  alternatives_korean:
  - 나를 보냈습니다
  - 나를 파송하셨습니다
  lexicon: HALOT
  rationale: 완료형의 현재 관련성을 한국어 존대 서술로 자연스럽게 살려, 하나님이 이미 모세를 보내신 권위를 분명히 했습니다.
- source_word: זֶה שְּׁמִי לְעֹלָם
  english_pob_choice: This is my name forever
  chosen_korean: 이것이 영원한 나의 이름이며
  alternatives_korean:
  - 이것이 영원토록 나의 이름이며
  - 이것이 내 이름으로 영원하며
  lexicon: HALOT
  rationale: ‘לְעֹלָם’의 지속성을 ‘영원한’으로 압축해, 이름의 지속적 효력을 분명하게 했습니다.
- source_word: זִכְרִי
  english_pob_choice: my memorial
  chosen_korean: 나를 기억할 이름
  alternatives_korean:
  - 나의 기억
  - 나의 기념물
  - 나의 기념
  lexicon: HALOT
  rationale: ‘memorial/remembered name’의 의미를 한국어에서 가장 자연스럽게 풀어, 단순한 추상 명사보다 ‘기억할 이름’으로 기능을 드러냈습니다.
theological_decisions:
- issue: 신명(神名) יְהוָה의 한국어 표기
  chosen_reading: ‘야훼’로 음역하여 본문에 보존했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’로 대치
  rationale: 본절은 하나님의 자기계시적 이름을 중심으로 하므로, 대치어보다 음역이 신학적·본문적 긴장을 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘이름’과 ‘기억’의 병행 표현
  chosen_reading: ‘이것이 영원한 나의 이름이며, 이것이 대대로 나를 기억할 이름입니다.’
  alternative_readings:
  - ‘나의 기념입니다’
  - ‘나를 기억하는 기념입니다’
  rationale: 히브리어의 זִכְרִי는 단순한 추상적 ‘기억’보다 ‘기억하게 하는 이름/기념’의 뉘앙스를 지니므로, 한국어에서는 반복 구조를 유지하면서 기능적 의미를 드러냈습니다.
  doctrine_reference: HALOT on זכר, covenantal memorial language
