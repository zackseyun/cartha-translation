id: EXO.3.21
reference: Exodus 3:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֛י אֶת חֵ֥ן הָֽ/עָם הַ/זֶּ֖ה בְּ/עֵינֵ֣י מִצְרָ֑יִם וְ/הָיָה֙ כִּ֣י תֵֽלֵכ֔וּ/ן לֹ֥א תֵלְכ֖וּ רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
  footnotes:
  - marker: a
    text: Or 'in the eyes of the Egyptians.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you will not go out empty.' The Hebrew idiom means departing without goods or provisions.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 백성에게 애굽 사람들의 눈에 호의를 주겠습니다. 그리고 여러분이 갈 때에는 빈손으로 가지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘애굽 사람들의 눈 안에서’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘빈손으로 나오지 않을 것입니다’. 이 히브리어 관용구는 물품이나 양식 없이 떠나는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will give
  chosen_korean: 내가 … 주겠습니다
  alternatives_korean:
  - 내가 … 주겠습니다
  - 내가 … 부여하겠습니다
  - 내가 … 허락하겠습니다
  lexicon: HALOT
  rationale: נתן의 기본 의미인 ‘주다’를 살리면서, 한국어에서는 ‘호의를 주다’가 가장 자연스럽게 문맥의 의미를 드러냅니다.
- source_word: חֵן
  english_pob_choice: favor
  chosen_korean: 호의
  alternatives_korean:
  - 은혜
  - 호감
  - 사랑을 받음
  lexicon: HALOT
  rationale: 이 문맥의 חֵן은 신학적 ‘은혜’보다 사람들 사이의 ‘호의/호감’에 가깝기 때문에, 사회적 뉘앙스를 드러내는 ‘호의’를 택했습니다.
- source_word: בְּעֵינֵי מִצְרָיִם
  english_pob_choice: in the sight of the Egyptians
  chosen_korean: 애굽 사람들의 눈에
  alternatives_korean:
  - 애굽 사람들의 시야에서
  - 애굽 사람들의 눈앞에서
  - 애굽 사람들에게
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에’의 직설성을 살리기 위해 한국어에서도 ‘눈에’를 유지했습니다. 인식·평가의 관점을 드러내는 표현입니다.
- source_word: תֵלֵכוּן / תֵלְכ֖וּ רֵיקָם
  english_pob_choice: you will not go empty-handed
  chosen_korean: 빈손으로 가지 않을 것입니다
  alternatives_korean:
  - 빈손으로 떠나지 않을 것입니다
  - 아무것도 없이 가지 않을 것입니다
  - 빈손으로 나가지 않을 것입니다
  lexicon: HALOT
  rationale: רֵיקָם의 관용적 의미를 한국어의 자연스러운 관용 표현 ‘빈손으로’로 옮겼습니다. ‘가지 않을 것입니다’는 출발의 뜻을 유지하면서도 현대 한국어로 매끄럽습니다.
theological_decisions:
- issue: 이스라엘의 출발을 빈손이 아니라 ‘호의/재물’을 가지고 하게 하신다는 약속의 표현
  chosen_reading: 본문의 초점은 도덕적 권고가 아니라, 하나님이 애굽 사람들의 태도를 바꾸셔서 이스라엘이 출애굽할 때 빈손이 되지 않게 하신다는 약속입니다.
  alternative_readings:
  - 단순히 ‘좋은 인상’을 얻게 하신다는 일반적 표현
  - ‘은혜’를 받아 영적 의미로 읽는 해석
  rationale: חֵן과 ‘빈손’의 대조를 그대로 살려, 출애굽 맥락의 구체적 약속으로 읽히도록 했습니다.
  doctrine_reference: 출애굽기 3장 문맥상 출애굽 준비와 하나님의 섭리
