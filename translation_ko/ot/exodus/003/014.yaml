  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
  footnotes:
  - marker: a
    text: Or, “I will be what I will be,” or “I will be who I will be.” The Hebrew verb can carry future sense as well as present force here.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew: “sons of Israel.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님께서 모세에게 말씀하셨습니다. 「나는 나인 존재이다[a].」 또 말씀하셨습니다. 「너는 이스라엘 자손에게 이렇게 말하여라. ‘나인 존재가 너희에게 나를 보냈다.’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 현재적 의미와 미래적 의미를 모두 가질 수 있습니다. 따라서 이 구절은 ‘나는 나인 존재이다’ 외에도 ‘나는 내가 될 존재이다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 신들
  lexicon: HALOT
  rationale: 이 서술 문맥에서 복수형 어미는 이스라엘의 하나님을 가리키는 단수 호칭으로 기능하므로, 한국어에서는 표준적인 ‘하나님’이 원문의 의미를 가장 자연스럽게 전달합니다.
- source_word: אֶהְיֶה אֲשֶׁר אֶהְיֶה
  english_pob_choice: I AM WHO I AM
  chosen_korean: 나는 나인 존재이다
  alternatives_korean:
  - 나는 내가 될 존재이다
  - 나는 내가 있을 존재이다
  - 나는 나다
  lexicon: HALOT
  rationale: 히브리어 יהיה의 1인칭 미완료형이 현재적 자기계시와 미래적 함의를 함께 가지므로, 한국어에서는 단정적 현재문으로만 고정하지 않고 존재를 드러내는 표현으로 옮겨 그 긴장을 보존했습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘 사람들에게
  - 이스라엘의 아들들에게
  lexicon: HALOT
  rationale: בְּנֵי의 문자적 남성 복수 형식을 반영하면서도 한국어 성경 문맥에서 통용되는 표현을 살려 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: שְׁלָחַנִי
  english_pob_choice: has sent me
  chosen_korean: 나를 보냈다
  alternatives_korean:
  - 나를 보내셨다
  - 나를 파송하셨다
  lexicon: HALOT
  rationale: 직접 인용문 안에서 전달되는 사명의 진술이므로, 한국어에서는 현재 관련성을 과도하게 드러내는 완료형보다 간결한 서술형이 원문 기능을 잘 살립니다.
theological_decisions:
- issue: 신적 자기계시 האהיה의 한국어 처리
  chosen_reading: ‘나는 나인 존재이다’로 옮겨, 이름처럼 반복되는 자기지시와 존재의 개방성을 함께 드러냈습니다.
  alternative_readings:
  - ‘나는 스스로 있는 자이다’
  - ‘나는 있을 자이다’
  - ‘나는 나다’
  rationale: 원문은 단순 정의가 아니라 하나님이 스스로를 규정하시는 선언이므로, 전통적 표현을 그대로 반복하기보다 자기계시의 성격과 미완료형이 지닌 긴장을 함께 보존하는 번역을 택했습니다.
  doctrine_reference: 출 3:14의 신적 자기계시와 번역상의 시제-상 긴장 보존
- issue: 마지막 절의 단수 주어 반복
  chosen_reading: ‘나인 존재’라는 반복 표현을 사용해 1인칭 자기지시의 반복을 유지했습니다.
  alternative_readings:
  - ‘나는 나’
  - ‘나는 그이다’
  rationale: 히브리어 본문은 동일한 1인칭 ფორმ을 반복하여 강조하므로, 한국어에서도 인칭 대명사만 바꾸어 약화시키지 않고 자기지시를 재현했습니다.
  doctrine_reference: 출 3:14의 반복 강조와 자기계시의 동일성 유지
