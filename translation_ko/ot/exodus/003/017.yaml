base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
  footnotes:
  - marker: a
    text: Or, “And I said, ‘I will bring you up ...’” The Hebrew verb is formally past; the main text renders it with present relevance in context.
    reason: alternative_reading
  - marker: b
    text: “Affliction of Egypt” may also be rendered “oppression in Egypt” or “Egypt’s misery.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 말하였습니다[a]. ‘너희를 이집트의 고난[b]에서 끌어올려 가나안 사람과 헷 사람과 아모리 사람과 브리스 사람과 히위 사람과 여부스 사람이 사는 땅, 곧 젖과 꿀이 흐르는 땅으로 데려가겠습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 내가 말했다.’ 히브리어 동사는 형식상 과거형이며, 본문에서는 이미 선언된 하나님의 뜻을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: ‘이집트의 고난’은 ‘이집트의 압제’ 또는 ‘이집트의 비참함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: And I have said
  chosen_korean: 그리고 내가 말했습니다
  alternatives_korean:
  - 그리고 내가 말했습니다
  - 그리고 내가 말했습니다—이미 말씀드렸습니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 현재적 관련성을 살리되, 한국어에서는 합쇼체의 과거형으로 자연스럽게 옮겨 하나님의 이미 선포된 약속을 드러냈습니다.
- source_word: מֵעֳנִי מִצְרַיִם
  english_pob_choice: out of the affliction of Egypt
  chosen_korean: 이집트의 고난에서
  alternatives_korean:
  - 이집트의 압제에서
  - 이집트의 고통에서
  lexicon: HALOT
  rationale: עֳנִי는 단순한 지리적 ‘이집트에서’가 아니라 그곳의 고난·압제를 가리키므로, 문맥을 살려 ‘고난에서’로 옮겼습니다.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  english_pob_choice: the Canaanites ... the Jebusites
  chosen_korean: 가나안 사람과 헷 사람과 아모리 사람과 브리스 사람과 히위 사람과 여부스 사람
  alternatives_korean:
  - 가나안인과 헷인과 아모리인과 브리스인과 히위인과 여부스인
  - 가나안 족속과 ... 여부스 족속
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만, 한국어에서는 민족·거주 집단을 복수적 집합 명칭으로 자연스럽게 나타내어 목록의 의미를 보존했습니다.
- source_word: זָבַת חָלָב וּדְבָשׁ
  english_pob_choice: flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅
  alternatives_korean:
  - 젖과 꿀이 흐르는 땅
  - 우유와 꿀이 흐르는 땅
  lexicon: HALOT
  rationale: 풍요와 비옥함을 나타내는 관용구를 기존 성경어법과 의미를 함께 살려 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 동사 시제의 현재적 관련성
  chosen_reading: ‘그리고 내가 말했습니다’로 옮겨, 이미 선포된 약속이 지금도 유효한 하나님의 선언으로 들리게 했습니다.
  alternative_readings:
  - ‘그리고 내가 말했습니다’의 단순 과거
  - ‘그리고 내가 이미 말했습니다’
  rationale: 히브리어 완료형은 형식상 과거이지만, 본문에서는 현재적 효력을 지닌 재확인된 약속으로 기능하므로, 과장 없이 그 효력을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
