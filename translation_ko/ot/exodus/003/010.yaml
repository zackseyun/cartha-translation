  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
  footnotes:
  - marker: a
    text: 'Or, more idiomatically, ''the Israelites.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 가십시오. 내가 당신을 파라오에게 보내고, 내 백성, 곧 이스라엘의 자손을 이집트에서 이끌어 내게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘이스라엘의 아들들/자손들’입니다. 더 자연스럽게는 ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 자, 이제
  lexicon: HALOT
  rationale: 전환 표지로서의 וְעַתָּה를 자연스러운 담화 연결어 ‘이제’로 옮겨, 새 단계의 소명을 시작하는 흐름을 살렸습니다.
- source_word: לְכָה
  english_pob_choice: come
  chosen_korean: 가십시오
  alternatives_korean:
  - 오십시오
  - 가세요
  lexicon: HALOT
  rationale: 히브리어 관용적 소환은 대체로 ‘가라/가십시오’ 또는 ‘오라/오십시오’로 갈릴 수 있는데, 본절에서는 하나님이 모세를 파라오에게 파견하는 방향성이 분명하므로 ‘가십시오’가 문맥에 더 잘 맞습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 영어 POB가 각주에서 보존한 히브리어 표현을 반영해 직역적인 친족·계보적 표지를 유지했습니다. ‘이스라엘 백성’은 의미는 자연스럽지만 원문의 형식을 약화시킵니다.
- source_word: מִמִּצְרָיִם
  english_pob_choice: out of Egypt
  chosen_korean: 이집트에서 이끌어 내게 하겠습니다
  alternatives_korean:
  - 이집트에서 데려내게 하겠습니다
  - 이집트에서 끌어내게 하겠습니다
  lexicon: HALOT
  rationale: הוציא의 사역적 의미를 한국어 ‘이끌어 내다’로 옮겨 출애굽의 이동·해방 의미를 함께 살렸습니다. 단순히 ‘에서’로만 처리하면 출애굽의 역동성이 약해집니다.
theological_decisions:
- issue: 하나님이 모세를 파라오에게 보내시는 소명 언어의 직접성
  chosen_reading: ‘내가 당신을 파라오에게 보내고’로 직설적인 파견 표현을 유지했습니다.
  alternative_readings:
  - ‘내가 너를 파라오에게 보내고’
  - ‘내가 파라오에게 보내도록 너를 보낼 것이며’
  rationale: 본문은 하나님의 권위 있는 위임을 드러내므로, 한국어에서도 간접화나 완화 없이 직접적인 파견 선언으로 옮기는 것이 적절합니다. 모세에 대한 호칭은 서술체 합쇼체에 맞춰 공손하게 처리했습니다.
  doctrine_reference: 출애굽기 3장 소명 서술의 문맥적 권위
