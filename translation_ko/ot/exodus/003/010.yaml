  source_fidelity: 수정이 필요합니다. וְהוֹצֵא는 모세에게 주어진 히필 명령형(‘이끌어 내십시오’)인데, 초안의 ‘이끌어 내게 하겠습니다’는 하나님이 그렇게 하게 하시겠다는 미래·사역 구문으로 바꾸어 명령의 직접성과 문장 구조를 손상시킵니다. 또한 ‘그리고 이제’에 해당하는 담화 연결은 ‘그러니 이제’로 자연스럽게 드러낼 수 있습니다.
  naturalness: 합쇼체에서는 하나님이 모세에게 말씀하시는 직접 발화를 ‘당신’으로 반복하기보다, 필요한 곳에만 주어를 두고 생략하는 편이 현대 표준 한국어에서 더 자연스럽습니다. ‘이스라엘 자손’은 성서 문맥에서 자연스럽고 널리 통용되는 표현입니다.
  terminology: ‘파라오’, ‘내 백성’, ‘이스라엘 자손’, ‘이집트에서 이끌어 내십시오’는 원문의 명칭과 사역적 의미를 적절히 보존합니다. ‘이스라엘 자손’은 히브리어의 계보적 명칭을 반영하며, 직역상의 ‘아들들’은 각주로 밝혀 둘 수 있습니다.
