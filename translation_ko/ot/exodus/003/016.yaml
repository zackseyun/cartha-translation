base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
  footnotes:
  - marker: a
    text: Or, 'I have surely visited you.' The Hebrew expression intensifies the verb and can denote decisive divine attention leading to intervention, not merely a social visit.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your fathers'; the phrase is then specified by 'the God of Abraham, Isaac, and Jacob.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 이스라엘의 장로들을 모으고, 그들에게 이렇게 말하십시오. ‘야훼, 곧 너희 조상의 하나님[b], 아브라함과 이삭과 야곱의 하나님께서 나에게 나타나 이렇게 말씀하셨습니다. “내가 너희를 반드시 돌보았고[a], 이집트에서 너희에게 행해진 일을 살펴보았다.”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘반드시 돌보았다’는 히브리어 강조형 פָּקֹד פָּקַדְתִּי를 반영합니다. 이 표현은 단순한 ‘방문’이 아니라, 개입으로 이어지는 결정적인 관심을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘너희 아버지들의 하나님’입니다. 이어지는 ‘아브라함과 이삭과 야곱의 하나님’이 그 족장적 의미를 구체화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 가십시오
  - 가라
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령형으로 시작하는 파송 명령이므로, 현대 한국어의 자연스러운 명령 연결형 ‘가서’로 옮겨 간결하게 유지했습니다.
- source_word: וְ/אָסַפְתָּ אֶת זִקְנֵי יִשְׂרָאֵל
  english_pob_choice: and gather the elders of Israel
  chosen_korean: 이스라엘의 장로들을 모으고
  alternatives_korean:
  - 이스라엘 장로들을 모으고
  - 이스라엘의 원로들을 모으고
  lexicon: HALOT
  rationale: זִקְנֵי는 공동체 지도자들을 가리키는 정식 표현이므로 ‘장로들’을 유지했고, אָסף는 사람들을 모아 한 자리에 집합시키는 뜻에 맞게 ‘모으다’로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי אֲבֹתֵיכֶם
  english_pob_choice: Yahweh, the God of your fathers
  chosen_korean: 야훼, 곧 너희 조상의 하나님
  alternatives_korean:
  - 여호와, 곧 너희 조상의 하나님
  - 야훼, 곧 너희 조상들의 하나님
  lexicon: HALOT
  rationale: 본문의 여호와는 하나님의 고유명사이므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, אֱלֹהֵי אֲבֹתֵיכֶם는 족장-언약 맥락을 살려 ‘너희 조상의 하나님’으로 유지했습니다.
- source_word: נִרְאָה אֵלַי
  english_pob_choice: has appeared to me
  chosen_korean: 나에게 나타나셔서
  alternatives_korean:
  - 내게 나타나셔서
  - 내가 보게 되셔서
  lexicon: HALOT
  rationale: נראה는 하나님의 현현을 가리키는 표준 표현이므로 ‘나타나시다’로 옮겼고, 앞선 인용 속 과거완료 느낌은 한국어에서는 자연스러운 서술 연결로 처리했습니다.
- source_word: פָּקֹד פָּקַדְתִּי
  english_pob_choice: I have surely attended to you
  chosen_korean: 나는 너희를 분명히 살펴보았고
  alternatives_korean:
  - 나는 너희를 반드시 돌아보았고
  - 나는 너희를 분명히 찾아보았고
  - 나는 너희를 확실히 돌보았고
  lexicon: HALOT
  rationale: ידיעה가 아니라 निर्णायक한 신적 관심과 개입을 뜻하는 강조형이므로, 단순한 ‘방문’ 대신 ‘분명히 살펴보다’로 옮겨 지속적이고 의도적인 주의를 드러냈습니다.
- source_word: וְ/אֶת הֶ/עָשׂוּי לָ/כֶם בְּ/מִצְרָֽיִם
  english_pob_choice: and to what has been done to you in Egypt
  chosen_korean: 이집트에서 너희에게 일어난 일을 살펴보았습니다
  alternatives_korean:
  - 이집트에서 너희에게 행해진 일을 살펴보았습니다
  - 이집트에서 너희에게 된 일을 살펴보았습니다
  lexicon: HALOT
  rationale: 수동 분사구는 가해 주체를 굳이 보태지 않고 ‘너희에게 일어난 일’로 자연스럽게 살리되, מקום 부사구는 ‘이집트에서’로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 여호와의 고유명사 표기
  chosen_reading: ‘יהוה’는 ‘야훼’로 음역해 언약적 고유명사를 보존했습니다.
  alternative_readings:
  - ‘여호와’로 전통 번역
  - ‘주님’으로 대체
  rationale: 본문은 칭호가 아니라 하나님의 이름을 직접 제시하므로, 제목화한 ‘주님’보다 고유명사 표기가 소스의 의미를 더 정확히 드러냅니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → 야훼
- issue: ‘아버지들/조상들’ 표현
  chosen_reading: ‘조상’으로 옮기되, 이어지는 아브라함·이삭·야곱으로 족장 언약성을 분명히 했습니다.
  alternative_readings:
  - ‘아버지들’
  - ‘선조들’
  rationale: 한국어에서는 ‘아버지들’이 다소 문자적이어서, 인칭적 관계는 유지하면서도 자연스러운 ‘조상’이 더 읽기 좋습니다. 다만 바로 뒤의 족장 명시로 언약적 연속성은 보존됩니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
