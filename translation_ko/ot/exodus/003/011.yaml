  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
  footnotes:
  - marker: a
    text: Or “the Israelites” or traditionally “the children of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 모세가 하나님께 말했습니다. "제가 누구이기에 바로에게 가며, 제가 누구이기에 이스라엘 자손을 이집트에서 이끌어 낼 수 있습니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "이스라엘 사람들" 또는 전통적으로 "이스라엘 자손들"이라고 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל הָאֱלֹהִים
  english_pob_choice: said to God
  chosen_korean: 하나님께 말했습니다
  alternatives_korean:
  - 하나님께 이르렀습니다
  - 하나님께 말씀드렸습니다
  lexicon: HALOT
  rationale: 서술문형 wayyiqtol의 담담한 진술을 살리면서, 모세의 발화 상대가 하나님임을 자연스럽게 드러내는 현대 한국어로 옮겼습니다.
- source_word: מִי אָנֹכִי
  english_pob_choice: Who am I
  chosen_korean: 제가 누구이기에
  alternatives_korean:
  - 내가 누구이기에
  - 저는 누구입니까
  lexicon: HALOT
  rationale: 수사적 자기비하/무자격감을 살리기 위해 직역형 질문보다 이유절 느낌의 "누구이기에"를 사용했습니다.
- source_word: אֵלֵךְ ... אוֹצִיא
  english_pob_choice: I should go ... I should bring out
  chosen_korean: 가며, 제가 누구이기에 ... 이끌어 낼 수 있습니까
  alternatives_korean:
  - 가며, ... 이끌어 내겠습니까
  - 가며, ... 데려올 수 있습니까
  lexicon: HALOT
  rationale: 히필의 오로지 '밖으로 이끌어 내다'라는 방향성을 살려 "이끌어 내다"를 택했고, 수사적 질문의 억양을 한국어에서는 가능형으로 자연화했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 친족적 표현을 보존하면서도 한국어 성경에서 널리 통용되는 표준적 대응을 택했습니다.
theological_decisions:
- issue: מִי אָנֹכִי의 수사적 겸손 표현
  chosen_reading: 모세의 자기 부적격을 드러내는 질문으로 유지했습니다.
  alternative_readings:
  - 단순한 정보 질문처럼 완화하는 읽기
  - 과장된 자기비하로 해석하는 읽기
  rationale: 이 구절은 모세의 내적 불충분감이 핵심이므로, 한국어에서도 단순한 사실 질문이 아니라 소명 앞의 두려움과 부적격감을 드러내도록 했습니다.
  doctrine_reference: 출애굽기 3장 문맥의 소명 서사
