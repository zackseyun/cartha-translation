- from: 그러나 모세가 하나님께 말했습니다. "제가 누구이기에 바로에게 가며, 제가 누구이기에 이스라엘 자손을 이집트에서 이끌어 낼 수 있습니까?"[a]
  to: 그러자 모세가 하나님께 말씀드렸습니다. “제가 누구이기에 바로에게 가서 이스라엘 자손[a]을 이집트에서 이끌어 내겠습니까?”
  rationale: The revision preserves the single Hebrew rhetorical question and its two coordinated actions, avoids reducing the question to mere ability, and moves the footnote anchor to the expression it explains. It retains standard Korean terminology and modern formal-polite narrative and dialogue register.
