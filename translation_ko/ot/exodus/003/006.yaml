- from: 그때 그분이 말씀하셨습니다. 「나는 네 아버지의 하나님, 아브라함의 하나님, 이삭의 하나님, 야곱의 하나님이다」라고 하셨습니다. 모세는 하나님을 바라보는 것이 두려워 자기 얼굴을 가렸습니다.
  to: 그때 그분께서 말씀하셨습니다. “나는 네 아버지의 하나님, 아브라함의 하나님, 이삭의 하나님, 야곱의 하나님입니다.” 모세는 하나님을 바라보는 것이 두려워 얼굴을 가렸습니다.
  rationale: 원문의 발화는 한 번만 귀속시키고, 히브리어의 신적 자기-identification 및 족장들의 이름마다 반복되는 ‘하나님’을 그대로 보존했습니다. 모세가 하나님을 보는 것을 두려워하여 얼굴을 가렸다는 인과관계도 유지했습니다.
