  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: ko
  text: 그때 그분이 말씀하셨습니다. 「나는 네 아버지의 하나님, 아브라함의 하나님, 이삭의 하나님, 야곱의 하나님이다」라고 하셨습니다. 모세는 하나님을 바라보는 것이 두려워 자기 얼굴을 가렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then he said
  chosen_korean: 그때 그분이 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그리하여 말씀하셨습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 살려 자연스러운 한국어로 옮기되, 직접적인 신적 발화이므로 단순한 ‘말하다’보다 ‘말씀하다’를 택했습니다.
- source_word: אָנֹכִי
  english_pob_choice: I am
  chosen_korean: 나는 …이다
  alternatives_korean:
  - 내가 …이다
  - 나는 …
  lexicon: HALOT
  rationale: אָנֹכִי의 강조를 살리기 위해 주어를 분명히 두고, 서술적 동일시를 한국어의 ‘나는 …이다’ 구조로 옮겼습니다.
- source_word: אֱלֹהֵי אָבִיךָ / אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  english_pob_choice: the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob
  chosen_korean: 네 아버지의 하나님, 아브라함의 하나님, 이삭의 하나님, 야곱의 하나님
  alternatives_korean:
  - 너의 아버지의 하나님, 아브라함·이삭·야곱의 하나님
  - 아브라함과 이삭과 야곱의 하나님
  lexicon: HALOT
  rationale: 히브리어의 반복된 ‘하나님’ 구조를 압축하지 않고 살려, 언약적 자기 계시의 무게를 보존했습니다.
- source_word: וַיַּסְתֵּר פָּנָיו
  english_pob_choice: Moses hid his face
  chosen_korean: 모세는 … 자기 얼굴을 가렸습니다
  alternatives_korean:
  - 모세는 얼굴을 숨겼습니다
  - 모세는 자기 얼굴을 감췄습니다
  lexicon: HALOT
  rationale: פָּנָיו의 문자적 의미를 따라 ‘얼굴’로 유지했고, theophany 앞에서의 회피 동작을 자연스럽게 ‘가리다’로 옮겼습니다.
- source_word: מֵהַבִּיט אֶל הָאֱלֹהִים
  english_pob_choice: because he was afraid to look at God
  chosen_korean: 하나님을 바라보는 것이 두려워
  alternatives_korean:
  - 하나님을 쳐다보는 것이 두려워
  - 하나님을 뵙는 것이 두려워
  lexicon: HALOT
  rationale: ‘보다/바라보다’의 의미를 살리되, 한국어에서 더 자연스러운 ‘바라보는 것’으로 옮겨 פחד의 이유를 분명히 했습니다.
theological_decisions:
- issue: 히브리어 אֱלֹהִים의 번역
  chosen_reading: 하나님
  alternative_readings:
  - 신적 존재
  - 신
  rationale: 맥락이 떨기나무 가운데서 모세에게 말씀하시는 언약의 하나님이므로, 일반명사화하지 않고 고유한 신적 지시를 드러내는 ‘하나님’을 유지했습니다.
  doctrine_reference: '출 3:6 문맥; 번역 원칙 #1'
- issue: 다중 반복형 ‘the God of …’ 보존
  chosen_reading: 아브라함의 하나님, 이삭의 하나님, 야곱의 하나님
  alternative_readings:
  - 아브라함·이삭·야곱의 하나님
  rationale: 반복을 줄이면 의미는 전달되지만, 원문의 언약적 강조와 리듬이 약해지므로 반복 구조를 보존했습니다.
  doctrine_reference: 출 3:6 언약 공식
