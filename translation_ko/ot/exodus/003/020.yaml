  naturalness: ‘내가 손을 뻗어 … 칠 것입니다’와 ‘그 뒤에 그가 너희를 내보낼 것입니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘기이한 일들’은 현대어에서 기묘하거나 이상하다는 뉘앙스를 띨 수 있어, 경이로운 행위를 뜻하는 문맥에는 ‘놀라운 일들’이 더 자연스럽습니다.
