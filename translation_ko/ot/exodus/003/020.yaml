revisions:
- from: 내가 손을 펴서 이집트에 있는 모든 나의 기이한 일들로 이집트를 치리니, 그 후에야 그가 너희를 내보낼 것입니다.[a][b]
  to: 내가 손을 뻗어, 그 한가운데에서 내가 행할 나의 모든 놀라운 일로 이집트를 칠 것입니다. 그 뒤에 그가 너희를 내보낼 것입니다.[a][b]
  rationale: 원문의 공간적 표현 ‘그 한가운데에서’를 회복하고, 시간 순서에 덧붙은 강조를 제거했습니다. 또한 현대 한국어에서 자연스러우면서도 נִפְלָאוֹת의 경이로운 행위라는 의미를 보존하도록 ‘놀라운 일들’로 조정했습니다. 두 각주는 각각 ‘손을 보내다’와 ‘너희를 보내다’라는 원문의 직역 및 가능한 대안을 명확히 설명합니다.
