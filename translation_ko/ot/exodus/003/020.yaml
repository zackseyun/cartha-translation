source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֤י אֶת יָדִ/י֙ וְ/הִכֵּיתִ֣י אֶת מִצְרַ֔יִם בְּ/כֹל֙ נִפְלְאֹתַ֔/י אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה בְּ/קִרְבּ֑/וֹ וְ/אַחֲרֵי כֵ֖ן יְשַׁלַּ֥ח אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
  footnotes:
  - marker: a
    text: Or 'I will send out my hand.' The Hebrew idiom means to extend the hand in action or power.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will let you go.' The Hebrew more literally says 'he will send you out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 손을 뻗어, 그 한가운데에서 내가 행할 나의 모든 놀라운 일로 이집트를 칠 것입니다. 그 뒤에 그가 너희를 내보낼 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 손을 보내다’입니다. 여기서는 행동하거나 능력을 나타내기 위해 손을 뻗는다는 히브리어 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희를 보내다’입니다. ‘너희를 놓아주다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת יָדִי
  english_pob_choice: I will stretch out my hand
  chosen_korean: 내가 손을 펴서
  alternatives_korean:
  - 내가 손을 내밀어
  - 내가 손을 뻗어
  lexicon: HALOT
  rationale: שׁלח 손의 관용구를 한국어에서 자연스러운 동작 표현인 ‘손을 펴서’로 옮겨, 하나님의 능동적 개입 이미지를 살리면서도 영어식 직역을 피했습니다.
- source_word: וְהִכֵּיתִי
  english_pob_choice: and strike
  chosen_korean: 치리니
  alternatives_korean:
  - 때리리니
  - 치고
  - 쳐서
  lexicon: HALOT
  rationale: נכה는 여기서 재앙적 심판 행위를 가리키므로, 현대 한국어에서 분명하면서도 과도하게 좁히지 않는 ‘치다’ 계열 표현을 택했습니다.
- source_word: נִפְלְאֹתַי
  english_pob_choice: my wonders
  chosen_korean: 나의 기이한 일들
  alternatives_korean:
  - 나의 놀라운 일들
  - 나의 표적들
  - 나의 기적들
  lexicon: HALOT
  rationale: נפלאות는 단순한 ‘기적’보다 경외를 불러일으키는 비범한 행위를 가리키므로, ‘기이한 일들’이 원문의 폭과 긴장감을 비교적 잘 보존합니다.
- source_word: בְּקִרְבּוֹ
  english_pob_choice: in its midst
  chosen_korean: 이집트에 있는
  alternatives_korean:
  - 그 한가운데서
  - 그 가운데에서
  - 그 안에서
  lexicon: HALOT
  rationale: 문맥상 장소적 중심을 뜻하지만 한국어에서는 ‘그 가운데’보다 ‘이집트에 있는’이 자연스럽고, 이어지는 심판 행위가 이집트 내부에서 일어남을 충분히 드러냅니다.
- source_word: יְשַׁלַּח אֶתְכֶם
  english_pob_choice: he will send you out
  chosen_korean: 그가 너희를 내보낼 것입니다
  alternatives_korean:
  - 그가 너희를 보내어 갈 것입니다
  - 그가 너희를 놓아줄 것입니다
  lexicon: HALOT
  rationale: שׁלח의 반복을 살리면서도, 한국어에서 출애굽의 강제적 해제를 자연스럽게 전하는 ‘내보내다’를 택했습니다.
theological_decisions:
- issue: 하나님의 손을 펴신다는 인간적 신체 이미지
  chosen_reading: ‘손을 펴서’라는 구체적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘권능을 행사하여’처럼 추상화할 수 있습니다.
  rationale: 원문은 하나님의 직접적 개입을 신체 은유로 말하므로, 이를 추상화하면 서사의 힘과 소스 텍스트의 형상을 약화시킵니다.
  doctrine_reference: '번역 원칙: 원문 우선, 인격적·서사적 이미지 보존'
