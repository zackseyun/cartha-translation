base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
  footnotes:
  - marker: a
    text: Or 'you will worship God on this mountain.' The Hebrew verb can mean both 'serve' and, in relation to God, 'worship.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다. 「내가 반드시 너와 함께 있겠습니다. 이것이 내가 너를 보냈다는 것을 네게 보여 줄 표징입니다. 네가 이 백성을 이집트에서 이끌어 낼 때에, 너희는 이 산에서 하나님을 섬길 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희는 이 산에서 하나님을 예배할 것입니다.’ 히브리어 동사 עבד는 ‘섬기다’를 뜻하며, 하나님과 관련해서는 ‘예배하다’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֶהְיֶה עִמָּךְ
  english_pob_choice: Certainly I will be with you
  chosen_korean: 확실히 내가 너와 함께 있겠습니다
  alternatives_korean:
  - 내가 너와 함께 있을 것이다
  - 정녕 내가 너와 함께하겠습니다
  lexicon: HALOT
  rationale: כִּי의 확언적 뉘앙스를 ‘확실히’로 살리고, אֶהְיֶה는 미래적 약속으로 자연스럽게 ‘있겠습니다’로 옮겼습니다.
- source_word: הָאוֹת
  english_pob_choice: the sign
  chosen_korean: 증거
  alternatives_korean:
  - 표징
  - 표적
  lexicon: HALOT
  rationale: 문맥상 뒤따르는 사건이 약속의 진실을 확인해 주는 내용이므로, ‘증거’가 단순한 기호보다 기능을 더 분명히 드러냅니다.
- source_word: בְּהוֹצִיאֲךָ אֶת הָעָם מִמִּצְרַיִם
  english_pob_choice: when you bring the people out of Egypt
  chosen_korean: 네가 이 백성을 이집트에서 이끌어 낸 뒤에는
  alternatives_korean:
  - 네가 이 백성을 이집트에서 이끌어 낼 때
  - 네가 이 백성을 이집트에서 데리고 나올 때
  lexicon: HALOT
  rationale: בְּ + infinitive construction의 시간적 용법을 살려, 출애굽이 완료된 뒤에 확인될 징표라는 흐름을 드러냈습니다.
- source_word: תַּעַבְדוּן אֶת הָאֱלֹהִים
  english_pob_choice: you will serve God
  chosen_korean: 너희가 ... 하나님을 섬길 것입니다
  alternatives_korean:
  - 너희가 ... 하나님을 예배할 것입니다
  - 너희가 ... 하나님께 봉사할 것입니다
  lexicon: HALOT
  rationale: עבד의 의미 범위를 보존하면서, 여기서는 예배만으로 좁히지 않고 ‘섬기다’로 옮겨 출애굽 후 언약적 섬김의 폭을 살렸습니다.
- source_word: עַל הָהָר הַזֶּה
  english_pob_choice: on this mountain
  chosen_korean: 이 산에서
  alternatives_korean:
  - 이 산 위에서
  - 이 산 위에
  lexicon: HALOT
  rationale: 한국어에서 장소 표시는 ‘에서’가 가장 자연스러우며, ‘on’의 물리적 이미지는 문맥상 과도하게 강조하지 않았습니다.
theological_decisions:
- issue: ‘증거’의 성격과 미래 지시성
  chosen_reading: 이 말씀은 현재의 즉각적 징표보다, 출애굽 이후에 성취되어 약속이 सत्य임을 입증할 미래의 사건을 가리킵니다.
  alternative_readings:
  - 현재의 동행 약속 자체가 증거이다
  - 현재와 미래를 함께 가리키는 이중적 징표이다
  rationale: 히브리어 문장의 흐름은 뒤따르는 ‘…할 것입니다’ 절을 징표의 내용으로 제시하므로, 미래 성취를 그대로 보존하는 번역이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
