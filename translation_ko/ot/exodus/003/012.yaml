review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the divine assurance, Moses' role in bringing the people out of Egypt, the plural subject of the ensuing service, and the basic sense of עבד. However, הָאוֹת is more faithfully rendered as ‘표징’ than ‘증거,’ and לְךָ (‘for you’) should be represented. The temporal infinitive construction is best kept as ‘when’ rather than narrowed to ‘after.’
  naturalness: The Korean is generally clear and appropriately formal-polite. The mixed Korean opening quotation mark and English closing quotation mark should be normalized. The revised phrasing is natural modern formal Korean while retaining the verse’s forward-looking structure.
  terminology: ‘표징’ is an established, precise rendering for אוֹת in biblical Korean. ‘하나님을 섬기다’ appropriately preserves the breadth of עבד; the footnote supplies ‘예배하다’ as a valid contextual alternative.
  issues:
  - severity: medium
    issue: ‘증거’ weakens the lexical correspondence to הָאוֹת and omits the addressee expressed by לְךָ.
    rationale: The Hebrew calls the future event a ‘sign for you,’ not merely abstract proof. ‘표징’ retains the biblical term and ‘네게 보여 줄’ naturally expresses its confirmatory function for Moses.
  - severity: low
    issue: ‘이끌어 낸 뒤에는’ makes the temporal relation more strictly posterior than the Hebrew.
    rationale: בְּהוֹצִיאֲךָ is most directly ‘when you bring out.’ The service occurs in connection with the completed exodus, but ‘when’ preserves the source construction without over-specification.
  - severity: low
    issue: The quotation closes with an English right double quotation mark rather than the matching Korean closing mark.
    rationale: This is a punctuation consistency error in the Korean text.
  revised_text: 그가 말씀하셨습니다. 「내가 반드시 너와 함께 있겠습니다. 이것이 내가 너를 보냈다는 것을 네게 보여 줄 표징입니다. 네가 이 백성을 이집트에서 이끌어 낼 때에, 너희는 이 산에서 하나님을 섬길 것입니다.」[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘너희는 이 산에서 하나님을 예배할 것입니다.’ 히브리어 동사 עבד는 ‘섬기다’를 뜻하며, 하나님과 관련해서는 ‘예배하다’를 뜻할 수도 있습니다.
    reason: lexical_alternative
