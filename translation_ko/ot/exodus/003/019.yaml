  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
  footnotes:
  - marker: a
    text: Or, 'the king of Egypt will not let you go, not even by a strong hand,' or 'except by a mighty hand.' The Hebrew clause is elliptical and may emphasize that only overwhelming force will move Pharaoh.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 나는 이집트 왕이 여러분을 내보내지 않을 것임을 압니다. 오직 강한 손으로만 그리할 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트 왕은 강한 손이 아니고는 여러분을 내보내지 않을 것입니다’ 혹은 ‘힘센 손으로만’이라고도 할 수 있습니다. 히브리어 문장은 축약되어 있어, 압도적인 힘만이 바로를 움직인다는 뜻을 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But I
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 그리고 나는
  - 나는
  lexicon: HALOT
  rationale: 독립 대명사가 있는 התחלת 절은 앞말과의 대조를 띠므로, 한국어에서는 자연스러운 역접 표현인 '그러나'로 대비를 살렸습니다.
- source_word: יָדַעְתִּי
  english_pob_choice: know
  chosen_korean: 압니다
  alternatives_korean:
  - 알고 있습니다
  - 안다
  lexicon: HALOT
  rationale: 하나님의 현재적이고 확실한 인식을 나타내므로, 합쇼체의 현재 시제 '압니다'가 가장 자연스럽습니다.
- source_word: לֹא יִתֵּן אֶתְכֶם לַהֲלֹךְ
  english_pob_choice: will not let you go
  chosen_korean: 여러분을 내보내지 않을 것
  alternatives_korean:
  - 여러분이 가도록 허락하지 않을 것
  - 여러분을 가게 하지 않을 것
  lexicon: HALOT
  rationale: נתן + 부정사 구문은 '허락하다/보내다'의 관용적 의미이므로, 출애굽의 맥락을 살린 '내보내지 않다'로 옮겼습니다.
- source_word: בְּיָד חֲזָקָה
  english_pob_choice: except by a strong hand
  chosen_korean: 오직 강한 손으로만
  alternatives_korean:
  - 강한 손이 아니고는
  - 오직 힘센 손으로만
  - 강한 손에 의해서만
  lexicon: HALOT
  rationale: 히브리어의 축약된 표현을 그대로 살리되, 한국어에서는 배제의 의미를 분명히 하기 위해 '오직 …으로만'으로 처리했습니다. '강한 손'은 출애굽기의 핵심 모티프를 유지합니다.
theological_decisions:
- issue: וְלֹא בְּיָד חֲזָקָה의 축약된 의미
  chosen_reading: 바로는 강한 손이 개입하지 않으면 이스라엘을 보내지 않을 것입니다.
  alternative_readings:
  - 강한 손으로도 보내지 않을 것입니다
  - 강한 손이 아니고는 보내지 않을 것입니다
  rationale: 문장이 압축되어 있어 한국어에서는 관계를 보충해야 합니다. 본문 뒤의 맥락(다음 절의 재앙 선언)과 어울리도록, 강제적 개입이 있을 때에만 풀려난다는 뜻을 분명히 했습니다.
  doctrine_reference: 축약문은 문맥으로 해석하되, 해석적 긴장은 과도하게 평준화하지 않고 가능한 한 보존합니다.
