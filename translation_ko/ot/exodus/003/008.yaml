base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
  footnotes:
  - marker: a
    text: Hebrew 'from the hand of Egypt,' an idiom for Egypt's power or control.
    reason: lexical_alternative
  - marker: b
    text: Hebrew singular 'him' in both 'deliver him' and 'bring him up,' referring to Israel as a people collectively.
    reason: lexical_alternative
  - marker: c
    text: Or 'to a good and spacious land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그를[b] 이집트의 손에서[a] 건져 내고, 그 땅에서 그를 이끌어 올려 좋고 넓은 땅[c], 곧 젖과 꿀이 흐르는 땅, 가나안 사람과 헷 사람과 아모리 사람과 브리스 사람과 히위 사람과 여부스 사람이 있는 곳으로 데려가려고 내려왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이집트의 손에서’라고 하여, 이집트의 권력이나 지배를 뜻하는 관용구를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 두 곳에서 ‘그를’이라고 단수형을 사용하지만, 여기서는 이스라엘 백성 전체를 집합적으로 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘좋고 널찍한 땅’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד / I have come down
  english_pob_choice: I have come down
  chosen_korean: 내가 내려가서
  alternatives_korean:
  - 내가 내려왔습니다
  - 내려왔습니다
  lexicon: HALOT
  rationale: 하나님의 공간적 ‘내려감’이라는 인격적 표현을 살리되, 한국어에서는 자연스러운 합쇼체 서술인 ‘내려가서’로 이어 주어 문맥의 긴급성과 연속성을 유지했습니다.
- source_word: לְהַצִּילוֹ / to deliver him
  english_pob_choice: to deliver him
  chosen_korean: 그를 건져 내고
  alternatives_korean:
  - 그를 구해 내고
  - 그를 구원하고
  lexicon: HALOT
  rationale: 히필 נצל의 ‘위험에서 건져 냄’이라는 구체적 구출 의미를 살리기 위해 ‘건져 내다’를 택했습니다. ‘구원하다’는 여기서 다소 신학적으로 무거울 수 있어 피했습니다.
- source_word: מִיַּד מִצְרַיִם / from the hand of Egypt
  english_pob_choice: from the hand of Egypt
  chosen_korean: 이집트의 손에서
  alternatives_korean:
  - 이집트의 권세에서
  - 이집트의 손아귀에서
  lexicon: HALOT
  rationale: ‘손에서’라는 히브리어 관용구를 그대로 보존해 압제의 지배와 통제를 드러냈습니다. ‘권세’로 풀면 이미지가 약해집니다.
- source_word: וּלְהַעֲלֹתוֹ / to bring him up
  english_pob_choice: to bring him up
  chosen_korean: 그를 이끌어 올라가게 하여
  alternatives_korean:
  - 그를 올라가게 하여
  - 그를 데리고 올라가게 하여
  lexicon: HALOT
  rationale: עלה의 상향 이동 이미지를 살리면서도 한국어에서 어색하지 않도록 ‘이끌어 올라가게 하다’로 옮겼습니다. 집단적 단수 대명사 ‘그를’도 유지했습니다.
- source_word: אֶרֶץ טוֹבָה וּרְחָבָה / a good and broad land
  english_pob_choice: a good and broad land
  chosen_korean: 좋은 넓은 땅
  alternatives_korean:
  - 좋고 넓은 땅
  - 좋은 광활한 땅
  lexicon: HALOT
  rationale: טובה와 רחבה를 각각 ‘좋은’과 ‘넓은’으로 대응시켜 의미를 분리해 살렸습니다. ‘넓은’이 문맥상 ‘spacious’보다 더 직접적입니다.
- source_word: אֶל מְקוֹם ... / to the place of ...
  english_pob_choice: to the place of the Canaanite ...
  chosen_korean: 가나안 사람과 헷 사람과 아모리 사람과 브리스 사람과 히위 사람과 여부스 사람이 있는 곳으로
  alternatives_korean:
  - 가나안 사람과 ... 의 땅으로
  - 가나안 사람과 ... 의 자리로
  lexicon: HALOT
  rationale: מקום을 ‘곳’으로 옮겨 ‘place’의 직접성을 유지했습니다. 열거는 원문의 민족명 목록을 그대로 따라 집합적 지칭을 보존했습니다.
theological_decisions:
- issue: 하나님의 ‘내려감’과 ‘올려보냄’의 공간적 표현
  chosen_reading: 비유적으로 완화하지 않고 그대로 살렸습니다.
  alternative_readings:
  - ‘개입하겠다’처럼 기능적으로 풀기
  - ‘구원하기 위해’로 목적만 강조하기
  rationale: 본문은 하나님의 구원 행위를 공간적 동사로 묘사합니다. 이를 평이한 개념어로 바꾸면 히브리어의 생동감과 서술의 힘이 약해집니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 이스라엘을 가리키는 단수 대명사
  chosen_reading: ‘그를’로 유지했습니다.
  alternative_readings:
  - ‘그들을’로 현대 한국어에 맞게 복수화하기
  rationale: 히브리어의 단수 접미사는 이스라엘 전체를 한 사람처럼 가리키는 집합적 단수입니다. 본문 형식을 따라가야 그 집합적 시점이 보존됩니다.
  doctrine_reference: Translation philosophy §5
