  terminology: ‘이집트의 손’, ‘젖과 꿀이 흐르는 땅’, 그리고 민족명(가나안 사람, 헷 사람, 아모리 사람, 브리스 사람, 히위 사람, 여부스 사람)을 유지했습니다. 주석 표지는 해당 표현 바로 뒤에 재배치했고, c 주석의 잘못된 반복 표현을 실제 대안인 ‘널찍한’으로 고쳤습니다.
