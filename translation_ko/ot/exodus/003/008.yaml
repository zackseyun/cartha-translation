  source_fidelity: 히브리어의 완료형 וָאֵרֵד는 여기서 하나님의 이미 이루어진 개입을 가리키므로 ‘내려왔습니다’가 적절합니다. 두 부정사(‘건져 내고’, ‘이끌어 올려 데려가려고’)와 이스라엘을 가리키는 두 단수 목적어도 보존해야 합니다. 현 초안의 ‘이끌어 올라가게 하여’는 불필요한 사역 구문이며, 끝의 ‘데려가겠습니다’는 원문의 완료적 발화와 목적 구문을 미래 약속으로 바꿉니다.
