  source_fidelity: 수정이 필요합니다. 초안의 ‘이 모든 말씀에 따른 것입니다’는 문법상 ‘언약의 피’를 서술하는 듯하면서도, 히브리어의 관계절(야훼께서 여러분과 맺으신 언약)을 부자연스럽게 분리합니다. עַל כָּל־הַדְּבָרִים הָאֵלֶּה는 언약 체결과 ‘이 모든 말씀’의 관계를 나타내므로 ‘이 모든 말씀에 관하여’가 안전합니다. זָרַק의 구체적 투사성은 본문의 ‘뿌리고’ 및 각주로 충분히 보존될 수 있습니다.
  naturalness: 합쇼체의 ‘말했습니다’, ‘보십시오’는 현대 표준어로 자연스럽습니다. 다만 ‘이것은 … 피이며, 이 모든 말씀에 따른 것입니다’는 지시 대상과 수식 관계가 불명확하고 한국어 문장으로도 어색합니다. ‘이는 야훼께서 이 모든 말씀에 관하여 여러분과 맺으신 언약의 피입니다’가 자연스럽고 원문의 구조를 더 잘 반영합니다.
