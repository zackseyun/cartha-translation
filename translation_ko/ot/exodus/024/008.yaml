base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
  footnotes:
  - marker: a
    text: Or “sprinkled it on the people.” The Hebrew verb more literally means “threw” or “cast,” but in sacrificial contexts it can describe ritual application of blood.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “has cut with you,” an idiom meaning “has made a covenant with you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 그 피를 가져다가 백성에게 뿌리고 말했습니다. “보십시오, 이것은 야훼께서 여러분과 맺으신 언약의 피이며, 이 모든 말씀에 따른 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 “던지다/던져 놓다”에 가깝지만, 제의적 맥락에서는 피를 의식적으로 적용하는 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 “보라”입니다. 언약 선포의 엄숙한 주의를 살리기 위한 감탄사입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח מֹשֶׁה אֶת הַדָּם
  english_pob_choice: Then Moses took the blood
  chosen_korean: 모세가 그 피를 가져다가
  alternatives_korean:
  - 모세가 그 피를 취하고
  - 모세가 그 피를 들고
  lexicon: HALOT
  rationale: לקח의 기본 서술은 ‘가져가다/취하다’가 자연스럽고, 문맥상 이미 언급된 제사 피를 가리키므로 ‘그 피’로 옮겼습니다.
- source_word: וַיִּזְרֹק עַל הָעָם
  english_pob_choice: and threw it on the people
  chosen_korean: 백성에게 뿌리고
  alternatives_korean:
  - 백성 위에 던지고
  - 백성에게 뿌려
  lexicon: HALOT
  rationale: זרק는 문자적으로 ‘던지다/뿌리다’의 힘을 가지며, 제의적 적용의 뉘앙스를 살리기 위해 ‘뿌리다’를 택했습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: HALOT
  rationale: 언약 장면의 엄숙한 지시를 살리면서도 현대 한국어에서 자연스럽고 격식 있는 호격적 표현으로 옮겼습니다.
- source_word: דַם הַבְּרִית
  english_pob_choice: the blood of the covenant
  chosen_korean: 언약의 피
  alternatives_korean:
  - 언약 피
  - 계약의 피
  lexicon: HALOT
  rationale: 히브리어 관형구를 직역하여 신학적으로 중요한 ‘언약의 피’라는 표현을 보존했습니다.
- source_word: כָּרַת יְהוָה עִמָּכֶם
  english_pob_choice: that Yahweh has made with you
  chosen_korean: 야훼께서 여러분과 맺으신
  alternatives_korean:
  - 야훼께서 여러분과 세우신
  - 야훼께서 여러분과 체결하신
  lexicon: HALOT
  rationale: כרת בְּרִית의 관용구는 한국어에서 ‘언약을 맺다’가 가장 투명하며, POB의 야훼 표기를 유지했습니다.
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: concerning all these words
  chosen_korean: 이 모든 말씀에 따른 것입니다
  alternatives_korean:
  - 이 모든 말씀에 관하여
  - 이 모든 말씀을 따라
  lexicon: HALOT
  rationale: עַל은 여기서 방금 선포된 언약 조항들과의 관련을 나타내므로, 한국어에서는 ‘따르다’로 풀어 의미 관계를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 제의적 혈액 행위의 동사 선택
  chosen_reading: ‘뿌리다’로 옮겨 제사 의식에서의 피 적용과 실제적 동작을 함께 드러냈습니다.
  alternative_readings:
  - ‘던지다’
  - ‘뿌리다’ 대신 ‘뿌려 놓다’
  rationale: 히브리어 זרק는 단순 산포보다 물리적 투사성을 지니며, 언약 봉인 의식의 긴장감을 약화시키지 않기 위해 직접성을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: כרת ... בְּרִית 관용구의 보존
  chosen_reading: ‘언약을 맺다’로 자연화하되, ‘언약의 피’와 함께 언약 봉인의 제의적 맥락을 보존했습니다.
  alternative_readings:
  - ‘언약을 자르다’
  - ‘언약을 세우다’
  rationale: 한국어 본문에서는 관용적 의미를 살리면서도, 혈액과 결합된 언약 체결의 신학적 무게를 유지하는 방향이 적절합니다.
  doctrine_reference: 'Contested terms table: כָּרַת בְּרִית'
