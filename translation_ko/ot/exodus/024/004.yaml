  - 주
  rationale: 출애굽기 본문에서 언약 이름을 제목어로 바꾸지 않고, 본문이 드러내는 고유한 신적 이름을 직접 전달하기 위해 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה (YHWH) → 야훼'
