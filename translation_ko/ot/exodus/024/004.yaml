base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''under the mountain,'' that is, at its base or foot.'
    reason: lexical_alternative
  - marker: b
    text: Or 'twelve standing stones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 야훼의 모든 말씀을 기록했습니다. 그는 아침 일찍 일어나 산 기슭에[a] 제단을 쌓고, 이스라엘의 열두 지파에 따라 열두 기둥을[b] 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘산 아래’, 곧 산의 기슭 또는 밑이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘열두 개의 세운 돌’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  english_pob_choice: wrote down
  chosen_korean: 기록했습니다
  alternatives_korean:
  - 적었습니다
  - 써 두었습니다
  lexicon: HALOT
  rationale: כתב은 단순한 ‘쓰다’보다 문서로 남기다의 의미가 살아 있어, 문맥에 맞게 ‘기록했습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와나 주로 대체하지 않고, 신명기적·출애굽기적 언약 이름을 드러내는 ‘야훼’를 유지했습니다.
- source_word: תַּחַת הָהָר
  english_pob_choice: at the foot of the mountain
  chosen_korean: 산 아래
  alternatives_korean:
  - 산 밑
  - 산 아래쪽
  - 산 기슭
  lexicon: HALOT
  rationale: 직역하면 ‘산 밑에/산 아래에’이지만, 한국어에서는 위치를 자연스럽게 보여 주는 ‘산 아래’가 본문의 지시점을 잘 전달합니다.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  english_pob_choice: twelve pillars
  chosen_korean: 열두 기둥
  alternatives_korean:
  - 열두 세운 돌
  - 열두 세움돌
  - 열두 서 있는 돌
  lexicon: HALOT
  rationale: מַצֵּבָה는 문맥상 세워 둔 돌기둥/기념 기둥을 가리키므로, POB의 ‘pillars’를 따라 ‘기둥’으로 옮겼습니다.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  english_pob_choice: for the twelve tribes of Israel
  chosen_korean: 이스라엘의 열두 지파를 위하여
  alternatives_korean:
  - 이스라엘의 열두 지파를 위해
  - 이스라엘의 열두 지파를 나타내어
  lexicon: HALOT
  rationale: ל는 여기서 대응·대표를 나타내므로, 단순한 목적보다 대응성을 살린 ‘위하여’가 자연스럽고 문맥에도 맞습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
