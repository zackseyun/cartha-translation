base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
  footnotes:
  - marker: a
    text: Or 'into the cloud' or 'into the midst of the cloud.' The Hebrew emphasizes that Moses entered the cloud itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 구름 한가운데로 들어가 산으로 올라갔습니다[a]. 모세는 사십 일과 사십 밤 동안 산에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구름 속으로’. 히브리어는 모세가 구름 자체 안으로 들어갔음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא / entered into the midst of
  english_pob_choice: entered into the midst of
  chosen_korean: 구름 한가운데로 들어가
  alternatives_korean:
  - 구름 속으로 들어가
  - 구름 가운데로 들어가
  lexicon: HALOT
  rationale: בוא의 이동성과 בְּתוֹךְ의 ‘가운데/내부’ 의미를 함께 살려, 모세가 단순히 구름 근처가 아니라 그 안으로 들어갔다는 점을 드러냈습니다.
- source_word: וַיַּעַל אֶל הָהָר / went up the mountain
  english_pob_choice: went up the mountain
  chosen_korean: 산으로 올라갔습니다
  alternatives_korean:
  - 산에 올라갔습니다
  - 산 위로 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 상승 동작을 자연스러운 한국어로 옮기되, 곧바로 뒤따르는 ‘산에서’와도 어울리도록 간결하게 표현했습니다.
- source_word: בָּהָר / on the mountain
  english_pob_choice: on the mountain
  chosen_korean: 산에서
  alternatives_korean:
  - 산 위에서
  - 산 위에
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 위치 용법으로 이해하여 한국어에서는 ‘산에서’가 가장 자연스럽고 무리 없는 표현입니다.
- source_word: אַרְבָּעִים י֔וֹם וְאַרְבָּעִ֖ים לָיְלָה / forty days and forty nights
  english_pob_choice: forty days and forty nights
  chosen_korean: 사십 일 사십 밤
  alternatives_korean:
  - 마흔 날 밤
  - 사십 주야
  lexicon: HALOT
  rationale: 히브리어의 반복적 기간 표현을 그대로 살리되, 성경적 문체를 해치지 않도록 ‘사십 일 사십 밤’으로 옮겼습니다.
theological_decisions:
- issue: 구름을 하나님의 임재의 상징으로 너무 풀어쓰지 않을지
  chosen_reading: 구름 한가운데
  alternative_readings:
  - 그 구름 속
  - 짙은 구름 가운데
  rationale: 원문은 단순한 עָנָן을 사용하므로, 해석을 덧붙이지 않고 구름 자체 안으로 들어갔다는 점만 분명히 했습니다.
  doctrine_reference: 원문 우선 원칙, 신현(神顯) 이미지의 보존
