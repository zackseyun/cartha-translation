  text: וַ/יִּקַּח֙ סֵ֣פֶר הַ/בְּרִ֔ית וַ/יִּקְרָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֥ה וְ/נִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
  footnotes:
  - marker: a
    text: Or, 'and we will obey.' The Hebrew verb can mean 'hear/listen' and, in covenant contexts, 'obey.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 언약의 책을 가져다가 백성이 듣는 데서 읽어 주었고, 그들이 말했습니다. “야훼께서 말씀하신 모든 것을 우리가 행하겠습니다. 그리고 듣겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘순종하겠습니다.’ 히브리어 동사는 ‘듣다’ 또는 ‘귀 기울이다’를 뜻하며, 언약 문맥에서는 ‘순종하다’를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֵפֶר הַבְּרִית
  english_pob_choice: the Book of the Covenant
  chosen_korean: 언약 책
  alternatives_korean:
  - 언약서
  - 언약 문서
  - 언약의 책
  lexicon: HALOT
  rationale: סֵפֶר은 문맥상 기록된 언약 문서를 가리키므로, 현대 한국어에서는 ‘책’보다 뜻이 더 분명한 ‘문서/서’가 가능하지만, 본문 전승의 구체적 문서성을 살리되 지나치게 현대화하지 않기 위해 ‘언약 책’으로 옮겼습니다.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  english_pob_choice: read it in the hearing of the people
  chosen_korean: 백성의 귀에 읽어 주었고
  alternatives_korean:
  - 백성의 들을 때 읽었고
  - 백성에게 읽어 주었고
  - 백성 앞에서 읽었고
  lexicon: HALOT
  rationale: ‘귀에’는 히브리어 관용구를 살리면서 공적 낭독의 뉘앙스를 유지합니다. ‘읽어 주다’는 단순히 읽었다는 정보보다 공개 낭독의 행위를 자연스럽게 드러냅니다.
- source_word: דִּבֶּר / נַעֲשֶׂה וְנִשְׁמָע
  english_pob_choice: All that Yahweh has spoken we will do, and we will obey.
  chosen_korean: 야훼께서 말씀하신 것은 모두 우리가 행하겠습니다. 그리고 우리는 듣겠습니다.
  alternatives_korean:
  - 야훼께서 말씀하신 것은 모두 우리가 하겠습니다. 그리고 우리는 순종하겠습니다.
  - 야훼께서 말씀하신 것은 모두 우리가 행하겠습니다. 그리고 우리는 순종하겠습니다.
  - 야훼께서 말씀하신 것은 모두 우리가 행하고, 또한 우리는 듣겠습니다.
  lexicon: HALOT
  rationale: נַעֲשֶׂה는 기본적으로 ‘하다/행하다’이므로 ‘행하겠습니다’가 가장 직접적입니다. וְנִשְׁמָע는 ‘듣다’와 ‘순종하다’의 긴장을 지니므로, 본문에는 듣기로 두고 의미의 순종성은 주석에서 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 인명적 신명은 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨, 제목 대체가 아니라 고유한 신적 이름을 드러냈습니다.
theological_decisions:
- issue: וְנִשְׁמָע의 의미 긴장
  chosen_reading: 본문은 ‘듣겠습니다’로 두어, 청취와 순종의 이중 의미를 열어 둡니다.
  alternative_readings:
  - ‘순종하겠습니다’로 명시
  - ‘들어 따르겠습니다’로 확장
  rationale: 언약 문서의 공개 낭독 직후에 나오는 응답이므로 ‘듣다’의 청각적 의미가 자연스럽지만, 언약적 맥락에서는 순종의 뜻도 분명합니다. 본문에서 한쪽으로만 고정하지 않고 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
