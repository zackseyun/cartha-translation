revisions:
- from: 그는 언약 책을 가져다가 백성의 귀에 읽어 주었고, 그들이 말했습니다. “야훼께서 말씀하신 것은 모두 우리가 행하겠습니다. 그리고 우리는 듣겠습니다.”[a]
  to: 그는 언약의 책을 가져다가 백성이 듣는 데서 읽어 주었고, 그들이 말했습니다. “야훼께서 말씀하신 모든 것을 우리가 행하겠습니다. 그리고 듣겠습니다.”[a]
  rationale: 공개 낭독을 나타내는 히브리어 관용구를 자연스러운 현대 한국어로 고쳤고, ‘언약의 책’ 및 ‘말씀하신 모든 것을’으로 문장 결합을 다듬었습니다. 본문은 וְנִשְׁמָע의 청각적 의미를 ‘듣겠습니다’로 보존하고, 언약적 순종의 의미는 각주에 남겨 원문의 의도적 의미 폭을 유지했습니다.
