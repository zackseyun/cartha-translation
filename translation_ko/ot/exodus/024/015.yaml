  text: וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הָ/הָ֑ר וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
  footnotes:
  - marker: a
    text: Or 'And Moses went up to the mountain.' The Hebrew narrative conjunction can be rendered simply 'and,' and the preposition may be taken as 'to' or, in context with 'went up,' 'onto.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모세가 산으로 올라갔습니다. 구름이 그 산을 덮었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 וַ־는 서사를 이어 주는 접속으로, 한국어에서는 앞뒤 문맥에 따라 ‘그러자’나 ‘그리고’로 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 올라갔습니다
  - 올라갔습니다(산에)
  - 올라갔습니다
  lexicon: HALOT עלה
  rationale: עלה의 기본 뜻은 ‘올라가다’이므로, 자연스러운 현대 한국어로 방향성과 이동 완료를 살려 ‘올라갔습니다’로 옮겼습니다.
- source_word: אֶל הָהָר
  english_pob_choice: onto the mountain
  chosen_korean: 산으로
  alternatives_korean:
  - 산에
  - 산 위로
  - 산으로 올라
  lexicon: HALOT אֶל + הַר
  rationale: 영어 POB의 ‘onto’처럼 산 쪽/산 위를 향한 움직임을 드러내되, 한국어에서는 ‘산으로 올라갔습니다’가 가장 자연스럽고 문맥상 충분히 입체적입니다.
- source_word: הֶעָנָן
  english_pob_choice: the cloud
  chosen_korean: 구름
  alternatives_korean:
  - 그 구름
  - 구름
  - 구름덩이
  lexicon: HALOT ענן
  rationale: 정관사에 해당하는 맥락상 특정된 구름이지만, 한국어에서는 반복을 피하고 서술을 간결하게 하기 위해 단순히 ‘구름’으로 옮겼습니다.
- source_word: וַיְכַס
  english_pob_choice: covered
  chosen_korean: 덮었습니다
  alternatives_korean:
  - 가렸습니다
  - 뒤덮었습니다
  - 감췄습니다
  lexicon: HALOT כסה
  rationale: כסה의 직접적 대응인 ‘덮다’를 택해 본문의 이미지를 그대로 살렸고, ‘뒤덮었습니다’보다 과장되지 않게 유지했습니다.
theological_decisions:
- issue: 구름의 성격을 본문 수준에서 유지할 것인지
  chosen_reading: 본문이 말하는 그대로 ‘구름’으로만 옮기고, 하나님의 영광이나 여호와의 구름이라고 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - 영광의 구름이 산을 덮었습니다
  - 여호와의 구름이 산을 덮었습니다
  rationale: 히브리어 본문은 단지 ‘구름’이라고만 말하므로, 문맥적 연관이 있더라도 본문이 직접 말하지 않는 신학적 해석을 본문에 주입하지 않았습니다.
  doctrine_reference: 'Translation philosophy: 본문이 말하는 범위를 넘어서 교리적 내용을 앞세워 해석하지 말 것.'
