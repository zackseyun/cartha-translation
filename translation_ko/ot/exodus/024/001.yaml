source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Come up to the LORD.'' The text preserves this wording even though the speaker is the LORD; some translations smooth it to ''Come up to me'' or ''before the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그가 모세에게 말씀하셨습니다. “너와 아론, 나답과 아비후, 그리고 이스라엘 장로 칠십 명은 야훼에게 올라오고, 멀리서 경배하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘야훼에게 올라오라’고 합니다. 발화자가 야훼라는 점 때문에 일부 번역은 ‘내게 올라오라’ 또는 ‘야훼 앞에’로 완화합니다.
    reason: theological_note
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  english_pob_choice: Then he said to Moses
  chosen_korean: 그가 모세에게 말씀하셨습니다
  alternatives_korean:
  - 그가 모세에게 말했습니다
  - 그리고 모세에게 말씀하셨습니다
  lexicon: HALOT
  rationale: 서술 흐름은 유지하되 한국어에서는 자연스럽게 주어를 보충했고, 신적 발화이므로 평서형 ‘말했습니다’보다 ‘말씀하셨습니다’가 적절합니다.
- source_word: עֲלֵה
  english_pob_choice: Come up
  chosen_korean: 올라오고
  alternatives_korean:
  - 올라가고
  - 올라오십시오
  lexicon: HALOT
  rationale: עלה의 상승 명령을 살리되, 직접 화법 안에서 이어지는 동사들과의 병렬을 위해 동작 명령형으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD / Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 직접 반영하여 프로젝트 기본어인 ‘야훼’를 사용했습니다.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  english_pob_choice: and seventy of the elders of Israel
  chosen_korean: 이스라엘 장로 칠십 명
  alternatives_korean:
  - 이스라엘의 장로들 칠십 명
  - 이스라엘 장로 가운데 칠십 명
  lexicon: HALOT
  rationale: מִן의 부분적 의미는 한국어 어순에서 ‘칠십 명’으로 앞에 두고 ‘장로’는 소속 수식으로 처리하면 가장 자연스럽고, 선택된 인원이라는 뜻도 보존됩니다.
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  english_pob_choice: and bow down
  chosen_korean: 경배하십시오
  alternatives_korean:
  - 엎드려 절하십시오
  - 절하십시오
  lexicon: HALOT
  rationale: 히브리어는 몸을 낮추는 행위를 뜻하지만, 여기서는 야훼 앞에서의 예배적 태도가 분명하므로 ‘경배하십시오’로 옮기되 물리적 낮아짐의 함의는 다음 동사들과 문맥이 보완합니다.
- source_word: מֵ/רָחֹק
  english_pob_choice: from a distance
  chosen_korean: 멀리서
  alternatives_korean:
  - 멀리 떨어져서
  - 먼 거리에서
  lexicon: HALOT
  rationale: 접근 제한의 공간적 거리를 간결하게 살리는 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 모세에게 ‘야훼에게 올라오라’고 하시는 역설적 표현
  chosen_reading: 본문의 어색함을 풀지 않고 ‘야훼에게 올라오고’로 유지했습니다
  alternative_readings:
  - ‘나에게 올라오고’로 완화
  - ‘야훼 앞에 올라오고’로 조정
  rationale: 히브리어는 실제로 ‘야훼에게’라고 말하므로, 발화자와 지시 대상의 긴장을 매끈하게 해소하지 않고 그대로 드러내는 것이 원문 충실성에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
