id: EXO.24.16
reference: Exodus 24:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
  footnotes:
  - marker: a
    text: Or, 'the cloud covered the glory' if the suffix is taken to refer to 'the glory of the LORD' rather than to Mount Sinai.
    reason: alternative_reading
  - marker: b
    text: Or, 'from within the cloud.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 영광이 시내 산 위에 머물렀고, 구름이 엿새 동안 그것을 덮었습니다[a]. 일곱째 날에 그는 구름 한가운데서 모세를 부르셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 접미사가 ‘산’이 아니라 ‘야훼의 영광’을 가리킨다고 보면 ‘구름이 야훼의 영광을 덮었습니다’라고도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘구름 속에서.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 영광스러운 임재
  - 야훼의 영화
  lexicon: HALOT
  rationale: כבוד는 여기서 하나님의 현현하는 영광을 가리키므로, POB의 ‘Yahweh’를 따라 고유명사를 보존하고 ‘영광’으로 옮겼습니다.
- source_word: וַיִּשְׁכֹּן
  english_pob_choice: settled
  chosen_korean: 머물렀고
  alternatives_korean:
  - 거하였고
  - 정착하였고
  - 내려앉았고
  lexicon: HALOT
  rationale: 신현 장면에서 שכן의 ‘자리를 잡고 머무는’ 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 과도하게 종교화되지 않은 ‘머물렀고’를 택했습니다.
- source_word: וַיְכַסֵּהוּ
  english_pob_choice: covered it
  chosen_korean: 그것을 덮었습니다
  alternatives_korean:
  - 그를 덮었습니다
  - 산을 덮었습니다
  lexicon: HALOT
  rationale: 히브리어 목적어 대명사는 문맥상 산을 가리키는 것이 가장 자연스러우므로, POB의 해석을 따라 중립적인 ‘그것’을 사용했습니다.
- source_word: מִתּוֹךְ הֶעָנָן
  english_pob_choice: from the midst of the cloud
  chosen_korean: 구름 한가운데서
  alternatives_korean:
  - 구름 속에서
  - 구름 가운데서
  lexicon: HALOT
  rationale: מתוך의 내부적 위치를 살리면서도 한국어로는 ‘한가운데서’가 가장 생생하고 읽기 쉽습니다.
theological_decisions:
- issue: ‘he called’의 주체
  chosen_reading: 주체를 따로 반복하지 않고 ‘그는 부르셨습니다’로 처리해, 문맥상 야훼가 모세를 부르시는 흐름을 유지했습니다.
  alternative_readings:
  - 야훼께서 모세를 부르셨습니다
  - 영광이 모세를 불렀습니다
  rationale: 히브리어 서술 흐름과 POB의 주석 판단을 따라, 신현의 주체를 과잉 해설하지 않으면서도 야훼를 암시하도록 했습니다.
  doctrine_reference: Original-language primacy; preserve narrative referent without flattening the theophany.
- issue: ‘the cloud covered it’의 지시 대상
  chosen_reading: 문맥상 산을 가리키는 것으로 이해해 ‘그것을’로 옮겼습니다.
  alternative_readings:
  - 영광을 덮었습니다
  - 그를 덮었습니다
  rationale: POB의 본문 선택을 따라 산이 가장 가까운 선행사라는 해석을 반영하되, 히브리어의 약간의 지시 불확실성은 설명문이 아닌 각주로만 표시했습니다.
  doctrine_reference: Preserve genuine ambiguity where the source permits it; do not over-resolve.
