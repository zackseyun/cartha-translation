  naturalness: ‘사파이어 돌로 만든 포장’은 다소 중복되고, 문장 연결도 현대 표준어 문체로 매끄럽지 않습니다. ‘사파이어로 된 포장 같은 것’과 이를 받는 지시어를 사용하면 원문의 시각적 묘사와 비교 관계가 더 자연스럽고 분명해집니다.
