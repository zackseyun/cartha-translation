  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
  footnotes:
  - marker: a
    text: Or possibly 'lapis lazuli'; the precise identification of סַפִּיר in the ancient world is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like the workmanship of a pavement of sapphire,' an image of a crafted, brick- or tile-like surface beneath his feet.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이스라엘의 하나님을 보았습니다. 그의 발 아래에는 사파이어[a]로 된 포장 같은 것이 있었고[b], 그것은 맑은 하늘 그 자체처럼 맑았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘청금석’일 수 있습니다. 고대 세계에서 סַפִּיר의 정확한 광물 식별은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘사파이어 벽돌의 작업 같은’이라는 표현입니다. 이는 그의 발 아래에 있는, 공들여 만든 벽돌·타일 같은 표면의 이미지를 가리킵니다.
    reason: lexical_alternative
