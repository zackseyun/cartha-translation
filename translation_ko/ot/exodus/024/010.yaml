theological_decisions:
- issue: 하나님을 ‘보았다’는 진술과 신체적 묘사
  chosen_reading: ‘이스라엘의 하나님을 보았습니다’와 ‘그의 발 아래’라는 표현을 그대로 살려, 현현을 설명으로 완화하지 않았습니다.
  alternative_readings:
  - 하나님의 나타나심을 보았습니다
  - 그가 계신 자리 아래에는
  rationale: 히브리어 본문이 직접적인 시각 진술과 신체적 비유를 함께 말하므로, 해석으로 긴장을 풀기보다 원문의 긴장을 유지했습니다.
  doctrine_reference: '번역 원칙: 신학적 긴장을 보존하고 본문이 말하는 강도를 약화시키지 않음'
