id: EXO.24.10
reference: Exodus 24:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּרְא֕וּ אֵ֖ת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/תַ֣חַת רַגְלָ֗י/ו כְּ/מַעֲשֵׂה֙ לִבְנַ֣ת הַ/סַּפִּ֔יר וּ/כְ/עֶ֥צֶם הַ/שָּׁמַ֖יִם לָ/טֹֽהַר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
  footnotes:
  - marker: a
    text: Or possibly 'lapis lazuli'; the precise identification of סַפִּיר in the ancient world is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like the workmanship of a pavement of sapphire,' an image of a crafted, brick- or tile-like surface beneath his feet.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이스라엘의 하나님을 보았습니다[a]. 그의 발 아래에는 마치 사파이어 돌로 만든 포장 같고[b], 맑기가 하늘과 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘청금석’일 수 있습니다. 고대 세계에서 סַפִּיר의 정확한 광물 식별은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사파이어로 만든 포장의 작업과 같은’이라는 이미지로, 발 아래의 공들여 만든 벽돌·타일 같은 표면을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  english_pob_choice: they saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 바라보았습니다
  - 목격했습니다
  lexicon: WLC
  rationale: ראה의 기본 의미인 시각적 인지를 가장 직접적으로 살려, 서술문의 단정성을 유지했습니다.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 신
  - 이스라엘 하나님
  lexicon: WLC
  rationale: 소유격 구조를 자연스러운 한국어로 옮기면서, ישראל의 하나님이라는 특정 대상을 분명히 했습니다.
- source_word: כְּמַעֲשֵׂה לִבְנַת הַסַּפִּיר
  english_pob_choice: something like a pavement of sapphire stone
  chosen_korean: 마치 사파이어 돌로 만든 포장 같고
  alternatives_korean:
  - 사파이어 돌의 포장 같고
  - 사파이어 타일로 된 포장 같고
  lexicon: WLC
  rationale: מַעֲשֶׂה의 ‘만들어진 것’이라는 감각과 לִבְנָה의 포장/벽돌 같은 표면 이미지를 함께 살려, 아래에 깔린 인공적 표면의 시각성을 전달했습니다.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם לָטֹהַר
  english_pob_choice: like the very heavens in clearness
  chosen_korean: 맑기가 하늘과 같았습니다
  alternatives_korean:
  - 하늘처럼 맑았습니다
  - 그 하늘의 맑음과 같았습니다
  lexicon: WLC
  rationale: עֶצֶם의 강조 기능을 한국어 비교 표현으로 풀어, 단순한 ‘하늘 같다’가 아니라 맑음의 정도가 하늘과 같다는 점을 드러냈습니다.
theological_decisions:
- issue: 하나님을 ‘보았다’는 진술과 신체적 묘사
  chosen_reading: ‘이스라엘의 하나님을 보았습니다’와 ‘그의 발 아래’라는 표현을 그대로 살려, 현현을 설명으로 완화하지 않았습니다.
  alternative_readings:
  - 하나님의 나타나심을 보았습니다
  - 그가 계신 자리 아래에는
  rationale: 히브리어 본문이 직접적인 시각 진술과 신체적 비유를 함께 말하므로, 해석으로 긴장을 풀기보다 원문의 긴장을 유지했습니다.
  doctrine_reference: '번역 원칙: 신학적 긴장을 보존하고 본문이 말하는 강도를 약화시키지 않음'
