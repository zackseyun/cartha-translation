  terminology: ‘하나님’, ‘보았고’, 그리고 합쇼체 종결은 적절합니다. 각주의 ‘뵙는’은 원문에 없는 높임법을 도입하므로 피하는 편이 좋습니다. חזה의 강화된 ‘바라보다/응시하다’ 가능성은 중립적으로 제시할 수 있습니다.
