base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
  footnotes:
  - marker: a
    text: Or 'they beheld God'—the verb can carry the sense of gazing upon or beholding.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그분은 이스라엘 자손의 귀인들에게 손을 내밀지 않으셨습니다. 그들은 하나님을 보았고[a], 먹고 마셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 하나님을 바라보았다’로 옮길 수 있습니다. 이 동사는 응시하거나 뵙는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲצִילֵי בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the nobles of the sons of Israel
  chosen_korean: 이스라엘 자손의 귀인들
  alternatives_korean:
  - 이스라엘 자손의 지도자들
  - 이스라엘의 귀족들
  lexicon: HALOT
  rationale: אֲצִילֵי는 신분이 높은 대표자들을 가리키므로, 문맥에 맞는 간결한 한국어로 ‘귀인들’이 적절합니다. ‘자손’은 בְּנֵי יִשְׂרָאֵל의 가족적 표현을 살렸습니다.
- source_word: שָׁלַח יָד
  english_pob_choice: did not stretch out his hand
  chosen_korean: 손을 내밀지 않으셨습니다
  alternatives_korean:
  - 손을 뻗지 않으셨습니다
  - 손을 내리지 않으셨습니다
  lexicon: HALOT
  rationale: ‘손을 내밀다’는 히브리어 관용구를 자연스럽게 살리면서도, 여기서는 해치거나 치지 않으셨다는 함의를 문맥상 드러냅니다.
- source_word: וַיֶּחֱזוּ
  english_pob_choice: they saw
  chosen_korean: 보았고
  alternatives_korean:
  - 바라보았고
  - 응시하였고
  lexicon: HALOT
  rationale: 동사는 단순한 시각 행위보다 ‘응시하다/보다’의 뉘앙스를 가질 수 있지만, 본문은 직접적 진술이므로 본문에는 ‘보았고’로 두고 각주로 여지를 남겼습니다.
- source_word: אֶת הָאֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님을
  alternatives_korean:
  - 그 하나님을
  - 신을
  lexicon: HALOT
  rationale: 정관사 있는 הָאֱלֹהִים은 이스라엘의 하나님을 가리키므로 한국어 관용에 맞게 ‘하나님’을 사용했습니다.
theological_decisions:
- issue: 하나님을 본다는 진술의 직설성
  chosen_reading: 본문의 직설을 유지하여 ‘하나님을 보았고’로 옮겼습니다.
  alternative_readings:
  - ‘하나님의 나타나심을 보았고’로 완화
  - ‘하나님을 뵈었고’로 경어화
  rationale: 본문은 신현 체험을 직접 말하므로, 다른 본문과의 긴장을 미리 해소하지 않고 원문이 말하는 바를 그대로 드러내는 편이 더 충실합니다.
  doctrine_reference: 본문의 신학적 긴장을 보존합니다.
