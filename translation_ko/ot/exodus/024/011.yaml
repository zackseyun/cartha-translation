  source_fidelity: 히브리어는 하나님께서 이스라엘 자손의 유력한 대표자들에게 해를 가하는 손을 뻗지 않으셨으며, 그들이 하나님을 보고 먹고 마셨다고 직접 진술합니다. 초안의 ‘손을 내밀지’는 한국어에서 도움이나 환영을 위해 손을 내미는 뜻으로 더 흔히 이해되어, 원문의 위해적 관용구를 충분히 전달하지 못합니다.
