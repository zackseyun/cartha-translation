  text: 그러나 그분은 이스라엘 자손 가운데 유력한 사람들에게 손을 대지 않으셨습니다. 그들은 하나님을 보았고[a], 먹고 마셨습니다.
  philosophy: optimal-equivalence
  footnotes:
