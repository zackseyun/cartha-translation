  - marker: b
    text: 또는 ‘이스라엘의 자녀들’이나 ‘이스라엘 사람들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה כְּבוֹד
  english_pob_choice: the appearance of the glory
  chosen_korean: 영광의 모습
  alternatives_korean:
  - 영광의 나타남
  - 영광의 현현
  - 영광의 광경
  lexicon: HALOT
  rationale: מַרְאֵה는 눈에 보이는 ‘모습/광경’을 가리키므로, 단순한 추상명사 ‘영광’보다 ‘영광의 모습’이 시각적 초점을 더 직접적으로 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 이 프로젝트의 기본값은 야훼이지만, 현재 한국어 기독교 출판 관행과 본문 가독성을 고려해 문맥상 동일 지시를 위해 통용형 ‘여호와’를 사용했습니다.
- source_word: כְּאֵשׁ אֹכֶלֶת
  english_pob_choice: like a consuming fire
  chosen_korean: 사르는 불
  alternatives_korean:
  - 삼키는 불
  - 소멸시키는 불
  - 먹어 치우는 불
  lexicon: HALOT
  rationale: אֹכֶלֶת는 문자적으로 ‘먹는’ 것이지만 불의 관용적 의미는 파괴적으로 태우는 불입니다. ‘사르는 불’은 과도하게 해설하지 않으면서도 강한 소진·파괴성을 자연스럽게 드러냅니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구성은 관용적으로 ‘이스라엘 자손’으로 옮기면 원문의 결을 가장 투명하게 반영할 수 있습니다.
theological_decisions:
- issue: 신적 임재의 가시성
  chosen_reading: ‘영광의 모습’과 ‘보였습니다’로, 여호와의 영광이 실제로 눈에 보이는 현상으로 드러났음을 유지했습니다.
  alternative_readings:
  - ‘영광’만 두고 시각성을 약화하는 번역
  - ‘환상’으로 옮겨 체험 내부로 한정하는 번역
  rationale: 본문은 단순한 내적 체험이 아니라 산 꼭대기에서 공동체가 목격한 가시적 현현을 말하므로, 시각적 언어를 보존하는 것이 문맥에 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
