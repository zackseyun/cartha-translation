revisions:
- from: 여호와의 영광의 모습은 산 꼭대기에서 사르는 불과 같았고, 그것은 이스라엘 자손의 눈에 보였습니다.[a][b]
  to: 이스라엘 자손의 눈에 야훼의 영광의 모습은 산 꼭대기에 있는 사르는 불과 같았습니다.[a][b]
  rationale: 문장의 중심을 원문과 같이 ‘영광의 모습’과 ‘사르는 불’의 비교로 회복하고, ‘이스라엘 자손의 눈에’를 그 비교의 관점으로 연결했습니다. 또한 신명을 영어 POB의 Yahweh 및 프로젝트 표기 원칙에 따라 ‘야훼’로 통일했습니다. 각주 대안과 표지는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:35Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 ‘여호와의 영광의 모습’이 ‘산 꼭대기의 사르는 불과 같았다’고 말하며, לְעֵינֵי는 그 광경이 이스라엘 자손의 눈앞에 있었다는 범위를 나타냅니다. 초안의 ‘그것은 … 보였습니다’는 비교 서술을 별도의 ‘보임’ 사건으로 바꾸므로 원문의 구문을 충분히 반영하지 못합니다.
  naturalness: ‘이스라엘 자손의 눈에 … 같았습니다’는 현대 표준어 합쇼체에서 자연스럽고, 원문의 시각적 관점을 유지합니다. ‘산 꼭대기에서 사르는 불’보다 ‘산 꼭대기에 있는 사르는 불’이 불의 위치를 더 분명히 합니다.
  terminology: 프로젝트의 신명 표기 원칙 및 영어 POB의 ‘Yahweh’에 맞추어 יְהוָה는 ‘야훼’로 옮겨야 합니다. ‘영광’, ‘이스라엘 자손’, ‘사르는 불’은 각각 כָּבוֹד, בְּנֵי יִשְׂרָאֵל, אֹכֶלֶת의 의미와 문체에 적절합니다.
  issues:
  - severity: medium
    issue: 비교 구문이 별도의 ‘보임’ 서술로 변경됨
    rationale: 원문은 ‘영광의 모습은 … 불과 같았다’라는 명사절입니다. ‘그것은 … 보였습니다’는 לְעֵינֵי의 관점을 독립 동사로 바꾸고, 원문의 핵심 비교를 약화합니다.
  - severity: medium
