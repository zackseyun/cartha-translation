translation:
  language: ko
  text: 이스라엘 자손의 눈에 야훼의 영광의 모습은 산 꼭대기에 있는 사르는 불과 같았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘삼키는 불’.
