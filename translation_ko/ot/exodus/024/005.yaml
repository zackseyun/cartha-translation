  source_fidelity: 히브리어는 모세가 젊은이들을 보낸 뒤, 그 젊은이들이 번제를 올리고 황소로 여호와께 화목제를 희생 제물로 드린 두 행동을 서술합니다. 초안의 ‘드리게 하고 … 잡게 했습니다’는 이 행동들을 모세의 사역·사동으로 표현하여 원문의 단순 연속 서술보다 한 단계 강한 인과를 만듭니다. 또한 ‘소를 잡게 했습니다’는 화목제를 드리는 행위와의 연결도 다소 불분명합니다.
  naturalness: 두 절을 병렬 과거 서술로 옮기면 현대 표준 한국어 합쇼체로 자연스럽고, 누가 제의를 수행했는지도 분명해집니다. ‘황소를 잡아 화목제를 … 드렸습니다’는 זבח의 희생 도살 의미와 한국어 제의 표현을 함께 살립니다.
  terminology: ‘번제’, ‘화목제’, ‘여호와’는 한국어 성경 독자에게 널리 통용되는 적절한 제의·신명 용어입니다. שְׁלָמִים의 다른 가능한 번역은 화목제에 직접 붙는 각주로 제시해야 합니다.
