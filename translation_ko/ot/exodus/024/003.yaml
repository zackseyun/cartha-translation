  rationale: 본문이 신명기적 언약 이름 יְהוָה를 직접 사용하므로, 전통적 대체칭호보다 고유명사를 드러내는 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
