  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
  footnotes:
  - marker: a
    text: Or “ordinances” for “judgments” (Hebrew mishpatim), referring to covenantal legal rulings.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 와서 야훼의 모든 말씀과 모든 규례를 백성에게 전하니, 온 백성이 한 목소리로 대답하여 말했습니다. “야훼께서 말씀하신 모든 말씀을 우리가 행하겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “판결”로도 옮길 수 있으며, 히브리어 mishpatim은 언약적 법적 판정을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא מֹשֶׁה
  english_pob_choice: Then Moses came
  chosen_korean: 모세가 와서
  alternatives_korean:
  - 그때 모세가 왔습니다
  - 모세가 들어와서
  lexicon: HALOT
  rationale: בוא는 여기서 단순히 ‘오다/오르다’의 서술 진행을 나타내므로, 자연스러운 한국어 서술인 ‘와서’로 옮겼습니다.
- source_word: וַיְסַפֵּר לָעָם
  english_pob_choice: told the people
  chosen_korean: 백성에게 전하니
  alternatives_korean:
  - 백성에게 말하니
  - 백성에게 이야기하니
  lexicon: HALOT
  rationale: ספר의 핵심은 내용을 ‘전하다/이야기하다’의 전달 행위이므로, 언약 내용 전달의 무게를 살려 ‘전하니’로 옮겼습니다.
- source_word: כָּל דִּבְרֵי יְהוָה וְאֵת כָּל הַמִּשְׁפָּטִים
  english_pob_choice: all the words of Yahweh and all the ordinances
  chosen_korean: 야훼의 모든 말씀과 모든 규례
  alternatives_korean:
  - 야훼의 모든 말씀과 모든 판결
  - 야훼의 모든 말씀과 모든 법도
  lexicon: HALOT
  rationale: דְּבָרִים은 ‘말씀들’로, מִשְׁפָּטִים은 언약 공동체의 법적 규정이라는 점을 살려 문맥상 가장 자연스러운 ‘규례’로 옮겼습니다.
- source_word: קוֹל אֶחָד
  english_pob_choice: with one voice
  chosen_korean: 한 목소리로
  alternatives_korean:
  - 같은 목소리로
  - 하나의 목소리로
  lexicon: HALOT
  rationale: 관용구적으로 단일한 동의와 합의를 나타내므로, 한국어에서도 그대로 통하는 ‘한 목소리로’가 적절합니다.
- source_word: נַעֲשֶׂה
  english_pob_choice: we will do
  chosen_korean: 우리가 행하겠습니다
  alternatives_korean:
  - 우리가 하겠습니다
  - 우리가 순종하겠습니다
  lexicon: HALOT
  rationale: עָשָׂה는 문자적으로 ‘하다/행하다’이므로, 언약 응답의 실행성을 살리면서도 과도한 해석을 피하는 ‘행하겠습니다’를 선택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 언약 이름 יְהוָה를 직접 사용하므로, 전통적 대체칭호보다 고유명사를 드러내는 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
