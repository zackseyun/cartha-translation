    rationale: 히브리어는 ‘그들을 가르치기 위하여’라는 목적을 나타냅니다. ‘지도’는 한국어에서 의미가 넓고 지도(map)로도 읽힐 수 있으므로, ‘그들을 가르치기 위해’가 더 정확하고 자연스럽습니다.
