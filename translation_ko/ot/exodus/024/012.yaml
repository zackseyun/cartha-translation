id: EXO.24.12
reference: Exodus 24:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
  footnotes:
  - marker: a
    text: Or 'the instruction and the commandment.' The Hebrew word torah often means 'instruction' or 'teaching,' not only legal statute.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the law and the commandment' may be understood either as additional covenant instruction alongside the stone tablets or as further describing what is written on them.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “산으로 내게 올라오십시오. 그리고 거기 머무르십시오. 내가 너에게 내가 그들을 가르치기 위해 기록한 돌판들과 율법[a]과 명령을 주겠습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지시’ 또는 ‘가르침’. 히브리어 토라(torah)는 법규만이 아니라 ‘지시’ 또는 ‘가르침’을 뜻하는 경우가 많습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법과 명령’은 돌판들에 기록된 내용일 수도 있고, 돌판들과 함께 주어질 추가 언약 지침일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 고유한 신명(神名)을 제목어로 바꾸지 않고 학술적 음역으로 보존하기 위해 야훼를 사용했습니다.
- source_word: עֲלֵה אֵלַי הָהָרָה
  english_pob_choice: Come up to me on the mountain
  chosen_korean: 산으로 내게 올라오고
  alternatives_korean:
  - 산에 내게 올라오고
  - 내게 산으로 올라오고
  lexicon: HALOT
  rationale: עלה의 방향성과 אֵלַי의 ‘내게’라는 대상을 함께 살리되, 한국어에서는 자연스럽게 ‘산으로 내게 올라오고’로 옮겼습니다.
- source_word: וֶהְיֵה שָׁם
  english_pob_choice: and remain there
  chosen_korean: 거기서 머무르십시오
  alternatives_korean:
  - 거기 있으십시오
  - 거기서 계십시오
  lexicon: HALOT
  rationale: 단순 존재보다 지속적 체류의 뉘앙스가 있어 ‘머무르십시오’로 옮겼습니다.
- source_word: לֻחֹת הָאֶבֶן וְהַתּוֹרָה וְהַמִּצְוָה
  english_pob_choice: the stone tablets, and the law and the commandment
  chosen_korean: 돌판들과 율법과 명령
  alternatives_korean:
  - 돌판들과 율법과 계명
  - 돌판들과 율법과 그 명령
  lexicon: HALOT
  rationale: 열거 구조를 유지하면서 תּוֹרָה는 토라/교훈보다 이 문맥에서 익숙하고 직접적인 ‘율법’으로, הַמִּצְוָה는 단수성을 살려 ‘명령’으로 옮겼습니다.
theological_decisions:
- issue: ‘율법과 명령’의 관계를 어떻게 처리할지
  chosen_reading: 돌판들과 율법과 명령을 각각 병렬된 수여 항목으로 두었습니다.
  alternative_readings:
  - ‘돌판’의 내용에 대한 동격 설명으로 묶기
  - 셋을 하나의 법전 전체를 가리키는 표현으로 완화하기
  rationale: 히브리어는 병렬 명사를 사용하므로, 해석 쟁점을 한국어 번역이 미리 해소하지 않도록 구조를 보존했습니다.
  doctrine_reference: 해석적 긴장을 보존
