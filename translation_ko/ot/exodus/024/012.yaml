revisions:
- from: 그때 야훼께서 모세에게 말씀하셨습니다. "산으로 내게 올라오고 거기서 머무르십시오. 그러면 내가 돌판들과 율법과 명령을 당신에게 주겠습니다[b], 그것은 내가 그들의 지도를 위해 기록한 것입니다."[a]
  to: 그때 야훼께서 모세에게 말씀하셨습니다. “산으로 내게 올라오십시오. 그리고 거기 머무르십시오. 내가 너에게 내가 그들을 가르치기 위해 기록한 돌판들과 율법[a]과 명령을 주겠습니다[b].”
  rationale: 관계절을 ‘돌판들과 율법과 명령’에 직접 연결하여 기록된 대상의 범위를 단수 지시어로 축소하지 않았습니다. לְהוֹרֹתָם은 ‘그들을 가르치기 위해’로 옮겨 목적과 3인칭 복수 목적어를 보존했습니다. 병렬 열거와 그 범위에 관한 해석적 모호성은 유지했으며, 각주 표지는 각각 율법과 전체 수여 항목에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:38Z'
