    rationale: אֲשֶׁר כָּתַבְתִּי는 앞선 ‘돌판들, 율법, 명령’의 병렬 표현과 관련됩니다. 단수 ‘그것’은 특히 마지막 ‘명령’만을 가리키는 것으로 읽힐 수 있으므로, 관계절을 병렬 명사구에 직접 연결하는 편이 안전합니다.
