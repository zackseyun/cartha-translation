  source_fidelity: 신명 야훼, 산으로 올라오라는 명령, 그곳에 머무르라는 명령, 돌판·율법·명령의 병렬 열거, 그리고 기록과 교육 목적을 전반적으로 충실히 반영합니다. 다만 초안의 “그것은”은 단수 지시어여서 앞의 세 병렬 항목 가운데 하나만 받는 듯할 수 있고, “그들의 지도를 위해”는 לְהוֹרֹתָם의 ‘그들을 가르치기 위해’라는 동사적 목적을 충분히 드러내지 못합니다.
  naturalness: “산으로 내게 올라오고”는 한국어 어순상 다소 부자연스럽고, “그들의 지도”는 ‘지도(map)’의 연상 및 명사적 표현 때문에 어색합니다. 명령을 두 문장으로 분명히 하고 목적절을 ‘그들을 가르치기 위해’로 옮기면 현대 표준 한국어 합쇼체에서 자연스럽습니다.
