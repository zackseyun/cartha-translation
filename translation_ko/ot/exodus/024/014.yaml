  edition: WLC
  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
  footnotes:
  - marker: a
    text: Or, “Whoever has a case, let him approach them.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 장로들에게 말했습니다. “우리가 여러분에게 돌아올 때까지 여기에서 우리를 기다리십시오. 보십시오, 아론과 후르가 여러분과 함께 있습니다. 다툼이 있는 사람은 누구든지 그들에게 나아가게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “법적 사안이 있는 사람은 누구든지 그들에게 나아가게 하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְּקֵנִים
  english_pob_choice: the elders
  chosen_korean: 장로들
  alternatives_korean:
  - 원로들
  - 노인들
  - 지도자들
  lexicon: HALOT
  rationale: זְקֵנִים은 단순한 연령층이 아니라 공동체의 인정된 장로/지도자들을 가리키므로, 표준적이고 문맥에 맞는 ‘장로들’로 옮겼습니다.
- source_word: שְׁבוּ
  english_pob_choice: Wait
  chosen_korean: 기다리십시오
  alternatives_korean:
  - 머무르십시오
  - 앉아 있으십시오
  - 그 자리에 있으십시오
  lexicon: HALOT
  rationale: 직접적으로는 ‘앉다/머무르다’의 뜻이지만, 이 지시문에서는 출발한 모세 일행을 기다리라는 의미이므로 현대 한국어에서 자연스러운 명령형 ‘기다리십시오’가 가장 적절합니다.
- source_word: מִי בַעַל דְּבָרִים
  english_pob_choice: Whoever has a dispute
  chosen_korean: 다툼이 있는 사람은 누구든지
  alternatives_korean:
  - 사안이 있는 사람은 누구든지
  - 소송이 있는 사람은 누구든지
  - 문제가 있는 사람은 누구든지
  lexicon: HALOT
  rationale: בַעַל דְּבָרִים는 법적 분쟁이나 청원을 가진 사람을 가리키는 관용구로, POB의 ‘dispute’에 맞추되 한국어에서는 자연스럽고 문맥에 맞는 ‘다툼이 있는 사람’으로 풀었습니다.
- source_word: יִגַּשׁ אֲלֵהֶם
  english_pob_choice: let him approach them
  chosen_korean: 그들에게 나아오게 하십시오
  alternatives_korean:
  - 그들에게 다가가게 하십시오
  - 그들에게 오게 하십시오
  - 그들에게 접근하게 하십시오
  lexicon: HALOT
  rationale: יִגַּשׁ은 단순 이동보다 권위 있는 자리로 ‘나아가다’는 뉘앙스가 있어, 지시문으로는 ‘나아오게 하십시오’가 가장 적절합니다.
theological_decisions:
- issue: 히브리어 단수 일반형의 보존
  chosen_reading: 다툼이 있는 사람은 누구든지 … 나아오게 하십시오
  alternative_readings:
  - 다툼이 있는 사람들은 누구든지 … 나아오게 하십시오
  - 누구나 그들에게 가게 하십시오
  rationale: 히브리어는 단수 일반형을 사용하므로, 집합적 의미로 바꾸지 않고 한국어에서도 ‘사람은 누구든지’로 단수성을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
