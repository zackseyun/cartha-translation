revisions:
- from: 그는 장로들에게 이렇게 말했습니다. “우리를 위해 여기서 기다리십시오. 우리가 당신들에게 돌아올 때까지입니다. 보십시오, 아론과 후르가 당신들과 함께 있습니다. 다툼이 있는 사람은 누구든지 그들에게 나아오게 하십시오.”[a]
  to: 그는 장로들에게 말했습니다. “우리가 여러분에게 돌아올 때까지 여기에서 우리를 기다리십시오. 보십시오, 아론과 후르가 여러분과 함께 있습니다. 다툼이 있는 사람은 누구든지 그들에게 나아가게 하십시오.”[a]
  rationale: 시간절을 본문 명령과 결합하여 자연스러운 합쇼체로 고치고, 복수 청자 호칭을 ‘여러분’으로 통일했습니다. משפט·분쟁을 가진 사람이라는 בַּעַל דְּבָרִים의 법적 용례를 본문에서는 ‘다툼’으로, 각주 대안에서는 ‘법적 사안’으로 보존했습니다. 아론과 후르에게 나아가도록 하라는 지시의 의미도 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:36Z'
