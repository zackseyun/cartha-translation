  source_fidelity: 핵심 의미는 대체로 충실합니다. אולם לָנוּ는 이 문맥에서 ‘우리를 위하여’보다 ‘우리를 기다리다’로 자연스럽게 결합하는 편이 낫고, יִגַּשׁ의 지시적 용법은 ‘그들에게 나아가게 하십시오’로 옮길 수 있습니다.
  naturalness: 초안의 ‘우리를 위해 여기서 기다리십시오. 우리가 당신들에게 돌아올 때까지입니다’는 한국어로 문장이 부자연스럽고 두 번째 문장이 불완전합니다. 또한 복수 청자에게는 ‘당신들’보다 ‘여러분’이 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘장로들’, ‘아론’, ‘후르’, ‘다툼’은 적절합니다. בַּעַל דְּבָרִים는 단순한 일반 ‘사안’보다 법적 다툼·소송의 맥락을 지니므로, 본문 ‘다툼’은 유지하고 각주에서 ‘법적 사안’을 대안으로 제시하는 것이 적절합니다.
