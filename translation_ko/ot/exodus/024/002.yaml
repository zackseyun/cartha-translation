base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to Yahweh.'' The main text follows the project’s standard rendering of the divine name as ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 모세만이 야훼께[a] 나아갈 것이며, 그들은 나아가지 못하고, 백성도 그와 함께 올라가지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘야훼’를 직접 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: וְנִגַּשׁ
  english_pob_choice: shall come near
  chosen_korean: 나아갈 것이며
  alternatives_korean:
  - 가까이 갈 것입니다
  - 다가갈 것입니다
  lexicon: HALOT
  rationale: נגשׁ의 핵심 의미인 ‘가까이 다가가다’를 살리되, 한국어에서는 지시·허용의 맥락에 맞는 문맥적 미래형으로 자연스럽게 옮겼습니다.
- source_word: לְבַדּוֹ
  english_pob_choice: alone
  chosen_korean: 모세만이
  alternatives_korean:
  - 모세 홀로
  - 오직 모세만
  lexicon: HALOT
  rationale: 배타적 의미를 간명하게 드러내기 위해 ‘만이’를 사용했습니다.
- source_word: אֶל יְהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼에게
  - 여호와께
  lexicon: HALOT
  rationale: 본문이 신적 이름 יְהוָה를 직접 사용하므로 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 도착·접근을 나타내는 조사 ‘-께’를 붙였습니다.
- source_word: לֹא יִגָּשׁוּ
  english_pob_choice: shall not come near
  chosen_korean: 나아가지 못하고
  alternatives_korean:
  - 가까이 가지 못하고
  - 나아오지 못하고
  lexicon: HALOT
  rationale: 같은 동사 נגשׁ를 반복하는 구조이므로 앞의 ‘나아가다’와 대응시켜 금지·불허의 뜻을 자연스럽게 표현했습니다.
- source_word: לֹא יַעֲלוּ
  english_pob_choice: shall not go up
  chosen_korean: 올라가지 못합니다
  alternatives_korean:
  - 올라오지 못합니다
  - 오르지 못합니다
  lexicon: HALOT
  rationale: עלה의 산행적 의미를 살려 ‘올라가다’로 옮겼고, 공동체 전체의 불허를 분명히 하기 위해 부정 가능형으로 처리했습니다.
theological_decisions:
- issue: 언약의 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 출 24:2는 시내산 언약 장면에서 하나님의 고유 անուն을 직접 사용하므로, 공용어적 대체어보다 본문 식별성을 살리는 ‘야훼’가 원문 대응에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
