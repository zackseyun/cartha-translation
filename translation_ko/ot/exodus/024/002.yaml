translation:
  language: ko
  text: 모세만이 야훼께[a] 나아갈 것이며, 그들은 나아가지 못하고, 백성도 그와 함께 올라가지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘야훼’를 직접 사용합니다.
