  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
  footnotes:
  - marker: a
    text: Or, 'Everyone who touches the altar shall be holy.' The Hebrew can be understood either as holiness being imparted by contact or as requiring that only what is holy may touch it.
    reason: alternative_reading
translation:
  language: ko
  text: 너는 칠 일 동안 제단을 속죄하고 그것을 거룩하게 하라. 그러면 제단은 지극히 거룩하게 될 것이며, 제단에 닿는 것은 모두 거룩하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제단에 닿는 사람은 거룩할 것입니다.” 히브리어는 거룩함이 접촉으로 전이된다는 뜻으로도, 거룩한 것만이 닿을 수 있다는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר / make atonement
  english_pob_choice: make atonement
  chosen_korean: 속죄하다
  alternatives_korean:
  - 속죄제를 드리다
  - 정결하게 하다
  - 덮어주다
  lexicon: HALOT
  rationale: 제사장적 문맥에서 כפר는 속죄 행위를 가리키므로, 한국어에서는 의미를 직접 살린 ‘속죄하다’가 가장 투명합니다.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ / consecrate it
  english_pob_choice: consecrate it
  chosen_korean: 거룩하게 하다
  alternatives_korean:
  - 성별하다
  - 성화하다
  - 성결하게 하다
  lexicon: HALOT
  rationale: 제단을 하나님께 구별해 드리는 예식적 동작을 한국어로 가장 자연스럽게 드러내는 표현은 ‘거룩하게 하다’입니다.
- source_word: קֹדֶשׁ קָדָשִׁים / most holy
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩하게
  alternatives_korean:
  - 가장 거룩하게
  - 지성소처럼 거룩하게
  lexicon: HALOT
  rationale: 히브리어의 최상급적 강조를 현대 한국어로 옮기면 ‘지극히 거룩하게’가 가장 무난하고 분명합니다.
- source_word: כָּל הַנֹּגֵעַ ... יִקְדָּשׁ / Whatever touches ... shall become holy
  english_pob_choice: Whatever touches ... shall become holy
  chosen_korean: 제단에 닿는 것은 모두 거룩하게 될 것입니다
  alternatives_korean:
  - 제단에 닿는 것은 모두 거룩할 것입니다
  - 제단에 닿는 사람은 거룩하게 될 것입니다
  lexicon: HALOT
  rationale: 접촉으로 거룩함이 전이된다는 문맥을 살리기 위해 결과 상태를 ‘거룩하게 될 것입니다’로 옮겼고, 대상 범위를 넓게 ‘것은 모두’로 유지했습니다.
theological_decisions:
- issue: 접촉을 통한 거룩함의 전이
  chosen_reading: 제단과 접촉한 것은 거룩함을 받는다는 의미를 본문에 그대로 유지했습니다.
  alternative_readings:
  - 접촉하려면 이미 거룩해야 한다는 뜻
  - 거룩함의 전이가 아니라 접촉 금지의 의미
  rationale: 히브리어 יִקְדָּשׁ는 접촉의 결과 상태를 말하는 것으로 읽는 것이 가장 자연스러우므로, 본문에서 그 긴장을 해소하지 않고 남겨 둡니다.
  doctrine_reference: 본문 의미 보존
