revisions:
- from: 너는 칠 일 동안 제단을 속죄하고 그것을 거룩하게 하라. 그러면 제단은 지극히 거룩하게 될 것이며, 제단에 닿는 것은 모두 거룩하게 될 것입니다.[a]
  to: 너는 칠 일 동안 제단을 위하여 속죄를 행하고 그것을 거룩하게 하십시오. 그러면 제단은 지극히 거룩한 것이 될 것이며, 제단에 닿는 것은 모두 거룩하게 될 것입니다.[a]
  rationale: 제의적 속죄의 대상 관계를 자연스러운 한국어로 분명히 하고, 합쇼체를 일관되게 적용했습니다. ‘지극히 거룩한 것’으로 히브리어 최상급 명사구를 보존했으며, 각주의 대안 독법은 유지하되 접촉 대상을 사람으로 제한하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:48Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 명령형 연속, 제단을 위한 כפר 의식, 제단의 ‘지극히 거룩함’, 그리고 접촉한 대상이 거룩하게 된다는 기본 의미가 대체로 반영되었습니다. 다만 ‘제단을 속죄하고’는 한국어에서 제단 자체가 죄를 범한 것처럼 들릴 수 있어, עַל הַמִּזְבֵּחַ와 제의적 כפר의 관계를 ‘제단을 위하여 속죄를 행하다’로 명시하는 편이 충실합니다.
  naturalness: 초안은 ‘하라’와 ‘될 것입니다’가 섞여 있어 요구된 현대 합쇼체가 일관되지 않습니다. 또한 ‘지극히 거룩하게 될 것’보다 ‘지극히 거룩한 것이 될 것’이 קֹדֶשׁ קָדָשִׁים의 서술적 명사구를 더 자연스럽고 정확하게 드러냅니다.
  terminology: ‘속죄’, ‘거룩하게 하다’, ‘지극히 거룩한 것’은 제의 문맥에서 적절합니다. 각주의 대안은 본문의 넓은 대상(사람이나 물건 모두 가능)을 ‘사람’으로 좁히므로 ‘모든 것’으로 고쳐야 합니다.
  issues:
  - severity: medium
    issue: ‘제단을 속죄하고’라는 표현
    rationale: 히브리어 כפר עַל הַמִּזְבֵּחַ는 제단을 위한 속죄/정결 의례를 가리킵니다. 한국어 타동사 ‘제단을 속죄하다’는 의미 관계가 불명확하고 제단이 속죄의 주체·죄인인 듯 오해될 수 있습니다.
  - severity: low
    issue: 문체 종결의 불일치
    rationale: ‘하라’는 해라체이고 뒤의 ‘될 것입니다’는 합쇼체입니다. 목표 문체에 맞춰 명령문도 ‘하십시오’로 통일해야 합니다.
  - severity: low
    issue: 각주가 접촉 대상을 ‘사람’으로 한정함
    rationale: כָּל הַנֹּגֵעַ는 사람에 한정되지 않습니다. 본문의 ‘것’과 일치하도록 각주도 포괄적으로 유지해야 합니다.
