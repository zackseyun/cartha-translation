revisions:
- from: 너는 숫양에게서 기름진 부분[a]과 기름진 꼬리, 내장을 덮는 기름, 간의 엽, 두 콩팥과 그 위의 기름, 그리고 오른쪽 넓적다리를 가져라. 그것은 안수식용 숫양이기 때문입니다.
  to: 너는 숫양에서 기름과 기름진 꼬리와 내장을 덮는 기름과 간의 엽과 두 콩팥과 그 위의 기름과 오른쪽 넓적다리를 취하십시오. 이는 위임식에 쓰는 숫양이기 때문입니다.[a]
  rationale: 명령문을 합쇼체로 통일하고, 의례 명칭을 ‘안수식’에서 본문의 제사장 위임 의례 전체를 가리키는 ‘위임식’으로 조정했습니다. 해부학적으로 논의되는 יֹתֶרֶת הַכָּבֵד는 영어 POB의 선택을 따라 ‘간의 엽’으로 유지했습니다. 각주 표지를 실제 설명 대상인 마지막 의례 용어 뒤로 이동했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:45Z'
