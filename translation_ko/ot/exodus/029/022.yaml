base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
  footnotes:
  - marker: a
    text: Or, 'a ram of consecration' or 'a ram of installation.' The Hebrew phrase refers to the ram used in the rite that installs the priests into office.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 숫양에서 기름과 기름진 꼬리와 내장을 덮는 기름과 간의 엽과 두 콩팥과 그 위의 기름과 오른쪽 넓적다리를 취하십시오. 이는 위임식에 쓰는 숫양이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성별식에 쓰는 숫양’, ‘임직식에 쓰는 숫양’으로 옮길 수 있습니다. 히브리어 표현은 제사장들을 직무에 세우는 의례에 쓰인 숫양을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: And you shall take
  chosen_korean: 너는 … 가져라
  alternatives_korean:
  - 그리고 너는 … 취하라
  - 너는 … 취해야 합니다
  lexicon: WLC
  rationale: 제사 절차를 지시하는 명령형이므로, 한국어에서도 직접적이고 절차적인 ‘가져라’로 옮겼습니다.
- source_word: חֵלֶב
  english_pob_choice: fat
  chosen_korean: 기름진 부분
  alternatives_korean:
  - 기름
  - 지방
  lexicon: HALOT
  rationale: 제물로 구별된 특정 부위를 가리키므로 단순한 ‘기름’보다 ‘기름진 부분’이 희생 규정의 뜻을 더 분명히 드러냅니다.
- source_word: אַלְיָה
  english_pob_choice: fat tail
  chosen_korean: 기름진 꼬리
  alternatives_korean:
  - 지방 꼬리
  - 기름꼬리
  lexicon: HALOT
  rationale: 양의 특수한 지방 꼬리를 가리키므로, 해부학적 특수성을 살려 ‘기름진 꼬리’로 옮겼습니다.
- source_word: יֹתֶרֶת הַכָּבֵד
  english_pob_choice: the lobe of the liver
  chosen_korean: 간의 엽
  alternatives_korean:
  - 간의 덧부분
  - 간의 일부
  lexicon: HALOT
  rationale: 정확한 해부학적 명칭은 논의가 있으나, POB의 ‘lobe of the liver’를 따라 간의 특정 돌출부를 가리키는 표현으로 압축해 옮겼습니다.
- source_word: שׁוֹק הַיָּמִין
  english_pob_choice: the right thigh
  chosen_korean: 오른쪽 넓적다리
  alternatives_korean:
  - 오른쪽 다리
  - 오른쪽 허벅지
  lexicon: HALOT
  rationale: 제물 분배 문맥에서 שׁוֹק은 다리보다 특정 부위인 넓적다리/허벅지에 가깝기 때문에 ‘오른쪽 넓적다리’로 번역했습니다.
- source_word: אֵיל מִלֻּאִים
  english_pob_choice: a ram of ordination
  chosen_korean: 안수식용 숫양
  alternatives_korean:
  - 서품식용 숫양
  - 성별식 숫양
  - 안수식의 숫양
  lexicon: HALOT
  rationale: 문맥상 제사장 직분에 세우는 의식용 숫양이므로, ‘ordination’의 기능을 한국어로 가장 자연스럽게 드러내는 ‘안수식용’으로 옮겼습니다.
theological_decisions:
- issue: אֵיל מִלֻּאִים의 의례적 의미
  chosen_reading: 제사장 직분에 세우는 안수식용 숫양으로 이해했습니다.
  alternative_readings:
  - 성별의 숫양
  - 서품의 숫양
  - 설치식의 숫양
  rationale: 이 구절은 제사장 임직 의례의 일부이므로, 교회 제도적 ‘서품’보다 본문의 제의적 설치 의미를 살려 표현했습니다.
  doctrine_reference: Translation philosophy §1, §5
