  source_fidelity: 히브리어의 제의적 부위 목록과 절차적 명령은 대체로 충실히 반영되었습니다. 다만 אֵיל מִלֻּאִים은 ‘안수식’보다 제사장 직무에 세우는 위임·임직 의례를 가리키므로, ‘위임식’이 본문의 의례적 의미를 더 정확하고 덜 오해되게 전달합니다.
