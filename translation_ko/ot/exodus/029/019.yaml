  text: וְ/לָ֣קַחְתָּ֔ אֵ֖ת הָ/אַ֣יִל הַ/שֵּׁנִ֑י וְ/סָמַ֨ךְ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/019.yaml
  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: ko
  text: 그러면 두 번째 숫양을 가져오십시오. 아론과 그의 아들들은 그 숫양의 머리 위에 자기들의 손을 얹을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: Then you shall take
  chosen_korean: 그러면 … 가져오십시오
  alternatives_korean:
  - 그리고 … 가져오십시오
  - 그런 다음 … 취하십시오
  lexicon: HALOT
  rationale: 절차적 지시의 연속을 자연스럽게 살리면서, 현대 한국어의 명령형으로 직접적인 수행 지시를 드러냈습니다.
- source_word: הָאַיִל הַשֵּׁנִי
  english_pob_choice: the second ram
  chosen_korean: 두 번째 숫양
  alternatives_korean:
  - 다른 숫양
  - 둘째 숫양
  lexicon: HALOT
  rationale: הַשֵּׁנִי는 단순한 ‘다른’이 아니라 순서상 ‘두 번째’를 뜻하므로, 순서를 분명히 하는 표현을 택했습니다.
- source_word: וְסָמַךְ ... אֶת יְדֵיהֶם עַל רֹאשׁ
  english_pob_choice: shall lay their hands on the head
  chosen_korean: 그들의 손을 … 머리 위에 얹을 것입니다
  alternatives_korean:
  - 그들의 손을 … 머리 위에 둘 것입니다
  - 그들의 손을 … 머리에 얹을 것입니다
  lexicon: HALOT
  rationale: 제의 문맥의 סמך는 단순히 ‘두다’보다 ‘얹다/안수하다’의 물리적 행위를 잘 드러내므로, 본문 자체의 구체적 동작을 보존하는 표현을 택했습니다.
- source_word: אַהֲרֹן וּבָנָיו
  english_pob_choice: Aaron and his sons
  chosen_korean: 아론과 그의 아들들
  alternatives_korean:
  - 아론과 그의 자녀들
  - 아론과 아들들
  lexicon: HALOT
  rationale: 문맥상 제사장 직무를 이어받는 남성 후손을 가리키므로, 성별과 관계를 분명히 하는 ‘아들들’이 적절합니다.
theological_decisions:
- issue: 안수 행위의 의미를 본문 이상으로 해석하지 않기
  chosen_reading: 손을 숫양의 머리 위에 얹는 구체적 제의 동작으로만 옮겼습니다.
  alternative_readings:
  - 죄의 전가를 암시하는 번역
  - 안수를 제사장 임직의 상징으로 설명하는 번역
  rationale: 본문은 행위 자체를 서술할 뿐 상징을 해설하지 않으므로, 후대 신학적 설명을 덧붙이지 않고 본문의 제의적 동작을 그대로 드러냈습니다.
  doctrine_reference: 본문이 허용하는 범위 안에서 제의적 행위를 보존하고, 해석적 확장을 피함.
