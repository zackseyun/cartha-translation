translation:
  language: ko
  text: 그것을 모두 아론의 손바닥 위에, 그 아들들의 손바닥 위에 놓고, 그것들을 야훼 앞에서 요제물로 흔드십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아론의 손바닥 위에, 그의 아들들의 손바닥 위에’라고 더 구체적으로 말합니다. 일부 번역은 이를 ‘손’으로 넓혀 옮기지만, 여기서의 표현은 ‘손바닥’이 더 정확합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ הַכֹּל
  english_pob_choice: You shall put all of it
  chosen_korean: 그것을 모두
  alternatives_korean:
  - 그 전부를
  - 모두 그것을
  lexicon: HALOT
  rationale: 앞 절에서 나온 제물 조각들을 가리키므로, 한국어에서는 목적어를 먼저 두어 지시관계를 자연스럽게 살렸습니다.
- source_word: עַל כַּפֵּי
  english_pob_choice: on the palms of
  chosen_korean: 손바닥 위에
  alternatives_korean:
  - 손 위에
  - 손바닥에
  lexicon: HALOT
  rationale: כַּף는 단순한 ‘손’보다 더 구체적으로 손바닥을 가리키므로, POB의 ‘palms’에 맞춰 구체성을 유지했습니다.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  english_pob_choice: and you shall wave them as a wave offering
  chosen_korean: 요제물로 흔드십시오
  alternatives_korean:
  - 요제로 흔드십시오
  - 흔들어 바치십시오
  lexicon: HALOT
  rationale: תְּנוּפָה는 제의적 ‘요제’에 해당하므로 전통 용어를 쓰되, 동사 ‘흔들다’로 행위를 분명하게 드러냈습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 여호와 앞에서
  lexicon: HALOT
  rationale: POB의 일관된 원칙에 따라 신명기적 이름 יְהוָה를 ‘야훼’로 옮기고, 예배 행위의 공간적·관계적 뉘앙스를 ‘앞에서’로 살렸습니다.
theological_decisions:
- issue: 제의 용어 תְּנוּפָה의 한국어 표기
  chosen_reading: ‘요제물’로 옮겨, 단순한 일반적 흔들기가 아니라 제의적 봉헌 행위임을 드러냈습니다.
  alternative_readings:
  - ‘흔든 제물’
  - ‘요제로 바친 것’
  rationale: 문맥상 מדובר하는 것은 일반 동작이 아니라 성막 제의 안에서의 봉헌 행위이므로, 한국어 성경 독자에게 익숙하면서도 기능을 정확히 드러내는 ‘요제물’을 택했습니다.
  doctrine_reference: Levitical sacrificial terminology in Torah
- issue: 이 구절의 명령형 어조
  chosen_reading: 정중한 명령형 ‘흔드십시오’를 사용했습니다.
  alternative_readings:
  - ‘흔드시오’
  - ‘흔드라’
  rationale: 서술체는 합쇼체를 유지하되, 모세에게 주어진 지시의 직접성을 살리기 위해 현대 공적 문체의 명령형으로 번역했습니다.
  doctrine_reference: Korean target style policy
