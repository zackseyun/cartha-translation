source:
  edition: WLC
  text: וּ/פַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַ/יּוֹם֙ עַל הַ/כִּפֻּרִ֔ים וְ/חִטֵּאתָ֙ עַל הַ/מִּזְבֵּ֔חַ בְּ/כַפֶּרְ/ךָ֖ עָלָ֑י/ו וּ/מָֽשַׁחְתָּ֥ אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
  footnotes:
  - marker: a
    text: Or 'a bull as a purification offering.' The Hebrew term חַטָּאת can denote either 'sin' or, in sacrificial contexts, the offering used for purification from sin/impurity.
    reason: lexical_alternative
translation:
  language: ko
  text: 매일 소를 속죄제물로 드려 속죄해야 합니다[a]. 그리하여 속죄할 때 제단을 정결하게 하고, 그것에 기름을 발라 거룩하게 구별해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결 제물로 드리는 소’. 히브리어 חַטָּאת은 문맥에 따라 ‘죄’ 또는 죄/부정에서의 정결을 위한 제물을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  english_pob_choice: a bull
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 수송아지
  lexicon: HALOT
  rationale: 제의 문맥에서 פַר은 번제·속죄제에 쓰이는 큰 소를 가리키므로, 현대 한국어에서는 가장 자연스러운 포괄어인 ‘소’로 옮겼습니다. '황소'는 성별·이미지가 과도하게 좁고, '수송아지'는 이 단어의 범위를 필요 이상으로 축소할 수 있습니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제물
  alternatives_korean:
  - 속죄제
  - 죄제물
  - 정결제물
  lexicon: HALOT
  rationale: 영어 POB가 각주에서 제의적 ‘purification offering’ 가능성을 열어 두었으므로, 한국어에서도 단순히 ‘죄’가 아니라 제물 자체를 드러내는 ‘속죄제물’로 옮겨 제의적 기능을 보존했습니다.
- source_word: וְחִטֵּאתָ
  english_pob_choice: you shall purify
  chosen_korean: 정결하게 하고
  alternatives_korean:
  - 깨끗하게 하고
  - 정화하고
  - 속죄하게 하고
  lexicon: HALOT
  rationale: 동사 חטא의 제의적 용법은 제단을 도덕적으로 ‘용서’하는 뜻이 아니라 부정에서 ‘정결케’ 하는 뜻이므로, ‘정결하게 하고’가 문맥을 가장 정확하게 반영합니다.
- source_word: לְקַדְּשׁוֹ
  english_pob_choice: to consecrate it
  chosen_korean: 거룩하게 구별해야 합니다
  alternatives_korean:
  - 봉헌해야 합니다
  - 성별해야 합니다
  - 거룩하게 해야 합니다
  lexicon: HALOT
  rationale: קדשׁ는 단순한 감정적 ‘거룩함’이 아니라 성소용으로 따로 떼어 놓는 구별을 뜻하므로, 한국어에서는 제의적 의미가 분명한 ‘거룩하게 구별하다’로 풀어 옮겼습니다.
theological_decisions:
- issue: 제단을 위한 속죄·정결 언어를 도덕적 죄책 개념으로 오해하지 않도록 할 것인지
  chosen_reading: 제단을 ‘정결하게’ 하고 ‘거룩하게 구별’하는 제의적 절차로 읽었습니다.
  alternative_readings:
  - 제단의 죄를 용서한다는 식으로 읽기
  - 일반적인 위생적 청소로 축소하기
  rationale: 본문은 제단의 성별 절차를 말하므로, 속죄·정결 언어를 인간의 윤리적 회개로 전치하지 않고 성소 정화의 기능으로 보존해야 합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
