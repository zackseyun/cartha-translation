  text: Then you shall take the anointing oil and pour it on his head and anoint him.
translation:
  language: ko
  text: 그런 다음 너는 관유를 가져다가 그의 머리에 붓고 그에게 기름을 부어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관유’는 본문의 שֶׁמֶן הַמִּשְׁחָה(‘anointing oil’)를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: Then you shall take
  chosen_korean: 그런 다음 너는 … 가져다가
  alternatives_korean:
  - 그리고 너는 … 가져다가
  - 너는 … 가져다가
  lexicon: HALOT
  rationale: 절차적 지시의 연속성을 한국어에서 자연스럽게 드러내기 위해 ‘그런 다음’을 사용했고, 동작의 시작은 ‘가져다가’로 옮겨 동사 연쇄를 살렸습니다.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  english_pob_choice: the anointing oil
  chosen_korean: 관유
  alternatives_korean:
  - 기름부음의 기름
  - 기름부음용 기름
  lexicon: HALOT
  rationale: 출애굽기의 성별 의례에서 이미 기능이 고정된 표현이므로, 현대 한국어에서 간결하고 전통적인 의미를 유지하는 ‘관유’를 택했습니다.
- source_word: וְיָצַקְתָּ
  english_pob_choice: and pour
  chosen_korean: 붓고
  alternatives_korean:
  - 그리고 붓고
  - 쏟고
  lexicon: HALOT
  rationale: יצק의 기본 의미인 ‘붓다’를 직접 살렸고, 앞 동사와의 병렬을 위해 간결한 연결형을 사용했습니다.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  english_pob_choice: and anoint him
  chosen_korean: 그에게 기름을 부어야 합니다
  alternatives_korean:
  - 그를 기름부어야 합니다
  - 그에게 기름을 발라야 합니다
  lexicon: HALOT
  rationale: 마지막 동사도 의례적 ‘기름부음’ 행위로 분명히 드러내기 위해, 한국어 관용 표현인 ‘기름을 부어’로 옮겼습니다. 다만 앞의 ‘붓다’와 구분되는 의례적 의미가 약해질 수 있어, 본문 전체의 문맥상 관유를 붓는 행위와 함께 성별을 나타내는 것으로 읽도록 했습니다.
theological_decisions:
- issue: 관유를 붓는 행위와 기름부음의 이중 동작
  chosen_reading: ‘붓고’와 ‘기름을 부어야 합니다’를 따로 살려, 물리적 붓기와 성별 행위를 모두 드러냈습니다.
  alternative_readings:
  - ‘관유를 부어 그에게 기름을 부어야 합니다’처럼 하나로 압축하는 방식
  rationale: 히브리어는 두 동사를 나란히 두어 실제 행동과 의례적 의미를 함께 전달하므로, 한국어에서도 두 단계를 분리해 원문의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
