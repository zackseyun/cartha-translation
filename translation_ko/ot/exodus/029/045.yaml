lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  english_pob_choice: And I will dwell
  chosen_korean: 내가 … 거하리니
  alternatives_korean:
  - 내가 … 살리니
  - 내가 … 머무르리니
  - 내가 … 장막을 치리니
  lexicon: HALOT
  rationale: שׁכן은 단순한 위치 이동보다 ‘거주하다/거하다’의 지속적 임재를 뜻하므로, 하나님의 언약적 임재를 살리면서도 현대 한국어에서 자연스러운 ‘거하다’를 택했습니다.
- source_word: בְּת֖וֹךְ
  english_pob_choice: among
  chosen_korean: 가운데
  alternatives_korean:
  - 한가운데
  - 사이에
  - 가운데서
  lexicon: HALOT
  rationale: 사람들 사이의 공동체적 임재를 가리키므로 ‘among’의 기능을 살려 ‘가운데’로 옮겼습니다. ‘한가운데’는 공간 중심성을 더 강하게 띠어 다소 과도할 수 있습니다.
- source_word: בְּנֵ֣י יִשְׂרָאֵ֑ל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손들
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘의 자손
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지하면서도 한국어에서 굳어진 성서 표현인 ‘이스라엘 자손들’을 사용해 남성 복수의 형식과 집합적 지시를 함께 살렸습니다.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  english_pob_choice: and I will be their God
  chosen_korean: 나는 그들의 하나님이 되겠습니다
  alternatives_korean:
  - 나는 그들에게 하나님이 되겠습니다
  - 나는 그들의 하나님이겠습니다
  lexicon: HALOT
  rationale: 언약 공식으로서의 관계를 자연스럽게 드러내기 위해 ‘그들의 하나님이 되겠습니다’로 옮겼습니다. 이는 직역의 딱딱함보다 한국어에서 익숙한 관계 표현을 살리면서도 원문의 의미를 유지합니다.
theological_decisions:
- issue: 언약 임재와 관계 공식
  chosen_reading: 내가 이스라엘 자손들 가운데 거하리니, 나는 그들의 하나님이 되겠습니다.
  alternative_readings:
  - 내가 이스라엘 자손들 가운데 장막을 치리니, 나는 그들의 하나님이 되겠습니다.
  - 내가 이스라엘 자손들 한가운데 거하리니, 나는 그들에게 하나님이 되겠습니다.
  rationale: 본문은 하나님의 지속적 임재와 언약 관계를 함께 말하므로, ‘거하다’와 ‘그들의 하나님이 되다’를 함께 살려 문장 구조를 유지했습니다. ‘장막을 치다’는 의미를 더해 주지만 본문 동사를 지나치게 구체화할 수 있습니다.
  doctrine_reference: 출애굽기 29:45의 언약 임재 공식
