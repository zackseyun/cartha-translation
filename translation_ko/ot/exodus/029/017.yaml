  text: וְ/אֶ֨ת הָ/אַ֔יִל תְּנַתֵּ֖חַ לִ/נְתָחָ֑י/ו וְ/רָחַצְתָּ֤ קִרְבּ/וֹ֙ וּ/כְרָעָ֔י/ו וְ/נָתַתָּ֥ עַל נְתָחָ֖י/ו וְ/עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/017.yaml
  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
  footnotes:
  - marker: a
    text: Or 'wash its inner parts.' The Hebrew term can refer more generally to the inside of the animal, though in sacrificial context 'entrails' is likely more specific.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'put [them] on its pieces and on its head.' The translation 'put them with its pieces and with its head' reflects the likely sense of arranging the washed parts together with the cut pieces for the offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 숫양을 여러 조각으로 자르고, 그 내장과 그 다리를 씻어 그 조각들과 그 머리 위에 놓으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַיִל
  english_pob_choice: the ram
  chosen_korean: 그 숫양
  alternatives_korean:
  - 그 수양
  - 그 양
  lexicon: HALOT
  rationale: 제사 맥락의 אַיִל은 숫양을 가리키므로, 문맥상 가장 자연스럽고 정확한 한국어로 옮겼습니다.
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  english_pob_choice: cut the ram into its pieces
  chosen_korean: 그 조각들로 자르고
  alternatives_korean:
  - 그 부분들로 나누고
  - 그 조각들로 분해하고
  lexicon: HALOT
  rationale: נתח는 제사용으로 짜른 뒤 조각내는 뜻이므로, 절차성을 살리면서도 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: קִרְבּוֹ
  english_pob_choice: its entrails
  chosen_korean: 그 내장
  alternatives_korean:
  - 그 속부분
  - 그 안쪽 부분
  lexicon: HALOT
  rationale: 제사 규정에서 קֶרֶב은 일반적 ‘속’이 아니라 실제로 씻어야 하는 내장에 가깝기 때문에 ‘내장’이 더 구체적입니다.
- source_word: כְרָעָיו
  english_pob_choice: its legs
  chosen_korean: 그 다리
  alternatives_korean:
  - 그 정강이
  - 그 아래다리
  lexicon: HALOT
  rationale: כְּרָעַיִם은 동물의 다리, 특히 아래다리를 가리키므로 현대 독자가 바로 이해할 수 있는 ‘다리’를 택했습니다.
- source_word: וְנָתַתָּ עַל
  english_pob_choice: put them on its pieces and on its head
  chosen_korean: 그 조각들과 그 머리 위에 놓으십시오
  alternatives_korean:
  - 그 조각들과 그 머리 위에 두십시오
  - 그 조각들과 그 머리 위에 올리십시오
  lexicon: HALOT
  rationale: עַל은 여기서 위에/위에 얹어 두는 배열 동작을 나타내므로, 제사 절차를 살려 ‘위에 놓으십시오’로 옮겼습니다.
