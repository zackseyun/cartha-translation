revisions:
- from: 그것은 아론과 그의 아들들에게 영구한 규례로서 이스라엘 자손에게서 돌아갈 것입니다. 그것은 거제물이기 때문입니다. 그것은 이스라엘 자손에게서, 곧 그들의 화목제물 희생제사들 가운데서 나온 거제물이 되어, 야훼께 드리는 그들의 거제물이 될 것입니다.[a]
  to: 그것은 이스라엘 자손에게서 아론과 그의 아들들에게 돌아가는 영구한 몫이 될 것입니다. 이는 그것이 거제물이기 때문입니다. 그것은 이스라엘 자손이 드리는 화목제[a] 희생제물에서 나온, 야훼께 드리는 그들의 거제물이 될 것입니다.
  rationale: 제사장에게 지속적으로 귀속되는 몫이라는 חֹק עוֹלָם의 문맥적 의미를 ‘영구한 몫’으로 분명히 했습니다. זִבְחֵי שַׁלְמֵיהֶם은 ‘그들이 드리는 화목제 희생제물’로 옮겨 중복을 제거하면서 제의적 의미를 보존했습니다. תְּרוּמָה의 반복과 야훼께 드린다는 관계는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:46Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 제사 몫이 아론과 그의 아들들에게 귀속된다는 큰 뜻과 תְּרוּמָה의 반복을 대체로 반영합니다. 그러나 ‘영구한 규례로서 … 돌아갈 것입니다’는 חֹק의 문맥상 ‘정해진 몫/권리’라는 뜻을 충분히 드러내지 못하며, ‘화목제물 희생제사들 가운데서’는 히브리어 구성과 한국어 관용 모두에 맞지 않습니다. 본문은 이스라엘 자손의 화목제 희생제물에서 나오는 야훼께 드리는 거제물임을 말합니다.
  naturalness: ‘그들의 화목제물 희생제사들 가운데서 나온’은 ‘제물’과 ‘희생제사’를 중복하고 ‘가운데서’도 부자연스럽습니다. ‘그들이 드리는 화목제 희생제물에서’로 고치면 זִבְחֵי שַׁלְמֵיהֶם의 제사적 성격과 소유 관계를 자연스럽게 보존합니다. ‘영구한 몫’은 이 문맥에서 제사장에게 정해진 지속적 수령분을 명료하게 표현합니다.
  terminology: ‘거제물’은 תְּרוּמָה의 전통적 제의 용어로 사용 가능합니다. שְׁלָמִים은 본문에서 ‘화목제’로 두고, 대안 번역을 각주에 제시합니다. 신명은 제공된 한국어 프로젝트 선택에 따라 ‘야훼’로 유지합니다.
  issues:
