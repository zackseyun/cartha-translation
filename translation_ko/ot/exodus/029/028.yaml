base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
  footnotes:
  - marker: a
    text: Or 'fellowship offerings' or 'offerings of well-being' for 'peace offerings.' The Hebrew term carries the sense of wholeness and restored relationship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 아론과 그의 아들들에게 영구한 규례로서 이스라엘 자손에게서 돌아갈 것입니다. 그것은 거제물이기 때문입니다. 그것은 이스라엘 자손에게서, 곧 그들의 화목제물 희생제사들 가운데서 나온 거제물이 되어, 야훼께 드리는 그들의 거제물이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교제제물’, ‘평안제물’이라고도 번역할 수 있습니다. 히브리어 용어는 온전함과 회복된 관계의 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: It shall belong
  chosen_korean: 돌아갈 것입니다
  alternatives_korean:
  - 속할 것입니다
  - 되겠습니다
  - 있을 것입니다
  lexicon: HALOT
  rationale: 문맥상 단순 존재가 아니라 아론과 그의 아들들에게 배정되어 귀속되는 뜻이므로, 법적·배분적 의미를 살려 자연스럽게 옮겼습니다.
- source_word: לְחָק עוֹלָם
  english_pob_choice: as a permanent statute
  chosen_korean: 영구한 규례로서
  alternatives_korean:
  - 영원한 규례로서
  - 항구한 규례로서
  - 지속되는 규례로서
  lexicon: HALOT
  rationale: 제의·언약 문맥에서 עוֹלָם은 철학적 영원성보다 지속되는 법적 효력을 가리키므로, 한국어에서는 ‘영구한 규례’가 가장 균형이 좋습니다.
- source_word: תְרוּמָה
  english_pob_choice: contribution
  chosen_korean: 거제물
  alternatives_korean:
  - 봉헌물
  - 헌물
  - 기여물
  lexicon: HALOT
  rationale: POB가 본 항목을 제의적으로 구분된 제물로 처리하고 있으므로, 전통적이지만 문맥에 맞는 ‘거제물’을 사용해 문단 내 반복을 살렸습니다.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  english_pob_choice: from the sacrifices of their peace offerings
  chosen_korean: 그들의 화목제물 희생제사들 가운데서
  alternatives_korean:
  - 그들의 화목제물 제사들 가운데서
  - 그들의 평안제 희생제물 가운데서
  - 그들의 화목제물 제물들 가운데서
  lexicon: HALOT
  rationale: שְׁלָמִים은 POB의 각주처럼 ‘peace offerings’의 의미가 wholeness/restored relationship 쪽을 띠므로, 한국어 관용어 ‘화목제물’을 택하되 sacrificial setting을 분명히 하도록 ‘희생제사들 가운데서’를 보탰습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  - 하나님께
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 YHWH는 ‘야훼’로 옮기며, 제물의 지향 대상을 나타내는 여격을 한국어 조사와 존대 종결로 자연스럽게 표현했습니다.
theological_decisions:
- issue: תְרוּמָה와 제의적 귀속의 표현
  chosen_reading: ‘거제물’로 번역해 제의적 분류와 귀속을 함께 드러냈습니다.
  alternative_readings:
  - ‘헌물’로 완화하여 번역
  - ‘봉헌물’로 일반화
  rationale: 이 절은 단순한 일반 기부가 아니라 제사 규정 안에서 분배되는 특정 제의 몫을 말하므로, 희미한 일반어보다 제의적 전문성을 유지하는 번역이 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (key cultic terms should remain auditable and distinct)
- issue: שְׁלָמִים의 정서적 범위
  chosen_reading: ‘화목제물’로 두되, 문맥상 제사 행위를 분명히 밝혔습니다.
  alternative_readings:
  - ‘평안제물’
  - ‘교제제물’
  - ‘화평제물’
  rationale: 이 용어는 전통적 한국어 성경에서 널리 알려진 ‘화목제물’이 가장 안정적이지만, 단어 자체가 내포하는 wholeness/ restored relationship의 의미는 한국어 본문만으로는 충분히 드러나지 않기 때문에 제사적 문맥을 덧붙여 보완했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms, documented exception)
