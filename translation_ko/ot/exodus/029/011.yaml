translation:
  language: ko
  text: 너는 그 수송아지를 야훼 앞, 곧 회막 입구에서 잡아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 본문에서 신적 고유명사로 쓰이며, 전통적으로는 ‘주’로 번역되기도 합니다.
    reason: source_note
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  english_pob_choice: You shall slaughter
  chosen_korean: 잡아야 합니다
  alternatives_korean:
  - 도살해야 합니다
  - 죽여야 합니다
  lexicon: HALOT
  rationale: 제사 문맥의 동사 שׁחט는 일반적인 ‘죽이다’보다 제의적 ‘잡다/도살하다’가 더 정확합니다. 현대 한국어에서 제물 동작을 자연스럽게 전하면서도 과도하게 비유적이지 않은 표현으로 ‘잡아야 합니다’를 택했습니다.
- source_word: הַפָּר
  english_pob_choice: the bull
  chosen_korean: 그 수송아지
  alternatives_korean:
  - 그 황소
  - 그 소
  lexicon: HALOT
  rationale: פָּר는 제의 문맥에서 수송아지/황소 계열의 수컷 소를 가리키며, 본문 맥락상 제물의 연령감이 드러나는 ‘수송아지’가 가장 자연스럽습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞
  alternatives_korean:
  - 야훼 앞에서
  - 주 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘~앞에/앞에서’라는 위치 표현이므로, 제의적 현존을 살려 ‘야훼 앞’으로 옮겼습니다. יְהוָה는 공용 교회어 대신 원명 ‘야훼’를 유지했습니다.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: at the entrance of the tent of meeting
  chosen_korean: 회막 입구에서
  alternatives_korean:
  - 만남의 장막 입구에서
  - 회막의 문에서
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 출애굽기에서 관용적으로 ‘회막’으로 널리 알려져 있어 이를 유지했고, פֶּתַח은 ‘입구’로 옮겨 제의 장소 지시를 간명하게 살렸습니다.
theological_decisions:
- issue: 제의 명령문의 한국어 문체
  chosen_reading: 명령형을 직접적으로 살리되 합쇼체로 정리했습니다.
  alternative_readings:
  - 문어적 서술형으로 완화
  - 전통적 종결어미로 변환
  rationale: 히브리어의 지시·명령 기능을 약화시키지 않기 위해 ‘-아야 합니다’ 구조를 사용했습니다. 이는 본문의 규범성과 제의 절차성을 현대 한국어에서 분명히 전달합니다.
  doctrine_reference: 출애굽기 29장의 제사 규례
