    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성소에서’. 히브리어는 문자적으로 ‘거룩한 곳에서’라고 하며, 특정한 성막 구획을 가리킨다고 단정하지는 않습니다.
    reason: alternative_reading
