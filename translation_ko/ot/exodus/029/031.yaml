source:
  edition: WLC
  text: וְ/אֵ֛ת אֵ֥יל הַ/מִּלֻּאִ֖ים תִּקָּ֑ח וּ/בִשַּׁלְתָּ֥ אֶת בְּשָׂר֖/וֹ בְּ/מָקֹ֥ם קָדֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
  footnotes:
  - marker: a
    text: Or, 'the ram of consecration.' The Hebrew term refers to the priestly installation rite.
    reason: lexical_alternative
  - marker: b
    text: Or, 'in the Holy Place,' though the Hebrew more literally says 'in a holy place.'
    reason: alternative_reading
translation:
  language: ko
  text: 너는 그 숫양을 가져다가, 그 고기를 거룩한 곳에서 삶아야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘임직의 숫양’. 이 히브리어 표현은 제사장 설치 예식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 곳에서’. 히브리어는 문자적으로 ‘거룩한 곳에서’라고 말하며, 특정한 ‘성소’ 방을 가리키지는 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  english_pob_choice: ram
  chosen_korean: 숫양
  alternatives_korean:
  - 어미양이 아닌 수양
  - 양 수컷
  lexicon: HALOT
  rationale: 제사 문맥의 sacrificial animal로서 ‘숫양’이 가장 자연스럽고, 영어 POB의 ‘ram’과도 대응됩니다.
- source_word: הַמִּלֻּאִים
  english_pob_choice: of ordination
  chosen_korean: 임직의
  alternatives_korean:
  - 봉헌의
  - 성별의
  lexicon: HALOT
  rationale: 제사장 설치 예식의 기술 용어이므로, 문맥상 ‘임직’이 기능을 가장 분명하게 드러냅니다.
- source_word: וּבִשַּׁלְתָּ
  english_pob_choice: and boil
  chosen_korean: 삶아야 합니다
  alternatives_korean:
  - 끓여야 합니다
  - 삶으셔야 합니다
  lexicon: HALOT
  rationale: בשׁל의 구체적 조리 행위는 ‘삶다’가 가장 직접적이며, 제의적 준비 동작을 현대 한국어로 자연스럽게 전달합니다.
- source_word: בְּמָקוֹם קָדֹשׁ
  english_pob_choice: in a holy place
  chosen_korean: 거룩한 곳에서
  alternatives_korean:
  - 성소에서
  - 거룩한 장소에서
  lexicon: HALOT
  rationale: 정관사가 없는 표현이므로 특정 성막 내부 공간인 ‘성소’로 좁히지 않고, 영어 POB의 절제된 처리처럼 일반적 공간 표현을 살렸습니다.
theological_decisions:
- issue: הַמִּלֻּאִים의 제의적 의미를 어떻게 한국어로 드러낼지
  chosen_reading: ‘임직’으로 번역해 제사장 직분 설치의 의미를 분명히 했습니다.
  alternative_readings:
  - ‘봉헌’으로 번역
  - ‘성별’로 번역
  rationale: 히브리어 관용구의 핵심은 단순 헌납보다 직분 부여와 설치에 있으므로, 현대 독자가 기능을 오해하지 않도록 ‘임직’을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
