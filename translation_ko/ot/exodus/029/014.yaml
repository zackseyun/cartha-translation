base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
  footnotes:
  - marker: a
    text: Or 'purification offering.' The Hebrew חַטָּאת can denote either 'sin' or the sacrifice offered in relation to sin; in sacrificial contexts like this, many translate 'sin offering,' while some prefer 'purification offering' to highlight the rite's cleansing function.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 수소의 고기와 가죽과 배설물은 진영 밖에서 불로 태워야 합니다. 그것은 속죄제입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정결제’. 히브리어 חַטָּאת는 ‘죄’를 뜻할 수도 있고 죄와 관련된 제물을 뜻할 수도 있습니다. 이처럼 제사 문맥에서는 전통적으로 ‘속죄제’로 번역하지만, 이 의례의 정결 기능을 강조하여 ‘정결제’로 번역하는 이들도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר
  english_pob_choice: flesh
  chosen_korean: 고기
  alternatives_korean:
  - 살
  - 육체
  lexicon: HALOT
  rationale: 희생 제물의 신체 부분을 가리키므로 문맥상 자연스러운 한국어인 ‘고기’를 택했습니다. ‘살’은 인체 쪽으로 들릴 수 있고, ‘육체’는 추상적입니다.
- source_word: הַפָּר
  english_pob_choice: the bull
  chosen_korean: 그 수소
  alternatives_korean:
  - 그 황소
  - 그 소
  lexicon: HALOT
  rationale: 제사 규정의 동물 명칭으로는 ‘수소’가 가장 구체적이며, 수컷 소를 분명히 드러냅니다. ‘황소’는 일반적 인상은 강하지만 본문의 제의적·동물학적 정확성이 조금 떨어집니다.
- source_word: עֹרוֹ
  english_pob_choice: its hide
  chosen_korean: 가죽
  alternatives_korean:
  - 가죽껍질
  - 껍질
  lexicon: HALOT
  rationale: 동물 사체의 외피는 한국어에서 ‘가죽’이 자연스럽고, 제의적 처분의 대상이라는 점도 잘 드러냅니다.
- source_word: פִּרְשׁוֹ
  english_pob_choice: its dung
  chosen_korean: 똥
  alternatives_korean:
  - 배설물
  - 오물
  lexicon: HALOT
  rationale: 히브리어 פֶּרֶשׁ의 직접적 뜻인 배설물을 흐리지 않기 위해 완곡어보다 직설적인 ‘똥’을 택했습니다. 제의 규정의 불결성과 폐기성을 분명히 보여 줍니다.
- source_word: חַטָּאת
  english_pob_choice: sin offering
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 속죄물
  - 정결제
  lexicon: HALOT
  rationale: 제사 문맥에서 חַטָּאת는 죄와 관련된 제물을 가리키므로 한국어 제의 용어인 ‘속죄제’를 사용했습니다. ‘정결제’는 학술적 대안이지만 본문의 전통적·가독성 있는 대응으로는 ‘속죄제’가 적절합니다.
theological_decisions:
- issue: חַטָּאת의 제의적 의미
  chosen_reading: 속죄제
  alternative_readings:
  - 정결제
  - 죄
  rationale: 본문은 희생 제물의 처분 규정을 말하므로 추상적 ‘죄’가 아니라 제의적 제물을 가리킵니다. ‘속죄제’를 본문에 두어 전통적 인식 가능성과 제사 문맥을 함께 살렸습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy (preserve theological tension rather than resolve it); sacrificial terminology consistency
