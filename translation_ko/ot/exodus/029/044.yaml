source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֛י אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת אַהֲרֹ֧ן וְ/אֶת בָּנָ֛י/ו אֲקַדֵּ֖שׁ לְ/כַהֵ֥ן לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
  footnotes:
  - marker: a
    text: Or 'sanctify' / 'make holy' for 'consecrate' in both occurrences of the verb.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to priest for me' or 'to minister as priests to me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 회막과 제단을 거룩하게 하겠고, 또 아론과 그의 아들들을 거룩하게 하여 내게 제사장으로 섬기게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성별하다’, ‘거룩하게 하다’. קדשׁ 동사가 두 번 나온 것에 대한 번역 대안입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나를 위하여 제사장으로 섬기다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  english_pob_choice: And I will consecrate
  chosen_korean: 거룩하게 하겠고
  alternatives_korean:
  - 성별하겠고
  - 봉헌하겠고
  - 성화하겠고
  lexicon: HALOT
  rationale: קדשׁ의 피엘은 제의적 맥락에서 ‘거룩하게 하다/구별하다’의 뜻이므로, 한국어에서는 ‘거룩하게 하다’가 가장 직접적이고 문맥에 맞습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  - 회중의 장막
  lexicon: HALOT
  rationale: 출애굽기 제의 문맥에서 אֹהֶל מוֹעֵד는 한국어 성경에서 널리 굳어진 ‘회막’이 가장 간결하고 식별 가능합니다.
- source_word: הַמִּזְבֵּחַ
  english_pob_choice: the altar
  chosen_korean: 제단
  alternatives_korean:
  - 제의용 제단
  - 번제단
  lexicon: HALOT
  rationale: 본문은 성막 제의 맥락의 제단을 가리키므로 일반명사 ‘제단’으로 옮기되, 이 절만으로는 번제단으로 한정할 근거가 충분하지 않습니다.
- source_word: לְכַהֵן לִי
  english_pob_choice: to serve me as priests
  chosen_korean: 나를 섬기는 제사장이 되게
  alternatives_korean:
  - 내게 제사장으로 섬기게
  - 나를 위하여 제사장으로 봉사하게
  - 내게 제사장 직분을 행하게
  lexicon: HALOT
  rationale: כהן의 핵심은 ‘제사장 직무를 수행하다’이므로, 한국어에서는 결과 상태를 드러내는 ‘제사장이 되게’와 기능을 드러내는 ‘나를 섬기는’으로 자연스럽게 살렸습니다.
theological_decisions:
- issue: קדשׁ 동사의 제의적 의미
  chosen_reading: ‘거룩하게 하다’로 일관되게 옮겨, 성막과 제사장 모두가 여호와께 속하도록 구별되는 행위를 나타냈습니다.
  alternative_readings:
  - 성별하다
  - 성화하다
  - 봉헌하다
  rationale: 이 절은 윤리적 성화보다 성소와 직분의 제의적 구별을 말하므로, ‘거룩하게 하다’가 본문의 의도를 가장 직접적으로 전달합니다.
  doctrine_reference: Translation philosophy §5 consistency of key terms; §6 cultic context
- issue: 아론과 그의 아들들의 역할
  chosen_reading: ‘제사장이 되게’로 번역해, 직분 부여와 섬김을 함께 드러냈습니다.
  alternative_readings:
  - 제사장으로 삼아
  - 제사장으로 섬기게
  rationale: 히브리어 לְכַהֵן לִי는 ‘나를 위하여 제사장 직분을 수행하다’는 뜻이므로, 단순한 신분 표지보다 직무 수행을 분명히 하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §6; gender-accurate rendering
