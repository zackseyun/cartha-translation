translation:
  language: ko
  text: 너는 그 수송아지를 회막 앞으로 데려오십시오.[a] 그리고 아론과 그의 아들들은 그 수송아지의 머리에 자기들의 손을 얹어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘데려오십시오’는 제사 문맥에서 ‘가까이 데려오십시오’ 또는 ‘제시하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  english_pob_choice: You shall bring
  chosen_korean: 데려오고
  alternatives_korean:
  - 가져오고
  - 바치고
  - 가까이 데리고 오고
  lexicon: HALOT
  rationale: 제사 문맥의 הקרב는 단순 이동보다 제의적 ‘가까이 데려옴/제시함’을 뜻하지만, 한국어에서는 ‘데려오다’가 자연스럽고 동작의 방향을 잘 드러냅니다.
- source_word: הַפָּר
  english_pob_choice: the bull
  chosen_korean: 수송아지
  alternatives_korean:
  - 황소
  - 송아지
  - 젊은 황소
  lexicon: HALOT
  rationale: 제사 동물로서의 פַּר은 나이가 어린 수송아지로 이해하는 것이 자연스럽고, 본문 맥락에도 가장 잘 맞습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  - 회중의 장막
  lexicon: HALOT
  rationale: 이 표현은 출애굽기 제의 문맥에서 고정된 성막 명칭이므로, 한국어에서도 통용되는 ‘회막’을 사용했습니다.
- source_word: וְסָמַךְ ... אֶת יְדֵיהֶם עַל רֹאשׁ
  english_pob_choice: shall lay their hands on the head
  chosen_korean: 자기들의 손을 얹어야 합니다
  alternatives_korean:
  - 손을 얹어야 합니다
  - 손을 놓아야 합니다
  - 손을 머리 위에 두어야 합니다
  lexicon: HALOT
  rationale: סמך는 제의 행위로서 ‘손을 얹다’가 가장 자연스럽고, 여기에 손의 복수성과 머리 위라는 위치 관계를 함께 살렸습니다.
theological_decisions:
- issue: 제사 행위의 의미를 과도하게 해석할지 여부
  chosen_reading: 본문이 말하는 제의적 동작만 드러내고, 죄 전가나 속죄의 세부 신학은 덧붙이지 않았습니다.
  alternative_readings:
  - 죄를 전가하다
  - 속죄를 위한 안수
  rationale: 히브리어 본문은 실제 행위를 묘사할 뿐, 그 신학적 기능을 여기서 직접 설명하지 않습니다. 따라서 독자가 알 수 있는 범위를 넘겨 의미를 확정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
