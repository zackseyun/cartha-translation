  text: וְ/נָתַתָּ֤ אוֹתָ/ם֙ עַל סַ֣ל אֶחָ֔ד וְ/הִקְרַבְתָּ֥ אֹתָ֖/ם בַּ/סָּ֑ל וְ/אֶ֨ת הַ/פָּ֔ר וְ/אֵ֖ת שְׁנֵ֥י הָ/אֵילִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
  footnotes:
  - marker: a
    text: Or 'in one basket.' The Hebrew preposition is literally 'on/upon,' but in this container context the sense is that the items are placed in a single basket.
    reason: lexical_alternative
  - marker: b
    text: Or 'present them' or 'offer them.' The Hebrew verb is the standard sacrificial term 'bring near.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 한 광주리에 담고[a], 그것들을 그 광주리에 담은 채 수소와 숫양 두 마리와 함께 앞으로 가져오십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 광주리 안에.’ 히브리어 전치사는 문자적으로는 ‘위에/위로’이지만, 그릇에 담는 문맥에서는 한 광주리에 넣어 두는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘드리십시오’ 또는 ‘바치십시오.’ 히브리어 동사는 표준적인 제의 용어인 ‘가까이 가져오다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ / אוֹתָם
  english_pob_choice: you shall put them
  chosen_korean: 그것들을 ... 담고
  alternatives_korean:
  - 그것들을 넣고
  - 그것들을 두고
  - 그것들을 놓고
  lexicon: HALOT
  rationale: נתן은 여기서 물건을 용기 안에 배치하는 뜻이므로, 현대 한국어에서는 ‘담다’가 가장 자연스럽고 구체적입니다. 목적어 대명사 ‘그것들’은 앞절의 제물을 가리킵니다.
- source_word: עַל סַל אֶחָד
  english_pob_choice: into one basket
  chosen_korean: 한 광주리에
  alternatives_korean:
  - 한 바구니에
  - 한 광주리 위에
  lexicon: HALOT
  rationale: עַל의 문자적 ‘위에’보다 용기 안에 넣는 문맥이므로, POB의 취지를 따라 ‘한 광주리에’로 옮겼습니다. ‘광주리’는 제의적 용기라는 분위기를 살리면서도 현대 독자에게 자연스럽습니다.
- source_word: וְהִקְרַבְתָּ ... בַּסָּל
  english_pob_choice: you shall bring them near in the basket
  chosen_korean: 그 광주리 안에서 그것들을 함께 앞으로 가져오되
  alternatives_korean:
  - 그 광주리와 함께 그것들을 가져오되
  - 그 광주리 안에 그것들을 가져오되
  - 그것들을 바치되
  lexicon: HALOT
  rationale: הקריב은 제의문맥에서 ‘가까이 가져오다/드리다’의 의미를 가지므로, 과도하게 ‘바치다’로 고정하지 않고 ‘앞으로 가져오다’로 살렸습니다. בַּסָּל은 수단이 아니라 담긴 상태를 나타내므로 ‘광주리 안에서’로 처리했습니다.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  english_pob_choice: along with the bull and the two rams
  chosen_korean: 수송아지와 숫양 두 마리도 그러합니다
  alternatives_korean:
  - 황소와 숫양 두 마리도 그러합니다
  - 수송소와 두 숫양도 그러합니다
  lexicon: HALOT
  rationale: הַפָּר은 제의 제물 문맥에서 어린 수소/수송아지로 이해하는 것이 자연스러워 ‘수송아지’로 옮겼습니다. שְׁנֵי הָאֵילִם은 수량과 명사를 분명히 드러내기 위해 ‘숫양 두 마리’로 옮겼고, 앞의 광주리 내용과 병렬되는 추가 대상임을 ‘도 그러합니다’로 표현했습니다.
theological_decisions:
- issue: 제의 동사 הקריב의 번역 강도
  chosen_reading: ‘앞으로 가져오다’로 옮겨 제의적 ‘가까이 드림’의 의미를 유지하되, 한국어에서 곧장 ‘제사하다’로 특정하지 않았습니다.
  alternative_readings:
  - 드리다
  - 바치다
  - 제사하다
  rationale: 본문은 제물들을 제사장 앞/성소 쪽으로 가져오는 절차를 말하며, 여기서 행위의 단계는 ‘가까이 가져옴’에 가깝습니다. 따라서 예식의 흐름을 보존하면서도 다음 절의 더 구체적 제의 행위와 구별되도록 했습니다.
  doctrine_reference: 제의 절차의 단계성, 레위기/출애굽기 제사 규례의 문맥적 정밀성
- issue: עַל의 의미 처리
  chosen_reading: ‘한 광주리에’로 옮겨, 문자적 ‘위에’보다 담는 행위의 문맥을 우선했습니다.
  alternative_readings:
  - 한 광주리 위에
  - 한 광주리 안에
  rationale: 히브리어 전치사 עַל은 기본적으로 ‘위에’이지만, 용기 문맥에서는 넣어 담긴 상태를 가리킬 수 있습니다. POB의 주석 취지와 원문의 실제 장면을 함께 반영하려면 단순 직역보다 문맥적 의미를 드러내는 것이 적절합니다.
  doctrine_reference: 히브리어 전치사의 문맥적 용법
