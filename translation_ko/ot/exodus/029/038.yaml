  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּעֲשֶׂ֖ה עַל הַ/מִּזְבֵּ֑חַ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנַ֥יִם לַ/יּ֖וֹם תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/038.yaml
  text: 'Now this is what you shall offer on the altar: two one-year-old lambs each day continually[a][b][c].'
  footnotes:
  - marker: a
    text: Or 'you shall do on the altar.' The Hebrew verb is broadly 'do/make,' but here it refers to performing the sacrificial offering.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of a year,' that is, one-year-old lambs.
    reason: lexical_alternative
  - marker: c
    text: Or 'daily, continually.' The phrase indicates an ongoing regular daily offering.
    reason: lexical_alternative
translation:
  language: ko
  text: '제단 위에 바칠 것은 이것입니다[a]: 한 살 된 어린 숫양 두 마리를[b] 날마다 계속해서[c] 바치는 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 동사 עשה는 넓게는 ‘하다/만들다’이지만, 여기서는 제단 위에서 희생 제물을 바치는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 직역은 ‘한 해의 아들들’로, 곧 한 살 된 어린 숫양들을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘날마다 계속해서’는 ‘날마다, 계속해서’라는 반복적·지속적 뜻을 함께 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲשֶׂה
  english_pob_choice: you shall offer
  chosen_korean: 드릴 것이니
  alternatives_korean:
  - 행할 것이니
  - 하시게 될 것이니
  lexicon: HALOT
  rationale: 제단 위의 제의 문맥에서 עשה를 단순히 ‘하다’로 옮기면 어색하므로, 예물·희생을 바치는 행위를 자연스럽게 드러내는 ‘드리다’를 선택했습니다.
- source_word: עַל הַמִּזְבֵּחַ
  english_pob_choice: on the altar
  chosen_korean: 제단 위에
  alternatives_korean:
  - 제단에서
  - 제단에
  lexicon: HALOT
  rationale: 희생 제사의 물리적 위치를 살리면서도 한국어에서 자연스러운 표현인 ‘제단 위에’를 사용했습니다.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  english_pob_choice: two one-year-old lambs
  chosen_korean: 한 살 된 어린 숫양 두 마리
  alternatives_korean:
  - 한 살 된 어린 양 두 마리
  - 한 해 된 숫양 두 마리
  lexicon: HALOT
  rationale: ‘어린 숫양’은 본문의 희생 동물이 숫컷 어린 양이라는 점을 드러내며, ‘한 살 된’은 בְּנֵי שָׁנָה의 나이 표현을 비교적 직역에 가깝게 살립니다.
- source_word: לַיּוֹם תָּמִיד
  english_pob_choice: each day continually
  chosen_korean: 매일 계속해서
  alternatives_korean:
  - 날마다 끊임없이
  - 매일 지속적으로
  lexicon: HALOT
  rationale: לַיּוֹם의 반복성과 תָּמִיד의 지속성을 한국어에서 중복 없이 자연스럽게 묶어 주는 표현으로 옮겼습니다.
theological_decisions:
- issue: 제의 명령의 동사 성격을 어떻게 살릴지
  chosen_reading: ‘드릴 것이니’로 옮겨, 단순한 행위가 아니라 야훼께 바치는 희생 제사의 명령임을 드러냈습니다.
  alternative_readings:
  - ‘행할 것이니’
  - ‘하실 것이니’
  rationale: 이 절은 제단 위에서 수행되는 희생 제사 규례이므로, 영어 POB의 'offer'와 같은 제의적 의미를 한국어에서 분명히 해야 합니다.
  doctrine_reference: 레위기/출애굽기 제사 규례의 예물-희생 문맥
