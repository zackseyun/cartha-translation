  text: וְ/אֶת הָ/אַ֥יִל הָ/אֶחָ֖ד תִּקָּ֑ח וְ/סָ֨מְכ֜וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/015.yaml
  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the one ram,'' distinguishing this ram from the other ram in the consecration ritual; some translations render this as ''the first ram.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너는 그 한 숫양을 가져오고, 아론과 그의 아들들은 그 숫양의 머리 위에 자기들의 손을 얹을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 한 숫양’입니다. 이 표현은 이 숫양을 의식 순서의 다른 숫양과 구별합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  english_pob_choice: Then
  chosen_korean: 그러면
  alternatives_korean:
  - 그리고
  - 이제
  lexicon: WLC; HALOT
  rationale: 절차 지시의 다음 단계라는 연결을 살리되, 한국어에서는 자연스러운 순서 진행 표현인 ‘그러면’이 가장 매끄럽습니다.
- source_word: הָ/אַיִל הָ/אֶחָד
  english_pob_choice: the one ram
  chosen_korean: 그 한 숫양
  alternatives_korean:
  - 그 숫양 하나
  - 첫 번째 숫양
  lexicon: WLC; HALOT
  rationale: ‘한’은 두 번째 숫양과 구별되는 특정 개체를 가리키며, ‘첫 번째’로 단정하지 않고 원문의 구별성을 유지합니다.
- source_word: תִּקָּח
  english_pob_choice: you shall take
  chosen_korean: 가져오고
  alternatives_korean:
  - 취하시오
  - 너는 취할 것입니다
  lexicon: WLC; HALOT
  rationale: 제의 절차에서 대상 동물을 준비해 데려오는 동작으로 자연스럽게 드러나므로 ‘가져오고’로 옮겼습니다.
- source_word: וְ/סָמְכוּ ... אֶת יְדֵי/הֶם עַל רֹאשׁ
  english_pob_choice: shall lay their hands on the head of
  chosen_korean: 자기들의 손을 얹을 것입니다
  alternatives_korean:
  - 손을 놓을 것입니다
  - 손을 얹어 둘 것입니다
  lexicon: WLC; HALOT
  rationale: סמך의 제의적 의미를 한국어 관용에 맞게 ‘손을 얹다’로 옮겨, 단순 접촉이 아니라 희생 제물 위에 손을 두는 행위를 드러냅니다.
- source_word: אַהֲרֹן וּ/בָנָיו
  english_pob_choice: Aaron and his sons
  chosen_korean: 아론과 그의 아들들
  alternatives_korean:
  - 아론과 그의 자손들
  - 아론과 그의 아들
  lexicon: WLC; HALOT
  rationale: 제사장 위임 문맥에서 בנים은 아론의 남자 후손을 가리키므로 표준적으로 ‘아들들’이 가장 정확합니다.
theological_decisions:
- issue: 손을 얹는 제의 행위의 의미
  chosen_reading: ‘손을 얹을 것입니다’로 직역에 가깝게 두어, 그 행위의 상징적·제의적 의미를 본문 밖에서 설명하지 않습니다.
  alternative_readings:
  - 죄 전가를 명시하는 표현
  - 안수합니다
  rationale: 본문 자체는 행위만 말하며 해석을 덧붙이지 않습니다. 따라서 의미를 과도하게 특정하지 않고 제의 동작 자체를 보존합니다.
  doctrine_reference: 제의 절차의 기술을 보존하고, 본문이 직접 말하지 않는 신학적 설명을 도입하지 않음
