  source_fidelity: 히브리어의 절차적 연결, ‘그 한 숫양’이라는 구별 표현, 아론과 그의 아들들이 손을 숫양의 머리에 얹는 행위를 대체로 잘 보존했습니다. 다만 ‘머리 위에’는 원문의 접촉 위치인 ‘머리에’보다 위쪽 공간을 뜻할 수 있어 수정이 필요합니다. 또한 모세에게 주어진 지시는 합쇼체 명령문으로 명확히 하는 편이 적절합니다.
