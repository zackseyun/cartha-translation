revisions:
- from: 너는 흔들어 바친 가슴 부위와 들어 올려 바친 넓적다리 부위를 거룩하게 하되, 곧 흔들렸고 또 들어 올려진 아론의 위임 제물의 숫양에서, 곧 아론의 것과 그의 아들들의 것에서 그렇게 하십시오.[a][b]
  to: 당신은 아론과 그의 아들들에게 속한 위임식 숫양[b]에서 나온, 흔들어 바친 제물의 가슴과 들어 올려 바친 제물[a]의 넓적다리를 거룩하게 하십시오.
  rationale: 수식 관계와 명령문 종결을 바로잡고, 아론 및 그의 아들들과 관련된 소유·배분 표현을 ‘아론과 그의 아들들에게 속한’으로 옮겼습니다. 제의적 동작은 ‘흔들어 바친’과 ‘들어 올려 바친’으로 유지했으며, 반복된 히브리어 동사는 한국어의 제의 명사구 안에 자연스럽게 반영했습니다. 전통 용어 ‘거제’와 관용구 ‘위임들의 숫양’은 본문을 난해하게 하지 않도록 각주에 남겼습니다.
