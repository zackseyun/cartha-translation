source:
  edition: WLC
  text: וְ/קִדַּשְׁתָּ֞ אֵ֣ת חֲזֵ֣ה הַ/תְּנוּפָ֗ה וְ/אֵת֙ שׁ֣וֹק הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַ/אֲשֶׁ֣ר הוּרָ֑ם מֵ/אֵיל֙ הַ/מִּלֻּאִ֔ים מֵ/אֲשֶׁ֥ר לְ/אַהֲרֹ֖ן וּ/מֵ/אֲשֶׁ֥ר לְ/בָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
  footnotes:
  - marker: a
    text: Or 'the thigh of the raised offering'; traditionally 'the heave offering.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the ram of fillings,' an idiom for the ram used in ordination/consecration.
    reason: cultural_note
translation:
  language: ko
  text: 너는 흔들어 바친 가슴 부위와 들어 올려 바친 넓적다리 부위를 거룩하게 하되, 곧 흔들렸고 또 들어 올려진 아론의 위임 제물의 숫양에서, 곧 아론의 것과 그의 아들들의 것에서 그렇게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들어 올려 바친’은 전통적인 ‘거제’에 해당하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘위임들의 숫양’은 제사장 위임/임직 예식에 쓰인 숫양을 가리키는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  english_pob_choice: you shall consecrate
  chosen_korean: 거룩하게 하되
  alternatives_korean:
  - 구별하여 거룩하게 하되
  - 성별하되
  lexicon: HALOT
  rationale: קדשׁ의 사역형은 제의적으로 따로 떼어 거룩한 몫으로 삼는 뜻이므로, 현대 한국어에서는 ‘거룩하게 하다’가 가장 직접적이고 자연스럽습니다.
- source_word: חֲזֵה הַתְּנוּפָה / שׁוֹק הַתְּרוּמָה
  english_pob_choice: the breast of the wave offering / the thigh of the contribution
  chosen_korean: 흔들어 바친 가슴 부위 / 들어 올려 바친 넓적다리 부위
  alternatives_korean:
  - 요제를 위한 가슴 / 거제를 위한 넓적다리
  - 흔든 제물의 가슴 / 들어 올린 제물의 넓적다리
  lexicon: HALOT
  rationale: תְּנוּפָה와 תְּרוּמָה의 제의적 동작을 살리기 위해 각각 ‘흔들어 바친’, ‘들어 올려 바친’으로 옮기고, 해부학적·제의적 몫을 함께 드러내기 위해 ‘부위’를 보탰습니다.
- source_word: אֵיל הַמִּלֻּאִים
  english_pob_choice: the ram of ordination
  chosen_korean: 아론의 위임 제물의 숫양
  alternatives_korean:
  - 위임식 숫양
  - 임직 제물의 숫양
  lexicon: HALOT
  rationale: מִלֻּאִים은 제사장 위임/임직을 가리키는 관용구이므로, 한국어에서는 문맥상 뜻이 분명한 ‘위임 제물’로 풀어 원문의 제의적 성격을 보존했습니다.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  english_pob_choice: from what was Aaron's and from what was his sons'
  chosen_korean: 아론의 것과 그의 아들들의 것에서
  alternatives_korean:
  - 아론에게 속한 것과 그의 아들들에게 속한 것에서
  - 아론 몫과 그의 아들들 몫에서
  lexicon: HALOT
  rationale: 소유·배분을 나타내는 יחס construction을 자연스럽게 살리기 위해 ‘~의 것’으로 옮겼으며, 제의 분배의 대칭 구조도 유지했습니다.
theological_decisions:
- issue: 제의 용어의 직역성 유지
  chosen_reading: ‘흔들어 바친’, ‘들어 올려 바친’ 같은 구체적 제의 동작을 유지했습니다.
  alternative_readings:
  - ‘봉헌된’, ‘바쳐진’처럼 일반화된 표현으로 완화
  rationale: 이 절은 성별 행위 자체를 규정하는 제사 규례이므로, 동작과 명칭의 대응을 흐리지 않는 편이 원문 이해에 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
