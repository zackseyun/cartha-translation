  source_fidelity: 개정이 필요합니다. 초안은 תְּנוּפָה/תְּרוּמָה 및 관련 동사를 구체적인 동작으로 옮기려는 방향은 적절하지만, ‘아론의 위임 제물의 숫양’은 אֵיל הַמִּלֻּאִים에 ‘아론의’를 부당하게 결합합니다. 아론과 그의 아들들은 뒤의 소유·배분 구문에 연결됩니다. 또한 원문의 ‘흔들린/들어 올려진’ 대응은 한국어에서 앞선 제의 명칭의 동작 표현으로 자연스럽게 반영하되, 수식 관계를 명료하게 해야 합니다.
  naturalness: 초안의 ‘거룩하게 하되 … 그렇게 하십시오’는 연결 어미와 합쇼체 종결이 충돌하며, ‘곧’의 반복과 긴 수식어 때문에 문장 구조가 부자연스럽습니다. ‘가슴 부위/넓적다리 부위’도 제의적 분배 몫을 나타내는 문맥에서 불필요하게 장황합니다.
  terminology: ‘위임식 숫양’은 אֵיל הַמִּלֻּאִים의 관용적 제의 용례를 현대적으로 잘 나타냅니다. תְּנוּפָה와 תְּרוּמָה는 각각 ‘흔들어 바친 제물’과 ‘들어 올려 바친 제물’으로 유지하여 동작과 제의 범주를 보존했습니다. ‘거제’는 독자에게 낯선 전통 용어이므로 각주에서 대안으로 제시합니다.
