  alternative_readings:
  - 직임을 세우십시오
  - 임직시키십시오
  - 손을 채우십시오
  rationale: 본문의 제의적 의미는 유지하되, 한국어 교회용어에 지나치게 고정되지 않으면서도 위임·설치의 기능적 뜻을 분명히 드러내기 위해 완곡한 직무 위임 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
