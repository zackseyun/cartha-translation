  source_fidelity: 수정안은 לְאַהֲרֹן וּלְבָנָיו의 수혜·관련 관계를 ‘아론과 그의 아들들을 위하여’로 자연스럽게 반영하고, כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה를 빠짐없이 보존합니다. שִׁבְעַת יָמִים의 기간 표현도 ‘칠 일 동안’으로 정확합니다. מלא יד의 제사장 임직 관용구는 본문 문맥에 맞게 ‘제사장으로 세우십시오’로 옮기고 직역을 각주로 보존합니다.
  naturalness: 초안의 ‘-들에게도’는 원문에 없는 첨가의 뉘앙스를 내며, ‘곧’은 설명·정정 관계를 보태므로 제거하는 것이 좋습니다. 수정안은 현대 표준 한국어 합쇼체로 자연스럽고 지시문의 흐름도 명료합니다.
  terminology: ‘직분을 맡기십시오’는 누가 누구에게 직분을 맡기는지 다소 모호하며, 일반적 직무 위탁으로도 읽힐 수 있습니다. 본문의 제사장 임직 맥락을 분명히 하는 ‘제사장으로 세우십시오’가 더 정확하며 특정 교단의 의례를 강요하지 않습니다.
