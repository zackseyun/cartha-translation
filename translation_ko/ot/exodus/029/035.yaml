  lexicon: HALOT
  rationale: 기간을 나타내는 표현이므로 한국어에서는 ‘동안’을 보충해 시간적 지속을 분명히 했습니다.
- source_word: תְּמַלֵּא יָדָם
  english_pob_choice: you shall ordain them
  chosen_korean: 그들에게 직분을 맡기십시오
  alternatives_korean:
