  - 그들을 안수하여 세우십시오
  - 그들을 임직시키십시오
  lexicon: HALOT
  rationale: ‘손을 채우다’라는 직역은 한국어 독자에게 불투명하므로, 제사장 직무에 설치·임명하는 관용적 의미를 드러내는 표현을 택했습니다.
