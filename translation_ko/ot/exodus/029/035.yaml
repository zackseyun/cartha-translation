  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
  footnotes:
  - marker: a
    text: Literally, 'you shall fill their hand,' a Hebrew idiom for ordaining or installing someone into priestly service.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론과 그의 아들들에게도 이렇게 하십시오. 곧 내가 당신에게 명령한 모든 것에 따라 하십시오. 칠 일 동안 그들에게 직분을 맡기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 손을 채우다’인데, 제사장 직무에 세우는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall do
  chosen_korean: 이렇게 하십시오
  alternatives_korean:
  - 그리고 당신은 하십시오
  - 그렇게 하십시오
  lexicon: HALOT
  rationale: 지시문 맥락의 연속 명령으로 읽어, 한국어에서는 앞 절을 받아 자연스럽게 ‘이렇게 하십시오’로 옮겼습니다.
- source_word: לְאַהֲרֹן וּלְבָנָיו
