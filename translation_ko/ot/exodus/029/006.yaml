  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
  footnotes:
  - marker: a
    text: Or 'the holy crown.' The Hebrew nezer can denote a consecrated crown-like emblem; 'diadem' was chosen to reflect a sacred ornamental piece worn on the priestly headgear.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 머리에 제사장 머리쓰개를 씌우고, 그 머리쓰개 위에 거룩한 관을 얹으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거룩한 디아뎀”. 히브리어 네제르는 성별된 관 모양의 표지를 가리킬 수 있으며, 여기서는 제사장 머리쓰개 위에 놓이는 거룩한 장식물을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ / הַמִּצְנֶפֶת
  english_pob_choice: And you shall place the turban
  chosen_korean: 관을 머리에 씌우고
  alternatives_korean:
  - 터번을 머리에 두고
  - 머리쓰개를 머리에 놓고
  lexicon: HALOT
  rationale: מִצְנֶפֶת은 제사장 머리에 감는 머리쓰개를 가리키므로, 한국어에서는 기능과 장면을 살려 자연스럽게 "관을 머리에 씌우고"로 옮겼습니다.
- source_word: עַל רֹאשׁוֹ
  english_pob_choice: on his head
  chosen_korean: 머리에
  alternatives_korean:
  - 그의 머리 위에
  - 그 머리 위에
  lexicon: HALOT
  rationale: 히브리어의 위치 표현을 한국어에서는 중복 없이 간결하게 처리하여, 씌우는 동작의 대상이 머리임을 분명히 했습니다.
- source_word: נֵזֶר הַקֹּדֶשׁ
  english_pob_choice: the holy diadem
  chosen_korean: 거룩한 왕관
  alternatives_korean:
  - 거룩한 디아뎀
  - 성스러운 관
  lexicon: HALOT
  rationale: נֵזֶר는 성별된 장식성 머리장식을 가리키므로, 교회용어로 굳어진 "관"보다도 제의적 상징을 유지하면서도 한국어 독자가 이해하기 쉬운 "거룩한 왕관"을 택했습니다.
- source_word: עַל הַמִּצְנֶפֶת
  english_pob_choice: on the turban
  chosen_korean: 그 위에
  alternatives_korean:
  - 터번 위에
  - 관 위에
  lexicon: HALOT
  rationale: 앞 절에서 이미 머리쓰개를 제시했으므로, 반복을 줄이기 위해 한국어에서는 지시대명사로 연결해 부착 위치를 자연스럽게 나타냈습니다.
theological_decisions:
- issue: 제사장 머리장식의 번역 어휘
  chosen_reading: 전문 용어인 "디아뎀" 대신, 예식성과 상징을 살리는 "거룩한 왕관"으로 옮겼습니다.
  alternative_readings:
  - 거룩한 디아뎀
  - 성별된 왕관
  rationale: 문맥상 왕권 자체보다 여호와께 구별된 제사장 직분의 장식이라는 점이 중요하므로, 현대 독자에게도 의미가 바로 드러나는 표현을 선택했습니다.
  doctrine_reference: 출 29장 제사장 위임 규례
