    reason: ot_citation
lexical_decisions:
- source_word: כִכַּר לֶחֶם
  english_pob_choice: loaf of bread
  chosen_korean: 빵 한 덩이
  alternatives_korean:
  - 빵 한 개
  - 둥근 빵 한 덩이
  - 빵 한 덩어리
  lexicon: HALOT
  rationale: כִכַּר은 둥글거나 덩이진 빵 한 단위를 가리키므로, 한국어로는 ‘한 덩이’가 자연스럽고 계수 표현도 살릴 수 있습니다.
- source_word: וַחַלַּת לֶחֶם שֶׁמֶן
  english_pob_choice: cake of bread with oil
  chosen_korean: 기름이 든 빵 한 과자
  alternatives_korean:
  - 기름 바른 빵 한 과자
  - 기름 섞은 빵 한 과자
  - 기름이 들어간 빵 한 과자
  lexicon: HALOT
  rationale: חַלָּה는 빵/과자 형태의 제의용 음식이고, לֶחֶם שֶׁמֶן은 기름과 관련된 빵 항목이므로, ‘기름이 든’으로 간결하게 옮겨 과도한 해석 없이 원문의 결속을 드러냅니다.
- source_word: וְרָקִיק
  english_pob_choice: wafer
  chosen_korean: 한 웨이퍼
  alternatives_korean:
  - 얇은 과자 한 장
  - 얇은 떡 한 장
  - 한 장의 얇은 과자
  lexicon: HALOT
  rationale: רָקִיק은 얇은 무교병을 뜻하므로, 제의적 맥락에서 ‘웨이퍼’가 얇음과 형태를 짧게 전달합니다.
- source_word: מִסַּל הַמַּצּוֹת
  english_pob_choice: from the basket of unleavened bread
  chosen_korean: 무교병 바구니에서
  alternatives_korean:
  - 무교병이 담긴 바구니에서
  - 무교병의 바구니에서
  - 누룩 없는 빵 바구니에서
  lexicon: HALOT
  rationale: מַצּוֹת은 무교병이며, מִן은 출처를 나타내므로 ‘~에서’로 보존했습니다. ‘무교병 바구니’는 제의용 그릇의 성격을 간결하게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 테트라그라마톤은 제목이 아니라 고유한 신적 이름이므로, 본문에서는 대체 칭호 대신 ‘야훼’로 옮겨 POB의 이름 보존 원칙을 따랐습니다.
theological_decisions:
- issue: 제의용 음식 항목의 배열과 수량 표현
  chosen_reading: ‘그리고 … 한 … 와 … 한 … 와 … 한 …’의 병렬 구조를 유지해 각 제물의 개별성을 드러냈습니다.
  alternative_readings:
  - 두 항목을 묶어 자연스럽게 재배열하는 방식
  - 수량을 생략하고 목록만 제시하는 방식
  rationale: 원문은 각 항목마다 אחד/אַחַת의 대응을 통해 제의 규격을 강조하므로, 한국어에서도 개별 수량을 유지하는 편이 원문의 의도를 더 잘 보존합니다.
  doctrine_reference: 본문의 제의 규정 보존 원칙
