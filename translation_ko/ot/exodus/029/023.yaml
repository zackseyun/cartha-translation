source:
  edition: WLC
  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
  footnotes:
