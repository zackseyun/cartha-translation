  text: וְ/לָֽקַחְתָּ֗ אֶֽת כָּל הַ/חֵלֶב֮ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּרֶב֒ וְ/אֵ֗ת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֖לֶב אֲשֶׁ֣ר עֲלֵי/הֶ֑ן וְ/הִקְטַרְתָּ֖ הַ/מִּזְבֵּֽחָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
  footnotes:
  - marker: a
    text: Or 'the lobe of the liver.' The Hebrew term refers to a specific part attached to the liver, but its exact anatomical identification is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 너는 entrails를 덮고 있는 모든 기름과, 간 위의 엽, 두 콩팥과 그 위의 기름을 가져다가 제단 위에 불살라야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘간의 엽’. 히브리어 용어는 간에 붙은 특정 부분을 가리키지만, 정확한 해부학적 동일시는 분명하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ / you shall take
  english_pob_choice: you shall take
  chosen_korean: 가져다가
  alternatives_korean:
  - 취하여
  - 가지고
  lexicon: HALOT
  rationale: 제사 절차의 연속적 명령으로 이해하여, 현대 한국어에서 자연스럽고 절차성을 살리는 동작 표현인 ‘가져다가’를 택했습니다.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב / the fat that covers the entrails
  english_pob_choice: all the fat that covers the entrails
  chosen_korean: entrails를 덮고 있는 모든 기름
  alternatives_korean:
  - 내장을 덮고 있는 모든 기름
  - 창자를 덮고 있는 모든 기름
  lexicon: HALOT
  rationale: חֵלֶב은 제사 문맥의 특정 지방을 가리키지만, POB의 영어 선택을 따라 일반 독자에게도 이해되는 ‘기름’으로 옮기고, קֶרֶב은 해부학적으로 뭉뚱그린 ‘내장/entrails’로 처리했습니다.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד / the lobe on the liver
  english_pob_choice: the lobe on the liver
  chosen_korean: 간 위의 엽
  alternatives_korean:
  - 간 위의 허파엽
  - 간의 엽
  lexicon: HALOT
  rationale: יֹתֶרֶת은 정확한 해부학적 동일시가 확정되지 않은 용어이므로, POB의 신중한 ‘lobe’에 맞춰 과잉 단정 없이 ‘엽’으로 옮겼습니다.
- source_word: וְהִקְטַרְתָּ ... / you shall burn them
  english_pob_choice: you shall burn them
  chosen_korean: 불살라야 합니다
  alternatives_korean:
  - 불사르셔야 합니다
  - 태워야 합니다
  lexicon: HALOT
  rationale: קטר의 제사적 의미를 드러내기 위해 단순 소각보다 제의적 뉘앙스가 있는 ‘불사르다’를 선택했습니다.
theological_decisions:
