  chosen_reading: 공적인 절차 지시로서의 명령을 한국어 합쇼체로 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 옛스러운 경어체로 변경
  rationale: 본문은 제사장에게 주어지는 절차 명령이므로, 권위와 절차성을 살리되 현대 한국어 성경 문체에 맞게 합쇼체로 표현했습니다.
  doctrine_reference: 토라의 제사 규정 전달 방식
