  text: 그것은 너희 대대로 야훼 앞 회막 어귀에서 드리는 정기적인 번제입니다. 내가 그곳에서 너희와 만나[ㄱ], 거기서 네게 말할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 히브리어는 여기서 ‘너희와’(복수)라고 한 뒤 ‘네게’(단수)라고 합니다. 앞의 복수는 이스라엘 백성 또는 제사장들을, 뒤의 단수는 모세를 가리킬 가능성이 있습니다.
    reason: The source shifts from a plural pronoun to a singular pronoun; the note documents the preserved grammatical distinction without treating the referent as certain.
