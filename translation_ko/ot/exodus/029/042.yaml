  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
  footnotes:
  - marker: a
    text: Or 'a continual burnt offering' or 'a perpetual burnt offering.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from plural ('with you') to singular ('to you'), likely distinguishing the broader people from Moses specifically.
    reason: lexical_alternative
