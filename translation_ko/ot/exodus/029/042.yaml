  verdict: revise
  source_fidelity: The draft accurately renders the regular burnt offering, the enduring 'throughout your generations' force, the location before Yahweh at the entrance of the tent of meeting, and God's meeting with the plural addressees. However, it incorrectly levels the final singular Hebrew pronoun (אֵלֶיךָ, 'to you' singular) to plural '너희에게.'
  naturalness: The wording is generally understandable, but '회막 문에서' is less idiomatic and slightly less precise for פֶּתַח ('entrance/opening'). '회막 어귀에서' is natural in formal Korean and fits the cultic spatial reference. The revised wording maintains modern formal-polite style.
  terminology: '''야훼,'' ''회막,'' and ''번제'' are appropriate standard Korean biblical terms. ''정기적인 번제'' appropriately conveys עֹלַת תָּמִיד without suggesting an unbroken, continuous action.'
  issues:
  - severity: medium
    issue: The final addressee is rendered as plural ('너희에게') rather than singular.
    rationale: The Hebrew deliberately shifts from plural לָכֶם ('with you [plural]') to singular אֵלֶיךָ ('to you [singular]'). Korean can and should retain this distinction as '너희와' and '네게.'
  - severity: low
    issue: '''회막 문에서'' is revised to ''회막 어귀에서.'''
    rationale: פֶּתַח denotes the entrance/opening. '어귀' is a more natural and contextually precise formal Korean rendering than the literal-sounding '문' here.
  revised_text: 그것은 너희 대대로 야훼 앞 회막 어귀에서 드리는 정기적인 번제입니다. 내가 그곳에서 너희와 만나[ㄱ], 거기서 네게 말할 것입니다.
