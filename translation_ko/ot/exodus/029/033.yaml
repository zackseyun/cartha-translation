review_pass:
  verdict: revise
  source_fidelity: 현 번역의 ‘그들 위에서 속죄가 이루어진 것들’은 בָהֶם의 수단적 용법을 장소적 ‘위에서’로 잘못 옮겼습니다. 또한 ‘손을 위임하고’는 히브리어 관용구의 의미와 한국어 문법 모두에서 부정확합니다. 본문은 그 제물들을 통하여 속죄가 이루어지고 제사장들이 임직·성별되는 맥락을 말합니다.
  naturalness: ‘손을 위임하다’와 ‘그들 위에서 속죄가 이루어진 것들’은 현대 표준 한국어에서 자연스럽지 않고 의미가 불명확합니다. ‘임직시키고 거룩하게 구별하기 위해’ 및 ‘속죄가 이루어지는 데 쓰인 제물들’이 현대 합쇼체에서 명료합니다.
  terminology: כפר는 ‘속죄’, קדשׁ의 제의적 뜻은 ‘거룩하게 구별하다’로 옮겼습니다. זָר는 혈통적 외국인으로 한정되지 않으므로 본문에서는 전통적 제의 용어인 ‘외인’을 유지하고 각주에서 범위를 밝혔습니다. מִלֵּא יָד는 ‘임직시키다’로 기능 번역하되, 문자적 표현은 각주에 보존했습니다.
