revisions:
- from: 그들은 자기들의 손을 위임하고 거룩하게 하기 위해 그들 위에서 속죄가 이루어진 것들을 먹어야 합니다. 그러나 외인은 그것들을 먹어서는 안 됩니다. 그것들은 거룩하기 때문입니다.[a][b][c]
  to: 그들은 자신들을 임직시키고 거룩하게 구별하기 위해 속죄가 이루어지는 데 쓰인 그 제물들을 먹어야 합니다.[a] 그러나 외인은 그것들을 먹어서는 안 됩니다.[b] 그것들은 거룩하기 때문입니다.
  rationale: 원문의 수단적 בָהֶם을 ‘속죄가 이루어지는 데 쓰인’으로 바로잡고, 제사장 임직 관용구를 자연스러운 한국어로 기능 번역했습니다. 각주는 문자적 표현과 제의적 용어 ‘외인’의 범위를 보충합니다.
  reviewer_model: gpt-5.6-terra
