id: EXO.29.33
reference: Exodus 29:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָכְל֤וּ אֹתָ/ם֙ אֲשֶׁ֣ר כֻּפַּ֣ר בָּ/הֶ֔ם לְ/מַלֵּ֥א אֶת יָדָ֖/ם לְ/קַדֵּ֣שׁ אֹתָ֑/ם וְ/זָ֥ר לֹא יֹאכַ֖ל כִּי קֹ֥דֶשׁ הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
  footnotes:
  - marker: a
    text: Literally, 'fill their hand,' a Hebrew idiom for priestly ordination or installation.
    reason: lexical_alternative
  - marker: b
    text: Or 'through which expiation was made for them.'
    reason: lexical_alternative
  - marker: c
    text: '''Outsider'' here means someone not authorized to participate in the priestly rite, not necessarily a foreigner by ethnicity.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 자신들을 임직시키고 거룩하게 구별하기 위해 속죄가 이루어지는 데 쓰인 그 제물들을 먹어야 합니다.[a] 그러나 외인은 그것들을 먹어서는 안 됩니다.[b] 그것들은 거룩하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 손을 채우고’입니다. 이는 제사장을 임직하거나 세우는 것을 뜻하는 히브리어 관용구입니다. ‘속죄가 이루어지는 데 쓰인’은 직역하면 ‘그것들로 속죄가 이루어진’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘외인’은 여기서 혈통상 외국인이라기보다 제사장 직무와 이 제의에 참여할 권한이 없는 사람을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ
  english_pob_choice: They shall eat
  chosen_korean: 먹어야 합니다
  alternatives_korean:
  - 먹습니다
  - 먹을 것입니다
  lexicon: HALOT
  rationale: 제사 규례의 명령형·의무적 뉘앙스를 살리면서 현대 합쇼체로 자연스럽게 옮겼습니다.
- source_word: לְמַלֵּא אֶת יָדָם
  english_pob_choice: to ordain them
  chosen_korean: 손을 위임하고
  alternatives_korean:
  - 안수하여 세우고
  - 임직하게 하고
  - 손을 채우고
  lexicon: HALOT
  rationale: 직역인 ‘손을 채우다’는 한국어에서 의미가 불투명하므로, 제사장 설치의 관용구라는 점을 살려 기능적으로 옮겼습니다. 본문에서 ‘먹는 것’이 위임 절차의 일부라는 점도 반영했습니다.
- source_word: לְקַדֵּשׁ אֹתָם
  english_pob_choice: to consecrate them
  chosen_korean: 거룩하게 하기 위해
  alternatives_korean:
  - 성별하기 위해
  - 성화하기 위해
  - 성결하게 하기 위해
  lexicon: HALOT
  rationale: קדש의 제의적 의미는 단순 도덕적 ‘성화’가 아니라 구별하여 거룩한 용도로 세우는 뜻이므로, 이를 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: וְזָר
  english_pob_choice: but an outsider
  chosen_korean: 외인
  alternatives_korean:
  - 낯선 사람
  - 부외자
  - 제사장 이외의 사람
  lexicon: HALOT
  rationale: זר는 여기서 민족적 ‘이방인’보다 제의적으로 허가받지 않은 자를 가리키므로, POB의 취지를 따라 ‘외인’으로 옮겼습니다.
theological_decisions:
- issue: כפר의 제사 문맥 번역
  chosen_reading: 속죄가 이루어진 것들
  alternative_readings:
  - 속죄가 이루어진 것들
  - 화해가 이루어진 것들
  - 속죄제물이 된 것들
  rationale: 이 절은 제사장 임직과 관련된 희생 제물의 효력을 말하므로, 제의적·신학적 무게를 유지하는 ‘속죄’가 적절합니다. 동시에 한국어 문장에서는 행위 초점의 수동 표현이 자연스럽습니다.
  doctrine_reference: Translation philosophy §6
- issue: 외인의 범위
  chosen_reading: 제의적으로 허가받지 않은 자를 뜻하는 외인
  alternative_readings:
  - 혈통상 이방인
  - 일반 평민
  - 비제사장
  rationale: 본문의 זר는 민족 구분보다 성소 접근 권한의 경계를 강조하므로, 혈통적 ‘이방인’으로 좁히지 않고 제의적 자격 부재를 드러내는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
