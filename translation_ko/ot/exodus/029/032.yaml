  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
  footnotes:
  - marker: a
    text: Or 'the meat of the ram.' The Hebrew word is literally 'flesh,' but in sacrificial contexts it can refer to edible meat.
