translation:
  language: ko
  text: 아론과 그의 아들들은 숫양의 고기[a]와 광주리에 있는 빵을 회막 입구에서 먹어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숫양의 살’. 히브리어는 문자적으로 ‘살’이지만, 제의 문맥에서는 먹는 고기를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָכַל
  english_pob_choice: shall eat
  chosen_korean: 먹어야 합니다
  alternatives_korean:
  - 먹습니다
  - 먹을 것입니다
  - 먹게 됩니다
  lexicon: HALOT
  rationale: 의례 지시문에서 히브리어 완료형의 명령·규범적 힘을 한국어의 의무 표현으로 옮기면, 단순 서술보다 원문의 처방성을 더 분명히 드러냅니다.
- source_word: וּ/בָנָי/ו
  english_pob_choice: and his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  - 아들들과 함께
  - 아들들
  lexicon: HALOT
  rationale: 문맥이 아론의 제사장적 남성 후손을 가리키므로, 성중립적 완화보다 직역성 있는 ‘아들들’이 원문 범위를 더 정확히 반영합니다.
- source_word: בְּשַׂר הָ/אַיִל
  english_pob_choice: the flesh of the ram
  chosen_korean: 숫양의 고기
  alternatives_korean:
  - 숫양의 살
  - 숫양의 육체
  - 숫양의 살코기
  lexicon: HALOT
  rationale: 히브리어 בשר는 문자적으로 ‘살/육체’이지만 제의적 식사 맥락에서는 먹는 부분을 가리키므로, 한국어에서는 의미를 분명히 하면서도 제의적 자연스러움이 있는 ‘고기’를 택했습니다.
- source_word: אֲשֶׁר בַּ/סָּל
  english_pob_choice: that is in the basket
  chosen_korean: 광주리에 있는
  alternatives_korean:
  - 광주리 안에 있는
  - 그 광주리에 있는
  - 광주리 속에 있는
  lexicon: HALOT
  rationale: 관계절의 핵심은 빵의 위치를 규정하는 것이므로, 한국어에서는 수식어로 압축해도 의미가 보존됩니다. ‘광주리’는 제의용 바구니의 자연스러운 표준어입니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  - 회중의 장막
  lexicon: HALOT
  rationale: 출애굽기 제의 문맥에서 אֹהֶל מוֹעֵד는 한국어 성서 전통에서 확립된 ‘회막’이 가장 직접적이고 오해가 적습니다.
theological_decisions:
- issue: 제의 지시문의 서술 형식
  chosen_reading: ‘먹어야 합니다’로 의무·규범성을 드러냈습니다.
  alternative_readings:
  - ‘먹습니다’로 단순 서술
  - ‘먹을 것입니다’로 미래형 처리
  rationale: 이 절은 제사장 위임 예식의 규정이므로, 한국어에서 의무 표현을 쓰면 본문의 규범적 힘을 유지하면서도 지나친 명령조를 피할 수 있습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 6
