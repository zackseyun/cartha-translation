revisions:
- from: 그것들을 그들의 손에서 가져다가 번제 위에, 곧 제단 위에서, 야훼 앞에서 향기로운 향으로 살라야 합니다. 그것은 야훼께 드리는 화제입니다.[a]
  to: 그들의 손에서 그것들을 받아 제단 위에 있는 번제물 위에서 태워 바쳐야 합니다. 이것은 야훼 앞에 기쁘게 받으실 향기이며, 야훼께 불로 드리는 제물입니다.[a]
  rationale: 제단과 번제물의 중첩 위치를 ‘제단 위에 있는 번제물 위에서’로 명확히 하였고, קטר의 제의적 행위를 ‘태워 바치다’로 표현했습니다. 고정 제의구는 현대 한국어에 맞게 ‘기쁘게 받으실 향기’로 옮겼으며, אִשֶּׁה의 전통 용어는 의미가 더 투명한 본문 번역의 각주 대안으로 보존했습니다.
  reviewer_model: gpt-5.6-terra
