source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ אֹתָ/ם֙ מִ/יָּדָ֔/ם וְ/הִקְטַרְתָּ֥ הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה לְ/רֵ֤יחַ נִיח֨וֹחַ֙ לִ/פְנֵ֣י יְהוָ֔ה אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
  footnotes:
  - marker: a
    text: Or, 'an offering by fire to the LORD' or 'a fire offering to the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 그들의 손에서 가져다가 번제 위에, 곧 제단 위에서, 야훼 앞에서 향기로운 향으로 살라야 합니다. 그것은 야훼께 드리는 화제입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불로 드리는 제물’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: Then you shall take
  chosen_korean: 가져다가
  alternatives_korean:
  - 가지고
  - 취하여
  lexicon: HALOT
  rationale: 제의 절차를 이어 주는 명령형 흐름을 살리되, 현대 한국어에서는 자연스러운 동작 동사인 ‘가져다가’로 이어지는 행위를 분명히 표현했습니다.
- source_word: מִיָּדָם
  english_pob_choice: from their hands
  chosen_korean: 그들의 손에서
  alternatives_korean:
  - 그 손에서
  - 그들의 손으로부터
  lexicon: HALOT
  rationale: 히브리어의 신체적·의례적 구체성을 그대로 살려 ‘손에서’로 옮겼습니다.
- source_word: וְהִקְטַרְתָּ
  english_pob_choice: burn
  chosen_korean: 살라야 합니다
  alternatives_korean:
  - 불살라야 합니다
  - 향으로 올려야 합니다
  - 연기로 올려야 합니다
  lexicon: HALOT
  rationale: 제의 문맥의 קטר는 단순 소각이 아니라 제단에서 연기 나게 하여 바치는 행위를 가리키므로, 의미를 분명히 하되 현대어로는 ‘살라야 합니다’가 가장 직접적입니다.
- source_word: הַמִּזְבֵּחָה / עַל הָעֹלָה
  english_pob_choice: on the altar, on top of the burnt offering
  chosen_korean: 번제 위에, 곧 제단 위에서
  alternatives_korean:
  - 제단 위에서, 번제 위에
  - 번제 위에 있는 제단에서
  lexicon: HALOT
  rationale: ‘위에’와 ‘제단 위에서’를 병기해 히브리어의 위치·중첩 관계를 드러냈습니다. 한국어에서는 ‘번제 위에’가 가장 자연스럽고, 뒤의 ‘곧 제단 위에서’는 그 장소를 다시 풀어 설명합니다.
- source_word: לְרֵיחַ נִיחוֹחַ
  english_pob_choice: as a pleasing aroma
  chosen_korean: 향기로운 향으로
  alternatives_korean:
  - 기쁘게 받으실 향기로
  - 만족스러운 향으로
  lexicon: HALOT
  rationale: 관용구의 핵심은 냄새 자체보다 하나님께 받아들여짐이므로, 직역에 치우치지 않으면서도 제의적 이미지를 살리는 표현을 택했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼 면전에서
  - 여호와 앞에서
  lexicon: HALOT
  rationale: 본문의 신명사형을 원문과 연결해 ‘야훼’로 옮겼고, ‘앞에서’는 לִפְנֵי의 존재 앞/면전 의미를 자연스럽게 반영합니다.
- source_word: אִשֶּׁה
  english_pob_choice: an offering made by fire
  chosen_korean: 화제
  alternatives_korean:
  - 불로 드리는 제물
  - 불사르는 제물
  lexicon: HALOT
  rationale: 제의 항목 용어로서 אִשֶּׁה의 전통적 대응어는 ‘화제’이며, 한국어 성경어휘로는 짧고 정확하게 제물의 성격을 드러냅니다.
theological_decisions:
- issue: 여호와/야훼 신명 처리
  chosen_reading: ‘야훼’로 일관해 신명 자체를 드러냈습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 원문이 יְהוָה를 직접 사용하므로, 관습적 대치어보다 신명 표기를 살리는 것이 본문 가시성과 감사 추적성에 유리합니다.
  doctrine_reference: 'POB contested terms: YHWH → Yahweh'
- issue: 화제(אִשֶּׁה)의 제의적 의미
  chosen_reading: 제단에서 불살라 드리는 제물을 가리키는 ‘화제’로 번역했습니다.
  alternative_readings:
  - ‘불로 드리는 제물’
  - ‘불사르는 제물’
  rationale: 이 용어는 단순한 ‘불’이 아니라 제의적으로 하나님께 드려지는 항목을 뜻하므로, 전통적이면서도 의미를 압축하는 ‘화제’가 가장 적절합니다.
  doctrine_reference: 사제적 제의 용어의 문맥 우선 원칙
