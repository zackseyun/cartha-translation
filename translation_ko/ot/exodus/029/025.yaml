  source_fidelity: 현 번역은 ‘그들의 손에서’와 야훼의 이름, 그리고 אִשֶּׁה의 불-제의 성격을 대체로 보존합니다. 그러나 ‘번제 위에, 곧 제단 위에서’는 번제물과 제단을 동격으로 처리하여 עַל הָעֹלָה와 הַמִּזְבֵּחָה의 공간 관계를 부정확하게 만듭니다. 히브리어는 제단 위에 놓인 번제물 위에서 태워 바치는 것을 가리킵니다.
  naturalness: ‘향기로운 향’은 동어 반복에 가깝고, ‘화제’는 현대 표준어 합쇼체 본문에서는 전문·고어적 인상이 강합니다. ‘기쁘게 받으실 향기’ 및 ‘불로 드리는 제물’이 제의 의미를 유지하면서 더 자연스럽고 이해하기 쉽습니다.
  terminology: יַהְוֶה는 방침에 따라 ‘야훼’로 유지합니다. אִשֶּׁה는 어원 및 정확한 범위에 논의가 있으므로 본문에서는 문맥상 안전한 ‘불로 드리는 제물’로 옮기고, 전통 용어 ‘화제’를 각주 대안으로 제시합니다.
