revisions:
- from: 그들에게 — 곧 아론과 그의 아들들에게 — 띠를 매고, 그들에게 두건을 씌우십시오. 제사장은 그들에게 영원한 규례로 주어질 것입니다. 이렇게 아론과 그의 아들들에게 임직하십시오.[a]
  to: 아론과 그의 아들들에게 띠를 매어 주고, 그들에게 모자를 씌우십시오. 제사장 직분은 영구한 규례로 그들에게 속할 것입니다. 이렇게 아론과 그의 아들들을 임직하십시오.[a]
  rationale: 원문의 כְּהֻנָּה를 ‘제사장 직분’으로 바로잡아 사람과 직분을 구별했습니다. לְחֻקַּת עוֹלָם은 법률·제의 문맥의 지속성을 반영하여 ‘영구한 규례로’로 옮겼습니다. 머리 복식은 ‘두건’ 대신 중립적인 ‘모자’로 조정했고, 문장 구조를 현대 한국어 합쇼체에 맞게 다듬었습니다. 마지막 설치 관용구는 본문에서 ‘임직하십시오’로 번역하고 각주에 직역을 보존했습니다.
  reviewer_model: gpt-5.6-terra
