base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
  footnotes:
  - marker: a
    text: Literally, 'fill the hand of Aaron and the hand of his sons,' a Hebrew idiom for installing or ordaining them into priestly service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 — 곧 아론과 그의 아들들에게 — 띠를 매고, 그들에게 두건을 씌우십시오. 제사장은 그들에게 영원한 규례로 주어질 것입니다. 이렇게 아론과 그의 아들들에게 임직하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아론의 손과 그의 아들들의 손을 채우다’로, 제사장 직무에 세우거나 임직한다는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָגַרְתָּ ... אַבְנֵט
  english_pob_choice: fasten sashes
  chosen_korean: 띠를 매고
  alternatives_korean:
  - 허리띠를 두르고
  - 띠를 둘러
  lexicon: HALOT
  rationale: חגר와 אַבְנֵט의 제의적 복장 착용을 한국어의 자연스러운 동작으로 옮기되, 제사장 복식이라는 점을 유지했습니다.
- source_word: אַהֲרֹן וּבָנָיו
  english_pob_choice: on Aaron and on his sons
  chosen_korean: — 곧 아론과 그의 아들들에게 —
  alternatives_korean:
  - 아론과 그의 아들들에게
  - 아론과 그의 아들들 위에
  lexicon: HALOT
  rationale: 대명사 ‘그들에게’가 가리키는 대상을 분명히 하기 위해 영어 POB의 반복을 반영해 삽입했습니다.
- source_word: וְחָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  english_pob_choice: bind caps on them
  chosen_korean: 그들에게 두건을 씌우십시오
  alternatives_korean:
  - 그들에게 모자를 씌우십시오
  - 그들에게 관을 씌우십시오
  lexicon: HALOT
  rationale: מִגְבָּעוֹת은 여기서 제사장들의 머리 덮개를 가리키므로, 현대 한국어에서 가장 중립적이고 자연스러운 ‘두건’으로 옮겼습니다.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  english_pob_choice: The priesthood shall belong to them
  chosen_korean: 제사장은 그들에게 주어질 것입니다
  alternatives_korean:
  - 제사장은 그들의 것이 될 것입니다
  - 제사직은 그들의 몫이 될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 소유/배정 관용구를 한국어의 ‘주어지다’로 풀어, 직분의 부여를 분명히 하면서도 소유 개념을 과도하게 확장하지 않도록 했습니다.
- source_word: וּמִלֵּאתָ יַֽד
  english_pob_choice: ordain
  chosen_korean: 임직하십시오
  alternatives_korean:
  - 직분에 세우십시오
  - 손을 채우십시오
  lexicon: HALOT
  rationale: ‘손을 채우다’라는 히브리어 관용구는 주석성은 있으나 본문에서는 제의적 설치 행위를 가리키므로, 현대 교회 용어 중 의미가 가장 가까운 ‘임직하다’로 옮겼습니다.
theological_decisions:
- issue: לְחֻקַּת עוֹלָם의 기간성
  chosen_reading: 영원한 규례
  alternative_readings:
  - 영속적인 규례
  - 세세한 규례
  rationale: 제의·언약 문맥에서 지속성을 강하게 표지하는 표현이므로, 한국어 성경에서 널리 이해되는 ‘영원한 규례’를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: וּמִלֵּאתָ יַֽד의 제의적 의미
  chosen_reading: 임직하십시오
  alternative_readings:
  - 설정하십시오
  - 제사장 직분에 세우십시오
  rationale: 이 표현은 단순 임명이 아니라 제사장 직무에 대한 공식적 설치를 뜻하므로, 교회 용어 중 독자가 즉시 이해할 수 있는 ‘임직’으로 처리했습니다.
  doctrine_reference: Translation philosophy §3, §5
