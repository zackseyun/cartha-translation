  source_fidelity: 수정이 필요합니다. כְּהֻנָּה는 ‘제사장’(사람)이 아니라 제사장 직분/제사직을 뜻합니다. 또한 לְחֻקַּת עוֹלָם은 이 문맥에서 해당 직분이 그들에게 지속적으로 귀속되는 규례임을 나타내므로, ‘영구한 규례로’가 원문의 법률·제의적 용법을 자연스럽게 반영합니다. 마지막 ‘임직하다’와 각주에 보존된 ‘손을 채우다’ 관용구는 원문의 의미를 적절히 전달합니다.
  naturalness: ‘그들에게 — 곧 아론과 그의 아들들에게 —’라는 삽입은 한국어 문장에서는 다소 무겁고, 첫 동작의 대상이 이미 명시될 수 있습니다. ‘아론과 그의 아들들에게 띠를 매어 주고’가 더 자연스럽습니다. מִגְבָּעוֹת은 일반적인 천 두건이라기보다 제사장 복식의 머리쓰개이므로, 현대어로는 ‘모자’가 중립적이고 이해하기 쉽습니다.
  terminology: ‘제사장은’은 원문의 כְּהֻנָּה에 대한 범주 오류이므로 ‘제사장 직분’으로 고쳐야 합니다. ‘임직하십시오’는 공식적인 제사장 직무 설치라는 관용적 의미를 전달하며 유지할 수 있습니다. ‘영구한 규례’는 ‘영원한 규례’보다 עוֹלָם의 법률·언약 문맥상 지속성을 과도한 형이상학적 주장 없이 표현합니다.
