  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 피와 기름에서 각각 일부를 취한다는 뜻을 ‘피와 관유를 조금’으로 다소 불분명하게 처리했고, אִתּוֹ(‘그와 함께’)의 수식 관계를 ‘그들과 함께 있는 그의 아들들의 옷’으로 옮겨 문법적·의미적으로 혼란스럽게 만들었습니다. 개정문은 아론과 함께 있는 그의 아들들 및 그들의 옷이라는 관계를 자연스럽게 드러냅니다.
  naturalness: ‘너는’과 ‘-해야 합니다’의 혼용은 합쇼체 지시문에서 다소 부자연스럽습니다. 주어를 생략하고 절차 지시를 일관되게 ‘-하십시오’로 표현했습니다. 또한 결과절을 병렬적으로 정리하여 한국어 문장 구조를 명료하게 했습니다.
  terminology: ‘관유’는 제의 문맥에서 통용되는 적절한 용어입니다. קדשׁ는 본문의 표현을 보존하여 ‘거룩하게 될 것입니다’로 옮기고, ‘성별될 것입니다’는 대안 번역으로 각주에 제시했습니다. 각주 표지는 관유가 아니라 קדשׁ의 번역어에 붙여야 합니다.
  issues:
  - severity: medium
    issue: ‘피와 관유[a]를 조금’이 각각의 일부를 취한다는 의미를 충분히 분명히 하지 못합니다.
    rationale: מִן은 ‘제단 위의 피 중 일부’에, 문맥상 ‘관유’에도 적용됩니다. ‘피 중 얼마와 관유 중 얼마’가 두 항목 각각의 일부라는 뜻을 명시합니다.
  - severity: high
    issue: ‘그들과 함께 있는 그의 아들들의 옷’은 אִתּוֹ의 지시 대상과 수식 관계를 왜곡하고 한국어로도 부자연스럽습니다.
    rationale: אִתּוֹ는 아론을 기준으로 그의 아들들과 그들의 옷이 ‘그와 함께’ 있음을 말합니다. ‘그와 함께 있는 그의 아들들과 그들의 옷’으로 옮기는 것이 문맥과 문법에 맞습니다.
  - severity: medium
    issue: 각주 표지가 ‘관유’에 붙어 있으나, 각주 내용은 וְקָדַשׁ(‘거룩하게 되다’)의 대안 번역을 설명합니다.
    rationale: 각주는 해당 어휘인 ‘거룩하게 될 것입니다’에 직접 연결되어야 독자가 대안 번역의 대상을 알 수 있습니다.
  - severity: low
    issue: ‘너는’과 ‘뿌려야 합니다’의 결합이 현대 합쇼체 절차 지시문에서 일관되지 않습니다.
    rationale: 주어를 생략하고 ‘뿌리십시오’로 번역하면 존대·지시 문체가 자연스럽고 일관됩니다.
  revised_text: 그런 다음 제단 위에 있는 피 중 얼마와 관유 중 얼마를 가져다가 아론과 그의 옷, 그리고 그와 함께 있는 그의 아들들과 그들의 옷에 뿌리십시오. 그러면 그와 그의 옷, 그리고 그와 함께 있는 그의 아들들과 그들의 옷은 거룩하게 될 것입니다[a].
