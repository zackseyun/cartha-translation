source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מִן הַ/דָּ֨ם אֲשֶׁ֥ר עַֽל הַ/מִּזְבֵּחַ֮ וּ/מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָה֒ וְ/הִזֵּיתָ֤ עַֽל אַהֲרֹן֙ וְ/עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וְ/קָדַ֥שׁ הוּא֙ וּ/בְגָדָ֔י/ו וּ/בָנָ֛י/ו וּ/בִגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
  footnotes:
  - marker: a
    text: Or 'shall be consecrated.' The Hebrew says literally 'shall be holy,' expressing the resulting sanctified status after the ritual action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 너는 제단 위에 있는 피와 관유[a]를 조금 가져다가 아론과 그의 옷과 그의 아들들과 그들과 함께 있는 그의 아들들의 옷에 뿌려야 합니다. 그러면 그는 그의 옷과 함께 거룩하게 되고, 그의 아들들과 그들과 함께 있는 그의 아들들의 옷도 거룩하게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 거룩하게 될 것입니다.’ 히브리어는 문자적으로 ‘거룩하다’라고 말하며, 의식 행위의 결과로 생긴 성별된 상태를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: you shall take
  chosen_korean: 가져다가
  alternatives_korean:
  - 취해야 합니다
  - 가져야 합니다
  lexicon: HALOT
  rationale: 의례 지시문에서 연속 동작을 자연스럽게 잇는 표현으로, ‘가져다가’가 제사 절차의 흐름을 가장 매끈하게 드러냅니다.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  english_pob_choice: some of the blood that is on the altar
  chosen_korean: 제단 위에 있는 피
  alternatives_korean:
  - 제단에 있는 피
  - 제단 위의 피 중 일부
  lexicon: HALOT
  rationale: מִן의 ‘일부’ 의미를 문맥상 ‘조금’과 다음 동사 ‘뿌려야 합니다’로 자연스럽게 살렸습니다.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  english_pob_choice: the anointing oil
  chosen_korean: 관유
  alternatives_korean:
  - 기름부음의 기름
  - 바름 기름
  lexicon: HALOT
  rationale: 제사 문맥의 관용적 표현을 살리되, 번역어가 너무 장황해지지 않도록 ‘관유’를 채택했습니다.
- source_word: וְהִזֵּיתָ
  english_pob_choice: sprinkle it
  chosen_korean: 뿌려야 합니다
  alternatives_korean:
  - 뿌리셔야 합니다
  - 뿌려야 하십니다
  lexicon: HALOT
  rationale: הִזָּה의 제의적 동작을 한국어 제사 문맥에 맞는 ‘뿌리다’로 옮겼고, 지시문체는 합쇼체로 정리했습니다.
- source_word: וְקָדַשׁ הוּא
  english_pob_choice: he shall be holy
  chosen_korean: 거룩하게 됩니다
  alternatives_korean:
  - 거룩합니다
  - 거룩하게 될 것입니다
  lexicon: HALOT
  rationale: 여기서는 상태의 परिणತಿ를 나타내므로, ‘거룩하게 됩니다’로 결과 상태를 드러내되 동사 קדשׁ의 핵심 의미를 보존했습니다.
theological_decisions:
- issue: קדשׁ의 결과 상태를 ‘holy’로 유지할지 ‘consecrate’로 풀지
  chosen_reading: 거룩하게 됩니다
  alternative_readings:
  - 성별됩니다
  - 봉헌됩니다
  rationale: 본문은 기름과 피를 뿌린 뒤 나타나는 결과를 ‘거룩’의 범주로 직접 말합니다. 제의적 의미를 살리되, 본문 자체의 어휘를 한국어로 투명하게 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 6
