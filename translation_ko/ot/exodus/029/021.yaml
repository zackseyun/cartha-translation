revisions:
- from: 그런 다음 너는 제단 위에 있는 피와 관유[a]를 조금 가져다가 아론과 그의 옷과 그의 아들들과 그들과 함께 있는 그의 아들들의 옷에 뿌려야 합니다. 그러면 그는 그의 옷과 함께 거룩하게 되고, 그의 아들들과 그들과 함께 있는 그의 아들들의 옷도 거룩하게 됩니다.
  to: 그런 다음 제단 위에 있는 피 중 얼마와 관유 중 얼마를 가져다가 아론과 그의 옷, 그리고 그와 함께 있는 그의 아들들과 그들의 옷에 뿌리십시오. 그러면 그와 그의 옷, 그리고 그와 함께 있는 그의 아들들과 그들의 옷은 거룩하게 될 것입니다[a].
  rationale: 피와 관유의 일부를 취하는 의미를 각각 명시하고, ‘그와 함께’라는 표현이 아론을 기준으로 그의 아들들과 그들의 옷에 연결되도록 바로잡았습니다. 또한 합쇼체 지시문을 일관되게 다듬었고, קדשׁ 관련 각주를 올바른 번역어에 연결했습니다.
  reviewer_model: gpt-5.6-terra
