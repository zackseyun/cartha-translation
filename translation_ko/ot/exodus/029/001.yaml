  source_fidelity: 핵심 제의 의미와 동물 수량은 대체로 충실합니다. 그러나 현행의 ‘그들에게 행하여’는 히브리어의 ‘그들을 위하여 네가 해야 할 일’이라는 구문을 자연스럽게 전달하지 못합니다. ‘성별하여 나를 섬기는 제사장으로 세우려고’는 לְקַדֵּשׁ אֹתָם לְכַהֵן לִי의 목적 관계와 제사장 직무를 보존합니다.
  naturalness: 현행 첫 문장은 ‘이것은 … 할 일입니다’의 서술 구조 안에서 ‘그들에게 행하여’가 부자연스럽고, 목적 표현이 중첩되어 읽기 어렵습니다. 수정문은 현대 표준어 합쇼체로 자연스럽게 지시를 도입합니다.
  terminology: ‘성별하다’는 이 제의·임직 문맥에서 קדשׁ의 ‘거룩하게 구별하다’를 간결하고 정확하게 나타냅니다. ‘나를 섬기는 제사장’은 לְכַהֵן לִי의 제사장 직무와 하나님을 향한 방향성을 유지합니다. ‘흠 없는’은 תְּמִימִם에 적절합니다.
