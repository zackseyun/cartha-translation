id: EXO.29.1
reference: Exodus 29:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֶ֨ה הַ/דָּבָ֜ר אֲשֶֽׁר תַּעֲשֶׂ֥ה לָ/הֶ֛ם לְ/קַדֵּ֥שׁ אֹתָ֖/ם לְ/כַהֵ֣ן לִ֑/י לְ֠קַח פַּ֣ר אֶחָ֧ד בֶּן בָּקָ֛ר וְ/אֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
  footnotes:
  - marker: a
    text: Or 'one young bull.' The Hebrew phrase literally reads 'one bull, a son of the herd/cattle,' an idiom for a bovine animal from the herd.
    reason: lexical_alternative
  - marker: b
    text: Or 'without defect.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 성별하여 나를 섬기는 제사장으로 세우려고 네가 그들을 위해 해야 할 일은 이것입니다. 수소 한 마리[a]와 흠 없는 숫양 두 마리[b]를 가져오십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘젊은 수소’. 히브리어 표현은 직역하면 ‘소 떼의 아들인 수소 한 마리’이며, 소 떼에서 난 수소를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘결점 없는’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר
  english_pob_choice: And this is the thing
  chosen_korean: 그리고 이것은
  alternatives_korean:
  - 이것이 바로 그 일입니다
  - 그리고 이것은 그 일입니다
  lexicon: WLC / HALOT
  rationale: דָּבָר는 여기서 절차를 가리키는 포괄적 표현이므로, 한국어에서는 장황한 ‘일’보다 간결한 지시문 ‘이것은’으로 옮겨 전체 문장의 명령적 흐름을 살렸습니다.
- source_word: לְקַדֵּשׁ אֹתָם
  english_pob_choice: to consecrate them
  chosen_korean: 그들을 거룩하게 하여
  alternatives_korean:
  - 그들을 성별하여
  - 그들을 거룩하게 하도록
  lexicon: HALOT
  rationale: קדשׁ는 제의적 맥락에서 ‘구별하여 성스럽게 하다’의 의미이므로, 자연스러운 현대 한국어로 ‘거룩하게 하다’가 가장 직접적입니다.
- source_word: לְכַהֵן לִי
  english_pob_choice: to serve as priests for me
  chosen_korean: 내게 제사장으로 섬기게
  alternatives_korean:
  - 내게 제사장으로 봉사하게
  - 내게 제사장 직무를 수행하게
  lexicon: HALOT
  rationale: כהן은 단순 봉사가 아니라 제사장 직무 수행을 뜻하므로 ‘제사장으로 섬기게’가 직무와 방향성(‘내게’)을 함께 살립니다.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  english_pob_choice: one bull from the herd
  chosen_korean: 수소 한 마리
  alternatives_korean:
  - 소 한 마리
  - 젊은 수소 한 마리
  lexicon: HALOT
  rationale: בֶּן־בָּקָר는 ‘무리에서 난 소/수소’라는 관용구이지만, 한국어에서는 제의 맥락의 희생동물로 자연스럽게 들리는 ‘수소’가 적절합니다.
- source_word: תְּמִימִם
  english_pob_choice: unblemished
  chosen_korean: 흠 없는
  alternatives_korean:
  - 결점 없는
  - 온전한
  lexicon: HALOT
  rationale: 제사 규정의 תמימים는 육체적 결함이 없는 상태를 뜻하므로, 제의적 표준어로 널리 이해되는 ‘흠 없는’이 가장 분명합니다.
theological_decisions:
- issue: 제사장 직무 표현
  chosen_reading: ‘제사장으로 섬기게’로 옮겨, 후대 교회 직분 용어보다 출애굽기의 성소-제의 문맥을 우선했습니다.
  alternative_readings:
  - ‘제사장으로 봉사하게’
  - ‘제사장 직무를 하게’
  rationale: 본문은 아론계 제사장 임직 절차를 말하므로, 교회 제도적 뉘앙스를 피하면서도 직무의 공적 성격을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source-text meaning without importing later ecclesiastical terminology.'
