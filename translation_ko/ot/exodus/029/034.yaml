base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
  footnotes:
  - marker: a
    text: Or 'the consecration offering.' The Hebrew term refers to the priestly installation rite.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 봉헌 예식의 고기나 빵 가운데서 아무것이라도 아침까지 남으면, 남은 것은 불에 태우십시오. 그것은 먹을 수 없습니다. 그것은 거룩하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘봉헌 예식’은 히브리어 הַמִּלֻּאִים의 문맥상 의미를 풀어 옮긴 것입니다. POB 영어본의 ‘ordination offering’처럼 제사장 설치 의례를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  english_pob_choice: is left
  chosen_korean: 남으면
  alternatives_korean:
  - 남아 있으면
  - 남게 되면
  lexicon: HALOT
  rationale: 남음의 상태를 자연스러운 현대 한국어 조건문으로 옮겨, 남겨진 잔여물이 있다는 뜻을 간결하게 살렸습니다.
- source_word: הַמִּלֻּאִים
  english_pob_choice: the ordination offering
  chosen_korean: 봉헌 예식
  alternatives_korean:
  - 안수 예식
  - 임직 제물
  - 봉헌 제물
  lexicon: HALOT
  rationale: 이 표현은 제사장 설치/봉헌 의례를 가리키므로, 문맥상 ‘예식’으로 풀어 의례적 의미를 드러냈습니다. ‘제물’보다 rite의 측면이 더 직접적입니다.
- source_word: וְשָׂרַפְתָּ אֶת הַנּוֹתָר בָּאֵשׁ
  english_pob_choice: then you shall burn what is left with fire
  chosen_korean: 남은 것은 불에 태우십시오
  alternatives_korean:
  - 남은 것을 불로 사르십시오
  - 남은 것을 불에 태우십시오
  lexicon: HALOT
  rationale: 히브리어의 명령적 결과를 한국어 명령문으로 자연스럽게 옮겼고, ‘불에 태우다’는 제의적 처분을 분명하게 전달합니다.
- source_word: לֹא יֵאָכֵל
  english_pob_choice: It shall not be eaten
  chosen_korean: 먹을 수 없습니다
  alternatives_korean:
  - 먹어서는 안 됩니다
  - 먹히지 않을 것입니다
  lexicon: HALOT
  rationale: 금지의 수동형을 현대 한국어에서는 규범적 금지 표현으로 옮기되, 법적·제의적 어조를 유지했습니다.
theological_decisions:
- issue: 남은 제의물의 처리와 거룩성의 관계
  chosen_reading: 먹을 수 없는 이유를 ‘거룩하기 때문입니다’로 직설적으로 제시했습니다.
  alternative_readings:
  - ‘성물입니다’
  - ‘거룩한 것이기 때문입니다’
  rationale: 히브리어의 결말인 קֹדֶשׁ הוּא를 설명적으로 약화하지 않고, 제의적 금지의 근거를 그대로 드러냈습니다. ‘거룩하다’는 단순 도덕성보다 구별된 제의적 성격을 가리킵니다.
  doctrine_reference: 레위기/출애굽기 제의 언어의 성별성(거룩성)
