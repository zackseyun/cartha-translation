source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֨ן סֹ֜לֶת בָּל֨וּל בְּ/שֶׁ֤מֶן כָּתִית֙ רֶ֣בַע הַ/הִ֔ין וְ/נֵ֕סֶךְ רְבִעִ֥ית הַ/הִ֖ין יָ֑יִן לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/040.yaml
  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'one-tenth of an ephah of fine flour.' The Hebrew uses 'a tenth' as a standard offering measure.
    reason: lexical_alternative
  - marker: b
    text: '''Beaten oil'' refers to oil produced from crushed or beaten olives; some translations render it ''pressed oil.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'for one lamb'; in context this likely refers to the first of the two daily lambs mentioned in the surrounding verses.
    reason: alternative_reading
translation:
  language: ko
  text: 또 고운 밀가루 에바 십분의 일에 찧어 낸 기름 한 힌의 사분의 일을 섞은 것과, 포도주 한 힌의 사분의 일을 전제물로 한 어린 양을 위하여 드리십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘십분의 일’이라고만 합니다. 제사 규정의 문맥에서는 보통 에바의 십분의 일을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘찧어 낸 기름’은 올리브를 두드리거나 으깨어 얻은 기름을 가리킵니다. ‘짜낸 기름’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 ‘한 어린 양’은 앞 절에서 언급한 두 마리 어린 양 가운데 첫째를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עִשָּׂרֹן
  english_pob_choice: a tenth
  chosen_korean: 십분의 일 에바에 해당하는 양
  alternatives_korean:
  - 십분의 일
  - 에바의 십분의 일
  lexicon: HALOT
  rationale: 사상(제물) 문맥에서는 עִשָּׂרוֹן이 통상 에바의 십분의 일을 뜻하므로, 의미를 분명히 하되 원문 수치를 유지하는 표현으로 옮겼습니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 밀가루
  alternatives_korean:
  - 고운 가루
  - 정선된 밀가루
  lexicon: HALOT
  rationale: 제사용 סֹלֶת은 곱게 빻은 곡분이므로, 현대 한국어에서 자연스럽고 명확한 ‘고운 밀가루’로 옮겼습니다.
- source_word: כָּתִית
  english_pob_choice: beaten
  chosen_korean: 기름 한 힌의 사분의 일과 섞은
  alternatives_korean:
  - 짜낸
  - 눌러 짠
  lexicon: HALOT
  rationale: כָּתִית은 으깨거나 두드려 낸 올리브에서 얻은 기름을 가리키므로, POB의 ‘beaten oil’ 취지를 살리되 한국어에서는 제사용 혼합 표현으로 자연스럽게 처리했습니다.
- source_word: וְ/נֵסֶךְ רְבִעִית הַ/הִין יָיִן
  english_pob_choice: and a drink offering of a quarter of a hin of wine
  chosen_korean: 그리고 포도주 한 힌의 사분의 일로 드리는 전제물
  alternatives_korean:
  - 그리고 포도주 한 힌의 사분의 일의 전제물
  - 그리고 포도주 한 힌의 사분의 일을 전제로 드리는 것
  lexicon: HALOT
  rationale: נֵסֶךְ은 제사와 함께 붓는 ‘전제물’이므로, ‘전제물’로 기술어를 유지해 제의적 성격을 분명히 했습니다.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  english_pob_choice: for the one lamb
  chosen_korean: 한 어린 양을 위한 것입니다
  alternatives_korean:
  - 그 한 어린 양을 위한 것입니다
  - 첫째 어린 양을 위한 것입니다
  lexicon: HALOT
  rationale: 문맥상 둘째가 아닌 앞의 한 마리 어린 양을 가리키지만, 본문 자체의 표현은 ‘한 어린 양’이므로 이를 살려 번역했습니다.
theological_decisions:
- issue: 제사용 용어의 직설성
  chosen_reading: ‘전제물’과 ‘어린 양’ 같은 제의적 용어를 그대로 유지해, 일상적 설명어로 완화하지 않았습니다.
  alternative_readings:
  - ‘붓는 제물’
  - ‘희생양’
  rationale: 본문은 성막 제사의 정해진 구성 요소를 기술하므로, 한국어에서도 제의적 구조를 드러내는 표현이 더 원문 충실합니다.
  doctrine_reference: 출 29장의 성막 봉헌 제사 규례
