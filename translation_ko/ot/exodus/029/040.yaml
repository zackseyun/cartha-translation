  naturalness: 초안의 ‘…섞은 것, 그리고 …전제물은 한 어린 양을 위한 것입니다’는 병렬 주어와 서술의 결속이 매끄럽지 않습니다. ‘…전제물을 한 어린 양을 위하여 드리십시오’로 옮기면 현대 한국어 합쇼체로 자연스럽고, 앞 절에서 이어지는 제사 규정의 문맥도 잘 반영합니다.
