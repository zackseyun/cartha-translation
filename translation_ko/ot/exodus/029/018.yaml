  text: וְ/הִקְטַרְתָּ֤ אֶת כָּל הָ/אַ֨יִל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֥ה ה֖וּא לַֽ/יהוָ֑ה רֵ֣יחַ נִיח֔וֹחַ אִשֶּׁ֥ה לַ/יהוָ֖ה הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
  footnotes:
  - marker: a
    text: Or 'a soothing aroma.' The Hebrew expression is a fixed sacrificial formula for an offering acceptable to the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'an offering by fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 숫양 전체를 제단 위에서 태우십시오. 이것은 야훼께 드리는 번제입니다. 이는 야훼께 드리는 향기로운 냄새[a]이며 불로 드리는 제물[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진정시키는 향기’. 이 히브리어 표현은 야훼께 받아들여지는 제물을 가리키는 고정된 제사 공식입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘화제’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  english_pob_choice: And you shall burn
  chosen_korean: 태우십시오
  alternatives_korean:
  - 불사르십시오
  - 연기나게 하십시오
  lexicon: HALOT
  rationale: 제사 문맥의 히필 קטר는 제물을 제단에서 연기로 올라가게 하는 행위이므로, 현대 한국어에서는 자연스럽고 직접적인 ‘태우십시오’가 가장 적절합니다.
- source_word: כָּל הָאַיִל
  english_pob_choice: the whole ram
  chosen_korean: 그 숫양 전체
  alternatives_korean:
  - 온 숫양
  - 숫양 전부
  lexicon: HALOT
  rationale: ‘כָּל’이 숫양의 일부가 아니라 전부를 가리키므로 ‘전체’로 분명히 살렸고, ‘אַיִל’은 숫양으로 구체화했습니다.
- source_word: הַמִּזְבֵּחָה
  english_pob_choice: on the altar
  chosen_korean: 제단 위에서
  alternatives_korean:
  - 제단에
  - 제단 위에
  lexicon: HALOT
  rationale: 방향 접미사가 붙은 제사 동사와 함께 실제로 제단 위에서 태우는 장면을 한국어로 자연스럽게 드러내기 위해 ‘제단 위에서’로 옮겼습니다.
- source_word: עֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 불로 드리는 제사
  lexicon: HALOT
  rationale: עֹלָה는 제사법에서 굳어진 ‘번제’가 가장 정확하고도 통용되는 표현입니다.
- source_word: רֵיחַ נִיחוֹחַ
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 냄새
  alternatives_korean:
  - 기뻐하시는 향기
  - 받으실 만한 향기
  lexicon: HALOT
  rationale: 이 고정 제사 공식은 하나님이 받아들이시는 제사의 향을 뜻하므로, ‘향기로운 냄새’로 살리되 오해를 줄이기 위해 전체 문맥에서 번제와 연결했습니다.
- source_word: אִשֶּׁה
  english_pob_choice: a food offering
  chosen_korean: 불로 드리는 제물
  alternatives_korean:
  - 화제
  - 불제물
  lexicon: HALOT
  rationale: 직역적 ‘불로 드리는 제물’은 제물의 성격과 불로 드려짐을 함께 드러내며, 한국어 독자에게 ‘food offering’보다 오해가 적습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
