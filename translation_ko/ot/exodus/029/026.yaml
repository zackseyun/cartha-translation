id: EXO.29.26
reference: Exodus 29:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ אֶת הֶֽ/חָזֶ֗ה מֵ/אֵ֤יל הַ/מִּלֻּאִים֙ אֲשֶׁ֣ר לְ/אַהֲרֹ֔ן וְ/הֵנַפְתָּ֥ אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֥ה לְ/ךָ֖ לְ/מָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
  footnotes:
  - marker: a
    text: Or 'the ram of consecration.' The Hebrew technical term refers to the ram used in the priestly installation rite.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 너는 아론을 위한 임직 숫양[a]의 가슴 부위를 가져다가, 야훼 앞에서 그것을 흔들어 요제로 바쳐야 합니다. 그것은 네 몫이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성별의 숫양’. 히브리어 기술 용어는 제사장 직분에 세우는 의식에 사용되는 숫양을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָזֶה
  english_pob_choice: the breast
  chosen_korean: 가슴
  alternatives_korean:
  - 가슴살
  - 흉부
  lexicon: HALOT
  rationale: 제사 규정의 희생 제물 분배 문맥에서 חָזֶה는 동물의 가슴 부분을 가리키므로, 자연스럽고 정확한 ‘가슴’으로 옮겼습니다.
- source_word: אֵיל הַמִּלֻּאִים
  english_pob_choice: the ram of ordination
  chosen_korean: 안수의 숫양
  alternatives_korean:
  - 임직의 숫양
  - 봉헌의 숫양
  - 성별의 숫양
  lexicon: HALOT
  rationale: הַמִּלֻּאִים는 아론의 제사장 직분 설치를 가리키는 기술적 표현이므로, 문맥을 살려 ‘안수의 숫양’으로 옮기고 각주로 대체 번역 가능성을 보완했습니다.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  english_pob_choice: you shall wave it as a wave offering
  chosen_korean: 그것을 흔들어 요제로 드려야 합니다
  alternatives_korean:
  - 그것을 흔들어 흔듦의 제물로 드려야 합니다
  - 그것을 흔들어 흔들어 드리는 제물로 드려야 합니다
  lexicon: HALOT
  rationale: תְּנוּפָה는 제의적 ‘흔듦’이라는 고정된 표현이므로 동작과 제물의 성격을 함께 드러내는 ‘흔들어 요제로’로 옮겼습니다.
- source_word: וְהָיָה לְךָ לְמָנָה
  english_pob_choice: and it shall be your portion
  chosen_korean: 당신의 몫이 될 것입니다
  alternatives_korean:
  - 당신의 분깃이 될 것입니다
  - 당신에게 할당된 몫이 될 것입니다
  lexicon: HALOT
  rationale: מָנָה는 배당된 몫, 분깃을 뜻하므로 제의적 분배의 뉘앙스를 자연스럽게 살린 ‘몫’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 신명기적 이름을 직접 사용하므로, 본문에서는 제목이나 대체어보다 고유명사 ‘야훼’를 유지해 이름의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 제사장 직분 설치를 뜻하는 הַמִּלֻּאִים의 이해
  chosen_reading: 안수의 숫양
  alternative_readings:
  - 임직의 숫양
  - 봉헌의 숫양
  rationale: 이 절은 아론의 제사장 임직 의식을 전제하므로, 교회 제도 용어를 덧씌우지 않고 구약 제의 절차를 드러내는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy §5: consistency of key terms, or documented exception'
