reference: Exodus 29:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים יִלְבָּשָׁ֧/ם הַ/כֹּהֵ֛ן תַּחְתָּ֖י/ו מִ/בָּנָ֑י/ו אֲשֶׁ֥ר יָבֹ֛א אֶל אֹ֥הֶל מוֹעֵ֖ד לְ/שָׁרֵ֥ת בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
  footnotes:
  - marker: a
    text: Or 'shall wear them.' The Hebrew verb can mean either 'put on' or 'wear' depending on context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the priest under him from among his sons,' that is, the priest who succeeds him.
    reason: lexical_alternative
  - marker: c
    text: Or 'in the sanctuary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아들들 가운데서 그의 뒤를 이을 제사장은[a] 회막에 들어가 성소에서[b] 섬길 때 이 옷들을 칠 일 동안 입어야 합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 아들들 가운데서 그의 아래에 있는 제사장’입니다. 여기서는 그의 직분을 이어받는 제사장을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 곳에서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘착용하고 있어야 합니다’. 히브리어 동사는 문맥에 따라 ‘입다’ 또는 ‘착용하고 있다’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: For seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 칠 일
  lexicon: HALOT
  rationale: 지속 기간의 의미를 한국어에서 자연스럽게 드러내기 위해 ‘동안’을 보태되, 수량 표현은 원문의 칠 일에 맞춰 유지했습니다.
- source_word: יִלְבָּשָׁם
  english_pob_choice: shall put them on
  chosen_korean: 입어야 합니다
  alternatives_korean:
  - 입게 됩니다
  - 둘러야 합니다
  lexicon: HALOT
  rationale: 제사장 옷을 실제로 착용하는 동작을 간결하게 살리기 위해 ‘입다’를 택했고, 의무/규범적 뉘앙스는 ‘-어야 합니다’로 옮겼습니다.
- source_word: הַכֹּהֵן תַּחְתָּיו מִבָּנָיו
  english_pob_choice: the priest from among his sons who succeeds him
  chosen_korean: 자기 아들들 가운데 자기 뒤를 이을 제사장
  alternatives_korean:
  - 그의 자손 가운데 그 자리를 잇는 제사장
  - 아들들 중 그를 대신할 제사장
  lexicon: HALOT
  rationale: ‘תחתיו’의 자리/직분 계승 의미를 ‘자기 뒤를 이을’로 풀어, 단순한 공간적 ‘대신’보다 계승적 의미가 드러나게 했습니다.
- source_word: בַּקֹּדֶשׁ
  english_pob_choice: in the holy place
  chosen_korean: 거룩한 곳에서
  alternatives_korean:
  - 성소에서
  - 거룩한 곳 안에서
  lexicon: HALOT
  rationale: 성막 봉사 맥락의 קדש을 구체적 공간으로 유지하면서, 한국어에서는 ‘거룩한 곳’이 지나친 교단 용어화 없이 본문성을 살린다고 보았습니다.
theological_decisions:
- issue: 제사장 직분의 세습적 계승 표현
  chosen_reading: 자기 아들들 가운데 자기 뒤를 이을 제사장
  alternative_readings:
  - 그의 아들들 중 그 자리를 잇는 제사장
  - 아들들 가운데 대신하는 제사장
  rationale: 본문은 아론 가문의 제사장 계승을 말하므로, 후임이 혈연 계열에서 이어진다는 점을 분명히 하되 후대 제도 용어를 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: בַּקֹּדֶשׁ의 공간성
  chosen_reading: 거룩한 곳에서
  alternative_readings:
  - 성소에서
  - 거룩한 성소에서
  rationale: 예배 공간의 실제성을 유지하는 것이 중요하므로, 추상화된 ‘거룩함’보다 성막의 봉사 장소를 가리키는 공간 표현으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §6
