  - ‘세우는’
  rationale: 이 표현은 성직 일반의 후대적 뉘앙스보다 제사장 임직이라는 제의적 이미지를 직접 전달하므로, 원문 투명성을 위해 보존했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological tension rather than over-resolve.'
