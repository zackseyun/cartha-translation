  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
  footnotes:
  - marker: a
    text: Hebrew 'filling their hand,' a priestly idiom meaning 'ordaining them' or 'installing them' into office.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론에게 속한 거룩한 옷은 그 뒤에 그의 아들들에게 속할 것이며, 그들을 그 옷들로 기름부어 세우고, 그들의 손을 채우는 데 쓸 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 손을 채우다’는 제사장 직분에 세우는 것을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  english_pob_choice: the holy garments
  chosen_korean: 거룩한 옷
  alternatives_korean:
  - 성스러운 옷
  - 거룩한 의복
  lexicon: HALOT
  rationale: בגד은 일반적으로 ‘옷/의복’이며, הקֹּדשׁ는 제사적 구별을 나타내므로 ‘거룩한 옷’이 자연스럽고도 의미를 보존합니다.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  english_pob_choice: shall belong to his sons after him
  chosen_korean: 그 뒤에 그의 아들들에게 속할 것이며
  alternatives_korean:
  - 그 뒤에 그의 아들들을 위한 것이며
  - 그 뒤에 그의 아들들에게 돌아갈 것이며
  lexicon: HALOT
  rationale: לְ는 소유·귀속을 나타내므로, 제사장 직분의 계승 맥락을 살려 ‘속하다’로 옮겼습니다.
- source_word: לְמָשְׁחָה בָהֶם
  english_pob_choice: for anointing in them
  chosen_korean: 그들을 그 옷들로 기름부어 세우고
  alternatives_korean:
  - 그 옷들 안에서 기름부음으로
  - 그 옷들로 그들을 기름부음하여
  lexicon: HALOT
  rationale: בָהֶם은 옷을 입은 상태에서의 기름부음을 가리키므로, 한국어에서는 그 기능을 분명히 드러내되 과도한 직역을 피했습니다.
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  english_pob_choice: for filling their hand in them
  chosen_korean: 그들의 손을 채우는 데 쓸 것입니다
  alternatives_korean:
  - 그들의 손을 채우는 데
  - 그들을 안수해 세우는 데
  lexicon: HALOT
  rationale: ‘손을 채우다’는 제사장 임직의 관용구이므로, 본문의 비유를 살리기 위해 직역형 표현을 유지했습니다.
theological_decisions:
- issue: 제사장 임직 관용구 מלא יד의 처리
  chosen_reading: ‘그들의 손을 채우는’ 이미지를 본문에 유지했습니다.
  alternative_readings:
