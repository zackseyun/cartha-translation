  naturalness: ‘아론에게 속한 거룩한 옷’, ‘그 뒤에 그의 아들들에게 속할 것이며’는 이해 가능하지만 다소 번역투입니다. 두 절의 목적을 ‘그들이 그 옷을 입은 채로 … 받도록’으로 풀면 현대 표준어 합쇼체에서 자연스럽고 원문의 관계도 명료해집니다.
  terminology: ‘거룩한 옷’은 적절합니다. מלא יד는 제사장 임직의 전문 관용구이므로 본문에서는 ‘제사장으로 임직하다’로 자연스럽게 옮기고, 각주에서 히브리어의 문자적 표현을 밝혀 두는 것이 적절합니다.
