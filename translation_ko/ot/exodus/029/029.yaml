translation:
  language: ko
  text: 아론의 거룩한 옷은 그 후에 그의 아들들에게 돌아갈 것입니다. 그들이 그 옷을 입은 채로 기름부음을 받고 제사장으로 임직하게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들의 손을 채우다’는 제사장 직분에 임직시키거나 세우는 것을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  english_pob_choice: the holy garments
  chosen_korean: 거룩한 옷
  alternatives_korean:
  - 성스러운 옷
  - 거룩한 의복
  lexicon: HALOT
  rationale: בגד은 일반적으로 ‘옷/의복’이며, הקֹּדשׁ는 제사적 구별을 나타내므로 ‘거룩한 옷’이 자연스럽고도 의미를 보존합니다.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  english_pob_choice: shall belong to his sons after him
  chosen_korean: 그 뒤에 그의 아들들에게 속할 것이며
  alternatives_korean:
