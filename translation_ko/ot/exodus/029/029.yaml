  lexicon: HALOT
  rationale: בָהֶם은 옷을 입은 상태에서의 기름부음을 가리키므로, 한국어에서는 그 기능을 분명히 드러내되 과도한 직역을 피했습니다.
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  english_pob_choice: for filling their hand in them
  chosen_korean: 그들의 손을 채우는 데 쓸 것입니다
  alternatives_korean:
  - 그들의 손을 채우는 데
  - 그들을 안수해 세우는 데
  lexicon: HALOT
  rationale: ‘손을 채우다’는 제사장 임직의 관용구이므로, 본문의 비유를 살리기 위해 직역형 표현을 유지했습니다.
theological_decisions:
- issue: 제사장 임직 관용구 מלא יד의 처리
