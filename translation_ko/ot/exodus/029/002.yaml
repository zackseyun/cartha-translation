  yaml_path: translation/ot/exodus/029/002.yaml
  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
  footnotes:
  - marker: a
    text: Or 'unleavened loaves' for 'unleavened cakes' (חַלֹּת); the Hebrew term can denote a loaf-shaped bread item.
    reason: lexical_alternative
  - marker: b
    text: Or 'spread with oil' for 'anointed with oil'; the verb is the usual word for anointing, but here it describes preparation of the wafers.
    reason: lexical_alternative
translation:
  language: ko
  text: 무교병과, 기름에 섞은 무교병 과자들과, 기름을 발라 만든 무교병 전병들을 만들되, 그것들을 고운 밀가루로 만들어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무교병 과자들’은 히브리어 חַלּוֹת의 가능한 형식적 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기름을 발라 만든’은 여기서의 동사가 통상적인 ‘기름 부음’과 연결되지만, 실제로는 반죽/구움 준비를 가리키는 표현입니다.
    reason: lexical_alternative
