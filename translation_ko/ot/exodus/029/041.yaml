base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''between the evenings,'' an idiom for the late afternoon or twilight period.'
    reason: lexical_alternative
  - marker: b
    text: Or 'an offering by fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 둘째 어린 양을 해 질 무렵에 드리십시오[a]. 아침 번제와 같이 그 소제와 그 전제도 그를 위해 드리십시오. 이는 야훼께 드리는 향기로운 냄새이며, 불로 드리는 제물입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘저녁들 사이’라는 관용구로, 늦은 오후 또는 황혼 무렵을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불로 드리는 제물’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  english_pob_choice: the second lamb
  chosen_korean: 둘째 어린 양
  alternatives_korean:
  - 둘째 양
  - 두 번째 어린 양
  lexicon: HALOT
  rationale: כֶּבֶשׂ는 제의 문맥에서 어린 양으로 옮기는 것이 자연스럽고, הַשֵּׁנִי의 순차성은 ‘둘째’로 간결하게 드러냅니다.
- source_word: בֵּין הָעַרְבָּיִם
  english_pob_choice: at twilight
  chosen_korean: 해 질 무렵
  alternatives_korean:
  - 황혼에
  - 저녁 무렵에
  - 해질녘에
  lexicon: HALOT
  rationale: 직역하면 ‘저녁들 사이’이지만, 관용구가 가리키는 늦은 오후~황혼의 시간을 한국어로 자연스럽게 전달했습니다.
- source_word: מִנְחָה / נֶסֶךְ
  english_pob_choice: grain offering / drink offering
  chosen_korean: 소제 / 전제
  alternatives_korean:
  - 곡식 제물 / 포도주 제물
  - 곡식제 / 붓는 제물
  lexicon: HALOT
  rationale: 제의 용어로서 מִנְחָה와 נֶסֶךְ의 대응을 살리되, 본문 구조를 따라 기존 한국어 제의 어휘인 ‘소제’와 ‘전제’를 사용했습니다.
- source_word: לְרֵיחַ נִיחֹחַ
  english_pob_choice: as a pleasing aroma
  chosen_korean: 향기로운 냄새
  alternatives_korean:
  - 기쁘게 받으실 향기
  - 기분 좋은 향기
  lexicon: HALOT
  rationale: 정형화된 희생 제사 수식을 한국어로 자연스럽게 옮기면서, 하나님께 받으실 만한 제사의 수용성을 유지했습니다.
- source_word: אִשֶּׁה
  english_pob_choice: a food offering
  chosen_korean: 불로 드리는 제물
  alternatives_korean:
  - 불제사
  - 화제
  lexicon: HALOT
  rationale: 이 항목은 ‘불로 드리는 제물’이라는 문자적 의미를 드러내며, 번역 전통어 ‘화제’보다 현대 독자가 이해하기 쉽습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: 프로젝트 기본 용례
  rationale: 프로젝트 기본값에 따라 신명 YHWH는 ‘야훼’로 옮겼고, 여격은 ‘-께’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 희생 제물 공식의 수식어 처리
  chosen_reading: ‘향기로운 냄새’와 ‘불로 드리는 제물’을 모두 살려, 제사가 야훼께 기쁘게 받아들여지는 행위임을 드러냈습니다.
  alternative_readings:
  - ‘기쁜 향기’만 두는 번역
  - ‘화제’로만 처리하는 번역
  rationale: 본문은 고정된 제의 공식과 제물의 성격을 함께 제시하므로, 두 요소를 모두 보존하는 것이 의미를 가장 잘 드러냅니다.
  doctrine_reference: 레위기 제사 언어 및 제의 공식의 보존 원칙
