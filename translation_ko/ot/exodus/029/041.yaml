translation:
  language: ko
  text: 둘째 어린 양을 해 질 무렵에 드리십시오[a]. 아침의 소제와 그 전제에 따라 그것을 드리십시오. 이는 야훼께 드리는 향기로운 냄새가 되게 하는 불로 드리는 제물입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘저녁들 사이’라는 관용구로, 늦은 오후 또는 황혼 무렵을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘화제’.
    reason: lexical_alternative
