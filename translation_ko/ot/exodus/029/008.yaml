  naturalness: ‘그의 아들들을 가까이 데려오셔서 그들에게 긴 옷을 입히십시오’는 현대 표준어 합쇼체로 자연스럽고, 지시 대상과 동작의 순서도 분명합니다.
  terminology: ‘긴 옷’은 כֻּתֳּנֹת의 정확한 형태와 길이에 관한 과도한 단정을 피하면서, 현대어 ‘속옷’이 불러오는 내의의 의미를 피합니다. ‘가까이 데려오다’는 제의적 제시의 성격을 보존합니다.
