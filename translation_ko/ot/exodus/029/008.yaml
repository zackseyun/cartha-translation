translation:
  language: ko
  text: 그리고 그의 아들들을 가까이 데려오셔서 그들에게 긴 옷을 입히십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아들들을 앞으로 데려오십시오.’ 히브리어 동사는 예식을 위해 사람을 가까이 데려와 제시한다는 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת / תַּקְרִיב
  english_pob_choice: And you shall bring near
  chosen_korean: 그리고 … 데려와
  alternatives_korean:
  - 그리고 … 앞으로 데려오십시오
  - 그리고 … 제시하십시오
  lexicon: HALOT
  rationale: 제사장 위임 문맥에서 קרב의 핵심은 단순 이동보다 예식적으로 ‘가까이 데려와/나아오게 하다’는 뜻이므로, 한국어에서는 자연스럽게 ‘데려와’로 옮겨 그 의례적 행위를 드러냈습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들을
  alternatives_korean:
  - 그의 자녀들을
  lexicon: HALOT
  rationale: 히브리어 בָּנִים은 남자 자녀를 가리키므로, 성별을 지우는 ‘자녀들’보다 ‘아들들’이 원문의 범위를 더 정확히 보존합니다.
- source_word: וְהִלְבַּשְׁתָּם
  english_pob_choice: and clothe them
  chosen_korean: 그들에게 … 입히십시오
  alternatives_korean:
  - 그들을 옷 입히십시오
  - 그들에게 입혀 주십시오
  lexicon: HALOT
  rationale: 입히는 행위는 단순 착의가 아니라 제의적 수여/위임의 동작이므로, 공손한 명령형으로 ‘입히십시오’를 택해 본문의 의례성을 유지했습니다.
- source_word: כֻּתֳּנֹת
  english_pob_choice: tunics
  chosen_korean: 속옷
  alternatives_korean:
  - 튠닉
  - 긴옷
  - 겉옷
  lexicon: HALOT
  rationale: כֻּתֳּנֹת는 몸에 밀착하는 기본 의복으로, 한국어 성경 전통의 ‘속옷’이 제사장 복장의 기능을 가장 간결하게 전달합니다. 다만 현대어의 의미 폭을 고려해 ‘튠닉’은 피했습니다.
theological_decisions:
- issue: 제사장 위임의 예식적 동작을 어떻게 드러낼지
  chosen_reading: ‘데려와 … 입히십시오’로 번역해, 단순한 이동과 착의가 아니라 예식적 인도와 부여의 행위임을 살렸습니다.
  alternative_readings:
  - ‘앞으로 데려오십시오’
  - ‘제시하십시오’
  rationale: 이 절은 아론의 아들들을 제사 직무에 공식적으로 세우는 맥락이므로, 동작의 의례적 성격을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 출애굽기 29장 제사장 위임 문맥
