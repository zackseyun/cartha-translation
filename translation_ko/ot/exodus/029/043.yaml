  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel,' a standard covenantal expression for the people of Israel.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'and it will be made holy by my glory.' The subject of 'it' is implicit and may refer generally to the sanctuary area in view, more specifically to the tent of meeting or the altar.
    reason: alternative_reading
translation:
  language: ko
  text: 거기서 내가 이스라엘의 아들들과 만나고, 그것은 내 영광으로 거룩하게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’이라고 말합니다. 이는 이스라엘 백성을 가리키는 표준 언약적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내 영광으로 거룩하게 될 것이다’라고 말합니다. 여기서 ‘그것’의 주어는 암시되어 있으며, 문맥상 성막 영역, 더 구체적으로는 회막이나 제단을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  english_pob_choice: I will meet with
  chosen_korean: 내가 … 만나고
  alternatives_korean:
  - 내가 … 만나며
  - 내가 … 임하고
  lexicon: HALOT
  rationale: 성막 맥락에서 יעד의 수동적·예정된 만남의 뜻을 살리되, 한국어에서는 자연스럽게 ‘만나다’로 옮기는 것이 가장 직접적입니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 관용구를 최대한 투명하게 보존해, POB의 성별-정확 원칙을 반영했습니다.
- source_word: וְנִקְדַּשׁ
  english_pob_choice: it will be made holy
  chosen_korean: 거룩하게 될 것입니다
  alternatives_korean:
  - 성별될 것입니다
  - 거룩하게 되겠습니다
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 살리면서도, 한국어에서 가장 자연스럽고 문맥에 맞는 ‘거룩하게 되다’로 옮겼습니다.
- source_word: בִּכְבֹדִי
  english_pob_choice: by my glory
  chosen_korean: 내 영광으로
  alternatives_korean:
  - 내 영광에 의해
  - 내 영광에 의하여
  lexicon: HALOT
  rationale: כבוד는 하나님의 현현적 영광을 가리키므로, 한국어에서는 도구/매개 의미를 담는 ‘-으로’가 가장 간결합니다.
theological_decisions:
- issue: ‘it will be made holy’의 암시적 주어
  chosen_reading: 주어를 특정하지 않고 ‘그것은 … 거룩하게 될 것입니다’로 유지했습니다.
  alternative_readings:
  - ‘그 성막은 … 거룩하게 될 것입니다’
  - ‘그 제단은 … 거룩하게 될 것입니다’
  - ‘그는 … 거룩하게 될 것입니다’
  rationale: 히브리어는 3인칭 단수 수동형으로 주어를 명시하지 않으며, 문맥상 성막 영역 전체를 가리킬 수 있어 해석을 단정하지 않는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §5; ambiguity preserved rather than resolved
- issue: ‘이스라엘의 아들들’의 직역 보존
  chosen_reading: 관용적 완화 대신 ‘이스라엘의 아들들’을 본문에 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 이 표현은 언약 공동체를 가리키는 표준 히브리어 표현이므로, 본문에서는 직역을 살리고 의미 이해를 돕는 대안을 번역 선택지로 남깁니다.
  doctrine_reference: Translation philosophy §4; gender-accurate over gender-neutral
