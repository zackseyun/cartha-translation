  rationale: 절차적 명령문을 자연스러운 합쇼체로 통일하고, 의복의 명칭을 서로 구별하였습니다. אָפַד의 불확정성은 본문에서 과도하게 해석하지 않고 ‘매십시오’와 각주로 보존했으며, 목적어를 ‘에봇’으로 명시하여 지시 대상의 모호함을 제거했습니다. חֵשֶׁב의 제작상 뉘앙스는 ‘정교하게 짠 띠’에 반영했습니다.
