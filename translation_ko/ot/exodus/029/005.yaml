review_pass:
  verdict: revise
  source_fidelity: 초안은 의복의 열거와 에봇의 띠로 고정하는 절차를 대체로 반영합니다. 그러나 희귀 동사 אָפַד의 불확정성을 ‘능숙하게’라는 방식 부사로 단정하고, 그 목적어를 선행하는 ‘가슴받이’로도 읽힐 수 있는 ‘그것’으로 처리하여 본문의 문맥상 에봇을 고정한다는 뜻을 흐립니다.
  naturalness: ‘너는 … 해야 합니다’는 현대 합쇼체의 절차 지시문으로 어색하게 혼합되어 있습니다. 주어를 생략하고 ‘입히십시오/매십시오’로 통일하는 편이 자연스럽습니다. 또한 ‘속옷’은 현대어에서 내의의 뜻이 강할 수 있으므로, 의례 복식의 기본 옷이라는 의미를 보존하는 ‘긴 옷’이 안전합니다.
  terminology: 에봇은 기술 용어이므로 음역을 유지하는 것이 적절합니다. מְעִיל הָאֵפֹד는 에봇과 관련된 겉옷으로, ‘에봇의 겉옷’으로 옮길 수 있습니다. חֹשֶׁן은 방어구를 뜻하는 ‘흉패’보다 ‘가슴받이’가 적절합니다. חֵשֶׁב는 단순한 ‘짠’보다 제작상의 정교함을 포함할 수 있으므로 ‘정교하게 짠 띠’로 옮기되, אָפַד의 의미는 각주에서 대안을 보존합니다.
  issues:
  - severity: medium
    issue: ‘능숙하게’가 אָפַד를 수식하도록 번역됨
    rationale: אָפַד는 드문 동사로 ‘매다/띠를 두르다/고정하다’ 정도가 안전합니다. ‘능숙하게’는 히브리어 본문에서 직접 표지되지 않으며, 정교한 제작의 뉘앙스는 뒤따르는 חֵשֶׁב에 연결하는 편이 더 적절합니다.
  - severity: medium
    issue: ‘그것’의 지시 대상이 불명확함
    rationale: 바로 앞에 ‘가슴받이’가 있어 ‘그것’이 가슴받이를 가리키는 것으로 읽힐 수 있습니다. 문맥상 고정되는 것은 에봇이므로 명사를 반복해야 합니다.
  - severity: medium
    issue: 합쇼체와 ‘너는’ 및 ‘해야 합니다’의 혼합
    rationale: 현대 정중한 성서 문체에서는 주어를 생략하고 명령형 종결을 통일하는 것이 자연스럽습니다.
  - severity: low
    issue: ‘속옷’의 현대적 의미가 지나치게 좁음
    rationale: כֻּתֹּנֶת는 기본이 되는 긴 의복을 가리키며, 현대 한국어 ‘속옷’은 내의를 연상시킬 수 있습니다.
