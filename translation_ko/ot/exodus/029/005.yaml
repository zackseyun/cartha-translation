  edition: WLC
  text: וְ/לָקַחְתָּ֣ אֶת הַ/בְּגָדִ֗ים וְ/הִלְבַּשְׁתָּ֤ אֶֽת אַהֲרֹן֙ אֶת הַ/כֻּתֹּ֔נֶת וְ/אֵת֙ מְעִ֣יל הָ/אֵפֹ֔ד וְ/אֶת הָ/אֵפֹ֖ד וְ/אֶת הַ/חֹ֑שֶׁן וְ/אָפַדְתָּ֣ ל֔/וֹ בְּ/חֵ֖שֶׁב הָ/אֵפֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
  footnotes:
  - marker: a
    text: Or 'and gird him with it by the woven band of the ephod.' The Hebrew verb is rare and may emphasize fastening or girding the ephod onto Aaron.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'breastplate'; the Hebrew more broadly denotes a chest piece, so 'breastpiece' is used here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 옷들을 가져다가 아론에게 긴 옷과 에봇의 겉옷과 에봇과 가슴받이를 입히십시오. 그리고 에봇의 정교하게 짠 띠로 에봇을 그에게 매십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 드문 동사는 ‘매다’ 또는 ‘띠를 둘러 고정하다’로도 옮길 수 있습니다. 목적어는 문맥상 에봇입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּגָדִים
  english_pob_choice: the garments
  chosen_korean: 옷들
  alternatives_korean:
  - 의복들
  - 옷
  lexicon: HALOT
  rationale: 제사장 의복 전체를 가리키는 일반명사로서 자연스러운 현대 한국어를 택했습니다. 단수 ‘옷’보다 복수의 물건 묶음을 드러내기 위해 ‘옷들’로 옮겼습니다.
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  english_pob_choice: and clothe Aaron
  chosen_korean: 아론에게 ... 입히고
  alternatives_korean:
  - 아론을 입히고
  - 아론에게 옷을 입히고
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살려 ‘입히다’로 옮기되, 한국어에서 자연스러운 목적격 구성인 ‘아론에게’로 표현했습니다.
- source_word: הַכֻּתֹּנֶת
  english_pob_choice: the tunic
  chosen_korean: 속옷
  alternatives_korean:
  - 튠니크
  - 긴 셔츠
  lexicon: HALOT
  rationale: 제사장 복식의 기초 의복이라는 기능을 드러내기 위해 ‘속옷’을 택했습니다. 전통적 교회용어보다 본문의 옷 기능을 직접 전달합니다.
- source_word: מְעִיל הָאֵפֹד
  english_pob_choice: the robe of the ephod
  chosen_korean: 에봇의 겉옷
  alternatives_korean:
  - 에봇의 겉옷
  - 에봇 로브
  - 에봇 위에 입는 겉옷
  lexicon: HALOT
  rationale: ‘에봇과 연결된 로브’라는 기술적 관계를 한국어로 자연스럽게 풀어 ‘에봇의 겉옷’으로 옮겼습니다.
- source_word: הָאֵפֹד
  english_pob_choice: the ephod
  chosen_korean: 에봇
  alternatives_korean:
  - 에폿
  - 에포드
  lexicon: HALOT
  rationale: 제사장 복식의 전문 용어이므로 음역을 유지했습니다. 한국어 성서 관용형인 ‘에봇’을 사용했습니다.
- source_word: הַחֹשֶׁן
  english_pob_choice: the breastpiece
  chosen_korean: 가슴받이
  alternatives_korean:
  - 흉패
  - 가슴장식
  lexicon: HALOT
  rationale: POB의 ‘breastpiece’는 무장 용어인 ‘breastplate’보다 넓은 의미의 가슴 장식입니다. 이를 한국어에서 가장 직접적으로 드러내는 ‘가슴받이’로 옮겼습니다.
- source_word: וְאָפַדְתָּ לוֹ
  english_pob_choice: and you shall skillfully fasten it on him
  chosen_korean: 그리고 ... 능숙하게 매야 합니다
  alternatives_korean:
  - 그리고 ... 묶어야 합니다
  - 그리고 ... 띠를 둘러야 합니다
  - 그리고 ... 매어야 합니다
  lexicon: HALOT
  rationale: 희귀 동사 אפד의 ‘매다/고정하다’라는 뜻을 살리면서, 앞의 띠 표현과 연결되도록 ‘능숙하게 매다’로 옮겼습니다.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  english_pob_choice: with the woven band of the ephod
  chosen_korean: 에봇의 짠 띠
  alternatives_korean:
  - 에봇의 짠 허리띠
  - 에봇의 짜인 띠
  - 에봇의 짠 띠
  lexicon: HALOT
  rationale: חֵשֶׁב을 ‘woven band’로 본 영어 판단을 따라, 짜인 재질과 띠의 기능을 함께 드러내는 ‘짠 띠’로 압축했습니다.
theological_decisions:
- issue: 제사장 복식 용어의 기술적 특수성
  chosen_reading: ‘속옷’, ‘에봇의 겉옷’, ‘에봇’, ‘가슴받이’로 각각 구분해 제사장 복식의 순서를 드러냈습니다.
  alternative_readings:
  - ‘튠니크’, ‘로브’, ‘흉패’ 같은 전통식 음역/번역
  - 모두를 ‘옷’으로 일반화
  rationale: 본문은 일반 의복이 아니라 성막 제의용 복식을 열거하므로, 서로 다른 부위를 구분해 읽히도록 옮기는 것이 문맥상 중요합니다.
  doctrine_reference: 출애굽기 28–29장 제사장 위임과 복식 규정
