  - 엄지 / 엄지
  lexicon: HALOT
  rationale: 손과 발의 짝을 살리면서 현대 한국어에서 명확한 해부학적 대응을 위해 ‘엄지’에 손·발을 붙여 번역했습니다.
- source_word: זָרַק
  english_pob_choice: throw ... against
  chosen_korean: 뿌리다
  alternatives_korean:
  - 던지다
  - 뿌려 바르다
  - 뿌리다
  lexicon: HALOT
  rationale: POB 각주가 말하듯 힘 있게 제단 둘레에 적용하는 동작이므로, 한국어에서는 의례적 분사 동작을 자연스럽게 드러내는 ‘뿌리다’를 사용했습니다.
theological_decisions:
- issue: 제사 피의 적용 방식
  chosen_reading: 피를 ‘바르되’와 ‘뿌려야 합니다’로 구분해, 신체 부위에는 접촉 적용을, 제단에는 순환적 분사를 나타내도록 했습니다.
  alternative_readings:
  - 피를 찍어 바르다 / 뿌리다
  - 피를 뿌리다
  rationale: 원문은 신체 부위의 직접적 접촉과 제단 둘레의 forceful application을 구분합니다. 한국어에서도 이 차이를 유지해야 의례 절차가 흐려지지 않습니다.
  doctrine_reference: 레위기/출애굽기 제사 규례의 언약적 성별과 속죄 표지
