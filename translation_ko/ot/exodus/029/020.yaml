  lexicon: HALOT
  rationale: 의례적 접촉 부위를 가리키는 표현으로 ‘귓불’이 가장 자연스럽고, POB의 ‘lobe’ 선택을 그대로 반영합니다.
- source_word: בֹּהֶן יָד / בֹּהֶן רֶגֶל
  english_pob_choice: thumb / big toe
  chosen_korean: 오른손 엄지 / 오른발 엄지
  alternatives_korean:
