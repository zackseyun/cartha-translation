  text: וְ/שָׁחַטְתָּ֣ אֶת הָ/אַ֗יִל וְ/לָקַחְתָּ֤ מִ/דָּמ/וֹ֙ וְ/נָֽתַתָּ֡ה עַל תְּנוּךְ֩ אֹ֨זֶן אַהֲרֹ֜ן וְ/עַל תְּנ֨וּךְ אֹ֤זֶן בָּנָי/ו֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וְ/זָרַקְתָּ֧ אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
  footnotes:
  - marker: a
    text: Or 'tip of Aaron’s right ear ... tip of the right ear of his sons.' The Hebrew term may denote the ear’s extremity more generally, though 'lobe' is the most likely sense in this ritual context.
    reason: lexical_alternative
  - marker: b
    text: Or 'dash the blood against the altar all around.' The Hebrew verb suggests a forceful ritual application rather than a gentle sprinkling.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그 숫양을 잡고, 그 피의 일부를 가져다가 아론의 오른쪽 귀의 귓불과 그의 아들들의 오른쪽 귀의 귓불, 그들의 오른손 엄지와 오른발 엄지에 바르되[b], 그 피를 제단 둘레에 뿌려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘제단 둘레에 힘차게 뿌리다’입니다. 히브리어 동사는 부드럽게 ‘뿌리기’보다 강한 의례적 투사를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  english_pob_choice: slaughter
  chosen_korean: 잡다
  alternatives_korean:
  - 도살하다
  - 죽이다
  - 잡아 죽이다
  lexicon: HALOT
  rationale: 제사 문맥에서 באנ 의례적 행위를 살려 한국어에서는 동물 희생의 표준 표현인 ‘잡다’를 택했고, 너무 기술적인 ‘도살하다’보다 자연스럽습니다.
- source_word: תְּנוּךְ אֹזֶן
  english_pob_choice: lobe of ... ear
  chosen_korean: 귓불
  alternatives_korean:
  - 귀끝
  - 귀의 끝부분
  - 귀의 연골
  lexicon: HALOT
  rationale: 의례적 접촉 부위를 가리키는 표현으로 ‘귓불’이 가장 자연스럽고, POB의 ‘lobe’ 선택을 그대로 반영합니다.
- source_word: בֹּהֶן יָד / בֹּהֶן רֶגֶל
  english_pob_choice: thumb / big toe
  chosen_korean: 오른손 엄지 / 오른발 엄지
  alternatives_korean:
  - 엄지손가락 / 엄지발가락
  - 엄지 / 엄지
  lexicon: HALOT
  rationale: 손과 발의 짝을 살리면서 현대 한국어에서 명확한 해부학적 대응을 위해 ‘엄지’에 손·발을 붙여 번역했습니다.
- source_word: זָרַק
  english_pob_choice: throw ... against
  chosen_korean: 뿌리다
  alternatives_korean:
  - 던지다
  - 뿌려 바르다
  - 뿌리다
  lexicon: HALOT
  rationale: POB 각주가 말하듯 힘 있게 제단 둘레에 적용하는 동작이므로, 한국어에서는 의례적 분사 동작을 자연스럽게 드러내는 ‘뿌리다’를 사용했습니다.
theological_decisions:
- issue: 제사 피의 적용 방식
  chosen_reading: 피를 ‘바르되’와 ‘뿌려야 합니다’로 구분해, 신체 부위에는 접촉 적용을, 제단에는 순환적 분사를 나타내도록 했습니다.
  alternative_readings:
  - 피를 찍어 바르다 / 뿌리다
  - 피를 뿌리다
  rationale: 원문은 신체 부위의 직접적 접촉과 제단 둘레의 forceful application을 구분합니다. 한국어에서도 이 차이를 유지해야 의례 절차가 흐려지지 않습니다.
  doctrine_reference: 레위기/출애굽기 제사 규례의 언약적 성별과 속죄 표지
