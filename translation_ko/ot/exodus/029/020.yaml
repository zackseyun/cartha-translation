  lexicon: HALOT
  rationale: 제사 문맥에서 באנ 의례적 행위를 살려 한국어에서는 동물 희생의 표준 표현인 ‘잡다’를 택했고, 너무 기술적인 ‘도살하다’보다 자연스럽습니다.
- source_word: תְּנוּךְ אֹזֶן
