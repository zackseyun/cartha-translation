base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
  footnotes:
  - marker: a
    text: Or 'present Aaron and his sons.' The Hebrew verb can carry a formal cultic sense of presenting someone for ritual action.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 아론과 그의 아들들을 회막[ [a] ] 입구로 데려오고, 물로 그들을 씻어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아론과 그의 아들들을 제시하라.’ 히브리어 동사는 사람을 예식 행위에 위해 공식적으로 ‘가까이 데려오다/제시하다’는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  english_pob_choice: bring ... near
  chosen_korean: 데려오고
  alternatives_korean:
  - 가까이 데리고 오고
  - 가져오고
  - 바치고
  lexicon: HALOT
  rationale: 제사장 위임 절차의 문맥에서 קרב의 예식적 ‘가까이 오게 하다/데려오다’의 뉘앙스를 살리되, 한국어로는 자연스러운 서술형인 ‘데려오다’가 가장 적절합니다.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: the entrance of the tent of meeting
  chosen_korean: 회막 입구
  alternatives_korean:
  - 회막의 입구
  - 만남의 장막 입구
  - 회막 문
  lexicon: HALOT
  rationale: 오헬 모에드는 통상 ‘회막’으로 옮기고, פֶּתַח은 특정한 문틀보다 ‘입구’가 더 정확하여 공간적 지시를 간명하게 드러냅니다.
- source_word: וְרָחַצְתָּ ... בַּמָּיִם
  english_pob_choice: you shall wash them with water
  chosen_korean: 물로 그들을 씻어야 합니다
  alternatives_korean:
  - 물을 사용하여 그들을 씻어야 합니다
  - 물로 씻어야 합니다
  - 물속에서 그들을 씻어야 합니다
  lexicon: HALOT
  rationale: רחץ는 ‘씻다’로 직접 옮기고, בַּמָּיִם은 한국어 관용에 맞게 ‘물로’로 처리해 행위의 수단을 분명히 했습니다.
theological_decisions:
- issue: 제사장 위임 절차에서 קרב의 예식적 의미
  chosen_reading: ‘데려오다’로 옮겨 아론과 그의 아들들을 성막 공간 앞으로 예식적으로 이끄는 뜻을 살렸습니다.
  alternative_readings:
  - ‘바치다’
  - ‘제시하다’
  rationale: 본문은 단순 이동이 아니라 성막에서의 제의적 준비를 시작하는 동작이므로, 한국어에서도 예식적 접근의 의미가 드러나도록 번역하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source-text nuance without paraphrase.'
