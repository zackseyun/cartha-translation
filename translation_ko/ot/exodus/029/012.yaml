base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
  footnotes:
  - marker: a
    text: Or 'from the blood of the bull.' The Hebrew expression is literally 'from the blood of the bull,' here meaning that a portion of the blood is taken for application to the altar.
    reason: lexical_alternative
  - marker: b
    text: The 'horns' were the horn-like projections at the altar's corners.
    reason: cultural_note
  - marker: c
    text: Or 'to the base of the altar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 수송아지의 피에서 일부를 가져다가 네 손가락으로 제단의 뿔들에 바르고, 모든 피는 제단의 밑바닥에 쏟아부어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수송아지의 피에서 일부’는 히브리어의 직역적 구조를 살린 것으로, 피의 일부를 취해 제단에 바르는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뿔들’은 제단 모서리에 있는 뿔 모양의 돌출부를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: ‘밑바닥’은 ‘제단의 기초/기저’에 해당하며, 피를 그 아래에 쏟아붓는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם הַפָּר
  english_pob_choice: some of the blood of the bull
  chosen_korean: 수송아지의 피에서 일부
  alternatives_korean:
  - 수송아지의 피에서
  - 수송아지의 피 일부
  lexicon: HALOT
  rationale: מִן은 여기서 부분을 가리키므로 ‘에서 일부’로 분명하게 살려, 제사에 쓸 피의 일부를 취하는 뜻을 드러냈습니다.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  english_pob_choice: the horns of the altar
  chosen_korean: 제단의 뿔들
  alternatives_korean:
  - 제단의 뿔
  - 제단의 뿔 모양 돌출부
  lexicon: HALOT
  rationale: 예배용 제단의 구체적 형상을 보존하기 위해 일반화하지 않고 ‘뿔들’로 옮겼습니다.
- source_word: בְּאֶצְבָּעֶךָ
  english_pob_choice: with your finger
  chosen_korean: 네 손가락으로
  alternatives_korean:
  - 네 손가락을 사용하여
  - 손가락으로
  lexicon: HALOT
  rationale: 베트 전치사의 도구적 용법을 자연스럽게 살려, 제사 행위의 수단을 직접적으로 표현했습니다.
- source_word: יְסוֹד הַמִּזְבֵּחַ
  english_pob_choice: at the base of the altar
  chosen_korean: 제단의 밑바닥
  alternatives_korean:
  - 제단의 기초
  - 제단의 바닥
  lexicon: HALOT
  rationale: יְסוֹד의 ‘기초/밑바닥’ 뜻을 유지하되, 제단에 대한 제의적 맥락에서는 ‘밑바닥’이 가장 자연스럽고 구체적입니다.
theological_decisions:
- issue: 제사 절차의 구체성 보존
  chosen_reading: ‘제단의 뿔들’과 ‘제단의 밑바닥’을 그대로 살려, 제사장의 세부 절차를 흐리지 않도록 했습니다.
  alternative_readings:
  - 제단의 모퉁이
  - 제단의 발치
  rationale: 이 구절은 안수식의 정확한 의식 절차를 묘사하므로, 형상과 동작을 완화하지 않는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
