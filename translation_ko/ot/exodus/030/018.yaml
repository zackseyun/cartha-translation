source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ כִּיּ֥וֹר נְחֹ֛שֶׁת וְ/כַנּ֥/וֹ נְחֹ֖שֶׁת לְ/רָחְצָ֑ה וְ/נָתַתָּ֣ אֹת֗/וֹ בֵּֽין אֹ֤הֶל מוֹעֵד֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ וְ/נָתַתָּ֥ שָׁ֖מָּ/ה מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
  footnotes:
  - marker: a
    text: Or 'laver' for 'basin,' a traditional rendering for the large wash vessel used at the tabernacle.
    reason: lexical_alternative
  - marker: b
    text: '''Bronze'' may also be rendered ''copper''; the Hebrew term can denote copper or a copper alloy depending on context.'
    reason: lexical_alternative
  - marker: c
    text: Or 'base' for 'stand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 놋 물두멍과 그 받침을 만들어 씻는 데 쓰게 하고, 그것을 회막과 제단 사이에 두며, 거기에 물을 담아 두어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물두멍’은 성막의 큰 세척 그릇을 가리키는 전통적 번역입니다. 영어 POB의 ‘basin’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘놋’은 문맥상 청동이나 구리 합금을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘받침’은 영어 POB의 ‘stand’에 해당하며, 기능을 드러내는 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  english_pob_choice: basin
  chosen_korean: 물두멍
  alternatives_korean:
  - 대야
  - 세숫대야
  - 세면대
  lexicon: HALOT
  rationale: 성막 문맥의 제의적 세척 용기를 가리키므로, 기능을 드러내는 전통적이면서도 한국어 성경에서 널리 이해되는 ‘물두멍’을 채택했습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 출애굽기 성막 용어에서는 재료명 ‘놋’이 가장 자연스럽고, 제의 기물의 통일된 표기를 유지합니다.
- source_word: כַּן
  english_pob_choice: stand
  chosen_korean: 받침
  alternatives_korean:
  - 기둥
  - 대
  - 바닥
  lexicon: HALOT
  rationale: 물두멍을 받쳐 주는 구조물을 한국어로 기능적으로 가장 분명하게 드러내는 말은 ‘받침’입니다.
- source_word: לְרָחְצָה
  english_pob_choice: for washing
  chosen_korean: 씻는 데 쓰게
  alternatives_korean:
  - 씻기 위해
  - 정결례를 위해
  lexicon: HALOT
  rationale: 목적을 나타내는 표현을 한국어 자연어로 풀되, 본문이 특정 대상을 덧붙이지 않는 점을 살려 ‘씻는 데’로 옮겼습니다.
theological_decisions:
- issue: 회막의 명칭과 성막 문맥의 제의적 기능
  chosen_reading: ‘אֹהֶל מוֹעֵד’를 ‘회막’으로 옮겨, 예배와 만남의 장소라는 제의적 의미를 유지했습니다.
  alternative_readings:
  - ‘만남의 장막’
  - ‘증거막’
  rationale: 이 표현은 성막의 표준 명칭으로 기능하므로, 한국어 독자에게 익숙하면서도 본문의 제의적 맥락을 보존하는 ‘회막’이 가장 적절합니다.
  doctrine_reference: 성막/회막 용어의 일관성 유지
