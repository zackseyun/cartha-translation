  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
  footnotes:
  - marker: a
    text: Or 'laver' for 'basin,' a traditional rendering for the large wash vessel used at the tabernacle.
    reason: lexical_alternative
  - marker: b
    text: '''Bronze'' may also be rendered ''copper''; the Hebrew term can denote copper or a copper alloy depending on context.'
    reason: lexical_alternative
  - marker: c
    text: Or 'base' for 'stand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 씻기 위한 청동 물두멍[a]과 청동 받침[c]을 만드십시오.[b] 그것을 회막과 제단 사이에 두고, 그 안에 물을 담으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물두멍’은 성막에서 씻는 데 사용한 큰 물그릇을 가리킵니다. ‘대야’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘청동’으로 옮긴 히브리어 낱말은 ‘구리’ 또는 구리 합금을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘받침’은 물두멍을 지지하는 구조물입니다. ‘대’ 또는 ‘바탕’으로도 옮길 수 있습니다.
    reason: lexical_alternative
