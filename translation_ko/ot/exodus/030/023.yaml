  rationale: קָנֶה는 갈대/줄기 계열의 식물을 가리키며, בֹשֶׂם이 향기성을 덧붙입니다. POB의 'fragrant cane'을 따라 '향기로운 갈대'로 옮겨 지나친 식물학적 특정화를 피했습니다.
