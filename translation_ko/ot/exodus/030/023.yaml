source:
  edition: WLC
  text: וְ/אַתָּ֣ה קַח לְ/ךָ֮ בְּשָׂמִ֣ים רֹאשׁ֒ מָר דְּרוֹר֙ חֲמֵ֣שׁ מֵא֔וֹת וְ/קִנְּמָן בֶּ֥שֶׂם מַחֲצִית֖/וֹ חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם וּ/קְנֵה בֹ֖שֶׂם חֲמִשִּׁ֥ים וּ/מָאתָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
  footnotes:
  - marker: a
    text: Or 'pure myrrh' for 'flowing myrrh.' The Hebrew expression likely refers to myrrh that flows freely in its natural state.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'sweet cinnamon' and 'sweet calamus.' The Hebrew more broadly denotes aromatic or fragrant cinnamon and cane.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 자신을 위해 가장 좋은 향료를 취하되, 흐르는 몰약 오백 세겔과 그 절반 곧 이백오십의 향기로운 계피와 이백오십의 향기로운 갈대를 취하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '가장 좋은 향료'이지만, 히브리어 רֹאשׁ는 관용적으로 '으뜸' 또는 '최상'의 뜻을 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 '달콤한 계피'와 '달콤한 창포'로 옮기기도 하지만, 히브리어는 향기/향내를 더 직접적으로 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  english_pob_choice: the finest spices
  chosen_korean: 가장 좋은 향료
  alternatives_korean:
  - 최고의 향료
  - 으뜸 향료
  - 선택한 향료
  lexicon: HALOT
  rationale: בְּשָׂמִים은 향료/향신료이고, רֹאשׁ은 ‘머리’의 직역보다 ‘가장 으뜸’이라는 관용적 의미가 자연스럽습니다. '가장 좋은 향료'가 품질의 최상성을 간명하게 드러냅니다.
- source_word: מָר דְּרוֹר
  english_pob_choice: flowing myrrh
  chosen_korean: 흐르는 몰약
  alternatives_korean:
  - 유동하는 몰약
  - 자유롭게 흐르는 몰약
  - 순수한 몰약
  lexicon: HALOT
  rationale: מָר은 몰약이고, דְּרוֹר은 자유롭게 흐르거나 흘러나오는 상태를 가리키므로 '흐르는 몰약'이 원문의 상태 묘사를 비교적 직역에 가깝게 전달합니다.
- source_word: קִנְּמָן בֶּשֶׂם
  english_pob_choice: fragrant cinnamon
  chosen_korean: 향기로운 계피
  alternatives_korean:
  - 향긋한 계피
  - 아로마 계피
  - 달콤한 계피
  lexicon: HALOT
  rationale: קִנְּמָן은 계피이고, בֶּשֶׂם은 향기/향내를 뜻하므로 '향기로운 계피'가 맛이 아니라 향의 특징을 반영합니다.
- source_word: קְנֵה בֹשֶׂם
  english_pob_choice: fragrant cane
  chosen_korean: 향기로운 갈대
  alternatives_korean:
  - 향기로운 창포
  - 향긋한 갈대
  - 아로마 갈대
  lexicon: HALOT
  rationale: קָנֶה는 갈대/줄기 계열의 식물을 가리키며, בֹשֶׂם이 향기성을 덧붙입니다. POB의 'fragrant cane'을 따라 '향기로운 갈대'로 옮겨 지나친 식물학적 특정화를 피했습니다.
theological_decisions:
