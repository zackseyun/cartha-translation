- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 이 절의 고유한 하나님의 이름 YHWH를 직함으로 바꾸지 않고, 프로젝트 기본어인 '야훼'로 옮겨 원문 고유명을 보존합니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
