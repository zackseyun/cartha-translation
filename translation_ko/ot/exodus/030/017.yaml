lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: And ... spoke
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하여 이르셨습니다
  lexicon: HALOT
  rationale: 히브리어 서술형 동사 뒤에 לֵאמֹר가 이어지는 전형적 말씀 도입구이므로, 단순한 '말씀하셨습니다'보다 '말씀하여 이르셨습니다'가 원문 구조를 더 투명하게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 이 절의 고유한 하나님의 이름 YHWH를 직함으로 바꾸지 않고, 프로젝트 기본어인 '야훼'로 옮겨 원문 고유명을 보존합니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: 에게
  alternatives_korean:
  - 에게로
  - 에
  lexicon: HALOT
  rationale: 발화의 직접 수혜자/대상을 나타내는 방향격으로, 현대 한국어에서는 '모세에게'가 가장 자연스럽고 정확합니다.
- source_word: לֵּאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말씀하셨습니다
  - 말하여
  lexicon: HALOT
  rationale: 히브리어 관용구의 끝맺음으로서 다음 절의 직접 인용을 예고하므로, 한국어에서는 종결 동사를 한 번 더 살려 '이르셨습니다'로 처리했습니다.
theological_decisions:
- issue: 신명기적/출애굽기적 하나님의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
