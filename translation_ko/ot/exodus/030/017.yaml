  - 주
  rationale: 본문은 יְהוָה를 직접 사용하므로, 전통적 대체어인 '주'보다 고유명 '야훼'가 언약 이름을 더 분명히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
