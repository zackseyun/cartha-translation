lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  english_pob_choice: you shall anoint
  chosen_korean: 기름을 부으십시오
  alternatives_korean:
  - 기름을 바르십시오
  - 부으시고
  lexicon: HALOT
  rationale: 제의적 동사 משׁח의 표준 한국어 대응은 ‘기름을 붓다/부르다’보다 ‘기름을 부으다’가 자연스럽고, 명령형 합쇼체로 문맥의 지시성을 살렸습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: HALOT
  rationale: 출애굽기 제의 문맥에서 אָהֶל מוֹעֵד는 한국어 성경 전통의 ‘회막’이 가장 간결하면서도 정확하여 이를 채택했습니다.
- source_word: אֲרוֹן הָעֵדֻת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증거의 궤
  - 증언궤
  lexicon: HALOT
  rationale: 히브리어 본문이 ‘testimony’(עֵדֻת)를 사용하므로 ‘언약궤’로 바꾸지 않고, 한국어 제의 용례에 정착한 ‘증거궤’로 옮겨 원문 어휘를 보존했습니다.
theological_decisions:
- issue: אָרון הָעֵדֻת의 전통적 번역과 본문 어휘의 긴장
  chosen_reading: ‘언약궤’ 대신 본문이 실제로 말하는 ‘증거궤’를 사용했습니다.
  alternative_readings:
  - 언약궤
  - 증언궤
  rationale: POB의 영어 결정과 같이, 널리 알려진 교회 전통보다 히브리어 본문의 어휘를 우선하여 독자가 ‘증거’라는 실제 표지를 보게 하는 것이 본문 충실성에 더 부합합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; consistency of key terms.'
