translation:
  language: ko
  text: 그것은 사람의 살에 부어서는 안 됩니다[a]. 그 배합대로 너희는 그것과 같은 것을 만들어서는 안 됩니다. 그것은 거룩한 것입니다. 그것은 너희에게는 거룩한 것이어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 특정한 남성 한 사람보다 일반적인 ‘사람/인간’을 가리킵니다.
