- issue: 문장 끝의 קדש 반복을 한국어에서 어떻게 유지할지
  chosen_reading: ‘그것은 거룩합니다. 너희에게 거룩해야 합니다.’로 두 번 옮겨 성별된 상태와 공동체에 대한 요구를 모두 살렸습니다.
  alternative_readings:
  - ‘그것은 성물입니다. 너희에게는 성물이어야 합니다.’
  - ‘그것은 거룩한 것이며 너희에게도 거룩한 것이 되어야 합니다.’
  rationale: 히브리어는 선언(거룩하다)과 규범(거룩해야 한다)을 병렬로 두므로, 한국어도 같은 반복을 살려 텍스트의 강조를 약화시키지 않았습니다.
