  rationale: בָּשָׂר의 직역인 ‘살’을 유지하고, אָדָם의 일반적 인간 지시를 ‘사람’으로 옮겨 본문 이미지와 의미를 함께 보존했습니다.
- source_word: וּבְמַתְכֻּנְתּוֹ
