base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
  footnotes:
  - marker: a
    text: Or 'on human flesh.' The Hebrew 'flesh of man' uses אָדָם generically for human beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 사람의 살에 부어서는 안 됩니다[a]. 그 배합대로 너희는 그것과 같은 것을 만들어서는 안 됩니다. 그것은 거룩합니다. 너희에게 거룩해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָדָם은 여기서 특정한 남성 한 사람보다 일반적인 ‘사람/인간’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיסָךְ
  english_pob_choice: shall be poured
  chosen_korean: 부어서는 안 됩니다
  alternatives_korean:
  - 바르아서는 안 됩니다
  - 부어 바르아서는 안 됩니다
  lexicon: HALOT
  rationale: 이 동사는 향유를 실제로 도포하는 행위를 가리키므로, ‘붓다’의 물리성을 살리되 한국어에서는 금지 표현으로 자연스럽게 풀었습니다.
- source_word: עַל בְּשַׂר אָדָם
  english_pob_choice: on human flesh
  chosen_korean: 사람의 살에
  alternatives_korean:
  - 인간의 살에
  - 어떤 사람의 몸에
  lexicon: HALOT
  rationale: בָּשָׂר의 직역인 ‘살’을 유지하고, אָדָם의 일반적 인간 지시를 ‘사람’으로 옮겨 본문 이미지와 의미를 함께 보존했습니다.
- source_word: וּבְמַתְכֻּנְתּוֹ
  english_pob_choice: in its composition
  chosen_korean: 그 배합대로
  alternatives_korean:
  - 그 조성대로
  - 그 공식대로
  lexicon: HALOT
  rationale: מַתְכֹּנֶת는 재료의 정해진 비율과 배합을 뜻하므로, 현대 한국어에서 자연스럽고 금지의 근거를 분명히 하는 ‘배합’을 택했습니다.
- source_word: קֹדֶשׁ
  english_pob_choice: holy
  chosen_korean: 거룩합니다 / 거룩해야 합니다
  alternatives_korean:
  - 성스럽습니다 / 성스러워야 합니다
  lexicon: HALOT
  rationale: קֹדֶשׁ의 핵심 의미를 한국어의 성경적 기본어인 ‘거룩’으로 유지해, 단순한 의례적 분리보다 하나님께 속한 성별의 의미를 드러냈습니다.
theological_decisions:
- issue: 문장 끝의 קדש 반복을 한국어에서 어떻게 유지할지
  chosen_reading: ‘그것은 거룩합니다. 너희에게 거룩해야 합니다.’로 두 번 옮겨 성별된 상태와 공동체에 대한 요구를 모두 살렸습니다.
  alternative_readings:
  - ‘그것은 성물입니다. 너희에게는 성물이어야 합니다.’
  - ‘그것은 거룩한 것이며 너희에게도 거룩한 것이 되어야 합니다.’
  rationale: 히브리어는 선언(거룩하다)과 규범(거룩해야 한다)을 병렬로 두므로, 한국어도 같은 반복을 살려 텍스트의 강조를 약화시키지 않았습니다.
  doctrine_reference: Exodus 30:32 source structure; POB style on repeated predicate emphasis
