  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
  footnotes:
  - marker: a
    text: Or 'strange incense' or 'foreign incense.' The Hebrew adjective can mean something outside what is permitted or prescribed in this cultic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 위에 향기로운 향을 드리지 말며, 번제도 소제도 드리지 말고, 전제도 그 위에 붓지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘낯선 향’, ‘이방의 향’이라고도 할 수 있습니다. 히브리어 형용사는 이 제의 문맥에서 허용되거나 규정된 범위를 벗어난 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲל֥וּ ... קְטֹ֥רֶת זָרָ֖ה
  english_pob_choice: You shall not offer unauthorized incense
  chosen_korean: 향기로운 향을 드리지 말며
  alternatives_korean:
  - 불법한 향을 드리지 말며
  - 낯선 향을 드리지 말며
  lexicon: HALOT
  rationale: 제사 문맥의 זָרָה를 단순히 ‘이방의’나 ‘이상한’으로 풀기보다, 규정되지 않은 것을 가리키는 금지의 뉘앙스를 살려 자연스러운 제사 언어로 옮겼습니다.
- source_word: עָלָיו
  english_pob_choice: on it
  chosen_korean: 그 위에
  alternatives_korean:
  - 그 위에다가
  - 그 위에
  lexicon: HALOT
  rationale: 분향단을 가리키는 지시 대상을 한국어에서도 유지하면서, 제의적 ‘위에’라는 공간 관계를 분명히 했습니다.
- source_word: וְעֹלָה וּמִנְחָה
  english_pob_choice: or a burnt offering, or a grain offering
  chosen_korean: 번제도 소제도
  alternatives_korean:
  - 번제도 곡식 제물도
  - 번제도 곡식제도
  lexicon: HALOT
  rationale: עֹלָה와 מִנְחָה의 표준 제의 용어를 살리되, 현대 한국어 교회 언어에서 널리 통용되는 ‘소제’를 채택해 본문의 제사 항목을 분명히 했습니다.
- source_word: וְנֵסֶךְ ... תִסְּכוּ
  english_pob_choice: a drink offering ... pour out a drink offering
  chosen_korean: 전제도 그 위에 붓지 마십시오
  alternatives_korean:
  - 전제도 붓지 마십시오
  - 술제물도 그 위에 붓지 마십시오
  lexicon: HALOT
  rationale: נֵסֶךְ와 נסך의 ‘붓다/쏟아 붓다’라는 제의적 동작을 한국어 동사 ‘붓다’로 간결하게 살렸습니다. ‘전제’는 전통적이면서도 이해 가능한 대응어입니다.
theological_decisions:
- issue: זָרָה의 의미를 한국어에서 어떻게 제한할지
  chosen_reading: ‘향기로운 향’으로 옮기되, 제의 규정 밖의 것이라는 금지 의미를 전체 문맥으로 드러냅니다.
  alternative_readings:
  - 불법한 향
  - 낯선 향
  - 이방 향
  rationale: 이 구절은 향 자체의 출처가 ‘외국’이라는 뜻이 아니라, 분향단에 드리는 것이 허용되지 않은 향이라는 제의적 금지를 말합니다. 따라서 의미를 좁히지 않으면서도 현대 독자가 이해할 수 있게 표현했습니다.
  doctrine_reference: 제의 규정의 정확성; 원문 우선 번역 원칙
