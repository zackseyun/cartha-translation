source:
  edition: WLC
  text: וְ/קִדָּ֕ה חֲמֵ֥שׁ מֵא֖וֹת בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ וְ/שֶׁ֥מֶן זַ֖יִת הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/024.yaml
  text: and cassia[a], five hundred shekels by the sanctuary shekel, and a hin of olive oil.
  footnotes:
  - marker: a
    text: A hin was an ancient liquid measure; many estimate it at roughly 3.5 to 4 liters (about 1 gallon).
    reason: cultural_note
translation:
  language: ko
  text: 그리고 계피는 은 성소의 세겔로 오백 세겔, 그리고 올리브 기름 한 힌입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 힌은 고대 액량 단위입니다. 많은 연구자는 약 3.5~4리터(약 1갤런)로 추정합니다.
    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  english_pob_choice: cassia
  chosen_korean: 계피
  alternatives_korean:
  - 카시아
  - 향나무 껍질
  lexicon: HALOT
  rationale: קִדָּה는 향료로 쓰이는 cassia를 가리키므로, 한국어 독자에게 자연스럽고 기능도 드러나는 ‘계피’를 택했습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: by the sanctuary shekel
  chosen_korean: 성소의 세겔로
  alternatives_korean:
  - 성소 세겔로
  - 성소의 세겔에 따라
  - 거룩한 세겔로
  lexicon: HALOT
  rationale: 표준 중량 단위를 가리키는 표현이므로, ‘~로’로 기준을 살려 ‘성소의 세겔로’라고 옮겼습니다.
- source_word: הִין
  english_pob_choice: a hin
  chosen_korean: 한 힌
  alternatives_korean:
  - 1힌
  - 히인 한 단위
  lexicon: HALOT
  rationale: 고대 액량 단위의 특수성을 보존하기 위해 음역 ‘힌’을 유지하고, 영어 POB처럼 분량을 보이는 관사 의미는 ‘한’으로 처리했습니다.
- source_word: וְשֶׁמֶן זַיִת
  english_pob_choice: olive oil
  chosen_korean: 올리브 기름
  alternatives_korean:
  - 감람유
  - 올리브유
  lexicon: HALOT
  rationale: ‘שֶׁמֶן זַיִת’의 직역적 구성과 현대 가독성을 함께 살리기 위해 ‘올리브 기름’을 사용했습니다.
