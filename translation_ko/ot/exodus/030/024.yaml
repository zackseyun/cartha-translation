  rationale: 문법 오류를 바로잡고, 카시아라는 향료명을 구별하여 옮겼습니다. 원문의 동사 없는 재료 열거는 바로 앞 절의 명령을 이어받으므로, 한국어 합쇼체의 완결문으로 자연스럽게 하기 위해 ‘달고 … 취하십시오’를 보충했습니다. ‘달고’는 세겔이라는 중량 단위와 ‘성소 세겔에 따라’라는 측정 기준을 명시적으로 연결할 뿐 수량이나 내용을 추가하지 않습니다.
