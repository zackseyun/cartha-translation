lexical_decisions:
- source_word: הַשֻּׁלְחָן
  english_pob_choice: the table
  chosen_korean: 상
  alternatives_korean:
  - 식탁
  - 탁자
  - 진설상
  lexicon: HALOT
  rationale: 성막 문맥의 전용 물건이지만, 히브리어 자체는 여기서 단순히 ‘table’이므로 본문을 좁혀 풀지 않고 간결한 ‘상’으로 옮겼습니다.
- source_word: כָּל כֵּלָיו
  english_pob_choice: all its utensils
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 그릇
  - 그 모든 물건
  - 그 모든 용기
  lexicon: HALOT
  rationale: כְּלִי의 넓은 의미를 살리면서 성막 기물에 자연스러운 현대 한국어로 ‘기구’를 택했습니다.
- source_word: הַמְּנֹרָה / כֵּלֶיהָ
  english_pob_choice: the lampstand / its utensils
  chosen_korean: 등잔대와 그 기구들
  alternatives_korean:
  - 등대와 그 기구들
  - 메노라와 그 기구들
  - 촛대와 그 기구들
  lexicon: HALOT
  rationale: מְנוֹרָה는 기능을 드러내는 ‘등잔대’가 가장 직접적입니다. 이어지는 כֵּלֶיהָ도 동일하게 ‘기구들’로 맞추어 병렬 구조를 살렸습니다.
- source_word: מִזְבַּח הַקְּטֹרֶת
  english_pob_choice: the altar of incense
  chosen_korean: 분향 제단
  alternatives_korean:
  - 향 제단
  - 향로 제단
  - 분향단
  lexicon: HALOT
  rationale: קְטֹרֶת는 ‘분향/향기로운 연기’의 행위를 가리키므로, 대상의 기능을 분명히 하는 ‘분향 제단’이 본문의 의미를 잘 드러냅니다.
