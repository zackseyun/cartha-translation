  - ‘여호와’로 표기
  rationale: 출 30:11은 여호와/야훼 대체 칭호가 아니라 직접적인 신명 사용이므로, POB 원칙에 따라 고유 이름을 드러내는 것이 본문의 신학적 무게를 더 잘 전달합니다.
