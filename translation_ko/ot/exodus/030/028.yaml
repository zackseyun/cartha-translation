lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  english_pob_choice: the altar of burnt offering
  chosen_korean: 번제단
  alternatives_korean:
  - 번제제단
  - 번제의 제단
  - 번제물 제단
  lexicon: HALOT
  rationale: 문맥상 제의용 제단을 가리키므로 한국어 성경에서 널리 통용되는 '번제단'을 사용했습니다. 'burnt offering'의 제의적 의미를 간결하게 보존합니다.
- source_word: כָּל כֵּלָיו
  english_pob_choice: all its utensils
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 기물
  - 그 모든 도구
  - 그 모든 기구들
  lexicon: HALOT
  rationale: מִשְׁכָּן/성막 문맥에서 כֵּלִים은 제의에 쓰는 도구와 기구를 포괄하므로, 현대 한국어에서 자연스럽고 구체적인 '기구'로 옮겼습니다.
- source_word: הַכִּיֹּר
  english_pob_choice: the basin
  chosen_korean: 물두멍
  alternatives_korean:
  - 대야
  - 세숫대야
  - 물대야
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥의 관용적 용어를 따라 '물두멍'을 유지해 제의적 용례를 분명히 했습니다.
- source_word: כַּנּוֹ
  english_pob_choice: its stand
  chosen_korean: 그 받침
  alternatives_korean:
  - 그 자리받침
  - 그 대좌
  - 그 바닥받침
  lexicon: HALOT
  rationale: כֵּן은 여기서 물두멍을 지지하는 받침대/대좌를 뜻하므로, 기능이 분명한 '받침'으로 옮겼습니다.
theological_decisions:
- issue: 제의 기구 목록의 연결 방식
  chosen_reading: 열거를 따라 번제단과 그 기구, 물두멍과 그 받침을 한 문장으로 직역성 있게 제시했습니다.
  alternative_readings:
  - 문맥을 풀어 '번제단과 거기 딸린 모든 기구들, 그리고 물두멍과 그 받침'으로 완화할 수 있음
  - '''함께 하십시오'' 대신 서술형으로 바꿀 수 있음'
  rationale: 원문은 지시문 형태로 제의 물품들을 병렬 열거하므로, 추가 해석을 덜어내고 대상 목록의 성격을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 출애굽기 30장 성막 제의 지시
