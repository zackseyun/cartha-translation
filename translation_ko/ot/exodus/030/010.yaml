  to: 아론은 일 년에 한 번 그 제단의 뿔들에 속죄를 해야 합니다[a]. 그는 속죄를 위한 속죄제의 피로 너희 대대로 일 년에 한 번 그 제단을 위하여 속죄를 해야 합니다. 그것은 야훼께 지극히 거룩합니다.
