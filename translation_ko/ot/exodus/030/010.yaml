  rationale: 이 판의 기본 원칙에 따라 יהוה는 ‘야훼’로 옮겨 언약명 자체를 드러냈습니다. 본문 끝의 הקדש 선언과 결합될 때 신적 소유와 성별의 뉘앙스가 더 분명해집니다.
