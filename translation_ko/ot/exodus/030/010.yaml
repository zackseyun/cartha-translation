  source_fidelity: 전반적인 제의적 의미와 연례 빈도는 잘 반영되었습니다. 그러나 מִדַּם חַטַּאת הַכִּפֻּרִים를 ‘속죄의 속죄제의 피’로 옮긴 것은 한국어에서 소유·목적 관계가 불명확하고 부자연스럽습니다. 문맥상 ‘속죄를 위한 속죄제의 피’가 수단과 제의적 용례를 더 정확히 드러냅니다. 각 대명사의 선행사는 향 제단이므로, 첫 문장에서 이를 밝혀 자연스럽게 하였습니다.
  naturalness: ‘그 뿔들 위에서’는 한국어 제의 문맥에서 다소 어색하므로 ‘그 제단의 뿔들에’로 다듬는 것이 자연스럽습니다. ‘속죄를 행하다’와 ‘속죄하다’의 혼용도 가능하나, 본 절에서는 ‘속죄를 해야 합니다’로 통일하면 현대의 격식 있는 합쇼체 문장으로 매끄럽습니다.
  terminology: ‘속죄제’, ‘속죄’, ‘대대로’, ‘지극히 거룩합니다’, ‘야훼’는 적절합니다. קֹדֶשׁ קָדָשִׁים은 장소명인 ‘지성소’가 아니라 거룩성의 최상급 분류이므로 현 번역을 유지합니다. 각주 원문의 ‘속죄물들’은 הַכִּפֻּרִים의 의미가 아니라 과도한 해석이므로 ‘속죄들’로 바로잡아야 합니다.
