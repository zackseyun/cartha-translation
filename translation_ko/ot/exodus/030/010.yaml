translation:
  language: ko
  text: 아론은 일 년에 한 번 그 제단의 뿔들에 속죄를 해야 합니다[a]. 그는 속죄를 위한 속죄제의 피로 너희 대대로 일 년에 한 번 그 제단을 위하여 속죄를 해야 합니다. 그것은 야훼께 지극히 거룩합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄의 속죄제의 피로’. 히브리어 구는 문자적으로 ‘속죄들의 속죄제의 피에서’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  english_pob_choice: shall make atonement
  chosen_korean: 속죄를 행해야 합니다 / 속죄해야 합니다
  alternatives_korean:
  - 속죄해야 합니다
  - 속량해야 합니다
  - 덮어야 합니다
  lexicon: HALOT
  rationale: 제사 문맥의 כפר는 단순한 ‘덮다’보다 제의적 속죄 행위를 가리키므로, 한국어에서는 ‘속죄를 행하다/속죄하다’로 옮기는 것이 가장 직접적입니다.
- source_word: מִדַּם חַטַּאת הַכִּפֻּרִים
  english_pob_choice: with the blood of the sin offering of atonement
  chosen_korean: 속죄의 속죄제의 피로
  alternatives_korean:
  - 속죄를 위한 속죄제의 피로
  - 속죄제의 피로
  - 화목제의 피로
  lexicon: HALOT
  rationale: חטאת는 제의적으로 ‘속죄제’가 자연스럽고, מִן־דָּם은 여기서 수단을 나타내므로 ‘피로’로 풀었습니다. 영어 POB가 유지한 중첩 표현을 한국어에서도 최대한 보존했습니다.
- source_word: לְדֹרֹתֵיכֶם
  english_pob_choice: throughout your generations
  chosen_korean: 대대로
  alternatives_korean:
  - 여러 세대에 걸쳐
  - 너희 세대들을 따라
  - 너희 대대로
  lexicon: HALOT
  rationale: 이스라엘에 지속적으로 적용되는 규례를 나타내는 관용구이므로, 현대 한국어에서 가장 자연스럽고 명료한 ‘대대로’를 택했습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩합니다
  alternatives_korean:
  - 가장 거룩합니다
  - 매우 거룩합니다
  - 지성소입니다
  lexicon: HALOT
  rationale: 이 표현은 장소명 ‘지성소’가 아니라 최상급 거룩성 분류이므로, 오해를 피하면서도 강도를 살린 ‘지극히 거룩합니다’로 옮겼습니다.
