  text: וְ/הִקְטִ֥יר עָלָ֛י/ו אַהֲרֹ֖ן קְטֹ֣רֶת סַמִּ֑ים בַּ/בֹּ֣קֶר בַּ/בֹּ֗קֶר בְּ/הֵיטִיב֛/וֹ אֶת הַ/נֵּרֹ֖ת יַקְטִירֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
  footnotes:
  - marker: a
    text: Or 'morning by morning.' The Hebrew repetition emphasizes the regular daily practice.
    reason: lexical_alternative
  - marker: b
    text: Or 'when he trims the lamps.' The Hebrew verb can refer more specifically to putting the lamps in order.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론은 향기로운 향을 그 위에 아침마다[a] 피워야 합니다. 그가 등잔들을 손볼 때[b], 그것을 피워야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아침마다 아침마다’입니다. 히브리어 반복은 이 의식이 매일 규칙적으로 이루어져야 함을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘등잔들을 정돈할 때’, ‘등잔 심지를 손질할 때’로 옮길 수 있습니다. 히브리어 동사는 등잔을 정비해 놓는 일을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר / יַקְטִירֶנָּה
  english_pob_choice: shall burn / he shall burn it
  chosen_korean: 피워야 합니다
  alternatives_korean:
  - 향을 사르게 해야 합니다
  - 연기로 올려야 합니다
  - 분향해야 합니다
  lexicon: HALOT
  rationale: 성막 제의 문맥에서 קטר의 사역형은 제물을 향처럼 태워 올리는 행위를 가리키므로, 자연스러운 현대 한국어로는 ‘피우다’가 의미를 가장 직접적으로 전달합니다.
- source_word: קְטֹרֶת סַמִּים
  english_pob_choice: fragrant incense
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 향품 향
  - 향료 향
  - 향긋한 향
  lexicon: HALOT
  rationale: 향료로 만든 제의용 향이라는 점을 드러내면서도, 한국어에서 과도하게 설명적이지 않게 ‘향기로운 향’으로 옮겼습니다.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  english_pob_choice: morning by morning
  chosen_korean: 아침마다
  alternatives_korean:
  - 아침마다 반복하여
  - 아침마다 늘
  - 매일 아침
  lexicon: HALOT
  rationale: 반복 구조가 정기성과 매일의 관행을 강조하므로, 이를 간결하게 살려 ‘아침마다’로 옮겼습니다. 발췌된 영어 주석의 대안 의미도 이 표현이 충분히 포괄합니다.
- source_word: בְּהֵיטִיבוֹ אֶת הַנֵּרֹת
  english_pob_choice: when he tends the lamps
  chosen_korean: 그가 등잔들을 손볼 때
  alternatives_korean:
  - 그가 등잔들을 정돈할 때
  - 그가 등잔들을 다듬을 때
  - 그가 등잔 심지를 손질할 때
  lexicon: HALOT
  rationale: hetil의 의미는 등잔의 불꽃을 정비하고 순서를 바로잡는 넓은 관리 행위이므로, ‘손보다’가 가장 무리 없이 포괄합니다.
theological_decisions:
- issue: 제의 동사의 한국어 선택
  chosen_reading: 성막 제의행위를 지나치게 완곡하게 만들지 않고, ‘피우다’로 제의적 ‘올림’을 드러냈습니다.
  alternative_readings:
  - 분향하다
  - 향을 사르다
  - 제사하다
  rationale: 본문은 향을 실제로 불태워 올리는 제의 규례를 말하므로, 일반적인 ‘분향하다’보다 행위의 물질성과 제의성을 더 직접적으로 보존하는 번역을 택했습니다.
  doctrine_reference: 성막 예전과 제사 언어의 직접성 유지
- issue: 반복 표현의 처리
  chosen_reading: ‘아침마다’로 옮겨 규정된 일상적 반복을 자연스럽게 드러냈습니다.
  alternative_readings:
  - 아침마다 아침마다
  - 아침마다 계속
  - 매일 아침
  rationale: 히브리어 반복은 정기적 의무를 강조하지만, 한국어에서는 중복을 그대로 두기보다 관용적으로 압축해도 의미 손실이 크지 않습니다.
  doctrine_reference: 본문 의미 보존을 위한 관용적 반복 표현
