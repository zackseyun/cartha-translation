    rationale: 통용되는 한국어 성경 용어와 거리가 있고, 특히 히브리어 향료 명칭의 전통적 대응을 불명료하게 합니다.
  - severity: low
    issue: 향료 명칭의 식별 불확실성에 관한 주석 부재
    rationale: 나답과 소합향의 정확한 물질 식별은 불확실하므로, 영어 POB 감사 기록과 같이 이를 밝혀야 합니다.
