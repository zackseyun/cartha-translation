  source_fidelity: ‘향기로운 약초’는 סַמִּים의 의미를 지나치게 좁혀 식물성 약초로 한정합니다. 이 문맥에서는 향 제조에 쓰이는 향료/향품이 적절합니다. 또한 세 향료의 음역 표기는 통용성과 식별성이 낮습니다. 전통적 명칭을 쓰되, 나답과 소합향의 정확한 물질 동일시는 불확실하다는 주석을 두는 것이 원문의 불확실성을 보존합니다.
  naturalness: 수정문은 현대 표준어와 합쇼체를 사용하며, 명령문과 서술문의 관계가 자연스럽습니다. ‘각각 같은 양으로 하라’보다 ‘각각 같은 분량이 되게 하십시오’가 히브리어의 ‘부분과 부분이 같게’라는 뜻을 더 명료하게 드러냅니다.
  terminology: יְהוָה는 영어 POB의 선택을 따라 ‘야훼’로 유지했습니다. סַמִּים은 ‘향품’, לְבוֹנָה זַכָּה는 ‘순수한 유향’으로 옮겼습니다. 나답·소합향·풍자향은 한국어 성경 번역 전통에서 널리 쓰인 명칭이며, 앞의 두 물질의 식별 불확실성은 주석으로 처리했습니다.
  issues:
