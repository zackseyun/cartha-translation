  source_fidelity: 히브리어의 의무적 용법, 손과 발을 씻는 행위, 죽음을 피하는 결과, 그리고 아론과 그의 자손에게 세대에 걸쳐 적용되는 규례라는 핵심은 대체로 충실합니다. 다만 원문의 대명사 지시 대상과 חָק עוֹלָם의 수식 관계에 맞춰 주석 표지를 바로잡아야 합니다.
  naturalness: ‘자기들의 손과 발’은 현대 표준 한국어에서 다소 어색하므로 ‘그들의 손과 발’이 자연스럽습니다. 또한 ‘그들과 그와 그의 자손에게’는 반복적이고 불명료하므로, 원문의 관계를 보존하면서 ‘그들, 곧 그와 그의 자손에게’로 다듬는 것이 좋습니다.
  terminology: חָק עוֹלָם은 ‘영속하는 규례’로 옮겨 제의·법률 문맥에서 지속되는 규례라는 뜻을 자연스럽게 드러냈습니다. ‘영원한 규례’와 ‘영구한 규례’는 주석에서 가능한 대안으로 제시합니다.
