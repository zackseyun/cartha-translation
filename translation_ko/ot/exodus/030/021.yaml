id: EXO.30.21
reference: Exodus 30:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/רָחֲצ֛וּ יְדֵי/הֶ֥ם וְ/רַגְלֵי/הֶ֖ם וְ/לֹ֣א יָמֻ֑תוּ וְ/הָיְתָ֨ה לָ/הֶ֧ם חָק עוֹלָ֛ם ל֥/וֹ וּ/לְ/זַרְע֖/וֹ לְ/דֹרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
  footnotes:
  - marker: a
    text: Or 'everlasting statute' or 'perpetual statute.' The Hebrew phrase is חָק עוֹלָם, a standard legal formula for an enduring ordinance.
    reason: lexical_alternative
  - marker: b
    text: '''For him'' refers to Aaron in the immediate context.'
    reason: cross_reference
translation:
  language: ko
  text: 그들은 그들의 손과 발을 씻어야 합니다. 그래야 죽지 않을 것입니다. 이것은 그들, 곧 그[a]와 그의 자손에게 대대로 영속하는 규례[b]가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그’는 바로 앞 문맥의 아론을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘영원한 규례’ 또는 ‘영구한 규례’. 히브리어 표현 חָק עוֹלָם은 지속되는 규례를 가리키는 표준적인 법률 공식입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  english_pob_choice: they shall wash
  chosen_korean: 씻어야 합니다
  alternatives_korean:
  - 씻습니다
  - 씻을 것입니다
  lexicon: HALOT
  rationale: 법령 문맥의 의무·명령을 한국어 합쇼체로 자연스럽게 옮겼습니다. '해야 합니다'는 예고적 미래보다 규범적 강제를 분명히 드러냅니다.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  english_pob_choice: their hands and their feet
  chosen_korean: 자기들의 손과 발
  alternatives_korean:
  - 그들의 손과 발
  - 손과 발
  lexicon: HALOT
  rationale: 히브리어의 3인칭 복수 소유격을 보존하면서, 반복을 줄여 한국어 문장 흐름을 살렸습니다. 제의적 정결 행위의 구체성을 유지하기 위해 부위는 직역했습니다.
- source_word: חָק עוֹלָם
  english_pob_choice: permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영구한 규례
  - 항구한 규례
  - permanent statute
  lexicon: HALOT
  rationale: 법규 공식어를 한국어 성경 문체에 맞게 '규례'로 옮기되, עוֹלָם의 지속성을 '영원한'으로 살렸습니다. 이 표현은 단순한 일시 규정이 아니라 지속적 제도임을 드러냅니다.
- source_word: ל֥וֹ וּלְזַרְע֖וֹ
  english_pob_choice: for him and for his offspring
  chosen_korean: 그들과 그와 그의 자손에게
  alternatives_korean:
  - 그와 그의 자손에게
  - 아론과 그의 자손에게
  - 그와 그의 후손에게
  lexicon: HALOT
  rationale: 영어 POB의 주석대로 단수 대명사 '그'는 문맥상 아론을 가리킵니다. 앞의 복수 주어와 뒤의 단수 수혜 대상을 함께 살리기 위해 '그들과 그와 그의 자손에게'로 구분해 옮겼습니다.
theological_decisions:
- issue: חָק עוֹלָם의 지속 범위
  chosen_reading: 제의적·언약적 지속성을 지닌 영원한 규례
  alternative_readings:
  - 영원히 모든 시대에 동일하게 적용되는 규례
  - 단순히 오래 지속되는 규례
  rationale: 이 문구는 이스라엘의 예배 질서 안에서 지속되는 법정식 표현입니다. 한국어로는 '영원한 규례'를 사용하되, 적용 범위를 역사적·언약적 문맥 안에서 이해하도록 했습니다.
  doctrine_reference: 출애굽기 30장 제의 규례의 언약적 문맥
