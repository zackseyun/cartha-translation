    rationale: 히브리어는 ‘내가 այնտեղ 너와 만날 회막 안에 있는 증거 앞에’라는 구조입니다. 회막이 ‘증거판 앞’을 동격으로 설명하는 것처럼 읽히지 않게 재배열해야 합니다.
  - severity: low
