    rationale: קֹדֶשׁ קָדָשִׁים은 문자적으로 ‘거룩한 것들 중 가장 거룩한 것’의 강조 구조입니다. ‘거룩한 것 중의 거룩한 것’이 더 정확합니다.
  revised_text: 그것 가운데 일부를 아주 곱게 빻아서, 내가 այնտեղ 너와 만날 회막 안의 증거 앞에 두십시오. 그것은 너희에게 지극히 거룩한 것이 될 것입니다.[a]
