id: EXO.30.36
reference: Exodus 30:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
  footnotes:
  - marker: a
    text: Or, more literally, 'holy of holies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것 가운데 일부를 아주 곱게 빻아서, 내가 այնտեղ 너와 만날 회막 안의 증거 앞에 두십시오. 그것은 너희에게 지극히 거룩한 것이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 더 문자적으로는 ‘거룩한 것 중의 거룩한 것’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַקְתָּ
  english_pob_choice: you shall grind
  chosen_korean: 곱게 빻아
  alternatives_korean:
  - 갈아
  - 부수어
  lexicon: HALOT
  rationale: 향료를 가루로 만드는 물리적 동작을 자연스럽게 살리면서도, 단순히 부수는 느낌보다 제의적 준비에 더 맞는 표현을 택했습니다.
- source_word: הָדֵק
  english_pob_choice: very fine
  chosen_korean: 곱게
  alternatives_korean:
  - 아주 곱게
  - 아주 가늘게
  lexicon: HALOT
  rationale: 뒤의 동작을 수식하는 강한 정도를 살리되, 한국어에서 중복이 되지 않도록 간결하게 처리했습니다.
- source_word: לִפְנֵי הָעֵדֻת
  english_pob_choice: before the testimony
  chosen_korean: 증거판 앞
  alternatives_korean:
  - 증거 앞
  - 증거궤 앞
  lexicon: HALOT
  rationale: 문자적으로는 ‘증거’이지만, 회막 제의 문맥에서 한국어 독자가 이해하기 쉽도록 ‘증거판’으로 옮겨, 대상이 된 언약 증거와의 연결을 드러냈습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막 안에
  alternatives_korean:
  - 만남의 장막 안에
  - 회중의 장막 안에
  lexicon: HALOT
  rationale: 전통적으로 굳어진 ‘회막’을 사용하되, 위치 관계를 분명히 하기 위해 ‘안에’를 덧붙였습니다.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  english_pob_choice: where I will meet with you
  chosen_korean: 곧 내가 너와 만날
  alternatives_korean:
  - 내가 너를 만나기로 한 곳인
  - 내가 너와 만나게 될
  lexicon: HALOT
  rationale: ‘만나다’의 약속적 의미를 살리면서도 한국어 어순에 맞게 풀었습니다. ‘곧’은 앞의 장소를 다시 설명하는 연결어로 사용했습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩한
  alternatives_korean:
  - 가장 거룩한
  - 지성소 같은 거룩한
  lexicon: HALOT
  rationale: 히브리어의 최상급을 한국어 형용사로 자연스럽게 옮겼습니다. 전통적 관용구 ‘지성소’는 공간 명칭이므로 본문에는 쓰지 않았습니다.
theological_decisions:
- issue: ‘증거’의 구체성
  chosen_reading: ‘증거판’으로 옮기되, 본문에서 별도의 해설을 덧붙이지 않았습니다.
  alternative_readings:
  - 증거 앞
  - 언약 증거 앞
  rationale: 히브리어는 단순히 ‘증거’를 말하지만, 성막 문맥에서 무엇을 가리키는지 한국어 독자가 바로 떠올리기 어렵기 때문에, 과도한 해석 없이 최소한의 구체화를 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘지극히 거룩한’의 최상급 표현
  chosen_reading: קֹדֶשׁ קָדָשִׁים을 ‘지극히 거룩한’으로 번역했습니다.
  alternative_readings:
  - 가장 거룩한
  - 지성소의 거룩함
  rationale: 제의적 최상급을 살리면서도 현대 한국어에서 자연스럽고 읽기 쉬운 표현을 우선했습니다. 전통적 공간명칭으로 오해되지 않도록 본문에서는 명사구를 피했습니다.
  doctrine_reference: Translation philosophy §6
