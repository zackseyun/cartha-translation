  to: 너는 그것을 증거궤[b] 앞에 있는 휘장 앞, 곧 증거를 덮고 있는 속죄소[a] 앞에 두어야 합니다. 내가 거기에서 너와 만나겠습니다.
  rationale: 원문의 두 병렬 공간 구문을 올바른 순서로 복원했습니다. ‘증거를 덮고 있는 속죄소’는 הָעֵדֻת 위에 있는 כַּפֹּרֶת의 관계를 보존하되, 한국어에서 어색한 ‘증거 위에 있는’을 피한 표현입니다. 명령과 하나님의 약속은 현대 합쇼체 문장으로 분리하여 명료하게 했습니다.
