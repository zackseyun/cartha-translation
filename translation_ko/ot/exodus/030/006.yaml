  source_fidelity: 현 초안은 히브리어의 공간 관계를 재배열하여 ‘휘장’이 ‘증거궤 앞’에 있고 ‘속죄소’가 ‘증거 위’에 있다는 두 수식 관계가 뒤바뀌었습니다. 원문은 먼저 ‘증거궤 앞에 있는 휘장 앞’을, 이어 ‘증거 위에 있는 속죄소 앞’을 말합니다. 또한 אִוָּעֵד לְךָ שָׁמָּה는 ‘내가 거기에서 너와 만나겠습니다’로 자연스럽게 옮길 수 있습니다.
  naturalness: 수정문은 반복되는 לִפְנֵי의 공간 관계를 ‘앞에’로 일관되게 드러내면서도 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘증거를 덮고 있는’은 ‘증거 위에 있는’의 물리적 관계를 한국어에서 더 자연스럽게 표현한 것입니다.
