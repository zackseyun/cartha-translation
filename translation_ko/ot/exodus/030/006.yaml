id: EXO.30.6
reference: Exodus 30:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתָּ֤ה אֹת/וֹ֙ לִ/פְנֵ֣י הַ/פָּרֹ֔כֶת אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת אֲשֶׁר֙ עַל הָ֣/עֵדֻ֔ת אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
  footnotes:
  - marker: a
    text: Or, 'the atonement cover.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the ark of the testimony' ... 'the testimony'; traditional English often has 'ark of the covenant,' but the word here is 'testimony.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그것을 증거궤 앞 곧 증거궤 위의 속죄소 앞, 휘장 앞에 두어야 하며, 거기에서 내가 너와 만나겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄 덮개’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 ‘증거궤’와 ‘증거’를 말하며, 전통 번역의 ‘언약궤’는 이 본문의 히브리어와 다릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  english_pob_choice: And you shall place
  chosen_korean: 두어야 하며
  alternatives_korean:
  - 놓아야 하며
  - 두십시오
  lexicon: HALOT
  rationale: 조리 있게 지시를 전달하면서도, 제의적 배치 동작을 자연스러운 현대 한국어로 옮기기 위해 ‘두다’를 썼습니다.
- source_word: לִפְנֵי
  english_pob_choice: before / in front of
  chosen_korean: 앞에
  alternatives_korean:
  - 전에
  - 면전에
  lexicon: HALOT
  rationale: 두 번 반복되는 공간 관계를 한국어의 가장 직접적인 표현인 ‘앞에’로 살렸습니다.
- source_word: אֲרֹן הָעֵדֻת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증거의 궤
  - 증언궤
  lexicon: HALOT
  rationale: POB의 ‘testimony’를 따라 ‘증거’로 옮기되, 한국어 교회 용례와 가독성을 고려해 합성어 ‘증거궤’를 사용했습니다.
- source_word: הַכַּפֹּרֶת
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 자비의 자리
  - 은혜자리
  lexicon: HALOT
  rationale: 히브리어 כפרת의 제의적 의미를 분명히 드러내기 위해, 단순 직역보다 기능을 반영한 ‘속죄소’를 본문에 두었습니다.
theological_decisions:
- issue: כפרת의 한국어 처리
  chosen_reading: 본문에는 ‘속죄소’를 두고, 영어 POB의 ‘mercy seat’에 대응하는 전통 용어를 한국어 독자에게는 제의 기능이 분명한 형태로 제시했습니다.
  alternative_readings:
  - 시은좌
  - 긍휼의 자리
  rationale: 이 절은 언약궤 위 덮개를 가리키는 성막 문맥이므로, 단순한 정서어보다 속죄 기능을 드러내는 용어가 원문 의미를 더 직접적으로 전달합니다.
  doctrine_reference: 출애굽기 25:17-22; 번역 원칙 1, 6
- issue: 이동 동사와 만남의 표현
  chosen_reading: ‘거기에서 내가 너와 만나겠습니다’
  alternative_readings:
  - 내가 거기서 너와 만나겠습니다
  - 내가 너를 만나겠습니다
  rationale: אִוָּעֵד의 ‘정해진 만남’ 뉘앙스를 살리면서도, 성막에서의 계시적 만남을 자연스러운 현대 한국어로 표현했습니다.
  doctrine_reference: 출애굽기 29:42-43; 번역 원칙 1, 5
