source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
  footnotes:
  - marker: a
    text: Or "for your souls"; Hebrew nephesh can mean soul, self, person, or life. In this census-payment context, the sense is likely the lives/persons of the people counted.
    reason: lexical_alternative
translation:
  language: ko
  text: 부자는 반 세겔보다 더 많이 내서는 안 되며, 가난한 자는 반 세겔보다 더 적게 내서도 안 됩니다. 여러분의 생명을[a] 위하여 속죄하기 위해 야훼께 드리는 헌물을 내야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 네페쉬(נֶפֶשׁ)는 ‘영혼’, ‘자기’, ‘사람’, ‘생명’을 가리킬 수 있습니다. 여기서는 인구 조사 때의 속전 문맥이므로, 계수된 사람들의 생명 또는 사람 자체를 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  english_pob_choice: the rich
  chosen_korean: 부자
  alternatives_korean:
  - 부유한 사람
  - 부자 사람
  lexicon: HALOT
  rationale: 관사와 결합한 명사적 표현으로 계층을 가리키므로, 문맥의 대조를 살려 자연스러운 현대어인 ‘부자’로 옮겼습니다.
- source_word: יַרְבֶּה / יַמְעִיט
  english_pob_choice: shall not give more / shall not give less
  chosen_korean: 더 많이 내지 말고 / 더 적게 내지 말아야 합니다
  alternatives_korean:
  - 더 늘리지 말고 / 더 줄이지 말아야 합니다
  - 더 보태지 말고 / 덜 내지 말아야 합니다
  lexicon: HALOT
  rationale: 정해진 금액의 납부라는 문맥이므로, 동작을 ‘증가/감소’보다 ‘더 많이/더 적게 내다’로 풀어 법적 균형을 한국어로 분명하게 나타냈습니다.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  english_pob_choice: than the half-shekel
  chosen_korean: 반 세겔
  alternatives_korean:
  - 반 세겔보다
  - 반 세겔에서
  lexicon: HALOT
  rationale: 앞의 부정 명령과 결합된 비교 의미를 한국어에서는 금액 자체를 직접 제시하는 방식으로 자연스럽게 표현할 수 있어 ‘반 세겔’로 처리했습니다.
- source_word: תְּרוּמַת יְהוָה
  english_pob_choice: the contribution to Yahweh
  chosen_korean: 야훼께 드리는 예물
  alternatives_korean:
  - 야훼께 드리는 헌납
  - 야훼의 헌물
  lexicon: HALOT
  rationale: תְּרוּמָה는 성소에 구별해 바치는 헌납물이지만, 인구조사 속전 문맥에서는 제사 제물보다 ‘드리는 예물’이 더 정확하며, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: לְכַפֵּר עַל נַפְשֹׁתֵיכֶם
  english_pob_choice: to make atonement for your lives
  chosen_korean: 여러분의 생명을 속죄해야 합니다
  alternatives_korean:
  - 여러분의 생명을 속죄해야 합니다
  - 여러분의 삶을 속죄해야 합니다
  - 여러분 자신을 속죄해야 합니다
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 영혼론적 ‘혼’보다 사람의 생명/존재를 가리키므로 ‘생명’으로 옮겼고, כפר는 이 문맥의 제의적 용법을 살려 ‘속죄하다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 신적 고유명으로서 ‘야훼’를 유지해 호칭이 아닌 이름의 성격을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH → 야훼'
- issue: נֶפֶשׁ의 범위
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  - 목숨
  - 사람
  rationale: 인구조사 속전과 속죄의 결합에서 נֶפֶשׁ은 추상적 영혼 교리보다 각 사람의 생명/존재를 가리키므로, 문맥상 가장 구체적인 ‘생명’으로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
