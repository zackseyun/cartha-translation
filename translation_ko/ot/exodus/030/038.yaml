  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
  footnotes:
  - marker: a
    text: Or 'to enjoy its fragrance' / 'to smell its aroma.' The Hebrew infinitive expresses making such incense for personal smelling or enjoyment.
    reason: lexical_alternative
  - marker: b
    text: '''Shall be cut off from his people'' is a standard legal formula. It may imply death, expulsion, or divine removal, depending on context.'
