  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
  footnotes:
  - marker: a
    text: Or 'to enjoy its fragrance' / 'to smell its aroma.' The Hebrew infinitive expresses making such incense for personal smelling or enjoyment.
    reason: lexical_alternative
  - marker: b
    text: '''Shall be cut off from his people'' is a standard legal formula. It may imply death, expulsion, or divine removal, depending on context.'
    reason: alternative_reading
translation:
  language: ko
  text: 누구든지 그것과 같은 것을 만들어 그것의 향기를 맡으려 하면, 그는 자기 백성 가운데서 끊어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이동사 ריח의 부정사구는 여기서 향을 단순히 ‘냄새 맡다’는 뜻뿐 아니라 ‘향기를 즐기다’는 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''끊어질 것입니다''는 히브리어의 표준 법률 표현입니다. 문맥에 따라 죽음, 추방, 또는 하나님의 심판적 제거를 포함할 수 있습니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  english_pob_choice: Whoever
  chosen_korean: 누구든지
  alternatives_korean:
  - 어떤 사람이든지
  - 그 사람이
  lexicon: HALOT
  rationale: 법률 문맥에서 조건을 충족하는 사람을 포괄적으로 가리키므로, 문자적 '남자'보다 대표적 의미를 살린 '누구든지'가 자연스럽고 정확합니다.
- source_word: כָמֹהָ
  english_pob_choice: any like it
  chosen_korean: 그것과 같은 것을
  alternatives_korean:
  - 그와 같은 것을
  - 비슷한 것을
  lexicon: HALOT
  rationale: 앞의 거룩한 향 제조법과 동일하거나 유사한 향을 가리키므로, 비교 대상을 분명히 하는 '그것과 같은 것'으로 옮겼습니다.
- source_word: לְהָרִיחַ בָּהּ
  english_pob_choice: to smell it
  chosen_korean: 그것의 향기를 맡으려 하면
  alternatives_korean:
  - 그것을 맡으려 하면
  - 그 향기를 즐기려 하면
  lexicon: HALOT
  rationale: 히브리어 부정사구는 단순한 냄새 맡기보다 향을 즐기거나 맡는 목적을 나타낼 수 있으나, 본문의 직접성을 살려 '향기를 맡으려 하면'으로 옮겼습니다.
- source_word: וְנִכְרַת מֵעַמָּיו
  english_pob_choice: shall be cut off from his people
  chosen_korean: 자기 백성 가운데서 끊어질 것입니다
  alternatives_korean:
  - 자기 백성 가운데서 끊어질 것입니다
  - 자기 백성에서 끊어질 것입니다
  - 자기 백성에게서 끊어질 것입니다
  lexicon: HALOT
  rationale: 히브리어의 법적 판결식을 그대로 살리기 위해 원문의 관용적 형벌 표현을 직역에 가깝게 유지했습니다. '가운데서'는 공동체적 소속의 상실을 드러냅니다.
theological_decisions:
- issue: וְנִכְרַת의 형벌 의미를 어떻게 드러낼지
  chosen_reading: '''끊어질 것입니다''로 두어, 죽음·추방·하나님의 제거 가능성을 하나로 확정하지 않고 형벌의 무게를 보존했습니다.'
  alternative_readings:
  - '''죽임을 당할 것입니다'''
  - '''공동체에서 제외될 것입니다'''
  - '''하나님께서 제거하실 것입니다'''
  rationale: 이 표현은 성경의 법률 문맥에서 중대한 제재를 뜻하지만, 구체적 집행 방식은 문맥마다 달라질 수 있습니다. 본문이 열어 둔 긴장을 해치지 않기 위해 판정어를 고정하지 않았습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
