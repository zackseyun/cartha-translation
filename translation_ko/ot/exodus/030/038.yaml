translation:
  language: ko
  text: 누구든지 그것과 같은 것을 만들어 그 향기를 맡으려는 자는 자기 백성 가운데서 끊어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ריח의 부정사구는 이와 같은 향을 개인적으로 맡는 목적을 나타냅니다. ‘그 향기를 즐기려고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 백성 가운데서 끊어질 것입니다’는 히브리어의 표준 법률 표현입니다. 문맥에 따라 죽음, 추방, 또는 하나님의 심판적 제거를 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
