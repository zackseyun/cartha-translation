  lexicon: HALOT
  rationale: 앞의 거룩한 향 제조법과 동일하거나 유사한 향을 가리키므로, 비교 대상을 분명히 하는 '그것과 같은 것'으로 옮겼습니다.
- source_word: לְהָרִיחַ בָּהּ
