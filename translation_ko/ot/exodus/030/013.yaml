base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
  footnotes:
  - marker: a
    text: Or 'everyone who passes among those registered'; the Hebrew expression is a census idiom for those entering the official count.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 징수 대상에 들어가는 사람마다 바쳐야 할 몫입니다. 곧 성소의 세겔로 반 세겔을 바치되 — 세겔은 스무 게라입니다 — 야훼께 드리는 예물로서 반 세겔입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘징수 대상에 들어가는 사람’은 히브리어의 인구조사 관용구를 옮긴 것입니다. 직역하면 ‘계수된 자들 가운데 지나가는 사람’에 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: זֶה
  english_pob_choice: This is what
  chosen_korean: 이것은
  alternatives_korean:
  - 이것이
  - 이것
  lexicon: HALOT
  rationale: 지시문의 도입부를 자연스러운 한국어로 옮기되, 명령형 법문체의 지시성을 유지했습니다.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  english_pob_choice: everyone who passes over to those who are numbered
  chosen_korean: 징수 대상에 들어가는 사람마다
  alternatives_korean:
  - 등록된 사람들 가운데 지나가는 사람마다
  - 계수된 자들 가운데 지나가는 사람마다
  - 계수된 사람마다
  lexicon: HALOT
  rationale: 히브리어의 인구조사 관용구를 한국어로 직역하면 부자연스러워서, ‘징수 대상’으로 그 기능적 의미를 살리고 ‘사람마다’로 범위를 분명히 했습니다.
- source_word: מַחֲצִית הַשֶּׁקֶל
  english_pob_choice: half a shekel
  chosen_korean: 반 세겔
  alternatives_korean:
  - 세겔 반
  - 한 반 세겔
  lexicon: HALOT
  rationale: 화폐 단위를 간결하게 유지하되 수량의 핵심을 분명히 하는 표현으로 옮겼습니다.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  english_pob_choice: according to the sanctuary shekel
  chosen_korean: 성소의 세겔로
  alternatives_korean:
  - 성소 세겔에 따라
  - 성소 표준 세겔로
  - 거룩한 세겔로
  lexicon: HALOT
  rationale: בְּ는 기준·척도의 의미이므로, 한국어 조사 ‘-로’로 표준 단위를 나타냈습니다. ‘성소의 세겔’은 기술적 기준 단위를 비교적 자연스럽게 보존합니다.
- source_word: תְּרוּמָה לַיהוָה
  english_pob_choice: as an offering to Yahweh
  chosen_korean: 야훼께 드리는 예물
  alternatives_korean:
  - 야훼께 드리는 헌물
  - 야훼께 바치는 봉헌물
  - 야훼께 드리는 헌금
  lexicon: HALOT
  rationale: תְּרוּמָה는 단순한 금전이 아니라 하나님께 따로 드리는 봉헌물을 가리키므로, 교회적 관용보다 넓고 직접적인 ‘예물’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공통 번역 관례의 대체어보다 신명기의 고유명을 직접 옮기는 원칙에 따라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 인구조사 관용구의 직역 여부
  chosen_reading: 의미 기능을 살린 ‘징수 대상에 들어가는 사람마다’로 옮겼습니다.
  alternative_readings:
  - ‘계수된 자들 가운데 지나가는 사람마다’로 더 직역
  - ‘등록된 사람마다’로 평탄화
  rationale: 히브리어 표현은 문자 그대로의 이동을 말하기보다 계수/등록 절차에 들어가는 사람을 가리키는 관용구이므로, 한국어 독자가 법문맥을 즉시 이해하도록 기능적 의미를 반영했습니다.
  doctrine_reference: '번역 원칙: 원문 관용구의 기능적 의미 보존'
- issue: 야훼의 이름 표기
  chosen_reading: 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘여호와’로 전통적 표기
  - ‘주님’으로 대체
  rationale: 본문에 יְהוָה가 직접 나오므로, 호칭 대체 없이 고유명을 드러내는 것이 원문이 지닌 언약적 명명성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
