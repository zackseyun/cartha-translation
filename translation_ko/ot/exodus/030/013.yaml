theological_decisions:
- issue: 인구조사 관용구의 직역 여부
  chosen_reading: 의미 기능을 살린 ‘징수 대상에 들어가는 사람마다’로 옮겼습니다.
  alternative_readings:
  - ‘계수된 자들 가운데 지나가는 사람마다’로 더 직역
  - ‘등록된 사람마다’로 평탄화
  rationale: 히브리어 표현은 문자 그대로의 이동을 말하기보다 계수/등록 절차에 들어가는 사람을 가리키는 관용구이므로, 한국어 독자가 법문맥을 즉시 이해하도록 기능적 의미를 반영했습니다.
  doctrine_reference: '번역 원칙: 원문 관용구의 기능적 의미 보존'
- issue: 야훼의 이름 표기
  chosen_reading: 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘여호와’로 전통적 표기
  - ‘주님’으로 대체
  rationale: 본문에 יְהוָה가 직접 나오므로, 호칭 대체 없이 고유명을 드러내는 것이 원문이 지닌 언약적 명명성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
