  rationale: 여기서는 아론의 남계 제사장 후손을 가리키므로, 성별이 분명한 ‘아들들’이 원문의 정확성을 더 잘 반영합니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: from it
  chosen_korean: 그 물로
  alternatives_korean:
  - 그것으로부터
  - 그 물에서
  lexicon: HALOT
  rationale: 히브리어 מן + 대명사 접사는 본문 문맥상 물두멍의 물을 가리키므로, 한국어에서는 ‘그 물로’가 가장 자연스럽고 기능적으로도 정확합니다.
- source_word: אֶת יְדֵיהֶם ... וְאֶת רַגְלֵיהֶם
