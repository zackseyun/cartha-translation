  - ‘후손들’로 확대
  rationale: 본문은 회막 봉사에 참여하는 아론의 남성 제사장 계열을 지칭하므로, 성별을 완화하지 않고 원문의 지시 대상을 분명히 하는 것이 적절합니다.
