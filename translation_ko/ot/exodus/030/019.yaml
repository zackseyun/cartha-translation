lexical_decisions:
- source_word: וְרָחֲצוּ
  english_pob_choice: shall wash
  chosen_korean: 씻어야 합니다
  alternatives_korean:
  - 씻습니다
  - 반드시 씻어야 합니다
  lexicon: HALOT
  rationale: 규정·지시문의 העתיד/명령적 기능을 살려 의무성을 나타내되, 문어체 합쇼체에 맞게 과도하게 단정적이지 않게 옮겼습니다.
- source_word: אַהֲרֹן וּבָנָיו
  english_pob_choice: Aaron and his sons
  chosen_korean: 아론과 그의 아들들
  alternatives_korean:
