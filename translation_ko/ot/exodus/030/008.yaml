    reason: lexical_alternative
translation:
  language: ko
  text: 아론이 해질 무렵[a]에 등잔들을 정돈할 때에는, 여러분의 대대에 걸쳐 야훼 앞에서 정기적으로 드리는 향[b]을 피워 올려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘두 저녁 사이’라는 관용구로, 해질 무렵을 가리킵니다.
    reason: lexical_alternative
