reference: Exodus 30:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/הַעֲלֹ֨ת אַהֲרֹ֧ן אֶת הַ/נֵּרֹ֛ת בֵּ֥ין הָ/עֲרְבַּ֖יִם יַקְטִירֶ֑/נָּה קְטֹ֧רֶת תָּמִ֛יד לִ/פְנֵ֥י יְהוָ֖ה לְ/דֹרֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
  footnotes:
  - marker: a
    text: 'Hebrew: ''between the evenings,'' an idiom for the twilight/evening period.'
    reason: lexical_alternative
  - marker: b
    text: Or 'continual incense.' The Hebrew term can emphasize ongoing regularity or perpetuity in the prescribed offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론이 해질 무렵에 등잔들을 정돈할 때, 그는 그것을 피워 올려야 합니다. 그것은 여러분의 대대로 야훼 앞에 드리는 규정된 향입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘두 저녁 사이’라는 관용구로, 해질 무렵을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘계속되는 향’으로 옮길 수 있습니다. 히브리어는 반복적·지속적 규례를 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  english_pob_choice: And when ... sets up
  chosen_korean: 정돈할 때
  alternatives_korean:
  - 켜 올릴 때
  - 등잔을 올릴 때
  lexicon: HALOT
  rationale: 등잔에 대한 제의 문맥에서 ‘sets up’는 단순 점화보다 예배용 등잔을 알맞게 배치·준비하는 뜻을 담으므로, 한국어로는 ‘정돈할 때’가 그 의례적 뉘앙스를 잘 살립니다.
- source_word: בֵּין הָעַרְבַּיִם
  english_pob_choice: at twilight
  chosen_korean: 해질 무렵에
  alternatives_korean:
  - 두 저녁 사이에
  - 황혼에
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 뜻은 주석으로 남기되, 본문은 현대 한국어에서 자연스러운 시간 표현인 ‘해질 무렵’으로 옮겨 의미를 분명히 했습니다.
- source_word: יַקְטִירֶנָּה קְטֹרֶת
  english_pob_choice: he shall burn it, a regular incense
  chosen_korean: 그는 그것을 피워 올려야 합니다. 그것은 ... 규정된 향입니다
  alternatives_korean:
  - 그는 그것을 향으로 불살라야 합니다
  - 그는 그것을 계속 향으로 피워야 합니다
  lexicon: HALOT
  rationale: קטר는 향을 ‘피우다/피워 올리다’의 제의적 표현이므로 ‘피워 올려야 합니다’로 옮겼고, קְטֹרֶת는 ‘향’으로, תָּמִיד은 규례상의 반복성을 드러내는 ‘규정된’으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 여호와 앞에
  - 주님 앞에
  lexicon: HALOT
  rationale: 본문의 신명은 번역 관례적 대체어가 아니라 고유명사로 드러내기 위해 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: תָּמִיד의 범위
  chosen_reading: ‘규정된’으로 옮겨, 향이 의식상 반복되는 정기 제물임을 드러냈습니다.
  alternative_readings:
  - ‘항상’
  - ‘계속’
  - ‘영원한’
  rationale: 이 문맥에서 תמיד는 문자적 무시간적 지속보다 성막 예식의 정기성과 지속적 규례를 가리키므로, 과도한 절대성을 피하고 제의적 의미를 살렸습니다.
  doctrine_reference: 출 30:8 제의 규례 문맥
- issue: 야훼의 표기
  chosen_reading: 본문에 ‘야훼’를 유지했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 히브리어 המקרא의 고유 신명 יְהוָה를 가려버리지 않고 드러내려는 원칙에 따라, 제목어 대체를 쓰지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
