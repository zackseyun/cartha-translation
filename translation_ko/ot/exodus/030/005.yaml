  yaml_path: translation/ot/exodus/030/005.yaml
  text: And you shall make the poles of acacia wood and overlay them with gold.
translation:
  language: ko
  text: 너는 조각목으로 그 막대들을 만들고, 그것들을 금으로 입혀야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 만들어야 합니다
  alternatives_korean:
  - 만드십시오
  - 만들어야 하십니다
  lexicon: HALOT
  rationale: 지시문맥의 연속된 명령을 자연스러운 합쇼체로 옮겼습니다. "shall"의 규범적 힘을 살리되, 한국어에서는 미래형보다 의무형이 더 직접적입니다.
- source_word: הַבַּדִּים
  english_pob_choice: the poles
  chosen_korean: 그 막대들
  alternatives_korean:
  - 그 장대들
  - 그 운반 막대들
  - 그 채들
  lexicon: HALOT
  rationale: 성막 기구를 메는 용도의 긴 막대를 현대 한국어로 풀어 옮겼습니다. "막대"가 가장 자연스럽고, 문맥상 운반용임이 앞뒤에서 분명하므로 설명을 과하게 늘리지 않았습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 조각목으로
  alternatives_korean:
  - 아카시아 목재로
  - 싯딤 나무로
  lexicon: HALOT
  rationale: 성막 용어의 관용적 한국어인 "조각목"을 사용해 원문의 특정 목재를 반영했습니다. 식물명 자체를 풀어 쓰는 대신, 전통적이면서도 본문-정확한 재료명을 택했습니다.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  english_pob_choice: and overlay them with gold
  chosen_korean: 그것들을 금으로 입혀야 합니다
  alternatives_korean:
  - 그것들에 금을 입혀야 합니다
  - 그것들을 금으로 덮어야 합니다
  lexicon: HALOT
  rationale: צפה의 공예적 의미를 한국어 "입히다"로 옮겨 금을 겉에 입히는 제작 행위를 자연스럽게 표현했습니다. "덮다"보다 제작 맥락이 더 분명하고, "금으로"는 재료를 직접 드러냅니다.
