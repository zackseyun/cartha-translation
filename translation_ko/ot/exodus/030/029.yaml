source:
  edition: WLC
  text: וְ/קִדַּשְׁתָּ֣ אֹתָ֔/ם וְ/הָי֖וּ קֹ֣דֶשׁ קָֽדָשִׁ֑ים כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִקְדָּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
  footnotes:
  - marker: a
    text: Or, more literally, 'shall be holy' or 'shall be consecrated.' The Hebrew may denote becoming holy through contact.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들을 거룩하게 구별하십시오. 그것들은 지극히 거룩한 것들이 될 것입니다. 그것들에 닿는 것은 무엇이든 거룩하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩하게 될 것입니다’는 히브리어 יִקְדָּשׁ의 결과 상태를 따른 번역입니다. 문맥상 ‘거룩한 상태가 될 것입니다’ 또는 ‘성별될 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  english_pob_choice: You shall consecrate
  chosen_korean: 거룩하게 구별해야 합니다
  alternatives_korean:
  - 성별해야 합니다
  - 봉헌해야 합니다
  - 거룩하게 해야 합니다
  lexicon: HALOT
  rationale: Piel קדשׁ는 성소 문맥에서 ‘거룩하게 구별하여 바치다’는 뜻이므로, 현대 한국어에서는 ‘거룩하게 구별하다’가 제의적 구별의 의미를 가장 분명하게 드러냅니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩한 것
  alternatives_korean:
  - 가장 거룩한 것
  - 지성소 같은 것
  - 거룩 중의 거룩한 것
  lexicon: HALOT
  rationale: 히브리어의 최상급 결합을 공간명칭으로 오해하지 않도록, 상태를 나타내는 ‘지극히 거룩한’으로 옮겼습니다.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם יִקְדָּשׁ
  english_pob_choice: Whatever touches them shall become holy
  chosen_korean: 그것에 닿는 것은 무엇이나 거룩하게 됩니다
  alternatives_korean:
  - 그것들을 만지는 것은 모두 거룩해집니다
  - 그것에 접촉하는 것은 무엇이나 거룩해집니다
  lexicon: HALOT
  rationale: 누구에게나 열려 있는 일반법 표현이므로 ‘무엇이나’로 넓게 살리고, יִקְדָּשׁ는 상태 변화의 의미를 살려 ‘거룩하게 됩니다’로 옮겼습니다.
theological_decisions:
- issue: 접촉으로 말미암는 ‘거룩함’의 성격
  chosen_reading: 본문은 접촉한 대상이 ‘거룩하게 된다’고만 말하며, 그 거룩함이 유익한지 또는 경계가 필요한지는 해석으로 덧붙이지 않았습니다.
  alternative_readings:
  - 접촉자가 긍정적으로 성별됨
  - 거룩의 영역에 들어가 위험과 제한을 함께 받음
  rationale: 히브리어는 결과만 진술하므로, 본문이 열어 둔 신학적 긴장을 해소하지 않고 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
