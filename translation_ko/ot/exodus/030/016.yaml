  source_fidelity: 수정이 필요합니다. 히브리어의 첫 두 동사는 모세에게 향한 남성 단수이므로 ‘너희는 … 드려야 합니다’보다 ‘당신은 … 두십시오’가 형태상 정확합니다. 마지막 ‘너희’는 이스라엘 자손 전체를 가리키는 복수로 유지할 수 있습니다. 또한 לְזִכָּרוֹן은 여기서 물질적 ‘기념물’이라기보다 야훼 앞에서의 ‘기념’이며, לְכַפֵּר עַל은 ‘생명을 속죄하다’보다 ‘생명을 위하여 속죄하다’로 옮겨야 목적어 관계가 보존됩니다.
  naturalness: ‘속죄금’, ‘회막 봉사를 위하여’, ‘기념이 되어’는 현대 표준어의 격식 있는 성경 문맥에서 자연스럽습니다. ‘두십시오’는 כסף를 회막 업무에 배정한다는 원문의 의미를 무리 없이 나타냅니다.
  terminology: ‘야훼’, ‘이스라엘 자손’, ‘회막’, ‘속죄’는 일관되고 적절합니다. כֶּסֶף는 문맥상 ‘속죄금’으로 자연스럽게 번역할 수 있습니다. נַפְשׁוֹת은 영혼-육체 이원론을 뜻하지 않으므로 ‘생명’을 유지하되 ‘위하여’를 보완합니다.
