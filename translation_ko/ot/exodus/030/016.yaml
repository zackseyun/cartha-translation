source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
  footnotes:
  - marker: a
    text: Or “from the Israelites” / “from the children of Israel.” The Hebrew reads “from the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “for your souls”; here the sense is “for your lives” or “for yourselves” in the context of atonement payment.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 이스라엘 자손에게서[a] 속죄금을 받아 그것을 회막 봉사를 위하여 두십시오. 그것은 이스라엘 자손을 위하여 야훼 앞에서 기념이 되어, 너희의 생명을 위하여 속죄하게 할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들에게서” 또는 “이스라엘의 아들들에게서”. 히브리어는 문자적으로 “이스라엘의 아들들에게서”라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “너희의 영혼들을 위하여”입니다. 여기서는 문맥상 “너희의 생명을 위하여” 또는 “너희 자신을 위하여”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  english_pob_choice: the atonement money
  chosen_korean: 속죄의 돈
  alternatives_korean:
  - 속죄금
  - 속전
  - 속죄를 위한 은
  lexicon: HALOT
  rationale: כֶּסֶף는 문자적으로 ‘은/돈’이고, הַכִּפֻּרִים은 속죄와 관련된 제의적 용어이므로, 한국어로는 자연스럽고 기능을 드러내는 ‘속죄의 돈’이 원문의 의미를 가장 잘 살립니다.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from the sons of Israel
  chosen_korean: 이스라엘 자손에게서
  alternatives_korean:
  - 이스라엘 사람들에게서
  - 이스라엘의 아들들에게서
  - 이스라엘 백성에게서
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 그대로 드러내면서도 한국어에서는 ‘자손’이 성경 문맥에서 집합적 의미를 자연스럽게 전달하므로, 형식성과 가독성을 함께 살리기 위해 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  english_pob_choice: for the service of the tent of meeting
  chosen_korean: 회막의 일에 쓰도록 드려야 합니다
  alternatives_korean:
  - 회막의 봉사에 쓰도록 드려야 합니다
  - 회막의 섬김을 위해 드려야 합니다
  - 회막의 일에 바쳐야 합니다
  lexicon: HALOT
  rationale: עֲבֹדָה는 성막 문맥에서 제의적 ‘봉사/일’을 뜻하지만, 한국어에서는 ‘회막의 일’이 가장 직접적이고 자연스럽게 기능을 전달하므로 이렇게 옮겼습니다.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  english_pob_choice: and it shall be ... as a memorial
  chosen_korean: 기념물이 되어
  alternatives_korean:
  - 기억이 되어
  - 기념이 되어
  - 기념표가 되어
  lexicon: HALOT
  rationale: זִכָּרוֹן은 단순한 기억이 아니라 앞에 두는 지속적 표지이므로, 제의적·공적 맥락을 살려 ‘기념물’로 옮겼습니다.
- source_word: עַל נַפְשֹׁתֵיכֶם
  english_pob_choice: for your lives
  chosen_korean: 너희의 생명을
  alternatives_korean:
  - 너희의 영혼을
  - 너희 자신을
  - 너희의 목숨을
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 영혼-육체 이분법보다 사람의 생명/존재 전체를 가리키므로, POB의 해석을 따라 ‘생명’으로 번역했습니다.
theological_decisions:
- issue: 야훼의 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 출발 원칙에 따라 언약 이름을 가리는 관용적 대체어 대신, 원문 고유명칭을 한국어로 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 제의적 속죄 표현
  chosen_reading: ‘속죄의 돈’과 ‘속죄할 것입니다’로 제사장적 기능을 분명히 했습니다.
  alternative_readings:
  - 속전
  - 속죄제물
  - 대속할 것입니다
  rationale: 본문은 단순한 기부가 아니라 인구 조사와 속죄를 연결하는 제의적 지급을 말하므로, ‘속죄’ 어휘를 유지해 원문의 신학적 긴장을 보존했습니다.
  doctrine_reference: 출애굽기 30:11-16 문맥
