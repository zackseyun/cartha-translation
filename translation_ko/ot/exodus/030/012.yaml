id: EXO.30.12
reference: Exodus 30:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
  footnotes:
  - marker: a
    text: Literally, 'lift up the head of the sons of Israel,' an idiom for taking a census.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a ransom for himself'; Hebrew nephesh often means 'life' or 'self,' not only 'soul.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 이스라엘 자손을 등록하여 수를 셀 때에는, 각 사람이 그들을 계수할 때 야훼께 자기 생명의 속전[a]을 바쳐야 합니다. 그렇게 하면 그들을 계수할 때 그들 가운데 재앙이 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속전’은 여기서 재앙을 피하기 위해 야훼께 바치는, 자기 생명을 위한 속량금을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִשָּׂא אֶת רֹאשׁ
  english_pob_choice: When you take a census
  chosen_korean: 너희가 이스라엘 자손의 인원을 조사할 때에는
  alternatives_korean:
  - 너희가 이스라엘 자손의 머리를 들 때
  - 너희가 이스라엘 자손을 계수할 때
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘머리를 들다’이지만, 인구 조사 행정 맥락에서는 ‘조사하다/인원을 조사하다’가 뜻을 가장 분명하게 전달합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 가족적 표현을 살리되, 한국어에서는 관용적으로 굳어진 ‘이스라엘 자손’이 가장 자연스럽습니다.
- source_word: כֹּפֶר נַפְשׁוֹ
  english_pob_choice: a ransom for his life
  chosen_korean: 자기 생명의 속전
  alternatives_korean:
  - 자기 생명의 대속물
  - 자기 영혼의 속전
  - 자기 몸값
  lexicon: HALOT
  rationale: כֹּפֶר는 속죄적 보상금이라는 뜻이 강해 ‘속전’이 적절하고, נֶפֶשׁ는 이 문맥에서 ‘생명’으로 옮기는 것이 ‘영혼’보다 정확합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 원문이 하나님의 언약명 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: נֶגֶף
  english_pob_choice: plague
  chosen_korean: 재앙
  alternatives_korean:
  - 전염병
  - 치는 벌
  - 재난
  lexicon: HALOT
  rationale: 이 단어는 단순 질병보다 하나님의 심판으로 오는 치명적 타격을 가리키므로, 문맥상 ‘재앙’이 가장 무난합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 문맥상 언약명 YHWH가 직접 쓰였으므로, 전통 교회어보다 स्रोत-직결 표기를 우선해 ‘야훼’로 일관했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: נַפְשׁוֹ의 의미 범위
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  - 자기 자신
  rationale: 인구 조사와 속전의 결합에서는 נפש가 형이상학적 ‘영혼’보다 개인의 생명/존재 자체를 가리키므로, 신학적 과잉을 피했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy'
