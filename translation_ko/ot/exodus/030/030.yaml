  edition: WLC
  text: וְ/אֶת אַהֲרֹ֥ן וְ/אֶת בָּנָ֖י/ו תִּמְשָׁ֑ח וְ/קִדַּשְׁתָּ֥ אֹתָ֖/ם לְ/כַהֵ֥ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/030.yaml
  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: ko
  text: 아론과 그의 아들들에게 기름을 부으십시오. 그리고 그들을 거룩하게 하여 내게 제사장으로 섬기게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  english_pob_choice: you shall anoint
  chosen_korean: 기름을 부으십시오
  alternatives_korean:
  - 기름 부으실 것입니다
  - 도유하십시오
  lexicon: HALOT
  rationale: משׁח의 제의적 행위를 한국어 성경 문맥에 자연스럽게 옮기되, 단순한 ‘바르다’보다 성별·위임의 의미가 드러나는 표현을 택했습니다.
- source_word: וְקִדַּשְׁתָּ
  english_pob_choice: and you shall consecrate
  chosen_korean: 거룩하게 하여
  alternatives_korean:
  - 성별하여
  - 봉헌하여
  - 성결하게 하여
  lexicon: HALOT
  rationale: קדשׁ의 핵심은 ‘거룩한 용도로 구별함’이므로, 제사장 위임 맥락에서 ‘거룩하게 하다’가 가장 직접적입니다.
- source_word: לְכַהֵן
  english_pob_choice: to serve as priests
  chosen_korean: 제사장으로 섬기게
  alternatives_korean:
  - 제사장으로 봉사하게
  - 제사장 직무를 하게
  lexicon: HALOT
  rationale: כהן은 단순 직무 수행보다 제사장적 봉사를 가리키므로, ‘제사장으로 섬기다’가 역할과 기능을 함께 살립니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  lexicon: HALOT
  rationale: 원문은 남성 복수형으로 아론의 제사장 계승선을 분명히 가리키므로, 성별을 중화하지 않고 ‘아들들’로 옮겼습니다.
theological_decisions:
- issue: 제사장 위임의 제의적 어휘 유지
  chosen_reading: ‘기름을 부으십시오’와 ‘거룩하게 하여’ 및 ‘제사장으로 섬기게 하십시오’로 제사장 임직 문맥을 유지했습니다.
  alternative_readings:
  - ‘도유하십시오’와 ‘성결하게 하여’
  - ‘봉사하게 하십시오’
  rationale: 이 절은 아론과 그의 아들들을 야훼께 속한 제사장 직분으로 구별하는 장면이므로, 교회 제도 용어로 일반화하지 않고 제의적 의미를 그대로 드러내야 합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
