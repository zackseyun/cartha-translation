  lexicon: HALOT
  rationale: 통용되는 식물명으로 자연스럽게 옮겼으며, 본문이 재료를 밝히는 점을 살렸습니다.
theological_decisions:
- issue: 제단의 명칭을 기능 중심으로 옮길지 여부
