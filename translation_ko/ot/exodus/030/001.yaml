  naturalness: '''너는 ... 만들어야 합니다''는 합쇼체 문장 종결과 친칭 ''너''의 결합이 다소 부자연스럽고, 지시문으로도 간접적입니다. ''만드십시오''가 현대 표준어 합쇼체의 직접적이고 자연스러운 지시입니다. 절 첫머리의 ''그리고''는 한국어에서 불필요하게 연결감을 강조하므로 생략하는 편이 자연스럽습니다.'
