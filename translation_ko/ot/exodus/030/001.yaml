  rationale: 히브리어의 기능적 구문을 그대로 드러내기 위해, 단순히 명사화된 '향단'보다 용도를 분명히 하는 표현을 택했습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: acacia wood
  chosen_korean: 아카시아 나무
