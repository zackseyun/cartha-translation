id: EXO.30.2
reference: Exodus 30:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַמָּ֨ה אָרְכּ֜/וֹ וְ/אַמָּ֤ה רָחְבּ/וֹ֙ רָב֣וּעַ יִהְיֶ֔ה וְ/אַמָּתַ֖יִם קֹמָת֑/וֹ מִמֶּ֖/נּוּ קַרְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
  footnotes:
  - marker: a
    text: Literally, 'from it'; that is, the altar's horns were to be made as one piece with the altar itself, not attached separately.
    reason: lexical_alternative
  - marker: b
    text: Traditional English versions often render רָבוּעַ as 'foursquare.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 길이는 한 규빗이고 그 너비도 한 규빗이어야 합니다. 그것은 정사각형이어야 하며, 그 높이는 두 규빗이어야 합니다. 그 뿔들은 제단과 한 덩어리가 되어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַמָּה
  english_pob_choice: a cubit
  chosen_korean: 규빗
  alternatives_korean:
  - 한 규빗
  - cubit
  lexicon: HALOT
  rationale: 고대 길이 단위는 수치를 현대 단위로 환산하지 않고 ‘규빗’으로 옮겨 원문의 측정 관습을 보존했습니다.
- source_word: רָבוּעַ
  english_pob_choice: square
  chosen_korean: 네모반듯해야
  alternatives_korean:
  - 네모나야
  - 사각형이어야
  - 정사각형이어야
  lexicon: HALOT
  rationale: 건축·제의 문맥에서 ‘네모반듯하다’가 단순한 도형 설명과 자연스러운 한국어를 함께 살리며, 전통적 ‘네모반듯한’의 의미를 유지합니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: of one piece with it
  chosen_korean: 그것과 한 덩어리로
  alternatives_korean:
  - 그것에서
  - 그것으로부터
  - 그것과 한 몸으로
  lexicon: HALOT
  rationale: 직역하면 ‘그것으로부터’이지만, 공예 문맥상 제단과 뿔이 따로 붙는 것이 아니라 같은 재질의 일체물임을 드러내는 표현이 필요합니다.
- source_word: קַרְנֹתָיו
  english_pob_choice: its horns
  chosen_korean: 그 뿔들
  alternatives_korean:
  - 그 꼭짓점들
  - 그 뿔 모양 돌기들
  lexicon: HALOT
  rationale: 제단의 모서리 돌출부를 가리키는 제의 용어로서 ‘뿔들’을 유지해 본문 간 연관성을 보존합니다.
theological_decisions:
- issue: 제단의 뿔이 제단과 분리된 부속물인지 여부
  chosen_reading: 뿔들은 제단과 분리된 부속이 아니라 제단과 한 덩어리로 만들어진 것으로 옮겼습니다.
  alternative_readings:
  - 그 뿔들은 그것에서 나와야 합니다
  - 그 뿔들은 그것으로부터여야 합니다
  rationale: 히브리어 מִמֶּנּוּ의 문자값은 ‘그것으로부터’이지만, POB의 공예적 해석에 따라 일체 제작을 분명히 해야 합니다.
  doctrine_reference: 출애굽기 30장의 제의 기구 제작 지침
