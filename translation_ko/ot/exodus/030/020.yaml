language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
  footnotes:
  - marker: a
    text: Or, 'lest they die' or 'and they shall not die.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'an offering by fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 회막에 들어올 때에는 물로 씻어야 합니다[a]. 그래야 죽지 않습니다. 또는 그들이 제단 가까이 와서 섬기며 야훼께 드리는 화제[b]를 불사르러 올 때에도 그러해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 죽지 않도록’ 또는 ‘그리고 그들은 죽지 않을 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불로 드리는 제물’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹאָם
  english_pob_choice: When they enter
  chosen_korean: 들어올 때에는
  alternatives_korean:
  - 들어갈 때에는
  - 들어올 때
  lexicon: HALOT
  rationale: ב + 부정사구는 시간적 조건을 나타내므로, 현대 한국어에서는 자연스러운 ‘들어올 때’로 옮겼습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: HALOT
  rationale: 성막 문맥의 고정 용어이므로 한국어 성경 전통에서 널리 쓰이는 ‘회막’을 채택했습니다.
- source_word: יִרְחֲצוּ מַיִם
  english_pob_choice: they shall wash with water
  chosen_korean: 물로 씻어야 합니다
  alternatives_korean:
  - 물로 씻어야 합니다
  - 물로 몸을 씻어야 합니다
  lexicon: HALOT
  rationale: רחץ + מים의 제의적 세척을 자연스럽게 살리되, 원문에 없는 ‘몸을’은 덧붙이지 않았습니다.
- source_word: אִשֶּׁה
  english_pob_choice: a food offering
  chosen_korean: 화제
  alternatives_korean:
  - 불로 드리는 제물
  - 불제사
  lexicon: HALOT
  rationale: 원문의 제의적 불사름을 드러내는 표준 용어를 살려, ‘불사르다’와 결합이 자연스러운 ‘화제’를 사용했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 한국어 조사 ‘께’를 붙여 예배 문맥을 살렸습니다.
theological_decisions:
- issue: וְלֹא יָמֻתוּ의 경고 뉘앙스
  chosen_reading: 그래야 죽지 않습니다
  alternative_readings:
  - 죽지 않게 하려는 것입니다
  - 죽지 않도록
  rationale: 정결 규례의 실제적 사망 경고를 약화시키지 않으면서도, 현대 한국어에서 자연스럽고 분명하게 전달하도록 했습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 제단 봉사와 화제의 병렬 구조
  chosen_reading: 제단 가까이 와서 섬기며 야훼께 드리는 화제를 불사르러 올 때에도
  alternative_readings:
  - 제단에 가까이 와서 섬기고 화제를 드릴 때에도
  - 제단에 나아와 섬기며 화제를 불사를 때에도
  rationale: עם/לְ 구조가 가리키는 두 번째 경우를 살려, 제사장적 봉사와 화제의 불사름을 함께 보이도록 했습니다.
  doctrine_reference: Priestly cultic context in Exodus 30
