    rationale: בְגִשְׁתָּם은 제단에 가까이 나아가는 상황이며, לְשָׁרֵת와 לְהַקְטִיר은 그 상황에서 수행할 봉사와 화제의 불사름을 나타냅니다. 세척 의무를 명시하고 동작 관계를 자연스럽게 정리하는 것이 원문에 더 충실합니다.
