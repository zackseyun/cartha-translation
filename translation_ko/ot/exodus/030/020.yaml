review_pass:
  verdict: revise
  source_fidelity: 첫 경우와 제단에 나아가는 둘째 경우 모두에서 물로 씻어 죽음을 피하게 한다는 히브리어의 구조는 유지되어야 합니다. 초안은 둘째 경우의 ‘물로 씻어야 합니다’를 ‘그러해야 합니다’로 대용하고 ‘불사르러 올 때’라고 하여 나아감이 중복되어, 원문의 병렬과 동작 관계가 다소 흐려집니다. 히브리어 본문은 다음 절로 이어지므로 끝의 이어지는 쉼표도 반영했습니다.
  naturalness: ‘제단에 가까이 나아가 섬기며 … 불사를 때’는 현대 표준 한국어 합쇼체에서 자연스럽고, 제의 문맥에도 알맞습니다. 둘째 절에 세척 의무를 명시하여 ‘그러해야 합니다’보다 분명하게 했습니다.
  terminology: ‘회막’, ‘제단’, ‘화제’, ‘야훼’는 일관되고 적절합니다. אִשֶּׁה의 대안은 각주에서 ‘불로 드리는 제물’로 제시합니다. 죽음 방지 절의 각주는 실제 표지어 뒤에 배치했습니다.
