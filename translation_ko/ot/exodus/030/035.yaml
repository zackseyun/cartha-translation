  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
  footnotes:
  - marker: a
    text: Or 'a compound perfume' or 'an aromatic mixture.' The Hebrew emphasizes a carefully blended aromatic preparation.
    reason: lexical_alternative
  - marker: b
    text: Or 'seasoned with salt' or 'mixed with salt.'
    reason: lexical_alternative
  - marker: c
    text: Or 'sacred.' The Hebrew simply says 'holy,' not 'most holy' in this verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것을 향 제조자의 솜씨로 조제한 향, 곧 소금으로 간하고 순수하며 거룩한 향으로 만드십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조제한 향’ 또는 ‘향기로운 혼합물’로 옮길 수 있습니다. 히브리어는 정교하게 배합한 향제의 성격을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소금으로 간한’ 또는 ‘소금과 섞은’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘성스러운’으로 옮길 수 있습니다. 히브리어는 이 절에서 ‘가장 거룩한’이 아니라 단순히 ‘거룩한’을 말합니다.
    reason: lexical_alternative
