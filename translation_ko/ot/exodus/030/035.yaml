id: EXO.30.35
reference: Exodus 30:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ אֹתָ/הּ֙ קְטֹ֔רֶת רֹ֖קַח מַעֲשֵׂ֣ה רוֹקֵ֑חַ מְמֻלָּ֖ח טָה֥וֹר קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
  footnotes:
  - marker: a
    text: Or 'a compound perfume' or 'an aromatic mixture.' The Hebrew emphasizes a carefully blended aromatic preparation.
    reason: lexical_alternative
  - marker: b
    text: Or 'seasoned with salt' or 'mixed with salt.'
    reason: lexical_alternative
  - marker: c
    text: Or 'sacred.' The Hebrew simply says 'holy,' not 'most holy' in this verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것을 향료 조제자(조향사)의 솜씨로 만든 향으로, 소금으로 간하고, 순수하며, 거룩하게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘향료로 조제된 향’ 혹은 ‘향기로운 혼합물’로도 옮길 수 있습니다. 히브리어는 정교하게 배합된 향제의 성격을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소금으로 간한’ 혹은 ‘소금과 섞은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘성스러운.’ 히브리어는 이 절에서 ‘가장 거룩한’이 아니라 단순히 ‘거룩한’을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ
  english_pob_choice: And you shall make it
  chosen_korean: 그리고 그것을 ... 만들고
  alternatives_korean:
  - 그리고 그것을 ... 하십시오
  - 그리고 그것을 ... 제조하십시오
  lexicon: WLC, HALOT
  rationale: 명령형 지시문으로서의 용법을 살려 ‘...하십시오’로 옮겼고, 목적어 ‘그것’을 분명히 유지했습니다.
- source_word: קְטֹרֶת רֹקַח
  english_pob_choice: incense, a perfume blended
  chosen_korean: 향료 조제자(조향사)의 솜씨로 만든 향
  alternatives_korean:
  - 향로용 향
  - 조제된 향
  - 향료가 섞인 향
  lexicon: WLC, HALOT
  rationale: קְטֹרֶת는 단순한 향이 아니라 분향용 향을 가리키므로 ‘향’으로 두되, רֹקַח의 조제·혼합 뉘앙스를 ‘솜씨로 만든’으로 살렸습니다.
- source_word: מַעֲשֵׂה רוֹקֵחַ
  english_pob_choice: by the work of a perfumer
  chosen_korean: 향료 조제자(조향사)의 솜씨로
  alternatives_korean:
  - 향료 조제자의 일로
  - 조향술로
  - 향료 장인의 손길로
  lexicon: HALOT
  rationale: 직역하면 ‘조향자의 일/작품’이므로 기술적·수공적 제작을 드러내는 ‘솜씨로’가 가장 자연스럽고 원문의 직능적 의미를 보존합니다.
- source_word: מְמֻלָּח טָהוֹר קֹדֶשׁ
  english_pob_choice: salted, pure, holy
  chosen_korean: 소금으로 간하고, 순수하며, 거룩하게
  alternatives_korean:
  - 소금으로 절이고, 깨끗하며, 성스러운
  - 소금으로 간한, 정결하고, 거룩한
  lexicon: HALOT
  rationale: מְמֻלָּח은 소금 처리된 상태를, טָהוֹר은 의례적·물질적 순수함을, קֹדֶשׁ은 구별된 거룩함을 가리키므로 세 항목을 각각 분리해 옮겼습니다.
theological_decisions:
- issue: קֹדֶשׁ의 강도
  chosen_reading: ‘거룩하게’로 옮겨, 본문이 말하는 성별된 용도를 유지했습니다.
  alternative_readings:
  - ‘성스럽게’
  - ‘가장 거룩하게’
  rationale: 히브리어는 단순히 ‘거룩’이라고만 말하므로, ‘가장 거룩하게’처럼 강도를 높이지 않고 본문의 일반적 성별 의미를 보존했습니다.
  doctrine_reference: 'Translation philosophy: Never import doctrinal claims the text does not make; preserve source text''s plain sense.'
