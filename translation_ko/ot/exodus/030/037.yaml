source:
  edition: WLC
  text: וְ/הַ/קְּטֹ֨רֶת֙ אֲשֶׁ֣ר תַּעֲשֶׂ֔ה בְּ/מַ֨תְכֻּנְתָּ֔/הּ לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם קֹ֛דֶשׁ תִּהְיֶ֥ה לְ/ךָ֖ לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
  footnotes:
  - marker: a
    text: Or 'according to its formula' or 'according to its proportions.'
    reason: lexical_alternative
  - marker: b
    text: That is, this sacred incense mixture was not to be reproduced for ordinary personal use.
    reason: cultural_note
translation:
  language: ko
  text: 네가 만들 향은 그 배합대로 너희 자신을 위해 만들지 마십시오[a][b]. 그것은 네게 야훼를 위하여 거룩한 것이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 공식대로’, ‘그 비율대로’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 이 거룩한 향 혼합물은 일상적인 개인 용도로 다시 만들어서는 안 된다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  english_pob_choice: the incense
  chosen_korean: 향
  alternatives_korean:
  - 향료
  - 분향
  lexicon: HALOT
  rationale: 문맥상 성막의 거룩한 분향 재료를 가리키므로, 현대 한국어에서 자연스러운 ‘향’으로 옮기되 의례적 용례를 해치지 않도록 했습니다.
- source_word: בְּמַתְכֻּנְתָּהּ
  english_pob_choice: according to its composition
  chosen_korean: 그 조성에 따라
  alternatives_korean:
  - 그 공식에 따라
  - 그 비율에 따라
  - 그 배합에 따라
  lexicon: HALOT
  rationale: 규정된 배합/구성을 뜻하므로 ‘조성’이 원문의 지정된 구성 요소를 간결하게 살립니다.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  english_pob_choice: you shall not make for yourselves
  chosen_korean: 너희를 위해서는 그것을 만들지 말아야 합니다
  alternatives_korean:
  - 너희 자신을 위해 만들지 말아야 합니다
  - 너희의 사적 사용을 위해 만들지 말아야 합니다
  lexicon: HALOT
  rationale: 직역의 경계를 유지하면서도 개인적/일상적 사용 금지를 드러내기 위해 ‘너희를 위해서는’으로 처리했습니다.
- source_word: קֹדֶשׁ תִּהְיֶה לְךָ
  english_pob_choice: it shall be holy to you
  chosen_korean: 그것은 너에게 거룩한 것이 될 것입니다
  alternatives_korean:
  - 그것은 너희에게 거룩할 것입니다
  - 너희는 그것을 거룩한 것으로 여겨야 합니다
  lexicon: HALOT
  rationale: נ는 상태 서술을 살려 ‘거룩한 것이 될 것입니다’로 옮겨, 단순한 규정이 아니라 향의 성스러운 지위를 분명히 했습니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를 위한 것입니다
  alternatives_korean:
  - 야훼께 드리는 것입니다
  - 야훼에게 속한 것입니다
  lexicon: HALOT
  rationale: 프로젝트 기준에 따라 신명사 היוה를 ‘야훼’로 옮기고, 전치사의 헌납/귀속 의미를 ‘위한’으로 보존했습니다.
theological_decisions:
- issue: 여호와/주님의 관습 번역 대신 야훼 사용
  chosen_reading: 본문의 마지막 לַיהוָה는 ‘야훼’로 옮기고, 별도의 우회 표현은 쓰지 않았습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문의 언약적 신명 표지를 드러내기 위해 프로젝트 기준에 맞춰 직접 음역했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
