  source_fidelity: 원문의 목적어 배열은 제단 자체와 그 윗면, 사방의 벽, 뿔을 모두 순금으로 입히라는 뜻입니다. 초안의 첫 구절은 ‘그것에 순금으로 입히고’로 목적격 구성이 부자연스럽고, 뒤의 열거 항목과의 연결도 불명확합니다. 또한 זֵר는 ‘테두리/장식 띠’로 옮길 수 있으며, 그 대안인 ‘왕관’ 관련 각주는 해당 어휘가 나오는 ‘금 테두리’에 붙어야 합니다.
