  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/צִפִּיתָ֨ אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
  footnotes:
  - marker: a
    text: Or 'a gold crown all around.' The Hebrew zer can denote a border, rim, or crown-like molding.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그것에 순금으로 입히고, 그 윗면[a]과 그 주위의 벽들과 그 뿔들을 입히고, 그것을 위하여 주위에 금 테두리를 만들어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금 테두리’. 히브리어 זֵר는 둘레 장식, 가장자리, 왕관 모양의 장식을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  english_pob_choice: you shall overlay
  chosen_korean: 입히고
  alternatives_korean:
  - 덧입히고
  - 겉입히고
  - 입혀서
  lexicon: HALOT
  rationale: צפה는 단순한 ‘덮다’보다 재료를 겉면에 씌우는 뜻이므로, 금으로 표면을 입히는 공정에 맞게 ‘입히다’로 옮겼습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 깨끗한 금
  - 정제된 금
  lexicon: HALOT
  rationale: טָהוֹר는 정결/순수의 의미로, 금의 재질 순도를 가리키므로 자연스러운 한국어 성경체인 ‘순금’이 적합합니다.
- source_word: גַּגּוֹ / קִירֹתָיו
  english_pob_choice: its top / its walls all around
  chosen_korean: 그 윗면과 그 주위의 벽들
  alternatives_korean:
  - 그 지붕과 그 주위의 벽들
  - 그 위와 사방의 면들
  lexicon: HALOT
  rationale: 작은 제단 문맥에서 גג는 ‘지붕’보다 ‘윗면’이 자연스럽고, קירות는 문자적으로 ‘벽들’이지만 구조를 살려 ‘주위의 벽들’로 옮겼습니다.
- source_word: זֵר זָהָב סָבִיב
  english_pob_choice: a gold molding all around
  chosen_korean: 금 테두리
  alternatives_korean:
  - 금 장식 테두리
  - 금 가장자리
  - 금 왕관
  lexicon: HALOT
  rationale: זֵר는 둘러싼 장식 띠나 가장자리를 뜻하므로, 왕권 이미지를 과도하게 불러오는 ‘왕관’보다 물리적 형태를 드러내는 ‘테두리’가 본문에 더 맞습니다.
theological_decisions:
- issue: זֵר의 번역이 전통적 ‘왕관’이 아니라 ‘테두리’인 점
  chosen_reading: 제의 기구의 구조적 장식으로 이해하여 ‘금 테두리’로 옮겼습니다.
  alternative_readings:
  - ‘금 왕관’으로 번역
  - ‘금 띠’로 번역
  rationale: 본문은 제단 제작 묘사이므로 왕권 상징을 본문에 덧씌우기보다, 공예적·제의적 기능을 드러내는 번역이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
