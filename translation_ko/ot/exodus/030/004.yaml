source:
  edition: WLC
  text: וּ/שְׁתֵּי֩ טַבְּעֹ֨ת זָהָ֜ב תַּֽעֲשֶׂה לּ֣/וֹ מִ/תַּ֣חַת לְ/זֵר֗/וֹ עַ֚ל שְׁתֵּ֣י צַלְעֹתָ֔י/ו תַּעֲשֶׂ֖ה עַל שְׁנֵ֣י צִדָּ֑י/ו וְ/הָיָה֙ לְ/בָתִּ֣ים לְ/בַדִּ֔ים לָ/שֵׂ֥את אֹת֖/וֹ בָּ/הֵֽמָּה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
  footnotes:
  - marker: a
    text: Or 'under its border' or 'beneath its rim'; the Hebrew זֵר refers to the decorative edging around the altar.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'on its two side-structures ... on its two sides,' a somewhat repetitive description emphasizing placement on both sides.
    reason: lexical_alternative
  - marker: c
    text: Literally 'they shall be houses for poles,' meaning receptacles or holders for the carrying poles.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 금으로 된 고리 두 개를 그 아래, 곧 그 둘레 장식 밑에 만들되, 그 두 옆판 위, 곧 그 두 옆에 만들고, 그것들이 그것을 나르는 막대들을 꽂는 받침이 되게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘테두리 아래’, ‘가장자리 밑에’. 히브리어 זֵר는 제단 둘레의 장식 가장자리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 두 옆구조물 ... 그 두 옆에’라는 식의 다소 반복적인 표현으로, 양쪽 배치를 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘막대들을 위한 집들’로, 막대를 넣어 두는 받침 또는 보관구를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  english_pob_choice: gold rings
  chosen_korean: 금으로 된 고리
  alternatives_korean:
  - 금고리
  lexicon: HALOT
  rationale: טַבַּעַת는 장식용 고리보다 부착용 고리를 뜻하므로, 재료를 분리해 ‘금으로 된 고리’라고 옮기면 의미와 자연스러움을 함께 살릴 수 있습니다.
- source_word: מִתַּחַת לְזֵרוֹ
  english_pob_choice: under its molding
  chosen_korean: 그 아래, 곧 그 둘레 장식 밑에
  alternatives_korean:
  - 그 몰딩 아래
  - 그 테두리 밑에
  - 그 가장자리 아래
  lexicon: HALOT
  rationale: זֵר는 성막 기구의 장식 둘레를 가리키므로, ‘둘레 장식’으로 옮겨 형태적 기능을 드러내고 주석적 동격으로 ‘그 아래’를 보충했습니다.
- source_word: צַלְעֹתָיו / שְׁנֵי צִדָּיו
  english_pob_choice: on its two side panels ... on its two sides
  chosen_korean: 그 두 옆판 위, 곧 그 두 옆에
  alternatives_korean:
  - 그 두 측면 위에
  - 그 두 옆 구조물 위에
  lexicon: HALOT
  rationale: צֵלָע는 문맥상 단순한 ‘옆’보다 구조물의 옆면/옆판에 가깝기 때문에 ‘옆판’으로 구체화하되, 뒤따르는 ‘두 옆’ 반복을 살려 배치의 양쪽성을 강조했습니다.
- source_word: לְבָתִּים לְבַדִּים
  english_pob_choice: they shall be holders for poles
  chosen_korean: 막대들을 꽂는 받침이 되게 하십시오
  alternatives_korean:
  - 막대들을 위한 고리 집이 되게 하십시오
  - 막대들을 끼우는 집이 되게 하십시오
  lexicon: HALOT
  rationale: בָּתִּים의 직역인 ‘집들’은 한국어에서 어색하므로 기능을 드러내는 ‘받침’으로 옮겼고, carrying poles의 용례를 따라 ‘막대들’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 지시형 문장의 공손도와 성막 규례 문체
  chosen_reading: ‘...만들십시오’로 통일해 규례 전달의 공적·지시적 어조를 유지했습니다.
  alternative_readings:
  - ‘만들라’
  - ‘만드십시오’ 대신 평서형
  rationale: 출애굽기 성막 규례는 공동체에 주어진 직접 지시이므로, 현대 표준어 합쇼체의 명령형이 원문의 명령성을 가장 자연스럽게 전달합니다.
  doctrine_reference: 출 25–31장 성막 지시문체
- issue: 반복 구조의 보존
  chosen_reading: ‘그 두 ... 그 두 ...’와 ‘곧’의 삽입으로 히브리어의 병렬·중복 설명을 드러냈습니다.
  alternative_readings:
  - 반복을 줄여 한 번만 말하기
  - 매끄럽게 하나의 문장으로 합치기
  rationale: 원문은 위치를 두 번 말해 강조하므로, 한국어에서도 반복을 일부 보존해야 배치의 정확성과 강조점이 유지됩니다.
  doctrine_reference: 원문 의미의 충실한 보존
