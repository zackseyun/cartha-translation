  to: 그리고 금고리 두 개를 그 둘레 장식 밑에 만드십시오.[a] 그 고리들을 그 두 옆면, 곧 양쪽에 만드십시오.[b] 그 고리들이 그것을 나르는 막대들을 위한 끼움자리가 되게 하십시오.[c]
  rationale: 원문의 두 차례 ‘만들다’ 명령과 양쪽 배치의 반복을 보존하면서, 한국어에서 모호하거나 어색한 지시어와 동격 구성을 바로잡았습니다. ‘끼움자리’는 고리의 기능을 전달하되 원문이 구체적인 기계 구조를 확정하지 않는 점을 존중합니다. 각 주석 표지는 해당 어구 바로 뒤에 배치했습니다.
