  text: וְ/עָשִׂ֣יתָ אֹת֗/וֹ שֶׁ֚מֶן מִשְׁחַת קֹ֔דֶשׁ רֹ֥קַח מִרְקַ֖חַת מַעֲשֵׂ֣ה רֹקֵ֑חַ שֶׁ֥מֶן מִשְׁחַת קֹ֖דֶשׁ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/025.yaml
  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
  footnotes:
  - marker: a
    text: Or 'a compounded ointment' or 'a blended perfume'; the Hebrew emphasizes an expertly mixed aromatic preparation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것으로 거룩한 관유를 만드십시오. 그것은 향료 장인의 손으로 섞은 향료이며, 거룩한 관유가 되어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘섞은 혼합물’ 또는 ‘조향한 향료’입니다. 히브리어는 전문적으로 배합된 향료 제조를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 만드십시오
  alternatives_korean:
  - 만드셔야 합니다
  - 만들어야 합니다
  lexicon: WLC
  rationale: 지시문맥의 명령형을 자연스러운 합쇼체로 옮겼습니다. 문자적 미래형보다 한국어 명령/지시 기능을 살렸습니다.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  english_pob_choice: a holy anointing oil
  chosen_korean: 거룩한 관유
  alternatives_korean:
  - 거룩한 기름 부음의 기름
  - 거룩한 도유유
  lexicon: WLC
  rationale: 관용적이면서도 성별된 기름이라는 성격을 드러내기 위해 ‘관유’를 택했습니다. ‘거룩한’은 קדש의 성별/구별 의미를 반영합니다.
- source_word: רֹקַח מִרְקַחַת
  english_pob_choice: a perfume blended by the work of a perfumer
  chosen_korean: 향료 장인의 손으로 섞은 향료
  alternatives_korean:
  - 향료 혼합물
  - 조향사가 섞은 향료
  lexicon: WLC
  rationale: 두 겹의 어근적 반복이 ‘섞다/혼합하다’의 강조를 이루므로, ‘섞은 향료’로 반복성을 살렸습니다. ‘향료 장인’은 מקצוע적 제작자를 자연스럽게 드러냅니다.
- source_word: מַעֲשֵׂה רֹקֵחַ
  english_pob_choice: the work of a perfumer
  chosen_korean: 향료 장인의 손으로
  alternatives_korean:
  - 조향사의 작업으로
  - 향료를 만드는 장인의 일로
  lexicon: WLC
  rationale: 직역형 ‘향료 만드는 자의 작업’보다 한국어에서 자연스러운 제작자 표현으로 옮기되, ‘work of a perfumer’의 장인적 제작 의미를 보존했습니다.
theological_decisions:
- issue: קדש의 반복과 결론부 재진술
  chosen_reading: 마지막 절구를 ‘거룩한 관유가 되어야 합니다’로 다시 옮겨, 제조 지시가 곧 성별 규정임을 분명히 했습니다.
  alternative_readings:
  - 그것은 거룩한 관유일 것입니다
  - 그것은 거룩한 관유가 될 것입니다
  rationale: 히브리어는 끝에서 같은 명칭을 반복하여 이 기름의 정체성과 구별성을 강조합니다. 한국어에서도 반복을 유지해야 성별의 강세가 흐려지지 않습니다.
  doctrine_reference: 성별/거룩의 반복 강조
