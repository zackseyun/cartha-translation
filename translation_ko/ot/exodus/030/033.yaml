id: EXO.30.33
reference: Exodus 30:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִ֚ישׁ אֲשֶׁ֣ר יִרְקַ֣ח כָּמֹ֔/הוּ וַ/אֲשֶׁ֥ר יִתֵּ֛ן מִמֶּ֖/נּוּ עַל זָ֑ר וְ/נִכְרַ֖ת מֵ/עַמָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
  footnotes:
  - marker: a
    text: Or 'on a stranger,' 'on an outsider,' or 'on a layman'; Hebrew zar often means one not authorized for sacred use in this context.
    reason: lexical_alternative
  - marker: b
    text: '''Shall be cut off from his people'' is a covenantal legal formula; the text does not specify the exact manner of the penalty here.'
    reason: alternative_reading
translation:
  language: ko
  text: 누구든지 이와 같은 것을 조제하거나 그 기름을 권한 없는 사람에게 바르면, 자기 백성에게서 끊어질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  english_pob_choice: Whoever
  chosen_korean: 누구든지
  alternatives_korean:
  - 어떤 사람이든
  - 아무 사람이든
  lexicon: HALOT
  rationale: 법조문 문맥에서 대표적 남성형을 한국어 일반 표현으로 풀어, 인칭을 특정하지 않는 금지의 힘을 자연스럽게 살렸습니다.
- source_word: יִרְקַח כָּמֹהוּ
  english_pob_choice: compounds any like it
  chosen_korean: 그것과 같은 것을 제조하거나
  alternatives_korean:
  - 그것과 같은 것을 섞거나
  - 그것과 같은 것을 배합하거나
  lexicon: HALOT
  rationale: רקח는 향료나 기름을 기술적으로 배합·조제하는 뜻이므로, 단순한 ‘섞다’보다 ‘제조하다’가 제의적·기술적 성격을 더 잘 드러냅니다.
- source_word: עַל זָר
  english_pob_choice: on an unauthorized person
  chosen_korean: 무자격자에게
  alternatives_korean:
  - 낯선 사람에게
  - 외인에게
  - 평신도에게
  lexicon: HALOT
  rationale: 제의적 맥락에서 זָר는 민족적 ‘낯선 사람’보다 성스러운 사용에 대한 권한이 없는 자를 뜻하므로, 의미를 분명히 하는 한국어를 택했습니다.
- source_word: וְנִכְרַת מֵעַמָּיו
  english_pob_choice: shall be cut off from his people
  chosen_korean: 그는 자기 백성 가운데서 끊어질 것입니다
  alternatives_korean:
  - 그는 자기 백성에서 끊어질 것입니다
  - 그는 자기 백성 가운데서 제외될 것입니다
  lexicon: HALOT
  rationale: 관습적인 언약법 표현인 ‘끊어지다’를 유지해, 구체적 집행 방식은 본문이 밝히지 않는 긴장을 그대로 남겼습니다.
theological_decisions:
- issue: זָר의 의미를 민족적 ‘외국인’으로 좁힐지 여부
  chosen_reading: 제의적 권한이 없는 무자격자로 이해했습니다.
  alternative_readings:
  - 낯선 사람
  - 외인
  - 평신도
  rationale: 본문의 관심은 혈통이 아니라 거룩한 기름의 사용 권한 경계에 있으므로, 독자가 제의적 금지의 초점을 오해하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: וְנִכְרַת מֵעַמָּיו의 형벌 강도와 방식
  chosen_reading: ‘끊어질 것입니다’로 옮겨, 방식은 특정하지 않았습니다.
  alternative_readings:
  - 추방될 것입니다
  - 죽임을 당할 것입니다
  rationale: 히브리어 관용구를 그대로 살려, 본문이 말하지 않는 집행 형태를 번역이 앞서 규정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3
