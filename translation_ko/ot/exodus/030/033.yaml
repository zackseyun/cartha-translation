  source_fidelity: 히브리어의 법률적 조건문과 두 행위(같은 것을 조제함, 그 기름을 권한 없는 자에게 바름), 그리고 결과인 ‘자기 백성에게서 끊어짐’을 충실히 반영합니다. מִמֶּנּוּ는 앞 문맥의 거룩한 관유를 가리키므로 ‘그 기름을’이라고 밝혀도 안전합니다.
  naturalness: 초안의 ‘그것의 일부를 무자격자에게 바르면’은 지시 대상이 다소 불분명하고 ‘무자격자’는 현대 한국어에서 자격증·요건 미비의 일반적 의미로 들릴 수 있습니다. ‘그 기름을 권한 없는 사람에게 바르면’이 제의적 맥락과 현대 표준어 문체에 더 자연스럽습니다. ‘조제하다’도 향유를 배합하는 기술적 행위에 적절합니다.
  terminology: זָר는 이 문맥에서 민족적 외국인이라기보다 거룩한 관유를 받을 권한이 없는 사람을 가리키므로 ‘권한 없는 사람’으로 옮깁니다. וְנִכְרַת는 집행 방식을 규정하지 않고 관용적으로 ‘끊어질 것입니다’로 보존합니다.
