  text: כֹּ֗ל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה יִתֵּ֖ן תְּרוּמַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
  footnotes:
  - marker: a
    text: Or “among those numbered.” The Hebrew idiom literally speaks of one “passing over” in relation to those counted, likely referring to the census procedure.
    reason: lexical_alternative
translation:
  language: ko
  text: 계수된 사람들 가운데로[a] 지나가는 사람은 누구든지, 스무 살 이상이면 야훼께 헌납물을 바쳐야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계수된 사람들 가운데로 지나가는’은 히브리어를 직역에 가깝게 옮긴 표현입니다. 히브리어는 문자적으로 ‘계수된 사람들과 관련하여 지나가다’라고 하며, 인구 조사 절차를 가리킬 수 있습니다. 또는 ‘계수된 사람들 가운데’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעֹבֵר עַל הַפְּקֻדִים
  english_pob_choice: Everyone who passes over to those who are counted
  chosen_korean: 무리의 계수에 속하는 자들 가운데로 지나가는 자는 누구든지
  alternatives_korean:
  - 계수된 자들 가운데로 넘어가는 자는 누구든지
  - 등록된 자들 가운데로 지나가는 자는 누구든지
  - 계수 대상자들 가운데로 들어가는 자는 누구든지
  lexicon: HALOT
  rationale: עבר의 ‘지나가다/건너다’ 이미지를 살리면서, פְּקֻדִים의 ‘계수된/등록된 자들’ 뜻을 한국어로 자연스럽게 옮겼습니다.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  english_pob_choice: from twenty years old and upward
  chosen_korean: 스무 살 이상이면
  alternatives_korean:
  - 스무 살부터 위이면
  - 스무 살과 그 이상이면
  - 스무 살이 넘으면
  lexicon: HALOT
  rationale: 정해진 연령 기준을 한국어 법률 문체에 맞게 간결하게 표현했습니다.
- source_word: תְּרוּמַת
  english_pob_choice: contribution
  chosen_korean: 예물
  alternatives_korean:
  - 헌물
  - 기여물
  - 바침
  lexicon: HALOT
  rationale: 이 구절은 성소 세금의 성격을 띠므로, 제의적 헌납을 드러내는 ‘예물’이 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문맥상 여호와 대치표현이 아니라 신적 고유명사이므로, 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 인구조사 관련 관용구의 처리
  chosen_reading: ‘무리의 계수에 속하는 자들 가운데로 지나가는’이라는 구체적 이미지를 유지했습니다.
  alternative_readings:
  - ‘계수된 자들 중에 속한’처럼 의미만 평탄화하는 방식
  - ‘명부에 오른 자들 가운데’로 해석만 제시하는 방식
  rationale: 히브리어는 단순한 ‘계수되다’보다 ‘지나가다’의 절차적 이미지를 담고 있어, 이를 보존하는 것이 원문 의미를 더 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve significant lexical imagery'
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 하나님의 언약 이름을 직접 사용하므로, 호칭으로 완화하지 않고 고유명으로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
