theological_decisions:
- issue: 하나님의 안식 언어의 인격적·신체적 표현
  chosen_reading: ‘그치시고 새 힘을 얻으셨기’로 옮겨, 원문의 의인화된 표현을 약화하지 않았습니다.
  alternative_readings:
  - ‘쉬시고 새 힘을 얻으셨기’
  - ‘그치시고 숨을 돌리셨기’
  rationale: 본문은 안식일의 근거를 창조주 하나님의 행위에 연결하며, 의인화된 언어를 통해 안식의 의미를 드러냅니다. 이를 추상화하지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 야훼의 이름 표기
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 주어진 번역 원칙의 YHWH 기본값을 따랐으며, 본문의 창조주 지칭을 고유명사로 분명히 드러냅니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
