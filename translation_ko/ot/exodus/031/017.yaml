source:
  edition: WLC
  text: בֵּינִ֗/י וּ/בֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְ/עֹלָ֑ם כִּי שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהוָה֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י שָׁבַ֖ת וַ/יִּנָּפַֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
  footnotes:
  - marker: a
    text: Or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he rested'; the Hebrew verb more literally means 'he ceased.'
    reason: lexical_alternative
  - marker: c
    text: Or 'took breath' / 'was restored'; the Hebrew uses vivid anthropomorphic language.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 나와 이스라엘 자손 사이의 영원한 표징입니다[a]. 이는 엿새 동안 야훼께서 하늘과 땅을 만드시고[c][b], 일곱째 날에는 그치시고 새 힘을 얻으셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 쉬셨다’; 히브리어 동사는 더 문자적으로는 ‘그치다’는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘숨을 돌리셨다’ / ‘회복되셨다’; 히브리어는 생생한 의인적 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  english_pob_choice: between me and
  chosen_korean: 나와 … 사이의
  alternatives_korean:
  - 나와 … 사이에 있는
  - 나와 … 사이의 관계 표지
  lexicon: HALOT
  rationale: 히브리어의 상호 관계를 나타내는 관용적 대구를 자연스러운 한국어로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 원문의 가족적·계보적 표현을 살리면서도 한국어에서 통용되는 성서적 표현을 유지했습니다.
- source_word: שָׁבַת
  english_pob_choice: he ceased
  chosen_korean: 그치시고
  alternatives_korean:
  - 쉬시고
  - 쉬셨고
  - 멈추시고
  lexicon: HALOT
  rationale: ‘쉬다’보다 ‘그치다’가 창조 행위를 멈춘다는 동작 의미를 더 직접적으로 드러냅니다.
- source_word: וַיִּנָּפַשׁ
  english_pob_choice: was refreshed
  chosen_korean: 새 힘을 얻으셨기
  alternatives_korean:
  - 숨을 돌리셨기
  - 회복되셨기
  - 쉬셨기
  lexicon: HALOT
  rationale: 원문의 생생한 인격적 표현을 유지하면서도, 하나님께서 피로해서 회복되셨다는 오해는 피하도록 한국어로 자연화했습니다.
theological_decisions:
- issue: 하나님의 안식 언어의 인격적·신체적 표현
  chosen_reading: ‘그치시고 새 힘을 얻으셨기’로 옮겨, 원문의 의인화된 표현을 약화하지 않았습니다.
  alternative_readings:
  - ‘쉬시고 새 힘을 얻으셨기’
  - ‘그치시고 숨을 돌리셨기’
  rationale: 본문은 안식일의 근거를 창조주 하나님의 행위에 연결하며, 의인화된 언어를 통해 안식의 의미를 드러냅니다. 이를 추상화하지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 야훼의 이름 표기
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 주어진 번역 원칙의 YHWH 기본값을 따랐으며, 본문의 창조주 지칭을 고유명사로 분명히 드러냅니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
