    reason: lexical_alternative
lexical_decisions:
- source_word: לַחְשֹׁב מַחֲשָׁבֹת
  english_pob_choice: to devise designs
  chosen_korean: 정교한 설계를 고안하다
  alternatives_korean:
  - 설계를 생각하다
  - 디자인을 계획하다
  - 예술적 계획을 세우다
  lexicon: HALOT
  rationale: חשׁב의 כאן은 단순한 ‘생각하다’가 아니라 장인의 맥락에서 세심하게 설계하고 고안하는 의미이므로, ‘정교한 설계를 고안하다’가 그 의도를 가장 잘 드러냅니다.
- source_word: לַעֲשׂוֹת
  english_pob_choice: to work
  chosen_korean: —
  alternatives_korean:
  - 만들다
  - 제작하다
  - 손으로 다루다
  lexicon: HALOT
  rationale: 영문 POB가 craft context를 살려 ‘work’로 옮긴 부분이지만, 한국어에서는 앞의 ‘고안하다’와 뒤의 금·은·놋 재료 목록이 이미 실행의 뜻을 충분히 담으므로 자연스러운 한 문장으로 압축했습니다.
- source_word: בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת
  english_pob_choice: in gold and in silver and in bronze
  chosen_korean: 금과 은과 놋
  alternatives_korean:
  - 금으로 그리고 은으로 그리고 놋으로
  - 금, 은, 그리고 청동으로
  - 금속 가운데 금과 은과 놋으로
  lexicon: HALOT
  rationale: 재료 목록의 ב는 도구적 ‘~으로/로’ 뉘앙스를 띠지만, 한국어에서는 예술·공예 재료를 단순 병렬로 나열하는 것이 가장 자연스러워 ‘금과 은과 놋’으로 옮겼습니다.
theological_decisions:
- issue: 출 31:4의 주어 생략과 수동적 표현 처리
  chosen_reading: 주어를 드러내지 않고 ‘고안하게 하셨습니다’로 옮겨, 앞 문맥의 하나님이 부여하신 지혜를 자연스럽게 이어 줍니다.
  alternative_readings:
  - 그가 정교한 설계를 고안합니다
  - 정교한 설계를 고안하여 작업하게 하셨습니다
  rationale: 히브리어는 목적 표현만으로 기능하지만, 문맥상 이는 하나님이 브살렐에게 주신 능력을 설명하는 구절이므로 한국어에서는 결과를 수여하시는 하나님의 행위를 분명히 드러내는 것이 적절합니다.
  doctrine_reference: 출애굽기 31:1-6 문맥
