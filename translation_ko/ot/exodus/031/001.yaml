  - 모세에게 말씀하시며
  lexicon: HALOT
  rationale: אֶל은 발화의 간접목적어이므로 자연스러운 조사 ‘에게’로 처리했고, 고유명사 모세는 통용 표기를 따랐습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: —
  alternatives_korean:
  - 말씀하시며
  - 이르시되
  lexicon: HALOT
  rationale: לֵאמֹר은 뒤따르는 직접 인용을 여는 공식어이므로 한국어 본문에서는 별도 동사를 중복하지 않고 문장 연결로 처리했습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 한국어 처리
