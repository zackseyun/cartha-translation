  rationale: 와우 연속형의 서술 진행과 새 사건 도입을 살려 ‘그때’로 자연스럽게 옮기되, 신적 발화에는 ‘말씀하다’를 써서 격식과 의미를 함께 살렸습니다.
- source_word: יְהוָה
