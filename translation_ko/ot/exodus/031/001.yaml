  rationale: אֶל은 발화의 간접목적어이므로 자연스러운 조사 ‘에게’로 처리했고, 고유명사 모세는 통용 표기를 따랐습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: —
  alternatives_korean:
  - 말씀하시며
