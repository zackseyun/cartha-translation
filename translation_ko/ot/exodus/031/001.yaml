  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 전통적 대체어가 아니라 음역형 ‘야훼’로 옮겨, POB의 이름 보존 원칙을 한국어에서도 반영했습니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
