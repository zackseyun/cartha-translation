  rationale: 출 31:1은 하나님의 직접 발화를 시작하는 서두이므로, 이름을 호칭어로 바꾸지 않고 본래의 언약적 고유명칭을 드러내는 것이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
