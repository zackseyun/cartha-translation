translation:
  language: ko
  text: 상과 그 기구들, 정결한 등잔대[a][b]와 그 모든 기구들, 그리고 향 제단[c]을
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메노라’로 옮길 수 있습니다. 이 히브리어는 성소의 등잔대를 가리키므로, 본문은 음역보다 일반 명사로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정결한’은 예식적 정결을 가리킬 수 있으며, 이 성막 문맥에서는 관련 본문에 나오는 ‘순금’ 재질을 함께 떠올리게 할 가능성도 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘분향 제단’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  english_pob_choice: the table
  chosen_korean: 상
  alternatives_korean:
  - 식탁
  - 표
  lexicon: HALOT
  rationale: 성막 문맥의 상을 가리키므로, 일반적인 ‘table’보다 제의적 용례에 맞는 ‘상’이 자연스럽습니다.
- source_word: כֵּלָיו
  english_pob_choice: its utensils
  chosen_korean: 그 기구들
  alternatives_korean:
  - 그 그릇들
  - 그 도구들
  - 그 용기들
  lexicon: HALOT
  rationale: כְּלִי는 폭넓게 ‘기구/도구/용기’를 뜻하므로, 성막 기물에 어울리는 포괄적 표현인 ‘기구들’을 택했습니다.
- source_word: הַמְּנֹרָה הַטְּהֹרָה
  english_pob_choice: the pure lampstand
  chosen_korean: 순수한 등잔대
  alternatives_korean:
  - 정결한 등잔대
  - 순결한 등잔대
  - 순금 등잔대
  lexicon: HALOT
  rationale: מְנוֹרָה는 ‘등잔대’이며, טָהוֹר는 여기서 ‘깨끗한’보다 예배 문맥에 맞는 ‘순수한’이 적절합니다.
- source_word: כָּל כֵּלֶיהָ
  english_pob_choice: all its utensils
  chosen_korean: 그 모든 기구들
  alternatives_korean:
  - 그 모든 용기들
  - 그 모든 도구들
  - 그 모든 물품들
  lexicon: HALOT
  rationale: ‘all’의 총칭성과 기구의 집합성을 함께 살리기 위해 ‘그 모든 기구들’로 옮겼습니다.
- source_word: מִזְבַּח הַקְּטֹרֶת
  english_pob_choice: the altar of incense
  chosen_korean: 향제단
  alternatives_korean:
  - 분향 제단
  - 향의 제단
  - 향을 위한 제단
  lexicon: HALOT
  rationale: 구문상 ‘향을 위한 제단/분향 제단’이 직역이지만, 한국어 성막 용례에서 널리 이해되는 간결한 표현인 ‘향제단’을 택했습니다.
theological_decisions:
- issue: ‘순수한’의 의미 범위
  chosen_reading: 등잔대의 재질·예식적 정결을 함께 환기하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘정결한’으로 좁혀 예식적 순결만 강조
  - ‘순금의’로 재질만 강조
  rationale: 히브리어 טָהוֹר는 일반적 정결과 제의적 순수성을 모두 담을 수 있고, POB가 지적한 바처럼 관련 본문의 순금 재질을 함께 연상시킬 수 있어 범위를 좁히지 않았습니다.
  doctrine_reference: 출 25:31-39, 특히 관련 성막 기물 묘사
