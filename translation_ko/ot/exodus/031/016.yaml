  text: וְ/שָׁמְר֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת הַ/שַּׁבָּ֑ת לַ/עֲשׂ֧וֹת אֶת הַ/שַּׁבָּ֛ת לְ/דֹרֹתָ֖/ם בְּרִ֥ית עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew reads literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'to do the Sabbath'; that is, to observe or keep it.
    reason: lexical_alternative
  - marker: c
    text: Or 'an eternal covenant' or 'a perpetual covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘 자손은 안식일을 지켜야 합니다. 대대로 안식일을 지켜 영원한 언약으로 삼아야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’이라고 되어 있습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘안식일을 행하다’이지만, 곧 ‘지키다/준수하다’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘영원한 언약’ 또는 ‘영속적인 언약’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  english_pob_choice: shall keep
  chosen_korean: 지켜야 합니다
  alternatives_korean:
  - 지켜야 한다
  - 지켜야 합니다
  lexicon: HALOT
  rationale: שׁמר의 기본 의미인 ‘지키다, 보존하다, 준수하다’를 살려, 언약적 의무를 자연스러운 합쇼체로 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 가족 표현을 그대로 살리되, 한국어 성경에서 널리 통용되는 ‘이스라엘 자손’을 사용해 집단적 언약 백성을 드러냈습니다.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  english_pob_choice: to observe the Sabbath
  chosen_korean: 안식일을 지켜
  alternatives_korean:
  - 안식일을 행하여
  - 안식일을 준수하여
  lexicon: HALOT
  rationale: 직역하면 ‘안식일을 행하다’이지만 한국어에서는 자연스럽지 않으므로, POB의 뜻풀이에 맞춰 ‘지키다/준수하다’로 옮겼습니다.
- source_word: בְּרִית עוֹלָם
  english_pob_choice: as an everlasting covenant
  chosen_korean: 영원한 언약으로
  alternatives_korean:
  - 영원한 언약으로
  - 영속적인 언약으로
  lexicon: HALOT
  rationale: עוֹלָם의 지속성을 ‘영원한’으로 옮기되, 문맥상 결과/규정의 뉘앙스를 살려 ‘언약으로 삼아야 합니다’로 마무리했습니다.
theological_decisions:
- issue: ‘do/make the Sabbath’ 관용구의 처리
  chosen_reading: ‘안식일을 지켜’로 옮겨, 단순 행위가 아니라 언약적 준수라는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘안식일을 행하여’
  - ‘안식일을 만들며’
  rationale: 히브리어 관용구를 문자 그대로 재현하면 한국어에서 의미가 흐려지므로, 본문이 요구하는 준수의 의미를 분명히 했습니다.
  doctrine_reference: Translation philosophy 1, 3
