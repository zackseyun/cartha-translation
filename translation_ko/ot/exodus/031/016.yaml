translation:
  language: ko
  text: 이스라엘 자손[a]은 안식일을 지키고, 대대로 이를 준수하여 영원한 언약[c]으로 삼아야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’이라고 되어 있습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘안식일을 행하다’이지만, 곧 ‘지키다’ 또는 ‘준수하다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘영원한 언약’은 ‘영구한 언약’ 또는 ‘영속적인 언약’으로도 옮길 수 있습니다.
    reason: lexical_alternative
