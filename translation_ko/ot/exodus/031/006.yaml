revisions:
- from: 그리고 보십시오, 내가 그와 함께 아히사막의 아들 오홀리압을, 단 지파에서, 세웠습니다. 또 마음이 지혜로운 사람마다의 마음에 내가 지혜를 주어, 그들이 내가 당신에게 명령한 모든 것을 만들게 하였습니다.
  to: 그리고 보십시오, 내가 그와 함께 단 지파 출신인 아히사막의 아들 오홀리압을 세웠습니다. 또 마음이 지혜로운 모든 사람의 마음에 내가 지혜를 주었습니다. 그들이 내가 당신에게 명령한 모든 것을 만들도록 하였습니다.
  rationale: 독립 대명사 ‘내가’와 הִנֵּה의 주의 환기 표현을 보존하고, אִתּוֹ를 ‘그와 함께’로 유지했습니다. חֲכַם לֵב 및 חָכְמָה의 ‘마음’과 ‘지혜’도 유지하되 한국어 문장 구조를 다듬었습니다. 마지막 절은 하나님이 지혜를 주신 목적을 나타내도록 조정하여, 원문의 목적/결과 관계를 보존하면서 불필요한 강제 사역 의미를 피했습니다.
