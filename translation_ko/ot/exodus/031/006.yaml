  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
  footnotes:
  - marker: a
    text: Or, more formally, 'and they shall make all that I have commanded you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'wise of heart,' an idiom for those endowed with wisdom or skill.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 보십시오, 내가 그와 함께 아히사막의 아들 오홀리압을, 단 지파에서, 세웠습니다. 또 마음이 지혜로운 사람마다의 마음에 내가 지혜를 주어, 그들이 내가 당신에게 명령한 모든 것을 만들게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 그리고 보라
  - 그리고 보십시오, 내가
  lexicon: HALOT
  rationale: 독립 인칭대명사 ‘내가’의 강조와 주의 환기 표현 הִנֵּה를 함께 살리기 위해 감탄적 도입어를 사용했습니다. 합쇼체 본문에 맞춰 ‘보십시오’로 옮겼습니다.
- source_word: נָתַתִּי אִתּוֹ
  english_pob_choice: have appointed with him
  chosen_korean: 그와 함께 …을 세웠습니다
  alternatives_korean:
  - 그와 함께 …을 नियुक्त했습니다
  - 그에게 …을 주었습니다
  lexicon: HALOT
  rationale: 이 문맥의 נתן은 단순 ‘주다’보다 직무를 맡겨 동반 배치하는 의미가 강하므로 ‘세우다’로 옮겼습니다. ‘그와 함께’도 함께 보존했습니다.
- source_word: חֲכַם לֵב / נָתַתִּי חָכְמָה
  english_pob_choice: wise of heart / I have put wisdom
  chosen_korean: 마음이 지혜로운 사람마다의 마음에 내가 지혜를 주어
  alternatives_korean:
  - 지혜로운 사람마다의 마음에 지혜를 두어
  - 마음이 슬기로운 사람마다에게 지혜를 주어
  lexicon: HALOT
  rationale: ‘wise of heart’의 히브리어적 표현을 그대로 살리되, 한국어에서는 ‘마음이 지혜로운’으로 자연스럽게 풀었습니다. חָכְמָה는 이 장의 공예 맥락에서도 단순 기술보다 하나님이 주시는 ‘지혜’가 더 직접적이어서 그대로 유지했습니다.
- source_word: וְעָשׂוּ אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  english_pob_choice: that they may make all that I have commanded you
  chosen_korean: 그들이 내가 당신에게 명령한 모든 것을 만들게 하였습니다
  alternatives_korean:
  - 그들이 내가 당신에게 명령한 모든 것을 만들 것입니다
  - 그들이 내가 당신에게 명령한 모든 것을 만들도록 하였습니다
  lexicon: HALOT
  rationale: 문법상 결과/목적을 드러내므로 단순 미래보다 사역적 결과를 표현했습니다. ‘당신에게’는 משה에게 직접 주어진 명령의 수신자를 분명히 합니다.
theological_decisions:
- issue: ‘wise of heart’의 번역 방향
  chosen_reading: ‘마음이 지혜로운 사람’으로 옮겨, 공예적 재능을 단순 기술이 아니라 하나님이 주시는 지혜로 제시했습니다.
  alternative_readings:
  - ‘숙련된 사람’
  - ‘슬기로운 사람’
  rationale: 이 본문은 성막 제작을 위한 은사 부여를 말하므로 기술적 숙련도 가능하지만, ‘마음’과 ‘지혜’를 유지해야 히브리어의 인식론과 신학적 구조가 보존됩니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: וְעָשׂוּ의 관계
  chosen_reading: ‘… 만들게 하였습니다’로 결과적 목적을 나타냈습니다.
  alternative_readings:
  - ‘… 만들 것입니다’
  - ‘… 만들도록 하였습니다’
  rationale: 지혜의 부여가 곧 제작의 실행으로 이어진다는 논리를 드러내기 위한 번역입니다. 교리적 쟁점은 아니지만, 본문의 원인-결과 구조를 보존합니다.
  doctrine_reference: Translation philosophy §1
