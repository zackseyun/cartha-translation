  naturalness: ‘돌을 다듬어 끼워 맞추는 일과 나무를 조각하는 일 등 온갖 일을 하게 하셨습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 앞 절부터 이어지는 하나님이 브살렐에게 능력을 주신 결과라는 문맥에도 맞습니다.
