translation:
  language: ko
  text: 돌에 새기고 나무를 조각하여, 모든 종류의 일을 하게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 돌을 ‘채우는/끼워 넣는’ 뜻을 포함하므로, 문맥상 돌을 맞춰 세팅하는 작업으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: מְלָאכָה는 일반적 ‘일’보다 숙련된 작업이나 공예를 포함하는 넓은 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת אֶבֶן
  english_pob_choice: in the cutting of stone / in the engraving of stone
  chosen_korean: 돌에 새기고
  alternatives_korean:
  - 돌을 다듬고
  - 돌을 깎고
  - 돌 공예를 하고
  lexicon: HALOT
  rationale: חֲרֹשֶׁת은 돌에 대한 숙련된 작업을 가리키므로, 문맥상 ‘새기다’로 옮겨 돌을 정교하게 가공하는 뜻을 살렸습니다.
- source_word: לְמַלֹּאת
  english_pob_choice: for setting
  chosen_korean: 채워 넣기 위해
  alternatives_korean:
  - 끼워 넣기 위해
  - 장착하기 위해
  - 세팅하기 위해
  lexicon: HALOT
  rationale: 직역하면 ‘채우다’에 가깝지만, 공예 문맥에서는 돌을 맞춰 끼워 넣는 뜻이므로 한국어에서는 앞 구절의 동작에 자연스럽게 이어지도록 처리했습니다.
- source_word: וּבַחֲרֹשֶׁת עֵץ
  english_pob_choice: and in the carving of wood
  chosen_korean: 나무를 조각하여
  alternatives_korean:
  - 나무를 깎아
  - 목재를 새겨
  - 나무 공예를 하여
  lexicon: HALOT
  rationale: 같은 어근이 돌에는 ‘새기다’, 나무에는 ‘조각하다’로 쓰여 재료에 따른 작업 차이를 한국어에서도 드러냈습니다.
- source_word: בְּכָל מְלָאכָה
  english_pob_choice: every kind of work
  chosen_korean: 모든 종류의 일
  alternatives_korean:
  - 모든 종류의 작업
  - 모든 일
  - 온갖 공예
  lexicon: HALOT
  rationale: מְלָאכָה는 일반적인 ‘일’보다 숙련된 작업까지 포괄하지만, 한국어에서는 과도하게 전문화하지 않고 포괄성을 살려 옮겼습니다.
theological_decisions:
- issue: 공예 기술의 범위
  chosen_reading: 이 절은 특정 한 가지 기술이 아니라 돌과 나무를 다루는 모든 종류의 숙련 작업을 가리킨다고 이해했습니다.
  alternative_readings:
  - 오직 성막 장식용 보석 세공만 가리킨다
  - 단순 노동보다 예술적 공예를 강조한다
  rationale: 본문의 מְלָאכָה와 재료 병행 구조가 기술의 포괄성을 보여 주므로, 문맥상 가능한 범위를 좁히지 않았습니다.
  doctrine_reference: 출 31:1-6 문맥상 브살렐에게 주어진 직능 부여
