  - 번제의 제단
  - 제사드리는 제단
  lexicon: HALOT
  rationale: 히브리어 관용구로서 ‘번제단’이 대상과 기능을 가장 직접적으로 드러내며, ‘번제의 제단’보다 한국어 성경 문맥에서 더 자연스럽습니다.
- source_word: כֵּלָיו
  english_pob_choice: its utensils
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 기물
  - 그 모든 도구
  - 그 모든 설비
  lexicon: HALOT
  rationale: 성막 문맥의 כְּלִי는 제단에 딸린 제사용 물품들을 가리키므로, ‘기구’가 현대 한국어에서 가장 무난하고 구체적입니다.
- source_word: הַכִּיּוֹר
  english_pob_choice: the basin
  chosen_korean: 물두멍
  alternatives_korean:
  - 세숫대야
  - 세정용 대야
  - 대야
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥에서는 전통적으로 ‘물두멍’이 잘 정착된 번역어이므로, 참고용 영어의 ‘basin’보다 성막 용례를 살리는 쪽을 택했습니다.
- source_word: כַנּוֹ
  english_pob_choice: its stand
  chosen_korean: 그 받침
  alternatives_korean:
  - 그 받침대
  - 그 기단
  - 그 밑받침
  lexicon: HALOT
  rationale: הכִּיּוֹר의 지지 구조를 간결하게 드러내는 말로 ‘받침’이 적절하며, 지시대명사 ‘그’를 보완해 소유 관계를 분명히 했습니다.
theological_decisions:
- issue: 번역 명령의 뉘앙스
  chosen_reading: ‘두십시오’로 옮겨, 성막 제작에 대한 지시·명령의 성격을 유지했습니다.
  alternative_readings:
  - 만드십시오
  - 놓으십시오
  - 제작하십시오
  rationale: 문맥상 하나님이 모세에게 성막 기구들을 지정하시는 장면이므로, 단순한 배치보다 지시의 힘을 드러내는 명령형이 적절합니다.
  doctrine_reference: 출애굽기 31장 성막 계시 문맥
