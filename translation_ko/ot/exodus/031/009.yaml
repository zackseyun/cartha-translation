  - 놓으십시오
  - 제작하십시오
  rationale: 문맥상 하나님이 모세에게 성막 기구들을 지정하시는 장면이므로, 단순한 배치보다 지시의 힘을 드러내는 명령형이 적절합니다.
  doctrine_reference: 출애굽기 31장 성막 계시 문맥
