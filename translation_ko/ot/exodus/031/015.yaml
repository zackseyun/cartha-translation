  source_fidelity: 초안의 ‘여섯 날 동안은 일할 것이나’는 히브리어의 비인칭적 수동 표현(‘일이 행해질 수 있다/행해진다’)보다 직접적인 능동 명령처럼 들립니다. 또한 מוֹת יוּמָת는 ‘죽을 것이다’가 아니라 사형 집행을 당하는 수동 법률 표현이므로 이를 드러내는 것이 필요합니다.
  naturalness: ‘야훼께 거룩한, 온전히 쉬는 안식일’은 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다. 문장 종결을 합쇼체로 통일했습니다.
  terminology: יהוה는 제공된 번역 원칙에 따라 ‘야훼’로 유지했습니다. שַׁבָּת שַׁבָּתוֹן의 강조는 ‘온전히 쉬는 안식일’로 옮겼으며, 특정 교파적 해석을 더하지 않았습니다.
  issues:
