    rationale: יֵעָשֶׂה מְלָאכָה는 문자적으로 ‘일이 행해질 수 있다/행해진다’입니다. 한국어에서는 ‘일을 할 수 있으나’가 자연스럽게 법규적 허용을 전달합니다.
  - severity: high
    issue: 사형 규정의 수동성이 충분히 반영되지 않습니다.
    rationale: מוֹת יוּמָת는 Hophal 수동형을 포함하여 ‘반드시 죽임을 당할 것이다’라는 사법적 처형의 뜻입니다. ‘죽일지니라’는 행위자를 생략한 능동 명령으로 바꾸므로 수동성을 명시하는 편이 더 충실합니다.
