id: EXO.31.14
reference: Exodus 31:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
  footnotes:
  - marker: a
    text: Or 'whoever desecrates it.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'shall be cut off from among his people,' a legal formula whose exact mode of judgment is not specified here.
    reason: alternative_reading
translation:
  language: ko
  text: 안식일을 지키십시오. 그것은 여러분에게 거룩한 것이기 때문입니다. 그것을 더럽히는 자[a]는 반드시 죽임을 당할 것입니다. 안식일에 일을 하는 모든 사람은 자기 백성 가운데서 끊어질 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 속되게 하는 자’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘자기 백성 가운데서 끊어질 것입니다’는 정확한 제재 방식이 명시되지 않은 법적 공식입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  english_pob_choice: You shall keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 지켜야 합니다
  - 보존하십시오
  - 준수하십시오
  lexicon: HALOT
  rationale: שׁמר는 ‘지키다, 준수하다’의 뜻을 가지며, 법적·언약적 문맥에서 합쇼체 명령으로는 ‘지키십시오’가 가장 자연스럽고 직접적입니다.
- source_word: הַשַּׁבָּת
  english_pob_choice: the Sabbath
  chosen_korean: 안식일
  alternatives_korean:
  - 그 안식일
  - 안식일 날
  lexicon: HALOT
  rationale: 히브리어 שבת의 통상적 명칭을 한국어 성경 관용에 맞게 ‘안식일’로 옮기되, 문맥상 제도/날 자체를 가리키므로 추가 설명은 두지 않았습니다.
- source_word: מְחַלְלֶיהָ
  english_pob_choice: whoever profanes it
  chosen_korean: 그것을 더럽히는 자
  alternatives_korean:
  - 그것을 범하는 자
  - 그것을 속되게 하는 자
  lexicon: HALOT
  rationale: חלל의 피엘형은 ‘속되게 하다, 더럽히다, profane/desecrate’의 뜻이므로, 제의적·법적 긴장을 살리는 ‘더럽히다’를 택했습니다.
- source_word: מוֹת יוּמָת
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당할 것이며
  alternatives_korean:
  - 반드시 죽을 것이며
  - 반드시 사형에 처해질 것이며
  lexicon: HALOT
  rationale: 동사 반복의 강조를 ‘반드시’로 살리고, משפט적 수동형은 한국어 법률어감에 맞게 ‘죽임을 당하다’로 옮겼습니다.
- source_word: הַנֶּפֶשׁ הַהִוא
  english_pob_choice: that person
  chosen_korean: 자기 백성 가운데서 끊어질 것입니다
  alternatives_korean:
  - 그 사람은 자기 백성 가운데서 끊어질 것입니다
  - 그 영혼은 자기 백성 가운데서 끊어질 것입니다
  lexicon: HALOT
  rationale: נפש는 여기서 존재론적 ‘영혼’보다 범죄한 개인을 가리키므로 ‘사람’의 의미를 살려 뒤의 제재 구문 전체로 자연스럽게 풀었습니다.
- source_word: מִקֶּרֶב עַמֶּיהָ
  english_pob_choice: from among his people
  chosen_korean: 자기 백성 가운데서
  alternatives_korean:
  - 그의 백성 가운데서
  - 자기 ժողովրդի 가운데서
  lexicon: HALOT
  rationale: ‘from among’의 집단 배제를 한국어 관용의 ‘~가운데서’로 살렸고, ‘자기 백성’은 공동체 소속의 의미를 분명히 합니다.
theological_decisions:
- issue: וְנִכְרְתָה의 법정 공식과 제재의 범위
  chosen_reading: ‘끊어지다’로 옮기되, 그 방식이 처형인지, 출교인지, 혹은 신적 판결인지는 본문에서 확정하지 않았습니다.
  alternative_readings:
  - 공동체에서 추방되다
  - 하나님께 의해 제거되다
  - 사망하다
  rationale: 히브리어 법정 공식 כרת는 구체적 집행 방식을 명시하지 않으므로, 번역에서도 해석을 과잉 확정하지 않고 POB의 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
