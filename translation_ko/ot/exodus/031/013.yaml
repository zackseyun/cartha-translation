  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
  footnotes:
  - marker: a
    text: Or 'Only/Nevertheless, you shall keep my Sabbaths.' The Hebrew particle אַךְ can mark restriction or strong emphasis.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel,' a standard covenantal designation for the people of Israel.
    reason: lexical_alternative
  - marker: c
    text: Or 'who makes you holy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 이스라엘 자손에게 말하여 이렇게 전하십시오. 「반드시 나의 안식일들을 지키십시오. 이는 나와 너희 사이에, 너희의 대대로 표가 되기 때문입니다. 그리하여 너희가 내가 너희를 거룩하게 하는 야훼임을 알게 하려는 것입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘반드시’는 히브리어 אַךְ의 강조를 살린 번역입니다. 문맥에 따라 ‘오직/그렇지만’의 제한 의미도 가능하지만, 여기서는 명령의 강한 강조가 더 두드러집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 히브리어 직역에 가까운 언약 호칭입니다. 문맥상 집합명사인 ‘이스라엘 사람들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘너희의 대대로’는 히브리어의 관용구로, 여러 세대에 걸친 지속성을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: And you
  chosen_korean: 너는
  alternatives_korean:
  - 당신은
  - 너 자신은
  lexicon: HALOT
  rationale: 문두의 강조된 대조를 한국어에서 자연스럽게 살리되, 이어지는 직접 명령형과 잘 맞도록 2인칭 주어를 간결하게 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 관용적 언약 호칭을 보존하되, 한국어 성경에서 널리 쓰이고 문맥상도 자연스러운 ‘이스라엘 자손’을 택했습니다.
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 반드시
  alternatives_korean:
  - 오직
  - 그렇지만
  - 확실히
  lexicon: HALOT
  rationale: 제한과 강조를 함께 띠는 אַךְ의 힘을 살리기 위해, 배타성은 과하지 않으면서 명령의 강한 강조를 드러내는 ‘반드시’를 썼습니다.
- source_word: שַׁבְּתֹתַי
  english_pob_choice: my Sabbaths
  chosen_korean: 나의 안식일들
  alternatives_korean:
  - 나의 안식일
  - 내 안식일들
  - 안식일들
  lexicon: HALOT
  rationale: 히브리어 복수형을 그대로 반영해 단수로 완화하지 않았고, 언약적 소유격도 유지했습니다.
- source_word: אוֹת
  english_pob_choice: a sign
  chosen_korean: 표
  alternatives_korean:
  - 징표
  - 표적
  - 표시
  lexicon: HALOT
  rationale: 언약적 기능을 지닌 'sign'을 한국어로는 일상적이면서도 관계적 의미를 유지하는 ‘표’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 신성명은 전통 대체어 ‘주’가 아니라, 감추지 않고 표기하는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: אַךְ의 강조와 제한 뉘앙스
  chosen_reading: ‘반드시’로 강한 준수를 요구하는 강조로 처리했습니다.
  alternative_readings:
  - 오직
  - 그렇지만
  - 오로지
  rationale: 문맥상 단순한 배타성보다 언약적 명령의 강한 촉구가 핵심이므로, 독자가 의무의 강도를 즉시 느끼도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §2: source-force preservation'
- issue: מְקַדִּשְׁכֶם의 번역
  chosen_reading: ‘너희를 거룩하게 하는’으로 현재적·지속적 작용을 살렸습니다.
  alternative_readings:
  - 너희를 성결하게 하는
  - 너희를 성화하는
  rationale: קדשׁ의 동작성을 보존하면서도 한국어 독자에게 과도하게 교단 용어화되지 않도록 ‘거룩하게 하는’을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — קדשׁ / holiness vocabulary'
