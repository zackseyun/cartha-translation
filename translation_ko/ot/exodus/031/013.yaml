base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
  footnotes:
  - marker: a
    text: Or 'Only/Nevertheless, you shall keep my Sabbaths.' The Hebrew particle אַךְ can mark restriction or strong emphasis.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel,' a standard covenantal designation for the people of Israel.
    reason: lexical_alternative
  - marker: c
    text: Or 'who makes you holy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 이스라엘 자손[b]에게 이렇게 말하십시오. 「반드시[a] 너희는 나의 안식일들을 지키십시오. 이것은 너희 대대로 나와 너희 사이의 표이므로, 너희가 내가 너희를 거룩하게 하는[c] 야훼임을 알도록 하기 위함입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘반드시’는 히브리어 אַךְ의 강조를 살린 번역입니다. 문맥에 따라 ‘오직’ 또는 ‘그렇지만’처럼 제한·전환의 의미로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 히브리어 직역에 가까운 언약 호칭입니다. 문맥상 집합적으로 이스라엘 백성을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘거룩하게 하는’은 ‘성결하게 하는’ 또는 ‘거룩하게 하시는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: And you
  chosen_korean: 너는
  alternatives_korean:
