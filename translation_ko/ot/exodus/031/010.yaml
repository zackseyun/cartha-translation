translation:
  language: ko
  text: 그리고 정교하게 짠 옷[a]과 제사장 아론을 위한 거룩한 옷과 그의 아들들이 제사장으로 섬길 때 입을 옷,
  philosophy: optimal-equivalence
  footnotes:
