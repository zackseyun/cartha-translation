translation:
  language: ko
  text: 그리고 세밀하게 짠 옷[a], 아론 제사장의 거룩한 옷, 그리고 그의 아들들의 제사장 직무를 위한 옷입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘직무용 옷’, ‘봉사 옷’, ‘짠 옷’으로도 옮길 수 있습니다. 히브리어 בִּגְדֵי הַשְּׂרָד는 뜻이 분명하지 않아, 직조의 방식이나 성막 봉사의 용도를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  english_pob_choice: the finely woven garments
  chosen_korean: 세밀하게 짠 옷
  alternatives_korean:
  - 직무용 옷
  - 봉사 옷
  - 짠 옷
  lexicon: HALOT
  rationale: POB가 이 표현의 난해성을 인정하고 직조/제작의 감각을 살려 옮겼으므로, 한국어도 기능어보다 제작 감각이 드러나는 표현을 택했습니다.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  english_pob_choice: the holy garments
  chosen_korean: 거룩한 옷
  alternatives_korean:
  - 성스러운 옷
  lexicon: HALOT
  rationale: 직역 구조를 살리되, 한국어 성서 문맥에서 자연스러운 ‘거룩한 옷’으로 옮겼습니다.
- source_word: לְכַהֵן
  english_pob_choice: for serving as priests
  chosen_korean: 제사장 직무를 위한 옷
  alternatives_korean:
  - 제사장으로 섬기기 위한 옷
  - 제사장으로 봉사하기 위한 옷
  lexicon: HALOT
  rationale: כהן의 동사형은 단순한 봉사보다 제사장 직무 수행을 가리키므로, 문맥상 목적을 드러내는 명사구로 옮겼습니다.
theological_decisions:
- issue: 제사장 직무의 성격
  chosen_reading: ‘섬김’보다 ‘직무’로 옮겨, 옷이 단순한 복장이 아니라 성막 제의에 지정된 직분의 표지임을 드러냈습니다.
  alternative_readings:
  - 제사장으로 섬기기 위한 옷
  - 제사장 직분을 수행하는 옷
  rationale: 문맥은 일반적 봉사가 아니라 아론과 그의 아들들에게 지정된 제사장 직무를 말하므로, 한국어에서도 제의적 지정성을 분명히 하는 것이 좋습니다.
  doctrine_reference: 출애굽기 31장의 성막/제사장 제도
- issue: בִּגְדֵי הַשְּׂרָד의 난해성
  chosen_reading: ‘세밀하게 짠 옷’으로 본문에 두고, 각주로 번역 대안을 제시했습니다.
  alternative_readings:
  - 직무용 옷
  - 봉사 옷
  - 짠 옷
  rationale: 히브리어 용례가 모호하므로, POB처럼 단정적인 기능어보다 직조/제작 가능성을 살리는 번역을 본문에 두고 대안은 각주로 보완했습니다.
  doctrine_reference: 히브리어 어휘의 불확실성
