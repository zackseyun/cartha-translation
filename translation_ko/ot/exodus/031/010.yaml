  lexicon: HALOT
  rationale: כהן의 동사형은 단순한 봉사보다 제사장 직무 수행을 가리키므로, 문맥상 목적을 드러내는 명사구로 옮겼습니다.
theological_decisions:
- issue: 제사장 직무의 성격
  chosen_reading: ‘섬김’보다 ‘직무’로 옮겨, 옷이 단순한 복장이 아니라 성막 제의에 지정된 직분의 표지임을 드러냈습니다.
  alternative_readings:
  - 제사장으로 섬기기 위한 옷
  - 제사장 직분을 수행하는 옷
  rationale: 문맥은 일반적 봉사가 아니라 아론과 그의 아들들에게 지정된 제사장 직무를 말하므로, 한국어에서도 제의적 지정성을 분명히 하는 것이 좋습니다.
  doctrine_reference: 출애굽기 31장의 성막/제사장 제도
- issue: בִּגְדֵי הַשְּׂרָד의 난해성
  chosen_reading: ‘세밀하게 짠 옷’으로 본문에 두고, 각주로 번역 대안을 제시했습니다.
  alternative_readings:
  - 직무용 옷
  - 봉사 옷
  - 짠 옷
  rationale: 히브리어 용례가 모호하므로, POB처럼 단정적인 기능어보다 직조/제작 가능성을 살리는 번역을 본문에 두고 대안은 각주로 보완했습니다.
  doctrine_reference: 히브리어 어휘의 불확실성
