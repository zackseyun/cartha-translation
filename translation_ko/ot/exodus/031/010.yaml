    text: 또는 ‘직무용 옷’, ‘봉사용 옷’, ‘짠 옷’으로도 옮길 수 있습니다. 히브리어 בִּגְדֵי הַשְּׂרָד는 뜻이 분명하지 않아, 직조의 방식이나 성막 봉사의 용도를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  english_pob_choice: the finely woven garments
