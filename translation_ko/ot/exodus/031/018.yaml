  text: וַ/יִּתֵּ֣ן אֶל מֹשֶׁ֗ה כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֤ר אִתּ/וֹ֙ בְּ/הַ֣ר סִינַ֔י שְׁנֵ֖י לֻחֹ֣ת הָ/עֵדֻ֑ת לֻחֹ֣ת אֶ֔בֶן כְּתֻבִ֖ים בְּ/אֶצְבַּ֥ע אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
  footnotes:
  - marker: a
    text: Or 'by the finger of God.' The Hebrew expression vividly attributes the writing directly to God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 시내 산에서 그와 말하기를 마치자, 모세에게 증거판 두 개, 곧 돌판들을 주셨습니다. 그것들은 하나님의 손가락으로 기록된 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘증거판’은 히브리어 עֵדֻת의 관용적 의미를 반영한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: he gave
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주었습니다
  - 건네주셨습니다
  lexicon: HALOT
  rationale: 서술형 완료 과거를 자연스러운 합쇼체로 옮기되, 주어가 하나님으로 이어지는 문맥을 살려 존대형 동사로 처리했습니다.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר אִתּוֹ
  english_pob_choice: when he finished speaking with him
  chosen_korean: 그와 말하기를 마치자
  alternatives_korean:
  - 그와 말하기를 마친 뒤
  - 그와 말씀하시기를 마치시자
  lexicon: HALOT
  rationale: ‘말하기를 마치다’는 완료의 시간관계를 유지하면서 한국어에서 더 자연스럽게 들리도록 압축했습니다. '그와'는 문맥상 모세를 가리키는 대상을 반영합니다.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  english_pob_choice: the two tablets of the testimony
  chosen_korean: 증거판 두 개
  alternatives_korean:
  - 증언의 두 판
  - 증거의 두 돌판
  lexicon: HALOT
  rationale: הָעֵדֻת는 율법 전승 안의 ‘증거/증거판’이라는 관용적 의미를 살려, 전통적이지만 본문 기능을 드러내는 ‘증거판’으로 옮겼습니다. 이어지는 ‘돌판들’로 형태와 재료를 분명히 했습니다.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  english_pob_choice: with the finger of God
  chosen_korean: 하나님의 손가락으로
  alternatives_korean:
  - 하나님의 손가락으로써
  - 하나님의 손가락에 의해
  lexicon: HALOT
  rationale: 직역에 가까운 표현을 유지하여 하나님의 직접적인 기록 행위를 드러냈습니다. POB의 의도를 따라 비유적·인간형 표현을 완화하지 않았습니다.
theological_decisions:
- issue: 하나님의 직접 기록을 나타내는 의인화 표현
  chosen_reading: 하나님의 손가락으로
  alternative_readings:
  - 하나님의 능력으로
  - 하나님께서 직접
  rationale: 히브리어의 구체적 의인화를 보존해야 본문이 강조하는 직접성, 권위, 생생한 이미지를 유지할 수 있습니다.
  doctrine_reference: Translation philosophy §3
