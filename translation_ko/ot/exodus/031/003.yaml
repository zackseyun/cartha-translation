id: EXO.31.3
reference: Exodus 31:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֲמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה וּ/בִ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
  footnotes:
  - marker: a
    text: Or 'the spirit of God' or 'a divine spirit.' The Hebrew phrase can be understood more generally, but here it likely refers to God's own empowering Spirit.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 그를 하나님의 영과 지혜와 명철과 지식과 온갖 기술로 채웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘하나님의 영’은 ‘신적인 영’으로도 이해할 수 있습니다. 그러나 여기서는 하나님께서 성막 일을 위해 그에게 능력을 부여하시는 문맥입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּ֥א
  english_pob_choice: And I have filled
  chosen_korean: 내가 … 채웠습니다
  alternatives_korean:
  - 내가 … 가득 채웠습니다
  - 내가 … 채웠습니다
  lexicon: HALOT
  rationale: 동사 מלא의 핵심 의미를 살려 ‘채우다’로 옮겼고, 하나님의 선언문체에 맞게 완료된 부여를 자연스러운 현재완료적 종결로 표현했습니다.
- source_word: רוּחַ אֱלֹהִים
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님의 기운
  - 신적 영
  lexicon: HALOT
  rationale: 히브리어 구문은 문맥상 하나님의 능동적 임재/영을 가리키므로, POB의 ‘Spirit of God’를 따라 ‘하나님의 영’으로 옮기되, 신적 인격성을 과도하게 단정하는 ‘성령’은 피했습니다.
- source_word: בְּחָכְמָ֛ה וּ/בִ/תְבוּנָ֥ה וּ/בְ/דַעַת
  english_pob_choice: with wisdom, with understanding, with knowledge
  chosen_korean: 지혜와 명철과 지식으로
  alternatives_korean:
  - 지혜와 이해와 지식으로
  - 지혜와 통찰과 지식으로
  lexicon: HALOT
  rationale: 세 항목의 병렬을 한국어 명사열로 간결하게 살렸고, תבונה는 전통적 문맥에서 ‘명철’이 ‘이해/통찰’보다 더 어울려 지혜-명철-지식의 삼중구조를 보존합니다.
- source_word: וּ/בְ/כָל מְלָאכָֽה
  english_pob_choice: with every kind of craftsmanship
  chosen_korean: 모든 종류의 기술로
  alternatives_korean:
  - 모든 종류의 솜씨로
  - 온갖 공예 기술로
  - 모든 기술로
  lexicon: HALOT
  rationale: מְלָאכָה는 여기서 성막 제작에 필요한 숙련된 작업/기술을 뜻하므로, 단순한 ‘일’보다 ‘기술’이 문맥에 맞고, ‘모든 종류의’로 כל의 포괄성을 자연스럽게 반영했습니다.
theological_decisions:
- issue: רוּחַ אֱלֹהִים을 인격적 ‘성령’으로 단정할지, 보다 직접적인 ‘하나님의 영’으로 둘지
  chosen_reading: 하나님의 영
  alternative_readings:
  - 하나님의 성령
  - 하나님의 기운
  rationale: 본문은 브살렐의 성막 기술을 위한 하나님의 부여를 말하므로, 문맥이 허용하는 범위 안에서 하나님의 능동적 영을 가리키는 표현으로 옮겼습니다. 이는 본문의 의미를 유지하면서도 후대 교리 용어를 앞세우지 않습니다.
  doctrine_reference: Translation philosophy §3; Affirmations
