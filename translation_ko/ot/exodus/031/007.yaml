lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 만남의 장막
  alternatives_korean:
  - 회막
  - 만남의 천막
  - 임재의 장막
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 성막 맥락에서 하나님과 이스라엘이 만나는 장소를 가리키므로, 직역하면서도 의미를 살린 ‘만남의 장막’을 택했습니다.
- source_word: הָאָרֹן לָעֵדֻת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증거의 궤
  - 증언궤
  - 증거를 위한 궤
  lexicon: HALOT
  rationale: לָעֵדֻת의 관계를 살리되 한국어 성서 용례에 맞는 간결한 합성어로 ‘증거궤’를 사용했습니다.
- source_word: הַכַּפֹּרֶת
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 시은좌
  - 은혜의 자리
  - 속죄 덮개
  lexicon: HALOT
  rationale: כַּפֹּרֶת는 궤의 덮개이면서 속죄와 연결되는 용어이므로, 전통적 ‘시은좌’보다 원뜻이 더 드러나는 ‘속죄소’를 선택했습니다.
- source_word: כָּל כְּלֵי הָאֹהֶל
  english_pob_choice: all the furnishings of the tent
  chosen_korean: 장막의 모든 기구들
  alternatives_korean:
  - 장막의 모든 비품들
  - 장막의 모든 용구들
  - 장막의 모든 물품들
  lexicon: HALOT
  rationale: כְּלִים은 성막의 도구·기물 전반을 가리키므로, 문맥에 맞는 포괄적 표현인 ‘기구들’이 가장 자연스럽습니다.
theological_decisions:
- issue: הַכַּפֹּרֶת의 한국어 전통 용어 선택
  chosen_reading: ‘속죄소’로 번역하여 덮개 기능과 속죄 연관을 함께 드러냈습니다.
  alternative_readings:
  - 시은좌
  - 은혜의 자리
  - 속죄 덮개
  rationale: 본절은 궤 위의 물리적 위치를 설명하면서도 성소-속죄 의미를 함축하므로, 전통적 예배용어를 그대로 따르기보다 원문의 신학적 함의를 분명히 하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
