  source_fidelity: ‘관유’는 שֶׁמֶן הַמִּשְׁחָה를 적절히 옮깁니다. 다만 קְטֹרֶת הַסַּמִּים의 각주가 원문의 대안 표현을 정확히 반영하지 못하며, 본문의 לַקֹּדֶשׁ는 ‘성소를 위한’으로 유지할 수 있습니다. 문두의 목적어 열거는 앞절에서 이어지는 ‘만들다’의 목적어이므로, 한국어에서는 이를 보충하는 것이 필요합니다.
  naturalness: ‘향기로운 향’은 다소 중복적으로 들릴 수 있으나 제의용 향을 가리키는 문맥에서 이해 가능합니다. ‘그들은’의 선행사는 장인들이며, 한국어에서는 문맥상 생략할 수도 있지만 명시해도 무방합니다. 각주 표지는 해당 어휘 바로 뒤에 두는 편이 자연스럽고 앵커가 명확합니다.
  terminology: ‘관유’와 ‘성소’는 한국어 성경 문체에서 통용되는 적절한 제의 용어입니다. קְטֹרֶת הַסַּמִּים의 직역적 대안은 ‘향료의 향’ 또는 ‘향료로 만든 향’이며, 기존 각주의 ‘향료의 향기를 위한 향’은 원문 의미를 바꿉니다.
  issues:
