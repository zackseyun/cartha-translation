lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  english_pob_choice: the anointing oil
  chosen_korean: 관유
  alternatives_korean:
  - 기름부음의 기름
  - 바르는 기름
  - 성별된 관유
  lexicon: HALOT
  rationale: 공예적·예배적 용도의 기름을 가리키는 관용적 표현이므로, 한국어 성경에서 널리 통하는 ‘관유’가 원문의 기능을 가장 간결하게 전달합니다.
- source_word: קְטֹרֶת הַסַּמִּים
  english_pob_choice: the fragrant incense
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 향료의 향
  - 향료로 만든 향
  - 향기로운 향료향
  lexicon: HALOT
  rationale: 직역하면 ‘향료들의 향’이지만 한국어에서는 다소 어색하므로, 향기 있는 제의용 향이라는 뜻을 살려 자연스럽게 옮겼습니다.
- source_word: לַקֹּדֶשׁ
  english_pob_choice: for the holy place
  chosen_korean: 성소를 위한
  alternatives_korean:
  - 거룩한 곳을 위한
  - 성별된 곳을 위한
  - 성전을 위한
  lexicon: HALOT
  rationale: הַקֹּדֶשׁ는 여기서 장소명으로서의 ‘성소’가 가장 직접적이므로, ‘for the holy place’의 의미를 공간적·예배적 용법 모두 살릴 수 있게 했습니다.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  english_pob_choice: according to all that I have commanded you
  chosen_korean: 내가 당신에게 명령한 모든 대로
  alternatives_korean:
  - 내가 당신에게 명령한 바와 같이
  - 내가 당신에게 명령한 모든 것을 따라
  - 내가 당신에게 명령한 전부대로
  lexicon: HALOT
  rationale: ‘모든 대로’로 בכֹל의 포괄성을 살리고, 직접 명령의 어조를 유지하기 위해 평서형이 아닌 지시적 문장으로 옮겼습니다.
theological_decisions:
- issue: 제의용 물품의 명명
  chosen_reading: ‘관유’와 ‘성소를 위한 향기로운 향’으로 옮겨 제의적 기능을 드러냈습니다.
  alternative_readings:
  - ‘거룩한 기름’과 ‘거룩한 향’
  - ‘성별된 기름’과 ‘향료 향’
  rationale: 본문은 단순한 물질 목록이 아니라 성막 예배에 쓰일 전용 물품을 말하므로, 기능을 드러내는 전통적이면서도 오해가 적은 표현을 택했습니다.
  doctrine_reference: 출애굽기 30:23-38; 31:11
- issue: 인칭 대명사의 존대
  chosen_reading: 하나님의 직접 خطاب을 반영해 ‘당신에게’로 두었고, 명령형은 한국어 합쇼체로 처리했습니다.
  alternative_readings:
  - ‘네게’
  - ‘너에게’
  rationale: 본문의 2인칭 단수 직접 خطاب을 유지하되, 한국어 출판문체에 맞는 정중한 높임을 적용하여 신학적 거리감과 문체의 현대성을 함께 살렸습니다.
  doctrine_reference: 출애굽기 31:11
