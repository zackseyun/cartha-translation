    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 청자를 직접 주의로 이끄는 명령형으로, 합쇼체 문맥에 맞게 공손하면서도 원문의 즉각성을 살렸습니다.
- source_word: קָרָאתִי בְּשֵׁם
  english_pob_choice: I have called by name
  chosen_korean: 이름으로 불렀습니다
  alternatives_korean:
  - 이름으로 부르셨습니다
  - 이름으로 불러 지명하셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 한국어로는 자연스러운 표현을 택해, 단순 호칭보다 특정한 지명·지정을 담는 뉘앙스를 유지했습니다.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  english_pob_choice: Bezalel son of Uri, son of Hur
  chosen_korean: 훌의 손자, 우리의 아들 브살렐
  alternatives_korean:
  - 우리의 아들, 훌의 손자 브살렐
  - 브살렐, 우리의 아들, 훌의 손자
  lexicon: HALOT
  rationale: 족보 관계를 한국어에서 가장 자연스럽고 명확하게 전달하도록 위계를 보존했습니다. 브살렐은 통용 표기보다 원음에 가까운 ‘브살렐’을 택했습니다.
- source_word: לְמַטֵּה יְהוּדָה
  english_pob_choice: of the tribe of Judah
  chosen_korean: 유다 지파에 속한
  alternatives_korean:
  - 유다 지파의
  - 유다 지파에 속하는
  lexicon: HALOT
  rationale: לְ + מַטֶּה의 소속 관계를 한국어에서 자연스럽게 풀어, 혈통 표지가 아니라 소속·귀속을 분명히 했습니다.
theological_decisions:
- issue: קָרָאתִי בְּשֵׁם의 의미가 단순 호명이 아니라 신적 선발·지정까지 내포하는지
  chosen_reading: 본문은 ‘이름으로 부르다’의 직접 표현을 유지하되, 선택과 지정의 함의는 문맥이 드러내도록 했습니다.
  alternative_readings:
  - 브살렐을 특별히 지명했습니다
  - 브살렐을 따로 불러 세웠습니다
  rationale: 히브리어 관용구에 있는 선발의 뉘앙스를 완전히 지워서는 안 되지만, 동사를 ‘임명하다’로 바꾸면 본문이 말하는 호명 자체가 약해집니다. 그래서 원문의 긴장을 유지했습니다.
  doctrine_reference: 신적 소명과 선택
