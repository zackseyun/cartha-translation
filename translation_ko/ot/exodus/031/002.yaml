  naturalness: ‘보십시오’와 ‘이름으로 불렀습니다’는 현대 합쇼체에서 가능하며, 본문 장르에도 어울립니다. 다만 인명 우리와 소유 대명사 ‘우리’의 동형성을 줄이도록 계보를 풀어 쓰는 편이 낫습니다.
  terminology: 브살렐, 우리, 훌, 유다 지파는 통용 가능한 표기입니다. ‘유다 지파에 속한’은 לְמַטֵּה יְהוּדָה의 소속 의미를 충실히 전달합니다.
