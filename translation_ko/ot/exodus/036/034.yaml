id: EXO.36.34
reference: Exodus 36:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/אֶת הַ/קְּרָשִׁ֞ים צִפָּ֣ה זָהָ֗ב וְ/אֶת טַבְּעֹתָ/ם֙ עָשָׂ֣ה זָהָ֔ב בָּתִּ֖ים לַ/בְּרִיחִ֑ם וַ/יְצַ֥ף אֶת הַ/בְּרִיחִ֖ם זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
  footnotes:
  - marker: a
    text: Or 'boards' instead of 'frames.' The Hebrew term refers to the tabernacle's structural wooden members.
    reason: lexical_alternative
  - marker: b
    text: Literally 'houses for the bars,' an idiom for holders or receptacles for the bars.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 널빤지에 금을 입히고[a], 그것들의 고리들을 막대들을 위한 금 받침으로 만들고[b], 막대에도 금을 입혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘틀’. 히브리어 용어는 성막의 곧게 세운 구조용 목재 부재를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘막대들을 위한 집들’입니다. 여기서는 금으로 만든 고리들이 막대가 들어가도록 하는 받침 또는 수용부 역할을 한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  english_pob_choice: the frames
  chosen_korean: 널빤지들
  alternatives_korean:
  - 틀
  - 판자들
  - 보드들
  lexicon: HALOT
  rationale: 성막 구조물의 목재 부재를 가리키는 말로, 영어 POB의 'frames' 취지를 따르되 한국어에서는 기능보다 재료와 형상을 드러내는 '널빤지들'이 가장 자연스럽습니다.
- source_word: צִפָּה / וַיְצַף
  english_pob_choice: overlaid
  chosen_korean: 금을 입히고 / 금을 입혔습니다
  alternatives_korean:
  - 금으로 덮고 / 금으로 덮었습니다
  - 금으로 입히고 / 금으로 입혔습니다
  lexicon: HALOT
  rationale: צפה는 표면에 금속 층을 입히는 뜻이므로, 성막 문맥에서 통용되는 '금을 입히다'를 사용해 물질적 층을 입히는 의미를 정확히 살렸습니다.
- source_word: בָּתִּים
  english_pob_choice: holders
  chosen_korean: 받침
  alternatives_korean:
  - 집
  - 소켓
  - 받이
  lexicon: HALOT
  rationale: 직역하면 '집들'이지만, 막대가 들어가 고정되는 장치를 가리키므로 기능적 의미를 드러내는 '받침'이 원문과 POB 주석의 관찰에 가장 잘 맞습니다.
- source_word: לַבְּרִיחִם
  english_pob_choice: for the bars
  chosen_korean: 막대들을 위한
  alternatives_korean:
  - 띠들을 위한
  - 빗장들을 위한
  - 가로막대를 위한
  lexicon: HALOT
  rationale: בְּרִיחִים는 성막을 결속하는 가로막대를 가리키므로, 본문 기능을 따라 '막대들'로 옮기되 주석 없이도 이해되도록 문맥을 살렸습니다.
theological_decisions:
- issue: 성막 제작 문맥의 기술적 묘사에서 과도한 해석을 피하는 문제
  chosen_reading: 문장 구조를 따라 재료와 제작 동작을 연속적으로 기술해, 본문이 말하는 금 입힘과 고리·받침 제작을 그대로 드러냈습니다.
  alternative_readings:
  - 의미를 풀어 '장식했다'로 완화하는 번역
  - 설명적으로 '고리를 달았다'로 바꾸는 번역
  rationale: 본문은 예배 규범의 세부 공정 묘사이므로, 기능을 요약하기보다 공정 자체를 보존하는 것이 원문의 정보량과 정확성에 더 충실합니다.
  doctrine_reference: 출애굽기 25–40장의 성막 지침과 완성 서술
- issue: 히브리어 '집들'의 직역 가능성과 관용적 의미 사이의 긴장
  chosen_reading: '''받침''으로 번역해 관용적 기능을 드러내되, 구조물 부품이라는 성막 문맥을 유지했습니다.'
  alternative_readings:
  - '''집들''로 직역'
  - '''소켓''으로 기술적 외래어화'
  rationale: 영어 POB가 'holders'로 기능을 확정했듯이, 한국어도 오해 소지가 큰 직역을 피하면서 문맥이 요구하는 받는 장치의 의미를 살리는 편이 적절합니다.
  doctrine_reference: 출애굽기 36장 성막 조립 설명
