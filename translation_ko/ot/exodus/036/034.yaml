  source_fidelity: 개정이 필요합니다. 초안은 히브리어의 ‘그 고리들을 금으로 만들어 막대들을 위한 받침으로’라는 관계를, 고리 제작과 별도의 받침 제작이라는 두 행위처럼 보이게 합니다. 고리 자체가 막대들을 위한 수용 장치라는 뜻을 문장 안에서 밝혀야 합니다.
  naturalness: ‘그들의 고리들’보다 무생물 소유 관계에는 ‘그것들의 고리들’ 또는 문맥상 생략이 자연스럽습니다. 또한 ‘널빤지들’은 한국어에서 복수 접미사가 다소 중복되어 보이므로 ‘널빤지에’가 더 매끄럽습니다.
