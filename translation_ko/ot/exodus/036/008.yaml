revisions:
- from: 지혜로운 자 곧 일하는 모든 사람이 야훼의 명령에 따라 성막을 만들되, 가는 베와 청색과 자색과 홍색 실로 엮은 열 개의 휘장을 만들었으며, 그 휘장에는 수공예가 만든 그룹들을 새겼더라.
  to: 일을 하는 이들 가운데 마음이 지혜로운 모든 사람이 성막, 곧 가늘게 꼰 베실과 청색 실과 자색 실과 홍색 실로 만든 열 폭의 휘장을 만들었습니다. 그들은 정교한 기술자의 작품으로 그룹들을 그 위에 짜 넣었습니다.[a]
  rationale: The revision removes the unsupported reference to Yahweh’s command, accurately presents the materials and ten curtains, and renders the cherubim as woven into the curtains rather than carved. It retains the skilled-workmanship sense of מַעֲשֵׂה חֹשֵׁב and documents the source text’s unusual final singular verb without forcing an unnatural Korean singular construction.
