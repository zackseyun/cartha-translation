translation:
  language: ko
  text: 그리고 그는 성막 뒤쪽 양 모퉁이를 위해 널판 두 개를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성막의 모퉁이용 널판들, 곧 뒤쪽 양끝에 있는 것들’로 옮길 수 있습니다. 히브리어 표현은 구조물의 뒤쪽 끝부분이나 모퉁이를 가리킬 수 있으며, 특별히 결합되는 모퉁이 널판을 강조할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵ֤י
  english_pob_choice: And ... two
  chosen_korean: 그리고 ... 두 개의
  alternatives_korean:
  - 그리고 두
  - 또 두
  lexicon: HALOT
  rationale: 서술의 연속을 살리기 위해 접속을 넣고, 수량은 한국어에서 자연스러운 ‘두 개의’로 분명히 표시했습니다.
- source_word: קְרָשִׁים
  english_pob_choice: boards
  chosen_korean: 널판
  alternatives_korean:
  - 판자
  - 보드
  lexicon: HALOT
  rationale: 성막 구조물의 목재 부재를 한국어 성경문체에서 자연스럽게 드러내는 표현으로 ‘널판’을 택했습니다.
- source_word: לִ/מְקֻצְעֹ֖ת הַ/מִּשְׁכָּ֑ן
  english_pob_choice: for the corners of the tabernacle
  chosen_korean: 성막의 뒤쪽 모퉁이를 위해
  alternatives_korean:
  - 성막의 모퉁이를 위해
  - 성막의 모퉁이 부분을 위해
  lexicon: HALOT
  rationale: 히브리어가 가리키는 위치적·구조적 모퉁이를 한국어로는 ‘뒤쪽 모퉁이’로 풀어, 성막의 후면 배치라는 점을 드러냈습니다.
- source_word: בַּ/יַּרְכָתָֽיִם
  english_pob_choice: at the rear
  chosen_korean: 뒤쪽
  alternatives_korean:
  - 뒤편
  - 후면
  lexicon: HALOT
  rationale: 쌍수형이 암시하는 후면의 두 끝/뒤쪽 부분을 간결하게 살리기 위해 ‘뒤쪽’으로 옮겼습니다.
