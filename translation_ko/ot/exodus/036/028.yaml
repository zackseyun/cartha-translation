  text: And he made two boards for the corners of the tabernacle at the rear[a].
  footnotes:
  - marker: a
    text: Or 'for the corner-pieces of the tabernacle, at the two rear sides.' The Hebrew terms describe the back extremities/corners of the structure and may emphasize either the corner location or the specially joined corner boards.
