id: EXO.36.30
reference: Exodus 36:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיוּ֙ שְׁמֹנָ֣ה קְרָשִׁ֔ים וְ/אַדְנֵי/הֶ֣ם כֶּ֔סֶף שִׁשָּׁ֥ה עָשָׂ֖ר אֲדָנִ֑ים שְׁנֵ֤י אֲדָנִים֙ שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/030.yaml
  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
  footnotes:
  - marker: a
    text: Or 'boards' for 'frames'; the Hebrew term refers to the tabernacle's upright structural pieces.
    reason: lexical_alternative
  - marker: b
    text: Or 'sockets' for 'bases.'
    reason: lexical_alternative
translation:
  language: ko
  text: 프레임이 여덟 개였고, 그들의 은빛 받침은 열여섯 개였습니다. 하나의 프레임 아래에 두 받침이 있고, 각 프레임 아래에 두 받침이 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판자’로 옮길 수 있습니다. 히브리어는 성막의 수직 구조 부재를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소켓’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָשִׁים
  english_pob_choice: frames
  chosen_korean: 프레임
  alternatives_korean:
  - 판자
  - 널빤지
  lexicon: HALOT
  rationale: 성막 구조물의 기능을 살린 POB의 ‘frames’를 따라, 현대 한국어에서 구조적 지지체를 가장 중립적으로 드러내는 ‘프레임’을 택했습니다.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  english_pob_choice: bases
  chosen_korean: 받침
  alternatives_korean:
  - 기초
  - 소켓
  - 받침대
  lexicon: HALOT
  rationale: 성막 프레임을 지탱하는 금속 부품이라는 점을 살려, POB의 ‘bases’에 해당하는 기능 중심 표현으로 ‘받침’을 선택했습니다.
- source_word: כֶּסֶף
  english_pob_choice: silver
  chosen_korean: 은빛
  alternatives_korean:
  - 은
  - 은색
  lexicon: HALOT
  rationale: 재질인 은을 직접 번역하면 무겁게 들릴 수 있어, 구조물 설명의 자연스러움을 살리면서도 재질감을 드러내는 ‘은빛’을 사용했습니다.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים
  english_pob_choice: two bases under one frame, and two bases under each frame
  chosen_korean: 하나의 프레임 아래에 두 받침이 있고, 각 프레임 아래에 두 받침이 있었습니다
  alternatives_korean:
  - 하나의 프레임 아래에 두 받침, 각 프레임 아래에 두 받침
  - 한 프레임 아래에 두 받침이 있고, 모든 프레임 아래에 두 받침이 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 분배적 반복을 한국어에서 그대로 어색하게 반복하기보다, POB의 의미 판단을 따라 각 프레임마다 두 받침이 있음을 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 성막 치수·구조의 열거를 어떻게 한국어로 읽기 쉽게 처리할지
  chosen_reading: 설명적이지만 과도하게 해석하지 않는 구조 용어를 사용해, 본문의 목록성·기술성을 유지했습니다.
  alternative_readings:
  - 전통적 교회 용어로 더 익숙하게 다듬는 방식
  - 원문 어순을 강하게 따라 직역하는 방식
  rationale: 이 절은 서사나 교리 진술이 아니라 성막 구조의 기술 목록이므로, 독자가 구조 관계를 즉시 파악하도록 하면서도 원문 정보는 늘리지 않는 번역이 적절합니다.
  doctrine_reference: 출애굽기 성막 규정의 기술적 본문
