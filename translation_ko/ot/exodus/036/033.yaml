  source_fidelity: 히브리어는 그가 ‘가운데 바/가로대’를 만들어 널판들의 내부 또는 가운데를 따라 한 끝에서 다른 끝까지 이어지게 했다는 뜻입니다. 초안의 전체 의미는 대체로 맞지만, ‘띠’는 בְּרִיחַ가 가리키는 단단한 구조 부재인 가로대를 충분히 드러내지 못하며, ‘판들’보다 ‘널판들’이 קְרָשִׁים에 더 자연스럽고 정확합니다.
  naturalness: ‘만들어 … 지나가게 하였습니다’도 문법적으로 가능하나, 고정된 건축 부재의 공간적 연장을 표현하는 문맥에서는 ‘뻗게 하였습니다’가 더 자연스럽습니다. 합쇼체 서술도 유지했습니다.
