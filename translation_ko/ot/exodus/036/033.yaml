translation:
  language: ko
  text: 그는 중간 띠를 만들어 판들 한가운데를 끝에서 끝까지 지나가게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘중간 띠’는 문맥상 성막 골조를 묶는 중앙 부재를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 이 구조에서 ‘지나가다/관통하다/연장되다’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 그는 … 만들어 하였습니다
  alternatives_korean:
  - 그는 … 만들었습니다
  - 그는 … 지었습니다
  lexicon: HALOT
  rationale: 서술형 wayyiqtol의 단순한 과거 진행을 살리면서, 성막 제작 맥락에 자연스러운 현대 한국어로 옮겼습니다.
- source_word: הַבְּרִיחַ הַתִּיכֹן
  english_pob_choice: the middle bar
  chosen_korean: 중간 띠
  alternatives_korean:
  - 가운데 띠
  - 중앙 띠
  - 중간 막대
  lexicon: HALOT
  rationale: 성막 구조물의 기능이 다른 부재들을 묶어 주는 가로 부재이므로, 너무 기계적인 ‘바’보다 ‘띠’가 한국어에서 구조적 기능을 더 잘 드러냅니다.
- source_word: לִבְרֹחַ בְּתוֹךְ הַקְּרָשִׁים
  english_pob_choice: to pass through the midst of the boards
  chosen_korean: 판들 한가운데를 지나가게
  alternatives_korean:
  - 판들 사이를 관통하게
  - 판들 가운데로 통과하게
  - 판들 한가운데로 지나가게
  lexicon: HALOT
  rationale: 히브리어의 ‘~를 지나/관통하다’라는 기능적 의미를 살려, 띠가 판들 사이를 따라 이어지는 구조를 자연스럽게 표현했습니다.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  english_pob_choice: from end to end
  chosen_korean: 끝에서 끝까지
  alternatives_korean:
  - 한쪽 끝에서 다른 끝까지
  - 끝에서 말단까지
  lexicon: HALOT
  rationale: 전체 길이를 가로지르는 관용을 한국어에서도 가장 간결하고 분명하게 재현했습니다.
theological_decisions:
- issue: 성막 부재의 묘사에서 직역성과 가독성의 균형
  chosen_reading: ‘중간 띠’와 ‘판들 한가운데를 지나가게’로 옮겨, 구조적 기능을 드러내면서도 과도하게 해설적이지 않게 했습니다.
  alternative_readings:
  - ‘중간 바’
  - ‘가운데 막대가 판들 사이를 지나가게’
  rationale: 본문은 신학적 설명보다 제작 지시를 전달하므로, 독자가 구조를 바로 이해할 수 있는 범위에서만 의미를 풀어 주는 것이 적절합니다.
  doctrine_reference: 출애굽기 25–40장 성막 규례의 서술적 본문
- issue: 동사의 시제와 서술 흐름
  chosen_reading: 단순 과거 서술로 처리해 연속 동작의 장면감을 유지했습니다.
  alternative_readings:
  - ‘그는 … 만들었고’
  - ‘그리고 그는 … 만들었습니다’
  rationale: 히브리어 서술 연쇄의 기능을 한국어에서 자연스러운 완료 서술로 반영했습니다.
  doctrine_reference: 히브리어 narrative wayyiqtol
