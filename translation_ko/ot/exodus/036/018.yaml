translation:
  language: ko
  text: 그는 장막을 연결하여 하나가 되게 하려고 청동 갈고리 쉰 개를 만들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 그는 … 만들어
  alternatives_korean:
  - 그리고 그는 … 만들었습니다
  - 그는 … 만들었습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리기 위해 단순 과거 의미의 동사로 옮겼고, 목적 구문과 결합될 때 한국어에서는 ‘만들어’가 가장 간결합니다.
- source_word: קַרְסֵי נְחֹשֶׁת
  english_pob_choice: bronze clasps
  chosen_korean: 놋쇠 고리
  alternatives_korean:
  - 청동 고리
  - 놋 고리
  lexicon: HALOT
  rationale: ტაბერნacle 문맥의 נְחֹשֶׁת는 관용적으로 ‘놋쇠/청동’ 계열로 옮길 수 있으나, 한국어 성경에서 널리 통용되는 재료 감각을 살려 ‘놋쇠’로 옮겼습니다. 연결 부속의 기능상 ‘고리’가 자연스럽습니다.
- source_word: לְחַבֵּר ... לִהְיוֹת אֶחָד
  english_pob_choice: to join ... so that it would be one
  chosen_korean: 그 장막을 연결하여 하나가 되게 했습니다
  alternatives_korean:
  - 그 장막을 잇게 하여 하나가 되게 했습니다
  - 그 장막을 연결하여 하나가 되도록 했습니다
  lexicon: HALOT
  rationale: 목적/결과 구문을 한국어의 ‘-하여 … 되게’로 풀어, 단순히 물리적으로 잇는 뜻과 ‘하나’가 되는 결과를 함께 드러냈습니다.
- source_word: הָאֹהֶל
  english_pob_choice: the tent
  chosen_korean: 그 장막
  alternatives_korean:
  - 그 천막
  - 그 tent
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘tent’이지만, 출애굽기 문맥에서는 성막 구조를 가리키므로 오해를 줄이기 위해 ‘장막’을 택했습니다.
