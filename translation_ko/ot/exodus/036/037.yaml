  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מָסָךְ֙ לְ/פֶ֣תַח הָ/אֹ֔הֶל תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֖ה רֹקֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
  footnotes:
  - marker: a
    text: Or 'curtain.' The Hebrew term denotes a hanging or screen at an entrance, distinct from the inner 'veil' (פָּרֹכֶת).
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 휘장[ [a] ]을 만들어 회막의 입구에 달았는데, 그것은 청색과 자주색과 홍색 실과 가늘게 꼰 베실로, 수놓는 이의 작업이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘커튼’입니다. 이 히브리어는 입구에 드는 걸림막을 가리키며, 안쪽의 ‘휘장’(פָּרֹכֶת)과는 다릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  english_pob_choice: screen
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 가리개
  - 스크린
  lexicon: HALOT
  rationale: 출입구에 드는 걸림막이라는 기능을 살리되, 성막 문맥에서 자연스러운 한국어 표지어를 택했습니다. 안쪽의 פָּרֹכֶת(휘장/장막)과 구별되는 'screen'의 차이는 각주로 보완했습니다.
- source_word: לְפֶתַח הָאֹהֶל
  english_pob_choice: for the entrance of the tent
  chosen_korean: 회막의 입구에
  alternatives_korean:
  - 장막의 입구에
  - 천막의 문에
  - 회막 문의
  lexicon: HALOT
  rationale: אֹהֶל은 문자적으로 '장막/텐트'이지만, 출애굽기 성막 문맥에서는 한국어 관용에 맞게 '회막'으로 옮겨 문맥 기능을 분명히 했습니다. פֶּתַח은 '입구'로 자연스럽게 대응했습니다.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  english_pob_choice: blue and purple and scarlet yarn
  chosen_korean: 청색과 자주색과 홍색 실
  alternatives_korean:
  - 청색과 자주색과 주홍색 실
  - 남색과 자주색과 붉은 실
  - 청색·자주색·홍색 실
  lexicon: HALOT
  rationale: 세 가지 염색 재료의 색채 대비를 그대로 살리되, 직물 문맥이므로 '실'을 보충했습니다. וְתוֹלַעַת שָׁנִי의 관용적 염색어는 '홍색'으로 처리해 색상 연속성을 유지했습니다.
- source_word: וְשֵׁשׁ מָשְׁזָר
  english_pob_choice: fine twisted linen
  chosen_korean: 가늘게 꼰 베실
  alternatives_korean:
  - 가는 꼰 삼베
  - 정교하게 꼰 아마실
  - 가는 베실
  lexicon: HALOT
  rationale: שֵׁשׁ은 고급 아마포/베를 가리키며, מָשְׁזָר은 '꼰/비빈' 상태를 뜻합니다. '가늘게 꼰 베실'은 재질과 제작 방식을 함께 드러내는 간결한 표현입니다.
- source_word: מַעֲשֵׂה רֹקֵם
  english_pob_choice: the work of an embroiderer
  chosen_korean: 수놓는 이의 작업
  alternatives_korean:
  - 자수장이의 작업
  - 수놓은 일
  - 자수한 작업
  lexicon: HALOT
  rationale: רֹקֵם은 단순한 '직조'가 아니라 장식적 자수/수놓기를 가리키므로, 기술자를 전면에 드러내는 표현으로 옮겼습니다. '작업'은 공예적 제작을 자연스럽게 담습니다.
theological_decisions:
- issue: 성막 입구의 מָסָךְ를 '휘장'으로 옮길지, '커튼/가리개'로 옮길지
  chosen_reading: '''휘장''을 사용하되, 주해 각주로 ''screen''의 입구용 걸림막이며 내부의 פָּרֹכֶת과 다르다는 점을 밝혔습니다.'
  alternative_readings:
  - 커튼
  - 가리개
  - 스크린
  rationale: 한국어 성막 용례에서 '휘장'이 가장 익숙하지만, 본절의 מָסָךְ는 내실의 분리막과 기능상 구별되므로 의미 혼동을 막기 위해 설명적 각주를 붙였습니다.
  doctrine_reference: 출애굽기 성막 구조의 용어 구별
