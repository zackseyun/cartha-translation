base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
  footnotes:
  - marker: a
    text: Or 'the curtain that was in the second joining' or 'the second coupled section.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the loops were corresponding, one to another.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 첫째 휘장에 고리 쉰 개를 만들고, 둘째 연결 부분에 있는 휘장의 가장자리에도 고리 쉰 개를 만들었습니다. 그 고리들은 서로 맞아떨어지게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘둘째 연결 부분에 있던 휘장’ 혹은 ‘둘째로 결합된 구역’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘고리들은 서로 하나가 다른 하나를 향해 대응하였다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  english_pob_choice: loops
  chosen_korean: 고리
  alternatives_korean:
  - 루프
  - 고리들
  - 매듭
  lexicon: HALOT
  rationale: 천막 휘장을 잇는 데 쓰이는 천 고리이므로, 기능을 드러내는 ‘고리’가 가장 자연스럽고 정확합니다.
- source_word: יְרִיעָה
  english_pob_choice: curtain
  chosen_korean: 휘장
  alternatives_korean:
  - 커튼
  - 천막천
  - 막
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥에서 יְרִיעָה는 성막을 이루는 큰 천 조각을 가리키므로, 한국어 성경 용례와 문맥을 함께 살린 ‘휘장’이 적절합니다.
- source_word: מַחְבֶּרֶת הַשֵּׁנִית
  english_pob_choice: the second set
  chosen_korean: 둘째 연결 부분
  alternatives_korean:
  - 둘째 결합된 부분
  - 두 번째 묶음
  - 둘째 맞붙인 부분
  lexicon: HALOT
  rationale: מַחְבֶּרֶת은 단순한 ‘둘째’가 아니라 결합되어 이루어진 단위를 가리키므로, 영어 POB의 ‘second set’을 반영하되 구조를 드러내는 ‘연결 부분’으로 옮겼습니다.
- source_word: מַקְבִּילֹת ... אַחַת אֶל אֶחָת
  english_pob_choice: corresponded to one another
  chosen_korean: 서로 맞아떨어지게
  alternatives_korean:
  - 서로 마주하게
  - 서로 대응되게
  - 서로 맞게
  lexicon: HALOT
  rationale: 두 고리가 맞물리도록 배열되었다는 뜻을 살리기 위해, 단순한 병렬보다 기능적 대응을 드러내는 표현을 택했습니다.
