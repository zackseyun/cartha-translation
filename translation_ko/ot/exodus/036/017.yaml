  terminology: ‘휘장’, ‘가장자리’, ‘고리’, ‘결합부’는 성막 직물 구조를 자연스럽게 나타냅니다. ‘결합부’는 מַחְבָּרֶת/חֹבֶרֶת의 결합·연결 의미를 보존하며, 각 결합부가 휘장 묶음을 가리킬 수 있다는 대안은 각주로 유지합니다.
