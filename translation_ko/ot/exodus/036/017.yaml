    rationale: בַּמַּחְבָּרֶת는 바깥쪽 휘장이 속한 결합부/연결된 묶음의 관계를 나타내므로, 한국어에서도 ‘첫째 결합부에 있는 바깥쪽 휘장’처럼 계층을 드러내야 합니다.
