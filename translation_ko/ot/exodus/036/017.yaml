source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ לֻֽלָאֹ֣ת חֲמִשִּׁ֗ים עַ֚ל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/קִּיצֹנָ֖ה בַּ/מַּחְבָּ֑רֶת וַ/חֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֙ עַל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/חֹבֶ֖רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
  footnotes:
  - marker: a
    text: Or 'in the coupling' or 'in the first joined section'; the Hebrew term refers to the joined set or coupling of curtains.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 바깥쪽 휘장의 가장자리에 첫 번째 맞물린 부분에 루프 쉰 개를 만들었고, 둘째 휘장의 가장자리에 루프 쉰 개를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘첫 번째 맞물린 부분/결합부’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  english_pob_choice: loops
  chosen_korean: 루프
  alternatives_korean:
  - 고리
  - 매듭고리
  - 고리들
  lexicon: HALOT
  rationale: 천막 휘장에 달린 연결용 고리를 가리키므로, 본문의 기능을 직접 드러내는 외래어식 ‘루프’가 가장 간결하고 오해가 적습니다.
- source_word: שְׂפַת
  english_pob_choice: edge
  chosen_korean: 가장자리
  alternatives_korean:
  - 가장자리 끝
  - 테두리
  - 변두리
  lexicon: HALOT
  rationale: 천 조각의 둘레를 뜻하므로 ‘가장자리’가 현대 한국어에서 가장 자연스럽고 정확합니다.
- source_word: הַקִּיצֹנָה
  english_pob_choice: outer
  chosen_korean: 바깥쪽
  alternatives_korean:
  - 외곽의
  - 끝쪽의
  - 가장 바깥의
  lexicon: HALOT
  rationale: 휘장 배열에서 바깥편에 놓인 것을 나타내므로, 공간 관계를 직관적으로 전달하는 ‘바깥쪽’으로 옮겼습니다.
- source_word: בַּמַּחְבָּרֶת
  english_pob_choice: in the first set joined together
  chosen_korean: 첫 번째 맞물린 부분에
  alternatives_korean:
  - 첫 번째 결합부에
  - 첫 번째 이어진 부분에
  - 첫 번째 연결된 부분에
  lexicon: HALOT
  rationale: 이 단어는 단순한 ‘첫째 세트’보다, 서로 맞물려 결합된 구획을 가리키는 뉘앙스가 있으므로 그 관계를 살려 옮겼습니다.
- source_word: הַחֹבֶרֶת
  english_pob_choice: that was joined to it
  chosen_korean: 둘째 휘장
  alternatives_korean:
  - 함께 맞물린 둘째 휘장
  - 그와 맞물린 휘장
  - 연결된 둘째 휘장
  lexicon: HALOT
  rationale: 히브리어 대구를 자연스럽게 살리기 위해 두 번째 항목은 간결하게 ‘둘째 휘장’으로 처리하되, 앞 절의 ‘맞물린’ 표현으로 결합 관계를 유지했습니다.
- source_word: וַיַּעַשׂ ... עָשָׂה
  english_pob_choice: he made ... he made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  - 만드셨습니다
  lexicon: HALOT
  rationale: 반복 동사 עשה를 한국어에서도 동일하게 ‘만들었습니다’로 반복해, 히브리어의 평행 구조를 보존했습니다.
