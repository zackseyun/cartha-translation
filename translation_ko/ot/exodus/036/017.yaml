  source_fidelity: 히브리어는 첫 결합부에 속한 바깥쪽 휘장의 가장자리와 둘째 결합부에 속한 휘장의 가장자리에 각각 쉰 개의 고리를 만들었다고 말합니다. 초안은 ‘첫 번째 맞물린 부분에’가 ‘가장자리에’와 병렬로 놓여 수식 관계가 불명확하며, 둘째 절에서 הַחֹבֶרֶת(결합된/연결된 부분)의 의미를 생략합니다.
