source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֲצֵ֥י שִׁטִּ֖ים עֹמְדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/020.yaml
  text: And he made the boards for the tabernacle of acacia wood[a], standing upright.
  footnotes:
  - marker: a
    text: Or 'the boards for the tabernacle, of acacia wood, standing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 성막을 위해 아카시아 나무로 된 널판들을 만들어, 곧게 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성막의 널판들을 아카시아 나무로, 곧게 세웠다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: And he made
  chosen_korean: 만들어
  alternatives_korean:
  - 지어
  - 제작하여
  lexicon: HALOT
  rationale: 서술 진행형 동사 עשה의 단순한 서술을 한국어에서는 자연스러운 서술 연결인 ‘만들어’로 옮겨, 제작 행위의 결과를 드러내되 지나친 기술적 뉘앙스는 피했습니다.
- source_word: הַקְּרָשִׁים
  english_pob_choice: the boards
  chosen_korean: 널판들
  alternatives_korean:
  - 판자들
  - 판들
  lexicon: HALOT
  rationale: 성막 구조물의 문맥에서 קְרָשִׁים는 단순한 판재가 아니라 구조용 판넬에 가까워, 현대 한국어에서 가장 직관적인 ‘널판들’로 옮겼습니다.
- source_word: לַמִּשְׁכָּן
  english_pob_choice: for the tabernacle
  chosen_korean: 성막을 위해
  alternatives_korean:
  - 성막을 위하여
  - 장막을 위해
  lexicon: HALOT
  rationale: מִשְׁכָּן의 표준 번역인 ‘성막’을 사용하되, 목적의 ל를 자연스럽게 드러내기 위해 ‘-을 위해’로 처리했습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로 된
  alternatives_korean:
  - 아카시아 목재의
  - 시팀 나무로 된
  lexicon: HALOT
  rationale: 히브리어 소유/재료 관계를 한국어의 관형절로 자연스럽게 풀어, 독자가 재료 설명임을 즉시 이해하도록 했습니다.
- source_word: עֹמְדִים
  english_pob_choice: standing upright
  chosen_korean: 곧게 세웠습니다
  alternatives_korean:
  - 서 있게 했습니다
  - 수직으로 세웠습니다
  lexicon: HALOT
  rationale: ‘standing’의 상태를 구조물의 배치로 이해해, 성막 널판의 자세를 드러내는 ‘곧게 세웠습니다’로 옮겼습니다.
theological_decisions:
- issue: 성막 구조물의 기능적 묘사를 어떻게 한국어로 전달할지
  chosen_reading: ‘성막을 위해 … 널판들’을 사용해, 제작 대상이 단순 목재가 아니라 성막의 구조 부재임을 분명히 했습니다.
  alternative_readings:
  - ‘장막을 위해 … 판자들’
  - ‘회막을 위해 … 판들’
  rationale: 본문은 예배 공간의 조성 과정을 기술하는 서술문이므로, 기능을 과장하지 않고 구조적 의미를 정확히 드러내는 번역이 적절합니다.
  doctrine_reference: 출애굽기 성막 규례 문맥
