translation:
  language: ko
  text: 그는 금 갈고리[a] 쉰 개를 만들어 휘장들을 서로 갈고리로 연결하니, 성막이 하나가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “금 고리들”. 히브리어는 결합용 부속품을 가리키며, 결과를 살리면 “성막이 하나가 되었습니다”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: And he made
  chosen_korean: 그는 …를 만들어
  alternatives_korean:
  - 그는 …를 만들고
  - 그는 …를 지었습니다
  lexicon: HALOT
  rationale: עשה는 기본적으로 ‘만들다/하다’의 일반 동사이므로, 문맥상 가장 자연스럽고 직접적인 ‘만들어’로 옮겼습니다.
- source_word: קַרְסֵי זָהָב
  english_pob_choice: gold clasps
  chosen_korean: 금 갈고리
  alternatives_korean:
  - 금 고리
  - 금 걸쇠
  lexicon: HALOT
  rationale: 출애굽기의 장막 연결 장치로서 קֶרֶס는 ‘hook/fastener’ 계열의 물건이므로, 한국어에서는 형상을 살린 ‘갈고리’가 가장 직접적입니다.
- source_word: וַיְחַבֵּר ... אַחַת אֶל אַחַת בַּקְּרָסִים
  english_pob_choice: and joined the curtains to one another with the clasps
  chosen_korean: 휘장들을 서로 갈고리로 연결하니
  alternatives_korean:
  - 휘장들을 서로 연결하니
  - 휘장들을 하나와 하나로 갈고리로 잇고
  lexicon: HALOT
  rationale: חבר은 ‘잇다/연결하다’의 뜻이므로 결과보다 행위 자체를 분명히 드러내는 ‘연결하니’로 옮겼고, ‘서로’로 상호 결속을 표현했습니다.
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  english_pob_choice: so that the tabernacle became one
  chosen_korean: 성막이 하나가 되었습니다
  alternatives_korean:
  - 성막이 하나였습니다
  - 성막이 하나로 되었습니다
  lexicon: HALOT
  rationale: 마지막 절은 연결 행위의 결과를 나타내므로, 단순 상태보다 결과를 드러내는 ‘하나가 되었습니다’가 POB의 의미를 잘 반영합니다.
theological_decisions:
- issue: 장막 구조의 ‘하나 됨’ 표현
  chosen_reading: 단순한 수량적 합치가 아니라, 휘장들의 결속으로 성막이 하나의 통일된 구조가 되었다는 결과를 살렸습니다.
  alternative_readings:
  - 성막이 하나였습니다
  - 성막이 한 덩어리가 되었습니다
  rationale: 히브리어 문맥은 연결 동작의 완료 결과를 강조하므로, ‘하나가 되었습니다’가 본문 의도를 가장 분명하게 전달합니다.
  doctrine_reference: 본문의 서술적 결과 강조
