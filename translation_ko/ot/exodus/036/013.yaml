  source_fidelity: 본문의 기본 의미는 잘 반영합니다. קַרְסֵי זָהָב는 휘장을 결합하는 금속 부속품이며, ‘금 갈고리’는 가능한 번역입니다. 마지막 절은 히브리어상 ‘성막이 하나였다’라는 상태 서술로도 옮길 수 있으나, 앞선 결합 행위의 결과를 나타내는 문맥에서 ‘하나가 되었습니다’는 안전한 의미역입니다.
  naturalness: ‘휘장들을 서로 갈고리로 연결하니’는 갈고리가 결합 도구임을 알 수 있으나, ‘그 갈고리로’라고 받아 주면 지시 관계와 문장이 더 자연스럽고 분명해집니다. 합쇼체 서술도 유지됩니다.
