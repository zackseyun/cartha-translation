id: EXO.36.35
reference: Exodus 36:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב עָשָׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
  footnotes:
  - marker: a
    text: Or 'the veil.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'scarlet' is literally an expression for scarlet-dyed material/thread; 'crimson' is a possible alternative.
    reason: lexical_alternative
  - marker: c
    text: Or 'the work of a skillful craftsman' or 'embroidered work.' The Hebrew refers to artistic, patterned workmanship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 청색 실과 자색 실과 홍색 실[b]과 곱게 꼰 세마포로 휘장[a]을 만들었습니다. 그는 무늬를 짜는 장인의 솜씨로 그룹 무늬를 만들었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가리개’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘홍색’은 문자적으로 주홍색으로 물든 재료나 실을 가리키는 표현이며, ‘진홍색’도 가능한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘솜씨 좋은 장인의 작업’ 또는 ‘수놓은 무늬 작업’. 히브리어는 예술적으로 고안된 무늬 있는 제작을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  english_pob_choice: the curtain
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 커튼
  - 장막
  lexicon: HALOT
  rationale: פָּרֹכֶת는 성막 내부를 가르는 신성한 분리막을 가리키므로, 한국어 성경에서 널리 쓰이면서도 원어의 제의적 기능을 살릴 수 있는 ‘휘장’이 가장 적절합니다.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  english_pob_choice: blue, purple, and scarlet yarn
  chosen_korean: 청색과 자색과 홍색 실
  alternatives_korean:
  - 푸른색과 보라색과 주홍색 실
  - 청색과 자색과 진홍색 실
  - 청색과 자색과 홍색 베실
  lexicon: HALOT
  rationale: 직물 목록이므로 색 자체보다 염색된 실의 재료성이 드러나야 하지만, 한국어에서는 ‘실’만 붙여도 충분히 자연스럽습니다. ‘홍색’은 POB의 ‘scarlet’에 맞춰 지나치게 문어적인 ‘주홍/진홍’보다 간결하게 살렸습니다.
- source_word: שֵׁשׁ מָשְׁזָר
  english_pob_choice: fine twisted linen
  chosen_korean: 가늘게 꼰 세마포
  alternatives_korean:
  - 꼬아 만든 고운 세마포
  - 가는 꼰 베
  - 세밀하게 꼰 세마포
  lexicon: HALOT
  rationale: שֵׁשׁ은 고운 아마포/세마포를 가리키고, מָשְׁזָר는 꼰 질감을 뜻하므로 ‘가늘게 꼰 세마포’로 두 요소를 모두 살렸습니다.
- source_word: מַעֲשֵׂה חֹשֵׁב
  english_pob_choice: the work of a skillful designer
  chosen_korean: 솜씨 있는 장인의 작품
  alternatives_korean:
  - 숙련된 직공의 작업
  - 정교한 무늬의 직조품
  - 능숙한 설계자의 작품
  lexicon: HALOT
  rationale: 이 표현은 단순한 노동이 아니라 문양을 의도적으로 짜 넣는 예술적 솜씨를 가리키므로, ‘솜씨 있는 장인의 작품’으로 자연스럽고도 기술적으로 옮겼습니다.
- source_word: כְּרֻבִים
  english_pob_choice: cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 케루빔
  - 천사들
  - 그룹
  lexicon: HALOT
  rationale: 성막 문맥에서 כְּרֻבִים은 한국어 성경 전통에서 ‘그룹’으로 정착되어 있어, 신학적 상상력을 불필요하게 바꾸지 않으면서도 원문 지시 대상을 살릴 수 있습니다.
theological_decisions:
- issue: כְּרֻבִים의 번역어 선택
  chosen_reading: ‘그룹들’로 번역해 성막 휘장의 상징적 수놓임을 그대로 드러냈습니다.
  alternative_readings:
  - ‘천사들’로 풀어 의미를 현대화하는 읽기
  - ‘케루빔’으로 음역만 하는 읽기
  rationale: 본문은 천상 존재의 일반명칭을 설명하는 것이 아니라 성막 직물의 형상 자체를 말하므로, 전통적이면서도 본문 기능을 보존하는 ‘그룹들’이 가장 적합합니다.
  doctrine_reference: 출애굽기 25–26장의 성막 기물 묘사
