base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
  footnotes:
  - marker: a
    text: Or 'everyone whose heart moved him' or 'lifted him.' The Hebrew idiom speaks of inward willingness or prompting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'wise-hearted,' an idiom for one endowed with wisdom or skill.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 모세는 브살렐과 오홀리압과, 야훼께서 마음에 지혜를 주신 모든 지혜로운 사람[a], 곧 마음이 그를 움직여 작업에 나아와 그것을 하려고 한 모든 사람[b]을 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지혜로운 사람’은 문자적으로 ‘마음이 지혜로운 사람’이라는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마음이 그를 움직여’는 히브리어로 문자적으로는 ‘그의 마음이 그를 들어 올려’이며, 내적인 자원함이나 일을 하도록 하는 자극을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
