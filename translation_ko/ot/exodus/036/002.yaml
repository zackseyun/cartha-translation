base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
  footnotes:
  - marker: a
    text: Or 'everyone whose heart moved him' or 'lifted him.' The Hebrew idiom speaks of inward willingness or prompting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'wise-hearted,' an idiom for one endowed with wisdom or skill.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 브살렐과 오홀리압과, 마음에 지혜를 주신 분이 야훼이신 모든 지혜로운 사람을 불렀습니다. 또 그 마음이 그를 움직여 작업에 나와 그것을 하게 된 모든 사람도 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지혜로운 사람’은 문자적으로는 ‘마음이 지혜로운 사람’이라는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 마음이 그를 움직여’는 ‘그 마음이 그를 일으키거나 끌어올려’라는 뜻까지 포함하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
