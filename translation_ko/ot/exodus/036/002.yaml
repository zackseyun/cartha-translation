  - 일에 참여해
  lexicon: HALOT
  rationale: ‘가까이 가다/나아가다’의 동작을 한국어에서 ‘나와’로 풀어, 단순한 접근이 아니라 실제 작업 참여를 자연스럽게 전달했습니다.
