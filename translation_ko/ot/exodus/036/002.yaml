  - 호명했습니다
  lexicon: HALOT
  rationale: 작업에 사람들을 불러 모으는 의미를 자연스럽게 살리면서도, 모세의 권위 있는 호출이라는 뉘앙스를 유지합니다.
- source_word: כָּל אִישׁ חֲכַם לֵב
  english_pob_choice: every wise-hearted man
  chosen_korean: 모든 지혜로운 사람
  alternatives_korean:
  - 마음이 지혜로운 모든 사람
  - 지혜로운 마음을 가진 모든 사람
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘지혜로운 마음’을 한국어에서는 ‘지혜로운 사람’으로 옮기되, 본문 맥락인 기술과 분별의 자질을 드러내도록 했습니다.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  english_pob_choice: in whose heart Yahweh had put wisdom
  chosen_korean: 마음에 지혜를 주신 분이 야훼이신
  alternatives_korean:
  - 야훼께서 마음에 지혜를 주신
  - 마음에 지혜를 넣어 주신 야훼이신
  lexicon: HALOT
  rationale: ‘주다’(נתן)와 ‘마음’(לב) 이미지를 살려, 지혜의 근원이 야훼의 부여에 있음을 직접적으로 표현했습니다.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  english_pob_choice: everyone whose heart stirred him
  chosen_korean: 그 마음이 그를 움직여
  alternatives_korean:
  - 그 마음이 그를 끌어올려
  - 그 마음이 그를 북돋아
  lexicon: HALOT
  rationale: 히브리어 관용구는 내적 자발성과 प्रेर동을 가리키므로, ‘마음이 그를 움직이다’로 옮겨 결단의 동기를 드러냈습니다.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  english_pob_choice: to come to the work
  chosen_korean: 작업에 나와
  alternatives_korean:
