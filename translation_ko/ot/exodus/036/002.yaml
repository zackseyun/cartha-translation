  to: 그때에 모세는 브살렐과 오홀리압과, 야훼께서 마음에 지혜를 주신 모든 지혜로운 사람[a], 곧 마음이 그를 움직여 작업에 나아와 그것을 하려고 한 모든 사람[b]을 불렀습니다.
  rationale: 원문의 단일 문장 구조를 회복하고, 야훼가 지혜를 주신 분이라는 관계절을 자연스럽고 직접적으로 고쳤습니다. ‘곧’은 두 번째 ‘모든 사람’ 구절이 앞선 사람들을 풀어 설명하는 원문의 연결을 한국어에서 무리 없이 드러냅니다. ‘작업에 나아와 그것을 하려고 한’은 작업에 가까이/나아가 그것을 행한다는 목적 구문을 보존합니다.
