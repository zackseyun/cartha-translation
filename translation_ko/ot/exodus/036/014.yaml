source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ יְרִיעֹ֣ת עִזִּ֔ים לְ/אֹ֖הֶל עַל הַ/מִּשְׁכָּ֑ן עַשְׁתֵּֽי עֶשְׂרֵ֥ה יְרִיעֹ֖ת עָשָׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/014.yaml
  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
  footnotes:
  - marker: a
    text: Or possibly 'curtains of goats' if the material is left implicit; the context of tabernacle textiles favors 'goats’ hair.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 염소털로 장막을 만들어 성막 위에 덮었습니다[a]. 그는 그렇게 열한 장을 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘염소털의 장막’으로 볼 수도 있습니다. 문맥상 성막의 직물 재료를 가리키므로 여기서는 ‘염소털로’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  english_pob_choice: he made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  lexicon: HALOT
  rationale: עשה의 기본 의미를 가장 직접적으로 살려, 공예적·구성적 맥락에 맞는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: יְרִיעֹת
  english_pob_choice: curtains
  chosen_korean: 장막
  alternatives_korean:
  - 커튼
  - 휘장
  - 천막
  lexicon: HALOT
  rationale: 성막 제작 문맥에서 יְרִיעָה는 큰 천 조각/덮개를 가리키므로, 독자가 기능을 바로 이해할 수 있는 ‘장막’을 택했습니다.
- source_word: עִזִּים
  english_pob_choice: of goats’ hair
  chosen_korean: 염소털로
  alternatives_korean:
  - 염소로
  - 염소가죽으로
  - 염소털의
  lexicon: HALOT
  rationale: 문맥상 재료는 염소의 털로 짠 천을 뜻하므로, 영어 POB의 해석을 따라 재료성을 분명히 드러냈습니다.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  english_pob_choice: eleven
  chosen_korean: 열한 장
  alternatives_korean:
  - 열한 개
  - 열하나
  lexicon: HALOT
  rationale: 장막 조각의 수를 세는 말이므로 한국어에서는 단순 수사보다 분류사 ‘장’을 붙여 자연스럽게 표현했습니다.
theological_decisions:
- issue: מִשְׁכָּן의 번역과 성막/장막의 관계
  chosen_reading: מִשְׁכָּן은 ‘성막’으로 옮기고, 그 위를 덮는 बाह깥 덮개를 ‘장막’으로 옮겨 두 층의 구조를 구분했습니다.
  alternative_readings:
  - 거처
  - 성소
  - 성막 위의 덮개
  rationale: 본문은 안쪽 구조(מִשְׁכָּן)와 그 위의 덮개(לְאֹהֶל)를 함께 말하므로, 전통적이지만 문맥에 맞는 ‘성막’을 유지하되 겹침을 분명히 했습니다.
  doctrine_reference: 출애굽기 성막 서술의 구조적 구분
