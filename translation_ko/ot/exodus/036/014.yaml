  source_fidelity: 개정이 필요합니다. 초안의 ‘염소털로 장막을 만들어’는 히브리어 יְרִיעֹת(휘장들/천 폭들)를 단수 ‘장막’으로 바꾸어, 열한 개였던 제작 대상과 장막의 기능을 혼동합니다. 또한 ‘그렇게’는 히브리어 אֹתָם(그것들을)을 충분히 반영하지 못합니다. 개정문은 휘장들을 제작한 뒤 그것들이 성막 위의 장막을 이루는 용도임을 구분합니다.
  naturalness: ‘성막 위에 덮을 장막을 위해’는 성막 제작 문맥에서 자연스럽고, ‘휘장들’ 및 수량 단위 ‘폭’은 큰 천 조각을 가리키는 문맥에 잘 맞습니다. 합쇼체 서술도 일관됩니다.
  terminology: מִשְׁכָּן은 ‘성막’으로, יְרִיעֹת은 ‘휘장들’로 옮겨 안쪽 성막 구조와 그 위를 덮는 장막용 천 폭들을 구별했습니다. עִזִּים은 문맥상 ‘염소털’로 번역하되, 재료를 ‘염소의 것’으로 이해할 가능성은 각주에 보존했습니다.
