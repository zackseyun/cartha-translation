    text: 또는 ‘널판들’. 히브리어 용어는 구조용 판재 또는 틀을 가리킬 수 있으며, 여기서는 성막 구조에 더 잘 맞는 ‘틀’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  english_pob_choice: for the rear of
  chosen_korean: 뒤쪽
  alternatives_korean:
