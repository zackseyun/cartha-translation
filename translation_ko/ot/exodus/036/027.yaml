  lexicon: HALOT
  rationale: יָמָּה는 문자적으로는 '바다 쪽'이지만, 여기서는 성막 배치의 방향을 나타내므로 의미를 분명히 드러내는 '서쪽을 향하여'로 옮겼습니다.
