  - 장막
  lexicon: HALOT
  rationale: 출애굽기의 제의적 건축물 용어로는 한국어 성경에서 널리 쓰이는 '성막'이 가장 정확하고 읽기 자연스럽습니다.
- source_word: יָמָּה
  english_pob_choice: westward
  chosen_korean: 서쪽을 향하여
  alternatives_korean:
  - 서쪽으로
  - 서편으로
  - 바다 쪽으로
  lexicon: HALOT
  rationale: יָמָּה는 문자적으로는 '바다 쪽'이지만, 여기서는 성막 배치의 방향을 나타내므로 의미를 분명히 드러내는 '서쪽을 향하여'로 옮겼습니다.
- source_word: קְרָשִׁים
  english_pob_choice: frames
  chosen_korean: 틀
  alternatives_korean:
  - 널판
  - 판자
  - 널
  lexicon: HALOT
  rationale: 성막 구조의 하중을 받는 구성요소라는 점을 살려, 단순한 평판보다 구조적 느낌이 나는 '틀'을 선택했습니다.
