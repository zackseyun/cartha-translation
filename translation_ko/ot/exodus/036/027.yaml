lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  english_pob_choice: for the rear of
  chosen_korean: 뒤쪽
  alternatives_korean:
  - 뒷부분
  - 뒤쪽의 끝
  - 후면
  lexicon: HALOT
  rationale: יַרְכְּתֵי는 성막 문맥에서 뒤편/후미를 가리키므로, 현대 한국어에서는 간결하고 자연한 '뒤쪽'으로 옮겼습니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
