  to: 야훼께서 지혜와 총명을 그들에게 주셔서 성소 봉사를 위한 모든 일을 할 줄 알게 하신 브살렐과 오홀리압과 마음이 지혜로운 모든 사람[a]은, 야훼께서 명령하신 모든 것에 따라 행할 것입니다.
  rationale: 원문의 주어 열거(브살렐, 오홀리압, 마음이 지혜로운 모든 사람), 야훼께서 그들에게 주신 지혜와 총명, 성소 봉사를 위한 모든 일을 할 능력, 그리고 야훼의 명령에 따른 수행을 빠짐없이 반영했습니다. ‘그들에게’는 히브리어 복수 대명사의 집합적 지시를 자연스럽게 보존합니다.
