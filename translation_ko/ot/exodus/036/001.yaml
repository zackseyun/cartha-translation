base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
  footnotes:
  - marker: a
    text: Hebrew 'every wise-hearted man'; the phrase may function generically for every skilled worker.
    reason: lexical_alternative
  - marker: b
    text: Or 'to whom the LORD has given wisdom and understanding'; Hebrew literally has a plural expression, 'in them,' referring collectively to Bezalel, Oholiab, and every wise-hearted man.
    reason: lexical_alternative
  - marker: c
    text: Or 'all the work of the service of the sanctuary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 지혜와 총명을 그들에게 주셔서 성소 봉사를 위한 모든 일을 할 줄 알게 하신 브살렐과 오홀리압과 마음이 지혜로운 모든 사람[a]은, 야훼께서 명령하신 모든 것에 따라 행할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘마음이 지혜로운 모든 사람’입니다. 여기서 ‘마음이 지혜로운’은 성소 일을 수행할 기술과 지혜를 갖춘 사람을 가리킵니다.
    reason: lexical_alternative
