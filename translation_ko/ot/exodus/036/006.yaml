source:
  edition: WLC
  text: וַ/יְצַ֣ו מֹשֶׁ֗ה וַ/יַּעֲבִ֨ירוּ ק֥וֹל בַּֽ/מַּחֲנֶה֮ לֵ/אמֹר֒ אִ֣ישׁ וְ/אִשָּׁ֗ה אַל יַעֲשׂוּ ע֛וֹד מְלָאכָ֖ה לִ/תְרוּמַ֣ת הַ/קֹּ֑דֶשׁ וַ/יִּכָּלֵ֥א הָ/עָ֖ם מֵ/הָבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
  footnotes:
  - marker: a
    text: Or, “they made an announcement in the camp.” The Hebrew idiom is literally “they caused a voice to pass.”
    reason: lexical_alternative
  - marker: b
    text: “Contribution of the sanctuary” may also be rendered “holy contribution” or “offering for the sanctuary.”
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 명령하자[a], 그들은 진영 전체에 공표하여[b] 이렇게 말했습니다. “남자나 여자나 더 이상 성소를 위한 기물을 만들지 마십시오.” 그러자 백성은 더 가져오지 못하게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 “소리가 지나가게 하다”에 가깝습니다.
    reason: source_note
  - marker: b
    text: 이 표현은 “진영 안에서 알리다” 또는 “진영을 두루 선포하다”라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하자
  alternatives_korean:
  - 명령했습니다
  - 지시하자
  - 명령하니
  lexicon: HALOT
  rationale: צוה의 서술형은 권위 있는 명령을 뜻하므로, 모세의 지시가 즉각 다음 행동을 촉발하는 흐름을 살리기 위해 ‘명령하자’를 택했습니다.
- source_word: וַיַּעֲבִירוּ קוֹל
  english_pob_choice: sent a proclamation through the camp
  chosen_korean: 진영 전체에 공표하여
  alternatives_korean:
  - 진영에 알리며
  - 진영을 두루 선포하여
  - 진영에 소리를 내어
  lexicon: HALOT
  rationale: 직역보다 관용적 의미가 분명하므로, ‘소리가 지나가게 하다’라는 히브리어 관용구를 공개적 통고의 뜻으로 옮겨 ‘공표하다’로 처리했습니다.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  english_pob_choice: for the contribution of the sanctuary
  chosen_korean: 성소를 위한 기물
  alternatives_korean:
  - 성소를 위한 헌물
  - 거룩한 헌물
  - 성소의 기부
  lexicon: HALOT
  rationale: תרומה는 ‘헌물/기여’이지만, 문맥상 이미 모인 재료로 성막 관련 제작이 진행 중인 상황이므로 한국어에서는 그 헌물의 목적을 분명히 드러내는 ‘성소를 위한 기물’로 풀어 자연스럽게 옮겼습니다.
- source_word: וַיִּכָּלֵא הָעָם מֵהָבִיא
  english_pob_choice: the people were restrained from bringing more
  chosen_korean: 백성은 더 가져오지 못하게 되었습니다
  alternatives_korean:
  - 백성은 가져오는 것이 멈추었습니다
  - 백성은 더 가져오도록 제지되었습니다
  - 백성은 더 가져오는 일이 금지되었습니다
  lexicon: HALOT
  rationale: כלא의 피엘/니팔 계열은 ‘가로막히다, 억제되다’의 뉘앙스를 가지므로, 자원하여 멈춘 것이 아니라 더 이상 가져올 수 없게 된 상태를 분명히 했습니다.
theological_decisions:
- issue: ‘성소’를 위한 것인지 ‘거룩한 헌물’인지의 범위
  chosen_reading: 문맥상 헌물 자체보다 그것이 성막/성소 제작에 쓰이는 목적을 강조했습니다.
  alternative_readings:
  - ‘거룩한 헌물’
  - ‘성소의 헌물’
  - ‘성막을 위한 헌물’
  rationale: 히브리어 구문은 문자적으로 ‘거룩함의 תרומה’에 가깝지만, 바로 앞뒤 문맥이 제작 재료의 모금과 중단을 말하므로 독자가 오해하지 않도록 목적성을 드러냈습니다.
  doctrine_reference: 출애굽기 35–36장의 성막 건축 문맥
