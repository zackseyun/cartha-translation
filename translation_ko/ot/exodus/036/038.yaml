  text: וְ/אֶת עַמּוּדָ֤י/ו חֲמִשָּׁה֙ וְ/אֶת וָ֣וֵי/הֶ֔ם וְ/צִפָּ֧ה רָאשֵׁי/הֶ֛ם וַ/חֲשֻׁקֵי/הֶ֖ם זָהָ֑ב וְ/אַדְנֵי/הֶ֥ם חֲמִשָּׁ֖ה נְחֹֽשֶׁת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/038.yaml
  text: and its five pillars with their hooks[a]; and he overlaid their tops and their bands with gold[b], and their five bases were bronze.
  footnotes:
  - marker: a
    text: Or 'their five sockets were bronze.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'bands' is traditionally translated 'fillets'; it likely refers to decorative or connecting elements on the pillars.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 다섯 기둥과 그 갈고리들[a], 그 머리들과 그 띠들을 금으로 입혔으며[b], 그 다섯 받침은 놋이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 다섯 받침’일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘띠들’로 옮긴 히브리어는 전통적으로 ‘fillets(장식 띠)’로 번역되며, 기둥을 잇는 장식적·연결적 요소를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  english_pob_choice: its five pillars
  chosen_korean: 그 다섯 기둥
  alternatives_korean:
  - 그 다섯 주
  - 그 다섯 막대
  lexicon: HALOT
  rationale: 문맥상 성막 구조물의 수직 지지물은 ‘기둥’이 가장 자연스럽고, POB의 ‘pillars’를 그대로 살렸습니다.
- source_word: וָוֵיהֶם
  english_pob_choice: their hooks
  chosen_korean: 그 갈고리들
  alternatives_korean:
  - 그 고리들
  - 그 못들
  lexicon: HALOT
  rationale: 성막 문맥에서 וָו는 매다는 장치로서 ‘갈고리’가 가장 직관적이며, 영어 POB의 ‘hooks’와도 맞습니다.
- source_word: רָאשֵׁיהֶם / חֲשֻׁקֵיהֶם
  english_pob_choice: their tops ... their bands
  chosen_korean: 그 머리들과 그 띠들
  alternatives_korean:
  - 그 꼭대기들과 그 연결띠들
  - 그 꼭머리들과 그 테들
  lexicon: HALOT
  rationale: ‘heads’와 ‘bands’의 직역을 살리되, 한국어에서는 건축 부재의 위쪽 부분과 연결용 띠를 뜻하도록 ‘머리들’, ‘띠들’로 옮겼습니다. ‘띠들’은 영어 POB의 각주가 지적한 장식적/연결적 요소의 성격을 유지합니다.
- source_word: אַדְנֵיהֶם
  english_pob_choice: their five bases
  chosen_korean: 그 다섯 받침
  alternatives_korean:
  - 그 다섯 소켓
  - 그 다섯 주춧돌
  lexicon: HALOT
  rationale: 성막 용어 אֶדֶן은 기둥의 받침/소켓을 가리키므로, 현대 한국어에서는 ‘받침’이 가장 무난하면서도 ‘bases’의 의미를 잘 전달합니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성막 금속 용어에서는 전통적이지만 여전히 표준적인 ‘놋’이 영어 POB의 ‘bronze’를 가장 간결하게 대응합니다.
theological_decisions:
- issue: 성막 제작 서술의 기술적 문체
  chosen_reading: 서술어를 간결한 공정 보고체로 유지해, 목록식 재료·부재 정보를 과장 없이 전달했습니다.
  alternative_readings:
  - 문학적으로 풀어쓴 서술
  - 의미를 덧붙인 설명체
  rationale: 원문은 서사적 평가가 아니라 제작 완료 내역을 보고하는 형태이므로, 한국어도 설명을 덧붙이지 않고 간명하게 옮기는 것이 가장 충실합니다.
  doctrine_reference: 성막 본문의 서술 기능과 출애굽기 36장의 공정 완료 보고
