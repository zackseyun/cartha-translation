  text: And he joined five curtains by themselves[a], and six curtains by themselves.
  footnotes:
  - marker: a
    text: Or 'separately' or 'apart'; the sense is that the five curtains were joined as one set and the six curtains as another set.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 다섯 장의 휘장을 따로, 그리고 여섯 장의 휘장을 따로 연결했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘따로’는 다섯 장이 하나의 묶음, 여섯 장이 다른 묶음으로 연결되었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר
  english_pob_choice: joined
  chosen_korean: 연결했습니다
  alternatives_korean:
  - 이었습니다
  - 붙였습니다
  - 이어 붙였습니다
  lexicon: HALOT
  rationale: חבר는 ‘잇다, 연결하다’의 뜻이므로, 성막 제작 맥락에서 방법을 과도하게 특정하지 않으면서 자연스러운 현대 한국어로 ‘연결했습니다’가 적절합니다.
- source_word: הַיְרִיעֹת
  english_pob_choice: the curtains
  chosen_korean: 휘장
  alternatives_korean:
  - 커튼
  - 막
  - 천 조각
  lexicon: HALOT
  rationale: 성막 문맥의 יְרִיעָה는 단순한 생활용 커튼보다 성막 덮개를 가리키므로, 문맥에 맞는 표준적 성막 용어인 ‘휘장’으로 옮겼습니다.
- source_word: לְבָד
  english_pob_choice: by themselves
  chosen_korean: 따로
  alternatives_korean:
  - 각각
  - 별도로
  - 분리하여
  lexicon: HALOT
  rationale: לְבָד는 두 묶음을 서로 구분해 하나는 다섯 장, 다른 하나는 여섯 장으로 묶었다는 뜻이므로, 간결하게 ‘따로’가 가장 자연스럽습니다.
theological_decisions:
- issue: 성막 제작 순서에서의 분리된 결속 표현
  chosen_reading: 다섯 장과 여섯 장을 각각 하나의 묶음으로 연결했다는 뜻을 살려 ‘따로’와 반복 구조를 유지했습니다.
  alternative_readings:
  - ‘별도로’로 더 설명적으로 풀어 쓰기
  - ‘각각’으로 간단히 정리하기
  rationale: 이 절의 핵심은 두 묶음이 서로 섞이지 않고 구분된 상태로 연결되었다는 데 있으므로, 그 구조를 드러내는 번역이 본문 의미를 가장 잘 보존합니다.
  doctrine_reference: 성막 제작 지시의 서술적 정확성
