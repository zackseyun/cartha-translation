  yaml_path: translation/ot/exodus/036/023.yaml
  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
  footnotes:
  - marker: a
    text: Or 'twenty boards for the south side.' The Hebrew uses a doubled southern expression ('south, southward') for emphasis or specification.
