translation:
  language: ko
  text: 그는 성막을 위한 널빤지들을 만들었습니다. 남쪽 면, 곧 남쪽을 향한 쪽[a]을 위한 널빤지는 스무 개였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '남쪽'과 '남쪽으로'를 나란히 써서 방향을 강조하거나 더 구체적으로 지정합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 그는 … 만들었습니다
  alternatives_korean:
  - 그는 … 하였습니다
  - 그는 … 지었습니다
  lexicon: HALOT
  rationale: 서술의 진행을 살리면서도 현대 한국어에서 자연스러운 과거 서술로 옮겼습니다.
- source_word: הַקְּרָשִׁים
  english_pob_choice: the frames
  chosen_korean: 널빤지들
  alternatives_korean:
  - 틀들
  - 판자들
  lexicon: HALOT
  rationale: 성막 구조물의 재료를 가리키는 본문 맥락상, 전통적이면서도 구체적인 '널빤지들'이 가장 직접적입니다.
- source_word: לַמִּשְׁכָּן
  english_pob_choice: for the tabernacle
  chosen_korean: 성막을 위해
  alternatives_korean:
  - 장막을 위해
  - 거처를 위해
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기 성막 문맥의 정식 용어이므로 '성막'이 가장 분명합니다.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  english_pob_choice: for the south side, toward the south
  chosen_korean: 남쪽 곁면을 위해 … 남쪽을 향하여
  alternatives_korean:
  - 남쪽 편을 위해 … 남쪽으로
  - 남쪽 면을 위해 … 남쪽 쪽으로
  lexicon: HALOT
  rationale: 히브리어의 중복된 남쪽 표현을 살리기 위해 첫 표현은 방향 면을 나타내는 '남쪽 곁면', 끝의 반복은 '남쪽을 향하여'로 옮겼습니다.
