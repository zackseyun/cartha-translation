  text: 그는 성막을 위해 널빤지들을 만들었습니다. 남쪽 곁면을 위해 널빤지 스무 개, 남쪽을 향하여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 방향을 강조하기 위해 '남쪽, 남쪽으로'라는 중복 표현을 사용합니다.
