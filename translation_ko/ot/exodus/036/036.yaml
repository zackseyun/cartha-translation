  - severity: medium
    issue: ‘그들을 위해’가 기둥들을 가리키는 표현으로 쓰였습니다.
    rationale: 한국어에서 무생물 복수 지시 대상으로는 부자연스럽고 지시가 모호합니다. ‘그 기둥들을 위해’로 옮기는 것이 정확하고 자연스럽습니다.
  - severity: medium
    issue: 각주 a와 b가 모두 문장 끝에 붙어 있어 각각의 지시 대상이 불분명합니다.
