  text: וַ/יַּ֣עַשׂ לָ֗/הּ אַרְבָּעָה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וַ/יְצַפֵּ֣/ם זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וַ/יִּצֹ֣ק לָ/הֶ֔ם אַרְבָּעָ֖ה אַדְנֵי כָֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
  footnotes:
  - marker: a
    text: Or 'four silver sockets.'
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'it' refers to the veil mentioned in the preceding verse.
    reason: cross_reference
translation:
  language: ko
  text: 그것을 위해 아카시아 나무로 된 네 기둥을 만들고 금으로 입혔습니다. 그 고리들은 금이었으며, 그들을 위해 네 개의 은받침을 부어 만들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 개의 은 소켓’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그것’은 앞절에 언급된 휘장을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: עַמּוּדֵי
  english_pob_choice: pillars
  chosen_korean: 기둥
  alternatives_korean:
  - 말뚝
  - 주
  lexicon: HALOT
  rationale: 성막 구조물 문맥에서 세워진 지지대를 가리키므로, 현대 한국어에서는 자연스럽고 정확한 ‘기둥’이 적절합니다.
- source_word: שִׁטִּים
  english_pob_choice: acacia wood
  chosen_korean: 아카시아 나무
  alternatives_korean:
  - 아카시아 목재
  - 싯딤 나무
  lexicon: HALOT
  rationale: 성막 재료의 고유한 목재 종류를 현대 독자가 바로 이해하도록 ‘아카시아 나무’로 옮겼습니다.
- source_word: וַיְצַפֵּם
  english_pob_choice: overlaid them
  chosen_korean: 금으로 입혔습니다
  alternatives_korean:
  - 금으로 덮었습니다
  - 금으로 입혔습니다
  lexicon: HALOT
  rationale: 금속을 표면에 입히는 성막 제작 용법이므로, 단순한 ‘덮다’보다 ‘입히다’가 기술적 의미를 더 잘 드러냅니다.
- source_word: אַדְנֵי
  english_pob_choice: bases
  chosen_korean: 은받침
  alternatives_korean:
  - 은 바닥받침
  - 은 소켓
  lexicon: HALOT
  rationale: 문맥상 기둥을 받치는 금속 바탕부를 가리키므로, 한국어 성막 용례에 맞는 ‘받침’을 쓰되 재질을 앞에 붙여 의미를 분명히 했습니다.
theological_decisions:
- issue: 앞절의 휘장에 대한 대명사 지시
  chosen_reading: ‘그것을 위해’로 옮겨 앞절의 휘장을 자연스럽게 가리키게 했습니다.
  alternative_readings:
  - ‘그 휘장을 위해’
  - ‘그것(휘장)을 위해’
  rationale: 히브리어 여성 단수 대명사 לָהּ는 바로 앞의 휘장을 가리키므로, 본문에는 과잉설명 없이 유지하되 한국어에서는 문맥상 지시를 매끄럽게 드러냈습니다.
  doctrine_reference: 문맥 지시어 처리
