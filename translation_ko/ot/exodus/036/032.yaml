revisions:
- from: 그리고 성막의 두 번째 쪽 널판들을 위한 띠는 다섯 개요, 성막의 뒷부분 서쪽을 위한 널판들을 위한 띠도 다섯 개였습니다.[a][b]
  to: 그리고 성막의 둘째 쪽 널판들을 위한 가로막대 다섯 개와, 성막의 뒤쪽, 곧 서쪽의 널판들을 위한 가로막대 다섯 개였습니다.[a][b]
  rationale: 구조재를 가리키는 בְּרִיחִם을 ‘가로막대’로 옮기고, 둘째 쪽과 성막의 서쪽 뒤편이라는 공간 수식을 한국어 문장 안에서 명확히 했습니다. יַרְכָתַיִם의 ‘뒤쪽/후미’와 יָמָּה의 ‘서쪽’을 모두 보존했으며, 히브리어의 두 차례 ‘다섯’ 열거도 유지했습니다.
