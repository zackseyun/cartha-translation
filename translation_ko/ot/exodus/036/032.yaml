translation:
  language: ko
  text: 그리고 성막의 두 번째 쪽 널판들을 위한 띠는 다섯 개요, 성막의 뒷부분 서쪽을 위한 널판들을 위한 띠도 다섯 개였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가로막대들’로 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성막의 뒤쪽, 서쪽을 향한 부분’으로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  english_pob_choice: bars
  chosen_korean: 띠
  alternatives_korean:
  - 바
  - 가로막대
  - 횡목
  lexicon: HALOT
  rationale: 성막 구조에서 널판들을 연결하는 가로 부재를 자연스럽고 간결하게 나타내는 말로 ‘띠’를 택했습니다. ‘바’는 음역 느낌이 강하고, ‘가로막대’는 뜻은 분명하지만 다소 길어집니다.
- source_word: קַרְשֵׁי
  english_pob_choice: boards
  chosen_korean: 널판들
  alternatives_korean:
  - 판자들
  - 판들
  - 프레임들
  lexicon: HALOT
  rationale: 출애굽기의 성막 문맥에서 구조용 목재 부재를 가리키므로 전통적이면서도 문맥에 맞는 ‘널판들’을 사용했습니다.
- source_word: לְקַרְשֵׁי צֶלַע הַמִּשְׁכָּן הַשֵּׁנִית
  english_pob_choice: for the boards of the second side of the tabernacle
  chosen_korean: 성막의 두 번째 쪽 널판들을 위한
  alternatives_korean:
  - 성막의 두 번째 면 널판들을 위한
  - 성막의 둘째 쪽 널판들을 위한
  lexicon: HALOT
  rationale: צֶלַע와 הַשֵּׁנִית의 관계를 살려 ‘두 번째 쪽’으로 옮겨, 단순히 ‘다른 쪽’으로 완화하지 않고 순서성을 유지했습니다.
- source_word: לַיַּרְכָתַיִם יָמָּה
  english_pob_choice: at the far rear on the west
  chosen_korean: 뒷부분 서쪽을 위한
  alternatives_korean:
  - 뒤쪽 서편을 위한
  - 서쪽의 뒤쪽을 위한
  - 후미 서쪽을 위한
  lexicon: HALOT
  rationale: יַרְכָתַיִם의 핵심인 ‘뒤/깊은 곳’의 뜻을 살려 문맥상 성막의 후미를 가리키는 표현으로 옮겼습니다. ‘서쪽’은 יָמָּה의 방향을 반영합니다.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  english_pob_choice: and five ... and five
  chosen_korean: 다섯 개요 ... 다섯 개였습니다
  alternatives_korean:
  - 다섯 개이며 ... 다섯 개이며
  - 그리고 다섯 개, 그리고 다섯 개
  lexicon: HALOT
  rationale: 히브리어의 반복된 수량열거를 한국어에서도 두 번의 수량 제시로 살렸습니다. 문장 종결은 합쇼체 서술에 맞추었습니다.
