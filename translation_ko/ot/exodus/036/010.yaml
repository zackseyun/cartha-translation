    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  english_pob_choice: joined
  chosen_korean: 잇고
  alternatives_korean:
  - 연결하고
  - 붙이고
  - 맞붙여
  lexicon: HALOT
  rationale: חבר는 ‘잇다, 연결하다’의 뜻이므로, 성막 휘장을 서로 이어 붙이는 맥락에 맞게 간결한 ‘잇다’를 택했습니다.
- source_word: יְרִיעֹת
  english_pob_choice: curtains
  chosen_korean: 휘장
  alternatives_korean:
  - 커튼
  - 천
  - 막
  lexicon: HALOT
  rationale: 성막 문맥의 יְרִיעוֹת은 단순한 커튼보다 성막용 덮개/천막막을 가리키므로, 한국어 성경에서 문맥상 자연한 ‘휘장’을 사용했습니다.
- source_word: חֲמֵשׁ / וְחָמֵשׁ
  english_pob_choice: five / the other five curtains
  chosen_korean: 다섯 장 / 다른 휘장 다섯 장
  alternatives_korean:
  - 다섯 / 또 다섯 휘장
  - 다섯 장 / 나머지 다섯 장
  lexicon: HALOT
  rationale: 두 묶음이 각각 다섯 장씩이라는 병렬 구조를 살리기 위해 수량 표현을 반복하고, 두 번째 묶음의 구분은 ‘다른’으로 분명히 했습니다.
- source_word: אַחַת אֶל אֶחָת
  english_pob_choice: to one another
  chosen_korean: 서로
  alternatives_korean:
  - 하나가 다른 하나에
  - 서로에게
  lexicon: HALOT
  rationale: ‘하나가 다른 하나로’라는 히브리어 관용은 각 묶음 안에서의 상호 결합을 뜻하므로, 현대 한국어에서 자연한 ‘서로’로 옮겼습니다.
