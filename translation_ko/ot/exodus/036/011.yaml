base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
  footnotes:
  - marker: a
    text: Or 'in the coupling' / 'at the joining.' The Hebrew term refers to the place or arrangement where the curtains were joined together.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 첫째로 이어 붙인 휘장 묶음[a]의 끝쪽 휘장 가장자리에 청색 실로 고리들을 만들었습니다. 둘째로 이어 붙인 휘장 묶음의 맨 끝 휘장 가장자리에도 그와 같이 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘연결부에서’, ‘잇는 곳에서’. 히브리어는 휘장들이 서로 이어지는 자리 또는 배열을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  english_pob_choice: loops
  chosen_korean: 고리들
  alternatives_korean:
  - 루프
  - 고리
  lexicon: HALOT
  rationale: 천막을 잇는 천 조각의 고리라는 기능이 분명하므로, 현대 한국어에서 자연스러운 ‘고리들’로 옮겼습니다.
- source_word: תְּכֵלֶת
  english_pob_choice: blue yarn
  chosen_korean: 청색 실
  alternatives_korean:
  - 푸른 실
  - 청색 실타래
  - 청색 실줄
  lexicon: HALOT
  rationale: 단순한 색이 아니라 물질로서의 염색된 실을 가리키므로, ‘청색 실’이 가장 간결하고 source-direct합니다.
- source_word: הַיְרִיעָה / הַקִּיצוֹנָה
  english_pob_choice: curtain / outermost
  chosen_korean: 휘장 / 가장 바깥쪽
  alternatives_korean:
  - 막 / 바깥쪽
  - 천막 휘장 / 끝
  lexicon: HALOT
  rationale: 성막 문맥의 יְרִיעָה는 단순한 커튼보다 성막 휘장에 가깝기 때문에 ‘휘장’을 택했고, הַקִּיצוֹנָה는 위치를 살려 ‘가장 바깥쪽’으로 옮겼습니다.
- source_word: בַּמַּחְבָּרֶת / בַּמַּחְבֶּרֶת
  english_pob_choice: in the first set joined together / in the second set joined together
  chosen_korean: 처음 묶인 / 둘째 묶인
  alternatives_korean:
  - 첫 번째로 연결된 / 두 번째로 연결된
  - 처음 잇대어진 / 둘째 잇대어진
  lexicon: HALOT
  rationale: 핵심은 ‘이어 붙인 상태/연결부’이므로, 영어 POB의 의미를 따라 ‘묶인’으로 간결하게 처리하되, 동일한 결합 구조의 대칭성을 드러냈습니다.
theological_decisions:
- issue: 성막 제작 절차의 반복 병렬
  chosen_reading: 본문의 평행 구조를 살려 첫 번째와 두 번째 휘장 묶음의 대응을 분명히 드러냈습니다.
  alternative_readings:
  - 문장을 더 압축해 한 번만 언급하는 방식
  - 동일 동사를 반복해 기계적으로 직역하는 방식
  rationale: 이 절은 기술적 묘사이므로, 독자가 구조적 대응을 즉시 파악하도록 ‘그와 같이’로 반복 관계를 보존했습니다.
  doctrine_reference: 출애굽기 36장 성막 제작 본문
