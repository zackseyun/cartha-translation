base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
  footnotes:
  - marker: a
    text: Or 'matched' or 'twinned' at the bottom; the Hebrew emphasizes that the two pieces corresponded to each other structurally.
    reason: lexical_alternative
  - marker: b
    text: Or 'whole' up to its top. The sense is that each was fully joined or finished from bottom to top.
    reason: lexical_alternative
  - marker: c
    text: Or 'for the two corner pieces.' The Hebrew literally says 'for the two corners,' likely referring to the corner frames/boards.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들은 아래쪽에서 서로 짝을 이루었고[a], 함께 그 꼭대기까지 온전하였으며, 하나의 고리에 이르렀습니다. 곧 두 모서리를 위해[b] 그렇게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘짝을 이루었고’는 히브리어 תוֹאֲמִם의 구조적 대응을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두 모서리’는 문자적으로는 ‘두 모서리들’을 뜻하며, 천막 구조의 모서리 틀/판들을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
