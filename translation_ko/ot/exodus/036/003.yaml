language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְח֞וּ מִ/לִּ/פְנֵ֣י מֹשֶׁ֗ה אֵ֤ת כָּל הַ/תְּרוּמָה֙ אֲשֶׁ֨ר הֵבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לִ/מְלֶ֛אכֶת עֲבֹדַ֥ת הַ/קֹּ֖דֶשׁ לַ/עֲשֹׂ֣ת אֹתָ֑/הּ וְ֠/הֵם הֵבִ֨יאוּ אֵלָ֥י/ו ע֛וֹד נְדָבָ֖ה בַּ/בֹּ֥קֶר בַּ/בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
  footnotes:
  - marker: a
    text: Or 'from the presence of Moses.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Or 'morning by morning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모세 앞에서 이스라엘 자손이 가져온 모든 예물을, 곧 성소의 일에 필요한 그 일을 하려고 가져갔습니다. 그런데도 그들은 아침마다 그에게 자원제를 계속 가져왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세의 면전에서’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 사람들.’ 문자적으로는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아침마다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלִּפְנֵי מֹשֶׁה
  english_pob_choice: from before Moses
  chosen_korean: 모세 앞에서
  alternatives_korean:
  - 모세의 앞에서
  - 모세의 면전에서
  lexicon: HALOT
  rationale: 히브리어의 ‘~앞에서/면전에서’라는 공간적·관계적 표현을 자연스러운 한국어로 옮기되, 모세의 관리 아래 있던 물품의 이동이라는 맥락을 살렸습니다.
- source_word: הַתְּרוּמָה
  english_pob_choice: the contribution
  chosen_korean: 예물
  alternatives_korean:
  - 기부물
  - 기여물
  - 봉헌물
  lexicon: HALOT
  rationale: 탁월하게 구별되는 제의용어보다, 성막 건축을 위한 헌납물이라는 문맥에 맞춰 ‘예물’로 옮겨 자원적 헌납의 성격을 살렸습니다.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  english_pob_choice: for the work of the service of the sanctuary
  chosen_korean: 성소의 일에 필요한 그 일
  alternatives_korean:
  - 성소의 봉사 일을 위해
  - 성소의 섬김의 일에
  - 거룩한 곳의 봉사 일을 위해
  lexicon: HALOT
  rationale: 겹겹이 쌓인 명사구를 한국어에서 과도하게 직역하면 부자연스러워지므로, ‘성소’와 ‘일’의 관계를 보존하면서도 문맥상 필요한 작업이라는 뜻을 자연스럽게 풀었습니다.
- source_word: נְדָבָה
  english_pob_choice: freewill offerings
  chosen_korean: 자원제
  alternatives_korean:
  - 자원헌물
  - 자원 예물
  - 자발적 예물
  lexicon: HALOT
  rationale: 의례 맥락에서 자발적으로 드리는 헌납이라는 점을 드러내기 위해 ‘자원제’를 택했으며, 반복적으로 드려진다는 문맥에도 잘 맞습니다.
theological_decisions:
- issue: 예물을 ‘더 가져옴’과 ‘계속 가져옴’의 뉘앙스
  chosen_reading: ‘그런데도 그들은 아침마다 그에게 자원제를 계속 가져왔습니다’로, 이미 충분한 예물을 넘겨받은 뒤에도 자발적 헌납이 이어졌음을 드러냈습니다.
  alternative_readings:
  - 그들은 또 아침마다 그에게 자원제를 가져왔습니다
  - 그들은 아침마다 그에게 자원제를 계속 바쳤습니다
  rationale: 본문은 단순 반복이 아니라 성소 일을 위한 풍성하고 지속적인 자발 헌납을 강조하므로, 지속성을 살리는 표현을 택했습니다.
  doctrine_reference: 성막 봉헌 서술의 내러티브 강조
