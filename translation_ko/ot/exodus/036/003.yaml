- from: 그들은 모세 앞에서 이스라엘 자손이 가져온 모든 예물을, 곧 성소의 일에 필요한 그 일을 하려고 가져갔습니다. 그런데도 그들은 아침마다 그에게 자원제를 계속 가져왔습니다.[a][b][c]
  to: 그들은 이스라엘 자손이 성소의 봉사 일을 수행하기 위하여 가져온 모든 헌물을 모세에게서 받아[a] 갔습니다. 그런데도 그들은 아침마다 그에게 자원 헌물을 계속 가져왔습니다.[b][c]
