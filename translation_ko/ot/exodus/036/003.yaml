  verdict: revise
  source_fidelity: 첫 절의 ‘성소의 일에 필요한 그 일을 하려고’는 히브리어 לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ לַעֲשֹׂת אֹתָהּ를 부정확하고 중복되게 옮깁니다. 이는 ‘성소의 봉사 일을 수행하기 위하여’라는 뜻입니다. נְדָבָה는 이 문맥에서 제사 행위인 ‘자원제’보다 자발적으로 드린 헌물/예물을 가리킵니다. וְ는 본래 단순 접속이나, 앞선 인도 후에도 계속 가져오는 서사적 상황을 한국어 ‘그런데도’로 나타내는 것은 가능한 해석입니다.
  naturalness: ‘모세 앞에서’와 ‘가져갔습니다’의 결합은 한국어에서 다소 어색하고 물품을 모세에게서 넘겨받았다는 관계를 충분히 드러내지 못합니다. ‘모세에게서 받아’가 자연스럽습니다. ‘성소의 봉사 일을 수행하기 위하여’는 현대 표준어 합쇼체에서 자연스럽고 원문의 명사구 및 목적 표현을 보존합니다.
  terminology: תְּרוּמָה는 성막 건축을 위한 ‘헌물’ 또는 ‘예물’로 옮길 수 있으나, 같은 절의 נְדָבָה와의 혼동을 줄이고 물질적 기부 문맥을 드러내기 위해 ‘헌물’을 사용합니다. נְדָבָה는 ‘자원 헌물’로 옮겨 자발성을 보존하며, ‘자원제’가 유발할 수 있는 희생제사 의미를 피합니다. ‘이스라엘 자손’과 ‘성소’는 적절합니다.
