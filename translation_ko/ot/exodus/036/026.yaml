  lexicon: HALOT
  rationale: 연결 접속사 וְ는 앞 문맥의 목록을 이어 주므로 ‘그리고’로 옮기고, 수사는 현대 한국어 관례에 따라 ‘40개’로 자연스럽게 표현했습니다.
- source_word: אַדְנֵי/הֶ֖ם
