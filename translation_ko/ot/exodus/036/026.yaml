  chosen_reading: 두 절 모두 ‘한 판 밑에 두 받침’으로 반복했습니다.
  alternative_readings:
  - 한 판 밑에 두 받침, 또 다른 판 밑에 두 받침
  - 한 판 밑에 두 받침, 또 한 판 밑에 두 받침
  rationale: 본문은 ‘the one frame’/‘the one board’를 반복하므로, 영어 POB의 수정 방향처럼 둘째 절을 ‘다른’으로 바꾸지 않고 반복 구조를 유지했습니다.
