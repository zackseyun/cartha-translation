translation:
  language: ko
  text: 그리고 그들의 은 받침은 사십 개였습니다. 그 한 널판 아래에 받침 두 개, 또 그 한 널판 아래에 받침 두 개였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 절에서 모두 ‘그 한 널판’에 해당하는 표현을 반복합니다. 둘째 절을 ‘다른 널판’으로 바꾸지 않았습니다.
    reason: source_note
lexical_decisions:
- source_word: וְ/אַרְבָּעִ֥ים
  english_pob_choice: and ... forty
  chosen_korean: 그리고 ... 40개
  alternatives_korean:
  - 그리고 마흔
  - 또 40개
  lexicon: HALOT
  rationale: 연결 접속사 וְ는 앞 문맥의 목록을 이어 주므로 ‘그리고’로 옮기고, 수사는 현대 한국어 관례에 따라 ‘40개’로 자연스럽게 표현했습니다.
- source_word: אַדְנֵי/הֶ֖ם
  english_pob_choice: their bases
  chosen_korean: 그들의 받침
  alternatives_korean:
  - 그들의 소켓
  - 그들의 기초
  lexicon: HALOT
  rationale: 성막 구조물의 지지대라는 기능을 살려 ‘받침’으로 옮겼습니다. 영어 POB의 ‘bases’와도 대응됩니다.
- source_word: שְׁנֵ֣י אֲדָנִ֗ים ... תַּ֚חַת הַ/קֶּ֣רֶשׁ
  english_pob_choice: two bases under the one frame
  chosen_korean: 한 판 밑에 두 받침
  alternatives_korean:
  - 한 널빤지 아래 두 받침
  - 한 판 아래 두 소켓
  lexicon: HALOT
  rationale: קֶרֶשׁ은 성막 문맥에서 구조용 널판을 가리키므로 ‘판’으로 옮기되, 현대 독자가 기능을 쉽게 파악하도록 했습니다. תַּחַת은 위치 관계를 그대로 살려 ‘밑에’로 번역했습니다.
- source_word: הָ/אֶחָֽד
  english_pob_choice: the one frame
  chosen_korean: 한
  alternatives_korean:
  - 그 한
  - 첫째
  lexicon: HALOT
  rationale: 히브리어는 두 절에서 모두 ‘the one’(הָאֶחָד)을 반복하므로, 한국어에서는 어색한 반복을 피하면서도 대조적 의미를 만들지 않도록 두 번 모두 ‘한’으로 유지했습니다.
theological_decisions:
- issue: 히브리어의 반복 구조를 한국어에서 어떻게 반영할지
  chosen_reading: 두 절 모두 ‘한 판 밑에 두 받침’으로 반복했습니다.
  alternative_readings:
  - 한 판 밑에 두 받침, 또 다른 판 밑에 두 받침
  - 한 판 밑에 두 받침, 또 한 판 밑에 두 받침
  rationale: 본문은 ‘the one frame’/‘the one board’를 반복하므로, 영어 POB의 수정 방향처럼 둘째 절을 ‘다른’으로 바꾸지 않고 반복 구조를 유지했습니다.
  doctrine_reference: source fidelity / textual symmetry
