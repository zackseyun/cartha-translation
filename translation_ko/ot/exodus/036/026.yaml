  text: 'and their forty silver bases: two bases under the one frame[a], and two bases under the one frame.'
  footnotes:
  - marker: a
    text: Or 'two bases under the one board, and two bases under the one board.' The Hebrew repeats 'the one frame/board' in both clauses; English idiom often renders the second as 'the other frame.'
