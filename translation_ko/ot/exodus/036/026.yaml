translation:
  language: ko
  text: 그리고 그들의 은 40개 받침이 있었으니, 한 판 밑에 두 받침이 있고, 또 한 판 밑에 두 받침이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 절에서 모두 ‘한 판/그 한 판’에 해당하는 표현을 반복합니다. 영어 관용처럼 둘째 절을 ‘다른 판’으로 풀지 않았습니다.
    reason: source_note
lexical_decisions:
- source_word: וְ/אַרְבָּעִ֥ים
  english_pob_choice: and ... forty
  chosen_korean: 그리고 ... 40개
  alternatives_korean:
