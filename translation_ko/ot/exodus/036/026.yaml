  - 한 판 아래 두 소켓
  lexicon: HALOT
  rationale: קֶרֶשׁ은 성막 문맥에서 구조용 널판을 가리키므로 ‘판’으로 옮기되, 현대 독자가 기능을 쉽게 파악하도록 했습니다. תַּחַת은 위치 관계를 그대로 살려 ‘밑에’로 번역했습니다.
- source_word: הָ/אֶחָֽד
  english_pob_choice: the one frame
