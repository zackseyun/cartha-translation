  source_fidelity: 개정안은 וַיָּבֹאוּ의 서술적 과거를 ‘왔습니다’로, מִמְּלַאכְתּוֹ의 이탈 의미를 ‘하던 일을 떠나’로 반영합니다. אִישׁ אִישׁ의 분배적 용법은 ‘저마다’로 보존했습니다. הַחֲכָמִים은 성막/성소 제작 맥락의 기술 있는 사람들을 가리키므로 ‘숙련된 일꾼들’로 옮겼습니다.
  naturalness: 원문 초안의 ‘모든 일을 하는 모든 지혜로운 자들이 그 각자가’는 ‘모든’의 중복과 ‘그 각자’의 부자연스러운 결합 때문에 현대 표준 한국어로 매끄럽지 않습니다. 개정안은 현대의 격식 있는 성경 서술체(합쇼체)로 자연스럽습니다.
  terminology: מְלֶאכֶת הַקֹּדֶשׁ은 문맥상 성소를 위한 제작/봉사의 일을 뜻하므로 ‘성소의 모든 일’로 유지했습니다. ‘지혜로운 자들’보다 문맥상 직능을 드러내는 ‘숙련된 일꾼들’이 적절합니다.
