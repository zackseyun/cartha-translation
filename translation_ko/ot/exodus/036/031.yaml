  rationale: 가로대가 성막 한쪽 면의 קֶרֶשׁ, 곧 널판들 또는 구조 부재들을 위한 것이라는 원문의 수식 관계를 본문에 회복했습니다. ‘널판들’은 자연스러운 전통 용어로 사용하되, 구조적 의미를 반영한 ‘틀들’의 가능성은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
