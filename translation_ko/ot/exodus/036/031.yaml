translation:
  language: ko
  text: 그는 성막 한쪽 면의 널판들을 위한 아카시아 나무 가로대 다섯 개를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘틀들’—성막의 세워진 구조 부재들을 가리키는 말로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 그는 … 만들어
  alternatives_korean:
  - 그는 … 하였습니다
  - 그리고 그는 … 만들었습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol의 연속 동작을 자연스러운 현대 한국어 서술로 옮기되, 불필요한 연결어를 줄였습니다.
- source_word: בְּרִיחֵי
  english_pob_choice: bars
  chosen_korean: 가로대
  alternatives_korean:
  - 막대
  - 빗장
  - 가로빗장
  lexicon: HALOT
  rationale: 성막 구조를 이어 주는 수평 부재라는 기능을 살려 ‘가로대’로 옮겼습니다. ‘빗장’은 잠금 장치 뉘앙스가 강해 좁습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로
  alternatives_korean:
  - 아카시아 목재로
  - 아카시아로 만든
  lexicon: HALOT
  rationale: 재료를 나타내는 명사구를 한국어의 자연스러운 도구/재료 표현으로 처리했습니다.
- source_word: לְקַרְשֵׁי
  english_pob_choice: for the frames of
  chosen_korean: 성막의 한쪽 면을 위한 것으로 삼았습니다
  alternatives_korean:
  - 성막의 틀을 위한 것으로 삼았습니다
  - 성막의 판자들을 위한 것으로 삼았습니다
  lexicon: HALOT
  rationale: 문맥상 קֶרֶשׁ는 성막의 구조적 부재를 가리키므로, POB의 ‘frames’ 취지를 살리면서도 한국어에서는 전체 문장 안에서 기능을 풀어 설명했습니다.
