base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
  footnotes:
  - marker: a
    text: 'Hebrew: ''one measure for all the curtains.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'and the width of each curtain was four cubits'.
    reason: previous_rendering
translation:
  language: ko
  text: 각 휘장의 길이는 스물여덟 규빗[a]이었고, 너비는 네 규빗[b]이었습니다. 모든 휘장의 치수는 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 직역: ‘모든 휘장에 한 치수.’'
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘각 휘장의 너비는 네 규빗이었습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: אֹרֶךְ
  english_pob_choice: length
  chosen_korean: 길이
  alternatives_korean:
  - 장
  - 긴 쪽
  lexicon: HALOT
  rationale: 물리적 치수를 나타내는 말로 가장 자연스럽고, 본문의 대칭 구조를 살리기에 적절합니다.
- source_word: יְרִיעָה
  english_pob_choice: curtain
  chosen_korean: 휘장
  alternatives_korean:
  - 천막 조각
  - 커튼
  lexicon: HALOT
  rationale: 성막 문맥에서 יְרִיעָה는 성막 휘장들을 가리키므로, 한국어 성경에서 통용되는 ‘휘장’이 원문 맥락을 가장 분명하게 드러냅니다.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  english_pob_choice: twenty-eight
  chosen_korean: 스물여덟
  alternatives_korean:
  - 이십팔
  lexicon: HALOT
  rationale: 현대 한국어 수사 표현으로 자연스럽고, 본문의 수량을 그대로 전달합니다.
- source_word: בָּאַמָּה
  english_pob_choice: cubits
  chosen_korean: 규빗
  alternatives_korean:
  - 자
  lexicon: HALOT
  rationale: 현대 단위로 환산하지 않고 원문 측량 단위를 보존해 투명성을 유지합니다.
- source_word: מִדָּה אַחַת
  english_pob_choice: one measurement
  chosen_korean: 한 치수
  alternatives_korean:
  - 같은 치수
  - 한 가지 측량
  lexicon: HALOT
  rationale: ‘한 measure’의 반복적 동일성을 한국어로 간결하게 살리되, 모든 휘장이 동일 규격임을 분명히 하기 위해 ‘치수’를 택했습니다.
