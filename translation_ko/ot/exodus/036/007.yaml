translation:
  language: ko
  text: 그 재료는 모든 일을 하기에 충분하고도 남았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 남는 것이 있었습니다.’ 히브리어 동사는 그 일을 위해 필요한 것보다 재료가 더 많아 남았음을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  english_pob_choice: the material
  chosen_korean: 재료
  alternatives_korean:
  - 일
  - 공사에 쓰일 물품
  lexicon: HALOT
  rationale: 문맥상 백성이 가져온 것의 양을 말하므로, כאן의 מְלָאכָה를 ‘일’보다 그 일을 위해 쓰인 실질적 ‘재료’로 옮기는 것이 자연스럽습니다.
- source_word: הָיְתָה דַיָּם
  english_pob_choice: was sufficient
  chosen_korean: 충분했고
  alternatives_korean:
  - 넉넉했고
  - 족했고
  lexicon: HALOT
  rationale: דַּי는 ‘충분함’을 뜻하므로, 현대 한국어에서 간결하고 문맥에 맞는 ‘충분했다’ 계열로 옮겼습니다.
- source_word: לְכָל הַמְּלָאכָה
  english_pob_choice: for all the work
  chosen_korean: 그 모든 일을 하는 데
  alternatives_korean:
  - 모든 공사에
  - 그 모든 작업에
  lexicon: HALOT
  rationale: 뒤의 לַעֲשׂוֹת אֹתָהּ와 함께 읽으면 단순한 ‘일’보다 ‘그 일을 수행하는 데’라는 목적 관계가 드러나므로 자연스럽게 풀어 옮겼습니다.
- source_word: וְהוֹתֵר
  english_pob_choice: and there was more than enough
  chosen_korean: 그리고도 더 남았습니다
  alternatives_korean:
  - 그리고도 남았습니다
  - 또 남아 있었습니다
  lexicon: HALOT
  rationale: יתר의 히필은 ‘남다/남게 되다, 남는 것이 있다’는 의미이므로, POB의 ‘more than enough’와 주석의 ‘left over’ 뉘앙스를 함께 살려 ‘더 남았습니다’로 옮겼습니다.
theological_decisions:
- issue: 남음/여분의 뉘앙스
  chosen_reading: 단순한 충분함을 넘어 실제로 남는 재료가 있었다는 점을 본문이 강조한다고 보아 이를 본문에 반영했습니다.
  alternative_readings:
  - ‘충분했습니다’로만 옮겨 남음의 뉘앙스를 약화시키는 번역
  - 각주로만 남김
  rationale: 히브리어 마지막 동사 וְהוֹתֵר는 초과·잔여를 나타내므로, 본문 자체에서 ‘더 남았습니다’로 드러내는 것이 원문의 강조를 보존합니다.
  doctrine_reference: 본문 의미 보존과 번역 등가성
- issue: 반복 접속사 וְ의 처리
  chosen_reading: 첫머리와 뒤 문장의 וְ를 각각 ‘그리고’로 살리되, 한국어로는 지나친 반복이 되지 않도록 자연스럽게 구성했습니다.
  alternative_readings:
  - 접속사를 하나로 줄여 번역
  - 문장 전체를 하나의 유창한 문장으로 재구성
  rationale: 히브리어 서술의 연결감을 보존하면서도 한국어 읽기 흐름을 해치지 않기 위한 절충입니다.
  doctrine_reference: 문체적 충실성
