  yaml_path: translation/ot/exodus/036/007.yaml
  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
  footnotes:
  - marker: a
    text: Or, 'and there was some left over.' The Hebrew verb can emphasize that there was a surplus remaining after what was needed for the work.
