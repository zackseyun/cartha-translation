base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/021.yaml
  text: The length of each frame was ten cubits[a], and the width of each frame was a cubit and a half.
  footnotes:
  - marker: a
    text: Or 'board' or 'plank' for 'frame' (Hebrew קֶרֶשׁ); the term refers to the tabernacle's structural pieces.
    reason: lexical_alternative
translation:
  language: ko
  text: 각 판자의 길이는 열 규빗이고, 각 판자의 너비는 한 규빗 반입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 문맥상 '틀', '프레임'으로 옮길 수 있습니다. כאן의 קֶרֶשׁ은 성막의 구조 부재를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  english_pob_choice: frame
  chosen_korean: 판자
  alternatives_korean:
  - 틀
  - 프레임
  - 널판
  lexicon: HALOT
  rationale: 성막 구조물 문맥에서 영어 POB의 'frame'에 해당하는 핵심 구조 부재를 한국어로는 '판자'로 옮겼습니다. '틀'은 구조 전체로 읽히기 쉽고, '프레임'은 현대적이지만 본문 용례의 물질성을 덜 드러냅니다.
- source_word: עֶשֶׂר אַמֹּת
  english_pob_choice: ten cubits
  chosen_korean: 열 규빗
  alternatives_korean:
  - 열 규빗 길이
  - 십 규빗
  lexicon: HALOT
  rationale: 수량과 고대 길이 단위를 직접 살려 '열 규빗'으로 옮겼습니다. '십 규빗'도 가능하지만 현대 한국어 본문에서는 고유어 수사 '열'이 더 자연스럽습니다.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  english_pob_choice: a cubit and a half
  chosen_korean: 한 규빗 반
  alternatives_korean:
  - 한 규빗과 반 규빗
  - 일 규빗 반
  lexicon: HALOT
  rationale: 히브리어의 관용적 수량 표현을 자연스러운 한국어로 옮겨 '한 규빗 반'으로 처리했습니다. 분해형 직역보다 읽기 쉽고, 길이 단위의 정확성도 유지합니다.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  english_pob_choice: each frame
  chosen_korean: 각 판자
  alternatives_korean:
  - 한 판자마다
  - 모든 판자
  lexicon: HALOT
  rationale: 직역하면 '그 한 판자'이지만 문맥상 분배적 의미이므로 '각 판자'로 옮겼습니다. 영어 POB의 'each frame'과 같은 해석을 한국어로 분명하게 전달합니다.
