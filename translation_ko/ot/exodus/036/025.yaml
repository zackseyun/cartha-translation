translation:
  language: ko
  text: 성막의 둘째 면, 곧 북쪽 면에는 스무 개의 널판을 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘스무 개의 틀’. 히브리어는 구조용 판재 또는 틀을 가리킬 수 있으며, 성막 부재의 정확한 형태에는 논란이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע הַמִּשְׁכָּן הַשֵּׁנִית
  english_pob_choice: For the second side of the tabernacle
  chosen_korean: 성막의 둘째 면
  alternatives_korean:
  - 성막의 둘째 쪽
  - 성막의 두 번째 옆면
  lexicon: HALOT
  rationale: צֶלַע는 성막 문맥에서 구조의 ‘면/쪽’을 가리키므로, 해부학적 뉘앙스보다 건축적 의미를 살려 ‘면’으로 옮겼습니다.
- source_word: לִפְאַת צָפוֹן
  english_pob_choice: on the north side
  chosen_korean: 곧 북쪽 면
  alternatives_korean:
  - 북쪽 편에
  - 북쪽 가장자리에
  lexicon: HALOT
  rationale: פֵאָה는 방향을 가리키는 ‘면/쪽’이므로, 한국어에서는 중복을 피하면서도 방향을 분명히 하는 ‘북쪽 면’이 자연스럽습니다.
- source_word: קְרָשִׁים
  english_pob_choice: boards
  chosen_korean: 널판
  alternatives_korean:
  - 판자
  - 틀
  lexicon: HALOT
  rationale: 성막의 구조재를 가리키는 קְרָשִׁים은 전통적 ‘판자’보다 건축적 성격을 더 잘 드러내는 ‘널판’이 적절합니다.
theological_decisions:
- issue: 성막 구조물 명칭의 표준화
  chosen_reading: 여기서는 성막의 건축 지시문으로 읽고, 설명적 확대 없이 구조 수량만 전달했습니다.
  alternative_readings:
  - 상징적 의미를 덧붙여 해석하기
  - 의례적 의미를 강조하는 번역으로 풀기
  rationale: 본문의 초점은 북쪽 면에 배치된 구조물의 수량과 배치이므로, 해석을 덧붙이지 않고 사실 전달을 우선했습니다.
  doctrine_reference: 출애굽기 36장의 성막 제작 지시
