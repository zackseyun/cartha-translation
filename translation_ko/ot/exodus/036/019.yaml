  text: וַ/יַּ֤עַשׂ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵלִ֖ים מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/019.yaml
  text: He made a covering for the tent of ram skins dyed red[a], and a covering of fine leather above.
  footnotes:
  - marker: a
    text: Hebrew תְּחָשִׁים is uncertain; possible renderings include 'sea-cow hides,' 'porpoise skins,' 'dugong skins,' or traditionally 'badger skins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 천막을 위해 붉게 물들인 숫양 가죽으로 덮개를 만들고, 그 위에 해달 가죽으로 된 덮개를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תְּחָשִׁים은 뜻이 확실하지 않습니다. 가능한 번역으로는 ‘바다소 가죽’, ‘돌고래 가죽’, ‘듀공 가죽’, 전통적으로는 ‘오소리 가죽’ 등이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  lexicon: HALOT
  rationale: עָשָׂה의 서술적 완료를 자연스러운 현대 한국어 동사로 옮겼습니다.
- source_word: מִכְסֶה
  english_pob_choice: a covering
  chosen_korean: 덮개
  alternatives_korean:
  - 덮는 것
  - 커버
  lexicon: HALOT
  rationale: 천막 구조물의 외피를 가리키는 말로서 한국어에서는 ‘덮개’가 가장 자연스럽고 간결합니다.
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  english_pob_choice: of ram skins dyed red
  chosen_korean: 붉게 물들인 숫양 가죽
  alternatives_korean:
  - 붉은 숫양 가죽
  - 붉게 염색한 숫양 가죽
  - 붉게 물든 숫양의 가죽
  lexicon: HALOT
  rationale: עֹרֹת는 ‘가죽’이 자연스럽고, מְאָדָּמִים은 단순 색채보다 염색/물들임의 결과를 나타내므로 ‘붉게 물들인’이 원문 뉘앙스를 잘 살립니다.
- source_word: עֹרֹת תְּחָשִׁים
  english_pob_choice: of fine leather
  chosen_korean: 해달 가죽
  alternatives_korean:
  - 좋은 가죽
  - 질 좋은 가죽
  - 바다소 가죽
  - 돌고래 가죽
  lexicon: HALOT
  rationale: תְּחָשִׁים은 식별이 불확실한 희귀 어휘이므로, POB의 신중한 우회보다 한국어에서는 독자가 상상할 수 있는 재질명으로 옮기되, 전통적·가설적 동물 동일시는 피했습니다.
- source_word: מִלְמָעְלָה
  english_pob_choice: above
  chosen_korean: 그 위에
  alternatives_korean:
  - 위에
  - 위쪽에
  - 그 위쪽에
  lexicon: HALOT
  rationale: 상층 덮개의 위치 관계를 한국어 관용으로 분명히 드러내는 표현입니다.
theological_decisions:
- issue: תְּחָשִׁים의 불확실한 식별을 어떻게 처리할지
  chosen_reading: 확정 가능한 상상적 번역 대신, 본문 기능을 드러내는 재질명으로 옮겼습니다.
  alternative_readings:
  - 바다소 가죽
  - 돌고래 가죽
  - 오소리 가죽
  - fine leather
  rationale: 원문 자체가 희귀어라 단정이 어렵기 때문에, 독자가 본문 기능(덮개 재료)을 이해하도록 하면서도 과도한 추정을 피했습니다.
  doctrine_reference: 본문의 물질 묘사에 관한 번역 신중성
