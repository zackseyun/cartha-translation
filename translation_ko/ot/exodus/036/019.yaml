    text: 히브리어 תְּחָשִׁים의 뜻은 확실하지 않습니다. 가능한 번역으로는 ‘바다소 가죽’, ‘돌고래 가죽’, ‘듀공 가죽’, 전통적으로는 ‘오소리 가죽’ 등이 있습니다.
    reason: lexical_alternative
