  language: ko
  text: 그는 천막을 덮을 붉게 물들인 숫양 가죽 덮개와, 그 위에 놓을 질 좋은 가죽[a] 덮개를 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
