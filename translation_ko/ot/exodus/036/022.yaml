  - marker: b
    text: Or 'joined one opposite another,' emphasizing the matching alignment of the two tenons.
    reason: lexical_alternative
translation:
  language: ko
  text: 각 널판에는 두 개의 촉[a]이 서로 짝을 이루고 있었습니다.[b] 그는 이와 같이 성막의 모든 널판을 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יָדֹת는 문자적으로 ‘손’이지만, 여기서는 널판의 결합을 위한 돌출부, 곧 촉을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘하나가 다른 하나에’입니다. ‘서로 마주하게’로도 옮길 수 있으며, 두 촉의 대응 배치를 나타냅니다.
    reason: lexical_alternative
