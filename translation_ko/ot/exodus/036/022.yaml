  text: שְׁתֵּ֣י יָדֹ֗ת לַ/קֶּ֨רֶשׁ֙ הָֽ/אֶחָ֔ד מְשֻׁלָּבֹ֔ת אַחַ֖ת אֶל אֶחָ֑ת כֵּ֣ן עָשָׂ֔ה לְ/כֹ֖ל קַרְשֵׁ֥י הַ/מִּשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/022.yaml
  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
  footnotes:
  - marker: a
    text: Or 'hands' for 'tenons'; the Hebrew uses the ordinary word for 'hands' metaphorically for the projecting joints of each board.
    reason: lexical_alternative
  - marker: b
    text: Or 'joined one opposite another,' emphasizing the matching alignment of the two tenons.
    reason: lexical_alternative
translation:
  language: ko
  text: 각 널판마다 두 개의 촉이 있어서 서로 맞물리게 했습니다. 이렇게 하여 그는 성막의 모든 널판을 만들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 יָדֹת는 문자적으로는 '손'이지만, 여기서는 널판의 맞물림을 위한 돌출 결합부를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 '서로 마주하게' 또는 '반대편이 되게'로 옮길 수도 있으며, 두 촉의 대응 배치를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֹת
  english_pob_choice: tenons
  chosen_korean: 촉
  alternatives_korean:
  - 손
  - 장부
  - 돌기
  lexicon: HALOT
  rationale: 문맥상 널판을 맞물리게 하는 돌출 결합부를 가리키므로, 직역의 '손'보다 건축 용어인 '촉'이 의미를 더 정확히 살립니다.
- source_word: מְשֻׁלָּבֹת
  english_pob_choice: joined
  chosen_korean: 서로 맞물리게 했습니다
  alternatives_korean:
  - 연결되게 했습니다
  - 결합되게 했습니다
  - 맞대게 했습니다
  lexicon: HALOT
  rationale: 두 촉이 짝을 이루어 결합되는 상태를 나타내므로, 단순한 '연결'보다 맞물림의 구조를 드러내는 표현을 택했습니다.
- source_word: אַחַת אֶל אֶחָת
  english_pob_choice: one to another
  chosen_korean: 서로
  alternatives_korean:
  - 하나가 다른 하나에
  - 서로 마주하게
  - 하나와 하나가
  lexicon: HALOT
  rationale: 두 촉의 대응 관계를 한국어로 자연스럽게 압축해 주며, POB의 'one to another'가 말하는 상호 대응성을 보존합니다.
- source_word: מִשְׁכָּן
  english_pob_choice: tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  - 회막
  lexicon: HALOT
  rationale: 출애굽기 맥락에서 전통적으로 '성막'이 가장 분명한 대응어이므로, 현대 문장 안에서도 식별성이 높은 표현을 유지했습니다.
theological_decisions:
- issue: 서술의 직접성
  chosen_reading: 히브리어의 짧은 공정 서술을 따라 존재문 '있었습니다/있었습니다'를 넣지 않고, '각 널판마다'로 바로 시작했습니다.
  alternative_readings:
  - 각 널판에는 두 개의 촉이 있었습니다
  - 널판마다 두 개의 촉이 있었습니다
  rationale: 원문과 POB 개정이 모두 직설적 서술을 선호하므로, 불필요한 존재문을 피하고 제작 설명의 리듬을 보존했습니다.
  doctrine_reference: 출 36:22의 공정 서술 방식
