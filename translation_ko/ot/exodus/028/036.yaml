base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
  footnotes:
  - marker: a
    text: Or, “Holiness to the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 순금으로 된 패를 만들고, 그 위에 도장에 새기듯이 「야훼께 성결」이라고 새기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「야훼께 거룩함」.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִּיץ
  english_pob_choice: plate
  chosen_korean: 금판
  alternatives_korean:
  - 판
  - 관장식
  - 전면장식
  lexicon: HALOT
  rationale: 이 문맥에서는 대제사장의 터번에 붙는 금 장식이므로, 기능과 재질을 함께 드러내는 ‘금판’이 가장 분명합니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: of pure gold
  chosen_korean: 순금으로 된
  alternatives_korean:
  - 순금의
  - 정금으로 된
  lexicon: HALOT
  rationale: 소유격보다 재질 설명이 자연스럽기 때문에 ‘순금으로 된’으로 옮겨, 금판의 물질과 순도를 함께 살렸습니다.
- source_word: וּפִתַּחְתָּ עָלָיו פִּתּוּחֵי חֹתָם
  english_pob_choice: and engrave on it, like the engraving of a seal
  chosen_korean: 거기에 도장 새기는 것처럼 새겨 넣으십시오
  alternatives_korean:
  - 거기에 인장 무늬처럼 새기십시오
  - 거기에 씰 조각처럼 새기십시오
  lexicon: HALOT
  rationale: 금속에 글자를 새기는 동작이므로 ‘새겨 넣다’가 자연스럽고, 뒤의 ‘도장’은 봉인/인장 새김의 형식을 한국어로 가장 직접적으로 드러냅니다.
- source_word: קֹדֶשׁ לַיהוָה
  english_pob_choice: Holy to Yahweh
  chosen_korean: 야훼께 거룩함
  alternatives_korean:
  - 야훼께 거룩한 것
  - 야훼께 거룩하도다
  lexicon: HALOT
  rationale: 히브리어는 표어처럼 짧은 헌납 문구이므로, 문장형보다 명사구 ‘거룩함’이 더 잘 맞습니다. 또한 POB의 야훼를 따라 신적 이름을 보존했습니다.
theological_decisions:
- issue: קֹדֶשׁ לַיהוָה의 문구를 형용사형으로 풀지, 명사형 표어로 유지할지
  chosen_reading: 「야훼께 거룩함」
  alternative_readings:
  - 「야훼께 거룩한 것」
  - 「야훼께 거룩하다」
  rationale: 이 구절은 제사장 관식에 새길 짧은 헌납문이므로, 한국어에서도 표어성과 절제된 울림을 유지하는 명사구가 원문에 가장 가깝습니다.
  doctrine_reference: Translation philosophy §3 — genuine ambiguity는 해석을 과도하게 평탄화하지 않고 보존
