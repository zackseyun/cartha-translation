    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 너는 … 만들어야 한다
  alternatives_korean:
  - 너는 … 만들어야 합니다
  - 그리고 … 만들라
  lexicon: HALOT
  rationale: 지시문 맥락의 완료형+접속사 형태를 한국어의 의무 표현으로 옮겼습니다. 문맥상 제의 지시이므로 직설적 명령보다 합쇼체 의무형이 자연스럽습니다.
- source_word: עַל הַחֹשֶׁן
  english_pob_choice: on the breastpiece
  chosen_korean: 대제사장의 가슴받이에
  alternatives_korean:
  - 가슴받이에
  - 가슴패에
  lexicon: HALOT
  rationale: חֹשֶׁן은 출애굽기 제의 문맥의 전문 용어이므로 한국어 성경 관용에 맞는 ‘가슴받이’를 택했습니다. ‘대제사장의’는 문맥상 이 장식의 용도와 연결을 분명히 해 줍니다.
- source_word: שַׁרְשֹׁת גַּבְלֻת מַעֲשֵׂה עֲבֹת
  english_pob_choice: chains of pure gold ... braided work like cords
  chosen_korean: 꼬아 만든 밧줄 같은 사슬
  alternatives_korean:
  - 꼰 사슬
  - 밧줄처럼 꼰 사슬
  - 꼬아 엮은 사슬
  lexicon: HALOT
  rationale: 여러 단어가 한데 묶여 사슬의 제작 방식—꼬임, 엮음, 밧줄 같은 모양—을 묘사하므로, 의미를 압축해 ‘꼬아 만든 밧줄 같은 사슬’로 옮겼습니다. 이렇게 하면 기술적 세부와 시각적 이미지를 함께 살릴 수 있습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 순수한 금
  lexicon: HALOT
  rationale: 성막·성물 재료 문맥에서 표준적인 표현인 ‘순금’이 가장 자연스럽고 정확합니다.
theological_decisions:
- issue: 장식품의 위치와 기능을 한국어에서 얼마나 분명히 드러낼지
  chosen_reading: 본문의 עַל הַחֹשֶׁן은 단순한 재료 설명이 아니라 가슴받이에 부착될 사슬을 가리키므로, ‘가슴받이에’로 직접 옮겼습니다.
  alternative_readings:
  - 가슴받이 위에
  - 가슴받이를 위해
  rationale: 제의 제작 지시에서 위치/부착 관계를 흐리면 조립 지시의 힘이 약해집니다. 따라서 관계를 분명히 드러내는 번역을 택했습니다.
  doctrine_reference: 출 28장 성막/제사장 예복 규례
