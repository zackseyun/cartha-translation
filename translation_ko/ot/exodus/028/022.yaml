- from: 그리고 너는 그것을 대제사장의 가슴받이에 만들어야 한다. 곧 순금으로 만든, 꼬아 만든 밧줄 같은 사슬입니다.[a]
  to: 또 너는 가슴받이 위에 순금으로 밧줄처럼 꼰 사슬들을[a] 만들어야 합니다.
  rationale: 불필요하게 보충된 목적어와 직함을 제거하고, 가슴받이와 사슬의 관계, 사슬의 복수, 순금 재료, 밧줄 같은 꼬임의 세공 방식을 보존했습니다. 또한 문장을 현대 표준어 합쇼체로 통일하고 각주 표지를 해당 어구에 직접 연결했습니다.
