  naturalness: 초안은 ‘당신은’이 하나님께 대한 직접 말씀을 옮기는 한국어 성경 문체에 부자연스럽고, ‘내가 지혜의 영으로 채운 사람들입니다’가 관계절에서 독립문으로 분리되어 문장 구조와 의미 연결이 깨집니다. ‘말하십시오’ 및 목적절을 사용하면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘지혜의 영’은 무관사 히브리어 표현의 여지를 보존하며 성령으로 단정하지 않습니다. קדשׁ의 제사장 직분 문맥에는 ‘성별하다’가 ‘거룩하게 하다’보다 정확하고 자연스럽습니다. כהן의 의미는 ‘나를 섬기는 제사장이 되게’로 보존했습니다.
