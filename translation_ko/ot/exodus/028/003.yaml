  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
  footnotes:
  - marker: a
    text: Or 'the Spirit of wisdom.' The Hebrew can denote a divinely given spirit or disposition of wisdom; the main text avoids making the reference more specific than the wording requires.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'wise of heart' or 'wise-hearted,' an idiom for those endowed with skill and understanding.
    reason: lexical_alternative
  - marker: c
    text: Or 'to consecrate him, for him to serve me as priest'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신은 마음이 지혜로운 모든 사람에게 말해야 합니다. 내가 지혜의 영으로 채운 사람들입니다. 그들이 아론의 옷들을 만들어 그를 거룩하게 하여 내게 제사장으로 섬기게 해야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘마음이 지혜로운’ 또는 ‘지혜로운 마음을 가진’이라는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 번역 전통은 이를 ‘지혜의 영’으로 더 구체화합니다. 본문은 원문의 범위를 좁히지 않기 위해 ‘지혜의 영’으로 옮겼습니다.
    reason: theological_note
  - marker: c
    text: ‘거룩하게 하여 내게 제사장으로 섬기게’는 히브리어의 연속된 목적 표현을 자연스럽게 풀어 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: חַכְמֵי לֵב
  english_pob_choice: the wise of heart
  chosen_korean: 마음이 지혜로운 사람들
  alternatives_korean:
  - 마음이 슬기로운 사람들
  - 지혜로운 마음을 가진 사람들
  - 지혜로운 장인들
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기되, 단순한 기술자보다 내적 이해와 숙련을 함께 살리기 위해 ‘마음이 지혜로운’으로 렌더링했습니다.
- source_word: מִלֵּאתִי/ו ר֣וּחַ חָכְמָ֑ה
  english_pob_choice: whom I have filled with a spirit of wisdom
  chosen_korean: 내가 지혜의 영으로 채운 사람들입니다
  alternatives_korean:
  - 내가 지혜의 영으로 채운 이들입니다
  - 내가 지혜를 지닌 영으로 채운 사람들입니다
  - 내가 지혜를 부어 준 사람들입니다
  lexicon: HALOT
  rationale: 무관사 רוּחַ를 반영하여 성령으로 특정하지 않고, 하나님이 주시는 지혜의 내적 역량/성향을 드러내는 표현으로 옮겼습니다.
- source_word: לְקַדְּשׁוֹ
  english_pob_choice: to consecrate him
  chosen_korean: 그를 거룩하게 하여
  alternatives_korean:
  - 그를 성별하여
  - 그를 봉헌하여
  - 그를 성결하게 하여
  lexicon: HALOT
  rationale: 제사장 문맥의 קדשׁ는 직분을 위한 성별·봉헌을 뜻하므로, 현대 한국어에서 의미가 분명한 ‘거룩하게 하여’를 택했습니다.
- source_word: לְכַהֲנ/וֹ לִי
  english_pob_choice: for him to serve me as priest
  chosen_korean: 내게 제사장으로 섬기게 해야 합니다
  alternatives_korean:
  - 내게 제사장으로 봉사하게 해야 합니다
  - 내게 제사장 직분을 맡게 해야 합니다
  - 내게 제사장으로 봉직하게 해야 합니다
  lexicon: HALOT
  rationale: כהן 동사의 ‘제사장으로 봉사하다/섬기다’ 의미를 살려, 목적어 לִי를 하나님께 드리는 봉사의 방향으로 자연스럽게 표현했습니다.
- source_word: וְעָשׂוּ
  english_pob_choice: and they shall make
  chosen_korean: 그들이 만들어야 합니다
  alternatives_korean:
  - 그들이 만들 것입니다
  - 그들이 만들어야 하며
  - 그들이 만들게 될 것입니다
  lexicon: HALOT
  rationale: 지시문맥의 완료형+접속 어미를 한국어의 의무·명령적 문장으로 옮겨, 수행되어야 할 지시의 힘을 유지했습니다.
theological_decisions:
