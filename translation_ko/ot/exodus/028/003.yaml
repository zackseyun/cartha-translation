  rationale: 히브리어는 무관사이며, 문맥은 성전 제작을 위한 하나님이 주시는 지혜/기술에 초점을 두므로, 삼위론적 특정화보다 원문 수준의 여지를 남기는 번역이 더 정확합니다.
  doctrine_reference: 원문 우선 및 신학적 긴장 보존
