revisions:
- from: 당신은 마음이 지혜로운 모든 사람에게 말해야 합니다. 내가 지혜의 영으로 채운 사람들입니다. 그들이 아론의 옷들을 만들어 그를 거룩하게 하여 내게 제사장으로 섬기게 해야 합니다.[a][b][c]
  to: 마음이 지혜로운 모든 사람, 곧 내가 지혜의 영으로 채운 사람들에게 말하십시오.[a][b] 그들이 아론의 옷을 만들어, 그를 성별하여 나를 섬기는 제사장이 되게 하십시오.[c]
  rationale: 관계절을 원문의 수식 관계대로 복구하고, 하나님을 가리키는 불필요한 ‘당신’을 생략했습니다. 아론의 옷 제작이 아론을 성별하여 하나님을 섬기는 제사장으로 세우기 위한 목적임을 한국어 목적절로 명료하게 했습니다. 또한 각주 b를 본문 번역 및 히브리어의 무관사 표현과 일치하도록 고쳤습니다.
