  text: וְ/הָיָ֥ה פִֽי רֹאשׁ֖/וֹ בְּ/תוֹכ֑/וֹ שָׂפָ֡ה יִֽהְיֶה֩ לְ/פִ֨י/ו סָבִ֜יב מַעֲשֵׂ֣ה אֹרֵ֗ג כְּ/פִ֥י תַחְרָ֛א יִֽהְיֶה לּ֖/וֹ לֹ֥א יִקָּרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
  footnotes:
  - marker: a
    text: Or 'like the opening of armor' or 'like the opening of a cuirass.' The Hebrew term תַּחְרָא is rare, and the comparison is to a reinforced neck opening that will resist tearing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것의 머리쪽 구멍은 가운데에 있어야 하며, 그 둘레에는 짜맞춘 가장자리[a]가 있어야 합니다. 그것은 갑옷의 목구멍처럼 되어 있어야 하여, 찢어지지 않아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갑옷의 구멍처럼’ 또는 ‘흉갑의 구멍처럼’으로도 옮길 수 있습니다. 히브리어 תַּחְרָא는 드문 말이며, 찢어짐을 견디는 보강된 목둘레를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  english_pob_choice: its opening for the head
  chosen_korean: 머리쪽 구멍
  alternatives_korean:
  - 머리를 위한 개구부
  - 머리용 구멍
  - 목둘레 구멍
  lexicon: HALOT
  rationale: 의복의 구멍을 가리키는 관용적 표현이므로, 문맥상 자연스럽게 ‘머리쪽 구멍’으로 옮기되 신체 부위를 직접 드러내는 이미지는 유지했습니다.
- source_word: בְּתוֹכוֹ
  english_pob_choice: in the middle of it
  chosen_korean: 가운데에
  alternatives_korean:
  - 그 한가운데에
  - 중앙에
  - 그 속에
  lexicon: HALOT
  rationale: 봉제된 옷의 중심 위치를 가리키므로 간결한 ‘가운데에’가 가장 직접적입니다.
- source_word: שָׂפָה
  english_pob_choice: a woven edge
  chosen_korean: 짜맞춘 가장자리
  alternatives_korean:
  - 짜여 둘러댄 둘레
  - 직조된 가장자리
  - 가장자리
  lexicon: HALOT
  rationale: 이 단어는 단순한 ‘테두리’보다 구멍을 둘러 보강한 가장자리를 가리키므로, 직조된 보강의 느낌을 살려 ‘짜맞춘 가장자리’로 옮겼습니다.
- source_word: כְּפִי תַחְרָא
  english_pob_choice: like the opening of a coat of mail
  chosen_korean: 갑옷의 목구멍처럼
  alternatives_korean:
  - 갑옷의 구멍처럼
  - 갑옷의 목둘레처럼
  - 철갑옷의 구멍처럼
  lexicon: HALOT
  rationale: 희귀어 תַּחְרָא를 POB처럼 방호구의 목 부분 개구부로 이해하여, 찢김을 막는 보강된 목구멍의 이미지를 한국어로 압축했습니다.
theological_decisions:
- issue: 목부위 의복 개구부의 형상과 목적
  chosen_reading: 강화된 목구멍/구멍이 찢어지지 않도록 설계된 의복으로 이해했습니다.
  alternative_readings:
  - 단순한 목둘레 장식
  - 일반적인 옷깃
  rationale: 본문의 초점은 미적 장식이 아니라 구조적 보강에 있으므로, 찢어짐을 막는 기능을 분명히 드러냈습니다.
  doctrine_reference: 출애굽기 28장의 제사장 의복 규례
