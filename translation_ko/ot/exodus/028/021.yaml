  source_fidelity: 초안은 돌의 수, 이스라엘의 아들들의 이름과의 대응, 인장식 새김, 열두 지파와의 관련이라는 핵심 요소를 대체로 보존합니다. 그러나 ‘각기 자기 이름대로’는 돌들이 스스로의 이름을 가진다는 인상을 주어 אִישׁ עַל־שְׁמוֹ의 분배적 관계를 부정확하게 만들 수 있습니다. 또한 ‘열두 지파를 위한 것이어야 합니다’는 한국어로 다소 부자연스럽습니다.
