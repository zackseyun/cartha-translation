id: EXO.28.21
reference: Exodus 28:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
  footnotes:
  - marker: a
    text: Or 'bearing the names of the sons of Israel'; the Hebrew literally says 'the stones shall be upon/according to the names of the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with signet engravings' or 'engraved with the engraving of a seal.'
    reason: lexical_alternative
  - marker: c
    text: '''Sons of Israel'' is the Hebrew expression; some translations render it ''children of Israel'' or ''Israelites.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 돌들은 이스라엘의 아들들의 이름에 따라, 곧 그들의 이름에 따라 열둘이어야 합니다. 그것들은 인장 새김처럼 새겨져야 하며, 각기 자기 이름대로 열두 지파를 위한 것이어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 아들들’은 히브리어 표현을 직접 따른 것입니다. 일부 번역은 ‘이스라엘 자손’ 또는 ‘이스라엘 사람들’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 פִּתּוּחֵי חוֹתָם은 ‘인장 새김’ 또는 ‘도장 새김’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘각기 자기 이름대로’는 돌과 지파 이름의 대응을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: וְהָאֲבָנִים
  english_pob_choice: And the stones
  chosen_korean: 그 돌들은
  alternatives_korean:
  - 그리고 그 돌들은
  - 그 돌들은
  lexicon: HALOT
  rationale: 문맥상 앞 절의 가슴판 돌들을 가리키므로 정관성을 살려 번역했습니다.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת
  english_pob_choice: shall correspond to the names
  chosen_korean: 이름에 따라
  alternatives_korean:
  - 이름 위에
  - 이름에 맞게
  lexicon: HALOT
  rationale: עַל이 단순한 위치가 아니라 대응 관계를 나타내므로, ‘~에 따라’로 관계를 드러냈습니다.
- source_word: פִּתּוּחֵי חוֹתָם
  english_pob_choice: engaged like a signet
  chosen_korean: 인장 새김처럼 새겨져야 하며
  alternatives_korean:
  - 인장 새김으로
  - 도장 새김처럼 새겨져야 하며
  lexicon: HALOT
  rationale: 어근이 가리키는 것은 ‘인장/도장 무늬의 새김’이므로, 명사구의 성격을 살리되 한국어로는 동사형을 보완해 자연스럽게 옮겼습니다.
- source_word: אִישׁ עַל שְׁמוֹ
  english_pob_choice: each with his name
  chosen_korean: 각기 자기 이름대로
  alternatives_korean:
  - 각기 그의 이름으로
  - 각 사람마다 자기 이름을 따라
  lexicon: HALOT
  rationale: 분배적 용법의 אִישׁ을 ‘각기’로 살리고, 주어진 이름과의 대응을 ‘이름대로’로 표현했습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 성중립화 여부
  chosen_reading: 이스라엘의 아들들
  alternative_readings:
  - 이스라엘 자손
  - 이스라엘 사람들
  rationale: 히브리어의 문자적 표현과 POB의 성분명 보존 원칙을 따라 ‘아들들’을 유지했습니다. 문맥상 지파의 조상 표지를 가리키며 성별을 일반화하지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
