  to: 그 돌들은 이스라엘의 아들들의 이름에 따라[a], 그들의 이름을 따라 열두 개가 될 것입니다. 그것들은 인장에 새기는 것처럼 새겨질 것이며[b], 각각 그 이름에 따라[c] 열두 지파를 위한 돌이 될 것입니다.
  rationale: 원문의 반복된 ‘이름에 따라’를 보존하되, ‘자기 이름’의 모호한 재귀 지시를 ‘그 이름’으로 바로잡았습니다. 인장식 새김은 한국어 문장 안에서 자연스러운 동사 표현으로 옮겼고, 마지막 구절은 돌과 열두 지파의 관계를 과도하게 해석하지 않으면서도 자연스럽게 다듬었습니다. 각주 표지는 각각의 관련 어구 뒤로 옮겼습니다.
