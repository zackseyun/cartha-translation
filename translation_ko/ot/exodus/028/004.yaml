  source_fidelity: 히브리어의 의복 목록과 ‘거룩한 옷’을 만들어 아론이 하나님을 위하여 제사장으로 섬기게 한다는 목적은 대체로 반영했습니다. 그러나 אָחִיךָ는 호격식 ‘네 형제’가 아니라 ‘네 형 아론’으로 옮기는 것이 정확하고 자연스럽습니다. 또한 כְתֹנֶת은 현대 한국어에서 속옷/내의로 주로 이해되는 ‘속옷’보다 ‘긴옷’으로 옮기는 편이 적절합니다. לְכַהֲנוֹ의 남성 단수 목적어는 아론을 가리키므로 ‘그가’는 유지하되, 목적 관계를 더 자연스럽게 재구성했습니다.
