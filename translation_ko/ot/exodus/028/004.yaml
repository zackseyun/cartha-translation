  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
  footnotes:
  - marker: a
    text: Or 'breastplate.' The Hebrew term refers to the priestly chest-piece; 'breastpiece' avoids suggesting armor.
    reason: lexical_alternative
  - marker: b
    text: Hebrew ephod, a distinctive priestly garment with no exact English equivalent.
    reason: cultural_note
  - marker: c
    text: Or 'checkered tunic' or 'tunic of checker work'; the Hebrew likely refers to a patterned woven garment.
    reason: lexical_alternative
  - marker: d
    text: Or 'sacred garments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이것들은 그들이 만들어야 할 옷들입니다. 곧 가슴패, 에봇, 겉옷, 무늬 짠 속옷, 관, 띠입니다. 그들은 아론 네 형제와 그의 아들들을 위해 거룩한 옷들을 만들어, 그가 나를 위하여 제사장으로 섬기게 해야 합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가슴패’는 영어 POB의 ‘breastpiece’에 해당하는 제사장용 가슴 장식입니다. ‘흉패’도 가능하지만, 무기와의 혼동을 줄이기 위해 이 번역을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에봇’은 정확히 대응하는 한국어가 없는 제사장용 특수 의복 용어이므로 음역을 유지했습니다.
    reason: cultural_note
  - marker: c
    text: תַּשְׁבֵּץ는 무늬가 들어간 짜임을 뜻하므로, ‘무늬 짠’은 영어 POB의 ‘checkered / woven’ 계열 선택을 반영한 해석적 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘거룩한 옷들’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  english_pob_choice: garments
  chosen_korean: 옷들
  alternatives_korean:
  - 의복들
  - 제의복
  lexicon: HALOT
  rationale: 제사장 복장을 가리키는 일반 명사로는 현대 한국어의 ‘옷들’이 가장 직접적이며, ‘제의복’은 교회 용어를 과도하게 불러올 수 있습니다.
- source_word: חֹשֶׁן
  english_pob_choice: breastpiece
  chosen_korean: 가슴패
  alternatives_korean:
  - 흉패
  - 가슴받이
  lexicon: HALOT
  rationale: 무기인 ‘흉갑’이 아니라 제사장의 가슴 장식을 가리키므로, 기능을 드러내면서도 군사적 오해를 줄이는 ‘가슴패’를 택했습니다.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  english_pob_choice: woven tunic
  chosen_korean: 무늬 짠 속옷
  alternatives_korean:
  - 무늬 짠 긴옷
  - 짜인 무늬옷
  - 체크 무늬 속옷
  lexicon: HALOT
  rationale: כְתֹנֶת은 몸에 입는 속옷/속옷형 옷을 뜻하고, תַּשְׁבֵּץ는 짜 맞춘 무늬가 있는 직물을 가리키므로, ‘무늬 짠 속옷’이 재질과 형태를 함께 살립니다.
- source_word: מִצְנֶפֶת
  english_pob_choice: turban
  chosen_korean: 관
  alternatives_korean:
  - 터번
  - 머리수건
  lexicon: HALOT
  rationale: 제사장 머리쓰개를 가리키는 전통적 한국어 성경어인 ‘관’이 가장 간결하며, 현대어 ‘터번’은 문화적으로 지나치게 이국적일 수 있습니다.
- source_word: לְכַהֲנוֹ לִי
  english_pob_choice: for him to serve as priest to me
  chosen_korean: 그가 나를 위하여 제사장으로 섬기게
  alternatives_korean:
  - 그가 나를 섬기는 제사장이 되게
  - 그가 나를 위하여 제사장 직분을 맡게
  lexicon: HALOT
  rationale: 목적을 나타내는 לְ + infinitive를 한국어의 ‘-게’로 옮겨, 아론과 아들들의 옷이 제사장 직무 수행을 위한 것임을 분명히 했습니다.
theological_decisions:
- issue: 거룩한 옷의 용어를 교회 전통어로 좁힐지 여부
  chosen_reading: ‘거룩한 옷들’로 직역해 제의적 거룩함을 유지했습니다.
  alternative_readings:
  - 제의복
  - 성의
  rationale: 본문은 성막 제사장의 의복을 규정하는 문맥이므로, 교회 예전어보다 원문의 거룩함 표지를 직접 드러내는 표현이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; cultic specificity.'
- issue: 남성 후손 표기의 성별 정확성
  chosen_reading: וּלְבָנָיו를 ‘그의 아들들’로 옮겼습니다.
  alternative_readings:
  - 그의 자녀들
  - 그의 후손들
  rationale: 히브리어는 아론의 남성 후손, 곧 제사장 직분의 계승자를 가리키므로 성별을 중화하지 않았습니다.
  doctrine_reference: Gender-accurate translation over neutralization.
