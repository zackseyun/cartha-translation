base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/010.yaml
  text: six of their names on the one stone[a], and the names of the remaining six on the second stone, according to their birth order.
  footnotes:
  - marker: a
    text: Or "according to their birth order"; the Hebrew phrase can refer to genealogical descent or the order arising from it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 이름 여섯을 그 한 돌 위에, 남은 여섯 이름은 둘째 돌 위에, 그들의 출생 순서대로 새기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 출생 순서대로’; 히브리어 표현은 계보적 내림차순이나 그에 따른 순서를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁשָּׁה / שְׁמֹתָם
  english_pob_choice: six of their names
  chosen_korean: 그들의 이름 여섯
  alternatives_korean:
  - 그 이름들 가운데 여섯
  - 그들의 이름 중 여섯
  lexicon: HALOT
  rationale: 히브리어의 부분적 표현을 따라 이름 전체 가운데 여섯을 가리키므로, 한국어도 ‘그들의 이름 여섯’으로 간결하게 옮겼습니다.
- source_word: עַל הָאֶבֶן הָאֶחָת
  english_pob_choice: on the one stone
  chosen_korean: 그 한 돌 위에
  alternatives_korean:
  - 첫째 돌 위에
  - 한 돌 위에
  lexicon: HALOT
  rationale: הָאֶחָת는 단순히 ‘하나의/그 한’ 돌을 가리키므로, 뒤의 ‘둘째 돌’과 짝을 이루게 ‘그 한 돌’로 옮겼습니다.
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  english_pob_choice: the remaining six
  chosen_korean: 남은 여섯 이름은
  alternatives_korean:
  - 남은 여섯은
  - 나머지 여섯 이름은
  lexicon: HALOT
  rationale: ‘남은’은 נוֹתָרִים의 남아 있는/남은 뜻을 자연스럽게 살리고, 문맥상 역시 이름들이므로 ‘이름은’을 보충해 의미를 분명히 했습니다.
- source_word: כְּתוֹלְדֹתָם
  english_pob_choice: according to their birth order
  chosen_korean: 그들의 출생 순서대로
  alternatives_korean:
  - 그들의 نسل대로
  - 그들의 계보대로
  - 그들의 세대에 따라
  lexicon: HALOT
  rationale: תּוֹלְדוֹת는 일반적으로 ‘계보/세대들’이지만, 여기서는 열두 아들의 이름 배열을 지시하므로 POB의 판정에 따라 ‘출생 순서’가 가장 정확하게 뜻을 드러냅니다.
theological_decisions:
- issue: 돌에 이름을 새기는 지시문의 서술형/명령형 처리
  chosen_reading: 한국어는 제사장 옷 규정의 지시문 톤을 살려 명령형 ‘새기십시오’로 옮겼습니다.
  alternative_readings:
  - 새겨야 합니다
  - 새길 것입니다
  rationale: 히브리어 지시문은 규정 문맥에서 실천 지시의 성격이 강하므로, 합쇼체 명령형이 가장 자연스럽고 원문 기능도 잘 보존합니다.
  doctrine_reference: 출애굽기 28장 제사장 의복 규례
