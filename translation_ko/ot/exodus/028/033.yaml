source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ עַל שׁוּלָ֗י/ו רִמֹּנֵי֙ תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י עַל שׁוּלָ֖י/ו סָבִ֑יב וּ/פַעֲמֹנֵ֥י זָהָ֛ב בְּ/תוֹכָ֖/ם סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
  footnotes:
  - marker: a
    text: Or 'pomegranate-shaped ornaments.' The Hebrew literally says 'pomegranates.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 옷자락 둘레에 푸른 실과 자주색 실과 주홍색 실로 석류들을 만들고, 그 사이사이에 금 방울들을 둘러 달아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘석류들’이라고 말합니다. 이 문맥에서는 석류 모양 장식물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: You shall make
  chosen_korean: 달아야 합니다
  alternatives_korean:
  - 만들어야 합니다
  - 만드십시오
  lexicon: HALOT
  rationale: 장식품을 옷자락에 부착하는 문맥이므로, 결과물의 제작보다 배치 행위를 드러내는 ‘달아야 합니다’가 자연스럽습니다.
- source_word: שׁוּלָיו
  english_pob_choice: its hem
  chosen_korean: 그 옷자락
  alternatives_korean:
  - 그 가장자리
  - 그 단
  lexicon: HALOT
  rationale: 의복의 아래 가장자리를 가리키는 말이므로, 현대 한국어에서 가장 직접적인 ‘옷자락’으로 옮겼습니다.
- source_word: רִמֹּנֵי
  english_pob_choice: pomegranates
  chosen_korean: 석류들
  alternatives_korean:
  - 석류 모양 장식들
  - 석류 장식들
  lexicon: HALOT
  rationale: 히브리어가 문자적으로 ‘석류들’이라고 말하므로 본문은 그 표현을 유지하고, 장식물임은 문맥이 드러내도록 했습니다.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  english_pob_choice: blue and purple and scarlet yarn
  chosen_korean: 푸른 실과 자주색 실과 붉은색 실
  alternatives_korean:
  - 청색 실과 자주색 실과 주홍색 실
  - 푸른 실과 보라색 실과 진홍색 실
  lexicon: HALOT
  rationale: 성막 직물의 색/재료 표지를 한국어로 자연스럽게 풀어, 색감과 직물성을 함께 드러냈습니다.
- source_word: בְּתוֹכָם
  english_pob_choice: between them
  chosen_korean: 그 사이사이에
  alternatives_korean:
  - 그들 사이에
  - 그 가운데에
  lexicon: HALOT
  rationale: 석류와 방울이 교대로 배열되는 공간 관계를 ‘사이사이에’로 가장 분명하게 표현했습니다.
theological_decisions:
- issue: 의복 장식의 반복 배치 표현
  chosen_reading: ‘둘레에 … 그 사이사이에 … 둘러 달아야 합니다’로, 원문의 원형적 반복성과 장식의 규칙성을 살렸습니다.
  alternative_readings:
  - ‘둘레에 … 가운데 두어야 합니다’
  - ‘주변에 … 배치해야 합니다’
  rationale: 본문은 단순 장식 설명이 아니라 성막 예복의 질서 있는 배치를 강조하므로, 반복 어휘를 살려 구조감을 유지했습니다.
  doctrine_reference: 출애굽기 28장의 제사장 예복 규례
- issue: 석류를 장식물로 직역할지 여부
  chosen_reading: 본문 표면어 그대로 ‘석류들’을 두고, 해석은 주석 여지로 남겼습니다.
  alternative_readings:
  - ‘석류 모양 장식들’로 의역
  - ‘석류 장식’으로 축약
  rationale: 히브리어가 실제로 석류를 가리키는 단어를 사용하므로, 문맥상 장식 기능이 있더라도 본문 차원의 어휘는 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 원문 어휘 보존 원칙
