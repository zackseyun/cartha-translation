  verdict: revise
  source_fidelity: 원문은 옷자락 둘레에 세 색의 실로 ‘석류들’을 만들고, 그 가운데에 금 방울들을 둘러 배치하라고 명합니다. 초안의 ‘달고’는 부착 행위만 부각하여 석류들을 만드는 행위를 충분히 드러내지 못합니다. 이를 ‘만들고’로 바로잡아 제작과 배치의 순서를 보존했습니다.
  naturalness: ‘금방울’보다는 ‘금 방울’이 구성 관계를 더 투명하게 보여 주며, ‘둘러 달다’는 반복 배치의 뜻을 자연스럽게 전달합니다. 문두의 ‘그리고’는 원문의 접속을 기계적으로 옮긴 느낌이 있어 생략했습니다.
  terminology: תּוֹלַעַת שָׁנִי는 일반적인 ‘붉은색’보다 구체적인 ‘주홍색’으로 옮겨 scarlet의 색채를 반영했습니다. ‘석류들’은 원문의 표면 어휘를 유지하며, 장식물일 가능성은 각주로 보존합니다.
