- from: 그들은 예언판의 우림과 둠밈을 넣고, 그것들이 아론의 가슴 위에 있어 그가 야훼 앞에 들어갈 때마다 있게 하십시오. 아론은 야훼 앞에서 이스라엘 자손의 판결을 늘 그의 가슴에 메어야 합니다.[a][b]
  to: 당신은 우림과 둠밈을 판결의 가슴판[a] 안에 넣으십시오. 그것들은 아론이 야훼 앞에 들어갈 때 그의 가슴 위에 있게 될 것입니다. 아론은 야훼 앞에서 이스라엘 자손의 판결을 그의 가슴에 지니고 항상 있어야 합니다.
  rationale: 원문의 단수 명령, 가슴판의 물리적 지시, מִשְׁפָּט의 어휘 반복, 그리고 마지막의 지속성을 보존하도록 고쳤습니다. 우림과 둠밈은 불확실한 기술 용어이므로 음역을 유지했고, ‘예언’이라는 해석적 의미 추가를 제거했습니다. 각주 표지는 해당 용어 바로 뒤에 배치했습니다.
