source:
  edition: WLC
  text: וְ/נָתַתָּ֞ אֶל חֹ֣שֶׁן הַ/מִּשְׁפָּ֗ט אֶת הָ/אוּרִים֙ וְ/אֶת הַ/תֻּמִּ֔ים וְ/הָיוּ֙ עַל לֵ֣ב אַהֲרֹ֔ן בְּ/בֹא֖/וֹ לִ/פְנֵ֣י יְהוָ֑ה וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת מִשְׁפַּ֨ט בְּנֵי יִשְׂרָאֵ֧ל עַל לִבּ֛/וֹ לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
  footnotes:
  - marker: a
    text: Urim and Thummim are the Hebrew names of sacred objects associated with priestly judgment; their exact form and operation are uncertain. Possible etymological renderings include 'lights' and 'perfections.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the breastpiece for decision' / 'the breastpiece of justice.' The Hebrew word מִשְׁפָּט can denote judgment, decision, or justice depending on context.
    reason: alternative_reading
  - marker: c
    text: '''The sons of Israel'' is the Hebrew expression; it refers to the covenant people of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 예언판의 우림과 둠밈을 넣고, 그것들이 아론의 가슴 위에 있어 그가 야훼 앞에 들어갈 때마다 있게 하십시오. 아론은 야훼 앞에서 이스라엘 자손의 판결을 늘 그의 가슴에 메어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예언판’은 제사장 가슴판의 기능을 드러내기 위한 번역입니다. 히브리어는 문자적으로는 ‘판결의 가슴판’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘들어갈 때마다’는 히브리어의 반복적 상황을 한국어로 자연스럽게 풀어 옮긴 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  english_pob_choice: the breastpiece of judgment
  chosen_korean: 예언판
  alternatives_korean:
  - 판결판
  - 심판 흉패
  - 결정판
  lexicon: HALOT
  rationale: חֹשֶׁן은 제사장 가슴판을 가리키며, מִשְׁפָּט을 ‘판결’로 살려 우림과 둠밈과 연결되는 사법·분별 기능을 드러내기 위해 ‘예언판’으로 옮겼습니다.
- source_word: הָאוּרִים / הַתֻּמִּים
  english_pob_choice: the Urim / the Thummim
  chosen_korean: 우림 / 둠밈
  alternatives_korean:
  - 빛들 / 완전함들
  - 우림과 둠밈
  lexicon: HALOT
  rationale: 정확한 형태와 기능이 확정되지 않은 기술 용어이므로 의미 번역보다 음역을 택해, 본문의 불확실성을 유지했습니다.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  english_pob_choice: when he goes in before Yahweh
  chosen_korean: 그가 야훼 앞에 들어갈 때마다
  alternatives_korean:
  - 그가 야훼 앞에 들어갈 때
  - 그가 야훼 앞에 나아갈 때
  lexicon: HALOT
  rationale: 제사장이 성소에 들어가는 반복적 상황을 나타내므로, 문맥상 자연스러운 ‘들어갈 때마다’로 처리해 지속성을 드러냈습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 관용적 언약 표현을 살려 ‘이스라엘 자손’으로 번역했고, 영어 POB의 성별-정확성 취지를 반영했습니다.
- source_word: מִשְׁפַּט
  english_pob_choice: judgment
  chosen_korean: 판결
  alternatives_korean:
  - 판정
  - 심판
  - 결정
  lexicon: HALOT
  rationale: 같은 어근이 앞의 ‘예언판’과 뒤의 아론이 메는 대상에 반복되므로, 법정적·신탁적 의미를 살린 ‘판결’이 가장 일관됩니다.
theological_decisions:
- issue: 우림과 둠밈의 처리
  chosen_reading: 음역을 유지하여 특정 제의 도구의 불확정성을 보존했습니다.
  alternative_readings:
  - ‘빛들’과 ‘완전함들’로 의미 번역
  - 설명적 의역
  rationale: 사물의 정확한 본질이 불확실하므로, 번역이 해석을 과도하게 고정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: יְהוָה의 번역
  chosen_reading: ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 신적 고유명을 가리고 칭호로 대체하기보다, 이 본문이 드러내는 언약적 인격성을 보존하기 위해 고유명 표기를 택했습니다.
  doctrine_reference: POB divine-name policy
- issue: מִשְׁפָּט의 의미 범위
  chosen_reading: 두 번 모두 ‘판결’로 옮겨 반복을 유지했습니다.
  alternative_readings:
  - 결정
  - 정의
  - 심판
  rationale: 이 절에서는 우림과 둠밈을 통한 제의적 판결/분별의 맥락이 강하므로, 단순한 ‘결정’보다 판결성을 드러내는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §5
