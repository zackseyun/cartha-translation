  text: 그들은 금, 청색 실, 자색 실, 홍색 실, 그리고 곱게 꼰 아마실로, 무늬를 짜는 숙련된 장인의 솜씨에 따라 에봇을 만들어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 단순히 ‘금’이라고 말하지만, 제작 맥락상 금을 직물에 넣어 가공한 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 ‘디자이너의 작품’ 또는 ‘숙련된 장인의 작품’으로도 옮길 수 있으며, 무늬를 짜 넣는 예술적 제작을 뜻합니다.
    reason: lexical_alternative
