  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
  footnotes:
  - marker: a
    text: Or 'gold thread'; the Hebrew text says simply 'gold,' though in this manufacturing context it may refer to gold worked into the fabric.
    reason: lexical_alternative
  - marker: b
    text: Or 'the work of a designer' or 'skillful craftsman'; the Hebrew expression refers to artistic, patterned workmanship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 금과 청색과 자색과 홍색 실과 가늘게 꼰 아마실로 에봇을 만들어야 합니다. 이것은 정교한 장인의 작품입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 단순히 ‘금’이라고 말하지만, 제작 맥락상 금을 직물에 넣어 가공한 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 ‘디자이너의 작품’ 또는 ‘숙련된 장인의 작품’으로 옮길 수 있으며, 무늬를 짜 넣는 예술적 제작을 뜻합니다.
    reason: lexical_alternative
