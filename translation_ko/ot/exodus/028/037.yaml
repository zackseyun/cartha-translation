id: EXO.28.37
reference: Exodus 28:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֤ אֹת/וֹ֙ עַל פְּתִ֣יל תְּכֵ֔לֶת וְ/הָיָ֖ה עַל הַ/מִּצְנָ֑פֶת אֶל מ֥וּל פְּנֵֽי הַ/מִּצְנֶ֖פֶת יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/037.yaml
  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
  footnotes:
  - marker: a
    text: Or 'thread' or 'string' of blue.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase literally indicates placement 'toward/opposite the front of the turban,' that is, on its front side.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 파란 끈[a]에 달아야 합니다. 그것은 관모 위에 있어야 하며, 관모의 앞쪽[b]에 있어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파란 실’ 또는 ‘파란 줄’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 문자적으로 ‘관모의 앞면을 향하여’라는 뜻으로, 관모의 앞면에 두라는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  english_pob_choice: And you shall put it
  chosen_korean: 그것을 달아야 합니다
  alternatives_korean:
  - 그것을 두어야 합니다
  - 그것을 놓아야 합니다
  lexicon: HALOT
  rationale: שׂים은 기본적으로 ‘두다/놓다’이지만, 여기서는 끈에 매어 부착하는 맥락이므로 ‘달다’가 한국어로 기능을 더 정확히 드러냅니다.
- source_word: פְּתִיל תְּכֵלֶת
  english_pob_choice: a cord of blue
  chosen_korean: 파란색 끈
  alternatives_korean:
  - 푸른 끈
  - 파란 끈
  - 파란 실
  lexicon: HALOT
  rationale: פְּתִיל은 고정용 끈/실을 가리키므로 ‘끈’이 자연스럽고, תְּכֵלֶת은 예배 물품의 특수한 청색을 가리키지만 여기서는 의미를 분명히 하기 위해 ‘파란색’으로 옮겼습니다.
- source_word: הַמִּצְנָפֶת
  english_pob_choice: the turban
  chosen_korean: 관모
  alternatives_korean:
  - 터번
  - 머리수건
  - 두건
  lexicon: HALOT
  rationale: מִצְנֶפֶת은 대제사장의 머리장식을 가리키므로, 한국어 성서 맥락에서 익숙한 ‘관모’가 기능상 적절합니다.
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת
  english_pob_choice: at the front of the turban
  chosen_korean: 관모의 앞쪽에
  alternatives_korean:
  - 관모의 앞면에
  - 관모 앞에
  - 관모의 정면에
  lexicon: HALOT
  rationale: אֶל מוּל פְּנֵי는 단순한 ‘옆에’가 아니라 전면을 향한 위치를 나타내므로, 중복을 피하면서도 방향성을 살린 ‘앞쪽에’로 옮겼습니다.
theological_decisions:
- issue: 반복되는 위치 지시문의 처리
  chosen_reading: 마지막 יִהְיֶה를 ‘있어야 합니다’로 한 번 더 살려, 단순 반복이 아니라 최종 위치 규정을 강조하는 문장으로 보존했습니다.
  alternative_readings:
  - 마지막 구절을 생략하거나 한 문장으로 압축하기
  - ‘있습니다’로 평서화하기
  rationale: 히브리어는 위치 지시를 반복하여 강조하므로, 한국어에서도 반복을 유지해 규정의 엄밀함을 드러내는 편이 원문 효과에 가깝습니다.
  doctrine_reference: 출애굽기 28장의 제의 규정과 대제사장 복식의 정확성
- issue: 푸른색의 색채 표현
  chosen_reading: ‘תְּכֵלֶת’을 전통 용어 대신 ‘파란색’으로 옮겼습니다.
  alternative_readings:
  - ‘청색’으로 옮기기
  - ‘푸른색’으로 옮기기
  rationale: 특수 직물색을 가리키는 용례이지만, 이 절에서는 색의 식별이 핵심이므로 현대 독자가 즉시 이해할 수 있는 표현을 우선했습니다.
  doctrine_reference: 성막/제사장 복식의 지시가 이해 가능하게 전달되어야 한다는 번역 원칙
