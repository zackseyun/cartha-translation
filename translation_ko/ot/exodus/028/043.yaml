  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיוּ֩ עַל אַהֲרֹ֨ן וְ/עַל בָּנָ֜י/ו בְּ/בֹאָ֣/ם אֶל אֹ֣הֶל מוֹעֵ֗ד א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ וְ/לֹא יִשְׂא֥וּ עָוֺ֖ן וָ/מֵ֑תוּ חֻקַּ֥ת עוֹלָ֛ם ל֖/וֹ וּ/לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
  footnotes:
  - marker: a
    text: Or 'incur guilt'; Hebrew 'bear guilt' is a legal-cultic idiom.
    reason: lexical_alternative
  - marker: b
    text: Or 'a perpetual statute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들은 아론과 그의 아들들 위에 있어야 합니다. 그들이 회막에 들어갈 때나 제단에 가까이 나아가 거룩한 곳에서 섬길 때, 죄책을 지어 죽지 않게 하려는 것입니다. 그것은 그와 그의 후손에게 영원한 규례입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죄책을 지다’. 히브리어 ‘죄책을 지다’는 법적-제의적 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영구한 규례’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל
  english_pob_choice: And they shall be on
  chosen_korean: 그것들은 … 위에 있어야 합니다
  alternatives_korean:
  - 그것들은 … 위에 있을 것입니다
  - 그것들은 … 위에 있어야 한다
  lexicon: HALOT
  rationale: 제사장의 옷을 ‘입은 상태로 위에 있다’는 의미를 자연스럽게 살리기 위해 ‘위에 있어야 합니다’로 옮겼습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: HALOT
  rationale: 출애굽기 제의 문맥에서 확립된 용례를 따라 ‘회막’을 사용했습니다.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  english_pob_choice: to minister in the holy place
  chosen_korean: 거룩한 곳에서 섬길 때
  alternatives_korean:
  - 성소에서 봉사할 때
  - 거룩한 곳에서 직무를 수행할 때
  lexicon: HALOT
  rationale: שׁרת의 제의적 기능을 ‘섬기다’로 살리고, בַּקֹּדֶשׁ는 문맥상 ‘거룩한 곳’으로 옮겨 성소적 거룩을 드러냈습니다.
- source_word: וְלֹא יִשְׂאוּ עָוֺן וָמֵתוּ
  english_pob_choice: so that they may not bear guilt and die
  chosen_korean: 죄책을 지어 죽지 않게 하려는 것입니다
  alternatives_korean:
  - 죄책을 지고 죽지 않게 하려는 것입니다
  - 죄를 담당하고 죽지 않게 하려는 것입니다
  lexicon: HALOT
  rationale: נשׂא עון의 법적-제의적 관용구를 ‘죄책을 지다’로 옮겨, 단순한 도덕적 잘못보다 책임/유책의 뉘앙스를 살렸습니다.
- source_word: חֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영구한 규례
  - 항구한 규례
  lexicon: HALOT
  rationale: 법적 규정의 지속성을 한국어 성경 문체에 맞게 간결하게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 제사장 옷의 목적과 죽음 경고의 강도
  chosen_reading: 제사장의 옷은 거룩한 영역에 접근하는 제의 행위에서 죄책과 죽음을 피하게 하는 실제적 보호 장치로 제시됩니다.
  alternative_readings:
  - 단순히 예식상 단정함을 위한 규정으로 완화할 수 있습니다.
  - 죄책을 지어 죽는다는 표현을 상징적 경고로만 약화시킬 수 있습니다.
  rationale: 본문은 거룩하신 하나님 앞에서의 접근이 실제 유책과 죽음의 위험을 동반한다고 말하므로, 그 긴장을 완화하지 않고 보존했습니다.
  doctrine_reference: 거룩함과 심판의 긴장 보존
