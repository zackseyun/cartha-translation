  source_fidelity: 수정이 필요합니다. 초안의 ‘죄책을 지어’는 נשׂא עָוֺן(‘죄책을 지다/부담하다’)보다 ‘죄책을 초래하다’에 가까워 관용구의 법적·제의적 의미를 바꿉니다. 또한 목적 절은 의복의 필수성을 분명히 하면서 ‘죄책을 지고 죽다’라는 결과를 그대로 보존해야 합니다.
  naturalness: ‘그들이 … 죽지 않게 하려는 것입니다’는 문장 성분이 불완전하고, 앞의 의복 규정과의 연결도 약합니다. ‘… 죽지 않도록 해야 합니다’로 고치면 현대 표준어 합쇼체로 자연스럽고 규정문의 명령적 성격도 드러납니다. 제의 공간을 가리키는 בַּקֹּדֶשׁ는 이 문맥에서 ‘성소’가 더 자연스럽고 명료합니다.
  terminology: ‘회막’, ‘제단’, ‘성소’, ‘규례’는 출애굽기 제의 문맥에 적합합니다. ‘그의 후손’은 זַרְעוֹ의 집합적 단수 의미를 잘 반영합니다. 각주 표지는 해당 어구에 직접 붙여야 하며, 현 초안처럼 문장 끝에 함께 두면 각주의 대상이 불명확합니다.
