    issue: '''수놓은 띠'' is lexically too specific.'
    rationale: The Hebrew חֵשֶׁב identifies the ephod's specially made band/binding piece; it does not specifically say that it is embroidered.
  - severity: medium
    issue: The locative sequence is syntactically unclear in Korean.
    rationale: The Hebrew describes the rings as lower down, toward the front, aligned with the joining, and above the ephod's band. The revision makes each relation readable while preserving them.
