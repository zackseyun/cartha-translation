  text: וְ/נָתַתָּ֗ה אֶת שְׁתֵּי֙ עֲבֹתֹ֣ת הַ/זָּהָ֔ב עַל שְׁתֵּ֖י הַ/טַּבָּעֹ֑ת אֶל קְצ֖וֹת הַ/חֹֽשֶׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/024.yaml
  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
  footnotes:
  - marker: a
    text: Or 'twisted chains' or the traditional 'wreathen chains.'
    reason: lexical_alternative
  - marker: b
    text: Traditional English versions often read 'breastplate'; Hebrew חֹשֶׁן here refers to the priestly breastpiece.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 흉패[b]의 양 끝에 있는 두 고리에 금으로 만든 두 꼰 사슬[a]을 달아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘꼰 사슬’은 히브리어 עֲבֹתֹת를 옮긴 말입니다. ‘엮은 사슬’ 또는 ‘꼬인 사슬’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘흉패’는 전통적인 교회 용어입니다. 히브리어 חֹשֶׁן은 제사장 예복의 가슴에 다는 물건을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  english_pob_choice: And you shall put
  chosen_korean: 두어야 합니다
  alternatives_korean:
  - 놓아야 합니다
  - 두어야 합니다
  lexicon: WLC
  rationale: 지시문맥의 완료형 연속 구조를 한국어의 명령적 미래로 옮겼습니다. 장식품을 정해진 위치에 배치하는 뜻이므로 자연스러운 표준어로는 ‘두다’가 적절합니다.
- source_word: עֲבֹתֹת
  english_pob_choice: braided chains
  chosen_korean: 꼬인 사슬
  alternatives_korean:
  - 엮은 사슬
  - 뒤얽은 사슬
  - 꼰 사슬
  lexicon: HALOT
  rationale: 금으로 된 장식 사슬의 꼬임·엮임을 살리되, 한국어에서 너무 옛말인 ‘두른 사슬’류를 피하고 의미가 분명한 ‘꼬인 사슬’로 옮겼습니다.
- source_word: הַחֹשֶׁן
  english_pob_choice: breastpiece
  chosen_korean: 흉패
  alternatives_korean:
  - 가슴장식
  - 가슴받이
  lexicon: HALOT
  rationale: 이 항목은 전통적으로 ‘흉패’로 굳어져 있고, 본문이 갑옷이 아니라 제사장 예복의 장식판을 가리키므로 그 용례를 유지했습니다.
- source_word: הַזָּהָב
  english_pob_choice: of gold
  chosen_korean: 금으로 된
  alternatives_korean:
  - 금의
  - 금빛의
  lexicon: HALOT
  rationale: 재료를 명확히 드러내기 위해 ‘금으로 된’으로 풀었습니다. 한국어에서 가장 자연스럽고 본문 기능도 분명합니다.
