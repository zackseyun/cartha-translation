source:
  edition: WLC
  text: וְ/חֵ֤שֶׁב אֲפֻדָּת/וֹ֙ אֲשֶׁ֣ר עָלָ֔י/ו כְּ/מַעֲשֵׂ֖/הוּ מִמֶּ֣/נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
  footnotes:
  - marker: a
    text: Or 'of the same workmanship as it; from it it shall be'—the Hebrew emphasizes that the band was to match the ephod's workmanship and be made integrally with it, not as a separate piece.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'blue, purple, and scarlet' refers to dyed textile materials used in the tabernacle and priestly garments.
    reason: cultural_note
translation:
  language: ko
  text: '그의 에봇의 skillfully woven band[a], 곧 그 위에 있는 것으로서, 그와 같은 방식으로 만들어져야 하며, 그와 하나의 작품이어야 합니다: 금, 파랑, 자주, 붉은 실[b], 그리고 꼰 가는 베.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 같은 제작 방식으로, 그에게서 나온 것’이라는 뜻입니다. 히브리어는 띠가 에봇과 같은 솜씨로 만들어져 별도의 조각이 아니라는 점을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘파랑, 자주, 붉은’은 성막과 제사장 의복에 쓰인 염색 직물을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב
  english_pob_choice: skillfully woven band
  chosen_korean: skillfully woven band
  alternatives_korean:
  - 짠 띠
  - 무늬 띤 띠
  - 기교 있게 짠 띠
  lexicon: HALOT
  rationale: 제사장 복식 맥락에서 חֵשֶׁב은 단순한 ‘띠’가 아니라 짜임새와 기술이 드러나는 직물 부품을 가리키므로, POB의 핵심 의미를 따라 직조의 정교함을 살린 표현이 필요합니다.
- source_word: כְּמַעֲשֵׂהוּ / מִמֶּנּוּ יִהְיֶה
  english_pob_choice: like its workmanship, of one piece with it
  chosen_korean: 그와 같은 방식으로 만들어져야 하며, 그와 하나의 작품이어야 합니다
  alternatives_korean:
  - 그의 솜씨와 같아야 하며, 그와 한 덩어리여야 합니다
  - 그와 같은 작업으로 되어야 하며, 그와 분리되지 않아야 합니다
  lexicon: HALOT
  rationale: 히브리어는 ‘작품/제작 방식의 일치’와 ‘그것으로부터 나와 한 몸처럼 이루어짐’을 함께 강조하므로, 한국어에서도 분리된 부속물이 아니라 통합 제작물이라는 점을 드러냈습니다.
- source_word: תְּכֵלֶת / אַרְגָּמָן / תּוֹלַעַת שָׁנִי
  english_pob_choice: blue, purple, and scarlet yarn
  chosen_korean: 파랑, 자주, 붉은 실
  alternatives_korean:
  - 푸른색, 자주색, 붉은 실
  - 청색, 자색, 홍색 실
  lexicon: HALOT
  rationale: 성막 재료 목록의 색채 용어를 현대 독자가 이해할 수 있게 기본 색명으로 옮기되, 영어 POB처럼 직물 재료 맥락을 유지하기 위해 ‘실’을 붙였습니다.
- source_word: שֵׁשׁ מָשְׁזָר
  english_pob_choice: fine twisted linen
  chosen_korean: 꼰 가는 베
  alternatives_korean:
  - 가는 꼰 베
  - 세밀히 꼰 베
  - 고운 꼰 베
  lexicon: HALOT
  rationale: שֵׁשׁ은 고급 아마포/베를 가리키며 מָשְׁזָר는 꼬아 만든 실감을 더하므로, 문어체 한국어에서 자연스러운 ‘꼰 가는 베’로 압축했습니다.
theological_decisions:
- issue: 에봇 부속품의 구조적 일체성
  chosen_reading: 띠를 에봇의 별도 장식이 아니라 에봇과 하나의 작품으로 번역했습니다.
  alternative_readings:
  - 그와 맞는 장식띠로 번역하기
  - 단순히 에봇 위에 있는 띠로 번역하기
  rationale: 본문은 제작 방식의 동일성과 재료의 일체성을 강조하므로, 성소 복식의 구성 요소가 분리된 부품이 아니라 통합된 제작물임을 살렸습니다.
  doctrine_reference: 출애굽기 28장 제사장 의복의 거룩한 질서와 정결성
