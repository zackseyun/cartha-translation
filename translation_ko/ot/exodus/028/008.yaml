  naturalness: ‘그의 에봇의 skillfully woven band’, ‘그와 하나의 작품’ 및 ‘꼰 가는 베’는 현대 표준 한국어로 부자연스럽거나 불명확합니다. ‘에봇 위에 있는 정교하게 짠 띠’, ‘에봇과 한데 짜여져야 합니다’, ‘가늘게 꼰 베실’로 고쳤습니다. 합쇼체의 지시문 형식도 유지했습니다.
  terminology: ‘에봇’은 통용되는 음역으로 유지했습니다. חֵשֶׁב은 ‘정교하게 짠 띠’로, תְּכֵלֶת·אַרְגָּמָן·תּוֹלַעַת שָׁנִי는 각각 ‘청색 실, 자주색 실, 주홍색 실’로 옮겼습니다. שֵׁשׁ מָשְׁזָר는 섬유의 꼬임과 고운 재질을 반영해 ‘가늘게 꼰 베실’로 옮겼습니다.
