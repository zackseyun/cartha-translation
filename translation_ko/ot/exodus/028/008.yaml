- source_word: תְּכֵלֶת / אַרְגָּמָן / תּוֹלַעַת שָׁנִי
  english_pob_choice: blue, purple, and scarlet yarn
  chosen_korean: 파랑, 자주, 붉은 실
  alternatives_korean:
