  - 청색, 자색, 홍색 실
  lexicon: HALOT
  rationale: 성막 재료 목록의 색채 용어를 현대 독자가 이해할 수 있게 기본 색명으로 옮기되, 영어 POB처럼 직물 재료 맥락을 유지하기 위해 ‘실’을 붙였습니다.
