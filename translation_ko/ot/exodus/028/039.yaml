    rationale: 모시는 저마 섬유이고, שֵׁשׁ는 성막 직물 문맥에서 아마로 만든 고급 리넨(아마포)을 가리킵니다. 재료가 달라지는 번역입니다.
  - severity: low
    issue: ‘관’
    rationale: 제사장용으로 문맥상 이해될 수 있으나, 현대 한국어에서는 왕관을 먼저 연상시킬 수 있습니다. ‘머리쓰개’가 미츠네펫의 기능과 형태를 더 분명히 합니다.
  - severity: low
    issue: ‘장인의 솜씨로’
    rationale: 원문의 מַעֲשֵׂה רֹקֵם은 장인의 작업·작품을 말합니다. ‘장인의 작품으로’가 이를 더 직접적으로 옮깁니다.
  revised_text: 너는 고운 아마포로 속옷을 무늬 있게 짜고, 고운 아마포로 머리쓰개를 만들며, 수놓는 장인의 작품으로 띠를 만들어야 합니다.[a]
