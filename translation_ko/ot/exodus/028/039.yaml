base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/039.yaml
  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
  footnotes:
  - marker: a
    text: Or 'make the tunic with a checkered pattern of fine linen.' The Hebrew verb likely refers to producing a patterned textile.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 가는 모시로 속옷을 무늬 있게 짜고, 가는 모시로 관을 만들며, 수를 놓는 장인의 솜씨로 띠를 만들어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무늬가 있는 가는 모시로 속옷을 만들라.’ 히브리어 동사는 아마도 무늬가 있는 직물을 만드는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּצְתָּ
  english_pob_choice: weave ... in checker work
  chosen_korean: 무늬 있게 짜고
  alternatives_korean:
  - 체크무늬로 짜고
  - 격자무늬로 짜고
  - 무늬를 넣어 짜고
  lexicon: HALOT
  rationale: 제사장 옷감에 쓰인 동사는 단순히 ‘놓다’보다 무늬가 드러나는 직조를 뜻하므로, 한국어에서는 결과 중심의 ‘무늬 있게 짜고’로 자연스럽게 옮겼습니다.
- source_word: הַכְּתֹנֶת
  english_pob_choice: the tunic
  chosen_korean: 속옷
  alternatives_korean:
  - 옷
  - 튜닉
  - 긴 속옷
  lexicon: HALOT
  rationale: כְּתֹנֶת은 제사장 복식 문맥에서 몸에 가까이 입는 속옷/속옷 겸 내의를 가리키므로, 전통적 교회어보다 현대 독자가 이해하기 쉬운 ‘속옷’을 택했습니다.
- source_word: שֵׁשׁ
  english_pob_choice: fine linen
  chosen_korean: 가는 모시
  alternatives_korean:
  - 고운 베
  - 세마포
  - 고운 리넨
  lexicon: HALOT
  rationale: יֵשׁ/שֵׁשׁ 계열은 성막·제사장 직물에서 고급 아마포를 뜻하므로, 재료감을 살리면서 현대 한국어로 자연스러운 ‘가는 모시’를 사용했습니다.
- source_word: מִצְנֶפֶת
  english_pob_choice: turban
  chosen_korean: 관
  alternatives_korean:
  - 터번
  - 머리쓰개
  - 두건
  lexicon: HALOT
  rationale: 제사장 머리덮개는 단순한 일반 모자보다 의례적 머리장식을 가리키므로, 한국어 성경에서 널리 쓰이는 ‘관’을 택했습니다.
- source_word: מַעֲשֵׂה רֹקֵם
  english_pob_choice: the work of an embroiderer
  chosen_korean: 수를 놓는 장인의 솜씨로
  alternatives_korean:
  - 자수를 놓은 작업으로
  - 자수공의 작업으로
  - 수놓는 사람의 작품으로
  lexicon: HALOT
  rationale: 표현이 특정 기술자의 정교한 장식 작업을 가리키므로, ‘솜씨’와 ‘장인’을 사용해 기술성과 수공예적 성격을 드러냈습니다.
