  chosen_korean: 두 겹으로 되어야 하며
  alternatives_korean:
  - 두 겹으로
  - 겹쳐져 있어야 하며
  - 접어 두 겹으로
  lexicon: HALOT
  rationale: 히브리어는 접힌 상태의 이중 구조를 가리키므로, 단순한 ‘이중’보다 ‘두 겹’이 더 구체적으로 원문의 형상을 반영합니다.
- source_word: זֶ֥רֶת
