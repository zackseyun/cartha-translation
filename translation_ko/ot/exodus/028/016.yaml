  - 한 스팬
  lexicon: HALOT
  rationale: 고대 길이 단위인 ‘span’을 한국어 성경 문맥에서 이해하기 쉬운 ‘한 뼘’으로 옮겼습니다.
- source_word: אָרְכּוֹ / רָחְבּוֹ
  english_pob_choice: its length / its width
  chosen_korean: 길이는 … 너비도 …
  alternatives_korean:
  - 세로는 … 가로도 …
  - 길이와 너비가 …
  lexicon: HALOT
  rationale: 측정 공식의 평행 구조를 살리기 위해 ‘길이/너비’의 대응을 유지했습니다.
theological_decisions:
- issue: 수치 규정의 명령/설명 뉘앙스
  chosen_reading: ‘되어야 합니다’로 번역해 제작 규정의 권고가 아니라 규격 지시임을 드러냈습니다.
  alternative_readings:
  - ‘입니다’
  - ‘되어야 한다’
  rationale: 출애굽기 28장 문맥은 제사장 예복 제작 지침이므로, 현대 한국어에서 자연스러운 규범적 표현을 사용하되 과도한 강압성은 피했습니다.
  doctrine_reference: 성막/제사장복 제작 규례 문맥
