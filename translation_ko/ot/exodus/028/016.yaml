lexical_decisions:
- source_word: רָב֥וּעַ
  english_pob_choice: square
  chosen_korean: 네모지고
  alternatives_korean:
  - 사각형으로
  - 네모난
  lexicon: HALOT
  rationale: 입방형·사각형의 모양을 자연스럽게 드러내되, 치수 규정의 문맥에 맞게 현대 한국어로 간결하게 옮겼습니다.
- source_word: כָּפ֑וּל
