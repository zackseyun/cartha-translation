  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
  footnotes:
  - marker: a
    text: Or 'caps,' 'turbans,' or 'headdresses' for the priestly headgear.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 아들들을 위해 긴옷을 만들고, 그들에게 띠를 만들며, 그들에게 모자[a]를 만들어 주십시오. 이것들은 영광과 아름다움을 위한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모자’는 제사장 머리쓰개를 포괄적으로 옮긴 말입니다. 원문은 그 형태를 더 구체적으로 규정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  english_pob_choice: for Aaron’s sons
  chosen_korean: 아론의 아들들을 위해서는
  alternatives_korean:
  - 아론의 아들들을 위해
  - 아론의 아들들에게
  lexicon: WLC
  rationale: 직역의 ‘아론의 아들들’ 관계를 유지하면서, 한국어에서는 목적 대상을 자연스럽게 드러내는 조사 ‘-을 위해서’를 써서 제사장 의복 지시라는 맥락을 살렸습니다.
- source_word: כֻתֳּנֹת
  english_pob_choice: tunics
  chosen_korean: 속옷
  alternatives_korean:
  - 통옷
  - 긴옷
  - 튠닉
  lexicon: HALOT
  rationale: כֻתֹּנֶת은 기본 몸옷을 가리키며, 제사장 복식 문맥에서 외투보다 안쪽에 입는 옷이라는 점이 분명하므로 ‘속옷’이 기능을 가장 잘 전달합니다.
- source_word: אַבְנֵטִים
  english_pob_choice: sashes
  chosen_korean: 띠
  alternatives_korean:
  - 띠끈
  - 허리띠
  - 띠천
  lexicon: HALOT
  rationale: 허리에 두르는 직물 띠를 가리키므로, 너무 현대적이거나 물건화된 ‘벨트’보다 ‘띠’가 제사장 복식의 유연한 천 재질을 더 잘 반영합니다.
- source_word: מִגְבָּעוֹת
  english_pob_choice: caps
  chosen_korean: 모자
  alternatives_korean:
  - 두건
  - 관모
  - 머리수건
  lexicon: HALOT
  rationale: 이 명칭은 아론의 아들들을 위한 머리쓰개를 뜻하므로, 구체적 형태를 과도하게 확정하지 않는 일반어 ‘모자’를 택해 영어 POB의 ‘caps’ 선택과도 맞췄습니다.
- source_word: לְכָבוֹד וּלְתִפְאָרֶת
  english_pob_choice: for glory and for beauty
  chosen_korean: 영광과 아름다움을 위해
  alternatives_korean:
  - 영예와 아름다움을 위해
  - 영광과 장엄함을 위해
  lexicon: HALOT
  rationale: 두 목적어는 제사장 복식의 품위와 미적 탁월함을 말하므로, 교회적 상투어보다 본문의 병렬을 살리는 ‘영광과 아름다움’을 택했습니다.
theological_decisions:
- issue: 제사장 복식의 목적 구문
  chosen_reading: 영광과 아름다움을 위해
  alternative_readings:
  - 영예와 장엄함을 위해
  - 존귀와 화려함을 위해
  rationale: 본문은 의복에 상징적 목적을 부여하지만 그 의미를 과잉 해석하지 않고, 문면 그대로의 품위와 아름다움이라는 목적을 유지합니다.
  doctrine_reference: Translation philosophy §1, §6
