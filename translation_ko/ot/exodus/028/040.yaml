revisions:
- from: 아론의 아들들을 위해서는 속옷을 만들고, 그들을 위해 띠를 만들며, 그들을 위해 모자를 만들어, 영광과 아름다움을 위해 하십시오.[a]
  to: 아론의 아들들을 위해 긴옷을 만들고, 그들에게 띠를 만들며, 그들에게 모자[a]를 만들어 주십시오. 이것들은 영광과 아름다움을 위한 것입니다.
  rationale: 비문인 마지막 목적 구문을 완전한 서술문으로 고쳐 의복들이 ‘영광과 아름다움’을 위한 것임을 명확히 했습니다. ‘속옷’은 현대어에서 내의로 오해될 수 있으므로 원문의 기본 몸옷 의미를 더 자연스럽게 전달하는 ‘긴옷’으로 바꾸었습니다. 머리쓰개 각주는 해당 단어에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:37Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 세 차례의 제작 명령, 아론의 아들들을 위한 수혜 관계, 그리고 ‘영광과 아름다움’을 위한 목적을 유지해야 합니다. 초안의 마지막 ‘영광과 아름다움을 위해 하십시오’는 목적어와 서술어의 결합이 성립하지 않아 원문의 목적 구문을 제대로 전달하지 못합니다.
  naturalness: ‘아론의 아들들을 위해서는’은 이 문맥에서 다소 어색하며, 문장 끝의 ‘위해 하십시오’는 비문입니다. ‘아론의 아들들을 위해’와 ‘…을 위한 것입니다’로 옮기면 현대 표준 한국어 합쇼체로 자연스럽고 명료합니다.
  terminology: כֻּתֳנֹת는 현대 한국어에서 속내의로 주로 이해되는 ‘속옷’보다 몸을 덮는 의복을 나타내는 ‘긴옷’이 안전합니다. אַבְנֵטִים의 ‘띠’와 מִגְבָּעוֹת의 포괄적 번역인 ‘모자’는 유지할 수 있습니다. ‘영광과 아름다움’도 원문의 병렬을 적절히 보존합니다.
  issues:
  - severity: high
    issue: 문장 끝의 ‘영광과 아름다움을 위해 하십시오’가 비문임
    rationale: ‘위해’는 목적을 나타내지만 뒤의 ‘하십시오’와 자연스럽게 결합하지 않으며, 무엇이 영광과 아름다움을 위한 것인지도 불명확합니다.
  - severity: medium
    issue: ‘속옷’이 현대어에서 내의를 강하게 연상시킴
    rationale: כֻּתֳנֹת는 제사장이 입는 기본 몸옷/긴옷이며, 현대 한국어의 ‘속옷’은 본문에 없는 내의의 의미를 불필요하게 부여할 수 있습니다.
  - severity: low
    issue: 각주 표지가 ‘모자’가 아닌 문장 끝에 놓임
    rationale: 각주의 내용이 ‘모자’의 어휘적 범위를 설명하므로 해당 낱말 바로 뒤에 표기하는 편이 앵커 관계를 분명히 합니다.
