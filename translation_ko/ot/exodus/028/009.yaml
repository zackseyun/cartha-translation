translation:
  language: ko
  text: 두 개의 호마노 보석을 가져다가 그 위에 이스라엘의 아들들의 이름을 새기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘쇼함’은 전통적으로 ‘호마노’(onyx)로 번역하지만, 정확한 광물 종류는 확실하지 않습니다. 사도닉스나 녹주석 등의 견해도 제시됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  english_pob_choice: And you shall take
  chosen_korean: 그리고 너는 ... 가져다가
  alternatives_korean:
  - 그리고 너는 ... 취하십시오
  - 그 다음 너는 ... 가져가십시오
  lexicon: WLC
  rationale: 명령형 지시를 살리되 현대 한국어에서 자연스러운 동작 동사인 ‘가져다가’를 사용해 연속 동작과 다음 절의 새김 행위를 매끄럽게 연결했습니다.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  english_pob_choice: two onyx stones
  chosen_korean: 두 개의 호박돌
  alternatives_korean:
  - 두 개의 오닉스 돌
  - 두 개의 석류석
  lexicon: WLC
  rationale: POB의 ‘onyx’에 맞춰 전통적으로 통용되는 ‘호박돌’을 채택했고, 정확한 광물 식별의 불확실성은 각주로 남겼습니다.
- source_word: וּפִתַּחְתָּ
  english_pob_choice: and engrave
  chosen_korean: 새기십시오
  alternatives_korean:
  - 새겨 넣으십시오
  - 각인하십시오
  lexicon: WLC
  rationale: 보석 위에 이름을 파서 넣는 행위이므로, 장식적 의미보다 물리적 절개를 드러내는 ‘새기다’가 가장 직접적입니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 아들들
  alternatives_korean:
  - 이스라엘 자손들
  - 이스라엘 사람들
  lexicon: WLC
  rationale: 원문이 ‘아들들’(sons)이라고 구체적으로 말하므로, 성별 표지를 지우는 일반화보다 직역에 가까운 ‘이스라엘 아들들’을 유지했습니다.
