  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
  footnotes:
  - marker: a
    text: Or 'breastpiece for judgment' or 'breastpiece of decision.'
    reason: lexical_alternative
  - marker: b
    text: Or 'skillfully woven work'; the Hebrew refers to expertly designed artisan work.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 판단 흉패를 만들어야 합니다. 그것은 능숙한 장인의 작품이어야 하며, 에봇의 작품과 같게 해야 합니다. 그것은 금과 청색과 자색과 홍색 실과 가늘게 꼰 베실로 만들어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '판단용 흉패', '결정용 흉패'로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '능숙하게 짠 작품'입니다. 히브리어는 정교하게 무늬를 짜는 장인 작업을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  english_pob_choice: breastpiece
  chosen_korean: 판단 흉패
  alternatives_korean:
  - 판단 가슴받이
  - 가슴 흉갑
  lexicon: HALOT
  rationale: 지시 대상은 갑옷이 아니라 대제사장 예복의 장식용 흉패이므로, '흉갑'보다 오해가 적은 '흉패'를 택했고, מִשְׁפָּט과의 결합을 살려 '판단'을 붙였습니다.
- source_word: מִשְׁפָּט
  english_pob_choice: of judgment
  chosen_korean: 판단
  alternatives_korean:
  - 재판
  - 심판
  - 결정
  lexicon: HALOT
  rationale: 이 합성구는 제의적·판결적 기능을 시사하지만 본문이 그 방식을 설명하지 않으므로, 전통적 의미망을 유지하는 '판단'으로 옮겨 과도한 해석을 피했습니다.
- source_word: מַעֲשֵׂה חֹשֵׁב
  english_pob_choice: the work of a skillful designer
  chosen_korean: 능숙한 장인의 작품
  alternatives_korean:
  - 정교하게 짠 작품
  - 숙련된 설계자의 작품
  - 능숙하게 짠 직물
  lexicon: HALOT
  rationale: 히브리어는 단순한 '직조'보다 무늬를 구상해 만드는 숙련된 공예를 가리키므로, 읽기 쉬우면서도 기술적 성격을 살려 '능숙한 장인의 작품'으로 옮겼습니다.
- source_word: שֵׁשׁ מָשְׁזָר
  english_pob_choice: finely twisted linen
  chosen_korean: 가늘게 꼰 베실
  alternatives_korean:
  - 가는 실로 꼰 베
  - 고운 꼰 베실
  - 세밀하게 꼰 아마포
  lexicon: HALOT
  rationale: 제의 직물 목록의 일관성을 위해 섬유 재료를 드러내되, '아마포'보다 직접적인 '베실'을 사용해 꼬인 실의 성격을 분명히 했습니다.
theological_decisions:
- issue: '''판단 흉패''의 기능을 얼마나 구체화할 것인가'
  chosen_reading: 본문이 말하는 범위 안에서 명칭만 제시하고, 판결 방식이나 신탁 절차는 덧붙이지 않았습니다.
  alternative_readings:
  - 우림과 둠밈이 들어 있는 흉패로 구체화
  - 재판용 흉패로 해설
  rationale: 이 절은 기구의 제작 지시이며 기능의 세부 작동 원리는 설명하지 않으므로, 제의적 긴장을 보존하기 위해 명칭 수준에서 멈추는 것이 가장 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
