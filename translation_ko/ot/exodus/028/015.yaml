  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
  footnotes:
  - marker: a
    text: Or 'breastpiece for judgment' or 'breastpiece of decision.'
    reason: lexical_alternative
  - marker: b
    text: Or 'skillfully woven work'; the Hebrew refers to expertly designed artisan work.
    reason: lexical_alternative
translation:
  language: ko
  text: 판단의 흉패[a]를 만드십시오. 무늬를 고안하는 장인의 솜씨로[b], 에봇을 만드는 방식대로 그것을 만드십시오. 금과 청색 실과 자색 실과 홍색 실과 가늘게 꼰 베실로 그것을 만드십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판단을 위한 흉패’, ‘결정을 위한 흉패’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정교하게 짠 작품’으로 옮길 수 있습니다. 히브리어는 무늬를 고안하여 만드는 숙련된 장인의 작업을 가리킵니다.
    reason: lexical_alternative
