  rationale: 지시문맥의 2인칭 단수 완료형을 한국어 명령·당위로 옮기되, 현대적 합쇼체로 자연스럽게 표현했습니다.
- source_word: בִגְדֵי קֹדֶשׁ
  english_pob_choice: holy garments
  chosen_korean: 거룩한 옷들
  alternatives_korean:
  - 성스러운 옷들
  - 거룩한 의복
  lexicon: WLC
  rationale: קדשׁ의 구별됨을 살려 ‘거룩한’으로 옮기고, 제사장 의복의 구체성을 위해 ‘의복’보다 일상적이면서도 충분히 격식 있는 ‘옷들’을 택했습니다.
- source_word: לְכָבוֹד וּלְתִפְאָֽרֶת
  english_pob_choice: for glory and for beauty
  chosen_korean: 영광과 아름다움을 위함
  alternatives_korean:
  - 영예와 아름다움을 위함
  - 영광과 화려함을 위함
  lexicon: WLC
  rationale: כבוד과 תפארת의 의미 범위를 과도하게 좁히지 않으면서도, POB의 ‘glory and beauty’를 한국어로 자연스럽게 재현했습니다.
theological_decisions:
- issue: 목적격 표현의 방향성
  chosen_reading: 제사장 의복은 아론의 직분을 드러내는 영예와 시각적 아름다움을 위해 마련되는 것으로 번역했습니다.
  alternative_readings:
  - 아론의 개인적 장식을 위해
