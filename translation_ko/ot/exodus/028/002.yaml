  rationale: 본문의 목적절은 단순한 장식이나 일반 복장이 아니라, 제사장 직분의 품위와 아름다움을 함께 지시하므로 그 긴장을 유지했습니다.
  doctrine_reference: 출 28:2 문맥의 제사장직 표지
