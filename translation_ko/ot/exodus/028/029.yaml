  source_fidelity: 현 번역은 ‘성소’(הַקֹּדֶשׁ)를 생략하고, בְּבֹאוֹ의 단순 시간 표현을 ‘들어갈 때마다’로 강화합니다. 또한 ‘지니고 다녀야 합니다’는 성소 출입 때 가슴받이를 지니는 구체적 행위를 일상적·지속적 이동 행위처럼 들리게 합니다. ‘그의 마음 위에’도 물리적으로 가슴받이가 놓이는 위치를 가리키는 עַל־לִבּוֹ에 한국어로는 부자연스럽고 부정확합니다.
  naturalness: ‘판단의 가슴받이’, ‘성소’, ‘가슴에 지니고’는 현대 표준어의 격식 있는 성서 문체에서 자연스럽습니다. 문장 순서를 조정하여 이름들이 가슴받이 안에 있고 그 가슴받이가 가슴 위에 놓인 관계를 분명히 했습니다.
  terminology: ‘이스라엘 자손’, ‘성소’, ‘여호와’, ‘기념’은 원문의 계보적 표현, 제의 장소, 신명, זִכָּרוֹן의 기념 목적을 충실히 반영합니다. חֹשֶׁן הַמִּשְׁפָּט은 기능을 과도하게 특정하지 않도록 ‘판단의 가슴받이’로 유지했습니다.
