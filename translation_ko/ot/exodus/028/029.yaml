id: EXO.28.29
reference: Exodus 28:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
  footnotes:
  - marker: a
    text: Or 'shall bear.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the breastpiece for decision.' The Hebrew title likely refers to the priestly breastpiece associated with rendering judgment or decision before God.
    reason: alternative_reading
  - marker: c
    text: Hebrew 'the sons of Israel'; a genealogical expression referring to the tribes descended from Israel.
    reason: lexical_alternative
  - marker: d
    text: Or 'as a memorial before the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아론은 성소에 들어갈 때 이스라엘 자손의 이름들을 판단의 가슴받이 안에 넣어 가슴에 지니고, 여호와 앞에서 언제나 기념이 되게 해야 합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판결의 가슴받이’. 히브리어 명칭은 하나님 앞에서 판단이나 결정을 구하는 제사장 가슴받이와 관련됩니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다. 이 표현은 이스라엘에게서 난 지파들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘성소’는 히브리어로 ‘거룩한 곳’이며, 여기서는 성막의 거룩한 제의 공간을 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘여호와 앞에서 언제나 기념으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  english_pob_choice: shall carry
  chosen_korean: 지니고 다녀야 합니다
  alternatives_korean:
  - 메어야 합니다
  - 지녀야 합니다
  - 짊어져야 합니다
  lexicon: HALOT
  rationale: נשא의 핵심 의미인 ‘지고/메고 들다’에서 제의적 대표 행위를 살리면서, 한국어에서는 제사장이 이름들을 몸에 지닌 채 나아가는 동작을 자연스럽게 드러내기 위해 ‘지니고 다니다’를 택했습니다.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  english_pob_choice: in the breastpiece of judgment
  chosen_korean: 판단의 가슴받이
  alternatives_korean:
  - 판결의 가슴받이
  - 판정의 가슴받이
  - 심판의 가슴받이
  lexicon: HALOT
  rationale: חֹשֶׁן은 제사장의 가슴받이로, מִשְׁפָּט은 여기서 ‘정의’ 일반보다 제의적 판단/결정의 기능을 가리키므로, 문맥을 살려 ‘판단’으로 옮겼습니다.
- source_word: עַל לִבּוֹ
  english_pob_choice: over his heart
  chosen_korean: 그의 마음 위에
  alternatives_korean:
  - 가슴 위에
  - 심장 위에
  - 마음에
  lexicon: HALOT
  rationale: 히브리어의 위치 표현과 상징적 대표성을 함께 살리기 위해, 몸의 부위를 직역하기보다 한국어에서 내적 중심을 가리키는 ‘마음 위에’로 옮겼습니다.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  english_pob_choice: when he goes into the Holy Place
  chosen_korean: 들어갈 때마다
  alternatives_korean:
  - 거룩한 곳에 들어갈 때
  - 성소에 들어갈 때
  - 들어갈 때
  lexicon: HALOT
  rationale: 문장의 시간적 반복성을 드러내는 데 중점을 두어, 제사장의 정기적 출입을 자연스럽게 나타내는 ‘들어갈 때마다’로 옮겼습니다. הַקֹּדֶשׁ은 직역하면 ‘거룩한 곳’이지만, 제의 문맥상 ‘Holy Place’의 기능을 한국어에서 부드럽게 반영했습니다.
- source_word: לְזִכָּרֹן
  english_pob_choice: for a memorial
  chosen_korean: 기억되도록
  alternatives_korean:
  - 기념으로
  - 기념물이 되도록
  - 기억으로
  lexicon: HALOT
  rationale: לזכרון의 목적성을 살리면서도 한국어에서 자연스러운 결과 표현을 위해 ‘기억되도록’을 택해, 하나님 앞에서 끊임없이 상기되는 제의적 의미를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 문맥에서는 영어 POB의 고유명사 표기보다는 한국어 성경 전통에서 널리 알려진 음역을 따르는 것이 문장 이해에 더 직접적이므로 ‘여호와’를 사용했습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 집단적·계보적 표현 유지
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘의 자손들
  - 이스라엘 백성
  rationale: 히브리어의 계보적 표현을 유지해 제사장이 개별 신자가 아니라 언약 공동체 전체를 대표한다는 점을 드러냈습니다.
  doctrine_reference: Translation philosophy §4
- issue: הַקֹּדֶשׁ의 제의적 장소성
  chosen_reading: 들어갈 때마다
  alternative_readings:
  - 성소에 들어갈 때
  - 거룩한 곳에 들어갈 때
  rationale: 문맥은 추상적 거룩함이 아니라 성막/성소 출입의 반복 규정을 말하므로, 장소명 자체를 길게 반복하지 않고 출입 행위의 반복을 강조했습니다.
  doctrine_reference: Translation philosophy §6
