  lexicon: HALOT
  rationale: הָאֵפֹד는 기술 용어이므로 음역을 유지했습니다. 한국어 성경 전통에 맞춰 에봇으로 옮겼습니다.
- source_word: כְּלִיל
  english_pob_choice: entirely
  chosen_korean: 온통
  alternatives_korean:
