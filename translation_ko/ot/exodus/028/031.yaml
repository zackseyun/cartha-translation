- source_word: תְּכֵלֶת
  english_pob_choice: blue
  chosen_korean: 파란색
  alternatives_korean:
  - 푸른색
  - 청색
  - 파랑
  lexicon: HALOT
  rationale: 성막 직물의 특수 염색을 가리키지만, 본문 의미를 분명히 하는 데는 현대 한국어의 ‘파란색’이 가장 명료합니다.
theological_decisions:
- issue: 제사장 복식의 기술 용어를 직역할지 여부
  chosen_reading: ‘에봇의 겉옷’으로 옮겨 복식의 관계를 분명히 했습니다.
  alternative_readings:
  - ‘에봇의 로브’
  - ‘에봇의 외투’
  rationale: 본문은 단순히 색상을 말하는 것이 아니라 에봇과 연관된 특정 의복을 지시하므로, 관계를 드러내는 번역이 स्रोत에 더 충실합니다.
  doctrine_reference: 출애굽기 28장 제사장 예복 규정
- issue: תְּכֵלֶת의 색상 범위
  chosen_reading: ‘파란색’으로 옮기고, 주석 없이 본문은 간결하게 유지했습니다.
  alternative_readings:
  - ‘청색’
  - ‘파란빛-보라빛’
  rationale: 원어는 고가의 염색 천을 가리키는 색상군이지만, 본문 차원에서는 과도한 색채 설명보다 핵심 의미 전달이 우선입니다.
  doctrine_reference: 출애굽기 28장 성막/제사장 직물 규정
