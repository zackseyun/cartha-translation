  text: 너는 에봇의 겉옷을 온통 파란색으로 만들어야 합니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온통 파란색’, 곧 옷 전체가 파란 재료로 만들어졌다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 색상어는 값비싼 염색 직물을 가리켜 파란색에서 파란-보라색 계열을 뜻할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: You shall make
  chosen_korean: 만들어야 합니다
  alternatives_korean:
