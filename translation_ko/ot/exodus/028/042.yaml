  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/עֲשֵׂ֤ה לָ/הֶם֙ מִכְנְסֵי בָ֔ד לְ/כַסּ֖וֹת בְּשַׂ֣ר עֶרְוָ֑ה מִ/מָּתְנַ֥יִם וְ/עַד יְרֵכַ֖יִם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/042.yaml
  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
  footnotes:
  - marker: a
    text: Or 'linen breeches' or 'linen shorts.' The Hebrew refers to a lower-body garment worn beneath the priestly vestments.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the loins to the thighs.' 'Hips' is used here as a natural modern-English rendering of the garment's upper starting point.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 위하여 아마포 속바지를 만들어서 그들의 벗은 살을 가리도록 하십시오. 그것들은 허리에서 허벅지까지 이르러야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘허리’는 히브리어 마트나임의 번역으로, 허리 또는 허리께·엉덩이 부근을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְנְסֵי בָד
  english_pob_choice: linen undergarments
  chosen_korean: 아마로 만든 속바지
  alternatives_korean:
  - 아마 바지
  - 아마 속옷
  - 리넨 속바지
  lexicon: HALOT
  rationale: 의복 기능은 ‘속바지’로, 재료는 ‘아마로 만든’으로 풀어 현대 한국어에서 자연스럽게 전달했습니다. ‘바지’는 하체를 덮는 의복임을 분명히 하면서도, 제사 لباس 아래 입는 내의라는 점을 살립니다.
- source_word: לְכַסּוֹת בְּשַׂר עֶרְוָה
  english_pob_choice: to cover their naked flesh
  chosen_korean: 그들의 벌거벗은 살을 가리게 하십시오
  alternatives_korean:
  - 그들의 나체를 가리게 하십시오
  - 그들의 벌거벗은 몸을 가리게 하십시오
  - 그들의 벗은 살을 덮게 하십시오
  lexicon: HALOT
  rationale: 직역적 완곡어인 ‘벌거벗은 살’로 히브리어의 구체성을 살렸고, 제의적 맥락의 금기와 수치를 약화하지 않기 위해 ‘가리다’를 사용했습니다.
- source_word: מִמָּתְנַיִם ... יְרֵכַיִם
  english_pob_choice: from the hips ... to the thighs
  chosen_korean: 허리에서 허벅지까지
  alternatives_korean:
  - 엉덩이에서 허벅지까지
  - 허리에서 넓적다리까지
  - 허벅지 위쪽에서 허벅지까지
  lexicon: HALOT
  rationale: 히브리어의 신체 범위를 한국어로 자연스럽게 옮기기 위해 ‘מתניים’은 문맥상 기능을 반영해 ‘허리’로, ‘ירכיים’은 ‘허벅지’로 옮겼습니다. ‘허리’는 영어 POB의 ‘hips’처럼 현대 독자가 의복의 시작점을 바로 이해하게 합니다.
- source_word: יִהְיוּ
  english_pob_choice: they shall be
  chosen_korean: 이르러야 합니다
  alternatives_korean:
  - 되어야 합니다
  - 이어야 합니다
  - 덮어야 합니다
  lexicon: HALOT
  rationale: 히브리어의 단순한 ‘~이다/있다’를 한국어 제시문에서는 의복의 길이 규정으로 자연스럽게 풀어 ‘이르다’로 옮겼습니다. 이는 측정 구문에서의 문맥적 의미를 반영합니다.
theological_decisions:
- issue: 제사장 속옷의 노출 금지 규정
  chosen_reading: 이 구절은 제사장 복장의 실용 규정이면서 동시에 예배에서의 거룩과 수치의 경계를 드러내므로, 완곡하지만 지나치게 순화하지 않은 표현을 택했습니다.
  alternative_readings:
  - 단순한 의복 지침으로만 축소하는 읽기
  - 노골적으로 신체 부위를 세분해 현대어를 과도하게 직설화하는 읽기
  rationale: 본문의 목적은 신체 노출을 막는 제의적 장치에 있습니다. 따라서 의미를 약화시키지 않으면서도 한국어 독자가 이해 가능한 수준으로만 드러내는 것이 적절합니다.
  doctrine_reference: 출애굽기 28장의 제사장 거룩성 규정
- issue: 명령형 존대의 처리
  chosen_reading: 직접 명령이지만 하나님께 드리는 지시문 맥락이므로 ‘만들어… 하십시오’의 합쇼체를 사용했습니다.
  alternative_readings:
  - 평서형으로 옮기는 읽기
  - 직설 명령형으로 옮기는 읽기
  rationale: 현대 한국어 예배·성경 문체의 가독성을 위해 합쇼체를 유지하되, 히브리어 명령문의 지시성을 보존했습니다.
  doctrine_reference: 번역 문체 원칙
