id: EXO.28.14
reference: Exodus 28:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/שְׁתֵּ֤י שַׁרְשְׁרֹת֙ זָהָ֣ב טָה֔וֹר מִגְבָּלֹ֛ת תַּעֲשֶׂ֥ה אֹתָ֖/ם מַעֲשֵׂ֣ה עֲבֹ֑ת וְ/נָתַתָּ֛ה אֶת שַׁרְשְׁרֹ֥ת הָ/עֲבֹתֹ֖ת עַל הַֽ/מִּשְׁבְּצֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/014.yaml
  text: And make two chains of pure gold[a], braided like cords[b]; and put the braided chains on the settings.
  footnotes:
  - marker: a
    text: Or 'two chains of pure gold, twisted like cords, you shall make them, work of cordage.' The Hebrew uses two related expressions for twisted or corded workmanship.
    reason: lexical_alternative
  - marker: b
    text: '''Settings'' may also be rendered ''mountings'' or ''filigree settings,'' referring to the gold framework attached to the priestly garment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 순금으로 된 두 사슬을 꼬아 줄처럼 만들고, 그 꼬은 사슬을 받침쇠 위에 두십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁתֵּ֤י שַׁרְשְׁרֹת֙
  english_pob_choice: two chains
  chosen_korean: 두 사슬
  alternatives_korean:
  - 두 체인
  - 두 쇠사슬
  lexicon: HALOT
  rationale: שַׁרְשְׁרֹת은 금 장식에 쓰이는 사슬을 가리키므로, 자연스러운 현대어 ‘사슬’로 옮겼습니다.
- source_word: זָהָ֣ב טָה֔וֹר
  english_pob_choice: pure gold
  chosen_korean: 순금으로 된
  alternatives_korean:
  - 정금으로 된
  - 순수한 금의
  lexicon: HALOT
  rationale: 성소 기구 재료를 나타내는 관용적 표현으로 ‘순금으로 된’이 가장 자연스럽고 정확합니다.
- source_word: מִגְבָּלֹ֛ת ... מַעֲשֵׂ֣ה עֲבֹ֑ת
  english_pob_choice: braided like cords / braided work like cords
  chosen_korean: 꼬아 줄처럼 만들고
  alternatives_korean:
  - 꼰 줄처럼 만들고
  - 줄처럼 꼰 공예로 만들고
  - 끈처럼 꼬아 만들고
  lexicon: HALOT
  rationale: 두 개의 관련 표현이 모두 꼬임·줄 모양의 제작을 나타내므로, 중복을 과도하게 풀지 않고 ‘꼬아 줄처럼 만들고’로 압축해 반영했습니다.
- source_word: עַל הַֽ/מִּשְׁבְּצֹֽת
  english_pob_choice: on the settings
  chosen_korean: 받침쇠 위에
  alternatives_korean:
  - 장식틀 위에
  - 세팅 위에
  - 장식받침 위에
  lexicon: HALOT
  rationale: קדושה 장식의 금받침/장식틀을 가리키는 말로, 한국어 성경어법에서는 ‘받침쇠’가 가장 이해하기 쉽고 기능을 잘 드러냅니다.
