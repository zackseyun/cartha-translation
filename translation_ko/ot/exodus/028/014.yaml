  text: 또 순금 사슬 두 개를 줄처럼 꼰 세공으로[a] 만드십시오. 그리고 그 꼰 사슬들을 금테[b] 위에 두십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 사슬의 꼬임 또는 줄 모양의 세공을 나타내는 두 관련 표현을 사용합니다. 정확한 제작 기법은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘장식받침’, ‘장식틀’. 제사장 의복에 달린 금 장식의 틀을 가리킵니다.
    reason: lexical_alternative
