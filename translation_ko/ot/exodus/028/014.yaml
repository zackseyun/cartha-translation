  text: And make two chains of pure gold[a], braided like cords[b]; and put the braided chains on the settings.
  footnotes:
  - marker: a
    text: Or 'two chains of pure gold, twisted like cords, you shall make them, work of cordage.' The Hebrew uses two related expressions for twisted or corded workmanship.
