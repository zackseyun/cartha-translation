source:
  edition: WLC
  text: וְ/הַ/טּוּר֙ הָ/רְבִיעִ֔י תַּרְשִׁ֥ישׁ וְ/שֹׁ֖הַם וְ/יָשְׁפֵ֑ה מְשֻׁבָּצִ֥ים זָהָ֛ב יִהְי֖וּ בְּ/מִלּוּאֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/020.yaml
  text: 'And the fourth row: beryl[a], onyx, and jasper; they shall be set in gold in their settings.'
  footnotes:
  - marker: a
    text: The exact identification of several gemstones in the high priest's breastpiece is uncertain; traditional renderings include 'beryl' for תַּרְשִׁישׁ and 'onyx' for שֹׁהַם, but other identifications have been proposed.
    reason: lexical_alternative
translation:
  language: ko
  text: 넷째 줄은 청옥, 호마노, 벽옥이며, 그것들은 금으로 된 받침에 물려 있어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  english_pob_choice: And the fourth row
  chosen_korean: 넷째 줄
  alternatives_korean:
  - 네 번째 줄
  - 넷째 열
  lexicon: HALOT
  rationale: טּוּר는 흉패의 보석 배열을 가리키므로 ‘줄’이 자연스럽고, ordinal은 ‘넷째’로 간결하게 살렸습니다.
- source_word: תַּרְשִׁישׁ
  english_pob_choice: beryl
  chosen_korean: 청옥
  alternatives_korean:
  - 베릴
  - 녹주석
  - 벽옥
  lexicon: HALOT
  rationale: 원문 보석명은 정확한 동정이 확정되지 않으므로, POB의 ‘beryl’에 대응하는 한국어 통용역으로 과도한 확정을 피하는 ‘청옥’을 택했습니다.
- source_word: וְשֹׁהַם
  english_pob_choice: onyx
  chosen_korean: 호마노
  alternatives_korean:
  - 오닉스
  - 흑옥
  lexicon: HALOT
  rationale: 전통적이고 성경 본문에서 잘 알려진 한국어 보석명인 ‘호마노’가 POB의 ‘onyx’에 가장 가깝습니다.
- source_word: וְיָשְׁפֵה
  english_pob_choice: jasper
  chosen_korean: 벽옥
  alternatives_korean:
  - 재스퍼
  - 자스퍼
  lexicon: HALOT
  rationale: ‘jasper’의 일반적인 한국어 성경 보석명은 ‘벽옥’이어서 목록의 병렬성을 유지했습니다.
- source_word: מְשֻׁבָּצִים זָהָב
  english_pob_choice: set in gold
  chosen_korean: 금으로 된 받침에 물려
  alternatives_korean:
  - 금으로 된 장식에 박혀
  - 금으로 된 틀에 세워
  lexicon: HALOT
  rationale: 보석이 금 장식 안에 끼워진 제작 묘사를 살리기 위해, 단순히 ‘세워’보다 조립·장착의 뉘앙스가 드러나는 ‘물려’와 ‘받침’을 사용했습니다.
- source_word: בְּמִלּוּאֹתָם
  english_pob_choice: in their settings
  chosen_korean: 받침에
  alternatives_korean:
  - 설정에
  - 장착물에
  lexicon: HALOT
  rationale: מִלּוּאֹת는 공예 문맥에서 보석을 고정하는 소켓/받침을 가리키므로, 한국어로는 기능이 드러나는 ‘받침’이 가장 명확합니다.
