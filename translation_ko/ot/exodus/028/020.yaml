  footnotes:
  - marker: a
    text: 흉패에 쓰인 몇몇 보석의 정확한 종류는 확실하지 않습니다. תַּרְשִׁישׁ은 전통적으로 ‘녹주석’으로, שֹׁהַם은 ‘호마노’로 옮기지만, 다른 보석으로 보는 견해도 있습니다.
    reason: lexical_alternative
