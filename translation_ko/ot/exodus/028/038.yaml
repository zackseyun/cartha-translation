revisions:
- from: 그것은 아론의 이마 위에 있을 것이며[a], 아론은 이스라엘 자손이 거룩하게 구별하는 거룩한 것들의 죄책을 지게 될 것입니다. 곧 그들의 거룩한 예물에 속한 모든 것에 대하여 그렇습니다. 그것은 주님 앞에서 그들에게 받아들여지도록[b] 늘 그의 이마 위에 있어야 합니다.
  to: 그것은 아론의 이마 위에 있을 것이며, 아론은 이스라엘 자손이 그들의 모든 거룩한 예물과 관련하여 거룩하게 구별하는 성물들의 죄책을 질 것입니다. 그것은 그들이 야훼 앞에서 받아들여지도록 늘 그의 이마 위에 있을 것입니다.[a]
  rationale: 신명은 ‘야훼’로 바로잡고, 성물 및 모든 거룩한 예물 사이의 복잡한 원문 관계를 ‘…예물과 관련하여 거룩하게 구별하는 성물들’로 보존했습니다. 아론이 지는 것은 성물과 연관된 죄책이라는 제의적 책임이며, 본문은 그 죄책의 처리 기제를 더 구체화하지 않습니다. 마지막 목적절은 예배자들의 수용을 가리키되 예물과의 문맥적 연관성을 배제하지 않도록 번역했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:39Z'
review_pass:
  verdict: revise
  source_fidelity: ‘주님’은 יְהוָה의 지정된 음역 원칙 및 영어 POB의 ‘Yahweh’와 일치하지 않으므로 ‘야훼’로 고쳐야 합니다. 또한 לְכָל מַתְּנֹת קָדְשֵׁיהֶם은 ‘그들의 거룩한 예물에 속한 모든 것’이 아니라, 이스라엘이 거룩하게 구별하는 성물과 그 모든 거룩한 예물의 관련 범위를 나타냅니다. 이를 본문에서 더 충실하게 반영했습니다.
  naturalness: ‘그들에게 받아들여지도록’은 한국어에서 누가 받아들여지는지 불분명하고 어색합니다. 히브리어 לָהֶם의 사람 지시를 살려 ‘그들이 … 받아들여지도록’으로 고쳤습니다. ‘성물’은 이 제의 문맥에서 ‘거룩한 것들’보다 자연스럽고 정확한 현대 한국어입니다.
  terminology: נָשָׂא עָוֺן은 ‘죄책을 지다’로 유지하여 책임·부담의 의미를 보존했습니다. הַקֳּדָשִׁים은 ‘성물’, יְהוָה는 ‘야훼’로 통일했습니다. 수용의 대상은 예물만으로 좁히지 않고 이스라엘 자손을 가리키는 대명사를 명시했습니다.
  issues:
  - severity: high
    issue: 신명 יְהוָה를 ‘주님’으로 번역함
    rationale: 제시된 영어 POB 및 번역 방침은 이 신명을 ‘Yahweh’로 음역합니다. ‘주님’은 원문의 고유 이름을 칭호로 대체합니다.
  - severity: high
    issue: ‘그들의 거룩한 예물에 속한 모든 것에 대하여’가 לְכָל מַתְּנֹת קָדְשֵׁיהֶם을 부정확하게 처리함
    rationale: 원문은 ‘모든 그들의 거룩한 예물’의 범위/관련성을 나타내며, ‘예물에 속한 모든 것’이라는 소유 관계를 말하지 않습니다.
  - severity: medium
