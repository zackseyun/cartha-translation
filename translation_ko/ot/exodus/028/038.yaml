id: EXO.28.38
reference: Exodus 28:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
  footnotes:
  - marker: a
    text: Or 'carry the guilt.' The Hebrew idiom 'bear the iniquity' can denote bearing liability for guilt associated with the holy offerings.
    reason: lexical_alternative
  - marker: b
    text: Or 'for favor for them' or 'so that they may be accepted before the LORD.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'the sons of Israel,' a standard covenantal designation for the people of Israel.
    reason: cultural_note
translation:
  language: ko
  text: 그것은 아론의 이마 위에 있을 것이며[a], 아론은 이스라엘 자손이 거룩하게 구별하는 거룩한 것들의 죄책을 지게 될 것입니다. 곧 그들의 거룩한 예물에 속한 모든 것에 대하여 그렇습니다. 그것은 주님 앞에서 그들에게 받아들여지도록[b] 늘 그의 이마 위에 있어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이마’입니다. 여기서는 반복되는 위치 표기를 자연스럽게 옮겼습니다.
    reason: korean_style_note
  - marker: b
    text: 또는 ‘그들에게 호의가 되도록’, ‘그들이 주님 앞에서 받아들여지도록’.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  english_pob_choice: forehead
  chosen_korean: 이마
  alternatives_korean:
  - 이마 앞부분
  - 이마 위
  lexicon: HALOT
  rationale: 신체 부위로서의 뜻을 현대 한국어로 가장 직접적으로 옮기되, 반복되는 부착 위치를 자연스럽게 살리기 위해 ‘이마’로 번역했습니다.
- source_word: נָשָׂא ... עֲוֺן
  english_pob_choice: bear the iniquity
  chosen_korean: 죄책을 지게 될 것입니다
  alternatives_korean:
  - 죄악을 지게 될 것입니다
  - 죄를 짊어지게 될 것입니다
  - 죄책을 감당할 것입니다
  lexicon: HALOT
  rationale: 제사장 문맥의 관용구가 단순한 ‘운반’이 아니라 책임/부담의 지님을 뜻하므로, ‘죄책을 지다’로 옮겨 그 법적·제의적 긴장을 살렸습니다.
- source_word: הַקֳּדָשִׁים
  english_pob_choice: the holy things
  chosen_korean: 거룩한 것들
  alternatives_korean:
  - 성물
  - 거룩한 예물들
  - 성스러운 것들
  lexicon: HALOT
  rationale: 제의적 대상의 범주를 드러내면서도 현대 독자가 이해하기 쉽게 ‘거룩한 것들’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 영어 본문의 문화적 주석과 원문의 남성 복수 표현을 반영하여, 관용적으로 굳어진 성서 표현인 ‘이스라엘 자손’을 유지했습니다.
- source_word: לְרָצוֹן לָהֶם
  english_pob_choice: for acceptance for them
  chosen_korean: 그들에게 받아들여지도록
  alternatives_korean:
  - 그들을 위해 은혜를 얻도록
  - 그들에게 호의를 얻도록
  - 그들이 받아들여지도록
  lexicon: HALOT
  rationale: ‘라쪼ן’의 핵심을 ‘받아들여짐’으로 직역하되, 목적 의미를 한국어 자연문장으로 풀어 오해 없이 전달했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 본문 자체는 신명 표기 ‘야훼’를 가리키지만, 이 절은 제의 규례 문장으로서 한국어 성경 독법에서 가장 자연스러운 경외 표현인 ‘주님’을 본문에 두고, 별도 각주로 원칭을 보완했습니다.
theological_decisions:
- issue: ‘아론이 거룩한 것들의 죄책을 지게 됨’의 의미
  chosen_reading: 아론이 성물과 관련된 결함/부정함에 대한 책임을 제사장 대표로서 지고, 그 결과 예물이 주님 앞에서 받아들여질 수 있다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 아론이 그 죄를 완전히 제거합니다
  - 아론이 단지 상징적으로 짐만 집니다
  rationale: 이 절의 제의적 관용구는 속죄 메커니즘을 지나치게 단순화하지 않으므로, 책임 부담의 의미를 살리되 그 정확한 신학적 범위는 확정하지 않았습니다.
  doctrine_reference: 제의적 책임 전가/대표성의 긴장 보존
- issue: ‘그들에게 받아들여지도록’의 지시 대상
  chosen_reading: 표현은 예물과 그것을 드리는 이스라엘 자손이 주님 앞에서 받아들여지는 상태를 가리키는 넓은 의미로 유지했습니다.
  alternative_readings:
  - 예물만 받아들여지는 뜻입니다
  - 사람들만 받아들여지는 뜻입니다
  rationale: 히브리어의 목적 표현은 제물과 예배자 모두를 포괄할 수 있으므로, 한국어도 범위를 좁히지 않고 유지했습니다.
  doctrine_reference: 문맥이 허용하는 범위 내에서 의미의 폭 보존
