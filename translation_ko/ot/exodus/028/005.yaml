source:
  edition: WLC
  text: וְ/הֵם֙ יִקְח֣וּ אֶת הַ/זָּהָ֔ב וְ/אֶת הַ/תְּכֵ֖לֶת וְ/אֶת הָֽ/אַרְגָּמָ֑ן וְ/אֶת תּוֹלַ֥עַת הַ/שָּׁנִ֖י וְ/אֶת הַ/שֵּֽׁשׁ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/005.yaml
  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
  footnotes:
  - marker: a
    text: Or 'the blue yarn' and 'the purple yarn'; the Hebrew terms can denote dyed textile material, not merely the colors abstractly.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'scarlet of the worm,' an idiom for scarlet material dyed from insect source; hence 'scarlet yarn.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 금과 청색과 자색[a]과 홍색 실[b]과 고운 아마포를 가져와야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘청색’과 ‘자색’에 해당하는 히브리어 낱말은 단순한 색 이름뿐 아니라 염색된 직물 재료를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 문자적으로 ‘벌레의 홍색’입니다. 곤충 유래 염료로 물든 홍색 재료를 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  english_pob_choice: And they
  chosen_korean: 그들은
  alternatives_korean:
  - 그리고 그들은
  - 그들 자신이
  lexicon: HALOT
  rationale: 독립 인칭대명사는 앞 문맥에서 지시된 담당자들을 다시 분명히 하는 역할이므로, 한국어에서는 주어를 직접 드러내는 방식으로 옮겼습니다.
- source_word: יִקְחוּ
  english_pob_choice: shall take
  chosen_korean: 가져야 합니다
  alternatives_korean:
  - 취해야 합니다
  - 가져야 합니다
  lexicon: HALOT
  rationale: 명령/지시 문맥의 미완료형이므로 의무적 지시를 살려 ‘가져야 합니다’로 옮겼습니다.
- source_word: הַתְּכֵלֶת / הָאַרְגָּמָן
  english_pob_choice: the blue / the purple
  chosen_korean: 청색 / 자색
  alternatives_korean:
  - 파란색 / 보라색
  - 푸른 실 / 자주 실
  lexicon: HALOT
  rationale: 이 두 항목은 단순한 색상보다 염색된 직물 재료를 가리킬 수 있지만, 목록의 병렬성과 한국어 가독성을 위해 기본 색채명으로 유지했습니다.
- source_word: תּוֹלַעַת הַשָּׁנִי
  english_pob_choice: the scarlet yarn
  chosen_korean: 홍색 실
  alternatives_korean:
  - 주홍 실
  - 홍색 실
  lexicon: HALOT
  rationale: 히브리어 관용구가 곤충 유래 염색의 붉은 재료를 가리키므로, 색만이 아니라 직물 재료임을 드러내는 ‘실’을 넣었습니다.
- source_word: הַשֵּׁשׁ
  english_pob_choice: the fine linen
  chosen_korean: 가는 베실
  alternatives_korean:
  - 고운 베
  - 고운 삼베
  lexicon: HALOT
  rationale: 성막 맥락의 שֵׁשׁ은 단순한 리넨보다 질 좋은 아마포를 가리키므로, 한국어 성경에서 익숙한 ‘베실’ 계열을 사용해 직물성을 살렸습니다.
theological_decisions:
- issue: 재료 목록의 번역에서 색채명과 직물 재료성의 균형
  chosen_reading: 청색, 자색, 홍색 실, 가는 베실로 직물 제작용 재료 목록을 자연스럽게 제시했습니다.
  alternative_readings:
  - 청색 실, 자색 실, 홍색 실, 가는 베실
  - 파란 실, 보라 실, 주홍 실, 고운 베
  rationale: 본문은 제사장 의복 제작에 쓰일 재료들을 열거하므로, 한국어에서는 색과 재료의 관계가 드러나면서도 과도하게 해설적이지 않은 표현이 적합합니다.
  doctrine_reference: 출애굽기 28장 성막/제사장 의복 규례
