  source_fidelity: 히브리어는 지시적 미완료형으로, 담당자들이 금·청색·자색·주홍색(홍색) 재료·고운 아마포를 취하도록 합니다. 초안의 재료 열거는 대체로 충실하지만, ‘가는 베실’은 הַשֵּׁשׁ(고운 아마포/고운 베)를 실로 한정하여 의미를 좁힙니다. 또한 ‘가져야 합니다’는 이 재료 목록과 결합할 때 다소 부자연스럽습니다.
