lexical_decisions:
- source_word: וְ/עָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 만드십시오
  alternatives_korean:
  - 그리고 당신은 만들 것입니다
  - 또 만드십시오
  lexicon: HALOT
  rationale: 지시문 맥락에서 2인칭 남성 단수 미완료형을 한국어의 공손한 명령형으로 옮기되, 앞의 접속사 וְ는 자연스럽게 생략해 간결한 지시문으로 표현했습니다.
- source_word: מִשְׁבְּצֹת
  english_pob_choice: settings
  chosen_korean: 받침들
  alternatives_korean:
  - 장식 받침들
  - 끼움장치들
  - 세팅들
  lexicon: HALOT
  rationale: 이 말은 귀금속을 고정하는 장식용 장치들을 가리키므로, 바로 뒤 문맥의 보석/사슬과 연결되도록 기능을 드러내는 ‘받침들’로 옮겼습니다. ‘세팅’은 외래어 느낌이 강하고, ‘장식 받침들’은 원문보다 설명이 길어집니다.
- source_word: זָהָב
  english_pob_choice: of gold
  chosen_korean: 금으로 된
  alternatives_korean:
  - 금의
  - 금으로
  lexicon: HALOT
  rationale: 재료를 나타내는 명사구이므로 한국어에서는 ‘금으로 된’이 가장 자연스럽고, 바로 앞 명사와의 결합도 분명하게 드러납니다.
theological_decisions:
- issue: 공예 지시문의 문체
  chosen_reading: 서술형 평서가 아니라 직접적인 제작 명령으로 읽어, ‘만드십시오’로 옮겼습니다.
  alternative_readings:
  - 만들 것입니다
  - 만들어야 합니다
  rationale: 출애굽기의 성막 지침은 규범적 제작 명령이므로, 단순 미래형보다 공손한 명령형이 원문의 기능을 더 잘 전달합니다.
  doctrine_reference: 출애굽기 성막 지시문 번역 원칙
