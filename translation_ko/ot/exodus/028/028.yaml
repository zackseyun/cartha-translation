id: EXO.28.28
reference: Exodus 28:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יִרְכְּס֣וּ אֶת הַ֠/חֹשֶׁן מ/טבעת/ו אֶל טַבְּעֹ֤ת הָ/אֵפֹד֙ בִּ/פְתִ֣יל תְּכֵ֔לֶת לִֽ/הְי֖וֹת עַל חֵ֣שֶׁב הָ/אֵפ֑וֹד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
  footnotes:
  - marker: a
    text: Or 'the breastplate.' The Hebrew term here refers to the priestly chest piece attached to the ephod, not body armor.
    reason: lexical_alternative
  - marker: b
    text: Or 'with a blue cord.' The Hebrew תְּכֵלֶת refers to the blue dyed material used in tabernacle and priestly textiles.
    reason: lexical_alternative
  - marker: c
    text: Or 'shall not be displaced from the ephod.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 흉패의 고리들을 에봇의 고리들에 청색 끈[a]으로 묶어서, 그것이 에봇의 정교하게 짠 띠 위에 있도록 하고[b], 흉패가 에봇에서 풀려나지 않게 해야 합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘푸른 끈’입니다. 히브리어 תְּכֵלֶת은 성막과 제사장 직물에 쓰인 청색 염색 재료를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘에봇의 정교하게 짠 허리띠 위에’입니다. חֵשֶׁב은 에봇의 직조된 띠 또는 허리띠를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘에봇에서 옮겨지지 않게’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹשֶׁן
  english_pob_choice: the breastpiece
  chosen_korean: 흉패
  alternatives_korean:
  - 가슴패
  - 가슴받이
  lexicon: HALOT
  rationale: 제사장의 가슴에 달린 장식용 판을 가리키므로, 전통적이지만 기능을 덜 드러내는 ‘breastplate’보다 의복 맥락을 살린 ‘흉패’가 적절합니다.
- source_word: וְיִרְכְּסוּ
  english_pob_choice: they shall bind
  chosen_korean: 묶어
  alternatives_korean:
  - 고정하여
  - 매어
  lexicon: HALOT
  rationale: 고리와 끈으로 부착하는 동작을 간결하게 살리면서, 기계적이거나 과도하게 해석적인 표현을 피했습니다.
- source_word: בִּפְתִיל תְּכֵלֶת
  english_pob_choice: with a cord of blue yarn
  chosen_korean: 청색 실
  alternatives_korean:
  - 청색 끈
  - 푸른 실
  lexicon: HALOT
  rationale: פְּתִיל은 실/끈의 범위를 가지며, תְּכֵלֶת은 성막 직물의 청색 염색 재료를 가리키므로 ‘청색 실’이 가장 자연스럽고 소스에 충실합니다.
- source_word: חֵשֶׁב הָאֵפֹד
  english_pob_choice: the skillfully woven band of the ephod
  chosen_korean: 에봇의 정교하게 짠 허리띠
  alternatives_korean:
  - 에봇의 짠 띠
  - 에봇의 기술적으로 짠 띠
  lexicon: HALOT
  rationale: חֵשֶׁב은 에봇의 직조된 띠/허리띠를 뜻하므로, 기능과 제작 방식을 함께 드러내는 ‘정교하게 짠 허리띠’로 옮겼습니다.
- source_word: וְלֹא יִזַּח
  english_pob_choice: shall not come loose
  chosen_korean: 풀려나지 않게
  alternatives_korean:
  - 떨어지지 않게
  - 분리되지 않게
  lexicon: HALOT
  rationale: 문맥상 흉패가 에봇에서 떨어져 분리되는 것을 막는 뜻이므로, 의복 결속의 상태를 자연스럽게 드러내는 ‘풀려나지 않게’가 적절합니다.
theological_decisions:
- issue: 제사장 예복의 기술적 묘사에서 의미 과잉을 피하는 번역
  chosen_reading: 본절은 제의 복식의 고정 방식과 안정성을 묘사하므로, 상징을 덧붙이지 않고 결속 동작 자체를 분명히 옮겼습니다.
  alternative_readings:
  - 의례적 상징성을 강조하는 해석적 번역
  - 전통 교회 용어에 맞춘 관습적 표현
  rationale: 본문의 핵심은 흉패가 에봇에서 떨어지지 않도록 하는 물리적 구성입니다. 과도한 신학적 해설보다 소스의 기능적 의미를 보존하는 것이 적절합니다.
  doctrine_reference: 출애굽기 28장의 제사장 복장 규정
