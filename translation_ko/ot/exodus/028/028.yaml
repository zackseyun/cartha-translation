    issue: 결속 대상 표현의 모호성과 어색함
    rationale: ‘흉패를 그것의 고리로 에봇의 고리들에’는 ‘그것’의 선행사가 불명확하며, 원문의 ‘그 흉패의 고리들로/에서 에봇의 고리들에’라는 관계를 자연스럽게 전달하지 못합니다.
  - severity: medium
    issue: 각주 c의 앵커 위치 오류
    rationale: 각주 c는 ‘에봇에서 옮겨지지 않게’라는 마지막 절의 대안인데, 초안에서는 ‘에봇의 정교하게 짠 허리띠 위에’ 뒤에 붙어 있습니다. 해당 마지막 절 뒤로 옮겨야 합니다.
  - severity: low
    issue: פְּתִיל의 기능을 덜 드러내는 ‘실’
