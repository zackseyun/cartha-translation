  text: 그리고 세 번째 줄은 황수정, 마노, 자수정입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기 나오는 보석 이름들은 고대 명칭이라 현대 광물명과 정확히 대응하지 않을 수 있습니다. 영어 POB의 ‘jacinth’에 해당하는 לֶשֶׁם은 전통적으로도 여러 방식으로 옮겨졌습니다.
    reason: lexical_alternative
  - marker: b
    text: שְׁבוֹ는 ‘마노’로 옮겼지만, 고대 보석 용어는 현대의 특정 광물과 정확히 일치하지 않을 수 있습니다. 영어 POB도 ‘agate’ 외에 다른 가능성을 남겨 두었습니다.
    reason: lexical_alternative
