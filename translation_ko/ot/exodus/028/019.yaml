    text: 고대 보석 이름의 정확한 현대 광물 식별은 불확실합니다. לֶשֶׁם은 여기서 ‘히아신스석’으로 옮겼으며, 전통적으로는 ‘리구레’로도 번역합니다.
    reason: lexical_alternative
  - marker: b
    text: שְׁבוֹ는 ‘마노’로 옮겼습니다. 또는 ‘오닉스’일 가능성도 있습니다. 고대 보석 용어는 현대의 특정 광물명과 정확히 일치하지 않을 수 있습니다.
    reason: lexical_alternative
