  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָ/עֲבֹתֹ֔ת תִּתֵּ֖ן עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצ֑וֹת וְ/נָתַתָּ֛ה עַל כִּתְפ֥וֹת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
  footnotes:
  - marker: a
    text: Or “the two ends of the two chains.” The Hebrew term can refer to intertwined cords or chainwork; the surrounding goldwork context favors chain-like construction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 두 줄의 두 끝을 두 설정[a]에 두고, 그것들을 에봇의 어깨 부분들 위에 두십시오. 그것들을 그 앞쪽에 두십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “두 사슬의 두 끝”으로도 번역할 수 있습니다. 히브리어는 꼬인 줄이나 사슬 형태를 가리킬 수 있으며, 주변의 금 세공 문맥은 사슬 같은 구조를 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  english_pob_choice: ends
  chosen_korean: 끝
  alternatives_korean:
  - 끝부분
  - 말단
  lexicon: HALOT
  rationale: 끈/사슬의 종단점을 가리키므로, 현대 한국어에서는 간결한 ‘끝’이 가장 자연스럽고 원문의 공간적 지시를 잘 살립니다.
- source_word: הָעֲבֹתֹת
  english_pob_choice: cords
  chosen_korean: 줄
  alternatives_korean:
  - 끈
  - 사슬
  - 꼬인 줄
  lexicon: HALOT
  rationale: 이 명사는 문맥상 금속 세공으로 된 연결물까지 포괄할 수 있지만, 본문만으로는 ‘사슬’로 단정하기보다 기본 의미를 살린 ‘줄’이 더 중립적입니다.
- source_word: הַמִּשְׁבְּצֹת
  english_pob_choice: settings
  chosen_korean: 설정
  alternatives_korean:
  - 장식틀
  - 받침
  - 세공틀
  lexicon: HALOT
  rationale: 금 장식의 부착부를 가리키므로 ‘설정’이 기능을 전달하지만, 한국어로는 다소 기술적이어서 가장 직역에 가까운 형태로 유지했습니다.
- source_word: כִּתְפֹת
  english_pob_choice: shoulder pieces
  chosen_korean: 어깨 부분들
  alternatives_korean:
  - 어깨 부분
  - 어깨판
  - 어깨
  lexicon: HALOT
  rationale: 사람의 어깨가 아니라 에봇의 구조적 부분을 뜻하므로, ‘어깨 부분들’로 옷의 구성 요소임을 드러냈습니다.
- source_word: אֵפֹד
  english_pob_choice: ephod
  chosen_korean: 에봇
  alternatives_korean:
  - 에봇의 제의복
  - 흉패 달린 제사장복
  lexicon: HALOT
  rationale: 전문 제의 용어이므로 음역을 유지하는 것이 가장 투명합니다.
- source_word: אֶל מוּל פָּנָיו
  english_pob_choice: at its front
  chosen_korean: 그 앞쪽에
  alternatives_korean:
  - 앞면에
  - 그 전면에
  - 그 앞에
  lexicon: HALOT
  rationale: ‘face/front’의 공간 관계를 현대 한국어로 자연스럽게 옮기면서, 에봇의 앞면을 가리키는 지시를 유지했습니다.
