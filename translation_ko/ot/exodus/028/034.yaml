source:
  edition: WLC
  text: פַּעֲמֹ֤ן זָהָב֙ וְ/רִמּ֔וֹן פַּֽעֲמֹ֥ן זָהָ֖ב וְ/רִמּ֑וֹן עַל שׁוּלֵ֥י הַ/מְּעִ֖יל סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/034.yaml
  text: a gold bell and a pomegranate[a], a gold bell and a pomegranate[b], around the hem of the robe all around.
  footnotes:
  - marker: a
    text: Or 'on the hem of the robe all around.' The Hebrew combines the preposition 'on/upon' with an adverb meaning 'around, all around.'
    reason: lexical_alternative
  - marker: b
    text: '''Pomegranate'' likely refers here to a pomegranate-shaped ornament attached between the bells.'
    reason: cultural_note
translation:
  language: ko
  text: 금방울 하나와 석류 하나[b], 금방울 하나와 석류 하나를 그 겉옷의 옷단 둘레에 빙 둘러 달아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 겉옷의 옷단 위에 둘러’라고 할 수 있습니다. 히브리어는 ‘위에’라는 전치사와 ‘둘레에, 사방으로’라는 부사를 함께 써서 위치를 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘석류’는 여기서 방울 사이에 달린 석류 모양 장식을 가리킬 가능성이 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: פַּעֲמֹן
  english_pob_choice: bell
  chosen_korean: 금방울
  alternatives_korean:
  - 방울
  - 종
  lexicon: HALOT
  rationale: 성소 의복에 달린 작은 방울이라는 점을 살려 ‘방울’에 재료를 드러내는 ‘금’을 붙였습니다. ‘종’은 너무 크고 격식이 다른 소리를 줍니다.
- source_word: זָהָב
  english_pob_choice: gold
  chosen_korean: 금
  alternatives_korean:
  - 황금
  - 금빛
  lexicon: HALOT
  rationale: 히브리어의 재료명으로서 자연스럽고 간결하게 ‘금’으로 옮겼습니다. ‘금빛’은 형용사화되어 원문의 명사적 결합을 약화합니다.
- source_word: רִמּוֹן
  english_pob_choice: pomegranate
  chosen_korean: 석류
  alternatives_korean:
  - 석류 모양 장식
  - 석류 장식
  lexicon: HALOT
  rationale: 본문은 기본적으로 ‘석류’라는 শব্দ을 유지하되, 이 문맥에서 장식품일 가능성은 본문에 과도하게 넣지 않고 주석 없이도 읽히게 했습니다.
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  english_pob_choice: around the hem of the robe all around
  chosen_korean: 옷단 둘레에 사방으로
  alternatives_korean:
  - 옷단 위에 둘러
  - 옷단 둘레에
  - 겉옷의 가장자리를 따라
  lexicon: HALOT
  rationale: ‘위에/둘레에’와 ‘사방으로’가 함께 만드는 둘러 배치의 뜻을 살려 자연스러운 한국어로 압축했습니다. ‘옷단’은 의복의 아래 가장자리를, ‘사방으로’는 סָבִיב의 반복적 포위를 반영합니다.
theological_decisions:
- issue: 성소 옷 장식의 반복 배열을 어떻게 드러낼지
  chosen_reading: ‘금방울과 석류 한 개, 금방울과 석류 한 개’를 그대로 반복해 교대로 달린 배치를 보이게 했습니다.
  alternative_readings:
  - ‘금방울과 석류를 번갈아’
  - ‘금방울과 석류가 교대로’
  rationale: 원문의 병렬과 반복을 보존하는 것이 중요하므로, 해석적 요약보다 배열 자체를 드러내는 쪽을 택했습니다.
  doctrine_reference: 출애굽기 28장 제사장 예복의 규정
- issue: רִמּוֹן의 성격을 본문에서 얼마나 풀어쓸지
  chosen_reading: 본문에는 단순히 ‘석류’로 두고, 장식품 가능성은 본문 밖에서만 고려합니다.
  alternative_readings:
  - ‘석류 모양 장식’
  - ‘석류 장식’
  rationale: 영어 POB도 본문에서는 단순어를 유지하고 주석으로 장식품 가능성을 설명하므로, 본문은 히브리어 어휘를 과도하게 해석하지 않게 했습니다.
  doctrine_reference: '번역 원칙: 본문은 원어 표현을 우선 보존'
