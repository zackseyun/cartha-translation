  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
  footnotes:
  - marker: a
    text: Or 'the engravings of a seal.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Israel'; this refers to the tribal descendants of Israel whose names were engraved on the stones.
    reason: cultural_note
translation:
  language: ko
  text: 석을 새기는 장인의 솜씨처럼[a], 도장을 새기는 새김처럼, 두 돌에 이스라엘 자손의 이름[b]을 새기되, 금 테 안에 둘러싸여 있게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘도장의 새김’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘이스라엘 자손’은 이 돌들에 새겨질 지파의 후손들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  english_pob_choice: Like the work of an engraver in stone
  chosen_korean: 석을 새기는 장인의 솜씨처럼
  alternatives_korean:
  - 돌새김 장인의 솜씨처럼
  - 석공의 솜씨처럼
  lexicon: HALOT
  rationale: 히브리어는 단순한 직업명보다 돌을 새기는 장인의 작업 방식과 기술을 가리키므로, 한국어에서도 ‘솜씨’로 비교 관계를 살리고 ‘새기는 장인’으로 기능을 드러냈습니다.
- source_word: פִּתּוּחֵי חֹתָם
  english_pob_choice: the engravings of a signet
  chosen_korean: 도장을 새기는 새김
  alternatives_korean:
  - 도장 새김
  - 인장의 새김
  lexicon: HALOT
  rationale: 장신구 맥락의 ‘signet’는 일반적인 도장보다 새김 무늬와 장식성을 함께 지시하므로, ‘도장을 새기는 새김’으로 반복적 구조를 유지해 형상과 기능을 모두 드러냈습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 문맥상 열두 지파의 계보적 표지를 가리키므로, 성중립화보다 히브리어의 직역적 혈연 표현을 살린 ‘이스라엘 자손’을 택했습니다.
- source_word: מֻסַבֹּת מִשְׁבְּצ֥וֹת זָהָב
  english_pob_choice: enclosed in settings of gold
  chosen_korean: 금 테 안에 둘러싸여 있게
  alternatives_korean:
  - 금 장식 속에 둘러싸여 있게
  - 금 받침에 둘러싸여 있게
  lexicon: HALOT
  rationale: מֻסַבֹּת는 돌이 금으로 둘러싸여 장착된 상태를 뜻하므로, ‘둘러싸여 있게’로 수동적 상태를 보존하고 ‘금 테’로 장식적 장착을 간결하게 옮겼습니다.
theological_decisions:
- issue: 명령형의 한국어 높임과 제사장 제복 제작 지시의 문체
  chosen_reading: ‘하십시오’체 명령으로 번역해 본문이 제사장에게 주는 제작 지시의 공적·규범적 성격을 살렸습니다.
  alternative_readings:
  - ‘~하라’식 평서 명령
  - 더 공손한 청유형
  rationale: 출애굽기 28장의 규정문은 서술이 아니라 제작 명령이므로, 현대 표준어의 합쇼체 명령이 가장 자연스럽고 출판 가능한 톤입니다.
  doctrine_reference: 번역 문체 원칙
- issue: ‘sons of Israel’의 성별 표지 유지
  chosen_reading: ‘이스라엘 자손’으로 옮겨 혈연-지파 표지를 유지했습니다.
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 자녀들
  rationale: 원문의 남성 복수형이 지파 명단의 표지로 기능하므로, 의미를 일반화하기보다 계보적·제의적 용법을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 번역 철학 원칙
