  - 석공의 솜씨처럼
  lexicon: HALOT
  rationale: 히브리어는 단순한 직업명보다 돌을 새기는 장인의 작업 방식과 기술을 가리키므로, 한국어에서도 ‘솜씨’로 비교 관계를 살리고 ‘새기는 장인’으로 기능을 드러냈습니다.
- source_word: פִּתּוּחֵי חֹתָם
  english_pob_choice: the engravings of a signet
  chosen_korean: 도장을 새기는 새김
  alternatives_korean:
  - 도장 새김
  - 인장의 새김
  lexicon: HALOT
  rationale: 장신구 맥락의 ‘signet’는 일반적인 도장보다 새김 무늬와 장식성을 함께 지시하므로, ‘도장을 새기는 새김’으로 반복적 구조를 유지해 형상과 기능을 모두 드러냈습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 문맥상 열두 지파의 계보적 표지를 가리키므로, 성중립화보다 히브리어의 직역적 혈연 표현을 살린 ‘이스라엘 자손’을 택했습니다.
- source_word: מֻסַבֹּת מִשְׁבְּצ֥וֹת זָהָב
  english_pob_choice: enclosed in settings of gold
  chosen_korean: 금 테 안에 둘러싸여 있게
  alternatives_korean:
  - 금 장식 속에 둘러싸여 있게
  - 금 받침에 둘러싸여 있게
  lexicon: HALOT
  rationale: מֻסַבֹּת는 돌이 금으로 둘러싸여 장착된 상태를 뜻하므로, ‘둘러싸여 있게’로 수동적 상태를 보존하고 ‘금 테’로 장식적 장착을 간결하게 옮겼습니다.
theological_decisions:
- issue: 명령형의 한국어 높임과 제사장 제복 제작 지시의 문체
  chosen_reading: ‘하십시오’체 명령으로 번역해 본문이 제사장에게 주는 제작 지시의 공적·규범적 성격을 살렸습니다.
  alternative_readings:
