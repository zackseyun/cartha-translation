translation:
  language: ko
  text: 돌을 새기는 장인의 솜씨로, 인장에 새기는 방식으로[a] 두 돌에 이스라엘 자손의 이름을 새기십시오[b]. 그것들을 금 테에 물려 만드십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인장의 새김처럼’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘이스라엘 자손’은 이 돌들에 이름이 새겨지는 이스라엘의 지파들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  english_pob_choice: Like the work of an engraver in stone
  chosen_korean: 석을 새기는 장인의 솜씨처럼
  alternatives_korean:
