  rationale: 출애굽기 28장의 규정문은 서술이 아니라 제작 명령이므로, 현대 표준어의 합쇼체 명령이 가장 자연스럽고 출판 가능한 톤입니다.
  doctrine_reference: 번역 문체 원칙
- issue: ‘sons of Israel’의 성별 표지 유지
  chosen_reading: ‘이스라엘 자손’으로 옮겨 혈연-지파 표지를 유지했습니다.
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 자녀들
  rationale: 원문의 남성 복수형이 지파 명단의 표지로 기능하므로, 의미를 일반화하기보다 계보적·제의적 용법을 보존하는 쪽이 더 충실합니다.
