  source_fidelity: 현 번역은 첫 구절에서 ‘아론과 그의 아들들을 그들에게 입히고’라고 하여 대상과 여격 대명사가 충돌하며, 의복이라는 목적어도 드러나지 않습니다. 또한 마지막 절은 히브리어의 목적/결과적 제사장 봉사를 한국어 명령문 흐름에 맞게 ‘섬기게 하라’로 옮기는 것이 더 충실합니다.
  naturalness: ‘그들에게 옷을 입히고’와 ‘제사장으로 섬기게 하라’는 현대 표준어 합쇼체 성경 문체에서 자연스럽고 문법적으로 명료합니다. ‘임직시키고’는 타동적 대상 표시에 맞습니다.
  terminology: ‘기름을 부어’, ‘임직시키고’, ‘거룩하게 하여’, ‘제사장으로 섬기게 하라’는 제의적 문맥과 원문의 क्रम서를 적절히 반영합니다. ‘임직’의 관용적 번역에는 직역 각주를 해당 어구에 연결해야 합니다.
