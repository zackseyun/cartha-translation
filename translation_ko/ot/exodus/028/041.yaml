  text: וְ/הִלְבַּשְׁתָּ֤ אֹתָ/ם֙ אֶת אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/אֶת בָּנָ֖י/ו אִתּ֑/וֹ וּ/מָשַׁחְתָּ֨ אֹתָ֜/ם וּ/מִלֵּאתָ֧ אֶת יָדָ֛/ם וְ/קִדַּשְׁתָּ֥ אֹתָ֖/ם וְ/כִהֲנ֥וּ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
  footnotes:
  - marker: a
    text: Literally, 'fill their hands,' a Hebrew idiom for installing or ordaining someone into priestly service.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 네 형 아론과 그의 아들들에게 옷을 입히고, 그들에게 기름을 부어 임직시키고[a] 거룩하게 하여, 그들이 나를 위하여 제사장으로 섬기게 하라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 손을 채우고’입니다. 이는 제사장 직분에 세우는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  english_pob_choice: you shall clothe them
  chosen_korean: 그들에게 입히고
  alternatives_korean:
  - 그들을 옷 입히고
  - 그들에게 옷을 입히고
  lexicon: HALOT
  rationale: 히필형 לבשׁ은 ‘입게 하다/입히다’의 사역 의미를 가지므로, 제의용 의복을 입히는 맥락을 간결하게 살려 ‘입히고’로 옮겼습니다.
- source_word: וּמָשַׁחְתָּ אֹתָם
  english_pob_choice: and you shall anoint them
  chosen_korean: 그들에게 기름을 부어
  alternatives_korean:
  - 그들에게 기름을 바르고
  - 그들을 도유하고
  lexicon: HALOT
  rationale: משׁח은 제사장 위임 문맥에서 기술적 용법의 ‘기름 붓다/도유하다’이므로, 한국어 성경 문체에서도 자연스러운 ‘기름을 부어’를 택했습니다.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  english_pob_choice: and ordain them
  chosen_korean: 임직하고
  alternatives_korean:
  - 그들의 손을 채우고
  - 임명하고
  lexicon: HALOT
  rationale: 직역인 ‘손을 채우고’는 한국어에서 의미가 불투명하므로, 제사장 직분에 임하게 하는 관용적 의미를 드러내는 ‘임직하고’로 옮겼습니다.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  english_pob_choice: and consecrate them
  chosen_korean: 거룩하게 하라
  alternatives_korean:
  - 성별하라
  - 성결하게 하라
  lexicon: HALOT
  rationale: קדשׁ은 제의적으로 구별하여 거룩하게 한다는 뜻이므로, 동사형으로 자연스럽고 분명한 ‘거룩하게 하라’를 사용했습니다.
- source_word: וְכִהֲנוּ לִי
  english_pob_choice: and they shall serve as priests to me
  chosen_korean: 그들이 나를 섬기는 제사장이 될 것입니다
  alternatives_korean:
  - 그들이 내게 제사장으로 봉사할 것입니다
  - 그들이 나를 위해 제사장으로 섬길 것입니다
  lexicon: HALOT
  rationale: כהן의 동사적 의미인 ‘제사장으로 기능하다/섬기다’를 살리면서, לִי의 직접성을 유지하기 위해 ‘나를 섬기는 제사장’으로 옮겼습니다.
theological_decisions:
- issue: 제사장 위임 절차를 한국어로 어떻게 드러낼지
  chosen_reading: ‘기름을 부어 임직하고 거룩하게 하라’로 제의적 위임의 세 단계를 분명히 표현했습니다.
  alternative_readings:
  - ‘도유하고 안수하여 성별하라’
  - ‘기름을 붓고 임명하여 거룩하게 하라’
  rationale: 본문은 의복 착용, 도유, 위임, 성별, 그리고 제사장 직무 수행을 순차적으로 제시하므로, 한국어에서도 절차성이 보이도록 직분 위임의 표준적 표현을 사용했습니다.
  doctrine_reference: 출 28:41 제사장 직분 위임 문맥; 번역 원칙 §1, §3
- issue: 원문 순서와 수식 관계를 어떻게 반영할지
  chosen_reading: ‘너는 네 형 아론과 그의 아들들을 그들에게 입히고’로 대상과 행위를 먼저 분명히 하고, 뒤이어 도유·임직·성별을 연결했습니다.
  alternative_readings:
  - ‘너는 아론 네 형과 그의 아들들에게 옷을 입히고’
  - ‘너는 네 형 아론과 그의 아들들을 그들에게 입혀라’
  rationale: 히브리어는 대명사와 동격 구조로 대상을 강조하므로, 한국어에서도 읽기 자연성을 해치지 않는 범위에서 그 관계를 드러내는 방식으로 정리했습니다.
  doctrine_reference: 출 28:41 문법 구조
