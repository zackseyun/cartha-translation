lexical_decisions:
- source_word: שְׁתֵּי טַבְּע֣וֹת זָהָ֔ב
  english_pob_choice: two gold rings
  chosen_korean: 금 고리 두 개
  alternatives_korean:
  - 두 금 고리
  - 금으로 만든 고리 두 개
  lexicon: HALOT
  rationale: 수량과 재료를 자연스러운 현대 한국어로 옮겼으며, 제작 지시문이라는 문맥을 살려 간결하게 표현했습니다.
- source_word: עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן
  english_pob_choice: on the two ends of the breastpiece
  chosen_korean: 흉패의 두 끝
  alternatives_korean:
  - 흉패의 두 가장자리
  - 흉패의 양 끝
  lexicon: HALOT
  rationale: קצה의 기본 의미인 ‘끝’을 유지하되, 한국어에서 자연스러운 복수 표현으로 옮겼습니다.
- source_word: עַל שְׂפָת֕/וֹ
  english_pob_choice: on its edge
  chosen_korean: 가장자리에
  alternatives_korean:
  - 테두리에
  - 모서리에
  lexicon: HALOT
  rationale: שָׂפָה는 물건의 가장자리/테두리를 뜻하므로, 의복 부속품에 가장 무난하고 명료한 ‘가장자리’를 택했습니다.
- source_word: אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה
  english_pob_choice: that is toward the inner side of the ephod
  chosen_korean: 에봇의 안쪽을 향한
  alternatives_korean:
  - 에봇의 안쪽을 향하는
  - 에봇의 안쪽 면을 향한
  lexicon: HALOT
  rationale: עֵבֶר와 בָּיְתָה의 공간 관계를 살려, ‘안쪽을 향한’으로 간명하게 표현했습니다.
theological_decisions:
