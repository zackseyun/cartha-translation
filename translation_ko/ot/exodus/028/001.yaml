  rationale: 원문의 명령형과 아론의 아들들이 아론과 함께 소집된다는 표지를 복원했습니다. ‘가까이 데려오십시오’는 הַקְרֵב אֵלֶיךָ의 구체적 접근 의미를, ‘나를 위하여 제사장으로 섬기게 하십시오’는 לְכַהֲנוֹ לִי의 목적과 제사장 직무를 보존합니다. 인명 목록과 ‘아론의 아들들’이라는 마지막 동격 표지도 유지했습니다.
