base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
  footnotes:
  - marker: a
    text: Or, 'from among the Israelites.' The Hebrew literally says 'from among the sons of Israel,' a standard covenant people designation.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 네 형 아론과 그의 아들들을 함께 이스라엘 자손 가운데서 네게로 가까이 데려오십시오. 그들이 나를 위하여 제사장으로 섬기게 하십시오. 곧 아론과 그의 아들들인 나답과 아비후와 엘르아살과 이다말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역형입니다. 현대 독자를 위해 ‘이스라엘 사람들’로 풀어 읽을 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב אֵלֶיךָ
  english_pob_choice: bring near to yourself
  chosen_korean: 네게로 가까이 데려다가
  alternatives_korean:
  - 네 앞에 데려다가
  - 네게 데려다가
  lexicon: HALOT
  rationale: 히필 קרב의 제의적 뉘앙스를 살려 단순한 ‘부르다’보다 ‘가까이 데려오다’로 옮겼고, אֵלֶיךָ의 방향성도 반영했습니다.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  english_pob_choice: from among the sons of Israel
  chosen_korean: 이스라엘 자손 가운데서
  alternatives_korean:
  - 이스라엘 사람들 가운데서
  - 이스라엘인들 가운데서
  lexicon: HALOT
  rationale: 공동체 내부에서의 선발이라는 뜻을 살리되, 한국어에서는 ‘자손’이 집합적 언약 백성 표현으로 자연스럽습니다.
- source_word: לְכַהֲנֹו לִי
  english_pob_choice: to serve as priests for me
  chosen_korean: 나를 섬기는 제사장들로 삼아야 합니다
  alternatives_korean:
  - 나를 위해 제사장으로 섬기게 해야 합니다
  - 내게 제사장 직분을 맡겨야 합니다
  lexicon: HALOT
  rationale: כהן의 제의적 직무를 ‘제사장’으로 분명히 하되, 단순 직함보다 ‘섬기다’로 봉사와 직무 수행을 함께 드러냈습니다.
- source_word: בְּנֵי אַהֲרֹן
  english_pob_choice: Aaron’s sons
  chosen_korean: 아론의 아들들
  alternatives_korean:
  - 아론의 자녀들
  - 아론에게서 난 아들들
  lexicon: HALOT
  rationale: 히브리어 친족 표지를 자연스러운 한국어 소유격으로 옮겨 이름 목록의 동격 구조를 유지했습니다.
theological_decisions:
- issue: 제사장 직무의 소명성
  chosen_reading: ‘가까이 데려다가 … 제사장들로 삼아야 합니다’로 옮겨, 아론과 그의 아들들이 단순 임명이 아니라 야훼 앞에서의 거룩한 봉사에 구별되는 장면을 드러냈습니다.
  alternative_readings:
  - ‘임명해야 합니다’
  - ‘세워야 합니다’
  rationale: 본문의 핵심은 일반 행정 임명이 아니라 제의적 접근과 구별입니다. לכן ‘가까이 데려가다’와 ‘제사장들로 삼다’가 יחד 함께 그 긴장을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §4; priestly consecration context in Exodus 28
