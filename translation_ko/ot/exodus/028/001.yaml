  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 선발의 범위(‘이스라엘 자손 가운데서’)와 제사장 직무를 대체로 잘 반영하지만, בָּנָיו אִתּוֹ의 동반 의미(‘그의 아들들을 그와 함께’)가 명시되지 않았습니다. 또한 히브리어의 명령형 הַקְרֵב은 합쇼체 명령문으로 옮기는 편이 더 직접적이고 충실합니다.
  naturalness: ‘너는 … 삼아야 합니다’는 본문이 모세에게 하는 명령이라는 점에서 다소 우회적입니다. ‘데려오십시오’와 ‘섬기게 하십시오’로 옮기면 현대 표준 한국어 합쇼체로 자연스럽고 문장 구조도 명료해집니다.
  terminology: ‘이스라엘 자손’, ‘제사장’, ‘아론의 아들들’은 적절합니다. ‘나를 위하여 제사장으로 섬기게 하십시오’는 לְכַהֲנוֹ לִי의 제사장적 봉사와 하나님을 향한 방향을 과도한 신학적 해석 없이 반영합니다. 인명 표기는 통용 성서 표기인 ‘아론, 나답, 아비후, 엘르아살, 이다말’을 유지합니다.
