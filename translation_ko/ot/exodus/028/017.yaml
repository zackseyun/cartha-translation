review_pass:
  verdict: revise
  source_fidelity: 히브리어는 흉패 안에 돌을 물려 넣어 네 줄로 배열하라는 뜻입니다. 초안의 ‘네 개의 돌의 자리’는 네 줄을 네 개의 자리로 잘못 연결할 여지가 있고, ‘돌의 네 줄’도 부자연스럽습니다.
  naturalness: ‘그 안에 보석을 박아 네 줄로 배열해야 합니다’는 장인 작업의 맥락과 현대 표준 한국어의 자연스러운 표현을 함께 살립니다. ‘첫째 줄’도 순서상 정확합니다.
  terminology: 보석의 광물학적 동일시는 확정하기 어려우므로 한국어 성경에서 널리 쓰이는 ‘홍보석, 황옥, 녹주옥’을 사용하고, 영어 POB 감사 기록의 대안을 각 항목에 맞추어 각주에 보존합니다.
  issues:
  - severity: medium
    issue: ‘네 개의 돌의 자리’라는 표현
    rationale: אַרְבָּעָה טוּרִים은 ‘네 줄’이며, 네 개의 개별 자리라는 뜻이 아닙니다. 또한 ‘돌의 자리’가 무엇을 네 줄로 한다는지 불명확합니다.
  - severity: low
    issue: 보석 각주의 대안 대응
    rationale: 초안은 본문의 ‘홍옥수’를 다시 ‘루비’로도 옮길 수 있다고 하여 주본문과 대안의 관계가 불명확하며, 영어 감사 기록의 홍옥수(carnelian) 대안을 빠뜨립니다.
  revised_text: 그 안에 보석을 박아 네 줄로 배열해야 합니다. 첫째 줄은 홍보석, 황옥, 녹주옥이어야 합니다.
  revised_footnotes:
  - marker: a
    text: 이 보석들의 정확한 광물학적 동일시는 확실하지 않습니다. ‘홍보석’은 루비 또는 홍옥수일 수 있고, ‘황옥’은 토파즈 또는 감람석(크리솔라이트/페리도트)일 수 있으며, ‘녹주옥’은 에메랄드 또는 베릴일 수 있습니다.
    reason: lexical_alternative
  revision_rationale: ‘보석을 박아 네 줄로 배열하다’로 מִלֻּאַת אֶבֶן과 네 줄의 배열을 자연스럽고 정확하게 반영했습니다. 보석 이름은 전통적 한국어 성경 용례를 따르되, 불확실한 식별과 영어 POB의 관련 대안을 각주에 명시했습니다.
