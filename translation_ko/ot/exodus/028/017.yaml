base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
  footnotes:
  - marker: a
    text: The precise identification of these gemstones is uncertain. 'Ruby' may also be 'carnelian'; 'topaz' may also be 'chrysolite' or 'peridot'; 'emerald' may also be 'beryl.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 속에 네 개의 돌의 자리[a], 곧 돌의 네 줄을 두어야 합니다. 첫째 줄은 홍옥수, 황옥, 녹주옥이어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 보석들의 정확한 동일시는 확실하지 않습니다. ‘홍옥수’는 ‘루비’로도, ‘황옥’은 ‘토파즈’ 또는 ‘감람석’으로도, ‘녹주옥’은 ‘에메랄드’ 또는 ‘베릴’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ ... מִלֻּאַת אֶבֶן
  english_pob_choice: And you shall set in it settings of stones
  chosen_korean: 그 속에 ... 돌의 자리
  alternatives_korean:
  - 그 안에 ... 돌의 받침
  - 그 안에 ... 돌의 세팅
  lexicon: HALOT
  rationale: מלא는 직역하면 ‘채우다’이지만, 보석을 흉패에 끼워 넣는 맥락에서는 ‘자리/받침’을 두는 뜻이 자연스럽습니다.
- source_word: אַרְבָּעָה טוּרִים
  english_pob_choice: four rows
  chosen_korean: 돌의 네 줄
  alternatives_korean:
  - 네 줄의 돌
  - 네 개의 줄
  lexicon: HALOT
  rationale: טוּר는 보석이 배열된 ‘줄’이므로 현대 한국어에서도 ‘줄’이 가장 분명합니다.
- source_word: אֹדֶם
  english_pob_choice: ruby
  chosen_korean: 홍옥수
  alternatives_korean:
  - 루비
  - 적옥
  lexicon: HALOT
  rationale: 이 보석 명칭은 정확한 동일시가 불확실하므로, 전통적 ‘루비’보다 원문 대응을 더 살리면서도 학술적으로 무난한 ‘홍옥수’를 택했습니다.
- source_word: פִּטְדָה
  english_pob_choice: topaz
  chosen_korean: 황옥
  alternatives_korean:
  - 토파즈
  - 감람석
  lexicon: HALOT
  rationale: 이 항목도 동일시가 불확실하므로, 음역보다 의미상 대응을 드러내는 ‘황옥’을 채택했습니다.
- source_word: וּבָרֶקֶת
  english_pob_choice: and an emerald
  chosen_korean: 녹주옥
  alternatives_korean:
  - 에메랄드
  - 베릴
  lexicon: HALOT
  rationale: 바라케트는 빛남과 연관된 어근을 가진 보석 이름으로, 전통적 ‘에메랄드’ 대신 보다 중립적인 ‘녹주옥’을 사용했습니다.
