source:
  edition: WLC
  text: שְׁתֵּ֧י כְתֵפֹ֣ת חֹֽבְרֹ֗ת יִֽהְיֶה לּ֛/וֹ אֶל שְׁנֵ֥י קְצוֹתָ֖י/ו וְ/חֻבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/007.yaml
  text: It shall have two shoulder pieces joined to its two ends[b][a], so that it may be joined together.
  footnotes:
  - marker: a
    text: Or 'two shoulder straps.' The Hebrew term can denote shoulder-related parts of the garment rather than literal shoulders.
    reason: lexical_alternative
  - marker: b
    text: Or 'and it shall be joined.' The final clause may be rendered more formally, but the sense is that the garment is fastened together by these shoulder pieces.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것에는 두 개의 어깨 부분이 양쪽 끝에 붙어 있어, 한 몸으로 이어지게 해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “어깨끈”. 히브리어 용어는 문자적인 어깨가 아니라 의복의 어깨 부위를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그것이 연결되게 하라”. 마지막 절은 더 직역적으로 옮길 수 있지만, 뜻은 이 어깨 부분들로 옷이 함께 결합되게 하는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי
  english_pob_choice: two
  chosen_korean: 두 개의
  alternatives_korean:
  - 두
  - 둘의
  lexicon: HALOT
  rationale: 히브리어 수사 עשר/שְׁתֵּי는 여기서 어깨 부분을 수식하는 단순 수량 표현이므로 자연스러운 현대 한국어로 ‘두 개의’라고 옮겼습니다.
- source_word: כְתֵפֹת
  english_pob_choice: shoulder pieces
  chosen_korean: 어깨 부분
  alternatives_korean:
  - 어깨끈
  - 어깨 조각
  - 어깨 부분들
  lexicon: HALOT
  rationale: 의복 제작 문맥에서 문자적인 ‘어깨’가 아니라 겉옷의 어깨에 해당하는 부위를 가리키므로, 지나치게 도식적인 ‘어깨끈’보다 중립적인 ‘어깨 부분’이 원문 범위를 잘 보존합니다.
- source_word: חֹבְרֹת
  english_pob_choice: joined / attached
  chosen_korean: 붙어 있어
  alternatives_korean:
  - 이어져
  - 연결되어
  - 붙어
  lexicon: HALOT
  rationale: חבר의 연결/결합 의미를 반영하되, 의복 구조를 설명하는 문맥에서는 ‘붙어 있어’가 가장 자연스럽고 결과 상태도 드러냅니다.
- source_word: וְחֻבָּר
  english_pob_choice: so that it may be joined together
  chosen_korean: 한 몸으로 이어지게 해야 합니다
  alternatives_korean:
  - 이어지게 해야 합니다
  - 결합되게 해야 합니다
  - 하나로 붙게 해야 합니다
  lexicon: HALOT
  rationale: 마지막 수동형은 앞의 부착이 가져오는 결과를 나타내므로, 단순 반복을 피하면서도 전체 의복이 하나로 결합된다는 뜻을 분명히 하는 방향으로 옮겼습니다.
