revisions:
- from: 그리고 너는 두 돌을 에봇의 어깨끈 위에, 이스라엘 자손의 기념 돌로 두어야 합니다. 아론은 그 이름들을 여호와 앞에서 자기 두 어깨 위에 메고, 기념하게 해야 합니다.[a][b]
  to: 너는 그 두 돌을 에봇의 어깨 부분에 두어 이스라엘 자손을 위한 기념 돌로 삼으십시오. 아론은 그들의 이름을 야훼 앞에서 그의 두 어깨에 메어 기억을 위해 간직할 것입니다.[a][b]
  rationale: 후반절을 원문의 ‘이름들을 … 두 어깨에 메다’와 ‘기억을 위해’라는 구조에 맞추어 수정하고, 에봇의 부위를 과도하게 특정하지 않았습니다. 명령과 미래 규정의 구분을 합쇼체로 자연스럽게 드러냈으며, 신명 표기를 POB의 Yahweh 결정과 일치시켰습니다.
