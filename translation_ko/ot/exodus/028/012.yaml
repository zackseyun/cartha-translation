source:
  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
  footnotes:
  - marker: a
    text: Or 'stones of remembrance.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Israel,' a familial covenant expression often referring to the people of Israel as a whole.
    reason: cultural_note
translation:
  language: ko
  text: 너는 그 두 돌을 에봇의 어깨 부분에 두어 이스라엘 자손을 위한 기념 돌로 삼으십시오. 아론은 그들의 이름을 야훼 앞에서 그의 두 어깨에 메어 기억을 위해 간직할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기념 돌’은 직역하면 ‘기억의 돌’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 이스라엘 전체를 가리킬 수 있는 언약적 친족 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  english_pob_choice: And you shall set
  chosen_korean: 두어야 합니다
  alternatives_korean:
  - 놓아야 합니다
  - 설치해야 합니다
  - 두십시오
  lexicon: HALOT
  rationale: 돌을 제의적 장식물 위에 정해진 위치에 배치하는 뜻을 살려, 단순한 ‘놓다’보다 목적성이 드러나는 ‘두다’를 택했습니다.
- source_word: כִּתְפֹת הָאֵפֹד
  english_pob_choice: the shoulder pieces of the ephod
  chosen_korean: 에봇의 어깨끈
  alternatives_korean:
  - 에봇의 어깨 부분
  - 에봇의 어깨장식
  lexicon: HALOT
  rationale: 옷의 문자적 어깨가 아니라 에봇의 구조적 어깨 부분을 가리키므로, 현대 한국어에서 자연스럽고 시각적으로 분명한 ‘어깨끈’으로 옮겼습니다.
- source_word: אַבְנֵי זִכָּרֹן
  english_pob_choice: memorial stones
  chosen_korean: 기념 돌
  alternatives_korean:
  - 기억 돌
  - 추모 돌
  - 기념석
  lexicon: HALOT
  rationale: ‘기념/기억’의 기능을 살리되, 제의 용어로 지나치게 굳지 않도록 간결한 ‘기념 돌’을 채택했습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: for the sons of Israel
  chosen_korean: 이스라엘 자손의
  alternatives_korean:
  - 이스라엘 사람들의
  - 이스라엘 백성의
  lexicon: HALOT
  rationale: 히브리어의 친족·언약 표현을 평탄화하지 않고, 원문의 대표성 있는 ‘자손’ 표현을 유지했습니다.
- source_word: וְנָשָׂא ... עַל שְׁתֵּי כְתֵפָיו לְזִכָּרֹן
  english_pob_choice: and Aaron shall bear their names ... on his two shoulders for remembrance
  chosen_korean: 아론은 그 이름들을 ... 자기 두 어깨 위에 메고, 기념하게 해야 합니다
  alternatives_korean:
  - 아론은 그 이름들을 ... 자기 두 어깨 위에 지고, 기억하게 해야 합니다
  - 아론은 그 이름들을 ... 자기 두 어깨 위에 메어, 기념이 되게 해야 합니다
  lexicon: HALOT
  rationale: ‘메다’는 어깨에 짊어지다라는 감각을 유지해 제의적 대표 징표를 살리고, 마지막의 ‘기념하게 하다’는 לְזִכָּרֹן의 목적성을 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 이 데이터셋의 영어 본문이 이미 관습적 교회 번역을 따르는 만큼, 한국어 본문도 이 범위에서는 통용되는 ‘여호와’를 사용해 음역 일관성을 맞췄습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 집합적이면서도 친족적인 언어
  chosen_reading: ‘이스라엘 자손’으로 직역해 언약적 가족 언어를 보존했습니다.
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  rationale: 원문은 단순한 국민 집합이 아니라 언약 공동체의 계보적 표현을 사용하므로, 이를 중화하지 않고 유지하는 것이 의미를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
