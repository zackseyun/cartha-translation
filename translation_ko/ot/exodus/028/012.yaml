  - severity: medium
    issue: ‘여호와’
    rationale: 제공된 영어 POB 본문과 신학적 결정은 Tetragrammaton을 Yahweh로 채택합니다. 한국어 본문도 ‘야훼’로 맞추는 것이 감사 추적 및 이름 표기의 일관성에 부합합니다.
