source:
  edition: WLC
  text: וְ/הָיָ֥ה עַֽל אַהֲרֹ֖ן לְ/שָׁרֵ֑ת וְ/נִשְׁמַ֣ע ק֠וֹל/וֹ בְּ/בֹא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ לִ/פְנֵ֧י יְהוָ֛ה וּ/בְ/צֵאת֖/וֹ וְ/לֹ֥א יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
  footnotes:
  - marker: a
    text: Or, more formally, 'and the sound of it shall be heard'; the Hebrew suffix likely refers to the robe with its bells.
    reason: lexical_alternative
  - marker: b
    text: Or 'into the sanctuary'; Hebrew 'the holy place' here refers to the sacred tabernacle space before the LORD.
    reason: lexical_alternative
  - marker: c
    text: Or 'lest he die.'
    reason: alternative_reading
translation:
  language: ko
  text: 아론이 직무를 행할 때 그것은 그 위에 있어야 하며, 그 울림은 그가 야훼 앞 성소에 들어갈 때와 나올 때 들려야 합니다. 그리하여 그는 죽지 않아야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘울림’은 앞문맥의 방울 달린 옷에 대한 지시를 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘성소’는 여기서 성막의 거룩한 공간을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 ‘들려야 합니다’는 제사장의 출입 시 방울 소리가 들리게 하라는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  english_pob_choice: It shall be on Aaron
  chosen_korean: 아론이 직무를 행할 때 그것은 그 위에 있어야 하며
  alternatives_korean:
  - 아론 위에 있어야 하며
  - 아론에게 있어야 하며
  lexicon: HALOT
  rationale: 지시 대상은 아론 자신이 아니라 앞절의 의복이므로, ‘그 위에 있어야 하며’로 옷의 착용 상태를 자연스럽게 살렸습니다.
- source_word: לְשָׁרֵת
  english_pob_choice: when he ministers
  chosen_korean: 직무를 행할 때
  alternatives_korean:
  - 섬길 때
  - 봉사할 때
  lexicon: HALOT
  rationale: 제사장 직무의 문맥이므로 일반적 ‘봉사’보다 제의적 기능을 드러내는 ‘직무를 행하다’가 더 정확합니다.
- source_word: וְנִשְׁמַע קֹלוֹ
  english_pob_choice: and its sound shall be heard
  chosen_korean: 그 울림은 들려야 합니다
  alternatives_korean:
  - 그 소리는 들려야 합니다
  - 그의 소리는 들려야 합니다
  lexicon: HALOT
  rationale: 영문 POB의 각주처럼 지시어는 아론이 아니라 방울 달린 옷에 더 자연스럽게 연결되므로, ‘울림’으로 번역해 시각적·청각적 효과를 살렸습니다.
- source_word: אֶל הַקֹּדֶשׁ
  english_pob_choice: into the Holy Place
  chosen_korean: 성소에
  alternatives_korean:
  - 거룩한 곳에
  - 거룩소에
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥에서 הַקֹּדֶשׁ는 단순한 추상적 ‘거룩’이 아니라 성막의 거룩한 공간이므로, ‘성소’가 가장 간결하고 정확합니다.
- source_word: יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞
  alternatives_korean:
  - 여호와 앞
  - 주 앞
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 프로젝트 기본어에 따라 하나님의 이름은 ‘야훼’로 옮기며, 출입의 방향성은 ‘앞’으로 간명하게 유지했습니다.
theological_decisions:
- issue: 죽음 방지의 목적·결과 관계
  chosen_reading: ‘그리하여 그는 죽지 않아야 합니다’로 옮겨, 의복 착용이 제의적 생명 보전의 조건임을 드러냈습니다.
  alternative_readings:
  - 그리하여 그는 죽지 않게 됩니다
  - 그리하여 그가 죽지 않도록 해야 합니다
  rationale: 히브리어의 부정절은 단순 미래 진술보다 결과/목적의 뉘앙스를 띠므로, 규범적·예방적 의미를 살린 표현이 문맥에 가장 잘 맞습니다.
  doctrine_reference: 제의 규정의 경고적 기능; 성막 거룩성 유지
