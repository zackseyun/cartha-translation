  rationale: 히브리어 מִמֶּנּוּ는 단순 출처가 아니라 구조적 일체성을 뜻하는 문맥이므로, 제의 기물 제작 지시의 의미를 더 분명히 드러냈습니다.
  doctrine_reference: 성막/제의 기물의 규정성과 상징성
