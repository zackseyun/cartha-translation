  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ תִּהְיֶ֣יןָ קַרְנֹתָ֑י/ו וְ/צִפִּיתָ֥ אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/002.yaml
  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
  footnotes:
  - marker: a
    text: Or 'its horns shall be from it,' that is, formed as one piece with the altar rather than attached separately.
    reason: lexical_alternative
  - marker: b
    text: Hebrew nechoshet can refer to bronze or copper; 'bronze' is chosen here as the most likely sense in this construction context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 네 모퉁이 위에 그 뿔들을 만드십시오[a]. 그 뿔들은 그것과 한 덩어리여야 하며[b], 그것을 놋으로 입히십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 뿔들은 그것에게서 나와야 합니다.’ 곧 제단에 따로 붙인 것이 아니라 한 덩어리로 만들어야 한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그것에게서 그 뿔들이 될 것이다’입니다. 여기서는 제단과 일체인 구조를 뜻하는 것으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 만드십시오
  alternatives_korean:
  - 만들어야 합니다
  - 만드세요
  lexicon: HALOT
  rationale: 명령형 지시문으로서의 כוח을 살리되, 현대 합쇼체의 직접 명령으로 자연스럽게 옮겼습니다.
- source_word: קַרְנֹתָיו
  english_pob_choice: its horns
  chosen_korean: 그 뿔들
  alternatives_korean:
  - 그 뿔
  - 뿔들
  lexicon: HALOT
  rationale: 제단의 돌출부를 가리키는 구체적 명칭이므로 ‘뿔들’로 옮겨 문자적 이미지와 복수형을 살렸습니다.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  english_pob_choice: its horns shall be of one piece with it
  chosen_korean: 그 뿔들은 그것과 한 덩어리여야 하며
  alternatives_korean:
  - 그 뿔들은 그것에게서 나와야 하며
  - 그 뿔들은 그것에 붙어 있어야 하며
  lexicon: HALOT
  rationale: 히브리어의 ‘그것에게서’라는 직역보다, 따로 붙인 것이 아니라 제단과 일체라는 뜻을 드러내는 한국어 관용으로 옮겼습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 출애굽기 제의 기물 문맥에서 전통적으로 ‘놋’이 가장 자연스러운 한국어이며, POB의 ‘bronze’와도 실질적으로 대응합니다.
theological_decisions:
- issue: 제단의 뿔이 별도 부착물인지, 본체와 일체인지
  chosen_reading: ‘그 뿔들은 그것과 한 덩어리여야 하며’로 번역해 본체와 통합된 구조임을 분명히 했습니다.
  alternative_readings:
  - ‘그 뿔들은 그것에게서 나와야 하며’
  - ‘그 뿔들은 그것에 붙여야 하며’
  rationale: 히브리어 מִמֶּנּוּ는 단순 출처가 아니라 구조적 일체성을 뜻하는 문맥이므로, 제의 기물 제작 지시의 의미를 더 분명히 드러냈습니다.
  doctrine_reference: 성막/제의 기물의 규정성과 상징성
