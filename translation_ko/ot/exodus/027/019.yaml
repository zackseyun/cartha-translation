  text: לְ/כֹל֙ כְּלֵ֣י הַ/מִּשְׁכָּ֔ן בְּ/כֹ֖ל עֲבֹדָת֑/וֹ וְ/כָל יְתֵדֹתָ֛י/ו וְ/כָל יִתְדֹ֥ת הֶ/חָצֵ֖ר נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
  footnotes:
  - marker: a
    text: Or 'copper' for 'bronze'; the Hebrew נְחֹשֶׁת can refer broadly to copper-based metal.
    reason: lexical_alternative
translation:
  language: ko
  text: 성막의 모든 기구와 그 모든 쓰임을 위한 것, 그리고 그 모든 말뚝과 뜰의 모든 말뚝은 놋으로 만들어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘놋’은 כאן נְחֹשֶׁת의 관용적 번역입니다. 문맥에 따라 구리 기반 금속 전반을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֹל כְּלֵי הַמִּשְׁכָּן
  english_pob_choice: All the utensils of the tabernacle
  chosen_korean: 성막의 모든 기구
  alternatives_korean:
  - 성막의 모든 그릇
  - 성막의 모든 기물
  - 성막의 모든 도구
  lexicon: HALOT
  rationale: כְּלִי는 예배용의 넓은 의미의 기구·도구를 가리키므로, 성막 문맥에서는 ‘기구’가 가장 자연스럽고 과도하게 좁히지 않습니다.
- source_word: בְּכֹל עֲבֹדָתוֹ
  english_pob_choice: for all its service
  chosen_korean: 그 모든 쓰임을 위한 것
  alternatives_korean:
  - 그 모든 섬김을 위한 것
  - 그 모든 봉사를 위한 것
  - 그 모든 일에 쓰이는 것
  lexicon: HALOT
  rationale: עֲבֹדָה는 여기서 성막의 기능적 사용을 뜻하므로, 제의적 ‘섬김’보다 사물의 용도를 드러내는 ‘쓰임’이 한국어 문맥에 더 맞습니다.
- source_word: יְתֵדֹתָיו / יִתְדֹת הֶחָצֵר
  english_pob_choice: its pegs / the pegs of the courtyard
  chosen_korean: 그 모든 말뚝과 뜰의 모든 말뚝
  alternatives_korean:
  - 그 모든 못과 뜰의 모든 못
  - 그 모든 말뚝과 뜰의 모든 말뚝들
  - 그 모든 팩과 뜰의 모든 팩
  lexicon: HALOT
  rationale: יָתֵד는 천막이나 구조물을 고정하는 말뚝/못인데, 성막과 뜰의 고정용품이라는 점을 살려 ‘말뚝’으로 옮겼습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성막 재료 목록에서 נְחֹשֶׁת은 전통적으로 ‘놋’으로 널리 쓰이며, 재질 항목의 관용적 한국어 표현으로도 가장 안정적입니다.
theological_decisions:
- issue: 명령형 종결의 문체
  chosen_reading: 본문의 제작 규정 성격을 살려 ‘만들어야 합니다’로 옮겼습니다.
  alternative_readings:
  - ‘…할지니라’
  - ‘…되어야 합니다’
  rationale: 히브리어 문맥은 규범적 지시이므로, 현대 한국어의 자연스러운 의무 표현을 택하되 고어체는 피했습니다.
  doctrine_reference: 출애굽기 성막 규정의 지시 문체
