base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/012.yaml
  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
  footnotes:
  - marker: a
    text: Hebrew literally 'sea side,' a standard idiom for the west side.
    reason: lexical_alternative
  - marker: b
    text: Or 'sockets' for 'bases.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뜰의 서쪽[a] 너비에는 오십 규빗의 휘장을 치고, 그 기둥은 열 개이며 그 받침[b]도 열 개입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바다 쪽’이며, 이 문맥에서는 관용적으로 서쪽을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소켓’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת יָם
  english_pob_choice: on the west side
  chosen_korean: 서쪽 곧 바다 쪽에
  alternatives_korean:
  - 서쪽 면에
  - 바다 쪽에
  lexicon: HALOT
  rationale: 히브리어 직역은 '바다 쪽'이지만, 여기서는 성막 뜰의 방향을 가리키는 관용구이므로 본문에는 방향 의미를 살려 '서쪽'을 두고, 풀이를 덧붙여 관용어의 원뜻도 보이게 했습니다.
- source_word: קְלָעִים
  english_pob_choice: hangings
  chosen_korean: 휘장
  alternatives_korean:
  - 걸개
  - 장막
  lexicon: HALOT
  rationale: 성막 뜰의 울타리용 천을 가리키므로 한국어 성막 문맥에서 이해 가능한 '휘장'을 택했습니다. '천막'보다 구조물의 기능을 더 정확히 드러냅니다.
- source_word: עַמֻּדֵיהֶם ... וְאַדְנֵיהֶם
  english_pob_choice: with ten pillars and ten bases
  chosen_korean: 그 기둥은 열 개요 그 받침도 열 개입니다
  alternatives_korean:
  - 기둥 열 개와 받침 열 개가 있습니다
  - 열 개의 기둥과 열 개의 받침이 있습니다
  lexicon: HALOT
  rationale: 히브리어는 수량을 먼저 제시하는 구조이므로, 한국어도 이를 살리되 자연스러운 합쇼체로 다듬었습니다. '받침'은 성막 구조의 אֶדֶן에 해당하는 기본적이고 명료한 대응입니다.
theological_decisions:
- issue: 바다 쪽/서쪽의 방향 관용구 처리
  chosen_reading: '''바다 쪽''을 뜻대로 풀되 본문에는 ''서쪽''을 명시했습니다.'
  alternative_readings:
  - '''바다 쪽''만 표기'
  - '''서쪽''만 표기'
  rationale: 성막 도면의 방향 정보는 독자가 즉시 이해해야 하므로 본뜻인 서쪽을 본문에 두었습니다. 동시에 관용구의 문자적 배경도 유지해, 원문 표현을 지우지 않도록 했습니다.
  doctrine_reference: 출애굽기 27장 성막 지시문맥
