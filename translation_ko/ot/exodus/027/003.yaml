  text: וְ/עָשִׂ֤יתָ סִּֽירֹתָי/ו֙ לְ/דַשְּׁנ֔/וֹ וְ/יָעָי/ו֙ וּ/מִזְרְקֹתָ֔י/ו וּ/מִזְלְגֹתָ֖י/ו וּ/מַחְתֹּתָ֑י/ו לְ/כָל כֵּלָ֖י/ו תַּעֲשֶׂ֥ה נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
  footnotes:
  - marker: a
    text: Hebrew literally, 'for removing its fat ashes'; the expression refers to clearing away the ashes produced by the altar offerings.
    reason: lexical_alternative
  - marker: b
    text: Or 'copper' for 'bronze.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 제단의 재를 치우는 그릇들[a]과 삽들과 대야들과 갈고리들과 불그릇들을 만드십시오. 그 제단의 모든 기구는 청동[b]으로 만드십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그 제단의 기름진 재를 치우기 위한’입니다. 이는 제단 제물에서 생긴 재를 치워 내는 일을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구리’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: You shall make
  chosen_korean: 만드십시오
  alternatives_korean:
  - 만드셔야 합니다
  - 만들어야 합니다
  lexicon: HALOT
  rationale: 지시문 맥락에서 영어의 미래적 명령형을 한국어 공손 명령형으로 옮겨, 제작 지시의 직접성을 살렸습니다.
- source_word: סִּירֹתָיו לְדַשְּׁנ֔וֹ
  english_pob_choice: its pots for removing its ashes
  chosen_korean: 그것의 재를 치우는 그릇들
  alternatives_korean:
  - 그것의 재를 담는 그릇들
  - 그것의 재를 치우는 냄비들
  lexicon: HALOT
  rationale: סִּירוֹת를 단순히 ‘냄비’로 좁히기보다 제단 부속기구라는 점이 드러나도록 ‘그릇들’로 처리하고, 기능은 분사구로 옮겼습니다. 히브리어의 재 치우기 기능을 보존하되 한국어에서는 자연스럽게 만들었습니다.
- source_word: מִזְרְקֹתָיו
  english_pob_choice: its basins
  chosen_korean: 대야들
  alternatives_korean:
  - 그릇들
  - 받침그릇들
  lexicon: HALOT
  rationale: 제의용 용기라는 점을 드러내면서도 현대 한국어에서 이해가 쉬운 ‘대야들’을 택했습니다.
- source_word: מִזְלְגֹתָיו
  english_pob_choice: its forks
  chosen_korean: 갈고리들
  alternatives_korean:
  - 포크들
  - 고기갈고리들
  lexicon: HALOT
  rationale: 제단 도구의 기능상 ‘forks’의 직역인 ‘포크’보다, 한국어 성경 문맥에서 더 자연스럽고 도구 성격이 분명한 ‘갈고리들’이 적절합니다.
- source_word: מַחְתֹּתָיו
  english_pob_choice: its firepans
  chosen_korean: 불 옮기는 그릇들
  alternatives_korean:
  - 화로들
  - 향로들
  lexicon: HALOT
  rationale: 문맥상 숯이나 불을 옮기는 용기이므로, 예배 전통어인 ‘향로’로 한정하지 않고 기능을 드러내는 표현을 사용했습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥에서 한국어 성경 전통과 현대 가독성을 함께 고려하면 ‘놋’이 가장 자연스럽습니다. 영어 POB의 ‘bronze/copper’ 여지를 보존하면서도 재료 표기를 간결하게 했습니다.
