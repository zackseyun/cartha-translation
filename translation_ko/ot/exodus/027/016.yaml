id: EXO.27.16
reference: Exodus 27:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/לְ/שַׁ֨עַר הֶֽ/חָצֵ֜ר מָסָ֣ךְ עֶשְׂרִ֣ים אַמָּ֗ה תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֣ה רֹקֵ֑ם עַמֻּֽדֵי/הֶם֙ אַרְבָּעָ֔ה וְ/אַדְנֵי/הֶ֖ם אַרְבָּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
  footnotes:
  - marker: a
    text: Or 'a curtain' or 'a hanging' for the entrance covering.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'twenty cubits'; 'long' is supplied in English for clarity in the architectural description.
    reason: lexical_alternative
  - marker: c
    text: Or 'their four sockets' instead of 'their four bases.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뜰의 문에는 길이가 이십 규빗인[a] 휘장을 청색 실과 자주색 실과 진홍색 실과 곱게 꼰 고운 베실로, 수놓는 장인의 작품으로 만들고, 그 휘장의 기둥 넷과 그 받침 넷을 두어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 문자적으로 ‘이십 규빗’이라고만 되어 있습니다. 여기서 ‘길이’는 건축 문맥상 보충한 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  english_pob_choice: And for the gate of the courtyard
  chosen_korean: 뜰의 문을 위하여
  alternatives_korean:
  - 뜰의 문에 대하여
  - 뜰의 출입문을 위하여
  - 뜰의 문간을 위하여
  lexicon: HALOT
  rationale: שַׁעַר는 여기서 출입구 기능을 하는 '문'이 자연스럽고, הֶחָצֵר는 성막 뜰을 가리키므로 '뜰의 문'으로 옮겼습니다.
- source_word: מָסָךְ
  english_pob_choice: a screen
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 스크린
  - 장막
  lexicon: HALOT
  rationale: 성막 문맥의 מָסָךְ는 출입을 가리는 걸개/가리개를 뜻하므로, 한국어 성경에서 널리 통용되는 '휘장'을 사용하되 단순 커튼보다 구조적 가림막의 기능을 살렸습니다.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  english_pob_choice: of blue, purple, and scarlet yarn
  chosen_korean: 푸른색과 자주색과 진홍색 실
  alternatives_korean:
  - 청색과 자색과 홍색 실
  - 푸른 실과 자주 실과 진홍 실
  lexicon: HALOT
  rationale: 색채명은 직물 재료를 수식하는 것으로 이해해 간결하게 '푸른색/자주색/진홍색 실'로 옮겼습니다. '진홍색'은 תּוֹלַעַת שָׁנִי의 선명한 붉은 계열을 드러냅니다.
- source_word: וְשֵׁשׁ מָשְׁזָר
  english_pob_choice: and fine twined linen
  chosen_korean: 가늘게 꼰 아마실
  alternatives_korean:
  - 가는 꼰 베실
  - 세밀하게 꼰 아마천
  lexicon: HALOT
  rationale: שֵׁשׁ은 고운 아마/베 직물을 가리키고, מָשְׁזָר는 '꼰'의 제조 방식을 드러내므로, 직물 재료와 방식이 모두 보이도록 '가늘게 꼰 아마실'로 옮겼습니다.
- source_word: מַעֲשֵׂה רֹקֵם
  english_pob_choice: the work of an embroiderer
  chosen_korean: 수놓는 장인의 작품
  alternatives_korean:
  - 자수 놓은 일
  - 수놓은 자수공의 일
  lexicon: HALOT
  rationale: 직역보다 '수놓는 장인'으로 기술자의 손작업을 드러내어, 성막 직물의 정교한 공예성을 살렸습니다.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה וְאַדְנֵיהֶם אַרְבָּעָה
  english_pob_choice: with their four pillars and their four bases
  chosen_korean: 그 기둥은 넷이며 그 받침도 넷이어야 합니다
  alternatives_korean:
  - 그들의 네 기둥과 네 받침을 두고
  - 기둥 넷과 받침 넷을 두고
  lexicon: HALOT
  rationale: 히브리어의 복수 소유격을 반영해 '그 기둥'과 '그 받침'으로 자연스럽게 옮기되, 수량을 분명히 하기 위해 '넷'을 반복했습니다. אַדְנִים은 문맥상 기둥의 바닥받침/소켓이므로 '받침'이 가장 무난합니다.
theological_decisions:
- issue: 성막 출입구 덮개를 어떻게 이해해 옮길지
  chosen_reading: מָסָךְ를 성막 입구의 기능적 가림막으로 보아 '휘장'으로 옮기되, 문 자체가 아니라 출입을 가리는 덮개라는 점을 살렸습니다.
  alternative_readings:
  - 문
  - 막
  - 커튼
  rationale: 문맥은 성막 구조 지시문으로, מָסָךְ는 경첩 달린 문보다 출입을 가리는 직물 가림막을 가리킵니다. 따라서 전통적 교회어휘인 '휘장'을 사용하되, 구조적 의미를 유지했습니다.
  doctrine_reference: 출애굽기 27장의 성막 규례
