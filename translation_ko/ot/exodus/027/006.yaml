    reason: lexical_alternative
lexical_decisions:
- source_word: בַדִּים / בַּדֵּי
  english_pob_choice: poles
  chosen_korean: 막대
  alternatives_korean:
  - 봉
  - 지팡이
  - 운반용 막대
  lexicon: HALOT
  rationale: 성막 기구를 들기 위한 막대를 가리키므로, 현대 한국어에서는 '막대'가 가장 자연스럽고 기능도 드러납니다. '운반용 막대'는 설명이 지나치고, '지팡이'는 의미가 어긋납니다.
- source_word: לַמִּזְבֵּחַ
  english_pob_choice: for the altar
  chosen_korean: 제단을 위한
  alternatives_korean:
  - 제단을 위한
  - 제단의
  - 번제단을 위한
  lexicon: HALOT
  rationale: 본문 자체는 단순히 '제단'이라고만 하므로, 문맥상 식별되는 번제단을 본문에 덧붙이지 않고 그대로 옮겼습니다. 한국어에서는 용도를 분명히 하기 위해 '을 위한'을 사용했습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: acacia wood
  chosen_korean: 아카시아 나무
  alternatives_korean:
  - 싯딤 나무
  - 아카시아 재목
  lexicon: HALOT
  rationale: 전통 음역보다 현대 독자가 바로 이해할 수 있는 수종 명칭을 택했습니다. 원문의 재료 의미를 자연스럽게 전달합니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성막 재료 문맥에서는 한국어 성경 전통의 '놋'이 금속 피복의 재료를 가장 안정적으로 가리킵니다. 영어 POB의 'bronze'에 대응하되, 한국어에서는 문맥상 통용성이 높은 표현을 택했습니다.
