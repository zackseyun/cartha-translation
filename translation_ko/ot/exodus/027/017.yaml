id: EXO.27.17
reference: Exodus 27:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל עַמּוּדֵ֨י הֶֽ/חָצֵ֤ר סָבִיב֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף וָוֵי/הֶ֖ם כָּ֑סֶף וְ/אַדְנֵי/הֶ֖ם נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/017.yaml
  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
  footnotes:
  - marker: a
    text: Or 'joined with silver rods' or, in older English, 'filleted with silver.' The Hebrew term refers to the silver banding or connecting work on the pillars.
    reason: lexical_alternative
  - marker: b
    text: Or 'their sockets.' The Hebrew can refer to the metal bases into which the pillars were set.
    reason: lexical_alternative
  - marker: c
    text: '''Bronze'' may also be rendered ''copper,'' since the Hebrew term can cover copper or copper-alloy metal in ancient usage.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뜰 주위의 모든 기둥은 은으로 띠를 두르고, 그 갈고리는 은이며 그 받침은 놋으로 해야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 은 띠나 연결봉으로 기둥을 ‘두르다/묶다’는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 금속 받침, 곧 ‘소켓’의 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘놋’은 문맥상 ‘구리’ 또는 구리 합금까지 포괄할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי הֶחָצֵר
  english_pob_choice: All the pillars around the courtyard
  chosen_korean: 뜰 주위의 모든 기둥
  alternatives_korean:
  - 뜰 둘레의 모든 기둥
  - 뜰을 에워싼 모든 기둥
  lexicon: HALOT
  rationale: חָצֵר는 성막 문맥에서 ‘뜰’이 가장 자연스럽고, עַמּוּדֵי는 구조물의 수직 지지대를 가리켜 ‘기둥’이 적절합니다.
- source_word: מְחֻשָּׁקִים כֶּסֶף
  english_pob_choice: shall be banded with silver
  chosen_korean: 은으로 띠를 두르고
  alternatives_korean:
  - 은 띠로 두르고
  - 은으로 연결 띠를 두르고
  - 은으로 둘러 띠를 두르고
  lexicon: HALOT
  rationale: מְחֻשָּׁקִים은 은 띠나 연결 장치로 기둥을 두른다는 뜻이므로, ‘띠를 두르다’가 현대어로 가장 직접적이면서도 과도하게 해석하지 않습니다.
- source_word: וָוֵיהֶם כָּסֶף
  english_pob_choice: with their hooks of silver
  chosen_korean: 그 갈고리는 은이며
  alternatives_korean:
  - 그 고리는 은이며
  - 그 갈고리는 은으로 되어 있으며
  lexicon: HALOT
  rationale: וָוֵיהֶם은 성막 맥락에서 걸이용 ‘갈고리’로 옮기는 것이 가장 분명하며, 재료 표시는 평서적으로 처리했습니다.
- source_word: אַדְנֵיהֶם נְחֹשֶׁת
  english_pob_choice: and their bases of bronze
  chosen_korean: 그 받침은 놋으로 해야 합니다
  alternatives_korean:
  - 그 바닥받침은 놋으로 해야 합니다
  - 그 소켓은 놋으로 해야 합니다
  - 그 받침은 구리로 해야 합니다
  lexicon: HALOT
  rationale: אַדְנֵיהֶם은 기둥을 세우는 금속 받침을 뜻하므로 ‘받침’이 자연스럽고, נְחֹשֶׁת는 본문 관례에 따라 ‘놋’으로 옮겼습니다.
theological_decisions:
- issue: 성막 제작 دستور문의 명령형 뉘앙스
  chosen_reading: ‘해야 합니다’로 옮겨, 지시·규정의 명령성을 현대 한국어에서 분명하게 드러냈습니다.
  alternative_readings:
  - ‘되어야 합니다’
  - ‘할 것입니다’
  rationale: 본문은 서술이 아니라 성막 제작 규정이므로, 한국어에서는 의무·규범을 나타내는 표현이 가장 정확합니다.
  doctrine_reference: 출애굽기 성막 규정의 명령법/지시법
