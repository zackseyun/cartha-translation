  - 그 받침은 구리로 해야 합니다
  lexicon: HALOT
  rationale: אַדְנֵיהֶם은 기둥을 세우는 금속 받침을 뜻하므로 ‘받침’이 자연스럽고, נְחֹשֶׁת는 본문 관례에 따라 ‘놋’으로 옮겼습니다.
