source:
  edition: WLC
  text: אֹ֣רֶךְ הֶֽ/חָצֵר֩ מֵאָ֨ה בָֽ/אַמָּ֜ה וְ/רֹ֣חַב חֲמִשִּׁ֣ים בַּ/חֲמִשִּׁ֗ים וְ/קֹמָ֛ה חָמֵ֥שׁ אַמּ֖וֹת שֵׁ֣שׁ מָשְׁזָ֑ר וְ/אַדְנֵי/הֶ֖ם נְחֹֽשֶׁת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
  footnotes:
  - marker: a
    text: 'Hebrew: ''fifty by fifty.'' Some translations smooth this to ''fifty cubits,'' but the Hebrew wording is preserved here for transparency.'
    reason: alternative_reading
  - marker: b
    text: Or 'their sockets of bronze.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뜰의 길이는 백 규빗으로 하고, 너비는 오십 곱하기 오십[a]으로 하며, 높이는 고운 꼰 베 다섯 규빗으로 하고, 그 받침은 청동으로 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘오십에 오십’이라고 되어 있습니다. 이 표현의 정확한 뜻은 분명하지 않으며, 많은 번역은 이를 ‘오십 규빗’으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחָצֵר
  english_pob_choice: the court
  chosen_korean: 뜰
  alternatives_korean:
  - 마당
  - 회랑
  lexicon: HALOT
  rationale: 성막 문맥의 חָצֵר는 통상 성막 주위를 둘러싼 외곽 공간을 가리키므로, 한국어 성경에서 자연스럽고 정확한 '뜰'이 적절합니다.
- source_word: מֵאָה בָאַמָּה
  english_pob_choice: a hundred cubits
  chosen_korean: 백 규빗
  alternatives_korean:
  - 한 백 규빗
  - 백 cubits
  lexicon: HALOT
  rationale: 원문의 치수를 그대로 보존하되 한국어 본문에 맞게 단위를 음역해, 성막 측량의 일관성을 유지했습니다.
- source_word: חֲמִשִּׁים בַּחֲמִשִּׁים
  english_pob_choice: fifty cubits
  chosen_korean: 오십 규빗
  alternatives_korean:
  - 오십 곱하기 오십
  - 오십 대 오십
  lexicon: HALOT
  rationale: 영문 POB는 투명성을 위해 원문 어법을 유지했지만, 한국어에서는 이 표현이 다소 부자연스러워서 의미를 훼손하지 않는 범위에서 자연스럽게 측정값으로 옮겼습니다.
- source_word: שֵׁשׁ מָשְׁזָר
  english_pob_choice: finely twisted linen
  chosen_korean: 고운 꼬임 베
  alternatives_korean:
  - 가는 꼬임 베
  - 고운 꼰 베
  lexicon: HALOT
  rationale: שֵׁשׁ의 성막 문맥상 고급 아마포/베를 가리키는 점과 מָשְׁזָר의 '꼬임/꼰' 의미를 함께 살려, 재료와 제작 방식을 모두 드러내는 표현으로 옮겼습니다.
- source_word: וְאַדְנֵיהֶם
  english_pob_choice: with their bases
  chosen_korean: 그 받침은
  alternatives_korean:
  - 그 소켓은
  - 그 바닥은
  lexicon: HALOT
  rationale: 성막 구조물 지지대를 가리키는 אַדְנִים은 한국어에서 '받침'이 가장 이해하기 쉽고 문맥상 정확합니다. 영문 각주에 제시된 'sockets' 가능성은 구조적 대안으로 유지됩니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성막 기물 재료에 대한 한국어 성경의 널리 알려진 대응은 '놋'이며, 본문이 요구하는 고전적 금속 용어와도 잘 맞습니다.
theological_decisions:
- issue: 규빗 치수의 한국어 처리
  chosen_reading: 현대 도량형으로 환산하지 않고 원문 단위인 규빗을 유지했습니다.
  alternative_readings:
  - 약 45미터로 환산
  - 센티미터로 주석화
  rationale: 성막 규정의 측량적·상호참조적 일관성을 해치지 않기 위해, 원문 단위를 그대로 보존하는 편이 더 투명합니다.
  doctrine_reference: 본문 충실성과 측량 자료의 성경 내 일관성
