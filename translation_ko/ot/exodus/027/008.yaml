  text: נְב֥וּב לֻחֹ֖ת תַּעֲשֶׂ֣ה אֹת֑/וֹ כַּ/אֲשֶׁ֨ר הֶרְאָ֥ה אֹתְ/ךָ֛ בָּ/הָ֖ר כֵּ֥ן יַעֲשֽׂוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/008.yaml
  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
  footnotes:
  - marker: a
    text: Or 'hollowed out with planks.' The Hebrew describes the altar as a hollow structure made with boards.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 그것을 널찍하게, 판자들로 만들어야 합니다[a]. 산에서 네게 보여 준 대로, 그들은 그렇게 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘판자들로 속을 빈 구조로’. 히브리어는 제단이 판자로 이루어진 속빈 구조임을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב
  english_pob_choice: hollow
  chosen_korean: 널찍하게
  alternatives_korean:
  - 속이 빈
  - 빈 공간이 있는
  - 속이 비도록
  lexicon: HALOT
  rationale: 문맥상 제단의 구조가 통짜가 아니라 속이 빈 상태를 가리키므로, 한국어에서는 자연스럽고 간결하게 구조적 개방성을 드러내는 표현을 택했습니다.
- source_word: לֻחֹת
  english_pob_choice: with boards
  chosen_korean: 판자들로
  alternatives_korean:
  - 판자들로
  - 널빤지로
  - 널판으로
  lexicon: HALOT
  rationale: 복수 명사로서 제단의 재료가 여러 판자임을 보여 주므로, '판자들로'가 제작 재료와 다중성을 함께 살립니다.
- source_word: הֶרְאָה אֹתְךָ
  english_pob_choice: it was shown to you
  chosen_korean: 네게 보여 준
  alternatives_korean:
  - 네게 보여진
  - 네게 보여 주신
  - 네게 나타내신
  lexicon: HALOT
  rationale: 히브리어가 피동형이므로 직접적인 능동 표현보다 '보여 준'으로 옮겨, 산에서 받은 계시의 패턴을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 산에서 보여 준 모형에 따른 제작 명령
  chosen_reading: 모세에게 산에서 보여 준 바를 기준으로, 제작자들은 그와 동일하게 만들어야 한다는 명령으로 읽었습니다.
  alternative_readings:
  - 단순한 시각적 설명
  - 상징적 영감의 일반 지시
  rationale: 본문은 제작 방식이 인간의 임의가 아니라 계시된 본에 종속됨을 강조하므로, 명령의 규범성을 유지해 옮겼습니다.
  doctrine_reference: 출애굽기 25–27장의 성막/제단 계시와 순종의 원리
