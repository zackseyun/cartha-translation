  source_fidelity: ‘널찍하게’는 נְבוּב(‘속이 빈, 비어 있는’)의 뜻과 맞지 않아 구조적 의미가 사라집니다. 또한 ‘그들은 그렇게 해야 합니다’는 יַעֲשׂוּ(‘그들이 그렇게 만들 것이다/만들어야 한다’)에서 ‘만들다’라는 행위를 생략합니다. 수정문은 제단이 널판으로 된 속빈 구조라는 뜻, 산에서 보인 본을 따르라는 비교 구조, 그리고 복수 제작자의 동사를 보존합니다.
  naturalness: ‘속이 빈 구조가 되게’와 ‘널판으로’는 현대 표준어에서 제작 방식과 구조를 자연스럽게 나타냅니다. 호칭은 본문에서 반복하지 않고 ‘당신에게’로 통일하여 기존의 ‘당신/네게’ 혼용을 없앴습니다.
  terminology: לֻחֹת는 ‘널판’으로, נְבוּב는 ‘속이 빈 구조’로 옮겼습니다. ‘보여 준’은 히브리어 피동문의 신적 행위자를 명시하지 않으면서 한국어에서 자연스럽게 전달합니다.
