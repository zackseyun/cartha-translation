base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/013.yaml
  text: And the width of the court on the east side[a], toward the sunrise, shall be fifty cubits.
  footnotes:
  - marker: a
    text: Or 'the breadth of the court on the east side, eastward, fifty cubits.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뜰의 동쪽 면, 곧 해 뜨는 쪽의 너비는 오십 규빗입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרֹחַב
  english_pob_choice: And the width
  chosen_korean: 너비는
  alternatives_korean:
  - 폭은
  - 가로는
  lexicon: HALOT
  rationale: רֹחַב은 물리적 치수의 ‘너비/폭’이므로, 현대 한국어에서 가장 자연스러운 ‘너비’를 택했습니다. 문맥상 도면식 규정이므로 서술을 간결하게 했습니다.
- source_word: הֶחָצֵר
  english_pob_choice: of the court
  chosen_korean: 뜰의
  alternatives_korean:
  - 마당의
  - 궁정의
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥의 חָצֵר는 성소를 둘러싼 외곽 공간이어서 전통적으로 ‘뜰’이 가장 적절합니다. ‘마당’도 가능하지만 성막 용어로서의 정밀성이 떨어집니다.
- source_word: לִפְאַת קֵדְמָה מִזְרָחָה
  english_pob_choice: on the east side ... toward the sunrise
  chosen_korean: 동쪽 면, 해돋이 쪽의
  alternatives_korean:
  - 동쪽 편, 동쪽을 향한
  - 동쪽 면, 동쪽으로
  lexicon: HALOT
  rationale: לִפְאַת는 ‘~쪽/면’의 방향 표시이고, קֵדְמָה와 מִזְרָחָה가 동쪽을 이중으로 강조하므로 ‘동쪽 면, 해돋이 쪽’으로 살려 중복된 방향 표현을 한국어에서도 반영했습니다.
- source_word: חֲמִשִּׁים אַמָּה
  english_pob_choice: fifty cubits
  chosen_korean: 오십 규빗
  alternatives_korean:
  - 쉰 규빗
  - 50 규빗
  lexicon: HALOT
  rationale: אַמָּה는 성경 도량형 ‘규빗’이므로 음역어를 유지했습니다. 숫자는 한자어 ‘오십’으로 문어체 톤을 맞췄습니다.
