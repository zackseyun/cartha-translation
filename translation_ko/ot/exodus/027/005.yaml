base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/005.yaml
  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
  footnotes:
  - marker: a
    text: Or 'rim' for 'ledge' (Heb. karkov), referring to a projecting border or frame on the altar.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and the net shall be unto the middle of the altar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 제단의 가장자리 아래, 아래쪽에 두십시오. 그리고 그 그물은 제단의 중간까지 닿아야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כַּרְכֹּב(karkov)은 제단의 돌출된 둘레나 가장자리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 그물은 제단의 중간이 되어야 한다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  english_pob_choice: And you shall put
  chosen_korean: 두십시오
  alternatives_korean:
  - 놓으십시오
  - 두게 하십시오
  - 설치하십시오
  lexicon: HALOT
  rationale: 명령형/지시형의 כוח을 살리면서도 제단 구조물에 해당 부품을 자리잡게 하는 자연스러운 한국어로 옮겼습니다.
- source_word: כַּרְכֹּב
  english_pob_choice: ledge
  chosen_korean: 가장자리
  alternatives_korean:
  - 턱
  - 테두리
  - 선반
  lexicon: HALOT
  rationale: 문맥상 제단의 돌출된 둘레를 가리키므로, 건축적 이미지를 유지하면서도 현대 한국어 독자가 이해하기 쉬운 ‘가장자리’를 선택했습니다.
- source_word: הָרֶשֶׁת
  english_pob_choice: the net
  chosen_korean: 그물
  alternatives_korean:
  - 망
  - 철망
  - 격자
  lexicon: HALOT
  rationale: 제단의 그물형 구조를 가장 직접적으로 드러내는 기본어를 택했고, 앞문맥의 청동 그물이라는 맥락과도 잘 맞습니다.
- source_word: עַד חֲצִי הַמִּזְבֵּחַ
  english_pob_choice: to halfway up the altar
  chosen_korean: 제단의 중간까지
  alternatives_korean:
  - 제단의 절반까지
  - 제단의 한가운데까지
  lexicon: HALOT
  rationale: 히브리어는 높이의 중간 지점을 가리키므로, 위치 관계를 자연스럽게 살려 ‘중간까지’로 옮겼습니다.
theological_decisions:
- issue: 공간 지시를 목적적 의미로 확장할지 여부
  chosen_reading: 히브리어의 단순한 배치 지시를 따라, 결과나 목적을 덧붙이지 않고 위치와 범위만 드러내는 문장으로 옮겼습니다.
  alternative_readings:
  - 그물은 제단의 중간까지 뻗도록 하십시오
  - 그물은 제단의 중간이 되게 하십시오
  rationale: 본문은 기구의 설치 위치를 설명하는 구절이므로, 영어 POB의 최종 수정처럼 목적절 뉘앙스를 덜고 서술된 공간 관계를 직접적으로 표현하는 것이 가장 충실합니다.
  doctrine_reference: 성막 기구 묘사 본문에 대한 서술적 번역 원칙
