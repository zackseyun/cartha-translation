  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/אֹ֣הֶל מוֹעֵד֩ מִ/ח֨וּץ לַ/פָּרֹ֜כֶת אֲשֶׁ֣ר עַל הָ/עֵדֻ֗ת יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֧ן וּ/בָנָ֛י/ו מֵ/עֶ֥רֶב עַד בֹּ֖קֶר לִ/פְנֵ֣י יְהוָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹ֣רֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
  footnotes:
  - marker: a
    text: Or 'shall set it in order' for 'shall arrange it.' The Hebrew verb can denote arranging or ordering the lamp service.
    reason: lexical_alternative
  - marker: b
    text: Or 'outside the curtain.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the testimony' likely refers to the covenant tablets housed in the ark; thus 'before the testimony' describes the veil's position relative to the ark.
    reason: cultural_note
translation:
  language: ko
  text: 회막에서, 증거 앞에 있는 휘장 바깥에서 아론과 그의 아들들은 저녁부터 아침까지 야훼 앞에서 그것을 정돈해야 합니다. 이는 이스라엘 자손이 대대로 지켜야 할 영구한 규례입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회막’은 직역하면 ‘만남의 장막’이지만, 한국어 성경에서 성막의 기술 용어로 널리 쓰입니다.
    reason: korean_style_note
  - marker: b
    text: ‘휘장’은 성소의 내부를 가르는 휘장을 가리킵니다. ‘휘장 바깥’은 이 휘장과 관련된 공간 관계를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘증거’는 문맥상 언약궤에 보관된 증거판을 가리킬 가능성이 있습니다. 이 표현은 휘장이 그 증거 앞에 놓여 있음을 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막 안에서
  alternatives_korean:
  - 만남의 장막 안에서
  - 회중의 장막 안에서
  lexicon: HALOT
  rationale: 제의적 고유명사로 굳은 표현이므로 직역보다 한국어 성경에서 통용되는 ‘회막’을 살려 기술적 의미를 유지했습니다.
- source_word: מִחוּץ לַפָּרֹכֶת
  english_pob_choice: outside the veil
  chosen_korean: 휘장 바깥에서
  alternatives_korean:
  - 베일 바깥에서
  - 장막 휘장 바깥에서
  lexicon: HALOT
  rationale: פָּרֹכֶת은 성소 내부를 가르는 휘장을 가리키므로, ‘휘장’이 제의적 맥락을 가장 정확히 전달합니다.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  english_pob_choice: that is before the testimony
  chosen_korean: 증거궤 앞
  alternatives_korean:
  - 증거 앞
  - 증거판 앞
  lexicon: HALOT
  rationale: 문맥상 휘장이 증거궤 앞에 놓인 위치를 가리키므로, 공간 관계를 자연스럽게 드러내는 ‘앞’을 택했습니다.
- source_word: יַעֲרֹךְ אֹתוֹ
  english_pob_choice: shall arrange it
  chosen_korean: 정돈해야 합니다
  alternatives_korean:
  - 차려 놓아야 합니다
  - 순서대로 해야 합니다
  - 배치해야 합니다
  lexicon: HALOT
  rationale: 동사 ערך는 ‘차려 놓다/정돈하다/배열하다’의 뜻이 있으며, 등잔 봉사의 질서를 보여 주는 한국어로 ‘정돈하다’를 택했습니다.
- source_word: חֻקַּת עוֹלָם
  english_pob_choice: a perpetual statute
  chosen_korean: 영구한 규례
  alternatives_korean:
  - 영원한 규례
  - 항구한 규례
  - 계속되는 규례
  lexicon: HALOT
  rationale: עוֹלָם의 지속성을 살리되, 절대적 형이상학보다 규범의 지속을 나타내는 현대적 법률·제의 용어로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 신명기형 고유명사 יְהוָה가 직접 나오므로, 프로젝트 기본값에 따라 하나님의 언약 이름을 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 회막·휘장·증거의 공간 관계
  chosen_reading: 성소 내부 구조를 드러내는 제의적 공간 묘사로 읽음
  alternative_readings:
  - ‘증거’의 물건성만 강조하는 읽기
  - 일반적인 ‘커튼’으로 완화하는 읽기
  rationale: 이 구절은 장소 지시가 핵심이므로, 전례적 구조(회막-휘장-증거궤)를 흐리지 않고 독자가 성막 내부 배치를 이해하도록 옮겼습니다.
  doctrine_reference: 출 27:21 문맥 및 POB 공간-제의 표기 원칙
