  to: 회막에서, 증거 앞에 있는 휘장 바깥에서 아론과 그의 아들들은 저녁부터 아침까지 야훼 앞에서 그것을 정돈해야 합니다. 이는 이스라엘 자손이 대대로 지켜야 할 영구한 규례입니다.[a][b][c]
  rationale: 본문에 없는 ‘증거궤’를 ‘증거’로 되돌려 히브리어의 표현과 문맥상 지시 대상의 여지를 보존했습니다. 부자연스러운 ‘저것’을 ‘그것’으로 고치고, 각주 b와 c의 원문 초과 설명 및 단정적 표현을 바로잡았습니다. ‘야훼’, ‘회막’, ‘휘장’, ‘규례’ 및 합쇼체는 유지했습니다.
  reviewer_model: gpt-5.6-terra
