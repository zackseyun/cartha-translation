  - severity: medium
    issue: 문장의 규정형과 종결 방식이 혼재함
    rationale: ‘휘장을 두되’는 설치 지시를 이끄는데 뒤의 ‘셋입니다’는 단순 서술형이어서 문체가 매끄럽지 않습니다. 건축 규정 문맥에 맞추어 ‘두어야 합니다/이어야 합니다’로 통일하면 의미와 합쇼체를 함께 살릴 수 있습니다.
  - severity: low
