translation:
  language: ko
  text: 둘째 쪽에는 길이 십오 규빗[c]의 휘장[b]을 두어야 합니다. 그 기둥은 셋이고 그 받침[a]도 셋이어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘받침’은 히브리어 אֶדֶן의 뜻을 따른 것입니다. 성막 문맥에서는 기둥을 세우는 바닥 조각 또는 소켓을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘휘장’은 여기서 뜰을 이루는 천 장막을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 수사는 수량 자체보다 길이(규빗)를 뜻하는 문맥입니다.
    reason: source_note
lexical_decisions:
