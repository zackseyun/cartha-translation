  - 막
  - 휘장들
  lexicon: HALOT
  rationale: 뜰의 둘레를 이루는 천 조각/장막이라는 점을 살리되, 현대 한국어에서 이해되기 쉬운 건축·성막 용어인 ‘휘장’을 택했습니다.
- source_word: עַמֻּדֵי/הֶם
  english_pob_choice: with three pillars
  chosen_korean: 기둥은 셋
