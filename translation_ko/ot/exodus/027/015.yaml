  - 그 소켓도 셋
  - 그 받침판도 셋
  lexicon: HALOT
  rationale: אֶדֶן은 성막 기술 문맥에서 기둥 아래의 받침/소켓을 가리키므로, 용례를 드러내는 ‘받침’을 사용했습니다.
theological_decisions:
- issue: 성막 규격의 기술적 서술을 현대 한국어로 얼마나 직역할지
  chosen_reading: 의미를 훼손하지 않는 범위에서 기술적 정보를 드러내는 직역에 가깝게 옮겼습니다.
  alternative_readings:
