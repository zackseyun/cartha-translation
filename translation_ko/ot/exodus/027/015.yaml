  rationale: 본문과 평행구절의 맥락상 수량이 아니라 길이를 말하므로, ‘길이’와 함께 ‘십오 규빗’을 분명히 밝혔습니다.
- source_word: קְלָעִים
  english_pob_choice: hangings
  chosen_korean: 휘장
  alternatives_korean:
