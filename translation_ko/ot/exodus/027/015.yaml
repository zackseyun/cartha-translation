  yaml_path: translation/ot/exodus/027/015.yaml
  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
  footnotes:
  - marker: a
    text: Or 'sockets' for 'bases.' The Hebrew term refers to the foundation pieces for the pillars.
    reason: lexical_alternative
  - marker: b
    text: Or 'fifteen hangings'.
    reason: previous_rendering
  - marker: c
    text: Or 'with their three pillars and their three bases'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 둘째쪽에는 길이 십오 규빗의 휘장을 두되, 기둥은 셋이며 그 받침도 셋입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘받침’은 히브리어 אֶדֶן의 뜻을 따른 것입니다. 성막 문맥에서는 기둥을 세우는 바닥 조각 또는 소켓을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘휘장’은 여기서 뜰을 이루는 천 장막을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 수사는 수량 자체보다 길이(규빗)를 뜻하는 문맥입니다.
    reason: source_note
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף הַ/שֵּׁנִית
  english_pob_choice: And for the second side
  chosen_korean: 둘째쪽에는
  alternatives_korean:
  - 두 번째 쪽에는
  - 반대편에는
  - 어깨에는
  lexicon: HALOT
  rationale: tabernacle 울타리의 건축 문맥에서 כָּתֵף는 문자적 ‘어깨’가 아니라 면/쪽을 가리키므로, 자연스러운 ‘둘째쪽’으로 옮겼습니다.
- source_word: חְמֵשׁ עֶשְׂרֵה
  english_pob_choice: fifteen cubits
  chosen_korean: 길이 십오 규빗
  alternatives_korean:
  - 십오 규빗
  - 규빗으로 십오
  - 길이 열다섯 규빗
  lexicon: HALOT
  rationale: 본문과 평행구절의 맥락상 수량이 아니라 길이를 말하므로, ‘길이’와 함께 ‘십오 규빗’을 분명히 밝혔습니다.
- source_word: קְלָעִים
  english_pob_choice: hangings
  chosen_korean: 휘장
  alternatives_korean:
  - 행잉
  - 막
  - 휘장들
  lexicon: HALOT
  rationale: 뜰의 둘레를 이루는 천 조각/장막이라는 점을 살리되, 현대 한국어에서 이해되기 쉬운 건축·성막 용어인 ‘휘장’을 택했습니다.
- source_word: עַמֻּדֵי/הֶם
  english_pob_choice: with three pillars
  chosen_korean: 기둥은 셋
  alternatives_korean:
  - 그 기둥 셋
  - 세 기둥
  - 기둥 세 개
  lexicon: HALOT
  rationale: 본문의 수사 구조를 따라 ‘기둥은 셋’으로 간결하게 옮겨, 수량을 강조하는 히브리어 어순을 반영했습니다.
- source_word: וְ/אַדְנֵי/הֶם
  english_pob_choice: and their three bases
  chosen_korean: 그 받침도 셋
  alternatives_korean:
  - 그 기초도 셋
  - 그 소켓도 셋
  - 그 받침판도 셋
  lexicon: HALOT
  rationale: אֶדֶן은 성막 기술 문맥에서 기둥 아래의 받침/소켓을 가리키므로, 용례를 드러내는 ‘받침’을 사용했습니다.
theological_decisions:
- issue: 성막 규격의 기술적 서술을 현대 한국어로 얼마나 직역할지
  chosen_reading: 의미를 훼손하지 않는 범위에서 기술적 정보를 드러내는 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 더 완곡한 의역
  - 전통 교회 용어 중심 번역
  rationale: 이 절은 규격 설명이므로, 장식적 표현보다 구조·치수를 명확히 전달하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: 출애굽기 성막 규례의 문맥
