- from: 너는 성막의 뜰을 만들어야 합니다. 남쪽 곁, 곧 남쪽을 향하여는 뜰을 위한 세마포 휘장이 있을 것이며, 길이는 백 규빗으로 한쪽 변이 됩니다.[a]
  to: 너는 성막의 뜰을 만드십시오. 남쪽 변, 곧 남쪽 방향에는 뜰을 위한 곱게 꼰 세마포 휘장들이 있어야 하며, 그 한 변의 길이는 백 규빗이어야 합니다.[a]
  rationale: 개정문은 원문의 명령형, 남쪽을 강조하는 중첩 방위 표현, 복수의 경계용 휘장, 곱게 꼰 세마포의 재질·제작 방식, 그리고 한 변에 대한 백 규빗의 길이를 명확하고 자연스러운 합쇼체로 반영합니다. 교리적 해석은 추가하지 않았습니다.
