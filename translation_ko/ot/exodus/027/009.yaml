  text: וְ/עָשִׂ֕יתָ אֵ֖ת חֲצַ֣ר הַ/מִּשְׁכָּ֑ן לִ/פְאַ֣ת נֶֽגֶב תֵּ֠ימָנָ/ה קְלָעִ֨ים לֶ/חָצֵ֜ר שֵׁ֣שׁ מָשְׁזָ֗ר מֵאָ֤ה בָֽ/אַמָּה֙ אֹ֔רֶךְ לַ/פֵּאָ֖ה הָ/אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
  footnotes:
  - marker: a
    text: Or 'curtains' for 'hangings.' The Hebrew term refers to fabric panels forming the court boundary.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 성막의 뜰을 만드십시오. 남쪽 변, 곧 남쪽 방향에는 뜰을 위한 곱게 꼰 세마포 휘장들이 있어야 하며, 그 한 변의 길이는 백 규빗이어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘커튼들’로 옮길 수 있습니다. 히브리어 용어는 뜰의 경계를 이루는 천 패널들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  english_pob_choice: court
  chosen_korean: 뜰
  alternatives_korean:
  - 마당
  - 울타리 안뜰
  lexicon: HALOT
  rationale: 성막 문맥에서 חֲצַר은 성막을 둘러싼 예배 공간을 가리키므로, 한국어 성경의 관용과 문맥 적합성을 살려 ‘뜰’로 옮겼습니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: 이 책 전체에서 הַמִּשְׁכָּן은 성소 기능을 지닌 성막을 뜻하므로, 익숙하고 정확한 ‘성막’을 사용했습니다.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  english_pob_choice: For the south side, southward
  chosen_korean: 남쪽 곁, 곧 남쪽을 향하여
  alternatives_korean:
  - 남쪽 변에, 남쪽으로
  - 남쪽 면을 향하여
  lexicon: HALOT
  rationale: 원문은 ‘곁/변’과 방향 표지를 겹쳐 남쪽을 강조하므로, 이를 ‘남쪽 곁, 곧 남쪽을 향하여’로 살려 중복된 방향감을 유지했습니다.
- source_word: קְלָעִים
  english_pob_choice: hangings
  chosen_korean: 휘장
  alternatives_korean:
  - 행어
  - 커튼
  lexicon: HALOT
  rationale: 이 항목은 뜰의 경계를 이루는 천 장막을 가리키며, 한국어로는 기능상 ‘휘장’이 가장 자연스럽고 공적 용례에 맞습니다.
- source_word: שֵׁשׁ מָשְׁזָר
  english_pob_choice: finely twisted linen
  chosen_korean: 세마포
  alternatives_korean:
  - 가는 꼬은 베
  - 정교하게 꼰 리넨
  lexicon: HALOT
  rationale: 원문은 고급 아마포 재질을 뜻하므로, 성막 재료 표현으로 널리 이해되는 ‘세마포’를 사용해 재질과 문맥을 동시에 살렸습니다.
- source_word: מֵאָה בָאַמָּה
  english_pob_choice: a hundred cubits
  chosen_korean: 백 규빗
  alternatives_korean:
  - 일백 규빗
  - 100 규빗
  lexicon: HALOT
  rationale: 측량 단위를 보존하기 위해 ‘규빗’을 유지했고, 수사 표현은 성경 문체에 맞게 ‘백’으로 옮겼습니다.
theological_decisions:
- issue: 성막 경계 구조의 표현
  chosen_reading: ‘뜰’과 ‘휘장’을 사용해 성막 둘레의 물리적 경계를 분명히 드러냈습니다.
  alternative_readings:
  - ‘마당’과 ‘커튼’으로 완화해 표현하는 방식
  rationale: 원문은 예배 공간의 구조적 경계를 기술하므로, 일상적 실내 장식처럼 들릴 수 있는 표현보다 성막 구조를 직접 드러내는 용어를 택했습니다.
  doctrine_reference: 출애굽기 25–27장의 성막 규정 전체 문맥
- issue: 방향 중복의 보존
  chosen_reading: ‘남쪽 곁, 곧 남쪽을 향하여’로 이중 방향 표지를 유지했습니다.
  alternative_readings:
  - ‘남쪽 면에’처럼 하나의 방향 표현으로 합치는 방식
  rationale: 히브리어의 이중 방향 표지는 단순 중복이 아니라 해당 변의 위치를 강조하므로, 이를 줄이지 않고 보존했습니다.
  doctrine_reference: 히브리어 서술의 강조법
