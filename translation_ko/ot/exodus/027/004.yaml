- from: 너는 그것을 위하여 놋으로 만든 그물 모양의 격자[a]를 만들고, 그 격자 위에 놋 고리 넷을 네 귀퉁이에 만들라[b].
  to: 그것을 위하여 그물 모양의 놋 격자를 만드십시오. 그 격자 위, 그 네 귀퉁이에 놋 고리 넷을 만드십시오.[a][b]
  rationale: 문체를 현대 격식체 합쇼체로 바로잡고, 두 절의 제작 명령을 분명히 나누었습니다. ‘격자 위, 그 네 귀퉁이에’는 עַל הָרֶשֶׁת와 עַל אַרְבַּע קְצוֹתָיו의 위치 정보를 모두 보존하면서 한국어의 중복감을 줄입니다. 각주는 원문의 표현과 대안적 번역을 더 정확하고 명료하게 수정했습니다.
