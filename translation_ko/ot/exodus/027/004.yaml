    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 위하여 그물 모양의 놋 격자를 만드십시오. 그 격자 위, 그 네 귀퉁이에 놋 고리 넷을 만드십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놋으로 된 그물살 격자’, ‘놋으로 된 그물 짜임’. 히브리어는 문자적으로 ‘놋으로 된, 그물의 작업인 격자’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것의 네 끝에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר
  english_pob_choice: a grating
  chosen_korean: 그물 모양의 격자
  alternatives_korean:
  - 격자
  - 그물살 격자
  - 그레이팅
  lexicon: HALOT
  rationale: 제의 기구의 구조를 살리면서도 현대 한국어에서 이해가 쉬운 표현으로 옮겼습니다. '그물 모양'은 뒤의 רֶשֶׁת과의 연결을 드러내고, '격자'는 기능적 형상을 자연스럽게 전달합니다.
- source_word: מַעֲשֵׂה רֶשֶׁת
  english_pob_choice: a network
  chosen_korean: 그물 모양의
  alternatives_korean:
  - 그물의
  - 메시의
  - 네트워크의
  lexicon: HALOT
  rationale: 직역하면 '그물의 일/작품'이지만 한국어에서는 소유격보다 형용적 수식이 자연스럽습니다. '그물 모양의'는 'work of a net'이라는 구조와 그물처럼 짜인 형상을 함께 반영합니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 구리
  lexicon: HALOT
  rationale: 성막 문맥에서 한국어 성경 전통과 맞물리면서도 재질을 무난하게 가리키는 표준어는 '놋'입니다. 본문 전체의 제의 기구 용례와도 잘 맞습니다.
- source_word: טַבְּעֹת
  english_pob_choice: rings
  chosen_korean: 놋 고리
  alternatives_korean:
  - 반지
  - 고리
  - 링
  lexicon: HALOT
  rationale: 부착용 고리를 뜻하므로 '고리'가 가장 직접적입니다. 재질을 앞에 붙여 '놋 고리'로 하면 원문의 반복과 기능이 분명해집니다.
- source_word: קְצוֹתָיו
  english_pob_choice: its four corners
  chosen_korean: 네 귀퉁이에
  alternatives_korean:
  - 네 끝에
  - 네 모퉁이에
  - 네 가장자리에
  lexicon: HALOT
  rationale: 격자와 고리의 배치를 설명하므로 '귀퉁이'가 가장 자연스럽고 시각적으로 분명합니다. 영어 POB의 'corners'와도 대응됩니다.
