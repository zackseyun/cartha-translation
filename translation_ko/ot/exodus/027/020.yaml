  - 이스라엘 백성
  rationale: 문맥상 공동체 전체를 가리키지만, 원문이 가진 관용적 남성 복수 표지를 평탄화하지 않기 위해 직역에 가까운 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: תָּמִיד의 의미
  chosen_reading: 계속
  alternative_readings:
