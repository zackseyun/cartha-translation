source:
  edition: WLC
  text: וְ/אַתָּ֞ה תְּצַוֶּ֣ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
  footnotes:
  - marker: a
    text: 'Or “the Israelites” or “the people of Israel.” Hebrew: “the sons of Israel.”'
    reason: lexical_alternative
  - marker: b
    text: “Beaten” may also be rendered “crushed,” referring to high-quality oil produced from olives by pounding rather than ordinary pressing.
    reason: lexical_alternative
  - marker: c
    text: “Continually” in tabernacle usage can denote regular ongoing maintenance rather than necessarily every moment without interruption; compare the priestly instructions in Exodus 27:21 and Leviticus 24:2–4.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 당신은 이스라엘 자손[a]에게 명령하여, 그들이 등불을 밝히는 데 쓸 순수한 찧은 올리브기름[b]을 당신에게 가져오게 하십시오. 등불을 늘 밝히도록 하십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 “이스라엘 사람들” 또는 “이스라엘 백성.” 히브리어: “이스라엘의 아들들.”'
    reason: lexical_alternative
  - marker: b
    text: “찧은”은 “으깬”으로도 옮길 수 있으며, 일반적인 압착이 아니라 올리브를 두드리거나 찧어 얻은 고급 기름을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 성막 용례에서 “늘”은 반드시 매 순간 끊기지 않음을 뜻하기보다, 규정된 정기적 관리와 유지를 뜻할 수 있습니다. 출애굽기 27:21과 레위기 24:2–4를 비교하십시오.
    reason: cross_reference
