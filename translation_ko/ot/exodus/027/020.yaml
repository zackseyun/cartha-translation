review_pass:
  verdict: revise
  source_fidelity: 히브리어의 직접 명령, 공급 행위, 기름의 품질·제조 방식, 그리고 등불을 지속적으로 밝히는 목적은 대체로 반영되어 있습니다. 그러나 ‘등불을 계속 켜게 하십시오’는 לְמָאוֹר(조명을 위하여)의 목적 관계와 לְהַעֲלֹת נֵר(등불을 밝히다/타오르게 하다)의 관용 표현을 충분히 드러내지 못하며, ‘빻은 기름’도 한국어에서 다소 부자연스럽습니다.
  naturalness: 합쇼체의 ‘당신은 … 하십시오’는 직접 명령을 형식적으로 재현하지만, 문장 안에서 목적과 행위의 관계가 다소 어색합니다. ‘등불을 밝히는 데 쓸’, ‘찧은 올리브기름’, ‘등불을 늘 밝히도록’으로 다듬으면 현대 표준 한국어에서 더 자연스럽고 명료합니다.
  terminology: ‘이스라엘 자손’은 בְּנֵי יִשְׂרָאֵל의 전통적·혈연적 표지를 적절히 보존합니다. זָךְ는 ‘순수한’으로 가능하며, כָּתִית는 ‘찧은’이 ‘빻은’보다 기름 생산 맥락에 더 적합합니다. תָּמִיד는 본문에서 ‘늘’로 옮기고, 정기적 유지일 수 있다는 제한은 각주로 유지하는 것이 적절합니다.
  issues:
