  english_pob_choice: for the light, to cause a lamp to burn continually
  chosen_korean: 등불을 계속 켜게 하십시오
  alternatives_korean:
  - 빛을 위해, 등불을 계속 타오르게 하십시오
  - 등불이 계속 타오르도록 하십시오
  lexicon: HALOT
  rationale: 히브리어의 목적구와 사역형을 한국어 자연문으로 묶어 제의적 기능과 지속성을 함께 드러냈습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 성별 표지 유지
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 문맥상 공동체 전체를 가리키지만, 원문이 가진 관용적 남성 복수 표지를 평탄화하지 않기 위해 직역에 가까운 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: תָּמִיד의 의미
  chosen_reading: 계속
  alternative_readings:
  - 항상
  - 끊임없이
  rationale: 성막 규례에서 תָּמִיד는 매순간 중단 없는 상태라기보다 규정된 지속적 유지의 뉘앙스이므로, 오해를 줄이기 위해 '계속'으로 옮겼습니다.
  doctrine_reference: 출 27:21; 레 24:2-4
