  - 끊임없이
  rationale: 성막 규례에서 תָּמִיד는 매순간 중단 없는 상태라기보다 규정된 지속적 유지의 뉘앙스이므로, 오해를 줄이기 위해 '계속'으로 옮겼습니다.
  doctrine_reference: 출 27:21; 레 24:2-4
