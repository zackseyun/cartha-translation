    issue: ‘등불을 계속 켜게 하십시오’가 히브리어의 목적 관계와 관용구를 축소함
    rationale: לַמָּאוֹר는 기름이 조명을 위한 것임을, לְהַעֲלֹת נֵר는 등불을 밝히거나 타오르게 하는 행위를 나타냅니다. 수정문은 두 요소를 ‘등불을 밝히는 데 쓸’과 ‘등불을 늘 밝히도록’으로 분명히 합니다.
