  source_fidelity: ‘자정쯤’은 כַּחֲצֹת의 근사성을 적절히 보존하며, ‘야훼’와 예언자적 전언 공식도 원문과 영어 감사 기록에 부합합니다. 그러나 ‘이집트 한가운데로 나가겠습니다’는 한국어에서 ‘나가다’의 출발·이탈 방향과 ‘-로’의 도착 방향이 충돌하여, 야훼께서 이집트 밖으로 나가는 듯하거나 이집트로 들어가는 듯하게 읽힙니다. בְּתוֹךְ מִצְרָיִם와 יוֹצֵא의 문맥상 이동을 ‘이집트 한가운데를 지나가겠습니다’로 옮기는 것이 자연스럽고 충실합니다.
