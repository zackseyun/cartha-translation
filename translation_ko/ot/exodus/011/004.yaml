  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
  footnotes:
  - marker: a
    text: Or “At midnight.” The Hebrew expression includes a prefixed particle that can indicate approximation, hence “About midnight.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 말했습니다. “야훼께서 이렇게 말씀하십니다. 자정쯤에 내가 이집트 한가운데로 나가겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 근사적 의미를 가질 수 있는 접두사 כ를 포함하므로, 전통 번역의 “자정에”보다 “자정쯤에”가 더 직접적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  english_pob_choice: Then Moses said
  chosen_korean: 그때 모세가 말했습니다
  alternatives_korean:
  - 그리고 모세가 말했습니다
  - 그런 다음 모세가 말했습니다
  lexicon: HALOT
  rationale: 와우-연결의 서술 진행을 한국어에서 자연스러운 시간 연결어 ‘그때’로 옮겨, 다음 발화를 이끄는 서술 흐름을 살렸습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 야훼께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 전언 공식이므로 한국어에서도 현재형 직접 인용으로 처리했고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: כַּחֲצֹת הַלַּיְלָה
  english_pob_choice: About midnight
  chosen_korean: 자정쯤에
  alternatives_korean:
  - 자정에
  - 한밤중쯤에
  - 밤중 무렵
  lexicon: HALOT
  rationale: 접두 כ의 근사적 의미를 살려 단정적인 ‘자정에’보다 ‘자정쯤에’로 옮겼습니다.
- source_word: בְּתוֹךְ מִצְרָיִם
  english_pob_choice: into the midst of Egypt
  chosen_korean: 이집트 한가운데로
  alternatives_korean:
  - 이집트 가운데로
  - 이집트 한복판으로
  - 이집트 안으로
  lexicon: HALOT
  rationale: בְּתוֹךְ의 ‘가운데/한복판’ 의미와 ‘go out’의 이동성을 함께 살리기 위해 방향 조사 ‘-로’를 더해 표현했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 Tetragrammaton을 사용하므로, 전통적 대체어보다 고유 신명 ‘야훼’를 유지해 원문의 이름 표지를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접 인용 안의 화자 재현
  chosen_reading: 합쇼체로 된 전언 + 직접 발화
  alternative_readings:
  - 전체를 평서문으로 평준화
  - 예언문을 과도하게 고어화
  rationale: 모세의 서술은 합쇼체로 유지하되, 야훼의 직접 발화는 한국어에서 자연스러운 공적 전언 어조로 재현해 원문의 화자 층위를 드러냈습니다.
  doctrine_reference: 'Korean style note: direct speech and reporting register'
