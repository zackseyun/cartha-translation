id: EXO.11.5
reference: Exodus 11:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the slave woman who is behind the millstones, and every firstborn of the livestock.
  footnotes:
  - marker: a
    text: Or 'the maidservant' / 'the female slave.' The Hebrew refers to a woman in servile status; the phrase 'behind the millstones' depicts low-status grinding labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이집트 땅의 모든 처음 난 것은 죽을 것입니다[a]. 곧 파라오의 처음 난 것, 그의 왕좌에 앉아 있는 자에서부터 맷돌 뒤에 있는 여종의 처음 난 것까지, 그리고 모든 가축의 처음 난 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여종’ / ‘여자 노예’. 히브리어는 종속 신분의 여성을 가리키며, ‘맷돌 뒤에 있는’은 낮은 신분의 분쇄 노동을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  english_pob_choice: will die
  chosen_korean: 죽을 것입니다
  alternatives_korean:
  - 죽습니다
  - 죽게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 선언의 미래적 확실성을 살리면서도, 서술의 단정성을 자연스러운 합쇼체로 옮겼습니다.
- source_word: בְּכוֹר
  english_pob_choice: firstborn
  chosen_korean: 처음 난 것
  alternatives_korean:
  - 맏아들
  - 장자
  lexicon: HALOT
  rationale: 인간과 가축 모두에 이어지는 반복을 고려해, 남성 자손에 한정되지 않는 포괄적 표현을 택했습니다.
- source_word: הַשִּׁפְחָה
  english_pob_choice: the slave woman
  chosen_korean: 여종
  alternatives_korean:
  - 여노예
  - 계집종
  - 여종의 여주인
  lexicon: HALOT
  rationale: 신분의 낮음을 드러내면서도 현대 한국어에서 과도하게 거칠지 않은 전통적 종속 신분 표지로 옮겼습니다. 영어 본문이 강조한 bonded-status 대비를 한국어에서도 유지합니다.
- source_word: אַחַר הָרֵחָיִם
  english_pob_choice: behind the millstones
  chosen_korean: 맷돌 뒤에 있는
  alternatives_korean:
  - 맷돌 뒤에서 일하는
  - 맷돌 옆에 있는
  lexicon: HALOT
  rationale: 직역적 공간 표현을 살려, 낮은 신분의 분쇄 노동이라는 이미지를 보존했습니다.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  english_pob_choice: and every firstborn of the livestock
  chosen_korean: 그리고 모든 가축의 처음 난 것
  alternatives_korean:
  - 그리고 모든 가축의 맏배
  - 그리고 모든 가축의 첫 새끼
  lexicon: HALOT
  rationale: בְּהֵמָה를 현대 한국어의 '가축'으로 자연스럽게 옮기고, 앞부분과의 일관성을 위해 '처음 난 것'을 유지했습니다.
theological_decisions:
- issue: 신분 대비를 드러내는 번역
  chosen_reading: 파라오의 처음 난 것에서부터 여종의 처음 난 것까지
  alternative_readings:
  - 파라오의 맏아들에서부터 여종의 맏아들까지
  - 파라오의 장자에서부터 여종의 장자까지
  rationale: 본문은 재앙이 왕실의 최고 지위에서부터 가장 낮은 종속 노동자에 이르기까지 미친다는 점을 강조하므로, 신분적 대비가 분명히 드러나는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy)
