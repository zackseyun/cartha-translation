  - 야훼께서 … 분리하신다는 것
  lexicon: HALOT
  rationale: 이 문맥의 פלא 히필은 ‘기이한 일을 하다’보다 ‘구별하다/가르다’의 뜻이 적합하므로, 관계적 차이를 드러내는 ‘구별하다’를 택했습니다.
