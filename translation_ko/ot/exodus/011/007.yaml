  rationale: 본문의 신명은 제목이 아니라 고유명으로 드러나므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 완전한 무해와 보호를 암시하는 관용구의 처리
  chosen_reading: ‘개가 혀를 놀리지 못할 것입니다’로 직역적 이미지를 살리되, 의미상 이스라엘에 대한 어떤 위협도 없다는 점을 드러냈습니다.
  alternative_readings:
  - ‘개가 짖지 못할 것입니다’로 완전한 평안을 더 직접적으로 표현
  - ‘개가 그들을 향해 짖지 못할 것입니다’로 관용 의미를 명시
  rationale: 히브리어 관용구를 너무 평평하게 만들지 않으면서도 독자가 문맥상 안전과 보호를 이해하도록 균형을 잡았습니다.
  doctrine_reference: 본문 관용구의 의미 범위에 대한 번역 판단
