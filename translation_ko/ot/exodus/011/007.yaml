  - 개가 짖지 못할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 직역 이미지는 살리되, 한국어에서는 관용적 의미인 ‘짖다/소란을 피우다’에 해당하는 표현으로 자연스럽게 풀었습니다. 원문의 긴장감을 보존하기 위해 완전한 평온을 가리키는 문맥을 유지했습니다.
