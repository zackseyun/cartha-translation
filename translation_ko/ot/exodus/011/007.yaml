  lexicon: HALOT
  rationale: 인간과 동물을 함께 포괄하는 범위를 나타내는 대구를 한국어의 범위 표현으로 옮겼습니다.
- source_word: יַפְלֶה יְהוָה
  english_pob_choice: Yahweh makes a distinction
  chosen_korean: 야훼께서 … 구별하신다는 것
