translation:
  language: ko
  text: 그러나 이스라엘 자손 누구에게도 — 사람에게서 짐승에 이르기까지 — 개가 혀를 놀리지 못할 것입니다. 이것은 야훼께서 이집트와 이스라엘 사이를 구별하신다는 것을 여러분이 알게 하시려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘개가 혀를 날카롭게 하다’이지만, 관용적으로는 ‘개가 짖지 못하다’라는 뜻으로 이해됩니다.
    reason: lexical_alternative
