revisions:
- from: 그리고 야훼께서 이집트 사람들의 눈에 백성에게 호의를 주셨습니다. 또한 그 사람 모세는 이집트 땅에서 바로의 신하들의 눈에, 그리고 백성의 눈에 매우 위대하였습니다.[a][b][c][d]
  to: 야훼께서 이집트 사람들의 보기에 백성이 호의를 얻도록 하셨습니다.[a] 또한 모세라는 그 사람은[b] 이집트 땅에서 바로의 신하들이 보기에,[c] 또 백성이 보기에[d] 매우 위대했습니다.
  rationale: 첫 절을 한국어의 자연스러운 서술 구조로 고쳐, 야훼께서 백성이 이집트 사람들에게 호의를 얻도록 하셨다는 히브리어 관용구의 의미를 명확히 했습니다. ‘눈에’라는 문자적 이미지는 각주에 보존했습니다. 모세를 가리키는 강조 표현과, 바로의 신하들과 더 넓은 백성이라는 두 집단의 구별은 유지했으며, 마지막 ‘백성’의 지시 대상은 본문에서 해석적으로 좁히지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:28Z'
