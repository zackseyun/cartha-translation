id: EXO.11.3
reference: Exodus 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
  footnotes:
  - marker: a
    text: Or 'in the eyes of the Egyptians.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the man, Moses,' preserving the Hebrew emphasis.
    reason: lexical_alternative
  - marker: c
    text: Or 'Pharaoh’s officials'; the Hebrew is literally 'Pharaoh’s servants.'
    reason: lexical_alternative
  - marker: d
    text: The final 'the people' likely refers to the broader populace in Egypt, in contrast to Pharaoh’s servants.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 이집트 사람들의 보기에 백성이 호의를 얻도록 하셨습니다.[a] 또한 모세라는 그 사람은[b] 이집트 땅에서 바로의 신하들이 보기에,[c] 또 백성이 보기에[d] 매우 위대했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트 사람들의 눈에’라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 사람 모세’라는 표현으로 모세를 강조합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘바로의 관리들’로 옮길 수 있습니다. 원문은 문자적으로 ‘바로의 종들’입니다.
    reason: lexical_alternative
  - marker: d
    text: 마지막 ‘백성’은 문맥상 이집트의 넓은 민중을 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: POB의 일관된 원칙에 따라 신적 고유명사는 ‘야훼’로 옮겨, 제목 ‘주’로 대체하지 않고 원문의 인칭성을 보존했습니다.
- source_word: חֵן
  english_pob_choice: favor
  chosen_korean: 호의
  alternatives_korean:
  - 은총
  - 은혜
  - 호감
  lexicon: HALOT
  rationale: 여기서 חֵן은 사람들 사이의 호의와 호감을 가리키므로, 신학적으로 강한 ‘은혜’보다 사회적 관계를 드러내는 ‘호의’가 더 정확합니다.
- source_word: בְּעֵינֵי מִצְרַיִם
  english_pob_choice: in the sight of the Egyptians
  chosen_korean: 이집트 사람들의 눈에
  alternatives_korean:
  - 이집트 사람들의 보기에
  - 이집트 사람들의 시야에서
  - 이집트 사람들의 관점에서
  lexicon: HALOT
  rationale: 히브리어 관용구 בְּעֵינֵי를 직역하면 ‘눈에’이므로, 관계적 평가를 드러내면서도 원문 이미지를 살리는 표현으로 옮겼습니다.
- source_word: הָאִישׁ מֹשֶׁה
  english_pob_choice: the man Moses
  chosen_korean: 그 사람 모세는
  alternatives_korean:
  - 그 사람, 모세는
  - 모세라는 그 사람은
  - 그 남자 모세는
  lexicon: HALOT
  rationale: 히브리어의 강조된 표현을 살리기 위해 단순히 이름만 두지 않고 ‘그 사람 모세’로 옮겨, 모세를 지칭하는 서술상의 무게를 보존했습니다.
- source_word: עַבְדֵי פַרְעֹה
  english_pob_choice: Pharaoh’s servants
  chosen_korean: 바로의 신하들의
  alternatives_korean:
  - 바로의 종들의
  - 바로의 관리들의
  - 바로의 시종들의
  lexicon: HALOT
  rationale: 문맥상 궁정 관료층을 가리키지만, 본문은 문자적으로 ‘바로의 종들’이므로 한국어에서 자연스럽고 관료적 뉘앙스를 살릴 수 있는 ‘신하들’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 호의가 누구에게 주어졌는가
  chosen_reading: ‘백성’에게 주어진 호의로 읽되, 문맥상 이스라엘 백성을 가리키는 표현으로 처리했습니다.
  alternative_readings:
  - 이집트 사람들의 눈에 이스라엘 백성이 호의를 얻었다
  - 야훼께서 이스라엘에게 호의를 주셨다
  rationale: 히브리어는 ‘백성’만을 말하며, 문맥상 그 백성은 이스라엘이지만 원문에 없는 해설어를 본문에 넣지 않기 위해 ‘백성’으로 유지했습니다.
  doctrine_reference: Exodus 11:3 문맥상 지시대상 보존 원칙
