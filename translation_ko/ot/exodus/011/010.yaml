  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
  footnotes:
  - marker: a
    text: Or 'all these wonders.' The Hebrew term can denote miraculous signs or wonders.
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD strengthened Pharaoh’s heart' or 'made Pharaoh’s heart firm.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the Israelites' or 'the children of Israel.' Literally, 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세와 아론은 바로 앞에서 이 모든 표징을[a] 행했습니다. 야훼께서 바로의 마음을 굳게 하셨고,[b] 바로는 이스라엘 자손을[c] 자기 땅에서 내보내지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이적들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘바로의 마음을 강하게 하셨다’ 또는 ‘바로의 마음을 굳게 만드셨다’.
    reason: lexical_alternative
  - marker: c
    text: 문자적으로 ‘이스라엘의 아들들’. 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘의 자녀들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹפְתִים
  english_pob_choice: signs
  chosen_korean: 표징
  alternatives_korean:
  - 기이한 일들
  - 기적들
  - 표적들
  lexicon: HALOT
  rationale: 출애굽기의 문맥에서 מֹפֵת은 하나님의 능력을 드러내는 이적을 가리키므로, 기능을 살린 ‘표징’이 ‘기이한 일들’보다 간결하고 본문 성격을 잘 드러냅니다.
- source_word: וַיְחַזֵּק
  english_pob_choice: hardened
  chosen_korean: 굳게 하셨으므로
  alternatives_korean:
  - 강하게 하셨으므로
  - 단단하게 하셨으므로
  - 굳어지게 하셨으므로
  lexicon: HALOT
  rationale: 히브리어 חזק의 기본 이미지는 ‘강하게 하다/굳게 하다’이므로, ‘굳게 하셨다’로 옮겨 POB의 신학적 긴장과 더 직접적인 어휘 이미지를 함께 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이름 자체를 보존하는 POB 원칙에 따라, הסתברות של title substitution보다 음역 ‘야훼’를 사용했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구조를 과도하게 완화하지 않으면서도 한국어에서 자연스럽게 읽히는 전통적 문구를 유지했습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 남성 복수와 집합적 의미
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  rationale: 원문은 문자적으로 ‘이스라엘의 아들들’이지만, 한국어에서는 집합적 공동체를 가리키는 표준 성경 표현 ‘이스라엘 자손’이 가장 직접적으로 대응합니다. 성별 중립화보다 원문 구조를 유지하는 쪽을 택했습니다.
  doctrine_reference: Gender-accurate over gender-neutral.
- issue: YHWH가 바로의 마음을 굳게 하신다는 진술
  chosen_reading: 야훼께서 바로의 마음을 굳게 하셨으므로
  alternative_readings:
  - 야훼께서 바로의 마음을 강하게 하셨으므로
  - 야훼께서 바로의 마음을 단단하게 하셨으므로
  rationale: ‘굳게 하다’는 본문의 반복 공식이 지닌 신학적 긴장—하나님의 주권과 바로의 완강함—을 무디게 하지 않으면서도 한국어에서 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — divine hardening language'
