translation:
  language: ko
  text: 또 이집트 온 땅에 큰 부르짖음이 있을 것인데, 그와 같은 부르짖음은 전에도 없었고 다시는 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 외침’, ‘큰 울부짖음’으로 옮길 수도 있습니다. 히브리어 צְעָקָה는 고통의 큰 소리를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְעָקָה גְדֹלָה
  english_pob_choice: a great cry
  chosen_korean: 큰 부르짖음
  alternatives_korean:
  - 큰 울부짖음
  - 큰 외침
  lexicon: HALOT
  rationale: צְעָקָה는 단순한 외침보다 고통이나 절박함이 섞인 큰 부르짖음을 가리킬 수 있어, 문맥상 재앙의 비탄을 드러내는 표현으로 옮겼습니다.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
