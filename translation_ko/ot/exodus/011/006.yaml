  - 이집트의 온 땅에
  lexicon: HALOT
  rationale: 전역 전체를 가리키는 범위를 자연스러운 현대 한국어로 간결하게 살렸습니다.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה / וְכָמֹהוּ לֹא תֹסִף
  english_pob_choice: such as has never happened before, nor will ever happen again
  chosen_korean: 전에 없었던 것이며 다시는 없을 것입니다
  alternatives_korean:
  - 그 전에도 없었고 후에도 없을 것입니다
  - 그와 같은 일은 이전에도 없었고 이후에도 없을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘있다/생기다’ 계열 비교를 따라, ‘존재/발생’의 대조를 살리면서도 한국어에서는 사건 의미가 드러나도록 옮겼습니다.
