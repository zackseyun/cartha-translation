- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה / וְכָמֹהוּ לֹא תֹסִף
  english_pob_choice: such as has never happened before, nor will ever happen again
  chosen_korean: 전에 없었던 것이며 다시는 없을 것입니다
  alternatives_korean:
  - 그 전에도 없었고 후에도 없을 것입니다
