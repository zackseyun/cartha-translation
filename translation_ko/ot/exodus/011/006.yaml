translation:
  language: ko
  text: 또 이집트 온 땅에 큰 부르짖음이 있을 것이니, 전에 없었던 것이며 다시는 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 외침’, ‘큰 울부짖음’으로 옮길 수도 있습니다. 히브리어 צְעָקָה는 고통의 큰 소리를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְעָקָה גְדֹלָה
  english_pob_choice: a great cry
  chosen_korean: 큰 부르짖음
  alternatives_korean:
