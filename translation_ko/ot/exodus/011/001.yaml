  to: 그때 야훼께서 모세에게 말씀하셨습니다. “내가 바로와 이집트에 또 하나의 재앙을 내릴 것입니다. 그 뒤에 그는 너희를 여기서 내보낼 것입니다. 그가 너희를 내보낼 때에는, 너희를 여기서 완전히 몰아낼 것입니다.”
