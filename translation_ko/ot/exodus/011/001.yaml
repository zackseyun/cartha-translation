source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
  footnotes:
  - marker: a
    text: Or 'blow,' 'stroke,' or 'affliction' for 'plague.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression 'he will surely drive you out' is emphatic; literally, 'driving out he will drive you out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “내가 바로와 이집트에 또 하나의 재앙을 내릴 것입니다. 그 뒤에 그는 너희를 여기서 내보낼 것입니다. 그가 너희를 내보낼 때에는, 너희를 여기서 완전히 몰아낼 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원칙에 따라 신적 고유명사 יְהוָה는 칭호가 아니라 고유명사로서 ‘야훼’로 옮겨, 본문의 언약적 이름을 보존했습니다.
- source_word: נֶגַע
  english_pob_choice: plague
  chosen_korean: 재앙
  alternatives_korean:
  - 전염병
  - 타격
  - 환난
  lexicon: HALOT
  rationale: 출애굽기의 심판 맥락에서는 ‘재앙’이 영어 POB의 ‘plague’에 가장 자연스럽고, 하나님의 심판이라는 함의도 함께 살립니다.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  english_pob_choice: he will send you away from here
  chosen_korean: 너희를 여기서 내보낼 것입니다
  alternatives_korean:
  - 너희를 여기서 보내줄 것입니다
  - 너희를 여기서 보내낼 것입니다
  lexicon: HALOT
  rationale: שׁלח의 핵심은 단순한 허용이 아니라 ‘보내어 떠나게 함’이므로, 자연스러운 한국어로 ‘내보내다’를 택했습니다.
- source_word: גָּרֵשׁ יְגָרֵשׁ
  english_pob_choice: he will surely drive you out
  chosen_korean: 완전히 몰아낼 것입니다
  alternatives_korean:
  - 반드시 몰아낼 것입니다
  - 완전히 쫓아낼 것입니다
  lexicon: HALOT
  rationale: 강조형 구조(부정확한 반복이 아니라 동사의 강한 강조)를 살려, 단순한 ‘보내다’보다 더 강한 ‘몰아내다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 실제로 신적 고유명사를 사용하므로, 전통적 대체표현보다 이름 자체를 드러내는 ‘야훼’가 원문 의도를 더 직접적으로 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
