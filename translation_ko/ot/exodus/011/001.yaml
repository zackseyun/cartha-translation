  terminology: ‘야훼’는 POB의 신명 표기 원칙과 일치하며, ‘바로’, ‘이집트’, ‘재앙’, ‘모세’도 일관되고 자연스럽습니다. נֶגַע의 넓은 어휘 범위는 문맥상 ‘재앙’으로 충분히 전달됩니다.
  issues:
