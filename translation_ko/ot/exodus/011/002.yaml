translation:
  language: ko
  text: 이제 백성이 듣도록 말하십시오. 각 남자는 자기 이웃에게서, 각 여자는 자기 이웃에게서 은으로 된 물품과 금으로 된 물품을 구하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빌리다’. 히브리어 동사는 ‘묻다’ 또는 ‘요청하다’의 뜻이며, 본문만으로는 그 물품을 반환해야 한다는 뜻을 담고 있지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר
  english_pob_choice: Speak
  chosen_korean: 말씀하십시오
  alternatives_korean:
  - 말하시오
  - 이야기하십시오
  lexicon: HALOT
  rationale: 명령형 דבר을 한국어의 공손한 직접 명령으로 옮겼습니다. 하나님이 모세에게 하시는 말씀이라는 문맥을 반영하되, 합쇼체를 유지했습니다.
- source_word: בְּאָזְנֵי הָעָם
  english_pob_choice: in the hearing of the people
  chosen_korean: 백성의 귀에 대고
  alternatives_korean:
  - 백성에게
  - 백성의 들음 안에서
  lexicon: HALOT
  rationale: 직역하면 ‘귀에’이지만, 한국어에서는 ‘~의 귀에 대고’가 공적으로 또렷이 들리게 말하라는 관용을 잘 살립니다. 영어 POB의 청각적 뉘앙스를 유지했습니다.
- source_word: וְיִשְׁאֲלוּ
  english_pob_choice: and let each man ask
  chosen_korean: 구하게 하십시오
  alternatives_korean:
  - 달라고 하게 하십시오
  - 요청하게 하십시오
  lexicon: HALOT
  rationale: שאל은 본래 ‘묻다/구하다/요청하다’의 뜻이며, 여기서는 반환 의무를 포함한 ‘빌리다’가 아닙니다. 한국어에서는 자연스럽고 오해가 적은 ‘구하다’를 택했습니다.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  english_pob_choice: articles of silver and articles of gold
  chosen_korean: 은그릇과 금그릇
  alternatives_korean:
  - 은으로 된 물품과 금으로 된 물품
  - 은붙이와 금붙이
  lexicon: HALOT
  rationale: כְּלִי는 넓게 ‘그릇/기물/도구’를 가리키므로, 문맥상 실제로 집어 달라고 하는 귀중품을 한국어로 가장 무리 없이 살리는 ‘은그릇/금그릇’으로 옮겼습니다. ‘articles’의 폭은 그릇이라는 일반명사로 충분히 반영됩니다.
theological_decisions:
- issue: שאל을 ‘빌리다’로 옮길지 여부
  chosen_reading: ‘구하다’로 옮기고, 반환을 전제하는 해석은 본문에 두지 않았습니다.
  alternative_readings:
  - 빌리다
  - 차용하다
  rationale: 본문의 히브리어는 요청 행위를 말할 뿐, 반환 약속을 포함하지 않습니다. 따라서 전통적 교회 용어보다 원문 의미를 우선했습니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
