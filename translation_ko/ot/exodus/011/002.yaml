revisions:
- from: 이제 백성의 귀에 대고 말씀하십시오. 그러면 각 남자는 자기 이웃에게서, 각 여자는 자기 이웃에게서 은그릇과 금그릇을 구하게 하십시오.[a]
  to: 이제 백성이 듣도록 말하십시오. 각 남자는 자기 이웃에게서, 각 여자는 자기 이웃에게서 은으로 된 물품과 금으로 된 물품을 구하게 하십시오.[a]
  rationale: כְּלֵי를 ‘물품’으로 옮겨 원문의 포괄성을 보존하고, 청각 관용구를 자연스러운 현대 한국어로 다듬었습니다. שאל의 ‘구하다’와 ‘빌리다’라는 대안 주석은 유지하여 원문의 의미와 전통적 번역 가능성을 모두 제시했습니다.
