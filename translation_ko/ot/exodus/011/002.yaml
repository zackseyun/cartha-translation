  source_fidelity: 히브리어의 명령과 요청 동사(שאל)의 기본 의미를 대체로 충실히 반영합니다. 그러나 כְּלֵי는 그릇에 한정되지 않는 넓은 ‘물품/기물’이므로 ‘은그릇과 금그릇’은 의미를 부당하게 좁힙니다.
