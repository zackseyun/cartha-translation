  text: וְ/יָרְד֣וּ כָל עֲבָדֶי/ךָ֩ אֵ֨לֶּה אֵלַ֜/י וְ/הִשְׁתַּֽחֲוּוּ לִ֣/י לֵ/אמֹ֗ר צֵ֤א אַתָּה֙ וְ/כָל הָ/עָ֣ם אֲשֶׁר בְּ/רַגְלֶ֔י/ךָ וְ/אַחֲרֵי כֵ֖ן אֵצֵ֑א וַ/יֵּצֵ֥א מֵֽ/עִם פַּרְעֹ֖ה בָּ/חֳרִי אָֽף־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
  footnotes:
  - marker: a
    text: Literally, 'all the people who are at your feet,' an idiom for those accompanying or following you.
    reason: lexical_alternative
  - marker: b
    text: Or 'your officials' for 'servants of yours'; the Hebrew term can refer to royal attendants in a court setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 당신의 이 모든 신하가 내게로 내려와 내 앞에 절하며 말할 것입니다. ‘당신과 당신 발밑에 있는 모든 백성은 나가십시오.’ 그 후에야 내가 나가겠습니다.” 그러고 나서 그는 맹렬한 분노 속에서 바로에게서 나갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘발밑에 있는 백성’은 ‘따르는 사람들/부하들’을 가리키는 관용구입니다.
    reason: source_note
  - marker: b
    text: ‘신하’는 여기서 궁정의 시종·수행원을 가리킬 수 있으며, 단순한 개인 종보다 왕실 맥락을 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  english_pob_choice: will come down
  chosen_korean: 내게로 내려와
  alternatives_korean:
  - 내게로 가서
  - 내게로 내려오며
  lexicon: HALOT
  rationale: ירד의 기본 뜻인 ‘내려오다’를 살리되, 화자가 있는 곳으로 오는 방향감을 자연스럽게 표현했습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: servants of yours
  chosen_korean: 당신의 이 모든 신하
  alternatives_korean:
  - 당신의 종들
  - 당신의 모든 종들
  - 당신의 모든 신하들
  lexicon: HALOT
  rationale: 궁정 맥락에서 עבד는 ‘종’보다 ‘신하/시종’이 더 자연스럽고, POB의 court setting 뉘앙스를 살리기 위해 ‘신하’를 택했습니다.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  english_pob_choice: bow down to me
  chosen_korean: 내 앞에 절하며
  alternatives_korean:
  - 내게 엎드리며
  - 내게 경배하며
  - 내 앞에 꿇어 절하며
  lexicon: HALOT
  rationale: שׁחה는 실제로 몸을 굽혀 절하는 행위를 가리키므로, 예배적 ‘경배’보다 정황에 맞는 ‘절하다’로 옮겼습니다.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  english_pob_choice: and all the people who are at your feet
  chosen_korean: 당신 발밑에 있는 모든 백성
  alternatives_korean:
  - 당신 발치에 있는 모든 백성
  - 당신을 따르는 모든 백성
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 ‘발밑에 있는’으로 살리되, 한국어에서 이해 가능하도록 ‘백성’을 붙였습니다.
- source_word: בָּחֳרִי אָף
  english_pob_choice: in burning anger
  chosen_korean: 맹렬한 분노 속에서
  alternatives_korean:
  - 불타는 분노 속에서
  - 격렬한 분노 속에서
  - 뜨거운 분노 속에서
  lexicon: HALOT
  rationale: אָף의 ‘분노’와 בָּחֳרִי의 불타는 강도를 함께 반영하되, 한국어에서 과도하게 비유적이지 않은 표현으로 정리했습니다.
theological_decisions:
- issue: 공손한 직설 인용과 화자의 격앙된 퇴장
  chosen_reading: 직접 인용문은 왕을 향한 예언적/심판적 발화로서 ‘나가십시오’의 정중한 명령형을 유지하고, 서술문은 ‘맹렬한 분노’로 화자의 격앙을 드러냈습니다.
  alternative_readings:
  - ‘나가라’로 낮춘 반말형
  - ‘떠나십시오’로 완화한 표현
  rationale: 본문은 파라오에게 주는 명령이지만, 한국어 합쇼체 규범과 궁정 장면의 긴장을 함께 살리기 위해 정중한 명령형을 택했습니다.
  doctrine_reference: 출애굽기 11장의 심판 선언과 모세의 권위 있는 예언 발화
