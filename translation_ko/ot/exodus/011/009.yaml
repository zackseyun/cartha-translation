  to: 야훼께서 모세에게 말씀하셨습니다.[c] “파라오는 너희에게 귀를 기울이지 않을 것입니다.[a] 이는 내 이적들이 이집트 땅에서 더욱 많아지도록 하려는 것입니다.[b]”
  rationale: 수정은 원문의 단순 과거 서사, 복수인 ‘너희’, שמע + אל의 ‘귀를 기울이다’, לְמַעַן의 목적, 그리고 ‘내 이적들이 많아짐’을 보존합니다. 교리적 해석을 덧붙이지 않았으며, 각주를 해당 본문 어구에 정확히 연결했습니다.
