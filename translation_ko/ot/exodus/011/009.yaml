id: EXO.11.9
reference: Exodus 11:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה לֹא יִשְׁמַ֥ע אֲלֵי/כֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
  footnotes:
  - marker: a
    text: Or 'will not hear you' or 'will not heed you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my signs.' The Hebrew term can denote wonders, signs, or portents.
    reason: lexical_alternative
  - marker: c
    text: Some translations render 'And the LORD had said to Moses' to relate this statement to the preceding narrative context; the Hebrew verbal form itself is the standard narrative past.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “파라오는 너희의 말을 듣지 않을 것입니다. 이는 내가 내 이적들을 이집트 땅에서 더욱 많아지게 하려는 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘듣지 않다’는 כאן에서 ‘귀를 기울이지 않다/마음에 두지 않다’의 관용적 의미일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이적’은 여기서 ‘표적’ 또는 ‘기이한 일’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 번역은 앞 문맥과의 연결을 위해 ‘야훼께서 모세에게 이미 말씀하셨습니다’처럼 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 고유한 언약 이름을 제목어로 대체하지 않고, POB의 원칙에 따라 음역형인 야훼를 사용했습니다.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  english_pob_choice: will not listen to you
  chosen_korean: 너희의 말을 듣지 않을 것입니다
  alternatives_korean:
  - 너희에게 귀를 기울이지 않을 것입니다
  - 너희에게 순종하지 않을 것입니다
  lexicon: HALOT
  rationale: שמע + אל의 관용적 의미를 살려 ‘듣다/귀를 기울이다’로 옮기되, 본문의 거부를 자연스럽게 드러내기 위해 ‘너희의 말을’로 풀었습니다.
- source_word: מוֹפְתַי
  english_pob_choice: my wonders
  chosen_korean: 내 이적들
  alternatives_korean:
  - 내 표적들
  - 내 기이한 일들
  lexicon: HALOT
  rationale: מופת는 출애굽 맥락에서 표적·이적·기이한 일을 아우르므로, 한국어에서는 문맥상 가장 자연스러운 ‘이적들’로 옮겼습니다.
- source_word: בְּאֶרֶץ מִצְרָיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 이집트의 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ를 반영하면서도 현대 한국어에서 자연스러운 표현을 위해 ‘이집트 땅에서’로 옮겼습니다.
theological_decisions:
- issue: 파라오의 거절과 하나님의 목적 관계
  chosen_reading: 파라오가 듣지 않는 일이 하나님의 이적을 이집트에서 더욱 많아지게 하려는 목적 안에 놓여 있음을 그대로 살렸습니다.
  alternative_readings:
  - 단순한 결과 진술로 약화할 수 있음
  - 하나님의 주권적 의도를 더 풀어서 설명할 수 있음
  rationale: לְמַעַן의 목적성을 유지해, 파라오의 거절과 하나님의 목적이 함께 서 있는 본문의 긴장을 해치지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
