lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: For seven days
  chosen_korean: 7일 동안은
  alternatives_korean:
  - 일곱 날 동안
  - 7일 동안
  lexicon: HALOT
  rationale: משך 기간을 나타내는 표현이므로, 한국어에서는 자연스러운 지속 표현인 ‘7일 동안’을 써서 명령문의 기간을 분명히 드러냈습니다.
- source_word: תֹּאכַל מַצֹּת
  english_pob_choice: you shall eat unleavened bread
  chosen_korean: 무교병을 먹어야 하고
  alternatives_korean:
  - 누룩 없는 떡을 먹어야 하고
  - 무교병을 먹으십시오
  lexicon: HALOT
  rationale: מצות는 유월절·무교절 문맥의 정식 음식이므로 ‘무교병’을 택했고, 지시법의 חובה를 살리되 한국어 합쇼체에 맞게 ‘먹어야 하고’로 옮겼습니다.
- source_word: חַג
  english_pob_choice: a feast
  chosen_korean: 절기
  alternatives_korean:
  - 명절
  - 축제
  lexicon: HALOT
  rationale: חג는 단순한 잔치보다 예배적 기념일의 뉘앙스가 강해, 한국어 성서 용례에 맞는 ‘절기’가 가장 정확합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 원문이 직접 YHWH를 지칭하므로 프로젝트 기본어인 ‘야훼’를 유지했고, 여격 관계는 ‘-께’로 드러냈습니다.
theological_decisions:
- issue: 문장 내 의무 표현의 강도
  chosen_reading: “먹어야 하고”로 지시적 의무를 살리되 과도한 금지/강제 어조는 피했습니다.
  alternative_readings:
  - 먹어야 합니다
  - 반드시 먹어야 합니다
  rationale: 열거된 규례 문맥에서 히브리어 미완료형의 규범적 지시를 자연스럽게 나타내면서도, 한국어 법령체처럼 지나치게 경직되지 않게 하려는 선택입니다.
  doctrine_reference: 출애굽기 13장 규례 문맥의 언약적 지시
