translation:
  language: ko
  text: 7일 동안 무교병을 먹어야 합니다. 일곱째 날은 야훼[a]께 드리는 절기입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: YHWH(יהוה).'
