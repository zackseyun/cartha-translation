translation:
  language: ko
  text: 야훼께서는 낮에는 구름 기둥으로 그들 앞서 가시며 그들을 그 길로 인도하시고, 밤에는 불 기둥으로 그들에게 빛을 비추셔서 그들이 낮에도 밤에도 갈 수 있게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 본문의 고유 신명사 יְהוָה를 음역하여, 공통 번역어인 ‘주님’보다 원문 식별성을 살리고 POB의 신명사 원칙에 맞췄습니다.
- source_word: בְּעַמּוּד עָנָן
  english_pob_choice: in a pillar of cloud
  chosen_korean: 구름 기둥으로
  alternatives_korean:
  - 구름 기둥 안에서
  - 구름 기둥 속에서
  lexicon: WLC/HALOT
  rationale: עַמּוּד은 ‘기둥’으로 옮기고, 행위 수단·형태를 나타내는 문맥에 맞게 ‘으로’를 사용해 자연스러운 한국어로 표현했습니다.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  english_pob_choice: to lead them on the way
  chosen_korean: 길을 인도하셨고
  alternatives_korean:
  - 그들을 길로 이끄셨고
  - 길을 안내하셨고
  lexicon: WLC/HALOT
  rationale: נחה의 핵심 의미는 ‘인도하다/이끌다’이므로, 출애굽기의 안내·동행 맥락을 살려 ‘길을 인도하다’로 옮겼습니다.
- source_word: לְהָאִיר לָהֶם
  english_pob_choice: to give them light
  chosen_korean: 그들에게 빛을 주셔서
  alternatives_korean:
  - 그들을 비추셔서
  - 그들에게 빛을 비추셔서
  lexicon: WLC/HALOT
  rationale: האיר의 결과를 분명히 드러내는 표현으로 ‘빛을 주다’를 택해, 밤길을 걷게 하려는 목적을 자연스럽게 살렸습니다.
theological_decisions:
- issue: 여호와/야훼의 신명사 처리
  chosen_reading: 본문의 יהוה는 ‘야훼’로 직접 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문이 고유 신명사를 직접 사용하므로, 번역어로 일반화하기보다 이름 자체를 보존하는 것이 원문의 식별성과 신학적 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
