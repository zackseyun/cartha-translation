source:
  edition: WLC
  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
  footnotes:
  - marker: a
    text: Or 'the Red Sea.' The Hebrew name is literally 'Sea of Reeds.'
    reason: alternative_reading
  - marker: b
    text: The Hebrew term rendered 'equipped for battle' is uncertain; it may also mean 'armed,' 'in battle array,' or more generally 'in ordered ranks.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하나님께서는 백성을 광야 길을 따라 갈대 바다[a] 쪽으로 돌아가게 하셨습니다. 이스라엘 자손들은 무장한 채[b] 이집트 땅에서 올라왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘홍해’. 히브리어 이름은 문자적으로 ‘갈대 바다’입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어의 이 표현은 뜻이 확실하지 않으며, ‘무장한’, ‘전투 태세를 갖춘’, ‘전투 대형을 이루어’, 또는 ‘정렬된 대오로’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  english_pob_choice: led ... around
  chosen_korean: 돌아가게 하셔서
  alternatives_korean:
  - 우회하게 하셔서
  - 둘러가게 하셔서
  lexicon: HALOT
  rationale: 히필형의 원인적 의미를 살려 하나님이 백성의 경로를 우회시키셨다는 점을 자연스럽게 표현했습니다.
- source_word: יַם סוּף
  english_pob_choice: the Sea of Reeds
  chosen_korean: 갈대 바다
  alternatives_korean:
  - 홍해
  - 수풀 바다
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미를 우선해 ‘갈대 바다’로 옮기고, 전통적 번역인 ‘홍해’는 본문이 아니라 주석적 대안으로 두었습니다.
- source_word: וַחֲמֻשִׁים
  english_pob_choice: armed
  chosen_korean: 무장한 채
  alternatives_korean:
  - 전투 태세를 갖춘 채
  - 정렬된 대오로
  lexicon: HALOT
  rationale: 어휘 자체가 불확실하지만, 문맥상 최소한 무장 또는 전투 준비 상태를 뜻할 수 있으므로 간결하게 ‘무장한 채’로 처리했습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 형태를 평탄화하지 않고 가능한 한 직접 반영했습니다.
theological_decisions:
- issue: יַם סוּף의 전통 번역과 원문 우선성
  chosen_reading: 본문에는 ‘갈대 바다’를 두고, 전통적인 ‘홍해’는 주석적 대안으로만 처리합니다.
  alternative_readings:
  - 홍해
  rationale: POB의 원어 우선 원칙을 따라, 익숙한 교회 용어보다 히브리어의 직역 가능성을 우선했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
- issue: בְנֵי יִשְׂרָאֵל의 성중성화 여부
  chosen_reading: ‘이스라엘의 아들들’로 남성 복수의 형태를 유지합니다.
  alternative_readings:
  - 이스라엘 자손들
  - 이스라엘 사람들
  rationale: 문법 형태를 지우지 않고 원문의 집단 명칭을 드러내기 위해 직역 성격을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
