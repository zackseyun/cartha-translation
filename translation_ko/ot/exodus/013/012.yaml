  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
  footnotes:
  - marker: a
    text: Literally, 'every opener of the womb.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'every first issue of the livestock'; the Hebrew refers to the first offspring born from the womb among domesticated animals, with the males specifically belonging to the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 태를 여는 모든 것[a]을 야훼께 구별하여 바쳐야 하며, 당신이 가진 가축에서 처음 난 모든 수컷 새끼[b]는 야훼께 속합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘태를 여는 모든 것’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 가축에서 처음 난 산출물, 곧 첫 새끼를 가리키며, 여기서는 특히 수컷을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  english_pob_choice: you shall set apart
  chosen_korean: 구별하여 바쳐야 하며
  alternatives_korean:
