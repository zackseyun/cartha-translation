translation:
  language: ko
  text: 당신은 태를 여는 모든 것[a]을 야훼께 구별하여 바쳐야 하며, 당신에게 있는 가축의 모든 수컷 첫새끼[b]는 야훼께 속합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘태를 여는 모든 것’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 가축의 첫 산출, 곧 첫 새끼를 가리키며, 여기서는 특히 수컷을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  english_pob_choice: you shall set apart
  chosen_korean: 구별하여 바쳐야 하며
