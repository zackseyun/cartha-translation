  lexicon: project glossary
  rationale: 본 프로젝트 기본어휘에 따라 신명은 ‘야훼’로 옮기며, 여기서는 헌납/귀속의 방향을 나타내는 여격 ‘-께’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 귀속 표현
  chosen_reading: 본문의 יהוה는 ‘야훼’로 옮기고, 제의적 귀속은 ‘야훼께 속합니다’로 분명히 밝혔습니다.
  alternative_readings:
  - 여호와께
  - 주님의 것
  - 야훼의 것
  rationale: 프로젝트 표준은 יהוה를 ‘야훼’로 표기하는 것이며, 마지막 절구는 단순 소속이 아니라 성별된 소유권을 말하므로 ‘속합니다’가 원문의 제의적 힘을 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
