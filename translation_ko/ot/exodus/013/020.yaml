  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠나
  - 출발하여
  - 여행하여
  lexicon: HALOT
  rationale: נסע의 서술 진행을 자연스러운 현대 한국어로 옮기되, 이동과 다음 진지로의 전환을 간명하게 드러내기 위해 ‘떠나’로 렌더링했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: and camped
  chosen_korean: 진을 쳤는데
  alternatives_korean:
  - 장막을 쳤는데
  - 캠프를 쳤는데
  - 야영했는데
  lexicon: HALOT
  rationale: חנה는 단순히 머무는 것이 아니라 군사·광야 서사의 ‘진을 치다’라는 뉘앙스를 가지므로, 문맥의 서사성을 살려 이 표현을 택했습니다.
- source_word: בִּקְצֵה הַמִּדְבָּר
  english_pob_choice: on the edge of the wilderness
  chosen_korean: 광야의 가장자리에
  alternatives_korean:
  - 광야의 끝에
  - 광야의 경계에
  - 광야의 변두리에
  lexicon: HALOT
  rationale: קָצֶה의 ‘edge/border’ 의미를 유지하면서, 한국어에서 공간적 접경을 가장 자연스럽게 나타내는 ‘가장자리’를 사용했습니다.
theological_decisions:
- issue: מִדְבָּר의 번역 범위
  chosen_reading: ‘광야’로 번역해, 단순한 사막이 아니라 유목·통과 공간이라는 성경적 의미를 보존했습니다.
  alternative_readings:
  - 사막
  - 들판
  rationale: מִדְבָּר는 일반적인 건조한 사막보다 넓은 ‘wilderness/steppe’의 의미를 가질 수 있으므로, 본문 지리 묘사의 정확성을 위해 ‘광야’를 택했습니다.
  doctrine_reference: 성경 지리·서사 어휘
