  - 이제
  lexicon: HALOT
  rationale: 정관사와 결합한 הזמן 부사적 용법을 한국어의 자연스러운 시간 부사 ‘오늘’로 옮겨, 출애굽 사건의 즉시성을 살렸습니다.
- source_word: אַתֶּם
