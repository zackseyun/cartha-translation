- source_word: יֹצְאִים
  english_pob_choice: are going out
  chosen_korean: 나갑니다
  alternatives_korean:
  - 나가고 있습니다
  - 떠납니다
  lexicon: HALOT
  rationale: 진행·임박의 분사적 뉘앙스를 한국어 현재형으로 간결하게 옮겼으며, POB의 ‘going out’에 대응해 이동 방향을 유지했습니다.
- source_word: בְּחֹדֶשׁ הָאָבִיב
  english_pob_choice: in the month of Abib
  chosen_korean: 아빕 달에
  alternatives_korean:
