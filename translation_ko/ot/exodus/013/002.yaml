source:
  edition: WLC
  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
  footnotes:
  - marker: a
    text: Or 'among humankind and among beast.' The Hebrew uses 'man' representatively here in contrast with animals.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손 가운데 사람의 맏아들[a]과 짐승의 처음 난 것 중 태를 먼저 열고 나오는 모든 것을 나에게 구별하여 바치십시오. 그것은 내 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람’은 여기서 짐승과 대비되는 대표적 범주를 가리킵니다. 히브리어는 문자적으로 ‘사람 가운데’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדֶּשׁ
  english_pob_choice: Consecrate
  chosen_korean: 구별하여 바치십시오
  alternatives_korean:
  - 거룩하게 하십시오
  - 성별하십시오
  - 봉헌하십시오
  lexicon: HALOT
  rationale: קדשׁ의 명령형은 하나님께 속하도록 떼어 놓는 공적·제의적 행위를 가리키므로, 현대 한국어에서 자연스럽고 의미를 드러내는 ‘구별하여 바치다’로 옮겼습니다.
- source_word: כָל בְּכוֹר
  english_pob_choice: every firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째 되는 아들
  - 첫 태생
  - 첫난 것
  lexicon: HALOT
  rationale: בכור는 문맥상 사람과 짐승 모두에 적용되는 ‘첫 난 것’이지만, 사람이 먼저 열거되는 구조를 살려 ‘사람의 맏아들’로 풀었습니다.
- source_word: פֶּטֶר כָּל רֶחֶם
  english_pob_choice: the first to open every womb
  chosen_korean: 태를 먼저 열고 나오는
  alternatives_korean:
  - 모든 태를 여는
  - 모태를 처음 여는
  - 첫 태를 여는
  lexicon: HALOT
  rationale: 직역을 유지하면서도 한국어 어순에 맞게 ‘태를 먼저 열고 나오는’으로 다듬어, 설명적 동격 구문을 자연스럽게 반영했습니다.
- source_word: בָּאָדָם ... וּבַבְּהֵמָה
  english_pob_choice: among man and among beast
  chosen_korean: 사람의 ... 짐승의
  alternatives_korean:
  - 사람 가운데 ... 짐승 가운데
  - 인간 가운데 ... 동물 가운데
  - 사람과 짐승
  lexicon: HALOT
  rationale: 히브리어는 사람과 짐승을 병렬로 대비하므로, ‘사람의 … 짐승의’로 범주 대비를 살리되 현대 독자가 이해하기 쉽게 연결했습니다.
- source_word: לִי הוּא
  english_pob_choice: it is mine
  chosen_korean: 그것은 내 것입니다
  alternatives_korean:
  - 그것은 내 것입니다
  - 그것은 내 소유입니다
  - 내 것입니다
  lexicon: HALOT
  rationale: 끝 절의 소유 선언을 한국어에서 가장 직접적이고 단정하게 표현하는 방식으로 옮겼습니다.
theological_decisions:
- issue: אָדָם과 בְּהֵמָה의 대조를 한국어에서 어떻게 유지할지
  chosen_reading: 사람과 짐승의 범주 대조를 그대로 드러내는 번역
  alternative_readings:
  - 인간과 동물
  - 사람과 가축
  - 사람 가운데와 짐승 가운데
  rationale: 본문은 인간과 짐승의 대표적 범주를 대조하므로, 이를 평준화하지 않고 ‘사람/짐승’의 대조로 유지했습니다. 이는 출애굽기의 제의적 소유 선언을 흐리지 않게 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; contested term אָדָם
