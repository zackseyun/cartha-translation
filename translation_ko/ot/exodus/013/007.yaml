source:
  edition: WLC
  text: מַצּוֹת֙ יֵֽאָכֵ֔ל אֵ֖ת שִׁבְעַ֣ת הַ/יָּמִ֑ים וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֜ חָמֵ֗ץ וְ/לֹֽא יֵרָאֶ֥ה לְ/ךָ֛ שְׂאֹ֖ר בְּ/כָל גְּבֻלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
  footnotes:
  - marker: a
    text: Or 'anything leavened' for 'leavened bread.' The Hebrew חָמֵץ denotes what is leavened, while שְׂאֹר in the next clause refers more specifically to the leavening agent itself.
    reason: lexical_alternative
  - marker: b
    text: Literally 'shall not be seen with you.' The wording implies that no leavened product or yeast is to remain anywhere in your possession or domain during the seven days.
    reason: lexical_alternative
translation:
  language: ko
  text: 무교병을 칠 일 동안 먹어야 하며[a], 너희와 함께 어떤 누룩도 보이지 않아야 하며[b], 너희의 모든 경내 안에서도 어떤 발효종도 보이지 않아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누룩 든 것’. 히브리어 חָמֵץ는 누룩이 든 것, 곧 누룩화된 음식을 가리키고, 이어지는 שְׂאֹר는 누룩 그 자체를 더 구체적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희와 함께 보이지 않아야 합니다’입니다. 이 표현은 누룩이 든 음식이나 누룩이 너희의 소유나 영역 안에 남아 있어서는 안 된다는 뜻을 내포합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 빵
  - 무교빵
  - 무교절 떡
  lexicon: HALOT
  rationale: 절기 규정의 관용적 표현으로는 ‘무교병’이 가장 간결하며, 무교절 맥락의 빵을 분명히 드러냅니다.
- source_word: יֵאָכֵל
  english_pob_choice: shall be eaten
  chosen_korean: 먹어야 하며
  alternatives_korean:
  - 먹게 될 것입니다
  - 먹혀야 하며
  - 먹습니다
  lexicon: HALOT
  rationale: 히브리어 수동형의 규범적·의무적 뉘앙스를 살리면서도, 한국어에서는 자연스럽게 의무 표현으로 옮겼습니다.
- source_word: חָמֵץ
  english_pob_choice: leaven
  chosen_korean: 누룩
  alternatives_korean:
  - 발효된 것
  - 발효빵
  - 누룩이 든 것
  lexicon: HALOT
  rationale: 이 단어는 여기서 ‘누룩/누룩 든 것’의 범주를 가리키며, 뒤의 שְׂאֹר와 구별되므로 한국어도 ‘누룩’으로 유지하는 것이 대비를 잘 살립니다.
- source_word: שְׂאֹר
  english_pob_choice: yeast
  chosen_korean: 발효종
  alternatives_korean:
  - 누룩
  - 이스트
  - 발효제
  lexicon: HALOT
  rationale: 앞의 חָמֵץ와 구별되는 발효 매개체를 가리키므로, 전통적 ‘누룩’보다 기능을 더 분명히 하는 ‘발효종’을 택했습니다.
- source_word: בְּכָל גְּבֻלֶךָ
  english_pob_choice: within all your territory
  chosen_korean: 너희의 모든 경내 안에서도
  alternatives_korean:
  - 너희의 모든 영역 안에서도
  - 너희의 모든 경계 안에서도
  - 너희의 모든 영토 안에서도
  lexicon: HALOT
  rationale: 공동체가 점유한 전 범위를 뜻하므로, ‘경내’가 문맥상 가장 자연스럽고 포괄적인 한국어 표현입니다.
theological_decisions:
- issue: 두 금지문의 중복과 범위
  chosen_reading: ‘누룩’과 ‘발효종’을 구별하여 두 번의 금지를 각각 살리되, 둘 다 공동체의 전체 영역에 남아 있어서는 안 된다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 두 절을 모두 ‘누룩’으로 통일
  - 첫째를 ‘누룩 든 것’, 둘째를 ‘누룩’으로 처리
  rationale: 히브리어는 חָמֵץ와 שְׂאֹר를 의도적으로 구별하므로, 한국어에서도 동일어 반복보다 구별을 유지하는 편이 원문의 긴장을 더 잘 전달합니다.
  doctrine_reference: 유월절 정결 규정의 문맥상 구별 유지
