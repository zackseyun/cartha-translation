translation:
  language: ko
  text: 야훼께서—당신과 당신의 조상들에게[b] 맹세하신 대로—당신을 가나안 사람들의 땅으로 데려가시고 그 땅을 당신에게 주실 때에,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 “그리고 ~할 때가 되면”입니다. 한국어에서는 자연스럽게 “~하실 때에”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “당신의 조상들”을 문자적으로 “당신의 아버지들”이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: 그 때입니다
  alternatives_korean:
