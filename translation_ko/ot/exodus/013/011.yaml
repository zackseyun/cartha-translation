    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 당신을 가나안 사람들의 땅으로 데려가셔서—그분이 당신과 당신의 조상들에게 맹세하신 대로—그 땅을 당신에게 주실 때입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “그리고 그것은 되겠습니다. ~할 때”라는 관용구입니다. 한국어에서는 자연스럽게 “그 때입니다”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “당신의 조상들”을 문자적으로 “당신의 아버지들”이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: 그 때입니다
  alternatives_korean:
  - 그리고 ~일 것입니다
  - ~할 때입니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 미래의 상황 전환을 도입하므로, 한국어에서는 문맥상 자연스러운 시간 부사구로 풀어 ‘그 때입니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 출애굽기의 본문은 여호와 대체어가 아닌 언약 이름을 직접 가리키므로, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  english_pob_choice: into the land of the Canaanites
  chosen_korean: 가나안 사람들의 땅으로
  alternatives_korean:
  - 가나안 땅으로
  - 가나안 족속의 땅으로
  lexicon: HALOT
  rationale: אֶל의 이동 방향을 ‘-으로’로 살리고, הַכְּנַעֲנִי를 지명 축약이 아닌 집단명 그대로 반영해 ‘가나안 사람들의 땅’으로 옮겼습니다.
- source_word: וּנְתָנָהּ לָךְ
  english_pob_choice: and gives it to you
  chosen_korean: 그 땅을 당신에게 주실 때입니다
  alternatives_korean:
  - 그 땅을 당신에게 주십니다
  - 그 땅을 당신에게 주시면
  lexicon: HALOT
  rationale: 앞선 미래 조건절에 맞춰 결과 절도 미래 사건으로 표현했고, 3인칭 여성 단수 대명사 ‘-הּ’는 문맥상 ‘그 땅’을 가리키므로 명시했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 옮길지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 יְהוָה를 직접 사용하므로, 신적 칭호로 바꾸지 않고 언약 이름을 보존하는 번역이 원문과 주석 전통에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
