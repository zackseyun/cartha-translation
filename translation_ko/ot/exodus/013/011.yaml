- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  english_pob_choice: into the land of the Canaanites
  chosen_korean: 가나안 사람들의 땅으로
  alternatives_korean:
  - 가나안 땅으로
  - 가나안 족속의 땅으로
  lexicon: HALOT
  rationale: אֶל의 이동 방향을 ‘-으로’로 살리고, הַכְּנַעֲנִי를 지명 축약이 아닌 집단명 그대로 반영해 ‘가나안 사람들의 땅’으로 옮겼습니다.
- source_word: וּנְתָנָהּ לָךְ
  english_pob_choice: and gives it to you
  chosen_korean: 그 땅을 당신에게 주실 때입니다
  alternatives_korean:
  - 그 땅을 당신에게 주십니다
  - 그 땅을 당신에게 주시면
  lexicon: HALOT
  rationale: 앞선 미래 조건절에 맞춰 결과 절도 미래 사건으로 표현했고, 3인칭 여성 단수 대명사 ‘-הּ’는 문맥상 ‘그 땅’을 가리키므로 명시했습니다.
theological_decisions:
