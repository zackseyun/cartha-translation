id: EXO.13.8
reference: Exodus 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִגַּדְתָּ֣ לְ/בִנְ/ךָ֔ בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר בַּ/עֲב֣וּר זֶ֗ה עָשָׂ֤ה יְהוָה֙ לִ֔/י בְּ/צֵאתִ֖/י מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
  footnotes:
  - marker: a
    text: Or, 'the LORD did this for me when I went out of Egypt.' The Hebrew can be understood with 'this' linked either to the reason for the observance or more directly to what the LORD did.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그날에 네 아들에게 이렇게 말하십시오. ‘이것[a] 때문에 야훼께서 내가 이집트에서 나올 때 나를 위해 행하셨습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 내가 이집트에서 나올 때 나를 위해 이 일을 행하셨습니다.’ 히브리어는 ‘이것’을 이 의식의 이유에 연결할 수도 있고, 야훼께서 하신 일에 더 직접 연결할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  english_pob_choice: And you shall tell
  chosen_korean: 말해야 합니다
  alternatives_korean:
  - 말하십시오
  - 전해야 합니다
  - 알려야 합니다
  lexicon: HALOT
  rationale: 명령형 미래의 지시를 자연스러운 합쇼체로 옮겼습니다. ‘말하다’는 ‘tell’의 직접적이고 구어적인 보고/전달 의미를 잘 살립니다.
- source_word: לְבִנְךָ
  english_pob_choice: your son
  chosen_korean: 너희 아들에게
  alternatives_korean:
  - 네 아들에게
  - 너의 아들에게
  - 자녀에게
  lexicon: HALOT
  rationale: 히브리어 단수 2인칭 남성형을 반영해 ‘아들’로 옮겼고, 공동체적 지시 맥락을 살려 한국어에서는 자연스러운 복수 대상화 없이도 읽히도록 했습니다.
- source_word: בַּעֲבוּר זֶה
  english_pob_choice: because of this
  chosen_korean: 이것은 … 때문입니다
  alternatives_korean:
  - 이 일 때문에
  - 이로 인해
  - 이것 때문에
  lexicon: HALOT
  rationale: 원문의 원인·근거를 드러내는 표현으로 옮겼습니다. ‘때문입니다’는 한국어에서 이유를 분명히 밝히는 자연스러운 방식입니다.
- source_word: עָשָׂה יְהוָה לִי
  english_pob_choice: Yahweh acted for me
  chosen_korean: 야훼께서 … 나를 위해 행하신
  alternatives_korean:
  - 야훼께서 나를 위해 하신
  - 야훼께서 나를 위해 하신 일
  - 야훼께서 나를 위해 일하신
  lexicon: HALOT
  rationale: עשה의 넓은 의미를 따라 ‘행하신’으로 두어 구체적 행위를 과잉지정하지 않았습니다. לִי의 이익/대리의 의미는 ‘나를 위해’로 살렸습니다.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  english_pob_choice: when I came out of Egypt
  chosen_korean: 내가 이집트에서 나올 때
  alternatives_korean:
  - 내가 이집트에서 나왔을 때
  - 내가 이집트에서 বের어나올 때
  - 내가 이집트에서 나가는 때
  lexicon: HALOT
  rationale: 완료적 서술보다 상황적 시점을 나타내는 구조를 살려 ‘-올 때’로 옮겼습니다. 현재형적 서술은 출애굽의 경험을 생생하게 전달합니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 하나님의 이름 יְהוָה를 호칭 대체 없이 고유명사로 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접화법 안의 지시 표현
  chosen_reading: 너희 아들에게 이렇게 말해야 합니다
  alternative_readings:
  - 네 아들에게 말해야 합니다
  - 자녀에게 말해야 합니다
  rationale: 언약 교육의 구체성을 유지하기 위해 성별·혈연 관계가 드러나는 ‘아들’을 보존했습니다. 문맥상 공동체적 지침이므로 한국어에서는 복수형으로 자연화했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
