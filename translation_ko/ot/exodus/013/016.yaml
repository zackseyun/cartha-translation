  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
  footnotes:
  - marker: a
    text: Or 'bands'; traditionally 'phylacteries.' The Hebrew term is rare and likely refers to something worn on the forehead as a reminder.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'between your eyes,' an idiom often understood as 'on your forehead.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 네 손에 표가 되고 네 눈 사이에 장식물[a]이 될 것입니다.[b] 이는 야훼께서 강한 손으로 우리를 이집트에서 이끌어 내셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 희귀어는 전통적으로 이마에 착용하는 물건으로 이해됩니다. ‘전두장식’, ‘띠’, 또는 ‘경문’으로도 옮길 수 있으나, 정확한 형태는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘네 눈 사이’를 말합니다. 이는 흔히 ‘네 이마에’라는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it shall be
  chosen_korean: 그것은 … 될 것이니
  alternatives_korean:
  - 그리고 그것은 … 될 것입니다
  - 그것은 … 됩니다
  lexicon: HALOT
  rationale: 명령문적 규정의 미래적·지속적 효력을 한국어로 자연스럽게 살리기 위해 ‘될 것이니’로 옮겼습니다.
- source_word: לְאוֹת
  english_pob_choice: as a sign
  chosen_korean: 표
  alternatives_korean:
  - 징표
  - 표징
  lexicon: HALOT
  rationale: 손에 ‘표’가 된다는 구체적 표현이 מקור의 기능적 의미를 간결하게 드러내며, 문맥상 기억과 소속의 표시를 잘 전달합니다.
- source_word: וּלְטוֹטָפֹת
  english_pob_choice: as frontlets
  chosen_korean: 장식끈
  alternatives_korean:
  - 전두장식
  - 전면 띠
  - 경문
  lexicon: HALOT
  rationale: 희귀어 טוֹטָפֹת의 정확한 실물을 단정하기보다, 전통적 종교 용어를 본문에 들이지 않으면서도 ‘이마에 두는 장식’의 기능을 살리는 쪽을 택했습니다.
- source_word: בֵּין עֵינֶיךָ
  english_pob_choice: between your eyes
  chosen_korean: 네 눈 사이
  alternatives_korean:
  - 네 이마에
  - 네 눈썹 사이
  lexicon: HALOT
  rationale: 히브리어 이미지를 그대로 보존해 본문이 가진 직설성을 살렸고, 해석 가능성은 주석적 여지를 남겨 두었습니다.
theological_decisions:
- issue: 손/눈 사이의 언어를 문자적으로 유지할지, 후대의 구체적 예식물로 고정할지
  chosen_reading: 본문은 ‘표’와 ‘장식끈’의 이미지로 유지하고, 특정 예식물 명칭으로 본문을 고정하지 않았습니다.
  alternative_readings:
  - ‘경문’으로 직접 옮김
  - ‘이마에 매는 띠’처럼 완전 해석적으로 옮김
  rationale: 히브리어는 후대 관습을 직접 명명하지 않으므로, 원문의 이미지와 해석의 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: 번역 철학 §3 — 본문이 허용하는 신학적 긴장을 해소하지 않고 보존
