  text: לֹֽא יָמִ֞ישׁ עַמּ֤וּד הֶֽ/עָנָן֙ יוֹמָ֔ם וְ/עַמּ֥וּד הָ/אֵ֖שׁ לָ֑יְלָה לִ/פְנֵ֖י הָ/עָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/022.yaml
  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
  footnotes:
  - marker: a
    text: Or 'did not move away from before the people.' The Hebrew verb emphasizes that the guiding pillars remained continually present.
    reason: lexical_alternative
translation:
  language: ko
  text: 낮에는 구름 기둥이, 밤에는 불 기둥이 백성 앞에서 떠나지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘옮겨지다’보다 ‘떠나다/철수하다’의 의미를 강하게 띱니다. 따라서 이 구절은 구름 기둥과 불 기둥이 백성 앞에서 계속 함께 있었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹֽא יָמִ֞ישׁ
  english_pob_choice: did not depart
  chosen_korean: 떠나지 않았습니다
  alternatives_korean:
  - 물러나지 않았습니다
  - 옮겨지지 않았습니다
  - 사라지지 않았습니다
  lexicon: HALOT
  rationale: מוּשׁ의 부정형은 계속적인 비이동·비철수를 나타내므로, 자연스러운 한국어로는 ‘떠나지 않았다’가 가장 직접적으로 그 지속성을 살립니다.
- source_word: עַמּוּד הֶעָנָן / עַמּוּד הָאֵשׁ
  english_pob_choice: the pillar of cloud / the pillar of fire
  chosen_korean: 구름 기둥 / 불 기둥
  alternatives_korean:
  - 구름의 기둥 / 불의 기둥
  - 기둥 같은 구름 / 기둥 같은 불
  lexicon: HALOT
  rationale: עַמּוּד는 물체의 형태를 가리키는 ‘기둥’이 가장 자연스럽고, 병행 구조를 살리기 위해 ‘구름 기둥’과 ‘불 기둥’으로 간결하게 옮겼습니다.
- source_word: יוֹמָם / לָיְלָה
  english_pob_choice: by day / by night
  chosen_korean: 낮에는 / 밤에는
  alternatives_korean:
  - 낮 동안 / 밤 동안
  - 낮에 / 밤에
  lexicon: HALOT
  rationale: 시간 부사적 대구를 한국어에서도 대칭적으로 살리기 위해 ‘-에는’ 구조를 사용했습니다.
- source_word: לִפְנֵי הָעָם
  english_pob_choice: from before the people
  chosen_korean: 백성 앞에서
  alternatives_korean:
  - 백성 앞에서부터
  - 백성의 앞에서
  - 백성 앞을 떠나지
  lexicon: HALOT
  rationale: לִפְנֵי는 위치 관계를 나타내므로 ‘앞에서’가 가장 자연스럽습니다. ‘from before’의 이동 뉘앙스는 뒤의 ‘떠나지 않았습니다’가 충분히 담습니다.
theological_decisions:
- issue: 인도하는 임재의 지속성
  chosen_reading: 구름 기둥과 불 기둥이 백성 앞에서 계속 머물렀다는 뜻을 드러내기 위해 ‘떠나지 않았습니다’로 옮겼습니다.
  alternative_readings:
  - 백성 앞에서 움직이지 않았습니다
  - 백성 앞을 벗어나지 않았습니다
  rationale: 본문의 핵심은 단순한 정지보다 인도하시는 표징의 지속적 동반입니다. 영어 POB도 이 지속성을 강조하므로 한국어에서도 이를 분명히 보존했습니다.
  doctrine_reference: 출애굽기의 하나님의 인도와 임재
