review_pass:
  verdict: revise
  source_fidelity: 원문의 명령 구조와 인과관계는 대체로 반영되었으나, 본문의 ‘그러므로’는 단순 접속사 וְ를 결과 관계로 강화합니다. 또한 הוֹצִיא의 사역 의미에는 ‘이끌어 내셨다’보다 ‘나오게 하셨다’가 더 직접적입니다. מִבֵּית עֲבָדִים의 복수형은 각주에서 명시하는 것이 적절합니다.
  naturalness: 초안의 ‘이 날을 기억하십시오. 곧 … 나온 날입니다’는 설명문처럼 분절되어 원문의 직접적 명령보다 다소 우회적입니다. ‘… 나온 이 날을 기억하십시오’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 밀착된 표현입니다. 각주 표지도 해당 어구 바로 뒤에 배치하는 것이 명확합니다.
  terminology: ‘야훼’, ‘노예’, ‘강한 손’, ‘누룩 든 것’은 적절합니다. ‘누룩 든 것은 아무것도’는 한국어에서 수식 범위가 다소 어색하므로 ‘누룩 든 것은 전혀’로 다듬습니다. 원문의 חָמֵץ는 빵에 한정되지 않으므로 본문에서는 넓게 유지합니다.
  issues:
  - severity: medium
    issue: ‘그러므로’가 접속사 וְ를 결과·추론 관계로 강화합니다.
    rationale: 여기서 וְ는 앞의 인과절 뒤에 금지 규정을 이어 주는 접속으로, ‘그리고’가 원문의 연결을 더 중립적으로 보존합니다.
  - severity: low
    issue: ‘이끌어 내셨기’는 הוֹצִיא의 사역성을 다소 약화하거나 인도 행위를 부각할 수 있습니다.
    rationale: ‘여러분을 그곳에서 나오게 하셨기’는 ‘나가게 하다/데리고 나오게 하다’라는 히필의 사역 의미를 직접 반영합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 일괄 배치되어 해당 어구와의 연결이 불명확하며, c 각주가 본문과 동일합니다.
    rationale: a와 b는 각각 ‘노예의 집’ 및 ‘강한 손’ 뒤에, c는 금지 문장 끝에 두어야 합니다. c는 ‘빵’으로 좁히는 가능한 번역을 대안으로 제시해야 합니다.
