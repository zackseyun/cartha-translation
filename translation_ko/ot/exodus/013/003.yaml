source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
  footnotes:
  - marker: a
    text: Or “from the house of slavery.” The Hebrew is literally “from the house of slaves,” an idiom for Egypt as a place of enslavement.
    reason: lexical_alternative
  - marker: b
    text: Or “by a mighty hand.”
    reason: lexical_alternative
  - marker: c
    text: Or “and nothing leavened shall be eaten.”
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 백성에게 말했습니다. 「여러분이 이집트, 곧 노예의 집[a]에서 나온 이 날을 기억하십시오. 야훼께서 강한 손으로[b] 여러분을 그곳에서 나오게 하셨기 때문입니다. 그리고 누룩 든 것은 전혀 먹어서는 안 됩니다.[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자적으로 옮기면 “노예들의 집”입니다. 이집트를 예속의 장소로 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “힘센 손으로”.
    reason: lexical_alternative
  - marker: c
    text: 또는 “누룩 든 빵은 먹어서는 안 됩니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하라
  - 기억해 두십시오
  lexicon: HALOT
  rationale: 집합적 청중에게 주는 명령형을 현대 한국어의 공손한 명령으로 옮겼습니다. ‘기억하십시오’가 기억의 반복적·언약적 성격을 가장 자연스럽게 전달합니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slaves
  chosen_korean: 노예의 집
  alternatives_korean:
  - 노예들의 집
  - 노예 상태의 집
  - 종살이의 집
  lexicon: HALOT
  rationale: 히브리어의 직유적 표현을 살리면서, 본문이 애굽의 실제 예속 상태를 가리키므로 ‘노예’로 옮겼습니다. ‘노예의 집’이 간결하고 관용구의 힘도 유지합니다.
- source_word: בְּחֹזֶק יָד
  english_pob_choice: by a strong hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 힘센 손으로
  - 강력한 손으로
  - 힘으로
  lexicon: HALOT
  rationale: ‘손’의 상징적 표현을 유지하고, חֹזֶק의 직설적 힘을 ‘강한’으로 옮겼습니다. 한국어에서 가장 자연스러운 역동적 대응입니다.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  english_pob_choice: and no leavened bread shall be eaten
  chosen_korean: 누룩 든 것은 아무것도 먹어서는 안 됩니다
  alternatives_korean:
  - 누룩 든 빵은 아무것도 먹어서는 안 됩니다
  - 누룩 든 것은 먹지 말아야 합니다
  - 누룩 든 것은 아무것도 먹어선 안 됩니다
  lexicon: HALOT
  rationale: חָמֵץ를 단순히 ‘빵’으로 좁히지 않고, 누룩이 든 모든 것을 포괄하는 금지로 살렸습니다. 수동 금지의 뉘앙스를 한국어의 자연스러운 금지형으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 여호와(יהוה)를 고유명으로 드러내는 POB 원칙을 따라, 칭호인 ‘주’로 바꾸지 않고 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘노예의 집’이라는 출애굽 공식의 직설성
  chosen_reading: 노예의 집
  alternative_readings:
  - 종살이의 집
  - 속박의 집
  - 노예 상태에서의 집
  rationale: 이스라엘의 애굽 체류를 실제 예속으로 드러내는 표현이므로, 완곡한 ‘종살이’보다 직설적인 ‘노예’가 원문의 역사적·신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; Contested terms analogy for δοῦλος
