- from: 모세가 백성에게 말했습니다. 「이 날을 기억하십시오. 곧 여러분이 이집트, 곧 노예의 집에서 나온 날입니다. 야훼께서 강한 손으로 거기에서 여러분을 이끌어 내셨기 때문입니다. 그러므로 누룩 든 것은 아무것도 먹어서는 안 됩니다.」[a][b][c]
  to: 모세가 백성에게 말했습니다. 「여러분이 이집트, 곧 노예의 집[a]에서 나온 이 날을 기억하십시오. 야훼께서 강한 손으로[b] 여러분을 그곳에서 나오게 하셨기 때문입니다. 그리고 누룩 든 것은 전혀 먹어서는 안 됩니다.[c]」
  rationale: 직접 목적어를 앞세운 원문의 명령 구조를 한국어에서 자연스럽게 재구성하고, 사역 동사의 의미와 접속사의 중립적 연결을 보존했습니다. ‘노예의 집’은 본문에서 간결하게 유지하되, 히브리어 복수형은 각주에서 밝혔습니다. 각주 표지를 관련 어구에 붙이고, 중복되던 c 각주를 실제 번역 대안으로 고쳤습니다.
  reviewer_model: gpt-5.6-terra
