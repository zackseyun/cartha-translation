  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of slaves.’
translation:
  language: ko
  text: 앞으로 네 아들이 네게 물어 보기를 ‘이것이 무엇이냐?’ 하거든, 너는 그에게 이렇게 말해야 합니다. ‘야훼께서 강한 손으로 우리를 이집트에서, 종의 집에서 이끌어 내셨습니다.’
  philosophy: formal
lexical_decisions:
- source_word: בְּחֹזֶק יָד
  english_pob_choice: By a mighty hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 능력 있는 손으로
  - 힘센 손으로
  lexicon: חֹזֶק + יָד
  rationale: 히브리어는 ‘손’의 힘과 강도를 함께 말하므로, 직역하면서도 한국어에서 자연스러운 ‘강한 손으로’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 본문의 신명은 원어에 따라 야훼로 옮겨, POB의 원천언어 직역 원칙을 따랐습니다.
- source_word: מִמִּצְרַיִם
  english_pob_choice: from Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 애굽에서
  - 이집트 땅에서
  lexicon: מצרים
  rationale: 현대 표준어 지명을 사용하되, 본문의 역사적 지시를 유지했습니다.
- source_word: מִבֵּית עֲבָדִים
  english_pob_choice: from the house of slaves
  chosen_korean: 종의 집에서
  alternatives_korean:
  - 노예의 집에서
  - 종살이하던 집에서
  lexicon: בַּיִת + עֲבָדִים
  rationale: 영어 POB의 ‘house of slaves’는 노예 상태를 드러내는 표현이지만, 한국어에서는 관용적으로 ‘종의 집’이 원문의 압축성과 대응성을 더 잘 살립니다.
theological_decisions:
- issue: ‘house of slaves’의 신학적·사회적 강도
  chosen_reading: ‘종의 집’으로 간결하게 유지해, 출애굽의 해방 사건과 종속 상태를 함께 드러냈습니다.
  alternative_readings:
  - ‘노예의 집’으로 더 강하게 표기
  - ‘종살이의 집’으로 의미를 풀어쓰기
  rationale: 본문은 출애굽을 단순한 이동이 아니라 예속에서의 구출로 제시하므로, 의미를 약화시키지 않으면서도 한국어 문맥에 맞는 압축 표현을 선택했습니다.
  doctrine_reference: Exodus narrative; liberation from bondage
