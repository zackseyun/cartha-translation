base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
  footnotes:
  - marker: a
    text: Or, “God will surely visit you.” The Hebrew idiom can denote God’s decisive intervention on behalf of his people.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 요셉의 뼈를 자기와 함께 가지고 갔습니다[a]. 이는 요셉이 이스라엘 자손에게 엄숙히 맹세하게 하며 말하기를 “하나님이 반드시 너희를 찾아 돌보실 것이니, 너희는 여기에서 내 뼈를 너희와 함께 가지고 올라가야 한다”라고 했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님이 반드시 너희를 방문하실 것이다.” 이 히브리어 관용구는 하나님이 자기 백성을 위해 निर्ण정적으로 개입하시는 뜻을 담을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가지고 갔습니다
  alternatives_korean:
  - 가졌습니다
  - 데리고 갔습니다
  lexicon: HALOT
  rationale: 단순한 ‘취하다’보다 맥락상 소유물과 함께 이동하는 뜻을 분명히 드러내며, 자연스러운 현대 한국어 서술로 읽힙니다.
- source_word: עַצְמֹת
  english_pob_choice: bones
  chosen_korean: 뼈
  alternatives_korean:
  - 유골
  - 유해
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현을 그대로 살려 ‘유골/유해’보다 물질적·서사적 생동감을 유지합니다.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  english_pob_choice: had made ... solemnly swear
  chosen_korean: 엄숙히 맹세하게 하며
  alternatives_korean:
  - 엄중히 맹세하게 하며
  - 단단히 맹세하게 하며
  lexicon: HALOT
  rationale: 강조형 반복을 반영해 단순한 ‘맹세하다’보다 의례적·강한 구속력을 드러내되, 현대 한국어에서 과도하게 장황하지 않게 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 원문의 혈통·언약적 친족 표현을 유지하면서도 한국어 성경에서 자연스럽고 널리 읽히는 형태를 택했습니다.
- source_word: פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם
  english_pob_choice: God will surely attend to you
  chosen_korean: 하나님이 반드시 너희를 찾아 돌보실 것이니
  alternatives_korean:
  - 하나님이 반드시 너희를 방문하실 것이니
  - 하나님이 반드시 너희를 돌보실 것이니
  lexicon: HALOT
  rationale: 이 관용구는 단순한 ‘방문’보다 하나님의 결정적 개입과 돌보심을 뜻하므로, ‘찾아 돌보다’로 방문성과 구원적 돌봄을 함께 살렸습니다.
- source_word: וְהַעֲלִיתֶם
  english_pob_choice: and you shall bring up
  chosen_korean: 가지고 올라가야 한다
  alternatives_korean:
  - 올려야 한다
  - 데리고 올라가야 한다
  lexicon: HALOT
  rationale: ‘올리다’의 방향성을 살리면서, 앞의 ‘뼈’와 결합해 실제 운구의 의미가 드러나도록 했습니다.
theological_decisions:
- issue: פָּקֹד יִפְקֹד의 번역에서 ‘방문’과 ‘돌보다’의 의미 관계
  chosen_reading: 하나님이 반드시 너희를 찾아 돌보실 것이니
  alternative_readings:
  - 하나님이 반드시 너희를 방문하실 것이니
  - 하나님이 반드시 너희를 살피실 것이니
  rationale: 히브리어 관용구는 하나님의 임재적 ‘방문’과 구원적 ‘개입’을 함께 함축하므로, 한국어에서는 ‘찾아 돌보다’로 두 의미를 함께 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
- issue: בְּנֵי יִשְׂרָאֵל의 집단 표기
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문의 친족·언약 정체성을 흐리지 않기 위해 중립화보다 직역에 가까운 표기를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
