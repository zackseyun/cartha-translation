lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  english_pob_choice: You shall keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 준수하십시오
  - 지키고 따르십시오
  lexicon: HALOT
  rationale: שׁמר는 율법·예식 문맥에서 ‘지키다/준수하다’의 뜻을 가지므로, 합쇼체 명령형으로 자연스럽게 옮겼습니다.
- source_word: הַחֻקָּה הַזֹּאת
  english_pob_choice: this statute
  chosen_korean: 이 규례
  alternatives_korean:
  - 이 법규
  - 이 법령
  lexicon: HALOT
  rationale: חֻקָּה는 고정된 규정·명령을 가리키므로, 한국어 성서에서 널리 통용되면서도 문맥에 맞는 ‘규례’로 옮겼습니다.
- source_word: לְמוֹעֲדָהּ
  english_pob_choice: at its appointed time
  chosen_korean: 그 정한 때에
  alternatives_korean:
  - 그 정해진 때에
  - 그 지정된 때에
  lexicon: HALOT
  rationale: מוֹעֵד는 ‘정한 때, 지정된 절기’를 뜻하므로, 문맥상 절기적 시점을 살려 ‘그 정한 때에’로 옮겼습니다.
- source_word: מִיָּמִים יָמִימָה
  english_pob_choice: from year to year[a]
  chosen_korean: 대대로
  alternatives_korean:
  - 해마다
  - 세세대대로
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘날들에서 날들로’이지만, 이 문맥에서 반복적·지속적 준수의 의미를 드러내는 관용으로 이해하여 ‘대대로’로 옮겼습니다.
theological_decisions:
- issue: 절기 준수의 반복성
  chosen_reading: 이스라엘이 이 규례를 일회적 사건이 아니라 정해진 때마다 계속 지켜야 한다는 뜻을 드러내는 것으로 읽었습니다.
  alternative_readings:
  - 매년 지켜야 한다는 달력적 지시로 읽는 해석
  - 단순한 전통 유지의 권고로 완화하는 해석
  rationale: 문맥의 히브리어 관용구는 반복적 준수를 요구하며, 한국어에서는 그 기능적 의미를 ‘대대로’로 압축해 드러내는 것이 가장 자연스럽습니다.
  doctrine_reference: 출애굽기 13장의 유월절/무교절 규정
