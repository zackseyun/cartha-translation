reference: Exodus 13:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
  footnotes:
  - marker: a
    text: Or 'from the firstborn of humankind to the firstborn of livestock.'
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오가 우리를 내보내기를 완강히 거부했을 때[a], 야훼께서는 이집트 땅에서 사람의 처음 난 것부터 짐승의 처음 난 것까지 모든 처음 난 것을 죽이셨습니다. 그러므로 나는 태를 처음 여는 모든 수컷을 야훼께 제물로 바치며, 내 아들들 가운데 모든 처음 난 것은 속량합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 놓아주기를’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה
  english_pob_choice: stubbornly refused
  chosen_korean: 완강히 거절할 때
  alternatives_korean:
  - 완고하게 거절할 때
  - 끝내 들으려 하지 않을 때
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 ‘강퍅하다’보다 ‘내보내기를 거절하다’의 뜻이 핵심이므로, 원문의 저항 강도를 자연스러운 한국어로 살렸습니다.
- source_word: לְשַׁלְּחֵנוּ
  english_pob_choice: to let us go
  chosen_korean: 우리를 내보내기
  alternatives_korean:
  - 우리를 보내 주기
  - 우리를 풀어 주기
  lexicon: HALOT
  rationale: פּ.ׁלח의 출애굽기적 용례는 단순 파송보다 ‘출발시키다/놓아주다’의 의미가 강하므로, 서술적으로 ‘내보내기’로 옮겼습니다.
- source_word: בְּכוֹר
  english_pob_choice: firstborn
  chosen_korean: 첫태생
  alternatives_korean:
  - 맏배아
  - 맏아들
  lexicon: HALOT
  rationale: 희생·법적 맥락에서 ‘첫태생’은 동물과 사람 모두를 포괄하면서도 ‘장자’보다 원문 범위를 더 넓게 드러냅니다.
- source_word: פֶּטֶר רֶחֶם
  english_pob_choice: that opens the womb
  chosen_korean: 태를 처음 여는
  alternatives_korean:
  - 자궁을 처음 여는
  - 태를 여는
  lexicon: HALOT
  rationale: 관용구의 뜻을 살려 ‘처음 여는’으로 풀었고, 법적·제의적 의미가 드러나도록 직역과 자연스러움의 균형을 맞췄습니다.
- source_word: בָּנַי
  english_pob_choice: my sons
  chosen_korean: 내 아들들
  alternatives_korean:
  - 내 자녀들
  - 내 아들
  lexicon: HALOT
  rationale: 원문은 성별을 가진 복수 명사이므로, 일반화하지 않고 ‘아들들’로 보존했습니다.
- source_word: אֶפְדֶּה
  english_pob_choice: I redeem
  chosen_korean: 속량합니다
  alternatives_korean:
  - 속량하겠습니다
  - 구속합니다
  lexicon: HALOT
  rationale: פּדה의 제의·법적 의미를 ‘속량하다’로 살렸습니다. ‘구속하다’는 신학적 용례가 강하고, ‘사다’는 의미를 약화시킬 수 있습니다.
theological_decisions:
- issue: 여호와의 고유명사 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 יְהוָה를 직접 사용하므로, 공용 번역어 대신 고유 신명 ‘야훼’를 유지해 언약 이름의 직접성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘사람의 첫태생’과 ‘짐승의 첫태생’의 범주 보존
  chosen_reading: 사람의 첫태생에서부터 짐승의 첫태생에 이르기까지
  alternative_readings:
  - 인간의 첫태생에서부터 가축의 첫태생에 이르기까지
  - 사람의 첫태생부터 짐승의 첫태생까지
  rationale: אָדָם과 בְּהֵמָה의 대조를 유지해, 사람/짐승 모두를 포괄하는 판결적 진술임을 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4; Contested terms: אָדָם → man / humankind (context)'
