revisions:
- from: 파라오가 우리를 내보내기를 완강히 거절할 때[a], 야훼께서는 이집트 땅의 모든 첫태생, 곧 사람의 첫태생에서부터 짐승의 첫태생에 이르기까지 다 죽이셨습니다. 그러므로 나는 태를 처음 여는 모든 수컷을 야훼께 제물로 바치지만, 내 아들들의 첫태생은 모두 속량합니다.
  to: 파라오가 우리를 내보내기를 완강히 거부했을 때[a], 야훼께서는 이집트 땅에서 사람의 처음 난 것부터 짐승의 처음 난 것까지 모든 처음 난 것을 죽이셨습니다. 그러므로 나는 태를 처음 여는 모든 수컷을 야훼께 제물로 바치며, 내 아들들 가운데 모든 처음 난 것은 속량합니다.
  rationale: 수정은 원문의 의미를 바꾸지 않고, 히브리어 소유 관계(‘내 아들들 가운데의 모든 처음 난 아들’)가 한국어에서 손자를 뜻하는 것으로 오해될 가능성을 제거했습니다. 또한 사람과 짐승에 공통으로 적용되는 בְּכוֹר를 자연스러운 현대 한국어로 일관되게 옮겼습니다. 접속사 וְ는 여기서 앞 절의 근거에 따른 병렬적 실천을 잇기에 ‘바치며’로 처리했습니다.
