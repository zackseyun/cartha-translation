base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: Now when Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
  footnotes:
  - marker: a
    text: Or 'for it was near.' The Hebrew conjunction can be read causally; the main text renders it concessively for smoother English sense in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'regret it' or 'relent.' The Hebrew verb here refers to a change of mind when faced with war.
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오가 백성을 내보냈을 때, 하나님은 비록 그 길이 가까웠지만 블레셋 사람들의 땅을 지나는 길로[a] 그들을 인도하지 않으셨습니다. 하나님께서 “백성이 전쟁을 보게 되면 마음을 바꾸어[b] 이집트로 돌아갈까 염려된다”라고 말씀하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 사람들의 땅의 길로’. 히브리어의 דֶּרֶךְ는 ‘길’, ‘도로’, ‘경로’를 뜻하며, 문맥상 ‘블레셋 사람들의 땅을 지나는 길’로 풀어 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘후회하여’, ‘뜻을 바꾸어’. 여기서 히브리어 נָחָם은 전쟁을 마주할 때 결심이나 태도를 바꾸는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּשַׁלַּח
  english_pob_choice: Now when Pharaoh let the people go
  chosen_korean: 파라오가 백성을 보낸 때에
  alternatives_korean:
  - 파라오가 백성을 보내던 때에
  - 파라오가 백성을 놓아준 때에
  lexicon: HALOT
  rationale: בְּשַׁלַּח은 시간 부사절로서 ‘보낼 때/보내던 때’의 상황을 나타내므로, 한국어에서는 서술 흐름을 살려 ‘…한 때에’로 옮기는 것이 가장 자연스럽습니다.
- source_word: נָחָם
  english_pob_choice: did not lead
  chosen_korean: 인도하지 않으셨습니다
  alternatives_korean:
  - 이끌지 않으셨습니다
  - 안내하지 않으셨습니다
  lexicon: HALOT
  rationale: 본문의 נָחָם은 길잡이처럼 ‘인도하다/이끌다’의 뜻으로 쓰이므로, 현대 한국어에서 가장 직접적인 ‘인도하다’를 선택했습니다.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  english_pob_choice: by the way of the land of the Philistines
  chosen_korean: 블레셋 사람들의 땅의 길
  alternatives_korean:
  - 블레셋 땅의 길
  - 블레셋 사람들의 땅을 지나는 길
  lexicon: HALOT
  rationale: 히브리어의 지리 표현을 보존하기 위해 ‘땅의 길’ 구조를 살렸고, 민족명인 ‘블레셋 사람들’을 유지해 원문 명칭 관계를 드러냈습니다.
- source_word: פֶּן יִנָּחֵם ... בִּרְאֹתָם מִלְחָמָה
  english_pob_choice: Lest the people change their minds when they see war
  chosen_korean: 백성이 전쟁을 보게 되면 마음을 돌이켜
  alternatives_korean:
  - 백성이 전쟁을 보면 마음을 바꾸어
  - 백성이 전쟁을 보게 되면 후회하여
  lexicon: HALOT
  rationale: יִנָּחֵם은 도덕적 ‘회개’가 아니라 상황을 보고 태도와 결심을 바꾸는 뜻이므로, 자연스러운 관용어인 ‘마음을 돌이키다’로 옮겼습니다.
theological_decisions:
- issue: פֶּן 절의 경계 의미
  chosen_reading: ‘백성이 … 돌아갈까 하노라’로 옮겨, 전쟁을 보면 되돌아갈 수 있다는 우려를 분명히 드러냈습니다.
  alternative_readings:
  - ‘백성이 … 돌아가지 않도록’
  - ‘백성이 … 돌아설까 염려하여’
  rationale: פֶּן은 부정적 목적/우려를 나타내므로, 하나님 말씀의 의도적 배려와 경계성을 살리는 한국어가 필요합니다. 예언적/신적 발화의 직접인용 안에서는 간결한 1인칭 종결을 유지했습니다.
  doctrine_reference: Preserve the text’s stated divine rationale without resolving providential tension.
