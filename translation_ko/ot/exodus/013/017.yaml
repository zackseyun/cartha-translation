revisions:
- from: 파라오가 백성을 보낸 때에, 하나님은 블레셋 사람들의 땅의 길로 그들을 인도하지 않으셨습니다. 그 길은 가까웠기 때문입니다. 하나님께서 말씀하셨습니다. “백성이 전쟁을 보게 되면 마음을 돌이켜 이집트로 돌아갈까 하노라.”[a][b]
  to: 파라오가 백성을 내보냈을 때, 하나님은 비록 그 길이 가까웠지만 블레셋 사람들의 땅을 지나는 길로[a] 그들을 인도하지 않으셨습니다. 하나님께서 “백성이 전쟁을 보게 되면 마음을 바꾸어[b] 이집트로 돌아갈까 염려된다”라고 말씀하셨기 때문입니다.
  rationale: 가까운 길이라는 사실을 양보적으로 표현하여 원문의 논리와 영어 POB 감사 기록의 해석을 반영했습니다. 지리 표현을 자연스러운 현대 표준어로 다듬고, פֶּן 이하를 하나님의 우려를 나타내는 직접 인용으로 명료하게 연결했습니다. 교리적 설명을 덧붙이지 않았으며, 각주 표지도 해당 낱말에 배치했습니다.
  reviewer_model: gpt-5.6-terra
