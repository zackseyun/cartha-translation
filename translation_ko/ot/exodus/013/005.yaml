  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
  footnotes:
  - marker: a
    text: Or 'this rite' or 'this observance.' The Hebrew term can denote a prescribed act of worship or service.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 가나안 사람들과 헷 사람들과 아모리 사람들과 히위 사람들과 여부스 사람들의 땅으로, 곧 그분이 당신의 조상들에게 당신에게 주시겠다고 맹세하신 젖과 꿀이 흐르는 땅으로 당신을 인도하실 때, 당신은 이 달에 이 예식[a]을 지켜야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 의식’ 혹은 ‘이 준수’로 옮길 수 있습니다. 히브리어 용어는 규정된 예배 행위나 섬김을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: …하실 때
  alternatives_korean:
  - …하면
  - …할 때에는
  lexicon: HALOT
  rationale: 미래적 조건/시점을 여는 구문이므로 자연스러운 종속절로 옮기되, 결과를 예고하는 힘을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 신명사를 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 대체 호칭이 아니라 고유한 언약 이름임을 드러냈습니다.
- source_word: הָעֲבֹדָה הַזֹּאת
  english_pob_choice: this service
  chosen_korean: 이 예식
  alternatives_korean:
  - 이 섬김
  - 이 봉사
  - 이 의식
  lexicon: HALOT
  rationale: 출애굽기 13장의 유월절/무교절 문맥에서 עֲבֹדָה는 일반 봉사보다 규정된 종교 행위를 가리키므로, 한국어에서는 ‘예식’이 가장 직접적이고 오해가 적습니다.
- source_word: וְעָבַדְתָּ
  english_pob_choice: you shall perform
  chosen_korean: 지켜야 합니다
  alternatives_korean:
  - 행해야 합니다
  - 드려야 합니다
  - 수행해야 합니다
  lexicon: HALOT
  rationale: 앞의 목적어 ‘이 예식’과 결합해 단순 수행보다 준수·이행의 뉘앙스를 살렸습니다. 한국어 성경 문맥에서 절기 준수에는 ‘지키다’가 자연스럽습니다.
theological_decisions:
- issue: 가나안 족속 목록의 표기
  chosen_reading: 가나안 사람들, 헷 사람들, 아모리 사람들, 히위 사람들, 여부스 사람들
  alternative_readings:
  - 가나안 족속
  - 가나안인들…
  rationale: 히브리어의 민족명 열거를 그대로 드러내어 지리·언약적 약속의 구체성을 유지했습니다. ‘족속’으로 뭉뚱그리면 열거의 생생함이 줄어듭니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: עֲבֹדָה의 종교적 성격
  chosen_reading: 이 예식
  alternative_readings:
  - 이 예배
  - 이 제의
  - 이 관습
  rationale: 본문은 단순 노동이 아니라 정해진 절기 행위를 말하므로, 종교적 행위임을 드러내면서도 지나치게 제도화된 뉘앙스는 피했습니다.
  doctrine_reference: Translation philosophy §1, §5
