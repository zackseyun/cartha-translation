revisions:
- from: 그리고 나귀의 첫 새끼는 어린양으로 대속해야 합니다. 그러나 대속하지 않으려거든 그 목을 꺾으십시오. 사람의 첫째 난 것은, 곧 당신의 아들들 가운데 있는 첫째 난 것은, 대속해야 합니다.[a]
  to: 나귀의 처음 난 것은 어린양으로 속량해야 합니다[a]. 속량하지 않으면 그 목을 꺾어야 합니다. 또한 당신의 아들들 가운데 모든 맏아들은 속량해야 합니다.
  rationale: 원문의 법규적 문체와 반복 구조를 보존하면서, 마지막 절의 부자연스러운 중복을 ‘당신의 아들들 가운데 모든 맏아들’로 바로잡았습니다. 조건문을 원문의 비의지적 표현에 맞추고, שֶׂה의 넓은 의미는 해당 단어에 연결한 각주로 보존했습니다.
