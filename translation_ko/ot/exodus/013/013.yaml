translation:
  language: ko
  text: 나귀의 처음 난 것은 어린양으로 속량해야 합니다[a]. 속량하지 않으면 그 목을 꺾어야 합니다. 또한 당신의 아들들 가운데 모든 맏아들은 속량해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 양이나 염소를 포함할 수 있는 더 넓은 말입니다. 여기서는 문맥상 ‘어린양’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר חֲמוֹר
  english_pob_choice: firstborn of a donkey
  chosen_korean: 나귀의 첫 새끼
  alternatives_korean:
  - 나귀의 처음 난 것
  - 나귀의 맏배
  lexicon: HALOT
  rationale: פֶּטֶר가 ‘맡개/처음 열림’의 개념이지만, 제의·법률 문맥에서는 한국어로 ‘첫 새끼’가 가장 자연스럽고 source의 동물 대비를 분명히 드러냅니다.
- source_word: תִּפְדֶּה
  english_pob_choice: you shall redeem
  chosen_korean: 대속해야 합니다
  alternatives_korean:
  - 속량해야 합니다
  - 구속해야 합니다
  lexicon: HALOT
  rationale: פדה의 법적·제의적 대가 지불/대체 의미를 살리기 위해 ‘대속하다’를 택했습니다. 단순한 ‘되찾다’보다 본문의 규례 성격을 더 정확히 드러냅니다.
- source_word: בְשֶׂה
  english_pob_choice: with a lamb
  chosen_korean: 어린양으로
  alternatives_korean:
  - 양으로
  - 양 새끼로
  lexicon: HALOT
  rationale: 히브리어는 본래 양이나 염소까지 포함할 수 있지만, 여기서는 희생 규례의 자연스러운 한국어로 ‘어린양’이 가장 적절합니다. POB의 어휘 선택을 반영해 제물의 성격을 살렸습니다.
- source_word: וַעֲרַפְתּוֹ
  english_pob_choice: you shall break its neck
  chosen_korean: 그 목을 꺾으십시오
  alternatives_korean:
  - 그 목을 부러뜨리십시오
  - 그 목덜미를 꺾으십시오
  lexicon: HALOT
  rationale: ערף는 일반 도살이 아니라 목을 꺾는 행위를 뜻하므로, 직설적이면서도 자연한 표현인 ‘목을 꺾다’를 사용했습니다.
- source_word: בְּבָנֶי/ךָ
  english_pob_choice: among your sons
  chosen_korean: 당신의 아들들 가운데 있는
  alternatives_korean:
  - 당신의 자녀들 가운데 있는
  - 당신의 아들 가운데 있는
  lexicon: HALOT
  rationale: 히브리어가 분명히 ‘아들들’을 말하므로 일반화하지 않고 그대로 반영했습니다. 한국어에서는 ‘가운데 있는’으로 범주 포함을 자연스럽게 살렸습니다.
theological_decisions:
- issue: אָדָם의 번역 범위
  chosen_reading: ‘사람의 첫째 난 것’으로 옮겨 인간 일반을 뜻하게 했습니다.
  alternative_readings:
  - 인간의 첫째 난 것
  - 사람의 첫새끼
  rationale: אָדָם은 여기서 동물과 대비되는 인간 범주를 가리키므로, 한국어 ‘사람’이 성별을 특정하지 않으면서도 대조를 선명하게 보여 줍니다. 이어지는 ‘아들들’ 표현과 함께 법 규례의 의미를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms table (אָדָם), Translation philosophy §4'
