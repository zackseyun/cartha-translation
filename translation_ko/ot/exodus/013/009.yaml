  verdict: revise
  source_fidelity: 원문의 병렬 구조(‘손 위의 표징’ / ‘눈 사이의 기념’)와 목적절 및 이유절은 대체로 보존되었습니다. 다만 ‘손에 있는 표’와 ‘눈 사이에 있는 기념물’은 각각 עַל(‘위에’) 및 זִכָּרוֹן(‘기념, 기억하게 하는 것’)의 표현을 다소 부자연스럽고 물질적인 대상으로 좁힙니다. ‘기념’으로 옮겨 원문의 해석 여지를 유지하는 편이 더 충실합니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 ‘될 것입니다’로 유지하되, ‘~에 있는 기념물’ 같은 수식어 연쇄를 ‘~에 기념이 될 것입니다’로 정리하면 훨씬 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 두어 독자가 적용 대상을 분명히 알 수 있게 했습니다.
  terminology: יהוה는 프로젝트 선택을 따라 ‘야훼’, תּוֹרָה는 본문에서 ‘율법’으로 유지했습니다. אוֹת는 성경 문맥에서 자연스럽고 의미 폭도 지니는 ‘표징’으로, זִכָּרוֹן은 물체를 뜻하는 ‘기념물’ 대신 ‘기념’으로 수정했습니다.
