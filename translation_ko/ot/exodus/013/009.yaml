  to: 그것은 당신의 손 위에 표징이 되고 당신의 눈 사이에 기념이 될 것입니다.[a] 이는 야훼의 율법이 당신의 입에 있도록 하려는 것입니다.[b] 야훼께서 강한 손으로 당신을 이집트에서 이끌어 내셨기 때문입니다.[c]
  rationale: 원문의 문자적 공간 이미지와 병렬성을 보존하면서도, 한국어에서 부자연스럽거나 원문의 의미를 물질적 대상으로 과도하게 한정하는 ‘기념물’을 ‘기념’으로 고쳤습니다. 목적절(לְמַעַן)과 이유절(כִּי)의 관계는 유지했으며, 후대 테필린 관행을 본문에 명시하지 않았습니다.
