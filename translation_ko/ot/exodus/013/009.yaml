  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֩ לְ/ךָ֨ לְ/א֜וֹת עַל יָדְ/ךָ֗ וּ/לְ/זִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔י/ךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהוָ֖ה בְּ/פִ֑י/ךָ כִּ֚י בְּ/יָ֣ד חֲזָקָ֔ה הוֹצִֽאֲ/ךָ֥ יְהֹוָ֖ה מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
  footnotes:
  - marker: a
    text: Or 'between your eyes' may be understood idiomatically as 'on your forehead'; the Hebrew wording is kept literal here.
    reason: lexical_alternative
  - marker: b
    text: Or 'the instruction of the LORD.' Hebrew torah can mean 'law' or 'instruction,' depending on context.
    reason: lexical_alternative
  - marker: c
    text: Traditional English often has 'with a mighty hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 당신의 손에 있는 표가 되고 당신의 눈 사이에 있는 기념물이 될 것이니, 이는 야훼의 율법이 당신의 입에 있게 하려는 것입니다. 이는 야훼께서 강한 손으로 당신을 이집트에서 이끌어 내셨기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신의 눈 사이에’는 히브리어 표현을 문자적으로 옮긴 것이며, 관용적으로는 ‘이마에’로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 תּוֹרָה는 문맥에 따라 ‘율법’ 또는 ‘가르침/지시’를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘강한 손’은 출애굽기를 특징짓는 전형적인 구원 표현입니다. 전통 번역에는 ‘능한 손’이 자주 나타납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאוֹת עַל יָדְךָ
  english_pob_choice: as a sign on your hand
  chosen_korean: 당신의 손에 있는 표
  alternatives_korean:
  - 손 위의 표
  - 손에 매는 표
  lexicon: HALOT
  rationale: אוֹת는 단순한 '표'보다 '표징/표'의 의미가 있으나, 한국어에서는 문맥상 간결한 '표'가 가장 직접적입니다. עַל יָדְךָ는 문자적으로 '당신의 손에'이므로, 후대 관행을 본문에 미리 주입하지 않고 그대로 살렸습니다.
- source_word: וּלְזִכָּרוֹן בֵּין עֵינֶיךָ
  english_pob_choice: and as a memorial between your eyes
  chosen_korean: 당신의 눈 사이에 있는 기념물
  alternatives_korean:
  - 당신의 눈 사이에 있는 기억물
  - 이마에 있는 기념물
  lexicon: HALOT
  rationale: זִכָּרוֹן은 단순한 '기억'보다 공동체적·예식적 울림이 있는 '기념물/기념'의 범주에 가깝습니다. בֵּין עֵינֶיךָ는 본문 표현을 따라 직역하여, 의미를 이마로 해석하는 것은 주석 여지로 남겼습니다.
- source_word: תּוֹרַת יְהוָה
  english_pob_choice: the law of Yahweh
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 야훼의 가르침
  - 야훼의 토라
  lexicon: HALOT
  rationale: תּוֹרָה는 문맥에 따라 '율법' 또는 '가르침/지시'를 뜻하지만, 출애굽기 언약 문맥에서는 '율법'이 가장 자연스럽고 무게감이 있습니다. POB의 'Yahweh'를 한국어에서도 일관되게 반영했습니다.
- source_word: בְּיָד חֲזָקָה
  english_pob_choice: with a strong hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 능한 손으로
  - 강력한 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 유지해 야훼의 구원 행위를 힘의 이미지로 드러냈습니다. 전통적 '능한 손'은 가능하지만, כאן의 חֲזָקָה에는 보다 직접적인 '강한'이 가깝습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기준에 따라 신성 4문자 יְהוָה는 칭호가 아니라 고유명으로서 '야훼'로 옮겼습니다. 이는 본문이 드러내는 개인적·언약적 이름을 보존합니다.
theological_decisions:
- issue: ‘손’과 ‘눈 사이’ 표현을 후대 유대 관습(테필린)으로 명시적으로 풀지 않을지
  chosen_reading: 본문의 구체적 이미지를 그대로 유지하고, 테필린/이마 해석은 본문 밖의 가능성으로 남겼습니다.
  alternative_readings:
  - ‘팔에 매는 표’와 ‘이마에 있는 표’로 해석
  - 기억의 상징으로만 비유적으로 처리
  rationale: 히브리어 본문은 상징적 언어를 쓰지만, 후대 제도를 직접 명명하지는 않습니다. 번역에서 과도한 해석을 넣지 않고 원문이 허용하는 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §3; source transparency
- issue: תּוֹרָה를 ‘율법’으로 옮길지 ‘가르침/지시’로 옮길지
  chosen_reading: 본문에서는 ‘율법’을 택했습니다.
  alternative_readings:
  - 가르침
  - 토라
  rationale: 출애굽기 13장의 언약적·교훈적 맥락에서 '율법'은 한국어 성경 독자에게 가장 즉각적으로 기능하는 대응어입니다. 다만 어휘 범위의 넓이는 보존되어야 하므로 주석 가능성은 열어 둡니다.
  doctrine_reference: Translation philosophy §5
