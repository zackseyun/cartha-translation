revisions:
- from: 이제, 내가 주께 은혜를 입었으면 부디 주의 길을 내게 알려 주십시오. 그러면 내가 주를 알게 되어서, 주의 눈에 은혜를 입게 될 것입니다. 그리고 이 민족이 주의 백성임을 보아 주십시오.[a][b][c]
  to: 그러므로 이제, 내가 주의 눈에 은혜를 입었다면, 부디 주의 길들을 제게 알려 주셔서 제가 주를 알고, 주의 눈에 은혜를 얻게 하여 주십시오.[a] 또 이 민족이 주의 백성임을 유념해 주십시오.[b][c]
  rationale: 원문의 복수형 ‘길들’, 반복되는 ‘주의 눈에 은혜를 입다’, 그리고 목적 관계를 보존했습니다. 마지막 명령은 한국어에서 자연스럽게 관용적 의미를 드러내도록 ‘유념해 주십시오’로 옮겼습니다. 각주 표지는 해당 표현 뒤에 배치하여 연결 대상을 분명히 했습니다.
  reviewer_model: gpt-5.6-terra
