  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֡ה אִם נָא֩ מָצָ֨אתִי חֵ֜ן בְּ/עֵינֶ֗י/ךָ הוֹדִעֵ֤/נִי נָא֙ אֶת דְּרָכֶ֔/ךָ וְ/אֵדָ֣עֲ/ךָ֔ לְמַ֥עַן אֶמְצָא חֵ֖ן בְּ/עֵינֶ֑י/ךָ וּ/רְאֵ֕ה כִּ֥י עַמְּ/ךָ֖ הַ/גּ֥וֹי הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
  footnotes:
  - marker: a
    text: Or, 'show me your way.' The Hebrew has the plural 'your ways,' but some English versions smooth it to the singular for style.
    reason: lexical_alternative
  - marker: b
    text: 'Or, ''see'' or ''look.'' Here the sense is idiomatic: ''take notice'' or ''consider.'''
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''this nation.'' The clause also says ''your people,'' preserving both national and covenantal language.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 이제, 내가 주의 눈에 은혜를 입었다면, 부디 주의 길들을 제게 알려 주셔서 제가 주를 알고, 주의 눈에 은혜를 얻게 하여 주십시오.[a] 또 이 민족이 주의 백성임을 유념해 주십시오.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘당신의 길들’이라는 복수형입니다. 한국어 번역에서는 문체상 단수로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 명령은 단순히 눈으로 보는 것보다 ‘주목하여 살피다’ 또는 ‘유념하다’는 뜻을 담습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘이 민족’과 ‘당신의 백성’을 함께 말하여, 민족과 백성이라는 두 표현을 모두 사용합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now therefore
  chosen_korean: 이제
  alternatives_korean:
  - 그러므로 이제
  - 이제 그러므로
  lexicon: HALOT
  rationale: 문맥 전환과 간청의 시작을 자연스러운 한국어로 살리되, ‘그러므로’는 뒤 문장의 논리적 흐름에서 보완됩니다.
- source_word: נָא
  english_pob_choice: please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 청하건대
  lexicon: HALOT
  rationale: 간청의 공손함을 합쇼체 문맥에 맞게 살리기 위해 ‘부디’를 택했습니다.
- source_word: הוֹדִעֵ֤נִי ... אֶת דְּרָכֶ֔ךָ
  english_pob_choice: make your ways known to me
  chosen_korean: 주의 길을 내게 알려 주십시오
  alternatives_korean:
  - 주의 길들을 내게 알려 주십시오
  - 주의 길을 내게 보여 주십시오
  lexicon: HALOT
  rationale: 히브리어 표면형은 복수 ‘길들’이지만, 한국어에서는 하나의 관용적 표현으로 자연스럽게 옮겨 ‘주의 길’로 처리했습니다. ‘알려 주십시오’는 히필 동사의 사역적 의미를 담습니다.
- source_word: וּרְאֵה
  english_pob_choice: see / consider
  chosen_korean: 보아 주십시오
  alternatives_korean:
  - 살펴 주십시오
  - 생각해 주십시오
  lexicon: HALOT
  rationale: ראה의 명령형을 직역하되, 요청의 기능을 살려 ‘보아 주십시오’로 옮겼습니다. 문맥상 단순 시각이 아니라 ‘눈여겨봐 주십시오’에 가깝습니다.
- source_word: עַמְּךָ הַגּוֹי הַזֶּה
  english_pob_choice: this nation is your people
  chosen_korean: 이 민족이 주의 백성임
  alternatives_korean:
  - 이 나라가 주의 백성임
  - 이 민족은 주의 백성임
  lexicon: HALOT
  rationale: גּוֹי와 עַם을 함께 반영하기 위해 ‘민족’과 ‘백성’을 함께 살렸습니다. 관계를 분명히 하기 위해 종속절로 자연스럽게 정리했습니다.
theological_decisions:
- issue: ‘주의 눈에 은혜를 입다’의 반복 유지
  chosen_reading: 주께 은혜를 입었으면 / 주의 눈에 은혜를 입게 될 것입니다
  alternative_readings:
  - 주께 호의를 얻었으면
  - 주님의 인정을 받게 될 것입니다
  rationale: 본문의 ‘은혜/호의’ 반복을 유지해 모세의 간청 구조를 드러냈습니다. ‘인정’으로 바꾸면 관계적 은혜의 뉘앙스가 약해집니다.
  doctrine_reference: Translation philosophy §§1, 5
