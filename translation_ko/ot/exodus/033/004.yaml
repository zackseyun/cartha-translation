base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
  footnotes:
  - marker: a
    text: Or 'this evil word' or 'this grievous word.' The Hebrew keeps the more literal 'word/matter' rather than the more idiomatic 'news.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his jewelry' or 'his adornment.' The Hebrew term refers broadly to ornamental items.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성이 이 나쁜 소식을[a] 듣고 애도하였으며[b], 아무도 자기의 장신구를 몸에 걸치지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이 나쁜 말/일’에 가깝습니다. 여기서는 앞선 선언을 가리키는 관용적 의미를 따라 ‘소식’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 단순한 슬픔보다 상례적 ‘애도’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 백성들
  lexicon: WLC
  rationale: 이스라엘 공동체 전체를 가리키는 집합명사이므로, 현대 한국어에서는 자연스럽고 공식적인 ‘백성’이 적절합니다.
- source_word: הַדָּבָר הָרָע הַזֶּה
  english_pob_choice: this bad news
  chosen_korean: 이 나쁜 소식
  alternatives_korean:
  - 이 악한 말
  - 이 나쁜 말씀
  - 이 끔찍한 소식
  lexicon: WLC
  rationale: 히브리어 דבר는 문자적으로는 ‘말/일’이지만, 여기서는 앞선 여호와의 선언을 가리키므로 한국어에서는 의미를 살려 ‘소식’으로 옮기되, רָע의 거칠음을 ‘나쁜’으로 반영했습니다.
- source_word: וַיִּתְאַבָּלוּ
  english_pob_choice: they mourned
  chosen_korean: 애도하였으며
  alternatives_korean:
  - 슬퍼하였으며
  - 곡하였으며
  - 상복을 입었습니다
  lexicon: WLC
  rationale: 히트파엘 형태는 단순 감정이 아니라 상례적 애도를 뜻하므로, 일상어보다 격식 있는 ‘애도하다’가 의미를 잘 드러냅니다.
- source_word: עֶדְיוֹ
  english_pob_choice: his ornaments
  chosen_korean: 자기의 장신구
  alternatives_korean:
  - 자기의 장식품
  - 자기의 치장품
  - 자기 보석
  lexicon: WLC
  rationale: עֶדְי는 보석에만 한정되지 않는 장식물을 가리키므로, 범위를 넓게 살린 ‘장신구’가 적절합니다.
- source_word: וְלֹא שָׁתוּ אִישׁ ... עָלָיו
  english_pob_choice: and no man put on
  chosen_korean: 아무도 … 몸에 걸치지 않았습니다
  alternatives_korean:
  - 어느 누구도 … 입지 않았습니다
  - 아무도 … 착용하지 않았습니다
  lexicon: WLC
  rationale: שׁים의 기본 의미는 ‘두다/놓다’이지만, 장신구와 함께 쓰일 때는 ‘몸에 걸치다/착용하다’가 자연스러운 한국어입니다. 아울러 ‘아무도’로 הד distributive sense를 살렸습니다.
theological_decisions:
- issue: 장신구 착용 금지의 표현 방식
  chosen_reading: ‘아무도 자기의 장신구를 몸에 걸치지 않았습니다’로 옮겨, 단순히 소유를 포기한 것이 아니라 실제 착용 행위를 중단했음을 드러냈습니다.
  alternative_readings:
  - ‘아무도 자기 장신구를 하지 않았습니다’
  - ‘아무도 장식품을 걸치지 않았습니다’
  rationale: 문맥은 애도의 표지로서 외적 치장을 중지한 행동을 말하므로, 행위성을 분명히 해야 합니다.
  doctrine_reference: 문맥주의적 역사서 번역 원칙
