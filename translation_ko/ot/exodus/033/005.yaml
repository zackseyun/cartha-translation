  to: 야훼께서 모세에게 말씀하셨습니다. “이스라엘 자손에게 말하십시오. ‘너희는 목이 곧은 백성입니다. 내가 한순간이라도 너희 가운데로 올라가면, 너희를 멸해 버릴 것입니다. 이제 너희의 장식을 몸에서 벗으십시오. 그러면 내가 너희를 어떻게 할지 알겠습니다.’”
