source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר הַרְאֵ֥/נִי נָ֖א אֶת כְּבֹדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
  footnotes:
  - marker: a
    text: Or “let me see your splendor.” The Hebrew verb is literally “cause me to see,” and “glory” can also denote manifested splendor or honor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀했습니다. “부디 당신의 영광을 제게 보여 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 광채를 보게 해 주십시오.” 히브리어 동사는 문자적으로는 “보게 하다”이며, ‘영광’은 드러난 광채나 존귀를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  english_pob_choice: Then he said
  chosen_korean: 그가 말씀했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그리고 그가 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리되, 하나님께 드리는 요청의 정중한 맥락을 반영해 ‘말씀하다’를 택했습니다.
- source_word: הַרְאֵנִי
  english_pob_choice: show me
  chosen_korean: 제게 보여 주십시오
  alternatives_korean:
  - 제게 보게 해 주십시오
  - 보게 해 주십시오
  lexicon: HALOT
  rationale: 히필 형태의 ‘cause me to see’를 한국어에서는 상대방의 행위로 자연스럽게 옮겨 ‘보여 주십시오’로 렌더링했습니다.
- source_word: נָא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 간청하오니
  lexicon: HALOT
  rationale: נא의 간청·정중함을 현대 표준어에서 가장 자연스럽게 드러내는 표현으로 ‘부디’를 택했습니다.
- source_word: כְּבֹדֶךָ
  english_pob_choice: your glory
  chosen_korean: 당신의 영광
  alternatives_korean:
  - 당신의 광채
  - 당신의 존귀
  lexicon: HALOT
  rationale: כָּבוֹד의 핵심 의미를 ‘영광’으로 유지해, 출애굽기 33장의 신학적 긴장—가시적 광채인지, 임재의 현현인지—을 좁히지 않고 보존했습니다.
theological_decisions:
- issue: ‘영광’의 범위
  chosen_reading: ‘영광’으로 두어, 보이는 광채나 임재의 현현 중 어느 한쪽으로 과도하게 한정하지 않았습니다.
  alternative_readings:
  - 당신의 광채
  - 당신의 임재의 충만함
  rationale: 히브리어 כָּבוֹד은 문맥상 다양한 뉘앙스를 가질 수 있으므로, 본문이 허용하는 신학적 폭을 유지하는 것이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
