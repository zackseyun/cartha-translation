base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
  footnotes:
  - marker: a
    text: Or 'what is behind me' / 'my after-part.' The Hebrew term can denote the back or rearward aspect.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 내가 내 손을 거두어 들일 것이며, 당신은 내 뒤쪽[a]을 보게 될 것입니다. 그러나 내 얼굴은 보이지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 등’, ‘내 뒤편’, 또는 ‘내 뒤의 면’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  english_pob_choice: Then I will remove
  chosen_korean: 내 손을 거두면
  alternatives_korean:
  - 내 손을 치우면
  - 내 손을 거두어 가면
  lexicon: HALOT
  rationale: 원문의 ‘제거하다/거두다’ 의미를 살리면서, 앞선 보호 이미지를 이어 주는 자연스러운 한국어로 옮겼습니다.
- source_word: כַּפִּי
  english_pob_choice: my hand
  chosen_korean: 내 손
  alternatives_korean:
  - 내 손바닥
  - 내 발바닥
  lexicon: HALOT
  rationale: כַּף는 ‘손바닥’까지 포함할 수 있지만, 이 인체 비유에서는 보호를 위해 덮는 ‘손’이 더 자연스럽고 문맥에 맞습니다.
- source_word: אֲחֹרַי
  english_pob_choice: my back
  chosen_korean: 내 뒤쪽
  alternatives_korean:
  - 내 등
  - 내 뒤편
  - 내 뒷모습
  lexicon: HALOT
  rationale: 이 단어는 ‘등’보다 넓게 ‘뒤쪽/뒤편, 뒤의 면’까지 가리킬 수 있어, 전통적 표현을 지나치게 좁히지 않도록 ‘뒤쪽’으로 옮겼습니다.
- source_word: לֹא יֵרָאוּ
  english_pob_choice: shall not be seen
  chosen_korean: 보지 못할 것입니다
  alternatives_korean:
  - 보이지 않을 것입니다
  - 볼 수 없을 것입니다
  lexicon: HALOT
  rationale: 히브리어는 수동형 ‘보이다/보여지다’의 뜻이므로, 한국어에서는 능동적 금지보다 결과적 불가능을 드러내는 표현이 문맥상 더 자연스럽습니다.
theological_decisions:
- issue: 하나님의 신체적 비유를 완화할지 여부
  chosen_reading: ‘손’, ‘뒤쪽’, ‘얼굴’ 같은 구체적 신체 용어를 그대로 유지했습니다.
  alternative_readings:
  - ‘임재의 흔적’처럼 추상화하기
  - ‘나의 나타남/나의 영광’으로 바꾸기
  rationale: 본문은 하나님을 인간의 몸에 빗대어 말하는 긴장을 의도적으로 유지하므로, 이를 추상화해 의미 충돌을 해소하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
