  source_fidelity: 수정이 필요합니다. 초안의 ‘내 손을 거두면’은 히브리어의 순차적 미래 진술을 조건절로 바꾸는 경향이 있으며, ‘내 얼굴은 보지 못할 것입니다’는 수동형 ‘보이지 않을 것이다’에서 주체를 ‘당신’으로 전환합니다. 둘 다 본문의 핵심 의미는 대체로 전달하지만, 원문의 문법적 관점을 더 충실히 반영할 수 있습니다.
  naturalness: ‘내 손을 거두어 들일 것이며’와 ‘내 얼굴은 보이지 않을 것입니다’는 현대 표준어 합쇼체에서 자연스럽고 명료합니다. 각주 표지는 해당 어휘인 ‘뒤쪽’에 붙이는 것이 독자의 이해에 더 적절합니다.
  terminology: ‘손’, ‘뒤쪽’, ‘얼굴’은 원문의 의인적 신체 비유를 유지합니다. ‘뒤쪽’은 אֲחֹרַי의 ‘등/뒤편/뒤의 면’이라는 폭을 무리 없이 보존합니다.
