  rationale: 영어 POB 주석처럼 이 구절은 장소 표지일 수도 있으나, 문맥상 그 시점을 기점으로 한 지속 상태를 나타낼 수 있어 한국어에서도 그 여지를 살렸습니다.
  doctrine_reference: 문맥상 시점/지속 상태 해석
