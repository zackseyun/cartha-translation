  rationale: 문맥상 금속 장식이나 개인 장식 전반을 가리키는 말로 보아, 한국어에서는 너무 좁지 않은 ‘장신구’가 가장 무난합니다.
- source_word: מֵהַר חוֹרֵב
  english_pob_choice: from Mount Horeb onward
  chosen_korean: 호렙산에서부터
  alternatives_korean:
