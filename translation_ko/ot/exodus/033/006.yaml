translation:
  language: ko
  text: 그리하여 이스라엘 자손은 호렙 산에서부터 그들의 장신구를 벗었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 자손은 호렙 산에서 그들의 장신구를 벗었습니다.’ 히브리어 구절은 장소를 나타내는 말로도, 그때부터 더 이상 장신구를 착용하지 않았음을 나타내는 말로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  english_pob_choice: stripped off
  chosen_korean: 벗어 버렸습니다
