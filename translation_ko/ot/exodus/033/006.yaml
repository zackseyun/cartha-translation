  lexicon: HALOT
  rationale: 히브리어의 직접적 관용구를 그대로 반영하되, 현대 한국어 성경문체에서 이해 가능한 표현으로 옮겼습니다.
- source_word: עֶדְיָם
  english_pob_choice: their ornaments
  chosen_korean: 장신구
