    text: 또는 ‘이스라엘 사람들이 호렙산에서 자기들의 장신구를 벗어 버렸다.’ 히브리어 구절은 장소를 나타내는 말로도, 그때부터 더 이상 장신구를 착용하지 않았음을 나타내는 말로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  english_pob_choice: stripped off
  chosen_korean: 벗어 버렸습니다
