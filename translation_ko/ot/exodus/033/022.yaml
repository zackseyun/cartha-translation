base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
  footnotes:
  - marker: a
    text: Or 'in the cleft of the rock.' The Hebrew can be rendered with either definite or indefinite English on 'cleft.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내 영광이 지나갈 때에, 내가 너를 바위의 틈에 두고, 내가 지나갈 때까지 내 손으로 너를 덮겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '바위의 틈에'. 히브리어는 '틈'을 부정적·정적 표현으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה / And when
  english_pob_choice: And when
  chosen_korean: 그리고 ... 때에
  alternatives_korean:
  - 그리고 ...하면
  - 그리고 ...할 때
  lexicon: HALOT
  rationale: וְהָיָה가 여기서는 단순 서술보다 뒤따르는 상황을 여는 시간절의 역할을 하므로, 한국어에서는 '그리고 ... 때에'로 자연스럽게 연결했습니다.
- source_word: בַּעֲבֹר כְּבֹדִי / my glory passes by
  english_pob_choice: my glory passes by
  chosen_korean: 내 영광이 지나갈 때에
  alternatives_korean:
  - 내 영광이 지나가면
  - 내 영광이 지나가는 동안
  lexicon: HALOT
  rationale: כָּבוֹד는 여기서 단순한 '명예'가 아니라 현현하는 하나님의 영광을 가리키므로 '내 영광'을 유지했고, בַּעֲבֹר는 시간적 절로 옮겼습니다.
- source_word: בְּנִקְרַת הַצּוּר / in a cleft of the rock
  english_pob_choice: in a cleft of the rock
  chosen_korean: 바위의 틈에
  alternatives_korean:
  - 바위의 갈라진 틈에
  - 그 바위의 틈에
  lexicon: HALOT
  rationale: נִקְרָה는 '틈, 갈라진 곳'의 뜻이므로 직역성을 살리되 한국어로 자연스러운 '바위의 틈'으로 옮겼습니다. 영어 POB의 부정관사/정관사 유동성은 한국어에서는 굳이 표시하지 않았습니다.
- source_word: וְשַׂכֹּתִי כַפִּי עָלֶיךָ / I will cover you with my hand
  english_pob_choice: I will cover you with my hand
  chosen_korean: 내 손으로 너를 덮겠습니다
  alternatives_korean:
  - 내 손으로 너를 가리겠습니다
  - 내 손으로 너를 보호하겠습니다
  lexicon: HALOT
  rationale: כַּף는 문자적으로는 '손바닥'이지만, 신체적 은유를 유지하는 것이 중요해 한국어 관용에 맞는 '손'을 택했습니다. '덮다'는 סכך의 덮어 가리거나 막는 이미지를 살립니다.
theological_decisions:
- issue: 하나님의 손에 대한 신체적 은유
  chosen_reading: 구체적 신체 표현을 유지해 '내 손으로 너를 덮겠습니다'로 옮겼습니다.
  alternative_readings:
  - 내 보호로 너를 가리겠습니다
  - 내 능력으로 너를 지키겠습니다
  rationale: 본문은 하나님의 현현 장면에서 직접적인 신체 은유를 사용하므로, 그것을 추상화하지 않고 보존하는 것이 소스의 긴장과 장면성을 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
