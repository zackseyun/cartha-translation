  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
  footnotes:
  - marker: a
    text: Or, 'who you will send with me.' The Hebrew construction can be rendered with either 'whom' or 'who' in English.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''I know you by name,'' an idiom expressing personal knowledge and favor.'
    reason: cultural_note
  - marker: c
    text: Or, 'you have found grace in my eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 야훼께 말씀드렸습니다. “보십시오, 당신께서는 저에게 ‘이 백성을 데리고 올라가라’고 말씀하시면서도, 저와 함께 누구를 보내실지는 저에게 알려 주지 않으셨습니다. 그런데 당신께서는 ‘내가 너를 이름으로 알고 있으며’[a] ‘너도 내 눈에 호의를 얻었다’[b]고 말씀하셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘이름으로 안다’는 개인적으로 알고 특별한 관계를 맺고 있음을 나타내는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘내 눈에 은혜를 얻었다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 표기를 한국어에서도 고유명사로 보존하기 위해 ‘야훼’로 옮겼습니다. 이는 관습적 대치어보다 מקור의 인칭적 이름을 더 직접적으로 드러냅니다.
- source_word: הַעַל אֶת הָעָם הַזֶּה
  english_pob_choice: Bring up this people
  chosen_korean: 이 백성을 올라가게 하라
  alternatives_korean:
  - 이 백성을 데리고 올라가라
  - 이 백성을 인도하라
  lexicon: HALOT
  rationale: עלה의 사역형을 ‘올라가게 하라’로 옮겨 상승·이동의 방향성을 살렸습니다. ‘이 백성’도 히브리어의 거리감 있는 지시 표현을 유지합니다.
- source_word: לֹא הוֹדַעְתַּנִי אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  english_pob_choice: you have not made known to me whom you will send with me
  chosen_korean: 당신과 함께 누구를 보내실지 저에게 알려 주지 않으셨습니다
  alternatives_korean:
  - 당신이 저와 함께 보낼 자가 누구인지 알려 주지 않으셨습니다
  - 저와 동행시킬 이를 알려 주지 않으셨습니다
  lexicon: HALOT
  rationale: הוֹדַע의 ‘알리다/알려 주다’ 의미를 살리고, עִמִּי는 단순한 ‘함께’로 처리해 동반 관계를 분명히 했습니다. 상대역구문 ‘whom/who’의 유동성은 한국어에서는 자연스러운 ‘누구’를 택해 반영했습니다.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  english_pob_choice: I know you by name
  chosen_korean: 내가 너를 이름으로 알고 있으며
  alternatives_korean:
  - 내가 너를 이름까지 알고 있으며
  - 내가 너를 이름으로 아노라
  lexicon: HALOT
  rationale: 히브리 관용구를 직역하되, 한국어에서는 ‘이름으로 알고 있다’가 개인적·관계적 인지를 가장 자연스럽게 드러냅니다. POB의 문화적 주석을 따라 단순 정보가 아닌 친밀한 인식을 보존했습니다.
- source_word: מָצָאתָ חֵן בְּעֵינָי
  english_pob_choice: you have found favor in my sight
  chosen_korean: 내 눈에 은혜를 얻었다
  alternatives_korean:
  - 내 눈에 호의를 얻었다
  - 내 눈에 은총을 입었다
  lexicon: HALOT
  rationale: חֵן의 핵심을 ‘은혜’로 옮겨, 전통적 종교어휘를 무비판적으로 따르기보다 문맥의 호의·호감 의미를 보존했습니다. 다만 ‘눈에’ 이미지를 유지해 히브리식 표현성을 살렸습니다.
theological_decisions:
- issue: מָצָאתָ חֵן בְּעֵינָי의 신학적 뉘앙스
  chosen_reading: ‘내 눈에 은혜를 얻었다’로 옮겨, 호의와 언약적 친밀감은 드러내되 선택이나 예정의 추가 진술은 덧붙이지 않았습니다.
  alternative_readings:
  - 내 눈에 호의를 얻었다
  - 내 눈에 은총을 입었다
  - 내 눈에 은혜를 찾았다
  rationale: 히브리어 관용구는 관계적 승인과 호의를 뜻하지만, 본문 자체는 그 이상을 명시하지 않습니다. 따라서 문맥의 무게를 살리면서도 교리적 확대 해석은 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
