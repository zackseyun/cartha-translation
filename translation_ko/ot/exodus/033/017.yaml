base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
  footnotes:
  - marker: a
    text: Or “this matter” or “this word.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “found favor in my eyes,” an idiom meaning to receive favorable regard.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “네가 말한 이 일[a]도 내가 하겠습니다. 네가 내 눈에 호의를 얻었고[b], 내가 너를 이름으로 알고 있기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּבָר는 여기서 ‘말’, ‘일’, 또는 ‘사건’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내 눈에 호의를 얻다’는 호의롭게 여김을 받는다는 뜻의 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 출발어의 언약 이름을 그대로 살리기 위해 프로젝트 기본값인 ‘야훼’를 유지했습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this thing
  chosen_korean: 이 일
  alternatives_korean:
  - 이 말
  - 이 문제
  - 이 일곱
  lexicon: HALOT
  rationale: דָּבָר는 문맥상 모세가 방금 요청한 구체적 사안을 가리키므로, 한국어에서는 자연스럽고 범위도 유지되는 ‘이 일’이 적절합니다.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  english_pob_choice: you have found favor in my eyes
  chosen_korean: 내 눈에 은혜를 입었고
  alternatives_korean:
  - 내 눈에 호의를 얻었고
  - 내게 은총을 받았고
  - 내 눈에 은혜를 얻었고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, ‘은혜’를 유지해 호의 이상의 은총적 뉘앙스를 살렸습니다.
- source_word: בְּשֵׁם
  english_pob_choice: by name
  chosen_korean: 이름으로
  alternatives_korean:
  - 이름을 따라
  - 개별적으로
  - 이름을 아시고
  lexicon: HALOT
  rationale: 직접적 대응을 유지하면서도 ‘너를 이름으로 안다’는 개인적 식별의 의미가 드러나게 했습니다.
theological_decisions:
- issue: 하나님의 자기 인지 표현 וָאֵדָעֲךָ의 한국어 시제
  chosen_reading: ‘내가 너를 이름으로 안기 때문이라’로 현재적 관계 인지를 살렸습니다.
  alternative_readings:
  - ‘내가 너를 이름으로 알았기 때문이라’
  - ‘내가 너를 이름으로 인정하기 때문이라’
  rationale: 문맥은 단순한 과거 지식보다 인격적·언약적 인지를 강조하므로, 한국어에서도 현재적 관계성을 보존했습니다.
  doctrine_reference: Exodus 33:17 문맥 — 하나님의 호의와 관계적 인지
