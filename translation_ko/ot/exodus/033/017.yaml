  - severity: low
    issue: The footnote anchors are both placed after the whole quotation rather than at their corresponding expressions.
    rationale: Anchoring [a] to “이 일” and [b] to the favor idiom makes each note's referent clear.
  revised_text: 야훼께서 모세에게 말씀하셨습니다. “네가 말한 이 일[a]도 내가 하겠습니다. 네가 내 눈에 호의를 얻었고[b], 내가 너를 이름으로 알고 있기 때문입니다.”
