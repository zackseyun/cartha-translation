review_pass:
  verdict: revise
  source_fidelity: 원문의 반복·관습적 상황(וְהָיָה, 미완료형들)은 ‘~할 때마다’와 ‘바라보곤 했습니다’로 자연스럽게 보존할 수 있습니다. ‘모세의 뒤를 눈으로 따라 바라보다’는 אַחֲרֵי מֹשֶׁה의 시선이 모세를 따라가는 의미를 충실히 드러냅니다.
  naturalness: 초안의 ‘그가 장막에 들어갈 때까지 그러했습니다’는 앞선 동작 전체를 뭉뚱그려 가리키며 현대 한국어 문장으로 부자연스럽고, 시간절이 ‘지켜보다가’에 직접 연결되지 않습니다. 또한 ‘각자 자기 장막 문에 서서’는 ‘문 앞에/입구에’보다 위치 표현이 다소 어색합니다.
  terminology: ‘장막’은 본문의 일반명사 אֹהֶל을 유지하는 적절한 번역입니다. 각 사람의 개인 장막과 모세가 향하는 장막이 모두 같은 단어로 표현된 점도 원문에 맞습니다. 각주에서 ‘회막’을 대안으로 제시할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘그가 장막에 들어갈 때까지 그러했습니다’
    rationale: 원문은 백성이 모세를 바라보는 행위가 그가 장막에 들어갈 때까지 계속되었음을 말합니다. ‘그러했습니다’는 무엇을 가리키는지 불명확하고, 반복 서술에도 어울리지 않습니다.
  - severity: low
    issue: ‘각자 자기 장막 문에 서서’
    rationale: פֶּתַח אָהֳלוֹ는 각 사람의 장막 ‘입구/문 앞’이라는 장소 표현입니다. ‘문에 서서’보다 ‘장막 입구에 서서’가 자연스럽고 정확합니다.
  revised_text: 모세가 장막[a]으로 나갈 때마다, 온 백성은 모두 일어나 각 사람은 자기 장막 입구에 서서 모세가 장막에 들어갈 때까지 그의 뒤를 눈으로 따라 바라보곤 했습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘회막’; 앞뒤 문맥에서 언급된 만남의 장막을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 남성 단수 ‘각 사람’을 분배적으로 사용합니다.
    reason: lexical_alternative
  revision_rationale: 시간절을 ‘모세가 장막에 들어갈 때까지’라는 지속 범위가 직접 ‘바라보곤 했습니다’에 걸리도록 고쳤습니다. ‘각 사람은 자기 장막 입구에 서서’로 원문의 분배적 주어와 장소 표현을 보존했습니다. b 각주는 본문에서 ‘각 사람’이 유지되므로 해당 어구 뒤에 계속 적용됩니다.
