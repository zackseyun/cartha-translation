id: EXO.33.8
reference: Exodus 33:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/צֵ֤את מֹשֶׁה֙ אֶל הָ/אֹ֔הֶל יָק֨וּמוּ֙ כָּל הָ/עָ֔ם וְ/נִ֨צְּב֔וּ אִ֖ישׁ פֶּ֣תַח אָהֳל֑/וֹ וְ/הִבִּ֨יטוּ֙ אַחֲרֵ֣י מֹשֶׁ֔ה עַד בֹּא֖/וֹ הָ/אֹֽהֱלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
  footnotes:
  - marker: a
    text: Or 'the Tent,' referring to the tent of meeting mentioned in the surrounding context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man'; the singular masculine form is used distributively for the members of the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 장막[a]으로 나갈 때마다 온 백성은 다 일어나서, 각자 자기 장막 문[b]에 서서 모세를 따라 눈으로 지켜보다가 그가 장막에 들어갈 때까지 그러했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회막’으로, 앞뒤 문맥에 나오는 만남의 장막을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 남성 단수 ‘각 사람’을 분배적으로 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּצֵאת
  english_pob_choice: And whenever ... went out
  chosen_korean: '...갈 때마다'
  alternatives_korean:
  - '...나갈 때'
  - '...나가면'
  lexicon: HALOT
  rationale: 반복적·습관적 상황을 나타내는 서술로 보아, 한국어에서는 ‘~할 때마다’가 가장 자연스럽고 반복성을 잘 살립니다.
- source_word: הָאֹהֶל
  english_pob_choice: the tent
  chosen_korean: 장막
  alternatives_korean:
  - 텐트
  - 회막
  lexicon: HALOT
  rationale: 본문의 단어는 단순히 ‘the tent’이지만 출애굽기 문맥상 거룩한 만남의 장막을 가리키므로, 한국어에서는 문맥을 반영하되 풀어 쓰지 않고 ‘장막’으로 옮겼습니다.
- source_word: יָקוּמוּ וְנִצְּבוּ
  english_pob_choice: would rise and stand
  chosen_korean: 일어나서 ... 서서
  alternatives_korean:
  - 일어나 ... 서서
  - 일어나 서서
  lexicon: HALOT
  rationale: 두 동사의 연속 동작을 한국어에서 자연스럽게 풀어, 백성이 즉시 일어나 서는 경외의 자세를 살렸습니다.
- source_word: אִישׁ פֶּתַח אָהֳלוֹ
  english_pob_choice: each man at the entrance of his tent
  chosen_korean: 각자 자기 장막 문
  alternatives_korean:
  - 각 사람은 자기 장막 입구
  - 각 사람은 자기 장막 문 앞
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미를 ‘각자’로 옮기고, פֶּתַח는 ‘문/입구’ 중 더 간명한 ‘문’으로 처리했습니다.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  english_pob_choice: and they would watch after Moses
  chosen_korean: 모세를 따라 눈으로 지켜보다가
  alternatives_korean:
  - 모세를 뒤따라 눈으로 지켜보다가
  - 모세의 뒤를 눈으로 지켜보다가
  lexicon: HALOT
  rationale: אַחֲרֵי מֹשֶׁה의 ‘뒤를 따라/뒤쫓아’라는 시각적 관용을 한국어로 직역하면 어색하므로, ‘눈으로 지켜보다’에 ‘따라’를 붙여 시선이 모세의 뒤를 좇는 모습을 살렸습니다.
theological_decisions:
- issue: 백성의 자세를 과장하지 않고 경외의 반응으로 제시하는 표현
  chosen_reading: ‘일어나서 ... 서서 ... 눈으로 지켜보다가’로 백성의 공손하고 경외적인 반응을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘일어나 서서’
  - ‘바라보며’
  rationale: 본문은 모세를 향한 공동체의 경외와 주의 집중을 서술하므로, 행동의 연속성과 시선의 집중을 모두 보존하는 쪽이 적절합니다.
  doctrine_reference: 출 33:8 문맥의 모세-여호와 만남에 대한 공동체적 경외
- issue: ‘장막’의 범위
  chosen_reading: 본문의 ‘장막’은 단순 시설이 아니라 문맥상 만남의 장막을 가리키는 표현으로 두되, 본문 자체의 단어는 유지했습니다.
  alternative_readings:
  - ‘회막’
  - ‘텐트’
  rationale: 히브리어 본문은 일반명사 ‘tent’를 사용하므로, 번역문에서 지나치게 해설적으로 바꾸기보다 문맥으로 의미를 살리는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 본문-문맥 일치와 용어 절제 원칙
