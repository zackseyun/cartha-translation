  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
  - marker: b
    text: Or 'to your seed.' The Hebrew term is a collective singular meaning offspring or descendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서[a] 모세에게 말씀하셨다. “너와 네가 이집트 땅에서 이끌어 낸 백성은 이곳을 떠나 올라가라. 내가 아브라함에게, 이삭에게, 야곱에게 ‘네 자손에게[b] 그 땅을 주겠다’라고 맹세한 땅으로 가라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘YHWH’이며, 전통적으로는 ‘주’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘네 씨에게’. 히브리어는 집합 단수로, 자손 또는 후손을 뜻합니다.
    reason: lexical_alternative
