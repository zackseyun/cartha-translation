id: EXO.33.2
reference: Exodus 33:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֥י לְ/פָנֶ֖י/ךָ מַלְאָ֑ךְ וְ/גֵֽרַשְׁתִּ֗י אֶת הַֽ/כְּנַעֲנִי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
  footnotes:
  - marker: a
    text: Or 'a messenger.' The Hebrew מַלְאָךְ can denote either an angelic or human messenger; here 'angel' best fits the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너보다 앞서 한 천사를 보내고, 가나안 사람과 아모리 사람과 헷 사람과 브리스 사람과 히위 사람과 여부스 사람을 몰아내겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사자’. 히브리어 מַלְאָךְ는 천사적 사자나 인간 사자를 모두 가리킬 수 있으며, 여기서는 ‘천사’가 문맥에 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי לְפָנֶיךָ
  english_pob_choice: And I will send ... before you
  chosen_korean: 내가 너보다 앞서 ... 보내고
  alternatives_korean:
  - 내가 네 앞에 ... 보내고
  - 내가 너 앞서 ... 보내고
  lexicon: HALOT
  rationale: לְפָנֶיךָ는 단순한 위치가 아니라 진행 앞선 위치를 뜻하므로, 자연스러운 현대 한국어로 ‘너보다 앞서’가 문맥의 선행성을 잘 드러냅니다.
- source_word: מַלְאָךְ
  english_pob_choice: an angel
  chosen_korean: 한 천사
  alternatives_korean:
  - 한 사자
  - 한 메신저
  lexicon: HALOT
  rationale: 히브리어 מַלְאָךְ는 문맥상 신적/인간적 사자를 모두 가질 수 있지만, 여기서는 POB의 판단대로 ‘천사’가 가장 자연스럽고, ‘한’으로 무관사성을 반영했습니다.
- source_word: וְגֵרַשְׁתִּי
  english_pob_choice: and I will drive out
  chosen_korean: 몰아내겠습니다
  alternatives_korean:
  - 쫓아내겠습니다
  - 추방하겠습니다
  lexicon: HALOT
  rationale: גרשׁ는 거주민을 땅에서 내쫓는 뜻이므로, 약한 ‘쫓아내다’보다 결과적 강도를 살린 ‘몰아내다’가 적절합니다.
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  english_pob_choice: the Canaanite ... and the Jebusite
  chosen_korean: 가나안 사람과 아모리 사람과 헷 사람과 브리스 사람과 히위 사람과 여부스 사람
  alternatives_korean:
  - 가나안 족속과 아모리 족속과 헷 족속과 브리스 족속과 히위 족속과 여부스 족속
  - 가나안인과 아모리인과 헷인과 브리스인과 히위인과 여부스인
  lexicon: HALOT
  rationale: 히브리어의 단수 জাত칭 형태를 한국어에서는 반복되는 민족 명칭 구조로 풀어 읽기 쉽게 옮겼습니다. ‘사람’은 종족 집합을 나타내는 중립적 현대 표현입니다.
theological_decisions:
- issue: מַלְאָךְ의 정체를 특정할지 여부
  chosen_reading: 구체적 정체를 밝히지 않고 그냥 ‘한 천사’로 유지했습니다.
  alternative_readings:
  - 야훼의 천사
  - 한 사자
  rationale: 본문 자체가 מַלְאָךְ의 신학적 정체를 명시하지 않으므로, 해석을 앞질러 특정하지 않고 열린 상태를 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
