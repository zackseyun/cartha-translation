  terminology: ‘천사’는 문맥상 적절하되, מַלְאָךְ의 어휘적 대안은 각주로 보존해야 합니다. 기존 각주의 ‘천사적 사자’는 현대 한국어로 다소 부자연스러우므로 ‘천사 또는 인간 사자’로 고칩니다. 민족 명칭들은 통용 표기를 유지합니다.
