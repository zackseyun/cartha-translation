  source_fidelity: 히브리어의 미래적 약속, ‘앞에/앞서’의 인도 맥락, מַלְאָךְ의 비특정성, 그리고 여섯 민족의 목록을 충실히 반영합니다. 다만 현행 어순 ‘내가 너보다 앞서 한 천사를 보내고’는 ‘너보다 앞서’가 보내는 행위의 시간적 선후를 수식하는 것으로도 읽힐 수 있습니다.
