translation:
  language: ko
  text: 젖과 꿀이 흐르는 땅으로[a]. 그러나 내가 너희 가운데로는 올라가지 않겠다. 너희는 목이 뻣뻣한 백성이기 때문이다[b]. 그러지 않으면 내가 길에서 너희를 삼켜 버릴까 봐서이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 가운데’ 또는 ‘너희와 함께’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 너희를 멸할까 봐서이다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  english_pob_choice: to a land flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 땅으로
  alternatives_korean:
  - 젖과 꿀이 흘러넘치는 땅으로
  - 젖과 꿀이 흐르는 어느 땅으로
  lexicon: HALOT
  rationale: 약속의 풍요를 나타내는 관용구를 자연스러운 한국어로 살리되, ‘흐르는’ 이미지를 유지해 원문의 은유를 보존했습니다.
- source_word: בְּקִרְבְּךָ
  english_pob_choice: in your midst
  chosen_korean: 너희 가운데로
  alternatives_korean:
  - 너희 가운데에서
  - 너희 속에
  lexicon: HALOT
  rationale: 공동체 한가운데라는 공간적·관계적 뉘앙스를 살리기 위해 ‘너희 가운데로’로 옮겼습니다.
- source_word: קְשֵׁה עֹרֶף
  english_pob_choice: stiff-necked
  chosen_korean: 목이 뻣뻣한
  alternatives_korean:
  - 고집 센
  - 완고한
  lexicon: HALOT
  rationale: 관용적 비유를 직역에 가깝게 유지하여, 단순한 성격 평이 아니라 하나님께 대한 완강한 저항의 이미지를 드러냈습니다.
- source_word: אֲכֶלְךָ
  english_pob_choice: I consume you
  chosen_korean: 너희를 삼켜 버릴까 봐서이다
  alternatives_korean:
  - 너희를 먹어 버릴까 봐서이다
  - 너희를 멸할까 봐서이다
  lexicon: HALOT
  rationale: ‘consume’의 심판적 이미지를 한국어에서 가장 직접적으로 드러내는 ‘삼키다’를 택했고, 보조동사로 종결성을 분명히 했습니다.
theological_decisions:
- issue: 여호와의 임재를 나타내는 공간 표현
  chosen_reading: 너희 가운데로는 올라가지 않겠다
  alternative_readings:
  - 너희 가운데에는 올라가지 않겠다
  - 너희와 함께는 올라가지 않겠다
  rationale: 하나님의 거룩한 임재가 백성 한가운데 있으면 위험이 된다는 긴장을 ‘가운데로’로 보존했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: 심판 표현 אֲכֶלְךָ의 강도
  chosen_reading: 너희를 삼켜 버릴까 봐서이다
  alternative_readings:
  - 너희를 멸할까 봐서이다
  - 너희를 없애 버릴까 봐서이다
  rationale: 본문이 말하는 파괴의 가능성을 구체적 방식으로 약화하지 않고, 경고의 생생함을 유지했습니다.
  doctrine_reference: Translation philosophy §1 Original-language primacy over translation tradition
