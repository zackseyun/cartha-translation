  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
  footnotes:
  - marker: a
    text: Hebrew literally, “My face will go.” The expression means “my presence will go,” that is, the LORD himself will accompany them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그분이 말씀하셨습니다. 「내 임재가 가고, 내가 너에게 안식을 주겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자 그대로는 “내 얼굴이 갈 것이다”입니다. 이 표현은 “내 임재가 갈 것이다”, 곧 야훼께서 친히 동행하신다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  english_pob_choice: And he said
  chosen_korean: 그분이 말씀하셨습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그리고 그가 말씀하셨습니다
  lexicon: HALOT
  rationale: 서술 도입 동사를 자연스러운 현대 한국어로 옮기되, 직접화법을 여는 기능을 살리기 위해 ‘말씀하셨습니다’를 선택했습니다.
- source_word: פָּנַי
  english_pob_choice: My presence
  chosen_korean: 내 임재
  alternatives_korean:
  - 내 얼굴
  - 내 앞
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘얼굴’ 이미지는 유지되지만, 문맥상 야훼의 인격적 동행을 가리키므로 ‘임재’가 가장 정확한 대응입니다.
- source_word: יֵלֵכוּ
  english_pob_choice: will go
  chosen_korean: 가고
  alternatives_korean:
  - 갈 것입니다
  - 가리라
  lexicon: HALOT
  rationale: 앞의 ‘임재’와 자연스럽게 결합되도록 한국어에서는 현재진행형 어감을 살렸습니다.
- source_word: וַהֲנִחֹתִי לָךְ
  english_pob_choice: and I will give you rest
  chosen_korean: 내가 너에게 안식을 주겠습니다
  alternatives_korean:
  - 내가 너를 쉬게 하겠습니다
  - 내가 너에게 쉬도록 하겠습니다
  lexicon: HALOT
  rationale: 히필형 נוח의 사역적 의미를 살리면서도, 약속의 맥락에 맞는 관용적 표현인 ‘안식을 주다’를 택했습니다.
theological_decisions:
- issue: פָּנַי의 인격적/신학적 함의
  chosen_reading: ‘내 임재’로 번역해 야훼 자신이 동행하신다는 의미를 드러냈습니다.
  alternative_readings:
  - ‘내 얼굴’로 직역
  - ‘내가 직접’로 의역
  rationale: ‘얼굴’의 직유를 그대로 살리면 한국어에서는 오해 소지가 크고, 단순한 추상화도 피해야 하므로, 인격적 동행을 보존하는 ‘임재’가 가장 균형 잡힌 번역입니다.
  doctrine_reference: 출 33장의 야훼 동행 약속; POB의 covenant-sensitive rendering
