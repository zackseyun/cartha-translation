  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘현존이 가지 않으시면’은 한국어에서 부자연스럽고, 히브리어의 동행 의미를 충분히 자연스럽게 전달하지 못합니다. ‘우리를 여기에서 올려 보내지 마십시오’는 사역형 ‘올려가게 하다’와 현재 장소를 잘 반영합니다.
  naturalness: ‘그가 그에게 말했습니다’는 선행 문맥이 있는 서사에서 가능하나 다소 반복적입니다. 가장 중요한 문제는 ‘주님의 현존이 가지 않으시면’으로, 추상명사 ‘현존’이 주어가 되어 ‘가다’와 결합할 때 어색합니다. ‘주님의 현존이 우리와 함께 가지 않으시면’은 동행의 대상을 밝혀 자연스럽고 원문의 뜻에도 맞습니다.
  terminology: פָּנֶיךָ를 ‘주님의 현존’으로 옮긴 것은 문맥상 적절하며, ‘임재’보다 덜 관습적인 표현이라는 선택도 가능합니다. 다만 각주에서 ‘동행하시는 현존’이라고 한 표현은 중복되고 어색합니다. 문자적 대안과 관용적 의미를 간결하게 제시하는 편이 좋습니다.
