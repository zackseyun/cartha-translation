translation:
  language: ko
  text: 그가 그에게 말했습니다. 「만일 주님의 현존이 우리와 함께 가지 않으시면[a], 우리를 이곳에서 올려 보내지 마십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘당신의 얼굴’입니다. 히브리어에서 ‘얼굴’은 종종 인격적인 현존을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말하였습니다
  lexicon: HALOT
  rationale: וַיֹּאמֶר의 서사 진행을 한국어의 자연스러운 과거 서술로 옮겼습니다. 문맥상 직전 화자를 이어 주는 기능이 핵심이라 ‘그가’로 간명하게 처리했습니다.
- source_word: פָּנֶיךָ
  english_pob_choice: your presence
  chosen_korean: 주님의 현존
  alternatives_korean:
  - 주님의 얼굴
  - 주님의 임재
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘얼굴’이지만, 여기서는 하나님이 함께 가시는 인격적 동행을 가리키므로 ‘현존’이 본문의 의미를 가장 직접적으로 드러냅니다. ‘임재’도 가능하지만, 보다 서술적이고 덜 교회용어화된 ‘현존’을 택했습니다.
- source_word: תַּעֲלֵנוּ
  english_pob_choice: do not bring us up
  chosen_korean: 우리를 여기에서 올려 보내지 마십시오
  alternatives_korean:
  - 우리를 여기에서 데려올리지 마십시오
  - 우리를 여기에서 인도하여 올라가게 하지 마십시오
  lexicon: HALOT
  rationale: עלה의 사역형은 출애굽 여정의 ‘올려감’을 뜻하므로, 단순한 이동보다 목적지로의 데려감을 살려 ‘올려 보내지 마십시오’로 옮겼습니다.
- source_word: מִזֶּה
  english_pob_choice: from here
  chosen_korean: 여기에서
  alternatives_korean:
  - 이곳에서
  - 이 자리에서
  lexicon: HALOT
  rationale: 현재 위치를 가리키는 지시 표현이므로 한국어에서 가장 자연스러운 ‘여기에서’를 사용했습니다.
theological_decisions:
- issue: פָּנֶיךָ를 하나님께 대한 표현으로 어떻게 살릴지
  chosen_reading: ‘주님의 현존’으로 옮기되, 문자적 이미지인 ‘얼굴’은 본문 뜻을 해치지 않는 범위에서 배경에 남깁니다.
  alternative_readings:
  - 주님의 얼굴
  - 주님의 임재
  rationale: 본문은 하나님을 신체 부위로 묘사하려는 것이 아니라, 이스라엘과 동행하시는 인격적 동반을 구하는 간구입니다. ‘현존’은 그 신학적 긴장을 보존하면서도 현대 한국어에서 이해가 분명합니다.
  doctrine_reference: Translation philosophy §3, §6
