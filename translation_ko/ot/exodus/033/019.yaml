base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
  footnotes:
  - marker: a
    text: Or, 'I will have compassion on whom I will have compassion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말씀하셨습니다. 「내가 내 모든 선함을 네 앞에 지나가게 하고, 네 앞에서 야훼의 이름을 선포하리라. 내가 은혜를 베풀 사람에게 은혜를 베풀고, 내가 긍휼을 베풀 사람에게 긍휼을 베풀겠다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 긍휼을 베풀 사람에게 긍휼을 베풀겠다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I myself
  chosen_korean: 내가
  alternatives_korean:
  - 나 자신이
  - 내가 바로
  lexicon: HALOT
  rationale: 히브리어의 명시적 인칭대명사는 강조를 주지만, 한국어에서는 주어를 분명히 하는 것만으로도 충분히 자연스러워서 과도한 자기강조를 덧붙이지 않았습니다.
- source_word: אַעֲבִיר כָּל טוּבִי
  english_pob_choice: will make all my goodness pass
  chosen_korean: 내 모든 선함을 네 앞에 지나가게 하고
  alternatives_korean:
  - 내 모든 선하심을 네 앞에 통과하게 하고
  - 내 모든 복을 네 앞에 지나가게 하고
  lexicon: HALOT
  rationale: טוּב는 여기서 단순한 ‘아름다움’보다 하나님의 선하고 유익한 성품을 가리키므로 ‘선함’으로 옮겼고, 히필의 사역적 뉘앙스를 ‘지나가게 하고’로 살렸습니다.
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  english_pob_choice: I will proclaim the name of Yahweh
  chosen_korean: 야훼의 이름을 선포하리라
  alternatives_korean:
  - 야훼의 이름을 부르리라
  - 야훼의 이름을 선언하리라
  lexicon: HALOT
  rationale: בְּשֵׁם과 קרא의 결합은 여기서 호명보다 자기계시적 선포에 가깝기 때문에 ‘선포하다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 원문의 신명사 טetragrammaton을 전통적 대체어가 아니라 학술적 음역 ‘야훼’로 유지해, 본문이 드러내는 고유한 신적 이름을 보존했습니다.
- source_word: וְחַנֹּתִי... וְרִחַמְתִּי
  english_pob_choice: I will be gracious... I will show mercy
  chosen_korean: 내가 은혜를 베풀 사람에게 은혜를 베풀고, 내가 긍휼을 베풀 사람에게 긍휼을 베풀겠다
  alternatives_korean:
  - 내가 은총을 베풀 사람에게 은총을 베풀고, 내가 불쌍히 여길 사람에게 불쌍히 여기겠다
  - 내가 은혜를 베풀 자에게 은혜를 베풀고, 내가 자비를 베풀 자에게 자비를 베풀겠다
  lexicon: HALOT
  rationale: 히브리어의 반복 구조를 한국어에서도 최대한 그대로 살려, ‘은혜/긍휼’을 각각 반복해 하나님의 주권적 자기진술의 힘을 유지했습니다.
theological_decisions:
- issue: 하나님의 주권적 은혜와 긍휼의 반복 진술
  chosen_reading: 반복 구조를 유지해, 하나님이 누구에게 은혜와 긍휼을 베푸실지에 대한 주권적 자유를 평이하게 풀어쓰지 않았습니다.
  alternative_readings:
  - 은혜와 긍휼을 일반적 성품 설명으로 완화하는 번역
  - 후대 교리 용어로 미리 체계화하는 번역
  rationale: 원문은 같은 어근의 반복으로 긴장을 의도하며, 번역이 그 긴장을 해소하면 본문의 직접성이 약해집니다.
  doctrine_reference: 본문의 신학적 긴장을 보존
