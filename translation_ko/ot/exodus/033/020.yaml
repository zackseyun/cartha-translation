translation:
  language: ko
  text: 그러나 그가 말씀하셨습니다. “너는 내 얼굴[a]을 볼 수 없습니다. 사람[b]은 나를 보고 살아 있을 수 없기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 얼굴’입니다. 여기서는 ‘내 임재’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘사람’은 특정 개인이 아니라 인간 일반을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But he said
  chosen_korean: 그러나 그가 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 말씀하셨습니다
  - 그가 말씀하셨습니다
  lexicon: WLC; POB audit trail
  rationale: 이어지는 대화 맥락에서 대비를 살리기 위해 역접을 두었고, 직접 화법의 도입은 자연스러운 현대 문체로 옮겼습니다.
- source_word: אֶת פָּנָי
  english_pob_choice: my face
  chosen_korean: 내 얼굴
  alternatives_korean:
  - 내 얼굴
  - 내 حضور
  - 내 임재
  lexicon: WLC; HALOT
  rationale: פָּנִים의 기본적이고 구체적인 의미를 살려 ‘얼굴’로 옮겼습니다. ‘임재’는 해석을 앞세우므로 본문에는 두지 않았습니다.
- source_word: לֹא יִרְאַנִי הָאָדָם
  english_pob_choice: man shall not see me
  chosen_korean: 사람은 나를 보고서
  alternatives_korean:
  - 사람은 나를 보지 못하고
  - 사람은 나를 볼 수 없고
  lexicon: WLC; HALOT
  rationale: הָאָדָם의 일반적 인간성을 한국어의 ‘사람’으로 자연스럽게 살렸고, generic singular의 의미를 유지했습니다.
- source_word: וָחָי
  english_pob_choice: and live
  chosen_korean: 살아 있을 수 없습니다
  alternatives_korean:
  - 살 수 없습니다
  - 살아남을 수 없습니다
  lexicon: WLC; HALOT
  rationale: 단순 생존이 아니라 ‘보고도 계속 살아 있음’의 불가능성을 분명히 하기 위해 결과 의미를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 ‘얼굴’이라는 인격적·의인화 표현
  chosen_reading: 본문의 구체적 표현을 유지하여 ‘내 얼굴’로 번역했습니다.
  alternative_readings:
  - 내 임재
  rationale: 히브리어의 직접적 의인화와 인식의 긴장을 완화하지 않고 드러내는 것이 원문의 힘을 보존합니다.
  doctrine_reference: Translation philosophy; anthropomorphic language in source
- issue: הָאָדָם의 일반화된 인간성
  chosen_reading: ‘사람’으로 옮겨 일반적 인간 전체를 가리키는 뜻을 유지했습니다.
  alternative_readings:
  - 인간은
  rationale: 문법상 단수형이지만 보편적 진술이므로, 한국어에서도 집합적 의미가 자연스럽게 전달되도록 했습니다.
  doctrine_reference: Translation philosophy; generic singular
