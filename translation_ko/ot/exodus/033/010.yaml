base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
  footnotes:
  - marker: a
    text: Or 'bowed down' or 'prostrated themselves'; the Hebrew verb refers to a bodily act of reverence and often functions as an act of worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 백성이 구름 기둥이 회막의 입구에 서 있는 것을 보면, 온 백성이 일어나 각기 자기 장막의 입구에서 절하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘절하였다’, ‘엎드려 절하였다’. 히브리어 동사는 몸으로 경의를 표하는 행위를 가리키며, 흔히 예배의 행위로 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּד הֶעָנָן
  english_pob_choice: the pillar of cloud
  chosen_korean: 구름 기둥
  alternatives_korean:
  - 구름의 기둥
  - 구름기둥
  lexicon: HALOT
  rationale: 히브리어의 구체적 상징 이미지를 그대로 살리되, 한국어에서는 자연스럽고 익숙한 합성명사로 옮겼습니다.
- source_word: פֶּתַח הָאֹהֶל
  english_pob_choice: at the entrance of the tent
  chosen_korean: 회막의 입구
  alternatives_korean:
  - 장막의 입구
  - 텐트의 입구
  lexicon: HALOT
  rationale: 문맥상 단순한 천막이 아니라 회막을 가리키므로, 본문에 명시되지 않은 설명을 과하게 늘리지 않으면서도 문맥적 대상을 분명히 했습니다.
- source_word: וְהִשְׁתַּחֲוּוּ
  english_pob_choice: worshiped
  chosen_korean: 절하였습니다
  alternatives_korean:
  - 경배하였습니다
  - 엎드려 경배하였습니다
  - 예배하였습니다
  lexicon: HALOT
  rationale: 이 동사는 몸을 굽혀 경의를 표하는 행위를 가리키므로, 예배의 의미를 완전히 밀어버리지 않으면서도 물리적 자세를 드러내는 표현을 택했습니다.
- source_word: אִישׁ פֶּתַח אָהֳלוֹ
  english_pob_choice: each man at the entrance of his tent
  chosen_korean: 각기 자기 장막의 입구에서
  alternatives_korean:
  - 각 사람은 자기 장막의 입구에서
  - 각자 자기 장막 문 앞에서
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 살리되, 현대 한국어에서 자연스럽게 읽히도록 정리했습니다.
theological_decisions:
- issue: וְהִשְׁתַּחֲוּוּ의 번역이 단순한 자세인지 예배 행위인지
  chosen_reading: 절하였습니다
  alternative_readings:
  - 경배하였습니다
  - 엎드려 경배하였습니다
  rationale: 이 문맥에서는 야훼의 임재를 나타내는 구름 기둥 앞에서의 반응이므로 예배적 의미가 분명하지만, 동작 자체의 육체성을 유지하기 위해 '절하다'를 본문에 두고, 예배 의미는 문맥 전체가 지지하도록 했습니다.
  doctrine_reference: Translation philosophy §3, §6
