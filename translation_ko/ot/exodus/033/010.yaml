translation:
  language: ko
  text: 온 백성이 구름 기둥이 그 장막의 입구에 서 있는 것을 보았을 때, 온 백성이 일어나 각기 자기 장막의 입구에서 절하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸을 굽혀 절하였습니다’, ‘엎드려 절하였습니다’. 히브리어 동사는 몸으로 경의를 표하는 행위를 가리키며, 흔히 예배의 행위로 기능합니다.
    reason: lexical_alternative
