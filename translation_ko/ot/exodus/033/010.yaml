- from: 온 백성이 구름 기둥이 회막의 입구에 서 있는 것을 보면, 온 백성이 일어나 각기 자기 장막의 입구에서 절하였습니다.[a]
  to: 온 백성이 구름 기둥이 그 장막의 입구에 서 있는 것을 보았을 때, 온 백성이 일어나 각기 자기 장막의 입구에서 절하였습니다.[a]
  rationale: 서사 시제를 ‘보았을 때’로 고쳐 원문의 시간 관계를 반영하고, 본절에 직접 나타난 명칭 수준에 맞춰 ‘회막’을 ‘그 장막’으로 바꾸었습니다. 각주는 본문과 중복되는 대안을 제거하고, הִשְׁתַּחֲווּ의 신체적 경의 동작이라는 어휘적 범위를 보존하도록 수정했습니다.
