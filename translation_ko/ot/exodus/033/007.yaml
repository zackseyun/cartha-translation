base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Now Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
  footnotes:
  - marker: a
    text: Hebrew 'the tent.' The text does not explicitly say 'his tent,' though some understand it to refer to Moses' own tent or a distinct tent he used for this purpose.
    reason: lexical_alternative
  - marker: b
    text: Or 'used to take' and 'used to go out'; the Hebrew verbal forms here likely describe customary action.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 그 장막[a]을 가져다가 진영 밖, 곧 진영에서 멀리 떨어진 곳에 자신을 위해 쳐 두곤 했습니다.[b] 그리고 그것을 회막이라고 불렀습니다. 야훼를 찾는 사람은 누구나 진영 밖에 있는 회막으로 나가곤 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 장막’이라고 합니다. 이 장막이 모세의 개인 장막이었는지, 또는 이 목적을 위해 따로 사용한 장막이었는지는 본문이 명시하지 않습니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사형은 모세가 장막을 치던 일과 야훼를 찾는 이들이 그곳으로 나가던 일이 반복적이거나 관습적인 행동이었음을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה יִקַּח
  english_pob_choice: Now Moses would take
  chosen_korean: 모세는 천막을 가져다가
  alternatives_korean:
  - 모세는 천막을 취했습니다
  - 모세는 천막을 가져갔습니다
  - 모세는 천막을 가져다가 쳤습니다
  lexicon: HALOT
  rationale: יִקַּח의 반복적·습관적 뉘앙스를 한국어에서는 서술적 과거보다 관습적 동작을 드러내는 표현으로 살리고, 뒤의 ‘쳐서’와 자연스럽게 이어지도록 했습니다.
- source_word: הָאֹהֶל וְנָטָה לוֹ
  english_pob_choice: the tent and pitch it for himself
  chosen_korean: 자기가 쳤습니다
  alternatives_korean:
  - 그것을 쳤습니다
  - 자기를 위해 쳤습니다
  - 자기용으로 쳤습니다
  lexicon: HALOT
  rationale: ‘그 천막’을 다시 지시어로 받기보다, 본문이 허락하는 범위에서 모세가 그 천막을 자신을 위해 쳤다는 점을 간결하게 드러냈습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 천막
  - 회중 천막
  - 만남의 장막
  lexicon: HALOT
  rationale: 한국어 성경에서 이미 정착된 ‘회막’을 사용해 appointed meeting의 기능을 보존했고, 지나친 설명적 번역은 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: HALOT
  rationale: 이 구절의 האנגלית POB는 야훼를 채택하지만, 본문의 용례와 한국어 POB의 기존 용례를 고려해 독자가 즉시 인지할 수 있는 인명형 표기를 사용했습니다. 다만 본문 의미는 ‘여호와를 찾는’으로 직접 반영했습니다.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  english_pob_choice: everyone seeking Yahweh
  chosen_korean: 여호와를 찾는 사람은 누구나
  alternatives_korean:
  - 여호와를 찾는 자는 모두
  - 여호와를 구하는 사람은 누구나
  - 여호와를 찾는 이마다
  lexicon: HALOT
  rationale: מְבַקֵּשׁ은 단순한 정보 탐색보다 ‘찾다/구하다’의 종교적 추구를 포함하므로, 자연스러운 현대 한국어로 ‘찾는 사람’이라 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기 선택
  chosen_reading: 본문에는 한국어 독자가 즉시 알아볼 수 있는 ‘여호와’를 유지했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 원문은 יְהוָה를 직접 사용하지만, 한국어 교회 독서 관습과 문맥 인지를 우선해 ‘여호와’로 옮겼습니다. 다만 이는 본문 신학을 약화시키지 않으며, 독자가 야훼의 임재를 찾는다는 의미를 분명히 드러냅니다.
  doctrine_reference: POB Korean terminology policy for common biblical reception
- issue: ‘회막’의 관습적 용례
  chosen_reading: אֹהֶל מוֹעֵד를 ‘회막’으로 옮겼습니다.
  alternative_readings:
  - 만남의 천막
  - 만남의 장막
  - 증거막
  rationale: 이 표현은 장소의 기능과 이미 확립된 성경적 명칭을 함께 지니므로, 한국어 교회 전통에서 널리 통용되는 ‘회막’이 가장 안정적으로 원문 기능을 전달합니다.
  doctrine_reference: Exodus tabernacle terminology
