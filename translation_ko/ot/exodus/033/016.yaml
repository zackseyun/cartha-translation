  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
  footnotes:
  - marker: a
    text: Or 'set apart' or 'made distinct.' The Hebrew verb can convey being marked out as extraordinary or separate from others.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 어떻게 알겠습니까? 곧 내가 주님의 눈에 은총을 입었고 나와 주님의 백성이 그러하다는 것을 말입니다. 주님께서 우리와 함께 가시지 않으면 어떻게 나와 주님의 백성이 지면 위의 모든 백성과 구별되겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구별되다’, ‘별도로 세워지다’로 옮길 수 있습니다. 히브리어 동사는 다른 이들과 두드러지게 구분되거나 따로 떼어 놓인 상태를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה יִוָּדַע אֵפוֹא
  english_pob_choice: For how then will it be known
  chosen_korean: 그러면 어떻게 알겠습니까?
  alternatives_korean:
  - 그렇다면 어떻게 알려지겠습니까?
  - 그때 어떻게 알 수 있겠습니까?
  lexicon: HALOT
  rationale: 반문 구조와 추론의 연결을 자연스러운 합쇼체로 옮기되, ‘알려지다’보다 문맥상 더 직접적인 ‘알다/알리다’ 계열을 피하고 수동적 의미를 살렸습니다.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  english_pob_choice: that I have found favor in your sight
  chosen_korean: 내가 주님의 눈에 은총을 입었고
  alternatives_korean:
  - 내가 주님의 눈에 은총을 얻었고
  - 내가 주님의 눈에 호의를 얻었고
  lexicon: HALOT
  rationale: 히브리어 관용구를 ‘은총을 입다’로 옮겨 관계적 호의의 의미를 살렸고, ‘주님의 눈에’는 직역에 가까운 표현으로 보존했습니다.
- source_word: וְנִפְלֵינוּ
  english_pob_choice: so that I and your people are distinguished
  chosen_korean: 구별되겠습니까
  alternatives_korean:
  - 분별되겠습니까
  - 따로 세워지겠습니까
  - 특별하게 되겠습니까
  lexicon: HALOT
  rationale: פלא의 니팔이 여기서는 ‘특별히 구별됨’의 의미이므로, ‘구별되다’가 영어 POB의 ‘distinguished’를 가장 간결하게 반영합니다.
- source_word: עִמָּנוּ
  english_pob_choice: by your going with us
  chosen_korean: 주님께서 우리와 함께 가시지 않으면
  alternatives_korean:
  - 주님께서 우리와 동행하지 않으면
  - 주님께서 우리와 같이 가지 않으면
  lexicon: HALOT
  rationale: 수단/조건의 관계를 한국어에서는 부정 조건절로 자연스럽게 풀어, 하나님의 동행이 표식이 된다는 논리를 분명히 했습니다.
theological_decisions:
- issue: ‘주님의 눈’과 야훼 호칭의 처리
  chosen_reading: 본문의 κύριος/야훼 호칭을 합쇼체 존칭 ‘주님’으로 옮기고, ‘눈에 은총을 입다’는 언약적 호의의 표현으로 유지했습니다.
  alternative_readings:
  - 하나님의 눈에 은혜를 입었다
  - 주님의 보기에 호의를 얻었다
  rationale: 출애굽기 맥락에서 신학적으로 중요한 것은 모세의 개인적 호감이 아니라 언약 백성에 대한 하나님의 호의이므로, 관용구를 너무 평범한 심리적 표현으로 낮추지 않았습니다.
  doctrine_reference: 언약적 은총과 하나님의 임재가 백성의 정체성을 규정함
