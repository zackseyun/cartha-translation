revisions:
- from: 야훼께서 모세와 얼굴을 마주하여 말씀하셨습니다[a] — 사람이 자기 친구에게 말하듯이 말입니다. 그러고 나서 모세는 진영으로 돌아갔습니다. 그러나 그의 종이자, 눈의 아들 여호수아인 젊은이는 회막 한가운데를 떠나지 않았습니다[b].
  to: 야훼께서는 모세와 얼굴을 마주하고 말씀하시곤 하셨습니다[a]. 사람이 자기 친구에게 말하듯이 말씀하신 것입니다. 그 뒤에 모세는 진영으로 돌아가곤 했습니다. 그러나 모세의 수행원인 눈의 아들 여호수아는 젊은이였는데, 회막 안을 떠나지 않았습니다[b].
  rationale: 관습적 서술을 반영하고, 여호수아의 역할을 자연스럽고 비과도적으로 옮겼으며, ‘장막 안에서 떠나지 않음’이라는 공간 표현을 바로잡았습니다. ‘얼굴을 마주하고’라는 관용구는 유지하여 직접적 만남이라는 원문의 긴장을 해소하지 않았습니다.
