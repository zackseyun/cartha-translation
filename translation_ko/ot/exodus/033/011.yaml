source:
  edition: WLC
  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
  footnotes:
  - marker: a
    text: Or 'directly' / 'personally.' The Hebrew idiom 'face to face' expresses unusually direct encounter.
    reason: lexical_alternative
  - marker: b
    text: That is, the tent of meeting.
    reason: cross_reference
translation:
  language: ko
  text: 야훼께서는 모세와 얼굴을 마주하고 말씀하시곤 하셨습니다[a]. 사람이 자기 친구에게 말하듯이 말씀하신 것입니다. 그 뒤에 모세는 진영으로 돌아가곤 했습니다. 그러나 모세의 수행원인 눈의 아들 여호수아는 젊은이였는데, 회막 안을 떠나지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘직접적으로’ 또는 ‘개인적으로’. 히브리어 관용구 ‘얼굴을 마주하고’는 매우 직접적인 만남을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘장막’이며, 문맥상 회막을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와라는 교회 전통형 대신 신명사 ליהוה의 음역인 야훼를 유지해, 본문의 고유한 신적 이름을 드러냈습니다.
- source_word: פָּנִים אֶל פָּנִים
  english_pob_choice: face to face
  chosen_korean: 얼굴을 마주하여
  alternatives_korean:
  - 직접
  - 친밀하게
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되, 한국어에서는 자연스러운 표현인 ‘얼굴을 마주하여’로 옮겨 직접적이고 친밀한 만남의 뉘앙스를 보존했습니다.
- source_word: וּ/מְשָׁרְתּוֹ
  english_pob_choice: his attendant
  chosen_korean: 그의 종이자
  alternatives_korean:
  - 그의 시종인
  - 그의 수행자인
  lexicon: HALOT
  rationale: מְשָׁרֵת는 단순한 동행보다 섬기는 역할을 나타내므로, 여기서는 관계를 드러내는 ‘종’과 설명적 연결어를 사용해 문맥을 살렸습니다.
- source_word: נַעַר
  english_pob_choice: a young man
  chosen_korean: 젊은이
  alternatives_korean:
  - 소년
  - 젊은 사람
  lexicon: HALOT
  rationale: 여호수아의 연령 감각을 살리면서도 현대 한국어에서 자연스러운 표현인 ‘젊은이’를 택해, 단순한 미성숙의 뉘앙스로 좁히지 않았습니다.
- source_word: מִ/תּ֥וֹךְ הָ/אֹהֶל
  english_pob_choice: from the midst of the tent
  chosen_korean: 회막 한가운데를
  alternatives_korean:
  - 장막 한가운데를
  - 회막 안에서
  lexicon: HALOT
  rationale: ‘회막’은 본문 맥락상 회중의 장막인 회막을 가리키므로 그 의미를 밝혔고, מִתּוֹךְ의 ‘가운데’ 이미지를 살려 문장을 구성했습니다.
theological_decisions:
- issue: 야훼께서 모세와 ‘얼굴을 마주하여’ 말씀하신다는 표현의 직역 유지
  chosen_reading: 직접적이고 인격적인 계시의 긴장을 풀어버리지 않고, 본문의 관용구를 보존했습니다.
  alternative_readings:
  - ‘직접적으로’
  - ‘개인적으로’
  rationale: 본문은 하나님의 임재와 계시의 친밀함을 강조하면서도, 다른 본문들과의 긴장을 즉시 해소하지 않습니다. 따라서 의미를 평탄화하기보다 원문 관용을 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
