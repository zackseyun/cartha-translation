  terminology: אָהֶל은 이 절에서 단순히 ‘장막’이므로 ‘회막’으로 확대하지 않고 ‘그 장막’으로 옮기는 것이 적절합니다. עַמּוּד הֶעָנָן은 ‘구름기둥’으로 유지합니다. 신적 발화에는 현대 한국어의 존중 표현인 ‘말씀하셨습니다’를 사용하되, 본문에서는 이름을 보충하지 않습니다.
