id: EXO.33.9
reference: Exodus 33:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'and the LORD would speak with Moses.' The Hebrew leaves the subject implicit in this clause, though the context identifies it as the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 모세가 그 tent에 들어갈 때마다 구름기둥이 내려와 tent 입구에 서고, 그가 모세와 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 분명하게는 ‘야훼께서 모세와 말씀하셨습니다’로 옮길 수 있습니다. 히브리어는 이 절의 주어를 생략하지만, 문맥은 그것이 야훼임을 보여 줍니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  english_pob_choice: And whenever ... entered
  chosen_korean: 모세가 ... 들어갈 때마다
  alternatives_korean:
  - 모세가 ... 들어가면
  - 모세가 ... 들어갈 때
  lexicon: HALOT
  rationale: 반복되는 상황을 나타내는 זמן 절을 한국어에서 자연스럽게 반복성 있는 '-ㄹ 때마다'로 옮겨, 서술의 습관적 의미를 살렸습니다.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  english_pob_choice: the tent
  chosen_korean: 그 tent
  alternatives_korean:
  - 그 장막
  - 회막
  lexicon: HALOT
  rationale: 본문은 더 긴 관용명칭이 아니라 단순히 'the tent'라고 하므로, 문맥상 알려진 그 tent를 가리키되 본문 수준의 단순성을 유지했습니다.
- source_word: עַמּוּד הֶעָנָן
  english_pob_choice: the pillar of cloud
  chosen_korean: 구름기둥
  alternatives_korean:
  - 구름의 기둥
  - 구름기둥이
  lexicon: HALOT
  rationale: 히브리어의 결합명사 이미지를 한국어에서도 압축적으로 살려 '구름기둥'으로 옮겼습니다.
- source_word: וְדִבֶּר עִם מֹשֶׁה
  english_pob_choice: and he would speak with Moses
  chosen_korean: 그가 모세와 말씀하셨습니다
  alternatives_korean:
  - 야훼께서 모세와 말씀하셨습니다
  - 그가 모세에게 말씀하셨습니다
  lexicon: HALOT
  rationale: 히브리어는 주어를 명시하지 않으므로, 문맥상 야훼를 지시하는 암시를 유지하기 위해 주어를 과도하게 명시하지 않고 한국어에서도 존댓말 동사로 신적 발화를 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 생략된 주어 처리
  chosen_reading: 문맥상 야훼를 가리키는 것으로 이해되지만, 본문 자체의 무명시성을 해치지 않도록 '그가'를 유지했습니다.
  alternative_readings:
  - 야훼께서 모세와 말씀하셨습니다
  - 구름기둥이 모세와 말했습니다
  rationale: 히브리어는 이 절에서 주어를 드러내지 않으므로, 번역도 그 긴장을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 원문의 암시와 문맥적 해석을 함께 보존합니다.
