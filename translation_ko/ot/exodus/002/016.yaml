    issue: ‘물통들’은 רְהָטִים의 의미에 비해 지나치게 일반적입니다.
    rationale: 이 말은 가축에게 물을 먹이기 위한 구유 또는 급수 수조를 가리키므로 ‘물구유들’이 문맥에 더 충실합니다.
