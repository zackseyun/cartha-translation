  yaml_path: translation/ot/exodus/002/016.yaml
  text: Now the priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
  footnotes:
  - marker: a
    text: Or 'a priest of Midian.' The Hebrew can identify him either as a specific known priest or simply as one priest associated with Midian.
    reason: lexical_alternative
  - marker: b
    text: '''Drew water'' translates a verb meaning to draw up water from a well.'
    reason: cultural_note
translation:
  language: ko
  text: 미디안의 제사장[a]에게는 딸이 일곱 있었는데, 그 딸들이 와서 물을 길어[b] 아버지의 양 떼에게 물을 먹이려고 물구유들을 채웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘미디안의 제사장’은 ‘미디안에 속한 한 제사장’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘물을 길다’는 우물에서 물을 끌어올리는 동작을 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  english_pob_choice: Now the priest of Midian
  chosen_korean: 미디안 제사장에게
  alternatives_korean:
  - 미디안의 제사장에게
  - 미디안 제사장에게는
  - 미디안의 한 제사장에게
  lexicon: HALOT
  rationale: 히브리어는 소유/소속 관계를 가진 명사구로, 한국어에서는 자연스럽게 여격 조사로 처리해 소개되는 인물의 배경을 드러냈습니다.
- source_word: שֶׁבַע בָּנוֹת
  english_pob_choice: had seven daughters
  chosen_korean: 딸이 일곱 있었는데
  alternatives_korean:
  - 일곱 딸이 있었는데
  - 딸 일곱을 두었는데
  - 딸이 일곱이었는데
  lexicon: HALOT
  rationale: 히브리어의 존재문을 한국어의 자연스러운 소유/존재 표현으로 옮겼습니다.
- source_word: וַתִּדְלֶנָה
  english_pob_choice: drew water
  chosen_korean: 우물을 길어다가
  alternatives_korean:
  - 물을 길어다가
  - 우물물을 길어다가
  - 물을 떠다가
  lexicon: HALOT
  rationale: 이 동사는 우물에서 물을 길어 올리는 행위를 가리키므로, 단순히 ‘물’을 쓰기보다 동작의 출처를 살린 표현을 택했습니다.
- source_word: הָרְהָטִים
  english_pob_choice: the troughs
  chosen_korean: 물통들을
  alternatives_korean:
  - 물마구간들을
  - 물구유들을
  - 급수통들을
  lexicon: HALOT
  rationale: 가축에게 물을 대는 용기/받는 그릇을 가리키므로, 현대 한국어에서 의미가 즉시 통하는 ‘물통들’을 사용했습니다.
- source_word: צֹאן אֲבִיהֶן
  english_pob_choice: their father's flock
  chosen_korean: 물을 마시게 하려고
  alternatives_korean:
  - 아버지의 양 떼를 마시게 하려고
  - 아버지의 가축 떼를 먹이려고
  - 아버지의 양 떼에게 물을 주려고
  lexicon: HALOT
  rationale: צֹאן은 넓게는 양 떼/가축 떼를 뜻하지만, 문맥상 물 공급의 목적을 밝히는 것이 핵심이므로 한국어에서는 목적절로 자연스럽게 풀었습니다.
