  - severity: high
    issue: ‘물을 마시게 하려고’가 ‘아버지의 가축 떼’를 누락합니다.
    rationale: לְהַשְׁקוֹת צֹאן אֲבִיהֶן은 아버지의 양 떼/가축 떼에게 물을 먹이는 목적을 명시합니다.
