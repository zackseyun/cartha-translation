  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽게 연결되며, ‘물구유’는 문맥상 가축에게 물을 먹이는 시설임을 분명히 합니다.
  terminology: כֹּהֵן은 ‘제사장’, רְהָטִים은 ‘물구유’, צֹאן은 문맥상 ‘양 떼’로 옮겼습니다. 관사의 확정성/비확정성 가능성은 각주에서 보존합니다.
