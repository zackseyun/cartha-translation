revisions:
- from: 이처럼 오랜 세월이 지난 뒤에 이집트 왕이 죽자, 이스라엘 자손은 노역 때문에 신음하며 부르짖었고, 그들의 구원의 외침이 노역 때문에 하나님께 올라갔습니다.[a]
  to: 그 오랜 날들 동안에[a] 이집트 왕이 죽었습니다. 이스라엘 자손은 그 노역 때문에 신음하며 부르짖었고, 그들의 도움을 구하는 부르짖음이 그 노역 때문에 하나님께 올라갔습니다.
  rationale: 시간 표현을 원문의 기간적 의미에 맞게 바로잡고, 도움을 청하는 외침이라는 שַׁוְעָה의 의미를 더 직접적으로 반영했습니다. ‘노역’의 반복은 히브리어의 반복과 고통의 원인을 보존합니다.
