  yaml_path: translation/ot/exodus/002/023.yaml
  text: Now it happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
  footnotes:
  - marker: a
    text: Or 'during those many days' or more interpretively 'after many days.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel'; this refers collectively to the people of Israel.
    reason: lexical_alternative
  - marker: c
    text: Or 'because of the labor' or 'because of the bondage'; the Hebrew term refers here to oppressive forced labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 이처럼 오랜 세월이 지난 뒤에 이집트 왕이 죽자, 이스라엘 자손은 노역 때문에 신음하며 부르짖었고, 그들의 구원의 외침이 노역 때문에 하나님께 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그 많은 날들에’이며, 문맥상 오랜 기간의 경과를 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: בַּיָּמִים הָרַבִּים הָהֵם
  english_pob_choice: in those many days
  chosen_korean: 이처럼 오랜 세월이 지난 뒤에
  alternatives_korean:
  - 그 많은 날들 동안
  - 그 많은 날들에
  lexicon: HALOT
  rationale: 히브리어의 긴 시간 경과를 자연스러운 현대 한국어로 옮기되, 단순한 시점보다 장기간의 흐름을 드러내기 위해 이렇게 처리했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어 표현을 비교적 투명하게 살리면서도 한국어 성경에서 널리 이해되는 집합 명칭으로 옮겼습니다.
- source_word: מִן הָעֲבֹדָה
  english_pob_choice: because of the slavery
  chosen_korean: 노역 때문에
  alternatives_korean:
  - 노동 때문에
  - 강제노동 때문에
  - 종살이 때문에
  lexicon: HALOT
  rationale: 이 문맥의 עֲבֹדָה는 중립적 '일'이 아니라 이집트의 억압적 강제노동을 가리키므로, 그 성격을 드러내는 '노역'을 선택했습니다.
- source_word: וַתַּעַל שַׁוְעָתָם אֶל הָאֱלֹהִים
  english_pob_choice: their cry for help went up to God
  chosen_korean: 그들의 구원의 외침이 하나님께 올라갔습니다
  alternatives_korean:
  - 그들의 부르짖음이 하나님께 올라갔습니다
  - 그들의 도움 요청이 하나님께 올라갔습니다
  lexicon: HALOT
  rationale: שַׁוְעָה는 단순한 소리가 아니라 도움을 구하는 외침이므로 '구원의 외침'으로 옮겼고, '올라갔습니다'로 히브리어의 상향 이미지를 살렸습니다.
theological_decisions:
- issue: עֲבֹדָה의 성격
  chosen_reading: 노역으로 이해하여 억압적 강제노동의 의미를 드러냈습니다.
  alternative_readings:
  - 노동으로 완화해 옮김
  - 봉사/섬김으로 옮김
  rationale: 출애굽기의 문맥은 이스라엘의 고통받는 예속 상태를 말하므로, 의미를 약화하지 않고 사회적 억압을 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §5
