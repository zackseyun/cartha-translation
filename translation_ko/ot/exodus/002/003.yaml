base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
  footnotes:
  - marker: a
    text: Or 'a papyrus ark.' The Hebrew word tebah is the same word used for Noah's ark in Genesis, preserving a literary echo of deliverance through water.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 더는 그를 숨길 수 없게 되자, 그를 위해 골풀로 상자를 하나 가져다가 역청과 송진을 발랐습니다. 그리고 그 아이를 그 안에 넣고, 나일 강 가의 물풀 사이에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파피루스 상자’. 히브리어 תֵּבָה는 창세기에서 노아의 방주에 쓰인 같은 단어로, 물을 통한 구원의 문학적 공명을 남깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלָה עוֹד הַצְּפִינוֹ
  english_pob_choice: could no longer hide him
  chosen_korean: 더는 그를 숨길 수 없게 되자
  alternatives_korean:
  - 이제 더는 그를 숨길 수 없어서
  - 더 이상 그를 감출 수 없게 되자
  lexicon: HALOT
  rationale: 능력의 한계에 이른 뉘앙스를 자연스럽게 살리되, 단순한 의지 부족처럼 보이지 않도록 했습니다.
- source_word: תֵּבַת גֹּמֶא
  english_pob_choice: a papyrus basket
  chosen_korean: 골풀로 상자 하나
  alternatives_korean:
  - 파피루스 상자 하나
  - 파피루스 갈대상자 하나
  - 상자 하나
  lexicon: HALOT
  rationale: tebah의 용기 의미를 살리면서도 한국어에서는 ‘상자’가 가장 과장되지 않고 읽히며, gōmeʾ는 ‘골풀’로 옮겨 이집트적 수생식물 재료를 드러냈습니다.
- source_word: וַתַּחְמְרָה בַחֵמָר וּבַזָּפֶת
  english_pob_choice: coated it with bitumen and pitch
  chosen_korean: 역청과 송진을 발랐습니다
  alternatives_korean:
  - 역청과 피치를 발랐습니다
  - 아스팔트와 송진으로 덮었습니다
  - 역청과 타르를 칠했습니다
  lexicon: HALOT
  rationale: חֵמָר는 역청/비투멘 계열의 방수 물질, זָפֶת은 송진성 피복재에 해당하므로 한국어에서 가장 의미가 선명한 짝으로 옮겼습니다.
- source_word: הַיֶּלֶד
  english_pob_choice: the child
  chosen_korean: 그 아이
  alternatives_korean:
  - 그 어린아이
  - 그 아기
  - 그 아이
  lexicon: HALOT
  rationale: 히브리어 יֶלֶד의 넓은 의미를 따라 나이를 과도하게 특정하지 않는 ‘아이’로 옮겼습니다.
- source_word: בַּסּוּף עַל שְׂפַת הַיְאֹר
  english_pob_choice: among the reeds by the bank of the Nile
  chosen_korean: 나일 강 가의 물풀 사이에
  alternatives_korean:
  - 나일 강가의 갈대 사이에
  - 나일 강 둑의 갈대 사이에
  - 나일 강 가의 갈대 사이에
  lexicon: HALOT
  rationale: סוּף는 일반적인 ‘갈대’보다 넓게 물가 식물을 가리킬 수 있어, 장면의 자연성을 살리면서도 식물군을 포괄하는 ‘물풀’로 옮겼습니다.
theological_decisions:
- issue: תֵּבָה의 문학적 공명(노아의 방주와의 연결)
  chosen_reading: 본문은 ‘상자’로 직역하되, 노아의 תֵּבָה와의 어휘적 공명은 본문 주석이 아니라면 본문에서 과장하지 않았습니다.
  alternative_readings:
  - ‘방주’
  - ‘아크/상자’의 혼합 표현
  rationale: 출애굽기 문맥에서는 유아를 위한 소형 용기라는 즉시적 의미가 우선이므로, 인물 구원 모티프의 공명은 숨기지 않되 한국어 본문에서는 과도한 승화 표현을 피했습니다.
  doctrine_reference: 문학적 상호본문성
