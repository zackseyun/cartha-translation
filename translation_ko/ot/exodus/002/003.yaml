theological_decisions:
- issue: תֵּבָה의 문학적 공명(노아의 방주와의 연결)
  chosen_reading: 본문은 ‘상자’로 직역하되, 노아의 תֵּבָה와의 어휘적 공명은 본문 주석이 아니라면 본문에서 과장하지 않았습니다.
  alternative_readings:
  - ‘방주’
  - ‘아크/상자’의 혼합 표현
  rationale: 출애굽기 문맥에서는 유아를 위한 소형 용기라는 즉시적 의미가 우선이므로, 인물 구원 모티프의 공명은 숨기지 않되 한국어 본문에서는 과도한 승화 표현을 피했습니다.
  doctrine_reference: 문학적 상호본문성
