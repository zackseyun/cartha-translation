base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
  footnotes:
  - marker: a
    text: Or 'a papyrus ark.' The Hebrew word tebah is the same word used for Noah's ark in Genesis, preserving a literary echo of deliverance through water.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 더는 그를 숨길 수 없게 되자, 그를 위해 파피루스로 상자 하나를 가져다가 역청과 송진을 발랐습니다. 그리고 그 아이를 그 안에 넣고 나일강 둑의 갈대 사이에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파피루스 방주’. 히브리어 תֵּבָה는 창세기에서 노아의 방주에 쓰인 것과 같은 단어이며, 물을 통한 구원이라는 문학적 공명을 보존합니다.
    reason: lexical_alternative
