revisions:
- from: 그 아이가 자라서 바로의 딸에게로 갔고, 그는 그녀의 아들이 되었습니다. 그녀가 그의 이름을 모세라 하였으니, “내가 물에서 그를 건져 냈기 때문입니다”라고 하였기 때문입니다.[a][b]
