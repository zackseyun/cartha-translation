  text: וַ/יִגְדַּ֣ל הַ/יֶּ֗לֶד וַ/תְּבִאֵ֨/הוּ֙ לְ/בַת פַּרְעֹ֔ה וַֽ/יְהִי לָ֖/הּ לְ/בֵ֑ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ מֹשֶׁ֔ה וַ/תֹּ֕אמֶר כִּ֥י מִן הַ/מַּ֖יִם מְשִׁיתִֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
  footnotes:
  - marker: a
    text: Or, “he became a son to her” or “he was as a son to her.”
    reason: lexical_alternative
  - marker: b
    text: The name Moses sounds like the Hebrew expression “I drew him out.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 아이가 자라자, 그의 어머니는 그를 바로의 딸에게 데려갔고, 그는 그녀의 아들이 되었습니다.[a] 그녀는 그의 이름을 모세라 하고,[b] “내가 물에서 그를 건져 냈기 때문이다”라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 그녀에게 아들이 되었다” 또는 “그는 그녀에게 아들처럼 되었다.”
    reason: lexical_alternative
  - marker: b
    text: ‘모세’라는 이름은 히브리어로 “내가 그를 건져 냈다”라는 표현과 말놀이를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל הַיֶּלֶד
  english_pob_choice: When the child grew
  chosen_korean: 그 아이가 자라서
  alternatives_korean:
  - 그 아이가 성장해서
  - 그 아이가 자라났고
  lexicon: HALOT
  rationale: גדל은 여기서 아이의 성장과 연령의 증가를 가리키므로, 자연스러운 서술인 “자라서”로 옮겼습니다.
- source_word: וַתְּבִאֵהוּ לְבַת פַּרְעֹה
  english_pob_choice: she brought him to Pharaoh’s daughter
  chosen_korean: 바로의 딸에게로 갔고
  alternatives_korean:
  - 그를 바로의 딸에게 데려갔고
  - 그를 바로의 딸에게로 데리고 갔고
  lexicon: HALOT
  rationale: 히필형의 기본 의미는 ‘데려오다/가져오다’이지만, 한국어에서는 앞뒤 문맥상 더 자연스러운 방향 이동 표현으로 옮겨 서술의 흐름을 살렸습니다.
- source_word: וַיְהִי לָהּ לְבֵן
  english_pob_choice: he became her son
  chosen_korean: 그는 그녀의 아들이 되었습니다
  alternatives_korean:
  - 그는 그녀에게 아들처럼 되었습니다
  - 그는 그녀에게 아들로 받아들여졌습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순 비유보다 실제적인 자녀 관계를 나타내므로, POB의 선택대로 ‘아들이 되었습니다’로 옮겼습니다.
- source_word: מֹשֶׁה
  english_pob_choice: Moses
  chosen_korean: 모세
  alternatives_korean:
  - 모세스
  lexicon: HALOT
  rationale: 통용되는 성경 인명 표기를 따랐습니다.
- source_word: מִן הַמַּיִם מְשִׁיתִהוּ
  english_pob_choice: I drew him out of the water
  chosen_korean: 내가 물에서 그를 건져 냈기 때문입니다
  alternatives_korean:
  - 내가 물에서 그를 끌어냈기 때문입니다
  - 내가 물에서 그를 건져냈기 때문입니다
  lexicon: HALOT
  rationale: משה의 어근 의미인 ‘끌어내다/건져내다’를 살리면서, 한국어에서는 구원·구출 뉘앙스가 자연스러운 “건져 냈다”를 사용했습니다.
theological_decisions:
- issue: וַיְהִי לָהּ לְבֵן의 친자/양자 관계 표현
  chosen_reading: 이 구절은 모세가 바로의 딸의 아들이 되었음을 실제 관계로 진술하지만, 입양 절차 같은 세부는 덧붙이지 않았습니다.
  alternative_readings:
  - 그녀에게 아들처럼 여겨졌다고 완화할 수 있습니다.
  - 법적 입양으로 명시할 수 있습니다.
  rationale: 본문은 아들 됨을 분명히 말하지만, 법적 제도는 설명하지 않으므로, 본문이 말하는 만큼만 강하게 번역했습니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: 이름 설명의 말장난 보존
  chosen_reading: ‘모세’라는 이름과 ‘내가 물에서 그를 건져 냈다’는 설명의 어근 연결을 한국어에서 최대한 드러냈습니다.
  alternative_readings:
  - 의미 설명을 풀어 쓰되 이름 말장난은 약화할 수 있습니다.
  rationale: 히브리어 본문은 이름 설명을 통해 의미 연결을 주므로, 번역에서도 그 연관성이 보이도록 했습니다.
  doctrine_reference: 어휘-서사적 장치 보존 원칙
