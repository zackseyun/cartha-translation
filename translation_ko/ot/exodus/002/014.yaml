translation:
  language: ko
  text: 그가 말했습니다. “누가 너를 우리 위에 한 사람, 곧 통치자와 재판관으로 세웠느냐? 네가 말하는 것이, ‘네가 이집트인을 죽인 것처럼 나도 죽이려는 것이냐?’” 모세는 두려워하며 말했습니다. “과연 그 일이 알려졌구나.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네가 이집트인을 죽인 것처럼 나를 죽이려는 것이냐?”
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 도대체 누가
  - 누구
  lexicon: HALOT
  rationale: בירור과 도전이 섞인 שאל문을 한국어 자연문으로 옮기되, 원문의 직접적인 책임 추궁을 유지하기 위해 ‘누가’를 택했습니다.
- source_word: שָׂמְךָ לְאִישׁ שַׂר וְשֹׁפֵט
  english_pob_choice: made you a ruler and a judge
  chosen_korean: 한 사람, 곧 통치자와 재판관으로 세웠느냐
  alternatives_korean:
  - 통치자와 재판관으로 삼았느냐
  - 통치자와 재판관으로 임명했느냐
  lexicon: HALOT
  rationale: שׂים의 ‘세우다/삼다/임명하다’ 의미를 살리면서, לְאִישׁ을 단순히 제거하지 않고 ‘한 사람, 곧…’으로 apposition을 반영했습니다.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  english_pob_choice: Are you saying, ‘Will you kill me’
  chosen_korean: 네가 말하는 것이, ‘네가 … 죽이려는 것이냐?’
  alternatives_korean:
  - 나를 죽일 생각이냐
  - 나를 죽이겠다는 것이냐
  lexicon: HALOT
  rationale: 질문형 구성과 ‘말하다’(אֹמֵר)의 직설성을 살리되, 한국어에서 자연스럽게 들리도록 중첩 질문 구조로 옮겼습니다.
- source_word: הָרַגְתָּ אֶת הַמִּצְרִי
  english_pob_choice: as you killed the Egyptian
  chosen_korean: 이집트인을 죽인 것처럼
  alternatives_korean:
  - 그 이집트인을 죽인 것처럼
  - 애굽인을 죽인 것처럼
  lexicon: HALOT
  rationale: אַתָּה의 비교 재현을 위해 ‘것처럼’을 사용했고, הַמִּצְרִי는 현대 한국어 독자에게 분명한 지칭이 되도록 ‘이집트인’으로 옮겼습니다.
- source_word: אָכֵן נוֹדַע הַדָּבָר
  english_pob_choice: Surely the matter has become known
  chosen_korean: 과연 그 일이 알려졌구나
  alternatives_korean:
  - 과연 그 일이 드러났구나
  - 확실히 그 일이 알려졌구나
  lexicon: HALOT
  rationale: אָכֵן의 깨달음/확인 어감을 ‘과연’으로, נוֹדַע הַדָּבָר의 드러남을 ‘알려졌구나’로 옮겨 모세의 즉각적인 인식을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 직접화법의 중첩 질문 처리
  chosen_reading: 두 겹의 질문을 한국어에서도 분리해, 첫 질문은 권위 도전으로, 둘째 질문은 살해 의도를 확인하는 말로 읽히게 했습니다.
  alternative_readings:
  - 한 문장으로 평평하게 합쳐 번역
  - 둘째 질문을 단순 서술로 완화
  rationale: 원문은 단순 정보 전달이 아니라 권위 부정과 살해 위협을 함께 드러내므로, 한국어에서도 긴장을 유지하는 구조가 필요합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2, §4
