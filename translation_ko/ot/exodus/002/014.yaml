translation:
  language: ko
  text: 그가 말했습니다. “누가 너를 우리 위에 지도자와 재판관으로 세웠습니까? 네가 그 이집트 사람을 죽인 것처럼 나를 죽이겠다는 것입니까?”[a] 모세는 두려워했습니다. 그리고 말했습니다. “분명 그 일이 알려졌습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네가 그 이집트 사람을 죽인 것처럼 나를 죽이려는 것입니까?”
    reason: 히브리어 הַלְהָרְגֵנִי אַתָּה אֹמֵר은 직역하면 ‘나를 죽이는 것을 네가 말하느냐’에 가까우며, 한국어에서는 ‘죽이겠다는 것입니까?’와 ‘죽이려는 것입니까?’ 모두 가능한 자연스러운 표현입니다.
