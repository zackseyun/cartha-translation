base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
  footnotes:
  - marker: a
    text: Or “She opened it and saw him.” The Hebrew uses a masculine singular suffix before explicitly identifying him as “the child.”
    reason: lexical_alternative
  - marker: b
    text: “Behold” renders a Hebrew particle that draws vivid attention to what she saw.
    reason: lexical_alternative
  - marker: c
    text: Or “She took pity on him.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 그것을 열어 그 아이를[a] 보았습니다. 보니[b], 한 남자아이가 울고 있었습니다. 그녀는 그를 불쌍히 여겨[c] 말했습니다. “이 아이는 히브리 사람들의 아이들 가운데 하나입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 아이를’은 히브리어의 남성 단수 대명사 목적어와 뒤따르는 ‘그 아이’라는 설명을 한국어에서 자연스럽게 합친 것입니다.
    reason: source_note
  - marker: b
    text: ‘보니’는 히브리어의 주의 환기 표현을 옮긴 것으로, 장면이 눈앞에 드러나는 생생함을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘불쌍히 여겨’는 ‘그에게 연민을 느껴’ 또는 ‘그를 가엾게 여겨’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  english_pob_choice: She opened it
  chosen_korean: 그녀는 그것을 열어
  alternatives_korean:
  - 그녀는 열고
  lexicon: HALOT
  rationale: 문맥상 상자/갈대상자를 가리키는 목적어를 한국어에 드러내면 장면의 흐름이 자연스럽고, 원문의 개방 동작을 그대로 살릴 수 있습니다.
- source_word: וַתִּרְאֵהוּ אֶת הַיֶּלֶד
  english_pob_choice: saw him, the child
  chosen_korean: 아이를 보았습니다
  alternatives_korean:
  - 그를 보았습니다, 아이를
  - 그 아이를 보았습니다
  lexicon: HALOT
  rationale: 히브리어는 대명사 목적어 뒤에 ‘그 아이’라는 동격 설명을 덧붙입니다. 한국어에서는 이를 한 번에 ‘아이를’로 풀어 읽기 쉽게 했습니다.
- source_word: וְהִנֵּה נַעַר בֹּכֶה
  english_pob_choice: and behold, a boy was crying
  chosen_korean: 보니, 한 소년이 울고 있었습니다
  alternatives_korean:
  - 그리고 보니, 한 소년이 울고 있었습니다
  - 보라, 한 소년이 울고 있었습니다
  lexicon: HALOT
  rationale: הִנֵּה의 주목 환기 효과를 ‘보니’로 옮겨, 갑작스럽게 눈앞에 드러난 장면을 자연스럽게 표현했습니다.
- source_word: וַתַּחְמֹל עָלָיו
  english_pob_choice: She had compassion on him
  chosen_korean: 그를 불쌍히 여겨
  alternatives_korean:
  - 그에게 연민을 느껴
  - 그를 가엾게 여겨
  lexicon: HALOT
  rationale: חמל עַל은 동정/연민을 뜻하므로, 전통적 교회어보다 직접적인 감정 반응을 드러내는 표현을 택했습니다.
- source_word: מִיַּלְדֵי הָעִבְרִים זֶה
  english_pob_choice: This is one of the Hebrews’ children
  chosen_korean: 이는 히브리 사람들의 자녀들 가운데 하나입니다
  alternatives_korean:
  - 이는 히브리 사람들의 자녀 중 하나입니다
  - 이는 히브리 사람들의 아이들 가운데 하나입니다
  lexicon: HALOT
  rationale: מן 구문은 부분을 나타내므로 ‘~가운데 하나’로 옮겼습니다. ‘히브리 사람들’은 민족적 표지를 그대로 살린 표현입니다.
theological_decisions:
- issue: 피난당한 아이를 향한 바로의 딸의 반응 표현
  chosen_reading: ‘불쌍히 여겨’로 옮겨, 단순한 인지보다 자비로운 감정의 움직임을 드러냈습니다.
  alternative_readings:
  - ‘가엾게 여겨’
  - ‘불쌍히 여겨서’
  rationale: 본문은 단순 관찰이 아니라 그녀의 내적 반응과 이후 행동의 동기를 보여 줍니다. 따라서 정서적·윤리적 함의를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 자비와 긍휼의 언어
