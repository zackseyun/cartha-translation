  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֶל בְּנֹתָ֖י/ו וְ/אַיּ֑/וֹ לָ֤/מָּה זֶּה֙ עֲזַבְתֶּ֣ן אֶת הָ/אִ֔ישׁ קִרְאֶ֥ן ל֖/וֹ וְ/יֹ֥אכַל לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/020.yaml
  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: ko
  text: 그가 자기 딸들에게 말했습니다. “그러면 그는 어디 있느냐? 어찌하여 너희는 그 사람을 두고 왔느냐? 그를 불러서 그가 빵을 먹게 하여라.”
  philosophy: formal
lexical_decisions:
- source_word: בְּנֹתָי/ו
  english_pob_choice: his daughters
  chosen_korean: 자기 딸들
  alternatives_korean:
  - 그의 딸들
  - 딸들
  lexicon: בַּת
  rationale: 소유대명사는 문맥상 ‘자기’로 자연스럽게 드러내되, 인물 관계를 분명히 하기 위해 ‘딸들’보다 ‘자기 딸들’로 옮겼습니다.
- source_word: וְאַיּוֹ
  english_pob_choice: Where is he then?
  chosen_korean: 그러면 그는 어디 있느냐?
  alternatives_korean:
  - 그는 어디 있느냐, 그러면?
  - 그는 대체 어디 있느냐?
  lexicon: אַיֵּה
  rationale: 질문의 초점은 ‘어디’이지만, POB의 ‘Then’에 해당하는 전후 맥락을 살려 ‘그러면’을 문두에 두었습니다.
- source_word: לָמָּה זֶּה עֲזַבְתֶּן
  english_pob_choice: Why is it that you left
  chosen_korean: 어찌하여 너희는 그 사람을 두고 왔느냐?
  alternatives_korean:
  - 왜 너희는 그 사람을 버려두었느냐?
  - 왜 너희는 그 사람을 떠나게 했느냐?
  lexicon: עָזַב
  rationale: 여기서는 단순한 ‘떠나다’보다 ‘두고 오다/버려두다’가 문맥상 더 직접적이어서, 행동의 미완결성과 사태를 드러내는 표현을 택했습니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 음식
  lexicon: לֶחֶם
  rationale: 히브리어 לֶחֶם의 기본적 일상어를 현대 한국어의 중립적 표현인 ‘빵’으로 옮겨, 원문의 구체성을 유지했습니다.
theological_decisions:
- issue: 직접화법의 명령형 뉘앙스
  chosen_reading: “그를 불러서 그가 빵을 먹게 하여라.”
  alternative_readings:
  - “그를 불러서 먹게 하여라.”
  - “그를 불러서 그가 먹게 하십시오.”
  rationale: 아버지가 딸들에게 내리는 실질적 지시로서 명령의 직접성을 살리되, 합쇼체 내에서 자연스러운 구문으로 정리했습니다.
  doctrine_reference: 서술적/화행적 뉘앙스 보존
