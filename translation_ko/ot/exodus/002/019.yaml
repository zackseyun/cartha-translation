  text: וַ/תֹּאמַ֕רְןָ אִ֣ישׁ מִצְרִ֔י הִצִּילָ֖/נוּ מִ/יַּ֣ד הָ/רֹעִ֑ים וְ/גַם דָּלֹ֤ה דָלָה֙ לָ֔/נוּ וַ/יַּ֖שְׁקְ אֶת הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
  footnotes:
  - marker: a
    text: Or 'from the power of the shepherds'; literally, 'from the hand of the shepherds.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew intensifies the verb: literally, ''he even drawing drew for us,'' emphasizing that he personally drew the water.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. 「한 이집트 사람이 우리를 목자들의 손아귀에서 구해 주었고, 게다가 우리를 위해 물도 길어다가 가축 떼를 마시게 했습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  english_pob_choice: They said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  lexicon: HALOT
  rationale: 여성 복수형 ‘말하다’의 서술을 자연스러운 현대 한국어로 옮기되, 원문의 보고문 시작 기능을 살렸습니다.
- source_word: אִישׁ מִצְרִי
  english_pob_choice: An Egyptian man
  chosen_korean: 한 이집트 사람
  alternatives_korean:
  - 한 이집트 남자
  - 이집트 사람 한 명
  lexicon: HALOT
  rationale: ‘사람’과 민족적 수식을 함께 살려 원문의 인물 묘사를 유지했고, 현대 한국어에서 가장 자연스럽게 읽히도록 했습니다.
- source_word: מִיַּד הָרֹעִים
  english_pob_choice: from the hand of the shepherds
  chosen_korean: 목자들의 손에서
  alternatives_korean:
  - 목자들의 손아귀에서
  - 목자들의 권세에서
  lexicon: HALOT
  rationale: 직역 이미지인 ‘손’을 살려 히브리어 관용구의 힘을 보존했습니다. 한국어에서는 ‘손아귀’보다 더 सीधे 원문을 드러내는 표현입니다.
- source_word: דָּלֹה דָלָה
  english_pob_choice: he even drew water for us
  chosen_korean: 게다가 우리를 위해 물도 길어다가
  alternatives_korean:
  - 심지어 우리를 위해 물도 길어다가
  - 우리에게 물을 길어 주기도 하고
  lexicon: HALOT
  rationale: 어간 반복의 강조를 한국어의 ‘게다가/도’로 반영했고, ‘길어다가’로 직접 행동을 드러냈습니다.
- source_word: וַיַּשְׁקְ אֶת הַצֹּאן
  english_pob_choice: and watered the flock
  chosen_korean: 양 떼를 마시게 했습니다
  alternatives_korean:
  - 양 떼에게 물을 먹였습니다
  - 양 떼에 물을 주었습니다
  lexicon: HALOT
  rationale: שקה의 ‘마시게 하다’를 자연스러운 한국어로 옮기되, 가축을 대상으로 한 급수 행위를 분명히 했습니다.
