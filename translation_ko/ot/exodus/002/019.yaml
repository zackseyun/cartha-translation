  naturalness: ‘목자들의 손에서 구해 주었다’는 이해되지만 현대 한국어에서는 다소 직역투입니다. ‘목자들의 손아귀에서 구해 주었습니다’가 자연스럽고 문맥에도 맞습니다. ‘물을 길어다가’와 ‘마시게 했습니다’의 연결은 자연스럽습니다.
  terminology: ‘이집트 사람’과 ‘목자들’은 적절합니다. ‘가축 떼’는 צֹאן의 집합적이며 종을 특정하지 않는 뜻을 보존합니다. 신학적으로 편향된 표현은 없습니다.
  issues:
