  text: וַ/יֵּ֥לֶךְ אִ֖ישׁ מִ/בֵּ֣ית לֵוִ֑י וַ/יִּקַּ֖ח אֶת בַּת לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/001.yaml
  text: Now a man from the house of Levi went and took a daughter of Levi as his wife[a].
  footnotes:
  - marker: a
    text: Or, 'a Levite woman.' The Hebrew literally says 'a daughter of Levi,' meaning a female descendant of Levi.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 가문에서 한 남자가 가서 레위의 딸을 자기 아내로 맞아들였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘레위의 딸’이며, 곧 레위의 여성 후손을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔고
  - 가며
  lexicon: HALOT
  rationale: 서술의 첫 동작을 자연스러운 한국어 연결어미로 옮기되, 히브리어의 순차적 동작 진행을 보존했습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 한 남자가
  alternatives_korean:
  - 어떤 남자가
  - 남자가
  lexicon: HALOT
  rationale: 아직 정체가 드러나지 않은 인물을 평이하게 소개하는 표현으로, 원문의 익명성을 살렸습니다.
- source_word: מִבֵּית לֵוִי
  english_pob_choice: from the house of Levi
  chosen_korean: 레위 가문에서
  alternatives_korean:
  - 레위 집안에서
  - 레위의 집에서
  lexicon: HALOT
  rationale: בַּיִת의 가문/가계 의미를 한국어의 ‘가문’으로 옮겨 족보적 뉘앙스를 유지했습니다.
- source_word: בַּת לֵוִי
  english_pob_choice: a daughter of Levi
  chosen_korean: 레위의 딸
  alternatives_korean:
  - 레위 사람 여자
  - 레위 지파의 여자
  lexicon: HALOT
  rationale: 직역상 ‘레위의 딸’이지만, 한국어에서는 혈연적 후손을 자연스럽게 드러내며 원문의 계보 표현을 보존합니다.
theological_decisions:
- issue: וַיִּקַּח의 혼인 관용구 처리
  chosen_reading: ‘자기 아내로 맞아들였습니다’로 옮겨, 단순한 ‘취하다’가 아니라 혼인 행위를 분명히 했습니다.
  alternative_readings:
  - 아내로 데려왔습니다
  - 아내를 맞이했습니다
  rationale: 히브리어 לקח는 혼인 문맥에서 여자를 아내로 ‘취하다/맞다’는 관용적 의미를 가지므로, 한국어에서도 그 결합을 분명히 드러내는 것이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 창세기 2:24의 혼인 표현과 서술 관용구 이해
