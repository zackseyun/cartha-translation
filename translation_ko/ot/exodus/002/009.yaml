language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֹּ֧אמֶר לָ֣/הּ בַּת פַּרְעֹ֗ה הֵילִ֜יכִי אֶת הַ/יֶּ֤לֶד הַ/זֶּה֙ וְ/הֵינִקִ֣/הוּ לִ֔/י וַ/אֲנִ֖י אֶתֵּ֣ן אֶת שְׂכָרֵ֑/ךְ וַ/תִּקַּ֧ח הָ/אִשָּׁ֛ה הַ/יֶּ֖לֶד וַ/תְּנִיקֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
  footnotes:
  - marker: a
    text: Or “suckle him for me” / “breastfeed him for me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오의 딸이 그 여자에게 말했습니다. “이 아이를 데려다가 나를 위해 젖을 먹이십시오. 그러면 제가 당신에게 품삯을 드리겠습니다.” 그래서 그 여자는 아이를 데려다가 젖을 먹였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘젖을 먹이다’는 여기서 영아에게 젖을 빨게 하다/수유하다의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  english_pob_choice: Pharaoh’s daughter
  chosen_korean: 파라오의 딸
  alternatives_korean:
  - 파라오의 딸을 둔 여자
  - 바로의 딸
  lexicon: HALOT
  rationale: 히브리어의 소유격 관계를 그대로 살리면서 현대 한국어에서 자연스럽고 직역에 가까운 표현으로 옮겼습니다.
- source_word: הֵילִיכִי
  english_pob_choice: Take
  chosen_korean: 데려다가
  alternatives_korean:
  - 가져가십시오
  - 데리고 가십시오
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘가다’보다 아이를 어떤 곳으로 옮겨 가게 하라는 명령의 뉘앙스가 있어, 문맥에 맞게 ‘데려가다’로 옮겼습니다.
- source_word: וְהֵינִקִהוּ לִי
  english_pob_choice: and nurse him for me
  chosen_korean: 나를 위해 젖을 먹이십시오
  alternatives_korean:
  - 나를 위해 젖을 빨리십시오
  - 나를 위해 수유하십시오
  lexicon: HALOT
  rationale: 간호하다의 일반적 의미보다 영아에게 젖을 먹이는 행위를 직접 드러내는 표현이 본문의 의미를 더 정확히 전달합니다.
- source_word: שְׂכָרֵךְ
  english_pob_choice: your wages
  chosen_korean: 품삯
  alternatives_korean:
  - 보수
  - 임금
  - 삯
  lexicon: HALOT
  rationale: 주어진 일에 대한 대가라는 점을 살리면서도, 고대 문맥에 어울리는 한국어로 ‘품삯’을 선택했습니다.
- source_word: וַתְּנִיקֵהוּ
  english_pob_choice: and nursed him
  chosen_korean: 젖을 먹였습니다
  alternatives_korean:
  - 젖을 먹여 길렀습니다
  - 수유했습니다
  lexicon: HALOT
  rationale: 앞의 명령문과 같은 동사군을 일관되게 유지하되, 결과 서술로 자연스러운 한국어 완료형을 사용했습니다.
theological_decisions:
- issue: 파라오의 딸의 발화체와 서술체의 높임말 처리
  chosen_reading: 직접 화법 안에서는 공손한 명령형 ‘-십시오’를 사용하고, 서술문은 합쇼체로 유지했습니다.
  alternative_readings:
  - 직접 화법도 평서형으로 통일
  - 구약 서사 전체를 비격식체로 통일
  rationale: 본문의 왕궁 장면과 상하 관계를 고려하면, 현대 표준어의 공손한 명령형이 원문의 직접성을 해치지 않으면서도 자연스럽습니다.
  doctrine_reference: 서사체 문체 결정
