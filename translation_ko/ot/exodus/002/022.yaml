translation:
  language: ko
  text: 그녀는 아들을 낳았고, 그는 그 이름을 게르솜이라 불렀습니다[a]. 그는 “나는 이방 땅에서 나그네로 지냈습니다.”라고 말했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게르솜은 히브리어로 “그곳의 나그네”라는 표현과 소리가 비슷하며, 뒤의 설명을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나는 이방 땅에서 나그네였습니다.”
    reason: alternative_reading
