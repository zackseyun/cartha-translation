theological_decisions:
- issue: gēr의 사회적/정체성 뉘앙스
  chosen_reading: '''나그네''로 번역해 단순한 여행객이 아니라 타지에 머무는 이방인의 정체성을 드러냈습니다.'
  alternative_readings:
  - '''외국인''으로 옮김'
  - '''거류민''으로 옮김'
  rationale: 이 절은 이름 설명의 말장난과 자기 규정을 동시에 담고 있으므로, 한국어에서 더 서사적이면서도 의미 범위가 넓은 '나그네'가 적합합니다.
  doctrine_reference: source semantics and naming wordplay
