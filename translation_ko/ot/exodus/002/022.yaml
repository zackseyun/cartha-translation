  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
  footnotes:
  - marker: a
    text: Gershom sounds like the Hebrew expression behind “a foreigner there,” reflecting Moses’s explanation of the name.
    reason: lexical_alternative
  - marker: b
    text: Or “I was a sojourner in a foreign land.”
    reason: alternative_reading
translation:
  language: ko
  text: 그녀는 아들을 낳았고, 그가 그 이름을 게르솜이라 불렀습니다. 이는 그가 말하기를 “나는 이방 땅에서 나그네로 지냈습니다.”라고 했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게르솜은 그 뒤의 “이방 땅”이라는 표현과 연결되는 히브리어 말장난을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나는 이방 땅에서 나그네였습니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  english_pob_choice: She gave birth to a son
  chosen_korean: 그녀는 아들을 낳았고
  alternatives_korean:
  - 그녀는 아들을 출산했고
  - 그녀는 아들을 낳았습니다
  lexicon: HALOT
  rationale: יַלַד 계열의 출산 서술을 자연스러운 현대 한국어로 옮기되, 평서적 서술 흐름을 유지했습니다.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  english_pob_choice: and he called his name
  chosen_korean: 그가 그 이름을 게르솜이라 불렀습니다
  alternatives_korean:
  - 그가 그를 게르솜이라 이름 지었습니다
  - 그가 그의 이름을 게르솜이라 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 부여 공식을 살리면서도 한국어에서 어색하지 않도록 '이름을 …이라 불렀습니다'로 옮겼습니다.
- source_word: גֵּר
  english_pob_choice: a sojourner
  chosen_korean: 나그네로
  alternatives_korean:
  - 거주 외국인으로
  - 이방인으로
  lexicon: HALOT
  rationale: POB가 지적한 גֵּר의 의미를 반영해 '나그네'를 택했으며, 단순한 외국인보다 체류·소속의 긴장을 더 잘 드러냅니다.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  english_pob_choice: in a foreign land
  chosen_korean: 이방 땅에서
  alternatives_korean:
  - 외국 땅에서
  - 낯선 땅에서
  lexicon: HALOT
  rationale: נָכְרִיָּה의 ‘foreign/alien’ 의미를 살려 '이방 땅'으로 옮겨, 앞의 '나그네'와 함께 어휘적 연결을 유지했습니다.
- source_word: גֵּרְשֹׁם
  english_pob_choice: Gershom
  chosen_korean: 게르솜
  alternatives_korean:
  - 그솜
  - 게르숌
  lexicon: standard transliteration
  rationale: 히브리어 고유명사는 현대 한국어 음역 관례를 따랐습니다.
theological_decisions:
- issue: gēr의 사회적/정체성 뉘앙스
  chosen_reading: '''나그네''로 번역해 단순한 여행객이 아니라 타지에 머무는 이방인의 정체성을 드러냈습니다.'
  alternative_readings:
  - '''외국인''으로 옮김'
  - '''거류민''으로 옮김'
  rationale: 이 절은 이름 설명의 말장난과 자기 규정을 동시에 담고 있으므로, 한국어에서 더 서사적이면서도 의미 범위가 넓은 '나그네'가 적합합니다.
  doctrine_reference: source semantics and naming wordplay
