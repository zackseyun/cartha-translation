- from: 그러자 그의 누이가 바로의 딸에게 말했습니다. 「제가 가서 히브리 여자들 가운데에서 젖을 먹일 여자를 불러와서, 그가 그 아이를 당신을 위해 젖 먹이게 하겠습니다」[a]
  to: 그러자 그의 누이가 바로의 딸에게 말했습니다. “제가 가서 히브리 여인들 가운데에서 당신을 위해 그 아이에게 젖을 먹일 여인[a]을 불러올까요?”
  rationale: 원문의 1인칭 의문형을 ‘불러올까요?’로 보존하고, 수유할 여인을 수식하는 표현으로 옮겨 그 여인이 아이를 수유한다는 의미를 자연스럽게 드러냈습니다. ‘당신을 위해’는 לָךְ의 수혜 의미를 유지합니다.
