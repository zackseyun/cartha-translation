source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲחֹת/וֹ֮ אֶל בַּת פַּרְעֹה֒ הַ/אֵלֵ֗ךְ וְ/קָרָ֤אתִי לָ/ךְ֙ אִשָּׁ֣ה מֵינֶ֔קֶת מִ֖ן הָ/עִבְרִיֹּ֑ת וְ/תֵינִ֥ק לָ֖/ךְ אֶת הַ/יָּֽלֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
  footnotes:
  - marker: a
    text: Or “a wet nurse from among the Hebrew women.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그의 누이가 바로의 딸에게 말했습니다. 「제가 가서 히브리 여자들 가운데에서 젖을 먹일 여자를 불러와서, 그가 그 아이를 당신을 위해 젖 먹이게 하겠습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘젖을 먹일 여자’는 ‘유모’에 해당하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 자연스러운 한국어 서사 연결인 ‘그러자’로 옮겨, 사건의 다음 진행을 분명히 드러냅니다.
- source_word: אֲחֹתוֹ
  english_pob_choice: his sister
  chosen_korean: 그의 누이
  alternatives_korean:
  - 모세의 누이
  - 아이의 누이
  lexicon: HALOT
  rationale: 히브리어의 3인칭 남성 단수 소유격을 그대로 반영해 ‘그의 누이’로 옮기고, 문맥상 지시 대상을 암시적으로 유지했습니다.
- source_word: אִשָּׁה מֵינֶקֶת
  english_pob_choice: a nursing woman
  chosen_korean: 젖을 먹일 여자
  alternatives_korean:
  - 유모
  - 젖먹이는 여자
  - 수유하는 여자
  lexicon: HALOT
  rationale: 이 표현은 단순한 ‘여자’가 아니라 유아에게 젖을 먹일 수 있는 여성을 뜻하므로, 전통적 관용어 ‘유모’보다 원뜻이 보이는 표현을 택했습니다.
- source_word: וְתֵינִק
  english_pob_choice: so that she may nurse
  chosen_korean: 젖 먹이게 하겠습니다
  alternatives_korean:
  - 그가 젖을 먹이게 하겠습니다
  - 그 아이를 젖 먹이도록 하겠습니다
  lexicon: HALOT
  rationale: 히필형의 목적/결과 의미를 살려, ‘불러와서 … 하겠습니다’라는 한국어 목적절 구조로 자연스럽게 옮겼습니다.
- source_word: הַיָּלֶד
  english_pob_choice: the child
  chosen_korean: 그 아이
  alternatives_korean:
  - 그 어린아이
  - 그 아기
  lexicon: HALOT
  rationale: 문맥상 신생아에 가깝지만, 원문이 성별이나 연령을 더 좁히지 않으므로 가장 무리 없는 ‘그 아이’를 사용했습니다.
theological_decisions:
- issue: 바로의 딸에게 제안하는 발화의 공손성
  chosen_reading: 직접 화법 안에서 공손한 제안체를 유지하되, 과도한 현대식 완곡표현은 피했습니다.
  alternative_readings:
  - ‘제가 가서’보다 더 완곡한 ‘가서 찾아오겠습니다’
  - 직설적 명령형
  rationale: 히브리어의 첫인칭 의문형은 제안/허락 요청의 뉘앙스를 가지므로, 한국어에서도 공손한 제안으로 살리되 서사의 긴장을 약화하지 않도록 했습니다.
  doctrine_reference: 서사 발화의 화용론
- issue: ‘히브리 여자들 가운데에서’의 집단 표지
  chosen_reading: 출처를 나타내는 מן을 ‘~가운데에서’로 처리해 공동체 내부에서 한 여인을 찾는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘히브리 여자들로부터’
  - ‘히브리 여자들 중에서’
  rationale: 단순 출처를 넘어 후보군 중에서 한 사람을 찾는 상황이므로, 한국어에서는 ‘가운데에서’가 가장 자연스럽고 문맥에 맞습니다.
  doctrine_reference: 서사 문맥의 담화 기능
