    rationale: וְתֵינִק의 주체는 불러올 수유 여인입니다. ‘…젖 먹이게 하겠습니다’는 화자가 그 행위를 성사시키겠다는 사역적 뉘앙스를 더하며, 원문의 단순한 결과/목적을 흐립니다.
