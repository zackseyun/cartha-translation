source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע פַּרְעֹה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יְבַקֵּ֖שׁ לַ/הֲרֹ֣ג אֶת מֹשֶׁ֑ה וַ/יִּבְרַ֤ח מֹשֶׁה֙ מִ/פְּנֵ֣י פַרְעֹ֔ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ מִדְיָ֖ן וַ/יֵּ֥שֶׁב עַֽל הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
  footnotes:
  - marker: a
    text: Or 'heard this thing' or 'learned of this incident.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew uses the same verb twice ('settled' / 'sat down'), first for residing in Midian and then for physically sitting by the well.
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오가 이 일[a]을 듣고 모세를 죽이려고 하였습니다. 그러나 모세는 파라오를 피해 달아나 미디안 땅에 머물렀고, 우물 곁에 앉았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 일’은 히브리어 הַדָּבָר הַזֶּה의 비교적 직역으로, 문맥상 모세가 이집트 사람을 죽인 사건을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘머물렀고’와 ‘앉았습니다’에 같은 동사(יָשַׁב)를 사용합니다. 첫 번째는 미디안에 거주한 것을, 두 번째는 우물 곁에 실제로 앉은 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 듣고
  alternatives_korean:
  - 알고
  - 전해 듣고
  lexicon: HALOT
  rationale: שׁמע의 기본 의미를 살려 ‘듣고’로 옮기되, 사건을 인지하게 된 흐름이 드러나도록 자연스럽게 표현했습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this matter
  chosen_korean: 이 일
  alternatives_korean:
  - 이 일련의 사건
  - 이 문제
  - 이 사건
  lexicon: HALOT
  rationale: 직역형 ‘이 일’은 דבר의 범위를 과도하게 좁히지 않으면서, 본문이 가리키는 사건을 한국어로 간결하게 전달합니다.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  english_pob_choice: sought to kill
  chosen_korean: 죽이려고 하였습니다
  alternatives_korean:
  - 죽이려 하였습니다
  - 죽이기를 구하였습니다
  - 죽이고자 하였습니다
  lexicon: HALOT
  rationale: בקש + 부정사는 단순 의도보다 ‘시도/추구’의 뉘앙스를 가지므로, 현대 한국어에서는 ‘-려고 하다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  english_pob_choice: stayed in the land of Midian
  chosen_korean: 미디안 땅에 머물렀고
  alternatives_korean:
  - 미디안 땅에 거주하였고
  - 미디안 땅에 살았고
  - 미디안 땅에 정착하였고
  lexicon: HALOT
  rationale: ישׁב의 첫 용례는 단순 ‘앉다’가 아니라 머물러 거주하는 의미이므로, 지속성은 있으나 영구 정착을 강하게 단정하지 않는 ‘머물렀고’가 적절합니다.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  english_pob_choice: he sat down by the well
  chosen_korean: 우물 곁에 앉았습니다
  alternatives_korean:
  - 우물 옆에 앉았습니다
  - 우물가에 앉았습니다
  - 우물에 앉았습니다
  lexicon: HALOT
  rationale: 두 번째 ישׁב은 구체적 동작으로서의 ‘앉다’이며, עַל은 한국어에서 ‘곁에/가에’가 자연스럽습니다.
