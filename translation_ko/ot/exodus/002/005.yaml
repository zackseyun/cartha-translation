  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
  footnotes:
  - marker: a
    text: Or 'among the reeds.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'her female servant'; traditionally, some render 'her arm.'
    reason: alternative_reading
  - marker: c
    text: The Hebrew word translated 'basket' is the same word used for Noah’s 'ark' in Genesis 6–9.
    reason: cross_reference
translation:
  language: ko
  text: 그때 파라오의 딸이 나일강[a]에서 목욕하려고 내려갔습니다. 그녀의 젊은 여자들은 나일강의 강둑을 따라 걷고 있었습니다. 그녀는 갈대 사이[b]에 있는 상자[c]를 보고, 자기 여종을 보내 그것을 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나일강가에서’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘갈대들 가운데’ 또는 ‘갈대 사이’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘상자’는 창세기 6–9장의 노아의 ‘방주’에 쓰인 같은 단어입니다.
    reason: cross_reference
lexical_decisions:
- source_word: בַת פַּרְעֹה
  english_pob_choice: Pharaoh’s daughter
  chosen_korean: 파라오의 딸
  alternatives_korean:
  - 바로의 딸
  - 파라오 공주
  lexicon: WLC + POB audit trail
  rationale: יַ/פַּרְעֹה는 고유명처럼 기능하는 통치 칭호이므로, 현대 독자가 바로 식별할 수 있는 음역형을 택했습니다.
- source_word: לִרְחֹץ
  english_pob_choice: to bathe
  chosen_korean: 목욕하려고
  alternatives_korean:
  - 씻으려고
  - 목욕하러
  lexicon: HALOT
  rationale: 물가로 내려가는 동작과 결합될 때 '목욕하다'가 가장 자연스럽고, 목적 표현으로 목적성을 살릴 수 있습니다.
- source_word: בְּתוֹךְ הַסּוּף
  english_pob_choice: in the midst of the reeds
  chosen_korean: 갈대 사이
  alternatives_korean:
  - 갈대 한가운데
  - 갈대들 가운데
  lexicon: HALOT
  rationale: 스스로를 가리는 식물 사이에 놓인 위치를 한국어로 가장 자연스럽게 드러내며, 영어 POB가 표시한 갈대/갈대류 의미를 반영합니다.
- source_word: אֲמָתָהּ
  english_pob_choice: her female servant
  chosen_korean: 자기 여종
  alternatives_korean:
  - 자기 여종
  - 여종
  - 하녀
  lexicon: HALOT
  rationale: 문맥상 '팔'이 아니라 여종을 보내는 장면이므로 그 독해를 따르되, 여성 종속 신분을 드러내는 '여종'을 사용했습니다.
- source_word: הַתֵּבָה
  english_pob_choice: the basket
  chosen_korean: 상자
  alternatives_korean:
  - 바구니
  - 궤
  lexicon: HALOT
  rationale: 히브리어 תֵּבָה의 기본 의미를 좁게 특정하지 않고, 문맥상 작은 용기라는 점을 안정적으로 전달하는 중립어로 옮겼습니다.
theological_decisions:
- issue: תֵּבָה를 '방주'로 높여 번역할지 여부
  chosen_reading: 본문에서는 '상자'로 두고, 노아의 תֵּבָה와의 어휘적 연결은 주석에서만 보존합니다.
  alternative_readings:
  - 방주
  - 궤
  rationale: 출애굽기 2장의 대상은 홍수 이야기의 גדולה를 지닌 방주가 아니라 갈대 속의 소형 용기이므로, 본문 의미를 과장하지 않는 번역이 적절합니다.
  doctrine_reference: 문맥 우선 원칙 및 어휘 일관성
- issue: אֲמָתָהּ를 '팔'로 읽는 전통적 대안 처리
  chosen_reading: 본문은 '여종' 독해를 채택합니다.
  alternative_readings:
  - 그녀의 팔
  - 그녀의 손
  rationale: שלח와 결합할 때 문법적으로 '보내다'가 가장 자연스러워, 본문 문맥과 구문을 따르는 독해를 유지했습니다.
  doctrine_reference: 원문 구문 우선 원칙
