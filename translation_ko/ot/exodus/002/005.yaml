  to: 그때 바로의 딸이 목욕하려고 나일강가[a]로 내려갔습니다. 그녀의 젊은 여인들은 나일강 둑을 따라 걷고 있었습니다. 그녀는 갈대들 가운데[b] 있는 바구니[c]를 보고, 자신의 여종[d]을 보내어 그것을 가져갔습니다.
