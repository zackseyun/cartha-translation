    rationale: תֵּבָה는 용기의 정확한 형태를 상세히 규정하지 않지만, 갈대 속에 둔 아기용 용기라는 문맥에서 ‘바구니’가 현대 한국어 독자에게 가장 자연스럽습니다. 노아의 방주와의 동일 어휘는 각주로 충분히 보존됩니다.
  - severity: low
