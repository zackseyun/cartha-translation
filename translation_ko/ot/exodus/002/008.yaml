  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: ko
  text: 바로의 딸이 그 여자에게 말했습니다. “가십시오.” 그러자 그 젊은 여자가 가서 그 아이의 어머니를 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  english_pob_choice: Pharaoh’s daughter
  chosen_korean: 바로의 딸
  alternatives_korean:
  - 바로의 공주
  - 바로의 딸인 여자
  lexicon: HALOT
  rationale: 히브리어 소유 구문을 자연스럽게 옮기되, 출애굽기 문맥에서 הַפַּרְעֹה는 관용적으로 ‘바로’로 처리하는 것이 적절합니다.
- source_word: לֵכִי
  english_pob_choice: Go
  chosen_korean: 가십시오
  alternatives_korean:
  - 가세요
  - 가라
  lexicon: HALOT
  rationale: 여성 단수 명령형의 짧고 단호한 어조를 살리되, 공주가 하녀에게 말하는 장면에 맞게 공손한 명령형으로 옮겼습니다.
- source_word: הָעַלְמָה
  english_pob_choice: the young woman
  chosen_korean: 그 젊은 여자
  alternatives_korean:
  - 그 소녀
  - 그 처녀
  - 그 젊은 여인
  lexicon: HALOT
  rationale: עַלְמָה의 핵심은 ‘어린 여자’가 아니라 결혼 적령기의 젊은 여성을 가리키는 점이므로, 지나치게 축소하거나 고어화하지 않고 옮겼습니다.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  english_pob_choice: called the child’s mother
  chosen_korean: 그 아이의 어머니를 불러왔습니다
  alternatives_korean:
  - 그 아이의 어머니를 불렀습니다
  - 그 아이의 어머니를 불러 데려왔습니다
  lexicon: HALOT
  rationale: קרא는 단순히 ‘부르다’일 수도 있지만 여기서는 와서 모시게 하는 뉘앙스가 있으므로, 문맥상 자연한 ‘불러왔습니다’로 처리했습니다.
theological_decisions:
- issue: 보낸 말의 화자와 듣는 이의 사회적 관계
  chosen_reading: 바로의 딸이 하녀 격의 이스라엘 소녀에게 짧게 명령하는 장면으로, 직접화법의 간결함을 유지했습니다.
  alternative_readings:
  - 더 완곡한 부탁체로 완화
  - 평서형으로 일반화
  rationale: 히브리어의 단문 명령 ‘가라/가십시오’는 장면의 긴장을 형성하므로, 이를 완화하지 않고 살리는 것이 서사적 효과에 부합합니다.
  doctrine_reference: 서사 문맥 및 화행 보존
