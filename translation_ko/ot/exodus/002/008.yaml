    rationale: וַתִּקְרָא는 ‘불렀다/불러왔다’가 아니라 목적어를 ‘불렀다, 소환했다’라는 뜻입니다. 문맥상 어머니가 뒤이어 왔음을 예상할 수 있어도, 이 절 자체는 그녀를 데려왔다는 결과를 명시하지 않습니다. ‘불렀습니다’로 옮겨 원문의 절제된 표현을 유지하는 것이 안전합니다.
