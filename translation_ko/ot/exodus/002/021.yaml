    issue: 둘째 절의 주어 ‘그가’가 모세로 오해될 수 있습니다.
    rationale: 히브리어 וַיִּתֵּן의 주어는 앞서 언급된 ‘그 사람’이며, 그가 자신의 딸 십보라를 모세에게 주었습니다. 한국어에서는 앞 절의 주어가 모세이므로 대명사만 쓰면 주어 전환이 불분명합니다.
