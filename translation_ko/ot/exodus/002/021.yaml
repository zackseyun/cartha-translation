  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יּ֥וֹאֶל מֹשֶׁ֖ה לָ/שֶׁ֣בֶת אֶת הָ/אִ֑ישׁ וַ/יִּתֵּ֛ן אֶת צִפֹּרָ֥ה בִתּ֖/וֹ לְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/021.yaml
  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
  footnotes:
  - marker: a
    text: Or 'Moses was willing to dwell with the man.' The Hebrew verb can express willingness, consent, or contentment.
    reason: lexical_alternative
  - marker: b
    text: That is, he gave Zipporah to Moses in marriage.
    reason: cultural_note
translation:
  language: ko
  text: 모세는 그 사람과 함께 살기로 동의하였고, 그가 자기 딸 십보라를 모세에게 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세가 그 사람과 함께 살기를 기꺼이 하였다.’ 히브리어 동사는 의향, 동의, 만족을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 그가 십보라를 모세에게 혼인시키는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  english_pob_choice: agreed
  chosen_korean: 동의하였고
  alternatives_korean:
  - 기꺼이 그러하였고
  - 살기를 원하였고
  - 승낙하였고
  lexicon: HALOT
  rationale: 이 동사는 단순한 의사 표명보다 수락·동의를 나타낼 수 있으므로, 현대 한국어에서는 문맥에 맞는 ‘동의하다’가 가장 자연스럽고 의미를 잘 살립니다.
- source_word: לָשֶׁבֶת
  english_pob_choice: to dwell
  chosen_korean: 함께 살기로
  alternatives_korean:
  - 거주하기로
  - 머물기로
  - 살기 위해
  lexicon: HALOT
  rationale: 히브리어는 정착하여 거주한다는 뜻이므로, ‘함께 살다’가 문맥상 가장 직접적이며 현대 독자에게도 명확합니다.
- source_word: וַיִּתֵּן
  english_pob_choice: he gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었고
  - 결혼시켰습니다
  - 아내로 주었습니다
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘주다’라고 말하므로 기본 동사를 살렸고, 결혼 맥락은 본문 자체보다 상황에서 이해되도록 두었습니다.
- source_word: בִתּוֹ
  english_pob_choice: his daughter
  chosen_korean: 자기 딸
  alternatives_korean:
  - 그의 딸
  - 딸을
  - 자녀를
  lexicon: HALOT
  rationale: 소유격 접미사는 ‘그의’에 해당하지만, 한국어에서는 주어가 동일할 때 ‘자기 딸’이 더 자연스럽고 지시도 분명합니다.
theological_decisions:
- issue: 결혼 의미의 명시 여부
  chosen_reading: 본문은 ‘딸을 모세에게 주었다’고 직역하되, 결혼이라는 의미는 본문 밖의 맥락으로 이해되도록 했습니다.
  alternative_readings:
  - ‘아내로 주었습니다’
  - ‘결혼하게 하였습니다’
  rationale: 히브리어 동사 자체는 단순히 ‘주다’이며, EN POB도 본문에는 직접 넣지 않고 각주로 처리했습니다. 따라서 주석 없이 본문에 결혼 의미를 과도하게 앞세우지 않았습니다.
  doctrine_reference: 본문의 의미 제한과 문맥적 추론의 구분
- issue: ‘살다/거주하다’의 표현 강도
  chosen_reading: ‘함께 살기로 동의하였고’로 번역해 동의와 거주 의사를 함께 드러냈습니다.
  alternative_readings:
  - ‘거주하기로 동의하였고’
  - ‘머물기로 동의하였고’
  rationale: יואל은 단순한 수락을 넘어서 체류·정착에 대한 동의를 담을 수 있어, 한국어에서도 두 요소가 함께 보이도록 했습니다.
  doctrine_reference: 히브리어 동사의 의미 범위
