  - severity: low
    issue: 각주 표지가 설명하는 첫 친족 표현에서 멀리 떨어져 있습니다.
    rationale: 각주는 본절의 두 ‘형제’ 표현의 비혈연적·연대적 용법을 설명하므로, 첫 용례 바로 뒤에 표지하는 것이 앵커의 범위를 명확히 합니다.
  - severity: low
    issue: ‘그 시절’은 다소 구어적이며 원문의 서사적 시간 전환을 약화합니다.
    rationale: ‘그 무렵’은 현대적인 문체를 유지하면서 בַּיָּמִים הָהֵם의 서사적 시간 설정에 더 잘 맞습니다.
