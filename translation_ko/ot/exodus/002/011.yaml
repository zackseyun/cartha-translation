  yaml_path: translation/ot/exodus/002/011.yaml
  text: Now it happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
  footnotes:
  - marker: a
    text: Or 'kinsmen' or 'his people' for 'his brothers' / 'one of his brothers'; the Hebrew uses familial language to express Moses' solidarity with the Hebrews.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 무렵에 모세는 장성하여 자기 형제들[a]에게 나아가 그들이 지는 짐을 보았습니다. 또 이집트 사람 한 사람이 자기 형제들 가운데 한 히브리 사람을 치고 있는 것을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 모세의 친형제들만을 뜻하는 말이 아니라, 히브리인들과의 연대와 동일시를 나타내는 친족 표현입니다. 뒤의 ‘자기 형제들 가운데’도 같은 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  english_pob_choice: Now it happened in those days
  chosen_korean: 그 시절에
  alternatives_korean:
  - 그때에
  - 그 날들에
  lexicon: HALOT
  rationale: 히브리어의 서사 전환 공식을 자연스러운 현대 한국어로 옮기되, 고어적인 ‘일어났다/이르러’보다 간결한 시기 표지를 택했습니다.
- source_word: אֶל אֶחָיו
  english_pob_choice: to his brothers
  chosen_korean: 자기 형제들에게
  alternatives_korean:
  - 자기 동족들에게
  - 자기 겨레에게
  lexicon: HALOT
  rationale: 원문의 친족적 표현을 살려 모세가 히브리인들과의 연대를 드러내는 뉘앙스를 유지했습니다.
- source_word: בְּסִבְלֹתָם
  english_pob_choice: their burdens
  chosen_korean: 그들의 고역
  alternatives_korean:
  - 그들의 짐
  - 그들의 강제 노역
  - 그들의 고생
  lexicon: HALOT
  rationale: 단순한 ‘짐’보다 억압적 노동의 감각을 더 분명히 드러내면서도, 원문의 구체적·경험적 의미를 과도하게 좁히지 않기 위해 ‘고역’을 택했습니다.
- source_word: אִישׁ מִצְרִי ... אִישׁ עִבְרִי
  english_pob_choice: an Egyptian man ... a Hebrew man
  chosen_korean: 한 이집트 사람 ... 한 히브리 사람
  alternatives_korean:
  - 한 이집트 남자 ... 한 히브리 남자
  - 어떤 이집트인 ... 어떤 히브리인
  lexicon: HALOT
  rationale: 반복되는 אִישׁ 구조를 한국어에서도 대칭적으로 살리되, ‘사람’으로 옮겨 현대 문체에 맞추었습니다.
theological_decisions:
- issue: 형제/동족을 가리키는 친족 언어의 유지
  chosen_reading: ‘자기 형제들’로 유지했습니다.
  alternative_readings:
  - ‘자기 동족들’
  - ‘자기 백성’
  rationale: 본문은 모세의 정체성 선택을 친족 언어로 표현하므로, 이를 완화하지 않고 직접 드러내는 번역이 원문의 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
