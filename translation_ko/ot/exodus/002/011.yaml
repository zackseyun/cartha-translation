revisions:
- from: 그 시절에 모세가 장성하여 자기 형제들에게 나가서 그들의 고역을 보았습니다. 그는 한 이집트 사람이 자기 형제들 가운데 한 히브리 사람을 치고 있는 것을 보았습니다.[a]
  to: 그 무렵에 모세는 장성하여 자기 형제들[a]에게 나아가 그들이 지는 짐을 보았습니다. 또 이집트 사람 한 사람이 자기 형제들 가운데 한 히브리 사람을 치고 있는 것을 보았습니다.
  rationale: 이 개정은 원문의 친족 언어와 두 사람의 대칭적 지칭을 유지하고, בְּסִבְלֹתָם을 특정한 노동 형태로 과도하게 한정하지 않습니다. 동시에 이동 표현과 각주 앵커를 현대 표준 한국어에 맞게 다듬었습니다.
