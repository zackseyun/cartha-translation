language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֤פֶן כֹּה֙ וָ/כֹ֔ה וַ/יַּ֖רְא כִּ֣י אֵ֣ין אִ֑ישׁ וַ/יַּךְ֙ אֶת הַ/מִּצְרִ֔י וַֽ/יִּטְמְנֵ֖/הוּ בַּ/חֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
  footnotes:
  - marker: a
    text: Or 'that no one was there.' The Hebrew reads literally 'that there was no man,' but the phrase may function generically for the absence of any person.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이쪽저쪽을 살펴보았고, 거기에 아무 사람도 없음을 보고 그 이집트 사람을 쳐 죽인 뒤 모래 속에 그를 숨겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기에 아무도 없음을’. 히브리어는 문자적으로 ‘사람이 없었다’이지만, 문맥상 어떤 목격자도 없었다는 뜻으로 기능할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  english_pob_choice: He looked this way and that
  chosen_korean: 이쪽저쪽을 살펴보았고
  alternatives_korean:
  - 이리저리 둘러보았고
  - 이쪽저쪽을 바라보았고
  lexicon: HALOT
  rationale: פּנה와 ‘이쪽저쪽’의 결합은 단순한 ‘돌다’보다 주위를 시각적으로 살피는 동작을 나타내므로, 자연스러운 한국어로 ‘살펴보았고’라고 옮겼습니다.
- source_word: אֵין אִישׁ
  english_pob_choice: there was no man there
  chosen_korean: 거기에 아무 사람도 없음을
  alternatives_korean:
  - 거기에 아무도 없음을
  - 그곳에 사람이 없음을
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘사람이 없다’이지만, 문맥상 목격자가 없다는 뜻이므로 본문에는 자연스러운 표현을 쓰되, ‘아무 사람도’로 원문의 인칭 뉘앙스를 남겼습니다.
- source_word: וַיַּךְ
  english_pob_choice: he struck down
  chosen_korean: 쳐 죽인 뒤
  alternatives_korean:
  - 쳐서 죽인 뒤
  - 내려친 뒤
  lexicon: HALOT
  rationale: נכה는 기본적으로 ‘치다/쳐서 쓰러뜨리다’이지만, 뒤이어 매장 장면이 이어져 결과가 치명적임이 분명하므로 ‘쳐 죽이다’로 렌더링했습니다.
- source_word: הַמִּצְרִי
  english_pob_choice: the Egyptian
  chosen_korean: 그 이집트 사람을
  alternatives_korean:
  - 그 애굽 사람을
  - 그 이집트인을
  lexicon: HALOT
  rationale: 지명형 형용사는 민족/국적 표시이므로, 현대 한국어에서 바로 이해되는 ‘이집트 사람’을 택했습니다.
- source_word: וַיִּטְמְנֵהוּ בַּחוֹל
  english_pob_choice: hid him in the sand
  chosen_korean: 모래 속에 그를 숨겼습니다
  alternatives_korean:
  - 모래에 그를 숨겼습니다
  - 모래 아래에 그를 감췄습니다
  lexicon: HALOT
  rationale: טמן은 ‘숨기다/감추다’이고, ‘모래 속에’는 실제로 덮어 숨기는 동작을 자연스럽게 드러내므로 직역보다 약간 구체화했습니다.
theological_decisions:
- issue: 살해 행위의 표현 강도
  chosen_reading: ‘쳐 죽인 뒤’로 옮겨 본문의 폭력성과 결과를 분명히 드러냈습니다.
  alternative_readings:
  - ‘쳐서 죽인 뒤’
  - ‘쳐서 쓰러뜨린 뒤’
  rationale: 히브리어 동사는 단순한 ‘치다’이지만 문맥상 사망이 전제되므로, 독자가 사건의 중대성을 오해하지 않도록 치명적 결과를 본문에 반영했습니다.
  doctrine_reference: 서사 본문은 사건의 사실성과 결과를 명료하게 전달해야 한다는 원칙
