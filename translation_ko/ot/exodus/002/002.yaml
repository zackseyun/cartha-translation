  text: וַ/תַּ֥הַר הָ/אִשָּׁ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֵּ֤רֶא אֹת/וֹ֙ כִּי ט֣וֹב ה֔וּא וַֽ/תִּצְפְּנֵ֖/הוּ שְׁלֹשָׁ֥ה יְרָחִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
  footnotes:
  - marker: a
    text: Or 'beautiful.' The Hebrew says 'good,' which can also carry the sense of pleasing or fine in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인은 임신하여 아들을 낳았습니다. 그가 좋다는 것을 보고는 그를 석 달 동안 숨겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아름답다.’ 히브리어는 ‘좋다’라고 말하며, 문맥에 따라 기쁘거나 훌륭하다는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  english_pob_choice: became pregnant
  chosen_korean: 임신하여
  alternatives_korean:
  - 잉태하여
  - 밸 수 있게 되어
  lexicon: HALOT
  rationale: הרה는 임신/잉태의 시작을 뜻하므로, 현대 한국어에서는 자연스럽고 명확한 ‘임신하여’로 옮겼습니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여인은
  alternatives_korean:
  - 그 여자는
  - 그 아내는
  lexicon: HALOT
  rationale: 히브리어는 관계를 덧붙이지 않고 단순히 ‘그 여자/여인’이라고 하므로, 문어체에 맞는 ‘그 여인’으로 유지했습니다.
- source_word: כִּי טוֹב הוּא
  english_pob_choice: that he was good
  chosen_korean: 좋다는 것을
  alternatives_korean:
  - 아름답다는 것을
  - 아름답고 보기에 좋다는 것을
  lexicon: HALOT
  rationale: טוב의 기본 의미인 ‘좋다’를 살려 본문을 직접적으로 반영했습니다. ‘아름답다’는 가능한 해석이지만, 본문이 요구하는 기본 의미를 넘어서므로 본문은 ‘좋다’로 두었습니다.
- source_word: שְׁלֹשָׁה יְרָחִים
  english_pob_choice: for three months
  chosen_korean: 석 달 동안
  alternatives_korean:
  - 세 달 동안
  - 세 달간
  lexicon: HALOT
  rationale: יְרָחִים는 달 수를 가리키므로, 서사 문맥에서 자연스러운 한국어 관용 표현인 ‘석 달 동안’으로 옮겼습니다.
theological_decisions:
- issue: 아기에게 적용된 טוֹב의 의미
  chosen_reading: ‘좋다’로 직역하여, 해석적 의미를 본문에 과도하게 덧씌우지 않았습니다.
  alternative_readings:
  - 아름답다
  - 보기 좋다
  rationale: 본문의 핵심은 모세 어머니의 평가가 단순한 미적 판단인지보다, הילד가 ‘좋다’고 인식되었다는 서술입니다. 따라서 의미 범위를 넓히는 해석은 본문 밖으로 미루고, 본문에는 기본 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
