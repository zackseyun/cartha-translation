base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
  footnotes:
  - marker: a
    text: Or, more formally, “Why have you hurried to come today?” The Hebrew uses the verb “hurry” with “come.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 아버지 르우엘에게 오자, 그는 말했습니다. “어째서 오늘 이렇게 서둘러 왔느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, “어째서 오늘 오기를 서두르느냐?” 히브리어는 ‘서두르다’와 ‘오다’를 함께 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  english_pob_choice: When they came
  chosen_korean: 그들이 … 오자
  alternatives_korean:
  - 그리고 그들이 왔습니다
  - 그때 그들이 왔습니다
  lexicon: HALOT
  rationale: 여자들을 가리키는 복수 완료형 서술을 한국어 서사에 자연스러운 시간 선행 표현인 ‘-자’로 옮겨, 단순한 병렬보다 사건의 전후관계를 살렸습니다.
- source_word: רְעוּאֵל
  english_pob_choice: Reuel
  chosen_korean: 르우엘
  alternatives_korean:
  - 레우엘
  - 라구엘
  lexicon: 인명 표기 관행
  rationale: 히브리어 형태에 더 직접적인 음역을 택했고, 헬라어식 Raguel보다 원문형을 반영했습니다.
- source_word: אֲבִיהֶן
  english_pob_choice: their father
  chosen_korean: 아버지
  alternatives_korean:
  - 그들의 아버지
  - 그들 아버지
  lexicon: HALOT
  rationale: 문맥상 딸들의 직접적인 부친을 뜻하므로 소유 관계를 한국어에서 자연스럽게 풀어 ‘아버지’로 옮겼습니다.
- source_word: מַדּוּעַ מִהַרְתֶּן בֹּא
  english_pob_choice: Why have you come back so quickly today?
  chosen_korean: 어째서 오늘 이렇게 서둘러 왔느냐
  alternatives_korean:
  - 왜 오늘 그렇게 빨리 돌아왔느냐
  - 왜 오늘 이렇게 급히 왔느냐
  lexicon: HALOT
  rationale: מִהַרְתֶּן + בֹּא의 ‘서두르다/급히 오다’라는 결합을 살려, 한국어에서도 ‘서둘러 왔느냐’로 직역과 자연스러움을 함께 반영했습니다.
- source_word: הַיּוֹם
  english_pob_choice: today
  chosen_korean: 오늘
  alternatives_korean:
  - 이날
  lexicon: HALOT
  rationale: 정관사 포함 표현이 관용적으로 ‘오늘’의 뜻이므로 현대 한국어의 기본형을 사용했습니다.
