base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
  footnotes:
  - marker: a
    text: Or 'their groan.' The Hebrew noun can denote a cry or groaning under oppression.
    reason: lexical_alternative
  - marker: b
    text: '''Remembered'' is covenant language: it does not imply that God had forgotten, but that he turned in faithfulness to his covenant obligations.'
    reason: cultural_note
translation:
  language: ko
  text: 하나님은 그들의 신음 소리를 들으셨고, 하나님은 아브라함과 이삭과 야곱과 맺으신 자신의 언약을 기억하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신음 소리’는 압제 아래에서 터져 나오는 고통의 외침을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기억하다’는 여기서 하나님이 잊으셨다가 떠올리셨다는 뜻이 아니라, 언약에 신실하게 반응하신다는 언약적 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들으셨고
  alternatives_korean:
  - 귀 기울이셨고
  - 들으셨습니다
  lexicon: HALOT
  rationale: 이 서술은 하나님의 응답의 출발점으로서 ‘듣다’의 기본 의미를 살리는 것이 적절하므로, 본문 흐름에 맞게 ‘들으셨고’로 옮겼습니다.
- source_word: נַאֲקָתָם
  english_pob_choice: their groaning
  chosen_korean: 그들의 신음 소리
  alternatives_korean:
  - 그들의 신음
  - 그들의 울부짖음
  - 그들의 탄식
  lexicon: HALOT
  rationale: נַאֲקָה는 압제 아래에서 터져 나오는 고통스러운 신음/신음소리를 가리키므로, 집단적이고 지속적인 고통을 드러내는 ‘신음 소리’가 가장 자연스럽습니다.
- source_word: וַיִּזְכֹּר
  english_pob_choice: remembered
  chosen_korean: 기억하셨습니다
  alternatives_korean:
  - 생각해 내셨습니다
  - 마음에 두셨습니다
  - 언약을 실행하셨습니다
  lexicon: HALOT
  rationale: 언약 문맥에서 ‘기억하다’는 단순한 망각의 반대가 아니라 언약에 신실하게 반응하심을 뜻하므로, 본문 표현을 유지하면서도 한국어로는 ‘기억하셨습니다’가 가장 직접적입니다.
- source_word: בְּרִיתוֹ
  english_pob_choice: his covenant
  chosen_korean: 자신의 언약
  alternatives_korean:
  - 그의 언약
  - 그분의 언약
  - 자기 언약
  lexicon: HALOT
  rationale: 소유 접미사는 하나님의 언약임을 나타내므로, 한국어에서는 서술 흐름을 부드럽게 하되 소유 관계를 분명히 하는 ‘자신의 언약’이 적절합니다.
theological_decisions:
- issue: ‘기억하다’의 언약적 의미
  chosen_reading: 본문의 ‘기억하셨습니다’를 유지하고, 그것이 곧 언약적 신실함을 뜻한다는 점은 본문 맥락으로 드러나게 둡니다.
  alternative_readings:
  - 그분은 언약에 따라 행동하셨습니다
  - 그분은 언약을 실행에 옮기셨습니다
  - 그분은 언약을 되새기셨습니다
  rationale: 히브리어는 하나님의 전형적인 언약 언어를 사용하므로, 해석을 본문 안에 과도하게 주입하기보다 ‘기억하다’의 표면 의미를 살려 신학적 긴장을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
