base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/004.yaml
  text: And his sister stood at a distance[b][a], to know what would be done to him.
  footnotes:
  - marker: a
    text: Or 'from afar' or 'far off.'
    reason: lexical_alternative
  - marker: b
