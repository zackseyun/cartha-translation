translation:
  language: ko
  text: 그의 누이가 멀찍이 서서, 그에게 무슨 일이 일어날지 알아보려고 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּתַצַּב
  english_pob_choice: stood
  chosen_korean: 서서
  alternatives_korean:
  - 자리를 잡고 서서
  - 자기 위치에 섰습니다
  lexicon: HALOT
  rationale: 히트파엘/연속형 동사는 ‘서다’의 반사적 뉘앙스를 띠지만, 한국어에서는 자연스럽게 ‘서서’로 옮기면 충분히 그 자세를 보존할 수 있습니다.
- source_word: מֵרָחֹק
  english_pob_choice: at a distance
  chosen_korean: 멀찍이
  alternatives_korean:
  - 멀리
  - 멀리서
  - 먼 발치에서
  lexicon: HALOT
  rationale: 공간적 거리를 드러내는 표현이므로, 문맥상 자연스럽고 거리감을 살리는 ‘멀찍이’가 적절합니다.
- source_word: לְדֵעָה מַה יֵּעָשֶׂה לוֹ
  english_pob_choice: to know what would be done to him
  chosen_korean: 그에게 무슨 일이 일어날지 알아보려고 했습니다
  alternatives_korean:
  - 그에게 무엇이 행해질지 알기 위해
  - 그에게 무슨 일이 될지 알아보려고 했습니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘그에게 무엇이 행해질지 알다’이지만, 한국어에서는 수동적 ‘행해질지’를 유지하되 의미를 자연스럽게 풀어 ‘무슨 일이 일어날지’로 옮겼습니다.
