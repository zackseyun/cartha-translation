lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  english_pob_choice: the next day
  chosen_korean: 다음 날
  alternatives_korean:
  - 그 이튿날
  - 둘째 날
  lexicon: HALOT
  rationale: 직역의 ‘둘째 날’보다 사건 진행을 자연스럽게 드러내는 현대 서술 표현인 ‘다음 날’이 적절합니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보라
  alternatives_korean:
