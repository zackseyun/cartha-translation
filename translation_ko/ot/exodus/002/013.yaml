  lexicon: HALOT
  rationale: 갑작스러운 발견과 장면 전환의 효과를 살리기 위해 감탄적 주의 환기 표현인 ‘보라’를 썼습니다.
- source_word: לָרָשָׁע
  english_pob_choice: the wicked one
  chosen_korean: 그 악한 자
  alternatives_korean:
  - 그 악인
  - 그 잘못한 자
  lexicon: HALOT
  rationale: 어근 רָשָׁע의 기본 의미인 도덕적 악함을 유지하되, 이 장면의 특정 가해자를 가리키는 호칭으로 자연스럽게 옮겼습니다.
- source_word: רֵעֶךָ
  english_pob_choice: your companion
  chosen_korean: 네 동료
  alternatives_korean:
  - 네 이웃
  - 네 동무
  - 네 동료 사람
  lexicon: HALOT
  rationale: 여기서는 일반적 율법 용어의 ‘이웃’보다 같은 집단의 상대를 가리키는 관계어가 더 자연스러워 ‘동료’로 옮겼습니다.
