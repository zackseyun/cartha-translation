  source_fidelity: ‘나가 보니’는 וַיֵּצֵא(‘나갔습니다’)에 ‘보고 알게 됨’의 의미를 덧붙입니다. 또한 현행 각주 표지는 해당 본문의 어휘에 붙어 있지 않아, 표지와 각주의 대응을 바로잡아야 합니다. 개정문은 וְהִנֵּה의 장면 제시 기능을 자연스러운 접속어로 처리하고, רָשָׁע의 평가적 의미를 ‘악한 자’로 유지합니다.
  naturalness: ‘보라’는 현대 한국어 산문에서 문장 중간에 놓일 때 매우 부자연스럽습니다. ‘그런데’는 이 문맥에서 새 장면을 제시하는 히브리어 וְהִנֵּה를 자연스럽게 전달합니다. 인용문의 종결도 요청된 현대 합쇼체에 맞추어 ‘치고 있습니까?’로 고쳤습니다.
  terminology: ‘히브리 사람’, ‘악한 자’, ‘동료’는 각각 עִבְרִים, רָשָׁע, רֵעֶךָ에 적절합니다. ‘악한 자’는 이 장면에서의 도덕적 평가를 보존하며, 인물의 항구적 성품에 관한 추가 판단을 요구하지 않습니다.
  issues:
  - severity: medium
    issue: ‘나가 보니’가 원문에 없는 지각·발견의 의미를 첨가합니다.
    rationale: וַיֵּצֵא는 단순히 ‘그가 나갔다’라는 서술입니다. 발견의 효과는 뒤따르는 וְהִנֵּה가 담당하므로, 두 표현을 분리하는 편이 충실합니다.
  - severity: medium
