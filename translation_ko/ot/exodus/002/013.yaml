base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
  footnotes:
  - marker: a
    text: Or “the wicked one” / “the wrongdoer” for “the guilty one.”
    reason: lexical_alternative
  - marker: b
    text: Or “your fellow” or “your neighbor” for “your companion.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 다음 날 나가 보니, 보라, 히브리 사람 둘이 서로 싸우고 있었습니다. 그는 그 악한 자에게 말했습니다. “어찌하여 네 동료를 치고 있느냐?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “둘째 날”
    reason: lexical_alternative
  - marker: b
    text: 또는 “보라”는 강한 주의 환기 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  english_pob_choice: the next day
  chosen_korean: 다음 날
  alternatives_korean:
  - 그 이튿날
  - 둘째 날
  lexicon: HALOT
  rationale: 직역의 ‘둘째 날’보다 사건 진행을 자연스럽게 드러내는 현대 서술 표현인 ‘다음 날’이 적절합니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보라
  alternatives_korean:
  - 그리고 보니
  - 그런데
  lexicon: HALOT
  rationale: 갑작스러운 발견과 장면 전환의 효과를 살리기 위해 감탄적 주의 환기 표현인 ‘보라’를 썼습니다.
- source_word: לָרָשָׁע
  english_pob_choice: the wicked one
  chosen_korean: 그 악한 자
  alternatives_korean:
  - 그 악인
  - 그 잘못한 자
  lexicon: HALOT
  rationale: 어근 רָשָׁע의 기본 의미인 도덕적 악함을 유지하되, 이 장면의 특정 가해자를 가리키는 호칭으로 자연스럽게 옮겼습니다.
- source_word: רֵעֶךָ
  english_pob_choice: your companion
  chosen_korean: 네 동료
  alternatives_korean:
  - 네 이웃
  - 네 동무
  - 네 동료 사람
  lexicon: HALOT
  rationale: 여기서는 일반적 율법 용어의 ‘이웃’보다 같은 집단의 상대를 가리키는 관계어가 더 자연스러워 ‘동료’로 옮겼습니다.
