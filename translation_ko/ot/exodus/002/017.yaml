- from: 그때 목자들이 와서 그들을 쫓아냈습니다[a]. 그러나 모세가 일어나 그들을 구해 주고, 그들의 양 떼에 물을 먹였습니다.
  to: 그때 목자들이 와서 그 여인들을 쫓아냈습니다[a]. 모세가 일어나 그들을 구해 주었으며, 그들의 가축 떼에게 물을 먹였습니다.
  rationale: 원문의 집합명사 צֹאן의 범위를 보존하도록 ‘양 떼’를 ‘가축 떼’로 바꾸고, 물을 먹이는 대상에 맞는 조사를 사용했습니다. 각주는 ישׁע의 구출 의미를 유지하되 본문 문맥을 넘어서는 ‘해방’의 뉘앙스를 제거했습니다. ‘그 여인들’은 바로 앞 문맥의 르우엘의 딸들을 명확히 가리키며, 히브리어 대명사의 지시 대상을 자연스럽게 드러냅니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:29Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 서술 순서와 핵심 동사(오다, 몰아내다, 일어나다, 구하다, 물을 먹이다)는 대체로 충실합니다. 다만 צֹאן은 양만이 아니라 염소를 포함할 수 있는 작은 가축의 집합 명사이므로 ‘양 떼’는 범위를 다소 좁힙니다.
  naturalness: ‘그들의 양 떼에 물을 먹였습니다’는 목적격·여격 결합이 다소 부자연스럽습니다. ‘그들의 가축 떼에게 물을 먹였습니다’가 현대 표준어에서 더 자연스럽고 의미도 분명합니다. 또한 두 번째 절을 완결된 합쇼체 연결로 다듬었습니다.
  terminology: ‘목자들’, ‘쫓아냈습니다’, ‘구해 주었습니다’는 문맥과 현대적 격식체에 적절합니다. ‘구원했습니다’는 가능한 어휘 선택이나 신학적 함의가 강하게 들릴 수 있어, 각주의 대안은 문맥상 ‘건져 주었습니다’로 제시하는 편이 더 중립적입니다.
