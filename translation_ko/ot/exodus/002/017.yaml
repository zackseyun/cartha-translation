base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
  footnotes:
  - marker: a
    text: Or 'delivered them.' The Hebrew verb can denote rescue or deliverance; here it refers to Moses rescuing the women from the shepherds' harassment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 목자들이 와서 그들을 쫓아냈습니다[a]. 그러나 모세가 일어나 그들을 구해 주고, 그들의 양 떼에 물을 먹였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 구원했습니다.’ 히브리어 동사는 구출이나 해방을 뜻할 수 있으며, 여기서는 모세가 목자들로부터 그 여인들을 구해 낸 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  english_pob_choice: the shepherds
  chosen_korean: 목자들
  alternatives_korean:
  - 양치는 사람들
  - 목동들
  lexicon: HALOT
  rationale: 목양하는 사람들을 가리키는 단어로, 한국어에서는 ‘목자들’이 가장 자연스럽고 문맥상 맞습니다.
- source_word: וַיְגָרְשׁוּם
  english_pob_choice: drove them away
  chosen_korean: 그들을 쫓아냈습니다
  alternatives_korean:
  - 그들을 몰아냈습니다
  - 그들을 내쫓았습니다
  lexicon: HALOT
  rationale: גרש의 강한 추방·몰아냄의 뜻을 살리면서, 여성들을 향한 적대적 행동을 분명하게 드러냅니다.
- source_word: וַיּוֹשִׁעָן
  english_pob_choice: saved them
  chosen_korean: 그들을 구해 주고
  alternatives_korean:
  - 그들을 구원하고
  - 그들을 건져 주고
  lexicon: HALOT
  rationale: ישׁע의 핵심 의미는 ‘구하다’이므로, 단순한 도움보다 구출의 뉘앙스를 살린 표현을 택했습니다.
- source_word: צֹאנָם
  english_pob_choice: their flock
  chosen_korean: 그들의 양 떼
  alternatives_korean:
  - 그들의 떼
  - 그들의 가축 떼
  lexicon: HALOT
  rationale: צאן의 집합명사성을 유지하면서도 한국어에서 자연스러운 ‘양 떼’로 옮겼습니다.
theological_decisions:
- issue: וַיּוֹשִׁעָן의 구원/구출 범위
  chosen_reading: 모세가 그 여인들을 목자들의 폭력적 내쫓음에서 구출한 것으로 읽었습니다.
  alternative_readings:
  - 단순히 도움을 준 것으로 읽을 수 있습니다.
  - 생명의 위협에서 구원한 것으로 읽을 수 있습니다.
  rationale: 문맥상 즉각적인 위협은 목자들의 괴롭힘과 축출이며, 본문의 구원은 그 상황에서의 실제적 구출을 뜻합니다.
  doctrine_reference: 출애굽기 2장 내러티브 문맥
