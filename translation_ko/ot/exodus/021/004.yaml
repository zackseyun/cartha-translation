  - ~하면
  lexicon: HALOT
  rationale: 법률 문맥의 조건절이므로 한국어도 조건을 분명히 드러내는 '-면' 구조로 옮겼습니다.
- source_word: אֲדֹנָיו
  english_pob_choice: his master
  chosen_korean: 그의 주인
  alternatives_korean:
  - 그의 주
  - 그의 소유자
  lexicon: HALOT
  rationale: 노예/종의 법적 관계를 나타내는 표현이므로 '주인'을 택해 영어 POB의 'master'와 같은 관계성을 유지했습니다.
- source_word: יֵצֵא בְגַפּוֹ
  english_pob_choice: he shall go out by himself
  chosen_korean: 그는 혼자 나가게 됩니다
  alternatives_korean:
  - 그는 혼자 나가게 됩니다
  - 그는 동행 없이 나가게 됩니다
  lexicon: HALOT
  rationale: 직역하면 '혼자서/동행 없이 나가다'이므로, 법적 맥락에서 자연스럽고 의미가 분명한 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 아내와 자녀의 소속을 어떻게 표현할지
  chosen_reading: '''아내와 그 자녀들은 그녀의 주인에게 속하게 되고''로 옮겨, 소속/귀속의 법적 관계를 분명히 했습니다.'
  alternative_readings:
  - '''아내와 그 자녀들은 그녀의 주인의 것이 되고'''
  - '''아내와 그 자녀들은 그녀의 주인에게 남게 되고'''
  rationale: 히브리어 תִּהְיֶה לַאדֹנֶיהָ는 단순한 동거가 아니라 법적 소속 상태를 가리키므로, 관계를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §1, §6
