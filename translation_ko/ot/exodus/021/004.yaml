  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
  footnotes:
  - marker: a
    text: Or, 'the wife and her children shall be her master's.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'go out by himself,' that is, leave alone without the wife and children given during his term of service.
    reason: cultural_note
translation:
  language: ko
  text: 그의 주인이 그에게 아내를 주고 그녀가 그에게 아들들이나 딸들을 낳으면, 아내와 그 자녀들은 그녀의 주인에게 속하게 되고[a], 그는 혼자 나가게 됩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '아내와 그 자녀들은 그녀의 주인의 것이 됩니다.'
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '혼자 나가다'는 그가 봉사 기간에 주인에게서 받은 아내와 자녀를 동반하지 않고 떠나는 것을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: -면 / 만일
  alternatives_korean:
