    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: Now these
  chosen_korean: 이제 이것들은
  alternatives_korean:
  - 그리고 이것들은
  - 이것들은
  lexicon: HALOT
  rationale: ו와 지시어의 담화 전환을 살리되, 한국어에서는 자연스러운 시작어로 ‘이제’를 두어 앞 문맥과의 연결을 표현했습니다.
- source_word: הַמִּשְׁפָּטִים
  english_pob_choice: the judgments
  chosen_korean: 재판 규정들
  alternatives_korean:
  - 판결들
  - 규례들
  - 법규들
  lexicon: HALOT
  rationale: 이 용어는 단순한 일반 법칙이 아니라 공동체의 법적 판정·사례 규범을 가리키므로, ‘재판 규정들’로 옮겨 법적 판례성의 뉘앙스를 드러냈습니다.
- source_word: תָּשִׂים לִפְנֵיהֶם
  english_pob_choice: you shall set before them
  chosen_korean: 네가 그들 앞에 두어야 할
  alternatives_korean:
  - 너는 그들 앞에 놓아야 할
  - 그들 앞에 제시해야 할
  lexicon: HALOT
  rationale: שׂוּם의 ‘두다/놓다’ 의미와 לִפְנֵי의 ‘앞에, 면전에서’ 뜻을 함께 살려, 모세가 백성 앞에 공식적으로 제시하는 행위를 표현했습니다.
theological_decisions:
- issue: מִשְׁפָּטִים의 한국어 범주 선택
  chosen_reading: ‘재판 규정들’로 번역해 법정적 판단과 공동체적 사례법의 성격을 드러냈습니다.
  alternative_readings:
  - ‘규례들’
  - ‘법들’
  - ‘판결들’
  rationale: 문맥상 출애굽기 21–23장의 언약법 도입부이므로, 추상적 ‘법’보다 판정된 규범이라는 स्रोत 의미를 드러내는 쪽이 더 직접적입니다.
  doctrine_reference: Translation philosophy §1, §5
