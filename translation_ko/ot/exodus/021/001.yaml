  source_fidelity: וְאֵלֶּה의 접속 기능은 시간 부사 ‘이제’를 요구하지 않습니다. הַמִּשְׁפָּטִים는 이 문맥에서 공동체에 제시될 법적 규정/판결의 범주를 가리키며, ‘법규들’은 자연스러우면서도 충분히 포괄적인 번역입니다. תָּשִׂים לִפְנֵיהֶם은 ‘그들 앞에 제시해야 할’로 정확히 옮겨집니다.
  naturalness: 현 번역의 ‘이제 이것들은’과 ‘재판 규정들’은 현대 한국어에서 다소 부자연스럽고 중복적으로 들립니다. ‘다음은 … 법규들입니다’는 법전 도입 문맥에 자연스럽고 합쇼체 문체에도 맞습니다.
  terminology: ‘법규들’로 본문을 간결하게 옮기고, 각주에서 ‘판결들’과 ‘규례들’이라는 어휘적 대안을 제시합니다. ‘판례들’은 현대 한국어에서 선례로서의 법원 판결을 뜻하는 경향이 강하므로 여기서는 피하는 것이 안전합니다.
  issues:
