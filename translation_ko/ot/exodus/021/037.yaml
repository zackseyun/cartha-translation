source:
  edition: WLC
  text: כִּ֤י יִגְנֹֽב אִישׁ֙ שׁ֣וֹר אוֹ שֶׂ֔ה וּ/טְבָח֖/וֹ א֣וֹ מְכָר֑/וֹ חֲמִשָּׁ֣ה בָקָ֗ר יְשַׁלֵּם֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/אַרְבַּע צֹ֖אן תַּ֥חַת הַ/שֶּֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
  footnotes:
  - marker: a
    text: Hebrew שֶׂה can more broadly denote a head of small livestock, including a sheep or a goat; here 'sheep' is chosen because the restitution clause uses 'four sheep' and the verse reads most naturally that way in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'he shall make restitution.' The Hebrew verb can carry the fuller legal sense of paying compensation.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 사람이 소나 양을 훔쳐 그것을 도살하거나 팔면, 소 한 마리 대신 소 다섯 마리를 배상하고 양 한 마리 대신 양 네 마리를 배상해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 더 넓게 양이나 염소를 포함하는 작은 가축을 가리킬 수 있지만, 이 절에서는 배상 항목과 문맥상 ‘양’이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘배상하다’라는 더 넓은 법적 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - ~할 때
  - ~하면
  lexicon: HALOT
  rationale: 가법 조항의 조건문을 한국어 법률 문체로 자연스럽게 시작하기에 ‘만일’이 가장 직접적입니다.
- source_word: שׁוֹר
  english_pob_choice: ox
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 우
  lexicon: HALOT
  rationale: 이 문맥에서는 가축 일반이 아니라 도난 보상 대상의 한 종류이므로, 현대 한국어에서 가장 자연스럽고 포괄적인 ‘소’로 옮겼습니다.
- source_word: שֶׂה
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 어린 양
  - 작은 가축
  lexicon: HALOT
  rationale: 영어 POB가 보상 조항의 자연스러움을 위해 ‘sheep’을 택한 흐름을 따라, 한국어도 ‘양’으로 통일해 본문의 대응을 분명히 했습니다.
- source_word: טבח / מכר
  english_pob_choice: slaughters it or sells it
  chosen_korean: 도살하거나 팔면
  alternatives_korean:
  - 잡아 죽이거나 팔면
  - 잡아서 팔거나 도살하면
  lexicon: HALOT
  rationale: טבח의 구체적 의미는 단순히 ‘죽이다’가 아니라 도살/도축이므로 ‘도살하다’로 살리고, מכר는 ‘팔다’로 직역했습니다.
- source_word: חֲמִשָּׁה בָקָר
  english_pob_choice: five cattle
  chosen_korean: 소는 다섯 마리로
  alternatives_korean:
  - 소 다섯 마리로
  - 다섯 마리의 소로
  lexicon: HALOT
  rationale: בקר의 집합적 의미를 유지하면서도 현대 한국어에서 자연스럽게 보상 수량을 표현하기 위해 ‘소는 다섯 마리로’라고 옮겼습니다.
- source_word: תַּחַת
  english_pob_choice: for
  chosen_korean: —로
  alternatives_korean:
  - 대신
  - ~에 대하여
  lexicon: HALOT
  rationale: 대체·배상의 의미를 한국어 보상 공식으로 드러내기 위해 결과형 종결과 함께 ‘~로 갚다’를 사용했습니다.
theological_decisions:
- issue: 법조문의 보상 공식에서 תַּחַת의 의미
  chosen_reading: ‘~로 갚다’로 번역해 단순한 대가가 아니라 대체/배상의 법적 성격을 드러냈습니다.
  alternative_readings:
  - ‘대신’
  - ‘값으로’
  rationale: 이 절은 훔친 가축을 처분한 경우의 배상 규정이므로, 한국어에서도 법적 보상과 대체의 의미가 드러나야 합니다.
  doctrine_reference: 토라의 배상법은 단순 환산이 아니라 책임 회복의 공적 절차를 전제합니다.
