id: EXO.21.31
reference: Exodus 21:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוֹ בֵ֥ן יִגָּ֖ח אוֹ בַ֣ת יִגָּ֑ח כַּ/מִּשְׁפָּ֥ט הַ/זֶּ֖ה יֵעָ֥שֶׂה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/031.yaml
  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
  footnotes:
  - marker: a
    text: That is, the same legal penalty stated in the previous verse applies if the ox gores a son or a daughter.
    reason: cross_reference
  - marker: b
    text: Or 'according to this rule' or 'according to this ordinance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 소가 아들이나 딸을 들이받으면, 그에게 이 판결대로 처분해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 소가 아들이나 딸을 들이받았을 때에도 앞 절에서 정해진 동일한 법적 처벌이 적용됩니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘이 규칙에 따라’ 혹은 ‘이 규례에 따라’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  english_pob_choice: If
  chosen_korean: ~면
  alternatives_korean:
  - 또는
  - 만일
  lexicon: HALOT
  rationale: 법률 조항의 조건문으로 기능하므로 한국어에서는 ‘~면’으로 자연스럽게 조건을 열어 주는 것이 원문의 casuistic 흐름을 잘 살립니다.
- source_word: יִגָּח
  english_pob_choice: it gores
  chosen_korean: 받다
  alternatives_korean:
  - 받침
  - 들이받다
  - 뿔로 들이받다
  lexicon: HALOT
  rationale: 히브리어의 초점은 앞 장면의 소가 사람을 ‘받아 상하게 하는’ 법적 사건에 있으므로, 문맥상 한국어에서는 ‘받다’로 처리해 바로 앞 절과 연결되도록 했습니다.
- source_word: בֵן / בַת
  english_pob_choice: a son / a daughter
  chosen_korean: 아들 / 딸
  alternatives_korean:
  - 아들 / 딸아이
  - 아들 / 딸 자녀
  lexicon: HALOT
  rationale: 히브리어의 성별 대구를 그대로 살리기 위해 ‘아들’과 ‘딸’로 옮겼습니다. 법문체에서는 ‘자녀’로 묶지 않고 쌍을 유지하는 편이 원문에 가깝습니다.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  english_pob_choice: according to this judgment
  chosen_korean: 이 판결에 따라
  alternatives_korean:
  - 이 규례에 따라
  - 이 법에 따라
  - 이 판정에 따라
  lexicon: HALOT
  rationale: משפט는 여기서 단순한 추상적 ‘법’보다 앞 절에 제시된 법적 처분을 가리키므로, ‘판결’이 그 결정을 지시하는 뉘앙스를 비교적 잘 반영합니다.
- source_word: יֵעָשֶׂה
  english_pob_choice: it shall be done
  chosen_korean: 처리해야 합니다
  alternatives_korean:
  - 행해져야 합니다
  - 되어야 합니다
  - 시행해야 합니다
  lexicon: HALOT
  rationale: 히브리어 수동형의 법률 문체를 한국어로 너무 딱딱한 직역으로 고정하기보다, 문맥상 ‘그에게 적용될 법적 조치가 집행된다’는 뜻을 분명히 하는 표현으로 옮겼습니다.
