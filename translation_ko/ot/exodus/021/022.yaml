id: EXO.21.22
reference: Exodus 21:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יִנָּצ֣וּ אֲנָשִׁ֗ים וְ/נָ֨גְפ֜וּ אִשָּׁ֤ה הָרָה֙ וְ/יָצְא֣וּ יְלָדֶ֔י/הָ וְ/לֹ֥א יִהְיֶ֖ה אָס֑וֹן עָנ֣וֹשׁ יֵעָנֵ֗שׁ כַּֽ/אֲשֶׁ֨ר יָשִׁ֤ית עָלָי/ו֙ בַּ֣עַל הָֽ/אִשָּׁ֔ה וְ/נָתַ֖ן בִּ/פְלִלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
  footnotes:
  - marker: a
    text: Literally, 'her children come out.' This may refer to a premature birth; some translations render it 'so that she gives birth prematurely,' while others interpret it as miscarriage.
    reason: lexical_alternative
  - marker: b
    text: Or 'harm.' The Hebrew does not specify in this verse alone whether the serious injury concerns the mother, the child, or either one.
    reason: alternative_reading
  - marker: c
    text: Or 'by judicial decision' / 'before the court.'
    reason: lexical_alternative
translation:
  language: ko
  text: 두 사람이 서로 싸우다가 임신한 여인을 쳐서 그 아이가 나오게 하되, 다른 해가 없으면, 그가 반드시 벌금을 물어야 합니다. 곧 그 여자의 남편이 그에게 부과하는 대로, 그리고 판결에 따라 갚아야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 아이들이 나오다’입니다. 일부 번역은 이를 조산으로, 다른 번역은 유산으로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 이 절만으로 그 ‘해’가 어머니, 아이, 또는 둘 중 누구에게 미치는지 분명히 말하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: ‘판결에 따라’ 또는 ‘재판적으로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִנָּצוּ אֲנָשִׁים
  english_pob_choice: When men struggle together
  chosen_korean: 두 사람이 서로 싸우다가
  alternatives_korean:
  - 사람들이 서로 다투다가
  - 남자들이 서로 싸우다가
  lexicon: HALOT
  rationale: 법문 맥락의 충돌 상황을 자연스럽게 살리면서도, מקור의 행위가 단순 언쟁이 아니라 신체적 충돌이라는 점을 드러내기 위해 ‘서로 싸우다가’로 옮겼습니다.
- source_word: וְנָגְפוּ אִשָּׁה הָרָה
  english_pob_choice: and strike a pregnant woman
  chosen_korean: 임신한 여인을 쳐서
  alternatives_korean:
  - 임신한 여인을 때려
  - 임신한 여인을 가격하여
  lexicon: HALOT
  rationale: נגע의 물리적 타격 의미를 살리되, 현대 한국어 법문체에서 자연스러운 동사로 ‘치다’를 택했습니다.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  english_pob_choice: so that her children come out
  chosen_korean: 그 아이가 나오게 하되
  alternatives_korean:
  - 그의 자녀들이 나오게 하되
  - 그 아이들이 나오게 하되
  lexicon: HALOT
  rationale: 히브리어의 직역 가능성을 유지하되, 한국어에서는 복수형을 지나치게 강조하면 어색하므로 ‘그 아이’로 옮겨 출산/유출의 결과를 열어 두었습니다.
- source_word: וְלֹא יִהְיֶה אָסוֹן
  english_pob_choice: but there is no harm
  chosen_korean: 다른 해가 없으면
  alternatives_korean:
  - 해가 없으면
  - 심각한 해가 없으면
  lexicon: HALOT
  rationale: אָסוֹן의 중대함은 살리되, 해당 어휘의 범위를 과도하게 좁히지 않기 위해 ‘다른 해’로 옮겼습니다.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  english_pob_choice: he shall surely be fined
  chosen_korean: 그가 반드시 벌금을 물어야 합니다
  alternatives_korean:
  - 그가 반드시 벌을 받아야 합니다
  - 그가 반드시 벌금형을 받아야 합니다
  lexicon: HALOT
  rationale: 뒤따르는 금전 부과 문맥을 반영해 일반적 ‘벌’보다 구체적인 ‘벌금’을 사용했습니다.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  english_pob_choice: as the woman's husband imposes on him
  chosen_korean: 곧 그 여자의 남편이 그에게 부과하는 대로
  alternatives_korean:
  - 그 여자의 남편이 그에게 정하는 대로
  - 그 여자의 남편이 그에게 매기는 대로
  lexicon: HALOT
  rationale: ‘정하다/매기다’보다 법적 부담을 직접 드러내는 ‘부과하다’가 문맥에 더 적합합니다.
- source_word: בִּפְלִלִים
  english_pob_choice: according to the judges
  chosen_korean: 그리고 판결에 따라
  alternatives_korean:
  - 그리고 재판관들에 따라
  - 그리고 재판의 판단에 따라
  lexicon: HALOT
  rationale: בִּפְלִלִים는 재판적 판단을 가리키므로, 인적 주체를 명시하지 않고 절차적 결과를 드러내는 ‘판결에 따라’로 옮겼습니다.
theological_decisions:
- issue: יָצְאוּ יְלָדֶיהָ의 사건 범위
  chosen_reading: 본문은 유산인지 조산인지, 또는 아이가 살아 나오는지에 대해 단정하지 않고 ‘그 아이가 나오게 하되’로 남겨 둡니다.
  alternative_readings:
  - ‘유산하게 하되’
  - ‘조산하게 하되’
  - ‘아이들이 나오게 하되’
  rationale: 히브리어 표현이 결과를 명시적으로 한정하지 않으므로, 한국어 본문도 그 긴장을 유지해야 합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
- issue: אָסוֹן의 피해 대상
  chosen_reading: ‘다른 해’로 번역하여, 해가 누구에게 미치는지 본문만으로는 특정하지 않습니다.
  alternative_readings:
  - 어머니의 해
  - 아이의 해
  - 어머니와 아이의 해
  rationale: 본문은 중대한 손상은 말하지만, 그 대상이 어머니인지 아이인지 혹은 둘 다인지 이 절만으로 확정하지 않습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
