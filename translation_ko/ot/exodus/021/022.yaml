  source_fidelity: 수정이 필요합니다. 본문의 ‘그 아이’는 히브리어 יְלָדֶיהָ(‘그 여자의 아이들’)라는 복수형을 단수로 축소하며, 각주 a도 소유 대명사를 ‘그의’로 잘못 옮겼습니다. 또한 ‘다른 해’의 ‘다른’은 원문에 없는 대비를 추가합니다. ‘해’의 대상이 여자, 아이들, 또는 양쪽인지 확정하지 않는 방식은 유지해야 합니다.
