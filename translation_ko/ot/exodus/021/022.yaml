revisions:
- from: 두 사람이 서로 싸우다가 임신한 여인을 쳐서 그 아이가 나오게 하되, 다른 해가 없으면, 그가 반드시 벌금을 물어야 합니다. 곧 그 여자의 남편이 그에게 부과하는 대로, 그리고 판결에 따라 갚아야 합니다.[a][b][c]
  to: 남자들이 서로 싸우다가 임신한 여자를 쳐서 그 여자의 아이들이 나오게 하였는데[a], 해가 없으면[b], 그는 그 여자의 남편이 그에게 부과하는 대로 반드시 벌금을 물고 재판관들의 판결에 따라 지불해야 합니다.[c]
  rationale: 복수형 ‘아이들’을 회복하고, 각주 a의 잘못된 남성 소유 대명사를 바로잡았습니다. 원문에 없는 ‘다른’을 삭제했으며, 유산·조산 및 해의 대상에 관한 해석적 불확정성은 본문과 각주에서 그대로 보존했습니다. 재판 관련 표현은 합쇼체의 자연스러운 현대 한국어로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
