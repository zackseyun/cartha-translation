  naturalness: 현행 ‘반드시 죽임을 당해야 합니다’는 문법상 가능하지만 현대 표준 한국어의 법률적 문맥에서는 다소 부자연스럽고, 비법적 살해를 연상시킬 여지가 있습니다. ‘그 사람’ 및 ‘사형에 처해야 합니다’는 현대 합쇼체 법률 조항으로 명료하고 자연스럽습니다.
