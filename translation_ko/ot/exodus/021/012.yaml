  lexicon: HALOT
  rationale: 히브리어의 절대 부정이 아닌 법률적 강세를 살리기 위해 ‘반드시’와 피동 표현을 함께 사용해, 판결문의 형식을 유지했습니다.
theological_decisions:
- issue: 법률 조항의 어조
  chosen_reading: 예언적 선언이 아니라 공동체 법전의 판결문 어조로, 명령형보다 판결·제재의 형식이 드러나도록 옮겼습니다.
  alternative_readings:
  - 직설적으로 ‘죽여야 합니다’로 옮기기
  - ‘사형에 처해야 합니다’처럼 현대 법률어로 완전히 치환하기
  rationale: 본문은 행위자에게 명령하는 문장이 아니라, 주어진 행위에 대한 법적 결과를 선언합니다. 그래서 강한 제재를 유지하되, 원문과 가까운 판결문 어조를 택했습니다.
  doctrine_reference: 토라의 사례법 문체
- issue: מוֹת יוּמָת의 강도
  chosen_reading: ‘죽임을 당해야 합니다’로 번역해 죽음 형벌의 엄중함을 직접 드러냈습니다.
  alternative_readings:
  - ‘사형에 처해야 합니다’
  - ‘반드시 처형되어야 합니다’
  rationale: ‘사형’은 이해를 돕지만, 원문의 동사 반복이 주는 엄중한 반복 효과를 약화시킬 수 있어 보다 직역에 가까운 피동을 선택했습니다.
  doctrine_reference: 형벌 규정의 강조법
