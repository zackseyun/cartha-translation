lexical_decisions:
- source_word: מַכֵּה
  english_pob_choice: strikes
  chosen_korean: 쳐서
  alternatives_korean:
  - 때려서
  - 강타하여
  - 쳐 죽게 하여
  lexicon: HALOT
  rationale: 동사 נכה의 법률적 사례문 시작을 살리면서도, 결과를 동사 자체에 과도하게 넣지 않도록 ‘쳐서’로 자연스럽게 옮겼습니다.
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 사람을
  alternatives_korean:
  - 한 남자를
  - 한 사람을
  - 어떤 사람을
  lexicon: HALOT
  rationale: 문맥상 피해자의 일반적 인간성을 가리키므로 한국어에서는 성별을 드러내는 ‘남자’보다 중립적인 ‘사람’이 본문의 법률적 범위를 더 잘 드러냅니다.
- source_word: וָמֵת
  english_pob_choice: so that he dies
  chosen_korean: 그가 죽으면
  alternatives_korean:
  - 그가 죽게 되면
  - 그가 죽도록
  - 그리고 그가 죽으면
  lexicon: HALOT
  rationale: 연결사와 완료형의 결과 관계를 한국어 조건문으로 자연스럽게 표현하여, 단순 병렬이 아니라 ‘치명적 결과’임을 분명히 했습니다.
- source_word: מוֹת יוּמָת
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 반드시 죽여야 합니다
  - 틀림없이 사형에 처해집니다
  - 죽을 것이 확실합니다
  lexicon: HALOT
  rationale: 히브리어의 절대 부정이 아닌 법률적 강세를 살리기 위해 ‘반드시’와 피동 표현을 함께 사용해, 판결문의 형식을 유지했습니다.
theological_decisions:
- issue: 법률 조항의 어조
  chosen_reading: 예언적 선언이 아니라 공동체 법전의 판결문 어조로, 명령형보다 판결·제재의 형식이 드러나도록 옮겼습니다.
  alternative_readings:
  - 직설적으로 ‘죽여야 합니다’로 옮기기
  - ‘사형에 처해야 합니다’처럼 현대 법률어로 완전히 치환하기
  rationale: 본문은 행위자에게 명령하는 문장이 아니라, 주어진 행위에 대한 법적 결과를 선언합니다. 그래서 강한 제재를 유지하되, 원문과 가까운 판결문 어조를 택했습니다.
  doctrine_reference: 토라의 사례법 문체
- issue: מוֹת יוּמָת의 강도
  chosen_reading: ‘죽임을 당해야 합니다’로 번역해 죽음 형벌의 엄중함을 직접 드러냈습니다.
  alternative_readings:
  - ‘사형에 처해야 합니다’
  - ‘반드시 처형되어야 합니다’
  rationale: ‘사형’은 이해를 돕지만, 원문의 동사 반복이 주는 엄중한 반복 효과를 약화시킬 수 있어 보다 직역에 가까운 피동을 선택했습니다.
  doctrine_reference: 형벌 규정의 강조법
