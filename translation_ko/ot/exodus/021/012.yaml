  rationale: 문맥상 피해자의 일반적 인간성을 가리키므로 한국어에서는 성별을 드러내는 ‘남자’보다 중립적인 ‘사람’이 본문의 법률적 범위를 더 잘 드러냅니다.
- source_word: וָמֵת
