base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/009.yaml
  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
  footnotes:
  - marker: a
    text: Or, 'according to the custom for daughters.' The Hebrew phrase can denote established legal practice or customary treatment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 그가 자기 아들을 위해 그녀를 정해 두면, 그는 딸들에게 해당하는 권리에 따라 그녀를 대해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘딸들에게 주어지는 관례에 따라.’ 히브리어 구문은 확립된 법적 관행이나 관습적 대우를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 법조문 흐름에서 앞선 경우와의 대비를 분명히 하면서 조건을 여는 표현으로 자연스럽습니다.
- source_word: לִבְנוֹ
  english_pob_choice: for his son
  chosen_korean: 자기 아들에게
  alternatives_korean:
  - 그의 아들을 위해
  - 아들에게
  lexicon: HALOT
  rationale: ל가 이 문맥에서 배정·지정의 방향을 나타내므로, 목적을 살려 ‘자기 아들에게’로 옮겼습니다.
- source_word: יִיעָדֶנָּה
  english_pob_choice: designates her
  chosen_korean: 주기로 정하면
  alternatives_korean:
  - 지정하면
  - 배정하면
  - 약혼시키면
  lexicon: HALOT
  rationale: 의례적·법적 배정의 의미를 살리되, 너무 좁게 ‘약혼시키면’으로 한정하지 않기 위해 중립적인 표현을 택했습니다.
- source_word: כְּמִשְׁפַּט הַבָּנוֹת
  english_pob_choice: according to the rights of daughters
  chosen_korean: 딸들에게 해당하는 권리에 따라
  alternatives_korean:
  - 딸들의 권리에 따라
  - 딸들에게 주어지는 법도에 따라
  - 딸들의 관례에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּט의 법정적 힘을 반영해 단순한 관례보다 ‘권리’의 의미를 살렸고, ‘딸들’은 문자적으로 가장 직접적인 대응입니다.
- source_word: יַעֲשֶׂה לָּהּ
  english_pob_choice: he shall deal with her
  chosen_korean: 그녀를 대해야 합니다
  alternatives_korean:
  - 그녀에게 행해야 합니다
  - 그녀를 대해 주어야 합니다
  - 그녀를 처리해야 합니다
  lexicon: HALOT
  rationale: עשה + ל의 광범위한 대인 행위를 법률 문맥에 맞게, 강압적 뉘앙스 없이 ‘대해야 합니다’로 옮겼습니다.
theological_decisions:
- issue: כמשפט הבנות의 의미 범위
  chosen_reading: 여기서는 단순한 가풍보다, 딸에게 마땅히 돌아가야 할 법적 권리와 대우를 뜻하는 것으로 읽었습니다.
  alternative_readings:
  - 딸들에 대한 관례에 따라
  - 딸들에게 정해진 관습대로
  rationale: 영어 POB가 지적하듯 이 표현은 관습일 수도 있지만, 본문은 종속 여성의 법적 보호를 규정하므로 권리·대우 중심으로 드러내는 것이 더 정확합니다.
  doctrine_reference: Translation philosophy §§1, 3, 4, 5
