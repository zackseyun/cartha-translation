  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male slave or the eye of his female slave and destroys it[c][b][a], he shall let him go free in compensation for his eye.
  footnotes:
  - marker: a
    text: Or, 'and blinds it.' The Hebrew verb can denote ruining or destroying the eye, implying permanent injury.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his male slave ... his female slave.' The law grants freedom as compensation for permanent injury inflicted by the master.
    reason: cultural_note
  - marker: c
    text: Or simply, 'for his eye.' The phrase means release in recompense for the injury to the eye.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 남자가 자기 남종의 눈이나 자기 여종의 눈을 쳐서 그 눈을 못 쓰게 하면, 그 눈에 대한 보상으로 그 종을 자유롭게 풀어 주어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 눈을 멀게 하면.’ 히브리어 동사는 눈을 영구적으로 못 쓰게 만드는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 남종 … 자기 여종’입니다. 이 법은 주인이 가한 영구적 상해에 대한 보상으로 자유를 부여합니다.
    reason: cultural_note
  - marker: c
    text: 또는 단순히 ‘그 눈 대신.’ 이 표현은 눈의 손상에 대한 보상으로 자유롭게 풀어 주는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
