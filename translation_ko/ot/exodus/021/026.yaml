  lexicon: HALOT
  rationale: 히브리어의 소유격과 성별 대비를 살리되, 한국어 성경문맥에서 '종/여종'이 법조문의 직역성과 가독성을 함께 유지합니다. 이 절은 소유와 해방이 전제된 신분 관계를 말하지만, 영어 POB의 'slave'를 그대로 기계적으로 옮기기보다 본문 관용에 맞는 표현을 택했습니다.
- source_word: וְשִׁחֲתָהּ
  english_pob_choice: and destroys it
  chosen_korean: 그것을 망가뜨리면
  alternatives_korean:
  - 그것을 파괴하면
  - 그것을 못 쓰게 하면
  - 그것을 눈멀게 하면
  lexicon: HALOT
  rationale: שחת는 단순한 상처보다 영구적 손상을 뜻할 수 있으므로, '망가뜨리다'로 넓게 옮겨 눈의 기능을 영구적으로 훼손하는 뜻을 살렸습니다. '눈멀게 하다'는 의미를 지나치게 좁힐 수 있어 피했습니다.
- source_word: תַּחַת עֵינֽוֹ
  english_pob_choice: in compensation for his eye
  chosen_korean: 그 눈의 보상으로
  alternatives_korean:
  - 그 눈 대신
  - 그 눈에 대한 배상으로
  - 그 눈의 값으로
  lexicon: HALOT
  rationale: תחת는 법률 문맥에서 대가·보상·대체를 나타내므로, '보상으로'가 판례적 의미를 가장 분명하게 드러냅니다. 영어 POB의 해석을 따라 배상 관계를 명시하되 과도한 법률용어는 피했습니다.
theological_decisions:
- issue: 해방의 보상 구조
  chosen_reading: 눈의 손상에 대한 보상으로 종을 자유롭게 내보내야 합니다
  alternative_readings:
  - 눈에 대한 보상으로 그를 자유롭게 해야 합니다
  - 그의 눈 대신 그를 풀어 주어야 합니다
  rationale: 본문은 신체 훼손에 대한 금전 보상보다 해방 자체를 배상으로 제시합니다. 이 법적 역설을 약화시키지 않기 위해 '자유롭게 내보내야 합니다'를 유지했습니다.
  doctrine_reference: Translation philosophy §1; casuistic law rendering
