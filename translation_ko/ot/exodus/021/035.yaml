  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יִגֹּ֧ף שֽׁוֹר אִ֛ישׁ אֶת שׁ֥וֹר רֵעֵ֖/הוּ וָ/מֵ֑ת וּ/מָ֨כְר֜וּ אֶת הַ/שּׁ֤וֹר הַ/חַי֙ וְ/חָצ֣וּ אֶת כַּסְפּ֔/וֹ וְ/גַ֥ם אֶת הַ/מֵּ֖ת יֶֽחֱצֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
  footnotes:
  - marker: a
    text: Or 'gores' for 'strikes'; the Hebrew verb can denote an ox's forceful blow.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'divide its silver/money,' meaning the sale price of the live ox.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'the dead one'; that is, the dead ox.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 사람의 소가 그의 이웃의 소를 받아 죽이면, 그들은 살아 있는 소를 팔아 그 값을 나누고, 죽은 소도 함께 나누어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘받다/들이받다’의 의미를 가질 수 있어, 소의 공격적 충돌을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 은’을 나누라는 뜻이지만, 여기서는 판매 대금을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘죽은 것’이지만, 문맥상 죽은 소를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And if
  chosen_korean: 만일
  alternatives_korean:
  - 그리고 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 법 조항을 여는 조건문으로 자연스럽게 처리하면서, 이어지는 규정의 가정적 성격을 분명히 살렸습니다.
- source_word: יִגֹּף
  english_pob_choice: strikes
  chosen_korean: 받아 죽이면
  alternatives_korean:
  - 받으면
  - 쳐서 죽이면
  - 들이받아 죽이면
  lexicon: HALOT
  rationale: 소가 상대를 거세게 들이받아 죽게 하는 상황을 한국어로 자연스럽게 드러내기 위해 ‘받아 죽이면’으로 옮겼습니다. 영어의 ‘strikes’보다 더 구체적이지만, 본문 맥락상 소의 공격 행동을 반영합니다.
- source_word: שׁוֹר רֵעֵהוּ
  english_pob_choice: his neighbor's ox
  chosen_korean: 그의 이웃의 소
  alternatives_korean:
  - 이웃의 소
  - 그 이웃의 소
  lexicon: HALOT
  rationale: רֵעַ의 기본 의미인 ‘이웃/동료’를 살려 관계적 대칭성을 유지했고, 법문체에 맞게 소유관계를 분명히 했습니다.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  english_pob_choice: divide its price
  chosen_korean: 그 값을 나누고
  alternatives_korean:
  - 그 돈을 나누고
  - 그 가격을 나누고
  lexicon: HALOT
  rationale: כֶּסֶף가 여기서는 판매 대금, 곧 ‘값’을 가리키므로 문자적으로 ‘은’을 옮기기보다 의미를 드러내는 ‘그 값’이 적절합니다.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  english_pob_choice: and they shall also divide the dead one
  chosen_korean: 죽은 소도 함께 나누어야 합니다
  alternatives_korean:
  - 죽은 것 또한 나누어야 합니다
  - 죽은 소 역시 나누어야 합니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘죽은 것’을 뜻하지만 문맥상 죽은 소를 가리키므로, 이해 가능성과 원문 대응을 함께 고려해 ‘죽은 소’로 풀었습니다.
theological_decisions:
- issue: 보상 분배 규정의 법문체 톤
  chosen_reading: 결과 규정은 ‘나누어야 합니다’로 옮겨 법적 의무를 분명히 했습니다.
  alternative_readings:
  - ‘나눕니다’
  - ‘나누게 됩니다’
  rationale: 히브리어 법조문의 규범적 성격을 반영하기 위해 서술보다 의무를 드러내는 표현을 택했습니다.
  doctrine_reference: 출애굽기의 언약법 조항
