base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
  footnotes:
  - marker: a
    text: Or 'gores' for 'strikes'; the Hebrew verb can denote an ox's forceful blow.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'divide its silver/money,' meaning the sale price of the live ox.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'the dead one'; that is, the dead ox.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 사람의 소가 이웃의 소를 받아[a] 죽게 하면, 살아 있는 소를 팔아 그 판매 대금[b]을 나누고, 죽은 소[c]도 나누어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘치다’ 또는 ‘받다/들이받다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 은/돈’을 나누라는 뜻이며, 여기서는 살아 있는 소를 판 대금을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘죽은 것’이며, 문맥상 죽은 소를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And if
  chosen_korean: 만일
  alternatives_korean:
