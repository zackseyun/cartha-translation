  lexicon: HALOT
  rationale: 법 조항을 여는 조건문으로 자연스럽게 처리하면서, 이어지는 규정의 가정적 성격을 분명히 살렸습니다.
- source_word: יִגֹּף
  english_pob_choice: strikes
  chosen_korean: 받아 죽이면
  alternatives_korean:
  - 받으면
  - 쳐서 죽이면
  - 들이받아 죽이면
  lexicon: HALOT
  rationale: 소가 상대를 거세게 들이받아 죽게 하는 상황을 한국어로 자연스럽게 드러내기 위해 ‘받아 죽이면’으로 옮겼습니다. 영어의 ‘strikes’보다 더 구체적이지만, 본문 맥락상 소의 공격 행동을 반영합니다.
- source_word: שׁוֹר רֵעֵהוּ
  english_pob_choice: his neighbor's ox
  chosen_korean: 그의 이웃의 소
  alternatives_korean:
  - 이웃의 소
  - 그 이웃의 소
  lexicon: HALOT
  rationale: רֵעַ의 기본 의미인 ‘이웃/동료’를 살려 관계적 대칭성을 유지했고, 법문체에 맞게 소유관계를 분명히 했습니다.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  english_pob_choice: divide its price
  chosen_korean: 그 값을 나누고
  alternatives_korean:
  - 그 돈을 나누고
  - 그 가격을 나누고
  lexicon: HALOT
  rationale: כֶּסֶף가 여기서는 판매 대금, 곧 ‘값’을 가리키므로 문자적으로 ‘은’을 옮기기보다 의미를 드러내는 ‘그 값’이 적절합니다.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  english_pob_choice: and they shall also divide the dead one
  chosen_korean: 죽은 소도 함께 나누어야 합니다
  alternatives_korean:
  - 죽은 것 또한 나누어야 합니다
  - 죽은 소 역시 나누어야 합니다
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘죽은 것’을 뜻하지만 문맥상 죽은 소를 가리키므로, 이해 가능성과 원문 대응을 함께 고려해 ‘죽은 소’로 풀었습니다.
