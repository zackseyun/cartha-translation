  source_fidelity: ‘받아 죽이면’은 가능한 번역이지만, 히브리어 יִגֹּף는 ‘치다/받다’의 폭넓은 뜻을 지니므로 본문과 주석에서 공격적 행동으로 지나치게 한정하지 않는 편이 좋습니다. 또한 כַּסְפּוֹ는 살아 있는 소를 판 대금임을 본문에서 분명히 하는 것이 적절합니다.
  naturalness: ‘그들은’은 두 소유자를 가리키지만 선행사가 명시되지 않아 다소 뜬금없습니다. 한국어 법문체에서는 이를 생략하고 절차를 병렬로 제시하는 편이 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 두는 것이 독해와 연결에 유리합니다.
  terminology: ‘이웃의 소’, ‘살아 있는 소’, ‘대금’, ‘죽은 소’는 현대 표준어 합쇼체 법문 맥락에 적절합니다. ‘죽은 소’는 문자적으로는 ‘죽은 것’인 히브리어를 문맥에 따라 명확히 한 번역입니다.
