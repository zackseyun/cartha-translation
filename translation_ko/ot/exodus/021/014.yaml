  to: 그러나 어떤 사람이 자기 이웃을 죽이려고 꾀를 내면, 너는 그를 내 제단에서라도 끌어내어 죽여야 합니다.[a][b]
  rationale: 원문의 목적 표현(‘죽이려고’), 고의적 간계(‘꾀를 내면’), 제단으로부터의 제거, 그리고 처형의 목적을 한국어의 자연스러운 법적 문체로 পুন구성했습니다. ‘라도’는 영어 감사본의 ‘even’ 및 본문의 문맥상 강조를 반영하지만, 그 함의는 각주에서 제한적으로 설명했습니다.
