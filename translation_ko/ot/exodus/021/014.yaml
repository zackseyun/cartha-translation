  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
  footnotes:
  - marker: a
    text: Or 'acts presumptuously against' or 'comes arrogantly against'; the Hebrew verb conveys willful, deliberate action.
    reason: lexical_alternative
  - marker: b
    text: Or 'with cunning' or 'deceitfully.'
    reason: lexical_alternative
  - marker: c
    text: That is, even if he seeks refuge at the altar, he is to be removed for execution.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 어떤 사람이 자기 이웃을 죽이려고 꾀를 내면, 너는 그를 내 제단에서라도 끌어내어 죽여야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘꾀를 내면’은 고의적이고 간교한 행동을 가리킵니다. 또는 ‘간계를 꾸미면’.
    reason: 히브리어 יזיד와 בערמה가 함께 나타내는 의도성과 간계를 설명합니다.
  - marker: b
    text: 제단에서 피난처를 구하더라도, 고의로 죽이려 한 사람은 그곳의 보호를 받을 수 없다는 뜻으로 이해될 수 있습니다.
    reason: ‘내 제단에서라도’의 문화적·법적 함의를 설명하되, 본문보다 넓은 해석을 본문에 삽입하지 않습니다.
