  naturalness: ‘그가 그의 손안에서 발견되면’은 현대 표준 한국어에서 누가 누구의 손안에서 발견되는지 알기 어렵고 부자연스럽습니다. 행위자와 피해자를 명시하면 법조문으로서도 훨씬 명료합니다. ‘반드시 죽임을 당해야 합니다’는 합쇼체 법문 register에 적절합니다.
