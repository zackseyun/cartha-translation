  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גֹנֵ֨ב אִ֧ישׁ וּ/מְכָר֛/וֹ וְ/נִמְצָ֥א בְ/יָד֖/וֹ מ֥וֹת יוּמָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
  footnotes:
  - marker: a
    text: Literally, 'steals a man.' In context this refers to kidnapping or man-stealing.
    reason: lexical_alternative
  - marker: b
    text: 'Or, ''or he is found in his possession.'' Hebrew: ''in his hand,'' an idiom for possession or control.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람을 납치하여 팔거나, 그 납치당한 사람이 납치범의 소유 아래에서 발견되면, 그 납치범은 반드시 죽임을 당해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘사람을 훔치는 자’입니다. 이 문맥에서는 사람을 납치하는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, ‘그 납치당한 사람이 그의 손에 발견되면.’ 히브리어 ‘그의 손에’는 소유나 통제 아래 있음을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב אִישׁ
  english_pob_choice: Whoever kidnaps a man
  chosen_korean: 사람을 납치하여
  alternatives_korean:
  - 사람을 훔쳐
  - 사람을 빼앗아
  lexicon: HALOT
  rationale: 히브리어 동사 גנב는 문자적으로는 ‘훔치다’이지만, 여기서는 사람을 대상으로 하며 뒤에 매매와 소유 상태가 이어지므로 ‘납치하다’가 법적 범죄의 성격을 가장 분명하게 드러냅니다.
- source_word: וּמְכָרוֹ
  english_pob_choice: and sells him
  chosen_korean: 팔거나
  alternatives_korean:
  - 그를 팔거나
  - 팔아 넘기거나
  lexicon: HALOT
  rationale: 3인칭 남성 목적어 ‘그’를 한국어에서 자연스럽게 받도록 하되, 뒤 절과 연결되는 법문체를 살려 ‘팔거나’로 간결하게 옮겼습니다.
- source_word: וְנִמְצָא בְיָדוֹ
  english_pob_choice: or he is found in his hand
  chosen_korean: 그가 그의 손안에서 발견되면
  alternatives_korean:
  - 그가 그의 소유 아래 있으면
  - 그가 그의 손에 있으면
  lexicon: HALOT
  rationale: בְיָדוֹ는 문자적으로 ‘그의 손 안에’이지만, 관용적으로 소유·통제 아래 있음을 뜻하므로 직역성을 살리되 한국어에서는 이해 가능한 ‘발견되면’으로 처리했습니다.
- source_word: מֹות יוּמָת
  english_pob_choice: shall surely be put to death
  chosen_korean: 그는 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 그는 반드시 죽어야 합니다
  - 반드시 사형에 처해야 합니다
  lexicon: HALOT
  rationale: 부정사 절대형과 동사의 강화 구조를 한국어 법문체의 강한 의무 표현으로 옮겨, 단순 예고가 아니라 사법적 형벌 선고임을 나타냈습니다.
theological_decisions:
- issue: 사람을 대상으로 한 ‘גנב’의 의미
  chosen_reading: 이 구절은 일반적인 절도보다 ‘납치/인신매매 목적의 사람 훔침’을 금합니다.
  alternative_readings:
  - 단순히 ‘도둑질한 사람’을 말한다는 읽기
  - 사람을 훔친 뒤 팔지 않은 경우는 제외한다는 읽기
  rationale: 히브리어 어휘와 문맥상 대상이 사람이고 곧바로 판매·점유가 이어지므로, 법조문이 금지하는 범죄는 인신매매형 납치로 이해하는 것이 타당합니다.
  doctrine_reference: 구약 율법의 형사법 조항
- issue: בְיָדוֹ의 משפט적 기능
  chosen_reading: ‘그의 손안에서’는 단순 신체 부위가 아니라 소유·통제 상태를 가리키는 법적 관용구로 보았습니다.
  alternative_readings:
  - 말 그대로 손에 붙들린 상태
  - ‘팔았다’와 동의 반복으로 보는 읽기
  rationale: 영어 POB도 이 표현을 소유/통제의 관용으로 주석 처리하고 있으며, 한국어 본문은 직역성을 유지하되 독자가 오해하지 않도록 의미를 드러냈습니다.
  doctrine_reference: 히브리어 관용구 해석
