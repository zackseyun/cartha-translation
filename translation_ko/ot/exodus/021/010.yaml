  source_fidelity: 핵심 법조문의 구조와 세 항목은 대체로 반영했으나, 원문에 없는 강조어 ‘감히’가 추가되어 금지의 의미를 불필요하게 강화합니다. 또한 ‘부부 생활’은 עֹנָתָהּ의 구체적인 부부 관계상의 권리/의무라는 뜻을 다소 넓고 모호하게 만듭니다.
  naturalness: ‘줄이지 말지니라’는 성경적 문체로 가능하지만, 목표인 현대 합쇼체에는 ‘줄여서는 안 됩니다’가 더 자연스럽습니다. ‘그 아내’는 새로 맞이한 아내를 가리키는 듯 읽힐 수 있으므로, 앞서 언급된 여성임을 드러내는 ‘그 여자의’가 더 명료합니다.
  terminology: ‘음식’과 ‘옷’은 שְׁאֵרָהּ 및 כְּסוּתָהּ에 적절합니다. עֹנָתָהּ는 해석상 논의가 있는 말이지만, 이 문맥에서는 남편이 줄여서는 안 되는 부부 관계상의 권리로 옮기는 것이 가장 적절합니다. 교파적 해석을 덧붙이지 않고 각주에서 대안을 밝혔습니다.
  issues:
