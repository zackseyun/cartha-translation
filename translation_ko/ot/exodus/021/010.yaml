  - severity: medium
    issue: ‘부부 생활’이 עֹנָתָהּ의 의미를 충분히 특정하지 못합니다.
    rationale: 문맥상 이 말은 아내에게 보장되어야 할 부부 관계상의 권리, 곧 남편의 친밀한 부부 관계 의무와 관련됩니다. 본문에서는 권리로 표현하고, 논의되는 어휘적 대안은 각주로 처리하는 것이 적절합니다.
  - severity: low
    issue: ‘그 아내’의 지시 대상이 모호합니다.
    rationale: 히브리어 여성 단수 접미사는 앞 문맥의 기존 여성을 가리킵니다. 한국어에서는 ‘그 여자의’라고 하여 새 아내가 아닌 그 여성을 가리킴을 분명히 할 수 있습니다.
