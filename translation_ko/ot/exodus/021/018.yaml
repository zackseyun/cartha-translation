id: EXO.21.18
reference: Exodus 21:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יְרִיבֻ֣/ן אֲנָשִׁ֔ים וְ/הִכָּה אִישׁ֙ אֶת רֵעֵ֔/הוּ בְּ/אֶ֖בֶן א֣וֹ בְ/אֶגְרֹ֑ף וְ/לֹ֥א יָמ֖וּת וְ/נָפַ֥ל לְ/מִשְׁכָּֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
  footnotes:
  - marker: a
    text: Literally, 'falls to bed'—that is, he is laid up or confined to bed from the injury.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들이 다투다가 한 사람이 돌로든지 자기 주먹으로든지 자기 이웃을 치고, 그가 죽지 않고 누워 있게 되면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘침상에 떨어지다’라는 관용구로, 부상으로 인해 눕게 되거나 거동을 못 하게 되었음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי / If
  english_pob_choice: If
  chosen_korean: 사람들이 다투다가
  alternatives_korean:
  - 만일 사람이 다투면
  - 사람들이 다툴 때
  lexicon: HALOT
  rationale: 사례법 도입부를 한국어 법문체에 자연스럽게 옮기되, 조건문의 기능을 유지하기 위해 ‘다투다가’로 상황 진입을 표현했습니다.
- source_word: יְרִיבֻן אֲנָשִׁים
  english_pob_choice: men quarrel
  chosen_korean: 사람들이 다투다가
  alternatives_korean:
  - 남자들이 서로 다투다가
  - 사람들이 서로 다투다가
  lexicon: HALOT
  rationale: 히브리어 복수 남성형을 직역하면 ‘남자들’이지만, 여기서는 법적 사례의 당사자들을 가리키므로 한국어에서는 성별을 과도하게 강조하지 않고도 원문의 집단적 분쟁 상황을 살렸습니다.
- source_word: בְּאֶבֶן / בְּאֶגְרֹף
  english_pob_choice: with a stone or with his fist
  chosen_korean: 돌로든지 자기 주먹으로든지
  alternatives_korean:
  - 돌이나 주먹으로
  - 돌로든지 주먹으로든지
  lexicon: HALOT
  rationale: 도구적 בְּ를 ‘~로’로 살리고, אֶגְרֹף는 ‘주먹’으로 옮겼습니다. 영어 POB의 ‘his fist’에 맞춰 주먹이 행위자 자신의 것임을 분명히 했습니다.
- source_word: וְנָפַל לְמִשְׁכָּב
  english_pob_choice: is confined to bed
  chosen_korean: 누워 있게 되면
  alternatives_korean:
  - 침상에 눕게 되면
  - 병상에 눕게 되면
  - 치료를 위해 누워 있게 되면
  lexicon: HALOT
  rationale: 직역은 ‘침상에 떨어지다’이지만, 관용적으로 부상으로 인해 움직이지 못하는 상태를 뜻하므로 한국어에서는 ‘누워 있게 되면’으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 폭행 결과를 나타내는 법조문의 어조
  chosen_reading: 본문의 핵심은 도덕적 평가보다 상해의 결과를 규정하는 사례법이므로, 서술을 간결하게 유지했습니다.
  alternative_readings:
  - 도덕적 비난을 더 강하게 드러내는 표현
  - 형벌을 암시하는 확대 번역
  rationale: 히브리어 원문은 상해의 결과와 이후 법적 처리의 전제만 제시하므로, 해석을 앞서지 않도록 법률적 서술에 맞췄습니다.
  doctrine_reference: 사례법(casuistic law) 해석 원칙
- issue: ‘그의 이웃’(רֵעֵהוּ)의 범위
  chosen_reading: ‘자기 이웃’으로 옮겨, 직접적 상대를 뜻하는 관계성을 살렸습니다.
  alternative_readings:
  - ‘다른 사람’
  - ‘동료’
  rationale: רֵעַ는 단순한 지리적 이웃보다 관계적·법적 상대를 가리키는 경우가 많아, 한국어에서도 그 긴장을 살리는 번역이 적절합니다.
  doctrine_reference: 레위기/출애굽기 משפט 용례
