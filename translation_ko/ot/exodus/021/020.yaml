  rationale: 수정문은 조건법 조항의 불특정 주어를 ‘어떤 사람’으로 나타내고, 남녀 노예의 대조를 현대어로 유지했습니다. 마지막 법률 결과는 원문의 강조와 피동성을 반영하여 ‘보복이 이루어져야 합니다’로 옮겼으며, 구체적 형벌을 본문에 덧붙이지 않았습니다. 각주는 ‘처벌’이라는 해석적 대안을 보존하면서 히브리어의 동사 반복에 따른 강조를 정확히 설명합니다.
