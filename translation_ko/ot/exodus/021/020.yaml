  source_fidelity: 조건절, 남녀 노예의 병렬, 막대기라는 도구, 그리고 죽음이라는 결과는 잘 반영되어 있습니다. 다만 ‘반드시 보복해야 합니다’는 행위 주체가 문법적으로 드러나지 않고, 히브리어 נָקֹם יִנָּקֵם의 피동적 ‘보복/응징이 이루어짐’보다 능동적 명령으로 들립니다. 법적 결과의 정확한 방식은 특정하지 않되, 죽은 노예를 위한 보복이라는 원문의 방향을 더 분명히 하는 편이 안전합니다.
  naturalness: ‘남종/여종’은 전통 성경 문체에는 익숙하지만 현대 표준어에서는 다소 고풍스럽습니다. ‘남자 노예/여자 노예’가 예속 신분과 성별 대조를 현대적으로 명료하게 나타냅니다. 또한 ‘그의 손 아래에서’는 원문의 관용적 표현을 보존하면서 소유자와 사망한 노예의 지시 대상을 분명히 합니다.
