source:
  edition: WLC
  text: וְ/כִֽי יַכֶּה֩ אִ֨ישׁ אֶת עַבְדּ֜/וֹ א֤וֹ אֶת אֲמָת/וֹ֙ בַּ/שֵּׁ֔בֶט וּ/מֵ֖ת תַּ֣חַת יָד֑/וֹ נָקֹ֖ם יִנָּקֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male slave or his female slave with a rod[a], and the slave dies under his hand, he must surely be avenged.
  footnotes:
  - marker: a
    text: Or, 'he shall surely be punished.' The Hebrew more literally says, 'he shall surely be avenged,' an emphatic legal formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떤 사람이 자기 남자 노예나 여자 노예를 막대기로 때려, 그 노예가 그의 손 아래에서 죽으면, 그 죽음에 대해 반드시 보복이 이루어져야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그 사람은 반드시 처벌을 받아야 합니다.’ 히브리어는 ‘보복하다’라는 동사를 거듭 사용하여 확실성을 강조한 법률 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִֽי
  english_pob_choice: And if
  chosen_korean: 사람이
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: WLC
  rationale: 히브리어 법률 문맥의 조건절을 한국어에서는 자연스럽게 풀어, 다음 조항의 주어를 먼저 제시하는 방식으로 시작했습니다.
- source_word: יַכֶּה
  english_pob_choice: strikes
  chosen_korean: 치다가
  alternatives_korean:
  - 때리다가
  - 쳐서
  lexicon: HALOT
  rationale: נכה는 폭넓은 ‘치다/때리다’의 뜻이므로, 도구를 동반한 폭행의 진행을 드러내는 ‘치다가’를 선택했습니다.
- source_word: עַבְדּוֹ / אֲמָתוֹ
  english_pob_choice: his male slave / his female slave
  chosen_korean: 남종 / 여종
  alternatives_korean:
  - 남자 노예 / 여자 노예
  - 종 / 여종
  lexicon: HALOT
  rationale: 이 절은 남녀 종을 대조하므로, 한국어 성경에서 널리 쓰이면서도 성별 대비를 분명히 하는 ‘남종/여종’을 택했습니다. 본문이 예속된 신분을 말하므로 단순한 ‘종’보다 구체적입니다.
- source_word: בַּשֵּׁבֶט
  english_pob_choice: with a rod
  chosen_korean: 막대기로
  alternatives_korean:
  - 막대
  - 지팡이로
  - 막대기로
  lexicon: HALOT
  rationale: שֵׁבֶט는 여기서 구타의 도구이므로, 한국어에서는 가장 직접적이고 자연스러운 ‘막대기’로 옮겼습니다.
- source_word: נָקֹם יִנָּקֵם
  english_pob_choice: he must surely be avenged
  chosen_korean: 반드시 보복해야 합니다
  alternatives_korean:
  - 반드시 보복을 받아야 합니다
  - 반드시 응징되어야 합니다
  - 반드시 앙갚음되어야 합니다
  lexicon: HALOT
  rationale: 히브리어는 강한 법률적 확정형이지만, 한국어에서는 수동형을 억지로 만들기보다 판결문의 공적 어조로 ‘반드시 보복해야 합니다’라고 옮겨 원문의 엄중함을 살렸습니다.
theological_decisions:
- issue: נָקֹם יִנָּקֵם의 법적 결과를 어떻게 드러낼지
  chosen_reading: ‘보복해야 합니다’로 옮겨, 정확한 집행 방식은 특정하지 않고 법적 엄중함만 보존했습니다.
  alternative_readings:
  - 반드시 처벌해야 합니다
  - 반드시 보복을 받아야 합니다
  rationale: 본문은 보복의 필요를 강조하지만, 이 절 자체에서 형벌의 구체적 절차까지 명시하지는 않습니다. 따라서 의미를 과도하게 좁히지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
