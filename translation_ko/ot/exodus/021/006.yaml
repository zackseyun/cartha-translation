  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
  footnotes:
  - marker: a
    text: Or 'to the judges.' The Hebrew אֱלֹהִים can in some legal contexts refer to human judges or a judicial authority.
    reason: alternative_reading
translation:
  language: ko
  text: 그러면 그의 주인은 그를 하나님께 데려가고, 문이나 문설주로 데려가 그의 귀를 송곳으로 뚫을 것이며, 그는 영원히 그를 섬길 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재판관들에게’. 히브리어 אֱלֹהִים은 일부 법률 문맥에서 인간 재판관이나 사법 권위를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגִּישׁוֹ אֲדֹנָיו אֶל הָאֱלֹהִים
  english_pob_choice: his master shall bring him to God
  chosen_korean: 그의 주인은 그를 하나님께 데려가고
  alternatives_korean:
  - 그의 주인은 그를 하나님 앞으로 데려가고
  - 그의 주인은 그를 재판관들에게 데려가고
  lexicon: HALOT
  rationale: הִגִּישׁוֹ는 법적 절차에서 누군가를 권위 앞에 데려가는 뜻이므로 ‘데려가고’가 자연스럽고, הָאֱלֹהִים은 기본값대로 ‘하나님’으로 옮겼습니다.
- source_word: הַדֶּלֶת / הַמְּזוּזָה
  english_pob_choice: the door / the doorpost
  chosen_korean: 문이나 문설주
  alternatives_korean:
  - 문이나 문기둥
  - 문과 문설주
  lexicon: HALOT
  rationale: ritual 장소를 구체적이고 직역에 가깝게 살려야 하므로 ‘문’과 ‘문설주’를 사용했습니다.
- source_word: וְרָצַע
  english_pob_choice: shall pierce
  chosen_korean: 송곳으로 뚫을 것이며
  alternatives_korean:
  - 뚫을 것이며
  - 천공할 것이며
  lexicon: HALOT
  rationale: רָצַע는 귀를 뚫는 행위를 가리키므로, 도구인 ‘송곳’을 앞세워 행위의 물리성을 분명히 했습니다.
- source_word: וַעֲבָדוֹ לְעֹלָם
  english_pob_choice: and he shall serve him forever
  chosen_korean: 그는 영원히 그를 섬길 것입니다
  alternatives_korean:
  - 그는 영구히 그를 섬길 것입니다
  - 그는 평생 그를 섬길 것입니다
  lexicon: HALOT
  rationale: לְעֹלָם은 이 문맥에서 종신적 지속을 뜻하지만, POB의 직접성을 살려 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: הָאֱלֹהִים의 의미
  chosen_reading: 본문에서는 ‘하나님’으로 두고, 각주에서 ‘재판관들’ 가능성을 열어 둡니다.
  alternative_readings:
  - 재판관들
  - 법정/재판 권위
  rationale: 히브리어 자체는 하나님과 인간 재판관 모두를 가리킬 수 있으므로, 본문은 가장 직접적인 의미를 유지하고 대안은 주석으로 보존하는 것이 번역 투명성에 맞습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
