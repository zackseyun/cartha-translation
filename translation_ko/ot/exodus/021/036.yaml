  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from yesterday and the day before,'' an idiom meaning the ox had previously shown this behavior.'
    reason: cultural_note
  - marker: b
    text: Or 'accustomed to gore.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the carcass will be his.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「혹 그 소가 전부터 들이받는 습성이 있다는 것이 알려졌는데[a][b], 그 주인이 그 소를 단속하지 않았다면, 그는 반드시 소 한 마리로 그 소를 배상해야 하며, 죽은 짐승은 그의 것이 됩니다.[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘어제와 그저께부터’라고 하며, 이미 이전부터 그 소가 이런 행동을 보였다는 관용 표현입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘들이받는 버릇이 있는’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘사체는 그의 것이 됩니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ / נוֹדַ֗ע כִּ֠י
  english_pob_choice: Or if it was known that
  chosen_korean: 「혹 …인 것이 알려졌고」
  alternatives_korean:
  - 「또 만일 …인 것이 알려졌고」
  - 「혹 …인 것이 드러났고」
  lexicon: HALOT
  rationale: 문두의 א֣וֹ는 대안적 법례를 여는 ‘혹’으로, נוֹדַע는 수동적·상태적 의미를 살려 ‘알려졌고’로 옮겼습니다.
- source_word: שׁוֹר נַגָּח
  english_pob_choice: the ox was accustomed to gore
  chosen_korean: 「그 소가 … 들이받는 습성이 있는」
  alternatives_korean:
  - 「그 소가 … 들이받는 버릇이 있는」
  - 「그 소가 … 들이받는 소인」
  lexicon: HALOT
  rationale: נַגָּח은 단발 행위가 아니라 계속적 성향을 가리키므로, 법률 문맥에 맞게 ‘들이받는 습성이 있는’으로 처리했습니다.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  english_pob_choice: from yesterday and the day before
  chosen_korean: 「어제와 그저께부터」
  alternatives_korean:
  - 「어제와 그제부터」
  - 「예전부터」
  lexicon: HALOT
  rationale: 히브리어 관용구를 비교적 직역해, 이미 이전부터 그 성향이 드러났음을 보존했습니다.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  english_pob_choice: its owner did not keep it in
  chosen_korean: 「그 주인이 그것을 가두어 두지 않았으면」
  alternatives_korean:
  - 「그 주인이 그것을 지키지 않았으면」
  - 「그 주인이 그것을 제어하지 않았으면」
  lexicon: HALOT
  rationale: שׁמר는 여기서 위험한 소를 밖으로 나가지 못하게 관리하는 뜻이므로, 자연스러운 법문체인 ‘가두어 두다’로 옮겼습니다.
- source_word: שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַשּׁ֔וֹר
  english_pob_choice: he must surely pay ox for ox
  chosen_korean: 「그는 반드시 소로 소를 갚아야 하며」
  alternatives_korean:
  - 「그는 반드시 소 대신 소를 배상해야 하며」
  - 「그는 반드시 소 한 마리로 소 한 마리를 보상해야 하며」
  lexicon: HALOT
  rationale: 강조형 어형을 ‘반드시 … 갚아야 하며’로 옮겨 법적 의무를 살렸고, תַּחַת은 간결하게 ‘소로 소를’로 반영했습니다.
theological_decisions:
- issue: 사망한 소의 처분을 나타내는 문구
  chosen_reading: 「죽은 짐승은 그의 것이 됩니다」
  alternative_readings:
  - 「죽은 짐승의 사체는 그의 것이 됩니다」
  - 「죽은 것은 그의 것이 됩니다」
  rationale: 히브리어는 मृत체가 사고 책임자의 소유가 됨을 말하므로, 과도한 전문용어보다 법문맥이 분명한 ‘죽은 짐승’으로 옮겼습니다.
  doctrine_reference: 법례 본문 해석; 소유권 배분
