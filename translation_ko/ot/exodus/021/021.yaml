language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֥ךְ אִם י֛וֹם א֥וֹ יוֹמַ֖יִם יַעֲמֹ֑ד לֹ֣א יֻקַּ֔ם כִּ֥י כַסְפּ֖/וֹ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
  footnotes:
  - marker: a
    text: Or, 'he shall not be punished.' The Hebrew more specifically speaks of vengeance or legal retribution being exacted.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for he is his money,' expressing the slave's economic value to the master.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그가 하루나 이틀 동안 살아 있으면, 그의 값이기 때문에 그에게는 보복하지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그러나/다만’의 제한적 역접을 나타냅니다.
    reason: source_note
  - marker: b
    text: ‘보복하다’는 כאן의 נקם(응보·보복) 계열을 반영합니다. POB의 취지는 일반적 ‘벌하다’보다 법적 응보를 더 분명히 드러내는 데 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: However
  chosen_korean: 그러나
  alternatives_korean:
  - 다만
  - 그러나도
  - 하지만
  lexicon: HALOT
  rationale: 앞선 규정을 제한하는 대조 연결로서, 현대 한국어 법문체에서는 ‘그러나’가 가장 자연스럽고 절제된 역접을 나타냅니다.
- source_word: י֛וֹם א֥וֹ יוֹמַ֖יִם
  english_pob_choice: for a day or two
  chosen_korean: 하루나 이틀 동안
  alternatives_korean:
  - 하루 이틀 동안
  - 하루나 이틀 동안에
  - 하루 혹은 이틀 동안
  lexicon: HALOT
  rationale: 히브리어의 짧은 기간 표현을 한국어 관용에 맞게 옮기되, 수량의 제한성을 그대로 살렸습니다.
- source_word: יַעֲמֹד
  english_pob_choice: remains alive
  chosen_korean: 살아 있으면
  alternatives_korean:
  - 생존하면
  - 남아 있으면
  - 회복하면
  lexicon: HALOT
  rationale: 법적 문맥에서 ‘서다’의 문자성을 피하고, 피해자가 계속 살아 있는 상태를 분명하게 드러내는 표현을 택했습니다.
- source_word: לֹא יֻקַּם
  english_pob_choice: he shall not be avenged
  chosen_korean: 그에게는 보복하지 못합니다
  alternatives_korean:
  - 그는 보복받지 못합니다
  - 그에게는 벌하지 못합니다
  - 그에게는 응징하지 못합니다
  lexicon: HALOT
  rationale: נקום의 법정적 보복/응징 뜻을 살려 ‘벌하다’보다 ‘보복하다’를 택했고, 수동형 취지를 한국어 자연문으로 풀었습니다.
- source_word: כִּי כַסְפּוֹ הוּא
  english_pob_choice: for he is his money
  chosen_korean: 그의 값이기 때문에
  alternatives_korean:
  - 그는 그의 돈이기 때문에
  - 그는 그의 재산이기 때문에
  - 그가 그의 돈이기 때문에
  lexicon: HALOT
  rationale: 직역의 날카로움을 유지하면서도 한국어 독자가 의미를 이해할 수 있도록, 노예의 경제적 가치를 드러내는 ‘값’으로 옮겼습니다.
theological_decisions:
- issue: 노예의 경제적 가치에 대한 노골적 진술
  chosen_reading: ‘그의 값’으로 직역의 의미를 살리되, 문맥상 사람을 물건처럼 취급하는 법문의 냉혹함을 완화하지 않았습니다.
  alternative_readings:
  - 그의 재산이기 때문에
  - 그의 소유이기 때문에
  - 그의 손실이기 때문에
  rationale: 히브리어는 피해자를 주인의 경제적 가치로 설명하므로, 윤리적 불편함을 이유로 소유/손실로 바꾸지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy 1, 6
- issue: 보복 표현의 법정성
  chosen_reading: ‘보복하지 못합니다’로 렌더링하여 개인 감정이 아니라 법적 응보의 부재를 나타냈습니다.
  alternative_readings:
  - 벌하지 못합니다
  - 처벌하지 못합니다
  - 응징하지 못합니다
  rationale: POB의 주석처럼 이 구절은 일반적 처벌보다 법적 보복의 취지를 갖기에, 그 법정적 뉘앙스를 유지하는 표현을 선택했습니다.
  doctrine_reference: Translation philosophy 1, 6
