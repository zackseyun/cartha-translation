id: EXO.21.11
reference: Exodus 21:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם שְׁלָ֨שׁ אֵ֔לֶּה לֹ֥א יַעֲשֶׂ֖ה לָ֑/הּ וְ/יָצְאָ֥ה חִנָּ֖ם אֵ֥ין כָּֽסֶף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/011.yaml
  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
  footnotes:
  - marker: a
    text: Or 'if he does not provide these three things for her.' The Hebrew literally says 'does not do these three for her,' referring back to the food, clothing, and marital rights named in the previous verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 그녀에게 이 세 가지를 해 주지 않으면, 그녀는 아무 돈도 내지 않고 자유롭게 나가게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그녀에게 이 세 가지를 해 주지 않으면’입니다. 이는 바로 앞 절에 나온 음식, 의복, 그리고 부부의 권리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: And if
  chosen_korean: 만일
  alternatives_korean:
  - 그리고 만일
  - 그리고 만약
  lexicon: HALOT
  rationale: 조건문을 자연스럽게 열되, 앞 절과의 연속성을 해치지 않도록 법조문식 한국어로 간결하게 옮겼습니다.
- source_word: שְׁלָשׁ אֵלֶּה
  english_pob_choice: these three things
  chosen_korean: 이 세 가지
  alternatives_korean:
  - 이 세 가지 일
  - 이 셋
  lexicon: HALOT
  rationale: 앞 절의 세 의무를 가리키는 지시를 살려, 영어 POB의 보충 해석처럼 명시적으로 옮기되 원문의 지시성을 유지했습니다.
- source_word: לֹא יַעֲשֶׂה לָהּ
  english_pob_choice: he does not do ... for her
  chosen_korean: 그 여자를 위하여 ... 하지 않으면
  alternatives_korean:
  - 그 여자에게 ... 제공하지 않으면
  - 그 여자를 위하여 이행하지 않으면
  lexicon: HALOT
  rationale: עשה의 넓은 의미를 따라 '하다'를 유지하면서, 문맥상 앞 절의 세 의무를 이행하는 뜻이 드러나도록 했습니다.
- source_word: חִנָּם
  english_pob_choice: free
  chosen_korean: 값없이
  alternatives_korean:
  - 무상으로
  - 공짜로
  lexicon: HALOT
  rationale: 해방의 결과를 '자유'로 풀기보다, 바로 뒤의 כסף와 연결되는 경제적 무상성을 드러내는 표현을 택했습니다.
- source_word: אֵין כָּסֶף
  english_pob_choice: without payment of money
  chosen_korean: 값
  alternatives_korean:
  - 은전
  - 돈
  lexicon: HALOT
  rationale: 히브리어의 כסף가 일반적 화폐/대가를 가리키므로, 한국어에서는 문맥상 자연스러운 '값'으로 압축해 보상이나 매매대가가 없음을 드러냈습니다.
theological_decisions:
- issue: release language in a legal-servitude context
  chosen_reading: 종속 상태에서의 무상 해제를 뜻하는 법적 문맥을 따라 '나가게 됩니다'와 '값없이'로 옮겼습니다.
  alternative_readings:
  - '''자유롭게 나갑니다'''
  - '''대가 없이 풀려납니다'''
  rationale: 출애굽기 21장의 종법 맥락에서는 단순 이동이 아니라 법적 해제의 의미가 핵심이므로, 본문의 완곡한 해방 의도를 과장하지 않으면서도 경제적 조건을 분명히 했습니다.
  doctrine_reference: 출 21:7–11의 종법/해방 규정
- issue: reference of 'three things' to the previous verse
  chosen_reading: 직역을 유지하되, 세 가지가 앞 절의 음식·의복·부부권을 가리킨다는 점은 본문 밖 주해 정보로 처리했습니다.
  alternative_readings:
  - 본문 안에 '먹을 것, 입을 것, 부부의 권리'를 보충하는 번역
  rationale: 독자가 앞 절을 보도록 하는 지시 표현을 살리기 위해 본문에는 간결한 지시만 두고, 해설은 주석으로 옮기는 편이 원문 충실도가 높습니다.
  doctrine_reference: 문맥 지시어 처리 원칙
