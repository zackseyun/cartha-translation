  lexicon: HALOT
  rationale: 문맥상 결혼 상태를 가리키는 관용구이므로, 현대 한국어에서 가장 분명한 ‘결혼한 사람’으로 풀어 자연성과 의미를 함께 살렸습니다.
- source_word: אִשְׁתּוֹ עִמּוֹ
  english_pob_choice: his wife shall go out with him
  chosen_korean: 그의 아내도 그와 함께 나갈 것입니다
  alternatives_korean:
  - 아내가 그와 함께 나갈 것입니다
  - 그의 아내가 그와 함께 나갈 것입니다
  lexicon: HALOT
  rationale: 여성형 주어와 동반 이동의 의미를 분명히 드러내기 위해 ‘도’를 넣어, 함께 떠나는 관계를 자연스럽게 표현했습니다.
