translation:
  language: ko
  text: 그가 혼자[a] 들어오면 혼자 나갈 것입니다. 그가 아내가 있는 사람이면, 그의 아내도 그와 함께 나갈 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 관용적으로 동반자 없이 혼자라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 직역하면 ‘아내의 주인’에 가깝지만, 여기서는 관용적으로 ‘아내가 있는 사람’, 곧 기혼 남성을 뜻합니다.
    reason: lexical_alternative
