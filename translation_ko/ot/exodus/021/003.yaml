  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
  footnotes:
  - marker: a
    text: Hebrew 'by his גַּף' is an idiom meaning he came in alone or unaccompanied.
    reason: lexical_alternative
  - marker: b
    text: Or more idiomatically, 'if he is married.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 혼자 들어오면 혼자 나갈 것이며, 그가 결혼한 사람이면 그의 아내도 그와 함께 나갈 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그의 גַּף’는 관용적으로 ‘동반자 없이, 혼자’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘한 아내의 주인’이지만, 관용적으로는 ‘결혼한 사람’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  english_pob_choice: by himself
  chosen_korean: 혼자
  alternatives_korean:
  - 그 자신으로
  - 외롭게
  - 단독으로
  lexicon: HALOT
  rationale: 히브리어 관용구는 동반자 없이 들어오는 뜻이므로, 법조문체에 맞으면서도 자연스러운 ‘혼자’로 옮겼습니다.
- source_word: יָבֹא / יֵצֵא
