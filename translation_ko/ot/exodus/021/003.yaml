  - 오면 / 나갈 것입니다
  lexicon: HALOT
  rationale: 출입의 대칭 구조를 살리기 위해 ‘들어오다 / 나가다’로 대응시켰습니다.
- source_word: בַּעַל אִשָּׁה
  english_pob_choice: if he is married
  chosen_korean: 결혼한 사람이면
