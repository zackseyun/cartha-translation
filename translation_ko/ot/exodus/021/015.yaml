lexical_decisions:
- source_word: מַכֵּה
  english_pob_choice: strikes
  chosen_korean: 때리는
  alternatives_korean:
  - 치는
  - 공격하는
  - 구타하는
  lexicon: HALOT
  rationale: נכה의 분사형은 법문맥에서 실제 폭행 행위를 가리키므로, 현대 한국어에서는 자연스럽고 직접적인 ‘때리는’으로 옮겨 물리적 폭행의 뜻을 분명히 했습니다.
- source_word: אָבִיו / אִמּוֹ
  english_pob_choice: his father / his mother
  chosen_korean: 아버지나 어머니
  alternatives_korean:
  - 그의 아버지와 어머니
  - 부모
  - 아버지 또는 어머니
  lexicon: HALOT
  rationale: 히브리어는 각각 ‘그의 아버지’와 ‘그의 어머니’를 말하지만, 영어 POB의 주석처럼 법적 의미상 둘 중 어느 한쪽을 때려도 해당되므로 한국어에서는 판례적 의미를 살려 ‘나’로 표현했습니다.
- source_word: מוֹת יוּמָת
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 반드시 사형을 받아야 합니다
  - 반드시 죽게 됩니다
  - 반드시 죽여야 합니다
  lexicon: HALOT
  rationale: 히브리어의 강조된 사법 공식은 단순한 죽음이 아니라 법적 사형 선고를 뜻하므로, 수동적 법문체를 살린 ‘죽임을 당해야 합니다’로 옮겼습니다.
