base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
  footnotes:
  - marker: a
    text: 'Or ''If a ransom payment is laid on him ... he shall pay the ransom for his life.'' The Hebrew uses two related but distinct terms: כֹּפֶר (''ransom'') and פִּדְיֹן (''redemption price'').'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그에게 속전이 부과되면, 그는 그에게 부과되는 모든 것에 따라 자기 생명의 속량값을 내야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속전이 그에게 부과되면 … 그는 자기 생명의 속량값을 내야 한다.’ 히브리어는 서로 관련되지만 구별되는 두 용어를 사용합니다. כֹּפֶר(‘속전’)와 פִּדְיֹן(‘속량값’)입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 만일
  alternatives_korean:
  - 그런데 만일
  - 만약
  lexicon: HALOT
  rationale: 앞절의 규정에 이어지는 조건절이므로, 법조문 어투에 맞는 ‘만일’로 옮겼습니다.
- source_word: כֹּפֶר
  english_pob_choice: a ransom
  chosen_korean: 속전
  alternatives_korean:
  - 몸값
  - 배상금
  lexicon: HALOT
  rationale: 법적 맥락에서 생명에 대한 대가로 부과되는 금액이므로, ‘속전’이 ‘ransom’의 의미를 가장 직접적으로 살립니다.
- source_word: פִּדְיֹן נַפְשׁוֹ
  english_pob_choice: the redemption price for his life
  chosen_korean: 생명의 속량값
  alternatives_korean:
  - 생명의 속전
  - 생명을 속량하는 값
  lexicon: HALOT
  rationale: כֹּפֶר와 구별되는 פִּדְיֹן의 ‘속량/구속을 위한 값’이라는 뉘앙스를 살리기 위해 ‘속량값’으로 옮겼고, נֶפֶשׁ는 이 문맥에서 ‘생명’으로 이해했습니다.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  english_pob_choice: according to all that is imposed on him
  chosen_korean: 그에게 부과된 모든 것에 따라
  alternatives_korean:
  - 그에게 부과된 전부에 따라
  - 그에게 정해진 모든 것에 따라
  lexicon: HALOT
  rationale: 반복되는 법적 표현을 자연스러운 한국어로 옮기되, 총액/전액의 취지를 살리기 위해 ‘모든 것에 따라’라고 했습니다.
theological_decisions:
- issue: 두 구별된 속죄/구속 용어의 보존
  chosen_reading: כֹּפֶר는 ‘속전’, פִּדְיֹן은 ‘속량값’으로 구분해, 둘이 서로 관련되지만 동일하지 않다는 점을 본문에서 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘배상금’으로 통일
  - 둘 다 ‘몸값’으로 통일
  rationale: 영어 POB가 두 히브리어 단어의 구별을 각주로 보존하듯, 한국어 본문에서도 어휘 차이를 유지하는 편이 원문 의미를 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
