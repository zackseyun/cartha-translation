  to: 「히브리 노예[a]를 사면, 그는 여섯 해 동안 섬겨야 합니다. 그러나 일곱째 해에는 아무 대가 없이 자유인이 되어 나가야 합니다.[b]」
  rationale: 원문의 예속 신분, 여섯 해의 의무 복무, 일곱째 해의 무상 해방을 모두 명확히 유지하도록 고쳤습니다. ‘그러나’는 וּבַשְּׁבִעִת의 시간적 대비를 자연스러운 한국어 법문으로 드러냅니다. 각주는 조건 표지와 ‘자유를 향해/자유인이 되어’의 가능한 직역적 대안을 각각 해당 위치에 연결했습니다.
