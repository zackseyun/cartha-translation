  source_fidelity: 개정이 필요합니다. עֶבֶד는 매입되는 예속 신분을 가리키며, 이 법조항에서는 ‘종’보다 ‘노예’가 원문의 법적·사회적 신분을 더 투명하게 나타냅니다. לַחָפְשִׁי는 단순히 ‘자유롭게’라는 방식 부사가 아니라 자유의 신분으로 나감을 뜻하므로 ‘자유인이 되어’로 옮기는 것이 정확합니다.
  naturalness: 합쇼체 법문으로 ‘…사면, 그는 … 섬겨야 합니다. 그러나 … 나가야 합니다’가 자연스럽고, 조건과 의무의 관계도 분명합니다.
  terminology: ‘히브리 노예’는 עֶבֶד עִבְרִי 및 영어 POB의 ‘Hebrew slave’에 충실합니다. ‘섬기다’는 יַעֲבֹד의 법적 복무 의미를 유지하며, ‘아무 대가 없이’는 חִנָּם의 무상성을 명확히 합니다.
