source:
  edition: WLC
  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew slave[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
  footnotes:
  - marker: a
    text: Or 'When you buy a Hebrew slave.' The Hebrew conditional particle can introduce a case law with either 'if' or 'when' in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'he shall go out to freedom for nothing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「히브리 노예[a]를 사면, 그는 여섯 해 동안 섬겨야 합니다. 그러나 일곱째 해에는 아무 대가 없이 자유인이 되어 나가야 합니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘히브리 노예를 사게 될 때’. 히브리어 조건 표지는 법률 조항에서 ‘만일’ 또는 ‘~할 때’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 아무 대가 없이 자유를 향해 나가야 합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: If
  chosen_korean: -게 되면
  alternatives_korean:
  - 만일
  - ~하면
  lexicon: HALOT
  rationale: 카수이스틱 법문의 조건을 한국어 법문체로 자연스럽게 살리기 위해 '-게 되면'을 사용했습니다. 영어 POB의 'If'와 같은 조건성을 유지합니다.
- source_word: עֶבֶד עִבְרִי
  english_pob_choice: Hebrew slave
  chosen_korean: 히브리 사람 종
  alternatives_korean:
  - 히브리 노예
  - 히브리 종
  lexicon: HALOT
  rationale: POB는 bonded status를 살려 'slave'를 택했으나, 한국어 본문에서는 현대 합쇼체 문맥에서 '노예'가 지나치게 강한 어감으로 읽힐 수 있어, 원문의 신분성과 민족성을 함께 드러내는 '히브리 사람 종'을 택했습니다.
- source_word: יַעֲבֹד
  english_pob_choice: he shall serve
  chosen_korean: 섬기고
  alternatives_korean:
  - 일하고
  - 노동하고
  lexicon: HALOT
  rationale: עבד의 기본 의미인 '섬기다/봉사하다'를 살리되, 법문에서 자연스러운 서술형 종결을 위해 연결형 '섬기고'로 옮겼습니다. 이는 종의 복무 기간을 표현합니다.
- source_word: לַחָפְשִׁי חִנָּם
  english_pob_choice: free ... without payment
  chosen_korean: 값 없이 자유롭게
  alternatives_korean:
  - 보상 없이
  - 대가 없이
  lexicon: HALOT
  rationale: '''חִנָּם''은 대속금이나 지불 없이 나가는 뜻이므로, ''값 없이''로 무상성을 분명히 하고 ''자유롭게''로 לַחָפְשִׁי의 해방 상태를 함께 담았습니다.'
theological_decisions:
- issue: עֶבֶד의 한국어 처리에서 '노예'와 '종' 중 선택
  chosen_reading: 종
  alternative_readings:
  - 노예
  - 종된 사람
  rationale: 이 절은 법적 예속 상태를 다루지만, 한국어에서 '노예'는 현대 독자에게 역사적·사회적 폭력성이 과도하게 전면화될 수 있어 본문 기능을 해치지 않는 범위에서 '종'을 택했습니다. 다만 의미를 약화시키지 않도록 앞의 '히브리 사람'과 뒤의 복무 기간으로 법적 속성을 보완했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested slavery terminology guidelines
