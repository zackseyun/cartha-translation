  chosen_reading: 본문의 초점은 개인적 복수의 허용이 아니라 상해와 동등한 상응 보상을 요구하는 법정 공식으로 옮겼습니다.
  alternative_readings:
  - 개인적 복수의 명령으로 읽는 번역
  - 완곡하게 ‘배상하라’로 일반화하는 번역
  rationale: 히브리어의 반복 구조와 תַּחַת의 상응 의미를 보존해야 하며, 지나치게 추상화하면 상해-대응의 엄격한 비례 원칙이 약화됩니다.
  doctrine_reference: 출 21:23-25의 보응/비례 원칙
