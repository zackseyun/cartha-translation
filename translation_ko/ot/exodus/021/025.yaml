  rationale: 이 단어는 때린 흔적으로 생긴 멍, 붓기, 자국을 가리키므로, 현대 한국어에서 가장 분명한 대응인 ‘타박상’을 택했습니다. 이는 영어 주석의 ‘stripe for stripe’가 암시하는 ‘때린 자국’의 의미도 함께 살립니다.
- source_word: תַּחַת
