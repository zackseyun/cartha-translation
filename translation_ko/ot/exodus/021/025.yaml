translation:
  language: ko
  text: 상처에는 상처로, 상처 자국에는 상처 자국으로, 타박상에는 타박상으로 갚으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상처 자국에 상처 자국으로’로도 옮길 수 있습니다. חַבּוּרָה는 때려서 남은 표시, 즉 자국이나 멍을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  english_pob_choice: burn
  chosen_korean: 상처
  alternatives_korean:
  - 화상
  - 불에 탄 자국
  - 화상 자국
  lexicon: HALOT
  rationale: 히브리어는 구체적으로 ‘화상/그을린 자국’을 가리키지만, 한국어에서는 법문체에서 반복되는 병렬 구조를 살리면서도 지나치게 좁지 않게 ‘상처’로 옮겨 상응 보복의 형식을 드러냈습니다.
- source_word: פֶּצַע
  english_pob_choice: wound
  chosen_korean: 상처
  alternatives_korean:
  - 부상
  - 상해
  - 찢김
  lexicon: HALOT
  rationale: פֶּצַע는 신체적 상처를 뜻하므로, 앞의 כְּוִיָּה와 구별되는 항목이지만 한국어에서는 같은 기본어 ‘상처’를 반복하되 위치를 달리하여 대구를 보존했습니다.
- source_word: חַבּוּרָה
  english_pob_choice: bruise
  chosen_korean: 타박상
  alternatives_korean:
  - 멍
  - 부스럼 자국
  - 휘청자국
  lexicon: HALOT
  rationale: 이 단어는 때린 흔적으로 생긴 멍, 붓기, 자국을 가리키므로, 현대 한국어에서 가장 분명한 대응인 ‘타박상’을 택했습니다. 이는 영어 주석의 ‘stripe for stripe’가 암시하는 ‘때린 자국’의 의미도 함께 살립니다.
- source_word: תַּחַת
  english_pob_choice: for
  chosen_korean: 으로
  alternatives_korean:
  - 대신
  - 에 대해
  - 갚아
  lexicon: HALOT
  rationale: 법률 문맥의 תַּחַת는 보응/상응을 나타내므로, 한국어에서는 각 항목 뒤에 같은 조사 구조를 반복해 ‘A로, B로, C로’라는 대응 관계를 간결하게 나타냈습니다.
theological_decisions:
