reference: Exodus 21:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
  footnotes:
  - marker: a
    text: Or "an ox accustomed to gore." The Hebrew participle describes an animal known for repeated goring.
    reason: lexical_alternative
  - marker: b
    text: Literally, "from yesterday and the day before," a Hebrew idiom indicating prior, established behavior.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 만일 그 소가 어제와 그저께부터 늘 들이받는 버릇이 있었고, 그 주인이 경고를 받았는데도 그것을 가두어 두지 아니하여 사람이든 여성이든 죽이면, 그 소는 돌로 쳐 죽여야 하고, 그 주인도 또한 죽임을 당해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹר
  english_pob_choice: ox
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 수소
  lexicon: HALOT
  rationale: 이 법조문에서는 성별보다 가축으로서의 소를 가리키는 점이 중심이므로, 자연스럽고 포괄적인 ‘소’가 적절합니다.
- source_word: נַגָּח
  english_pob_choice: in the habit of goring
  chosen_korean: 늘 들이받는 버릇이 있었고
  alternatives_korean:
  - 들이받는 소였고
  - 들이받는 습성이 있었고
  - 받아들이기를 반복하는 버릇이 있었고
  lexicon: HALOT
  rationale: 분사형이 일회적 행동이 아니라 반복적·상습적 성향을 나타내므로, 법문체에 맞게 ‘늘 … 버릇이 있었고’로 옮겨 상습성을 드러냈습니다.
- source_word: וְהוּעַד בִּבְעָלָיו
  english_pob_choice: its owner had been warned
  chosen_korean: 그 주인이 경고를 받았는데도
  alternatives_korean:
  - 그 주인이 통보를 받았는데도
  - 그 주인에게 증언이 주어졌는데도
  lexicon: HALOT
  rationale: 법적 맥락에서 공식적 경고의 의미가 분명하므로, 한국어로는 가장 직접적인 ‘경고를 받다’가 의미를 잘 살립니다.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  english_pob_choice: did not keep it in
  chosen_korean: 그것을 가두어 두지 아니하여
  alternatives_korean:
  - 그것을 지키지 아니하여
  - 그것을 묶어 두지 아니하여
  - 그것을 제어하지 아니하여
  lexicon: HALOT
  rationale: 문맥상 ‘감시하다’보다 위험한 동물을 안에 가두거나 통제하지 않은 책임이 핵심이므로, ‘가두어 두다’가 법적·실무적 의미를 가장 분명히 드러냅니다.
- source_word: אִישׁ א֣וֹ אִשָּׁה
  english_pob_choice: a man or a woman
  chosen_korean: 사람이든 여성이든
  alternatives_korean:
  - 남자든 여자든
  - 남성이든 여성이든
  - 사람이든 여자든
  lexicon: HALOT
  rationale: 원문은 남성과 여성을 모두 명시하므로, 성중립화된 ‘누구든지’보다 남녀 구분을 유지하는 표현을 택했습니다.
theological_decisions:
- issue: 형벌 동사의 법적 강도
  chosen_reading: 그 주인도 또한 죽임을 당해야 합니다
  alternative_readings:
  - 그 주인도 또한 죽어야 합니다
  - 그 주인도 또한 처형되어야 합니다
  rationale: 히브리어 יוּמָת는 단순한 죽음이 아니라 법적·사법적 사형 선고의 공식을 나타내므로, 그 강도를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 동물에 대한 처벌과 인간 책임의 병행
  chosen_reading: 그 소는 돌로 쳐 죽여야 하고, 그 주인도 또한 죽임을 당해야 합니다
  alternative_readings:
  - 그 소는 돌로 쳐야 하고, 그 주인도 또한 죽어야 합니다
  rationale: 동물의 처형과 주인의 사형이 병렬로 제시되어 있으며, 원문의 엄중한 법적 책임 구조를 약화시키지 않도록 병렬성을 유지했습니다.
  doctrine_reference: Translation philosophy §3, §5
