  to: 그러나 그가 해칠 뜻으로 숨어 기다린 것이 아니고 하나님께서 그의 손을 통하여 그런 일이 일어나게 하셨다면, 내가 너를 위하여 그가 피할 곳을 정해 주겠습니다.
  rationale: ‘해칠 뜻으로 숨어 기다린 것’으로 צָדָה의 매복·고의의 대비를 드러냈습니다. ‘그의 손을 통하여 그런 일이 일어나게 하셨다면’은 히브리어의 섭리적 발생 표현을 한국어답게 옮기되, 하나님의 행위에 관한 추가 신학적 설명을 넣지 않습니다. ‘피할 곳’과 현대 합쇼체 종결을 사용했습니다.
