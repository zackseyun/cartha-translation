translation:
  language: ko
  text: 눈은 눈으로, 이는 이로, 손은 손으로, 발은 발로 갚아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘눈 대신 눈, 이 대신 이, 손 대신 손, 발 대신 발’입니다.
