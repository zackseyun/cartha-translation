lexical_decisions:
- source_word: עַיִן
  english_pob_choice: eye
  chosen_korean: 눈
  alternatives_korean:
  - 안구
  lexicon: HALOT
  rationale: 신체 부위를 가리키는 법문맥이므로 표준적이고 자연스러운 ‘눈’이 적합합니다.
- source_word: תַּחַת
  english_pob_choice: for
  chosen_korean: ~으로 갚다
  alternatives_korean:
  - ~ 대신
  - ~에 대하여
  - ~에 상응하여
  lexicon: HALOT
  rationale: 이 표현은 단순한 위치가 아니라 상응하는 보상을 뜻하므로, 한국어에서는 ‘~으로 갚다’로 옮겨 짧은 법률 공식의 대응성을 살렸습니다.
- source_word: שֵׁן
  english_pob_choice: tooth
  chosen_korean: 이
  alternatives_korean:
  - 이빨
  lexicon: HALOT
  rationale: 신체 부위 용례에서는 한자어보다 일상적 ‘이’가 히브리어의 간결한 법률 공식을 더 잘 반영합니다.
- source_word: יָד
  english_pob_choice: hand
  chosen_korean: 손
  alternatives_korean:
  - 팔
  lexicon: HALOT
  rationale: 문자적 대응을 유지하기 위해 기본 뜻인 ‘손’을 택했습니다.
- source_word: רֶגֶל
  english_pob_choice: foot
  chosen_korean: 발
  alternatives_korean:
  - 다리
  lexicon: HALOT
  rationale: 고정된 대응 공식과 평행 구조를 살리기 위해 ‘발’이 가장 자연스럽습니다.
theological_decisions:
- issue: lex talionis의 압축적 법률 공식 유지
  chosen_reading: 설명형 재진술을 넣지 않고, ‘눈은 눈으로… 발은 발로 갚아야 합니다’라는 대칭 구조를 유지했습니다.
  alternative_readings:
  - ‘상응하는 벌을 받아야 합니다’처럼 의미를 풀어쓴 번역
  rationale: 본문은 גוף 부위 명사와 תַּחַת의 대응만으로 이루어진 간결한 법문이므로, 해설을 덧붙이면 원문의 형식을 넘어섭니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; never paraphrase beyond what the source text warrants.'
