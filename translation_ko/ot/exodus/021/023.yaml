base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/023.yaml
  text: But if there is harm[a], then you shall give life for life.
  footnotes:
  - marker: a
    text: Or 'serious injury' or 'fatality'; the Hebrew term can denote grave harm or disaster, and interpreters differ on whether the context implies injury in general or death in particular.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 해가 있으면[a], 생명은 생명으로 갚아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘중대한 상해’ 또는 ‘사망’. 히브리어는 중대한 해나 재난을 뜻할 수 있으며, 문맥이 일반적인 상해를 뜻하는지 사망을 뜻하는지에 대해서는 해석이 갈립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 이전 절과의 대조를 살리기 위해 ‘그러나’를 두었고, 조건문은 법문체에 자연스러운 ‘만일’로 옮겼습니다.
- source_word: אָסוֹן
  english_pob_choice: harm
  chosen_korean: 해害
  alternatives_korean:
  - 해
  - 중대한 상해
  - 치명적 손상
  lexicon: HALOT
  rationale: 히브리어 אָסוֹן의 의미 범위가 ‘상해’와 ‘재앙/해’까지 열려 있으므로, 해석을 좁히지 않으면서 법적 문맥을 유지하도록 ‘해’를 택했습니다. 한자 병기 ‘害’는 의미를 분명히 합니다.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  english_pob_choice: life for life
  chosen_korean: 생명은 생명으로
  alternatives_korean:
  - 목숨은 목숨으로
  - 생명에 생명으로
  - 목숨으로 목숨을
  lexicon: HALOT
  rationale: 법률적 상응 관계를 살리기 위해 ‘생명’을 반복했고, תַּחַת는 한국어에서 가장 자연스럽고 대응 구조를 유지하는 ‘-으로’로 풀었습니다.
theological_decisions:
- issue: אָסוֹן의 범위를 한국어에서 어떻게 남길 것인가
  chosen_reading: ‘해’로 넓게 옮겨, 상해인지 사망인지 단정하지 않았습니다.
  alternative_readings:
  - ‘중대한 상해’로 좁혀 번역
  - ‘사망’으로 해석해 번역
  rationale: 본문 자체가 אָסוֹן의 구체적 결과를 여기서 확정하지 않으므로, 논쟁의 여지를 번역이 미리 닫지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: 해석의 긴장을 보존하고, 본문이 명시하지 않은 결론을 덧씌우지 않음'
