reference: Exodus 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
  footnotes:
  - marker: a
    text: Or, 'who has designated/betrothed her for himself.' The Hebrew clause is textually and interpretively difficult.
    reason: textual_variant
  - marker: b
    text: Or, 'since he has acted treacherously toward her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그녀가 그 주인의 눈에 좋지 않다면, 곧 그가 그녀를 자기에게 지정하지 않았거든, 그는 그녀가 속전으로 풀려나게 해야 합니다. 그는 그녀를 외국 백성에게 팔 권리가 없습니다. 이는 그가 그녀에게 신의를 저버렸기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그가 그녀를 자기에게 지정/약혼하였다.’ 이 히브리어 구절은 본문상·해석상 어려운 곳입니다.
    reason: textual_variant
  - marker: b
    text: 또는, ‘이는 그가 그녀에게 배신적으로 행동했기 때문이다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  english_pob_choice: is displeasing in the eyes of
  chosen_korean: 그녀가 그 주인의 눈에 좋지 않다면
  alternatives_korean:
  - 그녀가 그 주인에게 불쾌하다면
  - 그녀가 그 주인에게 좋지 않다면
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, ‘눈에’라는 이미지를 살려 평가·기호의 뉘앙스를 유지했습니다.
- source_word: יְעָדָהּ
  english_pob_choice: has designated her for himself
  chosen_korean: 그가 그녀를 자기에게 지정하지 않았거든
  alternatives_korean:
  - 그가 그녀를 자기에게 약혼시키지 않았거든
  - 그가 그녀를 자기에게 정하지 않았거든
  lexicon: HALOT
  rationale: 동사의 기본 의미 폭을 좁히지 않으면서도, 법률 문맥에서의 혼인/배정 가능성을 한국어로 열어 두었습니다.
- source_word: וְהֶפְדָּהּ
  english_pob_choice: he shall let her be redeemed
  chosen_korean: 그는 그녀가 속전으로 풀려나게 해야 합니다
  alternatives_korean:
  - 그는 그녀를 속전으로 속량해야 합니다
  - 그는 그녀의 속전을 치러야 합니다
  lexicon: HALOT
  rationale: 수동적 ‘풀려나게 하다’로 법적 결과를 살리고, ‘속전’으로 שִׁחרור/속량 개념을 드러냈습니다.
- source_word: לְעַם נָכְרִי
  english_pob_choice: to a foreign people
  chosen_korean: 외국 백성에게
  alternatives_korean:
  - 이방 백성에게
  - 외국인들에게
  lexicon: HALOT
  rationale: 집단성을 살리면서도 한국어 법률 문맥에서 자연스러운 표현을 택했습니다.
- source_word: בְּבִגְדוֹ בָהּ
  english_pob_choice: since he has dealt deceitfully with her
  chosen_korean: 이는 그가 그녀에게 신의를 저버렸기 때문입니다
  alternatives_korean:
  - 이는 그가 그녀를 배신했기 때문입니다
  - 이는 그가 그녀에게 속였기 때문입니다
  lexicon: HALOT
  rationale: בגד의 핵심인 언약적 불성실과 법적 배신의 뉘앙스를 ‘신의를 저버리다’로 표현했습니다.
theological_decisions:
- issue: יְעָדָהּ의 문맥상 불확정성
  chosen_reading: 본문은 ‘자기에게 지정하지 않았다’로 옮기고, 혼인/약혼 가능성은 본문에 과도하게 못 박지 않았습니다.
  alternative_readings:
  - ‘자기에게 약혼시키지 않았다’
  - ‘자기에게 지정하였다’
  rationale: 마소라 본문의 난점을 해소하기보다, 법조문의 모호성을 보존하는 것이 POB의 원칙에 맞습니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
