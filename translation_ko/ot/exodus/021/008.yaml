  verdict: revise
  source_fidelity: 핵심 법적 의미는 대체로 충실합니다. 다만 יְעָדָהּ의 ‘자신을 위해 정하다’라는 모호성을 더 자연스럽게 표현하고, וְהֶפְדָּהּ는 주인이 직접 값을 지불한다는 뜻을 피하여 ‘속량받게 하다’로 옮기는 것이 적절합니다.
  naturalness: ‘주인의 눈에 좋지 않다면’과 ‘자기에게 지정하지 않았거든’은 직역투이거나 현대 한국어에서 어색합니다. ‘주인의 마음에 들지 않고’ 및 ‘자신을 위해 그녀를 정하지 않았다면’이 현대 표준어 합쇼체에 더 자연스럽습니다.
  terminology: ‘속량받게 하다’는 허용·조처의 법적 의미를 보존합니다. ‘이방 백성’은 לְעַם נָכְרִי의 집단성과 타자성을 반영합니다. ‘신의를 저버리다’는 בגד의 불성실·배반의 의미에 적절합니다.
  issues:
  - severity: medium
    issue: 각주 표지가 적용되는 본문 위치에서 떨어져 있습니다.
