  text: וְ/כִֽי יִפְתַּ֨ח אִ֜ישׁ בּ֗וֹר א֠וֹ כִּֽי יִכְרֶ֥ה אִ֛ישׁ בֹּ֖ר וְ/לֹ֣א יְכַסֶּ֑/נּוּ וְ/נָֽפַל שָׁ֥מָּ/ה שּׁ֖וֹר א֥וֹ חֲמֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
  footnotes:
  - marker: a
    text: Or 'uncovers a pit' for the first clause; the Hebrew verb is literally 'opens,' which may refer to opening an existing pit rather than digging a new one.
    reason: lexical_alternative
  - marker: b
    text: '''A man'' renders the Hebrew singular masculine legal formula אישׁ, used generically in casuistic law.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 만일 어떤 사람이 구덩이를 열거나, 어떤 사람이 구덩이를 파고도 그것을 덮지 않아, 소나 나귀가 그것에 빠지면[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 첫 구절은 ‘구덩이를 덮개에서 열다’라는 뜻으로, 이미 있는 구덩이를 드러내는 의미일 수 있습니다.
    reason: lexical_alternative
