  source_fidelity: ‘받았는데’는 조건법인 וְכִי를 다소 서술적으로 약화하며, ‘돌로 쳐야 합니다’는 סָקוֹל יִסָּקֵל의 돌로 쳐 죽이는 법적 처형을 충분히 드러내지 못합니다. ‘책임이 없습니다’는 נָקִי의 법적 맥락에 가능한 번역이지만, 주석이 이를 도덕적 무죄와 대조하여 배제하는 것은 히브리어의 간결한 표현보다 지나치게 한정합니다.
