source:
  edition: WLC
  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
  footnotes:
  - marker: a
    text: Or 'is innocent' or 'is not liable.' The Hebrew simply states that the owner is נָקִי, a legal term of being clear or free from penalty in this case.
    reason: lexical_alternative
translation:
  language: ko
  text: 소가 남자나 여자를 받았는데 그 사람이 죽으면, 그 소는 반드시 돌로 쳐야 합니다. 그 고기는 먹어서는 안 됩니다. 그러나 그 소의 주인은 책임이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נָקִי는 이 문맥에서 도덕적 ‘무죄’보다 법적 ‘책임 없음/면책’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And if
  chosen_korean: 소가 … 받았는데
  alternatives_korean:
  - 그리고 만일
  - 만약
  lexicon: HALOT
  rationale: 케이스형 율법 문맥의 조건절을 한국어에서 자연스럽게 풀어, 연결성과 조건성을 함께 살렸습니다.
- source_word: יִגַּח
  english_pob_choice: gores
  chosen_korean: 받았는데
  alternatives_korean:
  - 받으면
  - 들이받으면
  - 뿔로 들이받으면
  lexicon: HALOT
  rationale: יִגַּח의 핵심은 뿔로 들이받는 행위이지만, 한국어에서는 ‘받다/들이받다’가 가장 자연스럽고 법조문 톤도 유지합니다.
- source_word: אֶת אִישׁ אוֹ אֶת אִשָּׁה
  english_pob_choice: a man or a woman
  chosen_korean: 남자나 여자를
  alternatives_korean:
  - 사람을
  - 남자든 여자든
  lexicon: HALOT
  rationale: 히브리어가 남녀를 모두 명시하므로, 성별 구분을 지우지 않고 그대로 반영했습니다.
- source_word: סָקוֹל יִסָּקֵל
  english_pob_choice: shall surely be stoned
  chosen_korean: 반드시 돌로 쳐야 합니다
  alternatives_korean:
  - 반드시 돌로 쳐야 합니다
  - 돌로 쳐야 합니다
  lexicon: HALOT
  rationale: 강조형(부정사 절대형+동사)의 법적 강세를 ‘반드시’로 살렸습니다.
- source_word: וְלֹא יֵאָכֵל אֶת בְּשָׂרוֹ
  english_pob_choice: and its flesh shall not be eaten
  chosen_korean: 그 고기는 먹어서는 안 됩니다
  alternatives_korean:
  - 그의 살은 먹어서는 안 됩니다
  - 그 고기는 먹지 말아야 합니다
  lexicon: HALOT
  rationale: בָּשָׂר를 ‘고기’로 옮겨 현대 한국어에서 자연스럽게 하되, 금지 규정을 분명히 했습니다.
- source_word: וּבַעַל הַשּׁוֹר נָקִי
  english_pob_choice: but the owner of the ox is clear
  chosen_korean: 그러나 그 소의 주인은 책임이 없습니다
  alternatives_korean:
  - 그러나 그 소의 주인은 무죄입니다
  - 그러나 그 소의 주인은 면책됩니다
  - 그러나 그 소의 주인은 해가 없습니다
  lexicon: HALOT
  rationale: נָקִי는 도덕적 무죄보다 법적 비책임/면책을 가리키므로, 오해를 줄이기 위해 ‘책임이 없습니다’로 옮겼습니다.
theological_decisions:
- issue: nָקִי의 법적 의미를 어떻게 드러낼지
  chosen_reading: 주인은 도덕적 무죄 판정이 아니라, 이 기본 사례에서 법적 책임을 지지 않는다는 뜻으로 읽었습니다.
  alternative_readings:
  - 주인은 순수하거나 깨끗하다는 도덕적 의미
  - 주인은 단순히 형벌에서만 풀려난다는 의미
  rationale: 앞뒤 문맥이 가축의 사고에 대한 배상/책임 규정이므로, 히브리어의 법정 용어를 한국어에서도 법적 비책임으로 유지하는 것이 가장 정확합니다.
  doctrine_reference: Translation philosophy §3, preserve legal/theological tension
