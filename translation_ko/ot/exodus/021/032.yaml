  lexicon: HALOT
  rationale: 히브리어는 단순 처형 방식이 아니라 사형 집행을 뜻하므로, 독자가 결과를 분명히 이해하도록 ‘죽여야 합니다’를 덧붙였습니다.
theological_decisions:
- issue: 법조문의 의무 표현
  chosen_reading: ‘주어야 하며’로 번역해 법적 의무성을 분명히 했습니다.
  alternative_readings:
