  text: 만일 그 소가 남종이나 여종을 뿔로 받으면, 은 삼십 세겔을 그 종의 주인에게 주어야 하며, 그 소는 돌로 쳐 죽여야 합니다.[a]
  philosophy: optimal-equivalence
