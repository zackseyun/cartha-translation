  alternatives_korean:
  - 받으면
  - 받아받으면
  - 들이받으면
  lexicon: HALOT
  rationale: 소의 뿔로 들이받는 행위를 한국어 관용에 맞게 자연스럽게 옮기되, 법조문의 간결성을 유지하기 위해 ‘받아버리면’으로 표현했습니다.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  english_pob_choice: thirty shekels of silver
  chosen_korean: 은 삼십 세겔
  alternatives_korean:
  - 은 서른 세겔
  - 삼십 세겔의 은
  - 은 서른 세겔
  lexicon: HALOT
  rationale: 히브리어의 액수·재화를 그대로 반영해 ‘은 삼십 세겔’로 옮겼습니다. 한국어에서는 금액의 관용 표현으로 충분히 자연스럽고, 무게 단위와 화폐적 가치를 함께 드러냅니다.
- source_word: לַאדֹנָיו
  english_pob_choice: to his master
  chosen_korean: 그의 주인에게
  alternatives_korean:
  - 그의 상전에게
  - 그 소의 주인에게
  - 그의 소유주에게
  lexicon: HALOT
  rationale: 대상은 앞선 종에게 속한 주인으로 읽히며, 한국어에서는 ‘주인’이 소유·지배 관계를 가장 직접적으로 드러냅니다. ‘상전’은 시대적 뉘앙스가 강해 피했습니다.
- source_word: יִסָּקֵל
  english_pob_choice: shall be stoned
  chosen_korean: 돌로 쳐 죽여야 합니다
  alternatives_korean:
  - 돌로 쳐야 합니다
  - 돌에 맞아야 합니다
  - 돌로 쳐 죽을 것입니다
  lexicon: HALOT
  rationale: 히브리어는 단순 처형 방식이 아니라 사형 집행을 뜻하므로, 독자가 결과를 분명히 이해하도록 ‘죽여야 합니다’를 덧붙였습니다.
theological_decisions:
- issue: 법조문의 의무 표현
  chosen_reading: ‘주어야 하며’로 번역해 법적 의무성을 분명히 했습니다.
  alternative_readings:
  - ‘주게 됩니다’
  - ‘주어야 할 것입니다’
  rationale: 조건-결과 구조의 casuistic law이므로, 단순 미래보다 규범적 의무를 나타내는 표현이 적합합니다.
  doctrine_reference: 토라의 재판 규례 표현
- issue: 가축의 형벌 주체
  chosen_reading: 소에 대해서는 ‘돌로 쳐 죽여야 합니다’로 능동형 의무를 유지했습니다.
  alternative_readings:
  - ‘그 소는 돌로 맞아 죽습니다’
  - ‘그 소를 돌로 쳐야 합니다’
  rationale: 히브리어 수동형은 법적 집행을 완곡하게 말하지만, 한국어에서는 공동체의 처벌 집행이 드러나야 하므로 능동적 규범 문장으로 옮겼습니다.
  doctrine_reference: 출애굽기 21장의 보상·형벌 규정
