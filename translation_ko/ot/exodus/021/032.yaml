  text: If the ox gores a male slave or a female slave[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
  footnotes:
  - marker: a
    text: Or 'a slave, male or female.' The Hebrew distinguishes a male slave (עֶבֶד) and a female slave (אָמָה).
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그가 남종이나 여종을 받아버리면, 은 삼십 세겔을 그의 주인에게 주어야 하며, 그 소는 돌로 쳐 죽여야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남종이든 여종이든 한 종을’. 히브리어는 עֶבֶד(남종)과 אָמָה(여종)를 구별합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד / אָמָה
  english_pob_choice: male slave / female slave
  chosen_korean: 남종 / 여종
  alternatives_korean:
  - 종 / 여종
  - 남자 노예 / 여자 노예
  - 종 / 노비
  lexicon: HALOT
  rationale: 법조문에서 종속된 신분이 핵심이므로 ‘종’보다 더 구체적인 ‘남종 / 여종’을 택해 성별 구분과 법적 상태를 함께 살렸습니다.
- source_word: יִגַּח
