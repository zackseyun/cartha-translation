  - ‘주어야 할 것입니다’
  rationale: 조건-결과 구조의 casuistic law이므로, 단순 미래보다 규범적 의무를 나타내는 표현이 적합합니다.
  doctrine_reference: 토라의 재판 규례 표현
- issue: 가축의 형벌 주체
  chosen_reading: 소에 대해서는 ‘돌로 쳐 죽여야 합니다’로 능동형 의무를 유지했습니다.
  alternative_readings:
  - ‘그 소는 돌로 맞아 죽습니다’
  - ‘그 소를 돌로 쳐야 합니다’
  rationale: 히브리어 수동형은 법적 집행을 완곡하게 말하지만, 한국어에서는 공동체의 처벌 집행이 드러나야 하므로 능동적 규범 문장으로 옮겼습니다.
