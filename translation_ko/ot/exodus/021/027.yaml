- from: 그리고 만일 그 종의 이빨이나 그 여종의 이빨을 부러뜨리면, 그는 그 이빨 값으로 그를 놓아주어야 합니다.[a]
  to: 또 만일 어떤 사람이 자기 남종의 이빨이나 여종의 이빨을 빠지게 하면, 그 이빨에 대한 보상으로 그 종을 자유롭게 놓아주어야 합니다.[a]
  rationale: 치아 상해의 결과를 원문의 ‘빠지게 하다’에 맞추고, 해방이 치아 상실에 대한 법적 보상임을 드러내도록 고쳤습니다. ‘남종/여종’의 대조를 유지하되, 결론의 ‘그 종’은 두 경우 모두를 가리키는 일반적 표현으로 두었습니다. 각주도 히브리어 남성 단수 접미사의 형식과 규정의 적용 범위를 간결하게 설명하도록 다듬었습니다.
