  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם שֵׁ֥ן עַבְדּ֛/וֹ אֽוֹ שֵׁ֥ן אֲמָת֖/וֹ יַפִּ֑יל לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת שִׁנּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male slave or the tooth of his female slave[a], he shall let him go free in compensation for his tooth.
  footnotes:
  - marker: a
    text: Or 'he shall let them go free' in application of the law to either a male or a female slave; the Hebrew legal formula uses a masculine singular object suffix.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 만일 어떤 사람이 자기 남종의 이빨이나 여종의 이빨을 빠지게 하면, 그 이빨에 대한 보상으로 그 종을 자유롭게 놓아주어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 법문은 남성 단수 목적어 접미사를 사용합니다. 그러나 이 규정은 앞에 언급된 남종이나 여종 각각에 적용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדּוֹ
  english_pob_choice: his male slave
  chosen_korean: 그 종
  alternatives_korean:
  - 그 남종
  - 그 남자 종
  - 그 노예
  lexicon: HALOT
  rationale: 히브리어 법문맥에서 עבד는 종속된 신분을 가리키므로 기본값인 ‘종’을 따르되, 문맥상 남성형 대조는 뒤의 ‘여종’과의 짝으로 드러나게 했습니다.
- source_word: אֲמָתוֹ
  english_pob_choice: his female slave
  chosen_korean: 그 여종
  alternatives_korean:
  - 그 여자 종
  - 그 여노예
  - 그 계집종
  lexicon: HALOT
  rationale: עבד의 여성 대응어를 자연스러운 현대어로 옮겨 남성/여성의 법적 짝을 보존했습니다.
- source_word: יַפִּיל
  english_pob_choice: knocks out
  chosen_korean: 부러뜨리면
  alternatives_korean:
  - 빠뜨리면
  - 뽑아버리면
  - 떨어뜨리면
  lexicon: HALOT
  rationale: 직역상 ‘떨어지게 하다’이지만, 한국어에서는 치아 손상에 대한 법적 상황을 가장 자연스럽게 드러내는 상해 표현으로 ‘부러뜨리다’를 택했습니다.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  english_pob_choice: he shall let him go free
  chosen_korean: 그를 놓아주어야 합니다
  alternatives_korean:
  - 그를 자유롭게 보내야 합니다
  - 그를 자유인으로 풀어주어야 합니다
  - 그를 놓아 보내야 합니다
  lexicon: HALOT
  rationale: 법적 결과인 해방을 한국어 법문에 자연스러운 ‘놓아주다’로 옮겼습니다. ‘자유롭게’는 의미상 충분하지만 본문의 결론문 구조를 간결하게 살렸습니다.
- source_word: תַּחַת
  english_pob_choice: in compensation for
  chosen_korean: 그 이빨 값으로
  alternatives_korean:
  - 그 이빨에 대한 보상으로
  - 그 이빨을 대신하여
  - 그 이빨의 대가로
  lexicon: HALOT
  rationale: תחת의 보상/대가 의미를 드러내기 위해 한국어 법적 표현으로 압축해 옮겼습니다. ‘값’은 손해배상·상환의 뉘앙스를 자연스럽게 전달합니다.
theological_decisions:
- issue: 노예/종 용어 선택
  chosen_reading: ‘종’으로 번역하되, 남녀 짝을 드러내는 법문맥을 유지했습니다.
  alternative_readings:
  - ‘노예’로 번역
  - ‘종’ 대신 ‘종살이하는 자’로 풀어쓰기
  rationale: 이 절은 상해에 대한 배상 규정으로서 종속 신분을 전제하지만, 한국어에서 ‘노예’는 지나치게 근대적·감정적 뉘앙스를 띨 수 있어 기본값인 ‘종’을 사용했습니다. 대신 ‘그 남종/그 여종’ 식의 설명을 넣지 않고도 성별 대조가 보이도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; bonded-status rendering guidance
