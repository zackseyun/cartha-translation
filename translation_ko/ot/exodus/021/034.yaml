base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
  footnotes:
  - marker: a
    text: Hebrew literally, 'silver'; here it denotes monetary compensation.
    reason: lexical_alternative
  - marker: b
    text: Or 'and the carcass shall belong to him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 구덩이 주인은 배상해야 합니다. 그는 그 동물의 주인에게 돈을 지급해야 하며[a], 죽은 동물은 그 구덩이 주인의 것이 됩니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자적으로는 ‘은’이지만, 여기서는 금전적 배상을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사체는 그 구덩이 주인의 것이 됩니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל
  english_pob_choice: owner
  chosen_korean: 주인
  alternatives_korean:
  - 소유자
  - 소유주
  lexicon: HALOT
  rationale: 이 법률 문맥에서 책임을 지는 당사자를 가리키므로, 현대 한국어의 자연스러운 법적 대응어인 ‘주인’이 가장 직접적입니다.
- source_word: הַבּוֹר
  english_pob_choice: the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 피트
  - 웅덩이
  - 구멍
  lexicon: HALOT
  rationale: 동물이 빠지는 판형·굴착형 공간을 가리키므로, ‘구덩이’가 한국어에서 가장 자연스럽고 분명합니다.
- source_word: יְשַׁלֵּם
  english_pob_choice: shall make restitution
  chosen_korean: 보상해야 합니다
  alternatives_korean:
  - 배상해야 합니다
  - 갚아야 합니다
  - 변상해야 합니다
  lexicon: HALOT
  rationale: 법적 책임으로 인한 금전적 배상을 뜻하므로 ‘보상하다’가 무난하되, 뒤의 ‘돈을 갚아야’와 함께 restitution의 강도를 유지합니다.
- source_word: כֶּסֶף
  english_pob_choice: money
  chosen_korean: 돈
  alternatives_korean:
  - 은
  - 금전
  - 은전
  lexicon: HALOT
  rationale: 문자적으로는 ‘은’이지만, 여기서는 통상적인 금전 지급을 뜻하므로 ‘돈’이 현대 독자에게 의미를 가장 분명히 전달합니다.
- source_word: הַמֵּת
  english_pob_choice: the dead animal
  chosen_korean: 죽은 동물
  alternatives_korean:
  - 죽은 것
  - 사체
  - 죽은 가축
  lexicon: HALOT
  rationale: 문맥상 구덩이에서 죽은 짐승을 가리키므로, 의미를 분명히 하기 위해 ‘동물’을 보충했습니다.
theological_decisions:
- issue: 보상과 소유 이전의 법적 효과
  chosen_reading: 피해 배상뿐 아니라, 죽은 동물의 소유가 구덩이 주인에게 넘어가는 판결 구조로 읽었습니다.
  alternative_readings:
  - 단순히 배상만 요구하는 조항으로 읽기
  - ‘죽은 동물은 그의 것’만을 별도 보상 항목으로 읽기
  rationale: 히브리어 마지막 절은 배상 체계 안에서 소유권 이전을 함께 규정하므로, 한국어에서도 그 법적 효과가 드러나게 옮겼습니다.
  doctrine_reference: 출애굽기 21장 재산 손해 배상 규정
