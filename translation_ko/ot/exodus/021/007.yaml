source:
  edition: WLC
  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female slave[b][a], she shall not go out as the male slaves go out.
  footnotes:
  - marker: a
    text: Or 'as a maidservant.' The Hebrew אָמָה refers to a female in bonded service; 'female slave' is used here to make the legal status explicit.
    reason: lexical_alternative
  - marker: b
    text: That is, she does not leave her service under the same terms as the male slaves.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 만일 어떤 사람이 자기 딸을 여자 노예로 팔면, 그녀는 남자 노예들이 나가는 것처럼 나가지 못합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧, 이 여자는 남자 노예들과 같은 조건으로 해제되지 않는다는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘여자 노예’입니다. 여기서는 법적 구속 상태를 분명히 하기 위해 그렇게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And if
  chosen_korean: 그리고 만일
  alternatives_korean:
  - 만일
  - 또 만일
  lexicon: HALOT
  rationale: 조건문을 여는 연결과 가정의 뉘앙스를 자연스러운 한국어 법문체로 살렸습니다.
- source_word: לְאָמָה
  english_pob_choice: as a female slave
  chosen_korean: 여자 노예로
  alternatives_korean:
  - 여종으로
  - 여자 종으로
  - 여자 종의 신분으로
  lexicon: HALOT
  rationale: אָמָה는 여성의 종속 노동이 아니라 법적 구속 상태를 가리키므로, 완곡한 ‘여종’보다 ‘여자 노예’가 POB의 bonded-status 선택을 더 직접적으로 반영합니다.
- source_word: לֹא תֵצֵא
  english_pob_choice: she shall not go out
  chosen_korean: 나가지 못합니다
  alternatives_korean:
  - 나가서는 안 됩니다
  - 풀려나지 못합니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘나가다’는 여기서 석방·해방을 뜻하므로, 본문 어휘를 유지하되 한국어에서는 결과를 분명히 하는 표현으로 옮겼습니다.
- source_word: הָעֲבָדִים
  english_pob_choice: the male slaves
  chosen_korean: 남자 노예들이
  alternatives_korean:
  - 노예들이
  - 남자 종들이
  lexicon: HALOT
  rationale: 딸을 여자 노예로 파는 경우와 대비되는 대상이므로, 성별 대비를 드러내기 위해 ‘남자 노예들’로 옮겼습니다.
theological_decisions:
- issue: 종속 상태를 완화하지 않는 번역
  chosen_reading: ‘여자 노예’와 ‘남자 노예들’을 사용해 법적 구속 상태를 분명히 했습니다.
  alternative_readings:
  - 여종
  - 여자 종
  - 종들
  rationale: 이 절은 판매와 해제를 규정하는 법 조항이므로, 관계의 법적 현실을 흐리는 완곡어보다 원문의 사회-법적 무게를 드러내는 표현이 필요합니다.
  doctrine_reference: 번역 철학 §1; 본문 법문맥의 bonded-status 유지
