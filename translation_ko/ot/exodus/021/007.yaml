  rationale: 이 절은 판매와 해제를 규정하는 법 조항이므로, 관계의 법적 현실을 흐리는 완곡어보다 원문의 사회-법적 무게를 드러내는 표현이 필요합니다.
  doctrine_reference: 번역 철학 §1; 본문 법문맥의 bonded-status 유지
