review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. אָמָה를 ‘여자 노예’로, עֲבָדִים을 문맥상 ‘남자 노예들’로 옮긴 것은 성별 및 법적 신분의 대비를 잘 드러냅니다. 다만 ‘나가지 못합니다’는 원문의 법적 서술을 능력·불가능의 뜻으로 다소 좁힐 수 있으므로, 원문의 반복되는 ‘나가다’ 표현과 비교 구문을 보존하는 ‘나가지 않습니다’가 더 충실합니다.
  naturalness: ‘그녀는’과 ‘나가는 것처럼 나가지 못합니다’의 반복은 한국어에서 다소 부자연스럽습니다. ‘그 딸은 남자 노예들이 나가는 것과 같이 나가지 않습니다’는 법문체에 자연스럽고, 원문의 어휘적 병행도 유지합니다. ‘또’는 앞선 법 조항과의 접속을 간결하게 반영합니다.
  terminology: ‘여자 노예’와 ‘남자 노예들’은 완곡하지 않으면서도 현대 표준어로 이해 가능합니다. 각주 a의 ‘해제’는 이 문맥에서 다소 행정적이고 모호하므로 ‘풀려나다’로 고칩니다. 각주 b의 설명은 ‘직역’보다 해당 번역어가 원어의 직접적 의미를 반영한다는 방식으로 표현하는 편이 정확합니다.
  issues:
  - severity: medium
    issue: ‘나가지 못합니다’가 법적 서술을 불가능의 의미로 좁힐 수 있음
    rationale: לֹא תֵצֵא는 이 법 조항에서 여성이 남성 노예와 동일한 방식으로 ‘나가지’ 않는다는 규정입니다. ‘못하다’는 외적 능력이나 허용의 결여를 강조할 수 있으므로, 원문의 서술적 법문을 따라 ‘나가지 않습니다’로 옮기는 것이 안전합니다.
  - severity: low
    issue: 대명사 및 비교 표현의 한국어 자연스러움
    rationale: ‘그녀는 ... 나가는 것처럼 나가지’는 반복과 대명사 사용이 다소 번역투입니다. ‘그 딸은 ... 나가는 것과 같이 나가지 않습니다’가 더 자연스럽고 원문의 병행도 보존합니다.
  - severity: low
    issue: 각주 a의 ‘해제’가 다소 부자연스럽고 모호함
    rationale: 본문의 법적 관용구와 연결해 ‘풀려나다’라고 하면 독자가 의미를 더 분명히 이해할 수 있습니다.
