  source_fidelity: 원문의 조건절, 보행 보조를 받는 회복의 표지, 가해자의 형벌 면제와 계속되는 보상·치유 책임을 전반적으로 잘 반영했습니다. 다만 ‘그가 일을 못한 기간’과 마지막 ‘그를’은 가까운 선행사인 가해자로도 읽힐 수 있으므로, 원문의 피해자를 명시하는 편이 안전합니다. וְנִקָּה는 뒤의 배상 의무를 없앤다는 뜻이 아니므로 ‘형벌을 면합니다. 다만’으로 법적 제한을 더 분명히 했습니다.
  naturalness: 초안은 대체로 자연스럽지만, 법조문 문맥에서 ‘밖을 다니면’보다 ‘밖을 걸어 다니면’이 더 매끄럽고, 대명사 반복을 ‘피해자’로 풀면 지시 관계가 명료해집니다. 각주 표지도 해당 표현 바로 뒤에 배치하는 것이 독해에 좋습니다.
  terminology: ‘지팡이를 짚고’, ‘형벌을 면하다’, ‘보상하다’, ‘완전히 회복되도록 하다’는 현대 표준 한국어의 합쇼체 법조문 문맥에 적절합니다. ‘온전히 낫게 하다’도 가능하나, ‘피해자가 완전히 회복되도록 하다’가 가해자가 직접 치료한다는 오해 없이 히브리어의 책임·강조를 잘 전달합니다.
