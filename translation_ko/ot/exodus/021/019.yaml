source:
  edition: WLC
  text: אִם יָק֞וּם וְ/הִתְהַלֵּ֥ךְ בַּ/ח֛וּץ עַל מִשְׁעַנְתּ֖/וֹ וְ/נִקָּ֣ה הַ/מַּכֶּ֑ה רַ֥ק שִׁבְתּ֛/וֹ יִתֵּ֖ן וְ/רַפֹּ֥א יְרַפֵּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
  footnotes:
  - marker: a
    text: Or 'leaning on his staff.' The Hebrew phrase literally reads 'on his staff,' indicating supported walking as evidence of partial recovery.
    reason: lexical_alternative
  - marker: b
    text: '''His lost time'' refers to compensation for the injured man''s period of incapacity, that is, time away from normal work.'
    reason: cultural_note
  - marker: c
    text: The Hebrew emphatic expression literally reads 'healing he shall heal,' meaning he must ensure complete recovery, likely by covering medical treatment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 일어나 지팡이를 짚고 밖을 다니면, 그를 친 자는 벌을 면하되, 그가 일을 못한 기간에 대해서만 갚고 그를 온전히 낫게 해야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 지팡이 위에서’입니다. 이는 보행 보조를 받는 상태를 가리키며, 회복의 정도를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그가 일을 못한 기간’은 부상으로 인해 정상적인 노동을 하지 못한 기간, 곧 소득 상실의 시간입니다.
    reason: cultural_note
  - marker: c
    text: ‘온전히 낫게 해야 합니다’는 히브리어의 강조형 표현(“고치고 또 고치다”)을 반영한 것으로, 단순한 치료가 아니라 완전한 회복을 책임지라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: ~하면
  alternatives_korean:
  - 만약 ~한다면
  - ~일 경우
  lexicon: HALOT
  rationale: 조건법의 법조문 서두를 한국어 사례법 문맥에 자연스럽게 옮겼습니다.
- source_word: יָקוּם וְהִתְהַלֵּךְ
  english_pob_choice: he gets up and walks about
  chosen_korean: 일어나 ... 다니면
  alternatives_korean:
  - 일어나 ... 걷고 있으면
  - 일어나 ... 걸어 다니면
  lexicon: HALOT
  rationale: 회복되어 기동이 가능한 상태를 나타내므로 단발적 ‘걷다’보다 지속적 이동을 드러냈습니다.
- source_word: בַּחוּץ עַל מִשְׁעַנְתּוֹ
  english_pob_choice: outside on his staff
  chosen_korean: 지팡이를 짚고 밖을
  alternatives_korean:
  - 지팡이에 의지해 바깥을
  - 지팡이를 짚은 채 밖에서
  lexicon: HALOT
  rationale: ‘밖’과 ‘지팡이’는 부분 회복의 외적 징표이므로, supported walking의 뉘앙스를 자연스럽게 살렸습니다.
- source_word: וְנִקָּה הַמַּכֶּה
  english_pob_choice: the one who struck him shall be cleared
  chosen_korean: 그를 친 자는 벌을 면하되
  alternatives_korean:
  - 그를 친 자는 무죄가 되되
  - 그를 친 자는 책임에서 벗어나되
  lexicon: HALOT
  rationale: 법정적 면책을 뜻하지만, 한국어에서는 ‘벌을 면하다’가 처벌 면제의 의미를 가장 분명하게 전달합니다.
- source_word: שִׁבְתּוֹ יִתֵּן
  english_pob_choice: he must only pay for his lost time
  chosen_korean: 그가 일을 못한 기간에 대해서만 갚고
  alternatives_korean:
  - 그의 잃은 시간에 대해 갚고
  - 그의 손실된 노동 시간만 보상하고
  lexicon: HALOT
  rationale: 문맥상 단순 ‘앉아 있음’이 아니라 부상으로 인한 노동 불능 기간을 가리키므로, 그 의미를 한국어로 풀어 옮겼습니다.
- source_word: וְרַפֹּא יְרַפֵּא
  english_pob_choice: have him thoroughly healed
  chosen_korean: 그를 온전히 낫게 해야 합니다
  alternatives_korean:
  - 그의 치료를 반드시 책임져야 합니다
  - 그를 완전히 치료해야 합니다
  lexicon: HALOT
  rationale: 히브리어 강조형(‘고치고 또 고치다’)을 ‘온전히’로 살리되, 법조문체에 맞게 의무를 분명히 했습니다.
theological_decisions:
- issue: 법조문에서 가해자의 책임 범위
  chosen_reading: 가해자는 즉시 형벌을 면할 수 있지만, 피해자의 회복에 대한 경제적 책임은 계속 집니다.
  alternative_readings:
  - 가해자는 완전히 면책됩니다
  - 가해자는 단지 치료비만 부담합니다
  rationale: 히브리어는 ‘면책’과 ‘보상’ 및 ‘완전한 회복의 책임’을 함께 둡니다. 이를 분리해 번역해야 법문의 긴장과 의무 범위가 보존됩니다.
  doctrine_reference: 출애굽기 21:19의 사례법 구조
- issue: ‘그를 온전히 낫게 해야 합니다’의 주체성
  chosen_reading: 가해자가 직접 의사가 되는 것이 아니라, 피해자의 치유가 실제로 이루어지도록 책임져야 한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 가해자가 직접 치료해야 한다
  - 치료비만 내면 된다
  rationale: 영문 POB의 audit trail이 causative force를 지적하므로, 한국어도 ‘치료를 보장하는 책임’으로 읽히게 해야 원문 의미가 보존됩니다.
  doctrine_reference: 히브리어 אינפיניטive absolute + 동사 강조법
