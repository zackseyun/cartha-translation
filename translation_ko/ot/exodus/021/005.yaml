  text: וְ/אִם אָמֹ֤ר יֹאמַר֙ הָ/עֶ֔בֶד אָהַ֨בְתִּי֙ אֶת אֲדֹנִ֔/י אֶת אִשְׁתִּ֖/י וְ/אֶת בָּנָ֑/י לֹ֥א אֵצֵ֖א חָפְשִֽׁי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the slave plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
  footnotes:
  - marker: a
    text: Or 'surely says' / 'explicitly says'; the Hebrew uses an infinitive absolute with the finite verb for emphasis.
