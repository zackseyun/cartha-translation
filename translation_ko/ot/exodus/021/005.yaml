id: EXO.21.5
reference: Exodus 21:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם אָמֹ֤ר יֹאמַר֙ הָ/עֶ֔בֶד אָהַ֨בְתִּי֙ אֶת אֲדֹנִ֔/י אֶת אִשְׁתִּ֖/י וְ/אֶת בָּנָ֑/י לֹ֥א אֵצֵ֖א חָפְשִֽׁי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the slave plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
  footnotes:
  - marker: a
    text: Or 'surely says' / 'explicitly says'; the Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'my sons'; the Hebrew is masculine plural, but here may refer to children generally in the household context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 종이 분명히 말합니다[a]. ‘저는 제 주인과 제 아내와 제 자녀들을 사랑합니다[b]. 저는 자유인으로 나가지 않겠습니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘확실히 말합니다’ / ‘분명하게 말합니다’. 히브리어는 강조를 위해 부정사 절대형과 동사를 함께 씁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제 아들들’. 히브리어는 남성 복수형이지만, 가정 맥락에서는 자녀 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 …
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞절과의 대비를 살려 조건의 예외를 한국어에서도 자연스럽게 드러내기 위해 ‘그러나’를 택했습니다.
- source_word: הָעֶבֶד
  english_pob_choice: the slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종된 사람
  - 종사
  lexicon: HALOT
  rationale: 이 문맥은 해방 여부가 걸린 법적 예속 상태를 가리키므로, ‘종’으로 옮기되 주종 관계의 종속성을 유지했습니다. 영어 POB의 ‘slave’ 선택을 한국어에서 직접 대응한 표현으로 보았습니다.
- source_word: אָמֹר יֹאמַר
  english_pob_choice: plainly says
  chosen_korean: 분명히 말합니다
  alternatives_korean:
  - 확실히 말합니다
  - 분명하게 말합니다
  - 정녕 말합니다
  lexicon: HALOT
  rationale: 부정사 절대형과 동사형의 강조를 한국어의 반복 없이도 드러내기 위해 ‘분명히 말합니다’로 옮겼습니다.
- source_word: בָּנָי
  english_pob_choice: my children
  chosen_korean: 제 자녀들
  alternatives_korean:
  - 제 아들들
  - 제 아이들
  lexicon: HALOT
  rationale: 형태는 남성 복수이지만 가정 맥락에서 후손 전체를 가리킬 수 있으므로, 영어 POB처럼 일반적이고 자연스러운 ‘자녀들’로 옮겼습니다.
theological_decisions:
- issue: 종의 자기 선언에서 자유 해제 거부의 표현
  chosen_reading: “저는 자유인으로 나가지 않겠습니다”
  alternative_readings:
  - “저는 자유롭게 나가지 않겠습니다”
  - “저는 자유로 풀려나지 않겠습니다”
  rationale: 히브리어의 ‘자유로운 상태로 나가다’라는 법적 관용구를 살리기 위해, 해방 후 신분을 분명히 드러내는 ‘자유인으로’로 옮겼습니다.
  doctrine_reference: 출애굽기 21:2-6의 종신 종살이 규례
- issue: 인용문 내부의 1인칭·대상 호칭
  chosen_reading: 직설적 자기 고백과 소유 표현을 유지했습니다.
  alternative_readings:
  - 완곡한 서술형으로 바꾸기
  - ‘주인’ 대신 ‘주님’ 사용
  rationale: 법적 진술의 직접성을 보존해야 하므로 인용문 내부의 발화체를 그대로 살렸고, אֲדֹנִי는 예배적 호칭이 아니라 가정-법정 맥락의 권위자이므로 ‘주인’ 계열 의미를 유지했습니다.
  doctrine_reference: 서술 장르와 언약 율법 문맥
