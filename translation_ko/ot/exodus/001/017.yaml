  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
  footnotes:
  - marker: a
    text: Or 'they kept the children alive.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 산파들은 하나님을 두려워하여, 애굽 왕이 그들에게 말한 대로 하지 않았습니다. 오히려 아이들을 살려 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살려 두었습니다’는 직역적 표현으로, 문자적으로는 ‘살게 했습니다/살아 있게 했습니다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּירֶאןָ הַמְיַלְּדֹת אֶת הָאֱלֹהִים
  english_pob_choice: the midwives feared God
  chosen_korean: 산파들은 하나님을 두려워하여
  alternatives_korean:
  - 산파들은 하나님을 경외하여
  - 산파들은 하나님을 두려워했습니다
  lexicon: HALOT
  rationale: ירא의 기본 의미를 따라 ‘두려워하다’를 유지하되, 한국어 문맥에서는 ‘하나님을 두려워하여’가 성경적 관용과 긴장을 가장 잘 보존합니다.
- source_word: מֶלֶךְ מִצְרַיִם
  english_pob_choice: the king of Egypt
  chosen_korean: 애굽 왕
  alternatives_korean:
  - 이집트 왕
  - 애굽의 왕
  lexicon: HALOT
  rationale: 성경 지명으로 굳어진 ‘애굽’을 사용해 서사적 배경을 유지하고, 소유격보다 간결한 명사구가 히브리어 구성과 자연스럽게 대응합니다.
- source_word: וְלֹא עָשׂוּ כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  english_pob_choice: and did not do as the king of Egypt had told them
  chosen_korean: 그들에게 말한 대로 하지 않았습니다
  alternatives_korean:
  - 그들에게 말한 바와 같이 하지 않았습니다
  - 그들에게 지시한 대로 따르지 않았습니다
  lexicon: HALOT
  rationale: דבר은 문자적으로 ‘말하다’이므로 ‘말한 대로’가 원문에 가장 가깝고, 명령의 힘은 문맥상 자연히 드러납니다.
- source_word: וַתְּחַיֶּיןָ אֶת הַיְלָדִים
  english_pob_choice: rather, they let the children live
  chosen_korean: 오히려 아이들을 살려 두었습니다
  alternatives_korean:
  - 오히려 아이들을 살렸습니다
  - 오히려 아이들이 살도록 했습니다
  lexicon: HALOT
  rationale: חיה의 사역적 뉘앙스를 한국어에서 간결하게 살리기 위해 ‘살려 두다’를 택해, 바로 앞의 살해 명령과 대비를 분명히 했습니다.
theological_decisions:
- issue: ‘fear God’의 한국어 어조
  chosen_reading: ‘하나님을 두려워하여’로 옮겨, 경외의 의미를 포함하되 관용구의 강도를 약화하지 않았습니다.
  alternative_readings:
  - 하나님을 경외하여
  - 하나님을 두려워했습니다
  rationale: 본문은 산파들의 순종 근거가 단순한 존중이 아니라 하나님 앞에서의 실제적인 두려움임을 보여 주므로, 전통적 완화 표현보다 직역성 있는 표현이 더 적절합니다.
  doctrine_reference: 원어 우선 번역 원칙, 경외/두려움의 긴장 보존
- issue: ‘rather’의 대조 관계
  chosen_reading: ‘오히려’로 처리해, 바로 앞의 부정과 뒤의 생명 부여를 선명하게 대비시켰습니다.
  alternative_readings:
  - 대신
  - 그리하여
  rationale: 히브리어의 대조적 흐름을 한국어에서도 분명히 드러내야 하므로, 문맥상 자연스럽고 격식 있는 ‘오히려’를 사용했습니다.
  doctrine_reference: 서사 대비 구조 보존
