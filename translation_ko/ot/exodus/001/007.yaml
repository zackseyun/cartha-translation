  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל פָּר֧וּ וַֽ/יִּשְׁרְצ֛וּ וַ/יִּרְבּ֥וּ וַ/יַּֽעַצְמ֖וּ בִּ/מְאֹ֣ד מְאֹ֑ד וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֹתָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
  footnotes:
  - marker: a
    text: Or 'And the sons of Israel'; Hebrew conjunction may be read simply as 'and,' but 'but' reflects the contrast with the previous verse.
    reason: alternative_reading
  - marker: b
    text: Or 'teemed'; the Hebrew verb evokes swarming or teeming abundance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘의 아들들은 생육하고 번성하며 떼 지어 늘어나고 매우 강해졌습니다[a][b]. 그래서 그 땅은 그들로 가득 찼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 접속사 ו는 단순한 ‘그리고’로도 읽을 수 있으나, 앞절과의 대비를 살려 ‘그러나’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 동사 וַיִּשְׁרְצוּ는 문자적으로 ‘우글거리다/떼를 지어 번성하다’의 이미지를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  english_pob_choice: But the sons of Israel
  chosen_korean: 그러나 이스라엘의 아들들은
  alternatives_korean:
  - 그리고 이스라엘의 아들들은
  - 이스라엘 사람들은
  lexicon: HALOT
  rationale: בני ישראל의 직역성을 살리면서도 한국어에서 자연스러운 소유격 구문으로 옮겼습니다. 문두 접속은 앞절과의 대비를 살려 ‘그러나’로 반영했습니다.
- source_word: פָּרוּ וַיִּשְׁרְצוּ וַיִּרְבּוּ
  english_pob_choice: were fruitful and swarmed and multiplied
  chosen_korean: 생육하고 번성하며 떼 지어 늘어나고
  alternatives_korean:
  - 열매를 맺고 우글거리며 많아지고
  - 번성하고 떼지어 늘어나고
  lexicon: HALOT
  rationale: פָּרוּ는 성경적 ‘생육하다’의 어감을 살리고, וַיִּשְׁרְצוּ는 생물의 무리 움직임을 드러내는 ‘떼 지어’로, וַיִּרְבּוּ는 수적 증가를 나타내는 ‘번성하다/늘어나다’로 옮겼습니다.
- source_word: וַיַּעַצְמ֖וּ בִּמְאֹד מְאֹד
  english_pob_choice: became exceedingly strong
  chosen_korean: 매우 강해졌습니다
  alternatives_korean:
  - 지극히 강해졌습니다
  - 아주 ძლ해졌습니다
  lexicon: HALOT
  rationale: עצם의 핵심을 ‘강하다’로 잡되, 반복 강조 בִּמְאֹד מְאֹד는 문맥상 충분히 드러나도록 ‘매우’로 표현했습니다. 수적 증가만이 아니라 세력의 강함까지 포함하는 표현입니다.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  english_pob_choice: so that the land was filled with them
  chosen_korean: 그래서 그 땅은 그들로 가득 찼습니다
  alternatives_korean:
  - 그리하여 그 땅이 그들로 채워졌습니다
  - 그 땅에 그들이 가득 찼습니다
  lexicon: HALOT
  rationale: 완성된 결과를 나타내는 뉘앙스를 살려 ‘그래서’로 연결했고, 주어인 ‘그 땅’이 그들로 채워졌음을 자연스러운 수동 표현으로 옮겼습니다.
theological_decisions:
- issue: פָּרוּ / וַיִּרְבּוּ의 창조·복복 축복 언어의 암시 처리
  chosen_reading: 본문의 직접적 진술인 생육과 번성의 연쇄를 유지하고, 창세기의 축복 언어를 본문 밖에서 설명하지 않았습니다.
  alternative_readings:
  - 창세기 축복의 메아리를 더 노골적으로 드러내는 해설적 번역
  rationale: 히브리어의 상호텍스트적 울림은 중요하지만, 본문에 없는 해설을 추가하기보다 어휘 선택으로 그 울림을 보존하는 편이 원문 충실도에 맞습니다.
  doctrine_reference: '번역 원리: 원어 우선 및 본문이 말하는 범위 안에서만 의미를 드러냄'
