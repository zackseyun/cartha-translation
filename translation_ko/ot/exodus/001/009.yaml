    text: 또는 더 관용적으로, ‘이스라엘 백성’. 히브리어는 문자적으로 ‘이스라엘 자손의 백성’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그러자 그가 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 wayyiqtol을 자연스러운 한국어 서술로 옮기되, 과도한 해석 없이 연결성을 살리기 위해 ‘그리고’와 평서형 과거를 사용했습니다.
- source_word: אֶל עַמּוֹ
  english_pob_choice: to his people
  chosen_korean: 자기 백성에게
  alternatives_korean:
  - 그의 백성에게
  - 자기 ժողովուրդ에게
  lexicon: HALOT
  rationale: עַם은 여기서 집단적·정치적 의미의 ‘백성’이 자연스럽고, 3인칭 소유격은 한국어에서 ‘자기’로 간결하게 드러낼 수 있습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 주의를 끄는 감탄·지시 표현을 현대 공식 문체로 옮기기 위해 ‘보십시오’를 택했습니다.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the people of the sons of Israel
  chosen_korean: 이스라엘 자손의 백성
  alternatives_korean:
  - 이스라엘 사람들의 백성
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 원문의 소유·관계 구조를 살려 ‘~의 백성’으로 옮겼고, בְּנֵי יִשְׂרָאֵל의 직역성을 유지하기 위해 ‘이스라엘 자손’을 보존했습니다.
- source_word: רַב וְעָצוּם
  english_pob_choice: more numerous and stronger
  chosen_korean: 더 많고 강합니다
  alternatives_korean:
  - 더 수가 많고 강합니다
  - 많고 강합니다
  lexicon: HALOT
  rationale: רַב은 수적 증가를, עָצוּם은 힘의 강함을 가리키므로 각각 한국어의 ‘많다’와 ‘강하다’로 대응해 대비를 분명히 했습니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: than we are
  chosen_korean: 우리보다
  alternatives_korean:
  - 우리보다도
  - 우리를 넘어서
  lexicon: HALOT
  rationale: מן의 비교 의미를 한국어 비교격 ‘보다’로 자연스럽게 옮겨, 본문의 비교 관계를 간명하게 드러냈습니다.
