  text: וַ/יֹּ֗אמֶר בְּ/יַלֶּדְ/כֶן֙ אֶת הָֽ/עִבְרִיּ֔וֹת וּ/רְאִיתֶ֖ן עַל הָ/אָבְנָ֑יִם אִם בֵּ֥ן הוּא֙ וַ/הֲמִתֶּ֣ן אֹת֔/וֹ וְ/אִם בַּ֥ת הִ֖יא וָ/חָֽיָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
  footnotes:
  - marker: a
    text: Hebrew literally, “on the two stones,” likely referring to a birthstool or birthing seat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “너희가 히브리 여인들의 해산을 도울 때, 그들이 해산 의자에 있는 것을 보고, 아들이면 그를 죽이십시오. 그러나 딸이면 살려 두십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자 그대로 옮기면 ‘두 돌 위에서’입니다. 이는 아마도 해산 의자나 분만 자리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  english_pob_choice: When you help ... give birth
  chosen_korean: 너희가 히브리 여인들을 도와 해산시킬 때
  alternatives_korean:
  - 너희가 히브리 여인들의 출산을 도울 때
  - 너희가 히브리 여인들의 분만을 맡을 때
  lexicon: HALOT
  rationale: 출산 보조의 뜻을 살리되, 현대 한국어에서 자연스러운 합쇼체로 옮겼습니다. 직역식 직함 표현보다 행위 중심 표현이 원문의 상황 명령을 더 분명하게 드러냅니다.
- source_word: עַל הָאָבְנָיִם
  english_pob_choice: on the birthstool
  chosen_korean: 산실 위에서
  alternatives_korean:
  - 해산 의자 위에서
  - 두 돌 위에서
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘두 돌’이지만, 출산 장면의 관용구로 이해되어야 합니다. 본문에서는 의미를 살려 ‘산실 위에서’로 옮기고, 문자적 표현은 필요 시 각주로 처리하는 편이 더 적절합니다.
- source_word: אִם בֵּן הוּא
  english_pob_choice: if it is a son
  chosen_korean: 아들이면
  alternatives_korean:
  - 그가 아들이면
  - 아들일 경우
  lexicon: HALOT
  rationale: בן의 성별 구분을 간결하게 살리면서, 명령문 흐름에 맞는 한국어 조건절로 다듬었습니다.
- source_word: וַהֲמִתֶּן אֹתוֹ
  english_pob_choice: then you shall put him to death
  chosen_korean: 그를 죽이십시오
  alternatives_korean:
  - 그를 죽여야 합니다
  - 그를 사형에 처하십시오
  lexicon: HALOT
  rationale: 히브리어 사역형은 ‘죽게 하다/죽이다’의 공식적 명령으로, 한국어에서는 직접적이고 문맥에 맞는 ‘죽이십시오’가 가장 자연스럽습니다. 왕의 칙령이라는 점은 문맥이 충분히 드러냅니다.
- source_word: וְאִם בַּת הִיא
  english_pob_choice: but if it is a daughter
  chosen_korean: 그러나 딸이면
  alternatives_korean:
  - 그리고 딸이면
  - 하지만 딸이면
  lexicon: HALOT
  rationale: 아들/딸의 대조를 한국어 접속으로 분명히 드러냈습니다. 성별 대응 구조를 유지하면서 문장 흐름도 자연스럽게 했습니다.
theological_decisions:
- issue: 명령문의 직접성
  chosen_reading: 파라오의 살해 명령을 완화하지 않고 직접 명령형으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘그를 죽게 하십시오’로 풀기
  - 설명적으로 ‘죽음에 이르게 하십시오’로 바꾸기
  rationale: 본문은 산파들에게 특정 남아 살해를 명하는 폭력적 칙령이므로, 원문의 도덕적 무게를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 본문 역사적 서술의 정직성
