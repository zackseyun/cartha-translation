base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the river.'' In Exodus this term commonly refers specifically to the Nile.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Every boy who is born.' Hebrew 'son' can function generically for a male child in this context.
    reason: lexical_alternative
  - marker: c
    text: Literally 'and every daughter'; the conjunction is rendered 'but' in English to show the contrast in Pharaoh's decree.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 파라오가 자기 백성 모두에게 명령하여 말했습니다. “태어나는 남자아이는 모두 나일강에 던져 버리고, 여자아이는 모두 살려 두십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘강’은 출애굽기에서 대개 나일강을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘태어나는 모든 아들’이지만, 이 문맥에서는 ‘남자아이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 접속사 ‘그리고’는 앞 명령과의 대조를 드러내기 위해 한국어에서는 ‘그리고’보다 ‘하지만’에 가깝게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 명하여
  - 지시하여
  lexicon: HALOT
  rationale: 왕의 칙령 성격을 살리면서 현대 한국어에서 자연스러운 동사로 옮겼습니다.
- source_word: לְכָל עַמּוֹ
  english_pob_choice: all his people
  chosen_korean: 자기 백성 모두에게
  alternatives_korean:
  - 자기 사람들 모두에게
  - 자기 백성 전체에게
  lexicon: HALOT
  rationale: עַם의 집합적 의미를 살려 ‘백성’으로 옮기고, 전체 범위를 ‘모두에게’로 분명히 했습니다.
- source_word: הַיְאֹרָה
  english_pob_choice: into the Nile
  chosen_korean: 나일강에
  alternatives_korean:
  - 강에
  - 나일강으로
  lexicon: HALOT
  rationale: 출애굽기에서 יְאֹר가 가리키는 특정 대상을 분명히 드러내기 위해 ‘나일강’으로 옮겼습니다.
- source_word: תַּשְׁלִיכֻהוּ
  english_pob_choice: you must throw
  chosen_korean: 던져 버리고
  alternatives_korean:
  - 던지십시오
  - 내던지고
  lexicon: HALOT
  rationale: 살해 의도가 담긴 폭력적 명령의 강도를 살리기 위해 ‘던져 버리고’로 옮겼습니다.
- source_word: תְּחַיּוּן
  english_pob_choice: you must let live
  chosen_korean: 살려 두십시오
  alternatives_korean:
  - 살게 하십시오
  - 살려 두어야 합니다
  lexicon: HALOT
  rationale: 대조 구조를 분명히 하면서도 히브리어의 ‘살게 하다/살려 두다’ 의미를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 남자아이/아들 표현의 범위
  chosen_reading: ‘태어나는 남자아이’로 옮겨, בֵּן이 이 문맥에서 남자 자손 전체를 가리키는 넓은 용례를 반영했습니다.
  alternative_readings:
  - ‘태어나는 아들’
  - ‘태어나는 남자아이’
  rationale: 히브리어 ‘아들’의 문자성은 유지하되, 현대 독자가 칙령의 대상이 남아라는 점을 즉시 이해하도록 했습니다.
  doctrine_reference: 본문 문맥상 성별 표지의 법적·서사적 기능
