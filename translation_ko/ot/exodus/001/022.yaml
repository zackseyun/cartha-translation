theological_decisions:
- issue: 남자아이/아들 표현의 범위
  chosen_reading: ‘태어나는 남자아이’로 옮겨, בֵּן이 이 문맥에서 남자 자손 전체를 가리키는 넓은 용례를 반영했습니다.
  alternative_readings:
  - ‘태어나는 아들’
  - ‘태어나는 남자아이’
  rationale: 히브리어 ‘아들’의 문자성은 유지하되, 현대 독자가 칙령의 대상이 남아라는 점을 즉시 이해하도록 했습니다.
  doctrine_reference: 본문 문맥상 성별 표지의 법적·서사적 기능
