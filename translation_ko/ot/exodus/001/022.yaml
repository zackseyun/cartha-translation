  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘던져 버리고’의 ‘버리다’는 히브리어 השליך에 명시되지 않은 완료·폐기의 뉘앙스를 더할 수 있으므로 단순히 ‘던지십시오’가 더 정확합니다. 또한 본문의 접속사는 대조적으로 처리할 수 있으나, 현 번역문은 실제로 대조 접속사를 쓰지 않아 관련 각주와 일치하지 않습니다.
  naturalness: 합쇼체의 직접 명령문은 자연스럽습니다. ‘명령하여 말했습니다’보다 ‘이렇게 명령했습니다’가 현대 한국어에서 더 간결하고 자연스럽습니다. 두 명령을 문장으로 나누고 ‘그러나’를 사용하면 대조가 분명해집니다.
  terminology: ‘파라오’, ‘백성’, ‘나일강’, ‘남자아이’, ‘살려 두십시오’는 문맥과 현대 표준어에 적절합니다. ‘남자아이’는 이 문맥에서 בן이 가리키는 남아 전체를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: ‘던져 버리고’가 원문의 동사에 없는 뉘앙스를 보탭니다.
    rationale: תשליכהו는 ‘그를 던지다’라는 명령입니다. ‘-아/어 버리다’는 한국어에서 행위의 완료, 처분 또는 유기의 뉘앙스를 더할 수 있으므로, 원문의 표현 범위를 넘지 않는 ‘던지십시오’가 안전합니다.
