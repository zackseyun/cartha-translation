    rationale: 각주는 히브리어 접속사를 한국어에서 ‘하지만’에 가깝게 옮겼다고 설명하지만, 본문은 ‘던져 버리고, 여자아이는’으로 되어 있어 대조 접속사가 명시되지 않습니다. 본문을 ‘그러나’로 고치고 각주도 이에 맞추어야 합니다.
  - severity: low
    issue: 각주 표지가 모두 인용문 끝에 몰려 있어 해당 어휘와의 연결이 불분명합니다.
