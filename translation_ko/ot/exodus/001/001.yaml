  lexicon: HALOT
  rationale: 도착의 방향성을 담으면서도 현대 한국어에서 가장 자연스러운 관계절로 옮겼습니다.
- source_word: אֵת יַעֲקֹב
  english_pob_choice: with Jacob
  chosen_korean: 야곱과 함께
  alternatives_korean:
