  lexicon: HALOT
  rationale: אֵת가 동반을 나타내므로 목적격으로 오해되지 않도록 '함께'로 풀었습니다.
- source_word: אִישׁ וּבֵיתוֹ
  english_pob_choice: each man with his household
  chosen_korean: 각 사람과 그의 집안
