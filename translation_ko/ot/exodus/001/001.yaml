  source_fidelity: 현 번역은 주요 명사구를 대체로 충실히 옮겼지만, 히브리어 문장 끝의 동사 בָּאוּ(‘그들이 왔다/들어갔다’)가 번역되지 않았습니다. 또한 ‘각 사람과 그의 집안입니다’는 ‘이름’의 서술어처럼 읽혀 원문의 분배 구문을 정확히 전달하지 못합니다.
  naturalness: ‘이것이 … 이름입니다’도 가능하나, 목록을 도입하는 현대 한국어로는 ‘… 이름은 이러합니다’가 더 자연스럽습니다. 반복된 이동 동사는 두 절로 나누어 자연스럽게 유지할 수 있습니다.
  terminology: ‘이스라엘의 아들들’, ‘야곱’, ‘집안’은 원문의 남성 집단 지시, 인명, household의 의미를 적절히 반영합니다. ‘들어가다’는 이집트를 향한 이동과 정착지 진입의 문맥에 자연스럽습니다.
