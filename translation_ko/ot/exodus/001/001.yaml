  - 각 사람과 그의 가족
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미와 בַּיִת의 가정 단위를 살리되, '집안'으로 번역해 혈연·가정 단위를 함께 드러냈습니다.
theological_decisions:
- issue: 문장 결속과 새로운 출발의 긴장
  chosen_reading: 이것이로 시작해, 앞선 창세기 이야기와 이어지면서도 출애굽기의 새 국면을 여는 문장으로 처리했습니다.
  alternative_readings:
