translation:
  language: ko
  text: 야곱의 허리에서 나온[a] 모든 사람은 칠십 명이었고, 요셉은 이미 이집트에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘야곱의 허리에서 나온’입니다. 이는 그의 직계 후손을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נֶפֶשׁ ... שִׁבְעִים נָפֶשׁ
  english_pob_choice: all the persons ... seventy persons
  chosen_korean: 모든 사람은 칠십 명
  alternatives_korean:
  - 모든 영혼은 칠십 명
  - 모든 사람은 칠십 사람
  lexicon: HALOT
  rationale: 여기서 nephesh는 ‘영혼’이 아니라 수를 세는 ‘사람’의 뜻이므로, 한국어도 자연스럽게 ‘사람’으로 옮기되 총수를 분명히 하기 위해 ‘칠십 명’으로 처리했습니다.
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  english_pob_choice: who came from Jacob’s loins
  chosen_korean: 야곱의 허리에서 나온
  alternatives_korean:
  - 야곱의 넓적다리에서 나온
  - 야곱에게서 태어난
  - 야곱의 몸에서 나온
  lexicon: HALOT
  rationale: 히브리어의 직설적인 신체 관용구를 보존하기 위해 ‘허리’로 옮겼습니다. 이는 단순한 ‘후손’보다 원문의 육체적 이미지를 더 잘 드러냅니다.
- source_word: וְיוֹסֵף הָיָה בְמִצְרָיִם
  english_pob_choice: and Joseph was already in Egypt
  chosen_korean: 요셉은 이미 이집트에 있었습니다
  alternatives_korean:
  - 그리고 요셉은 이집트에 있었습니다
  - 요셉은 이집트에 이미 있었습니다
  lexicon: HALOT
  rationale: 문맥상 요셉이 야곱의 집안이 내려오기 이전부터 그곳에 있었던 선행 상태를 나타내므로, 한국어에서는 ‘이미’로 시간적 선행성을 분명히 했습니다.
theological_decisions:
- issue: 야곱의 직계 후손을 지시하는 신체 관용구의 처리
  chosen_reading: 직계 혈통을 가리키는 관용구를 직역에 가깝게 보존했습니다.
  alternative_readings:
  - 완전히 풀어서 ‘야곱의 직계 후손’으로 번역
  rationale: 본문은 단순한 족보 정보 이상으로 ‘허리/넓적다리에서 나옴’이라는 육체적 연속성을 강조하므로, 이를 평탄화하지 않고 남겨 두는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 창세기 46:26, 히브리적 혈통/계승 표현
