source:
  edition: WLC
  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
  footnotes:
  - marker: a
    text: Hebrew 'with him'; the singular pronoun refers collectively to Israel, so English renders the sense as 'with them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'let us deal wisely with them.' The Hebrew can denote acting cleverly or wisely; here the context favors a shrewd, politically calculating sense.
    reason: lexical_alternative
  - marker: c
    text: Or 'and leave the land.' Hebrew literally, 'and go up out of the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: “자, 우리가 그에게 대하여 지혜롭게 대처합시다. 그렇지 않으면 그가 번성하고, 전쟁이 일어나면 그도 우리 원수들과 합세하여 우리와 싸우고 이 땅에서 올라가 버릴 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 대명사 ‘그에게’를 쓰지만, 대상은 집합적으로 이스라엘 백성을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘지혜롭게’는 여기서 도덕적 지혜라기보다 계산적이고 교묘한 대응을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘땅에서 올라가다’입니다. 한국어 본문은 그 이미지를 살렸습니다.
    reason: source_note
lexical_decisions:
- source_word: הָבָה
  english_pob_choice: Come
  chosen_korean: 자
  alternatives_korean:
  - 오라
  - 자, 이제
  lexicon: HALOT
  rationale: 즉각적인 공동 행동을 촉구하는 감탄사로, 한국어에서는 짧은 ‘자’가 가장 자연스럽고 명령적 추진력을 잘 살립니다.
- source_word: נִתְחַכְּמָה
  english_pob_choice: let us deal shrewdly
  chosen_korean: 지혜롭게 대처합시다
  alternatives_korean:
  - 간교하게 대처합시다
  - 영리하게 행동합시다
  - 지혜롭게 행동합시다
  lexicon: HALOT
  rationale: 본문의 의도는 단순한 지혜가 아니라 정치적으로 계산된 대응이므로, 너무 긍정적인 ‘지혜롭게’의 의미를 유지하되 ‘대처하다’로 전략적 조치를 드러냈습니다.
- source_word: וְעָלָה מִן הָאָרֶץ
  english_pob_choice: and go up out of the land
  chosen_korean: 이 땅에서 올라가 버릴 것입니다
  alternatives_korean:
  - 이 땅을 떠날 것입니다
  - 이 땅에서 나갈 것입니다
  lexicon: HALOT
  rationale: ‘올라가다’는 히브리어 עלה의 방향성을 살리는 표현이며, POB의 ‘go up out of the land’에 맞춰 출애굽 서사의 이동 이미지를 보존했습니다.
theological_decisions:
- issue: 이스라엘을 가리키는 단수 대명사의 집합적 지시
  chosen_reading: ‘그에게’로 옮기되, 뒤 문맥 전체에서 이집트인들이 집단적으로 이스라엘을 경계하는 흐름을 유지했습니다.
  alternative_readings:
  - ‘그들에 대하여’로 곧바로 집합화하기
  - ‘그분에 대하여’로 오해될 가능성을 감수하기
  rationale: 히브리어 לוֹ는 형태상 단수이지만 집합명사 이스라엘을 가리키므로, 한국어에서는 어색한 단수 화법을 피하면서도 집합적 대상의 긴장을 보존해야 합니다.
  doctrine_reference: 집합명사/대명사 지시의 문법적 처리
- issue: ‘이 땅’의 관점 유지
  chosen_reading: 파라오의 관점에서 말하는 ‘이 땅’으로 직역해, 소유권 주장과 위기의식을 드러냈습니다.
  alternative_readings:
  - ‘그 땅’으로 중립화하기
  - ‘우리 땅’으로 명시하기
  rationale: 본문의 정치적 공포는 발화자의 관점이 중요한데, 중립화하면 원문의 위협감과 권력 감각이 약해집니다.
  doctrine_reference: 서사적 관점 보존
