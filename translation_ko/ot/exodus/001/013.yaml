translation:
  language: ko
  text: 그리고 이집트 사람들은 이스라엘 자손을 혹독하게 부렸습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’이나 전통적으로는 ‘이스라엘 자손들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가혹하게’, ‘잔인하게’라고도 옮길 수 있습니다. 히브리어는 강제 노역의 심한 압박과 짓눌림을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  english_pob_choice: made ... serve
  chosen_korean: 부렸습니다
  alternatives_korean:
  - 섬기게 했습니다
  - 노역하게 했습니다
  - 종으로 삼았습니다
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 한국어 동사 ‘부리다’로 간결하게 살려, 강제로 일을 시키는 뉘앙스를 자연스럽게 전달합니다. ‘종으로 삼다’는 결과를 더 강하게 해석할 수 있어 본문보다 앞서갑니다.
- source_word: מִצְרַיִם
  english_pob_choice: the Egyptians
  chosen_korean: 이집트 사람들은
  alternatives_korean:
  - 이집트는
  - 애굽 사람들은
  lexicon: HALOT
  rationale: 문맥상 사람을 주어로 보는 것이 자연스럽고, 복수 민족명으로서의 주체성을 분명히 드러냅니다. ‘애굽’은 전통적이지만 현대 표준어 문장에서는 ‘이집트’가 더 자연스럽습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손을
  alternatives_korean:
  - 이스라엘의 아들들을
  - 이스라엘 사람들을
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: 히브리어의 관용적 집단 명칭을 가능한 한 형식적으로 살리되, 현대 한국어에서 자연스럽게 읽히도록 ‘자손’을 유지했습니다. 이는 영어 POB의 ‘sons of Israel’에 대응하면서도 본문의 가족-언약 공동체 뉘앙스를 보존합니다.
- source_word: בְּפָרֶךְ
  english_pob_choice: harshly
  chosen_korean: 혹독하게
  alternatives_korean:
  - 가혹하게
  - 냉혹하게
  - 잔혹하게
  lexicon: HALOT
  rationale: פָּרֶךְ가 강제 노역의 ‘짓눌리는 듯한 가혹함’을 뜻하므로, 한국어에서는 결과적 감각을 살린 ‘혹독하게’가 가장 자연스럽고 과도한 정서화도 피합니다.
theological_decisions:
- issue: 이스라엘 집단 명칭의 직역 유지
  chosen_reading: ‘이스라엘 자손’을 본문에 그대로 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 민족
  rationale: 이 표현은 족장-언약 전승을 가리키는 성경적 고정구이므로, 평이한 민족명으로 완전히 풀기보다 원문의 혈연·언약적 집단성을 살리는 것이 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
