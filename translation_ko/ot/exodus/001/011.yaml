translation:
  language: ko
  text: 그래서 그들은 그에게[a] 노역 감독들을 세워, 그들의 짐으로 그를 괴롭히게 했습니다. 그는[a] 바로를 위하여 저장 성읍들[b], 곧 비돔과 라암셋[c]을 건설했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수형(‘그에게’, ‘그가’)을 사용하지만, 문맥상 이스라엘 백성 전체를 가리키는 집합적 단수입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘비축 성읍들’ 또는 ‘저장고 성읍들’.
    reason: lexical_alternative
  - marker: c
    text: 라암셋은 ‘라암세스’로도 옮길 수 있습니다.
    reason: lexical_alternative
