  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 기준에 맞추되, 전승된 성경 지명으로서 한국어 독자에게 익숙한 음역을 우선했습니다.
theological_decisions:
- issue: 히브리어의 집합적 단수 표현(‘그에게 / 그가’) 보존 여부
  chosen_reading: 문맥상 이스라엘 백성 전체를 가리키는 집합적 단수로 이해하여 ‘그에게 / 그를 / 그는’ 형태를 유지했습니다.
  alternative_readings:
  - 그들에게 / 그들을 / 그들은
  rationale: 본문의 히브리어는 단수 어미를 사용하지만 집합적으로 이스라엘을 가리키는 표현이므로, 숫자를 평준화하지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 원문 형태 보존 및 집합명사 사용
