  rationale: ענה의 핵심 의미인 ‘괴롭히다/압제하다/학대하다’ 중에서, 여기서는 노동을 통한 가혹한 대우를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: בְּסִבְלֹתָם
  english_pob_choice: with their burdens
  chosen_korean: 그들의 짐으로
  alternatives_korean:
