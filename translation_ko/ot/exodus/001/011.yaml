  lexicon: HALOT
  rationale: סִבְלֹת은 ‘짐, 부담, 짐 지는 노동’의 범위를 가지므로, 물리적 짐과 강제노동의 뉘앙스를 함께 살리는 ‘그들의 짐으로’가 원문에 가장 가깝습니다.
- source_word: עָרֵי מִסְכְּנוֹת
  english_pob_choice: storage cities
  chosen_korean: 비축 성읍들
  alternatives_korean:
  - 저장 성읍들
  - 저장고 성읍들
  - 물자 저장 성읍들
  lexicon: HALOT
  rationale: ‘storage cities’에 대응하되, 현대 한국어에서 의미가 분명하고 문맥상 군수·비축 기능을 살릴 수 있는 표현으로 ‘비축 성읍들’을 선택했습니다.
- source_word: פִּתֹם / רַעַמְסֵס
  english_pob_choice: Pithom / Rameses
  chosen_korean: 비돔과 라암셋
  alternatives_korean:
