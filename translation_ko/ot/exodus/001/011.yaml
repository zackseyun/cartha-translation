base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
  footnotes:
  - marker: a
    text: Or 'over them' and 'they built'; the Hebrew uses singular forms ('over him,' 'he built') to refer collectively to Israel.
    reason: alternative_reading
  - marker: b
    text: Or 'store cities.'
    reason: lexical_alternative
  - marker: c
    text: Rameses may also be rendered 'Raamses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그들은 그에게 감독들을 세워서, 그들의 짐으로 그를 괴롭히게 했습니다. 그리고 그는 바로를 위해 비축 성읍들, 곧 비돔과 라암셋을 건설했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수형(‘그에게’, ‘그가’)을 사용하지만, 문맥상 이스라엘 백성 전체를 가리키는 집합적 단수입니다.
    reason: source_note
  - marker: b
    text: ‘비축 성읍들’은 직역에 가까우며, ‘저장 성읍들’ 또는 ‘store cities’의 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: 라암셋은 ‘라암세스’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
