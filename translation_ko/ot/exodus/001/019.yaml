base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
  footnotes:
  - marker: a
    text: Or 'for they are lively/robust'; the Hebrew adjective may emphasize strength and quickness in childbirth. Some interpreters take it more literally as 'like animals,' but that is less clear in contemporary English.
    reason: lexical_alternative
translation:
  language: ko
  text: 산파들이 파라오에게 말했습니다. 「히브리 여인들은 이집트 여인들과 같지 않습니다. 그들은 기운이 강해서, 산파가 그들에게 도착하기도 전에 이미 해산합니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기운이 강해서’는 히브리어 형용사의 힘과 민첩함을 살린 번역입니다. 어떤 해석은 더 문자적으로 ‘짐승과 같다’는 뉘앙스를 보지만, 현대 한국어에서는 그 의미가 본문보다 더 강하게 들릴 수 있습니다.
    reason: lexical_alternative
