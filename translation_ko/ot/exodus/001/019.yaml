  lexicon: HALOT
  rationale: POB가 지적하듯 이 형용사는 출산 상황에서의 강건함과 민첩함을 가리키므로, 모호한 동물성 뉘앙스를 피하면서도 힘의 감각을 살렸습니다.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת וְיָלָדוּ
  english_pob_choice: before the midwife comes to them, they have given birth
  chosen_korean: 산파가 그들에게 도착하기도 전에 이미 해산합니다
  alternatives_korean:
  - 산파가 그들에게 도착하기도 전에 이미 해산합니다
  - 산파가 그들에게 오기도 전에 이미 아이를 낳습니다
  lexicon: HALOT
  rationale: ‘before’의 선행 완료를 한국어에서 ‘-기도 전에 이미’로 표현해 시제 관계를 분명히 했고, ‘해산하다’로 출산 행위를 직접적으로 살렸습니다.
theological_decisions:
- issue: 출산 묘사의 어휘 선택
  chosen_reading: ‘חָיוֹת’는 산파의 시각에서 본 강건함을 나타내므로, 지나치게 완곡한 표현보다 출산 능력의 빠름과 힘을 드러내는 번역을 택했습니다.
  alternative_readings:
  - 동물처럼 본다는 뉘앙스를 살린 번역
  - 단순히 ‘활발하다’고 완화한 번역
  rationale: 본문의 설명적 대조가 핵심이므로, 잠재된 경멸적 의미를 과도하게 확정하지 않으면서도 본문이 의도한 능력의 차이를 보존했습니다.
  doctrine_reference: 본문 주해 원칙
