theological_decisions:
- issue: 마지막 절의 פחד/קוץ 계열 반응 동사 처리
  chosen_reading: '''두려워했습니다''로 옮겨, 이집트 측의 감정이 단순한 혐오보다 위협에 대한 공포임을 드러냈습니다.'
  alternative_readings:
