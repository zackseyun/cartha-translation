base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'him,' referring collectively to Israel; English renders the collective sense as 'them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they were in dread of' or 'they loathed.' The Hebrew verb can express strong dread or abhorrence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이스라엘 자손을 더 심하게 괴롭힐수록[a][b], 이스라엘 자손은 더 번성하고 더 널리 퍼졌습니다. 그러자 이집트 사람들은 이스라엘 자손 때문에 두려워하게 되었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그’를 뜻하는 집합적 단수 대명사를 쓰지만, 문맥상 이스라엘 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘더 …할수록, 더 …하고 더 …하다’라는 비례 대응 구조를 사용합니다.
    reason: source_note
  - marker: c
    text: 히브리어 동사는 강한 두려움뿐 아니라 혐오나 몹시 싫어함의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
