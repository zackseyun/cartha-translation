source:
  edition: WLC
  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'him,' referring collectively to Israel; English renders the collective sense as 'them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they were in dread of' or 'they loathed.' The Hebrew verb can express strong dread or abhorrence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 더 심하게 괴롭힐수록, 이스라엘 자손은 더 번성하고 더 널리 퍼졌습니다. 그래서 그들은 이스라엘 자손 때문에 두려워했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 집합명사적 단수 대명사를 쓰지만, 문맥상 이스라엘 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 비례 대응 구조를 사용하여 '더 ...할수록'의 의미를 나타냅니다.
    reason: source_note
  - marker: c
    text: 히브리어 동사는 강한 공포와 혐오의 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  english_pob_choice: But the more ... the more ... and the more ...
  chosen_korean: 더 ...할수록, 더 ...하고 더 ...졌습니다
  alternatives_korean:
  - 그리고 ...한 대로 ...
  - 하지만 ...하자 ...
  - 더 ...하면 ...
  lexicon: HALOT
  rationale: 비례 대응 구조를 한국어의 '-할수록'으로 자연스럽게 살리되, 문맥상 억압과 증가의 대비를 드러냈습니다.
- source_word: יְעַנּוּ
  english_pob_choice: they afflicted
  chosen_korean: 괴롭힐수록
  alternatives_korean:
  - 학대할수록
  - 억압할수록
  - 고통 주면
  lexicon: HALOT
  rationale: ענה의 피엘은 단순 압박보다 가혹한 대우와 고통을 포함하므로, 현대 한국어에서 가장 직접적인 '괴롭히다'를 택했습니다.
- source_word: יִרְבֶּה
  english_pob_choice: they multiplied
  chosen_korean: 번성하고
  alternatives_korean:
  - 증가하고
  - 불어나고
  - 많아지고
  lexicon: HALOT
  rationale: 라בה는 수적 증대와 번성을 가리키므로, 단순 증가보다 생명력 있는 성장감을 주는 '번성하다'를 사용했습니다.
- source_word: וְכֵן יִפְרֹץ
  english_pob_choice: and the more they spread out
  chosen_korean: 더 널리 퍼졌습니다
  alternatives_korean:
  - 더 퍼졌습니다
  - 더 크게 번졌습니다
  - 더 폭발적으로 퍼졌습니다
  lexicon: HALOT
  rationale: פרץ는 '터져 나가다, 확장하다'의 힘을 가지므로, 과도하게 해석하지 않으면서 확장성을 살린 '널리 퍼지다'로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어 관용구를 투명하게 반영하면서도 한국어 성경에서 널리 통용되는 형식인 '이스라엘 자손'을 유지했습니다.
theological_decisions:
- issue: 마지막 절의 פחד/קוץ 계열 반응 동사 처리
  chosen_reading: '''두려워했습니다''로 옮겨, 이집트 측의 감정이 단순한 혐오보다 위협에 대한 공포임을 드러냈습니다.'
  alternative_readings:
  - 싫어했습니다
  - 혐오했습니다
  - 몹시 두려워했습니다
  rationale: 문맥상 이스라엘의 증가는 정책적 억압을 낳는 공포의 원인이므로, '두려워하다'가 가장 균형 있게 본문 의미를 전달합니다.
  doctrine_reference: Translation philosophy and context-sensitive semantic range
