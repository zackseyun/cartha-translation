  text: Then Joseph died, and all his brothers, and all that generation.
translation:
  language: ko
  text: 그때 요셉이 죽었고, 그의 모든 형제와 그 세대의 모든 사람도 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: Then ... died
  chosen_korean: 그때 ... 죽었습니다
  alternatives_korean:
  - 그리고 ... 죽었습니다
  - 이제 ... 죽었습니다
  lexicon: HALOT
  rationale: 와우 연속형 מות은 서술의 진행과 사건 발생을 나타내므로, 한국어에서는 시간 전개를 살리는 「그때」가 가장 자연스럽습니다.
- source_word: אֶחָיו
  english_pob_choice: his brothers
  chosen_korean: 그의 모든 형제
  alternatives_korean:
  - 그의 형제들
  - 그의 형제들 모두
  lexicon: HALOT
  rationale: 복수형 ‘형제들’이 요셉의 남성 형제들을 가리키며, 반복된 כֹּל의 포괄성을 반영해 ‘모든’을 넣었습니다.
- source_word: הַדּוֹר הַהוּא
  english_pob_choice: that generation
  chosen_korean: 그 세대의 모든 사람
  alternatives_korean:
  - 그 세대
  - 그때의 세대
  lexicon: HALOT
  rationale: דּוֹר는 동시대 사람들의 집단을 뜻하므로, 한국어에서는 ‘세대’만 두기보다 그 세대의 사람들을 가리키는 뜻이 드러나도록 옮겼습니다.
