id: EXO.1.14
reference: Exodus 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְמָרְר֨וּ אֶת חַיֵּי/הֶ֜ם בַּ/עֲבֹדָ֣ה קָשָׁ֗ה בְּ/חֹ֨מֶר֙ וּ/בִ/לְבֵנִ֔ים וּ/בְ/כָל עֲבֹדָ֖ה בַּ/שָּׂדֶ֑ה אֵ֚ת כָּל עֲבֹ֣דָתָ֔/ם אֲשֶׁר עָבְד֥וּ בָ/הֶ֖ם בְּ/פָֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
  footnotes:
  - marker: a
    text: Or 'with ruthlessness' for 'with harshness.' The Hebrew term denotes severe, crushing oppression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 벽돌과 진흙과 온갖 들일로 그들의 삶을 쓰라리게 만들었습니다. 곧 그들이 그들에게 시켜 한 모든 노동을 가혹하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무자비하게’. 히브리어는 극심하고 짓누르는 압제를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ
  english_pob_choice: made their lives bitter
  chosen_korean: 그들의 삶을 쓰라리게 만들었습니다
  alternatives_korean:
  - 그들의 삶을 고통스럽게 만들었습니다
  - 그들의 삶을 괴롭게 만들었습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘쓰게 하다/쓰라리게 하다’라는 비유를 살려, 결과를 평탄하게 풀어쓴 표현보다 직접적으로 옮겼습니다.
- source_word: בַּעֲבֹדָה קָשָׁה
  english_pob_choice: with hard labor
  chosen_korean: 온갖 들일로
  alternatives_korean:
  - 힘든 노동으로
  - 가혹한 노동으로
  lexicon: HALOT
  rationale: עֲבֹדָה는 단순한 ‘일’보다 노동/부역의 뉘앙스가 있고, קָשָׁה는 그 강도를 더합니다. ‘온갖 들일’은 뒤의 ‘모든 노동’과 구분되면서도 강제 노역의 범위를 자연스럽게 드러냅니다.
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  english_pob_choice: in mortar and bricks
  chosen_korean: 벽돌과 진흙
  alternatives_korean:
  - 몰탈과 벽돌
  - 진흙과 벽돌
  lexicon: HALOT
  rationale: 히브리어 문맥상 건축 재료를 가리키며, POB가 ‘mortar and bricks’로 옮긴 점을 따라 한국어에서는 자연스러운 재료쌍인 ‘벽돌과 진흙’으로 옮겼습니다.
- source_word: בְּפָרֶךְ
  english_pob_choice: with harshness
  chosen_korean: 가혹하게
  alternatives_korean:
  - 무자비하게
  - 잔혹하게
  lexicon: HALOT
  rationale: פָרֶךְ는 단순한 엄격함이 아니라 짓눌러 부수는 듯한 가혹한 압제를 뜻하므로, 부사형으로 압박의 성격을 살렸습니다.
theological_decisions:
- issue: 마지막 절의 재진술 구조
  chosen_reading: “곧 그들이 그들에게 시켜 한 모든 노동을 가혹하게 했습니다”로 뒤의 절을 앞 절 전체를 풀어 설명하는 재진술로 처리했습니다.
  alternative_readings:
  - “그들이 그들에게 시킨 모든 노동은 가혹했습니다”
  - “그들이 그들에게 시킨 모든 노동을 가혹하게 했습니다”
  rationale: 히브리어는 마지막에 총괄적으로 재진술하며, 영어 POB도 대시로 이 연결을 보존합니다. 한국어에서도 결과 진술이 아니라 강제성의 총평으로 읽히게 해야 문장 구조가 살아납니다.
  doctrine_reference: 원문 통사 재현
