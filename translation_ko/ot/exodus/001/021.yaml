translation:
  language: ko
  text: 산파들이 하나님을 두려워하였으므로, 하나님께서는 그들에게 가정을 이루게 해 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그가 그들에게 집들을 지었다’입니다. 여기서 ‘집들’은 실제 건물보다 가정이나 가문을 세우는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  english_pob_choice: And because
  chosen_korean: 그리고 …였으므로
  alternatives_korean:
  - 그리고 …할 때
  - 그리고 …이 일어나서
  lexicon: WLC 문맥 / HALOT
  rationale: 히브리어 연결은 원인-결과를 이끄는 구문이므로, 한국어에서는 ‘…였으므로’로 결과를 자연스럽게 드러내고 서두의 서술 흐름은 ‘그리고’로 살렸습니다.
- source_word: יָרְאוּ הַמְיַלְּדֹת אֶת הָאֱלֹהִים
  english_pob_choice: the midwives feared God
  chosen_korean: 산파들이 하나님을 두려워하였으므로
  alternatives_korean:
  - 산파들이 하나님을 경외하였으므로
  - 산파들이 하나님을 무서워하였으므로
  lexicon: HALOT
  rationale: יָרֵא는 하나님을 향한 경외와 두려움을 함께 담지만, 본문이 강조하는 언약적 태도를 해치지 않으면서도 성경적 관용을 유지하기 위해 ‘두려워하다’를 택했습니다.
- source_word: בָּתִּים
  english_pob_choice: households
  chosen_korean: 가정을 이루어 주셨습니다
  alternatives_korean:
  - 집들을 주셨습니다
  - 가문을 세워 주셨습니다
  lexicon: HALOT
  rationale: 직역하면 ‘집들’이지만, 문맥상 단순한 건물보다 가정/가문의 형성을 뜻할 수 있으므로 한국어에서는 그 함의를 살려 ‘가정을 이루어 주셨습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘하나님을 두려워하다’의 뉘앙스
  chosen_reading: 경외를 포함한 두려움으로 번역하되, 본문 어조는 유지합니다.
  alternative_readings:
  - 하나님을 경외하였다
  - 하나님을 무서워하였다
  rationale: 히브리어 ירא는 경외와 두려움을 함께 지시하므로, 한국어의 단일 어휘로 의미를 완전히 고정하기보다 성경적 표현을 유지하는 것이 본문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 출 1:17, 1:21의 신실한 산파들에 대한 서술
