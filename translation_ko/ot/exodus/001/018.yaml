  text: וַ/יִּקְרָ֤א מֶֽלֶךְ מִצְרַ֨יִם֙ לַֽ/מְיַלְּדֹ֔ת וַ/יֹּ֣אמֶר לָ/הֶ֔ן מַדּ֥וּעַ עֲשִׂיתֶ֖ן הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
  footnotes:
  - marker: a
    text: Or “kept the boys alive.” The Hebrew verb can mean causing to live, preserving alive, or letting live in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이집트 왕이 산파들을 불러 그들에게 말했습니다. "어찌하여 이런 일을 하여 아이들을 살려 두었습니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남자아이들을 살려 두었다.” 히브리어 동사는 문맥에 따라 살게 하다, 살아 있게 보존하다, 또는 살려 두다의 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶֽלֶךְ מִצְרַ֨יִם
  english_pob_choice: the king of Egypt
  chosen_korean: 이집트 왕
  alternatives_korean:
  - 애굽 왕
  - 이집트의 왕
  lexicon: HALOT
  rationale: 히브리어의 소유 관계를 자연스러운 현대 한국어로 옮기기 위해 '이집트 왕'으로 간결하게 처리했습니다.
- source_word: לַֽ/מְיַלְּדֹ֔ת
  english_pob_choice: the midwives
  chosen_korean: 산파들
  alternatives_korean:
  - 아이받이들
  - 분만을 돕는 여자들
  lexicon: HALOT
  rationale: מְיַלְּדֹת는 출산을 돕는 산파를 가리키므로, 현대 표준어에서 바로 이해되는 '산파들'이 가장 정확합니다.
- source_word: מַדּ֥וּעַ
  english_pob_choice: Why
  chosen_korean: 어찌하여
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 직설적인 질책의 뉘앙스를 살리면서도 문어체 합쇼체에 맞게 '어찌하여'로 옮겼습니다.
- source_word: וַתְּחַיֶּיןָ אֶת הַיְלָדִים
  english_pob_choice: let the children live
  chosen_korean: 아이들을 살려 두었습니까
  alternatives_korean:
  - 아이들을 살게 하였습니까
  - 아이들을 살려 주었습니까
  lexicon: HALOT
  rationale: פעל의 사역적/허용적 의미를 반영해 '살려 두다'로 옮겨, 단순히 살다보다 '살아 있게 두었다'는 상황을 드러냈습니다.
theological_decisions:
- issue: וַתְּחַיֶּיןָ의 허용적 의미
  chosen_reading: 산파들이 아이들을 죽이지 않고 살아 있도록 두었다는 뜻으로 번역했습니다.
  alternative_readings:
  - 아이들을 적극적으로 살렸다
  - 아이들의 생명을 보존했다
  rationale: 문맥상 바로 앞 절의 살해 명령에 대한 불순종을 질책하는 장면이므로, '살려 두었다'가 허용과 결과를 함께 가장 잘 담습니다.
  doctrine_reference: 본문 문맥 해석
