  - 쉬프라 / 부아
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했습니다.
theological_decisions:
- issue: 본문에 없는 ‘파라오’ 호칭을 넣을지 여부
  chosen_reading: ‘이집트 왕’으로 옮기고, 정체를 설명하는 호칭은 추가하지 않았습니다.
  alternative_readings:
  - 파라오
  - 애굽 왕
  rationale: 히브리어 원문은 단순히 ‘이집트 왕’이라고 말하며, 영어 POB도 그 구문을 유지합니다. 본문에 없는 역사적 호칭을 보태지 않는 것이 소스 충실성에 맞습니다.
  doctrine_reference: source transparency / translation fidelity
