  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
  footnotes:
  - marker: a
    text: Or, 'to the midwives of the Hebrews.' The Hebrew phrase may mean either that the midwives were Hebrews or that they served the Hebrew women.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 이집트 왕이 히브리 산파들에게 말했는데, 그중 하나의 이름은 쉬프라였고 다른 하나의 이름은 푸아였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘히브리 사람들의 산파들에게’. 히브리어 구문은 그 산파들이 히브리 여자들이었음을 뜻할 수도 있고, 히브리 여자들을 돌보는 산파들이었음을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ מִצְרַיִם
  english_pob_choice: the king of Egypt
  chosen_korean: 이집트 왕
  alternatives_korean:
  - 이집트의 왕
  - 애굽 왕
  lexicon: HALOT
  rationale: 히브리어 관형 구문을 자연스러운 현대 한국어로 옮기되, 본문에 없는 ‘파라오’를 덧붙이지 않았습니다.
- source_word: לַמְיַלְּדֹת הָעִבְרִיֹּת
