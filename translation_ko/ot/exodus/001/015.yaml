  - 히브리 여자들을 돌보는 산파들에게
  lexicon: HALOT
  rationale: 영어 POB의 기본 선택처럼 산파들의 소속/성격을 드러내는 직접 번역을 따랐습니다. 각주가 지적하듯 ‘히브리 산파들’ 또는 ‘히브리 여자들을 돌보는 산파들’의 가능성을 한국어 본문만으로는 단정하지 않았습니다.
- source_word: שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית
  english_pob_choice: one of whom was named Shiphrah and the other Puah
  chosen_korean: 그중 하나의 이름은 쉬프라였고 다른 하나의 이름은 푸아였습니다
  alternatives_korean:
  - 하나는 쉬프라였고 다른 하나는 푸아였습니다
  - 한 사람의 이름은 쉬프라였고 둘째의 이름은 푸아였습니다
  lexicon: HALOT
  rationale: 두 산파를 구분하는 분배적 표현을 살리면서, 한국어로는 인물 식별이 자연스럽게 되도록 풀어 옮겼습니다.
- source_word: שִׁפְרָה / פּוּעָה
  english_pob_choice: Shiphrah / Puah
  chosen_korean: 쉬프라 / 푸아
  alternatives_korean:
