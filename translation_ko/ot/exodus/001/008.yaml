id: EXO.1.8
reference: Exodus 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֥קָם מֶֽלֶךְ חָדָ֖שׁ עַל מִצְרָ֑יִם אֲשֶׁ֥ר לֹֽא יָדַ֖ע אֶת יוֹסֵֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/008.yaml
  text: Now a new king arose over Egypt[b][a], who did not know Yosef.
  footnotes:
  - marker: a
    text: Or 'another king'; the Hebrew adjective is literally 'new,' but some understand it to imply a different dynasty or regime.
    reason: lexical_alternative
  - marker: b
    text: Or 'did not acknowledge Yosef'; 'know' may carry the sense of recognizing or taking account of him, not merely lacking information about him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이집트 위에 새 왕이 일어났는데, 그는 요셉을 알지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘새’는 히브리어 형용사의 직역입니다. 일부는 이를 ‘다른 왕’ 또는 새 왕조의 등장으로 이해합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘알지 못했다’는 단순한 정보 부재만이 아니라 요셉을 인정하거나 고려하지 않았다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: Now ... arose
  chosen_korean: 그러자 ... 일어났는데
  alternatives_korean:
  - 그때 ... 일어났습니다
  - 이제 ... 일어났는데
  - '... 등장했습니다'
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 살리면서 왕의 즉위·등장을 자연스럽게 드러내기 위해 ‘그러자’와 ‘일어났는데’를 썼습니다.
- source_word: מֶלֶךְ חָדָשׁ
  english_pob_choice: a new king
  chosen_korean: 새 왕
  alternatives_korean:
  - 새로운 왕
  - 다른 왕
  lexicon: HALOT
  rationale: חָדָשׁ의 기본값인 ‘새’에 맞추고, 본문이 직접 말하지 않는 ‘다른 왕/왕조’ 해석은 본문 밖으로 넘기지 않기 위해 간결하게 옮겼습니다.
- source_word: עַל מִצְרַיִם
  english_pob_choice: over Egypt
  chosen_korean: 이집트 위에
  alternatives_korean:
  - 이집트에
  - 이집트를 다스리며
  lexicon: HALOT
  rationale: עַל이 통치의 위계와 지배를 나타내므로, 단순한 위치인 ‘이집트에’보다 권위 관계가 드러나는 ‘위에’를 택했습니다.
- source_word: יוֹסֵף
  english_pob_choice: Yosef
  chosen_korean: 요셉
  alternatives_korean:
  - 요세프
  - 요셉
  lexicon: Project proper-name convention
  rationale: 성경에서 이미 굳어진 표기를 따르되, 본문의 인명은 한국어 독자에게 익숙한 전통형 ‘요셉’을 사용했습니다.
theological_decisions:
- issue: ‘알지 못했다’의 의미 범위
  chosen_reading: ‘그는 요셉을 알지 못했습니다’로 두어, 단순한 정보 부족인지 인정·배려의 부재인지 본문이 열어 둔 뉘앙스를 유지했습니다.
  alternative_readings:
  - 요셉을 인정하지 않았습니다
  - 요셉을 기억하지 않았습니다
  rationale: 히브리어 יָדַע는 여기서 관계적·정치적 무관심까지 함축할 수 있지만, 본문이 직접 말하는 것은 ‘알지 못함’이므로 그 이상을 본문에 넣지 않았습니다.
  doctrine_reference: Translation philosophy items 1 and 3
