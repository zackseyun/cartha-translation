source:
  edition: WLC
  text: וְ/רָא֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת פְּנֵ֣י מֹשֶׁ֔ה כִּ֣י קָרַ֔ן ע֖וֹר פְּנֵ֣י מֹשֶׁ֑ה וְ/הֵשִׁ֨יב מֹשֶׁ֤ה אֶת הַ/מַּסְוֶה֙ עַל פָּנָ֔י/ו עַד בֹּא֖/וֹ לְ/דַבֵּ֥ר אִתּֽ/וֹ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
  footnotes:
  - marker: a
    text: Hebrew 'the sons of Israel'; also commonly rendered 'the Israelites.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb means 'shone' or 'sent out rays'; the traditional rendering 'was horned' reflects an old misunderstanding of the term.
    reason: lexical_alternative
  - marker: c
    text: '''With him'' refers to the LORD from the immediate context.'
    reason: cross_reference
translation:
  language: ko
  text: 이스라엘 자손[a]은 모세의 얼굴을 보았고, 모세의 얼굴 피부가 빛났습니다[b]. 모세는 그와 말씀하려고 들어갈 때까지 자기 얼굴에 가리개를 다시 씌웠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어 표현에 가까운 번역이며, ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘빛나다’ 또는 ‘광선을 내뿜다’를 뜻합니다. 전통적인 ‘뿔이 나다’라는 번역은 이 단어에 대한 오래된 오해를 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그와’는 바로 앞 문맥에서 야훼를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 친족적 표현을 살리면서도 한국어에서 자연스럽게 읽히는 표준 표현을 택했습니다.
- source_word: פְּנֵי מֹשֶׁה
  english_pob_choice: Moses’ face
  chosen_korean: 모세의 얼굴
  alternatives_korean:
  - 모세의 낯
  - 모세의 얼굴의
  lexicon: HALOT
  rationale: 구문상 자연스러운 소유격으로 옮기되, 본문이 실제로 말하는 신체 부위를 분명히 했습니다.
- source_word: קָרַן / עוֹר פְּנֵי מֹשֶׁה
  english_pob_choice: the skin of Moses’ face shone
  chosen_korean: 모세의 얼굴 피부가 빛났습니다
  alternatives_korean:
  - 모세의 얼굴 피부에서 광선이 났습니다
  - 모세의 얼굴이 빛났습니다
  lexicon: HALOT
  rationale: קָרַן의 ‘빛나다/광선을 내뿜다’라는 뜻과 עוֹר의 ‘피부’라는 구체성을 함께 살리기 위해 ‘얼굴 피부가 빛났다’고 옮겼습니다.
- source_word: הַמַּסְוֶה
  english_pob_choice: the veil
  chosen_korean: 가리개
  alternatives_korean:
  - 베일
  - 면박
  lexicon: HALOT
  rationale: 모세가 얼굴을 덮는 용도이므로 ‘가리개’가 기능을 잘 드러냅니다. 전통적 ‘베일’보다 현대 한국어에서 덜 의례적이고 더 직관적입니다.
- source_word: לְדַבֵּר אִתּוֹ
  english_pob_choice: to speak with him
  chosen_korean: 그와 말할 때까지
  alternatives_korean:
  - 그와 말하려고
  - 주님과 말할 때까지
  lexicon: HALOT
  rationale: 히브리어 대명사 ‘그와’를 본문에 유지해 원문을 따라가되, 문맥상 대화의 종료 시점을 나타내는 ‘때까지’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 대명사 ‘그와’의 지시 대상
  chosen_reading: 본문은 대명사를 그대로 두어, 문맥상 그가 야훼임을 독자가 파악하게 합니다.
  alternative_readings:
  - 주님과 말할 때까지로 명시적으로 옮김
  rationale: 히브리어가 실제로는 대명사를 사용하므로, 본문을 넘어서 명시화하지 않고 문맥 의존성을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
