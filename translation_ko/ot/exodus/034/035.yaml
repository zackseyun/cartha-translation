revisions:
- from: 이스라엘 자손은 모세의 얼굴을 보았는데, 모세의 얼굴 피부가 빛났기 때문입니다. 모세는 들어가서 그와 말할 때까지 얼굴 위에 가리개를 다시 덮어 두었습니다.[a][b][c]
  to: 이스라엘 자손[a]은 모세의 얼굴을 보았고, 모세의 얼굴 피부가 빛났습니다[b]. 모세는 그와 말씀하려고 들어갈 때까지 자기 얼굴에 가리개를 다시 씌웠습니다[c].
  rationale: The revision restores the content-clause force of כִּי, preserves the temporal limit ‘until he went in to speak,’ and uses natural formal Korean. It retains the source pronoun rather than explicitly replacing it with the divine name, with its contextual referent explained in a footnote.
