revisions:
- from: 인애를 수천 대에까지 지키시며, 불법과 허물과 죄를 용서하시되, 결코 무죄로 여기지는 않으시며, 아버지들의 불법을 자녀와 자녀의 자녀에게, 곧 삼 대와 사 대까지 갚으십니다.[a]
  to: 수천을 향한 인애를 지키시며, 죄악과 반역과 죄를 용서하시되, 결코 무죄로 선언하지 않으시고, 아버지들의 죄악을 자녀들과 자녀의 자녀들에게, 곧 삼 대와 사 대에까지 물으십니다.[a]
  rationale: 본문에 명시되지 않은 ‘세대’를 ‘수천 대’로 넣은 부분을 제거하되, 수량의 대상이 문법적으로 열려 있는 원문의 표현은 ‘수천을 향한’으로 보존했습니다. 심판 문구는 ‘죄악을 …에게 묻습니다’로 고쳐 פֹּקֵד의 사법적 의미를 반영하면서도 ‘갚다’보다 좁은 보복 의미를 피했습니다. 각주는 ‘수천’의 가능한 세대적 이해와 삼·사 대와의 문맥상 대조를 설명합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:58Z'
review_pass:
  verdict: revise
  source_fidelity: ‘수천 대에까지’는 לָאֲלָפִים에 없는 ‘대/세대’를 본문에 삽입하므로 수정이 필요합니다. 또한 פֹּקֵד의 심판적·사법적 의미는 ‘죄악을 …에게 묻다’로 자연스럽고, 원문의 비교적 열린 의미를 유지할 수 있습니다.
  naturalness: ‘수천을 향한 인애를 지키시며’와 ‘죄악을 …에게 묻습니다’는 현대 표준 한국어의 격식 있는 성서 문체 안에서 자연스럽습니다. 기존 각주에 들어간 비한국어 표현 ‘פשוט히’도 바로잡았습니다.
  terminology: חֶסֶד는 ‘인애’, עָוֺן은 ‘죄악’, פֶשַׁע는 ‘반역’, חַטָּאָה는 ‘죄’로 옮겨 세 항목의 누적을 보존했습니다. אָבוֹת의 남성형은 ‘아버지들’로 유지했습니다. ‘결코 무죄로 선언하지 않으시고’는 נקה의 사법적 의미와 강조된 부정을 반영합니다.
  issues:
  - severity: medium
    issue: ‘수천 대에까지’가 본문에 없는 세대 개념을 명시합니다.
    rationale: 히브리어 לָאֲלָפִים은 문자적으로 ‘수천/수천에게’를 말하며, 이 절에는 ‘세대’에 해당하는 말이 없습니다. 세대라는 해석 가능성은 각주에서 제시하는 것이 적절합니다.
  - severity: medium
    issue: ‘갚으십니다’는 פֹּקֵד의 의미를 다소 좁힐 수 있습니다.
    rationale: 이 동사는 이 문맥에서 죄악에 대해 책임을 묻고 그 결과를 시행하는 뜻이지만, 단순히 보복을 ‘갚다’로 한정되지는 않습니다. ‘죄악을 …에게 묻습니다’가 사법적 의미를 보존하면서 더 열려 있습니다.
  - severity: low
    issue: 각주의 ‘פשוט히’는 한국어 문장 안에서 부자연스럽고 오기처럼 보입니다.
    rationale: ‘단지’로 고치면 현대 표준 한국어로 자연스럽고 원문의 설명도 정확해집니다.
