reference: Exodus 34:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
  footnotes:
  - marker: a
    text: Or 'for a thousand generations'; the Hebrew says simply 'for thousands,' likely contrasting God's enduring covenant love with judgment 'to the third and the fourth generation.'
    reason: alternative_reading
  - marker: b
    text: Or 'he will certainly not acquit' or 'he will certainly not leave unpunished.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'fathers'; this is retained because the source text is specifically masculine here, though the sense is generational descent.
    reason: cultural_note
translation:
  language: ko
  text: 인애를 수천 대에까지 지키시며, 불법과 허물과 죄를 용서하시되, 결코 무죄로 여기지는 않으시며, 아버지들의 불법을 자녀와 자녀의 자녀에게, 곧 삼 대와 사 대까지 갚으십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 פשוט히 ‘수천’이라고만 말하며, 문맥상 오래 지속되는 언약적 인애를 드러냅니다.
    reason: source_note
lexical_decisions:
- source_word: נֹצֵר חֶסֶד
  english_pob_choice: keeping steadfast love
  chosen_korean: 인애를 … 지키시며
  alternatives_korean:
  - 변함없는 사랑을 보존하시며
  - 언약적 사랑을 지키시며
  lexicon: HALOT
  rationale: חסד는 단순한 애정보다 언약적 성격을 지닌 인애이므로, 현대 한국어에서는 ‘인애’를 살리고 ‘지키시며’로 지속적 보존의 뉘앙스를 반영했습니다.
- source_word: לָאֲלָפִים
  english_pob_choice: for thousands
  chosen_korean: 수천 대에까지
  alternatives_korean:
  - 수천에
  - 천 대에까지
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘수천’이라고만 말하므로, 본문에 없는 ‘세대’를 본문에 직접 넣지 않되 한국어 독자가 뜻을 이해하도록 ‘대’로 세대적 범위를 암시했습니다.
- source_word: נֹשֵׂא עָוֺן וָפֶשַׁע וְחַטָּאָה
  english_pob_choice: forgiving iniquity and transgression and sin
  chosen_korean: 불법과 허물과 죄를 용서하시되
  alternatives_korean:
  - 죄악과 반역과 죄를 용서하시되
  - 죄와 반역과 허물을 용서하시되
  lexicon: HALOT
  rationale: 세 항목의 누적을 유지하면서, עָוֺן/פֶשַׁע/חַטָּאָה를 각각 ‘불법/허물/죄’로 옮겨 도덕적·법적 무게와 점층을 살렸습니다.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  english_pob_choice: but he will by no means clear the guilty / leave unpunished
  chosen_korean: 결코 무죄로 여기지는 않으시며
  alternatives_korean:
  - 결코 무죄로 하지 않으시며
  - 결코 죄 없다고 선언하지 않으시며
  lexicon: HALOT
  rationale: נקה의 사법적 의미를 따라 ‘무죄로 여기다’로 옮겼고, 이중 부정의 강조를 ‘결코’로 표현해 하나님의 용서와 심판의 긴장을 유지했습니다.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים וְעַל בְּנֵי בָנִים
  english_pob_choice: visiting the iniquity of fathers on children and on children's children
  chosen_korean: 아버지들의 불법을 자녀와 자녀의 자녀에게 … 갚으십니다
  alternatives_korean:
  - 아버지들의 불법을 자녀와 자녀의 자녀에게 임하게 하십니다
  - 아버지들의 불법을 자녀와 손자들에게 돌리십니다
  lexicon: HALOT
  rationale: פקד는 이 문맥에서 단순한 ‘방문’이 아니라 결과를 집행하는 뜻이므로, 한국어에서는 심판의 परिणाम을 드러내는 ‘갚으시다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 용서와 심판을 함께 보존하는 방식
  chosen_reading: ‘용서하시되’와 ‘결코 무죄로 여기지는 않으시며’를 병치해, 자비와 न्याय의 긴장을 약화하지 않고 유지했습니다.
  alternative_readings:
  - ‘용서하시며 … 그러나 벌하지는 않으시며’
  - ‘용서하시되 … 반드시 죄 있는 자를 벌하십니다’
  rationale: 본문은 용서의 선언과 심판의 선언을 함께 제시합니다. 한쪽을 다른 쪽으로 흡수하지 않고 둘 다 선명하게 남겨야 원문의 신학적 긴장이 보존됩니다.
  doctrine_reference: Translation philosophy §3
- issue: לָאֲלָפִים의 범위를 한국어에서 어떻게 제시할지
  chosen_reading: 본문에는 ‘수천 대에까지’로 두고, 본문 밖에서 굳이 ‘세대’를 명시하지 않았습니다.
  alternative_readings:
  - ‘천 대에까지’
  - ‘수천 세대에까지’
  rationale: 히브리어는 여기서 ‘세대’라는 말을 직접 쓰지 않으므로, 본문에 없는 요소를 과도하게 삽입하지 않으면서도 한국어 독자에게 자연스러운 범위를 제시했습니다.
  doctrine_reference: Translation philosophy §1
