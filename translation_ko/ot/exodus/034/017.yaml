  rationale: 히브리어는 ‘신들’(אֱלֹהֵי)과 ‘주조된/부어 만든 것’(מַסֵּכָה)을 결합해 우상 금지를 말하므로, 한국어에서는 현대 독자가 이해하기 쉬운 ‘주조한 신상들’로 옮겨 재료와 제작 방식을 함께 드러냈습니다.
