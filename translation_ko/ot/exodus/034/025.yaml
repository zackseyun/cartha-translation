id: EXO.34.25
reference: Exodus 34:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא תִשְׁחַ֥ט עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹא יָלִ֣ין לַ/בֹּ֔קֶר זֶ֖בַח חַ֥ג הַ/פָּֽסַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
  footnotes:
  - marker: a
    text: Or 'the Passover sacrifice' or 'the sacrifice of the Passover festival.' The Hebrew expression is compact and may be rendered more concisely in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 누룩과 함께 내 제물의 피를 바쳐서는 안 됩니다. 유월절 절기의 제물도 아침까지 남겨 두어서는 안 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשְׁחַט
  english_pob_choice: shall not slaughter
  chosen_korean: 잡아서는 안 되며
  alternatives_korean:
  - 도살해서는 안 되며
  - 잡아서 제물로 삼아서는 안 되며
  - 죽여서는 안 되며
  lexicon: HALOT
  rationale: השׁחט은 제의적 도살을 가리키므로, 한국어에서는 제물 문맥을 살리면서도 과도하게 좁히지 않는 ‘잡다’ 계열보다 ‘도살하다’가 더 정확하지만, 여기서는 제사 행위 전체보다 금지의 행위를 자연스럽게 드러내기 위해 ‘잡아서는 안 되며’로 옮겼습니다.
- source_word: עַל חָמֵץ
  english_pob_choice: with leaven
  chosen_korean: 누룩과 함께
  alternatives_korean:
  - 누룩 위에
  - 누룩이 있는 동안
  - 누룩 곁에
  lexicon: HALOT
  rationale: עַל은 이 구절에서 제의적 금지 표현으로 쓰여 함께/동반하여의 뜻을 띠므로, 한국어에서는 관용적이고 직접적인 ‘누룩과 함께’가 원문 관계를 가장 자연스럽게 드러냅니다.
- source_word: דַּם זִבְחִי
  english_pob_choice: the blood of my sacrifice
  chosen_korean: 내 제물의 피
  alternatives_korean:
  - 내 희생의 피
  - 내 제사의 피
  - 내 제물의 피를
  lexicon: HALOT
  rationale: 히브리어의 소유격 결합을 그대로 살려 ‘내 제물의 피’로 옮겨, 피와 제물의 결합을 분명히 유지했습니다.
- source_word: יָלִין
  english_pob_choice: shall not remain overnight
  chosen_korean: 아침까지 남겨 두어서는 안 됩니다
  alternatives_korean:
  - 밤새 두어서는 안 됩니다
  - 아침까지 머물게 해서는 안 됩니다
  - 아침까지 남겨서는 안 됩니다
  lexicon: HALOT
  rationale: לין은 밤을 지새우다/머무르다의 뜻이므로, 제의 규정의 시간 제한을 한국어 관용 표현으로 분명히 드러내는 ‘아침까지 남겨 두다’를 택했습니다.
- source_word: זֶבַח חַג הַפָּסַח
  english_pob_choice: the sacrifice of the feast of the Passover
  chosen_korean: 유월절의 제사
  alternatives_korean:
  - 유월절 절기의 제사
  - 유월절 축제의 제물
  - 유월절 제사
  lexicon: HALOT
  rationale: 세 단어 결합을 한국어에서 과도하게 늘이지 않으면서도, חג와 פָּסַח의 결합이 가리키는 절기-제사 관계를 ‘유월절의 제사’로 간결하게 반영했습니다.
theological_decisions:
- issue: 제의 규정의 직접성 유지
  chosen_reading: 문맥을 도덕적 일반론으로 바꾸지 않고 제사 규정으로 읽음
  alternative_readings:
  - 상징적으로 해석하여 일반적 순결 규범으로 확장
  - 예배 원리로만 완화하여 번역
  rationale: 본문은 시내산 언약 맥락의 구체적 제의 규정이므로, 상징화나 일반화보다 원문의 제의적 금지를 직접적으로 드러내는 번역이 적절합니다.
  doctrine_reference: 출애굽기 34장의 언약 갱신과 제사 규례 맥락
- issue: ‘아침까지’의 시간 제한 보존
  chosen_reading: 제물 일부를 다음 날 아침까지 두지 말라는 금지로 번역
  alternative_readings:
  - 밤새 두지 말라는 뜻으로만 완화
  - 단순히 즉시 처리하라는 윤리적 권고로 해석
  rationale: 히브리어의 יָלִין과 ‘아침’의 결합은 처리 시한을 명시하므로, 시간 경계를 흐리지 않도록 한국어에서도 분명히 보존했습니다.
  doctrine_reference: 제의 정결과 기한 준수에 대한 모세 율법
