review_pass:
  verdict: revise
  source_fidelity: 첫 절의 히브리어는 문자적으로 ‘내 제물의 피를 … 잡다’라는 다소 압축된 제의 표현입니다. 그러나 한국어에서 ‘피를 잡다’는 성립하지 않아, 피를 제의적으로 바치는 행위로 풀어 옮기는 것이 의미를 훼손하지 않으면서 원문의 제의적 금지를 보존합니다. 후반절의 ‘아침까지’는 정확히 보존되어야 합니다.
  naturalness: 초안의 ‘내 제물의 피를 잡아서는 안 되며’는 목적어와 동사의 결합이 부자연스럽고 뜻이 불명확합니다. 또한 한 문장 안에서 ‘안 되며’와 ‘안 됩니다’가 섞여 합쇼체 종결의 일관성이 약합니다. ‘제사’를 아침까지 남겨 둔다는 표현보다 ‘제물’을 남겨 둔다는 표현이 자연스럽습니다.
  terminology: ‘누룩’, ‘유월절’, ‘제물’, ‘피’는 적절한 제의 용어입니다. זֶבַח חַג הַפָּסַח의 절기 요소를 드러내기 위해 ‘유월절 절기의 제물’로 옮깁니다. 이는 후대의 교리적 해석을 추가하지 않습니다.
  issues:
  - severity: high
    issue: ‘내 제물의 피를 잡다’라는 표현
    rationale: שָׁחַט은 제의적 도살을 가리키지만, 한국어에서 피는 ‘잡는’ 대상이 될 수 없습니다. 직역을 유지하려다 한국어 의미가 무너집니다.
  - severity: medium
    issue: 문장 종결 높임말의 혼용
    rationale: ‘안 되며’와 ‘안 됩니다’가 결합되어 있으므로, 표준 현대 합쇼체에 맞추어 두 절 모두 ‘안 됩니다’로 통일하는 편이 좋습니다.
  - severity: low
    issue: ‘유월절의 제사’를 남겨 둔다는 표현
    rationale: 남겨 두는 대상은 제의 행위인 ‘제사’보다 희생 제물로 표현하는 것이 한국어에서 명확하며, זֶבַח의 물질적 희생제 의미에도 부합합니다.
  revised_text: 너는 누룩과 함께 내 제물의 피를 바쳐서는 안 됩니다. 유월절 절기의 제물도 아침까지 남겨 두어서는 안 됩니다.
