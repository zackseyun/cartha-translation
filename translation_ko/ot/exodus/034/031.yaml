  text: וַ/יִּקְרָ֤א אֲלֵ/הֶם֙ מֹשֶׁ֔ה וַ/יָּשֻׁ֧בוּ אֵלָ֛י/ו אַהֲרֹ֥ן וְ/כָל הַ/נְּשִׂאִ֖ים בָּ/עֵדָ֑ה וַ/יְדַבֵּ֥ר מֹשֶׁ֖ה אֲלֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/031.yaml
  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
  footnotes:
  - marker: a
    text: Or 'the chiefs of the congregation' or 'the leaders of the community.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 모세가 그들에게 부르자, 아론과 회중의 모든 지도자가 그에게 돌아왔고, 모세는 그들에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회중의 우두머리들’ 혹은 ‘공동체의 지도자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  english_pob_choice: called to them
  chosen_korean: 그들에게 부르자
  alternatives_korean:
  - 그들에게 불렀습니다
  - 그들에게 불러 모으자
  lexicon: HALOT
  rationale: קרא는 이 문맥에서 단순히 소리를 지르는 것이 아니라 가까이 오도록 부르는 행위이므로, ‘부르자’로 자연스럽고 직접적으로 옮겼습니다.
- source_word: וַיָּשֻׁבוּ אֵלָיו
  english_pob_choice: returned to him
  chosen_korean: 그에게 돌아왔고
  alternatives_korean:
  - 그에게 돌아갔고
  - 그에게 다시 왔고
  lexicon: HALOT
  rationale: שוב의 기본 의미인 ‘돌아오다’를 살리되, 한국어 서술 흐름에 맞게 과거 연결형으로 처리했습니다.
- source_word: הַנְּשִׂאִים בָּעֵדָה
  english_pob_choice: the leaders of the congregation
  chosen_korean: 회중의 모든 지도자
  alternatives_korean:
  - 회중의 지도자들
  - 공동체의 모든 지도자
  lexicon: HALOT
  rationale: נשיאים은 여기서 백성 가운데 대표적 지도자들을 가리키므로 ‘지도자’가 적절하고, עֵדָה는 출애굽기 맥락상 집합된 백성을 가리켜 ‘회중’으로 옮겼습니다.
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하셨습니다
  - 이야기했습니다
  lexicon: HALOT
  rationale: דבר의 표준적 의미를 따라 가장 무난한 현대 한국어 ‘말했습니다’를 사용했습니다.
theological_decisions:
- issue: 장면의 대비를 살리는 접속
  chosen_reading: ‘그러나’로 시작해, 앞절의 두려움으로 물러섰던 지도자들이 모세의 부름에 다시 나아오는 흐름을 드러냈습니다.
  alternative_readings:
  - 그냥 ‘그리고’로 이어서 번역
  - ‘그때’로 중립적으로 처리
  rationale: 히브리어 waw는 단순 연결이지만, 문맥상 이전 절과의 긴장 관계가 분명하므로 한국어에서 약한 대조를 살리는 것이 독자가 장면을 더 정확히 이해하는 데 도움이 됩니다.
  doctrine_reference: 서사 문맥의 의미 보존
