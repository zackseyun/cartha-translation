  source_fidelity: 반복 상황을 나타내는 도입부와 명령을 받은 내용을 이스라엘 자손에게 전달하는 구조는 대체로 충실합니다. 그러나 ‘휘장’은 보통 성소의 막·커튼을 뜻하므로 모세가 얼굴에서 제거한 מַסְוֶה를 가리키기에 부정확합니다. 또한 ‘밖으로 나올 때까지 그렇게 하였습니다’의 ‘그렇게’는 무엇을 했는지 불분명하고 반복적 행위를 충분히 드러내지 못합니다.
  naturalness: ‘베일을 벗고, 나올 때까지 벗은 채 있었습니다’는 현대 표준어 합쇼체에서 자연스럽고, 제거 상태가 나올 때까지 지속되었다는 원문의 시간을 명료하게 표현합니다. ‘그와 말하려고’도 목적을 나타내는 자연스러운 표현입니다.
  terminology: יְהוָה는 프로젝트 용례에 따라 ‘야훼’로 유지합니다. בְּנֵי יִשְׂרָאֵל은 직역에 가까운 관용적 표현인 ‘이스라엘 자손’으로 유지합니다. מַסְוֶה는 ‘휘장’ 대신 얼굴 덮개를 뜻하는 ‘베일’로 옮깁니다.
