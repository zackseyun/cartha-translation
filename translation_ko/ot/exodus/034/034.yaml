revisions:
- from: 모세가 야훼 앞에 들어가 그와 말하려 할 때마다 그는 휘장을 걷어 내고, 밖으로 나올 때까지 그렇게 하였습니다. 그리고 나와서는 이스라엘 자손에게 명령받은 것을 말하였습니다.[a]
  to: 모세는 야훼 앞에 들어가 그와 말하려고 할 때마다 베일을 벗고, 나올 때까지 벗은 채 있었습니다. 그는 나와서 이스라엘 자손에게 자신이 명령받은 것을 말하였습니다.[a]
  rationale: 얼굴 덮개를 뜻하는 핵심 명사를 바로잡고, 베일을 벗은 상태가 모세가 나올 때까지 지속되었다는 원문의 의미와 반복적 과거 상황을 명확히 했습니다. 신명과 ‘이스라엘 자손’의 번역 방침은 유지했습니다.
  reviewer_model: gpt-5.6-terra
