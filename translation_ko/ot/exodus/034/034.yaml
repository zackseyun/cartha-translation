  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
  footnotes:
  - marker: a
    text: Or 'to the Israelites' / 'to the people of Israel.' The Hebrew reads 'to the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 야훼 앞에 들어가 그와 말하려고 할 때마다 베일을 벗고, 나올 때까지 벗은 채 있었습니다. 그는 나와서 이스라엘 자손에게 자신이 명령받은 것을 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어 표현을 가깝게 옮긴 것입니다. ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹא מֹשֶׁה
  english_pob_choice: whenever Moses went in
  chosen_korean: 모세가 ... 들어가
  alternatives_korean:
  - 모세가 ... 들어갈 때마다
  - 모세가 ... 들어갈 때
  lexicon: HALOT
  rationale: 반복적 상황을 드러내기 위해 현재적 반복 표현인 ‘들어갈 때마다’를 고려할 수 있으나, 본문 흐름상 ‘...할 때마다’는 다음 동작들과 자연스럽게 연결됩니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼 앞에서
  - 주님 앞에
  lexicon: HALOT
  rationale: 본문의 신명칭 יְהוָה를 프로젝트 기본값대로 ‘야훼’로 옮겼고, לִפְנֵי는 위치·현존을 드러내는 ‘앞에’로 처리했습니다.
- source_word: לְדַבֵּר אִתּוֹ
  english_pob_choice: to speak with him
  chosen_korean: 그와 말하려
  alternatives_korean:
  - 그와 말하기 위해
  - 그와 대화하려
  lexicon: HALOT
  rationale: אִתּוֹ는 단순 대상보다 상호적 대면 대화를 가리키므로 ‘그와 말하다’가 자연스럽고, 목적용법은 ‘-하려’로 살렸습니다.
- source_word: הַמַּסְוֶה
  english_pob_choice: the veil
  chosen_korean: 휘장
  alternatives_korean:
  - 면사포
  - 가리개
  - 베일
  lexicon: HALOT
  rationale: 이 단어는 모세가 얼굴에 쓰는 덮개이므로 교회 전통의 ‘베일’보다 본문 이미지에 더 직접적인 ‘휘장’이 적절합니다.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  english_pob_choice: what he had been commanded
  chosen_korean: 명령받은 것
  alternatives_korean:
  - 명령받은 바
  - 명령된 것
  - 그가 명령받은 것
  lexicon: HALOT
  rationale: 피동형 명령 수령의 의미를 간결하게 살리되, 모세가 전달하는 내용이 ‘명령받은 것’임을 드러냈습니다.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 관용구를 직역에 가깝게 살리면서도 한국어 성경에서 익숙한 종족명 표현을 유지했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본 용례에 따라 신명칭을 번역어로 순치하지 않고 고유명사로 보존했습니다.
  doctrine_reference: POB glossary — יהוה / YHWH → 야훼
- issue: 모세와 야훼의 직접 대면 장면의 문체
  chosen_reading: 서술문은 합쇼체로 유지하고, 직접 인용은 없으므로 별도 어조 전환을 두지 않음
  alternative_readings:
  - 더 성경적인 고어체
  - 대화체 완화
  rationale: 본문은 서술이 중심이므로 현대 표준어의 서술 합쇼체가 원문 정보 전달에 가장 충실합니다.
  doctrine_reference: Korean target style
