  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
  footnotes:
  - marker: a
    text: Or 'you shall rest.' The Hebrew verb means to cease or stop, and by extension to rest.
    reason: lexical_alternative
translation:
  language: ko
  text: 엿새 동안 일해야 합니다. 그러나 일곱째 날에는 일을 멈추어야 합니다[a]. 밭갈이할 때에도 추수할 때에도 일을 멈추어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쉬어야 합니다.’ 히브리어 동사는 ‘그치다’, ‘멈추다’를 뜻하며, 확장되어 ‘쉬다’의 뜻으로도 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  english_pob_choice: Six days
  chosen_korean: 엿새 동안은
  alternatives_korean:
  - 엿새 동안
  - 엿새
  lexicon: HALOT
  rationale: 히브리어는 시간의 길이를 압축적으로 말하므로, 한국어에서는 「엿새 동안은」으로 자연스럽게 기간을 드러내되 앞 절의 명령과 이어지게 했습니다.
- source_word: תַּעֲבֹד
  english_pob_choice: you shall work
  chosen_korean: 일해야 합니다
  alternatives_korean:
  - 일할 것입니다
  - 일하십시오
  lexicon: HALOT
  rationale: 이 동사는 כאן 단순 허용이 아니라 규범적 지시이므로, 현대 합쇼체의 의무 표현인 「일해야 합니다」로 옮겼습니다.
- source_word: תִּשְׁבֹּת
  english_pob_choice: you shall cease
  chosen_korean: 쉬어야 합니다
  alternatives_korean:
  - 멈춰야 합니다
  - 중단해야 합니다
  lexicon: HALOT
  rationale: 핵심 의미는 ‘그치다/중단하다’이지만, 안식일 문맥에서는 노동을 멈춘 상태를 한국어로 가장 자연스럽게 전달하는 표준 표현이 「쉬어야 합니다」이므로 이를 택했습니다.
- source_word: בֶּחָרִישׁ וּבַקָּצִיר
  english_pob_choice: in plowing time and in harvest
  chosen_korean: 밭갈이할 때나 추수할 때에도
  alternatives_korean:
  - 밭갈이 때와 추수 때에도
  - 갈이철과 추수철에도
  lexicon: HALOT
  rationale: 농사 절기의 대조를 살리기 위해 「밭갈이할 때나 추수할 때에도」로 옮겨, 가장 바쁜 농번기에도 안식이 적용된다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: שׁבת의 번역을 ‘cease’ 계열로 유지할지 ‘rest’로 풀지
  chosen_reading: 본문은 안식일의 ‘중단/쉼’을 함께 담되, 한국어에서는 「쉬어야 합니다」로 독자에게 즉시 이해되게 했습니다.
  alternative_readings:
  - 그쳐야 합니다
  - 멈춰야 합니다
  rationale: 히브리어의 어휘 핵심은 ‘일을 멈춤’이지만, 한국어 성경 문체에서는 안식일 명령을 ‘쉬다’로 전달할 때 본문의 규범성과 자연스러움이 함께 살아납니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
