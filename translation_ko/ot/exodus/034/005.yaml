  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
  footnotes:
  - marker: a
    text: Or 'and called on the name of the LORD,' or 'and proclaimed in the name of the LORD.' The Hebrew phrase literally includes the preposition 'in/by' with 'name.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 구름 가운데로 내려오셔서 거기서 그와 함께 서시고, 야훼의 이름을 선포하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 이름으로 선포하셨습니다’, ‘야훼의 이름 안에서 선포하셨습니다’. 히브리어 구문은 문자적으로 ‘이름’과 함께 전치사 ‘~안에/~으로’를 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 여호와 이름(테트라그람마톤)을 제목어로 바꾸지 않고 고유명으로 살리기 위해, POB의 영어 선택에 맞춰 ‘야훼’로 옮겼습니다.
- source_word: בֶּעָנָן
  english_pob_choice: in the cloud
  chosen_korean: 구름 가운데로
  alternatives_korean:
  - 구름 안에
  - 구름 속에
  lexicon: HALOT
  rationale: 장소를 나타내는 전치사적 의미를 살리면서도 한국어에서 자연스럽게 하나님의 현현 장면을 드러내기 위해 ‘구름 가운데로’로 옮겼습니다.
- source_word: וַיִּקְרָא
  english_pob_choice: proclaimed
  chosen_korean: 선포하셨습니다
  alternatives_korean:
  - 외치셨습니다
  - 선언하셨습니다
  - 부르셨습니다
  lexicon: HALOT
  rationale: 뒤따르는 6절의 내용이 하나님의 자기선언이므로, 단순한 ‘부르다’보다 공개적·공식적 발화를 드러내는 ‘선포하다’가 원문의 문맥에 더 잘 맞습니다.
- source_word: בְשֵׁם יְהוָה
  english_pob_choice: the name of Yahweh
  chosen_korean: 야훼의 이름을
  alternatives_korean:
  - 야훼의 이름으로
  - 야훼의 이름 안에서
  lexicon: HALOT
  rationale: 히브리어는 ‘이름’과 함께 전치사 בְ를 포함하여 ‘이름으로/이름 안에서’로도 읽힐 수 있으나, 본문 흐름상 한국어에서는 ‘야훼의 이름을 선포하다’가 가장 자연스럽고 의미를 잘 전달합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: ‘야훼’로 고유명을 유지합니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 하나님의 언약적 고유명을 직접 사용하므로, 관례적 대체어보다 본래 이름을 보존하는 번역이 원문의 신학적 무게를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
