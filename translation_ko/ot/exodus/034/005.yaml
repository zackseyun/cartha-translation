  - 주
  rationale: 본문은 하나님의 언약적 고유명을 직접 사용하므로, 관례적 대체어보다 본래 이름을 보존하는 번역이 원문의 신학적 무게를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
