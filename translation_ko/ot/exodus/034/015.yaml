id: EXO.34.15
reference: Exodus 34:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
  footnotes:
  - marker: a
    text: Or, 'they play the prostitute after their gods.' The Hebrew uses sexual-infidelity imagery for idolatry.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and he calls/invites you'; the singular likely has a distributive sense, 'one of them invites you.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'you eat of his sacrifice,' that is, food associated with his sacrificial offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그 땅의 주민들과 언약을 맺지 마십시오. 그들이 자기들의 신들을 따라 음행하고 자기들의 신들에게 제사하며, 그들 중 한 사람이 너를 초대하면 너는 그의 제물을 먹게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음행하다’는 כאן의 히브리어가 우상숭배를 성적 불성실의 이미지로 비유한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수형으로 ‘부르다/초대하다’라고 되어 있어, 문맥상 ‘그들 중 한 사람이 너를 초대하면’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘제물을 먹다’는 제사와 연결된 음식을 함께 먹는 행위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תִּכְרֹת בְּרִית
  english_pob_choice: lest you make a covenant
  chosen_korean: 너희는 … 언약을 맺지 마십시오
  alternatives_korean:
  - …와 언약을 맺지 않도록 하십시오
  - …와 계약을 맺지 마십시오
  lexicon: WLC/표준 한국어 성경 용례
  rationale: פֶּן의 경고성을 한국어 명령 금지형으로 옮겨, 단순 사실 진술이 아니라 금지된 결과를 막는 경고임을 살렸습니다.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  english_pob_choice: with the inhabitants of the land
  chosen_korean: 그 땅의 주민들과
  alternatives_korean:
  - 그 땅에 사는 사람들과
  - 그 땅의 거주자들과
  lexicon: HALOT
  rationale: 집단적 대상을 자연스러운 현대 한국어로 옮기면서도, '땅'의 지정성을 유지했습니다.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  english_pob_choice: and they prostitute themselves after their gods
  chosen_korean: 그들이 자기들의 신들을 따라 음행하고
  alternatives_korean:
  - 그들이 자기들의 신들을 따라 음행을 저지르고
  - 그들이 자기들의 신들을 좇아 음행하고
  lexicon: HALOT
  rationale: זנה의 강한 성적·언약적 배신 이미지를 한국어 '음행하다'로 유지하되, 직설성을 너무 완화하지 않도록 했습니다.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  english_pob_choice: and sacrifice to their gods
  chosen_korean: 자기들의 신들에게 제사하며
  alternatives_korean:
  - 자기들의 신들에게 희생제물을 드리며
  - 자기들의 신들에게 희생하며
  lexicon: HALOT
  rationale: 제의적 행위를 분명히 드러내는 표준어 '제사하다'를 택해, 우상 숭배의 종교적 행위를 자연스럽게 표현했습니다.
- source_word: וְקָרָא לְךָ
  english_pob_choice: and one of them invites you
  chosen_korean: 그들 중 한 사람이 너를 초대하면
  alternatives_korean:
  - 그들 중 한 사람이 너를 부르면
  - 그들 중 한 사람이 너를 부르짖으면
  lexicon: HALOT
  rationale: 히브리어 단수형의 분배적 의미를 살려 '그들 중 한 사람'으로 풀었고, 초대의 상황을 한국어로 명확히 했습니다.
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  english_pob_choice: and you eat from his sacrifice
  chosen_korean: 너는 그의 제물을 먹게 될 것입니다
  alternatives_korean:
  - 너는 그의 제물에서 먹게 될 것입니다
  - 너는 그의 희생제물에 참여하게 될 것입니다
  lexicon: HALOT
  rationale: מִזִּבְחוֹ의 음식 참여 가능성을 '제물을 먹다'로 간결하게 옮겨, 우상 제사에 연루되는 행위를 직접적으로 드러냈습니다.
theological_decisions:
- issue: זנה의 은유를 얼마나 직접적으로 옮길 것인가
  chosen_reading: '''음행하다''를 사용해 우상숭배를 언약적 불성실의 이미지로 유지했습니다.'
  alternative_readings:
  - 우상을 따르다
  - 간음하다
  rationale: 본문은 단순한 종교적 이탈보다 더 강한 성적-언약적 배신 이미지를 사용하므로, 그 신학적 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: 히브리어 단수 동사의 분배적 의미
  chosen_reading: '''그들 중 한 사람''으로 분배적 의미를 명시했습니다.'
  alternative_readings:
  - 그가 너를 초대하면
  - 그들이 너를 초대하면
  rationale: 문맥상 각 주민이 개별적으로 초대할 수 있음을 드러내어, 경고의 논리를 더 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §5, §6
