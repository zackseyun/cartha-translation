  source_fidelity: 본문의 פֶּן은 단순한 독립 금령보다 ‘그러한 일이 일어나지 않도록/그렇지 않으면’이라는 경고의 결과 관계를 나타냅니다. 초안은 이를 금령으로 처리하여 대체로 의미를 전달하지만, 뒤의 연쇄적 결과와의 연결을 명시하는 편이 원문에 더 충실합니다. 또한 히브리어의 2인칭 남성 단수는 문맥상 집단에게 적용되는 대표적 단수이므로, 현대 한국어에서는 일관된 복수 호칭으로 자연스럽게 옮길 수 있습니다.
  naturalness: 초안은 ‘너희는’과 ‘너를/너는’이 한 문장 안에서 섞여 수 일치와 현대 합쇼체의 호칭 운용 면에서 어색합니다. ‘여러분’으로 통일하고, ‘그렇지 않으면’을 넣어 경고의 논리적 흐름을 자연스럽게 했습니다.
  terminology: ‘언약’, ‘음행하다’, ‘제사를 드리다’, ‘제물’은 각각 בְּרִית, זנה, זבח, זִבְחוֹ의 제의적·은유적 의미를 적절히 보존합니다. ‘음행하다’는 우상숭배에 사용된 성적 불성실의 은유를 완화하지 않습니다.
  issues:
