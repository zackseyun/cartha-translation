  to: 그 땅 주민들과 언약을 맺지 않도록 하십시오. 그렇지 않으면 그들이 자기들의 신들을 따라 음행하고[a] 자기들의 신들에게 제사를 드리며, 그들 가운데 한 사람이 여러분을 초대하여[b] 여러분이 그의 제물을 먹게 될 것입니다.[c]
  rationale: 원문의 경고 구조를 ‘그렇지 않으면’으로 드러내되, 원문에 없는 신학적 해석은 덧붙이지 않았습니다. זנה의 강한 은유와 단수 동사의 분배적 의미, 그리고 제물 섭취의 제의적 연관성을 보존했습니다. 각주 표지를 해당 표현 뒤로 옮기고 각주 a의 비한국어 잔재를 수정했습니다.
