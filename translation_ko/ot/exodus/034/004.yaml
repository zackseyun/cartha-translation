  text: 그는 처음 것들과 같은 두 돌판을 깎아 만들고[a], 모세는 아침 일찍 일어나 야훼께서 그에게 명령하신 대로 시내 산에 올라갔습니다. 그는 두 돌판을 손에 들었습니다[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 돌판을 깎았다’ 또는 ‘두 돌판을 다듬어 만들었다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 손에’라고 단수형을 사용합니다. 여기서는 한국어 관용에 따라 ‘손에’로 옮겼습니다.
    reason: lexical_alternative
