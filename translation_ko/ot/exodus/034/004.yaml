id: EXO.34.4
reference: Exodus 34:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּפְסֹ֡ל שְׁנֵֽי לֻחֹ֨ת אֲבָנִ֜ים כָּ/רִאשֹׁנִ֗ים וַ/יַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַ/בֹּ֨קֶר֙ וַ/יַּ֨עַל֙ אֶל הַ֣ר סִינַ֔י כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
  footnotes:
  - marker: a
    text: Or 'carved' or 'hewed' two stone tablets like the first ones.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in his hand'; the singular may function idiomatically.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 첫 번째 것들과 같은 두 돌판을 다듬었고, 모세는 아침 일찍 일어나 시내 산으로 올라갔습니다. 야훼께서 그에게 명령하신 그대로였습니다. 그는 두 돌판을 손에 들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְסֹל
  english_pob_choice: cut
  chosen_korean: 다듬었고
  alternatives_korean:
  - 깎았고
  - 새겼고
  - 다듬어 만들었고
  lexicon: HALOT
  rationale: 돌판을 손질해 형태를 만드는 동사로 이해되므로, 현대 한국어에서는 '다듬다'가 과도하게 문어적이거나 기계적이지 않으면서 원문의 제작 행위를 자연스럽게 살립니다.
- source_word: לֻחֹת אֲבָנִים
  english_pob_choice: stone tablets
  chosen_korean: 돌판
  alternatives_korean:
  - 돌로 된 판
  - 석판
  - 돌판들
  lexicon: HALOT
  rationale: 언약 판의 재질과 형태를 함께 드러내는 간결한 표현으로 '돌판'을 택했습니다.
- source_word: כָּרִאשֹׁנִים
  english_pob_choice: like the first ones
  chosen_korean: 첫 번째 것들과 같은
  alternatives_korean:
  - 첫 것들과 같은
  - 이전 것들과 같은
  - 처음 것들과 같은
  lexicon: HALOT
  rationale: 앞서 언급된 이전 돌판들과의 유사성을 분명히 하기 위해 관계성을 유지한 표현으로 옮겼습니다.
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  english_pob_choice: rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어나
  - 새벽에 일어나
  - 일찍 일어나
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 서술어로 옮기되, 시간 부사로 아침의 이른 행위를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 표준 원칙에 따라 신적 고유명사를 титул로 바꾸지 않고 음역형 '야훼'로 옮겼습니다.
- source_word: וַיִּקַּח בְּיָדוֹ
  english_pob_choice: he took in his hand
  chosen_korean: 손에 들었습니다
  alternatives_korean:
  - 손에 쥐었습니다
  - 손에 가지고 있었습니다
  - 그의 손에 있었습니다
  lexicon: HALOT
  rationale: 히브리어 단수 '그의 손'의 관용성을 살리면서, 문맥상 두 돌판을 휴대하는 동작을 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: יהוה의 표기와 번역
  chosen_reading: 본문에서는 하나님의 고유명사를 '야훼'로 직접 표기합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 출애굽기 34:4는 여호와/야훼의 직접 명칭을 사용하므로, 표제적 칭호로 대체하지 않고 원문이 드러내는 언약적 인격성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
