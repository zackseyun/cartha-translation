  terminology: '''돌판'', ''시내 산'', ''야훼''는 적절합니다. 야훼는 원문의 신명 יהוה를 직접 반영합니다. ''깎아 만들다''는 돌판을 만들어 낸 행위를 명료하게 전달하면서, 새김의 내용을 뜻하는 ''새기다''를 피합니다.'
