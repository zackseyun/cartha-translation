translation:
  language: ko
  text: 아침까지 준비해 두었다가, 아침에 시내산으로 올라가서 거기에서 산의 꼭대기에서 내 앞에 서십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내산으로 올라가십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘산의 꼭대기에서 내 앞에 서십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן לַבֹּקֶר
  english_pob_choice: be ready by the morning
  chosen_korean: 아침까지 준비해 두었다가
  alternatives_korean:
  - 아침까지 준비하십시오
  - 아침에 맞추어 준비해 두십시오
  lexicon: HALOT
  rationale: היה + נָכוֹן의 명령적 결합을 한국어로는 자연스럽게 ‘준비해 두다’로 옮기되, לַבֹּקֶר의 시점성을 살려 ‘아침까지’로 표현했습니다.
- source_word: וְעָלִיתָ בַבֹּקֶר
  english_pob_choice: come up in the morning
  chosen_korean: 아침에 시내산으로 올라가서
  alternatives_korean:
  - 아침에 올라가서
  - 아침에 시내산에 올라가서
  lexicon: HALOT
  rationale: עלה는 단순 이동이 아니라 산 위로의 상승을 뜻하므로 ‘올라가다’로 옮기고, בַבֹּקֶר은 앞의 לַבֹּקֶר과 구별해 ‘아침에’로 처리했습니다.
- source_word: וְנִצַּבְתָּ לִי שָׁם
  english_pob_choice: present yourself there to me
  chosen_korean: 거기에서 내 앞에 서십시오
  alternatives_korean:
  - 거기에서 내게 자신을 나타내십시오
  - 거기에서 내 앞에 자신을 세우십시오
  lexicon: HALOT
  rationale: נצב의 ‘서다/자리를 잡다’ 의미를, 하나님 앞에 공식적으로 출두하는 장면에 맞게 한국어 관용의 ‘내 앞에 서다’로 살렸습니다.
- source_word: עַל רֹאשׁ הָהָר
  english_pob_choice: on the top of the mountain
  chosen_korean: 산의 꼭대기에서
  alternatives_korean:
  - 산의 정상에서
  - 산꼭대기에서
  lexicon: HALOT
  rationale: רֹאשׁ은 지형적 ‘머리/꼭대기’이므로 이미지가 살아 있는 ‘산의 꼭대기’로 번역했습니다.
theological_decisions:
- issue: 하나님께 대한 직접 명령의 한국어 높임법
  chosen_reading: ‘서십시오’, ‘올라가서’처럼 높임 종결을 사용했습니다.
  alternative_readings:
  - 평서형 명령 ‘서라’
  - 더 성경체적인 ‘서시옵소서’
  rationale: 본절은 하나님이 모세에게 직접 명령하는 장면이므로 현대 합쇼체를 기본으로 하되, 하나님을 향한 직접 대화의 공손함은 유지했습니다.
  doctrine_reference: 'Translation philosophy: source-direct, modern formal-polite Korean'
