base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
  footnotes:
  - marker: a
    text: Or 'go among us' or 'go with us.' The Hebrew literally says 'go in our midst.'
    reason: lexical_alternative
  - marker: b
    text: Or 'make us your possession.' The Hebrew verb can carry the sense of taking or assigning as an inheritance/possession.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말했습니다. 「지금 제가 주님의 눈에 은혜를 입었다면, 주님, 부디 주님께서 우리 가운데 함께 가 주십시오.[a] 비록 이 백성이 목이 뻣뻣한 백성이지만, 우리의 죄악과 우리의 죄를 용서하시고, 우리를 주님의 기업으로 삼으십시오.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 가운데에서 가십시오’ 또는 ‘우리와 함께 가십시오’. 히브리어는 문자적으로 ‘우리 가운데에서 가십시오’라고 합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘우리를 주님의 소유로 삼으십시오’. 히브리어 동사는 기업이나 소유로 삼는 뜻을 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן / בְּעֵינֶיךָ
  english_pob_choice: found favor in your eyes
  chosen_korean: 주님의 눈에 은혜를 입었다면
  alternatives_korean:
