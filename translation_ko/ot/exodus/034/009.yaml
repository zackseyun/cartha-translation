  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
  footnotes:
  - marker: a
    text: Or 'go among us' or 'go with us.' The Hebrew literally says 'go in our midst.'
    reason: lexical_alternative
  - marker: b
    text: Or 'make us your possession.' The Hebrew verb can carry the sense of taking or assigning as an inheritance/possession.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말했습니다. 「지금 제가 주님의 눈에 은혜를 입었다면, 주님, 부디 주님께서 우리 가운데로 가십시오. 비록 이 백성이 목이 곧은 백성이지만, 우리의 악과 우리의 죄를 용서하시고, 우리를 주님의 기업으로 삼으십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 가운데서 가십시오’ 또는 ‘우리와 함께 가십시오’. 히브리어는 문자적으로 ‘우리 가운데로 가십시오’라고 합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘우리를 주님의 소유로 삼으십시오’. 히브리어 동사는 상속으로 받거나 배정된 소유로 삼는 뜻을 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן / בְּעֵינֶיךָ
  english_pob_choice: found favor in your eyes
  chosen_korean: 주님의 눈에 은혜를 입었다면
  alternatives_korean:
  - 주님의 눈에 호의를 얻었다면
  - 주님의 눈에 은총을 얻었다면
  lexicon: HALOT
  rationale: 관용구의 관계적 의미를 살리면서도 한국어에서 자연스럽고, '은혜'를 통해 호의보다 더 강한 긍정적 승인감을 전달합니다.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  english_pob_choice: please let the Lord go in our midst
  chosen_korean: 부디 주님께서 우리 가운데로 가십시오
  alternatives_korean:
  - 부디 주님께서 우리 가운데서 가십시오
  - 부디 주님께서 우리 가운데 함께 가십시오
  lexicon: HALOT
  rationale: '''우리 가운데로''는 בקרב의 공간적 이미지를 비교적 직접적으로 살리며, 영어 POB의 ''in our midst''를 한국어로 자연스럽게 옮깁니다.'
- source_word: קְשֵׁה עֹרֶף
  english_pob_choice: stiff-necked
  chosen_korean: 목이 곧은
  alternatives_korean:
  - 고집 센
  - 완고한
  lexicon: HALOT
  rationale: 출애굽기의 익숙한 히브리어 은유를 보존해야 하므로, 의미를 완화하는 현대식 추상어보다 비유를 유지한 표현을 택했습니다.
- source_word: וְסָלַחְתָּ ... וּלְחַטָּאתֵנוּ
  english_pob_choice: forgive our iniquity and our sin
  chosen_korean: 우리의 악과 우리의 죄를 용서하시고
  alternatives_korean:
  - 우리의 죄악과 우리의 죄를 용서하시고
  - 우리의 불의와 우리의 죄를 용서하시고
  lexicon: HALOT
  rationale: עָוֹן과 חַטָּאת의 병렬을 한국어에서도 구분하면서, 첫 항은 도덕적 그릇됨의 무게를 드러내는 '악'으로, 둘째는 직접적 '죄'로 옮겼습니다.
- source_word: וּנְחַלְתָּנוּ
  english_pob_choice: take us as your inheritance
  chosen_korean: 우리를 주님의 기업으로 삼으십시오
  alternatives_korean:
  - 우리를 주님의 유업으로 삼으십시오
  - 우리를 주님의 소유로 삼으십시오
  lexicon: HALOT
  rationale: נחל의 상속/기업 개념을 한국어 성경 문체의 '기업'으로 살리되, 하나님과 백성의 언약적 소속 관계를 분명하게 전합니다.
theological_decisions:
- issue: אֲדֹנָי를 주어/호칭으로 어떻게 보존할지
  chosen_reading: 주님
  alternative_readings:
  - 내 주님
  - 주 하나님
  rationale: 본문은 신적 이름 YHWH가 아니라 호칭 אֲדֹנָי를 사용하므로, 이를 '주님'으로 옮겨 본문의 직접성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names'
- issue: וְסָלַחְתָּ와 וּנְחַלְתָּנוּ의 청원 형식
  chosen_reading: 용서하시고 ... 삼으십시오
  alternative_readings:
  - 용서하여 주시고 ... 취하여 주십시오
  - 용서하시고 ... 소유로 삼으십시오
  rationale: 모세의 간청이라는 문맥에 맞게 공손한 명령형을 유지했으며, '기업'은 단순 소유보다 언약적 소속을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms'
