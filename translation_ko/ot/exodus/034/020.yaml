id: EXO.34.20
reference: Exodus 34:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פֶ֤טֶר חֲמוֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ כֹּ֣ל בְּכ֤וֹר בָּנֶ֨י/ךָ֙ תִּפְדֶּ֔ה וְ/לֹֽא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
  footnotes:
  - marker: a
    text: Or 'with a sheep' or more broadly 'with one of the flock'; Hebrew שֶׂה can refer to a sheep or goat from the flock.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'before my face.' This is a Hebrew idiom for appearing in God's presence.
    reason: lexical_alternative
  - marker: c
    text: That is, not without a gift or offering.
    reason: cultural_note
translation:
  language: ko
  text: 나귀의 첫 새끼는 양이나 염소 한 마리로 속량해야 합니다[a]. 속량하지 않으면 그 목을 꺾어야 합니다. 네 모든 맏아들은 속량해야 합니다. 아무도 빈손으로 내 앞에 나오지 말아야 합니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 양 또는 염소, 더 넓게는 떼에 속한 한 마리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 얼굴 앞에’입니다. 이는 하나님 앞에 나아온다는 히브리어 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 예물이나 제물을 드리지 않은 채 하나님 앞에 나오지 말라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  english_pob_choice: the firstborn of a donkey
  chosen_korean: 나귀의 첫 새끼
  alternatives_korean:
  - 나귀의 첫 태생
  - 나귀의 맏배
  lexicon: HALOT
  rationale: פֶטֶר는 ‘처음 열어젖히는 것’의 뜻이어서 법적 문맥에서는 첫 새끼/첫 태생이 자연스럽습니다. ‘나귀’로 특정 대상을 분명히 했습니다.
- source_word: תִּפְדֶּה
  english_pob_choice: you shall redeem
  chosen_korean: 속량해야 합니다
  alternatives_korean:
  - 구속해야 합니다
  - 되사야 합니다
  lexicon: HALOT
  rationale: פדה의 법적·제의적 의미를 살리기 위해 단순 구매보다 구속·속량의 의미가 드러나는 ‘속량하다’를 택했습니다.
- source_word: בְשֶׂה
  english_pob_choice: with a lamb
  chosen_korean: 어린 양으로
  alternatives_korean:
  - 양으로
  - 양 떼의 한 마리로
  lexicon: HALOT
  rationale: שֶׂה는 양이나 염소를 아우를 수 있지만, 속량 제의 문맥에서는 ‘어린 양’이 가장 자연스럽고 독자가 제의적 대체를 이해하기 쉽습니다.
- source_word: וַעֲרַפְתּוֹ
  english_pob_choice: you shall break its neck
  chosen_korean: 그 목을 꺾어야 합니다
  alternatives_korean:
  - 목을 부러뜨려야 합니다
  - 목을 쳐야 합니다
  lexicon: HALOT
  rationale: ערף는 특정하게 ‘목을 꺾다’는 뜻이므로, 처형의 방식이 분명히 드러나도록 직역에 가깝게 옮겼습니다.
- source_word: רֵיקָם
  english_pob_choice: empty-handed
  chosen_korean: 빈손으로
  alternatives_korean:
  - 아무것도 없이
  - 공물 없이
  lexicon: HALOT
  rationale: 예배·절기 문맥에서 ריקם은 제물 없이 나아오지 말라는 뜻이므로, 한국어 관용구인 ‘빈손으로’가 의미를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: בְּכוֹר בָּנֶיךָ의 성별 표지 유지
  chosen_reading: 당신의 아들들의 모든 첫 태생
  alternative_readings:
  - 당신의 자녀들의 모든 첫 태생
  - 당신의 모든 맏아들
  rationale: 히브리어는 분명히 ‘아들들’(sons)을 말하므로, 성별을 중화하지 않고 법적 대상의 범위를 유지했습니다.
  doctrine_reference: Translation philosophy §4
- issue: פָנַי רֵיקָם의 관용구 처리
  chosen_reading: 내 앞에 나오지 말아야 합니다
  alternative_readings:
  - 내 얼굴 앞에 나오지 말아야 합니다
  - 내 면전에서 비어 있지 말아야 합니다
  rationale: 직역하면 ‘내 얼굴’이지만, 여기서는 하나님 앞에 예물을 가지고 나아오는 예배 관용구이므로 의미를 살려 ‘내 앞에’로 옮겼습니다.
  doctrine_reference: Translation philosophy §6
