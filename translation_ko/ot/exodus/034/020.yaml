  source_fidelity: 수정이 필요합니다. שֶׂה는 어린 양에 한정되지 않고 양 또는 염소를 가리킬 수 있으므로 본문에서 그 범위를 보존하는 편이 안전합니다. 또한 כָּל־בְּכוֹר בָּנֶיךָ는 한국어로 ‘네 모든 맏아들’이 자연스럽고, 히브리어의 남성 표지를 유지합니다.
  naturalness: 초안의 ‘당신의 아들들의 모든 첫 태생’은 현대 표준 한국어에서 중복되고 어색합니다. ‘네 모든 맏아들’과 조건절 ‘속량하지 않으면’이 법조문 문맥에서 더 자연스럽습니다. ‘당신’은 성경의 하나님 발화에서 불필요하게 거리감이 있으므로 ‘네’로 고쳤습니다.
  terminology: ‘속량하다’는 פדה의 법적·제의적 의미를 적절히 보존합니다. וַעֲרַפְתּוֹ는 ‘그 목을 꺾어야 합니다’로 유지했습니다. ‘빈손으로 내 앞에’는 פָנַי רֵיקָם의 관용적 의미와 하나님의 직접 발화를 충실히 전달합니다.
