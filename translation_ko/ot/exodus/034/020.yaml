  - severity: low
    issue: 문화 주석의 문법 및 의미가 불명확함
    rationale: ‘예물이나 제물을 없이 지니지 말라’는 한국어 문법상 어색하며, 빈손으로 나오지 말라는 의미를 분명히 밝혀야 합니다.
