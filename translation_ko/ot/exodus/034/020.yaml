revisions:
- from: 당신은 나귀의 첫 새끼를 어린 양으로 속량해야 합니다[a]. 그러나 속량하지 않으려거든 그 목을 꺾어야 합니다. 당신의 아들들의 모든 첫 태생은 속량해야 합니다. 그리고 아무도 빈손으로 내 앞에 나오지 말아야 합니다[b][c].
  to: 나귀의 첫 새끼는 양이나 염소 한 마리로 속량해야 합니다[a]. 속량하지 않으면 그 목을 꺾어야 합니다. 네 모든 맏아들은 속량해야 합니다. 아무도 빈손으로 내 앞에 나오지 말아야 합니다[b][c].
  rationale: 원문의 법적·제의적 의미와 성별 표지를 보존하면서, שֶׂה의 어휘 범위를 본문에서 유지했습니다. 또한 한국어 법조문형 합쇼체에 맞게 수신자 지시와 ‘맏아들’ 표현을 자연스럽게 다듬고, 문화 주석을 명료하게 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:00:05Z'
