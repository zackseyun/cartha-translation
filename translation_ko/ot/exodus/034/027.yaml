  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
  footnotes:
  - marker: a
    text: Hebrew literally, “cut a covenant.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. "이 말들을 너를 위해 기록하라. 왜냐하면 이 말들에 따라 내가 너와 이스라엘과 언약을 맺었기 때문입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자적으로는 “언약을 자르다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC/SBLGNT 대조용 프로젝트 기본값
  rationale: 본문의 고유한 신명은 번역어로 대체하지 않고 음역하여, 언약 체결 주체의 인격적 이름을 보존합니다.
- source_word: כְּתָב
  english_pob_choice: Write
  chosen_korean: 기록하라
  alternatives_korean:
  - 쓰라
  - 적어 두라
  lexicon: HALOT
  rationale: 직접적인 명령형을 살리되, 하나님의 말씀을 돌에 새길 맥락까지 고려하면 단순한 필기보다 공적인 기록의 뉘앙스를 담는 "기록하라"가 적절합니다.
- source_word: הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이 말들
  alternatives_korean:
  - 이 말씀들
  - 이것들
  lexicon: HALOT
  rationale: 명령 대상이 되는 דברים를 문자적으로 "말들"로 옮겨, 기록해야 할 언어적 단위를 분명히 했습니다.
- source_word: עַל פִּי
  english_pob_choice: according to
  chosen_korean: …에 따라
  alternatives_korean:
  - …에 의하여
  - …을 따라
  lexicon: HALOT
  rationale: 관용구의 규범·근거 의미를 한국어의 "…에 따라"로 자연스럽게 옮겨, 언약의 기준이 된 말씀을 드러냅니다.
- source_word: כָּרַתִּי בְּרִית
  english_pob_choice: I have made a covenant
  chosen_korean: 언약을 맺었기
  alternatives_korean:
  - 언약을 세웠기
  - 언약을 끊었기
  lexicon: HALOT
  rationale: 히브리어 직역인 "언약을 자르다"보다, 한국어 성경에서 이해 가능한 동사 "맺다"를 택하되 제의적 언약 체결의 완결성을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼로 음역하여 하나님의 고유명을 보존합니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값을 따르며, 본문이 단순 호칭이 아니라 시내 언약의 주체인 신적 고유명을 드러내므로 대체 호칭으로 평준화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 언약 관용구 כָּרַתִּי ... בְּרִית
  chosen_reading: '"언약을 맺다"로 옮겨 의미를 자연스럽게 전달합니다.'
  alternative_readings:
  - '"언약을 자르다"'
  - '"언약을 세우다"'
  rationale: 직역은 관용구의 배경을 보존하지만 일반 독자에게는 난해하므로, 의미를 훼손하지 않는 범위에서 공용어적 한국어로 풀었습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
