base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
  footnotes:
  - marker: a
    text: Or 'Observe what I am commanding you today' or 'Be careful concerning what I am commanding you today.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from before you'; the phrase means removal from your presence or in front of you.
    reason: lexical_alternative
translation:
  language: ko
  text: 오늘 내가 너에게 명령하는 것을 지키십시오[a]. 보십시오, 내가 너희 앞에서 아모리 사람들과 가나안 사람들과 헷 사람들과 브리스 사람들과 히위 사람들과 여부스 사람들을 쫓아냅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 오늘 너에게 명령하는 것을 관찰하십시오’ 또는 ‘내가 오늘 너에게 명령하는 것에 대해 주의하십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  english_pob_choice: Keep what I am commanding you today
  chosen_korean: 오늘 내가 너에게 명령하는 것을 지키십시오
  alternatives_korean:
  - 오늘 내가 너에게 명령하는 것을 보존하십시오
  - 오늘 내가 너에게 명령하는 것을 주의하여 지키십시오
  lexicon: HALOT
  rationale: שׁמר는 문맥상 ‘지키다/준수하다’의 명령형이므로, 현대 합쇼체에서 가장 직접적인 대응인 ‘지키십시오’를 택했습니다. לְךָ의 반사적 뉘앙스는 한국어에서 자연스럽게 드러나기 어려워 과잉 번역하지 않았습니다.
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  english_pob_choice: what I am commanding you today
  chosen_korean: 오늘 내가 너에게 명령하는 것
  alternatives_korean:
  - 내가 오늘 너에게 명령하는 것
  - 오늘 내가 너에게 명하는 것
  lexicon: HALOT
  rationale: 관계절 구조를 살려 ‘…하는 것’으로 옮겼고, אָנֹכִי מְצַוְּךָ는 지속적·현재적 명령의 흐름을 반영해 ‘명령하는’으로 처리했습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: HALOT
  rationale: הִנְנִי는 주의를 끄는 강조 표지이므로, 현대 한국어에서 격식 있는 호명 기능을 살리는 ‘보십시오’가 합쇼체와 잘 맞습니다.
- source_word: גֹרֵשׁ מִפָּנֶיךָ
  english_pob_choice: am driving out before you
  chosen_korean: 너희 앞에서 쫓아냅니다
  alternatives_korean:
  - 너희 앞에서 몰아냅니다
  - 너희 앞에서 내쫓습니다
  lexicon: HALOT
  rationale: גרש의 핵심 의미를 ‘쫓아내다/몰아내다’로 반영했고, מִפָּנֶיךָ는 관용적으로 ‘앞에서’로 옮겨 원문의 공간적 배치를 자연스럽게 살렸습니다.
- source_word: הָאֱמֹרִי ... הַיְבוּסִי
  english_pob_choice: the Amorites ... the Jebusites
  chosen_korean: 아모리 사람들… 여부스 사람들
  alternatives_korean:
  - 아모리인들… 여부스인들
  - 아모리 족속… 여부스 족속
  lexicon: HALOT
  rationale: 히브리어 집단명은 한국어에서 통상 ‘사람들’로 풀어 자연스럽게 전달했고, 고유한 민족명은 음역을 유지했습니다.
theological_decisions:
- issue: 명령과 심판 선언의 병행
  chosen_reading: 이 절은 언약적 순종 명령과 더불어, 하나님이 이방 민족들을 실제로 몰아내시는 주권적 행위를 함께 제시합니다.
  alternative_readings:
  - 단순한 경고문으로만 읽기
  - 정복 서사만 강조하기
  rationale: 첫 절반의 명령형과 후반의 ‘내가 쫓아낸다’는 선언을 둘 다 살려야 문맥의 언약성과 신적 주권이 보존됩니다.
  doctrine_reference: Translation philosophy §1, §5
