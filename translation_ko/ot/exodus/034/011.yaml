  naturalness: ‘오늘 내가 네게 명령하는 것을 지키십시오’와 ‘보십시오, 내가 네 앞에서 … 쫓아냅니다’는 현대 표준어 합쇼체에서 자연스럽고, 본문의 엄숙한 명령·선언의 어조도 유지합니다. ‘관찰하십시오’는 이 문맥에서 계명을 준수한다는 뜻으로는 부자연스러워 ‘준수하십시오’로 고쳤습니다.
