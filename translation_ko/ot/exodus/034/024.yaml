  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אוֹרִ֤ישׁ גּוֹיִם֙ מִ/פָּנֶ֔י/ךָ וְ/הִרְחַבְתִּ֖י אֶת גְּבוּלֶ֑/ךָ וְ/לֹא יַחְמֹ֥ד אִישׁ֙ אֶֽת אַרְצְ/ךָ֔ בַּ/עֲלֹֽתְ/ךָ֗ לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
  footnotes:
  - marker: a
    text: Hebrew literally, 'to see the face of the LORD your God'; the idiom means 'to appear before' him in worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'three times a year.'
    reason: lexical_alternative
  - marker: c
    text: '''No man'' renders a masculine singular Hebrew noun used representatively; the sense is that no one will covet the land while Israel''s males go up for the pilgrimage festivals.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 네 앞에서 이방 민족들을 쫓아내고 네 경계를 넓혀 주며, 네가 올라와 야훼 네 하나님 앞에 나타날 때에는 아무도 네 땅을 탐내지 못할 것입니다. 이것은 해마다 세 번입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘야훼의 얼굴을 보다’이지만, 예배와 순례의 관용구로서는 ‘앞에 나타나다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘해마다 세 번’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 남성 단수형은 여기서 대표적 의미로 쓰였으므로, 뜻은 ‘아무도’에 가깝습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אוֹרִישׁ גּוֹיִם מִפָּנֶיךָ
  english_pob_choice: I will drive out nations from before you
  chosen_korean: 네 앞에서 이방 민족들을 쫓아내고
  alternatives_korean:
  - 네 앞에서 나라들을 몰아내고
  - 네 앞에서 민족들을 몰아내고
  lexicon: HALOT
  rationale: 히필형 אוֹרִישׁ은 단순 이동이 아니라 출애굽-정복 맥락에서의 축출을 뜻하므로, 한국어에서는 자연스럽게 ‘쫓아내다’로 옮겨 제거의 강도를 살렸습니다.
- source_word: וְהִרְחַבְתִּי אֶת גְּבוּלֶךָ
  english_pob_choice: and enlarge your border
  chosen_korean: 네 경계를 넓혀 주며
  alternatives_korean:
  - 네 경계를 확장하며
  - 네 지경을 넓혀 주며
  lexicon: HALOT
  rationale: גְּבוּל은 ‘경계/지경/영토’의 의미를 가지며, 약속의 땅 문맥에서는 구체적 경계 개념이 중요하므로 ‘경계’를 택했습니다.
- source_word: וְלֹא יַחְמֹד אִישׁ אֶת אַרְצְךָ
  english_pob_choice: and no man will covet your land
  chosen_korean: 아무도 네 땅을 탐내지 못할 것입니다
  alternatives_korean:
  - 어떤 사람도 네 땅을 탐내지 못할 것입니다
  - 한 사람도 네 땅을 탐내지 못할 것입니다
  lexicon: HALOT
  rationale: יָחְמֹד는 십계명의 ‘탐내다’와 같은 어근이므로, 단순한 욕망보다 금지된 탐욕을 드러내는 ‘탐내다’가 적절합니다.
- source_word: לֵרָאוֹת אֶת פְּנֵי יְהוָה אֱלֹהֶיךָ
  english_pob_choice: to appear before Yahweh your God
  chosen_korean: 야훼 네 하나님 앞에 나타날 때에는
  alternatives_korean:
  - 야훼 네 하나님 앞에 보이러 갈 때에는
  - 야훼 네 하나님을 뵈러 갈 때에는
  lexicon: HALOT
  rationale: 직역하면 ‘야훼의 얼굴을 보다’이지만, 예배·순례 관용구로서는 ‘앞에 나타나다’가 원문의 관용적 뜻을 분명히 전달합니다.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  english_pob_choice: three times in the year
  chosen_korean: 해마다 세 번입니다
  alternatives_korean:
  - 한 해에 세 번입니다
  - 일 년에 세 번입니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘한 해 안에 세 번’이므로, 한국어에서는 자연스러운 표현인 ‘해마다 세 번’으로 옮기되 반복 규범의 뜻을 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 표기
  chosen_reading: 예배·언약 맥락의 יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로, 관용적 대체어를 쓰지 않고 신명 표기 원칙에 따라 ‘야훼’를 유지했습니다. 이는 출애굽기의 언약적 하나님의 이름을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מיןִ/אִישׁ의 대표적 남성형
  chosen_reading: אִישׁ을 ‘아무도’로 번역해 대표적 남성형의 포괄적 기능을 살렸습니다.
  alternative_readings:
  - 한 사람도
  - 어떤 남자도
  rationale: 히브리어는 남성 단수형이지만 문맥상 대표적 일반화를 담고 있어, 한국어에서는 자연스러움과 의미를 함께 살리는 ‘아무도’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
