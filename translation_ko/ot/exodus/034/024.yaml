  verdict: revise
  source_fidelity: 마지막 절의 시간·조건 구문이 독립문인 “이것은 해마다 세 번입니다”로 분리되어, 히브리어 בַּעֲלֹתְךָ … שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה가 이루는 ‘해마다 세 번 올라갈 때’라는 수식 관계가 훼손되었습니다. 또한 לֹא יַחְמֹד는 단순 미래의 약속이므로 ‘탐내지 못할 것입니다’보다 ‘탐내지 않을 것입니다’가 더 충실합니다.
  naturalness: 수정문은 한국어 합쇼체의 한 문장 구조 안에서 하나님의 약속과 순례 시점을 자연스럽게 연결합니다. ‘야훼 네 하나님 앞에 나타나려고 올라갈 때’는 순례의 이동과 목적을 모두 드러냅니다.
  terminology: ‘야훼’, ‘하나님’, ‘탐내다’, ‘땅’, ‘경계’는 적절합니다. גּוֹיִם은 이 문맥에서 ‘민족들’로 옮길 수 있으며, ‘이방’을 덧붙이지 않아도 원문의 정치·민족적 의미가 보존됩니다. 각주 a의 직역에는 ‘네 하나님’을 포함시켜야 합니다.
  issues:
  - severity: high
    issue: ‘해마다 세 번’이 ‘이것은 해마다 세 번입니다’라는 독립문으로 분리됨
    rationale: 원문에서 ‘해마다 세 번’은 야훼 앞에 나타나기 위해 올라가는 때/횟수를 규정합니다. 독립문으로 만들면 문법 관계와 의미가 부자연스럽고 불완전해집니다.
