  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶת פְּנֵ֛י הָֽ/אָדֹ֥ן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''before the face of.'' The phrase means ''before'' or ''in the presence of.'''
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English often has ''the Lord GOD'' here. Hebrew distinguishes two terms: ''the Lord'' (ha''adon) and the divine name YHWH, rendered in this translation as ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 일 년에 세 번, 너희의 모든 남자는 야훼, 곧 이스라엘의 하나님이신 주님 앞에 나타나야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘얼굴 앞에’에 해당하는 관용구로, 여기서는 ‘앞에’ 또는 ‘면전에서’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 ‘주님’(ha'adon)과 언약 이름 YHWH를 함께 써서, 두 호칭을 구별합니다.
    reason: theological_note
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים
  english_pob_choice: Three times
  chosen_korean: 세 번
  alternatives_korean:
