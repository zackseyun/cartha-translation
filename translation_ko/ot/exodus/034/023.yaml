  - 너희의 모든 남자들
  lexicon: HALOT
  rationale: 의무 대상이 되는 집단을 남성으로 분명히 드러내되, 한국어에서 명령문 맥락에 자연스럽게 읽히는 표현을 택했습니다.
- source_word: אֶת פְּנֵי הָאָדֹן יְהוָה
  english_pob_choice: before the Lord Yahweh
  chosen_korean: 야훼, 곧 이스라엘의 하나님이신 주님 앞에
  alternatives_korean:
  - 야훼 앞에
  - 주 야훼 앞에
  - 주님, 야훼 앞에
  lexicon: HALOT
  rationale: ‘פְּנֵי’는 문자적으로 ‘얼굴’을 뜻하지만 여기서는 ‘앞에/면전에서’의 관용구이므로 ‘앞에’로 옮겼고, הָאָדֹן과 יְהוָה를 각각 ‘주님’과 ‘야훼’로 살려 중복된 주어 결합을 한국어에서 자연스럽게 풀었습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
