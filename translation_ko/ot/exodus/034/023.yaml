  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 빈도를 나타내므로 한국어로는 가장 자연스러운 ‘세 번’이 적절합니다.
- source_word: בַּשָּׁנָה
  english_pob_choice: in the year
  chosen_korean: 일 년에
  alternatives_korean:
  - 해마다
  - 그 해에
  lexicon: HALOT
  rationale: 정관사가 있는 표현이 연중 반복되는 규례를 가리키므로, 현대 한국어에서는 뜻을 분명히 하는 ‘일 년에’가 가장 자연스럽습니다.
- source_word: כָּל זְכוּרְךָ
  english_pob_choice: all your males
  chosen_korean: 너희의 모든 남자
  alternatives_korean:
