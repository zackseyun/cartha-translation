  - 주님, 곧 야훼
  rationale: 본문은 ‘주(ha'adon)’와 여호와의 이름을 함께 사용하므로, 한국어에서도 직함과 고유명을 모두 보존하되 반복을 피하기 위해 동격 설명으로 풀어 썼습니다.
