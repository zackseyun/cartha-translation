translation:
  language: ko
  text: 그 후에 이스라엘의 모든 아들들이 가까이 나아왔고, 그는 야훼께서 시내 산에서 그와 함께 말씀하신 모든 것을 그들에게 명령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’입니다. 많은 한국어 성경은 이 قومی적 표현을 ‘이스라엘 자손’ 또는 ‘이스라엘 백성’으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  english_pob_choice: Afterward
  chosen_korean: 그 후에
  alternatives_korean:
  - 그 뒤에
  - 그 후
  lexicon: HALOT
  rationale: 이전 사건 뒤의 시간적 진행을 자연스럽게 나타내면서 원문의 순서를 보존합니다.
- source_word: נִגְּשׁוּ
