  rationale: 원문의 남성 복수 표지를 지우지 않고, POB의 gender-accurate 원칙을 한국어에서 가능한 한 드러내기 위해 직조했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
