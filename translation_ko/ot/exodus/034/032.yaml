  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
  footnotes:
  - marker: a
    text: Hebrew 'sons of Israel'; many English versions render this national expression as 'Israelites' or 'children of Israel.'
