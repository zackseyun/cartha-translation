  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 아들들’입니다. 많은 한국어 성경은 이 민족적 표현을 ‘이스라엘 자손’ 또는 ‘이스라엘 백성’으로 옮깁니다.
    reason: lexical_alternative
