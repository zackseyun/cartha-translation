  to: 무교절을 지키십시오[a]. 이레 동안, 내가 당신에게 명령한 대로 아빕 달의 정해진 때에 누룩 없는 빵을 먹으십시오[b]. 당신이 아빕 달에 이집트에서 나왔기 때문입니다[c].
