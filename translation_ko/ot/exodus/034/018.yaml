id: EXO.34.18
reference: Exodus 34:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
  footnotes:
  - marker: a
    text: Or 'festival of unleavened bread.' The Hebrew חַג can denote a feast or festival, especially a sacred appointed observance.
    reason: lexical_alternative
  - marker: b
    text: '''Abib'' is the early spring month associated with the exodus from Egypt.'
    reason: cultural_note
  - marker: c
    text: Or 'you came out of Egypt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 무교절을 지키십시오[a]. 이레 동안, 내가 당신에게 명령한 대로 아빕 달의 정해진 때에 누룩 없는 빵을 먹으십시오[b]. 당신이 아빕 달에 이집트에서 나왔기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누룩 없는 빵의 절기’입니다. 히브리어 חַג는 절기 또는 축제, 특히 종교적 절기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아빕’은 출애굽과 관련된 이른 봄의 달 이름입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘당신이 이집트에서 떠났기 때문입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  english_pob_choice: the Feast of Unleavened Bread
  chosen_korean: 무교절
  alternatives_korean:
  - 누룩 없는 빵의 절기
  - 무교절 축제
  lexicon: HALOT
  rationale: חַג은 정해진 거룩한 절기를 가리킬 수 있으므로, 한국어에서는 제목형 관용 표현인 ‘무교절’이 가장 간결하고 성경적 용례에도 잘 맞습니다.
- source_word: תִּשְׁמֹר
  english_pob_choice: you shall keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 준수하십시오
  - 보존하십시오
  lexicon: HALOT
  rationale: 절기·언약 문맥의 שׁמר는 단순한 관찰이 아니라 규례를 ‘지키다’는 뜻이므로, 표준어이면서도 명령의 힘이 살아 있는 ‘지키십시오’로 옮겼습니다.
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 누룩 없는 빵
  alternatives_korean:
  - 무교병
  - 누룩 없는 떡
  lexicon: HALOT
  rationale: 본문의 초점은 특별한 종교용어보다 발효시키지 않은 빵 자체에 있으므로, 현대 독자가 즉시 이해할 수 있는 ‘누룩 없는 빵’을 택했습니다.
- source_word: חֹדֶשׁ הָאָבִיב
  english_pob_choice: the month of Abib
  chosen_korean: 아빕 달
  alternatives_korean:
  - 아빕 월
  - 아빕의 달
  lexicon: HALOT
  rationale: אָבִיב은 출애굽 달의 고유 명칭이므로 음역을 유지하되, 한국어 달 명칭 관용에 맞춰 ‘아빕 달’로 처리했습니다.
- source_word: יָצָאתָ מִמִּצְרָיִם
  english_pob_choice: you came out from Egypt
  chosen_korean: 당신이 이집트에서 나왔기 때문입니다
  alternatives_korean:
  - 당신이 이집트에서 나왔기 때문입니다
  - 당신이 이집트에서 나와 나왔기 때문입니다
  lexicon: HALOT
  rationale: יצא의 기본 뜻을 살려 ‘나왔기 때문입니다’로 옮겼고, מִמִּצְרָיִם은 현대 지명 표기 기준에 따라 ‘이집트’로 번역했습니다.
theological_decisions:
- issue: second-person singular address to Israel
  chosen_reading: 히브리어의 단수형을 그대로 살려 한국어에서도 일관되게 ‘당신’으로 유지했습니다.
  alternative_readings:
  - 복수로 풀어 ‘너희’로 옮기기
  - 명시적 집합 주어를 넣어 ‘이스라엘은’으로 바꾸기
  rationale: 본문은 이스라엘 공동체를 단수형으로 호명하는 언약체를 유지하므로, 이를 평탄화하지 않고 형식을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §4
