theological_decisions:
- issue: 반복되는 פֶּן의 경고 구조
  chosen_reading: 두 번의 '그러면 안 된다'는 경고를 각각 금지와 결과 경고로 나누어, 언약 체결 자체와 그 결과를 분명히 구분했습니다.
  alternative_readings:
  - 한 문장으로 압축해 단순 경고로 처리하기
  - 첫 번째 פֶּן만 살리고 두 번째는 약화시키기
  rationale: 본문은 언약 체결 금지와 그 결과의 위험을 이중으로 강조하므로, 두 경고를 모두 보존해야 수사적 긴장이 살아납니다.
  doctrine_reference: 출 34:12 문맥상 가나안 주민과의 타협 및 우상숭배 위험 경고
