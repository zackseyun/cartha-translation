  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּכְרֹ֤ת בְּרִית֙ לְ/יוֹשֵׁ֣ב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתָּ֖ה בָּ֣א עָלֶ֑י/הָ פֶּן יִהְיֶ֥ה לְ/מוֹקֵ֖שׁ בְּ/קִרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
  footnotes:
  - marker: a
    text: Or 'Watch yourself' or 'Take care.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'cut a covenant,' an idiom meaning 'make a covenant.'
    reason: lexical_alternative
  - marker: c
    text: Or 'which you are entering.'
    reason: lexical_alternative
  - marker: d
    text: Or 'a trap.' The warning likely refers to the covenant becoming a source of entanglement and unfaithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 조심하십시오[a]. 그 땅의 주민들과, 곧 당신이 들어가고 있는 그 땅의 주민들과 언약을 맺지 마십시오[b][c][d]. 그것이 당신 가운데 덫이 될까 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “스스로 조심하십시오”, “주의하십시오”.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘언약을 끊다’의 뜻으로, 곧 ‘언약을 맺다’는 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “당신이 들어가고 있는”.
    reason: lexical_alternative
  - marker: d
    text: 또는 “덫”, “함정”. 이 경고는 그 언약이 얽매임과 불성실의 원인이 될 수 있음을 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  english_pob_choice: Be careful for yourself
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 자신을 잘 살피십시오
  - 주의하십시오
  - 스스로 조심하십시오
  lexicon: HALOT
  rationale: 반사적 경고의 뉘앙스는 살리되, 합쇼체에서 자연스럽고 간결하게 들리는 경고형으로 옮겼습니다.
- source_word: תִּכְרֹת בְּרִית
  english_pob_choice: you make a covenant
  chosen_korean: 언약을 맺지 마십시오
  alternatives_korean:
  - 언약을 세우지 마십시오
  - 언약을 끊지 마십시오
  - 언약을 체결하지 마십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역인 '끊다'보다 한국어에서 더 자연스럽고 의미를 정확히 전달하는 '언약을 맺다'를 택했습니다.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  english_pob_choice: with the inhabitants of the land
  chosen_korean: 그 땅의 주민들과
  alternatives_korean:
  - 그 땅에 사는 사람들과
  - 그 땅의 거주자들과
  lexicon: HALOT
  rationale: 단수 분사이지만 집합적 의미이므로 복수로 처리해 공동체 전체를 가리키는 뜻을 분명히 했습니다.
- source_word: פֶּן יִהְיֶה לְמוֹקֵשׁ בְּקִרְבֶּךָ
  english_pob_choice: lest it become a snare in your midst
  chosen_korean: 그것이 당신 가운데 덫이 될까 합니다
  alternatives_korean:
  - 그것이 당신 가운데 올무가 될까 합니다
  - 그것이 당신 가운데 함정이 될까 합니다
  lexicon: HALOT
  rationale: מוֹקֵשׁ의 함정/덫 이미지를 살리면서, 경고의 종결을 현대 한국어에서 자연스럽게 표현했습니다.
theological_decisions:
- issue: 반복되는 פֶּן의 경고 구조
  chosen_reading: 두 번의 '그러면 안 된다'는 경고를 각각 금지와 결과 경고로 나누어, 언약 체결 자체와 그 결과를 분명히 구분했습니다.
  alternative_readings:
  - 한 문장으로 압축해 단순 경고로 처리하기
  - 첫 번째 פֶּן만 살리고 두 번째는 약화시키기
  rationale: 본문은 언약 체결 금지와 그 결과의 위험을 이중으로 강조하므로, 두 경고를 모두 보존해야 수사적 긴장이 살아납니다.
  doctrine_reference: 출 34:12 문맥상 가나안 주민과의 타협 및 우상숭배 위험 경고
