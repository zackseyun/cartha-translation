  text: וַ/יַּ֨רְא אַהֲרֹ֜ן וְ/כָל בְּנֵ֤י יִשְׂרָאֵל֙ אֶת מֹשֶׁ֔ה וְ/הִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑י/ו וַ/יִּֽירְא֖וּ מִ/גֶּ֥שֶׁת אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
  footnotes:
  - marker: a
    text: Or 'shone' or 'sent out rays'; the Hebrew verb is rare and historically was also rendered 'was horned,' though the context favors radiance.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론과 이스라엘의 모든 자손이 모세를 보니, 보라, 그의 얼굴의 피부가 빛나고 있었고, 그들은 그에게 가까이 가기를 두려워했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 희귀하며, 문맥상 ‘빛나다’ 또는 ‘광선을 내뿜다’의 뜻이지만, 역사적으로는 ‘뿔이 나다’로도 번역된 적이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보니
  alternatives_korean:
  - 보았습니다
  - 보았습니다가 아니라 보게 되었습니다
  lexicon: HALOT
  rationale: 서술 흐름상 단순한 지각 동사로 풀기보다 뒤따르는 놀라운 사실을 이끄는 형태로 옮기기 위해 ‘보니’로 처리했습니다.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: and all the sons of Israel
  chosen_korean: 이스라엘의 모든 자손
  alternatives_korean:
  - 이스라엘의 모든 아들들
  - 이스라엘 사람 모두
  lexicon: HALOT
  rationale: 히브리어의 가족적 표현 בְּנֵי יִשְׂרָאֵל을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘자손’으로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 그런데
  - 바로
  lexicon: HALOT
  rationale: 갑작스러운 시각적 반전을 강조하는 담화 표지이므로, 서술의 놀라움을 유지하는 ‘보라’가 가장 적절합니다.
- source_word: קָרַן
  english_pob_choice: was radiant
  chosen_korean: 빛나고 있었고
  alternatives_korean:
  - 광채를 내고 있었고
  - 빛을 발하고 있었고
  lexicon: HALOT
  rationale: 희귀 동사의 의미를 본문 맥락에 따라 광휘로 이해하고, 얼굴의 표면에서 드러난 지속적 상태를 자연스럽게 표현했습니다.
- source_word: עוֹר פָּנָיו
  english_pob_choice: the skin of his face
  chosen_korean: 그의 얼굴의 피부
  alternatives_korean:
  - 그의 얼굴
  - 그의 얼굴의 살갗
  lexicon: HALOT
  rationale: 원문이 단순히 ‘얼굴’이 아니라 ‘얼굴의 피부’라고 말하므로, 구체적 신체 표현을 그대로 살렸습니다.
- source_word: וַיִּירְאוּ מִגֶּשֶׁת אֵלָיו
  english_pob_choice: they were afraid to come near him
  chosen_korean: 그에게 가까이 가기를 두려워했습니다
  alternatives_korean:
  - 그에게 가까이 오기를 무서워했습니다
  - 그에게 다가가기를 두려워했습니다
  lexicon: HALOT
  rationale: מִן+부정사 구문이 ‘다가가는 것을 꺼리다/두려워하다’는 뜻이므로, 한국어도 자연스럽게 ‘가까이 가기를 두려워했습니다’로 옮겼습니다.
theological_decisions:
- issue: קָרַן의 전통적 ‘뿔이 났다’ 해석 처리
  chosen_reading: 본문은 광휘를 말하는 것으로 번역하고, ‘뿔’ 해석은 채택하지 않습니다.
  alternative_readings:
  - 그의 얼굴이 뿔이 났다
  - 그의 얼굴에 뿔 같은 광선이 생겼다
  rationale: 문맥은 모세의 얼굴에서 나온 눈에 보이는 빛과 그로 인한 두려움을 설명하므로, 역사적으로 알려진 ‘뿔’ 번역은 본문 의미를 왜곡할 가능성이 큽니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 1, 3
