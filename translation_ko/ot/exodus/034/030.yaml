  source_fidelity: 핵심 의미는 잘 반영했으나, 본문의 ‘보라’를 독립적으로 삽입한 문장 연결이 한국어에서 부자연스럽습니다. 또한 카란의 상태는 ‘빛나고 있었다’로 옮길 수 있으나, ‘얼굴 피부가 빛나고 있었다’보다 ‘얼굴 피부에서 광채가 나고 있었다’가 원문의 가시적 광휘를 더 분명하고 자연스럽게 나타냅니다.
  naturalness: ‘아론과 이스라엘의 모든 자손이 모세를 보니, 보라,’는 현대 표준 한국어 문장으로 어색합니다. 히브리어의 주목 표지 וְהִנֵּה는 ‘보니’ 뒤의 발견 내용으로 자연스럽게 흡수할 수 있습니다. ‘이스라엘 자손 모두’는 성경 문맥에서 자연스럽고, 단순한 혈통 일반을 뜻할 수 있는 ‘이스라엘의 모든 자손’보다 명료합니다.
  terminology: ‘이스라엘 자손’은 בְּנֵי יִשְׂרָאֵל의 가족적·집단적 명칭을 보존합니다. ‘얼굴 피부’는 עוֹר פָּנָיו를 충실히 반영합니다. 각주에서는 희귀 동사의 광휘 의미와 역사적인 ‘뿔이 나다’ 번역을 유지하되, 문장과 어휘를 현대적으로 다듬었습니다.
