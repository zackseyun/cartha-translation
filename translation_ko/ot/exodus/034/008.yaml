translation:
  language: ko
  text: 모세는 서둘러 땅에 엎드려 경배하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘급히’ 또는 ‘빠르게’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘몸을 굽혀 절하였습니다’로 옮길 수 있습니다. 히브리어 동사는 경배의 행위와 그에 수반되는 몸의 자세를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  english_pob_choice: quickly
  chosen_korean: 서둘러
  alternatives_korean:
  - 빠르게
  - 급히
  - 곧바로
  lexicon: HALOT
  rationale: 동사 מהר의 ‘서두름/신속함’은 서술부에서 부사적으로 자연스럽게 옮기는 것이 좋으므로, ‘서둘러’로 옮겨 모세의 즉각적인 반응을 살렸습니다.
- source_word: וַיִּקֹּד
  english_pob_choice: bowed down
  chosen_korean: 땅에 엎드려
  alternatives_korean:
  - 몸을 굽혀
  - 무릎을 꿇고
  - 엎드려
  lexicon: HALOT
  rationale: קדד의 몸을 굽히는 동작은 여기서 다음 동사와 함께 예배적 태도를 이루므로, 한국어에서는 ‘땅에 엎드려’로 구체화해 자세의 낮아짐을 분명히 했습니다.
- source_word: וַיִּשְׁתָּחוּ
  english_pob_choice: worshiped
  chosen_korean: 경배하였습니다
  alternatives_korean:
  - 예배하였습니다
  - 엎드려 절하였습니다
  - 절하며 예배하였습니다
  lexicon: HALOT
  rationale: שחה는 단순한 물리적 절과 경배를 함께 가리킬 수 있으므로, 앞 절의 자세 묘사와 구별되게 ‘경배하였습니다’로 옮겨 예배적 의미를 드러냈습니다.
theological_decisions:
- issue: 두 동사의 관계를 어떻게 살릴 것인가
  chosen_reading: 첫 동사는 몸의 낮춤, 둘째 동사는 그에 수반된 경배 행위로 구분해 번역했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘엎드려’로 처리하는 방식
  - 둘째 동사를 ‘절하였습니다’로만 옮기는 방식
  rationale: 히브리어는 먼저 몸을 굽히는 동작을 말한 뒤, 이어서 경배 행위를 덧붙입니다. 한국어에서도 이 구분을 유지해야 모세의 즉각적이고 경외에 찬 응답이 살아납니다.
  doctrine_reference: 경배의 외적 자세와 내적 태도의 구분
