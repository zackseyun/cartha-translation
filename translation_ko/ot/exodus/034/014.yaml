id: EXO.34.14
reference: Exodus 34:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
  footnotes:
  - marker: a
    text: Or 'you shall not worship another god.' The Hebrew verb literally refers to bowing down, often in worship.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''for the LORD—Jealous is his name—is a jealous God.'''
    reason: lexical_alternative
  - marker: c
    text: '''Jealous'' here expresses the LORD''s exclusive covenant claim on his people''s worship, not sinful envy.'
    reason: cultural_note
translation:
  language: ko
  text: 너는 다른 신에게 절하지[a] 말아야 합니다. 야훼의 이름은 ‘질투’이시며[b], 야훼는 질투하시는[c] 하나님이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘엎드리다/몸을 굽히다’입니다. 여기서는 흔히 예배 행위로 나타나는 절하는 자세를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼—질투는 그의 이름이시다—’라는 이름 선언 구조를 사용합니다.
    reason: source_note
  - marker: c
    text: ‘질투’는 죄된 시기심이 아니라, 자기 백성의 예배에 대한 하나님의 배타적 언약 요구를 뜻합니다.
    reason: theological_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  english_pob_choice: shall not bow down
  chosen_korean: 절하지 말아야 합니다
  alternatives_korean:
  - 엎드려 절하지 말아야 합니다
  - 숭배하지 말아야 합니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘몸을 굽혀 엎드리다’는 동작을 가리키므로, 현대 한국어에서는 예배 행위를 함축하되 행위성을 살린 ‘절하다’로 옮겼습니다.
- source_word: לְאֵל אַחֵר
  english_pob_choice: to another god
  chosen_korean: 다른 신
  alternatives_korean:
  - 다른 하나님
  - 외래 신
  lexicon: HALOT
  rationale: אֵל אַחֵר는 직역하면 ‘다른 신’이므로 가장 직접적으로 옮겼습니다. ‘하나님’은 여기서 배타적 참하나님과 구분되는 우상적 대상까지 넓게 가리키기에는 덜 적합합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 여호와 대신 고유명사 음역을 유지하여 언약의 이름을 드러냈습니다. 본문이 제목이 아니라 신적 이름을 말하므로 ‘주’로 바꾸지 않았습니다.
- source_word: קַנָּא
  english_pob_choice: Jealous / jealous
  chosen_korean: 질투이시며 / 질투하시는
  alternatives_korean:
  - 열심이시며 / 열심을 내시는
  - 투기하시는
  lexicon: HALOT
  rationale: 문맥상 이는 배타적 언약 충성을 요구하는 하나님의 성품을 가리키므로, EN POB의 ‘jealous’를 따라 ‘질투’로 옮겨 그 긴장을 보존했습니다. 문장 앞의 ‘이름이 질투’는 명칭적 용법을, 뒤의 ‘질투하시는 하나님’은 성품 설명을 반영합니다.
theological_decisions:
- issue: קַנָּא를 하나님의 이름과 성품으로 함께 제시하는 방식
  chosen_reading: ‘이름이 질투이시며’와 ‘질투하시는 하나님이십니다’를 둘 다 유지해, 이름-표현과 성품 진술의 이중 구조를 드러냈습니다.
  alternative_readings:
  - ‘이름은 질투이시며’
  - ‘열심이시며/열심하신 하나님’
  rationale: 히브리어는 ‘야훼, 질투는 그의 이름이시다—그는 질투하시는 하나님이시다’라는 반복 구조를 취하므로, 한쪽만 부드럽게 바꾸면 수사적 강도가 약해집니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
