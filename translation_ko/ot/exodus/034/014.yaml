  source_fidelity: 첫 문장은 תשתחוה의 구체적인 몸짓과 다른 신이라는 대상을 대체로 충실히 옮겼습니다. 그러나 후반부는 히브리어의 ‘야훼—그의 이름은 질투—그는 질투하시는 하나님’이라는 이름 선언과 진술의 구조가 ‘야훼께서는 이름이 질투이시며’로 불분명해졌고, 앞의 כִּי가 제시하는 이유의 연결도 드러나지 않습니다.
  naturalness: ‘야훼께서는 이름이 질투이시며’는 현대 표준 한국어에서 소유 관계와 문장 성분이 어색합니다. ‘야훼의 이름은 “질투”이시며’로 하면 이름 선언이 명료해지고, ‘…때문입니다’로 앞 절과의 인과 관계도 자연스럽게 연결됩니다.
  terminology: ‘야훼’, ‘다른 신’, ‘절하다’, ‘질투’는 원문의 핵심 용어와 영어 POB의 선택을 적절히 반영합니다. ‘질투’의 명칭적 용법은 인용 부호로 표시하여 일반 감정어와 구별하되, 뒤의 형용사적 용법은 그대로 유지합니다.
