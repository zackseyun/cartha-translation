id: EXO.34.22
reference: Exodus 34:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חַ֤ג שָׁבֻעֹת֙ תַּעֲשֶׂ֣ה לְ/ךָ֔ בִּכּוּרֵ֖י קְצִ֣יר חִטִּ֑ים וְ/חַג֙ הָֽ/אָסִ֔יף תְּקוּפַ֖ת הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
  footnotes:
  - marker: a
    text: Or, 'at the end of the year.' The Hebrew phrase literally refers to the year's turning or cycle.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 밀 수확의 첫 소출의 절기인 칠칠절과 한 해가 바뀌는 때의 수장절을 지켜야 합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 해의 끝에.’ 히브리어 표현은 문자적으로 한 해의 전환 또는 순환을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג שָׁבֻעֹת
  english_pob_choice: the Feast of Weeks
  chosen_korean: 칠칠절
  alternatives_korean:
  - 주간의 명절
  - 주의 명절
  lexicon: HALOT
  rationale: שָׁבֻעֹת은 문자적으로 ‘주간들’/‘칠칠’의 절기를 가리키므로, 본문 의미를 투명하게 드러내는 전통적 명칭인 ‘칠칠절’을 택했습니다.
- source_word: תַּעֲשֶׂה לְךָ
  english_pob_choice: you shall observe for yourself
  chosen_korean: 자신을 위해 … 지켜야 합니다
  alternatives_korean:
  - 지켜야 합니다
  - 행해야 합니다
  - 지켜야 합니다
  lexicon: HALOT
  rationale: חג와 함께 쓰인 עשה는 ‘절기를 지키다/준수하다’의 관용적 표현이므로 ‘지키다’로 옮기되, לְךָ의 ‘너를 위해/자기 몫으로’라는 뉘앙스를 반영했습니다.
- source_word: בִּכּוּרֵי קְצִיר חִטִּים
  english_pob_choice: the firstfruits of the wheat harvest
  chosen_korean: 밀 수확의 첫 소출
  alternatives_korean:
  - 밀 수확의 첫 열매
  - 밀 추수의 첫 소출
  lexicon: HALOT
  rationale: בִּכּוּרִים은 첫 생산물, 곧 제물로 드려지는 첫 소출을 뜻하므로 ‘첫 소출’이 가장 자연스럽고, קְצִיר חִטִּים은 문맥상 ‘밀 수확’으로 간명하게 옮겼습니다.
- source_word: חַג הָאָסִיף
  english_pob_choice: the Feast of Ingathering
  chosen_korean: 추수의 명절
  alternatives_korean:
  - 거둬들임의 명절
  - 모음의 명절
  lexicon: HALOT
  rationale: הָאָסִיף는 추수물을 거두어들이는 절기를 가리키므로, 한국어로는 의미가 직접 드러나는 ‘추수의 명절’이 가장 자연스럽습니다.
- source_word: תְּקוּפַת הַשָּׁנָה
  english_pob_choice: at the turn of the year
  chosen_korean: 해가 바뀌는 때
  alternatives_korean:
  - 한 해의 끝에
  - 연말에
  - 해의 순환 때에
  lexicon: HALOT
  rationale: תְּקוּפָה는 단순한 ‘연말’보다 해의 순환·전환을 가리키므로, POB의 문맥을 따라 ‘해가 바뀌는 때’로 옮겨 절기의 계절적 전환을 살렸습니다.
theological_decisions:
- issue: 절기 명칭을 후대 교회식 번역으로 바꿀지 여부
  chosen_reading: ‘칠칠절’과 ‘추수의 명절’을 유지해 히브리어 절기 체계를 그대로 드러냈습니다.
  alternative_readings:
  - ‘오순절’
  - ‘추수감사절’
  rationale: 본문은 이스라엘의 절기 규정을 말하므로, 후대 기독교적 명칭보다 원문에 있는 절기 이름을 직접 반영하는 편이 의미를 더 정확히 전달합니다.
  doctrine_reference: 출애굽기 34장의 언약-절기 규정
