id: EXO.34.29
reference: Exodus 34:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/רֶ֤דֶת מֹשֶׁה֙ מֵ/הַ֣ר סִינַ֔י וּ/שְׁנֵ֨י לֻחֹ֤ת הָֽ/עֵדֻת֙ בְּ/יַד מֹשֶׁ֔ה בְּ/רִדְתּ֖/וֹ מִן הָ/הָ֑ר וּ/מֹשֶׁ֣ה לֹֽא יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖י/ו בְּ/דַבְּר֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
  footnotes:
  - marker: a
    text: Or 'shone' or 'sent out rays'; the Hebrew verb can denote emitting rays. The traditional rendering 'was horned' is preserved here as a historical alternative but does not fit the context as well.
    reason: lexical_alternative
  - marker: b
    text: That is, with the LORD.
    reason: alternative_reading
  - marker: c
    text: 'The phrase ''because he had spoken with him'' may also be understood temporally: ''when he spoke with him.'''
    reason: alternative_reading
translation:
  language: ko
  text: 모세가 시내 산에서 내려올 때, 곧 증거의 두 돌판이 모세의 손에 들려 있고 그가 산에서 내려올 때, 모세는 야훼와 말하였으므로 자기 얼굴의 피부가 빛나고 있는 줄 알지 못하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘뿔이 났다’도 가능하지만, 문맥상 의미는 얼굴이 빛났다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 야훼를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: ~할 때
  alternatives_korean:
  - 그리고 이런 일이 있었습니다
  - 일어났습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서사 도입 기능을 한국어에서는 자연스러운 시간 부사절로 풀어, 옛말투 없이 장면 전환을 살렸습니다.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  english_pob_choice: the two tablets of the testimony
  chosen_korean: 증거의 두 돌판
  alternatives_korean:
  - 증언의 두 판
  - 언약의 두 돌판
  lexicon: HALOT
  rationale: לֻחֹת는 ‘돌판’이 적절하고, הָעֵדֻת는 이 문맥에서 언약적 ‘증거’를 가리키므로 기존 POB의 ‘testimony’를 한국어로 직접 옮겼습니다.
- source_word: קָרַן
  english_pob_choice: shone / was radiant
  chosen_korean: 빛나고 있는
  alternatives_korean:
  - 광채가 나고 있는
  - 빛을 발하고 있는
  - 뿔이 난
  lexicon: HALOT
  rationale: 문맥상 모세의 얼굴에서 나오는 광휘를 뜻하므로 ‘빛나다’로 옮겼고, 역사적으로 영향력이 있었던 ‘뿔이 난’은 문맥에 맞지 않아 배제했습니다.
- source_word: עוֹר פָּנָיו
  english_pob_choice: the skin of his face
  chosen_korean: 자기 얼굴의 피부
  alternatives_korean:
  - 얼굴
  - 얼굴의 피부
  lexicon: HALOT
  rationale: 히브리어가 단순히 ‘얼굴’이 아니라 ‘얼굴의 피부’를 말하므로, 감각적·구체적 표현을 유지했습니다.
- source_word: בְּדַבְּר֥וֹ אִתּֽוֹ
  english_pob_choice: because he had spoken with him
  chosen_korean: 야훼와 말하였으므로
  alternatives_korean:
  - 그와 말하였으므로
  - 그에게 말씀하셨으므로
  lexicon: HALOT
  rationale: 원문은 모세가 ‘그와’ 말한 것을 가리키지만, 문맥상 그가 야훼와 대화한 것입니다. 한국어 본문에서는 의미를 분명히 하되, 히브리어의 대화 관계를 반영했습니다.
theological_decisions:
- issue: 이사야적/출애굽기적 신현 후 모세 얼굴의 상태를 어떻게 표현할 것인가
  chosen_reading: 빛남으로 표현하여 야훼와의 만남이 남긴 가시적 광휘를 드러냅니다.
  alternative_readings:
  - 뿔이 남
  - 광채가 남
  rationale: 앞 문맥과 다음 문맥이 모두 모세에게 나타난 영광의 표지를 전제로 하므로, 오해를 낳는 전통적 오독보다 본문 의미를 우선했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: אִתּוֹ의 지시 대상을 본문에 명시할지 여부
  chosen_reading: 본문에는 ‘야훼와’로 명시해 독자가 지시 대상을 즉시 알 수 있게 했습니다.
  alternative_readings:
  - ‘그와’로 남김
  - 각주로만 설명
  rationale: 히브리어는 대명사를 쓰지만 문맥상 지시 대상이 야훼임이 분명하므로, 한국어 가독성을 위해 본문에서 명시했습니다.
  doctrine_reference: Translation philosophy §1
