- from: 모세가 시내 산에서 내려올 때, 곧 증거의 두 돌판이 모세의 손에 들려 있고 그가 산에서 내려올 때, 모세는 야훼와 말하였으므로 자기 얼굴의 피부가 빛나고 있는 줄 알지 못하였습니다.[a][b]
  to: 모세가 시내 산에서 내려올 때에 이런 일이 있었습니다. 증거의 두 돌판을 모세의 손에 들고 산에서 내려오던 모세는, 그와[b] 말씀을 나누었기 때문에[c] 자기 얼굴의 피부가 빛나고 있다는 것을 알지 못하였습니다.[a]
  rationale: 원문의 서사 도입과 하강의 반복을 자연스러운 한국어로 재구성했습니다. 원문에 없는 신명 명시는 제거하여 대명사의 표현을 보존했고, 문맥상 분명한 지시 대상은 각주에서 밝혔습니다. 빛남의 의미와 마지막 구문의 시간적 대안도 각주로 제시하여 어휘·문법적 여지를 보존했습니다.
