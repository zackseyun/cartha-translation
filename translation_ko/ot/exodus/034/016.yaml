translation:
  language: ko
  text: 그의 딸들 가운데서 네 아들들을 위하여 아내로 맞이하게 되면, 그 딸들이 자기들의 신들을 따라 음행하고[a], 네 아들들도 자기들의 신들을 따라 음행하게 할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘매춘 행위를 하다’, ‘창녀 노릇을 하다’. 히브리어는 다른 신들을 따르는 일을 성적 불충실의 언어로 비유합니다.
    reason: lexical_alternative
  - marker: b
    text: 곧 그 딸들이 네 아들들을 자기들의 신들을 따르도록 이끌어 우상숭배에 빠지게 한다는 뜻입니다.
    reason: cultural_note
