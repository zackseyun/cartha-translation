  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어의 복수형 ‘처음 판들’(הַלֻּחֹת הָרִאשֹׁנִים)을 ‘첫 번째 판들’로 옮긴 표현은 다소 부자연스럽고, 각주 표지가 해당 어휘가 아닌 인용문 끝에 함께 놓여 있어 주석의 연결 대상이 불분명합니다.
  naturalness: ‘처음 것과 같이’보다 ‘처음 것들과 같은’이 복수 선행사를 더 자연스럽게 반영합니다. 또한 현대 표준어 합쇼체에 맞추어 직접 인용문의 명령과 약속을 ‘만드십시오/쓰겠습니다’로 통일하고, 인용부호 밖의 마침표를 제거했습니다.
