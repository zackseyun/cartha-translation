  text: 그때 야훼께서 모세에게 말씀하셨습니다. “너를 위하여 처음 것들과 같은 돌판 두 개를[a] 깎아 만드십시오[b]. 내가 그 돌판들 위에 네가 깨뜨린 처음 돌판들 위에 있던 말들을 쓰겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘돌로 된 두 판’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘깎아 만들다’는 히브리어 פְּסָל의 제작·가공 동작을 현대 한국어로 옮긴 것입니다.
    reason: lexical_alternative
