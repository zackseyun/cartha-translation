base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''two tablets of stone.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'Carve' or 'Hew' for yourself two stone tablets like the first ones.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. 「너를 위해 돌로 된 두 판을 처음 것과 같이 깎아 만들라. 그러면 내가 그 판들 위에, 네가 깨뜨린 첫 번째 판들 위에 있었던 그 말들을 쓰겠습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘돌로 된 두 판’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘깎아 만들라’는 히브리어 פְּסָל의 제작·가공 동작을 현대 한국어로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 원문의 신명기적 고유명사를 유지하기 위해 전통적 대체어보다 음역형 ‘야훼’를 사용했습니다.
- source_word: פְּסָל
  english_pob_choice: Cut
  chosen_korean: 깎아 만들라
  alternatives_korean:
  - 자르라
  - 새기라
  - 다듬어 만들라
  lexicon: HALOT
  rationale: 돌판을 준비하는 조각/가공의 동작을 현대 한국어에서 가장 자연스럽게 드러내면서도 아로새김이 아닌 제작 행위를 반영했습니다.
- source_word: לֻחֹת אֲבָנִים
  english_pob_choice: two stone tablets
  chosen_korean: 돌로 된 두 판
  alternatives_korean:
  - 두 돌판
  - 석판 두 개
  lexicon: HALOT
  rationale: ‘판들’의 물성을 살리되, 현대 한국어에서 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: הַדְּבָרִים
  english_pob_choice: the words
  chosen_korean: 그 말들
  alternatives_korean:
  - 그 말씀들
  - 그 계명들
  - 그 문장들
  lexicon: HALOT
  rationale: 원문이 ‘계명’이 아니라 일반 명사 ‘말들’이므로, 해석을 덧입히지 않도록 직역에 가깝게 처리했습니다.
theological_decisions:
- issue: 야훼의 음성 속 명령문 어조
  chosen_reading: 직접 인용 안에서 명령형을 유지해, 모세에게 주시는 즉각적 지시를 분명히 드러냈습니다.
  alternative_readings:
  - 완곡한 청유형으로 바꾸는 방식
  - 설명체로 풀어 쓰는 방식
  rationale: 히브리어 명령문은 단순 권고가 아니라 구체적 수행 지시이므로, 한국어에서도 명령의 강도를 유지하는 것이 원문 의도를 더 잘 보존합니다.
  doctrine_reference: 출애굽기 34장 문맥의 언약 갱신과 모세에게 주시는 직접 명령
