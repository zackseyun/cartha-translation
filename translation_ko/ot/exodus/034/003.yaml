base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
  footnotes:
  - marker: a
    text: Or 'must not appear anywhere on the mountain.' The Hebrew verb can mean either 'be seen' or 'appear' in this passive/reflexive form.
    reason: lexical_alternative
  - marker: b
    text: '''Man'' here is grammatically masculine in Hebrew but functions generically for any human being.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신과 함께 올라갈 사람은 아무도 없으며, 온 산 어디에서도 아무도 보이지 않게 하십시오. 또한 양 떼와 소 떼도 그 산 앞에서 풀을 뜯지 못하게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 אַל יֵרָא는 수동/반사적 형태로 ‘보이지 않다’ 또는 ‘나타나다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람’에 해당하는 히브리어는 문법상 남성형이지만, 여기서는 모든 사람에게 적용되는 일반적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ לֹא יַעֲלֶה עִמָּךְ
  english_pob_choice: And no man shall go up with you
  chosen_korean: 당신과 함께 올라갈 사람은 아무도 없으며
  alternatives_korean:
  - 당신과 함께 올라갈 사람이 없으며
  - 사람은 아무도 당신과 함께 올라가지 못하며
  lexicon: HALOT
  rationale: אִישׁ의 남성형이지만 여기서는 보편적 금지로 기능하므로, ‘사람은 아무도’보다 자연스럽고 원형의 성별 표지를 과도하게 지우지 않는 ‘올라갈 사람은 아무도’로 옮겼습니다.
- source_word: וְגַם אִישׁ אַל יֵרָא בְּכָל הָהָר
  english_pob_choice: and indeed no man shall be seen anywhere on the mountain
  chosen_korean: 온 산 어디에서도 아무도 보이지 않게 하십시오
  alternatives_korean:
  - 그리고 또한 아무도 온 산에서 보이지 않게 하십시오
  - 온 산 어디에서도 아무도 나타나지 않게 하십시오
  lexicon: HALOT
  rationale: וְגַם의 강조를 ‘그리고 또한’보다 더 강하게 반영하고, נִרְאֶה의 수동/반사적 의미를 한국어 자연문으로 살려 ‘보이지 않게 하십시오’로 옮겼습니다.
- source_word: הַצֹּאן וְהַבָּקָר
  english_pob_choice: the flock and the herd
  chosen_korean: 양 떼와 소 떼
  alternatives_korean:
  - 양과 소
  - 가축 떼와 소 떼
  lexicon: HALOT
  rationale: 두 집합명사는 가축 범주의 관용적 병렬이므로, 구체성과 리듬을 살리는 ‘양 떼와 소 떼’가 가장 적절합니다.
- source_word: אֶל מוּל הָהָר הַהוּא
  english_pob_choice: in front of that mountain
  chosen_korean: 그 산 앞에서
  alternatives_korean:
  - 그 산 앞에
  - 그 산 맞은편에서
  lexicon: HALOT
  rationale: אֶל מוּל은 공간적으로 ‘앞/맞은편’을 뜻하므로, 본문 문맥에서 가장 자연스러운 ‘그 산 앞에서’로 옮겼습니다.
theological_decisions:
- issue: 금지문과 허용문 분리
  chosen_reading: 첫 절은 ‘함께 올라감’과 ‘산 위에 보임’을 별개의 금지로 구분하여 번역했습니다.
  alternative_readings:
  - 두 표현을 하나의 일반적 금지로 합치는 번역
  - ‘보이지 않게 하십시오’ 대신 ‘보여지지 않게 하십시오’
  rationale: 히브리어는 וְאִישׁ לֹא יַעֲלֶה עִמָּךְ와 וְגַם אִישׁ אַל יֵרָא를 별도 진술로 나누어 강조합니다. 이를 합치면 금지의 단계적 강도가 약해집니다.
  doctrine_reference: 본문의 명령 구조와 수사적 강조
