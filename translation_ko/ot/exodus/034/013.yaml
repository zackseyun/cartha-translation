  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
  footnotes:
  - marker: a
    text: Or 'For you shall tear down their altars…' The Hebrew conjunction can also be rendered 'for,' but here it functions naturally in context as a contrastive continuation after the previous prohibition.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their Asherah poles'; alternatively, 'their Asherim.' The term refers to cult objects associated with Asherah.
    reason: alternative_reading
translation:
  language: ko
  text: 대신[a], 너희는 그들의 제단을 허물고, 그들의 기둥을 부수며, 그들의 아세라 목상을 베어 버려야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희는 그들의 제단을 허물어야 하니…’로도 옮길 수 있습니다. 히브리어 연결사는 문맥에 따라 ‘왜냐하면’으로도 번역될 수 있지만, 여기서는 앞선 금지에 이어지는 대조적 진행을 자연스럽게 나타냅니다.
    reason: lexical_alternative
