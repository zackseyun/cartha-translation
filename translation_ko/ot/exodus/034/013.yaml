  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
  footnotes:
  - marker: a
    text: Or 'For you shall tear down their altars…' The Hebrew conjunction can also be rendered 'for,' but here it functions naturally in context as a contrastive continuation after the previous prohibition.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their Asherah poles'; alternatively, 'their Asherim.' The term refers to cult objects associated with Asherah.
    reason: alternative_reading
translation:
  language: ko
  text: 대신[a], 너희는 그들의 제단을 허물고, 그들의 돌기둥을 부수고, 그들의 아세라 기둥들을 베어 버려야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희는 그들의 제단을 허물어야 하니 …’로 옮길 수 있습니다. 히브리어 연결사는 ‘왜냐하면’으로도 번역될 수 있으나, 여기서는 앞선 금지에 이어 그 대신 해야 할 일을 제시하는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 아세라들’입니다. 아세라는 여신 아세라와 관련된 제의물을 가리키며, 그 정확한 형태는 확실하지 않습니다. ‘아세라 기둥들’은 가능한 번역입니다.
    reason: alternative_reading
