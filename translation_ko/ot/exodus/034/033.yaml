  text: וַ/יְכַ֣ל מֹשֶׁ֔ה מִ/דַּבֵּ֖ר אִתָּ֑/ם וַ/יִּתֵּ֥ן עַל פָּנָ֖י/ו מַסְוֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/033.yaml
  text: When Moses finished speaking with them[a], he put a veil over his face.
  footnotes:
  - marker: a
    text: Or 'ceased speaking with them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 그들과 말하기를 마치자, 자기 얼굴 위에 수건을 썼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל מֹשֶׁה מִדַּבֵּר
  english_pob_choice: When Moses finished speaking
  chosen_korean: 모세가 그들과 말하기를 마치자
  alternatives_korean:
  - 모세가 그들과 말하기를 그치자
  - 모세가 그들과 말하는 것을 끝내자
  lexicon: HALOT
  rationale: כלה + דבר의 완료 의미를 한국어의 자연스러운 시간 절로 옮기되, ‘말하기를 마치다’가 원문의 행동 완료를 가장 직접적으로 드러냅니다.
- source_word: אִתָּם
  english_pob_choice: with them
  chosen_korean: 그들과
  alternatives_korean:
  - 그들에게
  - 그들하고
  lexicon: HALOT
  rationale: את + 대명사 접미사는 기본적으로 ‘~와 함께’의 관계이므로, 문맥상 자연스러운 복수 목적 격 ‘그들과’로 옮겼습니다.
- source_word: וַיִּתֵּן עַל פָּנָיו מַסְוֶה
  english_pob_choice: he put a veil over his face
  chosen_korean: 자기 얼굴 위에 수건을 썼습니다
  alternatives_korean:
  - 자기 얼굴 위에 너울을 덮었습니다
  - 자기 얼굴에 베일을 둘렀습니다
  lexicon: HALOT
  rationale: נתן + על은 ‘~위에 두다/놓다’의 의미이고, מַסְוֶה는 얼굴을 가리는 천이므로 한국어로 기능을 살려 ‘수건을 쓰다’로 표현했습니다.
theological_decisions:
- issue: Moses의 얼굴 가리개를 어떻게 한국어로 전달할지
  chosen_reading: ‘수건’으로 옮겨 얼굴을 가리는 실제 도구와 기능을 간명하게 드러냈습니다.
  alternative_readings:
  - ‘너울’로 옮겨 전통적 성경어를 따를 수 있습니다.
  - ‘베일’로 음역하면 외형을 더 직접적으로 보존할 수 있습니다.
  rationale: 본문은 모세의 얼굴을 가리는 행위를 서술하므로, 장식적 어휘보다 기능이 분명한 표현이 본문의 효과를 더 잘 전달합니다.
  doctrine_reference: 출애굽기 34장의 문맥적 서술
- issue: ‘말하기를 마치자’의 시간 관계
  chosen_reading: 모세가 말을 끝낸 뒤 가리개를 썼다는 순서를 분명히 했습니다.
  alternative_readings:
  - ‘말하기를 그치자’는 더 중립적일 수 있습니다.
  - ‘말하는 것을 끝내자’는 구조를 더 문자적으로 보존합니다.
  rationale: wayyiqtol 연쇄가 나타내는 순차적 사건 진행을 한국어에서도 자연스럽게 보존하기 위해 완료 후속 동작으로 옮겼습니다.
  doctrine_reference: 히브리어 서사체의 순차 동작
