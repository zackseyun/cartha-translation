translation:
  language: ko
  text: 태에서 처음 난 것은 모두 내 것이며[a], 네 가축 가운데 수컷으로 태어난 모든 첫새끼[b][c], 곧 소와 양의 첫새끼도 내 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘태를 여는 것’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내게 속한 것이다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 표현은 가축 가운데 수컷인 첫새끼를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  english_pob_choice: Every firstborn of the womb
  chosen_korean: 모든 태에서 처음 난 것
  alternatives_korean:
  - 모든 태를 여는 것
  - 모든 태의 첫새끼
  lexicon: HALOT
  rationale: 히브리어 관용구 פֶּטֶר רֶחֶם의 직역적 이미지(‘태를 여는 것’)를 살리되, 한국어에서는 법규 문맥에 자연스럽고 이해 가능한 ‘태에서 처음 난 것’으로 옮겼습니다.
- source_word: לִי
  english_pob_choice: is mine
  chosen_korean: 내 것이며
  alternatives_korean:
  - 내 소유이며
  - 나에게 속하며
  lexicon: HALOT
  rationale: 야훼의 소유권/권리 주장을 단순한 소속보다 분명하게 드러내는 표현으로 ‘내 것’이 가장 직접적입니다.
- source_word: תִּזָּכָר פֶּטֶר שׁוֹר וָשֶׂה
  english_pob_choice: every male firstborn among your livestock, whether ox or sheep
  chosen_korean: 네 가축 중의 모든 수컷 첫새끼, 곧 소이든 양이든
  alternatives_korean:
  - 네 가축 가운데 모든 수컷 첫새끼, 곧 소나 양
  - 네 가축의 모든 수컷 첫새끼, 즉 소와 양
  lexicon: HALOT
  rationale: 문맥상 ‘기억되다’의 동사 형태를 그대로 살리기보다, 법규가 요구하는 대상이 ‘수컷 첫새끼’임을 분명히 하는 번역이 원문의 기능을 더 잘 전달합니다.
- source_word: וָשֶׂה
  english_pob_choice: whether ox or sheep
  chosen_korean: 곧 소이든 양이든
  alternatives_korean:
  - 즉 소나 양이든
  - 소이든 양이든
  lexicon: HALOT
  rationale: פֶּטֶר שׁוֹר וָשֶׂה는 대표적인 가축 범주를 덧붙여 구체화하므로, ‘곧’으로 설명적 동격을 살렸습니다.
theological_decisions:
- issue: 첫새끼에 대한 소유권 진술
  chosen_reading: 본문은 첫 태생의 동물에 대한 야훼의 소유권 주장을 직접적으로 말하며, 이를 본문 이상으로 확장하지 않았습니다.
  alternative_readings:
  - 봉헌 명령을 더 분명히 드러내는 해석
  - 희생 제물 자격만을 뜻하는 해석
  rationale: 히브리어의 לִי는 여기서 소유/귀속의 법적 진술로 충분하므로, 본문에 없는 추가 설명을 본문 속으로 끌어오지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
