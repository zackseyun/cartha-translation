  - ‘여호와’로 음역
  rationale: 본문이 하나님의 언약적 이름을 직접 사용하므로, 이를 호칭어로 바꾸지 않고 ‘야훼’로 표기해 원문이 드러내는 인격적 이름을 보존했습니다.
