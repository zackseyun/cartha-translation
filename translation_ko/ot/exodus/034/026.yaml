translation:
  language: ko
  text: 당신 땅에서 난 첫 소산 가운데 첫 몫을 당신의 하나님 야훼의 집으로 가져와야 합니다.[a] 새끼 염소를 그 어미의 젖에 삶아서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘당신 땅의 첫 소산 가운데 첫째 것’이라고 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁ֗ית
  english_pob_choice: the first of / the best of the firstfruits
  chosen_korean: 첫
  alternatives_korean:
  - 가장 좋은
  - 처음 맺힌
  lexicon: HALOT
  rationale: 이 결합은 단순한 순서뿐 아니라 첫 몫이라는 우선성을 나타내므로, 한국어에서는 ‘첫’으로 간결하게 살리되 뒤의 ‘첫 열매’와 함께 중복 없이 자연스럽게 옮겼습니다.
- source_word: בִּכּוּרֵי
  english_pob_choice: the firstfruits
  chosen_korean: 첫 열매
  alternatives_korean:
  - 처음 난 소출
  - 초실
  lexicon: HALOT
  rationale: 제의적 용어이지만 현대 한국어에서 바로 이해되도록 ‘첫 열매’를 택해, 첫 수확을 하나님께 드리는 의미를 분명히 했습니다.
- source_word: בֵּית יְהוָה אֱלֹהֶי/ךָ
  english_pob_choice: the house of Yahweh your God
  chosen_korean: 야훼 너희 하나님의 집
  alternatives_korean:
  - 야훼 너희 하나님의 성전
  - 주 너희 하나님의 집
  lexicon: HALOT
  rationale: 예배 처소를 가리키는 직역 구조를 유지하되, יְהוָה는 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다. ‘성전’은 출애굽기의 시점에서 지나치게 특정화될 수 있습니다.
- source_word: לֹא תְבַשֵּׁל גְּדִי בַּחֲלֵב אִמּוֹ
  english_pob_choice: You shall not boil a young goat in its mother's milk
  chosen_korean: 새끼 염소를 어미의 젖에 삶아서는 안 됩니다
  alternatives_korean:
  - 새끼 염소를 어미 젖으로 삶아서는 안 됩니다
  - 어미의 젖으로 새끼 염소를 삶아서는 안 됩니다
  lexicon: HALOT
  rationale: תְבַשֵּׁל은 ‘삶다/끓이다’의 금지이므로 ‘삶아서는 안 됩니다’로 직접적으로 옮겼고, בַּחֲלֵב אִמּוֹ는 자연스러운 한국어로 ‘어미의 젖에’라고 하여 이미지와 금지의 충격을 그대로 살렸습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 고유명사 ‘야훼’로 유지했습니다.
  alternative_readings:
