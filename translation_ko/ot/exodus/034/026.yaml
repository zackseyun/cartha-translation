  naturalness: ‘첫 소산의 첫 열매’는 ‘소산’과 ‘열매’가 중복되고, 소산을 과실로 좁혀 들리게 할 수 있습니다. ‘땅에서 난 첫 소산 가운데 첫 몫’은 현대 한국어로 자연스러우면서도 경작지의 생산물을 포괄합니다. 합쇼체의 법규적 문체는 ‘가져와야 합니다/삶아서는 안 됩니다’로 일관되게 유지했습니다.
