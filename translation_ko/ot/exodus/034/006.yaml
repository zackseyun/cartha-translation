id: EXO.34.6
reference: Exodus 34:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
  footnotes:
  - marker: a
    text: Or 'abounding in steadfast love and truth.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그때 야훼께서 그의 앞을 지나가시며 이렇게 선포하셨습니다[a]: “야훼, 야훼, 긍휼이 많으시고 은혜로우시며, 노하기를 더디하시고, 인자와 신실하심이 풍성하신 하나님이십니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인자와 진실이 풍성하신’.
    reason: אֱמֶת는 이 결합에서 하나님의 신실하심을 뜻할 수 있으나, ‘진실’ 또는 ‘진리’라는 어휘적 의미도 가능합니다.
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 고유명사(야훼), 출애굽기 34:6 문맥
  rationale: 언약 이름 יְהוָה를 칭호로 대체하지 않고 음역하여, 본문이 드러내는 하나님의 고유한 이름을 살렸습니다.
- source_word: וַיַּעֲבֹר עַל פָּנָיו
  english_pob_choice: passed before him
  chosen_korean: 그의 앞을 지나가시며
  alternatives_korean:
  - 그 앞을 지나가시며
  - 그의 앞에서 지나가시며
  lexicon: HALOT
  rationale: עבר의 ‘지나가다’와 עַל פָּנָיו의 공간적 관계를 자연스러운 현대 한국어로 옮겨, 단순히 스쳐 지나감이 아니라 ‘그의 앞을 지나감’이라는 장면을 보존했습니다.
- source_word: וַיִּקְרָא
  english_pob_choice: proclaimed
  chosen_korean: 선포하셨습니다
  alternatives_korean:
  - 외치셨습니다
  - 선언하셨습니다
  lexicon: HALOT
  rationale: 하나님의 자기 계시가 담긴 공적인 발표라는 점을 살려, 단순한 ‘부르다’보다 격식 있고 공개적인 ‘선포하다’를 택했습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인자
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 자비
  lexicon: HALOT
  rationale: חֶסֶד은 언약적 충실성과 인애를 함께 담는 말이므로, 한국 교회 전통과 어감이 연결되는 ‘인자’를 사용하되 지나치게 단순한 ‘자비’로 좁히지 않았습니다.
- source_word: אֱמֶת
  english_pob_choice: faithfulness
  chosen_korean: 진실
  alternatives_korean:
  - 신실하심
  - 성실
  - 진리
  lexicon: HALOT
  rationale: 문맥상 חסד와 짝을 이루는 하나님의 신뢰할 수 있음과 참됨을 함께 드러내기 위해 ‘진실’을 사용했습니다. 이는 영어 본문의 ‘faithfulness’와도 긴장을 유지하면서 연결됩니다.
theological_decisions:
- issue: Repeated divine name יְהוָה의 한국어 처리
  chosen_reading: “야훼, 야훼”로 반복을 그대로 살렸습니다.
  alternative_readings:
  - “주님, 주님”
  - “여호와, 여호와”
  rationale: 본문의 반복은 강조 기능이 있으므로 매끄럽게 바꾸지 않고, POB의 원칙에 따라 신적 고유명을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: חֶסֶד וֶאֱמֶת의 번역 긴장
  chosen_reading: ‘인자와 진실’
  alternative_readings:
  - ‘인자와 신실하심’
  - ‘언약적 사랑과 진실’
  rationale: 출애굽기 34:6의 고전적 짝을 유지하면서도, 한쪽을 과도하게 해석해 다른 쪽을 지워버리지 않도록 비교적 압축적인 한국어로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it; §5 Consistency of key terms, or documented exception
