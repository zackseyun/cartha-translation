  naturalness: 초안은 인용문이 ‘하나님’이라는 명사구로 끝나 현대 한국어의 완결된 선포문으로는 어색합니다. 서술격 높임말 ‘하나님이십니다’를 보충하고, 속성 서술의 높임 표현을 일관되게 조정하면 합쇼체 문체가 자연스럽습니다.
  terminology: ‘야훼’는 POB의 신명 음역 방침에 맞습니다. חֶסֶד는 ‘인자’로 유지할 수 있으며, 이 문맥의 אֱמֶת는 하나님의 신뢰성과 지속성을 나타내므로 본문에서는 ‘신실하심’이 적절합니다. ‘진실’은 가능한 어휘 대안으로 각주에 둡니다.
