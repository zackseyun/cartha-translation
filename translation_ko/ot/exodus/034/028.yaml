base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
  footnotes:
  - marker: a
    text: Or, 'and the LORD wrote,' since elsewhere the writing on the tablets is attributed to the LORD (see Exod 34:1; Deut 10:4).
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the ten words'; traditionally, 'the Ten Commandments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼와 함께 거기서 사십 일과 사십 밤을 있었으며, 빵을 먹지 않고 물도 마시지 않았습니다. 그리고 그는 돌판에 언약의 말씀, 곧 열 말씀을 기록했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 기록하셨다’로 옮길 수 있습니다. 돌판에 기록하신 분이 다른 곳에서는 야훼로 언급되기 때문입니다(출 34:1; 신 10:4).
    reason: alternative_reading
  - marker: b
    text: 히브리어로는 ‘열 말씀’입니다. 전통적으로는 ‘십계명’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 일관된 본문 원칙에 따라 신명은 음역형 ‘야훼’로 옮겨 원문 표지를 보존했습니다.
- source_word: לֶחֶם
  english_pob_choice: he ate no bread
  chosen_korean: 빵을 먹지 않고
  alternatives_korean:
  - 떡을 먹지 않고
  - 음식을 먹지 않고
  lexicon: HALOT
  rationale: 히브리어가 구체적으로 ‘빵’을 말하므로 일반화하지 않고 한국어의 자연스러운 대응어 ‘빵’을 사용했습니다.
- source_word: וּמַיִם לֹא שָׁתָה
  english_pob_choice: and drank no water
  chosen_korean: 물도 마시지 않았습니다
  alternatives_korean:
  - 물을 마시지 않았습니다
  lexicon: HALOT
  rationale: 평행 구조를 살려 직역에 가깝게 옮기되, 한국어 문장 흐름에 맞게 ‘도’를 더해 앞절과의 대조를 분명히 했습니다.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  english_pob_choice: the ten words
  chosen_korean: 열 말씀
  alternatives_korean:
  - 열 마디
  - 십계명
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘열 말씀’을 본문에 두어 전통적 해석어 ‘십계명’으로 미리 풀어버리지 않았습니다.
theological_decisions:
- issue: וַיִּכְתֹּב의 주어와 돌판 기록의 귀속 문제
  chosen_reading: 본문은 표면 문법을 따라 ‘그는 기록했습니다’로 두어, 문맥상 바로 앞의 주어를 자연스럽게 따르되 주어 귀속의 긴장을 그대로 남겼습니다.
  alternative_readings:
  - ‘주님께서 기록하셨습니다’로 명시적으로 옮김
  - ‘그는 기록했습니다’로 두되 주어를 모호하게 유지함
  rationale: 출애굽기 34:1과 신명기 10:4는 돌판의 기록을 야훼께 돌리지만, 이 절의 가장 가까운 연속 문법은 모세를 주어로 읽게 합니다. 본문은 이 긴장을 조화시키지 않고 보존해야 하므로, 한국어 본문도 이를 그대로 반영했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
