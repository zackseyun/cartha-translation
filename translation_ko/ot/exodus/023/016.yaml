id: EXO.23.16
reference: Exodus 23:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חַ֤ג הַ/קָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔י/ךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּ/שָּׂדֶ֑ה וְ/חַ֤ג הָֽ/אָסִף֙ בְּ/צֵ֣את הַ/שָּׁנָ֔ה בְּ/אָסְפְּ/ךָ֥ אֶֽת מַעֲשֶׂ֖י/ךָ מִן הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
  footnotes:
  - marker: a
    text: Or 'festival' for 'feast' in both occurrences of חַג.
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'at the going out of the year.'
    reason: lexical_alternative
  - marker: c
    text: '''Ingathering'' refers to the festival marking the gathering of produce from the field.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 추수의 절기, 곧 네가 밭에 뿌린 것의 첫 열매인 네 소산의 첫 열매를 드리는 절기와, 해가 끝날 무렵 밭에서 네 소산을 거두어들일 때의 수장절을 지키라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘절기’는 כאן חג를 가리키며, 여기서는 농경 절기의 명칭으로 쓰였습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘해가 나감’ 또는 ‘해가 끝남’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘수장절’은 곡식과 수확물을 거두어 모으는 절기를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  english_pob_choice: Feast
  chosen_korean: 절기
  alternatives_korean:
  - 명절
  - 축제
  lexicon: HALOT
  rationale: חַג는 정해진 종교적 축제일을 가리키므로, 한국어에서는 자연스럽고 격식 있는 ‘절기’가 가장 잘 대응합니다.
- source_word: הַקָּצִיר / בִּכּוּרֵי מַעֲשֶׂיךָ
  english_pob_choice: Harvest, the firstfruits of your labors
  chosen_korean: 추수의 절기, 곧 네가 밭에 뿌린 것의 첫 열매인 네 소산의 첫 열매
  alternatives_korean:
  - 수확의 절기, 곧 네 일의 첫 열매인 첫 소출
  - 추수절, 곧 네가 뿌린 것의 첫 산물
  lexicon: HALOT
  rationale: הַקָּצִיר는 단순한 ‘거둠’보다 절기 이름으로서 ‘추수’가 자연스럽고, בִּכּוּרֵי는 예물적 뉘앙스를 살려 ‘첫 열매’로 옮겼습니다. מַעֲשֶׂיךָ는 이 농경 문맥에서 인간의 ‘일’ 자체보다 그 결과인 ‘소산’으로 드러나므로, POB의 ‘labors’ 취지를 살려 ‘네 소산’으로 풀었습니다.
- source_word: בְּצֵאת הַשָּׁנָה
  english_pob_choice: at the end of the year
  chosen_korean: 해가 끝날 무렵
  alternatives_korean:
  - 한 해가 끝날 때
  - 해의 끝에
  lexicon: HALOT
  rationale: 직역하면 ‘해가 나감/끝남’이지만, 현대 한국어에서는 절기 시점을 자연스럽게 드러내는 ‘해가 끝날 무렵’이 문맥상 가장 읽기 쉽습니다.
- source_word: הָאָסִף
  english_pob_choice: Ingathering
  chosen_korean: 수장절
  alternatives_korean:
  - 거두어 모으는 절기
  - 모음의 절기
  lexicon: HALOT
  rationale: POB의 ‘Ingathering’은 단순 행위가 아니라 절기명입니다. 한국어에서 이 농경 절기를 가리키는 전통적·공인된 표현인 ‘수장절’을 사용해 절기명으로서의 성격을 살렸습니다.
- source_word: בְּאָסְפְּךָ אֶת מַעֲשֶׂיךָ מִן הַשָּׂדֶה
  english_pob_choice: when you gather in your labors from the field
  chosen_korean: 밭에서 네 소산을 거두어들일 때
  alternatives_korean:
  - 밭에서 네 일의 결과를 거둘 때
  - 밭에서 네 수고를 모을 때
  lexicon: HALOT
  rationale: 동사 אסף는 ‘거두어들이다/모으다’의 실제 수확 행위를 뜻하므로 ‘거두어들일 때’가 적절합니다. מַעֲשֶׂיךָ는 여기서도 노동의 결과물인 ‘소산’으로 번역해 앞부분과 일관되게 했습니다.
theological_decisions:
- issue: 절기명과 농경 표현의 번역에서 전통 교회어 vs. 원문 밀착어 선택
  chosen_reading: 본문의 세 절기를 각각 ‘추수의 절기’, ‘첫 열매’, ‘수장절’로 구분해 원문의 농경·예배적 구분을 드러냈습니다.
  alternative_readings:
  - 추수절
  - 수확절
  - 모으는 절기
  rationale: 이 절은 단순한 농사 설명이 아니라 야훼께 드리는 절기 규정이므로, 한국어에서도 절기명과 예물 개념을 분리해 보여 주는 편이 원문의 의도를 더 잘 보존합니다.
  doctrine_reference: 출애굽기 23장 절기 규례
- issue: ‘해가 끝날 무렵’의 표현 선택
  chosen_reading: 직역적 문구 대신 시간적 의미를 자연스러운 현대어로 옮겼습니다.
  alternative_readings:
  - 한 해가 끝날 때
  - 해가 끝날 즈음
  rationale: 원문 표현의 핵심은 연말 시점이지, 천문학적·시적 이미지 자체가 아니므로 한국어 독자가 즉시 이해할 수 있는 시점 표현을 택했습니다.
  doctrine_reference: 성경 번역의 관용적 시간 표현
