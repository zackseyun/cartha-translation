revisions:
- from: 그리고 추수의 절기, 곧 네가 밭에 뿌린 것의 첫 열매인 네 소산의 첫 열매를 드리는 절기와, 해가 끝날 무렵 밭에서 네 소산을 거두어들일 때의 수장절을 지키라.[a][b][c]
  to: 또 네가 밭에 뿌린 것에서 난 네 수고의 산물 가운데 첫 열매를 위한 추수의 절기[a]와, 한 해가 끝날 때 밭에서 네 수고의 산물을 거두어들이는 수장절[c]을 지키십시오.[b]
  rationale: 중복된 ‘첫 열매’와 원문에 없는 ‘드리는’을 제거하고, 첫 절기는 첫 열매와 관련된 추수 절기로, 둘째 절기는 밭에서 산물을 거두어들이는 수장절로 명료하게 옮겼습니다. 원문의 명령이 앞 절에서 이어지는 통사적 구조이므로, 한국어에서는 자연스러운 완결을 위해 ‘지키십시오’를 유지했습니다. 각주 표지도 각각 ‘절기’, ‘한 해가 끝날 때’, ‘수장절’에 붙여 내용과 일치시켰습니다.
