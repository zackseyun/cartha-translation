source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
  footnotes:
  - marker: a
    text: 'Hebrew: ''before my face,'' an idiom meaning ''before me'' or ''in my presence.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'And none shall appear before me empty-handed.' The Hebrew shifts from second-person singular address to a third-person plural verb in this clause.
    reason: alternative_reading
translation:
  language: ko
  text: 무교절을 지키십시오. 내가 당신에게 명령한 대로 아빕월의 정해진 때에 칠 일 동안 누룩 없는 빵을 먹으십시오. 그 달에 당신은 이집트에서 나왔기 때문입니다. 그리고 아무도 빈손으로 내 앞에[a][b] 나와서는 안 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 얼굴 앞에’라고 합니다. 이는 ‘내 앞에’ 또는 ‘내 면전에서’라는 뜻의 관용 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 이 절에서 2인칭 단수에서 3인칭 복수로 바뀝니다. ‘아무도’는 이 복수형이 지닌 부정대명사적 의미를 자연스럽게 나타낸 번역입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  english_pob_choice: the Feast of Unleavened Bread
  chosen_korean: 무교절
  alternatives_korean:
  - 누룩 없는 빵의 절기
  - 무교병의 절기
  lexicon: HALOT
  rationale: 절기 이름으로 굳어진 표현을 살리되, ‘무교절’이 히브리어 חג/מַצּוֹת의 제의적 축제를 간결하게 전달합니다.
- source_word: תִּשְׁמֹר
  english_pob_choice: you shall keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 준수하십시오
  - 지켜야 합니다
  lexicon: HALOT
  rationale: 명령형 법문에서 שׁמר의 핵심인 ‘지키다/준수하다’를 자연스러운 합쇼체 명령으로 옮겼습니다.
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 누룩 없는 빵
  alternatives_korean:
  - 무교병
  - 무교절 빵
  lexicon: HALOT
  rationale: 의미를 바로 드러내는 현대어를 택해, 절기에서 먹는 것이 ‘누룩 없는 빵’임을 분명히 했습니다.
- source_word: חֹדֶשׁ הָאָבִיב
  english_pob_choice: the month of Abib
  chosen_korean: 아빕월
  alternatives_korean:
  - 아빕의 달
  - 새싹월
  lexicon: HALOT
  rationale: 달 이름으로 기능하는 표현이므로 음역해 고유한 달명으로 보존했습니다.
- source_word: פָנַי רֵיקָם
  english_pob_choice: before me empty-handed
  chosen_korean: 빈손으로 내 앞에
  alternatives_korean:
  - 빈손으로 내 앞에 나오지
  - 아무 제물도 없이 내 앞에
  lexicon: HALOT
  rationale: פנים의 관용적 의미를 따라 ‘내 앞에’로 옮기고, רֵיקָם은 제의적 맥락의 관용어인 ‘빈손으로’로 번역했습니다.
theological_decisions:
- issue: 마지막 절의 주어 처리
  chosen_reading: 아무도 빈손으로 내 앞에 나오지 못할 것입니다.
  alternative_readings:
  - 그들은 빈손으로 내 앞에 나오지 못할 것입니다.
  - 아무도 내 앞에 빈손으로 보이지 못할 것입니다.
  rationale: 히브리어가 3인칭 복수 형태를 쓰지만 금지의 뜻은 집합적·부정대명사적으로 이해하는 것이 자연스러워, 한국어에서는 ‘아무도’로 그 의미를 살렸습니다.
  doctrine_reference: 문법-의미 대응; POB 영어 재검토에서 확인된 복수/부정대명사 긴장을 한국어에서 자연스럽게 반영
