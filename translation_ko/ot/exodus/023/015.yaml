    issue: 각주 a의 표지가 ‘무교절’에 붙어 있으나, 각주 내용은 마지막 절의 פָנַי(‘내 얼굴/내 앞에’)에 관한 것입니다.
    rationale: 각주 표지는 설명 대상 어구에 직접 붙어야 합니다. 현재 위치는 독자가 ‘무교절’에 관한 히브리어 설명으로 오해하게 합니다.
