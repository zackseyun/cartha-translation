  to: 무교절을 지키십시오. 내가 당신에게 명령한 대로 아빕월의 정해진 때에 칠 일 동안 누룩 없는 빵을 먹으십시오. 그 달에 당신은 이집트에서 나왔기 때문입니다. 그리고 아무도 빈손으로 내 앞에[a][b] 나와서는 안 됩니다.
  rationale: 원문의 제의 명령, 칠 일의 기간, 아빕월의 정해진 때, 출애굽의 근거를 유지했습니다. 마지막 절은 히브리어의 3인칭 복수형과 법적 금지의 의미를 함께 살려 ‘아무도 … 나와서는 안 됩니다’로 옮겼습니다. 두 각주는 실제 설명 대상인 ‘내 앞에’에 함께 배치하고, 각주 a의 부자연스럽고 확장적인 ‘내 임재 안에서’ 표현을 원문의 관용 의미에 맞게 정리했습니다.
