  text: 너희는 너희 하나님 야훼를 섬겨야 합니다[a]. 그분은 너희의 양식[b]과 물에 복을 주실 것이며, 나는 너희 가운데서 질병을 없애겠습니다.
  philosophy: optimal-equivalence
  footnotes:
