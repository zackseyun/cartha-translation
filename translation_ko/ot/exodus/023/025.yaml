    text: ‘섬기다’는 이 문맥에서 하나님께 드리는 충성과 예배를 함께 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘양식’은 히브리어 ‘빵’이 더 넓게는 먹을 것과 공급 전체를 가리킬 수 있음을 반영합니다.
    reason: lexical_alternative
