  rationale: POB 주석처럼 לחם은 음식/공급을 넓게 가리킬 수 있으므로, 한국어 본문에서는 현대 독자가 즉시 이해할 수 있는 '양식'을 택하되 의미 축소는 피했습니다.
  doctrine_reference: 'POB translation principle: preserve source meaning with auditable lexical breadth'
- issue: 2인칭 복수와 소유격의 결합
  chosen_reading: 명령은 공동체 전체를 향한 복수형으로, 소유는 한국어에서 자연스러운 집합적 표현으로 처리했습니다.
  alternative_readings:
  - 복수 대상을 과도하게 분해해 설명
  - 모두를 반복해 문장을 장황하게 만듦
  rationale: 히브리어는 복수 동사와 단수적 소유형을 결합해 공동체적 지시를 전달하므로, 한국어에서도 무리한 구분 없이 집합적 주소로 옮기는 것이 본문 효과를 더 잘 보존합니다.
