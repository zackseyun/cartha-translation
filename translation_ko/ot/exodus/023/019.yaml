base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
  footnotes:
  - marker: a
    text: Or, 'the firstfruits of your land.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a kid'; that is, a young goat.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 땅에서 나는 처음 난 열매의 첫 것을 당신은 야훼 당신의 하나님의 집으로 가져와야 합니다.[a] 어린 염소를 그 어미의 젖에 삶아서는 안 됩니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '당신의 땅의 첫 열매'라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 '새끼 염소'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי אַדְמָתְךָ
  english_pob_choice: The first of the firstfruits of your ground
  chosen_korean: 당신의 땅에서 나는 처음 난 열매의 첫 것
  alternatives_korean:
  - 당신의 땅의 첫 열매의 첫 부분
  - 당신의 토지의 첫 맺은 열매
  lexicon: HALOT
  rationale: רֵאשִׁית와 בִּכּוּרִים의 결합은 첫 소산/첫 몫을 가리키므로, 제의적 맥락을 살리면서도 한국어로 자연스러운 '처음 난 열매의 첫 것'으로 옮겼습니다.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  english_pob_choice: the house of Yahweh your God
  chosen_korean: 야훼 당신의 하나님의 집
  alternatives_korean:
  - 야훼 당신의 하나님의 성전
  - 주 당신의 하나님의 집
  lexicon: HALOT
  rationale: בַּיִת는 여기서 성소/예배 처소를 뜻하므로 '집'을 유지했고, 본문에 있는 신명은 프로젝트 기준에 따라 '야훼'로 옮겼습니다.
- source_word: גְּדִי
  english_pob_choice: a young goat
  chosen_korean: 어린 염소
  alternatives_korean:
  - 새끼 염소
  - 젖염소
  lexicon: HALOT
  rationale: גְּדִי는 일반적으로 어린 염소를 뜻하므로 현대 한국어에서 분명한 '어린 염소'를 택했습니다.
- source_word: בַּחֲלֵב אִמּוֹ
  english_pob_choice: in its mother’s milk
  chosen_korean: 그 어미의 젖에
  alternatives_korean:
  - 그 어미의 우유에
  - 어미의 젖 속에
  lexicon: HALOT
  rationale: 직역을 유지하되 한국어 어법에 맞게 '젖에'로 처리해, 음식 규정의 금지를 분명히 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
