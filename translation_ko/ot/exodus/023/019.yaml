  - 주
  rationale: 본문이 직접 신명기 표기를 사용하므로, 번역문에서도 계약적 신명인 야훼를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 젖으로 삶는 금지의 해석
  chosen_reading: 본문의 문자적 금지를 그대로 유지합니다.
  alternative_readings:
  - 가나안 제의에 대한 금지로 풀이
  - 잔혹성 또는 음식 분리 규정으로 풀어쓰기
  rationale: 본문 자체는 금지의 이유를 설명하지 않으므로, 번역문에서는 배경 설명을 덧붙이지 않고 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
