  text: וְ/הַ/שְּׁבִיעִ֞ת תִּשְׁמְטֶ֣/נָּה וּ/נְטַשְׁתָּ֗/הּ וְ/אָֽכְלוּ֙ אֶבְיֹנֵ֣י עַמֶּ֔/ךָ וְ/יִתְרָ֕/ם תֹּאכַ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה כֵּֽן תַּעֲשֶׂ֥ה לְ/כַרְמְ/ךָ֖ לְ/זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
  footnotes:
  - marker: a
    text: Or 'you shall release it and abandon it'; the Hebrew verbs emphasize ceasing normal cultivation and leaving the land uncultivated in the seventh year.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the beast of the field.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 일곱째 해에는 그것을 쉬게 하고 그대로 두어야 합니다[a]. 그러면 당신의 백성 가운데 가난한 사람들이 먹을 수 있고, 그들이 남긴 것은 들의 들짐승들이 먹을 것입니다[b]. 당신은 포도원과 올리브나무밭에도 이와 같이 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사들은 경작을 멈추고 땅을 손대지 않는 뜻을 함께 가지므로, 문자적으로는 “풀어 놓고 버려 두다”에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “들의 짐승”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  english_pob_choice: But in the seventh year
  chosen_korean: 그러나 일곱째 해에는
  alternatives_korean:
  - 그리고 일곱째 해에는
  - 일곱째 해에는
  lexicon: WLC
  rationale: 접속사 וְ의 대조적 흐름을 살리면서, 안식년 맥락을 분명히 드러내는 자연스러운 한국어로 옮겼습니다.
- source_word: תִּשְׁמְטֶנָּה וּנְטַשְׁתָּהּ
  english_pob_choice: you shall let it rest and leave it alone
  chosen_korean: 그것을 쉬게 하고 그대로 두어야 합니다
  alternatives_korean:
  - 그것을 놓아주고 버려 두어야 합니다
  - 그것을 쉬게 하고 버려 두어야 합니다
  lexicon: HALOT
  rationale: 두 동사는 경작을 멈추고 손대지 않는 뜻을 함께 가지므로, “쉬게 하고 그대로 두다”로 농경적 의미와 지속적 방치를 과장하지 않는 뉘앙스를 살렸습니다.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  english_pob_choice: the poor of your people
  chosen_korean: 당신의 백성 가운데 가난한 사람들
  alternatives_korean:
  - 당신 백성의 가난한 자들
  - 당신의 백성 가운데 궁핍한 사람들
  lexicon: HALOT
  rationale: אֶבְיוֹן의 기본 의미를 따라 “가난한 사람들”로 옮기되, 소속 관계는 “당신의 백성 가운데”로 자연스럽게 표현했습니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: the wild animals of the field
  chosen_korean: 들의 들짐승들
  alternatives_korean:
  - 들의 야생동물들
  - 들의 짐승들
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되 현대 한국어에서 자연스럽고 문학적으로도 유지되는 “들의 들짐승들”로 옮겼습니다.
- source_word: כֵּן תַּעֲשֶׂה לְכַרְמְךָ לְזֵיתֶךָ
  english_pob_choice: You shall do the same with your vineyard and your olive grove
  chosen_korean: 당신은 포도원과 올리브나무밭에도 이와 같이 해야 합니다
  alternatives_korean:
  - 당신은 포도원과 올리브나무밭에도 그렇게 해야 합니다
  - 당신은 포도원과 올리브나무들에도 이와 같이 해야 합니다
  lexicon: HALOT
  rationale: כֵּן תַּעֲשֶׂה의 적용 범위를 한국어에서 자연스럽게 연결하고, לְזֵיתֶךָ는 집합적 농지 의미를 살려 “올리브나무밭”으로 옮겼습니다.
theological_decisions:
- issue: 안식년 명령의 법적-농경적 성격
  chosen_reading: 본문을 단순 휴식의 권면이 아니라 땅을 경작에서 풀어 놓는 율법 명령으로 옮겼습니다.
  alternative_readings:
  - 윤리적 원칙으로 완화해 ‘쉬어야 합니다’로만 옮기는 읽기
  - 완전한 포기 뉘앙스를 강하게 살려 ‘버려야 합니다’로 옮기는 읽기
  rationale: 히브리어 동사들은 경작 중단과 방치를 함께 말하므로, 명령문의 법적 강도를 유지하면서도 영구적 포기는 과도하게 만들지 않도록 했습니다.
  doctrine_reference: 안식년 규례(출 23:10-11)
