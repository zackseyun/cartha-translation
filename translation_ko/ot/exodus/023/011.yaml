- from: 그러나 일곱째 해에는 그것을 쉬게 하고 그대로 두어야 합니다[a]. 그러면 당신의 백성 가운데 가난한 사람들이 먹을 수 있고, 그들이 남긴 것은 들의 들짐승들이 먹을 것입니다[b]. 당신은 포도원과 올리브나무밭에도 이와 같이 해야 합니다.
  to: 그러나 일곱째 해에는 그 땅을 쉬게 하고 그대로 두어야 합니다[a]. 그러면 당신 백성 가운데 가난한 사람들이 먹을 수 있고, 그들이 남긴 것은 들짐승이 먹을 것입니다[b]. 당신은 포도원과 올리브나무밭에도 이와 같이 해야 합니다.
  rationale: 번역의 법적·농경적 의미와 영어 POB의 ‘let it rest and leave it alone’을 유지했습니다. 다만 한국어 관용에 맞게 ‘들의 들짐승들’을 ‘들짐승’으로 고치고, 각주 a를 더 정확하고 자연스럽게 정리했습니다. ‘그 땅’은 앞 절에서 언급된 땅을 받는 히브리어 여성 단수 목적어 접미사를 명확히 드러내는 안전한 보완입니다.
