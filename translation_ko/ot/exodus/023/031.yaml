base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Sea of Reeds.'''
    reason: lexical_alternative
  - marker: b
    text: That is, the Euphrates.
    reason: cultural_note
translation:
  language: ko
  text: 내가 너의 경계를 갈대바다에서 블레셋의 바다까지, 광야에서 그 강까지 정하겠습니다. 이는 내가 그 땅의 주민들을 너희 손에 넘겨 줄 것이며, 너희가 그들을 네 앞에서 몰아낼 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘갈대바다’.'
    reason: lexical_alternative
  - marker: b
    text: 곧 유프라테스입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי / אֶת גְּבֻלְךָ
  english_pob_choice: And I will set your border
  chosen_korean: 내가 너의 경계를 … 정하겠습니다
  alternatives_korean:
  - 내가 너의 경계를 … 세우겠습니다
  - 내가 너의 경계를 … 설정하겠습니다
  lexicon: HALOT
  rationale: שׁית는 문맥상 경계 설정/확정의 뜻으로 자연스럽게 읽히므로, 한국어에서는 ‘정하다’가 경계의 확정을 가장 분명하게 드러냅니다.
- source_word: מִיַּם סוּף
  english_pob_choice: from the Red Sea
  chosen_korean: 갈대바다에서
  alternatives_korean:
  - 홍해에서
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미를 살려 본문에는 ‘갈대바다’를 두고, 관용적 영어 관습과는 달리 원어 투명성을 유지했습니다.
- source_word: יָם פְּלִשְׁתִּים
  english_pob_choice: the Sea of the Philistines
  chosen_korean: 블레셋의 바다까지
  alternatives_korean:
  - 블레셋 사람들의 바다까지
  - 블레셋 바다까지
  lexicon: HALOT
  rationale: 히브리어의 민족-지리적 표현을 그대로 살려 ‘블레셋의 바다’로 옮겼습니다. 이는 특정 해안 지대를 가리키는 표현을 보존합니다.
- source_word: הַנָּהָר
  english_pob_choice: the River
  chosen_korean: 그 강까지
  alternatives_korean:
  - 그 강
  - 유프라테스 강까지
  lexicon: HALOT
  rationale: 정관사 있는 ‘그 강’은 히브리어 관용적으로 유프라테스를 가리키지만, 본문에서는 관용어 자체를 유지하고 해설 없이도 이해되도록 했습니다.
- source_word: אֶתֵּן בְּיֶדְכֶם
  english_pob_choice: I will give ... into your hand
  chosen_korean: 내가 … 너희 손에 넘겨 줄 것이며
  alternatives_korean:
  - 내가 … 너희 손에 줄 것이며
  - 내가 … 너희 권세에 넘겨 줄 것이며
  lexicon: HALOT
  rationale: ‘손에 주다’의 관용을 한국어에서는 ‘손에 넘겨 주다’로 옮겨, 통제권이 넘어감을 구체적으로 드러냈습니다.
- source_word: יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: the inhabitants of the land
  chosen_korean: 그 땅의 주민들
  alternatives_korean:
  - 그 땅에 사는 사람들
  - 그 땅의 거주자들
  lexicon: HALOT
  rationale: ‘거주하는 자들’이라는 분사적 의미를 한국어에서 가장 자연스러운 집합 명사로 풀었습니다.
- source_word: וְגֵרַשְׁתָּמוֹ מִפָּנֶיךָ
  english_pob_choice: and you will drive them out from before you
  chosen_korean: 너희가 그들을 네 앞에서 몰아낼 것이기 때문입니다
  alternatives_korean:
  - 너희가 그들을 네 앞에서 쫓아낼 것이기 때문입니다
  - 너희가 그들을 네 앞에서 내쫓을 것이기 때문입니다
  lexicon: HALOT
  rationale: גרשׁ는 추방/축출의 의미를 가지므로 ‘몰아내다’가 폭력적 퇴거의 뉘앙스를 유지하면서도 본문에 적합합니다.
theological_decisions:
- issue: 하나님이 경계를 정하시고 주민을 넘겨 주신다는 정복 약속의 표현
  chosen_reading: 직접적인 소유·통제권 이전과 추방 명령으로 읽어, 본문의 정복 언어를 완화하지 않았습니다.
  alternative_readings:
  - 보다 완곡한 ‘정복하게 하겠다’로 순화
  - 상징적·영적 의미로만 제한
  rationale: 본문은 지리적 경계 설정과 토지 주민의 인도/추방을 병치하므로, 이를 그대로 드러내는 번역이 소스의 의도를 가장 충실히 반영합니다.
  doctrine_reference: 본문 해석의 우선성; 역사-서사적 정복 약속
