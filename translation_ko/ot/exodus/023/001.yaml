source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֖א שֵׁ֣מַע שָׁ֑וְא אַל תָּ֤שֶׁת יָֽדְ/ךָ֙ עִם רָשָׁ֔ע לִ/הְיֹ֖ת עֵ֥ד חָמָֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
  footnotes:
  - marker: a
    text: Or 'carry/bear a false report.' The Hebrew verb is literally 'lift/carry,' here used for circulating a report.
    reason: lexical_alternative
  - marker: b
    text: Or 'Do not put your hand with a wicked man to be a malicious witness.' The Hebrew idiom is literally 'put your hand with,' and 'violent witness' may also be understood as 'malicious' or 'unjust' witness in this legal context.
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓된 보고를 퍼뜨리지 말아야 합니다. 악한 사람과 손을 잡고 폭력적인 증인이 되지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓된 보고를 나르다/짊어지다’로도 옮길 수 있습니다. 히브리어 동사는 문자적으로는 ‘들어 올리다/지다’이며, 여기서는 보고를 유통시키는 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악한 사람과 함께 손을 두다’로도 옮길 수 있습니다. 히브리어 관용구는 문자적으로 ‘네 손을 함께 두다’이며, 법정 문맥에서는 ‘폭력적인’뿐 아니라 ‘악의적인’ 또는 ‘불의한’ 증인으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא שֵׁמַע שָׁוְא
  english_pob_choice: spread a false report
  chosen_korean: 거짓된 보고를 퍼뜨리지 말아야 합니다
  alternatives_korean:
  - 거짓된 소문을 퍼뜨리지 말아야 합니다
  - 거짓된 보고를 떠맡지 말아야 합니다
  - 거짓된 보고를 전해서는 안 됩니다
  lexicon: HALOT
  rationale: נָשָׂא + שֵׁמַע는 문자적으로는 ‘들어 올리다/지다’이지만, 맥락상 거짓된 소식을 유통시키는 금지이므로 ‘퍼뜨리다’가 자연스럽고 법적 금지의 힘을 살립니다.
- source_word: תָּשֶׁת יָדְךָ עִם
  english_pob_choice: join hands with
  chosen_korean: 손을 잡고
  alternatives_korean:
  - 손을 함께 대고
  - 손을 얹고
  - 동조하고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘네 손을 함께 두다’의 구체적 이미지를 살리면서, 한국어에서는 ‘손을 잡다’가 공모·결탁의 의미를 가장 간결하게 전달합니다.
- source_word: רָשָׁע
  english_pob_choice: a wicked man
  chosen_korean: 악한 사람
  alternatives_korean:
  - 악인
  - 사악한 사람
  - 죄인
  lexicon: HALOT
  rationale: 법정·윤리 문맥의 רָשָׁע를 ‘악인’으로도 옮길 수 있지만, 여기서는 결탁 대상의 성격을 드러내는 현대 한국어로 ‘악한 사람’이 더 مستقیم하며, 남성 단수 호칭의 의미도 과도하게 흐리지 않습니다.
- source_word: עֵד חָמָס
  english_pob_choice: a violent witness
  chosen_korean: 폭력적인 증인
  alternatives_korean:
  - 악의적인 증인
  - 불의한 증인
  - 폭력의 증인
  lexicon: HALOT
  rationale: חָמָס의 핵심은 단순한 거짓말보다 ‘폭력/해악/부정의’로, 증언이 정의에 폭력을 행사하는 법정 의미를 살려 ‘폭력적인 증인’으로 옮겼습니다.
theological_decisions:
- issue: 거절 명령의 한국어 법령체 유지
  chosen_reading: 첫 금지는 ‘-아야 합니다’로, 둘째 금지는 직접 명령형 ‘-십시오’로 구분해 법적·윤리적 금지의 강도를 살렸습니다.
  alternative_readings:
  - 두 절 모두 ‘하지 마십시오’로 통일
  - 두 절 모두 ‘해서는 안 됩니다’로 통일
  rationale: 히브리어의 두 금지 표현 לֹא 와 אַל 이 나뉘어 있어, 한국어에서도 동일한 강도로만 평준화하지 않고 문장 리듬을 구분하는 편이 원문 구조를 더 잘 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
