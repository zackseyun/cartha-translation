  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
  footnotes:
  - marker: a
    text: Or 'When you come upon your enemy’s ox or his donkey wandering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 원수의 소나 그의 나귀가 길을 잃은 것을 보거든, 반드시 그것을 그에게 돌려주어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 원수의 소나 그의 나귀가 헤매는 것을 보거든’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְגַּע
  english_pob_choice: you come upon
  chosen_korean: 보거든
  alternatives_korean:
  - 마주치거든
  - 우연히 만나거든
  lexicon: HALOT
  rationale: 법 조항의 우연한 대면 상황을 자연스러운 현대 한국어 조건절로 옮기기 위해 ‘보거든’을 택했습니다.
- source_word: שׁוֹר
  english_pob_choice: ox
  chosen_korean: 소
  alternatives_korean:
  - 황소
  - 가축
  lexicon: HALOT
  rationale: 히브리어 שׁוֹר는 농경 사회의 소를 가리키므로, 한국어로는 가장 직접적이고 넓게 이해되는 ‘소’가 적절합니다.
- source_word: אֹיֵב
  english_pob_choice: your enemy’s
  chosen_korean: 원수의
  alternatives_korean:
  - 적의
  - 미워하는 사람의
  lexicon: HALOT
  rationale: ‘enemy’를 완화하지 않고 관계의 긴장을 그대로 드러내기 위해 관용적이면서도 강한 ‘원수의’를 사용했습니다.
- source_word: חֲמוֹר
  english_pob_choice: his donkey
  chosen_korean: 나귀
  alternatives_korean:
  - 당나귀
  - 나귀의
  lexicon: HALOT
  rationale: 한국어 성경 문맥에서 חֲמוֹר는 통상 ‘나귀’로 옮기며, 소유 대명사 ‘그의’는 뒤의 ‘그에게’로 충분히 회수됩니다.
- source_word: תֹּעֶה
  english_pob_choice: going astray
  chosen_korean: 길을 잃은
  alternatives_korean:
  - 헤매는
  - 방황하는
  lexicon: HALOT
  rationale: 동물의 상태를 현재 분사적으로 나타내는 말로, ‘길을 잃은’이 의미를 가장 분명하고 자연스럽게 전달합니다.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  english_pob_choice: you must surely return it
  chosen_korean: 반드시 그것을 … 돌려주어야 합니다
  alternatives_korean:
  - 반드시 그것을 … 되돌려 주어야 합니다
  - 꼭 그것을 … 돌려주십시오
  lexicon: HALOT
  rationale: 강조를 이루는 부정사 절대형+동사형의 중첩을 ‘반드시’로 살리고, 법조문체의 의무를 ‘-어야 합니다’로 옮겼습니다.
theological_decisions:
- issue: 원수에 대한 윤리적 긴장
  chosen_reading: ‘원수’라는 직접적 표현을 유지하고, 그 짐승을 반드시 돌려주라는 명령을 통해 적대 관계 속 자비와 정의의 긴장을 보존했습니다.
  alternative_readings:
  - ‘이웃’으로 완화
  - ‘미워하는 사람’으로 설명
  rationale: 히브리어는 관계를 완화하지 않으므로, 본문이 요구하는 도덕적 충돌을 희석하지 않는 것이 번역상 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
