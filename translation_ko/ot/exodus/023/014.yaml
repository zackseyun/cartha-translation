lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  english_pob_choice: Three times ... a feast
  chosen_korean: 한 해에 세 번
  alternatives_korean:
  - 세 번
  - 세 차례
  - 세 번의 절기
  lexicon: HALOT
  rationale: 히브리어 직역은 '세 발/세 절기'이지만, 영어 POB가 관용구의 뜻을 풀어 'three times'로 옮긴 점을 따라 한국어에서는 자연스러운 빈도 표현으로 처리했습니다.
- source_word: תָּחֹג
  english_pob_choice: you shall keep a feast
  chosen_korean: 절기를 지켜야 합니다
  alternatives_korean:
  - 잔치를 지켜야 합니다
  - 명절을 지켜야 합니다
  - 절기를 지내야 합니다
  lexicon: HALOT
  rationale: חגג의 예배적·절기적 의미를 살려 '지키다'를 택했으며, 단순한 행사보다 규정된 절기 준수를 드러냅니다.
- source_word: לִי
  english_pob_choice: to me
  chosen_korean: 나를 위하여
  alternatives_korean:
  - 내게
  - 나에게
  lexicon: HALOT
  rationale: 전치사 לְ는 여기서 절기의 대상이 여호와임을 나타내므로, 직역 가능한 '내게'보다 목적·지향을 분명히 하는 '나를 위하여'로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: רְגָלִים idiom의 의미를 어떻게 드러낼지
  chosen_reading: 표면적 '발' 이미지는 본문 뜻을 해치므로, 정해진 연례 순례 절기라는 기능적 의미를 한국어 본문에는 드러내지 않고 '절기'로 처리합니다.
  alternative_readings:
  - 세 발
  - 순례 절기 세 차례
  - 세 번의 순례 행사
  rationale: 문맥상 이 표현은 문자적 신체 부위가 아니라 절기 준수의 관용구이므로, 본문은 자연스럽게 읽히되 의미 손실은 최소화해야 합니다.
  doctrine_reference: 출 23:14의 절기 규례와 순례 절기 개념
