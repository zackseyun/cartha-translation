id: EXO.23.27
reference: Exodus 23:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת אֵֽימָתִ/י֙ אֲשַׁלַּ֣ח לְ/פָנֶ֔י/ךָ וְ/הַמֹּתִי֙ אֶת כָּל הָ/עָ֔ם אֲשֶׁ֥ר תָּבֹ֖א בָּ/הֶ֑ם וְ/נָתַתִּ֧י אֶת כָּל אֹיְבֶ֛י/ךָ אֵלֶ֖י/ךָ עֹֽרֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
  footnotes:
  - marker: a
    text: Or 'my dread' or 'my fear.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will rout' or 'I will put in an uproar.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew idiom: ''I will give all your enemies to you [as] back/neck,'' meaning they will turn and flee before you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 제 공포를 당신보다 앞서 보내고[a], 당신이 들어가는 모든 백성[b]을 혼란에 빠뜨리며, 당신의 모든 원수들이 당신 앞에 등을 돌리게 하겠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제 공포’, ‘제 두려움’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, ‘당신이 들어가는 곳에 있는 모든 백성’ 또는 ‘당신이 들어가는 모든 민족’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구로, 원수들이 등을 돌리고 달아난다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵימָתִי
  english_pob_choice: my terror
  chosen_korean: 제가 제 공포를
  alternatives_korean:
  - 제가 제 두려움을
  - 제가 제 무서움을
  lexicon: HALOT
  rationale: אֵימָה는 ‘공포, 두려움, 전율’의 뜻이므로, 하나님의 능동적 위협성을 살리기 위해 ‘공포’를 택했습니다.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  english_pob_choice: I will send ... ahead of you
  chosen_korean: 당신보다 앞서 보내고
  alternatives_korean:
  - 당신 앞에 보내고
  - 당신 앞서 보내고
  lexicon: HALOT
  rationale: לְפָנֶיךָ는 단순한 위치보다 ‘앞서, 선행하여’의 의미이므로 자연스러운 현대 한국어로 옮겼습니다.
- source_word: וְהַמֹּתִי
  english_pob_choice: I will throw into confusion
  chosen_korean: 혼란에 빠뜨리며
  alternatives_korean:
  - 혼란케 하며
  - 뒤죽박죽이 되게 하며
  - 혼란을 일으키며
  lexicon: HALOT
  rationale: המם의 핵심은 전투적 ‘혼란/공황/동요’이므로, ‘혼란에 빠뜨리다’로 능동적 원인성을 살렸습니다.
- source_word: עֹרֶף
  english_pob_choice: turn their backs to you
  chosen_korean: 등을 돌리게 하겠습니다
  alternatives_korean:
  - 뒤통수를 보이게 하겠습니다
  - 도망치게 하겠습니다
  - 등을 보이게 하겠습니다
  lexicon: HALOT
  rationale: עֹרֶף는 문자적으로 ‘목덜미/뒤’이지만, 문맥상 패주를 뜻하는 관용구이므로 ‘등을 돌리다’로 이미지와 의미를 함께 반영했습니다.
theological_decisions:
- issue: 하나님의 직접적 군사 개입 표현
  chosen_reading: 동사들을 모두 1인칭 직접 화법으로 유지해, 하나님이 공포를 보내고 혼란을 일으키며 원수들을 물러서게 하시는 것으로 번역했습니다.
  alternative_readings:
  - 더 완화된 간접 표현
  - 주어를 흐리게 하는 수동 표현
  rationale: 히브리어는 하나님을 주어로 하는 직접적 1인칭 행위를 반복하므로, 이를 약화하지 않고 그대로 드러내는 것이 원문 의도를 더 충실히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
