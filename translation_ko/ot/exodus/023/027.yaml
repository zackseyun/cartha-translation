revisions:
- from: 제가 제 공포를 당신보다 앞서 보내고[a], 당신이 들어가는 모든 백성[b]을 혼란에 빠뜨리며, 당신의 모든 원수들이 당신 앞에 등을 돌리게 하겠습니다[c].
  to: 내가 나의 공포를 네 앞에 보내고[a], 네가 그들 가운데로 들어갈 모든 백성을 혼란에 빠뜨리며[b], 네 모든 원수가 네게 등을 돌리게 하겠습니다[c].
  rationale: 원문의 직접적인 신적 1인칭 발화와 세 동사의 병렬을 보존하면서, 한국어에서 부자연스러운 ‘제가 제 … 당신’ 구성을 바로잡았습니다. 또한 ‘그들 가운데로’를 넣어 בָהֶם의 공간적 관계를 명시했으며, 공포·혼란·등을 돌림이라는 핵심 어휘와 전쟁 패주의 비유는 유지했습니다.
