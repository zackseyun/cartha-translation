review_pass:
  verdict: revise
  source_fidelity: 수정 전의 ‘쉬어야 합니다’는 תִּשְׁבֹּת의 결과적 의미는 전달하지만, 이 동사의 기본 뜻인 ‘그치다/중단하다’를 충분히 드러내지 못합니다. ‘일을 그쳐야 합니다’로 수정하면 안식일의 노동 중단이라는 본문의 초점을 더 정확히 보존합니다. 나머지 요소들, 곧 소와 나귀의 쉼, 여종의 아들, 거류민의 회복은 히브리어와 부합합니다.
  naturalness: ‘일곱째 날에는 일을 그쳐야 합니다’는 현대 표준 한국어의 합쇼체 법문 문맥에서 자연스럽습니다. 목적을 나타내는 후반부는 ‘…하게 하십시오’로 옮겨, 단순한 결과 진술보다 לְמַעַן의 목적성을 분명히 했습니다.
  terminology: ‘여종의 아들’은 בֶּן אֲמָתְךָ의 사회적 관계를 불필요하게 완화하지 않고 보존합니다. ‘거류민’은 הַגֵּר가 가리키는 공동체 안의 정주 외부인이라는 법적·사회적 범주를 적절히 반영합니다. ‘숨을 돌리다’는 וְיִנָּפֵשׁ의 회복·원기 회복의 뜻에 잘 맞습니다.
