id: EXO.23.12
reference: Exodus 23:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
  footnotes:
  - marker: a
    text: Or 'you shall rest'; the Hebrew verb fundamentally means 'cease, stop.'
    reason: lexical_alternative
  - marker: b
    text: '''Sojourner'' refers to a resident foreigner living among Israel under its social and legal order.'
    reason: cultural_note
  - marker: c
    text: Or 'your female servant’s son.'
    reason: lexical_alternative
translation:
  language: ko
  text: 엿새 동안에는 네 일을 하되, 일곱째 날에는 쉬어야 합니다. 그래야 네 소와 나귀가 쉬고, 네 여종의 아들과 거류민도 숨을 돌릴 수 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  english_pob_choice: For six days
  chosen_korean: 엿새 동안에는
  alternatives_korean:
  - 여섯 날 동안에는
  - 여섯 날에는
  lexicon: HALOT
  rationale: משך 기간을 나타내는 표현이므로 한국어에서는 시간 부사구로 자연스럽게 옮겨, 명령의 적용 기간을 분명히 했습니다.
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  english_pob_choice: you shall do your work
  chosen_korean: 네 일을 하되
  alternatives_korean:
  - 네 일을 해야 합니다
  - 네 일을 할 것이며
  lexicon: HALOT
  rationale: מַעֲשֶׂיךָ는 단순한 ‘일’보다 넓은 의미지만, 안식일 대비 문맥에서는 ‘네 일’이 가장 자연스럽고 절제된 대응입니다.
- source_word: תִּשְׁבֹּת
  english_pob_choice: you shall cease
  chosen_korean: 쉬어야 합니다
  alternatives_korean:
  - 중단해야 합니다
  - 멈추어야 합니다
  lexicon: HALOT
  rationale: 히브리어의 핵심은 ‘멈춤/중지’이지만, 한국어 법문에서는 ‘쉬다’가 그 결과를 잘 드러내면서도 지나치게 기계적이지 않습니다.
- source_word: וְיִנָּפֵשׁ
  english_pob_choice: may be refreshed
  chosen_korean: 숨을 돌릴 수 있습니다
  alternatives_korean:
  - 새 힘을 얻을 수 있습니다
  - 회복될 수 있습니다
  lexicon: HALOT
  rationale: 동물과 종속된 사람 모두에게 주어지는 안식의 효과를 살리기 위해, 단순한 감정적 ‘새로움’보다 ‘숨을 돌리다’라는 신체적·실질적 표현을 택했습니다.
- source_word: בֶּן אֲמָתְךָ
  english_pob_choice: the son of your female servant
  chosen_korean: 네 여종의 아들
  alternatives_korean:
  - 네 여종의 아들
  - 네 여종의 아들/여종의 아들
  lexicon: HALOT
  rationale: 사회적 종속 관계를 드러내기 위해 ‘여종’을 유지했고, 직역에 가까운 ‘아들’ 구조를 보존했습니다.
- source_word: הַגֵּר
  english_pob_choice: the sojourner
  chosen_korean: 거류민
  alternatives_korean:
  - 나그네
  - 거주 외국인
  lexicon: HALOT
  rationale: ‘거류민’은 ישראל 공동체 안에 거주하는 외부인의 법적·사회적 지위를 비교적 정확하게 드러내므로, 단순한 ‘낯선 사람’보다 source-direct합니다.
theological_decisions:
- issue: תִּשְׁבֹּת의 한국어 표현
  chosen_reading: 쉬어야 합니다
  alternative_readings:
  - 중단해야 합니다
  - 멈추어야 합니다
  rationale: 이 본문은 단지 노동 정지를 명령하는 것에 그치지 않고, 12절 후반의 목적절에서 피조물의 안식을 드러냅니다. 따라서 ‘쉬다’는 결과를 살리되, 문맥상 법적 명령은 유지합니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy over translation tradition)
- issue: הַגֵּר의 번역
  chosen_reading: 거류민
  alternative_readings:
  - 나그네
  - 거주 외국인
  rationale: 이 용어는 정서적 의미의 ‘낯선 사람’이 아니라 이스라엘 공동체 안의 법적 보호 대상입니다. ‘거류민’은 그 사회·법적 범주를 보존해, 안식의 혜택이 공동체 밖이 아니라 그 안의 취약한 타자에게도 미친다는 점을 분명히 합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
