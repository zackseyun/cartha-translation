- from: 엿새 동안에는 네 일을 하되, 일곱째 날에는 쉬어야 합니다. 그래야 네 소와 나귀가 쉬고, 네 여종의 아들과 거류민도 숨을 돌릴 수 있습니다.
  to: 엿새 동안에는 네 일을 하되, 일곱째 날에는 일을 그쳐야 합니다. 그리하여 네 소와 나귀가 쉬고, 네 여종의 아들과 거류민이 숨을 돌리게 하십시오.
  rationale: 노동 중단을 명하는 תִּשְׁבֹּת의 어휘적 의미를 명시적으로 반영하도록 최소한으로 수정했습니다. 또한 목적절을 ‘그리하여 … 하게 하십시오’로 처리하여, 동물과 사회적으로 종속되거나 외부인인 이들이 쉼과 회복을 누리게 하려는 본문의 목적을 보존했습니다.
