  source_fidelity: 본문에는 인과를 나타내는 כִּי가 한 번만 나오며, 그것은 이집트에서의 나그네 생활을 근거로 제시합니다. 현 초안은 둘째 문장에도 ‘때문입니다’를 넣어 인과관계를 중복하고 문장 구조를 바꾸었습니다. 또한 각주 표지가 해당 어휘가 아닌 절 끝에 함께 붙어 있어 앵커가 불명확합니다.
  naturalness: ‘너희 자신도 나그네의 삶을 알고 있습니다’는 현대 표준어 합쇼체로 자연스럽고, 히브리어의 강조된 대명사와 경험적 앎을 잘 드러냅니다. ‘압제해서는 안 됩니다’도 법적·윤리적 금지의 강도를 유지합니다.
  terminology: ‘나그네’는 גֵר의 전통적이고 문맥상 가능한 번역이지만 일시적 여행객으로 오해될 수 있으므로 각주에서 공동체 안에 거주하는 비토착민이라는 뜻을 분명히 해야 합니다. נֶפֶשׁ는 여기서 이원론적 ‘영혼’보다 삶·처지를 가리키므로 ‘삶’이 적절합니다. 각주의 비한국어 혼입(‘ ժողովրդի’)은 반드시 바로잡아야 합니다.
