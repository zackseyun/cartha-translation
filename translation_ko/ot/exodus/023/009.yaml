id: EXO.23.9
reference: Exodus 23:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גֵ֖ר לֹ֣א תִלְחָ֑ץ וְ/אַתֶּ֗ם יְדַעְתֶּם֙ אֶת נֶ֣פֶשׁ הַ/גֵּ֔ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'foreigner,' 'resident alien,' or 'stranger.' The Hebrew ger refers to a non-native living among a people, often in a socially vulnerable position.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'you know the nephesh of the sojourner'—an idiom expressing firsthand knowledge of the sojourner's inner life or lived condition.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 나그네[a]를 압제해서는 안 됩니다. 너희 자신도 나그네의 삶[b]을 알고 있습니다. 너희가 이집트 땅에서 나그네였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인’, ‘거류민’, ‘타국인’. 히브리어 게르(ger)는 한 공동체 가운데 거주하는 비토착민으로, 흔히 사회적으로 취약한 처지에 있는 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나그네의 네페쉬(nephesh)를 알다’입니다. 이는 나그네의 내면과 실제 삶의 조건을 직접 아는 것을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  english_pob_choice: sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 이방인
  - 거류민
  - 낯선 사람
  lexicon: HALOT
  rationale: גֵר는 잠시 머무는 여행객이 아니라 공동체 안에 거주하는 비토착민을 가리키므로, 한국어에서는 관계적·사회적 뉘앙스를 살리는 "나그네"가 가장 자연스럽습니다.
- source_word: תִלְחָץ
  english_pob_choice: oppress
  chosen_korean: 압제하다
  alternatives_korean:
  - 억누르다
  - 학대하다
  - 괴롭히다
  lexicon: HALOT
  rationale: 법 문맥의 לחץ는 단순한 불편함이 아니라 약자를 향한 강압적 착취를 뜻하므로, 금지의 강도를 살리는 "압제하다"가 적절합니다.
- source_word: אֶת נֶפֶשׁ הַגֵּר
  english_pob_choice: the soul of the sojourner
  chosen_korean: 나그네의 삶
  alternatives_korean:
  - 나그네의 혼
  - 나그네의 영혼
  - 나그네의 처지
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 신체-정신 이분법적 '영혼'보다 실제로 겪는 생애와 내적 상태를 가리키는 관용구이므로, POB의 의도를 따라 한국어에서는 이해 가능한 "삶"으로 옮겼습니다.
- source_word: יְדַעְתֶּם
  english_pob_choice: you yourselves know
  chosen_korean: 너희 자신도 알고 있기 때문입니다
  alternatives_korean:
  - 너희도 알고 있기 때문입니다
  - 너희가 직접 알고 있기 때문입니다
  lexicon: HALOT
  rationale: 동사 자체보다 וְאַתֶּם의 강조를 살려, 단순한 지식이 아니라 자기 경험에 근거한 앎임을 드러냈습니다.
theological_decisions:
- issue: 출애굽 기억을 근거로 한 윤리 명령의 톤
  chosen_reading: 명령과 이유 절을 분명히 분리해, 약자를 억압하지 말아야 하는 윤리적 요구를 직접적으로 표현했습니다.
  alternative_readings:
  - 완곡하게 옮겨 사회적 권고처럼 만들기
  - '"나그네"를 중립어로 약화하기'
  rationale: 본문은 이스라엘의 이집트 체류 경험을 근거로 타자 대우의 윤리를 강하게 요구하므로, 한국어에서도 그 규범적 압력을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 출 23:9의 언약 윤리 및 이방인/거류민 보호 전통
- issue: '"나그네"의 번역 범위'
  chosen_reading: 전통 교회어보다 사회적·서사적 긴장을 살리는 "나그네"를 본문어로 사용했습니다.
  alternative_readings:
  - '"이방인"으로 번역해 종족 경계를 강조하기'
  - '"거류민"으로 번역해 법적 신분을 강조하기'
  rationale: 히브리어 ger는 단순한 민족 범주가 아니라 취약한 거주자 지위를 가리키므로, 본문이 요구하는 공감과 기억의 논리를 가장 잘 살리는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5 (핵심 용어 일관성, 또는 근거 있는 예외)
