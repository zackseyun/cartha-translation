id: EXO.23.18
reference: Exodus 23:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא תִזְבַּ֥ח עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹֽא יָלִ֥ין חֵֽלֶב חַגִּ֖/י עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
  footnotes:
  - marker: a
    text: Or 'with leaven' / 'upon leaven.' The Hebrew preposition is literally 'upon,' but in this sacrificial context it likely means the sacrifice must not be offered in association with anything leavened.
    reason: lexical_alternative
  - marker: b
    text: Or 'festival' for 'feast.' The Hebrew term refers to a sacred festival celebration.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 누룩 있는 것과 함께 내 제물의 피를 바쳐서는 안 되며, 내 절기의 기름은 아침까지 남겨 두어서는 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누룩과 함께’, ‘누룩 위에’. 히브리어 전치사는 문자적으로 ‘위에’이지만, 제의 문맥에서는 누룩이 든 것과 함께 제사드리지 말라는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘절기’로 번역할 수 있습니다. 히브리어 חג는 거룩한 절기 축제를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  english_pob_choice: you shall not sacrifice
  chosen_korean: 바쳐서는 안 됩니다
  alternatives_korean:
  - 제사해서는 안 됩니다
  - 희생제물로 드려서는 안 됩니다
  lexicon: HALOT
  rationale: 금지법의 동사 זבח를 현대 한국어에서 자연스러운 제의 금지로 옮기되, 제의적 의미를 살리기 위해 ‘바치다’를 선택했습니다.
- source_word: עַל חָמֵץ
  english_pob_choice: with anything leavened
  chosen_korean: 누룩 있는 것과 함께
  alternatives_korean:
  - 누룩 위에
  - 누룩과 함께
  lexicon: HALOT
  rationale: 직역하면 ‘위에’이지만 제의 문맥에서는 동반/결합의 금지를 뜻하므로, POB의 해석을 반영해 ‘함께’로 자연화했습니다.
- source_word: דַּם זִבְחִ֑/י
  english_pob_choice: the blood of my sacrifice
  chosen_korean: 내 제물의 피
  alternatives_korean:
  - 내 희생제물의 피
  - 내 제사의 피
  lexicon: HALOT
  rationale: 히브리어가 실제로 ‘피’를 명시하므로 이를 유지했고, 소유격 1인칭은 하나님의 직접 화법으로 ‘내’로 살렸습니다.
- source_word: חֵֽלֶב חַגִּ֖/י
  english_pob_choice: the fat of my feast
  chosen_korean: 내 절기의 기름
  alternatives_korean:
  - 내 잔칫날의 기름
  - 내 축제의 기름
  lexicon: HALOT
  rationale: חֵלֶב은 제물의 ‘기름’이며, חַג는 절기/축제를 뜻하므로 제의적 맥락을 살려 ‘절기’로 옮겼습니다.
- source_word: יָלִ֥ין ... עַד בֹּֽקֶר
  english_pob_choice: shall not remain until morning
  chosen_korean: 아침까지 남겨 두어서는 안 됩니다
  alternatives_korean:
  - 아침까지 머물러서는 안 됩니다
  - 아침까지 남겨져 있어서는 안 됩니다
  lexicon: HALOT
  rationale: לין의 ‘밤새 머물다’ 의미를 한국어 관용으로 풀어, 금지의 결과가 제물의 일부를 다음 날로 넘기지 말라는 뜻임을 분명히 했습니다.
theological_decisions:
- issue: 1인칭 소유격이 가리키는 제의의 주체
  chosen_reading: ‘내 제물’, ‘내 절기’를 그대로 유지하여 하나님이 직접 말씀하시는 언약적 소유를 드러냈습니다.
  alternative_readings:
  - ‘여호와의 제물’, ‘여호와의 절기’
  - 설명적 의역
  rationale: 히브리어의 1인칭 접미사는 본문에 분명하므로, 설명을 덧붙이기보다 직접 화법의 긴장과 권위를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
