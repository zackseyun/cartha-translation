  text: 나는 그들을 한 해 안에 네 앞에서 쫓아내지 않겠습니다. 그 땅이 황폐해지고 들짐승이 네게 너무 많아질까 봐서입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 목적어 접미사는 문법상 단수형이지만, 문맥상 주민이나 원수의 집단 전체를 가리키는 집합적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘들짐승’은 문자적으로 ‘들의 짐승’에 해당하며, 현대 한국어에서는 자연스럽게 ‘들짐승’으로 옮길 수 있습니다.
    reason: lexical_alternative
