  text: לֹ֧א אֲגָרְשֶׁ֛/נּוּ מִ/פָּנֶ֖י/ךָ בְּ/שָׁנָ֣ה אֶחָ֑ת פֶּן תִּהְיֶ֤ה הָ/אָ֨רֶץ֙ שְׁמָמָ֔ה וְ/רַבָּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
  footnotes:
  - marker: a
    text: Or 'I will not drive them out from before you in a single year.' The Hebrew uses a singular object suffix, likely a collective reference to the inhabitants/enemy.
    reason: lexical_alternative
  - marker: b
    text: '''Wild animals of the field'' may also be rendered ''beasts of the field.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들을 한 해 안에 네 앞에서 쫓아내지 않겠습니다. 그렇지 않으면 그 땅이 황폐해지고, 들의 들짐승이 네게 너무 많아질 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 목적어 접미사는 문법상 단수형이지만, 문맥상 주민/원수 집단 전체를 가리키는 집합적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘들의 들짐승’은 문자적으로는 ‘들의 짐승들/들의 짐승’에 해당하며, 현대 한국어에서는 자연스럽게 ‘들짐승’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  english_pob_choice: I will not drive them out
  chosen_korean: 쫓아내지 않겠습니다
  alternatives_korean:
  - 몰아내지 않겠습니다
  - 내쫓지 않겠습니다
  lexicon: HALOT
  rationale: גרש의 기본 의미는 내쫓다/몰아내다이며, 여기서는 정복 문맥의 ‘drive out’에 해당하므로 자연스러운 현대어로 옮겼습니다.
- source_word: מִפָּנֶיךָ
  english_pob_choice: from before you
  chosen_korean: 네 앞에서
  alternatives_korean:
  - 네 존재 앞에서
  - 네 얼굴 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 공간적·대면적 뉘앙스가 살아 있는 한국어로 옮기기 위해 ‘네 앞에서’를 택했습니다.
- source_word: בְּשָׁנָה אֶחָת
  english_pob_choice: in one year
  chosen_korean: 한 해 안에
  alternatives_korean:
  - 한 해에
  - 일 년 안에
  lexicon: HALOT
  rationale: 시간 제한을 분명히 하면서도 문맥상 자연스럽게 읽히도록 ‘한 해 안에’로 옮겼습니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: the wild animals of the field
  chosen_korean: 들의 들짐승
  alternatives_korean:
  - 들의 들의 짐승
  - 들의 들짐승들
  lexicon: HALOT
  rationale: 문자적으로는 ‘들의 들짐승’이지만, 현대 한국어에서는 ‘들짐승’이 가장 자연스럽고, ‘of the field’는 소유격보다 범주적 표현으로 살렸습니다.
theological_decisions:
- issue: פֶּן 절의 경고적 목적/결과 뉘앙스
  chosen_reading: ‘그렇지 않으면’으로 결과의 경고를 살렸습니다.
  alternative_readings:
  - ‘~하지 않도록’
  - ‘~할까 봐’
  rationale: פֶּן은 단순한 목적이 아니라 경고가 섞인 부정적 결과를 나타내므로, 현대 한국어에서 의미가 분명한 표현을 택했습니다.
  doctrine_reference: 문맥상 하나님의 지혜로운 심판/보호의 경고
- issue: 히브리어 단수 목적어 접미사의 집합적 지시
  chosen_reading: ‘그들’을 사용해 집합적 의미를 드러냈습니다.
  alternative_readings:
  - ‘그를’
  - ‘그것을’
  rationale: 영어 POB의 본문은 집합적 대상을 반영해 ‘them’을 택했고, 히브리어 단수 접미사는 특정 개인이 아니라 이전에 언급된 주민/원수 집단을 가리키므로 한국어도 집합적 복수를 살리는 것이 적절합니다.
  doctrine_reference: 문법적 단수와 집합적 의미의 조화
