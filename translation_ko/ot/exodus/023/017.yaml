  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
  footnotes:
  - marker: a
    text: 'Hebrew: ''before the Lord Yahweh.'' English ''the Lord GOD'' reflects the Hebrew title-plus-divine-name combination and avoids the awkward ''Lord LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 한 해에 세 번, 너희 가운데 모든 남자는 야훼 주님 앞에 나타나야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼 주님 앞에’라는 이중 호칭을 사용합니다. 한국어 본문은 고유명사와 칭호를 모두 드러내기 위해 이를 분리해 옮겼습니다.
    reason: theological_note
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִ֖ים
  english_pob_choice: Three times
  chosen_korean: 세 번
  alternatives_korean:
  - 세 차례
  - 세 번씩
  lexicon: HALOT
  rationale: 관용적으로 ‘three times’에 해당하는 표현으로, 빈도와 횟수를 자연스럽게 드러냅니다.
- source_word: בַּ/שָּׁנָ֑ה
  english_pob_choice: in the year
  chosen_korean: 한 해에
  alternatives_korean:
  - 그 해에
  - 매년
  lexicon: HALOT
  rationale: 히브리어의 연중 범위를 살리면서 한국어로는 가장 자연스럽고 문맥에 맞는 표현입니다.
- source_word: יֵרָאֶה֙
  english_pob_choice: shall appear
  chosen_korean: 나타나야 합니다
  alternatives_korean:
  - 나타나야 합니다
  - 들러야 합니다
  - 나와야 합니다
  lexicon: HALOT
  rationale: 권위자 앞에 ‘나아가 나타나다’는 의미를 살리되, 현대 한국어에서 직접적이고 공손한 표현으로 옮겼습니다.
- source_word: אֶל פְּנֵ֖י הָ/אָדֹ֥ן יְהוָֽה
  english_pob_choice: before the Lord Yahweh
  chosen_korean: 야훼 주님 앞에
  alternatives_korean:
  - 주 야훼 앞에
  - 야훼 앞에
  - 주 하나님 앞에
  lexicon: DOCTRINE.md — יהוה YHWH → 야훼; כִּי/אדון 계열은 주님
  rationale: 이 결합은 지칭어 ‘주님’(הָאָדֹן)과 고유명사 ‘야훼’(יְהוָה)를 함께 보존해야 하므로, 두 요소를 나란히 드러냈습니다.
theological_decisions:
- issue: 히브리어의 이중 호칭 הָאָדֹן יְהוָה를 한국어로 어떻게 보존할지
  chosen_reading: ‘야훼 주님’으로 옮겨, 고유명사와 주권 칭호를 함께 유지했습니다.
  alternative_readings:
  - ‘주 야훼’
  - ‘주 하나님’
  rationale: 본문은 단순히 ‘주’가 아니라 ‘주님’이라는 칭호와 야훼의 이름을 동시에 사용하므로, 둘을 모두 보이게 하는 번역이 소스의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
