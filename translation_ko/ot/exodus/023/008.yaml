source:
  edition: WLC
  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
  footnotes:
  - marker: a
    text: Or 'the discerning' for 'the clear-sighted.' The Hebrew keeps the imagery of sight while implying sound judgment.
    reason: lexical_alternative
  - marker: b
    text: '''The words of the righteous'' may also be understood in a legal sense as ''the statements'' or ''the case'' of those who are in the right.'
    reason: lexical_alternative
translation:
  language: ko
  text: 뇌물을 받지 마십시오. 뇌물은 눈이 밝은 사람들의 눈을 멀게 하며[a], 의인들의 말을 왜곡합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘눈이 밝은 사람들’은 본문의 시각 이미지를 살린 표현이며, 문맥상 ‘분별 있는 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의인들의 말’은 법정 문맥에서 그들의 ‘진술’이나 ‘소송의 주장’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  english_pob_choice: bribe
  chosen_korean: 뇌물
  alternatives_korean:
  - 매수물
  - 뇌물성 금품
  - 선물
  lexicon: HALOT
  rationale: 부패한 판결을 유도하는 금품이라는 뜻을 현대 한국어의 가장 분명한 법·윤리 용어인 ‘뇌물’로 옮겼습니다. ‘선물’은 중립적이어서 부적절합니다.
- source_word: לֹא תִקָּח
  english_pob_choice: you shall not take
  chosen_korean: 받지 마십시오
  alternatives_korean:
  - 취하지 마십시오
  - 받아서는 안 됩니다
  lexicon: HALOT
  rationale: 법률 문맥의 금지문을 한국어 명령형 금지로 자연스럽게 살렸습니다. ‘받다’는 금전이나 이익을 수수하는 관용적 의미를 잘 전달합니다.
- source_word: פִּקְחִים
  english_pob_choice: the clear-sighted
  chosen_korean: 시력이 좋은 사람들
  alternatives_korean:
  - 분별 있는 사람들
  - 눈이 밝은 사람들
  - 총명한 사람들
  lexicon: HALOT
  rationale: 히브리어가 눈을 뜬 상태라는 시각적 이미지를 유지하면서도, 바로 뒤의 ‘눈을 멀게 한다’와의 대조를 살리기 위해 직역에 가까운 표현을 택했습니다.
- source_word: דִּבְרֵי צַדִּיקִים
  english_pob_choice: the words of the righteous
  chosen_korean: 의인들의 말
  alternatives_korean:
  - 의인들의 진술
  - 옳은 사람들의 주장
  - 의인의 사건
  lexicon: HALOT
  rationale: 본문의 ‘말들’은 법정적 맥락에서 진술이나 주장까지 포함할 수 있지만, 우선적으로 가장 투명한 한국어인 ‘말’을 사용했습니다.
theological_decisions:
- issue: ‘의인들’의 윤리적·법정적 이중 의미
  chosen_reading: ‘의인들’로 옮겨 도덕적 의로움과 소송에서의 정당함을 함께 열어 두었습니다.
  alternative_readings:
  - ‘옳은 편에 있는 사람들’
  - ‘정당한 사람들’
  rationale: 히브리어 צַדִּיקִים는 윤리적 의인과 법정에서 옳은 사람을 모두 가리킬 수 있으므로, 의미를 좁히지 않는 번역이 더 충실합니다.
  doctrine_reference: 성경의 משפט/צדק 어휘는 도덕과 재판의 두 차원을 함께 가질 수 있습니다.
