  source_fidelity: ‘뇌물’과 금지 명령은 히브리어 본문에 충실합니다. 그러나 פִּקְחִים를 ‘시력이 좋은 사람들’로 하면 실제 시력이라는 의미로 지나치게 좁혀져, 시각 은유와 판단력의 함의를 함께 지닌 원문의 뜻이 약해집니다. ‘눈이 밝은 사람들’은 이 이미지를 유지하면서 문맥상의 분별력도 자연스럽게 드러냅니다. וִיסַלֵּף는 ‘굽게 만들다’보다 ‘왜곡하다’가 현대 한국어에서 더 정확하고 자연스럽습니다.
