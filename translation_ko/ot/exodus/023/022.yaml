- from: 그러나 너희가 그의 음성을 잘 듣고 내가 말하는 모든 것을 행하면, 내가 너희의 원수들에게는 원수가 되고 너희의 적대자들에게는 적대자가 되겠습니다.[a][b]
  to: 그러나 네가 그의 음성에 반드시 순종하고 내가 말하는 모든 것을 다 행하면, 내가 네 원수들에게는 원수가 되고 네 대적들에게는 대적이 되겠습니다.[a][b]
