source:
  edition: WLC
  text: כִּ֣י אִם שָׁמֹ֤עַ תִּשְׁמַע֙ בְּ/קֹל֔/וֹ וְ/עָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְ/אָֽיַבְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ וְ/צַרְתִּ֖י אֶת צֹרְרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
  footnotes:
  - marker: a
    text: Or 'if you surely listen to his voice.' The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: The verse shifts from 'his voice' to 'I speak,' preserving the close link between the messenger and the LORD in the context.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 네가 그의 음성에 반드시 순종하고 내가 말하는 모든 것을 다 행하면, 내가 네 원수들에게는 원수가 되고 네 대적들에게는 대적이 되겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 음성에 반드시 순종하고’는 히브리어에서 ‘듣다’ 동사를 반복하여 강조한 표현을 반영합니다. 직역하면 ‘그의 음성을 반드시 들으면’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 음성’에서 ‘내가 말하는’으로 전환되는 점은 문맥상 사자와 야훼의 긴밀한 연결을 보여 줍니다.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But if
  chosen_korean: 그러나 …하면
  alternatives_korean:
  - 하지만 만일 …하면
  - 그렇지만 …하면
  lexicon: HALOT
  rationale: 이 결합은 앞선 경고와 연결되는 강한 조건 대비를 나타내므로, 한국어에서는 앞절과의 대조를 분명히 하는 「그러나」로 옮겼습니다.
- source_word: שָׁמֹעַ תִּשְׁמַע בְּקֹלוֹ
  english_pob_choice: you carefully obey his voice
  chosen_korean: 그의 음성을 잘 듣고
  alternatives_korean:
  - 그의 음성을 확실히 듣고
  - 그의 음성을 반드시 듣고
  lexicon: HALOT
  rationale: 동사 반복으로 강조된 순종의 뉘앙스를 살리되, ‘듣다’와 순종의 결을 함께 담기 위해 ‘잘 듣고’로 옮겼습니다.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  english_pob_choice: and do all that I speak
  chosen_korean: 내가 말하는 모든 것을 행하면
  alternatives_korean:
  - 내가 말하는 모든 것을 하면
  - 내가 말하는 바를 다 행하면
  lexicon: HALOT
  rationale: 히브리어가 1인칭으로 전환되는 점을 살려 ‘내가 말하는’으로 옮겼고, ‘행하다’는 언약적 순종의 성격을 유지합니다.
- source_word: וְאָיַבְתִּי / וְצַרְתִּי
  english_pob_choice: I will be an enemy to your enemies and an adversary to your adversaries
  chosen_korean: 내가 너희의 원수들에게는 원수가 되고 너희의 적대자들에게는 적대자가 되겠습니다
  alternatives_korean:
  - 내가 너희의 원수들에게는 원수가 되고 너희의 적대자들에게는 대적이 되겠습니다
  - 내가 너희의 원수들을 대적하고 너희의 적대자들을 대적하겠습니다
  lexicon: HALOT
  rationale: 두 동사의 어근 반복을 한국어에서도 최대한 드러내기 위해 ‘원수/원수’, ‘적대자/적대자’로 대응시켜, 단순한 ‘대적하다’보다 어휘적 대칭을 보존했습니다.
theological_decisions:
- issue: ‘그의 음성’과 ‘내가 말하는’ 사이의 주어 전환
  chosen_reading: 두 표현의 긴밀한 연결을 그대로 두고, 화자를 하나로 평탄화하지 않았습니다.
  alternative_readings:
  - 둘 다 천사/사자를 가리키는 것으로 통일하기
  - 둘 다 직접적인 하나님의 말씀으로 매끄럽게 바꾸기
  rationale: 본문은 ‘그의 음성’과 ‘내가 말하는’ 사이의 긴장을 유지하여, 사자와 야훼의 발화가 밀접하게 연결됨을 드러냅니다. 이를 한국어에서도 해소하지 않는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
