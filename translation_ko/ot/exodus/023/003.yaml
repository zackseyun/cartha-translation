  verdict: revise
  source_fidelity: 히브리어는 가난한 사람(דָל)의 법적 다툼/소송(בְּרִיבוֹ)에서 그를 특별히 우대하거나 편들지 말라는 금지입니다. 개정문은 이 법정적 편파 금지를 보존하며, 본문이 일반적인 가난한 사람 존중을 금한다는 뜻으로 넓어지지 않게 합니다.
  naturalness: 초안의 ‘가난한 사람에게 그의 소송에서 편파적으로 대하지 마십시오’는 수식 관계가 다소 어색하고 ‘편파적으로 대하다’가 유리한 편듦인지 불리한 차별인지 선명하지 않습니다. ‘가난한 사람의 소송에서 그를 편들지 마십시오’가 현대 표준 한국어로 자연스럽고 법정 문맥도 분명합니다.
  terminology: ‘소송’은 רִיב의 법적 분쟁이라는 문맥에 적절합니다. ‘편들지 마십시오’는 여기의 Hiphil הדר가 나타내는 부당한 우대/편파의 의미를 자연스럽게 드러냅니다. 각주에서는 어근의 보다 문자적인 ‘높이다/존대하다’ 가능성을 유지하되, 한국어 ‘존대하다’가 단지 높임말을 쓴다는 의미로 오해될 가능성을 피했습니다.
  issues:
