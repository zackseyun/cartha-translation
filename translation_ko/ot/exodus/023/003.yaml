    issue: 본문의 ‘편파적으로 대하지 마십시오’는 편파의 방향과 법정에서의 편듦을 충분히 명료하게 드러내지 못합니다.
    rationale: 이 절은 가난한 사람에게 유리하게 편파를 보이는 일을 금합니다. ‘그를 편들지 마십시오’는 이 방향을 자연스럽고 직접적으로 표현합니다.
  - severity: low
    issue: ‘가난한 사람에게 그의 소송에서’의 어순과 조사 결합이 다소 부자연스럽습니다.
    rationale: ‘가난한 사람의 소송에서’로 사건의 소유 관계를 먼저 밝히면 문장이 더 매끄럽고 히브리어의 3인칭 소유 접미사도 반영됩니다.
  - severity: low
    issue: 각주의 ‘존대하다’는 현대 한국어에서 높임말을 사용한다는 뜻으로도 흔히 이해됩니다.
    rationale: 원문의 문자적 ‘honor’ 의미는 보존하되, ‘높여 주다’로 표현하면 법정적 우대라는 관련 의미를 더 잘 전달합니다.
