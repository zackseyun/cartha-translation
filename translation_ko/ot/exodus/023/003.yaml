  - 빈곤한 사람
  - 약한 사람
  lexicon: HALOT
  rationale: דָל은 경제적·사회적으로 낮은 처지의 사람을 가리키므로, 남성형 단수의 뉘앙스를 살리되 한국어에서는 성중립적인 '가난한 사람'이 자연스럽습니다.
- source_word: תֶהְדַּר
  english_pob_choice: show partiality
  chosen_korean: 편파적으로 대하지 마십시오
  alternatives_korean:
  - 편들지 마십시오
  - 특혜를 주지 마십시오
  - 존대하지 마십시오
  lexicon: HALOT
  rationale: 법정 문맥에서 הדר의 핵심은 '존대' 자체가 아니라 치우친 호의나 편향을 보이는 것이므로, 판정의 공정성을 드러내는 표현으로 옮겼습니다.
- source_word: בְּרִיבוֹ
  english_pob_choice: in his lawsuit
  chosen_korean: 그의 소송에서
  alternatives_korean:
  - 그의 분쟁에서
  - 그의 사건에서
  - 그의 다툼에서
  lexicon: HALOT
  rationale: רִיב는 여기서 법적 분쟁/소송을 가리키므로, 재판 맥락을 분명히 하는 '소송'이 가장 적절합니다.
theological_decisions:
- issue: 가난한 사람에 대한 편파 금지의 초점
  chosen_reading: 이 절은 가난한 사람을 일반적으로 존중하라는 말이 아니라, 재판에서 가난한 사람에게 유리하게 편파적으로 판정하지 말라는 금지로 읽었습니다.
  alternative_readings:
  - 가난한 사람을 존중하라는 일반 명령
  - 가난한 사람에게 불리하지 않게 하라는 균형 명령
  rationale: 직전 문맥이 법률 조항들의 연속이며, '그의 소송에서'가 재판 상황을 직접 지시하므로 공정한 재판의 금지를 유지하는 것이 본문에 가장 충실합니다.
  doctrine_reference: 원문 우선 원칙 및 문맥 우선 해석
