translation:
  language: ko
  text: 또한 가난한 사람의 소송에서 그를 편들지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가난한 사람의 소송에서 그를 높여 주지 마십시오.’ 히브리어 동사는 더 문자적으로는 ‘높이다’ 또는 ‘존중하다’를 뜻할 수 있지만, 이 법정 문맥에서는 편파적인 호의나 부당한 우대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  english_pob_choice: And
  chosen_korean: 또
  alternatives_korean:
  - 그리고
  - 또한
  lexicon: WLC
  rationale: 단순한 접속을 자연스럽게 살리면서 앞 절과 이어지는 금지 조항임을 드러내기 위해 '또'를 선택했습니다.
- source_word: דָל
  english_pob_choice: a poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
