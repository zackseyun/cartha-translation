  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דָ֕ל לֹ֥א תֶהְדַּ֖ר בְּ/רִיבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/003.yaml
  text: And you shall not show partiality to a poor man in his lawsuit[a].
  footnotes:
  - marker: a
    text: Or 'honor a poor man in his case.' The Hebrew verb can more literally mean 'honor,' but in this judicial context it refers to showing favoritism or partiality.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 가난한 사람에게 그의 소송에서 편파적으로 대하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그의 사건에서 가난한 사람을 존대하라.' 히브리어 동사는 더 문자적으로는 '존대하다'를 뜻할 수 있지만, 이 법정 문맥에서는 편파적 호의나 치우친 대우를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  english_pob_choice: And
  chosen_korean: 또
  alternatives_korean:
  - 그리고
  - 또한
  lexicon: WLC
  rationale: 단순한 접속을 자연스럽게 살리면서 앞 절과 이어지는 금지 조항임을 드러내기 위해 '또'를 선택했습니다.
- source_word: דָל
  english_pob_choice: a poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 빈곤한 사람
  - 약한 사람
  lexicon: HALOT
  rationale: דָל은 경제적·사회적으로 낮은 처지의 사람을 가리키므로, 남성형 단수의 뉘앙스를 살리되 한국어에서는 성중립적인 '가난한 사람'이 자연스럽습니다.
- source_word: תֶהְדַּר
  english_pob_choice: show partiality
  chosen_korean: 편파적으로 대하지 마십시오
  alternatives_korean:
  - 편들지 마십시오
  - 특혜를 주지 마십시오
  - 존대하지 마십시오
  lexicon: HALOT
  rationale: 법정 문맥에서 הדר의 핵심은 '존대' 자체가 아니라 치우친 호의나 편향을 보이는 것이므로, 판정의 공정성을 드러내는 표현으로 옮겼습니다.
- source_word: בְּרִיבוֹ
  english_pob_choice: in his lawsuit
  chosen_korean: 그의 소송에서
  alternatives_korean:
  - 그의 분쟁에서
  - 그의 사건에서
  - 그의 다툼에서
  lexicon: HALOT
  rationale: רִיב는 여기서 법적 분쟁/소송을 가리키므로, 재판 맥락을 분명히 하는 '소송'이 가장 적절합니다.
theological_decisions:
- issue: 가난한 사람에 대한 편파 금지의 초점
  chosen_reading: 이 절은 가난한 사람을 일반적으로 존중하라는 말이 아니라, 재판에서 가난한 사람에게 유리하게 편파적으로 판정하지 말라는 금지로 읽었습니다.
  alternative_readings:
  - 가난한 사람을 존중하라는 일반 명령
  - 가난한 사람에게 불리하지 않게 하라는 균형 명령
  rationale: 직전 문맥이 법률 조항들의 연속이며, '그의 소송에서'가 재판 상황을 직접 지시하므로 공정한 재판의 금지를 유지하는 것이 본문에 가장 충실합니다.
  doctrine_reference: 원문 우선 원칙 및 문맥 우선 해석
