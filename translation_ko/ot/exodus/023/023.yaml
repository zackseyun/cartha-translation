source:
  edition: WLC
  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
  footnotes:
  - marker: a
    text: Or 'my messenger.' The Hebrew מַלְאָךְ can refer to either a human or heavenly messenger; here 'angel' fits the context of divine guidance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'I will wipe him/it out,' with a singular suffix used collectively for the listed peoples; English renders the sense as 'them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 천사[a]가 당신보다 앞서 가서 아모리 사람들, 헷 사람들, 브리스 사람들, 가나안 사람들, 히위 사람들, 여부스 사람들에게 당신을 데려갈 것이며, 나는 그들을 없애 버리겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천사’로 옮긴 히브리어 말라크는 사람 사자 또는 천상적 사자를 가리킬 수 있습니다. 여기서는 하나님의 인도라는 문맥에 따라 ‘천사’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 열거된 민족들을 집합적으로 가리키는 단수형 접미사를 쓰지만, 한국어에서는 여러 민족을 받는 복수 표현이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִי
  english_pob_choice: my angel
  chosen_korean: 내 천사
  alternatives_korean:
  - 내 사자
  - 내 사신
  lexicon: HALOT
  rationale: מַלְאָךְ는 ‘사자/사신’이 될 수 있지만, 이 문맥은 신적 인도와 심판을 수행하는 존재이므로 POB의 ‘angel’에 맞춰 ‘천사’로 옮겼습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 당신보다 앞서
  alternatives_korean:
  - 당신 앞에서
  - 당신 앞서
  lexicon: HALOT
  rationale: 앞서 인도하는 의미를 자연스러운 현대 한국어로 살리기 위해 ‘당신보다 앞서’를 택했습니다.
- source_word: וֶהֱבִיאֲךָ
  english_pob_choice: and bring you
  chosen_korean: 당신을 데려갈 것이며
  alternatives_korean:
  - 당신을 인도할 것이며
  - 당신을 데려오겠습니다
  lexicon: HALOT
  rationale: בוא의 히필은 ‘가게 하다/데려가다’의 뜻이므로, 목적지로 데려가는 움직임을 드러내는 ‘데려갈’이 가장 직접적입니다.
- source_word: וְהִכְחַדְתִּיו
  english_pob_choice: and I will wipe them out
  chosen_korean: 그들을 없애 버리겠습니다
  alternatives_korean:
  - 그들을 멸하겠습니다
  - 그들을 쓸어 없애겠습니다
  lexicon: HALOT
  rationale: כחד는 ‘사라지게 하다, 없애다, 멸하다’의 뜻을 가지며, 목록 전체를 가리키는 집합적 의미를 한국어에서 자연스럽게 담기 위해 ‘그들을 없애 버리겠습니다’로 옮겼습니다.
theological_decisions:
- issue: מַלְאָךְ의 정체를 어떻게 처리할지
  chosen_reading: 본문 수준에서는 ‘내 천사’로만 두고, 그 존재를 더 규정하지 않았습니다.
  alternative_readings:
  - 내 사자
  - 야훼의 현현
  - 그리스도 전현현
  rationale: 원문은 이 존재를 단지 하나님의 천사로 제시하므로, 번역문이 신학적 해석을 앞서 확정하지 않도록 했습니다.
  doctrine_reference: 번역은 해석을 고정하지 않고 원문이 허용하는 긴장을 보존해야 합니다.
- issue: 히브리어 단수 접미사의 집합적 대상 처리
  chosen_reading: 열거된 민족들을 가리키는 집합적 의미를 따라 한국어에서는 복수 ‘그들을’로 처리했습니다.
  alternative_readings:
  - 그것을
  - 그를
  rationale: 히브리어는 단수형 접미사를 쓰지만, 문맥상 여러 민족을 집합적으로 가리키므로 한국어에서는 복수가 더 정확하고 자연스럽습니다.
  doctrine_reference: 문법 형태보다 문맥상 지시 대상을 우선해 의미를 보존합니다.
