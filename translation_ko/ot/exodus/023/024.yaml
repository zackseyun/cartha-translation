source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֤ה לֵ/אלֹֽהֵי/הֶם֙ וְ/לֹ֣א תָֽעָבְדֵ֔/ם וְ/לֹ֥א תַעֲשֶׂ֖ה כְּ/מַֽעֲשֵׂי/הֶ֑ם כִּ֤י הָרֵס֙ תְּהָ֣רְסֵ֔/ם וְ/שַׁבֵּ֥ר תְּשַׁבֵּ֖ר מַצֵּבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
  footnotes:
  - marker: a
    text: Or 'their sacred pillars' or 'their standing stones.' The Hebrew refers to cultic stone monuments associated with worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 그들의 신들에게 절하지 말고, 그들을 섬기지도 말며, 그들이 하는 대로 행하지도 마십시오. 오히려 그들의 우상들을 반드시 허물고, 그들의 기둥들을 산산이 부수십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 성스러운 기둥들’ 또는 ‘그들의 세운 돌들’입니다. 히브리어는 예배와 관련된 제의적 돌기둥을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  english_pob_choice: bow down
  chosen_korean: 절하지 말고
  alternatives_korean:
  - 엎드려 절하지 말고
  - 경배하지 말고
  lexicon: HALOT
  rationale: 히브리어는 단순한 내적 ‘예배’보다 몸을 낮추는 구체적 동작을 가리키므로, ‘절하다’가 가장 직접적으로 대응합니다.
- source_word: לֵאלֹהֵיהֶם
  english_pob_choice: to their gods
  chosen_korean: 그들의 신들에게
  alternatives_korean:
  - 그들의 신들 앞에
  - 그들의 신들께
  lexicon: HALOT
  rationale: ל + ‘그들의 신들’은 대상 방향을 나타내며, 한국어에서는 ‘~에게/에게 절하다’보다 ‘~에게 절하지 말다’보다도 ‘신들에게 절하다’가 자연스럽습니다.
- source_word: תָעָבְדֵם
  english_pob_choice: serve them
  chosen_korean: 그들을 섬기지도 말며
  alternatives_korean:
  - 그들에게 봉사하지도 말며
  - 그들을 예배하지도 말며
  lexicon: HALOT
  rationale: עבד는 여기서 종교적 섬김까지 포함하지만, 이미 앞 절의 ‘절하다’와 구별되는 두 번째 금지이므로 ‘섬기다’가 어휘적 대응을 살립니다.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  english_pob_choice: do according to their deeds
  chosen_korean: 그들의 행위를 따라 하지도 말며
  alternatives_korean:
  - 그들의 행실대로 하지도 말며
  - 그들이 하는 대로 하지도 말며
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 행위들에 따라 하다’이므로, 의미를 유지하면서도 한국어로 자연한 ‘따라 하다’를 택했습니다.
- source_word: מַצֵּבֹתֵיהֶם
  english_pob_choice: their pillars
  chosen_korean: 그들의 기둥들
  alternatives_korean:
  - 그들의 제단석들
  - 그들의 세운 돌들
  lexicon: HALOT
  rationale: מַצֵּבָה는 우상 숭배와 관련된 세운 돌/기둥을 가리키므로, 본문 의미를 살리되 간결한 ‘기둥들’로 옮겼습니다.
theological_decisions:
- issue: 금지 명령의 강도와 반복 구조
  chosen_reading: 두 개의 부정 명령(절하다, 섬기다)과 뒤의 행위 모방 금지를 모두 살리고, 이어지는 두 개의 강조된 파괴 명령도 ‘반드시’로 반영했습니다.
  alternative_readings:
  - 세 동사를 하나로 묶어 ‘예배하지 마십시오’로 처리
  - 강조부를 단순 명령으로 약화
  rationale: 히브리어의 반복과 강조형은 우상숭배 거절과 그 표적의 제거를 함께 요구하므로, 한국어에서도 강도를 유지해야 합니다.
  doctrine_reference: Translation philosophy items 1 and 5
