revisions:
- from: 너희는 그들의 신들에게 절하지 말고, 그들을 섬기지도 말며, 그들의 행위를 따라 하지도 마십시오. 오히려 그들을 반드시 무너뜨리고, 그들의 기둥들을 반드시 부숴 버리십시오.[a]
  to: 너희는 그들의 신들에게 절하지 말고, 그들을 섬기지도 말며, 그들이 하는 대로 행하지도 마십시오. 오히려 그들의 우상들을 반드시 허물고, 그들의 기둥들을 산산이 부수십시오.[a]
  rationale: 본문은 절하는 행위, 섬기는 행위, 그들의 관행을 본받는 행위를 각각 구별하여 금합니다. 두 파괴 동사의 강조형은 ‘반드시’와 ‘산산이’로 반영했습니다. 첫 파괴 명령은 문맥상 신들 자체가 아니라 그들과 연관된 우상적 숭배 표상을 겨냥하므로 ‘그들의 우상들’로 번역하여 한국어에서 생길 수 있는 오해를 피했습니다. 마지막의 מַצֵּבוֹת은 ‘기둥들’로 유지하고 제의적 세운 돌이라는 의미는 각주로 보완했습니다.
