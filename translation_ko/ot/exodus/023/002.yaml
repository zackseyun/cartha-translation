base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
  footnotes:
  - marker: a
    text: Or 'you shall not answer in a dispute to turn aside after the many, to bend judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 많은 사람을 따라 악을 행하지 말며, 소송에서 증언하여 많은 사람을 따라 치우쳐 정의를 굽히지 말아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘많은 사람을 따라… 치우치다’와 ‘많은 사람을 따라… 굽히다’를 병렬로 반복하여, 다수 추종과 판단 왜곡을 함께 경고합니다.
    reason: source_note
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  english_pob_choice: follow the many
  chosen_korean: 많은 사람을 따라
  alternatives_korean:
  - 다수자를 따라
  - 무리를 따라
  lexicon: HALOT
  rationale: אַחֲרֵי와 היה의 관용적 결합을 한국어의 ‘따라’로 자연스럽게 옮기고, רַבִּים의 다수 압력을 ‘많은 사람’으로 살렸습니다.
- source_word: לְרָעֹת
  english_pob_choice: to do evil
  chosen_korean: 악을 행하지 말며
  alternatives_korean:
  - 악을 행하려 하지 말며
  - 잘못을 행하지 말며
  lexicon: HALOT
  rationale: 목적/결과를 나타내는 ל를 반영해 금지문으로 처리했고, רָעֹת의 도덕적 강도를 살려 ‘악을 행하다’로 옮겼습니다.
- source_word: תַעֲנֶה עַל רִיב
  english_pob_choice: testify in a dispute
  chosen_korean: 소송에서 증언하여
  alternatives_korean:
  - 분쟁에서 증언하여
  - 법정 다툼에서 대답하여
  lexicon: HALOT
  rationale: 법적 상황에서 ענה는 증언 행위를 가리킬 수 있으므로, רִיב의 송사/법적 분쟁 뉘앙스를 살려 ‘소송에서 증언하다’로 구체화했습니다.
- source_word: לִנְטֹת ... לְהַטֹּת
  english_pob_choice: so as to turn aside ... to pervert justice
  chosen_korean: 치우쳐 정의를 굽히지
  alternatives_korean:
  - 돌아서서 ... 판단을 굽히지
  - 기울어 ... 판결을 굽히지
  lexicon: HALOT
  rationale: נטה의 ‘기울다/돌아서다’ 이미지를 한국어의 ‘치우치다’로 옮기고, המשפט적 결과를 ‘정의를 굽히다’로 풀어 법정적 의미를 분명히 했습니다.
theological_decisions:
- issue: 마지막 절의 법정적 객체를 한국어에서 명시할지 여부
  chosen_reading: ‘정의를 굽히지’로 옮겨, 본문이 전제하는 판정/정의의 왜곡을 드러냈습니다.
  alternative_readings:
  - 판결을 굽히지
  - 공의를 굽히지
  rationale: 히브리어는 간결하지만 앞의 ‘증언’과 ‘소송’ 문맥이 법정적이므로, 영어 POB의 해석을 따라 한국어에서도 객체를 보충해 의미를 명료하게 했습니다.
  doctrine_reference: Translation philosophy §1, §5
