    rationale: 히브리어의 법정적 ‘굽힘/왜곡’은 판결 또는 재판의 왜곡으로 표현하는 편이 현대 한국어에서 더 자연스럽습니다.
  - severity: low
    issue: 원문의 간결하고 다소 논쟁적인 후반 구문을 설명할 각주가 충분히 반영하지 못함
