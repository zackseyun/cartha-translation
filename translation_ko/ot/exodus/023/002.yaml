    issue: 둘째 금지문의 구문 관계가 불명확함
    rationale: ‘소송에서 증언하여 많은 사람을 따라 치우쳐’는 무엇을 위해 증언하는지와 ‘많은 사람을 따라’가 어느 동사에 걸리는지를 매끄럽게 전달하지 못합니다.
