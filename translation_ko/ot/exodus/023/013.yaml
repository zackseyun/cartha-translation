  source_fidelity: 첫 절의 תִּשָּׁמֵרוּ는 앞서 말한 모든 명령에 관해 스스로 주의하고 지키라는 포괄적 명령입니다. 초안의 ‘조심하십시오’는 가능하지만 목적 범위가 다소 불분명합니다. 또한 각주 a가 첫 문장에 붙어 있으면서 내용은 ‘다른 신들의 이름’에 관한 것이어서 본문과 각주의 연결이 잘못되었습니다. 둘째 금령은 ‘언급하다’와 ‘입에서 들리다’의 병렬을 유지하는 편이 원문에 더 가깝습니다.
  naturalness: ‘내가 너희에게 말한 모든 것을 잘 지키십시오’와 ‘그 이름이 너희 입에서 들려서는 안 됩니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 후자는 이름을 명시하여 ‘들리다’의 주체가 불명확해지는 것을 막습니다.
