translation:
  language: ko
  text: 내가 너희에게 말한 모든 것에 대하여는 조심하십시오[a]. 다른 신들의 이름은 부르지 말아야 하며, 너희 입에서 들려서도 안 됩니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 구체적으로는 ‘다른 신들의 이름을 부르지 말라’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희 입 위에서 들리지 않을 것이다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  english_pob_choice: In all that I have said to you
  chosen_korean: 내가 너희에게 말한 모든 것에 대하여는
  alternatives_korean:
  - 내가 너희에게 말한 모든 일에 대하여는
  - 내가 너희에게 이른 모든 것에 대하여는
  lexicon: HALOT
  rationale: בְכֹל의 포괄적 범위를 살리면서, 이어지는 경고문의 조건절로 자연스럽게 연결되도록 ‘모든 것에 대하여는’으로 옮겼습니다.
- source_word: תִּשָּׁמֵרוּ
  english_pob_choice: be careful
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 주의하십시오
  - 스스로 삼가십시오
  - 깨어 있으십시오
  lexicon: HALOT
  rationale: 니팔형의 ‘스스로 주의하다/삼가다’ 뉘앙스를 현대 한국어 명령문으로 자연스럽게 살렸습니다.
- source_word: לֹא תַזְכִּירוּ
  english_pob_choice: you shall not mention
  chosen_korean: 이름은 부르지 말아야 하며
  alternatives_korean:
  - 이름은 언급하지 말아야 하며
  - 이름을 거론하지 말아야 하며
  - 이름을 부르지 말아야 하며
  lexicon: HALOT
  rationale: 히필 זכר는 단순 ‘언급’보다 이름을 입에 올리는 행위를 포함할 수 있어, 한국어에서는 ‘이름은 부르다’가 문맥상 더 직접적입니다.
- source_word: לֹא יִשָּׁמַע עַל פִּיךָ
  english_pob_choice: it shall not be heard on your lips
  chosen_korean: 너희 입에서 들려서도 안 됩니다
  alternatives_korean:
  - 너희 입에서 들려서는 안 됩니다
  - 너희 입에서 들리면 안 됩니다
  - 너희 입에 오르지도 않아야 합니다
  lexicon: HALOT
  rationale: 직역의 ‘입 위에’ 이미지를 그대로 살리기보다, 한국어의 자연스러운 금지 표현으로 옮기되 ‘들리다’로 구술 행위를 유지했습니다.
theological_decisions:
- issue: 다른 신들의 이름을 금지하는 범위
  chosen_reading: 본문이 말하는 금지를 ‘다른 신들의 이름을 입에 올리거나 들리게 하는 행위’로 보존하고, 그 범위를 제의적 ‘호명 금지’로 더 좁혀 확정하지는 않았습니다.
  alternative_readings:
  - 다른 신들의 이름을 단순히 언급하지 말라는 일반 금지
  - 다른 신들의 이름을 부르며 예배적으로 호출하는 것을 금지
  rationale: 히브리어 본문은 언급과 청취를 금하지만, 여기서 곧바로 모든 가능한 맥락(일상 언급, 제의적 호출, 선서 등)을 하나로 확정하지는 않으므로, 번역도 그 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
