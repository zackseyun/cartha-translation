translation:
  language: ko
  text: 내가 네 앞에 말벌[a]을 보내겠습니다. 그것이 히위 사람과 가나안 사람과 헷 사람을 네 앞에서 몰아낼 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 두려움이나 하나님께서 이스라엘보다 앞서 보내시는 다른 형태의 압박을 가리키는 비유적 표현일 수도 있습니다. 히브리어 단어는 보통 ‘말벌’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  english_pob_choice: And I will send
  chosen_korean: 내가 ... 보내리니
  alternatives_korean:
  - 내가 ... 보내겠습니다
  - 내가 ... 보낼 것입니다
  lexicon: HALOT
  rationale: 완료형 1인칭 단수의 약속을 한국어 미래 약속형으로 옮기되, 하나님의 선언 어조를 살리기 위해 ‘보내리니’를 택했습니다.
- source_word: הַצִּרְעָה
  english_pob_choice: the hornet
  chosen_korean: 말벌
  alternatives_korean:
  - 말벌떼
  - 말벌
  lexicon: HALOT
  rationale: 어휘의 기본 의미를 살려 직역하되, 한국어에서 가장 자연스러운 곤충명인 ‘말벌’로 옮겼습니다.
- source_word: לְפָנֶיךָ / מִלְּפָנֶיךָ
  english_pob_choice: ahead of you / from before you
  chosen_korean: 너보다 앞서 / 네 앞에서
  alternatives_korean:
  - 너 앞에 / 네 앞에서
  - 너의 앞에서 / 너의 앞에서
  lexicon: HALOT
  rationale: 두 구절이 반복하는 공간 관용구를 살려, 선행과 제거의 뜻이 드러나도록 ‘앞서’와 ‘앞에서’로 구분했습니다.
- source_word: וְגֵרְשָׁה
  english_pob_choice: and it will drive out
  chosen_korean: 몰아내리라
  alternatives_korean:
  - 쫓아내리라
  - 내쫓으리라
  lexicon: HALOT
  rationale: גרשׁ의 핵심 의미인 ‘drive out/expel’을 자연스러운 현대 한국어로 옮겼고, 원문에 맞게 주어는 말벌로 이어지게 했습니다.
theological_decisions:
- issue: 해당 ‘말벌’을 문자적 곤충으로 볼지 상징적 압박으로 볼지
  chosen_reading: 본문에는 ‘말벌’을 그대로 두고, 상징적 가능성은 본문 밖 주석으로 처리했습니다.
  alternative_readings:
  - 두려움이나 압박의 비유로 풀어 쓰는 번역
  - 집단적 재앙을 암시하는 해석적 번역
  rationale: 히브리어 어휘의 표면적 의미가 곤충을 가리키므로, 원문 우선 원칙에 따라 본문은 직역을 유지하고 해석적 확장은 본문 밖으로 보류하는 것이 적절합니다.
  doctrine_reference: 번역 철학 §1, §3
