  - marker: b
    text: Or 'for I will not acquit the guilty.' The Hebrew verb is forensic and can mean 'declare righteous,' 'justify,' or 'acquit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 거짓된 일에서 멀리하십시오[a]. 무죄한 자와 의로운 자를 죽여서는 안 됩니다. 이는 내가 악인을 의롭다고 하지 않을 것이기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓 고발에서’, ‘거짓말에서’로도 옮길 수 있습니다. 히브리어 דָּבָר는 ‘말’보다 넓은 뜻으로, 법적 사안이나 소송까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 악인을 무죄로 선언하지 않을 것이기 때문입니다.’ 히브리어 동사는 법정적 의미로 ‘의롭다 하다’, ‘무죄로 선언하다’, ‘무죄 판결을 내리다’로 옮길 수 있습니다.
    reason: lexical_alternative
