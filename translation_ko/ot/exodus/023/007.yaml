  - 멀리하십시오
  lexicon: HALOT
  rationale: 명령형의 힘을 살리면서도 현대 한국어에서 가장 자연스러운 금지·권고 표현으로 옮겼습니다.
- source_word: וְנָקִי וְצַדִּיק
  english_pob_choice: the innocent and the righteous
  chosen_korean: 무죄한 자와 의로운 자
  alternatives_korean:
  - 무고한 자와 의로운 자
  - 결백한 자와 의로운 자
  - 무죄한 자와 의인
  lexicon: HALOT
  rationale: נָקִי의 ‘죄가 없음’과 צַדִּיק의 ‘의로운/의인’의 대조를 한국어 법률·윤리 어휘로 자연스럽게 드러냈습니다.
- source_word: לֹא אַצְדִּיק רָשָׁע
  english_pob_choice: I will not justify the wicked
  chosen_korean: 내가 악인을 의롭다 하지 않을 것이기 때문입니다
  alternatives_korean:
  - 내가 악인을 무죄로 선언하지 않을 것이기 때문입니다
  - 내가 악인을 인정하지 않을 것이기 때문입니다
  - 내가 악인을 용서하지 않을 것이기 때문입니다
  lexicon: HALOT
  rationale: צדק 계열의 법정적 의미를 살려 ‘의롭다 하다’로 옮기면, 바로 앞의 ‘의로운 자’와 어근 연결이 유지됩니다.
theological_decisions:
- issue: צדק 어근의 법정적 의미 보존
  chosen_reading: 의롭다 하지 않을 것입니다
  alternative_readings:
  - 무죄로 선언하지 않을 것입니다
  - 무죄로 인정하지 않을 것입니다
  rationale: 본문은 인간에게 거짓 재판을 멀리하라고 명하고, 그 근거를 하나님의 공의로운 판결에 둡니다. ‘의롭다 하다’는 선언적·법정적 뉘앙스와 צַדִּיק/אַצְדִּיק의 어근 연관을 함께 살립니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
