  - 거짓에서
  lexicon: HALOT
  rationale: דָּבָר의 범위가 ‘말’보다 넓어 법적 ‘일/사안’까지 포괄하므로, 한국어에서는 자연스러운 ‘일’로 넓이를 살렸습니다.
- source_word: תִּרְחָק
  english_pob_choice: Keep far
  chosen_korean: 멀리하십시오
