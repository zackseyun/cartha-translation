lexical_decisions:
- source_word: לֹא תִכְרֹת
  english_pob_choice: You shall make no covenant
  chosen_korean: 언약을 맺지 말아야 합니다
  alternatives_korean:
  - 언약을 자르지 말아야 합니다
  - 언약을 세우지 말아야 합니다
  lexicon: HALOT
  rationale: כרת ברית는 문자적으로 ‘언약을 자르다’이지만, 한국어에서는 ‘언약을 맺다’가 법적·관계적 의미를 가장 자연스럽고 정확하게 전달합니다.
- source_word: לָהֶם
  english_pob_choice: with them
  chosen_korean: 그들과
  alternatives_korean:
  - 그들과 더불어
  - 그들과 함께
  lexicon: HALOT
  rationale: 언약의 상대를 나타내는 전치사 ל의 용법을 한국어 조사 ‘-과/와’로 간결하게 옮겼습니다.
- source_word: וְלֵאלֹהֵיהֶם
  english_pob_choice: or with their gods
  chosen_korean: 그들의 신들과
  alternatives_korean:
  - 그들의 신들과도
  - 그리고 그들의 신들과
  lexicon: HALOT
  rationale: 복수형 ‘신들’을 그대로 살려 이방 신들을 가리키는 점을 분명히 했고, 한국어에서는 부정 병렬의 자연스러운 형태로 연결했습니다.
- source_word: בְּרִית
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 조약
  lexicon: HALOT
  rationale: ברית의 신학적 무게를 살리기 위해 일반적인 ‘계약/조약’보다 성경 문맥에 맞는 ‘언약’을 선택했습니다.
