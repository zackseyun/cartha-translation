  terminology: ‘땅’, ‘거주하다’, ‘죄짓게 하다’, ‘신들’, ‘섬기다’, ‘덫’은 문맥과 원어 의미에 적절합니다. ‘올무’도 가능하나, 여기서는 기존의 자연스러운 ‘덫’을 유지합니다.
