id: EXO.23.33
reference: Exodus 23:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א יֵשְׁבוּ֙ בְּ/אַרְצְ/ךָ֔ פֶּן יַחֲטִ֥יאוּ אֹתְ/ךָ֖ לִ֑/י כִּ֤י תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי יִהְיֶ֥ה לְ/ךָ֖ לְ/מוֹקֵֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
  footnotes:
  - marker: a
    text: Or, 'they make you sin against me' or 'they lead you into sin against me.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'for you would serve their gods'; the Hebrew conjunction can be understood as explanatory, and the clause may be read as the likely outcome rather than a simple condition.
    reason: alternative_reading
  - marker: c
    text: '''Snare'' translates Hebrew moqesh, a trap metaphorically describing something that leads to ruin or apostasy.'
    reason: cultural_note
translation:
  language: ko
  text: 그들이 당신의 땅에 거주하게 해서는 안 됩니다. 그들이 당신을 나에게 죄짓게 할까[a] 하기 때문입니다. 당신이 그들의 신들을 섬기면[b], 그것이 당신에게 덫[c]이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 당신을 나에게 죄짓게 할까 봐’, ‘그들이 당신을 나에게 죄에 빠뜨릴까 봐’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신은 그들의 신들을 섬기게 될 것이므로’로 읽을 수 있습니다. 히브리어 접속사는 설명적 의미를 띨 수 있으며, 이 절은 단순 조건문보다 예상되는 결과를 나타내는 것으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘덫’은 히브리어 모케쉬(moqesh)를 옮긴 말입니다. 이는 파멸이나 배교로 이끄는 함정을 비유적으로 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ
  english_pob_choice: dwell
  chosen_korean: 거주해서는 안 됩니다
  alternatives_korean:
  - 살아서는 안 됩니다
  - 머물러서는 안 됩니다
  - 정착해서는 안 됩니다
  lexicon: HALOT
  rationale: ישׁב의 지속적 거주 의미를 살려, 단순한 체류보다 ‘거주하다’가 문맥상 자연스럽고 규범적 금지를 분명히 드러냅니다.
- source_word: בְּאַרְצְךָ
  english_pob_choice: in your land
  chosen_korean: 당신의 땅
  alternatives_korean:
  - 당신의 나라
  - 당신의 지역
  lexicon: HALOT
  rationale: אֶרֶץ는 이 출애굽기 문맥에서 언약적·토지적 의미의 ‘땅’이 적절하며, ‘나라’보다 원문 범위를 더 정확히 반영합니다.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  english_pob_choice: cause you to sin against me
  chosen_korean: 당신을 나에게 죄짓게 할까 두렵습니다
  alternatives_korean:
  - 당신이 나에게 죄짓게 할 것입니다
  - 당신을 나에게 죄에 빠뜨릴 것입니다
  lexicon: HALOT
  rationale: 히필형 חטא의 사역 의미를 ‘죄짓게 하다’로 살리고, לִי는 단순한 ‘나에게’보다 관계적·윤리적 방향을 분명히 하는 ‘나에게 죄짓게’로 옮겼습니다.
- source_word: אֱלֹהֵיהֶם
  english_pob_choice: their gods
  chosen_korean: 그들의 신들
  alternatives_korean:
  - 그들의 신격들
  - 그들의 신들
  lexicon: HALOT
  rationale: 복수형 ‘신들’이 우상숭배의 다신적 대상을 सीधे 반영하며, 문맥의 대립을 가장 सीधे 전달합니다.
- source_word: מוֹקֵשׁ
  english_pob_choice: snare
  chosen_korean: 덫
  alternatives_korean:
  - 올무
  - 함정
  - 덫이 될 것입니다
  lexicon: HALOT
  rationale: מוֹקֵשׁ의 비유적 위험성을 한국어로 자연스럽게 살리기 위해 ‘덫’을 택했고, 결과문 구조는 ‘될 것입니다’로 명시했습니다.
theological_decisions:
- issue: 우상숭배와 죄의 관계
  chosen_reading: 본문은 이방 신 숭배가 야훼께 대한 언약적 불순종과 직접 연결된다고 분명히 말합니다.
  alternative_readings:
  - 단순한 문화적 동화에 대한 경고
  - 일반적인 도덕적 타락에 대한 경고
  rationale: ‘그들의 신들을 섬기면’이라는 뒤따르는 절이 경고의 구체적 내용을 규정하므로, 경고를 민족적 분리나 일반 도덕성으로 희석하지 않았습니다.
  doctrine_reference: 본문이 지시하는 신학적 긴장을 유지하고, 문맥이 말하지 않는 일반화를 피합니다.
