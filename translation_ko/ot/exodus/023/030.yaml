  chosen_reading: 한국어 본문에서는 문맥의 집합적 의미를 드러내기 위해 ‘그것들’을 사용했습니다.
  alternative_readings:
  - ‘그를’로 단수형을 보존함
  - ‘그들을’로 복수 의미를 직접 드러냄
  rationale: 원문은 문법적으로 단수 접미사를 가지지만, 가리키는 대상은 가나안의 주민/민족 전체이므로 한국어에서는 독자가 즉시 이해할 수 있도록 집합적 복수로 풀었습니다.
  doctrine_reference: Translation philosophy §5 (source transparency with documented exception)
