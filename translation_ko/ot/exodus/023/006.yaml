- from: 당신의 가난한 사람의 소송에서 그의 권리를 굽게 해서는 안 됩니다.[a]
  to: 가난한 사람이 소송할 때 그가 마땅히 받을 판결을 왜곡하지 마십시오.[a]
  rationale: 개정은 원문의 법정적 금지와 ‘가난한 사람에게 마땅한 משפט’이라는 의미를 보존합니다. 동시에 직역투인 ‘당신의 가난한 사람’과 비자연스러운 ‘권리를 굽게 하다’를 현대 표준 한국어의 자연스러운 합쇼체 법률 문장으로 고쳤습니다. ‘당신의’는 한국어에서 부자연스러운 소유 표현을 피했지만, 가난한 소송 당사자를 가리키는 원문의 지시 대상은 유지됩니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:43:21Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 ‘너의 가난한 사람’의 법적 다툼에서 그의 מִשְׁפָּט, 곧 그에게 마땅한 법적 판결 또는 권리를 ‘굽게/왜곡하지 말라’고 금합니다. 개정문은 법정 맥락과 소유·수혜 관계를 유지하면서도, 원문의 비유적 동사 נטה를 한국어 법률 문맥에 자연스러운 ‘왜곡하다’로 옮깁니다.
  naturalness: 현행 ‘당신의 가난한 사람의 소송에서 그의 권리를 굽게 해서는 안 됩니다’는 ‘당신의 가난한 사람’과 ‘권리를 굽게 하다’가 현대 표준 한국어에서 부자연스럽습니다. ‘가난한 사람이 소송할 때 그가 마땅히 받을 판결을 왜곡하지 마십시오’는 의미를 명료하고 자연스럽게 전달하며 합쇼체에 맞습니다.
  terminology: מִשְׁפָּט은 이 문맥에서 단순한 추상적 정의보다 소송에서 당사자가 받아야 할 정당한 판결/법적 권리를 가리킵니다. 본문에서는 ‘그가 마땅히 받을 판결’로 구체화했습니다. רִיב은 법적 다툼을 포함하므로 ‘소송’이 적절합니다.
  issues:
