    issue: ‘당신의 가난한 사람’은 한국어에서 어색하며, 소유 관계를 부적절하게 들리게 할 수 있습니다.
    rationale: 히브리어 2인칭 접미사는 수신자 공동체와 관련된 가난한 사람을 가리키지만, 한국어에서 이를 ‘당신의 사람’으로 기계적으로 옮기면 자연스러운 법률·성서 문체가 훼손됩니다.
  - severity: medium
    issue: ‘그의 권리를 굽게 하다’는 משפט과 נטה의 결합을 자연스럽게 전달하지 못합니다.
    rationale: 법적 권리나 판결은 한국어에서 일반적으로 ‘왜곡하다’, ‘부당하게 처리하다’ 등으로 표현합니다. ‘그가 마땅히 받을 판결을 왜곡하다’는 원문의 법정적 의미를 보존합니다.
  - severity: low
