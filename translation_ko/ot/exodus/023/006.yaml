lexical_decisions:
- source_word: לֹא תַטֶּה
  english_pob_choice: You shall not pervert
  chosen_korean: 굽게 해서는 안 됩니다
  alternatives_korean:
  - 비틀어서는 안 됩니다
  - 왜곡해서는 안 됩니다
  - 굽히지 마십시오
  lexicon: HALOT
  rationale: נטה의 사법적 용법을 반영해 판결이나 권리를 ‘굽게 하다’는 식으로 표현했으며, 단순한 방향 전환보다 공정성의 훼손을 드러냅니다.
- source_word: מִשְׁפַּט
  english_pob_choice: the justice due to
  chosen_korean: 권리
  alternatives_korean:
  - 정당한 판결
  - 공의
  - 사법적 권리
  lexicon: HALOT
  rationale: 이 문맥에서 מִשְׁפָּט은 추상적 ‘정의’보다 법적으로 마땅히 받아야 할 판정·권리를 가리키므로, 한국어로는 자연스럽게 ‘권리’로 옮겨 법정 맥락을 살렸습니다.
- source_word: אֶבְיֹנְךָ
  english_pob_choice: your poor person
  chosen_korean: 당신의 가난한 사람
  alternatives_korean:
  - 당신의 가난한 자
  - 당신의 가난한 사람
  - 당신의 가난한 이
  lexicon: HALOT
  rationale: אֶבְיוֹן의 의미를 직역하면서도 현대 한국어에서 이해되는 표현으로 옮겼고, 2인칭 단수 소유격은 ‘당신의’로 분명히 유지했습니다.
- source_word: בְּרִיבוֹ
  english_pob_choice: in his dispute
  chosen_korean: 소송에서
  alternatives_korean:
  - 다툼에서
  - 분쟁에서
  - 그의 소송에서
  lexicon: HALOT
  rationale: רִיב은 단순한 다툼보다 법적 쟁송을 포함하므로, 본문 전체의 재판 맥락을 드러내는 ‘소송’이 가장 적절합니다.
theological_decisions:
- issue: 가난한 사람에 대한 차별을 금하는가, 아니면 가난한 사람에게 유리한 편파를 요구하는가
  chosen_reading: 본문은 가난한 사람의 소송에서 그가 마땅히 받아야 할 재판상의 권리를 빼앗지 말라는 금지입니다.
  alternative_readings:
  - 가난한 사람을 일반적으로 억압하지 말라는 넓은 사회 윤리로 옮길 수 있습니다.
  rationale: 히브리어는 ‘권리/판결’에 해당하는 מִשְׁפַּט을 ‘굽게 하지 말라’고 하며, 문맥상 재판의 공정성을 다루므로 사회적 구호로 희석하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §4, §6
