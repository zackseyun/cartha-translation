  - 너를 데리고 가게 하겠습니다
  lexicon: HALOT
  rationale: 히필형의 '가게 하다/데려오게 하다'라는 원인적 의미를 살리면서, 목적지로의 인도라는 흐름을 자연스럽게 표현했습니다.
- source_word: הַמָּקוֹם
  english_pob_choice: the place
  chosen_korean: 곳
  alternatives_korean:
  - 장소
  - 그 곳
  lexicon: HALOT
  rationale: 이미 언급된 약속의 목적지를 가리키므로 한국어에서는 군더더기 없이 '곳'이 가장 자연스럽습니다.
theological_decisions:
- issue: מַלְאָךְ의 신학적 정체를 본문에서 어떻게 드러낼 것인가
  chosen_reading: 본문에서는 정체를 규정하지 않고 '한 천사'로 옮겨, 보호와 인도의 역할만 드러냈습니다.
  alternative_readings:
  - 한 사자
  - 여호와의 사자
  rationale: 히브리어 본문 자체는 기능과 파송만 밝히며, 더 구체적인 신학적 동일시는 본문의 범위를 넘어섭니다. 따라서 해석을 과도하게 앞서가지 않도록 했습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 맥락이 추가하는 해석은 주석으로 남깁니다.
