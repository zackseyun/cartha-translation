  - 한 메신저
  lexicon: HALOT
  rationale: 문맥상 하나님이 보내는 초자연적 존재로 읽는 것이 가장 자연스러워, 본문에는 '천사'를 두고 대안 의미는 각주로 보존했습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 너보다 앞서
  alternatives_korean:
  - 너 앞에
  - 너 앞서
  lexicon: HALOT
  rationale: 단순한 위치보다 선행하여 인도하는 기능을 드러내기 위해 '앞서'를 택했고, 'before you'의 선행성을 자연스럽게 살렸습니다.
- source_word: לִשְׁמָרְךָ
  english_pob_choice: to guard you
  chosen_korean: 너를 지키고
