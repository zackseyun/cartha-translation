id: EXO.23.20
reference: Exodus 23:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֨ה אָנֹכִ֜י שֹׁלֵ֤חַ מַלְאָךְ֙ לְ/פָנֶ֔י/ךָ לִ/שְׁמָרְ/ךָ֖ בַּ/דָּ֑רֶךְ וְ/לַ/הֲבִ֣יאֲ/ךָ֔ אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר הֲכִנֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
  footnotes:
  - marker: a
    text: Or 'a messenger.' The Hebrew מַלְאָךְ can mean either a human messenger or an angelic messenger; here 'angel' best fits the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 너보다 앞서 한 천사를 보내어, 길에서 너를 지키고 내가 예비한 곳으로 너를 데려가게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '사자'. 히브리어 מַלְאָךְ는 사람 사자나 천사를 가리킬 수 있는데, 여기서는 문맥상 '천사'가 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  lexicon: HALOT
  rationale: 주의를 환기하는 감탄사로서 장중한 호소력을 살리되, 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: מַלְאָךְ
  english_pob_choice: an angel
  chosen_korean: 한 천사
  alternatives_korean:
  - 한 사자
  - 한 메신저
  lexicon: HALOT
  rationale: 문맥상 하나님이 보내는 초자연적 존재로 읽는 것이 가장 자연스러워, 본문에는 '천사'를 두고 대안 의미는 각주로 보존했습니다.
- source_word: לְפָנֶיךָ
  english_pob_choice: before you
  chosen_korean: 너보다 앞서
  alternatives_korean:
  - 너 앞에
  - 너 앞서
  lexicon: HALOT
  rationale: 단순한 위치보다 선행하여 인도하는 기능을 드러내기 위해 '앞서'를 택했고, 'before you'의 선행성을 자연스럽게 살렸습니다.
- source_word: לִשְׁמָרְךָ
  english_pob_choice: to guard you
  chosen_korean: 너를 지키고
  alternatives_korean:
  - 너를 보호하고
  - 너를 보살피고
  lexicon: HALOT
  rationale: 여정 중 보호의 의미를 가장 직접적으로 드러내는 동사로 '지키다'를 사용했습니다.
- source_word: וְלַהֲבִיאֲךָ
  english_pob_choice: and to bring you
  chosen_korean: 너를 데려가게 하겠습니다
  alternatives_korean:
  - 너를 이끌어 가게 하겠습니다
  - 너를 데리고 가게 하겠습니다
  lexicon: HALOT
  rationale: 히필형의 '가게 하다/데려오게 하다'라는 원인적 의미를 살리면서, 목적지로의 인도라는 흐름을 자연스럽게 표현했습니다.
- source_word: הַמָּקוֹם
  english_pob_choice: the place
  chosen_korean: 곳
  alternatives_korean:
  - 장소
  - 그 곳
  lexicon: HALOT
  rationale: 이미 언급된 약속의 목적지를 가리키므로 한국어에서는 군더더기 없이 '곳'이 가장 자연스럽습니다.
theological_decisions:
- issue: מַלְאָךְ의 신학적 정체를 본문에서 어떻게 드러낼 것인가
  chosen_reading: 본문에서는 정체를 규정하지 않고 '한 천사'로 옮겨, 보호와 인도의 역할만 드러냈습니다.
  alternative_readings:
  - 한 사자
  - 여호와의 사자
  rationale: 히브리어 본문 자체는 기능과 파송만 밝히며, 더 구체적인 신학적 동일시는 본문의 범위를 넘어섭니다. 따라서 해석을 과도하게 앞서가지 않도록 했습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 맥락이 추가하는 해석은 주석으로 남깁니다.
