source:
  edition: WLC
  text: הִנֵּ֨ה אָנֹכִ֜י שֹׁלֵ֤חַ מַלְאָךְ֙ לְ/פָנֶ֔י/ךָ לִ/שְׁמָרְ/ךָ֖ בַּ/דָּ֑רֶךְ וְ/לַ/הֲבִ֣יאֲ/ךָ֔ אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר הֲכִנֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
  footnotes:
  - marker: a
    text: Or 'a messenger.' The Hebrew מַלְאָךְ can mean either a human messenger or an angelic messenger; here 'angel' best fits the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 네 앞에 한 천사를 보내겠습니다. 그가 길에서 너를 지키고, 내가 예비한 곳으로 너를 데려갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사자(使者)’ 또는 ‘전령’. 히브리어 מַלְאָךְ는 사람 전령이나 천사를 가리킬 수 있는데, 여기서는 문맥상 ‘천사’가 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  lexicon: HALOT
  rationale: 주의를 환기하는 감탄사로서 장중한 호소력을 살리되, 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: מַלְאָךְ
  english_pob_choice: an angel
  chosen_korean: 한 천사
  alternatives_korean:
