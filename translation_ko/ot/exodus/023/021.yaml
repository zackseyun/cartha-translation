language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִשָּׁ֧מֶר מִ/פָּנָ֛י/ו וּ/שְׁמַ֥ע בְּ/קֹל֖/וֹ אַל תַּמֵּ֣ר בּ֑/וֹ כִּ֣י לֹ֤א יִשָּׂא֙ לְ/פִשְׁעֲ/כֶ֔ם כִּ֥י שְׁמִ֖/י בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
  footnotes:
  - marker: a
    text: Or 'my name is in him,' 'my name is upon him,' or more interpretively, 'he bears my name.' The phrase signals delegated divine authority, but the verse does not explicitly define the messenger's exact nature.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 경계하십시오[a]—그의 목소리에 귀를 기울이십시오. 그에게 반역하지 마십시오. 그가 여러분의 범법을 용서하지 않을 것이기 때문입니다. 내 이름이 그 안에 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를 경계하십시오’는 문자적으로는 ‘그의 앞에서/그를 향하여 조심하십시오’에 가깝습니다. 이 문맥은 단순 주의보다 경고의 강도가 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  english_pob_choice: Be on your guard
  chosen_korean: 경계하십시오
  alternatives_korean:
  - 주의하십시오
  - 조심하십시오
  - 경계하시오
  lexicon: HALOT
  rationale: 니팔 명령형의 경고·경계 의미를 살리면서, 현대 합쇼체에서 자연스럽고 단호한 명령으로 옮겼습니다.
- source_word: וּשְׁמַע בְּקֹלוֹ
  english_pob_choice: and listen to his voice
  chosen_korean: 그의 목소리에 귀를 기울이십시오
  alternatives_korean:
  - 그의 음성을 들으십시오
  - 그에게 순종하십시오
  - 그의 목소리를 들으십시오
  lexicon: HALOT
  rationale: 직역에 가까운 ‘목소리/음성’의 연결을 유지하면서도, 청종의 뉘앙스가 드러나도록 ‘귀를 기울이십시오’로 옮겼습니다.
- source_word: אַל תַּמֵּר בּוֹ
  english_pob_choice: Do not rebel against him
  chosen_korean: 그에게 반역하지 마십시오
  alternatives_korean:
  - 그를 거역하지 마십시오
  - 그에게 대항하지 마십시오
  - 그에게 불순종하지 마십시오
  lexicon: HALOT
  rationale: מרה의 강한 반항·거역 의미를 보존하기 위해, 단순한 불순종보다 더 강한 ‘반역’으로 옮겼습니다.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  english_pob_choice: he will not pardon your transgression
  chosen_korean: 그가 여러분의 범법을 용서하지 않을 것이기 때문입니다
  alternatives_korean:
  - 그가 여러분의 죄를 사하지 않을 것이기 때문입니다
  - 그가 여러분의 범죄를 용서하지 않을 것이기 때문입니다
  - 그가 여러분의 허물을 덮지 않을 것이기 때문입니다
  lexicon: HALOT
  rationale: נשא + 죄/범법 관용구를 한국어로 자연스럽게 풀어, 법적 책임이 제거되지 않는다는 뜻을 분명히 했습니다. ‘범법’은 פשע의 반역성도 어느 정도 유지합니다.
- source_word: שְׁמִי בְּקִרְבּוֹ
  english_pob_choice: my name is within him
  chosen_korean: 내 이름이 그 안에 있기 때문입니다
  alternatives_korean:
  - 내 이름이 그 속에 있기 때문입니다
  - 내 이름이 그에게 있기 때문입니다
  - 그가 내 이름을 지니고 있기 때문입니다
  lexicon: HALOT
  rationale: בקרבו의 공간적 표현을 너무 해석하지 않고, POB의 긴장을 살려 ‘그 안에’로 간결하게 옮겼습니다. ‘지니고 있기’는 해석적이어서 본문보다 앞서지 않도록 배제했습니다.
theological_decisions:
- issue: 여호와의 사자에 대한 정체를 본문이 어디까지 규정하는가
  chosen_reading: 정체를 확정하지 않고, 위임된 권위와 신적 이름의 내재만 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 그는 하나님의 완전한 대리자입니다
  - 그는 여호와의 현현입니다
  rationale: 히브리어 본문은 강한 신적 권위를 말하지만, 이 절만으로 그 존재론을 단정하지는 않습니다. 번역은 이 긴장을 보존해야 하므로 해석을 닫지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
