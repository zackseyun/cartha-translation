- issue: 생명과 번성의 언약적 범위
  chosen_reading: 이 절은 이스라엘에게 주어진 언약적 복으로서 유산과 불임의 부재, 그리고 날수의 충만을 약속합니다.
  alternative_readings:
  - 모든 신자에게 적용되는 보편적·무조건적 약속
  rationale: 문맥이 땅에서의 언약 복을 다루므로, 본문이 직접 말하지 않는 보편화는 피했습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence'
