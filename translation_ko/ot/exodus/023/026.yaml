  - 나는 네 날수를 다 채우겠습니다
  lexicon: HALOT
  rationale: ‘채우다’로 מלא의 ‘가득 채워 완전하게 하다’는 비유를 보존했습니다. ‘네 날수의 수’는 히브리어의 직접적인 관용구를 따라 장수의 약속을 드러냅니다.
