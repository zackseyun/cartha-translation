base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
  footnotes:
  - marker: a
    text: Or 'bereaved.' The Hebrew term can refer more broadly to being deprived of children, but in this context, paired with 'barren,' it likely refers specifically to miscarriage or loss of offspring in childbirth.
    reason: lexical_alternative
  - marker: b
    text: Literally 'I will fill the number of your days,' that is, 'I will bring your lifespan to its full measure.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네 땅에는 유산하는 자도, 불임인 자도 하나도 없을 것입니다[a][b]. 나는 네 날수의 수를 채우겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상실하는 자’. 히브리어 표현은 더 넓게 자녀를 빼앗기는 상태를 가리킬 수 있으나, 여기서는 ‘불임’과 나란히 놓여 유산이나 출산 중 자녀 상실의 뜻으로 보는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 날수의 수를 채우겠다’입니다. 곧 네 생애의 기간을 그 정해진 분량까지 채우겠다는 뜻입니다.
    reason: lexical_alternative
