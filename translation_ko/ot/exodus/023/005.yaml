revisions:
- from: 네가 미워하는 사람의 나귀가 그 짐 아래에 엎드러져 있는 것을 보면, 그를 돕기를 그만두려 해도 반드시 함께 도와야 합니다.[a][b]
  to: 너를 미워하는 사람의 나귀가 그 짐 아래에 엎드러져 있는 것을 보면, 그를 돕지 않으려 하더라도 반드시 그와 함께 도와야 합니다.[a][b]
  rationale: The revision corrects the reversed subject-object relationship in ‘one who hates you,’ improves the Korean rendering of the difficult conditional expression, and clarifies the footnote for the genuinely ambiguous final pronoun. It preserves the source’s emphatic command and the chosen reading that assistance is rendered together with the owner.
