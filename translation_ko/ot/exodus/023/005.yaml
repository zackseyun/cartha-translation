id: EXO.23.5
reference: Exodus 23:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תִרְאֶ֞ה חֲמ֣וֹר שֹׂנַאֲ/ךָ֗ רֹבֵץ֙ תַּ֣חַת מַשָּׂא֔/וֹ וְ/חָדַלְתָּ֖ מֵ/עֲזֹ֣ב ל֑/וֹ עָזֹ֥ב תַּעֲזֹ֖ב עִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
  footnotes:
  - marker: a
    text: Or 'with it,' i.e., help the donkey with its load. The Hebrew pronoun can be understood with either the owner or the animal.
    reason: alternative_reading
  - marker: b
    text: The Hebrew verb here commonly means 'leave' or 'forsake,' but in this context it carries the sense 'help, assist.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 미워하는 사람의 나귀가 그 짐 아래에 엎드러져 있는 것을 보면, 그를 돕기를 그만두려 해도 반드시 함께 도와야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 대명사는 그 사람이나 나귀 둘 다를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 히브리어 동사는 보통 ‘떠나다’ 또는 ‘버리다’를 뜻하지만, 이 문맥에서는 ‘돕다, 도와주다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹר
  english_pob_choice: donkey
  chosen_korean: 나귀
  alternatives_korean:
  - 당나귀
  lexicon: HALOT
  rationale: 고대 근동의 짐승을 가리키는 표준적 한국어 표현으로 ‘나귀’가 가장 자연스럽고, 본문의 법문체도 살립니다.
- source_word: שֹׂנַאֲךָ
  english_pob_choice: one who hates you
  chosen_korean: 네가 미워하는 사람
  alternatives_korean:
  - 너를 미워하는 자
  - 네 원수
  lexicon: HALOT
  rationale: 직역하면 ‘너를 미워하는 이’이므로 관계성을 유지하면서도 현대 한국어에서 자연한 표현으로 옮겼습니다. ‘원수’는 의미를 넓혀 버릴 수 있어 피했습니다.
- source_word: רֹבֵץ
  english_pob_choice: lying down
  chosen_korean: 엎드러져 있는
  alternatives_korean:
  - 누워 있는
  - 엎드려 있는
  lexicon: HALOT
  rationale: 짐 아래에 처진 나귀의 상태를 한국어로 가장 또렷하게 드러내는 표현을 택했습니다. 단순한 ‘누워 있는’보다 부담에 눌린 상황이 살아납니다.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  english_pob_choice: and you would refrain from helping him
  chosen_korean: 그를 돕기를 그만두려 해도
  alternatives_korean:
  - 그를 돕는 일을 멈추려 해도
  - 그를 돕지 않으려 해도
  lexicon: HALOT
  rationale: 문맥상 ‘떠나다/버리다’가 아니라 ‘돕기를 그만두다’의 뜻이므로, POB의 보조 의미를 따라 한국어로 풀었습니다.
- source_word: עָזֹב תַּעֲזֹב
  english_pob_choice: you must surely help
  chosen_korean: 반드시 함께 도와야 합니다
  alternatives_korean:
  - 꼭 도와야 합니다
  - 반드시 도와야 합니다
  lexicon: HALOT
  rationale: 원문의 강조형은 단순 명령보다 강한 의무를 나타내므로 ‘반드시’로 살리고, 다음의 עִמּוֹ와 연결되도록 ‘함께 도와야 합니다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 대명사 עִמּוֹ의 지시 대상
  chosen_reading: 사람과 함께 도와야 한다는 뜻으로 읽었습니다.
  alternative_readings:
  - 나귀와 함께 도와야 한다는 뜻으로 읽을 수 있습니다.
  rationale: 히브리어 대명사는 사람과 짐승 둘 다 가리킬 수 있지만, 본문의 윤리적 초점은 원수에 대해서도 도움을 멈추지 말라는 데 있습니다. 그래서 본문에는 ‘그를’로 유지하고, ‘함께’는 동반 협력의 뜻으로 살렸습니다.
  doctrine_reference: '번역 원칙 §3: 실제 모호성이 있을 때 해석의 긴장을 보존'
