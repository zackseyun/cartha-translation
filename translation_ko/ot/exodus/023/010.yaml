  source_fidelity: 히브리어는 법규 문맥에서 ‘여섯 해 동안 네 땅에 씨를 뿌리고 그 소산을 거두어들이라’는 규범적 지시를 말합니다. 초안의 핵심 의미와 ‘소산’은 적절합니다. 다만 두 동사가 모두 독립된 미완료형이므로 한국어에서도 두 행위의 의무를 분명히 드러내는 편이 더 정확합니다.
  naturalness: ‘여섯 해 동안에는’은 다음 절의 안식년과 대비되는 문맥에 자연스럽습니다. ‘씨를 뿌리고 … 거두어들여야 합니다’도 이해되지만, 앞 동사의 의무성이 뒤의 보조 표현에만 걸리는 듯 보일 수 있어 병렬 의무 표현으로 다듬는 것이 더 명료합니다.
  terminology: ‘땅’, ‘씨를 뿌리다’, ‘소산’, ‘거두어들이다’는 농경 법규 문맥과 תְּבוּאָה/אָסַף의 의미에 잘 맞습니다. 각주 대안 ‘열매’는 과실로 의미가 좁아질 수 있으므로, ‘수확물’ 또는 ‘소출’이 더 적절합니다.
