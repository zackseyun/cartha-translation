lexical_decisions:
- source_word: וְשֵׁשׁ שָׁנִים
  english_pob_choice: For six years
  chosen_korean: 여섯 해 동안에는
  alternatives_korean:
  - 그리고 여섯 해 동안
  - 여섯 해 동안
  lexicon: WLC + English POB audit trail
  rationale: 시간 기간을 나타내는 법령 문맥이므로, 접속사 ‘그리고’를 직역하기보다 기간을 자연스럽게 드러내는 ‘여섯 해 동안에는’으로 옮겼습니다.
- source_word: תִּזְרַע אֶת אַרְצֶךָ
  english_pob_choice: you shall sow your land
  chosen_korean: 네 땅에 씨를 뿌리고
  alternatives_korean:
  - 네 땅을 갈아 씨를 뿌리고
  - 네 땅에 심고
  lexicon: WLC + HALOT
  rationale: תִּזְרַע는 경작 맥락에서 ‘씨를 뿌리다’가 가장 직접적이며, אַרְצֶךָ는 이 문맥에서 ‘네 땅’으로 충분히 구체화됩니다.
- source_word: וְאָסַפְתָּ אֶת תְּבוּאָתָהּ
  english_pob_choice: and gather its produce
  chosen_korean: 그 소산을 거두어들여야 합니다
  alternatives_korean:
  - 그 소출을 거두어들여야 합니다
  - 그 수확물을 모아야 합니다
  lexicon: WLC + HALOT
  rationale: תְּבוּאָה는 농경 산출을 가리키므로 ‘소산’이 의미를 잘 살리며, אָסַף는 단순 ‘모으다’보다 ‘거두어들이다’가 수확 행위에 더 정확합니다.
theological_decisions:
- issue: 명령문의 법적·규범적 어조
  chosen_reading: ‘...거두어들여야 합니다’로 규범적 의무를 분명히 살렸습니다.
  alternative_readings:
  - '...거두어들입니다'
  - '...거두어야 합니다'
  rationale: 히브리어 미완료형 2인칭 남성 단수는 여기서 계명/규정의 힘을 가지므로, 한국어에서도 단순 서술보다 의무 표현이 더 적절합니다.
  doctrine_reference: 언약법 문맥의 규범적 명령
