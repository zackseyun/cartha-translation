base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/019.yaml
  text: And Moses said to them[a], “Let no one leave any of it until morning.”
  footnotes:
  - marker: a
    text: Hebrew 'man' (אִישׁ) is distributive here, meaning each individual; the prohibition applies to everyone.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 그들에게 말했습니다. “아무도 그 가운데 아무것도 아침까지 남겨 두지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִישׁ(‘사람/남자’)는 여기서 분배적으로 쓰여, 각 개인에게 적용되는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And Moses said
  chosen_korean: 모세가 ... 말했습니다
  alternatives_korean:
  - 그리고 모세가 ... 말했습니다
  - 그때 모세가 ... 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리되, 한국어 문장에서는 접속사보다 동사 중심 구문이 더 매끄럽습니다.
- source_word: אֲלֵהֶם
  english_pob_choice: to them
  chosen_korean: 그들에게
  alternatives_korean:
  - 백성에게
  - 그 사람들에게
  lexicon: HALOT
  rationale: 직접 대상을 가리키는 3인칭 복수 대명사이므로, 해석을 덜어낸 표준 표현인 ‘그들에게’가 적절합니다.
- source_word: אִישׁ
  english_pob_choice: man
  chosen_korean: 아무도
  alternatives_korean:
  - 사람 하나도
  - 각 사람도
  - 한 사람도
  lexicon: HALOT
  rationale: 여기서 אִישׁ은 분배적 용법으로 각 개인을 가리키므로, 성별 표지를 살리기보다 금지문의 범위를 분명히 하는 ‘아무도’가 문맥에 더 정확합니다.
- source_word: יוֹתֵר מִמֶּנּוּ
  english_pob_choice: leave any of it
  chosen_korean: 그 가운데 아무것도 남겨 두지
  alternatives_korean:
  - 그것을 조금도 남기지
  - 그것을 남겨 두지
  - 그것에서 남겨 두지
  lexicon: HALOT
  rationale: ‘남겨 두다’는 יתר의 여기서의 의미인 ‘남겨 두어 두다/남기다’를 자연스럽게 담고, ‘아무것도’로 금지의 강도를 살렸습니다.
- source_word: עַד בֹּקֶר
  english_pob_choice: until morning
  chosen_korean: 아침까지
  alternatives_korean:
  - 아침이 올 때까지
  - 아침 전까지
  lexicon: HALOT
  rationale: 시간 한계를 나타내는 관용적 표현으로, 한국어에서는 ‘아침까지’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: אִישׁ의 분배적 의미를 한국어에서 어떻게 처리할지
  chosen_reading: ‘아무도’로 옮겨, 명시적 성별보다 보편적 금지의 뜻을 드러냈습니다.
  alternative_readings:
  - ‘남자 한 사람도’
  - ‘각 사람도’
  rationale: 이 절의 핵심은 성별이 아니라 모두에게 적용되는 금지이므로, 분배적 범위를 분명히 하는 번역이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 문맥 주해 원칙; 번역의 의미 등가성
