id: EXO.16.20
reference: Exodus 16:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא שָׁמְע֣וּ אֶל מֹשֶׁ֗ה וַ/יּוֹתִ֨רוּ אֲנָשִׁ֤ים מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וַ/יָּ֥רֻם תּוֹלָעִ֖ים וַ/יִּבְאַ֑שׁ וַ/יִּקְצֹ֥ף עֲלֵ/הֶ֖ם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
  footnotes:
  - marker: a
    text: Or 'did not heed Moses.' The Hebrew can carry the sense of refusing to listen in a way that implies disobedience.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'worms arose in it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 모세의 말을 듣지 않았습니다[a]. 몇몇 남자들이 그것의 일부를 아침까지 남겨 두었더니, 벌레가 생기고 악취가 났습니다[b]. 모세는 그들에게 화를 냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세에게 귀를 기울이지 않았습니다.’ 히브리어는 불순종을 암시하는 거절의 의미까지 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 안에 벌레들이 일어났습니다.’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמְעוּ אֶל מֹשֶׁה
  english_pob_choice: did not listen to Moses
  chosen_korean: 모세의 말을 듣지 않았습니다
  alternatives_korean:
  - 모세에게 귀를 기울이지 않았습니다
  - 모세에게 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע + אֶל은 단순 청취보다 ‘귀를 기울여 받아들이는 것’을 뜻할 수 있지만, 본문 맥락의 불순종 의미를 과도하게 앞세우기보다 ‘말을 듣지 않았다’로 직접 옮겼습니다.
- source_word: וַיּוֹתִרוּ אֲנָשִׁים מִמֶּנּוּ
  english_pob_choice: some men left some of it
  chosen_korean: 몇몇 남자들이 그것을 아침까지 남겨 두었더니
  alternatives_korean:
  - 몇몇 남자들이 그것의 일부를 남겨 두었더니
  - 몇몇 남자들이 그것을 조금 남겨 두었더니
  lexicon: HALOT
  rationale: ויתר의 사역형은 ‘남겨 두다/남기다’의 뜻이므로, 반복을 피하면서도 일부를 의도적으로 남긴 행위를 자연스러운 한국어로 드러냈습니다.
- source_word: וַיָּרֻם תּוֹלָעִים וַיִּבְאַשׁ
  english_pob_choice: it bred worms and stank
  chosen_korean: 벌레가 생기고 악취가 났습니다
  alternatives_korean:
  - 구더기가 생기고 썩은 냄새가 났습니다
  - 벌레가 솟아나고 냄새가 났습니다
  lexicon: HALOT
  rationale: 직역적 ‘벌레가 솟아나다’보다 결과 상태를 드러내는 ‘벌레가 생기다’와 ‘악취가 나다’가 문맥상 자연스럽고, 히브리어의 부패 결과를 충분히 전달합니다.
- source_word: וַיִּקְצֹף עֲלֵהֶם מֹשֶׁה
  english_pob_choice: Moses was angry with them
  chosen_korean: 모세는 그들에게 화를 냈습니다
  alternatives_korean:
  - 모세는 그들에게 노했습니다
  - 모세는 그들에게 분노했습니다
  lexicon: HALOT
  rationale: קצף은 분노/격노를 뜻하지만, 한국어 서술에서는 ‘화를 냈다’가 인물 간 반응을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 불순종의 정도를 본문에 어떻게 반영할지
  chosen_reading: ‘모세의 말을 듣지 않았습니다’로 옮기고, 불순종의 함의는 본문 전체의 서술에서 드러나게 했습니다.
  alternative_readings:
  - ‘모세에게 순종하지 않았습니다’
  - ‘모세의 말을 귀담아듣지 않았습니다’
  rationale: שׁמע + אֶל은 단순 청각보다 수용/청종의 뉘앙스를 가지지만, 본문이 직접 서술하는 것은 ‘듣지 않음’이므로 의미를 과잉 해석하지 않았습니다.
  doctrine_reference: 본문 서술의 절제와 문맥적 불순종 해석
