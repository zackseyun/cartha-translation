base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
  footnotes:
  - marker: a
    text: Or 'the Israelites' / 'the children of Israel.' The Hebrew is literally 'the sons of Israel,' a standard covenantal designation for the people of Israel.
    reason: lexical_alternative
  - marker: b
    text: Or 'a settled land.' The phrase contrasts the wilderness with land fit for settled human habitation.
    reason: lexical_alternative
  - marker: c
    text: Or 'the edge of the land of Canaan.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손[a]은 마흔 해 동안 만나를 먹었습니다. 그들은 사람이 사는 땅에 이르기까지[b], 곧 가나안 땅의 경계에 이르기까지[c] 만나를 먹었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’ 또는 ‘이스라엘의 아들들’. 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정착한 땅’ 또는 ‘사람이 거주하는 땅’. 광야와 대조되는, 사람이 거주하는 땅이라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘가나안 땅의 끝’ 또는 ‘가나안 땅의 가장자리’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  english_pob_choice: And the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어 직역형인 ‘sons of Israel’의 언약적 집단 지칭을 살리면서도, 한국어에서는 관용적이고 자연스러운 ‘이스라엘 자손’이 가장 가깝습니다.
- source_word: אֶרֶץ נוֹשָׁבֶת
  english_pob_choice: an inhabited land
  chosen_korean: 사람이 살고 있는 땅
  alternatives_korean:
  - 거주하는 땅
  - 정착한 땅
  lexicon: HALOT
  rationale: נוֹשָׁבֶת의 수동적·상태적 의미를 반영해 ‘사람이 살고 있는’으로 옮겼으며, 광야와 대비되는 정착 가능 지역이라는 뉘앙스를 유지했습니다.
- source_word: קְצֵה אֶרֶץ כְּנָעַן
  english_pob_choice: the border of the land of Canaan
  chosen_korean: 가나안 땅의 경계
  alternatives_korean:
  - 가나안 땅의 끝
  - 가나안 땅의 가장자리
  lexicon: HALOT
  rationale: קְצֵה는 ‘끝/가장자리/경계’가 가능하지만, 지리적 문맥에서는 ‘경계’가 가장 자연스럽고 도착 지점을 분명히 드러냅니다.
theological_decisions:
- issue: 문장 반복과 종결 방식
  chosen_reading: 원문의 두 번 반복되는 ‘만나를 먹었습니다’ 구조를 그대로 살려, 사건의 장기성과 종결 지점을 강조했습니다.
  alternative_readings:
  - 첫 문장만 번역하고 뒤 문장은 생략하는 방식
  - 한 문장으로 압축해 표현하는 방식
  rationale: 히브리어 본문은 반복을 통해 기간과 한계를 함께 강조하므로, 이를 보존하는 편이 저자의 의도를 더 잘 드러냅니다.
  doctrine_reference: 본문 구조 보존 원칙
