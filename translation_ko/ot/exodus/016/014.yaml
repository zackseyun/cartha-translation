    rationale: 희귀어는 질감 또는 외관을 나타내는 것으로 보이나 정확한 뜻은 확정하기 어렵습니다. ‘조각조각 난 듯한’은 flake-like의 외관을 더 잘 전달하면서도 각주를 통해 어휘적 불확실성을 유지합니다.
