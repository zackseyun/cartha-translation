  chosen_korean: 이슬의 층
  alternatives_korean:
  - 이슬의 덮임
  - 이슬의 적층
  - 이슬의 깔림
  lexicon: HALOT
  rationale: שִׁכְבָה는 ‘층, 깔린 것’이라는 물리적 이미지를 가지므로, ‘이슬의 층’이 가장 직접적으로 대응합니다.
- source_word: דַּק מְחֻסְפָּס
  english_pob_choice: a fine, flaky thing
  chosen_korean: 고운, 조각 같은 것
  alternatives_korean:
