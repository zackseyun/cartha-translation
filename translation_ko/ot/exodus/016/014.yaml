  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
  footnotes:
  - marker: a
    text: Or 'a fine, flake-like thing'; the rare Hebrew term translated 'flaky' is uncertain in nuance and may describe texture or appearance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 이슬의 층이 올라가고 보니, 광야의 표면에 고운, 조각 같은 것이 있었는데, 땅 위의 서리처럼 고왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조각 같은 것’은 드문 히브리어 מְחֻסְפָּס의 정확한 뉘앙스가 확실하지 않아, 질감이나 모양을 가리키는 표현으로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  english_pob_choice: had gone up
  chosen_korean: 올라가고 보니
  alternatives_korean:
  - 거두어지고 보니
  - 사라지고 나니
  - 올라갔더니
  lexicon: HALOT
  rationale: עלה의 기본 이미지를 살려 ‘올라가다’로 옮기되, 문맥상 이슬이 걷힌 뒤를 자연스럽게 드러내기 위해 결과 연결형을 사용했습니다.
- source_word: שִׁכְבַת הַטָּל
  english_pob_choice: the layer of dew
  chosen_korean: 이슬의 층
  alternatives_korean:
  - 이슬의 덮임
  - 이슬의 적층
  - 이슬의 깔림
  lexicon: HALOT
  rationale: שִׁכְבָה는 ‘층, 깔린 것’이라는 물리적 이미지를 가지므로, ‘이슬의 층’이 가장 직접적으로 대응합니다.
- source_word: דַּק מְחֻסְפָּס
  english_pob_choice: a fine, flaky thing
  chosen_korean: 고운, 조각 같은 것
  alternatives_korean:
  - 고운, 비늘 같은 것
  - 고운, 알갱이 같은 것
  - 고운, 부스러기 같은 것
  lexicon: HALOT
  rationale: מְחֻסְפָּס는 드문 단어로 질감이나 형태가 불확실하므로, POB의 ‘flaky thing’에 맞춰 ‘조각 같은 것’으로 두어 외형적 인상을 살렸습니다.
- source_word: דַּק כַּכְּפֹר
  english_pob_choice: fine as frost
  chosen_korean: 땅 위의 서리처럼 고왔습니다
  alternatives_korean:
  - 서리처럼 고왔습니다
  - 땅 위의 성에처럼 고왔습니다
  - 땅에 내린 서리처럼 고왔습니다
  lexicon: HALOT
  rationale: כְּפֹר를 ‘서리’로 옮겨 비교를 분명히 하고, 반복되는 דַּק의 감각을 살리기 위해 ‘고왔다’를 사용했습니다.
- source_word: עַל הָאָרֶץ
  english_pob_choice: on the ground
  chosen_korean: 땅 위
  alternatives_korean:
  - 땅에
  - 땅 위에
  - 땅바닥에
  lexicon: HALOT
  rationale: אֶרֶץ를 이 장면의 실제 지면으로 이해하여, 자연스러운 현대 한국어인 ‘땅 위’로 옮겼습니다.
theological_decisions:
- issue: 서술 순서와 감각적 묘사의 보존
  chosen_reading: 광야의 표면에 고운, 조각 같은 것이 있었는데, 땅 위의 서리처럼 고왔습니다.
  alternative_readings:
  - 광야 위에 고운, 조각 같은 것이 있었습니다
  - 광야 표면에 아주 작은 것이 보였습니다
  rationale: 본문은 관찰자의 시선을 따라 갑작스러운 출현과 외형적 인상을 강조하므로, 설명을 덧붙이기보다 장면의 충격과 시각성을 그대로 살렸습니다.
  doctrine_reference: 본문 서술의 직역-근접성
