base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
  footnotes:
  - marker: a
    text: Or 'maggots.' The Hebrew noun can refer to worm-like decay creatures generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 명령한 대로 그들은 그것을 아침까지 남겨 두었습니다. 그것은 썩은 냄새가 나지 않았고, 그 안에는 벌레도 없었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구더기’. 히브리어 명사는 벌레 같은 부패 생물을 일반적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  english_pob_choice: they left it
  chosen_korean: 그들은 그것을 남겨 두었습니다
  alternatives_korean:
  - 그들은 그것을 두었습니다
  - 그들은 그것을 놓아 두었습니다
  lexicon: HALOT
  rationale: 문맥상 만나를 밤새 손대지 않고 보관해 둔 뜻이므로, 자연스러운 한국어로는 ‘남겨 두다’가 가장 분명합니다.
- source_word: עַד הַבֹּקֶר
  english_pob_choice: until morning
  chosen_korean: 아침까지
  alternatives_korean:
  - 아침이 올 때까지
  - 아침까지 남겨
  lexicon: HALOT
  rationale: 시간 표현으로 간결하고 자연스럽게 옮겼습니다.
- source_word: הִבְאִישׁ
  english_pob_choice: did not stink
  chosen_korean: 냄새가 나지 않았고
  alternatives_korean:
  - 썩은 냄새가 나지 않았고
  - 악취가 나지 않았고
  lexicon: HALOT
  rationale: 히브리어 동사는 ‘썩은 냄새가 나다/악취가 나다’의 의미를 가질 수 있지만, 본문 대비를 살리면서도 과도하게 좁히지 않기 위해 일반적인 ‘냄새가 나지 않았다’를 택했습니다.
- source_word: רִמָּה לֹא הָיְתָה בּוֹ
  english_pob_choice: nor were there any worms in it
  chosen_korean: 그 안에 벌레도 없었습니다
  alternatives_korean:
  - 그 안에 구더기도 없었습니다
  - 그 안에는 벌레가 하나도 없었습니다
  lexicon: HALOT
  rationale: רִמָּה는 벌레/구더기 모두 가능하나, 한국어 본문에서는 보다 넓은 의미의 ‘벌레’를 기본으로 두고, 필요시 주석으로 세부를 보완하는 편이 적절합니다.
theological_decisions:
- issue: 모세의 명령을 따름으로써 만나가 썩지 않는 본문의 인과와 순종 강조
  chosen_reading: 모세가 명령한 대로 그들은 그것을 아침까지 남겨 두었습니다
  alternative_readings:
  - 모세의 명령에 따라
  - 모세가 지시한 대로
  rationale: 본문은 단순한 시간 진술이 아니라 순종의 결과를 보여 주므로, ‘명령한 대로’로 종속 관계를 분명히 드러냈습니다.
  doctrine_reference: 출애굽기 16장의 광야 공급과 순종의 시험
