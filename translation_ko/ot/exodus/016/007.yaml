base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
  footnotes:
  - marker: a
    text: Or, 'when he hears your grumblings against the LORD.' The Hebrew construction can be read temporally as well as causally.
    reason: alternative_reading
translation:
  language: ko
  text: 아침에는 야훼의 영광을 보게 될 것입니다. 야훼께서 야훼에 대한 여러분의 원망을 들으셨기 때문입니다[a]. 그런데 우리가 무엇이기에, 여러분이 우리를 원망합니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘그가 여러분의 야훼에 대한 원망을 들으실 때’라는 시간적 의미로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֹקֶר
  english_pob_choice: And in the morning
  chosen_korean: 아침이 되면
  alternatives_korean:
  - 그리고 아침에
  - 아침에
  lexicon: HALOT
  rationale: 시간 부사를 한국어로 자연스럽게 풀어, 앞절과의 연속성을 유지하면서도 예언/선포의 흐름을 살렸습니다.
- source_word: כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 영광스러운 현현
  - 주님의 영광
  lexicon: HALOT
  rationale: כָּבוֹד의 핵심인 무게감 있는 영광/현현을 살리기 위해 표준적인 ‘영광’을 사용했습니다.
- source_word: תְּלֻנֹּתֵיכֶם
  english_pob_choice: your grumblings
  chosen_korean: 여러분의 원망
  alternatives_korean:
  - 여러분의 불평
  - 여러분의 투덜거림
  lexicon: HALOT
  rationale: 본문의 शिकायत/불만을 나타내는 לשון을 한국어에서 가장 자연스럽고 문맥에 맞게 ‘원망’으로 옮겼습니다. ‘원망’은 단순 불평보다 하나님을 향한 불만의 뉘앙스를 더 잘 드러냅니다.
- source_word: תלונו
  english_pob_choice: you grumble
  chosen_korean: 원망합니까
  alternatives_korean:
  - 불평합니까
  - 투덜댑니까
  lexicon: HALOT
  rationale: 앞선 명사와 어근 대응을 살리면서, 모세와 아론에게 향한 반문을 현대 한국어의 직접적 표현으로 옮겼습니다.
theological_decisions:
- issue: בְּשָׁמְעוֹ의 관계를 어떻게 옮길지
  chosen_reading: 그가 야훼에 대한 여러분의 원망을 들으셨기 때문입니다
  alternative_readings:
  - 그가 야훼에 대한 여러분의 원망을 들으실 때
  - 그가 여러분의 원망을 들으시는 가운데
  rationale: 문맥상 야훼의 영광이 드러나는 이유를 설명하므로 인과로 옮겼습니다. 다만 히브리어는 시간적 뉘앙스도 가능하므로, 본문 의미를 단정적으로 좁히지 않도록 별도 각주 없이 본문은 자연스러운 인과로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
