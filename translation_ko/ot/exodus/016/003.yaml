source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
  footnotes:
  - marker: a
    text: Hebrew 'the sons of Israel'; many English versions render this more idiomatically as 'the Israelites' or 'the children of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'when we sat by the flesh pots'—a traditional rendering of the Hebrew idiom for cooking pots filled with meat.
    reason: lexical_alternative
  - marker: c
    text: The divine name is Hebrew YHWH, rendered here as 'the LORD' in keeping with the translation's standard practice; alternatively, 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 자손이 그들에게 말했습니다. 「차라리 우리가 이집트 땅에서 야훼의 손에 죽었더라면 좋았을 것입니다. 그곳에서 우리가 고기 가마 곁에 앉아 있었고, 배부르게 빵을 먹었기 때문입니다. 그런데 당신들은 우리를 이 광야로 데리고 나와, 이 온 회중을 굶주림으로 죽이려 합니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 직역형인 ‘sons of Israel’은 한국어 성경에서 관용적으로 ‘이스라엘 자손’으로 옮기면 혈연·언약적 표현을 보존하면서도 자연스럽습니다.
- source_word: מִי יִתֵּן
  english_pob_choice: If only
  chosen_korean: 차라리 …였더라면 좋았을 것입니다
  alternatives_korean:
  - 누가 주겠습니까?
  - 오직 …하기를
  lexicon: HALOT
  rationale: 이 관용구는 실제 질문이 아니라 소망/유감을 나타내므로, 한국어에서는 반사실적 바람을 나타내는 표현으로 옮기는 것이 가장 자연스럽습니다.
- source_word: בְּיָד יְהוָה
  english_pob_choice: by the hand of Yahweh
  chosen_korean: 야훼의 손에
  alternatives_korean:
  - 여호와의 손에
  - 주님의 손에
  lexicon: HALOT
  rationale: 직역 구조를 살리면서도 문맥에서 여호와의 고유명을 보존하기 위해 ‘야훼의 손에’로 옮겼습니다.
- source_word: סִיר הַבָּשָׂר
  english_pob_choice: the pots of meat
  chosen_korean: 고기 가마
  alternatives_korean:
  - 고기 냄비
  - 고깃솥
  lexicon: HALOT
  rationale: 이 표현은 관용적으로 고기가 담긴 조리 용기를 가리키므로, 너무 현대적이거나 설명적인 표현보다 간결한 ‘고기 가마’가 원문의 이미지를 잘 살립니다.
- source_word: לֶחֶם לָשֹׂבַע
  english_pob_choice: bread to the full
  chosen_korean: 배부르게 빵을
  alternatives_korean:
  - 넉넉하게 빵을
  - 충분히 빵을
  lexicon: HALOT
  rationale: ‘to the full’의 포만감을 한국어 동사구로 자연스럽게 풀어, 빵을 충분히 먹어 배부른 상태를 분명하게 전달했습니다.
- source_word: הַקָּהָל הַזֶּה
  english_pob_choice: this whole assembly
  chosen_korean: 이 온 회중
  alternatives_korean:
  - 이 모든 회중
  - 이 온 백성
  lexicon: HALOT
  rationale: קָהָל은 단순 군중보다 모인 공동체를 가리키므로, 한국어 성경 어법에 맞는 ‘회중’을 택했고 ‘온’으로 전체성을 살렸습니다.
- source_word: בָּרָעָב
  english_pob_choice: with hunger
  chosen_korean: 굶주림으로
  alternatives_korean:
  - 기근으로
  - 배고픔으로
  lexicon: HALOT
  rationale: 이 문맥은 전쟁성 재앙어보다 광야에서의 식량 부족을 가리키므로, 사람들의 절박함을 드러내는 ‘굶주림으로’가 적절합니다.
theological_decisions:
- issue: 여호와의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 히브리어 고유명사를 직접 사용하므로, 번역 전통의 대체 호칭보다 고유명을 드러내는 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 성별 표지 בְּנֵי יִשְׂרָאֵל의 처리
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘의 자손
  rationale: 남성 복수의 표지를 무표화하지 않으면서도 한국어 성경의 언어 감각에 맞게 대표적 언약 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
