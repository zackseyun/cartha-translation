  lexicon: HALOT
  rationale: 히브리어 이야기 전개를 자연스럽게 이어 주는 서술 도입으로 처리하되, 과도한 직역투를 피했습니다.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
