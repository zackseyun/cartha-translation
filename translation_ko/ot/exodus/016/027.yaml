  lexicon: HALOT
  rationale: 시간 표현을 간결하고 표준적인 한국어로 옮겼습니다.
- source_word: מִן הָעָם
  english_pob_choice: some of the people
  chosen_korean: 백성 가운데서 어떤 이들이
  alternatives_korean:
