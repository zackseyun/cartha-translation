  lexicon: HALOT
  rationale: 히브리어의 실패 결과를 직접적으로 반영하면서도, 한국어에서는 ‘없다’보다 ‘찾지 못하다’가 더 자연스럽습니다.
theological_decisions:
- issue: 부분 주체의 범위
  chosen_reading: ‘백성 가운데서 어떤 이들’로 옮겨, 행동한 주체가 전체 백성이 아니라 일부였음을 분명히 했습니다.
  alternative_readings:
  - ‘백성 중 일부가’
  - ‘백성에서 어떤 이들이’
  rationale: 본문의 מִן הָעָם는 전체 집단이 아니라 일부를 뜻하므로, 서술의 초점을 흐리지 않게 부분성을 명시해야 합니다.
  doctrine_reference: source semantics
