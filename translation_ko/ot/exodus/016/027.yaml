    text: 히브리어는 문자적으로 ‘백성에서’이지만, 여기서는 백성 전체가 아니라 일부가 나갔다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 … 일이 일어났습니다
  alternatives_korean:
