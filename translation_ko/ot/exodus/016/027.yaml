  lexicon: HALOT
  rationale: מִן הָעָם는 전체가 아니라 일부를 가리키므로, 한국어에서는 부분성을 분명히 드러냈습니다.
- source_word: לִלְקֹט
  english_pob_choice: to gather
  chosen_korean: 거두려 하였으나
  alternatives_korean:
