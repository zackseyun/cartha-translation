base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
  footnotes:
  - marker: a
    text: Or “a Sabbath holy to the LORD.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats the verbs for emphasis: “what you will bake, bake; and what you will boil, boil.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그들에게 말했습니다. 「이것은 야훼께서 말씀하신 것입니다. 내일은 엄숙한 안식이며, 야훼를 위한 거룩한 안식일입니다. 여러분이 구울 것은 굽고, 여러분이 삶을 것은 삶으십시오. 그리고 남은 것은 모두 여러분을 위해 따로 두어 아침까지 보관하십시오」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 같은 동사를 반복해 ‘굽고 굽고, 삶고 삶고’의 강조를 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 영문 POB가 하나님의 이름을 Yahweh로 확정하므로, 한국어도 직역·음역 대응으로 야훼를 사용해 언약 이름을 드러냅니다.
- source_word: שַׁבָּתוֹן
  english_pob_choice: a solemn rest
  chosen_korean: 엄숙한 안식
  alternatives_korean:
  - 완전한 안식
  - 안식
  - 성대한 안식
  lexicon: HALOT
  rationale: 단순한 휴식보다 의례적·강조적 안식의 성격이 있어, solemn의 뉘앙스를 살려 엄숙한 안식으로 옮겼습니다.
- source_word: אֵת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ / וְאֵת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ
  english_pob_choice: What you will bake, bake; and what you will boil, boil
  chosen_korean: 여러분이 구울 것은 굽고, 여러분이 삶을 것은 삶으십시오
  alternatives_korean:
  - 구울 것은 구우십시오
  - 구울 것은 굽고 삶을 것은 삶으십시오
  - 여러분이 구워야 할 것은 굽고 삶아야 할 것은 삶으십시오
  lexicon: HALOT
  rationale: 히브리어의 목적어-관계절 뒤 반복 명령의 강조를 한국어에서도 살리기 위해, 반복 구조를 유지한 채 자연스러운 합쇼체로 옮겼습니다.
- source_word: הָעֹדֵף
  english_pob_choice: all that is left over
  chosen_korean: 남은 것은 모두
  alternatives_korean:
  - 남은 모든 것
  - 남아 있는 것 모두
  - 남은 것 전부
  lexicon: HALOT
  rationale: 제사·식사 준비 문맥에서 ‘남은 것’이 가장 직접적이며, 전부를 뜻하는 כָּל을 ‘모두’로 보강했습니다.
- source_word: לְמִשְׁמֶרֶת
  english_pob_choice: to be kept
  chosen_korean: 보관하십시오
  alternatives_korean:
  - 지키십시오
  - 간수하십시오
  - 따로 두십시오
  lexicon: HALOT
  rationale: ‘남겨 두어 보존하다’는 목적을 현대 한국어에서 가장 분명하게 드러내는 말로 보관하십시오를 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기와 거룩한 안식일의 관계
  chosen_reading: 본문의 하나님의 이름은 야훼로, ‘야훼를 위한 거룩한 안식일’로 옮겨 언약적 귀속을 분명히 했습니다.
  alternative_readings:
  - ‘주를 위한 거룩한 안식일’
  - ‘야훼께 거룩한 안식일’
  rationale: 히브리어의 לַיהוָה는 소유·귀속을 나타내므로, ‘위한’으로 옮겨 안식일의 대상과 헌정 방향을 분명하게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
