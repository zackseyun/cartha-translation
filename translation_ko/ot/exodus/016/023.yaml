base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
  footnotes:
  - marker: a
    text: Or “a Sabbath holy to the LORD.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats the verbs for emphasis: “what you will bake, bake; and what you will boil, boil.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그들에게 말했습니다. “이것은 야훼께서 말씀하신 것입니다. 내일은 엄숙한 안식이며, 야훼를 위한 거룩한 안식일입니다. 여러분이 구울 것은 굽고, 여러분이 삶을 것은 삶으십시오.[a] 그리고 남은 것은 모두 여러분을 위해 남겨 아침까지 보관해 두십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘구울 것’과 ‘삶을 것’에 쓰인 동사를 각각 이어서 반복하여 강조합니다.
    reason: lexical_alternative
