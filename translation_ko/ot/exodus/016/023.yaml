theological_decisions:
- issue: 여호와/야훼 표기와 거룩한 안식일의 관계
  chosen_reading: 본문의 하나님의 이름은 야훼로, ‘야훼를 위한 거룩한 안식일’로 옮겨 언약적 귀속을 분명히 했습니다.
  alternative_readings:
  - ‘주를 위한 거룩한 안식일’
  - ‘야훼께 거룩한 안식일’
  rationale: 히브리어의 לַיהוָה는 소유·귀속을 나타내므로, ‘위한’으로 옮겨 안식일의 대상과 헌정 방향을 분명하게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
