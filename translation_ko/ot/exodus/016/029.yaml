  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
  footnotes:
  - marker: a
    text: Hebrew 'each man' / 'no man'; the masculine form is used distributively for each individual in the community.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 야훼께서 여러분에게 안식일을 주셨습니다. 그러므로 여섯째 날에는 이틀 치 빵을 여러분에게 주십니다. 각 사람은 자기 자리에 머물러야 합니다. 일곱째 날에는 아무도 자기 자리에서 나가지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 남성형 단수는 공동체의 각 개인을 가리키는 분배적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 살펴보십시오
  - 아시다시피
  lexicon: HALOT
  rationale: 복수 명령형의 직접적인 촉구를 살리면서 현대 한국어 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: יְהוָה
