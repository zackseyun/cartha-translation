  lexicon: HALOT
  rationale: 직역의 ‘빵’ 의미를 유지하되 한국어에서 자연스러운 분량 표현으로 옮겨, 둘째 날까지의 공급을 분명하게 했습니다.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו / אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  english_pob_choice: Let each man stay in his place; let no man go out from his place
  chosen_korean: 각 사람은 자기 자리에 머물러야 합니다. 일곱째 날에는 아무도 자기 자리에서 나가지 마십시오.
  alternatives_korean:
  - 각 사람은 있는 자리에 머물러야 합니다. 아무도 그 자리에서 나가지 마십시오.
  - 각 남자는 자기 자리에서 머물러야 합니다. 아무 남자도 그 자리에서 나가지 마십시오.
  lexicon: HALOT
  rationale: 대표적 남성형 אִישׁ의 분배적 용법을 한국어에서는 ‘각 사람/아무도’로 풀어 자연스럽게 전달하되, 명령의 금지와 장소 제한을 분명히 했습니다.
theological_decisions:
- issue: Representing the divine name יְהוָה
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 하나님의 고유한 언약 이름을 직접 사용하므로, 제목화된 대체어보다 고유명사 음역을 유지하는 것이 원문 의미를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Gendered distributive אִישׁ
  chosen_reading: 각 사람 / 아무도
  alternative_readings:
  - 각 남자
  - 각자
  - 어떤 사람도
  rationale: 히브리어의 남성형 단수는 공동체 전체를 가리키는 분배적 표현이므로, 한국어에서는 성별을 과도하게 전면화하지 않되 대표성을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
