  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
  footnotes:
  - marker: a
    text: Hebrew 'each man' / 'no man'; the masculine form is used distributively for each individual in the community.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 야훼께서 여러분에게 안식일을 주셨습니다. 그러므로 여섯째 날에는 여러분에게 이틀 치 빵을 주십니다. 각 사람은 자기 자리에 머무르십시오.[a] 일곱째 날에는 아무도 자기 자리에서 나가지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에서 ‘각 사람’과 ‘아무도’에 해당하는 말은 모두 남성형 단수이며, 공동체의 각 개인을 가리키는 분배적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
