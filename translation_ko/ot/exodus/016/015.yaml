  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'a man to his brother.' This is an idiom meaning they said to one another.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression behind 'What is it?' is traditionally connected with the name 'manna.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 그것을 보고 서로[a] “이것이 무엇입니까?”[b] 하고 말했습니다. 그들은 그것이 무엇인지 알지 못했기 때문입니다. 모세가 그들에게 말했습니다. “이것은 야훼께서 여러분이 먹도록 주신 빵입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 사람이 자기 형제에게’라고 하지만, 서로 말하는 것을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מָן הוּא는 전통적으로 ‘만나’라는 이름과 연결됩니다.
    reason: lexical_alternative
