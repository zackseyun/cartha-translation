  text: וַ/יִּרְא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יֹּ֨אמְר֜וּ אִ֤ישׁ אֶל אָחִי/ו֙ מָ֣ן ה֔וּא כִּ֛י לֹ֥א יָדְע֖וּ מַה ה֑וּא וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֲלֵ/הֶ֔ם ה֣וּא הַ/לֶּ֔חֶם אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'a man to his brother.' This is an idiom meaning they said to one another.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression behind 'What is it?' is traditionally connected with the name 'manna.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 그것을 보고 서로 말했습니다. “이게 뭐지?” 그들은 그것이 무엇인지 알지 못했기 때문입니다. 모세가 그들에게 말했습니다. “이것은 야훼께서 여러분에게 먹도록 주신 빵입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘형제에게 한 사람’이지만, 서로 말하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מָן הוּא는 전통적으로 ‘만나’라는 이름과 연결됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 자연스러운 성서 한국어로 옮기되, 원문의 혈연·언약 공동체 감각을 유지하기 위해 ‘이스라엘 자손’을 택했습니다.
- source_word: אִישׁ אֶל אָחִיו
  english_pob_choice: to one another
  chosen_korean: 서로
  alternatives_korean:
  - 각 사람이 자기 형제에게
  - 사람이 자기 형제에게
  lexicon: HALOT
  rationale: 직역하면 ‘한 사람이 자기 형제에게’이지만, 여기서는 상호 발화를 뜻하는 관용구이므로 현대 한국어의 자연스러운 표현인 ‘서로’로 옮겼습니다.
- source_word: מָן הוּא
  english_pob_choice: What is it?
  chosen_korean: 이게 뭐지?
  alternatives_korean:
  - 이것이 무엇입니까?
  - 만나가 뭐지?
  lexicon: HALOT
  rationale: 본문의 질문형 표현을 그대로 살려, 후대의 고유명사 ‘만나’로 미리 고정하지 않고 즉각적인 놀람과 의문을 드러내는 한국어 질문으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자적으로 신명기적 고유명사를 반영하기 위해 POB 기준에 따라 ‘야훼’를 사용했습니다.
- source_word: לְאָכְלָה
  english_pob_choice: to eat
  chosen_korean: 먹도록
  alternatives_korean:
  - 먹기 위해
  - 먹는 것으로
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사구를 한국어의 자연스러운 목적 표현인 ‘먹도록’으로 처리해, 하나님이 주신 빵의 용도를 분명히 했습니다.
theological_decisions:
- issue: 마나/만나 명칭을 본문에서 직접 사용할지 여부
  chosen_reading: 본문에서는 질문형 표현 ‘이게 뭐지?’를 유지하고, ‘만나’라는 정식 명칭은 도입하지 않았습니다.
  alternative_readings:
  - 본문에 ‘만나’라고 번역하기
  - ‘이것이 무엇입니까?’처럼 더 중립적으로 옮기기
  rationale: 히브리어 מָן הוּא는 여기서 실제로는 놀라운 음식에 대한 질문으로 기능하며, 서술이 바로 그 이해를 해설합니다. 본문에서 고유명사를 선행시키면 서사적 효과와 말놀이가 약해집니다.
  doctrine_reference: 'DOCTRINE.md: lexical transparency and narrative wordplay'
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: ‘야훼’
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 원문이 여호와 대체어가 아닌 언약 이름 עצמו를 사용하므로, 본문에서도 그 고유성을 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
