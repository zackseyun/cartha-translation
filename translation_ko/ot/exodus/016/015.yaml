  rationale: 본문의 질문형 표현을 그대로 살려, 후대의 고유명사 ‘만나’로 미리 고정하지 않고 즉각적인 놀람과 의문을 드러내는 한국어 질문으로 옮겼습니다.
- source_word: יְהוָה
