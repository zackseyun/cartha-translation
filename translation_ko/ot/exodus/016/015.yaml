- from: 이스라엘 자손이 그것을 보고 서로 말했습니다. “이게 뭐지?” 그들은 그것이 무엇인지 알지 못했기 때문입니다. 모세가 그들에게 말했습니다. “이것은 야훼께서 여러분에게 먹도록 주신 빵입니다.”[a][b]
