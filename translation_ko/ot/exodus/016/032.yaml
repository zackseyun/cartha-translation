  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
  footnotes:
  - marker: a
    text: Hebrew 'an omerful'—that is, a full measure of an omer.
    reason: cultural_note
translation:
  language: ko
  text: 모세가 말했습니다. “이것은 야훼께서 명령하신 말씀입니다. 그것에서 오멜 한 가득을[a] 너희 대대로 보존하라. 이는 내가 너희를 이집트 땅에서 이끌어 낼 때 광야에서 너희에게 먹인 빵을 그들이 보게 하려는 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 오멜은 고대 히브리 도량형입니다. ‘오멜 한 가득’은 온전한 한 오멜 분량을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  english_pob_choice: And Moses said
  chosen_korean: 모세가 말했습니다
  alternatives_korean:
  - 그리고 모세가 말했습니다
  - 모세가 말했습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 살리되, 한국어에서는 굳이 ‘그리고’를 덧붙이지 않아도 원문의 도입 기능이 유지됩니다.
- source_word: צִוָּה יְהוָה
  english_pob_choice: that Yahweh has commanded
  chosen_korean: 야훼께서 명령하신
  alternatives_korean:
  - 주님이 명령하신
  - 야훼께서 명령하신 것
  lexicon: HALOT
  rationale: 여호와/주님으로 완화하지 않고, 원문과 POB 기준에 따라 신명 야훼를 직접 옮겼습니다.
- source_word: מְלֹא הָעֹמֶר
  english_pob_choice: a full omer
  chosen_korean: 한 오멜 가득
  alternatives_korean:
  - 오멜 한 가득
  - 한 오멜 분량
  lexicon: HALOT
  rationale: ‘가득’으로 מלא의 충만함을 살리고, 오멜이라는 도량형을 그대로 유지해 측정값의 구체성을 보존했습니다.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  english_pob_choice: be kept throughout your generations
  chosen_korean: 대대로 보존하여
  alternatives_korean:
  - 대대로 간직하여
  - 세세대대로 보존하여
  lexicon: HALOT
  rationale: ‘보존하다’가 단순 보관보다 기념용으로 남겨 두는 뉘앙스를 더 잘 전달하며, ‘대대로’로 세대 간 지속성을 살렸습니다.
- source_word: הַֽלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  english_pob_choice: the bread with which I fed you
  chosen_korean: 내가 너희를 먹인 빵
  alternatives_korean:
  - 내가 너희에게 먹인 빵
  - 내가 너희를 먹이신 빵
  lexicon: HALOT
  rationale: הֶאֱכַלְתִּי의 사역 의미를 ‘먹이다’로 살렸고, מוּם 없이 ‘빵’으로 옮겨 만나를 가리키는 문자적 표현을 보존했습니다.
- source_word: מִצְרָיִם
  english_pob_choice: the land of Egypt
  chosen_korean: 이집트 땅
  alternatives_korean:
  - 이집트에서
  - 이집트 땅에서
  lexicon: HALOT
  rationale: 원문의 ‘땅’(אֶרֶץ)을 살려 출애굽 서술의 관용구를 유지했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 본문 원칙에 따라 하나님 고유명을 일반 호칭으로 바꾸지 않고 야훼로 직접 표기했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
