revisions:
- from: 모세가 말했습니다. 「이것은 야훼께서 명령하신 말씀입니다. 이것을 한 오멜 가득 두어 대대로 보존하여, 내가 너희를 광야에서 먹인 빵과 내가 너희를 이집트 땅에서 끌어낸 때를 그들이 보게 하십시오」.[a]
  to: 모세가 말했습니다. “이것은 야훼께서 명령하신 말씀입니다. 그것에서 오멜 한 가득을[a] 너희 대대로 보존하라. 이는 내가 너희를 이집트 땅에서 이끌어 낼 때 광야에서 너희에게 먹인 빵을 그들이 보게 하려는 것이다.”
  rationale: 원문의 명령과 목적 관계를 보존하도록 문장을 두 문장으로 나누었습니다. ‘그것에서’는 앞 문맥의 만나를 가리키며, ‘그들이’는 ‘너희 대대로’의 후대 세대를 가리킵니다. 시간구 ‘내가 너희를 이집트 땅에서 이끌어 낼 때’가 ‘광야에서 너희에게 먹인’ 일을 수식하도록 재배치했습니다.
