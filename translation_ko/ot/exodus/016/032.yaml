  - 여호와
  rationale: POB의 본문 원칙에 따라 하나님 고유명을 일반 호칭으로 바꾸지 않고 야훼로 직접 표기했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
