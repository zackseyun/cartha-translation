base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
  footnotes:
  - marker: a
    text: Or, 'it will be a double portion over what they gather each day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여섯째 날에는 그들이 가져오는 것을 준비해야 하며, 그것은 날마다 거두는 것보다 두 배가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들이 날마다 거두는 것보다 두 배분이 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  english_pob_choice: on the sixth day
  chosen_korean: 여섯째 날에는
  alternatives_korean:
  - 여섯째 날에
  - 제6일에
  lexicon: HALOT
  rationale: 히브리어의 단순한 시간 표현을 자연스러운 한국어 부사어로 옮겼으며, 문맥상 절의 조건·시점을 분명히 드러내기 위해 ‘에는’을 사용했습니다.
- source_word: וְהֵכִינוּ אֵת אֲשֶׁר יָבִיאוּ
  english_pob_choice: when they prepare what they bring in
  chosen_korean: 그들이 가져오는 것을 준비해야 하며
  alternatives_korean:
  - 그들이 들여오는 것을 준비할 것이며
  - 그들이 가져오는 것을 마련할 것이며
  lexicon: HALOT
  rationale: ‘준비하다’는 הֵכִינוּ의 기본 의미를 살리고, ‘가져오는 것’은 수확해 들여오는 맥락을 반영해 번역했습니다. 한국어에서는 ‘when’의 조건 관계를 동사 어미로 풀어 자연스럽게 처리했습니다.
- source_word: וְהָיָה מִשְׁנֶה
  english_pob_choice: it will be twice as much / double
  chosen_korean: 두 배가 될 것입니다
  alternatives_korean:
  - 두 배가 될 것이며
  - 배가 될 것입니다
  lexicon: HALOT
  rationale: מִשְׁנֶה의 핵심 의미는 ‘두 배, 배수’이므로, 한국어에서 가장 직접적이고 이해하기 쉬운 ‘두 배’로 옮겼습니다.
- source_word: עַל אֲשֶׁר יִלְקְטוּ יוֹם יוֹם
  english_pob_choice: what they gather day by day
  chosen_korean: 날마다 거두는 것보다
  alternatives_korean:
  - 날마다 거두는 것보다 더
  - 매일 거두는 것보다
  lexicon: HALOT
  rationale: 비교를 나타내는 עַל의 의미를 한국어 비교구문 ‘~보다’로 자연스럽게 풀었고, יִלְקְטוּ는 만나 문맥에 맞게 ‘거두다’로 옮겼습니다. ‘날마다’는 יוֹם יוֹם의 반복·분배적 뉘앙스를 살립니다.
theological_decisions:
- issue: 두 배의 양을 어떻게 표현할지
  chosen_reading: ‘두 배가 될 것입니다’로 직설적으로 옮겨, 단순한 양적 증가라는 본문의 명령/예고를 분명히 드러냈습니다.
  alternative_readings:
  - ‘두 배분이 될 것입니다’
  - ‘두 몫이 될 것입니다’
  rationale: 히브리어 מִשְׁנֶה는 여기서 명백히 양의 배수를 뜻하므로, 한국어에서 덜 관용적인 표현보다 본문이 말하는 양적 비교를 직접 드러내는 번역이 적절합니다.
  doctrine_reference: 출애굽기 16장의 만나 규례 맥락
- issue: 문장 구조에서 조건·시점을 어떻게 처리할지
  chosen_reading: ‘여섯째 날에는 … 준비해야 하며’로 조건적 상황을 앞세운 한국어 문장으로 정리했습니다.
  alternative_readings:
  - ‘여섯째 날에 그들이 준비하면’
  - ‘여섯째 날에 그들이 준비할 때’
  rationale: 히브리어의 העתיד/완료적 진술을 한국어에서는 예고적 규정문으로 자연스럽게 전달하는 것이 본문 기능에 더 부합합니다.
  doctrine_reference: 서술형 율법/지시문 번역 원칙
