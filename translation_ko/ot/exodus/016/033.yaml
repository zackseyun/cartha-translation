  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
  footnotes:
  - marker: a
    text: Or “pot” for the vessel named here.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 아론에게 말했습니다. “항아리 하나를 가져다가 그 안에 만나 한 오멜 가득을 넣고, 그것을 야훼 앞에 두어 너희 대대로 보존하게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 용기 이름은 ‘항아리’로도, 또는 ‘단지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנְצֶנֶת
  english_pob_choice: jar
  chosen_korean: 항아리
  alternatives_korean:
  - 단지
  - 병
  - 그릇
  lexicon: HALOT
  rationale: 작은 저장용 용기를 가리키는 말이므로, 현대 한국어에서 자연스럽고 내용상 무리가 없는 ‘항아리’로 옮겼습니다. ‘단지’도 가능하지만 다소 생활용품 느낌이 강합니다.
- source_word: מְלֹא הָעֹמֶר
  english_pob_choice: an omerful
  chosen_korean: 한 오멜 가득
  alternatives_korean:
  - 오멜 한 가득
  - 한 오멜 분량
  - 오멜만큼
  lexicon: HALOT
  rationale: ‘가득’으로 מלא(충만함)를 살리고, ‘오멜’을 그대로 유지해 계량 단위를 보존했습니다. 영어 POB의 ‘omerful’에 해당하는 압축적 표현입니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 여호와 앞에
  - 주 앞에
  - 야훼의 면전에서
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 יְהוָה를 ‘야훼’로 옮겼고, לִפְנֵי는 예배·제의적 맥락에서 ‘앞에’가 가장 직접적입니다.
- source_word: לְדֹרֹתֵיכֶם
  english_pob_choice: throughout your generations
  chosen_korean: 너희 대대로
  alternatives_korean:
  - 너희 세대 동안
  - 너희 후손 대대로
  - 여러 세대를 거쳐
  lexicon: HALOT
  rationale: 세대의 연속성을 간결하게 살리는 표준적 표현입니다. ‘너희’는 출애굽 공동체를 향한 2인칭 복수를 반영합니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 신성명 יְהוָה를 직접 사용하므로, 제목어인 ‘주’로 대체하지 않고 ‘야훼’로 음역해 고유 이름성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
