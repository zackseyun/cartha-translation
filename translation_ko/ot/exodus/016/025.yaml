  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: ko
  text: 모세가 말했습니다. “오늘 이것을 먹으십시오. 오늘은 야훼께 드리는 안식일이기 때문입니다. 오늘은 들에서 이것을 찾지 못할 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  english_pob_choice: Eat it
  chosen_korean: 이것을 먹으십시오
  alternatives_korean:
  - 그것을 먹으십시오
  - 먹으십시오
  lexicon: אכל
  rationale: 지시대명사 목적어를 살려 자연스럽게 “이것을”로 옮기고, 모세의 명령형을 공손한 직접화법으로 표현했습니다.
- source_word: שַׁבָּת
  english_pob_choice: a Sabbath
  chosen_korean: 안식일
  alternatives_korean:
  - 쉼의 날
  - 안식
  lexicon: שַׁבָּת
  rationale: 절기/제도명으로 굳어진 표준 번역을 따르되, 문맥상 하루 단위의 규정을 분명히 했습니다.
- source_word: לַיהוָה
  english_pob_choice: to the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: יהוה
  rationale: 본 프로젝트 기본어인 야훼를 유지하여 히브리어 고유명을 직접 드러냈습니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들에서
  alternatives_korean:
  - 밭에서
  - 광야에서
  lexicon: שָׂדֶה
  rationale: 사냥·채집이나 농경적 맥락보다 넓은 야외 공간을 가리키므로, 자연스러운 한국어 “들”을 택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문의 לַיהוָה를 ‘야훼께’로 옮겼습니다.
  alternative_readings:
  - 주님께
  - 여호와께
  rationale: 히브리어 고유명יהוה를 가리는 대신 직접 드러내는 것이 이 역본의 원칙에 맞으며, 모세의 말이 야훼께 속한 안식일임을 분명히 합니다.
  doctrine_reference: OT divine-name policy
- issue: 명령문의 공손한 화법
  chosen_reading: 모세의 직접 발화를 합쇼체 명령으로 옮겼습니다.
  alternative_readings:
  - 평서형으로 완화
  - 하오체
  rationale: 청중에게 주는 실제 명령의 힘을 유지하면서도 현대 표준어 성경문체에 맞게 자연스럽게 표현했습니다.
  doctrine_reference: Korean register policy
