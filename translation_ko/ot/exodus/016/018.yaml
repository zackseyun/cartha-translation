  source_fidelity: 히브리어의 서술 진행(‘오멜로 재었더니’), 오멜이라는 계량 단위, 많이 거둔 이와 적게 거둔 이의 대조, 그리고 각자가 먹을 분량에 따른 수집을 충실히 반영합니다. ‘각 사람’은 אִישׁ의 분배적 용법을 적절히 옮겼습니다.
  naturalness: 문장은 현대 표준 한국어 합쇼체로 자연스럽고, ‘남는 것이 없었고 / 모자람이 없었습니다’의 균형도 명확합니다. ‘오멜로 그것을 쟀더니’는 문맥상 만나를 가리키며 무리 없이 이해됩니다.
  terminology: ‘오멜’은 원문의 건량 단위를 보존하며, ‘거두다’는 만나 본문에서 לקט의 문맥에 적절합니다. ‘먹을 만큼’은 לְפִי אָכְלוֹ의 필요 분량이라는 관용적 의미를 자연스럽게 전달합니다.
