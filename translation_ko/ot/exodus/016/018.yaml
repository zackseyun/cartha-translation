base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
  footnotes:
  - marker: a
    text: Or, 'the one with much had no excess, and the one with little lacked nothing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오멜로 그것을 쟀더니, 많이 거둔 사람도 남는 것이 없었고 적게 거둔 사람도 모자람이 없었습니다. 각 사람은 자기가 먹을 만큼 거두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많이 가진 사람은 남는 것이 없었고, 적게 가진 사람은 모자람이 없었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמֹדּוּ
  english_pob_choice: When they measured it
  chosen_korean: 그것을 쟀더니
  alternatives_korean:
  - 그리고 그들은 쟀습니다
  - 오멜로 측정하니
  lexicon: HALOT
  rationale: מדד의 기본 의미인 ‘재다’를 살리되, 결과를 이끄는 서술 흐름에 맞게 한국어에서는 자연스러운 연결형으로 옮겼습니다.
- source_word: בָעֹמֶר
  english_pob_choice: by the omer
  chosen_korean: 오멜로
  alternatives_korean:
  - 오멜 단위로
  - 오멜로 측정하여
  lexicon: HALOT
  rationale: עֹמֶר은 건량 단위이므로 구체적 단위를 유지했습니다. 한국어에서는 조사 ‘-로’로 계량 기준을 자연스럽게 드러냈습니다.
- source_word: הֶעְדִּיף / הֶחְסִיר
  english_pob_choice: had nothing left over / had no lack
  chosen_korean: 남는 것이 없었고 / 모자람이 없었습니다
  alternatives_korean:
  - 남는 것이 없었고 / 부족함이 없었습니다
  - 초과가 없었고 / 결핍이 없었습니다
  lexicon: HALOT
  rationale: 대조 구조를 살리면서도 한국어에서 가장 자연스럽게 읽히는 ‘남는 것이 없다 / 모자람이 없다’로 표현했습니다.
- source_word: לְפִי אָכְלוֹ
  english_pob_choice: according to what he could eat
  chosen_korean: 자기가 먹을 만큼
  alternatives_korean:
  - 먹을 수 있는 만큼
  - 자기가 먹는 데 필요한 만큼
  lexicon: HALOT
  rationale: 직역하면 어색한 관용구이므로, 문맥상 필요한 분량을 뜻하는 표현을 한국어 관용으로 풀었습니다.
theological_decisions:
- issue: אִישׁ and the masculine singular suffixes used distributively
  chosen_reading: ‘각 사람은 자기가 …’로 분배의 보편성을 살리되, 원문의 단수 관용은 유지했습니다.
  alternative_readings:
  - 각 남자는 그가 …
  - 모든 사람은 그들이 …
  rationale: 히브리어는 단수 형식으로 각 개인을 가리키므로, 남성 배타적으로 좁히지 않으면서도 본문의 분배 원리를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
