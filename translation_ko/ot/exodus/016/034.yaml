  - 주님
  rationale: 원문 יְהוָה를 프로젝트 기본값에 따라 직역 음역하여 언약적 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: הָעֵדֻת의 성막 용어성
  chosen_reading: 증거
  alternative_readings:
  - 언약 증거
  - 증언
  rationale: 이 단어는 단순한 일반 명사가 아니라 성막의 기술용어이므로, 과도한 해석을 피하면서도 문맥상 대상이 구체적임을 유지했습니다.
  doctrine_reference: 출애굽기 성막 용어 일관성
