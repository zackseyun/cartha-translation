base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
  footnotes:
  - marker: a
    text: Or 'placed it before the covenant testimony.' The Hebrew term 'testimony' is a technical tabernacle term that can refer more specifically to the covenant tablets or what is associated with them.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 명령하신 대로, 아론이 그것을 증거 앞에 보관하도록 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약의 증거 앞에’. 히브리어 ‘증거’는 성막의 기술용어로, 언약 돌판이나 그것과 관련된 것을 더 구체적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  english_pob_choice: As
  chosen_korean: 대로
  alternatives_korean:
  - 처럼
  - 과 같이
  lexicon: HALOT
  rationale: 앞 절의 명령에 정확히 부합함을 자연스럽게 나타내기 위해 ‘대로’를 사용했습니다.
- source_word: צִוָּה
  english_pob_choice: commanded
  chosen_korean: 명령하신
  alternatives_korean:
  - 지시하신
  - 명하신
  lexicon: HALOT
  rationale: 하나님의 권위 있는 명령을 드러내기 위해 ‘명령하다’ 계열을 선택했습니다.
- source_word: הָעֵדֻת
  english_pob_choice: the testimony
  chosen_korean: 증거
  alternatives_korean:
  - 증언
  - 언약 증거
  lexicon: HALOT
  rationale: 성막 문맥의 기술용어를 살리되, 한국어에서는 ‘증거’가 가장 간결하게 해당 용법을 전달합니다.
- source_word: לְמִשְׁמָרֶת
  english_pob_choice: for safekeeping
  chosen_korean: 안전하게
  alternatives_korean:
  - 보관하도록
  - 지켜 두려고
  lexicon: HALOT
  rationale: ‘보존/보관’의 목적을 현대 한국어로 풀어, 임시로 두는 것이 아니라 보존해 두는 뜻을 살렸습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 יְהוָה를 프로젝트 기본값에 따라 직역 음역하여 언약적 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: הָעֵדֻת의 성막 용어성
  chosen_reading: 증거
  alternative_readings:
  - 언약 증거
  - 증언
  rationale: 이 단어는 단순한 일반 명사가 아니라 성막의 기술용어이므로, 과도한 해석을 피하면서도 문맥상 대상이 구체적임을 유지했습니다.
  doctrine_reference: 출애굽기 성막 용어 일관성
