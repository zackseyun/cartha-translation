  naturalness: ‘증거 앞에 안전하게 두었습니다’는 ‘안전하게’가 무엇을 수식하는지 다소 어색하고, 보관 목적도 충분히 드러나지 않습니다. ‘보관하도록 두었습니다’가 현대 표준 한국어에서 자연스럽습니다.
