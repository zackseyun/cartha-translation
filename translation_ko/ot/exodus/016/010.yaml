translation:
  language: ko
  text: 아론이 이스라엘 자손[b]의 온 회중[a]에게 말하던 중에, 그들이 광야를 향하여 돌이켰습니다. 보십시오, 야훼의 영광이 구름 가운데 나타났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 공동체적 집합을 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘이스라엘 자손’은 히브리어의 직역적 표현을 보존한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the whole congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 온 회중
  alternatives_korean:
  - 이스라엘 사람들의 온 회중
  - 이스라엘 자손의 모든 공동체
  lexicon: HALOT
  rationale: עֲדָה의 집합적 의미를 살려 ‘회중’으로 옮기고, בְּנֵי יִשְׂרָאֵל은 POB의 source-transparent 선택에 맞추어 ‘이스라엘 자손’으로 유지했습니다.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  english_pob_choice: they turned toward the wilderness
  chosen_korean: 광야를 향하여 돌이켰습니다
  alternatives_korean:
  - 광야를 향해 몸을 돌렸습니다
  - 광야로 향했습니다
  lexicon: HALOT
  rationale: פָּנָה + אֶל의 방향 전환을 자연스러운 서술로 살려, 단순 이동보다 ‘돌이키다’가 지닌 방향 전환의 동작을 반영했습니다.
- source_word: כְּבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 영광스러운 임재
  - 주님의 영광
  lexicon: HALOT
  rationale: כָּבוֹד는 추상적 ‘영광’보다 하나님의 현현적 영광을 가리키므로 직역을 유지했고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: בֶּעָנָן
  english_pob_choice: in the cloud
  chosen_korean: 구름 가운데
  alternatives_korean:
  - 구름 속에
  - 구름 안에
  lexicon: HALOT
  rationale: 정관사 있는 ‘the cloud’는 광야 이야기의 알려진 임재 구름을 가리키므로, 한국어에서는 반복되는 현현 문맥에 자연스러운 ‘구름 가운데’로 표현했습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 칭호가 아니라 언약 이름을 사용하므로, 프로젝트 기준에 따라 이름성을 보존하는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
