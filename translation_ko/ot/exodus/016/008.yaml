  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''your grumblings ... that you are grumbling.'' The repetition of noun and cognate verb intensifies the accusation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 말했습니다. “야훼께서 저녁에는 너희에게 고기를 먹게 하시고 아침에는 빵을 배불리 먹게 하실 때, 너희가 그분을 향해 불평하는 그 너희의 불평을 야훼께서 들으셨기 때문입니다. 우리가 무엇이기에 너희가 우리에게 불평합니까? 너희의 불평은 우리를 향한 것이 아니라 야훼를 향한 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘너희의 불평 … 너희가 불평하다’처럼 명사와 동사를 반복해 불만을 강하게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명기적 고유명사를 제목어가 아닌 고유명사로 살리기 위해 ‘야훼’를 사용했습니다. 이는 POB의 영어 본문이 ‘Yahweh’를 택한 것과 대응합니다.
- source_word: בָּשָׂר
  english_pob_choice: meat
  chosen_korean: 고기
  alternatives_korean:
  - 육체
  - 살
  lexicon: HALOT
  rationale: 식사 맥락이므로 ‘고기’가 현대 한국어에서 자연스럽고, ‘육체’ 같은 추상적 의미를 피합니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 음식
  lexicon: HALOT
  rationale: 광야의 공급을 일상적 식품명으로 전달하기 위해 ‘빵’을 택했습니다. 한국어에서 ‘빵’은 이 구절의 구체성과 충분함을 자연스럽게 드러냅니다.
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  english_pob_choice: your grumblings ... you are grumbling
  chosen_korean: 불평 ... 불평
  alternatives_korean:
  - 원망 ... 원망
  - 투덜거림 ... 투덜거리다
  lexicon: HALOT
  rationale: 명사와 동사의 반복을 한국어에서도 반복으로 살려, 단순한 항의가 아니라 누적된 불만을 강조했습니다. ‘불평’은 현대적이면서도 광야 불평 전승의 정서를 잘 담습니다.
- source_word: וְנַחְנוּ מָה
  english_pob_choice: what are we?
  chosen_korean: 우리가 무엇이기에
  alternatives_korean:
  - 우리가 누구이기에
  - 우리가 무엇입니까
  lexicon: HALOT
  rationale: 히브리어의 ‘무엇’이라는 자기 비하적 뉘앙스를 살리기 위해 ‘우리가 무엇이기에’를 택했습니다.
theological_decisions:
- issue: 야훼의 이름을 제목어로 번역할지 고유명사로 옮길지
  chosen_reading: 고유명사 ‘야훼’로 유지했습니다.
  alternative_readings:
  - ‘주님’으로 대치
  - ‘여호와’로 음역
  rationale: 본문은 יְהוָה를 직접 사용하며, POB 영어 본문도 ‘Yahweh’로 고유성을 보존합니다. 따라서 한국어에서도 주어를 제목어로 바꾸지 않고 신적 이름의 직접성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
