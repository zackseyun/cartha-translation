theological_decisions:
- issue: 이 구절의 서술이 사건 전개를 어떻게 보여 주는가
  chosen_reading: 저녁의 메추라기 도래와 아침의 이슬을 연속된 하나님의 공급의 표지로 읽히도록, 평이한 서술형으로 옮겼습니다.
  alternative_readings:
  - 더 설명적인 번역으로 기적성을 강조하는 방식
  - 시적인 표현을 강화하는 방식
  rationale: 본문은 해석을 덧붙이기보다 관찰된 현상을 연속적으로 제시하므로, 서술의 간결함을 유지하는 것이 स्रोत에 가장 충실합니다.
  doctrine_reference: 출애굽기 16장의 만나/메추라기 공급 서술
