  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
  footnotes:
  - marker: a
    text: Or 'there was a layer of dew around the camp.' The Hebrew construction may be rendered either with 'was' following the subject or with existential 'there was.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저녁이 되자 메추라기가 올라와 진을 덮었습니다. 그리고 아침에는 진 사방에 이슬이 한 층 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진 사방에 이슬 한 층이 있었다’라고 옮길 수 있습니다. 히브리어 문장은 주어 뒤에 ‘있었다’를 붙이는 방식과 존재문 ‘있었다’를 따로 세우는 방식 둘 다 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִ֣י בָ/עֶ֔רֶב
  english_pob_choice: And in the evening
  chosen_korean: 저녁이 되자
  alternatives_korean:
  - 그리고 저녁에
  - 저녁 무렵에
  lexicon: WLC; EN POB audit trail
  rationale: 서술의 다음 사건을 자연스럽게 이어 주면서, 히브리어의 시간 표지를 간결하게 옮겼습니다.
- source_word: וַתַּ֣עַל הַ/שְּׂלָ֔ו
  english_pob_choice: the quail came up
  chosen_korean: 메추라기가 올라와
  alternatives_korean:
  - 메추라기가 올라왔고
  - 메추라기가 나타나
  lexicon: WLC; HALOT
  rationale: עלה의 기본 이미지를 살려 ‘올라오다’로 옮기되, 한국어 문맥에서 자연스럽게 만들었습니다.
- source_word: וַתְּכַ֖ס אֶת הַֽ/מַּחֲנֶ֑ה
  english_pob_choice: covered the camp
  chosen_korean: 진을 덮었습니다
  alternatives_korean:
  - 진영을 덮었습니다
  - 캠프를 덮었습니다
  lexicon: WLC; HALOT
  rationale: מַחֲנֶה는 출애굽기 문맥에서 ‘진’이 가장 직접적이며, ‘덮다’는 כסה의 기본 의미를 보존합니다.
- source_word: שִׁכְבַ֣ת הַ/טַּ֔ל
  english_pob_choice: a layer of dew
  chosen_korean: 이슬이 한 층
  alternatives_korean:
  - 이슬층
  - 이슬이 한 겹
  lexicon: WLC; HALOT
  rationale: שִׁכְבָה의 물리적 층/겹의 이미지를 살리되, 현대 한국어에서 읽히는 표현으로 옮겼습니다.
- source_word: סָבִ֖יב לַֽ/מַּחֲנֶֽה
  english_pob_choice: around the camp
  chosen_korean: 진 사방에
  alternatives_korean:
  - 진 둘레에
  - 진 주변에
  lexicon: WLC; HALOT
  rationale: סָבִיב의 둘러싼 위치를 간결하게 드러내기 위해 ‘사방에’를 사용했습니다.
theological_decisions:
- issue: 이 구절의 서술이 사건 전개를 어떻게 보여 주는가
  chosen_reading: 저녁의 메추라기 도래와 아침의 이슬을 연속된 하나님의 공급의 표지로 읽히도록, 평이한 서술형으로 옮겼습니다.
  alternative_readings:
  - 더 설명적인 번역으로 기적성을 강조하는 방식
  - 시적인 표현을 강화하는 방식
  rationale: 본문은 해석을 덧붙이기보다 관찰된 현상을 연속적으로 제시하므로, 서술의 간결함을 유지하는 것이 स्रोत에 가장 충실합니다.
  doctrine_reference: 출애굽기 16장의 만나/메추라기 공급 서술
