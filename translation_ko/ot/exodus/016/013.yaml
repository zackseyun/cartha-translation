translation:
  language: ko
  text: 저녁이 되자 메추라기가 올라와 진을 덮었습니다. 그리고 아침에는 진 둘레에 한 겹의 이슬이 깔려 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
