    text: 또는 ‘진 둘레에 한 겹의 이슬이 있었습니다’라고 옮길 수 있습니다. 히브리어 문장은 ‘이슬 한 겹이 있었다’라는 어순과 존재를 나타내는 문장으로 모두 옮길 수 있습니다.
    reason: lexical_alternative
