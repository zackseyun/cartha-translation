base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
  footnotes:
  - marker: a
    text: Literally, 'an omer per head.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 야훼께서 명하신 말씀입니다. 「그것에서 각 사람은 먹는 양에 따라 거두십시오. 곧 사람마다 한 오멜씩, 너희의 사람 수에 따라 하십시오. 각 사람은 자기 장막에 있는 자들을 위해 가져가야 합니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘머리마다 한 오멜’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  english_pob_choice: This is the word
  chosen_korean: 이것은 … 말씀입니다
  alternatives_korean:
  - 이것은 … 것입니다
  - 이것은 … 일입니다
  lexicon: HALOT
  rationale: 명령 도입 공식인 ‘이것은 …’를 살리되, הַדָּבָר를 단순한 ‘것’보다 명령의 내용이라는 점이 드러나는 ‘말씀’으로 옮겨 자연스럽고도 원문 기능에 가깝게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 도서 내 표준 용례
  rationale: 예외 없이 신명기적 이름을 가리키는 יְהוָה는 본 프로젝트 기본값대로 ‘야훼’로 옮겨, 호칭 대체 없이 고유성을 보존했습니다.
- source_word: אִישׁ
  english_pob_choice: each man
  chosen_korean: 각 사람
  alternatives_korean:
  - 각자
  - 각자 한 사람
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 분배 용법을 담되, 한국어에서는 성별을 과도하게 부각하지 않는 ‘각 사람’이 문맥상 가장 자연스럽습니다.
- source_word: עֹמֶר לַגֻּלְגֹּלֶת
  english_pob_choice: an omer per person
  chosen_korean: 사람마다 한 오멜씩
  alternatives_korean:
  - 머리마다 한 오멜씩
  - 한 사람당 한 오멜씩
  lexicon: HALOT
  rationale: 오멜은 고유한 계량 단위이므로 음역을 유지했고, לַגֻּלְגֹּלֶת의 직역인 ‘머리마다’는 한국어에서 어색하므로 수량 배분을 분명히 하는 ‘사람마다’로 옮겼습니다.
- source_word: לַאֲשֶׁר בְּאָהֳלוֹ
  english_pob_choice: for those who are in his tent
  chosen_korean: 자기 장막에 있는 자들을 위해
  alternatives_korean:
  - 그의 장막에 있는 사람들을 위해
  - 자기 천막 안에 있는 이들을 위해
  lexicon: HALOT
  rationale: 장막이라는 구체적 이미지를 살리면서, 분배 대상이 ‘그 안에 있는 사람들’임을 분명히 하기 위해 ‘자기 장막에 있는 자들’로 옮겼습니다.
theological_decisions:
- issue: 명령 도입구의 어감
  chosen_reading: ‘이것은 야훼께서 명하신 말씀입니다’로 시작해 공적 선언과 직접 명령의 성격을 유지했습니다.
  alternative_readings:
  - ‘이것이 야훼께서 명하신 것입니다’
  - ‘야훼께서 명하신 것은 이것입니다’
  rationale: 히브리어의 공식적 명령 소개문을 한국어에서 지나치게 평이하게 만들지 않고, 공동체에게 선포되는 언어의 무게를 살렸습니다.
  doctrine_reference: 출애굽기 16장 만나 규정의 공적 계시 성격
- issue: לַגֻּלְגֹּלֶת의 직역 여부
  chosen_reading: ‘사람마다 한 오멜씩’으로 자연화하되 수량 배분의 분배성을 유지했습니다.
  alternative_readings:
  - ‘머리마다 한 오멜씩’
  - ‘한 머리당 한 오멜씩’
  rationale: 원문의 ‘머리/개인’ 이미지가 한국어에서 오히려 비정상적으로 들릴 수 있으므로, 의미를 훼손하지 않는 범위에서 자연스럽게 옮겼습니다.
  doctrine_reference: 없음
