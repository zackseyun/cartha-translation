id: EXO.16.1
reference: Exodus 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵֽ/אֵילִ֔ם וַ/יָּבֹ֜אוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ אֶל מִדְבַּר סִ֔ין אֲשֶׁ֥ר בֵּין אֵילִ֖ם וּ/בֵ֣ין סִינָ֑י בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לְ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
  footnotes:
  - marker: a
    text: Hebrew 'sons of Israel.' This is the standard national designation and can refer to the whole people of Israel, not only males.
    reason: lexical_alternative
  - marker: b
    text: '''Sin'' here is a place name, the wilderness of Sin, not the moral term ''sin.'''
    reason: cultural_note
translation:
  language: ko
  text: 그들은 엘림을 떠나, 이스라엘 자손의 온 회중이 엘림과 시내 사이에 있는 신 광야로 들어왔습니다. 그들은 둘째 달 열다섯째 날, 곧 애굽 땅에서 나온 뒤에 그곳에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신(Sin)’은 도덕적 ‘죄(sin)’가 아니라 지명입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 길을 떠나
  - 출발하여
  - 이동하여
  lexicon: HALOT
  rationale: 광야 여정 문맥에서 נסע는 진영을 걷어 이동하는 뜻이므로, 현대 한국어의 자연스러운 ‘떠나’가 간결하게 대응합니다.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the whole congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 온 회중
  alternatives_korean:
  - 이스라엘 사람들의 온 회중
  - 이스라엘 자손의 온 공동체
  - 이스라엘의 온 회중
  lexicon: HALOT
  rationale: עֲדָה는 ‘회중’이 가장 직접적이고, בְּנֵי יִשְׂרָאֵל은 인종적·언약적 표지를 살려 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: מִדְבַּר סִין
  english_pob_choice: the wilderness of Sin
  chosen_korean: 신 광야
  alternatives_korean:
  - 시네 광야
  - 신 지대
  - 사막 시내
  lexicon: HALOT
  rationale: סִין은 죄(sin)가 아니라 지명이며, POB의 주석 취지를 살려 음역한 ‘신’과 ‘광야’를 붙여 오해를 막았습니다.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: after they had gone out from the land of Egypt
  chosen_korean: 애굽 땅에서 나온 뒤에
  alternatives_korean:
  - 애굽 땅에서 나온 후에
  - 애굽 땅에서 나간 뒤에
  - 애굽 땅을 떠난 뒤에
  lexicon: HALOT
  rationale: לְ + infinitive는 기준 시점을 나타내므로, 출애굽 사건 이후라는 시간 관계를 ‘나온 뒤에’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 지명 Sin(סִין)과 죄(sin)의 혼동 가능성
  chosen_reading: ‘신 광야’로 음역하여 지명임을 분명히 했습니다.
  alternative_readings:
  - ‘시니 광야’로 더 음역 중심으로 옮길 수 있음
  - ‘죄 광야’처럼 의미 번역하면 오해가 생김
  rationale: 본문은 도덕적 죄를 말하지 않고 지명을 말하므로, 독자가 신학적·문맥적 오해를 하지 않도록 음역을 유지하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 본문 맥락과 지명 용례에 따른 번역 원칙
