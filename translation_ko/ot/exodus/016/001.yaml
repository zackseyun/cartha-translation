revisions:
- from: 그들은 엘림을 떠나, 이스라엘 자손의 온 회중이 엘림과 시내 사이에 있는 신 광야로 들어왔습니다. 그들은 둘째 달 열다섯째 날, 곧 애굽 땅에서 나온 뒤에 그곳에 이르렀습니다.[a]
  to: 그들은 엘림을 떠났고, 이스라엘 자손의 온 회중은 엘림과 시내 사이에 있는 신[a] 광야에 이르렀습니다. 이는 그들이 애굽 땅에서 나온 뒤 둘째 달 열다섯째 날이었습니다.
  rationale: 원문의 사건 순서와 날짜의 수식 범위를 보존하도록 도착을 한 번만 표현했습니다. ‘온 회중’과 ‘이스라엘 자손’이라는 원문의 집단 명칭을 유지했으며, ‘신’이 지명임을 가리키는 주석 표지도 본문에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
