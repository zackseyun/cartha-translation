translation:
  language: ko
  text: 그래서 백성은 일곱째 날에 쉬었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그쳤습니다’; 이 동사는 안식과 관련되지만, ‘안식일을 지켰습니다’는 해석적 확장입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  english_pob_choice: rested
  chosen_korean: 쉬었습니다
  alternatives_korean:
  - 그쳤습니다
  - 중단했습니다
  - 안식했습니다
  lexicon: HALOT
  rationale: שׁבת의 기본 뜻은 ‘그치다/쉬다’이므로, 문맥상 자연스럽고 본문의 의미를 그대로 살리는 ‘쉬었습니다’를 택했습니다. ‘안식했습니다’는 Sabbath 의미를 드러내지만 다소 해석적입니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 민족
  lexicon: HALOT
  rationale: 광야 서사에서 עָם은 집단 전체를 가리키는 ‘백성’이 가장 자연스럽고 간결합니다.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  english_pob_choice: on the seventh day
  chosen_korean: 일곱째 날에
  alternatives_korean:
  - 제칠일에
  - 일곱 번째 날에
  lexicon: HALOT
  rationale: 히브리어의 날짜 표현을 한국어에서 가장 자연스럽게 옮기면 ‘일곱째 날에’입니다. ‘제칠일’은 다소 문어적이고, ‘일곱 번째 날’은 길어집니다.
theological_decisions:
- issue: 안식일 의미를 본문 밖으로 과도하게 확장할지 여부
  chosen_reading: 동사 자체는 ‘쉬다’로 번역하고, 안식일 준수라는 해석은 본문에 드러난 ‘일곱째 날’과 문맥이 담당하게 했습니다.
  alternative_readings:
  - 안식했습니다
  - 안식일을 지켰습니다
  rationale: 원문은 백성이 멈추고 쉰 사실을 진술할 뿐, 여기서 추가적인 예배적 공식어를 넣을 필요는 없습니다. 이렇게 해야 본문이 말하는 바를 과장 없이 전달할 수 있습니다.
  doctrine_reference: 'translation philosophy: optimal equivalence'
