  naturalness: ‘이렛날, 곧 안식일에는’은 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 병치 관계도 분명하게 전달합니다. ‘그것이 없을 것입니다’는 선행하는 ‘그것’을 받아 문맥상 만나를 가리킵니다.
  terminology: ‘안식일’과 ‘거두다’는 문맥 및 한국어 성경 용례에 적절합니다. 접속사 각주는 실제 접속사 번역어인 ‘그러나’에 붙여야 합니다.
