id: EXO.16.26
reference: Exodus 16:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֵׁ֥שֶׁת יָמִ֖ים תִּלְקְטֻ֑/הוּ וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י שַׁבָּ֖ת לֹ֥א יִֽהְיֶה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
  footnotes:
  - marker: a
    text: Or, 'and on the seventh day.' The Hebrew conjunction can be rendered simply 'and,' though the context is contrastive.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the seventh day, Sabbath.'
    reason: lexical_alternative
  - marker: c
    text: That is, no manna will appear on that day.
    reason: cross_reference
translation:
  language: ko
  text: 엿새 동안은 그것을 거두어야 합니다[a]. 그러나 이렛날은 안식일[b]이므로 아무것도 없을 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 이렛날에도.” 히브리어 접속사는 단순히 “그리고”로도 옮길 수 있지만, 문맥상 대조적 의미가 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “이렛날, 안식일”입니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 그 날에는 만나가 나타나지 않는다는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  english_pob_choice: For six days
  chosen_korean: 엿새 동안은
  alternatives_korean:
  - 여섯 날 동안은
  - 엿새 동안
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 기간 표현인 ‘엿새 동안’으로 옮기되, 명령문의 시간 범위를 분명히 했습니다.
- source_word: תִּלְקְטֻהוּ
  english_pob_choice: you shall gather it
  chosen_korean: 그것을 거두어야 합니다
  alternatives_korean:
  - 그것을 모아야 합니다
  - 그것을 주워야 합니다
  lexicon: HALOT
  rationale: מלקט/לקט의 ‘거두다, 모으다’ 의미를 살려 만나를 수확하듯 ‘거두다’로 옮겼고, 명령형의 당위성을 반영했습니다.
- source_word: שַׁבָּת
  english_pob_choice: a Sabbath
  chosen_korean: 안식일
  alternatives_korean:
  - 한 안식일
  - 휴식일
  lexicon: HALOT
  rationale: 히브리어 명사 자체의 표지를 한국어 교회 용례와 직접 대응시키는 것이 가장 간명해 ‘안식일’로 옮겼습니다. 다만 영어 POB의 부정관사 뉘앙스는 한국어에서 자연스럽게 드러내기 어려워 본문에서는 생략했습니다.
- source_word: לֹא יִהְיֶה בּוֹ
  english_pob_choice: there will be none
  chosen_korean: 아무것도 없을 것입니다
  alternatives_korean:
  - 거기에는 아무것도 없을 것입니다
  - 거기에는 없을 것입니다
  lexicon: HALOT
  rationale: 직역하면 ‘그 안에 없을 것이다’이지만, 문맥상 만나가 없음을 뜻하므로 한국어에서 이해 가능한 부정 존재 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘안식일’의 문법적 형식과 의미
  chosen_reading: 히브리어는 관사 없는 명사구로 ‘이렛날, 안식일’의 병치 구조이며, 한국어에서는 이를 단순히 ‘안식일’로 자연스럽게 처리했습니다.
  alternative_readings:
  - 이렛날, 한 안식일
  - 이렛날은 안식일인 날
  rationale: 본문의 형식은 제도명 자체를 말하면서도 문맥적으로는 아직 규정된 쉼의 날을 선언하는 표현입니다. 한국어에서는 불필요한 설명을 덧붙이지 않고도 의미가 전달됩니다.
  doctrine_reference: '원문 우선 원칙: 해설적 보충보다 מקור 텍스트의 직접성 유지'
