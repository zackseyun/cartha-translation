source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שִּׁשִּׁ֗י לָֽקְט֥וּ לֶ֨חֶם֙ מִשְׁנֶ֔ה שְׁנֵ֥י הָ/עֹ֖מֶר לָ/אֶחָ֑ד וַ/יָּבֹ֨אוּ֙ כָּל נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה וַ/יַּגִּ֖ידוּ לְ/מֹשֶֽׁה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
  footnotes:
  - marker: a
    text: An omer was a unit of dry measure used in ancient Israel.
    reason: cultural_note
translation:
  language: ko
  text: 여섯째 날에 그들은 빵을 두 배로 거두었는데, 곧 한 사람당 두 오멜이었습니다. 회중의 모든 지도자들이 와서 모세에게 알렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 여섯째 날에
  alternatives_korean:
  - 그리고 그렇게 되었습니다
  - 일이 일어났습니다
  lexicon: HALOT
  rationale: 서술 도입의 사건 진행을 한국어에서는 자연스럽게 날짜 부사어로 풀어, 문맥상 ‘그 일이 일어났다’는 전개를 간결하게 살렸습니다.
- source_word: לָקְטוּ לֶחֶם מִשְׁנֶה
  english_pob_choice: they gathered twice as much bread
  chosen_korean: 빵을 두 배로 거두었는데
  alternatives_korean:
  - 빵을 두 배로 모았는데
  - 빵의 두 몫을 거두었는데
  lexicon: HALOT
  rationale: לָקַט는 ‘거두다/모으다’의 수확적 뉘앙스가 있어 ‘거두다’로 옮겼고, מִשְׁנֶה는 수량의 배가를 뜻하므로 ‘두 배로’가 가장 직접적입니다.
- source_word: שְׁנֵי הָעֹמֶר לָאֶחָד
  english_pob_choice: two omers for each person
  chosen_korean: 곧 한 사람당 두 오멜이었습니다
  alternatives_korean:
  - 두 오멜씩이었습니다
  - 각 사람에게 두 오멜이었습니다
  lexicon: HALOT
  rationale: 본문의 분배량을 분명히 하기 위해 분배적 표현으로 처리했고, עֹמֶר는 정확한 현대 단위가 없으므로 음역 ‘오멜’을 유지했습니다.
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  english_pob_choice: all the leaders of the congregation
  chosen_korean: 회중의 모든 지도자들
  alternatives_korean:
  - 공동체의 모든 지도자들
  - 회중의 모든 지배자들
  lexicon: HALOT
  rationale: נְשִׂיאִים은 정치적 ‘통치자’보다 공동체의 대표자·지도자를 가리키는 범주가 더 자연스러워 ‘지도자들’로 옮겼고, עֵדָה는 출애굽기 문맥에서 ‘회중’이 적절합니다.
- source_word: וַיַּגִּידוּ לְמֹשֶׁה
  english_pob_choice: came and told Moses
  chosen_korean: 와서 모세에게 알렸습니다
  alternatives_korean:
  - 와서 모세에게 보고했습니다
  - 와서 모세에게 말했습니다
  lexicon: HALOT
  rationale: וַיָּבֹאוּ와 וַיַּגִּידוּ의 연속 동작을 살려 ‘와서 … 알렸습니다’로 옮겼습니다. ‘알리다’는 공식적 전달의 뉘앙스를 유지합니다.
