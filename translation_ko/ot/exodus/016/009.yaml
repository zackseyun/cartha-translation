  rationale: 본문이 고유한 언약 이름을 직접 사용하므로, 한국어 본문에서도 제목화된 대체어보다 고유명 표기가 원문 투명성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
