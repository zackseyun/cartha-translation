translation:
  language: ko
  text: 그때 모세가 아론에게 말했습니다. “이스라엘 자손[b]의 온 회중에게 말하십시오. ‘야훼 앞으로 나오십시오[a]. 그분이 너희의 불평을 들으셨기 때문입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼 앞으로 나아오십시오.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “이스라엘의 아들들”입니다. 곧 이스라엘 백성을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그리하여 ... 말했습니다
  lexicon: WLC/서사 연결
  rationale: 와우 연속형은 앞뒤 사건을 이어 주는 서사 진행을 나타내므로, 한국어에서는 자연스러운 시간 전개를 살린 '그때'로 옮겼습니다.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: all the congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 온 회중
  alternatives_korean:
  - 이스라엘 자손의 모든 회중
  - 이스라엘 사람들의 온 회중
  lexicon: HALOT
  rationale: עֲדָה의 집합적·공동체적 의미를 '회중'으로 살리고, בְּנֵי יִשְׂרָאֵל은 소스 표현을 드러내기 위해 '이스라엘 자손'을 유지했습니다.
- source_word: קִרְבוּ
  english_pob_choice: Come near
  chosen_korean: 가까이 나오십시오
  alternatives_korean:
  - 가까이 오십시오
  - 다가오십시오
  lexicon: HALOT
  rationale: 하나님 앞에 물리적으로 접근하라는 명령이므로, 현대 한국어에서 자연스럽고 직접적인 명령형인 '가까이 나오십시오'를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md Contested terms
  rationale: 본문의 신명기적 하나님의 이름을 직역·음역 원칙에 따라 '야훼'로 옮겨, 호칭 대체가 아니라 고유명으로 드러냈습니다.
- source_word: תְּלֻנֹּתֵיכֶם
  english_pob_choice: your grumblings
  chosen_korean: 너희의 원망
  alternatives_korean:
  - 너희의 불평
  - 너희의 투덜거림
  lexicon: HALOT
  rationale: 이 단어는 단순한 불만보다 광야에서 반복된 불신앙적 원망의 뉘앙스를 가지므로, 한국어에서는 그 긴장을 드러내는 '원망'이 가장 적절합니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה는 '야훼'로 표기했습니다.
  alternative_readings:
