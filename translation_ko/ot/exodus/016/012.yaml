    reason: lexical_alternative
translation:
  language: ko
  text: 나는 이스라엘 자손의 불평을 들었습니다[a]. 그들에게 이렇게 말하십시오. ‘해 질 무렵에는[b] 너희가 고기를 먹고, 아침에는 빵으로 배부를 것입니다. 그러면 너희는 내가 너희의 하나님 야훼임을 알게 될 것입니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 문자적으로는 ‘저녁들 사이에’에 해당하며 황혼 무렵을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
