    text: 'Hebrew: ''between the evenings,'' an idiom referring to the twilight period.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' / 'the children of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 이스라엘 자손의 투덜거림을 들었습니다[a]. 그들에게 말하여 이르기를, ‘해 질 무렵에는 고기를 먹고, 아침에는 빵으로 배부를 것이니[b], 너희는 내가 너희의 하나님 야훼임을 알게 될 것입니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘이스라엘 자손’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 문자적으로는 ‘저녁들 사이에’에 해당하며 황혼 무렵을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּלוּנֹּת
  english_pob_choice: grumblings
  chosen_korean: 투덜거림
  alternatives_korean:
  - 원망
  - 불평
  - 투덜거림들
  lexicon: HALOT
  rationale: 반복적이고 불만 섞인 불평을 드러내는 말로, 단순한 중립적 ‘불평’보다 ‘투덜거림’이 원문의 정서와 반복성을 더 잘 살립니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구조를 한국어 성경 관용 안에서 비교적 투명하게 살릴 수 있는 표현으로 ‘이스라엘 자손’을 택했습니다.
- source_word: בֵּין הָעַרְבַּיִם
  english_pob_choice: Between the evenings
  chosen_korean: 해 질 무렵
  alternatives_korean:
  - 저녁과 저녁 사이에
  - 두 저녁 사이에
  - 황혼 무렵
  lexicon: HALOT
  rationale: 직역형인 ‘저녁과 저녁 사이에’는 한국어에서 지나치게 생경하므로, 원문의 관용적 시간표현을 살리면서 독자가 이해할 수 있는 ‘해 질 무렵’으로 옮겼습니다. footnote로 더 직역적인 의미를 보완했습니다.
- source_word: תִּשְׂבְּעוּ לָחֶם
  english_pob_choice: you shall be filled with bread
  chosen_korean: 빵으로 배부를 것이니
  alternatives_korean:
  - 빵으로 배가 부를 것이니
  - 빵을 충분히 먹게 될 것이니
  - 빵으로 만족할 것이니
  lexicon: HALOT
  rationale: ‘배부르다’가 원문의 포만 감각을 자연스럽게 전달합니다. ‘빵’은 לחם의 기본 의미를 현대 한국어에서 가장 직접적으로 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명사형은 ‘야훼’로 옮겨, титlulational substitution이 아닌 고유 이름을 보존합니다.
theological_decisions:
- issue: 야훼의 이름을 한국어 본문에서 어떻게 드러낼지
  chosen_reading: ‘야훼’로 음역하여 하나님의 고유 이름을 본문에 보존했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문은 יְהוָה를 직접 사용하므로, 관용적 대체칭인 ‘주님’보다 고유 이름을 드러내는 번역이 출처 친화적입니다. 프로젝트 기준에 따라 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
