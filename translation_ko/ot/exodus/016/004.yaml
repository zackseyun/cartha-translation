revisions:
- from: 그때 야훼께서 모세에게 말씀하셨습니다. “보십시오, 내가 너희를 위해 하늘에서 빵을 비처럼 내리겠습니다. 그러면 백성은 밖으로 나가 날마다 하루 분량을 거두어들이게 될 것입니다. 이것은 그들이 내 법 안에서 걸을지 아닌지를 내가 시험하기 위함입니다.”[a][b][c]
  to: 그때 야훼께서 모세에게 말씀하셨습니다. “보십시오, 내가 너희를 위하여 하늘에서 빵을 비처럼 내리겠습니다.[a] 백성은 나가서 날마다 그날의 분량을 거둘 것입니다.[b] 이는 내가 그들이 내 법을 따라 살아갈지 그렇지 않을지를 시험하려는 것입니다.[c]”
  rationale: 순차 접속을 조건문처럼 만들 수 있는 ‘그러면’을 제거하고, 일일 분량 관용구를 ‘날마다 그날의 분량’으로 명료하게 옮겼습니다. ‘걷다’의 은유는 한국어에서 자연스러운 ‘법을 따라 살아가다’로 옮겨 삶의 행실과 순종이라는 뜻을 보존했습니다. 또한 각주를 해당 단어·구절 뒤에 배치하고, 본문과 중복되던 각주 a 및 부정확한 각주 b를 수정했습니다.
  reviewer_model: gpt-5.6-terra
