  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
  footnotes:
  - marker: a
    text: Or “I will rain bread from heaven for you.” The Hebrew participle can be rendered with imminent future force.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the matter of a day in its day,” that is, each day’s needed portion gathered on that day.
    reason: lexical_alternative
  - marker: c
    text: Or “whether they will walk in my instruction or not.”
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “보십시오, 내가 너희를 위해 하늘에서 빵을 비처럼 내리겠습니다. 그러면 백성은 밖으로 나가 날마다 하루 분량을 거두어들이게 될 것입니다. 이것은 그들이 내 법 안에서 걸을지 아닌지를 내가 시험하기 위함입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사형은 임박한 미래의 힘을 가질 수 있으므로, “내가 빵을 비처럼 내리겠습니다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 “날의 말(일의 몫)을 그날에”로, 곧 그날 필요한 분량을 그날에 거두라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘내 법’은 여기서 ‘내 가르침’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본 용례
  rationale: 언약적 신명은 프로젝트 기본값에 따라 야훼로 옮겨, 본문의 고유한 하나님의 이름을 유지했습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 있습니다
  lexicon: HALOT
  rationale: 하나님의 선포를 시작하는 주의 환기 표현으로, 현대 한국어에서 자연스럽고 공적 선언의 느낌을 주는 ‘보십시오’를 선택했습니다.
- source_word: מַמְטִיר לָכֶם לֶחֶם מִן הַשָּׁמָיִם
  english_pob_choice: I am raining bread from heaven for you
  chosen_korean: 내가 너희를 위해 하늘에서 빵을 비처럼 내리겠습니다
  alternatives_korean:
  - 내가 너희에게 하늘에서 빵을 내리겠습니다
  - 내가 너희를 위해 하늘에서 양식을 내리겠습니다
  lexicon: HALOT
  rationale: 히브리어의 동작성을 살려 ‘비처럼 내리다’로 옮겼고, source의 구체적 명사 לֶחֶם을 따라 ‘양식’보다 ‘빵’을 유지했습니다.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: a day's portion each day
  chosen_korean: 날마다 하루 분량
  alternatives_korean:
  - 매일 필요한 몫
  - 그날의 몫을 그날마다
  lexicon: HALOT
  rationale: 관용구의 핵심인 ‘하루에 해당하는 몫’이라는 뜻을 압축해, 분배의 일일 제한과 반복성을 함께 드러냈습니다.
- source_word: בְּתוֹרָתִי
  english_pob_choice: in my law
  chosen_korean: 내 법 안에서
  alternatives_korean:
  - 내 율법 안에서
  - 내 가르침 안에서
  lexicon: HALOT
  rationale: 토라의 의미를 살리면서도 한국어에서 ‘걸을지’와 자연스럽게 결합되도록 ‘법 안에서’로 옮겼습니다. 이는 단순 지식이 아니라 따르고 살아야 할 규범적 요구를 드러냅니다.
theological_decisions:
- issue: לְמַעַן אֲנַסֶּנּוּ의 시험 목적
  chosen_reading: “이것은 그들이 내 법 안에서 걸을지 아닌지를 내가 시험하기 위함입니다”
  alternative_readings:
  - “내가 그들을 시험하기 위함입니다”
  - “내가 그들이 내 가르침 안에서 걸을지 아닌지를 시험하기 위함입니다”
  rationale: 본문의 목적절을 직접 드러내어, 만나 공급이 단순한 생계 제공이 아니라 순종 여부를 드러내는 시험이라는 점을 보존했습니다.
  doctrine_reference: 출애굽기 16장의 순종 시험과 언약적 훈련이라는 본문 신학
