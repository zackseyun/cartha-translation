translation:
  language: ko
  text: 이스라엘 집은 그것의 이름을 만나라 불렀습니다[a]. 그것은 흰 고수 씨와 같았고[b], 그 맛은 꿀을 넣은 웨이퍼와 같았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 man. 영어 관례로는 ‘manna’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘고수 씨, 곧 흰 것처럼 보이는 씨앗’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘꿀과 함께한 웨이퍼’ 또는 ‘꿀을 넣은 얇은 과자’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ / called
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 이름 지었습니다
  - 명명했습니다
  lexicon: HALOT
  rationale: 이곳은 음식의 이름을 짓는 용법이므로, 한국어에서도 가장 직접적인 동사인 ‘불렀습니다’가 원문의 행위를 잘 드러냅니다.
- source_word: בֵּית יִשְׂרָאֵל / The house of Israel
  english_pob_choice: The house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘 자손
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 살리기 위해 직역에 가까운 ‘이스라엘 집’을 택했습니다.
- source_word: כְּזֶרַע גַּד לָבָן / like white coriander seed
  english_pob_choice: like white coriander seed
  chosen_korean: 흰 고수 씨와 같았고
  alternatives_korean:
  - 흰 고수 씨처럼 보였고
  - 흰 고수 씨와 같았으며
  lexicon: HALOT
  rationale: English audit trail의 ‘coriander seed’에 맞추어 한국어 일반명 ‘고수’를 사용했고, ‘흰’이 씨앗 전체를 수식하는 비교 구문을 자연스럽게 옮겼습니다.
- source_word: כְּצַפִּיחִת בִּדְבָשׁ / wafers with honey
  english_pob_choice: wafers with honey
  chosen_korean: 꿀을 넣은 웨이퍼
  alternatives_korean:
  - 꿀과 함께한 웨이퍼
  - 꿀이 들어간 웨이퍼
  - 꿀을 넣은 얇은 과자
  lexicon: HALOT
  rationale: צַפִּיחִת는 얇은 구운 과자/웨이퍼를 가리키므로, 통용어 ‘웨이퍼’를 쓰되 ‘꿀을 넣은’으로 재료 감각을 살렸습니다.
theological_decisions:
- issue: മanna 이름의 음역과 한국어 전통어 처리
  chosen_reading: 본문에는 전통적으로 통용되는 ‘만나’를 두고, 각주로 히브리어 어형의 ‘man’ 계열 설명을 반영합니다.
  alternative_readings:
  - 그것의 이름을 마ן이라고 불렀습니다
  - 그것의 이름을 만이라 불렀습니다
  rationale: 독자가 즉시 알아볼 수 있는 성경 용례를 보존하면서도, 원문이 실제로는 히브리어 어형을 바탕으로 한 명명임을 각주로 드러내는 편이 공시성과 추적 가능성에 유리합니다.
  doctrine_reference: 출 16:31의 명명 전승과 어휘 관례
- issue: 비교 구문의 문체와 감각 묘사
  chosen_reading: 맛 묘사는 직역에 가깝게 유지하여 음식의 감각적 특징을 약화하지 않았습니다.
  alternative_readings:
  - 꿀맛이 나는 웨이퍼와 같았습니다
  - 꿀이 들어간 얇은 과자와 같았습니다
  rationale: 원문은 맛의 비유를 병렬적으로 제시하므로, 설명을 덧붙여 부드럽게 하기보다 비교 자체를 살리는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 출 16:31 본문 수사
