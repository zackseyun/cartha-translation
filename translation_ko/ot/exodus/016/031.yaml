  text: 이스라엘 집안은 그 이름을 ‘만나’라고 불렀습니다[a]. 그것은 흰 고수 씨와 같았고[b], 그 맛은 꿀을 넣은 웨이퍼와 같았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 man입니다. 한국어 성경에서는 전통적으로 ‘만나’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘희고 고수 씨 같은 것’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘꿀을 곁들인 웨이퍼’ 또는 ‘꿀을 넣은 얇은 과자’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ / called
