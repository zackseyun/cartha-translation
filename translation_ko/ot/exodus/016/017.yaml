  lexicon: HALOT
  rationale: 만나를 모으는 문맥에서 ‘거두다’가 수확·채집의 뉘앙스를 가장 잘 전달합니다.
- source_word: הַמַּרְבֶּה / הַמַּמְעִיט
  english_pob_choice: some more / some less
  chosen_korean: 많이 거둔 사람 / 적게 거둔 사람
  alternatives_korean:
  - 많이 거둔 이 / 적게 거둔 이
  - 더 많이 거둔 사람 / 덜 거둔 사람
  lexicon: HALOT
  rationale: 실체화된 분사로서 ‘많이/적게 거둔 사람’이라는 의미를 분명히 드러내되, POB의 분배 대비를 한국어에서 자연스럽게 재현했습니다.
