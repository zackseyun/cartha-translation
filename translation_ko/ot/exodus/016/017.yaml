  lexicon: HALOT
  rationale: 명령에 대한 응답으로서의 관용구를 자연스러운 한국어로 옮기되, 원문의 ‘그렇게’와 행위 완료를 살렸습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
