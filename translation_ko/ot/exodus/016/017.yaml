  - 그렇게 따랐습니다
  lexicon: HALOT
  rationale: 명령에 대한 응답으로서의 관용구를 자연스러운 한국어로 옮기되, 원문의 ‘그렇게’와 행위 완료를 살렸습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 그대로 살리면서도 한국어 성경에서 익숙한 직역형인 ‘이스라엘 자손’을 유지했습니다.
- source_word: וַיִּלְקְטוּ
  english_pob_choice: they gathered
  chosen_korean: 거둔
  alternatives_korean:
  - 모은
