  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 그대로 살리면서도 한국어 성경에서 익숙한 직역형인 ‘이스라엘 자손’을 유지했습니다.
- source_word: וַיִּלְקְטוּ
