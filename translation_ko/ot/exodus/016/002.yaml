lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  english_pob_choice: grumbled
  chosen_korean: 투덜거렸습니다
  alternatives_korean:
  - 원망했습니다
  - 불평했습니다
  - 투덜거렸습니다
  lexicon: HALOT
  rationale: בין־לון/לין 계열의 반복적 불만·항의는 한국어에서 일상적이면서도 부정적 뉘앙스를 살리는 ‘투덜거리다’가 가장 자연스럽고, 지도자들을 향한 공동체적 불평의 느낌도 유지합니다.
- source_word: כָּל עֲדַת
  english_pob_choice: the whole congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 온 회중
  - 전체 회중
  - 온 공동체
  lexicon: HALOT
  rationale: כָּל은 전체성을, עֲדָה는 모인 공동체를 가리키므로 ‘온 회중’이 간결하면서도 집합적 의미를 잘 드러냅니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 관용구를 직접 반영해 남성 복수 표지를 지우지 않고, 한국어 성경에서 익숙한 ‘이스라엘 자손’을 유지했습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 광야에서
  - 들판에서
  - 사막에서
  lexicon: HALOT
  rationale: מִדְבָּר는 일반적인 ‘사막’보다 성경적·지리적으로 더 정확한 ‘광야’가 적절합니다.
theological_decisions:
- issue: 인간 대상의 불평 동사 선택이 독자에게 주는 톤
  chosen_reading: ‘투덜거렸습니다’로 공동체적 불만과 지도자에 대한 항의의 긴장을 드러냈습니다.
  alternative_readings:
  - ‘원망했습니다’는 더 강한 적대감으로 읽힐 수 있습니다.
  - ‘불평했습니다’는 의미는 정확하지만 구어성이 덜 살아납니다.
  rationale: 본문은 단순한 독백이 아니라 광야에서 지도자들을 향한 집단적 항의이므로, 너무 약화되거나 지나치게 격앙되지 않는 중간 톤이 필요합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy (optimal-equivalence)
