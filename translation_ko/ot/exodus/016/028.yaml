  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
  footnotes:
  - marker: a
    text: Or “my instructions.” The Hebrew torot (plural of torah) can denote authoritative instruction as well as laws.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. 「너희가 얼마나 더 내 명령들과 내 법들을 지키기를 거부하겠느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תּוֹרֹת(토라의 복수형)은 권위 있는 지시나 법들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 원문 고유명사 표기 관례
  rationale: 원문의 여호와 이름(יהוה)을 제목이 아니라 고유명으로 드러내기 위해 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: עַד אָנָה
  english_pob_choice: How long
  chosen_korean: 얼마나 더
  alternatives_korean:
  - 언제까지
  - 얼마나 오래
  lexicon: HALOT
  rationale: 계속되는 불순종을 책망하는 관용구이므로, 한국어에서는 ‘얼마나 더’가 자연스럽고 경고의 뉘앙스를 잘 살립니다.
- source_word: מִצְוֺתַי
  english_pob_choice: my commandments
  chosen_korean: 내 명령들
  alternatives_korean:
  - 내 계명들
  - 내 명령
  lexicon: HALOT
  rationale: צוּוָה 계열의 명령/법령 의미를 살리되, 반복적 불순종에 대한 직접적 책망이 드러나도록 복수형 ‘명령들’로 옮겼습니다.
- source_word: וְתוֹרֹתָי
  english_pob_choice: my laws
  chosen_korean: 내 법들
  alternatives_korean:
  - 내 지시들
  - 내 가르침들
  - 내 율법들
  lexicon: HALOT
  rationale: POB의 본문 의미인 ‘laws’를 따라 규범적·법적 무게를 살렸고, ‘율법들’은 전통적이지만 한국어에서 다소 경직될 수 있어 본문에는 쓰지 않았습니다.
theological_decisions:
- issue: תּוֹרָה의 번역 범위
  chosen_reading: 본문에는 ‘법들’을 두고, 해석의 여지는 주석 없이 본문에만 남겼습니다.
  alternative_readings:
  - 지시들
  - 가르침들
  - 율법들
  rationale: 출애굽기 16장의 맥락은 단순한 교훈보다 언약적 규범 위반을 질책하는 장면이므로, 본문에서는 법적 강도를 유지하는 것이 좋습니다. 동시에 תּוֹרָה가 ‘instruction’도 될 수 있다는 긴장은 ‘법들’로만 완전히 닫지 않도록 보존했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it; lexical alternative preserved in audit layer
