    rationale: 영어 감사 기록의 각주는 תוֹרֹת의 어휘 대안을 설명합니다. 한국어 본문에서도 ‘법들’ 바로 뒤에 표지를 두어 해당 어휘의 범위를 명확히 해야 합니다.
  - severity: low
