  source_fidelity: 히브리어의 책망 관용구 עַד־אָנָה는 ‘언제까지’가 지속되는 거부를 더 직접적으로 드러냅니다. מִצְוֺתַי와 תוֹרֹתַי의 복수 및 1인칭 소유는 ‘내 계명들과 내 법들’로 보존할 수 있습니다.
  naturalness: ‘얼마나 더’도 가능하지만, 이 수사 의문문에서는 ‘언제까지’가 더 자연스럽고 간결합니다. 합쇼체 지침에 맞추어 직접 화법의 의문 종결을 ‘거부하겠습니까?’로 정리했습니다.
  terminology: יהוה는 POB 방침에 따라 ‘야훼’로 유지했습니다. מִצְוֺת은 ‘계명들’, תוֹרֹת은 본문에서 ‘법들’로 옮기고, ‘지시’라는 어휘 범위는 각주로 보존했습니다.
