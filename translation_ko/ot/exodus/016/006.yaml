translation:
  language: ko
  text: 그때 모세와 아론이 이스라엘의 모든 자손에게 말했습니다. “저녁이 되면 야훼께서 여러분을 이집트 땅에서 데리고 나오셨다는 것을 알게 될 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה וְאַהֲרֹן
  english_pob_choice: Then Moses and Aaron said
  chosen_korean: 그때 모세와 아론이 말했습니다
  alternatives_korean:
  - 그리고 모세와 아론이 말했습니다
  - 그 후 모세와 아론이 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 전진을 자연스러운 한국어로 옮기기 위해 ‘그때’로 처리했고, 인물 이름은 통용 표기를 따랐습니다.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: to all the sons of Israel
  chosen_korean: 이스라엘의 모든 자손에게
  alternatives_korean:
  - 이스라엘의 모든 아들들에게
  - 이스라엘 사람들에게
  - 이스라엘의 모든 자손들
  lexicon: HALOT
  rationale: 히브리어의 직역성인 ‘sons/children’ 구조를 살리면서도 한국어에서 자연스럽고 오해가 적은 ‘자손’으로 옮겼습니다.
- source_word: עֶרֶב
  english_pob_choice: At evening
  chosen_korean: 저녁이 되면
  alternatives_korean:
  - 저녁에
  - 해질 무렵
  - 저녁 무렵
  lexicon: HALOT
  rationale: 문맥상 시간 부사구이므로 예고적 의미를 드러내는 ‘저녁이 되면’이 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 히브리어 신명은 대체 호칭이 아니라 고유명사로서 ‘야훼’로 옮겼습니다.
- source_word: הוֹצִיא אֶתְכֶם
  english_pob_choice: brought you out
  chosen_korean: 여러분을 데리고 나오셨다는
  alternatives_korean:
  - 여러분을 이끌어 내셨다는
  - 여러분을 끌어내셨다는
  lexicon: HALOT
  rationale: ‘데리고 나오다’는 יצא의 사역형 의미를 자연스럽게 살리면서 출애굽의 구원 행위를 분명히 드러냅니다.
- source_word: מֵאֶרֶץ מִצְרָיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 애굽 땅에서
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅’을 반영하되 현대 한국어에서 통용되는 지명을 사용해 문장을 간결하게 했습니다.
theological_decisions:
- issue: 신명(יהוה)과 한국어 표기
  chosen_reading: ‘야훼’로 직역하여 고유한 언약적 이름을 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 본문은 титул이 아니라 신명 자체를 사용하므로, 대체 호칭보다 이름을 보존하는 쪽이 원문의 식별성을 유지합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
