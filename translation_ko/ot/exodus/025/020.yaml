source:
  edition: WLC
  text: וְ/הָי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת יִהְי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
  footnotes:
  - marker: a
    text: Or 'atonement cover.' Hebrew kapporet refers to the gold cover of the ark.
    reason: lexical_alternative
translation:
  language: ko
  text: 그룹들은 날개를 위로 펼쳐 그 날개로 속죄소[a]를 덮고, 그들의 얼굴은 서로를 향하게 하되, 그룹들의 얼굴은 속죄소를 향하게 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄 덮개’. 히브리어 카포레트는 언약궤의 금으로 된 덮개를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  english_pob_choice: And ... shall be
  chosen_korean: '...해야 합니다'
  alternatives_korean:
  - '...될 것입니다'
  - '...있어야 합니다'
  lexicon: WLC
  rationale: 지시문맥의 완성형을 한국어에서는 규범적 명령·설명형으로 옮기는 것이 자연스러워, 완곡한 미래보다 건축 지시의 성격을 살렸습니다.
- source_word: הַכְּרֻבִים
  english_pob_choice: the cherubim
  chosen_korean: 그룹들은
  alternatives_korean:
  - 케루빔들은
  - 그룹들
  lexicon: HALOT
  rationale: 성막 문맥의 הכרובים는 전통적 음역인 ‘그룹’이 한국어 성경에서 가장 자연스럽고, 합쇼체 본문에서도 고유한 성소 용어로 읽히게 합니다.
- source_word: פֹּרְשֵׂי כְנָפַיִם
  english_pob_choice: spreading out their wings
  chosen_korean: 날개를 ... 펴서
  alternatives_korean:
  - 날개를 펼친 채
  - 날개를 벌려
  lexicon: HALOT
  rationale: 분사구문이 묘사하는 자세를 한국어 동작 표현으로 살려, 정적인 상태보다 ‘펴서’가 원문의 활동성을 더 잘 반영합니다.
- source_word: לְמַעְלָה סֹכְכִים בְּכַנְפֵיהֶם עַל הַכַּפֹּרֶת
  english_pob_choice: upward, overshadowing the mercy seat with their wings
  chosen_korean: 위로 펴서 속죄소를 그 날개로 덮고
  alternatives_korean:
  - 위로 펴서 속죄소를 날개로 가리고
  - 위로 펴서 속죄소를 그 날개로 덮으며
  lexicon: HALOT
  rationale: סֹכְכִים의 보호적 ‘덮음’ 이미지를 살려 ‘덮고’로 옮겼고, כַּפֹּרֶת는 성막 기구의 고유 명칭인 ‘속죄소’가 가장 직접적입니다.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  english_pob_choice: and their faces shall be one toward another
  chosen_korean: 얼굴은 서로를 향하며
  alternatives_korean:
  - 얼굴은 한쪽이 다른 쪽을 향하며
  - 얼굴은 서로 마주하며
  lexicon: HALOT
  rationale: אָחִיו의 분배적 표현을 한국어의 상호관계 표현 ‘서로를 향하며’로 압축해, 두 그룹이 서로 마주 보는 구도를 자연스럽게 드러냅니다.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  english_pob_choice: the faces of the cherubim shall be toward the mercy seat
  chosen_korean: 그룹들의 얼굴은 속죄소를 향해야 합니다
  alternatives_korean:
  - 그룹들의 얼굴은 속죄소 쪽을 향해야 합니다
  - 그룹들의 얼굴은 속죄소를 향하게 해야 합니다
  lexicon: HALOT
  rationale: 마지막 절은 얼굴의 방향을 재강조하므로, 동사를 앞에 반복하지 않고도 지시문맥을 살리는 ‘향해야 합니다’로 간결하게 정리했습니다.
theological_decisions:
- issue: כַּפֹּרֶת의 한국어 렌더링
  chosen_reading: 속죄소
  alternative_readings:
  - 은혜시트
  - 속죄 덮개
  - 시은좌
  rationale: 이 항목은 언약궤의 덮개이면서 속죄와 연결되는 성막 기물로, 한국어 성경 전통에서 가장 기능적·신학적으로 분명한 명칭은 ‘속죄소’입니다. 영어 POB의 ‘mercy seat’와도 대응되며, 본절의 성막-임재 맥락을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: translation philosophy §1, §5'
- issue: אִישׁ אֶל אָחִיו의 한국어 구문
  chosen_reading: 서로를 향하며
  alternative_readings:
  - 한 사람은 다른 사람을 향하며
  - 서로 마주하며
  rationale: 히브리어의 분배적 관용구는 단순한 위치 설명보다 상호 대칭을 뜻하므로, 한국어에서는 ‘서로를 향하며’가 의미를 가장 자연스럽게 보존합니다.
  doctrine_reference: HALOT lexeme notes; POB lexical audit
