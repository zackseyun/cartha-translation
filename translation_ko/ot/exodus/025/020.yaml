    rationale: ‘날개로’ 및 ‘그들의 얼굴은 서로를 향하게 하되’가 현대적인 합쇼체 지시문으로 더 자연스럽고, 히브리어의 상호 방향 표현과 최종 방향 지시를 함께 보존합니다.
