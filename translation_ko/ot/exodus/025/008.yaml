  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָ֥שׂוּ לִ֖/י מִקְדָּ֑שׁ וְ/שָׁכַנְתִּ֖י בְּ/תוֹכָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
  footnotes:
  - marker: a
    text: Literally, 'in their midst.' The Hebrew says 'among them,' emphasizing God's presence with the people, not only within the sanctuary structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 나를 위하여 성소를 만들게 하십시오. 그러면 내가 그들 가운데 거하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 가운데’입니다. 히브리어는 성소 건물 안쪽보다 백성 가운데 계시는 하나님의 임재를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  english_pob_choice: let them make
  chosen_korean: 만들게 하십시오
  alternatives_korean:
  - 만들 것입니다
  - 만들게 하라
  lexicon: HALOT
  rationale: 집단에게 주어지는 지시문이므로 현대 한국어에서는 합쇼체 명령/허용형인 ‘만들게 하십시오’가 가장 자연스럽고, 3인칭 복수의 지시적 힘도 살립니다.
- source_word: לִי
  english_pob_choice: for me
  chosen_korean: 나를 위하여
  alternatives_korean:
  - 나를 위해
  - 내게
  lexicon: HALOT
  rationale: ל + 1인칭 단수는 이 문맥에서 목적/귀속을 나타내므로, 성소가 야훼의 용도와 임재를 위한 것임을 드러내는 ‘나를 위하여’가 적절합니다.
- source_word: מִקְדָּשׁ
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성막
  - 거룩한 곳
  lexicon: HALOT
  rationale: מִקְדָּשׁ은 거룩하게 구별된 공간을 가리키므로, 본문 맥락에서 너무 좁게 특정 건축물을 가리키지 않으면서도 의미를 전하는 ‘성소’가 적절합니다.
- source_word: וְשָׁכַנְתִּי
  english_pob_choice: so that I may dwell
  chosen_korean: 그러면 내가 … 거하겠습니다
  alternatives_korean:
  - 내가 거하겠습니다
  - 내가 살겠습니다
  lexicon: HALOT
  rationale: שׁכן의 핵심은 ‘거하다/임재하다’이며, 앞 절과의 관계상 목적·결과를 자연스럽게 나타내는 연결로 옮겼습니다. ‘거하다’가 성경적 임재의 뉘앙스를 가장 잘 보존합니다.
- source_word: בְּתוֹכָם
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그들 중에
  - 그들의 한가운데
  lexicon: HALOT
  rationale: 히브리어 복수 대명사 ‘그들’이 가리키는 바를 살려, 하나님이 건물 ‘안에’가 아니라 백성 ‘가운데’ 거하신다는 점을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 하나님의 거하심의 대상
  chosen_reading: 백성 가운데 거하심
  alternative_readings:
  - 성소 안에 거하심
  - 그들 가운데 거하심
  rationale: 히브리어는 장소보다 공동체를 강조하는 복수형 ‘그들’을 사용하므로, 성소는 수단이되 하나님의 임재는 백성 가운데 있다는 점을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3, §5
