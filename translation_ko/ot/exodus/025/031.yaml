id: EXO.25.31
reference: Exodus 25:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ מְנֹרַ֖ת זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה תֵּעָשֶׂ֤ה הַ/מְּנוֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
  footnotes:
  - marker: a
    text: Or 'beaten work.' The Hebrew emphasizes that the lampstand was to be formed by hammering, apparently from a single piece rather than assembled from separate parts.
    reason: lexical_alternative
  - marker: b
    text: '''Its buds'' may also be rendered ''its knobs.'' The Hebrew refers to ornamental rounded projections in the lampstand''s floral design.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 순금의 등잔대를 만들어야 합니다. 등잔대는 두드려 만든 것으로 하되, 그 밑받침과 줄기, 그 잔들, 그 마디들, 그리고 그 꽃들이 그것과 한 덩어리가 되어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְנֹרַת
  english_pob_choice: lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 촛대
  - 메노라
  lexicon: HALOT
  rationale: 히브리어는 등불을 받치는 받침대를 가리키므로, 현대 한국어에서는 의미를 바로 드러내는 ‘등잔대’가 가장 자연스럽습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 깨끗한 금
  - 정금
  lexicon: HALOT
  rationale: 불순물이 섞이지 않은 금이라는 뜻을 한국어 관용으로 간결하게 옮기면 ‘순금’이 적절합니다.
- source_word: מִקְשָׁה / תֵּעָשֶׂה
  english_pob_choice: hammered work / shall be made
  chosen_korean: 두드려 만든 것으로 하되
  alternatives_korean:
  - 망치로 두드린 작업으로
  - 두드려 만든 것으로 만들어져야 하며
  lexicon: HALOT
  rationale: POB의 ‘hammered work’는 단순한 장식이 아니라 두드려 한 덩어리로 만든 제작 방식을 뜻하므로, 제작 과정이 드러나도록 옮겼습니다.
- source_word: מִמֶּנָּה יִהְיוּ
  english_pob_choice: shall be of one piece with it
  chosen_korean: 그것과 한 덩어리가 되어야 합니다
  alternatives_korean:
  - 그것과 한 몸이어야 합니다
  - 그것과 한 조각이어야 합니다
  lexicon: HALOT
  rationale: 별도 부품이 아니라 등잔대 자체에서 이어져 나와야 한다는 뜻을 한국어로 분명히 드러내기 위해 ‘한 덩어리’로 옮겼습니다.
