  text: 그리고 푸른 실과 자주색 실과 진홍색 실과 고운 베실과 염소털을
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּכֵלֶת
  english_pob_choice: blue
  chosen_korean: 푸른 실
  alternatives_korean:
  - 푸른 천
  - 푸른 실감개
  lexicon: HALOT
  rationale: 성막 재료 목록의 병렬성을 살리기 위해 색만이 아니라 직물 재료를 드러내는 ‘푸른 실’로 옮겼습니다.
- source_word: אַרְגָּמָן
  english_pob_choice: purple
  chosen_korean: 자주색 실
  alternatives_korean:
  - 자주색 천
  - 보라색 실
  lexicon: HALOT
  rationale: 값비싼 자주색 염색 직물을 가리키므로, 목록의 흐름에 맞게 ‘자주색 실’로 자연스럽게 표현했습니다.
- source_word: תוֹלַעַת שָׁנִי
  english_pob_choice: scarlet yarn
  chosen_korean: 진홍색 실
  alternatives_korean:
  - 홍색 실
  - 붉은 실
  lexicon: HALOT
  rationale: 문자적으로는 ‘벌레/곤충 염료의 붉은색’이지만, 문맥상 결과물인 붉은 직물 재료를 가리키므로 ‘진홍색 실’로 옮겼습니다.
- source_word: שֵׁשׁ
  english_pob_choice: fine linen
  chosen_korean: 고운 베실
  alternatives_korean:
  - 고운 베
  - 세마포
  lexicon: HALOT
  rationale: 성막 맥락에서 איכות가 있는 아마포를 뜻하므로, 재료 목록의 평행을 위해 ‘고운 베실’로 풀었습니다.
- source_word: עִזִּים
  english_pob_choice: goat hair
  chosen_korean: 염소털
  alternatives_korean:
  - 염소털 실
  - 염소
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘염소들’이지만, 문맥상 천에 쓰이는 재료를 뜻하므로 동물 자체보다 산물을 드러내는 ‘염소털’이 적절합니다.
