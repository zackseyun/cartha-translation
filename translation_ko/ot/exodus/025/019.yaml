  - 은혜좌에서
  - 시은좌에서
  lexicon: HALOT
  rationale: POB가 택한 ‘mercy seat’에 해당하는 성막 용어를 ‘속죄소’로 옮기고, מִן의 출처/재료 관계는 뒤의 ‘만드십시오’와 함께 문맥상 반영했습니다.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  english_pob_choice: on its two ends
  chosen_korean: 그 두 끝에
  alternatives_korean:
