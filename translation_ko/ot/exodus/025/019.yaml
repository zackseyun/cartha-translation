base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'make the cherubim of one piece with the mercy seat at its two ends.' The Hebrew preposition 'from' indicates that the cherubim are to be formed from the mercy seat itself, not made separately and attached later.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 그룹을 한쪽 끝에, 다른 한 그룹을 다른 쪽 끝에 만드십시오. 속죄소 자체에서 그 그룹들을 그 양 끝에 만드십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 분명히, ‘속죄소와 한 덩어리가 되도록 그 양 끝에 그룹들을 만드십시오.’ 여기서 히브리어 전치사 ‘מן’은 그룹들이 속죄소 자체에서 형성되어 따로 만들어 붙이는 것이 아니라는 뜻을 나타냅니다.
    reason: lexical_alternative
