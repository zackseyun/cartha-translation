  - 양쪽 끝에
  - 두 끝에
  lexicon: HALOT
  rationale: 위치 의미를 살려 자연스러운 한국어로 옮겼고, 마지막 반복을 통해 양끝 대칭 구조를 보존했습니다.
theological_decisions:
- issue: כַּפֹּרֶת의 성막 용어 선택
  chosen_reading: ‘mercy seat’를 ‘속죄소’로 번역하여 언약궤 덮개이자 속죄와 만남의 장소라는 성막 신학을 드러냈습니다.
  alternative_readings:
  - 은혜좌
  - 시은좌
  - 긍휼의 자리
  rationale: 전통 교회어보다 본문 기능을 직접 드러내는 성막 전문용어가 원문 의미를 더 정확히 전달합니다.
  doctrine_reference: 출애굽기 25장 성막 기구 문맥
