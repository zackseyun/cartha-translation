  rationale: 성막 등잔대의 장식 요소로서의 גְבִעִים은 일반적인 식기보다 오목한 그릇 모양의 장식이므로, 현대 한국어에서 자연스러운 ‘잔’으로 옮겼습니다.
- source_word: מְשֻׁקָּדִים
  english_pob_choice: made like almond blossoms
  chosen_korean: 아몬드꽃처럼 만든
  alternatives_korean:
  - 아몬드 모양으로 만든
  - 아몬드꽃 장식으로 만든
  lexicon: HALOT
  rationale: 히브리어는 아몬드에서 유래한 형상적·장식적 이미지를 담고 있으므로, 형상과 장식성을 함께 살리는 ‘아몬드꽃처럼 만든’이 가장 무난합니다.
- source_word: כַּפְתֹּרֶיהָ
  english_pob_choice: its buds / its knobs
  chosen_korean: 그것의 마디
  alternatives_korean:
  - 그것의 봉오리
  - 그것의 돌기
  lexicon: HALOT
  rationale: כפתר는 성막 기구 묘사에서 둥근 장식 돌출부를 뜻하므로, 식물 이미지와 기구 형상을 함께 아우르는 중립적 표현으로 ‘마디’를 택했습니다.
- source_word: וּפְרָחֶיהָ
  english_pob_choice: and its flowers
  chosen_korean: 그것의 꽃
  alternatives_korean:
  - 그것의 꽃들
  - 그것의 꽃송이
  lexicon: HALOT
  rationale: פֶּרַח은 꽃 또는 꽃송이를 뜻하므로, 앞의 ‘아몬드꽃’과 중복을 피하면서도 뜻을 분명히 하는 ‘꽃’을 사용했습니다.
theological_decisions:
- issue: 성막 기구의 장식 묘사에서 이미지와 기능을 어떻게 균형 있게 드러낼지
  chosen_reading: 장식의 구체적 형상을 과도하게 해석하지 않고, 본문이 말하는 아몬드 계열의 형상과 잔·마디·꽃의 배열을 그대로 살렸습니다.
  alternative_readings:
  - 장식적 해석을 더 강하게 반영하여 ‘아몬드꽃 무늬’로 풀기
  - 형상을 단순화하여 ‘아몬드 모양’으로만 옮기기
  rationale: 이 절은 상징 해설보다 제작 지시가 중심이므로, 본문이 제시하는 조형 요소들을 보존하는 번역이 더 충실합니다.
  doctrine_reference: 출애굽기 25장의 성막 기구 제작 규정
