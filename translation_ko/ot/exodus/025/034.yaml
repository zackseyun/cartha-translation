    reason: lexical_alternative
translation:
  language: ko
  text: 등잔대에는 아몬드꽃 모양으로 만든[a] 잔 네 개와 둥근 장식 돌기[b]와 꽃이 있어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아몬드 모양으로 만든’, ‘아몬드꽃으로 장식한’. 히브리어 표현은 아몬드나 아몬드꽃에서 유래한 형상 또는 장식을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘봉오리’. 히브리어는 등잔대의 둥근 장식 돌출부를 가리키며, 식물 이미지에 따라 ‘봉오리’로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  english_pob_choice: And on the lampstand
  chosen_korean: 등잔대에는
