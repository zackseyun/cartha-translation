translation:
  language: ko
  text: 등잔대에는 아몬드꽃처럼 만든 네 개의 잔과 그것의 마디와 그것의 꽃이 있어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아몬드꽃처럼 만든’은 아몬드에서 유래한 형상적·장식적 표현으로, 형태와 장식을 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마디’는 여기서 성막 등잔대의 둥근 장식 돌출부를 옮긴 표현입니다. 다른 번역에서는 ‘knobs’ 또는 ‘봉오리’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
