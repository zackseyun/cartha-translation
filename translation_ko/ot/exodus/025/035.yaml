  text: וְ/כַפְתֹּ֡ר תַּחַת֩ שְׁנֵ֨י הַ/קָּנִ֜ים מִמֶּ֗/נָּה וְ/כַפְתֹּר֙ תַּ֣חַת שְׁנֵ֤י הַ/קָּנִים֙ מִמֶּ֔/נָּה וְ/כַפְתֹּ֕ר תַּחַת שְׁנֵ֥י הַ/קָּנִ֖ים מִמֶּ֑/נָּה לְ/שֵׁ֨שֶׁת֙ הַ/קָּנִ֔ים הַ/יֹּצְאִ֖ים מִן הַ/מְּנֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/035.yaml
  text: and a knob under two branches from it, and a knob under two branches from it, and a knob under two branches from it, for the six branches going out from the lampstand.
translation:
  language: ko
  text: 그리고 그 아래에는 두 가지 가지 아래에 난 돌기 하나가 있고, 그 아래에도 두 가지 가지 아래에 난 돌기 하나가 있으며, 그 아래에도 두 가지 가지 아래에 난 돌기 하나가 있습니다. 이것은 등잔대에서 나오는 여섯 가지 가지를 위한 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: כַפְתֹּר
  english_pob_choice: knob
  chosen_korean: 돌기
  alternatives_korean:
  - 매듭
  - 마디
  - 장식구
  lexicon: כַפְתֹּר
  rationale: 등잔대의 구조 부품을 가리키는 말로, POB의 수정된 ‘knob’에 맞추되 한국어에서는 기능을 드러내는 중립적 표현 ‘돌기’가 가장 자연스럽고 과장되지 않습니다.
- source_word: תַּחַת שְׁנֵי הַקָּנִים
  english_pob_choice: under two branches
  chosen_korean: 두 가지 가지 아래에
  alternatives_korean:
  - 두 가지 아래에
  - 두 가지 대 아래에
  - 두 가지 갈래 아래에
  lexicon: תַּחַת + שְׁנֵי + קָנִים
  rationale: 반복되는 구조를 살리기 위해 직역적으로 ‘두 가지 가지 아래에’로 옮겼으며, 여기서 ‘가지’는 등잔대의 branch를 가리키는 반복 구조를 드러냅니다.
- source_word: הַמְּנֹרָה
  english_pob_choice: the lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 촛대
  - 등대
  lexicon: מְנֹרָה
  rationale: 출애굽기 문맥에서 מְנֹרָה는 성막의 등잔대를 가리키므로, 전통적으로도 널리 쓰이며 의미가 정확한 ‘등잔대’를 선택했습니다.
theological_decisions:
- issue: 반복적 구조의 보존
  chosen_reading: 세 번의 동일한 문장 구조를 유지해 등잔대의 좌우 대칭과 정교한 제작 지시를 드러냈습니다.
  alternative_readings:
  - 한 문장으로 압축하여 표현
  - 자연스러운 한국어로 구조를 일부 재배열
  rationale: 본문은 의도적으로 반복을 통해 구조를 설계하므로, 한국어에서도 반복을 유지해야 원문의 제작 지시 성격과 형식미가 보존됩니다.
  doctrine_reference: 성막 기물 묘사의 정확성과 질서
