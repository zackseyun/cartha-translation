translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: '히브리어: ‘YHWH’. 대안 번역: ‘야훼’ 또는 ‘여호와’.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - '... 이르셨습니다'
  lexicon: HALOT
  rationale: waw-연결 서술의 시간적 진행을 한국어로 자연스럽게 살리기 위해 ‘그때’를 두었고, דבר의 직접 화행은 격식 있는 서술에 맞는 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 전통적 대체칭호 대신 표준 음역인 ‘야훼’로 옮겨, 언약의 고유명을 드러냈습니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
  chosen_korean: 모세에게
  alternatives_korean:
  - 모세에게로
  - 모세를 향하여
  lexicon: HALOT
  rationale: אֶל은 발화의 수신자를 표시하므로 현대 한국어에서는 여격 조사 ‘-에게’가 가장 자연스럽습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하며
  - 이르기를
  lexicon: HALOT
  rationale: 이 절에서는 לֵאמֹר이 직접화의 도입 공식이므로 별도의 ‘말하며’를 두기보다 앞 동사에 자연스럽게 통합해 문장을 간결하게 했습니다.
theological_decisions:
- issue: 여호와/주 대신 고유명 재현
  chosen_reading: ‘야훼’로 직역적 표기를 유지했습니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 음역
  rationale: 출애굽기 25:1은 언약의 이름 יְהוָה를 직접 사용하므로, 독자가 고유명을 인식하도록 대체칭호보다 ‘야훼’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
