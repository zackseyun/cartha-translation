  text: וְ/עָשִׂ֥יתָ שֻׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
  footnotes:
  - marker: a
    text: Or, more literally, 'and you shall make.' The Hebrew conjunction links this instruction to the preceding commands.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 아카시아 나무로 한 상을 만들어야 합니다[a]. 길이는 두 규빗, 너비는 한 규빗, 높이는 한 규빗 반이어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그리고 너는 만들어야 합니다’입니다. 히브리어 접속사가 앞선 명령들과 이 지시를 이어 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: You shall make
  chosen_korean: 너는 ... 만들어야 합니다
  alternatives_korean:
  - 너는 ... 만들 것입니다
  - 그리고 너는 ... 만들어야 합니다
  lexicon: HALOT
  rationale: 지시문맥의 완료형+접속사는 한국어에서 의무를 나타내는 표현으로 옮기는 것이 자연스럽고, 첫머리의 접속사 ‘그리고’는 문장 흐름상 생략할 수 있습니다.
- source_word: שֻׁלְחָן
  english_pob_choice: a table
  chosen_korean: 한 상
  alternatives_korean:
  - 한 테이블
  - 상
  lexicon: HALOT
  rationale: 성소 기구로서의 물품은 ‘테이블’보다 ‘상’이 더 자연스럽고, 특정 대상 도입이므로 수사를 보태었습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로
  alternatives_korean:
  - 아카시아 목재로
  - 아카시아로
  lexicon: HALOT
  rationale: 구문상 재료를 나타내는 표현이므로 ‘...로’로 처리했고, 관용적으로 ‘아카시아 나무’가 원문의 재료 의미를 가장 분명히 드러냅니다.
- source_word: אַמָּתַיִם / אַמָּה / וָחֵצִי
  english_pob_choice: two cubits ... one cubit ... and a cubit and a half
  chosen_korean: 두 규빗, 한 규빗, 한 규빗 반
  alternatives_korean:
  - 두 규빗, 한 규빗, 규빗 반
  - 두 규빗 길이, 한 규빗 너비, 한 규빗 반 높이
  lexicon: HALOT
  rationale: 성막 규격은 문화적·수치적 정확성을 위해 ‘규빗’을 보존했고, 반복되는 수량표현은 간결한 나열로 옮겼습니다.
theological_decisions:
- issue: 성막 기구 규격의 지시문을 어떻게 한국어 명령/의무로 반영할지
  chosen_reading: 직설적 명령형보다는 ‘만들어야 합니다’로 옮겨 지시의 규범성을 유지했습니다.
  alternative_readings:
  - 만드십시오
  - 너는 만들어야 한다
  rationale: 본문은 제의적 제작 지시이므로 존대 명령보다 규범적 의무 표현이 문체와 내용에 가장 잘 맞습니다.
  doctrine_reference: 출애굽기 성막 규례의 서술/명령 문맥
