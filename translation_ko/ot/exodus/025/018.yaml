  naturalness: 현 문장은 ‘만든 것으로 만들되’라는 같은 말의 반복 때문에 현대 한국어로 매우 어색합니다. ‘금으로 그룹 둘을 만들되, 속죄소의 양 끝에서 두드려 만들어야 합니다’로 고치면 지시문의 합쇼체와 제작 방식을 자연스럽게 살릴 수 있습니다.
