- from: 너는 금으로 된 두 그룹을 만들어야 합니다. 그것들을 두드려 만든 것으로 만들되, 속죄소의 두 끝에 두십시오.[a]
  to: 너는 금으로 그룹 둘을 만들되, 속죄소의 양 끝에서 두드려 만들어야 합니다.[a]
  rationale: 히브리어의 반복된 ‘만들다’와 두드려 만든 금속 세공 방식은 유지하되, 한국어에서 어색한 동어 반복을 제거했습니다. ‘속죄소의 양 끝에서’는 그룹들이 그 덮개의 양 끝과 관련되어 만들어진다는 원문의 공간적·제작상 관계를 보존하며, 별도의 배치 동작을 덧붙이지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:33Z'
