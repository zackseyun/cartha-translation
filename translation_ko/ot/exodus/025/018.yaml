id: EXO.25.18
reference: Exodus 25:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ שְׁנַ֥יִם כְּרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ תַּעֲשֶׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
  footnotes:
  - marker: a
    text: Or, 'the atonement cover.' The Hebrew term refers to the ark's cover and is traditionally rendered 'mercy seat' in this cultic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 금으로 된 두 그룹을 만들어야 합니다. 그것들을 두드려 만든 것으로 만들되, 속죄소의 두 끝에 두십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '속죄 덮개'. 히브리어 용어는 언약궤의 덮개를 가리키며, 이 제의적 문맥에서는 전통적으로 'mercy seat'로 번역됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 너는 ... 만들어야 합니다
  alternatives_korean:
  - 만드십시오
  - 너는 ... 만들게 됩니다
  lexicon: HALOT
  rationale: 지시문 맥락의 2인칭 단수 명령/지시를 현대 한국어 합쇼체로 옮겨, 명령성과 순차적 지시의 톤을 살렸습니다.
- source_word: כְּרֻבִים
  english_pob_choice: cherubim
  chosen_korean: 그룹
  alternatives_korean:
  - 케루빔
  - 천사들
  lexicon: HALOT
  rationale: 히브리어의 특정한 하늘 존재를 가리키므로 일반적인 '천사들'로 평탄화하지 않았고, 한국어 성경에서 널리 통용되는 '그룹'을 택했습니다.
- source_word: מִקְשָׁה
  english_pob_choice: of hammered work
  chosen_korean: 두드려 만든 것으로
  alternatives_korean:
  - 망치질한 것으로
  - 쇠를 두드려 만든 것으로
  lexicon: HALOT
  rationale: 금속을 두드려 형상화한 제작 방식을 드러내기 위해 직역적으로 옮겼습니다. '한 덩어리로'라는 해석은 본문 자체보다 제작 방식에 대한 추론이어서 본문에는 넣지 않았습니다.
- source_word: הַכַּפֹּרֶת
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 은혜의 자리에
  - 긍휼의 자리
  lexicon: HALOT
  rationale: 탁자 덮개가 아니라 언약궤의 특정한 덮개를 가리키는 제의적 용어로서, 보다 투명한 표기를 위해 '속죄소'를 사용했습니다.
theological_decisions:
- issue: הַכַּפֹּרֶת의 전통적 제의 용어 처리
  chosen_reading: '''mercy seat'' 대신 의미가 드러나는 ''속죄소''를 본문에 사용했습니다.'
  alternative_readings:
  - '''긍휼좌''식 전통 용어'
  - '''은혜의 자리'''
  rationale: 이 절은 언약궤 덮개를 지칭하는 제의적 물건을 소개하므로, 독자가 기능을 즉시 이해하도록 더 투명한 용어를 택했습니다. 전통 교회 용어의 관성보다 원문의 대상과 역할을 드러내는 것이 우선입니다.
  doctrine_reference: 출 25:17-22의 성막 제의 문맥
