lexical_decisions:
- source_word: בְּטַבְּעֹת
  english_pob_choice: in the rings
  chosen_korean: 고리들 안에
  alternatives_korean:
  - 고리들 속에
  - 고리들에
  lexicon: HALOT
  rationale: טַבַּעַת는 성막 기구에 붙는 고리를 가리키므로, 위치 관계를 자연스럽게 살려 ‘안에’로 옮겼습니다.
- source_word: הָאָרֹן
  english_pob_choice: the ark
  chosen_korean: 궤
  alternatives_korean:
  - 언약궤
  - 궤짝
  lexicon: HALOT
  rationale: 성막 문맥에서 אָרוֹן은 단순한 상자가 아니라 성스러운 궤이므로, 문맥을 따라 ‘궤’로 옮겼습니다.
- source_word: הַבַּדִּים
  english_pob_choice: the poles
  chosen_korean: 널빤지들
  alternatives_korean:
  - 막대기들
  - 운반용 막대들
  lexicon: HALOT
  rationale: 문맥상 궤를 메는 막대이지만, 한국어로는 기능이 드러나는 ‘운반용 막대들’보다 본문의 사물을 간명하게 가리키는 표현을 택했습니다.
- source_word: לֹא יָסֻרוּ
  english_pob_choice: they shall not be removed
  chosen_korean: 절대로 빠져나가서는 안 됩니다
  alternatives_korean:
  - 제거되어서는 안 됩니다
  - 떼어 내어서는 안 됩니다
  lexicon: HALOT
  rationale: סוּר는 이 문맥에서 ‘떼어 내다/제거하다’의 금지이므로, 소극적 금지와 지속성을 함께 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 궤의 운반 막대를 상시 부착 상태로 유지하라는 규정의 뉘앙스
  chosen_reading: 막대들이 궤에 계속 남아 있어야 한다는 규정으로 옮겼습니다.
  alternative_readings:
  - 단순한 보관 지시로 읽기
  - 임시 운반 도구에 대한 일반 지시로 완화하기
  rationale: 바로 앞뒤 문맥이 제거 금지와 연결되므로, 단순 보관이 아니라 지속적 부착 규정임을 분명히 해야 합니다.
  doctrine_reference: 성막 기구의 거룩함과 접근 규범
