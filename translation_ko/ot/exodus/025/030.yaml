translation:
  language: ko
  text: 그리고 너는 상 위에 진설병을 내 앞에 늘 차려 놓아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 직역하면 ‘얼굴의 빵’ 또는 ‘임재의 빵’입니다. 전통적으로 ‘진설병’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  english_pob_choice: And you shall set
  chosen_korean: 놓아야 합니다
  alternatives_korean:
  - 두어야 합니다
  - 배치해야 합니다
  lexicon: HALOT
  rationale: נתן의 기본 뜻은 ‘주다/놓다/두다’이며, 여기서는 성막 기구를 정해진 자리에 두는 맥락이므로 현대 한국어에서는 ‘놓다’가 가장 자연스럽고 직접적입니다.
- source_word: הַשֻּׁלְחָן
  english_pob_choice: the table
  chosen_korean: 상
  alternatives_korean:
  - 탁자
  - 식탁
  lexicon: HALOT
  rationale: 성막 문맥에서 특정한 진설용 가구를 가리키므로 일반적이면서도 제의적 용례가 가능한 ‘상’이 가장 간결합니다.
- source_word: לֶחֶם פָּנִים
  english_pob_choice: the bread of the Presence
  chosen_korean: 진설병
  alternatives_korean:
  - 주의 앞의 빵
  - 임재의 빵
  - 얼굴의 빵
  lexicon: HALOT
  rationale: 직역형인 ‘임재의 빵’도 가능하지만, 이 구절은 한국어 성경에서 널리 알려진 제의 용어인 ‘진설병’이 원문이 가리키는 성막 전통을 가장 명확하게 전달합니다.
- source_word: תָּמִיד
  english_pob_choice: continually
  chosen_korean: 늘
  alternatives_korean:
  - 항상
  - 계속
  - 끊임없이
  lexicon: HALOT
  rationale: תמיד의 지속·규칙적 성격을 한국어에서 간결하게 살리기 위해 ‘늘’로 옮겼으며, 이어지는 제의적 맥락이 그 의미를 충분히 보완합니다.
theological_decisions:
- issue: לְפָנַי의 방향성 표현
  chosen_reading: 내 앞에
  alternative_readings:
  - 내 면전에서
  - 내 임재 앞에
  rationale: לְפָנַי는 단순한 위치가 아니라 하나님 앞에 놓이는 제의적 방향을 드러내므로, 합쇼체 본문에서는 직접적이고도 오해가 적은 ‘내 앞에’로 유지했습니다.
  doctrine_reference: 성막의 거룩한 진설 행위와 하나님의 임재 강조
- issue: ‘bread of the Presence’의 한국어 전통 용어 사용
  chosen_reading: 진설병
  alternative_readings:
  - 임재의 빵
  - 진설된 빵
  rationale: 원문의 투명성을 위해 직역형도 가능하지만, 본문이 이미 제의적 전문용어를 가진 경우에는 한국어 교회 전통에서 자리 잡은 ‘진설병’을 사용해 의미를 안정적으로 전달했습니다.
  doctrine_reference: 성막 예전 용어의 수용과 가독성
