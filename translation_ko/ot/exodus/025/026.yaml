base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/026.yaml
  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
  footnotes:
  - marker: a
    text: Or 'the four sides' or 'the four edges' for 'the four corners.'
    reason: lexical_alternative
  - marker: b
    text: Or 'its four legs'; the Hebrew word can mean 'feet' or 'legs' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그것을 위하여 금 고리 네 개를 만들고, 그 고리들을 네 발[b]이 있는 네 모퉁이[a]에 달아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 모퉁이’는 ‘네 변’이나 ‘네 가장자리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네 발’은 문맥상 ‘다리’의 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 그리고 너는 … 만들어야 합니다
  alternatives_korean:
  - 그리고 너는 … 만들 것입니다
  - 그리고 … 만드십시오
  lexicon: HALOT
  rationale: 지시문맥의 완료형+접속사는 한국어에서 의무 명령으로 옮기는 것이 자연스러우며, 합쇼체를 유지하기 위해 ‘-해야 합니다’로 처리했습니다.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  english_pob_choice: four gold rings
  chosen_korean: 네 개의 금 고리
  alternatives_korean:
  - 금으로 된 네 고리
  - 네 금 고리
  lexicon: HALOT
  rationale: 수량+재료+명사 구조를 한국어식으로 풀어, 재료를 분명히 하면서도 문장을 간결하게 유지했습니다.
- source_word: אַרְבַּע הַפֵּאֹת
  english_pob_choice: the four corners
  chosen_korean: 네 모퉁이
  alternatives_korean:
  - 네 귀퉁이
  - 네 변
  - 네 가장자리
  lexicon: HALOT
  rationale: פֵּאָה의 기본 의미 가운데 이 문맥에서는 부착 위치를 가리키는 ‘모퉁이’가 가장 구체적이고 자연스럽습니다.
- source_word: לְאַרְבַּע רַגְלָיו
  english_pob_choice: its four feet
  chosen_korean: 네 발
  alternatives_korean:
  - 네 다리
  - 네 받침발
  - 네 발받침
  lexicon: HALOT
  rationale: 가구의 지지부를 가리킬 때 한국어에서는 ‘발’이 가장 직관적이며, 영어 POB의 foot/leg 여지를 과도하게 좁히지 않기 위해 ‘네 발’로 옮겼습니다.
