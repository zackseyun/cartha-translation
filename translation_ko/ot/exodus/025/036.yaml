base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
  footnotes:
  - marker: a
    text: 'Or ''from it'': the sense is that the buds and branches were to be formed integrally from the lampstand rather than attached separately.'
    reason: lexical_alternative
  - marker: b
    text: Or 'beaten work.' The Hebrew emphasizes that the whole lampstand was fashioned as one hammered piece of pure gold.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것의 마디와 가지들은 그것과 한 덩어리로 되어야 하며, 그것 전체는 순금의 한 덩어리로 만든 망치질한 작품이어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘그것에서’: 뜻은 마디와 가지들이 따로 붙은 것이 아니라 등잔대 자체에서 일체로 만들어졌다는 것입니다.'
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘망치로 두드린 작품’. 히브리어는 등잔대 전체가 순금의 한 덩어리로 만들어졌음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  english_pob_choice: their buds
  chosen_korean: 마디들
  alternatives_korean:
  - 싹들
  - 꽃봉오리들
  - 장식 마디들
  lexicon: HALOT
  rationale: 등잔대의 식물적 형상을 살리면서도, 한국어에서 자연스럽고 기능적으로 읽히는 표현으로 ‘마디들’을 택했습니다. 직역적인 ‘싹’이나 ‘꽃봉오리’는 이미지가 더 좁아질 수 있습니다.
- source_word: וּקְנֹתָם
  english_pob_choice: and their branches
  chosen_korean: 가지들은
  alternatives_korean:
  - 줄기들은
  - 팔들은
  - 갈래들은
  lexicon: HALOT
  rationale: 면류관/등잔대의 뻗는 부분을 한국어로는 ‘가지’가 가장 자연스럽게 전달합니다. 문맥의 식물성 도상을 유지하면서도 독자가 바로 이해할 수 있습니다.
- source_word: מִמֶּנָּה
  english_pob_choice: with it / from it
  chosen_korean: 그것과 한 덩어리로
  alternatives_korean:
  - 그것에서
  - 그것으로부터
  - 그것과 함께
  lexicon: HALOT
  rationale: 핵심 의미는 별도 부착이 아니라 등잔대 본체에서 일체로 형성된다는 점이므로, ‘한 덩어리로’로 구조적 통합을 드러냈습니다. 영어 주해의 ‘from it’/‘with it’ 긴장을 한국어에서 자연스럽게 풀어낸 선택입니다.
- source_word: מִקְשָׁה אַחַת
  english_pob_choice: a single hammered work
  chosen_korean: 순금의 한 덩어리로 만든 망치질한 작품
  alternatives_korean:
  - 한 번 두드려 만든 작품
  - 망치로 두드려 만든 한 덩어리의 작품
  - 단번에 망치질하여 만든 작품
  lexicon: HALOT
  rationale: מִקְשָׁה는 ‘두드려 만든’ 제작 방식을 가리키므로 이를 그대로 살렸고, אַחַת은 ‘한 덩어리’로 일체성을 보강했습니다. ‘순금’은 뒤의 ‘pure gold’에 맞춰 금속의 순도를 분명히 합니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 깨끗한 금
  - 정련한 금
  lexicon: HALOT
  rationale: 성막 기물 재료를 가리키는 관용구로서 한국어 성경에서 가장 명료한 대응은 ‘순금’입니다. 문맥상 금속의 순도를 직접적으로 드러냅니다.
theological_decisions:
- issue: '등잔대의 제작 방식: 부착물인지 일체형인지'
  chosen_reading: 마디와 가지들은 등잔대 본체와 분리된 부착물이 아니라 한 덩어리로 이루어진 일체형 구조로 표현했습니다.
  alternative_readings:
  - 마디와 가지들은 그것에서 나와야 합니다
  - 마디와 가지들은 그것으로부터 있어야 합니다
  rationale: 히브리어 מִמֶּנָּה와 영어 POB 주해는 부속물 부착이 아니라 본체에서 통째로 나온 구조를 강조합니다. 한국어 ‘한 덩어리로’는 이 제작 신학을 훼손하지 않으면서도 자연스럽게 전달합니다.
  doctrine_reference: 출애굽기 25장의 성막 규례와 성물의 거룩한 통일성
