base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
  footnotes:
  - marker: a
    text: 'Or ''from it'': the sense is that the buds and branches were to be formed integrally from the lampstand rather than attached separately.'
    reason: lexical_alternative
  - marker: b
    text: Or 'beaten work.' The Hebrew emphasizes that the whole lampstand was fashioned as one hammered piece of pure gold.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 꽃봉오리와 가지들은 등잔대에서 나와야 하며,[a] 전체를 순금 한 덩어리로 두드려 만들어야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것에서’. 꽃봉오리와 가지들은 따로 붙이는 것이 아니라 등잔대 본체에서 일체로 만들어져야 한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘두드려 만든 것’. 히브리어는 등잔대 전체가 순금 한 덩어리를 두드려 만든 것임을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
