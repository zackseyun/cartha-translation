  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/עֻמַּת֙ הַ/מִּסְגֶּ֔רֶת תִּהְיֶ֖יןָ הַ/טַּבָּעֹ֑ת לְ/בָתִּ֣ים לְ/בַדִּ֔ים לָ/שֵׂ֖את אֶת הַ/שֻּׁלְחָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/027.yaml
  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
  footnotes:
  - marker: a
    text: Or 'alongside the frame' or 'corresponding to the frame.' The Hebrew preposition can indicate relative position without specifying exact geometry.
    reason: lexical_alternative
  - marker: b
    text: Literally 'for houses for the poles,' that is, receptacles or holders for inserting the poles.
    reason: lexical_alternative
translation:
  language: ko
  text: 고리들은 테두리에 대응하는 위치에 있어야 하며,[a] 상을 운반할 막대를 끼울 자리여야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 정확한 거리나 방향을 확정하지 않으며, ‘테두리 맞은편에’, ‘테두리 곁에’, 또는 ‘테두리에 대응하여’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘막대들을 위한 집들’입니다. 여기서는 막대를 끼우거나 넣는 수납부·자리라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  english_pob_choice: opposite
  chosen_korean: 그릇테와 같은 위치에
  alternatives_korean:
  - 그릇테와 마주하게
  - 그릇테 옆에
  - 그릇테에 대응하여
  lexicon: HALOT
  rationale: 이 전치사구는 정확한 기하학적 방향보다 ‘상대적 위치’를 나타내므로, 한국어에서는 ‘같은 위치에’로 옮겨 과도한 단정 없이 관계를 드러냈습니다.
- source_word: הַמִּסְגֶּרֶת
  english_pob_choice: the frame
  chosen_korean: 그릇테
  alternatives_korean:
  - 틀
  - 가장자리
  - 테두리
  lexicon: HALOT
  rationale: 성막 기구의 구조적 둘레 요소를 가리키므로 단순한 ‘가장자리’보다 구조성을 살리는 ‘그릇테’로 옮겼습니다.
- source_word: לְבָתִּים
  english_pob_choice: as holders
  chosen_korean: 받침이 되어
  alternatives_korean:
  - 집들이 되어
  - 소켓이 되어
  - 끼움자리가 되어
  lexicon: HALOT
  rationale: 직역하면 ‘집들’이지만, 문맥상 막대를 끼워 넣는 용기·받침을 뜻하므로 기능을 드러내는 표현으로 처리했습니다.
- source_word: לְבַדִּים
  english_pob_choice: for the poles
  chosen_korean: 막대들
  alternatives_korean:
  - 채들
  - 운반막대들
  - 지팡이들
  lexicon: HALOT
  rationale: 성막 기구를 운반하는 장대를 가리키므로 현대 한국어에서 바로 이해되는 ‘막대들’을 택했습니다.
- source_word: לָשֵׂאת
  english_pob_choice: to carry
  chosen_korean: 메고 가게 해야 합니다
  alternatives_korean:
  - 운반하게 해야 합니다
  - 들고 가게 해야 합니다
  - 메게 해야 합니다
  lexicon: HALOT
  rationale: 문맥이 성소 기구의 운반을 말하므로 단순 ‘carry’보다 실제로 옮겨 메는 행위를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 성막 기구 운반의 기능을 얼마나 구체적으로 드러낼지
  chosen_reading: 고리와 받침은 막대를 끼워 넣어 상을 운반하게 하는 장치로 이해해, 기능을 명시적으로 번역했습니다.
  alternative_readings:
  - 형식적으로만 ‘고리들은 그릇테에 있어야 한다’로 옮김
  - ‘운반용 막대’ 정도로만 일반화함
  rationale: 본문의 목적절은 단순한 위치 설명이 아니라 운반 장치의 기능을 설명하므로, 독자가 구조와 용도를 바로 이해하도록 풀어 옮겼습니다.
  doctrine_reference: 출애굽기 25장의 성막 기구 규정
