  to: 그 등잔대의 등잔 일곱을 만들고, 그 등잔들을 올려놓아 그 앞쪽을 비추게 해야 합니다.[a][b]
  rationale: 초안의 대명사 배열 때문에 생긴 문법적 충돌을 제거하고, 등잔의 소유·귀속 대상을 ‘등잔대’로 분명히 했습니다. 본문에서는 명시되지 않은 3인칭 주어를 한국어에서 보충하지 않아 해석적 확정을 피했으며, הֶעֱלָה의 ‘올리다’ 의미와 점화 가능성은 본문과 각주에 각각 보존했습니다.
