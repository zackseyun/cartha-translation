    rationale: 히브리어 여성 단수 접미사는 앞 문맥의 등잔대를 가리키지만, 한국어 ‘그의’는 사람 소유자로도 읽혀 자연스럽지 않습니다.
  - severity: low
    issue: ‘설치하다’의 과도한 기술적 표현
