review_pass:
  verdict: revise
  source_fidelity: 첫 절의 2인칭 단수 지시와 뒤따르는 3인칭 단수 동사의 전환을 고려해야 합니다. 초안은 ‘그것들이 … 그 등잔들을 설치해야 합니다’라고 하여 등잔들이 스스로 등잔들을 설치하는 문법·의미상의 충돌을 일으킵니다. 주어를 보충하지 않는 방식으로 3인칭 주어의 미명시성을 보존하되, 행위의 연결을 자연스럽게 옮기는 것이 안전합니다.
  naturalness: ‘그의 등잔’은 등잔대의 소유를 가리키는 한국어 표현으로 부자연스럽고 선행 대상도 불명확합니다. ‘그 등잔대의 등잔 일곱’으로 명시하면 자연스럽고 지시 대상이 분명해집니다. ‘올려놓다’는 문맥상 등잔을 제자리에 올리는 뜻을 자연스럽게 전달하며, 점화 가능성은 각주로 남길 수 있습니다.
  terminology: נֵר는 이 문맥에서 ‘등잔’으로 옮기는 것이 적절합니다. עַל־עֵבֶר פָּנֶיהָ는 등잔대의 앞쪽을 향한 조명을 뜻하므로 ‘그 앞쪽을 비추게’가 무난합니다. ‘설치하다’보다 ‘올려놓다’가 הֶעֱלָה의 기본 동작을 더 잘 보존합니다.
