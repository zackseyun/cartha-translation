source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת נֵרֹתֶ֖י/הָ שִׁבְעָ֑ה וְ/הֶֽעֱלָה֙ אֶת נֵ֣רֹתֶ֔י/הָ וְ/הֵאִ֖יר עַל עֵ֥בֶר פָּנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
  footnotes:
  - marker: a
    text: Or 'he shall light its lamps so that they give light toward its front.' The Hebrew verb can denote causing the lamps to go up, which in context may imply lighting as well as setting them in place.
    reason: lexical_alternative
  - marker: b
    text: The third-person singular ('he shall set up') likely refers to the priest who tends the lampstand, though the subject is not explicitly named in this verse.
    reason: cultural_note
translation:
  language: ko
  text: 그의 등잔 일곱을 만들되, 그것들이 그 앞쪽을 비추도록 그 등잔들을 설치해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 등잔들을 밝혀 그 앞쪽을 비추게 해야 합니다.’ 히브리어 동사는 등잔을 ‘올리다’는 뜻을 지니며, 문맥상 점화까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 3인칭 단수형은 이 등잔대를 돌보는 제사장을 가리키는 것으로 보이지만, 본문에는 그 주체가 직접 밝혀져 있지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: You shall make
  chosen_korean: 만들되
  alternatives_korean:
  - 만드십시오
  - 만들어야 합니다
  lexicon: HALOT
  rationale: 명령형 지시를 자연스러운 합쇼체로 옮기되, 성막 기구 제작 지시의 연속성을 살리기 위해 ‘만들되’로 연결했습니다.
- source_word: נֵרֹתֶיהָ
  english_pob_choice: its lamps
  chosen_korean: 등잔
  alternatives_korean:
  - 등불
  - 램프
  lexicon: HALOT
  rationale: 성막 등잔대 문맥에서 נֵר는 개별 불빛보다 기구인 등잔을 가리키므로 ‘등잔’이 가장 정확합니다.
- source_word: וְהֶעֱלָה
  english_pob_choice: he shall set up
  chosen_korean: 설치해야 합니다
  alternatives_korean:
  - 올려야 합니다
  - 밝혀야 합니다
  - 점등해야 합니다
  lexicon: HALOT
  rationale: 히필의 기본 뜻은 ‘올리다’이지만, 여기서는 등잔을 기구 위에 올려 제자리에 두는 행위를 포함하므로 ‘설치하다’가 기능상 가장 무난합니다.
- source_word: עַל עֵבֶר פָּנֶיהָ
  english_pob_choice: in front of it
  chosen_korean: 그 앞쪽을
  alternatives_korean:
  - 그 면을 향해
  - 그 앞을 향해
  - 정면을 향해
  lexicon: HALOT
  rationale: 방향 표현을 과도하게 풀지 않고, 등잔이 등잔대의 전면 방향을 향해야 한다는 뜻을 자연스럽게 살렸습니다.
theological_decisions:
- issue: 동사의 주체가 명시되지 않은 3인칭 단수 표현
  chosen_reading: ‘설치해야 합니다’로 처리해 주어를 일반화하지 않았습니다.
  alternative_readings:
  - ‘그가 설치해야 합니다’
  - ‘사람이 설치해야 합니다’
  - ‘제사장이 설치해야 합니다’
  rationale: 히브리어는 3인칭 단수형이지만 문맥상 담당 제사장을 암시할 뿐 명시하지 않으므로, 본문이 말하는 행동만 드러내고 해석적 주어는 넣지 않았습니다.
  doctrine_reference: 본문 문맥 해석
