revisions:
- from: 한 가지 가지에는 세 개의 아몬드꽃 모양 잔이 있고, 그것들의 아래에는 마디와 꽃이 있으며, 또 다른 가지에는 세 개의 아몬드꽃 모양 잔이 있고, 그것들의 아래에는 마디와 꽃이 있어야 합니다. 이렇게 등잔대에서 나오는 여섯 가지 모두에 그렇게 해야 합니다.[a]
  to: 한 가지에는 아몬드꽃 모양의 잔 세 개와 둥근 장식물[a]과 꽃이 있어야 하고, 한 가지에는 아몬드꽃 모양의 잔 세 개와 둥근 장식물과 꽃이 있어야 합니다. 등잔대에서 뻗어 나온 여섯 가지도 이와 같아야 합니다.
  rationale: 원문의 반복된 ‘한 가지’와 각 가지에 적용되는 장식 배열을 유지했습니다. 잔·카프토르·꽃의 병렬을 보존하고, 초안이 추가한 ‘아래’라는 공간 관계와 ‘또 다른’이라는 대조를 제거했습니다. 마지막 כֵּן의 적용 범위는 ‘여섯 가지도 이와 같아야 합니다’로 자연스럽게 반영했습니다.
