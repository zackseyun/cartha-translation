  terminology: גְבִעִים는 ‘잔’, מְשֻׁקָּדִים는 ‘아몬드꽃 모양’, מְנֹרָה는 ‘등잔대’가 적절합니다. כַּפְתֹּר는 식물의 실제 ‘마디’라기보다 둥근 장식 돌출부이므로 ‘둥근 장식물’로 수정합니다. פֶרַח는 ‘꽃’으로 유지합니다.
