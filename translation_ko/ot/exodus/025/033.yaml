  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁלֹשָׁ֣ה גְ֠בִעִים מְֽשֻׁקָּדִ֞ים בַּ/קָּנֶ֣ה הָ/אֶחָד֮ כַּפְתֹּ֣ר וָ/פֶרַח֒ וּ/שְׁלֹשָׁ֣ה גְבִעִ֗ים מְשֻׁקָּדִ֛ים בַּ/קָּנֶ֥ה הָ/אֶחָ֖ד כַּפְתֹּ֣ר וָ/פָ֑רַח כֵּ֚ן לְ/שֵׁ֣שֶׁת הַ/קָּנִ֔ים הַ/יֹּצְאִ֖ים מִן הַ/מְּנֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/033.yaml
  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
  footnotes:
  - marker: a
    text: Or 'three cups made like almond blossoms on one branch ... and three cups made like almond blossoms on one branch.'
    reason: lexical_alternative
  - marker: b
    text: '''Bulb'' renders Hebrew כַּפְתֹּר, an ornamental rounded projection; alternatively, ''knob.'''
    reason: lexical_alternative
  - marker: c
    text: Hebrew מְנֹרָה is often transliterated 'menorah.' Here it is translated 'lampstand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 가지 가지에는 세 개의 아몬드꽃 모양 잔이 있고, 그것들의 아래에는 마디와 꽃이 있으며, 또 다른 가지에는 세 개의 아몬드꽃 모양 잔이 있고, 그것들의 아래에는 마디와 꽃이 있어야 합니다. 이렇게 등잔대에서 나오는 여섯 가지 모두에 그렇게 해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘한 가지’에 해당하는 반복 구조를 사용하며, 본문은 여섯 가지 모두에 같은 장식 배열이 적용됨을 말합니다.
    reason: source_note
lexical_decisions:
- source_word: גְבִעִים
  english_pob_choice: cups
  chosen_korean: 잔
  alternatives_korean:
  - 컵
  - 그릇
  lexicon: HALOT
  rationale: 등잔대의 장식 요소로서 그릇형 받침보다 ‘잔’이 더 자연스럽고, 영어 POB의 ‘cups’와도 직접 대응합니다.
- source_word: מְשֻׁקָּדִים
  english_pob_choice: almond-blossom-shaped
  chosen_korean: 아몬드꽃 모양
  alternatives_korean:
  - 아몬드꽃처럼 만든
  - 아몬드 모양
  lexicon: HALOT
  rationale: 이 형용사는 단순히 아몬드가 아니라 장식 문양인 아몬드꽃 형상을 가리키므로, ‘꽃 모양’까지 드러내는 것이 본문 뜻을 더 정확히 반영합니다.
- source_word: כַּפְתֹּר
  english_pob_choice: bulb
  chosen_korean: 마디
  alternatives_korean:
  - 혹
  - 손잡이
  lexicon: HALOT
  rationale: 등잔대 장식의 둥근 돌출부를 가리키므로, 한국어에서는 식물·장식 맥락을 함께 살릴 수 있는 ‘마디’가 가장 무난합니다.
- source_word: פֶרַח / פָרַח
  english_pob_choice: flower
  chosen_korean: 꽃
  alternatives_korean:
  - 꽃송이
  - 블라썸
  lexicon: HALOT
  rationale: 장식적인 식물 이미지가 분명하므로 ‘꽃’이 가장 직관적이며, 반복되는 구조도 자연스럽게 살립니다.
- source_word: מְנֹרָה
  english_pob_choice: lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 촛대
  - 메노라
  lexicon: HALOT
  rationale: 출애굽기의 성막 기물로서 표준적이고 이해하기 쉬운 한국어 대응은 ‘등잔대’이며, 본문 기능을 잘 드러냅니다.
theological_decisions:
- issue: 형식 반복과 명령 종결의 보존
  chosen_reading: 두 가지의 반복 구조를 살리고, 마지막은 ‘해야 합니다’로 옮겨 지시·규범적 어조를 유지했습니다.
  alternative_readings:
  - 좀 더 유려하게 한 문장으로 압축
  - 서술형으로 완화
  rationale: 히브리어는 성막 규격을 제시하는 지시문이므로, 미학적 압축보다 반복과 규범성을 보존하는 편이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 출 25장의 성막 설계 명령 본문
- issue: ‘등잔대’의 기능적 번역
  chosen_reading: מְנֹרָה를 음역하지 않고 ‘등잔대’로 옮겼습니다.
  alternative_readings:
  - 메노라
  rationale: 여기서는 고유명사가 아니라 성막 기구의 일반 명칭이므로, 기능을 드러내는 번역이 독자 이해에 더 적합합니다.
  doctrine_reference: 성막 기구 용어의 기능적 번역 원칙
