  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: You shall make
  chosen_korean: 만들어야 합니다
  alternatives_korean:
  - 만드셔야 합니다
  - 만드십시오
  - 만들 것입니다
  lexicon: HALOT
  rationale: 지시문맥의 완료형+접속사는 현대 한국어에서 명령적·규범적 의무를 나타내는 ‘-아/어야 합니다’로 자연스럽게 옮기는 것이 적절합니다.
- source_word: בַדֵּי
  english_pob_choice: poles
  chosen_korean: 막대기
  alternatives_korean:
  - 지팡이
  - 채
  - 봉
  lexicon: HALOT
  rationale: 문맥상 언약궤를 멜 때 쓰는 운반용 막대이며, 한국어에서 가장 직접적이고 이해하기 쉬운 대응어는 ‘막대기’입니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로
  alternatives_korean:
  - 아카시아 목재로
  - 시팀 나무로
  - 아카시아로
  lexicon: HALOT
  rationale: 히브리어의 재료 표현을 한국어에서는 재료를 나타내는 조사 ‘-로’로 자연스럽게 옮기며, ‘아카시아 나무’가 표준적이고 명확합니다.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  english_pob_choice: and overlay them with gold
  chosen_korean: 그것에 금을 입혀야 합니다
  alternatives_korean:
  - 그것을 금으로 입혀야 합니다
  - 그것에 금을 덧입혀야 합니다
  - 그것을 금으로 씌워야 합니다
  lexicon: HALOT
  rationale: צפה는 단순히 ‘덮다’보다 표면에 재료를 입히는 공예적 뜻이 강하므로, 한국어에서 자연스럽고 기술적인 표현인 ‘금을 입히다’가 가장 가깝습니다.
