source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ כַפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
  footnotes:
  - marker: a
    text: Or 'atonement cover.' The Hebrew כַּפֹּרֶת names the gold cover placed on the ark and is related to the atonement root כפר.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 순금으로 속죄소를 만들고, 길이는 두 규빗 반[a]이며, 너비는 한 규빗 반입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '속죄 덮개'. 히브리어 כַּפֹּרֶת은 언약궤 위에 놓는 금 덮개를 가리키며, 속죄 어근 כפר와 관련됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַפֹּרֶת
  english_pob_choice: mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 자비의 자리
  - 덮개
  - 속죄 덮개
  lexicon: HALOT
  rationale: 히브리어 כַפֹּרֶת은 언약궤 위의 금 덮개를 가리키며 어근 כפר와 관련됩니다. 한국어에서는 이 제의적 대상에 대한 표준적이고 의미를 드러내는 표현으로 속죄소가 가장 적절하여, 영어 POB의 본문 의미를 직접 반영했습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: of pure gold
  chosen_korean: 순금으로
  alternatives_korean:
  - 순수한 금으로
  - 정금으로
  lexicon: HALOT
  rationale: 재료와 질을 함께 나타내는 표현을 한국어에서는 자연스럽게 '순금으로'로 옮기는 것이 가장 간결하고 정확합니다.
- source_word: אַמָּתַיִם וָחֵצִי / וְאַמָּה וָחֵצִי
  english_pob_choice: two cubits and a half / and a cubit and a half
  chosen_korean: 두 규빗 반 / 한 규빗 반
  alternatives_korean:
  - 두 규빗과 반 / 한 규빗과 반
  - 두 자와 반 / 한 자와 반
  lexicon: HALOT
  rationale: 고대 측량 단위를 보존하면서도 한국어에서 가장 자연스럽고 읽기 쉬운 형식으로 수량을 간명하게 표현했습니다.
theological_decisions:
- issue: כַפֹּרֶת의 번역과 제의적 함의
  chosen_reading: 속죄소
  alternative_readings:
  - mercy seat의 음역적 대응
  - 속죄 덮개
  rationale: 이 절은 언약궤 위의 금 덮개라는 구체적 제의 대상을 지시하므로, 단순한 '덮개'보다 그 기능과 연관을 드러내는 '속죄소'가 본문 이해에 더 적합합니다. 본문 자체가 속죄 어근과 연결되므로 그 긴장을 보존했습니다.
  doctrine_reference: 출애굽기 25장 성막 지시 본문; 제의 용어의 기능적 번역 원칙
