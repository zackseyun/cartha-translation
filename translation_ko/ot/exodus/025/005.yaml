lexical_decisions:
- source_word: וְ/עֹרֹת אֵילִם מְאָדָּמִים
  english_pob_choice: ram skins dyed red
  chosen_korean: 붉게 물들인 숫양 가죽
  alternatives_korean:
  - 붉게 염색한 숫양 가죽
  - 붉게 물든 숫양 가죽
  lexicon: HALOT
  rationale: עֹרֹת는 물질 목록에서 동물 가죽/껍질을 뜻하므로 ‘가죽’으로 옮기고, אֵילִם은 ‘숫양’으로 분명하게 표현했습니다. מְאָדָּמִים은 단순한 색상보다 인위적으로 붉게 된 상태를 가리키므로 ‘붉게 물들인’이 가장 자연스럽습니다.
- source_word: וְ/עֹרֹת תְּחָשִׁים
  english_pob_choice: fine leather skins
  chosen_korean: 고운 가죽
  alternatives_korean:
  - 해양동물 가죽
  - 돌고래 가죽
  - 두공 가죽
  - 고급 가죽
  lexicon: HALOT
  rationale: תְּחָשִׁים의 정확한 대상은 불확실하므로 특정 동물로 단정하지 않고, POB의 취지를 따라 기능적으로 ‘고운 가죽’으로 처리했습니다. 이렇게 하면 재료 목록의 의미를 살리면서도 과도한 확정을 피할 수 있습니다.
- source_word: וַ/עֲצֵי שִׁטִּים
  english_pob_choice: acacia wood
  chosen_korean: 아카시아 나무
  alternatives_korean:
  - 시팀 나무
  - 아카시아 목재
  lexicon: HALOT
  rationale: שִׁטִּים은 일반적으로 아카시아를 가리키므로 현대 한국어에서 바로 이해되는 ‘아카시아 나무’로 옮겼습니다. 목록의 병렬성을 위해 ‘목재’보다 ‘나무’가 더 간결합니다.
