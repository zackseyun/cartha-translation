  text: כְּ/כֹ֗ל אֲשֶׁ֤ר אֲנִי֙ מַרְאֶ֣ה אוֹתְ/ךָ֔ אֵ֚ת תַּבְנִ֣ית הַ/מִּשְׁכָּ֔ן וְ/אֵ֖ת תַּבְנִ֣ית כָּל כֵּלָ֑י/ו וְ/כֵ֖ן תַּעֲשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
  footnotes:
  - marker: a
    text: Or 'plan,' 'model,' or 'design' for 'pattern' (תַּבְנִית).
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'you shall make' is plural, addressing Moses together with those responsible for the work.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너에게 보여 주는 모든 것, 곧 성막의 모양과 그 모든 기물의 모양에 정확히 따라, 너희는 그와 같이 만드십시오[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계획’, ‘모형’, ‘설계’로 ‘모양’(תַּבְנִית)을 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에서 ‘너에게’는 단수형이지만, ‘만드십시오’는 복수형입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  english_pob_choice: Exactly according to all that
  chosen_korean: 정확히 일치하게
  alternatives_korean:
  - 보여 주는 모든 것과 일치하게
  - 모든 것에 따라 정확히
  lexicon: HALOT
  rationale: כְּכֹל אֲשֶׁר의 정밀한 대응 관계를 살려, 단순한 ‘따라’보다 규범적·세부적 일치를 분명히 했습니다.
- source_word: מַרְאֶה
  english_pob_choice: I am showing
  chosen_korean: 내가 너에게 보여 주는
  alternatives_korean:
  - 내가 보여 주는
  - 내가 너를 보게 하는
  lexicon: HALOT
  rationale: 현재 진행적/지속적 뉘앙스를 살려, 모세에게 지금 계시로 보여 주시는 상황을 자연스럽게 옮겼습니다.
- source_word: תַּבְנִית
  english_pob_choice: pattern
  chosen_korean: 양식
  alternatives_korean:
  - 모양
  - 모형
  - 설계
  lexicon: HALOT
  rationale: ‘양식’은 성막의 구조적 기준을 담으면서도, 본문이 말하는 본보기/모형의 여지를 과도하게 좁히지 않습니다.
- source_word: כֵּלָיו
  english_pob_choice: all its furnishings
  chosen_korean: 그 모든 기물
  alternatives_korean:
  - 그 모든 비품
  - 그 모든 기구
  - 그 모든 기물들
  lexicon: HALOT
  rationale: 성막 문맥의 כֵּלִים은 단순한 용기보다 넓은 성격의 성소 도구들을 가리키므로, ‘기물’이 가장 포괄적입니다.
- source_word: תַּעֲשׂוּ
  english_pob_choice: you shall make it
  chosen_korean: 너희는 그렇게 만들라
  alternatives_korean:
  - 너희는 만들라
  - 너희는 그것을 만들어야 합니다
  lexicon: HALOT
  rationale: 히브리어 2인칭 복수형을 반영해, 모세 개인이 아니라 함께 책임지는 자들을 포함하는 명령으로 옮겼습니다.
theological_decisions:
- issue: תַּבְנִית를 천상 원형으로 단정할지 여부
  chosen_reading: ‘양식’으로 옮겨, 본문이 말하는 보여 주심과 모형성을 살리되 존재론적 단정은 피했습니다.
  alternative_readings:
  - 하늘의 원형
  - 모형
  - 설계
  rationale: 본문 자체는 하나님이 무엇인가를 ‘보여 주신다’고 말할 뿐, 그 양식의 존재론을 자세히 규정하지 않으므로 번역에서도 그 긴장을 유지했습니다.
  doctrine_reference: 번역 철학 §3 — 신학적 긴장을 해소하지 않고 보존
