  source_fidelity: 히브리어의 ‘내가 너에게 보여 주는 모든 것’과 이어지는 성막 및 그 기물의 תַּבְנִית을 ‘곧’으로 풀어 연결하고, כְּכֹל의 대응 관계와 복수형 תַּעֲשׂוּ를 유지했습니다. ‘양식’은 현대 한국어에서 주로 문체나 건축 양식을 뜻하여 תַּבְנִית의 ‘모양/본보기/설계’ 범위를 다소 부정확하게 한정할 수 있으므로 ‘모양’으로 조정했습니다.
  naturalness: 초안의 ‘만들라’는 요구된 현대 공식 존대체(합쇼체)가 아닙니다. ‘만드십시오’로 고치고, ‘모든 것과 정확히 일치하게—…양식대로’의 겹친 연결을 ‘…모양에 정확히 따라’로 간결하고 자연스럽게 정리했습니다.
  terminology: ‘성막’과 ‘기물’은 적절합니다. תַּבְנִית에는 문맥상 ‘모양’을 사용하되, 각주에서 계획·모형·설계의 가능한 어휘 범위를 밝혔습니다. 복수형 각주는 모세와 작업자들을 특정하는 해석을 피하고, 단수 수신자와 복수 동사의 형태적 대비만 기술했습니다.
