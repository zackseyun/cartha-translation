  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
  footnotes:
  - marker: a
    text: Or 'atonement cover.' The Hebrew term refers to the cover of the ark and carries sacrificial/atonement associations.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 속죄 덮개[a]를 궤 위에 놓고, 내가 네게 줄 증거를 그 궤 안에 넣어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄소’입니다. 히브리어 용어는 궤의 덮개를 가리키며 속죄와 관련된 함의를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  english_pob_choice: mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 긍휼좌
  - 은혜자리
  - 속죄 덮개
  lexicon: HALOT
  rationale: 이 용어는 궤의 덮개를 가리키면서도 속죄와 만남의 신학적 의미를 지니므로, 한국어에서는 의미를 더 직접 드러내는 ‘속죄소’를 택했습니다.
- source_word: עֵדֻת
  english_pob_choice: the testimony
  chosen_korean: 증거판
  alternatives_korean:
  - 증거
  - 언약 문서
  - 증언
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 하나님이 주실 돌판을 가리키는 것으로 이해되므로, 단순한 ‘증거’보다 대상이 분명한 ‘증거판’이 자연스럽습니다.
- source_word: אֶל הָאָרֹן
  english_pob_choice: into the ark
  chosen_korean: 그 궤 안에
  alternatives_korean:
  - 그 궤 속에
  - 그 궤에
  - 궤 안으로
  lexicon: HALOT
  rationale: 히브리어의 ‘~에게/로’는 동사 ‘두다’와 결합할 때 삽입의 방향을 나타내므로, 한국어에서는 ‘안에’로 옮겨 실제로 넣는 동작을 분명하게 했습니다.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  english_pob_choice: put / shall put / will give
  chosen_korean: 두어야 합니다 / 두고
  alternatives_korean:
  - 놓아야 합니다 / 놓고
  - 넣어야 합니다 / 넣고
  lexicon: HALOT
  rationale: 제의 기구와 증거판의 배치를 나타내는 동사로서, 한국어에서는 가장 중립적이고 자연스러운 ‘두다’ 계열을 사용했습니다.
theological_decisions:
- issue: כַּפֹּרֶת의 한국어 처리와 속죄 함의
  chosen_reading: ‘속죄소’로 옮겨 덮개라는 물리적 의미와 속죄·임재의 신학적 의미를 함께 드러냈습니다.
  alternative_readings:
  - ‘속죄 덮개’
  - ‘자비소’
  rationale: 이 절은 궤 위에 놓이는 제의적 덮개를 말하지만, 성소 문맥상 속죄와 하나님의 임재 장소라는 기능이 중요하므로 단순한 물리적 묘사에 머무르지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
