  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/יִקְחוּ לִ֖/י תְּרוּמָ֑ה מֵ/אֵ֤ת כָּל אִישׁ֙ אֲשֶׁ֣ר יִדְּבֶ֣/נּוּ לִבּ֔/וֹ תִּקְח֖וּ אֶת תְּרוּמָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
  footnotes:
  - marker: a
    text: Or 'contribution.' The Hebrew term refers to something set apart and given for sacred use.
    reason: lexical_alternative
  - marker: b
    text: Or 'whose heart stirs him' or 'whose heart prompts him.' The Hebrew idiom emphasizes voluntary inward willingness.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the sons of Israel,' a standard covenantal designation for the people of Israel.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손[c]에게 말하십시오. 그들에게 나를 위하여 예물[a]을 가져오라고 하십시오. 마음이 그를 움직이는 모든 사람에게서 내 예물을 받으십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예물’은 히브리어 תְּרוּמָה를 넓게 옮긴 말입니다. 이는 성막을 위해 구별하여 드리는 헌납을 가리키며, ‘헌납물’ 또는 ‘봉헌물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 마음이 그를 움직이는’입니다. 이 히브리어 관용구는 자발적인 내적 의지 또는 마음의 자원을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이스라엘 자손’은 히브리어의 표준적인 언약 공동체 지칭입니다.
    reason: cultural_note
