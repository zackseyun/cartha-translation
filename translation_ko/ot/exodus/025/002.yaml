  source_fidelity: 첫 명령과 뒤따르는 지시의 관계는 유지되어 있으나, ‘그들이 … 드리게 하십시오’는 한국어에서 명령의 대상과 사역 관계가 다소 불명확합니다. 또한 ‘마음이 자원하여 움직이는’은 히브리어 관용구의 주어·의미 관계를 부자연스럽게 처리합니다. ‘마음이 그를 움직이는’은 원문의 표현을 더 직접적으로 보존하며, 자발성은 각주에서 설명할 수 있습니다.
  naturalness: 문장을 둘로 나누고 ‘…라고 하십시오’로 옮기면 현대 표준 한국어 합쇼체에서 명료하고 자연스럽습니다. ‘내 예물을 받으십시오’는 복수 청자에게 드리는 명령으로 자연스럽습니다.
  terminology: ‘이스라엘 자손’과 ‘예물’은 이 문맥에서 적절합니다. תְּרוּמָה의 성막 헌납 의미는 각주에서 ‘헌납물’ 또는 ‘봉헌물’의 대안을 밝혀 보완할 수 있습니다. 각주의 비한국어 혼입(‘כאן’, ‘प्रेर동’)은 반드시 고쳐야 하며, 각주 표지도 해당 어구 뒤에 배치해야 합니다.
