  rationale: 히브리어의 관용적 집단 명칭을 보존하되, 한국어 성경에서 널리 통용되는 표현으로 옮겼습니다.
- source_word: תְּרוּמָה
  english_pob_choice: offering
  chosen_korean: 예물
  alternatives_korean:
  - 헌물
  - 봉헌물
