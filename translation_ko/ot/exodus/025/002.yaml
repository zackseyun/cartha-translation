base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
  footnotes:
  - marker: a
    text: Or 'contribution.' The Hebrew term refers to something set apart and given for sacred use.
    reason: lexical_alternative
  - marker: b
    text: Or 'whose heart stirs him' or 'whose heart prompts him.' The Hebrew idiom emphasizes voluntary inward willingness.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the sons of Israel,' a standard covenantal designation for the people of Israel.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손에게 말하여, 그들이 나를 위하여 예물을 드리게 하십시오. 마음이 자원하여 움직이는 모든 사람에게서 너희는 내 예물을 받아야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예물’은 כאן의 תְּרוּמָה를 넓게 옮긴 것으로, 성막을 위해 구별해 드리는 헌납을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마음이 자원하여 움직이는’은 히브리 관용구를 풀어 옮긴 것으로, 자발성과 내적 प्रेर동을 함께 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이스라엘 자손’은 히브리어의 표준적 언약 공동체 지칭입니다.
    reason: cultural_note
