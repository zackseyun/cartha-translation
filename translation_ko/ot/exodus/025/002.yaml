  lexicon: HALOT
  rationale: 성막을 위한 구별된 헌납이라는 문맥을 살리면서도 제사 전용어로 좁아지지 않도록 예물을 택했습니다.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  english_pob_choice: whose heart moves him
  chosen_korean: 마음이 자원하여 움직이는
  alternatives_korean:
  - 마음이 그를 움직이는
  - 마음이 그를 자원하게 하는
  - 마음이 촉발하는
  lexicon: HALOT
  rationale: ‘마음’이 내부에서 자발적으로 이끄는 뜻을 살려, 강제 없는 자원성을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 자원 헌납의 성격을 어떻게 드러낼 것인가
  chosen_reading: 예물은 강제 징수가 아니라 마음의 자원에 따른 헌납으로 제시했습니다.
  alternative_readings:
  - 단순한 헌금으로 평탄화할 수 있습니다.
  - 제의적 제물로 더 좁게 읽을 수 있습니다.
  rationale: 문맥은 성막을 위한 거룩한 헌납이지만, 본문은 내적 자원성을 강조하므로 그 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
