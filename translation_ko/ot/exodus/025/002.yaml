revisions:
- from: 이스라엘 자손에게 말하여, 그들이 나를 위하여 예물을 드리게 하십시오. 마음이 자원하여 움직이는 모든 사람에게서 너희는 내 예물을 받아야 합니다.[a][b][c]
  to: 이스라엘 자손[c]에게 말하십시오. 그들에게 나를 위하여 예물[a]을 가져오라고 하십시오. 마음이 그를 움직이는 모든 사람에게서 내 예물을 받으십시오.[b]
  rationale: 원문의 명령 구조를 ‘말하십시오/…라고 하십시오’로 명확히 하고, 마음이 사람을 자발적으로 움직인다는 히브리어 관용구를 자연스럽고 직접적으로 반영했습니다. 예물의 거룩한 헌납 의미와 자발성은 본문에 과도하게 보태지 않고 각주에서 설명했습니다. 아울러 각주의 언어 혼입을 제거하고 표지를 해당 어구로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
