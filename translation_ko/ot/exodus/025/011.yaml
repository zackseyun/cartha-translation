source:
  edition: WLC
  text: וְ/צִפִּיתָ֤ אֹת/וֹ֙ זָהָ֣ב טָה֔וֹר מִ/בַּ֥יִת וּ/מִ/ח֖וּץ תְּצַפֶּ֑/נּוּ וְ/עָשִׂ֧יתָ עָלָ֛י/ו זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
  footnotes:
  - marker: a
    text: Or 'a gold rim' or 'a gold border'; traditionally, 'a crown of gold.' The Hebrew זֵר refers to an ornamental edging around the object.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 그것을 안팎에서 순금으로 입히고, 그것 위에 사방으로 금 테두리를 만들어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘금 테두리’는 여기의 זֵר를 공예적 장식 가장자리로 이해한 번역입니다. 전통적으로는 ‘금 왕관’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  english_pob_choice: overlay / you shall overlay it
  chosen_korean: 입히고
  alternatives_korean:
  - 덧입히고
  - 씌우고
  - 입혀야 합니다
  lexicon: HALOT
  rationale: צפה는 성막 기구에 금속을 입히는 뜻이므로, 한국어에서는 자연스럽고 공예적 뉘앙스를 살리는 ‘입히다’가 가장 정확합니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 깨끗한 금
  - 순수한 금
  lexicon: HALOT
  rationale: טהור는 불순물이 섞이지 않은 금을 가리키므로, 현대 한국어에서 간결하고 표준적인 ‘순금’이 적합합니다.
- source_word: זֵר
  english_pob_choice: molding
  chosen_korean: 테두리
  alternatives_korean:
  - 가장자리
  - 장식 테두리
  - 몰딩
  lexicon: HALOT
  rationale: 여기서 זֵר는 머리 장식의 ‘왕관’이 아니라 기구를 두르는 장식적 가장자리를 뜻하므로, 독자가 형태를 바로 이해할 수 있는 ‘테두리’가 자연합니다.
- source_word: סָבִיב
  english_pob_choice: all around
  chosen_korean: 사방으로
  alternatives_korean:
  - 둘레로
  - 주위로
  - 모든 둘레에
  lexicon: HALOT
  rationale: סביב은 사방을 에워싸는 분포를 나타내므로, 반복성과 전체 둘레를 드러내는 ‘사방으로’가 적절합니다.
