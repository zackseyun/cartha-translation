  to: 주의하여, 그것들을 산에서 당신에게 보여 준 그것들의 본에 따라 만드십시오.[a]
  rationale: 관계절을 ‘본’에 직접 붙여 히브리어 구문을 반영하고, 소유 표현을 ‘그것들의’로 바꾸어 성막 기구들을 가리키는 복수 접미사를 명확히 했습니다. ‘보여 준’은 원문의 피동 분사적 표현을 자연스러운 한국어로 옮기되, 보여 준 주체를 본문 이상으로 명시하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:36Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 명령 연속(‘주의하여/살피고’ + ‘만들라’)과 תבנית의 복수 소유 접미사, 그리고 산에서 보인 본이라는 관계절을 명확히 드러내도록 다듬는 것이 좋습니다. 초안의 ‘그것은’은 선행사 ‘본’을 가리킬 수 있으나, 문장 분리로 인해 지시 대상이 다소 불분명해집니다.
  naturalness: ‘그들의 본’은 한국어에서 사람을 가리키는 것으로 쉽게 읽히며, ‘그것은 … 보여 주신 것입니다’도 피동 의미와 선행사가 다소 불명료합니다. 관계절을 ‘본’에 직접 연결하고 ‘그것들의 본’으로 바꾸면 더 자연스럽고 분명합니다.
  terminology: ‘본’은 תבנית의 모델·양식이라는 의미를 간결하게 보존하며, 하늘의 원형이나 단순 도면이라는 특정 해석을 강요하지 않습니다. ‘주의하여’와 ‘만드십시오’는 현대 표준어 합쇼체에 적절합니다.
  issues:
