  lexicon: HALOT
  rationale: ראה의 명령은 단순 시각이 아니라 주의를 기울이라는 뜻이므로, 합쇼체에서 자연스럽게 경계와 주의를 담는 표현으로 옮겼습니다.
- source_word: וַעֲשֵׂה
  english_pob_choice: that you make
  chosen_korean: 만드십시오
  alternatives_korean:
  - 만들십시오
  - 그리고 만드십시오
  lexicon: HALOT
  rationale: 성막 기구의 제작 문맥이므로 עשה는 '만들다'가 적절하며, 앞 절의 명령에 이어지는 요청으로 공손한 명령형으로 옮겼습니다.
- source_word: בְּתַבְנִיתָם
  english_pob_choice: according to their pattern
  chosen_korean: 그들의 본에 따라
  alternatives_korean:
  - 그들의 모형에 따라
  - 그들의 패턴에 따라
  - 그 본을 따라
  lexicon: HALOT
  rationale: תבנית는 본, 모형, 패턴의 뜻을 가지므로, 문맥상 하나님이 보여 주신 제작 기준이라는 점을 살려 '본'으로 옮겼습니다.
- source_word: מָרְאֶה
  english_pob_choice: was shown to you
  chosen_korean: 당신에게 보여 주신
  alternatives_korean:
  - 당신에게 보여 주신 바
  - 당신에게 보이신
  - 보여 주고 계신
  lexicon: HALOT
  rationale: 이 형태는 '보여지다'의 분사적 용법으로 이해할 수 있어, 산에서 모세에게 이미 제시된 계시라는 문맥을 살려 과거 완료감의 표현으로 처리했습니다.
theological_decisions:
- issue: 산에서 보여 주신 본의 성격
  chosen_reading: 하나님이 모세에게 산에서 보여 주신 제작 기준으로 이해하되, 본의 형이상학적 성격은 단정하지 않습니다.
  alternative_readings:
  - 하늘의 원형의 복사본
  - 단순한 작업 도면
  rationale: תבנית는 '본/모형'을 뜻하지만, 본문의 초점은 성막 기구가 하나님이 보이신 것과 일치해야 한다는 점에 있습니다. 따라서 존재론적 해석은 열어 두고 명령의 강도를 살렸습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
