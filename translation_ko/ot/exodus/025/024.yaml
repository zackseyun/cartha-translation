  lexicon: HALOT
  rationale: זֵר는 장식용 가장자리나 둘레를 뜻하므로, 현대 한국어에서 기능과 형태를 함께 살리는 ‘테두리’가 가장 이해하기 쉽습니다.
- source_word: סָבִיב
