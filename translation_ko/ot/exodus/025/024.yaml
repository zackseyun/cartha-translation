  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
  footnotes:
  - marker: a
    text: Or 'a gold rim' or 'a gold border'; the Hebrew term can denote an ornamental edging. Traditionally, some render it 'crown,' but here it refers to the decorative molding around the table.
