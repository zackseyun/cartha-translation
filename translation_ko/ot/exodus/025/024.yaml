  yaml_path: translation/ot/exodus/025/024.yaml
  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
  footnotes:
  - marker: a
    text: Or 'a gold rim' or 'a gold border'; the Hebrew term can denote an ornamental edging. Traditionally, some render it 'crown,' but here it refers to the decorative molding around the table.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 순금으로 입히고, 그 둘레에 금 테두리[a]를 만들어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금 장식 가장자리’ 또는 ‘금 테’; 히브리어 ‘제르’는 물건 둘레를 두르는 장식 가장자리를 가리킵니다. 전통적으로 ‘관’으로 옮기기도 하지만, 여기서는 상 둘레의 장식 테두리를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ אֹתוֹ
  english_pob_choice: you shall overlay it
  chosen_korean: 그것에 ...을 입히고
  alternatives_korean:
  - 그것을 ...으로 덮고
  - 그것에 ...을 입혀
  lexicon: HALOT
  rationale: צפה는 금속으로 물체 표면을 입히는 뜻이므로, 한국어에서는 공예적 의미를 살린 ‘입히다’가 가장 자연스럽고 정확합니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 정제된 금
  lexicon: HALOT
  rationale: טָהוֹר는 금의 순도를 가리키므로, 관용적이고 간명한 ‘순금’이 원문의 뜻을 잘 전달합니다.
- source_word: זֵר זָהָב
  english_pob_choice: a gold molding
  chosen_korean: 금 테두리
  alternatives_korean:
  - 금 몰딩
  - 금 장식 둘레
  - 금 고리
  lexicon: HALOT
  rationale: זֵר는 장식용 가장자리나 둘레를 뜻하므로, 현대 한국어에서 기능과 형태를 함께 살리는 ‘테두리’가 가장 이해하기 쉽습니다.
- source_word: סָבִיב
  english_pob_choice: all around
  chosen_korean: 둘레에
  alternatives_korean:
  - 주위에
  - 사방에
  lexicon: HALOT
  rationale: סביב은 둘러싸는 전체 범위를 나타내므로, 문맥상 ‘둘레에’가 자연스럽고 정확합니다.
