id: EXO.25.28
reference: Exodus 25:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ אֶת הַ/בַּדִּים֙ עֲצֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֥ אֹתָ֖/ם זָהָ֑ב וְ/נִשָּׂא בָ֖/ם אֶת הַ/שֻּׁלְחָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/028.yaml
  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
  footnotes:
  - marker: a
    text: Or 'with them the table shall be carried.' The Hebrew preposition can express instrumentality.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 아카시아나무로 그 막대들을 만들고, 그것들을 금으로 입혀야 하며, 그 막대들로 그 상을 운반해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: You shall make
  chosen_korean: 만들어야 합니다
  alternatives_korean:
  - 만드십시오
  - 만들 것입니다
  lexicon: HALOT
  rationale: 지시문맥의 완료형+접속사는 한국어에서 의무/명령형으로 옮기는 것이 자연스럽고, 합쇼체에서는 '만들어야 합니다'가 가장 무난합니다.
- source_word: הַבַּדִּים
  english_pob_choice: the poles
  chosen_korean: 막대들
  alternatives_korean:
  - 운반 막대들
  - 장대들
  lexicon: HALOT
  rationale: 성막 기구 운반용 막대라는 기능이 분명하지만, 본문 자체는 단순히 '막대들'이라 하므로 너무 해설적이지 않게 옮겼습니다.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  english_pob_choice: and overlay them with gold
  chosen_korean: 그것을 금으로 입혀야 하며
  alternatives_korean:
  - 그것들을 금으로 덮어야 하며
  - 그것들을 금으로 입혀야 하며
  lexicon: HALOT
  rationale: '''צפה''는 공예 문맥에서 표면을 입히는 뜻이므로 ''입히다''가 가장 정확합니다. 한국어 목적어는 막대들을 가리키므로 ''그것을''을 사용했습니다.'
- source_word: וְנִשָּׂא בָם
  english_pob_choice: and by them ... shall be carried
  chosen_korean: 그것들로 ... 메워야 합니다
  alternatives_korean:
  - 그것들로 ... 운반해야 합니다
  - 그것들에 의해 ... 메워야 합니다
  lexicon: HALOT
  rationale: בָם의 도구적 의미를 한국어 '-로'로 살렸습니다. 다만 한국어 동사 'carry'는 문맥상 상(탁자)을 싣고 옮긴다는 뜻이므로 '메우다' 대신 '운반하다'가 더 직접적이지만, 여기서는 본문의 수동적 구성과 운반용도를 드러내기 위해 '메우다'를 사용하지 않고 '운반하다'가 더 적절한 표현으로 판단했습니다.
- source_word: הַשֻּׁלְחָן
  english_pob_choice: the table
  chosen_korean: 그 상
  alternatives_korean:
  - 그 탁자
  - 그 식탁
  lexicon: HALOT
  rationale: 출애굽기 문맥의 성소 기구를 가리키는 표준적 한국어는 '상'이며, 본문이 설명을 덧붙이지 않으므로 간결하게 유지했습니다.
theological_decisions:
- issue: 성소 기구 운반 방식의 직접성
  chosen_reading: 본문의 핵심은 상을 옮기기 위한 운반 막대와 금 입힘의 제작 지시입니다.
  alternative_readings:
  - 단순한 제작 설명으로만 읽기
  - 의례적 상징성을 본문에 덧붙이기
  rationale: 이 절은 해설보다 지시가 중심이므로, 기능과 명령을 분명히 드러내되 본문에 없는 상징을 추가하지 않았습니다.
  doctrine_reference: 성막 규례의 문자적 지시
