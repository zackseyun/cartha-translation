  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
  footnotes:
  - marker: a
    text: Or 'a gold crown around its frame.' The Hebrew זֵר can denote an ornamental border or molding; 'crown' is the traditional rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 위해 둘레를 두루 감싸는 너비 한 뼘짜리 테를 만들고, 그 테 둘레에 금으로 된 장식띠를 만드십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 테 둘레에 금관을 두르십시오.' 히브리어 זֵר는 장식용 테두리나 몰딩을 가리킬 수 있으며, 전통적으로는 '관'으로도 옮깁니다.
    reason: lexical_alternative
