base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/025.yaml
  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
  footnotes:
  - marker: a
    text: Or 'a gold crown around its frame.' The Hebrew זֵר can denote an ornamental border or molding; 'crown' is the traditional rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것 둘레에 한 뼘 너비의 테를 만들고, 그 테 둘레에 금 장식 테두리를 만드십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 테 둘레에 금관을 만드십시오.’ 히브리어 זֵר는 장식용 테두리나 몰딩을 가리킬 수 있으며, 전통적으로는 ‘관’으로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: You shall make
  chosen_korean: 만드십시오
  alternatives_korean:
  - 만들어야 합니다
  - 만드십시오, 그리고
  lexicon: HALOT
  rationale: 성막 규정의 명령형을 한국어 합쇼체로 자연스럽게 옮기되, 지시문의 직접성을 유지했습니다.
- source_word: מִסְגֶּרֶת
  english_pob_choice: frame
  chosen_korean: 테
  alternatives_korean:
  - 틀
  - 둘레틀
  - 틀장식
  lexicon: HALOT
  rationale: 이 문맥에서는 구조적 테두리이므로, 현대 한국어에서 자연스럽고 과도한 해석을 피하는 '테'가 가장 간결합니다.
- source_word: טֹפַח
  english_pob_choice: a handbreadth wide
  chosen_korean: 너비 한 뼘짜리
  alternatives_korean:
  - 한 뼘 넓이의
  - 한 뼘 폭의
  - 한 뼘
  lexicon: HALOT
  rationale: 히브리어의 치수 표현을 한국어 관용인 '한 뼘'으로 옮기고, 해당 테의 폭을 분명히 하기 위해 너비를 덧붙였습니다.
- source_word: זֵר
  english_pob_choice: molding
  chosen_korean: 장식띠
  alternatives_korean:
  - 장식테
  - 가장자리띠
  - 관
  lexicon: HALOT
  rationale: 성막 기물의 장식용 테두리라는 뜻을 살리면서, 전통 번역인 '관'이 줄 수 있는 왕관 연상을 피하기 위해 '장식띠'를 선택했습니다.
theological_decisions:
- issue: 장식용 테두리의 의미를 어떻게 드러낼지
  chosen_reading: 금으로 된 장식띠
  alternative_readings:
  - 금관
  - 금테
  - 금장식
  rationale: זֵר는 단순한 장식적 테두리이므로, 왕권적 함의를 과도하게 부르는 '금관' 대신 기능을 드러내는 표현을 택했습니다.
  doctrine_reference: 출애굽기 25장 성막 기물 묘사
- issue: 명령문 어조
  chosen_reading: 하십시오체 명령
  alternative_readings:
  - 직설적 평서형
  - 하십시오체 완화
  rationale: 여호와의 지시를 받는 제작 규정이므로, 본문의 명령성을 유지하면서도 현대 한국어 독자가 자연스럽게 읽을 수 있는 합쇼체를 사용했습니다.
  doctrine_reference: 출애굽기 25장 성막 규례
