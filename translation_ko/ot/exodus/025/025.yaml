  - 하십시오체 완화
  rationale: 여호와의 지시를 받는 제작 규정이므로, 본문의 명령성을 유지하면서도 현대 한국어 독자가 자연스럽게 읽을 수 있는 합쇼체를 사용했습니다.
  doctrine_reference: 출애굽기 25장 성막 규례
