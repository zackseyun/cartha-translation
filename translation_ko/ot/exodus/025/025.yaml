  - 금장식
  rationale: זֵר는 단순한 장식적 테두리이므로, 왕권적 함의를 과도하게 부르는 '금관' 대신 기능을 드러내는 표현을 택했습니다.
  doctrine_reference: 출애굽기 25장 성막 기물 묘사
- issue: 명령문 어조
