  text: 등잔대의 집게와 불똥 그릇은 순금이어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַלְקָחֶיהָ는 등잔대의 심지를 집거나 다듬는 데 쓰는 도구를 가리킬 수 있습니다. 또는 ‘심지 다듬는 집게’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מַחְתֹּתֶיהָ는 불이나 숯을 담아 옮기는 그릇을 가리키며, 여기서는 등잔대에서 나온 불똥이나 심지 찌꺼기를 받는 그릇으로 이해할 수 있습니다. 또는 ‘불그릇’; 문맥에 따라 ‘향로’로도 옮길 수 있습니다.
    reason: lexical_alternative
