  source_fidelity: 히브리어는 막대들을 궤의 측면에 있는 고리들 안에 두어 그 막대들로 궤를 운반하게 하는 목적을 나타냅니다. 초안의 ‘끼우다’와 ‘언약궤’는 이를 적절히 반영합니다. 그러나 ‘끼워, ... 메게 하십시오’는 연결 어미와 종결 표현이 어색하게 결합되어 있으며, 목적 표현도 더 명료하게 다듬을 필요가 있습니다.
  naturalness: ‘그 막대들로 언약궤를 나를 수 있게 하십시오’로 하면 현대 표준 한국어 합쇼체에서 자연스럽고, 막대가 운반 수단임을 분명히 합니다. ‘나르다’는 כאן의 물리적 운반을 무리 없이 나타냅니다.
  terminology: ‘언약궤’, ‘막대들’, ‘고리들’, ‘옆면’은 문맥과 현대 성서 한국어 용례에 적절합니다. 복수형인 הַטַּבָּעֹת를 ‘고리들’로 드러내는 것이 더 충실합니다. 각주에서는 대안이 단순한 직역상의 표현 차이임을 제시하고, ‘뜻일 수 있습니다’라는 불필요한 불확실성은 피해야 합니다.
