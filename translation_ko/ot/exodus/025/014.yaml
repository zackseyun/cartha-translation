translation:
  language: ko
  text: 그리고 그 막대들을 언약궤의 옆면에 있는 고리에 끼워, 그것으로 언약궤를 메게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 형식적으로는 ‘막대들을 고리 안으로 가져다 넣으십시오’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  english_pob_choice: And you shall put
  chosen_korean: 끼워
  alternatives_korean:
  - 넣으십시오
  - 집어넣으십시오
  - 가져다 놓으십시오
  lexicon: HALOT
  rationale: 막대가 고리 안으로 들어가는 동작이므로, 한국어에서는 ‘끼우다’가 영어 POB의 ‘put’보다 본문 상황을 더 정확하고 자연스럽게 드러냅니다.
- source_word: הַ/בַּדִּים
  english_pob_choice: the poles
  chosen_korean: 그 막대들
  alternatives_korean:
  - 그 장대들
  - 그 운반 막대들
  - 그 막대
  lexicon: HALOT
  rationale: 성막 기구를 메는 데 쓰는 בדים은 현대 한국어에서 ‘막대들’이 가장 직관적이며, 전통적이지만 낡은 느낌의 ‘채’나 ‘스태프’는 피했습니다.
- source_word: בַּ/טַּבָּעֹת
  english_pob_choice: into the rings
  chosen_korean: 고리에
  alternatives_korean:
  - 고리 안에
  - 반지들에
  lexicon: HALOT
  rationale: 삽입의 결과가 분명하므로 전치사성을 한국어 조사로 자연스럽게 옮기되, 앞의 ‘끼우다’가 방향을 충분히 드러내므로 중복은 피했습니다.
- source_word: עַל צַלְעֹ֣ת הָ/אָרֹן
  english_pob_choice: on the sides of the ark
  chosen_korean: 언약궤의 옆면에 있는
  alternatives_korean:
  - 언약궤의 옆에 있는
  - 궤의 측면에 있는
  lexicon: HALOT
  rationale: צלעות는 단순히 ‘옆’보다 구조물의 옆면/측면을 가리키므로, 언약궤의 형태를 살려 ‘옆면’으로 옮겼습니다.
- source_word: לָ/שֵׂאת אֶת הָ/אָרֹן בָּ/הֶם
  english_pob_choice: to carry the ark with them
  chosen_korean: 그것으로 언약궤를 메게 하십시오
  alternatives_korean:
  - 그것으로 언약궤를 나르게 하십시오
  - 그 막대들로 언약궤를 들게 하십시오
  lexicon: HALOT
  rationale: לשׂאת은 단순 보유가 아니라 운반을 뜻하므로, 성물 운반에 맞는 한국어 동사 ‘메다’를 택해 기능을 분명히 했습니다.
theological_decisions:
- issue: 성막 언약궤 운반 방식의 표현
  chosen_reading: ‘그 막대들... 그것으로 언약궤를 메게 하십시오’로 옮겨, 사람이 직접 손으로 들지 않고 정해진 도구로 운반해야 하는 본문의 규범성을 드러냈습니다.
  alternative_readings:
  - ‘그 막대들을 고리에 넣으십시오’처럼 단순 지시로만 옮김
  - ‘들게 하십시오’로 일반화
  rationale: 본문은 거룩한 궤의 운반 규정을 제시하므로, 도구와 목적을 함께 드러내는 표현이 오해를 줄입니다.
  doctrine_reference: 거룩한 물건의 접근과 운반에 관한 출애굽기 성막 규정
