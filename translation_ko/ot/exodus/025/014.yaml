  to: 그리고 그 막대들을 언약궤의 옆면에 있는 고리들에 끼워서, 그 막대들로 언약궤를 나를 수 있게 하십시오.[a]
  rationale: 주동사와 운반 목적을 ‘끼워서 ... 나를 수 있게 하십시오’로 자연스럽게 연결했습니다. ‘그 막대들로’를 반복하여 בָהֶם의 선행사와 도구적 기능을 명확히 했고, ‘고리들’로 원문의 복수를 반영했습니다. 각주는 בוא의 보다 직역적인 대안을 제시하되 의미상 불확실성을 추가하지 않도록 수정했습니다.
