  alternative_readings:
  - ‘향품의 향’
  - ‘향기로운 향’
  rationale: 히브리어 표현은 단순히 ‘향’이 아니라 향료로 조제된 향을 가리키므로, 설명을 약간 보태 원문의 구성 관계를 살렸습니다.
