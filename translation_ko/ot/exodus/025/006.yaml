  alternatives_korean:
  - 관유와 향을 위한 것
  - 기름부음의 기름과 향품을 위한 것
  lexicon: HALOT
  rationale: 문법상 향품이 관유와 향 제작의 원료이므로, 목적 구조를 풀어 ‘관유를 위한 향품’과 ‘향품으로 만든 향’을 구분해 옮겼습니다.
theological_decisions:
