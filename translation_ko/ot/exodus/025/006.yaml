lexical_decisions:
- source_word: שֶׁמֶן
  english_pob_choice: oil
  chosen_korean: 기름
  alternatives_korean:
  - 오일
  - 올리브기름
  lexicon: HALOT
  rationale: 히브리어 שֶׁמֶן은 기본적으로 ‘기름’을 뜻하며, 본문은 올리브로 한정하지 않으므로 일반적인 ‘기름’이 원문에 가장 가깝습니다.
- source_word: לַמָּאוֹר
  english_pob_choice: for the light
  chosen_korean: 등불을 위한
  alternatives_korean:
  - 빛을 위한
  - 조명을 위한
  lexicon: HALOT
  rationale: 문맥상 성막의 등불 공급을 가리키므로 ‘등불’을 보완해 자연스럽고 구체적으로 옮겼습니다.
- source_word: בְּשָׂמִים
  english_pob_choice: spices
  chosen_korean: 향품
  alternatives_korean:
  - 향신료
  - 향기로운 재료
  lexicon: HALOT
  rationale: 예배용 제조 재료라는 문맥을 반영해, 단순 식재료보다 성막 제의에 더 맞는 ‘향품’을 선택했습니다.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה וְלִקְטֹרֶת הַסַּמִּים
  english_pob_choice: for the anointing oil and for the incense of spices
  chosen_korean: 관유를 위한 향품, 그리고 향품으로 만든 향을 위한 것
  alternatives_korean:
  - 관유와 향을 위한 것
  - 기름부음의 기름과 향품을 위한 것
  lexicon: HALOT
  rationale: 문법상 향품이 관유와 향 제작의 원료이므로, 목적 구조를 풀어 ‘관유를 위한 향품’과 ‘향품으로 만든 향’을 구분해 옮겼습니다.
theological_decisions:
- issue: קְטֹרֶת הַסַּמִּים의 처리
  chosen_reading: ‘향품으로 만든 향’으로 옮겨, ‘incense of spices’의 원재료 구성을 드러냈습니다.
  alternative_readings:
  - ‘향품의 향’
  - ‘향기로운 향’
  rationale: 히브리어 표현은 단순히 ‘향’이 아니라 향료로 조제된 향을 가리키므로, 설명을 약간 보태 원문의 구성 관계를 살렸습니다.
  doctrine_reference: 성막 예배 규례의 재료 명시
