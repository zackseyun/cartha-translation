translation:
  language: ko
  text: 호마노와 끼워 넣을 돌들—에봇과 가슴받이에 붙일 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호마노’는 관용적 번역이지만, 히브리어 שֹׁהַם의 정확한 보석 식별은 확정적이지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘채워 넣는 돌들’ 또는 ‘세팅용 돌들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로는 ‘흉패’라고도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  english_pob_choice: onyx stones
  chosen_korean: 호마노
  alternatives_korean:
  - 오닉스 돌
  - 오닉스 보석
  - 반짝이는 돌
  lexicon: HALOT
  rationale: שֹׁהַם의 정확한 광물 식별은 불확실하지만, 한국어 성경 전통에서 가장 널리 통용되는 대응어가 호마노이므로 본문에서는 이를 사용하고, 필요시 주석으로 불확실성을 보완합니다.
- source_word: אַבְנֵי מִלֻּאִים
  english_pob_choice: stones for setting
  chosen_korean: 끼워 넣을 돌들
  alternatives_korean:
  - 세팅할 돌들
  - 장착할 돌들
  - 박아 넣을 돌들
  lexicon: HALOT
  rationale: מִלֻּאִים은 문자적으로 ‘채움/채워 넣음’의 의미가 있어, 공예적 기능을 드러내는 ‘끼워 넣을 돌들’이 원문의 기능적 의미를 자연스럽게 살립니다.
- source_word: לָאֵפֹד
  english_pob_choice: for the ephod
  chosen_korean: 에봇에
  alternatives_korean:
  - 에봇을 위하여
  - 에봇에 달릴
  - 에봇용
  lexicon: HALOT
  rationale: אֵפוֹד는 제사장 복장의 전문 용어이므로 설명적 번역보다 음역 ‘에봇’을 유지하는 것이 source-direct합니다.
- source_word: וְלַחֹשֶׁן
  english_pob_choice: for the breastpiece
  chosen_korean: 가슴받이에
  alternatives_korean:
  - 흉패에
  - 가슴패에
  - 가슴판에
  lexicon: HALOT
  rationale: חֹשֶׁן은 전통적으로 ‘흉패’로도 옮기지만, 현대 한국어에서 갑옷을 연상시키는 ‘흉패’보다 기능을 잘 드러내는 ‘가슴받이’가 더 분명합니다.
theological_decisions:
- issue: 제사장 예복 용어의 현대화
  chosen_reading: 전통 교회어 ‘흉패’ 대신 ‘가슴받이’를 사용했습니다.
  alternative_readings:
  - 흉패
  - 가슴판
  rationale: 원문의 חֹשֶׁן은 방어구가 아니라 제사장 장식/장착 부위이므로, 현대 독자가 오해하지 않도록 기능 중심 표현을 택했습니다.
  doctrine_reference: 출애굽기 28장 제사장 복장 맥락
