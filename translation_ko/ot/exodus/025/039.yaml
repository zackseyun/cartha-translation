  yaml_path: translation/ot/exodus/025/039.yaml
  text: He shall make it[a], with all these utensils, from a talent of pure gold.
  footnotes:
  - marker: a
    text: Or 'together with all these vessels/articles.' The Hebrew term can refer broadly to implements or containers associated with the lampstand.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이 모든 기구와 함께 순금 한 달란트로 그것을 만들어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기구’는 여기서 등잔대에 딸린 각종 부속품·용기·도구를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  english_pob_choice: a talent
  chosen_korean: 한 달란트
  alternatives_korean:
  - 달란트 한 개 분량
  - 한 달란트 무게
  lexicon: HALOT
  rationale: 성막 문맥의 표준 중량 단위이므로, 일반적인 한국어 성경 용례에 맞추어 ‘달란트’로 옮기되 수량을 분명히 하기 위해 ‘한’을 붙였습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 정련된 금
  lexicon: HALOT
  rationale: 재료의 순도를 간결하게 드러내는 한국어 관용 표현은 ‘순금’이며, 공예 재료로서의 품질을 자연스럽게 전달합니다.
- source_word: אֹתָהּ
  english_pob_choice: it
  chosen_korean: 그것을
  alternatives_korean:
  - 그것
  - 이를
  lexicon: HALOT
  rationale: 여성 단수 대명사가 앞 문맥의 등잔대를 가리키므로, 한국어에서도 지시를 유지해 번역하되 대상이 분명하도록 목적격 형태를 썼습니다.
- source_word: הַכֵּלִים
  english_pob_choice: utensils
  chosen_korean: 기구
  alternatives_korean:
  - 도구
  - 그릇
  - 기물
  lexicon: HALOT
  rationale: 이 단어는 넓게 ‘도구/기구/그릇류’를 뜻하지만, 등잔대와 함께 딸린 성막 용품의 범위를 가장 무난하게 드러내는 말로 ‘기구’를 선택했습니다.
theological_decisions:
- issue: 명령형 문맥의 시제/양태 처리
  chosen_reading: 미래형처럼 보이지만 규범적 지시를 나타내는 ‘-아/어야 합니다’로 옮겼습니다.
  alternative_readings:
  - 그는 만들 것입니다
  - 그가 만들게 하십시오
  rationale: 히브리어 미완료형은 여기서 서술 미래보다 제작 규정을 제시하는 용법이므로, 현대 한국어에서는 공정한 지시문투가 가장 자연스럽습니다.
  doctrine_reference: 출 25장 성막 규례의 지시문 관용
