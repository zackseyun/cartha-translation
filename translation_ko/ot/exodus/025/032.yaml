translation:
  language: ko
  text: 그리고 그 가지 여섯이 그 옆면들에서 나와야 합니다. 곧 등잔대의 한쪽 옆에서 세 가지가 나오고, 다른 쪽 옆에서 세 가지가 나와야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘등잔대의 다른 쪽 옆에서 세 가지가 나오고.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים
  english_pob_choice: branches
  chosen_korean: 가지
  alternatives_korean:
  - 가지들
  - 팔
  - 팔 모양의 가지
  lexicon: HALOT
  rationale: 등잔대의 구조를 설명하는 문맥이므로 식물의 ‘갈대’보다 뻗어 나온 부재를 가리키는 ‘가지’가 가장 자연스럽고, 영어 POB의 branches와도 잘 대응됩니다.
- source_word: יֹצְאִים
  english_pob_choice: shall come out
  chosen_korean: 나와야 합니다
  alternatives_korean:
  - 나옵니다
  - 뻗어 나와야 합니다
  - 튀어나와야 합니다
  lexicon: HALOT
  rationale: 명령형 제작 지시의 문맥을 살리면서도, 부품이 본체에서 ‘나오는’ 동작을 한국어로 간결하게 전달합니다.
- source_word: מִצִּדֶּיהָ
  english_pob_choice: from its sides
  chosen_korean: 그 옆면들에서
  alternatives_korean:
  - 그 양옆에서
  - 그 측면에서
  - 그 옆에서
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘옆면들’을 살리기 위해 단수 ‘옆’보다 복수 느낌이 나는 ‘옆면들’을 택했습니다.
- source_word: קְנֵי מְנֹרָה
  english_pob_choice: branches of the lampstand
  chosen_korean: 등잔대의 가지
  alternatives_korean:
  - 등잔대의 팔
  - 등잔대의 팔들
  - 등잔대의 줄기
  lexicon: HALOT
  rationale: 구문상 해당 가지들이 등잔대에 속한다는 점을 드러내기 위해 속격을 붙였고, cultic object는 ‘등잔대’로 옮겼습니다.
- source_word: הָאֶחָד / הַשֵּׁנִי
  english_pob_choice: its one side / its other side
  chosen_korean: 한쪽 옆 / 다른 쪽 옆
  alternatives_korean:
  - 한편 / 다른편
  - 한쪽 면 / 다른 쪽 면
  lexicon: HALOT
  rationale: 히브리어의 대조 구조를 한국어에서 자연스럽게 살리면서도, 단순히 ‘한쪽/다른쪽’보다 대상의 측면성을 분명히 하는 표현을 택했습니다.
theological_decisions:
- issue: 등잔대 제작 지시의 문체
  chosen_reading: 설명적 지시문으로 옮기되, 본문의 구조적 대칭을 유지했습니다.
  alternative_readings:
  - 더 의역적인 문장으로 풀어 쓰기
  - 더 직역적으로 ‘나가야 한다’로 고정하기
  rationale: 이 절은 성막 기물의 정밀한 제작 지시이므로, 정보 구조와 대칭을 보존하는 것이 본문 이해에 중요합니다.
  doctrine_reference: 출애굽기 25장 성막 기물 규례
