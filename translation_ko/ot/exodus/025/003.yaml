base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/003.yaml
  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
  footnotes:
  - marker: a
    text: Or 'copper'; the Hebrew נְחֹשֶׁת can refer broadly to copper or bronze, depending on context.
