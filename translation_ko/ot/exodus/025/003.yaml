translation:
  language: ko
  text: 그리고 이것은 너희가 그들에게서 받을 헌물입니다. 곧 금, 은, 청동[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְחֹשֶׁת은 문맥에 따라 구리 또는 청동을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  english_pob_choice: And this is
  chosen_korean: 그리고 이것은
  alternatives_korean:
  - 그리고 이는
  - 이것은
  lexicon: HALOT
  rationale: 지시사 זאת의 제시적 용법을 살리면서, 현대 한국어에서 자연스러운 서두인 '그리고 이것은'으로 옮겼습니다.
- source_word: הַ/תְּרוּמָה
  english_pob_choice: the contribution
  chosen_korean: 기부물
  alternatives_korean:
  - 헌물
  - 봉헌물
  - 기여물
  lexicon: HALOT
  rationale: 문맥이 성막 재료를 백성에게서 거두는 장면이므로, 단순한 제사 용어보다 '기부물'이 자발적 제공의 성격을 비교적 직접적으로 드러냅니다.
- source_word: וּ/נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 청동
  alternatives_korean:
  - 구리
  - 동
  - 놋
  lexicon: HALOT
  rationale: 성막 재료 목록의 관용적 의미를 따라, 가공된 금속 합금으로서의 '청동'을 채택했습니다. Hebrew נְחֹשֶׁת의 넓은 범주를 고려하면 '구리'도 가능하지만, 이 문맥에서는 'bronze'에 대응하는 '청동'이 더 적절합니다.
