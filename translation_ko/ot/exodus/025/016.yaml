translation:
  language: ko
  text: 그리고 너는 내가 네게 줄 그 증거를 궤 안에 넣어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 더 구체적으로는 ‘증거판들’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  english_pob_choice: And you shall put
  chosen_korean: 그리고 너는 ... 넣어야 합니다
  alternatives_korean:
  - 그리고 너는 ... 두어야 합니다
  - 그리고 너는 ... 놓아야 합니다
  lexicon: HALOT
  rationale: נָתַן은 ‘주다/두다/넣다’의 넓은 뜻을 가지며, 여기서는 궤라는 용기 안에 넣는 동작이므로 ‘넣다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: אֶל הָאָרֹן
  english_pob_choice: into the ark
  chosen_korean: 그 증거판을 궤 안에
  alternatives_korean:
  - 그 증거판을 궤 속에
  - 그 증거판을 궤로
  lexicon: HALOT
  rationale: אֶל은 기본적으로 ‘-에게/-로’이지만, נתן과 함께 용기 명사 ‘궤’가 오므로 한국어에서는 ‘안에’로 옮겨 넣는 뜻을 분명히 하는 것이 좋습니다.
- source_word: הָעֵדֻת
  english_pob_choice: the testimony
  chosen_korean: 그 증거판
  alternatives_korean:
  - 그 증거
  - 그 증언
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 עֵדוּת는 단순한 ‘증언’보다 언약의 증거물, 곧 돌판을 가리키는 경우가 많으므로, 주석적 과잉설명 없이도 문맥을 드러내는 ‘증거판’을 택했습니다.
- source_word: אֲשֶׁר אֶתֵּן אֵלֶיךָ
  english_pob_choice: that I will give you
  chosen_korean: 곧 내가 너에게 줄
  alternatives_korean:
  - 내가 너에게 줄
  - 내가 네게 줄
  lexicon: HALOT
  rationale: 관계절을 한국어에서 자연스럽게 풀어 ‘곧’으로 연결해 주었고, אֶתֵּן אֵלֶיךָ의 직접적인 전달 관계를 살려 ‘너에게 줄’로 옮겼습니다.
theological_decisions:
- issue: ‘증거’의 구체성
  chosen_reading: 본문은 ‘그 증거’라고만 두고, 그 실체를 본문 밖에서 미리 단정하지 않았습니다.
  alternative_readings:
  - ‘언약판’으로 명시하기
  - ‘증거판들’로 더 구체화하기
  rationale: 히브리어 본문 자체는 ‘내가 너에게 줄 증거’라고만 말하므로, 영어 POB의 절제된 처리처럼 본문이 직접 말하는 범위를 넘지 않는 것이 적절합니다. 다만 한국어에서는 문맥상 돌판을 떠올리게 하는 표현을 허용해도 본문 외 정보를 과도하게 삽입하지 않도록 주의했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
