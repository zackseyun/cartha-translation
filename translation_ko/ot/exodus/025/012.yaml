base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
  footnotes:
  - marker: a
    text: Or "its four corners" for "its four feet"; the Hebrew term is difficult, but likely refers to the ark's lower supports or footings rather than abstract corner points.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것을 위해 금 고리 네 개를 주조하여 그 네 발에 다십시오. 한쪽에는 고리 두 개를, 다른 쪽에는 고리 두 개를 다십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 모퉁이”로 옮길 수 있습니다. 히브리어 표현은 해석하기 어렵지만, 추상적인 모퉁이보다는 방주의 아래 받침이나 발을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  english_pob_choice: you shall cast
  chosen_korean: 부어 만들어
  alternatives_korean:
  - 주조하여
  - 캐스팅하여
  - 부어
  lexicon: HALOT
  rationale: 금속 공예 문맥에서 יצק은 단순한 ‘붓다’보다 ‘주조하다’의 의미가 강하므로, 한국어에서는 자연스럽게 공정까지 드러내는 ‘부어 만들어’로 옮겼습니다.
- source_word: טַבְּעֹת
  english_pob_choice: rings
  chosen_korean: 고리
  alternatives_korean:
  - 링
  - 반지
  - 고리형 부속
  lexicon: HALOT
  rationale: 성막 기구의 금속 부속품을 가리키므로 일상적이면서도 공예적 뉘앙스를 살리는 ‘고리’가 적절합니다.
- source_word: פַּעֲמֹתָיו
  english_pob_choice: its four feet
  chosen_korean: 그 네 발
  alternatives_korean:
  - 네 모퉁이
  - 네 받침
  - 네 아래 지지대
  lexicon: HALOT
  rationale: 본문의 어려운 어휘를 POB의 해석을 따라 구체적 형태인 ‘발’로 옮겨, 모서리 해석보다 하부 지지 구조라는 감각을 유지했습니다.
- source_word: צַלְעוֹ / הָאֶחָת ... הַשֵּׁנִית
  english_pob_choice: one side of it ... its second side
  chosen_korean: 한쪽에 ... 다른 쪽에
  alternatives_korean:
  - 한 면에 ... 둘째 면에
  - 한편에 ... 다른편에
  lexicon: HALOT
  rationale: 히브리어의 ‘첫째/둘째’ 구분을 한국어에서는 어색한 직역보다 ‘한쪽/다른 쪽’으로 풀어, 양쪽 배치를 분명히 했습니다.
