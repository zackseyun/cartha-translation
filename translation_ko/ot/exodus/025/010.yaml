source:
  edition: WLC
  text: וְ/עָשׂ֥וּ אֲר֖וֹן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
  footnotes:
  - marker: a
    text: Or 'chest' or 'box'; the Hebrew term denotes a container, but 'ark' is retained here because this is the sacred ark of the covenant context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'acacia wood,' traditionally 'shittim wood.'
    reason: lexical_alternative
  - marker: c
    text: A cubit was an ancient unit of length, roughly the distance from the elbow to the fingertips.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 아카시아 나무[a]로 궤를 만들어야 합니다. 길이는 두 규빗 반, 너비는 한 규빗 반[c][b], 높이도 한 규빗 반입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 아카시아 목재를 뜻합니다. 전통적으로는 '시팀 나무'라고도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 전통 번역에서는 '시팀 나무'로 옮기기도 합니다.
    reason: previous_rendering
  - marker: c
    text: 규빗은 고대의 길이 단위로, 대략 팔꿈치에서 손끝까지의 길이입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  english_pob_choice: They shall make
  chosen_korean: 만들어야 합니다
  alternatives_korean:
  - 만들 것입니다
  - 만드십시오
  lexicon: HALOT
  rationale: 지시문맥의 완료되지 않은 동사를 한국어에서는 자연스러운 규범적 요구로 옮기는 것이 적절하며, 합쇼체로 공적 지침의 어조를 살렸습니다.
- source_word: אֲרוֹן
  english_pob_choice: ark
  chosen_korean: 궤
  alternatives_korean:
  - 상자
  - 함
  lexicon: HALOT
  rationale: 이 문맥의 אֲרוֹן은 단순한 용기라기보다 성막의 거룩한 언약궤를 가리키므로, 한국어 성서 전통에서 통용되는 '궤'를 택했습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로
  alternatives_korean:
  - 시팀 나무로
  - 아카시아 재목으로
  lexicon: HALOT
  rationale: 히브리어는 아카시아 계열 목재를 뜻하며, 현대 독자에게는 '아카시아 나무'가 가장 투명합니다. 전통 음역인 '시팀'은 본문 이해를 덜 돕기 때문에 본문에는 두지 않았습니다.
- source_word: אַמָּתַיִם וָחֵצִי / וְאַמָּה וָחֵצִי
  english_pob_choice: two and a half cubits / a cubit and a half
  chosen_korean: 두 규빗 반 / 한 규빗 반
  alternatives_korean:
  - 두 규빗과 반 / 한 규빗과 반
  - 두 규빗 반과 한 규빗 반
  lexicon: HALOT
  rationale: 히브리어의 반 단위 측정법을 그대로 살리면서, 성경적 도량형인 '규빗'을 유지해 원문의 문화적 거리를 보존했습니다.
