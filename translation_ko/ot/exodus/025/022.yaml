base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'atonement cover.' The Hebrew term refers to the gold cover of the ark; traditionally, 'mercy seat.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for the Israelites' or 'to the sons of Israel.' The Hebrew is literally 'to/for the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 거기서 내가 너와 만나고, 속죄소[a] 위에서, 곧 증거궤 위에 있는 두 그룹 사이에서 너와 말하겠습니다. 내가 이스라엘 자손[b]을 위하여 네게 명령할 모든 것에 관하여 말하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속죄소’는 히브리어 כַּפֹּרֶת의 제의적 표준 번역입니다. 이 말은 문자적으로 ‘덮개’를 뜻하며, ‘속죄 덮개’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다. ‘이스라엘 자손’ 또는 ‘이스라엘 사람들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ
  english_pob_choice: I will meet with you
  chosen_korean: 내가 너와 만나고
  alternatives_korean:
  - 내가 너와 회합하고
  - 내가 너와 만날 것입니다
  lexicon: HALOT
  rationale: נעד의 회중적·지정된 만남 의미를 살려, 단순한 방문보다 ‘너와 만나고’로 자연스럽게 옮겼습니다.
- source_word: הַכַּפֹּרֶת
  english_pob_choice: mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 은혜의 자리
  - 속죄 덮개
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미는 ‘덮개’이지만, 제의적 대상의 기능을 드러내는 표준 번역으로 ‘속죄소’를 택했습니다. 영문 POB의 ‘mercy seat’에 대응하면서도 한국어에서 오해를 줄입니다.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  english_pob_choice: from between the two cherubim
  chosen_korean: 두 그룹 사이에서
  alternatives_korean:
  - 두 그룹들 사이에서
  - 두 케루빔 사이에서
  lexicon: HALOT
  rationale: כְּרֻבִים는 성경적 고유 명칭을 위해 음역보다 익숙한 교회·성경 용례인 ‘그룹’으로 옮겼습니다. 복수형과 쌍수적 표현은 ‘두’로 충분히 드러냅니다.
- source_word: הָעֵדֻת
  english_pob_choice: the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증거
  - 증거판
  lexicon: HALOT
  rationale: 문맥상 증거의 보관 장소인 궤를 가리키므로, 한국어 독자가 바로 식별할 수 있도록 ‘증거궤’로 옮겼습니다. 뒤의 ‘위에 있습니다’는 이 궤를 지칭하는 문맥 보충입니다.
theological_decisions:
- issue: 하나님이 계시를 주시는 위치의 표현
  chosen_reading: 속죄소 위, 곧 두 그룹 사이에서
  alternative_readings:
  - 증거궤 위에서
  - 언약궤 위에서
  rationale: 본문은 하나님이 단순히 궤 ‘위에서’가 아니라, 두 그룹 사이의 속죄소 위라는 특정 제의 공간에서 말씀하신다는 점을 강조합니다. 그 공간성과 거룩성을 살리기 위해 위치를 분해해 표현했습니다.
  doctrine_reference: 출애굽기 25장 성막 계시 본문
