  to: 그때 모세는 손에 증언의 두 판을 들고 돌이켜 산에서 내려왔습니다. 그 판들은 양쪽 면에 글이 적혀 있었으며, 이쪽과 저쪽에[a] 모두 적혀 있었습니다.
