  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֜פֶן וַ/יֵּ֤רֶד מֹשֶׁה֙ מִן הָ/הָ֔ר וּ/שְׁנֵ֛י לֻחֹ֥ת הָ/עֵדֻ֖ת בְּ/יָד֑/וֹ לֻחֹ֗ת כְּתֻבִים֙ מִ/שְּׁנֵ֣י עֶבְרֵי/הֶ֔ם מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה הֵ֥ם כְּתֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
  footnotes:
  - marker: a
    text: Or 'on one side and on the other.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세는 돌이켜 산에서 내려왔습니다[a]. 손에는 증언의 두 돌판이 있었는데, 그 돌판에는 양쪽 면에 글이 적혀 있었습니다. 이쪽에도 저쪽에도 글이 적혀 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한쪽 면과 다른 쪽 면에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  english_pob_choice: turned
  chosen_korean: 돌이켜
  alternatives_korean:
  - 돌아서
  - 몸을 돌려
  lexicon: HALOT
  rationale: ‘돌이켜’는 방향을 바꾸는 동작을 자연스럽게 살리면서, 내려가기 직전의 전환을 간결하게 드러냅니다.
- source_word: וַיֵּרֶד מֹשֶׁה מִן הָהָר
  english_pob_choice: went down from the mountain
  chosen_korean: 산에서 내려왔습니다
  alternatives_korean:
  - 산을 내려갔습니다
  - 산에서 내려왔습니다
  lexicon: HALOT
  rationale: ירד는 ‘내려오다/내려가다’의 뜻이므로, 현재 문맥에서는 서술 자연성이 높은 ‘내려왔습니다’를 택했습니다.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  english_pob_choice: the two tablets of the testimony
  chosen_korean: 증언의 두 돌판
  alternatives_korean:
  - 증언의 두 판
  - 증거의 두 돌판
  lexicon: HALOT
  rationale: לֻחֹת은 ‘돌판’이 자연스럽고, עֵדוּת는 POB의 ‘testimony’를 따라 ‘증언’으로 옮겨 언약 판의 명칭을 보존했습니다.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם מִזֶּה וּמִזֶּה
  english_pob_choice: written on both their sides; on this side and on that
  chosen_korean: 양쪽 면에 글이 적혀 있었습니다… 이쪽에도 저쪽에도 글이 적혀 있었습니다
  alternatives_korean:
  - 양면에 적혀 있었습니다
  - 한쪽에도 다른 쪽에도 적혀 있었습니다
  lexicon: HALOT
  rationale: 중복 표현을 한국어에서도 살려, 두 면 모두에 기록되었다는 점과 반복적 강조를 함께 드러냈습니다.
theological_decisions:
- issue: עֵדוּת의 의미를 ‘증언’으로 유지할지 ‘증거/언약문서’로 풀지
  chosen_reading: 증언
  alternative_readings:
  - 증거
  - 언약문서
  rationale: 이 절은 돌판의 관습적 명칭을 사용하므로, 의미를 넓히기보다 ‘증언’으로 유지해 성경 본문의 용어와 신학적 울림을 보존했습니다.
  doctrine_reference: 언약 표지로서의 돌판 명칭
