  source_fidelity: ‘돌판’은 이 절에 명시되지 않은 재질(돌)을 보태므로 ‘판’으로 고치는 것이 안전합니다. 또한 원문의 ‘손에’와 양면에 기록되었다는 반복적 강조를 유지해야 합니다.
  naturalness: ‘손에 … 들고’와 ‘양쪽 면, 곧 이쪽과 저쪽’은 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 병렬과 강조도 비교적 잘 보존합니다.
  terminology: עֵדוּת는 해석을 좁히지 않고 ‘증언’으로 유지하되, לֻחֹת에 재질을 덧붙이지 않아 ‘증언의 두 판’으로 옮깁니다.
  issues:
