    rationale: לֻחֹת는 ‘판/tablets’이며, 이 절 자체에는 돌이라는 재질이 언급되지 않습니다. 가까운 문맥의 정보를 본문에 미리 삽입하지 않는 편이 최적 등가 원칙에 맞습니다.
  - severity: low
    issue: 각주 표지가 ‘산에서 내려왔습니다’ 뒤에 놓여 있으나 각주 내용은 양면 기록 표현의 대안입니다.
    rationale: 각주 표지는 대안이 적용되는 ‘이쪽과 저쪽’ 표현에 붙여야 독자가 그 범위를 정확히 알 수 있습니다.
