base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
  footnotes:
  - marker: a
    text: Or 'rose up to play.' The Hebrew verb can mean 'play,' 'celebrate,' or 'engage in revelry'; here the context suggests disorderly festivity rather than innocent amusement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이튿날 아침 일찍 일어나 번제물을 드리고 화목제물을 바쳤습니다. 그러고 나서 백성은 앉아서 먹고 마셨고[a], 일어나서 난잡하게 즐겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놀러 일어났다.’ 히브리어 동사는 ‘놀다’, ‘기뻐하다’, ‘난잡하게 즐기다’의 뜻을 가질 수 있으며, 여기서는 무해한 놀이보다 질서 없는 향락의 의미가 문맥상 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  english_pob_choice: rose early the next day
  chosen_korean: 이튿날 아침 일찍 일어나
  alternatives_korean:
  - 다음 날 아침 일찍 일어나
  - 이튿날 일찍 일어나
  lexicon: HALOT
  rationale: ‘일찍 일어나’는 שׁכם의 시간 강조를 자연스럽게 살리고, ‘이튿날 아침’이 מִמָּחֳרָת의 다음 날 의미를 분명히 드러냅니다.
- source_word: וַיַּעֲלוּ עֹלֹת
  english_pob_choice: offered burnt offerings
  chosen_korean: 번제물을 드리고
  alternatives_korean:
  - 번제물을 바치고
  - 번제사를 드리고
  lexicon: HALOT
  rationale: עֹלָה는 제물 자체보다 제의 행위를 포함하므로 ‘번제물을 드리고’가 간결하면서도 제사적 의미를 유지합니다.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  english_pob_choice: brought peace offerings
  chosen_korean: 화목제물을 바쳤습니다
  alternatives_korean:
  - 화목제사를 드렸습니다
  - 화목제를 바쳤습니다
  lexicon: HALOT
  rationale: שְׁלָמִים의 표준 제의 용어를 살리되, ‘바쳤습니다’로 제물을 제단에 올린 행위를 분명하게 표현했습니다.
- source_word: וַיָּקֻמוּ לְצַחֵק
  english_pob_choice: rose up to revel
  chosen_korean: 일어나서 난잡하게 즐겼습니다
  alternatives_korean:
  - 일어나서 놀았습니다
  - 일어나서 흥겹게 즐겼습니다
  - 일어나서 떠들썩하게 놀았습니다
  lexicon: HALOT
  rationale: צחק는 문맥상 단순한 놀이보다 우상 숭배와 연결된 무질서한 축제의 뉘앙스를 띠므로, POB의 ‘revel’에 맞춰 부정적 함의를 드러냈습니다.
theological_decisions:
- issue: לְצַחֵק의 뉘앙스
  chosen_reading: ‘난잡하게 즐겼습니다’로 옮겨, 무해한 놀이가 아니라 우상 앞의 방종한 축제를 드러냈습니다.
  alternative_readings:
  - ‘놀았습니다’
  - ‘즐거워했습니다’
  - ‘흥겹게 놀았습니다’
  rationale: 금송아지 사건의 제의적 식사와 곧이어 이어지는 심판 문맥을 고려하면, 본 동사는 단순 오락보다 도덕적으로 문제적인 흥청거림을 가리킨다고 보는 것이 타당합니다.
  doctrine_reference: Translation philosophy §3, §6
