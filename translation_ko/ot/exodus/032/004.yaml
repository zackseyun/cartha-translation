revisions:
- from: 그가 그들의 손에서 그것을 가져다가 조각칼로 새기고, 그것을 부어 만든 송아지로 만들었습니다. 그러자 그들이 말했습니다. "이스라엘아, 너를 이집트 땅에서 올라오게 한 너의 신들은 바로 이것들이다."[a][b][c]
  to: 그는 그들의 손에서 그것을 받아 조각 도구로 그것을 빚어 주조한 송아지를 만들었습니다. 그러자 그들이 말했습니다. “이스라엘아, 너를 이집트 땅에서 올라오게 한 너의 신들은 바로 이것들이다.”[a][b][c]
  rationale: 수정은 도구 명칭의 불확실성을 본문과 주석에서 일관되게 보존하고, 제작 동사의 의미를 ‘새기다’보다 넓은 ‘빚다’로 조정한 것입니다. 복수형 신들 및 이것들, 복수 발화자, 그리고 출애굽의 ‘올라오게 하다’는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:50Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 연속 동사(‘받다/취하다–도구로 빚다–주조한 송아지를 만들다’), 우상 선언의 복수형, ‘이집트 땅에서 올라오게 하다’를 대체로 충실히 반영했습니다. 다만 본문의 ‘조각칼로 새기고’는 חֶרֶט의 불확실한 도구 의미를 지나치게 특정하고, ‘새기다’는 송아지 형상을 만드는 행위를 다소 협소하게 만듭니다.
  naturalness: ‘그들의 손에서 그것을 받아’와 ‘조각 도구로 그것을 빚어’가 현대 표준 한국어 서사에서 자연스럽습니다. ‘주조한 송아지로 만들었습니다’는 원문의 결과 표현을 보존하면서도 ‘부어 만든’보다 간결합니다.
  terminology: עֵגֶל מַסֵּכָה는 ‘주조한 송아지’로, חֶרֶט는 의미를 확정하지 않는 ‘조각 도구’로 옮기는 것이 안전합니다. אֱלֹהֶיךָ와 אֵלֶּה의 복수는 ‘너의 신들은 바로 이것들이다’로 유지해야 합니다.
  issues:
