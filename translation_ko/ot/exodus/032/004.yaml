base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
  footnotes:
  - marker: a
    text: Or 'with an engraving tool,' 'with a stylus,' or 'with a chisel'; the exact sense of the Hebrew term is debated.
    reason: lexical_alternative
  - marker: b
    text: Some textual traditions read 'he said' instead of 'they said.'
    reason: textual_variant
  - marker: c
    text: 'Hebrew: ''These are your gods''; traditionally often rendered ''This is your god,'' likely influenced by the single calf image.'
    reason: alternative_reading
  - marker: d
    text: Or 'formed it with a graving tool, and made it into a cast calf'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그들의 손에서 그것을 가져다가 조각칼로 새기고, 그것을 부어 만든 송아지로 만들었습니다. 그러자 그들이 말했습니다. "이스라엘아, 너를 이집트 땅에서 올라오게 한 너의 신들은 바로 이것들이다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조각칼’은 히브리어 חֶרֶט의 정확한 기구를 단정하지 않고, 새기거나 조각하는 도구라는 넓은 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 본문 전승은 ‘그가 말했다’로 읽습니다.
    reason: textual_variant
  - marker: c
    text: 히브리어는 문자적으로 ‘너의 신들’이라고 되어 있습니다. 전통적으로는 단일 송아지 형상에 맞추어 ‘너의 신’으로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  english_pob_choice: he took it from their hands
  chosen_korean: 그들의 손에서 그것을 가져다가
  alternatives_korean:
  - 그들의 손에서 그것을 받았고
  - 그들의 손에서 그것을 취하여
  lexicon: HALOT
  rationale: לקח의 기본 의미를 살리되, 앞 문맥의 금붙이를 실제로 넘겨받아 처리하는 동작이 드러나도록 자연스럽게 옮겼습니다.
- source_word: בַּחֶרֶט
  english_pob_choice: with a graving tool
  chosen_korean: 조각칼로
  alternatives_korean:
  - 조각도구로
  - 새김칼로
  - 끌로
  lexicon: HALOT
  rationale: 정확한 도구의 세부는 논쟁적이므로, 새기거나 파는 데 쓰는 도구라는 기능을 살리면서도 한국어에서 자연스러운 표현을 택했습니다.
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  english_pob_choice: made it into a cast calf
  chosen_korean: 그것을 부어 만든 송아지로 만들었습니다
  alternatives_korean:
  - 그것을 주조한 송아지로 만들었습니다
  - 그것을 부어 만든 송아지 형상으로 만들었습니다
  lexicon: HALOT
  rationale: מַסֵּכָה의 핵심인 주조/부어 만듦을 살리면서, עֵגֶל을 ‘송아지’로 옮겨 우상 형상의 구체성을 유지했습니다.
- source_word: אֵלֶּה אֱלֹהֶיךָ יִשְׂרָאֵל
  english_pob_choice: These are your gods, Israel
  chosen_korean: 이스라엘아, 너의 신들은 바로 이것들이다
  alternatives_korean:
  - 이스라엘아, 이것들은 너의 신들이다
  - 이스라엘아, 네 신들은 바로 이것들이다
  lexicon: HALOT
  rationale: 히브리어의 복수형 ‘이것들’과 ‘신들’을 그대로 반영해, 전통적으로 단수처럼 순화하는 경향을 따르지 않았습니다. 직접 호칭은 문두로 옮겨 경고의 어조를 살렸습니다.
theological_decisions:
- issue: ‘신들’의 복수형 유지
  chosen_reading: 본문의 복수형을 그대로 살려 ‘너의 신들은 바로 이것들이다’로 번역했습니다.
  alternative_readings:
  - ‘너의 신은 바로 이것이다’
  - ‘이것이 너의 신이다’
  rationale: 히브리어의 형태와 POB의 본문 결정을 따라 복수형을 유지했습니다. 단일 송아지 형상 때문에 전통 번역이 단수로 완화하더라도, 여기서는 본문이 말하는 우상 숭배의 언어를 그대로 드러내는 편이 소스 충실성에 더 부합합니다.
  doctrine_reference: 번역 원칙 §1, §3
