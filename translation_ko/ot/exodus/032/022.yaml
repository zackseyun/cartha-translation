  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
  footnotes:
  - marker: a
    text: Or “they are bent on evil” or “they are prone to evil.” The Hebrew expression is idiomatic and describes the people as characterized by evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론이 말했습니다. “내 주여, 노여워하지 마십시오. 당신은 그 백성이 악에 기울어져 있음을 아십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “악으로 향해 있다” 또는 “악에 치우쳐 있다.” 히브리어 표현은 관용적이며, 그 백성이 악한 성향을 지니고 있음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  english_pob_choice: And Aaron said
  chosen_korean: 아론이 말했습니다
