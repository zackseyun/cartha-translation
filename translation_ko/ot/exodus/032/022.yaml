- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 나의 주인
  - 주인님
  - 선생님
  lexicon: HALOT
  rationale: 대상이 모세인 인간 호칭이므로, 신적 호칭의 ‘주’와 구별되도록 낮춤말 없이 경칭적 인간 주소로 옮겼습니다.
- source_word: בְרָע הוּא
  english_pob_choice: they are set on evil
  chosen_korean: 악에 치우쳐 있습니다
  alternatives_korean:
  - 악을 향해 기울어져 있습니다
  - 악에 기울어져 있습니다
  - 악에 빠져 있습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현이 가리키는 지속적 성향을 살리되, ‘악에’라는 전치사적 관계를 한국어로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 아론의 아들 사칭이 아닌 모세에 대한 인간 주소의 톤
  chosen_reading: ‘내 주님’으로 번역해 존대는 유지하되, 주님의 신적 칭호와 혼동되지 않게 했습니다.
  alternative_readings:
  - 주님
  - 내 주인
  - 선생님
  rationale: 본문의 אֲדֹנִי는 모세에게 하는 예의 바른 호칭이므로, 한국어에서도 경칭을 유지하면서도 하나님을 가리키는 ‘주님’과 문맥상 구별해야 합니다.
  doctrine_reference: 'DOCTRINE.md: 인간 주소와 신적 칭호 구분 원칙'
