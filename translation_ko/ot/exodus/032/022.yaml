language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַהֲרֹ֔ן אַל יִ֥חַר אַ֖ף אֲדֹנִ֑/י אַתָּה֙ יָדַ֣עְתָּ אֶת הָ/עָ֔ם כִּ֥י בְ/רָ֖ע הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
  footnotes:
  - marker: a
    text: Or “they are bent on evil” or “they are prone to evil.” The Hebrew expression is idiomatic and describes the people as characterized by evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론이 말했습니다. “내 주님의 분노가 타오르지 마십시오. 당신은 그 백성을 아시지 않습니까? 그들은 악에 치우쳐 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “악에 치우쳐 있다” 혹은 “악에 기울어져 있다.” 히브리어 표현은 관용적이며, 백성이 악을 특징으로 지닌다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  english_pob_choice: And Aaron said
  chosen_korean: 아론이 말했습니다
  alternatives_korean:
  - 그리고 아론이 말했습니다
  - 그때 아론이 말했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 연결을 자연스러운 한국어 문장으로 옮기되, 과도한 해석 없이 발화 전환만 분명히 했습니다.
- source_word: אַל יִחַר אַף
  english_pob_choice: Do not let ... anger burn hot
  chosen_korean: 분노가 타오르지 마십시오
  alternatives_korean:
  - 노여워하지 마십시오
  - 진노가 타지 않게 하십시오
  lexicon: HALOT
  rationale: 직역의 불을 붙인 분노 이미지를 살리면서도 한국어에서 자연스러운 금지 표현으로 다듬었습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 나의 주인
  - 주인님
  - 선생님
  lexicon: HALOT
  rationale: 대상이 모세인 인간 호칭이므로, 신적 호칭의 ‘주’와 구별되도록 낮춤말 없이 경칭적 인간 주소로 옮겼습니다.
- source_word: בְרָע הוּא
  english_pob_choice: they are set on evil
  chosen_korean: 악에 치우쳐 있습니다
  alternatives_korean:
  - 악을 향해 기울어져 있습니다
  - 악에 기울어져 있습니다
  - 악에 빠져 있습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현이 가리키는 지속적 성향을 살리되, ‘악에’라는 전치사적 관계를 한국어로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 아론의 아들 사칭이 아닌 모세에 대한 인간 주소의 톤
  chosen_reading: ‘내 주님’으로 번역해 존대는 유지하되, 주님의 신적 칭호와 혼동되지 않게 했습니다.
  alternative_readings:
  - 주님
  - 내 주인
  - 선생님
  rationale: 본문의 אֲדֹנִי는 모세에게 하는 예의 바른 호칭이므로, 한국어에서도 경칭을 유지하면서도 하나님을 가리키는 ‘주님’과 문맥상 구별해야 합니다.
  doctrine_reference: 'DOCTRINE.md: 인간 주소와 신적 칭호 구분 원칙'
