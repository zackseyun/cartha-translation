  text: לָ/מָּה֩ יֹאמְר֨וּ מִצְרַ֜יִם לֵ/אמֹ֗ר בְּ/רָעָ֤ה הֽוֹצִיאָ/ם֙ לַ/הֲרֹ֤ג אֹתָ/ם֙ בֶּֽ/הָרִ֔ים וּ֨/לְ/כַלֹּתָ֔/ם מֵ/עַ֖ל פְּנֵ֣י הָֽ/אֲדָמָ֑ה שׁ֚וּב מֵ/חֲר֣וֹן אַפֶּ֔/ךָ וְ/הִנָּחֵ֥ם עַל הָ/רָעָ֖ה לְ/עַמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
  footnotes:
  - marker: a
    text: Or 'for evil' / 'with harmful intent' for 'with evil intent.' The Hebrew phrase בְּרָעָה expresses the motive the Egyptians would attribute to God.
    reason: lexical_alternative
  - marker: b
    text: Or 'and to consume them' for 'and to wipe them off.' The Hebrew verb conveys complete destruction.
    reason: lexical_alternative
  - marker: c
    text: Or 'and relent concerning the disaster' / 'and change your mind about the calamity.' The Hebrew uses anthropopathic language in Moses' plea.
    reason: alternative_reading
translation:
  language: ko
  text: 어찌하여 이집트 사람들이 ‘그가 악한 의도로[a] 그들을 이끌어 내어 산들에서 죽이고 땅 위에서 완전히 없애 버리려고[b] 하였다’라고 말하겠습니까? 주님의 타오르는 분노를 거두시고, 주님의 백성에게 내리려 하신 재앙에 대해 뜻을 돌이키소서.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악한 의도’는 히브리어 בְּרָעָה가 나타내는 목적 또는 동기의 뉘앙스를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘완전히 없애 버리다’는 히브리어 동사가 나타내는 완전한 소멸의 뜻을 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘뜻을 돌이키소서’는 여기서의 נחם을 회개가 아니라, 내리려는 재앙을 거두어 달라는 중보의 요청으로 이해한 번역입니다.
    reason: theological_note
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ
  english_pob_choice: Why should ... say
  chosen_korean: 어찌하여 ... 말하기를 ... 하겠습니까
  alternatives_korean:
  - 왜 ... 말합니까
  - 왜 ... 하겠습니까
  lexicon: HALOT
  rationale: 히브리어 수사 의문과 가정적 발화를 한국어에서 자연스럽게 살리기 위해 ‘어찌하여’와 반문형을 사용했습니다.
- source_word: בְּרָעָה
  english_pob_choice: with evil intent
  chosen_korean: 악한 의도로
  alternatives_korean:
  - 악으로
  - 해를 끼치려는 뜻으로
  - 악한 목적을 가지고
  lexicon: HALOT
  rationale: 이집트인들이 하나님께 돌릴 ‘의도/목적’의 뉘앙스를 살리면서, 단순한 결과가 아니라 의도적 악의를 드러내기 위해 ‘악한 의도’로 옮겼습니다.
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  english_pob_choice: and to wipe them off the face of the earth
  chosen_korean: 지면에서 완전히 없애 버리려 했다
  alternatives_korean:
  - 땅 위에서 없애 버리려 했다
  - 지면에서 쓸어 없애려 했다
  - 땅의 얼굴에서 지워 버리려 했다
  lexicon: HALOT
  rationale: כלה의 완전한 소멸 의미와 관용구를 함께 살리기 위해, 자연스러운 현대 한국어로 ‘완전히 없애 버리다’라고 옮겼습니다.
- source_word: מֵחֲרוֹן אַפֶּךָ
  english_pob_choice: your burning anger
  chosen_korean: 주님의 타오르는 분노
  alternatives_korean:
  - 주님의 불타는 분노
  - 주님의 뜨거운 진노
  - 주님의 타는 노여움
  lexicon: HALOT
  rationale: 직역보다도 분노의 불타는 은유를 살리면서, 한국어에서 자연스럽고 강한 표현인 ‘타오르는 분노’를 선택했습니다.
- source_word: וְהִנָּחֵם עַל הָרָעָה
  english_pob_choice: relent concerning the harm intended
  chosen_korean: 재앙에 대해 뜻을 돌이키소서
  alternatives_korean:
  - 재앙을 거두소서
  - 재앙을 거두어 주십시오
  - 재앙에 대해 돌이키소서
  lexicon: HALOT
  rationale: הנחם은 여기서 신적 후회라기보다 중재적 요청 속 ‘뜻을 돌이키다/돌이키시다’의 의미가 적절하므로, ‘재앙’과 결합해 완곡하게 옮겼습니다.
theological_decisions:
- issue: וְהִנָּחֵם의 신학적 뉘앙스
  chosen_reading: ‘뜻을 돌이키소서’로 옮겨, 하나님이 도덕적으로 오류를 범했다는 뜻의 ‘회개하다/뉘우치다’는 피했습니다.
  alternative_readings:
  - 뉘우치소서
  - 돌이키소서
  - 뜻을 바꾸소서
  rationale: 중보 기도에서의 인간적 표현을 살리되, 하나님에 대한 오해를 피하기 위해 ‘relent’ 계열의 의미를 한국어의 청원형으로 표현했습니다.
  doctrine_reference: Translation philosophy §3
- issue: הָרָעָה의 의미
  chosen_reading: ‘재앙’으로 번역해 하나님께 도덕적 악을 돌리는 오해를 피했습니다.
  alternative_readings:
  - 악
  - 해
  - 재난
  rationale: 앞절의 ‘악한 의도’와 어근이 같지만, 여기서는 심판의 결과를 가리키므로 ‘재앙’이 문맥상 가장 안전하고 자연스럽습니다.
  doctrine_reference: Affirmations; Translation philosophy §1, §3
