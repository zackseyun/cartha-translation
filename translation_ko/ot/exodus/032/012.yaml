  to: 어찌하여 이집트 사람들이 ‘그가 악한 의도로[a] 그들을 이끌어 내어 산들에서 죽이고 땅 위에서 완전히 없애 버리려고[b] 하였다’라고 말하겠습니까? 주님의 타오르는 분노를 거두시고, 주님의 백성에게 내리려 하신 재앙에 대해 뜻을 돌이키소서.[c]
  rationale: 수정은 의미를 바꾸지 않고 한국어의 자연스러운 인용 구조와 ‘분노에서 돌이키다’라는 히브리어 표현의 문맥상 의미를 더 명확히 했습니다. ‘뜻을 돌이키소서’는 본문의 간구와 인간적 표현을 보존하며, 각주에서는 이를 설명할 뿐 특정 교리로 본문을 제한하지 않습니다. 각주 앵커와 c 각주의 언어 오류도 함께 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
