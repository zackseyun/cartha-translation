base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/017.yaml
  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
  footnotes:
  - marker: a
    text: Or 'in the uproar' / 'as it shouted.' The Hebrew expression refers to the people's loud cry or noisy shouting.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호수아가 백성의 외침 소리를 들었는데, 그가 모세에게 말했습니다. “진영 안에서 전쟁의 소리가 들립니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소란 속에서’ / ‘외치고 있는 대로’. 이 히브리어 표현은 백성의 큰 외침이나 소란스러운 외침을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ
  english_pob_choice: Joshua
  chosen_korean: 여호수아
  alternatives_korean:
  - 호세아
  lexicon: 고유명사 표기 관례
  rationale: 문맥상 이스라엘의 여호수아이며, 한국어 성경에서 널리 정착한 고유명사 형태를 따랐습니다.
- source_word: ק֥וֹל הָעָ֖ם בְּרֵעֹה
  english_pob_choice: the sound of the people as they shouted
  chosen_korean: 백성의 외침 소리
  alternatives_korean:
  - 백성의 소리
  - 백성의 떠드는 소리
  - 백성이 외치는 소리
  lexicon: HALOT
  rationale: קוֹל은 단순한 '소리'일 수 있지만, כאן에서는 ხალხ의 소란스러운 외침을 가리키므로 '외침 소리'가 의미를 더 분명히 드러냅니다.
- source_word: וַיֹּאמֶר אֶל מֹשֶׁה
  english_pob_choice: he said to Moses
  chosen_korean: 그가 모세에게 말했습니다
  alternatives_korean:
  - 모세에게 말했습니다
  - 그가 모세에게 이르렀습니다
  lexicon: 서사적 대화 공식
  rationale: 서사 속 발화 공식은 한국어에서 자연스러운 과거 서술로 옮기되, 뒤따르는 직접 화법을 분명히 하도록 했습니다.
- source_word: קוֹל מִלְחָמָה
  english_pob_choice: the sound of war
  chosen_korean: 전쟁의 소리
  alternatives_korean:
  - 전투의 소리
  - 전쟁 소리
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리면서도 한국어에서 자연스럽게 읽히도록 '전쟁의 소리'로 옮겼습니다.
- source_word: בַּמַּחֲנֶה
  english_pob_choice: in the camp
  chosen_korean: 진영 안
  alternatives_korean:
  - 진영에
  - 캠프 안
  lexicon: HALOT
  rationale: 이스라엘의 야영지를 가리키는 표현이므로 '진영'이 적절하며, '안'을 더해 군중 소동이 일어난 내부 공간을 분명히 했습니다.
theological_decisions:
- issue: 백성의 소리를 '외침'으로 옮길지, 단순한 '소리'로 남길지
  chosen_reading: 백성의 외침 소리
  alternative_readings:
  - 백성의 소리
  - 백성이 떠드는 소리
  rationale: 본문은 단순 음향보다 집단적 소란과 외침을 강조하므로, 전쟁 소리와의 대비가 살아나도록 '외침 소리'를 택했습니다.
  doctrine_reference: 문맥 주해
