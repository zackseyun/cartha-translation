translation:
  language: ko
  text: 그러자 온 백성이 귀에 있던 금고리[b]를 빼내어[a] 아론에게 가져왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “떼어 내어” 또는 “벗겨 내어.” 히브리어 동사는 힘주어 제거하는 뜻을 나타낼 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “금 귀고리.” 히브리어 단어는 이 문맥에서 귀 장신구를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  english_pob_choice: took off
  chosen_korean: 빼어 내어
  alternatives_korean:
  - 벗어
  - 떼어 내어
  - 풀어 내어
  lexicon: HALOT
  rationale: 히트파엘형은 자기 몸에서 장신구를 제거하는 뜻이므로, 자연스러운 현대 한국어로는 ‘빼어 내어’가 원문의 능동적·반사적 뉘앙스를 잘 살립니다.
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 온 백성이
  alternatives_korean:
  - 모든 백성이
  - 온 민족이
  - 모든 사람들이
  lexicon: HALOT
  rationale: 집단 전체를 가리키는 표현이므로 ‘온 백성’이 가장 간결하고 본문 상황에 맞는 공동체적 의미를 드러냅니다.
- source_word: נִזְמֵי הַזָּהָב
  english_pob_choice: the gold rings
  chosen_korean: 금고리를
  alternatives_korean:
  - 금 귀고리를
  - 금장식을
  - 금환을
  lexicon: HALOT
  rationale: נֶזֶם은 문맥상 귀에 낀 장신구를 가리키므로, 뒤의 ‘귀에 있던’과 함께 읽힐 때 ‘금고리’가 어휘 폭을 유지하면서도 자연스럽습니다.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  english_pob_choice: that were in their ears
  chosen_korean: 귀에 있던
  alternatives_korean:
  - 귀에 달린
  - 귀에 꽂혀 있던
  - 귀에 낀
  lexicon: HALOT
  rationale: 장신구의 위치를 설명하는 관계절로서, 한국어에서는 ‘귀에 있던’이 가장 자연스럽고 원문의 위치 정보를 직접 반영합니다.
