  yaml_path: translation/ot/exodus/032/035.yaml
  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
  footnotes:
  - marker: a
    text: Or, 'Then the LORD struck the people because of what they had done with the calf that Aaron made.' The Hebrew verb can be rendered more generally as 'struck' or 'plagued.'
