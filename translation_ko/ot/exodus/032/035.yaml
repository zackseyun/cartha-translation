translation:
  language: ko
  text: 야훼께서 그들이 아론이 만든 송아지를 만들었으므로 백성을 치셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 여호와의 이름인 테트라그람마톤을 제목화하지 않고 고유명사로 옮기기 위해, POB 기본 원칙에 따라 야훼를 사용했습니다.
- source_word: וַיִּגֹּף
  english_pob_choice: struck the people
  chosen_korean: 백성을 치셨습니다
  alternatives_korean:
  - 백성을 치셨습니다
  - 백성에게 재앙을 내리셨습니다
  - 백성을 벌하셨습니다
  lexicon: HALOT
  rationale: 동사는 기본적으로 ‘치다/때리다’의 뜻을 살리되, 결과를 특정하지 않고 하나님의 징벌 행위를 간결하게 드러내기 위해 ‘치셨습니다’로 옮겼습니다.
- source_word: עָשׂוּ ... אֶת הָעֵגֶל
  english_pob_choice: because they made the calf
  chosen_korean: 그들이 ... 송아지를 만들었으므로
  alternatives_korean:
  - 그들이 ... 송아지를 만들었으므로
  - 그들이 ... 송아지를 지었으므로
  - 그들이 ... 송아지를 행했으므로
  lexicon: HALOT
  rationale: 직역상 ‘송아지를 만들었다’가 가장 자연스럽고, 뒤의 ‘아론이 만든’과 병렬 관계를 유지합니다.
- source_word: אַהֲרֹן
  english_pob_choice: Aaron
  chosen_korean: 아론
  alternatives_korean:
  - 아론
  lexicon: 표준 성서 고유명사
  rationale: 기존에 널리 정착된 성서 인명 표기를 따랐습니다.
theological_decisions:
- issue: נָגַף의 결과를 ‘재앙’으로 명시할지 여부
  chosen_reading: 본문은 야훼의 심판 행위를 말하지만, 히브리어 동사 자체가 반드시 ‘전염병’이라는 명사를 요구하지는 않으므로, 결과를 특정하지 않고 ‘치셨습니다’로 유지했습니다.
  alternative_readings:
  - 백성에게 재앙을 내리셨습니다
  - 백성에게 전염병을 내리셨습니다
  rationale: 영어 POB의 ‘with a plague’는 판독상의 해석을 반영했으나, 최종 개정에서는 이를 제거했습니다. 따라서 한국어도 본문이 직접 말하는 범위만 반영하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source-text sense without over-specifying the mode of judgment.'
