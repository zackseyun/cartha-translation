revisions:
- from: 백성이 모세가 산에서 내려오는 것을 지체하는 것을 보았을 때, 백성은 아론 주위에 모여 그에게 말하였습니다. 「일어나 우리를 위해 신들을 만드십시오. 그들이 우리 앞에서 가게 하십시오. 이는 우리를 이집트 땅에서 올라오게 한 바로 이 모세, 곧 그 사람에게 무슨 일이 일어났는지 우리가 알지 못하기 때문입니다.」[a]
  to: 백성이 모세가 산에서 내려오기를 오래 지체하는 것을 보았을 때, 백성은 아론 주위에 모여 그에게 말하였습니다. 「일어나 우리를 위해 우리 앞에서 갈 신들을 만드십시오. 이는 우리를 이집트 땅에서 이끌어 올린 이 모세, 곧 그 사람에게 무슨 일이 일어났는지 우리가 알지 못하기 때문입니다.」[a]
  rationale: 관계절의 문법적 기능을 회복하고, 한국어 문장을 자연스럽게 다듬었습니다. 복수 ‘신들’과 단수 대안의 본문/각주 구분은 원문의 문법적 긴장과 영어 POB 감사 기록을 따라 유지했습니다.
