  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
  footnotes:
  - marker: a
    text: Or 'a god ... that will go before us.' Some understand אֱלֹהִים here in a singular sense because the narrative soon focuses on a single calf image, but the Hebrew form and the following verb are plural.
    reason: alternative_reading
translation:
  language: ko
  text: 백성이 모세가 산에서 내려오기를 오래 지체하는 것을 보았을 때, 백성은 아론 주위에 모여 그에게 말하였습니다. 「일어나 우리를 위해 우리 앞에서 갈 신들을 만드십시오. 이는 우리를 이집트 땅에서 이끌어 올린 이 모세, 곧 그 사람에게 무슨 일이 일어났는지 우리가 알지 못하기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 앞에서 갈 신’. אֱלֹהִים을 단수로 이해하는 견해도 있으나, 히브리어 형태와 뒤따르는 동사는 복수입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  english_pob_choice: was taking a long time
  chosen_korean: 지체하는 것을
  alternatives_korean:
  - 오래 걸리는 것을
  - 늦어지는 것을
  lexicon: HALOT
  rationale: 백성이 느낀 모세의 지연을 자연스러운 현대 한국어로 옮기되, 단순한 시간 경과보다 ‘지체’의 뉘앙스를 살렸습니다.
- source_word: וַיִּקָּהֵל הָעָם עַל אַהֲרֹן
  english_pob_choice: gathered around Aaron
  chosen_korean: 아론 주위에 모여
  alternatives_korean:
  - 아론에게 모여
  - 아론을 향해 모여
  lexicon: HALOT
  rationale: עַל의 관계를 반영하면서도, 직접적 적대감을 과도하게 넣지 않는 POB의 판단을 한국어로 유지했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: gods
  chosen_korean: 신들을
  alternatives_korean:
  - 하나님을
  - 신을
  lexicon: HALOT
  rationale: 형태상 복수형이며 뒤의 동사도 복수이므로 본문은 복수형을 따랐습니다. 다만 본문이 곧 한 송아지 형상으로 좁혀지는 긴장은 그대로 남깁니다.
- source_word: קוּם עֲשֵׂה לָנוּ
  english_pob_choice: Get up, make for us
  chosen_korean: 일어나 우리를 위해 … 만드십시오
  alternatives_korean:
  - 일어나 우리를 위해 … 만드소서
  - 일어나 우리를 위해 … 만들어 주십시오
  lexicon: HALOT
  rationale: 명령의 급박함을 살리되, 현대 합쇼체에 맞게 직설적인 명령으로 옮겼습니다.
- source_word: מֶה הָיָה לוֹ
  english_pob_choice: what has happened to him
  chosen_korean: 무슨 일이 일어났는지
  alternatives_korean:
  - 어찌 되었는지
  - 무엇이 되었는지
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어의 자연스러운 질문으로 옮겨, 모세의 행방과 운명을 묻는 뜻을 드러냈습니다.
theological_decisions:
- issue: אֱלֹהִים을 단수로 볼지 복수로 볼지
  chosen_reading: 본문은 복수형 ‘신들’을 유지합니다.
  alternative_readings:
  - 단수 ‘신’
  - 단수적 의미를 암시하는 번역
  rationale: 문법적으로 복수형이고, POB의 영어 본문도 복수로 유지합니다. 송아지 형상이라는 서사적 단일성은 각주 없이 본문에 단수화하지 않고 남겨 두는 편이 소스에 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 5
