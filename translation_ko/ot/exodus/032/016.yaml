  text: וְ/הַ֨/לֻּחֹ֔ת מַעֲשֵׂ֥ה אֱלֹהִ֖ים הֵ֑מָּה וְ/הַ/מִּכְתָּ֗ב מִכְתַּ֤ב אֱלֹהִים֙ ה֔וּא חָר֖וּת עַל הַ/לֻּחֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: Now the tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
  footnotes:
  - marker: a
    text: Or 'God's workmanship ... God's inscription.' The Hebrew repeats 'work' and 'writing' for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 그 돌판들은 하나님께서 하신 일이었고, 그 글은 하나님의 글이었으며, 돌판들 위에 새겨져 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 반복은 단순 중복이 아니라 ‘일’과 ‘글’이 모두 하나님의 것임을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ֨/לֻּחֹ֔ת
  english_pob_choice: the tablets
  chosen_korean: 돌판들
  alternatives_korean:
  - 판들
  - 돌판
  lexicon: WLC / HALOT
  rationale: 문맥상 언약판은 돌로 된 판들이므로, 의미를 분명히 하기 위해 ‘돌판들’로 옮겼습니다. 수적 복수도 히브리어 복수형에 맞춰 살렸습니다.
- source_word: מַעֲשֵׂ֥ה אֱלֹהִ֖ים הֵ֑מָּה
  english_pob_choice: the work of God ... were
  chosen_korean: 하나님께서 하신 일이었고
  alternatives_korean:
  - 하나님의 일이었고
  - 하나님의 작품이었고
  lexicon: WLC / HALOT
  rationale: 히브리어는 ‘하나님의 일/작품’이라는 명사구로 강조합니다. 한국어에서는 자연스럽게 ‘하나님께서 하신 일’로 옮겨, 출처가 분명히 하나님께 있음을 살렸습니다.
- source_word: הַ/מִּכְתָּ֗ב מִכְתַּ֤ב אֱלֹהִים֙
  english_pob_choice: the writing ... the writing of God
  chosen_korean: 그 글은 하나님의 글이었으며
  alternatives_korean:
  - 그 기록은 하나님의 기록이었으며
  - 그 글은 하나님께 속한 글이었으며
  lexicon: WLC / HALOT
  rationale: 반복되는 ‘글/기록’의 수사적 강조를 보존하기 위해 같은 어근을 반복해 옮겼습니다. ‘글’은 현대 한국어에서 가장 직접적이며, ‘하나님의 글’이란 표현도 원문의 소유격 중첩을 잘 반영합니다.
- source_word: חָר֖וּת עַל הַ/לֻּחֹֽת
  english_pob_choice: engraved on the tablets
  chosen_korean: 돌판들 위에 새겨져 있었습니다
  alternatives_korean:
  - 돌판들에 새겨져 있었습니다
  - 돌판들 위에 새겨졌습니다
  lexicon: WLC / HALOT
  rationale: חָרוּת는 ‘새기다/조각하다’의 결과 상태를 나타내므로 ‘새겨져 있었습니다’로 옮겼습니다. ‘위에’는 על의 표면적 위치를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 하나님의 직접적 제작·기록성
  chosen_reading: 돌판 자체와 그 위의 글 모두를 하나님께서 직접 하신 것으로 분명하게 제시했습니다.
  alternative_readings:
  - ‘하나님이 만드셨다’와 같이 동사를 보강해 더 풀어 쓸 수도 있습니다.
  rationale: 히브리어는 명사구를 반복해 강조하므로, 이를 약화시키지 않기 위해 소유·행위 귀속을 분명히 유지했습니다. 이는 본문의 핵심 신학적 초점인 하나님의 직접성과 권위를 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
