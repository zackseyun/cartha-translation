  yaml_path: translation/ot/exodus/032/016.yaml
  text: Now the tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
  footnotes:
  - marker: a
    text: Or 'God's workmanship ... God's inscription.' The Hebrew repeats 'work' and 'writing' for emphasis.
