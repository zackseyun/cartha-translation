  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
  footnotes:
  - marker: a
    text: Or, 'This is your god, Israel.' The Hebrew reads literally, 'These are your gods,' though the referent in context is a single calf.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 내가 그들에게 명령한 길에서 속히 벗어났습니다. 그들은 자신들을 위해 송아지 형상의 주조 우상을 만들어, 그것에게 엎드려 절하고 그것에게 제사를 드리고, 이렇게 말하였습니다. “이스라엘아, 이것들이 너를 이집트 땅에서 올라오게 한 너의 신들입니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것이 너의 신이다’. 히브리어는 문자적으로 ‘이것들이 너의 신들이다’라고 되어 있으나, 문맥의 대상은 단일한 송아지입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  english_pob_choice: have quickly turned aside from the way
  chosen_korean: 속히 벗어났습니다
  alternatives_korean:
  - 빨리 벗어났습니다
  - 곧바로 떠났습니다
  - 재빨리 돌아섰습니다
  lexicon: HALOT
  rationale: ‘벗어나다’는 정해진 길에서 이탈하는 의미를 자연스럽게 살리며, ‘속히’가 מַהֵר의 급속한 배교 뉘앙스를 담습니다.
- source_word: עֵגֶל מַסֵּכָה
  english_pob_choice: a cast image of a calf
  chosen_korean: 송아지 형상의 주조 우상
  alternatives_korean:
  - 주조된 송아지
  - 송아지의 주조 형상
  - 부어 만든 송아지 우상
  lexicon: HALOT
  rationale: מַסֵּכָה의 ‘주조/부어 만든’ 의미와 עֵגֶל의 송아지 형상을 함께 드러내기 위해 ‘송아지 형상의 주조 우상’으로 옮겼습니다.
- source_word: וַיִּשְׁתַּחֲווּ לֹו וַיִּזְבְּחוּ לֹו
  english_pob_choice: have bowed down to it and sacrificed to it
  chosen_korean: 그것에게 엎드려 절하고 그것에게 제사를 드리며
  alternatives_korean:
  - 그것에게 절하고 제사를 드리며
  - 그것을 경배하고 그것에게 제사를 드리며
  - 그것 앞에 엎드려 절하고 그것에 제사하며
  lexicon: HALOT
  rationale: 동작의 순서와 육체적 굴복을 보존하기 위해 ‘엎드려 절하다’를 택했고, 이후의 제사 행위와 구분했습니다.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  english_pob_choice: These are your gods
  chosen_korean: 이것들이 너의 신들이다
  alternatives_korean:
  - 이것이 너의 신이다
  - 이것들이 너의 신이다
  lexicon: HALOT
  rationale: 히브리어의 복수형 표현을 본문에서 그대로 살려, 단수 우상과의 긴장을 주석 없이 평면화하지 않았습니다.
- source_word: הֶעֱלוּךָ
  english_pob_choice: who brought you up
  chosen_korean: 너를 이집트 땅에서 올라오게 한
  alternatives_korean:
  - 너를 이집트 땅에서 나오게 한
  - 너를 이집트에서 데리고 나온
  lexicon: HALOT
  rationale: עלה의 ‘올라가게 하다’라는 동사를 살려 출애굽의 익숙한 ‘끌어내다’보다 히브리어 관용을 직접 반영했습니다.
theological_decisions:
- issue: 복수형 ‘신들’과 단일 송아지의 긴장
  chosen_reading: 본문에는 복수형 ‘신들’을 유지하고, 단수로 매끈하게 만들지 않았습니다.
  alternative_readings:
  - 문맥상 ‘너의 신이다’로 단수화
  - ‘이것들이’ 대신 관용적으로 단수화
  rationale: 히브리어 형태는 분명 복수형이며, 우상은 하나인데 말은 복수로 나오는 긴장을 본문에서 보존하는 것이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: וַיִּשְׁתַּחֲווּ의 번역
  chosen_reading: ‘예배하다’보다 ‘엎드려 절하다’로 옮겼습니다.
  alternative_readings:
  - 예배하다
  - 경배하다
  rationale: 본문은 신학적 일반어보다 몸의 행위 자체를 묘사하므로, 절과 제사의 연속을 분명히 보이게 했습니다.
  doctrine_reference: Translation philosophy §1 Original-language primacy over translation tradition
