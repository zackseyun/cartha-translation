  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
  footnotes:
  - marker: a
    text: Or “have acted corruptly.” The Hebrew verb can be rendered in a way that emphasizes corrupt behavior rather than the resulting self-corruption.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 모세에게 말씀하셨습니다. 「가서 내려가십시오. 네가 이집트 땅에서 데리고 올라온 네 백성이 스스로 타락하였습니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악하게 행동하였습니다’. 히브리어 동사는 결과로서의 타락보다 부패한 행위를 강조하는 방식으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 본문에 직접 나타난 신명칭을 한국어에서도 대체 칭호가 아니라 고유명사로 살려야 하므로, 프로젝트 기본값대로 ‘야훼’를 사용했습니다.
- source_word: לֶךְ רֵד
  english_pob_choice: Go down
  chosen_korean: 내려가십시오
  alternatives_korean:
  - 가서 내려가십시오
  - 내려가라
  lexicon: WLC
  rationale: 히브리어는 두 개의 명령형이지만 한국어에서는 한 명령으로 자연스럽게 묶어 옮기되, 하나님께 직접 하는 명령이라는 점을 살려 공손한 명령형으로 처리했습니다.
- source_word: שִׁחֵת
  english_pob_choice: have corrupted themselves
  chosen_korean: 스스로 부패하였습니다
  alternatives_korean:
  - 스스로 타락하였습니다
  - 부패하였습니다
  - 악하게 행동하였습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 행위 평가보다 자기파괴적·도덕적 부패를 드러내야 하므로, 반사적 의미를 살려 ‘스스로 부패하였습니다’로 옮겼습니다.
- source_word: עַמְּךָ
  english_pob_choice: your people
  chosen_korean: 네 백성이
  alternatives_korean:
  - 당신의 백성이
  - 네 백성
  lexicon: WLC
  rationale: 하나님께서 모세에게 ‘네 백성’이라고 말씀하시는 대조적 수사가 핵심이어서, 소유격을 분명히 드러내는 ‘네 백성’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접 화법에서의 존대 처리
  chosen_reading: 본문 서술은 합쇼체로 유지하고, 직접 명령은 ‘내려가십시오’처럼 하나님께 드리는 공손한 명령형으로 옮겼습니다.
  alternative_readings:
  - 직접 명령을 평서형처럼 ‘내려가라’로 옮김
  - 모든 화법을 동일한 서술체로 평준화함
  rationale: 히브리어 명령문의 날카로움을 유지하면서도 한국어 독자에게 하나님 말씀의 위계를 자연스럽게 전달해야 하므로, 직접 화법에서만 존대 명령을 사용했습니다.
  doctrine_reference: POB translation philosophy §1, §6
