source:
  edition: WLC
  text: וְ/עַתָּ֖ה אִם תִּשָּׂ֣א חַטָּאתָ֑/ם וְ/אִם אַ֕יִן מְחֵ֣/נִי נָ֔א מִֽ/סִּפְרְ/ךָ֖ אֲשֶׁ֥ר כָּתָֽבְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
  footnotes:
  - marker: a
    text: Or 'carry away their sin' or 'pardon their sin'; the Hebrew idiom literally uses 'lift/bear' with 'sin.'
    reason: lexical_alternative
  - marker: b
    text: '''Your book'' may refer to a divine register of the living or, by extension, the book of life; the Hebrew itself does not specify further.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이제, 주께서 그들의 죄를 용서해 주신다면 좋겠습니다. 그렇지 않으시다면, 부디 당신이 쓰신 책에서 저를 지워 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄를 용서해 주신다면’에 해당하는 히브리어는 문자적으로 ‘죄를 들어 올리다/짊어지다’의 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신이 쓰신 책’은 살아 있는 자의 명부나 생명책을 가리킬 수 있지만, 히브리어 자체는 그 정체를 더 규정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 그리고 이제
  - 이제
  lexicon: HALOT
  rationale: 문맥상 앞선 중보 뒤에 이어지는 대조와 긴급성을 살려 ‘그러나’로 시작했고, 시간 부사 ‘이제’로 원문의 전환을 분명히 했습니다.
- source_word: תִּשָּׂא חַטָּאתָם
  english_pob_choice: you will forgive their sin
  chosen_korean: 그들의 죄를 용서해 주신다면
  alternatives_korean:
  - 그들의 죄를 지워 주신다면
  - 그들의 죄를 담당해 주신다면
  - 그들의 죄를 용서하신다면
  lexicon: HALOT
  rationale: נשא + 죄의 결합은 문자적으로는 ‘들어 올리다/지다’이지만 여기서는 죄를 사하시는 뜻이므로 자연스러운 동사 ‘용서해 주시다’로 옮겼습니다.
- source_word: וְאִם אַיִן
  english_pob_choice: but if not
  chosen_korean: 그렇지 않으시다면
  alternatives_korean:
  - 아니면
  - 만약 그렇지 않다면
  lexicon: HALOT
  rationale: 이전 조건절과 대조되는 생략된 부정 조건을 현대 한국어의 자연스러운 연결로 풀어, 모세의 간청이 이어지는 긴박함을 살렸습니다.
- source_word: מְחֵנִי נָא מִסִּפְרְךָ
  english_pob_choice: please blot me out of your book
  chosen_korean: 부디 당신이 쓰신 책에서 저를 지워 주십시오
  alternatives_korean:
  - 부디 당신의 책에서 저를 지워 주십시오
  - 부디 당신이 기록하신 책에서 저를 말소해 주십시오
  lexicon: HALOT
  rationale: מחה는 기록에서 ‘지우다/말소하다’의 뜻이므로 ‘지워 주십시오’로 살렸고, נָא는 청원 어조의 ‘부디’로 옮겼습니다. ‘당신이 쓰신 책’은 뒤의 관계절을 자연스럽게 반영합니다.
- source_word: סִּפְרְךָ אֲשֶׁר כָּתָבְתָּ
  english_pob_choice: your book that you have written
  chosen_korean: 당신이 쓰신 책
  alternatives_korean:
  - 당신의 책
  - 당신이 기록하신 책
  - 당신이 만드신 책
  lexicon: HALOT
  rationale: ספר는 문맥상 단순한 ‘책/기록’ 둘 다 가능하지만, 본문이 하나님의 기록을 가리키는지 특정하지 않으므로 POB처럼 중립적인 ‘책’을 유지했습니다. כָּתָבְתָּ는 완료된 행위를 드러내어 ‘쓰신’으로 옮겼습니다.
theological_decisions:
- issue: ‘당신의 책’의 정체
  chosen_reading: 구체화하지 않고 하나님의 기록으로 열린 상태를 유지했습니다.
  alternative_readings:
  - 생명책
  - 생존자 명부
  - 하나님의 기록/등록
  rationale: 히브리어는 이 책이 생명책인지, 살아 있는 자의 명부인지, 혹은 다른 신적 기록인지 규정하지 않으므로, 번역에서도 그 긴장을 해소하지 않고 보존하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
