translation:
  language: ko
  text: 그러나 이제, 주님께서 그들의 죄를 용서해 주신다면[a]—그렇지 않으시다면, 부디 주님께서 쓰신 책[b]에서 저를 지워 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄를 용서해 주신다면’에 해당하는 히브리어는 문자적으로 ‘죄를 들어 올리다/짊어지다’라는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님께서 쓰신 책’은 살아 있는 이들의 명부나, 더 넓게는 생명책을 가리킬 수 있지만, 히브리어 자체는 그 정체를 더 규정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그러나 이제
