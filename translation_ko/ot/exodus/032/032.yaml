  lexicon: HALOT
  rationale: נשא + 죄의 결합은 문자적으로는 ‘들어 올리다/지다’이지만 여기서는 죄를 사하시는 뜻이므로 자연스러운 동사 ‘용서해 주시다’로 옮겼습니다.
- source_word: וְאִם אַיִן
  english_pob_choice: but if not
  chosen_korean: 그렇지 않으시다면
  alternatives_korean:
  - 아니면
  - 만약 그렇지 않다면
  lexicon: HALOT
  rationale: 이전 조건절과 대조되는 생략된 부정 조건을 현대 한국어의 자연스러운 연결로 풀어, 모세의 간청이 이어지는 긴박함을 살렸습니다.
- source_word: מְחֵנִי נָא מִסִּפְרְךָ
  english_pob_choice: please blot me out of your book
  chosen_korean: 부디 당신이 쓰신 책에서 저를 지워 주십시오
  alternatives_korean:
  - 부디 당신의 책에서 저를 지워 주십시오
  - 부디 당신이 기록하신 책에서 저를 말소해 주십시오
  lexicon: HALOT
  rationale: מחה는 기록에서 ‘지우다/말소하다’의 뜻이므로 ‘지워 주십시오’로 살렸고, נָא는 청원 어조의 ‘부디’로 옮겼습니다. ‘당신이 쓰신 책’은 뒤의 관계절을 자연스럽게 반영합니다.
- source_word: סִּפְרְךָ אֲשֶׁר כָּתָבְתָּ
  english_pob_choice: your book that you have written
  chosen_korean: 당신이 쓰신 책
  alternatives_korean:
  - 당신의 책
  - 당신이 기록하신 책
  - 당신이 만드신 책
  lexicon: HALOT
  rationale: ספר는 문맥상 단순한 ‘책/기록’ 둘 다 가능하지만, 본문이 하나님의 기록을 가리키는지 특정하지 않으므로 POB처럼 중립적인 ‘책’을 유지했습니다. כָּתָבְתָּ는 완료된 행위를 드러내어 ‘쓰신’으로 옮겼습니다.
theological_decisions:
- issue: ‘당신의 책’의 정체
  chosen_reading: 구체화하지 않고 하나님의 기록으로 열린 상태를 유지했습니다.
  alternative_readings:
  - 생명책
  - 생존자 명부
  - 하나님의 기록/등록
  rationale: 히브리어는 이 책이 생명책인지, 살아 있는 자의 명부인지, 혹은 다른 신적 기록인지 규정하지 않으므로, 번역에서도 그 긴장을 해소하지 않고 보존하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
