base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
  footnotes:
  - marker: a
    text: Hebrew 'his near one'; this can also be rendered 'his kinsman' or 'his close relative.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. 각 사람은 자기 칼을 허리에 차십시오. 진영 안에서 문에서 문으로 다니며 지나가고 돌아오고, 각 사람은 자기 형제를, 각 사람은 자기 동료를, 각 사람은 자기 가까운 사람을 죽이십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘자기 가까운 사람’은 ‘친족’이나 ‘가까운 친척’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언적 전언 공식 כֹּה אָמַר은 현재형 선언으로 옮기고, יְהוָה는 프로젝트 기본값대로 ‘야훼’로 유지해 하나님의 고유 이름을 보존했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하느님
  - 이스라엘의 주 하나님
  lexicon: HALOT
  rationale: 소유격 구조를 자연스러운 한국어로 풀어 ‘이스라엘의 하나님’으로 옮겼습니다.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  english_pob_choice: Each man, put his sword on his thigh
  chosen_korean: 각 사람은 자기 칼을 허리에 차십시오
  alternatives_korean:
  - 각 사람은 자기 칼을 자기 넓적다리에 두십시오
  - 각 남자는 자기 칼을 허벅지에 두십시오
  lexicon: HALOT
  rationale: ‘칼을 허리에 차다’는 무장 동작을 현대 한국어에서 자연스럽게 드러내면서도, עַל יְרֵכוֹ의 신체-무기 결합 이미지를 살렸습니다.
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  english_pob_choice: from gate to gate throughout the camp
  chosen_korean: 진영 안에서 문에서 문으로 다니며
  alternatives_korean:
  - 진영을 두루 다니며 문에서 문으로
  - 진영 전체에서 문마다 오가며
  lexicon: HALOT
  rationale: 문에서 문으로의 반복 이동과 진영 내부 전체를 아우르는 범위를 함께 보이기 위해 직역과 자연스러운 연결을 결합했습니다.
- source_word: וְהִרְגוּ אִישׁ אֶת אָחִיו וְאִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת קְרֹבוֹ
  english_pob_choice: and each man kill his brother, and each man his companion, and each man his neighbor
  chosen_korean: 각 사람은 자기 형제를, 각 사람은 자기 동료를, 각 사람은 자기 가까운 사람을 죽이십시오
  alternatives_korean:
  - 각 사람은 자기 형제를, 자기 친구를, 자기 이웃을 죽이십시오
  - 각 사람은 자기 형제와 동료와 가까운 사람을 죽이십시오
  lexicon: HALOT
  rationale: 반복되는 אִישׁ을 살려 분배적이고 개별적인 책임을 드러냈고, קְרֹבוֹ는 ‘가까운 사람’으로 옮겨 혈연에만 좁혀지지 않게 했습니다.
theological_decisions:
- issue: Theophoric divine-name rendering in a command formula
  chosen_reading: ‘야훼’로 옮겨 고유 이름을 보존했습니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 음역
  rationale: 본문은 직접적으로 יהוה를 사용하므로, 제목어 ‘주’로 바꾸지 않고 이름 자체를 드러내는 것이 source-direct입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: Preserving the distributive masculine singular אִישׁ
  chosen_reading: ‘각 사람은 … 각 사람은 … 각 사람은 …’으로 반복했습니다.
  alternative_readings:
  - ‘모두는 … 모두는 … 모두는 …’
  - ‘각자 … 각자 … 각자 …’
  rationale: 문맥상 레위 남성들에게 내려진 명령이며, 히브리어의 반복 구조가 강조하는 개별 책임을 흐리지 않기 위해 성별-명시적 분배 표현을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
