id: EXO.32.25
reference: Exodus 32:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
  footnotes:
  - marker: a
    text: Or 'unrestrained' / 'let loose.' The Hebrew repeats the same root for the people's condition and Aaron's action.
    reason: lexical_alternative
  - marker: b
    text: Or 'for derision' or 'for scorn' among their adversaries.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 보니 백성이 방종해 있었습니다. 아론이 그들을 방종하게 하여, 그들이 자신들을 비웃는 자들의 조롱거리가 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘절제되지 않은’ / ‘풀어 놓은’. 히브리어는 백성의 상태와 아론의 행위에 같은 어근을 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘조롱’ 또는 ‘멸시’의 대상.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: When Moses saw
  chosen_korean: 모세가 보니
  alternatives_korean:
  - 모세가 보았습니다
  - 모세는 보았습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 잇기 위해 ‘보니’로 옮겼습니다. 히브리어 waw-연속의 시간적 진행을 살리면서도 현대 한국어 문장으로 매끄럽게 읽히게 합니다.
- source_word: פָרֻעַ / פְרָעֹה
  english_pob_choice: out of control / had let them get out of control
  chosen_korean: 방종해 있었습니다 / 방종하게 하여
  alternatives_korean:
  - 제멋대로였습니다 / 제멋대로 하게 하여
  - 절제되지 않았습니다 / 절제되지 않게 하여
  - 통제되지 않았습니다 / 통제되지 않게 하여
  lexicon: HALOT
  rationale: 같은 어근의 반복을 한국어에서도 연결해 살리기 위해 ‘방종’ 계열을 택했습니다. 영어 POB의 ‘out of control’보다 도덕적 해이와 질서 상실을 함께 드러내며, 문맥상 단순한 ‘벌거벗음’보다 적절합니다.
- source_word: לְשִׁמְצָה
  english_pob_choice: to a derision / to the mockery
  chosen_korean: 조롱거리가 되었습니다
  alternatives_korean:
  - 비웃음거리가 되었습니다
  - 조롱을 받게 되었습니다
  - 수치의 대상이 되었습니다
  lexicon: HALOT
  rationale: שִׁמְצָה는 ‘조롱, 멸시의 대상’이라는 뜻이므로 결과 상태를 자연스럽게 드러내는 ‘조롱거리’로 옮겼습니다. 영어 POB의 ‘mockery/derision’과 의미 범위를 유지합니다.
- source_word: בְּקָמֵיהֶם
  english_pob_choice: among those who rose against them
  chosen_korean: 자신들을 비웃는 자들
  alternatives_korean:
  - 그들을 대적하는 자들
  - 그들에게 일어선 자들
  - 그들을 반대하는 자들
  lexicon: HALOT
  rationale: 직역하면 ‘그들에게 일어선 자들’이지만, 문맥상 적대자들의 조롱을 가리키므로 한국어에서 자연스러운 결과 표현으로 풀었습니다. ‘비웃는 자들’은 POB의 ‘adversaries’와 조롱의 뉘앙스를 함께 담습니다.
theological_decisions:
- issue: 히브리어 반복어근 פרע의 의미 범위
  chosen_reading: ‘방종하다’와 ‘방종하게 하다’로 같은 어근의 반복을 살려, 단순한 무질서보다 질서 상실과 도덕적 방임을 함께 드러냈습니다.
  alternative_readings:
  - 제멋대로이다 / 제멋대로 하게 하다
  - 절제되지 않다 / 절제되지 않게 하다
  - 통제되지 않다 / 통제되지 않게 하다
  rationale: 이 절은 아론의 책임 아래 공동체의 붕괴를 강조합니다. 따라서 지나치게 추상적이거나, 반대로 신체적 의미로 오해될 수 있는 번역은 피하고 문맥의 사회·도덕적 긴장을 살렸습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; readable modern Korean, not archaic ecclesial diction.'
