translation:
  language: ko
  text: 이제 나를 놔두십시오[a]. 그러면 내 분노가 그들에게 타올라 내가 그들을 삼켜 버리고[b], 내가 당신을 큰 나라로 만들겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 내버려 두십시오.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 분노가 그들에게 타올라 내가 그들을 멸하겠다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּיחָה
  english_pob_choice: leave me alone
  chosen_korean: 나를 놔두십시오
  alternatives_korean:
  - 저를 내버려 두십시오
  - 저를 놓아두십시오
  lexicon: HALOT
  rationale: 분사형 명령의 핵심은 방해를 거두고 그대로 두라는 뜻이므로, 현대 한국어에서 직접적이고 자연한 ‘놔두십시오’로 옮겼습니다.
- source_word: וְיִחַר אַפִּי
  english_pob_choice: so that my anger may burn
  chosen_korean: 내 분노가 … 타올라
  alternatives_korean:
  - 내 분노가 … 타오르게 되어
  - 내 노가 … 타올라
  lexicon: HALOT
  rationale: ‘חרה אף’의 불붙는 이미지를 살리기 위해 추상화하지 않고 ‘타올라’로 옮겼습니다.
- source_word: וַאֲכַלֵּם
  english_pob_choice: I may consume them
  chosen_korean: 내가 그들을 삼켜 버리고
  alternatives_korean:
  - 내가 그들을 멸하고
  - 내가 그들을 소멸하고
  lexicon: HALOT
  rationale: כלה의 완결·소멸 의미를 한국어의 강한 동사 ‘삼켜 버리다’로 살려 심판의 파괴성을 드러냈습니다.
- source_word: לְגוֹי גָּדוֹל
  english_pob_choice: into a great nation
  chosen_korean: 큰 나라
  alternatives_korean:
  - 큰 민족
  - 위대한 나라
  lexicon: HALOT
  rationale: גוֹי는 ‘나라/민족’의 범위를 가지므로, 한국어 성경 문맥에서 자연한 ‘나라’로 옮기되 ‘큰’으로 약속의 확장을 보존했습니다.
theological_decisions:
- issue: 하나님의 분노를 의인화한 표현
  chosen_reading: ‘내 분노가 … 타올라’처럼 감정의 불길 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘내가 그들에게 진노하겠다’처럼 추상화할 수 있음
  rationale: 본문의 긴박한 심판 선언과 히브리어 관용구의 힘을 약화시키지 않기 위해, 신학적 긴장을 해소하지 않고 이미지 자체를 유지했습니다.
  doctrine_reference: '번역 원칙: 본문의 비유적·의인적 표현은 가능하면 보존한다.'
- issue: 모세에게 주어지는 명령의 성격
  chosen_reading: 주석 없이 직설적 명령으로 옮겼습니다.
  alternative_readings:
  - 모세의 중보를 유도하는 수사적 명령으로 설명할 수 있음
  rationale: 본문은 명령과 심판/약속을 직접 제시하므로, 해석적 설명을 본문에 섞지 않고 명령의 강도를 유지했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 해석을 본문에 주입하지 않는다.'
