  source_fidelity: 초안은 הַנִּיחָה의 직접 명령과 하나님의 분노가 타오르는 비유를 대체로 보존합니다. 그러나 ‘그러면’은 히브리어의 연결을 조건적 결과로 과도하게 규정하며, ‘그들에게 타올라’는 분노의 대상 관계를 한국어에서 부자연스럽게 표현합니다. 또한 וַאֲכַלֵּם의 문맥상 심판 의미에는 ‘삼켜 버리고’보다 ‘멸하게 하십시오’가 더 정확하고 자연스럽습니다.
  naturalness: ‘나를 놔두십시오’도 가능하지만, 이 문맥의 직접 명령에는 ‘나를 내버려 두십시오’가 더 자연스럽고 문어적 성경 문체에도 잘 맞습니다. ‘내 분노가 그들을 향해 타올라’라고 하여 대상 관계를 명료하게 했고, 뒤의 허용/목적 관계는 ‘…멸하게 하십시오’로 표현했습니다.
  terminology: גוֹי גָּדוֹל은 족장 언약의 어휘와 문맥을 고려하여 ‘큰 민족’으로 옮기는 것이 ‘큰 나라’보다 적절합니다. כלה의 피엘은 여기서 심판으로 완전히 없애는 뜻이므로 ‘멸하다’를 사용했습니다.
