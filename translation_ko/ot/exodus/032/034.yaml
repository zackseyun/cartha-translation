id: EXO.32.34
reference: Exodus 32:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: ko
  text: 그러나 이제 떠나서, 내가 너에게 말한 곳으로 백성을 인도하십시오. 보십시오, 내 천사가 당신 앞서 갈 것입니다. 그러나 내가 그들을 그들의 죄로 인해 벌할 날에는 내가 그들을 벌할 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘떠나서’는 לֵךְ의 이동 명령과 נְחֵה의 인도 명령을 자연스럽게 묶은 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וְעַתָּ֞ה לֵ֣ךְ נְחֵ֣ה
  english_pob_choice: But now go, lead
  chosen_korean: “그러나 이제 떠나서… 인도하십시오”
  alternatives_korean:
  - 그러나 이제 가서… 이끌어 가십시오
  - 그러나 이제 가십시오, 백성을 인도하십시오
  lexicon: הלך / נחה
  rationale: לֵךְ와 נְחֵה의 연속 명령을 한국어에서 자연스럽게 풀어 “떠나서… 인도하십시오”로 옮겨, 단순한 이동과 백성 인도의 두 동작을 모두 살렸습니다.
- source_word: אֵת הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 그 백성
  - 사람들
  lexicon: עם
  rationale: 히브리어 הָעָם의 집합적 의미를 살려 ‘백성’으로 옮겼습니다.
- source_word: מַלְאָכִי
  english_pob_choice: my angel
  chosen_korean: 내 천사
  alternatives_korean:
  - 내 사자
  - 내 메신저
  lexicon: מלאך
  rationale: POB의 “my angel”을 따라 ‘내 천사’로 옮겼고, 본문의 초점이 파견된 존재라는 점을 보존했습니다.
- source_word: וּבְיוֹם פָּקְדִי וּפָקַדְתִּי
  english_pob_choice: on the day when I call them to account, I will call them to account
  chosen_korean: 내가 그들을 그들의 죄로 인해 벌할 날에는 내가 그들을 벌할 것입니다
  alternatives_korean:
  - 내가 그들을 심문할 날에는 내가 그들을 심문할 것입니다
  - 내가 그들을 점검할 날에는 내가 그들을 점검할 것입니다
  lexicon: פקד
  rationale: פָּקַד의 문맥상 의미를 단순한 방문보다 ‘책임을 묻고 벌하다’로 이해하는 POB의 해석을 따라, 심판적 책임 추궁의 중복을 한국어로 드러냈습니다.
theological_decisions:
- issue: 하나님의 ‘천사’와 심판적 ‘벌함’의 병치
  chosen_reading: “내 천사”와 “내가 그들을 벌할 것입니다”를 함께 유지해, 보호의 동행과 장차의 책임 추궁이 동시에 선언되는 긴장을 보존했습니다.
  alternative_readings:
  - ‘사자’로 완화해 일반 전달자로 보기
  - ‘조사할 것입니다’처럼 비심판적으로 순화하기
  rationale: 본문은 인도와 경고를 한 문장 안에 병치하므로, 한국어에서도 두 요소를 분리하거나 완화하지 않았습니다.
  doctrine_reference: 출애굽기 32장 34절의 심판 선언과 천사 인도 약속
