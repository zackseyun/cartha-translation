translation:
  language: ko
  text: 그러나 모세는 자기 하나님 야훼께 간청하고[a] 말했습니다. “야훼여, 어찌하여 주의 분노가 주께서 큰 능력과 강한 손으로 이집트 땅에서 이끌어 내신 주의 백성을 향해 타오릅니까?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘자기 하나님 야훼의 얼굴을 구하였다’이며, 관용적으로는 은혜를 구하며 간청했다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘능한 손으로’.
    reason: lexical_alternative
