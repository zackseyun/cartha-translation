  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''sought the face of the LORD''; an idiom meaning to seek favor or plead earnestly.'
    reason: lexical_alternative
  - marker: b
    text: Or 'with a mighty hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 모세는 야훼 그의 하나님께 간청하며 말했습니다. “야훼여, 어찌하여 주의 분노가 주의 백성에게 타오르십니까? 주께서 그들을 큰 능력과 강한 손으로 이집트 땅에서 이끌어 내지 않으셨습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘여호와의 얼굴을 구하였다’는 뜻으로, 관용적으로는 은혜를 구하며 간청하는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘강한 손으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי
  english_pob_choice: pleaded with
  chosen_korean: 간청하며
  alternatives_korean:
  - 애원하며
  - 간구하며
  - 은혜를 구하며
  lexicon: HALOT
  rationale: ‘פְּנֵי(얼굴/낯)’와 결합한 חלה는 관용적으로 간절히 매달려 호의를 구하는 뜻이므로, 자연스러운 합쇼체 한국어로는 ‘간청하며’가 가장 직접적으로 그 절박한 중보의 힘을 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 프로젝트 기본값에 따라 신명은 대체 칭호가 아니라 고유명사로 음역한 ‘야훼’를 유지했습니다.
- source_word: יֶחֱרֶה אַפְּךָ
  english_pob_choice: should your anger burn
  chosen_korean: 주의 분노가 ... 타오르십니까
  alternatives_korean:
  - 주의 노가 ... 타오릅니까
  - 주의 진노가 ... 불타십니까
  - 주께서 ... 분노하시십니까
  lexicon: HALOT
  rationale: ‘코가 타다’라는 히브리 관용을 한국어에서 지나치게 해부학적으로 옮기지 않되, 불의 이미지와 정서적 긴장을 살리기 위해 ‘분노가 타오르십니까’로 옮겼습니다.
- source_word: וּבְיָד חֲזָקָה
  english_pob_choice: with a strong hand
  chosen_korean: 강한 손
  alternatives_korean:
  - 능한 손
  - 힘센 손
  - 강력한 손
  lexicon: HALOT
  rationale: 출애굽의 전형적 표현을 직역에 가깝게 유지하여, 하나님의 구원 행위를 나타내는 관용구로서의 울림을 보존했습니다.
theological_decisions:
- issue: 야훼의 분노를 인격적·신체적 이미지로 유지할지 여부
  chosen_reading: ‘주의 분노가 ... 타오르십니까’로 옮겨, 히브리어의 체현적 비유를 완화하되 지우지 않았습니다.
  alternative_readings:
  - 주의 진노가 ... 불타십니까
  - 어찌하여 주께서 분노하십니까
  rationale: 본문의 수사적 긴장과 강도를 살리기 위해 감정의 불타오름 이미지를 유지했습니다. 동시에 한국어 독자에게 부자연스러운 ‘코가 타다’ 직역은 피했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
