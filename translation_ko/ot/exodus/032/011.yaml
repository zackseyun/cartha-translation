  - 주의 진노가 ... 불타십니까
  - 주께서 ... 분노하시십니까
  lexicon: HALOT
  rationale: ‘코가 타다’라는 히브리 관용을 한국어에서 지나치게 해부학적으로 옮기지 않되, 불의 이미지와 정서적 긴장을 살리기 위해 ‘분노가 타오르십니까’로 옮겼습니다.
- source_word: וּבְיָד חֲזָקָה
  english_pob_choice: with a strong hand
  chosen_korean: 강한 손
  alternatives_korean:
