  - 힘센 손
  - 강력한 손
  lexicon: HALOT
  rationale: 출애굽의 전형적 표현을 직역에 가깝게 유지하여, 하나님의 구원 행위를 나타내는 관용구로서의 울림을 보존했습니다.
theological_decisions:
- issue: 야훼의 분노를 인격적·신체적 이미지로 유지할지 여부
  chosen_reading: ‘주의 분노가 ... 타오르십니까’로 옮겨, 히브리어의 체현적 비유를 완화하되 지우지 않았습니다.
  alternative_readings:
  - 주의 진노가 ... 불타십니까
  - 어찌하여 주께서 분노하십니까
  rationale: 본문의 수사적 긴장과 강도를 살리기 위해 감정의 불타오름 이미지를 유지했습니다. 동시에 한국어 독자에게 부자연스러운 ‘코가 타다’ 직역은 피했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
