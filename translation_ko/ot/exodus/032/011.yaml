  rationale: 프로젝트 기본값에 따라 신명은 대체 칭호가 아니라 고유명사로 음역한 ‘야훼’를 유지했습니다.
- source_word: יֶחֱרֶה אַפְּךָ
  english_pob_choice: should your anger burn
  chosen_korean: 주의 분노가 ... 타오르십니까
