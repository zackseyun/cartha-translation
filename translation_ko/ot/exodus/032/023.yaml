  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
  footnotes:
  - marker: a
    text: Or 'Make a god for us, who will go before us.' Although this verse uses a plural noun with a plural verb ('gods ... will go'), some render the sense as singular in light of the calf image in the surrounding context.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 저에게 이렇게 말했습니다. ‘우리 앞에 나아갈 신들<sup>a</sup>을 우리를 위해 만드십시오. 이 모세, 곧 우리를 이집트 땅에서 올라오게 한 사람은 어떻게 되었는지 우리는 알지 못합니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 앞에 나아갈 신을 우리를 위해 만드십시오.’ 이 절은 복수 명사와 복수 동사를 사용하지만, 주변의 송아지 이미지 때문에 의미를 단수로 옮기는 경우도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  english_pob_choice: And they said to me
  chosen_korean: 그들이 저에게 이렇게 말했습니다
  alternatives_korean:
  - 그리고 그들이 저에게 말했습니다
  - 그래서 그들이 저에게 말했습니다
  lexicon: WLC/HALOT
  rationale: wayyiqtol의 순차적 진행을 한국어로 자연스럽게 옮기되, 직접 인용을 예고하는 표현으로 다듬었습니다.
- source_word: אֱלֹהִים
  english_pob_choice: gods
  chosen_korean: 신들
  alternatives_korean:
  - 신
  - 하나님
  lexicon: WLC/HALOT
  rationale: 동사 복수형과 함께 나타나므로 복수 의미를 살려야 하며, 본문 긴장을 보존하기 위해 단수로 평탄화하지 않았습니다.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  english_pob_choice: which will go before us
  chosen_korean: 우리 앞에 나아갈
  alternatives_korean:
  - 우리 앞에서 갈
  - 우리를 앞서 갈
  lexicon: WLC/HALOT
  rationale: ‘앞서/앞에 가다’의 인도 관용을 살리면서, 우상 요청의 대상이 인격화된 표현이므로 ‘나아갈’로 옮겼습니다.
- source_word: מֵ/אֶ֣רֶץ מִצְרַ֔יִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 애굽 땅에서
  lexicon: WLC/HALOT
  rationale: 히브리어의 ‘땅’(אֶרֶץ)을 반영해 ‘이집트 땅’으로 옮기되, 현대 표기인 ‘이집트’를 사용했습니다.
theological_decisions:
- issue: אֱלֹהִים의 수(數)를 어떻게 드러낼지
  chosen_reading: 복수로 읽어 ‘신들’로 번역했습니다.
  alternative_readings:
  - 단수로 읽어 ‘신’ 또는 ‘하나님’으로 번역
  rationale: 바로 뒤의 복수 동사 יֵלְכוּ가 복수 해석을 강하게 지지하므로, 후대의 송아지 이미지에 맞춰 단수화하지 않고 본문의 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy #3 (preserve theological tension rather than resolve it)'
