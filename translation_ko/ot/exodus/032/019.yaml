id: EXO.32.19
reference: Exodus 32:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִ֗י כַּ/אֲשֶׁ֤ר קָרַב֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יַּ֥רְא אֶת הָ/עֵ֖גֶל וּ/מְחֹלֹ֑ת וַ/יִּֽחַר אַ֣ף מֹשֶׁ֗ה וַ/יַּשְׁלֵ֤ךְ מ/יד/ו אֶת הַ/לֻּחֹ֔ת וַ/יְשַׁבֵּ֥ר אֹתָ֖/ם תַּ֥חַת הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
  footnotes:
  - marker: a
    text: Or 'and saw the calf and dances.' The Hebrew plural noun can be rendered more formally as 'dances,' but 'the dancing' is more natural in English after 'saw.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 진영 가까이 이르렀을 때, 송아지와 춤추는 모습을 보고 모세의 분노가 타올랐습니다. 그는 손에서 판들을 내던져 산기슭에서 그것들을 깨뜨렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר קָרַב אֶל הַמַּחֲנֶה
  english_pob_choice: And as soon as he came near the camp
  chosen_korean: 그가 진영에 가까이 이르러
  alternatives_korean:
  - 진영에 가까이 오자
  - 그가 진영에 가까이 왔을 때
  lexicon: HALOT
  rationale: 서술 전개를 자연스럽게 살리면서 כַּאֲשֶׁר의 시간적 연결을 ‘이르러’로 압축해 과도한 직역을 피했습니다.
- source_word: וּמְחֹלֹת
  english_pob_choice: and the dancing
  chosen_korean: 춤
  alternatives_korean:
  - 춤추는 것
  - 춤과 광란
  lexicon: HALOT
  rationale: 명사 복수의 기본 의미를 간결하게 살려 ‘춤’으로 옮겼습니다. 문맥상 우상숭배적 흥겨움이지만, 본문 자체를 넘는 해석어는 피했습니다.
- source_word: וַיִּחַר אַף מֹשֶׁה
  english_pob_choice: Moses' anger burned
  chosen_korean: 모세의 분노가 타올랐습니다
  alternatives_korean:
  - 모세가 크게 화를 냈습니다
  - 모세의 노가 불탔습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 불타는 이미지를 살리되, 현대 한국어에서 자연스러운 표현으로 ‘타올랐습니다’를 선택했습니다.
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ אֶת הַלֻּחֹת
  english_pob_choice: and he threw the tablets from his hands
  chosen_korean: 그는 자기 손에서 돌판들을 던져
  alternatives_korean:
  - 그는 자기 손에서 판들을 내던져
  - 그는 손에서 돌판들을 내던져
  lexicon: HALOT
  rationale: 복수형 ‘손들’이라는 영어 조정 취지를 반영해 한국어도 자연스럽게 복수로 옮겼고, ‘돌판들’로 내용상 돌 판이라는 점을 드러냈습니다.
- source_word: תַּחַת הָהָר
  english_pob_choice: at the foot of the mountain
  chosen_korean: 산 밑에서
  alternatives_korean:
  - 산 아래에서
  - 산 기슭에서
  lexicon: HALOT
  rationale: 지형적 관계를 한국어 관용에 맞게 옮겼습니다. ‘at the foot of the mountain’의 현장감을 살리되 지나치게 설명적이지 않게 했습니다.
theological_decisions:
- issue: 모세의 격한 반응을 어떻게 표현할지
  chosen_reading: ‘분노가 타올랐습니다’로 직설적이고 강한 반응을 유지했습니다.
  alternative_readings:
  - ‘화를 내었습니다’로 완화하기
  - ‘격노했습니다’로 더 고어적인 어휘 사용
  rationale: 본문은 우상숭배 현장을 본 즉각적이고 강한 감정 반응을 보여 주므로, 이를 약화하지 않고 한국어에서도 충분히 강하게 드러냈습니다.
  doctrine_reference: 출 32장 문맥상 언약 파기와 우상숭배에 대한 거룩한 분노
- issue: ‘돌판들’을 어떻게 이해할지
  chosen_reading: 언약 돌판이라는 문맥을 유지하면서 본문에는 단순히 ‘돌판들’로 두었습니다.
  alternative_readings:
  - ‘율법판’이라고 풀기
  - ‘언약의 돌판들’로 확장하기
  rationale: 이 절만으로는 추가 설명이 필요하지 않으며, 바로 앞뒤 문맥이 돌판의 의미를 이미 분명히 하므로 과잉 설명을 피했습니다.
  doctrine_reference: 출 24–32장의 시내 언약 서술
