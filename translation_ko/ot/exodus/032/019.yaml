revisions:
- from: 그가 진영에 가까이 이르러 그 송아지와 춤을 보고 모세의 분노가 타올랐습니다. 그는 자기 손에서 돌판들을 던져 산 밑에서 그것들을 깨뜨렸습니다.
  to: 그가 진영 가까이 이르렀을 때, 송아지와 춤추는 모습을 보고 모세의 분노가 타올랐습니다. 그는 손에서 판들을 내던져 산기슭에서 그것들을 깨뜨렸습니다.
  rationale: The revision removes the unstated addition ‘stone,’ improves the idiom for throwing the tablets from his hand, and renders the plural dancing naturally as ‘춤추는 모습’ without introducing an interpretive term such as ‘광란.’ It retains the source’s temporal sequence, vivid anger idiom, and location at the foot of the mountain.
  reviewer_model: gpt-5.6-terra
