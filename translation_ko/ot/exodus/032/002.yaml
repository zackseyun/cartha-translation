translation:
  language: ko
  text: 아론이 그들에게 말했습니다. “아내들과 아들들과 딸들의 귀에 달린 금 고리들을 빼내어[a] 나에게 가져오십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 פָּרַק은 ‘빼내다’보다 더 거칠게 ‘뜯어 내다’ 또는 ‘떼어 내다’라는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 아론이 이르렀습니다
  lexicon: HALOT
  rationale: 히브리어 서술 전개를 자연스러운 한국어 과거 서술로 옮기되, 불필요한 구어체를 피했습니다.
- source_word: פָּרְקוּ
  english_pob_choice: Take off
  chosen_korean: 빼어 내어
  alternatives_korean:
  - 벗어 내어
  - 벗기어
  - 뜯어 내어
  lexicon: HALOT
  rationale: 단순한 착용 해제가 아니라 몸에서 금속 장신구를 떼어 내라는 뉘앙스를 살리면서, 영어 POB의 강한 가능성(거칠게 떼어냄)을 반영했습니다.
- source_word: נִזְמֵי הַזָּהָב
  english_pob_choice: rings of gold
  chosen_korean: 금 고리들
  alternatives_korean:
  - 금붙이 고리들
  - 금반지들
  - 금 귀고리들
  lexicon: HALOT
  rationale: 히브리어의 ‘금의 고리들’ 구조를 살리되, 이어지는 ‘귀에 달린’ 구절과 충돌하지 않도록 가장 중립적인 ‘고리들’로 옮겼습니다.
- source_word: אֲשֶׁר בְּאָזְנֵי
  english_pob_choice: that are in the ears of
  chosen_korean: 귀에 달린
  alternatives_korean:
  - 귀에 있는
  - 귀 속에 있는
  lexicon: HALOT
  rationale: 한국어에서는 장신구가 귀에 ‘달리다’가 자연스러우며, 히브리어의 위치 표지를 생생하게 전달합니다.
- source_word: נְשֵׁיכֶם בְּנֵיכֶם וּבְנֹתֵיכֶם
  english_pob_choice: your wives, your sons, and your daughters
  chosen_korean: 아내들과 아들들과 딸들
  alternatives_korean:
  - 아내들과 자녀들과 딸들
  - 여인들과 아들들과 딸들
  lexicon: HALOT
  rationale: 히브리어가 관계를 나누어 구체적으로 열거하므로, ‘자녀들’로 일반화하지 않고 성별 구분을 유지했습니다.
- source_word: וְהָבִיאוּ אֵלַי
  english_pob_choice: and bring them to me
  chosen_korean: 나에게 가져오십시오
  alternatives_korean:
  - 나에게 데려오십시오
  - 내게 가져오십시오
  lexicon: HALOT
  rationale: 대상은 앞의 고리들이므로 한국어에서는 목적어를 자연스럽게 보충했고, 명령의 공적·요구적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 아론의 발화 방식과 명령형의 강도
  chosen_reading: 직설적 명령으로 옮겨, 우상 제작을 위한 금 수집 지시의 압박감을 분명히 했습니다.
  alternative_readings:
  - 완곡한 부탁체
  - 단순 안내문체
  rationale: 본문은 중립적 제안이 아니라 금을 모으게 하는 직접 명령이므로, 한국어에서도 그 긴장을 약화시키지 않는 것이 좋습니다.
  doctrine_reference: 본문 서사 문맥상의 죄와 우상숭배의 조성
