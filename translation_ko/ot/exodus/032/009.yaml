translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “내가 이 백성을 보았습니다. 보십시오, 이 백성은 목이 뻣뻣한 백성입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘목이 뻣뻣한’이라는 뜻이며, 완고함이나 저항을 가리키는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
