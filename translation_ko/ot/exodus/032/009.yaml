  - 내가 보아 왔습니다
  lexicon: WLC
  rationale: 완료의 현재 관련성을 살리면서도 한국어 문맥에서는 단정적 서술보다 이어지는 판단의 도입으로 ‘보았는데’를 사용해 자연스럽게 연결했습니다.
- source_word: קְשֵׁה עֹרֶף
  english_pob_choice: stiff-necked
  chosen_korean: 목이 곧은
  alternatives_korean:
  - 고집 센
  - 완고한
  - 목이 뻣뻣한
  lexicon: HALOT
  rationale: 히브리어 관용구의 직유를 보존해, 도덕적 평가를 완화한 ‘고집 센’보다 문자상 이미지를 드러내는 ‘목이 곧은’을 택했습니다.
theological_decisions:
- issue: 하나님의 책망을 드러내는 관용구 보존
  chosen_reading: ‘목이 곧은 백성’으로 옮겨, 단순한 ‘고집 센’보다 언약 공동체의 완고함을 더 직접적으로 드러냈습니다.
  alternative_readings:
  - 고집 센 백성
  - 완고한 백성
  rationale: 출애굽기 문맥에서 이 표현은 단순 성격 묘사가 아니라 하나님께 대한 저항과 언약 불순종의 평가이므로, 원문의 비유성을 유지하는 것이 중요합니다.
  doctrine_reference: 출애굽기 32장 문맥의 언약 불순종과 신적 책망
