  lexicon: WLC
  rationale: 서술 전개를 자연스럽게 살리되, 신적 발화의 품위를 유지하기 위해 ‘말씀하셨습니다’를 선택했습니다.
- source_word: רָאִיתִי
  english_pob_choice: I have seen
  chosen_korean: 내가 보았는데
  alternatives_korean:
