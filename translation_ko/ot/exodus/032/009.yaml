  rationale: 본문의 여호와 표기를 피하고, POB의 기본 방침에 따라 신명사 יְהוָה를 학술 전사인 ‘야훼’로 옮겼습니다.
- source_word: וַיֹּאמֶר ... אֶל מֹשֶׁה
  english_pob_choice: And Yahweh said to Moses
  chosen_korean: 야훼께서 모세에게 말씀하셨습니다
