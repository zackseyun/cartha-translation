  source_fidelity: ‘하시려던’은 야훼께서 재앙을 행할 의도를 가지셨다는 뜻은 전달하지만, 원문의 אֲשֶׁר דִּבֶּר(‘말씀하셨던’)를 생략합니다. 그 발화 행위를 본문에 명시하는 편이 원문에 더 충실합니다. רָעָה는 이 문맥에서 위협된 재앙을 뜻하므로 ‘재앙’이 자연스럽고 분명합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘재앙을 두고 뜻을 돌이키셨습니다’는 נחם על의 관계를 무리 없이 나타냅니다.
  terminology: 신명은 초안 및 POB 방침에 따라 ‘야훼’로 유지합니다. ‘재앙’은 כאן의 הָרָעָה를 도덕적 악으로 오해하지 않게 하면서도 심판 문맥을 충실히 반영합니다. 각주 b의 ‘하나님 안의 도덕적 악’은 부자연스럽고 모호하므로, 야훼께서 악을 행하신다는 의미가 아니라는 방식으로 고칩니다.
