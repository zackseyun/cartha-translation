  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּנָּ֖חֶם יְהוָ֑ה עַל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר לַ/עֲשׂ֥וֹת לְ/עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
  footnotes:
  - marker: a
    text: Or 'changed his mind' or 'was sorry' concerning the disaster he had spoken of bringing on his people.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the evil/disaster'; here it refers to threatened calamity or harm, not moral evil in God.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서는 자기 백성에게 하시려던 그 해를 두고 뜻을 돌이키셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뜻을 바꾸셨습니다’ 혹은 ‘후회하셨습니다’.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘그 악/재앙’입니다. 여기서는 하나님 안의 도덕적 악이 아니라, 백성에게 닥칠 경고된 재앙이나 해를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  english_pob_choice: relented
  chosen_korean: 뜻을 돌이키셨습니다
  alternatives_korean:
  - 후회하셨습니다
  - 마음을 바꾸셨습니다
  - 유감을 표하셨습니다
  lexicon: HALOT
  rationale: 문맥상 이미 선포된 심판을 거두시는 방향의 전환을 가리키므로, 하나님을 ‘후회’로 오해하게 하지 않으면서도 서술의 긴장을 살리는 ‘뜻을 돌이키다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 지침 표준 표기
  rationale: 문맥의 고유한 신명을 살리기 위해 통상적 대체어 ‘주’가 아니라 학술적 음역 ‘야훼’를 사용했습니다.
- source_word: הָרָעָה
  english_pob_choice: the harm
  chosen_korean: 그 해
  alternatives_korean:
  - 그 재앙
  - 그 악
  - 그 재난
  lexicon: HALOT
  rationale: 여기서 רָעָה는 하나님의 도덕적 악이 아니라 경고된 재앙·해악을 가리키므로, 현대 한국어에서 자연스럽고 오해를 줄이는 ‘해’로 옮겼습니다.
- source_word: לְעַמּוֹ
  english_pob_choice: to his people
  chosen_korean: 자기 백성에게
  alternatives_korean:
  - 그의 백성에게
  - 자기 백성을 향해
  lexicon: HALOT
  rationale: 문맥상 하나님의 언약 백성을 가리키며, 한국어에서 소속과 대상성을 함께 드러내는 ‘자기 백성에게’가 가장 자연스럽습니다.
theological_decisions:
- issue: נחם 동사의 신학적 긴장
  chosen_reading: 본문에는 하나님의 선포된 심판이 실제로 유보되는 서술을 살리되, 그 표현은 ‘뜻을 돌이키셨습니다’로 번역했습니다.
  alternative_readings:
  - 마음을 바꾸셨습니다
  - 후회하셨습니다
  rationale: 원문의 서사적 효과는 유지하되, 하나님께 무지나 오류를 암시할 수 있는 표현은 피해야 하므로, 독자가 긴장을 그대로 읽도록 하는 번역을 택했습니다.
  doctrine_reference: 하나님의 진실성과 본문의 서사적 긴장을 함께 보존
- issue: רָעָה의 의미 범위
  chosen_reading: ‘해’로 번역해, 하나님 안의 도덕적 악이 아니라 위협된 재앙/손해를 뜻함을 분명히 했습니다.
  alternative_readings:
  - 악
  - 재앙
  - 재난
  rationale: 한국어 ‘악’은 하나님을 대상으로 읽힐 위험이 크고, ‘재앙’은 가능하지만 다소 강한 단일 해석을 고정할 수 있어, 보다 중립적이면서도 문맥에 맞는 ‘해’를 선택했습니다.
  doctrine_reference: 하나님의 거룩하심과 심판 철회를 함께 반영
