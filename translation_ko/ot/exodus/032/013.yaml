base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
  footnotes:
  - marker: a
    text: Or, 'Jacob'—the patriarch later named Israel. The Hebrew text here reads 'Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 종들인 아브라함과 이삭과 이스라엘[a]을 기억해 주십시오. 주님 자신을 두고 그들에게 맹세하시며 말씀하셨습니다. ‘내가 너희 자손을 하늘의 별들처럼 많게 하겠고, 내가 말한 이 모든 땅을 너희 자손에게 주겠으며, 그들이 그것을 영원히 상속받을 것이다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여기서 ‘야곱’이 아니라 ‘이스라엘’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  english_pob_choice: Remember
  chosen_korean: 기억해 주십시오
  alternatives_korean:
  - 기억하십시오
  - 기억하여 주십시오
  lexicon: HALOT
  rationale: 하나님께 드리는 간구문이므로 공손한 청유형을 쓰되, 단순 정보 요청이 아니라 언약을 상기시켜 달라는 호소의 힘을 살렸습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 노예들
  - 당신의 하인들
  lexicon: HALOT
  rationale: 여기서는 사회적 속박보다 하나님께 속한 언약적 신분이 중심이므로, POB의 'servants'에 맞춰 '종들'이 가장 자연스럽습니다.
- source_word: וּלְיִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  lexicon: HALOT
  rationale: 히브리어 본문이 '이스라엘'이라서, 개명 이전 이름으로 바꾸지 않고 그대로 옮겨 언약 이름의 울림을 보존했습니다.
- source_word: בָּךְ
  english_pob_choice: by yourself
  chosen_korean: 당신 자신으로
  alternatives_korean:
  - 당신의 자신으로
  - 스스로
  lexicon: HALOT
  rationale: 맹세의 자기보증적 성격을 드러내는 표현이므로, '스스로'보다 맹세 수단을 분명히 보여 주는 '당신 자신으로'를 택했습니다.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  english_pob_choice: I will multiply your offspring
  chosen_korean: 내가 너희 씨를 … 많게 하겠고
  alternatives_korean:
  - 내가 너희 자손을 … 번성하게 하겠고
  - 내가 너희 후손을 … 많게 하겠고
  lexicon: HALOT
  rationale: זרע는 집합적 표현이므로 '씨'를 유지해 약속의 언약적·집합적 뉘앙스를 살렸고, 동사는 현대 한국어에서 자연스러운 '많게 하다'로 옮겼습니다.
theological_decisions:
- issue: 이삭과 이스라엘을 호명하는 족장 약속의 언어
  chosen_reading: '''이스라엘''을 본문대로 유지하고, 축약하지 않고 세 족장을 모두 나열했습니다.'
  alternative_readings:
  - 이스라엘을 야곱으로 바꾸기
  - 이름을 묶어 간단히 처리하기
  rationale: 본 절은 야곱의 새 이름인 '이스라엘'을 의도적으로 사용해 언약 기억을 환기하므로, 번역 전통보다 히브리어 본문의 명시성을 따랐습니다.
  doctrine_reference: 원문 우선 번역 원칙; 이름은 해석보다 본문 표면형을 우선 보존
