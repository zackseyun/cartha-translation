revisions:
- from: 아브라함과 이삭과 이스라엘, 당신의 종들을 기억해 주십시오. 당신 자신으로 맹세하시고 그들에게 말씀하시기를, ‘내가 너희 씨를 하늘의 별들처럼 많게 하겠고, 내가 말한 이 모든 땅을 너희 씨에게 주리니 그들이 영원히 그것을 기업으로 삼을 것이다’ 하셨습니다.[a]
  to: 주님의 종들인 아브라함과 이삭과 이스라엘[a]을 기억해 주십시오. 주님 자신을 두고 그들에게 맹세하시며 말씀하셨습니다. ‘내가 너희 자손을 하늘의 별들처럼 많게 하겠고, 내가 말한 이 모든 땅을 너희 자손에게 주겠으며, 그들이 그것을 영원히 상속받을 것이다.’
  rationale: 'The revision makes the Korean idiomatic and modern-formal while retaining the original-language distinctions: Israel remains Israel; the oath is explicitly by God’s own self; offspring remains collective; and the land is inherited forever. The footnote is retained but anchored directly to the name it explains.'
