review_pass:
  verdict: revise
  source_fidelity: The draft preserves the three patriarchal names, God's self-attesting oath, the multiplication and land promises, and the perpetual inheritance. However, the Korean wording for the oath is not idiomatic, and the wording for offspring and inheritance is unnecessarily archaic or literalistic for modern standard Korean. The revised wording retains the Hebrew clause sequence, especially the distinct wording ‘all this land that I said’ followed by ‘I will give.’
  naturalness: ‘당신 자신으로 맹세하시고’ is unnatural Korean; ‘주님 자신을 두고 … 맹세하시며’ naturally expresses an oath sworn by oneself. ‘너희 씨’ and ‘기업으로 삼을 것이다’ are understandable biblicalisms but are not the most natural modern formal Korean. ‘너희 자손’ and ‘상속받을 것이다’ are clear while retaining the collective-descendant and inheritance senses.
  terminology: ‘이스라엘’ must remain in the text rather than being harmonized to ‘야곱.’ ‘종들,’ ‘자손,’ and ‘상속받다’ appropriately convey covenant servants, collective offspring, and inheriting the land. Using ‘주님’ in the direct address is idiomatic Korean prayer language and makes the source’s second-person possessive natural without adding a doctrinal interpretation.
  issues:
  - severity: medium
    issue: ‘당신 자신으로 맹세하시고’ is unidiomatic.
    rationale: Korean normally says that one swears ‘자신을 두고’ or ‘스스로.’ ‘주님 자신을 두고’ preserves the explicit self-oath force of בָּךְ more naturally.
  - severity: medium
    issue: ‘너희 씨’ and ‘기업으로 삼을 것이다’ are overly literal/archaic for the stated modern Korean target.
    rationale: ‘씨’ is not natural for human descendants in this context, and ‘기업’ is now chiefly commercial vocabulary. ‘자손’ and ‘상속받다’ communicate the collective offspring and inheritance senses in current standard Korean.
  - severity: low
    issue: The footnote marker is placed at the end of the verse instead of on ‘이스라엘.’
    rationale: The note concerns the name Israel versus Jacob, so its anchor should immediately follow ‘이스라엘.’
  revised_text: 주님의 종들인 아브라함과 이삭과 이스라엘[a]을 기억해 주십시오. 주님 자신을 두고 그들에게 맹세하시며 말씀하셨습니다. ‘내가 너희 자손을 하늘의 별들처럼 많게 하겠고, 내가 말한 이 모든 땅을 너희 자손에게 주겠으며, 그들이 그것을 영원히 상속받을 것이다.’
