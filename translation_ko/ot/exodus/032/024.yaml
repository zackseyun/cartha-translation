  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
  footnotes:
  - marker: a
    text: Or, 'Who has gold? Tear it off.' The Hebrew literally reads, 'To whom is gold? Break off/remove [it].'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들에게 말했습니다. ‘금 장신구가 있는 사람은 그것을 벗으십시오.’ 그러자 그들이 그것을 내게 주었고, 나는 그것을 불에 던졌더니 이 송아지가 나왔습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금이 있는 사람이 누구입니까? 그것을 떼어 내십시오.’ 히브리어는 문자적으로 ‘누구에게 금이 있습니까? [그것을] 떼어 내라/벗겨 내라’입니다.
    reason: lexical_alternative
