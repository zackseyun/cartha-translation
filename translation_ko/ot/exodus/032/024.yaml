- source_word: לְמִי זָהָב הִתְפָּרָקוּ
  english_pob_choice: Whoever has gold, take it off
  chosen_korean: 금이 있는 사람은 그것을 벗으십시오
  alternatives_korean:
  - 누구든지 금을 가진 사람은 그것을 벗으십시오
