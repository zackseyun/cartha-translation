source:
  edition: WLC
  text: וָ/אֹמַ֤ר לָ/הֶם֙ לְ/מִ֣י זָהָ֔ב הִתְפָּרָ֖קוּ וַ/יִּתְּנוּ לִ֑/י וָ/אַשְׁלִכֵ֣/הוּ בָ/אֵ֔שׁ וַ/יֵּצֵ֖א הָ/עֵ֥גֶל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
  footnotes:
  - marker: a
    text: Or, 'Who has gold? Tear it off.' The Hebrew literally reads, 'To whom is gold? Break off/remove [it].'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들에게 말했습니다. ‘금이 있는 사람은 그것을 벗으십시오.’ 그들이 그것을 내게 주었고, 나는 그것을 불에 던졌더니, 이 송아지가 나왔습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금이 있는 사람은? 그것을 뜯어 내십시오.’ 히브리어는 문자적으로 ‘누구에게 금이 있느냐? [그것을] 떼어 내라/벗겨 내라’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר לָהֶם
  english_pob_choice: And I said to them
  chosen_korean: 나는 그들에게 말했습니다
  alternatives_korean:
  - 그리고 나는 그들에게 말했습니다
  - 그들에게 말했습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 순서를 살리되, 한국어에서는 자연스러운 과거 서술로 옮겼습니다.
- source_word: לְמִי זָהָב הִתְפָּרָקוּ
  english_pob_choice: Whoever has gold, take it off
  chosen_korean: 금이 있는 사람은 그것을 벗으십시오
  alternatives_korean:
  - 누구든지 금을 가진 사람은 그것을 벗으십시오
  - 금이 있는 사람은 그것을 떼어 내십시오
  lexicon: HALOT
  rationale: 직역의 '누구에게 금이 있느냐'보다 소유 의미를 드러내는 한국어로 옮기되, 금 장신구를 몸에서 벗는 동작을 살렸습니다.
- source_word: וַיִּתְּנוּ לִי
  english_pob_choice: So they gave it to me
  chosen_korean: 그들이 그것을 내게 주었고
  alternatives_korean:
  - 그래서 그들이 그것을 내게 주었고
  - 그들이 그것을 내게 주었습니다
  lexicon: HALOT
  rationale: 앞 절의 금을 가리키는 목적어를 한국어에서 보충해 문맥 연결을 분명히 했습니다.
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  english_pob_choice: and I threw it into the fire
  chosen_korean: 나는 그것을 불에 던졌더니
  alternatives_korean:
  - 나는 그것을 불속에 던졌고
  - 나는 그것을 불에 던졌습니다
  lexicon: HALOT
  rationale: שלך의 기본 의미를 따라 '던지다'로 옮기고, 뒤의 결과절과 연결되도록 한국어에서는 '-더니'를 사용했습니다.
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  english_pob_choice: and this calf came out
  chosen_korean: 이 송아지가 나왔습니다
  alternatives_korean:
  - 이 송아지가 나왔습니다
  - 이 송아지가 나와 버렸습니다
  lexicon: HALOT
  rationale: עֵגֶל을 문맥상 일반적으로 통용되는 '송아지'로 옮겨 우상 제작 맥락을 살렸습니다.
theological_decisions:
- issue: 아론의 변명조의 서술을 어떻게 처리할지
  chosen_reading: 문맥의 아이러니를 드러내되, 본문에 없는 해설을 덧붙이지 않고 아론의 말을 그대로 전달했습니다.
  alternative_readings:
  - 풍자적으로 의역하여 아론의 회피를 노출하는 번역
  - 주석적 표현을 본문에 삽입하는 번역
  rationale: 본문은 아론의 보고를 직접 인용하므로, 번역은 그 회피적 톤을 유지하면서 독자가 문맥에서 판단하도록 두는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 본문 우선, 해석은 과도하게 본문에 주입하지 않음'
