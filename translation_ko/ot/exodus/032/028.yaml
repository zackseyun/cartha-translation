base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
  footnotes:
  - marker: a
    text: Hebrew 'fell,' a common idiom for dying or being struck down; alternatively, 'were killed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레위의 아들들이 모세의 말대로 행하였고, 그날 백성 가운데서 약 삼천 명이 쓰러졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘쓰러지다’는 죽음이나 치명적 타격을 가리키는 흔한 관용 표현입니다. 다른 번역 가능성으로는 ‘죽임을 당하다’가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  english_pob_choice: did
  chosen_korean: 행하였고
  alternatives_korean:
  - 하였고
  - 실행하였고
  - 따랐고
  lexicon: HALOT
  rationale: 히브리어 עשה의 넓은 뜻을 살리면서, 한국어에서는 모세의 말에 실제로 순종하여 행동했다는 뜻을 자연스럽게 드러내기 위해 ‘행하다’를 택했습니다.
- source_word: בְנֵי לֵוִי
  english_pob_choice: the sons of Levi
  chosen_korean: 레위의 아들들
  alternatives_korean:
  - 레위 사람들
  - 레위 지파 사람들
  - 레위인들
  lexicon: HALOT
  rationale: 직역에 가까운 משפחה 표현을 살려 ‘레위의 아들들’로 옮겼습니다. ‘레위인들’은 의미상 가능하지만, 원문의 친족 표현을 덜 보존합니다.
- source_word: כִּדְבַר מֹשֶׁה
  english_pob_choice: according to the word of Moses
  chosen_korean: 모세의 말대로
  alternatives_korean:
  - 모세의 말씀대로
  - 모세가 말한 대로
  - 모세의 명대로
  lexicon: HALOT
  rationale: כְּ־ + דְבַר은 단순한 발화만이 아니라 명령/지시의 뉘앙스를 가질 수 있으므로, 한국어에서는 ‘말대로’가 가장 자연스럽게 그 종속 관계를 드러냅니다.
- source_word: וַיִּפֹּל ... כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  english_pob_choice: about three thousand men ... fell
  chosen_korean: 약 삼천 명이 쓰러졌습니다
  alternatives_korean:
  - 약 삼천 명이 죽었습니다
  - 약 삼천 명이 쓰러졌습니다
  - 약 삼천 명이 쓰러져 죽었습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘죽이다’가 아니라 ‘떨어지다/쓰러지다’라는 관용구를 사용하므로, POB의 ‘fell’을 따라 ‘쓰러졌습니다’로 옮겨 사역적 해석을 과도하게 추가하지 않았습니다.
theological_decisions:
- issue: Judgment idiom in the casualty report
  chosen_reading: ‘쓰러졌습니다’로 옮겨 죽음의 결과를 암시하되, 원문의 관용적 표현을 유지했습니다.
  alternative_readings:
  - ‘죽었습니다’로 명시적으로 옮김
  - ‘살해되었습니다’로 원인까지 분명히 함
  rationale: 본문은 מצב을 직접 설명하기보다 관용적으로 결과를 말하므로, 한국어도 그 긴장감을 유지하는 것이 적절합니다. 이는 사건의 엄중함을 약화시키지 않으면서도 원문을 넘는 해석을 피합니다.
  doctrine_reference: Translation philosophy §§1, 3, 4, 6
