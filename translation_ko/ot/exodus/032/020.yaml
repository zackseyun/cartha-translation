id: EXO.32.20
reference: Exodus 32:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת הָ/עֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַ/יִּשְׂרֹ֣ף בָּ/אֵ֔שׁ וַ/יִּטְחַ֖ן עַ֣ד אֲשֶׁר דָּ֑ק וַ/יִּ֨זֶר֙ עַל פְּנֵ֣י הַ/מַּ֔יִם וַ/יַּ֖שְׁקְ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
  footnotes:
  - marker: a
    text: Or, 'made the Israelites drink it.' The Hebrew reads 'the sons of Israel,' a standard covenantal designation for the people as a whole.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들이 만든 송아지를 가져다가 불에 태우고, 그것을 잘게 갈아 물 위에 뿌린 뒤, 이스라엘 자손들에게[a] 마시게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '이스라엘의 아들들'이라고 하며, 이는 백성 전체를 가리키는 언약적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: הָעֵגֶל
  english_pob_choice: the calf
  chosen_korean: 송아지
  alternatives_korean:
  - 송아지 형상
  - 어린 황소
  lexicon: HALOT
  rationale: עֵגֶל은 기본적으로 송아지/어린 소를 뜻하며, 금송아지 사건의 우상이라는 맥락에서 한국어로는 자연스럽게 '송아지'가 가장 직접적입니다.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  english_pob_choice: burned it with fire
  chosen_korean: 불에 태우고
  alternatives_korean:
  - 불로 태우고
  - 불속에서 태우고
  lexicon: HALOT
  rationale: 동사와 전치사의 결합을 한국어에서 가장 자연스럽게 옮기면 '불에 태우다'입니다. POB의 수정 취지처럼 수단을 분명히 드러냅니다.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  english_pob_choice: ground it until it was fine
  chosen_korean: 잘게 갈아
  alternatives_korean:
  - 아주 고운 가루가 될 때까지 갈아
  - 잘게 부수어
  lexicon: HALOT
  rationale: טחן의 핵심은 '갈다/분쇄하다'이고, דק은 '가늘다, 고와지다'의 뜻이므로 결과를 과하게 풀이하지 않으면서도 '잘게 갈아'로 충분히 전달됩니다.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: made the sons of Israel drink it
  chosen_korean: 이스라엘 자손들에게 마시게 했습니다
  alternatives_korean:
  - 이스라엘 사람들에게 마시게 했습니다
  - 이스라엘의 아들들에게 마시게 했습니다
  lexicon: HALOT
  rationale: 히필형은 사역 의미이므로 '마시게 하다'가 적절합니다. בְּנֵי יִשְׂרָאֵל은 언약적 집합명칭이지만, 한국어에서는 성별을 과도하게 드러내지 않으면서도 원문의 집합성을 유지하는 '이스라엘 자손들'이 자연스럽습니다.
theological_decisions:
- issue: 금송아지 우상의 파괴와 수치 부과의 서술 방식
  chosen_reading: 행위의 연속을 직설적으로 제시해 우상을 완전히 무력화하고, 그 잔해를 백성에게 마시게 하는 수치의 강도를 그대로 드러냈습니다.
  alternative_readings:
  - 상징적으로 완곡하게 풀어 쓰는 방식
  - '''먹게 했다''처럼 의역하는 방식'
  rationale: 히브리어는 파괴-분쇄-산포-강제 음용의 물리적 연쇄를 강조하므로, 한국어도 그 폭력성과 모욕성을 약화하지 않도록 직선적으로 옮기는 것이 본문의 의도에 부합합니다.
  doctrine_reference: 출애굽기 32장의 우상 숭배 심판 서술
