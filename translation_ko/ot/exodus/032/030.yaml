  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''You have sinned a great sin,'' a cognate expression that intensifies the seriousness of the offense.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다음 날에 모세가 백성에게 말했습니다. 「너희는 큰 죄를 지었습니다. 이제 내가 야훼께 올라가서, 어쩌면 너희의 죄를 속죄할 수 있을지도 모릅니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 죄를 지었습니다’는 히브리어의 동족 목적어 표현으로, 죄의 심각성을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  english_pob_choice: And it happened on the next day
  chosen_korean: 그리고 다음 날에
  alternatives_korean:
  - 그리고 이튿날
  - 그다음 날에
  lexicon: HALOT
  rationale: 서사 전환을 자연스럽게 살리되, זמני 표현의 순서를 유지하기 위해 ‘그리고 다음 날에’로 옮겼습니다.
- source_word: חֲטָאתֶם חֲטָאָה גְדֹלָה
  english_pob_choice: You have sinned a great sin
  chosen_korean: 너희는 큰 죄를 지었습니다
  alternatives_korean:
  - 너희는 큰 죄를 범했습니다
  - 너희는 큰 죄를 지어버렸습니다
  lexicon: HALOT
  rationale: 히브리어의 동족 목적어 구문이 죄의 중대성을 강조하므로, ‘큰 죄’로 그 반복과 강도를 살렸습니다.
- source_word: אֶעֱלֶה אֶל יְהוָה
  english_pob_choice: I will go up to Yahweh
  chosen_korean: 내가 야훼께 올라가서
  alternatives_korean:
  - 내가 야훼께 올라가겠습니다
  - 내가 야훼께 올라가
  lexicon: HALOT
  rationale: עלה의 기본 뜻인 ‘올라가다’를 유지했고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֲכַפְּרָה
  english_pob_choice: perhaps I can make atonement
  chosen_korean: 어쩌면 … 속죄할 수 있을지도 모릅니다
  alternatives_korean:
  - 어쩌면 … 속죄할 수 있습니다
  - 어쩌면 … 속죄하겠습니다
  lexicon: HALOT
  rationale: כפר의 제의적 의미를 따라 ‘속죄하다’로 옮기되, אוּלַי가 주는 불확실성을 ‘어쩌면 … 수 있을지도 모릅니다’로 반영했습니다.
- source_word: חַטַּאתְכֶם
  english_pob_choice: your sin
  chosen_korean: 너희의 죄
  alternatives_korean:
  - 너희의 죄과
  - 너희의 허물
  lexicon: HALOT
  rationale: 문맥상 제물(속죄제)이 아니라 백성의 실제 죄를 가리키므로, 직접적이고 현대적인 ‘죄’를 택했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 여호와 신명은 титулат이 아니라 고유명을 가리키므로, 문맥을 흐리는 대체 표현보다 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 모세의 속죄 시도에 담긴 불확실성
  chosen_reading: 어쩌면 너희의 죄를 속죄할 수 있을지도 모릅니다
  alternative_readings:
  - 어쩌면 너희의 죄를 속죄할 수 있습니다
  - 너희의 죄를 속죄하겠습니다
  rationale: 히브리어의 אוּלַי가 보장보다 희망과 가능성을 나타내므로, 모세의 중보가 확정적 효력을 가진다고 단정하지 않도록 불확실성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
