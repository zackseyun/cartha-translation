id: EXO.32.5
reference: Exodus 32:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣רְא אַהֲרֹ֔ן וַ/יִּ֥בֶן מִזְבֵּ֖חַ לְ/פָנָ֑י/ו וַ/יִּקְרָ֤א אַֽהֲרֹן֙ וַ/יֹּאמַ֔ר חַ֥ג לַ/יהוָ֖ה מָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
  footnotes:
  - marker: a
    text: Or “before him”; the Hebrew pronoun could grammatically refer to Aaron, though the context more likely points to the calf.
    reason: alternative_reading
translation:
  language: ko
  text: 아론이 그것을 보고 제단을 그 앞에 쌓았습니다. 그리고 아론이 선포하며 말했습니다. “내일은 야훼를 위한 절기입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그것’은 앞선 문맥의 금송아지를 가리킬 가능성이 가장 큽니다. 히브리어 대명사는 문법상 아론을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘야훼’는 히브리어 고유명 יהוה를 옮긴 표기입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: When Aaron saw it
  chosen_korean: 아론이 그것을 보고
  alternatives_korean:
  - 아론이 보았습니다
  - 아론이 그것을 보자
  lexicon: HALOT
  rationale: 시작 접속과 동사의 시점을 자연스럽게 살리되, 바로 앞 문맥의 송아지를 가리키는 대상을 한국어에서는 ‘그것’으로 드러냈습니다.
- source_word: וַיִּבֶן מִזְבֵּחַ
  english_pob_choice: he built an altar
  chosen_korean: 제단을 그 앞에 쌓았습니다
  alternatives_korean:
  - 제단을 지었습니다
  - 제단을 세웠습니다
  lexicon: HALOT
  rationale: מִזְבֵּחַ는 예배 맥락의 제단이므로 ‘쌓다’가 한국어 성경 문맥에서 가장 자연스럽고, לְפָנָיו는 ‘그 앞에’로 옮겨 대상을 직접 지시했습니다.
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  english_pob_choice: Then Aaron proclaimed and said
  chosen_korean: 아론이 선포하며 말했습니다
  alternatives_korean:
  - 아론이 외치며 말했습니다
  - 아론이 공포하며 말했습니다
  lexicon: HALOT
  rationale: 공적인 발표를 뜻하는 קרא의 기능을 살려 ‘선포하다’를 택했고, 이어지는 ‘말하다’를 붙여 연속 동작을 보존했습니다.
- source_word: חַג
  english_pob_choice: a feast
  chosen_korean: 절기
  alternatives_korean:
  - 잔치
  - 축제
  lexicon: HALOT
  rationale: חַג는 단순한 식사보다 예배적·절기적 의미가 강해 ‘절기’가 가장 적절합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼를 위한
  alternatives_korean:
  - 야훼께 드리는
  - 야훼께
  lexicon: HALOT
  rationale: 목적/귀속을 나타내는 ל를 한국어에서는 자연스럽게 ‘-를 위한’으로 풀어, 여호와가 아닌 야훼라는 고유명을 유지했습니다.
theological_decisions:
- issue: לְפָנָיו의 지시 대상
  chosen_reading: ‘그 앞에’는 직전 문맥의 송아지를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 아론 앞에 제단을 쌓았다는 뜻으로 읽을 수 있습니다.
  rationale: 문법상 아론도 가능하지만, 바로 앞에서 만든 송아지가 가장 강한 문맥적 지시 대상이므로 우상 앞에 제단을 세운 장면으로 번역했습니다.
  doctrine_reference: 문맥 우선 원칙; 우상 숭배 장면의 서술 명료화
