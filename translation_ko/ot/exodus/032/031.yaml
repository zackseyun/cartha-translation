source:
  edition: WLC
  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אָ֣נָּ֗א חָטָ֞א הָ/עָ֤ם הַ/זֶּה֙ חֲטָאָ֣ה גְדֹלָ֔ה וַ/יַּֽעֲשׂ֥וּ לָ/הֶ֖ם אֱלֹהֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
  footnotes:
  - marker: a
    text: Or 'they made a god of gold for themselves.' The Hebrew reads 'gods of gold' (plural), though some understand it as referring to the golden calf in the singular because of the broader context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 야훼께 돌아와 말했습니다. 「부디, 이 백성은 큰 죄를 지었고, 자기들을 위하여 금으로 된 신들을 만들었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기를 위하여 금으로 된 신 하나를 만들었습니다.’ 히브리어는 ‘금의 신들’(복수형)로 읽지만, 더 넓은 문맥 때문에 황금 송아지 하나를 가리킨다고 이해하는 이들도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아와
  alternatives_korean:
  - 돌아갔습니다
  - 되돌아왔습니다
  lexicon: HALOT
  rationale: שׁוב의 완료 서술을 자연스럽게 살리면서, 모세가 다시 야훼께 나아가는 동작을 간결하게 표현했습니다.
- source_word: אֶל יְהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 원문의 신명기적 이름 יהוה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 방향격은 ‘-께’로 처리했습니다.
- source_word: אָ֣נָּא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 청컨대
  lexicon: HALOT
  rationale: 간청의 뉘앙스를 현대 한국어로 자연스럽게 살리면서도, 모세의 중재적 호소를 과장하지 않도록 했습니다.
- source_word: הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  english_pob_choice: this people has sinned a great sin
  chosen_korean: 이 백성은 큰 죄를 지었고
  alternatives_korean:
  - 이 백성은 큰 죄를 범했고
  - 이 백성은 큰 죄를 저질렀고
  lexicon: HALOT
  rationale: 히브리어의 ‘죄하다/큰 죄’ 반복을 한국어에서 직접 반복하면 어색해져, ‘큰 죄를 지었다’로 의미를 응축해 전달했습니다.
- source_word: אֱלֹהֵי זָהָב
  english_pob_choice: gods of gold
  chosen_korean: 금으로 된 신들
  alternatives_korean:
  - 금의 신들
  - 황금 신들
  - 금 신들
  lexicon: HALOT
  rationale: 문법상 복수형 ‘신들’을 보존하면서, ‘금으로 된’으로 금속 재료를 분명히 했습니다. 영문 주해의 복수 대안을 반영해 단수로 조화시키지 않았습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 절은 신명기적 이름 יהוה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유 신명인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: אֱלֹהֵי זָהָב의 복수 유지
  chosen_reading: 금으로 된 신들
  alternative_readings:
  - 금으로 된 신
  - 황금 송아지
  rationale: 본문은 복수형 ‘신들’을 쓰며, 영문 POB도 이를 단수로 완화하지 않고 주석으로 긴장을 보존합니다. 문맥상 송아지가 배경이더라도 본문의 복수 표현을 우선 반영했습니다.
  doctrine_reference: Source-language plurality in Exod 32:31
