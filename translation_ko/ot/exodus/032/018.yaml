  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
  footnotes:
  - marker: a
    text: Or “the sound of shouting.” The Hebrew forms from ענה can denote vocal response or shouting; the final clause may also be rendered more generally as “the sound of shouting I hear.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “이것은 승리의 외침도 아니고 패배의 외침도 아닙니다. 내가 듣는 것은 노랫소리[a]입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “외치는 소리”로 옮길 수 있습니다. 히브리어 ענה에서 나온 이 형태들은 응답이나 외침을 뜻할 수 있으며, 마지막 절은 더 일반적으로 “내가 듣는 것은 외치는 소리입니다”로도 번역할 수 있습니다.
    reason: lexical_alternative
