- source_word: חֲלוּשָׁה
  english_pob_choice: defeat
  chosen_korean: 패배
  alternatives_korean:
  - 약함
  - 허약함
  lexicon: HALOT
  rationale: 문맥상 גְּבוּרָה와 대조되는 군사적 소음의 범주이므로, 단순한 ‘약함’보다 결과를 드러내는 ‘패배’가 더 적절합니다.
- source_word: קוֹל עַנּוֹת אָנֹכִי שֹׁמֵעַ
  english_pob_choice: I hear the sound of singing
  chosen_korean: 내가 노래 소리를 듣습니다
  alternatives_korean:
  - 내가 외치는 소리를 듣습니다
  - 내가 노랫소리를 듣습니다
  lexicon: HALOT
  rationale: 같은 자음군 ענה가 마지막 절에서는 축제성 있는 소리, 곧 ‘노래’로 읽히는 POB의 문맥 판단을 반영했습니다.
theological_decisions:
- issue: 같은 어근 ענה의 세 번 반복을 한국어에서 어떻게 처리할지
  chosen_reading: 앞의 두 번은 전투적 ‘외침 소리’, 마지막은 ‘노래 소리’로 구분해 옮겼습니다.
  alternative_readings:
  - 모두 ‘외침’으로 통일
  - 모두 ‘소리’로 평준화
  rationale: 본문의 대조는 전투 승패의 소리와 우상 숭배의 흥청거림을 구분하는 데 있으므로, 한국어에서도 의미 대비가 드러나도록 차이를 유지했습니다.
  doctrine_reference: 본문 해석의 문맥적 구분
