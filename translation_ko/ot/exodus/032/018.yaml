  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְ/אֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
  footnotes:
  - marker: a
    text: Or “the sound of shouting.” The Hebrew forms from ענה can denote vocal response or shouting; the final clause may also be rendered more generally as “the sound of shouting I hear.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a]. 「이것은 승리의 외침 소리도 아니고, 패배의 외침 소리도 아닙니다. 내가 노래 소리를 듣습니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “외치는 소리”로 옮길 수 있습니다. 히브리어 ענה의 형태는 응답이나 외침을 뜻할 수 있으며, 마지막 절은 더 일반적으로 “외치는 소리”로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר / english POB 'And he said'
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말하였습니다
  lexicon: WLC narrative wayyiqtol
  rationale: 히브리어 서술 흐름을 살리되, 한국어에서는 자연스러운 서술체인 ‘말했습니다’를 택해 과도한 직역 느낌을 줄였습니다.
- source_word: אֵין קוֹל עֲנוֹת גְּבוּרָה
  english_pob_choice: the sound of a cry of victory
  chosen_korean: 승리의 외침 소리
  alternatives_korean:
  - 승리의 울부짖음 소리
  - 용맹의 외침 소리
  lexicon: HALOT
  rationale: עֲנוֹת를 여기서는 전투적 ‘외침’으로 이해한 POB의 판단을 따르되, גְּבוּרָה를 ‘승리’로 옮겨 대비를 분명하게 했습니다.
- source_word: חֲלוּשָׁה
  english_pob_choice: defeat
  chosen_korean: 패배
  alternatives_korean:
  - 약함
  - 허약함
  lexicon: HALOT
  rationale: 문맥상 גְּבוּרָה와 대조되는 군사적 소음의 범주이므로, 단순한 ‘약함’보다 결과를 드러내는 ‘패배’가 더 적절합니다.
- source_word: קוֹל עַנּוֹת אָנֹכִי שֹׁמֵעַ
  english_pob_choice: I hear the sound of singing
  chosen_korean: 내가 노래 소리를 듣습니다
  alternatives_korean:
  - 내가 외치는 소리를 듣습니다
  - 내가 노랫소리를 듣습니다
  lexicon: HALOT
  rationale: 같은 자음군 ענה가 마지막 절에서는 축제성 있는 소리, 곧 ‘노래’로 읽히는 POB의 문맥 판단을 반영했습니다.
theological_decisions:
- issue: 같은 어근 ענה의 세 번 반복을 한국어에서 어떻게 처리할지
  chosen_reading: 앞의 두 번은 전투적 ‘외침 소리’, 마지막은 ‘노래 소리’로 구분해 옮겼습니다.
  alternative_readings:
  - 모두 ‘외침’으로 통일
  - 모두 ‘소리’로 평준화
  rationale: 본문의 대조는 전투 승패의 소리와 우상 숭배의 흥청거림을 구분하는 데 있으므로, 한국어에서도 의미 대비가 드러나도록 차이를 유지했습니다.
  doctrine_reference: 본문 해석의 문맥적 구분
