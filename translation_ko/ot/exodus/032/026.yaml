source:
  edition: WLC
  text: וַ/יַּעֲמֹ֤ד מֹשֶׁה֙ בְּ/שַׁ֣עַר הַֽ/מַּחֲנֶ֔ה וַ/יֹּ֕אמֶר מִ֥י לַ/יהוָ֖ה אֵלָ֑/י וַ/יֵּאָסְפ֥וּ אֵלָ֖י/ו כָּל בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Who is for the LORD? To me!'' The translation makes explicit the implied summons: ''come to me.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'all the Levites.' Literally, 'all the sons of Levi.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 진영의 문에 서서 말했습니다. 「누구든지 야훼 편에 있는 사람은, 내게로 오십시오。」 그러자 레위의 모든 아들들이 그에게 모여들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘야훼 편이 누구냐? 내게로!’에 가깝습니다. 한국어에서는 소집의 뜻을 분명히 하려고 동작을 보충했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘레위의 아들들’입니다. POB는 남성 친족 표현을 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  english_pob_choice: stood
  chosen_korean: 서서
  alternatives_korean:
  - 섰습니다
  - 자리를 잡고 섰습니다
  lexicon: HALOT
  rationale: 서다의 서술적 진행을 자연스럽게 살려, 모세가 문 앞에 ‘서 있는’ 장면을 간결하게 표현했습니다.
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  english_pob_choice: at the gate of the camp
  chosen_korean: 진영의 문에
  alternatives_korean:
  - 진영의 성문에
  - 진영의 입구에
  lexicon: HALOT
  rationale: שַׁעַר는 단순한 입구보다 구체적인 ‘문/성문’이 더 가깝기 때문에, 진영의 경계 지점을 드러내는 ‘문에’로 옮겼습니다.
- source_word: מִי לַיהוָה אֵלַי
  english_pob_choice: Whoever is for Yahweh, come to me
  chosen_korean: 누구든지 야훼 편에 있는 사람은, 내게로 오십시오
  alternatives_korean:
  - 누가 야훼 편입니까? 내게로 오십시오
  - 야훼 편에 있는 자는 내게로 오십시오
  lexicon: HALOT
  rationale: 문맥상 단순 질문이 아니라 충성 여부를 가르는 호소이므로, ‘누구든지…있는 사람은’으로 소환의 뜻을 분명히 했습니다. אֵלַי는 한국어에서 필요한 최소 동작을 보충해 ‘내게로 오십시오’로 옮겼습니다.
- source_word: כָּל בְּנֵי לֵוִי
  english_pob_choice: all the sons of Levi
  chosen_korean: 레위의 모든 아들들
  alternatives_korean:
  - 모든 레위 사람들
  - 레위인들 모두
  lexicon: HALOT
  rationale: 히브리어의 남성 친족 표현을 그대로 살려, tribal designation을 완화하지 않고 ‘레위의 모든 아들들’로 번역했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기를 가리키는 호칭이 아니라 여호와의 고유 이름을 직접 사용하므로, 프로젝트 기준에 따라 ‘야훼’로 일관되게 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 모세의 호소문 구조
  chosen_reading: 명령형에 가까운 소집 호소로 처리
  alternative_readings:
  - 직접 질문으로 처리
  - 단순 초청으로 처리
  rationale: 히브리어 מִי לַיהוָה 뒤의 אֵלַי를 문맥상 보충해, 정보 질문이 아니라 진영 내 결단을 요구하는 공개적 소집으로 읽는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 'English POB audit trail: lexical rationale for מִי לַיהוָה אֵלַי'
