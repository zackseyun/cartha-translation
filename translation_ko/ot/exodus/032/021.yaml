translation:
  language: ko
  text: 모세가 아론에게 말했습니다. “이 백성이 당신에게 무엇을 하였기에, 당신은 그들이 큰 죄를 저지르게 했습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: WLC/HALOT
  rationale: 서사문의 wayyiqtol을 자연스러운 과거 서술로 옮기되, 현대 한국어의 합쇼체에 맞게 ‘말했습니다’로 처리했습니다.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  english_pob_choice: What did this people do to you
  chosen_korean: 이 백성이 당신에게 무엇을 했기에
  alternatives_korean:
  - 이 백성이 당신에게 무엇을 했습니까
  - 이 백성이 당신에게 무슨 짓을 했기에
  lexicon: WLC/HALOT
  rationale: מֶה의 질문성과 הַזֶּה의 지시성을 살려 ‘이 백성’으로 옮기고, לְךָ는 직접적인 피해 대상을 나타내는 ‘당신에게’로 처리했습니다.
- source_word: כִּי
  english_pob_choice: that
  chosen_korean: 기에
  alternatives_korean:
  - 어서
  - 왜냐하면
  lexicon: WLC/HALOT
  rationale: 여기서 כִּי는 결과를 이끄는 논리적 연결로 기능하므로, 한국어에서는 원인-결과를 잇는 ‘-기에’로 자연스럽게 반영했습니다.
- source_word: הֵבֵאתָ עָלָיו חֲטָאָה גְדֹלָה
  english_pob_choice: you have brought a great sin upon them
  chosen_korean: 당신이 그들에게 큰 죄를 가져왔습니까
  alternatives_korean:
  - 당신이 그들에게 큰 죄를 가져오셨습니까
  - 당신이 그들에게 큰 죄를 씌웠습니까
  lexicon: WLC/HALOT
  rationale: הֵבֵאתָ의 ‘가져오다’ 의미를 살려 ‘가져왔습니까’로 옮기고, חֲטָאָה גְדֹלָה는 문자적으로 ‘큰 죄’로 유지해 책임의 무게를 약화시키지 않았습니다.
theological_decisions:
- issue: Aaron의 책임 진술
  chosen_reading: 본문이 아론이 백성에게 ‘큰 죄’를 가져왔다고 직접 비난하는 표현을 유지했습니다.
  alternative_readings:
  - 그들에게 큰 죄를 일으켰습니다
  - 그들 위에 큰 죄책을 초래했습니다
  rationale: 히브리어는 아론의 행위를 결과 중심으로 직접 귀속하므로, 이를 완화하거나 도덕적 책임을 추상화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 원문 우선 원칙; 책임 귀속을 약화하지 않음
