  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ בְּ/מִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי מֵ֨תוּ֙ כָּל הָ֣/אֲנָשִׁ֔ים הַֽ/מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
  footnotes:
  - marker: a
    text: Or “Go back to Egypt.” The Hebrew preserves two imperatives, literally “Go, return to Egypt.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 미디안에서 모세에게 말씀하셨습니다. 「가서, 이집트로 돌아가라. 네 생명을 찾던 모든 사람들이 죽었다」고 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 동사 두 개를 모두 살려 직역하면 “가라, 돌아가라”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 여호와 이름을 제목어 ‘주님’으로 바꾸지 않고, POB의 원칙에 따라 고유한 언약명을 한국어 음역으로 드러냈습니다.
- source_word: לֵךְ שֻׁב
  english_pob_choice: Go, return
  chosen_korean: 가서, ...돌아가라
  alternatives_korean:
  - 가서 돌아가라
  - 돌아가라
  lexicon: HALOT
  rationale: 두 명령형을 모두 살려 원문의 급박함과 중첩된 동작을 반영했습니다.
- source_word: מִצְרָיִם
  english_pob_choice: to Egypt
  chosen_korean: 이집트로
  alternatives_korean:
  - 애굽으로
  - 이집트
  lexicon: HALOT
  rationale: 문맥상 목적지를 자연스럽게 나타내기 위해 조사 ‘-로’를 붙였고, 현대 표준 표기로 ‘이집트’를 택했습니다.
- source_word: נַפְשֶׁךָ
  english_pob_choice: your life
  chosen_korean: 네 생명
  alternatives_korean:
  - 네 목숨
  - 네 영혼
  lexicon: HALOT
  rationale: ‘사람의 생명을 찾다’는 살해 의도를 뜻하는 관용구이므로, 문자적 ‘영혼’보다 ‘생명’이 원문 의미를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 미디안에서의 발화 위치와 직접 인용 처리
  chosen_reading: 서술문 뒤에 직접 화법을 붙여, 야훼의 명령이 모세에게 주어진 계시적 말씀임을 유지했습니다.
  alternative_readings:
  - 간접화법으로 풀기
  - 따옴표 없이 평서문으로 처리하기
  rationale: 원문은 서술과 직설 인용을 통해 신적 명령의 권위를 강조하므로, 한국어에서도 직접 인용 구조를 보존하는 편이 적절합니다.
  doctrine_reference: 서술-발화 구조 보존 원칙
