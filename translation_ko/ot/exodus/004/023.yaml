- from: 내가 너에게 말하기를, ‘내 아들을 보내서 그가 나를 섬기게 하라’ 하였으나, 너는 그를 보내기를 거절하였다. 보라, 내가 네 아들, 네 맏아들을 죽이려 한다.’[a]
  to: “내가 너에게 말하였습니다. ‘내 아들을 보내어 그가 나를 섬기게 하십시오.’ 그러나 너는 그를 보내기를 거절하였습니다. 보십시오, 내가 네 아들, 네 맏아들을 죽이려 합니다.”
  rationale: 원문의 발화는 하나님이 바로에게 하는 말 전체이므로, 전체를 하나의 인용문으로 묶었습니다. שׁלח의 반복은 ‘보내다/보내기를’으로, עבד는 ‘섬기다’로, בכור는 ‘맏아들’로 유지했습니다. הנה와 הֹרֵג의 임박한 경고는 ‘보십시오’와 ‘죽이려 합니다’로 옮겼으며, 모든 서술을 현대 합쇼체로 통일했습니다. 구조 오류가 있는 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:07Z'
