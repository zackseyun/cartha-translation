base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: ko
  text: 내가 너에게 말하기를, ‘내 아들을 보내서 그가 나를 섬기게 하라’ 하였으나, 너는 그를 보내기를 거절하였다. 보라, 내가 네 아들, 네 맏아들을 죽이려 한다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보내다’는 히브리어 שׁלח의 직접적 대응으로, 영어 POB의 ‘Send out’/‘send him out’를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: שַׁלַּח אֶת
  english_pob_choice: Send out / send him out
  chosen_korean: 보내다
  alternatives_korean:
  - 내보내다
  - 놓아주다
  lexicon: שׁלח
  rationale: 히브리어는 단순한 허가보다 ‘보내어 떠나게 하다’의 명령을 담고 있어, 한국어에서는 자연스럽고 직접적인 ‘보내다’로 옮겼습니다.
- source_word: וְיַעַבְדֵנִי
  english_pob_choice: so that he may serve me
  chosen_korean: 그가 나를 섬기게 하라
  alternatives_korean:
  - 그가 나를 섬기도록 하라
  - 그가 내게 봉사하게 하라
  lexicon: עבד
  rationale: ‘섬기다’가 종속적 봉사를 가장 무리 없이 드러내며, ‘봉사하다’보다 원문의 관계성을 더 잘 살립니다.
- source_word: בְּכֹרֶךָ
  english_pob_choice: your firstborn
  chosen_korean: 네 맏아들
  alternatives_korean:
  - 네 첫아들
  - 네 장자
  lexicon: בכור
  rationale: ‘맏아들’이 출애굽기 문맥에서 혈통상 첫째 아들을 자연스럽게 드러내며, ‘장자’보다 현대 한국어에서 덜 법률적입니다.
- source_word: הִנֵּה אָנֹכִי הֹרֵג
  english_pob_choice: Look, I am about to kill
  chosen_korean: 보라, 내가 … 죽이려 한다
  alternatives_korean:
  - 보라, 내가 … 죽일 것이다
  - 보아라, 내가 … 죽이겠다
  lexicon: הנה + הרג
  rationale: ‘הִנֵּה’의 경고적 급박함을 ‘보라’로 살리고, 진행형/근접미래 뉘앙스는 ‘죽이려 한다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 경고 발화의 직접성
  chosen_reading: 원문의 위협적 경고를 완화하지 않고, ‘보라’와 ‘죽이려 한다’로 직설적으로 유지했습니다.
  alternative_readings:
  - ‘곧 죽이겠다’처럼 더 완곡하게 옮김
  - ‘죽일 것이다’로 단순 미래화
  rationale: 본문은 언약 위반에 대한 하나님의 즉각적 심판 의도를 드러내므로, 문체를 부드럽게 만들어 긴장감을 약화시키지 않았습니다.
  doctrine_reference: 출애굽기 4장의 심판 경고와 언약적 책임
