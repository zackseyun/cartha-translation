  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ בְּ/לֶכְתְּ/ךָ֙ לָ/שׁ֣וּב מִצְרַ֔יְמָ/ה רְאֵ֗ה כָּל הַ/מֹּֽפְתִים֙ אֲשֶׁר שַׂ֣מְתִּי בְ/יָדֶ֔/ךָ וַ/עֲשִׂיתָ֖/ם לִ/פְנֵ֣י פַרְעֹ֑ה וַ/אֲנִי֙ אֲחַזֵּ֣ק אֶת לִבּ֔/וֹ וְ/לֹ֥א יְשַׁלַּ֖ח אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
  footnotes:
  - marker: a
    text: Or 'I will strengthen his heart' or 'I will make his heart firm.' The Hebrew verb can carry the sense of strengthening; here it describes Pharaoh being confirmed in stubborn refusal.
    reason: lexical_alternative
  - marker: b
    text: Or 'the signs' or 'the miracles.' The Hebrew word refers to extraordinary acts that function as displays of divine power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. "네가 이집트로 돌아갈 때, 내가 네 손에 넣어 준 그 모든 이적을 바로 앞에서 행하여라. 그러나 나는 그의 마음을 완강하게 할 것이니, 그는 그 백성을 보내지 않을 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이적’은 원문 מופתים의 번역으로, ‘표적’이나 ‘기적’도 가능하지만 본문은 하나님의 능력을 드러내는 경이로운 행위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘완강하게’는 히브리어 חזק의 이 문맥에서 가능한 ‘강하게 하다’, ‘굳게 하다’의 의미를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC
  rationale: 프로젝트 기본값에 따라 언약적 신명은 학술적 음역인 야훼로 옮겨, 고유한 신명성과 본문의 직접성을 보존했습니다.
- source_word: מִצְרַיְמָה
  english_pob_choice: to Egypt
  chosen_korean: 이집트로
  alternatives_korean:
  - 이집트에
  - 애굽으로
  lexicon: WLC
  rationale: 방향을 나타내는 말미를 현대 한국어에서는 조사 ‘-로’로 자연스럽게 풀어 주었습니다. ‘애굽’은 전통 교회 용어이지만, 본문 지시어를 현대 독자가 즉시 이해하도록 했습니다.
- source_word: הַמֹּפְתִים
  english_pob_choice: the wonders
  chosen_korean: 이적
  alternatives_korean:
  - 표적
  - 기적
  - 경이로운 일
  lexicon: HALOT
  rationale: מופת는 초자연적 능력을 드러내는 사건을 가리키므로, ‘이적’이 너무 해설적이지 않으면서도 ‘wonders’의 놀라운 행위를 잘 반영합니다.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  english_pob_choice: I will harden his heart
  chosen_korean: 그의 마음을 완강하게 할 것이니
  alternatives_korean:
  - 그의 마음을 강하게 할 것이니
  - 그의 마음을 완고하게 할 것이니
  - 그의 마음을 완강하게 하리니
  lexicon: HALOT
  rationale: חזק의 이 구문은 단순한 정서적 ‘강함’보다 저항적 고집이 강화되는 뉘앙스를 가지므로, 한국어에서는 ‘완강하게 하다’로 긴장감을 살렸습니다. ‘굳게 하다’는 자연스럽지만 신학적 충돌을 덜 드러낼 수 있어 피했습니다.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  english_pob_choice: and he will not let the people go
  chosen_korean: 그는 그 백성을 보내지 않을 것입니다
  alternatives_korean:
  - 그는 그 백성을 놓아주지 않을 것입니다
  - 그는 그 백성을 보내 주지 않을 것입니다
  lexicon: HALOT
  rationale: שׁלח는 출애굽 문맥에서 ‘떠나가게 하다/보내다’의 관용구이므로, ‘보내지 않다’로 간결하게 옮겨 출발 허용의 의미를 유지했습니다.
theological_decisions:
- issue: Pharaoh의 마음에 대한 하나님의 행위
  chosen_reading: ‘완강하게 하다’로 옮겨, 하나님이 바로의 저항을 더 굳게 하시는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘강하게 하다’
  - ‘완고하게 하다’
  rationale: 히브리어 חזק는 문맥상 단순한 심리 강화가 아니라 거절의 고집을 굳히는 행위로 읽히므로, 본문의 신학적 긴장—하나님의 주권과 바로의 책임—을 약화하지 않는 번역을 택했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
