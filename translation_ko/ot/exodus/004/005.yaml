translation:
  language: ko
  text: 그들이 믿게 하시려는 것은, 야훼[a] 곧 그들의 조상들의 하나님, 아브라함의 하나님, 이삭의 하나님, 야곱의 하나님[b]께서 당신에게 나타나셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 ‘YHWH’를 사용합니다. 전통적으로는 ‘주’로 옮겨 왔지만, 여기서는 고유 이름을 드러내기 위해 ‘야훼’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그들의 조상들의 하나님’입니다. 문맥상 ‘조상들’은 아브라함, 이삭, 야곱의 족장들을 가리킵니다.
    reason: lexical_alternative
