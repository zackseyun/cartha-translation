theological_decisions:
- issue: ‘믿다’의 목적과 이유 관계
  chosen_reading: ‘그들이 믿게 하시려는 것은 … 때문입니다’로 목적과 근거를 함께 드러냈습니다.
  alternative_readings:
  - ‘그들이 믿도록 …’
  - ‘…하여 그들이 믿게 하려는 것입니다’
  rationale: 히브리어 לְמַעַן과 כִּי נִרְאָה의 결합은 단순한 목적만이 아니라, 하나님의 나타나심이 믿음의 근거임을 함께 보여줍니다. 한국어에서는 이 인과-목적 연결을 자연스럽게 풀어 주는 것이 적절합니다.
  doctrine_reference: 출 4:5 문맥상 표적은 모세의 사명을 확증하는 계시적 증거입니다.
- issue: 족장 호칭의 반복 보존
  chosen_reading: ‘아브라함의 하나님, 이삭의 하나님, 야곱의 하나님’으로 각각 반복했습니다.
  alternative_readings:
  - ‘아브라함, 이삭, 야곱의 하나님’
  rationale: 반복은 단순 중복이 아니라 언약 계승과 계보적 정체성을 강조하는 성경적 수사입니다. 이를 압축하면 원문의 장중함과 강조점이 약해집니다.
  doctrine_reference: 언약 신학과 족장 전승의 연속성
