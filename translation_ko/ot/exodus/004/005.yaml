  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'' Alternatives include ''Yahweh'' and ''Jehovah.'''
    reason: alternative_reading
  - marker: b
    text: Or 'the God of their ancestors.' The Hebrew more literally says 'their fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들이 야훼[a], 곧 그들의 조상들의 하나님, 아브라함의 하나님, 이삭의 하나님, 야곱의 하나님[b]께서 당신에게 나타나셨다는 것을 믿도록 하기 위함입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 ‘YHWH’를 사용합니다. 전통적으로는 ‘주’로 옮겨 왔지만, 여기서는 고유 이름을 드러내기 위해 ‘야훼’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어를 직역하면 ‘그들의 아버지들의 하나님’입니다. 여기서 ‘아버지들’은 조상들을 뜻합니다.
    reason: lexical_alternative
