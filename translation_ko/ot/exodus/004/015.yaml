translation:
  language: ko
  text: 그에게 말하고 그의 입에 그 말들을 넣으십시오. 나는 당신의 입과 그의 입과 함께 있을 것이며[a], 내가 당신들에게 무엇을 해야 할지 가르치겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘나는 당신의 입과 그의 입과 함께 있을 것이다’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘당신들에게’와 ‘해야 할지’의 주어는 복수이며, 모세와 아론을 함께 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  english_pob_choice: You shall speak to him
  chosen_korean: 그에게 말하고
  alternatives_korean:
  - 그에게 말해야 합니다
  - 그에게 말하십시오
  lexicon: HALOT
  rationale: 직설적인 명령/지시 문맥이므로, 히브리어의 미래형·명령적 용법을 한국어 명령형으로 자연스럽게 옮겼습니다.
- source_word: וְשַׂמְתָּ אֶת הַדְּבָרִים בְּפִיו
  english_pob_choice: and put the words in his mouth
  chosen_korean: 그 입에 그 말을 넣으십시오
  alternatives_korean:
  - 그 입에 그 단어들을 넣으십시오
  - 그가 말할 말을 일러주십시오
  lexicon: HALOT
  rationale: ‘입에 넣다’라는 본문 이미지를 살리면서, 암시된 ‘말할 내용을 제공하다’는 뜻을 유지했습니다. ‘그 말’은 정관사 있는 복수를 한국어에서 간결하게 반영합니다.
- source_word: וְאָנֹכִי אֶהְיֶה עִם פִּיךָ וְעִם פִּיהוּ
  english_pob_choice: and I will be with your mouth and with his mouth
  chosen_korean: 나는 당신의 입과 그의 입과 함께 있을 것이며
  alternatives_korean:
  - 나는 당신과 그와 함께 말할 것이며
  - 나는 당신이 말할 때와 그가 말할 때 함께 있을 것이며
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현인 ‘입과 함께 있다’를 그대로 살려, 하나님의 말하기를 돕는 임재의 이미지를 보존했습니다.
- source_word: וְהוֹרֵיתִי אֶתְכֶם אֵת אֲשֶׁר תַּעֲשׂוּן
  english_pob_choice: and I will instruct you what you shall do
  chosen_korean: 내가 너희에게 무엇을 해야 할지 가르치겠습니다
  alternatives_korean:
  - 내가 너희에게 무엇을 해야 하는지 지시하겠습니다
  - 내가 너희에게 마땅히 할 일을 알려주겠습니다
  lexicon: HALOT
  rationale: הוֹרָה의 ‘가르치다/지도하다’ 의미를 따라 ‘가르치겠습니다’로 옮겼고, 뒤의 복수 ‘너희’는 모세와 아론을 함께 가리키는 점을 반영했습니다.
theological_decisions:
- issue: 하나님의 임재를 말하는 신체적 비유
  chosen_reading: ‘입과 함께 있을 것이다’라는 구체적 표현을 본문에 그대로 두었습니다.
  alternative_readings:
  - 말하는 일을 도와주겠다
  - 말을 잘하게 하겠다
  rationale: 본문은 하나님의 직접적 동행과 말하기의 능력을 신체적 비유로 말하므로, 이를 추상화하면 본문 특유의 힘이 약해집니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 마지막 인칭과 수의 처리
  chosen_reading: 마지막을 ‘너희’로 옮겨 모세와 아론을 함께 지시함을 드러냈습니다.
  alternative_readings:
  - 당신
  - 둘에게
  rationale: 히브리어의 אֶתְכֶם과 תַּעֲשׂוּן은 복수이므로, 한국어에서도 복수 지시를 분명히 하는 편이 문법과 의미에 더 충실합니다.
  doctrine_reference: Translation philosophy §6
