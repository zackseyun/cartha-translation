id: EXO.4.8
reference: Exodus 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ אִם לֹ֣א יַאֲמִ֣ינוּ לָ֔/ךְ וְ/לֹ֣א יִשְׁמְע֔וּ לְ/קֹ֖ל הָ/אֹ֣ת הָ/רִאשׁ֑וֹן וְ/הֶֽאֱמִ֔ינוּ לְ/קֹ֖ל הָ/אֹ֥ת הָ/אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
  footnotes:
  - marker: a
    text: Or 'the last sign.' Hebrew 'the later sign' can also be rendered 'the last sign,' but 'later' avoids implying that no further sign could follow.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 당신을 믿지 않고 첫 번째 표적의 소리에 귀를 기울이지 않으면, 그들은 나중 표적의 소리를 믿게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마지막 표적’으로도 옮길 수 있습니다. 히브리어 ‘나중의 표적’은 ‘마지막 표적’으로도 번역할 수 있지만, ‘나중’은 더 뒤에 다른 표적이 올 가능성을 배제하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: And it will be
  chosen_korean: 그리고 … 될 것입니다
  alternatives_korean:
  - 그리고 … 일 것입니다
  - 그때 … 될 것입니다
  lexicon: HALOT
  rationale: 히브리어 서술-조건 연결 공식을 한국어로 자연스럽게 옮기되, 과도한 의역 없이 미래 결과 구조를 유지했습니다.
- source_word: לְקוֹל הָאֹת
  english_pob_choice: the voice of the first sign / the voice of the latter sign
  chosen_korean: 첫 번째 표적의 소리 / 나중 표적의 소리
  alternatives_korean:
  - 첫 표적의 소리 / 뒤의 표적의 소리
  - 첫 번째 징표의 소리 / 나중 징표의 소리
  lexicon: HALOT
  rationale: קוֹל을 단순히 ‘메시지’로 풀지 않고 ‘소리’로 살려, 표적이 증언하듯 들리는 히브리어 이미지를 보존했습니다.
- source_word: הָרִאשׁוֹן
  english_pob_choice: the first
  chosen_korean: 첫 번째
  alternatives_korean:
  - 처음의
  - 전의
  lexicon: HALOT
  rationale: רִאשׁוֹן의 기본 의미를 그대로 살려 뒤의 대비 항목과 짝을 이루게 했습니다.
- source_word: הָאַחֲרוֹן
  english_pob_choice: the later / the latter sign
  chosen_korean: 나중 표적
  alternatives_korean:
  - 뒤의 표적
  - 후의 표적
  - 마지막 표적
  lexicon: HALOT
  rationale: POB의 ‘later/latter’ 취지를 따라 ‘마지막’이 주는 종결 뉘앙스를 피하고, 뒤에 또 다른 표적이 올 수 있음을 열어 두었습니다.
theological_decisions:
- issue: 표적이 ‘말하는’ 방식의 의인화
  chosen_reading: ‘표적의 소리’라는 표현을 유지해 표적이 증거로서 사람에게 호소하는 장면을 살렸습니다.
  alternative_readings:
  - ‘표적의 증거’
  - ‘표적이 주는 메시지’
  rationale: 본문은 표적을 단순한 사건이 아니라 청자를 향해 들리는 증언처럼 묘사하므로, 그 긴장을 완화하지 않았습니다.
  doctrine_reference: 출애굽기 4:8 문맥의 표적-증거 기능
