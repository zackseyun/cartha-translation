  source_fidelity: 조건절과 결과절의 구조, ‘믿다’, 그리고 표적의 ‘소리’라는 의인화된 히브리어 표현은 대체로 충실히 반영되었습니다. 다만 וְהָיָה를 단순 접속사 ‘그리고’로 처리하면 미래의 조건적 귀결을 여는 기능이 약해집니다. 또한 ‘나중 표적’은 관형 구성으로 다소 부자연스럽습니다.
  naturalness: ‘그리고 그들이’로 시작하는 문장은 현대 한국어에서 어색하며, ‘당신’은 하나님이 모세에게 직접 말씀하시는 문맥에서 자연스러운 호칭이 아닙니다. ‘이렇게 될 것입니다’와 ‘너’를 사용하면 합쇼체를 유지하면서도 자연스럽습니다. ‘표적의 소리’는 다소 낯설지만 원문의 의인화와 증거적 이미지를 보존하므로 유지할 수 있습니다.
  terminology: אָתוֹת는 일관되게 ‘표적’으로, קוֹל은 ‘소리’로 유지했습니다. הָאַחֲרוֹן은 종결성을 단정하지 않는 ‘뒤의’로 옮겼으며, 각주에서 ‘마지막’이라는 가능한 대안을 제시했습니다.
