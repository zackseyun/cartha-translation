revisions:
- from: 그리고 그들이 당신을 믿지 않고 첫 번째 표적의 소리에 귀를 기울이지 않으면, 그들은 나중 표적의 소리를 믿게 될 것입니다.[a]
  to: 이렇게 될 것입니다. 그들이 너를 믿지 않고 첫 번째 표적의 소리에 귀를 기울이지 않으면, 그들은 뒤의 표적의 소리를 믿을 것입니다.[a]
  rationale: 미래의 조건적 귀결을 도입하는 히브리어 표현을 ‘이렇게 될 것입니다’로 명시하고, 직접 말씀의 상대인 모세에게 자연스러운 ‘너’를 사용했습니다. ‘뒤의 표적’은 원문의 ‘나중의/마지막의’ 의미 가능성을 보존하면서 ‘마지막’이라는 종결적 함의를 본문에서 피합니다. 표적의 ‘소리’는 한국어에서 다소 비유적이지만 원문의 표현을 보존하기 위해 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:18Z'
