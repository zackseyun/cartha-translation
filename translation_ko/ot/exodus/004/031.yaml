  - 주
  rationale: 원문이 여호와 칭호가 아니라 언약명 יהוה를 직접 쓰므로, 프로젝트 기본값에 따라 음역 ‘야훼’를 유지해 고유한 신명성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
