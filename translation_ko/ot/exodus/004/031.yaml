id: EXO.4.31
reference: Exodus 4:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
  footnotes:
  - marker: a
    text: Or 'the LORD had attended to the sons of Israel.' The Hebrew verb can mean 'visited,' 'attended to,' or 'took notice of,' often with the sense of divine intervention.
    reason: lexical_alternative
  - marker: b
    text: Or 'the children of Israel' or 'the Israelites.' Literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Or 'their misery' or 'their suffering.'
    reason: lexical_alternative
translation:
  language: ko
  text: 백성이 믿었고, 야훼께서 이스라엘 자손을 돌아보시고 그들의 고난을 보셨다는 말을 들었을 때, 그들은 머리를 숙이고 경배했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아보시고’는 히브리어 פקד의 폭넓은 뜻(방문하다, 살피다, 개입하다, 돌보다)을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’은 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘고난’은 ‘비참함’이나 ‘고통’도 될 수 있는 עָנְיָם의 의미를 포괄합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן הָעָם
  english_pob_choice: And the people believed
  chosen_korean: 백성이 믿었고
  alternatives_korean:
  - 백성이 믿었습니다
  - 백성이 신뢰했고
  lexicon: HALOT
  rationale: 히브리어 히필 동사 אמן은 여기서 모세와 아론의 소식을 ‘믿다’는 의미이므로, 본문이 가진 서사적 반응을 자연스럽게 살려 ‘믿었고’로 옮겼습니다.
- source_word: פָקַד יְהוָה
  english_pob_choice: Yahweh had visited
  chosen_korean: 야훼께서 ... 돌아보시고
  alternatives_korean:
  - 야훼께서 ... 방문하셨고
  - 야훼께서 ... 살피셨고
  - 야훼께서 ... 돌보셨고
  lexicon: HALOT
  rationale: פקד는 ‘방문하다’뿐 아니라 ‘돌보다, 살피다, 개입하여 주목하다’의 폭넓은 의미를 가지므로, 구약적 관용을 살리면서도 한국어에서 의미가 분명한 ‘돌아보시고’를 택했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘이스라엘의 아들들’이지만, 한국어 성경에서 널리 통용되는 대표적 혈연-언약 표현인 ‘이스라엘 자손’이 원문 형식을 가장 자연스럽게 보존합니다.
- source_word: עָנְיָם
  english_pob_choice: their affliction
  chosen_korean: 그들의 고난
  alternatives_korean:
  - 그들의 환난
  - 그들의 고통
  - 그들의 비참
  lexicon: HALOT
  rationale: עֹנִי/עָנִי 는 압제 아래의 고난, 괴로움, 비참함을 가리키므로, 너무 추상적이지 않으면서도 중첩된 고통을 담는 ‘고난’이 적절합니다.
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲוּוּ
  english_pob_choice: they bowed down and worshiped
  chosen_korean: 그들은 머리를 숙이고 경배했습니다
  alternatives_korean:
  - 그들은 절하고 예배했습니다
  - 그들은 몸을 굽혀 경배했습니다
  - 그들은 엎드려 경배했습니다
  lexicon: HALOT
  rationale: קדד와 השתחוה를 분리해, 먼저 신체적 동작을 ‘머리를 숙이고’로, 이어서 예배적 행위를 ‘경배했습니다’로 옮겨 원문의 이중 동작을 살렸습니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 원문이 여호와 칭호가 아니라 언약명 יהוה를 직접 쓰므로, 프로젝트 기본값에 따라 음역 ‘야훼’를 유지해 고유한 신명성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
