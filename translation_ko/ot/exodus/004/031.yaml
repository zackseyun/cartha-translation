  source_fidelity: 히브리어의 사건 전개와 핵심 어휘가 충실히 반영되었습니다. וַיַּאֲמֵן은 ‘믿었고’로, פָקַד는 문맥상 적절한 ‘돌아보시고’로, עָנְיָם은 ‘고난’으로 옮겼습니다. קדד와 השתחוה의 연속 동작도 ‘머리를 숙이고 경배했습니다’로 구별하여 보존했습니다.
  naturalness: 현대 표준 한국어 합쇼체 서사로 자연스럽습니다. ‘…다는 말을 들었을 때’는 כִּי 이하의 들은 내용을 명료하게 제시하며, 문장 전체의 흐름도 자연스럽습니다.
  terminology: ‘야훼’, ‘이스라엘 자손’, ‘경배’는 프로젝트의 번역 방침 및 본문 문맥에 부합합니다. ‘이스라엘 자손’은 히브리어의 가족·집단 표현을 한국어 성경 문체 안에서 자연스럽게 살립니다.
