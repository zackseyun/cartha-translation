  lexicon: HALOT
  rationale: שלך의 명령형을 직접적이면서도 현대적인 명령으로 옮겼고, 뒤의 방향어와 결합해 자연스러운 한국어가 되게 했습니다.
- source_word: וַיְהִי לְנָחָשׁ
  english_pob_choice: and it became a snake
  chosen_korean: 그것이 뱀이 되었습니다
  alternatives_korean:
  - 그것이 뱀으로 변했습니다
  - 그것이 뱀으로 되었습니다
  lexicon: HALOT
  rationale: נָחָשׁ을 현대 독자에게 분명한 ‘뱀’으로 옮겼고, 변화의 결과를 평이하게 표현했습니다.
- source_word: מִפָּנָיו
  english_pob_choice: from it
  chosen_korean: 그것을 피해
  alternatives_korean:
