  text: 그가 말씀하셨습니다. “그것을 땅에 던지십시오.” 모세가 그것을 땅에 던지자, 그것이 뱀이 되었습니다[b]. 모세는 그 뱀에게서 달아났습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것 앞에서부터’ 또는 ‘그 앞에서부터’라고 합니다. 이는 ‘그것에게서’ 또는 ‘그 앞에서’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘뱀’ 대신 ‘뱀/서펀트’로 옮길 수 있습니다.
    reason: lexical_alternative
