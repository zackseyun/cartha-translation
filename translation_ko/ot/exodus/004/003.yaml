  - 그것의 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘그것 앞에서/그 앞면으로부터’라는 관용이지만, 한국어에서는 ‘피해’가 같은 의미를 더 자연스럽게 드러냅니다.
theological_decisions:
- issue: narrative force of Moses’ reaction
  chosen_reading: 모세는 단순히 물러난 것이 아니라 두려움 때문에 그것을 피해 달아났다고 옮겼습니다.
  alternative_readings:
  - 모세는 그것으로부터 도망쳤습니다
  - 모세는 그것을 피했습니다
  rationale: 히브리어 וַיָּנָס의 급박한 도피 뉘앙스를 살려, 장면의 긴장감을 약화시키지 않도록 했습니다.
  doctrine_reference: narrative pragmatics
