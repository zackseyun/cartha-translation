  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from before it' (or 'from before him'), an idiom meaning 'away from it' or 'from its presence.'
    reason: lexical_alternative
  - marker: b
    text: Or 'serpent' for 'snake.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말했습니다[a], “그것을 땅에 던지십시오.” 그래서 그가 그것을 땅에 던지니, 그것이 뱀이 되었습니다[b]. 그리고 모세는 그것을 피해 달아났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것 앞에서부터’(또는 ‘그 앞에서부터’)라는 관용구로, ‘그것에서/그것의 존재 앞에서’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뱀’은 כאן의 נָחָשׁ을 자연스럽게 옮긴 것이며, ‘서펀트/뱀’의 다른 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말했습니다
  alternatives_korean:
