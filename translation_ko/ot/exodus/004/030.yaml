source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
  footnotes:
  - marker: a
    text: Or "in the sight of the people."
    reason: lexical_alternative
translation:
  language: ko
  text: 아론이 야훼께서 모세에게 말씀하신 그 모든 말을 전하고, 백성의 눈앞에서 그 표징들을 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “백성이 보는 앞에서.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 전하고
  alternatives_korean:
  - 말했고
  - 말했습니다
  lexicon: HALOT
  rationale: 문맥상 아론이 전달자 역할로 야훼의 말씀을 백성에게 전달하는 흐름이므로, 단순 발화보다 ‘전하다’가 기능을 더 분명히 드러냅니다.
- source_word: אֵת כָּל הַדְּבָרִים
  english_pob_choice: all the words
  chosen_korean: 그 모든 말
  alternatives_korean:
  - 모든 말
  - 그 모든 말씀
  lexicon: HALOT
  rationale: 히브리어의 ‘말들’을 구체적으로 살리되, 한국어에서 자연스럽게 들리도록 ‘그 모든 말’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 언약 이름을 제목어로 바꾸지 않고, 본 프로젝트 기본어인 ‘야훼’로 옮겨 מקור의 신명성을 보존했습니다.
- source_word: הָאֹתֹת
  english_pob_choice: the signs
  chosen_korean: 그 표징들
  alternatives_korean:
  - 그 표적들
  - 그 징표들
  lexicon: HALOT
  rationale: 출애굽기 문맥의 인증 표지라는 기능을 드러내면서도, 초자연성을 과도하게 덧붙이지 않기 위해 ‘표징들’을 선택했습니다.
theological_decisions:
- issue: ‘before the eyes of the people’의 직역성과 관용성
  chosen_reading: ‘백성의 눈앞에서’로 옮겨 히브리어 관용구의 시각적 생동감을 유지했습니다.
  alternative_readings:
  - 백성 앞에서
  - 백성이 보는 앞에서
  rationale: 원문은 단순한 장소 표시보다 ‘눈앞’이라는 생생한 관찰 이미지를 담고 있으므로 이를 살렸습니다.
  doctrine_reference: Source-faithfulness principle
