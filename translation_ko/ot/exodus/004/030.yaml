  source_fidelity: 번역은 아론이 야훼께서 모세에게 말씀하신 내용을 말하고 표징들을 행했다는 원문의 두 동작과 순서를 충실히 보존합니다. ‘전하다’는 여기서 아론이 야훼의 말씀을 백성에게 전달하는 문맥에 자연스럽게 맞습니다.
  naturalness: 합쇼체 문장으로 자연스럽고, ‘백성의 눈앞에서’는 לְעֵינֵי הָעָם의 생생한 관용 표현을 잘 살립니다. 다만 각주가 가리키는 구절 바로 뒤에 표지를 두는 편이 독자에게 더 명료합니다.
  terminology: ‘야훼’는 신명 יְהוָה를 일관되게 반영하며, ‘표징들’은 אותות의 의미를 과도하게 해설하지 않는 적절한 번역입니다. ‘모든 말씀’은 원문의 복수형과 야훼의 발화를 한국어에서 자연스럽게 나타냅니다.
