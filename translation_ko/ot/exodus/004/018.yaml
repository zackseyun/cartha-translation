  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ מֹשֶׁ֜ה וַ/יָּ֣שָׁב אֶל יֶ֣תֶר חֹֽתְנ֗/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ אֵ֣לֲכָה נָּ֗א וְ/אָשׁ֨וּבָה֙ אֶל אַחַ֣/י אֲשֶׁר בְּ/מִצְרַ֔יִם וְ/אֶרְאֶ֖ה הַ/עוֹדָ֣/ם חַיִּ֑ים וַ/יֹּ֧אמֶר יִתְר֛וֹ לְ/מֹשֶׁ֖ה לֵ֥ךְ לְ/שָׁלֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
  footnotes:
  - marker: a
    text: Hebrew has the name form 'Jether' in the first mention and 'Jethro' in the second; the English text uses 'Jethro' for consistency since the same person is clearly intended.
    reason: textual_variant
  - marker: b
    text: Or 'my kinsmen' for 'my brothers.' The Hebrew literally says 'my brothers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모세가 가서 그의 장인 이드로에게 돌아와 말했습니다. 「부디 제가 가서 이집트에 있는 제 형제들에게 돌아가 그들이 아직 살아 있는지 보게 해 주십시오.」 이드로가 모세에게 말했습니다. 「평안히 가시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에는 첫 언급이 יֶתֶר, 마지막이 יִתְרוֹ로 다르게 표기되지만, 동일 인물을 가리킵니다. 한국어 본문에서는 이름을 통일했습니다.
    reason: textual_variant
  - marker: b
    text: ‘형제들’은 히브리어 אַחַי의 직역입니다. 문맥상 친족을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ / וַיָּשָׁב
  english_pob_choice: Then Moses went / returned
  chosen_korean: 가서 / 돌아와
  alternatives_korean:
  - 가서 / 돌아갔습니다
  - 가서 / 되돌아와
  lexicon: WLC + HALOT
  rationale: 서사 진행의 wayyiqtol을 자연스럽게 살려 ‘가서’로 시작하고, שׁוּב의 반복을 ‘돌아와’로 옮겨 되돌아감의 동작을 분명히 했습니다.
- source_word: יֶתֶר / יִתְרוֹ
  english_pob_choice: Jethro
  chosen_korean: 이드로
  alternatives_korean:
  - 이트로
  - 예드로
  lexicon: 고유명사 관용형
  rationale: 본문에는 יתר/יתרו의 두 표기가 나오지만 동일 인물이므로 한국어에서는 동일 인명으로 통일하고, 관용적으로 널리 쓰이는 ‘이드로’를 택했습니다.
- source_word: אֵלֲכָה נָּא
  english_pob_choice: Please let me go
  chosen_korean: 부디 제가 가서
  alternatives_korean:
  - 부디 가게 해 주십시오
  - 제발 제가 가게 해 주십시오
  lexicon: HALOT
  rationale: 공손한 청유를 한국어의 정중한 요청으로 옮기되, 출발 동작 자체를 드러내기 위해 ‘제가 가서’로 자연화했습니다.
- source_word: אַחַי
  english_pob_choice: my brothers
  chosen_korean: 제 형제들
  alternatives_korean:
  - 제 형제
  - 제 친족들
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘형제들’을 유지하되, 혈연적 친족을 포괄할 수 있는 문맥도 남겨 두었습니다.
- source_word: הַעוֹדָם חַיִּים
  english_pob_choice: whether they are still alive
  chosen_korean: 아직 살아 있는지
  alternatives_korean:
  - 아직 생존해 있는지
  - 여전히 살아 있는지
  lexicon: HALOT
  rationale: ‘still alive’의 상태 여부를 한국어의 간결한 의문형으로 옮겨, 목적절의 불확실성을 유지했습니다.
- source_word: לֵךְ לְשָׁלוֹם
  english_pob_choice: Go in peace
  chosen_korean: 평안히 가시오
  alternatives_korean:
  - 평안히 가십시오
  - 평안 가운데 가시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 축복의 작별 인사로 살리되, 한국어에서는 명령형보다 작별 축복의 뉘앙스가 살아 있는 ‘평안히 가시오’로 옮겼습니다.
theological_decisions:
- issue: 장인과 모세의 대화에서 예의의 수위
  chosen_reading: 모세의 요청은 정중한 청유로, 이드로의 응답은 축복적 허락으로 처리했습니다.
  alternative_readings:
  - 둘 다 평서문으로 완화
  - 현대식 명령형으로 강하게 번역
  rationale: 본문의 관계적 긴장—모세가 허락을 구하고 장인이 평강을 빌며 보내는 장면—을 살리기 위해 합쇼체 안에서 공손도와 축복성을 구분했습니다.
  doctrine_reference: 서사 문맥의 화행 보존
