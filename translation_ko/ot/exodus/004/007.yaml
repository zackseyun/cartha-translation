  edition: WLC
  text: וַ/יֹּ֗אמֶר הָשֵׁ֤ב יָֽדְ/ךָ֙ אֶל חֵיקֶ֔/ךָ וַ/יָּ֥שֶׁב יָד֖/וֹ אֶל חֵיק֑/וֹ וַ/יּֽוֹצִאָ/הּ֙ מֵֽ/חֵיק֔/וֹ וְ/הִנֵּה שָׁ֖בָה כִּ/בְשָׂרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
  footnotes:
  - marker: a
    text: Or “into the fold of your garment at your chest.”
    reason: cultural_note
  - marker: b
    text: That is, his hand was restored to normal flesh.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「손을 품으로 다시 넣으십시오」. 그래서 그는 손을 품으로 다시 넣었고, 그것을 품에서 다시 꺼내자 보십시오, 그것이 자기 살과 같이 되돌아와 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉 손을 가슴 부근의 옷 속으로 넣는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 즉 그 손이 본래의 정상한 살 상태로 회복되었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  english_pob_choice: Put ... back
  chosen_korean: 다시 넣으십시오
  alternatives_korean:
  - 되돌리십시오
  - 다시 집어넣으십시오
  lexicon: HALOT
  rationale: 히필 명령형의 ‘돌아오게 하다’는 뜻을 한국어에서 자연스럽게 살리면서, 손을 원래 있던 자리로 넣는 동작을 간결하게 표현했습니다.
- source_word: חֵיק
  english_pob_choice: bosom
  chosen_korean: 품
  alternatives_korean:
  - 가슴
  - 옷섶
  - 옷의 주름
  lexicon: HALOT
  rationale: ‘bosom’에 해당하는 기본적이고 문맥에 맞는 표준어로 ‘품’을 택해, 가슴 부근의 옷 속 공간이라는 의미를 과도하게 풀이하지 않고 전달했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 문득
  - 그런데
  lexicon: HALOT
  rationale: 놀라운 결과를 독자에게 주목시키는 감탄적 용법을 살리되, 현대 한국어에서 문맥상 자연한 호명형으로 옮겼습니다.
- source_word: כִּבְשָׂרוֹ
  english_pob_choice: like his flesh
  chosen_korean: 자기 살과 같이
  alternatives_korean:
  - 그의 살처럼
  - 그의 정상적인 살처럼
  lexicon: HALOT
  rationale: 비교의 כ를 그대로 살려 ‘…와 같이’로 옮기고, 손이 원래 상태로 회복되었다는 뉘앙스는 주석 없이 문맥으로 드러나게 했습니다.
theological_decisions:
- issue: 문장 끝의 놀라운 회복을 어떻게 드러낼지
  chosen_reading: ‘그것이 자기 살과 같이 되돌아와 있었습니다’로 옮겨, 단순한 위치 이동이 아니라 정상 상태로의 회복을 함께 드러냈습니다.
  alternative_readings:
  - ‘그것이 자기 살처럼 되었습니다’
  - ‘그것이 회복되었습니다’
  rationale: 히브리어는 ‘되돌아오다’와 ‘자기 살과 같다’를 함께 두어 회복의 결과를 보여 주므로, 동작과 회복감을 모두 보존하는 쪽이 본문에 더 가깝습니다.
  doctrine_reference: 본문의 표면 의미 보존 원칙
