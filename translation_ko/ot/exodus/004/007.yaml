revisions:
- from: 그가 말했습니다. 「손을 품으로 다시 넣으십시오」. 그래서 그는 손을 품으로 다시 넣었고, 그것을 품에서 다시 꺼내자 보십시오, 그것이 자기 살과 같이 되돌아와 있었습니다.[a][b]
  to: 그가 말했습니다. “손을 품[a]으로 다시 넣으십시오.” 그래서 그는 손을 품으로 다시 넣었습니다. 그가 손을 품에서 꺼내자, 보십시오, 손은 그의 살처럼[b] 되돌아왔습니다.
  rationale: 수정문은 ‘다시 넣다’의 반복과 ‘품에서 꺼내다’의 동작을 유지했습니다. 마지막의 손을 명시하고 ‘그의 살처럼 되돌아왔습니다’로 옮겨, שָׁבָה의 회복적 ‘되돌아오다’와 כִּבְשָׂרוֹ의 비교를 보존하면서 한국어의 지시·시제상 어색함을 제거했습니다. 각주도 해당 어구에 직접 연결하고 비문을 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:02Z'
