source:
  edition: WLC
  text: וַ/יְהִ֥י בַ/דֶּ֖רֶךְ בַּ/מָּל֑וֹן וַ/יִּפְגְּשֵׁ֣/הוּ יְהוָ֔ה וַ/יְבַקֵּ֖שׁ הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
  footnotes:
  - marker: a
    text: Hebrew 'him' is not explicitly identified here; it may refer to Moses or, in some interpretations, to his son.
    reason: alternative_reading
  - marker: b
    text: Or 'at the night encampment'; the Hebrew refers to a place of lodging, not necessarily a commercial inn.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 길에서, 숙소에 이르러서, 야훼께서 그를 만나 그를 죽이려 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘그’를 명시적으로 밝히지 않으므로, 모세를 가리키거나 어떤 해석에서는 그의 아들을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘밤숙영지에서’. 히브리어는 상업적 ‘여관’이 아니라 숙박을 위한 장소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּרֶךְ
  english_pob_choice: on the way
  chosen_korean: 길에서
  alternatives_korean:
  - 도중에
  - 가는 길에
  lexicon: HALOT
  rationale: 기본적인 위치 표현으로서 자연스러운 현대 한국어를 택하되, 서술 흐름을 해치지 않도록 간결하게 옮겼습니다.
- source_word: בַּמָּלוֹן
  english_pob_choice: at the lodging place
  chosen_korean: 숙소에
  alternatives_korean:
  - 묵는 곳에
  - 밤숙소에
  - 여인숙에
  lexicon: HALOT
  rationale: מָלוֹן은 상업적 ‘여관’보다 단순한 ‘묵는 곳’의 의미이므로, 지나치게 현대화하지 않으면서도 자연스러운 ‘숙소’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 고유 신명(神名)을 제목어로 돌리지 않고 음역해 드러내는 프로젝트 기본 원칙을 따랐습니다.
- source_word: וַיְבַקֵּשׁ הֲמִיתוֹ
  english_pob_choice: sought to put him to death
  chosen_korean: 그를 죽이려 하셨습니다
  alternatives_korean:
  - 그를 죽이기를 구하셨습니다
  - 그를 죽이고자 하셨습니다
  lexicon: HALOT
  rationale: ‘seek’의 핵심은 살리되, 한국어에서는 ‘죽이려 하셨습니다’가 가장 자연스럽고 긴박한 위협을 잘 전달합니다.
theological_decisions:
- issue: ‘그를’의 지시 대상이 본문에서 명시되지 않음
  chosen_reading: 한국어 본문에서도 지시 대상을 밝히지 않고 ‘그를’로 유지했습니다.
  alternative_readings:
  - 모세를
  - 그의 아들을
  rationale: 히브리어는 대상을 분명히 밝히지 않으므로, 해석을 단정하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it'
