base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
  footnotes:
  - marker: a
    text: Hebrew 'him' is not explicitly identified here; it may refer to Moses or, in some interpretations, to his son.
    reason: alternative_reading
  - marker: b
    text: Or 'at the night encampment'; the Hebrew refers to a place of lodging, not necessarily a commercial inn.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 길을 가다가 숙소[b]에서 야훼께서 그를[a] 만나시고 그를 죽이려 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘그’가 누구인지 명시하지 않습니다. 이는 모세를 가리킬 수도 있고, 일부 해석에서는 그의 아들을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘밤의 숙영지에서’. 히브리어는 밤을 묵는 장소를 가리키며, 반드시 상업적인 여관을 뜻하지는 않습니다.
    reason: lexical_alternative
