source:
  edition: WLC
  text: וַ/יַּ֤עַן מֹשֶׁה֙ וַ/יֹּ֔אמֶר וְ/הֵן֙ לֹֽא יַאֲמִ֣ינוּ לִ֔/י וְ/לֹ֥א יִשְׁמְע֖וּ בְּ/קֹלִ֑/י כִּ֣י יֹֽאמְר֔וּ לֹֽא נִרְאָ֥ה אֵלֶ֖י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
  footnotes:
  - marker: a
    text: 'Hebrew: ''listen to my voice,'' an idiom that can also mean ''listen to me'' or ''heed me.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'The LORD did not appear to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 대답하여 말했습니다. 「보십시오, 그들은 저를 믿지 않을 것이며, 제 목소리에도[a] 귀를 기울이지 않을 것입니다. 그들은 ‘야훼께서 너에게 나타나지 않으셨다’라고 말할 것이기 때문입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘내 목소리를 듣다’입니다. 이 표현은 ‘내 말을 듣다’, ‘나에게 귀를 기울이다’ 또는 ‘내 말을 따르다’라는 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  english_pob_choice: Then Moses answered and said
  chosen_korean: 그때 모세가 대답하여 말했습니다
  alternatives_korean:
  - 모세가 대답하며 말했습니다
  - 모세가 응답하여 말했습니다
  lexicon: HALOT
  rationale: ענה와 אמר의 연속은 대화의 응답 공식이므로, 한국어에서는 자연스러운 서술형으로 ‘대답하여 말했습니다’를 택했습니다.
- source_word: וְהֵן
  english_pob_choice: Behold / But look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 여기서는 모세의 반론을 이끄는 주의 환기 표현이므로, 현대 합쇼체에서 어색하지 않으면서도 강조를 살리는 ‘보십시오’로 옮겼습니다.
- source_word: לֹא יַאֲמִינוּ לִי
  english_pob_choice: they will not believe me
  chosen_korean: 그들은 저를 믿지 않을 것이며
  alternatives_korean:
  - 그들은 저를 신뢰하지 않을 것이며
  - 그들은 제 말을 믿지 않을 것이며
  lexicon: HALOT
  rationale: אמן의 기본 의미를 따라, 모세의 인격보다 그의 말과 사명을 받아들이지 않을 것이라는 뜻을 자연스럽게 드러내도록 ‘저를 믿지 않을 것이며’로 번역했습니다.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  english_pob_choice: and they will not listen to my voice
  chosen_korean: 제 목소리에도 귀를 기울이지 않을 것입니다
  alternatives_korean:
  - 제 목소리도 듣지 않을 것입니다
  - 제 목소리에도 순종하지 않을 것입니다
  lexicon: HALOT
  rationale: בקול + שמע는 직역하면 ‘목소리에 듣다’이지만, 문맥상 수용·경청의 의미가 핵심이므로 ‘귀를 기울이지 않을 것입니다’로 한국어 관용을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 יְהוָה는 인격적 신명이며, 본 프로젝트 기본값에 따라 전통 대체어가 아닌 학술적 음역 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’으로 대체 표기
  - ‘여호와’로 표기
  rationale: 본문은 이스라엘에게 계시된 신명을 직접 사용하므로, 제목어로 바꾸지 않고 이름 자체를 드러내는 것이 본문의 긴장과 계시성을 더 정확히 보존합니다.
  doctrine_reference: 'POB doctrine: Contested terms — יְהוָה/YHWH → 야훼'
