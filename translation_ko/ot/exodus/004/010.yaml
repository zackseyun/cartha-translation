  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל יְהוָה֮ בִּ֣י אֲדֹנָ/י֒ לֹא֩ אִ֨ישׁ דְּבָרִ֜ים אָנֹ֗כִי גַּ֤ם מִ/תְּמוֹל֙ גַּ֣ם מִ/שִּׁלְשֹׁ֔ם גַּ֛ם מֵ/אָ֥ז דַּבֶּרְ/ךָ אֶל עַבְדֶּ֑/ךָ כִּ֧י כְבַד פֶּ֛ה וּ/כְבַ֥ד לָשׁ֖וֹן אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
  footnotes:
  - marker: a
    text: Or, more interpretively, “I am not eloquent.” The Hebrew reads “I am not a man of words.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “heavy of mouth and heavy of tongue,” a metaphor for difficulty in speaking; it may imply lack of eloquence or some speech impediment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모세가 야훼께 말씀드렸습니다. "주님, 제발 저는 말의 사람이 아닙니다. 어제도, 그제도, 그리고 주께서 주의 종에게 말씀하신 뒤로도 그렇습니다. 저는 입이 무겁고 혀가 무겁습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘말의 사람’입니다. 여기서는 유창성 부족을 가리킬 수 있지만, 원문의 비유를 보존해 직역했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘입이 무겁고 혀가 무겁다’는 히브리어의 비유적 표현으로, 말하기의 어려움을 가리킬 수 있으나 그 정확한 성격은 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명인 여호와의 이름을 보존하기 위해 관습적 대체어 ‘주님’이 아니라 음역형 ‘야훼’를 사용합니다.
- source_word: בִּי אֲדֹנָי
  english_pob_choice: Please, Lord
  chosen_korean: 주님, 제발
  alternatives_korean:
  - 부디, 주님
  - 용서해 주십시오, 주님
  lexicon: HALOT
  rationale: בִּי는 정중한 간청의 표현이므로 자연스러운 한국어 간구로 옮기되, 아도나이를 ‘주님’으로 처리해 직접 호소의 뉘앙스를 살렸습니다.
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  english_pob_choice: I am not a man of words
  chosen_korean: 저는 말의 사람이 아닙니다
  alternatives_korean:
  - 저는 말을 잘하는 사람이 아닙니다
  - 저는 말재주가 없습니다
  lexicon: HALOT
  rationale: 원문의 직역적 표현을 살려 ‘말의 사람’으로 옮겨, 단순한 ‘유창하지 않다’로 미리 해석하지 않도록 했습니다.
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  english_pob_choice: heavy of mouth and heavy of tongue
  chosen_korean: 입이 무겁고 혀가 무겁습니다
  alternatives_korean:
  - 말이 둔하고 혀가 둔합니다
  - 말하기가 어렵습니다
  lexicon: HALOT
  rationale: ‘무겁다’의 은유를 유지해 원문의 이미지를 보존했습니다. 이를 곧바로 ‘말더듬’이나 ‘서툴다’로 특정하지 않았습니다.
theological_decisions:
- issue: 모세의 발화 문제를 어떻게 드러낼 것인가
  chosen_reading: 원문의 은유를 살려, 모세가 자신의 말함의 어려움을 ‘무겁다’는 표현으로 말하게 했습니다.
  alternative_readings:
  - ‘말을 잘하지 못합니다’처럼 해석적으로 풀어 씀
  - 구체적 장애를 암시하는 표현으로 좁혀 씀
  rationale: 히브리어는 정확한 원인을 규정하지 않고 표현상의 긴장을 남깁니다. 이를 보존해 독자가 원문의 애매함을 그대로 읽도록 했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
