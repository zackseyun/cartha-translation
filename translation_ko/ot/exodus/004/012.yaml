    rationale: 보조적 연결형 ‘있어’ 뒤에 쉼표만 두고 독립절을 이어 쓰면 현대 표준 문어의 합쇼체 문장으로 부자연스럽습니다. ‘있겠으며’로 고쳐 하나님의 두 약속을 자연스럽게 연결해야 합니다.
