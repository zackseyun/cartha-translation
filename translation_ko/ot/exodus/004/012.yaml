  source_fidelity: 히브리어의 명령(‘가라’), 하나님의 동행 약속(‘내가 네 입과 함께 있겠다’), 그리고 가르침의 약속을 모두 보존합니다. 다만 초안의 ‘함께 있어’는 문장 연결이 미완결적이므로 고쳐야 합니다. 또한 תדבר의 미완료형은 여기서 모세가 앞으로 말할 내용을 가리키므로 ‘말할 것’이 직접적이며, ‘말해야 할 것’이 덧붙이는 의무의 뉘앙스는 피하는 편이 안전합니다.
  naturalness: ‘내가 당신의 입과 함께 있겠으며’는 히브리어의 의도적으로 구체적인 표현을 유지하면서 합쇼체 문장으로 완결됩니다. ‘당신의 입과 함께 있어’보다 문법적·문체적으로 자연스럽습니다.
