translation:
  language: ko
  text: 이제 가십시오. 내가 당신의 입과 함께 있어, 당신이 말해야 할 것을 가르치겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 입과 함께’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 그러므로 이제
  lexicon: HALOT
  rationale: 새로운 단계로 들어가는 즉시성을 살리면서도 한국어 명령문 앞에서 자연스럽게 들리는 전환어로 옮겼습니다.
- source_word: לֵךְ
  english_pob_choice: go
  chosen_korean: 가십시오
  alternatives_korean:
  - 가세요
  - 가라
  lexicon: HALOT
  rationale: 하나님이 모세에게 직접 명하시는 문맥이므로 합쇼체 명령형이 적절합니다.
- source_word: עִם פִּיךָ
  english_pob_choice: with your mouth
  chosen_korean: 당신의 입과 함께
  alternatives_korean:
  - 당신의 입과 더불어
  - 당신의 입에
  - 당신이 말할 때
  lexicon: HALOT
  rationale: 히브리어의 구체적 표현을 보존하여, 하나님이 모세의 ‘말하는 기관’과 함께하신다는 이미지를 살렸습니다. ‘입에’나 의역적 표현은 이 구체성을 약화시킵니다.
- source_word: וְהוֹרֵיתִיךָ
  english_pob_choice: teach you
  chosen_korean: 가르치겠습니다
  alternatives_korean:
  - 가르쳐 주겠습니다
  - 알려주겠습니다
  - 지시하겠습니다
  lexicon: HALOT
  rationale: 히필형 ירה의 ‘가르치다/지시하다’ 뜻을 반영하되, 뒤의 내용절과 가장 자연스럽게 이어지는 동사로 옮겼습니다.
- source_word: אֲשֶׁר תְּדַבֵּר
  english_pob_choice: what you shall speak
  chosen_korean: 당신이 말해야 할 것을
  alternatives_korean:
  - 당신이 말할 것을
  - 당신이 말해야 하는 것
  - 당신이 할 말을
  lexicon: HALOT
  rationale: 미래 서술을 단순 예고로만 약화시키지 않고, 하나님이 정해 주시는 발화 내용이라는 목적·의무성을 살렸습니다. ‘말하다’는 דבר의 격식 있는 대응을 유지합니다.
theological_decisions:
- issue: 하나님의 임재가 ‘입과 함께함’이라는 구체적 이미지로 제시됨
  chosen_reading: ‘당신의 입과 함께 있어’로 직역성을 살렸습니다.
  alternative_readings:
  - ‘말할 때 도와주겠다’
  - ‘당신의 말을 도우겠다’
  rationale: 본문은 추상적 도움보다 하나님 자신의 동행과 언어 능력의 부여를 구체적으로 말하므로, 그 이미지를 평탄화하지 않고 보존하는 것이 합당합니다.
  doctrine_reference: 'Translation philosophy #3, preserve theological tension rather than resolve it'
