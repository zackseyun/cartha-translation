id: EXO.4.16
reference: Exodus 4:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דִבֶּר ה֥וּא לְ/ךָ֖ אֶל הָ/עָ֑ם וְ/הָ֤יָה הוּא֙ יִֽהְיֶה לְּ/ךָ֣ לְ/פֶ֔ה וְ/אַתָּ֖ה תִּֽהְיֶה לּ֥/וֹ לֵֽ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/016.yaml
  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
  footnotes:
  - marker: a
    text: Or, 'he will be your mouth.' The Hebrew literally uses 'mouth' as a metaphor for a spokesperson.
    reason: lexical_alternative
  - marker: b
    text: Or, 'you will be God to him' or 'like God to him.' The sense is that Moses will stand in a God-given authoritative, representative role toward Aaron.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 당신을 위해 백성에게 말할 것이며, 당신을 위해 입이 될 것이고, 당신은 그에게 하나님처럼 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 당신의 입이 될 것입니다.’ 히브리어는 ‘입’을 대변자 비유로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신은 그에게 하나님이 될 것입니다’ 혹은 ‘그에게 하나님처럼 될 것입니다.’ 문맥은 모세의 대표적 권위를 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל הָעָם
  english_pob_choice: He will speak to the people for you
  chosen_korean: 그는 당신을 위해 백성에게 말할 것이며
  alternatives_korean:
  - 그는 당신 대신 백성에게 말할 것이며
  - 그는 당신을 위해 백성에게 말할 것입니다
  lexicon: HALOT
  rationale: לְךָ는 단순한 방향이 아니라 대리·수혜의 뜻이므로 ‘당신을 위해’로 옮기고, הָעָם은 문맥상 이스라엘 ‘백성’으로 자연스럽게 번역했습니다.
- source_word: לְפֶה
  english_pob_choice: as a mouth for you
  chosen_korean: 입이 될 것이고
  alternatives_korean:
  - 당신의 입이 될 것이고
  - 말하는 사람이 될 것이고
  lexicon: HALOT
  rationale: 페ה의 문자적 이미지를 살리기 위해 뜻풀이인 ‘대변자’보다 ‘입’ 이미지를 유지하되, 한국어 문장에서는 ‘입이 될 것이고’로 유려하게 처리했습니다.
- source_word: לֵאלֹהִים
  english_pob_choice: as God to him
  chosen_korean: 그에게 하나님처럼 될 것입니다
  alternatives_korean:
  - 그에게 하나님이 될 것입니다
  - 그에게 하나님과 같이 될 것입니다
  lexicon: HALOT
  rationale: אֱלֹהִים의 기능적·대표적 의미를 살리면서도, 모세를 존재론적으로 신격화하지 않도록 ‘하나님처럼’으로 옮겼습니다.
theological_decisions:
- issue: 모세의 역할을 신적 존재로 오해하게 할 수 있는 לֵאלֹהִים의 번역
  chosen_reading: 그에게 하나님처럼 될 것입니다
  alternative_readings:
  - 그에게 하나님이 될 것입니다
  - 그에게 하나님과 같이 될 것입니다
  rationale: 문맥상 모세는 아론에게 하나님의 말씀을 위임하는 권위적 대표자로 서는 것이므로, 기능적 유사성을 드러내는 ‘하나님처럼’이 원문의 강도를 유지하면서도 오해를 줄입니다.
  doctrine_reference: 성경 문맥의 대표성/중보 역할, 역사적 정통 신학
