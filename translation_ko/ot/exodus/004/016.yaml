base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/016.yaml
  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
  footnotes:
  - marker: a
    text: Or, 'he will be your mouth.' The Hebrew literally uses 'mouth' as a metaphor for a spokesperson.
    reason: lexical_alternative
  - marker: b
    text: Or, 'you will be God to him' or 'like God to him.' The sense is that Moses will stand in a God-given authoritative, representative role toward Aaron.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 당신을 대신하여[a] 백성에게 말할 것이며, 당신의 입이 될 것이고, 당신은 그에게 하나님처럼 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 당신을 위하여 백성에게 말할 것입니다.’ 이어지는 표현에서 그는 ‘당신의 입’, 곧 대변자가 됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신은 그에게 하나님이 될 것입니다’ 또는 ‘하나님과 같이 될 것입니다.’ 문맥상 모세는 아론에게 하나님의 말씀과 권위를 전달하는 대표적 역할을 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל הָעָם
  english_pob_choice: He will speak to the people for you
  chosen_korean: 그는 당신을 위해 백성에게 말할 것이며
  alternatives_korean:
  - 그는 당신 대신 백성에게 말할 것이며
