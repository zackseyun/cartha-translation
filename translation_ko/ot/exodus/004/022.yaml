translation:
  language: ko
  text: 그러면 파라오에게 이렇게 말씀하십시오. “야훼께서 이렇게 말씀하십니다. 이스라엘은 내 맏아들입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 어순을 더 따르자면 “이스라엘은 내 아들, 내 맏아들입니다”라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָמַרְתָּ אֶל פַּרְעֹה
  english_pob_choice: Then you shall say to Pharaoh
  chosen_korean: 그러면 바로 파라오에게 이렇게 말씀하십시오
  alternatives_korean:
  - 그리고 파라오에게 말씀하십시오
  - 파라오에게 말씀해야 합니다
  lexicon: HALOT
  rationale: 명령형/지시형 맥락을 살려 ‘말씀하십시오’로 옮기고, וְ의 순차적 힘은 ‘그러면 바로’로 자연스럽게 표현했습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하시기를
  - 야훼께서 이와 같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식의 장중함을 살리되 현대 한국어에서는 ‘이렇게 말씀하십니다’가 가장 자연스럽고, יְהוָה는 본문 원명 그대로 야훼로 옮겼습니다.
- source_word: בְּנִי בְכֹרִי
  english_pob_choice: my firstborn son
  chosen_korean: 내 맏아들입니다
  alternatives_korean:
  - 내 아들, 내 맏아들입니다
  - 내 첫째 아들입니다
  lexicon: HALOT
  rationale: ‘아들’과 ‘맏아들’의 결합이 담는 친자·우선권 의미를 유지하면서 한국어에서는 ‘맏아들’이 가장 자연스럽고 함의도 충분히 드러냅니다.
- source_word: יִשְׂרָאֵל
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘이
  lexicon: HALOT
  rationale: 고유명사를 음역해 유지했고, 서술식 한국어에서는 주어를 앞세워 “이스라엘은 …입니다”로 처리해 히브리어 계사문 구조를 반영했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 구절은 신적 이름을 직접 사용하므로 일반 호칭인 ‘주’로 대체하지 않고, 프로젝트 기본값에 따라 야훼를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 이스라엘을 ‘아들/맏아들’로 부르는 언약적 은유
  chosen_reading: 이스라엘은 내 맏아들입니다
  alternative_readings:
  - 이스라엘은 내 아들, 내 맏아들입니다
  - 이스라엘은 내 첫아들입니다
  rationale: 히브리어의 중첩된 소유·서열 표현을 너무 평평하게 만들지 않으면서도, 한국어에서 자연스럽고 언약적 특권을 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
