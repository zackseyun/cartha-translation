translation:
  language: ko
  text: 그때 십보라는 부싯돌을 가져다가 자기 아들의 포피를 잘라 내어, 그것을 그의 발에 대고[a] 말했습니다. “정녕 당신은 나에게 피의 신랑이군요.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 발’이라고 되어 있습니다. ‘발’은 성기를 완곡하게 가리키는 표현일 수 있으며, 이 대명사는 모세나 아들을 가리킬 수 있습니다.
    reason: lexical_alternative
