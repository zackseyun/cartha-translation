source:
  edition: WLC
  text: וְ/אֶת הַ/מַּטֶּ֥ה הַ/זֶּ֖ה תִּקַּ֣ח בְּ/יָדֶ֑/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה בּ֖/וֹ אֶת הָ/אֹתֹֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/017.yaml
  text: And take this staff in your hand[b][a], with which you will perform the signs.
  footnotes:
  - marker: a
    text: Or 'rod' instead of 'staff.' The Hebrew מַטֶּה can denote either, but 'staff' better fits Moses' shepherd context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the miraculous signs.' The Hebrew simply says 'the signs,' leaving the nature of the signs to the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 지팡이를 네 손에 잡아라.[a] 이것으로 네가 그 표적들을 행할 것이다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘막대기’로도 옮길 수 있습니다. 히브리어 מַטֶּה는 둘 다 가리킬 수 있지만, 여기서는 모세의 목자 문맥에 ‘지팡이’가 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 기적적인 표적들’로 옮길 수 있습니다. 히브리어는 단순히 ‘그 표적들’이라고만 말하여, 그 성격은 문맥이 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  english_pob_choice: staff
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 막대
  lexicon: HALOT
  rationale: מַטֶּה는 ‘staff/rod’ 범위의 말로, 출애굽기 4장의 목자 문맥에서는 한국어 ‘지팡이’가 가장 자연스럽고 기능적으로도 잘 맞습니다.
- source_word: תִּקַּח בְּיָדֶךָ
  english_pob_choice: take ... in your hand
  chosen_korean: 네 손에 잡아라
  alternatives_korean:
  - 네 손에 들어라
  - 네 손에 가지라
  lexicon: HALOT
  rationale: 명령형의 힘을 살리면서도 한국어에서 어색하지 않게 ‘잡아라’로 옮겼습니다. ‘in your hand’는 직역보다 관용적으로 자연스러운 표현이 적절합니다.
- source_word: אֲשֶׁר תַּעֲשֶׂה בּוֹ
  english_pob_choice: with which you will perform
  chosen_korean: 이것으로 네가 … 행할 것이다
  alternatives_korean:
  - 이것으로 네가 … 할 것이다
  - 이것으로 네가 … 베풀 것이다
  lexicon: HALOT
  rationale: 도구를 나타내는 בּוֹ의 의미를 살려 ‘이것으로’로 처리했습니다. עָשָׂה는 여기서 표적을 ‘행하다/베풀다’의 뜻이므로 ‘행할 것이다’가 가장 무난합니다.
- source_word: הָאֹתֹת
  english_pob_choice: the signs
  chosen_korean: 그 표적들
  alternatives_korean:
  - 그 징조들
  - 그 이적들
  - 그 표적
  lexicon: HALOT
  rationale: 오ֹת는 본문에서 확증적 기적/표징을 가리키므로 ‘표적’이 원뜻을 비교적 잘 보존합니다. 복수형도 한국어에서 자연스럽게 살리기 위해 ‘표적들’로 옮겼습니다.
theological_decisions:
- issue: אֹתֹת의 성격
  chosen_reading: 본문은 단순히 ‘표적들’이라고만 말하고, 그 성격이 기적인지 여부는 문맥에 맡깁니다.
  alternative_readings:
  - 그 기적적인 표적들
  - 그 이적들
  rationale: 영어 POB도 ‘the signs’로 유지하고 ‘miraculous’는 각주로만 열어 두었습니다. 본문에서는 과도한 해석을 피하고, 표적의 기능을 그대로 드러내는 편이 원문에 가깝습니다.
  doctrine_reference: 출 4:1-9의 표징 맥락
