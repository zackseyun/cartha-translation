translation:
  language: ko
  text: 모세는 아내와 아들들을 나귀에 태우고[a] 이집트 땅으로 돌아갔습니다. 그리고 모세는 하나님의 지팡이를 손에 들었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
