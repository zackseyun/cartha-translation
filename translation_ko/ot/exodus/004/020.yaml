  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה אֶת אִשְׁתּ֣/וֹ וְ/אֶת בָּנָ֗י/ו וַ/יַּרְכִּבֵ/ם֙ עַֽל הַ/חֲמֹ֔ר וַ/יָּ֖שָׁב אַ֣רְצָ/ה מִצְרָ֑יִם וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
  footnotes:
  - marker: a
    text: Or 'made them ride on the donkey.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the rod of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 그의 아내와 그의 아들들을 데리고 나귀에 태워 이집트 땅으로 돌아갔습니다. 그리고 모세는 하나님의 지팡이를 자기 손에 들고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나귀에 타게 하였다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님의 막대기’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת אִשְׁתּוֹ וְאֶת בָנָיו
  english_pob_choice: his wife and his sons
  chosen_korean: 그의 아내와 그의 아들들을
  alternatives_korean:
  - 그의 아내와 그의 자녀들을
  - 아내와 아들들을
  lexicon: HALOT
  rationale: 히브리어는 남성 복수인 ‘아들들’(בָנָיו)을 사용하므로, 일반화한 ‘자녀들’보다 ‘아들들’을 유지했습니다.
- source_word: וַיַּרְכִּבֵם
  english_pob_choice: set them on the donkey
  chosen_korean: 나귀에 태워
  alternatives_korean:
  - 나귀 위에 태우고
  - 나귀에 올라타게 하고
  lexicon: HALOT
  rationale: 사역형 의미를 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: אַרְצָה מִצְרָיִם
  english_pob_choice: to the land of Egypt
  chosen_korean: 이집트 땅으로
  alternatives_korean:
  - 이집트 땅으로
  - 이집트로
  lexicon: HALOT
  rationale: ‘땅’에 해당하는 אֶרֶץ의 지리적 뉘앙스를 살리되, 한국어에서는 간결하게 ‘이집트 땅으로’로 옮겼습니다.
- source_word: מַטֵּה הָאֱלֹהִים
  english_pob_choice: the staff of God
  chosen_korean: 하나님의 지팡이
  alternatives_korean:
  - 하나님의 막대기
  - 하나님의 지팡이
  lexicon: HALOT
  rationale: מַטֶּה는 현대 한국어에서 성경적 용례에 자연스러운 ‘지팡이’가 적절하며, 소유격 ‘하나님의’를 유지해 직역성을 보존했습니다.
theological_decisions:
- issue: 모세가 지팡이를 손에 든 상태를 어떻게 마무리하는가
  chosen_reading: ‘하나님의 지팡이를 자기 손에 들고 있었습니다’로 상태를 분명히 했습니다.
  alternative_readings:
  - ‘하나님의 지팡이를 손에 가지고 있었습니다’
  - ‘하나님의 지팡이를 손에 쥐고 있었습니다’
  rationale: 원문은 마지막 절에서 모세가 지팡이를 손에 가진 상태를 덧붙여 강조하므로, 단순 사건 나열이 아니라 동반 상태를 드러내는 표현을 택했습니다.
  doctrine_reference: 서사 흐름과 반복 강조의 보존
