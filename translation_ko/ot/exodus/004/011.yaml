source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו מִ֣י שָׂ֣ם פֶּה֮ לָֽ/אָדָם֒ א֚וֹ מִֽי יָשׂ֣וּם אִלֵּ֔ם א֣וֹ חֵרֵ֔שׁ א֥וֹ פִקֵּ֖חַ א֣וֹ עִוֵּ֑ר הֲ/לֹ֥א אָנֹכִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: ko
  text: 그리고 야훼께서 그에게 말씀하셨습니다. “누가 사람에게 입을 주었습니까? 누가 사람을 말 못 하게 하거나 귀 먹게 하거나 눈 뜨게 하거나 눈멀게 합니까? 내가, 야훼가 아니냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 야훼는 히브리어 본문의 신적 이름 יהוה를 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר יְהוָה אֵלָיו
  english_pob_choice: And the LORD said to him
  chosen_korean: 그리고 야훼께서 그에게 말씀하셨습니다
  alternatives_korean:
  - 그리고 주님께서 그에게 말씀하셨습니다
  - 그리고 야훼께서 그에게 이르셨습니다
  lexicon: יהוה → 야훼; אמר → 말씀하다
  rationale: 본문의 신적 이름은 프로젝트 기본값에 따라 야훼로 옮기고, 직접 화법 도입은 한국어에서 가장 자연스러운 ‘말씀하셨습니다’로 처리했습니다.
- source_word: מִי שָׂם פֶּה לָאָדָם
  english_pob_choice: Who has put a mouth on man?
  chosen_korean: 누가 사람에게 입을 주었습니까?
  alternatives_korean:
  - 누가 사람에게 입을 달았습니까?
  - 누가 사람에게 입을 만드셨습니까?
  lexicon: שׂים פֶּה → 입을 주다
  rationale: 히브리어의 직역적 이미지를 살리되 한국어에서는 ‘입을 주다’가 창조적 부여를 자연스럽게 드러내므로 채택했습니다.
- source_word: אִלֵּם / חֵרֵשׁ / פִקֵּחַ / עִוֵּר
  english_pob_choice: mute, deaf, sighted, or blind
  chosen_korean: 말 못 하게 하거나 귀 먹게 하거나 눈 뜨게 하거나 눈멀게 합니까
  alternatives_korean:
  - 벙어리로 만들거나 귀머거리로 만들거나 보게 하거나 눈멀게 합니까
  - 말 못 하게 하거나 귀가 먹게 하거나 볼 수 있게 하거나 눈멀게 합니까
  lexicon: 형용사적 상태표현
  rationale: POB의 ‘sighted’를 반영해 단순히 ‘보게 하다’보다 ‘눈 뜨게 하다’로 옮겨, 상태 대조를 더 분명하게 했습니다.
- source_word: הֲלֹא אָנֹכִי יְהוָה
  english_pob_choice: Is it not I, the LORD?
  chosen_korean: 내가, 야훼가 아니냐
  alternatives_korean:
  - 바로 내가 야훼가 아니냐
  - 내가 바로 야훼가 아니냐
  lexicon: הֲלֹא אָנֹכִי → 내가 아니냐
  rationale: 반문 구조를 살려 하나님의 자기 확인을 강하게 드러내되, 한국어 어순에 맞게 자연스럽게 배열했습니다.
theological_decisions:
- issue: 신적 주권이 장애와 감각 능력의 근원에까지 미친다는 진술
  chosen_reading: 본문의 질문들은 하나님이 언어·청각·시각 능력의 부여자이시며, 인간의 조건을 궁극적으로 주관하신다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 읽어 단지 창조 질서 일반을 말하는 것으로 축소하는 해석
  - 장애 관련 표현을 약화하여 도덕적 불편을 줄이는 해석
  rationale: 히브리어 수사 질문의 강도를 유지해야 본문의 신학적 초점—야훼의 절대 주권—이 흐려지지 않습니다.
  doctrine_reference: 출애굽기 4:11; 하나님 주권론
