- from: 그리고 야훼께서 그에게 말씀하셨습니다. “누가 사람에게 입을 주었습니까? 누가 사람을 말 못 하게 하거나 귀 먹게 하거나 눈 뜨게 하거나 눈멀게 합니까? 내가, 야훼가 아니냐?”[a]
