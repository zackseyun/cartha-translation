base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
  footnotes:
  - marker: a
    text: Or, 'I know that he speaks fluently' or more literally, 'speaking he will speak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 분노가 모세에게 타올랐습니다. 그분이 말씀하셨습니다. “네 형 아론, 그 레위인은 있지 않느냐? 나는 그가 말을 잘할 줄 압니다. 그리고 보십시오, 그가 너를 만나러 나오고 있습니다. 그가 너를 보면, 마음속으로 기뻐할 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 유창하게 말한다’ 혹은 더 문자적으로는 ‘말하면서 그는 말할 것이다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: the LORD’s anger burned
  chosen_korean: 야훼의 분노가 타올랐습니다
  alternatives_korean:
  - 야훼의 노가 불타올랐습니다
  - 야훼께서 크게 노하셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘타오르다/불붙다’ 이미지를 살리되, 현대 한국어에서 자연스러운 ‘분노가 타올랐습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 신명기적 고유명사를 제목어로 치환하지 않고, POB 기준에 따라 ‘야훼’로 직접 음역했습니다.
- source_word: הַלֵּוִי
  english_pob_choice: the Levite
  chosen_korean: 그 레위인
  alternatives_korean:
  - 레위 사람
  - 레위 자손
  lexicon: HALOT
  rationale: 아론의 지파적 소속을 나타내는 표지를 현대 독자가 바로 이해하도록 ‘레위인’으로 처리했습니다.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  english_pob_choice: I know that he can speak well
  chosen_korean: 나는 그가 말을 잘할 줄 압니다
  alternatives_korean:
  - 나는 그가 분명히 말할 줄 압니다
  - 나는 그가 말하고 또 말할 줄 압니다
  lexicon: HALOT
  rationale: 동사-부정사 강조형의 능력·유창성을 한국어에서 가장 자연스럽게 전달할 수 있도록, ‘말을 잘할 줄 압니다’로 능력을 압축해 살렸습니다.
- source_word: וְרָאֲךָ
  english_pob_choice: when he sees you
  chosen_korean: 그가 너를 보면
  alternatives_korean:
  - 그가 너를 보게 되면
  - 그가 너를 볼 때
  lexicon: HALOT
  rationale: 뒤따르는 결과절과의 관계를 드러내는 시간 조건을 한국어의 ‘-면’으로 자연스럽게 나타냈습니다.
theological_decisions:
- issue: Direct speech register in Yahweh’s words
  chosen_reading: 야훼의 직접 화법은 현대 서술체를 유지하되, 명령이나 호소가 아닌 진술은 합쇼체로 통일했습니다.
  alternative_readings:
  - 직접 인용부 안에서 반말형으로 낮추기
  - 구어체로 완전히 평준화하기
  rationale: 본문은 경고와 설명의 진술로 이루어져 있어, 한국어 독자가 하나님의 발화를 위엄 있게 읽도록 합쇼체를 유지하는 것이 적절합니다.
  doctrine_reference: POB Korean style / direct divine speech register
