  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
  footnotes:
  - marker: a
    text: Or, 'I know that he speaks fluently' or more literally, 'speaking he will speak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 분노가 모세를 향해 타올랐습니다. 야훼께서 말씀하셨습니다. “너의 형 아론, 그 레위인이 있지 않습니까? 나는 그가 말을 잘할 줄 압니다[a]. 그리고 보십시오, 그가 너를 만나러 나오고 있습니다. 그가 너를 보면 마음속으로 기뻐할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 유창하게 말한다’ 혹은 더 문자적으로는 ‘그는 반드시 말할 것이다’.
    reason: lexical_alternative
