  text: 야훼께서 그에게 다시 말씀하셨습니다. “부디 네 손을 네 품속에 넣으십시오.” 그가 손을 품속에 넣었다가 꺼내자, 보십시오, 그의 손에 나병[a]이 들어 눈처럼 하얘졌습니다.
