base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
  footnotes:
  - marker: a
    text: Hebrew 'bridegroom of blood,' a difficult idiom; possibly an exclamation tied to the circumcision rite.
