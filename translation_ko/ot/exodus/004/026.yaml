  - marker: b
    text: Hebrew is plural, 'because of the circumcisions' or 'circumcision rites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그분은 그를 놓아주셨습니다[a]. 그때 그녀가 말했습니다[b], 「피의 신랑」 — 이는 할례 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 ‘그에게서 물러나셨다’는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 복수형으로, ‘할례들 때문에’ 또는 ‘할례 의식 때문에’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  english_pob_choice: he let him alone
  chosen_korean: 그분은 그를 놓아주셨습니다
  alternatives_korean:
  - 그분은 그에게서 물러나셨습니다
  - 그분은 그를 떠나셨습니다
  - 그분은 그를 그만두셨습니다
  lexicon: HALOT
  rationale: 동사 רפה는 여기서 공격 행위의 중단을 뜻하므로, 문맥상 가장 자연스럽게 ‘놓아주셨습니다’로 옮겨 하나님의 행동이 멈춘 의미를 살렸습니다.
- source_word: אָז אָמְרָה
  english_pob_choice: Then she said
  chosen_korean: 그때 그녀가 말했습니다
  alternatives_korean:
  - 그러자 그녀가 말했습니다
  - 그때 그녀가 선언했습니다
  lexicon: HALOT
  rationale: אָז는 앞선 사건 뒤의 시간적 전환을 표시하므로 ‘그때/그러자’로 옮겼고, אמרה는 과장하지 않고 ‘말했습니다’로 유지했습니다.
- source_word: חֲתַן דָּמִים
  english_pob_choice: a bridegroom of blood
  chosen_korean: 피의 신랑
  alternatives_korean:
  - 피의 혼인남
  - 피로 된 신랑
  - 피흘림의 신랑
  lexicon: HALOT
  rationale: 이 표현은 난해한 관용구이므로 의미를 풀어 쓰기보다 히브리어의 압축성과 낯섦을 살린 직역형으로 보존했습니다.
- source_word: לַמּוּלֹת
  english_pob_choice: because of the circumcision
  chosen_korean: 할례 때문입니다
  alternatives_korean:
  - 할례들 때문입니다
  - 할례 의식 때문입니다
  - 할례 행위 때문입니다
  lexicon: HALOT
  rationale: 어근 מול에서 온 복수형으로, 영어 POB처럼 사건 맥락상 할례를 가리키는 것으로 이해하되 한국어 본문에서는 자연스럽게 단수 ‘할례’로 옮겼습니다.
theological_decisions:
- issue: וַיִּרֶף מִמֶּנּוּ의 주체와 객체
  chosen_reading: 주체를 앞 문맥의 야훼로, 객체를 모세로 이해했습니다.
  alternative_readings:
  - 주체를 더 일반적으로 이해할 수 있습니다
  - 객체를 사건 전체의 대상로 넓게 볼 수 있습니다
  rationale: 직전 절의 공격 주체와 직후 절의 할례 장면을 함께 보면, 본 절은 야훼께서 모세를 더 이상 치지 않으셨다는 뜻으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥이 허용하는 범위 안에서 서술적 긴장을 유지합니다.
- issue: חֲתַן דָּמִים의 의미를 해석할지 여부
  chosen_reading: 정확한 정서나 제의적 함의를 단정하지 않고, 난해한 관용구 자체를 보존했습니다.
  alternative_readings:
  - 거부감의 감탄사로 볼 수 있습니다
  - 할례와 연결된 의례적 호칭으로 볼 수 있습니다
  - 모세나 아들을 향한 발화로 볼 수 있습니다
  rationale: 히브리어 자체가 문화적으로 난해하므로, 본문이 분명히 말하지 않는 정서를 덧붙이지 않고 표현을 그대로 살리는 것이 원문의 힘을 가장 잘 보존합니다.
  doctrine_reference: 과도한 해석을 피하고 본문이 가진 긴장을 유지합니다.
