lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 나아갔습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 이어 주는 wayyiqtol의 기본 의미를 살려, 문맥상 목적 행동으로 이어지는 ‘가서’로 옮겼습니다.
- source_word: וַיַּאַסְפוּ
  english_pob_choice: gathered
  chosen_korean: 모았습니다
  alternatives_korean:
  - 모아들였습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: 사람들을 한데 불러 모으는 뜻이므로, 현대 한국어에서 가장 자연스럽고 간결한 ‘모았습니다’가 적절합니다.
- source_word: זִקְנֵי
  english_pob_choice: elders
  chosen_korean: 장로
  alternatives_korean:
  - 원로
  - 노장
  lexicon: HALOT
  rationale: 공동체의 공인된 지도층을 가리키는 용례를 반영해, 단순한 연장자보다 기능을 드러내는 ‘장로’를 선택했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 히브리어의 친족 표현을 살려 ‘이스라엘 자손’으로 옮겼고, 영어 POB의 ‘sons of Israel’ 선택과도 맞춥니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 번역
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  rationale: 이 표현은 단순한 민족명보다 언약적·혈연적 정체성을 드러내므로, 본문의 친족 표현을 그대로 살리는 번역이 더 충실합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
