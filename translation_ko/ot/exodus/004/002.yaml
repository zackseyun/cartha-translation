translation:
  language: ko
  text: 야훼께서 그에게 말씀하셨습니다. 「당신의 손에 있는 것이 무엇입니까?」 그가 말했습니다. 「지팡이입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַטֶּה는 문맥에 따라 지팡이, 막대, 막대기 등을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / 프로젝트 기본 용례
  rationale: 히브리어 고유명사 יהוה는 본문과 대조되는 일반 호칭이 아니라 신적 이름이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 신명(神名)을 유지했습니다.
- source_word: מַה־זֶּה / מִזֶּה
  english_pob_choice: What is that
  chosen_korean: 무엇이 있느냐
  alternatives_korean:
  - 그것이 무엇이냐
  - 그 손에 있는 것이 무엇이냐
  lexicon: HALOT
  rationale: 질문은 모세의 손에 있는 사물을 가리키는 식별 질문이므로, 자연스러운 한국어 대화체로 압축하되 대상 지시가 드러나도록 ‘무엇이 있느냐’로 옮겼습니다.
- source_word: בְּיָדֶךָ
  english_pob_choice: in your hand
  chosen_korean: 네 손에
  alternatives_korean:
  - 네 손안에
  - 네가 들고 있는 손에
  lexicon: HALOT
  rationale: 직역하면서도 현대 한국어에서 자연스러운 신체 부위 표현을 유지하기 위해 ‘네 손에’로 번역했습니다.
- source_word: מַטֶּה
  english_pob_choice: A staff
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 막대
  - 몽둥이
  lexicon: HALOT
  rationale: מַטֶּה는 문맥상 지팡이, 막대, 막대기 등을 가리킬 수 있지만, 모세가 들고 있는 물건을 가장 자연스럽고 중립적으로 드러내는 현대 한국어는 ‘지팡이’입니다.
theological_decisions:
- issue: 하나님 이름의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 출애굽기 4:2의 יְהוָה는 인격적 신명으로 제시되므로, 본문에서 그 이름 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
