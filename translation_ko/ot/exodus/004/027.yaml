base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
  footnotes:
  - marker: a
    text: Or “Go into the wilderness to meet Moses.” The Hebrew can be construed to emphasize movement toward the wilderness as the place of meeting.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 아론에게 말씀하셨습니다. “광야로 나가 모세를 맞으라.” 그래서 그가 가서 하나님의 산에서 그를 만나 그에게 입을 맞추었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “광야를 향하여 모세를 맞으러 가라.” 히브리어는 만남의 장소가 광야임을 강조하는 방향으로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC
  rationale: 본 프로젝트의 기본 원칙에 따라 언약의 이름 יְהוָה는 번역어 대용이 아니라 고유한 이름으로 옮기기 위해 ‘야훼’를 사용했습니다.
- source_word: הַמִּדְבָּרָה
  english_pob_choice: in the wilderness
  chosen_korean: 광야로
  alternatives_korean:
  - 광야에서
  - 광야에
  lexicon: WLC
  rationale: 히브리어 방향형 어미가 장소 자체보다 그곳을 향한 이동을 담고 있어, 아론이 ‘광야로’ 가라는 뜻을 살렸습니다.
- source_word: וַיִּפְגְּשֵׁהוּ
  english_pob_choice: met him
  chosen_korean: 그를 만나
  alternatives_korean:
  - 그를 마주치고
  - 그와 만났고
  lexicon: WLC
  rationale: פּגש는 여기서 단순한 조우가 아니라 지시된 만남을 뜻하므로, 자연스러운 서술체인 ‘그를 만나’로 옮겼습니다.
- source_word: בְּהַר הָאֱלֹהִים
  english_pob_choice: at the mountain of God
  chosen_korean: 하나님의 산에서
  alternatives_korean:
  - 하나님의 산 위에서
  - 하나님의 산에서
  lexicon: WLC
  rationale: 히브리어 전치사 בְּ와 속격구조를 한국어의 장소 표현 ‘~에서’로 자연스럽게 반영했습니다.
- source_word: וַיִּשַּׁק לוֹ
  english_pob_choice: kissed him
  chosen_korean: 그에게 입을 맞추었습니다
  alternatives_korean:
  - 그를 입맞추었습니다
  - 그에게 입을 맞추어 인사했습니다
  lexicon: WLC
  rationale: נשׁק의 기본 의미를 직접 살리되, 한국어에서 다소 문어적인 ‘입을 맞추다’로 옮겨 서사적 인사 장면의 성격을 유지했습니다.
theological_decisions:
- issue: 야훼의 음성 표기
  chosen_reading: 본문에서 하나님의 이름을 ‘야훼’로 음역해 고유명성을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 출애굽기 본문의 טetragrammaton을 통상적 대체 칭호로 바꾸지 않고, 프로젝트 기본 용례를 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
