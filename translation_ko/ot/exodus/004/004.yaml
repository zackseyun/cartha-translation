base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
  footnotes:
  - marker: a
    text: Or “grasp its tail” or “take hold of it by the tail.”
    reason: lexical_alternative
  - marker: b
    text: Or “rod.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. 「네 손을 내밀어 꼬리를 잡아라[a].」 그래서 그는 손을 내밀어 그것을 잡았고, 그것은 그의 손에서 지팡이가 되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 꼬리를 붙잡아라” 또는 “꼬리를 붙들어라”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “막대기”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: POB가 하나님의 고유명을 ‘Yahweh’로 옮긴 점을 따라, 한국어도 관용적 대체칭호인 ‘주님’ 대신 ‘야훼’로 옮겨 원문 고유명을 보존했습니다.
- source_word: שְׁלַח יָדְךָ
  english_pob_choice: Reach out your hand
  chosen_korean: 네 손을 내밀어
  alternatives_korean:
  - 손을 뻗어
  - 손을 내밀고
  lexicon: WLC/HALOT
  rationale: 손에 대한 물리적 동작 명령을 자연스러운 현대 한국어로 살리되, 명령의 직접성을 유지하기 위해 ‘내밀어’로 옮겼습니다.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  english_pob_choice: take hold of its tail
  chosen_korean: 꼬리를 잡아라
  alternatives_korean:
  - 그 꼬리를 붙잡아라
  - 꼬리로 잡아라
  lexicon: WLC/HALOT
  rationale: 동사의 핵심은 ‘붙잡다/잡다’이며, 전치사의 미묘한 수단성보다 명령의 행위를 분명히 드러내는 ‘꼬리를 잡아라’가 가장 간결하고 자연스럽습니다.
- source_word: וַיְהִי לְמַטֶּה
  english_pob_choice: it became a staff
  chosen_korean: 지팡이가 되었습니다
  alternatives_korean:
  - 막대기가 되었습니다
  - 막대처럼 되었습니다
  lexicon: WLC/HALOT
  rationale: מַטֶּה는 상황상 모세의 목자 지팡이를 가리키므로, 한국어에서는 ‘지팡이’가 가장 자연스럽고 문맥에 맞는 대응입니다.
theological_decisions:
- issue: 여호와/YHWH의 한국어 표기
  chosen_reading: ‘야훼’로 직역해 하나님의 고유명을 드러냈습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문은 주어가 하나님의 일반칭호가 아니라 언약적 고유명 יְהוָה이므로, POB의 원칙에 맞춰 대체칭호를 쓰지 않고 고유명 자체를 보존했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → Yahweh'
