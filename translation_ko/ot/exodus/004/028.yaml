translation:
  language: ko
  text: 모세는 자신을 보내신 야훼의 모든 말씀[a]과 야훼께서 모세에게 명하신 모든 표징을 아론에게 알렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께서 모세를 보내실 때 맡기신 모든 말씀”으로도 볼 수 있습니다. 히브리어 관계절은 ‘말씀’에 더 밀착하여 읽을 수 있지만, 전체 뜻은 야훼께서 모세를 보내셨다는 점입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 말했습니다
  alternatives_korean:
  - 전했습니다
  - 알렸습니다
  lexicon: HALOT
  rationale: 히필 נגד의 기본 의미는 ‘알리다/말하다’이므로, 서술체에서 자연스러운 ‘말했습니다’로 옮겼습니다.
- source_word: דִּבְרֵי יְהוָה
  english_pob_choice: the words of Yahweh
  chosen_korean: 야훼께서 자기를 보내신 그분의 모든 말씀
  alternatives_korean:
  - 야훼의 모든 말씀
  - 주님의 모든 말씀
  lexicon: HALOT
  rationale: דְּבָרִים을 단순히 ‘말씀들’로 두되, 뒤의 관계절을 함께 살려 ‘보내신 그분’으로 엮었습니다. 영어 POB의 문맥상 관계절이 야훼를 가리키므로 그 연결을 한국어로 분명히 드러냈습니다.
- source_word: הָאֹתֹת
  english_pob_choice: the signs
  chosen_korean: 모든 표징
  alternatives_korean:
  - 모든 징조
  - 모든 기적의 표징
  lexicon: HALOT
  rationale: 출애굽기 문맥의 אוֹת은 단순한 표지보다 하나님의 권능을 보이는 ‘표징’이 더 정확해 보이며, 과도한 해설을 덧붙이지 않기 위해 간결하게 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
