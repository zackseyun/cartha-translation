  - 주님
  rationale: 본문의 신명사 טְרַ그라맛톤을 고유명사로 보존하기 위해 ‘야훼’로 옮겼습니다. 이는 호칭 대체보다 원문 고유성을 더 직접적으로 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
