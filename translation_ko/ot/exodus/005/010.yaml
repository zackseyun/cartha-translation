base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
  footnotes:
  - marker: a
    text: Or “their foremen.” The Hebrew term can denote subordinate officials among the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 백성의 감독들과 그들의 관리들이 나가서 백성에게 말하며 이르기를, “바로가 이같이 말합니다. 나는 너희에게 짚을 주지 않겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 하급 관리들”로 옮길 수 있습니다. 히브리어는 백성 가운데 있는 종속 관리들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  english_pob_choice: taskmasters
  chosen_korean: 감독들
  alternatives_korean:
  - 부역 감독들
  - 강제노역 감독들
  - 노역 감독들
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 강제 노동을 감독하는 사람들을 가리키므로, 행정적이면서도 압박의 뉘앙스를 살려 ‘감독들’로 옮겼습니다.
- source_word: שֹׁטְרָיו
  english_pob_choice: their officers
  chosen_korean: 그들의 관리들
  alternatives_korean:
  - 그들의 장관들
  - 그들의 서기관들
  - 그들의 하급 관리들
  lexicon: HALOT
  rationale: 소유격이 ‘백성’을 가리키는 만큼, 백성에게 속한 하급 책임자라는 뜻을 살려 ‘관리들’로 번역했습니다. 영어 POB의 ‘officers’에 대응하되, 군사직보다 행정적 보조 책임자라는 범위를 유지합니다.
- source_word: תֶּבֶן
  english_pob_choice: straw
  chosen_korean: 짚
  alternatives_korean:
  - 볏짚
  - 짚더미 재료
  lexicon: HALOT
  rationale: 벽돌 제작에 쓰는 재료를 자연스러운 현대 한국어로 옮기기 위해 ‘짚’을 사용했습니다. 문맥상 볏짚이겠지만, 원문의 일반 명칭을 과도하게 구체화하지 않았습니다.
theological_decisions:
- issue: 파라오의 직접 발화 보고 방식
  chosen_reading: “바로가 이같이 말합니다. 나는 너희에게 짚을 주지 않겠습니다.”
  alternative_readings:
  - “바로가 이같이 말합니다. 나는 너희에게 짚을 주지 않소.”
  - “바로가 말하기를, 나는 너희에게 짚을 주지 않겠다.”
  rationale: 왕의 공식 선포를 현대 한국어에서 자연스럽게 들리도록 현재형 보고체로 옮겼고, 히브리어의 즉각적인 거절 뉘앙스를 살려 ‘주지 않겠습니다’로 번역했습니다.
  doctrine_reference: 서사/발화 양식
