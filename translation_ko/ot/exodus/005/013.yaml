  - 계속 몰아붙이며
  - 계속 압박하며
  - 계속 서두르게 하며
  lexicon: HALOT
  rationale: 반복적이고 강압적인 압력을 나타내므로, 지속성을 살린 ‘계속 재촉하며’가 문맥상 가장 무난합니다.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: each day’s matter in its day
  chosen_korean: 하루의 일은 그날에
  alternatives_korean:
  - 각 날의 일은 그날에
  - 하루의 분량은 그날에
  - 매일의 일은 그날에
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 구조를 너무 풀어 쓰지 않으면서도, 강제 할당된 당일 분량을 한국어로 이해되게 옮겼습니다.
- source_word: בִּהְיֹות הַתֶּבֶן
  english_pob_choice: when there was straw
  chosen_korean: 짚이 있을 때처럼
  alternatives_korean:
  - 짚이 있었을 때처럼
  - 짚이 공급되던 때처럼
  - 짚이 있던 때처럼
  lexicon: HALOT
  rationale: 과거의 비교 상황을 보여 주는 표현으로, 뒤의 압박이 짚이 제공되던 이전 상태와 같았음을 간결하게 드러냅니다.
theological_decisions:
- issue: 명령문과 인용문 안의 말투
  chosen_reading: 이 구절은 서술문 안의 직접 명령이므로, 한국어에서는 보고체 서술을 유지하고 인용문 안에서는 명령형을 그대로 살렸습니다.
  alternative_readings:
  - 인용문을 완곡한 평서로 바꾸는 방식
  - 더 고어적인 명령형으로 옮기는 방식
  rationale: 히브리어의 압박감과 명령성을 약화시키지 않으면서, 현대 한국어 독자가 바로 읽을 수 있는 합쇼체를 유지하기 위한 선택입니다.
  doctrine_reference: 출애굽기 5장의 강제 노역 서술
