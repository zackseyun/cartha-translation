  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
  footnotes:
  - marker: a
    text: Or “the daily amount each day.” The Hebrew idiom literally speaks of “the matter/word of a day in its day,” referring to the required quota assigned for each day.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 감독들은 그들을 계속 재촉하며 말했습니다. “너희 일을 끝내라. 하루의 일은 그날에 마치라. 마치 짚이 있을 때처럼.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘날의 말/일’을 뜻하며, 각 날에 부과된 할당량을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  english_pob_choice: the taskmasters
  chosen_korean: 감독들
  alternatives_korean:
  - 과업 감독들
  - 일꾼 감독들
  - 채근하는 자들
  lexicon: HALOT
  rationale: 출애굽기의 노동 문맥에서 강제 노동을 부과하는 관리들을 가리키므로, 한국어로는 직역적이면서도 기능을 드러내는 ‘감독들’이 자연합니다.
- source_word: אָצִים
  english_pob_choice: kept pressing
  chosen_korean: 계속 재촉하며
