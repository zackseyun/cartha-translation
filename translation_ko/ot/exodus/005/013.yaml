  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
  footnotes:
  - marker: a
    text: Or “the daily amount each day.” The Hebrew idiom literally speaks of “the matter/word of a day in its day,” referring to the required quota assigned for each day.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 작업 감독들은 그들을 계속 재촉하며 말했습니다. “너희 일을 끝내십시오. 그날그날의 일[a]은 그날에 마치십시오. 짚이 있었을 때처럼 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로 ‘그날의 일/사항을 그날에’라는 뜻입니다. 이 문맥에서는 날마다 요구된 일, 곧 일일 할당량을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  english_pob_choice: the taskmasters
  chosen_korean: 감독들
  alternatives_korean:
  - 과업 감독들
  - 일꾼 감독들
