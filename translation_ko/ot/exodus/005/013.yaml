  lexicon: HALOT
  rationale: 과거의 비교 상황을 보여 주는 표현으로, 뒤의 압박이 짚이 제공되던 이전 상태와 같았음을 간결하게 드러냅니다.
theological_decisions:
- issue: 명령문과 인용문 안의 말투
  chosen_reading: 이 구절은 서술문 안의 직접 명령이므로, 한국어에서는 보고체 서술을 유지하고 인용문 안에서는 명령형을 그대로 살렸습니다.
  alternative_readings:
  - 인용문을 완곡한 평서로 바꾸는 방식
  - 더 고어적인 명령형으로 옮기는 방식
  rationale: 히브리어의 압박감과 명령성을 약화시키지 않으면서, 현대 한국어 독자가 바로 읽을 수 있는 합쇼체를 유지하기 위한 선택입니다.
  doctrine_reference: 출애굽기 5장의 강제 노역 서술
