source:
  edition: WLC
  text: וַ/יְצַ֥ו פַּרְעֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֶת הַ/נֹּגְשִׂ֣ים בָּ/עָ֔ם וְ/אֶת שֹׁטְרָ֖י/ו לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/006.yaml
  text: So Pharaoh commanded on that day the taskmasters of the people and his officers[a], saying[c][b],
  footnotes:
  - marker: a
    text: Or 'that same day.' The Hebrew temporal phrase can emphasize immediacy.
    reason: lexical_alternative
  - marker: b
    text: '''Taskmasters'' renders a term for those who drove or exacted labor; ''overseers'' is another possible rendering.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his foremen.' The Hebrew term refers to subordinate officials in the labor system.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 바로 바로 파라오가 그 사람들을, 곧 백성 위에 있는 감독들과 자기 관리들에게 명령하며 말했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그날 바로’처럼, 히브리어 시간 표현은 즉각성을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘taskmasters’는 노동을 몰아붙이거나 강요하는 사람들을 가리키며, ‘overseers(감독들)’도 가능한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 하급 관리들’입니다. 히브리어 용어는 노동 체계 안의 부속 행정관들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령했습니다
  alternatives_korean:
  - 명령하였습니다
  - 지시했습니다
  lexicon: HALOT
  rationale: וַיְצַו의 서술 진행과 권위 있는 명령성을 자연스럽게 살리면서도 현대 한국어의 공문체로 과도하게 딱딱해지지 않게 했습니다.
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: on that day
  chosen_korean: 그날 바로
  alternatives_korean:
  - 그날
  - 그날 그때
  lexicon: HALOT
  rationale: 영어 POB의 ‘on that day’가 즉각성을 강조하므로, 한국어에서도 시점의 긴박함을 드러내는 ‘그날 바로’로 옮겼습니다.
- source_word: הַנֹּגְשִׂים
  english_pob_choice: the taskmasters
  chosen_korean: 그 사람들
  alternatives_korean:
  - 그 노역 감독들
  - 그 강제노동 감독들
  - 그 감독들
  lexicon: HALOT
  rationale: 문맥상 노동을 몰아붙이는 관리들이지만, 한국어 단일어가 영어의 taskmasters와 완전히 일치하지 않으므로 본문에는 지시대명사로 처리하고, 다음 어구로 기능을 풀어 주었습니다.
- source_word: שֹׁטְרָיו
  english_pob_choice: his officers
  chosen_korean: 자기 관리들
  alternatives_korean:
  - 자기 감독들
  - 자기 관리원들
  - 자기 서기관들
  lexicon: HALOT
  rationale: שֹׁטְרָיו는 하급 행정관료를 가리키므로 ‘관리들’이 역할을 넓게 보존합니다. ‘자기’는 소유대명사의 인칭을 자연스럽게 반영합니다.
theological_decisions:
- issue: 한국어에서 הַנֹּגְשִׂים와 שֹׁטְרָיו의 역할 구분을 어떻게 드러낼지
  chosen_reading: 본문에서는 ‘그 사람들, 곧 백성 위에 있는 감독들과 자기 관리들’로 두어, 강제노역을 집행하는 집단과 그 아래의 행정 관리층을 함께 보여 주었습니다.
  alternative_readings:
  - ‘노역 감독들과 그의 관리들’
  - ‘감독들과 서기관들’
  rationale: 출애굽기의 노동 억압 장면이라는 문맥을 유지하면서도, 두 명칭의 사회적 기능 차이를 한국어에서 무리 없이 드러내기 위한 선택입니다.
  doctrine_reference: 출애굽기 1–5장의 압제 서사와 문맥적 의미 보존
- issue: 직접화법 도입부 לֵאמֹר의 처리
  chosen_reading: ‘말했습니다’로 마무리해 다음 절의 직접 명령을 자연스럽게 열었습니다.
  alternative_readings:
  - ‘말하여 이르되’
  - ‘말했습니다’
  rationale: 히브리어의 표준 발화 도입공식을 현대 합쇼체 서술에 맞게 간결하게 옮겼습니다.
  doctrine_reference: 서사체의 화법 보존
