  source_fidelity: 개정이 필요합니다. 원문의 두 목적어인 ‘백성의 노역 감독들’(הַנֹּגְשִׂים בָּעָם)과 ‘그의 관리들’(שֹׁטְרָיו)을 초안은 ‘그 사람들, 곧 …’이라는 동격으로 처리하여 둘의 구별을 흐렸습니다. 또한 ‘백성 위에 있는’은 원문이 명시하지 않는 위계 표현입니다. ‘그날 바로 바로’는 중복입니다.
  naturalness: 초안의 ‘그날 바로 바로’는 비문에 가깝고, ‘명령하며 말했습니다’는 같은 발화 행위를 중복해 어색합니다. ‘다음과 같이 명령했습니다’는 לֵאמֹר의 다음 절 직접화법 도입 기능을 현대 합쇼체로 자연스럽게 살립니다.
  terminology: נֹגְשִׂים은 이 문맥에서 노동을 독촉·강요하는 관리들이므로 ‘노역 감독들’이 적절합니다. שֹׁטְרָיו는 별도 집단으로 ‘그의 관리들’이라 하여 넓고 중립적으로 옮깁니다. ‘자기 관리들’보다 ‘그의 관리들’이 파라오를 분명히 가리킵니다.
