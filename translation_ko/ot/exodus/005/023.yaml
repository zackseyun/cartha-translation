translation:
  language: ko
  text: 내가 바로에게 가서 주님의 이름으로 말한 뒤부터, 바로는 이 백성에게 악을 행하였고, 주님께서는 주님의 백성을 결코 구해 주지 않으셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 바로에게 가서 주님의 이름으로 말한 이래로.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘바로는 이 백성을 더욱 괴롭혔습니다.’
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘구하다’라는 동사의 부정사 절대형과 유한동사를 함께 써서 부정을 강조합니다. 곧 ‘결코 구해 주지 않으셨습니다’ 또는 ‘전혀 구해 주지 않으셨습니다’라는 뜻입니다.
    reason: lexical_alternative
