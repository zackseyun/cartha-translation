  source_fidelity: 원문의 시간 표현(‘그때부터/…한 뒤부터’), 바로가 백성에게 행한 해악, 그리고 부정 강조를 전반적으로 보존했습니다. 다만 초안은 ‘악을 더하였으니’의 주어가 문법상 모세로 읽힐 수 있고, ‘더하다’는 원문에 없는 비교 의미를 본문에 확정적으로 더합니다.
  naturalness: ‘바로 파라오’라는 병기는 한국어 성경 본문에서 부자연스럽고, ‘정녕 … 전혀’의 중복 강조도 다소 무겁습니다. ‘바로는 … 악을 행하였고’ 및 ‘결코 … 않으셨습니다’가 현대 표준어 합쇼체에서 더 명료하고 자연스럽습니다.
  terminology: ‘바로’, ‘주님의 이름으로’, ‘주님의 백성’, ‘구해 주다’는 문맥과 한국어 성경적 용례에 적절합니다. ‘구해 주다’는 נצל의 구출 의미를 보존하며 특정 교리 용어를 강제하지 않습니다.
