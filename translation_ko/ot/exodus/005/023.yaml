  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
  footnotes:
  - marker: a
    text: Or 'Ever since I came to Pharaoh to speak in your name.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he has made things worse for this people.'
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew expression uses an infinitive absolute with the verb (''delivering, you have not delivered'') to intensify the statement: ''you have certainly not delivered'' or ''you have not delivered at all.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 내가 바로 파라오에게 가서 주님의 이름으로 말한 뒤부터 이 백성에게 악을 더하였으니, 주님께서는 정녕 주님의 백성을 전혀 구해 주지 않으셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 파라오에게 가서 주님의 이름으로 말하기 시작한 이래로.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 이 백성을 더 악화시켰습니다.’
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 동사에 부정 강세를 더해 ‘정녕 구해 주지 않으셨습니다’ 또는 ‘전혀 구해 주지 않으셨습니다’의 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָז
  english_pob_choice: For since
  chosen_korean: 그런데 내가 바로 …부터
  alternatives_korean:
