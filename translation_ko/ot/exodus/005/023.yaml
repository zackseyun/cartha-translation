  - 나쁘게 하였으니
  lexicon: HALOT
  rationale: 히필형 רעע의 도덕적·해로운 뉘앙스를 살리되, 한국어에서 부자연스러운 직역을 피하면서 ‘악’을 직접 드러냈습니다.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  english_pob_choice: and you have certainly not delivered
  chosen_korean: 정녕 … 전혀 구해 주지 않으셨습니다
  alternatives_korean:
  - 결코 … 구원하지 않으셨습니다
  - 전혀 … 건져 주지 않으셨습니다
  lexicon: HALOT
  rationale: 히브리어의 부정 강세(부정 부정강조)를 한국어의 ‘정녕/전혀’로 옮겨, 단순 부정보다 훨씬 강한 항의의 어조를 보존했습니다.
- source_word: בִּשְׁמֶךָ
  english_pob_choice: in your name
  chosen_korean: 주님의 이름으로
  alternatives_korean:
  - 주님의 이름 안에서
  - 주님의 권위로
  lexicon: HALOT
  rationale: ‘이름으로’의 직역을 유지하여 대표성과 권위를 함께 드러냈고, 한국어에서 가장 자연스러운 종교적 표현으로 다듬었습니다.
theological_decisions:
- issue: 야훼의 구원 행위에 대한 모세의 항변 어조
  chosen_reading: 모세가 하나님께 결과를 따져 묻는 항변으로 유지했습니다.
  alternative_readings:
  - 완곡한 불평으로 완화
  - 단순한 사실 진술로 처리
  rationale: 본문은 모세가 주님의 이름으로 말한 결과를 근거로 하나님의 미구원 상태를 강하게 문제 삼는 장면이므로, 항변의 긴장을 약화시키지 않았습니다.
  doctrine_reference: 출애굽기 5:23 문맥, 번역 철학 §§1, 3, 5
