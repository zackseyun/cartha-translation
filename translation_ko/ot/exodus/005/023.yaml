  lexicon: HALOT
  rationale: מֵאָז의 시간적 의미를 살리면서, 모세의 항변하는 문맥에 맞게 앞뒤를 잇는 역접적 흐름을 한국어로 자연스럽게 드러냈습니다.
- source_word: הֵרַע
