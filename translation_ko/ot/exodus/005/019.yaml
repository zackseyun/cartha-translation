  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּרְא֞וּ שֹֽׁטְרֵ֧י בְנֵֽי יִשְׂרָאֵ֛ל אֹתָ֖/ם בְּ/רָ֣ע לֵ/אמֹ֑ר לֹא תִגְרְע֥וּ מִ/לִּבְנֵי/כֶ֖ם דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/019.yaml
  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
  footnotes:
  - marker: a
    text: Or “the Israelites” for “the sons of Israel.” The Hebrew is literally “sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: “the matter of a day in its day,” meaning the required amount for each day.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 자손의 감독들은 그들이 곤경에 빠졌음을 보았습니다. 그때 이렇게 말했기 때문입니다. “너희는 벽돌의 수를 줄여서는 안 됩니다. 날마다 정해진 분량을 그날그날 채워야 합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁטְרֵי
  english_pob_choice: officers
  chosen_korean: 감독들
  alternatives_korean:
  - 관리들
  - 관리관들
  - 감독관들
  lexicon: HALOT
  rationale: 이스라엘 사람들 위에 세워진 하위 행정 책임자를 가리키므로, 단순한 관료보다 역할이 드러나는 ‘감독들’이 가장 자연스럽습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 유지하면서도 한국어 성경에서 널리 쓰이는 관용 표현을 살렸습니다.
- source_word: בְּרָע
  english_pob_choice: in trouble
  chosen_korean: 곤경에 빠졌음을
  alternatives_korean:
  - 나쁜 처지에 있음을
  - 고난 가운데 있음을
  - 위기에 놓였음을
  lexicon: HALOT
  rationale: 도덕적 ‘악’이 아니라 불리하고 해로운 처지를 뜻하므로, 문맥에 맞는 현대 한국어로 옮겼습니다.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: the daily quota each day
  chosen_korean: 날마다 정해진 분량을 그날그날 채워야 합니다
  alternatives_korean:
  - 날마다의 할당량을 그날에 채워야 합니다
  - 매일의 분량을 매일 채워야 합니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 의미하는 ‘매일 요구되는 정해진 양’을 드러내되, ‘분량’과 반복 표현으로 압박감을 살렸습니다.
