translation:
  language: ko
  text: 그들이 바로에게서 나올 때, 그들은 자신들을 맞이하려고 서 있던 모세와 아론을 만났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 모세와 아론과 마주쳤습니다.’ 이 동사는 문맥에 따라 ‘맞서다’ 또는 ‘대면하다’의 뜻을 나타낼 수도 있지만, 여기서는 더 넓은 의미인 ‘만났다’를 본문에 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  english_pob_choice: They met
  chosen_korean: 만났는데
  alternatives_korean:
  - 마주쳤는데
  - 맞닥뜨렸는데
  - 접견했는데
  lexicon: HALOT
  rationale: פגע는 문맥에 따라 '만나다/마주치다'의 폭넓은 뜻을 가지므로, 본문 흐름을 과도하게 적대적으로 만들지 않는 '만났다'를 택했습니다.
- source_word: נִצָּבִים
  english_pob_choice: who were standing
  chosen_korean: 바로 서서
  alternatives_korean:
  - 서 있던
  - 자리를 지키고 서 있는
  - 서 있었는데
  lexicon: HALOT
  rationale: 분사형의 지속적 상태를 자연스럽게 살리기 위해 '바로 서서'로 옮겼습니다.
- source_word: לִקְרָאתָם
  english_pob_choice: to meet them
  chosen_korean: 그들을 맞이하려고
  alternatives_korean:
  - 그들을 만나려고
  - 그들을 맞으려고
  - 그들을 마중하려고
  lexicon: HALOT
  rationale: 상대 쪽으로 나아가 맞는 뉘앙스를 살리되, 한국어에서 가장 자연스러운 방향성 표현으로 옮겼습니다.
- source_word: מֵאֵת פַּרְעֹה
  english_pob_choice: from Pharaoh
  chosen_korean: 바로에게서
  alternatives_korean:
  - 파라오에게서
  - 바로의 곁에서
  - 바로 앞에서
  lexicon: HALOT
  rationale: מֵאֵת는 사람에게서 떠나 나오는 뜻이므로 '에게서'를 사용했고, 본문 인명은 한국어 성경에서 익숙한 '바로'를 따랐습니다.
theological_decisions:
- issue: The Hebrew verb can carry a hostile nuance, but the context does not require it in the main clause.
  chosen_reading: 본문은 중립적인 '만나다/맞이하다'의 의미를 살리고, 적대성은 다음 절의 반응에서 드러나게 했습니다.
  alternative_readings:
  - '''마주치다''로 더 강하게 옮김'
  - '''대면하다/맞서다''로 적대성을 반영'
  rationale: 직접적인 적대 행위가 아니라 만남 장면의 서술이므로, 어휘 자체에 호전성을 과도하게 주지 않는 것이 소스에 더 가깝습니다.
  doctrine_reference: 문맥 우선 원칙
