  - severity: medium
    issue: 대명사 지시와 문장 연결의 불명확성
    rationale: ‘그들은 … 그들을’의 지시 대상이 혼동되고, ‘그들이 … 나왔을 때였습니다’가 앞 문장에 부자연스럽게 분리되어 있습니다.
