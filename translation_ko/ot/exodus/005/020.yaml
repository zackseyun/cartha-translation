  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
  footnotes:
  - marker: a
    text: Or 'They encountered Moses and Aaron'; the verb can also carry the sense 'confronted' in some contexts, but the main text keeps the broader sense 'met.'
