  source_fidelity: 핵심 인명인 פַּרְעֹה는 ‘바로’인데 초안이 ‘바리새인’으로 옮겨 역사적·본문적 오류가 있습니다. 또한 히브리어의 시간 상황절(‘그들이 바로에게서 나올 때’)과 모세와 아론이 그들을 기다리며 서 있던 상태를 더 직접적으로 반영해야 합니다.
  naturalness: 초안의 ‘그들은 바로 서서 그들을 맞이하려고 하고 있었습니다. 그들이 … 나왔을 때였습니다’는 지시 대상이 불명확하고 문장이 부자연스럽습니다. 시간절을 앞에 두고 ‘자신들을 맞이하려고 서 있던’으로 연결하면 현대 표준 한국어 합쇼체로 자연스럽고 명료합니다.
  terminology: ‘바로’는 한국어 성경 전통과 원문의 파라오를 정확히 반영합니다. ‘만났습니다’는 פגע의 기본 의미를 보존하며, 각주에서 ‘마주쳤습니다’ 및 문맥상 더 강한 가능성을 제한적으로 제시할 수 있습니다.
