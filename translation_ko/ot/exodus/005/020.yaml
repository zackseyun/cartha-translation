  rationale: 인명 오류를 ‘바로’로 바로잡고, 히브리어의 ‘바로에게서 나올 때’라는 시간 관계와 모세와 아론이 그들을 맞이하려고 서 있던 분사적 상태를 한 문장 안에 자연스럽게 반영했습니다. ‘만났습니다’는 적대성을 본문에 과도하게 덧붙이지 않으면서 פגע의 기본 뜻을 보존합니다.
