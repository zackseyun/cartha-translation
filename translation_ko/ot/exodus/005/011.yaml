id: EXO.5.11
reference: Exodus 5:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַתֶּ֗ם לְכ֨וּ קְח֤וּ לָ/כֶם֙ תֶּ֔בֶן מֵ/אֲשֶׁ֖ר תִּמְצָ֑אוּ כִּ֣י אֵ֥ין נִגְרָ֛ע מֵ/עֲבֹדַתְ/כֶ֖ם דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/011.yaml
  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
  footnotes:
  - marker: a
    text: Or, more formally, 'from wherever you find it.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for nothing of your work is reduced' or 'because nothing of your work is reduced.' The conjunction can be rendered 'for/because,' but the sense in context is adversative.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 가서, 어디서든 찾을 수 있는 곳에서 너희를 위해 짚을 가져오십시오. 아무것도 너희의 일에서 줄어들지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 독립 인칭대명사 אַתֶּם은 단순한 ‘너희’보다 명령의 강조를 띱니다.
    reason: source_note
lexical_decisions:
- source_word: אַתֶּם
  english_pob_choice: You yourselves
  chosen_korean: 너희는
  alternatives_korean:
  - 너희 자신은
  - 너희들
  lexicon: HALOT
  rationale: 독립 인칭대명사가 앞에 나와 명령을 강조하지만, 한국어에서는 주어를 앞세운 평이한 합쇼체가 자연스러워 중복 강조를 과도하게 늘리지 않았습니다.
- source_word: לְכוּ קְחוּ
  english_pob_choice: go and get
  chosen_korean: 가서 ... 가져오십시오
  alternatives_korean:
  - 가서 ... 얻으십시오
  - 가서 ... 가져가십시오
  lexicon: HALOT
  rationale: קְחוּ는 문자적으로는 ‘취하다/가져오다’이지만, 짚을 구해 오라는 맥락에서는 ‘가져오다’가 조달 행위를 가장 자연스럽게 드러냅니다.
- source_word: לָכֶם
  english_pob_choice: for yourselves
  chosen_korean: 너희를 위해
  alternatives_korean:
  - 너희에게
  - 스스로
  lexicon: HALOT
  rationale: 여기서는 자기 몫으로 직접 조달해야 한다는 재귀적/수혜적 의미가 있어 ‘너희를 위해’가 가장 자연스럽습니다.
- source_word: תֶּבֶן
  english_pob_choice: straw
  chosen_korean: 짚
  alternatives_korean:
  - 볏짚
  - 그루터기
  lexicon: HALOT
  rationale: 벽돌 제조 맥락에서 תֶּבֶן은 짚을 가리키며, 한국어에서는 ‘짚’이 가장 직설적이고 표준적인 대응입니다.
- source_word: כִּי אֵין נִגְרָע מֵעֲבֹדַתְכֶם דָּבָר
  english_pob_choice: for nothing of your work will be reduced
  chosen_korean: 아무것도 너희의 일에서 줄어들지 않을 것입니다
  alternatives_korean:
  - 너희의 일에서 줄어드는 것은 아무것도 없을 것입니다
  - 너희의 일은 조금도 줄어들지 않을 것입니다
  lexicon: HALOT
  rationale: אין נגרע דבר는 ‘한 가지도 줄어들지 않는다’는 관용적 표현이라 ‘아무것도 ... 줄어들지 않다’로 옮겨 의미를 압축했습니다.
theological_decisions:
- issue: כִּי의 기능과 문맥상 압박감
  chosen_reading: ‘for’에 해당하는 인과/설명 관계로 처리하되, 명령을 완화하지 않고 오히려 ‘가져와야 하는 이유’를 제시하는 문맥으로 살렸습니다.
  alternative_readings:
  - ‘하지만’처럼 역접으로 처리
  - 단순한 설명문으로 평탄화
  rationale: 히브리어 כִּי를 영어 POB가 최종적으로 ‘for’로 고정한 점을 따르되, 문맥상 바로 앞 명령을 정당화하는 냉혹한 압박을 전달해야 하므로 역접으로 바꾸지 않았습니다.
  doctrine_reference: 출애굽기 5장의 강제 노역 서술 맥락
