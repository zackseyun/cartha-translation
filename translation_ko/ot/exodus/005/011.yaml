  source_fidelity: 수정안은 독립 인칭대명사 אַתֶּם의 강조를 ‘너희는 직접’으로, לָכֶם의 자기 조달 의미를 ‘직접’으로 자연스럽게 반영합니다. מֵאֲשֶׁר תִּמְצָאוּ는 ‘찾을 수 있는 곳에서’로 옮겨 उपलब्ध한 곳 어디서나 조달하라는 뜻을 보존했습니다. כִּי의 설명·인과 기능도 ‘이는’으로 명시했으며, ‘너희에게 부과된 일은 조금도 줄어들지 않을 것입니다’는 אֵין נִגְרָע ... דָּבָר의 전면적 불감소를 충실히 전달합니다.
  naturalness: 초안의 ‘어디서든 찾을 수 있는 곳에서’는 ‘어디서든’과 ‘곳에서’가 중복되어 부자연스럽고, ‘너희를 위해’는 한국어에서 수혜 대상을 뜻하여 스스로 조달하라는 의미가 약해집니다. 수정안은 현대 표준어 합쇼체로 자연스럽고 문맥의 강압적 명령을 유지합니다.
