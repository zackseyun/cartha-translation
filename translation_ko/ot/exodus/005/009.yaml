translation:
  language: ko
  text: 일이 그 사람들 위에 무겁게 지어지게 하시오. 그래서 그들이 그것으로 일하게 하고, 거짓말 같은 말들에 주의를 기울이지 못하게 하시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '거짓말에 주의를 기울이다', '속이는 말들을 주목하다'. 히브리어 동사는 '주의를 기울이다', '주목하다', '귀 기울이다'의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  english_pob_choice: be made heavy
  chosen_korean: 무겁게 지어지게 하시오
