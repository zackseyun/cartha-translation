    rationale: 한국어 ‘짓다’는 건물을 세우거나 말을 꾸며 내는 뜻을 우선적으로 떠올리게 합니다. 여기서는 일이 사람들에게 부담으로 부과되도록 하라는 명령이므로 ‘일을 무겁게 지우십시오’가 적절합니다.
