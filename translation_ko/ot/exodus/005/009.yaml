  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
  footnotes:
  - marker: a
    text: Or 'heed false words' or 'look to deceptive words.' The Hebrew verb can mean 'pay attention to,' 'regard,' or 'heed.'
