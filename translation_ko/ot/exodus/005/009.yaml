  verdict: revise
  source_fidelity: 원문의 명령 연쇄와 ‘일/노역이 사람들 위에 무겁게 놓이게 하라’는 뜻은 대체로 반영되어 있습니다. 그러나 ‘무겁게 지어지게 하시오’는 건축 행위를 연상시켜 כבד의 문맥상 의미인 부담을 지우다를 정확히 전달하지 못합니다. 또한 שָׁקֶר는 ‘거짓말 같은’보다 단정적인 ‘거짓된’이 원문에 더 가깝습니다.
  naturalness: ‘일이 그 사람들 위에 무겁게 지어지게 하시오’는 현대 표준 한국어로 부자연스럽습니다. ‘그 사람들에게 일을 무겁게 지우십시오’가 의미와 명령조를 자연스럽게 살립니다.
  terminology: ‘그 사람들’은 הָאֲנָשִׁים(그 남자들/사람들)를 과도하게 일반화하지 않으면서도 한국어 문맥상 자연스럽게 처리할 수 있습니다. ‘거짓된 말들’은 בְּדִבְרֵי שָׁקֶר의 경멸적 평가를 보존합니다.
  issues:
