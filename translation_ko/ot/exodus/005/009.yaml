  lexicon: HALOT
  rationale: 문맥상 강제 노역이지만, 한국어에서는 짧고 직접적인 '일'이 가장 자연스럽고 원문의 구체적 부담감을 유지합니다.
- source_word: יִשְׁעוּ בְּדִבְרֵי שָׁקֶר
