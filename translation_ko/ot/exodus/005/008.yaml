revisions:
- from: 그리고 그들이 어제와 그저께 만들던 벽돌의 정해진 수량을 너희가 그들에게 부과해야 하며, 그것의 어느 것도 줄여서는 안 됩니다. 그들이 게으르기 때문입니다. 그러므로 그들이 외치며 말합니다. ‘우리의 하나님께 가서 제사드리게 하십시오.’
  to: 그리고 그들이 어제와 그저께 만들던 벽돌의 정해진 수량을 너희가 그들에게 부과해야 하며, 그것을 조금도 줄여서는 안 됩니다. 그들이 게으르기 때문입니다. 그러므로 그들이 외쳐 말합니다. ‘우리가 가서 우리 하나님께 제사를 드리자.’[a]
  rationale: The revision corrects the central grammatical and pragmatic error in the quotation by rendering the two Hebrew cohortatives as a Korean first-person plural exhortation. It also uses the natural “우리 하나님께,” clarifies the prohibition as “조금도,” and supplies a properly anchored note for the temporal idiom. The formal-polite narrative register is retained.
  reviewer_model: gpt-5.6-terra
