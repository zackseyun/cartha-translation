  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
  footnotes:
  - marker: a
    text: Or more idiomatically, 'formerly' or 'as before' for 'yesterday and the day before yesterday.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 어제와 그저께 만들던 벽돌의 정해진 수량을 너희가 그들에게 부과해야 하며, 그것을 조금도 줄여서는 안 됩니다. 그들이 게으르기 때문입니다. 그러므로 그들이 외쳐 말합니다. ‘우리가 가서 우리 하나님께 제사를 드리자.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “어제와 그저께”이며, 문맥상 “이전처럼” 또는 “전부터”라는 뜻으로도 이해될 수 있습니다.
    reason: 히브리어 תְּמוֹל שִׁלְשֹׁם의 문자적 의미와 관용적 가능성을 함께 보존합니다.
