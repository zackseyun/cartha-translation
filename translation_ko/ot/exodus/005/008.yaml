  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
  footnotes:
  - marker: a
    text: Or more idiomatically, 'formerly' or 'as before' for 'yesterday and the day before yesterday.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 어제와 그저께 만들던 벽돌의 정해진 수량을 너희가 그들에게 부과해야 하며, 그것의 어느 것도 줄여서는 안 됩니다. 그들이 게으르기 때문입니다. 그러므로 그들이 외치며 말합니다. ‘우리의 하나님께 가서 제사드리게 하십시오.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַתְכֹּנֶת
  english_pob_choice: quota
  chosen_korean: 정해진 수량
  alternatives_korean:
  - 할당량
  - 정량
  - 분량
  lexicon: HALOT
  rationale: 이 문맥에서는 벽돌 생산에 대해 부과된 규정된 양을 가리키므로, ‘정해진 수량’이 제도적 강제성과 생산량의 의미를 함께 드러냅니다.
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  english_pob_choice: you shall impose on them
  chosen_korean: 그들에게 부과해야 하며
  alternatives_korean:
  - 그들에게 얹어야 하며
  - 그들에게 두어야 하며
  - 그들에게 부가해야 하며
  lexicon: HALOT
  rationale: ‘위에 두다’는 관용적 표현을 한국어에서는 강제적으로 짐을 지우는 의미의 ‘부과하다’로 옮기는 것이 자연스럽습니다.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  english_pob_choice: you shall not reduce any of it
  chosen_korean: 그것의 어느 것도 줄여서는 안 됩니다
  alternatives_korean:
  - 그것에서 조금도 빼서는 안 됩니다
  - 그것을 조금도 감해선 안 됩니다
  lexicon: HALOT
  rationale: ‘감하다/덜다’보다 ‘줄이다’가 현대 한국어에서 더 직접적이며, ‘어느 것도’로 전체 보전을 분명히 했습니다.
- source_word: נִרְפִּים
  english_pob_choice: idle
  chosen_korean: 게으르기 때문입니다
  alternatives_korean:
  - 나태하기 때문입니다
  - 늘어져 있기 때문입니다
  - 한가하기 때문입니다
  lexicon: HALOT
  rationale: 파라오의 비난을 현대 독자가 즉시 이해하도록 옮기되, 단순한 도덕 평가보다 노동 태만의 비난이라는 문맥을 살려 ‘게으르다’로 렌더링했습니다.
- source_word: נֵלְכָה נִזְבְּחָה
  english_pob_choice: Let us go and sacrifice
  chosen_korean: 가서 제사드리게 하십시오
  alternatives_korean:
  - 가서 제사하게 하십시오
  - 가서 희생제물을 드리게 하십시오
  lexicon: HALOT
  rationale: 여기서 핵심은 제의 행위 자체이므로 ‘제사드리다’가 가장 자연스럽고, 청유/의도 표현을 한국어 명령형 요청으로 풀어냈습니다.
theological_decisions:
- issue: ‘our God’의 호칭과 직접 인용의 한국어 화법
  chosen_reading: ‘우리의 하나님께’로 옮기고, 직접 발화는 ‘...하게 하십시오’의 요청형으로 처리했습니다.
  alternative_readings:
  - ‘우리 하나님께’
  - ‘우리의 하나님에게’
  rationale: 출애굽기 서술 속 이집트 측 인용이지만, 히브리어의 일반적 신 칭호를 그대로 살려 ‘하나님’으로 두었습니다. 직접화법은 한국어에서 청유 요청으로 자연스럽게 들리도록 정리했습니다.
  doctrine_reference: source-register alignment
