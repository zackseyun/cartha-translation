translation:
  language: ko
  text: 그러자 모세가 야훼께 돌아와 말했습니다[a]. “주님, 어찌하여 이 백성에게 해를 끼치셨습니까? 그런데 왜 저를 보내셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 둘째 질문은 직역하면 “왜 이것[이니], 저를 보내셨습니까?”와 같은 강조적 관용 표현입니다. 여기서는 “그런데 왜 저를 보내셨습니까?”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
