  - 악을 행하셨습니까
  - 고통을 더하셨습니까
  lexicon: HALOT
  rationale: 히필 רעע는 도덕적 ‘악을 행하다’보다 ‘해를 끼치다/해를 입히다’의 원인적 뉘앙스가 맞으므로, 하나님이 도덕적 악을 행했다는 뜻으로 오해되지 않도록 옮겼습니다.
- source_word: לָמָּה זֶּה שְׁלַחְתָּנִי
  english_pob_choice: Why then did you send me?
  chosen_korean: 그런데 왜 저를 보내셨습니까?
  alternatives_korean:
