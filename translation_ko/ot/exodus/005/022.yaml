  text: 그러자 모세가 야훼께 돌아와 말했습니다[a]. “주님, 어찌하여 이 백성에게 해를 끼치셨습니까? 그런데 왜 저를 보내셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “어찌하여 이러하십니까? 저를 보내셨습니까?”라는 식의 강조를 지닌 관용 표현으로, “그런데 왜 저를 보내셨습니까?”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
