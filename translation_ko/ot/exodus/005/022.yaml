  - 나의 주님
  lexicon: HALOT
  rationale: 모세의 직접 호칭으로서 예배적·존칭적 부름을 살리되, 현대 한국어에서 자연스러운 ‘주님’을 택했습니다.
- source_word: הֲרֵעֹתָה
  english_pob_choice: have you brought harm on
  chosen_korean: 해를 끼치셨습니까
  alternatives_korean:
  - 해를 주셨습니까
  - 악을 행하셨습니까
  - 고통을 더하셨습니까
  lexicon: HALOT
  rationale: 히필 רעע는 도덕적 ‘악을 행하다’보다 ‘해를 끼치다/해를 입히다’의 원인적 뉘앙스가 맞으므로, 하나님이 도덕적 악을 행했다는 뜻으로 오해되지 않도록 옮겼습니다.
- source_word: לָמָּה זֶּה שְׁלַחְתָּנִי
  english_pob_choice: Why then did you send me?
  chosen_korean: 그런데 왜 저를 보내셨습니까?
  alternatives_korean:
  - 왜 그때 저를 보내셨습니까?
  - 왜 도대체 저를 보내셨습니까?
  lexicon: HALOT
  rationale: לָמָּה זֶּה의 강조를 한국어의 ‘그런데 왜’로 처리해, 단순한 질문이 아니라 항의 섞인 ‘그런데 왜’의 뉘앙스를 살렸습니다.
