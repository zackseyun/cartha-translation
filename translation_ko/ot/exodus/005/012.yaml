  text: So the people were scattered throughout all the land of Egypt to gather stubble for straw[a].
  footnotes:
  - marker: a
    text: Or 'to gather straw for stubble' if קַשׁ and תֶּבֶן are taken less distinctly; the main text preserves the likely contrast between gathered stubble and the usual straw supply.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 백성은 짚을 구할 곡짚을 모으려고 이집트 온 땅에 흩어졌습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡짚을 모을 짚을 위해’로도 옮길 수 있습니다. 본문은 곡짚과 일반적인 짚 공급 사이의 대비를 살린 번역을 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  english_pob_choice: were scattered
  chosen_korean: 흩어졌습니다
  alternatives_korean:
  - 퍼졌습니다
  - 분산되었습니다
  lexicon: HALOT
  rationale: 분사적 결과를 나타내는 동사의 의미를 자연스러운 서술문으로 살려, 백성이 넓은 지역으로 흩어진 상태를 간명하게 표현했습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 민족
  lexicon: HALOT
  rationale: 문맥상 바로 뒤의 노역 집단을 가리키므로, 공동체를 가리키는 ‘백성’이 가장 자연스럽고 분명합니다.
- source_word: לְקֹשֵׁשׁ קַשׁ לַתֶּבֶן
  english_pob_choice: to gather stubble for straw
  chosen_korean: 짚을 구할 곡짚을 모으려고
  alternatives_korean:
  - 곡짚을 모아 짚으로 쓰려고
  - 짚 대신 쓸 곡짚을 모으려고
  lexicon: HALOT
  rationale: קֹשֵׁשׁ의 ‘모으다/긁어모으다’는 뜻과, קַשׁ과 תֶּבֶן 사이의 대비를 살리기 위해 ‘곡짚’과 ‘짚’을 구분해 옮겼습니다. ‘모으려고’로 목적 용법을 자연스럽게 드러냈습니다.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  english_pob_choice: throughout all the land of Egypt
  chosen_korean: 이집트 온 땅에
  alternatives_korean:
  - 이집트 전역에
  - 이집트 모든 땅에
  lexicon: HALOT
  rationale: 분포 범위를 압축적으로 살리면서도 현대 한국어에서 자연스럽게 들리는 표현으로 옮겼습니다.
