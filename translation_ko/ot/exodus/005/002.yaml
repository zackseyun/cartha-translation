  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서도 ‘그의 말에 순종하여’라는 자연스러운 표현으로 관용적 의미를 전달합니다. 발화를 두 문장으로 나누어 한국어 문장 호흡도 자연스럽게 했습니다.
