  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'' Alternatives include ''Yahweh'' and ''Jehovah.'''
    reason: alternative_reading
translation:
  language: ko
  text: 파라오가 말했습니다[a]. 「야훼가 누구이기에 내가 그의 목소리를 듣고 이스라엘을 보내야 합니까? 나는 야훼를 알지 못하고, 더구나 이스라엘도 보내지 않겠습니다」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름을 יְהוָה(YHWH)로 적습니다. 전통적으로는 ‘주님’으로 번역되기도 하지만, 여기서는 고유명 ‘야훼’를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 신명사 יְהוָה를 직함이 아닌 고유명으로 드러내기 위해 야훼를 택했습니다. 전통적 대체어인 주님은 본문의 직접성을 약화시킬 수 있습니다.
- source_word: אֶשְׁמַע בְּקֹלֹו
  english_pob_choice: that I should obey his voice
  chosen_korean: 내가 그의 목소리를 듣고
  alternatives_korean:
  - 내가 그의 음성을 순종하고
  - 내가 그의 목소리에 귀를 기울이고
  lexicon: HALOT
  rationale: שׁמע + בְּקוֹל은 단순 청취보다 순종/청종의 관용구이므로, 직역적이되 한국어에서는 자연스러운 ‘그의 목소리를 듣고’로 옮겨 그 함의를 보존했습니다.
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  english_pob_choice: let Israel go
  chosen_korean: 이스라엘을 보내야 합니까
  alternatives_korean:
  - 이스라엘을 놓아주어야 합니까
  - 이스라엘을 가게 해야 합니까
  lexicon: HALOT
  rationale: 출애굽 맥락에서 שׁלח는 ‘보내다/놓아주다’의 관용 표현이므로, 한국어에서는 ‘보내다’로 간결하게 살려 본문 흐름을 유지했습니다.
- source_word: וְגַם
  english_pob_choice: and moreover
  chosen_korean: 더구나
  alternatives_korean:
  - 그리고 또
  - 뿐만 아니라
  lexicon: HALOT
  rationale: וְגַם의 강조적 추가를 한국어 접속부사 ‘더구나’로 압축해 파라오의 단호한 거절을 살렸습니다.
theological_decisions:
- issue: יהוה를 번역어가 아니라 고유명으로 표시할 것인가
  chosen_reading: 야훼를 본문에 직접 표기했습니다.
  alternative_readings:
  - 주님으로 대체
  - 여호와로 표기
  rationale: 이 절은 야훼의 이름 자체를 묻고 거부하는 장면이므로, 제목형 대체어보다 고유명 표기가 본문의 신학적 긴장을 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
