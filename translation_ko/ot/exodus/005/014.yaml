  lexicon: HALOT
  rationale: 노동 현장 문맥에서 שֹׁטְרִים은 일반적인 관료보다 하위 감독자에 가깝기 때문에, 역할을 드러내는 ‘감독들’로 옮겼습니다.
- source_word: נֹגְשֵׂי פַרְעֹה
