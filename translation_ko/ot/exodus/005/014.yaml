  lexicon: HALOT
  rationale: 관용구의 핵심 의미는 ‘예전처럼/이전과 같이’이므로, 직역의 어색함을 피하면서도 ‘어제도 오늘도’로 반복 압박을 살렸습니다.
theological_decisions:
