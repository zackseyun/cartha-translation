translation:
  language: ko
  text: 파라오의 노역 감독관들이 이스라엘 백성 위에 세운 이스라엘 자손의 반장들은 구타당했습니다. 그 감독관들은 이렇게 말했습니다. “왜 전처럼[a] 어제도 오늘도 벽돌을 만드는 정해진 할당량을 채우지 못했습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 “어제와 그제처럼”이며, 관용적으로 “전처럼” 또는 “이전과 같이”를 뜻합니다.
    reason: lexical_alternative
