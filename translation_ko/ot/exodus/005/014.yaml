  rationale: 본문의 נֹגְשִׂים는 단순 행정 관리가 아니라 억압적 노동 감독을 뜻하므로, 그 폭력적 성격을 흐리지 않는 번역을 택했습니다.
  doctrine_reference: 출애굽기 5장의 억압 서술
