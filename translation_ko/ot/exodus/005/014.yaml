  - 파라오의 노역 감독관들
  lexicon: HALOT
  rationale: נֹגְשִׂים은 강제노동을 몰아붙이는 감독자들을 가리키므로, 직역보다 기능을 살린 ‘감독관들’이 자연스럽고 문맥에 맞습니다.
- source_word: וַיֻּכּוּ
  english_pob_choice: were beaten
  chosen_korean: 매를 맞았습니다
  alternatives_korean:
  - 때림을 당했습니다
  - 채찍질을 당했습니다
  lexicon: HALOT
  rationale: 수동 복수형의 신체적 처벌을 자연스럽게 드러내면서도, 구체적 형벌 수단은 본문이 밝히지 않으므로 과도하게 특정하지 않았습니다.
- source_word: חָקְכֶם לִלְבֹּן
  english_pob_choice: your quota of brickmaking
  chosen_korean: 벽돌 만들 정해진 분량
  alternatives_korean:
