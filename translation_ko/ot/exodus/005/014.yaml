translation:
  language: ko
  text: 그리고 이스라엘 사람들의 감독들, 곧 파라오의 감독관들이 그들 위에 세운 사람들은 매를 맞았습니다. 그들이 말하기를, “어째서 전처럼, 어제도 오늘도 벽돌 만들 정해진 분량을 마치지 못하였느냐?” 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “어제, 그제”로, 관용적으로 “전처럼” 또는 “이전과 같이”를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the Israelite foremen
  chosen_korean: 이스라엘 사람들의 감독들
