  lexicon: HALOT
  rationale: חֹק은 정해진 몫/할당을 뜻하고, לִלְבֹּן은 벽돌을 만드는 일을 가리키므로, 두 요소를 함께 살려 ‘벽돌 만들 정해진 분량’으로 옮겼습니다.
- source_word: כִּתְמוֹל שִׁלְשֹׁם ... גַּם תְּמוֹל גַּם הַיּוֹם
  english_pob_choice: as before, both yesterday and today
  chosen_korean: 전처럼, 어제도 오늘도
  alternatives_korean:
  - 어제와 그제처럼, 그리고 오늘도
