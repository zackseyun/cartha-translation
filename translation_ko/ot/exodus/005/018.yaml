id: EXO.5.18
reference: Exodus 5:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּה֙ לְכ֣וּ עִבְד֔וּ וְ/תֶ֖בֶן לֹא יִנָּתֵ֣ן לָ/כֶ֑ם וְ/תֹ֥כֶן לְבֵנִ֖ים תִּתֵּֽנּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/018.yaml
  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
  footnotes:
  - marker: a
    text: Or 'the quota of bricks.' The Hebrew תֹכֶן refers to a fixed or measured amount required from the workers.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 가서 일하십시오. 그러나 짚은 너희에게 주어지지 않을 것이며, 너희는 벽돌의 정해진 수를 내어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תֹכֶן은 정해진 양이나 할당된 분량을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 이제
  alternatives_korean:
  - 그러므로 지금
  - 자, 이제
  lexicon: HALOT
  rationale: 전환과 긴급함을 자연스럽게 살리되, 한국어에서는 과도한 접속부를 피하고 간결하게 시작했습니다.
- source_word: עִבְדוּ
  english_pob_choice: work
  chosen_korean: 일하십시오
  alternatives_korean:
  - 노동하십시오
  - 일하라
  lexicon: HALOT
  rationale: 문맥상 강제 노역이지만, 현대 한국어에서는 명령의 뜻을 유지하면서도 가장 자연스러운 표현으로 옮겼습니다.
- source_word: יִנָּתֵן לָכֶם
  english_pob_choice: will not be given to you
  chosen_korean: 너희에게 주어지지 않을 것이며
  alternatives_korean:
  - 너희에게 공급되지 않을 것이며
  - 너희에게 주어지지 않겠지만
  lexicon: HALOT
  rationale: 수동 부정 구조를 비교적 직접적으로 반영하여, 짚의 미공급이라는 문장상의 대비를 유지했습니다.
- source_word: תֹכֶן לְבֵנִים
  english_pob_choice: the required number of bricks
  chosen_korean: 벽돌의 정해진 수
  alternatives_korean:
  - 벽돌의 할당량
  - 벽돌의 요구되는 수
  lexicon: HALOT
  rationale: תֹכֶן이 가리키는 ‘정해진/측정된 양’을 드러내기 위해, 현대 한국어에서 이해되는 ‘정해진 수’로 옮겼습니다.
theological_decisions:
- issue: Pharaoh의 명령어조 재현
  chosen_reading: 직접 명령을 한국어 공손체 명령형으로 재현했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 반말 명령형으로 직역
  rationale: 본문은 억압적 왕의 명령이므로, 공손체를 쓰되 명령성은 유지하여 서술의 힘을 보존했습니다.
  doctrine_reference: 출애굽기 서사의 역사적-문학적 맥락
- issue: ‘work’의 의미 범위
  chosen_reading: ‘일하십시오’로 번역하되, 단순한 일반 노동보다 강제 노동의 맥락을 유지했습니다.
  alternative_readings:
  - ‘섬기십시오’로 번역
  - ‘노동하십시오’로 번역
  rationale: 여기서 עבד는 예배적 ‘섬김’이 아니라 노역 명령이므로, 교회적 전용어를 피했습니다.
  doctrine_reference: 어휘-문맥 우선 원칙
