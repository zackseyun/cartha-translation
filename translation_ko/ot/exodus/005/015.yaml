  rationale: 출애굽기 문맥에서 이들은 이스라엘 민족 내부의 노동 감독 역할을 맡은 사람들로 보이므로, 행정적·감독적 기능을 살린 ‘감독들’이 가장 자연스럽습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
