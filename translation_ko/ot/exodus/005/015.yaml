source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּצְעֲק֥וּ אֶל פַּרְעֹ֖ה לֵ/אמֹ֑ר לָ֧/מָּה תַעֲשֶׂ֦ה כֹ֖ה לַ/עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
  footnotes:
  - marker: a
    text: Or “the Israelites”; literally “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “Why do you do thus to your servants?”
    reason: lexical_alternative
  - marker: c
    text: Or “your slaves,” depending on how עבד is understood in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘 자손의 감독들이 바로에게 가서 외치며 말했습니다. “어찌하여 당신은 자기 종들에게 이렇게 하십니까?”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “이스라엘의 아들들”입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “어찌하여 당신은 자기 종들에게 이렇게 하십니까?”입니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥에 따라 “당신의 노예들에게”로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁטְרֵי
  english_pob_choice: officers
  chosen_korean: 감독들
  alternatives_korean:
  - 관리들
  - 상관들
  - 감독관들
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 이들은 이스라엘 민족 내부의 노동 감독 역할을 맡은 사람들로 보이므로, 행정적·감독적 기능을 살린 ‘감독들’이 가장 자연스럽습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 직역 가능성을 살리되, 한국어 성경 문맥에서 널리 이해되는 관용적 표현인 ‘이스라엘 자손’을 택했습니다.
- source_word: וַיִּצְעֲקוּ
  english_pob_choice: cried out
  chosen_korean: 외치며
  alternatives_korean:
  - 부르짖으며
  - 절규하며
  - 호소하며
  lexicon: HALOT
  rationale: 단순한 말하기보다 긴급하고 강한 호소를 나타내므로, 본문 흐름에 맞는 강한 동사로 ‘외치며’를 사용했습니다.
- source_word: לַעֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 자기 종들에게
  alternatives_korean:
  - 당신의 종들에게
  - 당신의 노예들에게
  - 당신의 종들
  lexicon: HALOT
  rationale: 본문의 대화 상황은 바로에게 대한 청원 형식이며, 여기서는 곤궁한 처지를 드러내는 ‘종들’이 적절합니다. 2인칭 접미사 표현은 한국어에서 자연스럽게 ‘자기’로 풀어, 바로의 소유처럼 들리는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: לָמָּה תַעֲשֶׂה כֹה의 직역성과 자연스러움
  chosen_reading: ‘어찌하여 당신은 … 이렇게 하십니까?’로 옮겨, 히브리어의 직접 질문과 압박감을 유지했습니다.
  alternative_readings:
  - ‘왜 그렇게 하십니까?’
  - ‘무슨 까닭으로 이렇게 하십니까?’
  rationale: 본문은 단순 정보 요청이 아니라 억압적 처우에 대한 항의이므로, 질문의 날카로움을 보존하는 번역이 필요합니다.
  doctrine_reference: 본문의 문학적·서사적 뉘앙스 보존
