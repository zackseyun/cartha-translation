base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
  footnotes:
  - marker: a
    text: Or, “has called us.” The Hebrew may denote that God has met with them or summoned them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. “히브리 사람들의 하나님께서 우리를 만나셨습니다[a]. 부디 저희가 광야로 사흘 길을 가서 야훼, 우리 하나님께 제사를 드리도록 허락해 주십시오. 그렇지 않으면 그분께서 전염병이나 칼로 저희를 치실까 두렵습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리를 부르셨습니다.” 히브리어는 하나님께서 그들을 만나셨다는 뜻일 수도, 부르셨다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  english_pob_choice: The God of the Hebrews
  chosen_korean: 히브리 사람들의 하나님
  alternatives_korean:
  - 히브리인의 하나님
  - 이스라엘 사람들의 하나님
  lexicon: HALOT
  rationale: עִבְרִים의 민족·사회적 표지를 살려 ‘히브리 사람들’로 옮겼습니다. 이 본문에서는 ‘이스라엘 사람들’로 매끈하게 바꾸기보다 원문의 지칭을 보존하는 편이 더 직접적입니다.
- source_word: נִקְרָא עָלֵינוּ
  english_pob_choice: has met with us
  chosen_korean: 우리를 만나셨습니다
  alternatives_korean:
  - 우리에게 부르셨습니다
  - 우리를 부르셨습니다
  - 우리와 마주하셨습니다
  lexicon: HALOT
  rationale: 이 표현은 단순한 ‘부르심’보다 신적 만남/대면의 뉘앙스를 담을 수 있으므로, 서술 상황에 맞게 ‘만나셨습니다’로 옮겼습니다.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  english_pob_choice: a journey of three days
  chosen_korean: 사흘 길의 길
  alternatives_korean:
  - 사흘의 여정
  - 사흘 거리
  - 사흘 길
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 풀어 쓰지 않으면서도 현대 한국어에서 자연스럽게 읽히도록 ‘사흘 길’의 구조를 살렸습니다. 앞의 ‘길’은 원문의 דֶּרֶךְ를 반영합니다.
- source_word: וְנִזְבְּחָה
  english_pob_choice: so that we may sacrifice
  chosen_korean: 우리가 … 제사드리게 하십시오
  alternatives_korean:
  - 우리가 제사드리도록 하십시오
  - 제사드리게 하십시오
  - 우리가 제사드리겠습니다
  lexicon: HALOT
  rationale: 앞선 요청에 이어지는 목적/의도 표현으로 보아, 한국어에서는 부드러운 목적절 구조가 가장 자연스럽습니다. ‘제사드리다’는 제의적 맥락을 분명히 하되, 원문의 동사 기능을 유지합니다.
- source_word: בַּדֶּבֶר / בֶחָרֶב
  english_pob_choice: with plague or with the sword
  chosen_korean: 전염병이나 칼로
  alternatives_korean:
  - 역병이나 칼로
  - 재앙이나 칼로
  - 전염병 혹은 칼로
  lexicon: HALOT
  rationale: דֶּבֶר은 심판 문맥에서 전염성 재앙을 가리키므로 ‘전염병’으로 옮겼고, חֶרֶב은 통상적인 심판 도구인 ‘칼’을 유지했습니다. 병렬성을 위해 조사와 어순을 간결하게 맞췄습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 기록은 יְהוָה를 직접 지시하므로, 본 프로젝트 기본 방침에 따라 covenant name을 ‘야훼’로 표기했습니다. 문맥상 뒤의 ‘우리 하나님’과도 호응합니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 요청문의 공손성과 목적절 처리
  chosen_reading: 제발 우리에게 사흘 길의 길을 광야로 가게 하십시오. 우리가 야훼 우리 하나님께 제사드리게 하십시오.
  alternative_readings:
  - 제발 우리를 보내 주십시오. 광야로 사흘 길을 가서 우리 하나님께 제사드리게 하십시오.
  - 제발 우리에게 광야로 사흘 길을 가게 해 주십시오. 그리고 우리 하나님께 제사드리게 하십시오.
  rationale: 히브리어의 연속된 cohortative와 נָא의 청유를 한국어에서는 두 번의 공손한 요청으로 나누어 담는 편이 원문의 간청성과 문장 흐름을 더 잘 드러냅니다.
  doctrine_reference: Hebrew cohortative + נָא in request discourse
