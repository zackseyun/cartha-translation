translation:
  language: ko
  text: 다시는 백성에게 벽돌을 굽기 위한 짚을 주지 마십시오. 전처럼 그들이 가서 자기들을 위해 짚을 모으게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹאסִפוּן
  english_pob_choice: shall no longer
  chosen_korean: 다시는
  alternatives_korean:
  - 더 이상
  - 계속해서 주지 마십시오
  lexicon: HALOT
  rationale: 이미 하던 공급을 중단하라는 뜻을 한국어에서 가장 자연스럽게 드러내기 위해 시간적·습관적 중단을 나타내는 ‘다시는’을 택했습니다.
- source_word: תֶּבֶן
  english_pob_choice: straw
  chosen_korean: 짚
  alternatives_korean:
  - 볏짚
  - 밀짚
  lexicon: HALOT
  rationale: 벽돌 제조에 섞는 재료를 가리키는 일반명사로는 ‘짚’이 가장 자연스럽고, 본문의 의미를 과도하게 좁히지 않습니다.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  english_pob_choice: as before
  chosen_korean: 전처럼
  alternatives_korean:
  - 예전처럼
  - 어제 그제처럼
  lexicon: HALOT
  rationale: 직역보다 관용적 의미인 ‘예전과 같이’가 문맥상 분명하므로, 본문의 과거 관행을 짧고 자연스럽게 전달하는 ‘전처럼’을 선택했습니다.
- source_word: וְקֹשְׁשׁוּ
  english_pob_choice: and gather
  chosen_korean: 모으게
  alternatives_korean:
  - 가져오게
  - 줍게
  lexicon: HALOT
  rationale: 흩어진 재료를 스스로 확보하라는 뜻을 살리기 위해 ‘모으다’를 사용했고, 명령의 흐름에 맞게 사역형으로 처리했습니다.
