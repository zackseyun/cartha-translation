    reason: lexical_alternative
  - marker: b
    text: 또는 “너희의 강제 노역으로 가라.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ מִצְרַיִם
  english_pob_choice: the king of Egypt
  chosen_korean: 이집트 왕
  alternatives_korean:
  - 애굽 왕
  - 이집트의 왕
  lexicon: HALOT
  rationale: 히브리어 원문의 관형 관계를 자연스러운 현대 한국어로 옮겼고, 본문 흐름상 고유명사화된 지칭이므로 간결하게 처리했습니다.
- source_word: תַּפְרִיעוּ
  english_pob_choice: are you causing the people to neglect their work
  chosen_korean: 백성이 자기 일에 집중하지 못하게 하느냐
  alternatives_korean:
  - 백성이 자기 일을 소홀히 하게 하느냐
  - 백성의 일을 방해하느냐
  - 백성이 자기 일을 그만두게 하느냐
  lexicon: HALOT
  rationale: 히필형의 ‘방해하여 일을 멈추게 하다’라는 뜻을 살리되, 한국어에서는 ‘집중하지 못하게 하다’가 자연스럽고 왕의 비난조도 유지합니다.
- source_word: מִמַּעֲשָׂיו
  english_pob_choice: their work
  chosen_korean: 자기 일
  alternatives_korean:
  - 그들의 일
  - 그들의 노동
  - 일
  lexicon: HALOT
  rationale: 히브리어는 집합적 의미로 ‘백성의 일/노동’을 가리키므로, 문맥상 자연스럽게 ‘자기 일’로 옮겼습니다.
- source_word: לְסִבְלֹתֵיכֶם
  english_pob_choice: to your burdens
  chosen_korean: 너희의 짐으로 돌아가라
  alternatives_korean:
  - 너희의 짐으로 가라
  - 너희의 부담으로 가라
  - 너희의 강제 노역으로 가라
  lexicon: HALOT
  rationale: ‘짐/부담’의 구체적 이미지를 살리면서, 출애굽기 문맥에서의 억압적 노동 뉘앙스를 유지했습니다. ‘강제 노역’은 해석을 더 분명히 하지만 원문의 비유적 표현을 덜 보존합니다.
theological_decisions:
- issue: 왕의 질책을 직접화법으로 유지할지 여부
  chosen_reading: 모세와 아론아, 너희가 어찌하여…하느냐?
  alternative_readings:
  - 모세와 아론, 왜…합니까?
  - 모세와 아론이여, 어찌하여…하느냐?
  rationale: 본문은 파라오의 즉각적 책망을 드러내므로 직접화법을 유지하고, 한국어에서도 대화체의 압박감을 살리기 위해 직설적 질문형을 선택했습니다.
  doctrine_reference: 서사문 직역 원칙
