  text: 그러나 이집트 왕이 그들에게 말했습니다. “모세와 아론아, 너희가 어찌하여 백성이 자기 일에 집중하지 못하게 하느냐? 가서 너희의 짐으로 돌아가라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
