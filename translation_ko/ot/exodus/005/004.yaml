  to: 그러나 이집트 왕이 그들에게 말했습니다. “모세와 아론아, 너희가 어찌하여 백성을 그들의 일에서 손을 떼게 하느냐?[a] 너희의 짐으로 가라.[b]”
  rationale: 본문은 תפריעוּ의 사역적 의미를 ‘일에서 손을 떼게 하다’로 옮겨 백성이 노동을 중단하도록 만든다는 파라오의 비난을 보존했습니다. לְכוּ는 의미를 덧붙이지 않고 ‘가라’로 번역했습니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:36:16Z'
