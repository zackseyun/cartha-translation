base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; alternatively rendered ''Yahweh.'''
    reason: alternative_reading
  - marker: b
    text: Or 'keep a festival for me' or 'celebrate a festival to me'; the Hebrew verb refers to observing a feast/festival.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후 모세와 아론이 바로에게 나아가 말했습니다. 「이스라엘의 하나님 야훼[a]께서 이렇게 말씀하십니다. ‘내 백성을 보내어, 그들이 광야에서 나를 위하여 절기를 지키게 하십시오[b].’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יְהוָה는 관례적 대체어인 ‘주’가 아니라 고유명사 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 חגג는 단순한 예배보다 절기를 준수하거나 축제를 거행한다는 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר / בָּאוּ
  english_pob_choice: Afterward / went in
  chosen_korean: 그 후 … 가서
  alternatives_korean:
  - 그 뒤 … 들어가서
  - 이후 … 나아가서
  lexicon: HALOT
  rationale: משך השיח의 순서를 드러내는 זמן 부사와, 파라오 앞에 나아가는 장면을 자연스럽게 묶어 한국어 서술로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사를 그대로 반영하는 프로젝트 기본값을 따랐고, 주어 자리에 제목어를 대체하지 않았습니다.
- source_word: שַׁלַּח אֶת עַמִּי
  english_pob_choice: Let my people go
  chosen_korean: 내 백성을 가게 하십시오
  alternatives_korean:
  - 내 백성을 놓아주십시오
  - 내 백성을 내보내십시오
  lexicon: HALOT
  rationale: שלח의 핵심은 단순한 '보냄'이 아니라 억류 상태에서의 해방 요구이므로, 직설적이면서도 과도하게 해석하지 않는 명령형으로 옮겼습니다.
- source_word: וְיָחֹגּוּ לִי
  english_pob_choice: so that they may hold a feast to me
  chosen_korean: 그들이 저를 위하여 절기를 지킬 것입니다
  alternatives_korean:
  - 그들이 저를 위하여 잔치를 지킬 것입니다
  - 그들이 저를 위하여 축제를 지킬 것입니다
  lexicon: HALOT
  rationale: חגג는 단순한 일반 예배보다 절기/축제 준수를 가리키므로, 한국어에서도 '절기를 지키다'로 옮겨 제의적 뉘앙스를 살렸습니다.
- source_word: בַּמִּדְבָּר
  english_pob_choice: in the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 들판에서
  - 사막에서
  lexicon: HALOT
  rationale: 성서 히브리어의 מִדְבָּר는 일반적으로 광야를 뜻하므로, 지리적·신학적 배경을 모두 살리는 표준 번역을 택했습니다.
theological_decisions:
- issue: 야훼의 직접 화법을 한국어 명령문으로 옮기는 방식
  chosen_reading: 「내 백성을 가게 하십시오」처럼 정중한 명령형을 사용해 바로에게 전달되는 신적 명령의 권위를 살렸습니다.
  alternative_readings:
  - 「내 백성을 놓아주십시오」
  - 「내 백성을 보내십시오」
  rationale: 원문은 선지자적 사자 공식('Thus says') 뒤에 권위 있는 명령을 제시하므로, 현대 공용어체의 정중 명령형이 문체와 의미를 함께 보존합니다.
  doctrine_reference: '번역 원칙: source-direct, formal-polite register'
