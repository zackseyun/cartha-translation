    issue: '''바로와 그의 신하들의 눈앞에서'' is spatially oriented.'
    rationale: The Hebrew 'in the eyes of Pharaoh and in the eyes of his servants' refers principally to how the Israelites are regarded by them. Korean '눈에' directly conveys this evaluative sense; '눈앞에서' can instead suggest an action occurring in their physical presence.
