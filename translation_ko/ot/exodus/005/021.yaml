  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''have made our smell stink,'' that is, ''have made us repulsive'' or ''have made us seem foul.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그들에게 말했습니다. “야훼께서 너희를 보시고 심판하시기를 바랍니다. 너희가 우리를 바로와 그의 신하들의 눈앞에서 악취가 나게 만들어, 그들의 손에 칼을 쥐여 우리를 죽이게 하였기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리 냄새를 악취 나게 하다’라는 뜻으로, 곧 ‘우리를 혐오스럽게 만들다’는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문이 여호와 하나님의 고유명사를 직접 사용하므로, 프로젝트 기본값에 따라 한국어에서는 ‘야훼’로 옮겨 제목화된 ‘주님’으로 대체하지 않았습니다.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  english_pob_choice: in the sight of Pharaoh and in the sight of his servants
  chosen_korean: 바로와 그의 신하들의 눈앞에서
  alternatives_korean:
  - 바로와 그의 신하들의 눈에
  - 바로와 그의 신하들 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘눈에/눈앞에’를 한국어에서도 인지 가능한 방식으로 살려, 평가·인식의 장면을 직설적으로 드러냈습니다.
- source_word: הִבְאַשְׁתֶּם אֶת רֵיחֵנוּ
  english_pob_choice: you have made us stink
  chosen_korean: 우리를 악취가 나게 만들어
  alternatives_korean:
  - 우리 냄새를 악취 나게 만들어
  - 우리를 역겹게 만들어
  lexicon: HALOT
  rationale: ‘냄새를 나쁘게 하다’의 구체적 이미지를 유지하되 한국어에서 자연스러운 동사 구문으로 옮겨, 수치와 혐오의 뉘앙스를 살렸습니다.
- source_word: לָתֵת חֶרֶב בְּיָדָם
  english_pob_choice: putting a sword in their hand
  chosen_korean: 그들의 손에 칼을 쥐여
  alternatives_korean:
  - 그들의 손에 칼을 주어
  - 그들에게 칼을 들려
  lexicon: HALOT
  rationale: 원문의 원인-결과 관계를 보존하면서, 살해 수단을 ‘쥐여’로 표현해 실제로 무기를 넘겨주는 장면감을 살렸습니다.
theological_decisions:
- issue: 여호와의 호칭을 어떻게 한국어로 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה는 인격적 언약 이름이므로, 번역문에서도 신학적으로 중립적인 칭호보다 고유명사 ‘야훼’를 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
