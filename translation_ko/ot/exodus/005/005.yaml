  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
  footnotes:
  - marker: a
    text: Or 'you have made them cease from their labors' or 'you are causing them to rest from their burdens.' The Hebrew verb is causative ('make cease/stop') and can be rendered in several close ways depending on how explicitly the labor context is brought out.
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오가 말했습니다. “보십시오, 이제 그 땅의 백성이 많아졌는데, 너희가 그들이 짊어진 짐을 내려놓게 하고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 사역형으로, 직역하면 ‘그들을 그들의 짐에서 그치게 하다’라는 뜻입니다. 문맥에 따라 ‘노역을 그만두게 하다’ 또는 ‘짐에서 쉬게 하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר פַּרְעֹה
  english_pob_choice: Pharaoh said
  chosen_korean: 파라오가 말했습니다
  alternatives_korean:
  - 바로가 말했습니다
  - 파라오가 말하였습니다
  lexicon: WLC
  rationale: 고유명사는 현대 외래어 표기법에 따라 파라오로 옮기고, 서술은 합쇼체로 자연스럽게 처리했습니다.
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 감탄적 주의 환기 표현으로서, 현대 한국어에서는 ‘보십시오’가 공손하면서도 주의를 끄는 힘을 잘 살립니다.
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 이 땅의 백성
  alternatives_korean:
  - 그 땅의 백성
  - 땅의 백성
  lexicon: HALOT
  rationale: 히브리어의 직접적 구성을 살리되 한국어에서 자연스러운 소유·소속 표현으로 옮겼습니다.
- source_word: וְהִשְׁבַּתֶּם
  english_pob_choice: you are making them stop
  chosen_korean: 그들을 그들의 짐에서 쉬게 하고 있습니다
  alternatives_korean:
  - 그들을 그들의 짐에서 멈추게 하고 있습니다
  - 그들을 그들의 짐에서 쉬게 만들고 있습니다
  - 그들을 그들의 짐에서 쉬게 하고 있습니다
  lexicon: HALOT
  rationale: 히필의 사역적 ‘중지/휴식시키다’ 의미를 반영해, 단순한 정지보다 ‘쉬게 하다’로 옮겼습니다. POB의 ‘stop’ 계열 판단을 살리되, 문맥상 ‘burdens’와 결합된 의미를 드러냅니다.
- source_word: מִסִּבְלֹתָם
  english_pob_choice: from their burdens
  chosen_korean: 그들의 짐에서
  alternatives_korean:
  - 그들의 강제 노역에서
  - 그들의 노고에서
  lexicon: HALOT
  rationale: סִבְלֹת의 핵심 의미인 ‘짐, 부담’을 유지해, 이집트의 압제적 노동 부담을 직접적으로 보이게 했습니다.
theological_decisions:
- issue: 히필 동사의 의미를 ‘쉬게 하다’로 옮길지 ‘멈추게 하다’로 옮길지
  chosen_reading: 본문의 사역적 의미를 살리면서 문맥상 부담에서 벗어나게 하는 뉘앙스를 드러내기 위해 ‘쉬게 하고 있습니다’로 옮겼습니다.
  alternative_readings:
  - 그들을 멈추게 하고 있습니다
  - 그들을 그들의 짐에서 쉬게 하고 있습니다
  rationale: 출애굽기 5장의 바로 발언은 강제 노동의 중단을 불평하는 말이므로, 단순한 중지보다 ‘휴식’의 결과를 암시하는 번역이 문맥에 더 정확합니다.
  doctrine_reference: 본문 해석상 어휘·문맥 결정
