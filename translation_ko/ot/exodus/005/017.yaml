  footnotes:
  - marker: a
    text: 히브리어는 ‘게으르다, 게으르다’의 반복으로 강조를 나타냅니다. ‘나태하다, 매우 나태하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But he said
  chosen_korean: 그러나 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 서사 연결의 waw-consecutive를 살리되, 앞선 탄원에 대한 파라오의 반응이라는 문맥상 대조를 자연스럽게 드러내기 위해 ‘그러나’를 사용했습니다.
- source_word: נִרְפִּים
  english_pob_choice: idle
  chosen_korean: 게으릅니다
  alternatives_korean:
  - 한가합니다
  - 나태합니다
  - 무기력합니다
  lexicon: HALOT
  rationale: 파라오의 비난 어조를 현대 한국어로 직접 살리기 위해 ‘게으릅니다’를 택했고, 반복을 그대로 보존해 강조를 유지했습니다.
- source_word: עַל כֵּן
  english_pob_choice: That is why
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이 때문에
  - 그런 까닭에
  lexicon: HALOT
  rationale: 말한 내용에 대한 파라오의 추론 관계를 간결하고 분명하게 나타내는 연결어로 ‘그러므로’를 선택했습니다.
- source_word: לַ/יהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼에게
  - 여호와께
  - 주께
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 יהוה를 ‘야훼’로 옮기고, 제사의 수혜 대상을 나타내는 ל를 한국어 조사 ‘-께’로 자연스럽게 표현했습니다.
