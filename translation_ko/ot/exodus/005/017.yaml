translation:
  language: ko
  text: 그러나 그가 말했습니다. “너희는 게으릅니다, 게으릅니다! 그러므로 너희가 ‘우리가 가서 야훼께 제사드리겠습니다’라고 말하는 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘게으르다, 게으르다’의 반복으로 강조를 나타냅니다. ‘나태하다, 매우 나태하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: But he said
  chosen_korean: 그러나 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 서사 연결의 waw-consecutive를 살리되, 앞선 탄원에 대한 파라오의 반응이라는 문맥상 대조를 자연스럽게 드러내기 위해 ‘그러나’를 사용했습니다.
- source_word: נִרְפִּים
  english_pob_choice: idle
  chosen_korean: 게으릅니다
  alternatives_korean:
  - 한가합니다
  - 나태합니다
  - 무기력합니다
  lexicon: HALOT
  rationale: 파라오의 비난 어조를 현대 한국어로 직접 살리기 위해 ‘게으릅니다’를 택했고, 반복을 그대로 보존해 강조를 유지했습니다.
- source_word: עַל כֵּן
  english_pob_choice: That is why
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이 때문에
  - 그런 까닭에
  lexicon: HALOT
  rationale: 말한 내용에 대한 파라오의 추론 관계를 간결하고 분명하게 나타내는 연결어로 ‘그러므로’를 선택했습니다.
- source_word: לַ/יהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼에게
  - 여호와께
  - 주께
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 יהוה를 ‘야훼’로 옮기고, 제사의 수혜 대상을 나타내는 ל를 한국어 조사 ‘-께’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 신명기 전통 이름 יהוה를 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 히브리 본문에서 직접 테트라그람마톤을 사용하므로, 프로젝트의 원문 가시성 원칙에 따라 고유 신명인 ‘야훼’를 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
