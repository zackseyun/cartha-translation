  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
  footnotes:
  - marker: a
    text: 'Hebrew: ''idle, idle,'' with repetition for emphasis; alternatively, ''lazy, very lazy.'''
