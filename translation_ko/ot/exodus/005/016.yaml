    rationale: ‘당신의 백성의 죄가 되었습니다’는 ‘וְחָטָאת עַמֶּךָ’를 한국어 관용에 맞지 않게 처리하며, 누가 잘못했는지와 고발의 논지를 흐립니다. 문맥상 바로의 백성에게 책임이 있다는 뜻으로 번역하는 것이 타당하나, 논쟁적인 압축 구문이므로 직역 대안은 각주에 남겨야 합니다.
