  verdict: revise
  source_fidelity: 초안의 마지막 절 ‘당신의 백성의 죄가 되었습니다’는 히브리어의 압축된 표현을 한국어로 자연스럽게 옮기지 못하며, 문맥상 바로 앞의 학대에 대한 책임이 바로의 백성(감독관들)에게 있다는 호소를 충분히 나타내지 못합니다. 본문은 그 문맥적 의미를 반영하되, 직역 가능성은 각주로 보존했습니다.
  naturalness: ‘당신’은 왕에게 올리는 공적 호소의 한국어 문맥에서 부자연스럽고, ‘왕의’가 자연스럽습니다. 또한 ‘맞고 있지만’보다 ‘매를 맞고 있는데도’가 진행 중인 학대와 대조를 더 분명히 전달합니다.
  terminology: עֲבָדֶיךָ는 화자들이 바로에게 자신을 낮추어 부르는 표현이므로 ‘왕의 종들’로 옮겼습니다. תֶּבֶן은 벽돌 제조 맥락에 맞게 ‘짚’, לְבֵנִים은 ‘벽돌’로 유지했습니다. וְחָטָאת עַמֶּךָ는 본문에서 ‘잘못은 왕의 백성에게 있습니다’로 번역하고, ‘왕의 백성이 죄를 지었습니다’라는 형식적 직역 가능성을 각주에 제시했습니다.
