translation:
  language: ko
  text: 그리고 웃시엘의 아들들은 미사엘, 엘사반, 그리고 시드리입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엘사반’은 영어 전통에서 흔한 Elizaphan과도 대응될 수 있는 이름입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘시드리’는 영어 전통에서 Zithri로도 표기될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
