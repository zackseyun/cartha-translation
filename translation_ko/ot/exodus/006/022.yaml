translation:
  language: ko
  text: 그리고 웃시엘의 아들들은 미사엘과 엘사반[a]과 시드리[b]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘엘사반’은 ‘엘리사반’으로도 음역됩니다.
