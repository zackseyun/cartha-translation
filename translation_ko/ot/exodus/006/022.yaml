  - marker: b
    text: ‘시드리’는 ‘지드리’로도 음역됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자손들은
  - 그런데 …의 아들들은
  lexicon: HALOT
  rationale: 족보 목록의 연결을 살리기 위해 ו를 ‘그리고’로 옮기고, בְנֵי의 친족 관계 표현은 ‘아들들’로 직역해 계보 형식을 유지했습니다.
- source_word: עֻזִּיאֵל
  english_pob_choice: Uzziel
  chosen_korean: 웃시엘
  alternatives_korean:
  - 우지엘
  - 우찌엘
  lexicon: 고유명사 음역
  rationale: 고유명사는 음역하는 것이 적절하므로 현대 한국어 표기 관행에 따라 ‘웃시엘’로 옮겼습니다.
- source_word: מִישָׁאֵל
  english_pob_choice: Mishael
  chosen_korean: 미사엘
  alternatives_korean:
  - 미샤엘
  - 미사엘
  lexicon: 고유명사 음역
  rationale: 히브리어 이름을 표준적인 한국어 음역으로 옮겼으며, 영어 POB의 Mishael에 대응시켰습니다.
- source_word: וְ/אֶלְצָפָן
  english_pob_choice: and Elzaphan
  chosen_korean: 엘사반
  alternatives_korean:
  - 엘자판
  - 엘리사반
  lexicon: 고유명사 음역
  rationale: 영어 POB의 Elzaphan에 대응하는 이름을 한국어로 음역했으며, 히브리어 자음군을 반영해 ‘엘사반’을 택했습니다.
- source_word: וְ/סִתְרִי
  english_pob_choice: and Sithri
  chosen_korean: 시드리
  alternatives_korean:
  - 시트리
  - 지드리
  lexicon: 고유명사 음역
  rationale: 영어 POB의 Sithri를 한국어로 음역해 인명 목록의 음성적 성격을 유지했습니다.
