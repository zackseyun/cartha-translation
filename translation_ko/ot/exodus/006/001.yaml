id: EXO.6.1
reference: Exodus 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
  footnotes:
  - marker: a
    text: Or, 'under compulsion he will let them go, and under compulsion he will drive them out.' The repeated phrase 'by a strong hand' may imply Pharaoh acts because of overwhelming force, ultimately God's power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 모세에게 말씀하셨습니다. “이제 내가 바로에게 할 일을 보게 될 것입니다. 그가 강한 손으로 그들을 놓아주고, 강한 손으로 그들을 자기 땅에서 내쫓을 것이기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강한 손으로’는 히브리어 관용구를 직역한 것입니다. 문맥상 ‘강한 힘의 압력 아래서’ 또는 ‘강한 힘으로’라는 뜻으로 이해될 수 있으나, 그 힘과 파라오의 행동의 관계는 본문에서 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 YHWH 원칙에 따라 고유명사를 보존해야 하므로, 신학적 호칭인 ‘주’가 아니라 ‘야훼’로 옮겼습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - 그때 ... 말씀하셨습니다
  lexicon: HALOT
  rationale: 서사 전개를 자연스럽게 이어 주는 진행 표지로 ‘그러자’를 사용했고, 하나님의 직접 발화이므로 ‘말씀하셨습니다’로 공손하게 처리했습니다.
- source_word: בְיָד חֲזָקָה
  english_pob_choice: by a strong hand
  chosen_korean: 강한 손 때문에
  alternatives_korean:
  - 강한 손으로
  - 강한 손 아래서
  lexicon: HALOT
  rationale: 문맥상 반복되는 표현은 유지하되, 본문의 긴장대로 그 압박이 파라오의 행동을 이끈 원인을 드러내기 위해 ‘때문에’로 옮겼습니다.
- source_word: יְשַׁלְּחֵם / יְגָרְשֵׁם
  english_pob_choice: he will let them go / he will drive them out
  chosen_korean: 그들을 놓아주고 / 그들을 자기 땅에서 내쫓을
  alternatives_korean:
  - 그들을 보내고 / 그들을 쫓아낼
  - 그들을 풀어주고 / 그들을 내쫓을
  lexicon: HALOT
  rationale: שלח는 출애굽 문맥에서 ‘놓아주다’가 가장 자연스럽고, גרש는 단순한 석방보다 강한 축출이므로 ‘내쫓다’로 구분했습니다.
- source_word: מֵאַרְצוֹ
  english_pob_choice: from his land
  chosen_korean: 자기 땅에서
  alternatives_korean:
  - 그의 땅에서
  - 그 땅에서
  lexicon: HALOT
  rationale: 소유 접미사를 자연스럽게 살리되 한국어에서는 ‘자기 땅’이 더 간결하고 문맥상 파라오의 소유권을 분명히 드러냅니다.
theological_decisions:
- issue: ‘by a strong hand’의 주체와 의미
  chosen_reading: 본문의 반복을 살려 ‘강한 손 때문에’로 번역하되, 그 압박의 궁극적 원인이 하나님의 능력이라는 해석을 본문 안에서 과하게 명시하지는 않았습니다.
  alternative_readings:
  - ‘강한 손으로’
  - ‘강한 손 아래서’
  rationale: 히브리어는 파라오의 행동과 연결되지만, 그 배후의 힘을 완전히 풀어 쓰면 본문이 가진 모호성과 수사적 긴장이 사라집니다.
  doctrine_reference: 'Translation philosophy #3 — 신학적 긴장을 해소하지 말고 보존하기'
- issue: 하나님의 직접 발화의 문체
  chosen_reading: 하나님이 모세에게 말씀하시는 직접 화법을 한국어 공손체로 옮겼습니다.
  alternative_readings:
  - ‘말했다’
  - ‘이르셨습니다’
  rationale: 서사 문체는 합쇼체를 유지하되, 하나님을 향한 직접 호명이나 기도문이 아닌 내레이션에서는 ‘말씀하셨습니다’가 가장 균형 잡힌 공손 표현입니다.
  doctrine_reference: Korean style guide — 현대 합쇼체
