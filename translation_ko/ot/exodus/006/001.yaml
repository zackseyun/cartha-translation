  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘내가 바로에게 하는 일’은 히브리어 미완료형 אֶעֱשֶׂה의 미래 지향성을 현재 진행으로 약화합니다. 또한 בְיָד חֲזָקָה를 ‘강한 손 때문에’로 옮기면 원인·강제의 의미를 본문에서 다소 명시하게 됩니다. ‘강한 손으로’는 반복과 행위 주체/힘의 관계에 관한 원문의 여지를 더 잘 보존합니다.
  naturalness: 합쇼체에 맞추어 직접 발화의 종결을 ‘-것입니다’로 통일했습니다. 주어를 생략하여 하나님이 모세에게 ‘너/당신’이라고 부르는 방식에서 생길 수 있는 현대 한국어의 어색함을 피했습니다. ‘바로에게 내가 할 일’과 ‘자기 땅’은 자연스럽고 문맥상 분명합니다.
  terminology: ‘야훼’, ‘모세’, ‘바로’를 유지하고, שׁלח와 גרש의 강도 차이는 각각 ‘놓아주다’와 ‘내쫓다’로 유지했습니다. 각주도 특정 신학적 결론을 단정하지 않고 관용구의 가능한 강제 의미만 제시하도록 조정했습니다.
