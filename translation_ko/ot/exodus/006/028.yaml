  to: 야훼께서 이집트 땅에서 모세에게 말씀하신 날에 이런 일이 있었습니다.
  rationale: 명시적 ‘이제는’을 제거하여 원문의 서사적 접속 기능을 과도하게 해석하지 않았고, 완료형 동사를 ‘말씀하신’으로 바로잡았습니다. ‘이런 일이 있었습니다’는 וַיְהִי의 사건 도입 기능을 현대 한국어로 자연스럽게 재현합니다.
