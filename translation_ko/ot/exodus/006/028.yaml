  text: וַ/יְהִ֗י בְּ/י֨וֹם דִּבֶּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/028.yaml
  text: Now it happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
  footnotes:
  - marker: a
    text: Or 'And it happened' / 'And it came to pass.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'YHWH'; traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 이제는 야훼께서 이집트 땅에서 모세에게 말씀하시던 날이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now it happened
  chosen_korean: 이제는 …이었습니다
  alternatives_korean:
  - 그리고 …이었습니다
  - 그때 …이 있었습니다
  lexicon: HALOT
  rationale: 서사 전환을 나타내는 היה의 와우 연속형을 한국어의 자연스러운 서두인 ‘이제는’으로 옮겨, 문맥 전환을 살리면서도 구어체적 직역투를 피했습니다.
- source_word: בְּיוֹם
  english_pob_choice: on the day
  chosen_korean: …하시던 날
  alternatives_korean:
  - 그날
  - 그날에
  lexicon: HALOT
  rationale: 직역의 ‘그 날에’보다, 이어지는 동사구와 함께 ‘말씀하시던 날’로 풀어 시간 부사를 자연스럽게 구현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 사본의 신명 יְהוָה를 관습적 대치어가 아니라 고유명사로 보존하기 위해 ‘야훼’를 사용했습니다.
- source_word: בְּאֶרֶץ מִצְרַיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 이집트 나라에서
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’(אֶרֶץ)을 그대로 반영하되, 한국어에서는 자연스럽게 ‘이집트 땅에서’로 옮겨 지리적 배경을 유지했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 직접 신명 יְהוָה를 사용하므로, 직함으로 바꾸지 않고 고유한 언약적 이름을 드러내는 번역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
