  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: ko
  text: 아론은 암미나답의 딸이자 나손의 누이인 엘리세바를 자기 아내로 맞았고, 그녀는 그에게 나답과 아비후와 엘르아살과 이다말을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 맞았고
  alternatives_korean:
  - 데려왔고
  - 취했고
  - 아내로 삼았고
  lexicon: HALOT
  rationale: 결혼 문맥의 לקח를 한국어에서 자연스럽고 공손한 서술로 옮기되, 단순한 동작보다 혼인 행위를 드러내기 위해 ‘아내로 맞다’를 택했습니다.
- source_word: לְאִשָּׁה
  english_pob_choice: as his wife
  chosen_korean: 자기 아내로
  alternatives_korean:
  - 아내로
  - 자기 아내가 되도록
  - 아내로서
  lexicon: HALOT
  rationale: 히브리어의 관용적 혼인 표현을 한국어에서도 분명하게 살리기 위해 소유 관계를 포함한 ‘자기 아내로’로 옮겼습니다.
- source_word: וַתֵּלֶד לוֹ
  english_pob_choice: and she bore him
  chosen_korean: 그에게 …을 낳았습니다
  alternatives_korean:
  - 그를 위하여 …을 낳았습니다
  - 그에게 …를 출산했습니다
  - 그가 …을 낳게 했습니다
  lexicon: HALOT
  rationale: 낳다 동사의 기본 의미를 유지하면서, 여격 목적어를 자연스러운 현대 한국어로 처리했습니다.
- source_word: אֱלִישֶׁבַע / נָדָב / אֲבִיהוּא / אֶלְעָזָר / אִיתָמָר
  english_pob_choice: Elisheba / Nadab / Abihu / Eleazar / Ithamar
  chosen_korean: 엘리세바 / 나답 / 아비후 / 엘르아살 / 이다말
  alternatives_korean:
  - 엘리사바 / 나답 / 아비후 / 엘르아살 / 이다말
  - 엘리세바 / 나답 / 아비후 / 엘리에셀 / 이다말
  lexicon: Korean standard transliteration
  rationale: 고유명사는 통용되는 한국어 음역을 따르되, 엘리세바·엘르아살은 히브리어 형태에 더 가까운 표기를 반영했습니다.
theological_decisions:
- issue: 혼인 서술에서 לקח와 לְאִשָּׁה의 관계
  chosen_reading: ‘아론은 …를 자기 아내로 맞았고’로 옮겨, 본문이 단순한 ‘취함’이 아니라 정식 혼인 관계의 성립을 말함을 드러냈습니다.
  alternative_readings:
  - ‘아론은 …를 데려왔고’
  - ‘아론은 …를 아내로 삼았고’
  rationale: 히브리어 관용구의 혼인 의미를 분명히 하면서도, 본문의 서술적 톤을 유지하기 위한 선택입니다.
  doctrine_reference: 창 2:24의 혼인 언어, 출애굽기 족보/가계 서술의 문맥
