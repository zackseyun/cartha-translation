  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֵרָ֗א אֶל אַבְרָהָ֛ם אֶל יִצְחָ֥ק וְ/אֶֽל יַעֲקֹ֖ב בְּ/אֵ֣ל שַׁדָּ֑י וּ/שְׁמִ֣/י יְהוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
  footnotes:
  - marker: a
    text: Or, 'I did not make myself known to them by my name Yahweh.' The Hebrew may refer not to ignorance of the divine name itself, but to not yet knowing its full covenantal significance.
    reason: alternative_reading
  - marker: b
    text: Hebrew El Shaddai; traditionally rendered 'God Almighty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 아브라함에게, 이삭에게, 야곱에게는 전능하신 하나님으로 나타났으나, 내 이름 야훼로는 그들에게 알려지지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 이름 야훼로는 그들에게 나 자신을 알리지 않았다.’ 히브리어는 이름 자체의 미지보다, 그 이름의 완전한 언약적 의미가 아직 드러나지 않았다는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 엘 샷다이. 전통적으로 ‘전능하신 하나님’으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרָא
  english_pob_choice: And I appeared
  chosen_korean: 나는 … 나타났으나
  alternatives_korean:
  - 나는 … 보였으나
  - 나는 … 드러났으나
  lexicon: HALOT
  rationale: נראה 계열의 1인칭 완료형은 직접적으로 ‘나타나다’로 옮기는 것이 가장 자연스럽고, 계시적 뉘앙스는 문맥이 충분히 전달합니다.
- source_word: אֶל אַבְרָהָם אֶל יִצְחָק וְאֶל יַעֲקֹב
  english_pob_choice: to Abraham, to Isaac, and to Jacob
  chosen_korean: 아브라함에게, 이삭에게, 야곱에게
  alternatives_korean:
  - 아브라함, 이삭, 야곱에게
  - 아브라함에게, 이삭과 야곱에게
  lexicon: HALOT
  rationale: 반복된 전치사를 한국어에서도 살려 각 인물에게 개별적으로 향한 도착/현현의 느낌을 유지했습니다.
- source_word: בְּאֵל שַׁדָּי
  english_pob_choice: as God Almighty
  chosen_korean: 전능하신 하나님으로
  alternatives_korean:
  - 엘 샷다이로
  - 전능하신 하나님으로서
  lexicon: HALOT
  rationale: ב의 표지 기능을 ‘~로’로 옮겨, 이름/칭호의 현현 방식이라는 문맥을 자연스럽게 반영했습니다. El Shaddai를 음역하기보다 의미역을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 야훼
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨 인격명과 언약적 대비를 살렸습니다.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  english_pob_choice: I was not known to them
  chosen_korean: 그들에게 알려지지 않았습니다
  alternatives_korean:
  - 그들에게 알려지지 않았습니다
  - 그들에게 내 이름으로는 나 자신을 알리지 않았습니다
  - 그들은 나를 알지 못했습니다
  lexicon: HALOT
  rationale: נודע의 수동/상태 의미를 따라 직설적으로 옮기되, 해석을 과도하게 풀어 쓰지 않아 본문의 긴장을 보존했습니다.
theological_decisions:
- issue: 야훼 이름과 족장들에게의 계시 정도
  chosen_reading: 본문의 대조를 그대로 살려, 족장들에게는 ‘전능하신 하나님’으로, 이름 야훼는 ‘알려지지 않았다’고 번역했습니다.
  alternative_readings:
  - 그들에게 내 이름 야훼의 충만한 언약적 의미가 알려지지 않았다
  - 그들에게 내 이름으로 자신을 드러내지 않았다
  rationale: 히브리어는 단순한 음성적 미지보다 언약적/경험적 인식을 가리킬 수 있으므로, 본문은 그 해석을 주석적으로만 남기고 번역 본문은 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
