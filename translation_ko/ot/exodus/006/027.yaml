base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
  footnotes:
  - marker: a
    text: Or, more literally, 'They are the ones who were speaking to Pharaoh king of Egypt.' The Hebrew uses a participle for ongoing characterization.
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'the children of Israel'; Hebrew is more specifically 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 바로 바로 이집트 왕 파라오에게 말하여 이스라엘 자손을 이집트에서 이끌어 내게 한 사람들입니다—곧 모세와 아론입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, '그들은 이집트 왕 파라오에게 말하고 있던 사람들입니다.' 히브리어는 진행 중인 특징을 나타내는 분사를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적인 번역은 흔히 '이스라엘 자손' 대신 '이스라엘의 자녀들' 또는 '이스라엘 자손'의 관용적 표현을 사용하지만, 히브리어는 더 구체적으로 '이스라엘의 아들들'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  english_pob_choice: These are the ones
  chosen_korean: 이들은 바로
  alternatives_korean:
  - 이들은
  - 바로 이들은
  lexicon: HALOT
  rationale: 독립 대명사의 지시적·강조적 기능을 살려 앞서 언급된 인물들을 가리키는 문맥을 자연스럽게 드러냈습니다.
- source_word: הַמְדַבְּרִים
  english_pob_choice: who spoke
  chosen_korean: 말하여
  alternatives_korean:
  - 말하고 있는
  - 말하던
  lexicon: HALOT
  rationale: 히브리어 분사는 여기서 모세와 아론을 성격 규정하는 표현이므로, 한국어에서는 관계절보다 서술 동사로 풀어 자연스럽게 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 표현을 반영해 전통적이면서도 직역성이 있는 '이스라엘 자손'을 택했습니다.
- source_word: הוּא מֹשֶׁה וְאַהֲרֹן
  english_pob_choice: this is Moses and Aaron
  chosen_korean: 곧 모세와 아론입니다
  alternatives_korean:
  - 그것은 모세와 아론입니다
  - 이들이 모세와 아론입니다
  lexicon: HALOT
  rationale: 히브리어의 단수 지시 표현은 한국어에서 식별의 결론으로 자연스럽게 처리했고, 끝의 동격 관계를 '곧'으로 드러냈습니다.
theological_decisions:
- issue: 출애굽의 목적 표현
  chosen_reading: '''이스라엘 자손을 이집트에서 이끌어 내게 한 사람들''로 번역해, 단순한 이동이 아니라 해방 목적의 행동임을 드러냈습니다.'
  alternative_readings:
  - '''이스라엘 자손을 이집트에서 나오게 한'''
  - '''이스라엘 자손을 이집트에서 데리고 나온'''
  rationale: 히브리어 לְהוֹצִיא의 사역적 의미는 출애굽 본문에서 핵심이므로, 해방의 목적성을 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: Exodus 3–14의 출애굽 주제
- issue: 직접 화자 표지의 서술 방식
  chosen_reading: 본문 자체는 서술문으로 처리하고, 별도의 종교적 완곡어법을 두지 않았습니다.
  alternative_readings:
  - '''주께서 말씀하신'' 같은 신학적 보강'
  - 보다 전통적인 교회어휘 사용
  rationale: 이 절은 인물 식별을 위한 역사 서술이므로, 원문의 문장 기능을 유지하는 것이 우선입니다.
  doctrine_reference: 서사 본문 해석 원칙
