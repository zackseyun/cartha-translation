source:
  edition: WLC
  text: ה֥וּא אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם הוֹצִ֜יאוּ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
  footnotes:
  - marker: a
    text: Or “These were Aaron and Moses.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the sons of Israel”; traditional English often has “the children of Israel,” and a contextual rendering is “the Israelites.”
    reason: lexical_alternative
  - marker: c
    text: Or “by their hosts” or “with their companies”; the Hebrew term can denote organized groups, even military-style formations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 아론과 모세였습니다. 야훼께서 그들에게 말씀하셨습니다. “이스라엘 자손을 그들의 군대대로 이집트 땅에서 이끌어 내라.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא
  english_pob_choice: It was
  chosen_korean: 그것은 …였습니다
  alternatives_korean:
  - 이들은 …였습니다
  - 바로 …였습니다
  lexicon: HALOT
  rationale: 독립 인칭대명사의 지시·강조 기능을 한국어의 판정문으로 살려, 앞서 열거된 인물들을 식별하는 문장 구조를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신성명사 יְהוָה를 직역하지 않고 고유명으로 드러내는 POB 원칙에 따라 야훼를 사용했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 표현을 살리되, 한국어에서는 성별을 과도하게 노출하지 않는 관용적이면서도 원문 투명성이 높은 표현으로 옮겼습니다.
- source_word: עַל צִבְאֹתָם
  english_pob_choice: by their hosts
  chosen_korean: 그들의 군대대로
  alternatives_korean:
  - 그들의 진영대로
  - 그들의 무리대로
  - 그들의 편제대로
  lexicon: HALOT
  rationale: צִבְאֹתָם의 조직된 집단/군대적 배열 의미를 반영해, 단순한 ‘무리’보다 구조적·공동체적 질서를 더 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 하나님 음성의 직접 인용 register
  chosen_reading: 야훼께서 말씀하신 뒤, 직접 명령은 한국어 일반 명령형 “이끌어 내라”로 처리했습니다.
  alternative_readings:
  - 직접화법을 완만하게 풀어 “이끌어 내라고 하셨습니다”로 처리
  - 명령형을 공손형으로 바꾸어 “이끌어 내십시오”로 처리
  rationale: 본문은 인용문 안에서 명령을 직접 제시하므로, 서술문은 합쇼체를 유지하되 인용문 내부의 명령은 원문의 명령성을 보존해야 합니다.
  doctrine_reference: 'DOCTRINE.md: quoted speech and discourse register'
