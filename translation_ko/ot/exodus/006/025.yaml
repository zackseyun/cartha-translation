language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן לָקַֽח ל֨/וֹ מִ/בְּנ֤וֹת פּֽוּטִיאֵל֙ ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת פִּֽינְחָ֑ס אֵ֗לֶּה רָאשֵׁ֛י אֲב֥וֹת הַ/לְוִיִּ֖ם לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
  footnotes:
  - marker: a
    text: Or 'one of the daughters of Putiel.' The Hebrew expression may denote marriage into Putiel’s family without specifying which daughter.
    reason: lexical_alternative
  - marker: b
    text: Literally 'heads of fathers' houses,' a kinship term for leading ancestral households within the Levite clans.
    reason: cultural_note
translation:
  language: ko
  text: 아론의 아들 엘르아살은 푸디엘의 딸들 가운데서 아내를 맞이했고, 그녀는 그에게 비느하스를 낳았습니다. 이것들이 레위인들의 조상 가문들의 우두머리들이며, 그들의 종족별입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 푸디엘의 한 딸을 가리킬 수도 있고, 푸디엘의 집안으로 들어간 혼인을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아버지들의 집들의 우두머리들’은 레위 지파 안의 씨족적 가문 수장들을 가리키는 계보 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לּוֹ ... לְאִשָּׁה
  english_pob_choice: took for himself a wife
  chosen_korean: 아내를 맞이했고
  alternatives_korean:
  - 아내를 자기에게 맞이했고
  - 아내를 취했고
  - 장가들었고
  lexicon: HALOT
  rationale: 히브리어 관용구의 혼인 행위를 살리되, 한국어에서 자연스러운 서술로 옮기기 위해 ‘아내를 맞이하다’를 사용했습니다.
- source_word: מִבְּנוֹת פּוּטִיאֵל
  english_pob_choice: from the daughters of Putiel
  chosen_korean: 푸디엘의 딸들 가운데서
  alternatives_korean:
  - 푸디엘의 딸들 중에서
  - 푸디엘의 딸들 가운데 하나를
  - 푸디엘의 딸들 가운데
  lexicon: HALOT
  rationale: מִן + 복수 ‘딸들’의 출처/소속 뉘앙스를 살리면서, 어느 딸인지 특정하지 않는 애매성을 유지했습니다.
- source_word: וַתֵּלֶד לוֹ אֶת פִּינְחָס
  english_pob_choice: and she bore him Phinehas
  chosen_korean: 그녀는 그에게 비느하스를 낳았습니다
  alternatives_korean:
  - 그에게 비느하스를 낳았습니다
  - 그의 아들 비느하스를 낳았습니다
  - 비느하스를 그에게 낳아 주었습니다
  lexicon: HALOT
  rationale: 출산의 주어가 여인임을 분명히 하고, לוֹ의 수혜 대상을 ‘그에게’로 살렸습니다.
- source_word: רָאשֵׁי אֲבוֹת הַלְוִיִּם
  english_pob_choice: the heads of the fathers’ houses of the Levites
  chosen_korean: 레위인들의 조상 가문들의 우두머리들
  alternatives_korean:
  - 레위인들의 조상 집안들의 우두머리들
  - 레위인들의 조상 가문 우두머리들
  - 레위인들의 족장들
  lexicon: HALOT
  rationale: 문자적 ‘아버지들의 집들’보다 혈통·씨족 구조를 드러내는 ‘조상 가문’이 이 계보 문맥에 더 적합합니다.
- source_word: לְמִשְׁפְּחֹתָם
  english_pob_choice: by their clans
  chosen_korean: 그들의 종족별입니다
  alternatives_korean:
  - 그들의 가문별입니다
  - 그들의 종족에 따라입니다
  - 그들의 씨족별입니다
  lexicon: HALOT
  rationale: 미쉬파하의 계보적 단위성을 반영해 ‘종족’으로 옮겼고, 문맥상 분류 표지를 나타내는 ‘-별’로 처리했습니다.
