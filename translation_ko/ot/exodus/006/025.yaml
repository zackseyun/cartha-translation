  - severity: medium
    issue: 마지막 절의 문장 구조와 לְמִשְׁפְּחֹתָם 처리
    rationale: ‘그들의 종족별입니다’는 한국어 문장으로 비문에 가깝고, ‘씨족에 따라’가 앞선 ‘우두머리들’을 수식한다는 원문의 관계를 충분히 드러내지 못합니다.
  - severity: low
