revisions:
- from: 아론의 아들 엘르아살은 푸디엘의 딸들 가운데서 아내를 맞이했고, 그녀는 그에게 비느하스를 낳았습니다. 이것들이 레위인들의 조상 가문들의 우두머리들이며, 그들의 종족별입니다.[a][b]
  to: 아론의 아들 엘르아살은 부디엘의 딸들 가운데서[a] 아내를 맞이했고, 그 여인은 그에게 비느하스를 낳았습니다. 이들은 씨족에 따른 레위 사람들의 조상 가문 우두머리들입니다.[b]
  rationale: 부디엘의 표준 인명 표기를 적용하고, 씨족별 분류가 우두머리들을 수식하도록 문장을 재구성했습니다. 여성 단수 주어와 לוֹ의 ‘그에게’를 유지했으며, ‘딸들’이라는 복수 표현이 특정한 딸을 밝히지 않는 원문의 여지를 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
