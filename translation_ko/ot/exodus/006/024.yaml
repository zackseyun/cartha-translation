  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
  footnotes:
  - marker: a
    text: Or "families of the Korahites." The Hebrew term can denote extended family groupings within a tribe; "clans" is used here to reflect the genealogical setting more precisely.
