  text: 고라의 아들들은 앗시르와 엘가나와 아비아삽입니다. 이들은 고라 사람들의 가문들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가문들’은 히브리어 מִשְׁפְּחֹת가 지파 내부의 확대 친족 단위를 가리킬 수 있음을 반영한 번역입니다.
    reason: lexical_alternative
