  text: 'And the sons of Izhar: Korah, Nepheg, and Zichri.'
translation:
  language: ko
  text: 그리고 이스할의 아들들은 고라와 네벡과 시그리입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자손들은
  - 그리고 …의 후손들은
  lexicon: HALOT
  rationale: 계보 목록의 구조를 살리기 위해 접속사 ו를 ‘그리고’로, בְּנֵי를 직접적인 친족 관계인 ‘아들들’로 옮겼습니다. 이 절은 세 남성 이름을 바로 열거하므로 ‘자손들’보다 더 구체적인 표현이 적합합니다.
- source_word: יִצְהָר
  english_pob_choice: Izhar
  chosen_korean: 이사갈
  alternatives_korean:
  - 이지하르
  - 이즈하르
  lexicon: 고유명사 음역
  rationale: 인명은 음역이 원칙이므로 한국어 표기 관습에 따라 옮겼습니다. 이 절에서는 통용성보다 원형 인식이 중요한 만큼, 생소한 철자형보다 표준적인 음역을 택했습니다.
- source_word: קֹרַח
  english_pob_choice: Korah
  chosen_korean: 고라
  alternatives_korean:
  - 코라
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 기존 성경 한국어 관습을 우선하여 음역했습니다. 문맥상 인명 식별이 중요하므로 설명적 번역은 피했습니다.
- source_word: וָ/נֶפֶג
  english_pob_choice: and Nepheg
  chosen_korean: 네벡
  alternatives_korean:
  - 네펙
  - 나벡
  lexicon: 고유명사 음역
  rationale: 접속사 ו는 앞의 계보 목록에서 전체를 이미 ‘그리고’로 시작했으므로 한국어에서는 중복을 피하고, 이름 자체는 표준 음역으로 옮겼습니다.
- source_word: וְ/זִכְרִי
  english_pob_choice: and Zichri
  chosen_korean: 지그리
  alternatives_korean:
  - 직리
  - 지크리
  lexicon: 고유명사 음역
  rationale: 마지막 이름도 음역으로 처리하여 앞의 계보 열거와 일관성을 유지했습니다. 한국어 독자가 인명으로 즉시 인식할 수 있는 형태를 우선했습니다.
theological_decisions:
- issue: 계보식 나열의 서술 방식
  chosen_reading: 원문의 목록 구조를 따라 단순한 계보 진술로 처리했습니다.
  alternative_readings:
  - 설명적인 후손 소개 문구로 풀어 쓰는 방식
  - 문장 성분을 더 자연스럽게 재배열하는 방식
  rationale: 이 절은 신학적 해설보다 족보 항목의 정확한 전달이 핵심이므로, 원문의 간결한 목록성을 유지하는 편이 본문의 기능에 더 충실합니다.
  doctrine_reference: 성경 족보의 역사적·문헌적 기능
- issue: 이사갈의 음역
  chosen_reading: יִצְהָר를 ‘이사갈’로 음역했습니다.
  alternative_readings:
  - ‘이지하르’처럼 원음에 더 가까운 표기
  - ‘이즈하르’처럼 영어식 표기에 가까운 표기
  rationale: 표준 한국어 성경의 고유명사 관습을 우선해 독자가 본문 내 다른 족보 항목들과 연결해 읽을 수 있도록 했습니다. 본문 뜻을 해치지 않는 범위에서 통용성을 반영한 선택입니다.
  doctrine_reference: 고유명사 번역 관행
