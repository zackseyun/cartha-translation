translation:
  language: ko
  text: 다음은 그들의 조상 집안의 우두머리들입니다. 이스라엘의 맏아들인 르우벤의 아들들은 하녹, 발루, 헤스론, 갈미입니다. 이것이 르우벤의 종족들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה רָאשֵׁי בֵית אֲבֹתָם
  english_pob_choice: These are the heads of their fathers’ houses
  chosen_korean: 이것은 그들의 조상 가문의 우두머리들입니다
  alternatives_korean:
  - 이것은 그들의 조상 집안의 우두머리들입니다
  - 이것은 그들의 아버지들의 집의 우두머리들입니다
  lexicon: HALOT
  rationale: 족보 문맥의 관용구를 살리면서도 한국어로 자연스럽게 옮기기 위해 ‘조상 가문’으로 풀었고, רָאשֵׁי의 비유적 의미는 ‘우두머리들’로 보존했습니다.
- source_word: בְּנֵי רְאוּבֵן בְּכֹר יִשְׂרָאֵל
  english_pob_choice: the sons of Reuben, the firstborn of Israel
  chosen_korean: 이스라엘의 맏아들인 르우벤의 아들들
  alternatives_korean:
  - 이스라엘의 첫째인 르우벤의 아들들
  - 이스라엘의 장자인 르우벤의 아들들
  lexicon: HALOT
  rationale: בְּכֹר는 족보적 칭호로서 ‘맏아들’이 가장 직접적이며, 설명적 동격 구조를 한국어 어순에 맞게 정리했습니다.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  english_pob_choice: Hanoch and Pallu, Hezron and Carmi
  chosen_korean: 하녹, 발루, 헤스론, 그리고 갈미
  alternatives_korean:
  - 한녹, 팔루, 헤스론, 그리고 갈미
  - 하녹과 발루, 헤스론과 갈미
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, POB의 표준 형식을 따라 군더더기 없이 나열했습니다.
- source_word: מִשְׁפְּחֹת
  english_pob_choice: clans
  chosen_korean: 종족들
  alternatives_korean:
  - 씨족들
  - 가문들
  lexicon: HALOT
  rationale: 족보·부족 문맥에서 מִשְׁפָּחָה는 단순한 ‘가족’보다 더 큰 친족 단위를 가리키므로, ‘종족들’이 POB의 ‘clans’를 가장 무리 없이 반영합니다.
