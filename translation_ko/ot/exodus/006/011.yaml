  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
  footnotes:
  - marker: a
    text: Or “the Israelites” or “the children of Israel.” The Hebrew reads literally “the sons of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 파라오, 곧 이집트 왕에게 말하여, 이스라엘 자손을 그의 땅에서 내보내게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “이스라엘의 아들들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 가라
  - 오십시오
  lexicon: HALOT
  rationale: 모세가 현재 위치에서 바로 파라오에게로 향하라는 명령이므로, 한국어에서는 자연스러운 이동 명령인 “가서”가 적절합니다.
- source_word: דַבֵּר
  english_pob_choice: speak
  chosen_korean: 말하여
  alternatives_korean:
  - 말하십시오
  - 전하여
  lexicon: HALOT
  rationale: 파라오에게 직접 말하라는 뜻을 살리기 위해, 구어적이되 문어체에 맞는 “말하여”로 옮겼습니다.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  english_pob_choice: Pharaoh king of Egypt
  chosen_korean: 파라오, 곧 이집트 왕
  alternatives_korean:
  - 파라오, 이집트 왕
  - 애굽 왕 파라오
  lexicon: HALOT
  rationale: 히브리어의 병렬적 칭호를 살리면서도 한국어 어순에 맞게 동격 설명으로 풀었습니다. “이집트”는 현대 표준어를 따랐습니다.
- source_word: וִישַׁלַּח
  english_pob_choice: that he may let ... go out
  chosen_korean: 내보내게 하십시오
  alternatives_korean:
  - 보내게 하십시오
  - 놓아주게 하십시오
  lexicon: HALOT
  rationale: שׁלח의 결과적 용법을 단순 미래로 두지 않고, 출애굽 맥락에 맞는 해방/석방의 뜻으로 “내보내게 하십시오”라고 옮겼습니다.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현인 “sons of Israel”을 유지하되, 한국어 성서 문맥에서 널리 통용되는 “이스라엘 자손”을 사용했습니다.
theological_decisions:
- issue: 출애굽 명령의 목적 절 표현
  chosen_reading: 파라오가 이스라엘을 해방하도록 모세가 말하라는 결과적 명령으로 이해했습니다.
  alternative_readings:
  - 단순한 전달 명령으로만 읽는 해석
  - 미래 예언문으로 읽는 해석
  rationale: 히브리어의 접속된 동사형은 단순한 예고보다 모세의 발화 목적과 결과를 드러내므로, 한국어에서는 명령의 목적을 드러내는 형태로 번역했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy
