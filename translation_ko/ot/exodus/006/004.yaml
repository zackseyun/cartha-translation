  to: 나는 또한 그들에게 가나안 땅, 곧 그들이 나그네로 거류하던 땅을 주기 위해 그들과 내 언약을 세웠습니다.[a]
  rationale: 목적을 나타내는 ‘주기 위해’를 회복하여 원문의 시제·상과 논리 관계를 보존했습니다. 가나안 땅과 족장들의 거류의 땅이 동격임을 명확히 했고, גור/מָגוּר의 반복과 이방 체류의 의미는 본문 및 각주에서 유지했습니다.
