    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: I also
  chosen_korean: 나도
  alternatives_korean:
  - 또한
  - 그리고 나도
  lexicon: HALOT
  rationale: 추가 연결의 힘을 자연스럽게 살리면서, 앞절의 자기계시와 이어지는 화자의 강조를 간결하게 표현합니다.
- source_word: הֲקִמֹתִי אֶת בְּרִיתִי
  english_pob_choice: established my covenant
  chosen_korean: 내 언약을 세워
  alternatives_korean:
  - 내 언약을 확립하여
  - 내 언약을 확인하여
  - 내 언약을 굳게 세워
  lexicon: HALOT
  rationale: קום + ברית의 관용구를 한국어에서 언약을 ‘세우다’로 옮겨, 하나님의 언약적 확정을 드러내면서도 과도하게 해석하지 않게 했습니다.
- source_word: אֶרֶץ מְגֻרֵיהֶם / אֲשֶׁר גָּרוּ בָהּ
  english_pob_choice: the land where they lived as sojourners
  chosen_korean: 그들이 거류하던 땅, 곧 그들이 나그네로 지내던 땅
  alternatives_korean:
  - 그들의 거류의 땅, 곧 그들이 거류하던 땅
  - 그들이 소journ하던 땅
  lexicon: HALOT
  rationale: מָגוּר/גור의 ‘외국인으로 거주하다, 거류하다’ 의미를 살리기 위해 ‘거류하다’와 ‘나그네로 지내다’를 병기해, 단순한 거주가 아니라 이방 체류 상태를 드러냈습니다.
theological_decisions:
- issue: 언약 성취의 선언 방식
  chosen_reading: ‘내 언약을 세워… 주었습니다’로 하나님의 주도적 언약 성취를 현재의 구원 역사 진술로 옮겼습니다.
  alternative_readings:
  - ‘내 언약을 확인했습니다’
  - ‘내 언약을 확증했습니다’
  rationale: 본문은 족장들과 맺은 언약을 하나님이 이미 확립하셨다는 선언이므로, 완료된 언약 행위를 분명히 드러내되 후대 신학 용어를 덧씌우지 않았습니다.
  doctrine_reference: 언약 신학 / 출애굽 서사 내 하나님의 신실하심
