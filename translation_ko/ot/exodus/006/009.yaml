- from: 그래서 모세가 이스라엘 자손에게 이렇게 말했지만, 그들은 낙심과 가혹한 노역 때문에 모세의 말을 듣지 않았습니다.[a][b]
  to: 그러나 모세는 이스라엘 자손에게 이와 같이 말하였으나, 그들은 낙심[a]과 가혹한 노역[b] 때문에 모세의 말을 듣지 않았습니다.
  rationale: 원문의 서술 연결과 대조를 한국어에서 자연스럽게 나타내기 위해 문두를 ‘그러나’로 고치고, כֵּן을 ‘이와 같이’로 명시했습니다. 원문에 충실한 기존 핵심 어휘인 ‘낙심’과 ‘가혹한 노역’은 유지했습니다. 또한 각주를 해당 어구에 직접 연결하고, b 각주를 영어 POB 감사 추적과 일치하는 어휘 대안으로 바로잡았습니다.
