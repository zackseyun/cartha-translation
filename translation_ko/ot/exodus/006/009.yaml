  - 낙담
  - 기운이 꺾임
  lexicon: HALOT
  rationale: 직역하면 ‘영의 짧음’이지만 한국어로는 idiom의 의미를 드러내는 ‘낙심’이 가장 간결하고, POB의 의미 지향과도 맞습니다.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  english_pob_choice: harsh slavery
  chosen_korean: 가혹한 노역
  alternatives_korean:
  - 가혹한 노예살이
  - 심한 노역
  - 혹독한 강제노동
  lexicon: HALOT
  rationale: עֲבֹדָה는 넓게는 ‘노동/봉사’지만 여기서는 이집트의 강제적 착취 상황을 가리키므로, 한국어 본문에서는 과도하게 해석을 덧붙이지 않는 ‘가혹한 노역’으로 옮겼습니다.
