translation:
  language: ko
  text: 그러나 모세는 이스라엘 자손에게 이와 같이 말하였으나, 그들은 낙심[a]과 가혹한 노역[b] 때문에 모세의 말을 듣지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘영이 짧음’입니다. 이 표현은 ‘낙심’ 또는 ‘기운이 꺾임’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘혹독한 노동’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר מֹשֶׁה כֵּן
  english_pob_choice: So Moses spoke thus
  chosen_korean: 그래서 모세가 … 이렇게 말했습니다
  alternatives_korean:
  - 이렇게 말했습니다
