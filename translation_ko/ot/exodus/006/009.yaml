  rationale: דבר의 서술은 현대 한국어에서 ‘말하다’로 자연스럽게 풀고, כֵּן은 ‘이렇게’로 받아 바로 앞의 내용에 지시되는 뉘앙스를 살렸습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
