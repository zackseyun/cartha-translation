base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
  footnotes:
  - marker: a
    text: Literally, 'from shortness of spirit.' The phrase can also be rendered 'because of discouragement.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and hard labor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 모세가 이스라엘 자손에게 이렇게 말했지만, 그들은 낙심과 가혹한 노역 때문에 모세의 말을 듣지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘영의 짧음’이며, 여기서는 ‘낙심’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가혹한 노역’은 문맥상 이집트의 강제적 억압을 드러내는 번역입니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיְדַבֵּר מֹשֶׁה כֵּן
  english_pob_choice: So Moses spoke thus
  chosen_korean: 그래서 모세가 … 이렇게 말했습니다
  alternatives_korean:
  - 이렇게 말했습니다
  - 그리 말했습니다
  - 말했습니다
  lexicon: HALOT
  rationale: דבר의 서술은 현대 한국어에서 ‘말하다’로 자연스럽게 풀고, כֵּן은 ‘이렇게’로 받아 바로 앞의 내용에 지시되는 뉘앙스를 살렸습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 형식적 남성 복합구를 유지하면서도 한국어 성경에서 널리 통용되는 직역형인 ‘이스라엘 자손’을 택했습니다.
- source_word: מִקֹּצֶר רוּחַ
  english_pob_choice: because of discouragement
  chosen_korean: 낙심
  alternatives_korean:
  - 영의 짧음
  - 낙담
  - 기운이 꺾임
  lexicon: HALOT
  rationale: 직역하면 ‘영의 짧음’이지만 한국어로는 idiom의 의미를 드러내는 ‘낙심’이 가장 간결하고, POB의 의미 지향과도 맞습니다.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  english_pob_choice: harsh slavery
  chosen_korean: 가혹한 노역
  alternatives_korean:
  - 가혹한 노예살이
  - 심한 노역
  - 혹독한 강제노동
  lexicon: HALOT
  rationale: עֲבֹדָה는 넓게는 ‘노동/봉사’지만 여기서는 이집트의 강제적 착취 상황을 가리키므로, 한국어 본문에서는 과도하게 해석을 덧붙이지 않는 ‘가혹한 노역’으로 옮겼습니다.
theological_decisions:
- issue: עֲבֹדָה קָשָׁה의 사회적 강제성 표현
  chosen_reading: 가혹한 노역
  alternative_readings:
  - 가혹한 노예살이
  - 혹독한 강제노동
  rationale: 문맥상 억압적 상태가 분명하지만, 본절 자체는 ‘노예’라는 명사를 직접 쓰지 않으므로 원문이 명시한 범위를 넘지 않으면서도 압박감을 드러내는 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy over translation tradition)
