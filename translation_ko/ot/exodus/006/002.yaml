  - ‘나는 여호와입니다’
  rationale: 본문은 모세에게 주어지는 언약적 자기계시에서 신명기를 직접 사용하므로, 칭호로 완곡하게 바꾸지 않고 고유한 이름을 드러내는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
