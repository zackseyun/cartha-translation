base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'to the sons of Israel and to Pharaoh king of Egypt.' The Hebrew preposition can be taken as marking the recipients of the command, but in context it likely means the command given to Moses and Aaron concerned both Israel and Pharaoh.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the sons of Israel'; also rendered 'the Israelites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세와 아론에게 말씀하시고, 이스라엘 자손과 이집트 왕 바로에 관하여 그들에게 명령하셨습니다. 곧 이스라엘 자손을 이집트 땅에서 이끌어 내기 위해서였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 전치사구는 여기서 명령의 직접 수신자라기보다, 그 명령이 이스라엘 자손과 바로에 관련된 것임을 나타낼 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 항목은 하나님의 이름을 가리키므로, 프로젝트 기본값에 따라 한국어에서도 음역인 ‘야훼’를 사용해 고유명사성을 보존했습니다.
- source_word: וַיְדַבֵּר ... אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  english_pob_choice: Then Yahweh spoke to Moses and to Aaron
  chosen_korean: 야훼께서 모세와 아론에게 말씀하시고
  alternatives_korean:
  - 야훼께서 모세와 아론에게 말하셨습니다
  - 야훼께서 모세와 아론에게 이르셨습니다
  lexicon: HALOT
  rationale: דבר는 단순 발화보다 권위 있는 말씀을 가리킬 수 있어, 한국어에서는 격식을 유지하는 ‘말씀하시고’로 옮겨 서사 진행과 동작의 연결을 살렸습니다.
- source_word: וַיְצַוֵּם אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה מֶלֶךְ מִצְרָיִם
  english_pob_choice: and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt
  chosen_korean: 이스라엘 자손과 이집트 왕 바로에 관하여 그들에게 명령하셨습니다
  alternatives_korean:
  - 이스라엘 자손과 이집트 왕 바로에게 명령하셨습니다
  - 이스라엘 자손과 이집트 왕 바로를 두고 그들에게 명령하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 אֶל은 여기서 모세와 아론에게 주어진 명령의 대상 범위를 가리키므로, 영어 POB의 ‘concerning’을 따라 ‘에 관하여’로 처리해 수신자 혼동을 피했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 직역적으로는 ‘sons of Israel’이지만 한국어에서는 통용되는 성경식 표현인 ‘이스라엘 자손’이 원문의 친족·민족 표지를 비교적 정확히 보존합니다.
theological_decisions:
- issue: וַיְצַוֵּם의 명령 방향과 범위
  chosen_reading: 모세와 아론이 명령을 받았고, 그 명령은 이스라엘 자손과 바로에 관한 것이었습니다.
  alternative_readings:
  - 이스라엘 자손과 바로가 직접 명령을 받았습니다
  - 모세와 아론이 이스라엘 자손과 바로에게 명령했습니다
  rationale: 문맥상 명령의 직접 수신자는 모세와 아론이며, 뒤따르는 אֶל 구문은 명령의 적용 대상/주제를 나타냅니다. 이를 그대로 반영해야 본문의 문법적 긴장이 유지됩니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §2: Preserve source syntax where it carries meaning'
