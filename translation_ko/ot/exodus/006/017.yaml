  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 여기서 단순한 핵가족보다 더 큰 혈연 집단을 가리키므로, POB의 ‘clans’에 맞춰 ‘종족들’로 옮기되 관계를 드러내는 표현을 사용했습니다.
