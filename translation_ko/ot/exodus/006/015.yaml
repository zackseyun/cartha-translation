translation:
  language: ko
  text: 시므온의 아들들은 여무엘, 야민, 오핫, 야긴, 소할, 그리고 가나안 여인의 아들 사울이었습니다. 이들은 시므온의 씨족들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 시므온의 아들들은
  alternatives_korean:
  - 그리고 시므온의 아들들은
  - 시므온의 자녀들은
  lexicon: HALOT
  rationale: 족보 목록의 문맥에서 בְּנֵי는 자연스럽게 ‘아들들’로 옮기며, 앞의 접속을 한국어 어순에 맞게 처리했습니다.
- source_word: שָׁאוּל
  english_pob_choice: Shaul
  chosen_korean: 사울
  alternatives_korean:
  - 샤울
  lexicon: HALOT
  rationale: 히브리어 음가를 따르면 ‘Shaul’이지만, 한국어 성경에서 이미 널리 굳은 이름형 ‘사울’을 유지하는 편이 독자가 인물명을 즉시 알아보기 쉽습니다.
- source_word: בֶּן הַכְּנַעֲנִית
  english_pob_choice: the son of the Canaanite woman
  chosen_korean: 가나안 여인의 아들
  alternatives_korean:
  - 가나안 사람의 아들
  - 가나안 여자의 아들
  lexicon: HALOT
  rationale: 히브리어 ההַכְּנַעֲנִית는 여성형이므로, 단순히 ‘가나안 사람’으로 일반화하지 않고 여성임을 드러냈습니다.
- source_word: מִשְׁפְּחֹת
  english_pob_choice: the clans of
  chosen_korean: 가문들
  alternatives_korean:
  - 족속들
  - 씨족들
  lexicon: HALOT
  rationale: 족보 문맥의 מִשְׁפָּחָה는 단순한 핵가족보다 큰 친족 단위를 가리키므로, 현대 한국어에서는 ‘가문들’이 가장 무리 없는 대응입니다.
