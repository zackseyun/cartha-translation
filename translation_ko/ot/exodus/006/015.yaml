  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
  footnotes:
  - marker: a
    text: Shaul is traditionally rendered 'Saul.' The Hebrew form here is שָׁאוּל (Shaul).
    reason: lexical_alternative
translation:
  language: ko
  text: 시므온의 아들들은 예무엘[a], 야민, 오핫, 야긴, 소할, 그리고 가나안 여인의 아들 사울이었습니다. 이것이 시므온의 가문들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예무엘’은 히브리어 יְמוּאֵל의 직접 음역입니다. 전통적 영어형 ‘Jemuel’에 대응하는 한국어 관행도 가능하지만, 본문은 히브리어 형태를 따랐습니다.
    reason: lexical_alternative
