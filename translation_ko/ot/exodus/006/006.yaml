reference: Exodus 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
  footnotes:
  - marker: a
    text: Or 'children of Israel' or 'Israelites.' The Hebrew reads literally 'sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'YHWH'; rendered 'the LORD' following the project's standard practice.
    reason: alternative_reading
  - marker: c
    text: Or 'from their bondage.' The Hebrew term can denote service or labor, but here refers to oppressive servitude.
    reason: lexical_alternative
  - marker: d
    text: Or 'with great acts of judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이스라엘 자손에게 말하십시오. “나는 야훼입니다. 내가 너희를 이집트의 짐 밑에서 빼내고, 그들의 노예 상태에서 너희를 건져내며, 펼친 팔과 큰 심판으로 너희를 속량하겠습니다.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어를 비교적 직역한 표현입니다. 문맥상 ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יְהוָה는 이 프로젝트의 기본 원칙에 따라 ‘야훼’로 옮깁니다.
    reason: source_note
  - marker: c
    text: ‘노예 상태’는 여기서 עֲבֹדָה가 가리키는 강제적 예속을 드러내는 번역입니다. ‘봉사’나 ‘노역’도 가능한 다른 번역입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘큰 심판’은 משפטים גדולים의 자연스러운 번역입니다. ‘큰 심판들’ 또는 ‘큰 행위들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: to the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어의 직역 가능성을 유지하면서도 한국어 성경 문맥에서 자연스럽고 투명한 표현으로 옮겼습니다. ‘자손’은 혈연·언약 공동체의 뉘앙스를 살립니다.
- source_word: יְהוָה
  english_pob_choice: I am Yahweh
  chosen_korean: 야훼입니다
  alternatives_korean:
  - 여호와입니다
  - 주님입니다
  lexicon: 프로젝트 기본 용례 / DOCTRINE.md
  rationale: 원문 고유명사를 보존하는 프로젝트 기본값을 따랐습니다. 본문 내부의 신적 자기계시를 흐리지 않도록 번역적 치환을 피했습니다.
- source_word: סִבְלֹת
  english_pob_choice: burdens
  chosen_korean: 짐
  alternatives_korean:
  - 무거운 짐
  - 부역
  - 압제
  lexicon: HALOT
  rationale: ‘from under’와 결합한 구체적 이미지가 있어, 추상화된 ‘압제’보다 물리적 부담의 감각을 살리는 ‘짐’이 원문에 가깝습니다.
- source_word: עֲבֹדָתָם
  english_pob_choice: slavery
  chosen_korean: 노예 상태
  alternatives_korean:
  - 종살이
  - 노역
  - 속박
  lexicon: HALOT
  rationale: 영어 POB가 굴종적 종속을 강하게 드러내는 ‘slavery’를 택했으므로, 그 사회적 현실을 한국어에서도 분명히 드러내기 위해 ‘노예 상태’로 옮겼습니다.
- source_word: בִּזְרֹעַ נְטוּיָה
  english_pob_choice: with an outstretched arm
  chosen_korean: 펼친 팔
  alternatives_korean:
  - 내민 팔
  - 펴신 팔
  - 편 팔
  lexicon: HALOT
  rationale: 관용구의 이미지는 유지하되 현대 한국어에서 더 자연스럽고 이해 가능한 표현을 택했습니다. ‘팔’은 하나님의 능동적 개입을 의인적으로 전달합니다.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  english_pob_choice: with great judgments
  chosen_korean: 큰 심판
  alternatives_korean:
  - 큰 판단들
  - 큰 심판들
  - 큰 재앙
  lexicon: HALOT
  rationale: ‘심판’은 משפט의 법정·재판적 의미와 출애굽 맥락의 징벌적 행위를 함께 전달합니다. 복수형을 한국어에서 자연스럽게 포괄했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 출애굽기 6:6은 언약 이름의 자기계시를 강조하므로, 전통적 대체어보다 원문 고유명사를 드러내는 번역이 신학적 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: עֲבֹדָה의 사회적 강도
  chosen_reading: 노예 상태
  alternative_readings:
  - 봉사
  - 종속
  - 속박
  rationale: 문맥상 이스라엘의 상태는 중립적 노동이 아니라 강제된 예속이므로, 그 억압성을 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
