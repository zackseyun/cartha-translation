  naturalness: 현대 표준 한국어 합쇼체에는 ‘모세가 야훼 앞에서 이렇게 말했습니다’와 ‘바로가 어찌 내 말을 듣겠습니까?’가 자연스럽습니다. ‘이스라엘 자손도’의 보조사 ‘도’는 원문에 없는 강조를 더할 수 있어 단순 주격으로 수정했습니다.
