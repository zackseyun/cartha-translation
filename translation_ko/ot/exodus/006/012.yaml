- from: 그러나 모세가 야훼 앞에서 말했습니다. 「보십시오, 이스라엘 자손도 내 말을 듣지 않았습니다. 그러니 어찌 바로가 내 말을 듣겠습니까? 나는 입이 할례받지 못했습니다.」[a][b]
  to: 그러나 모세가 야훼 앞에서 이렇게 말했습니다. 「보십시오, 이스라엘 자손이[b] 내 말을 듣지 않았습니다. 그러니 바로가 어찌 내 말을 듣겠습니까? 나는 할례받지 못한 입술을 지닌 사람입니다[a].」
  rationale: 원문의 대조적 문맥, ‘야훼 앞에서’, 이스라엘 자손과 바로가 모세의 말을 듣지 않는다는 수사적 논증을 유지했습니다. ‘할례받지 못한 입술’이라는 의도적으로 생경한 히브리어 은유는 진단명이나 단순한 말솜씨 부족으로 해석하지 않았습니다. 각주 표지는 해당 어구 바로 뒤로 옮겨 내용과의 대응을 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:25Z'
