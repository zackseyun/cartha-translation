id: EXO.6.12
reference: Exodus 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''uncircumcised in/of lips,'' an idiom expressing impeded or inadequate speech; compare Exod 4:10.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 모세가 야훼 앞에서 말했습니다. 「보십시오, 이스라엘 자손도 내 말을 듣지 않았습니다. 그러니 어찌 바로가 내 말을 듣겠습니까? 나는 입이 할례받지 못했습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘입이 할례받지 못했다’는 관용구로, 말이 막히거나 충분히 유창하지 못하다는 뜻입니다. 출애굽기 4:10과 비교하십시오.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 자손’의 다른 번역으로 ‘이스라엘 사람들’이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: But Moses spoke
  chosen_korean: 그러나 모세가 말했습니다
  alternatives_korean:
  - 그리고 모세가 말했습니다
  - 그때 모세가 말했습니다
  lexicon: HALOT
  rationale: 문맥상 앞선 하나님의 명령에 대한 모세의 반응이라는 대조가 있으므로 ‘그러나’가 적절하며, 동사는 단순한 발화를 보존하는 ‘말했습니다’로 옮겼습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼 앞에
  - 야훼의 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי의 공간적·관계적 관용구를 살려 ‘앞에서’로 옮겼고, 본문이 하나님의 이름 יְהוָה를 직접 쓰므로 ‘야훼’를 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 혈연·언약 공동체 표현을 비교적 직접적으로 반영하면서도 한국어 성경 문맥에서 자연스러운 ‘이스라엘 자손’을 택했습니다.
- source_word: לֹא שָׁמְעוּ אֵלַי
  english_pob_choice: have not listened to me
  chosen_korean: 내 말을 듣지 않았습니다
  alternatives_korean:
  - 나에게 귀 기울이지 않았습니다
  - 나를 듣지 않았습니다
  lexicon: HALOT
  rationale: שׁמע + אֶל의 ‘듣다/귀 기울이다’ 의미를 한국어 관용에 맞게 옮겼고, 여기서는 메시지 수용의 거절이므로 ‘내 말을 듣지 않았습니다’가 가장 분명합니다.
- source_word: עֲרַל שְׂפָתָיִם
  english_pob_choice: uncircumcised in lips
  chosen_korean: 입이 할례받지 못했습니다
  alternatives_korean:
  - 입술이 할례받지 못했습니다
  - 말이 서투릅니다
  lexicon: HALOT
  rationale: 히브리어의 도발적인 은유를 완화하지 않고 살리되, 한국어에서 자연스러운 표현으로 풀어 ‘입이 할례받지 못했습니다’로 옮겼습니다. ‘말이 서투릅니다’는 의미를 풀어버려 원문 은유를 지웁니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신적 칭호가 아니라 고유명사를 사용하므로, 프로젝트 기준에 따라 하나님의 이름을 ‘야훼’로 직역·전사하여 언약적 호칭을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘입이 할례받지 못했습니다’라는 자기 진술의 보존
  chosen_reading: 은유를 그대로 드러내는 직역
  alternative_readings:
  - 말이 서투릅니다
  - 말에 장애가 있습니다
  rationale: 모세의 자기 평가는 단순한 언어 능력 부족만이 아니라 부적합함/막힘의 이미지를 포함하므로, 해석으로 평탄화하지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
