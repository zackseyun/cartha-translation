lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: Then spoke
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 말씀하셨습니다
  - 또 말씀하셨습니다
  lexicon: HALOT
  rationale: 서술의 진행을 나타내는 וַ־연결과 동사 דִּבֵּר의 화행적 성격을 살려, 현대 한국어에서는 자연스럽고 격식 있는 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 관습적 대체어가 아니라 신명 표기 ‘야훼’로 옮겨, POB의 명시적 번역 원칙을 한국어로 반영했습니다.
- source_word: אֶל מֹשֶׁה
  english_pob_choice: to Moses
  chosen_korean: 모세에게
  alternatives_korean:
  - 모세를 향하여
  - 모세한테
  lexicon: HALOT
  rationale: אֶל의 방향성을 한국어 여격 조사 ‘-에게’로 자연스럽게 살렸고, 인명은 통용 표기 ‘모세’를 사용했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 「말하라」
  alternatives_korean:
  - 말하여라
  - 말씀하시며
  lexicon: HALOT
  rationale: 이 구절에서 לֵאמֹר은 뒤따르는 직접화법 도입 공식이므로, 다음 절에 이어질 명령문의 시작을 드러내기 위해 한국어 인용부호를 열어 두었습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문에는 ‘야훼’를 사용하고, 이는 하나님 고유명을 가리는 호칭 대체를 피합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 테트라그람마톤을 직접 사용하므로, 전통적 대체어보다 신명 자체를 드러내는 번역이 본문의 계시적 의미를 더 잘 보존합니다.
  doctrine_reference: 'POB terminology: יְהוָה / YHWH → 야훼'
