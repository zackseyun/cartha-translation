id: EXO.6.8
reference: Exodus 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
  footnotes:
  - marker: a
    text: Or, 'that I swore to give.' The Hebrew literally says, 'that I raised my hand to give,' an oath-taking idiom.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를, 내가 아브라함과 이삭과 야곱에게 주겠다고 손을 들어[a] 맹세한 그 땅으로 인도하여, 그것을 너희에게 유업으로 주겠습니다. 나는 야훼입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘내가 그 땅을 주겠다고 내 손을 들었다’입니다. 손을 드는 것은 맹세를 나타내는 관용적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: וְהֵבֵאתִי
  english_pob_choice: And I will bring
  chosen_korean: 내가 너희를 … 인도하고
  alternatives_korean:
  - 내가 너희를 … 데려오고
  - 내가 너희를 … 끌고 가고
  lexicon: HALOT
  rationale: הביא의 사역적 의미를 살리면서, 약속의 땅으로 이끄는 문맥에서는 ‘인도하다’가 자연스럽고 합쇼체 문체에도 잘 맞습니다.
- source_word: אֶת יָדִי לָתֵת
  english_pob_choice: that I raised my hand to give
  chosen_korean: 내 손을 들어 맹세한
  alternatives_korean:
  - 내 손을 들어 주기로 한
  - 맹세하여 주기로 한
  lexicon: HALOT
  rationale: 직역하면 ‘손을 들어’이지만, 여기서는 서원/맹세 관용구이므로 한국어에서도 관용을 드러내되 원문의 이미지가 보이도록 ‘내 손을 들어 맹세한’으로 옮겼습니다.
- source_word: מוֹרָשָׁה
  english_pob_choice: as a possession
  chosen_korean: 유업으로
  alternatives_korean:
  - 소유로
  - 소유 재산으로
  - 기업으로
  lexicon: HALOT
  rationale: מוֹרָשָׁה는 단순 소유보다 상속에 따른 정당한 점유를 가리키므로, 한국어에서 그 법적·언약적 뉘앙스를 가장 잘 살리는 ‘유업’이 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'Contested terms: יהוה YHWH'
  rationale: 프로젝트 기본어휘에 따라 신명은 ‘야훼’로 옮기며, 본문 마지막의 자기선언도 언약적 이름을 그대로 드러내도록 했습니다.
theological_decisions:
- issue: 출 6:8의 서원 관용구를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘내 손을 들어 맹세한’으로 관용구를 살리되, 약속의 땅을 주시겠다는 언약 행위로 읽히게 했습니다.
  alternative_readings:
  - ‘내가 맹세한’
  - ‘내가 손을 들어 약속한’
  rationale: 본문의 핵심은 단순한 의지가 아니라 언약적 서원입니다. 한국어에서도 맹세의 행위를 분명히 보여 주되, 과도하게 평탄화하지 않는 것이 원문 의미에 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: יהוה의 종결 자기선언
  chosen_reading: ‘나는 야훼입니다’
  alternative_readings:
  - ‘나는 주님입니다’
  - ‘나는 여호와입니다’
  rationale: 본문은 약속의 신뢰성을 보증하는 언약 სახელ(이름) 선언이므로, 본문 안에서 고유한 신명 ‘야훼’를 유지하는 것이 적절합니다.
  doctrine_reference: 'Contested terms: יהוה YHWH'
