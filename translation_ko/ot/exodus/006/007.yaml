  - 여호와 너희 하나님
  lexicon: HALOT
  rationale: 본문의 신명은 관례적 대체어를 피하고 ‘야훼’로 음역했으며, 소유격 관계는 한국어 어순에 맞춰 간결하게 처리했습니다.
- source_word: הַמּוֹצִיא אֶתְכֶם
  english_pob_choice: who brought you out
  chosen_korean: 나는 너희를 … 끌어내는 자입니다
  alternatives_korean:
