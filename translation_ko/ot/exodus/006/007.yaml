base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
  footnotes:
  - marker: a
    text: Or 'who brought you out'; the Hebrew uses a participle, which can emphasize either ongoing/characteristic action or the act viewed as defining the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'from under the forced labor of Egypt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 내 백성이 되게 하고, 나는 너희의 하나님이 되며, 너희는 내가 야훼 너희 하나님인 줄 알게 될 것입니다. 나는 너희를 이집트의 짐 아래에서 끌어내는 자입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너희를 끌어낸 자’로 볼 수 있습니다. 히브리어 분사는 지속적·특징적 행동 또는 그 행동 자체를 규정적인 것으로 볼 수 있게 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이집트의 강제 노역 아래에서’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  english_pob_choice: I will take you to be my people
  chosen_korean: 내가 너희를 내 백성이 되게 하고
  alternatives_korean:
  - 내가 너희를 내 백성으로 삼고
  - 내가 너희를 나를 위한 백성으로 받아들이고
  lexicon: HALOT
  rationale: 취하는 동작이 언약적 소속 형성을 뜻하므로, 한국어에서는 결과 상태를 드러내는 ‘되게 하다’로 옮겨 관계와 소속을 함께 살렸습니다.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  english_pob_choice: I will be your God
  chosen_korean: 나는 너희의 하나님이 되며
  alternatives_korean:
  - 나는 너희를 위한 하나님이 되며
  - 나는 너희에게 하나님이 되며
  lexicon: HALOT
  rationale: 히브리어의 전형적인 언약 공식을 자연스러운 현대 한국어로 옮기기 위해 ‘너희의 하나님이 되며’로 직역에 가깝게 유지했습니다.
- source_word: יְהוָה אֱלֹהֵי/כֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 너희 하나님
  alternatives_korean:
  - 야훼 너희의 하나님
  - 여호와 너희 하나님
  lexicon: HALOT
  rationale: 본문의 신명은 관례적 대체어를 피하고 ‘야훼’로 음역했으며, 소유격 관계는 한국어 어순에 맞춰 간결하게 처리했습니다.
- source_word: הַמּוֹצִיא אֶתְכֶם
  english_pob_choice: who brought you out
  chosen_korean: 나는 너희를 … 끌어내는 자입니다
  alternatives_korean:
  - 나는 너희를 … 끌어내신 분입니다
  - 나는 너희를 … 끌어내는 이입니다
  lexicon: HALOT
  rationale: 분사 הַמּוֹצִיא의 지속적/특징적 뉘앙스를 살리기 위해 완료형보다 현재적 표현을 택했으며, 출애굽의 구출 이미지는 ‘끌어내다’가 가장 직접적입니다.
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  english_pob_choice: from under the burdens of Egypt
  chosen_korean: 이집트의 짐 아래에서
  alternatives_korean:
  - 이집트의 부담 아래에서
  - 이집트의 강제 노역 아래에서
  lexicon: HALOT
  rationale: סִבְלֹת은 문자적 ‘짐’과 압제적 부담을 함께 담으므로, 본문 이미지에 맞는 ‘짐 아래’로 옮기고, 해석을 과도하게 좁히는 ‘강제 노역’은 본문 밖 의미가 강하므로 본문 주석으로만 남겼습니다.
theological_decisions:
- issue: 언약 공식의 한국어 재현
  chosen_reading: ‘내가 너희를 내 백성이 되게 하고, 나는 너희의 하나님이 되며’로 언약적 상호 관계를 보존했습니다.
  alternative_readings:
  - ‘내가 너희를 내 백성으로 삼고, 나는 너희에게 하나님이 되며’
  - ‘내가 너희를 나의 백성으로 받아들이고…’
  rationale: 이 구절은 단순 소유가 아니라 출애굽-언약 관계의 확립을 말하므로, 한국어도 관계성과 소속을 동시에 들리게 해야 합니다.
  doctrine_reference: 출애굽기 6:7의 언약 공식; 번역 원칙 §§1, 3, 6
- issue: 신명 표기
  chosen_reading: יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문은 하나님의 고유한 언약 이름을 직접 사용하므로, 제목형 대체어보다 고유명 표기를 유지하는 것이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
