  rationale: 분사 הַמּוֹצִיא의 지속적/특징적 뉘앙스를 살리기 위해 완료형보다 현재적 표현을 택했으며, 출애굽의 구출 이미지는 ‘끌어내다’가 가장 직접적입니다.
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  english_pob_choice: from under the burdens of Egypt
  chosen_korean: 이집트의 짐 아래에서
  alternatives_korean:
  - 이집트의 부담 아래에서
  - 이집트의 강제 노역 아래에서
  lexicon: HALOT
  rationale: סִבְלֹת은 문자적 ‘짐’과 압제적 부담을 함께 담으므로, 본문 이미지에 맞는 ‘짐 아래’로 옮기고, 해석을 과도하게 좁히는 ‘강제 노역’은 본문 밖 의미가 강하므로 본문 주석으로만 남겼습니다.
theological_decisions:
- issue: 언약 공식의 한국어 재현
  chosen_reading: ‘내가 너희를 내 백성이 되게 하고, 나는 너희의 하나님이 되며’로 언약적 상호 관계를 보존했습니다.
  alternative_readings:
  - ‘내가 너희를 내 백성으로 삼고, 나는 너희에게 하나님이 되며’
  - ‘내가 너희를 나의 백성으로 받아들이고…’
  rationale: 이 구절은 단순 소유가 아니라 출애굽-언약 관계의 확립을 말하므로, 한국어도 관계성과 소속을 동시에 들리게 해야 합니다.
  doctrine_reference: 출애굽기 6:7의 언약 공식; 번역 원칙 §§1, 3, 6
- issue: 신명 표기
  chosen_reading: יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문은 하나님의 고유한 언약 이름을 직접 사용하므로, 제목형 대체어보다 고유명 표기를 유지하는 것이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
