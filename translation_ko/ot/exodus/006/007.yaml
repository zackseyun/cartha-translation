  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
  footnotes:
  - marker: a
    text: Or 'who brought you out'; the Hebrew uses a participle, which can emphasize either ongoing/characteristic action or the act viewed as defining the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'from under the forced labor of Egypt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 나의 백성으로 삼고, 내가 너희의 하나님이 되며, 너희는 내가 너희를 이집트의 짐[b] 아래에서 끌어내는[a] 야훼, 곧 너희의 하나님인 줄 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끌어내신’으로 옮길 수 있습니다. 히브리어는 분사를 사용하며, 이는 지속적·특징적 행동을 나타낼 수도 있고, 야훼를 규정하는 구원 행위를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이집트의 강제 노역 아래에서’로 옮길 수 있습니다.
    reason: lexical_alternative
