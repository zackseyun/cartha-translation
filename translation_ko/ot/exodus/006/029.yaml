translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “나는 야훼입니다. 애굽의 왕 바로에게 내가 너에게 말하는 모든 것[a]을 말하라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 너에게 말하고 있는 모든 것”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명 표기를 제목어로 바꾸지 않고 고유명으로 드러내기 위해 야훼를 사용했습니다.
- source_word: וַיְדַבֵּר
  english_pob_choice: Then ... spoke
  chosen_korean: 그때 ... 말씀하셨습니다
  alternatives_korean:
  - 그리고 ... 말씀하셨습니다
  - 이어서 ... 말씀하셨습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 전진을 한국어 자연스러운 이야기 흐름으로 옮기되, דבר의 엄숙한 어감을 살려 말씀하셨습니다를 택했습니다.
- source_word: דַּבֵּר
  english_pob_choice: Speak
  chosen_korean: 말하라
  alternatives_korean:
  - 말하십시오
  - 전하라
  lexicon: HALOT
  rationale: 모세에게 주어진 직접 명령으로서 간결한 명령형 말하라가 מקור의 명령성을 가장 직접적으로 드러냅니다.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  english_pob_choice: Pharaoh king of Egypt
  chosen_korean: 애굽의 왕 바로
  alternatives_korean:
  - 애굽 왕 바로
  - 바로, 애굽의 왕
  lexicon: HALOT
  rationale: 히브리어의 동격 구조를 살리면서도 한국어에서는 관형식으로 자연스럽게 읽히도록 애굽의 왕 바로로 옮겼습니다.
theological_decisions:
- issue: יהוה의 자칭 선언("אֲנִי יְהוָה") 번역
  chosen_reading: '"나는 야훼입니다."'
  alternative_readings:
  - '"나는 주입니다."'
  - '"나는 여호와입니다."'
  rationale: 출애굽기의 반복되는 자기계시를 이름 자체로 보존해야 하므로, 호칭으로 완화하지 않고 직접적인 자칭 선언으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
