  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לִ/פְנֵ֣י יְהוָ֑ה הֵ֤ן אֲנִי֙ עֲרַ֣ל שְׂפָתַ֔יִם וְ/אֵ֕יךְ יִשְׁמַ֥ע אֵלַ֖/י פַּרְעֹֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: ko
  text: 모세가 야훼 앞에서 말했습니다. 「보십시오, 저는 입술이 할례받지 못한 사람입니다. 그런데 바로가 어째서 제 말을 듣겠습니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before the LORD
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 여호와 앞에서
  lexicon: יהוה
  rationale: 원문은 하나님의 이름 יהוה를 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮기고 ‘앞에서’로 관계를 자연스럽게 살렸습니다.
- source_word: הֵן
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오요
  - 이보십시오
  lexicon: הֵן
  rationale: הֵן의 주의를 끄는 용법을 현대 한국어의 공손한 환기 표현으로 옮겼습니다. 화자 모세의 직접 발화이지만, 하나님께 드리는 진술이므로 합쇼체를 유지했습니다.
- source_word: עֲרַל שְׂפָתַיִם
  english_pob_choice: uncircumcised of lips
  chosen_korean: 입술이 할례받지 못한 사람입니다
  alternatives_korean:
  - 입술에 할례를 받지 못했습니다
  - 입술이 무할례입니다
  - 말이 서툰 사람입니다
  lexicon: ערל + שְׂפָתַיִם
  rationale: 직역의 충격과 비유적 긴장을 유지하면서도 한국어에서 문법적으로 자연스럽게 들리도록 ‘사람입니다’ 구조로 풀었습니다. ‘말이 서툰’은 의미를 완화하므로 배제했습니다.
- source_word: פַּרְעֹה יִשְׁמַע
  english_pob_choice: Pharaoh listen to me
  chosen_korean: 바로가 어째서 제 말을 듣겠습니까
  alternatives_korean:
  - 바로가 어떻게 제 말을 듣겠습니까
  - 바로가 제 말을 들을 리가 있겠습니까
  lexicon: שׁמע
  rationale: שׁמע의 핵심인 ‘듣다/경청하다’를 살리되, 모세의 반문을 한국어 자연문으로 옮겼습니다. 본문의 불신과 의문을 유지하기 위해 반문형을 택했습니다.
theological_decisions:
- issue: “uncircumcised of lips”의 직설적 비유를 얼마나 완화할지
  chosen_reading: 비유를 완화하지 않고 그대로 드러내되, 한국어 문장성은 확보했습니다.
  alternative_readings:
  - ‘말이 서툰 사람’처럼 의미를 풀어 설명하는 번역
  - ‘입술이 무할례입니다’처럼 더 직역적인 표현
  rationale: 본문은 모세의 자기비하와 소명 거절의 긴장을 담고 있으므로, 관용적 완화보다 원문의 낯섦을 보존하는 편이 독자 이해에 더 충실합니다.
  doctrine_reference: 소명 서사에서 인간의 무능과 하나님의 명령 사이의 긴장
