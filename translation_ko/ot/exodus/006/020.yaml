  - 그녀는 그를 위해 ...를 낳았습니다
  lexicon: HALOT
  rationale: 족보 서술의 간결성과 현대 한국어의 자연스러움을 함께 살리기 위해 직설적으로 옮겼습니다.
- source_word: שְׁנֵי חַיֵּי
  english_pob_choice: The years of ... life
  chosen_korean: 생애는
  alternatives_korean:
