base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
  footnotes:
  - marker: a
    text: Or more specifically, 'his father’s sister,' if the kinship term is taken in its narrower sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 암람은 자기 아버지의 누이 요게벳을 아내로 맞이하였고, 그녀는 그에게 아론과 모세를 낳았습니다. 암람의 생애는 137년이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 아내로 맞이하였고
  alternatives_korean:
  - 아내로 취하였고
  - 데려다가 아내로 삼았고
  lexicon: HALOT
  rationale: 히브리어 לָקַח의 결혼 관용구를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
- source_word: דֹּדָתוֹ
  english_pob_choice: his father’s sister
  chosen_korean: 자기 아버지의 누이
  alternatives_korean:
  - 자기 고모
  - 자기 이모
  lexicon: HALOT
  rationale: 족보 문맥에서 관계를 더 구체적으로 드러내기 위해, 문맥상 가능한 친족 의미를 그대로 풀어 옮겼습니다.
- source_word: וַתֵּלֶד לוֹ
  english_pob_choice: and she bore to him
  chosen_korean: 그녀는 그에게 ...를 낳았습니다
  alternatives_korean:
  - 그녀는 그에게 ...를 출산했습니다
  - 그녀는 그를 위해 ...를 낳았습니다
  lexicon: HALOT
  rationale: 족보 서술의 간결성과 현대 한국어의 자연스러움을 함께 살리기 위해 직설적으로 옮겼습니다.
- source_word: שְׁנֵי חַיֵּי
  english_pob_choice: The years of ... life
  chosen_korean: 생애는
  alternatives_korean:
  - 삶의 햇수는
  - 살아온 햇수는
  lexicon: HALOT
  rationale: 히브리어의 생애-총합 표현을 한국어의 일반적인 전기적 문체로 옮겼습니다.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  english_pob_choice: 137 years
  chosen_korean: 137년
  alternatives_korean:
  - 백서른일곱 해
  - 137세
  lexicon: HALOT
  rationale: 히브리어 수량 표현의 의미를 정확히 보존하면서 현대적 가독성을 우선했습니다.
theological_decisions:
- issue: 요게벳의 친족관계 표지
  chosen_reading: ‘자기 아버지의 누이’로 구체화하여, 본문이 암시하는 근친 관계를 완화하지 않고 드러냈습니다.
  alternative_readings:
  - ‘고모’로 간단히 옮김
  - ‘이모’로 일반화함
  rationale: 본문은 족보 정보만 제시하며 윤리적 평가를 덧붙이지 않습니다. 따라서 번역도 관계의 강도를 약화하지 않고, 원문이 허용하는 범위를 분명히 보이게 해야 합니다.
  doctrine_reference: 원문 우선 원칙; 본문이 제시하는 친족 긴장을 보존
