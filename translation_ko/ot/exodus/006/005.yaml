revisions:
- from: 그리고 나도 이스라엘 자손의 신음 소리를 들었고, 이집트 사람들이 그들을 종으로 삼고 있는 것도 보았으며, 내 언약을 기억했습니다.[a][b]
  to: 나는 또한 이집트 사람들이 노예로 삼고 있는 이스라엘 자손[a]의 신음 소리를 들었고, 내 언약을 기억했습니다.[b]
  rationale: 원문에 없는 ‘보았으며’를 삭제하여 두 동사로 이루어진 히브리어 문장 구조를 회복했습니다. 이집트인의 예속 행위는 원문처럼 ‘이스라엘 자손’을 수식하도록 배열했으며, 각주 표지를 해당 어구에 직접 배치했습니다.
  reviewer_model: gpt-5.6-terra
