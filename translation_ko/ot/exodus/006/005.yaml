  source_fidelity: 본문에 없는 ‘보았으며’가 추가되어 히브리어의 동사 수와 의미를 변경합니다. 히브리어는 하나님께서 이스라엘 자손의 신음을 들으시고 언약을 기억하셨다고만 말합니다. 이를 삭제하고, 이집트인의 강제 노역 행위는 ‘이스라엘 자손’을 수식하는 관계절로 옮겼습니다.
  naturalness: 수정문은 현대 표준 한국어와 합쇼체에 맞으며, 긴 히브리어 수식 관계도 자연스럽게 처리합니다. ‘나는 또한’은 접속 및 첨가 강조와 명시된 1인칭 대명사의 강조를 무리 없이 반영합니다.
  terminology: ‘이스라엘 자손’, ‘신음 소리’, ‘언약’은 적절합니다. מַעֲבִדִים의 강제적 예속 의미는 ‘노예로 삼고 있는’으로 분명히 했고, ‘기억했습니다’는 언약적 관용을 유지합니다.
