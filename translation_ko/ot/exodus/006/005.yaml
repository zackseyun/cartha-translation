id: EXO.6.5
reference: Exodus 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the people of Israel.' The Hebrew reads literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''Remembered'' here is covenant language: not that God had forgotten, but that he is turning toward his covenant in action.'
    reason: cultural_note
translation:
  language: ko
  text: 나는 또한 이집트 사람들이 노예로 삼고 있는 이스라엘 자손[a]의 신음 소리를 들었고, 내 언약을 기억했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다. ‘이스라엘 자손’은 이 표현이 가리키는 이스라엘 공동체 전체를 한국어 성경 어법으로 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기억했습니다’는 하나님께서 잊었던 것을 다시 떠올리셨다는 뜻이라기보다, 언약에 따라 행동하실 것을 나타내는 언약적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  english_pob_choice: And I also
  chosen_korean: 그리고 나도
  alternatives_korean:
  - 나도 또한
  - 그리고 나 또한
  lexicon: HALOT
  rationale: 앞 절과 연결되는 추가 강조를 한국어로 자연스럽게 살리면서, 하나님 화자의 강조를 '나도'로 분명히 드러냈습니다.
- source_word: נַאֲקַת
  english_pob_choice: the groaning
  chosen_korean: 신음 소리
  alternatives_korean:
  - 신음
  - 탄식
  - 울부짖음
  lexicon: HALOT
  rationale: 고통 속에서 새어 나오는 신체적·정서적 비명을 함께 담는 표현으로, 문맥의 압박과 절규를 잘 반영합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어 직역을 한국어 성경어법 안에서 가장 자연스럽게 옮긴 표현으로, 집단 전체를 가리키는 남성 복수의 대표성을 보존합니다.
- source_word: מַעֲבִדִים אֹתָם
  english_pob_choice: are enslaving
  chosen_korean: 그들을 종으로 삼고 있는
  alternatives_korean:
  - 그들을 노예로 삼고 있는
  - 그들을 부역시키고 있는
  - 그들을 억압하여 부리고 있는
  lexicon: HALOT
  rationale: עבד의 사역형이 지닌 강제적 종속을 살리되, 한국어에서 현재 진행 중인 압제를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: וָאֶזְכֹּר אֶת בְּרִיתִי
  english_pob_choice: and I have remembered my covenant
  chosen_korean: 내 언약을 기억했습니다
  alternatives_korean:
  - 내 언약을 기억하셨습니다
  - 내 언약을 생각해냈습니다
  - 내 언약을 기억하여 행동하십니다
  lexicon: HALOT
  rationale: '''הremember''의 언약적 용례를 직설적으로 유지해, 하나님이 잊으셨다가 떠올리신 것이 아니라 언약을 향해 행동을 돌이키시는 의미를 보존했습니다.'
theological_decisions:
- issue: ‘기억하다’의 언약적 의미
  chosen_reading: 내 언약을 기억했습니다
  alternative_readings:
  - 내 언약을 생각해냈습니다
  - 내 언약을 기억하여 행동하십니다
  rationale: 본문은 단순한 심리적 회상이 아니라 언약에 근거한 구원 행동의 전환을 말하므로, 설명적 의역보다 성경적 관용구를 그대로 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
- issue: ‘이스라엘 자손’의 집단 지칭
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 백성
  - 이스라엘 사람들
  rationale: 히브리어의 남성 복수 표현을 유지하되, 한국어에서는 민족·언약 공동체 전체를 가리키는 표준 성경어로 읽히게 하여 대표적 집단성을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
