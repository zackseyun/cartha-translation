base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: ko
  text: 고핫의 아들은 암람, 이스할, 헤브론, 그리고 웃시엘입니다. 고핫이 산 햇수는 백삼십삼 년이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  english_pob_choice: The sons of Kohath
  chosen_korean: 고핫의 아들들
  alternatives_korean:
  - 고핫의 자손들
  - 고핫의 아들
  lexicon: HALOT
  rationale: 계보 문맥에서 בְנֵי는 직계 아들을 가리키므로, 영어 POB의 'The sons of'에 맞추어 자연스럽게 '아들들'로 옮겼습니다.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  english_pob_choice: Amram, Izhar, Hebron, and Uzziel
  chosen_korean: 암람, 이스할, 헤브론, 그리고 웃시엘
  alternatives_korean:
  - 암람, 이갈, 헤브론, 그리고 웃시엘
  - 암람, 잇사할, 헤브론, 그리고 웃시엘
  lexicon: 표준 음역 관행
  rationale: 고유명사는 현대 한국어 성경에서 통용되는 음역을 따랐습니다. עַמְרָם, חֶבְרוֹן, עֻזִּיאֵל은 기존 관용형을 우선했고, יִצְהָר는 문헌상 변이 음역이 있어 이 구절에서는 '이스할'을 택했습니다.
- source_word: וּשְׁנֵי חַיֵּי קְהָת
  english_pob_choice: And the years of Kohath’s life were
  chosen_korean: 고핫이 산 햇수는
  alternatives_korean:
  - 고핫의 생애는
  - 고핫의 생존 연수는
  lexicon: HALOT
  rationale: 히브리어 관용구 'the years of ... life'를 직역하되, 한국어에서는 계보 기록의 자연스러운 표현인 '산 햇수'로 옮겨 원문 구조를 유지했습니다.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  english_pob_choice: one hundred thirty-three years
  chosen_korean: 백삼십삼 년
  alternatives_korean:
  - 일백삼십삼 년
  - 백서른셋 해
  lexicon: HALOT
  rationale: 히브리어 수사 배열을 한국어의 자연스러운 수사 순서로 바꾸되, 의미를 그대로 보존하여 '백삼십삼 년'으로 옮겼습니다.
