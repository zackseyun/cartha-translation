  source_fidelity: 히브리어는 고핫의 네 아들(암람, 이스할, 헤브론, 웃시엘)을 열거하고 고핫의 수명을 133년으로 제시합니다. 번역문은 이 두 내용을 빠짐없이 정확히 반영합니다. 접속사 וְ의 반복은 한국어 열거 방식에 맞게 자연스럽게 처리되었으며, 수사도 정확합니다.
  naturalness: “고핫의 아들은 …입니다. 고핫이 산 햇수는 백삼십삼 년이었습니다.”는 현대 표준 한국어의 정중한 서술체로 자연스럽고, 계보 문맥에도 적절합니다. ‘아들’은 한국어에서 집합 복수 명사를 자연스럽게 나타내므로 ‘아들들’로 고칠 필요가 없습니다.
  terminology: 고핫, 암람, 이스할, 헤브론, 웃시엘은 한국어 성경에서 통용되는 음역과 부합합니다. ‘산 햇수’는 שְׁנֵי חַיֵּי의 생애 연수 관용구를 무리 없이 전달하며, 신학적으로 과도한 해석을 더하지 않습니다.
