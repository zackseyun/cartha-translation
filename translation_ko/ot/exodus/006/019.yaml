translation:
  language: ko
  text: 그리고 므라리의 아들들은 말리와 무시입니다. 이들은 그들의 계보에 따른 레위[a]의 씨족들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레위 사람의 가족들’ 또는 ‘레위의 씨족들’. 히브리어 단수형 ‘레위 사람’은 여기서 집합적으로 레위 계열 전체를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자녀들은
  - 또 …의 아들들은
  lexicon: HALOT
  rationale: 족보 문맥의 בְּנֵי는 ‘아들들’이 가장 직접적이며, 앞의 접속사를 살려 목록형 연결을 유지했습니다.
- source_word: מְרָרִי
  english_pob_choice: Merari
  chosen_korean: 므라리
  alternatives_korean:
  - 메라리
  - 미라리
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사를 현대 한국어 음역으로 옮겼습니다.
- source_word: מַחְלִי / וּמוּשִׁי
  english_pob_choice: Mahli and Mushi
  chosen_korean: 말리와 무시
  alternatives_korean:
  - 마흘리와 무시
  - 마흘리와 무쉬
  lexicon: 고유명사 음역
  rationale: 고유명사는 표준적 음역으로 처리했고, 접속사 ‘와’로 목록을 자연스럽게 유지했습니다.
- source_word: מִשְׁפְּחֹת
  english_pob_choice: the clans
  chosen_korean: 씨족들
  alternatives_korean:
  - 가문들
  - 가족들
  - 부족 집단들
  lexicon: HALOT
  rationale: 족보/지파 맥락에서 מִשְׁפָּחוֹת는 단순한 가족보다 하위 친족 단위를 가리키므로 ‘씨족들’이 가장 정확합니다.
- source_word: הַלֵּוִי
  english_pob_choice: of Levi / of the Levite
  chosen_korean: 레위의
  alternatives_korean:
  - 레위 사람의
  - 레위인의
  lexicon: HALOT
  rationale: 정관사 붙은 단수형을 집합적으로 이해해, 지파/계보를 가리키는 고유명사 ‘레위’로 옮겼습니다.
- source_word: לְתֹלְדֹתָם
  english_pob_choice: according to their generations
  chosen_korean: 그들의 نسل에 따른
  alternatives_korean:
  - 그들의 세대에 따라
  - 그들의 نسل대로
  lexicon: HALOT
  rationale: תּוֹלְדוֹת는 족보 공식에서 ‘세대/계보’의 뜻이므로, 계보적 순서를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 족보 공식의 문체 유지
  chosen_reading: 직역에 가까운 족보 문체를 유지해 계보 정보 자체가 드러나도록 했습니다.
  alternative_readings:
  - 서술적으로 풀어쓰기
  - 현대식 관계 설명으로 의역
  rationale: 본문은 신학적 해설보다 계보 기록이 핵심이므로, 정보 손실 없이 간결한 족보 형식을 보존하는 것이 적절합니다.
  doctrine_reference: 성경 족보의 역사성 및 언약 계보
