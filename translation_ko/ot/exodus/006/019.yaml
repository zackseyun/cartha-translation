  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
  footnotes:
  - marker: a
    text: Or 'the families of the Levite' or 'the clans of Levi.' The Hebrew singular 'the Levite' likely functions collectively for the Levitical line.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 므라리의 아들들은 말리와 무시입니다. 이것들은 그들의 نسل에 따른 레위의 씨족들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레위 사람의 가족들’ 혹은 ‘레위의 씨족들’. 히브리어 단수형 ‘레위 사람’은 여기서 집합적으로 레위 계열 전체를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  english_pob_choice: And the sons of
  chosen_korean: 그리고 …의 아들들은
  alternatives_korean:
  - 그리고 …의 자녀들은
  - 또 …의 아들들은
  lexicon: HALOT
  rationale: 족보 문맥의 בְּנֵי는 ‘아들들’이 가장 직접적이며, 앞의 접속사를 살려 목록형 연결을 유지했습니다.
- source_word: מְרָרִי
