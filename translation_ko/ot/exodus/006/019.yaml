- from: 그리고 므라리의 아들들은 말리와 무시입니다. 이것들은 그들의 نسل에 따른 레위의 씨족들입니다.[a]
  to: 그리고 므라리의 아들들은 말리와 무시입니다. 이들은 그들의 계보에 따른 레위[a]의 씨족들입니다.
  rationale: ‘نسل’을 족보 공식에 알맞은 한국어 ‘계보’로 바로잡았습니다. 또한 ‘이것들은’을 ‘이들은’으로 다듬고, הַלֵּוִי의 집합적 단수 용법을 설명하는 각주를 ‘레위’에 연결했습니다. 그 밖의 고유명사와 ‘씨족’이라는 친족 집단 용어는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:22Z'
