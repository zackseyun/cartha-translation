revisions:
- from: 그것은 그의 유일한 덮개입니다. 그것은 그의 피부를 위한 외투입니다. 무엇을 덮고 눕겠습니까? 그가 내게 부르짖으면 내가 들을 것입니다. 이는 내가 자비로운 사람이기 때문입니다.[a]
  to: 그것은 그의 유일한 덮개이며, 그의 살갗을 덮는 외투입니다. 그가 무엇으로 몸을 덮고 누울 수 있겠습니까? 그가 내게 부르짖으면 내가 들을 것입니다. 내가 자비롭기[a] 때문입니다.
  rationale: 원문의 설명적 접속, 유일한 밤 덮개라는 상황, ‘무엇으로’라는 도구적 수사 의문문, 그리고 하나님의 자비로운 성품이라는 자기 진술을 보존하면서 현대 한국어 합쇼체로 다듬었습니다. 교파적 해석은 추가하지 않았습니다.
