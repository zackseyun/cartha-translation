id: EXO.22.26
reference: Exodus 22:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י הִ֤וא כסות/ה לְ/בַדָּ֔/הּ הִ֥וא שִׂמְלָת֖/וֹ לְ/עֹר֑/וֹ בַּ/מֶּ֣ה יִשְׁכָּ֔ב וְ/הָיָה֙ כִּֽי יִצְעַ֣ק אֵלַ֔/י וְ/שָׁמַעְתִּ֖י כִּֽי חַנּ֥וּן אָֽנִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
  footnotes:
  - marker: a
    text: Or 'gracious' or 'merciful' for 'compassionate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 그의 유일한 덮개입니다. 그것은 그의 피부를 위한 외투입니다. 무엇을 덮고 눕겠습니까? 그가 내게 부르짖으면 내가 들을 것입니다. 이는 내가 자비로운 사람이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자비로운’은 ‘은혜로운’ 또는 ‘긍휼이 많은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는
  alternatives_korean:
  - 왜냐하면
  - 그것은
  lexicon: HALOT
  rationale: 앞선 금지의 근거를 제시하는 연결로서, 현대 한국어에서는 문맥상 자연스러운 설명형 접속사 ‘이는’이 가장 적절합니다.
- source_word: כְּסוּתוֹ לְבַדָּהּ
  english_pob_choice: his only covering
  chosen_korean: 그의 유일한 덮개
  alternatives_korean:
  - 그의 덮개뿐인 것
  - 그의 단 하나뿐인 덮개
  lexicon: HALOT
  rationale: כְּסוּת의 기본 의미를 살리면서 לְבַדָּהּ의 배타성을 ‘유일한’으로 압축해, 잠잘 때 대체할 것이 없는 상황을 드러냅니다.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  english_pob_choice: his cloak for his skin
  chosen_korean: 그의 피부를 위한 외투
  alternatives_korean:
  - 그의 피부에 걸친 외투
  - 그의 피부를 덮는 옷
  lexicon: HALOT
  rationale: שִׂמְלָה는 단순한 옷보다 몸을 감싸는 겉옷/외투의 기능이 강하므로 ‘외투’로 옮기고, לְעֹורוֹ는 ‘피부’라는 구체적 이미지를 보존했습니다.
- source_word: בַּמֶּה יִשְׁכָּב
  english_pob_choice: In what will he lie down?
  chosen_korean: 무엇을 덮고 눕겠습니까?
  alternatives_korean:
  - 무엇으로 눕겠습니까?
  - 무엇이 그를 덮고 눕게 하겠습니까?
  lexicon: HALOT
  rationale: שׁכב의 핵심을 살리되, 한국어에서는 ‘무엇을 덮고 눕다’가 밤의 덮개 부족이라는 문맥을 더 분명히 전달합니다.
- source_word: חַנּוּן
  english_pob_choice: compassionate
  chosen_korean: 자비로운
  alternatives_korean:
  - 은혜로운
  - 긍휼이 많은
  lexicon: HALOT
  rationale: 하나님의 성품을 나타내는 חַנּוּן을 한국어에서 가장 자연스럽게 드러내는 말은 ‘자비로운’이며, 고통받는 자의 부르짖음에 응답하는 문맥과도 잘 맞습니다.
theological_decisions:
- issue: 하나님의 자기 진술 חַנּוּן의 뉘앙스
  chosen_reading: ‘자비로운’으로 옮겨, 율법 맥락에서 가난한 자의 절박한 부르짖음에 대한 하나님의 응답성을 전면에 드러냈습니다.
  alternative_readings:
  - 은혜로운
  - 긍휼이 많은
  rationale: 이 장면은 추상적 교리보다 실제적 보호와 응답을 강조하므로, 현대 독자에게 직접 전달되는 윤리적·목회적 힘을 살리는 번역이 적합합니다.
  doctrine_reference: Translation philosophy §6 (readable modern Korean, not archaic or ecclesial register)
