translation:
  language: ko
  text: 그러나 짐승에게 찢겼다면, 그것을 증거로 가져와야 하며, 찢긴 것에 대해서는 배상하지 않아도 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘정말로 갈기갈기 찢겼다면, 그는 찢긴 짐승을 증거로 가져와야 하며, 배상하지 않아도 됩니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: But if
  chosen_korean: 그러나 ...이라면
  alternatives_korean:
  - 그리고 만약 ...이라면
  - 만일 ...이라면
  lexicon: HALOT
  rationale: 앞절과 이어지는 판례 문맥이므로 단순 조건문보다 대비를 드러내는 연결이 자연스럽습니다.
- source_word: טָרֹף יִטָּרֵף
  english_pob_choice: it is truly torn by beasts
  chosen_korean: 짐승에게 찢겼다면
  alternatives_korean:
  - 짐승에게 찢겨졌다면
  - 완전히 찢겼다면
  - 짐승에게 뜯겨 죽었다면
  lexicon: HALOT
  rationale: 중복형으로 된 강세를 한국어에서 과장 없이 반영하되, דין 문맥에 맞게 ‘짐승에게 찢기다’로 자연스럽게 옮겼습니다.
- source_word: עֵד
  english_pob_choice: as evidence
  chosen_korean: 증거로
  alternatives_korean:
  - 증거로서
  - 증인으로
  - 증언으로
  lexicon: HALOT
  rationale: 사람이 아니라 찢긴 짐승의 흔적을 제시하는 기능이므로, ‘증거’가 משפט적 역할을 가장 분명하게 드러냅니다.
- source_word: הַטְּרֵפָה
  english_pob_choice: what was torn
  chosen_korean: 찢긴 것
  alternatives_korean:
  - 찢긴 짐승
  - 찢긴 사체
  - 찢겨진 것
  lexicon: HALOT
  rationale: 히브리어의 간결한 명사를 과도하게 구체화하지 않고, 법문에 맞게 포괄적으로 옮겼습니다.
- source_word: לֹא יְשַׁלֵּם
  english_pob_choice: he shall not make restitution
  chosen_korean: 배상하지 않아도 됩니다
  alternatives_korean:
  - 보상할 필요가 없습니다
  - 배상해서는 안 됩니다
  - 갚지 않아도 됩니다
  lexicon: HALOT
  rationale: 법률 문맥의 שׁלם는 단순 지불보다 손해보전 의미가 강하므로 ‘배상하다’가 가장 적절합니다.
theological_decisions:
- issue: 법조문에서의 명령/허용 어조
  chosen_reading: 한국어는 판례형 법문에 맞춰 의무와 면책을 명료하게 나타내되, 과도한 권고체를 피했습니다.
  alternative_readings:
  - ~해야 합니다 / ~해야 합니다
  - ~해도 됩니다
  rationale: 히브리어 법문은 규정과 면책을 서술하므로, 현대 한국어에서도 판결문처럼 읽히는 형식이 원문의 기능을 잘 살립니다.
  doctrine_reference: 토라 법조문 서술 양식
