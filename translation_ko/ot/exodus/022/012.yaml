  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
  footnotes:
  - marker: a
    text: Or, 'If it is indeed torn to pieces, he shall bring the torn animal as evidence; he shall not repay.'
