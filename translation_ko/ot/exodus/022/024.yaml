  naturalness: ‘그를 채권자처럼 대하지 말며’는 한국어에서 대상인 가난한 사람이 채권자라는 의미로 읽힐 여지가 있습니다. ‘그에게 채권자처럼 하지 마십시오’로 고쳐 원문의 관계와 현대 한국어 법문체를 모두 살렸습니다.
