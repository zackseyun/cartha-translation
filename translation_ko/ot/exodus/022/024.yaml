- from: 네가 내 백성에게 돈을 꾸어 주면, 너희 가운데 가난한 사람에게는 그를 채권자처럼 대하지 말며, 그에게 이자를 부과하지 말아야 합니다.[a][b][c]
  to: 네가 내 백성, 곧 네 곁에 있는 가난한 사람에게 돈[b]을 빌려 주면[a], 그에게 채권자처럼 하지 마십시오. 그에게 이자를 부과하지 마십시오.[c]
  rationale: 원문의 조건법적 법문 구조와 ‘내 백성’이라는 소유 표현을 유지했습니다. 2인칭 단수의 일관성을 회복하고, 채권자에 관한 금지의 의미 관계를 자연스럽고 정확한 합쇼체로 수정했습니다. 각주는 해당 어구에 직접 연결되도록 재배치했습니다.
