source:
  edition: WLC
  text: אִם כֶּ֣סֶף תַּלְוֶ֣ה אֶת עַמִּ֗/י אֶת הֶֽ/עָנִי֙ עִמָּ֔/ךְ לֹא תִהְיֶ֥ה ל֖/וֹ כְּ/נֹשֶׁ֑ה לֹֽא תְשִׂימ֥וּ/ן עָלָ֖י/ו נֶֽשֶׁךְ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
  footnotes:
  - marker: a
    text: Or 'When you lend money to my people.' The Hebrew uses a conditional form common in case law.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'silver'; here meaning money.
    reason: lexical_alternative
  - marker: c
    text: Or 'you shall not charge him interest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 내 백성, 곧 네 곁에 있는 가난한 사람에게 돈[b]을 빌려 주면[a], 그에게 채권자처럼 하지 마십시오. 그에게 이자를 부과하지 마십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 내 백성, 곧 네 곁에 있는 가난한 사람에게 돈을 빌려 줄 때.’ 히브리어는 율법 조항에서 흔한 조건형을 사용합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘은’이지만, 여기서는 돈을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그에게 이자를 받지 마십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 네가 … 꾸어 주면
  alternatives_korean:
  - 만일 … 꾸어 주면
  - 네가 … 빌려 주면
  lexicon: HALOT
  rationale: 히브리어 조건문을 살리되, 한국어에서는 법문답게 자연스러운 조건형으로 옮겼습니다. '꾸어 주다'는 대부의 행위를 분명히 드러냅니다.
- source_word: כֶּסֶף
  english_pob_choice: money
  chosen_korean: 돈
  alternatives_korean:
  - 은
  - 화폐
  lexicon: HALOT
  rationale: 직역하면 '은'이지만, 여기서는 대부의 수단을 가리키므로 현대 한국어에서 바로 이해되는 '돈'이 본뜻을 더 잘 전달합니다.
- source_word: עַמִּי
  english_pob_choice: my people
  chosen_korean: 내 백성
  alternatives_korean:
  - 나의 백성
  - 내 ժողովուրդ
  lexicon: HALOT
  rationale: 첫 인칭 소유격을 살려 '내 백성'으로 옮겼습니다. 이 절 자체는 '이스라엘'을 덧붙이지 않으므로 본문 표현을 보존합니다.
- source_word: הֶעָנִי
  english_pob_choice: the poor among you
  chosen_korean: 너희 가운데 가난한 사람
  alternatives_korean:
  - 너희 가운데 가난한 자
  - 너희 가운데 빈곤한 사람
  lexicon: HALOT
  rationale: 히브리어는 남성 단수형이지만, 한국어에서는 인물 일반을 자연스럽게 지시하는 '사람'으로 옮겨 본문의 사회적 대상성을 살렸습니다.
- source_word: כְּנֹשֶׁה
  english_pob_choice: like a creditor
  chosen_korean: 채권자처럼
  alternatives_korean:
  - 빚쟁이처럼
  - 채무 독촉자처럼
  lexicon: HALOT
  rationale: 단순한 '빚 받는 사람'이 아니라 채무를 요구하고 압박하는 태도를 가리키므로, 법적·사회적 관계를 드러내는 '채권자'가 가장 적절합니다.
- source_word: תְשִׂימוּן … נֶשֶׁךְ
  english_pob_choice: impose interest
  chosen_korean: 이자를 부과하지
  alternatives_korean:
  - 이자를 매기지
  - 고리대를 두지
  lexicon: HALOT
  rationale: '''두다/놓다''의 관용구를 한국어의 법률적 표현인 ''부과하다''로 옮겨, 금전 채권에 덧붙이는 이자 부과 금지를 분명하게 했습니다.'
theological_decisions:
- issue: 조건문의 법문체 유지
  chosen_reading: 네가 … 꾸어 주면
  alternative_readings:
  - 네가 … 꾸어 줄 때
  - 네가 … 꾸어 준다면
  rationale: 이스라엘 법문에서 흔한 casuistic 조건문을 한국어에서도 유지하여, 명령 자체의 규범성을 흐리지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: '''my people''의 범위 표시'
  chosen_reading: 내 백성
  alternative_readings:
  - 이스라엘 백성
  - 내 백성 이스라엘
  rationale: 본문은 민족명을 직접 덧붙이지 않고 하나님의 소유관계만 말하므로, 의미를 확장하지 않고 소유격을 그대로 살렸습니다.
  doctrine_reference: Source fidelity / documented audit trail
