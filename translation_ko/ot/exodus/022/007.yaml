id: EXO.22.7
reference: Exodus 22:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם לֹ֤א יִמָּצֵא֙ הַ/גַּנָּ֔ב וְ/נִקְרַ֥ב בַּֽעַל הַ/בַּ֖יִת אֶל הָֽ/אֱלֹהִ֑ים אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֥אכֶת רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
  footnotes:
  - marker: a
    text: Or 'to the judges'; the Hebrew reads 'to God,' but in some legal contexts this may refer to judges acting under divine authority.
    reason: alternative_reading
translation:
  language: ko
  text: 만일 도둑이 발견되지 않으면, 집 주인은 자신이 이웃의 소유물에 손을 대지 않았는지를 두고 하나님께 나아가야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재판관들에게’. 히브리어는 ‘하나님께’라고 읽지만, 어떤 법적 문맥에서는 하나님의 권위 아래 일하는 재판관들을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  english_pob_choice: the thief is not found
  chosen_korean: 도둑이 발견되지 않으면
  alternatives_korean:
  - 도둑이 잡히지 않으면
  - 도둑이 나타나지 않으면
  lexicon: HALOT
  rationale: נִמְצָא의 수동적 의미를 살려, 법정 문맥에서 ‘발견되지 않으면’으로 자연스럽게 옮겼습니다.
- source_word: וְנִקְרַב
  english_pob_choice: shall come near
  chosen_korean: 나아가야 합니다
  alternatives_korean:
  - 가까이 가야 합니다
  - 출두해야 합니다
  lexicon: HALOT
  rationale: 법적 절차에서의 ‘다가가다/나아가다’는 뜻을 살려, 현대 한국어의 공적 표현인 ‘나아가야 합니다’로 옮겼습니다.
- source_word: בַּעַל הַבַּיִת
  english_pob_choice: the owner of the house
  chosen_korean: 집 주인
  alternatives_korean:
  - 집의 소유자
  - 집주인
  - 가옥의 주인
  lexicon: HALOT
  rationale: 소유 관계를 드러내면서도 현대 한국어 법적 맥락에서 가장 분명한 표현을 선택했습니다.
- source_word: אֶל הָאֱלֹהִים
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님 앞에
  - 재판관들에게
  lexicon: HALOT
  rationale: 히브리어의 직역값을 유지해 본문은 ‘하나님께’로 두고, 인간 재판관을 가리킬 가능성은 각주로 보존했습니다.
- source_word: שָׁלַח יָדוֹ
  english_pob_choice: has not laid his hand on
  chosen_korean: 자기의 손을 ... 댄 적이 있는지
  alternatives_korean:
  - 자기 손을 ... 놓았는지
  - 손을 대어 취했는지
  lexicon: HALOT
  rationale: ‘손을 대다’라는 관용구를 살려 불법적 취득의 이미지를 유지하되, 한국어로는 조사와 어순을 다듬어 자연스럽게 했습니다.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  english_pob_choice: his neighbor’s property
  chosen_korean: 자기 이웃의 소유
  alternatives_korean:
  - 이웃의 재산
  - 이웃의 물건
  - 이웃에게 속한 것
  lexicon: HALOT
  rationale: מְלָאכָה를 단순한 ‘물건’보다 넓은 소유/위탁물의 범위로 이해해, 문맥상 가장 포괄적인 ‘소유’로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 의미를 하나님으로 유지할지, 재판관으로 이해할지
  chosen_reading: 본문에는 ‘하나님께’로 두고, 재판관 해석 가능성은 각주에 보존합니다.
  alternative_readings:
  - 재판관들에게
  - 재판관들 앞에
  rationale: 히브리어 본문이 문자적으로 ‘하나님께’라고 읽히므로 이를 본문에 유지하고, 법정 문맥에서의 대안적 의미는 독자가 확인할 수 있도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
