  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֵּֽן תַּעֲשֶׂ֥ה לְ/שֹׁרְ/ךָ֖ לְ/צֹאנֶ֑/ךָ שִׁבְעַ֤ת יָמִים֙ יִהְיֶ֣ה עִם אִמּ֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י תִּתְּנ/וֹ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
  footnotes:
  - marker: a
    text: Or 'it shall be with its mother.' The Hebrew is literally 'it shall be with its mother'; 'remain' brings out the durative sense in context.
    reason: lexical_alternative
  - marker: b
    text: The command continues the preceding context about firstborn offerings; Hebrew does not repeat 'firstborn' in this verse.
    reason: cross_reference
translation:
  language: ko
  text: 그것을 네 소와 네 가축떼에 대해서도 그대로 하십시오. 칠 일 동안은 그것이 어미와 함께 있어야 합니다[a][b]. 여덟째 날에는 그것을 내게 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어미와 함께 있어야 합니다.’ 히브리어는 문자적으로 ‘어미와 함께 있다’이며, 여기서는 지속의 뜻을 살려 ‘있어야 합니다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 명령은 앞절의 첫새끼 봉헌 규정을 이어 받습니다. 히브리어는 이 절에서 ‘첫새끼’를 다시 반복하지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן תַּעֲשֶׂה
  english_pob_choice: You shall do the same
  chosen_korean: 그것을 …에도 그대로 하십시오
  alternatives_korean:
  - 그와 같이 하십시오
  - 똑같이 하십시오
  lexicon: HALOT
  rationale: 앞절의 첫새끼 규정을 이어 받는 비교적 지시이므로, ‘그대로’로 연속성과 동일한 적용을 자연스럽게 드러냈습니다.
- source_word: לְשֹׁרְךָ / לְצֹאנֶךָ
  english_pob_choice: with your ox / with your flock
  chosen_korean: 네 소와 네 가축떼에 대해서도
  alternatives_korean:
  - 네 황소와 네 떼에 대해서도
  - 네 소와 네 양 떼에 대해서도
  lexicon: HALOT
  rationale: שׁוֹר은 법문맥에서 ‘소’가 가장 무난하며, צֹאן은 작은 가축의 집합을 가리키므로 ‘가축떼’로 집합성을 살렸습니다.
- source_word: יִהְיֶה עִם אִמּוֹ
  english_pob_choice: it shall remain with its mother
  chosen_korean: 칠 일 동안은 그것이 어미와 함께 있어야 합니다
  alternatives_korean:
  - 칠 일 동안은 어미와 있어야 합니다
  - 칠 일 동안은 어미 곁에 있어야 합니다
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘어미와 함께 있다’이지만, 법적·지속적 의미를 살리기 위해 ‘있어야 합니다’로 옮겼습니다.
- source_word: תִּתְּנוֹ לִי
  english_pob_choice: you shall give it to me
  chosen_korean: 그것을 내게 주십시오
  alternatives_korean:
  - 그것을 내게 드리십시오
  - 그것을 내게 넘겨주십시오
  lexicon: HALOT
  rationale: נתן + ל의 직접적 요구를 살리되, 제의적 문맥에서 과도한 해설 없이 간명하게 ‘주십시오’로 옮겼습니다.
theological_decisions:
- issue: 앞절의 ‘첫새끼’ 맥락을 본절에 어떻게 반영할지
  chosen_reading: 본문에는 ‘첫새끼’가 반복되지 않으므로 본절 자체는 가축의 어미와 함께 있는 기간과 그 이후의 봉헌 명령으로만 번역했습니다.
  alternative_readings:
  - ‘첫새끼를’이라고 보충해 명시하는 번역
  - 본문에 없는 제의 설명을 덧붙이는 번역
  rationale: POB의 본문 절제 원칙에 따라, 앞절의 맥락은 유지하되 본절의 말을 넘어서지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; never paraphrase beyond what the source text warrants.'
