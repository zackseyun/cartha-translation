id: EXO.22.16
reference: Exodus 22:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם מָאֵ֧ן יְמָאֵ֛ן אָבִ֖י/הָ לְ/תִתָּ֣/הּ ל֑/וֹ כֶּ֣סֶף יִשְׁקֹ֔ל כְּ/מֹ֖הַר הַ/בְּתוּלֹֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/016.yaml
  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
  footnotes:
  - marker: a
    text: Literally, 'he shall weigh out silver,' reflecting payment by weighed metal rather than coined currency.
    reason: cultural_note
  - marker: b
    text: Or, 'to give her in marriage to him.' The Hebrew idiom 'give her to him' refers to the father's consent to marriage.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 그의 아버지가 그를 그 여자에게 주기를 끝까지 거절하면, 그는 처녀들의 신부값에 해당하는 은을 달아 주어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘은을 달아 주어야 합니다’이며, 이는 주화가 아니라 무게로 잰 금속 지급을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그 여자와 결혼시키기를’. 히브리어 관용구 ‘그 여자를 그에게 주다’는 아버지의 혼인 동의를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָאֵן יְמָאֵן
  english_pob_choice: absolutely refuses
  chosen_korean: 끝까지 거절하면
  alternatives_korean:
  - 단호히 거절하면
  - 완전히 거절하면
  - 아예 거절하면
  lexicon: HALOT
  rationale: 히브리어의 강조적 부정 구조를 한국어에서는 부사어로 자연스럽게 살려야 하므로, 단순한 ‘거절하면’보다 강한 반복·강조를 담은 표현을 택했습니다.
- source_word: לְתִתָּהּ לוֹ
  english_pob_choice: to give her to him
  chosen_korean: 그를 그 여자에게 주기를
  alternatives_korean:
  - 그 여자와 결혼시키기를
  - 그 여자에게 시집보내기를
  - 그에게 주기를
  lexicon: HALOT
  rationale: 직역하면 ‘그 여자에게 그를 주다’가 아니라 히브리어 관용구상 아버지의 혼인 허락을 뜻하므로, 원문의 말을 유지하되 혼인 맥락이 드러나도록 옮겼습니다.
- source_word: כֶּסֶף יִשְׁקֹל
  english_pob_choice: he shall weigh out silver
  chosen_korean: 은을 달아 주어야 합니다
  alternatives_korean:
  - 은을 저울질하여 주어야 합니다
  - 은을 지불해야 합니다
  - 은을 달아야 합니다
  lexicon: HALOT
  rationale: יִשְׁקֹל의 문자적 ‘달다/저울에 재다’를 살리면서도 현대 한국어에서는 법적 의무를 자연스럽게 전달하도록 ‘달아 주어야 합니다’로 옮겼습니다.
- source_word: כְּמֹהַר הַבְּתוּלֹת
  english_pob_choice: equal to the bride-price for virgins
  chosen_korean: 처녀들의 신부값에 해당하는
  alternatives_korean:
  - 처녀들의 신부값만큼의
  - 처녀들의 혼인값에 해당하는
  - 처녀들에게 치르는 신부값과 같은
  lexicon: HALOT
  rationale: מֹהַר는 혼인 시 지불되는 관습적 대가이므로 ‘신부값’으로 옮기되, 법조문다운 비교 표현을 살려 ‘해당하는’으로 마무리했습니다.
theological_decisions:
- issue: 혼인 합의의 법적 성격
  chosen_reading: ‘그를 그 여자에게 주기’를 아버지의 혼인 허락/동의로 이해해 번역했습니다.
  alternative_readings:
  - 단순한 물리적 ‘주다’
  - 신붓감으로 넘기다
  rationale: 본문은 거래가 아니라 혼인 승낙 여부를 다루는 사례법이므로, 직역의 형식을 유지하되 의미를 혼인 허락으로 분명하게 드러냈습니다.
  doctrine_reference: 결혼과 가족의 책임에 대한 본문 의미 보존
- issue: 가중 강조의 법문체
  chosen_reading: 강조를 드러내는 반복형을 한국어의 ‘끝까지 거절하면’으로 처리했습니다.
  alternative_readings:
  - 단순 현재형 ‘거절하면’
  - ‘거듭 거절하면’
  rationale: 히브리어의 강조는 단순 사실 진술보다 강한 거부 의사를 나타내므로, 법문체에 맞는 명료한 강조로 재현했습니다.
  doctrine_reference: 히브리어 강조구문 보존
