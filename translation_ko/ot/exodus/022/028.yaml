  rationale: 원문의 단수 수신자를 반영하고, 한국어에서 의미가 달라질 수 있는 ‘아들들의 맏아들’을 바로잡았습니다. 또한 첫 절은 수확물과 압착 액체 산물의 헌납을 미루지 말라는 원문의 법적 의미를 자연스러운 한국어로 표현했습니다. 주석은 액체 산물의 구체적 종류가 확정되지 않는 점을 유지합니다.
