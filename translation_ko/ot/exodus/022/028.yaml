  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְלֵאָתְ/ךָ֥ וְ/דִמְעֲ/ךָ֖ לֹ֣א תְאַחֵ֑ר בְּכ֥וֹר בָּנֶ֖י/ךָ תִּתֶּן לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
  footnotes:
  - marker: a
    text: Or 'your full produce and your juice/wine.' The Hebrew terms likely refer to harvested produce and pressed liquid produce; the exact agricultural pairing may be grain and wine, or more generally solid and liquid yield.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 네 수확의 풍성한 소산과 네 틀에서 흘러나오는 것을 바치는 일을 미루지 마십시오. 네 아들 가운데 맏아들을 내게 주어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 온전한 소산과 네 즙/포도주’라는 뜻입니다. 히브리어 표현은 거둔 산물과 압착하여 얻은 액체 산물을 가리키는 것으로 보입니다. 구체적으로 곡물과 포도주를 뜻할 수도 있고, 더 넓게 고형 산물과 액체 산물을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  english_pob_choice: the fullness of your harvest
  chosen_korean: 너희의 수확의 충만함
  alternatives_korean:
  - 너희의 온전한 소산
  - 너희의 풍성한 수확
  - 너희의 모든 산물
  lexicon: HALOT
  rationale: ‘מְלֵאָה’는 문자적으로 ‘충만함, 가득 찬 것’이지만 이 법조문에서는 추상적 충만이 아니라 거둔 산물 전체를 가리키므로, POB의 ‘the fullness of your harvest’를 따라 농경적 의미를 살렸습니다.
- source_word: וְדִמְעֲךָ
  english_pob_choice: the outflow of your press
  chosen_korean: 너희의 틀에서 흘러나온 것
  alternatives_korean:
  - 너희의 즙
  - 너희의 포도주
  - 너희의 압착한 것
  lexicon: HALOT
  rationale: ‘דִמְעָה’는 문자적으로 ‘눈물’이지만 농경 문맥에서는 압착된 액체 산물을 가리키므로, POB처럼 포도주로 한정하지 않고 ‘틀에서 흘러나온 것’으로 옮겨 액체 산물의 이미지를 보존했습니다.
- source_word: לֹא תְאַחֵר
  english_pob_choice: You shall not delay
  chosen_korean: 지체하지 말아야 합니다
  alternatives_korean:
  - 미루지 말아야 합니다
  - 늦추지 말아야 합니다
  - 지연시키지 말아야 합니다
  lexicon: HALOT
  rationale: 법조문 금지문에 맞게 ‘지체하지 말아야 합니다’로 옮겨, 의무를 늦추거나 보류하는 행위를 직접적으로 금지하는 뉘앙스를 유지했습니다.
- source_word: בְּכוֹר בָּנֶיךָ
  english_pob_choice: the firstborn of your sons
  chosen_korean: 너희의 아들들의 맏아들
  alternatives_korean:
  - 너희 아들들의 첫째
  - 너희 자녀들의 맏아들
  - 너희의 장자들
  lexicon: HALOT
  rationale: 히브리어가 분명히 ‘너희의 아들들’이라고 하므로, 성중립화하지 않고 ‘아들들의 맏아들’로 옮겨 POB의 성별 정확성을 반영했습니다.
- source_word: תִּתֶּן לִּי
  english_pob_choice: You shall give to me
  chosen_korean: 나에게 주어야 합니다
  alternatives_korean:
  - 내게 주어야 합니다
  - 나에게 드려야 합니다
  - 내게 바쳐야 합니다
  lexicon: HALOT
  rationale: 법적 요구를 나타내는 단순 미래/의무 표현으로 이해하여, 공적이면서도 자연스러운 ‘나에게 주어야 합니다’를 선택했습니다.
theological_decisions:
- issue: 농산물 헌정과 맏아들 헌신이 한 절에 병치된 구조
  chosen_reading: 이 절은 수확의 첫 산물과 아들의 맏아들을 모두 야훼께 지체 없이 드리라는 언약적 의무를 함께 제시합니다.
  alternative_readings:
  - 앞부분은 단지 일반적 세금 또는 수확 규정일 수 있음
  - 뒷부분은 별도의 가족법 조항으로만 읽을 수 있음
  rationale: 히브리어 원문은 두 분문을 병치하여 제의적 헌납과 언약적 소유권을 함께 강조하므로, 둘을 분리하거나 약화하지 않고 한 절의 의무로 유지했습니다.
  doctrine_reference: 출애굽기 22:28의 제의·언약 문맥
- issue: 관용적 농업 표현의 구체성
  chosen_reading: ‘틀에서 흘러나온 것’은 액체 산물을 가리키되, 포도주나 기름 중 하나로 과도하게 특정하지 않습니다.
  alternative_readings:
  - 포도주로 특정함
  - 기름으로 특정함
  rationale: 영문 POB도 ‘juice/wine’의 양가성을 주석으로 남기고 있어, 한국어 역시 해석을 한쪽으로 좁히지 않도록 했습니다.
  doctrine_reference: POB lexical audit trail
