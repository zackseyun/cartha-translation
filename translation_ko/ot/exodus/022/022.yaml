  source_fidelity: 히브리어의 조건 구조와 세 차례의 강조형(부정사 절대형+유한동사)은 대체로 반영되었습니다. 다만 현행문은 첫 조건절이 ‘학대하고’로만 연결되어 조건의 범위가 다소 불분명합니다. ‘만일 … 학대하고, 또 … 부르짖으면’으로 두 조건을 한 조건문 안에 명확히 연결하는 것이 안전합니다.
