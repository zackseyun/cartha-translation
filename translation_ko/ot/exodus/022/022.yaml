  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
  footnotes:
  - marker: a
    text: Hebrew has masculine singular pronouns ('him,' 'his'), functioning here for any individual widow or fatherless child mentioned in the previous verse.
    reason: cultural_note
  - marker: b
    text: 'The repeated Hebrew verb forms (''afflict,'' ''cry out,'' ''hear'') use an infinitive absolute with a finite verb for emphasis: ''surely/indeed afflict,'' ''surely cry out,'' ''surely hear.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 그를 정말로 학대하고, 그가 정말로 내게 부르짖으면, 나는 그의 부르짖음을 반드시 들을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 동사 반복은 ‘정말로/반드시’ 같은 강조를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 남성 단수 대명사는 앞절의 ‘과부나 고아’ 가운데 임의의 한 사람을 가리키는 일반적 용법입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: 네가 ... 하면
  alternatives_korean:
  - 만일 ... 하면
  - '...라면'
  lexicon: HALOT
  rationale: 히브리어 조건문을 자연스러운 한국어 조건절로 옮겼습니다.
- source_word: עַנֵּה תְעַנֶּה
  english_pob_choice: indeed afflict
  chosen_korean: 정말로 학대하고
  alternatives_korean:
  - 정말로 괴롭히고
  - 반드시 억압하고
  lexicon: HALOT
  rationale: 이중 어형의 강조를 살리되, 문맥상 약자를 가혹하게 대하는 의미를 한국어에서 분명하게 드러냈습니다.
- source_word: צָעֹק יִצְעַק
  english_pob_choice: he indeed cries out
  chosen_korean: 정말로 ... 부르짖으면
  alternatives_korean:
  - 정말로 ... 외치면
  - 간절히 ... 부르짖으면
  lexicon: HALOT
  rationale: 동사 צעק의 강한 호소를 ‘부르짖다’로 옮기고, 반복 어형의 강조는 ‘정말로’로 반영했습니다.
- source_word: שָׁמֹעַ אֶשְׁמַע
  english_pob_choice: I will surely hear
  chosen_korean: 나는 ... 반드시 들을 것입니다
  alternatives_korean:
  - 나는 ... 분명히 들을 것입니다
  - 나는 ... 꼭 들을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 확언 강조를 한국어의 ‘반드시’로 옮겨 하나님의 확실한 응답을 살렸습니다.
theological_decisions:
