  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
  footnotes:
  - marker: a
    text: Hebrew has masculine singular pronouns ('him,' 'his'), functioning here for any individual widow or fatherless child mentioned in the previous verse.
    reason: cultural_note
  - marker: b
    text: 'The repeated Hebrew verb forms (''afflict,'' ''cry out,'' ''hear'') use an infinitive absolute with a finite verb for emphasis: ''surely/indeed afflict,'' ''surely cry out,'' ''surely hear.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 네가 그를[a] 참으로 학대하고, 또 그가 참으로 내게 부르짖으면, 나는 반드시 그의 부르짖음을 들을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 남성 단수 대명사는 앞절의 ‘과부나 고아’ 가운데 어느 한 사람을 가리키는 일반적 용법입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어에서 ‘학대하다’, ‘부르짖다’, ‘듣다’는 각각 부정사 절대형과 유한동사를 함께 써서 강조합니다. 따라서 ‘참으로’와 ‘반드시’로 그 강조를 나타냈습니다.
    reason: lexical_alternative
