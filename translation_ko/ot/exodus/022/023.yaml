translation:
  language: ko
  text: 그러면 내 분노가 타오를 것이며[a], 내가 너희를 칼로 죽일 것입니다. 너희 아내들은 과부가 되고 너희 아들들은 아버지를 잃게 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 코가 타오를 것입니다’입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 더 구체적으로 ‘아버지를 잃은 상태’를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  english_pob_choice: then my anger will burn
  chosen_korean: 그러면 내 분노가 타오를 것이며
  alternatives_korean:
  - 그러면 내 노가 타오를 것이며
  - 그러면 내 진노가 타오를 것이며
  lexicon: WLC idiom חרה + אף
  rationale: ‘חרה’와 ‘אַף’의 관용적 결합은 몸의 일부를 그대로 옮기기보다 감정의 발화로 풀어야 하므로, ‘내 분노가 타오르다’로 자연스럽게 옮겼습니다.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  english_pob_choice: I will kill you
  chosen_korean: 내가 너희를 칼로 죽일 것입니다
  alternatives_korean:
  - 내가 너희를 죽일 것입니다
  - 내가 너희를 살해할 것입니다
  lexicon: HALOT
  rationale: ‘הרג’는 일반적인 ‘죽이다’이지만, 다음 절의 수단 표현과 연결해 심판의 폭력을 분명히 하기 위해 문맥상 ‘칼로’까지 이어 주었습니다.
- source_word: בֶּחָרֶב
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼로써
  - 검으로
  lexicon: HALOT
  rationale: 히브리어 전치사 ב + חֶרֶב는 수단을 나타내므로 ‘칼로’가 가장 자연스럽고, 한국어 성경에서 흔한 ‘칼’이 원문의 구체적 이미지를 잘 살립니다.
- source_word: נְשֵׁיכֶם אַלְמָנוֹת
  english_pob_choice: your wives will become widows
  chosen_korean: 너희 아내들은 과부가 되고
  alternatives_korean:
  - 너희 아내들은 미망인이 되고
  - 너희 아내들은 홀로 남게 되고
  lexicon: HALOT
  rationale: ‘אַלְמָנוֹת’은 표준적으로 ‘과부’이므로 사회적 지위를 분명히 드러내는 이 표현을 택했습니다.
- source_word: וּבְנֵיכֶם יְתֹמִים
  english_pob_choice: and your sons fatherless
  chosen_korean: 너희 아들들은 아버지를 잃게 될 것입니다
  alternatives_korean:
  - 너희 아들들은 아버지 없는 자가 될 것입니다
  - 너희 아들들은 고아가 될 것입니다
  lexicon: HALOT
  rationale: 영어 POB가 ‘orphans’보다 ‘fatherless’를 택해 아버지 상실의 구체성을 살렸으므로, 한국어에서도 ‘고아’보다 ‘아버지를 잃게 될 것’으로 원문의 사회적 결핍을 보존했습니다.
theological_decisions:
- issue: 하나님의 분노를 신체 관용구로 옮길지 여부
  chosen_reading: ‘my anger will burn’의 의미를 따라 ‘내 분노가 타오를 것’으로 옮겼습니다.
  alternative_readings:
  - 내 코가 타오를 것
  - 내 진노가 일어날 것
  rationale: 직역하면 신체 이미지가 뜻을 흐릴 수 있으므로, 심판의 강도를 유지하면서도 현대 한국어가 즉시 이해할 수 있는 표현으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘sons’를 성중립화할지 여부
  chosen_reading: ‘아들들’로 유지했습니다.
  alternative_readings:
  - 자녀들
  - 아이들
  rationale: 원문이 남성 복수형을 사용하므로, 문맥상 일반 자녀를 뜻하지 않는 한 성중립화하지 않았습니다.
  doctrine_reference: Translation philosophy §4
