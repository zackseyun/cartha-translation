source:
  edition: WLC
  text: וְ/חָרָ֣ה אַפִּ֔/י וְ/הָרַגְתִּ֥י אֶתְ/כֶ֖ם בֶּ/חָ֑רֶב וְ/הָי֤וּ נְשֵׁי/כֶם֙ אַלְמָנ֔וֹת וּ/בְנֵי/כֶ֖ם יְתֹמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
  footnotes:
  - marker: a
    text: Or 'by the sword.'
    reason: lexical_alternative
  - marker: b
    text: Or 'orphans'; Hebrew more specifically denotes those left fatherless.
