  alternatives_korean:
  - 발견되면
  - 찾아지면
  lexicon: HALOT
  rationale: 법정 문맥의 수동형을 한국어에서 자연스럽게 나타내기 위해 ‘붙잡혀서’로 옮겼습니다.
- source_word: וְהֻכָּה וָמֵת
  english_pob_choice: is struck so that he dies
  chosen_korean: 죽임을 당하면
  alternatives_korean:
  - 맞아 죽으면
  - 쳐서 죽게 되면
  lexicon: HALOT
  rationale: 히브리어는 ‘맞아 죽다’라는 결과를 한 덩어리로 보여 주므로, 결과를 분명히 하는 한국어 법문체로 간명하게 처리했습니다.
- source_word: אֵין ל֖וֹ דָּמִים
  english_pob_choice: there is no bloodguilt for him
  chosen_korean: 피의 책임이 없습니다
  alternatives_korean:
  - 피값이 없습니다
  - 피의 책임이 없습니다
  - 혈흔의 책임이 없습니다
  lexicon: HALOT
  rationale: 이 관용구는 단순한 물리적 피가 아니라 법적 혈죄/혈책임을 뜻하므로, 전통적 교회어보다 현대 독자가 이해하기 쉬운 ‘피의 책임’으로 옮겼습니다.
theological_decisions:
- issue: 정당방위 맥락의 법적 판단
  chosen_reading: 본문을 살인 허용의 일반화가 아니라, 특정한 침입 상황에서의 피의 책임 부재라는 율법적 판정으로 번역했습니다.
  alternative_readings:
  - ‘그는 살인죄가 없습니다’처럼 현대 형법 용어로 환원
  rationale: 히브리어는 도덕적 추상명제가 아니라 언약법의 책임 유무를 말하므로, ‘피의 책임’으로 유지해야 본문의 범위가 과장되지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
