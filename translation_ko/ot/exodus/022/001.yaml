  text: אִם בַּ/מַּחְתֶּ֛רֶת יִמָּצֵ֥א הַ/גַּנָּ֖ב וְ/הֻכָּ֣ה וָ/מֵ֑ת אֵ֥ין ל֖/וֹ דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
  footnotes:
  - marker: a
    text: Or, more formally, 'If the thief is found in the breaking-in.' The Hebrew term refers to a break-in, likely by digging through a wall or entering secretly.
    reason: lexical_alternative
  - marker: b
    text: That is, the person who struck the thief incurs no legal bloodguilt in this case.
    reason: lexical_alternative
translation:
  language: ko
  text: 도둑이 땅굴을 파고 들어오다가 붙잡혀서 죽임을 당하면, 그를 죽인 사람에게는 피의 책임이 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 벽을 뚫거나 몰래 들어오는 ‘돌입/침입’의 상황을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 그 도둑을 죽인 사람은 이 경우 법적으로 피의 책임을 지지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  english_pob_choice: breaking in
  chosen_korean: 땅굴을 파고 들어오다가
  alternatives_korean:
  - 침입하던 중
  - 몰래 들어오다가
  - 도둑질을 하려고 들어오다가
  lexicon: HALOT
  rationale: מחתרת는 단순한 ‘침입’보다 벽을 뚫거나 파고 들어오는 은밀한 돌입을 가리키므로, 한국어에서는 법적 상황을 살리면서도 이미지가 드러나게 풀어 옮겼습니다.
- source_word: יִמָּצֵא
  english_pob_choice: is found
  chosen_korean: 붙잡혀서
  alternatives_korean:
  - 발견되면
  - 찾아지면
  lexicon: HALOT
  rationale: 법정 문맥의 수동형을 한국어에서 자연스럽게 나타내기 위해 ‘붙잡혀서’로 옮겼습니다.
- source_word: וְהֻכָּה וָמֵת
  english_pob_choice: is struck so that he dies
  chosen_korean: 죽임을 당하면
  alternatives_korean:
  - 맞아 죽으면
  - 쳐서 죽게 되면
  lexicon: HALOT
  rationale: 히브리어는 ‘맞아 죽다’라는 결과를 한 덩어리로 보여 주므로, 결과를 분명히 하는 한국어 법문체로 간명하게 처리했습니다.
- source_word: אֵין ל֖וֹ דָּמִים
  english_pob_choice: there is no bloodguilt for him
  chosen_korean: 피의 책임이 없습니다
  alternatives_korean:
  - 피값이 없습니다
  - 피의 책임이 없습니다
  - 혈흔의 책임이 없습니다
  lexicon: HALOT
  rationale: 이 관용구는 단순한 물리적 피가 아니라 법적 혈죄/혈책임을 뜻하므로, 전통적 교회어보다 현대 독자가 이해하기 쉬운 ‘피의 책임’으로 옮겼습니다.
theological_decisions:
- issue: 정당방위 맥락의 법적 판단
  chosen_reading: 본문을 살인 허용의 일반화가 아니라, 특정한 침입 상황에서의 피의 책임 부재라는 율법적 판정으로 번역했습니다.
  alternative_readings:
  - ‘그는 살인죄가 없습니다’처럼 현대 형법 용어로 환원
  rationale: 히브리어는 도덕적 추상명제가 아니라 언약법의 책임 유무를 말하므로, ‘피의 책임’으로 유지해야 본문의 범위가 과장되지 않습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
