  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ חֲמ֨וֹר אוֹ שׁ֥וֹר אוֹ שֶׂ֛ה וְ/כָל בְּהֵמָ֖ה לִ/שְׁמֹ֑ר וּ/מֵ֛ת אוֹ נִשְׁבַּ֥ר אוֹ נִשְׁבָּ֖ה אֵ֥ין רֹאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
  footnotes:
  - marker: a
    text: Or 'a sheep or a goat'; the Hebrew שֶׂה can refer more broadly to one of the flock.
    reason: lexical_alternative
  - marker: b
    text: Literally 'is broken.'
    reason: lexical_alternative
  - marker: c
    text: That is, there is no eyewitness to what happened.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 자기 이웃에게 나귀나 소나 양[a]이나 그 밖의 어떤 가축이든 맡겨 두었는데, 그것이 죽거나 다치거나[b] 끌려가고 그것을 본 사람이 없으면[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 양이나 염소처럼 떼의 한 마리를 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘부러지다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧, 무슨 일이 있었는지 목격한 사람이 없다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִתֵּן
  english_pob_choice: If a man gives
  chosen_korean: 사람이 … 맡겨 지키게 하였는데
  alternatives_korean:
  - 만일 사람이 … 주면
  - 사람이 … 맡기면
  lexicon: HALOT
  rationale: 사례법의 조건문을 한국어 법률문답체로 자연스럽게 살리기 위해 ‘사람이 … 맡겨 지키게 하였는데’로 옮겼습니다. ‘주다’의 직역보다 보관 위탁의 뜻이 분명합니다.
- source_word: אֶל רֵעֵהוּ
  english_pob_choice: his neighbor
  chosen_korean: 자기 이웃에게
  alternatives_korean:
  - 그의 이웃에게
  - 자기 동료에게
  lexicon: HALOT
  rationale: רֵעַ는 사회적으로 가까운 상대를 가리키므로, 한국어에서 가장 자연스럽고 관용적인 법률·윤리 문맥의 대응인 ‘이웃’으로 옮겼습니다.
- source_word: חֲמוֹר / שׁוֹר / שֶׂה / וְכָל בְּהֵמָה
  english_pob_choice: a donkey, or an ox, or a sheep, or any animal
  chosen_korean: 나귀나 소나 양이나 어떤 가축이든
  alternatives_korean:
  - 나귀나 소나 양이나 어떤 동물이든
  - 나귀나 소나 어린양이나 어떤 가축이든
  lexicon: HALOT
  rationale: 열거된 가축 예시를 한국어로 그대로 살리되, בְּהֵמָה의 문맥상 뜻을 반영해 ‘가축’으로 옮겼습니다. שֶׂה는 넓게 양/염소를 가리킬 수 있지만, 본문 열거에서는 기본값인 ‘양’이 자연합니다.
- source_word: וּמֵת אוֹ נִשְׁבַּר אוֹ נִשְׁבָּה
  english_pob_choice: and it dies, or is injured, or is carried off
  chosen_korean: 그것이 죽거나 다치거나 빼앗겼는데도
  alternatives_korean:
  - 그것이 죽거나 부러지거나 끌려갔는데도
  - 그것이 죽거나 상하거나 빼앗겼는데도
  lexicon: HALOT
  rationale: 동물 피해의 사례를 한국어로 자연스럽게 풀어 ‘다치다’와 ‘빼앗기다’를 사용했습니다. נִשְׁבַּר의 문자적 의미인 ‘부러지다/깨지다’는 발의 뉘앙스를 주지만, 동물에 대해서는 ‘다치다’가 더 정확하게 전달합니다.
- source_word: אֵין רֹאֶה
  english_pob_choice: with no one seeing it
  chosen_korean: 보는 사람이 없으면
  alternatives_korean:
  - 목격자가 없으면
  - 아무도 보지 못하면
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘보는 사람이 없다’를 한국어 조건문에 맞게 다듬어, 증인 부재를 자연스럽게 드러내는 표현으로 옮겼습니다.
