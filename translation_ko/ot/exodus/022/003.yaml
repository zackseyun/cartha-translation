- source_word: הַגְּנֵבָה
  english_pob_choice: the stolen item
  chosen_korean: 도난품
  alternatives_korean:
  - 도둑맞은 것
  - 훔친 물건
  - 도난당한 물건
  lexicon: HALOT
  rationale: 행위인 ‘도난’이 아니라 빼앗긴 대상 자체를 가리키므로, 법조문 문체에 맞는 압축형 명사 ‘도난품’을 선택했습니다.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  english_pob_choice: whether ox, donkey, or sheep
  chosen_korean: 소에서 나귀까지, 양이든지 간에
  alternatives_korean:
  - 소든 나귀든 양이든
  - 소, 나귀, 양이든
  - 소에서 나귀와 양에 이르기까지
  lexicon: HALOT
  rationale: 열거의 범위를 나타내는 מִן...עַד... 구조를 한국어의 ‘~에서 ~까지’로 살리고, 대표 가축 예시라는 법률적 분류감을 유지했습니다.
- source_word: שְׁנַיִם יְשַׁלֵּם
  english_pob_choice: he shall repay double
  chosen_korean: 두 배로 갚아야 합니다
  alternatives_korean:
  - 두 배를 갚아야 합니다
  - 두 배로 배상해야 합니다
  - 배로 갚아야 합니다
  lexicon: HALOT
  rationale: 법적 배상을 뜻하는 동사를 현대 한국어에서 가장 직접적으로 드러내기 위해 ‘갚다’를 사용했고, כפילה의 의미는 ‘두 배로’로 분명히 했습니다.
