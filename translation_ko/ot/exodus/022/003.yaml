base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/003.yaml
  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
  footnotes:
  - marker: a
    text: Literally, 'if finding it is found in his hand the stolen property.' The Hebrew uses an emphatic verbal construction ('is surely/indeed found') and the idiom 'in his hand' for possession.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 도난품이 그의 손에 실제로 발견되면 — 소에서 나귀까지, 양이든지 간에 — 그는 두 배로 갚아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘그의 손에’는 문자적으로는 손을 뜻하지만, 이 법조문에서는 점유·소유를 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִמָּצֵא תִמָּצֵא
  english_pob_choice: is actually found
  chosen_korean: 실제로 발견되면
  alternatives_korean:
  - 반드시 발견되면
  - 정말 발견되면
  - 확실히 발견되면
  lexicon: HALOT
  rationale: 히트팔/니팔 계열의 강조형 표현을 한국어의 자연스러운 법률 문체로 옮기되, 중복 강조를 과도하게 드러내지 않도록 ‘실제로’로 처리했습니다.
- source_word: בְיָדוֹ
  english_pob_choice: in his possession
  chosen_korean: 그의 손에
  alternatives_korean:
  - 그의 소유 중에
  - 그의 소지 중에
  - 그의 손안에
  lexicon: HALOT
  rationale: 직역상 ‘그의 손에’이지만, 한국어 본문에서는 소유/점유를 뜻하는 관용을 살려 문맥상 충분히 자연스럽게 유지했습니다. 법률적 함의는 본문과 각주 없이도 이해될 수 있습니다.
- source_word: הַגְּנֵבָה
  english_pob_choice: the stolen item
  chosen_korean: 도난품
  alternatives_korean:
  - 도둑맞은 것
  - 훔친 물건
  - 도난당한 물건
  lexicon: HALOT
  rationale: 행위인 ‘도난’이 아니라 빼앗긴 대상 자체를 가리키므로, 법조문 문체에 맞는 압축형 명사 ‘도난품’을 선택했습니다.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  english_pob_choice: whether ox, donkey, or sheep
  chosen_korean: 소에서 나귀까지, 양이든지 간에
  alternatives_korean:
  - 소든 나귀든 양이든
  - 소, 나귀, 양이든
  - 소에서 나귀와 양에 이르기까지
  lexicon: HALOT
  rationale: 열거의 범위를 나타내는 מִן...עַד... 구조를 한국어의 ‘~에서 ~까지’로 살리고, 대표 가축 예시라는 법률적 분류감을 유지했습니다.
- source_word: שְׁנַיִם יְשַׁלֵּם
  english_pob_choice: he shall repay double
  chosen_korean: 두 배로 갚아야 합니다
  alternatives_korean:
  - 두 배를 갚아야 합니다
  - 두 배로 배상해야 합니다
  - 배로 갚아야 합니다
  lexicon: HALOT
  rationale: 법적 배상을 뜻하는 동사를 현대 한국어에서 가장 직접적으로 드러내기 위해 ‘갚다’를 사용했고, כפילה의 의미는 ‘두 배로’로 분명히 했습니다.
