  source_fidelity: 히브리어의 אַנְשֵׁי קֹדֶשׁ는 문자적으로 남성 복수의 ‘거룩한 남자들’이지만, 한국어 본문에서는 공동체를 가리키는 자연스러운 ‘거룩한 사람들’로 옮기고 각주에서 남성형을 밝혀 그 형식을 보존할 수 있습니다. טְרֵפָה는 ‘찢긴’으로 적절히 옮겼으며, 찢은 주체가 본문에 명시되지 않았다는 점은 각주로 처리하는 것이 좋습니다. לַכֶּלֶב의 일반적 단수는 한국어의 총칭 복수 ‘개들에게’로 자연스럽게 재현됩니다.
  naturalness: ‘당신들은’은 현대 표준 한국어에서 일반적인 복수 청자 호칭으로 다소 부자연스럽거나 거리감 있게 들립니다. 성경 법규 문맥의 합쇼체에는 ‘너희는’이 자연스럽습니다. 또한 두 독립 명령을 나누어 제시하면 규정문의 명료성이 높아집니다.
  terminology: ‘거룩한’, ‘찢긴 고기’, ‘개들에게 던지십시오’는 핵심 어휘와 법규적 격식에 잘 맞습니다. ‘나에게’는 לִי의 하나님께 속함/관계성을 ‘내게’보다 조금 더 분명하고 자연스럽게 전달합니다.
