  text: וְ/אַנְשֵׁי קֹ֖דֶשׁ תִּהְי֣וּ/ן לִ֑/י וּ/בָשָׂ֨ר בַּ/שָּׂדֶ֤ה טְרֵפָה֙ לֹ֣א תֹאכֵ֔לוּ לַ/כֶּ֖לֶב תַּשְׁלִכ֥וּ/ן אֹתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
  footnotes:
  - marker: a
    text: Or 'flesh torn by beasts in the field.' The Hebrew says simply 'flesh ... torn,' with the agent implied rather than stated.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'holy men.' The phrase may function representatively for the covenant community, but the masculine form is explicit in the source text.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 나에게 거룩한 사람들이 되어야 합니다[a]. 들에서 찢긴 고기는 먹어서는 안 됩니다[b]. 그것을 개들에게 던지십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘거룩한 남자들’입니다. 히브리어는 남성 복수형을 사용합니다. 본문은 공동체를 가리키는 자연스러운 한국어 표현으로 ‘거룩한 사람들’이라고 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘들에서 짐승에게 찢긴 고기’. 히브리어는 ‘찢긴’이라고만 하며, 찢은 주체를 명시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  english_pob_choice: holy men
  chosen_korean: 거룩한 사람들
  alternatives_korean:
  - 거룩한 남자들
  - 거룩한 백성
  - 성결한 사람들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘거룩의 사람들/거룩한 남자들’이지만, 한국어에서는 ‘사람들’이 자연스럽고 공동체적 요구를 살리면서도 거룩함의 성격을 유지합니다. ‘남자들’은 성별을 과도하게 전면화하므로 본문 의미를 살린 번역으로는 덜 적절합니다.
- source_word: תִּהְי֣וּ/ן לִ֑י
  english_pob_choice: you shall be ... to me
  chosen_korean: 내게 ... 되어야 합니다
  alternatives_korean:
  - 내게 ... 있어야 합니다
  - 내게 ... 되어야 할 것입니다
  lexicon: HALOT
  rationale: 히브리어 היה + לִי는 소속과 관계를 나타내므로 ‘내게 되어야 합니다’로 옮겨 언약적 귀속의 의미를 살렸습니다.
- source_word: טְרֵפָה
  english_pob_choice: torn
  chosen_korean: 찢긴
  alternatives_korean:
  - 뜯긴
  - 찢겨 죽은
  - 맹수에게 찢긴
  lexicon: HALOT
  rationale: 어근이 ‘찢다/뜯다’의 상태를 가리키므로 ‘찢긴’이 가장 직접적입니다. 주체(짐승에 의해)가 히브리어에 명시되지 않으므로 본문에는 덧붙이지 않았습니다.
- source_word: לַכֶּלֶב
  english_pob_choice: to the dogs
  chosen_korean: 개들에게
  alternatives_korean:
  - 개에게
  - 개들한테
  lexicon: HALOT
  rationale: 히브리어는 단수형이지만 분배적·일반적 용법으로 쓰이므로 한국어에서는 자연스러운 복수 ‘개들에게’로 옮겼습니다.
theological_decisions:
- issue: 거룩함 명령의 의미
  chosen_reading: ‘거룩한 사람들’로 옮겨, 음식 규정이 단순한 위생 규칙이 아니라 하나님께 속한 언약 백성의 구별됨을 드러내게 했습니다.
  alternative_readings:
  - 성별된 사람들
  - 거룩하게 구별된 사람들
  rationale: קֹדֶשׁ는 윤리적·예전적 거룩함과 소속을 함께 지시하므로, 한국어에서도 가장 직접적인 ‘거룩한’을 유지하는 편이 본문의 신학적 힘을 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§3-4
