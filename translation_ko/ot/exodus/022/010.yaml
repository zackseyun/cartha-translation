id: EXO.22.10
reference: Exodus 22:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁבֻעַ֣ת יְהוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵי/הֶ֔ם אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֣אכֶת רֵעֵ֑/הוּ וְ/לָקַ֥ח בְּעָלָ֖י/ו וְ/לֹ֥א יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
  footnotes:
  - marker: a
    text: Or, more literally, 'an oath of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'put his hand to his neighbor’s property,' an idiom for misappropriating or tampering with what belonged to another.
    reason: cultural_note
  - marker: c
    text: Or 'the owner shall receive it,' that is, accept the oath as sufficient.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와의 맹세가 두 사람 사이에 있어야 합니다. 곧 그가 자기 이웃의 물건에 손을 대지 않았다는 것입니다.[a] 그 물건의 주인은 그 맹세를 받아들이고,[b] 그는 배상하지 않아도 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 남의 물건을 착복하거나 함부로 손댄다는 뜻입니다.
    reason: source_note
  - marker: b
    text: 문맥상 그 물건의 소유자가 그 맹세를 충분한 것으로 받아들인다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  english_pob_choice: an oath of Yahweh
  chosen_korean: 여호와의 맹세
  alternatives_korean:
  - 야훼의 맹세
  - 여호와 앞에서의 맹세
  lexicon: HALOT
  rationale: שְׁבֻעַת는 법적 맹세를 뜻하며, יְהוָה는 본문 관례에 따라 ‘여호와’로 옮겨 신적 이름의 직역 관계를 드러냈습니다.
- source_word: בֵּין שְׁנֵי/הֶם
  english_pob_choice: between the two of them
  chosen_korean: 두 사람 사이에
  alternatives_korean:
  - 그들 사이에
  - 두 사람 가운데
  lexicon: HALOT
  rationale: 히브리어가 ‘둘’을 분명히 표시하므로, 한국어에서도 쌍방의 법적 구도를 분명하게 살렸습니다.
- source_word: שָׁלַח יָד
  english_pob_choice: put his hand to
  chosen_korean: 손을 대지 않았다는 것
  alternatives_korean:
  - 손을 뻗지 않았다는 것
  - 손을 대지 않았다는 것
  - 손을 댄 적이 없다는 것
  lexicon: HALOT
  rationale: 관용구 ‘손을 대다’는 남의 것을 착복하거나 건드렸다는 뜻을 자연스럽게 전달하며, 문맥상 부정 서약의 내용에 맞습니다.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  english_pob_choice: his neighbor’s property
  chosen_korean: 자기 이웃의 물건
  alternatives_korean:
  - 이웃의 재산
  - 이웃의 소유물
  - 이웃의 일
  lexicon: HALOT
  rationale: מְלָאכָה의 이 문맥은 ‘일’이 아니라 맡겨진 물건/재산의 법적 의미이므로, 더 넓고 직접적인 ‘물건’으로 옮겼습니다.
- source_word: וְלָקַח בְּעָלָיו
  english_pob_choice: and its owner shall accept it
  chosen_korean: 그의 주인은 그것을 받아들이고
  alternatives_korean:
  - 그 주인은 그것을 받으며
  - 그 주인은 받아들이고
  - 그 주인은 그것을 수락하고
  lexicon: HALOT
  rationale: 동사의 핵심은 소유자가 서약과 그에 따른 변제를 충분한 것으로 받아들이는 것이므로, 법적 효력을 드러내는 ‘받아들이고’로 옮겼습니다.
- source_word: יְשַׁלֵּם
  english_pob_choice: make restitution
  chosen_korean: 배상하지 않아도 됩니다
  alternatives_korean:
  - 갚지 않아도 됩니다
  - 보상하지 않아도 됩니다
  - 변상하지 않아도 됩니다
  lexicon: HALOT
  rationale: 피엘형 שׁלם의 법정 맥락을 살려, 단순한 지불보다 손해를 메우는 ‘배상’으로 옮겼습니다.
theological_decisions:
- issue: 여호와의 맹세라는 법정 서약의 성격
  chosen_reading: 본문은 하나님의 이름을 걸고 하는 법적 맹세를 말하므로, 경건 일반이 아니라 분쟁 해결을 위한 증언 서약으로 읽었습니다.
  alternative_readings:
  - 여호와께 드리는 일반적 맹세
  - 종교적 서원
  rationale: 문맥상 소유 분쟁의 판정 절차이며, 다음 절차(주인이 받아들임, 배상 면제)도 재산 소송의 결론을 보여 줍니다.
  doctrine_reference: 출애굽기 22장의 배상법 맥락
