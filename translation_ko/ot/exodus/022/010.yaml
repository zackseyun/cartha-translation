- from: 여호와의 맹세가 두 사람 사이에 있어야 합니다. 곧 그가 자기 이웃의 물건에 손을 대지 않았다는 것인데, 그의 주인은 그것을 받아들이고, 그는 배상하지 않아도 됩니다.[a][b]
  to: 여호와의 맹세가 두 사람 사이에 있어야 합니다. 곧 그가 자기 이웃의 물건에 손을 대지 않았다는 것입니다.[a] 그 물건의 주인은 그 맹세를 받아들이고,[b] 그는 배상하지 않아도 됩니다.
