base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
  footnotes:
  - marker: a
    text: Or 'judges'; אֱלֹהִים can in some contexts refer to human authorities, though 'God' best fits the parallelism here.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님을 모욕하지 마십시오. 또 당신 백성의 지도자를 저주하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재판관들’. אֱלֹהִים은 어떤 문맥에서는 인간 권위자들을 가리킬 수 있으나, 여기서는 ‘하나님’이 평행 구조에 가장 잘 맞습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신들
  - 재판관들
  lexicon: HALOT, BDB
  rationale: 문맥상 첫 절은 하나님에 대한 모독 금지로 읽는 것이 가장 자연스럽고, 영어 POB의 'God' 선택을 따라 한국어도 기본 번역어인 '하나님'으로 옮겼습니다.
- source_word: תְקַלֵּל
  english_pob_choice: revile
  chosen_korean: 욕되게 하지 마십시오
  alternatives_korean:
  - 저주하지 마십시오
  - 모욕하지 마십시오
  lexicon: HALOT, BDB
  rationale: Piel형은 단순한 저주보다 공개적 비방·모욕의 뉘앙스를 가지므로, 두 번째 절의 더 직접적인 '저주하다'와 구별되도록 '욕되게 하다'로 옮겼습니다.
- source_word: נָשִׂיא
  english_pob_choice: a ruler
  chosen_korean: 지도자
  alternatives_korean:
  - 통치자
  - 족장
  - 왕자
  lexicon: HALOT, BDB
  rationale: שורש נ-ש-א의 '들림 받은 자'라는 어감은 권위를 가진 사람을 가리키며, 현대 한국어에서는 법률·공동체 문맥에서 '지도자'가 가장 자연스럽습니다.
- source_word: בְעַמְּךָ
  english_pob_choice: among your people
  chosen_korean: 백성 가운데 있는
  alternatives_korean:
  - 당신의 백성 가운데
  - 당신 백성의
  - 당신의 백성 중
  lexicon: HALOT, BDB
  rationale: ב는 소속보다 위치·범위를 나타내는 뉘앙스가 있어, 공동체 내부의 인물을 뜻하는 '백성 가운데 있는'으로 살렸습니다.
theological_decisions:
- issue: אֱלֹהִים의 지시 대상
  chosen_reading: 주된 본문은 하나님으로 읽되, 인간 권위자 해석 가능성은 주석적 대안으로 남깁니다.
  alternative_readings:
  - 재판관들
  - 신들
  rationale: 바로 뒤의 '백성 가운데 있는 지도자'와 평행을 이루지만, 법문 전체의 금지 대상은 우선 하나님께 대한 언어적 모독으로 이해하는 것이 가장 강합니다. 영어 POB처럼 대안 독해는 본문 밖에서 보존합니다.
  doctrine_reference: Translation philosophy §3 (source의 긴장을 보존하고 대안 독해는 각주에 남김)
