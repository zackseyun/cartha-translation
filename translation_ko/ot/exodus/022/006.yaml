  - severity: medium
    issue: ‘그는 갑절로 갚아야 합니다’의 주어 지시
    rationale: 히브리어 문맥상 배상자는 도둑이지만, 한국어 ‘그는’은 선행하는 ‘어떤 사람’ 또는 ‘그 사람’으로도 잠시 읽힐 수 있습니다. ‘그 도둑은’으로 명시하는 것이 안전합니다.
  - severity: low
    issue: 각주 a의 앵커 위치
    rationale: 각주 내용은 ‘돈’(כֶּסֶף)에 관한 것이므로, 현재의 ‘했다가’ 뒤가 아니라 ‘돈’ 바로 뒤에 붙여야 합니다.
