  - marker: b
    text: Or 'articles' or 'objects' for 'goods.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'he shall repay twofold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 어떤 사람이 이웃에게 돈이나 물건을 맡겨 지키게 했다가[a], 그것이 그 사람의 집에서 도난당하면, 도둑이 잡히는 경우 그는 갑절로 갚아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֶּסֶף는 문자적으로 ‘은’이지만, 여기서는 돈의 의미로 쓰였습니다.
    reason: source_note
