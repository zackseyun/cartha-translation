  text: 만일 어떤 사람이 이웃에게 돈[a]이나 물건을 맡겨 보관하게 하였는데, 그것이 이웃의 집에서 도난당하면, 도둑이 발견될 경우 그 도둑은 두 배로 배상해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
