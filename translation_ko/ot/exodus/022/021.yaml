    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אַלְמָנָה
  english_pob_choice: any widow
  chosen_korean: 어떤 과부도
  alternatives_korean:
  - 모든 과부도
  - 과부든 누구든
  lexicon: HALOT
  rationale: 부정 명령문에서 כָּל의 분배적 의미를 살려, 포괄성을 자연스럽게 드러내는 ‘어떤’으로 옮겼습니다. אַלְמָנָה는 표준적으로 ‘과부’가 가장 직접적입니다.
- source_word: יָתוֹם
  english_pob_choice: orphan
  chosen_korean: 고아
  alternatives_korean:
  - 부모 없는 아이
  - 아버지 없는 아이
  lexicon: HALOT
  rationale: 히브리어 법문맥에서 ‘고아’는 핵심 의미를 잘 전달하는 현대 한국어입니다. POB의 주석처럼 더 문자적인 ‘아버지 없는 아이’도 가능하지만, 본문에는 간결한 기본어가 적절합니다.
- source_word: תְעַנּוּן
  english_pob_choice: afflict
  chosen_korean: 학대해서는 안 됩니다
  alternatives_korean:
  - 괴롭혀서는 안 됩니다
  - 압제해서는 안 됩니다
  - 학대하지 마십시오
  lexicon: HALOT
  rationale: Piel의 ענה는 단순 감정적 ‘괴롭힘’보다 가혹한 처우를 포함하므로, 한국어에서는 법적·윤리적 금지를 분명히 하는 ‘학대하다’가 가장 적절합니다. ‘압제하다’는 사회경제적 착취로 좁아질 수 있습니다.
theological_decisions:
- issue: 금지문의 한국어 명령 형식
  chosen_reading: ‘너희는 … 안 됩니다’로 공동체 전체에 대한 보편적 금지로 제시했습니다.
  alternative_readings:
  - ‘너는 … 말라’
  - ‘…하지 마십시오’
  rationale: 히브리어 복수 금지명령의 공동체적 성격을 살리기 위해 집단 대상의 현대적 금지 표현을 택했습니다. 직접 권고보다 법문체의 효력을 더 선명하게 드러냅니다.
  doctrine_reference: 토라의 언약법에서 약자 보호
- issue: ‘과부와 고아’의 결합
  chosen_reading: 두 약자 집단을 함께 묶어 번역하여 보호 대상의 사회적 취약성을 그대로 보이게 했습니다.
  alternative_readings:
  - ‘과부나 고아’
  - ‘과부와 아버지 없는 아이’
  rationale: 히브리어는 보편적 보호 대상을 병렬로 제시합니다. 한국어에서도 두 범주를 유지해야 본문의 사회윤리적 무게가 약화되지 않습니다.
  doctrine_reference: 가난하고 보호받지 못하는 자에 대한 하나님의 특별한 관심
