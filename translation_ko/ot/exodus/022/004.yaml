  lexicon: HALOT
  rationale: 판례법 문맥에서 조건을 여는 כִּי를 한국어 합쇼체에서는 자연스러운 조건 연결인 ‘~하면’으로 옮겼습니다.
- source_word: יַבְעֶר
  english_pob_choice: causes a field or vineyard to be grazed over
  chosen_korean: 망가뜨리려고
  alternatives_korean:
  - 먹어 치우게
  - 불태우게
  - 훼손하게
  lexicon: HALOT
  rationale: 본문의 뒤이어지는 ‘짐승을 풀어놓아… 먹게 하면’이라는 문맥을 따라, בער의 כאן에서 보이는 피해 결과를 포괄적으로 드러내되 ‘불태우다’로 좁히지 않았습니다.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  english_pob_choice: and lets his animal loose
  chosen_korean: 자기 짐승을 풀어놓아
  alternatives_korean:
  - 자기 동물을 놓아
  - 자기 가축을 풀어놓아
  lexicon: HALOT
  rationale: שִׁלַּח의 ‘풀어놓다/놓아주다’ 의미를 살리고, בְּעִירֹה는 법률 문맥에 맞게 ‘짐승’으로 옮겼습니다.
- source_word: בְּשְׂדֵה אַחֵר
  english_pob_choice: in another man's field
  chosen_korean: 다른 사람의 밭에서
  alternatives_korean:
  - 다른 밭에서
  - 남의 밭에서
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘다른’이지만, 법적 의미를 분명히 하기 위해 소유 주체를 한국어로 풀어 ‘다른 사람의’로 옮겼습니다.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  english_pob_choice: from the best of his own field and the best of his own vineyard
  chosen_korean: 자기 밭의 가장 좋은 것과 자기 포도원의 가장 좋은 것
  alternatives_korean:
  - 자기 밭의 좋은 것과 자기 포도원의 좋은 것
  - 자기 밭의 최상품과 자기 포도원의 최상품
  lexicon: HALOT
  rationale: מֵיטַב의 ‘가장 좋은/최상’ 의미를 살리되, 보상 물건의 출처를 분명히 하기 위해 ‘자기’와 ‘것’을 함께 넣었습니다.
- source_word: יְשַׁלֵּם
  english_pob_choice: he shall make restitution
  chosen_korean: 갚아야 합니다
  alternatives_korean:
  - 배상해야 합니다
  - 보상해야 합니다
  - 변상해야 합니다
  lexicon: HALOT
  rationale: 시제·법률적 의무를 자연스럽게 드러내는 현대 한국어 법률체 표현으로 옮겼습니다.
