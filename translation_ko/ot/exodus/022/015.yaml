source:
  edition: WLC
  text: וְ/כִֽי יְפַתֶּ֣ה אִ֗ישׁ בְּתוּלָ֛ה אֲשֶׁ֥ר לֹא אֹרָ֖שָׂה וְ/שָׁכַ֣ב עִמָּ֑/הּ מָהֹ֛ר יִמְהָרֶ֥/נָּה לּ֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
  footnotes:
  - marker: a
    text: Or 'who is not betrothed.' The Hebrew refers to a woman not formally pledged in marriage.
    reason: lexical_alternative
  - marker: b
    text: Or 'he shall surely pay the marriage-price for her.' The Hebrew refers to the mohar, the payment associated with marriage, better rendered 'bride-price' than 'dowry' in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 남자가 약혼하지 않은 처녀를 꾀어 그 여자와 동침하면, 그는 그 여자를 자기 아내로 삼기 위하여 반드시 신부값을[a] 치러야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 여자를 위하여 혼인값을’이라고 할 수 있습니다. 히브리어 모하르(mohar)는 혼인과 관련하여 신랑 쪽에서 내는 지불을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘약혼하지 않은’은 정식으로 정혼, 곧 혼인을 약속한 상태가 아닌 여자를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  english_pob_choice: seduces
  chosen_korean: 꾀어
  alternatives_korean:
  - 유혹하여
  - 속여
  lexicon: HALOT
  rationale: 피엘형 פתה는 여기서 성적 맥락의 ‘꾀다, 유혹하다’의 뜻이므로, 합쇼체 문맥에서 자연스럽고 과도한 폭력을 암시하지 않는 ‘꾀어’를 택했습니다.
- source_word: בְּתוּלָה
  english_pob_choice: a virgin
  chosen_korean: 처녀
  alternatives_korean:
  - 동정녀
  - 젊은 여자
  lexicon: HALOT
  rationale: 법적·사회적 상태를 가리키는 말로서 בְּתוּלָה의 핵심은 미혼 성경험 없음에 있으므로, 한국어에서는 가장 직접적인 대응인 ‘처녀’를 사용했습니다.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  english_pob_choice: who is not betrothed
  chosen_korean: 아직 약혼하지 않은
  alternatives_korean:
  - 아직 정혼하지 않은
  - 아직 약속된 혼인이 없는
  lexicon: HALOT
  rationale: אָרַשׂ는 정식 혼인 약속 상태를 뜻하므로, 현대 독자가 이해하기 쉬우면서도 법적 의미를 살리는 ‘약혼하지 않은’을 본문에 두고, 더 형식적인 대안으로 ‘정혼하지 않은’을 남겼습니다.
- source_word: מָהֹר יִמְהָרֶנָּה
  english_pob_choice: he must surely pay the bride-price
  chosen_korean: 반드시 신부값을 치러야 합니다
  alternatives_korean:
  - 반드시 혼인 값을 치러야 합니다
  - 반드시 결혼 예물을 내야 합니다
  lexicon: HALOT
  rationale: מֹהַר은 남편 쪽이 치르는 혼인 관련 지불로, 문맥상 ‘지참금’이 아니라 ‘신부값’이 정확합니다. 반복 구조의 강한 의무를 ‘반드시 … 치러야 합니다’로 살렸습니다.
- source_word: לּוֹ לְאִשָּׁה
  english_pob_choice: for her to be his wife
  chosen_korean: 그 여자를 자기 아내로 삼기 위해
  alternatives_korean:
  - 그의 아내가 되게 하려고
  - 자기 아내로
  lexicon: HALOT
  rationale: 히브리어는 지급의 법적 결과를 나타내므로, ‘아내로 삼기 위해’로 자연스럽게 풀어도 결혼 귀결의 의미를 유지할 수 있습니다.
theological_decisions:
- issue: פּתה의 성격을 강제성으로 볼지 자발적 유혹으로 볼지
  chosen_reading: 자발적 유혹에 가까운 법조문으로 읽음
  alternative_readings:
  - 강간/성폭행으로 읽음
  - 중립적 성적 관계로 읽음
  rationale: 본 동사는 이 절 자체만으로는 폭력을 명시하지 않으므로, POB의 영문 audit trail을 따라 ‘꾀다/유혹하다’로 번역해 다른 성폭력 조문과의 구분을 보존했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 본문이 명시하지 않은 강제성은 덧씌우지 않음
