translation:
  language: ko
  text: 짐승과 동침하는 사람은 반드시 사형을 받아야 합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 직역하면 ‘반드시 죽임을 당할 것입니다’입니다. 히브리어의 법률 공식은 사법적 형벌로서 확정적인 죽음을 분명히 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל + שֹׁכֵב
  english_pob_choice: Whoever lies with
  chosen_korean: 짐승과 동침하는 사람은
  alternatives_korean:
  - 누구든지 짐승과 동침하는 자는
  - 짐승과 성관계를 맺는 사람은
  lexicon: HALOT
  rationale: ‘כָּל + 분사’의 일반화된 법률 표현을 한국어에서는 자연스럽게 ‘...하는 사람은’으로 옮기고, שׁכב + עִם의 성적 완곡어법은 ‘동침하다’로 비교적 직접적으로 살렸습니다.
- source_word: בְּהֵמָה
  english_pob_choice: an animal
  chosen_korean: 짐승
  alternatives_korean:
  - 동물
  - 가축
  lexicon: HALOT
  rationale: 본문의 법적 금기 맥락에서는 בְּהֵמָה를 단순한 ‘동물’보다 더 원초적이고 직접적인 ‘짐승’으로 옮기는 편이 소스의 중대성을 더 잘 드러냅니다.
- source_word: מוֹת יוּמָת
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 사형에 처해야 합니다
  alternatives_korean:
  - 반드시 죽어야 합니다
  - 반드시 죽임을 당해야 합니다
  lexicon: HALOT
  rationale: 어근 중복으로 이루어진 법률 공식의 확정적 사형 선고를 한국어에서는 관용적으로 ‘사형에 처하다’로 풀어, 사법적 의미를 분명히 했습니다.
theological_decisions:
- issue: 법률형 죽음 선고의 전달
  chosen_reading: ‘죽다’보다 ‘사형에 처하다’로 옮겨, 본문이 개인적 운명 선언이 아니라 형벌 집행을 가리킨다는 점을 드러냈습니다.
  alternative_readings:
  - 반드시 죽어야 합니다
  - 반드시 죽임을 당해야 합니다
  rationale: 히브리어의 מוֹת יוּמָת는 확정적 사법 제재의 공식을 이루므로, 한국어에서도 법정적·형벌적 성격을 명시하는 번역이 본문의 힘을 더 정확히 전달합니다.
  doctrine_reference: 성경 법전의 사법 공식과 형벌 선고의 의미
