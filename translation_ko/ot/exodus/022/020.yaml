review_pass:
  verdict: revise
  source_fidelity: 히브리어는 앞 절에서 단수 2인칭으로 금지하고(‘너는’), 이유 절에서는 복수 2인칭으로 이스라엘 전체를 회상시킵니다(‘너희가’). 초안은 이 수의 전환을 보존했으나, גֵר를 ‘나그네’로 옮기면 일시적으로 여행하는 사람이라는 뜻이 강해, 공동체 안에 거주하는 비토착민이라는 원어의 핵심 의미가 흐려집니다. 또한 תוֹנֶה는 ‘학대하다’보다 넓은 부당한 대우를 가리키므로 ‘부당하게 대하다’가 더 적절합니다.
  naturalness: ‘너는 … 안 됩니다’는 현대 합쇼체의 직접 명령으로 다소 부자연스럽습니다. ‘너는 … 하지 마십시오’가 단수 상대를 유지하면서도 현대 정중한 성경 문체에 맞습니다. ‘그를 압박하다’도 가능하지만, 이 법문맥에서는 ‘억압하다’가 더 자연스럽고 정확합니다.
  terminology: גֵר는 ‘거류민’으로 옮기고 각주에서 ‘외국인’ 및 ‘나그네’라는 대안을 밝혔습니다. ‘거류민’은 비토착인이 그 사회 안에 거주한다는 의미를 보존하는 비교적 중립적인 법·사회 용어입니다. 이집트는 현대 표준 지명인 ‘이집트’로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘나그네’는 גֵר의 거주성 및 사회적 법적 지위를 충분히 나타내지 못합니다.
    rationale: גֵר는 단순한 여행자가 아니라 이스라엘 가운데 거주하는 비토착인을 가리킵니다. ‘거류민’이 이 본문의 법적 맥락과 어휘 반복을 더 잘 보존합니다.
  - severity: medium
    issue: ‘학대하다’는 תוֹנֶה의 의미를 불필요하게 좁히고 강하게 만들 수 있습니다.
    rationale: 이 동사는 폭넓게 부당하게 대하거나 해를 입히는 행위를 가리킵니다. ‘부당하게 대하다’는 경제적 착취나 신체적 학대 어느 하나로 한정하지 않습니다.
  - severity: low
    issue: ‘너는 … 안 됩니다’는 직접 명령문으로서 합쇼체와 어울리지 않습니다.
    rationale: ‘하지 마십시오’가 단수 2인칭 명령의 문법적 형식과 현대 정중 문체를 함께 살립니다.
