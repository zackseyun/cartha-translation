  to: 너는 거류민[a]을 부당하게 대하지 말고, 그를 억압하지 마십시오. 너희가 이집트 땅에서 거류민들이었기 때문입니다.
  rationale: 원문의 단수 금지 명령과 복수 이유 절의 수 전환을 그대로 유지했습니다. גֵר의 사회적 거주 의미를 ‘거류민’으로 명시하고, 다른 가능한 한국어 표현은 각주로 처리했습니다. 두 금지 동사의 의미 차이는 ‘부당하게 대하다’와 ‘억압하다’로 구별했으며, 합쇼체 직접 명령문으로 문장을 다듬었습니다.
