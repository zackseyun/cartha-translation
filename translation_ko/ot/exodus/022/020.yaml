translation:
  language: ko
  text: 너는 거류민[a]을 부당하게 대하지 말고, 그를 억압하지 마십시오. 너희가 이집트 땅에서 거류민들이었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국인’ 또는 ‘나그네’. 히브리어 게르(גֵר)는 이스라엘 가운데 거주하는 비토착민을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  english_pob_choice: foreigner
  chosen_korean: 나그네
  alternatives_korean:
  - 외국인
  - 이방인
  - 거류민
  lexicon: HALOT
  rationale: גֵר는 이스라엘 가운데 거주하는 비토착인을 가리키므로, 여기서는 일상적이면서도 성경적 맥락을 살리는 ‘나그네’가 적절합니다. ‘외국인’은 현대적이지만 출신 국가를 암시하기 쉬워 문맥의 거주성보다 약하고, ‘거류민’은 다소 법률 문체가 강합니다.
- source_word: תוֹנֶה
  english_pob_choice: mistreat
  chosen_korean: 학대해서는 안 되며
  alternatives_korean:
  - 해롭게 해서는 안 되며
  - 부당하게 대하지 말며
  - 억울하게 하지 말며
  lexicon: HALOT
  rationale: 히필형 ינה는 부당하게 대하거나 해를 끼치는 폭넓은 의미이므로, 단순한 감정적 학대보다 넓게 적용되는 ‘학대하다’가 금지문의 강도를 잘 드러냅니다.
- source_word: תִלְחָצֶנּוּ
  english_pob_choice: oppress him
  chosen_korean: 그를 압박해서도 안 됩니다
  alternatives_korean:
  - 그를 억압해서도 안 됩니다
  - 그를 짓눌러서도 안 됩니다
  - 그를 핍박해서도 안 됩니다
  lexicon: HALOT
  rationale: לָחַץ는 압박·억압의 뜻을 가지며, 법문맥에서는 강한 압력을 가하는 행위를 가리킵니다. ‘압박하다’는 이 폭넓은 의미를 살리면서도 현대 한국어에서 자연스럽고, ‘그를’로 히브리어의 단수 대명사를 보존합니다.
- source_word: גֵרִים
  english_pob_choice: foreigners
  chosen_korean: 나그네였기
  alternatives_korean:
  - 외국인이었기
  - 거류민이었기
  - 이방인이었기
  lexicon: HALOT
  rationale: 후반절의 복수형도 앞의 핵심어를 반복하므로, 같은 낱말군인 ‘나그네’로 대응해 어휘적 일관성을 유지했습니다. 한국어에서는 서술어를 자연스럽게 만들어 ‘나그네였기 때문입니다’로 옮겼습니다.
- source_word: בְּאֶרֶץ מִצְרָיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅
  alternatives_korean:
  - 이집트 땅에서
  - 이집트에서
  - 애굽 땅
  lexicon: HALOT
  rationale: 히브리어가 ‘땅’을 분명히 포함하므로 이를 보존했습니다. ‘이집트 땅’은 문맥을 유지하면서도 현대 독자가 읽기 쉬운 표현입니다.
theological_decisions:
- issue: 명령문의 대상과 단수 대명사 보존
  chosen_reading: ‘나그네’를 단수로 유지하고 ‘그를’로 대응했습니다.
  alternative_readings:
  - 복수로 일반화하여 ‘나그네들... 그들을’로 옮김
  - 성중립적 ‘그들을’로 완화
  rationale: 히브리어는 단수 גֵר와 3인칭 남성 단수 접미사를 사용한 일반법 문체이므로, 원문의 형식과 법적 엄밀성을 살리기 위해 단수 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
