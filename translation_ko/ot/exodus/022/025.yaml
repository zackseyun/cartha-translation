  yaml_path: translation/ot/exodus/022/025.yaml
  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
  footnotes:
  - marker: a
    text: Or 'garment' or 'outer garment' for 'cloak.' The Hebrew term refers specifically to an outer covering that could serve as protection at night.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'until the coming of the sun'; that is, by sunset.
    reason: lexical_alternative
translation:
  language: ko
  text: “네 이웃의 외투[a]를 담보로 받거든, 해가 지기 전[b]에 그에게 돌려주어야 합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외투’는 단순한 옷이 아니라, 밤에 몸을 보호하는 바깥 덮개를 가리키는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘해가 들어올 때까지’이지만, 문맥상 해가 질 때까지, 곧 일몰 전을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָבֹל תַּחְבֹּל
  english_pob_choice: you take ... as a pledge
  chosen_korean: 담보로 받거든
  alternatives_korean:
