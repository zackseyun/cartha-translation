  - 저당 잡거든
  - 담보로 잡거든
  lexicon: HALOT
  rationale: 어근의 반복이 담보 취득 행위를 강하게 나타내므로, 법률 문맥을 살리되 현대 한국어에서 자연스러운 ‘담보로 받다’로 옮겼습니다.
- source_word: שַׂלְמַת
  english_pob_choice: cloak
  chosen_korean: 외투
  alternatives_korean:
  - 겉옷
  - 망토
  - 겉의 옷
  lexicon: HALOT
  rationale: 이 단어는 밤에 덮을 수 있는 바깥옷을 가리키므로, 기능을 드러내는 ‘외투’가 가장 간결하고 의미를 잘 전달합니다.
- source_word: רֵעֶךָ
  english_pob_choice: your neighbor’s
  chosen_korean: 네 이웃의
  alternatives_korean:
  - 네 동료의
  - 네 벗의
  - 네 사람의
  lexicon: HALOT
  rationale: 법규에서 רֵעַ는 공동체적 관계를 지닌 상대를 가리키므로, 윤리적 함의를 살리는 ‘이웃’이 적절합니다.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  english_pob_choice: before the sun sets
  chosen_korean: 해가 지기 전에
  alternatives_korean:
