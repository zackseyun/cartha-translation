  - 해가 오기 전까지
  - 일몰 전에
  lexicon: HALOT
  rationale: 직역의 ‘해의 옴’보다 한국어 관용에 맞는 ‘해가 지기 전에’가 시간 한계를 분명히 드러냅니다.
theological_decisions:
- issue: 법 조항의 명령형 강도
  chosen_reading: “...그에게 돌려주어야 합니다”로 의무성을 분명히 살렸습니다.
  alternative_readings:
  - “돌려줍니다”
  - “돌려주십시오”
  rationale: 히브리어 완료/미완료의 규범적 법문맥은 단순 서술이 아니라 의무를 나타내므로, 현대 법문체에 맞는 당위 표현을 택했습니다.
  doctrine_reference: 토라의 사회적 정의와 약자 보호 규정
