source:
  edition: WLC
  text: כִּֽי תֵצֵ֨א אֵ֜שׁ וּ/מָצְאָ֤ה קֹצִים֙ וְ/נֶאֱכַ֣ל גָּדִ֔ישׁ א֥וֹ הַ/קָּמָ֖ה א֣וֹ הַ/שָּׂדֶ֑ה שַׁלֵּ֣ם יְשַׁלֵּ֔ם הַ/מַּבְעִ֖ר אֶת הַ/בְּעֵרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
  footnotes:
  - marker: a
    text: Or 'and catches thorns'; literally, 'and finds thorns.'
    reason: lexical_alternative
  - marker: b
    text: Or 'must surely pay'; the Hebrew intensifies the obligation with an infinitive absolute plus finite verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 불이 나서 가시덤불에 옮겨붙어, 쌓아 둔 곡식이나 서 있는 곡식이나 밭이 타 버리면, 그 불을 낸 사람이 반드시 배상해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי תֵצֵא אֵשׁ
  english_pob_choice: If a fire breaks out
  chosen_korean: 만일 불이 나서
  alternatives_korean:
  - 불이 일어나면
  - 불이 번지면
  lexicon: HALOT
  rationale: 사례법의 조건문을 한국어 법문체로 자연스럽게 살리기 위해 ‘만일’과 ‘불이 나서’를 택했습니다.
- source_word: וּמָצְאָה קֹצִים
  english_pob_choice: and catches in thorns
  chosen_korean: 가시덤불에 옮겨붙어
  alternatives_korean:
  - 가시에 닿아
  - 가시덤불을 만나
  lexicon: HALOT
  rationale: 직역인 ‘가시를 찾고’는 한국어에서 어색하므로, 불이 가시덤불로 옮겨 붙는 상황을 분명하게 드러냈습니다.
- source_word: גָּדִישׁ ... הַקָּמָה ... הַשָּׂדֶה
  english_pob_choice: stacked grain or standing grain or the field
  chosen_korean: 쌓아 둔 곡식이나 서 있는 곡식이나 밭
  alternatives_korean:
  - 곡식더미나 서 있는 곡식이나 밭
  - 곡식 더미나 아직 베지 않은 곡식이나 밭
  lexicon: HALOT
  rationale: 세 항목의 대비를 유지하되, 현대 독자가 이해하기 쉬운 농경 표현으로 옮겼습니다.
- source_word: שַׁלֵּם יְשַׁלֵּם
  english_pob_choice: must surely make restitution
  chosen_korean: 반드시 배상해야 합니다
  alternatives_korean:
  - 반드시 갚아야 합니다
  - 반드시 보상해야 합니다
  lexicon: HALOT
  rationale: 강조형 동사의 중첩을 ‘반드시’로 살리고, 법적·재산적 책임을 분명히 하는 ‘배상’으로 옮겼습니다.
