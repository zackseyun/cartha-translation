base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/011.yaml
  text: But if it is stolen from him[a], he shall make restitution to its owner.
  footnotes:
  - marker: a
    text: Hebrew literally, 'if stealing it is stolen from with him,' an emphatic construction meaning 'if it is indeed stolen from him' or 'if it is actually stolen while in his custody.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그것이 그에게서 도둑맞았다면, 그는 그 주인에게 배상해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘도둑맞음이 도둑맞으면’에 가까운 반복 표현으로, 실제로 도둑맞은 경우를 강조합니다. ‘그에게서’는 그가 보관하고 있던 중이라는 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 …라면
  alternatives_korean:
  - 그리고 …라면
  - 만일 …라면
  lexicon: HALOT
  rationale: 앞절과 이어지는 법정 상황의 대조를 살려 ‘그러나’를 넣었고, 조건문은 자연스러운 합쇼체로 풀었습니다.
- source_word: גָּנֹב יִגָּנֵב
  english_pob_choice: it is stolen
  chosen_korean: 도둑맞은 것
  alternatives_korean:
  - 훔쳐진 것
  - 분명히 도둑맞은 것
  lexicon: HALOT
  rationale: 히브리어의 강조형 반복을 한국어에서 무리하게 직역하기보다, 수동적 결과를 자연스럽게 나타내는 ‘도둑맞은 것’으로 옮겼습니다.
- source_word: מֵעִמּוֹ
  english_pob_choice: from him
  chosen_korean: 그에게서
  alternatives_korean:
  - 그의 보관 아래에서
  - 그의 수중에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘그와 함께 있는 곳에서’이지만, 문맥상 위탁·보관 중 분실을 가리키므로 한국어에서는 간결하게 ‘그에게서’로 옮겼습니다.
- source_word: יְשַׁלֵּם
  english_pob_choice: he shall make restitution
  chosen_korean: 배상해야 합니다
  alternatives_korean:
  - 보상해야 합니다
  - 갚아야 합니다
  lexicon: HALOT
  rationale: 법률 문맥의 שלם는 단순 반환보다 손실을 메우는 책임을 뜻하므로, 한국어 법어감에 맞는 ‘배상’이 가장 정확합니다.
