revisions:
- from: 소와 나귀와 양과 겉옷과, 혹은 어떤 분실물에 관한 모든 범죄 사건에서, 누군가 “이것이 바로 그것이다”라고 말하는 경우에는, 두 사람의 사건이 하나님 앞에 와야 합니다. 하나님이 유죄로 판결하시는 사람이 자기 이웃에게 갑절로 갚아야 합니다.[a][b]
  to: 소나 나귀나 양[a]이나 옷이나, 또는 누군가가 “이것이 그것이다”라고 주장하는 어떤 분실물에 관한 모든 위반 사건은 두 사람의 사건이 하나님[b] 앞에 나아가야 합니다. 하나님께서 유죄라고 판결하시는 사람은 자기 이웃에게 갑절로 갚아야 합니다.
  rationale: 원문의 법적 범위와 어휘의 폭을 보존하도록 ‘범죄 사건’을 ‘위반 사건’으로, 지나치게 구체적인 ‘겉옷’을 ‘옷’으로 고쳤습니다. 주장 절과 법정 절을 현대 한국어 문장으로 다듬었으며, 두 각주를 각각 양과 하나님에 직접 연결했습니다. אֱלֹהִים의 논쟁적인 법정적 의미는 본문에서 ‘하나님’을 유지하고 각주에서 열어 두었습니다.
  reviewer_model: gpt-5.6-terra
