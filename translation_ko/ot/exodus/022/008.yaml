  source_fidelity: ‘범죄 사건’은 פֶּשַׁע의 법적 위반·부정행위 범위를 현대 형법상의 범죄로 다소 좁힐 수 있으므로, ‘위반에 관한 모든 사건’이 더 충실합니다. שַׂלְמָה는 특정한 겉옷보다 일반적인 의복을 뜻하므로 ‘옷’으로 수정하는 것이 안전합니다. אֱלֹהִים의 ‘하나님’ 번역과 재판관이라는 대안은 유지할 수 있습니다.
  naturalness: 원문의 열거와 조건절을 자연스러운 현대 한국어 합쇼체로 정돈했습니다. ‘이것이 바로 그것이다’는 한국어에서 부자연스럽고 지시 대상도 불필요하게 강조하므로 ‘이것이 그것이다’로 옮겼습니다.
  terminology: ‘유죄라고 판결하시는’은 יַרְשִׁיעֻן의 법정적 선언을 잘 나타냅니다. ‘갑절로 갚아야 합니다’는 이중 배상의 뜻을 보존합니다. 각주 표지는 해당 어휘 바로 뒤에 배치해야 합니다.
