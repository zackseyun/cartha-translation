  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
  footnotes:
  - marker: a
    text: Or “before the judges” / “before the court”; Hebrew אֱלֹהִים can refer to God directly or to human judges acting under divine authority in legal settings.
    reason: alternative_reading
  - marker: b
    text: Hebrew שֶׂה is a broader term for small livestock and can refer to a sheep or a goat.
    reason: lexical_alternative
translation:
  language: ko
  text: 소나 나귀나 양[a]이나 옷이나, 또는 누군가가 “이것이 그것이다”라고 주장하는 어떤 분실물에 관한 모든 위반 사건은 두 사람의 사건이 하나님[b] 앞에 나아가야 합니다. 하나님께서 유죄라고 판결하시는 사람은 자기 이웃에게 갑절로 갚아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 양뿐 아니라 염소를 포함한 작은 가축을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֱלֹהִים은 하나님을 가리킬 수도 있고, 법적 문맥에서는 하나님의 권위 아래 재판하는 재판관들을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  english_pob_choice: case of wrongdoing
  chosen_korean: 범죄 사건
  alternatives_korean:
  - 잘못 사건
  - 위법 사건
  - 죄가 되는 사건
  lexicon: HALOT
  rationale: דָּבָר는 법적 ‘사건/일’의 뜻이고 פֶּשַׁע는 단순한 실수가 아니라 위반·범죄에 가까운 잘못이므로, 법정 문맥을 살리면서도 현대 한국어 법률 감각에 맞는 ‘범죄 사건’으로 옮겼습니다.
- source_word: שַׂלְמָה
  english_pob_choice: garment
  chosen_korean: 겉옷
  alternatives_korean:
  - 의복
  - 옷
  - 외투
  lexicon: HALOT
  rationale: 일반적 ‘옷’보다 분쟁 대상이 되는 휴대 가능한 의류를 드러내는 표현이어서, 전통적이지만 범위가 지나치게 좁지 않은 ‘겉옷’을 택했습니다.
- source_word: אֲבֵדָה
  english_pob_choice: lost thing
  chosen_korean: 분실물
  alternatives_korean:
  - 잃어버린 것
  - 분실한 물건
  - 잃은 물건
  lexicon: HALOT
  rationale: 법적 소유 분쟁의 대상을 자연스럽게 드러내는 현대어로 ‘분실물’을 사용하되, 원문의 넓은 의미를 해치지 않도록 구체 물품명은 넣지 않았습니다.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 재판관들
  - 법정
  - 신들
  lexicon: HALOT
  rationale: 원문 표면형을 따라 मुख्य 본문은 ‘하나님’으로 유지했습니다. 이는 법정에서 재판관을 가리킬 수 있는 해석 가능성을 지우지 않으면서도, 본문이 실제로 말하는 형태를 먼저 드러내기 위함입니다.
- source_word: יַרְשִׁיעֻן
  english_pob_choice: declares guilty
  chosen_korean: 유죄로 판결하시는
  alternatives_korean:
  - 유죄라고 선언하시는
  - 유죄 판정을 내리시는
  - 죄 있다 하시는
  lexicon: HALOT
  rationale: 히필형 רשע는 판결 행위로서의 ‘유죄 선고/판결’에 가깝기 때문에, 현대 한국어 법정 표현인 ‘유죄로 판결하시는’으로 옮겼습니다.
theological_decisions:
- issue: אֱלֹהִים의 법정 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문은 ‘하나님 앞에’로 두고, 재판관 해석은 본문 밖에서 열어 둡니다.
  alternative_readings:
  - 재판관들 앞에
  - 법정에
  - 재판소에
  rationale: 출애굽기 법문맥에서 אֱלֹהִים은 하나님 자신 또는 그 권위 아래 선 재판관을 뜻할 수 있습니다. 본문은 어휘의 직접 의미를 유지하고, 해석 가능성은 번역 안에서 완전히 결정하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
