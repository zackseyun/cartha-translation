  text: וְ/כִֽי יִשְׁאַ֥ל אִ֛ישׁ מֵ/עִ֥ם רֵעֵ֖/הוּ וְ/נִשְׁבַּ֣ר אוֹ מֵ֑ת בְּעָלָ֥י/ו אֵין עִמּ֖/וֹ שַׁלֵּ֥ם יְשַׁלֵּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
  footnotes:
  - marker: a
    text: Or, more literally, 'it is broken.' The Hebrew can refer either to damage to a borrowed item or injury to a borrowed animal.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'he shall surely pay'; that is, he must make full restitution.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 자기 이웃에게서 어떤 것을 빌렸을 때, 그것이 상하거나[a] 죽고 그 주인이 그것과 함께 있지 않았다면, 그 사람은 반드시 배상해야 합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘부서지다’입니다. 빌린 대상이 물건일 수도 있고 짐승일 수도 있으므로, 여기서는 ‘상하다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 강조형은 ‘반드시 배상하다’라는 뜻을 나타냅니다.
    reason: lexical_alternative
