id: EXO.22.13
reference: Exodus 22:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יִשְׁאַ֥ל אִ֛ישׁ מֵ/עִ֥ם רֵעֵ֖/הוּ וְ/נִשְׁבַּ֣ר אוֹ מֵ֑ת בְּעָלָ֥י/ו אֵין עִמּ֖/וֹ שַׁלֵּ֥ם יְשַׁלֵּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
  footnotes:
  - marker: a
    text: Or, more literally, 'it is broken.' The Hebrew can refer either to damage to a borrowed item or injury to a borrowed animal.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'he shall surely pay'; that is, he must make full restitution.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 자기 이웃에게서 무엇인가를 빌렸는데 그것이 다치거나 죽고, 그 주인이 그것과 함께 있지 않으면, 그는 반드시 배상해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘부서지다’이지만, 빌린 대상이 물건일 수도 있고 짐승일 수도 있어 문맥상 넓게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 강조형은 ‘반드시 배상하다’의 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: And if
  chosen_korean: …하면
  alternatives_korean:
  - 그리고 만일…하면
  - 만일…하면
  lexicon: WLC/HALOT
  rationale: 율법 조항의 조건문을 자연스러운 한국어 법률체로 옮기기 위해 종결 연결보다 조건형을 살렸습니다.
- source_word: יִשְׁאַ֥ל
  english_pob_choice: borrows
  chosen_korean: 빌렸는데
  alternatives_korean:
  - 요구하면
  - 빌리면
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 ‘묻다’가 아니라 물건이나 짐승을 빌리는 법적 상황이므로 ‘빌리다’를 택했습니다.
- source_word: מֵ/עִ֥ם רֵעֵ֖/הוּ
  english_pob_choice: from his neighbor
  chosen_korean: 자기 이웃에게서
  alternatives_korean:
  - 자기 친구에게서
  - 자기 동료에게서
  lexicon: HALOT
  rationale: רֵעַ는 여기서 공동체 안의 상대를 가리키므로, 한국어에서는 율법 문맥에 가장 자연스러운 ‘이웃’이 적합합니다.
- source_word: וְ/נִשְׁבַּ֣ר אוֹ מֵ֑ת
  english_pob_choice: and it is injured or dies
  chosen_korean: 그것이 다치거나 죽고
  alternatives_korean:
  - 그것이 부러지거나 죽고
  - 그것이 손상되거나 죽고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘부서지다’이지만, 빌린 대상이 짐승일 수도 있으므로 영어 POB의 취지를 따라 ‘다치다’로 넓게 옮겼습니다.
- source_word: שַׁלֵּ֥ם יְשַׁלֵּֽם
  english_pob_choice: he shall surely make restitution
  chosen_korean: 반드시 배상해야 합니다
  alternatives_korean:
  - 반드시 갚아야 합니다
  - 온전히 갚아야 합니다
  lexicon: HALOT
  rationale: 단순한 ‘지불’보다 손해를 메우는 법적 책임을 드러내기 위해 ‘배상하다’를 사용했고, 강조용 부정사절을 ‘반드시’로 살렸습니다.
theological_decisions:
- issue: 법률 문맥에서의 책임 표현
  chosen_reading: ‘make restitution’를 ‘배상해야 합니다’로 옮겨 손해 보전의 의무를 분명히 했습니다.
  alternative_readings:
  - 갚아야 합니다
  - 지불해야 합니다
  rationale: 본문은 일반적 금전 지급이 아니라 훼손·사망에 대한 법적 보상 책임을 규정하므로, 한국어에서도 그 법적 성격을 분명히 드러내는 표현이 적절합니다.
  doctrine_reference: 토라의 배상 규정
