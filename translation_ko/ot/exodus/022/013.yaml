  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘부서지다’이지만, 빌린 대상이 짐승일 수도 있으므로 영어 POB의 취지를 따라 ‘다치다’로 넓게 옮겼습니다.
- source_word: שַׁלֵּ֥ם יְשַׁלֵּֽם
  english_pob_choice: he shall surely make restitution
  chosen_korean: 반드시 배상해야 합니다
  alternatives_korean:
  - 반드시 갚아야 합니다
  - 온전히 갚아야 합니다
  lexicon: HALOT
  rationale: 단순한 ‘지불’보다 손해를 메우는 법적 책임을 드러내기 위해 ‘배상하다’를 사용했고, 강조용 부정사절을 ‘반드시’로 살렸습니다.
theological_decisions:
- issue: 법률 문맥에서의 책임 표현
  chosen_reading: ‘make restitution’를 ‘배상해야 합니다’로 옮겨 손해 보전의 의무를 분명히 했습니다.
  alternative_readings:
  - 갚아야 합니다
  - 지불해야 합니다
  rationale: 본문은 일반적 금전 지급이 아니라 훼손·사망에 대한 법적 보상 책임을 규정하므로, 한국어에서도 그 법적 성격을 분명히 드러내는 표현이 적절합니다.
  doctrine_reference: 토라의 배상 규정
