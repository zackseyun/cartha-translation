  to: 그러나 해가 그 사람 위에 떠올랐다면[a], 그를 죽인 사람에게는 피를 흘린 책임이 있습니다[b]. 그 도둑은 반드시 배상해야 합니다. 그에게 아무것도 없으면, 그는 그의 도둑질에 대하여 팔려야 합니다[c].
  rationale: 원문의 시간 조건과 ‘피 흘린 책임’이라는 법적 표현을 유지하되, 한국어에서 대명사만으로는 혼동되는 책임 주체를 ‘그를 죽인 사람’으로 밝혔습니다. 이어지는 배상과 매각의 주체도 ‘그 도둑’으로 명시하여 히브리어 법문이 전제하는 두 인물을 정확히 구별했습니다. 각주는 원문의 직역적 시간 표현, 피 흘린 책임의 법적 귀속, 매각의 채무 변제 기능을 각각 설명합니다.
