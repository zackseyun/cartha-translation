source:
  edition: WLC
  text: אִם זָרְחָ֥ה הַ/שֶּׁ֛מֶשׁ עָלָ֖י/ו דָּמִ֣ים ל֑/וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם אֵ֣ין ל֔/וֹ וְ/נִמְכַּ֖ר בִּ/גְנֵבָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'if it happens after sunrise' or 'if it is done in daylight.' The Hebrew reads literally, 'if the sun has risen on him.'
    reason: lexical_alternative
  - marker: b
    text: That is, the killer would incur bloodguilt in this circumstance.
    reason: alternative_reading
  - marker: c
    text: This sale is a debt remedy for theft when the thief lacks the means to make restitution.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 해가 그 사람 위에 떠올랐다면[a], 그를 죽인 사람에게는 피를 흘린 책임이 있습니다[b]. 그 도둑은 반드시 배상해야 합니다. 그에게 아무것도 없으면, 그는 그의 도둑질에 대하여 팔려야 합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 해석하여, ‘해가 뜬 뒤라면’ 또는 ‘낮에 일어난 일이라면.’ 히브리어는 직역하면 ‘해가 그 사람 위에 떠올랐다면’입니다.
    reason: lexical_alternative
  - marker: b
    text: 곧, 이 경우 그 도둑을 죽인 사람은 피를 흘린 책임을 지게 됩니다.
    reason: alternative_reading
  - marker: c
    text: 이는 도둑이 배상할 재산이나 수단이 없을 때, 도둑질에 대한 배상을 위해 그를 매각하는 채무 변제 조치입니다.
    reason: cultural_note
