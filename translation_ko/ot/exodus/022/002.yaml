id: EXO.22.2
reference: Exodus 22:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם זָרְחָ֥ה הַ/שֶּׁ֛מֶשׁ עָלָ֖י/ו דָּמִ֣ים ל֑/וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם אֵ֣ין ל֔/וֹ וְ/נִמְכַּ֖ר בִּ/גְנֵבָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'if it happens after sunrise' or 'if it is done in daylight.' The Hebrew reads literally, 'if the sun has risen on him.'
    reason: lexical_alternative
  - marker: b
    text: That is, the killer would incur bloodguilt in this circumstance.
    reason: alternative_reading
  - marker: c
    text: This sale is a debt remedy for theft when the thief lacks the means to make restitution.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 해가 그 사람 위에 떠올랐으면, 그에게는 피의 책임이 있습니다. 그는 반드시 배상해야 합니다. 그가 가진 것이 없으면, 그는 자기 도둑질 때문에 팔려야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  english_pob_choice: But if
  chosen_korean: 그러나 … 하면
  alternatives_korean:
  - 만일 … 하면
  - 그러나 만일 … 하면
  lexicon: HALOT
  rationale: 앞 절과 대비되는 조건을 드러내기 위해 단순 조건문보다 역접을 살린 ‘그러나’를 두었습니다.
- source_word: זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  english_pob_choice: the sun has risen on him
  chosen_korean: 해가 그 사람 위에 떠올랐으면
  alternatives_korean:
  - 해가 그 사람 위에 떠올랐으면
  - 해가 그 위로 떠올랐으면
  - 해가 그에게 비쳤으면
  lexicon: HALOT
  rationale: 히브리어의 직설적인 이미지(‘해가 … 위에 떠오르다’)를 유지하되 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: דָּמִים לוֹ
  english_pob_choice: there is bloodguilt for him
  chosen_korean: 그에게는 피의 책임이 있습니다
  alternatives_korean:
  - 그에게는 피의 책임이 있습니다
  - 그는 피를 흘린 책임이 있습니다
  - 그는 살인 책임이 있습니다
  lexicon: HALOT
  rationale: 법정 문맥의 דמים를 ‘피의 책임’으로 옮겨, 단순한 감정적 표현이 아니라 법적 책임을 드러냈습니다.
- source_word: שַׁלֵּם יְשַׁלֵּם
  english_pob_choice: He must surely make restitution
  chosen_korean: 그는 반드시 배상해야 합니다
  alternatives_korean:
  - 그는 반드시 배상해야 합니다
  - 그는 반드시 갚아야 합니다
  - 그는 반드시 보상해야 합니다
  lexicon: HALOT
  rationale: 중복형으로 강화된 의무를 한국어의 ‘반드시’로 살리고, चोरी에 대한 법적 보상을 뜻하는 문맥에 맞춰 ‘배상’으로 옮겼습니다.
- source_word: וְנִמְכַּר בִּגְנֵבָתוֹ
  english_pob_choice: he shall be sold for his theft
  chosen_korean: 그는 자기 도둑질 때문에 팔려야 합니다
  alternatives_korean:
  - 그는 자기 도둑질 때문에 팔려야 합니다
  - 그는 자기 도둑질로 인해 팔려야 합니다
  - 그는 자기 도둑질의 대가로 팔려야 합니다
  lexicon: HALOT
  rationale: 문맥상 빚을 갚기 위한 종속 판매를 가리키므로 ‘도둑질 때문에’로 원인 관계를 살렸고, 소유격 표현을 유지해 책임의 귀속을 분명히 했습니다.
theological_decisions:
- issue: 해가 뜬 뒤 침입자를 죽인 경우의 법적 책임
  chosen_reading: 본문은 해가 뜬 뒤에는 침입자를 죽이는 경우 피의 책임이 발생한다고 직접 말합니다.
  alternative_readings:
  - 일반적인 위협 상황의 구분으로 완화해 읽을 수 있습니다.
  - 시간 표현을 단순한 ‘낮’의 상징으로 볼 수 있습니다.
  rationale: 직전 절과의 대조를 흐리지 않기 위해, 구체적 시간 표현과 법적 책임을 함께 보존했습니다.
  doctrine_reference: 본문의 법적 긴장을 그대로 보존
