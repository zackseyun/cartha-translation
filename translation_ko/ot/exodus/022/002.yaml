  lexicon: HALOT
  rationale: 문맥상 빚을 갚기 위한 종속 판매를 가리키므로 ‘도둑질 때문에’로 원인 관계를 살렸고, 소유격 표현을 유지해 책임의 귀속을 분명히 했습니다.
theological_decisions:
- issue: 해가 뜬 뒤 침입자를 죽인 경우의 법적 책임
  chosen_reading: 본문은 해가 뜬 뒤에는 침입자를 죽이는 경우 피의 책임이 발생한다고 직접 말합니다.
  alternative_readings:
  - 일반적인 위협 상황의 구분으로 완화해 읽을 수 있습니다.
  - 시간 표현을 단순한 ‘낮’의 상징으로 볼 수 있습니다.
  rationale: 직전 절과의 대조를 흐리지 않기 위해, 구체적 시간 표현과 법적 책임을 함께 보존했습니다.
  doctrine_reference: 본문의 법적 긴장을 그대로 보존
