source:
  edition: WLC
  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
  footnotes:
  - marker: a
    text: Or, 'shall be put under the ban' or 'shall be utterly destroyed.' The Hebrew verb carries the idea of being devoted irrevocably to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 누구든지 어떤 신에게 제사를 드리면, 오직 야훼께 드리는 제사가 아니라면 멸망에 바쳐질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멸망에 바쳐질 것입니다’는 히브리어 동사 חָרַם에서 나온 말로, 어떤 것을 되돌릴 수 없이 금령 아래 두어 멸망에 바치는 것을 뜻합니다. 또는 ‘진멸에 바쳐질 것입니다’라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  english_pob_choice: Whoever sacrifices
  chosen_korean: 누구든지 ... 제사를 드리면
  alternatives_korean:
  - 제사드리는 자는
  - 누구든지 희생제물을 바치면
  lexicon: HALOT
  rationale: 히브리어 분사형을 한국어에서는 주어가 드러나는 조건문으로 자연스럽게 풀어 주되, 제의적 ‘희생 제사’의 의미를 살리기 위해 ‘제사를 드리다’를 택했습니다.
- source_word: לָאֱלֹהִים
  english_pob_choice: to any god
  chosen_korean: 어떤 신에게
  alternatives_korean:
  - 어느 신에게나
  - 신들에게
  - 하나님께
  lexicon: HALOT
  rationale: 문맥상 야훼 외의 우상 숭배를 가리키므로, 복수형의 형식보다 분배적 의미를 살린 ‘어떤 신’이 가장 정확합니다.
- source_word: יָחֳרָם
  english_pob_choice: shall be devoted to destruction
  chosen_korean: 멸절에 넘겨집니다
  alternatives_korean:
  - 진멸에 바쳐집니다
  - 멸망하도록 바쳐집니다
  - 저주 아래 놓입니다
  lexicon: HALOT
  rationale: חֵרֶם의 단순한 ‘파괴’보다, 하나님께 속한 심판 아래 완전히 넘겨진다는 법적·제의적 무게를 살리면서도 현대 한국어에서 이해되도록 옮겼습니다.
- source_word: לַיהוָה לְבַדּוֹ
  english_pob_choice: to Yahweh alone
  chosen_korean: 야훼에게만
  alternatives_korean:
  - 야훼께만
  - 야훼에게만 드리는 경우가 아니면
  - 오직 야훼께만
  lexicon: HALOT
  rationale: יהוה는 본문 지시에 따라 ‘야훼’로 옮기고, לְבַדּוֹ의 배타성을 한국어 부사격 ‘-에게만’으로 간명하게 반영했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 절은 야훼의 고유한 언약명을 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: חרם(חָרַם) 형벌의 뉘앙스
  chosen_reading: 멸절에 넘겨집니다
  alternative_readings:
  - 진멸에 바쳐집니다
  - 완전히 멸망합니다
  - 바나 아래 놓입니다
  rationale: 이 표현은 단순 처형이 아니라 전면적인 금지와 파멸의 상태에 넘겨지는 법적·신학적 개념을 담고 있으므로, 그 긴장을 보존하는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
