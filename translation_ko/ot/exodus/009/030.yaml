  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
  footnotes:
  - marker: a
    text: Or 'you still do not fear' or 'before you fear the LORD God.' The Hebrew term can express temporal priority ('before') or the sense 'not yet' in context.
