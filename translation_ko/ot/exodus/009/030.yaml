  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
  footnotes:
  - marker: a
    text: Or 'you still do not fear' or 'before you fear the LORD God.' The Hebrew term can express temporal priority ('before') or the sense 'not yet' in context.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''the LORD'' represents the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 하지만 당신과 당신의 신하들에 대해서는, 당신이 아직 야훼 하나님을 두려워하지 않는다는 것을 제가 압니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 טֶרֶם은 문맥에 따라 시간적 우선성인 '…하기 전에' 또는 여기처럼 '아직 …하지 않다'의 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에서 '야훼'는 신적 이름 YHWH를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: But as for you
  chosen_korean: 하지만 당신과
  alternatives_korean:
  - 그리고 당신은
  - 당신은
  lexicon: HALOT
  rationale: 독립 인칭대명사와 접속사가 앞선 재앙 종료 선언과 대비를 이루므로, 한국어에서는 '하지만'으로 대조를 살리고 대상 표지를 덧붙여 초점을 드러냈습니다.
- source_word: וַעֲבָדֶיךָ
  english_pob_choice: and your servants
  chosen_korean: 당신의 신하들
  alternatives_korean:
  - 당신의 종들
  - 당신의 관리들
  lexicon: HALOT
  rationale: 바로의 궁정 맥락에서 עֶבֶד는 일반적 '종'보다 궁정 신하/시종의 뉘앙스가 강하므로, 과도한 노예성을 드러내지 않으면서 문맥에 맞는 '신하들'로 옮겼습니다.
- source_word: יָדַעְתִּי
  english_pob_choice: I know
  chosen_korean: 제가 압니다
  alternatives_korean:
  - 제가 압니다
  - 알고 있습니다
  lexicon: HALOT
  rationale: 완료형이 현재의 확고한 인식을 나타내므로, 한국어 현재형으로 자연스럽게 옮겼습니다.
- source_word: טֶרֶם תִּירְאוּן
  english_pob_choice: you do not yet fear
  chosen_korean: 아직 … 두려워하지 않는다는
  alternatives_korean:
  - 아직 … 두려워하지 않는다는
  - 아직 … 경외하지 않는다는
  lexicon: HALOT
  rationale: טֶרֶם은 여기서 '아직'의 시간적 뉘앙스를 가지며, ירא는 하나님 앞에서의 두려움과 경외를 함께 품으므로, 소스의 긴장을 살려 '두려워하지 않는다'로 유지했습니다.
- source_word: יְהוָה אֱלֹהִים
  english_pob_choice: Yahweh God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 여호와 하나님
  - 주 하나님
  lexicon: HALOT
  rationale: 신명기적 문맥의 고유명 יְהוָה는 POB 기준에 따라 '야훼'로 옮기고, אַלֹהִים은 한국어 관용에 맞게 '하나님'으로 결합했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 tetragrammaton을 직접 사용하므로, 번역어 대신 고유 신명 '야훼'를 보존해 원문이 주는 언약적 인격성을 유지했습니다.
  doctrine_reference: POB glossary — יהוה / YHWH → 야훼
- issue: ירא의 의미 범위
  chosen_reading: 두려워하지 않다
  alternative_readings:
  - 경외하지 않다
  - 무서워하지 않다
  rationale: 바로가 재앙 앞에서도 하나님께 합당한 반응을 보이지 않는다는 긴장을 살리기 위해, 지나치게 부드러운 '경외'만으로 좁히지 않고 '두려워하지 않다'로 옮겼습니다.
  doctrine_reference: 'English POB theological decision: fear preserves the Hebrew''s tension between dread and reverence'
