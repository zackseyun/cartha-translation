id: EXO.9.10
reference: Exodus 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְח֞וּ אֶת פִּ֣יחַ הַ/כִּבְשָׁ֗ן וַ/יַּֽעַמְדוּ֙ לִ/פְנֵ֣י פַרְעֹ֔ה וַ/יִּזְרֹ֥ק אֹת֛/וֹ מֹשֶׁ֖ה הַ/שָּׁמָ֑יְמָ/ה וַ/יְהִ֗י שְׁחִין֙ אֲבַעְבֻּעֹ֔ת פֹּרֵ֕חַ בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
  footnotes:
  - marker: a
    text: Or 'ashes from the furnace.' The Hebrew more specifically suggests soot or fine black powder from a kiln/furnace.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'on man and on beast,' a collective way of saying the outbreak affected humans and animals.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 가마의 그을음을 가져다가 바로 앞에 섰습니다. 모세가 그것을 하늘을 향해 뿌렸고, 사람과 짐승에게 물집이 돋는 종기가 생겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּיחַ
  english_pob_choice: soot
  chosen_korean: 그을음
  alternatives_korean:
  - 재
  - 검은 가루
  - 연탄재
  lexicon: HALOT
  rationale: פִּיחַ는 일반적인 재보다 고운 검은 찌꺼기인 그을음에 가깝기 때문에, 한국어에서도 가장 직접적인 대응인 ‘그을음’으로 옮겼습니다.
- source_word: הַכִּבְשָׁן
  english_pob_choice: the kiln
  chosen_korean: 용광로
  alternatives_korean:
  - 가마
  - 화덕
  - 풀무로
  lexicon: HALOT
  rationale: 문맥상 불에 달궈진 산업용 화덕/용기를 가리키므로, 현대 한국어에서 고열의 가마를 떠올리게 하는 ‘용광로’가 가장 자연스럽고 구체적입니다.
- source_word: הַשָּׁמָיְמָה
  english_pob_choice: toward the sky
  chosen_korean: 하늘로
  alternatives_korean:
  - 하늘을 향해
  - 천으로
  - 하늘 쪽으로
  lexicon: HALOT
  rationale: 방향성을 가진 전치사적 표현이므로, 과도한 해석을 덧붙이지 않는 간결한 방향 표현인 ‘하늘로’를 택했습니다.
- source_word: אֲבַעְבֻּעֹת פֹּרֵחַ
  english_pob_choice: boils with blisters breaking out
  chosen_korean: 물집이 있는 종기
  alternatives_korean:
  - 물집이 터지는 종기
  - 부스럼이 돋는 종기
  - 종기와 물집
  lexicon: HALOT
  rationale: שְׁחִין과 아바브부오트의 결합은 단순한 종기보다 물집/수포가 동반된 피부 병변을 가리키므로, ‘물집이 있는 종기’로 압축해 의미를 보존했습니다.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  english_pob_choice: on man and on beast
  chosen_korean: 사람과 짐승에게서
  alternatives_korean:
  - 사람과 짐승 위에
  - 인간과 짐승에게
  - 사람과 짐승에게
  lexicon: HALOT
  rationale: 히브리어의 집합적 대조를 살리면서도 한국어에서는 병변의 발생 위치를 자연스럽게 드러내기 위해 ‘사람과 짐승에게서’로 옮겼습니다.
theological_decisions:
- issue: אָדָם을 남성 단수로 오해하지 않게 하면서도 집합적 대조를 유지하는 방법
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 사람들
  rationale: 여기서는 짐승과 대비되는 일반 인간 전체를 가리키므로, 남성 특정성을 줄이면서도 집합적 의미를 유지하는 ‘사람’이 가장 균형 잡힌 표현입니다.
  doctrine_reference: 'DOCTRINE.md: contested terms for אָדָם; source text contrast with בְּהֵמָה'
