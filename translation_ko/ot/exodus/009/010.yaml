  - severity: medium
    issue: 피부 병변의 수식 관계가 불명확하고 어색합니다.
    rationale: פֹּרֵחַ은 물집/수포가 돋아나는 상태를 나타냅니다. ‘물집이 돋는 종기’는 이를 자연스럽게 반영하지만, 기존 표현은 물집이 사람과 짐승에게서 터져 나오는 것으로 읽힐 수 있습니다.
  revised_text: 그들은 가마의 그을음을 가져다가 바로 앞에 섰습니다. 모세가 그것을 하늘을 향해 뿌렸고, 사람과 짐승에게 물집이 돋는 종기가 생겼습니다.
