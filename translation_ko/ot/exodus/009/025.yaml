translation:
  language: ko
  text: 우박이 이집트 온 땅에서 들에 있던 모든 것, 곧 사람에서 짐승에 이르기까지 쳤습니다. 우박이 들의 모든 풀을 치고 들의 모든 나무를 부쉈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  english_pob_choice: struck
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 때렸습니다
  - 내리쳤습니다
  - 쳤습니다
  lexicon: HALOT
  rationale: נכה의 반복을 한국어에서 자연스럽게 살리면서, 심판 행위의 강한 타격감을 유지하기 위해 ‘치다’ 계열을 선택했습니다.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  english_pob_choice: throughout all the land of Egypt
  chosen_korean: 이집트 온 땅에
  alternatives_korean:
  - 이집트의 온 땅에
  - 이집트 전역에
  lexicon: HALOT
  rationale: 분포 전체를 가리키는 의미를 한국어로 간결하게 옮기되, 지리적 범위를 분명히 하기 위해 ‘온 땅’으로 번역했습니다.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  english_pob_choice: from man to beast
  chosen_korean: 사람에서부터 짐승에 이르기까지
  alternatives_korean:
  - 사람에서 짐승까지
  - 인간에서 짐승까지
  - 사람부터 짐승까지
  lexicon: HALOT
  rationale: 원문의 관용적 범위 표현을 한국어의 ‘에서부터 … 에 이르기까지’로 살려, 사람과 짐승 모두가 예외 없이 피해를 입었음을 드러냈습니다.
- source_word: שִׁבֵּר
  english_pob_choice: shattered
  chosen_korean: 부쉈습니다
  alternatives_korean:
  - 산산이 부쉈습니다
  - 깨뜨렸습니다
  - 꺾었습니다
  lexicon: HALOT
  rationale: 피엘형의 강한 파괴성을 반영하되, 한국어에서 지나치게 과장되지 않으면서도 충분히 강한 동사로 옮겼습니다.
theological_decisions:
- issue: 재앙 서술의 반복과 심판의 강조
  chosen_reading: 우박이 …을 쳤습니다 / 우박이 …을 부쉈습니다
  alternative_readings:
  - 우박이 …을 손상시켰습니다
  - 우박이 …을 망가뜨렸습니다
  rationale: 본문은 단순한 피해가 아니라 하나님의 심판으로서의 파괴를 반복적으로 강조하므로, 그 강도를 약화시키지 않는 동사를 유지했습니다.
  doctrine_reference: 출애굽기의 재앙 서술, 본문 수사 반복
