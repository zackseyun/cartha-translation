source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
  footnotes:
  - marker: a
    text: Hebrew 'the voices'; in this storm context the term refers to thunder.
    reason: lexical_alternative
  - marker: b
    text: Or, 'that the land belongs to the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 모세가 그에게 말했습니다. 「내가 성읍 밖으로 나가자마자 야훼께 손을 펼치겠습니다. 그러면 천둥이 그치고 우박도 다시는 내리지 않을 것입니다[b]. 이것은 당신이 땅이 야훼의 것임을 알게 하려는 것입니다。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 원문은 문자적으로 ‘소리들’이지만, 이 재앙 문맥에서는 천둥을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֵאתִי
  english_pob_choice: As soon as I have gone out
  chosen_korean: 내가 성읍 밖으로 나가자마자
  alternatives_korean:
  - 내가 성읍에서 나가면
  - 내가 성읍을 나갈 때
  lexicon: HALOT
  rationale: כְ + יצא의 시간적 용법을 한국어의 ‘-자마자’로 자연스럽게 살려, 모세가 즉시 행동할 것임을 분명히 했습니다.
- source_word: אֶפְרֹשׂ אֶת כַּפַּי
  english_pob_choice: I will spread out my hands
  chosen_korean: 야훼께 손을 펼치겠습니다
  alternatives_korean:
  - 야훼께 손을 벌리겠습니다
  - 야훼께 손을 뻗겠습니다
  lexicon: HALOT
  rationale: 기도의 몸짓을 나타내는 표현으로서 ‘손을 펼치다’가 원문의 제의적·간청적 뉘앙스를 비교적 직접적으로 전달합니다.
- source_word: הַקֹּלֹת
  english_pob_choice: the thunder
  chosen_korean: 천둥
  alternatives_korean:
  - 우레
  - 소리
  lexicon: HALOT
  rationale: 문맥상 우박 재앙과 함께 동반된 기상 현상을 가리키므로, 문자적 ‘소리’보다 한국어에서 바로 이해되는 ‘천둥’이 적절합니다.
- source_word: לַיהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼의 것
  alternatives_korean:
  - 야훼에게 속한
  - 야훼의 소유
  lexicon: HALOT
  rationale: 소유 관계를 한국어 관용으로 옮겨 ‘~의 것’으로 처리해, הארץ에 대한 야훼의 주권을 분명하게 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 본문의 יְהוָה를 야훼로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 역본의 기본 원칙에 따라 여호와 전통 표기보다 מקור의 고유한 언약 이름을 직접 드러내는 ‘야훼’를 사용했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
- issue: הָאָרֶץ의 범위
  chosen_reading: ‘땅’으로 옮겨 야훼의 소유권과 주권을 보존했습니다.
  alternative_readings:
  - 세상
  - 땅(땅/나라)
  rationale: 여기서는 파라오와의 대결 속에서 특정 지역을 넘는 우주적 선언이라기보다, 눈앞의 땅과 그 위에 대한 야훼의 소유권을 강조하는 문맥이므로 ‘땅’이 가장 직접적입니다.
  doctrine_reference: Translation philosophy §1, §3, §5
