id: EXO.9.35
reference: Exodus 9:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or traditionally 'the children of Israel'; Hebrew 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'by the hand of Moses,' an idiom meaning 'through Moses.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Pharaoh’s heart grew hard.' The Hebrew verb can mean 'became strong/firm,' here in the sense of stubborn hardening.
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 바로의 마음이 굳어졌고, 그는 이스라엘 자손을 보내지 않았습니다. 야훼께서 모세를 통해 말씀하신 그대로였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로의 마음이 강해졌다/굳세졌다’. 히브리어 동사는 ‘강해지다, 굳세어지다’의 뜻도 가질 수 있으며, 여기서는 완고함의 의미로 쓰였습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘모세의 손으로’입니다. 히브리어 관용구로, ‘모세를 통해’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이스라엘 사람들’ 혹은 전통적으로 ‘이스라엘 자손들’. 히브리어는 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק / לֵב פַּרְעֹה
  english_pob_choice: Pharaoh’s heart was hardened
  chosen_korean: 바로의 마음이 굳어졌고
  alternatives_korean:
  - 바로의 마음이 강해졌고
  - 바로의 마음이 굳어졌습니다
  - 바로의 마음이 완강해졌고
  lexicon: HALOT
  rationale: חזק는 여기서 ‘강해지다/굳세어지다’의 뜻을 가지며, 문맥상 바로의 완고함을 가리키므로 한국어는 직접적이되 지나치게 해석적인 ‘굳어졌고’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘이스라엘의 아들들’이지만, 합쇼체 현대 한국어에서 문맥을 유지하면서도 자연스럽게 들리는 공용어형인 ‘이스라엘 자손’을 택했습니다.
- source_word: שִׁלַּח
  english_pob_choice: let ... go
  chosen_korean: 보내지 않았습니다
  alternatives_korean:
  - 떠나게 하지 않았습니다
  - 내보내지 않았습니다
  - 풀어 주지 않았습니다
  lexicon: HALOT
  rationale: 출애굽기에서는 이 동사가 이스라엘의 출발 허용을 뜻하므로, ‘보내다’의 부정형이 가장 직접적으로 해당 행위를 드러냅니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: through Moses
  chosen_korean: 모세를 통해
  alternatives_korean:
  - 모세의 손을 통해
  - 모세로 말미암아
  - 모세의 손으로
  lexicon: HALOT
  rationale: ‘~의 손으로/손을 통해’라는 히브리 관용구를 현대 한국어에서 자연스럽게 풀어, 매개된 전달이라는 뜻을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 표준 원칙에 따라 신적 고유명사를 ‘야훼’로 옮겨, 호칭이 아닌 이름이라는 점을 드러냈습니다.
theological_decisions:
- issue: 바로의 마음이 ‘굳어짐’의 원인 표현
  chosen_reading: 이 절은 바로의 내적 완고함을 서술하지만, 직접적으로 하나님이 굳게 하셨다고 이 절 안에서 명시하지는 않습니다.
  alternative_readings:
  - 하나님이 바로의 마음을 굳게 하셨다
  - 바로가 자기 마음을 굳게 했다
  rationale: 히브리어 동사 자체가 ‘강해지다/굳세어지다’의 상태 변화를 가리키므로, 이 절의 수준에서는 원인 귀속을 덧붙이지 않고 서술적 긴장을 보존했습니다.
  doctrine_reference: 문맥 전체의 신학적 긴장을 보존하고 절 단위의 과잉해석을 피함
