lexical_decisions:
- source_word: לֹא שָׂם לִבּוֹ אֶל
  english_pob_choice: did not pay attention to
  chosen_korean: 주의를 기울이지 않은
  alternatives_korean:
  - 마음에 두지 않은
  - 귀를 기울이지 않은
  - 마음을 두지 않은
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘마음을 두다’이지만, 문맥상 야훼의 경고를 실제로 heed 하지 않은 뜻이므로 현대 한국어에서 자연스러운 ‘주의를 기울이지 않은’으로 옮겼습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 메시지
  - 주님의 말씀
  lexicon: HALOT
  rationale: דָּבָר는 이 문맥에서 선포된 경고의 ‘말씀’이 가장 적절하며, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 노예들
  - 그의 일꾼들
  - 그의 하인들
  lexicon: HALOT
  rationale: 여기서는 신분상의 강한 강조보다 소유한 집안 인력/부하를 가리키는 문맥이므로, ‘노예’보다 중립적이면서도 원문의 종속 관계를 유지하는 ‘종들’이 적절합니다.
- source_word: מִקְנֵהוּ
  english_pob_choice: his livestock
  chosen_korean: 그의 가축
  alternatives_korean:
  - 그의 가축 떼
  - 그의 가축들
  - 그의 가축과 짐승들
  lexicon: HALOT
  rationale: מִקְנֶה는 가축 재산 전체를 가리키므로, 한국어에서는 간결하고 자연스러운 집합명사인 ‘가축’으로 옮겼습니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the field
  chosen_korean: 들에 남겨 두었습니다
  alternatives_korean:
  - 들판에 남겨 두었습니다
  - 들에 두었습니다
  - 들판에 버려 두었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘들에’이지만, 동사가 함께 나타내는 결과는 위험한 장소에 ‘남겨 둠’입니다. 문맥상 재앙 앞에 노출된 상태를 살리기 위해 ‘남겨 두었습니다’로 풀었습니다.
