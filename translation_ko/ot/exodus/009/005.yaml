    text: Or “an appointed time” or “a set time.”
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 한 시각[a]을 정하셨습니다. 말씀하시기를 “내일 야훼께서 이 일을 이 땅에서 행하십니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정해진 때” 혹은 “지정된 때”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: set
  chosen_korean: 정하셨습니다
  alternatives_korean:
  - 세우셨습니다
  - 지정하셨습니다
  - 정해 두셨습니다
  lexicon: HALOT
  rationale: מוֹעֵד와 결합된 ‘set a time’의 의미를 자연스럽게 살리면서, 일정이나 시각을 확정하는 뉘앙스를 담기 위해 ‘정하다’를 택했습니다.
- source_word: מוֹעֵד
  english_pob_choice: a time
  chosen_korean: 한 시각
  alternatives_korean:
  - 한 때
  - 정한 때
  - 임명된 시각
  lexicon: HALOT
  rationale: 문맥상 ‘내일’로 구체화되는 정해진 시점을 가리키므로, 한국어에서는 지나치게 격식적인 ‘임명된 시각’보다 간결한 ‘한 시각’이 원문에 가깝습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 고유 신명은 대체 호칭이 아니라 하나님의 언약적 이름으로 드러나므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַדָּבָר הַזֶּה
  english_pob_choice: this thing
  chosen_korean: 이 일
  alternatives_korean:
  - 이 일곱?
  - 이 사건
  - 이 일들
  lexicon: HALOT
  rationale: פְּלָג? here? Actually דָּבָר는 ‘말씀/일/사건’의 폭이 있으나, 재앙 선포의 성취를 가리키는 문맥이므로 한국어에서 가장 자연스럽고 직접적인 ‘이 일’이 적절합니다.
theological_decisions:
- issue: 문장 속 야훼의 직접 화법을 어떻게 표기할지
  chosen_reading: 직접 인용부를 유지하고, 화자 표지는 서술문에서 합쇼체로 처리했습니다.
  alternative_readings:
  - 모든 구절을 평서문으로 통합하는 방식
  - 인용문 안에서도 종결을 서술체로 동일화하는 방식
  rationale: 본문은 ‘야훼께서 … 말씀하시기를’로 도입되는 직접 화법이므로, 선언의 긴박함을 보존하기 위해 따옴표를 유지했습니다.
  doctrine_reference: Narrative discourse consistency in source-grounded translation
