    rationale: מוֹעֵד는 여기서 ‘정해진 때/기한’을 뜻하며, 바로 뒤의 ‘내일’이 그 때를 구체화합니다. ‘시각’은 시계상의 특정 시간을 뜻하는 경향이 있어 적절하지 않습니다.
