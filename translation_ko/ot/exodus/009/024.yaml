base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
  footnotes:
  - marker: a
    text: Or 'and fire was darting in the midst of the hail'; the Hebrew uses the literal term 'fire,' likely describing lightning-like flashes within the storm.
    reason: lexical_alternative
translation:
  language: ko
  text: 우박이 내리고, 그 우박 가운데 번개처럼 번쩍이는 불이 있었습니다. 그것은 매우 심하여, 그 같은 것은 이집트 온 땅이 나라가 된 이래로 한 번도 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘불’이라고 말하지만, 폭풍 속 번쩍임을 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָרָד
  english_pob_choice: hail
  chosen_korean: 우박
  alternatives_korean:
  - 우박덩이
  - 얼음비
  lexicon: HALOT
  rationale: 날씨 재앙을 가리키는 기본어이므로 자연스럽게 ‘우박’으로 옮겼습니다.
- source_word: וְאֵשׁ מִתְלַקַּחַת
  english_pob_choice: and fire flashing
  chosen_korean: 번개처럼 번쩍이는 불
  alternatives_korean:
  - 불이 번쩍이며 타오르는
  - 번쩍이는 불
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘불’이지만 폭풍 속 번뜩임을 가리키는 맥락이므로, 본문의 불 이미지를 살리면서도 독자가 자연스럽게 번개 같은 현상으로 이해하도록 옮겼습니다.
- source_word: כָּבֵד מְאֹד
  english_pob_choice: very severe
  chosen_korean: 매우 심하여
  alternatives_korean:
  - 매우 무거워
  - 극심하여
  lexicon: HALOT
  rationale: ‘무겁다’의 직역보다 재앙의 강도를 나타내는 한국어 표현이 더 정확하므로 ‘매우 심하여’로 처리했습니다.
- source_word: מֵאָז הָיְתָה לְגוֹי
  english_pob_choice: since it became a nation
  chosen_korean: 나라가 된 이래로
  alternatives_korean:
  - 민족이 된 이래로
  - 한 나라가 된 뒤로
  lexicon: HALOT
  rationale: 히브리어의 역사적 기준점을 간결하게 살리기 위해 ‘나라가 된 이래로’로 옮겼습니다.
theological_decisions:
- issue: אֵשׁ를 '불'로 유지할지 '번개'로 해석할지
  chosen_reading: 본문의 직접 표현은 ‘불’로 유지하되, 폭풍 현상으로서의 번뜩임이 드러나도록 ‘번개처럼 번쩍이는’이라는 설명적 수식을 더했습니다.
  alternative_readings:
  - 직역하여 ‘불’만 두는 읽기
  - 해석하여 ‘번개’로만 번역하는 읽기
  rationale: 히브리어 원어가 실제로 ‘불’을 말하므로 본문 이미지 자체를 지우지 않으면서, 문맥상 자연스러운 현상 이해를 돕는 절충이 필요했습니다.
  doctrine_reference: 성경 본문의 감각적 이미지 보존과 문맥적 해석의 균형
