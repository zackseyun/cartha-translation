  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
  footnotes:
  - marker: a
    text: Or 'the one among Pharaoh’s servants who feared the word of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'caused to flee'; that is, he quickly brought them under shelter.
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오의 신하들 가운데 야훼의 말씀을 두려워한 사람은 자기 종들과 가축을 급히 집 안으로 들여보냈습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파라오의 신하들 가운데 야훼의 말씀을 두려워한 사람’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘도망하게 했다’는 뜻으로, 곧 그들을 서둘러 피할 곳으로 옮겼다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  english_pob_choice: Whoever ... feared
  chosen_korean: 두려워한 사람은
  alternatives_korean:
  - 두려워한 이는
  - 두려워한 자는
  lexicon: HALOT
  rationale: בהחלק된 분사구문은 특정 집단 가운데 해당 특성을 가진 사람을 가리키므로, 한국어에서는 자연스럽게 ‘두려워한 사람’으로 풀어 집합적 의미를 살렸습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 말씀
  lexicon: HALOT
  rationale: דָּבָר는 단순한 ‘말’보다 ‘말씀/선언’의 무게를 가지므로, POB의 ‘word of Yahweh’를 따라 ‘야훼의 말씀’으로 옮겼습니다.
- source_word: הֵנִיס
  english_pob_choice: hurried
  chosen_korean: 급히 들여보냈습니다
  alternatives_korean:
  - 서둘러 들여보냈습니다
  - 급히 피신시켰습니다
  lexicon: HALOT
  rationale: 히필형 נוּס는 ‘도망하게 하다/급히 옮기다’의 의미를 가지며, 여기서는 사람과 가축을 비와 우박을 피하도록 실내로 옮기는 상황이므로 ‘급히 들여보냈습니다’가 원문의 긴박함을 자연스럽게 반영합니다.
- source_word: מִקְנֵהוּ
  english_pob_choice: his livestock
  chosen_korean: 가축
  alternatives_korean:
  - 가축들
  - 짐승
  lexicon: HALOT
  rationale: מִקְנֶה는 일반적으로 가축 재산을 가리키므로, 현대 한국어에서 가장 넓고 정확한 ‘가축’을 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
