  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로, POB의 표준에 따라 대체 칭호가 아닌 신명사적 고유명인 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
