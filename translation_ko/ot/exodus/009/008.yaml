  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ קְח֤וּ לָ/כֶם֙ מְלֹ֣א חָפְנֵי/כֶ֔ם פִּ֖יחַ כִּבְשָׁ֑ן וּ/זְרָק֥/וֹ מֹשֶׁ֛ה הַ/שָּׁמַ֖יְמָ/ה לְ/עֵינֵ֥י פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
  footnotes:
  - marker: a
    text: Or 'full handfuls'; literally 'the fullness of your hands.'
    reason: lexical_alternative
  - marker: b
    text: '''Soot'' may also be rendered ''fine soot'' or, more generally, ''ashes,'' though the Hebrew points more specifically to soot from a furnace.'
    reason: lexical_alternative
  - marker: c
    text: Or 'toward heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 모세와 아론에게 말씀하셨습니다. “너희를 위해 가득 한 움큼씩 화덕의 그을음을 가져오너라. 그리고 모세가 그것을 바로의 눈앞에서 하늘로 날려 보내라.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가득 한 움큼들’; 문자적으로는 ‘너희 손의 충만’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그을음’은 ‘고운 그을음’ 또는 더 일반적으로 ‘재’로도 옮길 수 있으나, 히브리어는 화덕에서 나온 그을음을 더 구체적으로 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하늘을 향해’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명표기는 직함이 아니라 고유한 언약 이름이므로, 관례적 대체어인 ‘주님’보다 음역형 ‘야훼’를 사용해 원문 구분을 보존합니다.
- source_word: מְלֹא חָפְנֵיכֶם
  english_pob_choice: handfuls
  chosen_korean: 가득 한 움큼씩
  alternatives_korean:
  - 한 움큼씩
  - 손바닥 가득
  lexicon: HALOT
  rationale: 직역하면 ‘손의 충만’이지만, 문맥상 수량을 나타내는 관용을 살리기 위해 ‘가득 한 움큼씩’으로 옮겨 복수형의 분배감도 함께 드러냈습니다.
- source_word: פִּיחַ כִּבְשָׁן
  english_pob_choice: soot from a furnace
  chosen_korean: 화덕의 그을음
  alternatives_korean:
  - 용광로의 그을음
  - 화덕의 재
  - 가마의 그을음
  lexicon: HALOT
  rationale: פִּיחַ는 일반적 ‘재’보다 화덕에서 나온 검은 그을음에 가깝기 때문에, EN POB의 ‘soot from a furnace’에 맞춰 ‘화덕의 그을음’으로 구체화했습니다.
- source_word: הַשָּׁמַיְמָה
  english_pob_choice: toward the sky
  chosen_korean: 하늘로
  alternatives_korean:
  - 하늘을 향해
  - 하늘 쪽으로
  lexicon: HALOT
  rationale: 방향성 있는 목적격/부사격 표현이므로, 물리적 상향 동작을 자연스럽게 드러내는 ‘하늘로’를 택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 야훼의 직접 발화를 기록하므로, 제목형 대체어를 쓰지 않고 고유 이름을 유지해 언약적 발화 주체를 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
