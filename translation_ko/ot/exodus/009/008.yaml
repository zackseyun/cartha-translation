  rationale: 본문은 야훼의 직접 발화를 기록하므로, 제목형 대체어를 쓰지 않고 고유 이름을 유지해 언약적 발화 주체를 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
