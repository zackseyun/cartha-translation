revisions:
- from: 그러자 야훼께서 모세와 아론에게 말씀하셨습니다. “너희를 위해 가득 한 움큼씩 화덕의 그을음을 가져오너라. 그리고 모세가 그것을 바로의 눈앞에서 하늘로 날려 보내라.”[a][b][c]
  to: 그러자 야훼께서 모세와 아론에게 말씀하셨습니다. “너희는 화덕에서 나온 그을음[b]을 두 손에 가득[a] 가져오십시오. 모세는 그것을 바로의 눈앞에서 하늘을 향해[c] 뿌리십시오.”
  rationale: The revision restores the plural command to Moses and Aaron without the misleading addition “너희를 위해,” makes the subsequent instruction explicitly singular to Moses, uses formal-polite speech throughout, and renders the upward scattering action more precisely. It also places each footnote anchor at its relevant word or phrase and revises the first note into natural Korean.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Yahweh, the plural command to Moses and Aaron, furnace soot, and the subsequent singular action assigned to Moses. However, “너희를 위해” mistranslates the reflexive/dative nuance of לָכֶם, and “날려 보내라” is less precise than the commanded act of throwing/scattering the soot. The footnote anchors are also not placed at their corresponding terms.
  naturalness: The wording “가득 한 움큼씩” is understandable but somewhat awkward, and the quotation uses the blunt 하라체 (“가져오너라,” “보내라”) despite the required modern formal-polite 합쇼체. “두 손에 가득” is idiomatic while retaining the quantity expression.
  terminology: “야훼” appropriately preserves the divine name, and “화덕에서 나온 그을음” accurately represents פִּיחַ כִּבְשָׁן without unnecessarily specifying a particular industrial furnace. “바로” is the standard Korean biblical form of Pharaoh.
  issues:
  - severity: medium
    issue: “너희를 위해” for לָכֶם
    rationale: The phrase does not mean that the soot is to be taken for the benefit of the addressees. Here לָכֶם accompanies the imperative and is best conveyed by the command addressed directly to them, without adding “for yourselves.”
  - severity: medium
    issue: Register is not modern formal-polite 합쇼체
    rationale: The direct speech uses “가져오너라” and “보내라,” which are 하라체. The requested target register calls for forms such as “가져오십시오” and “뿌리십시오.”
  - severity: medium
    issue: “날려 보내라” weakens the specific action of וּזְרָקוֹ
    rationale: The verb denotes throwing/scattering the material upward. “뿌리십시오” naturally conveys this action in the plague context more accurately than merely sending it flying.
  - severity: low
    issue: Footnote markers are detached from their referents
    rationale: Markers a, b, and c should follow the quantity expression, “그을음,” and the directional expression respectively, rather than all appearing at the end of the quotation.
  - severity: low
    issue: Footnote a’s Korean alternative is unnatural
    rationale: “가득 한 움큼들” is not idiomatic Korean. A literal explanation, “너희 손에 가득 찬 것,” is clearer and closer to the Hebrew expression.
  revised_text: 그러자 야훼께서 모세와 아론에게 말씀하셨습니다. “너희는 화덕에서 나온 그을음[b]을 두 손에 가득[a] 가져오십시오. 모세는 그것을 바로의 눈앞에서 하늘을 향해[c] 뿌리십시오.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘한 움큼씩’. 문자적으로는 ‘너희 손에 가득 찬 것’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그을음’은 ‘고운 그을음’ 또는 더 일반적으로 ‘재’로도 옮길 수 있으나, 히브리어는 화덕에서 나온 그을음을 더 구체적으로 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘하늘로’.
    reason: lexical_alternative
  revision_rationale: The revision restores the plural command to Moses and Aaron without the misleading addition “너희를 위해,” makes the subsequent instruction explicitly singular to Moses, uses formal-polite speech throughout, and renders the upward scattering action more precisely. It also places each footnote anchor at its relevant word or phrase and revises the first note into natural Korean.
