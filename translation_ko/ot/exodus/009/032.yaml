base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
  footnotes:
  - marker: a
    text: Or 'the wheat and the spelt were not struck down, for they ripen late.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term for 'spelt' may refer to a related grain such as emmer.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 밀과 스펠트밀은 손상되지 않았습니다. 그것들은 늦게 익는 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밀과 스펠트밀은 손상되지 않았으니, 그것들이 늦게 익기 때문이다.’
    reason: alternative_reading
  - marker: b
    text: ‘스펠트밀’은 히브리어 כֻּסֶּמֶת의 흔한 현대 한국어 대응으로, 엠머밀을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחִטָּה
  english_pob_choice: But the wheat
  chosen_korean: 그러나 밀
  alternatives_korean:
  - 그리고 밀
  - 밀은
  lexicon: HALOT
  rationale: 문맥상 앞 절의 파괴된 작물들과 대조를 이루므로, 접속사 וְ를 단순한 ‘그리고’보다 대조를 살린 ‘그러나’로 옮겼습니다. חִטָּה는 표준적으로 ‘밀’입니다.
- source_word: וְהַכֻּסֶּמֶת
  english_pob_choice: and the spelt
  chosen_korean: 스펠트밀
  alternatives_korean:
  - 스펠트
  - 엠머밀
  - 호밀
  lexicon: HALOT
  rationale: כֻּסֶּמֶת은 고대 곡물로, 한국어에서는 ‘스펠트밀’이 의미를 가장 분명하게 전달합니다. 영어 POB의 ‘spelt’와도 대응됩니다.
- source_word: לֹא נֻכּוּ
  english_pob_choice: were not struck down
  chosen_korean: 손상되지 않았습니다
  alternatives_korean:
  - 타격을 입지 않았습니다
  - 쳐맞지 않았습니다
  - 치지 않았습니다
  lexicon: HALOT
  rationale: נכה의 수동형은 재앙으로 ‘치다/치심’을 받은 뜻이지만, 농작물에 대해서는 자연스러운 한국어로 ‘손상되다’가 의미를 잘 보존합니다. 다만 심판의 맥락은 문장 전체와 앞 절에서 유지됩니다.
- source_word: אֲפִילֹת הֵנָּה
  english_pob_choice: they were late-ripening
  chosen_korean: 늦게 익는 것이기 때문입니다
  alternatives_korean:
  - 아직 덜 익었기 때문입니다
  - 늦게 여무는 것이기 때문입니다
  - 늦게 익었습니다
  lexicon: HALOT
  rationale: אֲפִילֹת는 곡식이 늦게 성숙하는 상태를 가리키므로, 현대 한국어에서는 ‘늦게 익는 것’으로 옮기는 것이 가장 자연스럽고 설명적입니다.
theological_decisions:
- issue: 재앙 문맥에서 נכה의 표현 강도
  chosen_reading: ‘손상되지 않았습니다’로 옮기되, 본문의 심판적 맥락은 유지합니다.
  alternative_readings:
  - ‘쳤습니다/치셨습니다’
  - ‘쳐서 없애지 않았습니다’
  rationale: 곡식에 대한 수동 표현을 직역하면 한국어가 어색해지므로, 결과 상태를 자연스럽게 표현했습니다. 다만 바로 앞뒤 문맥의 재앙 서술이 ‘치심/타격’을 이미 분명히 하므로 의미 약화는 크지 않습니다.
  doctrine_reference: 출애굽 재앙 서술의 심판적 언어
