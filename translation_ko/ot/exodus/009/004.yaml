  - 주
  rationale: 출애굽기에서 언약적 신명 자체가 드러나므로, 칭호 대체보다 고유명사 ‘야훼’를 유지하는 것이 본문의 신학적·서사적 힘을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
