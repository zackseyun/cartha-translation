  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
  footnotes:
  - marker: a
    text: Or 'the Israelites'; Hebrew 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서는 이스라엘의 가축과 이집트의 가축[a] 사이에 구별을 두실 것이며, 이스라엘 자손에게 속한 것은 아무것도 죽지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’; 히브리어는 ‘이스라엘의 자손’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָה
  english_pob_choice: will make a distinction
  chosen_korean: 구별을 두실 것입니다
  alternatives_korean:
  - 구별하실 것입니다
  - 분리하실 것입니다
  - 차이를 두실 것입니다
  lexicon: HALOT
  rationale: 히필형 פלא는 단순한 인지가 아니라 두 집단 사이에 구분을 ‘두는’ 행위를 뜻하므로, 한국어로는 ‘구별을 두다’가 원문의 사역적 뉘앙스를 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 대문자 대체어가 아니라 고유명사로 처리하는 POB 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: מִקְנֵה
  english_pob_choice: livestock
  chosen_korean: 가축
  alternatives_korean:
  - 목축물
  - 가축 떼
  - 재산
  lexicon: HALOT
  rationale: פּל라그 재앙 문맥에서 מִקְנֶה는 특정 가축 종류보다 가축 전체를 가리키므로, 자연스러운 현대어인 ‘가축’이 가장 적절합니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: belonging to the sons of Israel
  chosen_korean: 이스라엘 자손에게 속한
  alternatives_korean:
  - 이스라엘 사람들에게 속한
  - 이스라엘 백성에게 속한
  - 이스라엘 자손의
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현인 ‘이스라엘 자손’이라는 집단 명칭을 유지하되, 수식 관계는 한국어에서 자연스럽게 ‘~에게 속한’으로 풀었습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
