source:
  edition: WLC
  text: וְ/לֹֽא יָכְל֣וּ הַֽ/חַרְטֻמִּ֗ים לַ/עֲמֹ֛ד לִ/פְנֵ֥י מֹשֶׁ֖ה מִ/פְּנֵ֣י הַ/שְּׁחִ֑ין כִּֽי הָיָ֣ה הַ/שְּׁחִ֔ין בַּֽ/חֲרְטֻמִּ֖ם וּ/בְ/כָל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
  footnotes:
  - marker: a
    text: 'Hebrew literally, ''in all Egypt.'' The translation renders the implied personal sense from the context: the boils were on the people throughout Egypt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 박수무당들은 모세 앞에 서지 못했습니다. 이는 그 종기 때문이었는데, 그 종기는 박수무당들과 온 이집트에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '온 이집트 안에'입니다. 문맥상 사람들에게 미친 재앙의 뜻을 드러내어 '온 이집트에'로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  english_pob_choice: the magicians
  chosen_korean: 박수무당들
  alternatives_korean:
  - 마술사들
  - 요술사들
  - 박사들
  lexicon: HALOT
  rationale: 출애굽기에서 바로의 종교·주술 전문인들을 가리키는 말로, 단순한 직역보다 이 문맥의 주술적 성격을 살려 '박수무당들'로 옮겼습니다.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  english_pob_choice: to stand before Moses
  chosen_korean: 모세 앞에 서지 못했습니다
  alternatives_korean:
  - 모세 앞에 나타나지 못했습니다
  - 모세 앞에 설 수 없었습니다
  lexicon: HALOT
  rationale: '''서다/서지 못하다''는 표현이 히브리어 관용구의 기본 이미지를 살리면서, 여기서는 재난 때문에 모세의 면전에서 버티거나 나아갈 수 없었다는 뜻을 자연스럽게 전달합니다.'
- source_word: הַשְּׁחִין
  english_pob_choice: the boils
  chosen_korean: 종기
  alternatives_korean:
  - 부스럼
  - 종기 질환
  - 보일
  lexicon: HALOT
  rationale: שְׁחִין은 피부에 생기는 염증성 병변을 뜻하므로, 한국어로는 의학적이면서도 성경 문맥에 맞는 '종기'가 가장 직접적입니다.
- source_word: וּבְכָל מִצְרָיִם
  english_pob_choice: and on all the Egyptians
  chosen_korean: 온 이집트에
  alternatives_korean:
  - 모든 이집트 사람들에게
  - 온 이집트 사람들에게
  - 이집트 전역에
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '온/모든 이집트 안에'이지만, 바로 앞의 '박수무당들'과 평행을 이루므로 인물보다 지역 전체에 퍼진 재앙으로 자연스럽게 '온 이집트에'로 옮겼습니다.
theological_decisions:
- issue: 재앙의 범위가 사람에게 미치는 방식
  chosen_reading: 종기가 박수무당들과 온 이집트에 있었다는 점을 드러내어, 재앙이 단순한 장소 표지가 아니라 사람들을 직접 덮친다는 뜻을 살렸습니다.
  alternative_readings:
  - 종기가 온 이집트 안에 있었다
  - 종기가 이집트 전역에 있었다
  rationale: 문맥상 다음 절의 '모세 앞에 서지 못했다'는 결과를 설명해야 하므로, 대상이 사람들에게 미친 재앙임을 분명히 하는 번역이 더 충실합니다.
  doctrine_reference: 출애굽기 재앙 서술의 문맥적 의미
