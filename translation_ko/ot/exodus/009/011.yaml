  source_fidelity: 히브리어의 인과 관계와 반복되는 ‘종기’를 대체로 충실히 반영했으나, ‘박수무당’은 고유한 한국 민속 종교 직능을 연상시켜 이집트 궁정의 חַרְטֻמִּים을 부정확하게 특정합니다. 또한 ‘온 이집트에’는 원문의 장소 표현에는 가깝지만, 바로 앞의 인물 대상과의 평행 및 영어 POB의 명시적 인칭 해석을 충분히 드러내지 못합니다.
  naturalness: ‘종기가 …에 있었습니다’보다 ‘종기가 …에게 났습니다’가 신체 질환에 대해 현대 한국어에서 더 자연스럽습니다. 문장을 인과 관계에 따라 정리하면 읽기도 더 명료합니다.
