revisions:
- from: 그리고 그 박수무당들은 모세 앞에 서지 못했습니다. 이는 그 종기 때문이었는데, 그 종기는 박수무당들과 온 이집트에 있었습니다.[a]
  to: 마술사들은 종기 때문에 모세 앞에 설 수 없었습니다. 종기가 마술사들과 모든 이집트 사람들에게 났기 때문입니다.[a]
  rationale: ‘마술사들’은 원어가 가리키는 궁정의 주술·의례 전문가를 한국의 특정 민속 종교 직능과 동일시하지 않고 전달합니다. ‘종기가 …에게 났기 때문입니다’는 בַּחַרְטֻמִּם 및 וּבְכָל־מִצְרָיִם의 문맥상 신체적 재앙 의미를 자연스럽고 명확하게 표현하며, 각주는 원문의 문자적 장소 표현을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:28Z'
