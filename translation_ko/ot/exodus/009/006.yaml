  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
  footnotes:
  - marker: a
    text: 'Or, ''the Israelites.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 다음 날 이 일을 행하셨습니다. 이집트의 가축은 모두 죽었지만, 이스라엘 자손의 가축 가운데서는 한 마리도 죽지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘이스라엘 사람들’입니다. 히브리어: ‘이스라엘의 아들들/자손’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주
  lexicon: HALOT
  rationale: 이 구절의 מקור성은 고유명사 יְהוָה를 가리키며, 한국어 구약 표기 관행과 가독성을 고려해 본문에는 여호와를 사용했습니다. 다만 POB의 영어본이 Yahweh를 채택한 점은 확인됩니다.
- source_word: מִמָּחֳרָת
  english_pob_choice: the next day
  chosen_korean: 다음 날
  alternatives_korean:
  - 그 다음 날
  - 이튿날
  lexicon: HALOT
  rationale: 히브리어의 시간 부사를 자연스러운 현대 한국어로 옮겼습니다. 문맥상 ‘다음 날’이 가장 सीधे하고 간결합니다.
- source_word: מִקְנֵה
  english_pob_choice: livestock
  chosen_korean: 가축
  alternatives_korean:
  - 가축 떼
  - 가축류
  lexicon: HALOT
  rationale: מִקְנֶה는 단순한 ‘소’가 아니라 가축 전반을 가리키므로, 영어 POB의 livestock에 맞춰 ‘가축’으로 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자손
  lexicon: HALOT
  rationale: 남성 복수 표현을 직역하기보다 한국어 성경에서 널리 통용되는 ‘이스라엘 자손’을 사용해, 혈통/언약 공동체를 가리키는 표현을 살렸습니다.
- source_word: לֹא מֵת אֶחָד
  english_pob_choice: not one died
  chosen_korean: 한 마리도 죽지 않았습니다
  alternatives_korean:
  - 한 마리도 죽은 것이 없었습니다
  - 한 마리도 죽지 않았습니다
  lexicon: HALOT
  rationale: 앞의 ‘가축’에 맞춰 죽은 대상을 동물 단위로 분명히 하되, 히브리어의 강한 부정과 단수 강조를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문에는 여호와를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 공식 POB 영어본은 Yahweh를 택하지만, 한국어 본문은 읽기 익숙성과 현행 구약 번역 관습을 고려해 여호와로 적었습니다. 다만 원문의 고유한 신명 표지를 일반 명사로 바꾸지는 않았습니다.
  doctrine_reference: 'POB Korean drafting convention: source name preserved in a readable Korean biblical form'
- issue: בְנֵי יִשְׂרָאֵל의 공동체적 의미
  chosen_reading: 이스라엘 자손으로 옮겨 언약 백성 전체를 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘의 자손
  rationale: 이 표현은 개별 남성만을 지칭하기보다 출애굽 공동체 전체를 가리키므로, 문맥상 공동체적 의미를 유지하는 번역이 적절합니다.
  doctrine_reference: Gender-accurate rendering of masculine plural corporate ethnonyms
