  lexicon: HALOT
  rationale: 히브리어 분사는 여기서 진행 중이거나 임박한 행위를 나타내므로, 문장 전체를 목적절로 받는 한국어에서 ‘보내는 것은’이 가장 무리 없이 대응합니다.
- source_word: כָּל מַגֵּפֹתַי
  english_pob_choice: all my plagues
  chosen_korean: 내 모든 재앙들
  alternatives_korean:
  - 내 모든 재앙
  - 내 모든 징벌들
  lexicon: HALOT
  rationale: 출애굽기의 심판 맥락에서 מַגֵּפָה는 단순한 병이 아니라 하나님의 치명적 타격을 뜻하므로 ‘재앙’이 적절하며, 복수성도 살리기 위해 ‘모든 재앙들’로 옮겼습니다.
- source_word: אֶל לִבְּךָ
  english_pob_choice: against your heart
  chosen_korean: 네 마음
  alternatives_korean:
  - 네 심장
  - 네 마음을 향해
  - 네 속마음
  lexicon: HALOT
  rationale: 직역은 ‘네 마음에게/네 마음을 향하여’이지만, 여기서는 재앙이 바로 파라오의 내면 중심을 겨눈다는 뜻을 살려 ‘네 마음’으로 두었습니다. 한국어에서는 전치사의 힘을 노출하기보다 표적을 드러내는 표현이 더 자연스럽습니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in all the earth
  chosen_korean: 온 땅에
  alternatives_korean:
  - 온 세상에
  - 모든 땅에
  lexicon: HALOT
  rationale: 본문의 보편적 범위를 따라 ‘land’보다 더 넓은 ‘땅’의 의미를 살렸고, 한국어에서는 관용적으로 ‘온 땅’이 가장 간결합니다.
theological_decisions:
- issue: אֶל לִבְּךָ의 방향성 보존
  chosen_reading: 재앙이 파라오의 중심인 ‘마음’을 향해 보내진다는 점을 보존했습니다.
  alternative_readings:
  - ‘네게’로 완화하여 파라오 개인 전체를 가리키게 처리
  - ‘네 심장에’로 문자적으로만 처리
  rationale: 본문은 단순히 파라오에게 재앙이 임한다는 정도가 아니라, 그의 내면 핵심을 겨냥한다는 긴장을 담고 있습니다. 이를 보존해야 이후의 마음 완악 주제와도 연결됩니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy'
