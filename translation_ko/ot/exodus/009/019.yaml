source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
  footnotes:
  - marker: a
    text: Or 'send quickly' / 'send at once'; the Hebrew command includes an urgency nuance.
    reason: lexical_alternative
  - marker: b
    text: '''Every man'' renders Hebrew adam here as a representative term for human beings generally.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 사람을 보내어, 당신의 가축과 들에 있는 당신의 모든 것을 안전한 곳으로 들이십시오. 들에 있는 모든 사람과 짐승 가운데 집으로 모이지 않은 것은—우박이 그들에게 내려 그들은 죽을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 명령은 급박한 촉구의 뉘앙스를 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אדם은 여기서 인간 일반을 대표하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그러므로 지금
  lexicon: HALOT
  rationale: 즉각적인 전환과 긴급한 경고의 연결을 함께 살리기 위해 '그러므로 이제'로 옮겼습니다.
- source_word: שְׁלַח הָעֵז
  english_pob_choice: send word
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 급히 전하여
  - 곧바로 보내어
  lexicon: HALOT
  rationale: 히브리어는 급박한 조치를 촉구하는 명령으로, 한국어에서는 자연스럽게 '사람을 보내어'로 옮기되 서두름의 뉘앙스는 문맥 전체에 담았습니다.
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  english_pob_choice: and everything you have in the field
  chosen_korean: 들에 있는 당신의 모든 것
  alternatives_korean:
  - 밭에 있는 당신의 모든 것
  - 밖에 있는 당신의 모든 소유
  lexicon: HALOT
  rationale: 소유물이 야외에 놓여 있는 범위를 포괄적으로 살리되, 현대 한국어에서 자연스러운 표현으로 정리했습니다.
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  english_pob_choice: Every man and beast
  chosen_korean: 모든 사람과 짐승
  alternatives_korean:
  - 모든 인간과 짐승
  - 사람마다와 짐승
  lexicon: HALOT
  rationale: אָדָם의 대표적·포괄적 용법을 따라 인류 전체를 가리키는 말로 '사람'을 택했고, 짐승과의 대구를 한국어에서도 분명히 했습니다.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  english_pob_choice: and is not gathered into the house
  chosen_korean: 집으로 모이지 않은 것은
  alternatives_korean:
  - 집 안으로 거두어지지 않은 것은
  - 집으로 들이지 않은 것은
  lexicon: HALOT
  rationale: נאסף의 수동적 의미를 살려 '모이지 않은'으로 옮기고, הביתה의 방향성을 '집으로'로 표현했습니다.
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  english_pob_choice: the hail will come down on them
  chosen_korean: 우박이 그들에게 내려
  alternatives_korean:
  - 우박이 그 위에 떨어져
  - 우박이 그들 위로 내려
  lexicon: HALOT
  rationale: ירד의 하강 이미지를 유지하면서 한국어에서 가장 자연스럽게 원인-결과를 이어 주는 표현을 선택했습니다.
theological_decisions:
- issue: 대표적 인간 지칭의 번역
  chosen_reading: 모든 사람
  alternative_readings:
  - 모든 인간
  - 사람마다
  rationale: 히브리어 אדם은 여기서 들판에 있는 인간을 대표적으로 가리키므로, 성별을 과도하게 드러내지 않으면서도 대구 구조를 살리는 '모든 사람'이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; contested generic אָדָם
