revisions:
- from: 그러므로 이제 사람을 보내어, 당신의 가축과 들에 있는 당신의 모든 것을 안전한 곳으로 들이십시오. 들에 있는 모든 사람과 짐승 가운데 집으로 모이지 않은 것은—우박이 그들에게 내려 그들은 죽을 것입니다.[a][b]
  to: 그러므로 이제 전갈을 보내어, 당신의 가축과 들에 있는 모든 것을 안전한 곳으로 피하게 하십시오.[a] 들에 있으면서 집 안으로 거두어지지 않은 모든 사람[b]과 짐승에게 우박이 내리면, 그들은 죽을 것입니다.
  rationale: 첫 명령을 ‘전갈을 보내어 … 피하게 하십시오’로 고쳐 보내는 행위와 안전 조처의 목적을 보존하면서도, 원문에 없는 ‘사람’이라는 목적어를 삽입하지 않았습니다. 후반부는 관계절의 범위를 사람과 짐승 모두에 분명히 적용하고, 수동형 ‘거두어지지 않은’으로 원문의 נֶאֱסָף를 반영했습니다. 각주 표지는 해당 번역 선택이 나타나는 지점에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:30Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 명령의 שְׁלַח는 단순히 ‘사람을 보내다’라고 특정하기보다 전갈을 보내어 가축과 들의 소유물을 피신시키도록 조처하라는 뜻으로 옮기는 것이 원문과 영어 감사 기록의 ‘send word’ 결정을 더 잘 반영합니다. 후반부는 ‘들에 있는 모든 사람과 짐승’ 전체가 ‘집 안으로 거두어지지 않은’ 경우라는 수식 관계를 분명히 해야 합니다.
  naturalness: 초안의 ‘모든 사람과 짐승 가운데 집으로 모이지 않은 것은’은 수식 범위가 불분명하고 한국어 문장으로도 부자연스럽습니다. ‘들에 있으면서 집 안으로 거두어지지 않은 모든 사람과 짐승’이 자연스럽고 명료합니다. ‘우박이 그들에게 내려’는 ‘우박이 그들에게 내리면’으로 조건적 결과를 매끄럽게 연결했습니다.
  terminology: אָדָם은 성별을 특정하지 않는 집합적 인간 지칭이므로 한국어 ‘모든 사람’이 적절합니다. בְּהֵמָה는 문맥상 ‘짐승’으로 유지할 수 있습니다. נֶאֱסָף의 수동적·집합적 뜻과 הַבַּיְתָה의 방향성은 ‘집 안으로 거두어지지 않은’에 반영했습니다.
  issues:
  - severity: medium
    issue: ‘사람을 보내어’가 שְׁלַח의 목적을 불필요하게 특정함
    rationale: 원문은 전갈을 보내거나 명령을 전달하여 가축과 재산을 안전하게 하도록 조처하라는 표현이며, 보냄의 대상이 반드시 ‘사람’이라고 명시되지는 않습니다.
  - severity: medium
    issue: 후반부 관계절의 수식 범위가 불명확함
    rationale: ‘모든 사람과 짐승 가운데 집으로 모이지 않은 것은’은 일부만을 가르는 듯하고, 사람과 짐승 모두에 적용되는 ‘집 안으로 거두어지지 않은’ 조건을 명료하게 전달하지 못합니다.
  - severity: low
    issue: 우박과 죽음의 조건적 결과 연결을 명확히 할 필요
    rationale: 히브리어의 연속된 미래 결과는 한국어에서 ‘우박이 … 내리면, 그들은 죽을 것입니다’로 표현하면 자연스럽고 의미가 선명합니다.
