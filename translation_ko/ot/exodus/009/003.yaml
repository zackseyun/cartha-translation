  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
  footnotes:
  - marker: a
    text: Or 'pestilence'; the Hebrew term denotes a deadly epidemic affecting livestock.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 야훼의 손이 들에 있는 당신의 가축, 곧 말과 나귀와 낙타와 소 떼와 양 떼 위에 매우 심한 전염병으로 임할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘역병’. 히브리어는 가축을 죽게 하는 치명적 유행병을 가리킵니다.
    reason: lexical_alternative
