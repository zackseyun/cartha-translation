  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
  footnotes:
  - marker: a
    text: Or 'pestilence'; the Hebrew term denotes a deadly epidemic affecting livestock.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 야훼의 손이 들에 있는 당신의 가축 위에 임할 것입니다—곧 말들과 나귀들과 낙타들과 소 떼와 양 떼 위에, 매우 심한 재앙이 임할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전염병’. 히브리어는 가축을 죽게 하는 치명적 유행병을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  - 자
  lexicon: HALOT
  rationale: 주의를 끄는 선언형 감탄을 현대 한국어의 정중한 직접 호소로 살렸습니다.
- source_word: יַד יְהוָה
  english_pob_choice: the hand of Yahweh
  chosen_korean: 야훼의 손
  alternatives_korean:
  - 야훼의 손길
  - 주님의 손
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 하나님의 능력과 심판의 임재를 유지했습니다.
- source_word: בְּמִקְנְךָ אֲשֶׁר בַּשָּׂדֶה
  english_pob_choice: upon your livestock that are in the field
  chosen_korean: 들에 있는 당신의 가축 위에
  alternatives_korean:
  - 들판에 있는 당신의 가축 위에
  - 야외에 있는 당신의 가축 위에
  lexicon: HALOT
  rationale: מִקְנֶה는 가축 전반을 가리키므로 ‘가축’으로 넓게 옮기고, ‘들에 있는’으로 범위를 분명히 했습니다.
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  english_pob_choice: upon the horses, the donkeys, the camels, the herds, and the flocks
  chosen_korean: 곧 말들과 나귀들과 낙타들과 소 떼와 양 떼
  alternatives_korean:
  - 말들과 당나귀들과 낙타들과 소와 양들
  - 말들과 나귀들과 낙타들과 가축 떼와 양 떼
  lexicon: HALOT
  rationale: 열거된 종과 집단 명칭을 자연스러운 한국어로 대응시켰으며, בָּקָר/צֹאן은 집합명사이므로 ‘소 떼’, ‘양 떼’로 살렸습니다.
- source_word: דֶּבֶר כָּבֵד מְאֹד
  english_pob_choice: a very severe plague
  chosen_korean: 매우 심한 재앙
  alternatives_korean:
  - 매우 심한 전염병
  - 극심한 재앙
  lexicon: HALOT
  rationale: דֶּבֶר의 핵심은 치명적 전염성 재앙이지만, 한국어에서는 문맥상 가축을 덮치는 심판을 넓게 드러내는 ‘재앙’이 가장 자연스럽습니다.
theological_decisions:
- issue: 야훼의 손이라는 심판적 관용구의 보존
  chosen_reading: ‘손’을 단순한 행위로 완화하지 않고, 심판의 임재를 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 야훼의 능력이
  - 야훼께서
  rationale: 히브리어 원문의 의도는 단순한 사건 서술이 아니라 하나님의 직접적 심판 행위를 강조하는 데 있으므로, 관용구를 보존하는 편이 더 충실합니다.
  doctrine_reference: 출애굽기 9:3 문맥의 심판 선언
