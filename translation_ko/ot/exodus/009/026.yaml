theological_decisions:
- issue: 이 절의 배타적 보호 범위
  chosen_reading: 우박의 부재가 고센 땅에만 한정되었다는 점을 문두의 '오직'과 문장 중간의 삽입구로 분명히 드러냈습니다.
  alternative_readings:
  - 고센 땅에만 우박이 없었습니다
  - 고센 땅에는 우박이 내리지 않았습니다
  rationale: 본문의 강조점은 일반적 설명이 아니라 심판 가운데서의 제한적 예외이므로, 제한 부사를 앞세워 신학적 대비를 유지했습니다.
  doctrine_reference: 출애굽기 재앙 본문에서의 심판-보호 대비
- issue: ‘이스라엘의 아들들’의 번역 유지
  chosen_reading: ‘이스라엘의 아들들’로 옮겨 원문의 남성 친족 표현을 보존했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 자손
  rationale: 원문이 집합명칭이 아니라 친족 구조를 가진 표현이므로, 전통적 평탄화보다 원문 형태를 유지하는 편이 주해적으로 유리합니다.
  doctrine_reference: 성별-정확 번역 원칙
