lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 단지
  - 다만
  lexicon: HALOT
  rationale: 문장 앞의 제한·배제 강조를 한국어에서도 앞세워 드러내기 위해 '오직'을 사용했습니다.
- source_word: בְּאֶרֶץ גֹּשֶׁן
