  rationale: 지명 앞의 בְּאֶרֶץ는 자연스러운 한국어로 '땅'을 살리는 것이 가장 직관적이므로 '고센 땅'으로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
