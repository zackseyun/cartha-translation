translation:
  language: ko
  text: 아마와 보리는 피해를 입었습니다. 보리는 이삭이 팼고[a], 아마는 꽃봉오리가 맺혔기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보리가 익어 가고 있었기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아마가 꽃피기 시작했기’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/פִּשְׁתָּה
  english_pob_choice: the flax
  chosen_korean: 아마
  alternatives_korean:
  - 아마풀
  - 삼
  lexicon: HALOT
  rationale: פִּשְׁתָּה는 직물 원료가 되는 아마를 가리키므로, 식물명으로는 현대 한국어에서 가장 자연스러운 ‘아마’를 사용했습니다.
- source_word: וְ/הַ/שְּׂעֹרָה
  english_pob_choice: the barley
  chosen_korean: 보리
  alternatives_korean:
  - 겉보리
  lexicon: HALOT
  rationale: שְׂעֹרָה는 보리를 직접 가리키므로 일반적이고 곧바른 대응인 ‘보리’를 택했습니다.
- source_word: נֻכָּתָה
  english_pob_choice: were struck down
  chosen_korean: 손상을 입었습니다
  alternatives_korean:
  - 무너졌습니다
  - 짖밟혔습니다
  - 치명타를 입었습니다
  lexicon: HALOT
  rationale: ח/נכה 계열의 수동형으로, 폭우와 우박에 의해 농작물이 피해를 입은 결과를 나타내므로, 자연스러운 현대 한국어로 피해 상태를 드러내는 ‘손상을 입었습니다’를 사용했습니다.
- source_word: אָבִיב
  english_pob_choice: in the ear
  chosen_korean: 이삭이 패었고
  alternatives_korean:
  - 이삭이 맺혔고
  - 익어 가고 있었고
  - 여물어 가고 있었고
  lexicon: HALOT
  rationale: אָבִיב은 곡식의 이삭이 형성된 상태를 가리키므로, 문자적 이미지를 살리면서도 한국어 농경 표현으로 자연스러운 ‘이삭이 패었고’를 선택했습니다.
- source_word: גִּבְעֹל
  english_pob_choice: in bud
  chosen_korean: 꽃봉오리가 맺혔습니다
  alternatives_korean:
  - 봉오리 상태였습니다
  - 봉오리가 피기 전이었습니다
  - 아직 꽃이 피지 않았습니다
  lexicon: HALOT
  rationale: גִּבְעֹל은 아마가 아직 이른 생장 단계에 있었음을 뜻하므로, 개화 전 단계를 자연스럽게 전달하는 ‘꽃봉오리가 맺혔습니다’를 사용했습니다.
theological_decisions:
- issue: 두 작물 모두가 파괴된 이유를 설명하는 כי의 처리
  chosen_reading: 피해 사실 뒤에 이유절을 이어 주어, 독자가 왜 아마와 보리가 손상되었는지를 바로 이해하도록 했습니다.
  alternative_readings:
  - 그리고 이는 보리가 이삭이 패었고 아마는 꽃봉오리가 맺혔기 때문입니다.
  - 왜냐하면 보리가 이삭이 패었고 아마는 꽃봉오리가 맺혔기 때문입니다.
  rationale: 이 구절은 신학적 쟁점보다 서술 논리의 명료성이 중요하므로, 원문의 인과 관계를 자연스러운 한국어로 분명히 드러냈습니다.
  doctrine_reference: 서술 문맥의 인과 관계
- issue: 작물의 생육 단계를 한국어로 옮길 때 과도한 해석을 피함
  chosen_reading: ‘이삭이 패었고’와 ‘꽃봉오리가 맺혔습니다’로 옮겨, 원문의 농경적 그림을 유지하되 의미를 과잉 특정하지 않았습니다.
  alternative_readings:
  - ‘익어 가고 있었습니다’
  - ‘피기 시작했습니다’
  rationale: 히브리어는 정확한 현상 묘사보다 성장 단계의 대조를 강조하므로, 한국어도 그 구체성과 여지를 함께 보존했습니다.
  doctrine_reference: 원문 충실성과 서술적 절제
