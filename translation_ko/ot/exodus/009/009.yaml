  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'on humankind and on beast.' The Hebrew אדם is a generic term for humanity here, set in contrast with beast.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional English: ''boils breaking out with blains.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 온 이집트 땅 위에 고운 먼지가 되고, 온 이집트 땅 곳곳에서 사람과 짐승에게 물집이 돋는 종기가 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인간과 짐승’. 히브리어 אדם은 여기서 짐승과 대조되는 집합적 인간을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: '전통 영어 번역: ‘boils breaking out with blains.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: and it will become
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 있을 것입니다
  - 되겠습니다
  lexicon: HALOT
  rationale: 여기서는 단순 존재보다 상태 변화가 핵심이므로, 결과를 드러내는 「될 것입니다」로 옮겼습니다.
- source_word: לְאָבָק
  english_pob_choice: fine dust
  chosen_korean: 고운 먼지
  alternatives_korean:
  - 먼지
  - 가루
  lexicon: HALOT
  rationale: אָבָק의 미세한 입자감을 살리기 위해 단순한 「먼지」보다 「고운 먼지」가 더 적절합니다.
- source_word: לִשְׁחִין פֹּרֵחַ אֲבַעְבֻּעֹת
  english_pob_choice: boils breaking out with blisters
  chosen_korean: 번져 나는 종기와 물집
  alternatives_korean:
  - 터져 나는 종기와 물집
  - 번지는 종기와 물집
  lexicon: HALOT
  rationale: שְׁחִין, פֹּרֵחַ, אֲבַעְבֻּעֹת의 세 요소를 모두 반영해, 종기의 발현과 함께 물집이 생기는 모습을 자연스러운 한국어로 살렸습니다.
- source_word: עַל הָאָדָם וְעַל הַבְּהֵמָה
  english_pob_choice: on man and on beast
  chosen_korean: 사람과 짐승 위에는
  alternatives_korean:
  - 사람과 짐승에게
  - 인간과 짐승 위에는
  lexicon: HALOT
  rationale: 문맥상 האדם은 집합적 인간을 가리키므로, 성별을 특정하지 않는 「사람」으로 옮기되 짐승과의 대조를 유지했습니다.
theological_decisions:
- issue: 인간을 가리키는 אָדָם의 번역
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 사람들
  rationale: 본문은 사람과 짐승의 대조를 통해 재앙의 범위를 말하므로, 집합적이면서도 대표성을 지닌 「사람」이 가장 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md: gender-accurate rendering in context; contested term אָדָם'
