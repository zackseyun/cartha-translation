    rationale: אֲשֶׁר לֹא הָיָה כָמֹהוּ는 ‘그와 같은 것이 한 번도 없었다’는 비교 표현입니다. ‘그와 같은 우박’이라고 밝혀 주면 원문의 관계가 자연스럽고 명료해집니다.
