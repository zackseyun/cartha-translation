base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
  footnotes:
  - marker: a
    text: Or 'at this time tomorrow.'
    reason: lexical_alternative
  - marker: b
    text: Or 'since the day it was established.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내일 이맘때쯤 내가 매우 심한 우박[b]을 내리겠습니다. 그것은 이집트가 세워진 날부터 지금까지 이집트에 한 번도 없었던 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내일 이때쯤’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 날부터’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  - 보아라
  lexicon: HALOT
  rationale: 신적 선언의 주의를 환기하는 감탄·지시 표현을 현대 한국어의 공손한 호명형으로 옮겨, 담화의 긴장과 직접성을 살렸습니다.
- source_word: כָּעֵת מָחָר
  english_pob_choice: about this time tomorrow
  chosen_korean: 내일 이맘때쯤
  alternatives_korean:
  - 내일 이 시간쯤
  - 내일 이맘때
  - 대략 내일 이 시간에
  lexicon: HALOT
  rationale: 시간의 근사성을 나타내는 כ의 뉘앙스를 살리기 위해 ‘쯤’을 넣었고, 자연스러운 현대 한국어 표현으로 다듬었습니다.
- source_word: בָּרָד כָּבֵד מְאֹד
  english_pob_choice: very heavy hail
  chosen_korean: 매우 심한 우박
  alternatives_korean:
  - 몹시 무거운 우박
  - 극도로 심한 우박
  - 아주 무거운 우박
  lexicon: HALOT
  rationale: 우박에 대한 ‘무거움’은 한국어에서 직관적이지 않으므로, 강도를 나타내는 ‘심한’으로 옮겨 원문의 중첩된 강조를 전달했습니다.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  english_pob_choice: from the day it was founded
  chosen_korean: 세워진 날부터
  alternatives_korean:
  - 설립된 날부터
  - 기초가 놓인 날부터
  - 세워진 그 날부터
  lexicon: HALOT
  rationale: 나라를 가리키는 표현으로 ‘세워지다’가 한국어에서 가장 자연스럽고, 수동형의 설립/기원 의미도 충분히 반영합니다.
theological_decisions:
- issue: 하나님의 직접적 주권적 행위의 표지
  chosen_reading: ‘내가 … 내리겠습니다’로 직역하여 우박 재앙이 하나님의 직접 행위임을 분명히 했습니다.
  alternative_readings:
  - ‘우박이 내릴 것입니다’처럼 비인칭적으로 처리하는 읽기
  rationale: 히필 1인칭 주어는 단순한 자연현상이 아니라 하나님의 능동적 심판 행위를 가리키므로, 그 주체성을 약화하지 않았습니다.
  doctrine_reference: 하나님의 섭리와 심판의 직접성
