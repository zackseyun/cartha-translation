source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
  footnotes:
  - marker: a
    text: Or 'that they may worship me.' The Hebrew verb can denote service rendered to God, including worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “아침 일찍 일어나 바로 앞에 서서 그에게 말하십시오. ‘히브리 사람들의 하나님 야훼께서 이렇게 말씀하십니다. 내 백성을 놓아주어 그들이 나를 섬기도록 하십시오.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 나를 예배하도록 하십시오.’ 히브리어 동사는 하나님께 드리는 섬김을 가리킬 수 있으며, 그 안에는 예배도 포함될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 언약적 고유명사인 יְהוָה를 호칭으로 대체하지 않고, POB의 원칙에 따라 음역형 ‘야훼’로 옮겼습니다.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  english_pob_choice: Rise early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 새벽에 일어나
  - 이른 아침에 일어나
  lexicon: WLC
  rationale: 히필 명령형의 관용적 의미는 ‘일찍 일어나다’이므로, 한국어에서도 자연스럽게 긴급성을 살려 옮겼습니다.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  english_pob_choice: and present yourself before
  chosen_korean: 바로의 앞에 서서
  alternatives_korean:
  - 바로 앞에 나아가서
  - 바로 앞에 몸을 세워
  lexicon: WLC
  rationale: 자기 자신을 ‘세워 앞에 서다’는 뜻을 담되, 궁정 장면에서 자연스러운 한국어로 간결하게 표현했습니다.
- source_word: שַׁלַּח אֶת עַמִּי
  english_pob_choice: Let my people go
  chosen_korean: 내 백성을 보내어
  alternatives_korean:
  - 내 백성을 놓아주어
  - 내 백성을 풀어 주어
  lexicon: WLC
  rationale: שלח의 핵심은 ‘보내다/놓아주다’이지만, 출애굽기 맥락에서 POB의 “Let my people go”에 맞추어 명령성을 유지했습니다.
- source_word: וְיַעַבְדֻנִי
  english_pob_choice: so that they may serve me
  chosen_korean: 그들이 나를 섬기게 하여라
  alternatives_korean:
  - 그들이 나를 예배하게 하여라
  - 그들이 나를 섬기도록 하여라
  lexicon: WLC
  rationale: עבד는 단순 예배보다 넓은 ‘섬김/봉사’를 포함하므로, POB의 ‘serve me’를 따라 ‘섬기다’로 옮겨 의미 범위를 보존했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 직접 나타난 언약 이름을 제목어로 대체하지 않고, 출처가 드러내는 고유명사성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: וְיַעַבְדֻנִי의 의미 범위
  chosen_reading: 섬기다
  alternative_readings:
  - 예배하다
  - 경배하다
  rationale: 이스라엘의 해방 목적이 단순한 제의행위만이 아니라 하나님께 대한 언약적 봉사임을 드러내기 위해 ‘섬기다’를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
