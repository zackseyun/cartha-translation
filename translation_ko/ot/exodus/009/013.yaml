  source_fidelity: 핵심 어휘와 구문은 대체로 충실합니다. 그러나 ‘내 백성을 보내어 그들이 나를 섬기게 하여라’는 목적절을 사역 명령처럼 들리게 할 수 있으므로, וְיַעַבְדֻנִי의 목적 용법을 더 분명히 해야 합니다.
  naturalness: ‘바로의 앞’보다 ‘바로 앞’이 현대 한국어에서 자연스럽습니다. 또한 지정된 합쇼체에 맞추어 인용문 안의 명령과 전언 공식을 ‘-십시오’ 체로 통일하는 것이 필요합니다.
  terminology: ‘야훼’, ‘히브리 사람들의 하나님’, ‘내 백성’, ‘섬기다’는 원문 및 영어 POB의 선택을 적절히 반영합니다. ‘섬기다’는 עבד의 넓은 의미를 보존합니다.
  issues:
  - severity: medium
    issue: 목적절이 사역 구문으로 읽힐 수 있음
    rationale: ‘그들이 나를 섬기게 하여라’는 바로가 백성을 섬기게 만들라는 뜻으로도 들릴 수 있습니다. 히브리어 접속사와 미완료형은 백성을 내보내는 목적, 곧 ‘그들이 나를 섬기도록’이라는 의미입니다.
  - severity: medium
    issue: 요구된 합쇼체와 인용문의 종결법 불일치
