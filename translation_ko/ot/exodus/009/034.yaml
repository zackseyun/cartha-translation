  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּֽי חָדַ֨ל הַ/מָּטָ֧ר וְ/הַ/בָּרָ֛ד וְ/הַ/קֹּלֹ֖ת וַ/יֹּ֣סֶף לַ/חֲטֹ֑א וַ/יַּכְבֵּ֥ד לִבּ֖/וֹ ה֥וּא וַ/עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
  footnotes:
  - marker: a
    text: Hebrew 'the voices'; in this storm context, the term refers to thunder.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 바로 그때 바로의가 비와 우박과 천둥이 그쳤음을 보고, 그는 계속 죄를 지었고 자기 마음을 완고하게 하였으니, 그와 그의 신하들도 그러했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘소리들’이지만, 여기서는 폭풍 맥락상 천둥을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... כִּי חָדַל
  english_pob_choice: saw that ... had ceased
  chosen_korean: 그쳤음을 보고
  alternatives_korean:
  - 그쳤다는 것을 보고
  - 멈춘 것을 보고
  lexicon: HALOT
  rationale: ראה + כי의 내용절을 자연스럽게 살려 ‘...했음을 보고’로 옮겼고, חָדַל은 ‘그쳤다’로 직접 번역해 폭풍이 멎은 상황을 분명히 했습니다.
- source_word: הַקֹּלֹת
  english_pob_choice: the thunder
  chosen_korean: 천둥
  alternatives_korean:
  - 우레
  - 소리들
  lexicon: HALOT
  rationale: 직역하면 ‘소리들’이지만, 여기서는 재앙 맥락상 번개를 동반한 천둥을 가리키므로 한국어 자연 표현인 ‘천둥’이 원문의 관용적 뜻을 가장 잘 드러냅니다.
- source_word: וַיֹּסֶף לַחֲטֹא
  english_pob_choice: he continued to sin
  chosen_korean: 그는 계속 죄를 지었고
  alternatives_korean:
  - 그는 다시 죄를 지었고
  - 그는 죄를 거듭하였고
  lexicon: HALOT
  rationale: יסף + 부정사는 ‘계속하다/거듭하다’의 뜻이므로, 반복과 지속을 함께 살리는 ‘계속 죄를 지었다’로 옮겼습니다.
- source_word: וַיַּכְבֵּד לִבּוֹ
  english_pob_choice: hardened his heart
  chosen_korean: 자기 마음을 완고하게 하였으니
  alternatives_korean:
  - 자기 마음을 굳게 하였으니
  - 자기 마음을 무겁게 하였으니
  lexicon: HALOT
  rationale: כבד의 직역인 ‘무겁게 하다’는 한국어에서 의미가 덜 분명하므로, 출애굽기의 반복되는 관용구를 해치지 않으면서도 뜻을 분명히 하는 ‘마음을 완고하게 하다’를 택했습니다.
- source_word: וַעֲבָדָיו
  english_pob_choice: he and his servants
  chosen_korean: 그와 그의 신하들도
  alternatives_korean:
  - 그와 그의 종들도
  - 그와 그의 시종들도
  lexicon: HALOT
  rationale: 바로의 궁정 맥락에서 עֲבָדִים은 일반적 ‘종’보다 ‘신하’가 더 자연스럽고, 문장의 끝에서 함께 강조되는 집단을 잘 드러냅니다.
theological_decisions:
- issue: 바로의 마음 완고함의 행위 주체
  chosen_reading: 본문은 바로 자신이 죄를 계속 짓고 마음을 완고하게 했다고 말하며, 마지막에 바로와 그의 신하들을 함께 덧붙입니다.
  alternative_readings:
  - 마지막 구절이 마음 완고함의 주체를 집단적으로 확장한다고 볼 수 있음
  - 신하들은 단순한 동반 강조로 볼 수 있음
  rationale: 히브리어는 먼저 바로의 행위를 직접 진술한 뒤 ‘그와 그의 신하들’을 덧붙이므로, 신학적 해석을 덧씌우지 않고 문장 구조를 그대로 살렸습니다.
  doctrine_reference: 본문 수준의 행위 주체를 보존하고, 하나님의 주권과 인간 책임의 긴장은 이 절에서 해소하지 않습니다.
