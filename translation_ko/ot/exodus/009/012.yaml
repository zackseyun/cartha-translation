  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
  footnotes:
  - marker: a
    text: Or 'made Pharaoh's heart firm' or 'strengthened Pharaoh's heart.' The Hebrew verb more literally means 'made strong/firm,' but in this context it refers to Pharaoh's stubborn resistance.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 파라오의 마음을 완고하게 하셨고[a], 그는 그들에게 귀를 기울이지 않았습니다. 이는 야훼께서 모세에게 말씀하신 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파라오의 마음을 굳게 하셨다’, ‘파라오의 마음을 강하게 하셨다’로 옮길 수 있습니다. 히브리어 동사 חזק는 문자적으로 ‘강하게 하다/굳게 하다’를 뜻하지만, 이 문맥에서는 파라오의 완고한 저항을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  english_pob_choice: hardened
  chosen_korean: 강하게 하셨고
  alternatives_korean:
  - 굳게 하셨고
  - 완강하게 하셨고
  lexicon: HALOT
  rationale: חזק의 기본 뜻인 ‘강하게 하다/굳게 하다’를 살리되, 한국어 본문에서는 반복되는 바로의 완고함을 드러내면서도 원문의 동사 자체를 직역적으로 유지하기 위해 ‘강하게 하셨고’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문의 신명사 יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭으로 대체하지 않고 고유 신명을 드러냈습니다.
- source_word: שָׁמַע אֲלֵהֶם
  english_pob_choice: did not listen to them
  chosen_korean: 그들에게 귀를 기울이지 않았습니다
  alternatives_korean:
  - 그들의 말을 듣지 않았습니다
  - 그들에게 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע + אל의 관계적 의미를 살리면서도, 단순 청취보다 대응 거부의 뉘앙스를 담기 위해 ‘귀를 기울이지 않았습니다’로 옮겼습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  english_pob_choice: just as Yahweh had spoken to Moses
  chosen_korean: 이는 야훼께서 모세에게 말씀하신 그대로였습니다
  alternatives_korean:
  - 야훼께서 모세에게 말씀하신 대로였습니다
  - 야훼께서 모세에게 말씀하신 것과 같았습니다
  lexicon: HALOT
  rationale: כַּאֲשֶׁר의 성취·비교 표지를 자연스러운 한국어로 전달하기 위해 ‘그대로였습니다’를 사용해, 선행한 신적 말씀의 성취를 분명히 했습니다.
theological_decisions:
- issue: 야훼의 직접적 주권적 작용과 바로의 책임을 함께 보존하는 표현
  chosen_reading: ‘야훼께서 … 마음을 강하게 하셨고’라고 직접적 주어-목적어 구조를 유지했습니다.
  alternative_readings:
  - ‘야훼께서 … 마음을 굳게 하셨고’
  - ‘야훼께서 … 마음을 완고하게 하셨고’
  rationale: 본문은 야훼를 행위의 주어로 명시하므로, 이를 완곡하게 바꾸지 않고 직접적 인과를 보존했습니다. 동시에 ‘강하게 하다’의 어휘적 여지를 남겨, 출애굽기의 바로-마음 모티프가 가진 신학적 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it'
