  source_fidelity: 핵심 의미인 ‘아직도’, 바로의 자기고양, 하나님의 ‘내 백성’, 그리고 그들을 보내 주지 않으려는 태도는 대체로 반영했습니다. 다만 בְּעַמִּי의 관계를 ‘내 백성 위에서’로 옮기면 한국어에서 부자연스럽고, ‘내 백성에게 맞서’가 문맥상의 대적·억압의 관계를 더 명료하게 전달합니다.
  naturalness: ‘내 백성 위에서 스스로를 높이며’는 현대 표준 한국어에서 결합이 어색합니다. ‘내 백성에게 맞서 스스로를 높이며’가 자연스럽고, 원문의 적대적 자기고양을 유지합니다.
