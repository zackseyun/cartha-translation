    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדְךָ
  english_pob_choice: Are you still
  chosen_korean: 아직도
  alternatives_korean:
  - 여전히
  - 아직
  lexicon: HALOT
  rationale: עוֹד과 2인칭 남성 단수 접미사가 이어져 ‘지금도 계속되는 상태’를 묻는 뜻이므로, 한국어에서는 문두 부사 ‘아직도’로 현재 진행 중인 책망의 뉘앙스를 살렸습니다.
- source_word: מִסְתּוֹלֵל
  english_pob_choice: exalting yourself
  chosen_korean: 스스로를 높이며
  alternatives_korean:
  - 교만하게 행동하며
  - 자기를 높이며
  - 스스로 높이며
  lexicon: HALOT
  rationale: 히트폴렐 분사는 단순한 반대가 아니라 자기를 치켜세우는 오만한 자기고양을 나타내므로, 동작성과 반성적 뉘앙스를 함께 드러내는 표현을 택했습니다.
- source_word: בְּעַמִּי
  english_pob_choice: against my people
  chosen_korean: 내 백성 위에서
  alternatives_korean:
  - 내 백성에 대하여
  - 내 백성에게 맞서
  - 내 백성을 상대로
  lexicon: HALOT
  rationale: ב가 여기서는 ‘~위에서/~에 군림하여’라는 우월·대적의 뉘앙스를 띠므로, POB의 ‘against’ 취지를 살리되 한국어에서는 통치적 우월감을 드러내는 ‘위에서’로 옮겼습니다.
- source_word: לְבִלְתִּי שַׁלְּחָם
  english_pob_choice: by not letting them go
  chosen_korean: 그들을 보내 주지 않으려
  alternatives_korean:
  - 그들을 놓아주지 않으려
  - 그들을 풀어 주지 않으려
  - 그들을 보내지 않으려
  lexicon: HALOT
  rationale: לבלתי + 동사는 부정 목적/결과를 나타내므로 ‘~하지 않으려’로 자연스럽게 풀었습니다. שׁלח의 출애굽기 맥락상 의미는 단순 이동이 아니라 석방이므로 ‘보내 주다’로 번역했습니다.
theological_decisions:
- issue: ‘내 백성’의 소유·언약 언어 유지
  chosen_reading: ‘내 백성’을 그대로 유지했습니다.
  alternative_readings:
  - 이스라엘
  - 그 백성
  rationale: 1인칭 소유격은 야훼의 언약적 소유권과 바로의 대적이 곧 하나님께 대한 대적임을 드러내므로, 일반명사로 완화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
