lexical_decisions:
- source_word: וַיִּשְׁלַח וַיִּקְרָא לְ
  english_pob_choice: sent and called for
  chosen_korean: 보내어 모세와 아론을 불러오게 하고
  alternatives_korean:
  - 사람을 보내어 모세와 아론을 불러
  - 모세와 아론을 불러오게 하고
  lexicon: HALOT
  rationale: 두 동사가 연속되는 구조를 살려, 단순히 ‘불렀다’로 합치지 않고 보냄과 소환을 함께 드러내는 표현으로 옮겼습니다.
- source_word: חָטָאתִי הַפָּעַם
  english_pob_choice: I have sinned this time
  chosen_korean: 이번에는 제가 죄를 지었습니다
  alternatives_korean:
  - 이번에 제가 죄를 지었습니다
  - 저는 이번에 죄를 지었습니다
  lexicon: HALOT
  rationale: 왕의 고백이라는 문맥에 맞게 현대 한국어의 자연스러운 회개 표현으로 옮기되, ‘이번에는’로 הַפָּעַם의 시점을 살렸습니다.
- source_word: יְהוָה הַצַּדִּיק
  english_pob_choice: Yahweh is in the right
  chosen_korean: 야훼께서 옳으십니다
  alternatives_korean:
  - 야훼께서 의로우십니다
  - 야훼께서 옳으십니다
  lexicon: HALOT
  rationale: הַצַּדִּיק의 법정·도덕적 대조를 한국어 관용에서 가장 직접적으로 드러내는 ‘옳으십니다’로 옮겼습니다. '의로우십니다'는 가능하지만 이 문맥의 대조는 다소 추상적일 수 있습니다.
- source_word: וַאֲנִי וְעַמִּי הָרְשָׁעִים
  english_pob_choice: I and my people are the wicked ones
  chosen_korean: 저와 제 백성은 악한 자들입니다
  alternatives_korean:
  - 저와 제 백성은 악인들입니다
  - 저와 제 백성은 죄인들입니다
  lexicon: HALOT
  rationale: 복수형 형용사에 맞추어 집단적 책임을 드러내고, 단순한 실수보다 도덕적 악을 가리키는 어감을 살렸습니다.
theological_decisions:
- issue: 주어진 본문에서 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 문자음절 이름을 직접 드러내는 POB 원칙을 따라 ‘야훼’로 옮겼습니다. 본문 자체가 이름을 사용하므로 존칭 대체를 피했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 파라오의 자기고백에서 משפט적·도덕적 대조의 보존
  chosen_reading: 야훼께서 옳으십니다 — 저와 제 백성은 악한 자들입니다
  alternative_readings:
  - 야훼께서 의로우십니다 — 저와 제 백성은 죄가 있습니다
  - 야훼께서 옳으십니다 — 저와 제 백성은 잘못했습니다
  rationale: 본문은 하나님 편의 정당성과 파라오 편의 악함을 대조하므로, 단순한 ‘잘못했습니다’보다 ‘옳으십니다/악한 자들입니다’가 대비를 더 선명하게 보여 줍니다.
  doctrine_reference: 'Translation philosophy: preserve source text''s plain sense; readable modern Korean'
