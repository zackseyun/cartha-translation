base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
  footnotes:
  - marker: a
    text: Hebrew literally, 'voices of God and hail.' Here 'voices' refers to thunder in the storm.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께 간구하십시오[a]. 하나님의 천둥과 우박이 충분합니다. 그러면 내가 당신들을 보내겠고, 당신들은 더 이상 머물지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘하나님의 소리들’입니다. 여기서 ‘소리들’은 천둥을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  english_pob_choice: Pray
  chosen_korean: 간구하십시오
  alternatives_korean:
  - 기도하십시오
  - 애원하십시오
  lexicon: HALOT
  rationale: 히필 명령형 복수형으로, 단순한 일반 기도보다 강한 중보·간구의 요청이어서 공손한 명령형 '간구하십시오'가 가장 잘 맞습니다.
- source_word: יְהוָה
