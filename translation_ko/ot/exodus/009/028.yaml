  - 하나님의 천둥소리
  lexicon: HALOT
  rationale: 직역하면 '하나님의 소리들'이지만, 우박 재앙 문맥상 번개·천둥을 가리키므로 자연스러운 현대어로 '하나님의 천둥'을 택했습니다.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  english_pob_choice: and you will stay no longer
  chosen_korean: 더 이상 머물지 않을 것입니다
  alternatives_korean:
  - 더는 서 있지 않을 것입니다
  - 더 이상 남아 있지 않을 것입니다
  lexicon: HALOT
  rationale: '''더하다/계속하다''의 부정과 ''서다''의 관용구로서, 여기서는 계속 체류한다는 뜻이므로 한국어로는 ''더 이상 머물지 않다''가 의미를 가장 분명히 전합니다.'
