translation:
  language: ko
  text: 야훼께 간구하십시오[a]. 하나님의 천둥과 우박은 이제 충분합니다. 그러면 내가 너희를 보내 주겠고, 너희는 더 이상 머물지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘하나님의 소리들’입니다. 여기서 ‘소리들’은 천둥을 가리킵니다.
