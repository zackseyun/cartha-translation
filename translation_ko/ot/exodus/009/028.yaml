  - 여호와
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 규정에 따라 신적 고유명은 '야훼'로 옮겨 하나님의 이름 자체를 보존합니다.
- source_word: קֹלֹת אֱלֹהִים
  english_pob_choice: God's thunder
  chosen_korean: 하나님의 천둥
  alternatives_korean:
