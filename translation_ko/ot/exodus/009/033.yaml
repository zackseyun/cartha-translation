theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와 대신 본문에는 ‘여호와’로 두되, 본 절의 맥락상 구약 내 신명 표기는 독자에게 익숙한 형식을 유지했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 제공된 영어 POB는 Yahweh를 택하지만, 한국어 본문은 프로젝트 기본값에 맞춰 본문 가독성과 일관성을 고려해 ‘여호와’로 제시했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH default Korean'
