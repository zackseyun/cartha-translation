  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
  footnotes:
  - marker: a
    text: Hebrew 'the voices'; in this storm context, the term refers to thunder.
    reason: lexical_alternative
  - marker: b
    text: Or 'rain was not poured down to the ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 바로를 떠나 성 밖으로 나가서 야훼께 두 손을 펼쳤습니다. 그러자 천둥[a]과 우박이 그쳤고, 비는 더 이상 땅에 쏟아지지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘소리들’이지만, 이 폭풍 문맥에서는 ‘천둥’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘비가 땅으로 쏟아지지 않았습니다’라고도 옮길 수 있습니다.
    reason: lexical_alternative
