  to: 내가 벌써 내 손을 내밀어 너와 네 백성을 전염병으로 쳤더라면, 너는 땅에서 끊어졌을 것입니다.[a]
  rationale: 시간 표현을 ‘벌써’로 바꾸어 ‘by now’의 의미를 살리고, 질병성 심판을 뜻하는 דֶּבֶר를 ‘전염병’으로 구체화했습니다. 나머지는 히브리어의 반사실적 담화 기능과 단수 대상 표현을 유지했습니다.
