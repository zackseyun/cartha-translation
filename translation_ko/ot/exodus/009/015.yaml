base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
  footnotes:
  - marker: a
    text: Or, more formally, 'For now I have stretched out my hand and struck you and your people with pestilence, and you were cut off from the earth.' The Hebrew verbal forms are formally past, but the context strongly supports a counterfactual sense.
    reason: alternative_reading
translation:
  language: ko
  text: 이제라도 내가 내 손을 펴서 너와 네 백성을 재앙으로 쳤을 것이며, 너는 땅에서 끊어졌을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 형태는 겉으로는 과거이지만, 문맥은 반사실적 의미를 강하게 요구합니다.
    reason: source_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이제라도
  alternatives_korean:
  - 왜냐하면
  - 참으로
  lexicon: HALOT
  rationale: 앞절을 설명하면서도 ‘바로 그 시점이면 이미 가능했음’을 드러내므로, 단순 인과보다 시간적·설명적 뉘앙스를 살린 ‘이제라도’가 적절합니다.
- source_word: שָׁלַחְתִּי אֶת יָדִי
  english_pob_choice: I could have stretched out my hand
  chosen_korean: 내 손을 펴서
  alternatives_korean:
  - 내 손을 내밀어
  - 내 손을 뻗어
  lexicon: HALOT
  rationale: 하나님의 심판 행위를 가리키는 관용구를 살리기 위해 직역적 이미지인 ‘손을 펴다’를 유지했고, 영어 POB의 가정법 의미는 뒤의 종결 표현으로 자연스럽게 옮겼습니다.
- source_word: בַּדָּבֶר
  english_pob_choice: with pestilence
  chosen_korean: 재앙으로
  alternatives_korean:
  - 전염병으로
  - 염병으로
  lexicon: HALOT
  rationale: 이 단어는 문맥상 심판성 질병을 가리키지만, 한국어에서 ‘전염병/염병’은 현대 독자에게 의미가 지나치게 좁거나 낡게 들릴 수 있어, 본문의 재앙적 성격을 포괄하는 ‘재앙으로’로 옮겼습니다.
- source_word: וַתִּכָּחֵד מִן הָאָרֶץ
  english_pob_choice: you would have been cut off from the earth
  chosen_korean: 너는 땅에서 끊어졌을 것입니다
  alternatives_korean:
  - 너는 땅에서 사라졌을 것입니다
  - 너는 땅에서 멸망했을 것입니다
  lexicon: HALOT
  rationale: נכחד의 ‘없어지다/끊기다/말소되다’는 감각을 살려 ‘끊어지다’로 옮겼고, ‘from the earth’는 범위를 넓혀 ‘땅에서’로 번역해 심판의 완전한 제거를 드러냈습니다.
theological_decisions:
- issue: 히브리어 완료형의 문맥상 반사실적 의미
  chosen_reading: 현재 상황과 대비되는 가정법적 의미를 살려 ‘이제라도 … 했을 것이며 … 끊어졌을 것입니다’로 번역했습니다.
  alternative_readings:
  - 형태를 따라 단순 과거로 ‘내 손을 펴서 쳤으며… 끊어졌습니다’로 옮길 수 있습니다.
  rationale: 문맥상 하나님이 실제로 하신 일이 아니라 ‘이미 그렇게 할 수 있었음’을 드러내는 반사실적 진술이므로, 독자가 사건의 실제 순서를 오해하지 않도록 가정법으로 표현하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
