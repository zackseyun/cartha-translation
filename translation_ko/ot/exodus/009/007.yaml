base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
  footnotes:
  - marker: a
    text: Hebrew literally, 'not one had died from Israel’s livestock.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew, 'Pharaoh’s heart became heavy,' an idiom for becoming hardened or stubborn.
    reason: lexical_alternative
translation:
  language: ko
  text: 바로 그때 파라오가 사람을 보냈는데, 보라, 이스라엘의 가축 가운데 하나도 죽지 않았습니다. 그러나 파라오의 마음은 무거워졌고, 그는 백성을 보내지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 가축 가운데서 하나도 죽지 않았다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘파라오의 마음이 무거워졌다’이며, 이는 완고해짐을 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보냈는데
  alternatives_korean:
  - 보냈는데
  - 조사하러 보냈는데
  - 사람을 보내어
  lexicon: HALOT
  rationale: 문맥상 파라오가 소식을 확인하려고 사람을 보낸 것으로 이해되지만, 본문에는 목적어가 생략되어 있어 한국어에서도 이를 과도하게 풀지 않고 자연스럽게 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보라
  alternatives_korean:
  - 그리고 보니
  - 과연
  - 보십시오
  lexicon: HALOT
  rationale: 히브리어 감탄·지시의 뉘앙스를 살리기 위해 서술문 안에서는 짧은 호응어 ‘보라’가 가장 직접적입니다.
- source_word: מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  english_pob_choice: not even one of Israel’s livestock had died
  chosen_korean: 이스라엘의 가축 가운데 하나도 죽지 않았습니다
  alternatives_korean:
  - 이스라엘의 가축 가운데 한 마리도 죽지 않았습니다
  - 이스라엘의 가축에서 단 하나도 죽지 않았습니다
  lexicon: HALOT
  rationale: מִקְנֶה는 폭넓게 가축/가축 떼를 가리키므로 ‘가축’이 적절하며, עַד אֶחָד의 관용적 강조를 ‘하나도’로 살렸습니다.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  english_pob_choice: Pharaoh’s heart was heavy
  chosen_korean: 파라오의 마음은 무거워졌고
  alternatives_korean:
  - 파라오의 마음은 무거웠고
  - 파라오의 마음은 완고해졌고
  - 파라오의 마음은 완강해졌고
  lexicon: HALOT
  rationale: כבד의 문자적 의미인 ‘무겁다’를 유지하되, 한국어에서는 상태 변화를 보여 주는 ‘무거워졌고’가 관용적 의미를 가장 덜 해치면서도 본문 어감을 살립니다.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  english_pob_choice: and he did not let the people go
  chosen_korean: 그는 백성을 보내지 않았습니다
  alternatives_korean:
  - 그는 백성을 가게 하지 않았습니다
  - 그는 백성을 놓아주지 않았습니다
  - 그는 백성을 풀어 주지 않았습니다
  lexicon: HALOT
  rationale: שׁלח가 출애굽 내러티브에서 ‘보내다/가게 하다’는 관용으로 쓰이므로, 직역보다 한국어 자연성을 살린 ‘보내지 않았습니다’가 적절합니다.
theological_decisions:
- issue: 파라오의 마음을 옮기는 방식
  chosen_reading: ‘무거워졌고’로 옮겨, 본문의 직설적 이미지와 해석의 여지를 함께 남겼습니다.
  alternative_readings:
  - ‘완고해졌고’
  - ‘강퍅해졌고’
  - ‘완강해졌고’
  rationale: 히브리어는 여기서 ‘마음이 무거워지다’라는 표현을 쓰며, 출애굽기의 반복되는 완고함 주제를 함축합니다. 한국어에서 곧바로 신학적 해석어를 넣기보다 원어의 이미지를 보존하는 편이 본문의 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
