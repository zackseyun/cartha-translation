  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
  footnotes:
  - marker: a
    text: Hebrew literally, 'not one had died from Israel’s livestock.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew, 'Pharaoh’s heart became heavy,' an idiom for becoming hardened or stubborn.
