revisions:
- from: 바로 그때 파라오가 사람을 보냈는데, 보라, 이스라엘의 가축 가운데 하나도 죽지 않았습니다. 그러나 파라오의 마음은 무거워졌고, 그는 백성을 보내지 않았습니다.[a][b]
  to: 파라오가 사람을 보내니, 이스라엘의 가축 가운데는 한 마리도 죽지 않았습니다[a]. 그러나 파라오의 마음은 완고해졌고[b], 그는 백성이 가도록 허락하지 않았습니다.
  rationale: 원문의 서사적 접속을 과도한 시간 표현 없이 옮기고, 한국어에서 불투명한 ‘마음이 무거워지다’는 관용적 의미인 ‘완고해지다’로 번역했습니다. 이때 문자적 표현과 해석 여지는 각주에서 보존했습니다. 또한 백성을 ‘보내지 않았다’는 표현을 ‘가도록 허락하지 않았다’로 다듬어 출애굽기 문맥의 해방·석방 의미를 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:26Z'
review_pass:
  verdict: revise
  source_fidelity: ‘바로 그때’는 접속사 וַ의 범위를 넘어 시간적 한정을 더하며, ‘마음은 무거워졌고’는 히브리어 관용구를 한국어에서 부자연스럽고 의미가 불명확하게 만듭니다. 또한 שִׁלַּח אֶת־הָעָם은 단순히 보내지 않았다는 뜻보다 백성이 떠나도록 허락하지 않았다는 출애굽기 문맥의 의미를 나타내야 합니다.
  naturalness: 합쇼체 문장 안의 ‘보라’는 현대 표준 한국어에서는 다소 고풍스럽고 어색합니다. ‘그런데’로 발견·대조의 흐름을 자연스럽게 나타내고, 각주 표지를 해당 표현 바로 뒤에 붙였습니다.
  terminology: מִקְנֶה는 ‘가축’으로 유지했습니다. כבד의 관용적 의미는 본문에서 ‘완고해졌고’로 옮기되, 문자적 이미지는 각주에 보존했습니다. ‘백성’은 출애굽기에서 이스라엘 백성을 가리키는 확립된 표현으로 유지했습니다.
  issues:
  - severity: medium
    issue: ‘바로 그때’가 원문에 없는 시간적 한정을 추가합니다.
    rationale: וַיִּשְׁלַח의 וַ는 서사 진행을 잇는 접속으로, ‘바로 그때’라는 특정한 시간 강조를 요구하지 않습니다.
  - severity: medium
    issue: ‘파라오의 마음은 무거워졌고’는 현대 한국어에서 관용적 뜻이 불명확합니다.
    rationale: כבד가 여기서 ‘마음이 무거워지다’라는 형상을 사용하지만 출애굽기 문맥에서는 완고함을 뜻합니다. 한국어 본문에는 뜻을 전달하고 문자적 표현은 각주로 밝혀야 합니다.
  - severity: medium
    issue: ‘그는 백성을 보내지 않았습니다’는 떠나게 하지 않았다는 의미를 충분히 드러내지 못합니다.
    rationale: שׁלח가 이 문맥에서 이스라엘 백성을 놓아주거나 떠나도록 허락한다는 의미로 쓰였으므로 이를 명시하는 편이 자연스럽고 정확합니다.
  - severity: low
