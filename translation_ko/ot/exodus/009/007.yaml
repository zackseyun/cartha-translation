translation:
  language: ko
  text: 파라오가 사람을 보내니, 이스라엘의 가축 가운데는 한 마리도 죽지 않았습니다[a]. 그러나 파라오의 마음은 완고해졌고[b], 그는 백성이 가도록 허락하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 가축 가운데서 하나도 죽지 않았다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘파라오의 마음이 무거워졌다’이며, 이는 완고해짐을 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보냈는데
  alternatives_korean:
  - 보냈는데
  - 조사하러 보냈는데
  - 사람을 보내어
  lexicon: HALOT
  rationale: 문맥상 파라오가 소식을 확인하려고 사람을 보낸 것으로 이해되지만, 본문에는 목적어가 생략되어 있어 한국어에서도 이를 과도하게 풀지 않고 자연스럽게 옮겼습니다.
