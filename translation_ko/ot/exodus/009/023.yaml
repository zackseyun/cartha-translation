base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'fire went earthward'; the 'fire' in context likely refers to lightning.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 지팡이를 하늘을 향해 내밀자, 야훼께서 천둥과 우박을 보내셨고, 불이 땅으로 내려왔습니다. 야훼께서 애굽 땅에 우박을 내리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불이 땅 쪽으로 갔다’로 옮길 수 있습니다. 문맥상 이 ‘불’은 번개를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט מֹשֶׁה אֶת מַטֵּהוּ
  english_pob_choice: Moses stretched out his staff
  chosen_korean: 모세가 지팡이를 하늘을 향해 내밀자
  alternatives_korean:
  - 모세가 지팡이를 펼치자
  - 모세가 지팡이를 들어 올리자
  lexicon: HALOT
  rationale: נָטָה는 물건을 ‘펴다/내밀다/뻗다’의 뜻이 가능하며, 여기서는 지팡이를 위로 향해 드는 동작이므로 ‘내밀자’가 자연스럽고 장면의 방향성을 살립니다.
- source_word: קֹלֹת וּבָרָד
  english_pob_choice: thunder and hail
  chosen_korean: 천둥과 우박
  alternatives_korean:
  - 우레와 우박
  - 소리와 우박
  lexicon: HALOT
  rationale: קֹלֹת은 폭풍 맥락에서 ‘천둥’이 가장 자연스러운 의미이므로, 현대 한국어 독자가 즉시 이해할 수 있게 했습니다.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  english_pob_choice: fire came down to the earth
  chosen_korean: 불이 땅으로 내려왔습니다
  alternatives_korean:
  - 불이 땅으로 달려갔습니다
  - 불이 땅으로 흘러내렸습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘불이 땅 쪽으로 걸어갔다’는 매우 생생한 표현이지만, 한국어에서는 자연스럽고 품위 있게 ‘내려왔다’로 옮기되 불의 이미지는 유지했습니다.
- source_word: אֶרֶץ מִצְרָיִם
  english_pob_choice: the land of Egypt
  chosen_korean: 애굽 땅
  alternatives_korean:
  - 이집트 땅
  - 애굽의 땅
  lexicon: HALOT
  rationale: 문맥상 단순한 지명이 아니라 재앙이 미친 범위를 강조하므로 ‘땅’을 살렸고, 본문 전통과 가독성을 함께 고려해 ‘애굽 땅’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 본문은 신명기적 전통의 대체어가 아니라 고유한 언약명 עצם을 사용하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 폭풍 현상 속 ‘불’의 식별
  chosen_reading: 본문의 표현을 그대로 살려 ‘불이 땅으로 내려왔다’고 번역했습니다.
  alternative_readings:
  - ‘번개가 땅에 내리쳤다’로 해석적으로 옮김
  - ‘불길이 땅으로 내려왔다’로 의역
  rationale: 영어 POB도 ‘fire’ 본문을 보존하고 번개 가능성은 각주에서만 언급하므로, 본문에서는 과도한 자연현상 해석을 넣지 않고 원문 이미지를 유지했습니다.
  doctrine_reference: 본문 보존 원칙 및 소스 직접성
