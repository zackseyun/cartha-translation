source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
  footnotes:
  - marker: a
    text: Or “toward heaven.” The Hebrew word can mean “sky” or “heaven(s),” but here it refers to the visible heavens from which the hail comes.
    reason: lexical_alternative
  - marker: b
    text: “Man” here means human beings generally, in contrast with “beast.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 모세에게 말씀하셨습니다. “하늘[a]을 향해 네 손을 내밀어, 우박이 온 이집트 땅, 곧 사람[b]과 짐승과 이집트 땅에 있는 들의 모든 풀 위에 내리게 하여라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘들” 또는 “천상.” 히브리어는 ‘하늘’ 또는 ‘하늘들/천상’을 뜻할 수 있으나, 여기서는 우박이 내려오는 눈에 보이는 하늘을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람’은 ‘짐승’과 대조되는 일반적인 인간을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 언약적 고유명사 יְהוָה는 한국어에서도 제목이 아니라 이름으로 드러나는 ‘야훼’로 옮겼습니다.
- source_word: נְטֵה אֶת יָדְךָ
  english_pob_choice: Stretch out your hand
  chosen_korean: 네 손을 내밀어라
  alternatives_korean:
  - 네 손을 뻗어라
  - 네 손을 펴라
  lexicon: HALOT
  rationale: 명령형 נטה는 실제로 손을 위로/밖으로 내미는 동작을 가리키므로, 자연스러운 현대 한국어의 명령으로 ‘내밀어라’를 택했습니다.
- source_word: עַל הַשָּׁמַיִם
  english_pob_choice: toward the sky
  chosen_korean: 하늘을 향해
  alternatives_korean:
  - 하늘 쪽으로
  - 하늘을 향하여
  lexicon: HALOT
  rationale: 여기서는 우박이 내려오는 가시적 하늘을 가리키므로 ‘하늘’로 옮기되, 방향성을 살리기 위해 ‘향해’를 붙였습니다.
- source_word: וִיהִי בָרָד
  english_pob_choice: so that hail may come
  chosen_korean: 우박이 내려
  alternatives_korean:
  - 우박이 있게 하여
  - 우박이 오게 하여
  lexicon: HALOT
  rationale: 우박의 도래를 한국어에서 가장 자연스럽고 구체적으로 표현하는 동사는 ‘내리다’이며, 결과절의 의미를 잘 드러냅니다.
- source_word: הָאָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  lexicon: HALOT
  rationale: 우박의 피해 대상을 짐승과 대조하는 일반적 인간 집단으로 보아, 한국어에서는 성별 표지보다 포괄성이 분명한 ‘사람’을 택했습니다.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  english_pob_choice: every plant of the field
  chosen_korean: 들의 모든 풀
  alternatives_korean:
  - 들의 모든 식물
  - 들의 모든 초목
  lexicon: HALOT
  rationale: עֵשֶׂב은 문맥상 들판의 초목/풀을 가리키며, 한국어에서는 농경 피해의 감각을 살리는 ‘풀’이 가장 직접적입니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 본문은 하나님 이름을 직접 사용하는 서술문이므로, 호칭으로 완화하지 않고 고유명사를 보존하는 표기를 따랐습니다.
  doctrine_reference: 'POB contested terms: יְהוָה → Yahweh'
