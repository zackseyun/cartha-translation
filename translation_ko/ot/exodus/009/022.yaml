  source_fidelity: 개정이 필요합니다. 초안의 ‘닥치게 하겠다’는 히브리어 וִיהִי(우박이 있게/내리게 하라)의 결과·소망 표현을 야훼의 1인칭 미래 행위로 바꾸어 놓았습니다. 또한 우박의 대상 범위는 사람·짐승·밭의 모든 풀 ‘위에’ 미치도록 명시하는 편이 원문에 충실합니다.
  naturalness: ‘하늘을 향해 네 손을 내밀어라’는 자연스럽습니다. 다만 ‘온 이집트 땅 위로 우박이 내려, … 닥치게 하겠다’는 문장 연결이 부자연스럽고, ‘이집트 땅의 들의’는 겹친 소유 구조가 다소 뻣뻣합니다. ‘이집트 땅에 있는 들의 모든 풀’로 풀어 쓰면 현대 표준어에서 더 자연스럽습니다.
  terminology: ‘야훼’, ‘모세’, ‘우박’, ‘사람’, ‘짐승’은 적절합니다. עֵשֶׂב는 이 문맥에서 ‘풀’로 옮길 수 있습니다. 각주 표지는 해당 어휘 바로 뒤에 두어야 하며, 현재처럼 문장 끝에 함께 붙이면 참조 대상이 불분명합니다.
