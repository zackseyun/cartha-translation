  source_fidelity: 핵심 동사 הֶעֱמַדְתִּיךָ는 문맥상 파라오를 즉시 끊어 버리지 않고 계속 존속하게 하셨다는 뜻이 우세합니다. 초안의 ‘일으켜 세운’은 왕위에 올리거나 지위를 부여했다는 의미로 쉽게 읽혀 이 문맥의 우세한 뜻을 본문에서 흐릴 수 있습니다. ‘내 능력을 네게 보이고’ 및 ‘내 이름이 온 땅에서 선포되게’는 원문의 두 목적절을 충실히 반영합니다.
