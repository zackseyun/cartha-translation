  terminology: ‘능력’, ‘이름’, ‘온 땅’, ‘선포되다’는 적절합니다. הֶעֱמַדְתִּיךָ에는 ‘계속 서 있게 하다’를 사용하여 원문의 서다 이미지를 남기면서 보존의 문맥을 드러내고, ‘일으켜 세웠다’는 각주에 대안으로 보존하는 것이 안전합니다.
