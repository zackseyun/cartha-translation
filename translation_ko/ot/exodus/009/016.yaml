id: EXO.9.16
reference: Exodus 9:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
  footnotes:
  - marker: a
    text: Or, 'I have raised you up.' The Hebrew can be understood as causing Pharaoh to stand or remain, which in context likely means preserving him rather than immediately destroying him.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 내가 너를 계속 서 있게 한 것은 바로 이 때문입니다. 곧 내 능력을 네게 보이고, 내 이름이 온 땅에서 선포되게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너를 일으켜 세웠다.’ 히브리어는 파라오를 서 있게 하거나 존속하게 하셨다는 뜻으로 이해될 수 있으며, 문맥상 하나님께서 그를 즉시 멸하지 않고 보존하셨다는 뜻이 유력합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그렇지만
  lexicon: HALOT
  rationale: 앞절과의 강한 대조를 자연스러운 현대 한국어로 살리되, 문맥의 단절감은 과하지 않게 유지합니다.
- source_word: הֶעֱמַדְתִּיךָ
  english_pob_choice: I have let you stand
  chosen_korean: 너를 일으켜 세운 것은
  alternatives_korean:
  - 너를 서 있게 한 것은
  - 너를 남겨 둔 것은
  - 너를 세워 둔 것은
  lexicon: HALOT
  rationale: 히필의 ‘서 있게 하다/존속하게 하다’라는 이미지를 살리면서, 문맥상 바로 파멸시키지 않고 남겨 두신 뜻을 한국어로 전달합니다.
- source_word: סַפֵּר שְׁמִי
  english_pob_choice: my name may be proclaimed
  chosen_korean: 내 이름이 선포되게 하려는 것입니다
  alternatives_korean:
  - 내 이름이 알려지게 하려는 것입니다
  - 내 이름이 전해지게 하려는 것입니다
  lexicon: HALOT
  rationale: ספר의 ‘말하다/전하다’보다 공적 선포의 뉘앙스가 강하므로, 하나님의 이름이 널리 공표되는 의미를 살려 ‘선포되다’로 옮깁니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: in all the earth
  chosen_korean: 온 땅에서
  alternatives_korean:
  - 온 세상에서
  - 온 땅 가운데
  lexicon: HALOT
  rationale: 우주적 범위를 나타내는 표현이므로 ‘땅’으로 직역하되, 현대 독자가 자연스럽게 읽도록 ‘온 땅에서’로 정리합니다.
theological_decisions:
- issue: הֶעֱמַדְתִּיךָ의 의미를 어떻게 드러낼 것인가
  chosen_reading: 바로 죽이거나 폐위시키는 것이 아니라, 파라오를 계속 서 있게 하신 하나님의 주권적 보존을 드러냅니다.
  alternative_readings:
  - 파라오를 왕위에 올리신 뜻으로 읽을 수 있습니다.
  - 파라오를 특별히 높이신 뜻으로 읽을 수 있습니다.
  rationale: 문맥상 핵심은 하나님이 파라오를 즉시 제거하지 않고 목적을 위해 존속시키셨다는 점이므로, ‘일으켜 세우다’로 옮기되 과도한 왕권 부여로 오해될 표현은 피합니다.
  doctrine_reference: 원문 우선과 문맥적 주권 이해를 유지하되, 번역이 원문의 긴장을 평탄화하지 않도록 합니다.
