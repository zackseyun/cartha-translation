base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 아들들은 바다 한가운데를 마른 땅 위로 들어갔고, 물은 그들의 오른쪽과 왼쪽에 벽이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 아들들’은 히브리어의 문자적 표현입니다. 문맥상 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리면서도 한국어로 자연스럽게 읽히도록 ‘아들들’로 옮겼습니다. POB의 남성 복수 표지를 반영한 표현입니다.
- source_word: בְּתוֹךְ הַיָּם
  english_pob_choice: into the midst of the sea
  chosen_korean: 바다 한가운데를
  alternatives_korean:
  - 바다의 한가운데로
  - 바다 가운데로
  lexicon: HALOT
  rationale: ‘한가운데’는 ‘midst/middle’의 중심 이미지를 잘 살리며, 문맥상 이동 방향을 드러내기 위해 조사 ‘를’로 처리했습니다.
- source_word: בַּיַּבָּשָׁה
  english_pob_choice: on the dry ground
  chosen_korean: 마른 땅 위로
  alternatives_korean:
  - 마른 땅에서
  - 마른 땅 위에
  lexicon: HALOT
  rationale: 갈라진 바닥이 실제 발판이 된다는 장면을 살리기 위해 ‘땅 위로’로 옮겼습니다. ‘마른 땅’은 영어 POB의 구체성을 유지합니다.
- source_word: וְהַמַּיִם לָהֶם חֹמָה
  english_pob_choice: and the waters were a wall to them
  chosen_korean: 물은 그들의 오른쪽과 왼쪽에 벽이 되었습니다
  alternatives_korean:
  - 물은 그들에게 벽이 되었습니다
  - 물은 그들의 좌우에 벽이 되었습니다
  lexicon: HALOT
  rationale: ‘חֹמָה’를 ‘벽’으로 직역해 방벽의 구체적 이미지를 보존했습니다. 영어 POB의 ‘to them’은 위치 관계로 자연스럽게 풀어 한국어에서 ‘오른쪽과 왼쪽에’로 나타냈습니다.
theological_decisions:
- issue: 홍해 기적 장면의 서술 톤
  chosen_reading: 사실 서술을 유지하고, 기적의 초자연성을 과장하지 않으면서도 물이 ‘벽’이 되었다는 강한 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 물이 양쪽으로 갈라져 있었습니다
  - 물벽이 있었습니다
  rationale: 본문은 기적을 해설하기보다 사건 자체를 간결히 진술합니다. ‘벽’은 원문의 구체성과 긴장을 가장 잘 보존합니다.
  doctrine_reference: 출애굽 사건의 역사성 및 하나님의 구원 행위
