  terminology: ‘지팡이’, ‘이스라엘 자손’, ‘마른 땅’은 적절합니다. ‘이스라엘 자손’에 붙는 각주는 히브리어의 문자적 표현을 투명하게 설명하므로 유지하되, 해당 어구 바로 뒤에 배치했습니다.
