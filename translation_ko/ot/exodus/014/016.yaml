  to: 하지만 당신은 지팡이를 들어, 바다 위로 손을 내밀어 바다를 가르십시오. 그러면 이스라엘 자손[a]은 바다 한가운데를 마른 땅 위로 지나갈 것입니다.
  rationale: 원문의 명령 연쇄와 결과를 유지하면서, 손을 뻗는 방향(‘바다 위로’)과 마른 지면 위의 통과(‘마른 땅 위로’)를 더 정확히 반영했습니다. ‘바다 한가운데를 지나가다’는 בְּתוֹךְ הַיָּם의 내부·중심 공간 이미지를 자연스러운 한국어로 보존합니다.
