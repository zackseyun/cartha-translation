  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하지만 당신은 지팡이를 들어, 바다 위로 손을 내밀어 바다를 가르십시오. 그러면 이스라엘 자손[a]은 바다 한가운데를 마른 땅 위로 지나갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: But as for you
  chosen_korean: 하지만 당신은
  alternatives_korean:
  - 그리고 당신은
  - 그런데 당신은
  lexicon: HALOT
  rationale: 앞선 명령과 대비되는 모세에 대한 직접 호칭이므로, 단순한 연결보다 대조를 드러내는 ‘하지만’이 적절합니다.
- source_word: מַטְּךָ
  english_pob_choice: your staff
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 목자 지팡이
  lexicon: HALOT
  rationale: 모세 이야기에서 상징적 도구로 반복되는 מַטֶּה를 한국어로는 자연스럽고 현대적인 ‘지팡이’로 옮기는 것이 가장 무난합니다.
- source_word: וּבְקָעֵהוּ
  english_pob_choice: and split it
  chosen_korean: 그것을 가르십시오
  alternatives_korean:
  - 그것을 나누십시오
  - 그것을 쪼개십시오
  lexicon: HALOT
  rationale: בקע의 핵심 이미지는 물을 갈라 벌리는 동작이므로, ‘가르다’가 물리적이고 직관적인 표현입니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구조를 한국어 성경 관용에 맞게 비교적 투명하게 살리면서도, 과도하게 문자적이지 않은 표현으로 옮겼습니다.
- source_word: בְּתוֹךְ הַיָּם
  english_pob_choice: into the midst of the sea
  chosen_korean: 바다 한가운데로
  alternatives_korean:
  - 바다 가운데로
  - 바다 속으로
  lexicon: HALOT
  rationale: בְּתוֹךְ의 공간적 중심성을 살리되 한국어로는 ‘한가운데’가 가장 자연스럽고, 진행 방향을 드러내기 위해 조사 ‘-로’를 붙였습니다.
- source_word: בַּיַּבָּשָׁה
  english_pob_choice: on dry ground
  chosen_korean: 마른 땅을 밟고
  alternatives_korean:
  - 마른 땅 위로
  - 마른 땅에서
  lexicon: HALOT
  rationale: 단순 상태 설명보다 실제 보행 장면을 살려, ‘마른 땅을 밟고’로 옮기면 기적의 체감이 더 분명해집니다.
theological_decisions:
- issue: 모세의 행위가 바다를 가르는 표징적 명령으로 제시됨
  chosen_reading: ‘가르십시오’와 ‘마른 땅을 밟고 지나갈 것입니다’로 번역해, 인간의 행위와 하나님의 기적적 결과를 함께 드러냈습니다.
  alternative_readings:
  - ‘나누십시오’로 완화하는 번역
  - ‘건너갈 것입니다’로 결과만 강조하는 번역
  rationale: 본문은 모세에게 주어진 명령과 그 결과를 연결하므로, 명령의 강도와 기적의 시각성을 모두 살리는 번역이 필요합니다.
  doctrine_reference: 출애굽기 14장 홍해 사건의 서술적 표징성
