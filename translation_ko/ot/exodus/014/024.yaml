    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이집트 진영을 공포에 빠뜨리셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  english_pob_choice: in the morning watch
  chosen_korean: 새벽 경계 때에
  alternatives_korean:
  - 아침 경계 때에
  - 새벽 감시 때에
  - 아침 당직 때에
  lexicon: HALOT
  rationale: אַשְׁמֹרֶת의 ‘watch’ 감각을 살리되, 현대 한국어에서 자연스럽고 시간대가 분명한 표현으로 옮겼습니다.
- source_word: וַיַּשְׁקֵף
  english_pob_choice: looked down on
  chosen_korean: 내려다보시고
  alternatives_korean:
  - 살펴보시고
  - 굽어보시고
  - 바라보시고
  lexicon: HALOT
  rationale: 높은 위치에서 아래를 향해 보시는 방향성을 살려, 단순한 ‘보다’보다 ‘내려다보다’를 선택했습니다.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  english_pob_choice: through the pillar of fire and cloud
  chosen_korean: 불기둥과 구름기둥 사이로
  alternatives_korean:
  - 불기둥과 구름기둥 가운데서
  - 불기둥과 구름기둥 안에서
  - 불기둥과 구름기둥을 통해
  lexicon: HALOT
  rationale: ב의 매개/장소 감각을 드러내면서도 한국어로는 ‘사이로’가 가장 자연스럽게 신현(神顯)의 장면을 전달합니다.
- source_word: וַיָּהָם
  english_pob_choice: threw ... into confusion
  chosen_korean: 혼란에 빠뜨리셨습니다
  alternatives_korean:
  - 혼란에 빠뜨리셨습니다
  - 혼란에 떨게 하셨습니다
  - 패닉에 빠뜨리셨습니다
  lexicon: HALOT
  rationale: הום의 ‘소란/혼란/동요’ 의미를 살려, 전면적 패주보다 먼저 오는 심리적·전술적 혼란을 표현했습니다.
theological_decisions:
