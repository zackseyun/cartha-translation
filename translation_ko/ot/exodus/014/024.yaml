base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
  footnotes:
  - marker: a
    text: Or 'from within the pillar of fire and cloud.'
    reason: lexical_alternative
  - marker: b
    text: Or 'threw the camp of the Egyptians into panic.'
    reason: lexical_alternative
translation:
  language: ko
  text: 새벽 경계 때에 야훼께서 불기둥과 구름기둥 사이로 이집트 진영을 내려다보시고, 이집트 진영을 혼란에 빠뜨리셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불기둥과 구름기둥 안에서’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이집트 진영을 공포에 몰아넣으셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  english_pob_choice: in the morning watch
  chosen_korean: 새벽 경계 때에
  alternatives_korean:
  - 아침 경계 때에
  - 새벽 감시 때에
  - 아침 당직 때에
  lexicon: HALOT
  rationale: אַשְׁמֹרֶת의 ‘watch’ 감각을 살리되, 현대 한국어에서 자연스럽고 시간대가 분명한 표현으로 옮겼습니다.
- source_word: וַיַּשְׁקֵף
  english_pob_choice: looked down on
  chosen_korean: 내려다보시고
  alternatives_korean:
  - 살펴보시고
  - 굽어보시고
  - 바라보시고
  lexicon: HALOT
  rationale: 높은 위치에서 아래를 향해 보시는 방향성을 살려, 단순한 ‘보다’보다 ‘내려다보다’를 선택했습니다.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  english_pob_choice: through the pillar of fire and cloud
  chosen_korean: 불기둥과 구름기둥 사이로
  alternatives_korean:
  - 불기둥과 구름기둥 가운데서
  - 불기둥과 구름기둥 안에서
  - 불기둥과 구름기둥을 통해
  lexicon: HALOT
  rationale: ב의 매개/장소 감각을 드러내면서도 한국어로는 ‘사이로’가 가장 자연스럽게 신현(神顯)의 장면을 전달합니다.
- source_word: וַיָּהָם
  english_pob_choice: threw ... into confusion
  chosen_korean: 혼란에 빠뜨리셨습니다
  alternatives_korean:
  - 혼란에 빠뜨리셨습니다
  - 혼란에 떨게 하셨습니다
  - 패닉에 빠뜨리셨습니다
  lexicon: HALOT
  rationale: הום의 ‘소란/혼란/동요’ 의미를 살려, 전면적 패주보다 먼저 오는 심리적·전술적 혼란을 표현했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문에 직접 나온 신명사 표기를 일반 호칭으로 치환하지 않고, 프로젝트 기준에 따라 고유명사 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
