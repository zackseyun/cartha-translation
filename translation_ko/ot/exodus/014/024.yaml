translation:
  language: ko
  text: 새벽 경계 때에 야훼께서 불과 구름의 기둥을 통하여 이집트 진영을 내려다보시고[a], 이집트 진영을 혼란에 빠뜨리셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
