    rationale: עַמּוּד은 단수이며, אֵשׁ וְעָנָן은 그 기둥을 규정합니다. 따라서 ‘사이로’는 원문의 형상과 공간 관계를 충실히 반영하지 못합니다.
  - severity: medium
    issue: 각주 표지 [a], [b]가 문장 끝에 함께 놓여 있어 각각의 대안이 가리키는 본문 어구가 불명확합니다.
    rationale: '[a]는 기둥 관련 전치사구에, [b]는 ‘혼란에 빠뜨리셨습니다’에 붙여야 대안 독법의 범위가 정확해집니다.'
