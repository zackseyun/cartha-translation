  source_fidelity: 히브리어 בְּעַמּוּד אֵשׁ וְעָנָן은 ‘불과 구름의 기둥’이라는 단수 구문입니다. 초안의 ‘불기둥과 구름기둥 사이로’는 두 기둥을 전제하고 ‘사이’라는 본문에 없는 공간 관계를 더합니다. 또한 각주 표지는 해당 어구와 의미에 직접 붙여야 합니다.
  naturalness: ‘새벽 경계 때에’는 경계 교대의 시간이라는 의미를 전달하며 현대 한국어에서도 이해 가능합니다. ‘불과 구름의 기둥을 통하여’는 본문의 매개적/장소적 ב를 자연스럽게 반영합니다.
  terminology: 신명 ‘야훼’, 군사적 ‘진영’, 그리고 הום의 결과를 과장하지 않는 ‘혼란에 빠뜨리셨습니다’는 적절합니다. ‘불과 구름의 기둥’으로 단수 구문을 유지해야 합니다.
