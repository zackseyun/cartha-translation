id: EXO.14.10
reference: Exodus 14:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'Egypt'; the singular name stands for the Egyptian force pursuing them.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바로가 다가오자, 이스라엘 자손들이[b] 눈을 들어 보니, 이집트인들이[a] 그들을 뒤따라오고 있었습니다. 그들은 몹시 두려워했고, 이스라엘 자손들은 야훼께 부르짖었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 단수형 ‘이집트’를 쓰지만, 문맥상 그들을 뒤따라오는 이집트 군세를 가리킵니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפַרְעֹה הִקְרִיב
  english_pob_choice: As Pharaoh drew near
  chosen_korean: 바로가 가까이 다가오자
  alternatives_korean:
  - 바로가 다가오자
  - 파라오가 가까이 오자
  lexicon: HALOT
  rationale: 히필 הִקְרִיב은 여기서 ‘가까이 다가오다/다가오게 하다’보다 주어 바로의 접근을 나타내므로, 서사적 긴장감을 살리는 ‘가까이 다가오자’로 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손들
  lexicon: HALOT
  rationale: 원문은 문자적으로 ‘이스라엘의 아들들’이므로, POB의 성구적·성별-정확 표현을 따라 직역을 유지했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제
  lexicon: HALOT
  rationale: 갑작스러운 인지와 장면 전환을 드러내는 담화 표지이므로, 한국어에서도 주의를 환기하는 감탄형 ‘보십시오’로 살렸습니다.
- source_word: מִצְרַיִם נֹסֵעַ אַחֲרֵיהֶם
  english_pob_choice: the Egyptians were marching after them
  chosen_korean: 이집트가 그들 뒤를 따라오고 있었습니다
  alternatives_korean:
  - 이집트인들이 그들 뒤를 따라오고 있었습니다
  - 이집트가 그들을 추격하고 있었습니다
  lexicon: HALOT
  rationale: מִצְרַיִם의 단수 형식을 살려 ‘이집트’를 주어로 두되, 문맥상 군세 전체를 가리키는 집합적 용법으로 이해했습니다. נֹסֵעַ는 군사적 압박을 암시하지만 어근의 기본 이동 의미를 보존해 ‘따라오고 있었습니다’로 번역했습니다.
- source_word: וַיִּירְאוּ מְאֹד
  english_pob_choice: they were very afraid
  chosen_korean: 그들은 몹시 두려워졌고
  alternatives_korean:
  - 그들은 매우 두려웠고
  - 그들은 크게 두려워했고
  lexicon: HALOT
  rationale: 동작 진행을 보여 주는 서술 흐름에 맞추어, 단순 감정보다 상태 변화가 드러나는 ‘두려워졌고’로 자연스럽게 옮겼습니다.
- source_word: וַיִּצְעֲקוּ
  english_pob_choice: cried out
  chosen_korean: 부르짖었습니다
  alternatives_korean:
  - 외쳤습니다
  - 소리쳤습니다
  lexicon: HALOT
  rationale: 위기 속의 절박한 호소를 나타내는 동사로서, 한국어 성서 문체에서 강한 간구를 드러내는 ‘부르짖었습니다’가 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약 이름 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭으로 대체하지 않고 고유한 신명 자체를 보존했습니다.
theological_decisions:
- issue: 집합 명사 מִצְרַיִם의 처리
  chosen_reading: ‘이집트’로 번역하되 문맥상 이집트 군세 전체를 가리키는 집합적 용법으로 이해했습니다.
  alternative_readings:
  - ‘이집트인들’로 풀어 쓰기
  - ‘애굽’으로 전통 번역 유지
  rationale: 히브리어는 단수 형태를 쓰지만, 추격하는 대상을 민족/군세로 이해해야 하므로 본문 형식과 문맥 의미를 함께 보존하는 쪽을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §2: source-form preservation with contextual clarity'
- issue: 신명 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명을 사용하므로 호칭 대체를 피하고, 프로젝트 표준에 따라 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
