revisions:
- from: 바로 그때 바로가 가까이 다가오자, 이스라엘의 아들들은 눈을 들어 보았는데, 보십시오, 이집트가 그들 뒤를 따라오고 있었습니다. 그들은 몹시 두려워졌고, 이스라엘의 아들들은 야훼께 부르짖었습니다.[a][b]
  to: 바로가 다가오자, 이스라엘 자손들이[b] 눈을 들어 보니, 이집트인들이[a] 그들을 뒤따라오고 있었습니다. 그들은 몹시 두려워했고, 이스라엘 자손들은 야훼께 부르짖었습니다.
  rationale: 원문에 없는 시간 부사를 제거하고, 갑작스러운 인지를 나타내는 וְהִנֵּה를 한국어 서술에 자연스러운 ‘보니’로 옮겼습니다. מִצְרַיִם의 집합적 지시 대상은 본문에서 명료하게 하되 단수형 정보는 각주에 보존했습니다. ‘이스라엘 자손들’은 현대 한국어에서 자연스러우면서도 בְנֵי יִשְׂרָאֵל의 전통적·집단적 의미를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:39Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 사건 순서와 야훼 신명은 보존되었으나, 원문에 없는 ‘바로 그때’가 첨가되어 있고, 집합적으로 쓰인 מִצְרַיִם을 본문에서 단순 국가명 ‘이집트’로 처리하면 실제로 뒤따라오는 인적 군세가 다소 불명확합니다. וַיִּירְאוּ는 상태 변화인 ‘두려워졌다’보다 ‘두려워했다’로 옮기는 것이 더 충실합니다.
  naturalness: ‘바로 그때 바로’는 반복적이며 부자연스럽고, ‘이스라엘의 아들들’은 현대 한국어에서 부자연스럽게 남성 집단으로 한정되어 들릴 수 있습니다. 관용적이면서도 원문의 계보적·집단적 표현을 보존하는 ‘이스라엘 자손들’이 적절합니다. 또한 ‘보십시오’는 독자에게 직접 말하는 표현이므로 서술 장면에는 ‘보니’가 자연스럽습니다.
  terminology: ‘야훼’는 יְהוָה의 프로젝트 표준과 일치합니다. ‘이스라엘 자손들’은 בְנֵי יִשְׂרָאֵל의 한국어 성서 관용 표현으로, 원문의 집단 지칭을 보존합니다. מִצְרַיִם은 본문에서 ‘이집트인들’로 명시하고, 원문의 단수 지명형은 각주에서 밝혀 문맥적 명료성과 형태 정보를 함께 보존합니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘바로 그때’의 첨가
    rationale: וּפַרְעֹה הִקְרִיב은 ‘바로가 다가오자’라는 시간적 전환만 나타내며, 특정한 ‘그때’를 별도로 첨가하지 않습니다.
  - severity: medium
    issue: ‘이집트가 그들 뒤를 따라오고 있었습니다’의 지시 대상 불명확
    rationale: מִצְרַיִם은 지명 단수형이지만 문맥상 추격하는 이집트 군세/사람들을 가리킵니다. 한국어 본문에서는 ‘이집트인들이’가 자연스럽고 명확하며, 형태상 특성은 각주로 보존할 수 있습니다.
  - severity: low
    issue: ‘두려워졌고’의 불필요한 상태 변화 의미
    rationale: וַיִּירְאוּ מְאֹד는 ‘매우 두려워했다’라는 공포의 반응을 서술합니다. ‘두려워했고’가 불필요한 변화의 뉘앙스 없이 더 가깝습니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주는 각각 ‘이집트인들’과 ‘이스라엘 자손들’이라는 관련 표현 바로 뒤에 두어 독자가 대상을 즉시 알 수 있게 해야 합니다.
  revised_text: 바로가 다가오자, 이스라엘 자손들이[b] 눈을 들어 보니, 이집트인들이[a] 그들을 뒤따라오고 있었습니다. 그들은 몹시 두려워했고, 이스라엘 자손들은 야훼께 부르짖었습니다.
