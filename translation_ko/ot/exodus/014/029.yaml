translation:
  language: ko
  text: 그런데 이스라엘 자손은 바다 한가운데의 마른 땅 위를 걸어갔습니다.[a] 물은 그들의 오른쪽과 왼쪽에 벽이 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들은 마른 땅 위로 바다를 지나갔습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘물은 그들에게 벽이 되었다’라고 하며, 어떤 이들은 이를 ‘벽처럼’으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  english_pob_choice: But the sons of Israel
  chosen_korean: 그런데 이스라엘 자손은
  alternatives_korean:
  - 이스라엘의 아들들은
  - 이스라엘 사람들은
  lexicon: HALOT
  rationale: 히브리어 표현을 직역하면 ‘이스라엘의 아들들’이지만, 한국어에서는 ‘이스라엘 자손’이 혈연·언약 공동체를 자연스럽게 살리면서도 POB의 남성형 보존 의도를 과도하게 낯설게 만들지 않습니다.
- source_word: הָלְכוּ בַיַּבָּשָׁה בְּתוֹךְ הַיָּם
  english_pob_choice: walked on dry ground through the midst of the sea
  chosen_korean: 바다 한가운데를 지나 마른 땅으로 걸어갔습니다
  alternatives_korean:
  - 마른 땅 위로 바다 가운데를 지나갔습니다
  - 바다 한가운데의 마른 땅을 걸었습니다
  lexicon: HALOT
  rationale: הלך와 בתוך의 공간감을 함께 살리기 위해 ‘지나’와 ‘걸어갔습니다’를 병행했고, בַיַּבָּשָׁה는 ‘마른 땅’으로 옮겨 기적적 상태를 드러냈습니다.
- source_word: וְהַמַּיִם לָהֶם חֹמָה
  english_pob_choice: and the waters were a wall to them
  chosen_korean: 물은 그들에게 벽이 되었습니다
  alternatives_korean:
  - 물은 그들에게 담이 되었습니다
  - 물은 그들에게 성벽이 되었습니다
  lexicon: HALOT
  rationale: חֹמָה는 기본적으로 ‘벽’이므로 이를 유지하되, 한국어에서는 ‘벽이 되었습니다’로 옮겨 물이 보호막처럼 선다는 진술을 자연스럽게 표현했습니다.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  english_pob_choice: on their right and on their left
  chosen_korean: 오른쪽과 왼쪽에
  alternatives_korean:
  - 그들의 오른편과 왼편에
  - 오른손과 왼손 쪽에
  lexicon: HALOT
  rationale: 평행 구조를 간결하게 살리기 위해 ‘오른쪽과 왼쪽에’로 옮겼으며, 전치사 מן의 위치 의미를 문맥상 충분히 전달합니다.
theological_decisions:
- issue: ‘But’의 접속 감각과 문맥 대비
  chosen_reading: 그런데
  alternative_readings:
  - 그리고
  - 하지만
  rationale: 앞 문맥의 애굽군 멸망과 대조되는 구원을 드러내기 위해 단순 병렬보다 전환·대비를 띠는 ‘그런데’를 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
