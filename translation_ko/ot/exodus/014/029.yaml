revisions:
- from: 그런데 이스라엘 자손은 바다 한가운데를 지나 마른 땅으로 걸어갔습니다. 물은 그들에게 오른쪽과 왼쪽에 벽이 되었습니다.[a][b]
  to: 그런데 이스라엘 자손은 바다 한가운데의 마른 땅 위를 걸어갔습니다.[a] 물은 그들의 오른쪽과 왼쪽에 벽이 되었습니다.[b]
  rationale: 마른 땅이 바다 한가운데에 있었고 이스라엘 자손이 그 위를 걸었다는 원문의 공간 관계를 한국어에서 분명히 했습니다. 물이 좌우에서 벽이었다는 병행 표현과 חוֹמָה의 직설적 의미는 유지했습니다. 각주 b는 영어 감사 기록의 비한정적 표현을 따라 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:43:06Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘마른 땅으로 걸어갔습니다’의 ‘-으로’는 목적지·방향으로 읽힐 수 있어, 바다 가운데에서 ‘마른 땅 위를’ 걸었다는 בַּיַּבָּשָׁה의 위치·수단적 의미를 더 분명히 해야 합니다.
  naturalness: ‘바다 한가운데를 지나 마른 땅으로 걸어갔습니다’는 한국어 어순상 마른 땅에 이르렀다는 뜻으로 잠시 읽힐 수 있습니다. ‘바다 한가운데의 마른 땅 위를 걸어갔습니다’가 자연스럽고 의미도 분명합니다. 또한 ‘그들에게 오른쪽과 왼쪽에 벽이 되었습니다’보다 ‘그들의 오른쪽과 왼쪽에 벽이 되었습니다’가 자연스럽습니다.
  terminology: ‘이스라엘 자손’, ‘물’, ‘벽’은 원문의 표현과 현대 한국어의 격식 있는 성경 문체에 잘 맞습니다. חוֹמָה의 직설적 표현인 ‘벽’을 유지해야 하며, 본문에 ‘벽처럼’을 넣지 않는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘마른 땅으로’의 격조사 선택
    rationale: בַּיַּבָּשָׁה는 이스라엘 자손이 걸었던 바닥의 상태와 위치를 나타냅니다. 한국어 ‘마른 땅으로’는 목적지나 방향으로 해석될 여지가 있으므로 ‘마른 땅 위를’로 고치는 것이 안전합니다.
  - severity: low
    issue: 두 번째 각주의 주체 표현
    rationale: 영어 감사 기록은 ‘some understand’라고 하며, 특정 번역들이 그렇게 한다고 한정하지 않습니다. ‘어떤 이들은’으로 옮겨 원문의 범위를 보존하는 것이 좋습니다.
  revised_text: 그런데 이스라엘 자손은 바다 한가운데의 마른 땅 위를 걸어갔습니다.[a] 물은 그들의 오른쪽과 왼쪽에 벽이 되었습니다.[b]
  revised_footnotes:
