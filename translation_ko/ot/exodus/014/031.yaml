reference: Exodus 14:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
  footnotes:
  - marker: a
    text: Or 'the mighty hand' or 'the great power.' The Hebrew reads literally 'the great hand,' a common image for power.
    reason: lexical_alternative
  - marker: b
    text: Or 'that the LORD had done in Egypt' or 'to Egypt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘은 야훼께서 이집트에 행하신 그 큰 손을 보았습니다[a]. 백성은 야훼를 두려워했고, 야훼와 그의 종 모세를 믿었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 강한 손’ 혹은 ‘그 큰 권능’. 히브리어는 문자적으로 ‘그 큰 손’이라고 하며, 권능을 가리키는 흔한 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּד הַגְּדֹלָה
  english_pob_choice: the great hand
  chosen_korean: 그 큰 손
  alternatives_korean:
  - 큰 손
  - 그 위대한 손
  - 큰 권능
  lexicon: HALOT
  rationale: 직역의 이미지인 ‘손’을 살리면서, 가독성을 위해 관형사 ‘그’를 더해 문맥상 특정된 야훼의 권능을 드러냈습니다.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  english_pob_choice: that the LORD had done in Egypt / against Egypt
  chosen_korean: 야훼께서 이집트에 행하신
  alternatives_korean:
  - 야훼께서 이집트에서 행하신
  - 야훼께서 이집트에 대해 행하신
  - 야훼께서 이집트에 행하신 일
  lexicon: HALOT
  rationale: 본문의 동사 עָשָׂה를 ‘행하신’으로 옮겨 동작 자체를 보존했고, בְּמִצְרַיִם은 문맥상 심판의 대상인 이집트를 가리켜 ‘이집트에’로 자연스럽게 처리했습니다.
- source_word: וַיִּירְאוּ
  english_pob_choice: feared
  chosen_korean: 두려워했고
  alternatives_korean:
  - 경외했고
  - 두려워하여
  - 경외하여
  lexicon: HALOT
  rationale: 예배적 뉘앙스를 배제하지 않되, 기본 어휘값인 ‘두려워하다’를 유지해 원문의 반응을 직접적으로 드러냈습니다.
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  english_pob_choice: and in Moses his servant
  chosen_korean: 모세를 믿었습니다
  alternatives_korean:
  - 모세, 그의 종을 믿었습니다
  - 그의 종 모세를 믿었습니다
  - 모세를, 그의 종으로 믿었습니다
  lexicon: HALOT
  rationale: בְ with אמן은 ‘~을 믿다/신뢰하다’로 자연스럽게 옮길 수 있으므로, 한국어에서는 ‘모세를 믿었습니다’로 압축하되 앞의 ‘야훼와’와 병렬을 유지했습니다.
theological_decisions:
- issue: YHWH의 표기와 모세에 대한 신뢰의 범위
  chosen_reading: יהוה는 ‘야훼’로 표기하고, 모세에 대한 믿음은 야훼에 대한 믿음과 병렬되는 종속적 신뢰로 제시했습니다.
  alternative_readings:
  - ‘주님’으로 완곡하게 표기하기
  - 모세를 ‘믿었다’보다 ‘신뢰했다’로 풀어 쓰기
  rationale: 고유한 신적 이름을 보존하는 번역 원칙을 따랐고, 본문은 모세를 야훼와 동등한 대상으로 두지 않으므로 ‘그의 종’이 모세의 종속적 지위를 분명히 합니다.
  doctrine_reference: Translation philosophy §3; affirmations on preserving the divine name and subordinate agency
