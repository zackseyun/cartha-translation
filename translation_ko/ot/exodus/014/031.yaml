revisions:
- from: 이스라엘은 야훼께서 이집트에 행하신 그 큰 손을 보았습니다[a]. 백성은 야훼를 두려워했고, 야훼와 그의 종 모세를 믿었습니다.
  to: 이스라엘은 야훼께서 이집트를 향하여 행하신 큰 손을 보았습니다[a][b]. 백성은 야훼를 두려워했고, 야훼와 그의 종 모세를 믿었습니다.
  rationale: 히브리어의 ‘큰 손’이라는 은유와 야훼의 이름을 보존했습니다. 불필요한 ‘그’를 제거하고, 이집트에 대한 행위라는 문맥적 이해를 ‘이집트를 향하여’로 자연스럽게 드러냈습니다. 논쟁 가능한 전치사 해석은 각주에 문자적 대안을 제시했습니다. ‘그의 종 모세’를 유지하여 모세의 종속적 지위를 생략하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:51Z'
