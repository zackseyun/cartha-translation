base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
  footnotes:
  - marker: a
    text: Or 'the messenger of God.' The Hebrew word can mean either 'angel' or 'messenger.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 진영 앞에서 가던 하나님의 천사[a]가 자리를 옮겨 그들 뒤로 갔고, 구름 기둥도 그들 앞에서 옮겨 그들 뒤에 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 사자’. 히브리어 단어는 ‘천사’와 ‘사자’ 둘 다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  english_pob_choice: the angel of God
  chosen_korean: 하나님의 천사
  alternatives_korean:
  - 하나님의 사자
  - 하나님의 메신저
  lexicon: HALOT
  rationale: מַלְאָךְ는 문맥에 따라 ‘천사’ 또는 ‘사자/메신저’가 될 수 있으나, 이 구절의 인도자 표상에는 한국어 성경에서 자연스럽고 본문 의미를 잘 드러내는 ‘하나님의 천사’가 적절합니다.
- source_word: הַהֹלֵךְ לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  english_pob_choice: who had been going before the camp of Israel
  chosen_korean: 이스라엘 진영 앞에서 가던 중에
  alternatives_korean:
  - 이스라엘 진영 앞에서 계속 가던
  - 이스라엘 진영 앞을 가던
  lexicon: HALOT
  rationale: 분사 הַהֹלֵךְ는 앞서 계속 진행하던 상태를 나타내므로, 뒤이어 ‘뒤로 옮겨 갔다’는 동작과 대비되도록 ‘가던 중에’로 옮겼습니다.
- source_word: וַיִּסַּע ... וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  english_pob_choice: moved and went behind them
  chosen_korean: 뒤로 옮겨 갔고
  alternatives_korean:
  - 옮겨 뒤로 갔고
  - 그들 뒤로 이동했고
  lexicon: HALOT
  rationale: נסע와 הלך의 연속은 단순 이동보다 ‘위치가 바뀌는 움직임’을 강조하므로, 한국어에서는 중복을 줄이면서도 공간적 전환을 살리는 ‘뒤로 옮겨 갔고’로 압축했습니다.
- source_word: עַמּוּד הֶעָנָן
  english_pob_choice: the pillar of cloud
  chosen_korean: 구름 기둥
  alternatives_korean:
  - 구름의 기둥
  - 구름기둥
  lexicon: HALOT
  rationale: 이 결합어는 출애굽기에서 반복되는 표준 표상으로, 한국어에서도 익숙하고 직관적인 ‘구름 기둥’을 유지해 시각적 이미지를 살렸습니다.
theological_decisions:
- issue: ‘하나님의 천사’의 정체를 어디까지 밝힐 것인가
  chosen_reading: 본문이 명시하는 호칭만 유지하고, 그 존재가 피조 천사인지, 신적 현현인지, 또는 다른 방식의 현현인지는 결정하지 않았습니다.
  alternative_readings:
  - 하나님의 사자
  - 신현으로 풀어 쓰는 번역
  rationale: 히브리어는 호칭은 주지만 존재론을 설명하지 않으므로, POB의 영어 처리처럼 해석을 과도하게 고정하지 않고 본문이 허용하는 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
