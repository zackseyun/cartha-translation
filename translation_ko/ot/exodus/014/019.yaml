revisions:
- from: 하나님의 천사[a]가 이스라엘 진영 앞에서 가던 중에 뒤로 옮겨 갔고, 구름 기둥도 그들 앞에서 옮겨 그들 뒤에 섰습니다.
  to: 이스라엘 진영 앞에서 가던 하나님의 천사[a]가 자리를 옮겨 그들 뒤로 갔고, 구름 기둥도 그들 앞에서 옮겨 그들 뒤에 섰습니다.
  rationale: The revision makes the Hebrew participle a clear modifier of ‘하나님의 천사,’ preserves the angel’s two sequential actions, and keeps the repeated front/rear spatial contrast. It retains the source’s ambiguity concerning the identity of מַלְאַךְ without importing a theological conclusion.
