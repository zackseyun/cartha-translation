lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 히브리어 고유명사 יהוה를 지칭하는 하나님의 언약 이름으로, 본문이 요구하는 고유성을 살리기 위해 관용적 대체어보다 음역인 ‘야훼’를 택했습니다.
- source_word: יִלָּחֵם
  english_pob_choice: will fight
  chosen_korean: 싸우실 것이니
  alternatives_korean:
  - 싸우실 것입니다
  - 전쟁하실 것이니
  - 싸우실 것입니다
  lexicon: HALOT
  rationale: 동사의 군사적 의미를 그대로 살리되, 현대 한국어에서 자연스러운 표현인 ‘싸우시다’로 옮겼습니다.
- source_word: לָכֶם
  english_pob_choice: for you
  chosen_korean: 여러분을 위해
  alternatives_korean:
  - 여러분을 위하여
  - 여러분을 대신해
  - 여러분 편에서
  lexicon: HALOT
  rationale: 이 전치사는 이스라엘을 위한 유익/대리의 뜻을 나타내므로, 한국어에서는 목적과 혜택을 함께 드러내는 ‘여러분을 위해’가 가장 간결합니다.
- source_word: תַּחֲרִישׁוּן
  english_pob_choice: you must be silent
  chosen_korean: 잠잠하십시오
  alternatives_korean:
  - 조용히 계십시오
  - 입을 다무십시오
  - 침묵하십시오
  lexicon: HALOT
  rationale: 형태상 미래형이지만 문맥상 권면/명령의 힘을 가지므로, 출애굽기의 장엄한 어조를 살리면서도 현대 합쇼체에 맞는 ‘잠잠하십시오’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 본문의 하나님의 이름 יהוה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 구절은 제목이 아니라 언약의 고유 이름을 직접 사용하므로, 대체 칭호보다 음역 표기가 원문의 신학적·문학적 효과를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
