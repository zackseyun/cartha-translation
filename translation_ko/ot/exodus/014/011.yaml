  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
  footnotes:
  - marker: a
    text: Or, more formally, “Is it for lack of graves in Egypt that you have taken us to die in the wilderness?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 모세에게 말했습니다. 「이집트에 무덤이 없어서 우리를 광야에서 죽게 하려고 데려가셨습니까?」[a] 「우리를 이집트에서 데리고 나오셔서 우리에게 이런 일을 하신 것이 대체 무엇입니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, 「이집트에 무덤이 없기라도 해서 우리를 광야에서 죽게 하려고 데려가신 것입니까?」
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: And they said
  chosen_korean: 그들이 말했습니다
  alternatives_korean:
  - 그들이 말하였습니다
  - 그들이 이야기했습니다
  lexicon: HALOT
  rationale: 서사 진행의 wayyiqtol을 자연스럽게 살리면서 직접화법을 여는 기본 동사로 ‘말했습니다’를 택했습니다.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  english_pob_choice: Was it because there were no graves in Egypt
  chosen_korean: 이집트에 무덤이 없어서
  alternatives_korean:
  - 이집트에 무덤이 없기 때문이었습니까
  - 이집트에 무덤이 없어서 그러셨습니까
  lexicon: HALOT
  rationale: 히브리어의 빈정대는 수사 의문을 한국어에서는 원인절 형태로 자연스럽게 옮겨, 조롱의 뉘앙스를 보존했습니다.
- source_word: לְהוֹצִיאָנוּ מִמִּצְרַיִם
  english_pob_choice: by bringing us out of Egypt
  chosen_korean: 우리를 이집트에서 데리고 나오셔서
  alternatives_korean:
  - 우리를 이집트에서 나오게 하셔서
  - 우리를 이집트에서 인도해 내셔서
  lexicon: HALOT
  rationale: הוציא의 ‘데리고 나오다/끌어내다’ 의미를 살리면서, 앞선 항의와 연결되는 수단·원인 관계를 한국어의 서술 연결로 표현했습니다.
theological_decisions:
- issue: 이집트 탈출에 대한 백성의 원망을 직접화법으로 어떻게 드러낼지
  chosen_reading: 도전적이고 항의하는 어조를 그대로 살려, 공손한 서술 안에서도 내용상 비난의 강도를 약화시키지 않았습니다.
  alternative_readings:
  - 좀 더 완곡하게 ‘왜 우리를 이집트에서 데리고 나오셨습니까?’로 정리하는 방식
  rationale: 본문은 단순 질문이 아니라 모세에 대한 비아냥과 원망을 담고 있으므로, 수사 의문과 항의의 뉘앙스를 유지하는 것이 본문의 의도를 더 잘 반영합니다.
  doctrine_reference: 본문 문맥의 서사적/수사적 의미 보존
- issue: 모세에게 한 말의 한국어 종결형
  chosen_reading: 서술문은 합쇼체를 유지하되, 직접 인용 안의 항의는 내용 자체로 드러나게 했습니다.
  alternative_readings:
  - 직접 인용 전체를 더 구어적으로 처리하는 방식
  rationale: 현대 문어체 성경 문체에 맞추면서도, 인물들의 감정적 긴장을 희석하지 않기 위한 선택입니다.
  doctrine_reference: Korean style consistency
