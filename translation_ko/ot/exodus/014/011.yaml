  source_fidelity: 첫 질문의 '데려오셨습니까'는 모세가 백성을 현재 위치로 데려온다는 방향을 암시하여 לקח('데려가다, 끌고 가다')의 비난조 이동을 충분히 드러내지 못합니다. '데려가셨습니까'가 더 충실합니다. 둘째 질문은 원문의 מַה זֹּאת('이것이 무엇입니까/무슨 일입니까')와 뒤따르는 부정사구의 관계를 분명히 하도록 다듬는 것이 좋습니다.
