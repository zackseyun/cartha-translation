translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “왜 내게 부르짖고 있습니까? 이스라엘 자손[a]에게 길을 떠나라고 말하십시오.[b]”
  philosophy: optimal-equivalence
  footnotes:
