  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
  footnotes:
  - marker: a
    text: Or “the Israelites.”
    reason: lexical_alternative
  - marker: b
    text: Or “to go forward.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “어찌하여 내게 부르짖고 있느냐? 이스라엘 자손에게 앞으로 나아가라고 말하여라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들에게.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “앞으로 나아가라고.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 POB의 기본 원칙에 따라 하나님의 고유명사로 옮겨야 하므로, 관용적 대명사나 호칭인 ‘주’가 아니라 ‘야훼’를 사용했습니다.
- source_word: מַה תִּצְעַק אֵלַי
  english_pob_choice: Why are you crying out to me
  chosen_korean: 어찌하여 내게 부르짖고 있느냐
  alternatives_korean:
  - 왜 내게 부르짖고 있느냐
  - 무슨 일로 내게 부르짖고 있느냐
  lexicon: HALOT
  rationale: מַה의 책망 섞인 질문을 ‘어찌하여’로 살리고, צעק의 강한 호소성을 ‘부르짖다’로 반영했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구성과 언약적 표현을 살리되, 한국어 성경에서 널리 읽히는 자연스러운 표현인 ‘이스라엘 자손’을 택했습니다.
- source_word: וְיִסָּעוּ
  english_pob_choice: to set out
  chosen_korean: 앞으로 나아가라고
  alternatives_korean:
  - 출발하라고
  - 떠나라고
  - 진군하라고
  lexicon: HALOT
  rationale: נסע는 여기서 진영을 풀고 이동하라는 뜻이므로, 단순한 ‘가다’보다 명령의 방향성을 드러내는 ‘앞으로 나아가다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름을 번역어로 둘지 음역어로 둘지
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 یְהוָה를 사용하므로, 전통적 호칭으로 대체하지 않고 고유명을 보존해 이스라엘에게 자신을 드러내신 언약의 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
