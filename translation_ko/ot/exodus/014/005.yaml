source:
  edition: WLC
  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
  footnotes:
  - marker: a
    text: Or, “the mind of Pharaoh and his servants was changed toward the people.”
    reason: lexical_alternative
  - marker: b
    text: Or, “that we have released Israel from our service” or “from being our slaves.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트 왕에게 그 백성이 도망쳤다는 소식이 전해졌습니다. 그러자 바로와 그의 신하들의 마음이 그 백성에게서 돌아섰습니다[a]. 그들이 말했습니다. “이스라엘을 우리를 섬기는 데서 풀어주다니, 우리가 무슨 일을 한 것입니까?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바로와 그의 신하들의 마음이 그 백성에 대하여 바뀌었다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “이스라엘을 우리의 섬김에서 풀어준 것” 또는 “이스라엘을 우리의 노예로 지내는 데서 풀어준 것.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד / It was reported
  english_pob_choice: It was reported
  chosen_korean: 말이 전해지자
  alternatives_korean:
  - 보고가 들어오자
  - 알려지자
  lexicon: HALOT
  rationale: 주어 없는 수동적 보고 상황을 자연스러운 한국어로 살리되, 행위자를 특정하지 않는 원문의 비인칭성을 유지했습니다.
- source_word: לְמֶלֶךְ מִצְרַיִם / to the king of Egypt
  english_pob_choice: to the king of Egypt
  chosen_korean: 이집트 왕에게
  alternatives_korean:
  - 이집트의 왕에게
  - 애굽 왕에게
  lexicon: HALOT
  rationale: 표준어 현대 문맥에 맞는 자연스러운 지명+직함 순서를 택했고, 성경적 고유형인 ‘애굽’보다 현대 지명인 ‘이집트’를 사용했습니다.
- source_word: לְבַב פַּרְעֹה וַעֲבָדָיו / the heart of Pharaoh and of his servants
  english_pob_choice: the heart of Pharaoh and of his servants
  chosen_korean: 바로와 그의 신하들의 마음
  alternatives_korean:
  - 바로와 그의 종들의 마음
  - 바로와 그의 신하들의 심정
  lexicon: HALOT
  rationale: לְבַב을 ‘마음’으로 옮겨 히브리어의 내적 중심 이미지를 보존했고, ‘신하들’은 פַּרְעֹה의 수행자/관료들을 가리키는 문맥상 자연한 대응어입니다.
- source_word: מַה זֹּאת עָשִׂינוּ / What is this we have done
  english_pob_choice: What is this we have done
  chosen_korean: 이게 도대체 우리가 한 일이 무엇입니까
  alternatives_korean:
  - 우리가 대체 무슨 일을 한 것입니까
  - 우리가 도대체 무엇을 한 것입니까
  lexicon: HALOT
  rationale: 히브리어의 ‘무엇-이것’이라는 당혹과 자책의 중첩을 살리기 위해 ‘이게 도대체…무엇입니까’로 옮겼습니다.
- source_word: מֵעָבְדֵנוּ / from serving us
  english_pob_choice: from serving us
  chosen_korean: 우리를 섬기는 데서 놓아준 것
  alternatives_korean:
  - 우리의 섬김에서 풀어준 것
  - 우리의 종노릇에서 풀어준 것
  lexicon: HALOT
  rationale: 직접적인 어휘는 ‘섬기다’이므로 본문은 그 표현을 따르되, ‘놓아준 것’으로 שׁלח의 풀어줌/해방의 뉘앙스를 담았습니다.
theological_decisions:
- issue: Egypt's view of Israel's status in the final clause
  chosen_reading: ‘우리를 섬기는 데서’로 옮겨, 본문 자체의 표현을 유지했습니다.
  alternative_readings:
  - ‘우리의 노예 상태에서’
  - ‘우리의 종살이에서’
  rationale: 출애굽기 전체 맥락은 강제 노동과 예속을 전제하지만, 이 절의 직접 표현은 ‘섬기다’이므로 본문 수준에서는 과도한 해석을 피했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: Idiomatic hostility in אֶל הָעָם
  chosen_reading: ‘그 백성을 향해’
  alternative_readings:
  - ‘그 백성에게’
  - ‘그 백성에 대해’
  rationale: 히브리어의 방향 전환 표현을 한국어에서 자연스럽게 살리되, 이 문맥의 적대적 기류는 동사와 전체 흐름이 드러내므로 별도의 ‘against’ 번역을 과장하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
