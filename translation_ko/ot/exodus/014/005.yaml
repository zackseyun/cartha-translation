revisions:
- from: 이집트 왕에게 그 백성이 도망쳤다는 말이 전해지자[a], 바로와 그의 신하들의 마음이 그 백성을 향해 돌이켰고, 그들이 말했습니다. “이게 도대체 우리가 한 일이 무엇입니까[b]? 이스라엘을 우리를 섬기는 데서 놓아준 것이?”
  to: 이집트 왕에게 그 백성이 도망쳤다는 소식이 전해졌습니다. 그러자 바로와 그의 신하들의 마음이 그 백성에게서 돌아섰습니다[a]. 그들이 말했습니다. “이스라엘을 우리를 섬기는 데서 풀어주다니, 우리가 무슨 일을 한 것입니까?”[b]
  rationale: 비인칭 수동 서술을 유지하고, 바로와 신하들의 태도가 이스라엘에게서 돌아선다는 문맥상 의미를 자연스러운 한국어로 표현했습니다. 마지막 발화는 히브리어의 당혹과 후회를 나타내는 의문문으로 완결했으며, 각주 표지를 실제로 설명하는 구절 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:52Z'
