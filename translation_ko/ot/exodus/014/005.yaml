    rationale: '[a]는 ‘도망쳤다’ 뒤에 있으나 해당 각주는 바로와 신하들의 마음이 변했다는 대안을 설명합니다. [b]는 ‘우리가 한 일’ 뒤에 있으나 해당 각주는 이스라엘을 섬김에서 풀어준다는 마지막 절의 대안을 설명합니다. 표지를 각각 관련 본문 구절 뒤로 옮겨야 합니다.'
