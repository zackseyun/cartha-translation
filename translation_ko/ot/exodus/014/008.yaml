source:
  edition: WLC
  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
  footnotes:
  - marker: a
    text: Or 'strengthened the heart of Pharaoh.' The Hebrew verb literally means 'made strong/firm,' though in Exodus this expression commonly carries the sense 'hardened.'
    reason: lexical_alternative
  - marker: b
    text: Or 'boldly' or 'with uplifted hand.' The Hebrew idiom is literally 'with a raised hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 바로—곧 애굽의 왕—의 마음을 굳게 하시니, 그가 이스라엘의 자손들을 뒤쫓았습니다. 이스라엘의 자손들은 높이 든 손으로 나아가고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강하게 하시니.’ 히브리어 동사는 문자적으로 ‘강하게/굳게 하다’를 뜻하지만, 출애굽기에서는 일반적으로 ‘완고하게 하다’는 의미로 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘높이 든 손으로.’ 히브리어 관용구는 문자적으로 ‘올려 든 손으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: WLC
  rationale: 본문의 신명(여호와)을 한국어 교회 독자에게 즉시 인지 가능한 형태로 옮기되, 본 절의 영어 POB가 가진 직접성은 본문 해설에서 보완합니다.
- source_word: וַיְחַזֵּק
  english_pob_choice: hardened
  chosen_korean: 굳게 하시니
  alternatives_korean:
  - 강하게 하시니
  - 굳게 만드시니
  lexicon: HALOT
  rationale: חזק의 기본 뜻인 ‘강하게 하다/굳게 하다’를 살리면서, 출애굽기의 관용적 문맥에서 바로의 완고함을 과도하게 풀이하지 않도록 ‘굳게 하다’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손
  lexicon: HALOT
  rationale: 히브리어 표현을 비교적 직접적으로 보존하면서도 한국어에서 자연스럽게 읽히는 복수 표현으로 옮겼습니다.
- source_word: בְּיָד רָמָה
  english_pob_choice: with a raised hand
  chosen_korean: 높이 든 손으로
  alternatives_korean:
  - 들린 손으로
  - 당당하게
  - 의기양양하게
  lexicon: HALOT
  rationale: 관용구를 본문에서 이미지적으로 유지하기 위해 문자적 요소를 살렸고, 해석적 부연인 ‘당당하게/의기양양하게’는 본문이 직접 요구하는 수준을 넘어선다고 보았습니다.
theological_decisions:
- issue: 여호와의 주도적 행위와 바로의 책임을 함께 보존하는가
  chosen_reading: 여호와께서 바로의 마음을 굳게 하시니, 그가 이스라엘의 자손들을 뒤쫓았습니다.
  alternative_readings:
  - 여호와께서 바로의 마음을 강하게 하시니
  - 바로가 스스로 완고해졌습니다
  rationale: 본문은 여호와의 직접적 작용과 바로의 추격 책임을 동시에 말하므로, 어느 한쪽으로 완화하거나 심리화하지 않고 그대로 유지했습니다.
  doctrine_reference: 하나님의 주권과 인간의 책임을 함께 드러내는 출애굽기의 서술
