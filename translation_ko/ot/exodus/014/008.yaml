  to: 여호와께서 이집트 왕 바로의 마음을 완고하게 하셨습니다[a]. 그는 이스라엘 자손을 뒤쫓았습니다. 이스라엘 자손은 손을 높이 들고 나아가고 있었습니다[b].
  rationale: 각주 표지를 해당 어구에 배치하여 구조적 모호성을 없앴습니다. 바로의 마음을 ‘완고하게 하셨습니다’로 옮겨 חזק의 출애굽기 문맥상 의미를 자연스럽게 전달하되, ‘강하게 하셨습니다’라는 어휘적 대안은 각주에 보존했습니다. 삽입구를 ‘이집트 왕 바로’로 정리하고, בְּיָד רָמָה의 구체적 이미지는 ‘손을 높이 들고’로 유지했습니다. 본문이 말하는 여호와의 직접적 행위와 바로의 추격을 완화하거나 신학적으로 해소하지 않았습니다.
