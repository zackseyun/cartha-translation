  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
  footnotes:
  - marker: a
    text: Or 'strengthened the heart of Pharaoh.' The Hebrew verb literally means 'made strong/firm,' though in Exodus this expression commonly carries the sense 'hardened.'
    reason: lexical_alternative
  - marker: b
    text: Or 'boldly' or 'with uplifted hand.' The Hebrew idiom is literally 'with a raised hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 이집트 왕 바로의 마음을 완고하게 하셨습니다[a]. 그는 이스라엘 자손을 뒤쫓았습니다. 이스라엘 자손은 손을 높이 들고 나아가고 있었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로의 마음을 강하게 하셨습니다.’ 히브리어 동사는 문자적으로 ‘강하게 하다, 굳게 하다’를 뜻하지만, 출애굽기에서 바로의 마음과 함께 쓰일 때에는 일반적으로 ‘완고하게 하다’라는 의미를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당당하게.’ 히브리어 관용구는 문자적으로 ‘높이 든 손으로’입니다.
    reason: lexical_alternative
