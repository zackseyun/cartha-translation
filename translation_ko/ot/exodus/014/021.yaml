  - 주님
  rationale: 본문은 신명기적 관습적 대체어가 아니라 하나님의 고유명 יְהוָה를 직접 사용하므로, POB 기준에 따라 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
