base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
  footnotes:
  - marker: a
    text: Or 'the LORD caused the sea to go back'; the Hebrew verb is causative and can be rendered more literally, but 'drove the sea back' best conveys the sense in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'by a mighty east wind.'
    reason: lexical_alternative
  - marker: c
    text: Or 'made the sea into dry ground' or 'turned the sea into dry ground.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the waters were divided.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 손을 바다 위로 내밀자, 야훼께서 밤새도록 강한 동풍으로 바다를 물러가게 하셔서 바다를 마른 땅이 되게 하셨고, 물들이 갈라졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘바다 위로’는 손짓의 방향을 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֵּט מֹשֶׁה אֶת יָדוֹ
  english_pob_choice: Then Moses stretched out his hand
  chosen_korean: 모세가 손을 바다 위로 내밀자
  alternatives_korean:
  - 모세가 손을 뻗자
  - 모세가 손을 펴자
  lexicon: HALOT
  rationale: נטה with ‘hand’는 단순한 방향 표시보다 실제로 손을 뻗어 내미는 동작을 가리키므로, 자연스러운 현대 한국어로 ‘내밀자’가 적절합니다.
- source_word: עַל הַיָּם
  english_pob_choice: over the sea
  chosen_korean: 바다 위로
  alternatives_korean:
  - 바다에
  - 바다를 향해
  lexicon: HALOT
  rationale: עַל은 여기서 위/위로의 공간 관계를 나타내며, 손짓 장면에서는 ‘바다 위로’가 원문의 장면성과 방향성을 잘 살립니다.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת הַיָּם
  english_pob_choice: Yahweh drove the sea back
  chosen_korean: 야훼께서 … 바다를 물러가게 하셔서
  alternatives_korean:
  - 야훼께서 바다를 뒤로 밀어내셔서
  - 야훼께서 바다가 물러가게 하셔서
  lexicon: HALOT
  rationale: הוליך(히필)는 원인적 의미를 가져 단순 이동이 아니라 ‘물러가게 하다’가 적합하며, ‘drove back’의 힘 있는 효과를 한국어로 자연스럽게 옮겼습니다.
- source_word: בְּרוּחַ קָדִים עַזָּה
  english_pob_choice: by a strong east wind
  chosen_korean: 강한 동풍으로
  alternatives_korean:
  - 거센 동풍으로
  - 맹렬한 동풍으로
  lexicon: HALOT
  rationale: רוּחַ는 כאן ‘영’이 아니라 기상 현상인 바람이며, קָדִים은 동풍, עַזָּה는 강한/거센의 의미이므로 간결하게 ‘강한 동풍’으로 옮겼습니다.
- source_word: וַיָּשֶׂם אֶת הַיָּם לֶחָרָבָה
  english_pob_choice: made the sea dry land
  chosen_korean: 바다를 마른 땅이 되게 하셨고
  alternatives_korean:
  - 바다를 마른 땅으로 만드셨고
  - 바다를 마른 땅으로 바꾸셨고
  lexicon: HALOT
  rationale: חָרָבָה는 ‘마른 땅/마른 땅 상태’를 뜻하므로, 원문의 결과 상태를 살린 ‘되게 하셨고’가 가장 자연스럽습니다.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  english_pob_choice: the waters were split
  chosen_korean: 물들이 갈라졌습니다
  alternatives_korean:
  - 물들이 나뉘었습니다
  - 물들이 쪼개졌습니다
  lexicon: HALOT
  rationale: בקע의 핵심은 물이 둘로 ‘갈라짐’이므로, 간명하고 시각적인 ‘갈라졌습니다’가 적절합니다.
theological_decisions:
