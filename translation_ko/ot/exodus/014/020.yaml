reference: Exodus 14:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
  footnotes:
  - marker: a
    text: Or, 'and there was the cloud and darkness, but it gave light by night.' The Hebrew is terse, and ancient versions and translations differ on how the darkness and light relate to the two camps.
    reason: alternative_reading
translation:
  language: ko
  text: 그것이 이집트 진영과 이스라엘 진영 사이에 이르렀습니다. 그곳에는 구름과 어둠이 있었지만 밤에는 빛이 되었고, 이쪽도 저쪽도 온 밤 동안 서로 가까이 가지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그 구름과 어둠이 밤에 빛을 주었습니다' 또는 '그 구름이 어둠을 일으켰지만 밤을 비추었습니다'가 될 수 있습니다. 히브리어는 매우 압축적이어서, 어둠과 빛의 관계를 어떻게 연결할지 고대 역본과 번역본들 사이에도 차이가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין ... וּבֵין
  english_pob_choice: between ... and ...
  chosen_korean: '... 사이에'
  alternatives_korean:
  - '... 사이'
  - '... 가운데'
  lexicon: HALOT
  rationale: 두 진영 사이의 공간 관계를 자연스럽게 살리면서도 원문의 중립적인 위치 관계를 유지합니다.
- source_word: מַחֲנֵה
  english_pob_choice: camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 부대
  lexicon: HALOT
  rationale: 군사적·행군적 맥락에서 '진영'이 한국어로 가장 자연스럽고, 사람들과 그들이 둘러선 자리 모두를 포괄할 수 있습니다.
- source_word: הֶעָנָן וְהַחֹשֶׁךְ
  english_pob_choice: the cloud and the darkness
  chosen_korean: 구름과 어둠
  alternatives_korean:
  - 그 구름과 그 어둠
  - 구름과 흑암
  lexicon: HALOT
  rationale: 히브리어의 정관사는 문맥상 이미 알려진 구름을 가리키므로 굳이 '그'를 반복하지 않았고, '어둠'으로 직역해 대비를 분명히 했습니다.
- source_word: וַיָּאֶר
  english_pob_choice: yet it lit up
  chosen_korean: 밤에는 빛이 되었고
  alternatives_korean:
  - 밤을 비추었고
  - 그러나 빛을 주었고
  lexicon: HALOT
  rationale: 직역형 '비추다'도 가능하지만, 앞의 어둠과 병치된 상태를 살려 '빛이 되다'로 옮기면 본문의 역설적 효과를 더 분명히 전달할 수 있습니다.
- source_word: זֶה אֶל זֶה
  english_pob_choice: the one ... the other
  chosen_korean: 이쪽도 저쪽도
  alternatives_korean:
  - 서로
  - 이쪽과 저쪽
  lexicon: HALOT
  rationale: 두 진영의 상호 접근 금지를 한국어로 간결하게 표현하면서, 단순한 재귀적 '서로'보다 양쪽의 대칭성을 드러냅니다.
theological_decisions:
- issue: 20절의 주어적 이동과 조명 행위의 지시 대상
  chosen_reading: 주어를 '그것'으로 처리해 구름 기둥/하나님의 임재의 이동을 특정 인격체로 고정하지 않았습니다.
  alternative_readings:
  - '''그가''로 옮겨 하나님의 사자에 연결할 수 있음'
  - '''구름기둥이''를 본문에 명시할 수 있음'
  rationale: 히브리어 단수 동사는 앞선 문맥의 하나님의 사자와 구름기둥 둘 다를 열어 두므로, 번역도 그 모호성을 보존하는 편이 본문의 긴장을 살립니다.
  doctrine_reference: Translation philosophy §3
- issue: 구름과 어둠 속의 빛의 관계
  chosen_reading: '''밤에는 빛이 되었고''로 옮겨 어둠과 조명의 동시성을 유지했습니다.'
  alternative_readings:
  - '''그러나 밤에 빛을 주었습니다'''
  - '''밤을 비추었습니다'''
  rationale: 히브리어는 구름·어둠과 빛의 관계를 간결하게 병치하므로, 어느 한쪽으로 설명을 과잉해석하지 않고 본문이 허용하는 역설을 보존합니다.
  doctrine_reference: Translation philosophy §3
