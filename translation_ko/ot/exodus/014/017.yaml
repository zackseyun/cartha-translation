translation:
  language: ko
  text: 내가—보십시오, 내가 이집트 사람들의 마음[b]을 굳게 하여, 그들이 그들을 뒤따라 들어가게 하겠으며, 바로와 그의 온 군대와 그의 병거들과 그의 기병들 위에서 영광을 얻겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영광을 받겠습니다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이집트 사람들의 마음’을 단수로 말하며, 여기서는 집합적으로 사용되었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: behold, I
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 참으로 내가
  - 내가 바로
  lexicon: HALOT
  rationale: 강조된 자기 지시를 살리되 한국어에서 자연스럽게 들리도록 대화체 명령이 아닌 정중한 주의 환기로 옮겼습니다.
- source_word: מְחַזֵּק
  english_pob_choice: am hardening
  chosen_korean: 굳게 하여
  alternatives_korean:
  - 굳게 만들며
  - 강하게 하여
  lexicon: HALOT
  rationale: 출애굽기에서의 사법적 ‘마음 굳어짐’ 문맥을 살려 단순한 ‘강화’보다 ‘굳게 하다’로 옮겼습니다.
- source_word: לֵב מִצְרַיִם
  english_pob_choice: the heart of the Egyptians
  chosen_korean: 이집트 사람들의 마음
  alternatives_korean:
