  text: וַ/אֲנִ֗י הִנְ/נִ֤י מְחַזֵּק֙ אֶת לֵ֣ב מִצְרַ֔יִם וְ/יָבֹ֖אוּ אַחֲרֵי/הֶ֑ם וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
  footnotes:
  - marker: a
    text: Or, 'I will be glorified over Pharaoh and over all his army.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the heart of the Egyptians,' with singular 'heart' used collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가—보십시오, 내가 이집트 사람들의 마음을 굳게 하여 그들이 그들 뒤를 따라 들어가게 하겠으며, 내가 바로바로와 그의 온 군대, 그의 병거들과 그의 기병들 위에서 영광을 얻겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 히브리어 הִנְנִי의 강조를 한국어로 드러내기 위한 주의 환기 표현입니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어는 ‘이집트 사람들의 마음’을 단수로 말하지만, 집합적 의미이므로 한국어에서는 복수로 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: behold, I
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 참으로 내가
  - 내가 바로
  lexicon: HALOT
  rationale: 강조된 자기 지시를 살리되 한국어에서 자연스럽게 들리도록 대화체 명령이 아닌 정중한 주의 환기로 옮겼습니다.
- source_word: מְחַזֵּק
  english_pob_choice: am hardening
  chosen_korean: 굳게 하여
  alternatives_korean:
  - 굳게 만들며
  - 강하게 하여
  lexicon: HALOT
  rationale: 출애굽기에서의 사법적 ‘마음 굳어짐’ 문맥을 살려 단순한 ‘강화’보다 ‘굳게 하다’로 옮겼습니다.
- source_word: לֵב מִצְרַיִם
  english_pob_choice: the heart of the Egyptians
  chosen_korean: 이집트 사람들의 마음
  alternatives_korean:
  - 이집트의 마음
  - 이집트 사람들의 심장
  lexicon: HALOT
  rationale: 히브리어 단수 ‘마음’의 집합적 용법을 한국어에서는 자연스러운 복수 주어로 풀어 주되, 의미 핵심인 ‘마음’은 유지했습니다.
- source_word: וְאִכָּבְדָה
  english_pob_choice: I will get glory
  chosen_korean: 영광을 얻겠습니다
  alternatives_korean:
  - 영광을 받겠습니다
  - 영광을 받게 되겠습니다
  lexicon: HALOT
  rationale: 하나님의 이름이 드러나는 결과를 현대 한국어로 자연스럽게 표현하되, 수동적 해석으로만 좁히지 않도록 ‘얻다’를 택했습니다.
theological_decisions:
- issue: 하나님의 직접적 행위와 인간 책임의 긴장
  chosen_reading: 하나님이 직접 이집트 사람들의 마음을 굳게 하신다고 분명히 옮겼습니다.
  alternative_readings:
  - 하나님이 그들의 마음을 허락하셔서 굳어지게 하신다
  - 그들이 스스로 굳어지도록 두신다
  rationale: 본문은 행위의 주체를 하나님으로 직접 제시하므로, 이를 완화하거나 허용으로 바꾸지 않고 긴장을 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
- issue: כבד의 의미
  chosen_reading: ‘영광을 얻겠습니다’로 옮겨 심판을 통해 드러나는 하나님의 영예를 표현했습니다.
  alternative_readings:
  - 영광을 받겠습니다
  - 영광스럽게 되겠습니다
  rationale: 문맥상 바로와 그의 군대 위에서 드러나는 하나님의 승리와 영예를 현대적인 동사로 살리기 위해 선택했습니다.
  doctrine_reference: Translation philosophy §6 (Readable modern English, not archaic or academic)
