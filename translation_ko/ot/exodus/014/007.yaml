  source_fidelity: 핵심 요소인 ‘육백’, 선발된 병거, 이집트의 모든 병거, 그리고 שָׁלִשִׁים의 군사 직책은 모두 반영되어 있습니다. 그러나 וַיִּקַּח의 목적어인 병거들에 ‘데리고 갔습니다’를 쓰면 한국어에서 병거를 사람처럼 동반하는 듯하여 부자연스럽고, ‘그 모든 것 위에 있는 지휘관들’은 עַל כֻּלּוֹ의 통솔·배치 관계를 지나치게 직역하여 의미가 불명료합니다.
  naturalness: ‘선택된 병거 육백 대’보다 ‘선발된 병거 육백 대’가 군사 문맥에서 더 자연스럽습니다. 또한 지휘관들이 모든 병거를 맡거나 그 위에 배치되었다는 관계는 ‘그 모든 병거를 맡은 지휘관들’로 표현하는 것이 현대 표준어에서 명확합니다.
