base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/007.yaml
  text: And he took six hundred choice chariots[a], and all the chariots of Egypt, with officers over all of them.
  footnotes:
  - marker: a
    text: Or 'with chariot officers over all of them'; the Hebrew term can denote elite military aides or captains associated with chariots.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 선택된 병거 육백 대와, 이집트의 모든 병거와, 그 모든 것 위에 있는 지휘관들을 데리고 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘병거 지휘관들과 함께’로 옮길 수 있습니다. 히브리어 용어는 병거와 관련된 정예 보좌 인원이나 지휘관을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: And he took
  chosen_korean: 데리고 갔습니다
  alternatives_korean:
  - 가졌습니다
  - 취했습니다
  - 데려갔습니다
  lexicon: HALOT
  rationale: 전쟁 행위를 행하는 주체가 병거들을 ‘취하다’보다 한국어 서술에서 자연스러운 동작인 ‘데리고 갔습니다’로 옮기되, 이어지는 전개성을 유지했습니다.
- source_word: רֶכֶב בָּחוּר
  english_pob_choice: six hundred choice chariots
  chosen_korean: 선택된 병거 육백 대
  alternatives_korean:
  - 정예 병거 육백 대
  - 선발된 병거 육백 대
  - 좋은 병거 육백 대
  lexicon: HALOT
  rationale: בָּחוּר의 선별·정예 뉘앙스를 살려 ‘선택된’으로 옮겼고, רֶכֶב은 수량이 붙은 군사 장비로서 ‘병거 대’가 가장 직접적입니다.
- source_word: וְכֹל רֶכֶב מִצְרָיִם
  english_pob_choice: and all the chariots of Egypt
  chosen_korean: 이집트의 모든 병거
  alternatives_korean:
  - 이집트의 모든 병거들
  - 이집트의 병거 전체
  - 이집트의 모든 전차
  lexicon: HALOT
  rationale: ‘all the chariots of Egypt’의 집합적 의미를 살려 ‘이집트의 모든 병거’로 간명하게 옮겼습니다.
- source_word: וְשָׁלִשִׁם עַל כֻּלּוֹ
  english_pob_choice: with officers over all of them
  chosen_korean: 그 모든 것 위에 있는 지휘관들
  alternatives_korean:
  - 병거 지휘관들과 함께
  - 모든 병거 위의 장교들
  - 그 위에 배치된 장교들
  lexicon: HALOT
  rationale: שָׁלִשִׁים의 의미 범위가 ‘지휘관/참모/호위 장교’로 넓어, 직역적이되 기능을 드러내는 ‘지휘관들’을 택했습니다. עַל כֻּלּוֹ는 이집트 병거 군세 전체에 대한 배치를 나타내므로 ‘그 모든 것 위에 있는’으로 반영했습니다.
theological_decisions:
- issue: 군사 용어의 번역 범위
  chosen_reading: שָׁלִשִׁים을 특정 계급명으로 과도하게 한정하지 않고 ‘지휘관들’로 번역했습니다.
  alternative_readings:
  - 병거 장교들
  - 호위 장교들
  - 참모들
  rationale: 본문은 정확한 직함보다 병거 전력 전체에 대한 배치 기능을 강조하므로, 한국어에서도 기능 중심의 중립적 표현이 원문 긴장을 가장 잘 보존합니다.
  doctrine_reference: 본문의 역사 서술을 최대한 직접적으로 반영하는 번역 원칙
