  - 바다를 향해
  lexicon: WLC
  rationale: עַל의 공간적 의미를 살려 ‘위로’로 옮겨, 손을 바다 위에 내미는 장면을 분명하게 드러냈습니다.
- source_word: וְיָשֻׁבוּ הַמַּיִם
  english_pob_choice: so that the waters may return
  chosen_korean: 그러면 물이 … 되돌아갈 것이다
  alternatives_korean:
  - 그래서 물이 … 돌아올 것이다
  - 물이 … 돌아가게 될 것이다
  lexicon: WLC
  rationale: 히브리어의 결과/의도 뉘앙스를 한국어에서도 미래 결과로 자연스럽게 표현하되, 원문의 ‘돌아가다/되돌아가다’ 의미를 유지했습니다.
- source_word: עַל מִצְרַיִם עַל רִכְבּוֹ וְעַל פָּרָשָׁיו
  english_pob_choice: over the Egyptians, over their chariots, and over their horsemen
  chosen_korean: 이집트 사람들, 그들의 병거들, 그리고 그들의 기병들 위로
  alternatives_korean:
  - 이집트인들, 그들의 전차들, 그리고 그들의 말탄 자들 위로
  - 이집트 위에, 그들의 병거와 기병 위에
  lexicon: WLC
  rationale: 집합명사 מִצְרַיִם는 문맥상 이집트 사람들을 가리키므로 ‘이집트 사람들’로 옮기고, רֶכֶב/פָּרָשִׁים는 각각 ‘병거들’, ‘기병들’로 직접 대응시켰습니다.
theological_decisions:
- issue: 야훼의 명령과 결과절의 뉘앙스
  chosen_reading: 명령문 뒤의 결과는 ‘그러면 … 되돌아갈 것이다’로 옮겨, 모세의 행위에 뒤따르는 실제 결과를 분명히 했습니다.
  alternative_readings:
  - ‘그리고 물이 되돌아올 것이다’
  - ‘물이 되돌아가게 될 것이다’
  rationale: 히브리어 접속된 미완료형은 단순한 순차적 미래보다 의도된 결과를 가리키는 뉘앙스가 강하므로, 한국어에서도 인과를 드러내는 표현이 더 적절합니다.
  doctrine_reference: 서술의 인과 관계를 보존하는 번역 원칙
