  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the hand of Egypt,'' an idiom for deliverance from Egypt''s power.'
    reason: cultural_note
  - marker: b
    text: Or 'on the shore of the sea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 야훼께서 이스라엘을 이집트의 손에서 구원하셨습니다[a]. 이스라엘은 이집트 사람들이 바닷가에 죽어 있는 것을 보았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 '이집트의 손에서'이며 이집트의 권세와 통제에서 벗어난다는 뜻입니다.
    reason: source_note
  - marker: b
    text: 또는 '바닷가에서'.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  english_pob_choice: saved
  chosen_korean: 구원하셨습니다
  alternatives_korean:
  - 구해 주셨습니다
  - 건져 주셨습니다
  - 구해내셨습니다
  lexicon: HALOT
  rationale: 하나님의 주도적 구출 행위를 드러내기 위해 '구원하다'를 택했습니다. 단순한 구조보다 구원 사건의 신학적 무게를 더 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 제목화하지 않고 음역하여, 전통적 대체 호칭이 아니라 언약 이름 자체를 드러냅니다.
- source_word: מִיַּד מִצְרַיִם
  english_pob_choice: from the hand of Egypt
  chosen_korean: 이집트의 손에서
  alternatives_korean:
  - 이집트의 권세에서
  - 이집트의 힘에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 '손' 이미지를 유지해, 이집트의 지배와 통제에서 벗어났다는 의미를 드러냈습니다.
- source_word: עַל שְׂפַת הַיָּם
  english_pob_choice: on the seashore
  chosen_korean: 바닷가에
  alternatives_korean:
  - 바다의 기슭에
  - 바닷가에서
  lexicon: HALOT
  rationale: '''바다의 가장자리/해변''이라는 공간 관계를 자연스러운 현대 한국어로 옮겼습니다. 한국어에서는 처소 조사 ''에''가 더 자연스럽습니다.'
theological_decisions:
- issue: 야훼의 이름을 어떻게 옮길지
  chosen_reading: 고유명사 '야훼'를 본문에 유지했습니다.
  alternative_readings:
  - 전통적으로 '주님'으로 완곡 번역
  - '''여호와'' 사용'
  rationale: 본문은 여호와 대체어가 아니라 신적 고유명을 직접 사용합니다. POB의 원칙에 따라 언약의 이름을 보존하는 것이 독자가 본문의 강조를 이해하는 데 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
