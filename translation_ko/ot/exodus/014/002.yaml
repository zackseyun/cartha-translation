  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Pi-hahiroth, Migdol, and Baal-zephon are place names and are therefore transliterated rather than translated.
    reason: cultural_note
  - marker: c
    text: Or 'facing it.' The pronoun in 'opposite it' most likely refers to Baal-zephon.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손[a]에게 말하여, 그들이 되돌아가 피하히롯[b] 앞, 믹돌과 바다 사이에 진을 치라고 하십시오. 바알스본[b] 앞, 곧 그 맞은편[c] 바닷가에 진을 치라고 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 문자적 표현입니다. ‘이스라엘 사람들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 피하히롯, 믹돌, 바알스본은 모두 지명이라 음역했습니다.
    reason: cultural_note
  - marker: c
    text: ‘그 맞은편’은 ‘그것의 맞은편에’ 또는 ‘그것을 마주하여’라는 뜻입니다. 히브리어 대명사 접미사는 문맥상 바알스본을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 친족적 표현을 살리면서도 한국어에서 자연스럽고 성경적 어감이 있는 ‘이스라엘 자손’을 택했습니다.
- source_word: וְ/יָשֻׁבוּ
  english_pob_choice: that they turn back
  chosen_korean: 그들이 되돌아가서
  alternatives_korean:
  - 그들이 돌아가서
  - 되돌아서
  lexicon: HALOT
  rationale: 명령에 종속된 방향 전환을 드러내기 위해 ‘되돌아가다’를 선택했고, 단순 이동보다 반대 방향으로의 회귀를 분명히 했습니다.
- source_word: פִּי הַחִירֹת
  english_pob_choice: Pi-hahiroth
  chosen_korean: 피하히롯
  alternatives_korean:
  - 피-하히롯
  - 파히롯
  lexicon: HALOT
  rationale: 지명은 음역 처리하는 원칙에 따라 음역했습니다. 하이픈은 한국어 표기에서는 생략해 읽기 자연성을 우선했습니다.
- source_word: מִגְדֹּל
  english_pob_choice: Migdol
  chosen_korean: 믹돌
  alternatives_korean:
  - 미그돌
  - 마그돌
  lexicon: HALOT
  rationale: 고유지명 음역을 따르되 현대 한국어 표기에서 발음에 가까운 ‘믹돌’을 사용했습니다.
- source_word: בַּעַל צְפֹן
  english_pob_choice: Baal-zephon
  chosen_korean: 바알스본
  alternatives_korean:
  - 바알-스본
  - 바알 제폰
  lexicon: HALOT
  rationale: 고유지명은 음역을 유지했습니다. 영어 POB의 지명 처리 원칙을 따라 번역하지 않고 표기만 옮겼습니다.
- source_word: נִכְחוֹ
  english_pob_choice: opposite it
  chosen_korean: 맞은편
  alternatives_korean:
  - 마주한
  - 정면으로 향한
  lexicon: HALOT
  rationale: 대상과의 상대적 위치를 간결하게 드러내는 한국어로 ‘맞은편’을 택했습니다. 지시대명사 ‘it’에 해당하는 대상은 문맥상 바알스본입니다.
theological_decisions:
- issue: 지명 표기와 본문의 공간 지시를 어떻게 살릴지
  chosen_reading: 세 곳의 지명을 음역으로 유지하고, 위치 관계는 ‘앞/사이/맞은편/바닷가’로 직접 표현했습니다.
  alternative_readings:
  - 지명을 뜻풀이해 번역하기
  - '전통 교회식 표기(예: 여호와식 음역)로 정리하기'
  rationale: 본문은 이동 경로와 배치 지시가 핵심이므로, 지명 해석보다 공간 관계를 선명하게 드러내는 것이 본문 의미를 더 잘 보존합니다.
  doctrine_reference: 본문의 서술 의도와 지리적 맥락 보존
- issue: 히브리어 명령 연쇄의 강도
  chosen_reading: ‘말하여 … 진을 치게 하십시오’로 한국어 명령문 흐름을 유지했습니다.
  alternative_readings:
  - ‘말하라’ 같은 직설형
  - 완화된 서술형
  rationale: 모세에게 주어진 직접 명령의 힘을 살리기 위해 현대 공손 명령형을 사용했습니다. 합쇼체 안에서도 명령의 긴박함을 유지할 수 있습니다.
  doctrine_reference: 본문의 명령적 화행 보존
