  verdict: revise
  source_fidelity: 초안은 ‘되돌아가다’, 피하히롯 앞, 믹돌과 바다 사이, 바닷가라는 주요 요소를 대체로 보존합니다. 그러나 히브리어의 두 번째 위치 지정인 ‘바알스본 앞, 그것의 맞은편’(לִפְנֵי בַּעַל צְפֹן נִכְחוֹ)을 ‘바알스본 맞은편’으로 압축하여 ‘앞’과 대명사 목적어의 관계가 충분히 드러나지 않습니다. 또한 모세에게 내리는 명령과 이스라엘 자손에게 전달될 명령을 ‘…진을 치게 하십시오’로 한 문장에 결합하면 공간 지시의 두 단위가 불분명해집니다.
