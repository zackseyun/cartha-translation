  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
  footnotes:
  - marker: a
    text: Or, “when I am glorified through Pharaoh, through his chariots, and through his horsemen.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “the LORD” represents the divine name YHWH, traditionally rendered this way in English translations.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이집트 사람들이 내가 야훼임을 알게 될 것입니다 — 내가 바로에서, 그의 병거에서, 그리고 그의 기병들에서 내 영광을 얻을 때에 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 바로, 그의 병거들, 그리고 그의 기병들을 통해 영광을 받을 때에.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדְעוּ מִצְרַיִם
  english_pob_choice: And the Egyptians will know
  chosen_korean: 그리고 이집트 사람들이 … 알게 될 것입니다
  alternatives_korean:
  - 그러면 이집트 사람들이 … 알게 될 것입니다
  - 이집트 사람들이 … 알게 될 것입니다
  lexicon: WLC / HALOT
  rationale: 주어는 지역이 아니라 사람들을 가리키므로 ‘이집트’보다 ‘이집트 사람들’이 더 직접적이며, 결과를 나타내는 העתיד적 문맥을 살려 ‘알게 될 것입니다’로 옮겼습니다.
- source_word: כִּי אֲנִי יְהוָה
  english_pob_choice: that I am Yahweh
  chosen_korean: 내가 야훼임을
  alternatives_korean:
  - 내가 주님임을
  - 내가 야훼라는 것을
  lexicon: WLC / HALOT
  rationale: יהוה는 POB의 원칙에 따라 고유명 ‘야훼’로 옮기고, 인식 공식의 핵심인 ‘내가 …임을’ 구조를 유지했습니다.
- source_word: בְּהִכָּבְדִי
  english_pob_choice: when I gain glory
  chosen_korean: 내 영광을 얻을 때에
  alternatives_korean:
  - 내가 영광을 받을 때에
  - 내가 영광스럽게 될 때에
  - 내가 영광을 나타낼 때에
  lexicon: WLC / HALOT
  rationale: 동사 כבד의 수동/반사적 뉘앙스는 ‘영광을 받다/얻다’로 자연스럽게 드러나며, 사건을 통해 야훼의 영광이 드러난다는 의미를 보존합니다.
- source_word: בְּפַרְעֹה בְּרִכְבּוֹ וּבְפָרָשָׁיו
  english_pob_choice: through Pharaoh, through his chariots, and through his horsemen
  chosen_korean: 바로에서, 그의 병거에서, 그리고 그의 기병들에서
  alternatives_korean:
  - 바로를 통해, 그의 병거를 통해, 그리고 그의 기병들을 통해
  - 바로 위에, 그의 병거 위에, 그리고 그의 기병들 위에
  lexicon: WLC / HALOT
  rationale: 반복되는 בְ는 수단/매개를 나타내므로 한국어에서는 ‘~에서’로 옮겨 사건의 무대를 유지했습니다. ‘병거’는 군사적 맥락을 살리는 표준 번역이고, פָרָשִׁים는 ‘기병들’이 가장 직접적입니다.
theological_decisions:
- issue: 야훼의 이름을 고유명으로 옮길지, 관용적 대체어로 바꿀지
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 출애굽 사건 속에서 하나님의 자기 계시를 가리키는 직접적인 신명 사용이므로, 제목형 대체어보다 고유명 ‘야훼’가 원문 기능을 더 잘 드러냅니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH'
- issue: בְּ + 영광 언급의 의미를 ‘받다’와 ‘보이다’ 중 어떻게 표현할지
  chosen_reading: ‘내 영광을 얻을 때에’로 옮겨, 사건을 통해 야훼의 영광이 드러난다는 의미를 살렸습니다.
  alternative_readings:
  - 내가 영광을 받을 때에
  - 내가 영광스럽게 될 때에
  - 내가 내 영광을 나타낼 때에
  rationale: 히브리어는 바로와 그의 군대의 패배를 통해 야훼가 영화롭게 되는 장면을 말하므로, 수동적 결과와 드러남을 함께 담는 표현이 필요합니다.
  doctrine_reference: WLC כבד 구문 / 출애굽기 내 신적 자기현시 모티프
