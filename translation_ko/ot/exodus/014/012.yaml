  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹא זֶ֣ה הַ/דָּבָ֗ר אֲשֶׁר֩ דִּבַּ֨רְנוּ אֵלֶ֤י/ךָ בְ/מִצְרַ֨יִם֙ לֵ/אמֹ֔ר חֲדַ֥ל מִמֶּ֖/נּוּ וְ/נַֽעַבְדָ֣ה אֶת מִצְרָ֑יִם כִּ֣י ט֥וֹב לָ֨/נוּ֙ עֲבֹ֣ד אֶת מִצְרַ֔יִם מִ/מֻּתֵ֖/נוּ בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: ko
  text: 이것이 우리가 이집트에서 당신에게 말한 바로 그 말이 아닙니까? ‘우리를 내버려 두어 우리가 이집트 사람들을 섬기게 하십시오.’ 이집트 사람들을 섬기는 것이 광야에서 죽는 것보다 우리에게는 더 낫겠습니다.
  philosophy: formal
lexical_decisions:
- source_word: הַדָּבָר / the word
  english_pob_choice: the word
  chosen_korean: 말
  alternatives_korean:
  - 말씀
  - 일
  lexicon: דָּבָר
  rationale: 여기서는 신적 말씀이나 공식 선언이 아니라, “우리가 … 말한” 내용 자체를 가리키므로 자연스러운 현대어인 ‘말’이 적합합니다.
- source_word: חֲדַל מִמֶּנּוּ
  english_pob_choice: Leave us alone
  chosen_korean: 우리를 내버려 두십시오
  alternatives_korean:
  - 우리를 떠나 두십시오
  - 우리에게서 물러나십시오
  lexicon: חדל
  rationale: 명령의 핵심은 간섭을 멈추라는 뜻이므로 관용적인 ‘내버려 두다’로 옮기되, 문맥상 청유/명령의 직접성을 살렸습니다.
- source_word: וְנַעַבְדָה אֶת מִצְרָיִם
  english_pob_choice: so that we may serve the Egyptians
  chosen_korean: 우리가 이집트 사람들을 섬기게 하십시오
  alternatives_korean:
  - 우리가 이집트 사람들을 섬기도록 하십시오
  - 이집트 사람들을 섬기게 하십시오
  lexicon: עבד
  rationale: EN POB의 의도를 따라 단순 병렬 ‘그리고’보다 목적/결과를 드러내는 표현으로 옮겼고, 원문의 ‘섬기다’는 종속적 노동 관계를 충분히 반영합니다.
- source_word: טוֹב לָנוּ ... מִמֻּתֵנוּ
  english_pob_choice: it would have been better for us ... than to die
  chosen_korean: …하는 것이 …보다 우리에게는 더 낫겠습니다
  alternatives_korean:
  - …하는 편이 …보다 낫겠습니다
  - …하는 것이 …보다 낫습니다
  lexicon: טוב
  rationale: 과거 상황을 평가하는 비교구문이므로 한국어에서도 ‘더 낫겠습니다’로 역동성을 살렸고, 원문의 비교 구조를 분명히 유지했습니다.
theological_decisions:
- issue: 이스라엘의 발화가 하나님께 대한 불평인지, 모세에게 한 말인지
  chosen_reading: 직접 화자는 백성이며, 모세에게 한 말로서 광야에서의 죽음보다 이집트의 종살이를 선호하는 절망을 드러냅니다.
  alternative_readings:
  - 하나님을 향한 원망으로 읽는 해석
  - 단순한 역사적 회상으로 약화시키는 해석
  rationale: 본문은 출애굽 직후의 실제 발화를 기록하며, 서술의 수사적 강도를 약화시키지 않도록 불평과 체념의 뉘앙스를 그대로 살렸습니다.
  doctrine_reference: 출애굽기 14장 문맥상의 불신과 원망
