  source_fidelity: 핵심 동작과 사건 순서는 히브리어 본문에 충실합니다. 다만 각주 표지가 설명 대상과 떨어져 있어, a는 לְאֵיתָנוֹ를 옮긴 ‘본래의 상태’ 뒤에, b는 וַיְנַעֵר를 옮긴 ‘내던지셨습니다’ 뒤에 두어야 합니다.
  naturalness: 현대 표준어 합쇼체로 대체로 자연스럽습니다. 접속을 ‘그 바다를 향해 도망하고 있었고’로 다듬으면 히브리어의 연속 서술을 더 직접적으로 반영하면서도 자연스럽습니다.
  terminology: ‘야훼’는 제시된 POB 방침과 일치합니다. ‘본래의 상태’는 אֵיתָנוֹ의 지속성·정상성·힘의 의미 범위를 과도하게 한정하지 않는 안전한 번역입니다. ‘내던지셨습니다’는 נער의 생생한 비유를 한국어에서 자연스럽게 전달합니다.
  issues:
