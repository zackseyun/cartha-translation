revisions:
- from: 모세가 손을 바다 위로 내밀자[a], 아침이 가까워질 무렵 바다는 본래의 상태로 돌아왔습니다. 이집트 사람들은 그 바다를 향해 도망하고 있었는데[b], 야훼께서 이집트 사람들을 바다 한가운데로 내던지셨습니다.
  to: 모세가 손을 바다 위로 내밀었습니다. 아침이 가까워질 무렵 바다는 본래의 상태로 돌아왔습니다[a]. 이집트 사람들은 그 바다를 향해 도망하고 있었고, 야훼께서 이집트 사람들을 바다 한가운데로 내던지셨습니다[b].
  rationale: 번역 의미는 유지하되, 두 각주 표지를 실제로 설명하는 히브리어 표현의 한국어 번역어 뒤로 각각 옮겼습니다. 또한 첫 절의 ‘내밀자’를 단순 서술형으로 바꾸고, 뒤 절의 접속을 조정하여 히브리어 서사 연쇄를 자연스럽고 직접적으로 나타냈습니다.
