  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּט֩ מֹשֶׁ֨ה אֶת יָד֜/וֹ עַל הַ/יָּ֗ם וַ/יָּ֨שָׁב הַ/יָּ֜ם לִ/פְנ֥וֹת בֹּ֨קֶר֙ לְ/אֵ֣יתָנ֔/וֹ וּ/מִצְרַ֖יִם נָסִ֣ים לִ/קְרָאת֑/וֹ וַ/יְנַעֵ֧ר יְהוָ֛ה אֶת מִצְרַ֖יִם בְּ/ת֥וֹךְ הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
  footnotes:
  - marker: a
    text: Or 'to its full force' or 'to its former state.' The Hebrew expression indicates that the sea resumed its enduring, normal condition.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb literally means 'shook off' or 'shook out,' a vivid image for the LORD's casting the Egyptians into the sea.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 손을 바다 위로 내밀었습니다. 아침이 가까워질 무렵 바다는 본래의 상태로 돌아왔습니다[a]. 이집트 사람들은 그 바다를 향해 도망하고 있었고, 야훼께서 이집트 사람들을 바다 한가운데로 내던지셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘본래의 힘으로’ 혹은 ‘본래의 자리로’. 히브리어 표현은 바다가 지속적이고 정상적인 상태로 되돌아왔음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 문자적으로는 ‘털어내다’, ‘흔들어 떨어뜨리다’라는 뜻으로, 야훼께서 이집트 사람들을 바다로 내던지시는 생생한 그림을 보여 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט מֹשֶׁה אֶת יָדוֹ
  english_pob_choice: Moses stretched out his hand
  chosen_korean: 모세가 손을 바다 위로 내밀자
  alternatives_korean:
  - 모세가 손을 뻗자
  - 모세가 손을 펼치자
  lexicon: HALOT
  rationale: נטה + 손은 ‘내밀다/뻗다’가 자연스럽고, 앞의 ‘바다 위로’가 동작의 방향을 분명히 드러냅니다.
- source_word: לִפְנוֹת בֹּקֶר לְאֵיתָנוֹ
  english_pob_choice: toward morning the sea returned to its usual place
  chosen_korean: 아침이 가까워질 무렵 바다는 본래의 상태로 돌아왔습니다
  alternatives_korean:
  - 동틀 무렵 바다는 원래 힘으로 돌아왔습니다
  - 아침 무렵 바다는 본래 자리로 돌아왔습니다
  lexicon: HALOT
  rationale: ‘לִפְנוֹת בֹּקֶר’은 ‘아침이 가까워질 무렵’으로, ‘לְאֵיתָנוֹ’는 해석을 과도하게 좁히지 않도록 ‘본래의 상태’로 옮겼습니다.
- source_word: נָסִים לִקְרָאתוֹ
  english_pob_choice: the Egyptians were fleeing toward it
  chosen_korean: 이집트 사람들은 그 바다를 향해 도망하고 있었는데
  alternatives_korean:
  - 이집트 사람들은 그것을 향해 달아나고 있었는데
  - 이집트 사람들은 그 바다를 맞으러 달아나고 있었는데
  lexicon: HALOT
  rationale: 분사형의 진행성을 살리면서, לקראת의 방향성을 ‘향해’로 담아 자연스럽게 표현했습니다.
- source_word: וַיְנַעֵר יְהוָה
  english_pob_choice: Yahweh threw the Egyptians
  chosen_korean: 야훼께서 이집트 사람들을 … 내던지셨습니다
  alternatives_korean:
  - 야훼께서 이집트 사람들을 … 흔들어 떨어뜨리셨습니다
  - 야훼께서 이집트 사람들을 … 털어내셨습니다
  lexicon: HALOT
  rationale: נער의 ‘털어내다/흔들어 떨어뜨리다’라는 이미지는 유지하되, 한국어에서는 심판적 동작을 분명히 하는 ‘내던지다’가 더 자연스럽습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명기적 이름을 제목 대체 없이 드러내는 것이 POB의 원칙에 맞으므로, 관습적 대체어 대신 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: 바다가 ‘본래의 상태/힘/자리’로 돌아감
  chosen_reading: 본래의 상태로 돌아왔습니다
  alternative_readings:
  - 본래의 힘으로 돌아왔습니다
  - 본래의 자리로 돌아왔습니다
  rationale: 히브리어 אֵיתָן은 상태·힘·지속성을 함께 담을 수 있어, 본문이 허용하는 범위를 넓게 보존하는 표현을 택했습니다.
  doctrine_reference: POB lexical audit for לְאֵיתָנוֹ
