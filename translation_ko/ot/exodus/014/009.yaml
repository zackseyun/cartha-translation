- from: 이집트 사람들이 그들을 쫓아갔고 그들이 바다 옆에 진을 치고 있을 때 그들을 붙잡았는데, 바로 바로 모든 말과 병거, 기병과 모든 군대가 히르호트 앞, 발사벳 앞이었다.
  to: 이집트 사람들이 그들을 뒤쫓아, 그들이 바닷가에 진을 치고 있을 때에 따라잡았습니다. 곧 파라오의 모든 말과 병거와 기병과 군대가 바알스본 맞은편 비하히롯 앞의 바닷가에 진을 치고 있는 그들을 따라잡았습니다.
  rationale: 'The revision restores the meaning of pursuit and overtaking, identifies Pharaoh and his complete military force, and recasts the locative phrase into clear Korean while retaining the source’s spatial relationship: by Pi-hahiroth and opposite/before Baal-zephon.'
