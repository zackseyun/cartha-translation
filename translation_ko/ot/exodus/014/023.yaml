base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
  footnotes:
  - marker: a
    text: Hebrew 'all Pharaoh’s horse, his chariotry, and his horsemen' uses a collective singular for 'horse'; the translation renders the sense in natural English as 'Pharaoh’s horses.'
    reason: lexical_alternative
  - marker: b
    text: Or 'entered after them into the middle of the sea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트 사람들이 그들을 뒤쫓아 와서, 바로의 모든 말과 그의 병거들과 그의 기병들과 함께 바다 한가운데로 들어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘바로의 말, 그의 병거, 그의 기병’처럼 집합적·군사적 표현을 쓰므로, 한국어에서는 자연스럽게 복수형으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바다 한가운데’는 단순한 진입이 아니라 바다의 내부로 깊이 들어가는 움직임을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  english_pob_choice: The Egyptians pursued
  chosen_korean: 이집트 사람들이 뒤쫓아 왔습니다
  alternatives_korean:
  - 이집트인들이 추격했습니다
  - 이집트 사람들이 추격해 왔습니다
  lexicon: HALOT
  rationale: 여기서는 민족/군대 주어가 분명하므로 ‘이집트 사람들’로 두고, רדף의 군사적 흐름을 살려 ‘뒤쫓아 왔습니다’로 자연스럽게 옮겼습니다.
- source_word: וַיָּבֹאוּ אַחֲרֵי/הֶם
  english_pob_choice: went in after them
  chosen_korean: 그들을 뒤쫓아 와서
  alternatives_korean:
  - 그들을 따라 들어가서
  - 그 뒤를 따라 들어가서
  lexicon: HALOT
  rationale: אַחֲרֵיהֶם의 ‘뒤를 따라’라는 뜻을 한국어 동작 흐름에 맞게 압축해, 추격과 진입이 연속된 장면을 드러냈습니다.
- source_word: כֹּל סוּס פַּרְעֹה רִכְבּוֹ וּפָרָשָׁיו
  english_pob_choice: all Pharaoh’s horses, his chariots, and his horsemen
  chosen_korean: 바로의 모든 말과 그의 병거들과 그의 기병들과
  alternatives_korean:
  - 바로의 모든 말과 그의 전차들과 그의 기병들과
  - 바로의 모든 말과 그의 전차 부대와 그의 기병들과
  lexicon: HALOT
  rationale: 히브리어의 집합적 단수 סוּס를 영어 POB처럼 자연스러운 복수 ‘말’로 살리고, רִכְבּוֹ는 군사 문맥에 맞게 ‘병거들’로 옮겼습니다.
- source_word: אֶל תּוֹךְ הַיָּם
  english_pob_choice: into the midst of the sea
  chosen_korean: 바다 한가운데로 들어갔습니다
  alternatives_korean:
  - 바다 가운데로 들어갔습니다
  - 바다 한복판으로 들어갔습니다
  lexicon: HALOT
  rationale: תּוֹךְ의 내부성/한복판이라는 뉘앙스를 살려 단순한 ‘바다로’보다 ‘한가운데로’가 더 정확하다고 보았습니다.
theological_decisions:
- issue: 이스라엘 추격 장면의 서술 시점과 군사적 긴장
  chosen_reading: 서술문으로 담담하게 옮기되, 연속 동작을 드러내는 ‘뒤쫓아 와서 … 들어갔습니다’로 긴박함을 유지했습니다.
  alternative_readings:
  - 보다 직역적으로 ‘추격하여 들어갔습니다’
  - 더 평이하게 ‘뒤따라 들어갔습니다’
  rationale: 본문은 사건의 진행을 빠르게 이어 주는 서술이므로, 지나친 해설이나 극적 재구성 없이 동작 연쇄를 보존하는 것이 적절합니다.
  doctrine_reference: 출애굽기 14장 내 홍해 사건의 역사 서술
