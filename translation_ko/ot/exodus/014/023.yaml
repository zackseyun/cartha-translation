  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
  footnotes:
  - marker: a
    text: Hebrew 'all Pharaoh’s horse, his chariotry, and his horsemen' uses a collective singular for 'horse'; the translation renders the sense in natural English as 'Pharaoh’s horses.'
    reason: lexical_alternative
  - marker: b
