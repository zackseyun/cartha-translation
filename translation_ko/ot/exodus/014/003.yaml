  rationale: 이 분사는 단순한 감정 상태보다 ‘혼란/당혹/길 잃음’의 복합 상태를 나타내므로, 본문 맥락의 ‘처지가 꼬여 갇힌 상태’를 드러내는 표현으로 옮겼습니다.
