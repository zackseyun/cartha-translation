translation:
  language: ko
  text: 「파라오가 이스라엘 자손에게 말할 것입니다[a]. ‘그들은 이 땅에서 혼란에 빠져 있습니다[c][b]. 광야가 그들을 가두었습니다.’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 자손들에 대해’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이스라엘 자손’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘혼란스럽습니다’, ‘당황해 있습니다’, ‘길을 잃었습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  english_pob_choice: For ... will say
  chosen_korean: 말할 것입니다
  alternatives_korean:
  - 말합니다
  - 말하겠습니다
  lexicon: HALOT
  rationale: 미래 예고의 뉘앙스를 살리기 위해 미래형으로 옮겼고, 문맥상 예언적 진술이므로 자연스러운 서술체로 처리했습니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: of the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘 사람들에게
  lexicon: HALOT
  rationale: 히브리어 표현을 직접 살리되 한국어에서는 자연스럽게 여격으로 풀어, ‘sons of Israel’의 구조를 유지했습니다.
- source_word: נְבֻכִים
  english_pob_choice: confused in the land
  chosen_korean: 혼란에 빠져 있습니다
  alternatives_korean:
  - 혼란스럽습니다
  - 당황해 있습니다
  - 길을 잃었습니다
  lexicon: HALOT
  rationale: 이 분사는 단순한 감정 상태보다 ‘혼란/당혹/길 잃음’의 복합 상태를 나타내므로, 본문 맥락의 ‘처지가 꼬여 갇힌 상태’를 드러내는 표현으로 옮겼습니다.
- source_word: סָגַר עֲלֵיהֶם
  english_pob_choice: has shut them in
  chosen_korean: 그들을 가두었습니다
  alternatives_korean:
  - 그들을 가두어 버렸습니다
  - 그들 위를 닫아 버렸습니다
  - 그들을 에워쌌습니다
  lexicon: HALOT
  rationale: 관용적 의미는 포위·구속이므로 ‘가두다’가 가장 간결하게 confinement를 전달합니다.
theological_decisions:
- issue: 파라오의 발화 인용 범위와 문장 종결
  chosen_reading: 본문 전체를 직접화법으로 묶고, 파라오의 예측 발화를 따옴표 안에 넣었습니다.
  alternative_readings:
  - 직접 인용 없이 서술문으로 처리
  - 예언자적 선언만 따로 분리
  rationale: 히브리어의 וְאָמַר와 뒤따르는 인용문 구조를 한국어에서도 명확히 보여 주는 편이 원문의 화행 관계를 더 잘 보존합니다.
  doctrine_reference: 서사 문맥 보존
