  naturalness: ‘이스라엘 자손에 관하여 이렇게 말할 것입니다’는 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽고, 이어지는 직접화법의 관계도 명료합니다. ‘그 땅’은 히브리어의 정관사 표현을 지나치게 특정하지 않으면서 자연스럽게 옮깁니다.
  terminology: ‘파라오’, ‘이스라엘 자손’, ‘광야’는 일관되고 적절합니다. ‘혼란에 빠져 있다’는 נְבֻכִים의 의미 범위를 안전하게 전달합니다.
