translation:
  language: ko
  text: 「파라오는 이스라엘 자손에 관하여[a][b] 이렇게 말할 것입니다. ‘그들은 그 땅에서 혼란에 빠져 있다[c]. 광야가 그들을 가두었다.’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 자손에 대하여’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘이스라엘 자손’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘혼란스럽다’, ‘당황해 있다’, ‘길을 잃었다’로도 옮길 수 있습니다.
