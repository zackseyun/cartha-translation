  - 주님
  lexicon: HALOT
  rationale: 원문에 있는 신성 4문자 YHWH를 한국어 기본형인 ‘야훼’로 일관되게 옮겨, 본문에 나타난 하나님의 언약 이름을 가렸던 관습적 대체어보다 직접적으로 드러냈습니다.
