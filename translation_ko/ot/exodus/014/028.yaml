  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
  footnotes:
  - marker: a
    text: Or, 'the cavalry' for 'the horsemen.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 물이 되돌아와서 병거들과 기병들—곧 바다로 그들을 따라 들어간 바로의 모든 군대를 덮었습니다. 그들 가운데 한 사람도 남지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기병들’은 문맥상 ‘기마병’ 또는 ‘기병대’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  english_pob_choice: the waters returned
  chosen_korean: 물이 되돌아와서
  alternatives_korean:
  - 물이 돌아와서
  - 물들이 되돌아와서
  lexicon: WLC; HALOT
  rationale: שוב의 서술적 완료를 한국어로 자연스럽게 살리면서, 물이 본래 자리로 되돌아오는 장면을 직접적으로 표현했습니다.
- source_word: וַיְכַסּוּ
  english_pob_choice: covered
  chosen_korean: 덮었습니다
  alternatives_korean:
  - 가렸습니다
  - 뒤덮었습니다
  lexicon: WLC; HALOT
  rationale: כסה의 기본 의미인 ‘덮다’를 그대로 살렸고, 심판의 압도성을 과장 없이 드러내기 위해 ‘뒤덮었습니다’보다 덜 해석적인 ‘덮었습니다’를 택했습니다.
- source_word: הָרֶכֶב וְאֶת הַפָּרָשִׁים
  english_pob_choice: the chariots and the horsemen
  chosen_korean: 병거들과 기병들
  alternatives_korean:
  - 전차들과 기병들
  - 병거와 말을 탄 자들
  lexicon: WLC; HALOT
  rationale: רֶכֶב과 פָּרָשִׁים의 군사적 병렬을 살리기 위해 각각 병거와 기병으로 옮겼습니다. 전통적 교회어보다 본문 상의 군사 장비와 병력을 더 직접적으로 드러냅니다.
- source_word: לְכֹל חֵיל פַּרְעֹה
  english_pob_choice: all the army of Pharaoh
  chosen_korean: 바로의 모든 군대
  alternatives_korean:
  - 바로의 모든 군사력
  - 바로의 전군
  lexicon: WLC; HALOT
  rationale: חֵיל은 여기서 단순한 개인들의 집합이 아니라 군사 집단 전체를 가리키므로 ‘군대’로 옮겼습니다. לְכֹל의 총체성을 ‘모든’으로 보존했습니다.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  english_pob_choice: that had gone after them into the sea
  chosen_korean: 바다로 그들을 따라 들어간
  alternatives_korean:
  - 바다에 그 뒤를 따라 들어간
  - 바다로 그 뒤를 쫓아 들어간
  lexicon: WLC; HALOT
  rationale: הבאים의 ‘들어가다/진입하다’라는 동작성을 보존하기 위해 단순한 ‘따라간’이 아니라 ‘들어간’을 넣었습니다. 물리적 추격과 진입을 함께 드러내는 표현입니다.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  english_pob_choice: not one of them remained
  chosen_korean: 그들 가운데 한 사람도 남지 않았습니다
  alternatives_korean:
  - 그들 가운데 하나도 남지 않았습니다
  - 그들 중 한 사람도 남아 있지 않았습니다
  lexicon: WLC; HALOT
  rationale: 관용구의 전면적 소멸을 자연스러운 한국어로 옮겼습니다. ‘한 사람도’는 군대 문맥에서 남은 자가 전혀 없음을 분명하게 드러냅니다.
theological_decisions:
- issue: 파라오 군대의 전멸 범위
  chosen_reading: 본문은 바다로 추격해 들어간 바로의 군대 전체가 물에 덮여 한 사람도 남지 않았다고 말합니다.
  alternative_readings:
  - 이 표현을 바로의 전체 군사력이 아니라 실제로 바다에 들어간 추격대에 한정해 읽을 수 있습니다.
  rationale: 히브리어는 ‘바로의 모든 군대’와 ‘그 뒤를 따라 바다로 들어간 자들’을 연결해 최종 진술의 범위를 그 추격 군대로 묶습니다. 번역은 이 총체적 진술을 유지하되, 본문이 말하는 범위를 넘어 확대하지는 않았습니다.
  doctrine_reference: 출애굽기 14장 홍해 사건의 본문적 진술 범위
- issue: ‘되돌아와서’의 서술 효과
  chosen_reading: 물이 단순히 움직인 것이 아니라, 갈라졌던 상태에서 본래 자리로 되돌아와 심판을 완성하는 장면으로 읽었습니다.
  alternative_readings:
  - 물을 단순한 자연 현상처럼 중립적으로 묘사할 수 있습니다.
  rationale: שוב의 서술은 사건의 역전과 종결을 강조하므로, 한국어에서도 ‘되돌아오다’를 써서 구원의 길이 닫히는 심판적 전환을 살렸습니다.
  doctrine_reference: 출애굽기 14장 심판-구원 전환 서사
