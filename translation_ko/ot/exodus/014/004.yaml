source:
  edition: WLC
  text: וְ/חִזַּקְתִּ֣י אֶת לֵב פַּרְעֹה֮ וְ/רָדַ֣ף אַחֲרֵי/הֶם֒ וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ וְ/יָדְע֥וּ מִצְרַ֖יִם כִּֽי אֲנִ֣י יְהוָ֑ה וַ/יַּֽעֲשׂוּ כֵֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
  footnotes:
  - marker: a
    text: Or, 'I will strengthen Pharaoh’s heart.' The Hebrew verb can mean 'make strong/firm'; in Exodus this firmness is expressed as obstinacy, hence 'harden.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'I will be glorified through Pharaoh.' The Hebrew expression speaks of the LORD gaining honor/glory in relation to Pharaoh through what follows.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 파라오의 마음을 굳게 하겠습니다[a]. 그는 그들을 뒤쫓을 것이며, 내가 파라오와 그의 온 군대 위에서 내 영광을 드러내겠습니다[b]. 그러면 이집트인들은 내가 야훼임을 알게 될 것입니다.” 그들은 그대로 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파라오의 마음을 강하게 하겠습니다.’ 히브리어 동사는 ‘강하게/굳게 하다’의 뜻을 가질 수 있으며, 출애굽기에서는 그 굳셈이 완고함으로 나타나므로 ‘굳게 하다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘파라오를 통해 영광을 받겠습니다.’ 히브리어 표현은 뒤따르는 심판을 통해 야훼께서 존귀와 영광을 얻으신다는 뜻을 담고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי אֶת לֵב
  english_pob_choice: I will harden Pharaoh’s heart
  chosen_korean: 파라오의 마음을 굳게 하겠습니다
  alternatives_korean:
  - 파라오의 마음을 완강하게 하겠습니다
  - 파라오의 마음을 강하게 하겠습니다
  lexicon: HALOT
  rationale: חזק의 기본 뜻은 ‘강하게 하다/굳게 하다’이므로, 문맥상 완고함을 드러내는 ‘굳게 하다’가 원문과 POB의 긴장을 함께 살립니다.
- source_word: וְרָדַף אַחֲרֵי/הֶם
  english_pob_choice: he will pursue them
  chosen_korean: 그는 그들을 뒤쫓을 것이며
  alternatives_korean:
  - 그는 그들을 추격할 것이며
  - 그는 그들을 따라 추적할 것이며
  lexicon: HALOT
  rationale: 군사적 추격의 의미를 자연스러운 현대 한국어로 옮기되, 단순한 ‘쫓다’보다 서술적 긴장이 있는 ‘뒤쫓다’를 선택했습니다.
- source_word: וְאִכָּבְדָה בְּ/פַרְעֹה וּ/בְ/כָל חֵיל/וֹ
  english_pob_choice: I will get glory over Pharaoh and over all his army
  chosen_korean: 내가 파라오와 그의 온 군대 위에서 내 영광을 드러내겠습니다
  alternatives_korean:
  - 내가 파라오와 그의 온 군대 위에서 영광을 얻겠습니다
  - 내가 파라오와 그의 온 군대를 통해 영광을 받겠습니다
  lexicon: HALOT
  rationale: כבד의 이 문맥은 야훼가 파라오와 그의 군대를 통해 존귀를 드러내시는 뜻이므로, ‘드러내겠습니다’로 하나님의 영광이 현현되는 방향을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Project default glossary
  rationale: 토라 본문의 신명사 표기는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 고유명과 호칭을 구별했습니다.
theological_decisions:
- issue: 하나님이 파라오의 마음을 ‘굳게 하신다’는 표현
  chosen_reading: 직접적 신적 작용으로 옮겨 ‘내가 … 굳게 하겠습니다’라고 했습니다.
  alternative_readings:
  - 내가 … 허락하겠습니다
  - 파라오의 마음이 굳어지게 하겠습니다
  rationale: 히브리어는 1인칭 능동형으로 야훼의 주도적 행위를 분명히 말하므로, 허용적 표현으로 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: כבד의 의미를 판단 맥락에서 어떻게 살릴 것인가
  chosen_reading: ‘내 영광을 드러내겠습니다’로 번역했습니다.
  alternative_readings:
  - ‘내가 영광을 얻겠습니다’
  - ‘내가 파라오를 통해 영광을 받겠습니다’
  rationale: 본문은 심판 속에서 야훼의 존귀가 분명해지는 결과를 말하므로, 결과의 현현을 드러내는 표현이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §3
