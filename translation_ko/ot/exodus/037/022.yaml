  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כַּפְתֹּרֵי/הֶ֥ם וּ/קְנֹתָ֖/ם מִמֶּ֣/נָּה הָי֑וּ כֻּלָּ֛/הּ מִקְשָׁ֥ה אַחַ֖ת זָהָ֥ב טָהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/022.yaml
  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
  footnotes:
  - marker: a
    text: Or 'their knobs'; the Hebrew term refers to a rounded ornamental feature, here likely expressed with floral imagery as 'buds.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'from it'; the sense is that the buds and branches were made as one piece with the lampstand itself.
    reason: lexical_alternative
  - marker: c
    text: Or 'one piece of hammered work' or 'hammered from one piece.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 꽃봉오리들과 그 가지들은 그것과 한 덩어리였습니다[c][b][a]. 그것은 모두 순금의 한 망치질한 작업이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 단추들’로도 옮길 수 있습니다. כאן의 둥근 장식은 여기서 꽃 이미지로 표현된 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그것으로부터’입니다. 뜻은 꽃봉오리들과 가지들이 등잔대 자체와 한 덩어리로 만들어졌다는 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘한 망치질한 작업’ 혹은 ‘한 덩어리에서 두드려 만든 작업’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  english_pob_choice: their buds
  chosen_korean: 그의 꽃봉오리들
  alternatives_korean:
  - 그의 단추들
  - 그의 둥근 장식들
  - 그의 마디들
  lexicon: HALOT
  rationale: 등잔대 묘사에서 כַּפְתּוֹר는 둥근 장식이지만, 꽃 모양 이미지가 함께 살아 있어 ‘꽃봉오리들’이 문맥상 가장 자연스럽고 시각적입니다.
- source_word: וּקְנֹתָם
  english_pob_choice: and their branches
  chosen_korean: 그 가지들
  alternatives_korean:
  - 그 줄기들
  - 그 갈대들
  - 그 팔들
  lexicon: HALOT
  rationale: קָנֶה는 문자적으로는 갈대/막대이지만, 등잔대의 돌출부를 가리킬 때는 ‘가지들’이 한국어로 가장 자연스럽고 기능도 잘 드러냅니다.
- source_word: מִקְשָׁה אַחַת
  english_pob_choice: one hammered work
  chosen_korean: 한 망치질한 작업
  alternatives_korean:
  - 한 덩어리의 망치질한 작업
  - 한 번에 두드려 만든 작업
  - 한 망치로 두드려 만든 작품
  lexicon: HALOT
  rationale: מִקְשָׁה는 금속을 두드려 만든 상태를 뜻하므로 ‘망치질한’으로 살렸고, אַחַת의 통일성을 ‘한’으로 간결하게 반영했습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 깨끗한 금
  - 순수한 금
  lexicon: HALOT
  rationale: 성막 기물의 재질 표현에서 זָהָב טָהוֹר는 관용적으로 ‘순금’이 가장 정확하고 읽기에도 자연스럽습니다.
theological_decisions:
- issue: מִמֶּנָּה의 통합적 제작 의미
  chosen_reading: ‘그것과 한 덩어리였습니다’로 옮겨, 단순한 출처가 아니라 등잔대와 한 몸처럼 함께 만들어진 뜻을 드러냈습니다.
  alternative_readings:
  - 그것에서 나왔습니다
  - 그것으로부터였습니다
  - 그것과 한 부분이었습니다
  rationale: 본문의 핵심은 부속물이 따로 붙은 것이 아니라 하나의 금속 덩어리에서 통째로 만들어졌다는 점입니다. 한국어에서는 ‘한 덩어리’가 그 통합성을 가장 분명하게 전달합니다.
  doctrine_reference: 성막 기물의 통일성과 정결한 제작 방식
