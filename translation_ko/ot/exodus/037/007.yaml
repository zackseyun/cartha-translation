source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ שְׁנֵ֥י כְרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ עָשָׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
  footnotes:
  - marker: a
    text: Or, “the atonement cover.” The Hebrew term refers to the ark’s cover, associated with atonement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 금으로 케루빔 둘을 만들었습니다. 그는 그것들을 속죄소의 양쪽 끝에서 두드려 만들어 내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄 덮개’. 히브리어 용어는 언약궤의 덮개를 가리키며, 속죄와 관련됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵ֥י כְרֻבִ֖ים
  english_pob_choice: two cherubim
  chosen_korean: 두 그룹
  alternatives_korean:
  - 두 케루빔
  - 두 천사 형상
  lexicon: HALOT
  rationale: כְרֻבִים은 성소 기물의 특정 존재를 가리키므로 직역 가능한 외래음차보다 기능적으로는 ‘그룹’이 가장 자연스럽습니다. 다만 전통적 외래어를 살릴 수도 있으나, 본문 맥락상 성소 장식의 형상을 분명히 전달하는 쪽을 택했습니다.
- source_word: זָהָ֑ב
  english_pob_choice: of gold
  chosen_korean: 금으로
  alternatives_korean:
  - 금의
  - 황금으로
  lexicon: HALOT
  rationale: 재료를 나타내는 목적격/수단격으로 자연스럽게 풀어 ‘금으로’라고 옮겼습니다.
- source_word: מִקְשָׁה֙
  english_pob_choice: hammered work
  chosen_korean: 쳐서 만든 작업
  alternatives_korean:
  - 망치질한 작업
  - 두드려 만든 공예품
  - 한 덩어리로 만든 것
  lexicon: HALOT
  rationale: מִקְשָׁה는 금속을 두드려 빚은 제작 방식을 가리키므로, 제작 방법을 드러내는 ‘쳐서 만든 작업’으로 옮겼습니다. ‘한 덩어리로’는 이 어휘 자체보다 문맥적 결과를 풀어쓴 표현이어서 본문에는 두지 않았습니다.
- source_word: מִשְּׁנֵ֖י קְצ֥וֹת
  english_pob_choice: from the two ends
  chosen_korean: 두 끝에서
  alternatives_korean:
  - 두 끝으로부터
  - 양쪽 끝에서
  lexicon: HALOT
  rationale: מִן의 출발점 의미를 살려 ‘에서’로 처리했습니다. ‘양쪽 끝에서’도 가능하지만, 원문의 대칭성과 간결성을 함께 살리기 위해 ‘두 끝에서’로 옮겼습니다.
- source_word: הַ/כַּפֹּֽרֶת
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 은혜좌
  - 자비의 자리
  - 속죄 덮개
  lexicon: HALOT
  rationale: כַּפֹּרֶת은 속죄와 관련된 언약궤 뚜껑을 가리키므로, 성경학적으로 투명한 ‘속죄소’를 본문에 두었습니다. 영어 POB의 ‘mercy seat’에 대응하는 전통적 표현이지만, 한국어에서는 기능적 의미가 더 분명한 번역이 오해를 줄입니다.
theological_decisions:
- issue: 성소 기물 용어의 한국어 등가
  chosen_reading: ‘속죄소’를 본문 용어로 사용해 궤의 덮개이자 속죄와 연결된 기능을 드러냅니다.
  alternative_readings:
  - ‘시은좌’
  - ‘자비의 자리’
  - ‘속죄 덮개’
  rationale: 이 구절 자체는 교리 논쟁을 다루지 않지만, כַּפֹּרֶת의 기능적 의미가 핵심이므로 전통적 관용어보다 원어 의미가 더 직접 드러나는 표현을 택했습니다.
  doctrine_reference: 출애굽기 25–37장의 성막/언약궤 용어 일관성
