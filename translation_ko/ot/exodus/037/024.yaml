  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
  footnotes:
  - marker: a
    text: Or 'all its vessels' or 'all its implements.' The Hebrew כֵּלִים is a broad term for articles or utensils associated with the lampstand.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 순금 한 달란트로 만들었고, 그것의 모든 기구도 그렇게 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기구’는 כאן의 כֵּלִים처럼 등잔대에 딸린 부속 물품 전반을 아우르는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  english_pob_choice: a talent
  chosen_korean: 한 달란트
  alternatives_korean:
  - 달란트 한 개
  - 한 재능
  lexicon: HALOT
  rationale: 성막 제작 문맥에서 כִּכָּר는 물건이 아니라 무게 단위 ‘달란트’를 뜻하므로, 한국어도 단위 표현으로 옮기는 것이 원문에 맞습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 정련한 금
  lexicon: HALOT
  rationale: טָהוֹר의 재료적 정결/순수성을 한국어 성경 문맥에서 가장 자연스럽게 드러내는 표현은 ‘순금’입니다.
- source_word: עָשָׂה אֹתָהּ
  english_pob_choice: He made it
  chosen_korean: 그것은 … 만들었습니다
  alternatives_korean:
  - 그가 그것을 만들었습니다
  - 그것을 만드셨습니다
  lexicon: HALOT
  rationale: 앞 문맥의 지시 대상을 이어받는 3인칭 서술을 자연스럽게 살리되, 주어를 문맥상 명확한 ‘그것’으로 처리했습니다.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  english_pob_choice: and all its utensils
  chosen_korean: 그것의 모든 기구도
  alternatives_korean:
  - 그것의 모든 기물도
  - 그것의 모든 도구도
  - 그것의 모든 그릇도
  lexicon: HALOT
  rationale: כֵּלִים은 성막 기물 전반을 가리키는 넓은 말이므로, 예배용 부속품을 포괄하는 ‘기구’가 가장 무난합니다.
