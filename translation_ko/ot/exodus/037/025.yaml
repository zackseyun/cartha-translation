base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
  footnotes:
  - marker: a
    text: Or, 'the incense altar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아카시아 나무로 분향단[a]을 만들었습니다. 그 길이는 한 규빗, 너비도 한 규빗이었고 정사각형이었으며, 높이는 두 규빗이었습니다. 그 뿔들은 제단과 한 덩어리로 되어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분향 제단’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  english_pob_choice: the altar of incense
  chosen_korean: 분향단
  alternatives_korean:
  - 향단
  - 분향 제단
  - 향 제단
  lexicon: HALOT
  rationale: 문맥상 향을 피우는 제단이므로 기능을 드러내는 ‘분향단’이 자연스럽고, 영어 POB의 기능 중심 번역을 한국어로도 살렸습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로
  alternatives_korean:
  - 싯딤 나무로
  - 아카시아 목재로
  lexicon: HALOT
  rationale: 현대 한국어에서는 ‘아카시아 나무’가 가장 이해되기 쉽고, 재료 표지를 위해 조사 ‘-로’를 써서 제작 재료임을 분명히 했습니다.
- source_word: אַמָּה
  english_pob_choice: cubit
  chosen_korean: 규빗
  alternatives_korean:
  - 약 18인치
  - 자
  lexicon: HALOT
  rationale: 고대 단위를 그대로 유지해 본문의 측정 체계를 보존했습니다.
- source_word: רָבוּעַ
  english_pob_choice: it was square
  chosen_korean: 네모였으며
  alternatives_korean:
  - 정사각형이었으며
  - 사각형이었으며
  lexicon: HALOT
  rationale: 형태 설명을 자연스러운 한국어로 옮기되, 기하학적 의미가 분명하도록 ‘네모’를 사용했습니다.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  english_pob_choice: Its horns were of one piece with it
  chosen_korean: 그 뿔들은 그와 한 덩어리였습니다
  alternatives_korean:
  - 그 뿔들은 그것에서 나왔습니다
  - 그 뿔들은 그것과 한 몸이었습니다
  lexicon: HALOT
  rationale: 뿔이 따로 붙은 것이 아니라 단일 재질로 이어진 구조임을 드러내기 위해 ‘한 덩어리’로 옮겼습니다.
theological_decisions:
- issue: 제의 기구 명칭의 직역성과 가독성
  chosen_reading: ‘분향단’으로 옮겨 제의 기능을 직접 드러냈습니다.
  alternative_readings:
  - ‘향 제단’
  - ‘향로’
  rationale: 문맥은 제단의 제작을 말하므로, 향을 피우는 용도와 제단이라는 형식을 함께 보존하는 번역이 가장 정확합니다.
  doctrine_reference: 성막/제의 기구 번역 원칙
