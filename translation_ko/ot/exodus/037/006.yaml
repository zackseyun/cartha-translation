  text: וַ/יַּ֥עַשׂ כַּפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
  footnotes:
  - marker: a
    text: Or 'atonement cover.' The Hebrew term refers to the gold cover of the ark and carries atonement associations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 속죄소를 만들었습니다. 곧 순금으로 만들었으며, 길이는 두 규빗 반이요, 너비는 한 규빗 반이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속죄 덮개’. 히브리어 용어는 언약궤의 금 덮개를 가리키며 속죄와 관련된 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 시은좌
  - 속죄 덮개
  - 덮개
  lexicon: HALOT
  rationale: 히브리어 כַּפֹּרֶת는 언약궤의 덮개를 가리키면서 속죄와 직접 연결되므로, 본문 기능을 가장 분명하게 드러내는 ‘속죄소’를 채택했습니다. ‘시은좌’는 교회 전통어이지만 현대 한국어 독자가 즉시 의미를 파악하기 어렵습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: of pure gold
  chosen_korean: 순금으로
  alternatives_korean:
  - 정금으로
  - 순수한 금으로
  lexicon: HALOT
  rationale: 히브리어의 재료 표현은 한국어에서 자연스럽게 ‘~으로’로 옮겨, 재질이 순도 높은 금임을 간결하게 나타냈습니다.
- source_word: אַמָּתַיִם וָחֵצִי
  english_pob_choice: two and a half cubits
  chosen_korean: 두 규빗 반
  alternatives_korean:
  - 두 규빗하고 반
  - 둘 반 규빗
  lexicon: HALOT
  rationale: 수량+‘반’의 관용적 한국어 표현으로 길이 측정을 자연스럽게 전달했습니다.
- source_word: וְאַמָּה וָחֵצִי
  english_pob_choice: and a cubit and a half
  chosen_korean: 한 규빗 반
  alternatives_korean:
  - 한 규빗하고 반
  - 일 규빗 반
  lexicon: HALOT
  rationale: 앞선 측정 표현과 같은 방식으로 처리해 본문의 대칭적 구조를 살렸습니다.
theological_decisions:
- issue: כַּפֹּרֶת의 한국어 신학적 뉘앙스
  chosen_reading: ‘속죄소’로 옮겨 언약궤 뚜껑이면서 속죄와 연결되는 예배적 기능을 함께 드러냈습니다.
  alternative_readings:
  - 시은좌
  - 속죄 덮개
  - 덮개
  rationale: 본문 자체가 성막 기구의 제작을 서술하지만, 해당 용어는 단순한 물건 이름을 넘어 속죄와 연결된 성소 용어이므로 기능적·신학적 의미를 보존하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
