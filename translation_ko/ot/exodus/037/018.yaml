id: EXO.37.18
reference: Exodus 37:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִ/צִּדֶּ֑י/הָ שְׁלֹשָׁ֣ה קְנֵ֣י מְנֹרָ֗ה מִ/צִּדָּ/הּ֙ הָֽ/אֶחָ֔ד וּ/שְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִ/צִּדָּ֖/הּ הַ/שֵּׁנִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/018.yaml
  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
  footnotes:
  - marker: a
    text: Or 'projecting from its sides'; the Hebrew participle describes the six branches as issuing outward from the lampstand.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from its one side ... from its second side'; English may also express this as 'from one side ... from the other side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 촛대의 양쪽에서 여섯 개의 가지가 나왔는데, 곧 촛대의 한쪽에서 세 가지 가지가 나왔고, 다른 쪽에서도 세 가지 가지가 나왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשִׁשָּׁה קָנִים
  english_pob_choice: And six branches
  chosen_korean: 여섯 개의 가지
  alternatives_korean:
  - 여섯 가지
  - 여섯 개의 팔
  lexicon: HALOT
  rationale: קָנִים은 등잔대의 구조를 이루는 돌출부를 가리키므로, 문맥상 ‘가지’가 가장 자연스럽고 원문 이미지도 잘 살립니다.
- source_word: יֹצְאִים
  english_pob_choice: were coming out
  chosen_korean: 나왔는데
  alternatives_korean:
  - 뻗어 나왔는데
  - 나가 있었는데
  - 튀어나왔는데
  lexicon: HALOT
  rationale: 분사형의 진행·묘사적 힘을 살리면서도 한국어 문장에서는 자연스럽게 ‘나오다’로 옮겼습니다.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  english_pob_choice: from its sides / from its one side ... from its second side
  chosen_korean: 양쪽에서 ... 한쪽에서 ... 다른 쪽에서도
  alternatives_korean:
  - 그 양쪽에서 ... 그 한쪽에서 ... 그 둘째 쪽에서
  - 좌우에서 ... 한편에서 ... 다른편에서
  lexicon: HALOT
  rationale: צד의 ‘쪽/편’이라는 뜻을 살려, 대칭 구조를 한국어로도 분명하게 드러냈습니다.
- source_word: מְנֹרָה
  english_pob_choice: lampstand
  chosen_korean: 촛대
  alternatives_korean:
  - 등잔대
  - 메노라
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥에서 전통적으로 널리 알려진 명칭을 쓰되, 현대 한국어에서 바로 이해되는 ‘촛대’를 택했습니다.
