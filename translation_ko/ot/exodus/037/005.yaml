  text: 그는 궤의 옆면에 있는 고리들에 운반용 막대들을 끼워 넣었습니다. 이는 궤를 운반하기 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘막대들’이며, 성막 기구를 옮길 때 쓰는 운반용 막대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  english_pob_choice: put
  chosen_korean: 끼워 넣어
  alternatives_korean:
  - 넣어
  - 집어넣어
  - 꽂아 넣어
  lexicon: HALOT
  rationale: 막대와 고리의 결합 동작을 한국어에서 가장 자연스럽게 살리면서, 단순한 ‘두다’보다 삽입 동작을 분명히 보여 줍니다.
- source_word: הַבַּדִּים
  english_pob_choice: the poles
  chosen_korean: 운반용 막대들
  alternatives_korean:
  - 막대들
  - 운반 막대들
  - 장대들
  lexicon: HALOT
  rationale: 성막 기구를 옮기는 용도를 드러내기 위해 ‘운반용’을 덧붙였고, 전통적 ‘채’보다 현대 독자가 이해하기 쉬운 ‘막대들’을 택했습니다.
- source_word: בַּטַּבָּעֹת
  english_pob_choice: into the rings
  chosen_korean: 고리에
  alternatives_korean:
  - 고리 안에
  - 고리 속에
  lexicon: HALOT
  rationale: 히브리어 전치사 ב의 삽입/위치 관계를 한국어에서 간결하게 나타내기 위해 ‘고리에’로 옮겼습니다.
- source_word: עַל צַלְעֹת הָאָרֹן
  english_pob_choice: on the sides of the ark
  chosen_korean: 궤의 옆면에
  alternatives_korean:
  - 궤의 옆쪽에
  - 궤의 측면에
  lexicon: HALOT
  rationale: צלעות는 여기서 궤의 옆면 구조를 가리키므로, 자연스러운 현대 한국어로 ‘옆면’이 가장 적절합니다.
- source_word: הָאָרֹן
  english_pob_choice: the ark
  chosen_korean: 궤
  alternatives_korean:
  - 언약궤
  - 상자
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥의 고정 용어를 따라 ‘궤’로 옮겨, 본문이 가리키는 성소 기구를 정확히 드러냅니다.
- source_word: לָשֵׂאת
  english_pob_choice: to carry
  chosen_korean: 메고 다닐 수 있게
  alternatives_korean:
  - 들 수 있게
  - 운반할 수 있게
  - 메도록
  lexicon: HALOT
  rationale: 목적 의미를 살리면서, 궤를 사람의 어깨에 메고 옮기는 기능을 한국어로 자연스럽게 풀어냈습니다.
theological_decisions:
- issue: 성막 기구 운반 목적의 표현
  chosen_reading: 막대들을 고리에 끼워 넣는 행위를 ‘궤를 메고 다닐 수 있게’라는 목적문으로 풀어, 본문이 지시하는 기능을 분명히 했습니다.
  alternative_readings:
  - 그는 막대들을 고리에 넣었습니다—궤를 운반하기 위해서입니다.
  - 그는 궤를 나르도록 막대들을 고리에 넣었습니다.
  rationale: 히브리어 לָשֵׂאת는 단순 결과가 아니라 목적을 나타내므로, 한국어에서도 기능을 드러내는 표현이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 성막/언약궤의 규례(출 25–37장)
