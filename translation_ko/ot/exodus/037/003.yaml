  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
  footnotes:
  - marker: a
    text: Or 'on its four corners' or 'on its four supports'; the Hebrew term can refer to feet or lower extremities/support points.
    reason: lexical_alternative
  - marker: b
    text: Literally 'on its one side ... on its second side'; that is, two rings on each side.
    reason: lexical_alternative
