  source_fidelity: 초안의 ‘그곳의’는 히브리어 접미사 לוֹ가 가리키는 선행사, 곧 앞 문맥의 제단을 장소로 바꾸어 버리므로 수정이 필요합니다. 또한 고리 네 개가 제단의 네 발 위에 놓이고 양쪽 옆에 각각 두 개라는 배치를 더 직접적으로 드러내야 합니다.
  naturalness: ‘한쪽 옆에 두 개, 다른 쪽 옆에 두 개’는 현대 한국어로 자연스럽습니다. 다만 현 초안은 긴 삽입구와 ‘되도록’ 때문에 고리를 주조한 행위보다 결과 배치가 부자연스럽게 앞서며, ‘그곳의 네 발’도 비문에 가깝습니다.
