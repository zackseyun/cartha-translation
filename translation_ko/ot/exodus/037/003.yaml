id: EXO.37.3
reference: Exodus 37:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּצֹ֣ק ל֗/וֹ אַרְבַּע֙ טַבְּעֹ֣ת זָהָ֔ב עַ֖ל אַרְבַּ֣ע פַּעֲמֹתָ֑י/ו וּ/שְׁתֵּ֣י טַבָּעֹ֗ת עַל צַלְע/וֹ֙ הָֽ/אֶחָ֔ת וּ/שְׁתֵּי֙ טַבָּע֔וֹת עַל צַלְע֖/וֹ הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/003.yaml
  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
  footnotes:
  - marker: a
    text: Or 'on its four corners' or 'on its four supports'; the Hebrew term can refer to feet or lower extremities/support points.
    reason: lexical_alternative
  - marker: b
    text: Literally 'on its one side ... on its second side'; that is, two rings on each side.
    reason: lexical_alternative
  - marker: c
    text: Or 'on its one side and two rings on its second side'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그곳의 네 발 위에, 곧 한쪽 옆에 두 개, 다른 쪽 옆에 두 개가 되도록, 금 고리 네 개를 부어 만들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  english_pob_choice: He cast
  chosen_korean: 부어 만들었습니다
  alternatives_korean:
  - 주조했습니다
  - 부었습니다
  lexicon: HALOT
  rationale: 금속 가공 문맥이므로 단순히 '붓다'보다 주조의 결과를 드러내는 표현이 적절하며, 한국어에서는 자연스럽게 '부어 만들다'가 원문 동작을 잘 살립니다.
- source_word: טַבְּעֹת זָהָב
  english_pob_choice: rings of gold
  chosen_korean: 금 고리 네 개
  alternatives_korean:
  - 금으로 된 고리 네 개
  - 금 반지 네 개
  lexicon: HALOT
  rationale: 본문의 물건은 장신구가 아니라 성막 기구의 부속품이므로 '고리'로 옮기고, 속격 관계는 한국어에서 자연스럽게 처리했습니다.
- source_word: פַּעֲמֹתָיו
  english_pob_choice: its four feet
  chosen_korean: 네 발
  alternatives_korean:
  - 네 모퉁이
  - 네 받침
  lexicon: HALOT
  rationale: 기구의 하단 돌출부/지지점을 가리킬 수 있지만, 이 문맥에서는 고리를 부착하는 위치를 가장 직접적으로 드러내는 '발'이 적절합니다.
- source_word: צַלְעוֹ ... הָאֶחָת / הַשֵּׁנִית
  english_pob_choice: on one side ... on the other side
  chosen_korean: 한쪽 옆에 두 개, 다른 쪽 옆에 두 개가 되도록
  alternatives_korean:
  - 한쪽 옆에 두 개와 다른 쪽 옆에 두 개
  - 한 옆에 두 개, 그 다른 옆에 두 개
  lexicon: HALOT
  rationale: 히브리어의 '한쪽/둘째 쪽'은 한국어에서 '한쪽/다른 쪽'으로 자연스럽게 풀어 주는 것이 가장 명료하며, 각 쪽에 두 개씩이라는 분배 관계도 드러냅니다.
