source:
  edition: WLC
  text: וּ/שְׁתֵּי֩ טַבְּעֹ֨ת זָהָ֜ב עָֽשָׂה ל֣/וֹ מִ/תַּ֣חַת לְ/זֵר֗/וֹ עַ֚ל שְׁתֵּ֣י צַלְעֹתָ֔י/ו עַ֖ל שְׁנֵ֣י צִדָּ֑י/ו לְ/בָתִּ֣ים לְ/בַדִּ֔ים לָ/שֵׂ֥את אֹת֖/וֹ בָּ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
  footnotes:
  - marker: a
    text: Or 'under its molding.' The Hebrew זֵר refers to the decorative border or rim around the top.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats two related expressions: ''on its two side-pieces, on its two sides.'' The translation preserves both rather than smoothing them away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 둘레 아래, 곧 그 두 옆면과 그 두 측면에 금 고리 두 개를 만들어서, 그것을 그 막대들로 운반하도록 고리로 삼았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 둘레(몰딩) 아래’로도 옮길 수 있습니다. כאן의 זֵר는 위쪽 둘레를 두르는 장식용 테두리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 두 옆면, 그 두 측면’이라는 서로 관련된 표현을 반복합니다. 번역은 이 반복을 평탄화하지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  english_pob_choice: rings
  chosen_korean: 고리
  alternatives_korean:
  - 링
  - 반지
  lexicon: HALOT
  rationale: 성막 기구의 부착용 금속 부속품이므로 ‘고리’가 가장 자연스럽고 기능도 분명합니다.
- source_word: זָהָב
  english_pob_choice: of gold
  chosen_korean: 금
  alternatives_korean:
  - 금으로 된
  - 황금의
  lexicon: HALOT
  rationale: 재질을 간결하게 드러내는 한국어 관용 표현으로 처리했습니다.
- source_word: מִתַּחַת לְזֵרוֹ
  english_pob_choice: under its rim
  chosen_korean: 그 둘레 아래
  alternatives_korean:
  - 그 가장자리 아래
  - 그 테두리 아래
  - 그 몰딩 아래
  lexicon: HALOT
  rationale: זֵר는 장식용 둘레/테두리를 가리키므로 현대 한국어에서 과도하게 건축용으로 들리지 않는 ‘둘레 아래’로 옮겼습니다.
- source_word: עַל שְׁתֵּי צַלְעֹתָיו / עַל שְׁנֵי צִדָּיו
  english_pob_choice: on its two side frames, on its two sides
  chosen_korean: 그 두 옆면과 그 두 측면
  alternatives_korean:
  - 그 두 옆판과 그 두 면
  - 그 두 측판과 그 두 옆
  lexicon: HALOT
  rationale: 히브리어의 반복을 살리되, צלע와 צד의 차이를 완전히 평탄화하지 않기 위해 구조물의 ‘옆면’과 일반적 ‘측면’으로 구분했습니다.
- source_word: לְבָתִּים לְבַדִּים
  english_pob_choice: as holders for poles
  chosen_korean: 막대들로 운반하도록 고리로 삼았습니다
  alternatives_korean:
  - 막대들을 받치는 받침으로 삼았습니다
  - 막대들을 끼우는 고리로 삼았습니다
  lexicon: HALOT
  rationale: לְבָתִּים은 막대를 위한 ‘받침/거치 역할’을, לְבַדִּים는 운반용 막대들을 뜻하므로 기능을 함께 드러내는 한국어로 옮겼습니다.
