lexical_decisions:
- source_word: וַיִּצֹק
  english_pob_choice: cast
  chosen_korean: 부어 만들고
  alternatives_korean:
  - 주조하고
  - 부어
  lexicon: HALOT
  rationale: 금속 제작 문맥이므로 단순한 ‘붓다’보다 ‘주조하다/부어 만들다’가 원문 의미를 더 정확히 드러냅니다. 한국어에서는 자연스러운 현대문체를 위해 ‘부어 만들고’로 옮겼습니다.
- source_word: טַבְּעֹת זָהָב
  english_pob_choice: gold rings
  chosen_korean: 금 고리 네 개
  alternatives_korean:
  - 황금 고리 네 개
  - 금으로 된 고리 네 개
  lexicon: HALOT
  rationale: 제사용 기구의 금속 고리를 가리키므로 ‘금 고리’가 간결하고 직접적입니다.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  english_pob_choice: on the four corners
  chosen_korean: 네 모서리에
  alternatives_korean:
  - 네 귀퉁이에
  - 네 끝부분에
  lexicon: HALOT
  rationale: פֵּאֹת은 기구의 끝단/모서리를 뜻하므로, 고리가 놓인 위치를 살리는 ‘모서리’가 가장 적절합니다.
- source_word: לְאַרְבַּע רַגְלָיו
  english_pob_choice: at its four feet
  chosen_korean: 네 다리의
  alternatives_korean:
  - 네 발의
  - 네 발에 달린
  lexicon: HALOT
  rationale: 히브리어는 모서리의 위치를 다리와 연결해 설명하므로, 한국어도 ‘네 다리의 네 모서리’로 관계를 분명히 했습니다.
theological_decisions:
- issue: 가구 제작 동사의 물질적·기술적 의미
  chosen_reading: 금속을 부어 주조하는 실제 제작 행위로 이해해 번역했습니다.
  alternative_readings:
  - 단순히 ‘붓다’로 옮겨 일반적인 액체 동작처럼 읽는 해석
  rationale: 성막 기구 제작 문맥에서는 물질 가공의 의미가 분명하므로, 기술적 함의를 보존하는 편이 원문 충실성에 맞습니다.
  doctrine_reference: 출애굽기 성막 규례의 서술 문맥
