  to: 그는 그것을 위해 금 고리 네 개를 주조하고, 그 고리들을 그 네 다리에 딸린 네 모서리에 달았습니다.[a]
  rationale: 수식 관계를 ‘그 네 다리에 딸린 네 모서리’로 조정하여, 네 모서리가 가구의 네 다리와 관련되어 있음을 명확히 했습니다. 금속 제작 동사는 ‘주조하고’로 다듬었습니다. 원문의 위치 관계에 남아 있는 표현상 여지는 각주로 보존했습니다.
