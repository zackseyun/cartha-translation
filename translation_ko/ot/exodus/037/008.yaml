  rationale: 이 단어는 단순한 물리적 덮개가 아니라 언약궤의 거룩한 제의 공간을 가리키므로, 전통적이며 기능을 드러내는 ‘속죄소’가 본문의 신학적 무게를 가장 잘 보존합니다.
