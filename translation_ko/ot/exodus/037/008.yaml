translation:
  language: ko
  text: 한 그룹을 이쪽 끝에서, 또 한 그룹을 저쪽 끝에서 만들었습니다. 속죄소[a]에서 두 그룹을 그 두 끝에 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
