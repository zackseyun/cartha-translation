    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּב
  english_pob_choice: cherub
  chosen_korean: 그룹
  alternatives_korean:
  - 케루빔
  - 천사 같은 존재
  lexicon: HALOT
  rationale: 히브리어 כְּרוּב은 언약궤와 관련된 특정한 보좌 수호 존재를 가리키므로, 의미를 풀이하기보다 음역에 가까운 ‘그룹’을 써서 대상을 보존했습니다.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  english_pob_choice: from one end on this side ... from one end on that side
  chosen_korean: 이쪽 끝에서 ... 저쪽 끝에서
  alternatives_korean:
  - 이 편 끝에서 ... 저 편 끝에서
  - 한쪽 끝에서 ... 다른 쪽 끝에서
  lexicon: HALOT
  rationale: קָצֶה는 ‘끝, 가장자리’이므로 두 위치의 대칭을 자연스럽게 살리기 위해 ‘이쪽 끝/저쪽 끝’으로 옮겼습니다.
- source_word: הַכַּפֹּרֶת
  english_pob_choice: mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 덮개
  - 은혜좌
  lexicon: HALOT
  rationale: כַּפֹּרֶת은 언약궤의 기술 용어이므로, 한국어 성경에서 널리 쓰이는 ‘속죄소’를 택해 제의적 기능을 드러냈습니다. 본문 안에서는 간결하게 처리하되, 대안 독법은 각주로 남겼습니다.
- source_word: מִשְּׁנֵי קְצֹוֹתָיו
  english_pob_choice: on its two ends
  chosen_korean: 그 두 끝에
  alternatives_korean:
  - 그 두 끝에서
  - 그의 두 끝에
  lexicon: HALOT
  rationale: 문맥상 그룹의 위치가 속죄소의 양쪽 끝에 놓였음을 뜻하므로, 한국어에서는 ‘그 두 끝에’가 가장 자연스럽고도 원문의 공간 관계를 유지합니다.
theological_decisions:
- issue: כַּפֹּרֶת의 번역이 지닌 제의적·속죄적 뉘앙스
  chosen_reading: 속죄소
  alternative_readings:
