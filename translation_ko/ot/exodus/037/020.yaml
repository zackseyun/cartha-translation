lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  english_pob_choice: And on the lampstand were
  chosen_korean: 그리고 등잔대에는
  alternatives_korean:
  - 그리고 등잔대 위에는
  - 그리고 등잔대 안에는
  lexicon: HALOT
  rationale: מְנֹרָה는 성막 기물의 ‘등잔대’로 보는 것이 자연스럽고, 장식 요소가 부착된 위치를 한국어에서는 ‘-에는’으로 간결하게 살리는 것이 적절합니다.
- source_word: גְבִעִים
  english_pob_choice: cups
  chosen_korean: 잔
  alternatives_korean:
  - 컵
  - 그릇
  lexicon: HALOT
  rationale: 장식용 잔 모양의 요소를 가리키므로 ‘잔’이 가장 자연스럽고, 현대 한국어에서도 형태를 충분히 전달합니다.
- source_word: מְשֻׁקָּדִים
  english_pob_choice: shaped like almond blossoms
  chosen_korean: 아몬드꽃처럼 빚은
  alternatives_korean:
  - 아몬드꽃 모양의
  - 아몬드꽃처럼 만든
  lexicon: HALOT
  rationale: שורש의 아몬드/꽃 형상이라는 장식 의미를 직역보다 자연스럽게 드러내기 위해 ‘처럼 빚은’을 택했습니다.
- source_word: כַּפְתֹּרֶיהָ
  english_pob_choice: its buds
  chosen_korean: 그 마디들
  alternatives_korean:
  - 그 봉오리들
  - 그 혹들
  lexicon: HALOT
  rationale: 성막 문맥에서 כפתור는 등잔대의 마디 같은 돌출 장식을 뜻하므로, 관용적 교회어보다 형태를 덜 오해하게 하는 ‘마디들’이 적절합니다.
theological_decisions:
- issue: 등잔대 장식의 삼중 병렬 표현
  chosen_reading: ‘네 개의 잔과 그 마디들과 그 꽃들’로 각 장식 요소를 분리해 번역했습니다.
  alternative_readings:
  - ‘네 개의 잔과 그 마디와 그 꽃’
  - ‘네 개의 컵과 그 봉오리와 그 꽃’
  rationale: 히브리어는 소유 대명사를 붙인 병렬 구조로 장식 요소를 나열하므로, 한국어에서도 항목성을 유지해 등잔대 장식의 세부 구조를 분명히 드러냈습니다.
  doctrine_reference: 출애굽기 25–37장의 성막 기물 묘사는 계시된 지시의 정확성을 강조합니다.
