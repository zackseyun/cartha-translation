  text: He made the poles of acacia wood and overlaid them with gold.
translation:
  language: ko
  text: 그는 아카시아 나무로 그 채들을 만들고, 그것에 금을 입혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבַּדִּים
  english_pob_choice: the poles
  chosen_korean: 그 채들
  alternatives_korean:
  - 그 막대들
  - 그 운반채들
  lexicon: HALOT
  rationale: 성막 기구를 들고 옮기는 용도의 막대라는 점을 살리되, 한국어에서는 자연스럽고 간결한 ‘채들’이 가장 무난합니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로
  alternatives_korean:
  - 아카시아 목재로
  - 아카시아 재목으로
  lexicon: HALOT
  rationale: 히브리어의 재료 구문을 한국어에서는 도구·재료의 ‘-로’로 자연스럽게 옮겼습니다.
- source_word: וַיְצַף
  english_pob_choice: and overlaid
  chosen_korean: 금을 입혔습니다
  alternatives_korean:
  - 금을 입었습니다
  - 금으로 덧입혔습니다
  lexicon: HALOT
  rationale: 공예 문맥의 צפה는 단순한 ‘덮다’보다 재질을 겉에 입히는 뜻이어서, 금박/도금의 의미를 드러내는 ‘금을 입히다’가 가장 적절합니다.
theological_decisions:
- issue: 성막 공예 동작의 표현 강도
  chosen_reading: ‘금을 입혔습니다’로 옮겨, 단순한 덮음이 아니라 금으로 겉면을 입히는 공예적·성소적 작업임을 드러냈습니다.
  alternative_readings:
  - ‘금으로 덮었습니다’
  - ‘금으로 씌웠습니다’
  rationale: 본문은 성막 제작의 세부 묘사이므로, 재료를 입히는 기술적 의미를 살리는 것이 출처 의미를 더 정확히 전달합니다.
  doctrine_reference: 출애굽기 37장의 성막 기구 제작 맥락
