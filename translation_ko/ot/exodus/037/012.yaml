source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ ל֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וַ/יַּ֧עַשׂ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/012.yaml
  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
  footnotes:
  - marker: a
    text: Or 'a rim' or 'a border' for 'frame.'
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'a crown of gold'; here 'molding' reflects an ornamental edging around the frame.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것 둘레에 너비가 한 뼘인 틀[a]을 만들고, 그 틀 둘레에 금 테두리 장식[b]을 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘테두리’나 ‘가장자리’로 옮길 수 있습니다. 여기서는 구조물의 둘레를 이루는 틀이라는 뜻을 살려 ‘틀’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로 ‘금 관’으로 옮기기도 합니다. 여기서는 틀 둘레를 두르는 장식적 가장자리라는 기능을 반영해 ‘금 테두리 장식’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  english_pob_choice: frame
  chosen_korean: 틀
  alternatives_korean:
  - 테두리
  - 가장자리
  - 틀장식
  lexicon: HALOT
  rationale: 문맥상 성막 기구의 둘레를 두르는 구조물로서, 현대 한국어에서는 ‘틀’이 기능을 가장 자연스럽게 드러냅니다. '테두리'는 지나치게 평면적이고, '틀장식'은 본문의 구조적 의미를 흐릴 수 있습니다.
- source_word: טֹפַח
  english_pob_choice: a handbreadth wide
  chosen_korean: 한 뼘 넓이의
  alternatives_korean:
  - 한 뼘만 한
  - 한 뼘
  - 손바닥 넓이의
  lexicon: HALOT
  rationale: 측량 단위인 ‘handbreadth’를 한국어 관용 측량어 ‘한 뼘’으로 옮기고, 문맥상 폭을 나타내는 관계를 분명히 하기 위해 ‘넓이의’를 보탰습니다.
- source_word: סָבִיב
  english_pob_choice: all around
  chosen_korean: 사방으로
  alternatives_korean:
  - 둘레로
  - 주위로
  - 온통 둘러
  lexicon: HALOT
  rationale: 사방을 둘러싼 분포를 간결하게 드러내는 표현으로 ‘사방으로’가 자연스럽습니다. 뒤의 ‘둘레에’와 함께 반복을 피하면서도 둘러감의 의미를 유지합니다.
- source_word: זֵר זָהָב
  english_pob_choice: a gold molding
  chosen_korean: 금 장식
  alternatives_korean:
  - 금 몰딩
  - 금 테두리
  - 금 관
  - 금 장식띠
  lexicon: HALOT
  rationale: 성막 기구의 장식용 가장자리라는 점을 반영해 ‘장식’으로 옮겼습니다. '몰딩'은 외래어로 난해하고, '관'은 왕관 연상을 불필요하게 일으킬 수 있습니다.
theological_decisions:
- issue: זֵר의 전통적 ‘관’ 표현 여부
  chosen_reading: ‘금 장식’으로 옮겨, 장식적 둘레라는 기능을 앞세웠습니다.
  alternative_readings:
  - ‘금 관’
  - ‘금 테두리’
  rationale: 본문은 제사 기구의 구조적 장식 요소를 말하며, 왕권 상징인 ‘관’으로 읽히지 않도록 기능 중심으로 옮기는 것이 문맥에 더 충실합니다.
  doctrine_reference: 성막 기구의 제작 규정(출애굽기 25–40장) 맥락
- issue: 사방 둘레 반복 표현
  chosen_reading: ‘사방으로 … 둘레에’로 두 번의 둘러감을 분리해 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘주위로 … 주위에’
  - ‘온 둘레에’
  rationale: 히브리어의 반복적 둘러감 표현을 한국어에서 너무 기계적으로 중복하지 않으면서도, 구조물이 완전히 둘러싸였다는 점은 유지했습니다.
  doctrine_reference: 문자적-구조적 묘사 보존 원칙
