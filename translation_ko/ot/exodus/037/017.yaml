id: EXO.37.17
reference: Exodus 37:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/מְּנֹרָ֖ה זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה עָשָׂ֤ה אֶת הַ/מְּנֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
  footnotes:
  - marker: a
    text: Or 'beaten work.' The Hebrew term refers to metal shaped by hammering.
    reason: lexical_alternative
  - marker: b
    text: Or 'its knobs' for 'its buds.' The Hebrew term denotes ornamental projections; the floral rendering is chosen because of the lampstand's plant-like design.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 순금으로 등잔대를 만들었습니다[a]. 그는 두드려 만든 작품으로 등잔대를 만들었으니, 그 밑판과 줄기, 잔들, 봉오리들[b]과 꽃들은 그것과 한 덩어리였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두드려 만든 작품’입니다. 히브리어 용어는 두드려 금속을 빚은 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그것의 혹들’입니다. 히브리어 용어는 장식 돌출부를 가리키며, 여기서는 등잔대의 식물형 디자인을 따라 ‘봉오리들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרָה
  english_pob_choice: lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 램프
  - 등대
  lexicon: HALOT
  rationale: 성막 기구의 전문 명칭이므로 단순한 ‘등불’보다 구조물을 드러내는 ‘등잔대’가 가장 정확합니다.
- source_word: מִקְשָׁה
  english_pob_choice: hammered work
  chosen_korean: 두드려 만든 작품
  alternatives_korean:
  - 망치질한 작품
  - 두드린 공작
  lexicon: HALOT
  rationale: 금속을 두드려 형성한 제작 방식을 살리되, 현대 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: יְרֵכָהּ
  english_pob_choice: its base
  chosen_korean: 그 밑판
  alternatives_korean:
  - 그 받침
  - 그 기단
  lexicon: HALOT
  rationale: 직역의 ‘허벅지’는 문맥상 부적절하므로, 등잔대의 아래를 지탱하는 부분을 ‘밑판’으로 풀어 의미를 살렸습니다.
- source_word: כַּפְתֹּרֶיהָ
  english_pob_choice: its buds
  chosen_korean: 봉오리들
  alternatives_korean:
  - 마디들
  - 혹들
  lexicon: HALOT
  rationale: 영어 POB가 꽃 모티프를 따라 ‘buds’를 택했으므로, 한국어도 식물 형상을 살리는 ‘봉오리들’이 가장 잘 대응합니다.
- source_word: מִמֶּנָּה הָיוּ
  english_pob_choice: were of one piece with it
  chosen_korean: 그것과 한 덩어리였습니다
  alternatives_korean:
  - 그것에서 나온 것이었습니다
  - 그것과 한 몸이었습니다
  lexicon: HALOT
  rationale: 부착물이 아니라 통짜로 만들어졌다는 뜻을 한국어 관용에 맞게 분명히 드러냈습니다.
