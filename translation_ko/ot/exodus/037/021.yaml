  lexicon: HALOT
  rationale: 등잔대의 돌출부를 문맥상 ‘가지’로 옮기는 것이 한국어 독자에게 가장 분명하며, POB의 ‘branches’와도 대응됩니다.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  english_pob_choice: for the six branches
  chosen_korean: 여섯 가지를 위한
