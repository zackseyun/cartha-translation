  - 볼록 장식
  lexicon: HALOT
  rationale: 등잔대의 장식 요소를 한국어로 자연스럽게 드러내면서도, 둥근 장식이라는 형태 감각을 유지하기 위해 ‘꽃받침’을 택했습니다. 영어 POB의 ‘bulb’에 대응하되, 식물/장식 이미지가 함께 살아납니다.
