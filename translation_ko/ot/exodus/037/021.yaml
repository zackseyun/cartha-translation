translation:
  language: ko
  text: 또 등잔대에서 나온 두 가지 아래에 둥근 장식 하나를 두고, 또 등잔대에서 나온 두 가지 아래에 둥근 장식 하나를 두고, 또 등잔대에서 나온 두 가지 아래에 둥근 장식 하나를 두었습니다. 이것은 등잔대에서 나온 여섯 가지를 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘둥근 장식’은 히브리어 כַּפְתֹּר를 옮긴 말입니다. ‘혹’ 또는 ‘장식 돌기’로도 번역할 수 있으며, 등잔대에 달린 둥근 장식 요소를 가리킵니다.
    reason: lexical_alternative
