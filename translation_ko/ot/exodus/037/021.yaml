translation:
  language: ko
  text: 그리고 그와 같은 모양의 꽃받침 하나를 두 개의 가지 아래에, 또 그와 같은 모양의 꽃받침 하나를 두 개의 가지 아래에, 또 그와 같은 모양의 꽃받침 하나를 두 개의 가지 아래에 두었으니, 이것은 그로부터 나오는 여섯 가지를 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘꽃받침’은 여기서 등잔대의 둥근 장식 돌기를 가리키는 번역입니다. 문자적으로는 ‘혹’ 또는 ‘버팀장식’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַפְתֹּר
  english_pob_choice: bulb
  chosen_korean: 꽃받침
  alternatives_korean:
