source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ אֶת שֶׁ֤מֶן הַ/מִּשְׁחָה֙ קֹ֔דֶשׁ וְ/אֶת קְטֹ֥רֶת הַ/סַּמִּ֖ים טָה֑וֹר מַעֲשֵׂ֖ה רֹקֵֽחַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/029.yaml
  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
  footnotes:
  - marker: a
    text: Or 'the incense of spices' or 'the spiced incense.' The Hebrew expression literally refers to incense made from aromatic substances.
    reason: lexical_alternative
  - marker: b
    text: Or 'a perfumer's work' or 'blended by a perfumer.' The Hebrew highlights skilled preparation by a specialist.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 거룩한 관유와 순수한 향료로 만든 향[a]을 향료 제조자의 솜씨로[b] 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘향료의 향’ 또는 ‘향신료의 향’. 히브리어 표현은 향기로운 재료로 만든 향을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘향료 제조자의 작업’ 또는 ‘향료 제조자가 섞은 것’. 히브리어는 숙련된 전문 제조를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 제작했습니다
  - 지었습니다
  lexicon: HALOT
  rationale: 완료된 서술 동작을 자연스러운 합쇼체로 옮기되, 의례용 물품의 제작이라는 점을 살려 ‘만들었습니다’를 택했습니다.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  english_pob_choice: the holy anointing oil
  chosen_korean: 거룩한 관유
  alternatives_korean:
  - 성스러운 관유
  - 거룩한 기름부음의 기름
  lexicon: HALOT
  rationale: כהל적 용례에서 ‘기름부음에 쓰는 기름’이라는 기능을 살리면서, קדש의 성격을 ‘거룩한’으로 직접 반영했습니다.
- source_word: קְטֹרֶת הַסַּמִּים טָהוֹר
  english_pob_choice: the pure fragrant incense
  chosen_korean: 순수한 향품 향
  alternatives_korean:
  - 순수한 향료의 향
  - 깨끗한 향 향
  lexicon: HALOT
  rationale: 하나의 향품 혼합물을 가리키는 표현으로, ‘향품’으로 재료성을 살리고 ‘향’으로 결과물을 드러냈습니다. טָהוֹר는 의례적 ‘순수함’을 유지해 ‘순수한’으로 옮겼습니다.
- source_word: מַעֲשֵׂה רֹקֵחַ
  english_pob_choice: the work of a perfumer
  chosen_korean: 향료 제조자의 작업
  alternatives_korean:
  - 조향사의 작품
  - 향료 장인의 작업
  lexicon: HALOT
  rationale: רֹקֵחַ는 단순한 기술자가 아니라 정교하게 섞는 전문인을 가리키므로, 기능을 분명히 드러내는 ‘향료 제조자’로 옮겼습니다.
theological_decisions:
- issue: 의례용 산물의 거룩함과 전문적 제작성의 동시 표현
  chosen_reading: ‘거룩한 관유’와 ‘순수한 향품 향’은 성막 제의에 속한 구별된 물품임을 드러내고, 마지막 절은 그것이 숙련된 전문인의 작업이었음을 강조합니다.
  alternative_readings:
  - ‘성스러운 기름부음의 기름’처럼 기능을 더 직역하는 읽기
  - ‘향신료 향’처럼 재료를 더 노골적으로 드러내는 읽기
  rationale: 본문은 단순한 재료 목록이 아니라, 성별된 물품이 정교하게 제조되었음을 함께 말하므로 두 차원을 모두 보존하는 것이 중요합니다.
  doctrine_reference: 출애굽기 30:25-33의 성막 기름과 향 제조 규례
