  source_fidelity: 히브리어는 모세가 거룩한 관유와 ‘향료들의 순수한 향’을 만들었으며, 이것들이 향료 제조 전문가의 숙련된 제조품임을 말합니다. 초안의 ‘향품 향’은 원문의 재료성과 완성품을 부자연스럽게 중복하며, 마지막 절을 별도 문장으로 처리해 히브리어의 수식 범위도 다소 흐립니다.
