base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/002.yaml
  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
  footnotes:
  - marker: a
    text: Or 'a gold molding all around' or 'a gold border around it.' The Hebrew זֵר denotes a decorative edging encircling the object.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 안팎으로 순금으로 입혔으며, 둘레에 금 테를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘둘레에 금 몰딩을’ 또는 ‘그 주위에 금 테두리를’로도 옮길 수 있습니다. 히브리어 זֵר는 물체를 둘러싸는 장식용 가장자리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  english_pob_choice: He overlaid it
  chosen_korean: 그것을 …로 입혔으며
  alternatives_korean:
  - 그것을 …로 덮었으며
  - 그것을 …로 씌웠으며
  lexicon: HALOT
  rationale: פִּעֵל형 צפה는 단순히 덮는 것이 아니라 금속을 입히는 제작 동작을 가리키므로, 공예 문맥에 맞게 ‘입히다’로 옮겼습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: with pure gold
  chosen_korean: 순금
  alternatives_korean:
  - 정금
  - 정련한 금
  lexicon: HALOT
  rationale: 성막 기구 제작 문맥에서 טָהוֹר는 금의 순도를 가리키므로, 한국어 성경에서 자연스럽고 정확한 ‘순금’으로 옮겼습니다.
- source_word: מִבַּיִת וּמִחוּץ
  english_pob_choice: inside and outside
  chosen_korean: 안팎으로
  alternatives_korean:
  - 안과 밖으로
  - 안과 바깥으로
  lexicon: HALOT
  rationale: 안쪽과 바깥쪽의 양면을 대조하는 표현이므로, 의미를 간결하게 살린 ‘안팎으로’가 가장 자연스럽습니다.
- source_word: זֵר זָהָב סָבִיב
  english_pob_choice: a surrounding border of gold
  chosen_korean: 둘레에 금 테를
  alternatives_korean:
  - 둘레에 금 둘레띠를
  - 주변에 금 테두리를
  lexicon: HALOT
  rationale: זֵר는 물체를 둘러싼 장식용 가장자리이므로, 공예 맥락을 살리면서도 과장하지 않는 ‘테’를 사용했고, סָבִיב은 ‘둘레에’로 풀었습니다.
theological_decisions:
- issue: 성막 기구의 마감 표현
  chosen_reading: ‘금 테’로 옮겨, 장식적 테두리라는 물리적 구조를 분명히 드러냈습니다.
  alternative_readings:
  - ‘금 장식띠’
  - ‘금 테두리’
  rationale: 본문은 예배적 상징보다 제작 결과를 묘사하므로, 기능적이고 시각적인 한국어로 유지하는 것이 원문 의도를 잘 반영합니다.
  doctrine_reference: 성막 제작 기사(출 25–40장)의 기술적 묘사
