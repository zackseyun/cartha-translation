  text: He made the poles of acacia wood and overlaid them with gold, to carry the table.
translation:
  language: ko
  text: 그는 아카시아 나무로 막대기들을 만들어 금을 입히고, 상을 나르는 데 쓰도록 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבַּדִּים
  english_pob_choice: the poles
  chosen_korean: 그 막대기들
  alternatives_korean:
  - 그 운반용 막대들
  - 그 지팡이들
  lexicon: HALOT
  rationale: הַבַּדִּים는 성막 기구를 들고 옮기는 막대기를 가리키므로, 문맥을 살려 ‘막대기들’로 옮기고 필요 의미는 동사구로 받았습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로
  alternatives_korean:
  - 아카시아 나무의
  - 시팀 나무로
  lexicon: HALOT
  rationale: 직역형인 ‘아카시아 나무의’보다 재료를 자연스럽게 드러내는 도구격 ‘아카시아 나무로’가 한국어 문맥에 더 맞습니다.
- source_word: וַיְצַף אֹתָם זָהָב
  english_pob_choice: and overlaid them with gold
  chosen_korean: 그것들을 금으로 입혀
  alternatives_korean:
  - 그것들을 금으로 덮어
  - 그것들을 금으로 입혀서
  lexicon: HALOT
  rationale: צפה는 목재 위에 금속을 입히는 제작 용어이므로, ‘덮다’보다 공예적 의미를 드러내는 ‘금으로 입히다’가 적절합니다.
- source_word: לָשֵׂאת אֶת הַשֻּׁלְחָן
  english_pob_choice: to carry the table
  chosen_korean: 상을 메게 하였습니다
  alternatives_korean:
  - 그 상을 나르게 하였습니다
  - 상을 운반하게 하였습니다
  lexicon: HALOT
  rationale: לָשֵׂאת는 목적을 나타내며, 성막 기구를 옮길 때 쓰는 관용적 표현을 살려 ‘메게 하였습니다’로 옮겼습니다.
theological_decisions:
- issue: 성막 기구 운반 목적의 표현 방식
  chosen_reading: ‘상을 메게 하였습니다’로 옮겨, 단순 운반이 아니라 성물 운반용으로 마련된 막대기라는 기능을 드러냈습니다.
  alternative_readings:
  - ‘그 상을 나르게 하였습니다’
  - ‘그 상을 운반하게 하였습니다’
  rationale: 본문의 목적절은 제작 목적을 분명히 하므로, 한국어에서도 성막 맥락의 기능을 유지하는 표현이 필요합니다.
  doctrine_reference: 출애굽기 성막 서술의 문맥적 정확성
