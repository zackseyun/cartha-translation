    reason: lexical_alternative
translation:
  language: ko
  text: 그것에 순수한 금을 입히고, 그것 둘레에 금 몰딩을 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몰딩’은 כאן의 זֵר을 현대적으로 옮긴 것으로, 전통적 표현으로는 ‘금 테’ 또는 ‘금 관’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  english_pob_choice: overlaid
  chosen_korean: 입히고
  alternatives_korean:
  - 덮고
  - 도금하고
  lexicon: HALOT
  rationale: 물건에 금을 얇게 입히는 제작 문맥이므로, 단순한 ‘덮다’보다 공정의 성격을 살리는 ‘입히다’가 더 정확합니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: pure gold
  chosen_korean: 순수한 금
  alternatives_korean:
  - 정련된 금
  - 깨끗한 금
  lexicon: HALOT
  rationale: 예배 기구 제작에서 금의 높은 순도를 가리키므로, 자연스럽고 직설적인 ‘순수한 금’으로 옮겼습니다.
- source_word: זֵר
  english_pob_choice: molding
  chosen_korean: 몰딩
  alternatives_korean:
  - 테두리
  - 테
  - 관
  lexicon: HALOT
  rationale: 여기서는 장식용 둘레띠/높은 가장자리를 뜻하므로, 현대 한국어에서 제작·장식 요소를 잘 드러내는 ‘몰딩’이 가장 가깝습니다.
- source_word: סָבִיב
  english_pob_choice: all around
  chosen_korean: 둘레에
  alternatives_korean:
  - 주위에
  - 사방에
  lexicon: HALOT
  rationale: 완전히 둘러싼 범위를 나타내므로, ‘둘레에’가 구조를 간결하게 드러냅니다.
