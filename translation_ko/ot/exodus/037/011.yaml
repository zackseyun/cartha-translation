    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  english_pob_choice: overlaid
  chosen_korean: 입히고
  alternatives_korean:
  - 덮고
  - 도금하고
  lexicon: HALOT
  rationale: 물건에 금을 얇게 입히는 제작 문맥이므로, 단순한 ‘덮다’보다 공정의 성격을 살리는 ‘입히다’가 더 정확합니다.
