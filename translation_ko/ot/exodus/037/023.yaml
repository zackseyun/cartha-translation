review_pass:
  verdict: revise
  source_fidelity: 히브리어는 등잔대의 ‘일곱 등잔’, ‘집게들’, ‘마흐토트(불을 담거나 처리하는 작은 그릇/팬)’가 모두 순금으로 만들어졌다고 말합니다. 초안은 기본 의미와 복수형 및 재료 표현을 충실히 전달합니다. 다만 מַחְתֹּתֶיהָ의 의미 범위를 고려하면 전통적이며 문맥상 자연스러운 표기인 ‘불똥 그릇’이 ‘불똥그릇’보다 낫습니다.
  naturalness: ‘그’를 각 병렬 명사구마다 반복하면 한국어 문장이 다소 무겁습니다. 첫 명사구에만 ‘그’를 두고 뒤의 기구들은 병렬로 연결하면, 등잔대에 속한 기구라는 지시를 보존하면서도 현대 표준 한국어로 더 자연스럽습니다. ‘순금’은 זָהָב טָהוֹר의 간결하고 관용적인 번역입니다.
  terminology: ‘등잔’, ‘집게’, ‘불똥 그릇’, ‘순금’은 성막 기구 문맥과 현대 성경 한국어 용례에 적합합니다. מַלְקָחֶיהָ는 ‘심지 집게’로 좁히지 않고 ‘집게’로 두며, מַחְתֹּתֶיהָ는 ‘불똥 그릇’으로 옮기되 대안적 이해를 각주에 남깁니다.
  issues:
  - severity: low
    issue: ‘불똥그릇들’의 붙여쓰기와 표현
    rationale: 이 기구명은 ‘불똥 그릇’으로 띄어 쓰는 것이 더 자연스럽고 한국어 성경 독자에게도 익숙합니다.
  - severity: low
    issue: 지시어 ‘그’의 반복
    rationale: 히브리어의 여성 단수 소유 접미사는 등잔대를 가리키지만, 한국어에서는 ‘그’를 매 항목에 반복하지 않아도 소유·소속 관계가 문맥상 충분히 유지됩니다.
  revised_text: 그는 그 일곱 등잔과 집게들과 불똥 그릇들을 순금으로 만들었습니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘심지 집게들’. 히브리어는 등잔의 심지를 다루는 데 쓰이는 집게류 도구를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불그릇들’ 또는 ‘불판들’. 히브리어는 등잔대와 관련된 작은 용기나 팬을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 본문의 의미는 유지하면서, 기구명 표기를 자연스럽게 다듬고 불필요하게 반복된 지시어를 줄였습니다. 논쟁의 여지가 있는 두 기구명은 본문에서 과도하게 해석하지 않고 각주로 대안 가능성을 보존했습니다.
