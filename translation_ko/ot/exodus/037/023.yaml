id: EXO.37.23
reference: Exodus 37:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת נֵרֹתֶ֖י/הָ שִׁבְעָ֑ה וּ/מַלְקָחֶ֥י/הָ וּ/מַחְתֹּתֶ֖י/הָ זָהָ֥ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/023.yaml
  text: He made its seven lamps[a], its tongs[b], and its firepans of pure gold.
  footnotes:
  - marker: a
    text: Or 'snuffers' for 'tongs'; the Hebrew term refers to a lamp implement used for handling the wicks.
    reason: lexical_alternative
  - marker: b
    text: Or 'firepans.' In this context, the term likely refers to small receptacles or trays associated with the lampstand.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 등잔 일곱 개와 그 집게들과 그 불똥그릇들을 순수한 금으로 만들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  lexicon: WLC/표준 서술형 동사
  rationale: 서술 진행형 wayyiqtol의 단순 과거를 자연스러운 합쇼체로 옮기되, 성막 기구 제작 문맥에 맞게 ‘만들다’를 택했습니다.
- source_word: נֵרֹתֶיהָ
  english_pob_choice: its seven lamps
  chosen_korean: 그 등잔 일곱 개
  alternatives_korean:
  - 그 일곱 등잔
  - 그 등불 일곱 개
  lexicon: HALOT
  rationale: נֵרֹת는 등잔/램프를 가리키므로 ‘등잔’으로 옮겼고, 수사는 한국어 자연성을 따라 뒤에 배치했습니다.
- source_word: מַלְקָחֶיהָ
  english_pob_choice: its tongs
  chosen_korean: 그 집게들
  alternatives_korean:
  - 그 불집게들
  - 그 심지 집게들
  - 그 깔쭉이들
  lexicon: HALOT
  rationale: 문맥상 등잔의 심지를 다루는 도구이지만, 영어 POB의 ‘tongs’처럼 기능을 과도하게 한정하지 않도록 보다 투명한 ‘집게들’을 선택했습니다.
- source_word: מַחְתֹּתֶיהָ
  english_pob_choice: its firepans
  chosen_korean: 그 불똥그릇들
  alternatives_korean:
  - 그 화로들
  - 그 불그릇들
  - 그 받침들
  lexicon: HALOT
  rationale: 성소 기구 문맥에서 단순히 ‘화로’보다 작은 받침/용기 성격을 드러내기 위해 ‘불똥그릇들’을 택했습니다. 영어 POB의 firepans와 대응하되, 등잔과 관련된 용기라는 의미를 살렸습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: of pure gold
  chosen_korean: 순수한 금으로
  alternatives_korean:
  - 정금으로
  - 순금으로
  lexicon: HALOT
  rationale: 재료를 나타내는 구문을 한국어에서 자연스러운 조어로 옮겼습니다. ‘순금’도 가능하지만, 본문이 기물의 재질을 분명히 드러내므로 ‘순수한 금으로’가 더 직설적입니다.
