    text: Or 'three cups made like almond blossoms ... and three cups made like almond blossoms.'
    reason: lexical_alternative
  - marker: b
    text: '''Bulb'' may also be rendered ''knob,'' referring to a rounded ornamental feature on the lampstand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 가지에는 아몬드꽃 모양의 잔 세 개와 둥근 장식과 꽃이 있었고[a], 또 한 가지에도 아몬드꽃 모양의 잔 세 개와 둥근 장식과 꽃이 있었습니다[b]. 등잔대에서 뻗어 나오는 여섯 가지가 모두 이와 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아몬드꽃처럼 만든 잔 세 개’.
    reason: lexical_alternative
  - marker: b
    text: ‘둥근 장식’은 히브리어 כַּפְתֹּר의 번역입니다. ‘마디’ 또는 ‘둥근 돌출 장식’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  english_pob_choice: cups
  chosen_korean: 잔
  alternatives_korean:
  - 컵
  - 그릇
  lexicon: HALOT
  rationale: 기계장치가 아닌 장식 요소이므로, 현대 한국어에서 자연스럽고 짧은 ‘잔’이 POB의 ‘cups’를 가장 무리 없이 옮깁니다.
- source_word: מְשֻׁקָּדִים
  english_pob_choice: almond-blossom-shaped
  chosen_korean: 아몬드꽃 모양의
  alternatives_korean:
  - 아몬드꽃처럼 생긴
  - 아몬드꽃 무늬의
  lexicon: HALOT
  rationale: 원문은 장식이 아몬드의 ‘형상/모양’을 따랐다는 뜻이므로, POB의 해석을 따라 ‘아몬드꽃 모양의’로 풀어 읽히게 했습니다.
- source_word: כַּפְתֹּר וָפֶרַח
  english_pob_choice: bulb and flower
  chosen_korean: 꽃받침과 꽃
  alternatives_korean:
  - 둥근 장식과 꽃
  - 마디와 꽃
  lexicon: HALOT
  rationale: 여기서는 등잔대 장식의 두 요소를 가리키므로, 둥근 돌출부를 드러내는 ‘꽃받침’과 뒤따르는 ‘꽃’을 함께 살려 장식적 평행을 유지했습니다.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  english_pob_choice: coming out from the lampstand
  chosen_korean: 등잔대에서 뻗어 나오는
  alternatives_korean:
  - 등잔대에서 나오는
  - 등잔대에서 뻗는
  lexicon: HALOT
  rationale: 가지가 중앙 기구에서 뻗어 나온다는 공간적 이미지를 보존하려고, 단순한 ‘나오는’보다 ‘뻗어 나오는’을 택했습니다.
theological_decisions:
- issue: 등잔대 장식의 세부 묘사를 얼마나 직역할 것인가
  chosen_reading: 장식 요소의 반복과 대칭을 그대로 드러내어, 문학적·성막적 정교함이 보이도록 옮겼습니다.
  alternative_readings:
  - 의역하여 단순히 ‘장식이 달려 있었습니다’라고 처리하는 방법
  - 전통적 용어를 써서 해설적으로 풀어 쓰는 방법
  rationale: 이 절은 의미 전달뿐 아니라 성막 기구의 정밀한 구조를 보여 주는 본문이므로, 반복과 평행을 유지하는 번역이 본문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 출애굽기 37장의 성막 기구 묘사
