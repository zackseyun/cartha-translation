translation:
  language: ko
  text: 그는 상 위에 있는 기구들, 곧 그 접시들과 잔들과 주전자들과 전제를 붓는 데 쓰는 대접들을[a] 모두 순금으로 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 그릇들, 작은 그릇들, 병들, 대접들’. 이 절에 나오는 몇몇 기물 명칭은 드물거나 문맥에 따라 뜻이 달라질 수 있으므로, 정확한 물건 종류는 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  english_pob_choice: the utensils
  chosen_korean: 기구들
  alternatives_korean:
  - 그릇들
  - 도구들
  lexicon: HALOT
  rationale: כֵּלִים은 문맥상 식탁 위의 여러 용기와 기구를 아우르는 넓은 말이므로, 현대 한국어에서는 가장 자연스러운 포괄어인 ‘기구들’로 옮겼습니다.
- source_word: קְעָרֹתָיו
  english_pob_choice: its plates
  chosen_korean: 그 접시들
  alternatives_korean:
  - 그 그릇들
  - 그 쟁반들
  lexicon: HALOT
  rationale: 문맥상 식탁 기물 목록이므로, 널리 이해되는 ‘접시들’이 가장 읽기 쉽고 구체적입니다.
- source_word: מְנַקִּיֹּתָיו
  english_pob_choice: its pitchers
  chosen_korean: 그 주전자들
  alternatives_korean:
  - 그 병들
  - 그 항아리들
  lexicon: HALOT
  rationale: 이 희귀어는 영어 POB가 현대적으로 ‘pitchers’로 처리한 만큼, 붓는 기능이 드러나는 ‘주전자들’로 옮겼습니다.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  english_pob_choice: with which the drink offering was poured out
  chosen_korean: 그것들로는 전제물을 붓습니다
  alternatives_korean:
  - 그것들로는 전제제를 붓습니다
  - 그것들로는 전제물을 따릅니다
  lexicon: HALOT
  rationale: יֻסַּךְ의 수동형은 ‘붓다’의 의미를 가지며, 문맥상 전제물(드링크 오퍼링)을 명시하는 것이 제의적 의미를 가장 분명히 살립니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: of pure gold
  chosen_korean: 순금으로
  alternatives_korean:
  - 정금으로
  - 순수한 금으로
  lexicon: HALOT
  rationale: 재료를 나타내는 종결 구문이므로, 한국어에서는 자연스러운 재료격 표현인 ‘순금으로’가 가장 간결합니다.
theological_decisions:
- issue: 제의용기 목록과 전제물 표현의 제사장적 뉘앙스
  chosen_reading: 목록의 항목을 일반 식기어로 과도하게 약화하지 않고, ‘전제물’을 명시해 성막 식탁 기물의 제의적 기능을 드러냈습니다.
  alternative_readings:
  - 일반 식기처럼 보이도록 중성화하기
  - ‘술’을 직접 보태어 현대화하기
  rationale: 히브리어 문맥은 단순 가정용 식기가 아니라 성막 예식용 기물과 전제 행위를 가리키므로, 본문이 가진 제의성을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 출애굽기 37장 성막 기물 제작 문맥
