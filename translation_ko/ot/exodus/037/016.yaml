    rationale: ‘—그것들로는 전제물을 붓습니다—을 순금으로’는 수식 관계가 끊기고 ‘을’의 결속 대상이 불명확합니다.
  - severity: medium
    issue: 희귀한 기물 명칭의 번역상 불확실성을 표시하는 주석이 없습니다.
