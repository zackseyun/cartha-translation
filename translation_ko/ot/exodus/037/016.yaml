  text: וַ/יַּ֜עַשׂ אֶֽת הַ/כֵּלִ֣ים אֲשֶׁ֣ר עַל הַ/שֻּׁלְחָ֗ן אֶת קְעָרֹתָ֤י/ו וְ/אֶת כַּפֹּתָי/ו֙ וְ/אֵת֙ מְנַקִּיֹּתָ֔י/ו וְ/אֶת הַ/קְּשָׂוֺ֔ת אֲשֶׁ֥ר יֻסַּ֖ךְ בָּ/הֵ֑ן זָהָ֖ב טָהֽוֹר־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
  footnotes:
  - marker: a
    text: Or 'its dishes, its small bowls, its flagons, and its bowls.' Several vessel terms in this verse are rare or context-specific, so exact English equivalents are approximate.
