source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
  footnotes:
  - marker: a
    text: Or 'the chest.' The Hebrew term can refer more generally to a box or chest, but in this tabernacle context 'ark' is the most contextually precise rendering.
    reason: lexical_alternative
translation:
  language: ko
  text: 브살렐이 아카시아 나무로 그 궤를 만들었습니다. 길이는 두 규빗 반, 너비는 한 규빗 반, 높이는 한 규빗 반이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘궤’는 이 문맥에서 성막의 언약궤를 가리킵니다. 히브리어 אָרוֹן은 일반적으로 상자나 궤짝을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 제작했습니다
  - 지었습니다
  lexicon: HALOT
  rationale: עשה는 일반적인 ‘만들다/하다’의 뜻이므로, 장인의 작업 맥락을 살리되 과도한 해석을 피하는 ‘만들었습니다’가 가장 직접적입니다.
- source_word: הָאָרֹן
  english_pob_choice: the ark
  chosen_korean: 그 궤
  alternatives_korean:
  - 그 상자
  - 그 궤짝
  lexicon: HALOT
  rationale: 출애굽기 문맥에서는 אָנֹון이 성막의 거룩한 기구인 ‘궤’를 가리키므로, 문맥상 정확성과 한국어 성경 용례를 함께 고려해 ‘궤’로 옮겼습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로
  alternatives_korean:
  - 아카시아 목재로
  - 아카시아 나무로 만든
  lexicon: HALOT
  rationale: 구문은 재료를 나타내므로 ‘~로’가 자연스럽고, ‘아카시아 나무’는 원문 재료를 직접 드러내는 한국어 표현입니다.
- source_word: אַמָּתַיִם וָחֵצִי / וְאַמָּה וָחֵצִי
  english_pob_choice: two and a half cubits / one and a half cubits
  chosen_korean: 두 규빗 반 / 한 규빗 반
  alternatives_korean:
  - 두 규빗과 반 / 한 규빗과 반
  - 두 규빗 반 / 한 규빗 반
  lexicon: HALOT
  rationale: 성막 규격의 표준 단위인 ‘규빗’을 그대로 유지하여 고대 치수를 보존했고, 수량 표현은 한국어에서 자연스러운 ‘~반’ 형식을 사용했습니다.
theological_decisions:
- issue: הָאָרֹן을 일반 사물명으로 옮길지, 성막의 성물명으로 옮길지
  chosen_reading: 성막 문맥의 전형적 용례를 따라 ‘궤’로 옮겼습니다.
  alternative_readings:
  - 상자
  - 궤짝
  rationale: 이 절의 אָרוֹן은 단순한 상자가 아니라 언약궤 제작을 가리키므로, 독자가 성물로 이해하도록 하는 번역이 본문 의도를 더 정확히 전달합니다.
  doctrine_reference: 출애굽기 25–40장의 성막/언약궤 문맥
