  terminology: ‘그룹들’과 ‘속죄소’는 한국어 성경의 통용 용어이며 이 성막 문맥에 적절합니다. 각주에서 ‘덮개’ 및 ‘속죄 덮개’라는 어휘적 대안을 제시하는 방식도 적절합니다.
