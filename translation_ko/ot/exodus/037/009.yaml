base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
  footnotes:
  - marker: a
    text: Or, more literally, “the cover” or “the atonement cover.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그룹들은 날개를 위로 펼쳐 그 날개로 속죄소[a] 위를 덮고 있었으며, 그들의 얼굴은 서로 마주하고 있었습니다. 그룹들의 얼굴은 속죄소를 향하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘덮개’ 또는 ‘속죄 덮개’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  english_pob_choice: the cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 그룹
  - 케루빔
  lexicon: HALOT
  rationale: 히브리어 כְּרוּבִים은 성경의 천상 존재를 가리키므로, 한국어에서는 의미를 풀기보다 전통적으로 통용되는 ‘그룹들’을 사용했습니다.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  english_pob_choice: had their wings spread upward
  chosen_korean: 날개를 위로 펴서
  alternatives_korean:
  - 날개를 위로 펼친 채
  - 날개를 위로 벌리고
  lexicon: HALOT
  rationale: 분사와 상태 서술을 한국어에서 자연스러운 동작·자세 표현으로 옮기되, 위쪽을 향해 펼친 자세라는 점을 살렸습니다.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם עַל הַכַּפֹּרֶת
  english_pob_choice: overshadowing the mercy seat with their wings
  chosen_korean: 그 날개로 속죄소를 덮고 있었으며
  alternatives_korean:
  - 그 날개로 속죄소를 가리고 있었으며
  - 그 날개로 속죄소 위를 덮고 있었으며
  lexicon: HALOT
  rationale: סכך의 덮다/가리다 의미를 따라, 성막 문맥의 예식적 대상인 הַכַּפֹּרֶת는 ‘속죄소’로 옮겼습니다.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  english_pob_choice: and their faces were toward one another
  chosen_korean: 서로를 향해 얼굴을 마주하고 있었습니다
  alternatives_korean:
  - 서로를 향해 있었습니다
  - 각기 서로를 향하고 있었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리면서도 한국어에서 자연스럽게 읽히도록 ‘얼굴을 마주하다’로 풀었습니다.
theological_decisions:
- issue: הַכַּפֹּרֶת의 한국어 대응
  chosen_reading: 속죄소
  alternative_readings:
  - 덮개
  - 속죄 덮개
  rationale: 문자적으로는 ‘덮개’이지만, 성막 문맥에서의 제의적·신학적 기능을 드러내는 표준 번역으로 ‘속죄소’를 택했습니다. 영어 POB의 ‘mercy seat’에 대응하는 한국어로도 가장 적절합니다.
  doctrine_reference: 'Tabernacle terminology: cultic object naming with source-directed transparency'
