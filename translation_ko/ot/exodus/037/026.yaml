    rationale: 원문의 זֵר זָהָב סָבִיב는 금 관/테를 사방에 두른다는 표현입니다. ‘사방에 금 관을 둘렀다’로 제시하면 대안의 범위가 분명해집니다.
  revised_text: 그것의 윗면과 사방의 옆면과 뿔들을 순금으로 입히고, 그 둘레에 금 테를 만들었습니다.[a]
