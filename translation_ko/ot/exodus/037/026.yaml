translation:
  language: ko
  text: 그것의 윗면과 사방의 옆면과 뿔들을 순금으로 입히고, 그 둘레에 금 테를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사방에 금 관을 둘렀다.’ 히브리어 용어는 물체 둘레의 장식용 테나 가장자리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  english_pob_choice: overlaid
  chosen_korean: 입혔습니다
  alternatives_korean:
  - 덮었습니다
  - 입혔습니다
  lexicon: HALOT
  rationale: 성막 기물에 금속을 씌우는 공예적 동작이므로, 단순한 ‘덮다’보다 ‘입히다’가 표면 전체를 금으로 씌운 뜻을 더 정확히 살립니다.
- source_word: גַּגּוֹ / קִירֹתָיו / קַרְנֹתָיו
  english_pob_choice: its top / its sides / its horns
  chosen_korean: 그 윗면과 둘레의 옆면들과 뿔들
  alternatives_korean:
  - 그 지붕과 벽들
  - 그 윗부분과 벽면들과 뿔들
  lexicon: HALOT
  rationale: 제단의 구조를 가리키므로 ‘지붕’이나 ‘벽’보다 물체의 표면과 측면을 드러내는 ‘윗면’과 ‘옆면들’이 더 자연스럽고 정확합니다.
- source_word: זֵר
  english_pob_choice: molding
  chosen_korean: 금 테
  alternatives_korean:
  - 금 몰딩
  - 금 둘레
  - 금 관
  lexicon: HALOT
  rationale: זֵר는 장식용 둘레나 가장자리를 뜻하므로, 현대 한국어에서는 기능을 드러내는 ‘금 테’가 가장 간결합니다. 전통적 ‘관’은 오해 소지가 있어 본문에서는 피했습니다.
theological_decisions:
- issue: 제단의 ‘뿔들’과 장식 둘레의 표현 유지
  chosen_reading: 예배용 기물의 구체적 형태를 그대로 살려, 상징적 의미를 과도하게 풀지 않고 기술적 묘사로 유지했습니다.
  alternative_readings:
  - 뿔을 상징적으로 완화하여 옮기는 방식
  - 장식 부분을 일반적인 ‘모서리’로 바꾸는 방식
  rationale: 출애굽기 성막 규정은 실제 기물의 제작을 기록하므로, 본문의 물질성과 형상을 보존하는 것이 स्रोत 의미에 더 충실합니다.
  doctrine_reference: 성막 기물의 역사적·예전적 구체성 보존
