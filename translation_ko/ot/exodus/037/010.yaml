base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a cubit and a half.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아카시아 나무로 상을 만들었습니다. 그 상의 길이는 두 규빗이고, 너비는 한 규빗이며, 높이는 한 규빗 반이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He made
  chosen_korean: 그는 … 만들었습니다
  alternatives_korean:
  - 그는 … 지었습니다
  - 그는 … 제작했습니다
  lexicon: HALOT
  rationale: 서술 동사의 פשוט한 과거 행위를 자연스러운 합쇼체로 옮겼습니다. '제작했습니다'보다 '만들었습니다'가 본문의 단순한 제작 진술을 더 직접적으로 드러냅니다.
- source_word: הַשֻּׁלְחָן
  english_pob_choice: the table
  chosen_korean: 상
  alternatives_korean:
  - 식탁
  - 테이블
  lexicon: HALOT
  rationale: 성막 기물 문맥의 שולחן은 일상적 가구보다 제의적 '상'이 더 적절합니다. 한국어 성경 전통에서도 성막의 기구를 '상'으로 옮기는 경우가 있어 문맥에 맞습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 조각목으로
  alternatives_korean:
  - 아카시아 나무로
  - 시띰 나무로
  lexicon: HALOT
  rationale: 의미는 아카시아 계열 목재이지만, 한국어 성경의 문맥 전통을 살려 '조각목'을 채택했습니다. 이는 제의적 기구 재료를 간결하게 나타냅니다.
- source_word: אַמָּתַיִם / וְאַמָּה / וָחֵצִי
  english_pob_choice: two cubits / one cubit / one and a half cubits
  chosen_korean: 두 규빗 / 한 규빗 / 한 규빗 반
  alternatives_korean:
  - 두 자 / 한 자 / 한 자 반
  - 두 큐빗 / 한 큐빗 / 한 큐빗 반
  lexicon: HALOT
  rationale: 고대 단위는 현대 단위로 환산하지 않고 '규빗'으로 보존했습니다. 숫자와 단위의 배열도 원문의 측정 진술을 그대로 따랐습니다.
- source_word: קֹמָתוֹ
  english_pob_choice: its height
  chosen_korean: 높이는
  alternatives_korean:
  - 키는
  - 높이
  lexicon: HALOT
  rationale: 물체 설명에서 קומה는 인격적 '키'가 아니라 수직 치수인 '높이'입니다. 한국어에서는 서술형 '높이는'이 가장 자연스럽습니다.
