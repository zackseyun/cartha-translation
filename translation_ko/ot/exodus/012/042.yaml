  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
  footnotes:
  - marker: a
    text: Or 'a night of watching' or 'a night of observance.' The Hebrew שִׁמֻּרִים carries the sense of watchfulness/keeping and may also imply commemorative observance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 야훼를 위한 감시의 밤이었는데, 그들을 이집트 땅에서 인도해 내시기 위한 밤이었습니다. 이 밤은 바로 야훼를 위한 감시의 밤이니, 이스라엘의 모든 자손을 위한 모든 세대에 걸친 밤입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감시’는 כאן의 שִׁמֻּרִים가 지닌 watchfulness/keeping과 기념적 준수의 뉘앙스를 함께 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  english_pob_choice: night of vigil
  chosen_korean: 감시의 밤
  alternatives_korean:
  - 깨어 지키는 밤
  - 철야의 밤
  - 지키는 밤
  lexicon: HALOT
  rationale: שִׁמֻּרִים의 watchfulness/keeping과 기념적 성격을 함께 살리기 위해 ‘감시’보다 더 자연스러운 ‘감시의 밤’으로 옮겨, 단순한 의식이나 단순한 경계만으로 좁히지 않았습니다.
- source_word: לַיהוָה / יְהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를 위한
  alternatives_korean:
  - 야훼께 속한
  - 야훼께 드리는
  - 여호와를 위한
  lexicon: DOCTRINE.md contested terms table
  rationale: 공식명 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, ל의 관계/전속 의미는 문맥상 ‘위한’으로 자연스럽게 살렸습니다.
- source_word: לְהוֹצִיאָם
  english_pob_choice: to bring them out
  chosen_korean: 그들을 인도해 내시기 위한
  alternatives_korean:
  - 그들을 이끌어 내기 위한
  - 그들을 데려내기 위한
  - 그들을 끌어내기 위한
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사 표현을 한국어 목적구로 살리되, 출애굽 문맥의 구원적 이동을 반영해 ‘인도해 내시기’로 옮겼습니다.
- source_word: לְדֹרֹתָם
  english_pob_choice: throughout their generations
  chosen_korean: 모든 세대에 걸친
  alternatives_korean:
  - 그들의 대대로
  - 세대를 거쳐
  - 대대로
  lexicon: HALOT
  rationale: 반복·지속의 뜻을 한국어 관용으로 풀어, 공동체적 기억과 준수의 연속성을 분명히 했습니다.
theological_decisions:
- issue: שִׁמֻּרִים의 의미를 의례만으로 좁힐지 여부
  chosen_reading: ‘감시의 밤’으로 번역해 watchfulness와 기념적 observance의 긴장을 함께 보존했습니다.
  alternative_readings:
  - ‘기념의 밤’
  - ‘깨어 지키는 밤’
  - ‘준수의 밤’
  rationale: 본문은 출애굽 사건을 기억하는 예식성과, 그 사건을 위해 지켜진 밤이라는 역사성을 함께 담으므로 한쪽으로 평평하게 만들지 않는 번역이 필요합니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
