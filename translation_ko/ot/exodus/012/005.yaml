base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/005.yaml
  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
  footnotes:
  - marker: a
    text: Hebrew שֶׂה can refer more broadly to a young animal of the flock, including either a lamb or a kid; the following clause makes explicit that it may be taken from sheep or goats.
    reason: lexical_alternative
translation:
  language: ko
  text: 흠 없는 어린 양, 곧 일 년 된 수컷이어야 하며, 양떼나 염소떼에서 취하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 더 넓게는 양이나 염소의 어린 짐승을 가리킬 수 있으며, 뒤 절은 그것이 양 떼나 염소 떼에서 올 수 있음을 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  english_pob_choice: lamb
  chosen_korean: 어린 양
  alternatives_korean:
  - 양
  - 젊은 가축
  - 새끼 양
  lexicon: HALOT
  rationale: שֶׂה는 양이나 염소의 어린 개체를 가리킬 수 있지만, 유월절 문맥에서 제물의 단수성을 살리기 위해 한국어에서는 자연스럽고 제의적 뉘앙스를 지닌 ‘어린 양’으로 옮겼습니다.
- source_word: תָמִים
  english_pob_choice: without blemish
  chosen_korean: 흠 없는
  alternatives_korean:
  - 온전한
  - 완전한
  - 흠 없는 바
  - 결점 없는
  lexicon: HALOT
  rationale: 희생 제물의 적격성을 나타내는 표현이므로, 도덕적 ‘완전함’보다 제의적 의미가 분명한 ‘흠 없는’이 가장 직접적입니다.
- source_word: זָכָר
  english_pob_choice: male
  chosen_korean: 수컷
  alternatives_korean:
  - 암수 구별의 수컷
  - 남성
  - 수컷의
  lexicon: HALOT
  rationale: 가축 제물의 성별 표지이므로 자연스러운 생물학적 표현인 ‘수컷’을 사용했습니다.
- source_word: בֶּן שָׁנָה
  english_pob_choice: a year old
  chosen_korean: 일 년 된
  alternatives_korean:
  - 한 살 된
  - 일 년 된 것
  - 한 해 된
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻을 그대로 살리되 현대 한국어에서는 ‘일 년 된’이 가장 자연스럽고 이해하기 쉽습니다.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  english_pob_choice: from the sheep or from the goats
  chosen_korean: 양떼나 염소떼에서
  alternatives_korean:
  - 양이나 염소에서
  - 양떼와 염소떼에서
  - 양 또는 염소 무리에서
  lexicon: HALOT
  rationale: 허용 가능한 출처 범주를 한국어로 자연스럽게 제시하기 위해 집합 명사 형태로 옮겼습니다. 문맥상 둘 중 하나를 뜻하므로 ‘나’로 연결했습니다.
- source_word: תִּקָּחוּ
  english_pob_choice: you shall take / you may take it
  chosen_korean: 취하십시오
  alternatives_korean:
  - 가져가십시오
  - 취하셔야 합니다
  - 받으십시오
  lexicon: HALOT
  rationale: 복수 명령의 어조를 살리면서도 한국어 성경체에 맞게 공손한 명령형으로 옮겼습니다. 대상은 앞 문맥의 단수 제물을 가리키므로 별도 대명사 없이 자연스럽게 처리했습니다.
theological_decisions:
- issue: 제물의 적격성 표현
  chosen_reading: ‘흠 없는’으로 제의적 합격 기준을 분명히 했습니다.
  alternative_readings:
  - ‘온전한’으로 완곡하게 옮김
  - ‘완전한’으로 도덕적 완전성을 부각
  rationale: 문맥은 도덕적 성품이 아니라 제사에 합당한 상태를 말하므로, 희생 제물의 결함 없음이라는 의미를 직접 드러내는 표현을 택했습니다.
  doctrine_reference: 출애굽기 12장의 유월절 규례
