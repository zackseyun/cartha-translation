  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
  footnotes:
  - marker: a
    text: Or 'no leavened thing shall you eat.' The Hebrew term is broader than bread alone and includes anything made leavened.
    reason: lexical_alternative
  - marker: b
    text: Or 'throughout all your settlements.' The phrase refers to every place where you live.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 누룩 든 것은 아무것도 먹지 말고, 너희가 사는 모든 곳에서 무교병을 먹어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누룩 든 어떤 것도 먹지 말라.’ 히브리어 용어는 빵만이 아니라 누룩이 든 모든 것을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희 모든 거주지에서.’ 이 표현은 너희가 사는 모든 곳을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  english_pob_choice: anything leavened
  chosen_korean: 누룩 든 것은 아무것도
  alternatives_korean:
  - 누룩 든 것
  - 발효된 것
  - 누룩이 든 어떤 것
  lexicon: HALOT
  rationale: מַחְמֶצֶת는 단순히 빵만이 아니라 누룩이 들어가 발효된 모든 것을 가리키므로, 범위를 좁히지 않도록 ‘누룩 든 것은 아무것도’로 옮겼습니다.
- source_word: לֹא תֹאכֵלוּ
  english_pob_choice: you shall not eat
  chosen_korean: 먹지 말고
  alternatives_korean:
  - 먹어서는 안 됩니다
  - 먹지 말아야 합니다
  - 먹지 마십시오
  lexicon: HALOT
  rationale: 법령형 금지문이므로 한국어에서는 자연스러운 직접 금지형 ‘먹지 말고’로 처리하되, 이어지는 명령과의 병렬을 살렸습니다.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  english_pob_choice: in all your dwellings
  chosen_korean: 너희가 사는 모든 곳에서
  alternatives_korean:
  - 너희 모든 거처에서
  - 너희 모든 정착지에서
  - 너희가 거주하는 모든 곳에서
  lexicon: HALOT
  rationale: מוֹשָׁב은 거처/거주지를 뜻하므로, ‘집’으로 좁히지 않고 생활 전반을 포괄하는 ‘너희가 사는 모든 곳’으로 옮겼습니다.
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 빵
  - 무누룩 빵
  - 무교식
  lexicon: HALOT
  rationale: 절기 문맥의 고유한 음식 명칭이므로 표준 교회 용례와도 맞는 ‘무교병’을 사용하되, 앞뒤 문맥상 대비를 분명히 했습니다.
theological_decisions:
- issue: 금지와 명령의 병렬 구조
  chosen_reading: 부정 명령과 긍정 명령을 ‘먹지 말고 … 먹어야 합니다’로 병렬해 규범적 강도를 드러냈습니다.
  alternative_readings:
  - 먹지 말아야 하며 … 먹어야 합니다
  - 먹지 마십시오 … 먹으십시오
  rationale: 히브리어는 같은 인칭 복수의 금지와 명령을 대조적으로 배치합니다. 한국어에서도 법적·예전적 긴장을 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 출애굽기 유월절 규례
- issue: ‘누룩 든 것’의 범위
  chosen_reading: ‘빵’으로 한정하지 않고 누룩이 든 모든 것을 포함하는 표현을 택했습니다.
  alternative_readings:
  - 누룩 든 빵만
  - 누룩이 든 음식
  rationale: 영어 POB의 주석처럼 히브리어는 빵보다 넓은 대상을 가리킬 수 있으므로, 본문의 금지 범위를 축소하지 않도록 했습니다.
  doctrine_reference: 유월절/무교절 규례
