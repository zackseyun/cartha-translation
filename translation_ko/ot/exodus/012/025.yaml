reference: Exodus 12:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהוָ֛ה לָ/כֶ֖ם כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר וּ/שְׁמַרְתֶּ֖ם אֶת הָ/עֲבֹדָ֥ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
  footnotes:
  - marker: a
    text: Or 'just as he said.' The Hebrew is literally 'just as he spoke,' with the sense of prior promise in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'this observance' or 'this rite.' The Hebrew term refers to the Passover ritual service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희가 야훼께서 너희에게 주실 그 땅에 들어가거든, 그가 말씀하신 그대로 이 예식을 지키십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 말씀하신 대로’. 히브리어는 문자적으로 ‘그가 말한 대로’이며, 문맥상 앞선 약속의 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 예식’이나 ‘이 의식’. 히브리어 용어는 유월절의 규정된 예식적 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי תָבֹאוּ
  english_pob_choice: And when you come
  chosen_korean: 그리고 너희가 …에 들어가거든
  alternatives_korean:
  - 그리고 너희가 …에 올 때
  - 그리고 너희가 …에 들어가게 되면
  lexicon: HALOT
  rationale: 예정된 상황을 여는 히브리어 관용구를 한국어의 조건·시점 표현으로 자연스럽게 옮겼습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 나라
  - 그 땅(땅)
  lexicon: HALOT
  rationale: 언약과 약속의 맥락에서 ‘땅’이 성경적 울림을 가장 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨 원문 고유명을 드러냈습니다.
- source_word: כַּאֲשֶׁר דִּבֵּר
  english_pob_choice: just as he promised
  chosen_korean: 그가 말씀하신 그대로
  alternatives_korean:
  - 그가 약속하신 그대로
  - 그가 말씀하신 대로
  lexicon: HALOT
  rationale: 직역하면 ‘그가 말한 대로’이지만, 문맥상 이전의 약속을 가리키므로 약속의 의미를 살리되 과도한 해석을 피했습니다.
- source_word: הָעֲבֹדָה הַזֹּאת
  english_pob_choice: this service
  chosen_korean: 이 예식
  alternatives_korean:
  - 이 섬김
  - 이 제의
  - 이 종교 행위
  lexicon: HALOT
  rationale: 유월절 문맥의 cultic service를 한국어 독자가 바로 이해할 수 있도록 ‘예식’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 언약의 신적 고유명을 직접 사용하므로, 일반 호칭인 ‘주’보다 고유명 ‘야훼’를 유지하는 것이 원문의 식별성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
