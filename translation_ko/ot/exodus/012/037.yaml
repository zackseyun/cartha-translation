revisions:
- from: 이스라엘 자손이 라암셋에서 숙곳으로 떠났습니다. 보행자만 약 육십만 명이었고, 어린아이들은 제외되었습니다.[a][b][c][d]
  to: 이스라엘 자손[a]이 라암셋에서 숙곳으로 떠났습니다[b]. 어린아이들[d] 외에, 걸어서 간 남자는 약 육십만 명[c]이었습니다.
  rationale: 원문의 성별 표지와 도보 이동의 뜻을 ‘걸어서 간 남자’로 보존하고, 어린아이들과의 관계는 원문의 לְבַד 구문에 맞춰 ‘어린아이들 외에’로 옮겼습니다. 각주 표지는 각각 해당 어구 뒤에 배치했으며, 지명과 집단 호칭은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:30Z'
