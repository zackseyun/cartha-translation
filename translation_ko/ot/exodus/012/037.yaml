base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads literally 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'set out.' The Hebrew verb can denote breaking camp and beginning a journey.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'about six hundred thousand men on foot' counts the men, with children excluded from this number.
    reason: cultural_note
  - marker: d
    text: Or 'besides little ones.' The Hebrew טף refers to children or small dependents.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 라암셋에서 숙곳으로 떠났습니다. 보행자만 약 육십만 명이었고, 어린아이들은 제외되었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’이라고 합니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사는 출발하여 길을 떠나는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘약 육십만 명의 보행자’는 남자 인원만을 셌고, 그 수에서 어린아이들은 제외됩니다.
    reason: cultural_note
  - marker: d
    text: 히브리어 טף는 어린아이들 또는 작은 부양가족을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: journeyed
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 길을 떠났습니다
  - 여행했습니다
  lexicon: HALOT
  rationale: נסע는 이동과 출발을 함께 포함할 수 있으므로, 문맥상 ‘떠났습니다’가 간결하게 출발의 의미를 살리면서도 자연스럽습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 친족적 표현 בני를 살리되, 한국어 성경에서 익숙하고 자연스러운 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  english_pob_choice: about six hundred thousand
  chosen_korean: 약 육십만
  alternatives_korean:
  - 대략 육십만
  - 약 60만
  lexicon: HALOT
  rationale: כ־가 수량의 대략성을 나타내므로 ‘약’으로 옮겼고, 정식 문체에 맞춰 한자 수사 ‘육십만’을 사용했습니다.
- source_word: לְבַד מִטָּף
  english_pob_choice: besides children
  chosen_korean: 어린아이들은 제외되었습니다
  alternatives_korean:
  - 어린아이들을 제외하고
  - 어린아이들 외에
  lexicon: HALOT
  rationale: טף는 어린아이들/작은 부양가족을 가리키므로, 인원 집계에서 제외된다는 점을 한국어로 명확히 드러냈습니다.
theological_decisions:
- issue: ‘sons of Israel’의 집단 호칭을 어떻게 살릴 것인가
  chosen_reading: 이스라엘 자손
  alternative_readings:
