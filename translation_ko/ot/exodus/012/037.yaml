  - 이스라엘의 아들들
  rationale: 본문의 가족-공동체적 호칭을 보존하는 것이 원문의 어조와 집합적 정체성을 더 잘 드러냅니다.
  doctrine_reference: 출애굽기 서술의 언약 백성 표지
