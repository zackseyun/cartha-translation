  source_fidelity: ‘보행자만’은 רַגְלִי הַגְּבָרִים의 ‘걸어서 간 남자들’을 부자연스럽고 다소 부정확하게 일반 보행자로 바꿉니다. 또한 לְבַד מִטָּף는 수동적으로 ‘제외되었다’고 단정하기보다 ‘어린아이들 외에’로 옮기는 것이 원문의 구문을 더 직접적으로 보존합니다.
  naturalness: ‘걸어서 간 남자’와 ‘어린아이들 외에’가 현대 표준 한국어 합쇼체에서 자연스럽고, 수가 무엇을 가리키는지도 명료합니다.
  terminology: ‘이스라엘 자손’, ‘라암셋’, ‘숙곳’은 적절합니다. ‘보행자’는 이 문맥에서 ‘걸어서 간 남자’로 고쳐야 합니다.
