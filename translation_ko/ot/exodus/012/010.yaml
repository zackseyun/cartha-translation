lexical_decisions:
- source_word: וְלֹא תוֹתִירוּ
  english_pob_choice: You shall not leave any of it
  chosen_korean: 아침까지는 그중 아무것도 남겨 두지 마십시오
  alternatives_korean:
  - 그것의 아무것도 남겨 두지 마십시오
  - 그중 어떤 것도 남겨 두지 마십시오
  lexicon: HALOT
  rationale: הותיר의 금지형은 ‘남겨 두다/남겨 놓다’의 뜻이므로, 현대 한국어에서는 자연스럽고 명령력을 살리는 ‘남겨 두지 마십시오’로 옮겼습니다. 부정어를 앞에 두어 금지의 강도를 분명히 했습니다.
- source_word: עַד בֹּקֶר
  english_pob_choice: until morning
  chosen_korean: 아침까지
  alternatives_korean:
  - 새벽까지
  - 아침이 올 때까지
  lexicon: HALOT
  rationale: 시간의 한계를 나타내는 표현이므로, 한국어에서는 가장 간결하고 자연스러운 ‘아침까지’를 사용했습니다.
- source_word: הַנֹּתָר
  english_pob_choice: what remains
  chosen_korean: 남은 것
  alternatives_korean:
  - 남은 부분
  - 남은 것들
  lexicon: HALOT
  rationale: 남아 있는 몫 전체를 가리키는 분사형이므로, 문맥상 ‘남은 것’이 가장 직접적이고 읽기 쉽습니다.
- source_word: בָּאֵשׁ תִּשְׂרֹפוּ
  english_pob_choice: you shall burn with fire
  chosen_korean: 불로 태우십시오
  alternatives_korean:
  - 불에 태우십시오
  - 불로 소각하십시오
  lexicon: HALOT
  rationale: 도구/수단을 나타내는 בְּ + אֵשׁ은 한국어에서 ‘불로’로 자연스럽게 옮길 수 있고, תשרפו는 단순히 ‘태우다’로 충분합니다. ‘소각하다’는 현대적이지만 본문보다 기술적입니다.
theological_decisions:
- issue: 유월절 고기 잔여분 처리 방식
  chosen_reading: 남기지 말고, 남은 것은 불로 태우라는 두 단계의 규정으로 유지했습니다.
  alternative_readings:
  - 단순한 실무 지침으로 완화하는 번역
  - 상징적 의미를 덧붙이는 번역
  rationale: 본문은 남겨 두는 행위를 금지하고, 남은 몫의 처리까지 별도로 명령합니다. 해석을 덧붙이지 않고 두 명령의 구별을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 의례 규정의 직접성 보존
