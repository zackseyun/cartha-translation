revisions:
- from: 야훼께서 이집트에 내리치려고 지나가실 때, 문설주 위와 두 문기둥 위에 있는 피를 보시면, 야훼께서 그 문을 지나가시고 파괴자가 여러분의 집에 들어와 내리치지 못하게 하실 것입니다.[a][b]
  to: 야훼께서 이집트를 치려고 지나가실 때, 문인방과 두 문설주에 바른 피를 보시면, 야훼께서 그 출입문을 지나쳐 가시고, 파괴자가 여러분의 집에 들어가 치지 못하게 하실 것입니다.[a][b]
  rationale: 문틀의 상단과 수직 부재를 각각 ‘문인방’과 ‘두 문설주’로 바로잡고, 피가 발라졌다는 앞 절들의 문맥을 반영했습니다. פסח는 ‘지나쳐 가시고’로 번역하여 ‘이집트를 지나가심’(עבר)과 구별하면서도, 본문이 보호를 설명하는 방식과 맞추었습니다. 파괴자의 정체는 본문과 각주 모두에서 확정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:29Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 야훼께서 이집트를 치시기 위해 지나가시고, 피를 보신 뒤 파괴자가 집에 들어와 치지 못하게 하신다는 핵심 구조를 대체로 충실히 보존합니다. 그러나 מַשְׁקוֹף는 수직 ‘문설주’가 아니라 문틀의 윗부분인 ‘문인방’이며, עַל הַפֶּתַח의 פסח를 ‘그 문을 지나가시고’로 옮기면 문을 통과해 들어가신다는 뜻으로 읽힐 수 있어 보호의 문맥과 어긋날 위험이 있습니다.
  naturalness: ‘문인방과 두 문설주에 바른 피’는 현대 한국어에서 구조와 적용 행위를 명료하게 드러냅니다. ‘그 출입문을 지나쳐 가시고’는 פסח의 공간적 이미지를 유지하면서도 해당 집에 들어가지 않으심을 자연스럽게 나타냅니다. ‘내리치다’보다 ‘치다’가 이 문맥에서 더 절제되고 자연스럽습니다.
  terminology: ‘야훼’는 원문의 신명 음역 방침과 일치합니다. הַמַּשְׁחִית는 정체를 확정하지 않는 ‘파괴자’로 유지합니다. פסח의 의미 범위(지나쳐 감/아낌/보호함)는 본문에서 한쪽으로 과도하게 확정하지 않고 각주에서 제시합니다.
  issues:
  - severity: medium
    issue: ‘문설주 위’가 מַשְׁקוֹף의 위치를 부정확하게 나타냄
    rationale: מַשְׁקוֹף는 문틀 상단의 가로 부재(문인방)이고, 이어지는 ‘두 문기둥’이 수직 부재인 מְזוּזוֹת입니다. ‘문설주 위와 두 문기둥 위’는 구조를 혼동시키며 ‘위에 있는 피’도 피가 단지 놓여 있는 듯 들립니다.
  - severity: medium
    issue: ‘그 문을 지나가시고’가 פסח의 문맥상 방향을 모호하게 함
    rationale: 한국어에서 ‘문을 지나가다’는 흔히 그 문을 통과하여 들어감을 뜻합니다. 여기서는 야훼께서 피 표시가 있는 출입구를 지나쳐 파괴자가 들어가지 못하게 하시는 흐름이므로, 통과 प्रवेश으로 오해되지 않는 표현이 필요합니다.
  - severity: low
    issue: 각주 a가 פסח의 주요 의미 대안을 충분히 제시하지 않음
    rationale: פסח는 ‘지나쳐 가다’ 외에 ‘아끼다’ 또는 ‘보호하다’로 이해될 여지가 있습니다. 본문은 서사적 연결을 위해 공간적 표현을 유지하되, 각주에서 대안을 밝혀 해석상의 개방성을 보존하는 것이 적절합니다.
