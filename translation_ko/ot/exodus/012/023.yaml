source:
  edition: WLC
  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
  footnotes:
  - marker: a
    text: Or 'will spare' or 'will protect' for 'will pass over'; the Hebrew verb is the one associated with Passover.
    reason: lexical_alternative
  - marker: b
    text: '''The destroyer'' is left unspecified in the Hebrew; some understand an angelic agent of judgment.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이집트를 치려고 지나가실 때, 문인방과 두 문설주에 바른 피를 보시면, 야훼께서 그 출입문을 지나쳐 가시고, 파괴자가 여러분의 집에 들어가 치지 못하게 하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지나쳐 가시고’로 옮긴 히브리어 פסח는 ‘아끼다’ 또는 ‘보호하다’로도 이해될 수 있습니다. 이 동사는 유월절의 이름과 관련됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘파괴자’는 히브리어가 그 정체를 밝히지 않는 표현입니다. 어떤 이들은 이를 심판을 수행하는 천사적 존재로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 제목어 ‘주님’으로 바꾸지 않고 음역해, POB의 स्रोत-직결 원칙을 한국어에서도 유지했습니다.
- source_word: וְעָבַר
  english_pob_choice: will pass through
  chosen_korean: 지나가실 때
  alternatives_korean:
  - 지나가며
  - 통과하실 때
  - 지나쳐 가실 때
  lexicon: HALOT
  rationale: 문맥상 이집트 전역을 ‘지나가며’ 심판하시는 흐름이므로, פסח과 구별되도록 ‘지나가실 때’로 옮겼습니다.
- source_word: וּפָסַח
  english_pob_choice: will pass over
  chosen_korean: 문을 지나가시고
  alternatives_korean:
  - 그 문을 넘어가시고
  - 그 문 위로 지나가시고
  - 그 문을 넘어가며
  lexicon: HALOT
  rationale: פסח의 핵심 이미지를 살리되, 한국어에서는 ‘유월하다’가 낯설 수 있어 문맥에 맞는 동작을 드러내는 방식으로 표현했습니다.
- source_word: הַמַּשְׁחִית
  english_pob_choice: the destroyer
  chosen_korean: 파괴자
  alternatives_korean:
  - 멸하는 자
  - 멸망시키는 자
  - 파멸의 자
  lexicon: HALOT
  rationale: 원문이 정체를 특정하지 않는 파괴 행위의 행위자이므로, 신학적 구체화를 덧붙이지 않고 자연스러운 현대어로 옮겼습니다.
- source_word: לִנְגֹּף
  english_pob_choice: to strike
  chosen_korean: 내리치다
  alternatives_korean:
  - 치다
  - 쳐서 벌하다
  - 타격하다
  lexicon: HALOT
  rationale: 죽음의 심판을 뜻하는 נגף의 강도를 살리기 위해, 단순한 ‘치다’보다 더 선명한 ‘내리치다’를 택했습니다.
theological_decisions:
- issue: פסח의 번역이 보호 의미를 드러낼지 여부
  chosen_reading: मुख세?
  alternative_readings:
  - ‘보호하다’로 풀어 쓰기
  - ‘살려주다’로 의역하기
  rationale: 본문은 보호의 효과를 이미 ‘파괴자가 들어오지 못하게 하실 것입니다’로 설명하므로, פסח 자체는 그 서사적·어휘적 연결을 유지하는 쪽이 더 적절합니다.
  doctrine_reference: 원문 어휘 보존과 문맥 내 의미의 분배
- issue: 파괴자의 정체를 명시할지 여부
  chosen_reading: ‘파괴자’로 남겨 두고 정체를 특정하지 않았습니다.
  alternative_readings:
  - ‘멸망시키는 천사’로 구체화하기
  - 야훼와 동일시하기
  rationale: 히브리어는 야훼와 הַמַּשְׁחִית를 구별하므로, 본문이 말하는 긴장을 한국어에서도 그대로 보존했습니다.
  doctrine_reference: 본문이 직접 말하는 범위 안에서만 확정
