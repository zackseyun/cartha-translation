  source_fidelity: 히브리어는 이집트인들이 이스라엘 백성에게 강한 압박을 가하여 그들을 그 땅에서 급히 내보내려 한 일을 말합니다. 초안의 큰 뜻은 맞지만, ‘죽은 목숨이다’는 מֵתִים의 절박한 상태를 한국어 관용으로 다소 확정적으로 해석하며, 원문의 ‘죽어 있는/죽게 된’ 표현의 긴장을 충분히 보존하지 못합니다.
  naturalness: ‘강하게 재촉하며 … 내보내려고 했습니다’는 연결이 다소 느슨합니다. ‘강하게 재촉하여 … 내보내려 했습니다’가 원문의 압박과 목적 관계를 더 자연스럽고 분명하게 드러냅니다. 인용문은 현대 합쇼체에 맞추어 ‘죽게 되었습니다’로 고칩니다.
