base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
  footnotes:
  - marker: a
    text: Or “to hurry to send them out of the land.” The Hebrew uses two infinitives in sequence to express urgent haste.
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트 사람들이 그 백성을 강하게 재촉하여[a] 그들을 그 땅에서 서둘러 내보내려 했습니다. 그들이 “우리는 모두 죽게 되었습니다”라고 말했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 ‘서두르다’와 ‘내보내다’라는 두 부정사가 연속되어, 그들을 급히 내보내려는 절박함을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: וַתֶּחֱזַק
  english_pob_choice: urged ... on
  chosen_korean: 강하게 재촉하며
  alternatives_korean:
  - 독촉하며
  - 간청하며
  - 강권하며
  lexicon: HALOT
  rationale: חזק가 כאן에서 ‘힘을 가해 압박하다/재촉하다’의 뜻이므로, 단순한 ‘재촉하다’보다 강도를 드러내는 ‘강하게 재촉하며’로 옮겼습니다.
- source_word: מִצְרַיִם
  english_pob_choice: the Egyptians
  chosen_korean: 이집트 사람들이
  alternatives_korean:
  - 이집트인들이
  - 애굽 사람들이
  - 이집트
  lexicon: HALOT
  rationale: 문맥상 집단 전체를 가리키므로 나라 이름보다 사람 주어로 풀어, 공동체가 압박 주체였음을 분명하게 했습니다.
- source_word: לְמַהֵר לְשַׁלְּחָם
  english_pob_choice: hurrying to send them out
  chosen_korean: 서둘러 내보내려고 했습니다
  alternatives_korean:
  - 급히 내보내려고 했습니다
  - 서둘러 보내려고 했습니다
  - 급히 떠나보내려고 했습니다
  lexicon: HALOT
  rationale: 히브리어의 연속 부정사가 급박한 추진을 나타내므로, 목적과 속도를 함께 담는 자연스러운 한국어로 처리했습니다.
- source_word: מֵתִים
  english_pob_choice: dead men
  chosen_korean: 죽은 목숨이다
  alternatives_korean:
  - 우리는 모두 죽어 가고 있다
  - 우리는 모두 죽은 사람이다
  - 우리는 모두 죽을 지경이다
  lexicon: HALOT
  rationale: 직역적인 ‘죽은 사람들’보다 관용적으로 위태로운 절박함을 드러내는 한국어 관용을 택하되, 이미 죽음의 재앙 아래 놓였다는 긴박감을 유지했습니다.
theological_decisions:
- issue: 이집트인들의 말 인용에서 절박한 자포자기 표현의 강도
  chosen_reading: “우리는 모두 죽은 목숨이다”로 옮겨, 단순한 공포보다 심판 직후의 절망적 인식을 드러냈습니다.
  alternative_readings:
  - “우리는 모두 죽어 가고 있다”
  - “우리는 모두 죽은 사람이다”
  rationale: 히브리어 מֵתִים은 현재 진행형보다 위기 속에서 죽음에 붙들린 상태를 가리키는 듯하므로, 독자가 본문 의도를 즉시 느끼도록 관용적 표현을 사용했습니다.
  doctrine_reference: 출애굽기 12장의 심판 서술과 유월절 후 이집트의 절박한 반응
