  text: וַ/יֵּלְכ֥וּ וַ/יַּֽעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “the Israelites.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘의 아들들이 가서 그대로 행했습니다. 야훼께서 모세와 아론에게 명령하신 그대로 그들이 행한 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게는 ‘이스라엘 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현인 ‘sons of Israel’을 살리되, 한국어에서는 자연스럽고 투명한 소유격 구조로 옮겼습니다. 영어 주해의 성별-정확성 원칙도 반영했습니다.
- source_word: וַיֵּלְכ֥וּ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 가고
  - 떠나
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 wayyiqtol을 한국어 연결 동사 ‘가서’로 옮겨, 뒤의 실행 동작과 긴밀하게 연결했습니다.
- source_word: וַיַּעֲשׂ֖וּ
  english_pob_choice: did so
  chosen_korean: 그대로 행했습니다
  alternatives_korean:
  - 그렇게 했습니다
  - 행했습니다
  lexicon: HALOT
  rationale: 단순히 ‘했다’보다, 앞선 명령과의 일치성을 드러내는 ‘그대로’로 영어의 ‘did so’가 가진 되받아보기 기능을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사표기 יְהוָה를 관습적 대체어가 아니라 고유명으로 드러내기 위해 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 명령-순종의 정확한 대응을 어떻게 드러낼지
  chosen_reading: ‘야훼께서 모세와 아론에게 명령하신 그대로 그들이 행한 것입니다’로 명시해, 본문의 완전한 일치성을 분명히 했습니다.
  alternative_readings:
  - ‘명령하신 대로’
  - ‘명령하신 그대로 했습니다’
  rationale: כַּאֲשֶׁר ... כֵּן의 대응 구조는 단순한 순종을 넘어 정확한 일치를 강조하므로, 한국어에서도 그 대응을 분명히 드러내는 것이 본문의 힘을 보존합니다.
  doctrine_reference: '출 12:28의 서술 의도: 야훼의 명령에 대한 이스라엘의 정확한 순종'
