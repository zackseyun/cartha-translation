translation:
  language: ko
  text: 그러자 이스라엘의 아들들[a]이 가서 행했습니다. 야훼께서 모세와 아론에게 명령하신 대로 그들은 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게는 ‘이스라엘 사람들’입니다.
