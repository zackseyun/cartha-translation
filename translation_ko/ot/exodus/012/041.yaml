translation:
  language: ko
  text: 그리고 사백삼십 년이 끝나는 그날, 야훼의 모든 군대가 이집트 땅에서 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 군대들’. 히브리어 용어는 조직된 부대나 군대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리하여
  lexicon: WLC
  rationale: 서술 연결을 자연스럽게 살리면서도 히브리어 내러티브의 진행 감각을 유지하기 위해 문두 연결사로 옮겼습니다.
- source_word: מִקֵּץ שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאֹת שָׁנָה
  english_pob_choice: at the end of four hundred and thirty years
  chosen_korean: 사백삼십 년이 끝나는
  alternatives_korean:
  - 사백삼십 년 끝에
  - 사백삼십 년의 끝에
  lexicon: HALOT
  rationale: 기간의 완료 시점을 나타내는 표현이므로, ‘끝나는’으로 현재적 종결감을 살리되 한국어 문장 흐름에 맞췄습니다.
- source_word: צִבְאֹת
  english_pob_choice: hosts
  chosen_korean: 군대
  alternatives_korean:
  - 군대들
  - 부대들
  - 하늘 군대
  lexicon: HALOT
  rationale: צָבָא의 조직된 집단/군사 집합의 의미를 살리되, 이 절의 출애굽 행렬을 한국어로 즉각 이해하기 쉬운 ‘군대’로 옮겼습니다. 영어 POB의 각주가 지적하듯 ‘organized companies or armies’의 뉘앙스를 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 고유 신명인 יְהוָה는 대체 칭호가 아니라 음역으로 처리해, 본문이 드러내는 언약 이름을 보존했습니다.
- source_word: מֵאֶרֶץ מִצְרָיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 이집트 땅으로부터
  lexicon: HALOT
  rationale: אֶרֶץ가 명시되므로 ‘땅’을 살렸고, 현대 표준어에서 자연스러운 국가명 표기를 사용했습니다.
theological_decisions:
- issue: צִבְאֹת יְהוָה의 의미
  chosen_reading: ‘야훼의 모든 군대’로 옮겨, 조직된 출애굽 공동체의 집합성과 군사적 질서를 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼의 모든 군중’
  - ‘야훼의 모든 군대들’
  rationale: 본문은 단순한 인구 집합이 아니라 질서 있게 편성된 집단의 출발을 강조하므로, 전통적 완곡어인 ‘백성’보다 원문상 이미지가 강한 표현을 택했습니다.
  doctrine_reference: EXO 12:41 textual sense of צבא / POB lexical note
