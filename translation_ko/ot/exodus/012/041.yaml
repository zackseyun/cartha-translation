  source_fidelity: ‘사백삼십 년이 끝나는 그날’은 완료된 기간의 종결 시점을 서술하는 מִקֵּץ의 과거 서사 문맥을 충분히 드러내지 못합니다. ‘사백삼십 년이 끝나던 바로 그날’은 기간의 완료와 בְּעֶצֶם הַיּוֹם הַזֶּה의 강조를 정확히 반영합니다. צִבְאוֹת는 복수형이며, 출애굽 공동체의 질서 있는 편성을 가리키므로 ‘모든 부대’가 한국어에서 ‘모든 군대’보다 수적·집합적 의미를 더 자연스럽게 전달합니다.
  naturalness: ‘그리고’로 시작하는 것은 원문의 서사 연결을 살릴 수 있으나, 뒤의 시간 표현은 ‘끝나던 바로 그날’이 현대 표준 한국어의 과거 서사에 더 자연스럽습니다. ‘이집트 땅에서 나왔습니다’도 자연스럽고, 합쇼체 문체에 맞습니다.
  terminology: יַהְוֶה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. צִבְאוֹת는 본문에서 ‘부대’로 옮기고, 각주에서 ‘군대’라는 가능성을 제시하여 군사적·조직적 뉘앙스를 보존합니다.
