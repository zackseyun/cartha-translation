source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
  footnotes:
  - marker: a
    text: Or 'the houses of the Israelites' / 'the houses of the children of Israel.'
    reason: lexical_alternative
  - marker: b
    text: The verb behind 'passed over' is the same root from which 'Passover' is derived; it can also carry the sense of sparing or protecting.
    reason: lexical_alternative
  - marker: c
    text: Or 'delivered our houses' / 'rescued our houses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 이렇게 말해야 합니다. 「이것은 야훼께 드리는 유월절 제사입니다. 그분은 이집트에서 야훼께서 이집트에 재앙을 내리실 때 이스라엘 자손의 집들을 지나치셨고, 우리의 집들을 구해 주셨습니다.」 그러자 백성은 머리를 숙이고 경배했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들의 집들’ / ‘이스라엘 자손의 집들’.
    reason: lexical_alternative
  - marker: b
    text: ‘지나치셨다’에 해당하는 동사는 ‘유월절’의 어근과 같은 말뿌리입니다. 또한 ‘보호하다’ 또는 ‘지키다’의 뜻을 담을 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리의 집들을 건져 주셨습니다’ / ‘우리의 집들을 구출하셨습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  english_pob_choice: the Passover sacrifice
  chosen_korean: 유월절 제사
  alternatives_korean:
  - 유월절 희생제물
  - 유월절 희생
  lexicon: HALOT
  rationale: 제의적 의미를 살리면서도 한국어 성경 문체에서 자연스러운 표현으로 옮겼습니다. פֶּסַח의 절기·제사 결합을 지나치게 풀지 않고 유지했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 이름 המיוחד은 프로젝트 기본값에 따라 야훼로 옮겼습니다. 제사 언어에서 ל의 헌정·귀속 의미를 반영해 -께를 사용했습니다.
- source_word: פָּסַח
  english_pob_choice: passed over
  chosen_korean: 지나치셨고
  alternatives_korean:
  - 지나가셨고
  - 넘어가셨고
  - 보호하셨고
  lexicon: HALOT
  rationale: פֶּסַח와 같은 어근을 유지하면서도 한국어에서 자연스러운 동작상을 살렸습니다. 단순한 회피보다 문맥상 집들을 해치지 않고 지나가신 행위를 드러냅니다.
- source_word: הִצִּיל
  english_pob_choice: delivered our houses
  chosen_korean: 우리의 집들을 구해 주셨습니다
  alternatives_korean:
  - 우리의 집들을 건져 주셨습니다
  - 우리 집들을 구원하셨습니다
  lexicon: HALOT
  rationale: 직전의 '지나치심'과 대조되는 보호·구출의 결과를 살려 '구해 주셨습니다'로 옮겼습니다. '구원하셨습니다'는 신학적 색채가 더 강해 여기서는 다소 좁히지 않았습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 언약 이름을 가려서 번역하지 않고, 본문이 직접 드러내는 고유한 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: וַיִּקֹּד וַיִּשְׁתַּחֲווּ의 이중 반응
  chosen_reading: 머리를 숙이고 경배했습니다
  alternative_readings:
  - 엎드려 절했습니다
  - 무릎을 꿇고 경배했습니다
  rationale: 첫 동사는 신체적 낮춤, 둘째 동사는 예배 행위를 나타내므로 둘을 구분해 번역했습니다. 중복을 피하면서도 동작의 단계성을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
