revisions:
- from: 그 피는 여러분이 있는 집들 위에 있는 표가 될 것입니다. 내가 그 피를 볼 때에, 내가 여러분을 지나칠 것이며, 내가 이집트 땅을 칠 때에 여러분 가운데에는 해치는 재앙이 없을 것입니다.[a][b]
  to: 그 피는 여러분이 있는 집들 위에서 여러분을 위한 표가 될 것입니다. 내가 그 피를 볼 때에, 내가 여러분을 지나칠 것입니다[a]. 내가 이집트 땅을 칠 때에 여러분 가운데에는 멸망시키는 재앙이 없을 것입니다[b].
  rationale: 첫 절을 ‘집들 위에서 여러분을 위한 표’로 고쳐 장소와 수혜자를 모두 보존했습니다. פסח의 본문 번역은 전통적·어휘적 연결을 유지하는 ‘지나칠 것입니다’로 두되, 각주의 부정확한 ‘용서’는 ‘아끼다’로 바로잡았습니다. לְמַשְׁחִית는 본문에서 별도의 인격적 행위자를 단정하지 않는 ‘멸망시키는 재앙’으로 옮겼고, 명사적 대안 독법은 각주에만 보존했습니다. 표지는 각 해당 표현 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:30Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘여러분을 지나칠 것입니다’는 וּפָסַחְתִּי עֲלֵכֶם의 핵심 어휘를 비교적 잘 보존합니다. 그러나 첫 절은 לָכֶם(‘여러분을 위한’)을 명시해야 하며, לְמַשְׁחִית의 대안 독법 주석은 원문의 가능한 명사적 이해를 정확히 반영하도록 고쳐야 합니다.
  naturalness: 합쇼체와 전반적 문장은 자연스럽습니다. 다만 ‘여러분이 있는 집들 위에 있는 표’는 수식이 겹치고 ‘여러분을 위한’이라는 기능이 빠져 있습니다. ‘집들 위에서 여러분을 위한 표’가 더 자연스럽고 정확합니다. ‘해치는 재앙’도 가능하나 ‘멸망시키는 재앙’이 목적·결과의 의미를 더 분명하게 드러냅니다.
  terminology: ‘피’, ‘표’, ‘재앙’, ‘이집트 땅’은 적절합니다. פסח에 대한 대안은 ‘용서하다’가 아니라 ‘아끼다/보호하다’여야 합니다. 또한 현행 b 주석의 ‘파괴자가 되기 위한 재앙’은 한국어 의미와 명사적 독법 모두에 맞지 않습니다.
  issues:
  - severity: medium
    issue: 첫 절에 לָכֶם의 의미가 빠져 있습니다.
    rationale: ‘여러분이 있는 집들 위에 있는 표’는 표가 놓인 장소는 나타내지만, 피가 ‘여러분을 위한’ 표라는 원문의 수혜·관련 의미를 명시하지 않습니다.
  - severity: high
    issue: 각주 a가 ‘용서할 것이다’라고 하여 영어 POB 및 원문의 가능한 의미 범위를 벗어납니다.
    rationale: פסח의 이 문맥상 대안은 ‘아끼다/면하다’ 또는 ‘보호하다’이지, 죄 사함을 뜻하는 ‘용서하다’가 아닙니다.
  - severity: high
    issue: 각주 b의 ‘파괴자가 되기 위한 재앙’은 잘못된 표현이며 명사적 대안 독법을 전달하지 못합니다.
    rationale: 대안은 לְמַשְׁחִית를 ‘파괴자’라는 명사로 읽는 경우를 밝혀야 합니다. 현행 표현은 재앙이 파괴자가 되도록 한다는 뜻이 되어 원문 및 영어 감사 기록과 맞지 않습니다.
  - severity: medium
    issue: 각주 표지의 위치가 해당 어휘와 연결되어 있지 않습니다.
    rationale: a는 ‘지나칠 것입니다’ 뒤에, b는 ‘멸망시키는 재앙’ 뒤에 두어 각각 פסח과 לְמַשְׁחִית에 명확히 연결하는 것이 필요합니다.
