base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
  footnotes:
  - marker: a
    text: Or, 'I will spare you' or 'I will protect you.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'and no plague will be among you for the destroyer,' taking 'destroyer' as a substantive.
    reason: alternative_reading
translation:
  language: ko
  text: 그 피는 여러분이 있는 집들 위에서 여러분을 위한 표가 될 것입니다. 내가 그 피를 볼 때에, 내가 여러분을 지나칠 것입니다[a]. 내가 이집트 땅을 칠 때에 여러분 가운데에는 멸망시키는 재앙이 없을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 여러분을 아낄 것이다’ 또는 ‘내가 여러분을 보호할 것이다’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분 가운데에는 파괴자를 위한 재앙이 없을 것이다’라고도 번역할 수 있다. 이는 ‘파괴자’를 명사로 이해하는 독법이다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  english_pob_choice: shall be
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 입니다
  - 있을 것입니다
  lexicon: HALOT
  rationale: 예고된 결과를 나타내는 העתיד적 용법으로 읽어, 단순 현재보다 자연스러운 미래/결과 표현인 ‘될 것입니다’를 택했습니다.
- source_word: לָכֶם לְאֹת
  english_pob_choice: for you / a sign
  chosen_korean: 여러분이 있는 집들 위에 있는 표
  alternatives_korean:
  - 여러분을 위한 표
  - 여러분에게 주는 표
  lexicon: HALOT
  rationale: לְאֹת은 단순히 ‘표’가 아니라 표지 기능을 하므로 ‘표’로 옮기되, המיקום을 드러내기 위해 ‘집들 위에 있는’으로 풀어 주었습니다.
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  english_pob_choice: I will pass over you
  chosen_korean: 여러분을 지나칠 것이며
  alternatives_korean:
  - 여러분을 넘어갈 것이며
  - 여러분을 보호할 것이며
  lexicon: HALOT
  rationale: פסח의 핵심 이미지를 살리면서도 한국어에서 ‘유월하다’보다 의미가 직접 드러나는 ‘지나칠’로 옮겼습니다. 전통적 해석인 ‘보호하다/넘어가다’의 함의는 주석 없이 본문에 과잉 반영하지 않았습니다.
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף לְמַשְׁחִית
  english_pob_choice: and no plague will be among you to destroy
  chosen_korean: 여러분 가운데에는 해치는 재앙이 없을 것입니다
  alternatives_korean:
  - 여러분 가운데에는 파괴를 위한 재앙이 없을 것입니다
  - 여러분에게는 멸망시키는 재앙이 없을 것입니다
  lexicon: HALOT
  rationale: לְמַשְׁחִית를 별도의 ‘파괴자’로 인격화하지 않고, POB의 재조정 취지에 따라 재앙의 기능을 나타내는 형용적 표현 ‘해치는’으로 옮겼습니다.
theological_decisions:
- issue: וּפָסַחְתִּי의 의미를 ‘넘다/지나가다’로 둘지, ‘보호하다/용서하다’로 둘지
  chosen_reading: ‘여러분을 지나칠 것이며’로 본문에 두고, 보호의 함의는 직접 번역으로 과도하게 확정하지 않았습니다.
  alternative_readings:
  - 여러분을 보호할 것입니다
  - 여러분을 건너뛸 것입니다
  rationale: 유월절 이름과 연결되는 핵심 동사를 보존하면서도, 본문만으로 ‘보호’의 신학적 결과를 완전히 정의하지 않도록 했습니다.
  doctrine_reference: 본문의 어휘적 긴장을 유지하고 해석을 앞서지 않음
- issue: לְמַשְׁחִית를 개인적 ‘파괴자’로 볼지, 목적/결과를 나타내는 표현으로 볼지
  chosen_reading: 개인적 존재를 세우지 않고 ‘해치는 재앙’으로 옮겼습니다.
  alternative_readings:
  - 파괴자를 위한 재앙
  - 파괴하는 자
  rationale: 히브리어 구문이 반드시 인격적 존재를 요구하지 않으므로, 텍스트가 말하는 파괴의 결과를 번역에 반영하되 존재론적 결론은 유보했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘는 인격화는 피함
