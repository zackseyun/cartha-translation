id: EXO.12.44
reference: Exodus 12:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל עֶ֥בֶד אִ֖ישׁ מִקְנַת כָּ֑סֶף וּ/מַלְתָּ֣ה אֹת֔/וֹ אָ֖ז יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's slave[a], bought with silver—when you have circumcised him[b], then he may eat of it.
  footnotes:
  - marker: a
    text: Or 'every slave of a man, purchased with money.'
    reason: lexical_alternative
  - marker: b
    text: That is, he may participate in the Passover meal only after circumcision.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 어떤 사람이 돈을 주고 산 모든 노예는, 그에게 할례를 행한 뒤에야[a] 유월절 음식을 먹을 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 할례를 받은 뒤에야 유월절 식사에 참여할 수 있다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  english_pob_choice: But every
  chosen_korean: 그러나 어떤 …라도
  alternatives_korean:
  - 그리고 모든 …은
  - 또 모든 …은
  lexicon: HALOT
  rationale: 앞절의 제외 규정과 대비되는 연결을 살리면서, 한국어에서는 법문체에 자연스러운 ‘그러나 …라도’로 분명한 예외/허용 조건을 드러냈습니다.
- source_word: עֶבֶד
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종복
  lexicon: HALOT
  rationale: 이 구절은 구매된 소유 관계를 말하지만, 한국어 성경 문맥에서 ‘노예’는 지나치게 현대적·강한 뉘앙스를 만들 수 있어, 본문 현실은 주석으로 유지하고 본문은 ‘종’으로 옮겼습니다.
- source_word: מִקְנַת כָּסֶף
  english_pob_choice: one bought with silver
  chosen_korean: 돈 주고 산 자
  alternatives_korean:
  - 은으로 산 자
  - 은으로 매입된 자
  lexicon: HALOT
  rationale: 히브리어의 ‘은/돈으로 산’ 소유·구매 관용구를 한국어에서 가장 직접적으로 전달하는 표현을 택했습니다. ‘돈 주고 산 자’가 법적 소유 관계를 분명히 드러냅니다.
- source_word: וּ/מַלְתָּה אֹתוֹ
  english_pob_choice: when you have circumcised him
  chosen_korean: 그를 할례한 뒤에야
  alternatives_korean:
  - 그를 할례하면
  - 그에게 할례를 한 뒤에
  lexicon: HALOT
  rationale: 행위가 식사 허용의 전제 조건이므로, 단순한 순차보다 조건성을 드러내는 ‘-한 뒤에야’로 옮겼습니다.
- source_word: יֹאכַל בּוֹ
  english_pob_choice: he may eat of it
  chosen_korean: 그것을 먹을 수 있습니다
  alternatives_korean:
  - 그것을 먹어도 됩니다
  - 그것을 먹을 수 있게 됩니다
  lexicon: HALOT
  rationale: 여기서 핵심은 허용 여부이므로 ‘먹을 수 있습니다’로 옮겼습니다. ‘of it’은 한국어에서 자연스러운 목적격으로 처리했습니다.
theological_decisions:
- issue: 본문이 허용하는 유월절 참여의 조건성
  chosen_reading: 할례가 유월절 식사의 전제 조건임을 본문에 직접 반영했습니다.
  alternative_readings:
  - 단순한 시간적 순서로만 이해함
  - 주석으로만 처리함
  rationale: 히브리어 문맥과 영어 POB의 문화적 주석이 모두 ‘할례 후에만 먹을 수 있음’을 가리키므로, 본문에서 조건성을 분명히 드러내는 것이 해석을 가장 잘 보존합니다.
  doctrine_reference: 출애굽기 12장 유월절 규례; 본문 내 절차적 조건성
