  text: דַּבְּר֗וּ אֶֽל כָּל עֲדַ֤ת יִשְׂרָאֵל֙ לֵ/אמֹ֔ר בֶּ/עָשֹׂ֖ר לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/יִקְח֣וּ לָ/הֶ֗ם אִ֛ישׁ שֶׂ֥ה לְ/בֵית אָבֹ֖ת שֶׂ֥ה לַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
  footnotes:
  - marker: a
    text: Hebrew שֶׂה can refer more broadly to a young member of the flock, whether a sheep or a goat; here it is rendered 'lamb' because of the Passover context and established English usage.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 온 회중에게 이렇게 말씀하십시오. “이달 열째 날에 각 사람은 자기 조상 가문에 따라, 곧 각 가정을 위하여 어린 양 한 마리를 취해야 합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 양 또는 염소와 같은 작은 가축을 더 넓게 가리킬 수 있으나, 유월절 문맥과 관용적인 한국어 용례에 따라 ‘어린 양’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  english_pob_choice: Speak
  chosen_korean: 말하여 이르십시오
  alternatives_korean:
  - 말하십시오
  - 전하십시오
  lexicon: HALOT
  rationale: 복수 명령의 직접성을 살리면서, 뒤따르는 לֵאמֹר을 자연스럽게 받는 공손한 명령형으로 옮겼습니다.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  english_pob_choice: all the congregation of Israel
  chosen_korean: 이스라엘의 온 회중
  alternatives_korean:
  - 이스라엘의 모든 회중
  - 이스라엘의 온 공동체
  lexicon: HALOT
  rationale: עֲדָה의 집합적·예배적 뉘앙스를 살려 ‘회중’으로 옮기고, ‘온’으로 전체성을 분명히 했습니다.
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  english_pob_choice: On the tenth day of this month
  chosen_korean: 이달의 열째 날
  alternatives_korean:
  - 이달의 열째 날에
  - 이 달의 십일째 날
  lexicon: HALOT
  rationale: 히브리어의 날짜 표현을 한국어의 자연스러운 어순으로 옮기되, 달력적 의미가 분명하도록 ‘날’을 보충했습니다.
- source_word: שֶׂה
  english_pob_choice: a lamb
  chosen_korean: 어린 양
  alternatives_korean:
  - 양
  - 염소 새끼
  lexicon: HALOT
  rationale: פסח 문맥에서 POB의 ‘lamb’에 대응하는 한국어로는 ‘어린 양’이 가장 자연스럽고, 본문의 제의적 이미지를 잘 드러냅니다.
- source_word: לְבֵית אָבֹת
  english_pob_choice: according to his fathers’ house
  chosen_korean: 자기 조상들의 가문에 따라
  alternatives_korean:
  - 자기 아버지들의 집에 따라
  - 자기 조상 가문에 따라
  lexicon: HALOT
  rationale: בֵּית אָבֹת의 족장적·가계적 구조를 살리기 위해 단순한 ‘가정’보다 ‘가문’이 더 정확합니다.
- source_word: שֶׂה לַבָּיִת
  english_pob_choice: a lamb for the household
  chosen_korean: 각 가정에 한 마리씩
  alternatives_korean:
  - 가정을 위하여 어린 양 하나를
  - 집마다 어린 양 하나를
  lexicon: HALOT
  rationale: בַּיִת의 사회적 단위 의미를 한국어로는 ‘가정’이 가장 자연스럽게 전달하므로, 분배의 단위성을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 분배 단위와 수량의 강조
  chosen_reading: 각 사람은... 어린 양 하나를... 각 가정에 한 마리씩
  alternative_readings:
  - 각 사람은... 어린 양 하나를... 집을 위하여
  - 각자... 한 마리
  rationale: 본문의 지시가 개인 책임과 가정 단위를 함께 요구하므로, ‘각 사람’과 ‘각 가정에 한 마리씩’으로 둘 다 드러냈습니다.
  doctrine_reference: 출애굽기 12장 유월절 규례
- issue: 직접 명령의 공손한 전달
  chosen_reading: 말하여 이르십시오
  alternative_readings:
  - 말하시오
  - 말하라
  rationale: 서술자는 모세에게 전달되는 명령을 현대 한국어 합쇼체로 옮기되, 본문의 명령적 성격은 약화하지 않았습니다.
  doctrine_reference: 출애굽기 12장 규례 전달 방식
