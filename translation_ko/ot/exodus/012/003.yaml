  source_fidelity: 본문의 날짜, 회중, 개인적 의무, 가문/가정 단위, 그리고 שֶׂה의 번역은 대체로 잘 반영합니다. 다만 ‘각 가정에 한 마리씩’은 히브리어의 ‘한 가정을 위하여 한 마리’라는 구조를 자연스럽게 풀어낸 것이지만, 앞의 ‘자기 조상들의 가문에 따라’와의 관계가 다소 불분명합니다. לְבֵית אָבֹת는 단순히 여러 ‘조상들’의 가문이라기보다 부계 가족 단위인 ‘아버지의 집안/조상 가문’을 가리킵니다.
  naturalness: 합쇼체 명령문은 적절합니다. 그러나 ‘말하여 이르십시오’는 현대 한국어에서 다소 중복적으로 들리므로 ‘이렇게 말씀하십시오’가 더 자연스럽습니다. ‘어린 양 하나를, 각 가정에 한 마리씩’도 목적어의 병렬 관계가 매끄럽지 않아 다듬는 것이 좋습니다.
  terminology: ‘회중’, ‘어린 양’, ‘가정’은 문맥에 적절합니다. ‘조상들의 가문’은 원문의 사회적 단위인 בֵּית אָבוֹת를 충분히 정확하고 자연스럽게 나타내지 못하므로 ‘조상 가문’으로 조정합니다. שֶׂה의 더 넓은 의미를 밝히는 각주는 유지하되, ‘새끼’로 한정하지 않도록 표현을 바로잡습니다.
