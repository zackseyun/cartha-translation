  lexicon: HALOT
  rationale: ‘불로/불에 구운’이라는 조리 방식과 불의 명시를 살리되, 현대 한국어에서 매끄럽게 읽히도록 명사구로 처리했습니다.
- source_word: וּמַצּוֹת
