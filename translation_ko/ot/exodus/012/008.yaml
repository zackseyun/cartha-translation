base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/008.yaml
  text: They shall eat the meat that night[a], roasted over the fire[b]; with unleavened bread and bitter herbs they shall eat it.
  footnotes:
  - marker: a
    text: Or 'on this night.' The Hebrew phrase is literally 'in/on this night,' but the sense in English is the specific night of the Passover meal.
    reason: lexical_alternative
  - marker: b
    text: Literally 'roasted of fire' or 'roasted with fire,' emphasizing that it must be cooked by roasting rather than by another method.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 밤에 그 고기를 불에 구운 것과 함께 무교병과 쓴 나물로 먹어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이 밤에/이 밤 동안에’에 가깝습니다. 한국어에서는 특정한 유월절 식사의 밤을 가리키므로 ‘그 밤에’로 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 직역은 ‘불의 구이’ 또는 ‘불로 구운 것’에 가깝습니다. 핵심은 다른 조리법이 아니라 반드시 굽는 방식이어야 한다는 점입니다.
    reason: lexical_alternative
lexical_decisions:
