id: EXO.12.19
reference: Exodus 12:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
  footnotes:
  - marker: a
    text: Or 'that soul shall be cut off.' The Hebrew idiom may refer to expulsion, death, or divine judgment depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'resident foreigner' for 'sojourner.'
    reason: lexical_alternative
  - marker: c
    text: Or 'assembly' or 'community' for 'congregation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이레 동안 너희 집 안에는 누룩이 있어서는 안 됩니다[a]. 누구든지 누룩 든 것을 먹는 자는[b] 이스라엘 회중에서 끊어질 것입니다[c]. 그것이 거류민이든 그 땅의 본토인이든 마찬가지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 집들’로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘누룩 든 것을 먹는 자는’으로 직역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘회중’이나 ‘공동체’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: For seven days
  chosen_korean: 이레 동안
  alternatives_korean:
  - 일곱 날 동안
  - 7일 동안
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 표현이므로 자연스러운 현대 한국어인 ‘이레 동안’으로 옮겨 원문의 기간 강조를 살렸습니다.
- source_word: שְׂאֹר
  english_pob_choice: leaven
  chosen_korean: 누룩
  alternatives_korean:
  - 발효종
  - 이스트
  lexicon: HALOT
  rationale: 제의적 문맥의 표준 번역어로 ‘누룩’이 가장 직접적이며, 일반 음식 재료보다 규례상의 금지 대상을 분명히 드러냅니다.
- source_word: לֹא יִמָּצֵא בְּבָתֵּיכֶם
  english_pob_choice: is to be found in your houses
  chosen_korean: 너희 집 안에는 있어서는 안 됩니다
  alternatives_korean:
  - 너희 집에서 발견되어서는 안 됩니다
  - 너희 집 안에 있지 않아야 합니다
  lexicon: HALOT
  rationale: 직역의 수동태를 한국어 법문체로 자연화하면서도, 단순 발견 여부가 아니라 ‘존재해서는 안 됨’이라는 금지 상태를 살렸습니다.
- source_word: מַחְמֶצֶת
  english_pob_choice: anything leavened
  chosen_korean: 누룩 든 것
  alternatives_korean:
  - 발효된 것
  - 누룩이 섞인 것
  lexicon: HALOT
  rationale: 누룩이 들어가 제의적으로 금지된 대상을 포괄적으로 나타내므로, 영어 POB의 범위를 따라 ‘누룩 든 것’으로 옮겼습니다.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעֲדַת יִשְׂרָאֵל
  english_pob_choice: that person shall be cut off from the congregation of Israel
  chosen_korean: 이스라엘 회중에서 끊어질 것입니다
  alternatives_korean:
  - 이스라엘 회중에서 끊어질 것입니다
  - 이스라엘 공동체에서 끊어질 것입니다
  - 이스라엘 회중에서 제거될 것입니다
  lexicon: HALOT
  rationale: ‘נפש’는 여기서 영혼보다 인격체를 가리키므로 ‘그 사람’의 의미를 문맥상 생략 가능하되, 형벌 관용구 ‘끊어지다’를 유지해 법적·언약적 무게를 보존했습니다.
- source_word: בַּגֵּר וּבְאֶזְרַח הָאָרֶץ
  english_pob_choice: whether a sojourner or a native of the land
  chosen_korean: 그것이 거류민이든 그 땅의 본토인이든 마찬가지입니다
  alternatives_korean:
  - 거류민이든 그 땅의 본토인이든
  - 나그네이든 그 땅의 토박이이든
  lexicon: HALOT
  rationale: ‘גֵּר’는 단순한 여행자가 아니라 이스라엘 가운데 사는 비토착인을 뜻하므로 ‘거류민’으로, 대구를 이루는 ‘본토인’은 그 땅의 토박이를 뜻하는 대비어로 옮겼습니다.
theological_decisions:
- issue: ‘끊어짐’ 형벌의 정확한 성격
  chosen_reading: ‘끊어질 것입니다’로 관용구를 유지하고, 죽음·추방·신적 심판 중 어느 하나로 단정하지 않았습니다.
  alternative_readings:
  - 죽임을 당할 것입니다
  - 공동체에서 제외될 것입니다
  rationale: 히브리어 관용구의 언약적 제재는 분명하지만 집행 방식은 본문만으로 확정되지 않으므로, 해석을 앞서 정하지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: theological tension should be preserved rather than resolved beyond the text.'
