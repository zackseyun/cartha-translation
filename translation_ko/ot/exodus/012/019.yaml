revisions:
- from: 이레 동안 너희 집 안에는 누룩이 있어서는 안 됩니다[a]. 누구든지 누룩 든 것을 먹는 자는[b] 이스라엘 회중에서 끊어질 것입니다[c]. 그것이 거류민이든 그 땅의 본토인이든 마찬가지입니다.
  to: 이레 동안 너희 집에는 누룩이 있어서는 안 됩니다[a]. 누구든지 누룩 든 것을 먹으면, 그 사람은 이스라엘 회중에서 끊어질 것입니다[b]. 그가 거류민이든 그 땅의 본토인이든 그러할 것입니다.
  rationale: 마지막 절이 위반한 사람을 가리키도록 ‘그가 … 그러할 것입니다’로 바로잡고, 주절을 현대 한국어에 자연스러운 조건문으로 다듬었습니다. ‘끊어질 것입니다’는 원문의 관용구와 그 신학적·법적 미확정성을 보존했습니다. 기능하지 않는 기존 b 주석과 부정확한 기존 c 주석은 삭제하고, 필요한 복수형 및 ‘끊어지다’ 관용구 설명으로 재구성했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:27Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 규정의 범위는 대체로 잘 옮겼습니다. 그러나 마지막의 ‘그것이 거류민이든’은 사람을 가리키는 선행사에 부적절한 지시대명사를 사용하여, 처벌 또는 행위가 거류민/본토인이라는 뜻처럼 읽힐 수 있습니다. 히브리어의 대조는 위반한 ‘사람’이 거류민이든 본토인이든 해당한다는 뜻이므로 이를 명시하는 것이 안전합니다. 또한 כרת 관용구는 ‘끊어지다’로 보존하되 그 의미를 단정하지 않아야 합니다.
  naturalness: ‘누구든지 … 먹는 자는’도 이해되지만, 현대 표준어 합쇼체에서는 ‘누구든지 … 먹으면, 그 사람은’이 더 자연스럽고 문장 구조가 명료합니다. ‘그것이 거류민이든’은 자연스럽지 않으므로 ‘그가 거류민이든 … 본토인이든’으로 고쳐야 합니다.
  terminology: ‘누룩’, ‘누룩 든 것’, ‘이스라엘 회중’, ‘거류민’, ‘본토인’은 원문의 제의·법률 문맥과 사회적 대조를 적절히 반영합니다. 다만 기존 b 주석은 본문 표현을 그대로 반복하므로 대안 주석으로 기능하지 않으며, 기존 c 주석은 ‘회중’ 자체를 다시 대안으로 제시해 부정확합니다. ‘끊어지다’의 해석상 미확정성을 설명하는 주석으로 교체하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘그것이 거류민이든 그 땅의 본토인이든’의 지시 대상이 부정확합니다.
    rationale: בַּגֵּר וּבְאֶזְרַח הָאָרֶץ는 벌을 받을 위반자가 거류민인지 본토인인지의 대조입니다. ‘그것’은 사람을 자연스럽게 가리키지 못하고 의미를 흐립니다.
  - severity: low
    issue: b 주석이 본문과 동일한 표현을 반복합니다.
    rationale: ‘또는 누룩 든 것을 먹는 자는’은 본문에 이미 그대로 있으므로 실제 번역 대안이나 설명을 제공하지 못합니다.
  - severity: medium
    issue: c 주석이 ‘끊어지다’ 관용구의 의미상 미확정성을 설명하지 못합니다.
    rationale: 원문의 כרת는 추방·죽음·신적 심판 등 정확한 집행 양상이 논쟁되는 언약 제재 관용구입니다. ‘회중’의 대안만 제시하는 기존 주석은 표지 위치와도 잘 맞지 않으며, ‘회중’ 자체를 대안으로 반복합니다.
