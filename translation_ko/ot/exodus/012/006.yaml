translation:
  language: ko
  text: 그것을 이 달 열나흗날까지 너희가 보관해 두어야 합니다. 이스라엘 회중의 온 집회가 해 질 무렵[a]에 그것을 잡아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
