  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
  footnotes:
  - marker: a
    text: 'Hebrew: ''between the evenings,'' an idiom commonly understood as the time around dusk or twilight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것은 이 달의 열나흗날까지 너희가 보관해야 합니다[a]. 그리고 이스라엘의 온 회중 곧 온 회중이 그것을 해 질 무렵에 잡아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 직역은 ‘두 저녁 사이’이며, 보통 해 질 무렵 또는 황혼 무렵으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  english_pob_choice: And it shall be kept by you
  chosen_korean: 그것은 너희가 보관해야 합니다
  alternatives_korean:
  - 너희가 지켜야 합니다
  - 너희에게 맡겨져 있어야 합니다
  - 너희가 잘 간수해야 합니다
  lexicon: HALOT
  rationale: לְמִשְׁמֶרֶת는 단순 소유가 아니라 지정된 보관·보호의 책임을 뜻하므로, 문맥상 자연스러운 ‘보관하다’로 옮겼습니다.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  english_pob_choice: until the fourteenth day of this month
  chosen_korean: 이 달의 열나흗날까지
  alternatives_korean:
  - 이 달 십사일까지
  - 이 달의 열네째 날까지
  lexicon: HALOT
  rationale: 히브리어 날짜 표준 표현을 한국어의 자연스러운 달력 표현으로 옮겼습니다.
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  english_pob_choice: the whole assembly of the congregation of Israel
  chosen_korean: 이스라엘의 온 회중 곧 온 회중
  alternatives_korean:
  - 이스라엘의 온 집회 곧 회중
  - 이스라엘의 모든 모임
  lexicon: HALOT
  rationale: 중복된 집합 명사를 그대로 살려 공동체적 총참여를 드러내되, 한국어에서 어색하지 않도록 ‘회중’의 반복을 보존했습니다.
- source_word: בֵּין הָעַרְבָּיִם
  english_pob_choice: between the evenings
  chosen_korean: 해 질 무렵
  alternatives_korean:
  - 저녁들 사이에
  - 저녁 사이에
  - 황혼 무렵
  lexicon: HALOT
  rationale: 문자적으로는 ‘두 저녁 사이’이지만, 한국어 본문은 널리 이해되는 시간대를 먼저 제시하고, 직역은 각주로 보완하는 편이 원문 의미를 가장 잘 전달합니다.
theological_decisions:
- issue: 공동체 주어의 보존
  chosen_reading: 이스라엘의 온 회중 곧 온 회중이 그것을 해 질 무렵에 잡아야 합니다
  alternative_readings:
  - 각 집안이 자기 어린양을 잡아야 합니다
  - 이스라엘 전체가 그것을 잡아야 합니다
  rationale: 히브리어는 집합적 주어를 사용하므로, 주변 문맥의 실무적 분배를 본문 안에서 풀어 설명하지 않고 공동체적 표현 자체를 유지했습니다.
  doctrine_reference: 공동체적 진술의 긴장 보존
