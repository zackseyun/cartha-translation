base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
  footnotes:
  - marker: a
    text: Or 'threshold' for 'basin' (Hebrew saph). Here 'basin' is preferred because the blood is said to be in it and the hyssop is dipped into it.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 우슬초 한 다발을 가져다가 그릇[a]에 있는 피에 적시고, 그 그릇에 있는 피를 문 위쪽 가로틀과 두 문설주에 바르십시오. 너희 가운데 아무도 아침까지 자기 집 출입구 밖으로 나가지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘그릇’이지만, 히브리어 사프(saph)는 ‘문지방’으로도 옮길 수 있습니다. 여기서는 피가 그 안에 있고 우슬초를 그것에 적신다는 점 때문에 ‘그릇’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  english_pob_choice: a bunch of hyssop
  chosen_korean: 우슬초 한 다발
  alternatives_korean:
  - 우슬초 한 묶음
  - 우슬초 다발
  lexicon: HALOT
  rationale: אֲגֻדָּה는 묶인 덩어리나 다발을 뜻하므로, 한국어로는 자연스럽고 구체적인 '한 다발'이 가장 잘 맞습니다.
- source_word: בַּ/דָּם אֲשֶׁר בַּ/סַּף
  english_pob_choice: the blood that is in the basin
  chosen_korean: 그릇에 있는 피
  alternatives_korean:
  - 대야에 있는 피
  - 문지방에 있는 피
  lexicon: HALOT
  rationale: 문맥상 우슬초를 피에 '적시는' 동작이므로, 피가 담긴 용기를 가리키는 의미를 살려 '그릇'으로 옮겼습니다. '문지방'은 가능한 어휘이지만 이 절의 동작과는 덜 맞습니다.
- source_word: וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת
  english_pob_choice: and touch the lintel and the two doorposts
  chosen_korean: 문설주와 두 문지방에 바르십시오
  alternatives_korean:
  - 문설주와 두 문설주에 바르십시오
  - 윗기둥과 두 문설주에 손대십시오
  lexicon: HALOT
  rationale: 히브리어는 피를 문틀의 세 부분에 닿게 하라는 뜻이므로, 현대 한국어에서 자연스러운 동사 '바르다'를 택하되 대상은 건축적 요소인 '문설주'와 '문지방'으로 옮겼습니다. 다만 한국어 독자가 구조를 즉시 이해하도록 다음 절의 '두 문지방'과 함께 읽히게 했습니다.
- source_word: מִ/פֶּֽתַח בֵּית֖/וֹ
  english_pob_choice: from the entrance of his house
  chosen_korean: 자기 집 입구
  alternatives_korean:
  - 자기 집 문
  - 자기 집 출입구
  lexicon: HALOT
  rationale: פֶּתַח은 '열린 곳, 입구'의 뜻이므로 '입구'가 가장 직접적입니다. 소유격은 분배적 의미를 살려 '자기 집'으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: הַסַּף의 의미를 어떻게 처리할지
  chosen_reading: 문맥상 용기이므로 '그릇'으로 옮기고, 피가 그 안에 있으며 우슬초를 그것에 적신다는 동작을 살렸습니다.
  alternative_readings:
  - 문지방
  - 문턱
  rationale: 이 절에서는 피가 '그 안에' 있고, 우슬초를 그 피에 적신 뒤 문틀에 바르므로, 용기 의미가 가장 설득력 있습니다. '문지방'은 어휘적으로 가능하지만 여기서는 동작과 맞지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3, 5
- issue: לֹא תֵצְאוּ אִישׁ의 분배적 표현 처리
  chosen_reading: '''너희는 아무도''로 옮겨 남성 단수 형식을 한국어에서 분배적으로 자연화했습니다.'
  alternative_readings:
  - 너희는 각 사람도 나가지 마십시오
  - 너희는 집 밖으로 나가지 마십시오
  rationale: אִישׁ은 여기서 남성만을 제한하는 뜻이 아니라 '각 사람'에 대한 분배적 금지입니다. 한국어에서는 '아무도'가 그 의미를 가장 자연스럽게 드러냅니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
