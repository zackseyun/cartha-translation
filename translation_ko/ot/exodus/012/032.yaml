  edition: WLC
  text: גַּם צֹאנְ/כֶ֨ם גַּם בְּקַרְ/כֶ֥ם קְח֛וּ כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָ/לֵ֑כוּ וּ/בֵֽרַכְתֶּ֖ם גַּם אֹתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
  footnotes:
  - marker: a
    text: Or 'bless even me.' Pharaoh's wording may stress that he too seeks blessing as Israel departs.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 양 떼와 소 떼도 가져가십시오[a]. 말씀하신 대로 하시고 가십시오. 그리고 저도 축복해 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '저에게도 복을 빌어 주십시오.' 파라오의 말은 그 역시 이스라엘이 떠나는 자리에서 복을 얻고자 함을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  english_pob_choice: Take both your flocks and your herds
  chosen_korean: 너희의 양 떼와 소 떼도
  alternatives_korean:
  - 너희의 양과 소도
  - 너희의 가축 떼도
  lexicon: HALOT
  rationale: 첫째 גַּם은 두 범주의 동시 수용을 강조하므로 한국어에서는 '도'를 앞에 두고, צֹאן/בָּקָר는 문맥상 '양 떼와 소 떼'로 옮겨 집합적 의미를 살렸습니다.
- source_word: קְחוּ
  english_pob_choice: Take
  chosen_korean: 가져가십시오
  alternatives_korean:
  - 가십시오
  - 받아 가십시오
  lexicon: HALOT
  rationale: 파라오가 출발을 허락하면서 가축까지 동반하라고 말하는 맥락이므로, 단순한 '가다'보다 소유물을 함께 가져가는 뉘앙스를 드러내는 '가져가십시오'가 더 정확합니다.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם וָלֵכוּ
  english_pob_choice: just as you have said, and go
  chosen_korean: 말씀하신 대로 하시고 가십시오
  alternatives_korean:
  - 말씀하신 대로 가십시오
  - 말씀하신 그대로 하고 떠나십시오
  lexicon: HALOT
  rationale: כַּאֲשֶׁר דִּבַּרְתֶּם은 앞서 말한 요구를 인정하는 표현이어서 '말씀하신 대로'로 자연스럽게 옮기고, וָלֵכוּ는 출발 명령으로서 '가십시오'로 간결하게 처리했습니다.
- source_word: וּבֵרַכְתֶּם גַּם אֹתִי
  english_pob_choice: and bless me also
  chosen_korean: 그리고 저도 축복해 주십시오
  alternatives_korean:
  - 그리고 저에게도 복을 빌어 주십시오
  - 그리고 저도 축복하십시오
  lexicon: HALOT
  rationale: ברך의 기본 의미를 살리되, 한국어에서는 타인에게 하는 청유형으로 '축복해 주십시오'가 가장 자연스럽고, גַּם אֹתִי의 포함 강조는 '저도'로 반영했습니다.
theological_decisions:
- issue: 파라오의 '축복' 요청의 뉘앙스
  chosen_reading: 본문이 말하는 단순한 축복 요청으로 두고, 파라오가 이스라엘의 하나님 앞에서 중보 축복을 구하는지, 아니면 작별 인사를 겸한 호의 요청인지는 밝히지 않았습니다.
  alternative_readings:
  - 이스라엘의 하나님께서 주시는 축복을 중보로 구함
  - 예의상 하는 작별 축복 요청
  rationale: 히브리어 동사 ברך는 분명하지만 요청의 정확한 종교적 경로는 본문에 명시되지 않으므로, 서술의 긴장을 보존하기 위해 해석을 확정하지 않았습니다.
  doctrine_reference: 해석을 본문 범위 안에 유지하여 긴장을 보존합니다.
