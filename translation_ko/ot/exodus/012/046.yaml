language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/בַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא תוֹצִ֧יא מִן הַ/בַּ֛יִת מִן הַ/בָּשָׂ֖ר ח֑וּצָ/ה וְ/עֶ֖צֶם לֹ֥א תִשְׁבְּרוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
  footnotes:
  - marker: a
    text: Or 'in one household.' The Hebrew word can denote either the physical house or the household gathered there.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 집에서 먹어야 합니다. 집 밖으로 그 고기를 하나도 내지 말아야 하며, 그 뼈도 하나도 꺾어서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 집’은 물리적 집을 가리킬 수도 있고, 그곳에 모인 한 가족/가정 공동체를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  english_pob_choice: in one house
  chosen_korean: 한 집에서
  alternatives_korean:
  - 한 가정에서
  - 한 집안에서
  lexicon: HALOT
  rationale: בַּיִת는 물리적 집과 가족/가정 공동체를 모두 가리킬 수 있지만, 바로 뒤의 ‘집 밖으로’와의 대비가 있어 여기서는 공간적 의미를 우선해 ‘한 집에서’로 옮겼습니다.
- source_word: יֵאָכֵל
  english_pob_choice: shall be eaten
  chosen_korean: 먹어야 합니다
  alternatives_korean:
  - 먹게 되어 있습니다
  - 먹히게 됩니다
  lexicon: HALOT
  rationale: 법규적 수동 표현의 명령성을 한국어에서 자연스럽게 살리기 위해 ‘먹어야 합니다’로 옮겼습니다. 수동형의 의미는 문맥상 유지됩니다.
- source_word: לֹא תוֹצִיא מִן הַבַּיִת מִן הַבָּשָׂר חוּצָה
  english_pob_choice: you shall not take any of the meat outside the house
  chosen_korean: 집 밖으로 그 고기를 하나도 내지 말아야 하며
  alternatives_korean:
  - 집에서 그 고기를 조금도 꺼내지 말아야 하며
  - 그 고기를 집 밖으로 가져가서는 안 되며
  lexicon: HALOT
  rationale: תוציא의 ‘밖으로 내다/가져내다’라는 방향성을 살리면서, חוּצָה를 포함한 전체 흐름을 한국어로 자연스럽게 재구성했습니다. ‘하나도’는 מן הַבָּשָׂר의 부분적 금지를 반영합니다.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  english_pob_choice: and you shall not break a bone of it
  chosen_korean: 그 뼈도 하나도 꺾어서는 안 됩니다
  alternatives_korean:
  - 뼈 하나도 부러뜨려서는 안 됩니다
  - 그것의 뼈를 하나도 꺾어서는 안 됩니다
  lexicon: HALOT
  rationale: עֶצֶם은 여기서 집합적으로 ‘뼈’ 한 개/어느 뼈라도를 가리키므로, 금지의 강도를 살린 한국어 관용인 ‘꺾어서는 안 됩니다’를 택했습니다. ‘그 뼈도’는 בוֹ의 지시 대상이 제물 전체임을 자연스럽게 반영합니다.
theological_decisions:
- issue: 제사 규례의 금지 형식과 한국어 명령문
  chosen_reading: 예식 규정을 전달하는 법률적 명령으로, 한국어는 평서적 법령체보다는 직접적 금지 표현을 사용했습니다.
  alternative_readings:
  - ‘…하지 말아야 합니다’
  - ‘…해서는 안 됩니다’
  rationale: 본문은 단순 설명이 아니라 출애굽기 12장의 규례를 제정하는 문맥이므로, 명령/금지의 효력을 분명히 드러내는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 출애굽기 12장 유월절 규례
