id: EXO.12.12
reference: Exodus 12:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
  footnotes:
  - marker: a
    text: Or 'I will go through.' The verb here means passing through the land, not 'passing over' in the sense of sparing.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''from man to beast.'''
    reason: lexical_alternative
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD'; alternatively 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 이 밤에 이집트 땅을 지나가고, 이집트 땅의 모든 처음 난 것을 — 사람에서부터 짐승에 이르기까지 — 쳐서, 이집트의 모든 신들에 대해 심판을 집행하겠습니다. 나는 야훼입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 동사는 ‘넘어가다’가 아니라 땅을 ‘지나가다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘사람에서부터 짐승에 이르기까지’.'
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהוָה, 전통적으로는 ‘the LORD’로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  english_pob_choice: I will pass through
  chosen_korean: 지나가고
  alternatives_korean:
  - 통과하고
  - 지나가겠습니다
  lexicon: HALOT
  rationale: עבר의 기본 의미를 살려 땅 전체를 ‘지나가는’ 동작으로 옮겼습니다. 여기서는 보호를 뜻하는 ‘넘어가다’가 아니라 심판을 위해 땅을 가로지르는 뜻이므로 ‘유월하다’ 식의 관습어는 피했습니다.
- source_word: בְ/אֶרֶץ מִצְרַיִם
  english_pob_choice: the land of Egypt
  chosen_korean: 이집트 땅
  alternatives_korean:
  - 이집트
  - 이집트의 땅
  lexicon: HALOT
  rationale: 히브리어의 ‘땅/지역’이 분명하므로 단순한 지명보다 ‘땅’을 살렸습니다.
- source_word: כָל בְּכוֹר
  english_pob_choice: every firstborn
  chosen_korean: 모든 처음 난 것
  alternatives_korean:
  - 모든 첫 태생
  - 모든 장자
  lexicon: HALOT
  rationale: בכור는 집단적으로 ‘처음 난 것들’이라는 뜻이므로 성별을 덧붙이지 않고 자연스러운 현대 한국어로 옮겼습니다.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  english_pob_choice: from man to beast
  chosen_korean: 사람에서부터 짐승에 이르기까지
  alternatives_korean:
  - 사람부터 짐승까지
  - 인간에서 가축에 이르기까지
  lexicon: HALOT
  rationale: 인간-동물의 총체적 범위를 나타내는 병렬 구조를 한국어의 ‘~에서부터 ~에 이르기까지’로 보존했습니다. ‘짐승’은 בְּהֵמָה의 일반적 대응으로 충분합니다.
- source_word: וּבְ/כָל אֱלֹהֵי מִצְרַיִם
  english_pob_choice: against all the gods of Egypt
  chosen_korean: 이집트의 모든 신들에 대해
  alternatives_korean:
  - 이집트의 모든 신들을 향해
  - 이집트의 모든 우상들에 대해
  lexicon: HALOT
  rationale: אֱלֹהִים을 ‘신들’로 직역해 본문의 신학적 주장 자체를 유지했습니다. 전치사의 대상을 드러내기 위해 ‘~에 대해’로 처리했습니다.
- source_word: אֶעֱשֶׂ֥ה שְׁפָטִ֖ים
  english_pob_choice: I will execute judgments
  chosen_korean: 심판을 집행하겠습니다
  alternatives_korean:
  - 심판을 내리겠습니다
  - 판결을 집행하겠습니다
  - 징벌하겠습니다
  lexicon: HALOT
  rationale: שפטים의 법정적·공적 어감을 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: אֲנִ֥י יְהוָֽה
  english_pob_choice: I am Yahweh
  chosen_korean: 나는 야훼입니다
  alternatives_korean:
  - 나는 여호와입니다
  - 나는 주님입니다
  lexicon: HALOT
  rationale: 표준 표기 정책에 따라 신명사 יְהוָה는 ‘야훼’로 옮겼습니다. 본문의 자가 선언을 분명히 드러내기 위해 종결형을 유지했습니다.
theological_decisions:
- issue: ‘지나가다’와 심판 행위의 관계
  chosen_reading: 이 동사는 이집트 땅을 실제로 가로지르며 심판을 행하는 뜻으로 이해하고, 보호를 뜻하는 유월의 ‘넘어가다’ 의미로는 쓰지 않았습니다.
  alternative_readings:
  - ‘넘어가다’로 읽어 유월절의 보호 모티프를 암시하는 번역
  - ‘순회하다’로 완화하는 번역
  rationale: 영문 POB audit trail이 이 동사의 의미를 ‘pass through’로 명시하며, 출애굽기 12장 후반의 보호 장면과 구별해야 한다고 설명합니다. 본절 자체의 심판 선포를 희석하지 않기 위해 직접적으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, lexical audit for וְעָבַרְתִּי
- issue: יְהוָה의 번역
  chosen_reading: 본문의 언약 이름을 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 주요 용어 정책에 따라 tetragrammaton은 ‘야훼’로 표기해 본문의 고유한 신명 표시를 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
