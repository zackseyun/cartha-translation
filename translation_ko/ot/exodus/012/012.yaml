review_pass:
  verdict: revise
  source_fidelity: 원문의 연속된 미래 동사들(‘지나가다–치다–심판을 행하다’)과 대상을 더 분명히 드러내도록 문장 연결을 조정했습니다. בְּכוֹר는 사람과 짐승에 함께 적용되므로 성별을 덧붙이지 않고 ‘처음 난 것’으로 유지했습니다. 이집트의 신들에 대한 심판도 ‘신들에게 심판을 내리다’로 자연스럽게 표현했습니다.
  naturalness: 초안의 ‘모든 처음 난 것을 — 사람에서부터 짐승에 이르기까지 — 쳐서’는 수식 범위와 연결이 다소 무거웠고, ‘신들에 대해 심판을 집행하다’는 현대 한국어에서 어색합니다. 범위를 앞세우고 병렬 미래 표현을 사용해 합쇼체의 자연스러운 선언문으로 다듬었습니다.
  terminology: יְהוָה는 정책 및 영문 POB의 선택에 따라 ‘야훼’로 유지했습니다. אֱלֹהֵי מִצְרַיִם은 해석적으로 ‘우상’이나 ‘통치자’로 바꾸지 않고 ‘이집트의 모든 신들’로 옮겼습니다. 각주 c의 전통 번역 설명은 한국어 독자에게 맞게 ‘여호와’로 바로잡았습니다.
