    rationale: 히브리어의 전치사 בְּ는 심판이 신들을 향하거나 그들에게 가해짐을 나타냅니다. 한국어에서는 ‘신들에게 심판을 내리겠습니다’가 대상 관계와 משפטים의 사법적 의미를 더 자연스럽게 전달합니다.
