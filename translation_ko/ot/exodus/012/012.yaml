- from: 내가 이 밤에 이집트 땅을 지나가고, 이집트 땅의 모든 처음 난 것을 — 사람에서부터 짐승에 이르기까지 — 쳐서, 이집트의 모든 신들에 대해 심판을 집행하겠습니다. 나는 야훼입니다.[a][b][c]
  to: 내가 이 밤에 이집트 땅을 지나가며[a], 사람부터 짐승까지 이집트 땅의 모든 처음 난 것을[b] 칠 것이며, 이집트의 모든 신들에게 심판을 내리겠습니다. 나는 야훼입니다.[c]
  rationale: 안전한 문체·구문 수정이 필요합니다. 개정문은 원문의 지리적 범위(‘이집트 땅’), 시간(‘이 밤’), 사람과 짐승을 아우르는 첫 태생, 이집트 신들에 대한 심판, 그리고 신명 선언을 모두 보존합니다. ‘처음 난 것’은 다소 직역적이지만 사람과 짐승 모두를 포괄하는 원문의 표현을 성별 추가 없이 유지하는 데 적절합니다.
