  text: וּ/בַ/יּ֤וֹם הָ/רִאשׁוֹן֙ מִקְרָא קֹ֔דֶשׁ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלָאכָה֙ לֹא יֵעָשֶׂ֣ה בָ/הֶ֔ם אַ֚ךְ אֲשֶׁ֣ר יֵאָכֵ֣ל לְ/כָל נֶ֔פֶשׁ ה֥וּא לְ/בַדּ֖/וֹ יֵעָשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
  footnotes:
  - marker: a
    text: Or 'a sacred assembly' or traditionally 'a holy convocation.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for every nephesh,' that is, for every person; not specifically 'soul' in the modern English sense.
    reason: lexical_alternative
  - marker: c
    text: Literally 'it alone shall be done for you'; the sense is that only food preparation necessary for eating is permitted on those days.
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 날에는 너희를 위한 거룩한 모임이 있고, 일곱째 날에도 거룩한 모임이 있어야 합니다. 그날들에는 어떤 일도 해서는 안 됩니다. 다만 각 사람이 먹을 것, 그것만은 너희를 위해 준비해야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִקְרָא קֹדֶשׁ는 문자적으로는 ‘거룩한 소집/모임’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נֶפֶשׁ는 여기서 현대적 의미의 ‘영혼’이 아니라 ‘사람’을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 문맥상 이 말은 음식 준비에 필요한 일만 허용된다는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  english_pob_choice: holy assembly
  chosen_korean: 거룩한 모임
  alternatives_korean:
  - 거룩한 집회
  - 거룩한 소집
  - 거룩한 성회
  lexicon: HALOT
  rationale: 소집된 예배 공동체라는 뜻을 살리면서도, 오늘 한국어에서 자연스럽고 교회 제도어로 굳어지지 않은 표현으로 옮겼습니다.
- source_word: כָּל מְלָאכָה
  english_pob_choice: No work
  chosen_korean: 어떤 일도
  alternatives_korean:
  - 일체의 일도
  - 어떠한 노동도
  - 어떤 종류의 일도
  lexicon: HALOT
  rationale: מְלָאכָה의 포괄적 금지를 한국어에서 지나치게 기술적으로 좁히지 않기 위해, 총칭적이고 자연스러운 ‘어떤 일도’로 옮겼습니다.
- source_word: לְכָל נֶפֶשׁ
  english_pob_choice: every person
  chosen_korean: 각 사람이
  alternatives_korean:
  - 모든 사람이
  - 각 사람의
  - 모든 생명이
  lexicon: HALOT
  rationale: 여기서 נֶפֶשׁ는 현대적 의미의 ‘영혼’이 아니라 개인을 가리키므로, 문맥에 맞게 ‘사람’으로 풀어 옮겼습니다.
- source_word: יֵעָשֶׂה לָכֶם
  english_pob_choice: may be prepared for you
  chosen_korean: 너희를 위해 준비해야 합니다
  alternatives_korean:
  - 너희를 위해 만들어져야 합니다
  - 너희를 위해 해야 합니다
  - 너희를 위해 행해져야 합니다
  lexicon: HALOT
  rationale: 금지 조항의 예외가 음식 준비라는 점을 한국어에서 분명히 드러내기 위해, 단순한 ‘하다/되다’보다 ‘준비하다’를 사용했습니다.
theological_decisions:
- issue: 안식적 금지와 음식 준비 예외의 범위
  chosen_reading: ‘어떤 일도 해서는 안 됩니다’ 다음에, 허용되는 유일한 예외를 ‘각 사람이 먹을 것, 그것만은… 준비해야 합니다’로 분명히 제시했습니다.
  alternative_readings:
  - ‘어떤 노동도 해서는 안 됩니다’
  - ‘먹을 음식만은 만들 수 있습니다’
  rationale: 본문은 일반 노동 금지와 식사에 필요한 준비의 예외를 대조하므로, 예외의 범위를 흐리지 않도록 금지와 허용을 모두 분명히 드러냈습니다.
  doctrine_reference: 출 12:16의 절기 규례 해석
