  source_fidelity: 핵심 의미는 대체로 잘 반영합니다. 그러나 예외 조항의 יֵעָשֶׂה는 음식 준비가 ‘반드시 해야 하는’ 의무라는 뜻보다, 금지된 일 가운데 음식 준비만 허용된다는 뜻입니다. 따라서 ‘준비해야 합니다’는 ‘준비할 수 있습니다’로 고쳐야 합니다. 또한 אֲשֶׁר יֵאָכֵל לְכָל־נֶפֶשׁ은 ‘각 사람이 먹을 것’보다 ‘각 사람이 먹을 음식’이 음식 준비라는 문맥을 더 정확하고 자연스럽게 드러냅니다.
  naturalness: ‘거룩한 모임’과 합쇼체 문장은 현대 표준 한국어로 자연스럽습니다. 다만 각주 표지를 해당 표현 가까이에 배치하면 독자가 각주의 지시 대상을 더 분명히 알 수 있습니다.
  terminology: מִקְרָא קֹדֶשׁ의 ‘거룩한 모임’ 및 נֶפֶשׁ의 ‘사람’은 적절합니다. ‘어떤 일도’는 כָּל־מְלָאכָה의 포괄성을 자연스럽게 전달합니다. 음식 준비 예외는 허용의 의미를 유지하도록 조정합니다.
