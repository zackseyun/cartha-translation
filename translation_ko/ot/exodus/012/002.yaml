  text: 이 달은 너희에게 달들의 시작이 될 것이며, 그것은 너희에게 해의 첫째 달이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘달’은 히브리어 חֹדֶשׁ의 달력적 의미를 따른 번역입니다. 이 말은 문자적으로는 새달/신월과 연관될 수 있지만, 여기서는 달력의 ‘달’을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  english_pob_choice: This month
  chosen_korean: 이 달
  alternatives_korean:
  - 이 새로운 달
  - 이 음력 달
  lexicon: HALOT
  rationale: חֹדֶשׁ은 절기·달력 문맥에서 보통 ‘달/월’을 뜻하므로, 달력 제정의 의미를 살려 ‘이 달’로 옮겼습니다.
- source_word: לָכֶם
