  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
  footnotes:
  - marker: a
    text: Or 'This new moon,' since the Hebrew word can be associated with the new-moon cycle; here it refers to the calendrical month.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 달은 너희에게 여러 달의 첫머리가 될 것이며, 너희에게 한 해의 첫째 달이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘달’로 번역한 히브리어 חֹדֶשׁ는 새달 또는 신월과 관련된 말로도 이해될 수 있으나, 여기서는 달력상의 달을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  english_pob_choice: This month
  chosen_korean: 이 달
  alternatives_korean:
  - 이 새로운 달
  - 이 음력 달
  lexicon: HALOT
  rationale: חֹדֶשׁ은 절기·달력 문맥에서 보통 ‘달/월’을 뜻하므로, 달력 제정의 의미를 살려 ‘이 달’로 옮겼습니다.
- source_word: לָכֶם
  english_pob_choice: for you
  chosen_korean: 너희에게
  alternatives_korean:
  - 너희를 위하여
  - 너희를 향하여
  lexicon: HALOT
  rationale: 이 규정이 이스라엘을 향한 언약적 지정임을 드러내기 위해 관계 표지를 자연스러운 한국어인 ‘너희에게’로 옮겼습니다.
- source_word: רֹאשׁ חֳדָשִׁים
  english_pob_choice: the beginning of months
  chosen_korean: 달들의 시작
  alternatives_korean:
  - 달들의 머리
  - 달들의 첫머리
  lexicon: HALOT
  rationale: רֹאשׁ은 문자적으로 ‘머리’지만 시간·순서 문맥에서는 관용적으로 ‘시작’을 뜻하므로, 직역의 어색함을 피하면서도 원문의 구조를 살렸습니다.
- source_word: רִאשׁוֹן
  english_pob_choice: the first month
  chosen_korean: 해의 첫째 달
  alternatives_korean:
  - 첫째 달
  - 한 해의 첫 달
  lexicon: HALOT
  rationale: 원문은 ‘첫째’라는 서수와 ‘해’의 범주를 함께 제시하므로, 달력상의 위치를 분명히 하는 ‘해의 첫째 달’로 옮겼습니다.
theological_decisions:
- issue: 서술문형 히브리어의 명령적 효력
  chosen_reading: 미래·규정의 뉘앙스를 살려 ‘될 것입니다’로 번역했습니다.
  alternative_readings:
  - 현재형 ‘입니다’
  - 명령형으로 재구성
  rationale: 본문은 하나님의 달력 제정 규정이므로 단순 설명보다 제정·선언의 힘이 드러나야 하여, 한국어에서는 ‘될 것입니다’가 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §6
