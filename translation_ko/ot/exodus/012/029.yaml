  source_fidelity: 수정이 필요합니다. בְּכוֹר는 사람과 가축 모두에 적용되는 성별 비한정 표현인데, 초안의 ‘맏아들’은 남성으로 한정합니다. 또한 וַיְהִי는 ‘그날 밤’이라는 특정한 밤을 추가하지 않으므로, 시간 표현은 ‘한밤중에’로 충분합니다. 각주 표지는 대안이 적용되는 ‘포로/감옥’ 구절에 붙여야 합니다.
