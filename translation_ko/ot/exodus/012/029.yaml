  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. בְּכוֹר는 ‘처음 난 것’으로 통일하여 성별 한정을 피했고, בֵּית הַבּוֹר의 구체적 이미지는 ‘감옥 구덩이’로 보존했습니다.
