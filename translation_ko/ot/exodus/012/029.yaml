  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
  footnotes:
  - marker: a
    text: Or "the firstborn of the prisoner who was in the dungeon."
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 밤 자정에 야훼께서 이집트 땅의 모든 맏아들을 치셨습니다[a]. 곧 자기 보좌에 앉아 있던 파라오의 맏아들부터, 감옥 구덩이에 있던 포로의 맏아들에 이르기까지, 또 가축의 모든 맏아들을 치셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “감옥에 갇힌 죄수의 맏아들”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ...
  chosen_korean: 그날 밤
  alternatives_korean:
  - 그리고
  - 그때
  lexicon: HALOT
  rationale: 서사의 진행을 자연스럽게 잇되, 한국어에서는 무의미한 접속어를 앞세우기보다 사건 시점을 먼저 제시하는 편이 문맥상 더 자연스럽습니다.
- source_word: בַּחֲצִי הַלַּיְלָה
  english_pob_choice: at midnight
  chosen_korean: 자정에
  alternatives_korean:
  - 한밤중에
  - 밤중에
  lexicon: HALOT
  rationale: 관용적으로는 ‘한밤중’도 가능하지만, 원문의 ‘밤의 한가운데’라는 시간 지정은 ‘자정에’가 가장 간결하고 정확하게 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 통상적 대치어가 아니라 고유명사로 보존해야 하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הִכָּה
  english_pob_choice: struck down
  chosen_korean: 치셨습니다
  alternatives_korean:
  - 내리치셨습니다
  - 죽이셨습니다
  lexicon: HALOT
  rationale: ‘치다’는 ضرب/נכה의 폭력적 이미지와 그 결과를 함께 살리며, 단순히 결과만 말하는 ‘죽이다’보다 원문 동사를 더 직접적으로 반영합니다.
- source_word: בְּכוֹר
  english_pob_choice: firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫째아들
  - 장자
  lexicon: HALOT
  rationale: 이 문맥은 사람과 가축 모두를 포함하므로 성별을 한정하는 ‘아들’은 피해야 하지만, 한국어 성경 전통에서 ‘맏아들’은 맏이의 상징성과 첫 태생을 잘 드러내는 표현입니다. 다만 여기서는 인칭 대상에 대해 ‘맏아들’로 옮겨 원문의 혈통/서열 개념을 살렸습니다.
- source_word: בְּאֶרֶץ מִצְרַיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅
  alternatives_korean:
  - 이집트 땅에
  - 이집트 온 땅
  lexicon: HALOT
  rationale: 지리적 관용구를 자연스러운 현대 한국어로 옮기되, 원문의 ‘땅’ 표현을 유지해 범위를 분명히 했습니다.
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  english_pob_choice: from the firstborn of Pharaoh ... to the firstborn of the captive
  chosen_korean: 파라오의 맏아들부터 ... 포로의 맏아들에 이르기까지
  alternatives_korean:
  - 파라오의 첫째아들부터 ... 포로의 첫째아들까지
  - 파라오의 맏아들에서 ... 포로의 맏아들에 이르기까지
  lexicon: HALOT
  rationale: מן ... עד의 범위 표현을 ‘부터 ... 에 이르기까지’로 옮겨, 상하위 계층 전체를 포괄하는 문학적 긴장을 살렸습니다.
- source_word: בְּהֵמָה
  english_pob_choice: livestock
  chosen_korean: 가축
  alternatives_korean:
  - 가축들
  - 짐승
  lexicon: HALOT
  rationale: 가축을 뜻하는 בהמה는 이 문맥에서 집에서 기르는 동물을 가리키므로, 집합명사 ‘가축’이 가장 적절합니다.
theological_decisions:
- issue: 신명 יהוה의 번역
  chosen_reading: 본문의 신명을 ‘야훼’로 표기합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문의 고유한 언약 이름을 제목어로 대치하지 않고 드러내는 것이 본문 의도를 더 직접적으로 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
