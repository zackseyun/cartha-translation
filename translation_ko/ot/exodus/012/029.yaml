revisions:
- from: 그날 밤 자정에 야훼께서 이집트 땅의 모든 맏아들을 치셨습니다[a]. 곧 자기 보좌에 앉아 있던 파라오의 맏아들부터, 감옥 구덩이에 있던 포로의 맏아들에 이르기까지, 또 가축의 모든 맏아들을 치셨습니다.
  to: 한밤중에 야훼께서 이집트 땅의 모든 처음 난 것을 치셨습니다. 곧 보좌에 앉아 있던 파라오의 처음 난 것부터 감옥 구덩이에 있던 포로[a]의 처음 난 것까지, 또 가축의 모든 처음 난 것을 치셨습니다.
  rationale: 성별을 한정하는 ‘맏아들’을 사람과 가축에 공통으로 적용 가능한 ‘처음 난 것’으로 바로잡았습니다. 원문에 없는 ‘그날’을 삭제하고, 감옥 관련 어휘 대안의 각주 표지를 해당 구절로 옮겼습니다. 야훼, 파라오, 이집트 땅, 감옥 구덩이의 표현은 원문 및 영어 감사 기록의 의미 범위를 유지합니다.
