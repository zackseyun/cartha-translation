id: EXO.12.14
reference: Exodus 12:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
  footnotes:
  - marker: a
    text: Or 'an everlasting statute' or 'a perpetual statute.' The Hebrew phrase חֻקַּת עוֹלָם often denotes an enduring, ongoing ordinance.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 날은 여러분에게 기념일이 되며, 여러분은 그것을 야훼께 드리는 절기로 지켜야 합니다. 대대로 여러분은 그것을 영원한 규례[a]로 지켜야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “영구한 규례” 또는 “항구한 규례”로 옮길 수 있습니다. 히브리어 חֻקַּת עוֹלָם는 법률·예식 문맥에서 지속적으로 지켜야 하는 규정을 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... לָכֶם
  english_pob_choice: shall be for you
  chosen_korean: 여러분에게 기념일이 되며
  alternatives_korean:
  - 여러분을 위한 기념일이 되며
  - 여러분에게 기념이 되며
  lexicon: HALOT
  rationale: 법적·예식적 문맥에서 ‘되다’로 미래 규정의 힘을 살리고, לָכֶם의 관계를 ‘여러분에게’로 자연스럽게 옮겼습니다.
- source_word: לְזִכָּרוֹן
  english_pob_choice: as a memorial
  chosen_korean: 기념일
  alternatives_korean:
  - 기억을 위한 날
  - 기념으로
  lexicon: HALOT
  rationale: זִכָּרוֹן은 단순한 기억보다 공동체적 기념을 가리키므로, 예식 맥락에 맞는 ‘기념일’로 압축해 전달했습니다.
- source_word: וְחַגֹּתֶם ... חַג
  english_pob_choice: you shall celebrate it as a feast
  chosen_korean: 그것을 ... 절기로 지켜야 합니다
  alternatives_korean:
  - 그것을 ... 잔치로 지켜야 합니다
  - 그것을 ... 축제로 지켜야 합니다
  lexicon: HALOT
  rationale: חגג와 חַג의 어근 연결을 살리기 위해 ‘절기’와 ‘지키다’를 함께 사용해, 단순 행사보다 지정된 종교 절기의 의미를 반영했습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 יְהוָה를 ‘야훼’로 옮기며, 조사 ‘-께’로 헌정/지향의 방향을 분명히 했습니다.
- source_word: חֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 항구한 규례
  - 영속하는 규례
  lexicon: HALOT
  rationale: עוֹלָם의 법적 용법은 지속되는 규정을 뜻하므로, 한국어 성경문체에서 널리 통용되면서도 현대적인 ‘영원한 규례’로 옮겼습니다.
theological_decisions:
- issue: 하나님께 드리는 절기의 방향성
  chosen_reading: 이 절기는 야훼를 향한 예식으로 지켜야 합니다.
  alternative_readings:
  - 단순한 기념 행사로 지켜야 합니다
  - 공동체 전통으로 지켜야 합니다
  rationale: 본문의 חַג לַיהוָה는 단순 기념이 아니라 야훼께 속한/향한 절기임을 분명히 하므로, 예식의 신학적 방향을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6 (source-direct rendering)
