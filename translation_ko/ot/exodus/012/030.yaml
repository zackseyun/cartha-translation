    text: ‘온 이집트’는 지명으로 나라와 그 백성을 함께 가리키는 집합적 표현입니다.
    reason: cultural_note
  revision_rationale: ‘그 밤에’는 לַיְלָה הוּא의 특정한 시간 설정을 자연스럽게 옮기며, 불필요한 ‘바로’의 중의적 반복을 피합니다. ‘그의 모든 신하’는 וְכָל עֲבָדָיו의 범위를 명시합니다. 문화 주석의 표지를 ‘온 이집트’에 직접 붙여 주석 대상과 일치시켰습니다.
