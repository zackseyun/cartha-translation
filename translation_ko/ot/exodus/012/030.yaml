id: EXO.12.30
reference: Exodus 12:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨קָם פַּרְעֹ֜ה לַ֗יְלָה ה֤וּא וְ/כָל עֲבָדָי/ו֙ וְ/כָל מִצְרַ֔יִם וַ/תְּהִ֛י צְעָקָ֥ה גְדֹלָ֖ה בְּ/מִצְרָ֑יִם כִּֽי אֵ֣ין בַּ֔יִת אֲשֶׁ֥ר אֵֽין שָׁ֖ם מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
  footnotes:
  - marker: a
    text: Or, more literally, 'there was not a house where there was not a dead person.'
    reason: lexical_alternative
  - marker: b
    text: '''All Egypt'' uses the land name collectively for the people of Egypt.'
    reason: cultural_note
translation:
  language: ko
  text: 바로와 그의 모든 신하와 온 이집트[b]가 그 밤에 일어났습니다. 이집트에 큰 부르짖음이 일어났습니다. 죽은 사람이 없는 집이 하나도 없었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘온 이집트’는 지명으로 나라와 그 백성을 함께 가리키는 집합적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לַיְלָה הוּא
  english_pob_choice: in the night
  chosen_korean: 바로 그 밤에
  alternatives_korean:
  - 밤에
  - 그날 밤에
  lexicon: HALOT
  rationale: לַיְלָה הוּא의 시간 표지를 자연스러운 한국어로 풀되, 사건의 즉시성과 특정성을 살려 ‘바로 그 밤에’로 옮겼습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 시종들
  lexicon: HALOT
  rationale: 이 문맥의 왕실 인물들을 가리키므로, 단순한 노예 뉘앙스보다 궁정적 직무를 드러내는 ‘신하들’이 더 적절합니다.
- source_word: וְכָל מִצְרַיִם
  english_pob_choice: and all Egypt
  chosen_korean: 온 이집트
  alternatives_korean:
  - 이집트 사람들 모두
  - 이집트 땅 전체
  lexicon: HALOT
  rationale: 지명을 집합적으로 쓰는 מקור의 수사에 맞춰, 공동체 전체를 가리키는 ‘온 이집트’로 옮겼습니다.
- source_word: צְעָקָה גְדֹלָה
  english_pob_choice: a great cry
  chosen_korean: 큰 부르짖음
  alternatives_korean:
  - 큰 외침
  - 큰 통곡
  lexicon: HALOT
  rationale: צְעָקָה는 단순한 소리보다 고통과 절박함이 실린 외침이어서, 한국어에서는 ‘부르짖음’이 그 정서를 가장 잘 살립니다.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  english_pob_choice: there was no house where there was not someone dead
  chosen_korean: 죽은 사람이 없는 집이 하나도 없었기 때문입니다
  alternatives_korean:
  - 죽은 사람이 없는 집이 없었기 때문입니다
  - 죽은 이가 없는 집이 하나도 없었기 때문입니다
  lexicon: HALOT
  rationale: 반복된 부정 구조를 한국어의 자연스러운 강조 표현으로 옮기되, ‘집’의 직역성을 유지하면서도 의미가 분명하도록 했습니다.
theological_decisions:
- issue: 죽음의 보편성을 강조하는 반복 부정 구조
  chosen_reading: ‘죽은 사람이 없는 집이 하나도 없었습니다’로 옮겨, 모든 집에 죽음이 미쳤다는 본문의 절박함을 그대로 드러냈습니다.
  alternative_readings:
  - ‘한 집도 죽음이 없지 않았습니다’
  - ‘어느 집에도 죽은 사람이 있었습니다’
  rationale: 히브리어의 이중 부정은 단순 정보보다 재앙의 총체성을 강조합니다. 한국어에서도 그 강조를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 출애굽기 12장의 심판 서술
