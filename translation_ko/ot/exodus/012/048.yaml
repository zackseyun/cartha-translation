review_pass:
  verdict: revise
  source_fidelity: The draft broadly follows the Hebrew conditional sequence and correctly retains the circumcision prerequisite, permitted approach to the Passover, comparison with the native-born, and prohibition on an uncircumcised person. However, ‘너희’ changes the singular addressee of אִתְּךָ, and ‘토박이’ is too colloquial and imprecise for אֶזְרַח הָאָרֶץ, which denotes one native-born in the land. ‘거류민’ better conveys גֵּר as a resident non-native than ‘나그네,’ which can suggest a traveler.
  naturalness: The revised wording uses clear modern formal-polite Korean. ‘그 땅에서 태어난 사람’ is more neutral and natural in this legal-ritual context than ‘이 땅의 토박이.’ Footnote markers are placed with the words or phrases they explain rather than accumulated at the end.
  terminology: ‘야훼,’ ‘유월절,’ and ‘할례’ are appropriate and consistent with the supplied source and audit trail. ‘거류민’ preserves the resident-foreigner/legal nuance of גֵּר without the passing-traveler implication of ‘나그네.’
  issues:
  - severity: medium
    issue: Singular addressee rendered as plural
    rationale: The Hebrew אִתְּךָ means ‘with you’ (singular). The draft’s ‘너희와 함께’ introduces a plural addressee without a source basis.
  - severity: medium
    issue: ‘나그네’ understates resident status of גֵּר
    rationale: In this legal context גֵּר is a non-native residing among the people, not simply a traveler. ‘거류민’ preserves this distinction more reliably.
  - severity: medium
    issue: ‘토박이’ is colloquial and less precise for אֶזְרַח הָאָרֶץ
    rationale: The expression refers to a native-born person of the land. ‘그 땅에서 태어난 사람’ renders that sense neutrally without importing modern associations of indigeneity.
  - severity: low
    issue: Footnote anchors are structurally misplaced
    rationale: Markers [a], [b], and [c] are all attached to the final sentence although their notes concern גֵּר, Passover observance, and YHWH respectively. They should be attached at their relevant expressions.
  revised_text: 거류민[a]이 너와 함께 살면서 야훼[c]께 유월절을 지키려면[b], 그에게 속한 모든 남자는 할례를 받아야 합니다. 그때에야 그가 가까이 나아가 그것을 지킬 수 있고, 그는 그 땅에서 태어난 사람과 같게 됩니다. 그러나 할례받지 않은 사람은 그것을 먹을 수 없습니다.
