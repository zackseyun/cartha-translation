id: EXO.12.48
reference: Exodus 12:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
  footnotes:
  - marker: a
    text: Or 'resident foreigner' for 'sojourner' (גֵּר), referring to a non-native living among Israel.
    reason: lexical_alternative
  - marker: b
    text: Literally 'do/make the Passover.' English idiom commonly says 'keep' or 'celebrate' the Passover.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: alternative_reading
translation:
  language: ko
  text: 나그네가 너희와 함께 거주하며 야훼께 유월절을 지키려거든, 그에게 속한 모든 남자는 할례를 받아야 합니다. 그때에야 그는 그것을 지키기 위해 가까이 나아갈 수 있으며, 이 땅의 토박이와 같게 될 것입니다. 그러나 할례받지 않은 사람은 그것을 먹을 수 없습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: גֵּר는 이스라엘 가운데 사는 비토착민을 가리키므로, 여기서는 ‘나그네’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘유월절을 하다/행하다’입니다. 한국어에서는 절기 준수를 자연스럽게 ‘지키다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절의 하나님의 이름 YHWH는 ‘야훼’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: גֵּר
  english_pob_choice: sojourner
  chosen_korean: 나그네
  alternatives_korean:
  - 거류자
  - 거주 외국인
  lexicon: HALOT
  rationale: גֵּר는 이스라엘 가운데 거주하는 비토착민을 가리키므로, 법적·사회적 뉘앙스를 살릴 수 있는 ‘나그네’가 가장 자연스럽습니다.
- source_word: יָגוּר אִתְּךָ
  english_pob_choice: resides with you
  chosen_korean: 너희와 함께 거주하며
  alternatives_korean:
  - 너희와 함께 나그네로 살며
  - 너희와 함께 머물며
  lexicon: HALOT
  rationale: 동사 גור의 지속적 거주 의미를 살려, 단순한 방문이 아니라 공동체 안에 머무는 상태를 분명히 했습니다.
- source_word: וְעָשָׂה פֶסַח
  english_pob_choice: keeps the Passover
  chosen_korean: 유월절을 지키려거든
  alternatives_korean:
  - 유월절을 행하려거든
  - 유월절을 기념하려거든
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘유월절을 행하다’이지만, 한국어에서는 절기 준수를 ‘지키다’로 옮기는 것이 가장 자연스럽고 의미도 정확합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼를 위하여
  - 주님께
  lexicon: HALOT
  rationale: 고유신명 YHWH를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 여격의 방향성을 살려 ‘-께’를 붙였습니다.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  english_pob_choice: every male belonging to him must be circumcised
  chosen_korean: 그에게 속한 모든 남자는 할례를 받아야 합니다
  alternatives_korean:
  - 그의 모든 남자는 할례를 받아야 합니다
  - 그에게 속한 모든 남자는 할례를 받아야 합니다
  lexicon: HALOT
  rationale: 의무를 나타내는 구조이므로 수동적 명령형으로 옮겼고, '그에게 속한'으로 집안/소속 전체를 포괄하는 법적 범위를 드러냈습니다.
- source_word: וְאָז יִקְרַב
  english_pob_choice: then he may come near
  chosen_korean: 그때에야 그는 ... 가까이 나아갈 수 있으며
  alternatives_korean:
  - 그때에 그는 가까이 나아갈 수 있으며
  - 그때에야 그는 가까이 나아올 수 있으며
  lexicon: HALOT
  rationale: קרב는 단순한 이동이 아니라 의례 참여를 위한 접근을 뜻하므로, 허용의 의미를 살린 ‘가까이 나아가다’로 옮겼습니다.
- source_word: כְּאֶזְרַח הָאָרֶץ
  english_pob_choice: like a native of the land
  chosen_korean: 이 땅의 토박이와 같게 될 것입니다
  alternatives_korean:
  - 이 땅의 본토 사람과 같게 될 것입니다
  - 이 땅의 주민과 같게 될 것입니다
  lexicon: HALOT
  rationale: אֶזְרַח는 단순 거주민보다 ‘토박이/원주민’의 뉘앙스가 강하므로, 법적 비교를 현대 한국어로 풀어 ‘토박이’로 옮겼습니다.
- source_word: עָרֵל
  english_pob_choice: uncircumcised person
  chosen_korean: 할례받지 않은 사람
  alternatives_korean:
  - 무할례자
  - 할례받지 않은 남자
  lexicon: HALOT
  rationale: 문맥상 남성 중심 규정이지만, 금지 규범 자체를 한국어로 자연스럽게 전달하기 위해 일반화된 인칭 표현을 사용했습니다.
theological_decisions:
- issue: 유월절 참여의 경계 설정
  chosen_reading: 나그네에게는 할례가 전제될 때 유월절 참여가 허용되며, 그 경우 이스라엘 토박이와 동등하게 취급됩니다.
  alternative_readings:
  - 단순한 민족 배제
  - 모든 경계 표지의 철폐
  rationale: 히브리어 본문은 배제와 포용 중 하나로 단순화하지 않고, 할례라는 언약 표지를 조건으로 한 참여 허용을 말합니다. 번역도 그 긴장을 그대로 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
