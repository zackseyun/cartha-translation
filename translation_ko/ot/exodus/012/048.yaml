revisions:
- from: 나그네가 너희와 함께 거주하며 야훼께 유월절을 지키려거든, 그에게 속한 모든 남자는 할례를 받아야 합니다. 그때에야 그는 그것을 지키기 위해 가까이 나아갈 수 있으며, 이 땅의 토박이와 같게 될 것입니다. 그러나 할례받지 않은 사람은 그것을 먹을 수 없습니다.[a][b][c]
  to: 거류민[a]이 너와 함께 살면서 야훼[c]께 유월절을 지키려면[b], 그에게 속한 모든 남자는 할례를 받아야 합니다. 그때에야 그가 가까이 나아가 그것을 지킬 수 있고, 그는 그 땅에서 태어난 사람과 같게 됩니다. 그러나 할례받지 않은 사람은 그것을 먹을 수 없습니다.
  rationale: The revision restores the singular address, chooses ‘거류민’ for the resident-foreigner sense of גֵּר, replaces colloquial ‘토박이’ with a native-born expression that more closely reflects אֶזְרַח הָאָרֶץ, and relocates each footnote anchor to its relevant term. The conditional eligibility and prohibition remain unchanged.
