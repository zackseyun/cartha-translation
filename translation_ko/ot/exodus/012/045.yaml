id: EXO.12.45
reference: Exodus 12:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תּוֹשָׁ֥ב וְ/שָׂכִ֖יר לֹא יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/045.yaml
  text: A sojourner or a hired worker shall not eat of it[a][b].
  footnotes:
  - marker: a
    text: Or 'sojourner' or 'temporary resident' for 'resident foreigner.'
    reason: lexical_alternative
  - marker: b
    text: That is, of the Passover meal; more narrowly, of the Passover lamb.
    reason: cross_reference
translation:
  language: ko
  text: 거주 외국인이나 품삯꾼은 그것을 먹어서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 바로 앞 문맥에 있는 유월절 양/식사를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  english_pob_choice: resident foreigner
  chosen_korean: 거주 외국인
  alternatives_korean:
  - 나그네
  - 체류 외국인
  - 거류민
  lexicon: HALOT
  rationale: 정착해 살지만 언약 공동체에 완전히 편입되지는 않은 외부인을 가리키므로, 문맥의 거주성과 외국인성을 함께 드러내는 표현을 택했습니다.
- source_word: שָׂכִיר
  english_pob_choice: hired worker
  chosen_korean: 품삯꾼
  alternatives_korean:
  - 고용된 일꾼
  - 임금 노동자
  - 삯꾼
  lexicon: HALOT
  rationale: ‘품삯꾼’은 삯을 받고 일하는 사람이라는 의미를 짧고 자연스럽게 전하며, 법문체의 금지 조항에 맞습니다.
- source_word: לֹא יֹאכַל
  english_pob_choice: shall not eat
  chosen_korean: 먹어서는 안 됩니다
  alternatives_korean:
  - 먹지 말아야 합니다
  - 먹을 수 없습니다
  - 먹지 못합니다
  lexicon: HALOT
  rationale: 히브리어 부정 미완료형의 금지 뜻을 한국어 법령체로 옮겼습니다. ‘안 됩니다’는 명확한 금지의 힘을 유지합니다.
- source_word: בּוֹ
  english_pob_choice: of it
  chosen_korean: 그것을
  alternatives_korean:
  - 그것의 것을
  - 그것에서
  - 그것을 일부
  lexicon: HALOT
  rationale: 전치사 ב가 여기서는 유월절 희생제물/잔치 전체를 가리키는 부분적 용법이므로, 한국어에서는 자연스럽게 목적어로 처리했습니다.
theological_decisions:
- issue: ‘it’의 지시 대상
  chosen_reading: 지시어 ‘그것’은 바로 앞 문맥의 유월절 양과 그 식사에 대한 지시입니다.
  alternative_readings:
  - 유월절 양만 가리킨다
  - 유월절 식사 전체를 가리킨다
  rationale: 히브리어 본문은 간결하게 지시하지만, 문맥상 유월절 규례의 대상은 바로 앞에서 규정된 제물/식사입니다. 한국어 본문은 지시어의 간결함을 보존하면서도 문맥상 이해가 가능하게 했습니다.
  doctrine_reference: 출애굽기 12장 유월절 규례 문맥
