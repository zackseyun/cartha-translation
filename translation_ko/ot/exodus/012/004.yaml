id: EXO.12.4
reference: Exodus 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם יִמְעַ֣ט הַ/בַּיִת֮ מִ/הְיֹ֣ת מִ/שֶּׂה֒ וְ/לָקַ֣ח ה֗וּא וּ/שְׁכֵנ֛/וֹ הַ/קָּרֹ֥ב אֶל בֵּית֖/וֹ בְּ/מִכְסַ֣ת נְפָשֹׁ֑ת אִ֚ישׁ לְ/פִ֣י אָכְל֔/וֹ תָּכֹ֖סּוּ עַל הַ/שֶּֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
  footnotes:
  - marker: a
    text: Hebrew שֶׂה can refer more broadly to a head of small livestock, from the sheep or the goats; 'lamb' is used here for natural English in the Passover context.
    reason: lexical_alternative
  - marker: b
    text: Or 'each person according to what he can eat, you shall calculate for the lamb.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 집안 식구가 한 어린 양[a]을 먹기에 너무 적으면, 그는 자기 이웃 가운데 집에서 가까운 사람과 함께, 사람 수를 따라 한 마리를 잡을 것이며, 각 사람은 그가 먹을 수 있는 만큼[b] 너희가 어린 양을 셀 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שֶׂה는 양이나 염소를 포함하는 더 넓은 작은 가축을 가리킬 수 있습니다. 유월절 문맥에서는 자연스러운 한국어를 위해 ‘어린 양’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘각 사람은 그가 먹을 수 있는 만큼, 너희가 어린 양을 계산하라.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם יִמְעַ֣ט הַ/בַּיִת֮ מִ/הְיֹ֣ת מִ/שֶּׂה
  english_pob_choice: if the household is too small for a lamb
  chosen_korean: 만일 집안 식구가 한 어린 양을 먹기에 너무 적으면
  alternatives_korean:
  - 만일 집안이 어린 양 한 마리에 부족하면
  - 만일 집안 식구 수가 어린 양을 두기에는 너무 적으면
  lexicon: HALOT
  rationale: הַבַּיִת는 여기서 건물보다 가족 공동체를 가리키므로 ‘집안 식구’로 풀었고, יִמְעַט + מִהְיֹת는 수가 부족하다는 뜻이어서 ‘먹기에 너무 적다’로 자연스럽게 옮겼습니다.
- source_word: שֶּׂה
  english_pob_choice: lamb
  chosen_korean: 어린 양
  alternatives_korean:
  - 양 한 마리
  - 어린 가축 한 마리
  - 양이나 염소
  lexicon: HALOT
  rationale: 절기 문맥에서 POB의 ‘lamb’에 맞춰 ‘어린 양’을 택하되, 본문의 더 넓은 범주 가능성은 주석으로 열어 두는 편이 적절합니다.
- source_word: וְ/לָקַ֣ח ה֗וּא וּ/שְׁכֵנ֛/וֹ הַ/קָּרֹ֥ב אֶל בֵּית֖/וֹ
  english_pob_choice: then he and his nearest neighbor shall take one
  chosen_korean: 그는 자기 이웃 가운데 집에서 가까운 사람과 함께
  alternatives_korean:
  - 그는 자기 집 가까이에 있는 이웃과 함께
  - 그는 가장 가까운 이웃과 함께
  lexicon: HALOT
  rationale: הַקָּרֹב אֶל־בֵּיתוֹ는 단순한 거리보다 ‘집에서 가까운’ 관계를 강조하므로 그 뉘앙스를 살렸고, 동사는 다음 절과 합쳐 자연스럽게 처리했습니다.
- source_word: בְּ/מִכְסַ֣ת נְפָשֹׁ֑ת
  english_pob_choice: according to the number of persons
  chosen_korean: 사람 수를 따라
  alternatives_korean:
  - 인원수대로
  - 혼의 수를 따라
  - 사람들의 수에 따라
  lexicon: HALOT
  rationale: נְפָשֹׁת는 여기서 ‘영혼’이 아니라 사람들을 가리키므로, 오해를 피하면서도 계산 기준을 분명히 하는 ‘사람 수’를 택했습니다.
- source_word: אִ֚ישׁ לְ/פִ֣י אָכְל֔/וֹ
  english_pob_choice: each man according to what he can eat
  chosen_korean: 각 사람은 그가 먹을 수 있는 만큼
  alternatives_korean:
  - 각 사람은 그가 먹는 양에 따라
  - 각 남자는 그가 먹을 수 있는 것에 따라
  lexicon: HALOT
  rationale: 직역하면 ‘그의 먹음의 입에 따라’라는 관용구이므로, 의미를 드러내는 ‘먹을 수 있는 만큼’으로 옮겨 POB의 해석을 그대로 반영했습니다.
- source_word: תָּכֹ֖סּוּ עַל הַ/שֶּֽׂה
  english_pob_choice: you shall count for the lamb
  chosen_korean: 너희가 어린 양을 셀 것입니다
  alternatives_korean:
  - 너희가 어린 양을 계산할 것입니다
  - 너희가 어린 양에 맞추어 정할 것입니다
  lexicon: HALOT
  rationale: 동사는 배분 기준을 정하기 위한 ‘헤아리다/세다’의 뜻으로 이해되므로, 간결하게 ‘셀 것입니다’로 처리했습니다.
theological_decisions:
- issue: נְפָשֹׁת의 의미
  chosen_reading: ‘사람 수’로 이해하여, 본문이 요구하는 식사 인원을 계산하는 실무적 지시로 읽었습니다.
  alternative_readings:
  - ‘영혼의 수’로 문자적으로 옮기는 읽기
  - ‘가구 수’ 중심의 읽기
  rationale: 문맥상 제사/식사 분배의 기준을 정하는 구절이므로, 영적 개념을 끌어오지 않고 실제 참여 인원을 뜻하는 것으로 읽는 것이 가장 충실합니다.
  doctrine_reference: 본문 문맥 우선, 어휘의 평이한 문법적 의미
