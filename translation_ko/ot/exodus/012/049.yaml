  source_fidelity: 히브리어는 본토인(אֶזְרָח)과 공동체 가운데 거류하는 외국인(גֵּר הַגָּר בְּתוֹכְכֶם) 모두에게 단일한 법(תּוֹרָה אַחַת)이 있어야 함을 말합니다. 초안의 핵심 뜻은 보존되지만, ‘한 율법이 … 같아야 합니다’는 문법적 연결이 부자연스럽고, ‘같다’는 단일한 법의 소유·적용이라는 원문의 진술을 충분히 직접적으로 옮기지 못합니다.
