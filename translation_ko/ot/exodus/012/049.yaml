  text: 한 율법이 본토인에게나 너희 가운데 거류하는 나그네에게나 같아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 가르침이 본토인에게나 너희 가운데 거류하는 나그네에게나 같아야 합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: HALOT
  rationale: 유월절 준수에 관한 법적 규정이므로, 일반적 ‘가르침’보다 규범성과 구속력을 드러내는 ‘율법’이 원문의 기능을 더 잘 반영합니다.
- source_word: אַחַת
  english_pob_choice: one
  chosen_korean: 한
  alternatives_korean:
  - 하나의
  - 같은
  lexicon: HALOT
  rationale: 히브리어의 단일성 강조를 자연스러운 한국어 법문체로 옮기기 위해 ‘한 율법’으로 처리했습니다.
- source_word: אֶזְרָח
  english_pob_choice: the native
  chosen_korean: 본토인
  alternatives_korean:
  - 토박이
  - 본국민
  - 자국인
  lexicon: HALOT
  rationale: 언약 공동체 안의 토착 구성원을 가리키므로, 정치적 현대 용어인 ‘시민’보다 ‘본토인’이 원문의 사회적 대비를 더 안전하게 드러냅니다.
- source_word: גֵּר / הַגָּר
  english_pob_choice: the sojourner who sojourns
  chosen_korean: 너희 가운데 거류하는 나그네
  alternatives_korean:
  - 너희 가운데 머무는 외국인
  - 너희 중에 거주하는 이방인
  lexicon: HALOT
  rationale: גֵּר와 그 분사형의 중복을 한국어에서도 유지하되, ‘나그네’와 ‘거류하다’로 거주 외국인의 의미를 함께 살렸습니다.
theological_decisions:
- issue: 본토인과 거류민에게 동일한 규정이 적용된다는 법적 평등성
  chosen_reading: ‘한 율법이 ... 같아야 합니다’로 번역하여 동일한 기준의 적용을 분명히 했습니다.
  alternative_readings:
  - ‘같은 율법이 ...’
  - ‘한 규례가 ...’
  rationale: 본문은 차이를 허용하지 않는 단일 규범을 선포하므로, 현대 독자가 법적 동일성을 즉시 이해하도록 표현했습니다.
  doctrine_reference: 언약 공동체의 공정한 규례 적용
