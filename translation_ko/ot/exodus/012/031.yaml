translation:
  language: ko
  text: 그가 밤에 모세와 아론을 불러 말했습니다. “일어나십시오. 너희도 이스라엘 자손도 내 백성 가운데서 나가십시오. 그리고 가서, 너희가 말한 대로 야훼를 섬기십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: he called for
  chosen_korean: 불러
  alternatives_korean:
  - 소집하여
  - 불렀습니다
  lexicon: HALOT
  rationale: 긴박한 밤중의 왕의 요청을 한국어에서는 자연스럽게 ‘불러’로 살렸습니다. ‘소집하여’는 지나치게 행정적입니다.
- source_word: לַיְלָה
  english_pob_choice: by night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤중에
  - 밤중에
  lexicon: HALOT
  rationale: 시간 부사로서의 의미를 간결하게 옮겼습니다. 문맥상 밤이라는 표지가 중요하므로 앞쪽에 배치했습니다.
- source_word: מִתּוֹךְ עַמִּי
  english_pob_choice: from among my people
  chosen_korean: 내 백성 가운데서
  alternatives_korean:
  - 내 백성 한가운데서
  - 내 백성 속에서
  lexicon: HALOT
  rationale: 단순한 출발이 아니라 ‘~가운데서/속에서’ 빠져나오라는 의미를 살렸습니다. ‘가운데서’가 가장 자연스럽고 원문에 가깝습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 하나님의 고유명은 관용적 대체어가 아니라 음역으로 드러내는 것이 원문 대응에 가장 적절합니다. POB의 기준 용어를 따랐습니다.
theological_decisions:
- issue: 출애굽기 12:31의 명령체와 화자 재현
  chosen_reading: 왕의 직접 명령을 한국어에서 존대 명령형으로 옮겨, 청자에게 실제로 떨어지는 급박한 지시의 힘을 살렸습니다.
  alternative_readings:
  - 평서형으로 완화하여 옮기기
  - 더 완곡한 요청형으로 옮기기
  rationale: 히브리어 연속 명령(일어나라, 나가라, 섬기라)은 절박한 허가/추방의 성격을 가집니다. 한국어에서는 합쇼체 명령으로 표현해야 화자의 권위와 긴박감이 유지됩니다.
  doctrine_reference: 문체·화용 결정
