  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: And they baked the dough that they had brought out from Egypt into unleavened cakes[a], because it had not leavened; for they had been driven out from Egypt and could not delay[c][b], and they had not prepared provisions for themselves either.
  footnotes:
  - marker: a
    text: Or 'as cakes of unleavened bread.' The Hebrew expression refers to bread-cakes made without leaven.
    reason: lexical_alternative
  - marker: b
    text: Or 'because it was not leavened' or 'because it had not risen.' The Hebrew verb refers to the dough not becoming leavened before baking.
    reason: lexical_alternative
  - marker: c
    text: Or 'could not linger.' The sense is that they had no time to remain or wait.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이집트에서 가지고 나온 반죽을 누룩 없는 떡으로 구웠습니다[a]. 그 반죽이 발효되지 않았기 때문입니다[b]. 이는 그들이 이집트에서 쫓겨나 지체할 수 없었고[c], 자신들을 위한 양식도 준비하지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누룩 없는 떡 덩이들’로 옮길 수 있습니다. 히브리어 표현은 누룩 없이 만든 빵 덩어리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 반죽에 누룩이 들지 않았기 때문에’ 또는 ‘그 반죽이 부풀지 않았기 때문에’로 옮길 수 있습니다. 히브리어 동사는 반죽이 굽기 전에 누룩이 들어 발효되지 않았음을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘머무를 수 없었다’ 또는 ‘더 머물러 있을 수 없었다’로 옮길 수 있습니다. 이는 그들에게 기다리거나 지체할 시간이 없었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאפוּ
  english_pob_choice: they baked
  chosen_korean: 구웠습니다
  alternatives_korean:
  - 빵을 구웠습니다
  - 익혔습니다
  lexicon: HALOT
  rationale: אפה는 음식, 특히 빵이나 떡을 굽는 뜻이므로, 현대 한국어에서 자연스러운 ‘구웠습니다’가 원문의 행위를 가장 직접적으로 옮깁니다.
- source_word: עֻגֹת מַצּוֹת
  english_pob_choice: unleavened cakes
  chosen_korean: 무교병
  alternatives_korean:
  - 무누룩 떡
  - 누룩 없는 떡
  lexicon: HALOT
  rationale: 원문은 누룩 없이 만든 빵 덩어리/떡을 가리키므로, 교회 전통 용어이면서도 의미를 유지하는 ‘무교병’을 사용했습니다.
- source_word: כִּי לֹא חָמֵץ
  english_pob_choice: because it had not leavened
  chosen_korean: 그것이 발효되지 않았기 때문입니다
  alternatives_korean:
  - 그것이 누룩이 들지 않았기 때문입니다
  - 그것이 부풀지 않았기 때문입니다
  lexicon: HALOT
  rationale: חמץ는 반죽이 누룩으로 발효되는 과정을 말하므로, 상태를 단정적으로 풀어 ‘발효되지 않았다’고 옮기되, ‘부풀지 않았다’보다 원인-과정의 의미를 살렸습니다.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  english_pob_choice: and could not delay
  chosen_korean: 지체할 수 없었으며
  alternatives_korean:
  - 머무를 수 없었으며
  - 머뭇거릴 수 없었으며
  lexicon: HALOT
  rationale: התמהמה는 머물며 늦추는 뜻이므로, 문맥상 시간적 여유가 없다는 점을 살린 ‘지체할 수 없었습니다’가 가장 자연스럽습니다.
- source_word: צֵדָה
  english_pob_choice: provisions
  chosen_korean: 양식
  alternatives_korean:
  - 여행 식량
  - 보급품
  lexicon: HALOT
  rationale: צדה는 여행을 위한 준비 식량/양식을 뜻하므로, 너무 군사적이거나 현대 행정적인 ‘보급품’보다 ‘양식’이 문맥에 적합합니다.
theological_decisions:
- issue: 출애굽의 긴박성 묘사
  chosen_reading: ‘쫓겨나 왔고, 지체할 수 없었다’로 옮겨 출애굽의 강제성과 시간적 압박을 함께 드러냈습니다.
  alternative_readings:
  - ‘떠밀려 나왔고, 머무를 수 없었다’
  - ‘내쫓김을 당했고, 오래 머물 수 없었다’
  rationale: 원문의 גֹרְשׁוּ와 לְהִתְמַהְמֵהַּ는 단순 이동이 아니라 급박한 축출과 지연 불가를 함께 보여 주므로, 두 요소를 모두 보존했습니다.
  doctrine_reference: 출애굽기 12장 문맥상 유월절과 출애굽의 서두름을 강조하는 본문
- issue: 누룩 없는 떡의 형상
  chosen_reading: ‘무교병’으로 번역해 유월절 규례와 연결되는 제의적 함의를 유지했습니다.
  alternative_readings:
  - ‘누룩 없는 떡’
  - ‘무발효 떡’
  rationale: 이 본문은 단순한 조리법 설명이 아니라 유월절 사건과 직결된 표지이므로, 한국어 성서 용례에서 익숙한 ‘무교병’이 의미와 관습을 함께 살립니다.
  doctrine_reference: 출애굽기 12장 유월절 규례
