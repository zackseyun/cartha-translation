  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
  footnotes:
  - marker: a
    text: Or 'you shall put away/destroy leaven from your houses.' The Hebrew literally means 'you shall cause leaven to cease.'
    reason: lexical_alternative
  - marker: b
    text: '''Shall be cut off'' is a Hebrew legal expression. It may refer to expulsion from the community, death, or divine judgment; the verse itself does not specify the exact mode.'
    reason: alternative_reading
translation:
  language: ko
  text: 이레 동안 무교병을 드십시오. 그러나 첫째 날에는 각 집에서 누룩을 없애십시오[a]. 누룩 든 것을 먹는 사람은 누구나 첫째 날부터 일곱째 날까지 이스라엘에서 끊어질 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집에서 누룩을 치우거나 없애십시오.’ 히브리어는 문자적으로 ‘누룩을 그치게 하십시오’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘에서 끊어질 것입니다’는 히브리어 법률 표현입니다. 이는 공동체에서의 추방, 죽음, 또는 신적 심판을 가리킬 수 있으며, 본문 자체는 정확한 방식을 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
