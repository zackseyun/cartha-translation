  source_fidelity: 초안은 무교병을 이레 동안 먹으라는 명령, 첫째 날 누룩을 제거하라는 명령, 누룩 든 것을 먹는 자에게 내려지는 ‘이스라엘에서 끊어짐’의 제재를 대체로 충실히 옮겼습니다. 그러나 마지막 문장인 ‘이는 첫째 날부터 일곱째 날까지입니다’는 히브리어의 시간구를 독립 문장으로 오해하게 하며, 제재 조항에 연결해야 합니다.
