- from: 이레 동안은 무교병을 먹어야 합니다[a]. 그러나 첫째 날에는 집집마다 누룩을 없애야 합니다. 왜냐하면 누룩 든 것을 먹는 사람은 누구든지 그 사람[b]은 이스라엘에서 끊어질 것이기 때문입니다. 이는 첫째 날부터 일곱째 날까지입니다.
  to: 이레 동안 무교병을 드십시오. 그러나 첫째 날에는 각 집에서 누룩을 없애십시오[a]. 누룩 든 것을 먹는 사람은 누구나 첫째 날부터 일곱째 날까지 이스라엘에서 끊어질 것입니다[b].
  rationale: 시간구를 ‘이스라엘에서 끊어질 것입니다’에 연결하여 히브리어의 통사 및 의미 범위를 회복했습니다. 각주 a를 누룩 제거 명령에 붙여 각주 표지와 설명 대상의 불일치를 바로잡았고, ‘끊어짐’의 정확한 집행 방식은 각주에서만 가능한 범위로 설명하여 본문의 모호성을 보존했습니다.
