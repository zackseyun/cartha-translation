    rationale: ‘첫째 날부터 일곱째 날까지’는 본문에서 누룩 든 것을 먹는 행위에 대한 제재 조항의 기간을 나타냅니다. ‘이는 …까지입니다’로 분리하면 무엇을 가리키는지 불명확하고 원문의 통사 관계를 보존하지 못합니다.
