  terminology: ‘무교병’, ‘누룩’, ‘누룩 든 것’, ‘이스라엘에서 끊어질 것입니다’는 의례 및 법률 문맥에 적절합니다. ‘끊어짐’의 방식은 특정하지 않는 것이 타당합니다.
