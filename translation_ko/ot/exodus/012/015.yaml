  - 무교빵
  - 무교떡
  lexicon: HALOT
  rationale: 절기적 용어로 굳어진 표현을 살리면서도 현대 독자가 이해할 수 있게 했습니다.
- source_word: תַּשְׁבִּיתוּ שְּׂאֹר
  english_pob_choice: you shall remove leaven
  chosen_korean: 집집마다 누룩을 없애야 합니다
  alternatives_korean:
  - 집에서 누룩을 치워야 합니다
  - 집에서 누룩을 제거해야 합니다
  - 누룩을 끊어야 합니다
  lexicon: HALOT
  rationale: 히필의 ‘중지시키다/없애다’라는 동작성을 살리되, 한국어에서는 실제로 집에서 치우는 뜻이 자연스럽게 드러나도록 옮겼습니다.
- source_word: חָמֵץ
  english_pob_choice: anything leavened
  chosen_korean: 누룩 든 것
  alternatives_korean:
  - 누룩 들어간 것
  - 발효된 것
  - 누룩 있는 음식
  lexicon: HALOT
  rationale: 의례 규정에서 포괄적으로 금지되는 대상을 자연스럽게 전달했습니다. ‘빵’으로 한정하지 않기 위해 ‘것’을 유지했습니다.
- source_word: וְנִכְרְתָה
  english_pob_choice: shall be cut off
  chosen_korean: 끊어질 것이기 때문입니다
  alternatives_korean:
  - 제외될 것이기 때문입니다
  - 끊겨질 것입니다
  - 제명될 것이기 때문입니다
  lexicon: HALOT
  rationale: 법적 관용구를 직역해, 공동체적 추방인지 죽음인지 단정하지 않고 본문의 긴장을 보존했습니다.
- source_word: הַנֶּפֶשׁ הַהִוא
  english_pob_choice: that person
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 영혼
  - 그 생명
  - 그 자
  lexicon: HALOT
  rationale: 법률 문맥에서 נֶפֶשׁ는 개인을 가리키므로, 한국어에서는 ‘그 사람’이 가장 직접적입니다.
theological_decisions:
- issue: ‘cut off’ 형벌의 정확한 방식
  chosen_reading: ‘끊어질 것’으로 유지하여, 출애굽기 12:15의 제재가 추방·사망·신적 심판 중 무엇인지를 특정하지 않았습니다.
  alternative_readings:
  - 이스라엘에서 제외될 것입니다
  - 죽임을 당할 것입니다
  - 하나님의 심판을 받을 것입니다
  rationale: 히브리어 관용구가 지닌 언약적·법정적 무게를 유지하고, 본문이 밝히지 않은 집행 방식은 해석으로 확정하지 않기 위함입니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
