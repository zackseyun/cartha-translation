  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
  footnotes:
  - marker: a
    text: Or 'you shall put away/destroy leaven from your houses.' The Hebrew literally means 'you shall cause leaven to cease.'
    reason: lexical_alternative
  - marker: b
    text: '''Shall be cut off'' is a Hebrew legal expression. It may refer to expulsion from the community, death, or divine judgment; the verse itself does not specify the exact mode.'
    reason: alternative_reading
translation:
  language: ko
  text: 이레 동안은 무교병을 먹어야 합니다[a]. 그러나 첫째 날에는 집집마다 누룩을 없애야 합니다. 왜냐하면 누룩 든 것을 먹는 사람은 누구든지 그 사람[b]은 이스라엘에서 끊어질 것이기 때문입니다. 이는 첫째 날부터 일곱째 날까지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집에서 누룩을 치워야 합니다.’ 히브리어는 문자적으로 ‘누룩이 그치게 해야 합니다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끊어질 것’은 히브리어 법률 표현입니다. 이는 공동체에서의 추방, 죽음, 또는 신적 심판을 가리킬 수 있으며, 본문 자체는 정확한 방식을 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  english_pob_choice: unleavened bread
  chosen_korean: 무교병
  alternatives_korean:
  - 누룩 없는 빵
  - 무교빵
  - 무교떡
  lexicon: HALOT
  rationale: 절기적 용어로 굳어진 표현을 살리면서도 현대 독자가 이해할 수 있게 했습니다.
- source_word: תַּשְׁבִּיתוּ שְּׂאֹר
  english_pob_choice: you shall remove leaven
  chosen_korean: 집집마다 누룩을 없애야 합니다
  alternatives_korean:
  - 집에서 누룩을 치워야 합니다
  - 집에서 누룩을 제거해야 합니다
  - 누룩을 끊어야 합니다
  lexicon: HALOT
  rationale: 히필의 ‘중지시키다/없애다’라는 동작성을 살리되, 한국어에서는 실제로 집에서 치우는 뜻이 자연스럽게 드러나도록 옮겼습니다.
- source_word: חָמֵץ
  english_pob_choice: anything leavened
  chosen_korean: 누룩 든 것
  alternatives_korean:
  - 누룩 들어간 것
  - 발효된 것
  - 누룩 있는 음식
  lexicon: HALOT
  rationale: 의례 규정에서 포괄적으로 금지되는 대상을 자연스럽게 전달했습니다. ‘빵’으로 한정하지 않기 위해 ‘것’을 유지했습니다.
- source_word: וְנִכְרְתָה
  english_pob_choice: shall be cut off
  chosen_korean: 끊어질 것이기 때문입니다
  alternatives_korean:
  - 제외될 것이기 때문입니다
  - 끊겨질 것입니다
  - 제명될 것이기 때문입니다
  lexicon: HALOT
  rationale: 법적 관용구를 직역해, 공동체적 추방인지 죽음인지 단정하지 않고 본문의 긴장을 보존했습니다.
- source_word: הַנֶּפֶשׁ הַהִוא
  english_pob_choice: that person
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 영혼
  - 그 생명
  - 그 자
  lexicon: HALOT
  rationale: 법률 문맥에서 נֶפֶשׁ는 개인을 가리키므로, 한국어에서는 ‘그 사람’이 가장 직접적입니다.
theological_decisions:
- issue: ‘cut off’ 형벌의 정확한 방식
  chosen_reading: ‘끊어질 것’으로 유지하여, 출애굽기 12:15의 제재가 추방·사망·신적 심판 중 무엇인지를 특정하지 않았습니다.
  alternative_readings:
  - 이스라엘에서 제외될 것입니다
  - 죽임을 당할 것입니다
  - 하나님의 심판을 받을 것입니다
  rationale: 히브리어 관용구가 지닌 언약적·법정적 무게를 유지하고, 본문이 밝히지 않은 집행 방식은 해석으로 확정하지 않기 위함입니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
