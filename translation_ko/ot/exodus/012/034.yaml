  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א הָ/עָ֛ם אֶת בְּצֵק֖/וֹ טֶ֣רֶם יֶחְמָ֑ץ מִשְׁאֲרֹתָ֛/ם צְרֻרֹ֥ת בְּ/שִׂמְלֹתָ֖/ם עַל שִׁכְמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/034.yaml
  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
  footnotes:
  - marker: a
    text: Or 'their kneading troughs.' The Hebrew term refers to containers used in preparing dough.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성은 누룩이 들기 전에 반죽을 가지고 갔습니다. 그들은 반죽 그릇들을 겉옷에 싸서 묶어 어깨에 메었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '반죽 통들'로 옮길 수 있습니다. 히브리어는 반죽을 준비하는 데 쓰는 용기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  english_pob_choice: carried
  chosen_korean: 가지고 나갔습니다
  alternatives_korean:
  - 들고 갔습니다
  - 메고 나갔습니다
  lexicon: HALOT
  rationale: 출애굽의 이동 맥락에서 단순한 '들다'보다 이동성을 드러내는 '가지고 나가다'가 자연스럽고, 본문이 말하는 운반 행위를 잘 살립니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 그 백성
  lexicon: HALOT
  rationale: 출애굽기 내러티브에서 이스라엘 공동체를 가리키는 הָעָם은 한국어 성경 문맥에서 '백성'이 가장 간결하고 분명합니다.
- source_word: טֶרֶם יֶחְמָץ
  english_pob_choice: before it was leavened
  chosen_korean: 누룩이 들기도 전에
  alternatives_korean:
  - 발효되기 전에
  - 누룩이 들어가기 전에
  lexicon: HALOT
  rationale: 히브리어의 상태 변화를 한국어 관용으로 옮기면 '누룩이 들다'가 출애굽/유월절 맥락을 가장 잘 전달합니다.
- source_word: מִשְׁאֲרֹתָם
  english_pob_choice: their kneading bowls
  chosen_korean: 반죽 그릇
  alternatives_korean:
  - 반죽 통
  - 반죽 대야
  lexicon: HALOT
  rationale: 영어 POB가 제시한 제분·반죽용 용기를 따라, 현대 독자가 이해할 수 있도록 기능 중심의 '반죽 그릇'으로 옮겼습니다.
- source_word: צְרֻרֹת בְּשִׂמְלֹתָם
  english_pob_choice: bound up in their cloaks
  chosen_korean: 옷에 싸서
  alternatives_korean:
  - 겉옷에 묶어
  - 망토에 둘러
  lexicon: HALOT
  rationale: 묶여 있음을 나타내는 צְרֻרֹת과 외투류를 뜻하는 שִׂמְלָה를 함께 살리되, 한국어에서는 '옷에 싸다'가 가장 자연스럽게 보따리처럼 묶은 이미지를 전달합니다.
theological_decisions:
- issue: 출애굽의 긴급성과 미완성 상태
  chosen_reading: 백성이 누룩이 들기도 전에 반죽을 가지고 나간 것으로 옮겨, 급박한 떠남과 아직 준비되지 않은 상태를 드러냈습니다.
  alternative_readings:
  - 단순히 '빨리 나갔습니다'로 완화
  - '''발효되기 전에''처럼 기술적으로만 표현'
  rationale: 본문의 핵심은 시간이 촉박했던 출발과 유월절 심판 직후의 급박함이므로, 그 긴장감을 한국어에서도 유지해야 합니다.
  doctrine_reference: 출애굽기 12장 유월절 문맥
