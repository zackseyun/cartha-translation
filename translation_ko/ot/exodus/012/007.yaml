  text: וְ/לָֽקְחוּ֙ מִן הַ/דָּ֔ם וְ/נָֽתְנ֛וּ עַל שְׁתֵּ֥י הַ/מְּזוּזֹ֖ת וְ/עַל הַ/מַּשְׁק֑וֹף עַ֚ל הַ/בָּ֣תִּ֔ים אֲשֶׁר יֹאכְל֥וּ אֹת֖/וֹ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/007.yaml
  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
  footnotes:
  - marker: a
    text: Or 'where they will eat it.' The Hebrew imperfect can be rendered with a future nuance in this instructional context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 피의 일부를 가져다가 두 문설주와 집들의 인방에 바르십시오. 그 집들에서 그것을 먹을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관계절은 ‘그들이 그것을 먹는 집들에서/곳에서’로도 옮길 수 있습니다. 문맥상 장소 의미를 반영해 본문에는 자연스럽게 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  english_pob_choice: And they shall take
  chosen_korean: 가져다가
  alternatives_korean:
  - 가져오고
  - 취하고
  lexicon: HALOT
  rationale: 지시문맥의 미래·명령적 흐름을 살리면서, 뒤의 ‘피의 일부’를 목적어로 자연스럽게 이어 주는 동작 동사로 ‘가져다가’를 택했습니다.
- source_word: וְנָתְנוּ
  english_pob_choice: and put
  chosen_korean: 바르십시오
  alternatives_korean:
  - 두십시오
  - 놓으십시오
  - 발라 두십시오
  lexicon: HALOT
  rationale: 문설주와 인방에 피를 ‘적용’하는 제의적 행위이므로 단순한 배치보다 표면에 묻히는 느낌을 주는 ‘바르다’가 원문 의도에 가깝습니다.
- source_word: שְׁתֵּי הַמְּזוּזֹת / הַמַּשְׁקוֹף
  english_pob_choice: the two doorposts / the lintel
  chosen_korean: 두 문설주와 집들의 인방
  alternatives_korean:
  - 두 문기둥과 인방
  - 두 문설주와 문 위 가로보
  lexicon: HALOT
  rationale: מְזוּזוֹת는 문설주, מַשְׁקוֹף는 문 위의 가로부재인 인방이므로, 건축 용어를 비교적 정확하게 살렸습니다.
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָּהֶם
  english_pob_choice: in which they eat it
  chosen_korean: 그 집들에서 그것을 먹을 것입니다
  alternatives_korean:
  - 그 집들 안에서 그것을 먹게 될 것입니다
  - 그 집들에서 그것을 먹습니다
  lexicon: HALOT
  rationale: 관계절의 장소 의미를 한국어에서는 자연스럽게 주절에 흡수해, 집이 식사의 장소임을 분명히 했습니다.
theological_decisions:
- issue: 지시문맥의 עתיד/명령적 미래 처리
  chosen_reading: 서술형 미래 대신 공손한 명령형으로 번역해, 이 절이 유월절 규례의 지시문임을 분명히 했습니다.
  alternative_readings:
  - 그들은 … 가져다가 바를 것입니다
  - 그들은 … 가져다 바르십시오
  rationale: 히브리어 완료형 연속은 절차 지시에서 규범적 미래/명령으로 기능하므로, 한국어에서도 수행 지시의 힘을 살리는 것이 적절합니다.
  doctrine_reference: 출 12장의 유월절 규례 문맥
