  terminology: מְזוּזוֹת는 ‘문설주’, מַשְׁקוֹף는 ‘인방’으로 정확합니다. מִן הַדָּם의 부분 의미는 ‘피의 일부’로 유지했습니다. ‘바르십시오’는 이 문맥에서 안전하고 자연스러운 적용 표현입니다.
