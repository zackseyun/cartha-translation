  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
  footnotes:
  - marker: a
    text: Or 'where they will eat it.' The Hebrew imperfect can be rendered with a future nuance in this instructional context.
