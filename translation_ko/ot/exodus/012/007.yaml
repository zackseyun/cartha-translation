  rationale: 관계절을 ‘집들’에 직접 연결하여 원문의 구문과 절차 지시의 흐름을 보존했습니다. ‘두 문설주와 인방’ 전체가 해당 집들에 속함을 드러냈고, 미완료형의 현재적·미래적 번역 가능성은 각주에서만 제시했습니다.
