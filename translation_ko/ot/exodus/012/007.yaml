  source_fidelity: 주절은 절차 지시로 적절히 명령형으로 옮겼으나, 관계절의 יֹאכְלוּ를 독립적인 서술형 미래(“먹을 것입니다”)로 처리하여 원문의 관계절 구조와 지시적 흐름이 약화되었습니다. 또한 ‘집들의 인방’은 두 문설주와 인방 모두가 해당 집들에 속한다는 원문의 수식을 충분히 반영하지 못합니다.
