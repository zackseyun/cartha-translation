  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
  footnotes:
  - marker: a
    text: Hebrew 'the Passover'; that is, the Passover sacrifice or victim.
    reason: lexical_alternative
  - marker: b
    text: '''Draw out'' may also be understood as ''select'' or ''pull out'' from the flock.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew word for the animal is broader than 'lamb' and can refer to small livestock from the flock.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 이스라엘의 모든 장로를 불러 그들에게 말했습니다. 「너희는 나가서 너희 가족별로 양을 준비하고, 유월절 제물을 잡으십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘유월절’, 곧 유월절 제물 또는 희생을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나가서’는 히브리어 동사의 구체적 동작 이미지를 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 짐승 명칭은 ‘양’보다 넓어, 작은 가축 전반을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called for
  chosen_korean: 불러
  alternatives_korean:
  - 불렀습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: 장로들을 불러 지시를 전달하는 상황이므로, 단순한 ‘부르다’보다 자연스럽게 회집시키는 뉘앙스를 살린 ‘불러’가 적절합니다.
- source_word: זִקְנֵי יִשְׂרָאֵל
  english_pob_choice: the elders of Israel
  chosen_korean: 이스라엘의 모든 장로
  alternatives_korean:
  - 이스라엘의 장로들
  - 이스라엘 장로들
  lexicon: HALOT
  rationale: 공동체를 대표하는 지도자 전체를 가리키므로, ‘모든’을 넣어 집합적 의미를 드러냈습니다.
- source_word: מִשְׁכוּ וּקְחוּ
  english_pob_choice: Draw out and take
  chosen_korean: 나가서 … 양을 준비하고
  alternatives_korean:
  - 끌어내고 취하고
  - 뽑아내고 가져가고
  - 선택하고 가져가고
  lexicon: HALOT
  rationale: ‘draw out’의 직역적 이미지는 살리되 한국어에서는 명령의 기능이 분명하도록 ‘나가서 … 준비하고’로 옮겼습니다. 동시에 שני 동사의 연속 명령이 보이도록 구조를 유지했습니다.
- source_word: צֹאן
  english_pob_choice: sheep from the flock
  chosen_korean: 양
  alternatives_korean:
  - 가축
  - 작은 가축
  - 양 떼의 짐승
  lexicon: HALOT
  rationale: 히브리어는 양 떼의 가축 전반을 가리킬 수 있지만, 본절의 제의적 문맥에서는 한국어로 간결하고 자연스러운 ‘양’이 가장 적절합니다.
- source_word: הַפָּסַח
  english_pob_choice: the Passover lamb
  chosen_korean: 유월절 제물
  alternatives_korean:
  - 유월절
  - 유월절 희생제물
  - 유월절 양
  lexicon: HALOT
  rationale: 히브리어는 절기 자체를 가리키면서도 여기서는 제의적 희생동물을 메톤미로 지시하므로, 그 의미를 분명히 하는 ‘유월절 제물’이 원문에 가장 충실합니다.
theological_decisions:
- issue: הַפָּסַח의 지시 대상
  chosen_reading: 절기 이름이 아니라 유월절에 바치는 희생 제물을 가리키는 표현으로 이해해 ‘유월절 제물’로 옮겼습니다.
  alternative_readings:
  - 유월절
  - 유월절 양
  - 유월절 희생제물
  rationale: 본문은 단순한 절기 명칭이 아니라 잡아서 바칠 대상을 말하므로, 제의적 의미를 드러내는 번역이 오독을 줄입니다.
  doctrine_reference: 출애굽기 12장의 유월절 규례와 제사적 맥락
