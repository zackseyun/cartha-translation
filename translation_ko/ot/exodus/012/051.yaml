  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
  footnotes:
  - marker: a
    text: Or 'the children of Israel' or 'the Israelites.' The Hebrew reads 'the sons of Israel,' a corporate familial expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'according to their hosts' or 'with their companies.' The Hebrew may emphasize Israel's ordered groupings as they departed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 바로, 야훼께서 이스라엘 자손을 그들의 군대 편성대로 이집트 땅에서 이끌어 내셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 자녀들’, ‘이스라엘 사람들’. 히브리어는 ‘이스라엘의 아들들’로, 공동체를 가리키는 친족적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 군대대로’, ‘그들의 떼지어 있음에 따라’. 히브리어는 이스라엘이 질서 있게 편성된 집단으로 나왔음을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  english_pob_choice: on that very day
  chosen_korean: 그날 바로
  alternatives_korean:
  - 그 바로 그날
  - 그날 그때
  lexicon: HALOT
  rationale: 히브리어의 강조 표현을 한국어의 시간 부사구로 자연스럽게 옮기되, ‘바로’를 넣어 ‘그 날 자체’를 강조하는 힘을 살렸습니다.
- source_word: הוֹצִיא
  english_pob_choice: brought ... out
  chosen_korean: 이끌어 내셨습니다
  alternatives_korean:
  - 끌어 내셨습니다
  - 데리고 나오셨습니다
  lexicon: HALOT
  rationale: 출애굽 맥락의 사역형 동사를 한국어에서 자연스럽고 능동적인 구문으로 살렸으며, 단순 이동이 아니라 구출·인도의 의미를 함께 드러냈습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 친족·언약적 표현을 살리면서도 한국어 성경에서 널리 이해되는 관용형을 유지했습니다.
- source_word: עַל צִבְאֹתָם
  english_pob_choice: according to their divisions
  chosen_korean: 그들의 군대 편성대로
  alternatives_korean:
  - 그들의 진영대로
  - 그들의 편성대로
  - 그들의 대열대로
  lexicon: HALOT
  rationale: צִבְאֹתָם의 조직된 집단/대열의 뜻을 반영해, 단순한 ‘부대’보다 출애굽 당시의 질서 있는 편성을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 표준에 따라 Tetragrammaton을 고유한 신적 이름으로 보존해, 본문이 가진 언약적·역사적 직접성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 이스라엘 집단의 표기
  chosen_reading: ‘이스라엘 자손’을 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어의 직설적인 친족 표현을 보존해, 출애굽 사건이 혈연·언약 공동체 전체에 대한 행위임을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #4: Gender-accurate over gender-neutral'
