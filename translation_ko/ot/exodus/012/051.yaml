  - marker: b
    text: Or 'according to their hosts' or 'with their companies.' The Hebrew may emphasize Israel's ordered groupings as they departed.
    reason: lexical_alternative
translation:
  language: ko
  text: 바로 그날, 야훼께서 이스라엘 자손[a]을 그들의 편성대로[b] 이집트 땅에서 이끌어 내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘의 아들들’, ‘이스라엘 사람들’. 히브리어는 ‘이스라엘의 아들들’로, 공동체를 가리키는 친족적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 군대대로’, ‘그들의 무리대로’, ‘그들의 대열대로’. 히브리어는 이스라엘이 질서 있게 편성된 집단으로 나왔음을 강조할 수 있습니다.
    reason: lexical_alternative
