review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the prohibitions against eating the animal raw or boiled in water and the exclusive requirement of fire-roasting. However, its final wording, ‘곧 머리와 다리와 내장과 함께 먹어야 합니다,’ makes the listed parts sound merely like accompaniments to eating rather than parts included in the fire-roasting. The Hebrew phrase modifies the roasting requirement.
  naturalness: The sequence ‘불에 구워서, 곧 … 함께 먹어야 합니다’ is syntactically awkward and mixes a prohibition with a declarative obligation. A parallel formal imperative is clearer and more natural in modern 합쇼체.
  terminology: ‘날것,’ ‘물에 삶다,’ ‘불에 굽다,’ and ‘내장’ are appropriate in this culinary and ritual context. ‘내장’ is a natural rendering of קֶרֶב while retaining the concrete sense. The proposed footnote should give a genuinely more literal representation of the Hebrew construction rather than repeat the main wording.
  issues:
  - severity: medium
    issue: The phrase concerning head, legs, and inner parts is attached to eating rather than roasting.
    rationale: In Hebrew, ‘roasted with fire’ is followed by the specification ‘its head with its legs and with its inner part’; the parts describe how the animal is to be roasted, not what is to be eaten alongside it.
  - severity: medium
    issue: The draft’s final clause changes the command form and creates an awkward construction.
    rationale: ‘먹지 말고 … 먹어야 합니다’ is less direct than the source’s prohibition followed by exclusive positive instruction. Imperatives preserve the legal-regulatory force and read naturally in formal Korean.
  - severity: low
    issue: The existing footnote duplicates the main text rather than presenting the stated literal alternative.
    rationale: A lexical-alternative note should reflect the Hebrew’s more explicit relational phrasing, such as ‘머리는 다리와 함께, 또 내장과 함께.’
  revised_text: 그것을 날것으로도 물에 삶아서도 먹지 마십시오. 오직 머리와 다리와 내장을 함께[a] 불에 구워 드십시오.
  revised_footnotes:
