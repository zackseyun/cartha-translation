base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
  footnotes:
  - marker: a
    text: Or, more literally, 'its head with its legs and with its entrails.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 날것으로도 물에 삶아서도 먹지 마십시오. 오직 머리와 다리와 내장을 함께[a] 불에 구워 드십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘머리는 다리와 함께, 또 내장과 함께’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאכְלוּ מִמֶּנּוּ
  english_pob_choice: Do not eat any of it
  chosen_korean: 그것을 ... 먹지 말고
  alternatives_korean:
  - 그것의 아무 부분도 먹지 말고
  - 그것을 먹지 말고
  lexicon: HALOT
  rationale: 부정 명령으로서 핵심은 ‘그것을 먹지 말라’는 금지이며, 한국어에서는 목적어를 앞에 두어 자연스럽게 옮기는 것이 좋습니다.
- source_word: נָא
  english_pob_choice: raw
  chosen_korean: 날것으로
  alternatives_korean:
  - 생으로
  - 덜 익은 채로
  lexicon: HALOT
  rationale: 고기 조리 문맥에서 נָא는 불로 익히지 않은 상태를 가리키므로, ‘날것으로’가 가장 직접적이고 현대적인 대응입니다.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  english_pob_choice: or boiled in water
  chosen_korean: 물에 삶아서도
  alternatives_korean:
  - 물에 끓여서도
  - 물에 조리해서도
  lexicon: HALOT
  rationale: ‘삶다/끓이다’ 가운데 여기서는 물을 매개로 익히는 금지를 분명히 드러내야 하므로, ‘물에 삶아서’가 가장 분명합니다.
- source_word: צְלִי אֵשׁ
  english_pob_choice: roasted over the fire
  chosen_korean: 불에 구워서
  alternatives_korean:
  - 불로 구워서
  - 불에 익혀서
  lexicon: HALOT
  rationale: 히브리어는 불을 이용한 구이를 뜻하므로, 한국어에서는 의미가 자연스럽게 드러나는 ‘불에 구워서’로 옮겼습니다.
- source_word: רֹאשׁוֹ עַל כְּרָעָיו וְעַל קִרְבּוֹ
  english_pob_choice: with its head, its legs, and its inner parts
  chosen_korean: 곧 머리와 다리와 내장과 함께
  alternatives_korean:
  - 머리와 다리와 내장까지 함께
  - 머리, 다리, 그리고 내장과 함께
  lexicon: HALOT
  rationale: 반복된 עַל은 목록 항목을 ‘~와 함께’로 묶는 효과가 있으므로, ‘곧’으로 설명을 보강하고 ‘내장’으로 더 직설적으로 표현했습니다.
theological_decisions:
- issue: 제물의 조리 방식에 대한 금지의 강도
  chosen_reading: 단순한 조리법 안내가 아니라, 유월절 양을 지정된 방식으로만 먹어야 한다는 엄격한 규정으로 옮겼습니다.
  alternative_readings:
  - 일반적인 식사 예법 안내로 완화하는 번역
  - ‘오직’의 배제를 약하게 처리하는 번역
  rationale: 문맥상 이 절은 유월절 규례의 배타적 요구를 강조하므로, ‘오직’과 부정 명령의 강도를 유지해야 합니다.
  doctrine_reference: 출애굽기 12장의 유월절 규례
