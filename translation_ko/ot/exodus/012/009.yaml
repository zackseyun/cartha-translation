    text: 또는 더 직역하면, ‘머리는 다리와 함께, 또 내장과 함께’입니다.
    reason: lexical_alternative
  revision_rationale: The revision retains the specific ban on raw and water-boiled preparation and preserves the exclusivity of fire-roasting. It places the head, legs, and inner parts within the roasting instruction, as the Hebrew syntax requires, while using clear modern formal-polite imperatives. The footnote now supplies a meaningful literal alternative corresponding to the repeated Hebrew relational phrase.
