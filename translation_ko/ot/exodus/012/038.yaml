  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם עֵ֥רֶב רַ֖ב עָלָ֣ה אִתָּ֑/ם וְ/צֹ֣אן וּ/בָקָ֔ר מִקְנֶ֖ה כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/038.yaml
  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
  footnotes:
  - marker: a
    text: Or 'a great mixed company' or 'a mixed crowd.' The Hebrew phrase עֵרֶב רַב denotes a heterogeneous group accompanying Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 잡족도 그들과 함께 올라갔고, 양 떼와 소 떼, 곧 매우 많은 가축도 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵרֶב רַב
  english_pob_choice: a mixed multitude
  chosen_korean: 잡족
  alternatives_korean:
  - 섞인 무리
  - 혼합된 큰 무리
  - 잡다한 무리
  lexicon: HALOT
  rationale: 이 표현은 이스라엘과 함께 올라간 이질적 집단을 가리키므로, 전통적 교회어보다 의미를 직접 드러내는 ‘잡족’이 원문의 혼합성과 집단성을 간결하게 살립니다.
- source_word: עָלָה אִתָּם
  english_pob_choice: went up with them
  chosen_korean: 그들과 함께 올라갔고
  alternatives_korean:
  - 그들과 함께 갔고
  - 그들과 함께 올라왔고
  - 그들과 동행했고
  lexicon: HALOT
  rationale: עָלָה의 출애굽 서술 관용을 살려 ‘올라가다’를 유지했고, אִתָּם은 단순히 동반 관계를 나타내므로 ‘그들과 함께’로 옮겼습니다.
- source_word: וְצֹאן וּבָקָר
  english_pob_choice: flocks and herds
  chosen_korean: 양 떼와 소 떼
  alternatives_korean:
  - 양과 소
  - 작은 가축과 큰 가축
  - 양 떼와 가축 떼
  lexicon: HALOT
  rationale: צֹאן과 בָקָר의 구분을 살리면서도 자연스러운 한국어로 ‘양 떼와 소 떼’라고 옮겨, 두 종류의 가축이 함께 언급된다는 점을 드러냈습니다.
- source_word: מִקְנֶה כָּבֵד מְאֹד
  english_pob_choice: a very great amount of livestock
  chosen_korean: 매우 많은 가축
  alternatives_korean:
  - 지극히 많은 가축
  - 매우 큰 가축 떼
  - 대단히 많은 가축
  lexicon: HALOT
  rationale: כָּבֵד+מְאֹד는 ‘무겁다’의 문자적 의미보다 ‘매우 많은’이라는 양적 풍성을 나타내므로, 한국어에서는 어색한 직역을 피하고 자연스럽게 수량을 표현했습니다.
