  terminology: ‘이스라엘 자손’, ‘모세’, ‘이집트 사람들’, ‘옷’은 적절합니다. כְּלִי는 ‘그릇’으로 한정하지 않고 ‘물품’으로 옮기는 것이 원문의 의미 범위에 더 맞습니다. 각주도 ‘빌리다’가 본문 동사의 필수 의미가 아니라는 점을 적절히 설명합니다.
