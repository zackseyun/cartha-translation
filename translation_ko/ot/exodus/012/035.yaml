translation:
  language: ko
  text: 이스라엘 자손은 모세의 말을 따라 행하였고, 이집트 사람들에게 은으로 된 물품과 금으로 된 물품과 옷을 요청하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שאל의 기본 의미는 ‘묻다, 요청하다’입니다. 오래된 번역의 ‘빌리다’는 이 동사에 필수적인 뜻이 아닙니다.
    reason: lexical_alternative
