  source_fidelity: 히브리어 본문은 이스라엘 자손이 모세의 말에 따라 이집트인들에게 은과 금의 כְּלִים 및 옷을 요청했다고 말합니다. 초안의 ‘은그릇과 금그릇’은 כְּלִי의 넓은 의미를 식기나 용기로 불필요하게 한정합니다. ‘요청하였습니다’는 וַיִּשְׁאֲלוּ의 문맥상 기본 의미를 충실히 반영합니다.
