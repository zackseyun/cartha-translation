base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
  footnotes:
  - marker: a
    text: Or 'requested.' Older English versions often have 'borrowed,' but the Hebrew verb here ordinarily means 'asked' or 'requested.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손은 모세의 말을 따라 행하였고, 이집트 사람들에게 은그릇과 금그릇과 옷을 요청하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שאל의 기본 의미는 ‘묻다, 요청하다’입니다. 오래된 번역의 ‘빌리다’는 이 동사에 필수적인 뜻이 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 족속 표현을 살리면서도 한국어에서 자연스럽게 읽히는 전통적 대응어를 사용했습니다.
- source_word: כִּדְבַר מֹשֶׁה
  english_pob_choice: according to the word of Moses
  chosen_korean: 모세의 말을 따라
  alternatives_korean:
  - 모세의 말대로
  - 모세의 말씀에 따라
  - 모세의 지시에 따라
  lexicon: HALOT
  rationale: דבר의 기본 의미인 ‘말/말씀’을 살리되, 현대 한국어에서는 ‘말을 따라’가 가장 자연스럽고 과도한 해석을 덜어 줍니다.
- source_word: וַיִּשְׁאֲלוּ
  english_pob_choice: asked
  chosen_korean: 요청하였습니다
  alternatives_korean:
  - 물었습니다
  - 구하였습니다
  - 빌렸습니다
  lexicon: HALOT
  rationale: 히브리어 שאל의 기본 의미는 ‘묻다, 요구하다/청하다’이므로, ‘빌리다’는 피하고 문맥에 맞는 정중한 요청 표현을 택했습니다.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  english_pob_choice: articles of silver and articles of gold
  chosen_korean: 은그릇과 금그릇
  alternatives_korean:
  - 은 물품과 금 물품
  - 은 기물과 금 기물
  - 은제 물건과 금제 물건
  lexicon: HALOT
  rationale: כְּלִי는 넓은 범주의 ‘그릇/기물’이지만, 한국어에서는 반복되는 구조를 간결하게 살리기 위해 ‘은그릇과 금그릇’으로 옮겼습니다.
- source_word: וּשְׂמָלֹת
  english_pob_choice: clothing
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 의류
  - 옷가지
  lexicon: HALOT
  rationale: שִׂמְלָה의 넓은 의미를 현대 독자가 바로 이해하도록 가장 기본적이고 포괄적인 ‘옷’으로 번역했습니다.
theological_decisions:
- issue: וַיִּשְׁאֲלוּ의 의미를 ‘빌리다’로 볼지 여부
  chosen_reading: ‘요청하였습니다’로 옮겨, 본문이 말하는 행위 자체를 중립적으로 드러냈습니다.
  alternative_readings:
  - 빌렸습니다
  - 구하였습니다
  rationale: 출애굽기 본문은 이 동사의 어휘적 의미보다 결과와 서술 맥락이 중요하므로, 도덕적·신학적 판단을 덧씌우는 ‘빌리다’를 피했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
