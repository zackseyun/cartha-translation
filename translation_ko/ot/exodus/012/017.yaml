  verdict: revise
  source_fidelity: 히브리어 הַמַּצּוֹת는 문자적으로 ‘누룩 없는 것들/빵들’이지만, 이 문맥에서 שׁמר의 목적어로 쓰여 절기 준수를 가리키는 용법이 자연스럽습니다. 따라서 본문에서 ‘누룩 없는 빵을 지키다’라고 하면 음식 자체를 보존한다는 뜻으로 읽힐 수 있습니다. צִבְאוֹתֵיכֶם의 질서 있게 조직된 집단이라는 뉘앙스도 본문과 주석에서 유지했습니다.
  naturalness: ‘무교절을 지키다’, ‘바로 이날’, ‘대대로’, ‘영구한 규례로’가 표준 현대 한국어 합쇼체 성서 문맥에서 자연스럽습니다. 기존의 ‘누룩 없는 빵을 지키다’와 ‘너희 세대에 걸쳐’는 각각 결합과 표현이 다소 부자연스럽습니다.
  terminology: ‘무교절’은 한국어 성서 용례에서 널리 통용되는 절기명이며, 문자적 표현과 가능한 음식 의미는 각주에서 보존합니다. צְבָאוֹת는 ‘대오’로 옮겨 군사적·조직적 뉘앙스를 유지하되, 현대 한국어에서 ‘너희 군대’가 실제 전투 군대를 직접 가리키는 과도한 인상을 줄 수 있는 점을 피했습니다. חֻקַּת עוֹלָם은 ‘영구한 규례’로 옮기고 대안을 각주에 제시합니다.
