source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ אֶת הַ/מַּצּוֹת֒ כִּ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה הוֹצֵ֥אתִי אֶת צִבְאוֹתֵי/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וּ/שְׁמַרְתֶּ֞ם אֶת הַ/יּ֥וֹם הַ/זֶּ֛ה לְ/דֹרֹתֵי/כֶ֖ם חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
  footnotes:
  - marker: a
    text: Or 'the Feast of Unleavened Bread.' The Hebrew literally says 'the unleavened breads/things,' which can refer to the bread itself or, by extension, the festival observance.
    reason: lexical_alternative
  - marker: b
    text: Or 'your multitudes,' 'your divisions,' or 'your companies.' The Hebrew 'hosts' portrays Israel as an ordered body coming out of Egypt.
    reason: lexical_alternative
  - marker: c
    text: Or 'as a statute forever' or 'as an everlasting statute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 누룩 없는 빵을 지켜야 합니다[a]. 이는 바로 이 날에 내가 너희 군대[b]를 이집트 땅에서 이끌어 냈기 때문입니다. 너희는 이 날을 너희 세대에 걸쳐 영원한 규례[c]로 지켜야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무교절’. 히브리어는 문자적으로 ‘누룩 없는 것들/빵들’을 뜻하며, 빵 자체나 그와 연결된 절기 준수를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희 무리들’, ‘너희 분대들’, ‘너희 부대들’. 히브리어는 이스라엘을 질서 있게 편성된 집단으로 묘사합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘세세토록 지킬 규례’, ‘영구한 규례’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  english_pob_choice: you shall keep
  chosen_korean: 지켜야 합니다
  alternatives_korean:
  - 지켜야 합니다
  - 준수해야 합니다
  - 지켜야 합니다/준수해야 합니다
  lexicon: HALOT
  rationale: שׁמר는 문맥상 예식적 준수와 보존의 뜻을 함께 가지므로, 한국어에서는 자연스럽게 ‘지키다’로 옮겨 반복 구조를 살렸습니다.
- source_word: הַמַּצּוֹת
  english_pob_choice: the Unleavened Bread
  chosen_korean: 누룩 없는 빵
  alternatives_korean:
  - 무교병
  - 무교절
  - 누룩 없는 떡
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘누룩 없는 것들/빵들’이므로, 제의적 의미를 유지하면서도 현대 한국어에서 이해되는 ‘누룩 없는 빵’으로 옮겼습니다.
- source_word: צִבְאוֹתֵיכֶם
  english_pob_choice: your hosts
  chosen_korean: 너희 군대
  alternatives_korean:
  - 너희 군단
  - 너희 무리들
  - 너희 부대들
  lexicon: HALOT
  rationale: 출애굽 문맥에서 이 표현은 질서 있게 편성된 집단을 가리키며, ‘군대’가 그 조직성과 집합적 이동의 뉘앙스를 가장 잘 드러냅니다.
- source_word: חֻקַּת עוֹלָם
  english_pob_choice: a permanent statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영원한 율례
  - 영구한 규례
  - 영원한 법령
  lexicon: HALOT
  rationale: חֻקָּה는 제정된 규례/율례이고 עוֹלָם은 지속성을 나타내므로, 익숙한 성서어법을 따르되 의미를 보존하는 ‘영원한 규례’로 옮겼습니다.
theological_decisions:
- issue: הַמַּצּוֹת를 음식 자체로 둘지 절기 이름으로 풀지 여부
  chosen_reading: 본문에는 ‘누룩 없는 빵’으로 두어 히브리어의 직접적 표현을 살리고, 절기 명칭을 덧붙이지 않았습니다.
  alternative_readings:
  - 무교절
  - 무교절을 지켜야 합니다
  - 무교절의 빵
  rationale: 히브리어는 절기 자체보다 문자적으로 ‘누룩 없는 것들’을 말하므로, 본문은 과도한 해석을 피하고 용례상 가능한 식품 의미를 우선 살렸습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: חֻקַּת עוֹלָם의 지속성을 어떻게 표현할지
  chosen_reading: ‘영원한 규례’로 옮겨 언약적 지속성과 규범성을 함께 드러냈습니다.
  alternative_readings:
  - 영구한 규례
  - 세세토록 지킬 규례
  - 영원한 율례
  rationale: 이 표현은 절대철학적 영원성보다 공동체에 대한 지속적 규정의 성격이 강하므로, 한국어에서 가장 자연스럽고 성서적인 ‘영원한 규례’를 택했습니다.
  doctrine_reference: Translation philosophy §6
