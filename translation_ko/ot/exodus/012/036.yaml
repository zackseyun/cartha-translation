id: EXO.12.36
reference: Exodus 12:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'so that they lent to them.' The Hebrew verb here has been understood either as lending or as granting what was requested.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 백성이 이집트 사람들에게 호의를 얻게 하셔서, 이집트 사람들이 이스라엘 백성이 요청한 것을 내주게 하셨고[a], 그들은 이집트를 약탈했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘그들에게 빌려주었다’로도 옮깁니다. 이 히브리어 동사는 여기서 ‘요청한 것을 내주다’ 또는 ‘빌려주다’로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 표준 번역 용례 / 본 프로젝트 기본어휘
  rationale: 원문의 신명사וְיהוָה를 프로젝트 기본값에 따라 학술적 음역인 ‘야훼’로 옮겼습니다. 영어 POB의 ‘the LORD’는 유대 전통을 따른 우회 표기이지만, 본 초안은 원문 가시성을 우선합니다.
- source_word: נָתַן אֶת חֵן
  english_pob_choice: gave the people favor
  chosen_korean: 백성에게 … 호의를 주셔서
  alternatives_korean:
  - 백성에게 은혜를 주셔서
  - 백성에게 호감을 주셔서
  lexicon: HALOT
  rationale: חֵן은 이 문맥에서 ‘호의/호감’의 의미이므로 ‘호의’를 택했습니다. ‘은혜’는 신학적 함의가 강해 כאן의 상호 평가를 흐릴 수 있습니다.
- source_word: בְּעֵינֵי מִצְרַיִם
  english_pob_choice: in the eyes of the Egyptians
  chosen_korean: 이집트 사람들의 눈에
  alternatives_korean:
  - 이집트 사람들의 보기에
  - 이집트 사람들의 시야에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 투명하게 보이게 하되, 자연스러운 현대 문장으로 ‘~의 눈에’로 옮겼습니다.
- source_word: וַיַּשְׁאִלוּם
  english_pob_choice: so that they let them have what they asked
  chosen_korean: 그들이 요구하는 것을 내주게 하셨고
  alternatives_korean:
  - 그들이 요구한 것을 빌려주게 하셨고
  - 그들이 요청한 것을 주게 하셨고
  - 그들이 청한 것을 내주게 하셨고
  lexicon: HALOT
  rationale: 이 동사는 전통적으로 ‘빌려주다’로도 이해되지만, 영어 POB의 감사표현은 정상적 대출보다 요청에 대한 응답을 강조합니다. 따라서 ‘요구하는 것을 내주다’로 옮겨, 상환 전제가 없는 수여·양도의 뉘앙스를 살렸습니다.
- source_word: וַיְנַצְּלוּ אֶת מִצְרָיִם
  english_pob_choice: they plundered Egypt
  chosen_korean: 그들은 이집트를 약탈했습니다
  alternatives_korean:
  - 그들은 이집트를 노략했습니다
  - 그들은 이집트를 벗겨냈습니다
  lexicon: HALOT
  rationale: נצל의 피엘은 ‘벗기다/약탈하다’의 뜻을 가지며, 결과적으로 이집트가 재물을 빼앗기는 장면입니다. 한국어에서는 현대적으로 분명한 ‘약탈하다’가 가장 직접적입니다.
theological_decisions:
- issue: וַיַּשְׁאִלוּם의 의미를 전통적 ‘빌려주다’로 둘지, 요청에 대한 응답으로 둘지
  chosen_reading: ‘그들이 요구하는 것을 내주게 하셨고’로 처리하여 요청-응답의 흐름을 드러냈습니다.
  alternative_readings:
  - 그들이 빌려주게 하셨고
  - 그들이 요청한 것을 주게 하셨고
  rationale: 문맥은 야훼께서 애굽 사람들의 태도를 바꾸어 이스라엘의 요구가 받아들여지게 하신 장면이며, 여기서 ‘빌려주다’는 보상 기대가 있는 통상 대출처럼 들릴 위험이 있습니다. 본 번역은 본문의 심판·탈취 장면을 흐리지 않으면서 동사의 의미 범위를 보존합니다.
  doctrine_reference: 출애굽기의 심판과 탈출 서사; 번역 원칙상 문맥 우선
