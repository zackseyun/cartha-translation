  rationale: 주어와 요청의 주체를 명시하여 원문의 관계를 분명히 하고, ‘호의를 주다’의 어색한 직역을 자연스러운 한국어 관용 표현으로 다듬었습니다. 논쟁적인 동사의 본문 선택은 유지하되, 전통적 대안의 동작 방향을 정확히 고쳐 각주를 해당 어구에 연결했습니다.
