source:
  edition: WLC
  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''your loins girded''—an idiom for being dressed and ready to depart immediately.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'it is the LORD's Passover.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이렇게 먹어야 합니다. 허리에 띠를 두르고, 발에는 샌들을 신고, 손에는 지팡이를 쥔 채 먹으십시오. 서둘러 먹어야 합니다. 이것은 야훼의 유월절입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘허리 띠를 두른 채’라는 관용으로, 곧바로 떠날 준비가 되어 있음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 유월절입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה
  english_pob_choice: And this is how
  chosen_korean: 그리고 이렇게
  alternatives_korean:
  - 그리고 이와 같이
  - 그리고 이런 방식으로
  lexicon: HALOT
  rationale: 지시문을 여는 표현으로, 현대 한국어에서 자연스럽고 직접적인 안내를 유지합니다.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  english_pob_choice: with your waist belted
  chosen_korean: 허리에 띠를 두르고
  alternatives_korean:
  - 허리를 동이고
  - 허리띠를 맨 채
  lexicon: HALOT
  rationale: 즉시 떠날 준비가 된 몸가짐을 가리키는 관용을 살리되, ‘허리’와 ‘띠’로 구체적인 이미지를 자연스럽게 옮겼습니다.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  english_pob_choice: your sandals on your feet
  chosen_korean: 발에는 샌들을 신고
  alternatives_korean:
  - 발에 신발을 신고
  - 발에는 신을 신고
  lexicon: HALOT
  rationale: 고대 맥락의 발의 신발을 ‘샌들’로 옮겨 역사적 구체성을 유지했습니다.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  english_pob_choice: and your staff in your hand
  chosen_korean: 손에는 지팡이를 쥔 채
  alternatives_korean:
  - 손에는 막대기를 쥔 채
  - 손에 지팡이를 든 채
  lexicon: HALOT
  rationale: 여행 준비 도구를 뜻하는 ‘מַקֵּל’을 한국어 성경에서 자연스러운 ‘지팡이’로 옮겼습니다.
- source_word: בְּחִפָּזוֹן
  english_pob_choice: in haste
  chosen_korean: 서둘러
  alternatives_korean:
  - 급히
  - 서둘러서
  lexicon: HALOT
  rationale: 단순한 속도를 넘어 출발 직전의 긴박함을 압축적으로 전달합니다.
- source_word: פֶּסַח
  english_pob_choice: Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 넘어감절
  - 파스카
  lexicon: HALOT
  rationale: 한국어 성경에서 확립된 절기 명칭을 유지해 가독성과 정체성을 살렸습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 기록된 신명 사본의 인명형을 그대로 음역해, 본문이 가진 고유명사성을 보존합니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 제목이 아니라 언약의 고유한 신명(神名)을 직접 사용하므로, 이를 ‘야훼’로 옮겨 대체 тит울이 아닌 이름 자체를 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
