translation:
  language: ko
  text: 그리고 너희 아들들이 너희에게 「이 의식이 너희에게 무엇입니까?」라고 말하면
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And when
  chosen_korean: 그리고 …라고 말하면
  alternatives_korean:
  - 그리고 …할 때
  - 그리고 …하게 되면
  lexicon: HALOT
  rationale: 히브리어의 미래적 조건/시간 관용구를 한국어에서는 자연스러운 조건절로 옮기되, 원문의 전개를 살려 앞에 연결어를 두었습니다.
- source_word: בְּנֵיכֶם
  english_pob_choice: your sons
  chosen_korean: 너희 아들들
  alternatives_korean:
  - 너희 자녀들
  - 너희 아들들
  lexicon: HALOT
  rationale: 히브리어는 성별이 분명한 복수형 ‘아들들’이므로, 일반화하지 않고 그대로 반영했습니다.
- source_word: הָעֲבֹדָה
  english_pob_choice: service
  chosen_korean: 의식
  alternatives_korean:
  - 섬김
  - 예식
  - 봉사
  lexicon: HALOT
  rationale: 유월절 문맥에서 מדובר하는 것은 일반 노동이 아니라 정해진 예배 행위이므로, 한국어에서는 자연스럽게 ‘의식’으로 옮겨 그 종교적 성격을 드러냈습니다.
- source_word: מָה הָעֲבֹדָה הַזֹּאת לָכֶם
  english_pob_choice: What is this service to you?
  chosen_korean: 이 의식이 너희에게 무엇입니까?
  alternatives_korean:
  - 이 의식이 너희에게 무엇입니까?
  - 이 의식이 너희에게 무슨 의미입니까?
  lexicon: HALOT
  rationale: 원문은 ‘이것이 너희에게 무엇이냐’라는 직역 구조이므로, 해석을 덧붙이는 ‘무슨 의미입니까’보다 더 직접적인 질문 형식을 유지했습니다.
