id: EXO.12.18
reference: Exodus 12:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ/רִאשֹׁ֡ן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב תֹּאכְל֖וּ מַצֹּ֑ת עַ֠ד י֣וֹם הָ/אֶחָ֧ד וְ/עֶשְׂרִ֛ים לַ/חֹ֖דֶשׁ בָּ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
  footnotes:
  - marker: a
    text: Or 'in the evening' at both occurrences of 'at evening.'
    reason: lexical_alternative
translation:
  language: ko
  text: 첫째 달 열나흗날 저녁부터 너희는 무교병을 먹어야 합니다. 그 달 스물하룻날 저녁까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 두 곳의 ‘저녁’은 모두 ‘저녁에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשֹׁן ... לַחֹדֶשׁ
  english_pob_choice: In the first month
  chosen_korean: 첫째 달
  alternatives_korean:
  - 첫째 달에
  - 첫 번째 달
  lexicon: HALOT
  rationale: 날짜 공식에서 달을 가리키므로 ‘첫째 달’이 가장 자연스럽고, 영어의 ‘month’가 보충한 달의 의미를 한국어에서도 분명히 드러냅니다.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  english_pob_choice: on the fourteenth day
  chosen_korean: 열나흗날
  alternatives_korean:
  - 열네 번째 날
  - 열나흘째 날
  lexicon: HALOT
  rationale: 히브리어 날짜 표기는 한국어 성경에서 흔한 관용형 ‘열나흗날’이 가장 간결하고 자연스럽습니다.
- source_word: בָּעֶרֶב ... בָּעָרֶב
  english_pob_choice: at evening
  chosen_korean: 저녁
  alternatives_korean:
  - 저녁때
  - 해 질 무렵
  lexicon: HALOT
  rationale: 두 번 반복되는 시간 경계를 그대로 살리되, 과도하게 특정한 ‘해 질 무렵’보다 중립적인 ‘저녁’이 원문의 경계표지를 잘 반영합니다.
- source_word: תֹּאכְלוּ מַצּוֹת
  english_pob_choice: you shall eat unleavened bread
  chosen_korean: 너희는 무교병을 먹어야 하며
  alternatives_korean:
  - 너희는 무교병을 먹을 것입니다
  - 너희는 누룩 없는 빵을 먹어야 하며
  lexicon: HALOT
  rationale: 명령적 법문맥의 의무를 ‘먹어야 하며’로 살렸고, מַצּוֹת은 전통적이지만 본문 지시를 분명히 드러내는 ‘무교병’으로 옮겼습니다.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  english_pob_choice: the twenty-first day
  chosen_korean: 스무하루 날
  alternatives_korean:
  - 스물한째 날
  - 제이십일일
  lexicon: HALOT
  rationale: 종결 시점을 나타내는 날짜 표현을 한국어에서 자연스러운 ‘스무하루 날’로 옮겨, 시작과 끝의 대칭을 유지했습니다.
theological_decisions:
- issue: 명령법의 법문맥 강도
  chosen_reading: ‘you shall eat’의 의무성을 살려 ‘먹어야 하며’로 번역했습니다.
  alternative_readings:
  - 먹습니다
  - 먹을 것입니다
  rationale: 출애굽기 12:18은 단순 예고가 아니라 절기 규정이므로, 규범적 의무를 분명히 하는 번역이 본문 기능에 더 부합합니다.
  doctrine_reference: 토라의 규정 문맥과 언약적 의무
- issue: 시간 경계의 반복
  chosen_reading: 양쪽 모두 ‘저녁’으로 일관되게 옮겨 시작과 끝의 경계를 보존했습니다.
  alternative_readings:
  - 첫 번째는 ‘저녁에’, 두 번째는 ‘해질녘에’
  rationale: 원문은 같은 표현을 반복해 절기의 경계선을 강조하므로, 한국어에서도 동일 어휘를 써 구조적 대비를 유지했습니다.
  doctrine_reference: 본문의 반복을 통한 경계 설정
