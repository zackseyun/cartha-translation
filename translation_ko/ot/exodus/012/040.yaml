  text: Now the dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
  footnotes:
  - marker: a
    text: Some ancient witnesses read, 'the dwelling of the sons of Israel and their fathers, which they lived in Egypt and in Canaan, was four hundred thirty years.'
    reason: textual_variant
translation:
  language: ko
  text: 이스라엘 자손의 거류 기간은 그들이 이집트에 머문 기간인데, 사백삼십 년이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 고대 증인들은 ‘이스라엘 자손과 그들의 조상들이 이집트와 가나안에서 거류한 기간’으로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  english_pob_choice: dwelling
  chosen_korean: 거류 기간
  alternatives_korean:
  - 거주
  - 머묾
  - 거주 기간
  lexicon: HALOT
  rationale: 문맥상 단순한 장소가 아니라 ‘머문 기간/상태’를 가리키므로, 자연스러우면서도 기간성을 드러내는 ‘거류 기간’으로 옮겼습니다.
- source_word: בְּנֵ֣י יִשְׂרָאֵ֔ל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 친족-언약적 표현을 살리되 한국어에서 가장 익숙하고 성경적인 대응인 ‘이스라엘 자손’을 유지했습니다.
- source_word: אֲשֶׁ֥ר יָשְׁבוּ
  english_pob_choice: who lived
  chosen_korean: 그들이 ... 머문
  alternatives_korean:
  - 그들이 ... 살았던
  - 그들이 ... 거주한
  lexicon: HALOT
  rationale: 관계절을 한국어 자연어로 풀어, ‘거류 기간’이 곧 ‘이집트에 머문 기간’임을 분명히 했습니다.
- source_word: שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה
  english_pob_choice: four hundred thirty years
  chosen_korean: 사백삼십 년
  alternatives_korean:
  - 사십 년과 삼백구십 년
  - 삼십 년과 사백 년
  lexicon: HALOT
  rationale: 히브리어의 합산식 수치를 한국어 관용에 맞게 하나의 수로 정리하되, 본문의 총 기간을 그대로 보존했습니다.
theological_decisions:
- issue: 430년의 범위를 이집트만으로 볼지, 이집트와 가나안을 합친 전승까지 반영할지
  chosen_reading: 본문은 마소라 본문의 ‘이집트에’라는 지시를 따라, 이스라엘 자손의 거류 기간이 이집트에서의 기간이라고 번역했습니다.
  alternative_readings:
  - 일부 고대 증인들은 ‘이집트와 가나안에서’로 읽어 기간을 족장 시대까지 확장합니다.
  rationale: 본문 자체의 히브리어를 우선하되, 잘 알려진 이문을 본문에 섞지 않고 주석적 정보로만 보존하는 것이 원문 중심 원칙에 부합합니다.
  doctrine_reference: 원문 우선과 본문-이문 구분 유지
