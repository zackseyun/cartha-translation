  lexicon: HALOT
  rationale: 관계절을 한국어 자연어로 풀어, ‘거류 기간’이 곧 ‘이집트에 머문 기간’임을 분명히 했습니다.
- source_word: שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה
