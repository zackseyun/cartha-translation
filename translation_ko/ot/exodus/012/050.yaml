  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
  footnotes:
  - marker: a
    text: 'Or “the Israelites” or “the children of Israel.” Hebrew: “the sons of Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Hebrew YHWH, traditionally rendered “the LORD.”
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘의 모든 자손은 야훼께서 모세와 아론에게 명령하신 대로 행했습니다. 곧 그대로 행했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “이스라엘의 아들들”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יְהוָה입니다. 전통적으로는 “주”로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: all the sons of Israel
  chosen_korean: 이스라엘의 모든 자손
  alternatives_korean:
  - 이스라엘의 모든 아들들
  - 이스라엘 사람 모두
  lexicon: HALOT
  rationale: 히브리어 직역 성격을 살리되 한국어에서 자연스럽고 성경 문체에 맞게 ‘자손’으로 옮겨, 남성 복수 표지를 무리하게 일반화하지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 계약의 고유명사 יְהוָה를 한국어 표준 용례가 아니라도 소스 직접성을 살려 ‘야훼’로 옮겼습니다.
- source_word: צִוָּה ... כֵּן עָשׂוּ
  english_pob_choice: had commanded ... so they did
  chosen_korean: 명령하신 대로 행했습니다. 곧 그대로 행했습니다.
  alternatives_korean:
  - 명령하신 대로 했습니다. 그래서 그대로 했습니다.
  - 명하신 대로 행했습니다. 그러므로 행했습니다.
  lexicon: HALOT
  rationale: 명령-순종의 대응과 마지막 반복을 살려, 히브리어의 ‘...대로’와 ‘그대로’의 중복 강조를 한국어에서 보존했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문에서 ‘야훼’로 표기합니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 번역어로 대체하지 않고 고유명사로 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 순종의 반복 강조
  chosen_reading: ‘행했습니다… 곧 그대로 행했습니다’로 이중 진술을 유지합니다.
  alternative_readings:
  - 앞 절과 합쳐 간단히 ‘그들이 순종했습니다’로 처리
  - 두 번째 절반을 생략
  rationale: 히브리어는 마지막 반복으로 철저한 순종을 강조하므로, 이를 평이하게 압축해 의미 강도를 약화시키지 않았습니다.
  doctrine_reference: 본문 강조 보존 원칙
