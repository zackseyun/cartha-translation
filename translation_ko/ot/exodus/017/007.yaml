id: EXO.17.7
reference: Exodus 17:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ שֵׁ֣ם הַ/מָּק֔וֹם מַסָּ֖ה וּ/מְרִיבָ֑ה עַל רִ֣יב בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/עַ֨ל נַסֹּתָ֤/ם אֶת יְהוָה֙ לֵ/אמֹ֔ר הֲ/יֵ֧שׁ יְהוָ֛ה בְּ/קִרְבֵּ֖/נוּ אִם אָֽיִן־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
  footnotes:
  - marker: a
    text: Massah sounds like the Hebrew word for 'testing,' and Meribah sounds like the Hebrew word for 'quarreling' or 'contention.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Is the LORD in our midst or not?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 장소의 이름을 마싸와 므리바라 불렀습니다[a]. 이는 이스라엘의 아들들이 다투었고, 그들이 야훼를 시험했기 때문입니다. 그들은 “야훼께서 우리 가운데 계신가, 아니면 없으신가?”라고 말했습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마싸와 므리바는 각각 히브리어로 ‘시험’과 ‘다툼/분쟁’을 연상시키는 이름입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 사람들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘야훼께서 우리 가운데 계십니까, 아니십니까?’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  english_pob_choice: he called the name of the place
  chosen_korean: 그 장소의 이름을 … 불렀습니다
  alternatives_korean:
  - 그 곳을 …라 이름 지었습니다
  - 그 장소를 …라고 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 명명 관용구를 살리되, 한국어에서는 자연스럽게 ‘이름을 불렀다’로 옮겨 장소 명명 행위를 드러냈습니다.
- source_word: מַסָּה וּמְרִיבָה
  english_pob_choice: Massah and Meribah
  chosen_korean: 마싸와 므리바
  alternatives_korean:
  - 맛사와 므리바
  - 마사와 메리바
  lexicon: HALOT
  rationale: 지명은 음역하는 원칙을 따랐고, 본문 의미를 지명 자체로 보존하기 위해 뜻풀이로 대체하지 않았습니다.
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  english_pob_choice: because of the quarreling of the sons of Israel
  chosen_korean: 이스라엘의 아들들이 다투었고
  alternatives_korean:
  - 이스라엘 자손이 다투었고
  - 이스라엘 백성이 다투었고
  lexicon: HALOT
  rationale: בְּנֵי יִשְׂרָאֵל의 직역을 살리면서도 한국어에서는 속격 구조보다 자연스러운 주어-서술형으로 옮겼습니다.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  english_pob_choice: and because they tested Yahweh
  chosen_korean: 그들이 야훼를 시험했기 때문입니다
  alternatives_korean:
  - 그들이 야훼를 테스트했기 때문입니다
  - 그들이 야훼를 시험하였기 때문입니다
  lexicon: HALOT
  rationale: נסה의 의미는 ‘시험하다/떠보다’이므로, 성경적 문맥에 맞는 ‘시험하다’를 유지해 신학적 무게를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 사중음자 이름을 직역 대체어로 바꾸지 않고, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  english_pob_choice: Is Yahweh among us or not?
  chosen_korean: 야훼께서 우리 가운데 계신가, 아니면 없으신가?
  alternatives_korean:
  - 야훼께서 우리 가운데 계십니까, 아니십니까?
  - 야훼께서 우리 가운데 계신가요, 아닌가요?
  lexicon: HALOT
  rationale: ‘בְּקִרְבֵּנוּ’는 ‘우리 가운데’가 가장 직접적이며, 존재 여부를 묻는 대비를 한국어의 ‘아니면 없으신가’로 분명히 드러냈습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה를 어떻게 표기할 것인가
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 하나님의 언약 이름을 직접 사용하므로, 칭호인 ‘주님’으로 바꾸지 않고 고유명 ‘야훼’를 유지하는 것이 स्रोत의 의미를 가장 투명하게 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘이름을 불렀습니다’의 문체와 인용문의 어조
  chosen_reading: 서술 본문은 합쇼체를 유지하고, 인용문은 직접 발화 형태로 옮겼습니다.
  alternative_readings:
  - 인용문을 간접화하여 완화
  - 전체를 평서체로 단일화
  rationale: 히브리어 서술의 역사적 직설성을 살리기 위해 본문은 공손한 서술체를 쓰되, 도발적 질문은 그대로 직접 인용해 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §2 (Maintain source rhetorical force)
