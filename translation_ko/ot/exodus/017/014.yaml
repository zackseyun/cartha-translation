source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
  footnotes:
  - marker: a
    text: Or 'in a book' or 'in the scroll'; Hebrew has 'in the book.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'put in the ears of Joshua,' that is, make Joshua hear it or recite it to him.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew expression 'I will surely blot out' is emphatic.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. 「이것을 기념으로 책에 기록하고, 여호수아의 귀에 들려주어라. 내가 반드시 아말렉의 기억을 하늘 아래에서 지워 버리겠다。」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘책에’는 히브리어에서 정관사가 붙은 ‘그 책’에 해당하지만, 한국어에서는 문맥상 자연스럽게 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘여호수아의 귀에 들려주어라’는 직역하면 ‘여호수아의 귀에 넣어라’라는 히브리 관용구를 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘반드시’는 ‘지워 버리겠다’ 앞에 놓인 히브리어 강조형을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명 표기는 지칭 칭호가 아니라 고유한 언약 이름이므로, POB의 원칙에 따라 한국어에서도 ‘야훼’로 옮겨 이름의 직접성을 살렸습니다.
- source_word: כְּתֹב זֹאת זִכָּרוֹן
  english_pob_choice: Write this as a memorial
  chosen_korean: 이것을 책에 기념으로 기록해 두고
  alternatives_korean:
  - 이것을 기념으로 책에 기록해 두고
  - 이것을 기억으로 기록해 두고
  lexicon: HALOT
  rationale: זִכָּרוֹן은 단순한 ‘기억’보다 기념물/기념 기록의 성격이 강하므로 ‘기념으로 기록해 두고’로 처리해 앞뒤의 ‘기념/기억’ 대조를 살렸습니다.
- source_word: בַּסֵּפֶר
  english_pob_choice: in the book
  chosen_korean: 책에
  alternatives_korean:
  - 그 책에
  - 두루마리에
  lexicon: HALOT
  rationale: 히브리어는 정관사 있는 ‘그 책’이지만 한국어에서는 문맥상 자연스러운 ‘책에’가 가장 직설적입니다. ‘두루마리’는 매체를 과도하게 구체화합니다.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  english_pob_choice: put it in Joshua’s hearing
  chosen_korean: 여호수아의 귀에 들려 주어라
  alternatives_korean:
  - 여호수아가 듣도록 해라
  - 여호수아의 귀에 넣어라
  lexicon: HALOT
  rationale: 직역인 ‘귀에 넣다’는 한국어에서 부자연스럽기 때문에, 관용적으로 같은 의미를 전달하는 ‘귀에 들려 주다’를 사용해 히브리 관용구의 기능을 보존했습니다.
- source_word: מָחֹה אֶמְחֶה אֶת זֵכֶר עֲמָלֵק
  english_pob_choice: I will surely blot out the remembrance of Amalek
  chosen_korean: 내가 반드시 아말렉의 기억을 지워 버리겠다
  alternatives_korean:
  - 내가 반드시 아말렉의 흔적을 지워 버리겠다
  - 내가 아말렉의 기억을 완전히 없애겠다
  lexicon: HALOT
  rationale: 중복어형은 강한 강조를 나타내므로 ‘반드시’와 ‘지워 버리겠다’로 확실성과 완전한 제거를 드러냈습니다. זֵכֶר은 여기서 ‘기억/기념’ 계열의 의미이므로 ‘기억’을 택했습니다.
theological_decisions:
- issue: 이름 야훼의 직접 표기
  chosen_reading: יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문이 신적 칭호가 아니라 하나님의 이름을 직접 사용하므로, 전통적 대치 표현보다 이름 자체를 드러내는 번역이 원문 의도를 더 정확히 전달합니다.
  doctrine_reference: POB contested terms — יְהוָה YHWH → 야훼
