base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
  footnotes:
  - marker: a
    text: Or, 'Behold, I am standing before you there on the rock at Horeb.' The Hebrew participle may be rendered as a present.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 거기 호렙의 그 바위 위에서 당신 앞에 서 있겠습니다. 당신은 그 바위를 치십시오. 그러면 그곳에서 물이 나와 백성이 마시게 될 것입니다. 모세는 이스라엘의 장로들이 보는 앞에서 그대로 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘보십시오, 내가 거기 호렙의 그 바위 위에 서 있습니다.’ 히브리어 분사형은 현재형으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 있습니다
  lexicon: HALOT
  rationale: 주의를 끄는 장엄한 선언으로서, 현대 한국어에서는 ‘보십시오’가 높임과 직접성을 함께 살리면서도 과장되지 않습니다.
- source_word: עֹמֵד
  english_pob_choice: I will stand
  chosen_korean: 서 있겠습니다
  alternatives_korean:
  - 서 있습니다
  - 설 것입니다
  lexicon: HALOT
  rationale: 히브리어 분사형이지만 문맥상 임박한 미래/의지의 뉘앙스를 지니므로, 한국어에서는 자연스러운 미래형으로 옮겼습니다.
- source_word: הַצּוּר
  english_pob_choice: the rock
  chosen_korean: 그 바위
  alternatives_korean:
  - 그 반석
  - 바위
  lexicon: HALOT
  rationale: 반복되는 צוּר를 한국어로는 기본어 ‘바위’로 옮겨 직관성을 유지했습니다. ‘반석’은 전통적이지만 본문 맥락에서는 더 신학적 색채가 강합니다.
- source_word: וְהִכִּיתָ
  english_pob_choice: you shall strike
  chosen_korean: 당신은 … 치십시오
  alternatives_korean:
  - 당신은 … 치셔야 합니다
  - 당신은 … 치세요
  lexicon: HALOT
  rationale: 모세에게 주는 명령이므로 한국어 명령형으로 처리했고, ‘치다’가 מקור의 폭넓은 물리적 타격 의미를 가장 직접적으로 반영합니다.
- source_word: וְיָצְאוּ
  english_pob_choice: will come out
  chosen_korean: 나와
  alternatives_korean:
  - 흘러나와
  - 나오고
  lexicon: HALOT
  rationale: 동사의 기본 의미를 과장 없이 살리되, 물의 분출이라는 결과가 자연스럽게 이어지도록 했습니다.
- source_word: לְעֵינֵי זִקְנֵי יִשְׂרָאֵל
  english_pob_choice: in the sight of the elders of Israel
  chosen_korean: 이스라엘의 장로들이 보는 앞에서
  alternatives_korean:
  - 이스라엘의 장로들 앞에서
  - 이스라엘의 장로들이 보는 가운데
  lexicon: HALOT
  rationale: 공적 증언의 뉘앙스를 살리기 위해 ‘보는 앞에서’를 택해 단순한 위치 표현보다 목격성 강조를 유지했습니다.
theological_decisions:
- issue: יהוה의 직접 언급 없이도 신적 발화의 장엄함을 어떻게 보존할지
  chosen_reading: 명령문 전체를 높임과 직접 명령으로 처리해, 하나님의 현현적 발화로서의 긴장감을 유지했습니다.
  alternative_readings:
  - 평서적으로 완화하여 옮김
  - 더 전통적인 교회식 어투로 격상함
  rationale: 본문은 하나님의 구체적 지시와 표징을 드러내므로, 지나친 완화나 교회 관용구로의 치환은 원문의 즉각성을 약화시킵니다.
  doctrine_reference: Translation philosophy §1
