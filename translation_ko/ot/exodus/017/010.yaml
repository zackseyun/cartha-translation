  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
  footnotes:
  - marker: a
    text: Hebrew 'Amalek'; this may refer to the people descended from Amalek, i.e., the Amalekites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 여호수아는 모세가 그에게 말한 대로 아말렉과 싸우기 위해 하였고, 모세와 아론과 훌은 산꼭대기로 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아말렉’은 아말렉 족속, 곧 아말렉 사람들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 하였고
  alternatives_korean:
  - 했습니다
  - 행했습니다
  - 따랐고
  lexicon: HALOT
  rationale: עשה는 여기서 명령을 수행했다는 뜻이므로, 자연스러운 서술로 ‘하였고’라고 옮겼습니다.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  english_pob_choice: as Moses had told him
  chosen_korean: 모세가 그에게 말한 대로
  alternatives_korean:
  - 모세가 그에게 한 대로
  - 모세가 그에게 지시한 대로
  - 모세가 그에게 말했던 대로
  lexicon: HALOT
  rationale: 직역의 ‘말했다’보다, 앞절의 지시를 받았다는 문맥을 살려 ‘말한 대로’로 옮겼습니다.
- source_word: לְהִלָּחֵם בַּעֲמָלֵק
  english_pob_choice: to fight against Amalek
  chosen_korean: 아말렉과 싸우기 위해
  alternatives_korean:
  - 아말렉과 싸우도록
  - 아말렉과 대적하기 위해
  - 아말렉과 전쟁하기 위해
  lexicon: HALOT
  rationale: לחם은 실제 전투를 뜻하므로 ‘싸우다’로 옮기되, 목적을 나타내는 לְ를 살려 ‘~하기 위해’로 처리했습니다.
- source_word: רֹאשׁ הַגִּבְעָה
  english_pob_choice: the top of the hill
  chosen_korean: 산꼭대기
  alternatives_korean:
  - 언덕 꼭대기
  - 산의 꼭대기
  - 언덕의 정상
  lexicon: HALOT
  rationale: 히브리어의 ‘언덕의 머리’는 관용적으로 꼭대기를 뜻하므로, 한국어에서 가장 자연스러운 ‘산꼭대기’로 옮겼습니다.
theological_decisions:
- issue: 여호수아의 이름 표기와 본문 흐름
  chosen_reading: 여호수아
  alternative_readings:
  - 예수아
  - 여호수아(주석형 표기)
  rationale: 본문의 인물명은 전통적으로 통용되는 한국어 성경 표기를 따랐습니다.
  doctrine_reference: 고유명사 표기 관례
- issue: 아말렉의 지시 대상
  chosen_reading: 아말렉
  alternative_readings:
  - 아말렉 사람들
  - 아말렉족
  rationale: 히브리어는 פה에서 집단명보다 지명/족속명에 가까운 고유명사 형태를 사용하므로, 본문을 과도하게 해석하지 않고 그대로 유지했습니다.
  doctrine_reference: 본문 충실성
