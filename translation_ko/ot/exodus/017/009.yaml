  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
  footnotes:
  - marker: a
    text: Or “wage war against Amalek.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “on the head of the hill,” an idiom for “on the top of the hill.”
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 여호수아에게 말했습니다. 「우리에게서 사람들을 택하고 나가서, 아말렉과 싸우십시오. 내일 나는 산 꼭대기에 서고, 하나님의 지팡이는 내 손에 있을 것입니다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘사람들’을 직역한 것으로, 전투에 나설 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘언덕의 머리’이지만, 관용적으로 ‘언덕 꼭대기’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ
  english_pob_choice: Joshua
  chosen_korean: 여호수아
  alternatives_korean:
  - 예호수아
  lexicon: 표준 성경 인명 표기
  rationale: 히브리어 인명은 한국어 성경에서 널리 정착된 ‘여호수아’로 옮기는 것이 자연스럽고 식별성이 높습니다.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  english_pob_choice: Choose men for us
  chosen_korean: 우리에게서 사람들을 택하고
  alternatives_korean:
  - 우리에게 남자들을 택하고
  - 우리 편을 위해 사람들을 택하고
  lexicon: HALOT
  rationale: בחר는 ‘택하다’로 옮기고, אֲנָשִׁים은 문맥상 전투 인원을 가리키지만 한국어에서는 ‘사람들’이 가장 무리 없는 직역이며, ‘우리에게서’는 לָנוּ의 이해를 반영합니다.
- source_word: וְצֵא הִלָּחֵם בַּעֲמָלֵק
  english_pob_choice: and go out; fight against Amalek
  chosen_korean: 나가서, 아말렉과 싸우십시오
  alternatives_korean:
  - 나가서, 아말렉과 전쟁하십시오
  - 나가서 아말렉과 싸우십시오
  lexicon: HALOT
  rationale: יצא의 ‘나가다’와 מלחם의 군사적 명령을 살리되, 한국어에서는 ‘아말렉과 싸우다’가 가장 자연스럽고 직접적입니다.
- source_word: עַל רֹאשׁ הַגִּבְעָה
  english_pob_choice: on the top of the hill
  chosen_korean: 산 꼭대기에
  alternatives_korean:
  - 언덕 꼭대기에
  - 산의 머리 위에
  lexicon: HALOT
  rationale: רֹאשׁ의 문자적 ‘머리’는 히브리어 관용구이므로, 영어 POB의 해석을 따라 한국어에서는 자연스러운 ‘꼭대기’로 옮겼습니다.
- source_word: וּמַטֵּה הָאֱלֹהִים
  english_pob_choice: the staff of God
  chosen_korean: 하나님의 지팡이
  alternatives_korean:
  - 하나님의 지팡이와
  - 하나님의 막대기
  lexicon: HALOT
  rationale: construct phrase를 한국어 소유격으로 풀어 ‘하나님의 지팡이’로 옮기면 의미가 명확해지고, 앞 절의 ‘서고’와 함께 자연스럽게 연결됩니다.
theological_decisions:
- issue: 하나님 칭호와 문맥상 소유 표현
  chosen_reading: 하나님의 지팡이
  alternative_readings:
  - 하나님께 속한 지팡이
  - 하나님 지팡이
  rationale: 출애굽기 문맥에서 지팡이는 하나님의 권능을 매개하는 표지이므로, 소유격을 분명히 하되 과도한 해설은 넣지 않았습니다.
  doctrine_reference: 출 4장, 출 7장–14장 모세의 지팡이 모티프
