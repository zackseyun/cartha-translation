  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the elders of Israel''; the phrase likely means that Moses should take some selected elders with him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the river'; in Exodus this term commonly refers specifically to the Nile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 모세에게 말씀하셨습니다. “백성보다 앞서 가십시오. 이스라엘 장로들 가운데서 몇 사람을 데리고 가십시오[a]. 네가 나일강[b]을 칠 때 사용한 네 지팡이를 손에 들고 가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִזִּקְנֵי יִשְׂרָאֵל은 직역하면 ‘이스라엘의 장로들 가운데서’이며, 여기서는 장로들 가운데 일부를 데려가라는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 강’. 출애굽기에서 הַיְאֹר는 대개 이집트의 나일강을 가리킵니다.
    reason: lexical_alternative
