base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the elders of Israel''; the phrase likely means that Moses should take some selected elders with him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the river'; in Exodus this term commonly refers specifically to the Nile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 모세에게 말씀하셨습니다. "백성 앞을 지나가서 이스라엘의 장로들 가운데서 몇 사람을 데리고 가십시오. 또 네 손에 네 지팡이를 잡고 가십시오. 그 지팡이로 네가 나일강을 쳤으니, 그것을 손에 들고 가십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 מִזִּקְנֵי יִשְׂרָאֵל는 ‘이스라엘의 장로들 가운데서’ 일부를 가리키는 뜻으로 이해할 수 있습니다.
    reason: source_note
  - marker: b
    text: 출애굽기에서 הַיְאֹר는 대개 이집트의 나일강을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: POB의 원칙에 따라 하나님의 고유명사는 전통적 대체어가 아니라 음역형으로 살려야 하므로 ‘야훼’로 옮겼습니다.
- source_word: עֲבֹר לִפְנֵי הָעָם
  english_pob_choice: Pass on before the people
  chosen_korean: 백성 앞을 지나가서
  alternatives_korean:
  - 백성 앞에 서서 지나가십시오
  - 백성 앞서 가십시오
  lexicon: HALOT
  rationale: עבר의 핵심 의미인 ‘지나가다/통과하다’를 살리되, 현대 한국어에서 자연스러운 명령-연결 흐름으로 표현했습니다.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  english_pob_choice: some of the elders of Israel
  chosen_korean: 이스라엘의 장로들 가운데서 몇 사람
  alternatives_korean:
  - 이스라엘의 장로들 중에서 일부
  - 이스라엘의 장로들 가운데서
  lexicon: HALOT
  rationale: מִן-구문은 전체가 아니라 부분 선택을 뜻하므로, 영어 POB의 파악을 반영해 ‘몇 사람’을 넣어 부분성을 분명히 했습니다.
- source_word: וּמַטְּךָ... אֶת הַיְאֹר
  english_pob_choice: your staff with which you struck the Nile
  chosen_korean: 네 지팡이를 잡고 가십시오. 그 지팡이로 네가 나일강을 쳤으니
  alternatives_korean:
  - 네 손에 지팡이를 들고 가십시오. 그 지팡이로 네가 나일강을 쳤으니
  - 네 지팡이를 손에 들고 가십시오. 그 지팡이로 네가 나일강을 쳤으니
  lexicon: HALOT
  rationale: מַטֶּה는 모세의 표징 도구이므로 ‘지팡이’가 자연스럽고, יְאֹר는 출애굽기에서 보통 나일강을 가리키므로 구체적으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 화법 안에서의 명령체
  chosen_reading: 본문의 직접 인용을 한국어 공손 명령형으로 유지했습니다.
  alternative_readings:
  - 평서형으로 완화하여 번역
  - 비인칭 서술로 바꾸어 번역
  rationale: 하나님의 말씀을 백성에게 전달하는 본문이므로, 한국어에서는 합쇼체 명령형이 자연스럽고 원문의 명령성을 보존합니다.
  doctrine_reference: Narrative direct speech in translation style
