  to: 그러자 야훼께서 모세에게 말씀하셨습니다. “백성보다 앞서 가십시오. 이스라엘 장로들 가운데서 몇 사람을 데리고 가십시오[a]. 네가 나일강[b]을 칠 때 사용한 네 지팡이를 손에 들고 가십시오.”
  rationale: 수정문은 עֲבֹר לִפְנֵי הָעָם의 공간적 명령을 ‘백성보다 앞서 가십시오’로, מִן의 부분 선택을 ‘몇 사람’으로 옮겼습니다. 또한 지팡이로 나일강을 친 일을 지팡이를 식별하는 관계절로 처리하고, 원문에 없는 인과관계와 명령 중복을 제거했습니다. 각주 표지도 해당 어구에 배치했습니다.
