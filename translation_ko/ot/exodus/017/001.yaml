source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
  footnotes:
  - marker: a
    text: 'Hebrew: ''according to the mouth of the LORD,'' an idiom meaning according to his command or direction.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the whole congregation of the Israelites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 자손의 온 회중이 야훼의 명령대로 신 광야에서 단계적으로 길을 떠나 르비딤에 진을 쳤습니다. 그러나 백성이 마실 물이 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘야훼의 입에 따라’이지만, 여기서는 ‘명령대로/지시에 따라’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 자손의 온 회중’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the whole congregation of the sons of Israel
  chosen_korean: 이스라엘 자손의 온 회중
  alternatives_korean:
  - 이스라엘 사람들의 온 회중
  - 이스라엘 자손의 전체 회중
  lexicon: HALOT
  rationale: עֵדָה의 집합적 의미를 살려 ‘회중’으로 옮기고, בְּנֵי יִשְׂרָאֵל은 직역에 가까운 ‘이스라엘 자손’으로 유지해 원문의 집단 정체성을 드러냈습니다.
- source_word: לְמַסְעֵיהֶם
  english_pob_choice: by stages
  chosen_korean: 단계적으로
  alternatives_korean:
  - 여정의 단계마다
  - 차례로
  lexicon: HALOT
  rationale: 여행의 ‘구간/단계’를 뜻하는 מַסָּע의 뉘앙스를 반영해, 문맥상 자연스러운 현대 한국어로 이동의 연속성을 보여 주는 표현을 택했습니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: according to the command of Yahweh
  chosen_korean: 야훼의 명령대로
  alternatives_korean:
  - 야훼의 말씀대로
  - 야훼의 지시에 따라
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘입에 따라’는 권위 있는 지시를 뜻하므로, 영어 POB의 해석을 따라 ‘명령대로’로 옮겨 의미를 분명히 했습니다.
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  english_pob_choice: but there was no water for the people to drink
  chosen_korean: 그러나 백성이 마실 물이 없었습니다
  alternatives_korean:
  - 그리고 백성이 마실 물이 없었습니다
  - 그런데 백성이 마실 물이 없었습니다
  lexicon: HALOT
  rationale: 단순한 접속사 ו의 연결보다 상황 전환의 대비가 두드러져 한국어에서는 ‘그러나’로 옮겨 서술의 긴장감을 살렸습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문의 신명기적 고유명사를 보존하기 위해 제목어 ‘주’로 대체하지 않고 음역 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
