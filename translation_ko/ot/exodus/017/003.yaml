base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: ko
  text: 그곳에서 백성이 물이 없어 목말랐고, 백성이 모세를 원망하며 말했습니다. "어찌하여 당신이 우리를 이집트에서 올라오게 하여, 나와 내 자녀들과 내 가축을 목마름으로 죽게 하려 합니까?"
  philosophy: formal
lexical_decisions:
- source_word: וַיִּצְמָא ... לַמַּיִם
  english_pob_choice: And there the people thirsted for water
  chosen_korean: 그곳에서 백성이 물이 없어 목말랐고
  alternatives_korean:
  - 그곳에서 백성이 물을 찾아 목말랐고
  - 그곳에서 백성이 물을 갈망했고
  lexicon: צָמֵא
  rationale: 히브리어는 단순히 '갈증이 났다'는 상태를 말하므로, 원문 긴장을 살리면서도 자연스럽게 '물이 없어 목말랐다'로 옮겼습니다.
- source_word: וַיָּלֶן ... עַל מֹשֶׁה
  english_pob_choice: and the people grumbled against Moses
  chosen_korean: 백성이 모세를 원망하며
  alternatives_korean:
  - 백성이 모세에게 불평하며
  - 백성이 모세를 향해 투덜거리며
  lexicon: לוּן
  rationale: 루ן은 단순 감정 표출보다 공동체적 불평과 항의를 포함하므로, POB의 'grumbled against'에 맞춰 '원망하며'로 번역했습니다.
- source_word: לָמָּה זֶּה ...
  english_pob_choice: Why is this—that
  chosen_korean: 어찌하여 ... 합니까?
  alternatives_korean:
  - 왜 이런 일이 있습니까?
  - 왜 이렇습니까?
  lexicon: לָמָּה זֶּה
  rationale: 영어 POB가 유지한 'Why is this—that'의 당혹과 항의의 뉘앙스를 한국어에서는 자연스러운 의문문으로 살리되, 원문의 절단된 항변 구조를 보존했습니다.
- source_word: הֶעֱלִיתָנוּ מִמִּצְרַיִם
  english_pob_choice: you brought us up from Egypt
  chosen_korean: 당신이 우리를 이집트에서 올라오게 하여
  alternatives_korean:
  - 당신이 우리를 이집트에서 데리고 올라와
  - 당신이 우리를 이집트에서 끌어내어
  lexicon: עלה
  rationale: עלה의 출애굽 맥락을 살려 '올라오게 하다'를 택했고, 공동체의 집단적 이동을 반영해 '우리'를 유지했습니다.
theological_decisions:
- issue: 백성이 모세에게 던지는 항의의 직접성
  chosen_reading: 원문의 노골적 비난을 완화하지 않고, 모세에 대한 집단적 원망으로 드러냈습니다.
  alternative_readings:
  - 더 부드럽게 '모세에게 항의하며'
  - 심리적으로 중화해 '모세를 걱정하며'
  rationale: 본문은 단순한 불만이 아니라 지도자 책임을 겨냥한 강한 항변을 담고 있으므로, 그 긴장을 그대로 전달하는 것이 문맥상 적절합니다.
  doctrine_reference: 출 17장 광야 시험/원망의 서술
