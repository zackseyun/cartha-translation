source:
  edition: WLC
  text: וִ/ידֵ֤י מֹשֶׁה֙ כְּבֵדִ֔ים וַ/יִּקְחוּ אֶ֛בֶן וַ/יָּשִׂ֥ימוּ תַחְתָּ֖י/ו וַ/יֵּ֣שֶׁב עָלֶ֑י/הָ וְ/אַהֲרֹ֨ן וְ/ח֜וּר תָּֽמְכ֣וּ בְ/יָדָ֗י/ו מִ/זֶּ֤ה אֶחָד֙ וּ/מִ/זֶּ֣ה אֶחָ֔ד וַ/יְהִ֥י יָדָ֛י/ו אֱמוּנָ֖ה עַד בֹּ֥א הַ/שָּֽׁמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
  footnotes:
  - marker: a
    text: Or 'firm' or 'steadfast'; the Hebrew noun can also carry the sense of 'faithfulness,' but here it refers to the physical steadiness of Moses' hands.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세의 손이 무거워지자, 그들은 돌을 가져다가 그의 아래에 놓았고 그는 그것 위에 앉았습니다. 아론과 훌이 그의 손을, 이쪽에 하나와 저쪽에 하나씩 받쳐 주었으므로 그의 손은 해가 질 때까지 steady하게 유지되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘견고하게’ 혹은 ‘변함없이’. 히브리어 명사는 ‘신실함’의 뜻도 가질 수 있지만, 여기서는 모세의 손이 물리적으로 안정된 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה כְּבֵדִים
  english_pob_choice: Moses’ hands were heavy
  chosen_korean: 모세의 손이 무거워지자
  alternatives_korean:
  - 모세의 손은 무거웠습니다
  - 모세의 손이 피곤해지자
  lexicon: HALOT
  rationale: כְּבֵדִים의 기본 뜻인 ‘무겁다’를 살리되, 문맥상 진행을 드러내기 위해 ‘무거워지자’로 옮겼습니다.
- source_word: וַיִּקְחוּ אֶבֶן וַיָּשִׂימוּ תַחְתָּיו
  english_pob_choice: they took a stone and put it under him
  chosen_korean: 그들은 돌을 가져다가 그의 아래에 놓았고
  alternatives_korean:
  - 그들은 돌 하나를 가져다가 그의 밑에 두었고
  - 그들은 돌을 가져와 그 아래에 놓았고
  lexicon: HALOT
  rationale: אֶבֶן을 ‘돌’로 직역하고, תַחְתָּיו의 아래 위치를 자연스러운 한국어로 풀었습니다.
- source_word: וְאַהֲרֹן וְחוּר תָּמְכוּ בְיָדָיו מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  english_pob_choice: Aaron and Hur supported his hands, one on this side and one on that side
  chosen_korean: 아론과 훌이 그의 손을, 이쪽에 하나와 저쪽에 하나씩 받쳐 주었으므로
  alternatives_korean:
  - 아론과 훌이 그의 손을 양쪽에서 받쳐 주었으므로
  - 아론과 훌이 그의 손을 한쪽은 이쪽, 한쪽은 저쪽에서 받쳐 주었으므로
  lexicon: HALOT
  rationale: תָּמְכוּ는 물리적으로 ‘받치다/지탱하다’의 뜻이므로 ‘받쳐 주다’로 옮기고, מִזֶּה אֶחָד וּמִזֶּה אֶחָד의 분배적 의미를 살렸습니다.
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  english_pob_choice: so his hands remained steady
  chosen_korean: 그의 손은 해가 질 때까지 steady하게 유지되었습니다
  alternatives_korean:
  - 그의 손은 해가 질 때까지 든든하게 유지되었습니다
  - 그의 손은 해가 질 때까지 굳게 버텼습니다
  lexicon: HALOT
  rationale: אֱמוּנָה가 여기서는 도덕적 ‘신실함’보다 신체적 ‘견고함/안정됨’을 가리키므로, POB의 의미를 따라 물리적 안정성을 드러냈습니다.
theological_decisions:
- issue: אֱמוּנָה의 의미를 신실함으로 볼지, 신체적 안정성으로 볼지
  chosen_reading: 신체적 안정성으로 보아 번역했습니다
  alternative_readings:
  - 신실함
  - 견고함
  - 변함없음
  rationale: 문맥이 모세의 팔을 아론과 훌이 실제로 받치는 장면이므로, 신학적 추상화보다 물리적 지속 상태를 우선했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥이 허용하지 않는 신학적 의미 확장은 피합니다.
