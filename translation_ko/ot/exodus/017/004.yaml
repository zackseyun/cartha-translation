  text: וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לָ/עָ֣ם הַ/זֶּ֑ה ע֥וֹד מְעַ֖ט וּ/סְקָלֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yet a little, and they will stone me,'' expressing that the threat is imminent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 야훼께 부르짖으며 말했습니다. "이 백성에게 제가 어떻게 해야 합니까? 조금만 더 있으면 그들이 저를 돌로 칠 것입니다!"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아직 조금만 더 있으면 그들이 저를 돌로 칠 것입니다’라는 뜻으로, 위협이 임박했음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  english_pob_choice: cried out
  chosen_korean: 부르짖으며
  alternatives_korean:
  - 외치며
  - 소리치며
  lexicon: HALOT
  rationale: צעק는 단순한 발화보다 절박한 호소를 나타내므로, 문맥의 긴급성을 살려 ‘부르짖으며’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 고유신명은 경칭 대체어가 아니라 하나님의 언약적 이름을 드러내는 음역 ‘야훼’로 옮겼습니다.
- source_word: מָה אֶעֱשֶׂה לָעָם הַזֶּה
  english_pob_choice: What shall I do with this people?
  chosen_korean: 이 백성에게 제가 어떻게 해야 합니까?
  alternatives_korean:
  - 이 백성을 어떻게 해야 합니까?
  - 이 백성을 두고 제가 무엇을 해야 합니까?
  lexicon: HALOT
  rationale: עשה + לְ는 대상에 대한 처리를 묻는 표현이므로, 한국어에서는 ‘이 백성에게’로 자연스럽게 관계를 드러냈습니다.
- source_word: עֹד מְעַט
  english_pob_choice: A little more
  chosen_korean: 조금만 더
  alternatives_korean:
  - 아직 조금만
  - 조금만 더 있으면
  lexicon: HALOT
  rationale: 직역하면 ‘아직 조금’이지만, 이어지는 즉각적 위협을 한국어에서 가장 자연스럽게 살리는 압축 표현으로 ‘조금만 더’가 적절합니다.
- source_word: וּסְקָלֻנִי
  english_pob_choice: they will stone me
  chosen_korean: 그들이 저를 돌로 칠 것입니다
  alternatives_korean:
  - 그들이 저를 돌로 칠 것입니다
  - 그들이 저에게 돌을 던져 죽일 것입니다
  lexicon: HALOT
  rationale: סקל의 기본 의미인 ‘돌로 치다’를 보존하되, 한국어 관용에 맞게 실행형 미래로 옮겼습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 처리
  chosen_reading: ‘야훼’로 음역해 본문의 고유 이름을 보존합니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 음역
  rationale: 이 절은 텍스트상 테트라그람마톤을 직접 사용하므로, POB 원칙에 따라 대체 호칭보다 고유 이름을 드러내는 번역이 본문 충실도에 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
