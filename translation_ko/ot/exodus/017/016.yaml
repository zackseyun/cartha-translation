id: EXO.17.16
reference: Exodus 17:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר כִּֽי יָד֙ עַל כֵּ֣ס יָ֔הּ מִלְחָמָ֥ה לַ/יהוָ֖ה בַּֽ/עֲמָלֵ֑ק מִ/דֹּ֖ר דֹּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
  footnotes:
  - marker: a
    text: 'Hebrew is difficult and elliptical: literally, ''A hand upon the throne of Yah.'' It may also be understood as ''a hand against the throne of Yah,'' or, less likely, with כֵּס taken as ''banner.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말했습니다. 「야의 보좌 위에 손이 있습니다. 야훼께서는 아말렉과 대대로 전쟁을 하실 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 압축적이고 난해합니다. 문자적으로는 ‘야의 보좌 위에 손이 있습니다’이며, ‘야의 보좌를 향한 손이 있습니다’ 또는 덜 가능하지만 ‘깃발’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그는 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스러운 합쇼체로 옮기되, 원문의 주어 미표시를 살려 앞절의 화자를 이어받는 방식으로 처리했습니다.
- source_word: יָהּ
  english_pob_choice: Yah
  chosen_korean: 야
  alternatives_korean:
  - 야훼
  - 주
  lexicon: HALOT
  rationale: 짧은 신명 יָהּ를 별도로 드러내야 하므로, 뒤의 יהוה와 구별되게 음역형 ‘야’를 썼습니다.
- source_word: כֵּס
  english_pob_choice: throne
  chosen_korean: 보좌
  alternatives_korean:
  - 왕좌
  - 자리
  lexicon: HALOT
  rationale: 문맥상 יָהּ와 결합한 ‘보좌’가 가장 직접적이며, 한국어 성경 독자에게도 원문의 왕권 이미지를 분명히 전달합니다.
- source_word: מִלְחָמָה לַ/יהוָה בַּ/עֲמָלֵק
  english_pob_choice: Yahweh will have war with Amalek
  chosen_korean: 야훼께서는 아말렉과 대대로 전쟁을 하실 것입니다
  alternatives_korean:
  - 야훼께 전쟁이 있을 것입니다, 아말렉과
  - 야훼께서 아말렉과 전쟁하실 것입니다
  lexicon: HALOT
  rationale: 명사절의 압축성을 한국어로는 ‘전쟁을 하실 것입니다’로 풀어, 전쟁의 주체가 야훼이심을 분명히 하면서도 문맥상 관계를 유지했습니다.
- source_word: מִדֹּר דֹּר
  english_pob_choice: from generation to generation
  chosen_korean: 대대로
  alternatives_korean:
  - 세세대대로
  - 세대에서 세대로
  lexicon: HALOT
  rationale: 반복적 지속을 나타내는 관용구를 간결한 한국어 관용 표현 ‘대대로’로 옮겼습니다.
theological_decisions:
- issue: יַהּ와 יהוה를 같은 방식으로 처리하지 않고 구별할지 여부
  chosen_reading: יָהּ는 ‘야’, יהוה는 ‘야훼’로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘야훼’로 번역
  - 둘 다 ‘주님’으로 번역
  rationale: 원문이 짧은 신명과 완전한 신명을 함께 사용하므로, 두 형태의 차이를 한국어 본문에서도 보존하는 편이 소스 충실성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יָהּ / יְהוָה 구별 보존'
- issue: 히브리어의 압축적이고 난해한 구절 처리
  chosen_reading: ‘야의 보좌 위에 손이 있습니다’로 직역에 가깝게 두고, 의미를 과도하게 확정하지 않았습니다.
  alternative_readings:
  - ‘야의 보좌를 향한 손이 있습니다’
  - ‘야의 보좌를 치는 손이 있습니다’
  - ‘야의 깃발이 있습니다’
  rationale: 문장은 축약·생략이 심해 여러 해석이 가능하므로, 한국어 본문은 원문의 모호성을 보존하는 쪽이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
