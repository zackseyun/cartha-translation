language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH''; traditionally rendered ''the LORD.'''
    reason: alternative_reading
  - marker: b
    text: Or 'put the LORD to the test.'
    reason: lexical_alternative
translation:
  language: ko
  text: 백성이 모세와 다투며 말했습니다. “우리에게 물을 주십시오. 우리가 마시게 하려는 것입니다.” 모세가 그들에게 말했습니다. “어찌하여 너희는 나와 다투십니까? 어찌하여 야훼를 시험하십니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘야훼’(YHWH)를 사용합니다. 전통적으로는 ‘주님’으로 옮겨 왔습니다.
    reason: ot_citation
  - marker: b
    text: 또는 ‘야훼를 시험하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶב / עִם מֹשֶׁה
  english_pob_choice: quarreled with Moses
  chosen_korean: 모세와 다투며
  alternatives_korean:
  - 모세와 언쟁하며
  - 모세를 거슬러 다투며
  - 모세와 시비하며
  lexicon: HALOT
  rationale: ריב의 대립적 의미를 살리면서, 현대 한국어에서 자연스럽고 강한 충돌을 나타내는 ‘다투다’로 옮겼습니다.
- source_word: תְּנוּ לָנוּ מַיִם
  english_pob_choice: Give us water
  chosen_korean: 우리에게 물을 주십시오
  alternatives_korean:
  - 물을 우리에게 주십시오
  - 우리에게 물을 제공하십시오
  lexicon: HALOT
  rationale: 명령형 ‘주다’의 직접성을 유지하되, 합쇼체 요청으로 자연스럽게 다듬었습니다.
- source_word: וְנִשְׁתֶּה
  english_pob_choice: so that we may drink
  chosen_korean: 우리가 마시게 하려는 것입니다
  alternatives_korean:
  - 그래서 우리가 마시게 하려는 것입니다
  - 그러면 우리가 마실 수 있습니다
  - 우리가 마시도록
  lexicon: HALOT
  rationale: 히브리어의 목적/결과 뉘앙스를 한국어에서 가장 자연스럽게 풀어, 물 달라는 요청의 목적을 분명히 했습니다.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  english_pob_choice: Why do you quarrel with me?
  chosen_korean: 어찌하여 너희는 나와 다투십니까?
  alternatives_korean:
  - 왜 나와 다투십니까?
  - 어찌하여 나와 다툽니까?
  - 어찌하여 나와 시비하십니까?
  lexicon: HALOT
  rationale: מַה의 반문을 ‘어찌하여’로 살리고, ריב의 반복을 앞선 ‘다투다’와 맞춰 수사적 연결을 보존했습니다.
- source_word: מַה תְּנַסּוּן אֶת יְהוָה
  english_pob_choice: Why do you test Yahweh?
  chosen_korean: 어찌하여 야훼를 시험하십니까?
  alternatives_korean:
  - 어찌하여 야훼를 시험하십니까?
  - 왜 야훼를 시험합니까?
  - 어찌하여 주님을 시험하십니까?
  lexicon: HALOT
  rationale: יְהוָה는 본문과 프로젝트 기본어휘에 따라 ‘야훼’로 옮기고, נסה의 신학적 긴장을 ‘시험하다’로 유지했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 Tetragrammaton을 직접 사용하므로, 프로젝트 기본어휘에 따라 전통적 대체어보다 원명에 가까운 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘시험하다’의 신학적 긴장 유지
  chosen_reading: 야훼를 시험하십니까?
  alternative_readings:
  - 야훼를 떠보십니까?
  - 야훼를 시험하려 하십니까?
  rationale: 이 장면은 단순한 불평이 아니라 하나님을 시험하는 죄책 있는 행위로 제시되므로, 의미를 약화시키지 않고 직설적으로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve theological tension rather than resolve it
