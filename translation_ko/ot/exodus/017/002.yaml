revisions:
- from: 백성이 모세와 다투며 말했습니다. “우리에게 물을 주십시오. 우리가 마시게 하려는 것입니다.” 모세가 그들에게 말했습니다. “어찌하여 너희는 나와 다투십니까? 어찌하여 야훼를 시험하십니까?”[a][b]
  to: 백성이 모세와 다투며 말했습니다. “우리가 마실 수 있도록 우리에게 물을 주십시오.” 모세가 그들에게 말했습니다. “어찌하여 너희는 나와 다투십니까? 어찌하여 야훼[a]를 시험하십니까?[b]”
  rationale: 요청의 목적을 자연스러운 현대 한국어로 고쳐 히브리어 cohortative의 목적/의지 뉘앙스를 보존했습니다. 각주 b를 실제 어휘 대안으로 수정하고, 두 각주를 각각 관련 단어에 붙였습니다.
