  text: And Joshua overcame Amalek and his people with the sword[a].
  footnotes:
  - marker: a
    text: Or, more formally, 'by the edge of the sword.' The Hebrew literally reads 'by the mouth of the sword,' an idiom for defeat through armed combat.
