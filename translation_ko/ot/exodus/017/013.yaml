translation:
  language: ko
  text: 여호수아가 아말렉과 그의 백성을 칼로 쳐서 이겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘칼의 입으로’입니다. 이는 무력 충돌로 패배했다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  english_pob_choice: overcame
  chosen_korean: 쳐서 이겼습니다
  alternatives_korean:
  - 무찔렀습니다
  - 물리쳤습니다
  - 약화시켰습니다
  lexicon: HALOT
  rationale: חלש는 전투 문맥에서 ‘이기다/제압하다’의 결과를 나타낼 수 있으므로, 한국어에서는 단순한 약화보다 승리를 드러내는 표현이 자연스럽고 원문 의도를 잘 반영합니다.
- source_word: עֲמָלֵק
  english_pob_choice: Amalek
  chosen_korean: 아말렉
  alternatives_korean:
  - 아말렉 사람
  - 아말렉 족속
  lexicon: 고유명사 관례
  rationale: 히브리어 고유명사를 현대 한국어 음역 관례에 따라 아말렉으로 옮겼습니다.
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 그의 백성
  alternatives_korean:
  - 그의 군대
  - 그의 부하들
  lexicon: HALOT
  rationale: עַם은 기본적으로 ‘백성’이므로, 전투 문맥의 군사 집단을 암시하더라도 원문의 어휘를 직접 살리는 쪽을 택했습니다.
- source_word: לְפִי חָרֶב
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 칼날로
  - 칼의 날로
  - 칼끝으로
  lexicon: HALOT
  rationale: 직역하면 ‘칼의 입으로’이지만, 한국어에서는 해당 관용구의 의미인 무력에 의한 패배를 간명하게 드러내는 ‘칼로’가 가장 자연스럽습니다.
theological_decisions:
- issue: 전투 승리의 표현 강도
  chosen_reading: ‘쳐서 이겼습니다’로 번역해, 원문의 승리/제압 의미를 살리되 과도한 완전 멸절 표현은 피했습니다.
  alternative_readings:
  - 무찔렀습니다
  - 전멸시켰습니다
  rationale: 영어 POB가 overcame를 택해 ‘약화’보다 승리의 결과를 강조하므로, 한국어도 승리의 실재를 분명히 하되 본문이 말하지 않는 전멸까지는 확장하지 않았습니다.
  doctrine_reference: 본문 서술의 절제와 전쟁 서사의 문맥
