reference: Exodus 19:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
  footnotes:
  - marker: a
    text: Or 'solemnly charged us' or 'testified to us.' The Hebrew verb can carry the sense of giving formal warning or witness.
    reason: lexical_alternative
  - marker: b
    text: Or 'Set a boundary for the mountain and sanctify it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 야훼께 말했습니다. 「백성은 시내 산으로 올라갈 수 없습니다. 당신 자신이 우리에게 경고하시며[b] ‘산 주위에 경계를 정하고 그것을 거룩하게 하라’고 말씀하셨기 때문입니다。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘우리에게 엄숙히 경고하시며’ 또는 ‘우리에게 증언하시며.’ 히브리어 동사는 공식적인 경고나 증언의 의미를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 고유한 언약명 את을 제목어로 바꾸지 않고 음역하여, POB의 ‘Yahweh’ 결정을 그대로 반영했습니다.
- source_word: לֹא יוּכַל הָעָם
  english_pob_choice: cannot
  chosen_korean: 백성은 … 올라갈 수 없습니다
  alternatives_korean:
  - 백성은 … 올라갈 수 없었습니다
  - 백성은 … 올라가지 못합니다
  lexicon: HALOT
  rationale: יכולת의 불능 의미를 자연스러운 현대 한국어로 옮겨, 현재 상황에서의 불가능성을 분명히 했습니다.
- source_word: הַעֵדֹתָה בָּנוּ
  english_pob_choice: warned us
  chosen_korean: 우리에게 경고하시며
  alternatives_korean:
  - 우리에게 엄히 경고하시며
  - 우리에게 증언하시며
  - 우리에게 엄숙히 경고하시며
  lexicon: HALOT
  rationale: 출애굽기 19장의 경계 설정 문맥에서는 ‘증언하다’보다 ‘경고하다’가 핵심 의미를 더 직접적으로 드러냅니다.
- source_word: הַגְבֵּל אֶת הָהָר
  english_pob_choice: Set bounds around the mountain
  chosen_korean: 산 주위에 경계를 정하고
  alternatives_korean:
  - 산에 경계를 두고
  - 산 둘레에 한계를 정하고
  lexicon: HALOT
  rationale: גבל의 경계 설정 의미를 살려, 앞선 명령과 연결되는 자연스러운 한국어 표현으로 옮겼습니다.
- source_word: וְקִדַּשְׁתּוֹ
  english_pob_choice: consecrate it
  chosen_korean: 그것을 거룩하게 하라
  alternatives_korean:
  - 그것을 성별하라
  - 그것을 성결하게 하라
  - 그것을 성스럽게 하라
  lexicon: HALOT
  rationale: קדש의 ‘거룩하게 하다/구별하다’ 의미를 살리되, 현대 독자가 이해하기 쉬운 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 야훼의 경고가 모세의 인용문 안에서 어떻게 드러나는가
  chosen_reading: 직접 신적 발화로서 ‘당신 자신이 우리에게 경고하시며’라고 처리해, 모세가 하나님의 선행 경고를 근거로 들고 있음을 분명히 했습니다.
  alternative_readings:
  - ‘당신이 우리에게 엄히 경고하셨기 때문에’
  - ‘당신이 우리에게 증언하셨기 때문에’
  rationale: 히브리어 הַעֵדֹתָה는 단순 통보보다 공식적 경고/증언의 성격을 가지며, 시내산 언약 장면의 엄중함을 유지하는 것이 중요합니다.
  doctrine_reference: 출애굽기 19장 시내산 경계 설정과 거룩 구별의 맥락
