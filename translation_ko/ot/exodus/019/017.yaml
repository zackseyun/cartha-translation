translation:
  language: ko
  text: 그러자 모세가 하나님을 만나기 위해 백성을 진영에서 데리고 나왔습니다. 그들은 산기슭에[a] 자리를 잡고 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산의 밑자락에.’ 히브리어 표현은 산의 아래쪽 부분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  english_pob_choice: brought ... out
  chosen_korean: 데리고 나와
  alternatives_korean:
  - 이끌어 내어
  - 데려다 내어
  - 끌어내어
  lexicon: HALOT
  rationale: 히필형은 모세가 백성이 나오게 했다는 사역적 의미를 가지므로, 자연스러운 현대 한국어인 ‘데리고 나와’로 옮겨 causative 뉘앙스를 살렸습니다.
- source_word: לִקְרַאת
  english_pob_choice: to meet
  chosen_korean: 만나게 했습니다
  alternatives_korean:
  - 맞닥뜨리게 했습니다
  - 마주하게 했습니다
  - 만나러 가게 했습니다
  lexicon: HALOT
  rationale: 문맥상 시내산에서 하나님과의 만남을 향해 나아가는 뜻이므로, 단순 이동보다 목적성을 드러내는 ‘만나게 했습니다’가 가장 자연스럽습니다.
- source_word: בְּתַחְתִּית הָהָר
  english_pob_choice: at the foot of the mountain
  chosen_korean: 산기슭에
  alternatives_korean:
  - 산 아래에
  - 산밑에
  - 산의 밑자락에
  lexicon: HALOT
  rationale: 지리적 위치를 가리키는 관용 표현이므로, ‘산기슭’이 원문의 ‘산의 아래쪽/기슭’을 압축적으로 잘 전달합니다.
theological_decisions:
- issue: הָאֱלֹהִים의 한국어 처리
  chosen_reading: 하나님
  alternative_readings:
  - 그 하나님
  - 신
  rationale: 시내산의 계시 장면에서 이 명사는 이스라엘의 언약 하나님을 가리키므로, 한국어 관용과 원문 지시 대상을 함께 살리는 ‘하나님’이 적절합니다.
  doctrine_reference: 원문 우선 번역 원칙; 전통적 표현보다 원어 지시 대상을 명확히 드러내는 현대적 가독성 유지
