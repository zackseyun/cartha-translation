  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו יְהוָה֙ לֶךְ רֵ֔ד וְ/עָלִ֥יתָ אַתָּ֖ה וְ/אַהֲרֹ֣ן עִמָּ֑/ךְ וְ/הַ/כֹּהֲנִ֣ים וְ/הָ/עָ֗ם אַל יֶֽהֶרְס֛וּ לַ/עֲלֹ֥ת אֶל יְהוָ֖ה פֶּן יִפְרָץ בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
  footnotes:
  - marker: a
    text: Or “must not force their way through … lest he burst forth against them.” The Hebrew uses related imagery of breaking through for both the people's intrusion and the LORD's judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그에게 말씀하셨습니다. “내려가십시오. 당신과 아론은 함께 올라오십시오. 그러나 제사장들과 백성은 야훼께로 올라오려고 뚫고 들어와서는 안 됩니다. 그렇지 않으면 야훼께서 그들에게 들이닥치실 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “억지로 뚫고 들어와서는 안 됩니다 … 그들에게 갑자기 들이닥치실 것입니다.” 히브리어는 백성의 침범과 야훼의 심판을 같은 어근에서 나온 표현으로 연결합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 한국어에서도 호칭이 아닌 고유명사로 드러내기 위해 ‘야훼’를 채택했습니다.
- source_word: לֶךְ רֵד
  english_pob_choice: Go down
  chosen_korean: 내려가라
  alternatives_korean:
  - 가서 내려가라
  - 내려가십시오
  lexicon: HALOT
  rationale: 두 명령형의 긴박한 흐름을 한국어 자연문으로 살리기 위해 간결한 명령 ‘내려가라’를 택했습니다.
- source_word: יֶהֶרְסוּ
  english_pob_choice: must not break through
  chosen_korean: 돌파해서는 안 된다
  alternatives_korean:
  - 무너뜨리려 해서는 안 된다
  - 뚫고 들어가서는 안 된다
  lexicon: HALOT
  rationale: 문맥상 경계선을 ‘부수고 침범하는’ 행위를 가리키므로, 출애굽기 19장의 금지 동작을 가장 직접적으로 드러내는 ‘돌파하다’를 사용했습니다.
- source_word: יִפְרָץ בָּם
  english_pob_choice: lest he break out against them
  chosen_korean: 그들을 향해 터져 나가실 것이다
  alternatives_korean:
  - 그들 가운데로 돌파하실 것이다
  - 그들에게서 터져 나오실 것이다
  lexicon: HALOT
  rationale: 같은 어근의 말놀이를 유지하면서도, 야훼의 심판적 돌발을 한국어로 생생하게 전달하기 위해 ‘터져 나가다’를 택했습니다.
theological_decisions:
- issue: 야훼의 임재 앞에 접근 금지가 주는 경고의 강도
  chosen_reading: ‘돌파해서는 안 된다’와 ‘터져 나가실 것이다’로 인간의 침범과 신적 심판의 대응을 함께 드러냈습니다.
  alternative_readings:
  - ‘가까이 가서는 안 된다’처럼 완화된 표현
  - ‘진노하실 것이다’처럼 의미만 풀어쓴 표현
  rationale: 원문은 같은 어근을 반복해 침범과 심판을 연결하므로, 경고의 물리적·사법적 긴장을 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 출애굽기 19장의 거룩하신 하나님 임재와 경계 설정
