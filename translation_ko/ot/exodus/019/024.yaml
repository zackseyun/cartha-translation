  to: 야훼께서 그에게 말씀하셨습니다. “내려가십시오. 당신과 아론은 함께 올라오십시오. 그러나 제사장들과 백성은 야훼께로 올라오려고 뚫고 들어와서는 안 됩니다. 그렇지 않으면 야훼께서 그들에게 들이닥치실 것입니다.”[a]
  rationale: 합쇼체를 일관되게 적용했습니다. ‘야훼께로 올라오려고 뚫고 들어오다’는 לַעֲלֹת אֶל־יְהוָה와 יֶהֶרְסוּ의 불법적 접근 의미를 자연스럽게 옮깁니다. 심판의 결과는 ‘들이닥치실 것입니다’로 표현하여 פֶן יִפְרָץ בָּם의 갑작스럽고 적대적인 발발을 전달했으며, 관련 어근의 수사적 연결은 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:43:22Z'
