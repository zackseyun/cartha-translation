  edition: WLC
  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיֹ֣ת הַ/בֹּ֗קֶר וַ/יְהִי֩ קֹלֹ֨ת וּ/בְרָקִ֜ים וְ/עָנָ֤ן כָּבֵד֙ עַל הָ/הָ֔ר וְ/קֹ֥ל שֹׁפָ֖ר חָזָ֣ק מְאֹ֑ד וַ/יֶּחֱרַ֥ד כָּל הָ/עָ֖ם אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
  footnotes:
  - marker: a
    text: Or 'voices'; the Hebrew word can mean 'sounds' or 'voices,' but here, alongside 'lightnings,' it most likely refers to thunder.
    reason: lexical_alternative
  - marker: b
    text: Or 'the sound of a ram's horn.' The Hebrew shofar is a horn trumpet, traditionally made from an animal horn.
    reason: lexical_alternative
  - marker: c
    text: Literally 'very strong'; in context this describes the intensity of the trumpet sound.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 셋째 날 아침이 되었을 때, 천둥과 번개가 치고, 산 위에는 짙은 구름이 드리워졌으며, 나팔 소리가 몹시 컸습니다[a][b][c]. 그리고 진영에 있던 온 백성이 떨었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소리들’이나 ‘목소리들’로도 옮길 수 있습니다. 히브리어는 ‘소리’ 또는 ‘목소리’를 뜻할 수 있지만, 여기서는 ‘번개’와 함께 나오므로 대개 ‘천둥’으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘숫양 뿔의 소리’입니다. 히브리어 שׁוֹפָר는 동물의 뿔로 만든 뿔나팔을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘매우 강한’입니다. 문맥에서는 나팔 소리의 강렬함을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  english_pob_choice: And it happened on the third day
  chosen_korean: 그리고 셋째 날
  alternatives_korean:
  - 그리고 셋째 날이 되었습니다
  - 셋째 날에
  lexicon: HALOT
  rationale: 히브리어 서사적 진행을 한국어로 자연스럽게 살리되, 불필요한 반복을 줄여 사건 전개를 매끄럽게 표현했습니다.
- source_word: בִּהְיֹת הַבֹּקֶר
  english_pob_choice: when morning came
  chosen_korean: 아침이 되었을 때
  alternatives_korean:
  - 아침이 되었을 때
  - 아침이었을 때
  lexicon: HALOT
  rationale: 시간적 배경을 분명히 드러내는 표현으로, 원문의 ‘아침이 됨’이라는 시점을 자연스럽게 옮겼습니다.
- source_word: קֹלֹת וּבְרָקִים
  english_pob_choice: thunders and lightnings
  chosen_korean: 천둥과 번개가 치고
  alternatives_korean:
  - 천둥과 번개가 치고
  - 우레와 번개가 치고
  lexicon: HALOT
  rationale: 문맥상 시내 현현의 감각적 현상을 가리키므로, 한국어에서 자연스럽고 직관적인 ‘천둥과 번개’로 옮겼습니다.
- source_word: עָנָן כָּבֵד עַל הָהָר
  english_pob_choice: a heavy cloud on the mountain
  chosen_korean: 산 위에는 짙은 구름이 드리워졌으며
  alternatives_korean:
  - 산 위에는 짙은 구름이 드리워졌으며
  - 산 위에 무거운 구름이 있었습니다
  lexicon: HALOT
  rationale: ‘무거운’의 직역보다 구름의 짙고 짓누르는 성격을 살리는 ‘짙은 구름’이 한국어에서 더 적절합니다.
- source_word: קֹל שֹׁפָר חָזָק מְאֹד
  english_pob_choice: the sound of a trumpet, very loud
  chosen_korean: 나팔 소리가 몹시 컸습니다
  alternatives_korean:
  - 나팔 소리가 몹시 컸습니다
  - 뿔나팔 소리가 매우 강했습니다
  lexicon: HALOT
  rationale: שׁוֹפָר의 음향을 ‘나팔 소리’로 옮기되, 문맥상 소리의 강도를 나타내는 חָזָק מְאֹד를 ‘몹시 컸습니다’로 자연스럽게 반영했습니다.
- source_word: וַיֶּחֱרַד
  english_pob_choice: trembled
  chosen_korean: 떨었습니다
  alternatives_korean:
  - 떨었습니다
  - 두려워 떨었습니다
  lexicon: HALOT
  rationale: 히브리어의 신체적 떨림과 두려움의 반응을 함께 담되, 추가 해석을 덜어낸 기본 동사로 번역했습니다.
theological_decisions:
- issue: 시내 현현의 감각적 묘사
  chosen_reading: 현상들을 과장하거나 신비화하지 않고, 본문이 제시하는 자연현상과 공포의 반응을 그대로 드러냈습니다.
  alternative_readings:
  - 천둥을 ‘목소리들’로 옮겨 초월적 음성성을 암시하는 해석
  rationale: 원문은 시내에서의 현현을 청각·시각적 충격으로 묘사하며, 본문이 명시하지 않은 신학적 설명을 덧붙이지 않는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3
