translation:
  language: ko
  text: 모세는 하나님께 올라갔습니다. 야훼께서 산에서 그를 부르시며 말씀하셨습니다. “너는 야곱의 집안에 이렇게 말하고, 이스라엘의 아들들에게[a] 전하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’이라고 되어 있습니다. 이 남성 집합 표현은 관용적으로 ‘이스라엘 자손’ 또는 ‘이스라엘 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
