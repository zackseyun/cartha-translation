    issue: ‘올라가자’가 וּמֹשֶׁה עָלָה의 단순 서술을 계기·동시 관계로 바꿉니다.
    rationale: 히브리어는 모세가 올라간 사건을 와우 접속으로 서술한 뒤 야훼의 행동을 이어 갑니다. ‘모세는 … 올라갔습니다’가 이 순서를 더 직접적으로 반영합니다.
