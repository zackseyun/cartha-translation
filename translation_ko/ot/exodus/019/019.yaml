  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
  footnotes:
  - marker: a
    text: Or 'grew louder and louder.' The Hebrew literally describes the trumpet sound as 'going and becoming very strong.'
