  - marker: b
    text: Or 'God answered him in thunder' or 'audibly.' The Hebrew says 'with a voice.'
    reason: alternative_reading
translation:
  language: ko
  text: 나팔 소리가 점점 더 세졌습니다[a]. 모세가 말할 때, 하나님께서 음성으로 그에게 대답하셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘점점 더 크게 울렸습니다.’ 히브리어는 문자적으로 나팔 소리가 ‘계속되며 매우 강해졌다’고 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께서 그에게 천둥으로 대답하셨습니다’ 혹은 ‘들리도록 대답하셨습니다.’ 히브리어는 ‘음성으로’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל הַשּׁוֹפָר
  english_pob_choice: the sound of the trumpet
  chosen_korean: 나팔 소리
  alternatives_korean:
  - 트럼펫 소리
  - 나팔의 음성
  lexicon: HALOT
  rationale: שׁוֹפָר는 예배·신현 맥락의 나팔/양각나팔을 가리키므로, 현대 한국어에서는 자연스러운 ‘나팔 소리’가 본문의 청각 이미지를 가장 잘 전달합니다.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  english_pob_choice: kept growing stronger and stronger
  chosen_korean: 점점 더 세졌습니다
  alternatives_korean:
  - 점점 더 강해졌습니다
  - 계속 더 크게 울렸습니다
  - 점점 더 크게 울렸습니다
  lexicon: HALOT
  rationale: 히브리어의 지속적·증가적 표현을 한국어의 ‘점점 더’로 옮기고, 소리의 맥락에 맞게 ‘세지다’로 자연스럽게 표현했습니다.
- source_word: מֹשֶׁה יְדַבֵּר
  english_pob_choice: Moses would speak
  chosen_korean: 모세가 말하면
  alternatives_korean:
  - 모세가 말하곤 했습니다
  - 모세는 말했습니다
  - 모세가 말할 때마다
  lexicon: HALOT
  rationale: 미완료형은 장면 속 반복적·진행적 동작을 나타내므로, 한국어에서는 ‘말하면’으로 조건/반복의 뉘앙스를 살려 뒤의 응답과 대응시켰습니다.
- source_word: בְּקוֹל
  english_pob_choice: with a voice
  chosen_korean: 음성으로
  alternatives_korean:
  - 소리로
  - 목소리로
  - 천둥으로
  lexicon: HALOT
  rationale: 본문은 ‘음성/소리’를 문자 그대로 유지하며 천둥으로 단정하지 않으므로, 하나님이 응답하신 방식의 모호성을 보존하는 ‘음성으로’를 택했습니다.
theological_decisions:
- issue: 하나님의 응답 방식의 모호성
  chosen_reading: 하나님께서 음성으로 그에게 대답하셨습니다
  alternative_readings:
  - 하나님께서 천둥으로 그에게 대답하셨습니다
  - 하나님께서 그에게 들리게 대답하셨습니다
  rationale: בְּקוֹל은 ‘음성/소리’로도, 상황에 따라 ‘천둥’의 청각적 현상으로도 읽힐 수 있지만, 본문이 그 해석을 확정하지 않으므로 본문 표현을 유지해 신학적 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
