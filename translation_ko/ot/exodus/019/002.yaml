  source_fidelity: 히브리어의 이동-도착-진침의 순서와 반복된 מִדְבָּר(‘광야’)를 충실히 반영했습니다. 집합 명사 ‘이스라엘’에 단수 동사가 쓰인 표현도 한국어에서 자연스럽게 유지되었습니다. נֶגֶד הָהָר의 공간적 관계를 ‘산 앞에’로 옮기고 대안적 의미를 각주로 보완한 것은 원문의 범위를 보존합니다.
  naturalness: ‘르비딤을 떠나 시내 광야에 이르렀고, 광야에 진을 쳤습니다’와 ‘그곳에서 이스라엘이 산 앞에 진을 쳤습니다’는 현대 표준 한국어 합쇼체로 자연스럽고 읽기 쉽습니다. ‘진을 치다’의 반복도 원문의 반복과 이동 서사의 리듬을 적절히 반영합니다.
  terminology: ‘르비딤’, ‘시내 광야’, ‘이스라엘’, ‘광야’, ‘진을 치다’는 성경 문맥에서 안정적이고 일관된 용어입니다. ‘산 앞에’는 특정 지형 방향을 과도하게 확정하지 않으며, 각주가 ‘맞은편’의 가능한 의미를 적절히 제시합니다.
