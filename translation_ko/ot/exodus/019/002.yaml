base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
  footnotes:
  - marker: a
    text: Or 'opposite the mountain.' The Hebrew preposition can denote a position facing or in front of something.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 르비딤을 떠나 시내 광야에 이르렀고, 광야에 진을 쳤습니다. 그곳에서 이스라엘이 산 앞에 진을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산 맞은편에’. 히브리어 전치사는 어떤 것의 앞이나 마주한 위치를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  english_pob_choice: They set out
  chosen_korean: 떠나
  alternatives_korean:
  - 출발하고
  - 길을 떠나
  lexicon: HALOT
  rationale: נסע는 여행 서사에서 장막을 걷고 이동하는 뉘앙스를 가지므로, 현대 한국어에서는 자연스러운 ‘떠나’로 옮겨 출발의 동작을 살렸습니다.
- source_word: מִדְבַּר סִינַי
  english_pob_choice: the wilderness of Sinai
  chosen_korean: 시내 광야
  alternatives_korean:
  - 시내의 광야
  - 시내 사막
  lexicon: HALOT
  rationale: מִדְבָּר는 성경 한국어에서 ‘광야’가 가장 안정적이며, 지명 결합은 간결하게 ‘시내 광야’로 처리했습니다.
- source_word: וַיַּחֲנוּ / וַיִּחַן
  english_pob_choice: they camped / Israel camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프를 쳤습니다
  - 장막을 쳤습니다
  - 진을 쳤습니다
  lexicon: HALOT
  rationale: חנה는 단순히 머무는 것이 아니라 군대·공동체가 진을 치는 상황을 가리키므로, 두 동사를 모두 한국어의 군사적·서사적 표현인 ‘진을 치다’로 살렸습니다.
- source_word: נֶגֶד הָהָר
  english_pob_choice: before the mountain
  chosen_korean: 산 앞에
  alternatives_korean:
  - 산 맞은편에
  - 산 앞쪽에
  lexicon: HALOT
  rationale: נֶגֶד는 ‘앞에/맞은편에’의 공간 관계를 나타내므로, 문맥상 과도한 해석을 피하는 중립적 표현 ‘산 앞에’를 택했습니다.
theological_decisions:
- issue: 이스라엘의 집합 명사와 단수 동사 관계
  chosen_reading: ‘이스라엘이 … 진을 쳤습니다’처럼 한국어에서도 단수 집합 명사로 처리했습니다.
  alternative_readings:
  - ‘이스라엘 백성이 … 진을 쳤습니다’
  - ‘이스라엘 사람들이 … 진을 쳤습니다’
  rationale: 히브리어의 단수형 동사와 집합적 주어를 자연스럽게 반영하면서, 공동체 전체가 하나의 몸처럼 위치에 놓였다는 서술 효과를 유지합니다.
  doctrine_reference: 서사 문맥의 집합 주어 처리
