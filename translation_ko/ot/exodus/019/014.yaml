translation:
  language: ko
  text: 모세는 산에서 내려와 백성에게 가서 백성을 거룩하게 구별하였고[a], 그들은 자기들의 옷을 빨았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “백성을 거룩하게 하였다” 또는 “백성을 성별하였다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד מֹשֶׁה מִן הָהָר אֶל הָעָם
  english_pob_choice: Moses went down from the mountain to the people
  chosen_korean: “모세가 산에서 백성에게 내려가서”
  alternatives_korean:
  - 모세가 산에서 사람들에게 내려가서
  - 모세가 산에서 회중에게 내려가서
  lexicon: HALOT
  rationale: ירד의 하향 이동을 한국어의 자연스러운 서술인 “내려가서”로 살렸고, עָם은 여기서 집단 전체를 가리키므로 “백성”이 가장 직접적입니다.
- source_word: וַיְקַדֵּשׁ אֶת הָעָם
  english_pob_choice: he consecrated the people
  chosen_korean: “백성을 거룩하게 구별하고”
  alternatives_korean:
  - 백성을 성별하고
  - 백성을 거룩하게 하였고
  - 백성을 구별하여 거룩하게 하고
  lexicon: HALOT
  rationale: קדש의 제의적 의미를 살리되, 한국어에서 ‘성별하다’보다 의미가 분명한 “거룩하게 구별하다”를 택해 의식적 준비라는 뜻을 드러냈습니다.
- source_word: וַיְכַבְּסוּ שִׂמְלֹתָם
  english_pob_choice: they washed their garments
  chosen_korean: “그들은 자기 옷을 빨았습니다.”
  alternatives_korean:
  - 그들은 자기 의복을 씻었습니다.
  - 그들은 자기 옷을 세탁했습니다.
  lexicon: HALOT
  rationale: כבס는 옷을 씻는 행위를 가리키므로 “빨다”가 가장 직접적이며, שִׂמְלָה는 의례적 준비 맥락에서 지나치게 문어적인 “의복”보다 “옷”이 자연스럽습니다.
theological_decisions:
- issue: קדש의 제의적 의미를 한국어로 어떻게 드러낼지
  chosen_reading: “거룩하게 구별하다”로 옮겨, 도덕적 변화보다 하나님 앞에 나아가기 위한 의례적 준비를 강조했습니다.
  alternative_readings:
  - ‘성화하다’
  - ‘성별하다’
  - ‘거룩하게 하다’
  rationale: 본문은 시내산 현현을 앞둔 정결 예비 절차이므로, 신학적 추상화보다 예식적 구별의 의미가 분명해야 합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
