review_pass:
  verdict: revise
  source_fidelity: יַתְקַדָּשׁוּ is reflexive and is more precisely represented by ‘자신을 성별해야 합니다.’ The warning פֶּן יִפְרֹץ בָּהֶם retains the image of Yahweh’s sudden hostile outbreak; ‘그들에게 들이닥치실 수 있습니다’ is idiomatic Korean and avoids the unnatural, overly physical ‘갑자기 치고 나오실 수 있습니다.’
  naturalness: ‘야훼께 가까이 나아가는’ is natural in a formal biblical register. ‘자신을 성별하다’ is both idiomatic and appropriately cultic. Moving each footnote anchor directly after its relevant expression improves readability and anchor precision.
  terminology: ‘야훼,’ ‘제사장들,’ and ‘성별하다’ are suitable for standard Korean modern formal-polite biblical translation. ‘성별하다’ conveys consecration without suggesting that holiness is self-generated.
  issues:
  - severity: medium
    issue: ‘스스로 거룩하게 해야 합니다’ is less precise for the reflexive cultic verb.
    rationale: The Hebrew Hitpael calls for the priests to consecrate themselves. ‘자신을 성별해야 합니다’ preserves both the reflexive sense and the established cultic terminology.
  - severity: medium
    issue: ‘그들을 향해 갑자기 치고 나오실 수 있습니다’ is unnatural Korean and gives an overly literal physical image.
    rationale: פּרץ בְּ denotes a sudden outbreak against persons in judgment. ‘그들에게 들이닥치실 수 있습니다’ naturally conveys the threatening onset while preserving the source’s warning.
  - severity: low
    issue: The footnote anchors are placed at the end of the sentence rather than beside their respective expressions.
    rationale: Anchoring [a] to the approaching phrase and [b] to the outbreak expression makes their lexical scope unambiguous.
  revised_text: 그리고 야훼께 가까이 나아가는 제사장들도 자신을 성별해야 합니다.[a] 그렇지 않으면 야훼께서 그들에게 들이닥치실 수 있습니다.[b]
