source:
  edition: WLC
  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
  footnotes:
  - marker: a
    text: Or "who approach the LORD" or "who draw near to the LORD."
    reason: lexical_alternative
  - marker: b
    text: Or "break forth upon them." The Hebrew depicts a sudden outbreak of the LORD's judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 야훼께 가까이 나아가는 제사장들도 자신을 성별해야 합니다.[a] 그렇지 않으면 야훼께서 그들에게 들이닥치실 수 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께 가까이 나아오는” 또는 “야훼께 다가가는”.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들에게 돌진해 들어가실 수 있습니다.” 히브리어는 야훼의 심판이 갑자기 터져 나오는 모습을 묘사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And even
  chosen_korean: 그리고 …도
  alternatives_korean:
  - 또한
  - 그리고도
  lexicon: HALOT
  rationale: 직전 경고에 이어 제사장들까지 포함된다는 추가·강조를 한국어에서 자연스럽게 드러내기 위해 ‘그리고 …도’로 옮겼습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 제사장
  lexicon: HALOT
  rationale: 제의적 문맥에서 כֹּהֲנִים의 표준적 대응어로 ‘제사장들’을 사용했습니다.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  english_pob_choice: who come near to Yahweh
  chosen_korean: 야훼께 가까이 나아가는
  alternatives_korean:
  - 야훼께 접근하는
  - 야훼께 다가가는
  lexicon: HALOT
  rationale: נגשׁ의 제의적 접근 의미를 살리면서 한국어 성경 문체에 자연스러운 ‘가까이 나아가다’를 택했습니다.
- source_word: יִתְקַדָּשׁוּ
  english_pob_choice: must consecrate themselves
  chosen_korean: 스스로 거룩하게 해야 합니다
  alternatives_korean:
  - 스스로 성별해야 합니다
  - 스스로 성결하게 해야 합니다
  lexicon: HALOT
  rationale: 재귀적 히트파엘의 ‘자기 자신을 구별하여 거룩하게 함’을 살리되, 현대 한국어에서 이해가 분명한 표현으로 옮겼습니다.
- source_word: יִפְרֹץ בָּהֶם
  english_pob_choice: break out against them
  chosen_korean: 그들을 향해 갑자기 치고 나오실 수 있습니다
  alternatives_korean:
  - 그들에게서 갑자기 터져 나오실 수 있습니다
  - 그들을 향해 돌파하실 수 있습니다
  lexicon: HALOT
  rationale: פרץ의 돌발적·파괴적 이미지를 살리면서, 문맥상 심판의 위협을 드러내기 위해 ‘갑자기 치고 나오다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 기본 원칙에 따라 신명문을 ‘야훼’로 표기하여 언약적 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: ‘break out against them’의 성격
  chosen_reading: 성소 경계 위반에 대한 즉각적 심판 위협
  alternative_readings:
  - 단순히 그들에게 다가오시는 것
  - 일반적인 신적 임재의 돌파
  rationale: 문맥상 거룩하지 않은 접근은 위험하며, 동사의 생생한 돌발성을 한국어에서 ‘갑자기 치고 나오다’로 보존했습니다.
  doctrine_reference: 출애굽기 19장 시내산 경계와 거룩함의 긴장
