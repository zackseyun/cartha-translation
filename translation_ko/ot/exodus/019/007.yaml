base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
  footnotes:
  - marker: a
    text: Or 'summoned the elders of the people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all these matters' or 'all these things.' The Hebrew word can refer either to spoken words or to matters under discussion; here 'words' is chosen because Moses is relaying the LORD's message.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 와서 백성의 장로들을 불러 모으고, 여호와께서 자기에게 명령하신 이 모든 말씀을 그들 앞에 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불러 모으고’는 히브리어 קרא ל의 문맥상 자연스러운 옮김입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘말씀’은 히브리어 דברים가 여기서 단순한 ‘일들’이 아니라 전달된 발화 내용을 가리키기 때문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 이르러
  - 왔다
  lexicon: HALOT
  rationale: 서술의 흐름상 모세가 여호와에게서 돌아와 백성에게 나아오는 장면이므로, 자연스러운 연결 동사로 ‘와서’를 택했습니다.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  english_pob_choice: called for the elders of the people
  chosen_korean: 백성의 장로들을 불러 모으고
  alternatives_korean:
  - 백성의 장로들을 불러서
  - 백성의 장로들을 소집하고
  lexicon: HALOT
  rationale: לְ가 붙은 קרא는 단순히 ‘부르다’보다 사람들을 불러 모아 소집하는 뉘앙스를 가질 수 있으므로, 문맥에 맞게 ‘불러 모으고’로 옮겼습니다.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말씀
  alternatives_korean:
  - 이 모든 말
  - 이 모든 일들
  lexicon: HALOT
  rationale: 하나님이 앞선 절들에서 하신 말씀을 모세가 전달하는 맥락이므로, ‘말씀’이 source의 verbal sense를 가장 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: project_default
  rationale: 이 역본의 한국어 성경 전통과 가독성을 고려해 하나님의 이름은 ‘여호와’로 표기했습니다. 영어 POB의 ‘Yahweh’와 대응하는 선택입니다.
theological_decisions:
- issue: 여호와의 명령을 전달하는 모세의 중개 역할
  chosen_reading: 모세가 여호와의 명령을 그대로 장로들에게 전달한 것으로 유지했습니다.
  alternative_readings:
  - 모세가 자신의 말로 설명한 것으로 완화
  - 명령의 권위감을 약화시켜 일반적 지시로 번역
  rationale: 본문은 모세의 발화가 아니라 여호와께서 명령하신 내용을 중개 전달하는 장면이므로, 명령의 직접성과 권위를 약화하지 않도록 했습니다.
  doctrine_reference: 출애굽기 19장의 언약 체결 준비와 계시 전달 구조
