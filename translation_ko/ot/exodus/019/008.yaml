  text: וַ/יַּעֲנ֨וּ כָל הָ/עָ֤ם יַחְדָּו֙ וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֑ה וַ/יָּ֧שֶׁב מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
  footnotes:
  - marker: a
    text: Or, 'reported' the words of the people to the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 백성이 함께 대답하여 말했습니다. “야훼께서 말씀하신 모든 것을 우리가 행하겠습니다.” 그러자 모세는 백성의 말을 야훼께 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘백성의 말을 야훼께 되돌려 전했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  english_pob_choice: answered ... said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 대답하며 말했습니다
  lexicon: HALOT
  rationale: ענה와 אמר의 연속은 구두 응답을 드러내므로, 합쇼체에서 자연스럽고 본문 흐름을 살리는 ‘대답하여 말했습니다’로 옮겼습니다.
- source_word: כָל הָעָם יַחְדָּו
  english_pob_choice: all the people ... together
  chosen_korean: 모든 백성이 한꺼번에
  alternatives_korean:
  - 온 백성이 함께
  - 모든 백성이 함께
  lexicon: HALOT
  rationale: כָל הָעָם의 집합성과 יַחְדָּו의 일치된 반응을 함께 살리기 위해 ‘모든 백성이 한꺼번에’로 옮겼습니다.
- source_word: נַעֲשֶׂה
  english_pob_choice: we will do
  chosen_korean: 우리가 행하겠습니다
  alternatives_korean:
  - 우리가 하겠습니다
  - 우리가 순종하겠습니다
  lexicon: HALOT
  rationale: עשה는 여기서 명령에 대한 수행을 가리키지만, 영어 POB처럼 ‘obey’로 좁히지 않고 ‘행하겠습니다’로 옮겨 원문의 동사 의미를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: standard project glossary
  rationale: 본 프로젝트 기본 용례에 따라 여호와나 대체 호칭 대신 고유 이름 ‘야훼’를 사용해 신명기의 직역성을 보존했습니다.
- source_word: וַיָּשֶׁב ... אֶל יְהוָה
  english_pob_choice: brought back ... to Yahweh
  chosen_korean: 전했습니다 ... 야훼께
  alternatives_korean:
  - 가져갔습니다 ... 야훼께
  - 보고했습니다 ... 야훼께
  lexicon: HALOT
  rationale: שׁוב의 히필은 ‘되돌려 가져가다/전하다’의 뜻이므로, 모세가 백성의 말을 하나님께 전달한 동작을 간결하게 드러내는 ‘전했습니다’로 옮겼습니다.
theological_decisions:
- issue: 언약 응답의 번역 강도
  chosen_reading: ‘행하겠습니다’로 번역해 실제 수행 약속을 드러내되, ‘순종하겠습니다’로 신학적 해석을 덧씌우지 않았습니다.
  alternative_readings:
  - 순종하겠습니다
  - 하겠습니다
  rationale: 본문은 백성의 즉각적 수락을 말하지만, 히브리어는 단순히 ‘하다’이므로 해석적 강조를 자제했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve what the source text plainly says'
