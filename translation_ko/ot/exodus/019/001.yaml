  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''on this day.'' The phrase may emphasize the exact day of arrival: ''on this very day.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 이집트 땅에서 나온 뒤 셋째 달, 바로 이 날 그들은 시내 광야에 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’, ‘이스라엘 백성’. 히브리어는 ‘이스라엘의 아들들’, 곧 ‘이스라엘 자손’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 날에’. 이 표현은 도착의 정확한 날짜를 강조해 ‘바로 이 날’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  english_pob_choice: in the third month
  chosen_korean: 셋째 달
  alternatives_korean:
  - 세 번째 달
  - 삼월
  lexicon: HALOT
  rationale: 시간 표지로서의 חֹדֶשׁ을 자연스러운 현대 한국어로 옮기되, 달력식 ‘삼월’보다 원문의 기간 표현을 그대로 살렸습니다.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: after the sons of Israel had gone out
  chosen_korean: 이스라엘 자손이 ... 나온 뒤
  alternatives_korean:
  - 이스라엘 자손이 ... 나간 뒤
  - 이스라엘 백성이 ... 나온 뒤
  lexicon: HALOT
  rationale: לְצֵאת의 시간 관계를 ‘... 나온 뒤’로 자연스럽게 표현했고, בְּנֵי יִשְׂרָאֵל은 원문의 집단 표지를 살려 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트 땅에서부터
  - 이집트에서
  lexicon: HALOT
  rationale: אֶרֶץ의 ‘땅’이 명시되어 있으므로, 지명만으로 줄이지 않고 ‘이집트 땅’으로 옮겨 원문의 지리적 표현을 보존했습니다.
- source_word: בַּיּוֹם הַזֶּה
  english_pob_choice: on this very day
  chosen_korean: 바로 이 날
  alternatives_korean:
  - 이 날
  - 그 날
  lexicon: HALOT
  rationale: 지시어 ‘this’의 강조를 살려 단순한 ‘이 날’보다 ‘바로 이 날’로 옮겼습니다.
theological_decisions:
- issue: 이스라엘 집단 표지 בְּנֵי יִשְׂרָאֵל의 번역
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 문맥상 집합 명칭이지만, 히브리어의 직역 투명성을 유지하기 위해 관용적 ‘이스라엘 백성’보다 원문 구조를 드러내는 ‘이스라엘 자손’을 채택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
