id: EXO.19.13
reference: Exodus 19:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
  footnotes:
  - marker: a
    text: Or 'No hand shall touch it,' if the pronoun is taken more generally; the sense is that the offender must not be touched directly but executed from a distance.
    reason: alternative_reading
  - marker: b
    text: Or 'surely pierced.' The Hebrew verb can refer to being shot, likely with arrows in this context.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'when the yobel is drawn out'; this likely refers to a prolonged blast on a ram’s horn.
    reason: cultural_note
translation:
  language: ko
  text: 어떤 손도 그를 만져서는 안 됩니다[a]. 반드시 돌로 쳐야 하거나[b] 반드시 화살로 쏘아야 합니다. 짐승이든 사람이든 상관없이 그는 살아남지 못합니다. 나팔 소리가 길게 울릴 때[c] 그들이 산에 올라갈 수 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을’로도 옮길 수 있습니다. 히브리어 대명사는 더 일반적으로 금기를 어긴 대상을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘반드시 꿰뚫려야 하거나’. 히브리어 동사는 이 문맥에서 화살로 쏘는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘나팔이 길게 끌려질 때’입니다. 이는 숫양 뿔나팔의 긴 울림을 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תִגַּע בּוֹ יָד
  english_pob_choice: No hand shall touch him
  chosen_korean: 어떤 손도 그를 만져서는 안 됩니다
  alternatives_korean:
  - 아무 손도 그를 대서는 안 됩니다
  - 손이 그를 만져서는 안 됩니다
  lexicon: HALOT
  rationale: 직역의 어순을 그대로 옮기기보다, 금지법의 엄격한 법적 어조를 살려 ‘어떤 손도 … 만져서는 안 됩니다’로 자연스럽게 표현했습니다.
- source_word: סָקוֹל יִסָּקֵל
  english_pob_choice: he must surely be stoned
  chosen_korean: 반드시 돌로 쳐야 합니다
  alternatives_korean:
  - 반드시 돌로 쳐질 것입니다
  - 틀림없이 돌로 맞아야 합니다
  lexicon: HALOT
  rationale: עָקֹל+미완료의 강조를 한국어의 ‘반드시’로 살리고, 형벌 집행을 능동적 법문체로 옮겼습니다.
- source_word: יָרֹה יִיָּרֶה
  english_pob_choice: surely shot
  chosen_korean: 반드시 화살로 쏘아야 합니다
  alternatives_korean:
  - 반드시 쏘아야 합니다
  - 반드시 꿰뚫어 쏘아야 합니다
  lexicon: HALOT
  rationale: POB의 문맥 판단처럼 ירה를 사살 행위로 이해하여, 현대 독자가 바로 알아들을 수 있게 ‘화살로’와 ‘쏘아야 합니다’를 택했습니다.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  english_pob_choice: When the ram’s horn sounds a long blast
  chosen_korean: 나팔 소리가 길게 울릴 때
  alternatives_korean:
  - 숫양 뿔나팔이 길게 울릴 때
  - 희년 나팔이 길게 울릴 때
  lexicon: HALOT
  rationale: יֹבֵל을 POB처럼 길게 끄는 나팔 소리의 관용구로 이해해, 의미를 드러내는 ‘나팔 소리가 길게 울릴 때’로 옮겼습니다.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  english_pob_choice: they may go up on the mountain
  chosen_korean: 그들이 산에 올라갈 수 있습니다
  alternatives_korean:
  - 그들은 산에 올라갈 수 있습니다
  - 그들이 그 산에 올라갈 수 있습니다
  lexicon: HALOT
  rationale: 허용의 의미를 반영해 단순 미래가 아니라 가능·허가를 나타내는 ‘-ㄹ 수 있습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘No hand shall touch him’의 지시 대상
  chosen_reading: ‘그를’로 옮겨, 산을 범한 위반자에게 대한 직접 접촉 금지와 처형 명령을 드러냈습니다.
  alternative_readings:
  - ‘그것을’로 옮겨 산을 가리키는 일반적 금기 표현으로 이해할 수 있습니다.
  rationale: 바로 앞 문맥의 법적 처벌 대상이 사람 또는 짐승이며, POB도 이 대상을 지시하는 것으로 읽었습니다. 따라서 인칭 지시를 유지하는 것이 문맥상 가장 적절합니다.
  doctrine_reference: 문맥/지시대상 해석
