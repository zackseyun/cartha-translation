  naturalness: ‘어떤 손도 그를’은 직역투여서 현대 한국어 법문체로는 ‘아무도 그에게 손을 대서는’이 자연스럽습니다. 처벌문은 두 동사를 병렬로 처리하고, ‘짐승이든 사람이든’ 뒤에는 포괄적으로 ‘살아서는 안 됩니다’라고 하는 것이 자연스럽고 명료합니다.
  terminology: ‘돌로 치다’, ‘화살로 쏘다’, ‘숫양 뿔나팔’은 문맥과 현대 표준어에 적합합니다. ‘나팔’만으로는 יוֹבֵל의 구체적 의미가 본문에서 약해지므로 ‘숫양 뿔나팔’로 보완합니다.
