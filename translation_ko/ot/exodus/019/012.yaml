id: EXO.19.12
reference: Exodus 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִגְבַּלְתָּ֤ אֶת הָ/עָם֙ סָבִ֣יב לֵ/אמֹ֔ר הִשָּׁמְר֥וּ לָ/כֶ֛ם עֲל֥וֹת בָּ/הָ֖ר וּ/נְגֹ֣עַ בְּ/קָצֵ֑/הוּ כָּל הַ/נֹּגֵ֥עַ בָּ/הָ֖ר מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
  footnotes:
  - marker: a
    text: Or, 'shall surely die.' The Hebrew expression is an emphatic death formula; here it is rendered 'shall surely be put to death' to reflect the passive form and the immediate context of imposed execution in the next verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성 주위에 경계를 정하고 이렇게 말하십시오. 「산에 올라가거나 그 끝을 만지지 않도록 조심하십시오. 산을 만지는 사람은 반드시 죽임을 당할 것입니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 강조를 위해 같은 어근을 거듭 사용한 표현으로, ‘반드시 죽임을 당할 것이다’라는 뜻입니다. 수동형이며, 다음 절에는 그 형벌의 집행 방식이 이어집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  english_pob_choice: you shall set bounds
  chosen_korean: 경계를 정하고
  alternatives_korean:
  - 경계선을 두고
  - 둘러 막고
  - 한계를 정하고
  lexicon: HALOT
  rationale: 히필형의 ‘경계를 정하다/제한하다’라는 뜻을 살려, 본문의 공간적 제한을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: סָבִיב
  english_pob_choice: all around
  chosen_korean: 사방으로
  alternatives_korean:
  - 둘레에
  - 둘러
  - 온 사방에
  lexicon: HALOT
  rationale: ‘사방으로’는 백성을 둘러 경계를 세우는 전면적 둘레의 뜻을 간결하게 드러냅니다.
- source_word: הִשָּׁמְרוּ לָכֶם
  english_pob_choice: Be careful
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 주의하십시오
  - 스스로를 경계하십시오
  - 삼가십시오
  lexicon: HALOT
  rationale: 자기를 지키라는 관용적 경고를 현대 합쇼체의 직접 명령으로 살렸습니다.
- source_word: מוֹת יוּמָת
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당할 것입니다
  alternatives_korean:
  - 반드시 죽을 것입니다
  - 반드시 사형을 당할 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강한 확정 표현을 살리되, 다음 절의 집행 맥락을 반영해 수동적 ‘죽임을 당하다’로 옮겼습니다.
theological_decisions:
- issue: 금지 위반에 대한 형벌 표현
  chosen_reading: ‘산을 만지는 사람은 반드시 죽임을 당할 것입니다’로, 단순한 자연사식 ‘죽을 것이다’보다 집행되는 형벌의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - 반드시 죽을 것입니다
  - 반드시 사형을 당할 것입니다
  rationale: 바로 다음 절에서 실제 처형이 이어지므로, 본 절의 선언은 형벌 선고로 읽는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 출애굽기 19:13의 문맥적 연속성
- issue: ‘산에 올라가거나… 만지지 않도록’의 금지 범위
  chosen_reading: 등반과 접촉을 모두 금지하는 이중 경고로 유지했습니다.
  alternative_readings:
  - 산에 오르지 마십시오
  - 그 끝을 만지지 마십시오
  rationale: 원문은 두 동작을 병렬로 금지하여 거룩한 경계의 엄중함을 강조합니다.
  doctrine_reference: 거룩의 경계와 접근 금지의 서술적 강조
