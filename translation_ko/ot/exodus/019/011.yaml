  chosen_korean: 온 백성의 눈앞에서
  alternatives_korean:
  - 온 백성이 보는 앞에서
  - 모든 백성의 시선 앞에서
  lexicon: HALOT
  rationale: 직역에 가까운 ‘눈앞’으로 לְעֵינֵי의 생생한 시각적 이미지를 보존했습니다.
theological_decisions:
- issue: 야훼의 강림을 나타내는 동사 표현
  chosen_reading: ‘내려오실 것입니다’로 번역하여 시내산 위로 임하는 현현의 움직임을 보존했습니다.
  alternative_readings:
  - ‘강림하실 것입니다’
  - ‘내려가실 것입니다’
  rationale: 히브리어 יֵרֵד의 기본 의미는 ‘내려오다’이며, 본문은 산 위로 임하시는 야훼의 현현을 말하므로 그 움직임을 직접적으로 드러내는 표현이 적절합니다.
  doctrine_reference: Exodus 19 theophany context
