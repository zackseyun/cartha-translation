  - 셋째 날에 대비하여
  lexicon: HALOT
  rationale: ל의 목표/지향 의미를 살려 특정한 날을 향한 준비라는 뉘앙스를 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
