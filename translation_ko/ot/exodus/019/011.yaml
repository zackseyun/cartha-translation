  lexicon: Project default / HALOT
  rationale: Tetragrammaton을 대체 칭호가 아니라 고유명으로 드러내기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다.
- source_word: לְעֵינֵי כָל הָעָם
