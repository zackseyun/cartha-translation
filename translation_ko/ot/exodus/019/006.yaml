  text: 너희는 나에게 제사장들의 나라[a]와 거룩한 민족이 될 것입니다. 이것들이 네가 이스라엘 자손[b]에게 말할 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제사장적 나라.” 히브리어 표현은 제사장들로 이루어진 나라 또는 제사장적 성격을 지닌 나라로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “이스라엘 자손”은 이스라엘의 남성만이 아니라 이스라엘 공동체 전체를 가리키는 히브리어 관용 표현입니다.
    reason: cultural_note
