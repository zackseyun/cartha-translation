  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
  footnotes:
  - marker: a
    text: Or 'may also trust you' or 'may also believe in you.' The Hebrew can express confidence in Moses as God's accredited spokesman.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “보십시오, 내가 짙은 구름 가운데로 너에게 가고 있다. 이는 백성이 내가 너와 말할 때 듣게 하고, 또 너를 영원히 믿게 하려는 것이다.” 그러고 나서 모세는 백성의 말을 야훼께 아뢰었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너를 신뢰하게 하려는 것이다’. 히브리어는 모세의 말에 대한 신뢰를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유명사인 언약의 이름을 직역하지 않고 음역하여 보존했습니다. 본문이 직접 יְהוָה를 사용하므로 ‘주님’보다 ‘야훼’가 원문 대비성이 더 높습니다.
- source_word: בְּעַב הֶעָנָן
  english_pob_choice: in a thick cloud
  chosen_korean: 짙은 구름 가운데
  alternatives_korean:
  - 두꺼운 구름 가운데
  - 짙은 구름 속에
  lexicon: HALOT
  rationale: 구름의 밀도와 장엄한 현현 이미지를 살리면서 한국어로 자연스럽게 옮겼습니다.
- source_word: בְּדַבְּרִי עִמָּךְ
  english_pob_choice: when I speak with you
  chosen_korean: 내가 너와 말할 때
  alternatives_korean:
  - 내가 너와 이야기할 때
  - 내가 너와 말하는 동안
  lexicon: HALOT
  rationale: 분사적 시간 표현을 자연스러운 시간 부사절로 옮겼고, עִם의 관계적 뉘앙스를 ‘너와’로 반영했습니다.
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  english_pob_choice: may also believe you
  chosen_korean: 또 너를 영원히 믿게 하려는 것이다
  alternatives_korean:
  - 또 너를 믿게 하려는 것이다
  - 또 너를 믿고 따르게 하려는 것이다
  lexicon: HALOT
  rationale: 히필 אמן은 모세의 말과 권위를 신뢰한다는 뜻이므로 ‘너를 믿다’로 옮겼습니다. 목적절의 완료적·지속적 의미를 살려 ‘영원히’로 לְעוֹלָם을 연결했습니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝없이
  - 항상
  lexicon: HALOT
  rationale: 지속 기간의 최종성을 간명하게 표현하는 기본어로 옮겼습니다.
theological_decisions:
- issue: 백성이 모세를 ‘믿다’의 의미
  chosen_reading: 모세를 하나님의 인증된 대언자로 신뢰하는 뜻으로 읽었습니다.
  alternative_readings:
  - 모세를 신앙의 대상으로 믿는 뜻
  - 모세의 말을 사실로 받아들이는 뜻
  rationale: 문맥상 초점은 모세에 대한 종교적 신앙이 아니라, 하나님이 그를 통해 말씀하신다는 공적 인증입니다. 따라서 과도한 신학적 확대를 피하고 대언자적 권위를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: 모세가 야훼께 말을 ‘전하다’의 표현
  chosen_reading: ‘아뢰었습니다’로 옮겨, 위격 차이를 드러냈습니다.
  alternative_readings:
  - 말했습니다
  - 전했습니다
  rationale: 모세가 백성의 말을 하나님께 보고하는 장면이므로, 하나님께 드리는 말에 적절한 공손성을 반영했습니다.
  doctrine_reference: 'Korean style guidance: direct address to God uses honorific endings'
