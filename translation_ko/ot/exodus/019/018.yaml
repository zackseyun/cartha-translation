id: EXO.19.18
reference: Exodus 19:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Now Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
  footnotes:
  - marker: a
    text: Or 'like the smoke of a kiln.'
    reason: lexical_alternative
translation:
  language: ko
  text: 시내 산은 야훼께서 불 가운데 시내 산 위에 내려오셨으므로 온통 연기로 뒤덮였습니다. 그 연기는 풀무[a]의 연기처럼 올라갔고, 온 산은 크게 떨렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가마의 연기처럼’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַר סִינַי
  english_pob_choice: Now Mount Sinai
  chosen_korean: 그때 시내 산은
  alternatives_korean:
  - 그리고 시내 산은
  - 시내 산은
  lexicon: HALOT
  rationale: 히브리어 접속 וְ는 서술 전환을 자연스럽게 이어 주는 말이므로, 서사 흐름을 살리는 ‘그때’로 옮겼습니다.
- source_word: עָשַׁן כֻּלּוֹ
  english_pob_choice: was all in smoke
  chosen_korean: 모두 연기로 가득했습니다
  alternatives_korean:
  - 완전히 연기로 뒤덮였습니다
  - 온통 연기였습니다
  lexicon: HALOT
  rationale: 동사 עָשַׁן의 상태적 의미를 살려 산 전체가 연기에 잠긴 모습을 나타내기 위해 ‘연기로 가득했습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명 ארבע글자 이름은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭이 아니라 고유한 언약 이름임을 드러냈습니다.
- source_word: כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן
  english_pob_choice: like the smoke of a furnace
  chosen_korean: 풀무의 연기처럼
  alternatives_korean:
  - 용광로의 연기처럼
  - 화덕의 연기처럼
  lexicon: HALOT
  rationale: כִּבְשָׁן은 뜨거운 가마/풀무를 가리킬 수 있으므로, 한국어로는 불길한 강도를 잘 드러내는 ‘풀무’가 가장 자연스럽습니다.
- source_word: וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד
  english_pob_choice: and the whole mountain trembled greatly
  chosen_korean: 온 산은 크게 떨렸습니다
  alternatives_korean:
  - 온 산이 심하게 흔들렸습니다
  - 산 전체가 크게 진동했습니다
  lexicon: HALOT
  rationale: חרד는 두려움 섞인 떨림/흔들림을 뜻하므로, 물리적 진동과 경외의 뉘앙스를 함께 살려 ‘크게 떨렸습니다’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 강림을 나타내는 신현적 묘사
  chosen_reading: ‘불 가운데 그 위로 내려오셨다’는 표현으로 야훼의 임재가 산을 뒤덮는 현현을 그대로 살렸습니다.
  alternative_readings:
  - 불로 내려오셨기 때문입니다
  - 불 가운데로 내려오셨기 때문입니다
  rationale: 히브리어 בָּאֵשׁ와 עָלָיו의 결합은 단순한 현상 설명이 아니라 야훼의 임재가 시내산에 임한 신현을 가리키므로, 문맥의 경외성과 초월성을 약화하지 않도록 직역 성향을 유지했습니다.
  doctrine_reference: 출애굽기 19장의 시내산 언약 체결과 하나님의 현현
