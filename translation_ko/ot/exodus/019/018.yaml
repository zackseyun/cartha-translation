  to: 시내 산은 야훼께서 불 가운데 시내 산 위에 내려오셨으므로 온통 연기로 뒤덮였습니다. 그 연기는 풀무[a]의 연기처럼 올라갔고, 온 산은 크게 떨렸습니다.
