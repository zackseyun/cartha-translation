  - severity: medium
    issue: 각주 표지가 ‘불 가운데’에 붙어 있으나 각주의 내용은 כִּבְשָׁן(풀무/가마)의 어휘 대안입니다.
    rationale: 각주는 ‘풀무’에 붙어야 독자가 대안이 적용되는 단어를 정확히 알 수 있습니다.
