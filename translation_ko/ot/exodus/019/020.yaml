  - 주
  rationale: 시내산 현현 장면에서 언약의 이름이 직접 등장하므로, 일반 칭호인 ‘주’로 바꾸지 않고 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
