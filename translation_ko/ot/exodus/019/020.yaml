source:
  edition: WLC
  text: וַ/יֵּ֧רֶד יְהוָ֛ה עַל הַ֥ר סִינַ֖י אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/יִּקְרָ֨א יְהוָ֧ה לְ/מֹשֶׁ֛ה אֶל רֹ֥אשׁ הָ/הָ֖ר וַ/יַּ֥עַל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
  footnotes:
  - marker: a
    text: Or 'descended on Mount Sinai, to the summit of the mountain.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to the head of the mountain,' that is, 'to the top/summit of the mountain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 시내산에 내려오셔서 산 꼭대기에 이르셨습니다. 그때 야훼께서 모세를 산 꼭대기로 부르셨고, 모세는 올라갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내산에 내려오셔서 산의 정상에 이르셨습니다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘산의 머리로’, 곧 ‘산 꼭대기/정상으로’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문은 여호와 대체표현이 아니라 고유한 신적 이름을 직접 사용하므로, 본문에서도 ‘야훼’로 옮겨 POB의 이름 보존 원칙을 따랐습니다.
- source_word: וַיֵּרֶד
  english_pob_choice: came down
  chosen_korean: 내려오셨습니다
  alternatives_korean:
  - 내려오셨습니다
  - 강림하셨습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘내려오다’이므로 이를 직역하되, 한국어에서는 자연스러운 서술을 위해 ‘내려오셨습니다’로 처리했습니다.
- source_word: הַר סִינַי
  english_pob_choice: Mount Sinai
  chosen_korean: 시내산
  alternatives_korean:
  - 시나이 산
  - 시내 산
  lexicon: HALOT
  rationale: 지명으로 굳어진 성경 표준형을 따라 ‘시내산’으로 썼습니다.
- source_word: אֶל רֹאשׁ הָהָר
  english_pob_choice: to the top of the mountain
  chosen_korean: 산 꼭대기에
  alternatives_korean:
  - 산 정상에
  - 산의 꼭대기에
  lexicon: HALOT
  rationale: רֹאשׁ은 문자적으로 ‘머리’지만 여기서는 관용적으로 산의 꼭대기/정상을 가리키므로, 의미를 살려 ‘산 꼭대기’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 시내산 현현 장면에서 언약의 이름이 직접 등장하므로, 일반 칭호인 ‘주’로 바꾸지 않고 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
