  terminology: ‘야훼’, ‘시내산’, ‘모세’, ‘산 꼭대기’는 원문 및 영어 POB의 용어 선택을 충실히 반영합니다. ‘야훼’에 존칭 조사와 높임 종결을 사용한 것도 한국어 종교 서술 관습과 합쇼체에 적절합니다.
