translation:
  language: ko
  text: 야훼께서 시내산, 곧 그 산 꼭대기에 내려오셨습니다.[a] 야훼께서 모세를 산 꼭대기로 부르셨고,[b] 모세는 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시내산의 산꼭대기에’
    reason: alternative_reading
  - marker: b
    text: 히브리어로는 직역하면 ‘산의 머리로’, 곧 ‘산 꼭대기’ 또는 ‘산 정상’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문은 여호와 대체표현이 아니라 고유한 신적 이름을 직접 사용하므로, 본문에서도 ‘야훼’로 옮겨 POB의 이름 보존 원칙을 따랐습니다.
- source_word: וַיֵּרֶד
  english_pob_choice: came down
  chosen_korean: 내려오셨습니다
  alternatives_korean:
  - 내려오셨습니다
  - 강림하셨습니다
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘내려오다’이므로 이를 직역하되, 한국어에서는 자연스러운 서술을 위해 ‘내려오셨습니다’로 처리했습니다.
- source_word: הַר סִינַי
  english_pob_choice: Mount Sinai
  chosen_korean: 시내산
  alternatives_korean:
  - 시나이 산
  - 시내 산
  lexicon: HALOT
  rationale: 지명으로 굳어진 성경 표준형을 따라 ‘시내산’으로 썼습니다.
- source_word: אֶל רֹאשׁ הָהָר
  english_pob_choice: to the top of the mountain
  chosen_korean: 산 꼭대기에
  alternatives_korean:
  - 산 정상에
  - 산의 꼭대기에
  lexicon: HALOT
  rationale: רֹאשׁ은 문자적으로 ‘머리’지만 여기서는 관용적으로 산의 꼭대기/정상을 가리키므로, 의미를 살려 ‘산 꼭대기’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
