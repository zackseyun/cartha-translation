translation:
  language: ko
  text: 「여러분은 내가 이집트에 한 일을 직접 보았습니다. 나는 여러분을 독수리[b]의 날개 위에[a] 태워 나르고 내게로[c] 데려왔습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘독수리들의 날개 위에.’ 히브리어 표현은 보호하고 강력하게 구원하시는 일을 생생하게 비유합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘독수리’로 번역된 히브리어는 더 넓게 큰 맹금류를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는, ‘나 자신에게로 데려왔습니다.’
    reason: alternative_reading
