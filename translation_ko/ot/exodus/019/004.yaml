- source_word: אֵלָי
  english_pob_choice: brought you to myself
  chosen_korean: 내 곁으로 데려왔다는
  alternatives_korean:
  - 내게로 데려왔다는
  - 나 자신에게로 데려왔다는
  lexicon: HALOT
  rationale: 직역의 ‘내게로’보다 언약적 관계의 방향성을 살리면서도 한국어에서 자연스러운 ‘내 곁으로’로 옮겼습니다.
theological_decisions:
- issue: 출애굽의 목적이 단순한 탈출인지 관계적 소환인지
  chosen_reading: ‘내 곁으로 데려왔다’로 번역해, 이집트로부터의 구출이 하나님과의 관계 안으로의 이동임을 드러냈습니다.
  alternative_readings:
  - ‘내게로 데려왔다’
  - ‘내 앞에 데려왔다’
  rationale: 본문의 אֵלָי는 단순한 이동 목적지를 넘어 하나님 자신에게로의 언약적 접근을 시사하므로, 관계적 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
