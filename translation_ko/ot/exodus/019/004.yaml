revisions:
- from: 「너희는 내가 이집트에 한 일을 너희 자신이 보았고, 내가 너희를 독수리의 날개 위로 업어 나르듯이 내 곁으로 데려왔다는 것을 보았습니다.」[a][b][c]
  to: 「여러분은 내가 이집트에 한 일을 직접 보았습니다. 나는 여러분을 독수리[b]의 날개 위에[a] 태워 나르고 내게로[c] 데려왔습니다.」
  rationale: 독립 인칭대명사의 강조는 ‘직접’으로 자연스럽게 반영하고, 두 동사 ‘업어 나르다’와 ‘데려오다’를 하나님이 행하신 병렬 행위로 복원했습니다. אֵלָי는 해석적 표현인 ‘내 곁으로’ 대신 기본 의미인 ‘내게로’로 옮겼으며, 어휘적 대안과 비유 설명은 해당 각주 표지에 맞추어 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:46Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 이집트에 행한 일, 독수리 날개 비유, 하나님께로 이끄심이라는 핵심 요소를 담고 있습니다. 그러나 ‘너희는 … 너희 자신이 보았고, … 데려왔다는 것을 보았습니다’는 히브리어의 두 절을 중복되고 부정확하게 결합합니다. 또한 אֵלָי는 ‘내 곁으로’보다 ‘내게로’가 정확합니다.
  naturalness: ‘너희’와 합쇼체 종결 ‘보았습니다’의 결합은 목표 등록에서 어색하며, ‘여러분’과 ‘직접’을 사용하면 강조와 현대적 격식을 함께 살릴 수 있습니다. ‘독수리의 날개 위로 업어 나르듯이’도 원문의 단정적 은유를 비교 표현으로 약화하므로 직접적으로 옮기는 편이 좋습니다.
  terminology: ‘이집트’, ‘독수리’, ‘내게로’는 표준어 성경 번역에서 자연스럽고 원문의 의미 범위에 충실합니다. נְשָׁרִים의 넓은 조류 범위와 날개 표현의 대안은 각주로 보존합니다.
  issues:
  - severity: high
    issue: 주절 구조가 중복되고 원문 절 구성을 바꿉니다.
    rationale: 초안의 ‘보았고 … 데려왔다는 것을 보았습니다’는 ‘보았다’가 두 번 반복되며, 하나님이 ‘업어 나르고 데려왔다’는 독립 진술을 ‘보았다’의 내용절로 처리합니다. 히브리어는 ‘너희가 보았다’ 다음에 하나님이 행하신 두 동작을 병렬로 진술합니다.
  - severity: medium
    issue: ‘내 곁으로’는 אֵלָי의 기본 방향 의미를 불필요하게 바꿉니다.
    rationale: אֵלָי는 ‘내게로/to me’입니다. 관계적 함의는 문맥에서 유지되지만 ‘곁’이라는 공간적 친밀성은 본문에 명시되지 않았습니다.
  - severity: medium
    issue: ‘…듯이’가 은유를 직유로 약화합니다.
    rationale: ‘독수리의 날개 위에’는 원문의 직접적인 운반 이미지입니다. ‘듯이’를 넣으면 본문에 없는 비교 표지가 추가됩니다.
  - severity: low
    issue: 대상 청중 지시와 문체가 일관되지 않습니다.
    rationale: ‘너희’는 비격식적·고어적인 느낌이 있고 ‘보았습니다’는 합쇼체입니다. ‘여러분’은 지정된 현대적 정중 문체에 적합합니다.
