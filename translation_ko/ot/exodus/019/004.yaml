source:
  edition: WLC
  text: אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/מִצְרָ֑יִם וָ/אֶשָּׂ֤א אֶתְ/כֶם֙ עַל כַּנְפֵ֣י נְשָׁרִ֔ים וָ/אָבִ֥א אֶתְ/כֶ֖ם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
  footnotes:
  - marker: a
    text: Or, 'on the wings of eagles.' The Hebrew expression is a vivid metaphor for protective, powerful deliverance.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word rendered 'eagles' can more broadly refer to large birds of prey.
    reason: lexical_alternative
  - marker: c
    text: Or, 'brought you to me.'
    reason: alternative_reading
translation:
  language: ko
  text: 「너희는 내가 이집트에 한 일을 너희 자신이 보았고, 내가 너희를 독수리의 날개 위로 업어 나르듯이 내 곁으로 데려왔다는 것을 보았습니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 독수리의 날개에 대한 생생한 은유로, 보호하고 능력 있게 건져 내는 구출을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘독수리’로 번역된 히브리어는 더 넓게는 큰 맹금류를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는, ‘내게로 데려왔다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם
  english_pob_choice: you yourselves
  chosen_korean: 너희는 … 너희 자신이
  alternatives_korean:
  - 너희는
  - 너희가
  lexicon: HALOT
  rationale: 독립 인칭대명사의 강조를 살려, 단순 주어보다 ‘너희 자신이’로 대응하여 강조된 목격 사실을 드러냈습니다.
- source_word: לְמִצְרָיִם
  english_pob_choice: what I did to Egypt
  chosen_korean: 이집트에 한 일
  alternatives_korean:
  - 이집트에게 한 일
  - 이집트에게 행한 일
  lexicon: HALOT
  rationale: לְ + 지명은 여기서 이집트라는 민족/나라에 대한 행위 대상이므로 ‘~에 한 일’로 자연스럽게 옮겼습니다.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  english_pob_choice: on eagles’ wings
  chosen_korean: 독수리의 날개 위로 업어 나르듯이
  alternatives_korean:
  - 독수리의 날개 위로
  - 독수리의 날개에 실어
  lexicon: HALOT
  rationale: 히브리어의 생생한 보호·구출 은유를 한국어에서 직접적인 이미지로 살리기 위해 동작성을 보강해 옮겼습니다.
- source_word: אֵלָי
  english_pob_choice: brought you to myself
  chosen_korean: 내 곁으로 데려왔다는
  alternatives_korean:
  - 내게로 데려왔다는
  - 나 자신에게로 데려왔다는
  lexicon: HALOT
  rationale: 직역의 ‘내게로’보다 언약적 관계의 방향성을 살리면서도 한국어에서 자연스러운 ‘내 곁으로’로 옮겼습니다.
theological_decisions:
- issue: 출애굽의 목적이 단순한 탈출인지 관계적 소환인지
  chosen_reading: ‘내 곁으로 데려왔다’로 번역해, 이집트로부터의 구출이 하나님과의 관계 안으로의 이동임을 드러냈습니다.
  alternative_readings:
  - ‘내게로 데려왔다’
  - ‘내 앞에 데려왔다’
  rationale: 본문의 אֵלָי는 단순한 이동 목적지를 넘어 하나님 자신에게로의 언약적 접근을 시사하므로, 관계적 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
