source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל הָ/עָ֔ם הֱי֥וּ נְכֹנִ֖ים לִ/שְׁלֹ֣שֶׁת יָמִ֑ים אַֽל תִּגְּשׁ֖וּ אֶל אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
  footnotes:
  - marker: a
    text: Literally, 'do not go near a woman'; in context this is a euphemistic instruction to abstain from sexual relations during the period of preparation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 백성에게 말했습니다. “사흘 동안 준비하십시오. 여자에게 가까이 가지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여자에게 가까이 가지 말라’입니다. 문맥상 이는 준비 기간 동안 성관계를 삼가라는 완곡한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말했습니다
  alternatives_korean:
  - 그가 말했습니다
  - 그러자 그가 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도 히브리어 wayyiqtol의 연결감을 유지하기 위해 ‘그리고’로 시작했습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 백성들
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 언약 공동체로 모인 이스라엘 전체를 가리키므로, 단순한 ‘사람들’보다 공동체적 뉘앙스가 분명한 ‘백성’이 적절합니다.
- source_word: הֱיוּ נְכֹנִים
  english_pob_choice: Be ready
  chosen_korean: 준비하십시오
  alternatives_korean:
  - 준비되어 있으십시오
  - 자세를 갖추십시오
  - 예비하십시오
  lexicon: HALOT
  rationale: 직역하면 ‘준비된 상태가 되라’는 뜻이므로, 현대 한국어에서 자연스럽고 명령의 기능을 분명히 하는 ‘준비하십시오’로 옮겼습니다.
- source_word: אֶל אִשָּׁה
  english_pob_choice: do not go near a woman
  chosen_korean: 여자에게 가까이 가지 마십시오
  alternatives_korean:
  - 여자와 가까이하지 마십시오
  - 여자에게 접근하지 마십시오
  - 성관계를 갖지 마십시오
  lexicon: HALOT
  rationale: 본문은 완곡표현인 ‘여자에게 가까이 가지 말라’를 사용하므로, 이를 그대로 살려 본문 수준에서는 직접적인 성행위 표현으로 풀지 않았습니다.
theological_decisions:
- issue: 부부 관계를 직접 언급할지, 완곡표현을 유지할지
  chosen_reading: 본문의 완곡표현을 유지해 ‘여자에게 가까이 가지 마십시오’로 번역했습니다.
  alternative_readings:
  - 성관계를 갖지 마십시오
  - 아내와 동침하지 마십시오
  rationale: 히브리어는 노골적인 성행위 동사가 아니라 정결 준비를 위한 관용적 금지 표현을 사용합니다. 본문은 그대로 두고, 의미 확장은 주석 없이 과도하게 단정하지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 범위 안에서만 의미를 명시하고, 완곡표현은 본문에서 보존합니다.'
