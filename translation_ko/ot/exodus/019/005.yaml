id: EXO.19.5
reference: Exodus 19:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
  footnotes:
  - marker: a
    text: Or 'if you truly obey my voice.' The Hebrew expression literally says 'if listening you will listen,' an emphatic form meaning to listen attentively or obediently.
    reason: lexical_alternative
  - marker: b
    text: Or 'my special possession' or 'my own possession.'
    reason: lexical_alternative
  - marker: c
    text: That is, from among all the nations/peoples; the next clause clarifies that the whole earth still belongs to God.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 이제 너희가 내 음성을 참으로 듣고[a] 내 언약을 지키면, 너희는 모든 민족 가운데서 내 소중한 소유가 될 것입니다.[b][c] 온 땅이 모두 내 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 음성을 참으로 순종하면.’ 히브리어는 ‘듣고 또 듣다’라는 강조형 표현으로, 주의 깊게 듣거나 순종하여 듣는다는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 특별한 소유’, ‘내 고유한 소유’. 히브리어 סְגֻלָּה는 특별히 귀하게 여겨 소유하는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘모든 민족 가운데서’는 모든 민족 중에서 선택된다는 뜻입니다. 이어지는 ‘온 땅이 모두 내 것’이라는 말은 온 땅 전체가 하나님의 소유임을 분명히 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그리고 이제
  lexicon: HALOT
  rationale: 앞선 문맥과 이어지는 언약적 전환을 살리기 위해 연결어와 시간부사를 함께 반영했습니다.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ בְּקֹלִי
  english_pob_choice: you will indeed listen to my voice
  chosen_korean: 너희가 참으로 내 음성을 듣고
  alternatives_korean:
  - 너희가 내 음성을 잘 듣고
  - 너희가 내 말을 들으며
  lexicon: HALOT
  rationale: 히브리어의 강조형을 살리되, 핵심 이미지인 '음성'을 유지하여 단순한 '순종하다'로 평면화하지 않았습니다.
- source_word: וּשְׁמַרְתֶּם אֶת בְּרִיתִי
  english_pob_choice: and keep my covenant
  chosen_korean: 내 언약을 지키면
  alternatives_korean:
  - 내 언약을 지키고
  - 내 언약을 준수하면
  lexicon: HALOT
  rationale: 언약 문맥에서 שׁמר의 뜻을 자연스러운 한국어 '지키다'로 옮겨 covenantal 책임을 분명히 했습니다.
- source_word: סְגֻלָּה
  english_pob_choice: my treasured possession
  chosen_korean: 내 소중한 소유
  alternatives_korean:
  - 내 보배로운 소유
  - 내 특별한 소유
  - 내 귀한 소유
  lexicon: HALOT
  rationale: 성경적 관용구를 유지하되, 값진 소유물이라는 뜻과 '내 것'이라는 소유권을 함께 드러내기 위해 '소중한 소유'로 옮겼습니다.
- source_word: מִכָּל הָעַמִּים
  english_pob_choice: out of all the peoples
  chosen_korean: 모든 민족들 가운데서
  alternatives_korean:
  - 모든 민족들 중에서
  - 모든 백성들 가운데서
  lexicon: HALOT
  rationale: 분리보다는 선택의 범위를 나타내는 מן의 뉘앙스를 살려, 배타적 우월성보다 '가운데서'라는 표현으로 옮겼습니다.
- source_word: לִי כָּל הָאָרֶץ
  english_pob_choice: all the earth is mine
  chosen_korean: 온 땅이 내 것이기 때문입니다
  alternatives_korean:
  - 온 땅은 내 것이기 때문입니다
  - 땅 전체가 내 것이기 때문입니다
  lexicon: HALOT
  rationale: כִּי의 근거 제시를 자연스럽게 살리면서, אָרֶץ를 여기서는 '온 땅'으로 옮겨 하나님의 보편적 소유권을 분명히 했습니다.
theological_decisions:
- issue: שׁמע를 '듣다'로 살릴지 '순종하다'로 풀지
  chosen_reading: 참으로 내 음성을 듣고
  alternative_readings:
  - 내 음성에 순종하고
  - 내 음성을 잘 들으면
  rationale: 히브리어 관용구는 순종의 의미를 포함하지만, 본문은 먼저 '듣는' 행위를 전면에 두므로 이를 유지하고 뒤의 '언약을 지키다'가 순종의 뜻을 보강하게 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: סְגֻלָּה의 의미를 독점적 배타성으로 과장할지
  chosen_reading: 내 소중한 소유
  alternative_readings:
  - 내 특별한 소유
  - 내 보배로운 소유
  - 내 친히 간직한 소유
  rationale: 이스라엘의 구별됨을 드러내되, 바로 뒤의 '온 땅이 내 것'이 보편적 소유권을 말하므로 배타적 절대화는 피했습니다.
  doctrine_reference: Translation philosophy §3
