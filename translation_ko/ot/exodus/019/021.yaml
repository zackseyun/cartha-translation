source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
  footnotes:
  - marker: a
    text: Or 'to see.' The Hebrew verb can mean either 'look' or 'see'; here it refers to attempting to look upon the LORD’s manifestation.
    reason: lexical_alternative
  - marker: b
    text: Literally 'and many from among them fall.' The verb 'fall' may imply death in this context, but the Hebrew does not state it more explicitly.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “내려가서 백성에게 경고하십시오. 그들이 야훼께로 돌파하여 보려고[a] 하다가 그들 가운데 많은 사람이 쓰러질까[b] 염려됩니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 여기서 ‘보다’ 또는 ‘쳐다보다/응시하다’를 뜻할 수 있습니다. 여기서는 야훼의 나타나심을 보려고 시도하는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 가운데 많은 사람이 쓰러질까’입니다. 이 문맥에서 ‘쓰러지다’는 죽음을 시사할 수 있지만, 히브리어는 이를 더 분명하게 말하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 고유한 언약 이름을 제목어로 바꾸지 않고 음역해, POB의 본문 원칙을 한국어에서도 그대로 반영했습니다.
- source_word: הָעֵד
  english_pob_choice: warn
  chosen_korean: 경고하라
  alternatives_korean:
  - 엄중히 경고하라
  - 증언하라
  lexicon: HALOT
  rationale: 히필형 עוד는 여기서 단순 전달이 아니라 금지된 접근을 막는 경고의 뜻이므로, 현대 한국어에서 직접적이고 분명한 「경고하라」를 택했습니다.
- source_word: יֶהֶרְסוּ
  english_pob_choice: break through
  chosen_korean: 돌파하여
  alternatives_korean:
  - 뚫고 들어가
  - 무너져
  - 억지로 들어가
  lexicon: HALOT
  rationale: 경계선을 거슬러 신성한 공간으로 밀고 들어가는 움직임을 살리기 위해, 물리적 침범의 뉘앙스가 있는 「돌파하여」를 사용했습니다.
- source_word: מִמֶּנּוּ רָב
  english_pob_choice: many of them
  chosen_korean: 많은 사람이
  alternatives_korean:
  - 그들 가운데 많은 사람이
  - 많은 이들이
  lexicon: HALOT
  rationale: 히브리어는 집단 내부의 다수를 뜻하므로, 자연스러운 한국어로 옮기되 수량의 강도를 유지해 「많은 사람이」로 번역했습니다.
theological_decisions:
- issue: ‘to look’의 목적과 접근 금지의 긴장
  chosen_reading: 「보러 오다가」로 옮겨, 단순 시각 행위가 아니라 야훼를 향한 무단 접근과 응시 시도를 함께 드러냈습니다.
  alternative_readings:
  - 「보려고」
  - 「보기 위해」
  rationale: 영어 POB도 ‘look’/‘see’의 양가성을 주석으로 남기고 있으므로, 한국어 본문에서는 목적 동사형을 유지하면서 주석 없이도 위험한 접근이라는 문맥이 보이도록 했습니다.
  doctrine_reference: Exodus 19:21의 성산 경계와 거룩하신 하나님 임재에 대한 접근 제한
