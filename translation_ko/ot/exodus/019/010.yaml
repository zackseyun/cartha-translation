base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
  footnotes:
  - marker: a
    text: Or “sanctify them” or “set them apart as holy.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “백성에게 가서 오늘과 내일 그들을 거룩하게 구별하십시오. 그들이 자기 옷을 빨게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 거룩하게 하십시오” 또는 “그들을 성별하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC
  rationale: 본문의 고유신명 יְהוָה를 POB 원칙에 따라 제목이 아닌 고유명사로 옮기기 위해 '야훼'를 사용했습니다.
- source_word: וְקִדַּשְׁתָּם
  english_pob_choice: consecrate them
  chosen_korean: 그들을 정결하게 하십시오
  alternatives_korean:
  - 그들을 거룩하게 하십시오
  - 그들을 성별하십시오
  lexicon: WLC
  rationale: 출애굽기 19장의 맥락은 시내산에서의 거룩한 만남을 위한 예식적 준비이므로, 의식적 정화와 준비를 드러내는 '정결하게 하십시오'가 가장 자연스럽습니다.
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  english_pob_choice: let them wash their garments
  chosen_korean: 그들에게 옷을 빨게 하십시오
  alternatives_korean:
  - 그들에게 옷을 씻게 하십시오
  - 그들의 의복을 빨게 하십시오
  lexicon: WLC
  rationale: שִׂמְלָה는 단순한 '옷/의복'을 뜻하므로, 예식적 문맥을 해치지 않으면서도 직접적인 의미를 살린 '옷을 빨게 하십시오'로 옮겼습니다.
- source_word: לֵךְ אֶל הָעָם
  english_pob_choice: Go to the people
  chosen_korean: 백성에게 가서
  alternatives_korean:
  - 사람들에게 가서
  - 그 백성에게 가서
  lexicon: WLC
  rationale: הָעָם은 시내산 언약 공동체 전체를 가리키므로, 한국어에서 집합적 의미를 가장 자연스럽게 드러내는 '백성'을 선택했습니다.
theological_decisions:
- issue: קדשׁ의 예식적 의미
  chosen_reading: '''정결하게 하십시오''는 도덕적 완전성보다 하나님을 만나기 위한 예식적 준비를 강조합니다.'
  alternative_readings:
  - '''거룩하게 하십시오''는 보다 직역적입니다.'
  - '''성별하십시오''는 구별의 뉘앙스를 드러냅니다.'
  rationale: 이 절은 시내산에서 야훼를 맞이하기 위한 공동체의 준비를 말하므로, 내적 성화로만 좁히지 않고 문맥상 필요한 예식적 의미를 살렸습니다.
  doctrine_reference: 출애굽기 19장 시내산 언약 준비 / 번역 원칙
