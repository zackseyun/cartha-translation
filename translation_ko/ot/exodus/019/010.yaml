review_pass:
  verdict: revise
  source_fidelity: ‘정결하게 하십시오’는 의식적 준비라는 문맥을 일부 반영하지만, וְקִדַּשְׁתָּם(‘그들을 거룩하게 하다/성별하다’)의 핵심인 거룩하게 구별함을 ‘정결하게 하다’로 한정합니다. 이어지는 옷 세탁 명령이 정결 행위를 따로 명시하므로, 두 표현을 구별하는 편이 원문에 더 충실합니다.
  naturalness: 합쇼체 문장과 ‘야훼’, ‘백성’, ‘옷을 빨게 하십시오’는 자연스럽습니다. 다만 ‘그들에게 옷을 빨게 하십시오’보다 ‘그들이 자기 옷을 빨게 하십시오’가 소유 관계와 히브리어 복수 주어를 더 분명히 드러냅니다.
  terminology: יְהוָה는 POB 방침 및 영어 감사 기록에 맞게 ‘야훼’로 유지합니다. קדשׁ는 이 문맥에서 단순 정결보다 ‘거룩하게 구별하다’가 적절하며, שִׂמְלֹתָם은 ‘자기 옷’으로 자연스럽고 충실하게 옮길 수 있습니다.
