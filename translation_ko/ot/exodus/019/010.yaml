  to: 그때 야훼께서 모세에게 말씀하셨습니다. “백성에게 가서 오늘과 내일 그들을 거룩하게 구별하십시오. 그들이 자기 옷을 빨게 하십시오.”[a]
  rationale: קדשׁ의 예식적·성별적 의미를 본문에서 보존하고, ‘정결하게 하다’라는 더 좁은 해석은 채택하지 않았습니다. 의복 세탁은 백성 자신이 자기 옷을 빠는 명령임을 자연스럽게 드러냈습니다.
