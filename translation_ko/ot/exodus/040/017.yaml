base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/017.yaml
  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
  footnotes:
  - marker: a
    text: Or, 'on the first of the month.' The Hebrew idiom literally reads 'on one of the month.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'was erected.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 둘째 해의 첫째 달, 곧 그 달의 첫째 날에 회막이 세워졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 날짜 관용구는 문자적으로는 '그 달의 하나'에 가깝지만, 뜻은 '그 달의 첫째 날'입니다.
    reason: source_note
  - marker: b
    text: 히브리어 수동형 הוּקַם은 '세워졌다' 또는 '설치되었다'의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그런데
  alternatives_korean:
  - 그리고
  - 그 일이 있었습니다
  - 그렇게 되었습니다
  lexicon: HALOT
  rationale: 히브리어 서술 도입의 사건 전환 기능을 살리되, 한국어에서는 자연스러운 이야기 전개 표지로 처리했습니다.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  english_pob_choice: in the first month
  chosen_korean: 둘째 해의 첫째 달
  alternatives_korean:
  - 첫째 달에
  - 첫 달에
  lexicon: HALOT
  rationale: 달력 표지로서 '달'을 사용하고, 이어지는 '둘째 해'와 결합된 연대 표기를 자연스럽게 옮겼습니다.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  english_pob_choice: on the first day of the month
  chosen_korean: 그 달의 첫째 날
  alternatives_korean:
  - 그 달의 초하루
  - 그 달의 첫날
  - 그 달의 첫째 날에
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻인 '월의 첫날'을 분명히 전달하면서, 독자가 날짜표현으로 즉시 이해할 수 있게 했습니다.
- source_word: הוּקַם
  english_pob_choice: was set up
  chosen_korean: 세워졌습니다
  alternatives_korean:
  - 설치되었습니다
  - 건립되었습니다
  - 일으켜졌습니다
  lexicon: HALOT
  rationale: 성막을 조립해 세우는 문맥이므로 '세워지다'가 가장 자연스럽고, 'was set up'의 수동 의미를 잘 반영합니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 회막
  alternatives_korean:
  - 성막
  - 장막
  lexicon: HALOT
  rationale: 출애굽기에서 מִשְׁכָּן은 이동식 성소를 가리키며, 한국어 성경 전통에서 이 장면의 기능적 명칭으로 '회막'이 자주 쓰입니다. 다만 본문 의미상 'tabernacle'의 성소성은 유지됩니다.
theological_decisions:
- issue: מִשְׁכָּן의 한국어 명칭 선택
  chosen_reading: 회막으로 번역했습니다.
  alternative_readings:
  - 성막으로 번역
  - 장막으로 번역
  rationale: 문맥상 완공되어 세워진 거룩한 만남의 처소를 가리키므로, 독자가 기능을 바로 인식할 수 있는 전통적 명칭을 택했습니다.
  doctrine_reference: 출애굽기 성막/회막 전승
