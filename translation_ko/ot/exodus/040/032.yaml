  source_fidelity: 히브리어의 두 시간절(‘회막에 들어갈 때’, ‘제단에 가까이 갈 때’)은 각각 반복적 상황을 나타내며, ‘때마다’로 옮기는 것은 문맥상 적절합니다. יִרְחָצוּ의 습관적 과거도 ‘씻었습니다’로 자연스럽게 반영되었습니다. 다만 초안은 첫 시간절에만 ‘때’를, 둘째 절에만 ‘때마다’를 사용하여 두 절의 병렬성과 반복성이 고르게 드러나지 않습니다.
  naturalness: ‘회막에 들어갈 때와 제단에 가까이 갈 때마다’는 조사 결합상 ‘때마다’가 두 동작 모두에 걸리는지 다소 불균형하게 들립니다. 각 절에 ‘때마다’를 반복하고 주어를 앞세우면 현대 한국어 합쇼체 문장으로 명료하고 자연스럽습니다.
  terminology: ‘회막’, ‘제단’, ‘야훼’, ‘모세’는 출애굽기 문맥 및 제시된 명명 원칙에 부합합니다. ‘야훼께서 모세에게 명령하신 대로’는 אֶת מֹשֶׁה를 ‘모세에게’로 처리한 한국어 관용에 맞으며 의미상 정확합니다.
  issues:
