base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: ko
  text: 그들이 회막에 들어갈 때와 제단에 가까이 갈 때마다 씻었습니다. 야훼께서 모세에게 명령하신 그대로였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  english_pob_choice: Whenever they entered
  chosen_korean: 들어갈 때마다
  alternatives_korean:
  - 들어갈 때
  - 들어감에
  lexicon: HALOT
  rationale: 이 ב+부정사구는 반복되는 시간적 상황을 나타내므로, 한국어에서는 ‘-할 때마다’가 반복성을 가장 자연스럽게 드러냅니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 זה는 성막의 고유한 культ 용어이므로, 한국어 성경에서 널리 쓰이는 ‘회막’을 채택했습니다.
- source_word: יִרְחָצוּ
  english_pob_choice: they washed
  chosen_korean: 씻었습니다
  alternatives_korean:
  - 몸을 씻었습니다
  - 씻었습니다
  lexicon: HALOT
  rationale: 대상이 문맥상 분명하므로 목적어를 덧붙이지 않고 간결하게 옮겼습니다. 반복 규범을 나타내는 서술적 과거로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 히브리어 고유명사 יְהוָה를 호칭어로 바꾸지 않고 음역 원칙에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 반복 행위의 시간 부사 처리
  chosen_reading: ‘들어갈 때마다 / 가까이 갈 때마다’로 반복적 규범을 드러냈습니다.
  alternative_readings:
  - ‘들어갈 때 / 가까이 갈 때’
  - ‘들어갈 때는 / 가까이 갈 때는’
  rationale: 히브리어 ב+부정사구는 단회보다 반복적 습관을 나타내는 문맥이므로, 한국어에서도 반복성을 분명히 해야 본문의 제의 규범성이 살아납니다.
  doctrine_reference: 문법-의미 결정
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 하나님의 언약 이름을 직접 사용하므로, 직함으로 대체하지 않고 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
