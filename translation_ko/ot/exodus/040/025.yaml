    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: set up
  chosen_korean: 두었습니다
  alternatives_korean:
  - 설치했습니다
  - 올려놓았습니다
  - 밝혔습니다
  lexicon: HALOT
  rationale: 히필형 עלה는 문자적으로는 ‘올리다’이지만, 등잔 문맥에서는 등잔을 제자리에 두어 등잔대 위에 갖추는 행위를 가리킬 수 있으므로, 본문이 요구하는 최소 의미를 자연스럽게 살려 ‘두었습니다’로 옮겼습니다.
- source_word: הַנֵּרֹת
  english_pob_choice: the lamps
  chosen_korean: 등잔들
  alternatives_korean:
  - 등불들
  - 램프들
  lexicon: HALOT
  rationale: 성막 기구 문맥의 נֵרֹת은 추상적 ‘빛’이 아니라 실제 기구인 등잔이므로, 한국어 성경 문맥에 맞는 ‘등잔들’이 가장 구체적입니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 야훼 앞에서
  - 야훼의 면전에서
  lexicon: HALOT
  rationale: לִפְנֵי는 예배·성막 문맥에서 ‘앞에/면전에서’라는 표준적 위치 표현이므로, 직역성을 살리면서도 자연스러운 ‘앞에’를 택했습니다.
- source_word: צִוָּה
  english_pob_choice: had commanded
  chosen_korean: 명령하신 그대로였습니다
  alternatives_korean:
  - 명령하셨던 대로였습니다
  - 명령하신 바와 같았습니다
  lexicon: HALOT
  rationale: 이 절의 핵심은 행동이 선행 명령과 정확히 일치했다는 점이므로, ‘그대로’로 순응성과 완전한 일치를 분명히 했습니다.
theological_decisions:
