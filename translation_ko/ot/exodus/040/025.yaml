  rationale: 본문이 Tetragrammaton을 직접 사용하므로, 제목어 ‘주’로 대체하지 않고 프로젝트 기준에 따라 고유한 신명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
