revisions:
- from: 그리고 그는 회막의 입구에 차양을 달았습니다.[a]
  to: 그는 회막 입구에 휘장을 달았습니다.[a]
  rationale: The revision replaces the misleading architectural term ‘차양’ with ‘휘장,’ which faithfully conveys the entrance hanging denoted by מָסָךְ. It retains the established term ‘회막,’ the locative sense of the entrance phrase, and the installation sense of the verb. The footnote gives a clear Korean lexical alternative without overstating a distinction not explicit in the verse.
