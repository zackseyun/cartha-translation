lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: And he put
  chosen_korean: 달았습니다
  alternatives_korean:
  - 두었습니다
  - 세웠습니다
  - 놓았습니다
  lexicon: HALOT
  rationale: 천막의 입구에 걸리는 물건을 실제로 설치하는 동작이므로, 단순히 ‘두다’보다 ‘달다’가 기능과 장면을 더 자연스럽게 드러냅니다.
- source_word: מָסַךְ
  english_pob_choice: screen
  chosen_korean: 차양
  alternatives_korean:
  - 휘장
  - 막
  - 스크린
  lexicon: HALOT
  rationale: 성막 문맥에서 מָסַךְ은 입구에 드리우는 덮개를 가리키므로, 기능을 살리면서도 현대 한국어로 읽히는 ‘차양’을 택했습니다.
- source_word: הַפֶּתַח
  english_pob_choice: the entrance
  chosen_korean: 입구
  alternatives_korean:
  - 문
  - 출입구
  - 열린 곳
  lexicon: HALOT
  rationale: פֶּתַח은 성막 구조의 개구부를 가리키며, 여기서는 ‘입구’가 가장 간결하고 자연스럽습니다.
- source_word: לַמִּשְׁכָּן
  english_pob_choice: to the tabernacle
  chosen_korean: 회막의
  alternatives_korean:
  - 성막의
  - 장막의
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기에서 관용적으로 ‘회막’으로 옮겨 온 한국어 성경 전통을 따르되, 문맥상 건조물의 입구를 가리키도록 소유격으로 연결했습니다.
theological_decisions:
- issue: מָסַךְ의 기능적 의미를 ‘screen’으로 둘지 ‘curtain’으로 둘지
  chosen_reading: 입구를 가리는 기능을 살려 ‘차양’으로 옮겼습니다.
  alternative_readings:
  - ‘휘장’으로 번역하면 전통 교회어에 가깝지만 כאן의 प्रवेश용 덮개 기능이 흐려질 수 있습니다.
  - ‘막’은 의미는 가깝지만 한국어에서 너무 일반적입니다.
  rationale: 본문은 성막 ‘입구’에 설치되는 물건을 말하므로, 내부 공간을 가르는 성물인 휘장과 구별되게 기능 중심으로 번역하는 것이 source-direct합니다.
  doctrine_reference: 출 40:28의 성막 구조 묘사
