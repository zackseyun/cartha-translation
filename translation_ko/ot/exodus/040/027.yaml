translation:
  language: ko
  text: 그는 야훼께서 모세에게 명령하신 대로, 그 위에 향기로운 향을 피웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְטֵר
  english_pob_choice: burned
  chosen_korean: 피웠습니다
  alternatives_korean:
  - 태웠습니다
  - 향을 불살랐습니다
  lexicon: HALOT
  rationale: קטר는 제의 문맥에서 향이나 제물을 연기로 올리는 동작을 가리키므로, 현대 한국어에서는 ‘피우다’가 가장 자연스럽고 본문의 제의적 의미를 유지합니다.
- source_word: קְטֹרֶת סַמִּים
  english_pob_choice: fragrant incense
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 향기로운 향료
  - 향긋한 향
  - 향내 나는 향
  lexicon: HALOT
  rationale: קְטֹרֶת는 예배용 향이고, סַמִּים는 향료의 향기로운 성격을 더하므로, 직역보다 자연스러운 ‘향기로운 향’으로 제의적 뉘앙스를 살렸습니다.
- source_word: עָלָיו
  english_pob_choice: on it
  chosen_korean: 그 위에
  alternatives_korean:
  - 그것 위에
  - 그 위에다
  lexicon: HALOT
  rationale: 지시 대상은 문맥상 분향단이므로, 한국어에서는 ‘그 위에’가 간결하면서도 사물을 분명히 가리킵니다.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  english_pob_choice: just as Yahweh had commanded Moses
  chosen_korean: 야훼께서 모세에게 명령하신 대로
  alternatives_korean:
  - 야훼께서 모세에게 명하신 대로
  - 야훼께서 모세에게 명령하신 것처럼
  lexicon: HALOT
  rationale: כַּאֲשֶׁר은 규범 준수를 나타내므로 ‘...하신 대로’가 가장 정확하며, צִוָּה는 예배 규정의 권위를 살려 ‘명령하다’로 옮겼습니다.
theological_decisions:
