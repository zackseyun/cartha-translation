  source_fidelity: 히브리어의 동작(וַיַּקְטֵר), 대상과 위치(향을 그 위에), 향의 수식(קְטֹרֶת סַמִּים), 그리고 야훼께서 모세에게 명령하신 규정 준수의 비교절을 모두 충실히 반영합니다. ‘피웠습니다’는 이 문맥에서 향을 연기로 올리는 제의 행위를 자연스럽게 나타냅니다.
  naturalness: ‘그는 … 그 위에 향기로운 향을 피웠습니다’는 현대 표준 한국어 합쇼체로 자연스럽고 문맥상 분향단을 가리키는 ‘그 위에’도 충분히 명료합니다. ‘향기로운 향’은 약간의 의미 중첩이 있으나, 향료로 만든 향이라는 원문의 수식을 무리 없이 보존합니다.
  terminology: ‘야훼’, ‘모세’, ‘향’, ‘명령하신 대로’는 POB의 용어 원칙 및 본문 문체에 적절합니다. 신명은 고유명사로 일관되게 옮겼고, 교파적 해석을 덧붙이지 않았습니다.
