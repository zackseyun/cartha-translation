base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'the arrangement of bread'; traditionally, 'the bread of the Presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그것 위에 빵을 차례대로, 야훼 앞에 차렸습니다[a]. 곧 야훼께서 모세에게 명령하신 대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘빵의 배열’; 전통적으로는 ‘진설병’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  english_pob_choice: arranged
  chosen_korean: 차렸습니다
  alternatives_korean:
  - 정돈했습니다
  - 배열했습니다
  - 차례로 놓았습니다
  lexicon: HALOT
  rationale: 성소 문맥에서 ערך는 단순한 배치보다 제의적으로 ‘차리다/차려 놓다’에 가깝기 때문에, 현대 한국어에서 자연스럽고 의례적 뉘앙스를 살리는 ‘차렸습니다’를 택했습니다.
- source_word: עֵרֶךְ לֶחֶם
  english_pob_choice: the bread in order
  chosen_korean: 빵을 차례대로
  alternatives_korean:
  - 빵의 배열을
  - 차려진 빵을
  - 진설병을
  lexicon: HALOT
  rationale: 히브리어는 전통 용어보다 ‘정돈된 빵’이라는 서술적 표현을 쓰므로, 본문 자체의 묘사를 살려 ‘빵을 차례대로’로 옮겼습니다. ‘진설병’은 전통적이지만 여기의 표현보다 해석이 앞섭니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 계약 이름인 여호와/야훼 가운데, 이 판의 기준에 따라 고유명사성을 드러내는 음역 ‘야훼’를 유지했습니다.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  english_pob_choice: just as Yahweh had commanded Moses
  chosen_korean: 곧 야훼께서 모세에게 명령하신 대로
  alternatives_korean:
  - 야훼께서 모세에게 명령하신 그대로
  - 야훼께서 모세에게 명하신 대로
  lexicon: HALOT
  rationale: כַּאֲשֶׁר는 결과가 아니라 정확한 일치성을 나타내므로 ‘곧 … 대로’로 대응했고, צִוָּה는 제의 지시의 성격을 살려 ‘명령하신’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기와 제의 문맥의 직설성
  chosen_reading: 본문의 반복되는 יהוה를 모두 ‘야훼’로 옮겨, 제사 절차가 단순 규정 준수가 아니라 야훼의 직접 명령에 대한 순종임을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: WLC의 Tetragrammaton을 가리키는 본문이므로, 한국 교회 관용어인 ‘주님’보다 고유명사 표기가 소스-직결적이며, 반복 강조도 보존됩니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
