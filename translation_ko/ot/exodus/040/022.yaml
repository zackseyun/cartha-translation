base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/022.yaml
  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
  footnotes:
  - marker: a
    text: Or 'outside the curtain.' The Hebrew פָּרֹכֶת refers to the inner partition hanging that screened off the most holy place.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 회막 안, 곧 성막의 북쪽, 휘장 밖에 상을 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘휘장 밖에’. 히브리어 פָּרֹכֶת은 지성소를 가리는 내부 칸막이 휘장을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: He put
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 배치했습니다
  - 두셨습니다
  lexicon: HALOT
  rationale: נתן의 공간적 배치 의미를 자연스러운 현대 한국어 동사로 옮겼습니다. 단순한 ‘놓다’보다 성막 안의 정돈된 설치를 조금 더 분명히 드러냅니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막 안
  alternatives_korean:
  - 만남의 장막 안
  - 회중의 장막 안
  lexicon: HALOT
  rationale: 오경의 정형 표현은 한국어 성경에서 널리 알려진 ‘회막’이 가장 간명하며, 이어지는 위치 설명과도 잘 맞습니다.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  english_pob_choice: on the north side of the tabernacle
  chosen_korean: 성막의 북쪽
  alternatives_korean:
  - 성막의 북편
  - 성막의 북쪽 편
  - 성막의 북쪽 면
  lexicon: HALOT
  rationale: יֶרֶךְ의 ‘옆/측면’ 의미와 방향 부사를 한국어로 자연스럽게 통합해, 배치의 위치를 명확하게 전했습니다.
- source_word: מִחוּץ לַפָּרֹכֶת
  english_pob_choice: outside the veil
  chosen_korean: 휘장 밖에
  alternatives_korean:
  - 장막 칸막이 밖에
  - 커튼 밖에
  lexicon: HALOT
  rationale: פָּרֹכֶת은 성소와 지성소를 가르는 내부 휘장을 가리키므로, 본문이 말하는 분리선을 살려 ‘휘장’으로 옮겼습니다.
