lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  english_pob_choice: you shall anoint
  chosen_korean: 기름을 바르고
  alternatives_korean:
  - 기름부으십시오
  - 기름을 붓고
  lexicon: HALOT
  rationale: 의식적 용례에서 משׁח은 성별을 위한 기름 바름을 뜻하므로, 현대 한국어에서는 ‘기름을 바르다’가 가장 자연스럽고 의미도 분명합니다.
- source_word: הַכִּיּוֹר
  english_pob_choice: the basin
  chosen_korean: 물두멍
  alternatives_korean:
  - 대야
  - 세숫대야
  lexicon: HALOT
  rationale: 성막 기구인 כִּיּוֹר는 한국 성경 전통에서 ‘물두멍’이 가장 정확하고 통용되는 대응어입니다.
- source_word: כַּנּוֹ
  english_pob_choice: its stand
  chosen_korean: 그 받침
  alternatives_korean:
  - 그 기초
  - 그 바닥
  lexicon: HALOT
  rationale: כֵּן은 이 맥락에서 물두멍을 지탱하는 받침 구조를 가리키므로 ‘받침’이 ‘base’보다 더 직접적입니다.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  english_pob_choice: and consecrate it
  chosen_korean: 그것을 거룩하게 하십시오
  alternatives_korean:
  - 그것을 성별하십시오
  - 그것을 봉헌하십시오
  lexicon: HALOT
  rationale: קדשׁ의 성막 문맥에서는 ‘거룩하게 하다’가 제의적 구별의 뜻을 가장 분명하게 드러내며, 여기서는 도덕적 의미가 아니라 성별 행위를 가리킵니다.
theological_decisions:
- issue: קדשׁ의 제의적 의미
  chosen_reading: ‘거룩하게 하십시오’로 옮겨 성막 기구를 하나님께 속하게 하는 구별 행위로 읽습니다.
  alternative_readings:
  - 성별하십시오
  - 봉헌하십시오
  rationale: 본문은 도덕적 정화가 아니라 성막 기구의 예배용 구별을 말하므로, 제의적 의미를 살리는 번역이 필요합니다.
  doctrine_reference: 성막/제사 문맥의 제의적 성별
