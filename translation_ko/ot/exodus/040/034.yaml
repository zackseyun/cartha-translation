translation:
  language: ko
  text: 그때 구름이 회막[a]을 덮었고, 야훼의 영광이 성막을 채웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 하나님의 이름 יְהוָה를 사용합니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיְכַס
  english_pob_choice: covered
  chosen_korean: 덮었고
  alternatives_korean:
  - 가렸고
  - 뒤덮었고
  lexicon: HALOT
  rationale: כסה의 핵심 의미인 ‘덮다’를 직접 살리되, 서사 진행을 자연스럽게 잇기 위해 연결 어미 ‘-었고’를 썼습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: HALOT
  rationale: 이 표현은 출애굽기에서 고정된 성막 용어이므로, 표준적이고 간결한 ‘회막’을 사용해 예배적 기능을 드러냈습니다.
- source_word: כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 영광스러움
  - 야훼의 존귀
  lexicon: HALOT
  rationale: כָּבוֹד는 하나님의 현현된 위엄과 임재를 가리키므로 ‘영광’이 가장 자연스럽고, POB의 नाम성 원칙에 따라 יְהוָה를 ‘야훼’로 옮겼습니다.
- source_word: מָלֵא
  english_pob_choice: filled
  chosen_korean: 채웠습니다
  alternatives_korean:
  - 가득 찼습니다
  - 충만하게 했습니다
  lexicon: HALOT
  rationale: ‘채우다’는 מלא의 사역적 의미를 분명히 드러내며, 성막을 가득 메운 임재의 장면을 한국어로 명료하게 전달합니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 신적 호칭이 아니라 계시된 고유명 YHWH를 쓰므로, 번역본의 정책에 맞춰 대체 титул보다 음역을 택해 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
