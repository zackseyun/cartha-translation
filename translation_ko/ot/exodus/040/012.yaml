  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: ko
  text: 그런 다음 아론과 그의 아들들을 회막 입구 앞으로 데려오십시오. 그리고 물로 그들을 씻으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  english_pob_choice: bring ... near
  chosen_korean: 데려오고
  alternatives_korean:
  - 가까이 데려오고
  - 가져오고
  - 나오게 하고
  lexicon: HALOT
  rationale: 히필형 קרב의 사역적 의미를 살리면서, 제의 문맥에서 자연스러운 한국어로는 ‘데려오다’가 ‘가까이 데려오다’보다 간결하고도 충분히 근접의 뜻을 전달합니다.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  english_pob_choice: the entrance of the tent of meeting
  chosen_korean: 회막의 입구
  alternatives_korean:
  - 회막의 문
  - 회막의 출입구
  - 만남의 장막의 입구
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 출애굽기 제의 문맥에서 관용적으로 ‘회막’으로 옮기는 것이 가장 안정적이며, פֶּתַח은 ‘입구’가 가장 직접적입니다.
- source_word: וְרָחַצְתָּ ... בַּמָּיִם
  english_pob_choice: wash them with water
  chosen_korean: 물로 그들을 씻으십시오
  alternatives_korean:
  - 물로 그들을 씻으시고
  - 그들을 물로 씻으십시오
  - 물로 목욕시키십시오
  lexicon: HALOT
  rationale: רחץ는 일반적으로 ‘씻다’가 가장 정확하며, בְּ/בַּ를 도구적 의미로 받아 ‘물로’라고 옮기면 영어 POB의 ‘with water’와도 잘 맞습니다.
theological_decisions:
- issue: 제의 지시문의 명령형 높임말 처리
  chosen_reading: 모세에게 주시는 지시를 한국어 합쇼체 명령으로 옮겨 ‘데려오십시오/씻으십시오’로 처리했습니다.
  alternative_readings:
  - 데려오라/씻어라
  - 데려오시고/씻으시고
  rationale: 본문은 하나님이 모세에게 주시는 직접 지시이므로, 현대 표준어의 공적·예배적 문체를 유지하면서도 원문의 명령성을 분명하게 드러내는 합쇼체가 적절합니다.
  doctrine_reference: 출애굽기 40장의 성막 봉헌 지시 문맥
