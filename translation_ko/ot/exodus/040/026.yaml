translation:
  language: ko
  text: 그리고 그는 회막 안, 휘장 앞에 금제단을 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘커튼’. 히브리어는 성막 내부를 가르는 휘장을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: And he placed
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 설치했습니다
  - 배치했습니다
  lexicon: HALOT
  rationale: 연속 동작을 나타내는 wayyiqtol의 서술을 자연스럽게 옮기되, 성막 기구를 ‘배치’한 맥락에 맞게 ‘두었습니다’로 간결하게 표현했습니다.
- source_word: מִזְבַּח הַזָּהָב
  english_pob_choice: the gold altar
  chosen_korean: 금제단
  alternatives_korean:
  - 금으로 된 제단
  - 황금 제단
  lexicon: HALOT
  rationale: 히브리어의 ‘금의 제단’이라는 구조를 한국어에서는 성막 문맥의 관용 표현인 ‘금제단’으로 옮겨, 의미를 분명히 하면서도 장식적 과번역을 피했습니다.
- source_word: בְּאֹהֶל מוֹעֵד
  english_pob_choice: in the tent of meeting
  chosen_korean: 회막 안에
  alternatives_korean:
  - 만남의 장막 안에
  - 회의의 장막 안에
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 성막의 고정 명칭이므로, 한국어 성경에서 널리 쓰이는 ‘회막’으로 옮기고 위치 표현을 ‘안에’로 자연화했습니다.
- source_word: הַפָּרֹכֶת
  english_pob_choice: the veil
  chosen_korean: 휘장
  alternatives_korean:
  - 휘장(커튼)
  - 장막문
  lexicon: HALOT
  rationale: פָּרֹכֶת은 성막 내부를 가르는 분리막이므로, 교회 전통에서 통용되는 ‘휘장’을 사용하되 본문의 공간적 기능을 해치지 않도록 했습니다.
theological_decisions:
- issue: פָּרֹכֶת의 번역어 선택
  chosen_reading: ‘휘장’은 단순한 커튼이 아니라 성소와 지성소를 구분하는 성막의 내장막이라는 점을 드러냅니다.
  alternative_readings:
  - ‘커튼’은 더 직역적이지만 성막 문맥의 제의적 무게가 약해질 수 있습니다.
  rationale: 이 구절은 단순한 실내 장식이 아니라 성막의 경계 설정을 말하므로, 문맥의 신학적 기능을 살리는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve theological weight without paraphrase.'
