id: EXO.40.35
reference: Exodus 40:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֣ל מֹשֶׁ֗ה לָ/בוֹא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד כִּֽי שָׁכַ֥ן עָלָ֖י/ו הֶ/עָנָ֑ן וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
  footnotes:
  - marker: a
    text: Or 'dwelt on it' or 'rested on it.' The Hebrew verb can carry the sense of dwelling or settling.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 회막 안으로 들어갈 수 없었습니다. 구름이 그 위에 머물러 있었고[a], 야훼의 영광이 성막을 가득 채웠기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머물러 있었다’로 옮긴 히브리어 동사(שָׁכַן)는 ‘거주하다’, ‘자리하다’, ‘내려앉다’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָכֹל ... לָבוֹא
  english_pob_choice: was not able to enter
  chosen_korean: 들어갈 수 없었습니다
  alternatives_korean:
  - 들어가지 못했습니다
  - 들어갈 수 없었습니다
  lexicon: HALOT
  rationale: יכולת의 능력 부정은 한국어에서 자연스러운 가능 표현으로 옮기되, 서술의 흐름을 살려 합쇼체 과거로 처리했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회중의 장막
  alternatives_korean:
  - 만남의 장막
  - 회막
  lexicon: HALOT
  rationale: 전통 교회 용어인 ‘회막’보다 מקור의 의미를 더 직접적으로 드러내는 ‘회중의 장막’을 택해, 명칭의 기능을 분명히 했습니다.
- source_word: שָׁכַן עָלָיו
  english_pob_choice: the cloud settled on it
  chosen_korean: 구름이 그 위에 머물렀고
  alternatives_korean:
  - 구름이 그 위에 자리 잡았고
  - 구름이 그 위에 깃들었고
  lexicon: HALOT
  rationale: שָׁכַן은 ‘거주하다’의 신학적 뉘앙스가 있지만, 여기서는 구름이 장막 위에 내려앉아 머무는 장면이 핵심이므로 ‘머물렀다’로 구체적 이미지를 살렸습니다.
- source_word: כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 광채
  - 야훼의 존귀
  lexicon: HALOT
  rationale: כָּבוֹד는 하나님의 현현적 ‘영광’으로 번역하는 것이 가장 직접적이며, YHWH는 본 번역 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: מָלֵא אֶת הַמִּשְׁכָּן
  english_pob_choice: filled the tabernacle
  chosen_korean: 성막을 가득 채웠기 때문입니다
  alternatives_korean:
  - 성막을 채웠기 때문입니다
  - 성막에 충만하였기 때문입니다
  lexicon: HALOT
  rationale: מָלֵא의 결과적 상태를 한국어로 자연스럽게 드러내기 위해 ‘가득 채우다’로 옮겼고, ‘성막’은 מִשְׁכָּן의 확립된 성막 용어를 따랐습니다.
theological_decisions:
- issue: 야훼의 임재 때문에 모세가 들어갈 수 없다는 서술의 의미
  chosen_reading: 구름과 영광이 성막을 압도적으로 채워, 모세의 접근이 일시적으로 제한된 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 공간적 점유로 읽기
  - 의식적 금지로 강화해 읽기
  rationale: 본문은 금지 명령보다 임재의 충만함을 강조하므로, 신학적으로는 하나님의 거룩한 임재가 인간의 접근을 제약하는 장면으로 유지하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
