id: EXO.40.24
reference: Exodus 40:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם אֶת הַ/מְּנֹרָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד נֹ֖כַח הַ/שֻּׁלְחָ֑ן עַ֛ל יֶ֥רֶךְ הַ/מִּשְׁכָּ֖ן נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/024.yaml
  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
  footnotes:
  - marker: a
    text: Or 'facing the table.' The Hebrew term נֹכַח can denote position opposite or in front of something.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 등잔대를 회중의 tent of meeting 안에, 상의 맞은편, 곧 성막의 남쪽에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘상의 맞은편에’. 히브리어 נֹכַח는 어떤 것의 맞은편이나 앞쪽 위치를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: He placed
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 설치했습니다
  lexicon: HALOT
  rationale: 완료된 배치를 나타내는 서술동사로서, 성막 기구를 정돈하여 ‘배치했다’는 의미를 자연스럽게 살리기 위해 ‘두었습니다’를 택했습니다.
- source_word: הַמְּנֹרָה
  english_pob_choice: the lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 메노라
  - 등불
  lexicon: HALOT
  rationale: 예배 기구를 가리키는 מְנוֹרָה는 단순한 등불이 아니라 받침대가 있는 촛대/등잔대이므로, 기능이 드러나는 ‘등잔대’가 적절합니다.
- source_word: נֹכַח הַשֻּׁלְחָן
  english_pob_choice: opposite the table
  chosen_korean: 상의 맞은편
  alternatives_korean:
  - 상의 앞에
  - 상을 마주하여
  lexicon: HALOT
  rationale: נֹכַח는 공간적으로 ‘맞은편/마주한 곳’을 뜻하므로, 배치 관계를 간결하게 드러내는 ‘맞은편’을 사용했습니다.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן נֶגְבָּה
  english_pob_choice: on the south side of the tabernacle
  chosen_korean: 성막의 남쪽에
  alternatives_korean:
  - 성막의 남쪽 편에
  - 성막 남쪽 옆에
  lexicon: HALOT
  rationale: 방향표현 전체가 성막의 남쪽 면을 가리키므로, 한국어로는 자연스럽게 ‘남쪽에’로 옮겨 위치를 분명히 했습니다.
theological_decisions:
- issue: 지시 대상 기구의 예배 공간 내 배치 표현
  chosen_reading: ‘회중의 tent of meeting’이라는 영어 표기를 그대로 옮기지 않고, 성막 용어에 맞춰 ‘회중의 만남의 장막 안에’로 이해되도록 정리했습니다.
  alternative_readings:
  - ‘회막 안에’
  - ‘만남의 장막 안에’
  rationale: 원문의 בְּאֹהֶל מוֹעֵד는 출애굽기에서 고정된 성소 명칭이므로, 현대 한국어에서 더 익숙한 성막 문맥을 살려 ‘만남의 장막’으로 처리하는 것이 원문의 제의적 맥락을 잘 전달합니다.
  doctrine_reference: 출 25–40 성막 기구 서술
