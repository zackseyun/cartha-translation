review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the cloud, its not rising, Israel's not setting out, and the limiting temporal phrase. However, the present-like conditional ‘올라가지 않으면’ sits awkwardly with the past habitual narrative ‘떠나지 않았습니다.’ The Hebrew imperfects here describe the customary past pattern in the wilderness narrative; a temporal conditional better conveys this without altering the sense.
  naturalness: ‘구름이 올라가지 않을 때에는’ is natural modern formal Korean for the repeated past circumstance. Repeating ‘구름’ in the final temporal phrase avoids the somewhat vague ‘그것이,’ while retaining the antecedent of the Hebrew suffix.
  terminology: ‘올라가다’ appropriately preserves עלה, and ‘떠나다’ is a suitable concise rendering of נסע in the camp-movement context. No theological elaboration is needed or warranted in this verse.
  issues:
  - severity: medium
    issue: Conditional wording is temporally mismatched in Korean.
    rationale: ‘구름이 올라가지 않으면’ normally presents an open/general condition, whereas ‘떠나지 않았습니다’ is past narrative. ‘올라가지 않을 때에는’ idiomatically renders the verse's recurring past circumstance.
  - severity: low
    issue: The footnote's Korean wording is unclear and its anchor is placed after the whole sentence.
    rationale: ‘그 올라가는 날까지’ lacks a clear Korean referent. The note should identify the Hebrew's nominal expression, and the marker should follow the temporal phrase it explains.
  revised_text: 그러나 구름이 올라가지 않을 때에는, 구름이 올라가는 날까지[a] 그들은 떠나지 않았습니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘그것이 올라감의 날까지’입니다.
    reason: lexical_alternative
  revision_rationale: The revision makes the Korean temporal/conditional construction fit the Hebrew narrative usage and improves the clarity of the temporal phrase and its note. It retains the source's ambiguity about the mechanism of the cloud's rising and does not add interpretive content.
