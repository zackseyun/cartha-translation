base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/037.yaml
  text: But if the cloud did not rise[a], they did not set out until the day it rose.
  footnotes:
  - marker: a
    text: Or, more literally, 'until the day of its rising.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 구름이 올라가지 않으면, 그것이 올라가는 날까지 그들은 떠나지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 올라가는 날까지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 ... 않으면
  alternatives_korean:
  - 그리고 만일 ... 않으면
  - 만일 ... 않으면
  lexicon: HALOT
  rationale: 이전 절과의 대조를 살려 ‘그러나’로 시작하고, 조건 관계는 한국어의 자연스러운 부정 조건문으로 옮겼습니다.
- source_word: יֵעָלֶה / הֵעָלֹתוֹ
  english_pob_choice: rise / it rose
  chosen_korean: 올라가지 / 올라가는 날
  alternatives_korean:
  - 올라오지 / 올라오는 날
  - 들려 올라가지 / 들려 올라가는 날
  - 떠오르지 / 떠오르는 날
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 유지하면서, 구름이 성막 위에서 ‘올라가다’는 문맥을 한국어로 자연스럽게 살렸습니다. ‘그것이 올라가는 날’은 영어 POB의 ‘the day it rose’에 대응하면서도 원문의 ‘그 날까지’ 구조를 보존합니다.
- source_word: יִסְעוּ
  english_pob_choice: set out
  chosen_korean: 떠나지 않았습니다
  alternatives_korean:
  - 출발하지 않았습니다
  - 길을 떠나지 않았습니다
  - 진행하지 않았습니다
  lexicon: HALOT
  rationale: 캠프 이동 문맥에서 נסע는 단순한 여행보다 ‘출발하다/떠나다’가 적절합니다. ‘떠나지 않았습니다’는 간결하면서도 진영 이동을 잘 드러냅니다.
theological_decisions:
- issue: 구름의 이동이 야훼의 임재 지시와 연결된다는 점
  chosen_reading: 구름이 올라가지 않으면, 이스라엘은 그 징표를 따라 이동하지 않았습니다.
  alternative_readings:
  - 단순한 기상 현상으로 읽기
  - 문체상 중립적으로만 번역하기
  rationale: 본문은 출애굽기 전체 맥락에서 구름을 하나님의 임재와 인도하심의 표지로 기능시킵니다. 번역은 그 기능을 흐리지 않되, 본절 자체의 문장을 과도하게 해설하지 않도록 절제했습니다.
  doctrine_reference: 출 40:36-38의 성막 인도 모티프
