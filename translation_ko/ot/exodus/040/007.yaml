translation:
  language: ko
  text: 그리고 너는 물두멍을 회막과 제단 사이에 두고, 거기에 물을 넣어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכִּיֹּר
  english_pob_choice: the basin
  chosen_korean: 물두멍
  alternatives_korean:
  - 대야
  - 세숫대야
  - 물받이
  lexicon: HALOT
  rationale: פִּיּוֹר는 성막 봉사에 쓰는 씻는 그릇을 가리키므로, 한국어 성경 전통에서 통용되는 ‘물두멍’을 쓰되 의미를 분명히 했습니다.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  english_pob_choice: between the tent of meeting and the altar
  chosen_korean: 회막과 제단 사이에
  alternatives_korean:
  - 만남의 장막과 제단 사이에
  - 회중의 장막과 제단 사이에
  lexicon: HALOT
  rationale: 두 대상 사이의 위치를 나타내는 בין...ובין 구조를 자연스러운 한국어 위치 표현으로 옮겼고, אֹהֶל מוֹעֵד는 성막 문맥에 맞는 ‘회막’으로 번역했습니다.
- source_word: מָיִם
  english_pob_choice: water
  chosen_korean: 물을 담아 두어야 합니다
  alternatives_korean:
  - 물을 두어야 합니다
  - 물을 넣어 두어야 합니다
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘물을 두다/놓다’는 뜻이므로, 한국어에서는 용도상 물이 준비되어 있어야 함을 드러내되 원문의 단순성을 유지했습니다.
- source_word: וְנָתַתָּ
  english_pob_choice: And you shall place
  chosen_korean: 그리고 너는 ... 두고
  alternatives_korean:
  - 그리고 너는 ... 놓고
  - 그리고 너는 ... 두어
  lexicon: HALOT
  rationale: 명령형 연속 동작을 한국어에서 자연스럽게 연결하는 ‘두고’로 옮겨, 위치 지정과 물 비치를 함께 살렸습니다.
