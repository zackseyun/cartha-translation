translation:
  language: ko
  text: 너는 뜰을 사방으로 세우고, 뜰 문에 휘장을 달아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘휘장’은 히브리어 מָסַךְ의 대안 번역으로, 출입구에 드리우는 걸개를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  english_pob_choice: And you shall set up
  chosen_korean: 세우고
  alternatives_korean:
  - 놓고
  - 설치하고
  - 배치하고
  lexicon: HALOT
  rationale: 성막 문맥에서 단순한 ‘두다’보다 구조물을 실제로 세워 정비한다는 뜻이 드러나도록 ‘세우다’를 택했습니다.
- source_word: הֶחָצֵר
  english_pob_choice: the courtyard
  chosen_korean: 뜰
  alternatives_korean:
  - 마당
  - 정원
  - 뜨락
  lexicon: HALOT
  rationale: 성막의 סביב을 두르는 공간을 한국어 성경 문맥에서 자연스럽고 간결하게 가리키는 말로 ‘뜰’이 가장 적절합니다.
- source_word: מָסַךְ
  english_pob_choice: the screen
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 막이
  - 차단막
  lexicon: HALOT
  rationale: 출애굽기 성막 용례에서 entrance hanging은 통상적인 예배 용어인 ‘휘장’이 가장 잘 대응하며, 영어 POB의 ‘screen’에 대한 대안 의미도 반영합니다.
- source_word: שַׁעַר הֶחָצֵר
  english_pob_choice: the gate of the courtyard
  chosen_korean: 뜰 문
  alternatives_korean:
  - 뜰의 문
  - 뜰의 대문
  - 뜰 입구
  lexicon: HALOT
  rationale: 문자적으로는 ‘뜰의 문’이지만 한국어에서는 소유 관계를 자연스럽게 압축한 ‘뜰 문’이 가장 읽기 쉽고 원문의 관문 기능도 유지합니다.
