id: EXO.40.18
reference: Exodus 40:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨קֶם מֹשֶׁ֜ה אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּתֵּן֙ אֶת אֲדָנָ֔י/ו וַ/יָּ֨שֶׂם֙ אֶת קְרָשָׁ֔י/ו וַ/יִּתֵּ֖ן אֶת בְּרִיחָ֑י/ו וַ/יָּ֖קֶם אֶת עַמּוּדָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
  footnotes:
  - marker: a
    text: Or 'sockets' for 'bases' (אֲדָנָיו), referring to the foundation pieces that held the tabernacle frames.
    reason: lexical_alternative
  - marker: b
    text: Or 'boards' for 'frames' (קְרָשָׁיו). The Hebrew term can denote boards, but here likely refers to the tabernacle's upright structural members.
    reason: lexical_alternative
  - marker: c
    text: Or 'posts' for 'pillars' (עַמּוּדָיו).
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 성막[a]을 세우고, 그 받침대들을 놓고, 그 널판[b]들을 세우고, 그 가로대들을 끼우고, 그 기둥[c]들을 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성막’은 본문의 מִשְׁכָּן을 성소적 기술 용어로 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘널판’은 קְרָשָׁיו를 한국어 성막 문맥에 맞게 옮긴 표현입니다. 원어는 판자나 널빤지라는 뜻과 함께 구조 부재의 기능을 지닙니다.
    reason: lexical_alternative
  - marker: c
    text: ‘기둥’은 עַמּוּדָיו의 직립 지지 부재를 옮긴 말로, 여기서는 성막 구조의 일부를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם / הַמִּשְׁכָּן
  english_pob_choice: set up the tabernacle
  chosen_korean: 성막을 세우고
  alternatives_korean:
  - 장막을 세우고
  - 성막을 설치하고
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기에서 기술적 용어로 굳어져 있으므로 한국어 성경 관용에 맞는 성막을 택하되, 동사는 구조물을 조립해 세우는 동작을 자연스럽게 드러내는 세우고로 옮겼습니다.
- source_word: אֲדָנָיו
  english_pob_choice: its bases
  chosen_korean: 그 받침
  alternatives_korean:
  - 그 소켓
  - 그 주춧돌
  lexicon: HALOT
  rationale: 성막 널판을 떠받치는 기초 부재라는 기능을 살려 받침으로 옮겼습니다. 소켓은 지나치게 기술적이고, 주춧돌은 재료상을 암시해 문맥에 덜 맞습니다.
- source_word: קְרָשָׁיו
  english_pob_choice: its frames
  chosen_korean: 그 널판
  alternatives_korean:
  - 그 판자
  - 그 틀
  lexicon: HALOT
  rationale: 이 어휘는 성막의 수직 구조 부재를 가리키므로, English POB의 frames 취지를 살리면서도 한국어 성막 용례에 익숙한 널판을 택했습니다.
- source_word: בְּרִיחָיו
  english_pob_choice: its bars
  chosen_korean: 그 띠
  alternatives_korean:
  - 그 가로대
  - 그 빗장
  lexicon: HALOT
  rationale: 널판들을 결속하는 부재라는 기능을 반영해 띠로 옮겼습니다. 가로대와 빗장도 가능하지만, 성막 구조를 설명하는 문맥에서는 띠가 지나치게 좁거나 무거운 느낌을 덜 줍니다.
- source_word: עַמּוּדָיו
  english_pob_choice: its pillars
  chosen_korean: 그 기둥
  alternatives_korean:
  - 그 주기둥
  - 그 장대
  lexicon: HALOT
  rationale: 직립 지지 부재를 가리키는 표준적 표현으로 기둥을 사용했습니다. pillars에 가장 직접적으로 대응하면서도 현대 한국어에서 자연스럽습니다.
