lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 하나님이 주어인 공식적 발화에서는 한국어 성경에서 자연스럽고 존중을 담는 ‘말씀하셨습니다’가 ‘spoke’의 서술적 기능과 잘 맞습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기록은 통용 대체어가 아니라 고유 이름이므로, POB 원칙에 따라 ‘야훼’로 옮겨 원문 고유성을 보존합니다.
- source_word: אֶל
  english_pob_choice: to
  chosen_korean: -에게
  alternatives_korean:
  - 에게로
  - 한테
  lexicon: HALOT
  rationale: 말의 수신자를 표시하는 전치사는 현대 표준어에서는 ‘-에게’가 가장 자연스럽고 문어체에도 적합합니다.
- source_word: לֵּאמֹר
  english_pob_choice: saying
  chosen_korean: “”
  alternatives_korean:
  - 라고 말씀하시며
  - 이르시기를
  lexicon: HALOT
  rationale: 이 동사는 뒤따르는 직접화법을 여는 공식을 이루므로, 한국어에서는 중복 어구 없이 인용부호로 처리해 구조를 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 전통 번역 대체
  chosen_reading: 본문의 신적 이름은 титуляр한 ‘주님’으로 바꾸지 않고 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문은 יְהוָה를 직접 사용하므로, 제목형 대체어는 본문이 드러내는 언약 이름의 직접성을 약화시킵니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
