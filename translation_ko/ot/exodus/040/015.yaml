  to: 그들의 아버지에게 기름을 부으신 것처럼 그들에게 기름을 부으십시오. 그들이 나를 위하여 제사장으로 섬기게 하십시오. 그들이 받은 기름부음은 그들에게 대대로 이어질 영원한[a] 제사장직을 위한 것이 될 것입니다.
  rationale: 비교 구문과 명령의 목적어를 결속하여 원문의 통사 관계를 명확히 했습니다. 제사장 직무를 나타내는 동사 כהן의 의미와, 기름부음이 지속적 제사장직을 위한 것이 된다는 마지막 절의 관계를 보존했습니다. עוֹלָם의 범위에 관한 해석상 여지는 각주에서 대안으로 유지했습니다.
