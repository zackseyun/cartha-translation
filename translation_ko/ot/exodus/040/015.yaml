    issue: 비교 구문이 두 문장으로 분리됨
    rationale: ‘그들의 아버지에게 기름을 부으신 것과 같이 하십시오’는 무엇을 어떻게 하라는지 문맥상 추론해야 합니다. 원문의 ‘그들에게 기름을 부으십시오, 그들의 아버지에게 기름을 부으신 것처럼’ 구조를 한 문장으로 옮기는 편이 정확합니다.
