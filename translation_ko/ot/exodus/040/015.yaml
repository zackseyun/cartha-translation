  verdict: revise
  source_fidelity: 첫 문장은 히브리어의 비교 구문(‘그들의 아버지에게 기름을 부은 것처럼 그들에게’)을 두 문장으로 나누어, 비교의 대상과 명령의 목적어 관계가 다소 흐려졌습니다. 또한 וְכִהֲנוּ לִי는 ‘제사장이 될 것입니다’보다 ‘제사장으로 섬기게 하십시오’가 동사적 제사장 직무와 명령-목적의 관계를 더 충실히 드러냅니다. 마지막 절은 기름부음 자체가 제사장직이 된다는 뜻이라기보다, 그 기름부음이 그들에게 지속되는 제사장직을 위한 것이 된다는 뜻입니다.
  naturalness: 수정안은 현대 표준 한국어 합쇼체를 유지하면서 비교 구문을 한 문장으로 결속하고, ‘나를 위하여 제사장으로 섬기게 하십시오’ 및 ‘제사장직을 위한 것이 될 것입니다’로 자연스럽게 표현합니다.
  terminology: ‘기름을 부으십시오’, ‘제사장’, ‘제사장직’은 적절합니다. עוֹלָם과 לְדֹרֹתָם의 지속성은 ‘대대로 이어질 영원한’으로 옮겨 두 요소를 모두 보존합니다. 각주는 지속성 표현의 대안을 가리키므로 ‘영원한’에 붙이는 것이 적절합니다.
