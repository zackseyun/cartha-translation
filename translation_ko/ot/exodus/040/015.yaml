source:
  edition: WLC
  text: וּ/מָשַׁחְתָּ֣ אֹתָ֗/ם כַּ/אֲשֶׁ֤ר מָשַׁ֨חְתָּ֙ אֶת אֲבִי/הֶ֔ם וְ/כִהֲנ֖וּ לִ֑/י וְ֠/הָיְתָה לִ/הְיֹ֨ת לָ/הֶ֧ם מָשְׁחָתָ֛/ם לִ/כְהֻנַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
  footnotes:
  - marker: a
    text: Or 'a perpetual priesthood.' The Hebrew can denote enduring continuity across generations in covenantal context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 기름을 부으십시오. 그들의 아버지에게 기름을 부으신 것과 같이 하십시오[a]. 그러면 그들이 나를 섬기는 제사장이 될 것입니다. 그들의 기름부음은 그들에게 대대로 이어지는 영원한 제사장직이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대대로 지속되는 제사장직’. 히브리어는 언약적 문맥에서 세대 간 지속을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ / מָשַׁחְתָּ
  english_pob_choice: You shall anoint / you anointed
  chosen_korean: 기름을 부으십시오 / 기름을 부으신 것
  alternatives_korean:
  - 기름을 바르십시오 / 바르신 것
  - 성별하십시오
  lexicon: HALOT
  rationale: 히브리어 מָשַׁח은 제의적 ‘기름부음’을 뜻하므로, 한국어에서도 직역적이면서도 관용적인 ‘기름을 붓다’를 유지했습니다. 앞뒤 동사의 시제가 달라 명령형과 회상형을 구분해 옮겼습니다.
- source_word: כַּאֲשֶׁר
  english_pob_choice: just as
  chosen_korean: -것과 같이
  alternatives_korean:
  - -처럼
  - -대로
  lexicon: HALOT
  rationale: 아론의 아들들과 그들의 아버지에게 행한 기름부음 사이의 정밀한 대응을 살리기 위해 비교 관계를 분명하게 표현했습니다.
- source_word: וְכִהֲנוּ לִי
  english_pob_choice: so that they may serve as priests to me
  chosen_korean: 그들이 나를 섬기는 제사장이 될 것입니다
  alternatives_korean:
  - 그들이 나를 위해 제사장으로 섬길 것입니다
  - 그들이 내게 제사장 직무를 할 것입니다
  lexicon: HALOT
  rationale: כהן의 동사적 용법은 단순히 ‘제사장이다’보다 ‘제사장으로 섬기다/직무를 수행하다’가 더 정확합니다. ‘나를 섬기는’으로 여호와께 대한 봉사 대상을 분명히 했습니다.
- source_word: לִכְהֻנַּת עוֹלָם
  english_pob_choice: an everlasting priesthood
  chosen_korean: 영원한 제사장직
  alternatives_korean:
  - 대대로 지속되는 제사장직
  - 영속적인 제사장직
  lexicon: HALOT
  rationale: כְהֻנָּה는 ‘제사장직’이며, עוֹלָם은 언약 문맥에서 지속성을 강하게 나타내므로 ‘영원한’으로 옮겼습니다. 여기서는 제도적 지속을 드러내는 ‘제사장직’이 자연스럽습니다.
- source_word: לְדֹרֹתָם
  english_pob_choice: throughout their generations
  chosen_korean: 대대로 이어지는
  alternatives_korean:
  - 그들의 세대마다
  - 세세대대로
  lexicon: HALOT
  rationale: 후손들의 연속성을 분명히 하기 위해 한국어에서 자연스러운 세대 지속 표현을 사용했습니다.
theological_decisions:
- issue: עוֹלָם의 지속성 범위
  chosen_reading: ‘영원한’은 절대적 추상 개념보다 언약적·세대적 지속을 강하게 가리키는 표현으로 본문에 유지했습니다.
  alternative_readings:
  - 대대로 지속되는
  - 영속적인
  rationale: 문맥상 제사장직의 언약적 지속을 말하므로 ‘영원한’을 유지하되, 한국어 독자가 과도하게 철학적 무한성을 상상하지 않도록 ‘대대로 이어지는’과 함께 배치했습니다.
  doctrine_reference: Translation philosophy §1, §5
