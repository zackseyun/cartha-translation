id: EXO.40.3
reference: Exodus 40:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ שָׁ֔ם אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/סַכֹּתָ֥ עַל הָ/אָרֹ֖ן אֶת הַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
  footnotes:
  - marker: a
    text: Or 'veil.' Hebrew פָּרֹכֶת refers to the inner tabernacle curtain that screened off the ark.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'the ark of the covenant' in some English renderings, but the Hebrew here is 'the testimony.'
    reason: alternative_reading
translation:
  language: ko
  text: 그곳에 증거궤를 두고, 휘장으로 궤를 가리십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘베일’. 히브리어 פָּרֹכֶת는 증거궤를 가리는 성막 내부의 휘장을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 번역은 전통적으로 ‘언약궤’로 옮기지만, 이곳의 히브리어는 ‘증거’를 씁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרוֹן הָעֵדוּת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 언약궤
  - 증거의 궤
  lexicon: HALOT
  rationale: 히브리어가 분명히 עֵדוּת(증거/증언)을 쓰므로, 전통적인 ‘언약궤’보다 원문 의미를 살려 ‘증거궤’로 옮겼습니다.
- source_word: שַׂמְתָּ שָׁם
  english_pob_choice: you shall place there
  chosen_korean: 거기에 두고
  alternatives_korean:
  - 거기에 놓고
  - 그곳에 배치하고
  lexicon: HALOT
  rationale: 성막 지시문 맥락에서 간결하고 자연스러운 현대 한국어로, 위치 부사 ‘거기’를 살려 ‘두고’로 표현했습니다.
- source_word: וְסַכֹּתָ ... אֶת הַפָּרֹכֶת
  english_pob_choice: you shall screen ... with the curtain
  chosen_korean: 휘장으로 궤를 가리십시오
  alternatives_korean:
  - 휘장으로 궤를 막으십시오
  - 휘장으로 궤를 덮으십시오
  lexicon: HALOT
  rationale: סכך는 단순히 덮는 것이 아니라 경계 역할을 하는 ‘가리다/차단하다’의 뜻이 강하므로, 성막 안쪽 휘장의 기능을 살려 ‘가리십시오’로 옮겼습니다.
- source_word: הַפָּרֹכֶת
  english_pob_choice: the curtain
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 커튼
  lexicon: HALOT
  rationale: פָּרֹכֶת는 성막 내부의 분리용 휘장을 가리키는 표준 성경 용례가 강하므로, 한국어 성경 독자에게 익숙하면서도 공간적 기능을 드러내는 ‘휘장’을 선택했습니다.
theological_decisions:
- issue: 언약 전통 용어보다 원문 어휘를 우선할지 여부
  chosen_reading: 증거궤
  alternative_readings:
  - 언약궤
  rationale: 본문은 covenant(언약)가 아니라 testimony/witness(증거)를 말하므로, 전통적 표현이 익숙하더라도 원문이 가진 의미를 유지하는 쪽이 본문 이해에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: פָּרֹכֶת의 번역이 신학적 뉘앙스에 미치는 영향
  chosen_reading: 휘장
  alternative_readings:
  - 베일
  - 휘장(주석상 ‘베일’ 가능)
  rationale: 여기서 핵심은 장막 내부의 거룩한 공간을 분리하는 장벽 기능입니다. ‘휘장’은 그 기능을 드러내면서도 전통적 성막 이미지와 충돌하지 않습니다.
  doctrine_reference: Translation philosophy §6
