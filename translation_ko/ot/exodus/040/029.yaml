base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: ko
  text: 그는 야훼께서 모세에게 명령하신 대로, 만남의 장막인 성막의 입구에 번제단을 두고 그 위에 번제와 소제를 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  english_pob_choice: the altar of burnt offering
  chosen_korean: 번제단
  alternatives_korean:
  - 번제 드리는 제단
  - 번제의 제단
  lexicon: HALOT
  rationale: 제사 기능이 분명한 전문 용어이므로 한국어 성경에서 널리 쓰이는 ‘번제단’을 택해 간결성과 제의적 정확성을 함께 살렸습니다.
- source_word: שָׂם פֶּתַח
  english_pob_choice: set at the entrance to
  chosen_korean: 입구에 두고
  alternatives_korean:
  - 입구에 놓고
  - 입구에 세우고
  lexicon: HALOT
  rationale: מִשְׁכָּן 앞의 위치 배치를 자연스럽게 옮기되, ‘두다’로 단순한 설치 동작을 유지했습니다.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  english_pob_choice: the tabernacle of the tent of meeting
  chosen_korean: 회막, 곧 만남의 장막
  alternatives_korean:
  - 회막
  - 만남의 장막
  lexicon: HALOT
  rationale: 두 명칭이 겹쳐 있는 구조를 한국어에서 ‘회막, 곧 만남의 장막’으로 풀어 두 호칭을 모두 보이게 했습니다.
- source_word: הָעֹלָה / הַמִּנְחָה
  english_pob_choice: the burnt offering and the grain offering
  chosen_korean: 번제와 소제
  alternatives_korean:
  - 번제와 곡식제물
  - 번제와 곡식 예물
  lexicon: HALOT
  rationale: 제의 맥락에서 מִנְחָה는 일반적인 ‘선물’보다 ‘소제’가 더 정확하고 한국어 교회 독자에게도 기능이 분명합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여호와나 주님 대신, 본 프로젝트 기본값인 하나님의 고유명을 음역한 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 율법적·제의적 순종 공식의 강조
  chosen_reading: ‘이는 야훼께서 모세에게 명령하신 그대로였습니다’로 옮겨, 뒤따르는 행위가 명령에 대한 정확한 순종임을 분명히 했습니다.
  alternative_readings:
  - ‘야훼께서 모세에게 명령하신 대로였습니다’
  - ‘야훼께서 모세에게 명하신 그대로였습니다’
  rationale: 히브리어 כַּאֲשֶׁר는 단순 비교가 아니라 행위의 합치를 강조하므로, ‘그대로’로 순종의 일치를 드러냈습니다.
  doctrine_reference: 출애굽기 40장의 성막 봉헌은 하나님 명령과 인간 순종의 일치를 강조하는 본문입니다.
