translation:
  language: ko
  text: 그는 회막과 제단 사이에 물두멍을 놓고, 거기에 씻을 물을 담아 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכִּיֹּר
  english_pob_choice: the basin
  chosen_korean: 물두멍
  alternatives_korean:
  - 세숫대야
  - 대야
  - 물받이
  lexicon: HALOT
  rationale: 회막 봉사에 쓰인 גדול한 씻는 그릇을 가리키므로, 본문의 기능을 살리되 한국어 성경에서 널리 이해되는 ‘물두멍’을 택했습니다.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  english_pob_choice: between the tent of meeting and the altar
  chosen_korean: 회막과 제단 사이에
  alternatives_korean:
  - 증거의 장막과 제단 사이에
  - 성막과 제단 사이에
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 직역하면 ‘회막’이며, 반복되는 בין...ובין 구조는 한국어에서 자연스럽게 ‘...과 ... 사이에’로 옮겼습니다.
- source_word: וַיִּתֵּן שָׁמָּה
  english_pob_choice: and put water there
  chosen_korean: 거기에 씻을 물을 담아 두었습니다
  alternatives_korean:
  - 거기에 물을 두었습니다
  - 그곳에 물을 넣었습니다
  lexicon: HALOT
  rationale: שָׁמָּה의 ‘거기’와 목적구 לְרָחְצָה의 ‘씻기 위하여’를 함께 살리기 위해, 단순히 ‘물’을 두는 것보다 용도까지 드러내는 표현을 택했습니다.
