base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/004.yaml
  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
  footnotes:
  - marker: a
    text: Or 'light its lamps.' The Hebrew verb literally means 'cause to go up' and can refer to making the lamp flames rise.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 너는 상을 들여놓고 그 위의 것을 차려 놓으며, 등잔대를 들여놓고 그 등잔들을 밝히십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 등잔에 대해서는 원문의 동사가 문자적으로는 ‘올리다’에 해당하며, 불꽃을 피우거나 밝히는 뜻으로도 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  english_pob_choice: you shall bring in
  chosen_korean: 들여놓고
  alternatives_korean:
  - 가져오고
  - 들여오고
  - 가져다 놓고
  lexicon: HALOT
  rationale: 히필 בוא의 사역·이동 의미를 반영해 성막 안으로 들이는 동작을 자연스럽게 살렸습니다.
- source_word: הַשֻּׁלְחָן
  english_pob_choice: the table
  chosen_korean: 상
  alternatives_korean:
  - 식탁
  - 제단상
  - 테이블
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥에서 일반적 ‘table’보다 제의적 용도를 드러내는 ‘상’이 더 적절합니다.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  english_pob_choice: arrange what belongs on it
  chosen_korean: 그 위의 것을 차려 놓으며
  alternatives_korean:
  - 그것을 정돈하며
  - 그 배치를 정하여
  - 그 위에 놓을 것을 배열하며
  lexicon: HALOT
  rationale: ערך의 ‘차리다/배열하다’ 의미와 cognate object 구조를 반영하되, 한국어에서는 ‘그 위의 것’을 보충해 자연스럽게 옮겼습니다.
- source_word: וְהַעֲלֵיתָ
  english_pob_choice: set up
  chosen_korean: 밝히십시오
  alternatives_korean:
  - 켜십시오
  - 올리십시오
  - 점등하십시오
  lexicon: HALOT
  rationale: 등잔에 대해서는 히필 עלה가 실제로 불을 ‘올리다/피우다’는 관용을 갖기 때문에, POB 각주가 지적한 점등 의미를 살려 한국어 동사로 옮겼습니다.
theological_decisions:
- issue: 성막 설치 명령의 문체
  chosen_reading: 직접 명령형으로 옮기되, 말씀 체계에 맞게 정중한 합쇼체를 유지했습니다.
  alternative_readings:
  - 서술형으로 완화하는 방식
  - 명령의 강도를 낮추는 표현
  rationale: 본문은 모세에게 주는 지시이므로 명령성을 유지해야 하며, 한국어 성서문체로는 ‘하십시오’가 가장 자연스럽습니다.
  doctrine_reference: 출애굽기 40장의 성막 봉헌/설치 명령 문맥
- issue: 등잔의 동작 표현
  chosen_reading: ‘밝히십시오’로 옮겨 점화/점등의 실제 행위를 드러냈습니다.
  alternative_readings:
  - ‘올리십시오’
  - ‘켜십시오’
  rationale: 원문 히필 עלה는 단순한 조명보다 ‘불꽃이 오르게 하다’는 제의적 관용을 포함하므로, 의미를 명확히 하면서도 과도한 해설을 피했습니다.
  doctrine_reference: 출 40:4의 성막 등잔 설치 지시
