revisions:
- from: 그런 다음 너는 상을 들여놓고 그 위의 것을 차려 놓으며, 등잔대를 들여놓고 그 등잔들을 밝히십시오.[a]
  to: 그런 다음 상을 들여놓으시고 그 위에 놓을 것들을 차려 놓으십시오. 등잔대를 들여놓으시고 그 등잔들을 올려놓으십시오.[a]
  rationale: 합쇼체를 일관되게 적용했습니다. 상의 ‘배열’을 그 위에 놓을 물품을 차리는 것으로 자연스럽게 옮겼습니다. 등잔에 쓰인 히필 עלה는 설치와 점등의 의미 영역을 모두 가질 수 있으나, 본문은 성막 비품을 들여와 배치하는 순서이므로 ‘올려놓으십시오’를 본문으로 택하고 점등 해석은 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T13:02:10Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 두 ‘들여오다’ 명령, 상 위에 정해진 것을 배열하는 표현, 그리고 등잔들에 대한 히필 עלה를 전반적으로 반영합니다. 다만 문맥상 아직 등불을 실제로 켜는 행위(출 40:25)와 구별될 수 있으므로, 본문에서는 설치·배치의 뜻을 우선하고 점등 가능성은 각주로 남기는 편이 안전합니다.
  naturalness: 초안은 ‘너는’과 ‘밝히십시오’를 함께 사용하여 대명사 반말체와 합쇼체 명령형이 충돌합니다. 이를 일관된 합쇼체로 고치고, ‘그 위의 것’은 ‘그 위에 놓을 것들’로 다듬어 자연스럽게 했습니다.
  terminology: ‘상’과 ‘등잔대’는 적절합니다. נֵרֹתֶיהָ는 등잔대의 복수 등잔이므로 ‘그 등잔들’로 유지합니다. הַעֲלֵיתָ는 설치 문맥에서는 ‘올려놓으십시오’로 옮기고, 불꽃을 피우는 어휘적 가능성을 각주에 제시합니다.
  issues:
  - severity: high
    issue: 높임말·문체의 불일치
    rationale: ‘너는’은 비격식 2인칭 대명사인데 문장 종결은 ‘밝히십시오’라는 합쇼체입니다. 목표 문체인 현대 정중한 합쇼체에 맞추어 대명사를 제거하고 명령형을 일관되게 해야 합니다.
  - severity: medium
    issue: 등잔 동작을 본문에서 단정적으로 점등으로 한정함
    rationale: הַעֲלֵיתָ אֶת־נֵרֹתֶיהָ는 등잔을 올리거나 마련하는 뜻과 불꽃을 피우는 뜻이 관련되어 있습니다. 이 설치 단계에서는 실제 점등이 출 40:25에 따로 언급되므로, 본문은 배치 의미를 우선하고 점등 가능성은 각주에 남기는 것이 문맥과 어휘의 모호성을 함께 보존합니다.
  - severity: low
    issue: ‘그 위의 것’의 지시 대상이 다소 불명확함
    rationale: 원문의 동족목적어는 상에 정해진 물품을 배열하는 뜻입니다. ‘그 위에 놓을 것들’이 한국어에서 더 분명하면서도 필요한 보충 범위를 넘지 않습니다.
