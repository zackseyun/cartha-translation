translation:
  language: ko
  text: 모세와 아론과 아론의 아들들은 그 세면대에서 손과 발을 씻었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것으로’. 히브리어는 세면대를 가리키며 문자적으로는 ‘그것에서’라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  english_pob_choice: washed
  chosen_korean: 씻었습니다
  alternatives_korean:
  - 물을 씻었습니다
  - 목욕했습니다
  lexicon: HALOT
  rationale: 완료 서술의 עברית 동사 רחץ를 자연스러운 서사 과거로 옮겼습니다. 문맥상 발 씻기가 아니라 손과 발을 씻는 행위이므로 일반적인 ‘씻다’가 가장 정확합니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: From it
  chosen_korean: 거기서
  alternatives_korean:
  - 그것으로부터
  - 그것에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘그것으로부터/그것에서’이지만, 한국어에서는 세면대가 행위의 출처가 된다는 점을 살리면서도 문장을 자연스럽게 하기 위해 ‘거기서’로 옮겼습니다.
- source_word: וּבָנָיו
  english_pob_choice: and his sons
  chosen_korean: 그의 아들들은
  alternatives_korean:
  - 그의 자녀들은
  - 아들들은
  lexicon: HALOT
  rationale: 제사장 문맥의 בנים은 아들들을 가리키므로 ‘자녀들’보다 ‘아들들’이 더 정확합니다. 또한 대명사 ‘his’는 아론을 가리킵니다.
theological_decisions:
- issue: 정결 예식의 서술 톤
  chosen_reading: 의례적 세척 행위를 담담한 서사체로 유지했습니다.
  alternative_readings:
  - ‘정결하게 하였습니다’처럼 예식 의미를 덧붙이는 번역
  - ‘손발을 씻어 정결을 행했습니다’처럼 해설을 보태는 번역
  rationale: 본문은 실제로 씻는 행위를 말하며, 정결의 의미는 제의적 문맥에서 독자가 파악할 수 있습니다. 본문 이상의 해설을 덧붙이지 않는 것이 원문 밀착에 더 부합합니다.
  doctrine_reference: 제사장 정결 규례(출 40장 문맥)
