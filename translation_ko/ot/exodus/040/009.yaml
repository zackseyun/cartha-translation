translation:
  language: ko
  text: 그런 다음 관유를 가져다가 성막과 그 안에 있는 모든 것에 바르십시오[a]. 성막과 그 모든 기구를 거룩하게 하십시오. 그러면 성막은 거룩하게 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘기름부음의 기름’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘거룩’이며, ‘지극히 거룩’이 아닙니다.
    reason: alternative_reading
