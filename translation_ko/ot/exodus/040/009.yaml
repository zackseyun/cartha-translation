  text: וְ/לָקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וּ/מָשַׁחְתָּ֥ אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֛/וֹ וְ/אֶת כָּל כֵּלָ֖י/ו וְ/הָ֥יָה קֹֽדֶשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
  footnotes:
  - marker: a
    text: Or, more literally, 'the oil of anointing.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'holy'; not 'most holy.'
    reason: alternative_reading
translation:
  language: ko
  text: 그런 다음 너는 관유를 가져다가 성막과 그 안에 있는 모든 것에 바르고[a], 그것과 그 모든 기구를 거룩하게 하라. 그러면 그것은 거룩하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘기름부음의 기름’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָקַחְתָּ
  english_pob_choice: Then you shall take
  chosen_korean: 그런 다음 너는 … 가져다가
  alternatives_korean:
  - 그리고 너는 … 가져가
  - 너는 … 가져가라
  lexicon: HALOT
  rationale: 지시문 순서 속 명령형을 자연스럽게 살리되, 절차적 선후를 나타내는 ‘그런 다음’으로 원문의 진행을 반영했습니다.
- source_word: שֶׁמֶן הַ/מִּשְׁחָה
  english_pob_choice: the anointing oil
  chosen_korean: 관유
  alternatives_korean:
  - 기름부음의 기름
  - 바르는 기름
  lexicon: HALOT
  rationale: 예배·성막 문맥의 관용적 용례를 살리면서도 한국어로 자연스럽고 간결한 ‘관유’로 옮겼습니다.
- source_word: וּ/מָשַׁחְתָּ
  english_pob_choice: and anoint
  chosen_korean: 바르고
  alternatives_korean:
  - 기름을 부어
  - 기름을 발라
  lexicon: HALOT
  rationale: משׁח의 의식적 의미를 한국어 동사 ‘바르다’로 표현해, 기름을 통한 성별 행위를 분명히 드러냈습니다.
- source_word: וְ/קִדַּשְׁתָּ אֹת/וֹ וְ/אֶת כָּל כֵּלָי/ו
  english_pob_choice: and you shall consecrate it and all its furnishings
  chosen_korean: 그것과 그 모든 기구를 거룩하게 하라
  alternatives_korean:
  - 그것과 그 모든 기구를 성별하라
  - 그것과 그 모든 기구를 성결하게 하라
  lexicon: HALOT
  rationale: קדשׁ의 의식적 의미를 ‘거룩하게 하다’로 직역에 가깝게 살리되, 한국어에서 이해 가능한 성막 성별 표현으로 유지했습니다.
- source_word: קֹדֶשׁ
  english_pob_choice: holy
  chosen_korean: 거룩하게 될 것입니다
  alternatives_korean:
  - 가장 거룩하게 될 것입니다
  - 거룩할 것입니다
  lexicon: HALOT
  rationale: 히브리어가 단순히 ‘거룩’이라고 말하므로, POB처럼 ‘most holy’로 강화하지 않고 상태 진술을 유지했습니다.
theological_decisions:
- issue: 성막의 최종 상태 표현
  chosen_reading: 성막은 관유로 바르고 성별한 뒤 ‘거룩’한 상태가 됩니다.
  alternative_readings:
  - ‘지극히 거룩’한 상태가 됩니다
  - 단순히 의식상 깨끗해진다는 뜻입니다
  rationale: 본문은 קֹדֶשׁ만 사용하므로, 인접 본문이나 전통적 관습에서 더 강한 등급을 끌어오지 않고 본문이 말하는 거룩함만 반영했습니다.
  doctrine_reference: Original-language primacy; avoid importing superlatives not present in the source.
