id: EXO.40.33
reference: Exodus 40:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣קֶם אֶת הֶ/חָצֵ֗ר סָבִיב֙ לַ/מִּשְׁכָּ֣ן וְ/לַ/מִּזְבֵּ֔חַ וַ/יִּתֵּ֕ן אֶת מָסַ֖ךְ שַׁ֣עַר הֶ/חָצֵ֑ר וַ/יְכַ֥ל מֹשֶׁ֖ה אֶת הַ/מְּלָאכָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
  footnotes:
  - marker: a
    text: Or 'curtain' or 'hanging' for 'screen' (מָסַךְ), referring to the textile covering at the courtyard entrance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 성막과 제단 주위에 뜰을 세우고, 뜰 문에 휘장을 달았습니다. 모세는 이렇게 그 일을 마쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘막’ 또는 ‘가림막’. 여기서 מָסַךְ은 뜰 입구를 가리는 직물 덮개를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  english_pob_choice: set up
  chosen_korean: 세우고
  alternatives_korean:
  - 설치하고
  - 일으켜 세우고
  lexicon: HALOT
  rationale: 성막 문맥에서 ‘set up’는 구조물을 세우는 뜻이므로, 자연스러운 현대 한국어인 ‘세우다’가 가장 직접적입니다.
- source_word: הֶחָצֵר
  english_pob_choice: the courtyard
  chosen_korean: 뜰
  alternatives_korean:
  - 마당
  - 울안
  lexicon: HALOT
  rationale: 출애굽기 성막 단락의 전통적이면서도 현대 한국어에서 이해되는 공간명으로 ‘뜰’이 적절합니다.
- source_word: מָסַךְ
  english_pob_choice: the screen
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 차일
  - 천막 덮개
  lexicon: HALOT
  rationale: 문맥상 뜰 문을 가리는 직물 덮개를 가리키므로, 교회 용례와도 맞는 ‘휘장’이 ‘screen’의 기능을 가장 잘 드러냅니다.
- source_word: וַיְכַל מֹשֶׁה אֶת הַמְּלָאכָה
  english_pob_choice: So Moses finished the work
  chosen_korean: 모세는 이렇게 그 일을 마쳤습니다
  alternatives_korean:
  - 모세가 그 일을 끝냈습니다
  - 모세는 일을 완성했습니다
  lexicon: HALOT
  rationale: ‘כלה’의 완료 의미를 살리되, 성막 제작의 전체 작업을 가리키는 ‘그 일’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 여호와의 성막 건립 완수 선언의 종결감
  chosen_reading: 마침표를 분명히 하여, 모세의 순종적 수행과 작업의 완결을 담담하게 드러냈습니다.
  alternative_readings:
  - 감탄조나 의역으로 완결감을 더 강조함
  - ‘완성했다’로 더 강하게 옮김
  rationale: 본문은 서술적 결말을 전달하므로 과장하지 않고 완료 사실을 분명히 표현하는 것이 원문에 충실합니다.
  doctrine_reference: 출 40장의 성막 봉헌 서술 전체 맥락
- issue: ‘휘장’의 선택
  chosen_reading: 뜰 문의 직물 가림막은 ‘휘장’으로 옮겨, 단순한 문짝이 아니라 예배 공간을 구분하는 천막성 요소임을 보존했습니다.
  alternative_readings:
  - ‘문막이’처럼 기능 중심으로 옮김
  - ‘커튼’으로 음역적 현대화를 함
  rationale: 출애굽기 성막 문맥에서는 직물로 된 가림막의 예배적 기능이 중요하므로, ‘휘장’이 본문 의미를 가장 잘 보존합니다.
  doctrine_reference: 성막 기구와 출입 경계에 대한 출 26–40장 문맥
