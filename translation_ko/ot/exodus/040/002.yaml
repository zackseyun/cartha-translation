base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/002.yaml
  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
  footnotes:
  - marker: a
    text: Or, more formally, 'the tabernacle of the tent of meeting.' The Hebrew joins two sanctuary terms that may be taken appositionally or as a tighter construct-like expression.
    reason: alternative_reading
translation:
  language: ko
  text: 첫째 달 초하룻날에 너는 회막의 성막을 세워야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘성막’과 ‘회막’이라는 두 성소 명칭을 나란히 두며, 문맥상 같은 성소를 서로 다른 각도에서 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: בְּ/יוֹם הַ/חֹדֶשׁ הָ/רִאשׁוֹן
  english_pob_choice: On the first day of the first month
  chosen_korean: 첫째 달 초하룻날에
  alternatives_korean:
  - 첫째 달의 첫날에
  - 첫째 달 첫째 날에
  lexicon: HALOT
  rationale: 달력 표현으로서 ‘חֹדֶשׁ הָרִאשׁוֹן’은 ‘첫째 달’이 자연스럽고, ‘בְּיוֹם … בְּאֶחָד לַחֹדֶשׁ’는 관용적으로 ‘초하룻날’로 옮겨 원문의 날짜 표지를 간결하게 살렸습니다.
- source_word: תָּקִים
  english_pob_choice: you shall set up
  chosen_korean: 세워야 합니다
  alternatives_korean:
  - 세우셔야 합니다
  - 세울 것입니다
  lexicon: HALOT
  rationale: הִפְעִיל형 קום은 ‘서게 하다, 세우다’의 뜻이므로, 성막을 조립·설치하는 맥락에 맞게 ‘세우다’를 사용했습니다.
- source_word: מִשְׁכַּן
  english_pob_choice: tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 장막 성소
  lexicon: HALOT
  rationale: 출애굽기의 מִשְׁכָּן은 이동식 성소를 가리키는 고유한 성막 용어이므로, 한국어 관용에 맞는 ‘성막’을 택했습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 회중의 장막
  lexicon: HALOT
  rationale: אֹהֶל מוֹעֵד는 출애굽기의 표준 성소 명칭으로서 한국어 성경에서 널리 쓰이는 ‘회막’이 원문의 기능적 의미를 가장 안정적으로 전달합니다.
theological_decisions:
- issue: מִשְׁכַּן과 אֹהֶל מוֹעֵד의 관계
  chosen_reading: ‘회막의 성막’으로 병치해, 같은 성소를 두 명칭으로 함께 드러냈습니다.
  alternative_readings:
  - ‘회막 성막’처럼 더 압축적으로 처리
  - ‘회막 장막’으로 하나의 복합 명칭처럼 처리
  rationale: 히브리어는 명시적 소유격 없이 두 성소 용어를 나란히 두며, 문맥상 별개의 두 건물이 아니라 동일한 성소를 서로 다른 각도에서 부르는 표현입니다. 한국어에서는 이 중첩을 살리기 위해 병치 구조를 택했습니다.
  doctrine_reference: 출애굽기 성막/회막 명칭의 동격적 사용
