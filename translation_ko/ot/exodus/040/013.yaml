  text: וְ/הִלְבַּשְׁתָּ֙ אֶֽת אַהֲרֹ֔ן אֵ֖ת בִּגְדֵ֣י הַ/קֹּ֑דֶשׁ וּ/מָשַׁחְתָּ֥ אֹת֛/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֖/וֹ וְ/כִהֵ֥ן לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
  footnotes:
  - marker: a
    text: Or, 'and he shall minister as priest to me.' The Hebrew verb means to function or serve in the priestly office.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론에게 거룩한 옷을 입히고, 그에게 기름을 부으며 그를 거룩하게 하십시오. 그가 내게 제사장으로 섬기게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제사장으로 섬기다’는 히브리어 동사가 제사장 직분에서 기능하거나 봉사하는 뜻을 가진다는 점을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  english_pob_choice: you shall clothe
  chosen_korean: 옷을 입히고
  alternatives_korean:
  - 입히고
  - 옷을 입게 하고
  lexicon: HALOT
  rationale: 사역형 동사로서 아론에게 제의복을 ‘입히는’ 행위를 직접 나타내는 것이 자연스럽고, 의복 수여의 공적 성격도 유지합니다.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  english_pob_choice: the holy garments
  chosen_korean: 거룩한 옷
  alternatives_korean:
  - 거룩한 의복
  - 성스러운 옷
  lexicon: HALOT
  rationale: 직역에 가깝게 제의적 구별을 드러내면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 정리했습니다.
- source_word: וּמָשַׁחְתָּ
  english_pob_choice: you shall anoint
  chosen_korean: 기름을 부으며
  alternatives_korean:
  - 기름을 바르며
  - 기름을 발라
  lexicon: HALOT
  rationale: משח의 제의적 ‘기름 부음’을 한국어 성경에서 널리 쓰이는 동사로 옮겨, 성별 의식을 분명히 했습니다.
- source_word: וְקִדַּשְׁתָּ
  english_pob_choice: you shall consecrate
  chosen_korean: 거룩하게 하십시오
  alternatives_korean:
  - 성별하십시오
  - 성화하십시오
  lexicon: HALOT
  rationale: קדשׁ의 핵심은 속된 용도에서 떼어 하나님께 구별하는 것이므로, ‘거룩하게 하다’로 제의적 성격을 직접 살렸습니다.
- source_word: וְכִהֵן לִי
  english_pob_choice: and he shall serve as priest to me
  chosen_korean: 그가 내게 제사장으로 섬기게 될 것입니다
  alternatives_korean:
  - 그가 내게 제사장으로 봉사할 것입니다
  - 그가 내 앞에서 제사장 직분을 맡게 될 것입니다
  lexicon: HALOT
  rationale: כהן은 단순한 직함보다 제사장 직무 수행을 뜻하므로, ‘제사장으로 섬기다’로 기능적 의미를 살렸습니다.
theological_decisions:
- issue: 제의적 설치 절차의 순서
  chosen_reading: 옷을 입히고, 기름을 부으며, 거룩하게 한 뒤, 제사장으로 섬기게 되는 순서를 그대로 유지했습니다.
  alternative_readings:
  - 한 번에 ‘임직시키다’로 묶는 번역
  rationale: 본문은 의복, 기름 부음, 거룩하게 함, 제사장 직무 수행을 연속 동작으로 제시하므로, 이를 하나로 압축하면 제의적 세부가 사라집니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: וְכִהֵן לִי의 문법적 흐름
  chosen_reading: 뒤의 절을 결과 진술처럼 ‘그가 내게 제사장으로 섬기게 될 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘그리고 그가 내게 제사장으로 섬길 것입니다’
  rationale: 히브리어는 앞선 명령들의 결과를 이어 주는 흐름이므로, 한국어에서도 자연스러운 결과/귀결 표현이 가장 잘 맞습니다.
  doctrine_reference: Translation philosophy §1
