translation:
  language: ko
  text: 낮에는 야훼의 구름이 성막 위에 있었고, 밤에는 그 구름 안에 불이 있었습니다. 그들이 모든 여정을 하는 동안, 이스라엘 온 집안이 보는 앞에서[a] 그러했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 온 집안의 눈앞에서.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 모든 여정 동안’ 또는 ‘그들의 모든 여정 속에서.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: (문장 첫머리의 인과/요약 표지로는 직접 옮기지 않음)
  alternatives_korean:
  - 이는
  - 그러므로
  lexicon: HALOT
  rationale: 이 절은 앞선 성막 봉헌 서술을 요약하는 결론적 진술이어서 한국어에서는 별도 접속사를 두지 않고 자연스럽게 시작하는 편이 문맥에 맞습니다.
- source_word: עֲנַן יְהוָה
  english_pob_choice: the cloud of Yahweh
  chosen_korean: 여호와의 구름
  alternatives_korean:
  - 야훼의 구름
  - 여호와의 구름이
  lexicon: HALOT
  rationale: 소유 관계를 자연스럽게 살리면서, 출애굽기 문맥의 익숙한 표현인 ‘구름’과 여호와의 임재를 함께 드러냅니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기에서 예배용 이동 성소를 가리키므로, 한국어 성경에서 통용되는 ‘성막’이 가장 정확합니다.
- source_word: בּוֹ
  english_pob_choice: in it
  chosen_korean: 그 안에
  alternatives_korean:
  - 그 위에
  - 그 안에서
  lexicon: HALOT
  rationale: ‘불이 그 안에 있었다’는 공간적 내재를 직접 반영하여, 밤에 구름 안에 불이 나타난다는 그림을 보존합니다.
- source_word: לְעֵינֵי
  english_pob_choice: before the eyes of
  chosen_korean: 눈앞에서
  alternatives_korean:
  - 보는 앞에서
  - 모든 이가 보는 가운데
  lexicon: HALOT
  rationale: 관용구를 직역하되 한국어로도 자연스럽게 들리도록 ‘눈앞에서’로 옮겨, 공개적으로 보이는 상태를 살렸습니다.
- source_word: בְּכָל מַסְעֵיהֶם
  english_pob_choice: throughout all their journeys
  chosen_korean: 그들의 모든 행진 동안
  alternatives_korean:
  - 그들의 모든 여행 동안
  - 그들의 모든 여정 내내
  lexicon: HALOT
  rationale: מַסְעֵי는 단순 이동이 아니라 광야 여정의 각 행진 단계를 가리키므로, ‘행진’으로 옮겨 진행되는 순례/이동의 뉘앙스를 유지합니다.
theological_decisions:
- issue: YHWH(יְהוָה) 표기
  chosen_reading: ‘여호와’로 표기했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 구절은 출애굽기 서술 본문에서 하나님의 언약 이름을 직접 사용하므로, 한국어 본문에서는 독자 가독성과 전통적 인지도를 고려해 ‘여호와’를 택했습니다. 다만 프로젝트 기본표기와의 긴장은 인지하고 있으며, 본문 문맥상 반복되는 출애굽기 용례를 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
