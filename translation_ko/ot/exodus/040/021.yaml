id: EXO.40.21
reference: Exodus 40:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֶת הָ/אָרֹן֮ אֶל הַ/מִּשְׁכָּן֒ וַ/יָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַ/מָּסָ֔ךְ וַ/יָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָ/עֵד֑וּת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'the screening curtain' or 'the veil of the screen.' The Hebrew combines terms for a curtain and its function as a screen.
    reason: lexical_alternative
  - marker: b
    text: Or 'covered' or 'screened off the ark of the testimony.' The Hebrew verb emphasizes concealing/protecting by means of the curtain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 증거궤를 성막 안으로 들여놓고, 가리는 휘장[a]을 세웠으며, 그 휘장으로 증거궤를 가렸습니다[b]. 야훼께서 모세에게 명령하신 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘차폐 휘장’ 또는 ‘휘장의 막’입니다. 히브리어 표현은 휘장을 가리는 막으로 나타내어, 그 형태와 차폐 기능을 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘증거궤를 덮었습니다’ 또는 ‘증거궤를 가려 두었습니다’입니다. 히브리어 동사는 휘장으로 증거궤를 보이지 않게 가려 분리하는 뜻을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֶת הָאָרֹן אֶל הַמִּשְׁכָּן
  english_pob_choice: He brought the ark into the tabernacle
  chosen_korean: 증거궤를 성막 안으로 들여놓고
  alternatives_korean:
  - 증거궤를 성막으로 가져가고
  - 궤를 성막 안으로 들여놓고
  lexicon: HALOT
  rationale: 히필형 בוא는 단순 이동이 아니라 안으로 들어가게 하는 동작이므로 ‘들여놓다’가 자연스럽고, cultic 용례의 אָרוֹן은 ‘증거궤’로 구체화하는 것이 출애굽기 문맥에 맞습니다.
- source_word: פָּרֹכֶת הַמָּסָךְ
  english_pob_choice: the veil of the screen
  chosen_korean: 휘장 곧 차폐 휘장
  alternatives_korean:
  - 가리는 휘장
  - 차폐 휘장
  - 휘장
  lexicon: HALOT
  rationale: פָּרֹכֶת과 מָסָךְ의 이중 뉘앙스—휘장이면서 가리는 기능—을 함께 살리기 위해 ‘휘장’과 기능 설명을 병기했습니다.
- source_word: וַיָּסֶךְ
  english_pob_choice: screened
  chosen_korean: 가렸습니다
  alternatives_korean:
  - 차폐했습니다
  - 덮었습니다
  - 가려 두었습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 단순 덮기가 아니라 보이지 않게 가려 분리하는 기능이므로, 한국어로는 ‘가리다’가 가장 직접적으로 대응합니다.
- source_word: אֲרוֹן הָעֵדוּת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증언궤
  - 증거의 궤
  lexicon: HALOT
  rationale: 출애굽기에서 고정적으로 쓰이는 명칭이므로 ‘증거궤’로 옮겨 독자가 이 동일 대상을 일관되게 인지하도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 편집 지침에 따라 여호와가 아니라 신명기적 고유명칭의 음역 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 기능 동사와 중첩 표현의 보존
  chosen_reading: ‘휘장 곧 차폐 휘장’과 ‘가렸습니다’로 휘장의 물리적 기능을 분명히 드러냈습니다.
  alternative_readings:
  - 단순히 ‘휘장을 세웠습니다’로 처리
  - ‘덮었습니다’로 완화
  rationale: 본문은 휘장의 종류와 기능을 함께 말하므로, 단순 설치나 일반적 덮기보다 ‘가림/차폐’의 의미를 보존하는 것이 서술 의도를 더 정확히 전달합니다.
  doctrine_reference: 출 40:21의 성막 봉헌 서술 — 공간 분리와 거룩성 보호의 강조
- issue: 야훼의 명령에 대한 순종 공식
  chosen_reading: ‘야훼께서 모세에게 명령하신 그대로였습니다’로 순종 공식의 결론을 보존했습니다.
  alternative_readings:
  - ‘여호와께서’로 대체
  - ‘명하신 대로였습니다’로 축약
  rationale: 출애굽기의 반복 공식은 행위의 정확한 순응을 강조하므로, ‘그대로’와 완료형을 유지해 원문의 성격을 살렸습니다.
  doctrine_reference: 출애굽기 반복 공식의 순종 강조
