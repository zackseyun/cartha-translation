base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: ko
  text: 그는 장막을 성막 위에 펴고, 그 위에 장막 덮개를 위에서부터 씌웠습니다. 야훼께서 모세에게 명령하신 그대로였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  english_pob_choice: spread
  chosen_korean: 펴고
  alternatives_korean:
  - 펼치고
  - 늘이고
  lexicon: HALOT
  rationale: 덮개나 천을 넓게 펼쳐 씌우는 동작을 자연스럽게 살리기 위해 ‘펴고’를 선택했습니다.
- source_word: הָאֹהֶל
  english_pob_choice: the tent
  chosen_korean: 장막
  alternatives_korean:
  - 천막
  - 텐트
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥에서 אֹהֶל은 성소 구조물의 외부 덮개로서의 ‘장막’이 가장 자연스럽고, 뒤의 ‘덮개’와도 구별됩니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: מִשְׁכָּן은 여기서 하나님의 거하심을 위한 성막을 가리키므로, 한국어 성경에서 널리 쓰이는 ‘성막’이 문맥상 정확합니다.
- source_word: מִכְסֵה הָאֹהֶל
  english_pob_choice: the covering of the tent
  chosen_korean: 장막 덮개
  alternatives_korean:
  - 장막의 덮개
  - 덮는 천
  lexicon: HALOT
  rationale: 원문의 ‘덮개’와 ‘장막’의 관계를 살리되 한국어에서는 소유격보다 합성명사형이 더 간결하여 ‘장막 덮개’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기준에 따라 신적 이름 יְהוָה는 대체 호칭이 아니라 고유명사로서 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 이 반복 공식의 순종 강조
  chosen_reading: ‘야훼께서 모세에게 명령하신 그대로였습니다’로 옮겨, 절차적 순종과 정확한 일치를 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 모세에게 명령하신 대로였습니다’
  - ‘모세에게 명령하신 야훼의 명령대로였습니다’
  rationale: כַּאֲשֶׁר는 단순한 동시성을 넘어 명령과 실행의 정확한 대응을 강조하므로, ‘그대로’가 그 뉘앙스를 잘 드러냅니다.
  doctrine_reference: 출 40장 성막 완성 서술의 순종 공식
