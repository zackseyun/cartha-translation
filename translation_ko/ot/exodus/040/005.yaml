source:
  edition: WLC
  text: וְ/נָתַתָּ֞ה אֶת מִזְבַּ֤ח הַ/זָּהָב֙ לִ/קְטֹ֔רֶת לִ/פְנֵ֖י אֲר֣וֹן הָ/עֵדֻ֑ת וְ/שַׂמְתָּ֛ אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the golden altar of incense.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''the ark of the testimony''; traditionally often rendered ''the ark of the covenant.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 너는 향을 피우는 금 제단을 증거궤 앞에 두고, 회막의 प्रवेश구를 위한 가리개를 두어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적으로는 ‘금 향단’이라고도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘증거의 궤’입니다. 전통적으로는 ‘언약궤’라고도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  english_pob_choice: you shall place
  chosen_korean: 두어야 합니다
  alternatives_korean:
  - 놓아야 합니다
  - 배치해야 합니다
  lexicon: HALOT
  rationale: 성막 기구를 정해진 위치에 두는 명령이므로, 자연스러운 현대어로 ‘두다’를 사용하되 명령형의 지시성을 살리기 위해 ‘두어야 합니다’로 옮겼습니다.
- source_word: מִזְבַּח הַזָּהָב לִקְטֹרֶת
  english_pob_choice: the golden altar for incense
  chosen_korean: 향을 피우는 금 제단
  alternatives_korean:
  - 분향을 위한 금 제단
  - 향 제단
  lexicon: HALOT
  rationale: 히브리어는 ‘금’이라는 재질과 ‘향을 피우는 용도’를 함께 드러내므로, ‘향을 피우는 금 제단’으로 옮겨 용도와 재질을 함께 보존했습니다.
- source_word: אֲרוֹן הָעֵדֻת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증거의 궤
  - 언약궤
  lexicon: HALOT
  rationale: 본문의 עֵדֻת는 ‘증거’이므로, 전통적이지만 덜 직접적인 ‘언약궤’ 대신 성막 문맥에서 통용되는 ‘증거궤’를 사용했습니다.
- source_word: מָסַךְ הַפֶּתַח לַמִּשְׁכָּן
  english_pob_choice: the screen for the entrance of the tabernacle
  chosen_korean: 회막의 प्रवेश구를 위한 가리개
  alternatives_korean:
  - 성막 입구의 휘장
  - 회막 문가의 차양
  lexicon: HALOT
  rationale: מָסַךְ는 문턱의 ‘가리개/차단막’에 가깝고, פֶּתַח는 ‘entrance’이므로 ‘가리개’와 ‘입구’를 대응시켜 성막 구조 용어를 유지했습니다.
theological_decisions:
- issue: ‘증거’와 전통적 ‘언약’ 사이의 표현 선택
  chosen_reading: 증거궤로 옮겨, 본문의 명시적 명칭을 유지했습니다.
  alternative_readings:
  - 언약궤로 옮기는 전통적 표현
  rationale: 이 절은 궤를 ‘증거’(עֵדֻת)로 규정하므로, 독자가 본문의 정확한 명칭을 보도록 하는 것이 원문 우선 원칙에 더 부합합니다.
  doctrine_reference: Translation philosophy §1 (Original-language primacy over translation tradition)
