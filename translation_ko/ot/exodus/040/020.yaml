  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח וַ/יִּתֵּ֤ן אֶת הָ/עֵדֻת֙ אֶל הָ֣/אָרֹ֔ן וַ/יָּ֥שֶׂם אֶת הַ/בַּדִּ֖ים עַל הָ/אָרֹ֑ן וַ/יִּתֵּ֧ן אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָֽעְלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
  footnotes:
  - marker: a
    text: Or 'the tablets of the testimony'; Hebrew 'the testimony' is the technical term used here for what was placed in the ark.
    reason: lexical_alternative
  - marker: b
    text: Or 'the atonement cover.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 증거판을 궤 안에 넣고, 채들을 궤에 끼우고, 속죄소를 궤 위, 위쪽에 놓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘증거판’을 뜻합니다. 히브리어 ‘증거’는 여기서 궤 안에 놓인 성막의 전문 용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘속죄소’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  english_pob_choice: the testimony
  chosen_korean: 증거판
  alternatives_korean:
  - 증거
  - 증언
  - 언약 증거판
  lexicon: HALOT
  rationale: 성막 문맥에서 ‘증거’는 언약의 증거가 들어 있는 물체를 가리키는 기술어로 쓰이므로, 한국어에서는 내용과 물성을 함께 드러내는 ‘증거판’이 가장 자연스럽습니다.
- source_word: הָאָרֹן
  english_pob_choice: the ark
  chosen_korean: 궤
  alternatives_korean:
  - 함
  - 상자
  - 언약궤
  lexicon: HALOT
  rationale: 이 절에는 ‘언약’이 직접 없으므로, 본문에 없는 수식을 덧붙이지 않고 성막 문맥의 표준어인 ‘궤’를 택했습니다.
- source_word: הַבַּדִּים
  english_pob_choice: the poles
  chosen_korean: 채들
  alternatives_korean:
  - 막대기들
  - 운반채
  - 장대들
  lexicon: HALOT
  rationale: 언약궤를 메는 도구라는 기능을 살리면서도 현대 한국어에서 성막 용례로 자연스러운 ‘채들’을 사용했습니다.
- source_word: הַכַּפֹּרֶת
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 은혜시좌
  - 시은소
  - 은혜의 자리
  lexicon: HALOT
  rationale: 한국 교회 전통의 ‘시은소’도 가능하지만, 본문의 제의적 기능과 원어의 전문성을 더 직접적으로 드러내는 ‘속죄소’를 택했습니다.
theological_decisions:
- issue: ‘the testimony’의 구체성
  chosen_reading: 판 자체를 가리키는 제의적 표현으로 보고 ‘증거판’으로 옮겼습니다.
  alternative_readings:
  - 추상적으로 ‘증거’로만 번역함
  - 명시적으로 ‘언약판’이라 풀이함
  rationale: 본문은 궤에 실제로 넣는 대상을 말하므로 추상어만 두면 장면성이 약해지고, 반대로 ‘언약판’은 본문에 없는 설명을 보태게 됩니다. ‘증거판’이 두 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘mercy seat’의 한국어 제의 용어
  chosen_reading: ‘속죄소’로 번역해 기능과 성막 맥락을 분명히 했습니다.
  alternative_readings:
  - 전통 교회어 ‘시은소’ 사용
  - 일반어 ‘덮개’ 사용
  rationale: 여기서 מדובר하는 것은 단순한 덮개가 아니라 속죄와 관련된 성막 기물입니다. 따라서 기능을 흐리는 일반어보다 제의적 의미가 드러나는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3
