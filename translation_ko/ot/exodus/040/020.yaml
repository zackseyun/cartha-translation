  source_fidelity: 히브리어 הָעֵדֻת는 궤 안에 넣는 구체적 대상을 가리키지만, 본문 자체는 ‘판’을 명시하지 않고 성막의 기술어 ‘증거’를 사용합니다. 따라서 본문의 ‘증거판’은 안전하게 단정할 수 있는 수준보다 구체적입니다. הַבַּדִּים의 ‘채들’, הָאָרֹן의 ‘궤’, הַכַּפֹּרֶת의 ‘속죄소’는 문맥상 적절합니다. 마지막 מִלְמָעְלָה는 속죄소가 궤의 윗면에 놓임을 나타내므로 ‘궤 위에’로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘궤 위, 위쪽에’는 중복되고 어색합니다. ‘궤 위에 속죄소를 올려놓았습니다’가 현대 표준어 합쇼체로 자연스럽고 원문의 공간 관계도 충분히 보존합니다. 각주 표지는 해당 어휘 바로 뒤에 두는 편이 명확합니다.
  terminology: ‘증거’는 원문의 기술적이고 다소 압축된 표현을 보존하며, 각주에서 ‘증거판’이라는 구체적 대안을 제시할 수 있습니다. ‘속죄소’는 일관된 제의 용어로 사용할 수 있으나, 기존 b 각주는 본문 용어를 그대로 반복하여 대안 기능을 하지 못하므로 ‘속죄 덮개’로 고칩니다.
