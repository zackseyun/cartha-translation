translation:
  language: ko
  text: 그리고 번제단과 그 모든 기구에 기름을 부으십시오. 또 제단을 거룩하게 하십시오. 그러면 제단은 지극히 거룩하게 될 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘거룩함 중의 거룩함’이라고 하는 최상급 표현으로, ‘지극히 거룩함’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  english_pob_choice: you shall anoint
  chosen_korean: 기름을 부으십시오
  alternatives_korean:
  - 바르십시오
  - 기름부으십시오
  - 도유하십시오
  lexicon: HALOT
  rationale: 제의적 문맥에서 ‘משׁח’는 단순 도포가 아니라 성별을 위한 기름 부음을 뜻하므로, 자연스러운 한국어로 ‘기름을 부으십시오’가 가장 직접적입니다.
- source_word: מִזְבַּח הָעֹלָה
  english_pob_choice: the altar of burnt offering
  chosen_korean: 번제단
  alternatives_korean:
  - 번제의 제단
  - 번제물을 위한 제단
  lexicon: HALOT
  rationale: 히브리어 합성구는 특정 기능의 제단을 가리키므로, 한국어 성경에서 널리 쓰이면서도 의미가 분명한 ‘번제단’을 택했습니다.
- source_word: כָּל כֵּלָיו
  english_pob_choice: all its utensils
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 그릇
  - 그 모든 기물
  - 그 모든 도구
  lexicon: HALOT
  rationale: ‘כֵּלִים’은 제의에 쓰는 장비 전반을 가리키므로, 제의 문맥을 살리면서도 현대 한국어에서 넓게 통하는 ‘기구’로 옮겼습니다.
- source_word: קֹדֶשׁ קָדָשִׁים
  english_pob_choice: most holy
  chosen_korean: 지극히 거룩한 것
  alternatives_korean:
  - 지성소의 것
  - 가장 거룩한 것
  - 지극히 성스러운 것
  lexicon: HALOT
  rationale: 이 표현은 공간 명칭이 아니라 최상급 거룩함을 나타내는 관용적 강조이므로, ‘지극히 거룩한 것’으로 옮겨 제의적 등급을 분명히 했습니다.
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים의 처리
  chosen_reading: 제단의 최상급 거룩함을 나타내는 표현으로 읽고, 공간적 ‘지성소’ 연상은 넣지 않았습니다.
  alternative_readings:
  - 지성소
  - 가장 거룩한 것
  rationale: 본문은 제단의 성별 결과를 말하며, 히브리어는 장막 내부 공간이 아니라 성스러움의 등급을 강조합니다. 따라서 전통적 공간 명칭을 끌어오지 않고 의미를 그대로 유지했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve theological tension rather than resolve it'
