translation:
  language: ko
  text: 그리고 그의 아들들을 가까이 데려와 그들에게 속에 입는 옷을 입히십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아들들을 앞으로 데려오십시오’ 또는 ‘그의 아들들을 세우십시오’. 히브리어 동사는 성소 봉사를 위해 사람을 공식적으로 가까이 나아오게 하거나 세우는 뜻을 지닐 수 있습니다. ‘속에 입는 옷’은 튜닉류의 기본 의복을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  english_pob_choice: you shall bring near
  chosen_korean: 데려와서
  alternatives_korean:
  - 가까이 오게 하십시오
  - 앞으로 데려오십시오
  - 봉헌하도록 데려오십시오
  lexicon: HALOT
  rationale: 제사장 위임 문맥의 공식적 ‘가까이 나아오게 함’을 살리되, 한국어에서는 자연스러운 명령형으로 압축해 표현했습니다.
- source_word: בָּנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들을
  alternatives_korean:
  - 그의 자녀들을
  - 아들들을
  lexicon: HALOT
  rationale: 히브리어는 남성 후손을 가리키므로 ‘아들들’이 정확하며, 문맥상 아론의 아들들임을 앞선 대명사로 받았습니다.
- source_word: וְהִלְבַּשְׁתָּ
  english_pob_choice: and clothe
  chosen_korean: 그들에게 겉옷을 입히십시오
  alternatives_korean:
  - 그들에게 옷을 입히십시오
  - 그들에게 입혀 주십시오
  lexicon: HALOT
  rationale: 히브리어 사역형은 ‘입히다/옷을 입히다’가 자연스럽고, 뒤의 כֻּתֳּנֹת을 반영해 일반적 ‘옷’보다 구체적인 ‘겉옷’으로 옮겼습니다.
- source_word: כֻּתֳּנֹת
  english_pob_choice: tunics
  chosen_korean: 겉옷
  alternatives_korean:
  - 속옷
  - 튠식
  - 긴 옷
  lexicon: HALOT
  rationale: 제사장 복장 맥락에서 몸에 맞는 기본 의복을 뜻하므로, 현대 한국어에서 기능적으로 가장 가까운 ‘겉옷’으로 옮겼습니다. 본문은 린넨 여부를 말하지 않으므로 덧붙이지 않았습니다.
theological_decisions:
- issue: קדש/제의적 ‘가까이 데려옴’의 어조
  chosen_reading: ‘데려와서’로 명령을 자연스럽게 처리하되, 제의적 위임의 공식성을 유지했습니다.
  alternative_readings:
  - 가까이 오게 하십시오
  - 봉헌하도록 데려오십시오
  rationale: 문맥은 단순 이동이 아니라 성소 봉사에 세우는 절차이므로, 일상적 이동보다 제의적 순서를 드러내는 번역을 택했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve cultic nuance without overparaphrase.'
