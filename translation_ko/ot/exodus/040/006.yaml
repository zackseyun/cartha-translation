    issue: ‘증거의 장막’이라는 번역
    rationale: 본문은 ‘증거’에 해당하는 עֵדוּת를 포함하지 않습니다. 이 표현은 출애굽기의 다른 문맥에서 온 용어를 본절에 첨가합니다.
  - severity: medium
    issue: ‘너는 … 두십시오’의 높임 등급 불일치
    rationale: ‘너는’은 반말/해라체 계열의 2인칭 주어인데 ‘두십시오’는 합쇼체입니다. 주어를 생략하면 해결됩니다.
  - severity: low
    issue: 각주의 대안 문구
    rationale: 현 각주는 본문의 명칭 순서를 바꾸며, 실질적인 원문 이문이나 필요한 어휘 대안을 제시하지 않습니다.
  revised_text: 또 번제단을 성막, 곧 회막의 입구 앞에 두십시오.
