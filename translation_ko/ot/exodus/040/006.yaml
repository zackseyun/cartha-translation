  text: וְ/נָ֣תַתָּ֔ה אֵ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה לִ/פְנֵ֕י פֶּ֖תַח מִשְׁכַּ֥ן אֹֽהֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
  footnotes:
  - marker: a
    text: Or 'in front of the entrance of the tabernacle, the tent of meeting.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 번제단을 성막, 곧 회막의 입구 앞에 두십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָתַתָּה
  english_pob_choice: And you shall place
  chosen_korean: 두십시오
  alternatives_korean:
  - 놓으십시오
  - 설치하십시오
  - 두어야 합니다
  lexicon: HALOT
  rationale: 제의 기구를 지정된 위치에 옮겨 두는 문맥이므로, 자연스럽고 절차 지시적인 ‘두십시오’가 ‘place’의 위치 지정 의미를 잘 살립니다.
- source_word: מִזְבַּח הָ/עֹלָה
  english_pob_choice: the altar of burnt offering
  chosen_korean: 번제단
  alternatives_korean:
  - 번제의 제단
  - 번제 드리는 제단
  - 번제 제단
  lexicon: HALOT
  rationale: 히브리어의 고정된 제의 용어로, 한국어 성경에서 널리 쓰이는 기술적 명칭인 ‘번제단’이 가장 간결하고 정확합니다.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  english_pob_choice: the tabernacle, the tent of meeting
  chosen_korean: 증거의 장막, 곧 회막
  alternatives_korean:
  - 성막, 곧 회막
  - 장막, 곧 회막
  - 회막
  lexicon: HALOT
  rationale: מִשְׁכָּן은 제의적 거처로서 ‘장막/성막’의 뜻이 있지만, 본문이 뒤이어 고정표현 ‘오헬 모에드’를 붙여 설명하므로 한국어에서는 ‘증거의 장막, 곧 회막’으로 구조를 드러내는 편이 원문 관계를 더 분명히 살립니다.
- source_word: פֶּתַח
  english_pob_choice: the entrance
  chosen_korean: 입구
  alternatives_korean:
  - 문
  - 문간
  - 들어가는 곳
  lexicon: HALOT
  rationale: פֶּתַח은 출입구를 뜻하므로, 현대 한국어에서 가장 직접적인 ‘입구’가 위치 관계를 정확히 전달합니다.
theological_decisions:
- issue: 회막/성막의 명칭을 한국어에서 어떻게 처리할지
  chosen_reading: ‘증거의 장막, 곧 회막’으로 옮겨, 원문의 제의적 공간 표지와 고정 명칭을 함께 보이게 했습니다.
  alternative_readings:
  - 성막
  - 회막
  - 증거막
  rationale: 원문은 ‘미쉬칸’과 ‘오헬 모에드’를 나란히 두어 같은 성소를 서로 다른 관점에서 지칭하므로, 하나로 평평하게 만들기보다 병렬 관계를 살리는 번역이 문맥에 더 충실합니다.
  doctrine_reference: 출애굽기 성막 규정의 용어 일관성과 제의 공간 표지
