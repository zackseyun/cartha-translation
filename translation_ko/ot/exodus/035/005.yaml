  text: 너희 가운데서 야훼께 드릴 헌물을 가져오십시오. 마음이 기꺼운 사람은 누구나 야훼의 헌물[a], 곧 금과 은과 청동을 가져오십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께 드리는 헌납물’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마음이 기꺼운 사람’은 히브리어 관용구로, 자원하여 드리려는 내적 태도를 가리킵니다.
    reason: lexical_alternative
