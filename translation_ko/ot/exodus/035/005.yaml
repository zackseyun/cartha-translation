revisions:
- from: 너희 가운데서 야훼께 드릴 헌물을 가져오십시오. 마음이 자원하는 사람은 누구나 그것을 가져오되—야훼의 헌물, 곧 금과 은과 놋입니다.[a][b]
  to: 너희 가운데서 야훼께 드릴 헌물을 가져오십시오. 마음이 기꺼운 사람은 누구나 야훼의 헌물[a], 곧 금과 은과 청동을 가져오십시오.[b]
  rationale: 부자연스러운 ‘가져오되—…입니다’ 구조를 두 번째 명령문으로 고쳐 히브리어의 자발적 헌납 요구와 헌물 목록의 동격 관계를 분명히 했습니다. 또한 각주를 실제로 주석하는 어구에 붙여 앵커를 바로잡았습니다. 각주의 표지 순서에 맞추어 주석 내용을 재배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:54:11Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 명령, 자원하는 마음의 조건, 헌물의 반복적 규정, 그리고 금·은·청동의 목록은 대체로 반영되었습니다. 다만 현 번역의 ‘가져오되—’는 뒤의 동격 목록과 문법적으로 부자연스럽고, 각주 표지가 해당 어구에 붙어 있지 않아 참조 범위가 불명확합니다.
  naturalness: ‘마음이 기꺼운 사람은 누구나’와 두 번째 명령을 독립적으로 제시하면 현대 표준 한국어 합쇼체에서 더 자연스럽고, 히브리어의 권유/명령 흐름도 분명해집니다. ‘놋’은 성경 문체에는 익숙하지만 현대 일반어로는 ‘청동’이 더 자연스럽습니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. תְּרוּמָה는 성막을 위한 자원 헌납이라는 문맥에서 ‘헌물’로 유지할 수 있습니다. נְחֹשֶׁת는 이 문맥과 영어 감사 기록의 선택에 맞춰 ‘청동’으로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘마음이 자원하는 사람은 누구나 그것을 가져오되—야훼의 헌물, 곧 …입니다’의 연결이 부자연스럽습니다.
    rationale: 히브리어는 ‘마음이 기꺼운 모든 이는 그것, 곧 야훼의 헌물을 가져올 것이다’라는 구조입니다. 한국어에서는 ‘가져오되’ 뒤에 서술 종결형 ‘입니다’를 잇는 방식보다, 헌물의 내용을 목적어로 명시하여 독립 명령문으로 옮기는 편이 자연스럽고 충실합니다.
  - severity: medium
    issue: 각주 a와 b의 표지가 문장 끝에 함께 배치되어 있습니다.
    rationale: a는 ‘마음이 자원하는 사람’에, b는 ‘야훼의 헌물’에 관한 주석이므로 각각 해당 표현 바로 뒤에 두어 각주의 범위와 대상을 명확히 해야 합니다.
  - severity: low
    issue: ‘놋’은 현대 표준어에서 다소 고어적입니다.
    rationale: 고대 금속 재료 목록의 נְחֹשֶׁת를 영어 감사 기록의 ‘bronze’ 선택에 맞추어 ‘청동’으로 하면 현대적이고 명료합니다.
  revised_text: 너희 가운데서 야훼께 드릴 헌물을 가져오십시오. 마음이 기꺼운 사람은 누구나 야훼의 헌물[a], 곧 금과 은과 청동을 가져오십시오.[b]
