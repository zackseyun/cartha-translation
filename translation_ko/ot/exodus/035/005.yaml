translation:
  language: ko
  text: 너희 가운데서 야훼께 드릴 헌물을 가져오십시오. 마음이 자원하는 사람은 누구나 그것을 가져오되—야훼의 헌물, 곧 금과 은과 놋입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음이 자원하는 사람’은 히브리어 관용구로, 내적 자원 의지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께 드리는 헌납물’로 옮길 수 있습니다.
    reason: alternative_reading
