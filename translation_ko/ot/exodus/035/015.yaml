translation:
  language: ko
  text: 곧 분향제단과 그 채들과, 관유와, 향기로운 향과, 회막의 입구를 위한 휘장을 가져오십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분향제단’은 직역적으로는 ‘향의 제단’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘향기로운 향’은 ‘향료의 향’ 또는 ‘향료를 넣은 향’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘회막의 입구를 위한’은 ‘회막 입구의’ 또는 ‘회막 입구에 있는’으로도 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  english_pob_choice: the altar of incense
  chosen_korean: 분향제단
  alternatives_korean:
  - 향단
  - 향을 피우는 제단
  lexicon: HALOT
  rationale: 성막 문맥에서 제의적으로 고정된 명칭이므로, 의미를 분명하게 드러내는 ‘분향제단’을 택했습니다. ‘향단’도 가능하지만 현대 독자가 기능을 바로 이해하기에는 덜 분명합니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles
  chosen_korean: 그 채들
  alternatives_korean:
  - 그 운반채들
  - 그 막대들
  lexicon: HALOT
  rationale: 성막 기구를 메는 लक木 채를 가리키므로, 성막 용례에 맞는 ‘채들’을 사용했습니다. ‘운반채들’은 더 풀이적이고, ‘막대들’은 제의적 맥락이 약합니다.
- source_word: קְטֹרֶת הַסַּמִּים
  english_pob_choice: the fragrant incense
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 향료의 향
  - 향품 향
  lexicon: HALOT
  rationale: 히브리어의 향료 성분을 자연스러운 한국어로 옮기기 위해 ‘향기로운 향’으로 처리했습니다. ‘향료의 향’은 어색하고, ‘향품 향’은 현대어로 부자연스럽습니다.
- source_word: מָסַךְ הַפֶּתַח לְפֶתַח הַמִּשְׁכָּן
  english_pob_choice: the screen for the entrance to the tabernacle
  chosen_korean: 회막의 입구를 위한 휘장
  alternatives_korean:
  - 회막 입구의 휘장
  - 회막의 입구 휘장
  lexicon: HALOT
  rationale: מָסָךְ은 단순한 커튼보다 입구를 가리는 휘장에 가깝기 때문에 ‘휘장’을 택했습니다. ‘회막’은 מִשְׁכָּן의 관습적 한국어 대응으로, 문맥상 성막의 입구를 가리킵니다.
theological_decisions:
- issue: 성막 기구 나열의 명령형 톤
  chosen_reading: ‘가져오십시오’로 옮겨, 목록형 명령의 직접성과 공적 지시의 톤을 살렸습니다.
  alternative_readings:
  - ‘가져오라’
  - ‘가져오시기 바랍니다’
  rationale: 본문은 제의 준비를 위한 직접 지시이므로, 현대 표준어의 공손한 명령형이 가장 자연스럽습니다. 지나치게 완곡한 표현은 명령의 기능을 약화시킵니다.
  doctrine_reference: 출애굽기 35장 성막 제작 지시
