source:
  edition: WLC
  text: וְ/אֶת מִזְבַּ֤ח הַ/קְּטֹ֨רֶת֙ וְ/אֶת בַּדָּ֔י/ו וְ/אֵת֙ שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/אֵ֖ת קְטֹ֣רֶת הַ/סַּמִּ֑ים וְ/אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לְ/פֶ֥תַח הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/015.yaml
  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
  footnotes:
  - marker: a
    text: Or 'the incense altar.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the incense of spices' or 'the spiced incense.'
    reason: lexical_alternative
  - marker: c
