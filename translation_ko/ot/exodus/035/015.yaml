  source_fidelity: 수정이 필요합니다. 이 절의 목적어들은 출애굽기 35:10의 ‘만드십시오’에 이어지는 제작 목록입니다. 초안의 ‘가져오십시오’는 앞선 헌물 명령과 혼동하여 지배 동사를 바꾸므로, 히브리어 문맥의 기능을 보존하지 못합니다. מָסָךְ는 입구를 가리는 휘장으로, ‘회막 입구의 휘장’이 자연스럽고 충실합니다.
  naturalness: ‘회막의 입구를 위한 휘장’은 문법상 가능하나 현대 한국어에서는 다소 직역투입니다. 또한 쉼표 뒤에 접속 조사를 반복한 ‘그 채들과, 관유와’보다 한국어 열거 방식으로 간결하게 연결하는 편이 자연스럽습니다.
  terminology: ‘분향 제단’, ‘채’, ‘관유’, ‘회막’, ‘휘장’은 성막 문맥에 적절합니다. קְטֹרֶת הַסַּמִּים은 단순히 향기가 난다는 뜻뿐 아니라 향료 성분을 포함하므로 ‘향료로 만든 향’으로 옮겨 그 의미를 더 분명히 했습니다.
  issues:
