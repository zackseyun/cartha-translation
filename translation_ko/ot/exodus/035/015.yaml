  chosen_reading: ‘가져오십시오’로 옮겨, 목록형 명령의 직접성과 공적 지시의 톤을 살렸습니다.
  alternative_readings:
  - ‘가져오라’
  - ‘가져오시기 바랍니다’
  rationale: 본문은 제의 준비를 위한 직접 지시이므로, 현대 표준어의 공손한 명령형이 가장 자연스럽습니다. 지나치게 완곡한 표현은 명령의 기능을 약화시킵니다.
  doctrine_reference: 출애굽기 35장 성막 제작 지시
