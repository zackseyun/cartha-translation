source:
  edition: WLC
  text: אֶת בִּגְדֵ֥י הַ/שְּׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
  footnotes:
  - marker: a
    text: Or 'the garments of service'; the Hebrew term may denote specially woven service garments.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the holy place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 성소에서[b] 섬기기 위한 정교하게 짠 의복들[a], 제사장 아론을 위한 거룩한 의복들, 그리고 그의 아들들이 제사장으로 섬기기 위한 의복들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉사용 의복들’입니다. 히브리어 표현은 특별히 짜 만든 봉사용 의복들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거룩한 곳에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  english_pob_choice: the finely woven garments
  chosen_korean: 봉사하기 위한 정교하게 짠 옷들
  alternatives_korean:
  - 섬기는 옷들
  - 정교하게 짠 봉사복
  lexicon: HALOT
  rationale: הַשְּׂרָד는 성막 문맥에서 특별히 제작된 직물/의복을 가리키므로, 직역적이면서도 기능을 드러내는 ‘정교하게 짠’으로 옮기고, לְשָׁרֵת의 성소 봉사 기능을 살려 ‘봉사하기 위한’을 붙였습니다.
- source_word: בַּקֹּדֶשׁ
  english_pob_choice: in the sanctuary
  chosen_korean: 봉사하기 위한 정교하게 짠 옷들
  alternatives_korean:
  - 성소에서
  - 거룩한 곳에서
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘거룩함’보다 성막의 거룩한 구역을 뜻하므로, 본문에서는 의미를 풀어 ‘봉사하기 위한’과 연결해 자연스럽게 성소 기능을 드러냈습니다.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  english_pob_choice: the holy garments
  chosen_korean: 아론 제사장을 위한 거룩한 옷들
  alternatives_korean:
  - 아론을 위한 성스러운 옷들
  - 아론 제사장의 거룩한 의복
  lexicon: HALOT
  rationale: 문자적으로는 ‘거룩함의 옷들’이지만, 한국어에서는 제의적 의미를 유지하면서도 문맥의 수혜 대상을 분명히 하도록 ‘아론 제사장을 위한 거룩한 옷들’로 옮겼습니다.
- source_word: לְכַהֵן
  english_pob_choice: for serving as priests
  chosen_korean: 제사장 직무를 수행할 때 입을 옷들
  alternatives_korean:
  - 제사장으로 섬기기 위한 옷들
  - 제사장으로 봉사할 옷들
  lexicon: HALOT
  rationale: כהן의 동사형은 단순히 ‘섬기다’보다 제사장 기능 수행을 뜻하므로, 직무성을 분명히 하는 ‘제사장 직무를 수행할 때’로 풀어 옮겼습니다.
theological_decisions:
- issue: 첫 번째 의복과 뒤의 거룩한 의복의 구분
  chosen_reading: 첫 구는 성소에서의 봉사를 위한 특수 제작 의복으로, 뒤의 구는 아론과 그의 아들들에게 속한 거룩한 제사장 옷으로 구분해 번역했습니다.
  alternative_readings:
  - 두 표현을 거의 동의적 병렬로 보고 한 벌의 제의복을 반복 설명하는 것으로 처리할 수 있습니다.
  rationale: 히브리어 본문은 반복된 목적격 표지와 병렬 구조를 통해 항목을 나누어 제시하므로, 구분을 유지하는 편이 원문 구조를 더 잘 드러냅니다.
  doctrine_reference: 출애굽기 35장 성막 준비 문맥
