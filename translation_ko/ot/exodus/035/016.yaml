  - 그 봉들
  lexicon: HALOT
  rationale: 성막 기구 운반에 쓰이는 막대를 가리키므로, 고정된 성경어법인 ‘채들’을 유지하되 대상의 복수를 살렸습니다.
- source_word: הַכִּיֹּר וְאֶת כַּנּוֹ
  english_pob_choice: the basin and its stand
  chosen_korean: 물두멍, 그리고 그 받침
  alternatives_korean:
  - 세숫대야와 그 받침
  - 물두멍과 그 받침대
  lexicon: HALOT
  rationale: הַכִּיֹּר는 성막의 씻는 그릇으로, 전통적이지만 널리 통용되는 ‘물두멍’을 살리고 כַּנּוֹ는 지지대를 뜻하므로 ‘받침’으로 옮겼습니다.
