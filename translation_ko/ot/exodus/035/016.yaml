  - 놋 철망
  lexicon: HALOT
  rationale: מִכְבַּר은 제단에 붙은 금속 그물 모양의 구조물을 가리키므로, 한국어 성경에서 이해하기 쉬운 ‘놋 그물’로 옮겼습니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles
  chosen_korean: 그 채들
