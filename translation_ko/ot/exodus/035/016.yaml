  lexicon: HALOT
  rationale: 히브리어가 특정한 제단 명칭을 가리키므로, 기능을 드러내는 ‘불제단’을 사용해 제단의 성격을 분명히 했습니다.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
