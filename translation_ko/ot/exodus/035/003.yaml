review_pass:
  verdict: revise
  source_fidelity: 히브리어의 직접적인 복수 금지 명령, ‘불을 피우다’, 거처 전체에 미치는 분배적 범위, 안식일의 시간 한정이 모두 잘 반영되어 있습니다. 다만 ‘모든 거처에서’보다 ‘어느 거처에서도’가 בְּכֹל의 금지문 내 분배적·포괄적 범위를 한국어로 더 자연스럽고 분명하게 나타냅니다.
  naturalness: ‘당신들은’은 현대 표준 한국어에서 복수 청자에게 쓰기 부자연스럽거나 대립적인 뉘앙스를 낼 수 있으며, 바로 뒤의 ‘너희의’와도 호응하지 않습니다. 합쇼체 공적 문체에는 ‘여러분’이 적절합니다. ‘어느 거처에서도’는 부정 명령과 자연스럽게 결합됩니다.
  terminology: ‘안식일’, ‘거처’, ‘불을 피우다’는 원문의 의미와 성경적 문맥에 적합합니다. ‘거처’는 집에 한정하지 않는 מֹשְׁבֹתֵיכֶם의 범위를 보존합니다.
  issues:
  - severity: medium
    issue: 청자 지시어가 ‘당신들은’과 ‘너희의’로 혼용되어 있으며, ‘당신들’의 용법이 부자연스럽습니다.
    rationale: 원문은 일관된 2인칭 복수입니다. 현대 공적 합쇼체에서는 ‘여러분’으로 통일하는 것이 자연스럽고 존중의 문체에도 맞습니다.
  - severity: low
    issue: ‘모든 거처에서’는 문법적으로 가능하나 부정 명령의 분배적 범위가 다소 덜 직접적입니다.
    rationale: ‘여러분의 어느 거처에서도’는 ‘어떤 거처에서도 불을 피우지 말라’는 בְּכֹל의 포괄적 적용을 자연스러운 한국어로 드러냅니다.
  revised_text: 안식일에는 여러분의 어느 거처에서도 불을 피우지 마십시오.
