source:
  edition: WLC
  text: לֹא תְבַעֲר֣וּ אֵ֔שׁ בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶ֑ם בְּ/י֖וֹם הַ/שַּׁבָּֽת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/003.yaml
  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: ko
  text: 당신들은 안식일에 너희의 모든 거처에서 불을 피우지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  english_pob_choice: kindle
  chosen_korean: 피우지 마십시오
  alternatives_korean:
  - 지피지 마십시오
  - 붙이지 마십시오
  - 일으키지 마십시오
  lexicon: HALOT
  rationale: בּער의 피엘형이 가리키는 ‘불을 붙여 일으키다’는 뜻을 한국어에서 가장 자연스럽게 ‘불을 피우다’로 옮겼습니다. ‘지피다’도 가능하지만 현대 공적 문체에서는 ‘피우다’가 더 매끄럽습니다.
- source_word: אֵשׁ
  english_pob_choice: a fire
  chosen_korean: 불
  alternatives_korean:
  - 한 불
  - 불길
  lexicon: HALOT
  rationale: 히브리어 단수 명사는 여기서 특정한 불의 발생을 가리키므로, 한국어에서는 관용적으로 ‘불’로 옮기되 불필요한 관사를 더하지 않았습니다.
- source_word: מֹשְׁבֹתֵיכֶם
  english_pob_choice: your dwellings
  chosen_korean: 너희의 모든 거처
  alternatives_korean:
  - 너희의 집들
  - 너희의 거주지들
  - 너희의 거처들
  lexicon: HALOT
  rationale: מוֹשָׁב은 단순한 집보다 ‘거처/거주하는 곳’의 범위가 넓어, 공동체 전체의 거주 공간을 포괄하는 ‘거처’가 더 정확합니다. ‘모든’은 בְּכֹל의 분배적 의미를 살립니다.
- source_word: בְּיוֹם הַשַּׁבָּת
  english_pob_choice: on the Sabbath day
  chosen_korean: 안식일에
  alternatives_korean:
  - 안식일 날에
  - 안식일 동안에
  lexicon: HALOT
  rationale: 직역하면 ‘안식일 날에’이지만 한국어 성경 문체에서는 단순히 ‘안식일에’가 가장 자연스럽고, 원문의 시간적 범위를 충분히 전달합니다.
theological_decisions:
- issue: 불 금지의 범위
  chosen_reading: 본문이 직접 말하는 대로 ‘불을 피우지 말라’는 명령으로 옮기고, 그 이상의 후대 해석은 본문에 넣지 않았습니다.
  alternative_readings:
  - 불 사용 전체를 금하는 것으로 확대하기
  - 해석적 설명을 덧붙이기
  rationale: 히브리어는 안식일에 거처 안에서 불을 ‘피우는 것’을 금지합니다. 번역은 본문이 명시한 금지를 그대로 드러내고, 범위를 넓혀 단정하지 않는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
