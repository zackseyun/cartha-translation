base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/033.yaml
  text: in the cutting of stones for setting[a], and in the carving of wood, to do every kind of skillful work.
  footnotes:
  - marker: a
    text: Or 'every kind of designed work' or 'every kind of artistic work.' The Hebrew term carries the idea of work done with planning, design, or skill.
    reason: lexical_alternative
translation:
  language: ko
  text: 돌을 홈에 맞춰 깎는 일과 나무를 새기는 일, 곧 모든 종류의 정교한 일을 하게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 종류의 설계된 일’, ‘모든 종류의 예술적 일’로도 옮길 수 있습니다. 히브리어는 계획, 설계, 숙련을 담은 일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת אֶבֶן לְמַלֹּאת
  english_pob_choice: in the cutting of stones for setting
  chosen_korean: 돌을 홈에 맞춰 깎는 일
  alternatives_korean:
  - 돌을 깎아 끼우는 일
  - 석재를 다듬는 일
  - 돌을 세팅하는 일
  lexicon: HALOT
  rationale: חֲרֹשֶׁת는 단순한 ‘작업’보다 숙련된 가공을 가리키므로, 돌과 결합된 맥락에서는 ‘홈에 맞춰 깎는 일’로 옮겨 장식석을 끼우기 위한 정교한 가공이라는 의미를 살렸습니다.
- source_word: וּבַחֲרֹשֶׁת עֵץ
  english_pob_choice: and in the carving of wood
  chosen_korean: 나무를 새기는 일
  alternatives_korean:
  - 목재를 조각하는 일
  - 나무를 깎는 일
  - 목공하는 일
  lexicon: HALOT
  rationale: 같은 חֲרֹשֶׁת이지만 대상이 나무이므로 ‘새기는 일’로 달리하여, 재료에 따른 숙련 공예의 뉘앙스를 자연스럽게 드러냈습니다.
- source_word: לַעֲשׂוֹת בְּכָל מְלֶאכֶת מַחֲשָׁבֶת
  english_pob_choice: to do every kind of skillful work
  chosen_korean: 곧 모든 종류의 정교한 일
  alternatives_korean:
  - 모든 종류의 기교 있는 일
  - 모든 종류의 설계된 일
  - 모든 종류의 예술적 일
  lexicon: HALOT
  rationale: מַחֲשָׁבֶת은 ‘계획된/고안된/예술적인’ 일을 뜻할 수 있지만, 여기서는 장인의 숙련을 자연스럽게 나타내는 ‘정교한’이 가장 균형 잡힌 표현입니다.
