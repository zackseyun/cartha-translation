translation:
  language: ko
  text: 그리고 붉게 물들인 숫양 가죽과 타하스 가죽[a]과 아카시아 목재입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘타하스’(תְּחָשִׁים)가 가리키는 가죽의 정확한 종류는 확실하지 않습니다. 염소가죽, 돌고래나 듀공 같은 해양 동물의 가죽 등으로도 옮겨집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  english_pob_choice: rams’ skins dyed red
  chosen_korean: 붉게 물들인 숫양의 가죽
  alternatives_korean:
  - 붉게 염색한 숫양 가죽
  - 붉게 된 숫양의 가죽
  lexicon: HALOT
  rationale: אֵילִם은 복수형 숫양이고, מְאָדָּמִים은 붉게 된/물든 상태를 나타내므로, 재료 목록의 자연스러운 한국어로 ‘붉게 물들인 숫양의 가죽’이라고 옮겼습니다.
- source_word: עֹרֹת תְּחָשִׁים
  english_pob_choice: hides of sea cows
  chosen_korean: 해우 가죽
  alternatives_korean:
  - 고래가죽
  - 바다소 가죽
  - 두공 가죽
  - 정체 불명의 고급 가죽
  lexicon: HALOT
  rationale: תְּחָשִׁים은 어휘적으로 불확실하므로 한 동물을 단정하지 않으면서도, POB의 문제 의식을 반영해 ‘해우 가죽’으로 옮겨 본문의 재료성만 드러냈습니다.
- source_word: וַעֲצֵי שִׂטִּים
  english_pob_choice: acacia wood
  chosen_korean: 아카시아 나무
  alternatives_korean:
  - 시팀 나무
  - 아카시아 목재
  lexicon: HALOT
  rationale: שִׂטִּים은 아카시아를 가리키므로, 현대 한국어에서 바로 이해되는 ‘아카시아 나무’를 택했습니다.
theological_decisions:
- issue: 재료 목록의 번역이 불확실한 동물명에 지나치게 확정적 의미를 부여할 위험
  chosen_reading: ‘해우 가죽’으로 옮기되, 본문은 재료의 종류를 제시할 뿐 정확한 동물 식별을 단정하지 않도록 했습니다.
  alternative_readings:
  - ‘고급 가죽’처럼 비특정적으로 처리
  - ‘바다소 가죽’으로 보다 직역
  rationale: 출처 본문은 성막 재료 목록이며, תְּחָשִׁים의 의미가 확정되지 않았다는 POB 주석을 따라, 의미를 과도하게 좁히지 않으면서도 재료성을 유지했습니다.
  doctrine_reference: 출 35:7 문맥상 성막 재료의 성격과 어휘 불확실성의 보존
