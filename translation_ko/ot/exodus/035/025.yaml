  rationale: 양모나 섬유를 실로 만드는 행위를 한국어 동사 ‘잣다’로 옮겨, 직조 이전의 작업이라는 점을 살렸습니다.
- source_word: מַטְוֶה
  english_pob_choice: what they had spun
  chosen_korean: 자신이 잔 것
