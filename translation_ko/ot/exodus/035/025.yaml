  rationale: 도구적 의미를 자연스럽게 살리면서 수공예적 작업을 분명히 하기 위해 ‘자기 손으로’로 옮겼습니다.
- source_word: טָוּוּ
  english_pob_choice: spun
  chosen_korean: 실을 잣고
