  - 잣아 낸 것
  - 실은 것
  lexicon: HALOT
  rationale: 직전 동사의 결과물을 가리키므로 ‘자신이 잔 것’으로 간결하게 옮겼습니다.
- source_word: תְּכֵלֶת / אַרְגָּמָן / תּוֹלַעַת הַשָּׁנִי / שֵׁשׁ
  english_pob_choice: the blue / the purple / the scarlet yarn / the fine linen
  chosen_korean: 파란 실과 자주색 실과 붉은 실과 가는 삼베
  alternatives_korean:
  - 청색 실과 자색 실과 홍색 실과 가는 베
  - 푸른 실과 자주색 실과 붉은 실과 고운 베
  - 파란 것과 자주색 것과 붉은 것과 가는 삼베
  lexicon: HALOT
  rationale: 성막 재료 목록의 직물·실 감각을 살리면서 현대 한국어에서 이해되도록 색채 형용사에 ‘실’을 붙였고, שֵׁשׁ은 문맥상 ‘가는 삼베’로 옮겼습니다.
theological_decisions:
- issue: ‘wise of heart’ idiom and practical skill
  chosen_reading: 내적 지혜와 실제 기술을 함께 지닌 사람으로 이해하고 번역했습니다.
  alternative_readings:
  - 단순히 ‘숙련된’으로만 옮기는 방식
  - 지혜를 인격적 신앙 성숙으로만 좁히는 방식
  rationale: 문맥이 성막 제작을 위한 손기술을 말하지만, 히브리어는 그 기술을 마음의 지혜와 연결합니다. 따라서 기술만이 아니라 내적 지혜의 결합을 드러냈습니다.
  doctrine_reference: 성막 준비 본문에서 지혜는 창조적 기술과 결합되어 나타납니다.
