  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
  footnotes:
  - marker: a
    text: Hebrew 'wise of heart,' an idiom for practical skill grounded in inner wisdom.
    reason: lexical_alternative
  - marker: b
    text: Or 'the blue, the purple, the scarlet, and the fine linen'; the Hebrew lists the materials after 'what they had spun.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 마음이 지혜로운 모든 여인은 자기 손으로 실을 잣고[a], 자신이 잔 것을 가져왔습니다. 곧 파란 실과 자주색 실과 붉은 실[b]과 가는 삼베입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘마음이 지혜로운’은 내적 지혜에 뿌리를 둔 실제 기술을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘파란, 자주색, 붉은’ 뒤에는 히브리어가 재료 목록을 이어 붙이고 있으므로, ‘실’은 문맥상 보충된 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  english_pob_choice: wise of heart
  chosen_korean: 마음이 지혜로운
  alternatives_korean:
