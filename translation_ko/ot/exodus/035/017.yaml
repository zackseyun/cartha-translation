translation:
  language: ko
  text: 뜰의 휘장과 그 기둥과 그 받침, 그리고 뜰 문을 가리는 휘장입니다—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַלְעֵי
  english_pob_choice: hangings
  chosen_korean: 휘장
  alternatives_korean:
  - 천막
  - 커튼
  - 드리개
  lexicon: HALOT
  rationale: 뜰을 둘러 형성하는 직물 패널이라는 점을 살리면서, 성막 문맥에서 통용되는 표현인 ‘휘장’이 가장 자연스럽습니다.
- source_word: הֶחָצֵר
  english_pob_choice: court
  chosen_korean: 뜰
  alternatives_korean:
  - 마당
  - 뜰마당
  lexicon: HALOT
  rationale: 성막 바깥의 둘러진 구역을 가리키므로, 성막 용례에 맞는 ‘뜰’이 ‘마당’보다 더 정확합니다.
- source_word: אֲדָנֶיהָ
  english_pob_choice: its bases
  chosen_korean: 받침들
  alternatives_korean:
  - 소켓들
  - 기초들
  - 기단들
  lexicon: HALOT
  rationale: 기둥을 떠받치는 구조를 한국어로는 ‘받침’이 가장 분명하게 드러내며, 지나치게 기술적인 ‘소켓’보다 읽기 쉽습니다.
- source_word: מָסַךְ שַׁעַר
  english_pob_choice: the screen for the gate
  chosen_korean: 뜰 문을 위한 차폐 휘장
  alternatives_korean:
  - 뜰 문을 위한 휘장
  - 뜰 문을 가리는 휘장
  - 뜰 문의 장막
  lexicon: HALOT
  rationale: מָסַךְ의 차폐 기능을 드러내기 위해 ‘차폐 휘장’으로 옮기고, שַׁעַר는 성막의 출입구를 가리키므로 ‘뜰 문’으로 표현했습니다.
