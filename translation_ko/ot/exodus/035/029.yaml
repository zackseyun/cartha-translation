  - 여호와
  rationale: 본문의 יְהוָה를 고유명사로 보존하기 위해 ‘야훼’를 사용했습니다. 이는 단순한 호칭이 아니라 언약적 이름이라는 점을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
