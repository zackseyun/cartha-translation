language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל אִ֣ישׁ וְ/אִשָּׁ֗ה אֲשֶׁ֨ר נָדַ֣ב לִבָּ/ם֮ אֹתָ/ם֒ לְ/הָבִיא֙ לְ/כָל הַ/מְּלָאכָ֔ה אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה לַ/עֲשׂ֖וֹת בְּ/יַד מֹשֶׁ֑ה הֵבִ֧יאוּ בְנֵי יִשְׂרָאֵ֛ל נְדָבָ֖ה לַ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
  footnotes:
  - marker: a
    text: Or 'whose heart impelled them' or 'whose heart made them willing.' The Hebrew idiom expresses inward willingness or prompting.
    reason: lexical_alternative
  - marker: b
    text: Literally 'by the hand of Moses,' an idiom meaning 'through Moses' or 'by Moses as mediator.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the Israelites brought.' Literally 'the children of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 남자와 여자 모두, 곧 마음이 그들을 움직여 모든 일에 필요한 것을 가져오기로 자원한 이들은, 야훼께서 모세를 통해 하라고 명하신 모든 일을 위해 이스라엘 자손이 야훼께 자원 제물을 가져왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음이 그들을 재촉한 이들’ 또는 ‘마음이 그들을 기꺼이 하게 한 이들’입니다. 히브리어 관용구는 내적인 자발성이나 동기를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모세의 손으로’이지만, 여기서는 ‘모세를 통해’라는 뜻의 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이스라엘 사람들이 가져왔습니다.’ 직역하면 ‘이스라엘 자손’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  english_pob_choice: Every man and woman
  chosen_korean: 남자와 여자 모두
  alternatives_korean:
  - 모든 남자와 여자
  - 남자든 여자든
  lexicon: HALOT
  rationale: 남성과 여성을 모두 명시하는 분배적 표현을 한국어에서 자연스럽게 살리기 위해 ‘남자와 여자 모두’로 옮겼습니다.
- source_word: נָדַב לִבָּם אֹתָם
  english_pob_choice: whose heart moved them
  chosen_korean: 마음이 그들을 움직여 ... 자원한 이들은
  alternatives_korean:
  - 마음이 그들을 재촉한 이들은
  - 마음이 그들을 기꺼이 하게 한 이들은
  lexicon: HALOT
  rationale: ‘마음’이 내적인 자발성과 결심의 원천이라는 관용구를 살리되, 한국어에서는 ‘움직이다’와 ‘자원하다’를 함께 써서 자발적 동기를 분명히 했습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: through Moses
  chosen_korean: 모세를 통해
  alternatives_korean:
  - 모세의 손을 통해
  - 모세의 손으로
  lexicon: HALOT
  rationale: ‘손’은 대리·매개를 뜻하는 관용구이므로, 현대 한국어에서 가장 분명한 ‘모세를 통해’로 옮겼습니다.
- source_word: נְדָבָה
  english_pob_choice: a freewill offering
  chosen_korean: 자원 제물
  alternatives_korean:
  - 자원 예물
  - 자발적 헌물
  lexicon: HALOT
  rationale: 문맥이 성막 공사를 위한 자발적 헌납이므로, ‘freewill offering’의 의미를 유지하면서도 문맥상 제의적 헌납임을 드러내는 ‘자원 제물’을 선택했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 옮길지
  chosen_reading: 야훼
  alternative_readings:
