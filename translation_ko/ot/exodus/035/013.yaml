translation:
  language: ko
  text: 그 상과 그 채와 그 모든 기구와 진설병을 드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진설병’은 문자적으로는 ‘임재의 빵’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  english_pob_choice: the table
  chosen_korean: 그 상
  alternatives_korean:
  - 그 식탁
  - 그 제의용 상
  lexicon: HALOT
  rationale: 성막 문맥의 культ적 가구를 가리키므로, 기능을 덧붙이지 않고 간결한 ‘상’으로 옮겨 원문의 일반 명사성을 유지했습니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles
  chosen_korean: 그 채
  alternatives_korean:
  - 그 운반채
  - 그 막대
  lexicon: HALOT
  rationale: 성막 기구를 옮길 때 쓰는 막대라는 점을 반영해 전통적이지만 본문에 맞는 ‘채’를 사용했습니다.
- source_word: כָּל כֵּלָיו
  english_pob_choice: all its utensils
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 도구
  - 그 모든 집기
  lexicon: HALOT
  rationale: כְּלִי의 넓은 의미를 살려 제의용 물품 전체를 포괄하는 ‘기구’로 옮겼습니다.
- source_word: לֶחֶם הַפָּנִים
  english_pob_choice: the bread of the Presence
  chosen_korean: 진설병
  alternatives_korean:
  - 임재의 빵
  - 그 앞에 놓인 빵
  lexicon: HALOT
  rationale: 한국 교회 언어에서 굳어진 제의 용어를 사용하되, 원문의 관용구가 가리키는 성막의 떡이라는 점을 보존했습니다.
theological_decisions:
- issue: 명령문의 한국어 높임과 직접화법 처리
  chosen_reading: 본문의 열거형 명령을 공손한 명령형 ‘드리십시오’로 옮겼습니다.
  alternative_readings:
  - 드십시오
  - 바치십시오
  rationale: 출애굽기 35장의 제작 지시를 현대 한국어 합쇼체로 자연스럽게 전달하면서도, 강한 지시성을 유지하기 위해 ‘드리십시오’를 선택했습니다.
  doctrine_reference: 문체/화용 결정
