  source_fidelity: 히브리어는 앞 절의 동사에 이어지는 목적어 열거이며, 이 절 자체에는 ‘드리다’에 해당하는 동사가 없습니다. 따라서 ‘드리십시오’는 원문에 없는 봉헌 행위를 명시하여 범위를 좁힙니다. 상, 그 채, 모든 기구, 그리고 לֶחֶם הַפָּנִים의 네 항목은 유지해야 합니다.
  naturalness: 한국어에서도 성경의 절 구분 안에서 앞 문장에 이어지는 열거를 그대로 둘 수 있습니다. ‘그 상과 그 채와 그 모든 기구와’는 각 소유 접미사의 관계를 자연스럽게 나타냅니다. 각주 표지는 해당 어휘 바로 뒤에 두는 것이 자연스럽고 명확합니다.
  terminology: ‘상’, ‘채’, ‘기구’는 각각 שולחן, בדיו, כל כליו에 충실합니다. ‘진설병’은 한국어 성경 전통에서 널리 통용되는 용어이며, 각주에서 ‘임재의 빵’이라는 직역적 대안을 제시하면 히브리어 관용구의 뜻을 충분히 드러낼 수 있습니다.
