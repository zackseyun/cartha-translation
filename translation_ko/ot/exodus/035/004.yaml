translation:
  language: ko
  text: 그러자 모세가 이스라엘 자손[b]의 온 회중[a]에게 말했습니다. “이것은 야훼께서 이렇게 명령하신 말씀[c]입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 히브리어 עֵדָה를 옮긴 말로, 이스라엘의 모인 공동체를 뜻합니다. ‘모임’ 또는 ‘집회’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다. ‘이스라엘 자손’은 이에 대한 관용적 한국어 성경 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 דָּבָר는 ‘말씀’, ‘말’, ‘일’ 또는 ‘것’을 뜻할 수 있습니다. 여기서는 뒤따르는 명령을 소개합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
