id: EXO.35.4
reference: Exodus 35:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
  footnotes:
  - marker: a
    text: Or “assembly” for “congregation.”
    reason: lexical_alternative
  - marker: b
    text: Or “the Israelites” or the traditional “the children of Israel.”
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew “This is the word”; also possible: “This is the thing” or more idiomatically “This is what.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모세가 이스라엘 자손의 온 회중에게 말했습니다. “이것은 야훼께서 명령하신 말씀입니다. ‘말하기를’”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 본문의 공동체적 집합을 반영합니다. ‘모임’이나 ‘집회’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘이스라엘 자손’은 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘דָּבָר’는 ‘말씀’, ‘말’, ‘일’, ‘사건’ 등으로 넓게 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 진행을 한국어의 자연스러운 순차 표현으로 살리되, 현대 공용 문체에 맞게 ‘그러자’로 옮겼습니다.
- source_word: כָּל עֲדַת
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 온 집회
  lexicon: HALOT
  rationale: ‘עֲדַת’의 집합적·공동체적 의미를 살리면서, ‘온’이 ‘all’을 간결하게 반영하도록 했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 문법적으로 남성 복수인 מקור 표현을 보존하면서도, 한국어 성경 문맥에서 가장 직접적으로 대응하는 ‘이스라엘 자손’을 택했습니다.
- source_word: זֶה הַדָּבָר
  english_pob_choice: This is the word
  chosen_korean: 이것은 ... 말씀입니다
  alternatives_korean:
  - 이것이 ... 말씀입니다
  - 이것은 ... 일입니다
  - 이것은 ... 것입니다
  lexicon: HALOT
  rationale: 문맥상 뒤따르는 명령문을 소개하는 공식 표현이므로, ‘word’를 직역한 ‘말씀’으로 옮겨 하나님의 명령 발화라는 성격을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 계약 이름인 יהוה를 직역 대체어가 아니라 음역인 ‘야훼’로 옮겨, 고유 이름성을 보존했습니다.
theological_decisions:
- issue: ‘This is the word’의 한국어 어휘 선택
  chosen_reading: ‘말씀’으로 옮겨, 단순한 사물·사건보다 야훼의 명령 발화 자체를 드러냈습니다.
  alternative_readings:
  - ‘이것은 ... 일입니다’
  - ‘이것은 ... 것입니다’
  rationale: 히브리어 דָּבָר는 ‘말씀/말/일/사건’의 범위를 가지지만, 여기서는 곧바로 명령의 인용을 여는 공식 도입이므로 ‘말씀’이 가장 소스 충실적이며 신학적 무게도 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: source-form transparency and covenant-name preservation'
