reference: Exodus 35:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
  footnotes:
  - marker: a
    text: Or 'an offering of silver and bronze.' The Hebrew conjunction can be rendered either way in English, though the sense is that each person brought whatever metal contribution he or she had.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'with whom acacia wood was found,' an idiom meaning 'who had acacia wood available.'
    reason: lexical_alternative
translation:
  language: ko
  text: 은이나 놋을 예물로 드리는 사람은 모두 야훼의 예물을 가져왔습니다. 또 봉사의 모든 일을 위해 쓸 아카시아 나무를 가진 사람은 모두 그것을 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘그와 함께 아카시아 나무가 발견된’이라는 뜻이며, 여기서는 ‘아카시아 나무를 가진/마련한’이라는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  english_pob_choice: Everyone who offered
  chosen_korean: 예물을 드리는 모든 사람
  alternatives_korean:
  - 드리는 모든 사람
  - 예물을 바치는 모든 사람
  lexicon: HALOT
  rationale: רוּם의 분사구는 여기서 단순히 ‘들어 올리는’ 동작이 아니라 자발적으로 예물을 내는 행위를 가리키므로, 자연스러운 한국어로 ‘예물을 드리다’로 옮겼습니다.
- source_word: תְּר֤וּמַת כֶּ֨סֶף֙ וּנְחֹשֶׁת
  english_pob_choice: a contribution of silver or bronze
  chosen_korean: 은이나 놋을 예물로
  alternatives_korean:
  - 은과 놋을 예물로
  - 은 또는 놋의 예물을
  lexicon: HALOT
  rationale: 히브리어의 תרומה는 거룩한 용도의 ‘예물/봉헌물’이고, כֶּסֶף와 נְחֹשֶׁת는 분배적으로 각 사람이 가진 금속을 가리키므로 ‘은이나 놋’으로 옮겼습니다.
- source_word: תְּרוּמַת יְהוָה
  english_pob_choice: Yahweh’s contribution
  chosen_korean: 야훼의 예물
  alternatives_korean:
  - 야훼께 드리는 예물
  - 야훼의 봉헌물
  lexicon: HALOT
  rationale: 구문상 ‘여호와께 속한/그분께 드려진 예물’이라는 소유·귀속 관계를 담고 있으므로, 직역성을 살려 ‘야훼의 예물’로 옮겼습니다.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  english_pob_choice: everyone with whom acacia wood was found
  chosen_korean: 어떤 일에 쓰일 아카시아 나무가 자기에게 있는 모든 사람
  alternatives_korean:
  - 아카시아 나무를 가진 모든 사람
  - 아카시아 나무를 가지고 있던 모든 사람
  lexicon: HALOT
  rationale: ‘그에게서 발견되다’는 히브리 관용구를 소유·준비 상태로 풀어, 문맥에 맞게 ‘자기에게 있는’으로 옮겼습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: acacia wood
  chosen_korean: 아카시아 나무
  alternatives_korean:
  - 시팀 나무
  - 아카시아 목재
  lexicon: HALOT
  rationale: 성막 재료로서의 표준 한국어 표현을 따라 ‘아카시아 나무’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 고유 신명 ‘יהוה’를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 구절은 히브리어 원문에 직접 신명 יהוה를 사용하므로, 프로젝트 기본 원칙에 따라 언약적 신명성을 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
