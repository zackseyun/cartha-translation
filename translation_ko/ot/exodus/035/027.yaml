  yaml_path: translation/ot/exodus/035/027.yaml
  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
  footnotes:
  - marker: a
    text: Or possibly 'the shoham stones'; the exact identification of this gemstone is uncertain, though 'onyx' is the traditional rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'breastplate.' The Hebrew refers to the priestly ornament worn on the chest, not body armor.
    reason: lexical_alternative
translation:
  language: ko
  text: 지도자들은 에봇과 흉패[b]에 쓸 호마노들[a]과 물릴 보석들을 가져왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쇼함 돌들’로 볼 수 있습니다. 이 보석의 정확한 식별은 확실하지 않지만, 전통적으로는 ‘호마노’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가슴패’ 또는 ‘흉갑’으로 옮길 수 있습니다. 히브리어는 갑옷이 아니라 제사장이 가슴에 착용한 장식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  english_pob_choice: the leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 수령들
  - 족장들
  - 우두머리들
  lexicon: HALOT
  rationale: נְשִׂאִים은 공동체의 대표자나 지도자들을 가리키므로, 현대 한국어에서는 위계적 뉘앙스가 강한 ‘족장들’보다 중립적이고 분명한 ‘지도자들’이 적절합니다.
- source_word: אַבְנֵי הַשֹּׁהַם
  english_pob_choice: the onyx stones
  chosen_korean: 호마노들
  alternatives_korean:
  - 오닉스 돌들
  - 쇼함 돌들
  lexicon: HALOT
  rationale: 쇼함은 전통적으로 ‘호마노’로 옮겨 왔고, 정확한 광물 식별은 불확실하지만 본문은 제의용 보석을 가리키므로 관용적 번역을 따랐습니다.
- source_word: אַבְנֵי הַמִּלֻּאִים
  english_pob_choice: the stones for setting
  chosen_korean: 끼울 돌들
  alternatives_korean:
  - 세팅용 돌들
  - 채움 돌들
  - 장착용 돌들
  lexicon: HALOT
  rationale: מִלֻּאִים은 보석을 ‘끼워 넣는/장착하는’ 용도를 가리키므로, 기능을 드러내는 ‘끼울 돌들’이 문자적이면서도 이해하기 쉽습니다.
- source_word: וְלַחֹשֶׁן
  english_pob_choice: and for the breastpiece
  chosen_korean: 흉패
  alternatives_korean:
  - 가슴패
  - 가슴받이
  - 흉갑
  lexicon: HALOT
  rationale: חֹשֶׁן은 제사장의 가슴에 붙이는 장신구이므로, 전통적이면서도 전쟁용 갑옷을 떠올리게 하는 ‘흉갑’보다 ‘흉패’가 더 정확합니다.
theological_decisions:
- issue: 제의 용어의 직역성과 오해 방지
  chosen_reading: ‘에봇’과 ‘흉패’를 유지해 특정 제사장 복식임을 드러냈습니다.
  alternative_readings:
  - ‘에봇’과 ‘가슴받이’
  - ‘에봇’과 ‘가슴패’
  rationale: 본문은 성막 제의 기구를 열거하므로, 고유한 제의 용어는 음역을 유지하되 ‘흉패’로 기능을 분명히 해 전쟁용 방어구로 오해하지 않게 했습니다.
  doctrine_reference: 출애굽기 28장 제사장 복식
