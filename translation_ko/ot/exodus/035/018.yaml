lexical_decisions:
- source_word: יִתְדֹת
  english_pob_choice: pegs
  chosen_korean: 말뚝
  alternatives_korean:
  - 못
  - 핀
  - 고정말뚝
  lexicon: HALOT
  rationale: 성막과 뜰을 고정하는 용도이므로 한국어로는 ‘말뚝’이 가장 자연스럽고, ‘못’은 금속 못을 연상시켜 오해를 낳을 수 있습니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  - 성소 천막
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 מִשְׁכָּן은 예배용 거룩한 거처를 가리키므로, 한국어 성경에서 널리 쓰이는 ‘성막’이 가장 적절합니다.
- source_word: הֶחָצֵר
  english_pob_choice: the courtyard
  chosen_korean: 뜰
  alternatives_korean:
  - 마당
  - 외곽 뜰
  - 뜬
  lexicon: HALOT
  rationale: 성막 바깥의 둘러진 공간을 가리키므로, 전통적이면서도 정확한 ‘뜰’이 가장 간결합니다.
- source_word: מֵיתְרֵיהֶם
  english_pob_choice: their ropes
  chosen_korean: 그들의 줄
  alternatives_korean:
  - 그들의 밧줄
  - 그들의 끈
  - 그들의 로프
  lexicon: HALOT
  rationale: 줄임과 고정에 쓰이는 용도를 고려해 ‘줄’로 옮기면 과도하게 두껍거나 현대적 공구 느낌을 주는 표현을 피할 수 있습니다.
