lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  english_pob_choice: the lampstand for the light
  chosen_korean: 빛을 위한 등잔대
  alternatives_korean:
  - 빛의 등잔대
  - 조명을 위한 등잔대
  lexicon: HALOT
  rationale: מְנוֹרָה는 성막의 등잔대를 가리키므로 ‘등잔대’로 옮기고, הַמָּאוֹר의 목적 관계는 ‘빛을 위한’으로 풀어 영어 POB의 구성을 자연스럽게 반영했습니다.
- source_word: כֵּלֶיהָ
  english_pob_choice: its utensils
  chosen_korean: 그 기구들
  alternatives_korean:
  - 그 도구들
  - 그 용기들
  lexicon: HALOT
  rationale: כְּלִי는 성막 문맥에서 넓게 ‘기구/도구/기물’을 뜻하므로, 등잔대에 딸린 부속품의 범위를 지나치게 좁히지 않는 ‘기구들’이 적절합니다.
- source_word: נֵרֹתֶיהָ
  english_pob_choice: its lamps
  chosen_korean: 그 등잔들
  alternatives_korean:
  - 그 램프들
  - 그 불꽃들
  lexicon: HALOT
  rationale: נֵר은 일반적으로 ‘등잔/램프’를 뜻하며, 등잔대에 달린 개별 불기구를 가리키므로 한국어 성막 용례에 맞는 ‘등잔들’로 옮겼습니다.
- source_word: שֶׁמֶן הַמָּאוֹר
  english_pob_choice: the oil for the light
  chosen_korean: 빛을 위한 기름
  alternatives_korean:
  - 조명을 위한 기름
  - 등잔 기름
  lexicon: HALOT
  rationale: ‘기름’ 자체보다 그 목적을 드러내는 הַמָּאוֹר의 반복을 살리기 위해 ‘빛을 위한 기름’으로 옮겨, 본문의 목록성과 대구를 유지했습니다.
