  rationale: נֵר은 일반적으로 ‘등잔/램프’를 뜻하며, 등잔대에 달린 개별 불기구를 가리키므로 한국어 성막 용례에 맞는 ‘등잔들’로 옮겼습니다.
- source_word: שֶׁמֶן הַמָּאוֹר
  english_pob_choice: the oil for the light
  chosen_korean: 빛을 위한 기름
  alternatives_korean:
  - 조명을 위한 기름
  - 등잔 기름
  lexicon: HALOT
  rationale: ‘기름’ 자체보다 그 목적을 드러내는 הַמָּאוֹר의 반복을 살리기 위해 ‘빛을 위한 기름’으로 옮겨, 본문의 목록성과 대구를 유지했습니다.
