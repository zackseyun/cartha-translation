id: EXO.35.23
reference: Exodus 35:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל אִ֞ישׁ אֲשֶׁר נִמְצָ֣א אִתּ֗/וֹ תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ וְ/עִזִּ֑ים וְ/עֹרֹ֨ת אֵילִ֧ם מְאָדָּמִ֛ים וְ/עֹרֹ֥ת תְּחָשִׁ֖ים הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
  footnotes:
  - marker: a
    text: Hebrew tahash skins. The animal or material denoted by tahash is uncertain; proposed renderings include 'fine leather,' 'porpoise skins,' or 'dugong skins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 자기에게서 청색 실, 자색 실, 홍색 실, 가는 베실, 염소 털, 붉게 물들인 숫양 가죽, 그리고 해달 가죽을 가진 모든 사람이 그것들을 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תְּחָשִׁים의 의미는 확정되지 않습니다. 제안 번역으로는 '해달 가죽', '바다표범 가죽', '고운 가죽' 등이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  english_pob_choice: And every man
  chosen_korean: 그리고 자기에게서 가진 모든 사람이
  alternatives_korean:
  - 그리고 모든 남자가
  - 그리고 각 사람이
  lexicon: HALOT
  rationale: 히브리어 אִישׁ의 성별 표지가 있으나, 한국어에서는 반복적 목록 문맥에서 '모든 사람'이 자연스럽고, 뒤의 소유 구문으로 분배 의미를 살렸습니다.
- source_word: תְּכֵלֶת / אַרְגָּמָן / תוֹלַעַת שָׁנִי
  english_pob_choice: blue yarn / purple yarn / scarlet yarn
  chosen_korean: 청색 실 / 자색 실 / 홍색 실
  alternatives_korean:
  - 청색 실 / 자주색 실 / 주홍 실
  - 푸른 실 / 보라 실 / 진홍 실
  lexicon: HALOT
  rationale: 성막 재료 목록의 직물용 염색 실이라는 점을 살려 '실'로 옮겼고, תְּכֵלֶת·אַרְגָּמָן·תוֹלַעַת שָׁנִי의 색 대비를 한국어 관용색어로 간명하게 반영했습니다.
- source_word: שֵׁשׁ / עִזִּים
  english_pob_choice: fine linen / goats’ hair
  chosen_korean: 가는 베실 / 염소 털
  alternatives_korean:
  - 고운 베 / 염소털
  - 세마포 / 염소 털
  lexicon: HALOT
  rationale: שֵׁשׁ은 성막 문맥의 고급 아마포로 이해하여 '가는 베실'로 옮겼고, עִזִּים은 재료 목록의 실제 사용물을 드러내기 위해 '염소 털'로 번역했습니다.
- source_word: עֹרֹת תְּחָשִׁים
  english_pob_choice: tahash skins
  chosen_korean: 해달 가죽
  alternatives_korean:
  - 다하스 가죽
  - 바다표범 가죽
  - 물돼지 가죽
  lexicon: HALOT
  rationale: POB가 남긴 어휘 불확실성을 반영해 여러 견해가 있으나, 한국어 본문은 의미 제시형 번역을 택해 '가죽'의 재료 기능을 유지했습니다.
theological_decisions:
- issue: 재료 목록의 동사 처리
  chosen_reading: 물건을 '가져왔습니다'로 옮겨, 자원 봉헌의 실제 행위를 드러냈습니다.
  alternative_readings:
  - '''드렸습니다''로 의역'
  - '''바쳤습니다''로 제의적 어휘화'
  rationale: 히브리어 הֵבִיאוּ는 단순한 운반/제시를 뜻하므로, 봉헌의 뉘앙스를 과장하지 않으면서도 공동체적 헌납 맥락은 살렸습니다.
  doctrine_reference: 출애굽기 35장 성막 건축을 위한 자원 헌납 문맥
