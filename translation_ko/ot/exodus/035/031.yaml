id: EXO.35.31
reference: Exodus 35:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
  footnotes:
  - marker: a
    text: Or 'the spirit of God' or 'a divine spirit.' The Hebrew phrase can be understood more generally, but here it likely refers to God's own empowering Spirit.
    reason: alternative_reading
  - marker: b
    text: Or 'with all workmanship' or 'in every craft.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분은 하나님의 영으로 그를 채우셨습니다. 곧 지혜와 이해와 지식과 온갖 기술로 채우셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 영’이나 ‘신적 영’으로도 이해할 수 있습니다. 히브리어 표현은 더 일반적으로도 읽힐 수 있지만, 여기서는 하나님의 능력 주시는 영을 가리키는 것으로 보는 것이 가장 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘온갖 공예로’ 혹은 ‘모든 종류의 일로’도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֹתוֹ
  english_pob_choice: and he filled him
  chosen_korean: 그분은 … 그를 채우셨습니다
  alternatives_korean:
  - 그분이 … 그를 채우셨습니다
  - 그리고 그를 채우셨습니다
  lexicon: HALOT
  rationale: 서술의 주어는 앞 문맥의 하나님/야훼로 이어지므로 한국어에서도 주어를 보충해 자연스럽게 옮기되, 동작의 주체가 분명히 드러나도록 했습니다.
- source_word: רוּחַ אֱלֹהִים
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님의 바람
  lexicon: HALOT
  rationale: 이 절은 성막 제작을 위한 신적 능력 부여를 말하므로, 단순한 기질이 아니라 하나님의 내적 작용을 가리키는 말로 보아 ‘영’을 택했습니다. 본문이 구약 맥락이므로 ‘성령’보다 ‘하나님의 영’이 원문 범위를 더 직접적으로 반영합니다.
- source_word: בְּחָכְמָה בִּתְבוּנָה וּבְדַעַת
  english_pob_choice: with wisdom, with understanding, and with knowledge
  chosen_korean: 지혜와 이해와 지식으로
  alternatives_korean:
  - 지혜와 통찰과 지식으로
  - 지혜와 분별과 지식으로
  lexicon: HALOT
  rationale: 세 명사의 병렬을 한국어에서도 유지하되, ב 전치사의 도구·동반 의미를 문맥상 자연스럽게 한국어 조사 ‘-으로’로 풀었습니다. ‘이해’는 תְבוּנָה의 일반적 의미를 살리면서도 ‘지혜’와의 구분을 유지합니다.
- source_word: וּבְכָל מְלָאכָה
  english_pob_choice: and with every kind of craftsmanship
  chosen_korean: 온갖 기술로
  alternatives_korean:
  - 모든 공예로
  - 모든 종류의 일로
  - 온갖 공예 기술로
  lexicon: HALOT
  rationale: מְלָאכָה는 일반적 ‘일’보다 여기서는 성막 제작에 필요한 숙련된 공예·기술을 가리키므로, 한국어에서 가장 압축적이면서도 기능을 드러내는 ‘기술’로 옮겼습니다. ‘온갖’은 כָּל의 포괄성을 자연스럽게 반영합니다.
theological_decisions:
- issue: רוּחַ אֱלֹהִים의 신학적 뉘앙스를 인격적/비인격적 중 어떻게 반영할지
  chosen_reading: 하나님의 영
  alternative_readings:
  - 하나님의 성령
  - 신적 영
  rationale: 이 문맥에서 능력 부여의 주체는 하나님 자신이므로, ‘하나님의 영’이라고 번역해 신적 원천성과 인격적 작용을 함께 보존했습니다. 본문이 단순한 재능 묘사로 축소되지 않도록 하는 것이 중요합니다.
  doctrine_reference: 창 1:2; 출 31:3의 성막 장인 소명 맥락
