base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
  footnotes:
  - marker: a
    text: Or 'to instruct.' The Hebrew infinitive can denote teaching in a broad sense, including giving instruction in skilled work.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 하나님께서는 가르칠 능력을 그 마음에 두셨습니다—그와 함께 오홀리압, 아히사막의 아들, 단 지파 사람에게도 그러하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가르치도록’. 히브리어 부정사구는 넓은 의미의 가르침, 곧 숙련된 작업에 대한 지시를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  english_pob_choice: the ability to teach
  chosen_korean: 가르칠 능력
  alternatives_korean:
  - 가르치는 일
  - 가르칠 수 있도록 하는 것
  - 가르침
  lexicon: HALOT
  rationale: 히필 부정사구는 단순한 행위보다 내적으로 부여된 가르침의 소질·역량을 가리킬 수 있으므로, 한국어에서는 자연스럽게 ‘가르칠 능력’으로 옮겼습니다.
- source_word: נָתַן בְּלִבּוֹ
  english_pob_choice: has put in his heart
  chosen_korean: 그 마음에 두셨습니다
  alternatives_korean:
  - 그 마음에 넣으셨습니다
  - 그의 마음속에 두셨습니다
  - 그에게 주셨습니다
  lexicon: HALOT
  rationale: ‘마음’은 히브리어에서 의지와 내적 자질의 자리이므로, 외래식 표현을 피하면서도 내적 부여의 뜻이 드러나도록 ‘그 마음에 두셨습니다’로 옮겼습니다.
- source_word: וְאָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  english_pob_choice: and Oholiab son of Ahisamach
  chosen_korean: 오홀리압, 아히사막의 아들
  alternatives_korean:
  - 오홀리압, 아히사막의 아들인
  - 오홀리압과 아히사막의 아들
  - 오홀리압
  lexicon: standard transliteration
  rationale: 인명은 현대 음역을 따르고, 족보식 수식은 ‘아히사막의 아들’로 직역해 원문의 간결한 계보 표지를 보존했습니다.
- source_word: לְמַטֵּה דָן
  english_pob_choice: of the tribe of Dan
  chosen_korean: 단 지파 사람
  alternatives_korean:
  - 단 지파에 속한
  - 단 지파의
  - 단 지파에 속한 사람
  lexicon: HALOT
  rationale: לְ + מַטֶּה는 소속을 나타내므로, 한국어에서는 반복적인 ‘지파’ 표현보다 문맥상 자연한 ‘단 지파 사람’으로 풀어 소속 의미를 분명히 했습니다.
theological_decisions:
- issue: 주체가 하나님이라는 점의 명시 여부
  chosen_reading: 문맥상 명시된 주어를 앞에 보완해 ‘하나님께서는’으로 번역했습니다.
  alternative_readings:
  - 주어를 생략해 ‘또 그 마음에 두셨습니다’로 번역
  - 앞 문맥에만 의존해 수동적으로 번역
  rationale: 히브리어 본문은 주어를 생략하지만, 앞절과 연결되는 하나님의 주권적 부여를 한국어 문장 구조에서 분명히 드러내는 편이 자연스럽고 오해가 적습니다.
  doctrine_reference: 하나님의 주권적 은사 부여
