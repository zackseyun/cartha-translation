source:
  edition: WLC
  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
  footnotes:
  - marker: a
    text: Or more broadly, 'craftsman' for 'engraver'; the Hebrew term can denote a skilled artisan in general, but here it likely refers to a specific class of tabernacle workmanship.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'wisdom of heart,' a Hebrew expression for inwardly grounded skill, discernment, and craftsmanship.
    reason: cultural_note
  - marker: c
    text: Or 'devisers of artistic designs' for 'designers of designs.' The Hebrew repeats cognate terms for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들에게 마음의 지혜를 채워 주셔서, 조각하는 일과 디자인하는 일과 자수를 놓는 일, 곧 청색과 자색과 홍색 실과 가는 베실로 하는 모든 일과 직조하는 일, 그리고 모든 공예를 하는 사람들과 디자인을 구상하는 사람들까지 하게 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조각하는 일’은 여기서 ‘장인’보다 좁게 느껴질 수 있지만, 히브리어 חרש의 공예적 의미를 현대 한국어에서 드러내기 위한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마음의 지혜’는 히브리어의 관용구로, 단순한 지식보다 내적으로 숙련된 분별과 기술을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 공예 동사와 명사를 반복해 ‘디자인을 구상하는 사람들’이라는 수사적 강조를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא
  english_pob_choice: has filled
  chosen_korean: 채워 주셨습니다
  alternatives_korean:
  - 채우셨습니다
  - 가득 채우셨습니다
  lexicon: HALOT
  rationale: מלא의 완료적 의미를 살리면서, 기술을 부여하시는 하나님의 주도성을 한국어에서 자연스럽게 드러내기 위해 ‘채워 주셨습니다’를 택했습니다.
- source_word: חָכְמַת לֵב
  english_pob_choice: wisdom of heart
  chosen_korean: 마음의 지혜
  alternatives_korean:
  - 마음의 지혜와 총명
  - 속사람의 지혜
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심인 내적 숙련과 분별을 살리기 위해 직역에 가까운 ‘마음의 지혜’를 유지했습니다.
- source_word: חָרָשׁ
  english_pob_choice: engraver
  chosen_korean: 조각하는 일
  alternatives_korean:
  - 조각사
  - 기술자
  - 장인
  lexicon: HALOT
  rationale: 이 문맥에서의 חרש는 탭나클 공예의 특정 숙련 작업을 가리키므로, 인물 호칭보다 작업 자체를 드러내는 ‘조각하는 일’로 옮겼습니다.
- source_word: חֹשֵׁב / חֹשְׁבֵי מַחֲשָׁבֹת
  english_pob_choice: designer / designers of designs
  chosen_korean: 디자인하는 일 / 디자인을 구상하는 사람들
  alternatives_korean:
  - 무늬를 짜는 사람들
  - 의도를 짜내는 사람들
  - 디자이너
  lexicon: HALOT
  rationale: חשב의 공예 맥락상 ‘무늬를 고안하다’의 뜻을 살리되, 현대 독자가 이해하기 쉬운 ‘디자인하다 / 디자인을 구상하다’로 옮겼습니다. 히브리어의 반복적 수사를 한국어에서도 과도하게 매끈하게 지우지 않도록 했습니다.
- source_word: תְּכֵלֶת ... שָּׁנִי ... שֵׁשׁ
  english_pob_choice: blue, purple, scarlet yarn, and fine linen
  chosen_korean: 청색과 자색과 홍색 실과 가는 베실
  alternatives_korean:
  - 푸른색과 자주색과 주홍색 실과 고운 베실
  - 청색, 자색, 홍색 실과 세마포
  lexicon: HALOT
  rationale: 색채 항목은 전통적이면서도 현대 한국어에 통용되는 색명으로 유지했고, שֵׁשׁ은 탭나클 문맥에 맞게 ‘가는 베실’로 구체화했습니다.
theological_decisions:
- issue: 하나님이 기술과 공예의 지혜를 주시는 방식
  chosen_reading: 이 구절은 단순한 재능 묘사가 아니라 하나님이 마음에 지혜를 채워 주셔서 성막 공예를 수행하게 하시는 것으로 읽었습니다.
  alternative_readings:
  - 기술이 뛰어난 사람들의 자연적 재능 서술
  - 순전히 인간적 학예의 설명
  rationale: 문장 첫머리의 주어와 완료 동사는 하나님께서 기술을 부여하시는 원인임을 분명히 하므로, 한국어에서도 그 주도성을 보존했습니다.
  doctrine_reference: 출애굽기 31장 및 성막 제작 본문 전체의 신적 부여 모티프
