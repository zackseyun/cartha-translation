base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
  footnotes:
  - marker: a
    text: Or more broadly, 'craftsman' for 'engraver'; the Hebrew term can denote a skilled artisan in general, but here it likely refers to a specific class of tabernacle workmanship.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'wisdom of heart,' a Hebrew expression for inwardly grounded skill, discernment, and craftsmanship.
    reason: cultural_note
  - marker: c
    text: Or 'devisers of artistic designs' for 'designers of designs.' The Hebrew repeats cognate terms for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들에게 마음의 지혜[b]를 채워 주셔서, 장인[a]과 무늬를 고안하는 이와 청색 실과 자색 실과 홍색 실과 고운 베로 수놓는 이와 베를 짜는 이의 모든 일을 하게 하셨습니다. 이들은 온갖 일을 하는 이들이며 무늬를 고안하는 이들입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장인’으로 옮긴 히브리어 חרש은 넓게는 숙련된 공예인을 뜻하며, 이 문맥에서는 성막 제작의 특정 공예 분야를 맡은 이를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마음의 지혜’는 히브리어 관용구로, 단순한 지식만이 아니라 내면에 자리한 숙련, 분별, 기술을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 ‘고안하는 이들’과 ‘고안/계획들’에 같은 어근을 반복하여, 무늬와 계획을 고안하는 역량을 강조합니다.
    reason: lexical_alternative
