- from: 그는 그들에게 마음의 지혜를 채워 주셔서, 조각하는 일과 디자인하는 일과 자수를 놓는 일, 곧 청색과 자색과 홍색 실과 가는 베실로 하는 모든 일과 직조하는 일, 그리고 모든 공예를 하는 사람들과 디자인을 구상하는 사람들까지 하게 하셨습니다.[a][b][c]
  to: 그는 그들에게 마음의 지혜[b]를 채워 주셔서, 장인[a]과 무늬를 고안하는 이와 청색 실과 자색 실과 홍색 실과 고운 베로 수놓는 이와 베를 짜는 이의 모든 일을 하게 하셨습니다. 이들은 온갖 일을 하는 이들이며 무늬를 고안하는 이들입니다.[c]
  rationale: 원문의 사람 중심 열거와 마지막 동격적 분사구를 회복했습니다. ‘장인’은 חרש의 넓은 공예적 의미를 보존하고, ‘무늬를 고안하는 이’는 חשב의 성막 공예 문맥을 드러냅니다. 고운 베는 שֵׁשׁ의 소재 의미를 유지하며, 각주도 해당 표현에 직접 연결했습니다.
