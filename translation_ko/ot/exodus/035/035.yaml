  source_fidelity: 초안은 하나님께서 그들에게 지혜를 채워 주셔서 여러 성막 공예를 수행하게 하셨다는 핵심을 보존합니다. 그러나 חָרָשׁ·חֹשֵׁב·רֹקֵם·אֹרֵג의 사람을 ‘일’로 바꾸고, 마지막의 분사구를 ‘사람들까지 하게 하셨습니다’의 목적어처럼 연결하여 히브리어의 열거 및 동격 구조가 흐려졌습니다. 또한 שֵׁשׁ은 ‘가는 베실’보다 ‘고운 베/고운 아마포’가 더 적절합니다.
  naturalness: ‘조각하는 일과 디자인하는 일 … 모든 공예를 하는 사람들과 디자인을 구상하는 사람들까지 하게 하셨습니다’는 병렬 단위가 일·사람으로 섞이고 ‘까지’의 연결도 부자연스럽습니다. 공예 종사자를 일관되게 ‘이’로 표현하고, 마지막 동격 설명을 독립 문장으로 처리하면 현대 표준어 합쇼체에서 명료합니다.
  terminology: ‘마음의 지혜’는 히브리어 관용구를 보존하는 데 적절합니다. 다만 현대 외래어 ‘디자인’보다 성막 직물 공예 문맥을 드러내는 ‘무늬를 고안하는 이’가 더 자연스럽고, חָרָשׁ은 문맥상 특정 조각 기술로 한정하지 않고 ‘장인’으로 옮기는 편이 안전합니다.
