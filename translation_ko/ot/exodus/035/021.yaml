source:
  edition: WLC
  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
  footnotes:
  - marker: a
    text: Or 'whose heart stirred him' and 'whose spirit made him willing.' The Hebrew uses idioms of inward prompting and voluntary generosity.
    reason: lexical_alternative
  - marker: b
    text: Or 'the offering to the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 마음이 감동된 모든 사람이 왔고, 또 영이 자원하게 한 모든 사람이 야훼의 헌물을 회막의 일, 그 모든 봉사와 거룩한 옷을 위하여 가져왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음이 그를 들어 올린’과 ‘영이 그를 기꺼이 하게 한’으로도 옮길 수 있습니다. 히브리어는 내적 촉발과 자발적 관대함을 가리키는 관용구를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께 드리는 헌물’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ כָּל אִישׁ
  english_pob_choice: And everyone came
  chosen_korean: 모든 사람이 왔고
  alternatives_korean:
  - 모든 사람이 나아왔고
  - 모든 사람이 모여왔고
  lexicon: HALOT
  rationale: כָּל אִישׁ은 문자적으로 ‘각 사람’이지만 여기서는 헌물을 가져온 개인들을 가리키는 일반적 집합 표현이므로 ‘모든 사람’이 자연스럽습니다.
- source_word: אֲשֶׁר נְשָׂא לִבּוֹ
  english_pob_choice: whose heart stirred him / whose heart lifted him up
  chosen_korean: 마음이 감동된
  alternatives_korean:
  - 마음이 그를 들어 올린
  - 마음이 그를 일으킨
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘그의 마음이 그를 들어 올렸다’의 내적 충동을 살리면서도 한국어에서 자연스럽게 이해되도록 ‘마음이 감동된’으로 옮겼습니다.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  english_pob_choice: and everyone whose spirit moved him willingly
  chosen_korean: 또 영이 자원하게 한 모든 사람이
  alternatives_korean:
  - 또 그의 영이 기꺼이 하게 한 모든 사람이
  - 또 영이 그를 자원하게 한 모든 사람이
  lexicon: HALOT
  rationale: נָדַב 계열은 자발성·기꺼움이 핵심이므로 ‘자원하게 한’으로 반영했고, רוּחַ는 여기서 성령 표지가 아니라 인간의 내적 ‘영’으로 보는 것이 문맥에 맞습니다.
- source_word: תְּרוּמַת יְהוָה
  english_pob_choice: Yahweh’s contribution
  chosen_korean: 야훼의 헌물
  alternatives_korean:
  - 야훼께 드리는 헌물
  - 야훼의 기증물
  lexicon: HALOT
  rationale: תְּרוּמָה는 제의적 ‘헌물/기여물’의 성격을 가지므로 ‘헌물’이 적절하며, יְהוָה는 본 문서 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד וּלְכָל עֲבֹדָתוֹ
  english_pob_choice: for the work of the tent of meeting, for all its service
  chosen_korean: 회막의 일, 그 모든 봉사와
  alternatives_korean:
  - 회막의 공사와 그 모든 봉사
  - 회막의 작업과 그 모든 섬김과
  lexicon: HALOT
  rationale: מְלָאכָה는 단순한 ‘공사’보다 넓은 ‘일/작업’이 맞고, עֲבֹדָה는 성소 문맥에서 단순 노동보다 ‘봉사’가 더 정확합니다.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  english_pob_choice: and for the holy garments
  chosen_korean: 거룩한 옷을 위하여
  alternatives_korean:
  - 성스러운 옷을 위하여
  - 거룩한 의복을 위하여
  lexicon: HALOT
  rationale: בְּגָדִים는 일반적으로 ‘옷’이지만 여기서는 제사장 의복을 가리키므로 ‘거룩한 옷’이 간결하고 직접적입니다.
theological_decisions:
- issue: 여호와/야훼 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로 약호적 대체인 ‘주님’보다 고유 신명인 ‘야훼’를 유지하는 것이 원문 추적성과 신학적 구분을 더 잘 보존합니다.
