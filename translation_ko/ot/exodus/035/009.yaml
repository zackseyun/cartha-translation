lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  english_pob_choice: onyx stones
  chosen_korean: 호마노
  alternatives_korean:
  - 오닉스 돌
  - 쇼함 돌
  - 오닉스석
  lexicon: HALOT
  rationale: שֹׁהַם의 통상적 대응인 ‘onyx stones’를 한국어로는 보석명 ‘호마노’로 옮겨, 기능적 서술보다 관용적 광물명을 살렸습니다. 정확한 광물 동정이 불확실하다는 점도 보존됩니다.
- source_word: אַבְנֵי מִלֻּאִים
  english_pob_choice: stones for setting
  chosen_korean: 메달을 박을 돌들
  alternatives_korean:
  - 세팅용 돌들
  - 끼워 넣을 돌들
  - 장식석
  lexicon: HALOT
  rationale: מִלֻּאִים의 핵심은 ‘채워 넣어 박는/끼우는 것’이므로, 단순 보석명이 아니라 실제로 장신구에 끼워 넣는 기능을 드러내어 옮겼습니다.
- source_word: לָאֵפֹד
  english_pob_choice: for the ephod
  chosen_korean: 에봇을 위한
  alternatives_korean:
  - 에봇에 대한
  - 제사장 에봇을 위한
  lexicon: HALOT
  rationale: אֵפֹד는 제의용 기술 용어이므로 한국어 음역 ‘에봇’을 유지해 제의적 특수성을 보존했습니다.
- source_word: וְלַחֹשֶׁן
  english_pob_choice: and for the breastpiece
  chosen_korean: 가슴받이를 위한
  alternatives_korean:
  - 가슴패를 위한
  - 흉패를 위한
  lexicon: HALOT
  rationale: חֹשֶׁן은 군사적 갑옷이 아니라 보석이 달린 제사장용 가슴 장식이므로, 전통적 ‘흉패’보다 의미를 곧바로 드러내는 ‘가슴받이’를 선택했습니다.
