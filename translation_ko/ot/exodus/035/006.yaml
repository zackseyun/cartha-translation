lexical_decisions:
- source_word: תְכֵלֶת
  english_pob_choice: blue
  chosen_korean: 청색
  alternatives_korean:
  - 푸른색
  - 파란색
  lexicon: HALOT
  rationale: 성막 재료 목록의 직물 염색 재료로서, 색채를 간결하게 살리면서도 한국어 성서 문맥에 자연스러운 ‘청색’이 적절합니다.
- source_word: אַרְגָּמָן
  english_pob_choice: purple
  chosen_korean: 자색
  alternatives_korean:
  - 보라색
  - 자주색
  lexicon: HALOT
  rationale: 염색된 직물의 색을 가리키므로, 전통적으로도 널리 쓰이고 문맥상 자연스러운 ‘자색’으로 옮겼습니다.
- source_word: תוֹלַעַת שָׁנִי
  english_pob_choice: scarlet yarn
  chosen_korean: 홍색 실
  alternatives_korean:
  - 주홍 실
  - 진홍 실
  - 홍색 베실
  lexicon: HALOT
  rationale: 히브리어는 벌레에서 얻은 붉은 염료를 가리키는 관용구로, 한국어에서는 재료 목록의 직물성을 살려 ‘홍색 실’로 옮기는 것이 가장 간결합니다.
- source_word: שֵׁשׁ
  english_pob_choice: fine linen
  chosen_korean: 가는 베실
  alternatives_korean:
  - 고운 베
  - 고운 삼베
  - 세마포
  lexicon: HALOT
  rationale: 성막 재료 목록에서 איכות(질감/등급)를 반영하는 천을 가리키므로, ‘가는’으로 איכות를 살리고 ‘베실’로 직물 재료를 분명히 했습니다.
- source_word: עִזִּים
  english_pob_choice: goats’ hair
  chosen_korean: 염소털
  alternatives_korean:
  - 염소의 털
  - 염소털 실
  lexicon: HALOT
  rationale: 문자적으로는 ‘염소들’이지만 이 목록에서는 성막 덮개 재료인 염소털을 뜻하므로, 오해를 피하도록 재료 의미를 직접 드러냈습니다.
