id: EXO.35.22
reference: Exodus 35:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
  footnotes:
  - marker: a
    text: The Hebrew phrase 'the men upon/with the women' is idiomatic; it likely means the men came together with, or in addition to, the women.
    reason: alternative_reading
  - marker: b
    text: 'The exact meanings of some jewelry terms are uncertain: ''brooches'' may also be ''clasps'' or ''rings''; ''earrings'' may also be ''nose-rings''; ''ornaments'' may refer to a specific kind of pendant or armlet.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 남자들이 여자들과 함께 왔습니다[a]. 마음이 기꺼운 사람은 누구나 브로치와 귀고리와 반지와 장식품들, 곧 온갖 금 장신구를 가져왔습니다[b]. 그리고 금으로 야훼께 드리는 요제를 바친 모든 남자도 그렇게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘남자들이 여자들 위에/에게’는 관용적으로 남자들이 여자들과 함께, 또는 여자들에 더해 왔다는 뜻일 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: 몇몇 장신구 명칭의 정확한 뜻은 분명하지 않습니다. ‘브로치’는 ‘클라스프’나 ‘반지’일 수도 있고, ‘귀고리’는 ‘코걸이’일 수도 있으며, ‘장식품’은 특정한 펜던트나 팔찌류를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  english_pob_choice: the men came with the women
  chosen_korean: 남자들이 여자들과 함께 왔습니다
  alternatives_korean:
  - 남자들이 여자들 곁에 왔습니다
  - 남자들이 여자들과 더불어 왔습니다
  - 남자들이 여자들 위에/에게 왔습니다
  lexicon: HALOT
  rationale: עַל의 관용적 용법을 공간적으로 옮기지 않고, 본문 맥락상 함께 참여했다는 뜻을 자연스럽게 살려 번역했습니다.
- source_word: כֹּל נְדִיב לֵב
  english_pob_choice: Everyone whose heart was willing
  chosen_korean: 마음이 기꺼운 사람은 누구나
  alternatives_korean:
  - 마음이 자원한 사람은 누구나
  - 너그러운 마음을 가진 사람은 누구나
  - 자원하는 마음의 사람은 누구나
  lexicon: HALOT
  rationale: 히브리어의 ‘마음’ 중심 표현을 살리면서, 한국어에서는 자연스러운 관용으로 옮겼습니다.
- source_word: חָח וָ/נֶזֶם וְ/טַבַּעַת וְ/כוּמָז
  english_pob_choice: brooches, earrings, rings, and ornaments
  chosen_korean: 브로치와 귀고리와 반지와 장식품들
  alternatives_korean:
  - 브로치와 귀걸이와 반지와 장식품들
  - 클라스프와 귀고리와 반지와 장식품들
  - 브로치와 코걸이와 반지와 장식품들
  lexicon: HALOT
  rationale: 각 명칭의 정확한 물건이 불확실하므로, 지나친 특정화를 피하면서도 목록의 품목성을 유지하는 쪽으로 옮겼습니다.
- source_word: כָּל כְּלִי זָהָב
  english_pob_choice: all kinds of gold jewelry
  chosen_korean: 온갖 금 장신구
  alternatives_korean:
  - 모든 금 물품
  - 온갖 금붙이
  - 모든 금 장신구
  lexicon: HALOT
  rationale: 문맥이 장신구 목록이므로, 넓은 ‘물품’보다 ‘장신구’가 더 적절합니다. ‘온갖’은 여러 종류를 포괄합니다.
- source_word: תְּנוּפַ֥ת זָהָ֖ב
  english_pob_choice: a wave offering of gold
  chosen_korean: 금으로 … 드리는 요제
  alternatives_korean:
  - 금의 요제
  - 금으로 드리는 거제물
  - 금의 흔든 제물
  lexicon: HALOT
  rationale: תְּנוּפָה의 제의적 전문성을 살리기 위해 ‘요제’를 유지했습니다. 동작은 한국어에서 자연스럽게 풀어 ‘드리는’으로 옮겼습니다.
- source_word: לַ/יהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  - 하나님께
  lexicon: HALOT
  rationale: 본문의 신명 표기를 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 희생물/제의 용어인 תְּנוּפָה의 처리
  chosen_reading: ‘요제’로 유지하고, 문맥상 ‘드리는’으로 풀어 번역했습니다.
  alternative_readings:
  - ‘흔드는 제물’
  - ‘거제물’
  - ‘제물’
  rationale: 본문은 단순한 기부가 아니라 제의적 봉헌을 말하므로, 전문 용어를 살려 제의적 성격을 보존했습니다.
  doctrine_reference: 제의 용어는 평준화하지 않고 원문의 예배 맥락을 보존한다는 POB 번역 원칙
- issue: 여성 동반 표현 הָאֲנָשִׁים עַל הַנָּשִׁים
  chosen_reading: 남자들이 여자들과 함께 왔습니다
  alternative_readings:
  - 남자들이 여자들 위에 왔습니다
  - 남자들이 여자들 곁에 왔습니다
  - 남자들이 여자들에 더해 왔습니다
  rationale: 문맥상 물리적 ‘위에’가 아니라 공동 참여를 뜻하는 관용구로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥이 허용하는 관용 표현은 직역보다 의미 전달을 우선한다는 POB 원칙
