translation:
  language: ko
  text: 예술적 구상을 고안하고[a], 금과 은과 청동으로[b] 작업하게 하시며
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘고안하다’와 그와 같은 어근의 명사를 함께 사용하여, 숙련된 공예적 구상과 설계를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נְחֹשֶׁת는 ‘청동’으로 흔히 옮기지만, ‘구리’로 옮길 수도 있습니다. 한국어 성경의 전통적 표현은 ‘놋’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/חְשֹׁ֖ב מַֽחַשָׁבֹ֑ת
  english_pob_choice: to devise designs
  chosen_korean: 예술적 구상들을 고안하게 하시며
  alternatives_korean:
  - 구상들을 계획하게 하시며
  - 설계들을 하게 하시며
  - 생각들을 해내게 하시며
  lexicon: HALOT
  rationale: חשׁב의 동사+동족명사 반복은 단순한 사고가 아니라 숙련된 설계·창작의 발상을 가리키므로, 한국어에서는 '예술적 구상들을 고안하다'로 그 창의적·기술적 뉘앙스를 살렸습니다.
- source_word: לַ/עֲשֹׂ֛ת
  english_pob_choice: to work
  chosen_korean: 작업할
  alternatives_korean:
  - 만들
  - 제작할
  - 형상할
  lexicon: HALOT
  rationale: 금속 공예의 문맥에서 עשה는 일반적 '하다'보다 실제 제작 수행을 뜻하므로, 한국어에서는 '작업하다'로 공예적 실행성을 드러냈습니다.
- source_word: בַּ/זָּהָ֥ב וּ/בַ/כֶּ֖סֶף וּ/בַ/נְּחֹֽשֶׁת
  english_pob_choice: in gold and in silver and in bronze
  chosen_korean: 금과 은과 놋으로
  alternatives_korean:
  - 금과 은과 청동으로
  - 금과 은과 구리로
  - 금과 은과 놋쇠로
  lexicon: HALOT
  rationale: 재료 목록의 ב는 영어 POB처럼 재료 영역을 나타내는 용법으로 보고, 한국어에서는 자연스러운 도구적 표현인 '—으로'를 사용했습니다. נחשׁת는 성막 제작 문맥에서 역사적으로 정확도가 높은 '놋'으로 옮겼습니다.
theological_decisions:
- issue: 이 절의 의미가 단순 기능 목록인지, 성막 제작을 위한 영감된 공예 능력의 부여인지
  chosen_reading: 여기서는 베살엘에게 주어진 창의적·기술적 설계 능력의 내용에 초점을 맞춰, '예술적 구상들을 고안하게 하시며'로 옮겼습니다.
  alternative_readings:
  - 단순히 '생각하게 하시며'로 축소할 수 있음
  - '''설계하게 하시며''로 더 기술적으로 좁힐 수 있음'
  rationale: 앞절들과 이어지는 성막 공예 문맥에서 이 표현은 일반 사고가 아니라 숙련된 창작 설계를 가리키므로, 기능 목록이 아니라 은사로서의 공예 지혜를 드러내는 번역이 적절합니다.
  doctrine_reference: 출 31:3-5; 출 35:31-35
