  source_fidelity: 히브리어는 성막 단지와 그 구성 요소들을 목적격으로 열거합니다. 초안은 전체 항목을 대체로 보존하지만, בְּרִיחָיו는 구조를 고정하는 ‘bars’인데 ‘띠들’은 끈이나 띠를 뜻하여 맞지 않습니다. 또한 קְרָסָיו는 단순한 고리라기보다 연결·고정용 쇠붙이이므로 ‘연결쇠들’이 더 적절합니다.
  naturalness: ‘그 천막’, ‘그 덮개’ 등 반복되는 소유 표지는 기술적 열거문에서 자연스럽습니다. 다만 각주 표지는 해당 어휘 바로 뒤에 두어야 독자가 어느 대안을 설명하는지 분명히 알 수 있습니다. ‘가로대들’과 ‘받침대들’은 현대 표준어에서 구조 부재를 자연스럽게 가리킵니다.
