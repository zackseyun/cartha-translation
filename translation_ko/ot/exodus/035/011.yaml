id: EXO.35.11
reference: Exodus 35:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת הַ֨/מִּשְׁכָּ֔ן אֶֽת אָהֳל֖/וֹ וְ/אֶת מִכְסֵ֑/הוּ אֶת קְרָסָי/ו֙ וְ/אֶת קְרָשָׁ֔י/ו אֶת בְּרִיחָ֕/ו אֶת עַמֻּדָ֖י/ו וְ/אֶת אֲדָנָֽי/ו־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/011.yaml
  text: the tabernacle[a], its tent, and its covering; its clasps, its boards, its bars, its pillars, and its bases[b];
  footnotes:
  - marker: a
    text: Or 'frames' for 'boards' (קְרָשָׁיו), if the term is understood to describe a framed construction rather than solid planks.
    reason: lexical_alternative
  - marker: b
    text: Or 'sockets' for 'bases' (אֲדָנָיו), emphasizing the receptacles that held the structural elements.
    reason: lexical_alternative
translation:
  language: ko
  text: 성막과 그 천막과 덮개, 그 고리들과 그 널빤지들과 그 띠들과 그 기둥들과 그 받침들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘틀들’로 이해할 수 있습니다. 히브리어 קְרָשָׁיו는 성막 구조에서 널빤지나 프레임을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소켓들’로 옮길 수 있습니다. 히브리어 אֲדָנָיו는 구조 부재를 받치는 받침 또는 끼움구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: קדש(성소) 맥락에서 מִשְׁכָּן은 야훼가 이스라엘 가운데 거하시는 성막 구조를 가리키므로, 한국어 성경의 확립된 용례인 ‘성막’이 가장 정확합니다.
- source_word: אָהֳלוֹ
  english_pob_choice: its tent
  chosen_korean: 그 천막
  alternatives_korean:
  - 그 장막
  - 그 텐트
  lexicon: HALOT
  rationale: אָהֶל은 문자적으로 ‘천막/텐트’이지만, 성막 문맥에서는 구조물의 한 구성 요소를 가리키므로 ‘천막’이 자연스럽고 원문의 구분도 살립니다.
- source_word: קְרָשָׁיו
  english_pob_choice: its boards
  chosen_korean: 그 널빤지들
  alternatives_korean:
  - 그 판자들
  - 그 틀들
  lexicon: HALOT
  rationale: 성막 구조를 이루는 קֶרֶשׁ은 ‘boards’에 해당하므로 ‘널빤지들’이 물질적 이미지를 가장 직접적으로 전달합니다. 다만 ‘틀들’로 이해할 여지도 있어 주석 여지를 남깁니다.
- source_word: אֲדָנָיו
  english_pob_choice: its bases
  chosen_korean: 그 받침들
  alternatives_korean:
  - 그 소켓들
  - 그 밑받침들
  lexicon: HALOT
  rationale: 성막 부재를 지탱하는 받침/소켓을 가리키므로, 기능을 살린 ‘받침들’이 자연스럽고 본문의 구조적 의미를 잘 드러냅니다.
theological_decisions:
- issue: 성막 용어를 교회적/전통적 표현으로 완화하지 않을지
  chosen_reading: ‘성막’과 재료·구성 요소를 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘장막’으로 일반화
  - 설명적으로 풀어 쓰기
  rationale: 이 절은 성막의 여러 부품을 열거하는 기술적 문장이라, 전통적 신앙어보다 구조와 항목의 구분을 보존하는 것이 원문 이해에 더 충실합니다.
  doctrine_reference: 출애굽기 25–40장의 성막 지시와 제작 서술
- issue: 성별/소유 표지를 한국어에서 어떻게 처리할지
  chosen_reading: 히브리어 3인칭 접미사는 한국어에서 ‘그’로 일관되게 옮겼습니다.
  alternative_readings:
  - ‘그의’로 번역
  - 접미사를 생략
  rationale: 무생물 지시 대상에 ‘그의’는 부자연스러우며, 접미사를 생략하면 목록의 결속이 약해집니다. ‘그’는 소유 관계와 항목 반복을 동시에 살립니다.
  doctrine_reference: 히브리어 지시대명사·접미사 관용
- issue: ‘clasps’에 해당하는 부분을 한국어에서 어떻게 처리할지
  chosen_reading: 본문에는 중립적 구조 부품명인 ‘고리들’을 두었습니다.
  alternative_readings:
  - ‘갈고리들’
  - ‘클라스프들’
  rationale: 성막 연결 부품의 기능을 고려하면 ‘고리들’이 가장 무난하며, 지나치게 현대적이거나 구체적인 금속공학 용어로 좁히지 않습니다.
  doctrine_reference: 출애굽기 성막 제작 묘사
