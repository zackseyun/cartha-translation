  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
  footnotes:
  - marker: a
    text: Or “the Israelites” or “the children of Israel.” The Hebrew reads “the sons of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 이스라엘의 자손[a]에게 말했습니다. “보십시오, 야훼께서 유다 지파에 속한 훌의 아들 우리의 아들 브살렐을 이름을 불러 지명하셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “이스라엘의 아들들”입니다. 본문에서는 남성 복수 친족 표현을 살려 ‘이스라엘의 자손’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵ֣י יִשְׂרָאֵ֔ל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 표현을 살리면서도 한국어에서 자연스럽고 공적인 호칭이 되도록 옮겼습니다.
- source_word: רְא֛וּ
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보라
  lexicon: HALOT
  rationale: 모세의 공적 발화에서 청중의 주의를 환기하는 명령형을 현대 표준어의 합쇼체로 자연스럽게 반영했습니다.
- source_word: קָרָ֥א ... בְּ/שֵׁ֑ם
  english_pob_choice: has called ... by name
  chosen_korean: 이름까지 불러 부르셨습니다
  alternatives_korean:
  - 이름으로 부르셨습니다
  - 이름을 불러 지정하셨습니다
  - 이름까지 부르셨습니다
  lexicon: HALOT
  rationale: קרא בשם의 ‘이름으로 특정하여 부르다/지명하다’는 뜻을 살리되, 한국어에서 선택과 지목의 강도를 자연스럽게 드러내기 위해 ‘이름까지 불러 부르셨습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사를 보존하는 프로젝트 기본 용례에 따라 신적 호칭이 아니라 고유명 ‘야훼’로 옮겼습니다.
- source_word: לְ/מַטֵּ֥ה יְהוּדָֽה
  english_pob_choice: of the tribe of Judah
  chosen_korean: 유다 지파에 속한
  alternatives_korean:
  - 유다 지파의
  - 유다 지파에서 나온
  lexicon: HALOT
  rationale: 소속 관계를 한국어에서 가장 자연스럽게 나타내는 방식으로 처리해, 계보 정보와 지파 소속이 함께 드러나도록 했습니다.
theological_decisions:
- issue: YHWH의 고유명 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 언약의 이름 יְהוָה를 직접 사용하므로, 이를 일반 호칭으로 완화하지 않고 고유명으로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 모세의 발화체와 인용문 내부의 경어
  chosen_reading: 서술은 합쇼체로, 인용문 안에서도 군중을 향한 공적 호소는 합쇼체를 유지
  alternative_readings:
  - 인용문을 평서체로 낮춤
  - 전부 비격식체로 처리
  rationale: 본문은 모세의 공개 선언이므로, 한국어 독자에게 동일한 공적·권위적 울림이 전달되도록 경어 체계를 유지했습니다.
  doctrine_reference: Translation style policy
