  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of Israel,'' a covenantal designation for the people of Israel; the phrase refers to the whole community, not males only.'
    reason: lexical_alternative
  - marker: b
    text: Or 'These are the words' / 'These are the matters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세가 이스라엘 자손의 온 회중을 모아 그들에게 말하였습니다. 「이것들은 야훼께서 행하라고 명하신 일들입니다。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 남성만이 아니라 이스라엘의 언약 공동체 전체를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘דְּבָרִים’은 문맥에 따라 ‘말씀들’, ‘일들’, ‘사안들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  english_pob_choice: assembled
  chosen_korean: 모아
  alternatives_korean:
  - 소집하여
  - 집합시켜
  lexicon: HALOT
  rationale: 사역형 קהל의 의미를 살려 회중을 한데 불러 모으는 동작을 자연스러운 현대 한국어 동사로 옮겼습니다.
- source_word: כָּל עֲדַת
  english_pob_choice: all the congregation
  chosen_korean: 온 회중
  alternatives_korean:
  - 모든 회중
  - 전체 회중
  lexicon: HALOT
  rationale: עֵדָה의 공동체적·언약적 의미를 살려 ‘회중’으로 옮기고, כָּל은 ‘온’으로 간결하게 반영했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  lexicon: HALOT
  rationale: 남성 복수형 구조를 평탄화하지 않고, 한국어 성경에서 널리 통용되는 ‘이스라엘 자손’을 유지해 언약적 집단을 가리키는 표현을 보존했습니다.
- source_word: אֵלֶּה הַדְּבָרִים
  english_pob_choice: These are the things
  chosen_korean: 이것들은
  alternatives_korean:
  - 이것들은 말씀들입니다
  - 이것들은 일들입니다
  lexicon: HALOT
  rationale: 뒤따르는 내용이 명령된 실행 항목들이므로 דְּבָרִים을 과도하게 문자화하지 않고 앞문장의 지시대명사로 자연스럽게 받아 주었습니다.
- source_word: צִוָּה יְהוָה
  english_pob_choice: Yahweh has commanded
  chosen_korean: 야훼께서 행하라고 명하신
  alternatives_korean:
  - 야훼께서 명령하신
  - 야훼께서 하라고 명하신
  lexicon: HALOT
  rationale: 직접 명령의 힘을 살려 ‘명하신’으로 옮기고, 한국어에서 목적절을 자연스럽게 풀어 ‘행하라고’로 렌더링했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 사본의 신명기적 표기를 고유명사로 드러내기 위해 전통적 대체 титula인 ‘주’를 쓰지 않고 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: ‘이스라엘 자손’의 범위와 성별 표지
  chosen_reading: 이스라엘 자손은 남성 복수형을 보존하되, 지시 대상은 이스라엘 공동체 전체로 이해합니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘의 자녀들
  rationale: 히브리어 형태는 남성 복수형이지만 언약 공동체 전체를 가리키므로, 한국어에서는 관용적이면서도 형태 정보를 보존하는 표현을 선택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
- issue: 거룩한 이름 יְהוָה의 처리
  chosen_reading: 본문에서는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명사호가 직접 드러나므로 호칭 대체를 피하고, POB 원칙에 따라 고유한 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
