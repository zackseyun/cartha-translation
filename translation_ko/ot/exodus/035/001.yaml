  source_fidelity: 히브리어 본문의 핵심 의미는 대체로 충실하게 옮겼습니다. 다만 וַ 접속형은 단순 서술 진행을 나타내므로, 별도의 시간 부사인 ‘그때’는 넣지 않는 편이 더 절제되고 정확합니다. ‘이스라엘 자손의 온 회중’, ‘야훼’, 그리고 명령받은 실행 사항이라는 의미는 적절합니다.
  naturalness: ‘모세는 … 모으고 그들에게 말했습니다’는 현대 표준 한국어의 자연스러운 합쇼체 서술입니다. 각주 표지는 해당 어구 바로 뒤에 두어 독자가 무엇을 설명하는지 분명히 알 수 있게 하는 것이 좋습니다.
  terminology: ‘이스라엘 자손’은 원문의 언약적 집단 명칭을 보존하는 관용적 표현이며, ‘회중’도 עֲדָה에 적절합니다. יְהוָה는 프로젝트 방침 및 영어 POB를 따라 ‘야훼’로 유지합니다. דְּבָרִים은 이 문맥에서 ‘일들’로 옮길 수 있으며, 대안 의미는 각주로 보완합니다.
