  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of Israel,'' a covenantal designation for the people of Israel; the phrase refers to the whole community, not males only.'
    reason: lexical_alternative
  - marker: b
    text: Or 'These are the words' / 'These are the matters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 이스라엘 자손[a]의 온 회중을 모으고 그들에게 말했습니다. “이것들은 야훼께서 행하라고 명하신 일들[b]입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 남성만이 아니라 이스라엘의 언약 공동체 전체를 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘דְּבָרִים’은 문맥에 따라 ‘말씀들’, ‘일들’, 또는 ‘사안들’로도 옮길 수 있습니다.
    reason: lexical_alternative
