lexical_decisions:
- source_word: הָאָרֹן
  english_pob_choice: the ark
  chosen_korean: 그 궤
  alternatives_korean:
  - 그 상자
  - 그 함
  lexicon: HALOT
  rationale: 성막 문맥의 אָרוֹן은 언약궤를 가리키므로, 한국어에서는 전통적으로도 통용되는 ‘궤’를 택해 성스러운 용기를 분명하게 드러냈습니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles
  chosen_korean: 그 채들
  alternatives_korean:
  - 그 막대들
  - 그 장대들
  lexicon: HALOT
  rationale: 성막 기구를 운반하는 막대를 가리키므로, ‘채들’이 가장 간결하고 성막 용례에도 맞습니다.
- source_word: הַכַּפֹּרֶת
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 자비의 자리
  - 은혜좌
  lexicon: HALOT
  rationale: 이 용어는 궤의 덮개이면서 속죄와 직접 연결되는 예식 용어이므로, 의미를 더 분명히 드러내는 ‘속죄소’를 택했습니다.
- source_word: פָּרֹכֶת הַמָּסָךְ
  english_pob_choice: the veil of the screen
  chosen_korean: 가리는 휘장
  alternatives_korean:
  - 가림막 휘장
  - 가리는 장막
  lexicon: HALOT
  rationale: 두 명사를 한데 묶어, 분리와 차단 기능을 가진 성막의 가림막이라는 점을 살려 ‘가리는 휘장’으로 옮겼습니다.
theological_decisions:
- issue: הַכַּפֹּרֶת의 전통적 ‘mercy seat’ 대신 의미 투명성이 높은 번역을 택할지 여부
  chosen_reading: 속죄소
  alternative_readings:
  - 시은좌
  - 자비의 자리
  - 은혜좌
  rationale: 본문은 성막 기구의 목록이지만, 이 덮개는 단순한 ‘자리’가 아니라 속죄와 연결된 제의적 장소이므로, 독자가 기능을 즉시 파악하도록 ‘속죄소’를 선택했습니다.
  doctrine_reference: 성막/속죄 용어의 제의적 기능
