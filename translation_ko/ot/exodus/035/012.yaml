  source_fidelity: 수정이 필요합니다. 히브리어 본문은 성막 기물의 목적어 목록만 제시하며 ‘만들었습니다’에 해당하는 동사가 없습니다. 또한 פָּרֹכֶת הַמָּסָךְ의 두 명사를 ‘가리는’이라는 기능 표현으로 합치기보다, 둘의 관계를 드러내는 표현이 더 충실합니다.
  naturalness: ‘궤와 그 채들, 속죄소, 그리고 가림막의 휘장’은 한국어의 열거 구문으로 자연스럽고, 본문에 없는 서술을 보충하지 않습니다. ‘그 궤’의 관사는 한국어에서 불필요하므로 생략하는 편이 자연스럽습니다.
  terminology: ‘궤’, ‘채들’, ‘속죄소’는 성막 문맥에서 통용되며 적절합니다. כַּפֹּרֶת의 물리적 의미를 보존하는 대안 ‘속죄 덮개’는 각주로 유지합니다. פָּרֹכֶת הַמָּסָךְ은 ‘가림막의 휘장’으로 옮겨 두 명사를 모두 반영합니다.
