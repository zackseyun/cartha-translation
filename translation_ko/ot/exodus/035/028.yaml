translation:
  language: ko
  text: 그리고 등불을 위한 기름과 — 관유와 향료의 향을 위한 — 향료의 향을 위한 향을 가져오십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기름’은 원문 일반어 שֶׁמֶן을 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘향료의 향’은 ‘향료들로 된 향’ 또는 ‘향기로운 향’로도 옮길 수 있는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּשֶׂם
  english_pob_choice: the balsam
  chosen_korean: 향료
  alternatives_korean:
  - 향기 나는 물질
  - 향유 재료
  - 향료 물질
  lexicon: HALOT
  rationale: 문맥상 성막에 쓰이는 향기로운 재료를 가리키므로, 한국어에서는 구체적 용도를 살린 ‘향료’가 가장 자연스럽고 원문 범위를 과도하게 좁히지 않습니다.
- source_word: הַשָּׁמֶן
  english_pob_choice: the oil
  chosen_korean: 기름
  alternatives_korean:
  - 올리브기름
  - 유
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘기름’을 뜻하며, 여기서는 등불용 기름이므로 일반어 ‘기름’이 원문에 충실합니다.
- source_word: לְמָאוֹר
  english_pob_choice: for the light
  chosen_korean: 등불을 위한
  alternatives_korean:
  - 빛을 위한
  - 조명을 위한
  lexicon: HALOT
  rationale: 성막 문맥에서 마오르(빛)는 실제로 등불의 기능을 가리키므로, 한국어에서는 기능을 드러내는 ‘등불을 위한’이 가장 분명합니다.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  english_pob_choice: the anointing oil
  chosen_korean: 관유
  alternatives_korean:
  - 기름부음 기름
  - 바름 기름
  lexicon: HALOT
  rationale: 성소 용어로 굳어진 ‘관유’가 원문의 제의적 의미를 간결하게 전달합니다.
- source_word: קְטֹרֶת הַסַּמִּים
  english_pob_choice: the incense of spices
  chosen_korean: 향료의 향
  alternatives_korean:
  - 향기로운 향
  - 향료로 만든 향
  - 향품의 향
  lexicon: HALOT
  rationale: 히브리어의 이중 구조(‘향’ + ‘향료’)를 살리되, 한국어에서는 중복을 줄여 제의용 향의 성격을 드러내는 ‘향료의 향’으로 옮겼습니다.
theological_decisions:
- issue: 제의 목록의 병렬 구조를 어떻게 보존할지
  chosen_reading: 반복되는 ‘그리고’와 ‘~을 위한’ 구조로 헌물 목록의 나열감을 살렸습니다.
  alternative_readings:
  - 문장 하나로 압축하여 자연스럽게 재배열하기
  rationale: 원문의 연속적 나열과 항목별 구분이 이 절의 핵심이므로, 한국어에서도 병렬성을 유지하는 편이 제의적 공시성을 더 잘 전달합니다.
  doctrine_reference: 성막 재료 목록의 문체적 충실성
