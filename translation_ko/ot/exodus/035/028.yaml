  lexicon: HALOT
  rationale: 히브리어의 이중 구조(‘향’ + ‘향료’)를 살리되, 한국어에서는 중복을 줄여 제의용 향의 성격을 드러내는 ‘향료의 향’으로 옮겼습니다.
