  rationale: 히브리어는 단순히 ‘기름’을 뜻하며, 여기서는 등불용 기름이므로 일반어 ‘기름’이 원문에 충실합니다.
- source_word: לְמָאוֹר
  english_pob_choice: for the light
  chosen_korean: 등불을 위한
