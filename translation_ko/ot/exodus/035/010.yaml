source:
  edition: WLC
  text: וְ/כָל חֲכַם לֵ֖ב בָּ/כֶ֑ם יָבֹ֣אוּ וְ/יַעֲשׂ֔וּ אֵ֛ת כָּל אֲשֶׁ֥ר צִוָּ֖ה יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
  footnotes:
  - marker: a
    text: Hebrew literally, 'wise of heart,' an idiom for one who is skilled or adept, especially in craftsmanship.
    reason: lexical_alternative
  - marker: b
    text: Or 'everyone who is skillful among you.' The Hebrew is grammatically masculine singular with distributive force.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 여러분 가운데 있는 모든 마음이 지혜로운 사람은 와서, 야훼께서 명하신 모든 것을 만들 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘마음이 지혜로운’이라는 뜻의 관용구로, 여기서는 기술이 뛰어나고 손재주가 있는 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문법상 남성 단수이지만 분배적 의미를 가지므로, ‘여러분 가운데 있는 모든 사람’으로 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל
  english_pob_choice: And every
  chosen_korean: 그리고 … 모든
  alternatives_korean:
  - 그리고 … 각기
  - 그리고 … 각 사람
  lexicon: HALOT
  rationale: 연결 접속사 וְ를 살리면서 כָל의 분배적 힘을 한국어의 ‘모든’과 주어 위치로 풀어, 한 사람씩 해당된다는 뜻을 자연스럽게 전달했습니다.
- source_word: חֲכַם לֵב
  english_pob_choice: skillful person
  chosen_korean: 마음이 지혜로운 사람
  alternatives_korean:
  - 기술이 뛰어난 사람
  - 지혜로운 사람
  - 손재주 있는 사람
  lexicon: HALOT
  rationale: 직역하면 ‘마음이 지혜로운’이지만, 성막 제작 문맥에서는 관념적 지혜보다 실제 기술과 숙련을 가리키므로 한국어 본문에서는 직역을 유지하되 의미를 드러냈습니다.
- source_word: בָּכֶם
  english_pob_choice: among you
  chosen_korean: 여러분 가운데 있는
  alternatives_korean:
  - 여러분 중에 있는
  - 여러분 안에 있는
  lexicon: HALOT
  rationale: 공동체 내부의 위치를 나타내는 ב + 2인칭 복수 접미사를 한국어에서 가장 자연스럽게 ‘가운데 있는’으로 옮겼습니다.
- source_word: צִוָּה יְהוָה
  english_pob_choice: Yahweh has commanded
  chosen_korean: 야훼께서 명하신
  alternatives_korean:
  - 야훼께서 명령하신
  - 주님께서 명하신
  lexicon: HALOT
  rationale: יַהְוֶה는 본문 원어의 언약 이름이므로 ‘야훼’로 옮겼고, 완료형은 한국어 관용에 따라 현재 완료적 의미의 관형사형으로 처리했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문이 직접 יְהוָה를 사용하므로, 프로젝트 표준에 따라 고유한 언약 이름을 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: חֲכַם לֵב의 성중립화 여부
  chosen_reading: 마음이 지혜로운 사람
  alternative_readings:
  - 마음이 지혜로운 남자
  - 기술이 뛰어난 사람
  rationale: 히브리어는 문법상 남성 단수이지만 문맥상 성막 제작에 적합한 기술자를 가리키므로, 본문에는 사람으로 옮기되 기술적 의미가 드러나게 했습니다.
  doctrine_reference: 'Translation philosophy: source-shaped rendering with contextual skill sense'
