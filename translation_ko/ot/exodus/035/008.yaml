lexical_decisions:
- source_word: שֶׁמֶן
  english_pob_choice: oil
  chosen_korean: 기름
  alternatives_korean:
  - 오일
  - 기름(올리브기름)
  lexicon: HALOT
  rationale: הֶבְרֵיאי ‘שֶׁמֶן’은 일반적으로 기름을 뜻하므로, 문맥상 성막용 재료 목록에서도 가장 자연스럽고 과도한 특정화가 없는 ‘기름’으로 옮겼습니다.
- source_word: לַמָּאוֹר
  english_pob_choice: for the light
  chosen_korean: 등잔에 쓸
  alternatives_korean:
  - 빛을 위해 쓸
  - 조명용의
  lexicon: HALOT
  rationale: 직역하면 ‘빛을 위하여’이지만, 성막 맥락에서는 등잔의 빛을 내기 위한 기름이므로 한국어에서는 기능을 드러내는 ‘등잔에 쓸’이 더 정확합니다.
- source_word: בְשָׂמִים
  english_pob_choice: spices
  chosen_korean: 향품
  alternatives_korean:
  - 향신료
  - 향기로운 향품
  lexicon: HALOT
  rationale: 제의적 준비물로 쓰이는 향료들을 가리키므로, 음식용 느낌이 강한 ‘향신료’보다 성막·제의 맥락에 맞는 ‘향품’이 더 적절합니다.
- source_word: קְטֹרֶת הַסַּמִּים
  english_pob_choice: fragrant incense
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 향품의 향
  - 향료로 만든 향
  lexicon: HALOT
  rationale: 이 구절은 문자적으로 ‘향품의 향’이지만, 한국어에서는 자연스럽고 의미를 보존하는 방식으로 ‘향기로운 향’이라 옮겼습니다.
