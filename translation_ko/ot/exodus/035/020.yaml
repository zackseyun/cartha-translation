reference: Exodus 35:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּֽצְא֛וּ כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/לִּ/פְנֵ֥י מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/020.yaml
  text: Then all the congregation of the sons of Israel went out from before Moses[a][b].
  footnotes:
  - marker: a
    text: Or 'the assembly' for 'the congregation.'
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'the children of Israel'; alternatively, 'the Israelites.' The Hebrew is literally 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 자손의 모든 회중이 모세 앞에서 나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  english_pob_choice: Then ... went out
  chosen_korean: 나갔습니다
  alternatives_korean:
  - 떠났습니다
  - 물러났습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 wayyiqtol의 순차적 힘을 살리되, 한국어에서는 가장 자연스러운 동사인 ‘나가다’를 사용했습니다.
- source_word: כָּל עֲדַת
  english_pob_choice: all the congregation
  chosen_korean: 모든 회중
  alternatives_korean:
  - 온 회중
  - 온 공동체
  lexicon: HALOT
  rationale: כָּל의 총체성을 ‘모든’으로, עֲדָה의 집합적 의미를 ‘회중’으로 옮겨 공동체로 모인 이스라엘의 전체성을 드러냈습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 구성형을 그대로 살려 ‘이스라엘 자손’으로 옮겼습니다. 전통적 표현이지만 원문의 형식을 잘 보존합니다.
- source_word: מִלִּפְנֵי
  english_pob_choice: from before
  chosen_korean: 모세 앞에서
  alternatives_korean:
  - 모세의 앞에서
  - 모세의 존재 앞에서
  lexicon: HALOT
  rationale: 직역하면 ‘~앞에서’라는 공간적 관용구이므로, 자연스러운 한국어로 ‘모세 앞에서’라고 옮겨 원문의 관계를 보존했습니다.
