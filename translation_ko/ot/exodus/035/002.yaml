id: EXO.35.2
reference: Exodus 35:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י יִהְיֶ֨ה לָ/כֶ֥ם קֹ֛דֶשׁ שַׁבַּ֥ת שַׁבָּת֖וֹן לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֥ה ב֛/וֹ מְלָאכָ֖ה יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
  footnotes:
  - marker: a
    text: Or 'a Sabbath of solemn rest.' The Hebrew expression 'Sabbath, sabbath-rest' intensifies the idea of full cessation from work.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''to the LORD''; also possible: ''for the LORD'' or ''belonging to the LORD.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 엿새 동안은 일을 할 수 있으나, 일곱째 날은 너희에게 거룩한 날, 곧 야훼께 드리는[b] 온전한 안식일[a]입니다. 그 날에 일을 하는 사람은 누구든지 죽임을 당할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온전한 안식일’은 히브리어 ‘안식일, 안식의 쉼’이라는 결합 표현을 옮긴 것입니다. 이 표현은 일을 온전히 그치는 쉼을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘야훼에게/야훼를 위하여’입니다. 이 말은 그 안식일이 야훼께 바쳐진 날이거나 야훼께 속한 날이라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  english_pob_choice: Work may be done
  chosen_korean: 일이 이루어질 수 있으나
  alternatives_korean:
  - 일을 할 수 있으나
  - 일이 행해질 수 있으나
  lexicon: HALOT
  rationale: עשה의 수동형과 מְלָאכָה의 일반적 의미를 살려, 특정 주어를 세우지 않는 법령식 표현으로 옮겼습니다. '이루어질 수 있으나'는 허용문과 수동의 뉘앙스를 함께 유지합니다.
- source_word: שַׁבַּת שַׁבָּתוֹן
  english_pob_choice: a holy Sabbath, a complete rest
  chosen_korean: 거룩한 안식일이 있어야 합니다. 곧 … 완전한 안식일입니다
  alternatives_korean:
  - 거룩한 안식의 안식일이 있어야 합니다
  - 완전한 쉼의 안식일입니다
  - 엄숙한 안식일입니다
  lexicon: HALOT
  rationale: שַׁבַּת שַׁבָּתוֹן의 강조를 '완전한 안식일'로 살려, 단순한 휴식보다 전면적 중지를 드러냈습니다. '거룩한'은 קֹדֶשׁ의 상태를 보존합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼를 위한
  alternatives_korean:
  - 야훼께
  - 야훼께 속한
  - 야훼를 향한
  lexicon: HALOT
  rationale: 전치사 ל의 헌납/지향 의미를 살려, 안식일이 야훼께 바쳐지고 그분께 속한 날임을 드러냈습니다. 본문에는 POB의 축적된 용례에 따라 야훼를 유지했습니다.
- source_word: יוּמָת
  english_pob_choice: shall surely be put to death
  chosen_korean: 반드시 죽임을 당해야 합니다
  alternatives_korean:
  - 반드시 죽어야 합니다
  - 죽임을 당할 것입니다
  - 사형을 받아야 합니다
  lexicon: HALOT
  rationale: 법적 제재의 강한 공문체를 살리면서도, 히브리어 수동형의 직설성을 유지하기 위해 '죽임을 당해야 합니다'로 옮겼습니다. '사형'은 현대적이지만 본문의 수동 표현을 약화시킬 수 있습니다.
theological_decisions:
- issue: 안식일의 소유/지향을 나타내는 לַיהוָה의 처리
  chosen_reading: ‘야훼를 위한’으로 옮겨, 단순한 시간표시가 아니라 그 날이 야훼께 헌정된 날임을 드러냈습니다.
  alternative_readings:
  - ‘야훼께’
  - ‘야훼의’
  - ‘야훼에게 속한’
  rationale: 문맥상 안식일의 성격은 단순히 야훼와 관련된 것이 아니라 야훼께 바쳐진 거룩한 날이라는 점이 핵심이므로, 지향성과 헌납성을 함께 드러내는 번역을 택했습니다.
  doctrine_reference: 토라의 안식일 규례와 הקדש(거룩하게 구별됨)의 개념
- issue: 엿새/제칠일의 대조와 법령체 유지
  chosen_reading: '''엿새 동안은 … 제칠일에는 … 있어야 합니다''로 법규의 대조 구조를 살렸습니다.'
  alternative_readings:
  - '''여섯 날 동안'''
  - '''일곱째 날에는'''
  - '''그러나''를 더 강하게 표시하는 방식'
  rationale: 원문의 대조는 일정한 노동 가능 기간과 제칠일의 거룩한 중지를 대비시키는 법령 구조이므로, 한국어에서도 그 대비가 분명히 드러나도록 했습니다.
  doctrine_reference: 안식일 규례의 법적·언약적 성격
