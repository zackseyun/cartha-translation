source:
  edition: WLC
  text: וְ/עַתָּ֗ה שָׂ֣א נָ֤א חַטָּאתִ/י֙ אַ֣ךְ הַ/פַּ֔עַם וְ/הַעְתִּ֖ירוּ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יָסֵר֙ מֵֽ/עָלַ֔/י רַ֖ק אֶת הַ/מָּ֥וֶת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
  footnotes:
  - marker: a
    text: Or 'bear away my sin' or 'pardon my sin.' The Hebrew idiom literally uses 'lift/bear' with 'sin' as its object.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''this death.'' Pharaoh likely refers to the present deadly plague and its effects.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러니 이제, 부디 한 번만 내 죄를 용서해 주십시오. 그리고 야훼 당신들의 하나님께 간구하여, 이 죽음만은 내게서 거두어 가게 해 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘내 죄를 들어/지다’라는 관용구를 씁니다. 문맥상 ‘용서하다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이 죽음’입니다. 여기서는 현재 닥친 치명적인 재앙을 가리키는 말로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러니 이제
  alternatives_korean:
  - 그리고 이제
  - 이제
  lexicon: HALOT
  rationale: 급박한 요청의 흐름을 자연스럽게 이어 주는 담화 표지로 옮겼습니다.
- source_word: שָׂא נָא חַטָּאתִי
  english_pob_choice: please forgive my sin
  chosen_korean: 부디 한 번만 내 죄를 용서해 주십시오
  alternatives_korean:
  - 부디 내 죄를 덮어 주십시오
  - 부디 내 죄를 용서하십시오
  lexicon: HALOT
  rationale: ‘죄를 지다/용서하다’의 한국어 관용을 살리되, נָשָׂא의 관용적 의미를 문맥에 맞게 ‘용서해 주십시오’로 풀었습니다. נָא는 공손한 간청을 나타내므로 ‘부디’로 반영했습니다.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신들의 하나님께
  alternatives_korean:
  - 야훼 너희의 하나님께
  - 여호와 당신들의 하나님께
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신명기적 고유명사 יהוה를 ‘야훼’로 옮기고, Pharaoh가 ‘당신들의 하나님’이라고 거리 두는 점을 살렸습니다.
- source_word: וְיָסֵר מֵעָלַי רַק אֶת הַמָּוֶת הַזֶּה
  english_pob_choice: that he may remove from me this death only
  chosen_korean: 이 죽음만은 내게서 거두어 가게 해 주십시오
  alternatives_korean:
  - 이 죽음만은 내게서 제거하게 해 주십시오
  - 이 죽음만은 내게서 떠나가게 해 주십시오
  lexicon: HALOT
  rationale: ‘거두어 가다’는 제거·철수의 동작을 자연스럽게 담으면서도, 히브리어의 제한적 표현 ‘이 죽음만은’과 문맥상 임박한 재앙을 반영합니다.
