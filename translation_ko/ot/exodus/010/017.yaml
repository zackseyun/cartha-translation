  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
  footnotes:
  - marker: a
    text: Or 'bear away my sin' or 'pardon my sin.' The Hebrew idiom literally uses 'lift/bear' with 'sin' as its object.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''this death.'' Pharaoh likely refers to the present deadly plague and its effects.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러니 이제, 부디 이번 한 번만 내 죄를 용서해 주십시오.[a] 야훼, 당신들의 하나님께서 이 죽음만을 내게서 없애 주시도록 간구해 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 죄를 들어 올리다/짊어지다’라는 표현을 씁니다. 이 문맥에서는 죄를 용서하거나 없애 주는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘이 죽음’입니다. 여기서는 현재 닥친 치명적인 재앙과 그 영향을 가리키는 말로 보입니다.
    reason: lexical_alternative
