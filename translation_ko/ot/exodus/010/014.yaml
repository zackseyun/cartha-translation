  rationale: 원문의 동작 순서(올라옴, 전 지역에 내려앉음)와 과거·미래의 유례없음이라는 대구를 보존했습니다. כָּבֵד מְאֹד는 한국어 본문에서 문맥상 자연스러운 ‘그 수가 매우 많았습니다’로 옮기고, 문자적 표현 및 의미 범위는 각주로 보완했습니다. 영어 감사 기록의 ‘severe’ 해석도 각주에서 ‘심각성’이라는 의미 범위로 보존하되, 원문에 명시되지 않은 ‘swarm’을 본문의 술어 명사로 덧붙이지 않았습니다.
