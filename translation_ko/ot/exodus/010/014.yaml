id: EXO.10.14
reference: Exodus 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣עַל הָֽ/אַרְבֶּ֗ה עַ֚ל כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יָּ֕נַח בְּ/כֹ֖ל גְּב֣וּל מִצְרָ֑יִם כָּבֵ֣ד מְאֹ֔ד לְ֠/פָנָי/ו לֹא הָ֨יָה כֵ֤ן אַרְבֶּה֙ כָּמֹ֔/הוּ וְ/אַחֲרָ֖י/ו לֹ֥א יִֽהְיֶה כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
  footnotes:
  - marker: a
    text: Hebrew literally, 'very heavy.' The expression describes the locust invasion as exceptionally weighty or severe.
    reason: lexical_alternative
translation:
  language: ko
  text: 메뚜기들이 온 이집트 땅 위로 올라와 이집트의 온 지역에 내려앉았으니, 매우 심한 것이었습니다. 그와 같은 메뚜기는 이전에도 없었고, 그 후에도 다시는 없을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: came up
  chosen_korean: 올라와
  alternatives_korean:
  - 올라갔고
  - 올랐고
  lexicon: HALOT
  rationale: עלה의 기본 이미지를 살리되, 메뚜기 재앙이 땅 위로 퍼져 나오는 장면에 자연스럽게 맞게 ‘올라와’로 옮겼습니다.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  english_pob_choice: in every territory of Egypt
  chosen_korean: 이집트의 온 지역에
  alternatives_korean:
  - 이집트의 모든 경계 안에
  - 이집트의 모든 영토에
  lexicon: HALOT
  rationale: גְּבוּל은 여기서 단순한 국경선보다 국가 전역을 가리키므로, 분포성을 살린 ‘온 지역’이 가장 자연스럽습니다.
- source_word: כָּבֵד מְאֹד
  english_pob_choice: an extremely severe swarm
  chosen_korean: 매우 심한 것이었습니다
  alternatives_korean:
  - 지극히 무거운 것이었습니다
  - 매우 ծանր한 떼였습니다
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘무겁다’는 한국어에서 어색하므로, 재앙의 강도와 압도성을 드러내는 ‘매우 심한’으로 처리했습니다. 영어 본문의 ‘swarm’은 원문에 없는 명시적 명사이므로 한국어에서도 보탤 때는 문장 전체에 녹여 두었습니다.
- source_word: לְפָנָיו
  english_pob_choice: before it
  chosen_korean: 그와 같은
  alternatives_korean:
  - 그 이전의
  - 그 앞의
  lexicon: HALOT
  rationale: 지시대명사식 반복을 한국어에서는 ‘그와 같은’으로 풀어, 재앙의 유일무이함을 자연스럽게 연결했습니다.
theological_decisions:
- issue: 재앙의 유례없음에 대한 절대적 진술
  chosen_reading: ‘이전에도 없었고, 그 후에도 다시는 없을 것입니다’로 과거와 미래를 모두 포괄하는 대구를 유지했습니다.
  alternative_readings:
  - ‘이전에도 없고 이후에도 없을 것입니다’
  - ‘그런 메뚜기는 처음이자 마지막일 것입니다’
  rationale: 히브리어의 ‘전에도 없었고 후에도 없을 것이다’라는 대칭 구조를 그대로 드러내어 재앙의 비교 불가능성을 약화하지 않았습니다.
  doctrine_reference: 출애굽기 10:14의 본문적 강조—야훼의 심판의 유일무이함
- issue: 거대함/무거움의 표현 방식
  chosen_reading: ‘매우 심한 것’으로 옮겨 재앙의 압도적 성격을 살렸습니다.
  alternative_readings:
  - ‘몹시 무거운 것이었습니다’
  - ‘극도로 중한 것이었습니다’
  rationale: 원문의 כָּבֵד는 물리적 무게를 넘어 재앙의 중대함을 뜻하므로, 한국어 독자가 즉시 이해할 수 있는 강도 표현을 택했습니다.
  doctrine_reference: 출애굽기 10장 재앙 서술의 수사적 강조
