  naturalness: ‘온 이집트 땅 위로’보다 ‘이집트 온 땅에’가 현대 한국어에서 더 자연스럽습니다. 또한 ‘그와 같은 메뚜기’는 단수·복수 및 비교 대상이 다소 어색하므로 ‘그와 같은 메뚜기 떼’로 통일했습니다. 전체 문장을 현대적이면서도 격식을 갖춘 합쇼체 서술로 정리했습니다.
