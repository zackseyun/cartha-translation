  - severity: low
    issue: ‘완강하게 하셨고’보다 ‘완고하게 하셨으나’가 ‘마음’을 목적어로 한 한국어 성경 문체에 더 자연스럽습니다.
    rationale: 두 표현 모두 원문의 문맥상 ‘hardened’를 전달할 수 있으나, ‘마음을 완고하게 하다’가 더 통상적이며 뒤 절의 불응과의 대조도 자연스럽게 드러냅니다.
