  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
  footnotes:
  - marker: a
    text: Or 'made Pharaoh’s heart firm/strong.' The Hebrew verb can mean 'strengthen' or 'make firm,' but in this context with 'heart' it carries the sense 'harden.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he refused to let them go.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서 바로의 마음을 완고하게 하셨으나, 바로는 그들을 보내 주려 하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로의 마음을 강하게 하셨다’ 또는 ‘굳게 하셨다.’ 히브리어 동사는 본래 ‘강하게 하다, 굳게 하다’를 뜻하지만, 이 문맥에서 ‘마음’을 목적어로 할 때에는 완고하게 하셨다는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 보내 주기를 원하지 않았습니다’ 또는 ‘그들을 보내 주기를 거절했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק יְהוָה
  english_pob_choice: Yahweh hardened
  chosen_korean: 야훼께서 … 마음을 완강하게 하셨고
  alternatives_korean:
  - 마음을 강하게 하셨고
  - 마음을 굳게 하셨고
  lexicon: HALOT
  rationale: חזק은 본래 ‘강하게 하다, 굳게 하다’의 뜻이지만, 출애굽기의 반복되는 ‘마음 완강화’ 공식에서는 결과적으로 완강하게 만드는 의미가 분명하므로 자연스럽고 직설적인 ‘완강하게 하셨고’로 옮겼습니다.
- source_word: לֵב פַּרְעֹה
  english_pob_choice: Pharaoh’s heart
  chosen_korean: 바로의 마음
  alternatives_korean:
  - 바로의 심장
  - 바로의 속마음
  lexicon: HALOT
  rationale: לֵב는 히브리어 인류학에서 의지와 성향을 포함하는 ‘마음’의 관용 표현이므로, 본문의 반복 구조를 살리기 위해 ‘마음’으로 번역했습니다.
- source_word: לֹא אָבָה
  english_pob_choice: was not willing
  chosen_korean: 그는 … 하려고 하지 않았습니다
  alternatives_korean:
  - 그는 원하지 않았습니다
  - 그는 거절했습니다
  lexicon: HALOT
  rationale: אָבָה는 단순한 거절보다 ‘기꺼이 하려 하지 않음, 원치 않음’의 뉘앙스가 있어, 행위 의사를 드러내는 한국어 표현으로 옮겼습니다.
- source_word: לְשַׁלְּחָם
  english_pob_choice: to let them go
  chosen_korean: 그들을 가게 하려고
  alternatives_korean:
  - 그들을 놓아주려고
  - 그들을 보내 주려고
  lexicon: HALOT
  rationale: 이 문맥의 שׁלח는 출발을 허락한다는 관용적 의미이므로, 출애굽 반복 어구를 살리면서도 한국어로 자연스러운 ‘가게 하다’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 주권적 완강화와 바로의 의지
  chosen_reading: 야훼께서 바로의 마음을 완강하게 하셨고, 그는 그들을 가게 하려고 하지 않았습니다.
  alternative_readings:
  - 야훼께서 바로의 마음을 강하게 하셨고, 그래서 그는 그들을 보내려 하지 않았습니다
  rationale: 히브리어는 야훼의 행위와 바로의 불응을 함께 진술하므로, 원문의 신학적 긴장을 완화하지 않고 두 절을 그대로 병렬로 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
