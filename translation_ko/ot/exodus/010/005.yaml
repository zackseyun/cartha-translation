  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/לֹ֥א יוּכַ֖ל לִ/רְאֹ֣ת אֶת הָ/אָ֑רֶץ וְ/אָכַ֣ל אֶת יֶ֣תֶר הַ/פְּלֵטָ֗ה הַ/נִּשְׁאֶ֤רֶת לָ/כֶם֙ מִן הַ/בָּרָ֔ד וְ/אָכַל֙ אֶת כָּל הָ/עֵ֔ץ הַ/צֹּמֵ֥חַ לָ/כֶ֖ם מִן הַ/שָּׂדֶֽה־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
  footnotes:
  - marker: a
    text: Literally, 'the eye of the land,' a Hebrew idiom for the visible surface of the land.
    reason: lexical_alternative
  - marker: b
    text: Or 'the remnant that escaped, which remains for you from the hail.'
    reason: alternative_reading
translation:
  language: ko
  text: 그것은 땅의 지표면[a]을 덮어 땅을 볼 수 없게 할 것이며, 우박으로부터 살아남아 여러분에게 남아 있는 나머지[b]를 먹고, 들에서 여러분을 위해 자라는 모든 나무를 먹을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘땅의 눈’이지만, 히브리어 관용구는 가시적인 지표면을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우박을 피하여 여러분에게 남아 있는 남은 것’.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  english_pob_choice: And it will cover
  chosen_korean: 뒤덮어서
  alternatives_korean:
  - 덮어서
  - 가릴 것이며
  lexicon: HALOT
  rationale: כסה의 ‘덮다/가리다’는 뜻을 살리되, 메뚜기 떼의 대량적·압도적 이미지를 드러내기 위해 ‘뒤덮다’를 택했습니다.
- source_word: עֵין הָאָרֶץ
  english_pob_choice: the surface of the land
  chosen_korean: 땅의 표면
  alternatives_korean:
  - 땅의 눈
  - 땅의 면
  - 땅의 겉면
  lexicon: HALOT
  rationale: 직역하면 ‘땅의 눈’이지만, 히브리어 관용구의 의미는 가시적인 지표면이므로 한국어에서는 자연스러운 ‘땅의 표면’으로 옮겼습니다.
- source_word: יֶתֶר הַפְּלֵטָה הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  english_pob_choice: what remains of the survivors left to you from the hail
  chosen_korean: 우박에서 여러분에게 남은 피난한 것의 나머지
  alternatives_korean:
  - 우박에서 여러분에게 남은 도망친 것들의 나머지
  - 우박에서 살아남아 여러분에게 남은 나머지
  lexicon: HALOT
  rationale: פְּלֵטָה는 ‘피난, 살아남음’의 뉘앙스를 가지므로 ‘피난한 것’으로 살렸고, יֶתֶר는 ‘나머지’로, הַנִּשְׁאֶרֶת는 ‘남은’으로 반영해 남겨진 잔존분이라는 구조를 유지했습니다.
- source_word: כָּל הָעֵץ הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  english_pob_choice: every tree growing for you out of the field
  chosen_korean: 들에서 여러분을 위해 자라나는 나무마다
  alternatives_korean:
  - 밭에서 여러분을 위해 자라는 모든 나무
  - 들판에서 여러분에게 자라는 나무마다
  lexicon: HALOT
  rationale: עץ를 문맥상 단수 집합이 아닌 분배적 의미로 받아 ‘나무마다’로 옮겼고, צֹמֵחַ는 현재분사로서 진행성을 살려 ‘자라나는’으로 반영했습니다.
theological_decisions:
- issue: 메뚜기 떼의 주체를 가리키는 대명사 처리
  chosen_reading: ‘그것은’으로 옮겨, 메뚜기 떼를 집합적 단수로 받았습니다.
  alternative_readings:
  - ‘그들은’으로 옮길 수 있음
  - 주어를 명시하지 않고 수동적으로 처리할 수 있음
  rationale: 히브리어 동사는 단수형이므로 한국어에서도 집합적 단수 대명사를 사용해 원문의 문법적 형식을 보존했습니다.
  doctrine_reference: 문법-의미 일치
