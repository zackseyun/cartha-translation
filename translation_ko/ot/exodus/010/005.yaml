  to: 그것은 땅의 지표면[a]을 덮어 땅을 볼 수 없게 할 것이며, 우박으로부터 살아남아 여러분에게 남아 있는 나머지[b]를 먹고, 들에서 여러분을 위해 자라는 모든 나무를 먹을 것입니다.
