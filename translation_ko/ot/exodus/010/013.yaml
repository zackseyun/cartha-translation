  - severity: medium
    issue: 각주 표지가 ‘메뚜기들’ 뒤에 놓임
    rationale: 각주의 내용은 רוּחַ קָדִים(동풍)의 번역 대안이므로 해당 표현 바로 뒤에 표지해야 합니다.
  - severity: low
    issue: ‘내밀자’로 처리한 문장 연결
    rationale: 원문의 연속된 와우 서술을 독립문으로 옮기면 모세의 행위와 야훼의 행위를 더 직접적으로 보존할 수 있습니다.
