  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
  footnotes:
  - marker: a
    text: Or 'a wind from the east.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 자기 지팡이를 이집트 땅 위로 내밀었습니다. 그러자 야훼께서 그 땅 위로 동풍[a]을 몰아가셨습니다. 그날 내내, 밤새도록 그렇게 하셨습니다. 아침이 되자 동풍이 메뚜기 떼를 실어 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동쪽에서 불어오는 바람’입니다.
    reason: רוּחַ קָדִים의 방향 표현에 대한 어휘적 대안입니다.
lexical_decisions:
- source_word: וַיֵּט / מַטֵּהוּ
  english_pob_choice: stretched out / his staff
  chosen_korean: 자기 지팡이를 내밀자
  alternatives_korean:
  - 지팡이를 뻗자
  - 지팡이를 펼치자
  lexicon: HALOT
  rationale: נטה는 ‘펼치다/내밀다’의 뜻이 가능하며, 출애굽기의 반복 구문에서 모세의 동작을 자연스럽고 생생하게 살리기 위해 ‘내밀다’를 택했습니다.
- source_word: עַל אֶרֶץ מִצְרַיִם / בָּאָרֶץ
  english_pob_choice: over the land of Egypt / over the land
  chosen_korean: 이집트 땅 위로 / 그 땅 위에
  alternatives_korean:
  - 이집트 땅에
  - 이집트 땅에 걸쳐
  lexicon: HALOT
  rationale: עַל은 지팡이 동작과 바람의 진행을 함께 보여 주므로, 단순한 ‘에’보다 ‘위로/위에’가 원문의 공간적 감각을 더 잘 드러냅니다.
- source_word: נִהַג רוּחַ קָדִים
  english_pob_choice: drove an east wind
  chosen_korean: 동풍을 … 몰아가셨습니다
  alternatives_korean:
  - 동풍을 … 불게 하셨습니다
  - 동쪽에서 온 바람을 … 몰아가셨습니다
  lexicon: HALOT
  rationale: נהג는 ‘몰다/몰아가다’의 동사성이 강하므로, 바람을 단순히 ‘불게 하다’보다 야훼의 능동적 주도성을 살리는 ‘몰아가다’가 더 가깝습니다.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  english_pob_choice: all that day and all the night
  chosen_korean: 온종일과 온밤 내내
  alternatives_korean:
  - 그날 내내와 그 밤 내내
  - 온종일과 온밤을
  lexicon: HALOT
  rationale: 반복된 ‘כל’의 강조를 살리면서도 한국어에서 자연스럽게 이어지도록 ‘온종일과 온밤 내내’로 옮겼습니다.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  english_pob_choice: had brought the locusts
  chosen_korean: 메뚜기들을 날라갔습니다
  alternatives_korean:
  - 메뚜기들을 옮겼습니다
  - 메뚜기들을 가져갔습니다
  lexicon: HALOT
  rationale: נשא는 문맥상 바람이 메뚜기 떼를 실어 나른다는 뜻이므로, 한국어에서는 ‘날라가다/날라가게 하다’가 장면을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 용례에 따라 신명기적 언약명은 ‘야훼’로 옮겨, 본문의 고유한 하나님의 이름을 분명히 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
