source:
  edition: WLC
  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
  footnotes:
  - marker: a
    text: Or, “how I made a mockery of Egypt.” The Hebrew verb can emphasize humiliating Egypt as well as dealing severely with it.
    reason: lexical_alternative
  - marker: b
    text: Or, “and you will know that I am the LORD.”
    reason: alternative_reading
translation:
  language: ko
  text: 이는 네가 네 아들과 네 손자에게 내가 이집트를 어떻게 가혹하게 다룬 일과 내가 그들 가운데 둔 내 표징들을 이야기하고, 너희가 내가 야훼임을 알게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 이집트를 조롱거리로 만든 일.” 히브리어 동사는 가혹한 심판뿐 아니라 이집트에 수치를 준 의미도 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “너희가 내가 야훼임을 알게 될 것입니다.” 이 절은 앞선 목적 표현에 이어지는 목적 또는 그 결과로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  english_pob_choice: so that
  chosen_korean: 그래서 … 하려는 것입니다
  alternatives_korean:
  - 이로써 … 하게 하십시오
  - 이는 … 하기 위함입니다
  lexicon: HALOT
  rationale: 목적을 나타내는 לְמַעַן의 흐름을 한국어에서 자연스럽게 살리면서, 뒤의 동사들에 걸리는 연속적 목적을 매끈하게 표현했습니다.
- source_word: בְּאָזְנֵי
  english_pob_choice: in the hearing of
  chosen_korean: 귀에
  alternatives_korean:
  - 듣는 앞에서
  - 듣는 가운데
  lexicon: HALOT
  rationale: 직역상 ‘귀에’이지만, 한국어에서는 ‘귀에 이야기하다’가 다소 낯설 수 있어 문맥상 자연한 ‘귀에 … 이야기하게 하다’로 옮겨 청각적 이미지와 전달 행위를 함께 살렸습니다.
- source_word: הִתְעַלַּלְתִּי
  english_pob_choice: I dealt harshly with
  chosen_korean: 행한 일
  alternatives_korean:
  - 가혹하게 다룬 일
  - 모욕한 일
  - 농락한 일
  lexicon: HALOT
  rationale: 이 동사는 심판의 가혹함과 수치를 함께 담지만, 한국어에서 ‘농락하다’는 경박한 뉘앙스가 강해 문맥상 적절하지 않습니다. 본문 전체를 지나치게 부드럽게 하지 않으면서도, ‘행한 일’로 하여 다음 표징들과 함께 설명되도록 했습니다.
- source_word: אֹתֹתַי
  english_pob_choice: my signs
  chosen_korean: 내 표징들
  alternatives_korean:
  - 내 징조들
  - 내 이적들
  lexicon: HALOT
  rationale: 출애굽기의 אות는 단순한 기적만이 아니라 하나님의 자기 계시적 표지라는 점이 있어, ‘표징’이 그 의미를 가장 잘 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 시리즈의 기준에 따라 여호와 대신 하나님의 고유명사 ‘야훼’를 사용해, 본문이 주장하는 언약적 자기 계시를 제목으로 바꾸지 않게 했습니다.
theological_decisions:
- issue: הִתְעַלַּלְתִּי의 심판적·수치 부여적 뉘앙스
  chosen_reading: ‘내가 이집트에 행한 일’로 옮겨 심판의 실제 행위를 드러내되, 본문 주석 없이도 그 행위가 가혹함과 수치를 포함함을 남겨 둡니다.
  alternative_readings:
  - ‘내가 이집트를 가혹하게 다룬 일’
  - ‘내가 이집트를 농락한 일’
  rationale: 출애굽 재앙은 단순한 조롱이 아니라 실제 심판 행위이므로, 한국어에서 경박하거나 과도한 해석으로 흐르지 않도록 조정했습니다. 동시에 원문의 긴장—가혹함과 굴욕—은 보존됩니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
- issue: וִידַעְתֶּם의 목적/결과 뉘앙스
  chosen_reading: ‘또 내가 야훼임을 너희가 알게 하려는 것입니다’
  alternative_readings:
  - ‘또 내가 야훼임을 너희가 알게 될 것입니다’
  - ‘또 내가 야훼임을 너희가 알도록 하려는 것입니다’
  rationale: 문맥상 לְמַעַן으로 시작한 목적절이 이어지므로 목적적 의미를 살렸습니다. 다만 결과의 뉘앙스도 완전히 지우지 않도록 ‘알게 하려는 것입니다’로 표현했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
