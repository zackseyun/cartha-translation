    text: '히브리어: “누구와 누구가 가는 것입니까?”—누가 허락되어 갈지 구체적으로 특정하라는 관용구입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוּשַׁב
  english_pob_choice: were brought back
  chosen_korean: 다시 불려 왔고
  alternatives_korean:
  - 다시 데려왔고
  - 되돌려졌고
  lexicon: HALOT
  rationale: 히필/수동적 사역형의 ‘다시 돌아오게 됨’을 자연스럽게 살리면서, 문맥상 파라오 앞으로 소환된 상황을 반영했습니다.
- source_word: עִבְדוּ
  english_pob_choice: serve
  chosen_korean: 섬기십시오
  alternatives_korean:
  - 봉사하십시오
  - 예배하십시오
  lexicon: HALOT
  rationale: 이 동사는 하나님께 대한 섬김을 뜻하므로, 예배로만 좁히지 않고 종교적·언약적 섬김을 함께 담는 ‘섬기다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유신명사를 한국어 목표 용례에 따라 ‘야훼’로 옮겨, 호칭어 ‘주님’으로 바꾸지 않았습니다.
- source_word: מִי וָמִי הַהֹלְכִים
  english_pob_choice: Who are the ones going?
  chosen_korean: 누구와 누구가 갈 것입니까?
  alternatives_korean:
  - 누가 갈 것입니까?
  - 누구누구가 갈 것입니까?
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘누구와 누구’는 동행할 자들을 정확히 특정하라는 요구를 드러내므로, 그 어감을 살려 문장에 반영했습니다.
