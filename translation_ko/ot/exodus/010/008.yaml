  text: 그러자 모세와 아론이 파라오에게 다시 불려 왔고, 그가 그들에게 말했습니다. “가서 야훼 너희 하나님을 섬기십시오. 누구와 누구가 갈 것입니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
