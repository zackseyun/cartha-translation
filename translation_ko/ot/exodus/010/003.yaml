    rationale: וְיַעַבְדֻנִי는 ‘내 백성을 보내라’의 목적, 곧 ‘그들이 나를 섬기도록’입니다. ‘그들이 나를 섬기게 하려는 것이다’는 누가 의도하는지 불분명하고 원문의 명령-목적 연결을 약화합니다.
