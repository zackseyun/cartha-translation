    rationale: 초안의 b는 שַׁלַּח(보내라)에 관한 설명이지만, 영어 POB의 b와 원래의 어휘적 쟁점은 וְיַעַבְדֻנִי(섬기다/예배하다)입니다. 앵커도 해당 동사 뒤에 두어야 합니다.
