base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
  footnotes:
  - marker: a
    text: Or 'submit to me.' The Hebrew verb can carry the sense of being humbled or humbling oneself before God.
    reason: lexical_alternative
  - marker: b
    text: Or 'so that they may worship me.' The Hebrew verb also includes the sense of cultic service or worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세와 아론이 바로에게 들어가 그에게 말했습니다. “히브리 사람들의 하나님 야훼께서 이렇게 말씀하신다. ‘네가 언제까지 내 앞에서 스스로 낮추기를 거부하겠느냐? 내 백성을 보내라. 그들이 나를 섬기도록 하라.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스스로 낮추다’로 옮긴 히브리어 동사는 문맥에 따라 ‘내 앞에서 겸손해지다’ 또는 ‘내게 복종하다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘섬기다’로 옮긴 히브리어 동사는 이 문맥에서 하나님께 드리는 예배 또는 예배적 섬김을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל פַּרְעֹה
  english_pob_choice: went in to Pharaoh
  chosen_korean: 바로에게 가서
  alternatives_korean:
  - 바로에게 들어가서
  - 바로 앞에 나아가서
  lexicon: HALOT
  rationale: 궁정 문맥의 ‘왕에게 들어가다/나아가다’ 뉘앙스를 살리면서도 현대 한국어에서는 가장 자연스럽고 간결한 동작 표현으로 옮겼습니다.
- source_word: מֵאַנְתָּ לֵעָנֹת מִפָּנָי
  english_pob_choice: will you refuse to humble yourself before me
  chosen_korean: 내 앞에서 스스로 낮아지기를 거부하겠느냐
  alternatives_korean:
  - 내 앞에서 겸손해지기를 거부하겠느냐
  - 내 앞에서 굴복하기를 거부하겠느냐
  lexicon: HALOT
  rationale: לֵעָנֹת의 핵심은 단순 복종보다 ‘자기를 낮추다/겸손해지다’에 가깝고, POB의 주해가 지적한 내적·관계적 낮아짐을 한국어 동사구로 드러내기 위해 ‘스스로 낮아지다’를 택했습니다.
- source_word: שַׁלַּח עַמִּי
  english_pob_choice: Let my people go
  chosen_korean: 내 백성을 보내라
  alternatives_korean:
  - 내 백성을 놓아주라
  - 내 백성을 풀어주라
  lexicon: HALOT
  rationale: 출애굽기의 반복되는 명령 공식이므로, 기존 한국어 교회어보다 원문에 가까운 동사 ‘보내다’를 사용해 명령의 직설성과 해방 요구를 유지했습니다.
- source_word: וְיַעַבְדֻנִי
  english_pob_choice: so that they may serve me
  chosen_korean: 그들이 나를 섬기게 하려는 것이다
  alternatives_korean:
  - 그들이 나를 섬기도록 하려는 것이다
  - 그들이 나를 예배하게 하려는 것이다
  lexicon: HALOT
  rationale: עבד의 의미 범위를 따라 ‘섬기다’를 기본으로 두고, POB가 주해한 예배 가능성은 본문 의미를 좁히지 않도록 본문 안에서는 유지하지 않았습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명은 대체 칭호로 바꾸지 않고 POB 원칙에 따라 고유명으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하나님께 직접 말하는 인용문 안의 어조
  chosen_reading: 합쇼체 서술 + 인용문 내부는 직설형 명령/질문
  alternative_readings:
  - 인용문까지 전면 합쇼체
  - 보다 완곡한 간접화법
  rationale: 서술은 현대 표준 합쇼체로 유지하되, 야훼의 직접 발화는 원문의 명령과 책망의 강도를 살리기 위해 직설형과 명령형을 그대로 반영했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
