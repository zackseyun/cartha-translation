source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה בִּ/נְעָרֵ֥י/נוּ וּ/בִ/זְקֵנֵ֖י/נוּ נֵלֵ֑ךְ בְּ/בָנֵ֨י/נוּ וּ/בִ/בְנוֹתֵ֜/נוּ בְּ/צֹאנֵ֤/נוּ וּ/בִ/בְקָרֵ֨/נוּ֙ נֵלֵ֔ךְ כִּ֥י חַג יְהוָ֖ה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: ko
  text: 모세가 말했습니다. 「우리는 우리 젊은이들과 우리 노인들, 우리 아들들과 우리 딸들, 우리 양 떼와 우리 소 떼를 데리고 가겠습니다. 우리가 야훼께 드릴 절기[a]를 지켜야 하기 때문입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חַג는 단순한 파티가 아니라 지정된 종교 절기입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בִּ/נְעָרֵ֥י/נוּ וּ/בִ/זְקֵנֵ֖י/נוּ
  english_pob_choice: our young and our old
  chosen_korean: 우리 자녀들과 우리 노인들
  alternatives_korean:
  - 우리 젊은이들과 우리 늙은이들
  - 우리 젊은 세대와 우리 연장자들
  lexicon: נַעַר / זָקֵן
  rationale: 나이 대비를 살리되 한국어에서 자연스럽고 포괄적으로 들리도록 ‘자녀들’과 ‘노인들’로 옮겼습니다. ‘young/old’의 단순 연령 대비를 유지하는 것이 핵심입니다.
- source_word: בְּ/בָנֵ֨י/נוּ וּ/בִ/בְנוֹתֵ֜/נוּ
  english_pob_choice: our sons and our daughters
  chosen_korean: 우리 아들들과 우리 딸들
  alternatives_korean:
  - 우리 아들과 우리 딸
  - 우리 자녀들
  lexicon: בֵּן / בַּת
  rationale: 히브리어의 아들/딸 병렬을 직접 반영하여 가족 전체를 분명히 드러냈습니다. ‘자녀들’로 합치면 원문의 병렬성이 약해집니다.
- source_word: בְּ/צֹאנֵ֤/נוּ וּ/בִ/בְקָרֵ֨/נוּ֙
  english_pob_choice: with our flocks and our herds
  chosen_korean: 우리 양 떼와 우리 소 떼
  alternatives_korean:
  - 우리 가축 떼와 우리 소 떼
  - 우리 양과 소
  lexicon: צֹאן / בָּקָר
  rationale: 목축의 두 범주를 구분해 원문의 대비를 유지했습니다. 한국어에서도 ‘양 떼/소 떼’가 가장 직접적으로 대응합니다.
- source_word: חַג יְהוָ֖ה
  english_pob_choice: a feast to the LORD
  chosen_korean: 야훼께 절기를 지켜야
  alternatives_korean:
  - 주께 절기를 지켜야
  - 야훼께 명절을 지켜야
  lexicon: חַג / יְהוָה
  rationale: חַג는 단순한 ‘잔치’보다 규정된 종교 절기라는 뜻이 강해 ‘절기’를 택했습니다. YHWH는 프로젝트 기본어인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 희생제/예배 행위의 강도
  chosen_reading: ‘절기를 지켜야’로 옮겨, 단순한 사교적 축제가 아니라 야훼께 드리는 언약적 예배 행위임을 드러냈습니다.
  alternative_readings:
  - ‘잔치를 해야 합니다’
  - ‘명절을 지켜야 합니다’
  rationale: 출애굽기 문맥에서 חַג יְהוָה는 예배적·공동체적 절기 준수를 가리키므로, 축제성만 살리기보다 종교적 의무성을 함께 보존하는 번역이 적절합니다.
  doctrine_reference: 출 5–12의 바로와 모세 대화 맥락
