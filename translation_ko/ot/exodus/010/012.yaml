source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֨ה יָדְ/ךָ֜ עַל אֶ֤רֶץ מִצְרַ֨יִם֙ בָּֽ/אַרְבֶּ֔ה וְ/יַ֖עַל עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יֹאכַל֙ אֶת כָּל עֵ֣שֶׂב הָ/אָ֔רֶץ אֵ֛ת כָּל אֲשֶׁ֥ר הִשְׁאִ֖יר הַ/בָּרָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
  footnotes:
  - marker: a
    text: Hebrew 'for/with regard to the locust'; the preposition is difficult, and more literal renderings such as 'against the locusts' or 'over the locusts' are possible.
    reason: lexical_alternative
  - marker: b
    text: Hebrew singular 'locust' with singular verbs, used collectively for the swarm; English renders the sense with the plural 'locusts' / 'they.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 모세에게 말씀하셨습니다. “네 손을 이집트 땅 위에 메뚜기를 향하여 내밀어라. 그러면 그것들이 이집트 땅 위로 올라와 그 땅의 모든 풀을, 곧 우박이 남겨 둔 모든 것을 먹어 버릴 것이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בָּאַרְבֶּה는 전치사 용법이 어려워 직역상 ‘메뚜기에게/메뚜기를 향하여/메뚜기에 관하여’ 등 여러 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘메뚜기’ 단수형과 단수 동사를 쓰지만, 집단 전체를 가리키므로 한국어에서는 복수적 재난 의미를 자연스럽게 드러냈습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 고유명사 표기
  rationale: 본문의 하나님의 이름을 대체 호칭으로 바꾸지 않고, 프로젝트 기본값에 따라 음역형인 ‘야훼’로 옮겼습니다.
- source_word: נְטֵה יָדְךָ
  english_pob_choice: Stretch out your hand
  chosen_korean: 네 손을 … 내밀어라
  alternatives_korean:
  - 네 손을 … 뻗어라
  - 네 손을 … 펴라
  lexicon: HALOT
  rationale: נטה는 여기서 몸짓을 지시하는 명령으로, 한국어에서는 ‘내밀다’가 자연스럽게 ‘stretch out’의 동작과 판결적 맥락을 살립니다.
- source_word: עַל אֶרֶץ מִצְרַיִם בָּאַרְבֶּה
  english_pob_choice: over the land of Egypt for the locusts
  chosen_korean: 이집트 땅 위에 메뚜기를 향하여
  alternatives_korean:
  - 이집트 땅 위에 메뚜기를 위해
  - 이집트 땅 위에 메뚜기에 관하여
  lexicon: HALOT
  rationale: בָּאַרְבֶּה는 문맥상 메뚜기 재앙을 가리키는 난해한 전치사 구문이므로, 과도하게 해석하지 않으면서도 대상 지시를 드러내는 ‘메뚜기를 향하여’로 처리했습니다.
- source_word: עֵשֶׂב הָאָרֶץ
  english_pob_choice: every plant of the land
  chosen_korean: 그 땅의 모든 풀
  alternatives_korean:
  - 그 땅의 모든 식물
  - 그 땅의 모든 초목
  lexicon: HALOT
  rationale: עֵשֶׂב은 넓게는 초목/식물을 가리키지만, 재앙 장면에서는 자연스럽고 포괄적인 ‘풀’이 문맥을 잘 전달합니다.
- source_word: הִשְׁאִיר הַבָּרָד
  english_pob_choice: the hail has left
  chosen_korean: 우박이 남겨 둔
  alternatives_korean:
  - 우박이 남겨 놓은
  - 우박이 남긴
  lexicon: HALOT
  rationale: הִשְׁאִיר는 ‘남기다, 남겨 두다’의 뜻이므로, 이전 재앙의 잔여를 분명히 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 명령형의 한국어 톤
  chosen_reading: 직접 명령문을 유지해 재앙 서사의 긴박함을 살렸습니다.
  alternative_readings:
  - 완곡한 청유형으로 완화
  - 서술형으로 바꾸어 정리
  rationale: 히브리어 원문은 강한 명령을 사용하므로, 한국어에서도 이를 완화하지 않고 직접적인 명령형으로 보존하는 편이 의미와 서사적 압박을 더 정확히 반영합니다.
  doctrine_reference: 본문 서술체/명령체 보존 원칙
