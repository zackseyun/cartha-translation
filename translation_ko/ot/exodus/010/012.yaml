  source_fidelity: 핵심 내용은 대체로 충실합니다. 그러나 난해한 בָּאַרְבֶּה를 ‘메뚜기를 향하여’로 확정하면 손을 뻗는 방향이 메뚜기라는 뜻으로 좁혀져, 원문의 불확실성을 충분히 보존하지 못합니다. 또한 עֵשֶׂב은 문맥상 ‘풀’보다 넓은 식생을 가리킵니다.
  naturalness: ‘이집트 땅 위에 메뚜기를 향하여 내밀어라’는 한국어 수식 관계가 다소 어색합니다. ‘메뚜기와 관련하여 이집트 땅 위로 손을 내미십시오’로 하면 현대 한국어에서 자연스러우면서도 난해한 전치사구를 과도하게 해석하지 않습니다. 합쇼체 요구에 맞추어 인용문 안의 명령과 미래 진술도 ‘내미십시오/먹을 것입니다’로 통일했습니다.
  terminology: ‘야훼’, ‘모세’, ‘이집트’, ‘우박’은 적절합니다. 집단명사 אַרְבֶּה는 한국어에서 ‘메뚜기들’로 자연스럽게 드러내고 주석으로 히브리어 단수형을 밝혔습니다. עֵשֶׂב은 ‘모든 초목’으로 옮겨 식생 전반이라는 범위를 보존했습니다.
  issues:
  - severity: medium
    issue: בָּאַרְבֶּה를 ‘메뚜기를 향하여’로 번역함
