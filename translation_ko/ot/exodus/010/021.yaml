base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''and darkness may be felt'' or possibly ''and one may feel darkness.'' The final clause uses a rare verb and emphasizes the darkness as palpable.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. 「너는 네 손을 하늘을 향해 내밀어, 이집트 땅 위에 어둠이 있게 하라. 또 그 어둠이 만져지게 하라.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 마지막 절은 희귀 동사를 사용하며, 문맥상 ‘어둠이 만져지게 하라’ 또는 ‘어둠을 느끼게 하라’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/전통적 기독교 용례
  rationale: 원문에 직접 나타난 신명호칭을 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 언약적 고유성을 보존했습니다.
- source_word: נְטֵה יָדְךָ
  english_pob_choice: Stretch out your hand
  chosen_korean: 네 손을 ... 내밀어
  alternatives_korean:
  - 네 손을 펴라
  - 네 손을 뻗어
  lexicon: HALOT
  rationale: נטה의 명령형은 손을 ‘뻗다/펴다’의 뜻이지만, 현대 한국어에서는 ‘내밀어’가 자연스럽고 동작 명령의 힘을 잘 살립니다.
- source_word: עַל הַשָּׁמַיִם
  english_pob_choice: toward the sky
  chosen_korean: 하늘을 향해
  alternatives_korean:
  - 하늘 위에
  - 하늘 쪽으로
  lexicon: HALOT
  rationale: 직역상 ‘하늘 위에/위로’에 가깝지만, 손을 드는 동작의 방향성을 살려 ‘하늘을 향해’로 옮겼습니다.
- source_word: וִיהִי חֹשֶׁךְ ... וְיָמֵשׁ חֹשֶׁךְ
  english_pob_choice: so that there may be darkness ... and the darkness may be felt
  chosen_korean: 어둠이 있게 하라. 또 그 어둠이 만져지게 하라
  alternatives_korean:
  - 어둠이 임하게 하라. 또 그 어둠이 느껴지게 하라
  - 어둠이 있게 하라. 그리고 그 어둠이 만져질 것이다
  lexicon: HALOT
  rationale: jussive의 결과/명령 뉘앙스를 ‘...있게 하라’로, दुर्लभ 동사 וְיָמֵשׁ은 본문 문맥에 따라 ‘만져지다’로 옮겨 POB의 ‘felt’ 해석을 반영했습니다.
theological_decisions:
- issue: 야훼의 직접 발화에서 명령문을 어떻게 처리할지
  chosen_reading: 하나님이 모세에게 주시는 명령을 직접화법으로 유지하고, 한국어에서도 권위 있는 명령형을 살렸습니다.
  alternative_readings:
  - 서술문으로 완화하여 '어둠이 있을 것이다'로 옮김
  - 간접화법으로 바꾸어 명령성을 약화시킴
  rationale: 히브리어 원문은 신적 명령의 강한 수행성을 드러내므로, 이를 완화하지 않고 직접 명령형으로 옮기는 편이 본문의 힘에 더 가깝습니다.
  doctrine_reference: 출애굽기 10장 문맥의 재앙 선포
