source:
  edition: WLC
  text: לֹֽא רָא֞וּ אִ֣ישׁ אֶת אָחִ֗י/ו וְ/לֹא קָ֛מוּ אִ֥ישׁ מִ/תַּחְתָּ֖י/ו שְׁלֹ֣שֶׁת יָמִ֑ים וּֽ/לְ/כָל בְּנֵ֧י יִשְׂרָאֵ֛ל הָ֥יָה א֖וֹר בְּ/מוֹשְׁבֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
  footnotes:
  - marker: a
    text: 'Hebrew literally, ''a man did not see his brother.'' The expression is reciprocal: ''they did not see one another.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'all the Israelites had light in their dwellings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 서로를 보지 못했고[a], 아무도 사흘 동안 제자리에서 일어나지 못했습니다[b]. 그러나 이스라엘 자손 모두는 자기들의 거처에 빛이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 '사람이 자기 형제를 보지 못했다'입니다. 여기서는 상호적 표현이므로 '서로를 보지 못했다'가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '아무도 자기 자리에서 일어나지 못했습니다'.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא רָאוּ ... אֶת אָחִיו
  english_pob_choice: did not see one another
  chosen_korean: 서로를 보지 못했고
  alternatives_korean:
  - 자기 형제를 보지 못했고
  - 서로 볼 수 없었고
  lexicon: HALOT
  rationale: 히브리어의 상호적 표현을 자연스러운 한국어 상호 표현으로 옮겼습니다. '형제'는 직역이지만 문맥상 넓은 의미의 서로를 가리키므로 '서로'가 더 정확합니다.
- source_word: קָמוּ
  english_pob_choice: rose
  chosen_korean: 일어나지 못했습니다
  alternatives_korean:
  - 일어나지 않았습니다
  - 일어서지 못했습니다
  lexicon: HALOT
  rationale: קום의 기본 의미를 살리되, 앞의 어둠과 마비된 상황을 한국어로 자연스럽게 드러내기 위해 '일어나지 못했습니다'로 옮겼습니다.
- source_word: הָיָה אוֹר בְּמוֹשְׁבֹתָם
  english_pob_choice: had light in their dwellings
  chosen_korean: 자기들의 거처에 빛이 있었습니다
  alternatives_korean:
  - 자기들의 거처에 빛이 있었습니다
  - 그들이 사는 곳에 빛이 있었습니다
  lexicon: HALOT
  rationale: '''had light''의 소유/가용성을 단순히 ''빛이 있었다''로 살리면서, מוֹשְׁבֹתָם는 상황상 ''거처''가 가장 적절합니다.'
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자손
  lexicon: HALOT
  rationale: 고정된 성경적 집단 명칭을 유지하되, 한국어 성경에서 널리 이해되는 '이스라엘 자손'을 사용했습니다.
