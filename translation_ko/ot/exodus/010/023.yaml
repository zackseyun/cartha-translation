  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
  footnotes:
  - marker: a
    text: 'Hebrew literally, ''a man did not see his brother.'' The expression is reciprocal: ''they did not see one another.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'all the Israelites had light in their dwellings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 서로를 보지 않았고[a], 아무도 사흘 동안 자기 자리에서 일어나지 않았습니다[b]. 그러나 이스라엘 자손 모두의 거처에는 빛이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘사람이 자기 형제를 보지 않았다’입니다. 여기서 이 표현은 상호적 의미이므로 ‘서로를 보지 않았다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그 아래에서’는 여기서 사람이 있던 자리, 곧 ‘자기 자리에서’를 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא רָאוּ ... אֶת אָחִיו
  english_pob_choice: did not see one another
  chosen_korean: 서로를 보지 못했고
  alternatives_korean:
