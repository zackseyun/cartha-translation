  - 서로 볼 수 없었고
  lexicon: HALOT
  rationale: 히브리어의 상호적 표현을 자연스러운 한국어 상호 표현으로 옮겼습니다. '형제'는 직역이지만 문맥상 넓은 의미의 서로를 가리키므로 '서로'가 더 정확합니다.
- source_word: קָמוּ
  english_pob_choice: rose
  chosen_korean: 일어나지 못했습니다
  alternatives_korean:
  - 일어나지 않았습니다
  - 일어서지 못했습니다
  lexicon: HALOT
  rationale: קום의 기본 의미를 살리되, 앞의 어둠과 마비된 상황을 한국어로 자연스럽게 드러내기 위해 '일어나지 못했습니다'로 옮겼습니다.
- source_word: הָיָה אוֹר בְּמוֹשְׁבֹתָם
  english_pob_choice: had light in their dwellings
  chosen_korean: 자기들의 거처에 빛이 있었습니다
  alternatives_korean:
  - 자기들의 거처에 빛이 있었습니다
  - 그들이 사는 곳에 빛이 있었습니다
  lexicon: HALOT
  rationale: '''had light''의 소유/가용성을 단순히 ''빛이 있었다''로 살리면서, מוֹשְׁבֹתָם는 상황상 ''거처''가 가장 적절합니다.'
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자손
  lexicon: HALOT
  rationale: 고정된 성경적 집단 명칭을 유지하되, 한국어 성경에서 널리 이해되는 '이스라엘 자손'을 사용했습니다.
