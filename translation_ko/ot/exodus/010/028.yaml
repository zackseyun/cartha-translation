source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ פַרְעֹ֖ה לֵ֣ךְ מֵ/עָלָ֑/י הִשָּׁ֣מֶר לְ/ךָ֗ אֶל תֹּ֨סֶף֙ רְא֣וֹת פָּנַ֔/י כִּ֗י בְּ/י֛וֹם רְאֹתְ/ךָ֥ פָנַ֖/י תָּמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
  footnotes:
  - marker: a
    text: Or more idiomatically, “do not see my face again” or “never see my face again.” The Hebrew is literally “do not add to seeing my face.”
    reason: lexical_alternative
  - marker: b
    text: “My face” may also be understood as “my presence,” but the Hebrew repeats “face” for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 바로 그때 바로가 그에게 말했습니다. “내게서 떠나가십시오. 조심하십시오. 다시는 내 얼굴을 보지 마십시오. 당신이 내 얼굴을 보는 날에는 반드시 죽을 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “내 얼굴 보기를 더하지 마라”에 가깝습니다. 영어 POB처럼 자연스럽게는 “다시는 내 얼굴을 보지 마십시오”로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘얼굴’은 여기서 ‘존재’로도 이해될 수 있지만, 히브리어는 강조를 위해 ‘얼굴’을 반복합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  english_pob_choice: Then Pharaoh said to him
  chosen_korean: 그러자 바로가 그에게 말했습니다
  alternatives_korean:
  - 그리고 바로가 그에게 말했습니다
  - 그때 바로가 그에게 말했습니다
  lexicon: WLC
  rationale: 서사 진행의 와우 연속을 한국어 자연문으로 옮기되, 직접화법 도입으로 바로의 발화를 분명히 했습니다.
- source_word: לֵךְ מֵעָלַי
  english_pob_choice: Go away from me
  chosen_korean: 내게서 떠나가십시오
  alternatives_korean:
  - 내 앞에서 가십시오
  - 나에게서 물러가십시오
  lexicon: HALOT
  rationale: ‘떠나가다’가 לֵךְ + מֵעָלַי의 이별·축출 감각을 가장 자연스럽게 전달하며, 직설적 명령의 톤을 살립니다.
- source_word: הִשָּׁמֶר לְךָ
  english_pob_choice: Watch yourself
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 당신을 경계하십시오
  - 스스로를 조심하십시오
  lexicon: HALOT
  rationale: 위협적 경고를 현대 한국어에서 가장 직접적으로 전달하는 표현으로, 자기 자신을 주의하라는 뉘앙스를 유지합니다.
- source_word: אֶל תֹּסֶף רְאוֹת פָּנַי
  english_pob_choice: do not see my face again
  chosen_korean: 다시는 내 얼굴을 보지 마십시오
  alternatives_korean:
  - 내 얼굴을 다시 보지 마십시오
  - 내 얼굴 보기를 더하지 마십시오
  lexicon: HALOT
  rationale: 히브리어의 ‘더하다/계속하다’ 관용구를 한국어로는 ‘다시는’으로 풀어 자연스럽게 옮기되, ‘얼굴’을 유지해 반복 효과를 살렸습니다.
- source_word: פָּנַי
  english_pob_choice: my face
  chosen_korean: 내 얼굴
  alternatives_korean:
  - 내 앞
  - 내 존재
  lexicon: HALOT
  rationale: 본문이 ‘face’를 반복하므로 ‘존재’로 완화하지 않고 표면 이미지를 보존했습니다.
theological_decisions:
- issue: 바로의 최종 경고를 직설적 명령형으로 옮길지 여부
  chosen_reading: 명령형과 위협적 미래형을 그대로 살려, 왕의 절대적 배제와 죽음의 경고를 분명히 했습니다.
  alternative_readings:
  - 완곡하게 ‘가시오’ 또는 ‘가라’로 낮추는 번역
  - ‘반드시’ 없이 단순 미래형으로 옮기는 번역
  rationale: 본문의 위협성과 권력 불균형을 약화시키지 않기 위해, 한국어에서도 단호한 축출과 확정적 죽음을 드러냈습니다.
  doctrine_reference: 내러티브의 역사적·수사적 강도 보존
