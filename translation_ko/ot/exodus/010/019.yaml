base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Sea of Reeds''; traditionally rendered ''Red Sea.'''
    reason: alternative_reading
  - marker: b
    text: '''Sea wind'' may refer to a wind coming from the sea, that is, a west wind in this setting.'
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 매우 강한 바닷바람[a]을 돌리시니, 그 바람이 메뚜기들을 쓸어 가서 갈대 바다[b]로 몰아넣었습니다. 이집트 온 땅 어디에도 메뚜기 한 마리도 남지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바다의 바람’이지만, 이 문맥에서는 서쪽에서 부는 바람을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: '히브리어: ‘갈대 바다’; 전통적으로는 ‘홍해’로 옮깁니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유한 신적 이름을 보존하기 위해 관용적 대명사 대신 야훼를 사용했습니다.
- source_word: רוּחַ יָם
  english_pob_choice: west wind
  chosen_korean: 바닷바람
  alternatives_korean:
  - 서풍
  - 바람
  - 바다에서 오는 바람
  lexicon: HALOT
  rationale: 직역하면 ‘바다의 바람’이지만, 이 문맥에서는 서쪽에서 불어오는 바람을 가리키므로 의미를 살려 자연스럽게 옮겼습니다.
- source_word: יָמָּה סּוּף
  english_pob_choice: Sea of Reeds
  chosen_korean: 갈대 바다
  alternatives_korean:
  - 홍해
  lexicon: HALOT
  rationale: 히브리어 지명을 원어 쪽에 맞춰 옮기고, 전통적 ‘홍해’는 본문 대신 각주로 제시합니다.
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  english_pob_choice: Not one locust remained
  chosen_korean: 메뚜기 한 마리도 남지 않았습니다
  alternatives_korean:
  - 메뚜기 하나도 남지 않았습니다
  - 메뚜기 한 마리도 남아 있지 않았습니다
  lexicon: HALOT
  rationale: 완전한 부정을 한국어에서 가장 자연스럽게 드러내기 위해 ‘한 마리도’ 구조를 사용했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 출애굽기의 문맥에서 여호와 대체표현보다 신명 자체를 드러내는 번역이 원문 의미를 더 직접적으로 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 직접 화자 표지 없이 서술문을 유지하는 방식
  chosen_reading: 서술자 진술로 통일
  alternative_readings:
  - ‘바닷바람’에 대한 설명을 주석으로 본문화
  - 전통적 ‘홍해’로 본문화
  rationale: 히브리어 본문은 사건의 진행을 담담하게 서술하므로, 본문은 설명을 과도하게 덧붙이지 않고 각주로만 보조했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy'
