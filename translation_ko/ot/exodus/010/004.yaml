source:
  edition: WLC
  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֣חַ אֶת עַמִּ֑/י הִנְ/נִ֨י מֵבִ֥יא מָחָ֛ר אַרְבֶּ֖ה בִּ/גְבֻלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
  footnotes:
  - marker: a
    text: Hebrew אַרְבֶּה is singular in form but used collectively; thus 'locusts' in English.
    reason: lexical_alternative
  - marker: b
    text: Or 'within your borders.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신이 내 백성을 보내기를 거절하면, 보십시오, 내일 내가 메뚜기들을 당신의 경계 안으로 들여보내겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אַרְבֶּה는 형태상 단수이지만 집합적으로 쓰이므로, 한국어에서는 복수적으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 경계 안에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: 만일 ... 하면
  alternatives_korean:
  - 그러나 만일 ... 하면
  - 이는 만일 ... 하면
  lexicon: HALOT
  rationale: 앞선 경고를 이어 받는 조건 절이므로, 한국어에서는 자연스러운 조건 연결인 ‘만일 ... 하면’으로 옮겨 조건성과 경고의 흐름을 살렸습니다.
- source_word: מָאֵן
  english_pob_choice: refuse
  chosen_korean: 거절하다
  alternatives_korean:
  - 마다하다
  - 거부하다
  lexicon: HALOT
  rationale: 의지적이고 완강한 거절을 나타내므로, 단순한 소극적 망설임보다 분명한 ‘거절하다’가 문맥에 맞습니다.
- source_word: אַרְבֶּה
  english_pob_choice: locusts
  chosen_korean: 메뚜기들
  alternatives_korean:
  - 메뚜기
  - 메뚜기 떼
  lexicon: HALOT
  rationale: 히브리어는 형태상 단수지만 집합적으로 쓰이므로, 재앙의 군집성을 드러내는 복수형 ‘메뚜기들’로 옮겼습니다.
- source_word: בִּגְבֻלֶךָ
  english_pob_choice: into your territory
  chosen_korean: 당신의 경계 안으로
  alternatives_korean:
  - 당신의 영토 안으로
  - 당신의 경계 안에
  lexicon: HALOT
  rationale: ‘경계/영역’의 의미를 살리면서, ‘bring’과 결합된 이동 방향을 반영해 ‘안으로’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 즉각적 심판 선언의 어조
  chosen_reading: ‘보십시오’로 히브리어 הִנְנִי의 엄숙한 즉시성과 경고성을 살렸습니다.
  alternative_readings:
  - ‘보라’
  - ‘내가 이제’
  rationale: 단순 정보 전달보다 선언적·경고적 뉘앙스가 강하므로, 현대 한국어에서 격식 있고 직접적인 감탄·주의 환기 표현을 택했습니다.
  doctrine_reference: 출애굽기 재앙 서사의 심판 선언 어조
- issue: 시간 표현의 긴박성
  chosen_reading: ‘내일’과 ‘보십시오’를 함께 두어 임박한 실행을 드러냈습니다.
  alternative_readings:
  - ‘곧’
  - ‘다가오는 날’
  rationale: מָחָר의 직접적 시간 지시를 보존하면서, הִנְנִי와 결합된 임박성을 한국어 문장 흐름 속에 드러내기 위한 선택입니다.
  doctrine_reference: 하나님의 주권적 행위의 임박성
