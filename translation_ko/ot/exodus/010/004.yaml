    text: 히브리어 אַרְבֶּה는 형태상 단수이지만 집합적으로 쓰입니다. 여기서는 ‘메뚜기 떼’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 경계 안에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: 만일 ... 하면
  alternatives_korean:
  - 그러나 만일 ... 하면
  - 이는 만일 ... 하면
  lexicon: HALOT
  rationale: 앞선 경고를 이어 받는 조건 절이므로, 한국어에서는 자연스러운 조건 연결인 ‘만일 ... 하면’으로 옮겨 조건성과 경고의 흐름을 살렸습니다.
- source_word: מָאֵן
