translation:
  language: ko
  text: 만일 당신이 내 백성을 내보내기를 거절한다면, 보십시오, 내가 내일 메뚜기 떼를[a] 당신의 영토 안으로[b] 들여보내겠습니다.
  philosophy: optimal-equivalence
  footnotes:
