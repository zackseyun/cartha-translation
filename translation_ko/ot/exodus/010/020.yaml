source:
  edition: WLC
  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
  footnotes:
  - marker: a
    text: Or 'made Pharaoh’s heart firm' or 'strengthened Pharaoh’s heart'; the Hebrew verb literally means 'made strong/firm.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' or traditionally 'the children of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서 바로의 마음을 굳게 하셨고[a], 바로는 이스라엘 자손[b]을 보내 주지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강하게 하셨다’, ‘견고하게 하셨다’. 히브리어 동사 חזק는 문자적으로 ‘강하게/굳게 하다’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 사람들’. 히브리어는 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  english_pob_choice: hardened
  chosen_korean: 굳게 하셨고
  alternatives_korean:
  - 완강하게 하셨고
  - 강하게 하셨고
  - 단단하게 하셨고
  lexicon: HALOT
  rationale: 히브리어 חזק는 문자적으로는 ‘강하게 하다/굳게 하다’이지만, 출애굽기의 반복 공식에서는 하나님의 주도로 바로의 저항이 더 완고해지는 의미가 핵심이므로 한국어에서는 ‘굳게 하다’로 옮기는 것이 가장 자연스럽고 원문의 긴장을 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 고유명사 관례
  rationale: יהוה는 번역어 제목이 아니라 신적 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
- source_word: לֵב
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 속마음
  - 내면
  lexicon: HALOT
  rationale: 히브리어 לֵב은 감정만이 아니라 의지와 결단을 포함하는 내적 중심을 가리키므로, 한국어에서는 관용적이면서도 포괄적인 ‘마음’이 적절합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: ‘sons of Israel’의 가족적 표현을 살리기 위해 직역에 가까운 ‘이스라엘 자손’을 택했습니다. 영어 POB의 성별-투명성 의도도 유지할 수 있습니다.
- source_word: שִׁלַּח
  english_pob_choice: did not let ... go
  chosen_korean: 보내지 않았습니다
  alternatives_korean:
  - 내보내지 않았습니다
  - 풀어 주지 않았습니다
  - 보내 놓지 않았습니다
  lexicon: HALOT
  rationale: 출애굽 맥락에서 שלח는 단순 발송이 아니라 억압에서의 해방/출발 허용을 뜻하므로, ‘보내다’는 기본 의미를 살리되 여기서는 문맥상 자연스러운 ‘보내지 않았다’로 옮겼습니다.
theological_decisions:
- issue: 여호와의 직접적 개입과 바로의 책임을 함께 보존할지 여부
  chosen_reading: 야훼께서 바로의 마음을 굳게 하셨고, 바로는 이스라엘 자손을 보내지 않았습니다.
  alternative_readings:
  - 야훼께서 바로의 마음을 강하게 하셨고
  - 바로의 마음이 굳어졌고
  rationale: 본문은 야훼의 주도적 행위와 바로의 불순종을 함께 진술하므로, 신학적 긴장을 완화하지 않고 둘 다 분명히 드러내는 번역을 유지했습니다. 이는 출애굽기의 반복되는 심판-완고함 구조를 그대로 보존합니다.
  doctrine_reference: 하나님의 주권과 인간의 책임을 본문 수준에서 함께 보존
