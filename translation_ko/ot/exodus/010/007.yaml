id: EXO.10.7
reference: Exodus 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
  footnotes:
  - marker: a
    text: Or “this one” or simply “this”; the Hebrew demonstrative refers to Moses.
    reason: lexical_alternative
  - marker: b
    text: Or “a trap.”
    reason: lexical_alternative
  - marker: c
    text: Hebrew “the men”; some translations broaden this to “the people,” but the source text is specifically masculine plural.
    reason: lexical_alternative
  - marker: d
    text: Or “serve/worship the LORD their God”; the Hebrew verb can include both service and worship in relation to God.
    reason: lexical_alternative
  - marker: e
    text: Hebrew “the LORD” represents the divine name YHWH; alternatively transliterated “Yahweh.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 바로의 신하들이 그에게 말했습니다. “언제까지 이 사람[a]이 우리에게 덫[b]이 되겠습니까? 그 남자들[c]을 보내어 그들이 그들의 하나님이신 야훼[e]를 섬기게[d] 하십시오. 아직도 이집트가 망했다는 것을 모르십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 사람’은 문맥상 모세를 가리키는 지시 표현입니다.
    reason: source_note
  - marker: b
    text: ‘덫’은 히브리어 מוֹקֵשׁ의 직역적 대응으로, ‘올무’나 ‘함정’도 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 남성 복수형 ‘그 남자들’을 사용합니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어 동사 עבד는 하나님께 대한 ‘섬김’과 ‘예배’의 의미를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 히브리어 יְהוָה는 하나님의 이름을 가리키며, 이 번역에서는 ‘야훼’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי פַרְעֹה
  english_pob_choice: Pharaoh’s servants
  chosen_korean: 바로의 신하들
  alternatives_korean:
  - 바로의 종들
  - 바로의 관리들
  lexicon: HALOT
  rationale: 왕궁 소속 인물들로서 문맥상 ‘신하들’이 자연스럽고, 단순 ‘종들’보다 지위감을 살리면서도 과도하게 해석하지 않습니다.
- source_word: זֶה לָנוּ לְמוֹקֵשׁ
  english_pob_choice: this man be a snare to us
  chosen_korean: 이 사람이 우리에게 … 덫이 되겠습니까
  alternatives_korean:
  - 이 사람이 우리에게 … 올무가 되겠습니까
  - 이 사람이 우리에게 … 함정이 되겠습니까
  lexicon: HALOT
  rationale: POB가 지적한 대로 지시대명사는 문맥상 모세를 가리키므로 ‘이 사람’으로 구체화했고, מוֹקֵשׁ는 한국어 성경어휘에서 흔한 ‘올무’보다 직설적인 ‘덫’이 현대 독자에게 뜻을 분명히 전달합니다.
- source_word: שַׁלַּח אֶת הָאֲנָשִׁים
  english_pob_choice: Send the men away
  chosen_korean: 그 사람들을 보내어
  alternatives_korean:
  - 그 남자들을 보내어
  - 그들을 놓아주어
  lexicon: HALOT
  rationale: 이 구절의 핵심은 그들을 출애굽의 노동/복무 상황에서 풀어 보내라는 요청이므로, 자연스러운 한국어 명령형으로 옮기되 ‘그 사람들’로 집단을 드러냈습니다.
- source_word: וְיַעַבְדוּ אֶת יְהוָה אֱלֹהֵיהֶם
  english_pob_choice: so that they may serve Yahweh their God
  chosen_korean: 그들이 그들의 하나님 야훼를 섬기게 하십시오
  alternatives_korean:
  - 그들이 그들의 하나님 야훼를 예배하게 하십시오
  - 그들이 그들의 하나님 야훼를 섬기고 예배하게 하십시오
  lexicon: HALOT
  rationale: עבד는 하나님께 대한 ‘섬김/예배’의 폭을 가지지만, 기본값인 ‘섬기다’를 택해 원문의 넓은 의미를 유지했고, יְהוָה는 프로젝트 기준대로 ‘야훼’로 음역했습니다.
theological_decisions:
- issue: 예언/인용문 내부의 발화 대상과 어조
  chosen_reading: 신하들의 직접 발화는 따옴표로 처리하고, 요청문은 공손한 명령형 ‘-십시오’로 옮겼습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 강한 명령형으로 처리
  rationale: 히브리어 원문은 궁정 신하들이 바로에게 직설적으로 압박하는 대화이므로, 한국어에서도 관계의 긴장과 간청성을 살리는 공손 명령형이 가장 적절합니다.
  doctrine_reference: 번역 철학 §4(문맥의 수사적 힘 보존)
- issue: ‘אַךְ/הֲטֶרֶם תֵּדַע’의 반문 뉘앙스
  chosen_reading: ‘아직도 … 모르십니까?’로 옮겨 이미 드러난 재앙에 대한 책망을 살렸습니다.
  alternative_readings:
  - ‘아직 알지 못하십니까?’
  - ‘이제라도 모르겠습니까?’
  rationale: 단순 정보 질문이 아니라, 이미 분명해진 현실을 외면하는 바로를 꾸짖는 반문이므로 한국어에서도 책망의 뉘앙스를 유지해야 합니다.
  doctrine_reference: HALOT 어법 및 POB 반문 처리 원칙
