  source_fidelity: 핵심 의미와 야훼 표기는 원문 및 영어 POB의 선택을 대체로 충실히 반영합니다. 다만 אֲשַׁלַּח의 화자 주도적 허용/방출의 뜻은 ‘내보내게 된다면’보다 ‘내보내 주기나 한다면’에서 더 직접적이며, 영어의 적대적·반어적 ‘if I ever’도 더 잘 살아납니다.
  naturalness: ‘내보내게 된다면 말입니다’는 현대 한국어에서 다소 우회적이고 어색합니다. ‘내보내 주기나 한다면!’은 바로 앞의 빈정거리는 축원과 이어져 바로의 위협적 반어를 자연스럽게 드러냅니다. 각주 표지는 해당 표현 바로 뒤에 두는 편이 독자에게 명확합니다.
