- from: 그러자 그가 그들에게 말했습니다. 「야훼께서 정말 너희와 함께 계시기를! 내가 너희와 너희의 어린아이들까지 내보내게 된다면 말입니다. 보십시오. 너희 앞에 악이 있습니다。」[a][b]
  to: 그러자 그가 그들에게 말했습니다. 「야훼께서 정말 너희와 함께 계시기를! 내가 너희와 너희의 어린아이들까지 내보내 주기나 한다면![a] 보십시오, 너희 앞에 악이 있습니다.[b]」
  rationale: 번역의 주요 어휘 선택은 유지하되, 바로의 조건적·빈정거리는 거절을 자연스러운 현대 표준어로 명확히 했습니다. ‘악’과 ‘너희 앞에’는 원문의 논쟁적 모호성을 유지하며, 각주 표지를 각주가 설명하는 구절에 직접 연결했습니다.
