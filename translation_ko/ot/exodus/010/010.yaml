id: EXO.10.10
reference: Exodus 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
  footnotes:
  - marker: a
    text: Or, “The LORD be with you when I send you and your little ones,” likely spoken sarcastically.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew is ambiguous: this may mean “disaster is before you” or “you have evil in view / in mind.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 그들에게 말했습니다. 「야훼께서 정말 너희와 함께 계시기를! 내가 너희와 너희의 어린아이들까지 내보내 주기나 한다면![a] 보십시오, 너희 앞에 악이 있습니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “내가 너희와 너희의 어린아이들을 내보낼 때에 야훼께서 너희와 함께 계시기를.” 아마 빈정거리는 말입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 모호합니다. 이는 “재앙이 너희 앞에 있다” 또는 “너희가 악을 염두에 두고 있다”는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  english_pob_choice: May Yahweh indeed be with you
  chosen_korean: 야훼께서 정말 너희와 함께 계시기를
  alternatives_korean:
  - 야훼께서 너희와 함께 계시기를
  - 주께서 정말 너희와 함께 계시기를
  lexicon: HALOT
  rationale: jussive+כֵן의 반어적 뉘앙스를 살리기 위해 소망형으로 옮기되, ‘정말’을 넣어 빈정거림을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신적 이름 YHWH는 ‘야훼’로 옮겼습니다.
- source_word: אֲשַׁלַּח אֶתְכֶם וְאֶת טַפְּכֶם
  english_pob_choice: if ever I send you and your little ones out
  chosen_korean: 내가 너희와 너희의 어린아이들까지 내보내게 된다면 말입니다
  alternatives_korean:
  - 내가 너희와 너희의 어린아이들을 보내준다 해도
  - 내가 너희와 너희의 아이들까지 내보내게 된다면
  lexicon: HALOT
  rationale: שׁלח의 ‘보내다/내보내다’ 의미를 자연스럽게 살리면서 출애굽 맥락의 이동 방향을 드러냈습니다. טַף는 ‘어린아이들’로 옮겨 작은 자녀의 뉘앙스를 보존했습니다.
- source_word: רְאוּ כִּי רָעָה נֶגֶד פְּנֵי/כֶם
  english_pob_choice: See, for evil is before your faces
  chosen_korean: 보십시오. 너희 앞에 악이 있습니다
  alternatives_korean:
  - 보십시오. 너희 앞에 재앙이 있습니다
  - 주의하십시오. 너희 앞에 악의 뜻이 있습니다
  lexicon: HALOT
  rationale: רְאוּ를 단순 시각 동사보다 경고의 호격으로 보고 ‘보십시오’로 옮겼습니다. רָעָה와 נֶגֶד פְּנֵיכֶם의 의미 범위를 좁히지 않기 위해 ‘악’과 ‘너희 앞에’로 비교적 직역했습니다.
theological_decisions:
- issue: Pharaoh의 발언에 담긴 반어/빈정거림
  chosen_reading: ‘야훼께서 정말 너희와 함께 계시기를’이라는 소망형 표현으로 옮기되, 문맥상 반어가 드러나도록 구성했습니다.
  alternative_readings:
  - 그냥 ‘야훼께서 너희와 함께 계시기를’이라고 평서형에 가깝게 옮김
  - 노골적으로 비꼬는 어조를 별도 주석 없이 약화시킴
  rationale: 히브리어의 jussive와 문맥상 적대적 어조를 함께 반영해야 하므로, 축복처럼 들리지만 실제로는 비꼬는 말투가 드러나도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: preserve rhetorical force and theological tension'
- issue: רָעָה נֶגֶד פְּנֵיכֶם의 의미 범위
  chosen_reading: ‘너희 앞에 악이 있습니다’로 두어 재앙/악의 의도 중 하나로 좁히지 않았습니다.
  alternative_readings:
  - ‘너희 앞에 재앙이 있습니다’
  - ‘너희는 악한 뜻을 품고 있습니다’
  rationale: 원문은 해석 방향이 둘 이상 가능하므로, POB의 번역 의도에 따라 모호성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
