    rationale: וַיֹּאכַל의 기본 뜻은 ‘먹었다’입니다. 황폐의 정도는 목적어의 총체성으로 이미 충분히 표현되므로 추가적 강조를 넣지 않는 편이 최적 등가에 맞습니다.
