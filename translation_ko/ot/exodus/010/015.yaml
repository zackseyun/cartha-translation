  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the eye of all the land,' an idiom for the visible surface or face of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 메뚜기 떼가 온 땅의 표면[a]을 덮어 땅이 어두워졌고, 땅의 모든 식물과 우박이 남겨 둔 나무의 모든 열매를 먹었습니다. 이집트 온 땅에서 나무에도 들의 식물에도 푸른 것은 하나도 남지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자적으로 옮기면 ‘온 땅의 눈’이지만, 땅의 보이는 표면을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס אֶת עֵין כָּל הָאָרֶץ
  english_pob_choice: it covered the face of the whole land
  chosen_korean: 그것이 온 땅의 표면을 덮어
  alternatives_korean:
  - 온 땅의 얼굴을 덮어
  - 온 땅의 면을 덮어
  lexicon: HALOT
  rationale: ‘땅의 눈’이라는 직역형 이미지를 한국어로 자연스럽게 살리되, 의미상 ‘표면’이 지면의 보이는 면을 가장 잘 드러냅니다.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  english_pob_choice: so that the land was darkened
  chosen_korean: 땅이 어두워졌으며
