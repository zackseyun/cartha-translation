  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְכַ֞ס אֶת עֵ֣ין כָּל הָ/אָרֶץ֮ וַ/תֶּחְשַׁ֣ךְ הָ/אָרֶץ֒ וַ/יֹּ֜אכַל אֶת כָּל עֵ֣שֶׂב הָ/אָ֗רֶץ וְ/אֵת֙ כָּל פְּרִ֣י הָ/עֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַ/בָּרָ֑ד וְ/לֹא נוֹתַ֨ר כָּל יֶ֧רֶק בָּ/עֵ֛ץ וּ/בְ/עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the eye of all the land,' an idiom for the visible surface or face of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것이 온 땅의 표면을 덮어 땅이 어두워졌으며, 땅의 모든 식물과 우박이 남겨 둔 나무의 모든 열매를 먹어 치웠습니다. 이집트 온 땅의 나무나 들의 식물에는 푸른 것이 하나도 남지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자적으로는 ‘온 땅의 눈’이지만, 지면의 겉면을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס אֶת עֵין כָּל הָאָרֶץ
  english_pob_choice: it covered the face of the whole land
  chosen_korean: 그것이 온 땅의 표면을 덮어
  alternatives_korean:
  - 온 땅의 얼굴을 덮어
  - 온 땅의 면을 덮어
  lexicon: HALOT
  rationale: ‘땅의 눈’이라는 직역형 이미지를 한국어로 자연스럽게 살리되, 의미상 ‘표면’이 지면의 보이는 면을 가장 잘 드러냅니다.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  english_pob_choice: so that the land was darkened
  chosen_korean: 땅이 어두워졌으며
  alternatives_korean:
  - 땅이 캄캄해졌으며
  - 땅이 어둠에 잠겼으며
  lexicon: HALOT
  rationale: 동사의 결과 상태를 그대로 반영해 ‘어두워지다’로 옮겼습니다.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  english_pob_choice: every plant of the land
  chosen_korean: 땅의 모든 식물
  alternatives_korean:
  - 땅의 모든 풀
  - 땅의 모든 초목
  lexicon: HALOT
  rationale: עֵשֶׂב은 단순한 ‘풀’보다 넓은 식생을 가리키므로, 현대 한국어에서는 ‘식물’이 범위를 가장 무난하게 전달합니다.
- source_word: וְאֵת כָּל פְּרִי הָעֵץ
  english_pob_choice: and all the fruit of the trees
  chosen_korean: 나무의 모든 열매를
  alternatives_korean:
  - 모든 나무의 열매를
  - 나무들의 모든 열매를
  lexicon: HALOT
  rationale: 히브리어 단수형의 집합적 용법을 살리면서 한국어에서는 자연스럽게 ‘나무의 모든 열매’로 옮겼습니다.
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  english_pob_choice: No green thing remained
  chosen_korean: 푸른 것이 하나도 남지 않았습니다
  alternatives_korean:
  - 아무 푸른 것도 남지 않았습니다
  - 푸른 것은 전혀 남지 않았습니다
  lexicon: HALOT
  rationale: יֶרֶק의 넓은 의미를 ‘푸른 것’으로 살려 완전한 황폐를 강조했습니다.
theological_decisions:
- issue: 재앙의 주체를 한국어에서 어떻게 유지할지
  chosen_reading: 그것이…먹어 치웠습니다
  alternative_readings:
  - 그들이…먹었습니다
  - 메뚜기 떼가…먹어 치웠습니다
  rationale: 히브리어 동사의 단수형과 영어 POB의 집합적 단수 처리를 따라, 재앙 전체를 단일 집합체처럼 묘사했습니다.
  doctrine_reference: 본문의 서술 방식 보존
