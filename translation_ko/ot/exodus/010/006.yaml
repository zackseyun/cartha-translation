review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. וּמָלְאוּ는 문맥상 메뚜기 떼가 집들을 ‘채우는’ 능동 행위를 가리키므로, 초안의 비인칭적 상태 표현 ‘집들이 가득 찰 것입니다’보다 주어를 보충한 능동문이 원문에 더 가깝습니다. 또한 관계절은 앞서 언급된 전례 없는 재앙을 가리키므로 ‘이것’보다 ‘이는 … 보지 못한 일입니다’가 한국어에서 더 분명합니다.
  naturalness: ‘그들이 땅 위에 있었던 날부터’는 수식 관계가 다소 불분명하고 ‘날’의 단수 표현도 한국어 관용상 어색합니다. ‘땅 위에 있은 때부터 오늘까지’로 옮기면 원문의 시간 범위를 자연스럽고 격식 있게 유지합니다. ‘돌아서서 바로에게서 나갔습니다’는 연속 동작을 간결하게 전달합니다.
  terminology: 왕실 문맥의 עֲבָדֶיךָ를 ‘신하’로 옮긴 것은 적절합니다. ‘메뚜기 떼’는 바로 앞 문맥에서 명시된 재앙의 주어를 보충할 뿐 의미를 추가하지 않습니다. ‘땅’은 הָאֲדָמָה의 가능한 넓은 의미를 보존합니다.
  issues:
  - severity: medium
    issue: 능동 동사가 상태 표현으로 약화됨
