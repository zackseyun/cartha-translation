    rationale: ‘그들이 땅 위에 있었던 날부터’는 ‘그들’의 지시와 ‘날’의 범위가 부자연스럽습니다. 원문의 ‘그들이 땅 위에 있은 때부터’를 명료하게 옮겨야 합니다.
  - severity: low
    issue: 각주의 표지가 해당 표현에 붙어 있지 않음
