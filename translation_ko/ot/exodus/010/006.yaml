  text: וּ/מָלְא֨וּ בָתֶּ֜י/ךָ וּ/בָתֵּ֣י כָל עֲבָדֶי/ךָ֮ וּ/בָתֵּ֣י כָל מִצְרַיִם֒ אֲשֶׁ֨ר לֹֽא רָא֤וּ אֲבֹתֶ֨י/ךָ֙ וַ/אֲב֣וֹת אֲבֹתֶ֔י/ךָ מִ/יּ֗וֹם הֱיוֹתָ/ם֙ עַל הָ֣/אֲדָמָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּ֥פֶן וַ/יֵּצֵ֖א מֵ/עִ֥ם פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
  footnotes:
  - marker: a
    text: Or, more literally, “which your fathers and your fathers’ fathers have not seen.” The clause refers to the unprecedented plague just described.
    reason: lexical_alternative
  - marker: b
    text: “The land” may also be rendered “the earth” or “the ground.”
    reason: lexical_alternative
translation:
  language: ko
  text: 메뚜기 떼가 네 집들과 네 모든 신하의 집들과 온 이집트의 집들을 가득 채울 것입니다.[a] 이는 네 조상들과 네 조상들의 조상들이 땅[b] 위에 있은 때부터 오늘까지 보지 못한 일입니다.” 모세는 돌아서서 바로에게서 나갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘집들’을 반복하여 바로의 집에서 모든 신하의 집들과 온 이집트의 집들로 범위를 단계적으로 넓힙니다.
    reason: source_note
  - marker: b
    text: ‘땅’은 여기서 ‘지면’, ‘땅’, 또는 ‘세상’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ
  english_pob_choice: And they will fill
  chosen_korean: 가득 찰 것입니다
  alternatives_korean:
  - 채울 것입니다
  - 가득하게 할 것입니다
  lexicon: HALOT
  rationale: 주어가 문맥상 메뚜기 떼이므로 한국어에서는 상태 결과를 자연스럽게 드러내는 ‘가득 찰 것입니다’가 원문의 미래적 진행과 파괴적 효과를 함께 살립니다.
- source_word: בָתֶּיךָ וּבָתֵּי כָל עֲבָדֶיךָ וּבָתֵּי כָל מִצְרַיִם
  english_pob_choice: your houses, the houses of all your servants, and the houses of all Egypt
  chosen_korean: 네 집과 네 모든 신하의 집들과 온 이집트의 집들
  alternatives_korean:
  - 네 집들과 네 모든 종들의 집들과 온 이집트의 집들
  - 네 궁궐과 네 신하들의 집들과 이집트의 모든 집들
  lexicon: HALOT
  rationale: 반복되는 ‘집들’을 살리되 한국어에서는 소유를 앞에 두어 자연스럽게 옮겼습니다. עֲבָדֶיךָ는 왕실 문맥상 ‘신하’가 가장 무난합니다.
- source_word: מֵעִם פַּרְעֹה
  english_pob_choice: from Pharaoh
  chosen_korean: 바로에게서
  alternatives_korean:
  - 바로 앞에서
  - 바로의 곁을 떠나
  lexicon: HALOT
  rationale: מעם은 단순히 ‘from’이므로, 현대 한국어에서는 ‘-에게서’가 가장 직접적이고 간결합니다.
theological_decisions:
- issue: 미래 경고의 단정적 어조
  chosen_reading: ‘가득 찰 것입니다’와 ‘보지 못한 것입니다’로 미래 경고를 단정적으로 옮겼습니다.
  alternative_readings:
  - ‘가득할 것입니다’
  - ‘보지 못했습니다’
  rationale: 본문은 재앙의 확실성을 선언하는 문맥이므로, 한국어에서도 예언적 미래의 확정성을 약화하지 않았습니다.
  doctrine_reference: 출애굽기의 심판 선언과 하나님의 주권적 경고
- issue: 직접화법 안의 서술체 유지
  chosen_reading: 바로의 자리에서 나가는 동작을 ‘몸을 돌려 바로에게서 나왔습니다’로 서술했습니다.
  alternative_readings:
  - ‘돌아서서 나갔습니다’
  - ‘돌이켜 바로에게서 떠났습니다’
  rationale: וַיִּפֶן וַיֵּצֵא의 연속 동작을 그대로 살리면서도, 한국어 서사체에서 자연스럽게 읽히도록 했습니다.
  doctrine_reference: 서사 동사의 연속성 보존
