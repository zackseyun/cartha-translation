id: EXO.10.1
reference: Exodus 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
  footnotes:
  - marker: a
    text: 'Hebrew: ''I have made heavy his heart.'' The idiom means that the LORD hardened or made Pharaoh unresponsive.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'in his midst.' The sense may be Pharaoh specifically, or Pharaoh together with his servants/court.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “바로에게 들어가십시오. 내가 그의 마음과 그의 신하들의 마음을 완고하게 하였으므로[a], 내가 이 나의 표징들을 그들 가운데[b] 두기 위해서입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 마음을 무겁게 하였다’입니다. 이 관용 표현은 마음을 완고하게 하였다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 한가운데’입니다. 바로 자신만을 가리킬 수도 있고, 바로와 그의 신하들을 함께 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: Tetragrammaton
  rationale: 이 본문은 하나님의 고유 이름을 가리키므로, 공통 교회용 호칭인 ‘주님’이 아니라 학술적 음역인 ‘야훼’를 사용합니다.
- source_word: בֹּא אֶל פַּרְעֹה
  english_pob_choice: Go in to Pharaoh
  chosen_korean: 바로에게 들어가라
  alternatives_korean:
  - 바로에게 가라
  - 바로 앞에 나아가라
  lexicon: HALOT
  rationale: 히브리어 בוא의 ‘들어가다’라는 방향성을 살리되, 현대 한국어에서는 자연스러운 명령형으로 옮겼습니다.
- source_word: הִכְבַּדְתִּי
  english_pob_choice: I have hardened
  chosen_korean: 완고하게 하였으니
  alternatives_korean:
  - 굳게 하였으니
  - 무겁게 하였으니
  lexicon: HALOT
  rationale: 직역하면 ‘무겁게 하다’이지만, 여기서는 마음이 둔해지고 거역하는 상태를 가리키므로 ‘완고하게 하다’로 옮기되, 신학적 긴장은 그대로 유지했습니다.
- source_word: אֹתֹתַי אֵלֶּה
  english_pob_choice: these signs of mine
  chosen_korean: 내 이 표징들
  alternatives_korean:
  - 나의 이 표징들
  - 이 내 표징들
  lexicon: HALOT
  rationale: ‘표징’은 출애굽기의 반복 어휘로, 이적의 의미를 살리면서도 현대 한국어에서 이해하기 쉽습니다. 소유와 지시를 함께 드러내기 위해 ‘내 이’를 보존했습니다.
- source_word: בְּקִרְבּוֹ
  english_pob_choice: among them
  chosen_korean: 그들 가운데
  alternatives_korean:
  - 그의 한가운데
  - 그의 안에
  lexicon: HALOT
  rationale: 문맥상 바로와 그의 신하들을 함께 가리킬 수 있으므로, 단수 직역보다 문맥적 범위를 드러내는 ‘그들 가운데’를 택했습니다.
theological_decisions:
- issue: 야훼가 바로의 마음을 완고하게 하셨다는 진술
  chosen_reading: 본문의 직접 진술을 따라, 야훼께서 바로의 마음을 완고하게 하셨다고 옮겼습니다.
  alternative_readings:
  - 야훼께서 바로의 마음을 무겁게 하셨다
  - 야훼께서 바로의 마음을 강퍅하게 하셨다
  rationale: 원문의 신적 주도성을 약화시키지 않고, 동시에 히브리어 관용구의 문자적 배경은 각주로 남겨 두어 해석상의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
