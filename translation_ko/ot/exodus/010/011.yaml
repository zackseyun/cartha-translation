translation:
  language: ko
  text: “그렇게 하지 말고, 이제 남자들만 가서 야훼를 섬기게 하십시오. 그것이 바로 당신들이 찾는 것이기 때문입니다.” 그러고는 그들을 파라오의 앞에서 쫓아냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַגְּבָרִים는 ‘사람들’이 아니라 남성들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: לֹא כֵן은 단순 정보 전달이 아니라, 직전 제안을 거절하는 단호한 반응입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  english_pob_choice: No!
  chosen_korean: “그렇게 하지 말고”
  alternatives_korean:
  - 아닙니다!
  - 그렇지 않습니다!
  - 아니오!
  lexicon: HALOT
  rationale: 이 구절의 לֹא כֵן은 직전 제안을 단호히 거절하는 관용 표현이므로, 한국어에서는 자연스럽고 즉각적인 반박인 ‘그렇게 하지 말고’로 옮겨 거절의 급박함을 살렸습니다.
- source_word: הַגְּבָרִים
  english_pob_choice: the men
  chosen_korean: “남자들만”
  alternatives_korean:
  - 남자들
  - 남성들
  - 어른 남자들
  lexicon: HALOT
  rationale: 히브리어는 동행을 남성으로 제한하므로, 단순히 ‘사람들’로 넓히지 않고 제한의 뉘앙스를 드러내는 ‘남자들만’으로 옮겼습니다.
- source_word: וְעִבְדוּ אֶת יְהוָה
  english_pob_choice: and serve Yahweh
  chosen_korean: “야훼를 섬기게 하십시오”
  alternatives_korean:
  - 야훼를 섬기십시오
  - 야훼를 예배하게 하십시오
  - 야훼를 섬기고 경배하게 하십시오
  lexicon: HALOT
  rationale: עבד는 하나님을 대상으로 할 때 ‘섬기다/봉사하다’의 넓은 뜻을 가지므로, 예배로만 좁히지 않고 POB 기본명칭인 ‘야훼’를 그대로 사용해 문맥의 제의적·언약적 의미를 보존했습니다.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  english_pob_choice: from Pharaoh’s presence
  chosen_korean: “파라오의 앞에서”
  alternatives_korean:
  - 파라오의 앞에서부터
  - 파라오의 면전에서
  - 파라오의 존재 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구는 궁정 장면에서의 추방을 뜻하므로, 한국어도 직역에 가까운 ‘파라오의 앞에서’로 두어 강제 퇴장의 장면성을 유지했습니다.
theological_decisions:
- issue: 야훼의 번역 형태
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 여호와 대신 학술적 음역인 ‘야훼’를 사용해 히브리어 고유명사의 가시성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘남자들’로 제한하는 발화의 보존
  chosen_reading: 파라오의 제안은 전체 백성이 아니라 남성만의 출발을 허용하는 부분적 양보로 번역했습니다.
  alternative_readings:
  - 사람들
  - 그들
  - 남자들만
  rationale: 히브리어 הַגְּבָרִים는 성별 제한이 분명하므로, 이를 완화하지 않고 남성 제한을 드러내야 이야기의 긴장과 파라오의 통제 의도가 보존됩니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
