lexical_decisions:
- source_word: וַיֵּצֵא מֵעִם
  english_pob_choice: went out from
  chosen_korean: 떠나
  alternatives_korean:
  - 나가
  - 물러나
  - 바로바로에게서 나가
  lexicon: HALOT
  rationale: 동사 יצא와 전치사 מֵעִם의 결합은 ‘~에게서/~의 곁에서 떠나다’는 이동을 가리키므로, 한국어에서는 자연스럽게 ‘떠나’로 옮겨 출발과 분리를 함께 드러냈습니다.
- source_word: פַּרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 바로바로
  alternatives_korean:
  - 바로
  - 파라오
  lexicon: 표준 외래어 표기법/출애굽기 고유명사 용례
  rationale: 출애굽기 문맥의 이집트 왕호는 한국어 성경에서 관용적으로 ‘바로’이지만, 원어 음가를 더 직접적으로 드러내기 위해 ‘바로바로’로 음역했습니다.
- source_word: וַיֶּעְתַּר
  english_pob_choice: pleaded
  chosen_korean: 간청했습니다
  alternatives_korean:
  - 애원했습니다
  - 간구했습니다
  - 간청하여 기도했습니다
  lexicon: HALOT
  rationale: עתר는 단순히 말하는 것이 아니라 강하고 절박한 청원을 뜻하므로, 현대 한국어에서 긴박한 요청을 살리는 ‘간청했습니다’가 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 정본 표기/도메인 용례
  rationale: 공인된 원어 표기 원칙에 따라 신명은 титул이 아니라 고유명으로서 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘야훼’로 유지하여 하나님의 언약적 고유명을 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 신명기적 맥락의 지시대상 호칭이 아니라 히브리어 사각문자 자체를 사용하므로, 제목화된 ‘주님’보다 고유명 ‘야훼’가 소스의 직접성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
