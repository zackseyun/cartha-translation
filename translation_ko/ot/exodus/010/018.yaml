  source_fidelity: ‘바로바로’는 히브리어 פַּרְעֹה(Pharaoh)의 정확한 한국어 표기가 아니며, 왕호를 중복한 오류입니다. 또한 מֵעִם의 분리·이동 의미를 ‘바로에게서 나가’로 명시하면 원문의 구체성이 더 잘 보존됩니다. ‘야훼께 간청했습니다’는 וַיֶּעְתַּר אֶל־יְהוָה의 간절한 기도/탄원을 충실히 전달합니다.
  naturalness: ‘그는 바로에게서 나가 야훼께 간청했습니다’는 현대 표준 한국어의 합쇼체 서술로 자연스럽습니다. 기존의 ‘바로바로’는 부자연스럽고 명백한 중복 표기입니다.
  terminology: פַּרְעֹה는 한국어 성경 및 일반 학술 용례에 따라 ‘바로’로 옮기는 것이 적절합니다. יהוה는 프로젝트의 방침과 영어 POB를 따라 ‘야훼’로 유지했습니다. 각주 안의 ‘주’는 본문 표기와 일치하도록 ‘야훼’로 고쳤습니다.
