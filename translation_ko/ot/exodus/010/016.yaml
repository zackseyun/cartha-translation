id: EXO.10.16
reference: Exodus 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: ko
  text: 그러자 파라오는 모세와 아론을 급히 불러 이렇게 말했습니다. “내가 야훼, 곧 너희의 하나님께 죄를 지었고, 너희에게도 죄를 지었습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  english_pob_choice: hurried
  chosen_korean: 급히 사람을 보냈고
  alternatives_korean:
  - 서둘렀고
  - 급히 불러오게 했고
  lexicon: HALOT
  rationale: מהר의 핵심은 ‘서둘러 행동하다’이므로, 파라오가 즉시 사람을 보내는 급박함을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: לִקְרֹא לְמֹשֶׁה וּלְאַהֲרֹן
  english_pob_choice: to call for Moses and Aaron
  chosen_korean: 모세와 아론을 부르라고
  alternatives_korean:
  - 모세와 아론을 부르도록
  - 모세와 아론을 소환하라고
  lexicon: HALOT
  rationale: לִקְרֹא는 단순한 ‘부르다’보다 요청하여 데려오게 하는 뜻이 있어, ‘부르라고’로 자연스럽게 살렸습니다.
- source_word: חָטָאתִי
  english_pob_choice: I have sinned
  chosen_korean: 죄를 지었습니다
  alternatives_korean:
  - 죄를 범했습니다
  - 제가 죄를 지었습니다
  lexicon: HALOT
  rationale: 직접적인 고백의 성격을 유지하면서도 현대 한국어에서 자연스럽고 분명한 회개 표현으로 옮겼습니다.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  english_pob_choice: against Yahweh your God
  chosen_korean: 야훼, 너희의 하나님
  alternatives_korean:
  - 야훼, 너희 하나님
  - 야훼, 너희의 하나님께
  lexicon: HALOT
  rationale: יְהוָה는 프로젝트 기본값대로 ‘야훼’로 옮기고, אֱלֹהֵיכֶם은 소유격을 분명히 드러내는 ‘너희의 하나님’으로 번역했습니다.
- source_word: וְלָכֶם
  english_pob_choice: and against you
  chosen_korean: 너희에게
  alternatives_korean:
  - 너희를 상대로
  - 너희에게도
  lexicon: HALOT
  rationale: חטא와 함께 쓰인 ל는 상대적 피해를 가리키므로, 한국어에서는 ‘죄를 지었습니다’와 결합되는 대상 표지로 ‘너희에게’가 가장 자연스럽습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה를 프로젝트 기본값에 따라 음역해, 언약 이름을 일반 호칭과 구별했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: חטא + ל의 관계
  chosen_reading: 죄를 지었습니다 … 너희에게
  alternative_readings:
  - 죄를 지었습니다 … 너희를 향해
  - 죄를 범했습니다 … 너희에게
  rationale: 히브리어의 ל는 단순 목적어보다 ‘상대에게 끼친 죄/해악’의 뉘앙스를 가지므로, 한국어에서는 문장 전체로 그 관계를 드러냈습니다.
  doctrine_reference: '원문 우선 원칙: 의미를 희석하지 않고 관용적으로 재현'
