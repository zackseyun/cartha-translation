  naturalness: 초안의 “야훼, 너희의 하나님과 너희에게 죄를 지었습니다”는 조사 결합이 어색하고 의미 관계가 불분명합니다. 수정문은 현대 표준어 합쇼체로 자연스럽게 고백의 두 대상을 표현합니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 “야훼”로 유지하고, אֱלֹהֵיכֶם은 파라오가 이스라엘의 하나님으로 지칭하는 “너희의 하나님”으로 보존했습니다. חָטָאתִי는 “죄를 지었습니다”로 직접적이고 적절하게 옮겼습니다.
