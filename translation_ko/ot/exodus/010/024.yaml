  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
  footnotes:
  - marker: a
    text: Or 'be left' for 'remain behind.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your children' for 'your little ones.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 바로가 모세를 불러 말했습니다. 「가서 야훼를 섬기십시오. 다만 너희의 양 떼와 소 떼는 뒤에 남겨 두고, 너희의 어린아이들은 너희와 함께 가도 됩니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「뒤에 남아 있다」로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「너희의 자녀들」로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל מֹשֶׁה
  english_pob_choice: called to Moses
  chosen_korean: 모세를 불러
  alternatives_korean:
  - 모세에게 불러
  - 모세를 불러들여
  lexicon: HALOT
  rationale: קרא + אֶל은 여기서 단순히 상대를 부르는 의미이므로, 한국어에서는 자연스럽게 「모세를 불러」로 옮겨 호출 동작을 살렸습니다.
- source_word: עִבְדוּ אֶת יְהוָה
  english_pob_choice: serve Yahweh
  chosen_korean: 야훼를 섬기십시오
  alternatives_korean:
  - 야훼를 섬기십시오
  - 야훼를 예배하십시오
  lexicon: HALOT
  rationale: עבד는 하나님에 대해 「섬기다」가 직접적인 대응이며, 출애굽기의 반복되는 대조—바로를 섬김 vs. 야훼를 섬김—도 유지합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 문자적으로 나타난 신명은 관용적 대체어가 아니라 음역형 「야훼」로 옮겨, 본문이 가진 고유한 언약 이름을 보존했습니다.
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  english_pob_choice: your flocks ... your herds
  chosen_korean: 너희의 양 떼와 소 떼
  alternatives_korean:
  - 너희의 양 떼와 소 떼
  - 너희의 가축 떼와 소 떼
  lexicon: HALOT
  rationale: צאן은 작은 가축, בקר은 큰 가축을 가리키므로 한국어에서는 각각 「양 떼」와 「소 떼」로 구분해 대립을 분명히 했습니다.
- source_word: יֻצָּג
  english_pob_choice: remain behind
  chosen_korean: 뒤에 남겨 두고
  alternatives_korean:
  - 뒤에 남겨 두고
  - 남아 있게 하고
  lexicon: HALOT
  rationale: Hophal의 수동적 결과를 한국어 관용에 맞게 「뒤에 남겨 두고」로 옮겨, 단순한 잔류가 아니라 의도적 분리의 뉘앙스를 살렸습니다.
- source_word: טַפְּכֶם
  english_pob_choice: your little ones
  chosen_korean: 너희의 어린아이들
  alternatives_korean:
  - 너희의 어린아이들
  - 너희의 자녀들
  lexicon: HALOT
  rationale: טף는 어린 자녀들을 가리키는 말이므로, POB의 의미를 따라 「어린아이들」로 옮겨 가족 내의 소규모 연령층을 드러냈습니다.
theological_decisions:
- issue: 바로의 허용 표현과 명령형의 어조
  chosen_reading: 「가서 야훼를 섬기십시오」로 바로가 허용을 제시하는 공손한 명령형처럼 들리게 옮겼습니다.
  alternative_readings:
  - 「가서 야훼를 섬기세요」
  - 「가서 야훼를 섬기십시오만」
  rationale: 히브리어는 바로가 제한을 두며 허락하는 장면이므로, 한국어에서도 직접적 명령이 아니라 허용을 가장한 통제의 말투가 드러나도록 했습니다.
  doctrine_reference: 출애굽기 10장 서술 맥락의 바로-야훼 대립
- issue: ‘little ones’의 범위
  chosen_reading: 본문의 טף를 「어린아이들」로 옮겨, 자녀 전반보다 더 구체적인 연령층을 암시했습니다.
  alternative_readings:
  - 자녀들
  - 어린 자녀들
  rationale: 이 단어는 단순한 ‘children’보다 어린아이/부양가족의 뉘앙스가 있어, 본문이 허용하는 범위 안에서 더 좁고 생생한 표현을 택했습니다.
  doctrine_reference: 'HALOT: טף'
