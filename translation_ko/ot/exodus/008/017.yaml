source:
  edition: WLC
  text: כִּ֣י אִם אֵינְ/ךָ֮ מְשַׁלֵּ֣חַ אֶת עַמִּ/י֒ הִנְ/נִי֩ מַשְׁלִ֨יחַ בְּ/ךָ֜ וּ/בַ/עֲבָדֶ֧י/ךָ וּֽ/בְ/עַמְּ/ךָ֛ וּ/בְ/בָתֶּ֖י/ךָ אֶת הֶ/עָרֹ֑ב וּ/מָ֨לְא֜וּ בָּתֵּ֤י מִצְרַ֨יִם֙ אֶת הֶ֣/עָרֹ֔ב וְ/גַ֥ם הָ/אֲדָמָ֖ה אֲשֶׁר הֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
  footnotes:
  - marker: a
    text: Or 'the flies.' The Hebrew עָרֹב likely denotes a swarm, traditionally understood as flies; the broader rendering preserves the lexical uncertainty.
    reason: lexical_alternative
  - marker: b
    text: Or 'the land on which they are.' Hebrew אֲדָמָה can mean 'ground' or 'land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 당신이 내 백성을 보내 주지 않으시면, 보십시오, 내가 당신과 당신의 신하들과 당신의 백성과 당신의 집 안에 그 떼[a]를 보내겠습니다. 이집트의 집들은 그 떼로 가득 찰 것이며, 그들이 있는 땅[b]도 그 떼로 가득 찰 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָרֹב은 ‘떼’ 또는 ‘무리’를 뜻할 수 있습니다. 전통적으로는 ‘파리’로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֲדָמָה는 ‘땅’, ‘지면’, 또는 ‘토지’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: For if
  chosen_korean: 만일
  alternatives_korean:
  - 그러나 만일
  - 정녕 만일
  lexicon: HALOT
  rationale: 조건적 경고의 도입부로 기능하므로 한국어에서는 간결한 ‘만일’이 가장 자연스럽고, 앞선 경고의 긴박함을 유지합니다.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  english_pob_choice: you do not let ... go
  chosen_korean: 네가 ... 보내지 않으면
  alternatives_korean:
  - 네가 ... 놓아주지 않으면
  - 네가 ... 풀어주지 않으면
  lexicon: HALOT
  rationale: 출애굽 서술에서 שׁלח는 단순한 ‘보내다’보다 ‘풀어 놓아 떠나게 하다’의 의미이므로, POB의 ‘let ... go’에 맞춰 ‘보내지 않으면’으로 옮겼습니다.
- source_word: הֶעָרֹב
  english_pob_choice: the swarm
  chosen_korean: 파리
  alternatives_korean:
  - 떼
  - 무리
  - 파리떼
  lexicon: HALOT
  rationale: 본문의 어휘는 본래 의미상 ‘떼/무리’의 여지가 있으나, 한국어 독자가 이 재앙을 즉시 인식하도록 전통적 식별어인 ‘파리’를 본문에 두고, 의미상의 유보는 보존하지 않았습니다.
- source_word: בְּךָ ... וּבַעֲבָדֶיךָ וּבְעַמְּךָ וּבְבָתֶּיךָ
  english_pob_choice: upon you, upon your servants, upon your people, and into your houses
  chosen_korean: 너와 네 신하들과 네 백성들과 네 집들 위에
  alternatives_korean:
  - 너와 네 종들과 네 백성들과 네 집들에
  - 너와 네 신하들과 네 백성들과 네 집들 가운데
  lexicon: HALOT
  rationale: 반복되는 ב-전치사는 재앙이 미치는 대상을 누적적으로 열거하는 기능을 하므로, ‘위에’로 통일해 압박감과 병렬 구조를 살렸습니다.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם אֶת הֶעָרֹב
  english_pob_choice: The houses of Egypt will be filled with the swarm
  chosen_korean: 이집트의 집들은 그 파리로 가득할 것이며
  alternatives_korean:
  - 이집트의 집들은 그 무리로 가득할 것이며
  - 이집트의 집들은 파리로 가득 찰 것이며
  lexicon: HALOT
  rationale: ‘가득할 것이다’는 수동적 결과를 자연스럽게 나타내며, 목적어를 ‘그 파리로’ 처리해 앞 문장의 재앙 대상과 연결했습니다.
- source_word: אֲדָמָה
  english_pob_choice: the ground
  chosen_korean: 땅
  alternatives_korean:
  - 지면
  - 흙
  - 땅바닥
  lexicon: HALOT
  rationale: 집 안의 공간과 대비되는 바깥의 표면을 가리키므로, 한국어에서는 가장 포괄적이고 문맥에 맞는 ‘땅’이 적절합니다.
theological_decisions:
- issue: הֶעָרֹב의 식별을 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 ‘파리’를 사용해 재앙의 구체성을 드러내되, 주석으로 ‘떼/무리’의 어휘적 불확실성을 보존하지는 않았습니다.
  alternative_readings:
  - ‘떼’로 두고 의미를 열어 두는 읽기
  - ‘파리떼’로 절충하는 읽기
  rationale: 출애굽기 재앙 서술의 수용사에서 이 항목은 보통 ‘파리’로 이해되며, 한국어 독자에게 사건 인지를 명확히 하면서도 문맥의 재앙 선포 기능을 유지하는 쪽이 더 적합합니다.
  doctrine_reference: 출 8:17 재앙 본문 해석 및 번역상의 어휘 선택
