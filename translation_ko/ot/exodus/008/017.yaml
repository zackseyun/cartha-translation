    reason: lexical_alternative
  - marker: b
    text: 히브리어 אֲדָמָה는 ‘땅’, ‘지면’, 또는 ‘토지’를 뜻할 수 있습니다.
    reason: lexical_alternative
  revision_rationale: The revision restores the lexical openness of עָרֹב, uses a natural locative expression for the houses, regularizes the passage in modern formal-polite Korean, and places both notes directly after their respective referents. “그들이 있는 땅” preserves the source’s concise reference to the Egyptians without adding an interpretive verb such as “live” or “stand.”
