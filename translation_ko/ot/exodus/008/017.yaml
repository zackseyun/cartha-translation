revisions:
- from: 만일 네가 내 백성을 보내지 않으면, 보라, 내가 너와 네 신하들과 네 백성들과 네 집들 위에 파리를 보낼 것이다. 이집트의 집들은 그 파리로 가득할 것이며, 그들이 있는 땅도 그러할 것입니다.[a][b]
  to: 만일 당신이 내 백성을 보내 주지 않으시면, 보십시오, 내가 당신과 당신의 신하들과 당신의 백성과 당신의 집 안에 그 떼[a]를 보내겠습니다. 이집트의 집들은 그 떼로 가득 찰 것이며, 그들이 있는 땅[b]도 그 떼로 가득 찰 것입니다.
  rationale: The revision restores the lexical openness of עָרֹב, uses a natural locative expression for the houses, regularizes the passage in modern formal-polite Korean, and places both notes directly after their respective referents. “그들이 있는 땅” preserves the source’s concise reference to the Egyptians without adding an interpretive verb such as “live” or “stand.”
