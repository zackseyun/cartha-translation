  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'with their enchantments' or 'by their occult arts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 마술사들도 자기들의 비술로 그와 같이 하였고, 그들은 이집트 땅 위에 개구리들을 올라오게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비술’은 본문의 숨은 마술적 기법을 드러내기 위한 번역입니다. 다른 가능성으로는 ‘주술’이나 ‘은밀한 술법’이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרְטֻמִּים
  english_pob_choice: the magicians
  chosen_korean: 마술사들
  alternatives_korean:
  - 술객들
  - 주술사들
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 바로 앞의 기적을 흉내 내는 궁정의 비전문가적 초자연 수행자를 가리키므로, 현대 한국어에서 자연스럽고 의미를 바로 전달하는 ‘마술사들’을 택했습니다.
- source_word: בְּלָטֵי הֶם
  english_pob_choice: by their secret arts
  chosen_korean: 자기들의 비술로
  alternatives_korean:
  - 그들의 주술로
  - 그들의 은밀한 술법으로
  lexicon: HALOT
  rationale: 어근이 가리키는 은밀하고 숨겨진 기술성을 살리되, 한국어에서 과도하게 무속적 함의를 덧씌우지 않도록 ‘비술’로 옮겼습니다.
- source_word: וַיַּעֲל֥וּ
  english_pob_choice: they brought up
  chosen_korean: 올라오게 하였습니다
  alternatives_korean:
  - 올려보냈습니다
  - 나오게 하였습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 반영해 ‘개구리들이 스스로 생겨났다’는 인상을 피하고, 원문의 ‘올라오게 하다’는 인과를 자연스러운 합쇼체로 풀었습니다.
- source_word: עַל אֶרֶץ מִצְרָיִם
  english_pob_choice: over the land of Egypt
  chosen_korean: 이집트 땅 위에
  alternatives_korean:
  - 이집트 온 땅에
  - 이집트 땅에
  lexicon: HALOT
  rationale: ‘עַל’의 위/덮임 감각을 살리면서도 한국어에서 공간적 확산을 분명히 드러내기 위해 ‘땅 위에’로 옮겼습니다.
theological_decisions:
- issue: 마술사들의 행위 서술 방식
  chosen_reading: 본문이 말하는 대로, 마술사들도 실제로 같은 종류의 행위를 한 것으로 서술했습니다.
  alternative_readings:
  - 자연주의적으로 단순한 속임수로 완화하여 번역
  - 서술을 의심형으로 바꿔 완곡하게 번역
  rationale: 히브리어 서사는 그 행위를 수식 없이 진술하므로, 번역도 본문의 서술 강도를 유지해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
