base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
  footnotes:
  - marker: a
    text: Or, 'in the river.' The Hebrew יְאֹר can mean 'river,' but in Exodus it commonly refers specifically to the Nile.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 개구리들은 당신과 당신의 집들과 당신의 종들과 당신의 백성에게서 떠나고, 오직 나일 강에만 남을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강에.’ 히브리어 יְאֹר는 ‘강’을 뜻할 수 있으나, 출애굽기에서는 보통 나일을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  english_pob_choice: And ... will depart
  chosen_korean: 떠나고
  alternatives_korean:
  - 물러가고
  - 사라지고
  lexicon: HALOT
  rationale: 다음 재앙이 끝나는 장면에서 סוּר의 핵심 의미인 ‘떠나가다, 물러나다’를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: הַצְפַרְדְּעִים
  english_pob_choice: the frogs
  chosen_korean: 개구리들은
  alternatives_korean:
  - 개구리들이
  - 그 개구리들은
  lexicon: HALOT
  rationale: 재앙의 대상인 복수 명사를 그대로 드러내되, 한국어에서는 주어를 자연스럽게 구성했습니다.
- source_word: בַּיְאֹר
  english_pob_choice: in the Nile
  chosen_korean: 나일 강에만
  alternatives_korean:
  - 강에만
  - 나일에만
  lexicon: HALOT
  rationale: 출애굽기에서 יְאֹר가 통상 나일을 가리키므로, 문맥상 더 분명한 ‘나일 강’으로 옮겼습니다.
theological_decisions:
- issue: 최종 예외 구문 רַק ... תִּשָּׁאַרְנָה의 강조
  chosen_reading: 오직 나일 강에만 남을 것입니다
  alternative_readings:
  - 다만 나일 강에만 남을 것입니다
  - 오직 나일 강에만 남아 있을 것입니다
  rationale: רַק의 제한/예외를 ‘오직 ...에만’으로 분명히 살려, 다른 곳에서는 완전히 떠나고 나일에만 남는다는 대비를 유지했습니다.
  doctrine_reference: 본문의 서술적 강조
