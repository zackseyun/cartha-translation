translation:
  language: ko
  text: 그리고 개구리들이 당신에게서, 당신의 집들에서, 당신의 종들에게서, 당신의 백성에게서 떠나, 오직 나일강에만 남을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강에.’ 히브리어 יְאֹר는 ‘강’을 뜻할 수 있으나, 출애굽기에서는 보통 나일을 가리킵니다.
    reason: lexical_alternative
