base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
  footnotes:
  - marker: a
    text: Or, more interpretively, “Set the time for me” or “Have this honor over me.” The Hebrew idiom is difficult; Moses is inviting Pharaoh to name when Moses should intercede.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 바로에게 말했습니다. “나보다 우세함을 보이십시오. 제가 언제 바로와 바로의 신하들과 바로의 백성을 위하여 간구하여, 바로에게서와 바로의 집들에서 개구리들을 끊어 없애도록 하겠습니까? 개구리들은 오직 나일강에만 남아 있을 것입니다”[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 위에서 스스로를 높이십시오’ 또는 ‘나보다 우세함을 보이십시오’에 가깝습니다. 문맥상 모세가 바로에게 자신이 간구할 때를 정하라고 권하는 난해한 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  english_pob_choice: Have this honor over me
  chosen_korean: 나에게 이 영광을 보이십시오
  alternatives_korean:
  - 나를 높여 주십시오
  - 나에게 이 영예를 베푸십시오
  - 내게 이 영광을 주십시오
  lexicon: HALOT
  rationale: 히트파엘 פאר + עַל의 관용구를 직역하면 어색하지만, 본문의 핵심은 바로가 모세에게 시간을 정할 권한을 갖는다는 점입니다. 한국어에서는 ‘영광/영예를 보이다’로 idiom의 ‘honor’ 성격을 살리되, 너무 해석적으로 풀지 않았습니다.
- source_word: לְמָתַי
  english_pob_choice: when
  chosen_korean: 언제
  alternatives_korean:
  - 어느 때에
  - 언제쯤
  lexicon: HALOT
  rationale: 바로가 모세의 중보 시점을 정하도록 요청하는 질문 구조를 자연스러운 현대 한국어 의문사로 옮겼습니다.
- source_word: אַעְתִּיר
  english_pob_choice: I plead
  chosen_korean: 간구하여
  alternatives_korean:
  - 간청하여
  - 중보하여
  - 기도하여
  lexicon: HALOT
  rationale: 히필 עתר의 간절한 청원을 드러내면서도, 한국어에서 본문 흐름에 가장 자연스러운 ‘간구하다’를 택했습니다.
- source_word: לְהַכְרִית הַצֲפַרְדְּעִים
  english_pob_choice: to cut off the frogs
  chosen_korean: 개구리들을 끊어 없애
  alternatives_korean:
  - 개구리들을 없애
  - 개구리들을 도려내
  lexicon: HALOT
  rationale: כרת의 문자적 ‘끊다/베다’ 이미지를 살리면서, 재앙의 제거라는 뜻이 분명하도록 ‘끊어 없애다’로 옮겼습니다.
- source_word: בַּיְאֹר
  english_pob_choice: in the Nile
  chosen_korean: 나일강에는
  alternatives_korean:
  - 나일에는
  - 그 강에는
  lexicon: HALOT
  rationale: 출애굽기의 יְאֹר는 이집트의 나일을 가리키는 것이 분명하므로, 배경을 드러내는 한국어 고유명칭을 사용했습니다.
theological_decisions:
- issue: 바로의 선택권을 드러내는 관용구 처리
  chosen_reading: ‘나에게 이 영광을 보이십시오’로 옮겨, 바로가 모세에게 시간 결정을 요구하는 함의를 본문 밖으로 과도하게 풀지 않았습니다.
  alternative_readings:
  - ‘때를 정해 주십시오’로 더 해석적으로 옮김
  - ‘나를 높여 주십시오’로 직설화
  rationale: 히브리어 표현은 난해하지만, 본문은 바로의 발화 방식으로 모세에게 간구 시점을 정하게 하는 장면입니다. 따라서 의미를 충분히 전달하되, 원문의 관용성을 보존했습니다.
  doctrine_reference: 본문 해석 원칙과 관용구 번역
