  rationale: 출 8:27은 하나님의 언약 이름을 직접 사용하므로, 칭호로 바꾸지 않고 신명을 보존하는 것이 원문 의미를 가장 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
