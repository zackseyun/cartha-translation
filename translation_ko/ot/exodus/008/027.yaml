base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
  footnotes:
  - marker: a
    text: Or 'the swarms of flies.' The Hebrew עָרֹב denotes the plague of swarming insects, but the exact species is not specified by the term itself.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세의 말대로 하시고, 그 무리를 바로에게서와 그의 신하들에게서와 그의 백성에게서 거두어 가셨으니, 하나도 남지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 무리’는 히브리어 עָרֹב의 정확한 종을 특정하지 않으며, 문맥상 재앙으로 온 뒤섞인 날짐승/곤충의 떼를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: 고유명사/신명
  rationale: 원문이 테트라그라마톤을 직접 사용하므로, POB의 원칙에 따라 신적 호칭이 아닌 고유 신명인 ‘야훼’로 옮겼습니다.
- source_word: כִּדְבַר מֹשֶׁה
  english_pob_choice: according to Moses' word
  chosen_korean: 모세의 말대로
  alternatives_korean:
  - 모세의 말씀대로
  - 모세가 말한 대로
  lexicon: HALOT
  rationale: דבר는 여기서 ‘말/발언’의 뜻이므로, ‘말대로’가 가장 자연스럽고 원문의 순응 관계를 잘 드러냅니다.
- source_word: הֶעָרֹב
  english_pob_choice: the swarm
  chosen_korean: 그 무리
  alternatives_korean:
  - 그 떼
  - 그 벌레 떼
  lexicon: HALOT
  rationale: עָרֹב는 정확한 종을 특정하지 않는 재앙의 ‘무리/떼’를 가리키므로, 과도한 특정화를 피하고 문맥상 자연스러운 ‘그 무리’로 옮겼습니다.
- source_word: לֹא נִשְׁאַר אֶחָד
  english_pob_choice: not one remained
  chosen_korean: 하나도 남지 않았습니다
  alternatives_korean:
  - 한 마리도 남지 않았습니다
  - 아무도 남지 않았습니다
  lexicon: HALOT
  rationale: 부정문과 ‘한 개/하나’의 강조를 살려, 원문의 절대적 소멸을 한국어에서 자연스럽게 전달했습니다.
theological_decisions:
- issue: 여호와 대체 여부
  chosen_reading: 야훼를 본문에 직접 사용했습니다.
  alternative_readings:
