source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹר֙ אֶֽל אַהֲרֹ֔ן נְטֵ֣ה אֶֽת מַטְּ/ךָ֔ וְ/הַ֖ךְ אֶת עֲפַ֣ר הָ/אָ֑רֶץ וְ/הָיָ֥ה לְ/כִנִּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
  footnotes:
  - marker: a
    text: Or “lice”; the Hebrew term refers to small biting or irritating insects, and the exact species is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “아론에게 말하라. 네 지팡이를 내밀어 땅의 흙을 치라. 그러면 그것이 이집트 온 땅에서 모기들이 될 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어의 כִּנִּים은 정확한 종을 단정하기 어려워, ‘이’, ‘각다귀들’, ‘모기들’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원문 직접성 원칙에 따라 신명은 전통적 대체어인 ‘주’가 아니라 학술 음역 ‘야훼’로 옮겼습니다.
- source_word: מַטְּךָ
  english_pob_choice: your staff
  chosen_korean: 네 지팡이
  alternatives_korean:
  - 네 막대기
  - 네 지팡이
  lexicon: HALOT
  rationale: 아론이 손에 들고 있는 도구를 자연스럽고 현대적인 한국어로 나타내기 위해 ‘지팡이’를 택했습니다.
- source_word: עֲפַר הָאָרֶץ
  english_pob_choice: the dust of the earth
  chosen_korean: 땅의 흙
  alternatives_korean:
  - 땅의 먼지
  - 땅의 티끌
  lexicon: HALOT
  rationale: 문맥상 재앙의 대상이 되는 지면의 미세한 흙을 가리키므로, 지나치게 시적이거나 전통적 색채가 강한 표현보다 ‘땅의 흙’이 직접적입니다.
- source_word: לְכִנִּם
  english_pob_choice: gnats
  chosen_korean: 모기들
  alternatives_korean:
  - 각다귀들
  - 이
  - 작은 곤충들
  lexicon: HALOT
  rationale: 영어 POB가 종을 단정하지 않고 작은 성가신 벌레로 처리한 점을 따라, 한국어에서도 특정성을 과도하게 높이지 않는 일상적 해충어를 선택했습니다.
theological_decisions:
- issue: 재앙의 대상인 כִּנִּים의 종명 불확실성
  chosen_reading: ‘모기들’로 옮기되, 특정 곤충 종을 확정하지는 않습니다.
  alternative_readings:
  - ‘이’
  - ‘각다귀들’
  - ‘작은 벌레들’
  rationale: 히브리어는 정확한 종을 단정하기 어렵고, 본문은 재앙의 گست범위와 불쾌함을 강조합니다. 따라서 한국어도 의미 효과를 살리면서 과도한 분류 확정을 피했습니다.
  doctrine_reference: 출애굽기 8:12의 어휘 불확실성에 대한 본문 비평/어휘 주석
- issue: 직접화법 안의 명령형 register
  chosen_reading: ‘말하라’, ‘내밀어’, ‘치라’로 명령형을 유지합니다.
  alternative_readings:
  - 완곡한 서술형
  - 공손한 청유형
  rationale: 하나님의 지시가 모세를 통해 아론에게 전달되는 구조를 보존하려면, 한국어도 명령형의 긴장을 약화시키지 않는 것이 적절합니다.
  doctrine_reference: 출애굽기 서술 구조
