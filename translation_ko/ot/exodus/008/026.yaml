translation:
  language: ko
  text: 모세는 바로에게서 나가 여호와께 간구했습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주께 간절히 기도했습니다’. 히브리어 동사는 긴급한 간청이나 탄원을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가
  alternatives_korean:
  - 나갔습니다
  - 떠났습니다
  - 나와
  lexicon: HALOT
  rationale: 동사의 기본 의미는 물리적 이탈이므로, 서술 흐름을 살리면서도 현대 한국어에서 자연스러운 ‘나가’로 옮겼습니다.
- source_word: מֵעִם פַּרְעֹה
  english_pob_choice: from Pharaoh
  chosen_korean: 바로에게서
  alternatives_korean:
  - 바로로부터
  - 바로의 앞에서
  - 바로와 함께한 자리에서
  lexicon: HALOT
  rationale: מֵעִם은 단순한 출발보다 ‘곁/면전에서 떨어져 나옴’의 뉘앙스를 가지므로, 한국어에서는 ‘-에게서’로 간결하게 반영했습니다.
- source_word: וַיֶּעְתַּר
  english_pob_choice: pleaded
  chosen_korean: 간구했습니다
  alternatives_korean:
  - 간청했습니다
  - 애원했습니다
  - 간절히 기도했습니다
  lexicon: HALOT
  rationale: עתר은 일반적인 기도보다 절박하고 간절한 청원을 가리키므로, 그 강도를 유지하면서도 예배적 문맥에 어울리는 ‘간구했습니다’를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 이 작업의 한국어 표준 용례와 출판 가독성을 고려해 고유명사 표기는 ‘여호와’를 사용했습니다. 다만 원어의 언약적 신명 표지라는 점은 보존됩니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 여호와로 표기하되, 원문이 하나님의 고유한 언약적 이름을 가리킨다는 점을 유지했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절은 יהוה를 직접 사용하므로 단순 호칭 ‘주’로 대체하면 원문의 고유명사성이 약화됩니다. 한국어 성경 독자에게는 ‘여호와’가 가장 널리 인지되는 신명 표기입니다.
  doctrine_reference: Exodus 8:26 source text; DOCTRINE.md contested divine-name rendering
