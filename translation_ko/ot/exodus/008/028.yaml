source:
  edition: WLC
  text: וַ/יַּכְבֵּ֤ד פַּרְעֹה֙ אֶת לִבּ֔/וֹ גַּ֖ם בַּ/פַּ֣עַם הַ/זֹּ֑את וְ/לֹ֥א שִׁלַּ֖ח אֶת הָ/עָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
  footnotes:
  - marker: a
    text: Hebrew literally, 'made his heart heavy.' The idiom means that Pharaoh became stubborn or unresponsive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 파라오가 이번에도 자신의 마음을 완악하게 하였고, 백성을 보내지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘그의 마음을 무겁게 하였다’는 뜻입니다. 이 관용구는 완고함이나 무감각함을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  english_pob_choice: hardened
  chosen_korean: 완악하게 하였습니다
  alternatives_korean:
  - 굳게 하였습니다
  - 무겁게 하였습니다
  - 마음을 완강하게 하였습니다
  lexicon: HALOT
  rationale: שורש כבד의 직역인 ‘무겁게 하다’보다, 마음을 대상으로 한 관용구의 뜻인 완고함·저항성을 드러내는 ‘완악하게 하다’가 문맥과 서사를 더 잘 살립니다.
- source_word: לִבּוֹ
  english_pob_choice: his heart
  chosen_korean: 자신의 마음
  alternatives_korean:
  - 그의 마음
  - 그의 قلب
  lexicon: HALOT
  rationale: 히브리어의 ‘마음’은 의지와 태도의 중심이므로 그대로 살리되, 한국어에서는 앞말과의 자연스러운 결합을 위해 ‘자신의 마음’으로 옮겼습니다.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  english_pob_choice: also ... this time
  chosen_korean: 이번에도
  alternatives_korean:
  - 이때도
  - 이번 일에도
  - 또다시 이번에
  lexicon: HALOT
  rationale: ‘이번에도’는 반복성과 추가의 뉘앙스를 함께 담아, 파라오의 반응이 이전과 같은 연속선 위에 있음을 자연스럽게 전달합니다.
- source_word: שִׁלַּח אֶת הָעָם
  english_pob_choice: did not let the people go
  chosen_korean: 백성을 보내지 않았습니다
  alternatives_korean:
  - 백성을 놓아주지 않았습니다
  - 백성을 떠나보내지 않았습니다
  - 백성을 가게 하지 않았습니다
  lexicon: HALOT
  rationale: 출애굽기에서 שלח + 목적어는 출애굽 허용의 관용표현이므로, 직역적이면서도 본문의 의미를 분명히 하는 ‘보내지 않았다’를 택했습니다.
theological_decisions:
- issue: 파라오의 책임 주체를 어떻게 드러낼지
  chosen_reading: 파라오가 자신의 마음을 완악하게 하였습니다
  alternative_readings:
  - 파라오의 마음이 완악해졌습니다
  - 파라오가 마음을 무겁게 하였습니다
  rationale: 이 절은 파라오를 명시적 행위자로 제시하므로, 주어의 책임성과 의도적 거부를 흐리지 않도록 주체성을 분명히 유지했습니다.
  doctrine_reference: 출애굽기 내 하드닝 서사의 긴장 유지
