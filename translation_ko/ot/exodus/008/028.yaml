  terminology: ‘파라오’, ‘마음’, ‘완악하게 하다’, ‘백성’은 일관되고 적절합니다. 각주도 כבד의 문자적 ‘무겁게 하다’와 문맥상 완고함·무감각함의 뜻을 모두 보존합니다.
