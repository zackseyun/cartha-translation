revisions:
- from: 마술사들도 자기들의 비술로 그 이(니)를 끌어내려고 똑같이 했으나, 그렇게 할 수 없었습니다. 그 이는 사람과 짐승에게 있었습니다.[a]
  to: 마술사들도 자기들의 비술로 각다귀들[a]을 만들어 내려고 그렇게 하였으나, 그렇게 할 수 없었습니다. 각다귀들은 사람과 짐승 위에 있었습니다.
  rationale: 문법적으로 불가능한 ‘이(니)’를 영어 POB의 본문 선택에 상응하는 ‘각다귀들’로 바로잡고, 전통적 대안인 ‘이’와 히브리어 낱말의 불확실성은 각주에 보존했습니다. 또한 לְהוֹצִיא의 산출 시도를 ‘만들어 내려고’로, בָּאָדָם וּבַבְּהֵמָה의 위치 표현을 ‘사람과 짐승 위에’로 자연스럽게 옮겼습니다.
