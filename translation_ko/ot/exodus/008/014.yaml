base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
  footnotes:
  - marker: a
    text: Or "lice." The Hebrew term for the insect is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 마술사들도 자기들의 비술로 그 이(니)를 끌어내려고 똑같이 했으나, 그렇게 할 수 없었습니다. 그 이는 사람과 짐승에게 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이.” 곤충을 가리키는 히브리어의 정확한 뜻은 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  english_pob_choice: the magicians
  chosen_korean: 마술사들
  alternatives_korean:
  - 박수들
  - 주술사들
  - 마법사들
  lexicon: HALOT
  rationale: 바로의 궁정에서 기적을 흉내 내는 전문 기술자를 가리키므로, 현대 한국어에서 자연스럽고 맥락이 드러나는 ‘마술사들’로 옮겼습니다.
- source_word: בְּלָטֵיהֶם
  english_pob_choice: by their secret arts
  chosen_korean: 자기들의 비술로
  alternatives_korean:
  - 자기들의 은밀한 술법으로
  - 자기들의 주술로
  - 비밀스러운 기술로
  lexicon: HALOT
  rationale: 숨은 마술적 행위를 가리키는 표현이므로, 의미를 직접 드러내는 ‘비술’이 가장 간결하고 문맥에 맞습니다.
- source_word: הַכִּנִּים / הַכִּנָּם
  english_pob_choice: the gnats
  chosen_korean: 그 이
  alternatives_korean:
  - 그 곤충들
  - 그 빈대들
  - 그 벼룩들
  lexicon: HALOT
  rationale: 이 곤충의 정확한 종이 불확실하므로, 본문과 각주를 분리해 ‘이’로 두고 대안 번역 가능성을 각주로 남겼습니다.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  english_pob_choice: on man and on beast
  chosen_korean: 사람과 짐승에게
  alternatives_korean:
  - 사람에게와 짐승에게
  - 인간과 가축에게
  - 사람과 동물에게
  lexicon: HALOT
  rationale: 히브리어의 병렬 구조를 자연스럽게 한국어로 옮기되, ‘사람/짐승’의 대조를 유지했습니다.
theological_decisions:
- issue: כִּנִּים의 곤충 명칭 불확실성
  chosen_reading: 본문에는 ‘이’로 두고, 곤충의 정확한 종은 각주에서 밝힙니다.
  alternative_readings:
  - 벼룩
  - 이
  - 각종 작은 날벌레
  rationale: 원문과 영어 POB가 모두 종 식별의 불확실성을 인정하므로, 본문을 단정적으로 특정하지 않고 번역 선택의 불확실성을 보존했습니다.
  doctrine_reference: POB source-first principle; lexical transparency
- issue: אָדָם의 집합적 의미
  chosen_reading: ‘사람’으로 번역하여 인간 일반을 가리키는 집합적 뜻을 살렸습니다.
  alternative_readings:
  - 인간
  - 사람들
  - 인류
  rationale: 히브리어의 단수 집합형을 한국어에서 성별을 지우지 않는 범위 안에서 자연스럽게 표현했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
