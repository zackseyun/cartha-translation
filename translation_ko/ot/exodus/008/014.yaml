  source_fidelity: 히브리어는 바로의 마술사들이 자신들의 비술로 כִּנִּים를 ‘끌어내려/생겨나게 하려’ 했으나 실패했고, 그 곤충들이 사람과 짐승 위에 있었다고 말합니다. 초안의 ‘이(니)’는 원문 표기로서 부적절하며, 본문 선택과 각주 대안도 동일하게 되어 어휘 불확실성을 전달하지 못합니다.
  naturalness: ‘그 이(니)를 끌어내려고’는 현대 표준 한국어에서 비문에 가깝고, ‘그 이는 사람과 짐승에게 있었습니다’도 곤충의 위치를 표현하는 데 다소 어색합니다. ‘각다귀들’과 ‘사람과 짐승 위에 있었습니다’가 문맥상 자연스럽습니다.
  terminology: ‘마술사들’과 ‘비술’은 궁정의 의례적·주술적 전문가와 그 은밀한 기술을 과도하게 특정하지 않고 잘 옮깁니다. כִּנִּים는 정확한 종이 불확실하므로 영어 POB의 본문 선택을 따라 ‘각다귀들’로 옮기고, ‘이’를 각주 대안으로 보존하는 것이 적절합니다.
  issues:
