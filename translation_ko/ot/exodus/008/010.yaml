  text: וַ/יִּצְבְּר֥וּ אֹתָ֖/ם חֳמָרִ֣ם חֳמָרִ֑ם וַ/תִּבְאַ֖שׁ הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/010.yaml
  text: And they piled them up in heap after heap[a], and the land stank.
  footnotes:
  - marker: a
    text: Or 'in heaps' or 'heap upon heap'; the Hebrew repeats the noun for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그것들을 거듭거듭 더미로 쌓아 두었는데, 땅이 악취를 풍겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더미마다’, ‘더미 위에 더미로’. 히브리어는 반복 명사로 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  english_pob_choice: they piled ... up
  chosen_korean: 거듭거듭 더미로 쌓아 두었는데
  alternatives_korean:
  - 쌓아 올렸는데
  - 쌓아 모았는데
  lexicon: HALOT
  rationale: צבר는 단순히 모으는 것보다 덩어리나 더미로 쌓는 동작을 가리키므로, ‘더미로 쌓아 두다’로 구체성을 살렸습니다.
- source_word: חֳמָרִם חֳמָרִם
  english_pob_choice: in heap after heap
  chosen_korean: 거듭거듭 더미로
  alternatives_korean:
  - 더미마다
  - 더미 위에 더미로
  lexicon: HALOT
  rationale: 반복된 명사는 많은 더미를 강조하므로, 한국어에서는 반복감을 살려 ‘거듭거듭’으로 분산적 강조를 표현했습니다.
- source_word: וַתִּבְאַשׁ
  english_pob_choice: stank
  chosen_korean: 악취를 풍겼습니다
  alternatives_korean:
  - 썩은 냄새가 났습니다
  - 악취가 났습니다
  lexicon: HALOT
  rationale: באש는 강한 악취를 뜻하므로, 직접적이고 생생한 표현인 ‘악취를 풍기다’를 택했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 온 땅
  lexicon: HALOT
  rationale: 출애굽기 재앙 문맥의 אֶרֶץ는 지역 전체를 가리키는 ‘땅’으로 옮기는 것이 자연스럽습니다.
theological_decisions:
- issue: 반복 표현의 강조 효과
  chosen_reading: 히브리어의 중복 명사를 한국어에서 단순 복수화하지 않고, ‘거듭거듭’으로 강조를 살렸습니다.
  alternative_readings:
  - ‘더미마다’처럼 단순 분배적으로 옮길 수 있음
  - ‘더미 위에 더미로’처럼 직역할 수 있음
  rationale: 원문의 수사적 강조를 독자가 즉시 느끼도록 하면서도, 문장이 자연스럽게 읽히게 하기 위한 선택입니다.
  doctrine_reference: 문체/수사
