  source_fidelity: 히브리어의 ‘쌓다’와 반복된 ‘더미’를 반영하고, 땅 전체에 악취가 난 결과를 충실히 전달합니다. 다만 초안의 ‘쌓아 두었는데’는 원문에 없는 보관·방치의 뉘앙스를 더하며, ‘그 땅’이 정관사와 문맥상 재앙이 미친 지역을 더 잘 드러냅니다.
