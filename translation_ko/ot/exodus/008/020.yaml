  text: וַ/יַּ֤עַשׂ יְהוָה֙ כֵּ֔ן וַ/יָּבֹא֙ עָרֹ֣ב כָּבֵ֔ד בֵּ֥יתָ/ה פַרְעֹ֖ה וּ/בֵ֣ית עֲבָדָ֑י/ו וּ/בְ/כָל אֶ֧רֶץ מִצְרַ֛יִם תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ מִ/פְּנֵ֥י הֶ/עָרֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
  footnotes:
  - marker: a
    text: Or 'a great swarm'; the Hebrew may denote a massive swarm of insects, traditionally understood as flies.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그리하셨습니다[a]. 무거운 떼가 바로바로의 집과 그의 종들의 집에 들어왔고, 이집트 온 땅이 그 떼 때문에 황폐해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 떼’로 옮길 수 있습니다. 히브리어는 대규모 곤충 떼를 뜻할 수 있으나, 전통적으로는 파리 떼로 이해되어 왔습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사 טetragrammaton은 POB의 원칙에 따라 ‘야훼’로 옮겨, 단순 호칭이 아닌 언약적 고유명을 드러냈습니다.
- source_word: עָרֹב
  english_pob_choice: swarm
  chosen_korean: 떼
  alternatives_korean:
  - 무리
  - 곤충 떼
  - 파리 떼
  lexicon: HALOT
  rationale: 히브리어는 종의 정확한 식별이 불확실하므로, 본문의 어휘적 모호성을 살려 ‘떼’로 옮겼습니다.
- source_word: כָּבֵד
  english_pob_choice: heavy
  chosen_korean: 무거운
  alternatives_korean:
  - 큰
  - 심한
  - 엄청난
  lexicon: HALOT
  rationale: 직역적 뉘앙스를 살리되 한국어에서 자연스럽게 읽히도록 ‘무거운’을 택해, 떼의 규모와 압박감을 함께 반영했습니다.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  english_pob_choice: the land was ruined
  chosen_korean: 황폐해졌습니다
  alternatives_korean:
  - 망가졌습니다
  - 파괴되었습니다
  - 훼손되었습니다
  lexicon: HALOT
  rationale: Niphal of שׁחת는 단순 손상보다 ‘황폐/파괴’의 결과를 가리키므로, 과장 없이 강한 결과를 드러내는 ‘황폐해졌습니다’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접적 개입을 서술하는 완료형 표현
  chosen_reading: ‘야훼께서 그리하셨습니다’로 번역해 원문의 단정적 서술을 유지했습니다.
  alternative_readings:
  - 야훼께서 그렇게 하셨습니다
  - 야훼께서 그대로 행하셨습니다
  rationale: וַיַּעַשׂ יְהוָה כֵּן은 단순 결과 보고가 아니라 명령/예고의 성취를 강조하므로, 한국어도 그 성취감을 유지해야 합니다.
  doctrine_reference: 출애굽기 서술에서 하나님의 말씀 성취를 드러내는 본문
