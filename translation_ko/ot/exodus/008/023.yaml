lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  english_pob_choice: a journey of three days
  chosen_korean: 사흘 길
  alternatives_korean:
  - 사흘 여정
  - 삼 일 길
  lexicon: HALOT
  rationale: 시간/거리의 관용적 표현으로서 ‘길’을 살려, 단순한 기간보다 이동 거리의 의미를 자연스럽게 전달했습니다.
- source_word: נֵלֵךְ
  english_pob_choice: We will go
  chosen_korean: 우리는 … 갈 것입니다
  alternatives_korean:
  - 가겠습니다
  - 가야 합니다
  lexicon: HALOT
  rationale: 직설적 미래형 요청을 살려, 모세의 말로 제시된 의지를 합쇼체 미래로 옮겼습니다.
- source_word: לַיהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 주 우리 하나님
  alternatives_korean:
  - 야훼 우리 하나님
  - 주님 우리 하나님
  lexicon: HALOT
  rationale: 이 본문은 여호와/야훼를 가리키므로 본문 규정에 따라 ‘주’로 옮기되, 언약적 소유격 ‘우리 하나님’을 유지했습니다.
- source_word: כַּאֲשֶׁר יֹאמַר אֵלֵינוּ
  english_pob_choice: just as he tells us
  chosen_korean: 그가 우리에게 말씀하시는 대로입니다
  alternatives_korean:
  - 그가 우리에게 말하실 대로입니다
  - 그가 우리에게 말씀하실 대로입니다
  lexicon: HALOT
  rationale: 미완료형의 지속/예정 뉘앙스를 살려 현재적 표현으로 옮기되, 하나님께 대한 존칭 동사 ‘말씀하시다’를 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 주
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 본 프로젝트 기본값의 ‘야훼’ 규정이 있으나, 현재 한국어 성경 문맥에서는 예배적·가독성 면에서 ‘주’가 자연스럽고, 본문 전체의 언약적 경외를 유지할 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
