  text: וַ/יַּֽעֲשׂוּ כֵ֗ן וַ/יֵּט֩ אַהֲרֹ֨ן אֶת יָד֤/וֹ בְ/מַטֵּ֨/הוּ֙ וַ/יַּךְ֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה כָּל עֲפַ֥ר הָ/אָ֛רֶץ הָיָ֥ה כִנִּ֖ים בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
  footnotes:
  - marker: a
    text: Or 'lice'; the Hebrew term כנים is uncertain in precise zoological identification.
    reason: lexical_alternative
  - marker: b
    text: '''Man'' here is a collective term for human beings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그렇게 했습니다[a]. 아론은 지팡이를 든 손을 내밀어 땅의 티끌을 쳤고, 그 뒤로 사람과 짐승[b] 위에 각다귀가 생겼습니다. 땅의 모든 티끌이 애굽 온 땅에서 각다귀가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이들/그들은 이렇게 했습니다’. 히브리어의 서술 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사람’은 여기서 남성만이 아니라 사람 전체를 가리키는 집합적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  english_pob_choice: And they did so
  chosen_korean: 그들이 그렇게 했습니다
  alternatives_korean:
  - 그들이 그리하였습니다
  - 그들이 그렇게 하였습니다
  lexicon: HALOT
  rationale: 서술형 순응 표현을 자연스러운 현대 한국어로 옮기되, 명령 수행의 응답성을 유지했습니다.
- source_word: וַיֵּט ... אֶת יָד... בְּמַטֵּהוּ
  english_pob_choice: stretched out his hand with his staff
  chosen_korean: 지팡이를 든 손을 내밀어
  alternatives_korean:
  - 그의 손을 지팡이와 함께 내밀어
  - 지팡이로 그의 손을 뻗어
  lexicon: HALOT
  rationale: 히브리어의 ‘손 + 지팡이’ 결합을 한국어에서 가장 자연스럽게 살리면서도, 지팡이가 동반된 도구·상태를 드러냈습니다.
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  english_pob_choice: struck the dust of the earth
  chosen_korean: 땅의 티끌을 쳤고
  alternatives_korean:
  - 땅의 먼지를 쳤고
  - 땅의 흙먼지를 쳤고
  lexicon: HALOT
  rationale: עפר의 반복 이미지를 살리기 위해 ‘티끌’로 옮겼고, 재앙의 물리적 충격을 ‘쳤고’로 간결하게 표현했습니다.
- source_word: וַתְּהִי הַכִּנָּם ... כִנִּים
  english_pob_choice: the gnats came upon ... All the dust ... became gnats
  chosen_korean: 각다귀가 생겼고 ... 각다귀가 되었습니다
  alternatives_korean:
  - 각다귀가 나타났고 ... 각다귀로 변했습니다
  - 모기가 생겼고 ... 모기가 되었습니다
  lexicon: HALOT
  rationale: כנים의 식별 불확실성을 고려해 한국어 본문은 중립적인 ‘각다귀’를 택했고, ‘생기다/되다’로 발생과 결과를 각각 살렸습니다.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  english_pob_choice: upon man and beast
  chosen_korean: 사람과 짐승 위에
  alternatives_korean:
  - 사람과 가축 위에
  - 인간과 짐승에게
  lexicon: HALOT
  rationale: אָדָם의 집합적 의미를 한국어에서 가장 무난하게 ‘사람’으로 옮기고, 대조되는 짝인 בְּהֵמָה는 ‘짐승’으로 보존했습니다.
theological_decisions:
- issue: כנים의 동물명 불확실성
  chosen_reading: 본문은 ‘각다귀’로 옮기고, 주석에서 다른 가능성을 열어 둡니다.
  alternative_readings:
  - 이
  - 모기
  rationale: 히브리어 종명은 확정적이지 않으므로, 본문은 자연스러운 현대어를 택하되 의미 범주를 좁혀 단정하지 않도록 했습니다.
  doctrine_reference: 'POB lexical policy: uncertain zoological identification should be footnoted rather than overclaimed.'
