  lexicon: HALOT
  rationale: ‘서 있다’의 직역보다, 땅에 대한 정착·거주를 드러내는 한국어 표현이 문맥에 더 적합하여 존재 상태를 자연스럽게 옮겼습니다.
- source_word: עָרֹב
  english_pob_choice: swarm
  chosen_korean: 무리
  alternatives_korean:
  - 떼
  - 날벌레 무리
  - 곤충 떼
  lexicon: HALOT
  rationale: 히브리어 עָרֹב은 정확한 곤충명보다 ‘뒤섞여 몰려드는 무리’의 뜻이 핵심이어서, 개체를 특정하지 않는 ‘무리’로 옮기고 모호성은 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약 이름 יְהוָה는 호칭이 아니라 고유명사이므로, 본 프로젝트 기본 원칙에 따라 ‘야훼’로 음역했습니다.
- source_word: בְּקֶרֶב הָאָרֶץ
  english_pob_choice: in the midst of the land
  chosen_korean: 땅 한가운데에
  alternatives_korean:
  - 땅의 한복판에
  - 땅 가운데에
  - 세상 한가운데에
  lexicon: HALOT
  rationale: ‘땅 한가운데’는 בקרב의 공간적 중심성을 살리면서도 한국어로 자연스럽고, 문맥상 이집트 땅을 가리키는 범위를 유지합니다.
theological_decisions:
- issue: 야훼의 임재를 ‘땅 한가운데’로 표현하는 범위
  chosen_reading: 땅 한가운데에 있는 야훼
  alternative_readings:
  - 땅 가운데에 있는 야훼
  - 땅의 한가운데에 있는 야훼
  - 세상 한가운데에 있는 야훼
  rationale: 히브리어는 의도적으로 범위를 넓게 열어 두므로, 이집트 땅 안에서의 임재를 기본으로 하되 ‘땅 한가운데’라는 표현을 유지해 원문의 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: preserve theological tension rather than resolve it'
