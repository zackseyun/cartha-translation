  lexicon: HALOT
  rationale: 히필형 פלא는 단순한 분리가 아니라 다른 곳과 다르게 취급하는 뜻이므로, 문맥상 자연스럽고 보호의 뉘앙스를 살리는 ‘구별하다’를 택했습니다.
- source_word: אֶרֶץ גֹּשֶׁן
  english_pob_choice: the land of Goshen
  chosen_korean: 고센 땅
  alternatives_korean:
  - 고센 지역
  - 고센의 땅
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 지리적 영역을 가리키므로 표준적인 지명 결합인 ‘고센 땅’이 가장 자연스럽습니다.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  english_pob_choice: where my people dwell
  chosen_korean: 거기에 내 백성이 있기에
  alternatives_korean:
