  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
  footnotes:
  - marker: a
    text: Or 'swarms' or 'a swarm of insects'; the Hebrew term עָרֹב may refer more broadly to a mass of insects, not only flies.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the midst of the earth.' The Hebrew can be read more broadly, though in context it likely refers to the land of Egypt.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그날에 나는 고센 땅[a]을 구별할 것이니, 거기에 내 백성이 있기에 그곳에는 무리가 없을 것입니다[b]. 이는 당신이 내가 땅 한가운데에 있는 야훼인 줄 알게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘무리들’, 혹은 ‘곤충의 떼’로도 옮길 수 있습니다. 히브리어 עָרֹב은 단순히 파리를 뜻하기보다 더 넓은 벌레 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 한가운데에’. 히브리어는 더 넓게 읽힐 수 있으나, 문맥상 이집트 땅을 가리키는 것으로 보는 것이 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  english_pob_choice: I will set apart
  chosen_korean: 구별할 것이니
  alternatives_korean:
  - 분리할 것이니
  - 따로 둘 것이니
  - 구별하여 두겠습니다
  lexicon: HALOT
  rationale: 히필형 פלא는 단순한 분리가 아니라 다른 곳과 다르게 취급하는 뜻이므로, 문맥상 자연스럽고 보호의 뉘앙스를 살리는 ‘구별하다’를 택했습니다.
- source_word: אֶרֶץ גֹּשֶׁן
  english_pob_choice: the land of Goshen
  chosen_korean: 고센 땅
  alternatives_korean:
  - 고센 지역
  - 고센의 땅
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 지리적 영역을 가리키므로 표준적인 지명 결합인 ‘고센 땅’이 가장 자연스럽습니다.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  english_pob_choice: where my people dwell
  chosen_korean: 거기에 내 백성이 있기에
  alternatives_korean:
  - 내 백성이 거기에 거주하기에
  - 내 백성이 그 위에 서 있기에
  lexicon: HALOT
  rationale: ‘서 있다’의 직역보다, 땅에 대한 정착·거주를 드러내는 한국어 표현이 문맥에 더 적합하여 존재 상태를 자연스럽게 옮겼습니다.
- source_word: עָרֹב
  english_pob_choice: swarm
  chosen_korean: 무리
  alternatives_korean:
  - 떼
  - 날벌레 무리
  - 곤충 떼
  lexicon: HALOT
  rationale: 히브리어 עָרֹב은 정확한 곤충명보다 ‘뒤섞여 몰려드는 무리’의 뜻이 핵심이어서, 개체를 특정하지 않는 ‘무리’로 옮기고 모호성은 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약 이름 יְהוָה는 호칭이 아니라 고유명사이므로, 본 프로젝트 기본 원칙에 따라 ‘야훼’로 음역했습니다.
- source_word: בְּקֶרֶב הָאָרֶץ
  english_pob_choice: in the midst of the land
  chosen_korean: 땅 한가운데에
  alternatives_korean:
  - 땅의 한복판에
  - 땅 가운데에
  - 세상 한가운데에
  lexicon: HALOT
  rationale: ‘땅 한가운데’는 בקרב의 공간적 중심성을 살리면서도 한국어로 자연스럽고, 문맥상 이집트 땅을 가리키는 범위를 유지합니다.
theological_decisions:
- issue: 야훼의 임재를 ‘땅 한가운데’로 표현하는 범위
  chosen_reading: 땅 한가운데에 있는 야훼
  alternative_readings:
  - 땅 가운데에 있는 야훼
  - 땅의 한가운데에 있는 야훼
  - 세상 한가운데에 있는 야훼
  rationale: 히브리어는 의도적으로 범위를 넓게 열어 두므로, 이집트 땅 안에서의 임재를 기본으로 하되 ‘땅 한가운데’라는 표현을 유지해 원문의 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: preserve theological tension rather than resolve it'
