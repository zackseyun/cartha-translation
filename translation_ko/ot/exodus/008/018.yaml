  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
  footnotes:
  - marker: a
    text: Or 'swarms' or 'a swarm of insects'; the Hebrew term עָרֹב may refer more broadly to a mass of insects, not only flies.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the midst of the earth.' The Hebrew can be read more broadly, though in context it likely refers to the land of Egypt.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그날에는 내가 내 백성이 사는 고센 땅을 구별해 두어, 그곳에는 떼가 없게 하겠습니다[a]. 이것은 당신이 내가 땅 가운데에 있는 야훼임을 알게 하려는 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떼들’ 혹은 ‘곤충 떼’. 히브리어 עָרֹב은 파리에만 한정되지 않고 더 넓게 곤충의 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘세상 한가운데에’. 히브리어는 더 넓게 읽힐 수 있으나, 문맥상 이집트 땅을 가리키는 것으로 보는 것이 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  english_pob_choice: I will set apart
  chosen_korean: 구별할 것이니
  alternatives_korean:
