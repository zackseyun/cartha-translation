base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
  footnotes:
  - marker: a
    text: Or 'that he had set against Pharaoh.' The Hebrew verb is literally 'put' or 'set'; 'brought upon' expresses the sense idiomatically in this plague context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 모세와 아론은 바로에게서 나왔습니다. 모세는 야훼께서 바로에게 내리신 그 개구리들에 관하여 야훼께 부르짖었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא / מֵעִם פַּרְעֹה
  english_pob_choice: went out from Pharaoh
  chosen_korean: 바로에게서 나갔습니다
  alternatives_korean:
  - 바로에게서 떠났습니다
  - 바로의 앞에서 나갔습니다
  lexicon: HALOT
  rationale: יצא의 기본 뜻을 자연스럽게 살리면서, מֵעִם은 단순한 출발이 아니라 바로의 존재/자리에서 물러남을 나타내므로 ‘에게서’가 적절합니다.
- source_word: וַיִּצְעַק
  english_pob_choice: cried out
  chosen_korean: 외쳤습니다
  alternatives_korean:
  - 크게 부르짖었습니다
  - 간구했습니다
  lexicon: HALOT
  rationale: צעק은 강한 외침을 뜻하므로, 현대 한국어에서 그 긴급성과 강도를 살릴 수 있는 ‘외쳤습니다’가 가장 간결합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주께
  lexicon: HALOT
  rationale: 히브리어 본문의 신명사 יְהוָה를 번역 전통적 치환어가 아니라 음역인 ‘야훼’로 옮겨, 본문의 고유한 언약 이름을 보존했습니다.
- source_word: עַל דְּבַר הַצְפַרְדְּעִים
  english_pob_choice: concerning the frogs
  chosen_korean: 그 개구리들 때문에
  alternatives_korean:
  - 그 개구리들에 관하여
  - 그 개구리들로 인하여
  lexicon: HALOT
  rationale: עַל דְּבַר은 ‘관하여/때문에’의 의미 범위를 가지며, 재앙 문맥에서는 결과적·사유적 뉘앙스가 강하므로 자연스러운 한국어로 풀었습니다.
- source_word: שָׂם לְפַרְעֹה
  english_pob_choice: that he had brought upon Pharaoh / had set upon Pharaoh
  chosen_korean: 바로에게 내리신
  alternatives_korean:
  - 바로에게 두신
  - 바로에게 놓으신
  lexicon: HALOT
  rationale: שׂוּם의 직역은 ‘두다/놓다’이지만, 재앙 문맥에서는 하나님이 재앙을 ‘내리신’ 뜻을 드러내는 것이 한국어로 더 정확하고 자연스럽습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 고유 이름을 직접 사용하므로, 제목어 ‘주’로 치환하지 않고 음역인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
