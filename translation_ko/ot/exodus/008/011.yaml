reference: Exodus 8:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּ֤י הָֽיְתָה֙ הָֽ/רְוָחָ֔ה וְ/הַכְבֵּד֙ אֶת לִבּ֔/וֹ וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
  footnotes:
  - marker: a
    text: Or 'there was respite.' The Hebrew term can denote relief, easing, or breathing space.
    reason: lexical_alternative
translation:
  language: ko
  text: 바로 그때 바로바로 그들이 쉴 수 있게 되었음을 파라오가 보고도, 그는 자기 마음을 완고하게 하고 그들에게 귀를 기울이지 않았습니다. 야훼께서 말씀하신 그대로입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쉴 수 있게 되었음’은 히브리어 הָרְוָחָה의 ‘완화, 여유, 숨 돌릴 공간’의 의미를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보고도
  alternatives_korean:
  - 보고
  - 알아차리고
  lexicon: HALOT
  rationale: ראה는 문자적으로 ‘보다’이므로 기본 동사를 살리되, 앞뒤 문맥상 상황 인지를 드러내기 위해 ‘보고도’로 옮겼습니다.
- source_word: כִּי הָיְתָה הָרְוָחָה
  english_pob_choice: that there was relief
  chosen_korean: 쉴 수 있게 되었음을
  alternatives_korean:
  - 안도가 있었음을
  - 숨 돌릴 여유가 생겼음을
  lexicon: HALOT
  rationale: הָרְוָחָה는 ‘여유/완화/숨 돌림’의 뜻을 가지므로, 재앙이 잠시 멈춘 상황을 자연스럽게 드러내는 ‘쉴 수 있게 되다’로 표현했습니다.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  english_pob_choice: he hardened his heart
  chosen_korean: 자기 마음을 완고하게 하고
  alternatives_korean:
  - 자기 마음을 굳게 하고
  - 자기 마음을 무겁게 하고
  lexicon: HALOT
  rationale: כבד의 문자적 ‘무겁게 하다’ 이미지를 살리면서도, 이 출애굽기 관용구가 가리키는 완고함을 현대 한국어로 분명히 전달하도록 했습니다.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  english_pob_choice: and did not listen to them
  chosen_korean: 그들에게 귀를 기울이지 않았습니다
  alternatives_korean:
  - 그들의 말을 듣지 않았습니다
  - 그들을 따르지 않았습니다
  lexicon: HALOT
  rationale: שׁמע + אֶל은 단순 청각보다 ‘귀를 기울여 듣다/받아들이다’의 뜻이므로, ‘귀를 기울이지 않았다’가 거절의 뉘앙스를 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본 용례
  rationale: 여기서는 신명사 יְהוָה를 예외 없이 고유명사로 옮겨, 서술의 직접성과 출처성을 유지했습니다.
theological_decisions:
- issue: 파라오의 마음 완고함의 주체
  chosen_reading: 이 절은 파라오 자신이 자기 마음을 완고하게 한 것으로 제시합니다.
  alternative_readings:
  - 하나님이 그의 마음을 완고하게 하셨다는 함의
  - 그의 마음이 자연히 굳어졌다는 중성적 읽기
  rationale: 히브리어는 파라오를 주어로 둔 능동적 표현이므로, 이 절 자체의 책임 주체를 파라오에게 두되 출애굽기 전체의 다른 절들과의 긴장은 해소하지 않고 남겨 둡니다.
  doctrine_reference: 본문의 주어-행위자 관계를 우선 보존하고, 본문 간 신학적 긴장은 유지합니다.
