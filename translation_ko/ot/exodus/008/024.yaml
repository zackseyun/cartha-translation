  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름 יהוה는 프로젝트 기본값에 따라 야훼로 옮겨, 고유한 언약명임을 보존했습니다.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  english_pob_choice: you must not go very far away
  chosen_korean: 너무 멀리 가지는 마십시오
  alternatives_korean:
  - 멀리 가지 마십시오
  - 아주 멀리 가서는 안 됩니다
  lexicon: HALOT
  rationale: 강조형 구성은 한국어에서 ‘너무 멀리’로 자연스럽게 살려 제한의 뉘앙스를 유지했습니다.
- source_word: הַעְתִּירוּ בַּעֲדִי
  english_pob_choice: Plead for me
  chosen_korean: 나를 위해 간구해 주십시오
  alternatives_korean:
  - 저를 위해 빌어 주십시오
  - 제 대신 간청해 주십시오
  lexicon: HALOT
  rationale: עתר의 호소/중재 의미를 살려 ‘간구하다’로 옮기고, פַּעֲדִי의 목적어를 자연스럽게 ‘나를 위해’로 표현했습니다.
