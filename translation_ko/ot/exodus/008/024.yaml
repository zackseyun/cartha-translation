  rationale: 이 동사는 출애굽 상황에서 ‘떠나게 하다/보내다’의 협상적 의미가 강하므로, 문맥상 자연스러운 결과 조건으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼
