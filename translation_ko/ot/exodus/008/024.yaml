  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: ko
  text: 바로 그때 파라오가 말했습니다. "내가 너희를 보내면, 너희는 광야에서 야훼 너희 하나님께 제사할 것입니다. 다만, 너무 멀리 가지는 마십시오. 나를 위해 간구해 주십시오."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  lexicon: HALOT
  rationale: 히브리어 고유명사 פַּרְעֹה는 현대 한국어 음역으로 파라오가 자연스럽고, 본문의 왕호를 직접 드러냅니다.
- source_word: אֲשַׁלַּח אֶתְכֶם
  english_pob_choice: I will let you go
  chosen_korean: 내가 너희를 보내면
  alternatives_korean:
  - 내가 너희를 놓아주면
  - 내가 너희를 보내 줄 것이니
  lexicon: HALOT
  rationale: 이 동사는 출애굽 상황에서 ‘떠나게 하다/보내다’의 협상적 의미가 강하므로, 문맥상 자연스러운 결과 조건으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름 יהוה는 프로젝트 기본값에 따라 야훼로 옮겨, 고유한 언약명임을 보존했습니다.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  english_pob_choice: you must not go very far away
  chosen_korean: 너무 멀리 가지는 마십시오
  alternatives_korean:
  - 멀리 가지 마십시오
  - 아주 멀리 가서는 안 됩니다
  lexicon: HALOT
  rationale: 강조형 구성은 한국어에서 ‘너무 멀리’로 자연스럽게 살려 제한의 뉘앙스를 유지했습니다.
- source_word: הַעְתִּירוּ בַּעֲדִי
  english_pob_choice: Plead for me
  chosen_korean: 나를 위해 간구해 주십시오
  alternatives_korean:
  - 저를 위해 빌어 주십시오
  - 제 대신 간청해 주십시오
  lexicon: HALOT
  rationale: עתר의 호소/중재 의미를 살려 ‘간구하다’로 옮기고, פַּעֲדִי의 목적어를 자연스럽게 ‘나를 위해’로 표현했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 히브리어 원문에 직접 나타난 신명은 본문에서 그대로 드러내는 것이 원문 충실성에 더 부합하므로, 관용적 대체어보다 야훼를 사용했습니다.
  doctrine_reference: POB glossary — יהוה / YHWH → 야훼
