id: EXO.8.15
reference: Exodus 8:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the finger of God''; an idiom indicating direct divine power at work.'
    reason: cultural_note
  - marker: b
    text: Or 'Pharaoh’s heart became hard/strong.' The Hebrew does not explicitly state the agent of the hardening in this clause.
    reason: lexical_alternative
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 마술사들이 바로에게 말했습니다. 「이것은 하나님의 손가락입니다.」 그러나 바로의 마음은 굳어졌고, 그는 그들의 말을 듣지 않았습니다[b], 야훼께서 말씀하신 그대로였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어는 여기서 ‘강해졌다/굳어졌다’의 결과를 말하지만, 누가 그 마음을 굳게 했는지를 이 절에서 직접 밝히지는 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהוָה(YHWH).
    reason: ot_citation
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  english_pob_choice: the magicians
  chosen_korean: 마술사들
  alternatives_korean:
  - 술사들
  - 궁정 마술사들
  lexicon: HALOT
  rationale: 본문의 인물들은 바로의 주술적/의례적 전문인들을 가리키므로, ‘마술사들’이 의미를 자연스럽게 옮기면서도 출애굽기 문맥의 대결 구도를 잘 드러냅니다.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  english_pob_choice: This is the finger of God
  chosen_korean: 이것은 하나님의 손가락입니다
  alternatives_korean:
  - 이것은 하나님의 손가락입니다
  - 이것은 하나님의 손가락입니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 표현을 직역에 가깝게 살리되, 한국어에서는 ‘손가락’이 가장 직접적이며 구체적인 표현이라 선택했습니다. 이는 단순한 신체 부위가 아니라 직접적인 하나님의 능력이 작동하고 있다는 의미를 담습니다.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  english_pob_choice: Pharaoh’s heart was hardened
  chosen_korean: 바로의 마음은 굳어졌고
  alternatives_korean:
  - 바로의 마음은 강해졌고
  - 바로가 자기 마음을 굳게 했고
  lexicon: HALOT
  rationale: חזק는 ‘강하다/굳다’의 뉘앙스를 가지므로, 한국어에서는 결과 상태를 드러내는 ‘굳어졌고’가 가장 자연스럽습니다. 원문이 이 절에서 직접적 행위 주체를 명시하지 않으므로, 주체를 덧붙이지 않았습니다.
- source_word: שָׁמַע אֲלֵהֶם
  english_pob_choice: did not listen to them
  chosen_korean: 그들의 말을 듣지 않았습니다
  alternatives_korean:
  - 그들에게 귀를 기울이지 않았습니다
  - 그들을 듣지 않았습니다
  lexicon: HALOT
  rationale: שׁמע + אֶל은 단순 청각이 아니라 ‘귀 기울여 듣다/받아들이다’의 뜻이므로, 한국어에서는 자연스러운 관용인 ‘말을 듣지 않았다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה는 프로젝트 기본어에 따라 ‘야훼’로 옮겨, 고유한 언약 이름을 제목어 ‘주님’으로 바꾸지 않았습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문 끝의 יְהוָה는 단순 호칭이 아니라 이스라엘에 계시된 고유 이름이므로, 본문에서 그대로 ‘야훼’로 표기해 원문이 주는 인격적·언약적 강도를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md — Contested terms: יְהוָה YHWH'
- issue: 바로의 마음이 굳어지는 표현의 주체성
  chosen_reading: 바로의 마음은 굳어졌고
  alternative_readings:
  - 바로가 자기 마음을 굳게 했고
  - 바로의 마음이 강해졌고
  rationale: 히브리어는 이 절에서 직접적으로 누구의 행위인지 완전히 풀어 말하지 않으므로, 한국어도 이를 단정적으로 해석하지 않고 결과 상태 중심으로 유지했습니다.
  doctrine_reference: DOCTRINE.md — Preserve theological tension rather than resolve it
