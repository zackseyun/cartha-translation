  source_fidelity: 파라오의 이름이 ‘바리오’로 오기되어 있으며, ‘바로’는 히브리어 본문에 없는 즉시성의 뉘앙스를 더합니다. 또한 마지막 경고는 Pharaoh를 향한 직접 경고로 더 분명히 옮기는 것이 좋습니다. 그 밖에 ‘나가’, ‘간청하겠습니다’, ‘내일’, 제사의 의미는 원문에 충실합니다.
  naturalness: ‘그 무리’도 가능하나 재앙을 이루는 곤충들의 집단을 가리키는 문맥에서는 ‘그 떼’가 더 자연스럽습니다. 마지막 절은 ‘계속 사람을 속이지는 않도록 하십시오’보다 ‘더 이상 기만하지 마십시오’가 현대 합쇼체의 직접 경고로 자연스럽고, 목적어가 불필요하게 일반화되지 않습니다.
  terminology: יַהְוֶה는 프로젝트 방침에 맞게 ‘야훼’로 유지합니다. עָרֹב은 종을 특정하지 않고 ‘그 떼’로 옮기며, 각주에서 파리 떼 등을 가능한 해석으로 제시합니다. לִזְבֹּחַ의 제의적 의미는 ‘제사를 드리다’로 보존합니다.
