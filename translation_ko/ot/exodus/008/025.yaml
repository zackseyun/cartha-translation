  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
  footnotes:
  - marker: a
    text: Hebrew עָרֹב may refer more specifically to a swarm of flies or other swarming insects; the exact referent is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 말했습니다. 「보십시오, 저는 당신에게서 나가 야훼께 간청하겠습니다. 그러면 그 무리가 내일 바로 바리오와 그의 종들과 그의 백성에게서 떠날 것입니다. 다만 파라오가 그 백성을 보내어 야훼께 제사드리게 하지 않으면서 계속 사람을 속이지는 않도록 하십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָרֹב은 더 구체적으로 파리 떼나 다른 떼지어 다니는 곤충을 가리킬 수 있으나, 정확한 대상은 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 보십시오, 보게
  lexicon: HALOT
  rationale: 주의를 환기하는 감탄사로서 현대 한국어 합쇼체에 자연스럽고, 고어적인 ‘보라’를 피하면서도 즉시성을 살립니다.
- source_word: יוֹצֵא מֵעִמָּךְ
  english_pob_choice: am going out from you
  chosen_korean: 당신에게서 나가
  alternatives_korean:
  - 당신을 떠나
  - 당신 곁을 떠나
  lexicon: HALOT
  rationale: יצא의 기본 동작인 ‘나가다’를 살리고, מֵעִמָּךְ의 관계적 분리를 ‘-에게서’로 자연스럽게 옮겼습니다.
- source_word: הֶעָרֹב
  english_pob_choice: the swarm
  chosen_korean: 그 무리
  alternatives_korean:
  - 그 떼
  - 그 섞인 무리
  lexicon: HALOT
  rationale: 정확한 곤충 명칭이 불확실하므로, 특정 종을 단정하지 않는 한국어 표현으로 범위를 보존했습니다.
- source_word: לִזְבֹּחַ
  english_pob_choice: to sacrifice
  chosen_korean: 제사드리게
  alternatives_korean:
  - 희생제사를 드리게
  - 제사하게
  lexicon: HALOT
  rationale: 단순한 예배가 아니라 제의적 희생 제사를 가리키므로, 한국어 성경 문맥에 맞는 ‘제사드리다’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명을 음역으로 유지하여 언약명의 식별성을 보존했습니다.
theological_decisions:
- issue: עָרֹב의 정확한 생물학적 식별
  chosen_reading: 그 무리
  alternative_readings:
  - 그 떼
  - 그 섞인 무리
  - 파리 떼
  rationale: 히브리어가 무엇을 정확히 가리키는지 확정하지 않고, 본문의 긴장을 보존하면서도 한국어로 자연스럽게 전달했습니다.
  doctrine_reference: '번역 원칙: 해석상의 불확실성을 본문이 허용하는 범위 안에서 유지'
- issue: 파라오의 완강함에 대한 경고 어조
  chosen_reading: 계속 사람을 속이지는 않도록 하십시오
  alternative_readings:
  - 계속 속이지는 마십시오
  - 더 이상 조롱하지 마십시오
  rationale: הָתֵל은 단순한 ‘거짓말’보다 모욕적이고 기만적인 조롱을 포함하므로, 문맥상 ‘속이다’의 의미를 살리되 명령형 경고의 뉘앙스를 유지했습니다.
  doctrine_reference: '문맥적 의미 우선: 반복적 기만/조롱의 경고'
