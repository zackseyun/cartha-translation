  - 그 섞인 무리
  lexicon: HALOT
  rationale: 정확한 곤충 명칭이 불확실하므로, 특정 종을 단정하지 않는 한국어 표현으로 범위를 보존했습니다.
- source_word: לִזְבֹּחַ
