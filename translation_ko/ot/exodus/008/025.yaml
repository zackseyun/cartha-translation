  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
  footnotes:
  - marker: a
    text: Hebrew עָרֹב may refer more specifically to a swarm of flies or other swarming insects; the exact referent is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 말했습니다. 「보십시오, 저는 당신에게서 나가 야훼께 간청하겠습니다. 그러면 그 떼[a]가 내일 파라오와 그의 신하들과 그의 백성에게서 떠날 것입니다. 다만 파라오께서는 백성을 보내 야훼께 제사를 드리게 하지 않는 일로 더 이상 기만하지 마십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עָרֹב은 더 구체적으로 파리 떼나 다른 떼 지어 다니는 곤충을 가리킬 수 있으나, 정확한 대상은 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
