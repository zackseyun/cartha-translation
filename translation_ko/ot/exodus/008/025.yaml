  lexicon: HALOT
  rationale: 단순한 예배가 아니라 제의적 희생 제사를 가리키므로, 한국어 성경 문맥에 맞는 ‘제사드리다’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
