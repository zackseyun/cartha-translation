  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명을 음역으로 유지하여 언약명의 식별성을 보존했습니다.
theological_decisions:
- issue: עָרֹב의 정확한 생물학적 식별
  chosen_reading: 그 무리
  alternative_readings:
  - 그 떼
  - 그 섞인 무리
