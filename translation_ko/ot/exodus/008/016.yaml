base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: ko
  text: 그러자 야훼께서 모세에게 말씀하셨습니다. “아침 일찍 일어나 바로 앞에 서십시오. 보십시오, 그가 물가로 나갈 것입니다. 그리고 그에게 이렇게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. 내 백성을 보내 주어 그들이 나를 섬기게 하십시오.’”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘자리를 잡고 서라’에 가까우나, 한국어에서는 공적 대면을 분명히 드러내는 표현으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주
  - 여호와
  lexicon: YHWH
  rationale: 히브리어 본문이 신적 고유명 יהוה를 사용하므로, POB의 주석된 원칙에 따라 ‘야훼’로 옮겨 원문 고유성을 드러냈습니다.
- source_word: הַשְׁכֵּם
  english_pob_choice: Rise early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어나
  - 새벽에 일어나
  lexicon: השכם
  rationale: 동사의 반복적·명령적 뉘앙스를 살리면서 자연스러운 현대 한국어로 풀어, 단순한 시간 정보가 아니라 ‘일찍 일어나’라는 행동 명령을 분명히 했습니다.
- source_word: הִתְיַצֵּב
  english_pob_choice: station yourself
  chosen_korean: 바로 앞에 서십시오
  alternatives_korean:
  - 자신을 세우십시오
  - 대기하십시오
  lexicon: יצב
  rationale: ‘서다/자리를 잡다’의 공적 대면 의미를 살려, 파라오 앞에서의 공식적 출두를 드러내는 표현으로 옮겼습니다.
- source_word: הַמָּיְמָה
  english_pob_choice: to the water
  chosen_korean: 물가로
  alternatives_korean:
  - 물로
  - 물 쪽으로
  lexicon: מים
  rationale: 물의 가장자리로 나간다는 문맥을 반영해, 장소 이동을 자연스럽게 드러내는 ‘물가로’를 택했습니다.
theological_decisions:
- issue: ‘Let my people go, so that they may serve me’의 목적절 처리
  chosen_reading: ‘내 백성을 보내 주어 그들이 나를 섬기게 하십시오’
  alternative_readings:
  - ‘내 백성을 보내십시오. 그러면 그들이 나를 섬길 것입니다’
  - ‘내 백성을 놓아주어 나를 예배하게 하십시오’
  rationale: 히브리어의 שׁלח + 목적절 구조를 그대로 살려, 해방의 목적이 단순 자유가 아니라 야훼를 섬기는 데 있음을 분명히 했습니다. ‘예배하다’보다 רחב한 עבד의 의미를 반영해 ‘섬기다’를 유지했습니다.
  doctrine_reference: 출애굽기의 소명 목적과 언약적 섬김
