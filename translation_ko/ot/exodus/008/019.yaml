  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
  footnotes:
  - marker: a
    text: Or 'redemption' or 'deliverance'; the Hebrew term can carry the sense of God's redeeming act, here expressed as his making a distinction between Israel and Egypt.
