translation:
  language: ko
  text: 내가 내 백성과 네 백성 사이를 구별하겠습니다[a]. 내일 이 표징이 일어날 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속량’ 또는 ‘구원’. 이 히브리어 단어는 하나님의 속량 또는 구원 행위를 뜻할 수도 있지만, 여기서는 이스라엘과 이집트 사이를 구별하시는 뜻으로 나타납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: And I will make
  chosen_korean: 구별을 두겠습니다
  alternatives_korean:
  - 구별하겠습니다
  - 구분을 두겠습니다
  - 두겠습니다
  lexicon: HALOT
  rationale: שׂים은 문자적으로 ‘두다/놓다’이지만, בין…ובין과 함께 쓰일 때는 두 집단을 갈라 놓는 의미가 분명하므로 한국어에서는 자연스럽게 ‘구별을 두다’로 옮겼습니다.
- source_word: פְדֻת
  english_pob_choice: a distinction
  chosen_korean: 구별
  alternatives_korean:
  - 속량
  - 구원
  - 해방
  - 분리
  lexicon: HALOT
  rationale: 이 말은 본래 구속/속량의 여운을 가지지만, 여기서는 ‘내 백성과 네 백성 사이에’라는 문맥상 구별·분리의 결과가 전면에 있으므로 본문에는 ‘구별’을 두고, 구속적 뉘앙스는 각주로 보존했습니다.
- source_word: הָאֹת הַזֶּה
  english_pob_choice: this sign
  chosen_korean: 이 표징
  alternatives_korean:
  - 이 징조
  - 이 표시
  - 이 표적
  lexicon: HALOT
  rationale: 출애굽기 재앙 문맥의 אוֹת은 하나님이 주시는 확인 표지이므로, 일상적 ‘표시’보다 성경적 의미가 살아 있는 ‘표징’이 적절합니다.
- source_word: יִהְיֶה
  english_pob_choice: will happen
  chosen_korean: 일어날 것입니다
  alternatives_korean:
  - 있을 것입니다
  - 될 것입니다
  - 생길 것입니다
  lexicon: HALOT
  rationale: 주어가 ‘이 표징’이므로 한국어에서는 ‘일어날 것입니다’가 가장 자연스럽고, 단순한 존재를 뜻하는 ‘될 것입니다’보다 사건성을 더 분명히 드러냅니다.
theological_decisions:
- issue: פְדֻת의 구속적 의미를 본문에서 얼마나 드러낼지
  chosen_reading: 본문은 사건의 결과를 따라 ‘구별’로 옮기되, 각주에서 ‘속량/구원’ 가능성을 남깁니다.
  alternative_readings:
  - 속량
  - 구원
  - 해방
  rationale: 이 절은 하나님이 이스라엘과 이집트를 실제로 갈라 놓으시는 장면이므로 문맥상 ‘구별’이 핵심입니다. 그러나 어근이 지닌 구속 신학적 울림을 지우지 않기 위해 대안을 각주로 보존했습니다.
  doctrine_reference: 'Translation philosophy #3, #5'
