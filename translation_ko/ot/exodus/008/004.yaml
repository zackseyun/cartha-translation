    rationale: וַאֲשַׁלְּחָה의 1인칭 약속과 뒤따르는 וְיִזְבְּחוּ의 목적/결과 관계를 바로의 직접 약속으로 유지해야 합니다. ‘하려는 것입니다’는 발화자의 약속을 번역자의 설명처럼 들리게 합니다.
  - severity: low
    issue: 마지막 절 각주의 대안이 단순 병렬 가능성을 정확히 제시하지 못함
    rationale: ‘보내어 … 하겠습니다’는 여전히 목적 관계를 강하게 나타냅니다. 단순 연결 가능성은 ‘내가 백성을 보내겠고, 그들은 … 제사를 드릴 것입니다’처럼 제시하는 것이 더 정확합니다.
