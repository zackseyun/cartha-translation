base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
  footnotes:
  - marker: a
    text: Hebrew 'entreat/intercede to the LORD'; the verb can carry the sense of urgent pleading, not merely ordinary prayer.
    reason: lexical_alternative
  - marker: b
    text: Or 'and they may sacrifice to the LORD.' The Hebrew may be read as simple coordination, though here it likely expresses Pharaoh's intended purpose in letting the people go.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 바로가 모세와 아론을 불러 말했습니다. “야훼께 간청하여 나와 내 백성에게서 개구리들을 없애 달라고 하십시오. 그러면 내가 백성을 보내겠습니다[b]. 그들이 야훼께 제사를 드리게 하겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘내가 백성을 보내겠고, 그들은 야훼께 제사를 드릴 것입니다.’ 히브리어는 단순한 연결로도 읽을 수 있지만, 여기서는 바로가 백성을 보내는 목적 또는 의도를 나타내는 것으로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  english_pob_choice: called for Moses and Aaron
  chosen_korean: 모세와 아론을 불러서
  alternatives_korean:
  - 모세와 아론을 불러
  - 모세와 아론을 소환하여
  lexicon: HALOT
  rationale: לְ가 붙은 인칭 목적어가 ‘불러 오게 하다/불러 들이다’의 뜻을 이루므로, 자연스러운 한국어로는 ‘불러서’가 가장 직접적입니다.
- source_word: הַעְתִּירוּ אֶל יְהוָה
  english_pob_choice: Pray to Yahweh
  chosen_korean: 야훼께 간청하여
  alternatives_korean:
  - 야훼께 기도하여
  - 야훼께 간구하여
  - 야훼께 빌어
  lexicon: HALOT
  rationale: עתר의 핵심은 단순한 일반 기도보다 급박하게 매달리며 간청하는 뉘앙스이므로, ‘간청하여’로 더 강한 어감을 살렸습니다.
- source_word: וְיָסֵר הַצְפַרְדְּעִים מִמֶּנִּי וּמֵעַמִּי
  english_pob_choice: that he may remove the frogs from me and from my people
  chosen_korean: 내게서와 내 백성에게서 개구리들을 치워 주십시오
  alternatives_korean:
  - 내게서와 내 백성에게서 개구리들을 제거해 주십시오
  - 내게서와 내 백성에게서 개구리들을 없애 주십시오
  lexicon: HALOT
  rationale: סור의 사역형은 ‘제거하다/치우다’가 가능하므로, 반복된 מִן을 ‘~에게서’로 살리면서 구어적으로도 자연한 ‘치워 주십시오’를 택했습니다.
- source_word: וַאֲשַׁלְּחָה אֶת הָעָם
  english_pob_choice: and I will let the people go
  chosen_korean: 그러면 내가 백성을 보내겠습니다
  alternatives_korean:
  - 그러면 내가 백성을 놓아주겠습니다
  - 그러면 내가 백성을 풀어주겠습니다
  lexicon: HALOT
  rationale: שלח는 출애굽 문맥에서 ‘보내다/내보내다/놓아주다’의 관용적 의미가 있으므로, 반복되는 출애굽 어휘를 유지하면서도 한국어로는 ‘보내겠습니다’가 가장 간결합니다.
- source_word: וְיִזְבְּחוּ לַיהוָה
  english_pob_choice: so that they may sacrifice to Yahweh
  chosen_korean: 그들이 야훼께 제사드리게 하려는 것입니다
  alternatives_korean:
  - 그들이 야훼께 제사하게 하려는 것입니다
  - 그들이 야훼께 제물을 바치게 하려는 것입니다
  lexicon: HALOT
  rationale: זבח는 단순 제물 행위가 아니라 제사 행위이므로, 한국어 성경 어법에 맞는 ‘제사드리다’를 사용하되 목적 의미는 ‘하게 하려는 것입니다’로 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 신명기는 전통적 대체어보다 원어 기반 음역인 ‘야훼’를 사용하여 본문의 고유한 언약 이름을 드러냅니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: 바로의 마지막 절 의도 표현
  chosen_reading: 목적/결과 의미를 드러내는 ‘그들이 야훼께 제사드리게 하려는 것입니다’
  alternative_readings:
  - '단순 병렬: ‘그리고 그들이 야훼께 제사드리게 할 것입니다’'
  - '직역: ‘그리고 그들이 야훼께 제사드릴 것입니다’'
  rationale: 히브리어의 접속된 미완료형은 요청의 결과/의도를 나타낼 수 있으므로, 한국어에서는 바로의 약속이 향하는 목적을 분명히 해 문맥을 가장 잘 전달했습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence'
