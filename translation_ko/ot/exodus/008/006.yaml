  text: 그가 말했습니다[a], “내일입니다.” 그러자 그가 말했습니다. “당신의 말씀대로 하겠습니다. 당신이 야훼 우리 하나님과 같은 분이 없다는 것을 알도록 말입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그리고 그가 말했습니다’입니다. 한국어에서는 첫 번째 동사의 연결을 자연스럽게 줄였습니다.
    reason: previous_rendering
