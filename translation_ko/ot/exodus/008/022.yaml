  rationale: 앞뒤 문맥의 제의적 행위를 한국어로 자연스럽게 드러내기 위해 ‘바치다’를 사용했고, 동사의 미완성/가정적 뉘앙스는 앞의 조건문으로 살렸습니다.
- source_word: לַיהוָה
