base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
  footnotes:
  - marker: a
    text: Or, more literally, “the abomination of the Egyptians.” The phrase likely means what the Egyptians regarded as abhorrent.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 말했습니다. 「그렇게 하는 것은 옳지 않습니다. 우리가 야훼 우리 하나님께 바치는 것은 이집트 사람들에게는 혐오스러운 것이기 때문입니다. 보십시오, 만일 우리가 이집트 사람들에게는 혐오스러운 것을 그들의 눈앞에서 바친다면, 그들이 우리를 돌로 치지 않겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이집트 사람들의 가증한 것”입니다. 문맥상 이 표현은 이집트인들이 혐오하는 대상을 가리키는 뜻으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
