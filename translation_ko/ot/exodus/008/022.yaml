theological_decisions:
- issue: יהוה를 어떻게 표기할지
  chosen_reading: 본문에서 ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문에 직접 나타난 언약명의 음역을 유지해 소스 직결성을 보존합니다.
  doctrine_reference: '프로젝트 용어집: יהוה / YHWH → 야훼'
- issue: תּוֹעֲבַת מִצְרַיִם의 의미
  chosen_reading: 이집트인들이 혐오하는 대상이라는 객관적 의미로 옮깁니다.
  alternative_readings:
  - 이집트의 가증한 것
  - 이집트가 혐오하는 것
  rationale: 문맥은 제물 자체가 이집트 종교 감수성에 충돌해 돌에 맞을 위험이 있다는 뜻이므로, 목적격/대상적 의미를 드러내는 번역이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
