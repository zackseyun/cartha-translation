revisions:
- from: 바로 그때 파라오가 모세와 아론을 불러 말했습니다. 「가서 너희의 하나님께 이 땅에서 제사를 드리라.」[a]
  to: 그때 파라오가 모세와 아론을 불러 말했습니다. 「가서 그 땅에서 너희의 하나님께 제사를 드리십시오.」[a]
  rationale: 서사 접속사의 일반적 시간 연결은 ‘그때’로 절제하여 옮기고, בָּאָרֶץ의 정관사 표현은 ‘그 땅’으로 보존했습니다. 직접 명령문은 본문 의미를 바꾸지 않으면서 목표 합쇼체에 맞게 현대적 존대 명령형으로 조정했습니다. 각주에는 ‘땅 안에서’라는 가능한 강조 번역과 애굽이라는 문맥적 지시를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:25Z'
