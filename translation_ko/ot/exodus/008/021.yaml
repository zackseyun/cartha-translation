    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 소집하여
  - 불렀습니다
  lexicon: HALOT
  rationale: 서사 문맥에서 ‘부르다/불러’가 가장 자연스럽고, 왕이 공식적으로 사람을 호출하는 뉘앙스도 충분히 담습니다.
- source_word: פַרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  - 왕
  lexicon: HALOT
  rationale: 고유 칭호를 현대 표기법에 따라 옮겼습니다. ‘바로’는 한글 성경 관용이지만, 여기서는 음역 일관성을 택했습니다.
- source_word: זִבְחוּ
  english_pob_choice: sacrifice
  chosen_korean: 제사를 드리라
  alternatives_korean:
  - 희생 제물을 드리라
  - 희생하다
  lexicon: HALOT
  rationale: זבח는 제의적 희생/제사를 가리키므로, 동사형으로는 한국어 성경 문체에 맞는 ‘제사를 드리다’가 의미를 가장 분명히 전합니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the land
  chosen_korean: 이 땅에서
  alternatives_korean:
  - 그 땅에서
  - 나라 안에서
  lexicon: HALOT
  rationale: 직역은 ‘땅에서’이지만, 문맥상 애굽 내부를 가리키므로 한국어에서는 자연스럽게 ‘이 땅에서’로 옮기되, 출애굽의 대조는 본문 안에서 유지했습니다.
theological_decisions:
- issue: 하나님 칭호의 직접성
  chosen_reading: ‘너희의 하나님’으로 직역하여 파라오가 이스라엘의 하나님을 외부의 신으로 지칭하는 긴장을 살렸습니다.
  alternative_readings:
  - ‘너희 하나님께’
  - ‘너희 하나님께 드리라’
  rationale: 본문의 핵심은 파라오가 여호와를 자기 신들과 구별된 대상으로 언급하는 데 있으므로, 소유격을 살려 발화의 거리감을 유지했습니다.
  doctrine_reference: 출애굽기 내 파라오-야훼 대립 구도
- issue: 명령문의 화법
  chosen_reading: 직접 명령형인 ‘가서 … 제사를 드리라’를 유지했습니다.
  alternative_readings:
  - ‘가서 … 드리십시오’
  - ‘가서 … 제사를 드립시다’
  rationale: 파라오의 허용/지시를 담은 직접 화법이므로, 인물 발화의 위계를 보존하는 명령형이 가장 적절합니다.
  doctrine_reference: 서사 화법과 인물 발화 재현
