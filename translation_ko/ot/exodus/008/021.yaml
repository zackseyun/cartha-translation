  naturalness: 서술은 현대적이고 자연스럽지만, 합쇼체 목표에 맞추어 파라오의 직접 명령도 ‘드리십시오’로 통일하는 것이 안전합니다. ‘불러 말했습니다’는 자연스럽습니다.
  terminology: ‘파라오’, ‘모세’, ‘아론’, ‘너희의 하나님’, ‘제사를 드리다’는 모두 적절합니다. ‘너희의 하나님’은 לֵאלֹהֵיכֶם의 소유격과 파라오의 발화 거리를 잘 보존합니다.
