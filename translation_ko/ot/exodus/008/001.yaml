source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹ֣ר אֶֽל אַהֲרֹ֗ן נְטֵ֤ה אֶת יָדְ/ךָ֙ בְּ/מַטֶּ֔/ךָ עַל הַ֨/נְּהָרֹ֔ת עַל הַ/יְאֹרִ֖ים וְ/עַל הָ/אֲגַמִּ֑ים וְ/הַ֥עַל אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
  footnotes:
  - marker: a
    text: Or “the Nile channels” for “the canals”; the Hebrew term often refers to Nile waterways in Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. 「아론에게 말하여라. 네 손에 있는 지팡이를 들어 강들 위와 운하들 위와 못들 위에 뻗어라. 그리고 이집트 땅 위로 개구리들을 올라오게 하여라」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘운하들’은 이집트의 나일 수로를 가리키는 말일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms; BHS/WLC proper-name transliteration
  rationale: 본문이 여호와가 아니라 언약 이름 יְהוָה를 직접 사용하므로, POB 원칙에 따라 한국어에서도 관용적 대체어 대신 야훼를 유지했습니다.
- source_word: נְטֵה אֶת יָדְךָ בְּמַטֶּךָ
  english_pob_choice: Stretch out your hand with your staff
  chosen_korean: 네 손에 있는 지팡이를 들어 ... 뻗어라
  alternatives_korean:
  - 네 손을 네 지팡이로 뻗어라
  - 지팡이를 든 채 손을 뻗어라
  lexicon: HALOT
  rationale: 벧의 도구적 용법과 ‘stretch out’의 동작성을 함께 살려, 손과 지팡이를 분리해 어색하지 않게 ‘지팡이를 들어 … 뻗어라’로 옮겼습니다.
- source_word: הַנְּהָרֹת / הַיְאֹרִים / הָאֲגַמִּים
  english_pob_choice: the rivers / the canals / the pools
  chosen_korean: 강들 / 운하들 / 못들
  alternatives_korean:
  - 시내들 / 나일 수로들 / 연못들
  - 강들 / 나일 수로들 / 못들
  lexicon: HALOT
  rationale: 세 항목의 구분을 살리되, 본문의 물 목록이 서로 다른 수역을 병렬로 지시하므로 지나친 해설을 피하면서도 현대 한국어로 자연스럽게 ‘강들, 운하들, 못들’로 대응했습니다.
- source_word: וְהַעַל אֶת הַצְפַרְדְּעִים
  english_pob_choice: and bring up the frogs
  chosen_korean: 개구리들을 올라오게 하여라
  alternatives_korean:
  - 개구리들을 올라오게 하라
  - 개구리들을 끌어올려라
  lexicon: HALOT
  rationale: 하필의 ‘cause to come up’ 의미를 반영해 단순한 ‘올리다’보다 원인성을 드러내는 ‘올라오게 하다’로 옮겼습니다.
theological_decisions:
- issue: 야훼라는 신적 이름의 표기
  chosen_reading: 한국어 본문에서 יְהוָה를 ‘야훼’로 음역해 고유명사성을 유지했습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 이 구절은 직함이 아니라 신적 이름 자체를 사용하므로, 제목어로 흡수하지 않고 번역 본문에서 그대로 드러내는 것이 출처 의미에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
