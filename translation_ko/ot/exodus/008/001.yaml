- from: 그때 야훼께서 모세에게 말씀하셨습니다. 「아론에게 말하여라. 네 손에 있는 지팡이를 들어 강들 위와 운하들 위와 못들 위에 뻗어라. 그리고 이집트 땅 위로 개구리들을 올라오게 하여라」[a]
  to: 그때 야훼께서 모세에게 말씀하셨습니다. “아론에게 말하여라. 네 지팡이와 함께 네 손을 강들과 운하들[a]과 연못들 위로 뻗어라. 그리고 개구리들을 이집트 땅 위로 올라오게 하여라.”
