lexical_decisions:
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ
  english_pob_choice: Aaron stretched out his hand
  chosen_korean: 아론이 … 손을 내밀었고
  alternatives_korean:
  - 아론이 … 손을 뻗었고
  - 아론이 … 손을 폈고
  lexicon: HALOT
  rationale: נטה는 이 재앙 표징 문맥에서 권위 있게 손을 뻗어 행위를 개시하는 동작을 가리키므로, ‘내밀었고’가 자연스럽고 의미를 잘 살립니다.
- source_word: מֵימֵי מִצְרָיִם
  english_pob_choice: the waters of Egypt
  chosen_korean: 이집트의 물
  alternatives_korean:
  - 이집트의 물들
  - 이집트의 물가
  lexicon: HALOT
  rationale: 히브리어 복수 구성은 이집트의 여러 수역을 집합적으로 가리키므로, 한국어에서는 과도한 직역보다 자연스러운 집합 표현인 ‘이집트의 물’로 옮겼습니다.
- source_word: וַתַּעַל הַצְּפַרְדֵּעַ
  english_pob_choice: the frogs came up
  chosen_korean: 개구리들이 올라와
  alternatives_korean:
  - 개구리들이 나와
  - 개구리들이 솟아올라
  lexicon: HALOT
  rationale: עלה는 물에서 위로 올라와 드러나는 동작을 나타내므로 ‘올라와’가 장면을 정확하고 유려하게 전달합니다. 히브리어 단수형은 집합적 의미이므로 복수로 처리했습니다.
- source_word: וַתְּכַס אֶת אֶרֶץ מִצְרָיִם
  english_pob_choice: covered the land of Egypt
  chosen_korean: 이집트 땅을 덮었습니다
  alternatives_korean:
  - 이집트 땅을 뒤덮었습니다
  - 이집트의 땅을 덮었습니다
  lexicon: HALOT
  rationale: כסה의 기본 의미를 직접 살려 ‘덮었습니다’로 옮겼고, אֶרֶץ는 여기서 국가 전체가 아닌 영토를 뜻하므로 ‘땅’이 가장 적절합니다.
theological_decisions:
- issue: 재앙 서술의 문체와 시제 흐름
  chosen_reading: 과거 서술을 유지하면서도, 사건의 즉시성과 진행감을 살리기 위해 ‘손을 내밀었고 … 올라와 … 덮었습니다’로 연결했습니다.
  alternative_readings:
  - 단순한 과거형 나열
  - 더 문어적인 ‘펴자’/‘올랐고’
  rationale: 본문은 연속 동작을 보여 주는 서술이므로, 한국어에서도 사건의 연쇄가 살아나도록 연결어와 동사를 조정했습니다.
  doctrine_reference: 출애굽기 재앙 내러티브의 서술 관행
