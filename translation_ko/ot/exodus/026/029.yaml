id: EXO.26.29
reference: Exodus 26:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/אֶת הַ/קְּרָשִׁ֞ים תְּצַפֶּ֣ה זָהָ֗ב וְ/אֶת טַבְּעֹֽתֵי/הֶם֙ תַּעֲשֶׂ֣ה זָהָ֔ב בָּתִּ֖ים לַ/בְּרִיחִ֑ם וְ/צִפִּיתָ֥ אֶת הַ/בְּרִיחִ֖ם זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
  footnotes:
  - marker: a
    text: Hebrew literally, 'houses for the bars,' that is, receptacles or holders for the bars.
    reason: lexical_alternative
  - marker: b
    text: Or 'boards' for 'frames.' The Hebrew refers to the structural pieces of the tabernacle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 구조물들의 틀에는 금을 입히고, 그들의 고리들은 금으로 만들어 그 막대들을 꽂아 둘 집으로 하며, 그 막대들에도 금을 입히십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘틀’은 여기서 성막 구조를 이루는 קרשׁ를 가리키며, 전통 번역의 ‘널판’보다 기능을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘막대들을 위한 집들’입니다. 즉 막대가 들어가는 받침 또는 수용부를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  english_pob_choice: the frames
  chosen_korean: 틀
  alternatives_korean:
  - 판자들
  - 널판들
  lexicon: HALOT
  rationale: 성막의 구조를 이루는 קרשׁ를 단순 목재보다 기능이 드러나는 ‘틀’로 옮겨, EN POB의 ‘frames’ 선택과 맞추었습니다.
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  english_pob_choice: you shall overlay
  chosen_korean: 금을 입히고 / 금을 입히십시오
  alternatives_korean:
  - 덮고
  - 도금하고
  lexicon: HALOT
  rationale: צפה는 단순히 덮는 것이 아니라 재료를 겹쳐 입히는 뜻이므로, 성막 공사용 어감이 살아 있는 ‘금을 입히다’로 옮겼습니다.
- source_word: בָּתִּים לַבְּרִיחִם
  english_pob_choice: as holders for the bars
  chosen_korean: 그 막대들을 꽂아 둘 집
  alternatives_korean:
  - 막대들의 집
  - 막대들을 위한 받침
  lexicon: HALOT
  rationale: 직역하면 ‘막대들을 위한 집들’이지만, 기능상 막대가 들어가는 수용소/받침을 뜻하므로 ‘꽂아 둘 집’으로 풀어 의미를 분명히 했습니다.
- source_word: הַבְּרִיחִם
  english_pob_choice: the bars
  chosen_korean: 막대들
  alternatives_korean:
  - 가로대들
  - 빗장들
  lexicon: HALOT
  rationale: 성막 틀을 묶는 브리횀은 여기서 구조용 막대이므로, 문맥상 가장 자연스러운 ‘막대들’로 옮겼습니다.
