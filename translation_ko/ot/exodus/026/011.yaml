source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ קַרְסֵ֥י נְחֹ֖שֶׁת חֲמִשִּׁ֑ים וְ/הֵבֵאתָ֤ אֶת הַ/קְּרָסִים֙ בַּ/לֻּ֣לָאֹ֔ת וְ/חִבַּרְתָּ֥ אֶת הָ/אֹ֖הֶל וְ/הָיָ֥ה אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/011.yaml
  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
  footnotes:
  - marker: a
    text: Or 'copper clasps.' The Hebrew נְחֹשֶׁת can refer to copper or bronze, depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'put the clasps into the loops.'
    reason: lexical_alternative
  - marker: c
    text: That is, the separate sections are to form one unified tent.
    reason: cultural_note
translation:
  language: ko
  text: 청동 걸쇠 오십 개를 만들고[a], 그 걸쇠들을 고리들에 끼워[b] 천막을 연결하여[c] 하나가 되게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְחֹשֶׁת은 문맥에 따라 구리를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 걸쇠들을 고리들 안으로 넣어’.
    reason: lexical_alternative
  - marker: c
    text: 곧, 나뉜 부분들이 하나의 천막을 이루게 한다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  english_pob_choice: bronze clasps
  chosen_korean: 금속 고리
  alternatives_korean:
  - 청동 고리
  - 구리 고리
  - 걸쇠
  lexicon: HALOT
  rationale: 문맥상 휘장과 천막을 잇는 결속용 부속품이므로 기능을 드러내는 표현을 택했습니다. נְחֹשֶׁת은 청동/구리로 갈릴 수 있지만, 한국어에서는 탭나궤 제작의 금속 부속을 넓게 포괄하는 ‘금속’으로 처리해 재료의 불확실성을 과장하지 않았습니다.
- source_word: לֻלָאֹת
  english_pob_choice: loops
  chosen_korean: 고리들
  alternatives_korean:
  - 루프들
  - 고리 구멍들
  lexicon: HALOT
  rationale: 성막 천의 가장자리에 달린 연결용 고리라는 기능을 살려 ‘고리들’로 옮겼습니다. 외래어 ‘루프’보다 본문 맥락을 바로 전달합니다.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  english_pob_choice: join the tent together
  chosen_korean: 천막을 서로 연결하여
  alternatives_korean:
  - 천막을 함께 묶어
  - 천막을 결합하여
  - 성막을 연결하여
  lexicon: HALOT
  rationale: חבר의 기본 의미인 ‘잇다/연결하다’를 살렸고, ‘서로’로 분리된 부분을 하나로 잇는 동작을 분명히 했습니다. הָאֹהֶל은 여기서 구조물 전체를 가리키므로 ‘천막’으로 옮겼습니다.
- source_word: וְהָיָה אֶחָד
  english_pob_choice: so that it may be one
  chosen_korean: 하나가 되게 하십시오
  alternatives_korean:
  - 하나가 되도록 하십시오
  - 하나가 되게 하여 주십시오
  - 하나가 되리라
  lexicon: HALOT
  rationale: 결과 절을 한국어 명령문 목적형으로 자연스럽게 풀어, 앞선 연결 작업의 목적이 ‘하나 됨’임을 분명히 했습니다.
theological_decisions:
- issue: 성막의 분리된 부분이 하나가 되는 통일성
  chosen_reading: 연결 행위의 결과를 ‘하나가 되게’로 옮겨, 단순한 조립이 아니라 하나의 통합된 성막 형성을 드러냈습니다.
  alternative_readings:
  - 단순히 '연결하여'로만 옮겨 통일성의 결과를 약화시키는 읽기
  - '''성막'' 용어를 써서 제도적 의미를 앞세우는 읽기'
  rationale: 히브리어 마지막 절은 결합의 목적/결과를 강조합니다. 본문이 말하는 것은 부속품의 조립을 넘어 하나의 통합된 장막이 되는 것입니다.
  doctrine_reference: 출애굽기 26장 성막 구조의 통일성
