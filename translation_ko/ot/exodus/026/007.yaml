  text: וְ/עָשִׂ֨יתָ֙ יְרִיעֹ֣ת עִזִּ֔ים לְ/אֹ֖הֶל עַל הַ/מִּשְׁכָּ֑ן עַשְׁתֵּי עֶשְׂרֵ֥ה יְרִיעֹ֖ת תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
  footnotes:
  - marker: a
    text: Literally, 'curtains of goats.' The Hebrew uses 'goats' to denote material from goats, that is, goat hair.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 염소털로 장막 곧 성막 위에 덮을 천들을 만들고, 그것들을 열한 장의 천으로 만들라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘염소들’이라고 되어 있지만, 여기서는 염소에서 얻은 재료, 곧 염소털을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  english_pob_choice: curtains
  chosen_korean: 천들
  alternatives_korean:
  - 휘장들
  - 커튼들
  lexicon: HALOT
  rationale: 성막 제작 문맥의 יְרִיעָה는 대형 직물 패널을 가리키므로, 현대 한국어에서는 자연스럽고 기술적인 ‘천’이 가장 무난합니다.
- source_word: עִזִּים
  english_pob_choice: goats’ hair
  chosen_korean: 염소털
  alternatives_korean:
  - 염소의 털
  - 염소털로 만든 천
  lexicon: HALOT
  rationale: 영어 POB가 재료 의미를 분명히 하듯, 히브리어 ‘염소들’은 여기서 염소에서 나온 재료를 뜻하므로 ‘염소털’로 옮기는 것이 문맥에 맞습니다.
- source_word: לְאֹהֶל עַל הַמִּשְׁכָּן
  english_pob_choice: for a tent over the tabernacle
  chosen_korean: 장막 곧 성막 위에 덮을
  alternatives_korean:
  - 성막 위에 있는 장막을 위한
  - 성막을 덮는
  lexicon: HALOT
  rationale: לְ는 목적을, עַל은 위에 놓임을 나타내므로 ‘위에 덮을’로 처리해 기능을 드러냈습니다. ‘장막 곧 성막’은 본문이 말하는 용도를 살리면서 מִשְׁכָּן의 기술적 용례를 보존합니다.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  english_pob_choice: eleven
  chosen_korean: 열한 장
  alternatives_korean:
  - 열하나
  - 열한 폭
  lexicon: HALOT
  rationale: 복합수사는 단순하게 ‘열한’으로 옮기되, 직물 수량임을 드러내기 위해 ‘장’을 붙였습니다.
theological_decisions:
- issue: 성막 용어의 번역을 현대적으로 유지할지 여부
  chosen_reading: ‘성막’은 전통 교회어를 유지하되, 앞의 기능 설명을 ‘장막 곧 성막’으로 붙여 본문의 구조와 용도를 함께 드러냈습니다.
  alternative_readings:
  - ‘성막 위에 있는 장막’
  - ‘거처 위에’
  rationale: 본문은 단순한 일반 천막이 아니라 야훼의 임재 처소를 덮는 제작 지시이므로, 익숙한 ‘성막’을 유지하는 것이 오해를 줄입니다.
  doctrine_reference: 출애굽기 성막 본문 용례
