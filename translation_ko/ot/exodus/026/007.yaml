revisions:
- from: 너는 염소털로 장막 곧 성막 위에 덮을 천들을 만들고, 그것들을 열한 장의 천으로 만들라.[a]
  to: 당신은 성막 위에 덮을 장막을 위해 염소털 휘장들을 만드시되, 그것들을 열한 폭으로 만드십시오.[a]
  rationale: 원문의 장막(אֹהֶל)과 성막(מִשְׁכָּן)을 구별하고, 장막이 성막 위에 덮인다는 관계를 ‘성막 위에 덮을 장막’으로 보존했습니다. 또한 합쇼체로 고치고, 성막 제작 문맥의 יְרִיעֹת와 수량 단위를 ‘휘장들’과 ‘폭’으로 다듬었습니다. 염소털의 재료적 의미를 설명하는 각주는 해당 어휘 뒤에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:36Z'
