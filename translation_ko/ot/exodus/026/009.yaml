  to: 다섯 장의 휘장을 한 묶음으로 연결하고, 여섯 장의 휘장도 따로 한 묶음으로 연결하십시오. 그리고 여섯째 휘장은 장막 앞쪽에서 두 겹으로 접으십시오.[a]
