base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
  footnotes:
  - marker: a
    text: Or 'double over the sixth curtain opposite the front of the tent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다섯 장의 휘장을 한 묶음으로 연결하고, 여섯 장의 휘장도 따로 한 묶음으로 연결하십시오. 그리고 여섯째 휘장은 장막 앞쪽에서 두 겹으로 접으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여섯째 휘장을 장막 앞면 맞은편에서 두 겹으로 접으십시오.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חִבַּרְתָּ
  english_pob_choice: join
  chosen_korean: 연결하고
  alternatives_korean:
  - 이어 붙이고
  - 합치고
  lexicon: HALOT
  rationale: 장막 휘장들을 한 묶음으로 잇는 동작이므로, 현대 한국어에서 자연스러운 ‘연결하다’로 옮겨 결합의 의미를 살렸습니다.
- source_word: יְרִיעֹת / יְרִיעָה
  english_pob_choice: curtains
  chosen_korean: 휘장
  alternatives_korean:
  - 장막천
  - 커튼
  lexicon: HALOT
  rationale: 성막 구조물의 직물 덮개를 가리키는 표준 성경어로 ‘휘장’이 가장 정확하고, 단순한 ‘커튼’보다 성막 문맥을 더 잘 보존합니다.
- source_word: לְבָד
  english_pob_choice: separately
  chosen_korean: 따로
  alternatives_korean:
  - 각각
  - 따로따로
  lexicon: HALOT
  rationale: 각 묶음을 독립된 단위로 나누어 연결하라는 분배적 의미를 현대적으로 간결하게 전달합니다.
- source_word: וְכָפַלְתָּ
  english_pob_choice: fold ... double
  chosen_korean: 두 겹으로 접으십시오
  alternatives_korean:
  - 겹으로 접으십시오
  - 두 번 접으십시오
  lexicon: HALOT
  rationale: ‘두 겹’은 단순한 접기가 아니라 겹이 생기도록 접는 동작을 잘 드러내며, ‘fold double’의 의미를 자연스럽게 반영합니다.
theological_decisions:
- issue: 마지막 절의 공간 표현
  chosen_reading: ‘성막의 앞쪽’으로 옮겨, 히브리어의 ‘오헬’(tent)을 그대로 유지하되 문맥상 성막 구조를 분명히 했습니다.
  alternative_readings:
  - ‘장막의 앞에’
  - ‘성막 앞에’
  rationale: 원문은 פשוט ‘텐트’를 말하지만, 출애굽기 성막 지시문 맥락에서는 독자가 그 대상을 성막으로 이해할 수 있도록 하되, 원어의 ‘tent’라는 표면 형식도 무리 없이 반영하는 것이 가장 균형적입니다.
  doctrine_reference: 출애굽기 성막 지시문 문맥
