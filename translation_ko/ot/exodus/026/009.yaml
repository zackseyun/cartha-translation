  source_fidelity: ‘따로 연결하고’는 각 휘장을 개별적으로 연결하라는 뜻으로도 읽힐 수 있어, 다섯 장과 여섯 장을 서로 구별된 두 묶음으로 결합하라는 לְבָד의 분배적 의미를 더 분명히 할 필요가 있습니다. 또한 הָאֹהֶל은 직역하면 ‘장막/천막’이므로, 문맥상의 ‘성막’보다 ‘장막’이 원문 어휘에 더 가깝습니다.
