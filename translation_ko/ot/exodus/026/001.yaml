  source_fidelity: 초안은 성막, 휘장 열 장, 재료와 색상, 그룹이라는 핵심 요소를 대체로 반영합니다. 그러나 מַעֲשֵׂה חֹשֵׁב은 재봉에 한정되지 않는 직물의 숙련된 예술 작업을 가리키므로 ‘능숙한 재봉사의 솜씨’는 지나치게 좁습니다. 또한 ‘그 위에는 그룹들을 ... 만들어야 합니다’는 그룹이 휘장에 표현된다는 관계를 다소 어색하게 처리합니다.
