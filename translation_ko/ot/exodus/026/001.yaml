source:
  edition: WLC
  text: וְ/אֶת הַ/מִּשְׁכָּ֥ן תַּעֲשֶׂ֖ה עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
  footnotes:
  - marker: a
    text: Or 'with cherubim skillfully worked into them.' The Hebrew phrase מַעֲשֵׂה חֹשֵׁב refers to artistic, designed workmanship in the fabric.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 성막을 만들 때에 곱게 꼰 베실과 청색 실과 자색 실과 홍색 실로 휘장 열 장을 만드십시오. 그 휘장들에는 숙련된 장인의 정교한 솜씨[a]로 그룹들을 만드십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그룹들을 솜씨 있게 그 안에 짜 넣어’. 히브리어 מַעֲשֵׂה חֹשֵׁב은 직물에 무늬를 넣는 정교한 예술적 제작을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: 제의적·기술적 용어로서 הַמִּשְׁכָּן은 성막이 가장 표준적이면서도 문맥을 정확히 드러냅니다.
- source_word: יְרִיעֹת
  english_pob_choice: curtains
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 천장
  lexicon: HALOT
  rationale: 성막 구조물의 큰 천막 장막을 가리키므로, 건축적 용도의 천을 자연스럽게 드러내는 휘장이 적절합니다.
- source_word: שֵׁשׁ מָשְׁזָר
  english_pob_choice: finely twisted linen
  chosen_korean: 고운 꼬아낸 베실
  alternatives_korean:
  - 가는 꼰 베실
  - 세 꼰 베실
  lexicon: HALOT
  rationale: שֵׁשׁ의 아마/베 계열 섬유와 מָשְׁזָר의 꼬아낸 가공을 함께 살리되, 현대 한국어에서 이해되는 형태로 옮겼습니다.
- source_word: מַעֲשֵׂה חֹשֵׁב
  english_pob_choice: the work of a skillful designer
  chosen_korean: 능숙한 재봉사의 솜씨
  alternatives_korean:
  - 숙련된 장인의 작업
  - 기교 있는 짜임새
  lexicon: HALOT
  rationale: 직물 문맥에서 단순한 노동이 아니라 무늬를 갖춘 정교한 제작을 뜻하므로, ‘솜씨’로 예술적·기술적 성격을 살렸습니다.
theological_decisions:
- issue: כל룹(cherubim) 용어를 한국어에서 어떻게 처리할지
  chosen_reading: 그룹
  alternative_readings:
  - 케루빔
  - 천사들
  rationale: 성막 직물의 성스러운 상징으로서 전통적 교회어 ‘그룹’을 유지해 본문의 제의적 이미지를 보존했습니다.
  doctrine_reference: 출 25–26의 성막/성소 상징성
