lexical_decisions:
- source_word: יְרִיעֹת
  english_pob_choice: curtains
  chosen_korean: 휘장
  alternatives_korean:
  - 커튼
  - 천막 천
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥에서 יְרִיעָה는 성막을 이루는 큰 직물 덮개를 가리키므로, 현대 한국어에서 문맥에 가장 자연스러운 ‘휘장’으로 옮겼습니다.
- source_word: חֹבְרֹת
