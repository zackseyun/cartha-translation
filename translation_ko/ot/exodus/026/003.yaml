  - 연결됩니다
  lexicon: HALOT
  rationale: חבר의 기본 의미인 ‘잇다/결합하다’를 살려 구조적 결합을 드러내는 ‘서로 연결되다’로 옮겼습니다.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  english_pob_choice: to one another
  chosen_korean: 서로
  alternatives_korean:
  - 각각 서로
  - 한 장이 다른 장과
  lexicon: HALOT
  rationale: 직역하면 ‘여자 하나가 자기 자매에게’라는 관용구지만, 여성형 명사 복수인 휘장들 사이의 대응과 결합을 가리키므로 자연스러운 현대 한국어 관용인 ‘서로’로 풀었습니다.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  english_pob_choice: Five ... and five
  chosen_korean: 다섯 장의 ... 다섯 장의
  alternatives_korean:
  - 다섯 장은 ... 다섯 장은
  - 다섯 ... 그리고 다섯
  lexicon: HALOT
  rationale: 히브리어의 두 묶음 구분을 그대로 살려, 두 절 모두에 ‘다섯 장의’라는 반복을 유지했습니다.
