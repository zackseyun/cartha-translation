  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
  footnotes:
  - marker: a
    text: Or 'the other side of the tabernacle' for 'the second side of the tabernacle.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'to the rear, westward.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 두 번째 옆면의 널판들을 위한 빗장 다섯과, 뒤쪽 서편에 있는 장막의 널판들을 위한 빗장 다섯이 있어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성막의 다른 옆면’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘뒤쪽, 서쪽으로’입니다.
    reason: lexical_alternative
