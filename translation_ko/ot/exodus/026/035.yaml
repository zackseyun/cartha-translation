id: EXO.26.35
reference: Exodus 26:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֤ אֶת הַ/שֻּׁלְחָן֙ מִ/ח֣וּץ לַ/פָּרֹ֔כֶת וְ/אֶת הַ/מְּנֹרָה֙ נֹ֣כַח הַ/שֻּׁלְחָ֔ן עַ֛ל צֶ֥לַע הַ/מִּשְׁכָּ֖ן תֵּימָ֑נָ/ה וְ/הַ֨/שֻּׁלְחָ֔ן תִּתֵּ֖ן עַל צֶ֥לַע צָפֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
  footnotes:
  - marker: a
    text: Or 'outside the curtain.' The Hebrew פָּרֹכֶת denotes the inner partition of the tabernacle; 'veil' is retained as the more specific traditional equivalent.
    reason: lexical_alternative
  - marker: b
    text: Hebrew menorah; translated 'lampstand' rather than transliterated to preserve meaning in English.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 너는 휘장을 밖에서 상 앞에 식탁을 두고, 등잔대를 식탁 맞은편, 곧 성막의 남쪽 옆에 두고, 식탁은 북쪽 옆에 두어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פָּרֹכֶת은 성막의 내부 칸막이를 가리키므로, 여기서는 ‘휘장’으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 히브리어 מְנֹרָה는 문자적으로 ‘등잔대’입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שַׂמְתָּ
  english_pob_choice: you shall place
  chosen_korean: 두어야 합니다
  alternatives_korean:
  - 놓아야 합니다
  - 배치해야 합니다
  lexicon: HALOT
  rationale: 지시문의 위치 설정을 자연스럽게 드러내면서, 뒤의 또 다른 배치 동사를 반복하지 않도록 한국어에서는 넓은 의미의 ‘두다’를 썼습니다.
- source_word: הַ/שֻּׁלְחָן
  english_pob_choice: the table
  chosen_korean: 식탁
  alternatives_korean:
  - 상
  - 테이블
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥의 기구이지만, 단순히 ‘table’로 주어졌으므로 현대 한국어에서 가장 직접적인 명사인 ‘식탁’을 사용했습니다. 다만 일반 식탁으로 오해될 소지가 있어 뒤의 문맥이 이를 제한합니다.
- source_word: מִ/ח֣וּץ לַ/פָּרֹ֔כֶת
  english_pob_choice: outside the veil
  chosen_korean: 휘장 밖에서
  alternatives_korean:
  - 휘장 바깥에
  - 커튼 밖에서
  lexicon: HALOT
  rationale: פָּרֹכֶת은 성막의 내부 칸막이인 휘장을 가리키므로, 영어 POB의 ‘veil’에 맞춰 성막 용어로 굳어진 ‘휘장’을 택했습니다.
- source_word: הַ/מְּנֹרָה֙
  english_pob_choice: the lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 촛대
  - 메노라
  lexicon: HALOT
  rationale: 기능을 드러내는 현대 한국어 표현으로 ‘등잔대’를 사용해, 단순 음역보다 대상의 의미를 분명히 했습니다.
- source_word: נֹ֣כַח הַ/שֻּׁלְחָ֔ן
  english_pob_choice: opposite the table
  chosen_korean: 식탁 맞은편
  alternatives_korean:
  - 식탁 건너편
  - 식탁 앞
  lexicon: HALOT
  rationale: נֹכַח은 ‘마주한, 맞은편의’라는 배치를 나타내므로, 공간 관계가 분명한 ‘맞은편’을 선택했습니다.
- source_word: עַ֛ל צֶ֥לַע הַ/מִּשְׁכָּ֖ן תֵּימָנָ֑ה
  english_pob_choice: on the south side of the tabernacle
  chosen_korean: 성막의 남쪽 옆
  alternatives_korean:
  - 성막 남쪽편
  - 성막의 남쪽 측면
  lexicon: HALOT
  rationale: צֶלַע는 ‘옆, 측면’을 뜻하고 תֵּימָנָה는 남쪽 방향을 가리키므로, 직설적이고 읽기 쉬운 ‘남쪽 옆’으로 옮겼습니다.
- source_word: וְ/הַ֨/שֻּׁלְחָ֔ן ... עַל צֶ֥לַע צָפֽוֹן
  english_pob_choice: and you shall put the table on the north side
  chosen_korean: 식탁은 북쪽 옆에 두어야 합니다
  alternatives_korean:
  - 식탁은 북쪽편에 두어야 합니다
  - 식탁은 북쪽 측면에 두어야 합니다
  lexicon: HALOT
  rationale: 같은 기구를 다시 언급하며 배치 방향을 대비시키는 구조를 살려, ‘북쪽 옆’으로 마무리했습니다.
theological_decisions:
- issue: 성막 기구 배치의 지시문 어조
  chosen_reading: 명령형 지시를 현대 한국어 합쇼체로 옮겨, 서술이 아닌 실제 배치 명령으로 읽히게 했습니다.
  alternative_readings:
  - 평서문형으로 완화해 ‘두었습니다’로 옮김
  - 더 고전적인 종결어미로 옮김
  rationale: 히브리어 직설 명령의 기능을 보존하는 것이 우선이며, 한국어에서는 공손한 명령/지시형이 가장 자연스럽습니다.
  doctrine_reference: 출 25–26장의 성막 규례 문맥
