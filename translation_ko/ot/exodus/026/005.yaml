  source_fidelity: ‘둘째로 이어진 휘장’은 히브리어의 ‘둘째로 이어 붙인 휘장 묶음에 속한 휘장’을 마치 단일 휘장인 것처럼 옮겨, מַחְבֶּרֶת(이어 붙인 묶음/결합체)의 범위를 축소합니다. 또한 각 고리의 대응 관계를 나타내는 마지막 절은 독립된 지시로 표현하는 편이 원문에 충실합니다.
