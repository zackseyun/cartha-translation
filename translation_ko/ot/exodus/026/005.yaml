  terminology: ‘휘장’과 ‘고리’는 적절합니다. מַחְבֶּרֶת는 여기서 단순히 ‘이어진 휘장’이 아니라 여러 휘장을 이어 만든 단위이므로 ‘휘장 묶음’으로 명시했습니다. 각 항목의 대응을 뜻하는 히브리 관용구의 각주는 ‘여자가 자기 자매에게’라는 방향 관계를 보존하도록 고쳤습니다.
