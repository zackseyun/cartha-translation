base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
  footnotes:
  - marker: a
    text: Literally, 'the loops ... a woman to her sister,' a Hebrew idiom meaning that the loops are matched or aligned with their counterparts.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 휘장에 고리 쉰 개를 만들고, 둘째로 이어진 휘장의 가장자리에 고리 쉰 개를 만들되, 그 고리들은 서로 마주보게 해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘한 여자와 그 자매’로, 짝이 맞는 것 또는 서로 대응하는 것을 뜻하는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  english_pob_choice: loops
  chosen_korean: 고리
  alternatives_korean:
  - 루프
  - 고리들
  lexicon: HALOT
  rationale: 천막의 천 조각을 잇는 부속물로서, 현대 한국어에서 가장 자연스럽고 정확한 대응은 ‘고리’입니다.
- source_word: יְרִיעָה
  english_pob_choice: curtain
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 커튼
  - 천장
  lexicon: HALOT
  rationale: 성막 문맥의 큰 천 조각을 가리키므로, 문맥상 익숙한 성막 용어인 ‘휘장’이 가장 적절합니다.
- source_word: קְצֵה
  english_pob_choice: edge
  chosen_korean: 가장자리
  alternatives_korean:
  - 끝
  - 모서리
  lexicon: HALOT
  rationale: 재봉과 결합의 맥락에서 ‘가장자리’가 원문의 외곽 경계를 가장 분명하게 드러냅니다.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  english_pob_choice: one another
  chosen_korean: 서로 마주보게
  alternatives_korean:
  - 서로 대응하게
  - 서로 맞닿게
  - 한쪽이 다른 쪽과
  lexicon: HALOT
  rationale: 직역하면 ‘한 여자와 그 자매’라는 관용구이므로, 단순한 대응이 아니라 두 고리가 정확히 맞물리도록 배치된다는 뜻을 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 고리의 상대적 배치 표현
  chosen_reading: ‘서로 마주보게’로 옮겨, 단순한 근접이 아니라 정확한 정렬과 대응을 강조했습니다.
  alternative_readings:
  - ‘서로 대응하게’
  - ‘서로 맞게’
  rationale: 본문의 초점은 두 휘장의 고리들이 정확히 맞물리도록 배치되는 데 있으며, 한국어로는 ‘마주보게’가 그 공간적·기능적 관계를 가장 분명히 드러냅니다.
  doctrine_reference: 성막 구조의 지시 본문으로서, 예배 공간의 질서와 정밀성을 드러냅니다.
