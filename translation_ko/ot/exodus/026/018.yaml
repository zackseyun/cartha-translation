source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קֶ֔רֶשׁ לִ/פְאַ֖ת נֶ֥גְבָּ/ה תֵימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/018.yaml
  text: 'And you shall make the frames for the tabernacle: twenty frames for the south side[a], southward.'
  footnotes:
  - marker: a
    text: Or 'boards' instead of 'frames'; the Hebrew term refers to the structural pieces of the tabernacle and may be understood either way in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 성막을 위하여 널판들을 만들어야 합니다. 남쪽 면을 향하여 널판 스무 개를 두어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 קֶרֶשׁ은 문맥상 성막의 구조용 목재 부재를 가리키며, 영어 POB의 'frames'처럼 기능적으로도, 'boards'처럼 재료 중심으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 그리고 당신은 ... 만들어야 합니다
  alternatives_korean:
  - 그리고 당신은 ... 만들 것입니다
  - 그리고 ... 만드십시오
  lexicon: HALOT
  rationale: 지시문맥의 완료형+접속사를 한국어의 의무 표현으로 옮겨, 명령의 강도를 살리면서도 합쇼체로 자연스럽게 표현했습니다.
- source_word: הַקְּרָשִׁים
  english_pob_choice: the frames
  chosen_korean: 널판들
  alternatives_korean:
  - 틀들
  - 판자들
  lexicon: HALOT
  rationale: 성막 구조물의 목재 부재를 가리키는 말로, 영어 POB의 'frames'는 기능을 살린 번역이지만 한국어에서는 전통적이면서도 구조물을 구체적으로 드러내는 '널판들'이 가장 직접적입니다.
- source_word: לַמִּשְׁכָּן
  english_pob_choice: for the tabernacle
  chosen_korean: 성막을 위하여
  alternatives_korean:
  - 장막을 위하여
  - 거처를 위하여
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기 성막 문맥의 고유 용어이므로, 익숙한 교회용어인 '성막'을 사용하되 문장 흐름상 '을 위하여'로 목적을 분명히 했습니다.
- source_word: לִפְאַת נֶגְבָּה תֵימָנָה
  english_pob_choice: for the south side, southward
  chosen_korean: 남쪽 면을 향하여
  alternatives_korean:
  - 남쪽 편을 위하여
  - 남쪽을 향하여
  lexicon: HALOT
  rationale: 면/쪽의 공간적 지시를 한국어 관용에 맞게 한 번으로 묶어, 본문의 남향 지시를 간명하게 전달했습니다.
theological_decisions:
- issue: 성막 구조 용어의 번역 범위
  chosen_reading: 하나님의 임재 처소인 성막의 실제 구조를 가리키는 문맥이므로, 추상화하지 않고 물리적 부재를 뜻하는 '널판들'로 옮겼습니다.
  alternative_readings:
  - '''프레임들''처럼 현대 건축 용어로 옮기는 방법'
  - '''판자들''처럼 단순 목재로 옮기는 방법'
  rationale: 본문은 성막 제작 지침이며, 구조의 실재성을 드러내는 것이 독자 이해에 더 충실합니다. 동시에 '널판들'은 조립식 구조 부재라는 기능을 충분히 전달합니다.
  doctrine_reference: 출 26장 성막 규례
