  yaml_path: translation/ot/exodus/026/017.yaml
  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
  footnotes:
  - marker: a
    text: Hebrew literally, 'two hands for the one board, joined, a woman to her sister.' Here 'hands' refers to projecting joints, hence 'tenons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 각 판재에는 서로 연결된 두 개의 장부가 있어야 합니다[a]. 성막의 모든 판재도 이와 같이 만드십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 판재를 위한 두 손, 서로 연결된, 여자가 자기 자매에게’라고 되어 있습니다. 여기서 ‘손’은 돌출 결합부를 가리키므로 ‘장부’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד֗וֹת
  english_pob_choice: tenons
  chosen_korean: 장부
  alternatives_korean:
  - 손
  - 돌기
  - 못
  lexicon: HALOT
  rationale: 목공·구조 맥락에서 판재에 달린 돌출 결합부를 가리키므로, 한국어 목공 용어인 ‘장부’가 기능을 가장 분명하게 전달합니다.
- source_word: מְשֻׁלָּבֹת
  english_pob_choice: joined
  chosen_korean: 서로 맞물린
  alternatives_korean:
