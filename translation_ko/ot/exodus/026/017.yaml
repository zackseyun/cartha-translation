  - 끼워 맞춘
  lexicon: HALOT
  rationale: 두 장부가 단순히 나란히 있는 것이 아니라 결합 구조를 이룬다는 뜻을 살려 ‘서로 맞물린’으로 옮겼습니다.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  english_pob_choice: one to another
  chosen_korean: 서로
  alternatives_korean:
  - 한쪽이 다른 쪽과
  - 한 장부가 다른 장부와
  - 각기 서로
  lexicon: HALOT
  rationale: 직역하면 ‘여자에게 여자’라는 히브리어 관용구이므로, 한국어에서는 구조상 대응 관계를 드러내는 ‘서로’로 풀어야 의미가 살아납니다.
- source_word: קֶּרֶשׁ / הַמִּשְׁכָּן
  english_pob_choice: board / tabernacle
  chosen_korean: 판재 / 성막
  alternatives_korean:
  - 널판 / 장막
  - 판 / 회막
  lexicon: HALOT
  rationale: קֶרֶשׁ은 성막을 이루는 구조용 목재를 가리키므로 ‘판재’가 가장 정확하며, מִשְׁכָּן은 여기서 고유한 성소 명칭이므로 ‘성막’으로 옮겼습니다.
- source_word: כֵּן תַּעֲשֶׂה
  english_pob_choice: this is how you shall make
  chosen_korean: 이렇게 하여 … 만드십시오
