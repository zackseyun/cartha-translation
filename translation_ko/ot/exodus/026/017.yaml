  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
  footnotes:
  - marker: a
    text: Hebrew literally, 'two hands for the one board, joined, a woman to her sister.' Here 'hands' refers to projecting joints, hence 'tenons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 각 판재에는 서로 맞물린 두 개의 장부가 있어야 합니다[a]. 이렇게 하여 성막의 모든 판재를 만드십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 판재의 두 손, 서로 맞붙은, 여자가 자기 자매에게’라고 되어 있습니다. 여기서 ‘손’은 돌출 결합부를 가리키므로 ‘장부’로 옮겼습니다.
    reason: lexical_alternative
