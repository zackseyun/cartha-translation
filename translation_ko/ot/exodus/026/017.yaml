  - 그리하여 … 만드십시오
  - 이렇게 … 만드셔야 합니다
  lexicon: HALOT
  rationale: 지시문의 반복 규범을 살리면서 현대 한국어에서 자연스러운 명령형으로 옮겼습니다.
