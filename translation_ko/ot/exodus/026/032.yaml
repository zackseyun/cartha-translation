source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֹתָ֗/הּ עַל אַרְבָּעָה֙ עַמּוּדֵ֣י שִׁטִּ֔ים מְצֻפִּ֣ים זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב עַל אַרְבָּעָ֖ה אַדְנֵי כָֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
  footnotes:
  - marker: a
    text: Or 'four silver sockets.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 금으로 입힌 아카시아 나무 기둥 네 개에 걸고, 그 기둥들의 갈고리는 금으로 만들고, 그 기둥들은 은 받침 네 개 위에 세우십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘은 소켓’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  english_pob_choice: And you shall hang it
  chosen_korean: 그것을 … 걸고
  alternatives_korean:
  - 그것을 두고
  - 그것을 놓고
  - 그것을 달고
  lexicon: HALOT
  rationale: 문맥상 대상은 휘장이고 뒤이어 기둥 위에 둔다고 이어지므로, 단순한 ‘두다/놓다’보다 걸어 설치하는 동작을 드러내는 ‘걸다’가 원문의 기능을 가장 잘 반영합니다.
- source_word: עַמּוּדֵי שִׁטִּים
  english_pob_choice: pillars of acacia wood
  chosen_korean: 아카시아나무 기둥
  alternatives_korean:
  - 아카시아 나무로 된 기둥
  - 아카시아 기둥
  lexicon: HALOT
  rationale: ‘שִׁטִּים’은 재료를 가리키므로, 한국어에서는 ‘아카시아나무 기둥’으로 간명하게 옮겨 재질 정보를 유지했습니다.
- source_word: מְצֻפִּים זָהָב
  english_pob_choice: overlaid with gold
  chosen_korean: 금으로 입힌
  alternatives_korean:
  - 금으로 덮은
  - 금으로 겉댄
  - 금으로 도금한
  lexicon: HALOT
  rationale: 성막 재료 묘사에서 צפה는 표면을 금으로 입히는 뜻이므로, 현대 한국어에서 자연스럽고 공정한 표현인 ‘금으로 입힌’이 가장 적절합니다.
- source_word: וָוֵיהֶם זָהָב
  english_pob_choice: their hooks being of gold
  chosen_korean: 그 기둥들의 갈고리는 금으로 만들고
  alternatives_korean:
  - 그들의 갈고리는 금이고
  - 그 기둥들의 고리는 금으로 하고
  lexicon: HALOT
  rationale: וָוֵיהֶם은 기둥에 붙는 걸쇠/갈고리를 가리키므로 ‘갈고리’로 옮겼고, 금속 재료를 분명히 하기 위해 ‘금으로 만들고’라고 처리했습니다.
- source_word: אַדְנֵי כָסֶף
  english_pob_choice: silver bases
  chosen_korean: 은 받침
  alternatives_korean:
  - 은 소켓
  - 은 받침대
  lexicon: HALOT
  rationale: 성막 맥락의 אַדֶן은 구조물을 받치는 ‘받침’으로 이해하는 것이 자연스럽고, 영어 POB의 주석처럼 ‘소켓’도 가능하지만 본문에는 현대적이고 명확한 ‘은 받침’을 택했습니다.
