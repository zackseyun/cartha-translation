source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ פָרֹ֗כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב יַעֲשֶׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
  footnotes:
  - marker: a
    text: Or 'curtain.' The Hebrew term refers to the inner hanging that separated the holy place from the most holy place.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'scarlet' more literally refers to scarlet-dyed material; traditionally associated with dye derived from insects.
    reason: cultural_note
  - marker: c
    text: Or 'the work of an artistic weaver' or 'skillfully worked.' The Hebrew expression denotes expert artistic craftsmanship.
    reason: lexical_alternative
translation:
  language: ko
  text: 청색 실과 자색 실과 주홍색 실[b]과 가늘게 꼰 세마포로 휘장[a]을 만드십시오. 그것을 그룹들을 넣은 정교하게 짠 작품[c]으로 만드십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘커튼’. 히브리어 용어는 성소와 지성소를 가르는 내부 걸이막을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘주홍색’은 더 문자적으로는 주홍으로 물들인 재료를 가리키며, 전통적으로는 곤충에서 얻는 염료와 연관됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘예술적인 직조의 작품’ 또는 ‘솜씨 있게 만든 것’. 이 히브리어 표현은 숙련된 예술적 기교를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  english_pob_choice: veil
  chosen_korean: 휘장
  alternatives_korean:
  - 장막
  - 커튼
  lexicon: HALOT
  rationale: 성소와 지성소를 가르는 내부 가림막이라는 성막 용어의 특수성을 살리기 위해 휘장을 택했습니다. '커튼'은 현대적이지만 의례적 구분이 약하고, '장막'은 다른 성막 관련 용례와 겹쳐 덜 정확합니다.
- source_word: תְּכֵלֶת
  english_pob_choice: blue
  chosen_korean: 청색
  alternatives_korean:
  - 파란색
  - 청색 실
  lexicon: HALOT
  rationale: 성막 재료 목록의 색채 용어로서 'blue'를 자연스럽게 옮기되, 한국어 성경어법에 맞는 '청색'을 사용했습니다.
- source_word: תּוֹלַעַת שָׁנִי
  english_pob_choice: scarlet yarn
  chosen_korean: 주홍색 실
  alternatives_korean:
  - 진홍색 실
  - 주홍
  lexicon: HALOT
  rationale: 이는 단순한 색 이름이 아니라 물감을 들인 직물/실을 가리키므로 실을 밝혔습니다. '주홍색'은 영어의 scarlet에 대응하면서도 의례 재료 목록에 자연스럽습니다.
- source_word: מַעֲשֵׂה חֹשֵׁב
  english_pob_choice: the work of a skillful designer
  chosen_korean: 솜씨 좋은 장인의 작품
  alternatives_korean:
  - 재능 있는 직공의 작업
  - 예술적으로 짠 작품
  lexicon: HALOT
  rationale: 이 표현은 단순 제작이 아니라 숙련된 예술적 제작을 뜻하므로, 특정 현대 직업명에 고정하지 않고 '솜씨 좋은 장인'으로 넓고 정확하게 옮겼습니다.
