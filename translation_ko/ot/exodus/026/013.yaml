reference: Exodus 26:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/אַמָּ֨ה מִ/זֶּ֜ה וְ/הָ/אַמָּ֤ה מִ/זֶּה֙ בָּ/עֹדֵ֔ף בְּ/אֹ֖רֶךְ יְרִיעֹ֣ת הָ/אֹ֑הֶל יִהְיֶ֨ה סָר֜וּחַ עַל צִדֵּ֧י הַ/מִּשְׁכָּ֛ן מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה לְ/כַסֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
  footnotes:
  - marker: a
    text: Or 'one cubit on one side and one cubit on the other side.' The Hebrew repeats 'the cubit' with demonstratives, referring to the leftover measure on each side.
    reason: lexical_alternative
  - marker: b
    text: '''Tabernacle'' translates Hebrew mishkan, the sacred dwelling structure beneath the tent covering.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이쪽의 한 규빗과 저쪽의 한 규빗은, 천막 휘장들의 길이에서 남는 여분이므로, 그 나머지는 이쪽과 저쪽에서 성막의 옆면을 덮도록 늘어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 규빗 이쪽과 한 규빗 저쪽’으로도 옮길 수 있습니다. 히브리어는 양쪽의 남은 분량을 가리키며 ‘규빗’을 반복합니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘성막’은 히브리어 mishkan으로, 천막 덮개 아래의 거룩한 거처 구조를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה
  english_pob_choice: the cubit / the extra cubit
  chosen_korean: 한 규빗
  alternatives_korean:
  - 여분의 규빗
  - 남은 한 규빗
  lexicon: HALOT
  rationale: אַמָּה는 표준 길이 단위이므로 기본형은 ‘규빗’으로 두고, 여기서는 문맥상 남는 분량임이 뒤의 절로 드러나므로 본문에서는 간결하게 처리했습니다.
- source_word: מִזֶּה ... מִזֶּה
  english_pob_choice: on this side ... on that side
  chosen_korean: 이쪽 ... 저쪽
  alternatives_korean:
  - 이 편 ... 저 편
  - 한쪽 ... 다른 쪽
  lexicon: HALOT
  rationale: 대칭적인 두 면을 가리키는 표현이므로 한국어의 자연스러운 공간 지시어 ‘이쪽/저쪽’으로 옮겼습니다.
- source_word: בָּעֹדֵף
  english_pob_choice: the surplus
  chosen_korean: 남는 여분
  alternatives_korean:
  - 남은 것
  - 초과분
  lexicon: HALOT
  rationale: ‘남아도는 분량’이라는 의미를 분명히 하기 위해 ‘여분’에 ‘남는’을 덧붙여 수량적 잉여를 드러냈습니다.
- source_word: יִהְיֶה סָרוּחַ
  english_pob_choice: shall hang over
  chosen_korean: 늘어질 것입니다
  alternatives_korean:
  - 드리워질 것입니다
  - 걸쳐질 것입니다
  lexicon: HALOT
  rationale: 직역의 ‘매달리다’보다, 천막 재질이 가장자리에 남아 아래로 처지는 물리적 이미지를 살리는 표현을 택했습니다.
- source_word: צִדֵּי הַמִּשְׁכָּן
  english_pob_choice: the sides of the tabernacle
  chosen_korean: 성막의 옆면
  alternatives_korean:
  - 성막의 양쪽
  - 성막의 옆쪽
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기에서 관용적으로 ‘성막’이 자연스러우며, ‘옆면’은 구조물의 측면을 분명하게 나타냅니다.
- source_word: לְכַסֹּתוֹ
  english_pob_choice: to cover it
  chosen_korean: 덮도록
  alternatives_korean:
  - 가리도록
  - 덮기 위하여
  lexicon: HALOT
  rationale: 마지막 목적절은 overhang의 기능을 설명하므로, 결과 기능을 자연스럽게 나타내는 ‘덮도록’을 사용했습니다.
theological_decisions:
- issue: 성막 용어의 번역 일관성
  chosen_reading: mishkan을 ‘성막’으로 옮겼습니다.
  alternative_readings:
  - 장막
  - 거처
  rationale: 출애굽기 맥락에서 mishkan은 예배용 거처 구조를 가리키는 관용 번역이 가장 분명하며, 본문의 건축적 설명과도 잘 맞습니다.
  doctrine_reference: 출애굽기 25–40장의 성막 서술
