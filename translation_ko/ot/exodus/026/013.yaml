  - severity: low
    issue: ‘남는 여분’이 중복적입니다.
    rationale: בָּעֹדֵף는 남는 분량/여분을 뜻하므로 ‘남는’ 또는 ‘여분’ 중 하나로 충분합니다.
  - severity: low
