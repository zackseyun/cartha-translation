revisions:
- from: 그리고 이쪽의 한 규빗과 저쪽의 한 규빗은, 천막 휘장들의 길이에서 남는 여분이므로, 그 나머지는 이쪽과 저쪽에서 성막의 옆면을 덮도록 늘어질 것입니다.[a][b]
  to: 천막 휘장들의 길이에서 남는 이쪽의 한 규빗과 저쪽의 한 규빗은[a] 성막[b]의 양쪽 옆면 위로 늘어져 성막을 덮을 것입니다.
  rationale: 원문의 구문에 따라 ‘천막 휘장들의 길이에서 남는’이 양쪽의 ‘한 규빗’을 수식하도록 바로잡았습니다. 또한 남는 천이 성막의 양쪽 옆면 위로 늘어져 성막을 덮는다는 공간적·목적적 관계를 명료하게 표현했습니다. ‘성막’ 및 측량 단위는 유지했으며, 각주 표지를 해당 표현에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:53:47Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 천막 휘장의 길이에서 남는 양쪽의 각 한 규빗이 성막의 양쪽 옆면 위로 늘어져 성막을 덮는다고 말합니다. 초안은 ‘한 규빗’들을 ‘여분이므로’라는 이유절의 주어로 처리한 뒤 ‘그 나머지’로 주어를 바꾸어, 원문의 단일한 주어와 문장 관계를 흐립니다.
  naturalness: ‘남는 여분’은 의미가 중복되고, ‘이쪽과 저쪽에서 성막의 옆면을 덮도록’은 위치와 목적어 관계가 다소 불명확합니다. ‘성막의 양쪽 옆면 위로 늘어져 성막을 덮을 것입니다’가 현대 표준어로 더 자연스럽고 구조도 분명합니다.
  terminology: ‘규빗’, ‘천막 휘장’, ‘성막’은 적절합니다. mishkan의 문화 주석은 유익하나, 본문 안에서는 ‘성막’에 직접 주석 표지를 두는 편이 앵커가 명확합니다.
  issues:
