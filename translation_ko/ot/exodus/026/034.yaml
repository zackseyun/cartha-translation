  text: 지성소 안에서 증거궤 위에 속죄소를 두십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속죄소’는 히브리어 כַּפֹּרֶת의 전통적 번역입니다. ‘속죄 덮개’ 또는 ‘자비좌’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘증거의 궤’를 뜻합니다. 일부 번역은 ‘언약궤’로 옮깁니다.
    reason: alternative_reading
  - marker: c
    text: ‘지성소’는 ‘가장 거룩한 곳’을 뜻하며, ‘지성소’ 대신 ‘거룩한 곳 중의 거룩한 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
