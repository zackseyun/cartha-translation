  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתָּ֙ אֶת הַ/כַּפֹּ֔רֶת עַ֖ל אֲר֣וֹן הָ/עֵדֻ֑ת בְּ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
  footnotes:
  - marker: a
    text: Or 'atonement cover' for 'mercy seat.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''the ark of the testimony''; many English versions have ''ark of the covenant.'''
    reason: alternative_reading
  - marker: c
    text: Or 'the Holy of Holies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 증거궤 위에 속죄소를 두고, 증거궤를 지성소 안에 두십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속죄소’는 전통적 ‘시은좌/자비좌’에 대응하는 번역으로, 덮개 기능과 속죄 관련성을 함께 드러냅니다.
    reason: cultural_note
  - marker: b
    text: ‘증거궤’는 히브리어의 문자적 표현을 따르되, 한국어 성경에서 널리 굳어진 성막 용어를 반영한 것입니다.
    reason: cultural_note
  - marker: c
    text: ‘지성소’는 직역하면 ‘지극히 거룩한 곳’에 해당하는 성막의 가장 안쪽 공간입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/נָתַתָּ
  english_pob_choice: And you shall place
  chosen_korean: 그리고 너는 … 두십시오
  alternatives_korean:
  - 그리고 너는 … 놓으십시오
  - 그리고 너는 … 설치하십시오
  lexicon: HALOT
  rationale: 지시문맥의 2인칭 남성 단수 완료형을 한국어 명령으로 옮기되, 성막 기구를 위치시키는 동작에는 ‘두다’가 가장 자연스럽습니다.
- source_word: הַכַּפֹּרֶת
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 자비좌
  - 속죄 덮개
  lexicon: HALOT
  rationale: 본문의 כַּפֹּרֶת은 궤의 덮개이자 속죄와 연결되는 성막 용어이므로, 한국어 성경 전통과 원어 의미를 함께 살릴 수 있는 ‘속죄소’를 채택했습니다.
- source_word: אֲרוֹן הָעֵדֻת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증언의 궤
  - 증거의 궤
  lexicon: HALOT
  rationale: 히브리어가 문자적으로는 ‘증거의 궤’이지만, 한국어 성경에서 널리 굳어진 성막 용어인 ‘증거궤’가 의미 전달과 가독성에 가장 적합합니다.
- source_word: בְּ/קֹדֶשׁ הַ/קֳּדָשִׁים
  english_pob_choice: in the Most Holy Place
  chosen_korean: 지성소 안에
  alternatives_korean:
  - 지성소에서
  - 가장 거룩한 곳 안에
  lexicon: HALOT
  rationale: 히브리어 슈퍼라티브 표현을 한국어 성막 용어인 ‘지성소’로 옮기되, 위치 관계를 분명히 하려고 ‘안에’를 덧붙였습니다.
theological_decisions:
- issue: 성막 공간의 전통적 명칭을 유지할지, 원어 구조를 더 노출할지
  chosen_reading: ‘속죄소’, ‘증거궤’, ‘지성소’로 옮겨 성막 제의 용어를 유지했습니다.
  alternative_readings:
  - ‘자비좌’, ‘증언궤’, ‘가장 거룩한 곳’
  rationale: 이 절은 제의적 장치와 성소의 배치를 지시하므로, 전통적으로 익숙한 한국어 용어를 쓰되 원문 의미를 해치지 않는 범위에서 번역했습니다. ‘mercy seat’의 정서적 완화보다 속죄 기능이 본문 맥락에서 더 핵심입니다.
  doctrine_reference: 출애굽기 26:34 문맥의 성막/속죄 용어
- issue: 두 번째 ‘그 자리’ 표현을 원문에 없는 중복으로 볼지 여부
  chosen_reading: ‘증거궤를 지성소 안에 두십시오’로 보완해 위치를 명시했습니다.
  alternative_readings:
  - 단순히 ‘그 위에 두십시오’
  rationale: 원문은 속죄소를 궤 위에 두는 동시에, 그 궤가 지성소에 놓인다는 성막 배치를 전제합니다. 한국어에서는 같은 동사를 반복하기보다 대상과 공간을 분명히 하여 오해를 줄였습니다.
  doctrine_reference: 성막 배치에 대한 서술 정확성
