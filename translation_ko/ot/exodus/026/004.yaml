source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ לֻֽלְאֹ֣ת תְּכֵ֗לֶת עַ֣ל שְׂפַ֤ת הַ/יְרִיעָה֙ הָ/אֶחָ֔ת מִ/קָּצָ֖ה בַּ/חֹבָ֑רֶת וְ/כֵ֤ן תַּעֲשֶׂה֙ בִּ/שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/קִּ֣יצוֹנָ֔ה בַּ/מַּחְבֶּ֖רֶת הַ/שֵּׁנִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
  footnotes:
  - marker: a
    text: Or 'blue' or 'violet'; the Hebrew תְּכֵלֶת denotes the characteristic dyed blue material used in the tabernacle.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew terms for 'set joined together' (חֹבָרֶת / מַחְבֶּרֶת) refer to a grouping of curtains coupled into one unit; traditionally, 'coupling' is also used.
    reason: lexical_alternative
  - marker: c
    text: Or 'endmost curtain' for 'outermost curtain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 한 휘장의 가장자리에 청색 고리를 만들어, 첫째로 맞붙인 한 휘장의 끝에 달게 하십시오[b][c][a]; 둘째로 맞붙인 가장 바깥 휘장의 가장자리에도 그와 같이 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘청색’ 혹은 ‘자주색’. 히브리어 תְּכֵלֶת은 성막에 쓰인 특징적인 염색 재료를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘첫째로 맞붙인/둘째로 맞붙인’은 휘장들이 한 단위로 결합된 묶음을 가리킵니다. 전통적으로는 ‘연결’로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘맨 끝의 휘장’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  english_pob_choice: loops
  chosen_korean: 고리
  alternatives_korean:
  - 고리들
  - 루프
  lexicon: HALOT
  rationale: 천막 휘장을 잇는 장치이므로 자연스러운 한국어인 ‘고리’가 가장 적절합니다.
- source_word: תְּכֵלֶת
  english_pob_choice: blue
  chosen_korean: 청색
  alternatives_korean:
  - 푸른색
  - 자주색
  - 청색 실
  lexicon: HALOT
  rationale: 본문은 고리의 재질보다 색을 가리키므로, 색채를 직접 드러내는 ‘청색’이 원문에 가장 가깝습니다.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  english_pob_choice: set joined together
  chosen_korean: 맞붙인
  alternatives_korean:
  - 연결된
  - 한 덩이로 맞붙인
  - 결합된
  lexicon: HALOT
  rationale: 두 용어가 함께 ‘한 단위로 결합된 휘장 묶음’을 가리키므로, 반복을 살리되 한국어에서는 간결하게 ‘맞붙인’으로 옮겼습니다.
- source_word: הַקִּיצוֹנָה
  english_pob_choice: outermost
  chosen_korean: 가장 바깥
  alternatives_korean:
  - 맨 끝
  - 가장 끝의
  - 외곽의
  lexicon: HALOT
  rationale: 둘째 묶음의 바깥쪽 가장자리를 뜻하므로, 공간 관계를 분명하게 하는 ‘가장 바깥’이 적절합니다.
