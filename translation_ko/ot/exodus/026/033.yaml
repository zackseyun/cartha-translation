  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֶת הַ/פָּרֹכֶת֮ תַּ֣חַת הַ/קְּרָסִים֒ וְ/הֵבֵאתָ֥ שָׁ֨מָּ/ה֙ מִ/בֵּ֣ית לַ/פָּרֹ֔כֶת אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/הִבְדִּילָ֤ה הַ/פָּרֹ֨כֶת֙ לָ/כֶ֔ם בֵּ֣ין הַ/קֹּ֔דֶשׁ וּ/בֵ֖ין קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
  footnotes:
  - marker: a
    text: Or 'the ark of the covenant.' The Hebrew here reads 'the testimony.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'holy of holies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 휘장을 고리들 아래에 두고, 그 휘장 안으로 증거궤를 들여놓아야 합니다. 그러면 그 휘장이 너희를 위해 성소와 지성소 사이를 구분할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘증거궤’는 전통적인 ‘언약궤’와 같은 대상을 가리키지만, 히브리어 본문은 ‘증거’(עֵדוּת)를 씁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지성소’는 문자적으로는 ‘가장 거룩한 곳’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  english_pob_choice: veil
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 장막
  lexicon: HALOT
  rationale: 성막 내부를 가르는 성소 용어로는 한국어 성경 전통에서 ‘휘장’이 가장 정확하고 관용적이어서, 단순한 천막 ‘막’보다 구분 기능을 잘 살립니다.
- source_word: קְרָסִים
  english_pob_choice: clasps
  chosen_korean: 고리들
  alternatives_korean:
  - 걸쇠들
  - 버클들
  lexicon: HALOT
  rationale: 성막 구조물을 잇는 금속 연결구를 가리키므로, 기능을 드러내는 ‘고리들’이 가장 자연스럽습니다. 현대식 ‘버클들’은 너무 시대착오적입니다.
- source_word: אֲרוֹן הָעֵדוּת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증거궤
  alternatives_korean:
  - 증언궤
  - 언약궤
  lexicon: HALOT
  rationale: 히브리어 본문이 분명히 ‘증거’(עֵדוּת)를 쓰므로, 전통적이지만 다른 어휘인 ‘언약궤’로 바꾸지 않고 원어 의미를 반영한 ‘증거궤’를 택했습니다.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: the Most Holy Place
  chosen_korean: 지성소
  alternatives_korean:
  - 가장 거룩한 곳
  - 지극히 거룩한 곳
  lexicon: HALOT
  rationale: 이 표현은 성막의 내실을 가리키는 고정된 성경 용어이므로, 의미와 수용성을 함께 고려해 한국어 관용형 ‘지성소’를 사용했습니다.
theological_decisions:
- issue: 휘장의 기능을 통한 성소 구분
  chosen_reading: 휘장이 성소와 지성소를 구분하는 장치로 제시됩니다.
  alternative_readings:
  - 휘장이 단순히 가리는 역할만 합니다.
  - 휘장이 두 공간을 절대적으로 분리합니다.
  rationale: 본문의 동사는 단순한 차폐가 아니라 구별과 경계를 세우는 기능을 말하므로, ‘구분할 것입니다’로 옮겨 성소 질서의 신학적 의미를 살렸습니다.
  doctrine_reference: 성막 구조와 거룩의 구분에 관한 본문 문맥
