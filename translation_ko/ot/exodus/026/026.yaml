base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/026.yaml
  text: And you shall make five bars of acacia wood for the frames of the one side of the tabernacle[a].
  footnotes:
  - marker: a
    text: Or 'boards' instead of 'frames'; the Hebrew term refers to the tabernacle's structural members.
    reason: lexical_alternative
translation:
  language: ko
  text: 아카시아 목재로 가로대 다섯 개를 성막 한쪽 면의 널판들을 위해 만드십시오[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘틀들’. 여기서 히브리어는 성막의 구조 부재를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 너는 … 만들되
  alternatives_korean:
  - 그리고 너는 … 만들라
  - 그리고 … 만들어야 한다
  lexicon: HALOT
  rationale: 지시문 맥락의 연속된 공정 명령이므로, 미래형 명령의 기능을 한국어의 명령형/지시형으로 자연스럽게 옮겼습니다.
- source_word: בְרִיחִם
  english_pob_choice: bars
  chosen_korean: 빗장
  alternatives_korean:
  - 막대
  - 가로대
  lexicon: HALOT
  rationale: 성막 구조물을 서로 고정하는 부재라는 기능을 살려, 일반적인 ‘막대’보다 구조적 의미가 분명한 ‘빗장’을 택했습니다.
- source_word: לְקַרְשֵׁי
  english_pob_choice: for the frames
  chosen_korean: 널판들을 위해
  alternatives_korean:
  - 틀들을 위해
  - 판자들을 위해
  lexicon: HALOT
  rationale: English POB의 각주처럼 히브리어 קֶרֶשׁ은 전통적 ‘boards’보다 구조 부재를 가리키므로, 한국어에서는 성막 문맥에 널리 쓰이는 ‘널판’으로 옮겼습니다.
- source_word: צֶלַע הַמִּשְׁכָּן הָאֶחָד
  english_pob_choice: the one side of the tabernacle
  chosen_korean: 성막의 한쪽 면
  alternatives_korean:
  - 성막의 한쪽
  - 성막의 한편
  lexicon: HALOT
  rationale: צֶלַע는 문자적 ‘갈비뼈’가 아니라 구조의 ‘쪽/면’을 뜻하므로, 이어지는 대칭 구절을 준비하는 ‘한쪽 면’이 가장 자연스럽고 정확합니다.
