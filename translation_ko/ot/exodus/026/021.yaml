id: EXO.26.21
reference: Exodus 26:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַרְבָּעִ֥ים אַדְנֵי/הֶ֖ם כָּ֑סֶף שְׁנֵ֣י אֲדָנִ֗ים תַּ֚חַת הַ/קֶּ֣רֶשׁ הָֽ/אֶחָ֔ד וּ/שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
  footnotes:
  - marker: a
    text: Or 'sockets' instead of 'bases'; the Hebrew term refers to the silver supports into which the tabernacle frames were set.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'board' instead of 'frame' for the Hebrew term describing each upright structural piece of the tabernacle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들의 마흔 개 받침은 은으로 하되, 한 널판 아래에 두 받침이 있고, 다른 널판 아래에 두 받침이 있어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי/הֶם
  english_pob_choice: their bases
  chosen_korean: 그들의 받침
  alternatives_korean:
  - 그들의 소켓
  - 그들의 기단
  lexicon: HALOT
  rationale: 성막 구조물의 지지부를 가리키므로 문맥상 ‘받침’이 가장 자연스럽고, POB의 ‘bases’도 이를 반영합니다.
- source_word: כָּסֶף
  english_pob_choice: of silver
  chosen_korean: 은으로 하되
  alternatives_korean:
  - 은으로
  - 은제
  lexicon: HALOT
  rationale: 재질을 표시하는 표현이므로 ‘은으로’가 직접적이며, 뒤의 서술형 어미와 결합해 문장 흐름을 자연스럽게 했습니다.
- source_word: הַ/קֶּרֶשׁ
  english_pob_choice: the frame
  chosen_korean: 널판
  alternatives_korean:
  - 판
  - 틀
  lexicon: HALOT
  rationale: 성막의 수직 구조재를 가리키는 전통적·문맥적 용례를 살려 ‘널판’을 택했습니다. POB의 ‘frame’은 기능을 풀어쓴 것으로 보지만, 한국어에서는 ‘널판’이 더 정확합니다.
- source_word: הָאֶחָד
  english_pob_choice: the one / the other
  chosen_korean: 한 ... / 다른 ...
  alternatives_korean:
  - 하나의 ... / 또 다른 ...
  - 첫 번째 ... / 두 번째 ...
  lexicon: HALOT
  rationale: 히브리어는 같은 정형 표현을 반복하지만 문맥상 분배 대비를 드러내므로, 한국어에서는 ‘한 널판’과 ‘다른 널판’으로 옮겨 의미를 분명히 했습니다.
