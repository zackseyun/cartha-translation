source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ לַ/מָּסָ֗ךְ חֲמִשָּׁה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֤ אֹתָ/ם֙ זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וְ/יָצַקְתָּ֣ לָ/הֶ֔ם חֲמִשָּׁ֖ה אַדְנֵ֥י נְחֹֽשֶׁת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
  footnotes:
  - marker: a
    text: Or 'curtain' or 'veil' for 'screen'; the Hebrew term here refers to the entrance hanging, distinct from the inner veil of the Most Holy Place.
    reason: lexical_alternative
  - marker: b
    text: Or 'sockets of bronze' for 'bases of bronze.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 휘장을 위해 아카시아 나무로 만든 기둥 다섯 개를 만들고, 그것에 금을 입히며, 그 갈고리들도 금으로 하고, 그것들을 위해 놋쇠 받침 다섯 개를 부어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘휘장’은 여기서 성막의 출입구에 드리우는 장치를 가리키며, 지성소 안쪽의 휘장과는 구별됩니다.
    reason: source_note
  - marker: b
    text: ‘놋쇠 받침’은 성막 구조물을 받치는 소켓/기단을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּסָךְ
  english_pob_choice: screen
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 가림막
  - 스크린
  lexicon: HALOT
  rationale: 이곳은 성막 출입구의 걸개를 가리키므로, 출입구용 천막이라는 기능을 살린 ‘휘장’이 가장 자연스럽습니다. 영어 POB의 ‘screen’과 달리 한국어에서는 ‘휘장’이 제의적 용도를 잘 드러냅니다.
- source_word: עַמּוּדֵי שִׁטִּים
  english_pob_choice: pillars of acacia wood
  chosen_korean: 아카시아 나무로 만든 기둥 다섯 개
  alternatives_korean:
  - 아카시아 나무 기둥 다섯 개
  - 아카시아 목재 기둥 다섯 개
  - 기둥 다섯 개
  lexicon: HALOT
  rationale: עַמּוּדִים은 구조물의 ‘기둥’이 기본 뜻이므로 이를 살리고, שִׁטִּים은 성막 재료 관례에 따라 ‘아카시아 나무’로 옮겼습니다.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  english_pob_choice: overlay them with gold
  chosen_korean: 그것에 금을 입히며
  alternatives_korean:
  - 그것들을 금으로 덮으며
  - 그것들을 금으로 입히며
  - 금으로 씌우며
  lexicon: HALOT
  rationale: צפה는 금속을 바깥에 입히는 뜻이므로 ‘금을 입히다’가 가장 간결하고 공예적 뉘앙스를 잘 살립니다.
- source_word: וָוֵיהֶם
  english_pob_choice: their hooks
  chosen_korean: 그 갈고리들도
  alternatives_korean:
  - 그 고리들도
  - 그 갈고리들
  - 그 훅들도
  lexicon: HALOT
  rationale: 성막 문맥의 וָוִים은 걸개를 매다는 장치이므로 ‘갈고리’가 기능을 가장 분명하게 전달합니다. '그들도'로 번역해 앞의 기둥들과 연결되는 구조를 살렸습니다.
- source_word: אַדְנֵי נְחֹשֶׁת
  english_pob_choice: bases of bronze
  chosen_korean: 놋쇠 받침 다섯 개
  alternatives_korean:
  - 청동 받침 다섯 개
  - 놋 받침 다섯 개
  - 놋쇠 소켓 다섯 개
  lexicon: HALOT
  rationale: 성막 재료 목록에서 נְחֹשֶׁת은 전통적으로 ‘놋쇠’로도 옮겨지지만, 한국어 독자에게 익숙한 제의적 용례를 고려해 ‘받침’으로 기능을 먼저 드러냈습니다. 영어 POB의 ‘bases’에 해당하는 구조물의 지지 요소를 반영했습니다.
theological_decisions:
- issue: 성막 출입구 장치의 번역어
  chosen_reading: ‘screen’을 ‘휘장’으로 옮겨 출입구용 걸개라는 기능을 드러냈습니다.
  alternative_readings:
  - ‘막’으로 옮기는 읽기
  - ‘스크린’으로 음역하는 읽기
  - ‘커튼’으로 옮기는 읽기
  rationale: 이 절의 장치는 지성소 휘장과 구별되는 출입구용 덮개이므로, 한국어에서 제의적·기능적 뉘앙스를 동시에 전달하는 ‘휘장’이 가장 오해가 적습니다.
  doctrine_reference: 성막 구조와 거룩의 구분(출 26장 문맥)
