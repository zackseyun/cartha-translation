translation:
  language: ko
  text: 너는 장막을 위하여 붉게 물들인 숫양 가죽 덮개를 만들고, 그 위에 다하스[a] 가죽 덮개를 만들어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תְּחָשִׁים의 뜻은 확실하지 않습니다. 특정 동물이나 내구성 있는 가죽 종류를 가리킬 수 있으며, ‘고급 가죽’, ‘돌고래 가죽’, ‘듀공 가죽’ 등의 번역이 제안됩니다.
