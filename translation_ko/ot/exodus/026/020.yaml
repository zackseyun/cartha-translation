  text: וּ/לְ/צֶ֧לַע הַ/מִּשְׁכָּ֛ן הַ/שֵּׁנִ֖ית לִ/פְאַ֣ת צָפ֑וֹן עֶשְׂרִ֖ים קָֽרֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/020.yaml
  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
  footnotes:
  - marker: a
    text: Or “boards.” The Hebrew term can refer to the upright structural pieces of the tabernacle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 성막의 둘째 면, 곧 북쪽 면에는 틀 스무 개가 있어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “널빤지”. 히브리어 용어는 성막의 수직 구조물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  english_pob_choice: And for the ... side
  chosen_korean: 그리고 ... 면
  alternatives_korean:
  - 그리고 ... 쪽
  - 그리고 ... 측면
  lexicon: HALOT
  rationale: 성막 구조를 설명하는 문맥에서 צֶלַע는 문자적 ‘갈비뼈’가 아니라 옆면/면을 가리키므로, 문장 흐름에 맞게 ‘면’으로 옮겼습니다.
- source_word: הַ/מִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: 출애굽기에서 מִשְׁכָּן은 성소적 이동식 장막을 가리키는 표준 표현이므로, 한국어 성경에서 확립된 ‘성막’을 사용했습니다.
- source_word: הַ/שֵּׁנִ֖ית
  english_pob_choice: the second
  chosen_korean: 둘째
  alternatives_korean:
  - 두 번째
  - 다른
  lexicon: HALOT
  rationale: 앞절의 첫째 면에 대응하는 두 번째 면임을 분명히 보여 주므로, 순서를 나타내는 ‘둘째’가 가장 정확합니다.
- source_word: קָֽרֶשׁ
  english_pob_choice: frames
  chosen_korean: 틀
  alternatives_korean:
  - 널빤지
  - 판자
  lexicon: HALOT
  rationale: קָרֶשׁ은 성막 벽을 이루는 수직 구조물로서 기능을 강조해야 하므로, 단순한 목재 판재보다 구조적 의미를 살린 ‘틀’을 택했습니다.
