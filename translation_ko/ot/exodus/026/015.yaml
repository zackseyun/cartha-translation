translation:
  language: ko
  text: 회막을 위하여 아카시아나무로 널판들을 만드십시오. 그것들을 곧게 세워 놓으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘널판들’은 히브리어 קְרָשִׁים을 옮긴 말입니다. 이 말은 회막의 수직 구조 부재를 가리키며, ‘판들’ 또는 ‘틀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 너는 … 만들어야 하며
  alternatives_korean:
  - 그리고 너는 … 만들어야 합니다
  - 너는 … 만들 것입니다
  lexicon: HALOT
  rationale: 지시문 맥락의 완료형+접속 waw를 한국어의 의무/명령 표현으로 옮기되, 합쇼체에서 자연스러운 진행 연결을 살렸습니다.
- source_word: הַקְּרָשִׁים
  english_pob_choice: the frames
  chosen_korean: 판들
  alternatives_korean:
  - 틀들
  - 널판들
  lexicon: HALOT
  rationale: 성막 구조의 나무 부재를 가리키는 말로, 한국어에서는 기능을 과도하게 해석하지 않으면서도 ‘boards’에 해당하는 물리적 요소를 드러내는 ‘판들’이 가장 무난합니다.
- source_word: לַמִּשְׁכָּן
  english_pob_choice: for the tabernacle
  chosen_korean: 회막을 위해
  alternatives_korean:
  - 성막을 위해
  - 장막을 위해
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기 문맥에서 성막/회막을 가리키는 तकनीческие 용어이며, 한국어 본문에서는 독자 친숙성과 문맥 적합성을 고려해 ‘회막’을 택했습니다.
- source_word: עֲצֵי שִׁטִּים
  english_pob_choice: of acacia wood
  chosen_korean: 아카시아 나무로 된
  alternatives_korean:
  - 아카시아 목재로 된
  - 시팀 나무로 된
  lexicon: HALOT
  rationale: 재료를 나타내는 소유/관계 구문을 한국어의 형용사적 표현으로 자연스럽게 옮겼습니다. 음역형 ‘시팀’은 뜻이 드러나지 않아 제외했습니다.
- source_word: עֹמְדִים
  english_pob_choice: standing upright
  chosen_korean: 곧게 서 있어야 합니다
  alternatives_korean:
  - 서 있어야 합니다
  - 수직으로 서 있어야 합니다
  lexicon: HALOT
  rationale: 분사는 부재의 배치 상태를 나타내므로, ‘곧게 서 있다’로 자연스럽게 풀어 구조적 의미를 분명히 했습니다.
theological_decisions:
- issue: 성막 관련 용어의 한국어 대응
  chosen_reading: מִשְׁכָּן을 ‘회막’으로, 구조 부재를 ‘판들’로 옮겨 성막 제작 지시의 기능적 의미를 살렸습니다.
  alternative_readings:
  - ‘성막’으로 통일
  - ‘장막’으로 번역
  rationale: 출애굽기에서는 מִשְׁכָּן이 예배 공간의 기술 용어로 쓰이므로, 한국어 교회 전통과 문맥 가독성을 함께 고려해 ‘회막’이 적절합니다.
  doctrine_reference: 출 25–40 성막 규례 문맥
- issue: ‘standing upright’의 표현 방식
  chosen_reading: 분사의 상태 의미를 ‘곧게 서 있어야 합니다’로 풀어 구조적 지시를 명확히 했습니다.
  alternative_readings:
  - ‘서 있는’
  - ‘수직으로’
  rationale: 단순 형용사화보다 의무형으로 옮기면 제작 지시의 명령성이 살아나며, 본문의 기술적 요구가 분명해집니다.
  doctrine_reference: 성막 제작 지시의 서술 방식
