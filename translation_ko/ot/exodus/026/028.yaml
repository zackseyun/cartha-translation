id: EXO.26.28
reference: Exodus 26:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/בְּרִ֥יחַ הַ/תִּיכֹ֖ן בְּ/ת֣וֹךְ הַ/קְּרָשִׁ֑ים מַבְרִ֕חַ מִן הַ/קָּצֶ֖ה אֶל הַ/קָּצֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/028.yaml
  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
  footnotes:
  - marker: a
    text: Or 'boards' instead of 'frames.' The Hebrew term refers to the tabernacle's upright structural pieces; 'frames' is chosen here to avoid implying simple flat planks.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 가운데 띠는, 판들 가운데에서, 끝에서 끝까지 뻗어 갑니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבְּרִיחַ
  english_pob_choice: middle bar
  chosen_korean: 띠
  alternatives_korean:
  - 막대
  - 가로대
  - 빗장
  lexicon: HALOT
  rationale: 장막 구조를 묶는 길게 뻗는 부재라는 점을 살려, 문짝용 느낌이 강한 '빗장'보다 구조재로 자연스러운 '띠'를 선택했습니다.
- source_word: הַתִּיכֹן
  english_pob_choice: middle
  chosen_korean: 가운데
  alternatives_korean:
  - 중앙의
  - 중간의
  lexicon: HALOT
  rationale: 세 개의 띠 가운데 위치한 것을 가장 간명하게 드러내는 표현으로 '가운데'를 택했습니다.
- source_word: בְּתוֹךְ הַקְּרָשִׁים
  english_pob_choice: in the midst of the frames
  chosen_korean: 판들 가운데에서
  alternatives_korean:
  - 틀들 가운데에서
  - 프레임들 가운데에서
  - 널판들 가운데에서
  lexicon: HALOT
  rationale: קְרָשִׁים는 전통적 '널판'보다 구조적 부재를 드러내는 '판들'이 무난하며, 문맥상 내부 위치를 살려 '가운데에서'로 옮겼습니다.
- source_word: מַבְרִחַ
  english_pob_choice: shall extend
  chosen_korean: 뻗어 갑니다
  alternatives_korean:
  - 이어집니다
  - 가로질러 갑니다
  - 연장됩니다
  lexicon: HALOT
  rationale: 히필 분사로서 한쪽 끝에서 다른 쪽 끝까지 길게 이어지는 동작을 나타내므로, 인위적인 기계적 느낌이 적은 '뻗어 갑니다'로 옮겼습니다.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  english_pob_choice: from end to end
  chosen_korean: 끝에서 끝까지
  alternatives_korean:
  - 한쪽 끝에서 다른 쪽 끝까지
  - 양 끝까지
  lexicon: HALOT
  rationale: 완전한 길이 방향의 연장을 뜻하는 관용을 한국어에서도 그대로 살리기 위해 '끝에서 끝까지'를 사용했습니다.
