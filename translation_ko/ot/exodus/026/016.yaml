  yaml_path: translation/ot/exodus/026/016.yaml
  text: The length of each frame shall be ten cubits[a], and the width of each frame one and a half cubits.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'board' instead of 'frame' for Hebrew קֶרֶשׁ.
    reason: lexical_alternative
translation:
  language: ko
  text: 각 틀의 길이는 열 규빗[a]이고, 각 틀의 너비는 한 규빗 반입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 전통적으로는 히브리어 קֶרֶשׁ을 ‘판자’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָּרֶשׁ
  english_pob_choice: frame
  chosen_korean: 틀
  alternatives_korean:
  - 판자
  - 널판
  lexicon: HALOT
  rationale: 성막 구조 맥락에서 קֶרֶשׁ은 단순한 판재보다 구조물의 한 단위를 가리키므로, 현대 한국어로는 기능을 드러내는 ‘틀’이 ‘판자’보다 덜 오해를 낳습니다.
- source_word: עֶשֶׂר אַמּוֹת
  english_pob_choice: ten cubits
  chosen_korean: 열 규빗
  alternatives_korean:
  - 열 큐빗
  - 10 규빗
  lexicon: HALOT
  rationale: 고대 측정 단위를 그대로 보존해 원문의 수치를 유지했고, 한국어 성경 문맥에서 통용되는 ‘규빗’을 사용했습니다.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  english_pob_choice: one and a half cubits
  chosen_korean: 한 규빗 반
  alternatives_korean:
  - 규빗 한 개 반
  - 한 규빗과 반
  lexicon: HALOT
  rationale: 히브리어의 반 규빗 표현을 자연스러운 현대 한국어로 옮기되, 정확한 분량은 그대로 유지했습니다.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  english_pob_choice: each frame
  chosen_korean: 각 틀
  alternatives_korean:
  - 한 틀마다
  - 각각의 틀
  lexicon: HALOT
  rationale: 단수형에 분배적 의미가 있는 표현을 한국어의 ‘각’으로 풀어, 개별 단위의 치수를 분명하게 했습니다.
