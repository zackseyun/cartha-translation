lexical_decisions:
- source_word: קָּרֶשׁ
  english_pob_choice: frame
  chosen_korean: 틀
  alternatives_korean:
  - 판자
  - 널판
  lexicon: HALOT
  rationale: 성막 구조 맥락에서 קֶרֶשׁ은 단순한 판재보다 구조물의 한 단위를 가리키므로, 현대 한국어로는 기능을 드러내는 ‘틀’이 ‘판자’보다 덜 오해를 낳습니다.
- source_word: עֶשֶׂר אַמּוֹת
  english_pob_choice: ten cubits
  chosen_korean: 열 규빗
  alternatives_korean:
