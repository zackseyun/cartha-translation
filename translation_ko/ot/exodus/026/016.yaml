  lexicon: HALOT
  rationale: 고대 측정 단위를 그대로 보존해 원문의 수치를 유지했고, 한국어 성경 문맥에서 통용되는 ‘규빗’을 사용했습니다.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  english_pob_choice: one and a half cubits
  chosen_korean: 한 규빗 반
  alternatives_korean:
