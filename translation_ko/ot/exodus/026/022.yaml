  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/לְ/יַרְכְּתֵ֥י הַ/מִּשְׁכָּ֖ן יָ֑מָּ/ה תַּעֲשֶׂ֖ה שִׁשָּׁ֥ה קְרָשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/022.yaml
  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
  footnotes:
  - marker: a
    text: Or 'frames' instead of 'boards,' if the structural pieces are understood as open frameworks rather than solid planks.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 장막의 뒤쪽, 곧 서쪽으로는 너희가 여섯 개의 널판을 만들라.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  english_pob_choice: the rear side of
  chosen_korean: 뒤쪽
  alternatives_korean:
  - 뒷면
  - 후미
  lexicon: HALOT
  rationale: 장막 구조를 가리키는 문맥에서 יַרְכָּה/יַרְכְּתַיִם은 ‘뒤쪽/후방’의 의미가 자연스러워, 영어 POB의 ‘rear side’에 맞게 간결한 한국어로 옮겼습니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 장막
  alternatives_korean:
  - 성막
  - 거처
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기에서 성소 구조를 가리키는 표준어로, 한국어에서는 문맥상 익숙하면서도 본뜻을 살리는 ‘장막’을 택했습니다.
- source_word: יָמָּה
  english_pob_choice: westward
  chosen_korean: 서쪽으로
  alternatives_korean:
  - 서쪽을 향하여
  - 바다쪽으로
  lexicon: HALOT
  rationale: 직역적 ‘바다쪽으로’보다, 여기서는 방향 지시가 분명하므로 한국어의 자연스러운 방위 표현인 ‘서쪽으로’가 원문의 공간 지시를 더 정확히 드러냅니다.
- source_word: קְרָשִׁים
  english_pob_choice: boards
  chosen_korean: 널판
  alternatives_korean:
  - 판자
  - 틀
  lexicon: HALOT
  rationale: ტაბერნacle 구조 부재를 가리키는 קְרָשִׁים은 전통적 ‘판자’보다 건축 부재 느낌을 살리는 ‘널판’이 문맥에 더 적합하며, 영어 POB의 ‘boards’와도 잘 대응합니다.
