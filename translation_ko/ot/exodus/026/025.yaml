  text: 구조틀[a]이 여덟 개가 되게 하고, 그것들의 은으로 만든 받침[b]은 열여섯 개가 되게 해야 합니다. 한 구조틀 아래에 받침 두 개씩, 또 다른 구조틀 아래에도 받침 두 개씩 두어야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구조틀’은 여기서 קְרָשִׁים을 구조 기능에 따라 옮긴 말입니다. 전통적으로는 ‘널판’으로도 번역합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘받침’은 אַדָנִים을 옮긴 말입니다. 문맥상 ‘소켓’으로도 번역할 수 있습니다.
    reason: lexical_alternative
