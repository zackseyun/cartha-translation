translation:
  language: ko
  text: 프레임이 여덟 개여야 하고, 그 은 기초는 열여섯 개여야 합니다. 한 프레임 아래에 두 기초씩, 또 다른 프레임 아래에 두 기초씩 두어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘프레임’은 כאן의 קְרָשִׁים을 구조 기능에 따라 옮긴 것으로, 전통적 번역 ‘널판’에 해당하는 대안이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기초’는 אַדְנִים을 옮긴 말이며, 문맥상 ‘받침’ 또는 전통적 ‘소켓’으로도 번역할 수 있습니다.
    reason: lexical_alternative
