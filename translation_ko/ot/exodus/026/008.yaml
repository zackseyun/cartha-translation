  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁלֹשִׁים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֣ה אַחַ֔ת לְ/עַשְׁתֵּ֥י עֶשְׂרֵ֖ה יְרִיעֹֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
  footnotes:
  - marker: a
    text: Or, more literally, 'the curtain, the one' ... 'the curtain, the one'; Hebrew uses this form distributively, meaning each individual curtain.
    reason: lexical_alternative
  - marker: b
    text: Or 'the same measure.' The Hebrew phrase is literally 'one measure,' emphasizing that all eleven curtains were made to identical dimensions.
    reason: lexical_alternative
translation:
  language: ko
  text: 각 휘장의 길이는 서른 규빗[a]이고, 각 휘장의 너비는 네 규빗[b]이며; 모든 열한 휘장은 한 치수입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, '휘장, 그 하나' ... '휘장, 그 하나'입니다. 히브리어는 분배적으로 이런 형식을 사용하여 각 개별 휘장을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '같은 치수'입니다. 히브리어의 문자적 표현은 '한 치수'로, 열한 휘장이 모두 동일한 규격이었음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ / רֹחַב
  english_pob_choice: length / width
  chosen_korean: 길이 / 너비
  alternatives_korean:
  - 장 / 폭
  - 길고 짧음
  lexicon: HALOT
  rationale: 휘장의 치수를 병렬로 제시하는 문맥이므로, 현대 한국어의 가장 자연스러운 대응인 '길이'와 '너비'를 사용했습니다.
- source_word: יְרִיעָה
  english_pob_choice: curtain
  chosen_korean: 휘장
  alternatives_korean:
  - 막
  - 커튼
  - 천
  lexicon: HALOT
  rationale: 출애굽기 성막 문맥에서 יְרִיעָה는 성막 덮개/걸개를 가리키므로, 한국어 성경에서 익숙하면서도 장막 문맥을 살리는 '휘장'을 택했습니다.
- source_word: שְׁלֹשִׁים בָּאַמָּה / אַרְבַּע בָּאַמָּה
  english_pob_choice: thirty cubits / four cubits
  chosen_korean: 서른 규빗 / 네 규빗
  alternatives_korean:
  - 삼십 규빗 / 사 규빗
  - 서른 길이 / 네 길이
  lexicon: HALOT
  rationale: אַמָּה는 고대 길이 단위이므로 단위를 보존해야 했고, POB의 직역성을 따라 '규빗'을 유지했습니다.
- source_word: מִדָּה אַחַת
  english_pob_choice: one measure
  chosen_korean: 한 치수
  alternatives_korean:
  - 같은 치수
  - 한 규격
  - 같은 규격
  lexicon: HALOT
  rationale: 모든 휘장이 동일한 크기임을 드러내는 표현이므로, POB의 'one measure'를 자연스러운 한국어로 옮겨 '한 치수'로 렌더링했습니다.
theological_decisions:
- issue: 마지막 절구의 분배적 의미
  chosen_reading: '''각 휘장''과 ''모든 열한 휘장''으로 분배적 의미를 살려, 각각이 동일한 치수를 가진다는 뜻으로 읽었습니다.'
  alternative_readings:
  - '''열한 휘장 모두는 한 치수입니다'''
  - '''열한 휘장은 같은 크기입니다'''
  rationale: 히브리어의 정관사+단수형과 수량 표현은 각 개별 휘장에 동일 규격이 적용됨을 강조하므로, 이를 한국어에서도 명시적으로 드러내야 합니다.
  doctrine_reference: 성막 제작 지시의 정확성과 동일 규격 강조
- issue: 치수 표현의 현대화 정도
  chosen_reading: 현대 한국어로는 '길이/너비'를 쓰되, 고대 단위는 '규빗'으로 보존했습니다.
  alternative_readings:
  - '''장/광'' 같은 한자어 치수'
  - 미터법 환산
  rationale: 본문은 건축 치수를 전달하는 실용 문맥이므로, 의미를 살리면서도 원문 단위를 보존하는 것이 최선입니다.
  doctrine_reference: 원문 단위 보존과 가독성의 균형
