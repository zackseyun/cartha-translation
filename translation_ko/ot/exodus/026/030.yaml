lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  english_pob_choice: you shall set up
  chosen_korean: 세워야 합니다
  alternatives_korean:
  - 설치해야 합니다
  - 일으켜 세워야 합니다
  lexicon: HALOT
  rationale: 히필의 ‘세우다/일으켜 세우다’에 해당하며, 현대 한국어에서는 성막을 ‘세우다’가 가장 자연스럽고 원뜻을 잘 보존합니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 מִשְׁכָּן은 예배용 성소를 가리키므로, 관용적으로 정착된 ‘성막’이 가장 정확합니다.
- source_word: כְּמִשְׁפָּטוֹ
  english_pob_choice: according to its ordinance
  chosen_korean: 그 정해진 양식대로
  alternatives_korean:
  - 그 규례대로
  - 그 정한 법도대로
  - 그 규정대로
  lexicon: HALOT
  rationale: 건축·배치 문맥에서 מִשְׁפָּטוֹ는 법정 의미보다 ‘정해진 방식/형식’의 뜻이 강하므로, 본문의 설계 준수를 드러내는 ‘정해진 양식’이 적절합니다.
- source_word: בָּהָר
  english_pob_choice: on the mountain
  chosen_korean: 산에서
  alternatives_korean:
  - 산 위에서
  - 그 산에서
  lexicon: HALOT
  rationale: ב의 위치 표현은 한국어에서 보통 ‘~에서’로 옮기며, 모세가 받은 계시의 장소를 자연스럽게 나타냅니다.
theological_decisions:
- issue: אֲשֶׁר הָרְאֵיתָ의 수동 뉘앙스
  chosen_reading: 너는 그것을 산에서 보았습니다
  alternative_readings:
  - 그것이 산에서 당신에게 보여졌습니다
  - 산에서 너에게 보여진 그것대로
  rationale: 히브리어 형태는 능동형이지만, 직전 영어 POB가 ‘which you were shown’로 해석한 것은 계시의 주도권을 하나님께 두려는 의미를 반영합니다. 한국어는 과도한 수동화를 피하면서도 ‘보았다’로 계시 경험을 유지합니다.
  doctrine_reference: 계시의 주도권과 모세에게 주어진 모형(출 25:40; 히 8:5)
