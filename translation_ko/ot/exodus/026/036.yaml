language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ מָסָךְ֙ לְ/פֶ֣תַח הָ/אֹ֔הֶל תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֖ה רֹקֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
  footnotes:
  - marker: a
    text: Or 'curtain' or 'veil' for the entrance covering; 'screen' is used here to distinguish it from the inner veil described elsewhere in the chapter.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 푸른 실과 자주색 실과 홍색 실과 꼬아 짠 가는 베실로 장막 입구에 드리울 가리개를 만들되, 수놓는 이의 솜씨로 만들어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가리개’는 입구를 가리는 걸개를 뜻합니다. ‘막’ 또는 ‘휘장’으로도 옮길 수 있으나, 여기서는 이 장에서 내부를 가르는 휘장과 구별하기 위해 ‘가리개’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  english_pob_choice: screen
  chosen_korean: 차양
  alternatives_korean:
  - 막
  - 휘장
  - 스크린
  lexicon: HALOT
  rationale: 입구에 거는 덮개라는 기능을 살리면서, 바로 앞의 내장 휘장과 구별되는 바깥쪽 구조물이라는 점을 한국어로 자연스럽게 드러내기 위해 ‘차양’을 선택했습니다.
- source_word: לְפֶתַח הָאֹהֶל
  english_pob_choice: for the entrance of the tent
  chosen_korean: 성막 입구를 위한
  alternatives_korean:
  - 장막의 입구를 위한
  - 천막의 문을 위한
  lexicon: HALOT
  rationale: 문맥상 출애굽기 성막 규정이므로 ‘장막’보다 ‘성막’이 청중 이해에 더 분명하며, פתח의 기능을 ‘입구’로 옮겼습니다.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  english_pob_choice: blue and purple and scarlet yarn
  chosen_korean: 푸른 실과 자주색 실과 홍색 실
  alternatives_korean:
  - 청색 실과 자색 실과 홍색 실
  - 푸른 실과 보라 실과 진홍 실
  lexicon: HALOT
  rationale: 염색된 직물/실의 연속 열거를 한국어로 자연스럽게 살리되, 각각의 색을 관용적인 현대 표기로 옮겼습니다. ‘홍색’은 תוֹלַעַת שָׁנִי의 붉은 계열을 무리 없이 반영합니다.
- source_word: שֵׁשׁ מָשְׁזָר
  english_pob_choice: fine twisted linen
  chosen_korean: 꼬아 짠 가는 베실
  alternatives_korean:
  - 가는 꼬임의 베실
  - 꼬아 만든 고운 아마포
  lexicon: HALOT
  rationale: שֵׁשׁ의 고운 베/아마포 성격과 מָשְׁזָר의 ‘꼬다’ 의미를 함께 살리기 위해 ‘꼬아 짠 가는 베실’로 옮겼습니다.
- source_word: מַעֲשֵׂה רֹקֵם
  english_pob_choice: the work of an embroiderer
  chosen_korean: 수놓는 사람의 작업
  alternatives_korean:
  - 자수하는 이의 작업
  - 자수 놓은 솜씨
  lexicon: HALOT
  rationale: 문구가 단순한 결과물보다 숙련된 장인의 작업을 가리키므로, 직역에 가까우면서도 자연스러운 ‘수놓는 사람의 작업’을 택했습니다.
theological_decisions:
- issue: 입구용 덮개와 내부 휘장의 구별
  chosen_reading: מָסָךְ을 ‘차양’으로 옮겨, 같은 장의 내부 휘장과 기능적으로 구별되게 했습니다.
  alternative_readings:
  - 휘장
  - 막
  rationale: 본문은 성막 입구용 덮개를 말하므로, 내부 공간을 가르는 휘장과 동일시하지 않도록 구별성을 유지하는 번역이 필요합니다.
  doctrine_reference: 성막 구조의 구분(출 26장 문맥)
