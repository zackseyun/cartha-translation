review_pass:
  verdict: revise
  source_fidelity: ‘차양’은 햇빛·비를 막기 위해 바깥으로 돌출되게 설치하는 구조물을 뜻하므로, 입구에 거는 מָסָךְ의 뜻과 맞지 않습니다. 또한 אֹהֶל은 이 구절에서는 ‘성막’보다 직접적인 ‘장막’으로 옮기는 편이 원문에 더 가깝습니다. 색상·꼰 가는 베실·자수 장인의 솜씨는 유지되어야 합니다.
  naturalness: 초안의 ‘너는 … 하십시오’는 주어와 합쇼체 명령 종결이 어울리지 않습니다. ‘너는 … 만들어야 합니다’로 고치면 현대 표준어 합쇼체의 지시문으로 자연스럽습니다. ‘수놓는 이의 솜씨로’도 ‘수놓는 사람의 작업으로’보다 간결하고 자연스럽습니다.
  terminology: מָסָךְ은 내부 공간을 가르는 פָּרֹכֶת와 구별하되, ‘차양’으로 바꾸어서는 안 됩니다. ‘가리개’는 입구를 가리는 걸개라는 기능을 자연스럽게 나타내며, 필요하면 각주에서 ‘막’ 또는 ‘휘장’이라는 대안을 밝혀 구별의 근거를 제시할 수 있습니다.
