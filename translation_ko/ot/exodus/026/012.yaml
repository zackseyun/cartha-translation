id: EXO.26.12
reference: Exodus 26:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/סֶ֨רַח֙ הָ/עֹדֵ֔ף בִּ/ירִיעֹ֖ת הָ/אֹ֑הֶל חֲצִ֤י הַ/יְרִיעָה֙ הָ/עֹדֶ֔פֶת תִּסְרַ֕ח עַ֖ל אֲחֹרֵ֥י הַ/מִּשְׁכָּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
  footnotes:
  - marker: a
    text: Or 'the surplus that is left from the tent curtains.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew distinguishes between 'the tent' (the covering layer) and 'the tabernacle' (the dwelling structure).
    reason: cultural_note
translation:
  language: ko
  text: 그리고 천막의 천들에서 남는 여분은 — 곧 남아 있는 반 휘장 — 성막의 뒤쪽으로 늘어지게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֶרַח הָעֹדֵף
  english_pob_choice: the overhang that remains / the excess that remains
  chosen_korean: 남는 여분
  alternatives_korean:
  - 남은 과분
  - 늘어지는 남은 부분
  - 여분
  lexicon: HALOT
  rationale: סֶרַח와 עודף는 모두 남아 있는 초과분과 그 돌출·늘어짐의 이미지를 함께 가지므로, 건축적 맥락을 살려 ‘남는 여분’으로 옮겼습니다.
- source_word: יְרִיעֹת הָאֹהֶל
  english_pob_choice: the tent curtains
  chosen_korean: 천막의 천들
  alternatives_korean:
  - 장막의 휘장들
  - 천막 휘장들
  - 천막의 휘장들
  lexicon: HALOT
  rationale: 여기서 אֹהֶל은 뒤의 מִשְׁכָּן과 구별되는 덮개 층을 가리키므로, 구조물보다 덮개 재료의 이미지를 살려 ‘천막의 천들’로 옮겼습니다.
- source_word: חֲצִי הַיְרִיעָה הָעֹדֶפֶת
  english_pob_choice: the half curtain that remains over
  chosen_korean: 남아 있는 반 휘장
  alternatives_korean:
  - 반 휘장
  - 남는 반 장막
  - 남아 남는 반 휘장
  lexicon: HALOT
  rationale: 반 폭의 천 조각을 가리키는 표현이므로, 수량과 잔여성을 간결하게 드러내는 ‘남아 있는 반 휘장’이 가장 자연스럽습니다.
- source_word: תִּסְרַח עַל אֲחֹרֵי
  english_pob_choice: shall hang over the back of
  chosen_korean: 뒤쪽으로 늘어지게 하십시오
  alternatives_korean:
  - 뒤쪽에 늘어지게 하십시오
  - 뒤쪽을 덮게 하십시오
  - 뒤로 드리우게 하십시오
  lexicon: HALOT
  rationale: סרח는 이 문맥에서 단순한 ‘넘침’보다 아래로 늘어져 드리우는 동작을 나타내므로, 명령형으로 ‘늘어지게 하십시오’가 적절합니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 성막 구조
  - 거처
  lexicon: HALOT
  rationale: מִשְׁכָּן은 예배 맥락의 기술 용어이므로, 한국어 성서에서 널리 통용되는 ‘성막’을 사용하되 앞의 ‘천막’과 구별했습니다.
theological_decisions:
- issue: 천막(덮개 층)과 성막(거처 구조)의 구별
  chosen_reading: ‘천막의 천들’과 ‘성막’으로 서로 다른 층위를 구분했습니다.
  alternative_readings:
  - 둘 다 ‘장막’으로 통일
  - 둘 다 ‘성막’으로 통일
  rationale: 원문은 אֹהֶל과 מִשְׁכָּן을 구별하므로, 한국어에서도 같은 말로 평면화하지 않고 구조적 차이를 보존했습니다.
  doctrine_reference: 출 26장 문맥의 성막 구조 묘사
