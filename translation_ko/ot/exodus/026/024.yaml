  text: וְ/יִֽהְי֣וּ תֹֽאֲמִים֮ מִ/לְּ/מַטָּה֒ וְ/יַחְדָּ֗ו יִהְי֤וּ תַמִּים֙ עַל רֹאשׁ֔/וֹ אֶל הַ/טַּבַּ֖עַת הָ/אֶחָ֑ת כֵּ֚ן יִהְיֶ֣ה לִ/שְׁנֵי/הֶ֔ם לִ/שְׁנֵ֥י הַ/מִּקְצֹעֹ֖ת יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
  footnotes:
  - marker: a
    text: Or 'twinned' or 'matching' at the bottom; the Hebrew describes the two boards as forming a matched pair.
    reason: lexical_alternative
  - marker: b
    text: Or 'whole' or 'perfectly fitted' at its top; the Hebrew term emphasizes structural completeness here, not moral perfection.
    reason: lexical_alternative
  - marker: c
    text: Or 'to the single ring'; the phrase may refer to the ring that joins the paired boards at the top.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것들은 아래쪽에서 짝을 이루어야 하며, 함께 그 꼭대기에서는 하나의 고리까지 온전해야 합니다. 두 모서리를 위한 것이므로, 두 개 모두에게 이와 같아야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 쌍으로’, ‘맞짝으로’라는 뜻일 수 있으며, 히브리어는 두 널빤지가 짝을 이룬 형태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 꼭대기에서 온전하게’, 곧 구조적으로 빈틈없이 맞물린다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 하나의 고리까지’로도 옮길 수 있습니다. 이 표현은 짝을 이룬 널빤지를 위쪽에서 잇는 고리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  english_pob_choice: paired
  chosen_korean: 짝을 이루어
  alternatives_korean:
  - 한 쌍으로
  - 대칭이 되게
  - 짝지어
  lexicon: HALOT
  rationale: 보드 둘이 구조적으로 대응하는 관계를 나타내므로, 자연스러운 현대 한국어로는 ‘짝을 이루어’가 가장 직접적입니다.
- source_word: מִלְּמַטָּה
  english_pob_choice: at the bottom
  chosen_korean: 아래쪽에서
  alternatives_korean:
  - 아래에서
  - 밑에서
  - 하단에서
  lexicon: HALOT
  rationale: 아래쪽 끝을 가리키는 공간 표현으로, 목공·건축 지시문에 어울리는 표준어로 옮겼습니다.
- source_word: תַמִּים
  english_pob_choice: complete
  chosen_korean: 온전해야 합니다
  alternatives_korean:
  - 완전해야 합니다
  - 완성되어야 합니다
  - 온전히 맞아야 합니다
  lexicon: HALOT
  rationale: 여기서는 도덕적 의미가 아니라 구조적 완결성을 뜻하므로, ‘온전하다’로 그 성질을 살렸습니다.
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  english_pob_choice: to the first ring
  chosen_korean: 하나의 고리까지
  alternatives_korean:
  - 첫째 고리까지
  - 그 하나의 고리까지
  - 한 고리까지
  lexicon: HALOT
  rationale: ‘הָאֶחָת’의 수사성을 살리면서도, 고리의 정확한 위치를 단정하지 않도록 ‘하나의 고리까지’로 옮겼습니다.
theological_decisions:
- issue: 출애굽기 26장의 기술문에서 구조적 완전성 표현 처리
  chosen_reading: ‘온전해야 합니다’는 도덕적 완전이 아니라 맞물림과 구조적 일치를 뜻합니다.
  alternative_readings:
  - ‘완전해야 합니다’
  - ‘완벽해야 합니다’
  rationale: 문맥이 성막 구조 지시이므로, 윤리적·형이상학적 의미로 오해되지 않도록 기술적 완결성을 분명히 했습니다.
  doctrine_reference: 성막 제작 지시의 문자적-기술적 문맥
