  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
  footnotes:
  - marker: a
    text: Literally, 'the curtains, each woman to her sister'—a Hebrew idiom meaning the curtains are to be joined correspondingly to one another.
    reason: lexical_alternative
translation:
  language: ko
  text: 금 걸쇠 쉰 개를 만들고, 그 걸쇠로 휘장을 서로 연결하여 성막이 하나가 되게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 여자와 그 자매에게’라는 히브리 관용구로, 여기서는 휘장들이 서로 짝이 되어 대응하게 연결된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְסֵי זָהָב
  english_pob_choice: gold clasps
  chosen_korean: 금 갈고리
  alternatives_korean:
  - 금 고리
  - 금 고정쇠
  - 금 걸쇠
  lexicon: HALOT
  rationale: 문맥상 휘장을 서로 잇는 연결 부속품이므로 기능을 살려 ‘갈고리’로 옮겼고, 금속 재질은 ‘금’으로 간결하게 드러냈습니다.
- source_word: וְחִבַּרְתָּ
  english_pob_choice: and join
  chosen_korean: 이어 붙여
  alternatives_korean:
  - 연결하여
  - 잇고
  - 결합하여
  lexicon: HALOT
  rationale: 히브리어 חבר의 결합·연결 의미를 살리되, 텐트 휘장을 실제로 맞붙여 잇는 장면이 분명하게 보이도록 했습니다.
- source_word: הַיְרִיעֹת אִשָּׁה אֶל אֲחֹתָהּ
  english_pob_choice: the curtains to one another
  chosen_korean: 휘장을 서로
  alternatives_korean:
  - 휘장을 각각 서로에게
  - 휘장을 한 폭씩 짝지어
  - 휘장을 각기 상응하게
  lexicon: HALOT
  rationale: 직역하면 ‘한 여자와 그 자매’라는 히브리 관용구이지만, 무생물인 휘장들 사이의 상응적 결합을 한국어로 자연스럽게 전달하기 위해 ‘서로’로 옮겼습니다.
- source_word: הַמִּשְׁכָּן אֶחָד
  english_pob_choice: the tabernacle may be one
  chosen_korean: 성막이 하나가 되게
  alternatives_korean:
  - 성막이 하나가 되도록
  - 성막이 하나가 되게 하여
  - 성막이 한몸이 되게
  lexicon: HALOT
  rationale: מִשְׁכָּן은 출애굽기에서 기술적 용례인 ‘성막’이 적절하며, 결과절의 ‘하나’는 분리되지 않은 단일 구조를 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘하나’의 의미를 구조적 통일로 볼지, 상징적 일치로 확장할지
  chosen_reading: 휘장들을 연결한 결과 성막이 하나의 통합된 구조가 되었다는 물리적·기능적 의미로 옮겼습니다.
  alternative_readings:
  - 성막이 일치하게 되게
  - 성막이 연합되게
  rationale: 본문의 직접 초점은 예배 공동체의 상징보다 제작 지시의 구조적 완성에 있으므로, 과도한 상징화를 피했습니다.
  doctrine_reference: 출 26:6 문맥상 성막 제작 지시
