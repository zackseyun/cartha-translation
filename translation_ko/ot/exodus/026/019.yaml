  text: וְ/אַרְבָּעִים֙ אַדְנֵי כֶ֔סֶף תַּעֲשֶׂ֕ה תַּ֖חַת עֶשְׂרִ֣ים הַ/קָּ֑רֶשׁ שְׁנֵ֨י אֲדָנִ֜ים תַּֽחַת הַ/קֶּ֤רֶשׁ הָ/אֶחָד֙ לִ/שְׁתֵּ֣י יְדֹתָ֔י/ו וּ/שְׁנֵ֧י אֲדָנִ֛ים תַּֽחַת הַ/קֶּ֥רֶשׁ הָ/אֶחָ֖ד לִ/שְׁתֵּ֥י יְדֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
  footnotes:
  - marker: a
    text: Or 'silver sockets' for 'silver bases'; the Hebrew term can denote a socket-like base in tabernacle construction.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'board' instead of 'frame.' The Hebrew likely refers to the upright structural pieces of the tabernacle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 은으로 된 마흔 개의 받침을 그 스무 개의 틀 아래에 만들어야 합니다. 한 틀 아래에는 그 두 촉을 위하여 두 받침을, 다음 틀 아래에는 그 두 촉을 위하여 두 받침을 두어야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘받침’은 성막 구조에서 ‘소켓’에 해당하는 지지 부재를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘틀’은 전통적 번역의 ‘널판/판자’보다 성막의 수직 구조물 기능을 더 분명하게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  english_pob_choice: silver bases
  chosen_korean: 은으로 된 받침
  alternatives_korean:
  - 은 소켓
  - 은 받침대
  lexicon: HALOT
  rationale: 성막 구조물의 지지·끼움 기능을 살리면서 현대 한국어에서 자연스럽게 읽히는 말로 옮겼습니다. '소켓'은 기술적이지만 본문 맥락의 구조물 이미지가 약해지고, '받침대'는 다소 물체를 올려놓는 느낌이 강합니다.
- source_word: הַקָּרֶשׁ
  english_pob_choice: frame
  chosen_korean: 틀
  alternatives_korean:
  - 널판
  - 판자
  lexicon: HALOT
  rationale: 이 단어는 단순한 널판이 아니라 성막의 수직 구조 부재를 가리키므로, 기능을 드러내는 '틀'이 가장 적절합니다.
- source_word: יְדֹתָיו
  english_pob_choice: tenons
  chosen_korean: 촉
  alternatives_korean:
  - 장부
  - 돌기
  lexicon: HALOT
  rationale: 목공 구조에서 결합을 위한 돌출부를 가리키는 말이므로 '촉'이 짧고 자연스러우며, '장부'는 전문적이지만 한국어 독자에게는 다소 낯설 수 있습니다.
- source_word: הָאֶחָד ... הָאֶחָד
  english_pob_choice: one frame ... the next frame
  chosen_korean: 한 틀 ... 다음 틀
  alternatives_korean:
  - 그 한 틀 ... 또 한 틀
  - 각 틀 ... 각 틀
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 한국어에서 어색하지 않게 살리기 위해 첫 번째는 '한 틀', 두 번째는 문맥상 '다음 틀'로 옮겼습니다.
