translation:
  language: ko
  text: 그리고 장막 뒤쪽의 두 모퉁이를 위한 널빤지 두 개를 만드십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “장막의 모퉁이 부분들을 위한 것, 곧 뒤쪽의 두 부분에 있는 것”으로 옮길 수 있습니다. 여기의 히브리어 표현은 건축 용어로서 다소 전문적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵ֤י
  english_pob_choice: And ... two
  chosen_korean: 그리고 ... 두
  alternatives_korean:
  - 또 ... 두
  - 그리고 두
  lexicon: HALOT
  rationale: 연결 접속사와 수량 표현을 자연스럽게 살려, 제작 항목을 이어 주는 지시문 어조를 유지했습니다.
- source_word: קְרָשִׁים
  english_pob_choice: boards
  chosen_korean: 널빤지
  alternatives_korean:
  - 판자
  - 판
  lexicon: HALOT
  rationale: 성막 구조재를 가리키는 말로서, 현대 한국어에서는 '널빤지'가 크기와 용도를 무난하게 드러냅니다.
- source_word: לִ/מְקֻצְעֹ֖ת
  english_pob_choice: for the corners
  chosen_korean: 양 모퉁이를 위한
  alternatives_korean:
  - 모퉁이를 위한
  - 모서리를 위한
  lexicon: HALOT
  rationale: 건축 용례의 'corner'를 자연스럽게 옮기되, 뒤의 '뒤쪽'과 함께 성막의 후면 양 끝 모퉁이를 분명히 하도록 했습니다.
- source_word: בַּ/יַּרְכָתָֽיִם
  english_pob_choice: at the rear corners
  chosen_korean: 뒤쪽
  alternatives_korean:
  - 뒤편
  - 후면의
  lexicon: HALOT
  rationale: 히브리어 쌍수형이 가리키는 '뒤쪽/후면'의 뉘앙스를 살리면서, 같은 절의 '모퉁이'와 중복되는 표현은 피했습니다.
