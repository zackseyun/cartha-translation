base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
  footnotes:
  - marker: a
    text: Or 'in the coupling.' The Hebrew term refers to the joined unit formed by coupling curtains together.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 하나의 휘장 가장자리에 고리 쉰 개를 만들되, 곧 서로 연결된 첫 번째 묶음의 바깥쪽 끝 휘장에 달고, 또 서로 연결된 둘째 휘장 가장자리에 고리 쉰 개를 달아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘결합부에’. 히브리어는 서로 맞물려 하나의 단위를 이루는 천의 결합을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  english_pob_choice: And you shall make
  chosen_korean: 너는 … 만들어야 합니다
  alternatives_korean:
  - 만드십시오
  - 만들어야 합니다
  lexicon: HALOT
  rationale: 지시문 맥락의 미래형/명령형 기능을 한국어에서 자연스러운 의무형으로 옮겼습니다.
- source_word: לֻלָאֹת
  english_pob_choice: loops
  chosen_korean: 고리
  alternatives_korean:
  - 루프
  - 고리들
  - 매는 고리
  lexicon: HALOT
  rationale: 성막 구조물의 천 연결 장치를 가리키므로 기능이 드러나는 표준어 ‘고리’를 택했습니다.
- source_word: הָאֶחָת / הַשֵּׁנִית
  english_pob_choice: the one / the second curtain
  chosen_korean: 첫 번째 … 둘째 …
  alternatives_korean:
  - 하나의 … 두 번째 …
  - 첫째 … 둘째 …
  lexicon: HALOT
  rationale: 히브리어의 대조 구조를 살리되, 한국어에서 자연스럽고 도식적인 순서를 드러내기 위해 서수 표현으로 정리했습니다.
- source_word: בַּחֹבָרֶת / הַחֹבֶרֶת
  english_pob_choice: in the set joined together / that is joined to it
  chosen_korean: 서로 연결된 묶음
  alternatives_korean:
  - 연결된 집합
  - 결합된 부분
  - 이어 붙인 한 묶음
  lexicon: HALOT
  rationale: 문맥상 ‘결합/연결된 한 단위’를 뜻하므로, 기술적 의미를 유지하면서도 한국어로는 ‘묶음’이 가장 읽히기 쉽습니다.
theological_decisions:
- issue: 성막 지시문의 기술적 용어를 직역할 것인지, 의미를 풀어쓸 것인지
  chosen_reading: 구조적 의미를 유지하면서도 ‘고리’, ‘서로 연결된 묶음’처럼 기능이 드러나게 옮겼습니다.
  alternative_readings:
  - ‘결합’이라고만 옮겨 더 직역함
  - ‘맞물린 부분’으로 풀어씀
  rationale: 이 구절은 예배 신학보다 제작 지시의 정확성이 핵심이므로, 독자가 실제 구조를 이해할 수 있도록 하되 원문의 결합 관계를 지우지 않았습니다.
  doctrine_reference: 출 26장 성막 제작 지시의 문맥
