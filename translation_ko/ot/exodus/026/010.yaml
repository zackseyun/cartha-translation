revisions:
- from: 그리고 너는 하나의 휘장 가장자리에 고리 쉰 개를 만들되, 곧 서로 연결된 첫 번째 묶음의 바깥쪽 끝 휘장에 달고, 또 서로 연결된 둘째 휘장 가장자리에 고리 쉰 개를 달아야 합니다.[a]
  to: 너는 서로 연결한 첫째 묶음[a]의 끝쪽에 있는 한 휘장 가장자리에 고리 쉰 개를 만들고, 서로 연결한 둘째 묶음에 속한 휘장 가장자리에도 고리 쉰 개를 만들어야 합니다.
