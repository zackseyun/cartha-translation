source:
  edition: WLC
  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
  footnotes:
  - marker: a
    text: Or, more literally, 'the curtain, the one ... the curtain, the one'; Hebrew uses a distributive form to specify the dimensions of each individual curtain.
    reason: lexical_alternative
  - marker: b
    text: Or 'all the curtains shall have the same measure.'
    reason: lexical_alternative
translation:
  language: ko
  text: 각 휘장의 길이는 스물여덟 규빗[a]이고, 각 휘장의 너비는 네 규빗[b]입니다. 모든 휘장은 한 치수여야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 분배적 표현으로 “각 휘장”의 길이를 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “모든 휘장은 같은 치수입니다”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְרִיעָה
  english_pob_choice: curtain
  chosen_korean: 휘장
  alternatives_korean:
  - 커튼
  - 장막
  lexicon: HALOT
  rationale: 성막 문맥에서 יְרִיעָה는 성소를 덮는 직물 덮개를 가리키므로, 한국어 성경에서 널리 쓰이는 ‘휘장’이 가장 자연스럽고 문맥 적합합니다.
- source_word: אֹרֶךְ / רֹחַב
  english_pob_choice: length / width
  chosen_korean: 길이 / 너비
  alternatives_korean:
  - 길 / 폭
  - 장단 / 광협
  lexicon: HALOT
  rationale: 성막 치수 진술의 표준 표현에 맞추어 ‘길이’와 ‘너비’로 옮겨, 측정 정보의 직접성을 유지했습니다.
- source_word: הָאַחַת / הָאֶחָת
  english_pob_choice: each
  chosen_korean: 각
  alternatives_korean:
  - 하나하나의
  - 모든
  lexicon: HALOT
  rationale: 히브리어의 분배적 용법을 한국어에서는 ‘각’으로 자연스럽게 드러내어, 모든 휘장 하나하나에 동일한 치수가 적용됨을 살렸습니다.
- source_word: מִדָּה אַחַת
  english_pob_choice: one measure
  chosen_korean: 한 치수
  alternatives_korean:
  - 같은 치수
  - 한 가지 규격
  lexicon: HALOT
  rationale: 직역성을 유지하면서도 한국어에서 치수 통일을 분명히 전달할 수 있도록 ‘한 치수’로 옮겼습니다.
