  source_fidelity: 마지막 구절은 히브리어의 명사절(‘모든 휘장에 한 치수’)로, 휘장들이 동일한 치수임을 진술합니다. 초안의 ‘한 치수여야 합니다’는 의무의 뉘앙스를 추가하므로 이를 피하는 것이 좋습니다. 나머지 치수와 분배적 ‘각’의 번역은 원문에 충실합니다.
  naturalness: ‘각 휘장의 길이 … 너비’는 현대 표준 한국어의 치수 서술로 자연스럽습니다. 각주 표지는 설명하는 표현 바로 뒤에 두어 참조 관계를 분명히 했습니다.
