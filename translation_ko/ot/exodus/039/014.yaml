id: EXO.39.14
reference: Exodus 39:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/הָ/אֲבָנִים עַל שְׁמֹ֨ת בְּנֵי יִשְׂרָאֵ֥ל הֵ֛נָּה שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ לִ/שְׁנֵ֥ים עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
  footnotes:
  - marker: a
    text: Or 'bearing the names of the sons of Israel.' The Hebrew preposition can express close association or correspondence.
    reason: lexical_alternative
  - marker: b
    text: Or 'engravings of a seal' / 'signet engravings.' The phrase refers to the manner of carving, like seal-cut inscriptions.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'sons of Israel,' a traditional covenantal designation for the people descended from Israel.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그 돌들은 이스라엘 자손의 이름에 따라 있었으니, 곧 열두 개였으며, 각 돌은 마치 인장 새김같이 새겨져 있어서, 열두 지파를 위하여 각각 자기 이름을 지니고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 전통적 언약 명칭으로, 단순한 민족 호칭을 넘어서는 공동체적 의미를 지닙니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘인장의 새김들’ 또는 ‘도장 새김들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  english_pob_choice: And the stones
  chosen_korean: 그리고 그 돌들은
  alternatives_korean:
  - 그리고 돌들은
  - 그 돌들은
  lexicon: HALOT
  rationale: 지시적 정관성과 문맥상 특정 돌들을 가리키는 점을 살려 ‘그 돌들’로 옮겼고, 문두의 연결을 위해 ‘그리고’를 붙였습니다.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: according to the names of the sons of Israel
  chosen_korean: 이스라엘 자손의 이름에 따라
  alternatives_korean:
  - 이스라엘 자손의 이름을 따라
  - 이스라엘 자손의 이름과 대응하여
  lexicon: HALOT
  rationale: עַל이 단순한 위치가 아니라 대응/부합의 관계를 나타내므로, POB의 audit trail을 따라 ‘~에 따라’로 옮겨 반복 구조를 살렸습니다.
- source_word: פִּתּוּחֵי חֹתָם
  english_pob_choice: engraved like a signet
  chosen_korean: 마치 인장 새김같이 새겨져
  alternatives_korean:
  - 인장처럼 새겨져
  - 도장 새김처럼 새겨져
  lexicon: HALOT
  rationale: 문구가 새김의 방식(인장/도장 새김)을 가리키므로, 의미를 풀어 ‘인장 새김같이’로 옮겨 조각 양식을 드러냈습니다.
- source_word: אִישׁ עַל שְׁמוֹ
  english_pob_choice: each according to its name
  chosen_korean: 각각 자기 이름을 지니고
  alternatives_korean:
  - 각각 그 이름을 따라
  - 각각 자기 이름에 따라
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 살려 ‘각각’으로 처리했고, 한국어에서는 돌을 주어로 삼아 ‘자기 이름을 지니고’가 가장 자연스럽습니다.
theological_decisions:
- issue: “sons of Israel”의 공동체적 호칭 유지
  chosen_reading: ‘이스라엘 자손’으로 직역해 언약 공동체 표지를 보존했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 이 표현은 단순 혈연 집단이 아니라 열두 지파로 대표되는 언약적 공동체를 가리키므로, POB의 문화적 주석을 반영해 직역을 유지했습니다.
  doctrine_reference: 언약 백성의 표지와 대표성
