  text: אֵ֣ת מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת וְ/אֶת מִכְבַּ֤ר הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁר ל֔/וֹ אֶת בַּדָּ֖י/ו וְ/אֶת כָּל כֵּלָ֑י/ו אֶת הַ/כִּיֹּ֖ר וְ/אֶת כַּנּֽ/וֹ׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/039.yaml
  text: the bronze altar[a], and the bronze grating that was for it, its poles, and all its utensils; the basin and its stand[b];
  footnotes:
  - marker: a
    text: Or 'the bronze grate' or 'the bronze network.'
