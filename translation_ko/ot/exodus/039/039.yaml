  rationale: 원문은 특정 제단의 종류를 여기서 다시 풀지 않고 기구 목록을 압축적으로 제시하므로, 과도한 해설보다 원문의 간결성을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 문법 및 성막 기구 용어의 보존 원칙
