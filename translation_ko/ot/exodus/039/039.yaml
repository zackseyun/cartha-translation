translation:
  language: ko
  text: 놋 제단과 그 제단에 딸린 놋 격자, 그 채들, 그리고 그 모든 기구와 물두멍과 그 받침을[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놋 철망’.
    reason: lexical_alternative
  - marker: b
    text: '전통적 영어: ‘물두멍과 그 받침대’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 제사상
  lexicon: HALOT
  rationale: ტაბernacle 문맥의 מִזְבַּח는 제사에 쓰는 제단이므로, 표준적이면서도 현대 한국어에서 자연스러운 ‘제단’으로 옮겼습니다.
- source_word: מִכְבַּר
  english_pob_choice: grating
  chosen_korean: 격자
  alternatives_korean:
  - 그물망
  - 철망
  lexicon: HALOT
  rationale: 알타르에 붙는 lattice 구조를 가리키므로, POB의 ‘grating’에 대응하는 말로 기능을 드러내는 ‘격자’를 선택했습니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles
  chosen_korean: 그 채들
  alternatives_korean:
  - 그 운반 막대들
  - 그 막대들
  lexicon: HALOT
  rationale: 성막 기구를 운반하는 막대를 가리키며, ‘채’는 전통 성경 어휘이면서도 현대어에서 이해 가능한 표현입니다.
- source_word: כִּיֹּר / כַּנּוֹ
  english_pob_choice: the basin and its stand
  chosen_korean: 물두멍과 그 받침
  alternatives_korean:
  - 대야와 그 받침
  - 세숫대야와 그 받침
  lexicon: HALOT
  rationale: 전통적 성막 용어인 ‘물두멍’을 유지해 기능과 문맥을 분명히 하고, כַּנּוֹ는 물두멍의 지지 구조이므로 ‘받침’으로 옮겼습니다.
theological_decisions:
- issue: 성막 기구 목록의 단순 나열을 어떻게 처리할지
  chosen_reading: 히브리어의 열거 구조를 그대로 따라, 설명을 덧붙이지 않고 항목별로 나열했습니다.
  alternative_readings:
  - 문맥을 풀어 ‘번제단’으로 구체화하는 방식
  - 설명어를 추가해 기능을 부연하는 방식
  rationale: 원문은 특정 제단의 종류를 여기서 다시 풀지 않고 기구 목록을 압축적으로 제시하므로, 과도한 해설보다 원문의 간결성을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 문법 및 성막 기구 용어의 보존 원칙
