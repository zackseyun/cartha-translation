lexical_decisions:
- source_word: הַשֻּׁלְחָן
  english_pob_choice: the table
  chosen_korean: 그 상
  alternatives_korean:
  - 그 식탁
  - 그 표
  lexicon: HALOT
  rationale: 히브리어 שֻׁלְחָן은 기본적으로 ‘상/table’을 뜻하므로, 문맥상 성막 기구를 가리키는 일반 명사 ‘상’으로 옮겼습니다. ‘진설병 상’처럼 설명을 덧붙이면 원문에 없는 해설이 들어갑니다.
- source_word: כָּל כֵּלָיו
  english_pob_choice: all its utensils
  chosen_korean: 그 모든 기구
  alternatives_korean:
  - 그 모든 용기
  - 그 모든 물건
  lexicon: HALOT
  rationale: כֵּלִים은 제의 문맥에서 상에 딸린 도구·기구를 포괄하므로, 현대 한국어에서 자연스럽고 구체적인 ‘기구’가 적절합니다. ‘용기’는 의미가 좁아지고, ‘물건’은 너무 일반적입니다.
- source_word: לֶחֶם הַפָּנִים
  english_pob_choice: the bread of the Presence
  chosen_korean: 진설병
  alternatives_korean:
  - 현존의 빵
  - 임재의 빵
  - 그 빵
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘얼굴/임재의 빵’이지만, 한국어 성경 전통과 제의 용례를 고려할 때 ‘진설병’이 가장 알아보기 쉽고 기능을 정확히 드러냅니다. 다만 영어 POB의 ‘bread of the Presence’가 가진 투명성은 주석에서 보완할 수 있습니다.
theological_decisions:
- issue: 성막 제의 용어의 번역 투명성 vs. 한국어 교회 전통
  chosen_reading: 전통적 용어인 ‘진설병’을 쓰되, 원문의 제의적 의미를 훼손하지 않도록 간결하게 유지했습니다.
  alternative_readings:
  - ‘임재의 빵’처럼 직역하기
  - ‘showbread’에 해당하는 낯선 음역/설명형 표현 쓰기
  rationale: 이 구절은 목록형 진술이라 과도한 설명을 넣으면 리듬이 깨집니다. 동시에 ‘진설병’은 한국어 성경에서 축적된 수용 이력이 있어 독자가 대상 기물을 즉시 식별할 수 있습니다.
  doctrine_reference: 성막과 제사 제도에 대한 성경 내 용례(출 25:30; 레 24:5-9)
