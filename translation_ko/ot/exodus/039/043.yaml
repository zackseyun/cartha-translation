  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: ko
  text: 모세는 그 모든 일을 보고, 보니 그들이 야훼께서 명령하신 그대로 행하였으므로, 모세가 그들을 축복하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 모든 일’은 히브리어 מְלָאכָה의 넓은 뜻을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 살펴보고
  - 검사하고
  lexicon: HALOT
  rationale: רא의 기본 의미를 살려 자연스럽게 ‘보다’로 옮기되, 뒤이어 나오는 결과절이 평가를 담도록 했습니다.
- source_word: כָּל הַמְּלָאכָה
  english_pob_choice: all the work
  chosen_korean: 그 모든 일
  alternatives_korean:
  - 그 모든 작업
  - 그 모든 일거리
  lexicon: HALOT
  rationale: 출애굽기 성막 제작 맥락에서 מְלָאכָה는 단순한 노동보다 완성된 ‘일/작업’ 전체를 가리키므로, 현대 한국어에서 가장 자연스러운 ‘그 모든 일’로 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보니
  alternatives_korean:
  - 보라
  - 참으로
  lexicon: HALOT
  rationale: 주의 환기와 발견의 뉘앙스를 간결하게 살리기 위해 서술형 전환인 ‘보니’를 택했습니다.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה כֵּן עָשׂוּ
  english_pob_choice: just as Yahweh had commanded, so they had done it
  chosen_korean: 야훼께서 명령하신 그대로 행하였으므로
  alternatives_korean:
  - 야훼께서 명령하신 대로 그렇게 하였으므로
  - 야훼께서 명령하신 바와 같이 그대로 하였으므로
  lexicon: HALOT
  rationale: 반복된 עשה의 강조는 한국어에서 ‘명령하신 그대로 행하다’로 압축해 보존했고, יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיְבָרֶךְ אֹתָם
  english_pob_choice: And Moses blessed them
  chosen_korean: 모세가 그들을 축복하였습니다
  alternatives_korean:
  - 모세가 그들에게 복을 빌어 주었습니다
  - 모세가 그들을 축복했습니다
  lexicon: HALOT
  rationale: ברך의 기본 의미를 직역해 ‘축복하다’로 유지하여, 모세가 말한 축복 행위를 그대로 드러냈습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: יהוה는 문맥에 따라 ‘야훼’로 일관되게 표기했습니다.
  alternative_readings:
  - the LORD
  - 여호와
  rationale: 히브리어 본문에 직접 יְהוָה가 나오므로, 번역문에서 인격적 언약명을 보존하는 것이 본문 가시성과 감사 가능성에 더 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
