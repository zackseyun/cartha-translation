reference: Exodus 39:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֥וּ פַעֲמֹנֵ֖י זָהָ֣ב טָה֑וֹר וַ/יִּתְּנ֨וּ אֶת הַ/פַּֽעֲמֹנִ֜ים בְּ/ת֣וֹךְ הָ/רִמֹּנִ֗ים עַל שׁוּלֵ֤י הַ/מְּעִיל֙ סָבִ֔יב בְּ/ת֖וֹךְ הָ/רִמֹּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
  footnotes:
  - marker: a
    text: Or 'between the pomegranates.' The Hebrew phrase literally means 'in the midst of the pomegranates' and describes the bells' placement relative to the pomegranate ornaments.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 순금으로 방울들을 만들고, 그 방울들을 겉옷의 가장자리에 있는 석류들 사이에, 사방으로 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘석류들 사이에.’ 히브리어 표현은 문자적으로 ‘석류들 한가운데’를 뜻하며, 방울의 위치가 석류 장식들과의 관계 속에서 설명됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  english_pob_choice: bells of pure gold
  chosen_korean: 순금으로 방울들
  alternatives_korean:
  - 순금 방울들
  - 정금으로 만든 방울들
  lexicon: HALOT
  rationale: פַעֲמֹנִים은 방울로 옮기고, זָהָב טָהוֹר는 재료와 순도를 함께 살려 ‘순금으로’로 자연스럽게 표현했습니다.
- source_word: וַיִּתְּנוּ... בְּתוֹךְ הָרִמֹּנִים
  english_pob_choice: they put the bells among the pomegranates
  chosen_korean: 그 방울들을 ... 석류들 사이에
  alternatives_korean:
  - 그 방울들을 석류들 가운데
  - 그 방울들을 석류들 사이사이에
  lexicon: HALOT
  rationale: 문자적으로는 ‘석류들 가운데/한가운데’이지만, 장식 배치의 의미를 살려 ‘사이에’로 옮기되, 반복 구조는 유지했습니다.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  english_pob_choice: on the hem of the robe
  chosen_korean: 겉옷의 가장자리에
  alternatives_korean:
  - 겉옷의 옷단에
  - 겉옷의 끝단에
  lexicon: HALOT
  rationale: שׁוּלִים은 가장자리/옷단을 가리키므로 ‘가장자리’로 옮겼고, מְעִיל은 제사장 겉옷 문맥에 맞게 ‘겉옷’으로 처리했습니다.
- source_word: סָבִיב
  english_pob_choice: all around
  chosen_korean: 사방으로
  alternatives_korean:
  - 둘레에
  - 둘러
  lexicon: HALOT
  rationale: 배치가 둘레 전체를 따라 이루어졌음을 간결하게 드러내는 표현으로 ‘사방으로’를 선택했습니다.
theological_decisions:
- issue: 장식물의 위치를 ‘between’으로 직역할지 ‘among’의 분포 의미로 풀어낼지
  chosen_reading: ‘석류들 사이에’로 옮겨, 방울이 석류 장식들 사이에 배치된 분포를 드러냈습니다.
  alternative_readings:
  - 석류들 가운데
  - 석류들 한가운데
  rationale: 히브리어 반복구는 단순한 위치표시보다 장식 배열의 간격과 배치를 강조하므로, 한국어에서는 ‘사이에’가 의미를 가장 자연스럽게 전달합니다.
  doctrine_reference: 출 39장의 제사장 의복 규례는 상징적 장식 배열을 통해 거룩한 직무의 질서를 드러냅니다.
