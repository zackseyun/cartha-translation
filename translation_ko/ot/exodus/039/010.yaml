    text: 이 세 보석의 정확한 동일시는 확실하지 않습니다. 여기서는 전통적 대응어를 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ בּוֹ
  english_pob_choice: they mounted on it
  chosen_korean: 그들은 그 위에 채워 넣었습니다
  alternatives_korean:
  - 그 안에 채워 넣었습니다
  - 그 위에 달아 놓았습니다
  lexicon: HALOT
  rationale: 동사는 문자적으로는 ‘채우다’이지만, 보석을 흉패에 끼워 넣는 맥락이므로 한국어에서는 ‘채워 넣다’로 옮겨 설정의 의미를 살렸습니다.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  english_pob_choice: four rows of stones
  chosen_korean: 돌 넉 줄
  alternatives_korean:
  - 네 줄의 돌
  - 돌 네 줄
  lexicon: HALOT
  rationale: טוּרֵי는 ‘줄/행’의 뜻이므로 보석 배열의 수량을 자연스럽게 드러내는 ‘돌 넉 줄’로 옮겼습니다.
- source_word: אֹדֶם
  english_pob_choice: ruby
  chosen_korean: 홍옥
  alternatives_korean:
  - 루비
  - 홍보석
  lexicon: HALOT
  rationale: 이 보석명은 정확한 식별이 불확실하므로, 전통적 번역을 따르되 한국어에서 색상과 보석성을 함께 드러내는 ‘홍옥’을 선택했습니다.
- source_word: פִּטְדָה
  english_pob_choice: topaz
  chosen_korean: 황옥
  alternatives_korean:
  - 토파즈
  - 황보석
  lexicon: HALOT
  rationale: 대상 광물의 정확한 동일시는 불확실하지만, 전통 번역 계열을 반영하여 한국어 보석명인 ‘황옥’으로 옮겼습니다.
- source_word: בָרֶקֶת
  english_pob_choice: emerald
  chosen_korean: 녹주옥
  alternatives_korean:
  - 에메랄드
  - 녹옥
  lexicon: HALOT
  rationale: 어원상 빛남을 암시하는 보석명으로, 전통적 대응어인 ‘에메랄드’보다 한국어 성경 문맥에서 덜 혼동되는 ‘녹주옥’을 채택했습니다.
