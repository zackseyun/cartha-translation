id: EXO.39.5
reference: Exodus 39:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/חֵ֨שֶׁב אֲפֻדָּת֜/וֹ אֲשֶׁ֣ר עָלָ֗י/ו מִמֶּ֣/נּוּ הוּא֮ כְּ/מַעֲשֵׂ/הוּ֒ זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
  footnotes:
  - marker: a
    text: Or 'the decorated band of his ephod ... was from it, of the same workmanship.' The Hebrew emphasizes that the band was integral to the ephod and matched its workmanship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 에봇의 짜임새 있는 띠는 그 위에 있었는데, 그것은 그것과 한 덩어리로 만들어졌고 그와 같이 만들었습니다. 곧 금, 청색, 자색, 홍색 실과 가늘게 꼰 베실로 만들었으니, 야훼께서 모세에게 명령하신 그대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 에봇의 장식된 띠는 … 그것에서 나온 것이며, 같은 공정의 것이었습니다.’ 히브리어는 그 띠가 에봇에 본질적으로 붙어 있었고 작업도 같았음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב
  english_pob_choice: skillfully woven band
  chosen_korean: 짜임새 있는 띠
  alternatives_korean:
  - 장식된 띠
  - 짠 띠
  - 정교하게 짠 띠
  lexicon: HALOT
  rationale: 제사장 예복 문맥에서 머리의 ‘생각’이 아니라 에봇에 붙는 직물 띠를 가리키므로, 기능과 공예성을 함께 드러내는 표현을 택했습니다.
- source_word: אֲפֻדָּתוֹ
  english_pob_choice: his ephod
  chosen_korean: 그의 에봇
  alternatives_korean:
  - 그에게 속한 에봇
  - 에봇
  lexicon: HALOT
  rationale: 3인칭 남성 소유 접미사를 자연스럽게 살리되, 한국어로는 가장 직접적인 소유 표현이 문맥에 맞습니다.
- source_word: מִמֶּנּוּ הוּא כְּמַעֲשֵׂהוּ
  english_pob_choice: was of one piece with it and made like it
  chosen_korean: 그것과 한 덩어리로 만들어졌고 그와 같이 만들었습니다
  alternatives_korean:
  - 그것에서 나온 것이었고 그와 같은 공정으로 만들었습니다
  - 그것과 통합되어 있었고 같은 방식으로 만들었습니다
  lexicon: HALOT
  rationale: 히브리어는 띠가 에봇과 분리된 부품이 아니라 구조적으로 일체였고 작업도 같았음을 강조하므로, ‘한 덩어리로’와 ‘그와 같이’로 그 긴장을 보존했습니다.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  english_pob_choice: just as Yahweh had commanded Moses
  chosen_korean: 야훼께서 모세에게 명령하신 그대로였습니다
  alternatives_korean:
  - 야훼께서 모세에게 명령하신 대로였습니다
  - 주께서 모세에게 명령하신 대로였습니다
  lexicon: HALOT
  rationale: 본문의 신명기적 언약 이름을 살려 ‘야훼’로 옮기고, 완성 보고 공식의 순응성을 한국어 관용에 맞게 표현했습니다.
theological_decisions:
- issue: 에봇 띠의 구조적 일체성 표현
  chosen_reading: ‘그것과 한 덩어리로 만들어졌고’로 에봇과의 분리 불가능성을 드러냈습니다.
  alternative_readings:
  - ‘같은 재질로 만들었습니다’
  - ‘같은 한 조각이었습니다’
  rationale: 영문 POB가 ‘of one piece with it’로 본문의 구조적 강조를 살리고 있으므로, 단순한 재료 일치로 약화하지 않고 일체성을 유지했습니다.
  doctrine_reference: 성막/제사장 의복 본문에서 표상되는 정결성과 질서의 강조
- issue: 야훼의 이름 표기
  chosen_reading: 고유명사 ‘야훼’를 본문에 직접 사용했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 프로젝트 기본값과 영어 POB의 audit trail에 따라 신명기적 언약 이름을 가려버리지 않고 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
