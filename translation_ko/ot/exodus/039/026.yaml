  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פַּעֲמֹ֤ן וְ/רִמֹּן֙ פַּעֲמֹ֣ן וְ/רִמֹּ֔ן עַל שׁוּלֵ֥י הַ/מְּעִ֖יל סָבִ֑יב לְ/שָׁרֵ֕ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'for service' or 'for serving.' The Hebrew infinitive denotes the robe's purpose in priestly ministry.
    reason: lexical_alternative
translation:
  language: ko
  text: 방울과 석류가, 방울과 석류가 예복의 가장자리 사방에 달려 있어, 섬기기 위한 것이었습니다. 야훼께서 모세에게 명령하신 그대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉사하기 위한 것’ 혹은 ‘섬기기 위한 것’입니다. 히브리어 부정사는 예복의 목적을 제사장 직무로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן וְ/רִמֹּן
  english_pob_choice: a bell and a pomegranate
  chosen_korean: 방울과 석류가
  alternatives_korean:
  - 방울 하나와 석류 하나가
  - 금방울과 석류 장식이
  lexicon: HALOT
  rationale: פַּעֲמֹן은 방울, רִמֹּן은 석류라는 기본 뜻을 살리되, 반복 구조를 자연스러운 한국어 나열로 옮겼습니다.
- source_word: שׁוּלֵי הַ/מְּעִיל
  english_pob_choice: the hem of the robe
  chosen_korean: 예복의 가장자리
  alternatives_korean:
  - 예복의 깃단
  - 겉옷의 옷단
  lexicon: HALOT
  rationale: שׁוּלֵי는 옷의 아래쪽 가장자리/단을 뜻하므로 ‘가장자리’로 옮겨 위치를 분명히 했습니다. מְעִיל은 제사장 예복 맥락이므로 ‘예복’이 적절합니다.
- source_word: לְ/שָׁרֵת
  english_pob_choice: for ministering
  chosen_korean: 섬기기 위한 것이었습니다
  alternatives_korean:
  - 봉사하기 위한 것이었습니다
  - 예배드리기 위한 것이었습니다
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사이므로 ‘-기 위한’으로 처리했고, 제사장 직무의 문맥을 반영해 ‘섬기다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사를 번역 대체어가 아닌 음역인 ‘야훼’로 유지해, 하나님의 고유 이름을 보존했습니다.
theological_decisions:
- issue: 제사장 직무 문맥에서 לְשָׁרֵת의 의미
  chosen_reading: ‘섬기기 위한’으로 제사장 봉사의 목적을 드러냈습니다.
  alternative_readings:
  - ‘봉사하기 위한’
  - ‘섬김을 위해’
  rationale: 출애굽기 39장은 성막과 제사장 예복의 제작을 다루므로, 단순한 일반 노동보다 예배적·제의적 봉사를 드러내는 표현이 본문 의도에 더 가깝습니다.
  doctrine_reference: 성막/제사장 직무 문맥
- issue: 야훼의 명령에 대한 순종의 강조
  chosen_reading: ‘야훼께서 모세에게 명령하신 그대로였습니다’로 마무리했습니다.
  alternative_readings:
  - ‘야훼께서 모세에게 명령하신 대로였습니다’
  - ‘...명령하신 바와 같았습니다’
  rationale: 마지막 관용구는 완성된 제작이 계시에 정확히 일치했음을 강조하므로, ‘그대로였습니다’가 순종의 완결성을 자연스럽게 드러냅니다.
  doctrine_reference: 계시-순종 일치
