  terminology: ‘성소’, ‘제사장’, ‘거룩한 옷’은 문맥과 격식에 알맞습니다. הַשְּׂרָד는 의미가 완전히 확정되지 않으므로 ‘정교하게 짠’이라는 절제된 표현을 쓰고, 대안은 각주에 보존하는 것이 안전합니다.
