  source_fidelity: 첫 구의 הַשְּׂרָד를 직조·직물 관련 표현으로 구별하려 한 점과 성소 봉사라는 용례는 적절합니다. 그러나 ‘그의 아들들을 위한 제사장 직분의 옷들’은 לְכַהֵן의 목적, 곧 아들들이 제사장으로 섬기는 행위를 ‘직분의 옷’이라는 명사구로 바꾸어 약화합니다.
