  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת בִּגְדֵ֥י הַ/שְּׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
  footnotes:
  - marker: a
    text: Or 'the garments of service'; the Hebrew expression likely refers to specially made textiles used for ministry in the sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 성소에서 섬기기 위한 직조된 일의 옷과, 제사장 아론을 위한 거룩한 옷과, 그의 아들들을 위한 제사장 직분의 옷들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉사의 옷들’로도 옮길 수 있습니다. 히브리어 표현은 성소에서의 사역을 위해 특별히 만든 직물이라는 뜻을 담고 있을 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  english_pob_choice: the garments of woven work
  chosen_korean: 직조된 일의 옷
  alternatives_korean:
  - 직조된 옷
  - 섬김의 옷
  - 봉사의 옷
  lexicon: HALOT
  rationale: הַשְּׂרָד는 단순한 ‘옷’보다 성막 봉사용으로 따로 마련된 직조된 의복을 가리키므로, POB의 ‘woven work’에 맞춰 재료와 용도를 함께 드러냈습니다.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  english_pob_choice: for ministering in the sanctuary
  chosen_korean: 성소에서 섬기기 위한
  alternatives_korean:
  - 거룩한 곳에서 봉사하기 위한
  - 성소 안에서 봉사하기 위한
  - 성소에서 시중들기 위한
  lexicon: HALOT
  rationale: שׁרת는 제의적 봉사를 뜻하므로 ‘섬기기’로 살리고, בַּקֹּדֶשׁ는 추상적 ‘거룩함’보다 성막의 예배 공간인 ‘성소’로 옮겼습니다.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  english_pob_choice: the holy garments
  chosen_korean: 거룩한 옷
  alternatives_korean:
  - 성스러운 옷
  - 성소의 옷
  - 거룩한 제의복
  lexicon: HALOT
  rationale: אַהֲרֹן과 그 아들들의 제사장 복장은 표준적으로 ‘거룩한 옷’이라 할 수 있어, 직역하면서도 한국어에서 자연스럽게 유지했습니다.
- source_word: לְכַהֵן
  english_pob_choice: for serving as priests
  chosen_korean: 제사장 직분의 옷
  alternatives_korean:
  - 제사장으로 섬기기 위한 옷
  - 제사장으로 봉사하기 위한 옷
  - 제사장으로 일하기 위한 옷
  lexicon: HALOT
  rationale: כּהן의 동사형은 제사장으로 기능한다는 뜻이므로, ‘제사장 직분’으로 옮겨 아론의 아들들이 수행하는 제의적 역할을 분명히 했습니다.
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד와 בִּגְדֵי הַקֹּדֶשׁ의 구분
  chosen_reading: 첫 구를 성막 봉사용의 직조된 일의 옷으로, 둘째 구를 아론을 위한 거룩한 옷으로 구분해 옮겼습니다.
  alternative_readings:
  - 두 구를 거의 동의어로 보고 모두 ‘봉사의 옷’으로 평탄화하는 번역
  rationale: 히브리어는 두 표현을 나란히 두어 기능상 구분을 암시하므로, POB의 audit trail을 따라 반복을 살리면서도 과도하게 해석하지 않았습니다.
  doctrine_reference: 출애굽기 39장 성막/제사장 복장 규정
