  text: כְּתֵפֹ֥ת עָֽשׂוּ ל֖/וֹ חֹבְרֹ֑ת עַל שְׁנֵ֥י קצוות/ו חֻבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/004.yaml
  text: They made for it shoulder pieces[a], joined to it; at its two ends it was joined.
  footnotes:
  - marker: a
    text: Or 'shoulder straps.' The Hebrew term refers to the parts of the ephod that lay on the shoulders and connected its sections.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그에게 어깨받침을 만들어, 양쪽 끝에 그것을 붙였습니다. 그것은 양쪽 끝에 붙어 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֵפֹת
  english_pob_choice: shoulder pieces
  chosen_korean: 어깨받침
  alternatives_korean:
  - 어깨끈
  - 어깨 조각
  - 어깨 부분
  lexicon: HALOT
  rationale: 성막 의복 문맥에서 단순한 ‘끈’보다 어깨에 놓여 구조를 받치는 부위를 가리키므로, 기능과 형상을 함께 살린 ‘어깨받침’으로 옮겼습니다.
- source_word: חֹבְרֹת
  english_pob_choice: joined to it
  chosen_korean: 붙였습니다
  alternatives_korean:
  - 연결했습니다
  - 결합했습니다
  - 붙어 있었습니다
  lexicon: HALOT
  rationale: ‘연결되다/붙다’의 의미를 자연스러운 현대 한국어 동사로 풀어, 뒤의 반복 표현과 함께 결속의 상태를 분명히 했습니다.
- source_word: שְׁנֵי קצוותו
  english_pob_choice: its two ends
  chosen_korean: 양쪽 끝
  alternatives_korean:
  - 두 끝
  - 두 끝부분
  - 양 끝
  lexicon: HALOT
  rationale: 옷감이나 의복 구조를 말할 때 한국어에서는 ‘양쪽 끝’이 가장 자연스럽고, ‘두 끝’보다 위치 관계가 분명합니다.
- source_word: חֻבָּר
  english_pob_choice: it was joined
  chosen_korean: 붙어 있었습니다
  alternatives_korean:
  - 연결되어 있었습니다
  - 결합되어 있었습니다
  - 붙여졌습니다
  lexicon: HALOT
  rationale: 수동형의 상태를 살리면서 앞의 ‘붙였습니다’와 어근 반복의 연결성을 유지하기 위해 ‘붙어 있었습니다’로 옮겼습니다.
