  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
  footnotes:
  - marker: a
    text: Or 'the lamps set in order.' The Hebrew phrase נֵרֹת הַמַּעֲרָכָה emphasizes the prescribed arrangement of the lamps.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 순결한 등잔대와 그 등잔들 — 곧 정해진 순서대로 놓인 등잔들과 그 모든 기구들, 그리고 불을 밝히는 기름입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정해진 순서대로 놓인 등잔들’. 히브리어 נֵרֹת הַמַּעֲרָכָה는 등잔의 규정된 배치를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרָה הַטְּהֹרָה
  english_pob_choice: the pure lampstand
  chosen_korean: 그 순결한 등잔대
  alternatives_korean:
  - 순결한 촛대
  - 깨끗한 등잔대
  - 정결한 등잔대
  lexicon: HALOT
  rationale: מְנוֹרָה는 개별 등불이 아니라 등잔을 받치는 기구이므로 ‘등잔대’가 적절합니다. טָהוֹר는 성막 기구의 의식적 순결을 가리키므로 ‘순결한’이 가장 직접적입니다.
- source_word: נֵרֹתֶיהָ
  english_pob_choice: its lamps
  chosen_korean: 그 등잔들
  alternatives_korean:
  - 그 불등들
  - 그 등불들
  lexicon: HALOT
  rationale: 문맥이 성막 기구 목록이므로 각 개별 광원을 가리키는 ‘등잔들’이 자연스럽고, 소유 관계도 ‘그’로 보존했습니다.
- source_word: נֵרֹת הַמַּעֲרָכָה
  english_pob_choice: the lamps set in order
  chosen_korean: 정해진 순서대로 놓인 등잔들
  alternatives_korean:
  - 배열된 등잔들
  - 정돈된 등잔들
  - 질서 있게 놓인 등잔들
  lexicon: HALOT
  rationale: מַעֲרָכָה는 단순한 배열보다 규정된 질서와 배치를 나타내므로, POB의 의미를 살려 ‘정해진 순서대로 놓인’으로 옮겼습니다.
- source_word: כֵּלֶיהָ
  english_pob_choice: all its utensils
  chosen_korean: 그 모든 기구들
  alternatives_korean:
  - 그 모든 도구들
  - 그 모든 집기들
  - 그 모든 기물들
  lexicon: HALOT
  rationale: כְּלִי는 성막 맥락에서 각종 기구·도구를 포괄하므로, 현대 한국어에서 가장 무난한 ‘기구들’로 처리했습니다.
- source_word: שֶׁמֶן הַמָּאוֹר
  english_pob_choice: the oil for the light
  chosen_korean: 불을 밝히는 기름
  alternatives_korean:
  - 등불을 위한 기름
  - 조명을 위한 기름
  - 등잔 기름
  lexicon: HALOT
  rationale: 직역형인 ‘빛의 기름’보다 용도를 분명히 하는 ‘불을 밝히는 기름’이 성막 재고 목록의 의미를 더 잘 드러냅니다.
theological_decisions:
- issue: 성막 목록의 문체
  chosen_reading: 물품 목록의 열거 형식을 살려 서술어를 최소화하고 명사구 중심으로 옮겼습니다.
  alternative_readings:
  - 완전한 문장형으로 풀어 쓰는 방식
  - 더 설명적인 번역
  rationale: 히브리어 원문은 전형적인 목록 문장으로, 한국어에서도 열거 구조를 유지하는 것이 원문의 기능과 호흡을 보존합니다.
  doctrine_reference: 출애굽기 39장 성막 기구 완성 보고의 문맥
