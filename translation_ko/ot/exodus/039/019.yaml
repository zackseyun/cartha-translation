  text: וַֽ/יַּעֲשׂ֗וּ שְׁתֵּי֙ טַבְּעֹ֣ת זָהָ֔ב וַ/יָּשִׂ֕ימוּ עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/019.yaml
  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
  footnotes:
  - marker: a
    text: Or 'which faced the ephod' or 'which was opposite the ephod.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'inward' (literally, 'houseward'), indicating the side of the breastpiece toward the ephod.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 금 고리 두 개를 만들어 흉패의 두 끝, 에봇 쪽 안쪽[b]에 있는 그 가장자리[a]에 달았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에봇과 마주 보는 가장자리’ 또는 ‘에봇 반대편의 가장자리’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘집 쪽으로’이며, 여기서는 흉패에서 에봇을 향한 안쪽을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  english_pob_choice: gold rings
  chosen_korean: 금 고리
  alternatives_korean:
  - 황금 고리
  - 금반지
  lexicon: HALOT
  rationale: טַבַּעַת은 장식용 반지/고리를 뜻하므로, 제사장 의복의 고정 장치라는 문맥에는 ‘고리’가 가장 자연스럽고, 재료는 ‘금’으로 간명하게 살렸습니다.
- source_word: הַחֹשֶׁן
  english_pob_choice: the breastpiece
  chosen_korean: 흉패
  alternatives_korean:
  - 가슴받이
  - 가슴패
  lexicon: HALOT
  rationale: 제사장 복식의 전문 용어로는 전통적이면서도 기능을 오해시키지 않는 ‘흉패’가 적절합니다. ‘breastplate’처럼 갑옷 이미지를 강하게 주는 표현은 피했습니다.
- source_word: שְׂפָתוֹ
  english_pob_choice: its edge
  chosen_korean: 가장자리
  alternatives_korean:
  - 테두리
  - 가장 끝
  lexicon: HALOT
  rationale: שָׂפָה는 문자적으로 ‘입술/가장자리’이지만, 제작 지시문에서는 물체의 경계를 뜻하므로 ‘가장자리’가 가장 자연스럽습니다.
- source_word: אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  english_pob_choice: on the inner side toward the ephod
  chosen_korean: 에봇을 향한 안쪽
  alternatives_korean:
  - 에봇 쪽의 안면
  - 에봇과 맞닿는 안쪽
  - 에봇 쪽 안쪽
  lexicon: HALOT
  rationale: עֵבֶר와 בָּיְתָה는 흉패의 에봇 쪽 면을 가리키므로, ‘에봇을 향한 안쪽’으로 옮겨 방향 관계를 분명히 했습니다.
