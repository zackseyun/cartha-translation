reference: Exodus 39:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מְעִ֥יל הָ/אֵפֹ֖ד מַעֲשֵׂ֣ה אֹרֵ֑ג כְּלִ֖יל תְּכֵֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/022.yaml
  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
  footnotes:
  - marker: a
    text: Or 'woven work.' The Hebrew literally reads 'work of a weaver.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'blue yarn' refers to a prized blue dyed textile material used in the tabernacle and priestly garments.
    reason: cultural_note
translation:
  language: ko
  text: 그는 에봇의 겉옷을 짰는데, 직조공의 솜씨로 만든 것이며, 온통 파란색이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעִיל הָאֵפֹד
  english_pob_choice: the robe of the ephod
  chosen_korean: 에봇의 겉옷
  alternatives_korean:
  - 에봇의 로브
  - 에봇의 망토
  lexicon: HALOT
  rationale: מְעִיל은 제사장 복식 문맥에서 겉에 걸치는 옷을 가리키므로, 한국어로는 기능을 드러내는 ‘겉옷’이 가장 자연스럽습니다. הָאֵפֹד는 기술 용어이므로 ‘에봇’으로 옮겨 관계를 살렸습니다.
- source_word: מַעֲשֵׂה אֹרֵג
  english_pob_choice: the work of a weaver
  chosen_korean: 직조공의 솜씨로 만든 것
  alternatives_korean:
  - 직조공의 일
  - 짠 작품
  lexicon: HALOT
  rationale: 직역하면 ‘직조공의 일/작품’이지만, 한국어에서는 공예품의 제작 방식을 드러내는 ‘솜씨로 만든 것’이 자연스럽고, 동시에 원문의 수공예 뉘앙스를 보존합니다.
- source_word: תְּכֵלֶת
  english_pob_choice: blue
  chosen_korean: 파란색
  alternatives_korean:
  - 푸른색
  - 청색
  lexicon: HALOT
  rationale: פּ/תְּכֵלֶת은 성막과 제사장 복식에 쓰인 값진 푸른 염색 천을 가리키지만, 이 절에서는 색의 총체성을 말하므로 ‘온통 파란색’으로 옮겨 재료의 반복을 피했습니다.
- source_word: כְּלִיל
  english_pob_choice: all of
  chosen_korean: 온통
  alternatives_korean:
  - 전부
  - 완전히
  lexicon: HALOT
  rationale: כְּלִיל은 ‘전체가 그러함’이라는 의미이므로, 의복 묘사에서 자연스러운 ‘온통’이 전체성을 간결하게 전달합니다.
