  source_fidelity: 원문의 주동사 וַיַּעַשׂ는 ‘만들었습니다’이며, 현 번역의 ‘짰는데’는 직조 행위로 범위를 좁힙니다. מַעֲשֵׂה אֹרֵג는 겉옷이 직조공의 작업, 곧 짠 작품임을 나타내므로 이를 직접 수식하도록 옮기는 것이 더 충실합니다. כְּלִיל תְּכֵלֶת는 옷 전체가 청색 직물로 이루어졌다는 뜻을 보존했습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽게 문장을 재구성했습니다. ‘직조공의 솜씨로 만든 것이며’는 앞의 ‘짰는데’와 결합될 때 서술 관계가 부자연스럽고 의미가 중복되므로, 관형절로 정리했습니다.
  terminology: ‘에봇’은 제사장 복식의 기술 용어로 유지했습니다. מְעִיל은 ‘겉옷’으로, תְּכֵלֶת은 문맥상 염색된 직물 재료를 드러내는 ‘청색 실’로 옮겼습니다. ‘청색’은 제의 복식 문맥에서 ‘파란색’보다 다소 더 적절하고 격식 있는 표현입니다.
