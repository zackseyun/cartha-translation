  rationale: 원문의 순차적 서술 주동사 ‘만들었습니다’를 회복하고, ‘직조공의 작품’을 ‘직조공이 짠’으로 자연스럽게 반영했습니다. תְּכֵלֶת가 단순한 추상 색상뿐 아니라 제의용 염색 직물을 가리키는 문맥을 고려하여 ‘청색 실로 된’으로 표현했으며, 옷 전체성을 ‘온통’으로 보존했습니다.
