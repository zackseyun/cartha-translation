language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פִֽי הַ/מְּעִ֥יל בְּ/תוֹכ֖/וֹ כְּ/פִ֣י תַחְרָ֑א שָׂפָ֥ה לְ/פִ֛י/ו סָבִ֖יב לֹ֥א יִקָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
  footnotes:
  - marker: a
    text: Or 'like the opening of armor' or 'like the opening of a cuirass'; the Hebrew term תַּחְרָא is rare and denotes a protective armored garment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 겉옷의 목둘레는 그 한가운데에 있었고, 갑옷의 목둘레처럼 주위를 둘러 감싼 가장자리로 하여 찢어지지 않게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갑옷의 목둘레처럼’, ‘흉갑의 목둘레처럼’. 히브리어 תַּחְרָא는 희귀어로, 방어구를 가리키는 말로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי הַמְּעִיל
  english_pob_choice: the opening of the robe
  chosen_korean: 그 겉옷의 목둘레
  alternatives_korean:
  - 그 로브의 열림
  - 그 옷의 입구
  - 그 겉옷의 구멍
  lexicon: HALOT
  rationale: 의복 문맥에서 פִי는 문자적 ‘입’보다 ‘목둘레/목구멍’에 가까운 개념이므로, 한국어에서는 자연스럽고 기능적으로 분명한 ‘목둘레’로 옮겼습니다.
- source_word: בְּתוֹכֹו
  english_pob_choice: in the middle of it
  chosen_korean: 그 한가운데에
  alternatives_korean:
  - 그 안에
  - 그 속에
  - 가운데에
  lexicon: HALOT
  rationale: 열림이 옷의 중앙에 놓였다는 공간적 의미를 분명히 드러내기 위해 ‘한가운데에’로 옮겼습니다.
- source_word: כְּפִי תַחְרָא
  english_pob_choice: like the opening of a coat of mail
  chosen_korean: 갑옷의 목둘레처럼
  alternatives_korean:
  - 갑옷의 입구처럼
  - 갑옷의 목구멍처럼
  - 흉갑의 목둘레처럼
  lexicon: HALOT
  rationale: תַּחְרָא의 희귀하고 방어구적인 뉘앙스를 살리되, 한국어 독자가 이해하기 쉬운 ‘갑옷’으로 풀어 비교를 유지했습니다.
- source_word: לֹא יִקָּרֵעַ
  english_pob_choice: so that it would not be torn
  chosen_korean: 찢어지지 않게 하였습니다
  alternatives_korean:
  - 찢어지지 않도록 하였습니다
  - 찢기지 않게 하였습니다
  - 찢어지지 않게 되도록 하였습니다
  lexicon: HALOT
  rationale: 부정 목적/결과를 한국어 목적 표현으로 자연스럽게 살려, 보강된 둘레의 기능이 ‘찢어짐 방지’임을 드러냈습니다.
theological_decisions:
- issue: 성막 제사장의 의복 묘사에서 직역성과 가독성의 균형
  chosen_reading: ‘겉옷’, ‘목둘레’, ‘갑옷’처럼 기능이 드러나는 현대어로 옮기되, 강화된 목둘레라는 구조는 유지했습니다.
  alternative_readings:
  - ‘로브’, ‘열림’, ‘흉갑’처럼 보다 원어형에 가까운 표현
  rationale: 이 절은 신학적 난제보다 공예·의복 묘사가 중심이므로, 독자가 즉시 구조를 이해할 수 있도록 기능 중심 번역을 택했습니다.
  doctrine_reference: 출애굽기 39장 제사장 예복 규정
- issue: תַּחְרָא의 희귀어 처리
  chosen_reading: 희귀한 방어구 용어의 의미를 살려 ‘갑옷’으로 번역했습니다.
  alternative_readings:
  - ‘코트 오브 메일’의 음역적 처리
  - ‘흉갑’
  rationale: 본문의 비교 대상이 단순한 옷이 아니라 보강된 보호구라는 점을 보존해야 하므로, 일반 독자에게도 통하는 ‘갑옷’을 선택했습니다.
  doctrine_reference: 출애굽기 28:32; 39:23
