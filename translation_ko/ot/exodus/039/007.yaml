  source_fidelity: 첫 문장은 배치 행위와 기념 돌의 기능을 대체로 충실히 옮겼습니다. 그러나 ‘야훼께서 모세에게 명령하신 그대로였습니다’는 원문의 비교절이 ‘그가 두었다’는 행위를 수식하는 구조를 독립 서술로 약화시킵니다. ‘명령하신 대로 … 두었습니다’로 결속하는 편이 원문에 더 정확합니다.
  naturalness: ‘에봇의 어깨받이들 위에’와 ‘기념 돌들로’는 제의복의 두 어깨 부분 및 두 돌을 자연스럽게 드러냅니다. 한 문장 안에서 명령과 실행의 관계를 연결하면 현대 문어체 합쇼체로도 매끄럽습니다.
  terminology: ‘에봇’, ‘야훼’, ‘이스라엘 자손’은 프로젝트 용례 및 히브리어의 고정 표현에 부합합니다. ‘기념 돌들’은 אַבְנֵי זִכָּרוֹן의 복수와 기념 기능을 보존합니다.
  issues:
