  text: 그는 야훼께서 모세에게 명령하신 대로, 그것들을 에봇의 어깨받이들 위에 이스라엘 자손을 위한 기념 돌들로 두었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘기억/기념의 돌들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘이스라엘 자손’은 이스라엘 백성을 가리키는 표준적 표현입니다.
    reason: lexical_alternative
