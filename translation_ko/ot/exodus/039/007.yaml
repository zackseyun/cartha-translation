  rationale: 본문이 단순한 일반 호칭이 아니라 언약적 고유명 사용이므로, 전통적 대체어보다 स्रोत-직접 표기를 유지하는 것이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘이스라엘 자손’의 성별-정확 표현
  chosen_reading: 이스라엘 자손
  alternative_readings:
