    issue: 명령에 따른 행위라는 비교절의 연결이 약화됨
    rationale: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה는 그가 돌들을 둔 행위가 야훼의 모세에 대한 명령에 일치했음을 나타냅니다. 독립적인 ‘그대로였습니다’보다 ‘명령하신 대로 … 두었습니다’가 이 관계를 직접 보존합니다.
