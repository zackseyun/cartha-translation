translation:
  language: ko
  text: 그는 그것들을 에봇의 어깨받이에, 이스라엘 자손을 위한 기념 돌로 두었습니다[a][b]. 야훼께서 모세에게 명령하신 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘기억/기념의 돌들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘이스라엘 자손’은 이스라엘 백성을 가리키는 표준적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: And he set
  chosen_korean: 그는 … 두었습니다
  alternatives_korean:
  - 그는 … 놓았습니다
  - 그는 … 두었습니다
  lexicon: HALOT
  rationale: 제작·배치 문맥에서 שׂוּם의 기본 의미를 자연스럽게 살리되, 현대 한국어에서 구어체가 아닌 서술문으로 읽히도록 ‘두었습니다’를 택했습니다.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  english_pob_choice: on the shoulder pieces of the ephod
  chosen_korean: 에봇의 어깨받이에
  alternatives_korean:
  - 에봇의 어깨 부분에
  - 에봇의 어깨끈에
  lexicon: HALOT
  rationale: כָּתֵף는 단순한 ‘어깨’보다 의복 구조상의 부착 부분을 가리키므로, 성막 제의복 문맥에 맞는 ‘어깨받이’로 옮겼습니다.
- source_word: אַבְנֵי זִכָּרוֹן
  english_pob_choice: as memorial stones
  chosen_korean: 기념 돌로
  alternatives_korean:
  - 기억의 돌로
  - 기념석으로
  lexicon: HALOT
  rationale: 직역하면 ‘기억/기념의 돌들’이지만, 한국어에서 기능을 분명히 드러내는 ‘기념 돌’이 가장 자연스럽고 원문의 commemorative 기능을 보존합니다.
- source_word: לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: for the sons of Israel
  chosen_korean: 이스라엘 자손을 위한
  alternatives_korean:
  - 이스라엘의 아들들을 위한
  - 이스라엘 사람들을 위한
  lexicon: HALOT
  rationale: 히브리어 고정 표현 בְּנֵי יִשְׂרָאֵל을 형태상 투명하게 살리면서도 한국어에서 부자연스러운 ‘아들들’을 완화하기 위해 ‘자손’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project glossary
  rationale: 프로젝트 기본 용례에 따라 신명은 ‘야훼’로 옮겨, 본문의 언약적 고유명을 보존했습니다.
theological_decisions:
- issue: 고유 신명 יְהוָה의 표기
  chosen_reading: 야훼
