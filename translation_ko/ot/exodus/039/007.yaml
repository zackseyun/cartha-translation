  - 이스라엘의 자녀들
  rationale: 히브리어의 고정된 남성 복수 표현을 완전히 중립화하지 않고, 본문이 가진 형식적 투명성을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
