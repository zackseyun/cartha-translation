  source_fidelity: 색채 직물, 아론을 위한 거룩한 옷, 그리고 야훼께서 모세에게 명령하신 대로 행하였다는 핵심은 대체로 충실합니다. 그러나 마지막의 “그대로였습니다”는 히브리어의 동사 ‘만들었다’에 걸리는 비교절을 독립적인 서술로 바꾸어, 누가 무엇을 명령대로 했는지가 불분명해집니다. 또한 בַּקֹּדֶשׁ는 성막 전체의 내부라기보다 성소/성역에서의 봉사를 가리키므로 ‘성소에서’가 더 정확합니다.
  naturalness: 합쇼체는 유지되었으나, “야훼께서 모세에게 명령하신 그대로였습니다”는 현대 한국어 문장으로도 지시 대상이 어색합니다. 비교절을 ‘명령하신 대로 만들었습니다’로 앞 문장의 동사에 직접 연결하면 자연스럽고 원문의 구문도 보존됩니다.
  terminology: ‘야훼’, ‘아론’, ‘거룩한 옷’은 적절합니다. בִּגְדֵי שְׂרָד의 의미는 불확실하므로 본문의 ‘정교하게 짠 옷’과 각주의 ‘봉사용 옷’ 가능성을 함께 제시하는 것이 안전합니다. ‘전용 예복’은 원문에 없는 용도·지위를 다소 구체화하므로 피하는 편이 좋습니다.
