base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'garments for service.' The Hebrew expression is specialized and may emphasize either the garments' function in tabernacle service or their finely worked construction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 청색과 자색과 홍색 실로 그들은 성막 안에서 섬기기 위한 정교하게 짠 옷들을 만들었고, 아론을 위한 거룩한 옷들도 만들었습니다. 야훼께서 모세에게 명령하신 그대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 전용 예복의 기능을 가리키거나, 정교하게 짠 직물 자체를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  english_pob_choice: from the blue, the purple, and the scarlet yarn
  chosen_korean: 청색과 자색과 홍색 실
  alternatives_korean:
  - 청색, 자색, 붉은 실
  - 파란색, 보라색, 진홍색 실
  lexicon: HALOT
  rationale: 성막 직물 문맥을 살리면서도 한국어에서 자연스러운 색채·재료 표현으로 옮겼습니다. '실'은 영어 POB의 'yarn'에 대응시키되, 고대 염색 재료의 세부를 과도하게 특정하지 않았습니다.
- source_word: בִגְדֵי שְׂרָד
  english_pob_choice: finely woven garments
  chosen_korean: 정교하게 짠 옷들
  alternatives_korean:
  - 섬김을 위한 옷들
  - 봉사 لباس
  - 직조한 옷들
  lexicon: HALOT
  rationale: שְׂרָד의 정확한 의미가 논쟁적이므로, POB가 반영한 직물적 뉘앙스를 따라 '정교하게 짠'으로 번역했습니다. 이렇게 하면 뒤의 '거룩한 옷들'과도 구별됩니다.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  english_pob_choice: for ministering in the sanctuary
  chosen_korean: 성막 안에서 섬기기 위한
  alternatives_korean:
  - 성소에서 봉사하기 위한
  - 거룩한 곳에서 섬기기 위한
  lexicon: HALOT
  rationale: 여기의 הקֹדשׁ는 추상적 '거룩함'이 아니라 성막의 성소적 영역을 가리키므로, 자연스럽고 문맥에 맞는 '성막 안에서'로 옮겼습니다. '섬기기'는 예배·성막 봉사의 공식적 기능을 반영합니다.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  english_pob_choice: the holy garments
  chosen_korean: 거룩한 옷들
  alternatives_korean:
  - 성스러운 옷들
  - 구별된 옷들
  lexicon: HALOT
  rationale: 아론의 제사장 예복이라는 공식 명칭을 간결하게 살리기 위해 직역에 가까운 '거룩한 옷들'을 채택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 관례적 호칭이 아니라 고유명사로 드러내기 위해 '야훼'를 사용했습니다.
theological_decisions:
- issue: 제사장 예복과 일반 봉사복의 구별
  chosen_reading: '''정교하게 짠 옷들''과 ''거룩한 옷들''을 분리해 번역해, 기능적 의복과 아론의 성별된 제의복을 구별했습니다.'
  alternative_readings:
  - 두 표현을 모두 '옷들'로 평탄화함
  - 모두 '성의(聖衣)'로 통일함
  rationale: 히브리어 본문은 בִגְדֵי שְׂרָד와 בִּגְדֵי הַקֹּדֶשׁ를 연속으로 놓아 서로 다른 초점을 줍니다. 이를 구분해야 본문의 제의적·직물적 긴장이 보존됩니다.
  doctrine_reference: Exodus 39:1의 제의 언어와 성막 봉사 구조
