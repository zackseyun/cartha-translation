id: EXO.39.32
reference: Exodus 39:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the LORD'' represents the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
  - marker: b
    text: Or 'the Israelites' for 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 성막, 곧 회막의 모든 일이 끝났습니다. 이스라엘 자손[b]은 야훼[a]께서 모세에게 명령하신 모든 대로 행했습니다. 그들은 그대로 행했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 YHWH를 사용합니다. 본문에서는 이를 ‘야훼’로 옮겼으며, 전통적으로는 ‘주’로 대체하여 옮기기도 합니다.
    reason: source_note
  - marker: b
    text: ‘이스라엘 자손’은 집합적 민족명을 가리키는 직역입니다. 문맥상 ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכֶל כָּל עֲבֹדַת
  english_pob_choice: Thus all the work ... was finished
  chosen_korean: 이렇게 ... 모든 일이 끝났고
  alternatives_korean:
  - 이렇게 ... 모든 작업이 완료되었고
  - 이렇게 ... 모든 일이 마무리되었고
  lexicon: HALOT
  rationale: כלה는 이 문맥에서 성막 제작의 완료를 가리키므로, 결과 상태를 자연스럽게 드러내는 ‘끝났고’로 옮겼습니다.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  english_pob_choice: the tabernacle, the tent of meeting
  chosen_korean: 성막 곧 회막
  alternatives_korean:
  - 성막, 곧 만남의 장막
  - 성막, 회중의 장막
  lexicon: HALOT
  rationale: מִשְׁכַּן과 אֹהֶל מוֹעֵד는 성소의 두 호칭이 병렬로 붙은 표현이므로, 한국어에서는 중복을 자연스럽게 연결하는 ‘성막 곧 회막’이 본문의 의미를 가장 분명히 드러냅니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 남성 복수의 족속 표지를 살리면서도 한국어 성경에서 널리 쓰이는 직역형인 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기적 고유명사 יְהוָה는 칭호로 대체하지 않고 ‘야훼’로 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר צִוָּה ... כֵּן עָשׂוּ
  english_pob_choice: according to all that ... so they did
  chosen_korean: 야훼께서 모세에게 명령하신 모든 대로 행했습니다. 그들은 그대로 행했습니다.
  alternatives_korean:
  - 야훼께서 모세에게 명령하신 모든 것을 따라 행했습니다. 그들이 그대로 행했습니다.
  - 야훼께서 모세에게 명령하신 대로 모두 행했습니다. 그들은 그렇게 했습니다.
  lexicon: HALOT
  rationale: ‘according to all that’와 끝의 반복 강조를 살려, 순종의 완전성을 보여 주는 ‘모든 대로’와 ‘그대로 행했습니다’를 함께 유지했습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명사를 사용하므로, 위임된 호칭인 ‘주님’으로 바꾸지 않고 고유명사 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 성막과 회막의 이중 호칭
  chosen_reading: 성막 곧 회막
  alternative_readings:
  - 성막, 회막
  - 성막, 곧 만남의 장막
  rationale: 두 명칭은 같은 성소를 가리키는 병렬 표현이므로, 한국어에서는 중복을 살리되 읽기 자연성을 위해 ‘곧’으로 연결했습니다.
  doctrine_reference: Exodus sanctuary terminology
