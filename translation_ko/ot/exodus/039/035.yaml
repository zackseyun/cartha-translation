lexical_decisions:
- source_word: אֲרֹן הָעֵדֻת
  english_pob_choice: the ark of the testimony
  chosen_korean: 증언판이 든 궤
  alternatives_korean:
  - 증언의 궤
  - 증언궤
  - 증거궤
  lexicon: HALOT
  rationale: עֵדוּת는 ‘증언/증거’의 뜻이므로 이를 살려 ‘증언’으로 옮기고, 대상이 판 자체가 아니라 그 판이 들어 있는 궤라는 점을 자연스럽게 드러내기 위해 ‘증언판이 든 궤’로 옮겼습니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles
  chosen_korean: 그 채들
  alternatives_korean:
  - 그 막대기들
  - 운반용 채들
  - 장대들
  lexicon: HALOT
  rationale: 성막 기구의 운반용 막대는 한국어 성경 전통의 ‘채’가 가장 간결하고 기능을 잘 드러내므로 ‘그 채들’로 옮겼습니다.
- source_word: הַכַּפֹּרֶת
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 은혜의 자리
  - 속죄 덮개
  - 은혜좌
  lexicon: HALOT
  rationale: כַּפֹּרֶת는 궤의 덮개이면서 속죄적 의미를 지니므로, 전통적이면서도 기능을 드러내는 ‘속죄소’를 채택했습니다.
theological_decisions:
- issue: כַּפֹּרֶת의 번역이 단순한 덮개인지, 속죄 기능을 포함하는지
  chosen_reading: ‘속죄소’로 옮겨 덮개 기능과 속죄적 함의를 함께 드러냅니다.
  alternative_readings:
  - ‘덮개’로만 옮김
  - ‘자비좌/은혜좌’ 사용
  rationale: 본문의 어휘는 단순한 물리적 덮개를 넘어 성막 예배에서의 속죄적 연관을 갖기 때문에, 의미를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 출애굽기 성막 기구의 문맥; POB의 최적 대응 원칙
