  source_fidelity: 히브리어의 공간 관계(두 어깨 부분의 아래쪽, 에봇의 앞면 쪽, 연결부에 상응하는 위치, 에봇의 띠 위)를 대체로 보존했습니다. 다만 ‘곧 앞쪽 아래’는 수식 관계가 불분명하고 한국어 어순상 위치 정보가 다소 흐립니다.
