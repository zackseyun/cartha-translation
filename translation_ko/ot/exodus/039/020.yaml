  to: 그들은 금 고리 두 개를 만들어 에봇의 두 어깨 부분의 아래쪽, 곧 에봇의 앞면 쪽에, 그 연결부[a] 맞은편 에봇의 정교하게 짠 띠[b] 위에 달았습니다.
  rationale: 문장을 재배열하여 원문의 연속된 위치 관계를 명료하게 제시했습니다. ‘에봇의 앞면 쪽’은 사물에 쓰인 פָּנִים의 방향 의미를 자연스럽게 옮기며, ‘맞은편’은 לְעֻמַּת의 공간적 대응 관계를 보존합니다. 각주 표지도 설명 대상인 ‘연결부’와 ‘정교하게 짠 띠’에 각각 붙였습니다.
