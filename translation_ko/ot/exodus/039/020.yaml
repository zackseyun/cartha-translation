id: EXO.39.20
reference: Exodus 39:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂוּ֮ שְׁתֵּ֣י טַבְּעֹ֣ת זָהָב֒ וַֽ/יִּתְּנֻ֡/ם עַל שְׁתֵּי֩ כִתְפֹ֨ת הָ/אֵפֹ֤ד מִ/לְ/מַ֨טָּה֙ מִ/מּ֣וּל פָּנָ֔י/ו לְ/עֻמַּ֖ת מֶחְבַּרְתּ֑/וֹ מִ/מַּ֕עַל לְ/חֵ֖שֶׁב הָ/אֵפֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
  footnotes:
  - marker: a
    text: Or 'opposite its joining' or 'opposite its attachment point'; the Hebrew term refers to the place where parts of the ephod were joined.
    reason: lexical_alternative
  - marker: b
    text: Or 'above the woven waistband of the ephod.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 금 고리 두 개를 만들어 에봇의 두 어깨 부분, 곧 앞쪽 아래, 그 연결부[a] 맞은편, 에봇의 정교하게 짠 띠 위에 달았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 접합부’ 또는 ‘그 이음새’. 히브리어는 부분들이 맞닿아 연결되는 지점을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘에봇의 짠 허리띠 위에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  english_pob_choice: rings
  chosen_korean: 고리
  alternatives_korean:
  - 반지
  - 링
  lexicon: HALOT
  rationale: tabernacle 의복 맥락에서 금속 부착물은 ‘고리’가 가장 자연스럽고 정확합니다.
- source_word: כִתְפֹת
  english_pob_choice: shoulder pieces
  chosen_korean: 어깨 부분
  alternatives_korean:
  - 어깨
  - 어깨 끈
  - 어깨 조각
  lexicon: HALOT
  rationale: 해부학적 어깨가 아니라 에봇의 옷감 구성 부분이므로 ‘어깨 부분’이 문맥을 잘 드러냅니다.
- source_word: מֶחְבַּרְתּוֹ
  english_pob_choice: its joining
  chosen_korean: 그 연결부
  alternatives_korean:
  - 그 잇는 곳
  - 그 접합부
  - 그 이음새
  lexicon: HALOT
  rationale: 이 단어는 붙어 있는 지점, 연결되는 부위를 가리키므로 ‘연결부’가 본뜻을 직접적으로 반영합니다.
- source_word: חֵשֶׁב
  english_pob_choice: skillfully woven band
  chosen_korean: 정교하게 짠 띠
  alternatives_korean:
  - 정교하게 짠 허리띠
  - 기술적으로 짠 띠
  - 짠 띠
  lexicon: HALOT
  rationale: 에봇의 짜인 띠를 가리키며, ‘정교하게 짠’은 앞 문맥의 제작 기술을 반영하고 ‘띠’는 의복 구성 요소로 자연스럽습니다.
theological_decisions:
- issue: 직접적 공간 관계를 보존할지 여부
  chosen_reading: ‘앞쪽 아래, 그 연결부 맞은편’으로 배치 관계를 그대로 살렸습니다.
  alternative_readings:
  - ‘앞면 아래, 연결부와 마주하게’
  - ‘전면 아래, 접합부 맞은편’
  rationale: 이 절은 예배복의 부착 위치를 세밀하게 기술하므로, 관계어를 완화하지 않고 원문의 배치 정보를 보존하는 것이 중요합니다.
  doctrine_reference: 성막/제사장복 규정의 정확한 재현
- issue: ‘에봇’의 음역 유지
  chosen_reading: 전통 용례를 따르되, 설명적 풀이는 최소화하고 ‘에봇’을 유지했습니다.
  alternative_readings:
  - ‘제사장 겉옷’
  - ‘에봇 옷’
  rationale: 이 용어는 전용 기술어이므로 일반 의복명으로 바꾸면 본문의 제의적 특수성이 약화됩니다.
  doctrine_reference: 출애굽기 성막 규정의 제의적 용어 보존
