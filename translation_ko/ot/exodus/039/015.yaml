  text: וַ/יַּעֲשׂ֧וּ עַל הַ/חֹ֛שֶׁן שַׁרְשְׁרֹ֥ת גַּבְלֻ֖ת מַעֲשֵׂ֣ה עֲבֹ֑ת זָהָ֖ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/015.yaml
  text: And they made on the breastpiece chains of braided work[a], like cords, of pure gold.
  footnotes:
  - marker: a
    text: Or 'chains of twisted work' or 'chains of corded work.' The Hebrew describes chains made in a braided or rope-like pattern.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 흉패 위에 순금으로, 꼬아 만든 공예처럼 엮은 사슬을 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘꼬아 만든 공예처럼 엮은’은 히브리어의 braided/corded work를 반영한 번역입니다. 대안으로는 ‘꼬아 만든 사슬’, ‘줄처럼 엮은 사슬’이 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  english_pob_choice: And they made
  chosen_korean: 그들은 … 만들었습니다
  alternatives_korean:
  - 그들은 … 지었습니다
  - 그들은 … 제작했습니다
  lexicon: HALOT
  rationale: 서술형 완료 과거로 자연스럽게 옮기되, 공예품 제작이라는 문맥을 살려 ‘만들었습니다’를 택했습니다.
- source_word: הַחֹשֶׁן
  english_pob_choice: the breastpiece
  chosen_korean: 흉패
  alternatives_korean:
  - 가슴받이
  - 흉판
  lexicon: HALOT
  rationale: 제사장 장비 문맥에서 הַחֹשֶׁן은 한국어 성경 전통에서도 통용되는 ‘흉패’가 가장 분명합니다.
- source_word: שַׁרְשְׁרֹת גַּבְלֻת מַעֲשֵׂה עֲבֹת
  english_pob_choice: chains of braided work, like cords
  chosen_korean: 꼬아 만든 공예처럼 엮은 사슬
  alternatives_korean:
  - 꼬아 만든 사슬
  - 줄처럼 엮은 사슬
  - 꼬임무늬 사슬
  lexicon: HALOT
  rationale: 사슬의 형태를 단순한 ‘사슬’보다 더 구체적으로 드러내기 위해, braided/corded work의 입체감을 살려 ‘꼬아 만든 공예처럼 엮은’으로 옮겼습니다.
- source_word: זָהָב טָהוֹר
  english_pob_choice: of pure gold
  chosen_korean: 순금으로
  alternatives_korean:
  - 순금의
  - 정금으로
  lexicon: HALOT
  rationale: 재료를 나타내는 표준적 한국어 표현으로, ‘pure gold’의 순도와 물질성을 간결하게 살렸습니다.
