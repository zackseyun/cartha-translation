  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂוּ֙ עַל שׁוּלֵ֣י הַ/מְּעִ֔יל רִמּוֹנֵ֕י תְּכֵ֥לֶת וְ/אַרְגָּמָ֖ן וְ/תוֹלַ֣עַת שָׁנִ֑י מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/024.yaml
  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
  footnotes:
  - marker: a
    text: Or 'pomegranate-shaped ornaments.' The Hebrew simply says 'pomegranates,' using the object’s shape as its name.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew lists blue, purple, and scarlet material, with 'twisted' describing the textile work; 'yarn' is supplied in English for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 푸른 실과 자주색 실과 홍색 실로 꼰 석류들을 겉옷의 옷단에 만들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  english_pob_choice: And they made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  lexicon: HALOT עשה
  rationale: 서술형 과거로 자연스럽고, 성막 기물 제작 문맥에서 ‘만들었습니다’가 직접적입니다.
- source_word: רִמּוֹנֵי
  english_pob_choice: pomegranates
  chosen_korean: 석류들
  alternatives_korean:
  - 석류 모양 장식들
  - 석류 장식물들
  lexicon: HALOT רמון
  rationale: 히브리어는 문자 그대로 ‘석류들’이라고만 말하므로 본문은 그 표현을 유지하고, 장식성은 문맥이 드러내게 했습니다.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  english_pob_choice: blue and purple and scarlet yarn
  chosen_korean: 푸른 실과 자주색 실과 홍색 실
  alternatives_korean:
  - 푸른 실과 자주색 실과 주홍색 실
  - 푸른 실과 자주빛 실과 붉은 실
  lexicon: HALOT תכלת / ארגמן / תולעת שני
  rationale: 직물 재료의 색채를 한국어로 옮기되, 영어 POB처럼 마지막에 ‘yarn’을 보태지 않고 원문에 있는 재료 목록을 간결하게 반영했습니다.
- source_word: מָשְׁזָר
  english_pob_choice: twisted
  chosen_korean: 꼰
  alternatives_korean:
  - 비틀어 꼰
  - 가늘게 꼰
  lexicon: HALOT משזר
  rationale: 실을 ‘꼬다’는 뜻을 살려, 성막 직물의 가공 상태를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: שׁוּלֵי הַמְּעִיל
  english_pob_choice: the hem of the robe
  chosen_korean: 겉옷의 옷단
  alternatives_korean:
  - 겉옷의 가장자리
  - 예복의 옷단
  lexicon: HALOT שול / מעיל
  rationale: מְעִיל은 성막 문맥의 겉옷/예복에 해당하므로 ‘겉옷’으로 옮기고, שׁוּלֵי의 의복 문맥상 의미를 ‘옷단’으로 표현했습니다.
