  text: 그리고 세 번째 줄은 감람석, 마노, 그리고 자수정입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 고대 보석 이름들은 정확한 현대 대응물이 확실하지 않습니다.
