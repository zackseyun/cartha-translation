lexical_decisions:
- source_word: וְהַטּוּר
  english_pob_choice: and the ... row
  chosen_korean: 그리고 ... 줄은
  alternatives_korean:
  - 그리고 ... 행은
  - 그리고 ... 배열은
  lexicon: HALOT
  rationale: 보석 목록의 배열을 가리키는 טּוּר의 의미를 살려 ‘줄’로 옮겼고, 앞 절과 이어지는 목록 구조를 반영해 ‘그리고’를 유지했습니다.
- source_word: לֶשֶׁם
  english_pob_choice: jacinth
  chosen_korean: 감람석
  alternatives_korean:
