  - 호박
  lexicon: HALOT
  rationale: 이 보석의 정확한 식별은 불확실하므로, 한국어에서는 전통적 교회어보다 중립적인 현대 보석명으로 옮겼습니다.
- source_word: שְׁבוֹ
  english_pob_choice: agate
  chosen_korean: 마노
  alternatives_korean:
  - 오닉스
  lexicon: HALOT
  rationale: 이 문맥에서의 전통적 대응어를 따르되, 대안 식별 가능성은 본문 주석 없이도 유지될 수 있도록 했습니다.
- source_word: וְאַחְלָמָה
  english_pob_choice: and amethyst
  chosen_korean: 그리고 자수정
  alternatives_korean:
  - 그리고 자주색 보석
  lexicon: HALOT
  rationale: אַחְלָמָה는 이 목록에서 일반적으로 자수정으로 이해되므로, 한국어에서도 널리 통용되는 명칭을 사용했습니다.
theological_decisions:
- issue: 보석 명칭의 불확실성 처리
  chosen_reading: 본문에는 확정적 식별보다 목록의 순서와 구성 자체를 드러내는 번역을 채택했습니다.
  alternative_readings:
  - 주석을 본문에 적극 반영해 ‘재신스/호박’처럼 병기하는 방식
  - 전통 교회용 명칭을 그대로 고정하는 방식
  rationale: 히브리어 원문과 영어 POB 모두 여러 보석의 정확한 식별이 불확실함을 전제로 하므로, 본문은 간결하게 두고 해석상의 불확실성은 번역어 선택의 중립성으로 반영했습니다.
  doctrine_reference: 성경 번역의 본문 충실성과 해석적 절제
