translation:
  language: ko
  text: 또한 곱게 꼰 고운 아마포와 청색 실과 자주색 실과 주홍색 실로 만든 띠[a], 곧 자수 놓는 이의 작품을 만들었습니다. 이는 야훼께서 모세에게 명령하신 그대로였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘띠’는 여기서 제사장 예복에 매는 허리띠, 곧 ‘허리띠’ 또는 ‘대’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주홍색 실’은 주홍색으로 물들인 직물이나 실을 가리킵니다. ‘진홍색 실’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  english_pob_choice: the sash
  chosen_korean: 띠
  alternatives_korean:
