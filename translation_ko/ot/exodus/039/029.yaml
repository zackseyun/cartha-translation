translation:
  language: ko
  text: 그리고 고운 삼실로 꼰 띠와 파랑실과 자주색실과 붉은 실로 된 것은 수놓는 사람의 솜씨였으며, 야훼께서 모세에게 명령하신 그대로였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘띠’는 여기서 제사장 예복에 매는 허리띠, 곧 ‘허리띠/대’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘붉은 실’은 붉게 물들인 직물이나 실가닥을 가리킬 수 있습니다. POB의 ‘scarlet yarn’에 해당합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  english_pob_choice: the sash
  chosen_korean: 띠
  alternatives_korean:
  - 허리띠
  - 띠끈
  - 대
  lexicon: HALOT
  rationale: אַבְנֵט은 제사장 예복에 매는 허리 둘레의 띠를 가리키므로, 현대 한국어에서는 지나치게 군더더기 없는 ‘띠’가 가장 자연스럽고 문맥에도 맞습니다.
- source_word: שֵׁשׁ מָשְׁזָר
  english_pob_choice: finely twisted linen
  chosen_korean: 고운 삼실로 꼰
  alternatives_korean:
  - 세밀하게 꼰 고운 베
  - 곱게 꼰 세마포
  - 가늘게 꼰 고운 삼베
  lexicon: HALOT
  rationale: שֵׁשׁ의 고급 린넨/세마포 성격과 מָשְׁזָר의 ‘꼬다’는 뜻을 함께 살리기 위해 ‘고운 삼실로 꼰’으로 옮겼습니다.
- source_word: תוֹלַעַת שָׁנִי
  english_pob_choice: scarlet yarn
  chosen_korean: 붉은 실
  alternatives_korean:
  - 주홍실
  - 홍색실
  - 홍실
  lexicon: HALOT
  rationale: 이 표현은 붉게 물들인 직물을 가리키므로, 직물 맥락이 분명한 ‘붉은 실’로 옮겼습니다. POB의 각주처럼 ‘주홍’도 가능하지만, 본문에서는 색채와 재료를 간명하게 드러냈습니다.
- source_word: מַעֲשֵׂה רֹקֵם
  english_pob_choice: the work of an embroiderer
  chosen_korean: 수놓는 사람의 솜씨
  alternatives_korean:
  - 자수 놓는 이의 작품
  - 자수공의 작업
  - 수놓은 일
  lexicon: HALOT
  rationale: 문구는 장식 자수의 숙련된 기술을 말하므로, ‘솜씨’로 기예의 성격을 살리고 ‘수놓는 사람’으로 기능을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 칭호가 아니라 고유명으로 보존해야 하므로, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 명령 순종 공식의 시제와 강조
  chosen_reading: ‘명령하신 그대로였습니다’로 옮겨, 완료된 공적 서술 속에서 정확한 순종의 완결성을 드러냈습니다.
  alternative_readings:
  - ‘명령하신 대로였습니다’
  - ‘명령하신 그대로 하였습니다’
  rationale: 히브리어의 관용적 종결 공식은 단순 정보 전달이 아니라 성막 제작이 계시된 명령과 일치했음을 증언합니다. 한국어에서도 그 일치성과 완결성을 분명히 하는 쪽이 문맥에 더 충실합니다.
  doctrine_reference: 성막 본문 전반의 순종 공식(출 39장)
