  - 곱게 꼰 세마포
  - 가늘게 꼰 고운 삼베
  lexicon: HALOT
  rationale: שֵׁשׁ의 고급 린넨/세마포 성격과 מָשְׁזָר의 ‘꼬다’는 뜻을 함께 살리기 위해 ‘고운 삼실로 꼰’으로 옮겼습니다.
- source_word: תוֹלַעַת שָׁנִי
  english_pob_choice: scarlet yarn
  chosen_korean: 붉은 실
  alternatives_korean:
