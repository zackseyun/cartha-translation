  yaml_path: translation/ot/exodus/039/017.yaml
  text: And they put the two gold cords on the two rings at the ends of the breastpiece[a].
  footnotes:
  - marker: a
    text: Or 'the two gold chains.' The Hebrew term can denote twisted cords or chain-like strands; here the objects are made of gold and attached to the breastpiece.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 두 금줄을 흉패의 끝부분에 있는 두 고리에 달았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 금사슬’. 히브리어 용어는 꼬인 줄이나 사슬 같은 가닥을 가리킬 수 있으며, 여기서는 금으로 만들어 흉패에 붙는 물건입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  english_pob_choice: And they put
  chosen_korean: 달았습니다
  alternatives_korean:
  - 놓았습니다
  - 두었습니다
  lexicon: HALOT
  rationale: נתן은 여기서 물건을 제자리에 놓아 부착하는 동작을 가리키므로, 고리에 ‘달다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: הָעֲבֹתֹת
  english_pob_choice: cords
  chosen_korean: 금줄
  alternatives_korean:
  - 줄
  - 사슬
  lexicon: HALOT
  rationale: 이 단어는 꼬인 줄이나 사슬 같은 끈을 가리킬 수 있는데, 금으로 만든 장식용 부속이라는 점을 살려 ‘금줄’로 옮겼습니다.
- source_word: הַטַּבָּעֹת
  english_pob_choice: rings
  chosen_korean: 고리
  alternatives_korean:
  - 반지
  - 링
  lexicon: HALOT
  rationale: 성막 기물 맥락에서 טבעת는 장식용 ‘고리’가 가장 분명한 대응어입니다.
- source_word: קְצֹוֹת הַחֹשֶׁן
  english_pob_choice: the ends of the breastpiece
  chosen_korean: 흉패의 끝부분
  alternatives_korean:
  - 흉패의 끝
  - 흉패의 가장자리
  lexicon: HALOT
  rationale: קצה는 ‘끝/끝부분’을 뜻하며, 흉패의 부착 지점을 자연스럽게 드러내기 위해 ‘끝부분’으로 옮겼습니다.
