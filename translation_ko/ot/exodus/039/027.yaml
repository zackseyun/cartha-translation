  text: וַֽ/יַּעֲשׂ֛וּ אֶת הַ/כָּתְנֹ֥ת שֵׁ֖שׁ מַעֲשֵׂ֣ה אֹרֵ֑ג לְ/אַהֲרֹ֖ן וּ/לְ/בָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/027.yaml
  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
  footnotes:
  - marker: a
    text: Or "woven work." The Hebrew phrase emphasizes that the tunics were made by weaving.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아론과 그의 아들들을 위해, 베 짠 속옷들을—베 짜는 사람이 하는 일로—만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “짜임새 있는 일”입니다. 히브리어 표현은 이것들이 직조로 만들어졌음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  english_pob_choice: They made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  lexicon: HALOT
  rationale: 서술문 진행을 자연스러운 현대 한국어로 옮기면서도, 성막 기물 제작의 수공예적 의미를 유지하기 위해 ‘만들었습니다’를 택했습니다.
- source_word: הַכָּתְנֹת
  english_pob_choice: the tunics
  chosen_korean: 속옷들을
  alternatives_korean:
  - 튠식들을
  - 의복들을
  lexicon: HALOT
  rationale: כֻּתֹּנֶת은 몸에 밀착하는 내의성 의복을 가리키므로, 성막 맥락에서 한국어로는 ‘속옷’이 가장 기능적으로 가깝습니다.
- source_word: שֵׁשׁ
  english_pob_choice: fine linen
  chosen_korean: 베
  alternatives_korean:
  - 고운 베
  - 세마포
  lexicon: HALOT
  rationale: 제사장 복식 문맥에서 재료의 질을 드러내는 ‘fine linen’에 대응하여, 성경적·전례적 뉘앙스를 유지하는 ‘베’로 옮겼습니다.
- source_word: מַעֲשֵׂה אֹרֵג
  english_pob_choice: the work of a weaver
  chosen_korean: 베 짜는 사람이 하는 일로
  alternatives_korean:
  - 짜임새 있는 일로
  - 직조한 작업으로
  lexicon: HALOT
  rationale: 직조로 만든 작품이라는 점을 살리기 위해 ‘베 짜는 사람이 하는 일’로 풀어, 기술 방식이 강조되도록 했습니다.
theological_decisions:
- issue: 아론과 그의 아들들의 소유/용도 표현
  chosen_reading: ‘아론과 그의 아들들을 위해’로 옮겨, 제작 목적이 제사장 직무용임을 드러냈습니다.
  alternative_readings:
  - ‘아론과 그의 아들들에게’
  - ‘아론과 그의 아들들을 위하여’
  rationale: 히브리어 לְ는 단순 수혜자뿐 아니라 용도·목적을 나타내므로, 제사장 복식의 기능을 분명히 하는 방향이 더 적절합니다.
  doctrine_reference: 출애굽기 28–29장 제사장 위임과 복식 규례
