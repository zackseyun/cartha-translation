  naturalness: ‘베 짠 속옷들을—베 짜는 사람이 하는 일로—만들었습니다’는 재료·제작 방식·동사가 중복되고 대시 삽입이 현대 합쇼체 성경 문체에 어색합니다. ‘직조공의 솜씨로 고운 베 튜닉들을 만들었습니다’가 간결하고 자연스럽습니다.
