    text: The precise identification of several gemstones in the high priest's breastpiece is uncertain; 'beryl,' 'onyx,' and 'jasper' reflect common traditional equivalents.
    reason: lexical_alternative
  - marker: b
    text: Or 'mounted in gold settings according to their settings.' The final Hebrew phrase is technical and may refer to the way the stones were fitted into their designated sockets.
