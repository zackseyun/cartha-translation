  rationale: 금속 부속이 사슬을 붙들어 주는 장치라는 점을 살려, 보석 세팅의 기능을 떠올리게 하는 ‘받침’을 택했습니다.
- source_word: כִּתְפֹת
  english_pob_choice: shoulder pieces
  chosen_korean: 어깨 조각들
