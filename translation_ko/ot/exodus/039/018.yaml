  lexicon: HALOT
  rationale: 직역의 ‘사슬’에 더해, 엮이거나 꼬인 제작 방식을 드러내는 ‘꼬인’으로 공예적 뉘앙스를 살렸습니다.
- source_word: מִּשְׁבְּצֹת
