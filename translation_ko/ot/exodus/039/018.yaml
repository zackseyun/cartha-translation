  rationale: 에봇의 구조적 부위를 가리키므로, 해부학적 ‘어깨’보다 의복의 부속을 드러내는 ‘어깨 조각들’이 더 정확합니다.
theological_decisions:
- issue: 에봇 용어의 번역 방식
  chosen_reading: 에봇을 음역하여 제사장 의복이라는 고유한 성막 용어로 유지했습니다.
  alternative_readings:
  - 에봇을 ‘앞치마’처럼 풀어 번역함
  - 에봇을 설명적으로 의복으로 바꿈
  rationale: 본문은 성막 기구의 세부 묘사이므로, 일반 의복으로 평탄화하기보다 전승된 기술어를 보존하는 편이 의미를 더 정확히 전달합니다.
  doctrine_reference: 출애굽기 28–39장의 성막/제사장 직분 문맥
