translation:
  language: ko
  text: 그들은 꼬아 만든 두 사슬의 두 끝을 두 금 장착물 위에 두고, 그것들을 에봇의 어깨 부분들 위, 곧 그 앞쪽에 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘꼬아 만든 사슬’은 ‘엮은 사슬’ 또는 전통적으로 ‘꼬인 사슬’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘금 장착물’은 ‘금테’ 또는 ‘장착대’로도 옮길 수 있습니다.
    reason: lexical_alternative
