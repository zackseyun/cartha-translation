  rationale: 본문은 성막 기구의 세부 묘사이므로, 일반 의복으로 평탄화하기보다 전승된 기술어를 보존하는 편이 의미를 더 정확히 전달합니다.
  doctrine_reference: 출애굽기 28–39장의 성막/제사장 직분 문맥
