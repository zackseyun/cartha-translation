base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/018.yaml
  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
  footnotes:
  - marker: a
    text: Or 'wreathen chains,' reflecting older English for twisted or braided chainwork.
    reason: lexical_alternative
  - marker: b
    text: Or 'mountings' for 'settings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 두 꼬인 사슬의 두 끝을 두 받침에 달아놓고, 그것들을 에봇의 어깨 조각들, 곧 앞쪽에 달았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘꼬인 사슬’은 영어 POB의 ‘braided chains’에 해당하며, 오래된 표현인 ‘wreathen chains’의 장식적 꼬임을 함께 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘받침’은 영어 POB의 ‘settings’에 해당하며, 문맥상 ‘mountings’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  english_pob_choice: ends
  chosen_korean: 끝
  alternatives_korean:
  - 양끝
  - 끝부분
  lexicon: HALOT
  rationale: 사슬의 종결 지점을 가리키므로 자연스러운 현대 한국어인 ‘끝’이 가장 직접적입니다.
- source_word: הָעֲבֹתֹת
