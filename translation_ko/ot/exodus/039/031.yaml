    issue: ‘두게 하였으니’가 목적 부정사를 사역으로 처리함
    rationale: לָתֵת는 끈을 단 목적, 곧 금판을 터번에 놓기 위함을 나타냅니다. 본문에는 누군가에게 그것을 ‘두게 했다’는 사역 의미가 없습니다.
  - severity: medium
    issue: ‘위로 터번 위에’가 부자연스럽고 위치 관계를 불명료하게 함
    rationale: מִלְמָעְלָה는 터번의 위쪽/상부 위치를 가리킵니다. ‘터번 위쪽에’가 자연스럽게 이를 전달합니다.
  - severity: low
    issue: ‘청색 실 끈’의 결합이 다소 압축적임
    rationale: ‘청색 실로 된 끈’은 פְּתִיל의 끈 기능과 תְּכֵלֶת의 재료·색상 정보를 더 명료하게 표현합니다.
  revised_text: 그들은 그것을 터번 위쪽에 놓기 위해 그것에 청색 실로 된 끈을 달았습니다. 야훼께서 모세에게 명령하신 그대로였습니다.
