review_pass:
  verdict: revise
  source_fidelity: 초안은 청색 끈을 금판에 단다는 핵심 의미와 야훼의 명령에 따른 이행 공식을 대체로 충실히 옮겼습니다. 그러나 ‘그것을 위로 터번 위에 두게 하였으니’는 히브리어의 목적 부정사 לָתֵת를 부자연스러운 사역 표현으로 바꾸며, ‘위로 터번 위에’도 한국어 위치 표현으로 적절하지 않습니다.
  naturalness: ‘청색 실 끈’은 이해 가능하지만 ‘청색 실로 된 끈’이 재료와 기능을 더 자연스럽게 드러냅니다. 목적을 나타내는 ‘…놓기 위해’와 위치를 나타내는 ‘터번 위쪽에’를 사용하면 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘야훼’, ‘터번’, ‘청색’은 본문 및 번역 방침에 부합합니다. תְּכֵלֶת의 색조는 논쟁의 여지가 있으므로 각주에서 청색/자주빛 대안을 유지하는 것이 적절합니다.
  issues:
