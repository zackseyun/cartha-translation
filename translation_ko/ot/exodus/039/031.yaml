  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'a blue cord' or 'a violet cord'; the Hebrew תְּכֵלֶת refers to the distinctive blue-dyed material used in the tabernacle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그것에 청색 실[a] 끈을 달아, 그것을 위로 터번 위에 두게 하였으니, 야훼께서 모세에게 명령하신 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘청색 끈’ 혹은 ‘자주빛 끈’; 히브리어 תְּכֵלֶת은 성막에 사용된 특징적인 청색으로 염색된 재료를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  english_pob_choice: they attached to it
  chosen_korean: 그들은 그것에 … 끈을 달아
  alternatives_korean:
  - 그들은 그것에 달았습니다
  - 그들은 그것에 붙였습니다
  - 그들은 그것에 매었습니다
  lexicon: HALOT
  rationale: 동사 נתן의 기본 뜻은 ‘주다/두다’이지만, 이 문맥에서는 앞선 금판에 끈을 실제로 고정하는 동작이므로 ‘달다’가 가장 자연스럽고 기능적으로도 정확합니다.
- source_word: פְּתִיל תְּכֵלֶת
  english_pob_choice: a cord of blue yarn
  chosen_korean: 청색 실 끈
  alternatives_korean:
  - 청색 끈
  - 청색 실로 된 끈
  - 푸른 실 끈
  lexicon: HALOT
  rationale: פְּתִיל은 단순한 실보다 묶거나 고정하는 용도의 ‘끈’에 가깝고, תְּכֵלֶת은 성막 직물의 특징적인 청색 염료를 가리키므로 두 요소를 함께 살려 ‘청색 실 끈’으로 옮겼습니다.
- source_word: הַמִּצְנֶפֶת מִלְמָעְלָה
  english_pob_choice: above on the turban
  chosen_korean: 위로 터번 위에
  alternatives_korean:
  - 터번 위쪽에
  - 터번의 윗부분에
  - 터번 위에
  lexicon: HALOT
  rationale: מִלְמָעְלָה는 위치의 ‘위/위쪽’을 나타내므로, 히브리어 어순을 살려 ‘위로 터번 위에’로 옮겨 금판이 터번의 상부에 놓였음을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 문맥상 언약의 하나님의 이름인 יהוה는 본문 표제어에 따라 호칭이 아니라 고유명사로 처리해야 하므로, 전통적 대체어인 ‘주님’ 대신 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 여호와 대체 번역의 유지
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 일관되게 표기합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본절은 완결 공식인 ‘야훼께서 모세에게 명령하신 그대로’로 끝나며, 언약 이름을 가리는 전통적 대체 번역보다 고유명을 보존하는 것이 출처 본문이 의도한 직접성을 더 잘 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
