  text: רָב֧וּעַ הָיָ֛ה כָּפ֖וּל עָשׂ֣וּ אֶת הַ/חֹ֑שֶׁן זֶ֧רֶת אָרְכּ֛/וֹ וְ/זֶ֥רֶת רָחְבּ֖/וֹ כָּפֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/009.yaml
  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
  footnotes:
  - marker: a
    text: Or 'folded double.' The Hebrew כָּפוּל indicates that the breastpiece was made in a doubled or folded-over form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 네모꼴이었습니다. 그들은 흉패를 두 겹으로 만들었는데, 길이는 한 뼘, 너비도 한 뼘이었으며, 두 겹이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘접어 두 겹으로’. 히브리어 כָּפוּל은 흉패가 두 겹이 되거나 접힌 형태로 만들어졌음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב֧וּעַ
  english_pob_choice: square
  chosen_korean: 네모꼴
  alternatives_korean:
  - 정사각형
  - 사각형
  lexicon: HALOT
  rationale: 출발어는 네 변이 같은 정방형을 뜻하므로, 현대 한국어에서 자연스럽고 의미를 잘 드러내는 ‘네모꼴’로 옮겼습니다.
- source_word: הַחֹשֶׁן
  english_pob_choice: the breastpiece
  chosen_korean: 흉패
  alternatives_korean:
  - 가슴패
  - 판결흉패
  lexicon: HALOT
  rationale: 제사장 의복 맥락의 전문 용어이므로 표준적인 성서 한국어인 ‘흉패’를 사용했습니다. 문맥에 없는 ‘판결’은 덧붙이지 않았습니다.
- source_word: כָּפוּל
  english_pob_choice: doubled
  chosen_korean: 두 겹으로
  alternatives_korean:
  - 겹으로
  - 이중으로
  - 접어 두 겹으로
  lexicon: HALOT
  rationale: כָּפוּל은 접히거나 두 겹이 된 상태를 가리키므로, 본문 의미를 분명히 하면서도 과도한 해석을 피하는 ‘두 겹으로’가 적절합니다.
- source_word: זֶרֶת
  english_pob_choice: a span
  chosen_korean: 한 뼘
  alternatives_korean:
  - 한 span
  - 반 규빗
  lexicon: HALOT
  rationale: 고대 단위를 그대로 음역하기보다 한국어 독자가 즉시 이해할 수 있는 전통 측정어 ‘뼘’을 택했습니다. 다만 절 전체의 가독성을 위해 짧게 유지했습니다.
theological_decisions:
- issue: 두 겹이라는 마지막 חוזר 표현의 처리
  chosen_reading: 마지막 ‘두 겹이었습니다’로 끝의 반복을 살려, 흉패의 이중 구조를 강조했습니다.
  alternative_readings:
  - 생략하여 문장을 더 간결하게 함
  - 앞의 ‘두 겹으로 만들었는데’만으로 처리함
  rationale: 히브리어는 끝에서 같은 형용사를 다시 두어 구조를 강조하므로, 한국어에서도 반복을 살려 본문의 강조점을 보존했습니다.
  doctrine_reference: 본문의 제의적 구조 묘사에 대한 충실성
