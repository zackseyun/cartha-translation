translation:
  language: ko
  text: 그것은 정사각형이었습니다. 그들은 흉패를 두 겹으로[a] 만들었는데, 두 겹으로 된 상태에서 길이도 한 뼘, 너비도 한 뼘이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘접어서 두 겹으로’. 히브리어 כָּפוּל은 흉패가 두 겹으로 되거나 접힌 형태로 만들어졌음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב֧וּעַ
  english_pob_choice: square
  chosen_korean: 네모꼴
  alternatives_korean:
  - 정사각형
  - 사각형
  lexicon: HALOT
  rationale: 출발어는 네 변이 같은 정방형을 뜻하므로, 현대 한국어에서 자연스럽고 의미를 잘 드러내는 ‘네모꼴’로 옮겼습니다.
- source_word: הַחֹשֶׁן
  english_pob_choice: the breastpiece
  chosen_korean: 흉패
