source:
  edition: WLC
  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Or 'with a blue cord.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the woven band of the ephod'; the Hebrew term refers to the decorated band attached to the ephod.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 청색 끈[a]으로 흉패를 그것의 고리에서 에봇의 고리들에 고정하여, 그것이 에봇의 정교하게 짠 띠 위에 있게 하였고, 흉패가 에봇에서[b] 느슨해지지 않게 하였습니다. 야훼께서 모세에게 명령하신 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘푸른 끈으로’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘에봇의 짠 띠에서’; 히브리어 용어는 에봇에 붙은 장식된 띠를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  english_pob_choice: They fastened
  chosen_korean: 고정하여
  alternatives_korean:
  - 매어
  - 묶어
  - 붙들어
  lexicon: HALOT
  rationale: 의복 부속품을 단단히 이어 붙이는 맥락이므로, 현대 한국어에서 가장 자연스럽고 기능을 잘 드러내는 ‘고정하다’를 택했습니다.
- source_word: הַחֹשֶׁן
  english_pob_choice: the breastpiece
  chosen_korean: 흉패
  alternatives_korean:
  - 가슴판
  - 흉갑
  lexicon: HALOT
  rationale: 제사장 복식의 전문 용어로는 ‘흉패’가 가장 널리 알려져 있고, 갑옷처럼 오해될 수 있는 ‘흉갑’은 피했습니다.
- source_word: בִּפְתִיל תְּכֵלֶת
  english_pob_choice: with a cord of blue
  chosen_korean: 청색 끈
  alternatives_korean:
  - 푸른 끈
  - 청색 실
  lexicon: HALOT
  rationale: תְּכֵלֶת의 직물 색을 살리면서도, 고정용 매듭의 도구라는 점을 반영해 ‘끈’으로 옮겼습니다.
- source_word: חֵשֶׁב הָאֵפֹד
  english_pob_choice: the skillfully woven band of the ephod
  chosen_korean: 에봇의 정교하게 짠 띠
  alternatives_korean:
  - 에봇의 짠 띠
  - 에봇의 허리띠
  lexicon: HALOT
  rationale: חֵשֶׁב은 에봇에 붙은 장식성 있는 직조 띠를 가리키므로, 기능과 장식성을 함께 드러내는 ‘정교하게 짠 띠’로 옮겼습니다.
- source_word: וְלֹא יִזַּח ... מֵעַל הָאֵפֹד
  english_pob_choice: would not come loose from on the ephod
  chosen_korean: 에봇에서 느슨해지지 않게
  alternatives_korean:
  - 에봇에서 떨어지지 않게
  - 에봇에서 벗겨지지 않게
  lexicon: HALOT
  rationale: נזח는 분리되거나 헐거워지는 상태를 가리키므로, 제사복 맥락에 맞게 ‘느슨해지지 않게’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 하나님의 고유명사가 직접 나오므로, 전통적 대체어 ‘주’가 아니라 이름 자체를 보존하는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
