- from: 그들은 청색 끈[a]으로 흉패를 그것의 고리에서 에봇의 고리들에 고정하여, 그것이 에봇의 정교하게 짠 띠 위에 있게 하였고, 흉패가 에봇에서[b] 느슨해지지 않게 하였습니다. 야훼께서 모세에게 명령하신 그대로였습니다.
  to: 그들은 청색 끈[a]으로 흉패의 고리를 에봇의 고리에 묶어, 흉패가 에봇의 정교하게 짠 띠[b] 위에 있도록 하고 에봇 위에서 벗어나지 않게 하였습니다. 이는 야훼께서 모세에게 명령하신 그대로였습니다.
  rationale: The revision makes the ring-to-ring attachment explicit, renders the non-displacement clause more faithfully, restores the spatial sense of ‘from upon the ephod,’ and relocates footnote b to the term it actually explains. It retains the draft’s established technical terminology and rendering of the divine name.
