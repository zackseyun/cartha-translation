source:
  edition: WLC
  text: וְ/אֵת֙ הַ/מִּצְנֶ֣פֶת שֵׁ֔שׁ וְ/אֶת פַּאֲרֵ֥י הַ/מִּגְבָּעֹ֖ת שֵׁ֑שׁ וְ/אֶת מִכְנְסֵ֥י הַ/בָּ֖ד שֵׁ֥שׁ מָשְׁזָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/028.yaml
  text: the turban of fine linen[a], the ornate caps of fine linen, and the undergarments of finely twisted linen,
  footnotes:
  - marker: a
    text: Or 'the linen undergarments, of twisted fine linen.' The Hebrew word order allows the final phrase 'fine linen, twisted' to be heard especially with the last item, though it also echoes the material description used throughout the priestly garments.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 세마포로 된 터번과 세마포로 된 화려한 관들, 그리고 가늘게 꼰 세마포로 된 속바지를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가늘게 꼰 세마포로 된 속바지’로도 읽을 수 있습니다. 히브리어 어순상 마지막 항목에 ‘세마포, 가늘게 꼰’의 성격이 특히 걸리지만, 성막 의복 전체에서 반복되는 재료 설명도 함께 울립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  english_pob_choice: the turban
  chosen_korean: 터번
  alternatives_korean:
  - 머리쓰개
  - 관
  lexicon: HALOT
  rationale: 제사장 머리덮개를 가리키는 מִצְנֶפֶת의 기능을 한국어에서도 가장 직접적으로 드러내는 표현으로 ‘터번’을 택했습니다.
- source_word: שֵׁשׁ
  english_pob_choice: fine linen
  chosen_korean: 세마포
  alternatives_korean:
  - 고운 베
  - 고운 리넨
  lexicon: HALOT
  rationale: 성막·제사장 의복 문맥에서 שֵׁשׁ은 질 좋은 아마포를 가리키므로, 한국어 성경 전통과 가독성을 고려해 ‘세마포’로 옮겼습니다.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  english_pob_choice: the ornate caps
  chosen_korean: 화려한 관들
  alternatives_korean:
  - 장식된 모자들
  - 아름다운 관들
  lexicon: HALOT
  rationale: 구문 전체가 제사장 모자의 장식성·품위를 강조하므로, 형태를 분리하기보다 성격을 살려 ‘화려한 관들’로 자연스럽게 옮겼습니다.
- source_word: מִכְנְסֵי הַבָּד
  english_pob_choice: the undergarments of linen
  chosen_korean: 속바지
  alternatives_korean:
  - 속옷
  - 아랫도리 옷
  lexicon: HALOT
  rationale: 제사장용 하의 속옷이라는 기능을 오늘날 독자가 이해하기 쉽게 ‘속바지’로 번역했습니다.
- source_word: מָשְׁזָר
  english_pob_choice: finely twisted
  chosen_korean: 가늘게 꼰
  alternatives_korean:
  - 정교하게 꼰
  - 촘촘히 꼰
  lexicon: HALOT
  rationale: 실의 제직 방식을 가리키는 표현이므로, ‘가늘게 꼰’으로 직조의 방식과 질감을 함께 드러냈습니다.
