  chosen_korean: 세마포
  alternatives_korean:
  - 고운 베
  - 고운 리넨
  lexicon: HALOT
  rationale: 성막·제사장 의복 문맥에서 שֵׁשׁ은 질 좋은 아마포를 가리키므로, 한국어 성경 전통과 가독성을 고려해 ‘세마포’로 옮겼습니다.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  english_pob_choice: the ornate caps
  chosen_korean: 화려한 관들
  alternatives_korean:
  - 장식된 모자들
  - 아름다운 관들
  lexicon: HALOT
  rationale: 구문 전체가 제사장 모자의 장식성·품위를 강조하므로, 형태를 분리하기보다 성격을 살려 ‘화려한 관들’로 자연스럽게 옮겼습니다.
- source_word: מִכְנְסֵי הַבָּד
  english_pob_choice: the undergarments of linen
  chosen_korean: 속바지
  alternatives_korean:
  - 속옷
  - 아랫도리 옷
  lexicon: HALOT
  rationale: 제사장용 하의 속옷이라는 기능을 오늘날 독자가 이해하기 쉽게 ‘속바지’로 번역했습니다.
- source_word: מָשְׁזָר
  english_pob_choice: finely twisted
  chosen_korean: 가늘게 꼰
  alternatives_korean:
  - 정교하게 꼰
  - 촘촘히 꼰
  lexicon: HALOT
  rationale: 실의 제직 방식을 가리키는 표현이므로, ‘가늘게 꼰’으로 직조의 방식과 질감을 함께 드러냈습니다.
