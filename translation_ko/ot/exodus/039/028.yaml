translation:
  language: ko
  text: 그리고 세마포 터번과 세마포로 만든 화려한 관들, 그리고 곱게 꼰 세마포 속바지를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세마포 속바지, 곱게 꼰 세마포’로 옮길 수 있습니다. 히브리어 어순상 마지막의 ‘세마포, 곱게 꼰 것’은 특히 마지막 항목에 걸리는 것으로 들릴 수 있지만, 제사장 의복에 반복하여 쓰이는 재료 설명을 함께 되울리기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
