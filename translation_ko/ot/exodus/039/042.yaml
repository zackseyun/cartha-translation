    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  english_pob_choice: According to all that
  chosen_korean: 모든 것대로
  alternatives_korean:
  - 그 모든 것에 따라
  - 명령하신 바 모두대로
  lexicon: HALOT
  rationale: 앞부분의 대응 구조를 한국어에서도 간결하게 살리기 위해 ‘모든 것대로’로 옮겼습니다. 명령과 შესრულ의 일치가 분명하게 드러납니다.
- source_word: צִוָּה יְהוָה אֶת מֹשֶׁה
  english_pob_choice: Yahweh had commanded Moses
  chosen_korean: 야훼께서 모세에게 명령하신
  alternatives_korean:
  - 야훼께서 모세를 명령하신
  - 야훼께서 모세에게 분부하신
  lexicon: HALOT
  rationale: 히브리어 צוה는 ‘명령하다’가 가장 مستقیم하며, אֶת מֹשֶׁה는 한국어에서 자연스럽게 여격 ‘모세에게’로 옮기는 것이 적절합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 원문의 남성 복수 표지를 살려 문자적으로 ‘이스라엘의 아들들’로 옮겼습니다. POB의 성별-정확 원칙과도 맞닿아 있습니다.
- source_word: אֵת כָּל הָעֲבֹדָה
  english_pob_choice: all the work
  chosen_korean: 그 모든 일
  alternatives_korean:
  - 모든 작업
  - 모든 역무
  lexicon: HALOT
  rationale: 성막 제작 문맥의 עֲבֹדָה는 단순한 일반 노동보다 ‘맡겨진 전체 작업’을 뜻하므로, 한국어에서는 ‘그 모든 일’이 가장 자연스럽고 포괄적입니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 고유명사를 보존하기 위해 전통적 대체어가 아니라 ‘야훼’를 사용했습니다. 이는 POB의 स्रोत-직결 원칙을 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 이스라엘 공동체를 가리키는 남성 복수 표현
  chosen_reading: 이스라엘의 아들들
  alternative_readings:
  - 이스라엘 자손
  - 이스라엘 사람들
  rationale: 문법적으로 남성 복수 구성형을 유지하여 원문 형식을 보존했습니다. 의미상으로는 이스라엘 공동체 전체를 가리킵니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
