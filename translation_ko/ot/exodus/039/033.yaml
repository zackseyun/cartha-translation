source:
  edition: WLC
  text: וַ/יָּבִ֤יאוּ אֶת הַ/מִּשְׁכָּן֙ אֶל מֹשֶׁ֔ה אֶת הָ/אֹ֖הֶל וְ/אֶת כָּל כֵּלָ֑י/ו קְרָסָ֣י/ו קְרָשָׁ֔י/ו בריח/ו וְ/עַמֻּדָ֥י/ו וַ/אֲדָנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
  footnotes:
  - marker: a
    text: Or 'boards' for 'frames.' The Hebrew term refers to the tabernacle's upright structural pieces.
    reason: lexical_alternative
  - marker: b
    text: Or 'sockets' for 'bases.' The Hebrew term can refer to the foundation pieces into which the structural elements were fitted.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들은 성막, 곧 천막과 그 모든 기구, 즉 그 고리들, 그 틀들, 그 가로대들, 그 기둥들과 그 받침들을 모세에게 가져왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘틀들’은 ‘널빤지들’로도 옮길 수 있습니다. 히브리어는 성막의 수직 구조 부재를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘받침들’은 ‘소켓들’로도 옮길 수 있습니다. 히브리어는 구조 부재가 끼워지는 기초 부분을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  english_pob_choice: Then they brought
  chosen_korean: 그러자 그들이 가져왔습니다
  alternatives_korean:
  - 그리고 그들이 가져왔습니다
  - 그들이 가져왔습니다
  lexicon: HALOT
  rationale: 연속 서술의 다음 동작을 나타내는 wayyiqtol을 자연스러운 한국어 서술 연결로 옮겼습니다.
- source_word: הַמִּשְׁכָּן
  english_pob_choice: the tabernacle
  chosen_korean: 성막
  alternatives_korean:
  - 장막
  - 거처
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 מִשְׁכָּן은 예배용 성소 구조를 가리키므로, 한국어 성경에서 널리 쓰이는 ‘성막’이 가장 정확합니다.
- source_word: קְרָשָׁיו
  english_pob_choice: its frames
  chosen_korean: 그 틀들
  alternatives_korean:
  - 그 널빤지들
  - 그 판재들
  lexicon: HALOT
  rationale: 본문의 구조물 기능을 살려 영어 POB의 ‘frames’에 맞추어 ‘틀들’로 옮겼습니다. 전통적 ‘널빤지들’보다 현대 한국어 독자가 구조적 의미를 더 잘 이해합니다.
- source_word: אֲדָנָיו
  english_pob_choice: its bases
  chosen_korean: 그 받침들
  alternatives_korean:
  - 그 소켓들
  - 그 밑받침들
  lexicon: HALOT
  rationale: קהילת적·기술적 용어인 ‘sockets’보다, 구조물을 받치는 기능을 분명히 드러내는 ‘받침들’이 현대 한국어에서 더 자연스럽습니다.
theological_decisions:
- issue: 장막 전체와 구성요소의 병렬 제시
  chosen_reading: ‘성막’을 먼저 말한 뒤 ‘곧 천막과 그 모든 기구’로 풀어 설명하여, 전체 구조와 세부 부품의 목록이라는 본문 흐름을 그대로 드러냈습니다.
  alternative_readings:
  - ‘성막과 천막과 그 모든 기구’로 단순 직역
  - ‘장막’으로만 압축
  rationale: 히브리어는 전체 명칭 뒤에 구성요소를 나열하는 방식이므로, 한국어도 설명적 병렬을 유지하는 편이 본문의 열거 효과를 더 잘 보존합니다.
  doctrine_reference: 성막 구조의 서술적 본문이며 신학적 해설을 덧붙이지 않음
