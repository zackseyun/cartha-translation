  source_fidelity: 원문은 흉패를 먼저 목적어로 제시하고, 그 제작 기법이 에봇과 같으며 사용 재료가 무엇인지를 이어서 밝힙니다. 초안은 재료를 문두로 옮기고 흉패를 ‘제사장 흉패’로 확장하여 이 구조와 명시성을 다소 바꾸었습니다. 또한 ‘가늘게 꼰’은 ‘곱고 잘 꼰’ 린넨이라는 뜻을 충분히 반영하지 못합니다.
  naturalness: 초안은 대체로 자연스럽지만, ‘에봇의 작업과 같았습니다’는 무엇이 같다는 것인지 다소 추상적입니다. ‘에봇을 만든 것과 같은 방식으로’가 현대 한국어에서 더 명료합니다. 색채 재료는 ‘청색·자색·홍색 실’로 묶어 쓰면 자연스럽고 재료성도 드러납니다.
  terminology: ‘흉패’와 ‘에봇’은 제의 의복의 확립된 기술 용어이므로 유지하는 것이 좋습니다. מַעֲשֵׂה חֹשֵׁב은 단순한 일반 직공의 일이 아니라 무늬를 고안·구현하는 숙련된 공예를 가리키므로 ‘정교하게 무늬를 짜는 솜씨’로 옮겼습니다.
