id: EXO.39.8
reference: Exodus 39:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אֶת הַ/חֹ֛שֶׁן מַעֲשֵׂ֥ה חֹשֵׁ֖ב כְּ/מַעֲשֵׂ֣ה אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
  footnotes:
  - marker: a
    text: Or "the work of an artistic weaver" for "the work of a skillful designer." The Hebrew phrase emphasizes skilled patterned craftsmanship.
    reason: lexical_alternative
  - marker: b
    text: Traditionally "breastplate." "Breastpiece" is used here to avoid suggesting metal armor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 정교하게 무늬를 짜는 솜씨로, 에봇을 만든 것과 같은 방식으로 금과 청색·자색·홍색 실과 곱게 꼰 베실을 써서 흉패를 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정교하게 무늬를 짜는 솜씨’는 ‘숙련된 장인의 작업’ 또는 ‘예술적으로 짜는 작업’으로도 옮길 수 있습니다. 히브리어 표현은 무늬를 고안하고 구현하는 숙련된 공예를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹשֶׁן
  english_pob_choice: the breastpiece
  chosen_korean: 제사장 흉패
  alternatives_korean:
  - 흉패
  - 가슴패
  lexicon: HALOT
  rationale: חֹשֶׁן은 제사장 예복의 가슴에 달리는 장식용 판을 가리키므로, 기능을 분명히 드러내는 ‘제사장 흉패’가 현대 독자에게 가장 정확합니다.
- source_word: מַעֲשֵׂה חֹשֵׁב
  english_pob_choice: the work of a skillful designer
  chosen_korean: 솜씨 있는 직공의 작업
  alternatives_korean:
  - 기교 있는 디자이너의 작업
  - 예술적 직조공의 작업
  - 능숙한 설계자의 작업
  lexicon: HALOT
  rationale: 이 표현은 단순 제작이 아니라 무늬를 넣어 정교하게 만드는 숙련된 공예를 뜻하므로, ‘솜씨 있는 직공의 작업’이 자연스럽고 원문의 기술성을 살립니다.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  english_pob_choice: like the work of the ephod
  chosen_korean: 에봇의 작업과 같았습니다
  alternatives_korean:
  - 에봇의 제작과 같았습니다
  - 에봇과 같은 방식으로 만들었습니다
  lexicon: HALOT
  rationale: 비교 대상은 물건 자체가 아니라 그 제작 방식이므로, ‘에봇의 작업과 같았습니다’로 간결하게 대응했습니다.
- source_word: וְתוֹלַעַת שָׁנִי
  english_pob_choice: scarlet yarn
  chosen_korean: 홍색 실
  alternatives_korean:
  - 주홍 실
  - 진홍 실
  - 붉은 실
  lexicon: HALOT
  rationale: 문맥이 직물 목록이므로 색 자체보다 재료성을 드러내는 ‘실’이 필요합니다. ‘홍색’은 전통적 성막 용어를 살리면서도 ‘scarlet’의 색채를 충분히 전달합니다.
theological_decisions:
- issue: 성막 직물 목록의 번역에서 소재와 색채를 어떻게 드러낼지
  chosen_reading: 색명만 나열하지 않고 각 재료가 실제 직물 재료임을 드러내도록 ‘실’과 ‘베실’을 보완해 옮겼습니다.
  alternative_readings:
  - 청색, 자색, 홍색, 가늘게 꼰 베
  - 청색 실, 자색 실, 홍색 실, 가늘게 꼰 베실
  rationale: 히브리어는 성막 장식에 쓰인 재료 목록이므로, 한국어에서도 물질성과 공예성을 보존해야 합니다.
  doctrine_reference: 출애굽기 성막/제의 문맥의 물질적 묘사 보존
- issue: ‘흉패’ 용어 유지 여부
  chosen_reading: 전통적 ‘흉패’를 쓰되, 문맥상 제사장 예복의 부분임을 ‘제사장 흉패’로 분명히 했습니다.
  alternative_readings:
  - 흉패
  - 가슴장식
  rationale: ‘breastpiece’의 기능을 살리면서도 한국어 성경 전통에서 알아보기 쉬운 용어를 병기하는 것이 가장 오해가 적습니다.
  doctrine_reference: 제사장 의복의 명칭 일관성
