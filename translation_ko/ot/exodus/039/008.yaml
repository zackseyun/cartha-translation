  to: 그는 정교하게 무늬를 짜는 솜씨로, 에봇을 만든 것과 같은 방식으로 금과 청색·자색·홍색 실과 곱게 꼰 베실을 써서 흉패를 만들었습니다.[a]
  rationale: 수정문은 원문의 순서(흉패 제작―숙련된 무늬 작업―에봇과 같은 방식―재료)를 가능한 한 유지했습니다. ‘흉패’와 ‘에봇’은 기술 용어로 보존하고, 색채 명칭에 ‘실’을 함께 적용해 재료 목록임을 한국어에서 분명히 했습니다. 기존 각주는 내용과 표지의 연결이 약하므로, 영어 감사 기록의 해당 어휘 주석과 일치하도록 교체했습니다.
  reviewer_model: gpt-5.6-terra
