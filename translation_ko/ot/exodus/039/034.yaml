    text: 히브리어 תְּחָשִׁים의 가리키는 대상은 확실하지 않습니다. 특정 동물의 가죽을 뜻할 수도 있고, 일반적인 고급 가죽을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  english_pob_choice: covering
  chosen_korean: 덮개
  alternatives_korean:
  - 커버
  - 덮음
  lexicon: HALOT
  rationale: 성막 물품 목록에서 ‘covering’을 자연스럽게 옮기면서도, 명사형으로서의 기능을 살리기 위해 ‘덮개’로 렌더링했습니다.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  english_pob_choice: ram skins dyed red
  chosen_korean: 붉게 물들인 숫양 가죽
  alternatives_korean:
  - 붉은 숫양 가죽
  - 붉게 염색한 숫양 가죽
  lexicon: HALOT
  rationale: ‘붉게 물들인’은 단순한 색상 묘사보다 가공·염색된 뉘앙스를 살리고, ‘숫양 가죽’은 원문의 복수형 ‘가죽들’을 한국어에서 자연스럽게 집약해 옮긴 것입니다.
- source_word: עֹרֹת הַתְּחָשִׁים
  english_pob_choice: fine leather
  chosen_korean: 고운 가죽
  alternatives_korean:
  - 질긴 가죽
  - 다루가죽
  - 해달 가죽
  - dugong 가죽
  lexicon: HALOT
  rationale: תְּחָשִׁים의 지시 대상이 불확실하므로 특정 동물명으로 단정하지 않고, POB의 ‘fine leather’에 맞추어 기능적으로 무난한 ‘고운 가죽’으로 번역했습니다.
- source_word: פָּרֹכֶת הַמָּסָךְ
  english_pob_choice: the veil of the screen
  chosen_korean: 가리개 휘장
  alternatives_korean:
  - 가리개의 휘장
  - 휘장
  - 문장
  lexicon: HALOT
  rationale: פָּרֹכֶת은 성막 문맥의 ‘휘장’이고, הַמָּסָךְ는 출입구용 ‘가리개/차단막’이므로 두 요소를 함께 살려 ‘가리개 휘장’으로 압축했습니다.
theological_decisions:
- issue: 성막 목록의 재질·기능 표현을 얼마나 특정할지
  chosen_reading: 원문의 재질 차이와 성막 내부 구분을 유지하면서도, 불확실한 부분은 특정 동물명으로 단정하지 않았습니다.
  alternative_readings:
  - ‘돌고래/듀공 가죽’처럼 동물을 특정하는 번역
  - 단순히 ‘휘장’으로만 평준화하는 번역
  rationale: 이 절은 예배 장치의 세부 목록이므로, 본문이 말하는 구별을 보존하는 것이 중요합니다. 동시에 תְּחָשִׁים의 불확실성은 해소되지 않았으므로 과도한 특정은 피했습니다.
  doctrine_reference: 출애굽기 25–40장 성막 규정의 본문 충실성
