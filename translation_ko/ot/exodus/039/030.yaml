  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
  footnotes:
  - marker: a
    text: Or, “Holiness to the LORD.”
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 순금으로 금패, 곧 거룩한 관을 만들고, 그 위에 인장을 새기듯이 “야훼께 거룩함”이라고 새겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께 성별됨.”
    reason: alternative_reading
lexical_decisions:
- source_word: צִיץ
  english_pob_choice: plate
  chosen_korean: 판
  alternatives_korean:
  - 금판
  - 패
  lexicon: HALOT
  rationale: 제사장 머리 장식에 붙는 금속 조각을 가리키므로, 꽃이나 장신구보다 기능을 드러내는 ‘판’이 문맥에 맞습니다.
- source_word: נֵזֶר הַקֹּדֶשׁ
  english_pob_choice: the holy crown
  chosen_korean: 거룩한 관
  alternatives_korean:
  - 성스러운 왕관
  - 성별된 관
  lexicon: HALOT
  rationale: נֵזֶר는 성별된 관/관식의 뜻이 있어, ‘관’으로 옮기되 ‘거룩한’으로 그 용도를 분명히 했습니다.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  english_pob_choice: like the engraving of a seal
  chosen_korean: 인장 새김처럼
  alternatives_korean:
  - 인장 각인처럼
  - 도장 새김처럼
  lexicon: HALOT
  rationale: 문구는 단순한 필기가 아니라 인장 새김의 양식을 말하므로, 짧고 압축된 한국어로 그 공예적 비유를 살렸습니다.
- source_word: קֹדֶשׁ לַיהוָה
  english_pob_choice: Holy to Yahweh
  chosen_korean: 야훼께 성결
  alternatives_korean:
  - 야훼께 거룩함
  - 야훼께 속한 거룩한 것
  lexicon: HALOT
  rationale: 히브리어의 짧은 명문형 표어를 살리기 위해 명사적 표어인 ‘성결’을 택했습니다. 이는 전통적 ‘거룩’보다 새겨진 표기의 힘을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기적 표제가 아닌 고유신명 יהוה를 직접 사용하므로, 프로젝트 표준에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: קֹדֶשׁ לַיהוָה의 의미 범주
  chosen_reading: 야훼께 성결
  alternative_readings:
  - 야훼께 거룩함
  - 야훼께 거룩하다
  rationale: 문구는 제의적 헌납 표어로서 물건에 새겨진 짧은 선언입니다. 한국어에서는 형용사문보다 명사형 표어가 새김문의 성격을 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, preserve theological tension where ambiguity is genuine
