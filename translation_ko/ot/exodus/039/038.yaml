lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  english_pob_choice: the gold altar
  chosen_korean: 금 제단
  alternatives_korean:
  - 황금 제단
  - 금으로 만든 제단
  lexicon: HALOT
  rationale: מִזְבַּח은 제단이고 הַזָּהָב은 ‘금’을 형용적으로 수식하므로, ‘금 제단’이 짧고 원문 구조를 잘 살립니다.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  english_pob_choice: the anointing oil
  chosen_korean: 관유
  alternatives_korean:
  - 기름부음의 기름
  - 도유용 기름
  lexicon: HALOT
  rationale: 성막 문맥에서 이미 굳어진 의례용 표현이므로, 의미를 과도하게 풀기보다 ‘관유’로 간결하게 옮겼습니다.
- source_word: קְטֹרֶת הַסַּמִּים
  english_pob_choice: the fragrant incense
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 향료의 향
  - 향긋한 향
  lexicon: HALOT
  rationale: קְטֹרֶת는 향/분향물이고 הַסַּמִּים은 향기로운 재료를 가리키므로, ‘향기로운 향’이 현대 한국어에서 자연스럽고 POB의 의미를 잘 반영합니다.
- source_word: מָסַךְ פֶּתַח הָאֹהֶל
  english_pob_choice: the screen for the entrance of the tent
  chosen_korean: 회막 입구의 휘장
  alternatives_korean:
  - 회막 입구의 가림막
  - 장막 문간의 휘장
  lexicon: HALOT
  rationale: מָסַךְ은 성막 문맥에서 입구용 가림막/휘장이고, הָאֹהֶל은 여기서 회막을 가리키므로 ‘회막 입구의 휘장’이 가장 자연스럽습니다.
theological_decisions:
- issue: 의례 물품 열거의 문체
  chosen_reading: 본문의 목록성을 살려 서술형으로 ‘... 만들었습니다’라고 옮겼습니다.
  alternative_readings:
  - 명사열거형으로만 제시
