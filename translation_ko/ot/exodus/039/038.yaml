translation:
  language: ko
  text: 금 제단과, 관유와, 향기로운 향과, 회막 입구의 휘장을 또한 만들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘금 제단’은 문자적으로는 ‘황금 제단’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘향기로운 향’은 문자적으로 ‘향료의 향’ 또는 ‘향료의 향물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘휘장’은 여기서 ‘문 입구의 가림막/커튼’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  english_pob_choice: the gold altar
  chosen_korean: 금 제단
  alternatives_korean:
  - 황금 제단
  - 금으로 만든 제단
  lexicon: HALOT
  rationale: מִזְבַּח은 제단이고 הַזָּהָב은 ‘금’을 형용적으로 수식하므로, ‘금 제단’이 짧고 원문 구조를 잘 살립니다.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  english_pob_choice: the anointing oil
  chosen_korean: 관유
  alternatives_korean:
  - 기름부음의 기름
  - 도유용 기름
  lexicon: HALOT
  rationale: 성막 문맥에서 이미 굳어진 의례용 표현이므로, 의미를 과도하게 풀기보다 ‘관유’로 간결하게 옮겼습니다.
- source_word: קְטֹרֶת הַסַּמִּים
  english_pob_choice: the fragrant incense
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 향료의 향
  - 향긋한 향
  lexicon: HALOT
  rationale: קְטֹרֶת는 향/분향물이고 הַסַּמִּים은 향기로운 재료를 가리키므로, ‘향기로운 향’이 현대 한국어에서 자연스럽고 POB의 의미를 잘 반영합니다.
- source_word: מָסַךְ פֶּתַח הָאֹהֶל
  english_pob_choice: the screen for the entrance of the tent
  chosen_korean: 회막 입구의 휘장
  alternatives_korean:
  - 회막 입구의 가림막
  - 장막 문간의 휘장
  lexicon: HALOT
  rationale: מָסַךְ은 성막 문맥에서 입구용 가림막/휘장이고, הָאֹהֶל은 여기서 회막을 가리키므로 ‘회막 입구의 휘장’이 가장 자연스럽습니다.
theological_decisions:
- issue: 의례 물품 열거의 문체
  chosen_reading: 본문의 목록성을 살려 서술형으로 ‘... 만들었습니다’라고 옮겼습니다.
  alternative_readings:
  - 명사열거형으로만 제시
  - 과거분사형으로 직역
  rationale: 이 절은 성막 기물의 제작 내역을 요약하는 결산 문맥이므로, 한국어에서는 완결된 서술문으로 제시하는 것이 읽기와 정보 전달에 유리합니다.
  doctrine_reference: 성막 제작 보고 문맥(출 39장 전체)
