id: EXO.39.3
reference: Exodus 39:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְרַקְּע֞וּ אֶת פַּחֵ֣י הַ/זָּהָב֮ וְ/קִצֵּ֣ץ פְּתִילִם֒ לַ/עֲשׂ֗וֹת בְּ/ת֤וֹךְ הַ/תְּכֵ֨לֶת֙ וּ/בְ/ת֣וֹךְ הָֽ/אַרְגָּמָ֔ן וּ/בְ/ת֛וֹךְ תּוֹלַ֥עַת הַ/שָּׁנִ֖י וּ/בְ/ת֣וֹךְ הַ/שֵּׁ֑שׁ מַעֲשֵׂ֖ה חֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
  footnotes:
  - marker: a
    text: Or 'plates of gold' instead of 'sheets of gold.' The Hebrew refers to thin hammered pieces of metal.
    reason: lexical_alternative
  - marker: b
    text: Or 'cut threads' or 'cut it into strips.' The sense is that the gold was prepared as fine filaments to be woven into the fabric.
    reason: lexical_alternative
  - marker: c
    text: '''The work of a skillful designer'' renders a technical expression for expert artistic workmanship; some render ''the work of a skillful craftsman'' or ''an artistic weaver.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 금판[a]을 두드려 얇게 펴고, 그것을 가늘게 잘라 금실로 만들었습니다[b]. 그리고 그 금실을 청색 실과 자색 실과 홍색 실과 고운 베에 섞어 정교한 무늬를 짜게 하였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פַּחֵי הַזָּהָב는 얇게 두드려 만든 금판 또는 금박 조각을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 פְּתִילִם은 ‘실가닥들’ 또는 ‘가느다란 띠들’로도 옮길 수 있습니다. 여기서는 직물에 섞어 짜기 위해 금을 가늘게 만든 것을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 מַעֲשֵׂה חֹשֵׁב은 정교하게 계획하거나 무늬를 낸 전문 공예 작업을 가리킵니다. ‘숙련된 장인의 작업’ 또는 ‘정교한 직조 작업’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ / פַּחֵי הַזָּהָב
  english_pob_choice: They hammered out sheets of gold
  chosen_korean: 금판을 두드려 폈다
  alternatives_korean:
  - 금판을 편다
  - 금판을 두들겨 폈다
  - 금판을 얇게 폈다
  lexicon: HALOT
  rationale: רקע는 금속을 두드려 얇게 펴는 동작이므로, ‘금판을 두드려 폈다’가 공정 작업의 의미를 자연스럽게 살립니다.
- source_word: וְקִצֵּץ פְּתִילִם
  english_pob_choice: and cut it into threads
  chosen_korean: 실처럼 잘랐다
  alternatives_korean:
  - 실로 잘랐다
  - 실가닥으로 잘랐다
  - 끈처럼 잘랐다
  lexicon: HALOT
  rationale: פְּתִילִם은 직조에 넣을 수 있는 가는 선들을 가리키므로, ‘실처럼’이 금 조각을 가는 섬유형 요소로 준비했다는 뜻을 잘 드러냅니다.
- source_word: בְּתוֹךְ הַתְּכֵלֶת / הָאַרְגָּמָן / תּוֹלַעַת הַשָּׁנִי / הַשֵּׁשׁ
  english_pob_choice: into the blue ... and into the fine linen
  chosen_korean: 청색과 자색과 홍색 실과 가는 베실 사이에 넣어
  alternatives_korean:
  - 청색과 자색과 홍색 실과 가는 베실 속에
  - 청색과 자색과 홍색 실과 가는 베실 가운데에
  - 청색과 자색과 홍색 실과 가는 베실에
  lexicon: HALOT
  rationale: 반복되는 בְּתוֹךְ는 단순한 ‘안에’보다 직조 안으로 ‘넣어’ 섞는 뜻이 강하므로, 직물에 금실을 끼워 넣는 장면을 분명히 했습니다.
- source_word: מַעֲשֵׂה חֹשֵׁב
  english_pob_choice: the work of a skillful designer
  chosen_korean: 솜씨 있는 설계자의 작업
  alternatives_korean:
  - 솜씨 있는 기술자의 작업
  - 능숙한 직조공의 작업
  - 숙련된 장인의 작업
  lexicon: HALOT
  rationale: מַעֲשֵׂה חֹשֵׁב은 단순한 노동보다 정교한 무늬를 설계·구성하는 전문적 솜씨를 가리키므로, ‘설계자’로 기술적 의미를 살렸습니다.
theological_decisions:
- issue: 직물 제작 묘사의 기술어를 현대 한국어로 어떻게 살릴지
  chosen_reading: 본문은 예배용 직물의 정교한 직조 기술을 강조하는 묘사로 읽고, 문체는 평서형 합쇼체로 유지했습니다.
  alternative_readings:
  - 더 장엄한 성경문체로 옮김
  - 전통 교회어휘를 우선 사용함
  rationale: 출애굽기 성막 문맥의 공예적 디테일을 흐리지 않으면서도 현대 독자가 즉시 이해할 수 있게 하는 것이 적절합니다.
  doctrine_reference: 출 39장 성막 제작 문맥
- issue: ‘청색/자색/홍색’과 ‘가는 베실’의 배열
  chosen_reading: 색깔과 재료를 병렬로 나열해, 금실이 각 직물 요소 사이에 들어가는 구조를 그대로 반영했습니다.
  alternative_readings:
  - 색을 하나의 묶음으로 처리함
  - 베실을 먼저 언급함
  rationale: 히브리어의 반복 구조와 삽입 동작을 보존해야 금실 직조의 시각적·기술적 대비가 살아납니다.
  doctrine_reference: 본문 구조 보존 원칙
