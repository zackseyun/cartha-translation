  source_fidelity: 히브리어는 금판을 두드려 얇게 편 뒤 그것을 가는 실가닥으로 잘라, 청색·자색·홍색 재료와 고운 베에 섞어 정교한 무늬의 직조 작업을 하게 한 과정을 묘사합니다. 초안의 ‘사이에’는 각각의 재료 속으로 금실을 섞어 넣는 뜻을 ‘재료들 사이’라는 공간적 뜻으로 바꾸며, ‘이는 … 작업이었습니다’도 원문의 공예 기법 수식을 부자연스럽게 처리합니다.
