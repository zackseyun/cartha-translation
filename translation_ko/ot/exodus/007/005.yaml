  text: 내가 이집트 위에 내 손을 뻗고 이스라엘 자손을 그들 가운데서 이끌어 낼 때에, 이집트 사람들은 내가 야훼임을 알게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어 ‘이스라엘의 아들들’을 옮긴 관용적 표현입니다. ‘이스라엘 사람들’ 또는 ‘이스라엘 백성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 하나님의 이름 יהוה는 전통적으로 ‘여호와’로 옮기기도 하지만, 여기서는 고유 이름을 보존하여 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
