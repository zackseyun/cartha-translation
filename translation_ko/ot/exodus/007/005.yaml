  - 이집트인들은 ... 알게 될 것입니다
  lexicon: HALOT
  rationale: מִצְרַיִם은 여기서 지명이 아니라 사람들을 가리키므로, 집단을 분명히 드러내는 ‘이집트 사람들’이 가장 자연스럽고 원문의 복수 주어를 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문은 신적 칭호가 아니라 고유한 언약 이름인 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 가족 표현을 그대로 드러내기 위해 직역에 가까운 ‘이스라엘의 아들들’을 택했습니다.
- source_word: מִתּוֹכָם
  english_pob_choice: out from among them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그들 한가운데서
  - 그들 가운데로부터
  lexicon: HALOT
  rationale: 이 표현은 이집트인들 가운데 있던 상태에서의 분리를 뜻하므로, 한국어에서는 자연스럽게 ‘그들 가운데서’로 옮겨 원문의 분리 감각을 살렸습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 효과는 하나님이 누구인지 이집트가 알게 되는 데 있으므로, 전통적 대체어인 ‘주님’보다 고유 이름 ‘야훼’를 유지하는 것이 계시의 초점을 더 직접적으로 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
