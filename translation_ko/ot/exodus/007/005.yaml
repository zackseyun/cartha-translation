    rationale: ‘이집트에 내밀 때’는 손을 내미는 대상과 대적·심판의 방향성을 다소 흐립니다. ‘이집트 위에 내 손을 뻗고’는 원문의 공간 은유와 문맥상 대적성을 보존합니다.
