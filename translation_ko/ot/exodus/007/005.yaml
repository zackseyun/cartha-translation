revisions:
- from: 내가 내 손을 이집트에 내밀 때에 이집트 사람들은 내가 야훼인 줄 알게 될 것입니다. 그리고 나는 이스라엘의 아들들을 그들 가운데서 인도하여 낼 것입니다.[a][b]
  to: 내가 이집트 위에 내 손을 뻗고 이스라엘 자손을 그들 가운데서 이끌어 낼 때에, 이집트 사람들은 내가 야훼임을 알게 될 것입니다.[a][b]
  rationale: 시간절을 문두에 배치하여 ‘손을 뻗는 일’과 ‘이스라엘 자손을 이끌어 내는 일’ 모두가 이집트 사람들이 야훼를 알게 되는 계기가 된다는 원문 구조를 보존했습니다. ‘이집트 위에’로 עַל의 방향성과 심판 맥락을 유지했고, 자연스러운 관용 표현인 ‘이스라엘 자손’을 채택하되 각주에서 히브리어의 직역적 형태를 밝혔습니다. 신명 각주도 한국어 독자에게 직접 관련되는 전통 표기로 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T12:42:26Z'
