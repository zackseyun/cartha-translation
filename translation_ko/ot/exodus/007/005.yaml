base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: The divine name is YHWH, traditionally rendered 'the LORD' in English translations.
    reason: alternative_reading
translation:
  language: ko
  text: 내가 내 손을 이집트에 내밀 때에 이집트 사람들은 내가 야훼인 줄 알게 될 것입니다. 그리고 나는 이스라엘의 아들들을 그들 가운데서 인도하여 낼 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 아들들’은 히브리어의 직역입니다. 문맥상 ‘이스라엘 사람들’ 또는 ‘이스라엘 자손’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 하나님의 이름 יהוה는 전통적으로 영어 성경에서 ‘the LORD’로 대체되지만, 여기서는 고유 이름을 보존하여 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדְעוּ מִצְרַיִם
  english_pob_choice: And the Egyptians will know
  chosen_korean: 이집트 사람들은 ... 알게 될 것입니다
  alternatives_korean:
