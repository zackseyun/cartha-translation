  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
  footnotes:
  - marker: a
    text: Or 'Pharaoh's heart grew hard.' The Hebrew verb can be rendered more literally as 'became strong/firm,' here in the sense of hardening.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 파라오의 마음은 완악해졌고[a], 그는 그들의 말을 듣지 않았습니다. 이는 야훼께서 말씀하신 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파라오의 마음이 굳어졌다.’ 히브리어 동사는 더 문자적으로는 ‘강해졌다/굳세어졌다’로 옮길 수 있으며, 여기서는 완악해짐의 의미로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק / לֵב
  english_pob_choice: was hardened / heart
  chosen_korean: 마음은 완악해졌고
  alternatives_korean:
  - 마음은 굳어졌고
  - 마음은 강해졌고
  - 마음은 완강해졌고
  lexicon: HALOT
  rationale: חזק의 결과 상태를 한국어로 자연스럽게 드러내기 위해 ‘완악해지다’를 택했습니다. ‘굳어지다’도 가능하지만, 출애굽기의 반복되는 완악화 문맥을 더 직접적으로 살립니다.
- source_word: שָׁמַע אֲלֵהֶם
  english_pob_choice: did not listen to them
  chosen_korean: 그가 그들에게 듣지 않았습니다
  alternatives_korean:
  - 그들의 말을 듣지 않았습니다
  - 그들에게 귀를 기울이지 않았습니다
  - 그들을 청종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע + אֶל의 의미를 살려 단순한 청각이 아니라 응답·순종의 거부를 나타내는 ‘듣지 않았다’로 옮겼습니다. ‘청종하다’는 교회적 문어체가 강해 현대 문체에 맞춰 피했습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר
  english_pob_choice: just as Yahweh had spoken
  chosen_korean: 야훼께서 말씀하신 그대로입니다
  alternatives_korean:
  - 야훼께서 말씀하신 대로입니다
  - 야훼께서 이미 말씀하신 바와 같습니다
  lexicon: HALOT
  rationale: כַּאֲשֶׁר의 대응을 ‘그대로’로 간결하게 살렸고, דִּבֶּר는 미리 주어진 말씀의 성취를 드러내기 위해 ‘말씀하신’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 본문의 고유명사 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭이 아닌 신적 고유명을 보존했습니다.
theological_decisions:
- issue: 파라오의 마음 완악함에서 행위자 명시 여부
  chosen_reading: 본문의 상태 진술을 따라 ‘마음은 완악해졌고’로 옮기고, 직접적으로 하나님이 그 행위의 주체라고 덧붙이지 않았습니다.
  alternative_readings:
  - 하나님께서 파라오의 마음을 완악하게 하셨고
  - 파라오의 마음이 완악해졌습니다
  rationale: 히브리어는 여기서 결과 상태를 진술할 뿐, 이 절 안에 행위자를 명시하지 않습니다. 따라서 출애굽기의 긴장—파라오의 완악함과 하나님의 주권적 말씀의 성취—를 이 절에서 미리 해소하지 않고 보존합니다.
  doctrine_reference: 출애굽기의 완악화 긴장 보존
