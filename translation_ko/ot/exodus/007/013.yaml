  source_fidelity: ‘마음은 완악해졌고’는 וַיֶּחֱזַק לֵב־פַּרְעֹה의 상태 변화를 적절히 옮기며, 행위자를 덧붙이지 않아 본문의 모호성을 보존합니다. 다만 ‘그가 그들에게 듣지 않았습니다’는 히브리어 שָׁמַע אֲלֵהֶם의 뜻과 한국어 용법 모두에서 부자연스럽습니다. ‘그들의 말을 듣지 않았습니다’가 ‘그들에게 귀 기울이지 않았다/그들을 따르지 않았다’는 의미를 자연스럽게 전달합니다. 마지막 절은 앞선 서술에 대한 ‘야훼께서 말씀하신 그대로’라는 대응이므로 과거 서술형으로 연결하는 것이 적절합니다.
  naturalness: 합쇼체 서술에는 ‘그들의 말을 듣지 않았습니다’가 자연스럽습니다. 원안의 ‘그들에게 듣지 않았습니다’는 목적격/부사격 결합이 어색합니다. 또한 ‘말씀하신 그대로입니다’보다 ‘말씀하신 그대로였습니다’가 사건 서술의 시제와 문장 흐름에 맞습니다.
  terminology: ‘파라오’, ‘마음’, ‘완악해졌고’, ‘야훼’는 현대 표준어의 격식 있는 성경 번역 문체에서 적절합니다. ‘완악해졌다’는 חזק의 문맥적 의미를 잘 전달하며, 각주가 더 문자적인 대안을 제시합니다.
