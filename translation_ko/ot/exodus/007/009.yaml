  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
  footnotes:
  - marker: a
    text: Or 'dragon'; the Hebrew tannin can refer more broadly to a serpent, sea creature, or dragon-like creature depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오가 너희에게 말하여 ‘너희를 위해 표징을 내놓으라’ 할 때, 너는 아론에게 ‘네 지팡이를 가져다가 파라오 앞에 던져라. 그것이 뱀이 되게 하라’ 하고 말하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용’. 히브리어 타닌(tannin)은 문맥에 따라 뱀, 바다 생물, 또는 용과 비슷한 생물을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יְדַבֵּר אֲלֵ/כֶם פַּרְעֹה
  english_pob_choice: When Pharaoh speaks to you
  chosen_korean: “바로 그때 바로 그때”
  alternatives_korean:
  - “파라오가 너희에게 말할 때”
  - “파라오가 너희에게 말하면”
  lexicon: HALOT
  rationale: The Hebrew opens with a future-oriented temporal clause; Korean should likewise mark the expected situation naturally. The draft needs to be revised to a proper source-grounded temporal rendering.
- source_word: מוֹפֵת
  english_pob_choice: sign
  chosen_korean: 표징
  alternatives_korean:
  - 기적
  - 징조
  - 표적
  lexicon: HALOT
  rationale: מוֹפֵת is a demonstrative miraculous sign or portent. In Korean, 표징 is a source-direct rendering that keeps the demonstrative force without overcommitting to later theological vocabulary.
- source_word: מַטְּךָ
  english_pob_choice: your staff
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 지팡이
  lexicon: HALOT
  rationale: מַטֶּה is a staff/rod. 지팡이는 현대 한국어에서 자연스럽고, 출애굽기의 표징 도구로서 문맥상 적절합니다.
- source_word: תַנִּין
  english_pob_choice: serpent
  chosen_korean: 뱀
  alternatives_korean:
  - 뱀
  - 용
  lexicon: HALOT
  rationale: The POB English chose 'serpent' and preserved the broader lexical range in a footnote. Korean 뱀 is the most context-fitting equivalent here; 용 would introduce stronger mythic overtones than the scene warrants.
theological_decisions:
- issue: Rendering of תַנִּין in the staff-sign narrative
  chosen_reading: 뱀
  alternative_readings:
  - 용
  - 거대한 파충류
  rationale: The narrative context is a sign before Pharaoh, and the transformed staff functions as a serpent-like creature. Korean 뱀 preserves the immediate sense while leaving the broader semantic range available through a footnote if needed.
  doctrine_reference: Preserve lexical breadth without erasing the narrative sign-function.
