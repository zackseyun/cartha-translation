translation:
  language: ko
  text: 각 사람이 자기 지팡이를 내던지자, 그것들이 뱀들[a]이 되었습니다. 그러나 아론의 지팡이가 그들의 지팡이들을 삼켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용들’ 또는 ‘큰 파충류들’. 히브리어 תַּנִּין은 보통 ‘뱀’으로 번역되는 말보다 더 넓은 범위의 뱀과 비슷한 생물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ / אִישׁ
  english_pob_choice: threw down / each man
  chosen_korean: 각 사람이 … 내던지니
  alternatives_korean:
  - 각 사람이 … 던지니
  - 사람마다 … 내던지니
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미를 살려 ‘각 사람’으로 옮기고, שׁלך의 아래로 던지는 동작은 ‘내던지다’로 자연스럽게 드러냈습니다.
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  english_pob_choice: staff / staff / staffs
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 막대
  - 홀
  lexicon: HALOT
  rationale: 이 장면의 지팡이는 권위의 홀보다 휴대하는 막대에 가까우므로, 현대 한국어에서 가장 자연스럽고 구체적인 ‘지팡이’를 선택했습니다.
- source_word: לְתַנִּינִם
  english_pob_choice: serpents
  chosen_korean: 뱀들
  alternatives_korean:
  - 용들
  - 큰 뱀들
  - 큰 파충류들
  lexicon: HALOT
  rationale: תַּנִּין은 범위가 넓지만, 바로 앞의 지팡이가 생명체로 변하는 표지 장면에서는 독자가 즉시 이해할 수 있는 ‘뱀들’이 가장 적절합니다.
- source_word: וַיִּבְלַע
  english_pob_choice: swallowed up
  chosen_korean: 삼켜 버렸습니다
  alternatives_korean:
  - 삼켰습니다
  - 집어삼켰습니다
  lexicon: HALOT
  rationale: בלע의 완결된 소멸감을 살리기 위해 ‘삼켜 버리다’를 택해, 아론의 지팡이가 그들의 지팡이들을 완전히 압도하는 장면을 분명히 했습니다.
theological_decisions:
- issue: 아론의 지팡이가 변한 존재를 어떻게 묘사할지
  chosen_reading: 본문의 서술은 ‘뱀들’로 옮기되, 히브리어 תַּנִּין의 더 넓은 의미 가능성은 각주로 보존했습니다.
  alternative_readings:
  - 용들
  - 큰 파충류들
  - 바다괴물들
  rationale: 본문의 즉각적 서사 효과는 뱀의 이미지가 가장 분명하지만, 원어의 의미 범위가 더 넓어 단일화가 과도하지 않도록 했습니다.
  doctrine_reference: 출애굽기 7:12의 표적 서사
