translation:
  language: ko
  text: 나일 강에는 개구리들이 우글거릴 것이며, 그것들이 올라와 당신의 집과 침실과 침대 위로, 당신의 종들의 집들과 당신의 백성 가운데로, 당신의 화덕들과 반죽 그릇들 안으로 들어갈 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “반죽 통들”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרַץ
  english_pob_choice: will swarm
  chosen_korean: 가득할 것이며
  alternatives_korean:
  - 우글거릴 것입니다
  - 떼를 이룰 것입니다
  lexicon: HALOT
  rationale: 개구리의 대량 출현과 들끓는 이미지를 한국어로 자연스럽게 살리되, 단순한 수량 설명으로 약화되지 않도록 했습니다.
- source_word: הַיְאֹר
  english_pob_choice: The Nile
  chosen_korean: 나일 강
  alternatives_korean:
  - 그 강
  - 나일
  lexicon: HALOT
  rationale: 출애굽기의 이집트 문맥에서 יְאֹר는 나일을 가리키므로, 지리적 의미를 분명히 드러냈습니다.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  english_pob_choice: your kneading bowls
  chosen_korean: 반죽 그릇들
  alternatives_korean:
