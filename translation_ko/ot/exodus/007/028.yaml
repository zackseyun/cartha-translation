  - 반죽 대야들
  lexicon: HALOT
  rationale: 반죽을 담는 용기를 가리키는 점을 살려 현대 한국어로 풀었고, 영어 본문의 각주 대안인 ‘kneading troughs’도 포괄할 수 있게 했습니다.
- source_word: וּבְבֵית עֲבָדֶיךָ / וּבְעַמֶּךָ
  english_pob_choice: the houses of your servants / your people
  chosen_korean: 당신의 종들의 집들과 당신의 백성 가운데
  alternatives_korean:
  - 당신의 신하들의 집들과 당신의 백성 속에
  - 당신의 종들의 집들과 당신의 백성 안에
  lexicon: HALOT
  rationale: 종들의 집과 백성 가운데까지 번지는 침입성을 살리기 위해 장소 전치사를 문맥에 맞게 자연스럽게 옮겼습니다.
