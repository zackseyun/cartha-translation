base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
  footnotes:
  - marker: a
    text: Or “kneading troughs.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나일 강은 개구리들로 가득할 것이며, 그것들이 올라와 당신의 집, 당신의 침실, 당신의 침대 위, 당신의 종들의 집들과 당신의 백성 가운데, 당신의 화덕들과 반죽 그릇들 안으로 들어갈 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “반죽 통들”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרַץ
  english_pob_choice: will swarm
  chosen_korean: 가득할 것이며
  alternatives_korean:
  - 우글거릴 것입니다
  - 떼를 이룰 것입니다
  lexicon: HALOT
  rationale: 개구리의 대량 출현과 들끓는 이미지를 한국어로 자연스럽게 살리되, 단순한 수량 설명으로 약화되지 않도록 했습니다.
- source_word: הַיְאֹר
  english_pob_choice: The Nile
  chosen_korean: 나일 강
  alternatives_korean:
  - 그 강
  - 나일
  lexicon: HALOT
  rationale: 출애굽기의 이집트 문맥에서 יְאֹר는 나일을 가리키므로, 지리적 의미를 분명히 드러냈습니다.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  english_pob_choice: your kneading bowls
  chosen_korean: 반죽 그릇들
  alternatives_korean:
  - 반죽 통들
  - 반죽 대야들
  lexicon: HALOT
  rationale: 반죽을 담는 용기를 가리키는 점을 살려 현대 한국어로 풀었고, 영어 본문의 각주 대안인 ‘kneading troughs’도 포괄할 수 있게 했습니다.
- source_word: וּבְבֵית עֲבָדֶיךָ / וּבְעַמֶּךָ
  english_pob_choice: the houses of your servants / your people
  chosen_korean: 당신의 종들의 집들과 당신의 백성 가운데
  alternatives_korean:
  - 당신의 신하들의 집들과 당신의 백성 속에
  - 당신의 종들의 집들과 당신의 백성 안에
  lexicon: HALOT
  rationale: 종들의 집과 백성 가운데까지 번지는 침입성을 살리기 위해 장소 전치사를 문맥에 맞게 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 재앙의 침입 범위 표현
  chosen_reading: 개구리들이 공간들을 '들어가는' 구체적 침입으로 묘사했습니다.
  alternative_readings:
  - 단순히 '있을 것입니다'로 완화
  - '''퍼질 것입니다''로 일반화'
  rationale: 본문은 나일에서 시작해 거주 공간과 생활 도구까지 침투하는 재앙의 강도를 강조하므로, 장소 이동 동사를 살렸습니다.
  doctrine_reference: 출애굽기 7:28 문맥의 재앙 서술
