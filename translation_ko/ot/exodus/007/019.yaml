  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
  footnotes:
  - marker: a
    text: Or more literally, “and in the wood and in the stone,” likely referring to wooden and stone vessels or containers.
    reason: lexical_alternative
  - marker: b
    text: Or 'even in the wood and in the stone containers.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. “아론에게 말하여라. ‘네 지팡이를 가져다가 네 손을 이집트의 물 위로, 곧 그들의 강들과 나일 수로들과 연못들과 모여 있는 모든 물 위로 뻗어라. 그 물들이 피가 되게 하여라. 이집트 온 땅에 피가 있게 될 것이며, 나무와 돌로 된 그릇들에도[a][b] 피가 있게 될 것이다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, ‘나무들과 돌들에도’. 문맥상 나무와 돌로 만든 그릇이나 용기를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나무와 돌로 된 용기들에도’.
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: WLC/HALOT
  rationale: 사적인 이름 יְהוָה를 제목어로 바꾸지 않고, 프로젝트 기본값에 따라 음역하여 하나님의 고유성을 보존했습니다.
- source_word: מַטְּךָ
  english_pob_choice: your staff
  chosen_korean: 네 지팡이
  alternatives_korean:
  - 네 막대기
  - 네 몽둥이
  lexicon: WLC/HALOT
  rationale: מַטֶּה는 모세-아론 이야기에서 표적을 행하는 구체적 도구이므로, 자연스러운 현대 한국어인 ‘지팡이’로 옮겼습니다.
- source_word: יְאֹרֵיהֶם
  english_pob_choice: their Nile canals
  chosen_korean: 그들의 나일 수로들
  alternatives_korean:
  - 그들의 수로들
  - 그들의 나일 운하들
  lexicon: WLC/HALOT
  rationale: 이집트 맥락의 יְאֹר는 단순한 강보다 나일계 수로를 가리키는 경우가 많아, ‘나일 수로들’로 번역해 지역성을 살렸습니다.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  english_pob_choice: every collection of their waters
  chosen_korean: 그들의 모든 물 모임
  alternatives_korean:
  - 그들의 모든 물 저장소
  - 그들의 모든 물웅덩이
  lexicon: WLC/HALOT
  rationale: מִקְוֶה는 ‘모인 물’이라는 개념이 핵심이므로, 특정 시설을 단정하지 않고 ‘물 모임’으로 최대한 가깝게 옮겼습니다.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  english_pob_choice: even in wooden and stone vessels
  chosen_korean: 나무로 된 그릇들과 돌로 된 그릇들에도
  alternatives_korean:
  - 나무와 돌에도
  - 나무와 돌로 된 용기들에도
  lexicon: WLC/HALOT
  rationale: 본문의 ‘나무’와 ‘돌’은 물을 담는 그릇들을 가리키는 축약 표현으로 이해하는 것이 문맥상 자연스러워, 재질을 분명히 드러냈습니다.
theological_decisions:
- issue: 유월 재앙의 범위와 ὑπονοούμενον(암시) 의미를 어떻게 드러낼지
  chosen_reading: 물의 원천들뿐 아니라 저장된 물그릇까지 피로 변하는 광범위한 심판으로 표현했습니다.
  alternative_readings:
  - 물 자체만 피로 변하는 것으로 제한
  - ‘나무와 돌’의 문자적 표현을 그대로 두기
  rationale: 이 절은 이집트의 물 시스템 전반을 열거한 뒤 마지막에 축약된 표현을 사용하므로, 문맥이 요구하는 심판의 확장성을 한국어 본문에서도 드러내는 것이 적절합니다.
  doctrine_reference: Exodus plague narrative; source-context interpretation of elliptical materials phrase
