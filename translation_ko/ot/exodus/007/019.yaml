- from: 그때 야훼께서 모세에게 말씀하셨습니다. “아론에게 말하여라. ‘네 지팡이를 가져다가 네 손을 이집트의 물 위에 뻗어라—그들의 강들과 그들의 나일 수로들과 그들의 연못들과 그들의 모든 물 모임 위에 뻗어라. 그것들이 피가 되게 하려는 것이다. 그리고 이집트 온 땅에는 피가 있으리니, 나무로 된 그릇들과 돌로 된 그릇들에도 피가 있을 것이다.’”[a][b]
  to: 그때 야훼께서 모세에게 말씀하셨습니다. “아론에게 말하여라. ‘네 지팡이를 가져다가 네 손을 이집트의 물 위로, 곧 그들의 강들과 나일 수로들과 연못들과 모여 있는 모든 물 위로 뻗어라. 그 물들이 피가 되게 하여라. 이집트 온 땅에 피가 있게 될 것이며, 나무와 돌로 된 그릇들에도[a][b] 피가 있게 될 것이다.’”
  rationale: 명령문과 그 결과를 원문의 통사 관계에 맞게 바로잡고, 부자연스러운 ‘물 모임’을 자연스러운 현대 한국어로 고쳤습니다. 마지막의 해석적 보충은 본문에 유지하되, 히브리어의 생략된 문자 표현과 대체 번역을 바로 그 위치의 주석으로 보존했습니다.
