  text: The frogs will come up on you[a], on your people, and on all your servants.
  footnotes:
  - marker: a
    text: Or 'among your people' in the second phrase; the Hebrew preposition is the same throughout, but the context favors the sense of the frogs coming upon Pharaoh and his realm as an affliction.
    reason: lexical_alternative
translation:
  language: ko
  text: 개구리들이 당신에게, 당신의 백성에게, 그리고 당신의 모든 종들에게 올라올 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 같은 전치사 בְּ가 세 구절에 반복되며, 문맥상 두 번째 구절은 ‘당신의 백성 가운데’로도 옮길 수 있습니다. 그러나 앞뒤 평행성과 재앙의 압박감을 살려 본문은 모두 ‘에게’/‘들에게’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּךָ / בְּעַמְּךָ / בְּכָל עֲבָדֶיךָ
  english_pob_choice: on you / on your people / on all your servants
  chosen_korean: 당신에게, 당신의 백성에게, 그리고 당신의 모든 종들에게
  alternatives_korean:
  - 당신 위에, 당신의 백성 위에, 그리고 당신의 모든 종 위에
  - 당신에게, 당신의 백성 가운데, 그리고 당신의 모든 신하들에게
  lexicon: HALOT
  rationale: 반복된 전치사 בְּ는 재앙이 파라오와 그의 영역에 ‘임하는’ 뜻을 살려야 하므로, 한국어는 조사로 자연스럽게 옮기되 ‘가운데’보다 ‘에게’/‘들에게’를 택해 압박과 재앙의 감각을 유지했습니다.
- source_word: יַעֲלוּ
  english_pob_choice: will come up
  chosen_korean: 올라올 것입니다
  alternatives_korean:
  - 올라갈 것입니다
  - 솟아오를 것입니다
  lexicon: HALOT
  rationale: 동사 עָלָה의 상향 이동 이미지를 살리면서도 개구리가 니일에서 나오는 장면에 자연스러운 현대 한국어로 표현했습니다.
- source_word: הַצְּפַרְדְּעִים
  english_pob_choice: the frogs
  chosen_korean: 개구리들이
  alternatives_korean:
  - 그 개구리들이
  - 개구리떼가
  lexicon: HALOT
  rationale: 히브리어 정관사는 특정 재앙으로 예고된 개구리 떼를 가리키지만, 한국어에서는 문맥상 이미 알려진 대상이므로 별도의 정관사 없이 복수형으로 옮겼습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 모든 종들
  alternatives_korean:
  - 당신의 모든 신하들
  - 당신의 모든 노예들
  lexicon: HALOT
  rationale: עֶבֶד는 문맥상 궁정 인원까지 포괄할 수 있으나, 본문이 강조하는 것은 파라오 휘하의 종속된 사람들 전체이므로 ‘종들’이 가장 무난하며, ‘노예들’은 신분을 과도하게 특정합니다.
theological_decisions:
- issue: 파라오를 향한 재앙의 방향성
  chosen_reading: 재앙이 파라오 ‘안’이 아니라 파라오와 그의 백성 위로/에게로 임하는 심판적 압박으로 드러나게 했습니다.
  alternative_readings:
  - ‘당신 가운데’로 옮겨 재앙의 내재성을 강조할 수 있습니다.
  - ‘against you’처럼 노골적인 적대 방향으로 옮길 수 있습니다.
  rationale: 문맥상 이 절은 재앙의 도래와 파라오 권역 전체의 타격을 예고하므로, 한국어에서도 외부에서 덮쳐 오는 심판의 성격을 분명히 해야 합니다.
  doctrine_reference: 출애굽기 7장의 재앙 서술 맥락
