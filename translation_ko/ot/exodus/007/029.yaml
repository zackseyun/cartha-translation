  rationale: 문맥상 이 절은 재앙의 도래와 파라오 권역 전체의 타격을 예고하므로, 한국어에서도 외부에서 덮쳐 오는 심판의 성격을 분명히 해야 합니다.
  doctrine_reference: 출애굽기 7장의 재앙 서술 맥락
