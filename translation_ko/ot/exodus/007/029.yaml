- issue: 파라오를 향한 재앙의 방향성
  chosen_reading: 재앙이 파라오 ‘안’이 아니라 파라오와 그의 백성 위로/에게로 임하는 심판적 압박으로 드러나게 했습니다.
  alternative_readings:
