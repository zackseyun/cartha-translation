  - marker: a
    text: 히브리어 전치사 בְּ는 세 병렬구에 모두 반복됩니다. 두 번째 표현은 ‘당신의 백성 가운데’로도 옮길 수 있지만, 앞뒤의 평행과 재앙이 파라오의 영역에 미치는 문맥을 따라 본문에서는 모두 ‘에게’로 옮겼습니다.
    reason: alternative_reading
