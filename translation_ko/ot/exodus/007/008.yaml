  - 모세와 아론에게 말씀하셨습니다
  lexicon: לְ/אֶל + proper nouns
  rationale: 전치사 אֶל의 방향성은 한국어 여격 조사 ‘에게’로 충분히 반영되며, 인명은 통용되는 성경 인명 표기를 따랐습니다.
