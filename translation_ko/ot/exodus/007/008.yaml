- source_word: וַיֹּאמֶר ... לֵאמֹר
  english_pob_choice: said ... saying
  chosen_korean: 말씀하여 이르셨습니다
  alternatives_korean:
  - 말하셨습니다
  - 이르시며 말씀하셨습니다
  lexicon: אמר
  rationale: 히브리어의 서술 동사와 인용 도입 표현을 자연스럽게 살리되, 한국어에서 중복감을 줄이기 위해 ‘말씀하여 이르셨습니다’로 옮겼습니다.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  english_pob_choice: to Moses and to Aaron
  chosen_korean: 모세와 아론에게
