  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the river''; in Exodus this term commonly refers specifically to the Nile.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모세와 아론은 야훼께서 명령하신 그대로 그렇게 했습니다. 아론이 지팡이를 들어 나일 강의 물을 파라오의 눈앞과 그의 신하들의 눈앞에서 쳤고, 나일 강에 있던 모든 물이 피로 변했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘강’이지만, 출애굽기에서는 보통 나일 강을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  english_pob_choice: did so
  chosen_korean: 그렇게 했습니다
  alternatives_korean:
  - 그리하였습니다
  - 명령대로 했습니다
  lexicon: HALOT
  rationale: 명령 이행을 나타내는 관용구로, 현대 한국어에서 자연스럽고 원문의 순응 의미를 유지합니다.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  english_pob_choice: just as Yahweh had commanded
  chosen_korean: 야훼께서 명령하신 그대로
  alternatives_korean:
  - 야훼께서 명령하신 바와 같이
  - 야훼께서 명령하신 대로
  lexicon: HALOT
  rationale: ‘just as’의 준거성과 이미 내려진 명령의 선행성을 함께 살리기 위해 ‘그대로’를 택했습니다.
- source_word: בַּמַּטֶּה
  english_pob_choice: the staff
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 지팡이 막대
  lexicon: HALOT
  rationale: 출애굽기 내에서 מַטֶּה의 자연스러운 현대어 대응으로 ‘지팡이’를 사용했습니다.
- source_word: הַיְאֹר
  english_pob_choice: the Nile
  chosen_korean: 나일 강
  alternatives_korean:
  - 나일
  - 강
  lexicon: HALOT
  rationale: 출애굽기에서 הַיְאֹר는 문맥상 나일강을 가리키므로, 대상이 분명하도록 고유명으로 옮겼습니다.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  english_pob_choice: before Pharaoh's eyes and before the eyes of his servants
  chosen_korean: 파라오의 눈앞과 그의 신하들의 눈앞에서
  alternatives_korean:
  - 파라오와 그의 신하들의 눈앞에서
  - 파라오와 그의 신하들이 보는 앞에서
  lexicon: HALOT
  rationale: 공개적 목격성을 반복 구조대로 살리되, 한국어에서는 ‘눈앞에서’가 가장 자연스럽고 직설적인 대응입니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 시종들
  lexicon: HALOT
  rationale: 문맥상 왕궁의 수행·관료층을 가리키는 표현이므로, 한국어 독자에게 의미가 분명한 ‘신하들’로 옮겼습니다.
theological_decisions:
- issue: 야훼라는 신명 번역
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 번역본의 기준 용례를 따라 언약적 신명을 직접 드러내어, 대체 칭호로 완화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
