  lexicon: HALOT
  rationale: 나이 표현은 문어체에서도 흔한 ‘팔십 살’이 가장 직관적이고, 원문의 연령 정보를 그대로 전달합니다.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
