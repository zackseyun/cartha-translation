  - 삼십팔 살
  lexicon: HALOT
  rationale: 히브리어의 ‘셋과 팔십’ 관용을 한국어의 표준 수사로 정리했습니다.
- source_word: בְּדַבְּרָם אֶל פַּרְעֹה
  english_pob_choice: when they spoke to Pharaoh
  chosen_korean: 그들이 바로 파라오에게 말할 때
  alternatives_korean:
  - 그들이 파라오에게 말했을 때
  - 파라오에게 말하는 동안
  lexicon: HALOT
  rationale: ב+분사/부정사적 구성의 시간 부사적 용법을 ‘…할 때’로 옮겼고, פַּרְעֹה는 본문 음가를 살려 ‘파라오’로 옮겼습니다.
