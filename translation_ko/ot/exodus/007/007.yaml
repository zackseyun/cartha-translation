  - …의 아들이었습니다
  - … 세였습니다
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 한국어 자연문으로 옮기되, ‘세’보다 현대 서술체에 더 자연스러운 ‘살이었습니다’를 택했습니다.
