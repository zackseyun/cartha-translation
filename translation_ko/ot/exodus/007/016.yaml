base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
  footnotes:
  - marker: a
    text: Or 'worship me in the wilderness.' The Hebrew verb can refer to service generally or to worship in a religious sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게 이렇게 말하십시오. ‘야훼, 히브리 사람들의 하나님께서 나를 당신에게 보내시어 말씀하셨습니다. “내 백성을 놓아 보내어 그들이 광야에서 나를 섬기게 하라.” 그러나 보십시오, 지금까지 당신은 듣지 않았습니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘섬기다’는 여기서 일반적 봉사뿐 아니라 종교적 예배를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: והה를 고유명사로 드러내기 위해 한국어도 전통 치환어가 아닌 음역형 ‘야훼’를 사용했습니다.
- source_word: אֱלֹהֵי הָעִבְרִים
  english_pob_choice: the God of the Hebrews
  chosen_korean: 히브리 사람들의 하나님
  alternatives_korean:
  - 히브리인의 하나님
  - 히브리 사람들의 하느님
  lexicon: HALOT
  rationale: ‘עִבְרִים’의 민족적 지칭을 살려 ‘히브리 사람들’로 옮기고, 하나님의 통상 호칭은 POB 기본에 따라 ‘하나님’으로 두었습니다.
- source_word: וְיַעַבְדֻנִי
  english_pob_choice: so that they may serve me
  chosen_korean: 그들이 광야에서 나를 섬기게 하라
  alternatives_korean:
  - 그들이 광야에서 나를 예배하게 하라
  - 그들이 광야에서 나를 섬기도록 하라
  lexicon: HALOT
  rationale: עבד의 넓은 의미를 따라 ‘섬기다’를 유지해, 예배로만 좁히지 않고 종교적·언약적 섬김의 폭을 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: But behold
  chosen_korean: 그러나 보십시오
  alternatives_korean:
  - 보십시오
  - 그런데 보십시오
  - 그러나 보라
  lexicon: HALOT
  rationale: 문맥상 대조를 살리는 접속을 더했고, ‘보십시오’로 현재 상황을 지적하는 담화 표지를 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 언약 이름을 직접 사용하므로, 제목어 ‘주’로 대체하지 않고 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘섬기다’의 범위
  chosen_reading: 섬기게 하라
  alternative_readings:
  - 예배하게 하라
  - 봉사하게 하라
  rationale: 출애굽기의 요구는 예배를 포함하지만 예배로만 한정되지 않으므로, source-direct하게 더 넓은 ‘섬기다’를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
