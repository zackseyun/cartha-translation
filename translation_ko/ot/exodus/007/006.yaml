lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  english_pob_choice: did / they did
  chosen_korean: 행하였고 / 행하였습니다
  alternatives_korean:
  - 하였고 / 하였습니다
  - 했다 / 했다
  lexicon: HALOT
  rationale: 출발어 עשה의 넓은 의미를 살리되, 명령에 대한 순종 문맥이므로 ‘행하다’가 자연스럽고, 끝의 반복도 한국어에서 같은 동사를 되살려 대응시켰습니다.
- source_word: כַּאֲשֶׁר
  english_pob_choice: just as
  chosen_korean: 그대로
  alternatives_korean:
  - 바로 같이
  - 명령하신 대로
  lexicon: HALOT
  rationale: 명령과 실행의 정확한 일치를 강조하는 말이므로, 문맥상 ‘그대로’가 간결하게 대응성을 드러냅니다.
- source_word: צִוָּה
  english_pob_choice: had commanded
  chosen_korean: 명하신
  alternatives_korean:
  - 명령하신
  - 지시하신
  lexicon: HALOT
  rationale: צוה는 단순한 조언이 아니라 명령을 뜻하므로 ‘명하다’로 옮겼고, 선행한 명령을 가리키는 서술 맥락을 반영해 관형형으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명기를 한국어 POB 기본 원칙에 따라 신적 고유명사로 음역해, 호칭 ‘주’로 완화하지 않고 고유성을 보존했습니다.
theological_decisions:
- issue: 여호와 대체 번역의 처리
  chosen_reading: 야훼께서 그들에게 명하신 대로
  alternative_readings:
  - 주께서 그들에게 명하신 대로
  - 여호와께서 그들에게 명하신 대로
  rationale: 히브리어 본문이 직접 יְהוָה를 사용하므로, 신학적·문헌학적 투명성을 위해 제목어 ‘주’로 바꾸지 않고 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
