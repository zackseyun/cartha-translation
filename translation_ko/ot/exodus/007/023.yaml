base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/023.yaml
  text: Pharaoh turned and went into his house[a], and he did not take even this to heart.
  footnotes:
  - marker: a
    text: Or, 'he did not set his heart to this' or 'he paid no attention even to this.'
    reason: lexical_alternative
translation:
  language: ko
  text: 파라오는 돌아서서 자기 집으로 들어갔습니다. 그는 이 일조차 마음에 두지 않았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그는 이 일에 마음을 두지 않았다’, 혹은 ‘그는 이 일조차도 주의를 기울이지 않았다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  english_pob_choice: turned
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌아가서
  - 몸을 돌려
  lexicon: HALOT
  rationale: 문맥상 파라오의 동작 전환을 간결하게 살리면서, 다음 동사인 ‘들어갔습니다’와 자연스럽게 이어지도록 했습니다.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  english_pob_choice: went into his house
  chosen_korean: 자기 집으로 들어갔습니다
  alternatives_korean:
  - 자기 집에 갔습니다
  - 집 안으로 들어갔습니다
  lexicon: HALOT
  rationale: אֶל과 בוא의 이동·진입 의미를 살려 ‘들어갔습니다’로 옮겼고, 소유 대명사는 문맥상 ‘자기’로 분명히 했습니다.
- source_word: וְלֹא שָׁת לִבּוֹ
  english_pob_choice: he did not take ... to heart
  chosen_korean: 마음을 두지 않았습니다
  alternatives_korean:
  - 마음에 두지 않았습니다
  - 마음을 쓰지 않았습니다
  - 유념하지 않았습니다
  lexicon: HALOT
  rationale: ‘마음을 두다’는 히브리어 관용구 ‘마음을 두다/세우다’의 의미를 비교적 직접적으로 살리면서도 현대 한국어에서 자연스럽습니다.
- source_word: גַּם לָזֹאת
  english_pob_choice: even this
  chosen_korean: 이 일에 대해서도
  alternatives_korean:
  - 이 일조차도
  - 이 일까지도
  lexicon: HALOT
  rationale: גַּם의 ‘심지어/또한’의 강조를 살리되, 바로 앞의 재앙을 가리키는 지시어를 한국어 문맥에 맞게 풀었습니다.
theological_decisions:
- issue: 파라오의 반응을 표현하는 방식
  chosen_reading: 단순한 무감각이 아니라, 눈앞의 표징에도 불구하고 마음을 두지 않는 완고함으로 옮겼습니다.
  alternative_readings:
  - 그는 별로 개의치 않았습니다
  - 그는 무시했습니다
  rationale: 본문의 관용구는 정서적 무관심을 넘어서 하나님이 행하신 징조에 대한 책임 있는 반응의 결여를 드러내므로, 그 긴장을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 출애굽기 7–14장의 바로 완고함 주제
- issue: 속담적 관용구의 한국어화
  chosen_reading: ‘take ... to heart’의 심장(heart) 이미지를 보존하되, 현대 한국어에서 자연스러운 관용 표현으로 옮겼습니다.
  alternative_readings:
  - 직역하여 ‘마음에 가져다 두지 않았습니다’
  - 의역하여 ‘신경 쓰지 않았습니다’
  rationale: 원문의 심장/마음 이미지와 관용적 의미를 함께 전달해야 하므로, 지나친 직역과 과도한 의역을 피했습니다.
  doctrine_reference: 히브리어 관용구 번역 원칙
