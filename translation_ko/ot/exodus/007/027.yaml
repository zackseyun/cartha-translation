translation:
  language: ko
  text: 그러나 만일 당신이 그들을 놓아주기를 거부한다면, 보십시오, 내가 온 땅을 개구리로 치겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 보내기를 거부한다면 … 내가 온 땅을 개구리로 칠 것입니다.” 히브리어 분사는 임박한 행동(“막 치려 합니다”) 또는 단순 미래(“칠 것입니다”)로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 조건절 앞의 대조적 전환을 살려 '그러나'를 두고, 조건을 분명하게 만드는 '만일'로 옮겼습니다.
- source_word: לְשַׁלֵּחַ
  english_pob_choice: to let them go
  chosen_korean: 그들을 보내기를
  alternatives_korean:
  - 그들을 풀어 주기를
  - 그들을 내보내기를
  lexicon: HALOT
  rationale: 출애굽 문맥의 관용적 의미는 억류에서 풀어 주는 것이지만, 히브리어 동사 자체의 '보내다' 의미를 살려 직역 성분을 유지했습니다.
- source_word: כָּל גְּבוּלְךָ
  english_pob_choice: all your territory
  chosen_korean: 당신의 온 영토
  alternatives_korean:
  - 당신의 모든 경계
  - 당신의 온 땅
  lexicon: HALOT
  rationale: גְּבוּל은 여기서 국경선 자체보다 범위 전체를 가리키므로, 현대 한국어에서 자연스럽고 포괄적인 '온 영토'가 적절합니다.
- source_word: בַּצְפַרְדְּעִים
  english_pob_choice: with frogs
  chosen_korean: 개구리로
  alternatives_korean:
  - 개구리들과 함께
  - 개구리들로
  lexicon: HALOT
  rationale: בְּ는 재난의 수단/매개를 나타내므로 한국어로는 원인을 드러내는 조사 '로'가 가장 자연스럽고, plague의 도구적 의미를 잘 살립니다.
theological_decisions:
- issue: אָנֹכִי נֹגֵף의 시상/상(진행성 vs 미래)
  chosen_reading: '''내가 ... 치겠습니다''로 옮겨, 단순 미래로 예고된 심판을 담되 과도한 ''막 치려 한다''는 해석적 뉘앙스는 넣지 않았습니다.'
  alternative_readings:
  - 내가 ... 치고 있습니다
  - 내가 ... 치려고 합니다
  rationale: 본문의 분사구문은 문맥상 임박성을 띨 수 있지만, 한국어 본문에서는 원문의 단정적 경고를 보존하는 편이 더 직접적입니다.
  doctrine_reference: 문법-시상 해석
- issue: יְהוָה 인용 여부
  chosen_reading: 이 절에는 야훼 인용이 없으므로 본문에 별도 표기를 하지 않았습니다.
  alternative_readings:
  - 야훼로 옮길 수 있음
  rationale: 직접 신명 인용이 없어서, 본절에서는 고유명사 처리보다 심판 선언의 화자-청자 관계가 더 중요합니다.
  doctrine_reference: POB 표기 원칙
