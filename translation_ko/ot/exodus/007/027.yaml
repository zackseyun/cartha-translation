  yaml_path: translation/ot/exodus/007/027.yaml
  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
  footnotes:
  - marker: a
    text: Or 'And if you refuse to let them go ... I will strike all your land with frogs.' The Hebrew participle may be rendered as imminent ('am about to strike') or simple future ('will strike').
