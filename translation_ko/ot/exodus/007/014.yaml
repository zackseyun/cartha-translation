  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כָּבֵ֖ד לֵ֣ב פַּרְעֹ֑ה מֵאֵ֖ן לְ/שַׁלַּ֥ח הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
  footnotes:
  - marker: a
    text: Or “Pharaoh’s heart is hard.” The Hebrew adjective is literally “heavy,” a metaphor for stubbornness or unresponsiveness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. 「바로의 마음은 무겁습니다. 그는 백성을 보내주기를 거부합니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로의 마음은 굳어 있습니다.’ 히브리어 형용사는 문자적으로 ‘무거운’이며, 완고함이나 무반응의 은유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC
  rationale: 원문 고유명사인 언약의 이름을 보존하기 위해 관례적 대체어 ‘주’가 아니라 음역형 ‘야훼’를 사용했습니다.
- source_word: כָּבֵד
  english_pob_choice: is heavy
  chosen_korean: 무겁습니다
  alternatives_korean:
  - 굳어 있습니다
  - 완고합니다
  - 딱딱합니다
  lexicon: HALOT
  rationale: 영문 POB의 ‘heavy’를 따라 원문의 직유적 표현을 유지했습니다. ‘완고하다’는 의미는 문맥상 가능하지만, 원문의 구체적 이미지를 먼저 살렸습니다.
- source_word: לֵב פַּרְעֹה
  english_pob_choice: Pharaoh’s heart
  chosen_korean: 바로의 마음
  alternatives_korean:
  - 바로의 হৃদ앙?
  - 바로의 심장
  - 바로의 속마음
  lexicon: HALOT
  rationale: 히브리어 ‘לב’는 여기서 인격의 중심을 가리키므로 한국어에서는 자연스럽고 문맥에 맞는 ‘마음’으로 옮겼습니다.
- source_word: לְשַׁלַּח
  english_pob_choice: to let ... go
  chosen_korean: 보내주기를
  alternatives_korean:
  - 내보내기를
  - 놓아주기를
  - 떠나게 하기를
  lexicon: HALOT
  rationale: 출애굽기에서 이 동사는 이스라엘을 떠나게 하거나 보내는 의미로 쓰이므로, ‘보내주다’가 가장 자연스럽고 문맥에 맞습니다.
theological_decisions:
- issue: 원문의 ‘무겁다’ 은유를 완화하지 않을지
  chosen_reading: ‘바로의 마음은 무겁습니다’로 직역적 은유를 유지했습니다.
  alternative_readings:
  - ‘바로의 마음은 굳어 있습니다’
  - ‘바로는 완고합니다’
  rationale: 하드닝 전승을 평평하게 ‘완고함’으로 번역하기보다, 원문이 선택한 어휘를 드러내어 독자가 반복되는 모티프의 차이를 보도록 했습니다.
  doctrine_reference: 원문 우선, 신학적 긴장 보존
