base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
  footnotes:
  - marker: a
    text: Hebrew tannin can also refer to a dragon-like creature or large reptile; here it likely denotes a serpent in this sign before Pharaoh.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세와 아론이 바로에게 들어가서 야훼께서 명하신 그대로 행했습니다. 그리고 아론이 자기 지팡이를 바로 앞과 그의 신하들 앞에 던지자, 그것이 뱀이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תַנִּין은 문맥에 따라 용 같은 생물이나 큰 파충류를 가리킬 수도 있지만, 여기서는 바로 앞의 표징 장면에서 뱀을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל פַּרְעֹה
  english_pob_choice: went in to Pharaoh
  chosen_korean: 바로에게 들어가서
  alternatives_korean:
  - 바로에게 갔습니다
  - 바로 앞에 나아갔습니다
  lexicon: HALOT
  rationale: ‘들어가다’는 왕의 면전으로 들어가는 동작을 자연스럽게 살리면서, 단순 이동보다 궁정 출입의 뉘앙스를 담습니다.
- source_word: וַיַּעַשׂוּ כֵן כַּאֲשֶׁר צִוָּה יְהוָה
  english_pob_choice: they did so, just as Yahweh had commanded
  chosen_korean: 야훼께서 명하신 그대로 행했습니다
  alternatives_korean:
  - 야훼께서 명하신 대로 했습니다
  - 야훼께서 명령하신 대로 그렇게 했습니다
  lexicon: HALOT
  rationale: ‘그대로’는 히브리어의 정확한 순종과 대응을 살리며, ‘명하신’은 פּקד/צוה 계열의 명령을 자연스럽게 옮깁니다.
- source_word: מַטֵּהוּ
  english_pob_choice: his staff
  chosen_korean: 자기 지팡이
  alternatives_korean:
  - 그의 지팡이
  - 자기 막대기
  lexicon: HALOT
  rationale: ‘지팡이’가 현대 한국어에서 가장 자연스럽고, 소유대명사 ‘자기’는 아론의 소유임을 분명히 합니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 시종들
  lexicon: HALOT
  rationale: 왕궁 맥락에서는 단순한 ‘종들’보다 ‘신하들’이 문맥상 더 자연스럽고, POB가 유지한 궁정적 함의를 잘 반영합니다.
- source_word: וַיְהִי לְתַנִּין
  english_pob_choice: it became a serpent
  chosen_korean: 뱀이 되었습니다
  alternatives_korean:
  - 용이 되었습니다
  - 큰 뱀이 되었습니다
  - 뱀 같은 짐승이 되었습니다
  lexicon: HALOT
  rationale: 이 장면의 표준적 서술과 한국어 가독성을 고려하면 ‘뱀’이 가장 적절합니다. 본문의 긴장이나 더 넓은 의미 범주는 본절 문맥만으로는 전면화하지 않았습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명문을 주칭호로 대체하지 않고 고유명으로 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: תַנִּין의 의미 범위
  chosen_reading: 뱀
  alternative_readings:
  - 용
  - 큰 파충류
  - 큰 뱀
  rationale: 출애굽기 7장의 표징 장면에서는 ‘뱀’이 가장 직접적으로 장면 의도를 전달합니다. 다만 더 넓은 어휘 범위는 번역 본문이 아니라 주해 차원에서 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3 and #5'
