    rationale: 히브리어 עֲבָדָיו의 접미사는 바로를 가리키지만, 한국어 문장에서는 직전 주어가 아론이므로 ‘그의’가 아론을 가리키는 것으로 읽힐 수 있습니다. ‘바로의 신하들’로 명시해야 합니다.
  - severity: low
