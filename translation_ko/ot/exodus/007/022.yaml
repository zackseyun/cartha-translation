id: EXO.7.22
reference: Exodus 7:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֛ן חַרְטֻמֵּ֥י מִצְרַ֖יִם בְּ/לָטֵי/הֶ֑ם וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
  footnotes:
  - marker: a
    text: Or 'with their enchantments' or 'by their occult arts.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Pharaoh’s heart became hard.' The Hebrew does not explicitly state the agent of the hardening in this verse.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 이집트의 박수들은 자기들의 은밀한 술법으로 똑같이 행했습니다[a]. 파라오의 마음은 완강해졌고, 그는 그들에게 귀를 기울이지 않았습니다[b]. 이는 야훼께서 말씀하신 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 주술로’, ‘그들의 요술로’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘파라오의 마음이 굳어졌습니다’. 히브리어는 이 절에서 마음을 굳게 한 주체를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חַרְטֻמֵּי מִצְרַיִם
  english_pob_choice: the magicians of Egypt
  chosen_korean: 이집트의 박수들
  alternatives_korean:
  - 이집트의 마술사들
  - 이집트의 요술사들
  - 이집트의 주술사들
  lexicon: HALOT
  rationale: 출애굽기에서 이들은 파라오의 표징을 흉내 내는 궁정의 주술 전문인들을 가리키므로, 현대 한국어에서 가장 자연스럽고 문맥상 분명한 ‘박수들’을 택했습니다.
- source_word: בְּלָטֵיהֶם
  english_pob_choice: by their secret arts
  chosen_korean: 자기들의 은밀한 술법으로
  alternatives_korean:
  - 자기들의 주술로
  - 자기들의 은밀한 마술로
  - 자기들의 주문으로
  lexicon: HALOT
  rationale: בְּ의 수단 의미와 ‘숨겨진/은밀한’ 뉘앙스를 함께 살리기 위해 ‘은밀한 술법으로’로 옮겼습니다. ‘술법’은 기술적·의례적 성격을 너무 특정하지 않으면서도 마술적 행위를 전달합니다.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  english_pob_choice: Pharaoh’s heart was hardened
  chosen_korean: 파라오의 마음은 완강해졌고
  alternatives_korean:
  - 파라오의 마음은 굳어졌고
  - 파라오의 마음은 완악해졌고
  - 파라오의 마음은 강퍅해졌고
  lexicon: HALOT
  rationale: 히브리어는 여기서 직접적인 행위 주체를 밝히지 않고 ‘마음이 강해지다/굳어지다’는 상태를 나타내므로, 결과 상태를 드러내는 ‘완강해졌고’로 옮겨 신학적 해석을 덧씌우지 않았습니다.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  english_pob_choice: he did not listen to them
  chosen_korean: 그는 그들에게 귀를 기울이지 않았습니다
  alternatives_korean:
  - 그들의 말을 듣지 않았습니다
  - 그들을 듣지 않았습니다
  - 그들에게 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע + אֶל은 단순 청취보다 ‘듣고 받아들이다/귀를 기울이다’의 뜻이므로, 의미를 자연스럽게 드러내는 표현을 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 여호와 대신 학술적 음역인 ‘야훼’를 사용하여 하나님의 고유 이름을 보존했습니다.
theological_decisions:
- issue: 파라오의 마음이 굳어진 원인/행위 주체
  chosen_reading: 원문이 밝히는 대로 결과 상태를 번역하고, 누가 그 마음을 굳게 했는지는 여기서 명시하지 않았습니다.
  alternative_readings:
  - 파라오가 자기 마음을 굳게 했습니다
  - 하나님께서 파라오의 마음을 굳게 하셨습니다
  rationale: 이 절 자체는 행위 주체를 명시하지 않으므로, 인접 본문에서의 신학적 결론을 이 구절에 미리 주입하지 않도록 상태 중심으로 옮겼습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
