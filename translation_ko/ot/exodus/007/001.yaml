source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
  footnotes:
  - marker: a
    text: Or, more literally, “I have made you God to Pharaoh.” The Hebrew presents Moses in a God-like representative role before Pharaoh, with Aaron as his prophet.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼께서 모세에게 말씀하셨습니다. 「보십시오, 내가 당신을 파라오에게 하나님으로[a] 세웠습니다. 당신의 형 아론은 당신의 예언자가 될 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 “하나님으로”는 모세가 하나님과 동일한 존재가 되었다는 뜻이 아니라, 파라오 앞에서 하나님의 권위를 대표하도록 세워졌다는 뜻입니다. 아론은 모세의 예언자, 곧 그의 말을 전달하는 이로 제시됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 언약의 고유명사인 야훼를 주어로 직접 살려, 제목 대체보다 신명 자체를 드러내는 POB 원칙을 따랐습니다.
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 봐
  lexicon: HALOT
  rationale: 모세를 향한 직접 명령을 현대 합쇼체로 자연스럽게 옮기되, 주의를 환기하는 imperative 성격을 유지했습니다.
- source_word: נְתַתִּי/ךָ אֱלֹהִים לְ/פַרְעֹה
  english_pob_choice: I have made you God to Pharaoh
  chosen_korean: 내가 당신을 파라오에게 하나님처럼 세웠습니다
  alternatives_korean:
  - 내가 당신을 파라오에게 하나님으로 세웠습니다
  - 내가 당신을 파라오에게 신처럼 세웠습니다
  - 내가 당신을 파라오에게 하나님이 되게 했습니다
  lexicon: HALOT
  rationale: 문맥상 모세의 존재론적 신격화가 아니라 파라오 앞에서의 대표적·대리적 권위를 가리키므로, 직역의 오해를 피하면서도 원문의 긴장을 살려 '하나님처럼'으로 옮겼습니다.
- source_word: נְבִיאֶךָ
  english_pob_choice: your prophet
  chosen_korean: 당신의 대언자
  alternatives_korean:
  - 당신의 예언자
  - 당신의 선지자
  - 당신의 대변자
  lexicon: HALOT
  rationale: 아론의 역할은 모세의 말을 대신 전하는 대리적 기능이므로, 한국어 성경 전통의 '선지자'보다 기능을 드러내는 '대언자'를 택했습니다.
theological_decisions:
- issue: 모세를 אֱלֹהִים으로 부르는 표현의 신학적 처리
  chosen_reading: '''하나님처럼''은 모세가 하나님과 동일본질이라는 뜻이 아니라, 파라오 앞에서 하나님의 권위를 대리하는 대표자라는 뜻으로 이해했습니다.'
  alternative_readings:
  - '''하나님'''
  - '''신처럼'''
  - '''하나님이 되게'''
  rationale: 본문의 문법과 이어지는 '아론은 당신의 대언자'라는 평행 구조가 기능적 위임을 가리키므로, 정통 신학 경계를 지키면서도 원문의 충격을 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: 도식적 대리권/대표성, 번역 원칙
