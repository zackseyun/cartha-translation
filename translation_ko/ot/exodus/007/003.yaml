translation:
  language: ko
  text: 그러나 나는 파라오의 마음을 완고하게 하고, 이집트 땅에서 내 표징들과 내 기이한 일들을 많이 일으키겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파라오의 마음을 굳게 하다’ 또는 ‘파라오의 마음을 완고하게 만들다.’ 히브리어 동사는 사역형이며, 마음을 완고하게 하시는 일을 직접적으로 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But I
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 그리고 나는
  - 나로 말하면
  lexicon: HALOT
  rationale: 문맥상 앞선 명령에 대한 대조·강조를 살려 역접 접속사 ‘그러나’로 옮기고, 주어 ‘나는’을 분명히 드러냈습니다.
- source_word: אַקְשֶׁה
  english_pob_choice: will harden
  chosen_korean: 완고하게 하며
  alternatives_korean:
  - 굳게 하며
  - 강퍅하게 하며
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리되 한국어에서는 ‘마음을 완고하게 하다’가 자연스러운 직역에 가깝습니다. 전통적 교회어 ‘강퍅하게 하다’는 가능하지만, 본문의 직접성을 살려 더 표준적인 표현을 택했습니다.
- source_word: אֹתֹתַי / מוֹפְתַי
  english_pob_choice: my signs / my wonders
  chosen_korean: 내 표징들과 내 기이한 일들
  alternatives_korean:
  - 내 징조들과 내 놀라운 일들
  - 내 표적들과 내 기적들
  lexicon: HALOT
  rationale: אוֹת는 본문에서 하나님의 능력과 메시지를 가리키는 ‘표징’이 적절하고, מוֹפֵת는 단순한 ‘기적’보다 ‘기이한 일’이 원문의 놀라움과 표징-기이한 일의 짝을 더 잘 보존합니다.
- source_word: בְּאֶרֶץ מִצְרָיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트에서
  - 이집트 땅 안에서
  lexicon: HALOT
  rationale: 히브리어의 ‘땅’(אֶרֶץ)을 유지해야 하므로 ‘이집트 땅에서’로 옮겼습니다. 고유명사는 현대 외래어 표기인 ‘이집트’를 사용했습니다.
theological_decisions:
- issue: 하나님의 직접적 사역으로서의 파라오 마음 완고하게 하심
  chosen_reading: ‘완고하게 하며’로 하나님의 능동적 작용을 직접적으로 유지했습니다.
  alternative_readings:
  - ‘완고해지도록 두며’
  - ‘굳어지게 하며’
  rationale: 히필형의 사역성을 희석하지 않기 위해 허용적 표현으로 완화하지 않았습니다. 본문이 의도하는 신학적 긴장을 보존하는 것이 번역상 더 충실합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
