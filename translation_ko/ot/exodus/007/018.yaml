  source_fidelity: 히브리어는 ‘강(יְאֹר)에 있는 물고기’가 죽고, ‘강’이 악취를 내며, 이집트 사람들이 그 강에서 물을 마시는 데 곤란을 겪게 됨을 말합니다. 출애굽기 문맥상 יְאֹר는 나일강을 가리키므로 ‘나일강’으로 명시하는 것은 적절합니다. ‘마실 수 없게 될 것입니다’는 נִלְאוּ의 결과적 의미를 자연스럽게 반영합니다.
  naturalness: 초안의 ‘요강’은 현대 한국어에서 보통 휴대용 변기/밤그릇을 뜻하므로, 나일강을 뜻하는 문맥에서 심각하게 부정확하고 오해를 일으킵니다. ‘나일강’으로 고쳐야 합니다. 합쇼체 종결도 ‘될 것이다’보다 ‘될 것입니다’가 요청된 현대 정중체에 맞습니다.
  terminology: 고유 지명은 ‘나일강’, 민족명은 ‘이집트 사람들’이 자연스럽고 정확합니다. ‘악취가 나며’는 강이 썩어 냄새가 난다는 히브리어 표현을 무리 없이 전달합니다.
