review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the Hebrew command sequence and correctly identifies יְאֹר as the Nile. However, '바로 파라오' adds an unwarranted adverb ('directly') and is not a natural rendering of אֶל־פַּרְעֹה. The mixed second-person forms ('너는' alongside '-하십시오/-합니다') violate the stipulated formal-polite register. The footnote markers are attached to terms unrelated to their notes.
  naturalness: Use consistent modern formal-polite imperatives. '물가로 나가고 있습니다' naturally conveys the participial motion toward the water; '손에 드십시오' is a natural formal rendering of 'take in your hand.'
  terminology: Use '파라오,' '나일 강,' '지팡이,' and '뱀.' The loanword '서펀트' is not natural standard Korean and does not provide a meaningful Korean lexical alternative to '뱀.'
  issues:
  - severity: medium
    issue: '''바로 파라오에게'' contains an added adverb and is awkward.'
    rationale: The Hebrew means 'to Pharaoh'; 바로 here means 'directly/immediately' in Korean and is not part of the source.
  - severity: high
    issue: The draft mixes informal/plain second person ('너는') with formal-polite endings.
    rationale: The target register requires consistent 합쇼체.
  - severity: high
    issue: Footnote anchors and contents do not correspond.
    rationale: Marker a is placed after '아침에' but discusses יְאֹר, and marker b is placed after the instruction to stand but discusses נָחָשׁ. The latter also uses the unnatural Korean loanword '서펀트.'
  - severity: low
    issue: The command to take the staff is weakened as '들어야 합니다.'
    rationale: A direct formal imperative better represents the Hebrew command sequence.
  revised_text: 아침에 파라오에게 가십시오. 보십시오, 그가 물가로 나가고 있습니다. 그를 만나려고 나일 강[a] 기슭에 서십시오. 그리고 뱀으로 바뀌었던 그 지팡이를 손에 드십시오.
