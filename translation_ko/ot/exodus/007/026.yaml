source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
  footnotes:
  - marker: a
    text: Or “that they may worship me.” The Hebrew verb can denote service rendered to God, including worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 모세에게 말씀하셨습니다. “바로에게 가서 그에게 말하여라. ‘야훼께서 이렇게 말씀하신다. 내 백성을 보내라. 그들이 나를 섬기도록[a] 하여라.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘섬기다’는 하나님께 드리는 예배를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC
  rationale: 고유명사 יְהוָה는 칭호가 아니라 신적 이름이므로, POB의 영어 선택과 맞추어 한국어에서도 음역형인 ‘야훼’를 사용했습니다.
- source_word: בֹּא אֶל פַּרְעֹה
  english_pob_choice: Go in to Pharaoh
  chosen_korean: 바로에게 들어가서
  alternatives_korean:
  - 바로에게 가서
  - 바로 앞에 들어가서
  lexicon: WLC
  rationale: בוא + אל은 단순 이동보다 왕의 면전으로 들어가는 장면을 나타내므로, 한국어에서는 ‘들어가서’가 명령의 상황감을 가장 잘 살립니다.
- source_word: שַׁלַּח אֶת עַמִּי
  english_pob_choice: Let my people go
  chosen_korean: 내 백성을 보내라
  alternatives_korean:
  - 내 백성을 놓아주어라
  - 내 백성을 풀어 주어라
  lexicon: WLC
  rationale: 직역하면 ‘보내라’이지만, 이 관용구는 억류에서의 해방 요구를 뜻하므로 한국어에서도 너무 완화하지 않되 자연스럽게 ‘보내라’로 옮겼습니다.
- source_word: וְיַעַבְדֻנִי
  english_pob_choice: so that they may serve me
  chosen_korean: 그러면 그들이 나를 섬길 것이다
  alternatives_korean:
  - 그래서 그들이 나를 섬기게 될 것이다
  - 그들이 나를 예배할 것이다
  lexicon: WLC
  rationale: עבד는 하나님께 대한 예배를 포함할 수 있지만, 본문이 요구하는 기본 의미는 ‘섬기다’이므로 좁혀서 ‘예배하다’로 두지 않았습니다.
theological_decisions:
- issue: עבד의 의미 범위와 출애굽의 목적
  chosen_reading: ‘섬기다’로 번역해, 이스라엘이 바로의 종살이에서 야훼의 섬김으로 옮겨간다는 주제를 살립니다.
  alternative_readings:
  - ‘예배하다’로 좁혀 이해할 수 있음
  - ‘봉사하다’로 완화할 수 있음
  rationale: 본문은 단순한 종교행위만이 아니라 언약적 소속의 전환을 말하므로, 의미 범위를 좁히지 않는 번역이 본문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
