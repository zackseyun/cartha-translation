  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
  footnotes:
  - marker: a
    text: Or 'with their enchantments.' The Hebrew term may denote occult arts or enchantments; the exact nuance is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 파라오도 현자들과 마술사들을 불렀습니다. 그들, 곧 이집트의 박수들도 자기들의 비술로 같은 일을 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 비술로.’ 히브리어 용어는 주술적 기술이나 비술을 가리킬 수 있으며, 정확한 뉘앙스는 확정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called for
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 불러들였습니다
  - 소집했습니다
  lexicon: HALOT
  rationale: 문맥상 파라오가 사람들을 자기 앞에 불러들이는 뜻이므로, 자연스러운 현대 한국어 동사인 ‘불렀습니다’가 가장 직접적으로 대응합니다.
- source_word: חֲכָמִים
  english_pob_choice: wise men
  chosen_korean: 현자들
  alternatives_korean:
  - 지혜로운 사람들
  - 지혜자들
  lexicon: HALOT
  rationale: 궁정의 지식인/전문가들을 가리키는 말이므로, 단순히 도덕적 의미의 ‘지혜로운 사람들’보다 직무적 뉘앙스를 살린 ‘현자들’이 적절합니다.
- source_word: מְכַשְּׁפִים
  english_pob_choice: sorcerers
  chosen_korean: 마술사들
  alternatives_korean:
  - 주술사들
  - 마법사들
  lexicon: HALOT
  rationale: כשׁף 계열은 주술·요술을 행하는 자를 가리키며, 문맥상 이집트 궁정의 초자연적 기술자를 뜻합니다. 한국어에서 가장 넓게 통하는 대응은 ‘마술사들’이지만, 뒤의 ‘비술’로 실제 성격을 보완했습니다.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  english_pob_choice: the magicians of Egypt
  chosen_korean: 이집트의 박수들
  alternatives_korean:
  - 이집트의 마술사들
  - 이집트의 주술사들
  lexicon: HALOT
  rationale: חַרְטֻמִּים은 출애굽기에서 파라오의 전문 의례 수행자들을 가리키는 표준어로, 한국어의 ‘박수들’은 무속적·주술적 성격을 비교적 정확히 드러냅니다.
- source_word: בְּלַהֲטֵיהֶם
  english_pob_choice: by their enchantments
  chosen_korean: 자기들의 비술로
  alternatives_korean:
  - 자기들의 주술로
  - 자기들의 요술로
  lexicon: HALOT
  rationale: לַהַט/לַהֲטִים은 문맥상 단순한 ‘불꽃’이 아니라 기이한 술법·비술을 가리키므로, 의미를 과도하게 특정하지 않으면서도 source-direct한 ‘비술’로 옮겼습니다.
theological_decisions:
- issue: 이집트 술객들의 능력의 성격
  chosen_reading: 본문이 말하는 것은 그들이 파라오의 요구에 따라 같은 행동을 재현했다는 사실이며, 그 방식은 ‘비술’로만 표현하고 초월적 능력의 정확한 메커니즘은 단정하지 않았습니다.
  alternative_readings:
  - 실제 초자연적 능력을 행사했다
  - 단순한 속임수나 눈속임이었다
  rationale: 히브리어 본문은 결과와 수단을 제시하지만 그 힘의 궁극적 성격을 해설하지 않으므로, 번역도 그 긴장을 그대로 보존해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
