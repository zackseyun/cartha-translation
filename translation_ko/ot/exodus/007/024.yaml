base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
  footnotes:
  - marker: a
    text: Hebrew 'the river' (ye'or); in Exodus this term refers specifically to the Nile.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 이집트 사람들이 마실 물을 얻으려고 나일 강 주변을 팠습니다[a]. 그들이 나일 강의 물을 마실 수 없었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘강’(ye'or)은 출애굽기에서 구체적으로 나일 강을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  english_pob_choice: dug
  chosen_korean: 팠습니다
  alternatives_korean:
  - 파냈습니다
  - 굴착했습니다
  lexicon: HALOT
  rationale: חפר의 기본 뜻인 ‘파다’를 직접 살리면서, 한국어에서 가장 자연스러운 서술형으로 옮겼습니다.
- source_word: כָל מִצְרַיִם
  english_pob_choice: all the Egyptians
  chosen_korean: 모든 이집트 사람들이
  alternatives_korean:
  - 온 이집트가
  - 모든 이집트인들이
  lexicon: HALOT
  rationale: 문맥상 나라 전체가 아니라 재앙에 반응하는 사람들을 가리키므로, 집합적 지시를 살리되 한국어에서는 ‘사람들’로 풀어 주었습니다.
- source_word: סְבִיבֹת הַיְאֹר
  english_pob_choice: around the Nile
  chosen_korean: 나일 강 주변을
  alternatives_korean:
  - 나일 강 둘레를
  - 강 주변을
  lexicon: HALOT
  rationale: יְאֹר가 출애굽기에서 나일 강을 가리키므로, 의미를 분명히 하려고 고유명사로 옮겼고 ‘주변’으로 장소 감각을 살렸습니다.
- source_word: מַיִם לִשְׁתּוֹת
  english_pob_choice: for water to drink
  chosen_korean: 마실 물을
  alternatives_korean:
  - 마실 물을 얻으려고
  - 마실 물
  lexicon: HALOT
  rationale: 히브리어의 목적 뉘앙스를 한국어에서는 ‘마실 물을 얻으려고’로 자연스럽게 풀어, 단순한 상태 묘사보다 의도를 드러냈습니다.
