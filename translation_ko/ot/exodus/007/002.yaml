  source_fidelity: ‘그가 … 내보내게 해야 합니다’는 아론이 파라오를 강제로 내보내게 한다는 사역 의미를 더할 수 있습니다. 아론이 파라오에게 말하여 그가 이스라엘 자손을 내보내도록 한다는 목적 관계를 명시하는 편이 וְשִׁלַּח의 문맥상 기능을 더 충실히 반영합니다. ‘이스라엘 자손’은 בְּנֵי יִשְׂרָאֵל의 관습적 집단·계보 표현을 자연스럽게 전달하며, 직역은 각주에서 보존합니다.
  naturalness: 현대 표준어 합쇼체에서 하나님이 모세에게 말씀하시는 문맥에 ‘당신’은 부자연스럽고 때로 대립적인 뉘앙스를 낼 수 있습니다. ‘너는/네게/네 형’이 직접 호칭으로 더 자연스럽습니다. 또한 ‘이스라엘의 아들들’보다 ‘이스라엘 자손’이 한국어 성서 문맥에서 자연스럽고 오해가 적습니다.
