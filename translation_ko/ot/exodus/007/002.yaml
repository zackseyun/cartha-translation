translation:
  language: ko
  text: 너는 내가 네게 명령하는 모든 것을 말해야 합니다. 네 형 아론은 파라오에게 말하여, 그가 이스라엘 자손을[a] 그의 땅에서 내보내도록 해야 합니다.
