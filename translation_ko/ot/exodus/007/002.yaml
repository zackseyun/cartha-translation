  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다. 이는 이스라엘 백성, 곧 이스라엘 자손을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְדַבֵּר / יְדַבֵּר
  english_pob_choice: shall speak
  chosen_korean: 말해야 합니다
  alternatives_korean:
  - 말할 것입니다
  - 말하십시오
  lexicon: HALOT
  rationale: 두 동사의 기본 의미는 ‘말하다’이며, 여기서는 명령형적 위임이므로 한국어에서는 반복을 살려 ‘말해야 합니다’로 옮겨 지시의 강도를 분명히 했습니다.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  english_pob_choice: all that I command you
  chosen_korean: 내가 당신에게 명령하는 모든 것
  alternatives_korean:
  - 내가 당신에게 명령할 모든 것
  - 내가 당신에게 명령하는 전부
  lexicon: HALOT
  rationale: 포괄성은 ‘모든 것’으로, 현재적·지속적 위임의 뉘앙스는 ‘명령하는’으로 살렸습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 자손
  lexicon: HALOT
  rationale: 본문의 문자적 표현을 유지해 영어 POB의 ‘the sons of Israel’에 대응시키되, 전통적 교회어인 ‘이스라엘 자손’보다 출발어의 성격이 더 분명히 드러나도록 했습니다.
- source_word: מֵאַרְצוֹ
  english_pob_choice: out from his land
  chosen_korean: 자기 땅에서 내보내게 해야 합니다
  alternatives_korean:
  - 그의 땅에서 나가게 해야 합니다
  - 그 땅에서 떠나게 해야 합니다
  lexicon: HALOT
  rationale: 이동의 결과를 드러내는 מן의 방향성을 살려 ‘내보내게 해야 합니다’로 옮겼고, 주어가 파라오임을 분명히 하기 위해 ‘자기 땅에서’라고 했습니다.
theological_decisions:
- issue: 아론의 발화 목적절의 강도
  chosen_reading: 아론이 파라오에게 말하는 목적은 이스라엘의 아들들을 출애굽시키는 파라오의 행위를 유도하는 것입니다.
  alternative_readings:
  - 그가 내보내도록 할 수 있다
  - 그가 내보내게 될 것이다
  rationale: 히브리어 וְשִׁלַּח은 단순 병렬보다 결과/목적을 나타내는 흐름이 자연스러워, 명령의 연쇄 속 의도를 드러내는 표현으로 옮겼습니다.
  doctrine_reference: 출애굽기 7장 문맥의 소명-중재 구조
