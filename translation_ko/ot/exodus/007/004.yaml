    issue: ‘내 손을 이집트에 내밀어’
    rationale: נתן את ידו는 여기서 ‘손을 두다/대다’라는 심판적 관용구입니다. ‘내밀다’는 נָטָה(뻗다) 계열의 표현을 연상시켜 원문보다 구체적인 동작을 추가합니다.
  - severity: medium
    issue: ‘큰 심판으로’의 단수 처리
    rationale: שְׁפָטִים은 복수이며, 애굽에 시행될 여러 심판 행위를 가리킵니다. 한국어 번역에서도 복수를 유지하는 것이 안전합니다.
  - severity: low
    issue: 각주 a와 b의 대안 기능 부족
    rationale: a는 선택한 번역을 다시 설명할 뿐 실질적인 대안을 제시하지 않고, b는 본문 문구를 그대로 반복합니다. lexical_alternative 각주라면 실제 대안을 제시하는 편이 적절합니다.
  revised_text: 바로는 너희에게 귀를 기울이지 않을 것이며, 나는 내 손을 이집트에 대어 내 군대, 곧 내 백성 이스라엘 자손을 큰 심판들을 통하여 이집트 땅에서 이끌어 내겠습니다.
