  source_fidelity: 대체로 충실하나, וְנָתַתִּי אֶת־יָדִי의 ‘두다/대다’ 관용구를 ‘내밀다’로 옮긴 것은 본문에 없는 ‘펴다/뻗다’의 동작을 보탭니다. 또한 בִּשְׁפָטִים גְּדֹלִים의 복수형이 ‘큰 심판으로’에서 단수화되었습니다.
  naturalness: 합쇼체 문장 구성은 자연스럽습니다. 다만 ‘내 손을 이집트에 대어’가 원문의 관용적 심판 표현을 더 직접적이고 자연스럽게 재현하며, ‘큰 심판들을 통하여’는 복수성과 수단의 의미를 명료하게 드러냅니다.
  terminology: ‘바로’, ‘이스라엘 자손’, ‘심판’은 표준 한국어 성경 문맥에서 적절합니다. צִבְאֹתַי는 군사적·조직적 이미지를 보존하는 ‘내 군대’로 둘 수 있으나, 이스라엘 백성을 가리키는 집합적 표현임을 본문 앱포지션으로 분명히 했습니다.
  issues:
