  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יִשְׁמַ֤ע אֲלֵ/כֶם֙ פַּרְעֹ֔ה וְ/נָתַתִּ֥י אֶת יָדִ֖/י בְּ/מִצְרָ֑יִם וְ/הוֹצֵאתִ֨י אֶת צִבְאֹתַ֜/י אֶת עַמִּ֤/י בְנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בִּ/שְׁפָטִ֖ים גְּדֹלִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
  footnotes:
  - marker: a
    text: Or 'my hosts' or 'my armies.' The Hebrew term can denote organized companies, often with military associations.
    reason: lexical_alternative
  - marker: b
    text: Or 'my people, the Israelites.' Literally, 'my people, the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Or 'by great acts of judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바로는 너희에게 귀를 기울이지 않을 것이며, 내가 내 손을 이집트에 내밀어 내 군대[a]—내 백성, 곧 이스라엘 자손[b]—를 이집트 땅에서 큰 심판[c]으로 이끌어 내겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 조직된 집단을 뜻할 수 있으며, 여기서는 군사적 결을 띤 ‘내 군대’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 백성, 곧 이스라엘 자손’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘큰 심판 행위로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹֽא יִשְׁמַ֤ע אֲלֵ/כֶם֙
  english_pob_choice: will not listen to you
  chosen_korean: 너희에게 귀를 기울이지 않을 것이며
  alternatives_korean:
  - 너희 말을 듣지 않을 것이며
  - 너희를 듣지 않을 것이며
  - 너희에게 순종하지 않을 것이며
  lexicon: HALOT
  rationale: שׁמע + אלֵיכם은 단순 청각이 아니라 상대의 말을 받아들이는 ‘듣다/귀를 기울이다’의 뜻이므로, 강한 해석인 ‘순종하다’는 피하고 자연스러운 한국어로 옮겼습니다.
- source_word: וְנָתַתִּ֥י אֶת יָדִ֖/י בְּ/מִצְרָ֑יִם
  english_pob_choice: I will lay my hand on Egypt
  chosen_korean: 내 손을 이집트에 내밀어
  alternatives_korean:
  - 내 손을 이집트에 얹어
  - 이집트 위에 내 손을 펴서
  - 이집트에 내 손을 펼쳐
  lexicon: HALOT
  rationale: ‘내 손을 …에 두다/주다’의 심판적 관용구를 한국어로 살리되, 본문의 직접적인 동작감을 유지하기 위해 ‘내밀어’로 옮겼습니다.
- source_word: צִבְאֹתַ֜/י
  english_pob_choice: my hosts
  chosen_korean: 내 군대
  alternatives_korean:
  - 내 군단들
  - 내 부대들
  - 내 호스트들
  lexicon: HALOT
  rationale: צָבָא/צִבְאֹת는 조직된 집단, 특히 군사적 결을 지닌 ‘군대/군사 편대’의 의미를 띠므로, 본문과 가장 긴밀한 ‘내 군대’를 선택했습니다.
- source_word: בְנֵֽי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘 자녀들
  lexicon: HALOT
  rationale: 직역적 구조를 유지하면서도 한국어 성경에서 널리 이해되는 관용을 살리기 위해 ‘이스라엘 자손’을 택했습니다.
- source_word: בִּ/שְׁפָטִ֖ים גְּדֹלִֽים
  english_pob_choice: with great judgments
  chosen_korean: 큰 심판으로
  alternatives_korean:
  - 큰 재판으로
  - 큰 판단들로
  - 큰 심판 행위로
  lexicon: HALOT
  rationale: 여기서 שְׁפָטִים은 단순 판결이 아니라 애굽에 내리는 하나님의 징벌적 심판을 가리키므로, 한국어로는 자연스럽고 신학적으로도 분명한 ‘큰 심판’이 적절합니다.
theological_decisions:
- issue: צִבְאֹתַי를 ‘hosts/armies’로 볼 때의 군사적 이미지
  chosen_reading: 내 군대
  alternative_readings:
  - 내 무리
  - 내 조직된 부대들
  - 내 군단들
  rationale: 출애굽 맥락에서는 이스라엘이 여호와의 질서 있는 집단으로 불려 나오는 모습과 심판/출정의 뉘앙스가 함께 있으므로, 과도하게 완화하지 않고 군사적 결을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5
