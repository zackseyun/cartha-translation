source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''the waters ... and they will be turned to blood.'' English smooths the plural ''waters'' to the mass noun ''water.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. "이로써 너희가 내가 야훼인 줄 알게 될 것이다. 보십시오, 내가 내 손에 있는 지팡이로 나일에 있는 물을 치면 그것이 피로 변할 것이다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '물들 ... 그들은 피로 변할 것이다'의 복수형을 사용하지만, 한국어에서는 물을 집합명사로 자연스럽게 처리해 단수로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼께서 이와 같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자 전언 공식의 형식을 살리면서도 현대 한국어에서 자연스럽게 들리는 문장으로 옮겼습니다.
- source_word: בְּזֹאת תֵּדַע כִּי אֲנִי יְהוָה
  english_pob_choice: By this you will know that I am Yahweh
  chosen_korean: 이로써 너희가 내가 야훼인 줄 알게 될 것이다
  alternatives_korean:
  - 이것으로 너희는 내가 야훼인 줄 알게 될 것이다
  - 이 일로 너희는 내가 야훼인 줄 알게 될 것이다
  lexicon: HALOT
  rationale: בְּזֹאת의 수단·근거 의미를 '이로써'로 살리고, הכִּי 절은 '...인 줄 알게 될 것이다'로 자연스럽게 연결했습니다.
- source_word: הִנֵּה אָנֹכִי מַכֶּה
  english_pob_choice: behold, I am striking
  chosen_korean: 보십시오, 내가 ... 치면
  alternatives_korean:
  - 보라, 내가 ... 치면
  - 자, 내가 ... 치면
  lexicon: HALOT
  rationale: הִנֵּה의 주목 표지를 '보십시오'로 옮겨 경고·선언의 긴박감을 살렸고, 진행적 현재상은 한국어에서 자연스러운 조건적/직설적 표현으로 풀었습니다.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  english_pob_choice: with the staff that is in my hand
  chosen_korean: 내 손에 있는 지팡이로
  alternatives_korean:
  - 내 손에 든 지팡이로
  - 내 손에 있는 막대기로
  lexicon: HALOT
  rationale: מַטֶּה를 여기서는 기능상 '지팡이'로 옮겼고, '내 손에 있는'으로 도구의 소유·근접성을 유지했습니다.
- source_word: וְנֶהֶפְכוּ לְדָם
  english_pob_choice: and it will be turned to blood
  chosen_korean: 그것이 피로 변할 것이다
  alternatives_korean:
  - 그것들이 피로 바뀔 것이다
  - 피로 변하게 될 것이다
  lexicon: HALOT
  rationale: 영어 POB가 지시한 대로 히브리어 복수형보다 한국어에서는 집합적 단수 표현 '그것이'를 사용해 물의 성격을 자연스럽게 반영했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 고유명사 '야훼'로 일관되게 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 언약적 신명 יהוה를 직접 사용하므로, POB 원칙에 따라 호칭 대체어보다 고유명사로 드러내는 것이 본문 의도를 더 분명히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 직접화법 안의 인칭과 호칭
  chosen_reading: 하나님이 이스라엘/바로에게 하시는 경고적 선언으로 읽어 '너희'를 유지했습니다.
  alternative_readings:
  - 너는
  - 너희는
  rationale: 히브리어의 2인칭 단수/복수 문맥은 전승과 번역 전통에 따라 해석 차이가 있으나, 한국어 본문에서는 독자가 공동체적 청중을 포함해 듣도록 열어 두는 표현을 택했습니다.
  doctrine_reference: 출애굽기 서술 맥락상 바로와 그의 진영을 향한 표적 선언
