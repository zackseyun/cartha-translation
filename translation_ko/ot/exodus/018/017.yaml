lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  english_pob_choice: Moses' father-in-law
  chosen_korean: 모세의 장인
  alternatives_korean:
  - 모세의 장인어른
  - 모세의 장인의 사람
  lexicon: HALOT
  rationale: 히브리어 구성구가 가리키는 친족관계를 한국어로 자연스럽게 옮기되, 본문의 간결한 호칭을 살려 ‘장인’으로 처리했습니다.
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도 현대 문어체 합쇼체의 직접화법 도입으로 가장 무난합니다.
- source_word: לֹא טוֹב
  english_pob_choice: is not good
  chosen_korean: 좋지 않습니다
  alternatives_korean:
  - 옳지 않습니다
  - 좋은 일이 아닙니다
  lexicon: HALOT
  rationale: 평가 표현 טוֹב의 기본 의미를 직접 살리되, 한국어에서는 ‘좋지 않다’가 가장 자연스럽고 간결합니다.
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  english_pob_choice: What you are doing
  chosen_korean: 네가 하는 일
  alternatives_korean:
  - 네가 하고 있는 일
  - 네가 행하는 그 일
  lexicon: HALOT
  rationale: 문자적으로는 ‘그 일/사건’이지만, 한국어에서는 관용적으로 ‘하는 일’이 히브리어 명사구의 의미를 가장 잘 전달합니다.
theological_decisions:
- issue: 장인이 모세에게 직접 말하는 대화체의 톤
  chosen_reading: 직설적인 충고로서의 낮은 반말체를 쓰지 않고, 서술문과 인용문은 모두 현대 공손체로 유지했습니다.
  alternative_readings:
  - 인용문 내부를 반말체로 처리하는 방식
  - 더 강한 꾸짖음 뉘앙스로 옮기는 방식
  rationale: 본문은 권위적 질책이 아니라 사실상의 평가를 전달하므로, 현대 한국어 합쇼체가 원문의 직설성을 유지하면서도 과도한 위압감을 피합니다.
  doctrine_reference: 담화체/문체 선택
