  text: וַ/יִּקַּ֗ח יִתְרוֹ֙ חֹתֵ֣ן מֹשֶׁ֔ה אֶת צִפֹּרָ֖ה אֵ֣שֶׁת מֹשֶׁ֑ה אַחַ֖ר שִׁלּוּחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
  footnotes:
  - marker: a
    text: Or, 'after she had been sent away.' The Hebrew literally reads 'after her sending away,' leaving the agent implicit.
    reason: alternative_reading
translation:
  language: ko
  text: 이드로[a]는 모세의 장인으로서 모세의 아내 십보라를 데려왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀가 보내진 뒤에’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘그녀의 떠나보냄 뒤에’라고 되어 있어, 주체를 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 데렸습니다
  - 가져왔습니다
  - 데리고 갔습니다
  lexicon: HALOT
  rationale: לקח는 기본적으로 ‘취하다/데려가다’의 넓은 뜻을 가지므로, 이 문맥에서는 관계와 이동을 함께 드러내는 ‘데려왔습니다’가 가장 자연스럽고 본문의 행위를 무리 없이 반영합니다.
- source_word: חֹתֵן מֹשֶׁה
  english_pob_choice: Moses’ father-in-law
  chosen_korean: 모세의 장인으로서
  alternatives_korean:
  - 모세의 장인
  - 모세의 처가쪽 어른으로서
  lexicon: HALOT
  rationale: חֹתֵן은 혼인관계로 맺어진 장인을 가리키므로, 한국어에서는 ‘모세의 장인’이 직접적입니다. 뒤의 쉼표 감각을 살려 관계를 덧붙이는 방식으로 처리했습니다.
- source_word: אֵשֶׁת מֹשֶׁה
  english_pob_choice: Moses’ wife
  chosen_korean: 모세의 아내 십보라
  alternatives_korean:
  - 모세의 아내
  - 모세의 아내인 십보라
  lexicon: HALOT
  rationale: 구문상 십보라가 모세의 아내임을 분명히 밝히므로, 인명과 관계를 함께 옮겨 의미를 선명하게 했습니다.
- source_word: שִׁלּוּחֶיהָ
  english_pob_choice: after he had sent her away
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 그가 그녀를 떠나보낸 뒤에
  - 그녀가 보내진 뒤에
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘그녀의 떠나보냄/보내짐 뒤에’로, 행위 주체가 생략되어 있습니다. 한국어 본문에서는 POB 영어 본문처럼 자연스러운 서술을 택하되, 주체의 모호성은 각주로 보존합니다.
theological_decisions:
- issue: שִׁלּוּחֶיהָ의 주체가 본문에 명시되지 않음
  chosen_reading: 본문은 ‘그녀의 떠나보냄 뒤에’라는 의미를 가지며, 행위 주체는 명시하지 않습니다.
  alternative_readings:
  - 모세가 그녀를 떠나보낸 뒤에
  - 그녀가 보내진 뒤에
  rationale: 히브리어 명사는 3인칭 여성 접미사만 갖고 있어 주체를 직접 말하지 않습니다. 본문이 열어 둔 해석의 여지를 지키는 것이 source-grounded 번역에 적합합니다.
  doctrine_reference: 의미가 실제로 모호한 경우에는 번역이 그 모호성을 보존해야 합니다.
