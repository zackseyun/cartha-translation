lexical_decisions:
- source_word: וַיְשַׁלַּח
  english_pob_choice: sent ... away
  chosen_korean: 떠나가게 했고
  alternatives_korean:
  - 보냈고
  - 떠나보냈고
  - 내보냈고
  lexicon: HALOT
  rationale: 피엘형 동사는 단순한 ‘보내다’보다 사람을 떠나게 하거나 보내어 물러나게 하는 뉘앙스가 있어, 자연스러운 현대 한국어로는 ‘떠나가게 하다’가 가장 가깝습니다.
- source_word: חֹתְנוֹ
  english_pob_choice: his father-in-law
  chosen_korean: 그의 장인
  alternatives_korean:
  - 그의 시아버지
  - 그의 처가 식구
  lexicon: HALOT
  rationale: 문맥상 모세의 장인 이드로를 가리키므로, 한국어에서도 가장 분명한 친족 관계 표현인 ‘장인’을 썼습니다.
- source_word: וַיֵּלֶךְ לוֹ אֶל אַרְצוֹ
  english_pob_choice: and he went to his own land
  chosen_korean: 자기 땅으로 갔습니다
  alternatives_korean:
  - 자기 나라로 갔습니다
  - 그의 땅으로 갔습니다
  - 자기 고향 땅으로 갔습니다
  lexicon: HALOT
  rationale: אֶרֶץ는 여기서 ‘땅/영토’의 뜻이 자연스럽고, ‘자기 땅’은 소유격과 귀환의 방향을 모두 살리면서도 ‘나라’처럼 현대 국가 개념을 덧씌우지 않습니다.
theological_decisions:
- issue: 장면의 평가를 덧붙일지 여부
  chosen_reading: 본문은 단순한 귀환 서술로 두고, 장인의 떠남을 설명하거나 평가하는 말을 덧붙이지 않았습니다.
  alternative_readings:
  - 정중한 작별 인사로 풀어 쓰기
  - 미리 허락을 구한 뉘앙스를 보강하기
  rationale: 히브리어 문장은 사건의 진행만 보고하므로, 해석적 설명을 추가하지 않는 것이 원문에 더 충실합니다.
  doctrine_reference: 서술문 해석의 절제 원칙
