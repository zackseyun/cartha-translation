  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
  footnotes:
  - marker: a
    text: Or 'on account of Israel' / 'because of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all the trouble' or 'all the adversity' that had come upon them on the journey.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 그의 장인에게 야훼께서 바로와 이집트에 대해 이스라엘을 위하여 행하신 모든 일과[a], 길에서 그들에게 닥친 모든 고난[b], 그리고 야훼께서 그들을 어떻게 구해 내셨는지를 다 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 때문에’ / ‘이스라엘을 인하여’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘온갖 어려움’이나 ‘온갖 재앙’이 그들에게 길에서 닥쳤다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  english_pob_choice: told
  chosen_korean: 다 말했습니다
  alternatives_korean:
  - 말했습니다
  - 전했습니다
  lexicon: HALOT
  rationale: 피엘 ספר의 ‘자세히 이야기하다/알리다’ 의미를 자연스러운 현대 한국어로 살려, 단순 보고보다 내용이 많은 서술임을 드러냈습니다.
- source_word: חֹתְנוֹ
  english_pob_choice: his father-in-law
  chosen_korean: 그의 장인
  alternatives_korean:
  - 그의 처가 친족
  - 그의 사돈
  lexicon: HALOT
  rationale: 문맥상 모세와 이드로의 친족관계를 가리키므로, 가장 직접적인 한국어 친족어인 ‘장인’을 사용했습니다.
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  english_pob_choice: for Israel’s sake
  chosen_korean: 이스라엘을 위하여
  alternatives_korean:
  - 이스라엘 때문에
  - 이스라엘을 인하여
  lexicon: HALOT
  rationale: 히브리어 관용구의 원인·관계 의미를 유지하면서, 한국어에서 가장 자연스럽고 목적/관계 모두를 포괄하는 ‘위하여’로 옮겼습니다.
- source_word: הַתְּלָאָה
  english_pob_choice: the hardship
  chosen_korean: 모든 고난
  alternatives_korean:
  - 모든 고생
  - 모든 어려움
  - 모든 곤고
  lexicon: HALOT
  rationale: 여정 중 닥친 고통과 곤란을 아우르는 말로 ‘고난’을 택해, 단순 불편보다 더 무거운 고통의 뉘앙스를 살렸습니다.
- source_word: וַיַּצִּלֵם
  english_pob_choice: had delivered them
  chosen_korean: 그들을 어떻게 구해 내셨는지를
  alternatives_korean:
  - 그들을 어떻게 구원하셨는지를
  - 그들을 어떻게 건져 내셨는지를
  lexicon: HALOT
  rationale: נצל의 ‘위기에서 건져 내다/구출하다’ 의미를 살리되, 출애굽 서사의 구체적 구출 행위를 드러내기 위해 ‘구해 내다’를 선택했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명사표를 호칭으로 대체하지 않고 고유명사로 드러내기 위해 ‘야훼’를 사용했습니다. 이는 출애굽 서사의 언약적 주체를 분명히 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה/YHWH → 야훼'
