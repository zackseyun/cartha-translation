  lexicon: HALOT
  rationale: קוֹל의 직역인 ‘목소리’를 유지해 히브리어 관용구의 질감을 보존했습니다.
- source_word: חֹתְנוֹ
  english_pob_choice: his father-in-law
  chosen_korean: 그의 장인
  alternatives_korean:
