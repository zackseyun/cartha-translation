  lexicon: HALOT
  rationale: לְקוֹל과 결합한 שׁמע는 단순 청취보다 ‘듣고 응답하다’의 관용적 의미를 가지므로, 한국어에서는 ‘목소리를 듣고’로 살리되 뒤 절에서 실제 이행을 분리해 표현했습니다.
