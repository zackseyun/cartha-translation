  lexicon: HALOT
  rationale: 문맥상 모세의 장인 이드로를 가리키므로 한국어의 표준 친족어 ‘장인’이 가장 자연스럽고 분명합니다.
- source_word: וַיַּעַשׂ כֹּל אֲשֶׁר אָמָר
  english_pob_choice: did all that he said
  chosen_korean: 그가 말한 것은 모두 행했습니다
  alternatives_korean:
  - 그가 말한 모든 것을 했습니다
  - 그가 한 말대로 모두 했습니다
  lexicon: HALOT
  rationale: ‘עשה’의 직접적 의미를 ‘행했습니다’로 옮기고, 결과적 순종을 분명히 드러내기 위해 ‘말한 것은 모두’로 구조를 자연스럽게 정리했습니다.
theological_decisions:
- issue: שׁמע with obedience nuance
  chosen_reading: ‘듣다’의 관용적 의미를 살리되, 실제 순종은 다음 절로 넘겨 중복 없이 표현했습니다.
  alternative_readings:
  - ‘순종하다’로 직접 옮김
  - ‘듣다’만으로 옮김
  rationale: 본문은 ‘듣는 행위’와 ‘행하는 행위’를 둘로 나누어 서술하므로, 첫 동사를 ‘듣다’로 유지하고 둘째 절에서 실행을 명시하는 편이 히브리어 구조를 더 잘 반영합니다.
  doctrine_reference: 서술 구조 보존
