  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
  footnotes:
  - marker: a
    text: Or 'and each inquired of the other's welfare.' The Hebrew idiom literally speaks of asking 'for peace' and refers to well-being.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세는 자기 장인을 만나러 나가 몸을 굽혀 그에게 입을 맞추었습니다. 그들은 서로의 안부[a]를 묻고 천막으로 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘서로에게 평안을 물었다’입니다. 이는 상대의 평안과 안녕을 묻는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת
  english_pob_choice: to meet
  chosen_korean: 만나러 나가서
  alternatives_korean:
  - 마중 나가서
  - 맞이하러 나가서
  lexicon: HALOT
  rationale: 출발 동작과 만남의 목적이 함께 드러나므로 ‘만나러 나가서’가 가장 자연스럽고 본문의 흐름을 잘 살립니다.
- source_word: חֹתְנוֹ
  english_pob_choice: his father-in-law
  chosen_korean: 그의 장인
  alternatives_korean:
  - 그의 시아버지
  - 그의 사돈
  lexicon: HALOT
  rationale: 이 문맥에서 חֹתֵן은 모세와 관계된 장인을 가리키므로, 한국어에서는 표준 친족어인 ‘장인’이 정확합니다.
- source_word: וַיִּשְׁתַּחוּ
  english_pob_choice: bowed down
  chosen_korean: 몸을 굽혀
  alternatives_korean:
  - 엎드려 절하고
  - 경의를 표하고
  lexicon: HALOT
  rationale: 인간 대상에게 드리는 예의의 동작이므로 예배로 오해될 수 있는 표현을 피하고, 신체 동작 자체를 드러내는 ‘몸을 굽혀’로 옮겼습니다.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  english_pob_choice: Then each asked the other about his welfare
  chosen_korean: 서로의 안부를 묻고
  alternatives_korean:
  - 서로 평안을 묻고
  - 서로의 복록을 묻고
  lexicon: HALOT
  rationale: ‘묻다 שלום’의 관용구를 한국어의 자연스러운 인사 관용인 ‘안부를 묻다’로 풀되, 단순한 인사 이상의 상대의 상태를 묻는 뜻을 보존했습니다.
theological_decisions:
- issue: 모세가 장인 앞에 몸을 굽힌 행위의 의미
  chosen_reading: 사회적 존중과 예우의 표시로 읽고, 예배로 해석하지 않습니다.
  alternative_readings:
  - 예배 행위
  - 과도한 굴복의 표현
  rationale: 동사 자체는 예배 문맥에서도 쓰이지만, 여기서는 인간 간 인사와 입맞춤이 이어지므로 예배로 확대하지 않는 것이 문맥에 충실합니다.
  doctrine_reference: 본문의 긴장을 보존하고, 문맥이 말하지 않는 신학적 결론을 덧붙이지 않습니다.
