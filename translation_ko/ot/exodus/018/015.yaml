base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
  footnotes:
  - marker: a
    text: Or “to inquire of God” or “to seek a ruling from God.” The Hebrew idiom can include the sense of consulting God for guidance or judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세가 그의 장인에게 말했습니다. 「백성이 하나님을 찾으러 제게 오기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님께 묻으러”, “하나님의 판결을 구하러”. 히브리어 관용구는 하나님께 지침이나 판결을 문의하는 뜻을 포함할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 말하였습니다
  lexicon: HALOT
  rationale: 서술문에서 단순 발화 동사를 자연스럽게 옮기되, 합쇼체 서술로 유지했습니다.
- source_word: לְחֹתְנוֹ
  english_pob_choice: to his father-in-law
  chosen_korean: 그의 장인에게
  alternatives_korean:
  - 그의 처가 쪽 친족에게
  - 그의 사위 관계인 사람에게
  lexicon: HALOT
  rationale: 문맥상 모세의 장인 이드로를 가리키므로, 관계를 분명히 하는 표준어 표현으로 옮겼습니다.
- source_word: לִדְרֹשׁ אֱלֹהִים
  english_pob_choice: to seek God
  chosen_korean: 하나님을 찾으러
  alternatives_korean:
  - 하나님께 묻으러
  - 하나님께 문의하러
  - 하나님을 구하러
  lexicon: HALOT
  rationale: 드라쉬의 기본 의미인 ‘찾다/구하다’를 살리면서, 한국어에서는 목적을 나타내는 ‘-러’ 구문이 자연스럽습니다. POB의 ‘seek God’에 맞춰 명시적으로 하나님을 남겼습니다.
theological_decisions:
- issue: לִדְרֹשׁ אֱלֹהִים의 의미 범위
  chosen_reading: ‘하나님을 찾으러’로 넓게 두고, 재판·판결 요청의 뉘앙스를 본문 안에서 과도하게 특정하지 않았습니다.
  alternative_readings:
  - ‘하나님께 묻으러’
  - ‘하나님의 판결을 구하러’
  rationale: 이 표현은 단순한 종교적 탐색과 신탁/판결 문의의 의미를 함께 가질 수 있으므로, 본문은 넓게 두고 해석은 여지를 남기는 것이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §3, 의미의 긴장 보존
