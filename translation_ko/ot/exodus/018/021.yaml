  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
  footnotes:
  - marker: a
    text: Or 'able men,' 'men of valor.' The Hebrew expression can denote strength, competence, or valor depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'trustworthy men' for 'men of truth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'hating unjust gain'; the phrase refers to rejecting corrupt profit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 당신은 온 백성 가운데서 능력 있는 사람들[a], 곧 하나님을 경외하는 사람들, 진실한 사람들, 불의한 이익을 미워하는 사람들을 뽑아 그들 위에 천부장과 백부장과 오십부장[c][b]과 십부장으로 세워야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유능한 사람들’, ‘용사들’. 히브리어 표현은 문맥에 따라 힘, 역량, 용맹을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘믿을 만한 사람들’로서 ‘진실한 사람들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘불의한 이익을 미워하는’; 이 표현은 부정한 이득을 거부한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  english_pob_choice: shall select
  chosen_korean: 뽑아
  alternatives_korean:
  - 선택하여
  - 고르셔서
  - 지정하여
  lexicon: HALOT
  rationale: 문맥상 단순히 ‘보다’가 아니라 자격 있는 사람을 가려 세우는 의미이므로, 자연스러우면서도 선발의 동작을 분명히 하는 ‘뽑다’로 옮겼습니다.
- source_word: אַנְשֵׁי חַיִל
  english_pob_choice: able men
  chosen_korean: 능력 있는 사람들
  alternatives_korean:
  - 유능한 사람들
  - 용사들
  - 힘 있는 사람들
  lexicon: HALOT
  rationale: 이 표현은 군사적 ‘용사’보다 행정·재판 업무를 감당할 수 있는 역량을 가리키므로, 성별 표지를 살리되 기능을 드러내는 ‘능력 있는 사람들’이 적절합니다.
- source_word: אַנְשֵׁי אֱמֶת
  english_pob_choice: men of truth
  chosen_korean: 진실한 사람들
  alternatives_korean:
  - 진리의 사람들
  - 신실한 사람들
  - 믿을 만한 사람들
  lexicon: HALOT
  rationale: 히브리어를 직역하면 ‘진리의 사람들’이지만, 여기서는 성품상의 진실성과 신뢰성을 함께 담는 표현이어서 한국어로는 ‘진실한 사람들’이 더 자연스럽습니다.
- source_word: שֹׂנְאֵי בָצַע
  english_pob_choice: hating dishonest gain
  chosen_korean: 불의한 이익을 미워하는
  alternatives_korean:
  - 부정한 이익을 미워하는
  - 뇌물을 미워하는
  - 탐욕을 미워하는
  lexicon: HALOT
  rationale: בָצַע는 단순한 탐욕보다 부정하게 얻는 이익의 뉘앙스를 지니므로, POB의 의미를 살려 ‘불의한 이익’으로 옮겼습니다.
- source_word: שָׂרֵי ...
  english_pob_choice: chiefs of thousands ... chiefs of tens
  chosen_korean: 천부장과 백부장과 오십부장과 십부장
  alternatives_korean:
  - 천 명의 우두머리와 백 명의 우두머리와 오십 명의 우두머리와 십 명의 우두머리
  - 천인장과 백인장과 오십인장과 십인장
  lexicon: HALOT
  rationale: שָׂר는 통치·관리의 ‘장/우두머리’ 의미를 가지며, 한국어 성경 전통에서 널리 통용되는 행정 단위를 유지하되, 본문 구조를 분명히 하기 위해 순서를 그대로 반영했습니다.
theological_decisions:
- issue: 남성형 복수 표현의 처리
  chosen_reading: ‘능력 있는 사람들’, ‘진실한 사람들’로 옮기되 남성 복수의 원형을 해치지 않는 범위에서 한국어 일반명사로 번역했습니다.
  alternative_readings:
  - 성별 중립적으로 ‘유능한 사람들, 믿을 만한 사람들’로 처리
  - ‘사람들’ 대신 ‘남자들’로 직역
  rationale: 히브리어는 אַנְשֵׁי 형태의 남성 복수를 사용하지만, 한국어에서는 직역형 ‘남자들’이 문맥상 자격 요건을 좁히는 느낌을 줄 수 있어, 성별을 과도하게 드러내지 않으면서도 원문의 형식을 훼손하지 않는 쪽을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
