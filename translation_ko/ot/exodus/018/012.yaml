  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
  footnotes:
  - marker: a
    text: Hebrew 'to eat bread,' an idiom that can mean 'to share a meal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모세의 장인 이드로가 하나님께 번제와 희생 제물들을 가져왔습니다. 아론과 이스라엘의 모든 장로들이 모세의 장인과 함께 하나님 앞에서 떡을 먹으러[a] 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘떡을 먹다’는 관용적으로 ‘식사하다’를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 드렸습니다
  - 취했습니다
  lexicon: HALOT
  rationale: 희생 제물 문맥에서는 한국어가 보통 ‘가져오다’로 자연스럽게 드러내므로, 원문의 ‘취하다’ 동작을 유지하면서 제물의 이동을 분명하게 표현했습니다.
- source_word: עֹלָה
  english_pob_choice: a burnt offering
  chosen_korean: 번제물
  alternatives_korean:
  - 번제
  - 불태우는 제물
  lexicon: HALOT
  rationale: 전통적 제사 용어인 ‘번제’를 쓰되, 본절의 병렬 구조에서는 물건으로 가져온 대상임을 살리기 위해 ‘번제물’로 옮겼습니다.
- source_word: זְבָחִים
  english_pob_choice: sacrifices
  chosen_korean: 희생제물
  alternatives_korean:
  - 제물
  - 희생들
  lexicon: HALOT
  rationale: 번제와 구별되는 더 넓은 제의적 희생을 나타내므로, 일반적인 ‘제물’보다 제의성을 분명히 하는 ‘희생제물’을 선택했습니다.
- source_word: לִפְנֵי הָאֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님 앞에
  - 하나님의 임재 가운데
  lexicon: HALOT
  rationale: לִפְנֵי의 기본 의미를 자연스러운 한국어로 살려, 예배적·의례적 현장을 드러내는 ‘하나님 앞에서’로 옮겼습니다.
theological_decisions:
- issue: לֶאֱכָל לֶחֶם의 관용구성
  chosen_reading: 직역을 유지하되, 공동 식사라는 의미가 드러나도록 문맥 전체를 살렸습니다.
  alternative_readings:
  - ‘식사를 하러’로 의미 번역
  - ‘떡을 먹다’를 그대로 유지
  rationale: 히브리어는 문자적으로 ‘떡을 먹다’이지만, 본문은 제사와 함께하는 언약적 식사 장면입니다. 한국어 본문은 ‘떡을 먹으러 왔습니다’로 투명성을 유지해 이 의례적 의미를 지우지 않았습니다.
  doctrine_reference: source transparency over domestication
