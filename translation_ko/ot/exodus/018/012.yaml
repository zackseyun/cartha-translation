  to: 그때 모세의 장인 이드로가 하나님께 번제와 희생 제물들을 가져왔습니다. 아론과 이스라엘의 모든 장로들이 모세의 장인과 함께 하나님 앞에서 떡을 먹으러[a] 왔습니다.
  rationale: The revision retains the source order and semantic scope, makes the sacrificial terminology more conventional in modern Korean, represents the plural sacrifices, and moves the lexical note marker to its proper phrase-level anchor. It does not resolve beyond the text whether the meal was specifically covenantal or otherwise ritualized.
