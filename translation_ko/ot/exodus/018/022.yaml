  source_fidelity: 수정이 필요합니다. וְהָקֵל מֵעָלֶיךָ는 히필 명령형으로, 모세에게 짐을 덜어 내라고 지시합니다. 초안의 “더 가벼워질 것이고”는 결과 서술로 바꾸어 명령법을 소실합니다. 또한 마지막 וְנָשְׂאוּ אִתָּךְ는 그들이 모세와 함께 짐을 질 것이라는 결과를 나타냅니다.
