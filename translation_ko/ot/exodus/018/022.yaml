  terminology: ‘재판하다’는 כאן의 שפט가 가리키는 사건 처리의 문맥에 적절합니다. ‘큰 일/작은 일’은 원문의 대조와 포괄성을 보존하며, 각주에서 ‘사건’이라는 가능한 문맥적 표현을 제시합니다. ‘짐’은 히브리어에 명시되지 않은 함축이므로 각주를 유지합니다.
