language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁפְט֣וּ אֶת הָ/עָם֮ בְּ/כָל עֵת֒ וְ/הָיָ֞ה כָּל הַ/דָּבָ֤ר הַ/גָּדֹל֙ יָבִ֣יאוּ אֵלֶ֔י/ךָ וְ/כָל הַ/דָּבָ֥ר הַ/קָּטֹ֖ן יִשְׁפְּטוּ הֵ֑ם וְ/הָקֵל֙ מֵֽ/עָלֶ֔י/ךָ וְ/נָשְׂא֖וּ אִתָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
  footnotes:
  - marker: a
    text: Or 'every major case ... every minor case.' The Hebrew uses 'great' and 'small' for matters brought for judgment.
    reason: lexical_alternative
  - marker: b
    text: The final clause implies the burden of judging the people, though 'burden' is not stated explicitly in Hebrew.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 언제든지 백성을 재판하게 하십시오. 모든 큰 일은 그들이 당신에게 가져오게 하고, 모든 작은 일[a]은 그들 스스로 재판하게 하십시오. 그렇게 하여 당신의 짐[b]을 덜어 내십시오. 그러면 그들이 당신과 함께 짐을 질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘큰 일’과 ‘작은 일’이라고 말하지만, 문맥상 ‘중대한 사건’과 ‘사소한 사건’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 여기서 ‘짐’을 직접 말하지 않지만, 문맥상 백성을 재판하는 부담을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  english_pob_choice: let them judge
  chosen_korean: 재판하게 하십시오
  alternatives_korean:
  - 판단하게 하십시오
  - 다스리게 하십시오
  lexicon: HALOT
  rationale: 문맥상 모세에게 재판 업무를 분담하라는 지시이므로, 한국어에서는 단순한 '판단'보다 법정적 기능이 드러나는 '재판하다'가 더 정확합니다.
- source_word: בְּכָל עֵת
  english_pob_choice: at all times
  chosen_korean: 언제든지
  alternatives_korean:
  - 항상
  - 늘
  lexicon: HALOT
  rationale: 정기적이고 상시적인 재판 가능성을 나타내므로, 자연스러운 현대 한국어로는 '언제든지'가 가장 무리 없이 시간의 지속성을 전달합니다.
- source_word: כָּל הַדָּבָר הַגָּדֹל / כָּל הַדָּבָר הַקָּטֹן
  english_pob_choice: every great matter / every small matter
  chosen_korean: 큰 일 / 작은 일
  alternatives_korean:
  - 중대한 사건 / 사소한 사건
  - 큰 사건 / 작은 사건
  lexicon: HALOT
  rationale: 히브리어의 '큰/작은' 대조를 그대로 살리되, 한국어에서는 법률문맥의 '사건'보다 넓은 '일'이 원문의 포괄성을 더 잘 유지합니다.
- source_word: וְהָקֵל מֵעָלֶיךָ
  english_pob_choice: So make it lighter for yourself
  chosen_korean: 그러면 당신에게는 그것이 더 가벼워질 것이고
  alternatives_korean:
  - 그러면 당신의 짐이 더 가벼워질 것이고
  - 그러면 당신에게서 그것이 덜어질 것이고
  lexicon: HALOT
  rationale: 최종 절은 Hiphil 명령형 뒤의 결과를 나타내므로, 한국어도 명령으로 바꾸지 않고 결과 서술로 옮겨 '더 가벼워질'을 사용했습니다.
- source_word: וְנָשְׂאוּ אִתָּךְ
  english_pob_choice: and they will bear the burden with you
  chosen_korean: 그들은 당신과 함께 그 짐을 질 것입니다
  alternatives_korean:
  - 그들은 당신과 함께 그것을 질 것입니다
  - 그들은 당신과 함께 그 부담을 질 것입니다
  lexicon: HALOT
  rationale: 히브리어에는 목적어 '짐/부담'이 직접 없지만 문맥상 재판의 부담이 암시되므로, POB의 audit trail에 맞추어 '그 짐'을 보충해 자연스럽게 표현했습니다.
theological_decisions:
- issue: 재판 업무의 분담을 지시하는 문장의 명령-결과 관계
  chosen_reading: 전반부는 지시형으로, 마지막 절은 그 결과를 설명하는 서술형으로 옮겼습니다.
  alternative_readings:
  - 마지막 절도 명령형으로 처리
  - 전 절을 단순 미래형으로 처리
  rationale: 히브리어의 וְהָקֵל은 명령형이며, 본문은 모세의 부담 경감을 제도적 분담의 결과로 제시합니다. 따라서 한국어에서도 문법 기능을 구분하는 것이 본문의 논리를 더 정확히 드러냅니다.
  doctrine_reference: 본문의 행정적 지혜와 공동 책임 분담
