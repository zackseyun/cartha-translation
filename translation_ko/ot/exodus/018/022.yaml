revisions:
- from: 그들이 백성을 언제든지 재판하게 하십시오. 큰 일은 모두 당신에게 가져오고, 작은 일은 그들 자신이 재판하게 하십시오. 그러면 당신에게는 그것이 더 가벼워질 것이고, 그들은 당신과 함께 그 짐을 질 것입니다.[a][b]
  to: 그들이 언제든지 백성을 재판하게 하십시오. 모든 큰 일은 그들이 당신에게 가져오게 하고, 모든 작은 일[a]은 그들 스스로 재판하게 하십시오. 그렇게 하여 당신의 짐[b]을 덜어 내십시오. 그러면 그들이 당신과 함께 짐을 질 것입니다.
  rationale: 히브리어 명령형 וְהָקֵל의 기능을 보존하도록 마지막에서 둘째 절을 명령형으로 바로잡았습니다. 뒤따르는 וְנָשְׂאוּ는 그 조치의 결과이므로 ‘그러면 … 질 것입니다’로 옮겼습니다. ‘짐’은 문맥상 함축된 목적어로 자연스럽게 보충하되 각주로 명시했습니다.
