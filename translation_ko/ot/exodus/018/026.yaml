id: EXO.18.26
reference: Exodus 18:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם בְּ/כָל עֵ֑ת אֶת הַ/דָּבָ֤ר הַ/קָּשֶׁה֙ יְבִיא֣וּ/ן אֶל מֹשֶׁ֔ה וְ/כָל הַ/דָּבָ֥ר הַ/קָּטֹ֖ן יִשְׁפּוּט֥וּ הֵֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/026.yaml
  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
  footnotes:
  - marker: a
    text: Or 'every hard case ... every minor matter.' The Hebrew contrasts the difficult cases with the smaller ones in a judicial setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 언제나 백성을 재판했습니다. 어려운 일은 모두 모세에게 가져가고, 쉬운 일은 그들끼리 재판했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어려운 일’은 ‘어려운 사건/사안’, ‘쉬운 일’은 ‘작은 사건/사안’의 뜻으로 이해할 수 있습니다. 히브리어는 재판 맥락에서 더 무거운 사건과 더 가벼운 사건을 대비합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  english_pob_choice: they judged
  chosen_korean: 재판했습니다
  alternatives_korean:
  - 판단했습니다
  - 심판했습니다
  lexicon: HALOT
  rationale: 법정 문맥의 שׁפט는 단순한 의견 판단이 아니라 판결·재판의 행위를 가리키므로, 한국어에서는 ‘재판했습니다’가 의미를 가장 분명하게 드러냅니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 민족
  lexicon: HALOT
  rationale: 출애굽기의 עַם은 공동체 전체를 가리키므로, ‘백성’이 자연스럽고 문맥에도 맞습니다.
- source_word: הַדָּבָר הַקָּשֶׁה / הַדָּבָר הַקָּטֹן
  english_pob_choice: every difficult matter / every small matter
  chosen_korean: 어려운 일 / 쉬운 일
  alternatives_korean:
  - 어려운 사건 / 작은 사건
  - 어려운 사안 / 작은 사안
  lexicon: HALOT
  rationale: 법적 사안을 가리키는 דָּבָר의 범주 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘일’로 옮겼습니다. קשה와 קטן의 대비는 ‘어려운/쉬운’으로 선명하게 보입니다.
- source_word: הֵם
  english_pob_choice: they themselves
  chosen_korean: 그들끼리
  alternatives_korean:
  - 그들 자신이
  - 그들 스스로
  lexicon: HALOT
  rationale: 독립 대명사 הם은 어려운 사건을 모세에게 올리는 것과 달리, 작은 사건은 판결권이 그들에게 남아 있음을 강조합니다. 한국어에서는 ‘그들끼리’가 그 대비와 자족성을 간결하게 드러냅니다.
theological_decisions:
- issue: 모세에게 가져가는 재판 구조와 권위 분담
  chosen_reading: 어려운 일은 모세에게 올리고, 쉬운 일은 하위 재판관들이 맡는 질서로 이해했습니다.
  alternative_readings:
  - 단순한 행정 분담
  - 법률 자문 체계
  rationale: 문맥은 재판 권한의 위임과 단계적 심리를 보여 주므로, 일반 행정보다 사법적 질서를 드러내는 쪽이 원문 의도에 더 가깝습니다.
  doctrine_reference: 출애굽기 18장 문맥 전체의 재판 제도 설치
- issue: 반복적 관습 동사의 시제
  chosen_reading: 현재적 일반 진술처럼 자연스러운 합쇼체 과거형으로 옮겼습니다.
  alternative_readings:
  - 계속 재판하고 있었습니다
  - 재판하곤 했습니다
  rationale: 히브리어 완료·미완료의 반복적 관습 의미를 한국어에서는 서술형 과거로 담는 것이 가장 간결하고 읽기 자연스럽습니다.
  doctrine_reference: 서사체의 관습적 반복 표현
