  source_fidelity: ‘쉬운 일’은 히브리어 הַדָּבָר הַקָּטֹן(직역하면 ‘작은 사안’)을 ‘어려운’의 단순 반대말로 해석하여 원문의 어휘적 대비를 바꿉니다. משפט 문맥상 ‘사건’이 דָּבָר의 뜻을 더 분명하게 전달합니다. 어려운 사건을 모세에게 가져가고 작은 사건은 그들이 직접 재판한다는 반복적 제도 운용은 정확히 반영할 수 있습니다.
  naturalness: ‘그들은 언제나 백성을 재판했습니다’와 ‘그들이 직접 재판했습니다’는 현대 표준 한국어의 격식 있는 합쇼체에 자연스럽습니다. ‘그들끼리’는 독립대명사의 강조를 어느 정도 나타내지만, 함께 처리했다는 뉘앙스도 낼 수 있으므로 ‘그들이 직접’이 더 정확합니다.
  terminology: 법적 문맥의 שׁפט는 ‘재판했습니다’로, הָעָם은 ‘백성’으로 옮기는 것이 적절합니다. דָּבָר는 여기서 ‘사건’으로 번역하고, קָשֶׁה/קָטֹן의 대비는 ‘어려운/작은’으로 보존해야 합니다.
  issues:
