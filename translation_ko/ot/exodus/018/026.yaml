    issue: ‘쉬운 일’이 ‘작은 사안’이라는 원문의 표현을 바꿉니다.
    rationale: קָטֹן은 ‘쉬운’이 아니라 ‘작은, 경미한’의 의미입니다. 문맥상 작은 사건이 통상 더 처리하기 쉬울 수는 있지만, 번역문은 그 해석을 원문의 어휘 대비 대신 제시합니다.
  - severity: low
