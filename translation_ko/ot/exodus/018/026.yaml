    rationale: 독립대명사 הֵם은 그들이 작은 사건을 직접 판결했음을 강조합니다. ‘그들끼리’는 상호 간에 처리했다는 뉘앙스를 더할 수 있습니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 있어 설명 대상이 분명하지 않습니다.
    rationale: 각주가 어려운 사건과 작은 사건의 어휘 대비를 설명하므로, 해당 표현 곁에 표지를 두는 편이 앵커 기능에 더 적절합니다.
