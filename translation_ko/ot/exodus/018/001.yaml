- from: 이제 미디안의 제사장, 모세의 장인 이드로는 하나님께서 모세와 이스라엘, 곧 그의 백성을 위해 행하신 모든 일과, 야훼께서 이스라엘을 이집트에서 이끌어 내셨다는 사실을 들었습니다.[a]
