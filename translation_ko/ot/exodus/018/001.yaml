  rationale: 명시되지 않은 시간 부사 ‘이제’를 제거하고, 히브리어 כִּי절의 설명적 내용을 ‘곧’으로 자연스럽게 연결했습니다. עַמּוֹ의 지시 대상에 대한 원문의 해석상 여지는 본문과 각주에서 그대로 보존했습니다.
