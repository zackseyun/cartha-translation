  source_fidelity: ‘이제’는 히브리어 וַיִּשְׁמַע의 서사 진행 기능을 별도의 시간 부사로 과도하게 명시하므로 삭제하는 것이 적절합니다. 그 밖에는 이드로의 직함과 인척 관계, 하나님/야훼의 명칭 구별, 모세와 이스라엘을 위한 행위, 출애굽의 내용을 충실히 반영합니다. כִּי의 설명·내용 기능은 ‘곧’으로 자연스럽게 드러냈습니다.
  naturalness: ‘모든 일과, … 사실을 들었습니다’는 병렬 연결과 쉼표가 다소 부자연스럽습니다. ‘모든 일, 곧 … 이끌어 내신 일을 들었습니다’로 고치면 히브리어의 관계절 및 설명절 구조를 보존하면서 현대 한국어 문장으로도 매끄럽습니다.
  terminology: ‘미디안의 제사장’, ‘모세의 장인’, ‘하나님’, ‘야훼’, ‘이집트’, ‘이끌어 내신’은 적절합니다. עַמּוֹ의 선행사를 본문에서 확정하지 않고 ‘그의 백성’으로 유지하며, 각주 표지를 해당 구절에 직접 붙입니다.
