language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Now Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
  footnotes:
  - marker: a
    text: Or, 'Israel, Moses’ people.' The pronoun in 'his people' could grammatically be taken with Moses, though in context it most likely refers to God.
    reason: alternative_reading
translation:
  language: ko
  text: 미디안의 제사장, 모세의 장인 이드로는 하나님께서 모세와 이스라엘, 곧 그의 백성[a]을 위하여 행하신 모든 일, 곧 야훼께서 이스라엘을 이집트에서 이끌어 내신 일을 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 백성’의 대명사는 문법상 모세를 가리킬 수도 있으나, 문맥상으로는 하나님을 가리킬 가능성이 더 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹהֵן מִדְיָן
  english_pob_choice: the priest of Midian
  chosen_korean: 미디안의 제사장
  alternatives_korean:
  - 미디안의 사제
  - 미디안의 종교 지도자
  lexicon: HALOT
  rationale: 지위와 소속을 함께 나타내는 소유격 구조를 자연스럽게 살렸고, POB의 ‘priest’에 맞춰 제사장으로 옮겼습니다.
- source_word: חֹתֵן מֹשֶׁה
  english_pob_choice: Moses’ father-in-law
  chosen_korean: 모세의 장인
  alternatives_korean:
  - 모세의 시아버지
  - 모세와 혼인 관계인 사람
  lexicon: HALOT
  rationale: 히브리어 חֹתֵן은 이 문맥에서 결혼으로 맺어진 인척 관계를 가리키므로, 표준적인 한국어 대응인 장인으로 번역했습니다.
- source_word: אֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님이
  - 신
  lexicon: WLC
  rationale: 주어 역할의 אֱלֹהִים을 한국어 성경의 일관된 용례에 따라 하나님으로 옮겼습니다.
- source_word: עַמּוֹ
  english_pob_choice: his people
  chosen_korean: 그의 백성
  alternatives_korean:
  - 모세의 백성
  - 하나님의 백성
  lexicon: HALOT
  rationale: 대명사 ‘his’의 지시 대상이 본문만으로는 문법적으로 다소 열려 있으므로, POB의 보류적 처리를 따라 ‘그의 백성’으로 두어 해석을 과잉 확정하지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문자 그대로의 신명기 이름을 보존하는 프로젝트 기본값에 따라 야훼를 사용했습니다.
- source_word: הוֹצִיא
  english_pob_choice: had brought ... out
  chosen_korean: 이끌어 내셨다는
  alternatives_korean:
  - 끌어내셨다는
  - 데리고 나오셨다는
  lexicon: HALOT
  rationale: 출애굽 문맥에서 단순한 이동보다 구출·인도 의미가 강하므로, ‘이끌어 내다’로 자연스럽고 स्रोत 충실하게 옮겼습니다.
theological_decisions:
- issue: עַמּוֹ의 소유대명사 해석
  chosen_reading: ‘그의 백성’으로 두어, 그 ‘그’가 하나님일 가능성을 본문에서 열어 둡니다.
  alternative_readings:
  - ‘모세의 백성’으로 특정한다
  - 본문이 이미 하나님을 분명한 선행사로 확정한다
  rationale: 히브리어에서는 대명사 지시가 문법적으로 열려 있고, 앞뒤 문맥상 하나님과 모세 두 가능성이 모두 논의될 수 있으므로, 본문이 허용하는 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
