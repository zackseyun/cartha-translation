  to: 그리고 그녀의 두 아들도 데리고 왔습니다. 그들 가운데 한 아들의 이름은 게르솜이었습니다. 이는 모세가 “나는 낯선 땅에서 나그네[a]로 지냈다”라고 말했기 때문입니다.
