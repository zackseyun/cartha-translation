translation:
  language: ko
  text: 그리고 그녀의 두 아들도 데리고 왔습니다. 그들 가운데 한 아들의 이름은 게르솜이었습니다. 이는 모세가 “나는 낯선 땅에서 나그네[a]로 지냈다”라고 말했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거류민’. 히브리어 גֵּר는 다른 땅에 사는 임시 거주자, 외부자, 또는 외국인을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי בָנֶיהָ
  english_pob_choice: her two sons
  chosen_korean: 그의 두 아들
  alternatives_korean:
  - 그녀의 두 아들
  - 두 아들
  lexicon: HALOT
  rationale: 히브리어는 직역상 ‘그녀의 두 아들’이지만, 이 절의 바로 앞 맥락에서 모세의 아들들을 가리키므로 한국어에서는 대명사를 문맥에 맞게 풀어 ‘그의 두 아들’로 옮기는 편이 자연스럽습니다.
- source_word: שֵׁם הָאֶחָד
  english_pob_choice: the name of the one
  chosen_korean: 그중 한 아들의 이름은
  alternatives_korean:
  - 그 한 아들의 이름은
  - 첫째의 이름은
  lexicon: HALOT
  rationale: 히브리어는 ‘그 한 사람/하나’라는 구분 표현이므로, 순서를 단정하는 ‘첫째’보다 단순히 둘 가운데 하나를 가리키는 ‘그중 한 아들’이 원문에 가깝습니다.
- source_word: גֵּר
  english_pob_choice: a foreigner
  chosen_korean: 나그네
  alternatives_korean:
  - 외국인
  - 소객
  - 거류민
  lexicon: HALOT
  rationale: גֵּר는 단순한 국적상 외국인보다 한 땅에서 정착하지 못한 ‘거류자/이방 체류자’의 뉘앙스가 있어, 한국어에서는 전통적으로 이 의미를 가장 잘 담는 ‘나그네’를 택했습니다.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  english_pob_choice: in a foreign land
  chosen_korean: 타국 땅에서
  alternatives_korean:
  - 외국 땅에서
  - 낯선 땅에서
  - 이방의 땅에서
  lexicon: HALOT
  rationale: נָכְרִיָּה는 ‘낯선/외국의’라는 뜻이므로, 현대 한국어에서 간결하고 자연스러운 ‘타국 땅’으로 옮겨 외부자라는 감각을 살렸습니다.
theological_decisions:
- issue: גֵּר의 의미 범위
  chosen_reading: ‘나그네’는 단순 관광객이 아니라 거주권이 불안정한 외부자라는 의미를 드러냅니다.
  alternative_readings:
  - ‘외국인’으로만 처리하면 체류·객원성의 뉘앙스가 약해질 수 있습니다.
  - ‘소객’은 의미는 가깝지만 현대 한국어에서 너무 낯설 수 있습니다.
  rationale: 이 절은 게르솜이라는 이름 설명을 통해 모세의 타자성·이방 체류 경험을 강조하므로, 사회적·신학적 함의를 유지하는 번역이 필요합니다.
  doctrine_reference: 출애굽기 18:3의 명명 설명과 타지 체류 경험
