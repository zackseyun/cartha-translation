  source_fidelity: 수정이 필요합니다. וְאֵת은 앞 절의 ‘데리고 왔습니다’에 이어지는 직접목적어이므로 ‘그의 두 아들도 있었는데’는 동작과 연결 관계를 충분히 반영하지 못합니다. בָנֶיהָ는 십보라를 가리키므로 ‘그녀의 두 아들’이 적절합니다. 또한 כִּי אָמַר은 이름의 이유를 설명하는 바깥 절이며, 인용문 자체를 ‘…때문이다’로 만들기보다 ‘이는 그가 …라고 말했기 때문입니다’로 옮기는 편이 원문의 구조를 보존합니다.
  naturalness: 수정문은 앞 절과 자연스럽게 연결되며, 현대 표준어 합쇼체에 맞습니다. ‘나그네’는 문맥상 가능하지만 현대 독자가 일시적 방문자로 오해할 여지가 있어 각주에서 ‘거류민’ 등의 의미 범위를 밝혔습니다.
  terminology: 게르솜은 통용 음역으로 유지했습니다. גֵּר는 본문에서 ‘나그네’로 번역하되, 체류 외부자라는 의미 범위를 각주로 보완했습니다. נָכְרִיָּה는 ‘낯선 땅’으로 옮겨 타지라는 의미를 자연스럽게 드러냈습니다.
