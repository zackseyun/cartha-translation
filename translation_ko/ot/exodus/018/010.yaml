  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
  footnotes:
  - marker: a
    text: Or 'Blessed is the LORD' or 'May the LORD be blessed.' The Hebrew blessing formula can be represented in more than one natural English way.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the hand of Egypt ... from under the hand of Egypt,' an idiom for deliverance from oppressive power or control.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이드로가 말했습니다. “야훼는 복되십니다. 그분은 이집트 사람들의 손과 바로의 손에서 너희를 건져 내셨고, 이집트 사람들의 손 아래에서 그 백성을 건져 내셨습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 축복 공식은 한국어로 ‘복되십니다’, ‘복을 받으십시오’ 등 여러 자연스러운 방식으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손’은 히브리어의 권세·지배를 나타내는 관용구로, 여기서는 억압적 통제에서의 구출을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יִתְרוֹ
  english_pob_choice: And Yitro said
  chosen_korean: 그때 이드로가 말했습니다
  alternatives_korean:
  - 그리고 이드로가 말했습니다
  - 이드로가 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리되, 히브리어 이름 형태를 반영해 전통형보다 음역형 ‘이드로’를 택했습니다.
- source_word: בָּרוּךְ יְהוָה
  english_pob_choice: Blessed be Yahweh
  chosen_korean: 야훼는 복되십니다
  alternatives_korean:
  - 야훼는 복을 받으십니다
  - 야훼는 찬송받으십니다
  lexicon: HALOT
  rationale: 히브리어 축복 공식을 한국어로 자연스럽게 옮기면서도, ‘복되다’라는 상태 진술로 doxological force를 유지했습니다.
- source_word: מִיַּד ... וּמִיַּד ... מִתַּחַת יַד
  english_pob_choice: from the hand of ... from under the hand of
  chosen_korean: 손과 ... 손 아래에서
  alternatives_korean:
  - 권세와 ... 권세 아래에서
  - 손아귀와 ... 손아귀 아래에서
  lexicon: HALOT
  rationale: ‘손’ 이미지를 유지해 억압적 지배의 구체성을 살렸고, 반복되는 יד idiom을 한국어에서도 일관되게 드러냈습니다.
- source_word: מִצְרַיִם
  english_pob_choice: the Egyptians
  chosen_korean: 이집트 사람들
  alternatives_korean:
  - 이집트인들
  - 이집트
  lexicon: HALOT
  rationale: 문맥상 민족 집단을 가리키므로 장소명보다 집단명으로 옮겨, 영어 POB의 revised reading과 같은 의미를 반영했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 신명(神名)을 가리키므로 대체 호칭 대신 음역형 ‘야훼’를 사용해 원문 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 축복 진술의 어순과 존대
  chosen_reading: “야훼는 복되십니다”
  alternative_readings:
  - “야훼여, 복을 받으십시오”
  - “야훼를 찬송합니다”
  rationale: 인물의 축복 선언이므로 직접적인 기도형보다 선언형이 원문에 가깝고, 인용문 내부에서도 합쇼체를 유지했습니다.
  doctrine_reference: source syntax and speech act
