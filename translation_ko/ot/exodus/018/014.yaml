source:
  edition: WLC
  text: וַ/יַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כָּל אֲשֶׁר ה֥וּא עֹשֶׂ֖ה לָ/עָ֑ם וַ/יֹּ֗אמֶר מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָ/עָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְ/בַדֶּ֔/ךָ וְ/כָל הָ/עָ֛ם נִצָּ֥ב עָלֶ֖י/ךָ מִן בֹּ֥קֶר עַד עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
  footnotes:
  - marker: a
    text: Or “What is this matter that you are doing for the people?”
    reason: lexical_alternative
  - marker: b
    text: Literally “stand over you”; the phrase here means standing before Moses in attendance, likely for judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 모세의 장인은 모세가 백성을 위하여 하는 모든 일을 보고 말했습니다. “당신이 백성을 위하여 하고 있는 이 일[a]은 무엇입니까? 왜 당신은 혼자 앉아 있고, 온 백성은 아침부터 저녁까지 당신 앞에 서 있습니까?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דָּבָר는 여기서 ‘일’ 또는 ‘문제’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신 위에 서 있다’입니다. 여기서는 모세 앞에 서서 응대를 기다리는 것을 가리키며, 문맥상 재판을 기다리는 모습일 가능성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  english_pob_choice: Moses's father-in-law
  chosen_korean: 모세의 장인
  alternatives_korean:
  - 모세의 장인의
  - 모세의 시아버지
  lexicon: HALOT
  rationale: חֹתֵן은 혼인 관계로 맺어진 장인을 뜻하며, 본문 맥락상 모세의 장인 이드로를 가리키므로 가장 자연스럽고 직접적으로 옮겼습니다.
- source_word: וַיַּרְא
  english_pob_choice: saw
  chosen_korean: 보고
  alternatives_korean:
  - 보았습니다
  - 살폈습니다
  lexicon: HALOT
  rationale: ראה의 기본 의미인 ‘보다’를 유지해, 장면의 관찰 사실을 해석 없이 전달했습니다.
- source_word: לָעָם
  english_pob_choice: for the people
  chosen_korean: 백성을 위해
  alternatives_korean:
  - 백성을 향해
  - 백성에게
  lexicon: HALOT
  rationale: ל의 여기서의 용법은 단순한 방향이 아니라 모세의 행동이 백성을 위한 것임을 나타내므로 ‘위해’가 가장 적절합니다.
- source_word: מָה הַדָּבָר הַזֶּה
  english_pob_choice: What is this thing
  chosen_korean: 이 일이 무엇입니까
  alternatives_korean:
  - 이것이 무슨 일입니까
  - 이 일이 무엇이란 말입니까
  lexicon: HALOT
  rationale: דָּבָר를 ‘일’로 옮기면 한국어에서 사건·처지·행위를 아우르는 자연스러운 질문이 되며, 본문의 관행을 묻는 뉘앙스를 잘 살립니다.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  english_pob_choice: while all the people stand before you
  chosen_korean: 온 백성은 아침부터 저녁까지 당신 앞에 서 있습니까
  alternatives_korean:
  - 온 백성이 당신 위에 서 있습니까
  - 온 백성이 당신 앞에서 서 있습니까
  lexicon: HALOT
  rationale: נִצָּב עָלֶיךָ는 재판이나 응대 자리에서 ‘앞에 서 있다’는 뜻으로 쓰이므로, 영어 주석의 취지를 따라 한국어로는 ‘당신 앞에 서 있’으로 풀었습니다.
theological_decisions:
- issue: 모세의 역할이 단순한 대화가 아니라 백성을 대표하여 처리하는 공적 기능임을 어떻게 드러낼지
  chosen_reading: ‘백성을 위해’와 ‘당신 앞에 서 있습니까’를 유지해, 모세가 개인적으로 시간을 보내는 장면이 아니라 백성을 대신해 공적 사안을 처리하는 장면임을 드러냈습니다.
  alternative_readings:
  - ‘백성에게’
  - ‘당신 둘레에 서 있습니까’
  rationale: 본문의 לָעָם과 נִצָּב עָלֶיךָ는 단순한 공간 묘사보다 대표적·사법적 상황을 시사하므로, 이를 완화하지 않고 드러내는 것이 स्रोत 의미에 충실합니다.
  doctrine_reference: 출애굽기 18:13-16의 문맥상 재판과 판결의 장면
