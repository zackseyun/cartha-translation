  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
  footnotes:
  - marker: a
    text: Hebrew simply reads, 'for the God of my father was my help, and he delivered me from Pharaoh’s sword,' without an explicit 'he said.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다른 하나의 이름은 엘리에셀이었습니다. 이는 내 아버지의 하나님이 나의 도움이 되셨고, 바로의 칼에서 나를 건져 주셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 아버지의 하나님이 나의 도움이 되셨고, 바로의 칼에서 나를 건져 주셨다’고만 읽으며, 별도의 ‘그가 말씀하셨다’는 표현은 없습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  english_pob_choice: And the name of the other
  chosen_korean: 다른 하나의 이름은
  alternatives_korean:
  - 그리고 한 사람의 이름은
  - 그 다른 하나의 이름은
  lexicon: HALOT
  rationale: 이전 절에서 이미 한 아들의 이름이 나온 뒤의 대조적 이름 소개이므로, 자연스러운 한국어로 ‘다른 하나’의 대비를 살렸습니다.
- source_word: אֱלִיעֶזֶר
  english_pob_choice: Eliezer
  chosen_korean: 엘리에셀
  alternatives_korean:
  - 엘리에제르
  - 엘리에셀
  lexicon: 고유명사 표기 관행
  rationale: 인명은 현대 한국어 외래어 표기 관행에 따라 음역했습니다.
- source_word: אֱלֹהֵי אָבִי
  english_pob_choice: The God of my father
  chosen_korean: 내 아버지의 하나님
  alternatives_korean:
  - 아버지의 하나님
  - 나의 아버지 하나님
  lexicon: HALOT
  rationale: 히브리어 소유격 구조를 그대로 살리면서, 출애굽기 문맥의 언약적 하나님을 ‘하나님’으로 옮겼습니다.
- source_word: בְּעֶזְרִי
  english_pob_choice: was my help
  chosen_korean: 나의 도움이 되셨고
  alternatives_korean:
  - 나의 도움이셨고
  - 나를 도우셨고
  lexicon: HALOT
  rationale: ‘~의 도움이 되다’는 명사적 표현을 한국어답게 풀어, 과거 회고의 의미를 분명히 했습니다.
- source_word: וַיַּצִּלֵנִי מֵחֶרֶב פַּרְעֹה
  english_pob_choice: and he delivered me from Pharaoh’s sword
  chosen_korean: 바로의 칼에서 나를 건져 주셨기 때문입니다
  alternatives_korean:
  - 바로의 칼에서 나를 구해 주셨기 때문입니다
  - 바로의 칼로부터 나를 건지셨기 때문입니다
  lexicon: HALOT
  rationale: נצל의 구원·구출 뉘앙스를 살려 ‘건져 주셨다’로 옮겼고, ‘바로의 칼’은 왕의 폭력적 위협을 직접적으로 드러냅니다.
theological_decisions:
- issue: 이유절의 기능
  chosen_reading: ‘이는 … 때문입니다’로 옮겨 이름의 의미 설명이라는 기능을 분명히 했습니다.
  alternative_readings:
  - '단순 병렬: ‘… 하나님이 나의 도움이 되셨고, 나를 건져 주셨습니다’'
  - '설명 생략형: ‘… 엘리에셀입니다’'
  rationale: 히브리어 כִּי는 여기서 이름의 배경 설명을 여는 기능이므로, 한국어에서도 이유·설명 구조를 분명히 드러내는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 서사 속 명명 설명의 통사 기능
- issue: 직접화법 추가 여부
  chosen_reading: 본문에 없는 ‘그가 말하셨다’는 추가하지 않았습니다.
  alternative_readings:
  - ‘이는 하나님이 …’ 앞에 암시적 화법을 보충
  rationale: 영어 POB audit trail에서도 해당 보충이 원문에 없다고 정정되어 있으므로, 히브리어의 무표지 명명 설명을 그대로 유지했습니다.
  doctrine_reference: 본문 충실성
