source:
  edition: WLC
  text: אִ֣ם אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ תַּעֲשֶׂ֔ה וְ/צִוְּ/ךָ֣ אֱלֹהִ֔ים וְ/יָֽכָלְתָּ֖ עֲמֹ֑ד וְ/גַם֙ כָּל הָ/עָ֣ם הַ/זֶּ֔ה עַל מְקֹמ֖/וֹ יָבֹ֥א בְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
  footnotes:
  - marker: a
    text: Or 'this matter' or 'this plan.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'stand'; here in context, 'endure' or 'hold up.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'all this people,' using a collective singular.
    reason: lexical_alternative
  - marker: d
    text: Or 'will come to his place'; the sense is that the people will return each to their proper place in peace.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 이 일을 하면, 하나님께서도 당신에게 그렇게 명령하실 것이며, 당신은 견딜 수 있을 것이고, 이 모든 백성도 자기 곳으로 평안히 갈 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 앞서 제안된 구체적인 조치입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘서다’는 여기서 ‘견디다/감당하다’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 집합명사 ‘이 백성’을 사용합니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘그의 곳으로’이며, 사람들은 각각 자기 처소로 돌아간다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֶת הַדָּבָר הַזֶּה
  english_pob_choice: If you do this thing
  chosen_korean: 당신이 이 일을 하면
  alternatives_korean:
  - 당신이 이 일을 한다면
  - 당신이 이 일을 수행하면
  - 당신이 이 일을 하면
  lexicon: HALOT
  rationale: דָּבָר는 여기서 앞서 제안된 구체적 조치를 가리키므로, 한국어에서는 ‘이 일’이 가장 자연스럽고 직접적입니다.
- source_word: וְצִוְּךָ אֱלֹהִים
  english_pob_choice: and God so commands you
  chosen_korean: 하나님께서도 당신에게 그렇게 명령하실 것이며
  alternatives_korean:
  - 그리고 하나님께서 당신에게 명령하실 것이며
  - 그리고 하나님께서 당신을 명령하시면
  - 그리고 하나님께서도 당신에게 명령하실 것이며
  lexicon: HALOT
  rationale: צוה의 핵심은 ‘명령하다’이므로 이를 살리고, 접속의 누적 조건을 드러내기 위해 ‘도’와 ‘그렇게’를 넣어 두 조건의 결합을 반영했습니다.
- source_word: וְיָכָלְתָּ עֲמֹד
  english_pob_choice: then you will be able to endure
  chosen_korean: 당신은 견딜 수 있을 것이고
  alternatives_korean:
  - 당신은 설 수 있을 것이고
  - 당신은 버틸 수 있을 것이고
  - 당신은 감당할 수 있을 것이고
  lexicon: HALOT
  rationale: ‘서다’의 문자적 의미를 살릴 수 있지만, 문맥상 모세가 감당할 수 있는지의 문제이므로 ‘견디다’가 더 정확하게 힘과 부담의 지속 가능성을 전달합니다.
- source_word: כָּל הָעָם הַזֶּה ... בְשָׁלוֹם
  english_pob_choice: and all this people also will go to their place in peace
  chosen_korean: 이 모든 백성도 자기 곳으로 평안히 갈 것입니다
  alternatives_korean:
  - 이 모든 백성도 자기 자리로 평안히 갈 것입니다
  - 이 모든 백성도 제 자리로 평안히 갈 것입니다
  - 이 모든 백성도 그들의 곳으로 평안히 갈 것입니다
  lexicon: HALOT
  rationale: הָעָם은 집합명사이므로 ‘이 모든 백성’이 자연스럽고, עַל־מְקֹמוֹ와 בְשָׁלוֹם은 ‘자기 곳으로 평안히’로 옮겨 귀환과 안녕의 뜻을 함께 살렸습니다.
theological_decisions:
- issue: 하나님의 명령이 먼저라는 조건 구조
  chosen_reading: 이 조언은 모세가 먼저 이 일을 하고, 더 나아가 하나님께서도 그 일을 명령하실 때에만 성립하는 조건으로 옮겼습니다.
  alternative_readings:
  - 하나님께서 그때 명령하실 것이라는 예고로 읽을 수도 있습니다
  - 단순한 예언형으로 완화해도 됩니다
  rationale: 히브리어는 ‘만일… 하면’과 ‘하나님께서 명령하시면’이 함께 놓여 있어, 인적 제안이 아니라 하나님의 승인 아래서만 실행될 수 있음을 드러냅니다.
  doctrine_reference: 하나님의 주권과 계시된 명령의 우선성
