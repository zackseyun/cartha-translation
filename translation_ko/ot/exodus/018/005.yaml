  text: וַ/יָּבֹ֞א יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה וּ/בָנָ֥י/ו וְ/אִשְׁתּ֖/וֹ אֶל מֹשֶׁ֑ה אֶל הַ/מִּדְבָּ֗ר אֲשֶׁר ה֛וּא חֹנֶ֥ה שָׁ֖ם הַ֥ר הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
  footnotes:
  - marker: a
    text: Or 'and his sons and his wife.' The Hebrew conjunction can be represented more literally, though English idiom often uses 'with' for accompanying persons.
    reason: lexical_alternative
  - marker: b
    text: That is, 'the mountain of God,' a designation associated with Sinai/Horeb.
    reason: cross_reference
translation:
  language: ko
  text: 그때 모세의 장인 이드로가 자기 아들들과 자기 아내를 데리고, 모세가 진을 치고 있는 광야, 곧 하나님의 산에서 모세에게 왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 동반 인물을 단순 접속으로도, 한국어는 '데리고/함께'로도 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''하나님의 산''은 이 절의 히브리어 표현을 직역한 것으로, 시내/호렙을 본문 밖에서 덧붙이지 않습니다.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 왔습니다
  alternatives_korean:
  - 그리고 ... 왔습니다
  - 그리하여 ... 왔습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 자연스러운 한국어 순서 표지로 살렸습니다. '그때'는 이어지는 사건을 매끄럽게 연결합니다.
- source_word: חֹתֵן מֹשֶׁה
  english_pob_choice: Moses' father-in-law
  chosen_korean: 모세의 장인
  alternatives_korean:
  - 모세의 아버지의 형제
  - 모세의 처가 쪽 어른
  lexicon: HALOT
  rationale: 관계 명칭을 한국어의 가장 정확하고 자연스러운 친족어인 '장인'으로 옮겼습니다.
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  english_pob_choice: with his sons and his wife
  chosen_korean: 자기 아들들과 자기 아내를 데리고
  alternatives_korean:
  - 자기 아들들과 자기 아내와 함께
  - 그의 아들들과 그의 아내를 데리고
  lexicon: HALOT
  rationale: 히브리어의 동반 표현을 한국어의 이동 동사 '데리고'로 자연스럽게 풀어, 함께 오는 인물들을 분명히 했습니다.
- source_word: הַמִּדְבָּר
  english_pob_choice: the wilderness
  chosen_korean: 광야
  alternatives_korean:
  - 사막
  - 들판
  lexicon: HALOT
  rationale: 출애굽기 문맥에서 '광야'가 표준적이면서도 source-direct한 대응입니다.
- source_word: הַר הָאֱלֹהִים
  english_pob_choice: the mountain of God
  chosen_korean: 하나님의 산
  alternatives_korean:
  - 하나님 산
  - 신의 산
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 그대로 살려 '하나님의 산'으로 옮겼습니다. 본문 자체가 쓰는 별칭을 유지해 시내/호렙을 임의로 넣지 않았습니다.
theological_decisions:
- issue: ‘하나님의 산’ 명칭 유지
  chosen_reading: 본문의 별칭인 '하나님의 산'을 그대로 유지하고, 시내나 호렙으로 치환하지 않았습니다.
  alternative_readings:
  - 시내산
  - 호렙산
  rationale: 히브리어 본문은 여기서 지명별칭을 직접 제시합니다. 한국어도 그 표현을 보존하는 것이 본문의 어휘적 긴장을 가장 잘 드러냅니다.
  doctrine_reference: source fidelity / nomenclature
- issue: 소유대명사 '그의'의 지시 대상
  chosen_reading: '''자기 아들들''과 ''자기 아내''는 문맥상 모세를 가리키는 것으로 처리했습니다.'
  alternative_readings:
  - 이드로의 아들들과 이드로의 아내
  rationale: 앞선 문맥에서 언급된 모세의 가족을 다시 회상하는 흐름이 자연스럽습니다. 한국어는 '자기'를 반복해 지시 대상을 명확히 하면서도 본문을 과장하지 않습니다.
  doctrine_reference: contextual coherence
