  text: 이제야 제가 야훼께서 모든 신들보다 크시다는 것을 압니다. 이는 그들이 교만하게 행한 바로 그 일에서, 야훼께서 그들 위에 계셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
