    text: 또는, ‘그들이 교만하게 그들 위에 행한 바로 그 일에서.’ 마지막 절의 히브리어는 어렵고, 특히 이집트 사람들이 이스라엘을 교만하게 대했던 일을 가리킬 수 있습니다.
    reason: alternative_reading
