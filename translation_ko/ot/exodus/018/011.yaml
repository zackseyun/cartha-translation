translation:
  language: ko
  text: 이제 저는 야훼께서 모든 신들보다 크시다는 것을 압니다. 그들이 그들에게 오만하게 행했던 그 일에서 야훼께서 그들보다 높으셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들이 그들에게 오만하게 행했던 그 일에서.’ 마지막 절의 히브리어는 난해합니다. 이 말은 특히 이집트 사람들이 이스라엘을 오만하게 대했던 일을 가리킬 수 있습니다.
    reason: alternative_reading
