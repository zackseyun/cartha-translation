  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
  footnotes:
  - marker: a
    text: 'Or, ''You will surely become exhausted.'' The Hebrew idiom literally repeats the verb for emphasis: ''wearing out, you will wear out.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 당신과 당신과 함께 있는 이 백성도 반드시 지쳐 버릴 것입니다. 이 일이 당신에게 너무 무거워서 당신은 혼자서는 그것을 할 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '지쳐 지칠 것입니다'처럼 반복으로 강조하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  english_pob_choice: You will surely wear yourself out
  chosen_korean: 반드시 지쳐 버릴 것입니다
  alternatives_korean:
  - 반드시 탈진할 것입니다
  - 반드시 소진될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 반복형은 확실성과 강한 강조를 나타내므로, 한국어에서는 자연스러운 강조 부사와 결과 표현으로 압박과 피로의 강도를 살렸습니다.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  english_pob_choice: both you and this people
  chosen_korean: 당신과 당신과 함께 있는 이 백성도
  alternatives_korean:
  - 당신도, 이 백성도
  - 당신과 이 백성도
  lexicon: HALOT
  rationale: 반복된 גַּם을 양쪽 모두에 미치는 포함 의미로 살리되, '이 백성'과 뒤의 관계절을 함께 묶어 자연스럽게 옮겼습니다.
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  english_pob_choice: the matter is too heavy for you
  chosen_korean: 이 일이 당신에게 너무 무거워서
  alternatives_korean:
  - 그 일이 당신에게 너무 무거워서
  - 그 일은 당신에게 지나치게 무거워서
  lexicon: HALOT
  rationale: כָבֵד의 문자적 '무겁다'를 유지하면서, דָּבָר를 문맥상 행정적 부담을 가리키는 '일'로 옮겼습니다.
- source_word: לֹא תוּכַ֥ל עֲשֹׂ֖הוּ לְבַדֶּךָ
  english_pob_choice: You are not able to do it by yourself
  chosen_korean: 당신은 혼자서는 그것을 할 수 없습니다
  alternatives_korean:
  - 당신은 혼자 그것을 해낼 수 없습니다
  - 당신은 홀로 그것을 감당할 수 없습니다
  lexicon: HALOT
  rationale: '''할 수 없습니다''는 불능을 직접 전하고, ''혼자서는''이 לְבַדֶּךָ의 무보조 상태를 자연스럽게 드러냅니다.'
theological_decisions:
- issue: 모세에 대한 경고의 강도와 직설성
  chosen_reading: 직설적 경고문체를 유지해, 과로로 인한 '지쳐 버릴 것입니다'와 '할 수 없습니다'를 분명히 표현했습니다.
  alternative_readings:
  - 완곡하게 '힘들어질 것입니다'로 완화
  - 설명적으로 '감당하지 못할 것입니다'로 바꿈
  rationale: 본문은 장래의 불가피한 소진과 한계를 경고하므로, 한국어에서도 경고의 직접성을 유지하는 것이 문맥에 충실합니다.
  doctrine_reference: 출애굽기 18장의 행정적 지혜 권고
- issue: '''이 백성''의 집합성'
  chosen_reading: '''백성''을 단수 집합명사로 유지하되, 한국어 어법상 자연스럽게 관계절을 붙여 공동체 전체를 가리키게 했습니다.'
  alternative_readings:
  - '''이 백성들''로 복수화'
  - '''이 사람들''로 일반화'
  rationale: 히브리어 עָם의 집합성을 보존하면서도, 한국어에서는 복수화보다 단수 집합 표현이 더 정확하고 자연스럽습니다.
  doctrine_reference: 히브리어 집합명사 처리 원칙
