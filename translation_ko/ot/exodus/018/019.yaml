  text: עַתָּ֞ה שְׁמַ֤ע בְּ/קֹלִ/י֙ אִיעָ֣צְ/ךָ֔ וִ/יהִ֥י אֱלֹהִ֖ים עִמָּ֑/ךְ הֱיֵ֧ה אַתָּ֣ה לָ/עָ֗ם מ֚וּל הָֽ/אֱלֹהִ֔ים וְ/הֵבֵאתָ֥ אַתָּ֛ה אֶת הַ/דְּבָרִ֖ים אֶל הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
  footnotes:
  - marker: a
    text: Or 'may God be with you.' The Hebrew form expresses a wish or blessing.
    reason: lexical_alternative
  - marker: b
    text: Or 'You shall represent the people before God.'
    reason: alternative_reading
  - marker: c
    text: '''The matters'' here refers to the people''s cases or disputes brought for decision.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 내 목소리를 들으십시오. 제가 당신에게 조언하겠습니다. 하나님이 당신과 함께 계시기를 바랍니다. 당신은 하나님 앞에서 백성을 위한 사람이 되어야 하며, 당신은 그 일들을 하나님께 가져가야 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님이 당신과 함께 계시기를 바랍니다.’ 히브리어 형태는 소망 또는 축복을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신은 백성을 하나님 앞에서 대표해야 합니다.’
    reason: alternative_reading
  - marker: c
    text: ‘그 일들’은 여기서 판결을 위해 가져오는 백성의 소송이나 분쟁을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע בְּקֹלִי
  english_pob_choice: listen to my voice
  chosen_korean: 내 목소리를 들으십시오
  alternatives_korean:
  - 내 말을 들으십시오
  - 내 목소리에 귀를 기울이십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘듣다/목소리’ 구조를 살리되, 한국어에서는 자연스럽고 정중한 명령형으로 옮겼습니다.
- source_word: אִיעָצְךָ
  english_pob_choice: I will advise you
  chosen_korean: 제가 당신에게 조언하겠습니다
  alternatives_korean:
  - 제가 당신에게 권고하겠습니다
  - 제가 당신을 सलाह하겠습니다
  lexicon: HALOT
  rationale: יעץ의 기본 의미인 ‘조언하다/권고하다’를 현대 한국어에서 가장 분명하게 표현했습니다.
- source_word: מוּל הָאֱלֹהִים
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님 앞에
  - 하나님 면전에서
  lexicon: HALOT
  rationale: מוּל의 ‘앞에서/면전에서’ 의미를 살리면서도 한국어에서 가장 자연스러운 표현으로 정리했습니다.
- source_word: הַדְּבָרִים
  english_pob_choice: the matters
  chosen_korean: 그 일들
  alternatives_korean:
  - 그 사안들
  - 그 사건들
  - 그 문제들
  lexicon: HALOT
  rationale: 재판 맥락에서 ‘말’이 아니라 분쟁·사건·사안들을 가리키므로, 너무 기술적이지 않으면서도 맥락을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: וִיהִי אֱלֹהִים עִמָּךְ의 청원적 뉘앙스
  chosen_reading: 하나님이 당신과 함께 계시기를 바랍니다
  alternative_readings:
  - 하나님이 당신과 함께 계십시오
  - 하나님이 당신과 함께 계시길 바랍니다
  rationale: 히브리어의 축복/소망형 뉘앙스를 살리기 위해 단순 서술보다 바람의 표현으로 옮겼습니다.
  doctrine_reference: Translation philosophy §3, blessing/jussive usage
- issue: הֱיֵה אַתָּה לָעָם의 대표 역할
  chosen_reading: 당신은 하나님 앞에서 백성을 위한 사람이 되어야 하며
  alternative_readings:
  - 당신은 백성을 하나님 앞에서 대표해야 하며
  - 당신은 백성을 하나님 앞에 세우는 사람이 되어야 하며
  rationale: 모세의 중재자적 역할은 드러내되, 본문 구조를 지나치게 법률 용어로 풀지 않고 ‘백성을 위한 사람’으로 원문에 가까운 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §5, mediatorial function
