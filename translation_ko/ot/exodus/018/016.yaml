source:
  edition: WLC
  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
  footnotes:
  - marker: a
    text: Or 'they have a case' for 'they have a matter.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'between a man and his neighbor,' a representative singular expression.
    reason: cultural_note
  - marker: c
    text: Or 'his instructions' for 'his laws.' The Hebrew term can denote instruction more broadly, though here it is used in a legal setting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 일이[a] 생기면, 그 일이 내게로 옵니다. 나는 한 사람과 그의 이웃 사이의 일[b]을 판결하고, 하나님의 규례들과 그분의 법들[c]을 알게 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘일’, ‘사건’, ‘문제’, 또는 ‘사안’을 뜻할 수 있는 폭넓은 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘한 사람과 그의 이웃’이라는 대표적 단수 표현을 사용합니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 תּוֹרָה는 ‘가르침’ 또는 ‘지시’도 뜻할 수 있습니다. 여기서는 재판과 규범의 문맥상 ‘법들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה לָהֶם דָּבָר
  english_pob_choice: When they have a matter
  chosen_korean: 그들에게 일이 생기면
  alternatives_korean:
  - 그들에게 사건이 있으면
  - 그들에게 쟁점이 생기면
  lexicon: HALOT
  rationale: דָּבָר는 법정 문맥에서 ‘사건/문제/일’의 폭넓은 뜻을 가지므로, 한국어에서는 자연스럽고 포괄적인 ‘일’로 옮겨 상황의 발생을 살렸습니다.
- source_word: בָּא אֵלַי
  english_pob_choice: it comes to me
  chosen_korean: 내게로 옵니다
  alternatives_korean:
  - 내게로 옵니다(그 일이)
  - 그 일이 내게 옵니다
  lexicon: HALOT
  rationale: 히브리어는 형식상 단수이지만 문맥상 분쟁 당사자들이 모세에게 오는 상황이므로, 한국어에서는 의미가 분명하도록 ‘내게로 옵니다’로 자연스럽게 옮겼습니다.
- source_word: וְשָׁפַטְתִּי בֵּין אִישׁ וּבֵין רֵעֵהוּ
  english_pob_choice: I judge between a man and his neighbor
  chosen_korean: 나는 한 사람과 그의 이웃 사이를 판결하고
  alternatives_korean:
  - 나는 한 남자와 그의 이웃 사이를 판결하고
  - 나는 사람과 그의 이웃 사이를 판결하고
  lexicon: HALOT
  rationale: 대표적 단수 표현을 살리되, 한국어에서는 성별을 과도하게 전면화하지 않으면서도 원문의 단수성을 유지하기 위해 ‘한 사람’으로 옮겼습니다. ‘판결하다’는 משפט의 재판 행위를 잘 드러냅니다.
- source_word: וְהוֹדַעְתִּי אֶת חֻקֵּי הָאֱלֹהִים וְאֶת תּוֹרֹתָיו
  english_pob_choice: I make known the statutes of God and his laws
  chosen_korean: 하나님의 규례들과 그의 법들을 알게 합니다
  alternatives_korean:
  - 하나님의 규례들과 그의 가르침들을 알게 합니다
  - 하나님의 규례들과 그의 지침들을 알게 합니다
  lexicon: HALOT
  rationale: חֻקִּים는 ‘규례들’이 적절하고, תּוֹרָה는 여기서 법정·공적 지시의 힘을 가지므로 ‘법들’로 옮겨 병렬 구조를 유지했습니다.
theological_decisions:
- issue: 대표적 남성 단수 표현 אִישׁ ... רֵעֵהוּ의 처리
  chosen_reading: ‘한 사람과 그의 이웃’으로 옮겨 원문의 대표적 단수 형식을 유지했습니다.
  alternative_readings:
  - ‘한 남자와 그의 이웃’
  - ‘한 사람과 다른 사람’
  rationale: 원문은 남성 단수 형태로 일반적 법률 진술을 구성하므로, 이를 무성별화하지 않으면서도 한국어에서 과도하게 성별을 고정하지 않는 방식이 가장 균형적입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: תּוֹרֹתָיו의 의미 범위
  chosen_reading: ‘그의 법들’로 옮겨 법정 맥락의 규범적 힘을 드러냈습니다.
  alternative_readings:
  - ‘그의 지침들’
  - ‘그의 가르침들’
  rationale: תּוֹרָה는 본래 ‘가르침/지시’의 넓은 뜻이 있지만, 본문은 재판과 규범 전달의 맥락이므로 ‘법들’이 가장 직접적으로 기능합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
