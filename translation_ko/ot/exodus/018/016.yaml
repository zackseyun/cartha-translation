    rationale: 한국어에서는 사람들 ‘사이’를 직접 판결하기보다 그들 사이의 일·분쟁을 판결한다고 표현합니다. 이는 원문의 사법적 의미를 변경하지 않고 자연스럽게 드러냅니다.
