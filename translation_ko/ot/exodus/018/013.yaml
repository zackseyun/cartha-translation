source:
  edition: WLC
  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֵּ֥שֶׁב מֹשֶׁ֖ה לִ/שְׁפֹּ֣ט אֶת הָ/עָ֑ם וַ/יַּעֲמֹ֤ד הָ/עָם֙ עַל מֹשֶׁ֔ה מִן הַ/בֹּ֖קֶר עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/013.yaml
  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
  footnotes:
  - marker: a
    text: Or 'stood around Moses.' The Hebrew preposition can be understood more literally, but the sense in context is that the people were waiting before him for judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 다음 날이 되자, 모세는 백성을 재판하려고 앉았습니다. 백성은 아침부터 저녁까지 모세 앞에 서 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘모세 곁에’ 또는 ‘모세 주위에’로도 옮길 수 있습니다. 문맥상 백성이 판결을 기다리며 모세 앞에 서 있었다는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 다음 날이 되었습니다
  alternatives_korean:
  - 그리고 그런 일이 있었습니다
  - 그러고 나서 다음 날이 되었습니다
  lexicon: HALOT
  rationale: 히브리어 서사 전환 공식은 한국어에서 단순한 연결과 시간 진행으로 자연스럽게 살리되, 구어체로 흐르지 않도록 했습니다.
- source_word: וַיֵּשֶׁב מֹשֶׁה
  english_pob_choice: Moses sat
  chosen_korean: 모세가 … 앉아 있었고
  alternatives_korean:
  - 모세가 앉았고
  - 모세가 자리를 잡고
  lexicon: HALOT
  rationale: שָׁב/יֵשֶׁב의 구체적 ‘앉다’ 이미지를 유지하면서, 재판 장면의 지속 상태를 드러내기 위해 ‘앉아 있었고’로 옮겼습니다.
- source_word: לִשְׁפֹּט אֶת הָעָם
  english_pob_choice: to judge the people
  chosen_korean: 백성을 재판하려고
  alternatives_korean:
  - 백성을 심판하려고
  - 백성의 송사를 판결하려고
  lexicon: HALOT
  rationale: 여기서 שׁפט는 일반적 ‘심판’보다 분쟁을 판결하는 사법 행위를 가리키므로, 한국어에서는 오해를 줄이는 ‘재판하다’ 계열로 옮겼습니다.
- source_word: עַל מֹשֶׁה
  english_pob_choice: before Moses
  chosen_korean: 모세 앞에
  alternatives_korean:
  - 모세 주위에
  - 모세 곁에
  lexicon: HALOT
  rationale: עַל은 문자적으로는 ‘위에’이지만, 여기서는 판결을 기다리며 그의 앞에 서 있는 상황을 가리키므로 문맥상 자연스러운 ‘앞에’로 번역했습니다.
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  english_pob_choice: from morning until evening
  chosen_korean: 아침부터 저녁까지
  alternatives_korean:
  - 새벽부터 저녁까지
  - 아침에서 저녁까지
  lexicon: HALOT
  rationale: 하루 전체의 지속 시간을 한국어 관용 표현으로 간결하게 살렸습니다.
theological_decisions:
- issue: 모세의 역할을 어떻게 표현할지
  chosen_reading: 모세가 백성을 재판하려고 앉아 있었습니다
  alternative_readings:
  - 모세가 백성을 다스리려고 앉아 있었습니다
  - 모세가 백성을 심판하려고 앉아 있었습니다
  rationale: 본문의 초점은 통치 일반이 아니라 분쟁 판결에 있으므로, 사법적 기능을 분명히 드러냈습니다.
  doctrine_reference: 출 18장 문맥
