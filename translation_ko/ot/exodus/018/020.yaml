id: EXO.18.20
reference: Exodus 18:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִזְהַרְתָּ֣ה אֶתְ/הֶ֔ם אֶת הַ/חֻקִּ֖ים וְ/אֶת הַ/תּוֹרֹ֑ת וְ/הוֹדַעְתָּ֣ לָ/הֶ֗ם אֶת הַ/דֶּ֨רֶךְ֙ יֵ֣לְכוּ בָ֔/הּ וְ/אֶת הַֽ/מַּעֲשֶׂ֖ה אֲשֶׁ֥ר יַעֲשֽׂוּ/ן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
  footnotes:
  - marker: a
    text: Or 'the instructions' for 'the laws' (Hebrew torot). The term can denote teaching more broadly, but here the legal setting favors 'laws.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'the way they shall walk in it.' 'Walk' is retained to preserve the Hebrew metaphor for conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은 그들에게 규례들과 법들[a]에 관하여 경고하고, 그들이 걸어가야 할 길[b]과 그들이 해야 할 일을 알려 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘법들’은 히브리어 토라(תּוֹרוֹת)를 옮긴 말입니다. 이 말은 ‘지침들’이나 ‘가르침들’을 뜻할 수도 있으나, 여기서는 법적 문맥상 ‘법들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들이 그 안에서 걸어갈 길’입니다. ‘걷다’라는 동사를 살려 히브리어의 행위 은유를 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  english_pob_choice: you shall warn
  chosen_korean: 경고하며
  alternatives_korean:
  - 경고하고
  - 일러 주며
  - 훈계하며
  lexicon: HALOT
  rationale: זהר의 히필은 단순한 가르침보다 경고·주의 환기를 뜻할 수 있으므로, 행정적·법적 문맥에 맞게 ‘경고하다’를 살렸습니다.
- source_word: הַחֻקִּים
  english_pob_choice: the statutes
  chosen_korean: 규례들
  alternatives_korean:
  - 법도들
  - 율례들
  - 규정들
  lexicon: HALOT
  rationale: חֻקִּים은 고정된 규정이나 정해진 제도를 가리키므로, 한국어 성경에서 자연스럽고 법적 뉘앙스를 지키는 ‘규례들’을 택했습니다.
- source_word: הַתּוֹרֹת
  english_pob_choice: the laws
  chosen_korean: 법들
  alternatives_korean:
  - 지침들
  - 가르침들
  - 율법들
  lexicon: HALOT
  rationale: 토라의 복수형이지만 כאן은 규례들과 병렬된 법적 진술이므로, POB의 ‘laws’를 따라 중복을 피하면서도 법적 힘을 드러내는 ‘법들’로 옮겼습니다.
- source_word: יֵלְכוּ בָהּ
  english_pob_choice: in which they must walk
  chosen_korean: 그들이 걸어가야 할 길
  alternatives_korean:
  - 그들이 그 안에서 걸어야 할 길
  - 그들이 따라가야 할 길
  - 그들이 행해야 할 길
  lexicon: HALOT
  rationale: הלך + ב의 관용적 ‘걷다/행하다’ 이미지를 유지하기 위해 ‘걸어가다’를 살렸고, 요구·의무의 의미는 ‘-아/어야 할’로 표현했습니다.
theological_decisions:
- issue: ‘토라’ 복수형의 번역을 어떻게 처리할지
  chosen_reading: 규례들과 법들로 구분하여, 하나는 제도적 규정, մյուս는 법적 가르침의 묶음으로 읽히게 했습니다.
  alternative_readings:
  - 규례들과 지침들
  - 규례들과 가르침들
  - 규례들과 율법들
  rationale: 문맥이 재판·행정 지시이므로 ‘토라’를 일반적 교훈보다 법적·실무적 지시로 이해하는 편이 본문 의도에 더 가깝습니다.
  doctrine_reference: 출 18:20의 재판 보조 체계와 언약 공동체의 공적 질서
- issue: ‘길’과 ‘걸어가다’의 은유를 유지할지
  chosen_reading: 은유를 유지하여 삶의 방식이 아니라 실제로 따라야 할 행로처럼 들리게 했습니다.
  alternative_readings:
  - 그들이 따라야 할 방식
  - 그들이 살아가야 할 방식
  - 그들이 행해야 할 길
  rationale: 히브리어의 ‘길을 걷다’는 도덕적·언약적 행위를 가리키는 핵심 은유이므로, 평면적 의미로 풀어버리지 않는 것이 좋습니다.
  doctrine_reference: 성경의 ‘행함/걸음’ 은유
