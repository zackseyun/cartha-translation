  lexicon: HALOT
  rationale: 독립대명사 אֲנִי의 강조를 살려 ‘나’를 앞에 두고, 이름과 호칭의 병치를 한국어 어순에 맞게 옮겼습니다.
- source_word: בָּא אֵלֶיךָ
  english_pob_choice: am coming to you
  chosen_korean: 네게로 가고 있습니다
  alternatives_korean:
  - 네게로 오고 있습니다
  - 네게로 가고 있어요
  lexicon: HALOT
  rationale: 진행 중인 접근을 현재 진행으로 살리되, 목적지 방향을 분명히 하기 위해 ‘-로 가다’ 표현을 택했습니다.
- source_word: וְאִשְׁתְּךָ וּשְׁנֵי בָנֶיהָ עִמָּהּ
  english_pob_choice: with your wife and her two sons with her
  chosen_korean: 네 아내와 그녀의 두 아들도 그와 함께 있습니다
  alternatives_korean:
  - 네 아내와 그녀의 두 아들도 함께 있습니다
  - 네 아내와 그녀의 두 아들도 그와 동행합니다
  lexicon: HALOT
  rationale: MT의 ‘그녀의 두 아들’이라는 여성 단수 접미사를 그대로 반영해, 영어 POB가 지적한 문법적 긴장을 지웠습니다.
theological_decisions:
- issue: 히브리어 본문의 성별 접미사 보존
  chosen_reading: ‘그녀의 두 아들’로 번역해 마소라 본문의 독법을 유지했습니다.
  alternative_readings:
  - ‘네 두 아들’로 조화시키는 번역
  rationale: 본문은 모세의 아내를 가리키는 여성 단수 접미사를 사용하므로, 이를 평준화하면 본문이 지닌 문법적 특이점을 잃습니다.
  doctrine_reference: 본문 비평/문법 관찰
