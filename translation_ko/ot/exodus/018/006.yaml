  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''her two sons.'' Some English translations smooth this to ''your two sons,'' but the Masoretic Text reads with a third feminine singular suffix, referring to Moses'' wife.'
