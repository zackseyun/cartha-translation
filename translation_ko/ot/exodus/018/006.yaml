translation:
  language: ko
  text: 그가 모세에게 말했습니다. “나, 네 장인 이드로가 네게로 오고 있습니다. 네 아내와 그녀의 두 아들[a]도 그녀와 함께 오고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘네 두 아들’이 아니라 ‘그녀의 두 아들’이라고 되어 있습니다. 일부 번역은 이를 매끄럽게 조정하지만, 마소라 본문은 모세의 아내를 가리키는 여성 단수 접미사를 사용합니다.
    reason: lexical_alternative
