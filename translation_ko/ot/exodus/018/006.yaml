translation:
  language: ko
  text: 그가 모세에게 말했습니다. “나, 네 장인 이드로가 네게로 가고 있습니다. 네 아내와 그녀의 두 아들도 그와 함께 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘네 두 아들’이 아니라 ‘그녀의 두 아들’이라고 되어 있습니다. 일부 번역은 이를 매끄럽게 조정하지만, 마소라 본문은 모세의 아내를 가리키는 여성 단수 접미사를 사용합니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל מֹשֶׁה
  english_pob_choice: He said to Moses
  chosen_korean: 그가 모세에게 말했습니다
  alternatives_korean:
  - 그리고 그가 모세에게 말했습니다
  - 그가 모세를 향해 말했습니다
  lexicon: HALOT
  rationale: 서술 전개를 자연스럽게 옮기면서 אֶל의 방향성을 ‘에게’로 반영했습니다.
- source_word: אֲנִי חֹתֶנְךָ יִתְרוֹ
  english_pob_choice: I, Jethro your father-in-law
  chosen_korean: 나, 네 장인 이드로
