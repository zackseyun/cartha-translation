  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כָּל הַ/טּוֹבָ֔ה אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה לְ/יִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖/וֹ מִ/יַּ֥ד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
  footnotes:
  - marker: a
    text: Or 'was glad over all the good.' The Hebrew verb can denote gladness or rejoicing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the hand of Egypt,' an idiom for deliverance from Egypt's power.
    reason: lexical_alternative
translation:
  language: ko
  text: 이드로가 야훼께서 이스라엘을 위해 행하신 모든 선한 일과, 곧 그분이 그들을 이집트의 손에서 구해 내신 일로 말미암아 크게 기뻐했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘기뻐하다’ 또는 ‘즐거워하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손’은 이집트의 권세와 지배를 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  english_pob_choice: rejoiced
  chosen_korean: 크게 기뻐했습니다
  alternatives_korean:
  - 기뻐했습니다
  - 즐거워했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 감정 상태보다 기쁨의 발현을 나타내므로, 현대 한국어에서 자연스럽고 강한 반응을 드러내는 ‘크게 기뻐했습니다’가 적절합니다.
- source_word: עַל כָּל הַטּוֹבָה
  english_pob_choice: over all the good
  chosen_korean: 행하신 모든 선한 일
  alternatives_korean:
  - 행하신 모든 좋은 일
  - 모든 선함
  lexicon: HALOT
  rationale: ‘좋음/선함’의 추상적 명사보다, 문맥상 야훼께서 이스라엘을 위해 실제로 하신 은혜로운 행위를 드러내는 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: project default
  rationale: 본문의 신적 이름은 관례적 대치어 ‘주’가 아니라 본 프로젝트 기본값인 ‘야훼’로 옮겨, 고유한 언약적 이름을 보존했습니다.
- source_word: מִיַּד מִצְרָיִם
  english_pob_choice: from the hand of Egypt
  chosen_korean: 이집트의 손에서
  alternatives_korean:
  - 이집트의 권세에서
  - 이집트의 힘에서
  lexicon: HALOT
  rationale: ‘손’은 압제적 통제의 히브리어 관용구이므로, 이를 직역하되 한국어에서 자연스럽게 읽히도록 유지했습니다.
theological_decisions:
- issue: 야훼의 이름을 제목어로 대치하지 않는 문제
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주
  - 주님
  rationale: 출애굽기 문맥에서 하나님의 구원 행위를 개인적 고유명으로 드러내는 것이 स्रोत의 힘을 더 잘 보존하므로, 통상적 치환어를 쓰지 않았습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: יְהוָה YHWH'
- issue: ‘이스라엘을 위해’의 수혜 의미
  chosen_reading: ‘이스라엘을 위해’로 옮겨 야훼의 행위가 이스라엘을 위한 유익임을 분명히 했습니다.
  alternative_readings:
  - 이스라엘에게
  - 이스라엘에 대해
  rationale: לְ의 수혜/이익 의미를 한국어에서 가장 자연스럽게 전달하는 방식입니다.
  doctrine_reference: HALOT לְ benefit/advantage
