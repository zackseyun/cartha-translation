    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לָהֶם
  english_pob_choice: Remember them
  chosen_korean: 그들을 기억하소서
  alternatives_korean:
  - 그들에 대하여 기억하소서
  - 그들을 기억해 주십시오
  lexicon: HALOT
  rationale: 다윗·느헤미야의 탄원문에서 하나님께 드리는 직접 청원형을 살리기 위해 명령형 겸 간청형으로 옮겼습니다. לָהֶם의 방향성은 본문 뒤의 이유절이 보여 주므로, 본문에서는 과도하게 ‘대하여/against’로 풀지 않았습니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 내 하나님이여
  alternatives_korean:
  - 나의 하나님이여
  - 하나님이여
  lexicon: HALOT
  rationale: 1인칭 소유 접미사가 있는 직접 호칭이므로 1인칭 호격으로 자연스럽게 옮겼습니다. 기도문 체감상 ‘내 하나님이여’가 원문의 친밀한 호소를 잘 드러냅니다.
- source_word: גָּאֳלֵי הַכְּהֻנָּה
  english_pob_choice: they have defiled the priesthood
  chosen_korean: 제사장직을 더럽혔기 때문입니다
  alternatives_korean:
  - 제사장직을 더럽힌 자들이기 때문입니다
  - 제사장직을 더럽혔기 때문에
  lexicon: HALOT
  rationale: 히브리어 분사형이지만 문맥상 행위를 서술하는 절로 번역하는 것이 한국어에서 가장 분명합니다. ‘제사장들’이 아니라 제도/직분인 ‘제사장직’으로 옮겨 원문의 추상명사를 살렸습니다.
- source_word: וּבְרִית הַכְּהֻנָּה וְהַלְוִיִּם
  english_pob_choice: and the covenant of the priesthood and the Levites
  chosen_korean: 제사장직의 언약과 레위 사람들을
  alternatives_korean:
  - 제사장직의 언약과 레위 사람들의 언약을
  - 제사장직과 레위 사람들의 언약을
  lexicon: HALOT
  rationale: 히브리어의 압축된 병렬 구조를 한국어에서도 너무 풀지 않고 유지했습니다. ‘레위 사람들’은 인명 집단을 가리키는 관용적 표기로, POB의 병렬감을 살리되 문맥상 필요한 범위에서만 보완했습니다.
theological_decisions:
- issue: 이 절의 ‘기억하소서’가 호의적 기억인지 심판적 기억인지
  chosen_reading: 제사장직을 더럽힌 자들에 대한 심판적 기억을 구하는 탄원
  alternative_readings:
  - 중립적 의미의 단순한 ‘기억하소서’
  - 그들 편에 서서 돌보아 달라는 호의적 기억
  rationale: 뒤따르는 이유절이 그들의 더러움과 언약 훼손을 고발하므로, כאן의 ‘기억’은 호의적 관심이 아니라 심판적 주목을 요청하는 것으로 이해하는 것이 문맥에 맞습니다. 그래서 본문은 동사를 그대로 두되 ‘때문입니다’로 이유를 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘제사장직의 언약과 레위 사람들’의 결합 범위
  chosen_reading: 제사장직과 레위 사람들을 함께 포괄하는 언약 구조
  alternative_readings:
  - 제사장직의 언약과 별도로 레위 사람들
  - 제사장들과 레위 사람들과의 언약
  rationale: 히브리어는 압축되어 있어 관계를 과도하게 특정하지 않는 것이 안전합니다. 한국어 본문도 원문의 연결 구조를 보존하면서, 문맥이 허용하는 범위 안에서만 의미를 드러냈습니다.
  doctrine_reference: Translation philosophy §3, §5
