  source_fidelity: 수정이 필요합니다. 초안의 ‘제사장직의 언약과 레위 사람들을 더럽혔기’는 ‘레위 사람들’을 동사 ‘더럽혔다’의 별도 목적어로 읽히게 합니다. 히브리어의 וְהַלְוִיִּם은 언약과 관련된 병렬 속격 요소로 이해하는 것이 가장 자연스럽습니다. 또한 עַל과 분사구의 압축된 연결은 한국어에서 관계절로 옮기면 인과관계를 과도하게 확정하지 않고 보존할 수 있습니다.
