base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
  footnotes:
  - marker: a
    text: Or, 'and they did not know how to speak Judean, but spoke according to the language of each people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 자녀의 절반은 아스돗 말로 말하였고, 유다 말로 말할 줄 몰랐으며, 각 민족의 언어로 말하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들은 유다 말을 할 줄 몰랐고, 각 민족의 언어에 따라 말하였습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  english_pob_choice: their children
  chosen_korean: 그들의 자녀
  alternatives_korean:
  - 그들의 아들들
  - 그들의 아이들
  lexicon: HALOT
  rationale: בנים은 문자상 ‘아들들’일 수 있지만, 혼인으로 섞인 가정의 후손 전체를 가리키므로 한국어에서는 성별을 제한하지 않는 ‘자녀’가 적절합니다.
- source_word: חֲצִי
  english_pob_choice: half
  chosen_korean: 절반
  alternatives_korean:
  - 반
  - 그 절반
  lexicon: HALOT
  rationale: 자녀들 가운데 일부만을 지시하는 수량 표현이므로, 자연스러운 현대 한국어인 ‘절반’으로 옮겼습니다.
- source_word: אַשְׁדּוֹדִית
  english_pob_choice: Ashdodite
  chosen_korean: 아스돗 말
  alternatives_korean:
  - 아스돗 방언
  - 아스돗어
  lexicon: HALOT
  rationale: 이 표현은 아스돗과 관련된 언어를 뜻하므로, 민족·지명 형용사보다 한국어에서 더 직접적인 ‘말’로 풀어 옮겼습니다.
- source_word: וְאֵינָם מַכִּירִים לְדַבֵּר
  english_pob_choice: and they were not able to speak
  chosen_korean: 유다 말로 말할 줄 몰랐으며
  alternatives_korean:
  - 유다 말로 말할 수 없었으며
  - 유다 말로 말하는 법을 알지 못하였으며
  lexicon: HALOT
  rationale: הכיר + 부정사 구문은 단순 인지 부족보다 실제로 말할 수 있는 능력/숙련의 부재를 나타내므로, 한국어에서는 ‘말할 줄 몰랐다’가 가장 자연스럽고 의미도 가깝습니다.
- source_word: יְהוּדִית
  english_pob_choice: Judean
  chosen_korean: 유다 말
  alternatives_korean:
  - 유다어
  - 유대 말
  - 히브리어
  lexicon: HALOT
  rationale: 원문은 ‘유다 사람들의 언어’를 가리키며, 본문 자체는 히브리어라고 말하지 않으므로 ‘유다 말’이 가장 직접적입니다.
theological_decisions:
- issue: 민족 언어 대비의 의미를 과도하게 해석하지 않기
  chosen_reading: 본문의 초점은 혼혈 가정 자녀들이 주변 민족들의 언어는 말하지만 유다 말은 말하지 못한다는 사회·언어적 현실입니다.
  alternative_readings:
  - 종교적 배교의 직접 진술로 좁혀 읽기
  - 단순한 언어 교육 실패로만 읽기
  rationale: 문맥상 예루살렘 공동체의 언어 동화와 정체성 약화가 드러나지만, 본 절 자체는 그 원인을 단정하지 않으므로 서술 범위를 넘지 않도록 유지했습니다.
  doctrine_reference: 본문 주해 원칙
