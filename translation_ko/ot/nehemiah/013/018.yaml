revisions:
- from: 그런데도 너희 조상들이 그렇게 하지 않았습니까? 우리 하나님께서 이 모든 재앙을 우리에게와 이 성에 내리셨습니다. 그런데도 너희는 안식일을 더럽혀 이스라엘에 분노를 더하고 있습니다.[a]
  to: 너희 조상들도 그렇게 하지 않았습니까? 우리 하나님께서 이 모든 재앙을 우리와 이 성 위에 내리셨습니다. 그런데도 너희는 안식일을 더럽혀 이스라엘에 진노를 더하고 있습니다.[a]
  rationale: 원문 첫 절의 단순 반문에서는 부가된 역접을 제거하고, 뒤 절의 וְאַתֶּם이 이끄는 실제 대조는 ‘그런데도’로 유지했습니다. 비문적인 조사 결합을 고쳐 두 대상에 임한 재앙이라는 원문의 병렬을 보존했습니다. 또한 חָרוֹן을 ‘진노’로 통일하고, 각주를 실제 번역 대안을 제시하는 형태로 수정했습니다.
