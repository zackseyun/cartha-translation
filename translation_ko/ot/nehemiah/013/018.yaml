reference: Nehemiah 13:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֨וֹא כֹ֤ה עָשׂוּ֙ אֲבֹ֣תֵי/כֶ֔ם וַ/יָּבֵ֨א אֱלֹהֵ֜י/נוּ עָלֵ֗י/נוּ אֵ֚ת כָּל הָ/רָעָ֣ה הַ/זֹּ֔את וְ/עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אַתֶּ֞ם מוֹסִיפִ֤ים חָרוֹן֙ עַל יִשְׂרָאֵ֔ל לְ/חַלֵּ֖ל אֶת הַ/שַּׁבָּֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
  footnotes:
  - marker: a
    text: Or 'all this disaster' or 'all this calamity.' The Hebrew רָעָה can denote calamity in contexts of divine judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 조상들도 그렇게 하지 않았습니까? 우리 하나님께서 이 모든 재앙을 우리와 이 성 위에 내리셨습니다. 그런데도 너희는 안식일을 더럽혀 이스라엘에 진노를 더하고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 재난’. 히브리어 רָעָה는 하나님의 심판 맥락에서 ‘재난’ 또는 ‘재앙’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Did not
  chosen_korean: 그런데도 … 하지 않았습니까?
  alternatives_korean:
  - … 하지 않았습니까?
  - … 아니었습니까?
  lexicon: HALOT
  rationale: 반문이면서도 앞선 역사와의 대비를 드러내므로, 한국어에서는 단순 질문보다 ‘그런데도’가 포함된 반문이 문맥의 압박감을 잘 살립니다.
- source_word: כֹה עָשׂוּ אֲבֹתֵיכֶם
  english_pob_choice: your fathers did this
  chosen_korean: 너희 조상들이 그렇게 하지 않았습니까?
  alternatives_korean:
  - 너희 조상들이 이 일을 하지 않았습니까?
  - 너희 조상들이 그렇게 행하지 않았습니까?
  lexicon: HALOT
  rationale: כֹה+עָשׂוּ는 ‘그렇게 하다’의 관용적 표현이므로, ‘이 일’보다 ‘그렇게’가 원문의 지시성을 더 자연스럽게 전달합니다.
- source_word: וַיָּבֵא אֱלֹהֵינוּ עָלֵינוּ אֵת כָּל הָרָעָה הַזֹּאת וְעַל הָעִיר הַזֹּאת
  english_pob_choice: our God brought all this evil on us and on this city
  chosen_korean: 우리 하나님께서 이 모든 재앙을 우리에게와 이 성에 내리셨습니다
  alternatives_korean:
  - 우리 하나님께서 이 모든 악을 우리에게와 이 성에 내리셨습니다
  - 우리 하나님께서 이 모든 재난을 우리와 이 성 위에 내리셨습니다
  lexicon: HALOT
  rationale: רָעָה는 심판 맥락에서 ‘재앙/재난’까지 뜻할 수 있으므로, 한국어는 도덕적 의미의 ‘악’보다 문맥상 실제로 내려진 징벌의 성격을 드러내는 ‘재앙’을 택했습니다. ‘내리셨습니다’는 חמדה 없이 ‘bring upon’의 타동적 의미를 살립니다.
- source_word: מוֹסִיפִים חָרוֹן עַל יִשְׂרָאֵל
  english_pob_choice: you are adding wrath against Israel
  chosen_korean: 이스라엘에 분노를 더하고 있습니다
  alternatives_korean:
  - 이스라엘에 진노를 더하고 있습니다
  - 이스라엘을 향한 분노를 더하고 있습니다
  lexicon: HALOT
  rationale: חָרוֹן은 하나님의 격한 진노를 가리키는 말이므로 ‘분노/진노’ 중에서도 문맥의 직접성을 살린 ‘분노를 더하다’로 옮겼습니다. 동작이 진행 중임을 나타내기 위해 현재진행형을 사용했습니다.
- source_word: לְחַלֵּל אֶת הַשַּׁבָּת
  english_pob_choice: by profaning the Sabbath
  chosen_korean: 안식일을 더럽혀
  alternatives_korean:
  - 안식일을 욕되게 하여
  - 안식일을 범하여
  lexicon: HALOT
  rationale: חִלֵּל은 성스러운 것을 속되게 만드는 의미가 강하므로, 관습적이지만 약한 ‘범하다’보다 직역성이 있는 ‘더럽히다’를 선택해 모독성과 위반성을 함께 드러냈습니다.
theological_decisions:
- issue: רָעָה를 하나님이 내리신 것으로 말할 때의 어감
  chosen_reading: ‘재앙’
  alternative_readings:
  - 악
  - 재난
  - 불행
  rationale: 본문은 심판으로서의 재앙을 말하므로, 한국어에서 도덕적 악행을 뜻하기 쉬운 ‘악’보다 징벌적 사건을 드러내는 ‘재앙’이 오해를 줄입니다. 동시에 하나님이 주권적으로 내리신 심판이라는 긴장을 유지합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘여러분/너희’와 같은 직설적 책망의 register
  chosen_reading: 너희
  alternative_readings:
  - 여러분
  - 당신들
  rationale: 예언자적 책망의 직접성을 살리기 위해 집단을 향한 직설적 호칭 ‘너희’를 유지했습니다. 이는 본문의 경고성과 대조 구조를 약화시키지 않습니다.
  doctrine_reference: Translation philosophy §1
