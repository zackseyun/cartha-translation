source:
  edition: WLC
  text: גַּ֣ם בַּ/יָּמִ֣ים הָ/הֵ֗ם רָאִ֤יתִי אֶת הַ/יְּהוּדִים֙ הֹשִׁ֗יבוּ נָשִׁים֙ אשדודיות עמוניות מוֹאֲבִיּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
  footnotes:
  - marker: a
    text: Or 'the Judeans.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'had settled women'; the Hebrew idiom here means they had married or taken these women as wives.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 그날들에 내가 유다 사람들 가운데서 아스돗 여자, 암몬 여자, 모압 여자와 결혼한 사람들을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용상 ‘여자들을 거주시키다’는 뜻이지만, 이 문맥에서는 결혼하여 아내로 맞이했다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Also
  chosen_korean: 또
  alternatives_korean:
  - 또한
  - 그리고
  lexicon: HALOT
  rationale: 추가 관찰을 잇는 부사로서 간결하고 자연스럽게 앞 절에 연결합니다.
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: in those days
  chosen_korean: 그날들에
  alternatives_korean:
  - 그 시기에
  - 그 무렵에
  lexicon: HALOT
  rationale: 문맥상 특정 시기를 가리키는 관용 표현으로, 현대 한국어에서 자연스러운 시간 표시로 옮겼습니다.
- source_word: אֶת הַיְּהוּדִים
  english_pob_choice: the Jews
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유다인들
  lexicon: HALOT
  rationale: 에즈라-느헤미야의 역사적·공동체적 대상을 살리면서, 한국어 성경에서 통용되는 '유다 사람들'을 사용해 지리·민족적 뉘앙스를 유지했습니다.
- source_word: הֹשִׁיבוּ נָשִׁים
  english_pob_choice: had married women
  chosen_korean: 결혼한 사람들
  alternatives_korean:
  - 아내를 맞이한 사람들
  - 여자들을 맞아들인 사람들
  lexicon: HALOT
  rationale: 히브리어 관용구의 실제 의미가 '아내로 취하다/결혼하다'이므로, 직접적이면서도 현대 한국어에서 이해되는 표현으로 옮겼습니다.
theological_decisions:
- issue: עמוניות / מוֹאֲבִיּוֹת 같은 민족 형용사의 처리
  chosen_reading: 아스돗 여자, 암몬 여자, 모압 여자
  alternative_readings:
  - 아스돗 사람 여자들, 암몬 사람 여자들, 모압 사람 여자들
  - 아스돗 출신 여자들
  rationale: 민족·지역 출신을 나타내는 형용사를 여성 명사와 결합한 원문 구조를 그대로 드러내어, 본문의 혼인 금지 문제를 흐리지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §6
