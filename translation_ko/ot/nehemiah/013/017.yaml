  source_fidelity: 핵심 의미는 대체로 반영했으나, 원문의 단일 의문문 구조와 두 분사(‘행하는’/‘더럽히는’)의 병렬 관계가 초안에서는 두 질문으로 나뉘어 다소 약화되었습니다. ריב는 여기서 단순히 서로 ‘다투다’라기보다 지도자들을 향해 따지고 꾸짖는 행위를 뜻하므로 ‘꾸짖으며’가 문맥에 더 맞습니다.
  naturalness: ‘이것은 여러분이 하고 있는 무슨 악한 일입니까?’는 현대 한국어 어순으로 다소 부자연스럽습니다. ‘여러분이 행하여 안식일을 더럽히는 이 악한 일이 무엇입니까?’는 원문의 수사적 질문을 유지하면서 자연스럽습니다.
  terminology: ‘유다의 귀족들’과 ‘안식일’은 적절합니다. חלל에 대한 ‘더럽히다’는 거룩한 것을 속되게 취급한다는 의미를 잘 전달합니다. 다만 각주 표지는 해당 표현 바로 뒤에 두는 편이 명확합니다.
