  text: וָ/אָרִ֕יבָ/ה אֵ֖ת חֹרֵ֣י יְהוּדָ֑ה וָ/אֹמְרָ֣/ה לָ/הֶ֗ם מָֽה הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים וּֽ/מְחַלְּלִ֖ים אֶת י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
  footnotes:
  - marker: a
    text: Or “violating” or “desecrating the Sabbath day.” The Hebrew verb carries the sense of treating what is holy as common.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나는 유다의 귀족들을 꾸짖으며 그들에게 말했습니다. “여러분이 행하여 안식일을 더럽히는[a] 이 악한 일이 무엇입니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더럽히다’는 단순히 규정을 어긴다는 뜻이 아니라, 거룩한 것을 속된 것으로 취급한다는 의미를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  english_pob_choice: So I contended
  chosen_korean: 나는 다투며
  alternatives_korean:
  - 나는 논쟁하며
  - 나는 책망하며
  - 나는 대항하며
  lexicon: HALOT
  rationale: ריב의 대립적 뉘앙스를 살리되, 법정적 요소를 과도하게 넣지 않도록 표준적인 서술형 동사로 옮겼습니다. ‘그래서’는 서술 연결의 וַ- 연속을 반영합니다.
- source_word: חֹרֵי יְהוּדָה
  english_pob_choice: the nobles of Judah
  chosen_korean: 유다의 귀족들
  alternatives_korean:
  - 유다의 지도자들
  - 유다의 유력자들
  - 유다의 관리들
  lexicon: HALOT
  rationale: חֹרִים은 사회적 상층 지도자를 가리키므로, 한국어에서는 가장 자연스럽고 위계가 분명한 ‘귀족들’이 적절합니다.
- source_word: מְחַלְּלִים
  english_pob_choice: profaning
  chosen_korean: 더럽히고
  alternatives_korean:
  - 속되게 하고
  - 모독하고
  - 거룩하지 않게 하고
  lexicon: HALOT
  rationale: חלל의 핵심은 거룩한 것을 일반적인 것으로 취급해 ‘더럽히는’ 데 있으므로, 단순한 규정 위반보다 성스러움의 훼손을 드러내는 표현을 택했습니다. 문맥상 ‘안식일’과 결합해 종교적 모독의 의미가 분명합니다.
- source_word: יוֹם הַשַּׁבָּת
  english_pob_choice: the Sabbath day
  chosen_korean: 안식일
  alternatives_korean:
  - 안식일 날
  - 안식의 날
  - 안식일을
  lexicon: HALOT
  rationale: 히브리어의 ‘날’은 한국어 관용에서 반복되기 쉬우므로, ‘안식일’로 자연스럽게 옮기되 동사 목적어로는 문장 내에서 충분히 구현했습니다.
theological_decisions:
- issue: 안식일 위반을 단순 규정 위반이 아니라 거룩성 훼손으로 표현할지 여부
  chosen_reading: ‘안식일을 더럽히고 있지 않습니까?’
  alternative_readings:
  - ‘안식일을 어기고 있지 않습니까?’
  - ‘안식일을 범하고 있지 않습니까?’
  - ‘안식일을 모독하고 있지 않습니까?’
  rationale: 본문의 חלל은 단순한 규칙 위반보다 거룩한 것을 속되게 만드는 행위를 강조하므로, ‘더럽히다’가 신학적 무게를 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
