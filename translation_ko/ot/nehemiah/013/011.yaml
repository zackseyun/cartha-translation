- source_word: נֶעֱזַב
  english_pob_choice: has been neglected
  chosen_korean: 버려졌습니까
  alternatives_korean:
  - 소홀히 여겨졌습니까
  - 방치되었습니까
  - 떠나 있습니까
  lexicon: HALOT
  rationale: 문맥상 성전 봉사가 실제로 방치된 상태를 묻는 말이므로, '버려지다'로 강한 문제 의식을 살렸습니다. English POB의 'neglected'가 지적한 해석 가능성도 유지합니다.
