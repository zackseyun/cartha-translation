  source_fidelity: 핵심 의미는 대체로 충실하지만, נֶעֱזַב의 문맥상 의미는 성전 자체가 완전히 ‘버려졌다’기보다 성전 운영과 봉사가 ‘소홀히 여겨지다/방치되다’에 가깝습니다. 또한 וָאָרִיבָה는 단순한 상호 다툼보다 관리들을 상대로 책임을 따져 묻는 행위를 나타냅니다.
