  - 직무에
  - 자기 맡은 자리에
  lexicon: HALOT
  rationale: '''their standing''의 관용적 의미인 맡은 위치·직무 복귀를 간결하게 드러냈습니다. POB의 ''in their place'' 계열 해석을 반영합니다.'
theological_decisions:
- issue: 성전의 '버려짐/소홀함' 표현
  chosen_reading: 단순한 물리적 방치가 아니라, 예배와 성전 봉사 유지 책임의 실패를 드러내는 표현으로 읽었습니다.
  alternative_readings:
  - 성전 자체가 완전히 황폐해졌다는 읽기
  - 행정적 관리 부재만을 말하는 읽기
  rationale: 문맥상 느헤미야는 성전 운영과 지원 체계의 붕괴를 꾸짖고 있으므로, '버려지다'를 성전 사역의 방치로 이해하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: Nehemiah 13:10-12 문맥
