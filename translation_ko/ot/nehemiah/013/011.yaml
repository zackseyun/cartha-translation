  lexicon: HALOT
  rationale: 히브리어의 직유적 표현을 그대로 살려, POB의 'house of God'와 대응되는 형태를 유지했습니다.
- source_word: עַל עָמְדָם
  english_pob_choice: at their posts
  chosen_korean: 제자리에
  alternatives_korean:
