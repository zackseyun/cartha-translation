base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
  footnotes:
  - marker: a
    text: Or, 'the scroll of Moses.' The Hebrew word can refer to a scroll or book.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the congregation of God.'
    reason: lexical_alternative
  - marker: c
    text: That is, 'for all time' or 'forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 모세의 책[a]이 백성이 듣는 가운데 낭독되었고, 그 안에 암몬 사람이나 모압 사람은 하나님의 회중[b]에 영원히[c] 들어와서는 안 된다고 기록되어 있는 것이 발견되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סֵפֶר는 ‘책’ 외에 ‘두루마리’나 ‘문서’를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님의 공동체’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘영원까지’이며, ‘영원히’ 또는 ‘모든 시대에’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
