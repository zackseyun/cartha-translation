  naturalness: ‘그날에’와 ‘거기에 기록된 바 … 사실이 발견되었습니다’는 현대 한국어 문장으로 다소 경직되고 부자연스럽습니다. ‘그날’, ‘그 안에 … 기록되어 있는 것이 발견되었습니다’가 합쇼체의 격식을 유지하면서 더 자연스럽습니다.
