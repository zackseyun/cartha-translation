source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
  footnotes:
  - marker: a
    text: Or, 'the scroll of Moses.' The Hebrew word can refer to a scroll or book.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the congregation of God.'
    reason: lexical_alternative
  - marker: c
    text: That is, 'for all time' or 'forever.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 모세의 책이 백성의 귀에 낭독되었는데, 거기에 기록된 바 암몬 사람이나 모압 사람은 하나님의 회중에 영원히 들어와서는 안 된다는 사실이 발견되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סֵפֶר는 책, 두루마리, 문서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님의 집회’입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 ‘영원히’ 또는 ‘모든 시대에’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때에
  lexicon: HALOT
  rationale: 특정 사건의 시점을 가리키는 관용적 시간 표현이므로, 현대 한국어에서 자연스러운 ‘그날에’로 옮겼습니다.
- source_word: נִקְרָא
  english_pob_choice: was read
  chosen_korean: 낭독되었는데
  alternatives_korean:
  - 읽혔는데
  - 읽어졌는데
  lexicon: HALOT
  rationale: 공적 낭독의 맥락이므로 단순한 ‘읽다’보다 공개적·구술적 성격을 드러내는 ‘낭독되다’를 선택했습니다.
- source_word: בְּסֵפֶר מֹשֶׁה
  english_pob_choice: the Book of Moses
  chosen_korean: 모세의 책
  alternatives_korean:
  - 모세의 두루마리
  - 모세의 책자
  lexicon: HALOT
  rationale: סֵפֶר가 책/두루마리/문서 모두를 가리킬 수 있으나, 본문은 모세 율법 문서를 가리키므로 직역에 가까운 ‘모세의 책’으로 두었습니다.
- source_word: בִּקְהַל הָאֱלֹהִים
  english_pob_choice: the assembly of God
  chosen_korean: 하나님의 회중
  alternatives_korean:
  - 하나님의 집회
  - 하나님의 성회
  lexicon: HALOT
  rationale: קָהָל은 모인 공동체를 뜻하므로, 교회 제도어보다 본문의 집합적 의미를 살리는 ‘회중’이 적절합니다.
- source_word: עַד עוֹלָם
  english_pob_choice: should ever
  chosen_korean: 영원히
  alternatives_korean:
  - 계속해서
  - 끝까지
  lexicon: HALOT
  rationale: 법적 배제 조항의 지속성을 나타내므로, ‘영원히’로 번역해 금지의 범위를 분명히 했습니다.
theological_decisions:
- issue: בִּקְהַל הָאֱלֹהִים의 공동체 성격
  chosen_reading: 하나님의 회중
  alternative_readings:
  - 하나님의 집회
  - 하나님의 공동체
  rationale: 본문은 특정 제도명보다 언약 공동체의 모임을 가리키므로, 후대 교회 용어를 피하고 원문 구조를 드러내는 표현을 택했습니다.
  doctrine_reference: translation philosophy §§1, 5, 6
- issue: עַד עוֹלָם의 배제 범위
  chosen_reading: 영원히 들어와서는 안 된다는
  alternative_readings:
  - 영원히 들어올 수 없다는
  - 끝없이 들어와서는 안 된다는
  rationale: 인용된 규정은 지속적 금지를 뜻하므로, 법문체를 유지하면서도 한국어에서 자연스러운 금지 표현으로 옮겼습니다.
  doctrine_reference: translation philosophy §§1, 6
