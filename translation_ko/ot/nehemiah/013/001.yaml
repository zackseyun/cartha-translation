  - 하나님의 공동체
  rationale: 본문은 특정 제도명보다 언약 공동체의 모임을 가리키므로, 후대 교회 용어를 피하고 원문 구조를 드러내는 표현을 택했습니다.
  doctrine_reference: translation philosophy §§1, 5, 6
- issue: עַד עוֹלָם의 배제 범위
  chosen_reading: 영원히 들어와서는 안 된다는
  alternative_readings:
  - 영원히 들어올 수 없다는
  - 끝없이 들어와서는 안 된다는
  rationale: 인용된 규정은 지속적 금지를 뜻하므로, 법문체를 유지하면서도 한국어에서 자연스러운 금지 표현으로 옮겼습니다.
  doctrine_reference: translation philosophy §§1, 6
