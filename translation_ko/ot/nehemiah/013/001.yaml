  - 하나님의 성회
  lexicon: HALOT
  rationale: קָהָל은 모인 공동체를 뜻하므로, 교회 제도어보다 본문의 집합적 의미를 살리는 ‘회중’이 적절합니다.
- source_word: עַד עוֹלָם
  english_pob_choice: should ever
  chosen_korean: 영원히
  alternatives_korean:
  - 계속해서
  - 끝까지
  lexicon: HALOT
  rationale: 법적 배제 조항의 지속성을 나타내므로, ‘영원히’로 번역해 금지의 범위를 분명히 했습니다.
theological_decisions:
- issue: בִּקְהַל הָאֱלֹהִים의 공동체 성격
  chosen_reading: 하나님의 회중
  alternative_readings:
