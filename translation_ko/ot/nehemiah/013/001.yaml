  rationale: 공적 낭독의 맥락이므로 단순한 ‘읽다’보다 공개적·구술적 성격을 드러내는 ‘낭독되다’를 선택했습니다.
- source_word: בְּסֵפֶר מֹשֶׁה
  english_pob_choice: the Book of Moses
  chosen_korean: 모세의 책
  alternatives_korean:
  - 모세의 두루마리
  - 모세의 책자
  lexicon: HALOT
  rationale: סֵפֶר가 책/두루마리/문서 모두를 가리킬 수 있으나, 본문은 모세 율법 문서를 가리키므로 직역에 가까운 ‘모세의 책’으로 두었습니다.
- source_word: בִּקְהַל הָאֱלֹהִים
  english_pob_choice: the assembly of God
  chosen_korean: 하나님의 회중
  alternatives_korean:
