  - 그때에
  lexicon: HALOT
  rationale: 특정 사건의 시점을 가리키는 관용적 시간 표현이므로, 현대 한국어에서 자연스러운 ‘그날에’로 옮겼습니다.
- source_word: נִקְרָא
