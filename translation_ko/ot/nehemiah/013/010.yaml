id: NEH.13.10
reference: Nehemiah 13:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֵ֣דְעָ֔/ה כִּֽי מְנָי֥וֹת הַ/לְוִיִּ֖ם לֹ֣א נִתָּ֑נָה וַ/יִּבְרְח֧וּ אִישׁ לְ/שָׂדֵ֛/הוּ הַ/לְוִיִּ֥ם וְ/הַ/מְשֹׁרְרִ֖ים עֹשֵׂ֥י הַ/מְּלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
  footnotes:
  - marker: a
    text: Or 'the prescribed portions' for the Levites.
    reason: lexical_alternative
  - marker: b
    text: Literally 'each to his field.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 레위인들에게 돌아갈 몫이 주어지지 않았다는 것을 알았습니다.[a] 그래서 레위인들과 일을 맡아 하던 노래하는 이들이 각자 자기 밭으로 달아났습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘레위인들에게 규정된 몫’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘각각 자기 밭으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנָיוֹת
  english_pob_choice: the portions
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 몫들
  - 배당분
  lexicon: HALOT
  rationale: 성전 봉사자들에게 마땅히 돌아가야 할 지급분이라는 뜻을 간명하게 살리기 위해 ‘몫’을 택했습니다. ‘레위인들의 몫’은 소유격을 자연스럽게 반영합니다.
- source_word: נִתָּנָה
  english_pob_choice: had not been given
  chosen_korean: 주어지지 않았다는
  alternatives_korean:
  - 주어지지 않았음을
  - 주어지지 않았습니다
  - 지급되지 않았다는
  lexicon: HALOT
  rationale: 수동 의미를 보존하면서도 한국어 문맥에 맞게 ‘주어지다’로 옮겼습니다. 지급의 부재라는 행정적·제의적 뉘앙스를 자연스럽게 드러냅니다.
- source_word: וַיִּבְרְחוּ אִישׁ לְשָׂדֵהוּ
  english_pob_choice: had each fled to his field
  chosen_korean: 각각 자기 밭으로 도망했습니다
  alternatives_korean:
  - 각자 자기 밭으로 달아났습니다
  - 각자 자기 밭으로 갔습니다
  - 각각 자기 밭으로 물러갔습니다
  lexicon: HALOT
  rationale: אִישׁ와 복수 동사에서 드러나는 분배적 의미를 ‘각각/각자’로 살렸고, ‘field’는 농경적 소유지라는 기본 뜻을 따라 ‘밭’으로 옮겼습니다.
- source_word: הַמְשֹׁרְרִים עֹשֵׂי הַמְּלָאכָה
  english_pob_choice: the singers who did the work
  chosen_korean: 노래하는 자들—일을 하는 자들
  alternatives_korean:
  - 노래하는 자들, 곧 일을 하는 자들
  - 노래하는 자들, 그 일을 맡은 자들
  - 성가하는 자들—일을 하는 자들
  lexicon: HALOT
  rationale: ‘노래하는 자들’은 문자적으로 분명한 표현을 유지하고, 뒤의 분사구는 별도의 설명적 동격으로 처리했습니다. ‘일을 하는 자들’은 원문의 ‘봉사/노무’ 의미를 과도하게 특정하지 않고 보존합니다.
theological_decisions:
- issue: 레위인과 성전 노래꾼이 생계 지원을 받지 못해 각자 생업으로 돌아가는 상황의 서술
  chosen_reading: 본문은 제의 질서의 붕괴를 행정적 언어로 진술하며, 신학적 평가는 직접 덧붙이지 않고 사실 보고로 유지했습니다.
  alternative_readings:
  - 제사장 직무의 단순한 중단으로 좁혀 읽는 해석
  - 도덕적 비난을 강하게 드러내는 번역
  rationale: 히브리어는 우선 지원 미지급과 그 결과를 서술하므로, 번역도 원문의 진술 강도를 유지하는 것이 적절합니다.
  doctrine_reference: 공동체의 성전 봉사와 레위인의 생활 보장에 관한 구약의 제의 질서
