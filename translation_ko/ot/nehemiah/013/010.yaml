revisions:
- from: 그리고 나는 레위인들의 몫이 주어지지 않았다는 것을 알았습니다. 그래서 레위인들과 노래하는 자들—일을 하는 자들—은 각각 자기 밭으로 도망했습니다.[a][b]
  to: 그리고 나는 레위인들에게 돌아갈 몫이 주어지지 않았다는 것을 알았습니다.[a] 그래서 레위인들과 일을 맡아 하던 노래하는 이들이 각자 자기 밭으로 달아났습니다.[b]
  rationale: 수식 관계를 자연스러운 한국어로 바로잡아 레위인들과 노래하는 이들 모두가 맡은 일을 하던 사람들이라는 원문의 관계를 보존했습니다. ‘몫’은 유지하되, 문맥상 그들에게 배정·지급되어야 할 몫임을 ‘레위인들에게 돌아갈’로 명확히 했습니다. ‘달아났습니다’는 ברח의 떠남·도피의 어감을 유지하면서, 지원이 끊긴 이들이 각자의 밭으로 돌아간 상황을 과도하게 해석하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:39:59Z'
