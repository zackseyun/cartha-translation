id: NEH.13.4
reference: Nehemiah 13:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לִ/פְנֵ֣י מִ/זֶּ֔ה אֶלְיָשִׁיב֙ הַ/כֹּהֵ֔ן נָת֖וּן בְּ/לִשְׁכַּ֣ת בֵּית אֱלֹהֵ֑י/נוּ קָר֖וֹב לְ/טוֹבִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Now before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
  footnotes:
  - marker: a
    text: Or 'was an associate of Tobiah.' The Hebrew expression can denote close relationship, whether familial or social.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 전에, 우리 하나님의 집의 방을 맡도록 임명된 제사장 엘리아십은 도비야와 가까운 사이였습니다[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 혈연 관계나 사회적 친분을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  english_pob_choice: Now before this
  chosen_korean: 이 일 전에
  alternatives_korean:
  - 이전에는
  - 그 전에는
  lexicon: HALOT
  rationale: 시간적 전환을 자연스럽게 살리면서, 문맥상 앞선 사건을 가리키는 표현으로 압축해 옮겼습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 성직자
  lexicon: HALOT
  rationale: 엘리아십의 공식 직분을 가리키므로 표준적인 성경 용례인 ‘제사장’이 가장 직접적입니다.
- source_word: נָתוּן בְּלִשְׁכַּת בֵּית אֱלֹהֵינוּ
  english_pob_choice: who had been appointed over the chamber of the house of our God
  chosen_korean: 우리 하나님의 집 방들을 맡은 사람이었는데
  alternatives_korean:
  - 우리 하나님의 집 방을 맡은 사람이었는데
  - 우리 하나님의 집의 방들 위에 세워진 사람이었는데
  lexicon: HALOT
  rationale: נָתוּן은 단순한 ‘놓여 있음’보다 직무상 맡김/임명을 뜻하므로 ‘맡은 사람’으로 옮겼고, לִשְׁכָּה는 성전 내 방/실의 의미를 살렸습니다.
- source_word: קָרוֹב לְטוֹבִיָּה
  english_pob_choice: was related to Tobiah
  chosen_korean: 도비야와 가까운 사이였습니다
  alternatives_korean:
  - 도비야와 친족 관계였습니다
  - 도비야와 관련이 있었습니다
  lexicon: HALOT
  rationale: קָרוֹב לְ는 혈연일 수도, 사회적 친분일 수도 있어 ‘가까운 사이’로 두어 관계의 긴밀함은 드러내되 범위를 과도하게 특정하지 않았습니다.
theological_decisions:
- issue: 엘리아십과 도비야의 관계 표현 범위
  chosen_reading: ‘관련이 있었다’보다 더 넓은 의미를 살려 ‘가까운 사이’로 옮겨, 본문이 고발하는 부적절한 친분의 뉘앙스를 유지했습니다.
  alternative_readings:
  - 친족 관계였습니다
  - 도비야의 동맹이었습니다
  rationale: 히브리어는 혈연과 사회적 연계를 모두 포함할 수 있어, 문맥의 문제성은 살리되 확정적 해석은 피하는 것이 본문에 충실합니다.
  doctrine_reference: 본문 주석적/해석학적 판단
- issue: 직분과 배치의 표현
  chosen_reading: ‘맡은 사람’으로 옮겨 성전 관리 책임을 분명히 했습니다.
  alternative_readings:
  - 임명된 사람
  - 관리자로 세워진 사람
  rationale: נָתוּן의 수동적 상태를 행정적 책임 부여로 이해하면 문맥상 성전 질서의 훼손이 더 선명해집니다.
  doctrine_reference: 본문 주석적/해석학적 판단
