  to: 그들이 이스라엘 자손을 빵과 물로 맞이하지 않았으며, 그들을[a] 대적하여 저주하도록 발람을 고용하였지만, 우리 하나님께서는 그 저주를 복으로 바꾸셨기 때문입니다.
