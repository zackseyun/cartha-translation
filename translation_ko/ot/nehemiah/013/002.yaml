  - severity: low
    issue: 각주 표지가 ‘빵과 물’ 뒤에 놓여 있으나, 각주 내용은 저주의 목적어 단수형에 관한 것입니다.
    rationale: 표지를 ‘그들을’에 붙이면 원문 단수 목적어에 대한 설명의 범위와 위치가 일치합니다.
