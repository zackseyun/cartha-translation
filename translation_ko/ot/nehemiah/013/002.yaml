  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to curse him,'' with Israel treated as a collective singular.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이스라엘 자손을 빵과 물로 맞이하지 않았으며, 그들을[a] 대적하여 저주하도록 발람을 고용하였지만, 우리 하나님께서는 그 저주를 복으로 바꾸셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그를 저주하도록’이라고 되어 있습니다. 여기서 단수 ‘그’는 이스라엘을 집합적으로 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קִדְּמוּ
  english_pob_choice: did not meet
  chosen_korean: 맞이하지 않았고
  alternatives_korean:
  - 만나지 않았고
  - 영접하지 않았고
  - 맞아주지 않았고
  lexicon: HALOT
  rationale: קדמ은 단순한 조우보다 먼저 나가 맞이하는 행위를 가리키므로, 문맥상 빵과 물을 동반한 환대의 부재를 살려 ‘맞이하지 않았고’로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 친족적 표현을 그대로 살리되, 한국어 성서 문맥에서도 자연스럽게 읽히는 표준 표현을 택했습니다.
- source_word: לְקַלְלוֹ
  english_pob_choice: to curse them
  chosen_korean: 그들을 저주하게 하려고
  alternatives_korean:
  - 그를 저주하게 하려고
  - 저주하려고
  lexicon: HALOT
  rationale: 히브리어는 단수 목적어 접미사를 쓰지만, 문맥상 이스라엘 공동체 전체를 가리키므로 본문은 이해 가능한 복수로 옮기고, 단수 형태는 각주로 투명하게 남겼습니다.
- source_word: הַקְּלָלָה לִבְרָכָה
  english_pob_choice: the curse into a blessing
  chosen_korean: 저주를 복으로 바꾸셨습니다
  alternatives_korean:
  - 저주를 축복으로 바꾸셨습니다
  - 저주를 복이 되게 하셨습니다
  lexicon: HALOT
  rationale: ‘바꾸다’는 מקור의 전환 동사를 자연스럽게 살리며, 대조 구조를 분명하게 전달합니다. ‘복’은 פְּרָכָה의 기본 의미를 간결하게 반영합니다.
theological_decisions:
- issue: 공동체를 향한 저주의 대상 표기
  chosen_reading: 본문에는 ‘그들을’로 옮기고, 각주에서 히브리어 단수 목적어를 밝힙니다.
  alternative_readings:
  - 그를
  - 이스라엘을
  rationale: 히브리어 형태는 집합적 단수의 긴장을 가지지만, 한국어 본문은 독자가 즉시 이해할 수 있도록 공동체 복수를 택하되, 원문 형태를 각주로 보존해 해석의 투명성을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
- issue: ‘빵과 물’의 구체성 보존
  chosen_reading: ‘빵과 물’
  alternative_readings:
  - 음식과 물
  - 먹을 것과 물
  rationale: 본문은 일반적 호의가 아니라 구체적인 공급의 부재를 말하므로, 원문의 상징성과 신명기 23:4와의 연관을 살려 구체 표지를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
