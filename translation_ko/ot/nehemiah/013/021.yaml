id: NEH.13.21
reference: Nehemiah 13:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אָעִ֣ידָ/ה בָ/הֶ֗ם וָ/אֹמְרָ֤/ה אֲלֵי/הֶם֙ מַדּ֜וּעַ אַתֶּ֤ם לֵנִים֙ נֶ֣גֶד הַ/חוֹמָ֔ה אִם תִּשְׁנ֕וּ יָ֖ד אֶשְׁלַ֣ח בָּ/כֶ֑ם מִן הָ/עֵ֣ת הַ/הִ֔יא לֹא בָ֖אוּ בַּ/שַּׁבָּֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
  footnotes:
  - marker: a
    text: Or “If you repeat this, I will use force against you.” The Hebrew idiom is literally “I will send a hand against you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 내가 그들을 경고하고 그들에게 말했습니다. “왜 성벽 맞은편에서 밤을 지내고 있습니까? 다시 그렇게 하면 내가 손을 대겠습니다.[a]” 그때부터 그들은 안식일에 오지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손을 대겠습니다’는 히브리어 관용구의 직역에 가까우며, 문맥상 ‘힘을 쓰겠습니다’ 또는 ‘강제로 제지하겠습니다’ 정도의 의미를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָעִידָה
  english_pob_choice: I warned
  chosen_korean: 경고하고
  alternatives_korean:
  - 주의 주고
  - 증언하고
  - 타일렀고
  lexicon: HALOT
  rationale: 히필형 עוד는 단순한 정보 전달보다 경고·경책의 뉘앙스가 강하므로, 현대 한국어에서 자연스럽고 경고의 힘을 살리는 ‘경고하다’를 택했습니다.
- source_word: לֵנִים נֶגֶד הַחוֹמָה
  english_pob_choice: are you spending the night in front of the wall
  chosen_korean: 벽 맞은편에서 밤을 지내고 있습니까
  alternatives_korean:
  - 벽 앞에서 밤을 지내고 있습니까
  - 성벽 밖에서 밤을 지내고 있습니까
  - 벽 반대편에서 묵고 있습니까
  lexicon: HALOT
  rationale: נֶגֶד는 ‘마주하여/맞은편에’라는 위치 관계를 가리키므로, 문맥상 자연스럽고 원문의 공간 관계를 보존하는 ‘벽 맞은편에서’로 옮겼습니다.
- source_word: אִם תִּשְׁנוּ יָד אֶשְׁלַח בָּכֶם
  english_pob_choice: If you do it again, I will lay hands on you
  chosen_korean: 다시 그렇게 하면 내가 손을 대겠습니다
  alternatives_korean:
  - 다시 하면 내가 힘으로 대항하겠습니다
  - 다시 그러면 내가 강제로 제지하겠습니다
  - 다시 그렇게 하면 내가 폭력을 쓰겠습니다
  lexicon: HALOT
  rationale: ‘손을 보내다/대다’는 히브리어 관용구로 직접적인 물리적 조치를 암시하므로, 이를 완화하지 않으면서도 한국어에서 과도하게 설명적이지 않은 ‘손을 대겠습니다’로 옮겼습니다.
- source_word: בַּשַּׁבָּת
  english_pob_choice: on the Sabbath
  chosen_korean: 안식일에
  alternatives_korean:
  - 안식일에
  - 그 안식일에
  - 안식일 날에
  lexicon: HALOT
  rationale: שַׁבָּת의 통상적 한국어 대응은 ‘안식일’이며, 본문은 그 규정을 가리키는 서술이므로 간결하게 처리했습니다.
theological_decisions:
- issue: 직설 화법의 경고 강도
  chosen_reading: “다시 그렇게 하면 내가 손을 대겠습니다”로 위협의 직접성을 살렸습니다.
  alternative_readings:
  - ‘다시 그러면 벌을 주겠습니다’
  - ‘다시 하면 제재하겠습니다’
  rationale: 본문의 관용구는 단순한 행정적 제재보다 실제적 개입의 위협을 담고 있으므로, 의미를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문 의미 보존과 경고의 수사적 강도
- issue: 안식일 규정의 결과 진술
  chosen_reading: ‘그때부터 그들은 안식일에 오지 않았습니다’로 결과를 평이하게 진술했습니다.
  alternative_readings:
  - ‘그때부터 그들은 안식일에 더 이상 오지 않았습니다’
  - ‘그 이후로 그들은 안식일에 오지 않았습니다’
  rationale: 히브리어의 서술적 결과를 과장 없이 현대 한국어로 옮겼습니다.
  doctrine_reference: 서술문 결과 표현
