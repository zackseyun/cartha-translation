id: NEH.13.8
reference: Nehemiah 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֥רַֽע לִ֖/י מְאֹ֑ד וָֽ/אַשְׁלִ֜יכָ/ה אֶֽת כָּל כְּלֵ֧י בֵית טוֹבִיָּ֛ה הַ/ח֖וּץ מִן הַ/לִּשְׁכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/008.yaml
  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
  footnotes:
  - marker: a
    text: Or 'all the vessels of Tobiah's house.' The Hebrew term can refer broadly to articles, utensils, furnishings, or goods.
    reason: lexical_alternative
  - marker: b
    text: '''Chamber'' refers to a room in the temple complex.'
    reason: cultural_note
translation:
  language: ko
  text: 그 일이 내게 몹시 못마땅했고, 나는 도비야 집의 모든 물건을 그 방 밖으로 내던졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘도비야 집의 모든 물건’으로 옮긴 히브리어 כְּלִי는 물건, 기구, 그릇, 집기, 가구 등을 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 방’에 해당하는 히브리어 לִשְׁכָּה는 이 문맥에서 성전 복합체 안의 방을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  english_pob_choice: it displeased me greatly
  chosen_korean: 그것이 나를 몹시 불쾌하게 했고
  alternatives_korean:
  - 그것이 나를 크게 슬프게 했고
  - 그것이 나를 매우 괴롭게 했고
  - 그것이 나에게 매우 나빴고
  lexicon: HALOT
  rationale: רעע + ל의 관용구를 감정 상태보다 ‘~에게 불쾌하다/못마땅하다’로 옮겨, 원문의 비인칭 구조와 강도를 함께 살렸습니다.
- source_word: וָאַשְׁלִיכָה
  english_pob_choice: I threw
  chosen_korean: 나는 ... 내던졌습니다
  alternatives_korean:
  - 나는 ... 던졌습니다
  - 나는 ... 던져 버렸습니다
  - 나는 ... 집어던졌습니다
  lexicon: HALOT
  rationale: שלך의 강한 투척 의미를 살리기 위해 단순한 ‘던지다’보다 더 힘 있는 ‘내던지다’를 선택했습니다.
- source_word: כְּלֵי בֵית טוֹבִיָּה
  english_pob_choice: the household goods of Tobiah
  chosen_korean: 도비야의 집의 모든 물건들
  alternatives_korean:
  - 도비야 집의 모든 기물
  - 도비야의 집안 살림살이
  - 도비야의 집의 모든 가구와 집기
  lexicon: HALOT
  rationale: כְּלִי의 넓은 의미를 좁히지 않고, 창고에 들어 있던 소유물 전체라는 문맥을 반영해 ‘물건들’로 옮겼습니다. ‘기물’은 지나치게 문어적이고, ‘집기’는 범위가 다소 좁습니다.
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  english_pob_choice: out of the chamber
  chosen_korean: 방 밖으로
  alternatives_korean:
  - 회랑 밖으로
  - 그 방에서 밖으로
  - 그 창고에서 밖으로
  lexicon: HALOT
  rationale: לִשְׁכָּה의 기본값은 ‘방/chamber’이지만, 한국어에서는 성전 건물의 방이라는 점을 해치지 않는 범위에서 자연스럽게 ‘방 밖으로’로 처리했습니다.
theological_decisions:
- issue: 성전 내 도비야의 물건을 내던지는 행위의 서술 톤
  chosen_reading: 직설적이고 강한 동작 서술을 유지해, 느슨한 정리나 단순 이동이 아니라 성전 공간의 부정한 점유를 단호히 제거하는 장면으로 읽히게 했습니다.
  alternative_readings:
  - 부드럽게 ‘치웠습니다’로 완화
  - ‘옮겼습니다’로 중화
  rationale: 본문의 분노와 정화 행위를 약화하면 내러티브의 긴장이 사라지므로, 동작의 폭력을 드러내는 표현을 유지했습니다.
  doctrine_reference: Nehemiah 13장의 성전 정결 및 언약적 개혁 맥락
- issue: לִשְׁכָּה의 공간성
  chosen_reading: ‘방’으로 옮기되, 문맥상 성전 구역의 방이라는 점은 주석 없이도 드러나도록 했습니다.
  alternative_readings:
  - ‘숙소’로 번안
  - ‘창고’로 특정
  rationale: 본문은 일반 주거공간이 아니라 성전 복합체의 방을 가리키지만, 과도한 특정은 원문의 일반성을 좁힐 수 있어 절제된 번역을 택했습니다.
  doctrine_reference: 성전 내부 공간에 대한 서술
