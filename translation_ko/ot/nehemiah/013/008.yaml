revisions:
- from: 그것이 나를 몹시 불쾌하게 했고, 나는 도비야의 집의 모든 물건들을 방 밖으로 내던졌습니다.[a][b]
  to: 그 일이 내게 몹시 못마땅했고, 나는 도비야 집의 모든 물건을 그 방 밖으로 내던졌습니다.[a][b]
  rationale: The revision improves Korean idiom, removes the awkward double genitive, and represents the definite chamber in the Hebrew. It preserves the source’s impersonal assessment, the emphatic expulsion, and the lexical breadth of כְּלִי without adding theological interpretation.
