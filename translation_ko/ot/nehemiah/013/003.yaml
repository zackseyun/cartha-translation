base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
  footnotes:
  - marker: a
    text: Or 'all those of mixed descent' or 'the mixed company.' The Hebrew עֵרֶב is a collective term for a mixed group.
