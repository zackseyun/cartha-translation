source:
  edition: WLC
  text: וַ/יְהִ֖י כְּ/שָׁמְעָ֣/ם אֶת הַ/תּוֹרָ֑ה וַ/יַּבְדִּ֥ילוּ כָל עֵ֖רֶב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
  footnotes:
  - marker: a
    text: Or 'all those of mixed descent' or 'the mixed company.' The Hebrew עֵרֶב is a collective term for a mixed group.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 율법[a]을 듣게 되었을 때, 이스라엘에서 모든 혼합 무리를 분리했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼혈의 모든 사람들’ 또는 ‘혼합된 무리’로 옮길 수 있습니다. 히브리어 עֵרֶב는 섞인 집단을 가리키는 집합적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשָׁמְעָם
  english_pob_choice: when they heard
  chosen_korean: 그들이 …을 듣게 되었을 때
  alternatives_korean:
  - 그들이 들었을 때
  - 들음으로써
  lexicon: HALOT
  rationale: כְּ + 동사구는 시간절이므로, 현대 한국어에서는 자연스러운 과거 시간 표현인 ‘-게 되었을 때’로 옮겼습니다.
- source_word: הַתּוֹרָה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 토라
  lexicon: HALOT
  rationale: 이 문맥의 תּוֹרָה는 공적 낭독을 통해 확인된 모세 율법을 가리키므로, 프로젝트 표준에 따라 ‘율법’이 가장 직접적입니다.
- source_word: וַיַּבְדִּילוּ
  english_pob_choice: they separated
  chosen_korean: 분리했습니다
  alternatives_korean:
  - 구분했습니다
  - 떼어 놓았습니다
  - 제외했습니다
  lexicon: HALOT
  rationale: בדל은 ‘나누다/분리하다’의 뜻이므로, 결과를 분명히 드러내되 원문의 행위를 과잉 해석하지 않는 ‘분리했습니다’로 옮겼습니다.
- source_word: עֵרֶב
  english_pob_choice: the mixed multitude
  chosen_korean: 혼합 무리
  alternatives_korean:
  - 섞인 무리
  - 혼혈 무리
  - 혼합된 무리
  lexicon: HALOT
  rationale: עֵרֶב는 섞인 집단을 가리키는 집합명사이므로, 영어 POB의 주석 취지를 반영하면서도 한국어로는 덜 낯선 ‘혼합 무리’를 택했습니다.
theological_decisions:
- issue: 이스라엘 표기의 공동체성 보존
  chosen_reading: ‘from Israel’을 ‘이스라엘에서’로 직역해 공동체적 경계의 의미를 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들로부터
  - 이스라엘 회중에서
  rationale: 히브리어는 고유명사 이스라엘을 그대로 사용하므로, 이를 풀어쓰지 않고 공동체 경계의 분리를 드러내는 방식이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
