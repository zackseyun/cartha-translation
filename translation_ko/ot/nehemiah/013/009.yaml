    rationale: 히브리어에서 ‘하나님의 집의 기물’, ‘곡식 제물’, ‘유향’은 모두 ‘내가 그곳에 다시 가져다 두었다’의 목적어로 연결됩니다.
  - severity: medium
    issue: ‘향’은 לְבוֹנָה의 구체적 의미를 충분히 반영하지 못합니다.
    rationale: לְבוֹנָה는 특별히 유향(frankincense)을 뜻하므로 ‘유향’으로 옮기는 것이 정확합니다.
  - severity: low
    issue: 각주 b의 표지가 정결 행위가 아닌 문장 끝에 놓여 있습니다.
    rationale: 각주 내용이 טהר(‘정결하게 하다’)를 설명하므로 해당 표현 바로 뒤에 표지를 두어야 합니다.
