  text: 이 일로 말미암아 저를 기억하소서, 나의 하나님. 제가 하나님의 집과 그 직무를 위하여 행한 신실한 행위들[a]을 지워 버리지 마소서.[b]
  philosophy: optimal-equivalence
  footnotes:
