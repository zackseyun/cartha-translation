    text: 또는 ‘제가 행한 충성된 행위들’ 또는 ‘제가 행한 인애의 행위들’. 히브리어 낱말은 인애, 충성, 또는 언약적 신실함의 뜻을 가질 수 있습니다.
    reason: חֲסָדַי의 어휘적 의미 범위를 제시합니다.
  - marker: b
    text: 또는 ‘그 섬김을 위하여’ 또는 ‘그 맡겨진 책임을 위하여’. 이는 하나님의 집과 관련된 의무와 섬김을 가리킵니다.
    reason: מִשְׁמָרָיו의 성전 문맥상 의미를 제시합니다.
