source:
  edition: WLC
  text: וָ/אָרִ֤יב עִמָּ/ם֙ וָ/אֲקַֽלְלֵ֔/ם וָ/אַכֶּ֥ה מֵ/הֶ֛ם אֲנָשִׁ֖ים וָֽ/אֶמְרְטֵ֑/ם וָ/אַשְׁבִּיעֵ֣/ם בֵּֽ/אלֹהִ֗ים אִם תִּתְּנ֤וּ בְנֹֽתֵי/כֶם֙ לִ/בְנֵי/הֶ֔ם וְ/אִם תִּשְׂאוּ֙ מִ/בְּנֹ֣תֵי/הֶ֔ם לִ/בְנֵי/כֶ֖ם וְ/לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
  footnotes:
  - marker: a
    text: Or, 'I put them under oath before God.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew, ''if you give ... and if you take ...''; in this oath context the sense is prohibitive: ''you shall not give ... nor take.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 나는 그들과 다투며 그들을 저주했고[a], 그들 가운데 몇몇 남자들을 쳤으며 그들의 머리털을 뽑았습니다. 그리고 나는 그들에게 하나님으로 맹세시켜 말했습니다. “너희는 너희 딸들을 그들의 아들들에게 주지 말고[b], 그들의 딸들을 너희 아들들을 위해나 너희 자신을 위해서도 취하지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘하나님 앞에서 그들에게 맹세를 시켰다.’
    reason: lexical_alternative
  - marker: b
    text: '히브리어는 ‘만일 너희가 ... 만일 너희가 취하면 ...’의 형식이지만, 여기서는 서약 맥락이므로 뜻은 금지입니다: ‘... 주지 말고 ... 취하지 마십시오.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיב
  english_pob_choice: I contended
  chosen_korean: 그들과 다투며
  alternatives_korean:
  - 그들과 논쟁하며
  - 그들을 책망하며
  lexicon: HALOT
  rationale: ריב은 단순한 꾸짖음보다 상대와 맞서 다투거나 시비를 거는 뜻이 강하므로, 갈등성과 법정적 뉘앙스를 살려 옮겼습니다.
- source_word: וָאֲקַלְלֵם
  english_pob_choice: cursed them
  chosen_korean: 그들을 저주했고
  alternatives_korean:
  - 그들을 욕했고
  - 그들에게 저주를 선언했고
  lexicon: HALOT
  rationale: קלל은 여기서 단순한 모욕보다 저주를 발하는 뜻이므로, 직접적인 ‘저주했다’로 옮겨 원문의 강도를 유지했습니다.
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  english_pob_choice: I made them swear by God
  chosen_korean: 그들에게 하나님으로 맹세시켜
  alternatives_korean:
  - 그들을 하나님 앞에서 맹세하게 하여
  - 그들에게 하나님으로 맹세하게 하여
  lexicon: HALOT
  rationale: שׁבע의 히필은 ‘맹세하게 하다’의 뜻이므로, Nehemiah가 직접 그들에게 서약을 시킨 행위를 드러내되 한국어 자연성을 위해 ‘맹세시켜’로 옮겼습니다.
- source_word: אִם תִּתְּנוּ ... וְאִם תִּשְׂאוּ
  english_pob_choice: You shall not give ... nor take
  chosen_korean: 너희는 너희 딸들을 그들의 아들들에게 주지 말고 ... 그들의 딸들을 너희 아들들을 위해나 너희 자신을 위해서도 취하지 마십시오
  alternatives_korean:
  - 너희는 ... 주지 말고 ... 취하지 말라
  - 만일 ... 주고 ... 취하면
  lexicon: HALOT
  rationale: 맹세문에서 אם은 조건절이 아니라 금지의 서약 내용을 여는 표현이므로, 현대 한국어에서는 분명한 금지형으로 풀어 원문의 서약 효력을 드러냈습니다.
theological_decisions:
- issue: 네헤미야의 폭력적 조치의 번역 수위
  chosen_reading: 꾸짖음, 저주, 구타, 머리털 뽑음을 모두 직접적으로 유지했습니다.
  alternative_readings:
  - 훈계했다 정도로 완화함
  - 폭력을 더 강하게 과장함
  rationale: 본문은 공동체 정화의 맥락 속에서 네헤미야의 거친 조치를 서술하므로, 이를 완화하거나 증폭하지 않고 서술 그대로 드러내는 것이 원문 충실성에 부합합니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: 서약문 안의 אם 처리
  chosen_reading: 서약 형식의 금지문으로 옮겼습니다.
  alternative_readings:
  - 그대로 ‘만일’로 직역
  - 단순 명령형으로만 처리
  rationale: 맹세문에서는 אם이 실제 조건이 아니라 금지 서약의 내용으로 기능하므로, 한국어 독자는 분명한 금지로 이해해야 합니다.
  doctrine_reference: Translation philosophy §§1, 6
