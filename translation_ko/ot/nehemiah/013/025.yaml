  terminology: ‘하나님’은 기존 본문의 용례와 일치하며, ‘저주하다’와 ‘맹세하게 하다’는 각각 קלל 및 שבע 히필의 의미를 적절히 보존합니다. ‘아내로 삼다’는 נשא의 혼인 문맥을 명확히 하되 의미를 과도하게 해석하지 않습니다.
