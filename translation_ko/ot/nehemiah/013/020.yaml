translation:
  language: ko
  text: 그러자 상인들과 모든 종류의 물건을 파는 사람들이 예루살렘 밖에서 한두 번 밤을 지냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘한 번과 두 번’이지만, 뜻은 ‘한두 번’입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּלִינוּ
  english_pob_choice: spent the night
  chosen_korean: 밤을 지냈습니다
  alternatives_korean:
  - 묵었습니다
  - 머물렀습니다
  lexicon: HALOT
  rationale: לון은 ‘밤을 보내다, 묵다’의 뜻이므로, 현대 한국어에서 자연스럽고 시간적 의미를 살리는 ‘밤을 지냈습니다’로 옮겼습니다.
- source_word: הָרֹכְלִים
  english_pob_choice: the merchants
  chosen_korean: 상인들
  alternatives_korean:
  - 무역상들
  - 장사꾼들
  lexicon: HALOT
  rationale: רֹכֵל은 물건을 사고파는 상인을 가리키므로, 문맥에 맞는 일반적이고 표준적인 ‘상인들’이 적절합니다.
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  english_pob_choice: and sellers of every kind of goods
  chosen_korean: 모든 종류의 물건을 파는 사람들
  alternatives_korean:
  - 각종 상품을 파는 사람들
  - 온갖 물품을 파는 사람들
  lexicon: HALOT
  rationale: ‘모든 종류의 물건’은 히브리어의 포괄성을 살리며, ‘파는 사람들’은 האנשים who sell의 분사적 성격을 자연스럽게 반영합니다.
- source_word: פַּעַם וּשְׁתָּיִם
  english_pob_choice: once or twice
  chosen_korean: 한두 번
  alternatives_korean:
  - 한 번이나 두 번
  - 한 번과 두 번
  lexicon: HALOT
  rationale: 이 관용구는 ‘한두 번’이라는 빈도를 뜻하므로, 한국어 관용 표현으로 압축하되 반복의 제한성을 유지했습니다.
