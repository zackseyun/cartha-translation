  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
  footnotes:
  - marker: a
    text: Or 'lodged outside Jerusalem once or twice.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'once and twice,' an idiom meaning 'once or twice.'
