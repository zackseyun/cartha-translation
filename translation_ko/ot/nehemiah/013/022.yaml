  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לַ/לְוִיִּ֗ם אֲשֶׁ֨ר יִֽהְי֤וּ מִֽטַּהֲרִים֙ וּ/בָאִים֙ שֹׁמְרִ֣ים הַ/שְּׁעָרִ֔ים לְ/קַדֵּ֖שׁ אֶת י֣וֹם הַ/שַּׁבָּ֑ת גַּם זֹאת֙ זָכְרָ/ה לִּ֣/י אֱלֹהַ֔/י וְ/ח֥וּסָ/ה עָלַ֖/י כְּ/רֹ֥ב חַסְדֶּֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
  footnotes:
  - marker: a
    text: Or, 'Remember me for this also, my God.' The Hebrew idiom can attach the benefactive sense either to Nehemiah himself or to the deed just mentioned.
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, often referring to God''s loyal covenant love and mercy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 그들이 정결하게 되어 문들을 지키러 오도록 레위인들에게 말했습니다[a]. 그렇게 하여 안식일을 거룩하게 하게 하려는 것이었습니다. 이것도 제게 기억해 주십시오, 제 하나님[b], 그리고 주의 크신 인애대로 저를 아껴 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘문들을 지키러 오도록’은 히브리어의 목적·결과 흐름을 자연스럽게 옮긴 것입니다. 직역하면 ‘문들을 지키는 자로서 오도록’에 가깝습니다.
    reason: alternative_reading
  - marker: b
    text: ‘기억해 주십시오’는 히브리어 관용구로, ‘저를 위해 기억해 주십시오’ 또는 ‘이 일로 인해 저를 유익하게 기억해 주십시오’라는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  english_pob_choice: And I told
  chosen_korean: 그리고 나는 ... 말했습니다
  alternatives_korean:
  - 그리고 나는 ... 말했다
  - 그리고 나는 ... 명령했습니다
  lexicon: HALOT
  rationale: 말하기 동사로 처리하면 뒤따르는 내용절을 자연스럽게 이끌 수 있고, 문맥의 행정적 지시성을 유지하면서도 ‘명령했습니다’처럼 힘을 과장하지 않습니다.
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  english_pob_choice: that they should purify themselves and come to guard the gates
  chosen_korean: 그들이 정결하게 되어 문들을 지키러 오도록
  alternatives_korean:
  - 그들이 스스로를 깨끗하게 하고 와서 문들을 지키도록
  - 그들이 정결례를 행하고 문들을 지키도록
  lexicon: HALOT
  rationale: 히트파엘의 정결 행위를 ‘정결하게 되다’로 옮겨 자기 정결의 뉘앙스를 살렸고, ‘지키러 오도록’으로 와서 지킨다는 목적적 흐름을 자연스럽게 반영했습니다.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  english_pob_choice: to keep the Sabbath day holy
  chosen_korean: 안식일을 거룩하게 하게 하려는 것이었습니다
  alternatives_korean:
  - 안식일을 거룩하게 지키게 하려는 것이었습니다
  - 안식일을 성별하게 하려는 것이었습니다
  lexicon: HALOT
  rationale: קדש의 핵심은 ‘거룩하게 하다/구별하다’이므로, 안식일을 ‘거룩하게 하다’로 직접 살리되 한국어 문장 흐름상 목적 표현을 보완했습니다.
- source_word: זָכְרָה לִּי
  english_pob_choice: Remember this also in my favor
  chosen_korean: 이것도 제게 기억해 주십시오
  alternatives_korean:
  - 이것도 저를 위해 기억해 주십시오
  - 이 일도 제 편에서 기억해 주십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 이익/유익의 뜻은 주석적 여백으로 남기고, 본문에서는 간결하게 ‘제게 기억해 주십시오’로 옮겨 하나님께 드리는 간청 형식을 유지했습니다.
- source_word: כְּרֹב חַסְדֶּךָ
  english_pob_choice: according to the greatness of your steadfast love
  chosen_korean: 주의 크신 인애대로
  alternatives_korean:
  - 주의 큰 인애대로
  - 주의 풍성한 사랑대로
  lexicon: HALOT
  rationale: חסד은 하나님의 언약적 사랑과 신실한 자비를 함께 담는 말이므로, 전통적 신학어인 ‘인애’를 사용하되 ‘크신’으로 רב의 강도를 반영했습니다.
theological_decisions:
- issue: זָכְרָה לִּי의 유익적 뉘앙스
  chosen_reading: ‘제게 기억해 주십시오’로 본문에 두고, 유익/편익의 뉘앙스는 주석으로 처리합니다.
  alternative_readings:
  - 저를 위해 기억해 주십시오
  - 제 편에서 기억해 주십시오
  rationale: 이 구절은 하나님께서 단순히 기억하시는 것보다, 기억하심이 화자의 유익이 되도록 구하는 ప్రార기도 같은 표현입니다. 본문은 간결하게 유지하고, 독자가 관용구의 방향성을 오해하지 않도록 주석으로 보완하는 편이 균형적입니다.
  doctrine_reference: 시편·느헤미야의 탄원 기도 관용구; 하나님의 기억은 언약적 유익을 동반함
