  chosen_korean: 나는 그를 내게서 쫓아냈습니다
  alternatives_korean:
  - 나는 그를 내 앞에서 몰아냈습니다
  - 나는 그를 내게서 내쫓았습니다
  lexicon: HALOT
  rationale: 히필 동사의 강한 추방·강제 제거 의미를 살리되, 행정적 '추방'보다 문맥에 맞는 직접적 표현으로 옮겼습니다.
