base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
  footnotes:
  - marker: a
    text: Or, more broadly, 'was related by marriage to Sanballat.' The Hebrew term can denote a marriage relation, but in this context 'son-in-law' is the most specific natural reading.
    reason: lexical_alternative
  - marker: b
    text: Or 'I chased him away' or 'I banished him.' The Hebrew verb emphasizes forcible removal; the exact administrative form of the action is not specified.
    reason: lexical_alternative
translation:
  language: ko
  text: 대제사장 엘리아십의 아들 여호야다의 아들들 가운데 한 사람이 호론 사람 산발랏의 사위였으므로, 나는 그를 내게서 쫓아냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבְּנֵי
  english_pob_choice: And one of the sons of
  chosen_korean: 아들들 가운데 한 사람
  alternatives_korean:
  - 아들들 중 한 사람
  - 아들들 가운데서 한 사람
  lexicon: HALOT
  rationale: 부분관계를 자연스럽게 살리면서도 한국어에서 가장 매끄럽게 들리는 표현으로 옮겼습니다.
- source_word: הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 높은 제사장
  lexicon: HALOT
  rationale: 히브리어 관용적 직함을 한국어 성경에서 통용되는 정확한 대응으로 옮겼습니다.
- source_word: חָתָן לְסַנְבַלַּט
  english_pob_choice: was a son-in-law of Sanballat
  chosen_korean: 산발랏의 사위
  alternatives_korean:
  - 산발랏과 혼인 관계에 있는 사람
  - 산발랏과 인척 관계인 사람
  lexicon: HALOT
  rationale: 문맥상 가장 구체적이고 자연스러운 친족 관계는 '사위'이므로, 더 넓은 혼인 관계 표현보다 이를 택했습니다.
- source_word: וָאַבְרִיחֵהוּ מֵעָלָי
  english_pob_choice: so I drove him away from me
  chosen_korean: 나는 그를 내게서 쫓아냈습니다
  alternatives_korean:
  - 나는 그를 내 앞에서 몰아냈습니다
  - 나는 그를 내게서 내쫓았습니다
  lexicon: HALOT
  rationale: 히필 동사의 강한 추방·강제 제거 의미를 살리되, 행정적 '추방'보다 문맥에 맞는 직접적 표현으로 옮겼습니다.
