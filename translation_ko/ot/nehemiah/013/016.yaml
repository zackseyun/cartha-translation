  source_fidelity: 핵심 어휘와 사건은 대체로 충실합니다. 그러나 ‘예루살렘에서까지’는 접속사 וְ의 단순 병렬을 ‘심지어/까지’라는 강조로 확정하므로, 원문의 가능한 강조는 각주에서만 밝혀 두고 본문에서는 중립적으로 옮기는 편이 적절합니다. 또한 마지막 장소구는 판매 행위에 연결되도록 한국어 문장을 명료하게 해야 합니다.
  naturalness: ‘유다의 자손들에게, 그리고 예루살렘에서까지 팔고 있었습니다’는 서로 다른 기능의 부사어가 다소 어색하게 병렬되고 ‘까지’가 강조를 추가합니다. 판매 동사를 보완하여 두 대상/장소 관계를 자연스럽게 드러내었습니다.
