id: NEH.13.16
reference: Nehemiah 13:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/צֹּרִים֙ יָ֣שְׁבוּ בָ֔/הּ מְבִיאִ֥ים דָּ֖אג וְ/כָל מֶ֑כֶר וּ/מֹכְרִ֧ים בַּ/שַּׁבָּ֛ת לִ/בְנֵ֥י יְהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/016.yaml
  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'to the people of Judah' or 'to the Judeans.' The Hebrew reads literally 'to the sons of Judah.'
    reason: lexical_alternative
  - marker: b
    text: 'The final phrase ''and in Jerusalem'' may be understood emphatically: ''even in Jerusalem.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 두로 사람들이 그 안에 살면서[a] 물고기와 각종 상품을 들여와, 안식일에 유다의 자손들에게 팔았으며 예루살렘에서도 팔았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 안에’입니다. 이는 예루살렘을 가리킵니다.
    reason: source_note
  - marker: b
    text: 마지막 구절인 ‘그리고 예루살렘에서’는 강조적으로 ‘심지어 예루살렘에서’로 이해할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצֹּרִים
  english_pob_choice: Also Tyrians
  chosen_korean: 또한 두로 사람들이
  alternatives_korean:
  - 그리고 두로 사람들이
  - 또한 두로인들이
  lexicon: HALOT
  rationale: צֹרִים은 두로 출신 사람들을 가리키므로 지명형 주민 표현으로 옮겼습니다. 앞의 וְ는 문맥상 비난 항목을 이어 주는 연결이어서 ‘또한’으로 자연스럽게 처리했습니다.
- source_word: יָשְׁבוּ בָהּ
  english_pob_choice: lived in it
  chosen_korean: 그 안에 거주하면서
  alternatives_korean:
  - 그곳에 살면서
  - 그 안에 살면서
  lexicon: HALOT
  rationale: ישׁב는 ‘살다/거주하다’의 뜻이므로, 예루살렘을 가리키는 여성형 대명사 ‘그 안에’를 살려 도시 내부 거주를 드러냈습니다.
- source_word: לִבְנֵי יְהוּדָה
  english_pob_choice: to the sons of Judah
  chosen_korean: 유다의 자손들에게
  alternatives_korean:
  - 유다 사람들에게
  - 유다인들에게
  lexicon: HALOT
  rationale: 히브리어의 문자 그대로는 ‘유다의 아들들/자손들’이므로, POB의 성별-정확성 원칙을 따라 혈통 표현을 유지했습니다.
- source_word: וּבִירוּשָׁלִָם
  english_pob_choice: and in Jerusalem
  chosen_korean: 그리고 예루살렘에서까지
  alternatives_korean:
  - 그리고 예루살렘에서
  - 심지어 예루살렘에서까지
  lexicon: HALOT
  rationale: 문맥상 거래가 예루살렘 안에서까지 벌어졌다는 강조를 반영할 수 있어, ‘에서까지’로 여지를 남겼습니다. 다만 히브리어 접속 구조는 그대로 살렸습니다.
theological_decisions:
- issue: 안식일 위반의 강조 방식
  chosen_reading: ‘안식일에 ... 팔고 있었습니다’로 현재진행적 지속성을 살려, 반복적이고 노골적인 위반이라는 본문 비판을 약화하지 않았습니다.
  alternative_readings:
  - ‘안식일에 ... 팔았습니다’
  - ‘안식일에 ... 팔곤 했습니다’
  rationale: 분사 구조와 내러티브 맥락은 단발 사건보다 지속적 관행을 시사하므로, 한국어에서도 진행형으로 긴장감을 유지하는 것이 적절합니다.
  doctrine_reference: 본문 문맥상 안식일 규례의 공적 위반 강조
- issue: ‘유다의 자손들’의 성별-정확성
  chosen_reading: ‘유다의 자손들’로 옮겨 히브리어 친족/혈통 표현을 보존했습니다.
  alternative_readings:
  - 유다 사람들
  - 유다인들
  rationale: 완곡한 집합명사로 바꾸면 원문의 혈통적·가문적 어감을 약화할 수 있어, POB의 문서화된 원칙에 따라 직역 성격을 살렸습니다.
  doctrine_reference: 원문 혈통 언어 보존 원칙
