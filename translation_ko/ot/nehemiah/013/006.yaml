  text: וּ/בְ/כָל זֶ֕ה לֹ֥א הָיִ֖יתִי בִּֽ/ירוּשָׁלִָ֑ם כִּ֡י בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וּ/שְׁתַּ֜יִם לְ/אַרְתַּחְשַׁ֤סְתְּא מֶֽלֶךְ בָּבֶל֙ בָּ֣אתִי אֶל הַ/מֶּ֔לֶךְ וּ/לְ/קֵ֥ץ יָמִ֖ים נִשְׁאַ֥לְתִּי מִן הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
  footnotes:
  - marker: a
    text: 'Hebrew: ''king of Babylon.'' The text is translated as written rather than harmonized to the broader Persian imperial setting.'
    reason: textual_variant
  - marker: b
    text: Or 'at the end of some days' / 'after a period of time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이 모든 일 동안 저는 예루살렘에 있지 않았습니다[a]. 그 이유는 바사 왕 아닥사스다의 삼십이년에 제가 왕에게 갔고, 얼마 뒤에 왕에게서 허락을 구했기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘바벨론 왕.’ 번역은 더 넓은 페르시아 제국의 정황과 조화시키지 않고, 적힌 그대로 옮겼습니다.'
    reason: textual_variant
  - marker: b
    text: 또는 ‘며칠의 끝에’ / ‘어느 기간이 지난 뒤에.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  english_pob_choice: But during all this
  chosen_korean: 그러나 이 모든 일 동안
  alternatives_korean:
  - 그리고 이 모든 일 동안
  - 이 모든 일 내내
  lexicon: HALOT
  rationale: 앞선 서술 전체를 시간적으로 가리키며, 단순한 접속보다 ‘그 기간 내내’의 뜻을 살리는 표현이 적절합니다.
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  english_pob_choice: I was not in Jerusalem
  chosen_korean: 저는 예루살렘에 있지 않았습니다
  alternatives_korean:
  - 저는 예루살렘에 없었습니다
  - 저는 예루살렘에 머물지 않았습니다
  lexicon: HALOT
  rationale: 화자의 부재를 직접적이고 자연스러운 현대 한국어로 옮겼습니다.
- source_word: מֶלֶךְ בָּבֶל
  english_pob_choice: king of Babylon
  chosen_korean: 바사 왕
  alternatives_korean:
  - 바빌론 왕
  - 바벨론 왕
  lexicon: HALOT
  rationale: 영어 POB가 본문대로 ‘king of Babylon’을 유지한 점을 따라가되, 한국어에서는 본문의 비정상적 결합을 살리기 위해 역사적 조화보다 원문 형식을 우선해 옮겼습니다.
- source_word: וּלְקֵץ יָמִים
  english_pob_choice: after some time
  chosen_korean: 얼마 뒤에
  alternatives_korean:
  - 며칠 뒤에
  - 시간이 지난 뒤에
  lexicon: HALOT
  rationale: 문자적으로는 ‘날들의 끝에’이지만 여기서는 불특정한 경과를 뜻하므로, 현대어에서 자연스럽게 ‘얼마 뒤에’로 풀었습니다.
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  english_pob_choice: I asked leave from the king
  chosen_korean: 왕에게서 허락을 구했기 때문입니다
  alternatives_korean:
  - 왕에게 허락을 청했기 때문입니다
  - 왕에게서 휴가를 청했기 때문입니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 질문이 아니라 왕에게 떠날 허락을 구하는 뜻이므로, ‘허락을 구하다’로 옮겨 자연스럽게 의미를 드러냈습니다.
theological_decisions:
- issue: 본문의 ‘바벨론 왕’ 표현을 역사적 상식으로 조화할지 여부
  chosen_reading: 본문을 조화시키지 않고, 네헤미야서 히브리어에 있는 그대로의 표현과 그 긴장을 유지합니다.
  alternative_readings:
  - ‘바사 왕’으로 역사적 맥락에 맞게 조정
  - ‘바벨론 왕’ 각주로만 처리
  rationale: POB의 원칙대로 텍스트가 실제로 말하는 바를 보존해야 하므로, 본문 자체의 표현을 흐리지 않도록 했습니다.
  doctrine_reference: source fidelity / textual integrity
