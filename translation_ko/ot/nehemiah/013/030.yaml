base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
  footnotes:
  - marker: a
    text: Or 'watches' or 'service assignments' for the priests and Levites.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 그들을 모든 이방의 것에서 정결하게 하고, 제사장들과 레위 사람들에게 각자가 맡은 일에 따라 직무를 정해 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘직무’는 제사장들과 레위 사람들의 정해진 섬김의 책임이나 근무 배정을 가리킵니다. ‘근무 순번’ 또는 ‘봉사 배정’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטִהַרְתִּים
  english_pob_choice: So I cleansed them
  chosen_korean: 그래서 나는 그들을 … 깨끗하게 했고
  alternatives_korean:
  - 그리고 나는 그들을 깨끗하게 했고
  - 나는 그들을 정결하게 했고
  lexicon: HALOT
  rationale: טהר의 사역형은 ‘깨끗하게 하다/정결하게 하다’의 뜻이므로, 개혁의 결과 흐름을 살린 ‘그래서’와 함께 자연스러운 합쇼체로 옮겼습니다.
- source_word: מִכָּל נֵכָר
  english_pob_choice: from everything foreign
  chosen_korean: 모든 이방적인 것에서
  alternatives_korean:
  - 모든 외국적인 것에서
  - 모든 이질적인 것에서
  - 모든 이방성에서
  lexicon: HALOT
  rationale: נֵכָר는 단순한 ‘외국인’보다 더 넓게 ‘이방의/외래의/부정한 혼합’의 범위를 가질 수 있어, 문맥의 정결 개혁을 반영하는 ‘이방적인 것’으로 넓게 옮겼습니다.
- source_word: מִשְׁמָרוֹת
  english_pob_choice: duties
  chosen_korean: 직무
  alternatives_korean:
  - 경비
  - 순번
  - 담당
  lexicon: HALOT
  rationale: מִשְׁמָרוֹת는 제사장·레위인의 질서 있는 섬김의 배치이므로, 현대 한국어에서 문맥을 가장 분명하게 드러내는 ‘직무’를 선택했습니다.
- source_word: אִישׁ בִּמְלַאכְתּוֹ
  english_pob_choice: each in his work
  chosen_korean: 각 사람에게 자기 일에 따른
  alternatives_korean:
  - 각자 자기 일에
  - 각 사람을 자기 일에
  - 각 사람이 자기 일에서
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 살려 ‘각 사람’으로, בִּמְלַאכְתּוֹ는 ‘자기 일’로 옮겨 개인별 책임 분담의 뜻을 분명히 했습니다.
theological_decisions:
- issue: ‘all foreign’의 범위
  chosen_reading: ‘모든 이방적인 것’은 민족적 외국인만이 아니라, 느헤미야의 개혁 문맥에서 부정한 혼합과 외래적 요소 전반을 가리키는 넓은 표현으로 읽었습니다.
  alternative_readings:
  - 모든 외국인
  - 모든 이방 여자
  - 모든 외래 요소
  rationale: 히브리어 נֵכָר 자체가 넓은 범위를 가지며, 앞뒤 문맥은 성전과 공동체의 정결 개혁입니다. 따라서 본문을 민족적 대상 하나로만 좁히지 않았습니다.
  doctrine_reference: original-language primacy; preserve the semantic breadth of the source
