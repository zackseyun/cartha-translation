  text: 그렇다면 우리가 너희의 말을 듣고[a] 이 모든 큰 악을 행하여 우리 하나님께 신의를 저버리고, 이방 여자들을 아내로 맞아야 합니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 말에 따르다’ 또는 ‘너희에게 순종하다’. 히브리어 동사는 누군가의 말을 듣고 따르거나 그에게 순종한다는 뜻을 가질 수 있다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘이방 여자들을 거하게 하다’. 문맥상 그들을 아내로 맞아 함께 살게 하는 것을 뜻한다.
    reason: lexical_alternative
