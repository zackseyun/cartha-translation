id: NEH.13.13
reference: Nehemiah 13:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אוֹצְרָ֣/ה עַל א֠וֹצָרוֹת שֶׁלֶמְיָ֨ה הַ/כֹּהֵ֜ן וְ/צָד֣וֹק הַ/סּוֹפֵ֗ר וּ/פְדָיָה֙ מִן הַ/לְוִיִּ֔ם וְ/עַל יָדָ֔/ם חָנָ֥ן בֶּן זַכּ֖וּר בֶּן מַתַּנְיָ֑ה כִּ֤י נֶאֱמָנִים֙ נֶחְשָׁ֔בוּ וַ/עֲלֵי/הֶ֖ם לַ/חֲלֹ֥ק לַ/אֲחֵי/הֶֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
  footnotes:
  - marker: a
    text: Or 'under their direction' for 'at their side'; the Hebrew idiom can indicate close association or subordinate service.
    reason: lexical_alternative
  - marker: b
    text: Or 'regarded as trustworthy' for 'considered faithful.'
    reason: lexical_alternative
  - marker: c
    text: '''Brothers'' renders the masculine Hebrew term; here it refers to their fellow members of the community.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 셀레먀야 제사장, 서기관 삭도, 레위 사람 브다야를 곳간들 위에 임명하고, 그들 곁에 학개야의 아들, 맛다냐의 손자 하나난을 두었습니다. 그들은 신실한 사람들로 여겨졌기 때문이며, 그들에게는 자기 형제들에게 분배하는 책임이 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들 곁에’는 히브리어 관용구의 자연스러운 옮김으로, ‘그들의 지휘 아래’ 혹은 ‘그들 아래에서’의 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형제들’은 히브리어 남성 복수 친족어를 옮긴 것으로, 여기서는 공동체의 동료 구성원들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘신실한 사람들로 여겨졌기 때문’은 ‘신뢰할 만한 사람들로 간주되었기 때문’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹצְרָה עַל אֹצָרוֹת
  english_pob_choice: I appointed over the storerooms
  chosen_korean: 곳간들 위에 임명하고
  alternatives_korean:
  - 창고들을 맡기고
  - 곳간들을 관리하게 하고
  - 보관실들 위에 세우고
  lexicon: HALOT
  rationale: 동사는 단순 보관이 아니라 직무 배정의 행위를 가리키므로 ‘임명하다’가 맞고, אֹצָרוֹת는 문맥상 성전 관련 저장 공간인 ‘곳간들’이 가장 자연스럽습니다.
- source_word: שֶׁלֶמְיָה הַכֹּהֵן / צָדוֹק הַסֹּפֵר / וּפְדָיָה מִן הַלְוִיִּם
  english_pob_choice: Shelemiah the priest / Zadok the scribe / Pedaiah from the Levites
  chosen_korean: 셀레먀야 제사장, 서기관 삭도, 레위 사람 브다야
  alternatives_korean:
  - 셀렘야 제사장, 서기관 사독, 레위 사람 브다야
  - 셀레먀야 제사장, 기록관 삭도, 레위 사람 브다야
  lexicon: HALOT
  rationale: 고유명사는 현대 음역으로 옮기고, 직분은 מקור의 관직 의미를 살려 ‘제사장’, ‘서기관’으로 번역했습니다. מִן הַלְוִיִּם은 소속을 나타내므로 ‘레위 사람’이 가장 직설적입니다.
- source_word: וְעַל יָדָם
  english_pob_choice: and at their side
  chosen_korean: 그들 곁에
  alternatives_korean:
  - 그들 옆에
  - 그들 아래에서
  - 그들 편에
  lexicon: HALOT
  rationale: 히브리어 관용구는 밀착된 동행 또는 보조적 위치를 나타내므로, 위계까지 단정하지 않으면서 자연스럽게 읽히는 ‘그들 곁에’로 옮겼습니다.
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  english_pob_choice: because they were considered faithful
  chosen_korean: 그들은 신실한 사람들로 여겨졌기 때문이며
  alternatives_korean:
  - 그들은 신뢰할 만한 사람으로 평가되었기 때문이며
  - 그들은 충실한 사람으로 간주되었기 때문이며
  lexicon: HALOT
  rationale: נֶאֱמָנִים은 단순 능력보다 신실함·신뢰성을 함께 담고, נֶחְשָׁבוּ는 ‘여겨지다/평가되다’의 뉘앙스를 더하므로 두 요소를 함께 살렸습니다.
- source_word: לַחֲלֹק לַאֲחֵיהֶם
  english_pob_choice: to distribute to their brothers
  chosen_korean: 자기 형제들에게 분배하는 책임이 있었습니다
  alternatives_korean:
  - 자기 형제들에게 나누어 주는 일이 있었습니다
  - 자기 형제들에게 분배하도록 맡겨졌습니다
  lexicon: HALOT
  rationale: לַחֲלֹק은 단순 분할이 아니라 배분·분배의 의미이며, 수동적 책임 배정을 드러내기 위해 ‘책임이 있었습니다’로 풀었습니다. אֲחֵיהֶם은 남성 복수 친족어를 유지해 ‘형제들’로 옮겼습니다.
theological_decisions:
- issue: 직분과 관계 서술의 행정적 성격
  chosen_reading: 본문은 성전 곳간 관리자를 임명하는 행정 기록으로 읽고, 인물들의 관계를 위계 단정 없이 ‘그들 곁에’로 옮겼습니다.
  alternative_readings:
  - ‘그들 아래에’로 더 강한 종속 관계를 나타내는 읽기
  - ‘그들의 지휘 아래’로 관리 감독 구조를 명시하는 읽기
  rationale: 히브리어 관용구 עַל יָד는 인접·보조·소속의 폭이 있어, 본문이 분명히 말하는 범위를 넘겨 권위 서열을 고정하지 않는 것이 적절합니다.
  doctrine_reference: '본문 주해 원칙: 관용구는 문맥이 허용하는 범위 안에서만 구체화'
