  terminology: ‘제사장’, ‘서기관’, ‘레위 사람’, ‘곳간’, ‘신실하다’, ‘형제들’은 문맥과 격식에 적절합니다. 인명은 통용 성경 음역에 맞추어 스렘야, 사독, 브다야, 하난, 삭굴, 맛다냐로 바로잡았습니다. ‘형제들’은 히브리어의 남성 복수 친족어를 보존합니다.
