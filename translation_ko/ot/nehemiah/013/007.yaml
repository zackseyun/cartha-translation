  text: וָ/אָב֖וֹא לִֽ/ירוּשָׁלִָ֑ם וָ/אָבִ֣ינָ/ה בָ/רָעָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה אֶלְיָשִׁיב֙ לְ/ט֣וֹבִיָּ֔ה לַ/עֲשׂ֥וֹת ל/וֹ֙ נִשְׁכָּ֔ה בְּ/חַצְרֵ֖י בֵּ֥ית הָ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
  footnotes:
  - marker: a
    text: Or 'a chamber'; the Hebrew term can refer to a room or chamber within the temple complex.
    reason: lexical_alternative
  - marker: b
    text: '''The house of God'' refers to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 예루살렘에 이르렀을 때, 엘리아십이 도비야를 위해 하나님의 집 뜰 안에 그를 위한 방을 마련해 준 악한 일을 내가 깨달았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נִשְׁכָּה는 성전 परिसर 안의 ‘방’ 또는 ‘chamber’를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하나님의 집’은 여기서 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וָאָב֖וֹא לִירוּשָׁלִָם
  english_pob_choice: When I came to Jerusalem
  chosen_korean: 내가 예루살렘에 이르렀을 때
  alternatives_korean:
  - 내가 예루살렘에 왔을 때
  - 예루살렘에 도착했을 때
  lexicon: HALOT
  rationale: 와야ק톨의 사건 진행을 한국어의 시간절로 자연스럽게 옮기되, 문맥상 보고형 서술을 유지했습니다.
- source_word: וָאָבִינָה
  english_pob_choice: I understood
  chosen_korean: 내가 깨달았습니다
  alternatives_korean:
  - 내가 이해했습니다
  - 내가 알게 되었습니다
  lexicon: HALOT
  rationale: 단순 정보 습득보다 상황의 도덕적 실상을 분명히 알아차리는 뉘앙스를 살렸습니다.
- source_word: נִשְׁכָּה
  english_pob_choice: a room / chamber
  chosen_korean: 방
  alternatives_korean:
  - 방
  - 칸
  lexicon: HALOT
  rationale: 성전 구역 안의 작은 방을 가리키지만, 현대 한국어에서는 가장 직접적이고 과장 없는 표현으로 옮겼습니다.
- source_word: בְּחַצְרֵי בֵּית הָאֱלֹהִים
  english_pob_choice: in the courts of the house of God
  chosen_korean: 하나님의 집 뜰 안에
  alternatives_korean:
  - 하나님의 집 뜰에
  - 하나님의 집 뜰들 안에
  lexicon: HALOT
  rationale: ‘courts’의 복수성을 완전히 살리기보다 성전 뜰이라는 공간성을 자연스럽게 전달했습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집
  lexicon: HALOT
  rationale: 영어 POB의 직역적 표현을 유지해 히브리어 관용구를 보존했고, 문맥상 성전을 가리킨다는 점은 본문 자체로 충분합니다.
theological_decisions:
- issue: 엘리아십의 행위를 평가하는 רָעָה의 강도
  chosen_reading: ‘악한 일’로 옮겨 도덕적 비난의 강도를 그대로 드러냈습니다.
  alternative_readings:
  - 나쁜 일
  - 잘못된 일
  - 악행
  rationale: 본문은 단순 실수보다 성전의 거룩함을 침해한 도덕적 악을 분명히 규정하므로, 완곡한 표현을 피했습니다.
  doctrine_reference: 원문 우선 원칙; 성전 거룩성에 대한 서술의 윤리적 무게 보존
