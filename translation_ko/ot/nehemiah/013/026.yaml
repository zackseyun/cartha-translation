source:
  edition: WLC
  text: הֲ/ל֣וֹא עַל אֵ֣לֶּה חָטָֽא שְׁלֹמֹ֣ה מֶ֣לֶךְ יִשְׂרָאֵ֡ל וּ/בַ/גּוֹיִ֣ם הָ/רַבִּים֩ לֹֽא הָיָ֨ה מֶ֜לֶךְ כָּמֹ֗/הוּ וְ/אָה֤וּב לֵֽ/אלֹהָי/ו֙ הָיָ֔ה וַ/יִּתְּנֵ֣/הוּ אֱלֹהִ֔ים מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵ֑ל גַּם אוֹת֣/וֹ הֶחֱטִ֔יאוּ הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
  footnotes:
  - marker: a
    text: Or 'the foreign wives.' The Hebrew says 'the foreign women'; 'wives' is a contextually informed alternative from Solomon's story but is not explicit in this verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 일들 때문에 이스라엘의 왕 솔로몬이 죄를 지은 것이 아니었습니까? 그러나 많은 나라들 가운데 그와 같은 왕은 없었고, 그는 자기 하나님께 사랑받았으며, 하나님께서 그를 온 이스라엘의 왕으로 세우셨습니다. 그마저도 이방 여자들[a]이 죄를 짓게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘외국 아내들’. 히브리어는 ‘이방 여자들’이라고 되어 있으며, ‘아내들’은 솔로몬 이야기 전체를 고려한 문맥적 대안이지만 이 절 자체에는 명시되어 있지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא עַל אֵלֶּה
  english_pob_choice: Was it not because of these things
  chosen_korean: 이런 일들 때문에 … 죄를 지은 것이 아니었습니까?
  alternatives_korean:
  - 이 일들 때문에 … 죄를 지은 것이 아니었습니까?
  - 이런 것들로 인해 … 죄를 지은 것이 아니었습니까?
  lexicon: HALOT
  rationale: 수사 의문문의 반문 성격을 살리면서 עַל אֵלֶּה의 원인·계기 의미를 자연스러운 한국어로 옮겼습니다.
- source_word: לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  english_pob_choice: there was no king like him
  chosen_korean: 그와 같은 왕은 없었고
  alternatives_korean:
  - 그처럼 왕은 없었고
  - 그와 비길 왕은 없었고
  lexicon: HALOT
  rationale: 비교 구문을 간결하게 처리해 솔로몬의 탁월함을 자연스러운 합쇼체로 드러냈습니다.
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  english_pob_choice: and he was loved by his God
  chosen_korean: 그는 그의 하나님께 사랑받았으며
  alternatives_korean:
  - 그는 그의 하나님께 사랑을 받았으며
  - 그는 그의 하나님께 사랑받는 사람이었으며
  lexicon: HALOT
  rationale: אָהוּב의 피동적 상태를 한국어 수동 표현으로 살리고, ‘his God’의 인칭 소유를 유지했습니다.
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ
  english_pob_choice: and God made him king
  chosen_korean: 하나님께서 그를 … 왕으로 세우셨습니다
  alternatives_korean:
  - 하나님께서 그를 왕으로 삼으셨습니다
  - 하나님께서 그를 왕이 되게 하셨습니다
  lexicon: HALOT
  rationale: נתן + 목적어 + 보어의 임명/세움 의미를 살려, 직역보다 ‘세우셨습니다’가 직무 부여의 의미를 더 정확히 드러냅니다.
- source_word: הַנָּשִׁים הַנָּכְרִיּוֹת
  english_pob_choice: foreign women
  chosen_korean: 이방 여자들
  alternatives_korean:
  - 이방 여성들
  - 외국 여자들
  lexicon: HALOT
  rationale: נָכְרִי의 ‘외부자/이방인’ 의미를 반영해 성경적 관용에 맞는 ‘이방 여자들’을 선택했습니다.
theological_decisions:
- issue: 솔로몬의 죄의 원인 서술
  chosen_reading: 본문이 말하는 범위 안에서, 이방 여자들이 솔로몬을 죄로 이끈 책임을 직접 진술합니다.
  alternative_readings:
  - 그들이 단지 유혹했을 뿐이라고 완화하는 해석
  - 혼인 동맹의 정치적 결과를 암시하는 확대 해석
  rationale: 히브리어의 히필 동사 הֶחֱטִיאוּ는 ‘죄를 짓게 하다’라는 직접적 인과를 담으므로, 그 강도를 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3
