    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  english_pob_choice: And all Judah
  chosen_korean: 유다 온 백성
  alternatives_korean:
  - 유다의 모든 사람들
  - 온 유다
  lexicon: HALOT
  rationale: יְהוּדָה는 지명만이 아니라 공동체를 가리키므로, 문맥상 집합적 의미를 살려 자연스러운 한국어로 옮겼습니다.
- source_word: מַעְשַׂר הַ/דָּגָן
  english_pob_choice: the tithe of the grain
  chosen_korean: 곡식의 십일조
  alternatives_korean:
  - 곡식의 열째 부분
  - 곡식 십일조
  lexicon: HALOT
  rationale: מַעְשַׂר은 제도적 용어인 '십일조'가 가장 सीधे 대응하며, הַדָּגָן은 일반적인 농산물로서 '곡식'이 적절합니다.
- source_word: וְ/הַ/תִּירוֹשׁ
  english_pob_choice: the new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 새 술
  - 새로운 포도주
  lexicon: HALOT
  rationale: תִּירוֹשׁ는 일반적인 포도주보다 갓 짜낸/새것의 뉘앙스를 지니므로, '새 포도주'가 의미를 가장 직접적으로 드러냅니다.
- source_word: לָ/אוֹצָרוֹת
  english_pob_choice: into the storehouses
  chosen_korean: 곳간으로
  alternatives_korean:
  - 저장실로
  - 창고로
  lexicon: HALOT
  rationale: אוֹצָרוֹת은 곡식·포도주·기름을 보관하는 저장 공간을 가리키므로, '곳간'이 한국어에서 가장 자연스럽고 문맥에 맞습니다.
theological_decisions:
- issue: 헌정물의 보관 장소 표현
  chosen_reading: 성전 재정의 저장 공간을 가리키는 중립적 용어로 '곳간'을 사용했습니다.
  alternative_readings:
  - 창고
  - 보물창고
  rationale: 본문은 금전적 '보물'보다 농산물의 보관을 강조하므로, 과도하게 재정화하거나 상징화하지 않고 생산물 저장소의 기능을 살렸습니다.
  doctrine_reference: 느헤미야서 문맥의 성전 봉헌 및 십일조 규정
