id: NEH.1.3
reference: Nehemiah 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֮ לִ/י֒ הַֽ/נִּשְׁאָרִ֞ים אֲשֶֽׁר נִשְׁאֲר֤וּ מִן הַ/שְּׁבִי֙ שָׁ֣ם בַּ/מְּדִינָ֔ה בְּ/רָעָ֥ה גְדֹלָ֖ה וּ/בְ/חֶרְפָּ֑ה וְ/חוֹמַ֤ת יְרוּשָׁלִַ֨ם֙ מְפֹרָ֔צֶת וּ/שְׁעָרֶ֖י/הָ נִצְּת֥וּ בָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
  footnotes:
  - marker: a
    text: Or “the exile.” The Hebrew phrase may be rendered “from the captivity” or “from the exile.”
    reason: lexical_alternative
  - marker: b
    text: Or “in great distress and reproach.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 내게 말했습니다[a]. 「그곳에 남아 있는 남은 사람들, 곧 포로로 끌려갔다가 살아남은 사람들은 그 지방에서 큰 환난과 수치를 당하고 있습니다[b]. 예루살렘의 성벽은 무너졌고, 그 성문들은 불에 탔습니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “포로에서.” 히브리어 구문은 “포로로부터” 또는 “포로 생활에서”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “큰 곤란과 수치 가운데.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים / נִשְׁאֲרוּ
  english_pob_choice: the remnant ... who survived
  chosen_korean: 남은 사람들, 곧 포로로 끌려갔다가 살아남은 사람들
  alternatives_korean:
  - 남아 있는 자들
  - 남은 자들
  lexicon: HALOT
  rationale: 반복된 ‘남다’ 계열 표현의 집단성과 생존 뉘앙스를 살리되, 한국어에서는 ‘남은 사람들’과 ‘살아남은 사람들’로 자연스럽게 풀어 옮겼습니다.
- source_word: מִן הַשְּׁבִי
  english_pob_choice: the captivity / the exile
  chosen_korean: 포로로 끌려갔다가
  alternatives_korean:
  - 포로 생활에서
  - 포로에서
  lexicon: HALOT
  rationale: 명사형 ‘포로됨’의 상태를 그대로 살리기보다, 본문이 말하는 역사적 이주·유배 상황을 드러내는 ‘포로로 끌려갔다가’가 의미를 더 분명하게 전달합니다.
- source_word: בְּרָעָה גְדֹלָה
  english_pob_choice: in great trouble
  chosen_korean: 큰 환난
  alternatives_korean:
  - 큰 고통
  - 큰 재난
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악이 아니라 심각한 재난·곤란을 가리키므로, ‘큰 환난’이 문맥의 절박함과 공적 재난성을 잘 드러냅니다.
- source_word: וּבְחֶרְפָּה
  english_pob_choice: and disgrace
  chosen_korean: 수치를 당하고 있습니다
  alternatives_korean:
  - 치욕을 당하고 있습니다
  - 모욕을 당하고 있습니다
  lexicon: HALOT
  rationale: חֶרְפָּה의 공개적 수치와 불명예를 현재 상태로 전달하기 위해 ‘수치를 당하고 있습니다’로 옮겼습니다.
- source_word: מְפֹרָצֶת
  english_pob_choice: is broken down
  chosen_korean: 무너졌고
  alternatives_korean:
  - 허물어졌고
  - 깨졌고
  lexicon: HALOT
  rationale: 성벽이 파괴되어 벌어진 상태를 한국어 관용에 맞게 간결히 ‘무너졌고’로 옮겼습니다.
theological_decisions:
- issue: 예루살렘 성벽과 성문의 붕괴를 현재적 진술로 제시하는 방식
  chosen_reading: 문맥의 보고체를 따라 ‘무너졌고… 불에 탔습니다’로 현재 청자에게 전달되는 사실 보고로 살렸습니다.
  alternative_readings:
  - 무너졌으며… 불탔습니다
  - 무너져 있으며… 불에 탔습니다
  rationale: 느헤미야의 탄식문맥에서 보고의 생생함이 중요하므로, 단순 과거보다 현재적 परिणाम을 느끼게 하는 표현을 택했습니다.
  doctrine_reference: 서사적 시제와 상태 묘사의 충실한 재현
- issue: ‘남은 사람들’과 ‘살아남은 사람들’의 이중 표현
  chosen_reading: 원문의 반복을 살려 집단 정체성과 생존의 사실을 함께 드러냈습니다.
  alternative_readings:
  - 살아남은 자들
  - 남은 자들
  rationale: 원문은 남겨진 자와 살아남은 자를 겹쳐 강조하므로, 하나로 평면화하지 않고 두 표현을 함께 유지하는 편이 स्रोत 의미에 더 가깝습니다.
  doctrine_reference: 본문 반복의 강조 효과 보존
