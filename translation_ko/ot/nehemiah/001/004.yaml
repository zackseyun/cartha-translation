    text: 또는 '나는 금식하며 기도하였습니다.' 히브리어 형태는 더 단순하게 번역될 수 있으나, '나는 금식하며 기도하였습니다'는 היה와 분사 형태가 나타내는 지속적 의미를 반영합니다.
