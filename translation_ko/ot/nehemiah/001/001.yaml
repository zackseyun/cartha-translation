  - …에 관한 이야기입니다
  - …의 기록입니다
  lexicon: HALOT
  rationale: 히브리어 표제어 דִּבְרֵי는 인물의 ‘말’ 자체라기보다 그에 관한 서술적 표제를 열 수 있어, 한국어에서는 자연스럽게 ‘…에 관한 말씀’으로 옮겨 표제 기능을 살렸습니다.
- source_word: וַיְהִי
