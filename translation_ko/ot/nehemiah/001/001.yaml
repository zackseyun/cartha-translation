base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
  footnotes:
  - marker: a
    text: Or 'The account of Nehemiah son of Hacaliah.' The Hebrew heading 'The words of' can introduce a memoir or narrative record.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the twentieth year'; the verse does not explicitly state whose regnal year is meant, though the context later identifies Artaxerxes.
    reason: cultural_note
  - marker: c
    text: Or 'Susa the fortress.' The Hebrew term refers to a fortified royal complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 하가랴의 아들 느헤미야의 말씀입니다[a]. 기슬르월 스무째 해에, 내가 수산 성채[c][b]에 있을 때였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하가랴의 아들 느헤미야의 기록입니다.’ 히브리어 표제 ‘~의 말씀들’은 회고록이나 서사 기록의 서문으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단지 ‘스무째 해’라고만 하며, 누구의 재위인지는 이 절에서 밝히지 않습니다. 뒤의 문맥에서 아닥사스다 왕의 재위로 확인됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘수산의 요새.’ 히브리어는 요새화된 왕실 복합체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  english_pob_choice: The words of
  chosen_korean: …에 관한 말씀입니다
  alternatives_korean:
