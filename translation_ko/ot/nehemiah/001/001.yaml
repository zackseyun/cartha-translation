  alternatives_korean:
  - 그리고 일이 일어났습니다
  - 그때 일이 일어났습니다
  - 이제 일어난 일은
  lexicon: HALOT
  rationale: 서사 전환의 관용구로서 단순 접속보다 장면 진입 기능이 중요하므로, 구어적이되 문어체인 ‘이제 그 일이 벌어진 것은’으로 옮겼습니다.
- source_word: כִּסְלֵו
  english_pob_choice: Kislev
  chosen_korean: 키슬레우
  alternatives_korean:
  - 기슬르
