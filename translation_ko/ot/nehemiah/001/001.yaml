  lexicon: HALOT
  rationale: בִּירָה는 단순한 ‘성’보다 왕궁을 겸한 요새화된 복합체를 가리키므로, POB의 ‘citadel’에 맞춰 ‘성채’로 옮겼습니다.
theological_decisions:
- issue: 제목형 서술의 처리
  chosen_reading: 본문을 인물 전기라기보다 문서/기록의 표제로 읽어 ‘…에 관한 말씀입니다’로 시작했습니다.
  alternative_readings:
  - ‘느헤미야의 말들입니다’
  - ‘느헤미야의 기록입니다’
  rationale: 히브리어 דִּבְרֵי는 단순한 언어 발화보다 서문적 표제 기능을 띠므로, 독자가 장르를 오해하지 않도록 서술적 도입으로 처리했습니다.
  doctrine_reference: 성경 장르와 표제의 문학적 기능
- issue: 미표시된 통치 연대의 보존
  chosen_reading: ‘제이십년’만 제시하고 누구의 재위인지는 본문에 넣지 않았습니다.
  alternative_readings:
  - ‘아닥사스다 왕의 제이십년’
  - ‘그의 제이십년’
  rationale: 이 절 자체는 연대의 주체를 밝히지 않으므로, 후대 맥락 정보를 본문에 앞당겨 넣지 않고 주석적으로만 유지하는 것이 원문 충실에 맞습니다.
  doctrine_reference: 본문 비약 금지와 역사적 문맥 존중
