  text: דִּבְרֵ֥י נְחֶמְיָ֖ה בֶּן חֲכַלְיָ֑ה וַ/יְהִ֤י בְ/חֹֽדֶשׁ כסלו שְׁנַ֣ת עֶשְׂרִ֔ים וַ/אֲנִ֥י הָיִ֖יתִי בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
  footnotes:
  - marker: a
    text: Or 'The account of Nehemiah son of Hacaliah.' The Hebrew heading 'The words of' can introduce a memoir or narrative record.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the twentieth year'; the verse does not explicitly state whose regnal year is meant, though the context later identifies Artaxerxes.
    reason: cultural_note
  - marker: c
    text: Or 'Susa the fortress.' The Hebrew term refers to a fortified royal complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 느헤미야, 하가랴의 아들에 관한 말씀입니다[a]. 이제 그 일이 벌어진 것은 키슬레우 월, 제이십년이었고, 나는 수산의 성채[c][b]에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하가랴의 아들 느헤미야의 기록입니다.’ 히브리어 표제 ‘~의 말씀들’은 회고록이나 서사 기록의 서문으로도 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단지 ‘제이십년’이라고만 하며, 누구의 재위인지 이 절에서는 밝히지 않습니다. 문맥상 뒤에서 아닥사스다 왕으로 확인됩니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘수산의 요새.’ 히브리어는 요새화된 왕실 복합체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  english_pob_choice: The words of
  chosen_korean: …에 관한 말씀입니다
  alternatives_korean:
  - …의 말씀입니다
  - …에 관한 이야기입니다
  - …의 기록입니다
  lexicon: HALOT
  rationale: 히브리어 표제어 דִּבְרֵי는 인물의 ‘말’ 자체라기보다 그에 관한 서술적 표제를 열 수 있어, 한국어에서는 자연스럽게 ‘…에 관한 말씀’으로 옮겨 표제 기능을 살렸습니다.
- source_word: וַיְהִי
  english_pob_choice: Now it happened
  chosen_korean: 이제 그 일이 벌어진 것은
  alternatives_korean:
  - 그리고 일이 일어났습니다
  - 그때 일이 일어났습니다
  - 이제 일어난 일은
  lexicon: HALOT
  rationale: 서사 전환의 관용구로서 단순 접속보다 장면 진입 기능이 중요하므로, 구어적이되 문어체인 ‘이제 그 일이 벌어진 것은’으로 옮겼습니다.
- source_word: כִּסְלֵו
  english_pob_choice: Kislev
  chosen_korean: 키슬레우
  alternatives_korean:
  - 기슬르
  - 키슬레브
  lexicon: HALOT
  rationale: 히브리 월명은 음역하되, 현대 한국어 표기 관행에 맞는 ‘키슬레우’를 택했습니다.
- source_word: שְׁנַת עֶשְׂרִים
  english_pob_choice: in the twentieth year
  chosen_korean: 제이십년
  alternatives_korean:
  - 스무 해
  - 제20년
  - 제이십 년
  lexicon: HALOT
  rationale: 히브리어 연대 표지의 압축성을 살리기 위해 수사적·문어적으로 ‘제이십년’이라 옮겼으며, 본문에 통치자 이름을 보태지 않았습니다.
- source_word: שׁוּשַׁן הַבִּירָה
  english_pob_choice: Susa the citadel
  chosen_korean: 수산의 성채
  alternatives_korean:
  - 수산의 요새
  - 수사의 성채
  - 수산의 궁성
  lexicon: HALOT
  rationale: בִּירָה는 단순한 ‘성’보다 왕궁을 겸한 요새화된 복합체를 가리키므로, POB의 ‘citadel’에 맞춰 ‘성채’로 옮겼습니다.
theological_decisions:
- issue: 제목형 서술의 처리
  chosen_reading: 본문을 인물 전기라기보다 문서/기록의 표제로 읽어 ‘…에 관한 말씀입니다’로 시작했습니다.
  alternative_readings:
  - ‘느헤미야의 말들입니다’
  - ‘느헤미야의 기록입니다’
  rationale: 히브리어 דִּבְרֵי는 단순한 언어 발화보다 서문적 표제 기능을 띠므로, 독자가 장르를 오해하지 않도록 서술적 도입으로 처리했습니다.
  doctrine_reference: 성경 장르와 표제의 문학적 기능
- issue: 미표시된 통치 연대의 보존
  chosen_reading: ‘제이십년’만 제시하고 누구의 재위인지는 본문에 넣지 않았습니다.
  alternative_readings:
  - ‘아닥사스다 왕의 제이십년’
  - ‘그의 제이십년’
  rationale: 이 절 자체는 연대의 주체를 밝히지 않으므로, 후대 맥락 정보를 본문에 앞당겨 넣지 않고 주석적으로만 유지하는 것이 원문 충실에 맞습니다.
  doctrine_reference: 본문 비약 금지와 역사적 문맥 존중
