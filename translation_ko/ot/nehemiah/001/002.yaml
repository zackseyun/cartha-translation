  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֨א חֲנָ֜נִי אֶחָ֧ד מֵ/אַחַ֛/י ה֥וּא וַ/אֲנָשִׁ֖ים מִֽ/יהוּדָ֑ה וָ/אֶשְׁאָלֵ֞/ם עַל הַ/יְּהוּדִ֧ים הַ/פְּלֵיטָ֛ה אֲשֶֽׁר נִשְׁאֲר֥וּ מִן הַ/שֶּׁ֖בִי וְ/עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the Judeans.' The Hebrew term can refer to the people of Judah or to the Jewish people more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'the survivors' or 'the remnant' for 'who had escaped.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from the exile.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나니[a], 곧 내 형제들 중 한 사람과 유다에서 온 몇 사람도 함께 왔습니다. 나는 그들에게 포로 생활에서 살아남은 유대인들[b][c], 곧 남아 있는 사람들과 예루살렘에 대해 물었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 사람 한니’가 아니라 히브리어 고유명사 하나니입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘생존자들’ 또는 ‘남은 자들’입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘포로에서’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲנָנִי
  english_pob_choice: Hanani
  chosen_korean: 하나니
  alternatives_korean:
  - 하난니
  - 한나니
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사를 현대 한국어 음역으로 옮겼습니다.
- source_word: אֶחָד מֵאַחַי הוּא
  english_pob_choice: one of my brothers
  chosen_korean: 내 형제들 중 한 사람
  alternatives_korean:
  - 내 형제 가운데 한 사람
  - 내 형제 중 하나
  lexicon: HALOT
  rationale: 관계성을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘중 한 사람’으로 옮겼습니다.
- source_word: הַפְּלֵיטָה ... אֲשֶׁר נִשְׁאֲרוּ מִן הַשֶּׁבִי
  english_pob_choice: who had escaped, who were left from the captivity
  chosen_korean: 포로 생활에서 살아남은 ... 남아 있는 사람들
  alternatives_korean:
  - 포로에서 피한 ... 남은 자들
  - 포로 생활에서 벗어난 ... 생존자들
  lexicon: HALOT
  rationale: פְּלֵיטָה와 נִשְׁאֲרוּ의 중첩된 뉘앙스를 살려 ‘살아남은’과 ‘남아 있는’으로 나누어 표현했습니다.
- source_word: מִן הַשֶּׁבִי
  english_pob_choice: from the captivity
  chosen_korean: 포로 생활에서
  alternatives_korean:
  - 포로 상태에서
  - 포로됨에서
  lexicon: HALOT
  rationale: שֶׁבִי는 단순한 ‘감금’보다 역사적 포로 상태를 가리키므로, 자연스러운 한국어로 ‘포로 생활’이라 옮겼습니다.
- source_word: וְעַל יְרוּשָׁלִָם
  english_pob_choice: and about Jerusalem
  chosen_korean: 예루살렘에 대해
  alternatives_korean:
  - 예루살렘에 관해
  - 예루살렘에 대해서
  lexicon: HALOT
  rationale: עַל의 문의 대상 표지를 자연스럽게 한국어 조사로 풀었습니다.
theological_decisions:
- issue: הַיְּהוּדִים의 범위
  chosen_reading: ‘유대인들’로 옮기되, 맥락상 포로기 이후 공동체를 가리키는 역사적·민족적 집단이라는 점을 본문 그대로 유지했습니다.
  alternative_readings:
  - 유다 사람들
  - 유대 사람들
  rationale: POB의 영어 선택처럼 이 표현은 단순한 지리적 주민이 아니라 포로에서 돌아온 공동체를 포괄할 수 있어, 현대 독자가 이해하기 쉬운 ‘유대인들’을 사용했습니다.
  doctrine_reference: 역사-언약 공동체의 연속성
