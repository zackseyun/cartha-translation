id: NEH.1.5
reference: Nehemiah 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
  footnotes:
  - marker: a
    text: Or “the great and fearsome God.”
    reason: lexical_alternative
  - marker: b
    text: Or “who keeps the covenant and covenant faithfulness / lovingkindness.”
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 이렇게 말했습니다. “부디, 하늘의 하나님이신 야훼, 크고 두려우신 하나님이시여[a], 자기를 사랑하고 그의 계명을 지키는 이들을 위해 언약과 한결같은 사랑을 지키시는 분이시여,[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “크고 경외로우신 하나님.”
    reason: lexical_alternative
  - marker: b
    text: ‘한결같은 사랑’은 ‘인애’, ‘언약적 신실함’ 또는 ‘사랑의 충실함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: And I said
  chosen_korean: 그리고 내가 말했습니다
  alternatives_korean:
  - 그때 내가 말했습니다
  - 그래서 내가 말했습니다
  lexicon: HALOT
  rationale: 와이익톨의 서술 진행을 살리되, 기도 인용문을 여는 자연스러운 한국어로 옮겼습니다.
- source_word: אָֽנָּא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 간청하오니
  lexicon: HALOT
  rationale: 기도에서의 간청을 드러내는 완곡한 호소로, 현대 표준어에서 가장 자연스럽고 공손한 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문헌적 고유명사인 여호와 신명을 전통 대체어가 아니라 직접 음역한 형태로 유지했습니다.
- source_word: וְהַנּוֹרָא
  english_pob_choice: awesome / awe-inspiring
  chosen_korean: 두려우신
  alternatives_korean:
  - 경외로우신
  - 엄위하신
  lexicon: HALOT
  rationale: נורא의 핵심은 단순한 '멋짐'이 아니라 경외와 두려움을 불러일으키는 성격이므로, 고어화하지 않으면서도 그 긴장을 살렸습니다.
- source_word: חֶסֶד
  english_pob_choice: steadfast love
  chosen_korean: 인애
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 자비
  lexicon: HALOT
  rationale: 언약 맥락에서의 חסד를 한국어 성경 전통과 본문의 관계적 충실성을 함께 고려해 '인애'로 옮겼습니다. 문맥상 '사랑'보다 언약적 충성의 뉘앙스가 강합니다.
- source_word: וּלְשֹׁמְרֵי מִצְוֺתָיו
  english_pob_choice: and keep his commandments
  chosen_korean: 그의 명령을 지키는 이들에게
  alternatives_korean:
  - 그의 계명을 지키는 이들에게
  - 그의 규례를 지키는 이들에게
  lexicon: HALOT
  rationale: מִצְוֺתָיו는 일반적으로 '계명'이 가능하지만, 한국어에서 더 직접적이고 평이한 '명령'으로 옮겨 대상자 병렬을 자연스럽게 만들었습니다.
theological_decisions:
- issue: 하나님의 성품을 나타내는 וְהַנּוֹרָא의 한국어 뉘앙스
  chosen_reading: 두려우신 하나님
  alternative_readings:
  - 경외로우신 하나님
  - 엄위하신 하나님
  - 두려운 하나님
  rationale: 본문은 하나님을 단순히 'awesome'한 분이 아니라, 그 거룩한 위엄 앞에서 인간이 떨게 되는 분으로 묘사합니다. 그래서 '두려우신'을 택해 경외와 두려움의 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
- issue: חֶסֶד의 언약적 성격
  chosen_reading: 인애
  alternative_readings:
  - 변함없는 사랑
  - 언약적 사랑
  - 자비
  rationale: 이 절은 '언약'과 평행을 이루는 חסד를 사용하므로, 단순 감정적 사랑보다 언약적 충실성을 내포하는 표현이 필요합니다. 한국어 전통어인 '인애'가 그 의미를 비교적 압축적으로 담습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
