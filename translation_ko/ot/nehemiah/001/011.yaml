source:
  edition: WLC
  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
  footnotes:
  - marker: a
    text: Or 'who desire to revere your name' or 'who delight to stand in awe of your name.'
    reason: lexical_alternative
  - marker: b
    text: Or 'grant him favor before this man.' The Hebrew idiom literally speaks of being given 'for compassion/mercies.'
    reason: lexical_alternative
  - marker: c
    text: '''This man'' refers to the king, whom Nehemiah identifies in the next clause as the one he served as cupbearer.'
    reason: cross_reference
translation:
  language: ko
  text: 부디[a], 주님, 주님의 귀를 기울이셔서 주님의 종의 기도와 주님의 종들 가운데 주님의 이름을 경외하기를 기뻐하는 이들의 기도를 들으시고, 오늘 주님의 종에게 성공을 주시고 이 사람 앞에서 그에게 긍휼을 베풀어 주십시오[b][c]. 나는 왕의 술 맡은 사람이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 이름을 경외하기를 사모하는’ 혹은 ‘주님의 이름 앞에 떨며 서기를 기뻐하는’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그에게 호의를 베풀어 주십시오.’ 히브리어 관용구는 문자적으로는 ‘긍휼/자비를 주다’에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이 사람’은 다음 절에서 네헤미야가 술 맡은 사람으로 섬긴 왕을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 간청하오니
  lexicon: HALOT
  rationale: 간구의 입자이므로 현대 한국어의 자연스러운 청원 표현인 ‘부디’로 옮겨, 간절함을 살리면서도 과도하게 구어적이지 않게 했습니다.
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  english_pob_choice: let your ear be attentive
  chosen_korean: 주님의 귀를 기울이셔서
  alternatives_korean:
  - 주님의 귀가 주의를 기울이게 하시고
  - 주님의 귀가 들으시게 하셔서
  lexicon: HALOT
  rationale: 하나님의 ‘귀’에 대한 의인화된 청취 요청을 한국어의 자연한 관용구인 ‘귀를 기울이시다’로 살렸습니다.
- source_word: וְהַצְלִיחָה נָּא
  english_pob_choice: give success
  chosen_korean: 성공을 주시고
  alternatives_korean:
  - 형통하게 하시고
  - 번성하게 하시고
  lexicon: HALOT
  rationale: הִפְעִיל형의 성공/형통을 뜻하는 동사로, 문맥상 간절한 청원에 맞게 ‘성공을 주시고’로 옮겼습니다.
- source_word: וּתְנֵהוּ לְרַחֲמִים
  english_pob_choice: grant him compassion
  chosen_korean: 그에게 긍휼을 베풀어 주십시오
  alternatives_korean:
  - 그에게 자비를 주십시오
  - 그를 불쌍히 여기게 해 주십시오
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심인 ‘긍휼/자비’의 수혜를 분명히 하되, 한국어에서는 자연스러운 동사구 ‘긍휼을 베풀어 주십시오’로 표현했습니다.
- source_word: הָאִישׁ הַזֶּה
  english_pob_choice: this man
  chosen_korean: 이 사람
  alternatives_korean:
  - 이 사람에게
  - 그 사람
  lexicon: HALOT
  rationale: 지시적이고 다소 거리감 있는 표현을 살려 ‘이 사람’으로 옮겼으며, 바로 다음 절의 왕을 가리키는 연결도 유지했습니다.
theological_decisions:
- issue: עבד을 기도 맥락에서 어떻게 옮길지
  chosen_reading: 종
  alternative_readings:
  - 노예
  - 섬기는 사람
  rationale: 기도에서의 자기 호칭이지만, 본문은 하나님 앞에서의 낮아짐을 분명히 드러내므로 프로젝트 기본어인 ‘종’을 따랐습니다. 동시에 법적 소유 상태를 강조하는 문맥은 아니어서 ‘노예’는 택하지 않았습니다.
  doctrine_reference: Translation philosophy §1; contested bonded-status term policy
- issue: ‘주님’에 대한 직접 호칭의 높임말 처리
  chosen_reading: 주님의 귀를 기울이셔서 / 주님의 종
  alternative_readings:
  - 주님의 귀를 기울여 주십시오
  - 주님의 종의 기도
  rationale: 하나님께 직접 드리는 간구이므로 한국어 합쇼체 안에서 높임 동사와 청원형을 유지해, 본문의 간절한 기도체를 보존했습니다.
  doctrine_reference: Korean target style policy; direct address to God honorifics
