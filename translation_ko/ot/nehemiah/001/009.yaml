  text: 그러나 너희가 내게로 돌아와 내 명령을 지키고 그것을 행하[a]면, 너희의 쫓겨난 자들이 하늘 끝[b]에 있더라도, 거기서 내가 그들을 모아 내가 내 이름을 거하게 하[c]기로 택한 곳으로 그들을 데려오리라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '너희의 쫓겨난 자들' 또는 '너희의 흩어진 자들.'
    reason: alternative_reading
  - marker: b
    text: 히브리어 '하늘 끝'은 가장 먼 거리를 의미하는 관용구이다.
    reason: alternative_reading
  - marker: c
    text: 또는 '내 이름을 거기에 두기로.' 히브리어는 택한 곳에 하나님의 이름이 거한다는 이미지를 유지한다.
    reason: alternative_reading
