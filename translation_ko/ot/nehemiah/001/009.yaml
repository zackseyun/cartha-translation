  source_fidelity: 원문의 조건절(‘그러나/만일 너희가 … 하면’)과 명령을 지키고 행하는 두 동작, 추방·흩어짐의 상태, ‘하늘 끝’의 극단적 거리 관용구, 그리고 그곳에서 모아 택한 곳으로 데려온다는 약속은 대체로 잘 반영되었습니다. 다만 각주 a의 위치가 원문의 נִדַּחֲכֶם(쫓겨난 이들)가 아니라 ‘행하면’에 붙어 있어, 각주의 어휘 대안과 본문 앵커가 불일치합니다. 성소 공식은 ‘내 이름을 그곳에 거하게 하려고’로 옮겨, שׁכן의 거주 이미지를 보존하는 편이 더 자연스럽고 정확합니다.
  naturalness: ‘내 이름을 거하게 하기로 택한 곳’은 수식 관계가 다소 경직됩니다. ‘내 이름을 그곳에 거하게 하려고 내가 택한 곳’은 현대 표준어에서 목적 관계와 ‘그곳’의 지시를 명료하게 드러냅니다. 요청된 합쇼체에 맞추어 하나님의 약속을 ‘데려오겠습니다’로 마무리했습니다.
  terminology: ‘계명’, ‘쫓겨난 이들’, ‘하늘 끝’, ‘거하게 하다’는 성경 문맥과 현대 한국어에서 적절합니다. ‘거하게 하다’는 하나님의 이름에 관한 원문의 의도적인 거주 이미지를 유지하며, 신적 현존의 방식을 과도하게 해석하지 않습니다.
