  text: חֲבֹ֖ל חָבַ֣לְנוּ לָ֑/ךְ וְ/לֹא שָׁמַ֣רְנוּ אֶת הַ/מִּצְוֺ֗ת וְ/אֶת הַֽ/חֻקִּים֙ וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוִּ֖יתָ אֶת מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
  footnotes:
  - marker: a
    text: Or 'We have dealt very corruptly with you.' The Hebrew uses an infinitive absolute with the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Judgments'' may also be rendered ''ordinances'' or ''rules''; the Hebrew term can refer to legal decisions or case laws.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 주님께 크게 악을 행하였고, 주님께서 주님의 종 모세에게 명령하신 계명과 율례와 법규를 지키지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  english_pob_choice: have acted very corruptly
  chosen_korean: 매우 심하게 죄를 지었고
  alternatives_korean:
  - 크게 부패하였고
  - 심히 타락하였고
  - 주님께 매우 부패하게 행하였고
  lexicon: HALOT
  rationale: 히브리어의 부정어적 강조를 살려 단순한 ‘잘못했다’보다 강한 도덕적 붕괴를 드러내되, 한국어에서는 자연스러운 회개 고백 표현으로 옮겼습니다.
- source_word: לָךְ
  english_pob_choice: against you
  chosen_korean: 주님께
  alternatives_korean:
  - 주님을 향해
  - 주님에게
  - 주님께 대하여
  lexicon: HALOT
  rationale: 직역의 ‘대하여’보다, 죄책 고백 문맥에서 위반의 대상이신 하나님께 향한 범죄임을 한국어로 분명하게 보여 주는 표현을 택했습니다.
- source_word: הַמִּצְוֺת ... הַחֻקִּים ... הַמִּשְׁפָּטִים
  english_pob_choice: the commandments, the statutes, and the judgments
  chosen_korean: 계명들과 규례들과 법도들
  alternatives_korean:
  - 명령들과 규례들과 판단들
  - 계명들과 법들과 판결들
  - 명령과 규례와 법도
  lexicon: HALOT
  rationale: 세 개의 서로 다른 율법 용어를 구분하려고 각각 관용적인 한국어 법률·언약 어휘를 대응시켰습니다. ‘법도들’은 משפטים의 재판/판례 뉘앙스를 완전히 풀기보다, 전통적이면서도 ‘규례’와 구별되는 법적 항목으로 유지합니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주님의 종
  - 주의 일꾼
  lexicon: HALOT
  rationale: 모세의 신분은 하나님께 속한 봉사적 호칭이므로 ‘종’이 가장 적절합니다. ‘노예’는 여기서 출신/소유 상태를 강조하는 본문이 아니므로 채택하지 않았습니다.
theological_decisions:
- issue: 율법 삼중 표현의 보존
  chosen_reading: 계명들과 규례들과 법도들
  alternative_readings:
  - 계명들과 규례들과 법규들
  - 명령들과 규례들과 규칙들
  rationale: 히브리어의 세 법률 용어를 서로 다른 한국어 항목으로 유지해, 회개 기도의 언약적·법적 밀도를 평평하게 만들지 않았습니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
