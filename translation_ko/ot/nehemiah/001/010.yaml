base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
  footnotes:
  - marker: a
    text: Or 'ransomed' or 'delivered'; the Hebrew verb carries the sense of securing release by an act of deliverance.
    reason: lexical_alternative
  - marker: b
    text: Or 'mighty hand'; the Hebrew reads literally 'strong hand,' a common expression for God's powerful action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 주님의 종들이며 주님의 백성입니다. 주님께서는 크신 능력과 강한 손으로 그들을 속량하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속량하셨습니다’는 히브리어 פָּדָה의 구속·해방 의미를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강한 손’은 하나님의 능력 있는 행동을 가리키는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  english_pob_choice: But they
  chosen_korean: 그러나 그들은
  alternatives_korean:
  - 그리고 그들은
  - 이제 그들은
  lexicon: HALOT
  rationale: 문맥상 앞선 죄와 추방에도 불구하고 여전히 하나님께 속한 백성임을 대비적으로 되살리므로, 단순한 연결보다 ‘그러나’가 더 적절합니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 주님의 종들
  alternatives_korean:
  - 주님의 노예들
  - 주님의 하인들
  lexicon: HALOT
  rationale: 이 문맥은 신분적 노예 상태보다 언약적 소속을 강조하므로, POB의 ‘servants’를 따라 ‘종들’로 옮기되 현대 한국어에서 자연스럽게 다듬었습니다.
- source_word: פָּדִיתָ
  english_pob_choice: you redeemed
  chosen_korean: 속량하셨습니다
  alternatives_korean:
  - 구원하셨습니다
  - 건져내셨습니다
  - 되사셨습니다
  lexicon: HALOT
  rationale: פדה는 단순한 구조를 넘어 값을 치르거나 속박에서 풀어내는 구원의 뉘앙스를 가지므로, 언약적 해방의 무게를 살릴 수 있는 ‘속량하다’를 선택했습니다.
- source_word: וּבְיָדְךָ הַחֲזָקָה
  english_pob_choice: and by your strong hand
  chosen_korean: 강한 손으로
  alternatives_korean:
  - 능한 손으로
  - 강력한 손으로
  - 주의 강한 손으로
  lexicon: HALOT
  rationale: ‘손’은 하나님의 능동적 역사에 대한 관용적 표현이므로 직역성을 살려 유지했고, ‘강한’은 히브리어 חֲזָקָה를 직접 반영합니다.
theological_decisions:
- issue: 구속 언어의 번역 강도
  chosen_reading: 속량하셨습니다
  alternative_readings:
  - 구원하셨습니다
  - 건져내셨습니다
  - 해방하셨습니다
  rationale: 본문은 단순 구출보다 하나님이 자기 백성을 사서 풀어주시는 언약적 구속을 시사하므로, 그 신학적 울림을 가장 잘 보존하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
