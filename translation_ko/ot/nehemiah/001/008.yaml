  text: זְכָר נָא֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר צִוִּ֛יתָ אֶת מֹשֶׁ֥ה עַבְדְּ/ךָ֖ לֵ/אמֹ֑ר אַתֶּ֣ם תִּמְעָ֔לוּ אֲנִ֕י אָפִ֥יץ אֶתְ/כֶ֖ם בָּ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
  footnotes:
  - marker: a
    text: Or 'If you are unfaithful' or 'If you break faith.'
    reason: lexical_alternative
  - marker: b
    text: Or 'among the nations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 부디 주께서 주의 종 모세에게 명하셔서 말씀하신 그 말씀을 기억해 주십시오. “너희가 내게 신의를 저버리면, 내가 너희를 여러 백성 가운데에 흩겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러 민족 가운데에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘신의를 저버리면’, ‘불성실하면’.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  english_pob_choice: Please remember
  chosen_korean: 부디 … 기억해 주십시오
  alternatives_korean:
  - 기억해 주십시오
  - 기억해 주시옵소서
  lexicon: HALOT
  rationale: זְכָר의 명령형과 נָא의 간청 뉘앙스를 한국어 공손 표현으로 살려, 단순 명령보다 간절한 청원을 드러냈습니다.
- source_word: הַדָּבָר
  english_pob_choice: the word
  chosen_korean: 그 말씀
  alternatives_korean:
  - 그 말
  - 그 일
  lexicon: HALOT
  rationale: 여기서는 모세를 통해 주어진 특정한 하나님의 발언을 가리키므로, 한국어에서는 문맥상 자연스럽고도 직접적인 ‘그 말씀’이 מתאים합니다.
- source_word: תִּמְעָלוּ
  english_pob_choice: If you act unfaithfully
  chosen_korean: 너희가 내게 신의를 저버리면
  alternatives_korean:
  - 너희가 내게 불성실하면
  - 너희가 내게 불충성하면
  - 너희가 내게 배신하면
  lexicon: HALOT
  rationale: מעל의 언약적 ‘신의/믿음을 저버림’ 뉘앙스를 살리기 위해, 단순한 도덕적 위반보다 관계적·언약적 파열을 드러내는 표현을 택했습니다.
- source_word: בָּעַמִּים
  english_pob_choice: among the peoples
  chosen_korean: 여러 백성 가운데에
  alternatives_korean:
  - 여러 민족 가운데에
  - 백성들 가운데에
  lexicon: HALOT
  rationale: עַמִּים의 복수성을 살려 ‘여러 백성’으로 옮겼고, 한국어에서 자연스럽게 위치를 나타내도록 ‘가운데에’를 붙였습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 종인 모세
  - 주의 노예
  lexicon: HALOT
  rationale: 모세에 대한 전통적·문맥적 관계 호칭으로 ‘주의 종’이 적절하며, 이 구절의 의도는 신분적 노예성이 아니라 하나님께 대한 봉사 관계를 강조합니다.
theological_decisions:
- issue: מעל의 언약적 경고를 어떻게 드러낼지
  chosen_reading: ‘신의를 저버리면’으로 번역해 언약 파기의 관계적 의미를 살렸습니다.
  alternative_readings:
  - ‘불성실하면’
  - ‘배신하면’
  - ‘죄를 범하면’
  rationale: 이 말씀은 모세를 통해 주어진 언약 제재를 상기시키므로, 일반적 도덕 실패보다 ‘신의’의 파기를 강조하는 쪽이 본문의 신학적 긴장을 더 정확히 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
