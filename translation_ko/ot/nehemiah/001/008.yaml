    issue: ‘내게’의 첨가
    rationale: תִּמְעָלוּ는 ‘너희가 불성실하게 행하면/신의를 저버리면’이라는 뜻이며, 그 대상이 하나님이라는 언약 문맥은 분명하지만 본문에는 ‘내게’가 명시되어 있지 않습니다. 불필요한 명시화를 피하는 편이 좋습니다.
  - severity: low
