reference: Nehemiah 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
  footnotes:
  - marker: a
    text: Or 'the people of Israel' / 'the Israelites.' The Hebrew reads 'the sons of Israel,' preserving the familial covenant expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 부디 주의 귀는 기울여지고 주의 눈은 열려서, 지금 제가 주 앞에서 날마다 밤낮으로 드리는 주의 종의 기도를 들으시며, 이스라엘 자손—주의 종들—의 죄를 고백하는 저와, 우리가 주께 범한 이스라엘 자손의 죄를 들으소서. 저와 제 아버지의 집도 죄를 지었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהִי נָא ... קַשֶּׁבֶת
  english_pob_choice: Please let your ear be attentive
  chosen_korean: 부디 주의 귀는 기울여지고
  alternatives_korean:
  - 부디 주의 귀는 주의를 기울이시고
  - 부디 주의 귀가 기울어지게 하시고
  lexicon: HALOT
  rationale: 간구문의 정중한 요청을 살리면서, ‘귀’의 의인화와 수동적 상태를 자연스러운 한국어로 옮겼습니다.
- source_word: וְעֵינֶיךָ פְתֻוּחוֹת
  english_pob_choice: and your eyes open
  chosen_korean: 주의 눈은 열려서
  alternatives_korean:
  - 주의 눈은 열려 있고
  - 주의 눈은 열려서
  lexicon: HALOT
  rationale: ‘눈’의 병렬 의인화와 현재적 상태를 보존했고, 동사 연결은 한국어에서 가장 매끄러운 ‘열려서’로 처리했습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 종된 자
  lexicon: HALOT
  rationale: 기도문에서 하나님께 대한 경어적 자기호칭이므로 기본값인 ‘종’을 따랐습니다. 본문 전체의 경건한 호소를 해치지 않으면서도 원문의 종속 관계를 유지합니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 친족-언약적 표현을 살려 직역에 가까운 ‘이스라엘 자손’을 유지했습니다. 이어지는 ‘주의 종들’과 병렬도 잘 맞습니다.
- source_word: וּמִתְוַדֶּה
  english_pob_choice: while confessing
  chosen_korean: 죄를 고백하는
  alternatives_korean:
  - 죄를 고백하며
  - 죄를 고백하면서
  lexicon: HALOT
  rationale: 동시 진행의 분사 의미를 한국어 관형사절로 옮겨, 앞의 기도와 뒤의 고백이 한 흐름임을 드러냈습니다.
- source_word: וַאֲנִי וּבֵית אָבִי
  english_pob_choice: I and my father's house
  chosen_korean: 저와 제 아버지의 집도
  alternatives_korean:
  - 저와 제 아버지의 집이
  - 저와 제 아버지 집안도
  lexicon: HALOT
  rationale: ‘아버지의 집’이라는 성경적 관용구를 보존하면서, 문맥상 자기와 그 가문까지 포함하는 고백을 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘귀’와 ‘눈’의 신체 비유를 그대로 유지할지 여부
  chosen_reading: 신체 비유를 유지해 하나님께서 기도에 주의를 기울이시는 인격적 응답을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘주의 깊게 들으시고 보시며’로 완전히 의역
  rationale: 본문의 간구는 하나님을 인간적 신체로 환원하려는 것이 아니라, 응답의 친밀함과 긴급성을 드러내는 수사입니다. 이를 유지하는 편이 원문 수사와 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: '번역 원칙: 원문 수사 보존, 의인화는 완화하지 않음.'
