  text: וְ/הַ/תּוֹדָ֧ה הַ/שֵּׁנִ֛ית הַ/הוֹלֶ֥כֶת לְ/מ֖וֹאל וַ/אֲנִ֣י אַחֲרֶ֑י/הָ וַ/חֲצִ֨י הָ/עָ֜ם מֵ/עַ֣ל לְ/הַ/חוֹמָ֗ה מֵ/עַל֙ לְ/מִגְדַּ֣ל הַ/תַּנּוּרִ֔ים וְ/עַ֖ד הַ/חוֹמָ֥ה הָ/רְחָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
  footnotes:
  - marker: a
    text: Or 'the second choir of thanksgiving' or 'the second thanksgiving procession.' The Hebrew term can denote a thanksgiving company in a ceremonial procession, not only singing considered in isolation.
    reason: lexical_alternative
translation:
  language: ko
  text: 두 번째 감사 찬양대는 왼쪽으로 가고 있었고, 나는 그 뒤를 따랐습니다. 백성의 절반도 성벽 위를 따라 화덕 망대 위쪽에서부터 넓은 성벽까지 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תּוֹדָה는 단순한 ‘감사’가 아니라, 이 문맥처럼 의례적 행렬에 참여하는 감사 집단이나 찬양대를 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: הַתּוֹדָה
  english_pob_choice: thanksgiving choir
  chosen_korean: 감사 찬양대
  alternatives_korean:
  - 감사대
  - 감사 행렬
  - 감사 노래대
  lexicon: HALOT
  rationale: 본문은 단순한 감사 행위가 아니라 성벽 봉헌 행렬에 속한 조직된 집단을 가리키므로, ‘찬양대’를 써서 집단성과 예전적 기능을 드러냈습니다.
- source_word: לְמוֹאל
  english_pob_choice: to the left
  chosen_korean: 왼쪽으로
  alternatives_korean:
  - 좌편으로
  - 왼편으로
  - 반대편으로
  lexicon: HALOT
  rationale: מוֹאל의 기본 방향 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: אַחֲרֶיהָ
  english_pob_choice: behind it
  chosen_korean: 그 뒤를
  alternatives_korean:
  - 그 뒤에
  - 뒤따라
  - 그 뒤를 따라
  lexicon: HALOT
  rationale: 행진 맥락에서 공간적 추종을 나타내므로, ‘뒤를 따르다’로 자연스럽게 표현했습니다.
- source_word: מִגְדַּל הַתַּנּוּרִים
  english_pob_choice: the Tower of the Ovens
  chosen_korean: 망대
  alternatives_korean:
  - 오븐 망대
  - 화덕 망대
  - 가마 망대
  lexicon: HALOT
  rationale: 지명 요소를 살리되 본문 흐름상 위치 표지로 기능하므로, 개별 명칭은 본문에는 간명하게 ‘망대’로 옮기고 전체 지명을 각주 없이 과도하게 해석하지 않았습니다.
- source_word: הַחוֹמָה הָרְחָבָה
  english_pob_choice: the Broad Wall
  chosen_korean: 넓은 성벽
  alternatives_korean:
  - 넓은 벽
  - 광대한 성벽
  - 브로드 월
  lexicon: HALOT
  rationale: 고유 지명일 가능성이 있지만, 한국어 독자가 즉시 이해할 수 있도록 형용사적 의미를 우선 반영했습니다.
theological_decisions:
- issue: 행렬/찬양 집단의 성격
  chosen_reading: ‘감사 찬양대’로 번역해 예전적 행진 단위를 드러냈습니다.
  alternative_readings:
  - ‘감사 행렬’
  - ‘찬송대’
  - ‘감사대’
  rationale: 히브리어 תּוֹדָה는 단순한 내적 감사보다 공적 예배 행렬에 참여하는 집단을 가리킬 수 있으므로, 본문의 의례적 장면을 보존하는 쪽이 적절합니다.
  doctrine_reference: 예배와 공동체적 감사의 공적 표현
