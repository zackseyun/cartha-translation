  rationale: 첫 구와 동일하게 ל-의 명부적 용법을 속격으로 처리했습니다. 이름은 영어 POB의 Shebaniah에 맞춰 스바냐로 음역했습니다.
- source_word: יוֹסֵֽף
  english_pob_choice: Joseph
  chosen_korean: 요셉
  alternatives_korean:
  - 요세프
  lexicon: HALOT
  rationale: 히브리어 יוֹסֵף의 표준 한국어 표기를 따랐습니다. 영어 POB의 Joseph과 직접 대응하는 익숙한 형태입니다.
theological_decisions:
- issue: 명부에서 ל- 접두사의 의미
  chosen_reading: 대표·대응 관계를 드러내는 소속/속격 표현으로 번역했습니다.
  alternative_readings:
