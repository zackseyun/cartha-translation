  text: 말루기의 요나단, 스바냐의 요셉입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ל־는 이 명부에서 각 이름에 대응하는 대표자를 나타낼 수 있습니다. 따라서 ‘말루기를 대표하여 요나단, 스바냐를 대표하여 요셉’으로도 옮길 수 있습니다. 반대로 이를 계보적 또는 소속 관계로 이해하면 본문처럼 ‘말루기의 … 스바냐의 …’가 됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/מלוכי
  english_pob_choice: for Malluchi
  chosen_korean: 몰루기의
  alternatives_korean:
