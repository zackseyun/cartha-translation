lexical_decisions:
- source_word: ל/מלוכי
  english_pob_choice: for Malluchi
  chosen_korean: 몰루기의
  alternatives_korean:
  - 몰루치를 위한
  - 몰루기에게 속한
  lexicon: HALOT
  rationale: 문맥상 ל-는 명부에서 대응·대표를 나타내므로 소속을 드러내는 속격으로 옮겼습니다. 영어 POB의 Malluchi를 따라 음역은 몰루기로 잡았습니다.
- source_word: יֽוֹנָתָ֔ן
  english_pob_choice: Jonathan
  chosen_korean: 요나단
  alternatives_korean:
  - 여호나단
  lexicon: HALOT
  rationale: 히브리어 인명 יוֹנָתָן의 통용 표기를 따랐습니다. 영어 POB의 Jonathan과 대응되는 현대 한국어 표기는 요나단이 가장 자연스럽습니다.
- source_word: לִ/שְׁבַנְיָ֖ה
  english_pob_choice: for Shebaniah
  chosen_korean: 스바냐의
  alternatives_korean:
  - 스바냐를 위한
  - 스바냐에게 속한
  lexicon: HALOT
  rationale: 첫 구와 동일하게 ל-의 명부적 용법을 속격으로 처리했습니다. 이름은 영어 POB의 Shebaniah에 맞춰 스바냐로 음역했습니다.
- source_word: יוֹסֵֽף
  english_pob_choice: Joseph
  chosen_korean: 요셉
  alternatives_korean:
  - 요세프
  lexicon: HALOT
  rationale: 히브리어 יוֹסֵף의 표준 한국어 표기를 따랐습니다. 영어 POB의 Joseph과 직접 대응하는 익숙한 형태입니다.
theological_decisions:
- issue: 명부에서 ל- 접두사의 의미
  chosen_reading: 대표·대응 관계를 드러내는 소속/속격 표현으로 번역했습니다.
  alternative_readings:
  - ‘몰루치를 위한, 요나단; 스바냐를 위한, 요셉’처럼 목적어적 표현
  - 단순 병렬 인명 나열
  rationale: 영어 POB의 주해처럼 이 ל-는 단순 전치사 ‘for’에만 머물지 않고 족보/제사장 명부의 대응 관계를 나타낼 수 있으므로, 한국어에서는 ‘~의’로 그 관계를 보존했습니다.
  doctrine_reference: 본문 주해상 결정이지 교리 문제는 아닙니다.
