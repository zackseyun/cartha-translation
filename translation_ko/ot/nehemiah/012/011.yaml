id: NEH.12.11
reference: Nehemiah 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יוֹיָדָע֙ הוֹלִ֣יד אֶת יוֹנָתָ֔ן וְ/יוֹנָתָ֖ן הוֹלִ֥יד אֶת יַדּֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/011.yaml
  text: And Joiada fathered Jonathan[a], and Jonathan fathered Jaddua.
  footnotes:
  - marker: a
    text: Some manuscripts and translations read 'Johanan' instead of 'Jonathan.' The Hebrew text used here reads 'Jonathan.'
    reason: alternative_reading
translation:
  language: ko
  text: 여호야다는 요나단을 낳았고, 요나단은 야두아를 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본과 번역본은 여기서 ‘요나단’ 대신 ‘요하난’으로 읽습니다. 여기서는 히브리어 본문을 따라 ‘요나단’으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְ / וְ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리고는
  lexicon: HALOT
  rationale: 족보식 연결을 자연스럽게 이어 주는 단순 접속으로, 영어 POB의 ‘And’를 따라 한국어에서도 가장 투명한 연결어를 사용했습니다.
- source_word: הוֹלִיד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 낳게 했습니다
  - 생기게 했습니다
  lexicon: HALOT
  rationale: 족보 문맥에서 ילד의 사역형은 출산/계승 관계를 간단히 표지하므로, 현대 한국어에서 가장 자연스럽고 간결한 ‘낳았습니다’로 옮겼습니다.
- source_word: יוֹנָתָן
  english_pob_choice: Jonathan
  chosen_korean: 요나단
  alternatives_korean:
  - 요하난
  lexicon: HALOT
  rationale: 주어진 히브리어 철자 יוֹנָתָן에 따라 본문형 이름을 반영해 ‘요나단’으로 옮겼습니다. 영어 주석의 이본 문제는 각주로 처리했습니다.
- source_word: יַדּוּעַ
  english_pob_choice: Jaddua
  chosen_korean: 야두아
  alternatives_korean:
  - 자두아
  lexicon: HALOT
  rationale: 히브리어 고유명사를 현대 음역으로 옮겨, 기존 한국어 성경에서 널리 통용되는 형태와도 맞추어 ‘야두아’를 사용했습니다.
theological_decisions:
- issue: 족보 문장의 서술 방식
  chosen_reading: 이 구절은 단순한 계보 진술로 처리해, 해석적 보충 없이 직선적으로 옮겼습니다.
  alternative_readings:
  - 더 풀어서 ‘아버지가 되었습니다’로 설명적으로 번역
  - 전통적 족보 문체인 ‘낳고/낳았고’로 고어화
  rationale: 원문은 정보 전달 목적의 족보 문장으로, 서술의 단순성과 계보 연결을 그대로 드러내는 것이 가장 충실합니다.
  doctrine_reference: 본문 장르 보존 및 역사 서술의 평이성
- issue: 이름 이본 처리
  chosen_reading: 본문의 히브리어 철자에 따라 ‘요나단’을 본문에 두고, 다른 전승의 ‘요하난’ 가능성은 각주로 표시했습니다.
  alternative_readings:
  - 본문 자체를 ‘요하난’으로 수정
  - 각주 없이 본문만 단정
  rationale: POB의 기준은 주어진 히브리어 본문을 우선하되, 알려진 이본은 숨기지 않는 것입니다. 따라서 본문은 מקור(히브리어 본문)에 맞추고 대안 전승은 각주로 공개합니다.
  doctrine_reference: 본문 비평의 투명성
