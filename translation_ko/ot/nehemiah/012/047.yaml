  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֩ בִּ/ימֵ֨י זְרֻבָּבֶ֜ל וּ/בִ/ימֵ֣י נְחֶמְיָ֗ה נֹֽתְנִ֛ים מְנָי֛וֹת הַ/מְשֹׁרְרִ֥ים וְ/הַ/שֹּׁעֲרִ֖ים דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ וּ/מַקְדִּשִׁים֙ לַ/לְוִיִּ֔ם וְ/הַ/לְוִיִּ֔ם מַקְדִּשִׁ֖ים לִ/בְנֵ֥י אַהֲרֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
  footnotes:
  - marker: a
    text: Or 'the assigned portions' for the singers and gatekeepers.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''the matter of a day on its day,'' that is, what each day required.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the Aaronic priests.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 이스라엘은 스룹바벨의 날들과 느헤미야의 날들에, 노래하는 이들과 문지기들을 위한 몫을 날마다 그에 맞게 주었으며, 레위인들을 위해 구별하였고, 레위인들은 아론의 아들들을 위해 구별하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노래하는 이들과 문지기들에게 배정된 몫’.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘그 날의 일은 그 날에’, 곧 각 날에 필요한 것.'
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아론 계열의 제사장들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  english_pob_choice: And all Israel
  chosen_korean: 모든 이스라엘
  alternatives_korean:
  - 온 이스라엘
  - 이스라엘 모든 백성
  lexicon: HALOT
  rationale: 공동체 전체를 가리키는 집합적 표현을 살리기 위해 ‘모든 이스라엘’로 옮겼습니다.
- source_word: נֹתְנִים מְנָיוֹת
  english_pob_choice: gave the portions
  chosen_korean: 몫을 주었으며
  alternatives_korean:
  - 배정을 주었으며
  - 할당된 몫을 주었으며
  - 분배하였으며
  lexicon: HALOT
  rationale: מְנָיוֹת는 성전 봉사자들에게 돌아가는 배분된 몫을 가리키므로, 자연스러운 한국어로 ‘몫’이 적절합니다.
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  english_pob_choice: the singers and the gatekeepers
  chosen_korean: 노래하는 이들과 문지기들
  alternatives_korean:
  - 노래하는 사람들과 성문지기들
  - 찬양하는 이들과 문지기들
  lexicon: HALOT
  rationale: 성전 봉사 직무를 가리키는 표현이므로 전통 교회 용어를 과도하게 덧씌우지 않고 직역에 가깝게 옮겼습니다.
- source_word: דְּבַר יוֹם בְּיוֹמֹו
  english_pob_choice: as each day required
  chosen_korean: 날마다 그에 맞게
  alternatives_korean:
  - 매일 필요한 대로
  - 날마다 필요한 만큼
  - 그날그날의 요구대로
  lexicon: HALOT
  rationale: ‘그 날의 일은 그 날에’라는 관용구의 뜻을 현대 한국어로 간결하게 풀어, 일별로 필요한 분량이라는 의미를 살렸습니다.
- source_word: וּמַקְדִּשִׁים ... וּמַקְדִּשִׁים
  english_pob_choice: and they set apart ... and the Levites set apart
  chosen_korean: 레위인들을 위해 구별하였고, 레위인들은 아론의 아들들을 위해 구별하였습니다
  alternatives_korean:
  - 레위인들에게 구별하였고, 레위인들은 아론의 아들들에게 구별하였습니다
  - 레위인들을 거룩하게 떼어 두었고, 레위인들은 아론의 아들들을 위해 거룩하게 떼어 두었습니다
  lexicon: HALOT
  rationale: מקדשׁ의 핵심은 ‘거룩하게 따로 떼어 둠/구별함’이므로, 제의적 맥락을 살리되 한국어에서는 ‘구별하다’가 가장 자연스럽습니다.
- source_word: בְּנֵי אַהֲרֹן
  english_pob_choice: the sons of Aaron
  chosen_korean: 아론의 아들들
  alternatives_korean:
  - 아론계 제사장들
  - 아론의 자손들
  lexicon: HALOT
  rationale: 직접적인 혈통 표지인 표현을 유지하여, 제사장 계열을 해석적으로 좁히지 않았습니다.
theological_decisions:
- issue: מַקְדִּשִׁים의 제의적 뉘앙스
  chosen_reading: ‘구별하였습니다’로 옮겨, 단순한 행정적 분배가 아니라 거룩하게 따로 떼어 바치는 의미를 드러냈습니다.
  alternative_readings:
  - ‘주었습니다’
  - ‘헌납하였습니다’
  rationale: 문맥은 성전 봉사와 제사장 몫의 연쇄를 말하므로, קדשׁ의 거룩하게 구별하는 의미를 살려야 합니다. 동시에 한국어 독자가 이해하기 쉽게 과도한 제의용어는 피했습니다.
  doctrine_reference: 성전 봉사와 제사장 몫에 대한 거룩한 구별
