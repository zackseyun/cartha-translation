  text: 미야민[a], 마아댜[b], 빌가[c]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이름은 영어 POB의 표준 음역 ‘Mijamin’에 따라 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 영어 POB는 이 이름의 다른 음역으로 ‘Maadya’를 제시하지만, 본문에는 표준형 ‘Maadiah’에 해당하는 음역을 사용했습니다.
    reason: lexical_alternative
  - marker: c
    text: 어말 -h는 영어 음역 관례를 반영한 것이므로, 한국어 본문에서는 발음상 필요를 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִין
  english_pob_choice: Mijamin
  chosen_korean: 미야민
