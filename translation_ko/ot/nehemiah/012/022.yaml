source:
  edition: WLC
  text: הַ/לְוִיִּם֩ בִּ/ימֵ֨י אֶלְיָשִׁ֜יב יוֹיָדָ֤ע וְ/יוֹחָנָן֙ וְ/יַדּ֔וּעַ כְּתוּבִ֖ים רָאשֵׁ֣י אָב֑וֹת וְ/הַ/כֹּ֣הֲנִ֔ים עַל מַלְכ֖וּת דָּרְיָ֥וֶשׁ הַ/פָּֽרְסִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
  footnotes:
  - marker: a
    text: Hebrew 'heads of fathers’ houses,' a clan or ancestral-household designation.
    reason: cultural_note
  - marker: b
    text: Or 'were written down' / 'were registered.'
    reason: lexical_alternative
  - marker: c
    text: Some English traditions read 'Jonathan' here, but the Hebrew text has 'Johanan.'
    reason: alternative_reading
translation:
  language: ko
  text: 엘리아십, 요야다, 요하난[c], 그리고 야두아의 시대에 레위 사람들은 가문의 우두머리들[a]로 기록되었고[b], 제사장들도 그러했습니다. 이 일은 페르시아 사람 다리오의 통치 때에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘조상들의 집의 우두머리들’이며, 씨족 또는 조상 가문을 가리키는 기술적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘적혀 있었고’ 또는 ‘등록되었고’.
    reason: lexical_alternative
  - marker: c
    text: 일부 영어 전통은 여기서 ‘요나단’으로 읽지만, 히브리어 본문은 ‘요하난’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 직역형 ‘레위인들’도 가능하지만, 본문이 행정·계보 문맥이어서 한국어에서는 구성원을 풀어쓴 ‘레위 사람들’이 자연스럽고, 부족 소속을 분명히 보여 줍니다.
- source_word: כְּתוּבִ֖ים
  english_pob_choice: were recorded
  chosen_korean: 기록되었고
  alternatives_korean:
  - 적혀 있었고
  - 등록되었고
  lexicon: HALOT
  rationale: כתב의 수동 분사는 단순 필기가 아니라 명부에 올려진 상태를 가리키므로, ‘기록되다’가 가장 무난합니다.
- source_word: רָאשֵׁ֣י אָב֑וֹת
  english_pob_choice: heads of fathers’ houses
  chosen_korean: 조상 집의 우두머리들
  alternatives_korean:
  - 조상 가문의 우두머리들
  - 가문 우두머리들
  lexicon: HALOT
  rationale: 이 표현은 기술적 계보 용어이므로, 구조를 살려 ‘조상 집’과 ‘우두머리들’을 유지했습니다.
- source_word: וְ/הַ/כֹּ֣הֲנִ֔ים
  english_pob_choice: and the priests also
  chosen_korean: 제사장들도 그랬습니다
  alternatives_korean:
  - 제사장들도 기록되었고
  - 그리고 제사장들도
  lexicon: HALOT
  rationale: 히브리어는 앞 절의 동사를 공유하는 생략 구조이므로, 한국어에서는 앞 내용을 받아 ‘그랬습니다’로 간명하게 연결했습니다.
- source_word: דָּרְיָ֥וֶשׁ הַ/פָּֽרְסִֽי
  english_pob_choice: Darius the Persian
  chosen_korean: 다리오스, 곧 페르시아 왕
  alternatives_korean:
  - 다리오스 페르시아 사람
  - 페르시아의 다리오스
  lexicon: HALOT
  rationale: ‘הַפָּרְסִי’는 출신 표지이지만 여기서는 통치자를 식별하는 관형적 설명이므로, 한국어에서 의미를 분명히 하되 과도한 반복 없이 ‘곧 페르시아 왕’으로 옮겼습니다.
theological_decisions:
- issue: 행정·계보 문장의 평서형 처리
  chosen_reading: 예언적 강조 없이 단순한 역사 기록으로 읽어, 평서형을 유지했습니다.
  alternative_readings:
  - 문장 끝에 설명을 덧붙여 풀어 쓰는 방식
  - 더 경건한 문체로 높이는 방식
  rationale: 본문은 신학적 논설이 아니라 족보·행정 기록이므로, 원문의 담담한 역사 서술 톤을 보존하는 것이 적절합니다.
  doctrine_reference: 성경 본문의 장르 존중
