theological_decisions:
- issue: מִקֶּדֶם의 시간성 처리
  chosen_reading: ‘옛적부터’로 처리하여 다윗과 아삽의 시대를 가리키는 역사적 회고와 더 넓은 고대성을 함께 드러냈습니다.
  alternative_readings:
  - ‘예로부터’
  - ‘옛날부터’
  - ‘옛부터’
  rationale: 본문은 단순 과거 시점이 아니라 오래된 전승적 관행을 가리키므로, 한국어에서도 오래된 기원을 암시하는 표현을 선택했습니다.
  doctrine_reference: 성전 예배 전통의 연속성
- issue: 예배 대상의 명시
  chosen_reading: ‘하나님께 드리는’으로 옮겨 예배 행위가 하나님을 향한 것임을 분명히 했습니다.
  alternative_readings:
  - ‘하나님께’
  - ‘하나님을 위한’
  rationale: 히브리어의 לְ-전치사는 방향/대상을 나타내므로, 한국어에서 예배의 수직적 방향성을 분명하게 드러내는 것이 본문 의미에 충실합니다.
  doctrine_reference: 예배의 대상성과 경배의 방향성
