source:
  edition: WLC
  text: כִּֽי בִ/ימֵ֥י דָוִ֛יד וְ/אָסָ֖ף מִ/קֶּ֑דֶם ראש הַ/מְשֹׁ֣רְרִ֔ים וְ/שִׁיר תְּהִלָּ֥ה וְ/הֹד֖וֹת לֵֽ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/046.yaml
  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
  footnotes:
  - marker: a
    text: Or 'of old' or 'formerly' for 'from ancient times.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'head of the singers' may also be rendered 'leaders of the singers' or 'chiefs of the singers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 옛날 다윗과 아삽 시대에는 노래하는 이들의 지도자들이 있었고, 하나님께 드리는 찬양과 감사의 노래가 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옛날’은 히브리어 מִקֶּדֶם을 옮긴 것입니다. ‘옛적에’, ‘예로부터’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘노래하는 이들의 지도자들’은 히브리어 ‘노래하는 이들의 머리’라는 집단적 표현을 옮긴 것입니다. ‘우두머리들’ 또는 ‘수장들’로도 번역할 수 있습니다.
    reason: lexical_alternative
