  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
  footnotes:
  - marker: a
    text: Or 'of old' or 'formerly' for 'from ancient times.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'head of the singers' may also be rendered 'leaders of the singers' or 'chiefs of the singers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 다윗과 아삽의 시대에 — 옛적부터 — 노래하는 자들의 우두머리들이 있었고, 하나님께 드리는 찬양의 노래와 감사가 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옛적부터’는 미קֶּדֶם의 시간적 뉘앙스를 살린 표현입니다. 직역하면 ‘고대부터’ 또는 ‘예로부터’가 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘노래하는 자들의 우두머리들’은 히브리어 ‘머리들’의 집단적 용법을 반영한 표현입니다. ‘지도자들’ 또는 ‘수장들’로도 옮길 수 있습니다.
    reason: lexical_alternative
