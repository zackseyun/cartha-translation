source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֗ם יֵשׁ֧וּעַ בִּנּ֛וּי קַדְמִיאֵ֥ל שֵׁרֵבְיָ֖ה יְהוּדָ֣ה מַתַּנְיָ֑ה עַֽל הֻיְּד֖וֹת ה֥וּא וְ/אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
  footnotes:
  - marker: a
    text: Or 'he and his brothers were over the thanksgivings'; the Hebrew may be understood more collectively, though the singular pronoun most naturally points to Mattaniah.
    reason: alternative_reading
  - marker: b
    text: The Hebrew 'thanksgivings' likely refers to liturgical songs or expressions of praise offered in thanksgiving.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 레위 사람들은 예수아, 비누이, 갓미엘, 스레뱌, 유다, 맛다냐였습니다. 그는 형제들과 함께 감사의 노래를 맡았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עַל은 여기서 단순한 ‘위에’가 아니라 담당·감독의 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감사의 노래’는 예배에서 드리는 감사와 찬양의 노래를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 단수 대명사 הוּא는 마지막 이름인 맛다냐를 가리키는 것으로 보는 것이 가장 자연스럽습니다.
    reason: alternative_reading
