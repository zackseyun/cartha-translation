theological_decisions:
- issue: הוּא의 지시 대상
  chosen_reading: '''그는''은 마지막으로 지명된 맛다냐를 가리키는 것으로 읽었습니다.'
  alternative_readings:
  - 목록 전체를 집합적으로 가리키는 것으로 볼 수도 있습니다.
  rationale: 히브리어가 복수 목록 뒤에 단수 대명사로 전환하므로, 가장 자연스러운 문법적 독법을 본문에 반영하고 집합적 독해 가능성은 여지를 남깁니다.
  doctrine_reference: 문법적 모호성은 본문 주해의 범위로 두고, 해석을 과도하게 평준화하지 않습니다.
