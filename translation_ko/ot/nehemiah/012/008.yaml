  source_fidelity: 본문은 레위 사람들의 명단과 맛다냐 및 그의 형제들이 הֻיְּדוֹת에 대한 책임을 맡았다는 뜻을 대체로 충실히 옮겼습니다. 다만 בִּנּוּי의 통상적인 한국어 음역은 ‘빈누이’이며, 단수 대명사의 지시 대상에 관한 각주는 집합적 독해 가능성도 밝혀야 합니다.
  naturalness: 합쇼체 문장과 ‘감사의 노래를 맡았습니다’는 자연스럽습니다. 대명사에 대한 각주 표지를 ‘그는’에 직접 붙이면 독자가 각주의 대상과 문장 구조를 더 쉽게 파악할 수 있습니다.
  terminology: ‘레위 사람들’, ‘감사의 노래’, ‘형제들’은 문맥과 한국어 성서 용례에 적절합니다. 인명 ‘비누이’는 히브리어의 자음군과 일반적인 성서 한국어 표기에 맞추어 ‘빈누이’로 고치는 것이 안전합니다.
