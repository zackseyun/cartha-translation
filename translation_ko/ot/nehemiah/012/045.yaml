source:
  edition: WLC
  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
  footnotes:
  - marker: a
    text: Or 'the duty of cleansing' or 'the duty of purity.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase about 'the singers and the gatekeepers' is elliptical; it likely means that these groups also kept their assigned duties.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들의 하나님의 직분과 정결의 직분을 지켰으며, 노래하는 사람들과 문지기들도 다윗과 그의 아들 솔로몬의 명령에 따라 그렇게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깨끗하게 하는 직분’, ‘순결의 직분’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 생략형으로, ‘노래하는 사람들과 문지기들’도 각자의 맡은 직분을 지켰다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  english_pob_choice: they kept the charge
  chosen_korean: 직분을 지켰으며
  alternatives_korean:
  - 맡은 책임을 지켰으며
  - 직무를 지켰으며
  - 임무를 지켰으며
  lexicon: HALOT
  rationale: שׁמר + מִשְׁמֶרֶת는 맡은 업무를 충실히 수행한다는 관용적 표현이므로, 한국어에서는 ‘직분을 지키다’로 자연스럽게 옮기되 의무의 성격을 유지했습니다.
- source_word: אֱלֹהֵיהֶם
  english_pob_choice: their God
  chosen_korean: 자기들의 하나님
  alternatives_korean:
  - 그들의 하나님
  - 그 하나님
  lexicon: HALOT
  rationale: 히브리어의 소유격 접미사를 살려 공동체가 언약적으로 속한 하나님임을 드러내기 위해 ‘자기들의 하나님’으로 옮겼습니다.
- source_word: וּמִשְׁמֶרֶת הַטָּהֳרָה
  english_pob_choice: the charge of purification
  chosen_korean: 정결의 직분
  alternatives_korean:
  - 정결의 책임
  - 깨끗함의 직분
  - 정결의 의무
  lexicon: HALOT
  rationale: הַטָּהֳרָה는 이 문맥에서 도덕적 ‘순수함’보다 성전 예식의 정결/깨끗함을 가리키므로, 종교적 기능이 드러나는 ‘정결의 직분’으로 번역했습니다.
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  english_pob_choice: as did the singers and the gatekeepers
  chosen_korean: 노래하는 사람들과 문지기들도
  alternatives_korean:
  - 노래하는 사람들과 문지기들도 역시
  - 노래하는 자들과 문지기들도
  - 찬양하는 이들과 문지기들도
  lexicon: HALOT
  rationale: 히브리어는 생략형이어서 이들 집단도 각자의 맡은 직분을 지켰다는 뜻이므로, POB의 해석을 따라 한국어에서는 ‘도’로 연결해 자연스럽게 보완했습니다.
- source_word: שֹׁעֲרִים
  english_pob_choice: gatekeepers
  chosen_korean: 문지기
  alternatives_korean:
  - 성문지기
  - 문지기들
  - 수문장
  lexicon: HALOT
  rationale: 성전 맥락의 고정된 직분을 가리키므로, 현대 한국어에서도 기능이 분명한 ‘문지기’로 옮겼습니다.
- source_word: כְּמִצְוַת
  english_pob_choice: according to the command
  chosen_korean: 명령에 따라
  alternatives_korean:
  - 명령대로
  - 명령을 따라
  - 명령에 맞게
  lexicon: HALOT
  rationale: כְּ + מִצְוָה는 권위 있는 지시를 따른다는 뜻이므로, 다윗과 솔로몬이 성전 봉사를 규정한 권면을 드러내는 ‘명령에 따라’가 적절합니다.
theological_decisions:
- issue: 정결(הַטָּהֳרָה)의 의미 범위
  chosen_reading: 성전 예식과 관련된 정결의 직분으로 이해했습니다.
  alternative_readings:
  - 일반적 도덕적 순결
  - 세정 또는 씻음의 의무
  rationale: 문맥이 레위인과 성전 봉사를 말하므로, 본문은 윤리적 추상 개념보다 예식적 정결을 가리키는 것으로 보는 것이 더 정확합니다.
  doctrine_reference: 구약 성전 예전 문맥
