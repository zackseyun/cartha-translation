  source_fidelity: ‘직분을 지켰다’는 한국어에서 직위·신분을 유지한다는 뜻으로도 읽히며, שׁמר + מִשׁמרת가 뜻하는 ‘맡은 임무를 수행하다’를 충분히 드러내지 못합니다. 또한 ‘정결의 직분’보다 ‘정결을 위한 임무’가 הַטָּהֳרָה의 예식적 정결 관련 기능을 더 자연스럽고 정확하게 전달합니다. 원문의 ‘그들의 하나님’과 다윗 및 그의 아들 솔로몬의 명령이라는 관계는 유지했습니다.
  naturalness: ‘하나님을 섬기는 임무’와 ‘정결을 위한 임무를 수행했습니다’는 현대 표준 한국어의 격식 있는 성경 문체에 자연스럽습니다. 각주 표지를 해당 표현과 생략 구문에 직접 붙여 참조 범위도 분명히 했습니다.
  terminology: מִשׁמרת는 ‘임무’, הַטָּהֳרָה는 성전 예식 문맥을 반영하여 ‘정결’로 옮겼습니다. הַמְשֹׁרְרִים은 ‘노래하는 사람들’, שֹׁעֲרִים은 ‘문지기들’로 유지했습니다. ‘그들의 하나님’은 소유 접미사를 보존하면서 ‘자기들의’보다 자연스럽게 처리했습니다.
