  text: וּ/מֵ/עַ֣ל לְ/שַֽׁעַר אֶ֠פְרַיִם וְ/עַל שַׁ֨עַר הַיְשָׁנָ֜ה וְ/עַל שַׁ֣עַר הַ/דָּגִ֗ים וּ/מִגְדַּ֤ל חֲנַנְאֵל֙ וּ/מִגְדַּ֣ל הַ/מֵּאָ֔ה וְ/עַ֖ד שַׁ֣עַר הַ/צֹּ֑אן וְ/עָ֣מְד֔וּ בְּ/שַׁ֖עַר הַ/מַּטָּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
  footnotes:
  - marker: a
    text: Or 'they stood at the Gate of the Guard.' The Hebrew verb can mean either 'stood' or, in context, 'stopped.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Prison Gate' or 'the Gate of the Watch' for 'the Gate of the Guard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에브라임 문 위로, 옛문 위로, 어문 위로, 하나넬 망대와 백망대 위로, 양문에까지, 그리고 파수문에 섰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לשׁער אפרים은 직역하면 ‘에브라임 문’입니다.
    reason: source_note
  - marker: b
    text: 히브리어 שַׁעַר הַמַּטָּרָה는 문맥상 ‘파수문’으로 옮길 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וּמֵעַל / וְעַל
  english_pob_choice: and above / and by
  chosen_korean: 위로
  alternatives_korean:
  - 위에
  - 위를 지나
  - 곁으로
  lexicon: HALOT
  rationale: 연속된 지형 표지 목록이므로, 각 항목에 붙는 위치 관계를 한국어 ‘위로’로 통일해 자연스러우면서도 상향·통과의 공간감을 살렸습니다.
- source_word: שַׁעַר אֶפְרַיִם
  english_pob_choice: the Gate of Ephraim
  chosen_korean: 에브라임 문
  alternatives_korean:
  - 에브라임 성문
  - 에브라임의 문
  lexicon: HALOT
  rationale: 구문상 ‘에브라임의 문’이 직역이지만, 한국어 지명 관용에 맞게 ‘에브라임 문’으로 간결하게 옮겼습니다.
- source_word: שַׁעַר הַיְשָׁנָה
  english_pob_choice: the Old Gate
  chosen_korean: 옛문
  alternatives_korean:
  - 오래된 문
  - 옛 성문
  lexicon: HALOT
  rationale: 히브리어 형용사적 표현을 ‘옛문’으로 옮겨, 역사적 명칭처럼 읽히는 짧은 지명성을 유지했습니다.
- source_word: שַׁעַר הַדָּגִים
  english_pob_choice: the Fish Gate
  chosen_korean: 어문
  alternatives_korean:
  - 물고기 문
  - 생선 문
  lexicon: HALOT
  rationale: ‘fish’를 한국어로 표준적·간결하게 ‘어’로 옮겨 고유 지명으로서의 기능을 살렸습니다.
- source_word: מִגְדַּל חֲנַנְאֵל / מִגְדַּל הַמֵּאָה
  english_pob_choice: the Tower of Hananel / the Tower of the Hundred
  chosen_korean: 하나넬 망대와 백망대
  alternatives_korean:
  - 하나넬 탑과 백 탑
  - 하나넬 망대와 백의 망대
  lexicon: HALOT
  rationale: מִגְדָּל은 ‘망대’로 옮겨 성곽 표지라는 고유성을 살렸고, ‘백’은 수사의 불확실성을 남긴 채 문자적으로 유지했습니다.
- source_word: שַׁעַר הַצֹּאן
  english_pob_choice: the Sheep Gate
  chosen_korean: 양문
  alternatives_korean:
  - 양 성문
  - 양의 문
  lexicon: HALOT
  rationale: 성문 지명의 한국어 관용을 고려해 ‘양문’으로 옮겼습니다.
- source_word: וְעָמְדוּ
  english_pob_choice: they stood
  chosen_korean: 섰습니다
  alternatives_korean:
  - 멈췄습니다
  - 서 있었습니다
  - 멈추어 섰습니다
  lexicon: HALOT
  rationale: 영어 POB가 ‘stood’로 되돌린 직접 의미를 따라, 이동의 종결과 위치 도달을 함께 드러내는 ‘섰습니다’로 옮겼습니다.
- source_word: שַׁעַר הַמַּטָּרָה
  english_pob_choice: the Gate of the Guard
  chosen_korean: 파수문
  alternatives_korean:
  - 경비문
  - 감옥문
  - 파수의 문
  lexicon: HALOT
  rationale: מַטָּרָה의 경계·경비 의미를 반영하여, 전통적으로도 이해 가능한 ‘파수문’으로 압축했습니다.
