lexical_decisions:
- source_word: אֲמַרְיָה
  english_pob_choice: Amariah
  chosen_korean: 아마랴
  alternatives_korean:
  - 아마리아
  - 아마리야
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역했습니다. 영어 POB의 Amariah를 한국어 표기법에 맞춰 옮기되, 히브리어 어형을 드러내기 위해 끝소리를 반영했습니다.
- source_word: מַלּוּךְ
  english_pob_choice: Malluk
  chosen_korean: 말룩
  alternatives_korean:
  - 말루크
  - 말룩크
  lexicon: HALOT
  rationale: 고유명사는 음역했습니다. 영어 POB가 Malluk을 택한 점을 따라, 끝의 ק 계열 자음을 한국어에서 ‘-크’보다 이름의 관용 음역에 가까운 ‘-ㄱ’으로 처리했습니다.
- source_word: חַטּוּשׁ
  english_pob_choice: Hattush
  chosen_korean: 핫두스
  alternatives_korean:
  - 하투쉬
  - 핫투시
  lexicon: HALOT
  rationale: 고유명사는 음역했습니다. 영어 POB의 Hattush를 기준으로 하되, 한국어 음역 관례상 어말 շ/š 계열을 ‘-스’로 옮겨 발음과 형태를 함께 반영했습니다.
