source:
  edition: WLC
  text: וָ/אַעֲלֶה֙ אֶת שָׂרֵ֣י יְהוּדָ֔ה מֵ/עַ֖ל לַ/חוֹמָ֑ה וָ/אַעֲמִ֡ידָ/ה שְׁתֵּ֣י תוֹדֹת֩ גְּדוֹלֹ֨ת וְ/תַהֲלֻכֹ֤ת לַ/יָּמִין֙ מֵ/עַ֣ל לַ/חוֹמָ֔ה לְ/שַׁ֖עַר הָ/אַשְׁפֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
  footnotes:
  - marker: a
    text: Hebrew 'two great thanksgivings'; the phrase likely refers to organized thanksgiving groups or choirs in procession rather than abstract acts of thanks.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the Dung Gate.' The preposition can be rendered either 'to' or 'toward' in this directional context.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 내가 유다의 지도자들을 성벽 위로 올라오게 했고, 큰 감사 찬양대 두 개와 행렬들을 세웠습니다. 하나는 성벽 위에서 오른쪽으로 가서 분문을 향했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘두 큰 감사들’이지만, 이 구절에서는 추상적 감사 행위보다 행진하는 예배 집단을 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문 전치사는 방향을 나타내며, 이곳에서는 ‘~로’와 ‘~을 향해’ 가운데 모두 가능하므로 본문에서는 방향성을 살린 번역을 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה / שָׂרֵי יְהוּדָה
  english_pob_choice: I brought the leaders of Judah up
  chosen_korean: 내가 유다의 지도자들을 성벽 위로 올라오게 했고
  alternatives_korean:
  - 내가 유다의 방백들을 올라오게 했고
  - 내가 유다의 관리들을 올라오게 했고
  lexicon: HALOT
  rationale: עלה의 사역형은 ‘올라오게 하다’로 살리고, שָׂרֵי יְהוּדָה는 이 문맥에서 왕자보다 ‘지도자들’이 자연스럽습니다.
- source_word: וָאַעֲמִידָה
  english_pob_choice: I appointed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 배치했습니다
  - 세워 두었습니다
  lexicon: HALOT
  rationale: עמד의 사역형은 단순 임명보다 의식적 배치와 세움의 뉘앙스가 있어, 행진 조직을 마련하는 장면에 맞게 ‘세웠습니다’로 옮겼습니다.
- source_word: תוֹדֹת גְּדוֹלֹת
  english_pob_choice: two great thanksgiving choirs
  chosen_korean: 큰 감사 찬양대 두 개
  alternatives_korean:
  - 두 개의 큰 감사대
  - 두 개의 큰 감사 행렬
  - 두 개의 큰 감사 찬양 행렬
  lexicon: HALOT
  rationale: 직역하면 ‘감사들’이지만, 본문이 행진 배치를 말하므로 조직된 예배 집단을 뜻하는 것으로 보고 ‘감사 찬양대’로 풀었습니다.
- source_word: וְתַהֲלֻכֹת
  english_pob_choice: and processions
  chosen_korean: 행렬들을
  alternatives_korean:
  - 행진들을
  - 진행대들을
  - 행진 행렬들을
  lexicon: HALOT
  rationale: הלך 계열 명사는 이동하는 의식 행진을 가리키므로, 한국어에서는 간결하게 ‘행렬들’로 표현했습니다.
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  english_pob_choice: toward the Dung Gate
  chosen_korean: 분문을 향했습니다
  alternatives_korean:
  - 오물문을 향했습니다
  - 분문 쪽으로 갔습니다
  - 분문으로 향했습니다
  lexicon: HALOT
  rationale: אַשְׁפֹּת의 지명은 ‘Dung Gate’에 대응하는 전통적이면서도 직접적인 한국어 표현인 ‘분문’으로 옮기고, ל의 방향성을 ‘향했습니다’로 살렸습니다.
