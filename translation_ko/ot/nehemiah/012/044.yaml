  source_fidelity: 현 번역은 핵심 행정 조치와 ‘율법이 정한 몫’을 대체로 잘 전달합니다. 그러나 לָאֹצָרוֹת(보관물/저장물)를 독립 항목으로 반영하지 않았고, ‘창고들과 헌물과 …을 위해’라는 연결은 원문의 ‘…을 위한 창고들’을 잘못 결속시킬 수 있습니다. 또한 וַיִּפָּקְדוּ는 ‘사람들을 세워’보다 수동형 ‘임명되었습니다’가 원문에 더 충실합니다.
  naturalness: ‘그 창고들과 헌물과 …을 위해’는 한국어에서 무엇을 맡게 했는지 불분명하고 부자연스럽습니다. ‘…을 위한 저장실들을 맡도록 사람들을 임명하였습니다’로 고치면 문장 구조와 행정 문맥이 자연스러워집니다. ‘성읍들의 밭’은 ‘성읍들의 들판’보다 농경지의 의미를 더 자연스럽게 나타냅니다.
  terminology: ‘처음 익은 열매’, ‘십일조’, ‘율법이 정한 몫’, ‘제사장들’, ‘레위 사람들’은 적절합니다. אֹצָרוֹת는 단순히 누락하지 않고 ‘보관물’로 반영하되, 헌물·첫 열매·십일조와의 관계가 혼동되지 않도록 주석에서 설명합니다. הָעֹמְדִים은 성전 직무 수행을 뜻하는 ‘섬기고 있는’으로 옮길 수 있으며, 직역 주석을 유지합니다.
