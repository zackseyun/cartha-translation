  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
  footnotes:
  - marker: a
    text: Or 'the chambers' for 'the storerooms.' The Hebrew term can denote rooms or chambers, but here the storage function is prominent.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the portions of the law,' that is, the shares prescribed by the Torah for the priests and Levites.
    reason: lexical_alternative
  - marker: c
    text: Literally 'who were standing.' In this temple context, the expression refers to standing in attendance, that is, serving or ministering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 사람들은 보관물과 헌물과 처음 익은 열매와 십일조를 위한 저장실들을 맡도록 임명되었습니다.[a] 그들은 성읍들의 밭에서 제사장들과 레위 사람들을 위해 율법이 정한 몫을 그 저장실들에 모아들이도록 임명된 것입니다.[b] 유다가 섬기고 있는 제사장들과 레위 사람들로 말미암아 기뻐하였기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘저장실들’은 ‘방들’ 또는 ‘곁방들’을 뜻할 수도 있지만, 여기서는 보관 기능이 두드러집니다. 이어지는 ‘보관물’은 저장된 물품 또는 ذخ장물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘율법의 몫들’이며, 곧 제사장들과 레위 사람들을 위해 토라가 정한 몫입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘서 있는 자들’입니다. 성전 문맥에서는 직무를 수행하며 섬기는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  english_pob_choice: were appointed
  chosen_korean: 사람들을 세워
  alternatives_korean:
