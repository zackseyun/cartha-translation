revisions:
- from: 그날에 사람들을 세워 그 창고들과 헌물과 처음 익은 열매와 십일조를 위해, 곧 성읍들의 밭에서 율법이 제사장들과 레위 사람들에게 정한 몫을 그 안에 모으게 하였으니, 이는 유다가 섬기고 있는 제사장들과 레위 사람들로 인해 기뻐하였기 때문입니다.[a][b][c]
  to: 그날 사람들은 보관물과 헌물과 처음 익은 열매와 십일조를 위한 저장실들을 맡도록 임명되었습니다.[a] 그들은 성읍들의 밭에서 제사장들과 레위 사람들을 위해 율법이 정한 몫을 그 저장실들에 모아들이도록 임명된 것입니다.[b] 유다가 섬기고 있는 제사장들과 레위 사람들로 말미암아 기뻐하였기 때문입니다.[c]
  rationale: 원문의 네 관련 명사(저장실들, 보관물, 헌물, 처음 익은 열매, 십일조)를 빠뜨리지 않고 반영했습니다. 문장을 둘로 나누어 저장실 관리자의 임명과 그 수집 업무를 명확히 했으며, ‘유다’는 원문의 공동체 명칭을 보존했습니다. 각 주석 표지는 해당 표현 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:40:04Z'
