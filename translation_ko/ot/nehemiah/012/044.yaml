reference: Nehemiah 12:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
  footnotes:
  - marker: a
    text: Or 'the chambers' for 'the storerooms.' The Hebrew term can denote rooms or chambers, but here the storage function is prominent.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the portions of the law,' that is, the shares prescribed by the Torah for the priests and Levites.
    reason: lexical_alternative
  - marker: c
    text: Literally 'who were standing.' In this temple context, the expression refers to standing in attendance, that is, serving or ministering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에 사람들을 세워 그 창고들과 헌물과 처음 익은 열매와 십일조를 위해, 곧 성읍들의 밭에서 율법이 제사장들과 레위 사람들에게 정한 몫을 그 안에 모으게 하였으니, 이는 유다가 섬기고 있는 제사장들과 레위 사람들로 인해 기뻐하였기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘창고들/방들’을 가리킬 수 있으나, 여기서는 저장 기능이 두드러집니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘율법의 몫들’이며, 곧 제사장들과 레위 사람들을 위해 토라가 정한 몫입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘서 있는 자들’입니다. 성전 문맥에서는 대기하며 섬기는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  english_pob_choice: were appointed
  chosen_korean: 사람들을 세워
  alternatives_korean:
  - 임명하였습니다
  - 지정하였습니다
  - 세우게 하였습니다
  lexicon: HALOT
  rationale: 수동적·행정적 지정의 뜻을 살리면서, 현대 한국어에서 자연스러운 공적 표현인 ‘세우다’를 사용했습니다.
- source_word: הַנְּשָׁכוֹת
  english_pob_choice: the storerooms
  chosen_korean: 그 창고들
  alternatives_korean:
  - 그 방들
  - 그 방실들
  - 그 저장실들
  lexicon: HALOT
  rationale: 성전 행정 맥락에서 보관 기능이 분명하므로, 현대 독자가 이해하기 쉬운 ‘창고들’로 옮겼습니다.
- source_word: לַתְּרוּמוֹת / לָרֵאשִׁית / וְלַמַּעַשְׂרוֹת
  english_pob_choice: for the contributions, for the firstfruits, and for the tithes
  chosen_korean: 헌물과 처음 익은 열매와 십일조를 위해
  alternatives_korean:
  - 봉헌물과 첫 열매와 십일조를 위해
  - 예물과 첫 소산과 십일조를 위해
  lexicon: HALOT
  rationale: 세 항목의 제의적 목록을 한국어 교회 전통과 너무 멀어지지 않게 하되, 본문의 행정적·헌납적 성격을 살려 번역했습니다.
- source_word: מְנָאוֹת הַתּוֹרָה
  english_pob_choice: the portions required by the law
  chosen_korean: 율법이 … 정한 몫
  alternatives_korean:
  - 율법이 정한 분깃
  - 율법에 따라 정해진 몫
  - 율법의 몫
  lexicon: HALOT
  rationale: ‘분량/몫’의 분배 의미를 살리되, 제사장과 레위 사람에게 배정된 규정 몫이라는 점을 한국어에서 자연스럽게 드러냈습니다.
- source_word: הָעֹמְדִים
  english_pob_choice: who were serving
  chosen_korean: 섬기고 있는
  alternatives_korean:
  - 서 있는
  - 시중드는
  - 봉사하고 있는
  lexicon: HALOT
  rationale: 성전 문맥에서 ‘서 있다’는 관용적 봉사 의미를 갖기 때문에, POB의 주석적 해석을 따라 기능적 의미인 ‘섬기고 있는’으로 옮겼습니다.
theological_decisions:
- issue: לַתְּרוּמוֹת, לָרֵאשִׁית, וְלַמַּעַשְׂרוֹת의 제의·행정적 성격
  chosen_reading: 헌물, 처음 익은 열매, 십일조를 성전 창고에 모아 율법이 정한 제사장·레위 사람의 몫을 공급하는 행정 조치로 읽었습니다.
  alternative_readings:
  - 단순한 자원봉사적 기부로 약화하는 읽기
  - 일반적 종교 헌금으로만 제한하는 읽기
  rationale: 본문은 신앙적 헌신을 말하면서도 동시에 제도적 분배와 보관을 다루므로, 제의적 의미와 행정적 기능을 함께 유지했습니다.
  doctrine_reference: 구약 성전 제도와 율법의 규정에 대한 본문적 읽기
