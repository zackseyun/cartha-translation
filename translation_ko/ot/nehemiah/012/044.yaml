  - 지정하였습니다
  - 세우게 하였습니다
  lexicon: HALOT
  rationale: 수동적·행정적 지정의 뜻을 살리면서, 현대 한국어에서 자연스러운 공적 표현인 ‘세우다’를 사용했습니다.
- source_word: הַנְּשָׁכוֹת
  english_pob_choice: the storerooms
  chosen_korean: 그 창고들
  alternatives_korean:
  - 그 방들
  - 그 방실들
  - 그 저장실들
  lexicon: HALOT
  rationale: 성전 행정 맥락에서 보관 기능이 분명하므로, 현대 독자가 이해하기 쉬운 ‘창고들’로 옮겼습니다.
- source_word: לַתְּרוּמוֹת / לָרֵאשִׁית / וְלַמַּעַשְׂרוֹת
  english_pob_choice: for the contributions, for the firstfruits, and for the tithes
  chosen_korean: 헌물과 처음 익은 열매와 십일조를 위해
  alternatives_korean:
  - 봉헌물과 첫 열매와 십일조를 위해
  - 예물과 첫 소산과 십일조를 위해
  lexicon: HALOT
  rationale: 세 항목의 제의적 목록을 한국어 교회 전통과 너무 멀어지지 않게 하되, 본문의 행정적·헌납적 성격을 살려 번역했습니다.
- source_word: מְנָאוֹת הַתּוֹרָה
  english_pob_choice: the portions required by the law
  chosen_korean: 율법이 … 정한 몫
  alternatives_korean:
  - 율법이 정한 분깃
  - 율법에 따라 정해진 몫
  - 율법의 몫
  lexicon: HALOT
  rationale: ‘분량/몫’의 분배 의미를 살리되, 제사장과 레위 사람에게 배정된 규정 몫이라는 점을 한국어에서 자연스럽게 드러냈습니다.
- source_word: הָעֹמְדִים
  english_pob_choice: who were serving
  chosen_korean: 섬기고 있는
  alternatives_korean:
  - 서 있는
  - 시중드는
  - 봉사하고 있는
  lexicon: HALOT
  rationale: 성전 문맥에서 ‘서 있다’는 관용적 봉사 의미를 갖기 때문에, POB의 주석적 해석을 따라 기능적 의미인 ‘섬기고 있는’으로 옮겼습니다.
theological_decisions:
- issue: לַתְּרוּמוֹת, לָרֵאשִׁית, וְלַמַּעַשְׂרוֹת의 제의·행정적 성격
  chosen_reading: 헌물, 처음 익은 열매, 십일조를 성전 창고에 모아 율법이 정한 제사장·레위 사람의 몫을 공급하는 행정 조치로 읽었습니다.
  alternative_readings:
