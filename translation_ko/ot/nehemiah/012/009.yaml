base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/009.yaml
  text: And Bakbukiah and Unno[a], their brothers, stood opposite them in the divisions of service.
  footnotes:
  - marker: a
    text: Or possibly, 'and his brothers answered them by divisions,' if וענו is read as a verb rather than the proper name Unno.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 바크부갸와 우노와 그들의 형제들은 정해진 직무의 구분에 따라 그들 맞은편에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그의 형제들은 정해진 직무의 구분에 따라 그들에게 응답했습니다’로 볼 수도 있습니다. 이는 וענו를 고유명사 ‘우노’가 아니라 동사 ‘응답하다’로 읽는 경우입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  english_pob_choice: And Bakbukiah
  chosen_korean: 그리고 바크부갸
  alternatives_korean:
  - 그리고 박북기야
  - 바크부기야
  lexicon: 고유명사 음역
  rationale: 고유명사는 현대 외래어 표기 감각에 맞춰 음역하되, 접속사 וּ는 문맥상 자연스럽게 ‘그리고’로 옮겼습니다.
- source_word: וַעֻנּוֹ
  english_pob_choice: Unno
  chosen_korean: 우노
  alternatives_korean:
  - 그리고 그의 형제들은 응답했습니다
  - 운노
  lexicon: 고유명사 음역 / HALOT
  rationale: 영어 POB의 온omastic 읽기를 따라 인명으로 처리했고, 한국어에서는 두 음절형 음역 ‘우노’가 가장 간결합니다.
- source_word: לְנֶגְדָּם
  english_pob_choice: stood opposite them
  chosen_korean: 그들 앞에
  alternatives_korean:
  - 그들 맞은편에
  - 그들을 마주하여
  lexicon: HALOT
  rationale: 직역하면 ‘맞은편’이지만, 한국어에서는 이어지는 위치 관계를 자연스럽게 하여 ‘그들 앞에’로 옮기되 대립적 뉘앙스를 유지했습니다.
- source_word: לְמִשְׁמָרוֹת
  english_pob_choice: in the divisions of service
  chosen_korean: 직무의 구분에 따라
  alternatives_korean:
  - 섬김의 분반으로
  - 봉사의 반열에 따라
  lexicon: HALOT
  rationale: מִשְׁמָרוֹת는 단순한 ‘경비’보다 성전 봉사의 조직된 배치를 가리키므로, ‘직무의 구분’으로 풀어 의미를 드러냈습니다.
theological_decisions:
- issue: 본문의 מִשְׁמָרוֹת를 성전 봉사 조직으로 어떻게 표현할지
  chosen_reading: 성전에서 정해진 직무 배치를 가리키는 말로 이해하여 ‘직무의 구분’으로 번역했습니다.
  alternative_readings:
  - ‘경계’나 ‘파수’로 좁게 번역
  - ‘반차’로 전통 교회어를 사용
  rationale: 문맥이 레위인들의 예배 질서와 명단 배치를 다루므로, 군사적 의미보다 성전 봉사의 조직성을 드러내는 표현이 본문의 의도를 더 잘 보존합니다.
  doctrine_reference: 성전 봉사 질서와 레위 직무에 관한 역사서적 문맥
