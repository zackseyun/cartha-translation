- issue: 반복되는 ל의 의미를 ‘for’로 본 영어 POB의 해석을 어떻게 한국어로 반영할지
  chosen_reading: 각 이름 앞에 ‘이에’를 두어 목록 속 대표 표지라는 기능을 드러냈습니다.
  alternative_readings:
