  - ‘~의’로 소속 표시
  rationale: 이 절은 신학적 진술보다 제사장 명단의 구조가 핵심이므로, 관계의 기능을 지나치게 특정하지 않으면서도 목록적 대응을 살리는 쪽을 택했습니다.
  doctrine_reference: 본문의 목록 구조와 명단 기능
- issue: 두 번째 항목의 이름 순서를 영어 POB처럼 유지할지
  chosen_reading: 원문의 배열을 따라 ‘Iddo/Zechariah; Ginnethon/Meshullam’의 대응 관계를 유지했습니다.
  alternative_readings:
  - 한국어 관습에 맞게 이름 순서를 재배열
  - 의미를 풀어 ‘Iddo의 대표는 스가랴’로 의역
  rationale: 히브리어는 간결한 대응 목록이므로, 읽기 쉽도록 다듬되 짝을 이루는 구조는 보존했습니다.
  doctrine_reference: 본문 배열 보존 원칙
