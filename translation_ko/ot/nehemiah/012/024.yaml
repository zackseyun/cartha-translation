    issue: 각주 a가 하사비아 뒤에 붙어 있으나, 해당 각주의 내용은 לְנֶגְדָּם(‘그들 맞은편에/그들과 대응하여’)에 관한 것입니다.
    rationale: 각주 앵커는 설명하는 본문 표현에 직접 붙어야 하며, 인명에 붙이면 원문 대응 및 독자 이해가 모두 왜곡됩니다.
