  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
  footnotes:
  - marker: a
    text: Or “facing them” or “corresponding to them.” The phrase likely describes opposing or matching Levitical groups in worship.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “watch corresponding to watch,” probably referring to matched service divisions or alternating liturgical stations.'
    reason: cultural_note
translation:
  language: ko
  text: 레위 사람의 두목들은 하사비아[a], 세레비아, 그리고 kadmiel 의 아들 여수아이며, 그 형제들이 그들 맞은편에 서서 하나님 사람 다윗의 명령에 따라 찬양하고 감사하며, 각기 교대하여 지키는 직분을 수행하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "그들 맞은편" 또는 "그들과 대응하는 것". 이 구절은 예배에서 서로 마주하거나 대응하는 레위 집단을 묘사한 것으로 보입니다.
    reason: alternative_reading
  - marker: b
    text: '히브리어: "각기 교대하여 지키는 것", 아마도 교대된 봉사 부서나 번갈아 가며 예배를 드리는 직분을 가리킵니다.'
    reason: alternative_reading
