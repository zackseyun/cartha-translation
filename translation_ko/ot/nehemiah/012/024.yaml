  terminology: 레위 사람들, 하사뱌, 세레뱌, 예수아, 카드미엘, 하나님의 사람 등의 표기는 한국어 성경 문체와 원어 음역 원칙에 맞게 정리했습니다. ‘그들의 형제들’은 אֲחֵיהֶם의 남성 복수 친족 표현을 보존합니다.
