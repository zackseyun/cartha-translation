- from: 레위 사람의 두목들은 하사비아[a], 세레비아, 그리고 kadmiel 의 아들 여수아이며, 그 형제들이 그들 맞은편에 서서 하나님 사람 다윗의 명령에 따라 찬양하고 감사하며, 각기 교대하여 지키는 직분을 수행하였습니다.[b]
  to: 레위 사람들의 우두머리들은 하사뱌와 세레뱌와 카드미엘의 아들 예수아였으며, 그들의 형제들은 그들 맞은편에서[a] 하나님의 사람 다윗의 명령에 따라 찬양하고 감사하였습니다. 근무 조는 근무 조에 대응하였습니다.[b]
  rationale: 인명과 조사 표기를 바로잡고, 각주 a를 실제로 설명하는 ‘그들 맞은편에서’에 옮겼습니다. 마지막 히브리어 구절은 교대 예배라는 해석을 본문에 넣지 않고, ‘근무 조는 근무 조에 대응하였다’로 반복과 타원성을 보존했습니다. 두 절로 나누어 한국어의 자연스러운 문장 구조를 확보하되, 원문의 의미를 추가하지 않았습니다.
