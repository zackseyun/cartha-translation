    text: 또는 ‘샘의 문’. 히브리어의 이 말은 샘이나 물의 근원을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다윗 성의 오르막’. 히브리어는 계단이라는 건축물을 가리킬 수도 있고, 더 넓게는 오르막을 가리킬 수도 있습니다.
    reason: lexical_alternative
