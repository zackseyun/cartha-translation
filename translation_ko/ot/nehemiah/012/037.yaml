  text: 그들은 샘문[a] 곁에서 그들 맞은편으로 다윗 성의 계단[b]을 올라가, 성벽으로 올라가는 곳에서 다윗의 집 위쪽을 지나 동쪽의 물문까지 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
