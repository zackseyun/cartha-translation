id: NEH.12.27
reference: Nehemiah 12:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ/חֲנֻכַּ֞ת חוֹמַ֣ת יְרוּשָׁלִַ֗ם בִּקְשׁ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל מְק֣וֹמֹתָ֔/ם לַ/הֲבִיאָ֖/ם לִֽ/ירוּשָׁלִָ֑ם לַ/עֲשֹׂ֨ת חֲנֻכָּ֤ה וְ/שִׂמְחָה֙ וּ/בְ/תוֹד֣וֹת וּ/בְ/שִׁ֔יר מְצִלְתַּ֖יִם נְבָלִ֥ים וּ/בְ/כִנֹּרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
  footnotes:
  - marker: a
    text: Or 'they looked for the Levites' or, contextually, 'they summoned the Levites.' The Hebrew verb primarily means 'sought.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'to do a dedication.'
    reason: lexical_alternative
  - marker: c
    text: The exact distinction between the instruments rendered 'harps' and 'lyres' is uncertain; the Hebrew names two different stringed instruments.
    reason: cultural_note
translation:
  language: ko
  text: 예루살렘 성벽의 봉헌 때에, 그들은 그들이 있는 모든 곳에서 레위 사람들을 찾아 예루살렘으로 데려와, 기쁨과 감사와 노래로 심벌즈와 비파와 수금을 사용하여 봉헌식을 거행하게 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֲנֻכָּה는 ‘봉헌’ 또는 문맥상 ‘봉헌식’을 뜻합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 직역하면 ‘봉헌을 하다’라고 표현합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 서로 다른 두 현악기 이름을 나란히 제시합니다. ‘비파’와 ‘수금’의 정확한 현대 악기 대응은 확정되지 않았습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְשׁוּ
  english_pob_choice: they sought
  chosen_korean: 그들은 …를 찾아
  alternatives_korean:
  - 그들은 …를 구했습니다
  - 그들은 …를 불러모았습니다
  lexicon: HALOT
  rationale: בקשׁ의 핵심 의미인 ‘찾다/구하다’를 살리되, 문맥상 레위 사람들을 소집해 데려오는 뜻이 자연스럽게 드러나도록 처리했습니다.
- source_word: מִכָּל מְקֹמֹתָם
  english_pob_choice: from all their places
  chosen_korean: 모든 거처에서
  alternatives_korean:
  - 그들의 모든 장소에서
  - 그들이 머무는 모든 곳에서
  lexicon: HALOT
  rationale: מקום은 넓게 ‘장소’이지만 여기서는 레위 사람들이 흩어져 머물던 거주/체류지를 가리키므로, 한국어로는 ‘거처’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: לַעֲשֹׂת חֲנֻכָּה
  english_pob_choice: to celebrate the dedication
  chosen_korean: 그 봉헌을 지키게
  alternatives_korean:
  - 그 봉헌을 기념하게
  - 그 봉헌을 행하게
  lexicon: HALOT
  rationale: 직역하면 ‘봉헌을 하다’이지만 한국어에서는 행사성 의미를 살려 ‘지키다/기념하다’가 자연스럽습니다. 다만 본문이 단순한 축하가 아니라 예식을 수행하는 뉘앙스도 있어 ‘지키게’로 잡았습니다.
- source_word: וּבְתוֹדוֹת
  english_pob_choice: with thanksgivings
  chosen_korean: 감사와 함께
  alternatives_korean:
  - 감사제와 함께
  - 감사 기도와 함께
  lexicon: HALOT
  rationale: תודות는 복수형 ‘감사들/감사 표현들’로, 예배 맥락에서 한국어는 복수형을 살리기보다 ‘감사와 함께’로 자연스럽게 옮기는 편이 적절합니다.
- source_word: נְבָלִים וּבְכִנֹּרוֹת
  english_pob_choice: harps and lyres
  chosen_korean: 비파와 수금과 함께
  alternatives_korean:
  - 하프와 리라와 함께
  - 비파와 하프와 함께
  lexicon: HALOT
  rationale: 두 악기는 서로 다른 현악기이므로 구별을 유지해야 합니다. 한국어 성경 전통에서 נבל은 비파, כינור은 수금으로 널리 구별되므로 이를 따랐습니다.
theological_decisions:
- issue: חֲנֻכָּה의 예식 성격
  chosen_reading: ‘봉헌’으로 옮기되, 단순한 축하가 아니라 성벽을 하나님께 드리는 공적 예식이라는 점이 드러나게 했습니다.
  alternative_readings:
  - ‘헌당’
  - ‘봉헌식’
  rationale: 본문은 성벽 완공 후의 예식적 헌정 행사이며, ‘봉헌’이 가장 직접적으로 원의를 보존합니다. ‘봉헌식’도 가능하지만 명사적 핵심을 유지하는 편이 본문에 더 가깝습니다.
  doctrine_reference: 예루살렘 성벽의 헌정/구별 예식
- issue: 행위의 병렬 구조
  chosen_reading: ‘기쁨과 함께, 감사와 함께, 노래와 함께’로 반복 구조를 살려 예식의 공동체적·예배적 성격을 드러냈습니다.
  alternative_readings:
  - ‘기쁘고 감사하며 노래하며’
  - ‘기쁨과 감사와 노래로’
  rationale: 히브리어의 전치사 반복은 단순한 수식이 아니라 의도적 리듬과 강조를 형성합니다. 한국어에서도 반복을 유지해 의식의 풍성함을 보존했습니다.
  doctrine_reference: 예배의 공동체적 감사와 기쁨
