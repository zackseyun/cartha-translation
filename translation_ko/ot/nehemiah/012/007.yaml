id: NEH.12.7
reference: Nehemiah 12:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
  footnotes:
  - marker: a
    text: Or 'leaders of the priests.' The Hebrew literally says 'heads of the priests.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their kinsmen' or 'their fellow priests.' The Hebrew reads 'their brothers.'
    reason: lexical_alternative
  - marker: c
    text: Jeshua is the postexilic form of the name also related to 'Joshua.'
    reason: cultural_note
translation:
  language: ko
  text: 스알루, 암옥, 힐기야, 여다야—이들은 예수아의 시대에 제사장들의 우두머리와 그 형제들이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우두머리’는 히브리어 직역 ‘머리들’의 자연스러운 한국어 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 형제들’은 문자적으로는 ‘그들의 형제들’이지만, 한국어에서는 중복 소유를 줄여 자연스럽게 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 예수아는 포로기 이후의 이름 형태로, 더 긴 형태인 여호수아와 관련됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: סַלּוּ / עָמוֹק / חִלְקִיָּה / יְדַעְיָה
  english_pob_choice: Sallu, Amok, Hilkiah, Jedaiah
  chosen_korean: 스알루, 암옥, 힐기야, 여다야
  alternatives_korean:
  - 살루, 아목, 힐키야, 여다야
  - 스알루, 아목, 힐기야, 여다야
  lexicon: WLC; 고유명사 표기 관행
  rationale: 열거된 인명은 번역하지 않고 음역해야 하므로, 히브리어 이름들을 현대 한국어 외래어 표기 관행에 맞게 옮겼습니다. 힐기야는 한국어 성경권에서 널리 쓰이는 형태를 반영했습니다.
- source_word: רָאשֵׁי הַכֹּהֲנִים
  english_pob_choice: heads of the priests
  chosen_korean: 제사장들의 우두머리
  alternatives_korean:
  - 제사장들의 머리들
  - 제사장들의 지도자들
  lexicon: HALOT
  rationale: 직역상 ‘머리들’이지만 한국어에서는 관용적으로 ‘우두머리’가 자연스럽고, 단순한 직역보다 지위를 드러내면서도 ‘chief priests’ 같은 후대의 제도적 용어는 피할 수 있습니다.
- source_word: וַאֲחֵיהֶם
  english_pob_choice: and their brothers
  chosen_korean: 그 형제들
  alternatives_korean:
  - 그들의 형제들
  - 그 친족들
  - 그 동료 제사장들
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미인 ‘형제들’을 살리되, 한국어에서는 소유 대명사를 중복하지 않고 문맥상 자연스럽게 정리했습니다. 친족이나 동료 제사장으로 확장하지 않았습니다.
- source_word: בִּימֵי יֵשׁוּעַ
  english_pob_choice: in the days of Jeshua
  chosen_korean: 예수아의 시대에
  alternatives_korean:
  - 예수아의 날들에
  - 예수아 때에
  lexicon: HALOT
  rationale: 히브리어 관용구 בִּימֵי는 ‘~의 때/시대에’로 옮기는 것이 자연스럽습니다. 예수아는 포로기 이후 인명으로, 여호수아와 구별되는 형태를 반영했습니다.
theological_decisions:
- issue: רָאשֵׁי הַכֹּהֲנִים의 위상 표현
  chosen_reading: 제사장들의 우두머리
  alternative_readings:
  - 대제사장들
  - 제사장들의 지도자들
  rationale: 본문은 제사장 집단 내 선도적 인물들을 가리키지만, 후대의 기술적 직분명인 ‘대제사장들’로 좁히면 원문의 범위를 넘어설 수 있습니다.
  doctrine_reference: 역사서 본문 번역 원칙
