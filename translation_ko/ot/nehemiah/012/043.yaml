id: NEH.12.43
reference: Nehemiah 12:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ בַ/יּוֹם הַ֠/הוּא זְבָחִ֨ים גְּדוֹלִ֜ים וַ/יִּשְׂמָ֗חוּ כִּ֤י הָ/אֱלֹהִים֙ שִׂמְּחָ/ם֙ שִׂמְחָ֣ה גְדוֹלָ֔ה וְ/גַ֧ם הַ/נָּשִׁ֛ים וְ/הַ/יְלָדִ֖ים שָׂמֵ֑חוּ וַ/תִּשָּׁמַ֛ע שִׂמְחַ֥ת יְרוּשָׁלִַ֖ם מֵ/רָחֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
  footnotes:
  - marker: a
    text: Or, 'they sacrificed great sacrifices.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'God had given them great joy.' The Hebrew more literally says that God caused them to rejoice with great joy.
    reason: lexical_alternative
  - marker: c
    text: Or, 'the wives and the children,' since the Hebrew word can mean either 'women' or 'wives' depending on context.
    reason: lexical_alternative
  - marker: d
    text: Or, 'was heard from afar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 그들은 큰 희생제물들을 드리고[a] 기뻐했습니다. 이는 하나님께서 그들을 크게 기쁘게 하셨기 때문입니다[b]. 또한 여자들[c]과 아이들도 기뻐했습니다. 예루살렘의 기쁨은 멀리서 들렸습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 큰 희생제물들을 바쳤습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하나님께서 그들에게 큰 기쁨을 주셨습니다.’ 히브리어는 더 문자적으로 ‘하나님께서 그들을 큰 기쁨으로 기뻐하게 하셨다’고 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘아내들’. 히브리어 단어는 문맥에 따라 ‘여자들’이나 ‘아내들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘먼 곳에서 들렸습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים גְּדוֹלִים
  english_pob_choice: they offered great sacrifices
  chosen_korean: 큰 제물을 바치며
  alternatives_korean:
  - 큰 희생제물을 드리며
  - 큰 제사를 드리며
  lexicon: HALOT
  rationale: זבח는 제의적 ‘희생/제물 바침’을 뜻하므로, 현대 한국어에서는 자연스럽고 소스 의미를 살리는 ‘제물을 바치다’로 옮겼습니다.
- source_word: וַיִּשְׂמָחוּ
  english_pob_choice: rejoiced
  chosen_korean: 기뻐했습니다
  alternatives_korean:
  - 즐거워했습니다
  - 환호했습니다
  lexicon: HALOT
  rationale: שׂמח의 반복을 살리기 위해 기본 의미인 기쁨/즐거움을 일관되게 반영했습니다.
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  english_pob_choice: had made them rejoice with great joy
  chosen_korean: 그들에게 큰 기쁨으로 기뻐하게 하셨기 때문입니다
  alternatives_korean:
  - 그들에게 큰 기쁨을 주셨기 때문입니다
  - 그들을 크게 기쁘게 하셨기 때문입니다
  lexicon: HALOT
  rationale: 피엘의 사역적 힘과 동사-명사 반복을 함께 살리기 위해 ‘기뻐하게 하다/큰 기쁨’의 구조를 유지했습니다.
- source_word: הַנָּשִׁים וְהַיְלָדִים
  english_pob_choice: the women and the children
  chosen_korean: 여자들과 아이들도
  alternatives_korean:
  - 여인들과 아이들도
  - 아내들과 아이들도
  lexicon: HALOT
  rationale: 문맥상 ‘wives’로 한정할 근거가 없으므로, 보다 넓은 뜻의 ‘여자들’을 유지했습니다. ‘아이들’은 יְלָדִים의 자연스러운 대응입니다.
- source_word: וַתִּשָּׁמַע שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק
  english_pob_choice: the joy of Jerusalem was heard from far away
  chosen_korean: 예루살렘의 기쁨은 먼 곳에서도 들렸습니다
  alternatives_korean:
  - 예루살렘의 기쁨은 멀리서 들렸습니다
  - 예루살렘의 환희는 멀리서 들렸습니다
  lexicon: HALOT
  rationale: 수동형 ‘들리다’를 살리면서, מֵרָחוֹק은 현대 한국어로 자연스러운 ‘먼 곳에서도’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 기쁨의 원인성
  chosen_reading: 하나님이 그들에게 기뻐하게 하신 것이 공동체의 기쁨의 직접 원인으로 제시됩니다.
  alternative_readings:
  - 하나님이 그들에게 큰 기쁨을 주셨습니다
  - 그들은 하나님 안에서 기뻐했습니다
  rationale: 히브리어 פִּיעֵל שִׂמְּחָם는 단순 상태가 아니라 하나님이 그들을 기쁘게 하신 사역적 인과를 나타내므로, 이를 약화하지 않고 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 공동체의 범위
  chosen_reading: 여자들과 아이들도 포함해 공동체 전체의 기쁨을 드러냅니다.
  alternative_readings:
  - 가족들도 기뻐했습니다
  - 온 백성도 기뻐했습니다
  rationale: 원문이 별도로 ‘여자들’과 ‘아이들’을 언급하므로, 이를 일반화하지 않고 그대로 유지해 공동체의 폭을 드러냈습니다.
  doctrine_reference: Translation philosophy §4
