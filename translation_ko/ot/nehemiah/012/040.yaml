source:
  edition: WLC
  text: וַֽ/תַּעֲמֹ֛דְנָה שְׁתֵּ֥י הַ/תּוֹדֹ֖ת בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים וַ/אֲנִ֕י וַ/חֲצִ֥י הַ/סְּגָנִ֖ים עִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/040.yaml
  text: So the two thanksgiving choirs took their stand in the house of God[a], and I, and half of the officials with me,
  footnotes:
  - marker: a
    text: Hebrew literally, 'the two thanksgivings.' In context this refers to the two thanksgiving groups or choirs.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 감사 찬양대 두 무리가 하나님의 집에 자리를 잡고 섰으며, 나와 내 곁에 있던 관리들 중 절반도 그곳에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘두 감사’입니다. 문맥상 이는 두 감사 집단 또는 찬양대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  english_pob_choice: took their stand
  chosen_korean: 서고
  alternatives_korean:
  - 섰고
  - 자리를 잡고 섰고
  lexicon: HALOT
  rationale: 두 여성형 복수 동사의 진행성을 살리면서, 예식적 배치의 의미를 자연스럽게 드러내기 위해 간결하게 ‘서고’로 옮겼습니다.
- source_word: שְׁתֵּי הַתּוֹדֹת
  english_pob_choice: the two thanksgiving choirs
  chosen_korean: 두 감사 무리
  alternatives_korean:
  - 두 감사
  - 두 감사의 행렬
  - 두 감사 찬양대
  lexicon: HALOT
  rationale: 직역하면 ‘두 감사’이지만 문맥상 조직된 두 집단을 가리키므로, 영어 POB의 설명적 선택을 반영하되 한국어에서는 성경적이고 덜 현대적 제도를 암시하는 ‘무리’로 표현했습니다.
- source_word: בְּבֵית הָאֱלֹהִים
  english_pob_choice: in the house of God
  chosen_korean: 하나님의 집에
  alternatives_korean:
  - 하나님의 집 안에
  - 하나님의 성전에
  - 하나님의 집에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직접 살려 ‘하나님의 집’으로 옮기되, 전치사 בְּ는 문맥상 위치를 나타내는 ‘-에’로 자연스럽게 처리했습니다.
- source_word: וַחֲצִי הַסְּגָנִים
  english_pob_choice: and half of the officials
  chosen_korean: 나와 함께 한 관리들의 절반도
  alternatives_korean:
  - 관리들의 절반도 나와 함께
  - 관리자들의 절반도
  - 지도자들의 절반도
  lexicon: HALOT
  rationale: סגנים은 일반적으로 행정 관료를 가리키므로 ‘관리들’이 무난하며, 종속 관계를 한국어 어순에 맞게 풀어 ‘나와 함께 한’으로 옮겼습니다.
theological_decisions:
- issue: תּוֹדוֹת의 의미를 단순 추상명사로 둘지, 예식적 집단으로 볼지
  chosen_reading: 문맥상 실제로 움직이고 선 두 조직된 감사 집단으로 이해하여 ‘감사 무리’로 번역했습니다.
  alternative_readings:
  - ‘두 감사’
  - ‘두 감사 행렬’
  rationale: 느헤미야 12장의 행진·제의 문맥에서는 추상명사보다 집단 지칭으로 읽는 것이 독자의 이해를 돕고, 본문이 말하는 예식적 실제를 더 잘 반영합니다.
  doctrine_reference: Nehemiah 12:31-40 문맥상의 예전 묘사
