  text: אֵ֕לֶּה בִּ/ימֵ֛י יוֹיָקִ֥ים בֶּן יֵשׁ֖וּעַ בֶּן יוֹצָדָ֑ק וּ/בִ/ימֵי֙ נְחֶמְיָ֣ה הַ/פֶּחָ֔ה וְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סּוֹפֵֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
  footnotes:
  - marker: a
    text: 'Or ''and Ezra the priest-scribe.'' The Hebrew gives Ezra two appositional titles: ''the priest'' and ''the scribe.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 여호야김 곧 예수아의 아들, 요사닥의 아들의 시대와, 네헤미야 총독의 시대와 제사장 겸 서기관 에스라의 시대에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제사장 겸 서기관 에스라.” 히브리어는 에스라에게 “제사장”과 “서기관”이라는 두 개의 동격 칭호를 붙입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי / וּבִימֵי
  english_pob_choice: in the days of / and in the days of
  chosen_korean: “~의 시대에”
  alternatives_korean:
  - “~의 날에”
  - “~의 때에”
  - “~ 동안”
  lexicon: HALOT
  rationale: 히브리어 관용구 בִּימֵי를 한국어에서는 연대기적 범위를 자연스럽게 드러내는 “~의 시대에”로 옮겨, 반복되는 시간표현의 구조를 살렸습니다.
- source_word: הַפֶּחָה
  english_pob_choice: the governor
  chosen_korean: “총독”
  alternatives_korean:
  - “지사”
  - “도지사”
  - “총독관”
  lexicon: HALOT
  rationale: פֶּחָה는 페르시아 제국 행정 아래의 지방 통치자를 가리키므로, 한국어에서는 가장 직접적인 대응인 “총독”을 택했습니다.
- source_word: הַכֹּהֵן הַסֹּפֵר
  english_pob_choice: the priest, the scribe
  chosen_korean: “제사장 겸 서기관”
  alternatives_korean:
  - “제사장이며 서기관”
  - “제사장, 서기관”
  - “제사장과 서기관”
  lexicon: HALOT
  rationale: 두 개의 병렬 수식어를 모두 살리되, 한 인물의 이중 직분임을 분명히 하기 위해 한국어에서는 “겸”을 사용했습니다. 이로써 영어 본문의 ‘the priest, the scribe’와 같은 apposition을 유지합니다.
- source_word: יוֹיָקִים בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  english_pob_choice: Joiakim son of Jeshua, son of Jozadak
  chosen_korean: “여호야김 곧 예수아의 아들, 요사닥의 아들”
  alternatives_korean:
  - “여호야김, 예수아의 아들, 요사닥의 아들”
  - “여호야김, 예수아의 아들이며 요사닥의 아들”
  lexicon: HALOT
  rationale: 족보적 연결을 보존하면서도 한국어 독자가 관계를 즉시 파악하도록 “곧”을 넣어 동격 설명을 자연스럽게 풀었습니다.
theological_decisions:
- issue: 제사장과 서기관의 이중 호칭을 어떻게 표기할지
  chosen_reading: 한 인물에게 주어진 두 직함으로 이해하여 “제사장 겸 서기관”으로 번역했습니다.
  alternative_readings:
  - “제사장, 서기관”으로 단순 병렬 표기
  - “제사장과 서기관”으로 분리 표기
  rationale: 히브리어는 동일 인물 에스라에게 두 개의 동격 칭호를 붙입니다. 한국어에서도 인물 분리를 피하고 직분의 중첩을 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문 해석/직분 표기
