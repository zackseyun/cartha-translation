  source_fidelity: 수정이 필요합니다. 초안은 ‘에스라의 시대’를 별도로 반복하여, 히브리어의 두 번째 시간구가 ‘총독 네헤미야와 제사장 겸 서기관 에스라’ 양자에 함께 걸리는 구조를 바꾸었습니다. 또한 여호야김의 계보는 ‘요사닥의 아들 예수아의 아들’로 연결하는 편이 원문의 연속된 בן 관계를 더 정확히 드러냅니다.
  naturalness: ‘~의 시대에 있었습니다’는 문맥상 자연스럽고 합쇼체에도 적절합니다. 인명과 직함의 배열을 조정하면 계보 및 두 번째 시간구의 공동 범위가 더 명료해집니다.
