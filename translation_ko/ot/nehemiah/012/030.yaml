  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
  footnotes:
  - marker: a
    text: Or 'cleansed themselves ... cleansed the people, the gates, and the wall.' The Hebrew uses the same root for both actions, first reflexively and then transitively.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들과 레위 사람들은 스스로를 정결하게 하고, 백성과 성문들과 성벽을 정결하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “스스로를 깨끗하게 하고 … 백성과 성문들과 성벽을 깨끗하게 했습니다.” 히브리어는 두 행위에 같은 어근을 사용하며, 앞에서는 재귀적으로, 뒤에서는 타동적으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  english_pob_choice: purified themselves
  chosen_korean: 자신들을 정결하게 했고
  alternatives_korean:
