  - 자신들을 정화했고
  lexicon: HALOT
  rationale: 히트파엘의 재귀적 용법을 살려 제사장들과 레위 사람들이 먼저 자신들에게 정결 예식을 행했음을 드러냈습니다.
- source_word: וַיְטַהֲרוּ
  english_pob_choice: they purified
  chosen_korean: 정결하게 했습니다
  alternatives_korean:
  - 깨끗하게 했습니다
  - 정화했습니다
  lexicon: HALOT
  rationale: 뒤의 피엘형은 앞의 재귀형과 달리 타동적 행위이므로, 같은 동사군을 유지하되 행위의 방향을 한국어에서도 구별했습니다.
