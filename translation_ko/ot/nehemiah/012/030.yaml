  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
  footnotes:
  - marker: a
    text: Or 'cleansed themselves ... cleansed the people, the gates, and the wall.' The Hebrew uses the same root for both actions, first reflexively and then transitively.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제사장들과 레위 사람들은 자신들을 정결하게 했고, 그들은 백성과 성문들과 성벽을 정결하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자신들을 깨끗하게 했고 … 백성과 성문들과 성벽을 깨끗하게 했습니다.” 히브리어는 두 행위에 같은 어근을 사용하며, 앞에서는 재귀적으로, 뒤에서는 타동적으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  english_pob_choice: purified themselves
  chosen_korean: 자신들을 정결하게 했고
  alternatives_korean:
  - 자신들을 깨끗하게 했고
  - 자신들을 정화했고
  lexicon: HALOT
  rationale: 히트파엘의 재귀적 용법을 살려 제사장들과 레위 사람들이 먼저 자신들에게 정결 예식을 행했음을 드러냈습니다.
- source_word: וַיְטַהֲרוּ
  english_pob_choice: they purified
  chosen_korean: 정결하게 했습니다
  alternatives_korean:
  - 깨끗하게 했습니다
  - 정화했습니다
  lexicon: HALOT
  rationale: 뒤의 피엘형은 앞의 재귀형과 달리 타동적 행위이므로, 같은 동사군을 유지하되 행위의 방향을 한국어에서도 구별했습니다.
- source_word: הַשְּׁעָרִים
