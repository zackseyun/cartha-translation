  text: 'Now these were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
  footnotes:
  - marker: a
    text: Hebrew 'Jeshua'; alternatively 'Joshua' if the name is normalized rather than transliterated.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이들은 스룹바벨과 함께 올라온 제사장들과 레위 사람들인데, 스알디엘의 아들 스룹바벨과 예수아와 함께 올라온 사람들입니다[a]. 스라야, 예레미야, 에스라입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘예수아’입니다. 이름을 표준화해 옮기면 ‘여호수아’가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: Now these were
  chosen_korean: 이제 이들은
  alternatives_korean:
  - 그리고 이들은
  - 이들은
  lexicon: HALOT
  rationale: 새 목록을 여는 담화 연결을 살리되, 한국어에서는 자연스러운 전환 표현인 ‘이제’를 써서 열거의 시작을 분명히 했습니다.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  english_pob_choice: the priests and the Levites
  chosen_korean: 제사장들과 레위 사람들
  alternatives_korean:
  - 제사장들과 레위인들
  - 제사장들과 레위 지파 사람들
  lexicon: HALOT
  rationale: 제사장과 레위 지파 소속 사람들을 가리키는 역사서 용례를 따라, 한국어 성경 문맥에서 자연스러운 ‘레위 사람들’을 택했습니다.
- source_word: עָלוּ
  english_pob_choice: who came up
  chosen_korean: 올라온
  alternatives_korean:
  - 올라간
  - 올라와
  lexicon: HALOT
  rationale: 포로기 귀환·예루살렘 상행 문맥의 עלה를 한국어 성경 관용에 따라 ‘올라오다’로 옮겼습니다.
- source_word: וְיֵשׁוּעַ
  english_pob_choice: and Jeshua
  chosen_korean: 예수아와
  alternatives_korean:
  - 여호수아와
  - 예슈아와
  lexicon: HALOT
  rationale: 본문의 히브리어 형식 יֵשׁוּעַ를 고유명사 형태로 보존해, 이 문맥의 포로기 인물명 ‘예수아’를 따랐습니다.
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  english_pob_choice: Seraiah, Jeremiah, Ezra
  chosen_korean: 스라야, 예레미야, 에스라
  alternatives_korean:
  - 스라야, 예레미야, 에즈라
  - 세라야, 예레미야, 에스라
  lexicon: HALOT
  rationale: 본문에 나열된 인명은 현대 외래어 표기와 한국어 성경 관용을 반영해 음역했습니다.
