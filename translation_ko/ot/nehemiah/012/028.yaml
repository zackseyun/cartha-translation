  text: וַ/יֵּאָ֣סְפ֔וּ בְּנֵ֖י הַ/מְשֹׁרְרִ֑ים וּ/מִן הַ/כִּכָּר֙ סְבִיב֣וֹת יְרוּשָׁלִַ֔ם וּ/מִן חַצְרֵ֖י נְטֹפָתִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
  footnotes:
  - marker: a
    text: Or 'the plain around Jerusalem.' The Hebrew כִּכָּר can denote a plain, circle, or district depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'villages of the Netophathites.' The Hebrew חַצְרֵי often refers to small settlements or unwalled villages.
    reason: lexical_alternative
translation:
  language: ko
  text: 노래하는 이들의 자손들이 예루살렘 주변 지역과 느도바 사람들의 촌락들에서 모였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘 주변의 평지’. 히브리어 כִּכָּר는 문맥에 따라 평지, 원형 지역, 또는 구역을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘느도바 사람들의 마을들’. 히브리어 חַצְרֵי는 작은 정착지나 성벽 없는 마을을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  english_pob_choice: were gathered
  chosen_korean: 모여들었습니다
  alternatives_korean:
  - 모였습니다
  - 함께 모였습니다
  lexicon: HALOT
  rationale: 니팔 완료 연속형의 수동·자연 발생적 뉘앙스를 살려, 누군가가 강제로 모은 것인지보다 ‘모여든’ 상태를 자연스럽게 나타냈습니다.
- source_word: בְּנֵי הַמְשֹׁרְרִים
  english_pob_choice: the sons of the singers
  chosen_korean: 노래하는 자손들
  alternatives_korean:
  - 노래하는 자들의 자손들
  - 노래하는 이들의 자손들
  lexicon: HALOT
  rationale: 직역하면 ‘노래하는 이들의 아들들’이지만, 한국어에서는 혈연 표현보다 소속 집단을 드러내는 ‘자손들’이 더 자연스럽고, 시가 담당자 집단을 가리키는 점도 유지합니다.
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  english_pob_choice: the district around Jerusalem
  chosen_korean: 예루살렘 사방의 구역
  alternatives_korean:
  - 예루살렘 둘레의 평지
  - 예루살렘 주변의 들판
  lexicon: HALOT
  rationale: כִּכָּר의 ‘평지/원형 지역’ 가능성을 유지하되, 문맥상 지리적 범위를 뜻하므로 자연스러운 행정·지리 표현인 ‘구역’으로 옮겼습니다.
- source_word: חַצְרֵי נְטֹפָתִי
  english_pob_choice: the settlements of the Netophathites
  chosen_korean: 느토바 사람들의 촌락
  alternatives_korean:
  - 느토바 사람들의 마을
  - 느토바 사람들의 거주지
  lexicon: HALOT
  rationale: חַצְרֵי는 문맥상 울타리 없는 작은 정착지를 가리키므로 ‘촌락’이 POB의 ‘settlements’와 가장 가깝고, נְטֹפָתִי는 지명보다 집단명을 드러내는 형태라 ‘느토바 사람들’로 옮겼습니다.
