  rationale: 히브리어의 구체적 열거를 따라 아들·딸·아내를 각각 보존하고, בָּתֵּי는 물리적 집과 가구를 함께 가리킬 수 있으므로 ‘집들’로 직역에 가깝게 유지했습니다.
