  rationale: 이 용어는 예루살렘 공동체의 사회적 상층 지도자를 가리키므로, 행정직보다 신분·지위를 드러내는 ‘귀족들’이 가장 간결합니다.
- source_word: הַסְּגָנִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
