  rationale: נורא의 핵심은 단순한 ‘놀라운’이 아니라 두려움을 불러일으키는 위엄이므로, 하나님의 호칭과 함께 ‘두려우신’으로 옮겨 경외와 떨림을 살렸습니다.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
