source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר תִּשְׁמְעוּ֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר שָׁ֖מָּ/ה תִּקָּבְצ֣וּ אֵלֵ֑י/נוּ אֱלֹהֵ֖י/נוּ יִלָּ֥חֶם לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
  footnotes:
  - marker: a
    text: Or 'the sound of the ram's horn.' The Hebrew shofar refers specifically to a horn trumpet.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분은 나팔 소리를 듣는 곳에 그리로 우리에게로 모이십시오. 우리 하나님께서 우리를 위하여 싸우실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뿔나팔 소리.’ 히브리어 쇼파르는 특별히 뿔로 만든 나팔을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  english_pob_choice: At the place where
  chosen_korean: 듣는 곳에
  alternatives_korean:
  - 그 장소에서
  - 그곳에서
  lexicon: HALOT
  rationale: 위치를 가리키는 표현이지만 한국어에서는 ‘그 장소’보다 ‘듣는 곳에’가 더 자연스럽고, 이어지는 집결 명령의 기능을 잘 드러냅니다.
- source_word: ק֣וֹל הַ/שּׁוֹפָ֔ר
  english_pob_choice: the sound of the trumpet
  chosen_korean: 나팔 소리
  alternatives_korean:
  - 뿔나팔 소리
  - 쇼파르 소리
  lexicon: HALOT
  rationale: קוֹל을 ‘소리’로 살리고, שׁוֹפָר는 현대 한국어에서 통용되는 ‘나팔’로 옮기되, 더 구체적인 ‘뿔나팔’은 각주로 보완할 수 있습니다.
- source_word: תִּקָּבְצ֣וּ אֵלֵ֑י/נוּ
  english_pob_choice: gather there to us
  chosen_korean: 그리로 우리에게로 모이십시오
  alternatives_korean:
  - 우리에게 모이십시오
  - 거기서 우리에게로 모이십시오
  lexicon: HALOT
  rationale: 동사의 집결 의미를 ‘모이다’로 살리고, אֵלֵינוּ의 복수 1인칭 방향성을 ‘우리에게로’로 유지했습니다.
- source_word: יִלָּחֶם לָֽ/נוּ
  english_pob_choice: will fight for us
  chosen_korean: 우리를 위하여 싸우실 것입니다
  alternatives_korean:
  - 우리를 위해 싸우실 것입니다
  - 우리 편에서 싸우실 것입니다
  lexicon: HALOT
  rationale: 전치사 ל의 유익/대리 의미를 한국어 ‘위하여’로 자연스럽게 옮기면서, 하나님이 실제로 싸우신다는 주어-행위의 강도를 보존했습니다.
theological_decisions:
- issue: 집결 명령의 인칭과 화법
  chosen_reading: 공적인 권면으로서 ‘여러분은 … 모이십시오’라는 합쇼체를 사용했습니다.
  alternative_readings:
  - ‘너희는 … 모여라’와 같은 반말체
  - ‘여러분은 … 모이세요’의 완곡체
  rationale: 원문은 공동체를 향한 지시이므로 현대 한국어 공적 문체에 맞는 명령형을 쓰되, 성경 번역문체로서의 직접성을 유지했습니다.
  doctrine_reference: translation style guidance
