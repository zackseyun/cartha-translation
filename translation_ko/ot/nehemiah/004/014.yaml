revisions:
- from: 여러분은 나팔 소리를 듣는 곳에 그리로 우리에게로 모이십시오. 우리 하나님께서 우리를 위하여 싸우실 것입니다.[a]
  to: 여러분이 나팔 소리를 듣는 곳으로 우리에게 모이십시오. 우리 하나님께서 우리를 위하여 싸우실 것입니다.[a]
  rationale: 집결 장소를 가리키는 히브리어 표현과 그곳으로 모이라는 방향성을 ‘나팔 소리를 듣는 곳으로’로 자연스럽게 통합했습니다. אֵלֵינוּ의 복수 1인칭 방향은 ‘우리에게’로, 하나님의 전쟁 행위와 수혜 대상은 ‘우리 하나님께서 우리를 위하여 싸우실 것입니다’로 유지했습니다. 각주는 쇼파르의 구체적 의미를 영어 감사 기록에 맞추어 정밀화했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:24Z'
