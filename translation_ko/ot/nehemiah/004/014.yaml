  source_fidelity: 히브리어의 장소 표현, 나팔 소리, 집결 명령, ‘우리에게’라는 복수 1인칭 방향, 그리고 하나님께서 우리를 위해 싸우신다는 진술을 모두 보존합니다. 다만 초안의 ‘곳에 그리로’는 장소·방향 표현이 중복되어 원문의 의미를 한국어에서 부자연스럽게 만듭니다.
  naturalness: ‘여러분은 나팔 소리를 듣는 곳에 그리로 우리에게로 모이십시오’는 조사와 지시 부사의 중복으로 현대 표준 한국어 문장으로 자연스럽지 않습니다. ‘나팔 소리를 듣는 곳으로 우리에게 모이십시오’가 간결하고 공적인 합쇼체 명령문으로 자연스럽습니다.
