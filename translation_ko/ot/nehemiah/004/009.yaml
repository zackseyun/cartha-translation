id: NEH.4.9
reference: Nehemiah 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֞י כַּֽ/אֲשֶׁר שָׁמְע֤וּ אוֹיְבֵ֨י/נוּ֙ כִּי נ֣וֹדַֽע לָ֔/נוּ וַ/יָּ֥פֶר הָ/אֱלֹהִ֖ים אֶת עֲצָתָ֑/ם ו/נשוב כֻּלָּ֨/נוּ֙ אֶל הַ֣/חוֹמָ֔ה אִ֖ישׁ אֶל מְלַאכְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
  footnotes:
  - marker: a
    text: Or 'that we had learned of it.' The Hebrew literally says 'that it had become known to us.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had thwarted their counsel.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'each man to his work,' a distributive expression for the workers individually.
    reason: cultural_note
translation:
  language: ko
  text: 우리의 적들이 그 일이 우리에게 알려졌다는 것[a]과 하나님께서 그들의 계획을 좌절시키셨다는 것[b]을 들었을 때, 우리는 모두 각자 자기 일을 하러 성벽으로 돌아갔습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 그것을 알게 되었다는 것’. 히브리어는 문자적으로 ‘그것이 우리에게 알려졌다는 것’이라고 말합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘하나님께서 그들의 계획을 무효로 하셨다는 것’.
    reason: alternative_reading
  - marker: c
    text: 히브리어의 ‘각 사람은 자기 일로’는 일꾼들 각자에게 나뉘어 적용되는 분배적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי נוֹדַע לָנוּ
  english_pob_choice: that it had become known to us
  chosen_korean: 그 사실이 우리에게 알려졌다는 것
  alternatives_korean:
  - 우리가 그것을 알게 되었다는 것
  - 그것이 우리에게 알려졌다는 것
  lexicon: HALOT
  rationale: נודע의 수동적 의미를 살려 ‘알려졌다는 것’으로 옮기고, 앞뒤 문맥상 적들의 계획이 드러난 사실을 가리키도록 했습니다.
- source_word: וַיָּפֶר
  english_pob_choice: had frustrated
  chosen_korean: 좌절시키셨다는 것
  alternatives_korean:
  - 좌절시키셨다는 것
  - 무효로 하셨다는 것
  - 무산시키셨다는 것
  lexicon: HALOT
  rationale: הפר가 계획이나 의도를 ‘좌절시키다/무효로 하다’는 뜻이므로, 현대 한국어에서 자연스럽고 의미를 잘 드러내는 ‘좌절시키다’를 택했습니다.
- source_word: עֲצָתָם
  english_pob_choice: their plan
  chosen_korean: 그들의 계략
  alternatives_korean:
  - 그들의 계획
  - 그들의 책략
  lexicon: HALOT
  rationale: 이 문맥은 적대적 방해의 맥락이므로, 단순한 ‘계획’보다 다소 부정적 뉘앙스가 있는 ‘계략’이 מקור 의미를 더 잘 살립니다.
- source_word: אִישׁ אֶל מְלַאכְתּוֹ
  english_pob_choice: each man to his work
  chosen_korean: 각자 자기 일로
  alternatives_korean:
  - 각 사람마다 자기 일로
  - 각자 자기 작업으로
  - 각 사람은 제 일로
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 한국어에서 자연스럽게 풀어, 성별 표지의 기능은 유지하되 문장 흐름은 현대적으로 정리했습니다.
theological_decisions:
- issue: 하나님의 직접적 개입 진술
  chosen_reading: 하나님께서 그들의 계략을 좌절시키셨다는 것으로 직접 옮겼습니다.
  alternative_readings:
  - 하나님이 섭리 가운데 그 일을 막으셨다는 식으로 완화할 수 있습니다.
  rationale: 본문은 사건을 단순한 우연이 아니라 하나님의 직접적인 개입으로 설명하므로, 그 신학적 주장을 약화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 성경의 섭리와 하나님의 주권
