revisions:
- from: 우리의 적들이 그 사실이 우리에게 알려졌다는 것과 하나님께서 그들의 계략을 좌절시키셨다는 것을 들었을 때, 우리는 모두 성벽으로 돌아가 각자 자기 일로 갔습니다.[a][b][c]
  to: 우리의 적들이 그 일이 우리에게 알려졌다는 것[a]과 하나님께서 그들의 계획을 좌절시키셨다는 것[b]을 들었을 때, 우리는 모두 각자 자기 일을 하러 성벽으로 돌아갔습니다.[c]
  rationale: 원문의 수동 표현(‘우리에게 알려졌다’), 하나님의 직접적 행위, 그리고 각 사람이 자기 일을 하러 성벽으로 돌아간 분배적 의미를 보존했습니다. 원문보다 강한 ‘계략’의 함의를 피하여 ‘계획’으로 조정했고, b 각주를 실질적인 어휘 대안으로 수정했습니다.
  reviewer_model: gpt-5.6-terra
