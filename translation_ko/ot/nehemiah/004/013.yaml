  lexicon: HALOT
  rationale: 직역하면 '각 사람은 자기 형제에게서'라는 관용구지만, 한국어에서는 상호적 분리를 자연스럽게 드러내는 표현으로 의미를 풀어 옮겼습니다.
theological_decisions:
- issue: 성벽 위의 위치를 나타내는 전치사 עַל의 처리
  chosen_reading: ‘성벽 위에서’로 옮겨, 사람들의 분산 배치라는 공간적 긴장을 드러냈습니다.
  alternative_readings:
