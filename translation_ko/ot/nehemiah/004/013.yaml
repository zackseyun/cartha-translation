  - 부관들
  lexicon: HALOT
  rationale: 행정적·지도적 역할을 맡은 이들을 가리키므로, 현대 한국어에서 직무 감각이 분명한 '관리들'로 옮겼습니다.
- source_word: וּרְחָבָה
