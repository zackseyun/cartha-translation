  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
  footnotes:
  - marker: a
    text: Literally, 'each man from his brother,' a Hebrew idiom meaning 'one from another.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 귀족들과 관리들과 나머지 백성에게 말했습니다. “일은 크고 넓게 퍼져 있으며, 우리는 성벽을 따라 서로 멀리 떨어져 있습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘각 사람이 자기 형제에게서’라는 히브리어 관용구로, ‘서로 멀리 떨어져’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  english_pob_choice: the nobles
  chosen_korean: 귀족들
  alternatives_korean:
  - 유력자들
  - 귀족 계층
  lexicon: HALOT
  rationale: 느헤미야서 문맥에서 사회적 상층 지도층을 가리키므로, 단순히 '자유민'보다 지위가 드러나는 '귀족들'이 가장 자연스럽습니다.
- source_word: הַסְּגָנִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 관원들
  - 부관들
  lexicon: HALOT
  rationale: 행정적·지도적 역할을 맡은 이들을 가리키므로, 현대 한국어에서 직무 감각이 분명한 '관리들'로 옮겼습니다.
- source_word: וּרְחָבָה
  english_pob_choice: spread out
  chosen_korean: 넓으며
  alternatives_korean:
  - 넓고
  - 광활하며
  lexicon: HALOT
  rationale: 문맥상 일을 넓은 범위에 걸쳐 감당해야 한다는 뜻이므로, 형용적 의미를 살린 '넓으며'가 가장 직접적입니다.
- source_word: אִישׁ מֵאָחִיו
  english_pob_choice: from one another
  chosen_korean: 서로 멀리 떨어져 있습니다
  alternatives_korean:
  - 각자 형제에게서 떨어져 있습니다
  - 서로 떨어져 있습니다
  lexicon: HALOT
  rationale: 직역하면 '각 사람은 자기 형제에게서'라는 관용구지만, 한국어에서는 상호적 분리를 자연스럽게 드러내는 표현으로 의미를 풀어 옮겼습니다.
theological_decisions:
- issue: 성벽 위의 위치를 나타내는 전치사 עַל의 처리
  chosen_reading: ‘성벽 위에서’로 옮겨, 사람들의 분산 배치라는 공간적 긴장을 드러냈습니다.
  alternative_readings:
  - 성벽에서
  - 성벽을 따라
  rationale: 이 절은 전투·노동 상황에서 작업자들이 성벽 전체에 흩어져 있음을 강조하므로, 단순한 접촉 위치보다 분산 배치를 보여 주는 해석이 더 적절합니다.
  doctrine_reference: 문맥 주해
