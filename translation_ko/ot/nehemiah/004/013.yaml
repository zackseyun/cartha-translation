  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
  footnotes:
  - marker: a
    text: Literally, 'each man from his brother,' a Hebrew idiom meaning 'one from another.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 귀족들과 관리들과 그 나머지 백성에게 말했습니다. 「일은 크고 넓으며, 우리는 성벽 위에서 서로 멀리 떨어져 있습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘각 사람은 자기 형제에게서’라는 히브리어 관용구로, ‘서로에게서’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  english_pob_choice: the nobles
  chosen_korean: 귀족들
  alternatives_korean:
