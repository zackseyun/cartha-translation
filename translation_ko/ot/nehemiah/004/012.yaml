  - severity: low
    issue: ‘건축하는 자들’ 및 ‘건축을 하였고’
    rationale: 현대 한국어에서는 ‘사람들’이 더 자연스럽고, 두 번째 참여형은 건축 작업이 진행 중인 상황을 나타내므로 ‘건축하고 있었으며’가 더 적절합니다.
