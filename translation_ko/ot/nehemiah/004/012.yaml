  source_fidelity: 원문의 반복된 בנה 계열(‘건축하는 사람들’/‘건축하며’)과 각 사람이 칼을 허리에 찬 상태를 대체로 잘 반영했습니다. 그러나 히브리어의 명사절은 나팔 부는 사람이 화자 곁에 ‘있었다’고 할 뿐 그가 ‘섰다’고 특정하지 않습니다. 또한 שׁוֹפָר의 구체적 악기 뜻을 각주에서 밝혀 주는 편이 영어 감사 기록 및 원문에 더 충실합니다.
  naturalness: ‘건축하는 자들’보다 ‘건축하는 사람들’이 현대 표준 한국어에서 더 자연스럽습니다. ‘건축을 하였고’는 진행 중인 참여형의 상황을 충분히 드러내지 못하므로 ‘건축하고 있었으며’로 다듬었습니다.
  terminology: ‘나팔’은 자연스러운 본문 어휘로 유지하되, 각주에서 히브리어 ‘쇼파르’가 보통 숫양의 뿔로 만든 나팔임을 설명했습니다. ‘칼을 허리에 차고’는 אֲסוּרִים עַל־מָתְנָיו를 간결하고 자연스럽게 반영합니다.
  issues:
