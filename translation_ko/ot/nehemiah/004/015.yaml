  lexicon: HALOT
  rationale: 진행 중인 동작을 나타내는 분사적 용법이므로, 문맥상 자연스럽게 ‘계속했고’로 옮겨 지속성을 살렸습니다.
- source_word: בַּמְּלָאכָה
