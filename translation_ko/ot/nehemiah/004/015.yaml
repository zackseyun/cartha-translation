base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/015.yaml
  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
  footnotes:
  - marker: a
    text: Or more idiomatically, 'from daybreak until the stars came out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇게 우리는 일을 계속했고, 그들 가운데 절반은 동이 틀 때부터 별들이 나올 때까지 창을 들고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘새벽부터 별들이 나올 때까지.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים
  english_pob_choice: kept doing
  chosen_korean: 일을 계속했고
  alternatives_korean:
  - 일하고 있었고
  - 계속 일했고
  lexicon: HALOT
  rationale: 진행 중인 동작을 나타내는 분사적 용법이므로, 문맥상 자연스럽게 ‘계속했고’로 옮겨 지속성을 살렸습니다.
- source_word: בַּמְּלָאכָה
  english_pob_choice: the work
  chosen_korean: 일
  alternatives_korean:
  - 일감
  - 노동
  - 공사
  lexicon: HALOT
  rationale: מְלָאכָה는 여기서 재건 작업을 가리키므로, 과도하게 특정하지 않으면서도 자연스러운 ‘일’이 적절합니다.
- source_word: מַחֲזִיקִים בָּרְמָחִים
  english_pob_choice: held the spears
  chosen_korean: 창을 잡고 있었습니다
  alternatives_korean:
  - 창을 들고 있었습니다
  - 창을 붙들고 있었습니다
  - 창을 쥐고 있었습니다
  lexicon: HALOT
  rationale: רְמָחִים은 창/장창을 뜻하며, 군사적 경계 상태를 한국어에서 가장 자연스럽게 드러내는 표현은 ‘잡고 있었습니다’입니다.
- source_word: מֵעֲלוֹת הַשַּׁחַר עַד צֵאת הַכּוֹכָבִים
  english_pob_choice: from the rising of the dawn until the coming out of the stars
  chosen_korean: 새벽이 밝아 오는 때부터 별들이 나올 때까지
  alternatives_korean:
  - 동틀 무렵부터 별들이 나올 때까지
  - 새벽부터 별이 뜰 때까지
  - 여명에서 별이 나올 때까지
  lexicon: HALOT
  rationale: 히브리어의 생생한 시간 표현을 살리되, 한국어에서는 ‘별들이 나올 때까지’로 자연스럽게 옮겨 의미와 이미지를 함께 전달했습니다.
theological_decisions:
- issue: 시간 표현의 직역성 대 관용화
  chosen_reading: ‘새벽이 밝아 오는 때부터 별들이 나올 때까지’로, 원문의 이미지성을 유지하면서도 읽기 쉬운 한국어로 옮겼습니다.
  alternative_readings:
  - ‘동틀 무렵부터 별들이 나올 때까지’
  - ‘여명에서 별이 뜰 때까지’
  rationale: 본문의 핵심은 작업 시간의 길이를 관찰적으로 묘사하는 데 있으므로, 관용어로 완전히 바꾸지 않고 원문의 시적 대비를 보존했습니다.
  doctrine_reference: 문맥상 역사 서술의 시간표현
