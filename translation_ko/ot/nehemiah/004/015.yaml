- from: 그렇게 우리는 일을 계속했고, 그들 중 절반은 새벽이 밝아 오는 때부터 별들이 나올 때까지 창을 잡고 있었습니다.[a]
  to: 그렇게 우리는 일을 계속했고, 그들 가운데 절반은 동이 틀 때부터 별들이 나올 때까지 창을 들고 있었습니다.[a]
  rationale: The revision retains the Hebrew’s durative actions and concrete temporal imagery, while using idiomatic Korean for dawn and a more accurate Korean expression for bearing spears. The third-person possessive distinction in ‘그들 가운데 절반’ is preserved rather than harmonized with ‘우리.’
