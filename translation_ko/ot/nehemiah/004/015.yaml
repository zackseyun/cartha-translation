translation:
  language: ko
  text: 그렇게 우리는 일을 계속했고, 그들 중 절반은 새벽이 밝아 오는 때부터 별들이 나올 때까지 창을 잡고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘새벽이 밝아 오는 때부터 별들이 나올 때까지’는 ‘여명부터 별이 뜰 때까지’라는 뜻의 더 관용적인 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים
  english_pob_choice: kept doing
  chosen_korean: 일을 계속했고
  alternatives_korean:
  - 일하고 있었고
