source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה כָּשַׁל֙ כֹּ֣חַ הַ/סַּבָּ֔ל וְ/הֶ/עָפָ֖ר הַרְבֵּ֑ה וַ/אֲנַ֨חְנוּ֙ לֹ֣א נוּכַ֔ל לִ/בְנ֖וֹת בַּ/חוֹמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/004.yaml
  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
  footnotes:
  - marker: a
    text: Or 'the people of Judah said.' The singular proper name 'Judah' likely represents the community collectively.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'dust'; in context, likely the debris or rubble from the ruined city.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다가 말했습니다[a]. “짐꾼들의 힘이 꺾였고, 잔해가 너무 많아서, 우리는 성벽을 세울 수 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 사람들이 말했다’. 히브리어 단수 고유명사 ‘유다’는 여기서 공동체 전체를 가리키는 말일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוּדָה
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유다 사람들
  - 유다인들
  lexicon: HALOT
  rationale: 히브리어는 단수 고유명사이지만, 문맥상 공동체를 가리키는 집합적 용법일 수 있습니다. 본문은 그 형식을 유지해 ‘유다’로 옮기고, 집합적 해석은 각주로 처리합니다.
- source_word: כֹּחַ הַסַּבָּל
  english_pob_choice: The strength of the burden-bearers
  chosen_korean: 짐꾼들의 힘
  alternatives_korean:
  - 짐 나르는 이들의 힘
  - 짐꾼의 힘
  lexicon: HALOT
  rationale: הַסַּבָּל은 짐을 지고 나르는 사람을 가리키므로 ‘짐꾼들’이 가장 직접적입니다. 복수 집합 의미를 살리기 위해 ‘힘’도 복수 주체와 자연스럽게 맞췄습니다.
- source_word: הֶעָפָר הַרְבֵּה
  english_pob_choice: there is much rubble
  chosen_korean: 잔해가 너무 많아서
  alternatives_korean:
  - 먼지가 많아서
  - 흙먼지가 많아서
  - 파편이 많아서
  lexicon: HALOT
  rationale: עָפָר의 기본값은 ‘먼지/흙’이지만, 성벽 재건 문맥에서는 무너진 도시의 잔해를 가리키는 뜻이 적합합니다. ‘잔해’가 문맥적 의미를 가장 잘 드러냅니다.
- source_word: לֹא נוּכַל לִבְנוֹת בַּחוֹמָה
  english_pob_choice: we are not able to build the wall
  chosen_korean: 우리는 성벽을 세울 수 없습니다
  alternatives_korean:
  - 우리는 성벽을 쌓을 수 없습니다
  - 우리는 성벽을 건축할 수 없습니다
  lexicon: HALOT
  rationale: לִבְנוֹת는 단순히 ‘짓다/세우다’이며, 한국어에서는 성벽 같은 구조물에 ‘세우다’가 자연스럽고 의미도 정확합니다. בַּחוֹמָה의 전치사 뉘앙스는 과도하게 살리지 않고 한국어의 자연스러운 목적어 구문으로 처리했습니다.
theological_decisions:
- issue: 유다의 주체가 개인인지 공동체인지
  chosen_reading: 본문은 단수 형식 ‘유다’를 유지하되, 공동체적 발화 가능성은 주석으로 열어 둡니다.
  alternative_readings:
  - ‘유다 사람들이 말했다’로 풀어 쓰기
  rationale: 히브리어 문법과 POB의 주석 방향을 보존하면서, 본문 본연의 형식을 가리지 않기 위해 해설적 확장을 본문에 넣지 않았습니다.
  doctrine_reference: 본문비평/역사-문법적 해석 원칙
