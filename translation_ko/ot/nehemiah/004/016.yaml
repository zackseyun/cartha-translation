  text: גַּ֣ם בָּ/עֵ֤ת הַ/הִיא֙ אָמַ֣רְתִּי לָ/עָ֔ם אִ֣ישׁ וְ/נַעֲר֔/וֹ יָלִ֖ינוּ בְּ/ת֣וֹךְ יְרוּשָׁלִָ֑ם וְ/הָֽיוּ לָ֧/נוּ הַ/לַּ֛יְלָה מִשְׁמָ֖ר וְ/הַ/יּ֥וֹם מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
  footnotes:
  - marker: a
    text: Or “each man and his servant”; the Hebrew נַעַר can mean a youth, servant, attendant, or subordinate worker depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or “that they might be a watch for us at night and for work by day.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 나는 백성에게 말했습니다. 「각 사람과 그의 종은 예루살렘 안에서 밤을 지내고, 그들은 우리를 위해 밤에는 보초가 되고 낮에는 일꾼이 되게 하십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נַעַר는 이 문맥에서 ‘종, 수행자, 하인’이 될 수 있습니다. 여기서는 종속된 동반자를 가리키는 뜻을 따라 ‘종’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보초’는 מִשְׁמָר의 임무적 의미를 드러낸 번역입니다. 직역하면 ‘야간 경계/초소’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  english_pob_choice: Also at that time
  chosen_korean: 그때에
  alternatives_korean:
  - 또 그때에
  - 그 무렵에도
  lexicon: HALOT
  rationale: 두 시간 부사와 첨가 부사는 한국어에서는 한 번의 자연스러운 시점 표지로 묶어 옮겨도 원문의 흐름이 유지됩니다.
- source_word: אִישׁ וְנַעֲרוֹ
  english_pob_choice: each man and his servant
  chosen_korean: 각 사람과 그의 종
  alternatives_korean:
  - 각 사람과 그의 하인
  - 각 사람과 그의 젊은 종
  - 각 사람과 그의 수종
  lexicon: HALOT
  rationale: נַעַר는 문맥상 단순한 ‘젊은이’보다 종속된 수행자/하인을 가리킬 수 있으므로, 원문의 관계성을 살리는 ‘종’이 가장 안전합니다.
- source_word: יָלִינוּ בְּתוֹךְ יְרוּשָׁלִָם
  english_pob_choice: spend the night within Jerusalem
  chosen_korean: 예루살렘 안에서 밤을 지내고
  alternatives_korean:
  - 예루살렘 안에 머물고
  - 예루살렘 안에서 숙박하고
  lexicon: HALOT
  rationale: ‘밤을 지내다’는 יָלִין의 야간 체류를 자연스럽게 풀어 주며, 성 안에 머무르라는 군사적/방어적 뉘앙스를 유지합니다.
- source_word: הַלַּיְלָה מִשְׁמָר וְהַיּוֹם מְלָאכָה
  english_pob_choice: a guard for us by night and workers by day
  chosen_korean: 우리를 위해 밤에는 보초가 되고 낮에는 일꾼이 되게 하십시오
  alternatives_korean:
  - 밤에는 우리를 위한 경계가 되고 낮에는 일꾼이 되게 하십시오
  - 밤에는 우리를 지키는 파수가 되고 낮에는 일하는 자들이 되게 하십시오
  lexicon: HALOT
  rationale: מִשְׁמָר는 단순 ‘경계’보다 실제 감시 임무를 드러내는 ‘보초’가 더 구체적이며, מְלָאכָה는 작업 자체보다 그 일을 수행하는 사람을 가리키도록 ‘일꾼’으로 옮겼습니다.
theological_decisions:
