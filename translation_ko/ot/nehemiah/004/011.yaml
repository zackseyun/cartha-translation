  text: 성벽을 쌓는 이들과 짐을 지고 나르는 이들은 각자 한 손으로 일을 하고 다른 손으로는 무기를 잡고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘짐을 나르는 이들’로 옮길 수 있습니다. 히브리어 ‘오므심’은 드문 단어여서 정확한 뉘앙스가 불확실하지만, 노동자들이 재료를 다루거나 지면서도 무장하고 있었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘하셸라흐’는 창, 투창, 또는 다른 무기를 좀 더 구체적으로 가리킬 수 있습니다.
    reason: lexical_alternative
