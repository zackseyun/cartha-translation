base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
  footnotes:
  - marker: a
    text: 'Hebrew text of the final clause is difficult: literally, ''each his shelaḥ the water.'' It may mean ''each kept his weapon at his right hand, even for water,'' or ''each went with his weapon for water.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나도, 내 형제들도, 내 젊은이들도, 내 뒤에 있던 경비병들도 옷을 벗지 않았습니다. 각 사람은 물을 길러 갈 때에도 자기 오른손에 무기를 들고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 마지막 구는 난해합니다. 직역하면 대체로 ‘각 사람, 그의 무기, 물’ 정도의 파편적 표현으로, ‘각 사람이 자기 오른손에 무기를 든 채 물과 관련된 상황에서도’라는 뜻으로 이해할 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: וְאֵין אֲנִי ... אֵין אֲנַחְנוּ פֹשְׁטִים
  english_pob_choice: neither I ... took off
  chosen_korean: 그리고 나도 ... 옷을 벗지 않았습니다
  alternatives_korean:
  - 그리고 나는 ... 옷을 벗지 않았습니다
  - 나도 ... 벗지 않았습니다
  lexicon: HALOT
  rationale: 부정 반복을 한국어로 자연스럽게 옮기되, 서술의 지속적 부정을 분명히 드러내기 위해 ‘옷을 벗지 않았습니다’로 처리했습니다.
- source_word: אַחַי / נְעָרַי / אַנְשֵׁי הַמִּשְׁמָר
  english_pob_choice: my brothers / my young men / the men of the guard
  chosen_korean: 내 형제들도, 내 젊은이들도, 내 뒤에 있던 경비병들도
  alternatives_korean:
  - 내 형제들도, 내 종들도, 내 경비병들도
  - 내 형제들과 내 젊은이들과 내 경비병들
  lexicon: HALOT
  rationale: ‘형제들’은 혈연 이상일 수 있어도 히브리어를 그대로 살리고, נְעָרַי는 신분을 지나치게 특정하지 않도록 ‘젊은이들’로 옮겼습니다. מִשְׁמָר는 여기서 경비 임무를 가리키므로 ‘경비병들’이 적절합니다.
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  english_pob_choice: took off our clothes
  chosen_korean: 옷을 벗지 않았습니다
  alternatives_korean:
  - 겉옷을 벗지 않았습니다
  - 옷을 벗어 놓지 않았습니다
  lexicon: HALOT
  rationale: פשט + בגד는 옷을 벗는 뜻이므로, 의미를 분명히 하되 과도하게 구어적으로 흐르지 않게 ‘옷을 벗지 않았습니다’로 옮겼습니다.
- source_word: שִׁלְחוֹ הַמָּיִם
  english_pob_choice: his weapon in his right hand, even for water
  chosen_korean: 물을 길러 갈 때에도 자기 오른손에 무기를 들고 있었습니다
  alternatives_korean:
  - 물 때문에도 자기 오른손에 무기를 들고 있었습니다
  - 물가로 갈 때에도 자기 오른손에 무기를 들고 있었습니다
  lexicon: HALOT
  rationale: 끝절은 히브리어가 난해하므로, POB의 문맥적 해석을 따라 ‘무기를 들고 있었습니다’로 옮기고, ‘물’을 목적 상황으로 살려 경계 상태를 드러냈습니다.
theological_decisions:
- issue: 전투 준비와 일상의 필요의 긴장
  chosen_reading: ‘물을 길러 갈 때에도’로 옮겨, 일상적 필요가 있어도 무장을 풀지 않은 긴장을 드러냈습니다.
  alternative_readings:
  - ‘물 때문에도’
  - ‘심지어 물을 위해서도’
  rationale: 히브리어의 마지막 구는 문법적으로 난해하므로, 본문의 요지는 ‘물과 같은 일상적 필요 앞에서도 경계를 늦추지 않았다’는 점으로 보존했습니다.
  doctrine_reference: 본문 주해상 난문 처리; 역사서 문맥의 경계 유지
- issue: ‘오른손’의 위치 표현
  chosen_reading: ‘자기 오른손에’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘오른손에 든 채로’
  - ‘오른편에’
  rationale: POB의 해석처럼 무기의 준비 태세를 살리면서, 원문의 신체 위치 표현을 보존해 긴박감을 유지했습니다.
  doctrine_reference: 히브리어 난구의 문맥적 번역
