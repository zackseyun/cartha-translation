source:
  edition: WLC
  text: וַ/יְהִ֣י מִן הַ/יּ֣וֹם הַ/ה֗וּא חֲצִ֣י נְעָרַ/י֮ עֹשִׂ֣ים בַּ/מְּלָאכָה֒ וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ וְ/הָ/רְמָחִ֣ים הַ/מָּגִנִּ֔ים וְ/הַ/קְּשָׁת֖וֹת וְ/הַ/שִּׁרְיֹנִ֑ים וְ/הַ֨/שָּׂרִ֔ים אַחֲרֵ֖י כָּל בֵּ֥ית יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
  footnotes:
  - marker: a
    text: Or 'my servants' or 'my attendants' for 'my young men' (נְעָרַי), since the Hebrew term can refer to youths, servants, or retainers depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the coats of mail' or 'the breastplates' for 'the armor'; the Hebrew term refers to body armor.
    reason: lexical_alternative
  - marker: c
    text: '''The officers stood behind all the house of Judah'' may imply military support or supervisory positioning behind the Judean workers.'
    reason: cultural_note
translation:
  language: ko
  text: 그날부터[a] 내 젊은이들의 절반은 일을 하고 있었고, 나머지 절반은 창과 방패와 활과 갑옷[b]을 들고 있었으며, 관리들은 온 유다 백성의 뒤에 있었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 젊은이들’로 옮겼지만, 히브리어 נְעָרַי는 문맥에 따라 ‘내 종들’이나 ‘내 시종들’도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갑옷’은 히브리어 שִׁרְיוֹן의 넓은 의미를 따른 번역입니다. 더 구체적으로는 ‘사슬 갑옷’이나 ‘흉갑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘뒤에’는 אַחֲרֵי의 공간적 의미를 살린 번역입니다. 이는 유다 백성을 위한 군사적 지원이나 감독과 관련된 위치를 암시할 수 있지만, 본문은 그 기능을 명시하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  english_pob_choice: my young men
  chosen_korean: 내 젊은이들
  alternatives_korean:
