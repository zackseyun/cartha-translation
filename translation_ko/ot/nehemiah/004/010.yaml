  lexicon: HALOT
  rationale: 무기 목록을 한국어 독자가 바로 이해할 수 있게 하면서도, שִׁרְיוֹן의 의미를 과도하게 좁히지 않기 위해 ‘갑옷’으로 넓게 옮겼습니다.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  english_pob_choice: behind all the house of Judah
  chosen_korean: 유다 온 집 뒤쪽에
  alternatives_korean:
  - 유다 온 집 뒤에
  - 유다 집 전체의 뒤에서
  - 유다 온 집을 뒤따라
  lexicon: HALOT
  rationale: אַחֲרֵי의 공간적 의미를 살려 ‘뒤쪽에’로 옮겼고, בֵּית יְהוּדָה는 공동체 표현이므로 ‘유다 온 집’으로 보존했습니다.
theological_decisions:
- issue: 관리들의 위치 표현(אַחֲרֵי)
  chosen_reading: 관리들은 유다 노동자들 뒤쪽에 배치되어 경계와 지원의 역할을 했다고 읽었습니다.
  alternative_readings:
  - 관리들이 단순히 뒤에 서 있었다
  - 관리들이 전투 대형의 후방을 맡았다
  rationale: 본문은 위치를 말할 뿐 기능을 명시하지 않으므로, 영어 POB의 주석처럼 군사적 지원 또는 감독적 배치를 암시하는 정도로만 해석했습니다.
  doctrine_reference: 본문 내 서술 관찰
- issue: 직역과 자연스러움의 균형
  chosen_reading: 전투 장비 목록은 원문 순서를 유지하되, 한국어 문장 흐름을 위해 두 절로 끊었습니다.
  alternative_readings:
  - 한 문장으로 더 밀착 번역
  - 의미를 묶어 더 해설적으로 번역
  rationale: 원문의 병렬 구조를 보존하면서도 현대 한국어에서 읽기 쉬운 합쇼체 문장으로 정리했습니다.
  doctrine_reference: 번역 원칙
