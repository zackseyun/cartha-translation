id: NEH.4.10
reference: Nehemiah 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י מִן הַ/יּ֣וֹם הַ/ה֗וּא חֲצִ֣י נְעָרַ/י֮ עֹשִׂ֣ים בַּ/מְּלָאכָה֒ וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ וְ/הָ/רְמָחִ֣ים הַ/מָּגִנִּ֔ים וְ/הַ/קְּשָׁת֖וֹת וְ/הַ/שִּׁרְיֹנִ֑ים וְ/הַ֨/שָּׂרִ֔ים אַחֲרֵ֖י כָּל בֵּ֥ית יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
  footnotes:
  - marker: a
    text: Or 'my servants' or 'my attendants' for 'my young men' (נְעָרַי), since the Hebrew term can refer to youths, servants, or retainers depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'the coats of mail' or 'the breastplates' for 'the armor'; the Hebrew term refers to body armor.
    reason: lexical_alternative
  - marker: c
    text: '''The officers stood behind all the house of Judah'' may imply military support or supervisory positioning behind the Judean workers.'
    reason: cultural_note
translation:
  language: ko
  text: 그 날부터[a] 내 젊은이들 가운데 절반은 일을 하고 있었고, 절반은 창들과 방패들과 활들과 갑옷[b]을 들고 있었으며, 관리들은 유다 온 집 뒤쪽[c]에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 젊은이들’로 옮겼지만, 히브리어 נְעָרַי는 문맥에 따라 ‘내 종들’이나 ‘내 시종들’도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갑옷’은 히브리어 שִׁרְיוֹן의 넓은 의미를 따른 번역입니다. 더 구체적으로는 ‘사슬 갑옷’이나 ‘흉갑’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘뒤쪽에’는 אַחֲרֵי의 공간적 의미를 살린 번역이며, 여기서는 유다 사람들 뒤에서 지원하거나 감시하는 위치를 암시할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  english_pob_choice: my young men
  chosen_korean: 내 젊은이들
  alternatives_korean:
  - 내 종들
  - 내 수종들
  - 내 부하들
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 ‘젊은이’, ‘종’, ‘시종’을 뜻할 수 있는데, 여기서는 느헤미야의 작업·경계 인력을 가리키므로 ‘내 젊은이들’이 원문과 문맥을 함께 살립니다.
- source_word: עֹשִׂים בַּמְּלָאכָה
  english_pob_choice: were doing the work
  chosen_korean: 일을 하고 있었고
  alternatives_korean:
  - 일하고 있었고
  - 공사에 종사하고 있었고
  - 노동하고 있었고
  lexicon: HALOT
  rationale: ‘일/공사’를 뜻하는 מְלָאכָה를 자연스러운 한국어로 옮기되, 진행 중인 상태를 살리기 위해 과거 진행형으로 표현했습니다.
- source_word: מַחֲזִיקִים ... הָרְמָחִים הַמָּגִנִּים וְהַקְּשָׁתוֹת וְהַשִּׁרְיֹנִים
  english_pob_choice: were holding the spears, the shields, the bows, and the armor
  chosen_korean: 창들과 방패들과 활들과 갑옷을 들고 있었으며
  alternatives_korean:
  - 창들과 방패들과 활들과 무장을 갖추고 있었으며
  - 창들과 방패들과 활들과 갑옷을 지니고 있었으며
  lexicon: HALOT
  rationale: 무기 목록을 한국어 독자가 바로 이해할 수 있게 하면서도, שִׁרְיוֹן의 의미를 과도하게 좁히지 않기 위해 ‘갑옷’으로 넓게 옮겼습니다.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  english_pob_choice: behind all the house of Judah
  chosen_korean: 유다 온 집 뒤쪽에
  alternatives_korean:
  - 유다 온 집 뒤에
  - 유다 집 전체의 뒤에서
  - 유다 온 집을 뒤따라
  lexicon: HALOT
  rationale: אַחֲרֵי의 공간적 의미를 살려 ‘뒤쪽에’로 옮겼고, בֵּית יְהוּדָה는 공동체 표현이므로 ‘유다 온 집’으로 보존했습니다.
theological_decisions:
- issue: 관리들의 위치 표현(אַחֲרֵי)
  chosen_reading: 관리들은 유다 노동자들 뒤쪽에 배치되어 경계와 지원의 역할을 했다고 읽었습니다.
  alternative_readings:
  - 관리들이 단순히 뒤에 서 있었다
  - 관리들이 전투 대형의 후방을 맡았다
  rationale: 본문은 위치를 말할 뿐 기능을 명시하지 않으므로, 영어 POB의 주석처럼 군사적 지원 또는 감독적 배치를 암시하는 정도로만 해석했습니다.
  doctrine_reference: 본문 내 서술 관찰
- issue: 직역과 자연스러움의 균형
  chosen_reading: 전투 장비 목록은 원문 순서를 유지하되, 한국어 문장 흐름을 위해 두 절로 끊었습니다.
  alternative_readings:
  - 한 문장으로 더 밀착 번역
  - 의미를 묶어 더 해설적으로 번역
  rationale: 원문의 병렬 구조를 보존하면서도 현대 한국어에서 읽기 쉬운 합쇼체 문장으로 정리했습니다.
  doctrine_reference: 번역 원칙
