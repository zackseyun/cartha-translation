  rationale: נַעַר는 문맥에 따라 ‘젊은이’, ‘종’, ‘시종’을 뜻할 수 있는데, 여기서는 느헤미야의 작업·경계 인력을 가리키므로 ‘내 젊은이들’이 원문과 문맥을 함께 살립니다.
