  yaml_path: translation/ot/nehemiah/004/003.yaml
  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
  footnotes:
  - marker: a
    text: Or 'posted a watch against them.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'from before them'; here meaning 'because of them' or 'on account of them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 우리는 우리 하나님께 기도하고, 그들 때문에 낮과 밤에 그들을 대적할 경비를 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경비를 배치했습니다’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 앞에서부터’로, 여기서는 ‘그들 때문에’ 또는 ‘그들로 말미암아’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  english_pob_choice: we prayed
  chosen_korean: 우리는 … 기도하고
  alternatives_korean:
  - 우리는 … 간구하고
  - 우리는 … 중보하고
  lexicon: WLC / HALOT
  rationale: 히트파엘 형태의 פלל은 여기서 단순히 ‘기도하다’의 뜻으로 읽는 것이 가장 자연스럽고, 영어 POB의 평이한 선택도 이를 따릅니다.
- source_word: וַנַּעֲמִיד מִשְׁמָר
  english_pob_choice: stationed a guard
  chosen_korean: 경비를 세웠습니다
  alternatives_korean:
  - 파수를 세웠습니다
  - 보초를 세웠습니다
  lexicon: WLC / HALOT
  rationale: עָמַד의 사역형과 מִשְׁמָר의 감시/경계 의미를 함께 살리되, 현대 한국어에서 자연스럽고 집단적 방어 조치를 잘 드러내는 표현으로 옮겼습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: against them
  chosen_korean: 그들을 대적할
  alternatives_korean:
  - 그들 위에
  - 그들에 대하여
  lexicon: WLC / HALOT
  rationale: 전치사 עַל은 여기서 단순한 ‘위에’가 아니라 적대적 대비의 방향을 나타내므로, 문맥상 ‘대적할’로 풀어 관계를 분명히 했습니다.
- source_word: מִפְּנֵיהֶם
  english_pob_choice: because of them
  chosen_korean: 그들 때문에
  alternatives_korean:
  - 그들로 말미암아
  - 그들을 두려워하여
  lexicon: WLC / HALOT
  rationale: 직역하면 ‘그들 앞에서/그들의 앞에서’이지만, 문맥상 경비를 세운 이유를 나타내므로 원문의 인과를 살려 ‘때문에’로 옮겼습니다.
theological_decisions:
- issue: 기도와 경계의 병행
  chosen_reading: 기도와 실제적인 경비 조치를 나란히 두어, 하나님 의뢰와 실질적 대비를 함께 표현했습니다.
  alternative_readings:
  - 기도만 강조하는 읽기
  - 경비만 강조하는 읽기
  rationale: 히브리어는 두 동작을 접속사로 병렬하며 어느 하나를 다른 하나에 종속시키지 않습니다. 번역도 이 긴장을 그대로 유지해야 합니다.
  doctrine_reference: Translation philosophy §3 (theological-practical tension)
