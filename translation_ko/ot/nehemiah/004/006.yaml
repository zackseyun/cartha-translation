  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
  footnotes:
  - marker: a
    text: Or, “wherever you return.” The Hebrew verb can mean 'turn back/return,' but in context it likely means turning in any direction.
    reason: lexical_alternative
  - marker: b
    text: The warning implies hostile attackers approaching from every direction; the verb 'will come up' is supplied in English for clarity from the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들 가까이에 사는 유다 사람들이 와서 우리에게 열 번이나 말했습니다. “여러분이 어느 곳으로 돌아서든[a], 그들이 우리를 치러 올라올 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여러분이 돌아가는 곳 어디에서나.” 히브리어 동사는 ‘돌아가다, 돌아오다’를 뜻할 수 있으나, 문맥에서는 어느 방향으로든 돌아서는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 경고는 적들이 모든 방향에서 쳐들어올 것을 뜻하는 것으로 보입니다. ‘그들이 … 치러 올라올 것입니다’라는 표현은 문맥에 따라 보충한 것입니다.
    reason: contextual_clarification
