  text: 그들이 가까이 사는 유대인들이 와서 우리에게 열 번[c]을 말하여 이르되, "당신이 어느 방향으로 돌아서든 그들이 우리를 치러 올라오리이다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "당신이 돌아서는 곳 어디에서나." 히브리어 동사는 '돌아가다'를 의미할 수 있으나, 문맥상 모든 방향으로 돌아감을 의미할 가능성이 높습니다.
    reason: alternative_reading
  - marker: b
    text: 이 경고는 모든 방향에서 적들이 쳐들어온다는 것을 암시하며, '올라오리이다'라는 동사는 문맥에 따라 명확성을 위해 영어에서 보충된 것입니다.
