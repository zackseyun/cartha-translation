id: NEH.4.1
reference: Nehemiah 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר שָׁמַ֣ע סַנְבַלַּ֡ט וְ֠/טוֹבִיָּה וְ/הָ/עַרְבִ֨ים וְ/הָ/עַמֹּנִ֜ים וְ/הָ/אַשְׁדּוֹדִ֗ים כִּֽי עָלְתָ֤ה אֲרוּכָה֙ לְ/חֹמ֣וֹת יְרוּשָׁלִַ֔ם כִּי הֵחֵ֥לּוּ הַ/פְּרֻצִ֖ים לְ/הִסָּתֵ֑ם וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: Now when Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
  footnotes:
  - marker: a
    text: Or 'the restoration of Jerusalem’s walls had advanced.' The Hebrew uses a term often associated with healing or restoration metaphorically for repair work.
    reason: lexical_alternative
  - marker: b
    text: Or 'the gaps' instead of 'the breaches.'
    reason: lexical_alternative
translation:
  language: ko
  text: 산발랏과 도비야와 아라빔과 암몬 사람들과 아스돗 사람들이 예루살렘 성벽의 보수 작업이 진전되고, 무너진 틈들이 메워지기 시작한 것을 듣고 몹시 화를 냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보수 작업이 진전되다’는 직역성보다 의미 전달을 우선한 표현입니다.
    reason: korean_style_note
  - marker: b
    text: ‘무너진 틈들’은 POB의 ‘breaches’에 해당하는 성벽 파손 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  english_pob_choice: Now when
  chosen_korean: —할 때
  alternatives_korean:
  - —하자
  - —하였을 때
  lexicon: WLC/HALOT
  rationale: 서사 전환과 시간 부사를 자연스럽게 살리기 위해 문두를 매끄럽게 연결했습니다.
- source_word: עָלְתָה אֲרוּכָה
  english_pob_choice: the repair ... had gone up
  chosen_korean: 보수 작업이 진전되고
  alternatives_korean:
  - 회복이 올라오고
  - 수리가 진행되고
  lexicon: HALOT
  rationale: אֲרוּכָה의 치유/회복 비유를 유지하되, 성벽 문맥에서는 ‘보수 작업의 진전’이 가장 자연스럽고 원문 의미를 덜 훼손합니다.
- source_word: הַפְּרֻצִים
  english_pob_choice: the breaches
  chosen_korean: 무너진 틈들
  alternatives_korean:
  - 파손된 곳들
  - 틈새들
  lexicon: HALOT
  rationale: 성벽의 파손된 구멍을 가리키므로 ‘무너진 틈들’이 구체성과 현대성을 함께 살립니다.
- source_word: לְהִסָּתֵם
  english_pob_choice: to be closed
  chosen_korean: 메워지기 시작한
  alternatives_korean:
  - 닫히기 시작한
  - 봉해지기 시작한
  lexicon: HALOT
  rationale: 틈이 벽 안에서 채워져 닫히는 과정을 한국어 동사로 자연스럽게 옮겼습니다.
- source_word: וַיִּחַר לָהֶם מְאֹד
  english_pob_choice: they became very angry
  chosen_korean: 몹시 화를 냈습니다
  alternatives_korean:
  - 매우 격분했습니다
  - 크게 노했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 현대 한국어의 직접적 감정 표현으로 옮겨, 집단적 분노를 분명히 드러냈습니다.
theological_decisions:
- issue: 집단 명칭의 음역과 민족 표기
  chosen_reading: 아라빔과 암몬 사람들과 아스돗 사람들
  alternative_readings:
  - 아랍 사람들과 암몬 사람들과 아스돗 사람들
  - 아라비아인들과 암몬인들과 아스돗인들
  rationale: 원문의 민족/집단 표지를 살리면서도 한국어 성경에서 통용되는 민족명과 현대 독자에게 익숙한 표기를 균형 있게 반영했습니다.
  doctrine_reference: 역사서 본문 번역 원칙
