    rationale: 히브리어 남성 단수 대명사는 예루살렘을 가리킵니다. 한국어에서는 장소·도시를 받아 ‘그곳에’라고 하는 편이 ‘그 안에’보다 자연스럽고 의미를 보존합니다.
