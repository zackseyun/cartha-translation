review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어의 ‘모의하여/공모하여’가 뒤따르는 두 목적 부정사(와서 싸우다, 혼란을 일으키다)를 함께 지배하는 구조이므로, 한국어에서도 두 행위가 모두 모의의 내용임을 더 분명히 하는 편이 좋습니다. ‘그 안에’는 ירושלים을 가리키지만, 도시를 지시할 때는 ‘그곳에’가 더 자연스럽습니다.
  naturalness: 현행 문장은 이해되지만, ‘모의하여 … 싸우고 … 일으키려 하였습니다’는 ‘일으키려’만 모의의 직접 목적처럼 읽힐 여지가 있습니다. ‘… 일으키기로 모의하였습니다’가 현대 표준어 합쇼체에서 자연스럽고 문장 구조도 명료합니다.
  terminology: ‘모의하였습니다’, ‘예루살렘’, ‘혼란’은 적절합니다. תּוֹעָה의 어휘 범위는 ‘혼란, 소란, 무질서’로 처리할 수 있으며, 본문에는 포괄적인 ‘혼란’을 유지하는 것이 안전합니다.
  issues:
  - severity: low
    issue: 목적 범위의 불명료성
    rationale: 현행 ‘모의하여 … 싸우고 그 안에 혼란을 일으키려 하였습니다’는 한국어 문법상 마지막 ‘일으키려 하였습니다’가 앞의 ‘싸우고’보다 더 직접적으로 ‘모의하여’에 연결되어 보일 수 있습니다. 두 행위 전체가 공모의 내용임을 드러내도록 문장을 조정합니다.
