    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  english_pob_choice: conspired
  chosen_korean: 모의하여
  alternatives_korean:
  - 공모하여
  - 함께 꾀하여
  lexicon: HALOT
  rationale: קשר는 문맥상 적대적 공모를 뜻하므로, 한국어에서는 ‘모의하다’가 가장 자연스럽게 의도와 긴장을 살립니다.
- source_word: כֻלָּם יַחְדָּו
  english_pob_choice: all of them together
  chosen_korean: 그들 모두가 함께
  alternatives_korean:
  - 모두 함께
  - 그들 전부가 한데
  lexicon: HALOT
  rationale: 총체성과 공동 행동을 함께 살리기 위해 ‘그들 모두가 함께’로 옮겼습니다.
- source_word: לְהִלָּחֵם בִּירוּשָׁלָם
  english_pob_choice: to fight against Jerusalem
  chosen_korean: 예루살렘에 와서 싸우고
  alternatives_korean:
  - 예루살렘을 대적하여 싸우고
  - 예루살렘을 치러 와서 싸우고
  lexicon: HALOT
  rationale: 히브리어는 먼저 ‘오다’의 동작을 두고 이어서 ‘싸우다’가 나오므로, 두 동작을 모두 살리면서 한국어로는 목적지와 공격 의도를 자연스럽게 표현했습니다.
- source_word: תּוֹעָה
  english_pob_choice: confusion
  chosen_korean: 혼란
  alternatives_korean:
  - 어지러움
  - 소동
  - 혼잡
  lexicon: HALOT
  rationale: תּוֹעָה는 혼란, 소란, 무질서의 범위를 가지며, 공사 방해의 맥락에서는 ‘혼란’이 가장 포괄적이고 무난합니다.
theological_decisions:
- issue: 예루살렘에 대한 적대적 행동의 동사군을 어떻게 살릴지
  chosen_reading: ‘와서 싸우고’로 번역해, 공격적 이동과 전투 행위를 둘 다 드러냈습니다.
  alternative_readings:
  - ‘공격하려고 예루살렘으로 와서’
  - ‘예루살렘을 치러 와서’
  rationale: 본문은 단순한 접근이 아니라 전투 목적의 이동을 말하므로, 동작의 연쇄를 유지하는 번역이 서사적 긴장을 더 정확히 전달합니다.
  doctrine_reference: 본문 해석/서사 의미
