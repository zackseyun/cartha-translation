source:
  edition: WLC
  text: אַ֗ף כִּֽי עָשׂ֤וּ לָ/הֶם֙ עֵ֣גֶל מַסֵּכָ֔ה וַ/יֹּ֣אמְר֔וּ זֶ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר הֶעֶלְ/ךָ֖ מִ/מִּצְרָ֑יִם וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
  footnotes:
  - marker: a
    text: Or “a molten calf.”
    reason: lexical_alternative
  - marker: b
    text: Or “great provocations” or “great contemptuous acts.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 스스로를 위해 주조한 송아지를 만들고 말하기를, ‘이것이 너를 이집트에서 올라오게 한 네 신이다’ 하며, 큰 신성모독을 저질렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주조한 송아지’는 ‘a cast metal calf’의 자연스러운 한국어 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신성모독’은 이 단어가 여기서 가지는 하나님께 대한 직접적 모독의 강도를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  english_pob_choice: Even when
  chosen_korean: 그들이 … 하고도 / … 하며
  alternatives_korean:
  - 비록 … 했을 때에도
  - 설령 … 했을지라도
  lexicon: HALOT
  rationale: 문맥상 하나님의 오래 참으심에도 불구하고 이스라엘이 범한 죄를 대조하는 양보 구조이므로, 한국어에서는 자연스러운 서술 연결로 그 양보 뉘앙스를 살렸습니다.
- source_word: עָשׂוּ לָהֶם עֵגֶל מַסֵּכָה
  english_pob_choice: they made for themselves a cast metal calf
  chosen_korean: 스스로를 위해 주조한 송아지를 만들고
  alternatives_korean:
  - 자기들을 위해 부어 만든 송아지를 만들고
  - 자기들을 위해 주조한 우상을 만들고
  lexicon: HALOT
  rationale: עֵגֶל 마סֵּכָה의 ‘주조된 금속 우상’ 성격을 ‘주조한 송아지’로 살리되, 한국어로 너무 기술적이지 않게 표현했습니다. ‘스스로를 위해’는 לָהֶם의 반사적 목적을 반영합니다.
- source_word: זֶה אֱלֹהֶיךָ
  english_pob_choice: This is your god
  chosen_korean: 이것이 너를 이집트에서 올라오게 한 네 신이다
  alternatives_korean:
  - 이것이 너의 신이다
  - 이것이 너희 신들이다
  lexicon: HALOT
  rationale: 히브리어의 단수 지시사와 단수 소유격을 따라 단수로 옮겼고, 우상 숭배의 대상이므로 ‘하나님’이 아니라 ‘신’으로 번역했습니다.
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרַיִם
  english_pob_choice: who brought you up out of Egypt
  chosen_korean: 너를 이집트에서 올라오게 한
  alternatives_korean:
  - 너를 이집트에서 이끌어 올린
  - 너를 이집트에서 데리고 올라온
  lexicon: HALOT
  rationale: 출애굽 공식 표현인 ‘올라오게 하다’를 살려, ‘from/out of Egypt’의 관용적 의미를 표준적 한국어로 반영했습니다.
- source_word: נֶאָצֹות גְּדֹלוֹת
  english_pob_choice: great blasphemies
  chosen_korean: 큰 신성모독
  alternatives_korean:
  - 큰 모욕
  - 큰 불경
  - 큰 도발
  lexicon: HALOT
  rationale: 이 구절은 송아지 사건에서 하나님께 직접 가한 모독을 가리키므로, ‘blasphemies’의 신학적 강도를 드러내는 ‘신성모독’을 택했습니다.
theological_decisions:
- issue: 우상의 호칭을 ‘신’으로 둘지 ‘하나님’으로 둘지
  chosen_reading: ‘네 신’으로 번역해, 우상에 대한 잘못된 고백을 드러냈습니다.
  alternative_readings:
  - ‘네 하나님’
  - ‘네들 신들’
  rationale: 히브리어의 조롱적/우상적 발화를 그대로 보여 주기 위해, 하나님을 가리키는 정통 표기를 피하고 문맥에 맞는 ‘신’을 사용했습니다.
  doctrine_reference: 우상 숭배 본문에서의 반어적 발화 재현
- issue: נֶאָצוֹת의 강도
  chosen_reading: ‘큰 신성모독’으로 번역해 하나님께 대한 직접적 모독성을 살렸습니다.
  alternative_readings:
  - 큰 도발
  - 큰 불경스런 행위
  rationale: 단순한 ‘도발’보다 이 사건의 하나님-대-인간적 위반을 더 분명히 드러내므로, 교리적으로도 더 적절한 경고적 어휘를 선택했습니다.
  doctrine_reference: 본문의 죄책 강조
