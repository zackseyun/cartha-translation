translation:
  language: ko
  text: 주님께서는 그들을 깨우쳐 주시려고 주님의 선하신 영을 주셨으며, 그들의 입에서 주님의 만나를 거두지 않으셨고, 그들의 갈증을 풀어 주시려고 물을 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘루아흐’는 문맥에 따라 ‘영’, ‘바람’, 또는 ‘숨’을 뜻할 수 있습니다. 여기서는 이스라엘을 인도하고 깨우치게 하시기 위해 주신 하나님의 영을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
