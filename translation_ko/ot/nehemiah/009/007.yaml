translation:
  language: ko
  text: 당신은 야훼 하나님이시며, 아브람을 택하시고 갈대아의 우르에서 그를 이끌어 내시고 그의 이름을 아브라함으로 정하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md / YHWH rendering policy
  rationale: 원문 고유명사 יְהוָה를 제목어인 ‘주’로 치환하지 않고, POB의 공인 원칙에 따라 ‘야훼’로 옮겨 하나님의 언약적 이름을 드러냈습니다.
- source_word: הָאֱלֹהִים
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 그 하나님
  - 하느님
  lexicon: HALOT
  rationale: יְהוָה와 동격으로 쓰인 ‘하나님’은 한국어 성경의 표준 신칭을 살리되, 문맥상 중복을 피하기 위해 자연스럽게 붙였습니다.
- source_word: בָּחַרְתָּ
  english_pob_choice: chose
  chosen_korean: 택하시고
  alternatives_korean:
  - 선택하시고
  - 고르시고
  lexicon: HALOT
  rationale: בחר의 언약적 선택 의미를 살리면서도 한국어에서 하나님 주어와 잘 어울리는 ‘택하다’를 사용했습니다.
- source_word: וְהוֹצֵאתוֹ מֵאוּר כַּשְׂדִּים
  english_pob_choice: brought him out from Ur of the Chaldeans
  chosen_korean: 갈대아 우르에서 그를 이끌어 내시고
  alternatives_korean:
  - 갈대아 우르에서 그를 끌어내시고
  - 갈대아 우르에서 그를 데리고 나오시고
  lexicon: HALOT
  rationale: הוֹצִיא의 ‘밖으로 이끌어 내다’라는 동작성을 살려, 단순 이동보다 구출·인도 뉘앙스가 드러나는 ‘이끌어 내시고’로 옮겼습니다.
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  english_pob_choice: gave him the name Abraham
  chosen_korean: 그의 이름을 아브라함으로 주셨습니다
  alternatives_korean:
  - 그의 이름을 아브라함이라 부르셨습니다
  - 그 이름을 아브라함으로 정하셨습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘이름을 두다/놓다’이지만, 한국어에서는 개명 행위를 가장 자연스럽게 드러내는 ‘이름을 …으로 주다’를 선택했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה를 한국어로 어떻게 표시할지
  chosen_reading: 본문에는 ‘야훼’로, 호칭 ‘하나님’과 함께 ‘주 야훼 하나님’으로 옮겼습니다.
  alternative_readings:
  - 여호와 하나님
  - 주 하나님
  rationale: POB의 원칙대로 고유명사로서의 신명 Tetragrammaton을 보존하되, 문맥상 동격인 הָאֱלֹהִים을 함께 표시해 ‘야훼 하나님’이라는 동일시를 분명히 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
