  naturalness: ‘당신은 야훼 하나님이시며’는 기도·공동 고백 문맥의 직접 호칭을 자연스러운 현대 합쇼체로 나타냅니다. ‘이름을 아브라함으로 정하셨습니다’는 한국어에서 개명 행위를 명료하게 표현합니다.
