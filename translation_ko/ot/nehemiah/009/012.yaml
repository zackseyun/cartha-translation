language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/עַמּ֣וּד עָנָ֔ן הִנְחִיתָ֖/ם יוֹמָ֑ם וּ/בְ/עַמּ֥וּד אֵשׁ֙ לַ֔יְלָה לְ/הָאִ֣יר לָ/הֶ֔ם אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
  footnotes:
  - marker: a
    text: Or 'to illumine the way for them'; the Hebrew literally says 'to give light to them [regarding] the way.'
    reason: lexical_alternative
translation:
  language: ko
  text: 구름 기둥으로 낮에는 그들을 인도하시고, 불 기둥으로 밤에는 그들에게 빛을 비추어 주셔서 그들이 가야 할 길을 비추셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 위해 길을 비추려고’; 히브리어는 문자적으로 ‘그들에게 [관련하여] 길에 빛을 주다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  english_pob_choice: By a pillar of cloud
  chosen_korean: 구름 기둥으로
  alternatives_korean:
  - 구름 기둥으로써
  - 구름 기둥을 따라
  lexicon: HALOT
  rationale: ‘ב’의 수단·매개 의미를 살려 하나님께서 구름 기둥을 통해 인도하셨다는 점을 자연스럽게 표현했습니다.
- source_word: הִנְחִיתָם
  english_pob_choice: you led them
  chosen_korean: 그들을 인도하시고
  alternatives_korean:
  - 그들을 이끄시고
  - 그들을 지도하시고
  lexicon: HALOT
  rationale: נחה의 사역형 의미를 한국어 ‘인도하다’로 옮기면 길을 안내하고 이끄는 의미가 가장 안정적으로 드러납니다.
- source_word: לְהָאִיר לָהֶם אֶת הַדֶּרֶךְ
  english_pob_choice: to give them light on the way
  chosen_korean: 그들에게 빛을 비추어 주셔서 그들이 가야 할 길을 비추셨습니다
  alternatives_korean:
  - 그들에게 길을 밝히셔서
  - 그들이 갈 길에 빛을 주셔서
  lexicon: HALOT
  rationale: ‘빛을 주다/비추다’는 히브리어 Hiphil의 목적 표현을 살리면서도 한국어로 자연스럽게 이어지도록 했습니다.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  english_pob_choice: in which they should go
  chosen_korean: 그들이 가야 할 길
  alternatives_korean:
  - 그들이 가야 하는 길
  - 그들이 가는 길
  lexicon: HALOT
  rationale: 관계절의 지시성을 한국어 관형절 ‘가야 할’로 옮겨, 단순한 경로 설명이 아니라 정해진 진로라는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 구름 기둥과 불 기둥의 기능을 어떻게 표현할지
  chosen_reading: 본문의 역사적 인도와 조명의 의미를 그대로 살려, 하나님의 실제적인 길 인도 행위로 번역했습니다.
  alternative_readings:
  - 하나님의 임재를 더 전면에 내세우는 해석적 표현
  rationale: 본문은 상징적 재해석보다 광야에서 이스라엘을 구체적으로 이끄시고 비추신 행위를 강조하므로, 그 사실성을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 번역 원칙 §1, §3
