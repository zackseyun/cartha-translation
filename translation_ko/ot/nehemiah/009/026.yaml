  edition: WLC
  text: וַ/יַּמְר֨וּ וַֽ/יִּמְרְד֜וּ בָּ֗/ךְ וַ/יַּשְׁלִ֤כוּ אֶת תּוֹרָֽתְ/ךָ֙ אַחֲרֵ֣י גַוָּ֔/ם וְ/אֶת נְבִיאֶ֣י/ךָ הָרָ֔גוּ אֲשֶׁר הֵעִ֥ידוּ בָ֖/ם לַ/הֲשִׁיבָ֣/ם אֵלֶ֑י/ךָ וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדוֹלֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
  footnotes:
  - marker: a
    text: Or 'were disobedient,' 'acted arrogantly,' or 'provoked'; the Hebrew verb suggests defiant resistance.
    reason: lexical_alternative
  - marker: b
    text: Or 'your instruction' for 'your law.'
    reason: lexical_alternative
  - marker: c
    text: Or 'testified against them'; the Hebrew can carry the sense of solemn warning or witness.
    reason: lexical_alternative
  - marker: d
    text: Or 'great contempts,' 'great insults,' or 'great provocations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 불순종하고[a] 당신께 반역하며, 당신의 율법을[b] 자기들의 등 뒤로 내던졌습니다. 그들은 당신의 예언자들을 죽였습니다. 그 예언자들은 그들을 당신께 돌아오게 하려고 그들에게 경고하였던[c] 이들입니다. 또 그들은 큰 모독을 저질렀습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불순종하고’는 ‘거만하게 행하다’, ‘완고히 거역하다’ 또는 ‘도발하다’로도 옮길 수 있습니다. 히브리어 동사는 완고하고 도전적인 저항을 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘율법’은 여기서 ‘가르침’ 또는 ‘지침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘경고하였던’은 히브리어의 ‘엄숙히 증언하다’ 또는 ‘그들을 향해 증언하다’라는 뜻도 반영합니다.
    reason: lexical_alternative
  - marker: d
    text: ‘큰 모독’은 ‘큰 경멸 행위’, ‘큰 모욕’ 또는 ‘큰 신성모독’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  english_pob_choice: acted presumptuously
  chosen_korean: 주제넘게 행하고
  alternatives_korean:
  - 무례하게 행하고
  - 거만하게 행동하고
  - 반항하며
  lexicon: HALOT
  rationale: מרה는 단순 불순종보다 완고하고 도전적인 태도를 가리킬 수 있어, 뒤의 ‘반역하다’와 구별되도록 ‘주제넘게 행하다’로 옮겼습니다.
- source_word: וַיִּמְרְדוּ בָּךְ
  english_pob_choice: rebelled against you
  chosen_korean: 당신께 반역하며
  alternatives_korean:
  - 당신을 거역하며
  - 당신을 향해 반란을 일으키며
  lexicon: HALOT
  rationale: מרד의 핵심은 명시적인 반역이므로, 상대를 직접 가리키는 בָּךְ를 살려 ‘당신께 반역하다’로 옮겼습니다.
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  english_pob_choice: they threw your law behind their backs
  chosen_korean: 당신의 율법을 자기들의 뒤로 내던졌습니다
  alternatives_korean:
  - 당신의 율법을 자기들의 등 뒤로 던졌습니다
  - 당신의 율법을 뒤로 밀쳐 버렸습니다
  - 당신의 율법을 자기들 뒤에 던졌습니다
  lexicon: HALOT
  rationale: 히브리어 관용구가 담고 있는 경멸적 폐기를 살리기 위해 ‘내던지다’를 사용했고, 뒤의 신체 이미지도 한국어에서 자연스럽게 유지했습니다.
- source_word: תּוֹרָתְךָ
  english_pob_choice: your law
  chosen_korean: 당신의 율법
  alternatives_korean:
  - 당신의 가르침
  - 당신의 지침
  lexicon: HALOT
  rationale: 언약사적 탄식문 맥락에서는 תּוֹרָה를 ‘율법’으로 옮기는 것이 가장 직접적이고, 본문의 죄목이 법적·언약적 거절임을 분명히 합니다.
- source_word: נֶאָצוֹת גְּדוֹלֹת
  english_pob_choice: great blasphemies
  chosen_korean: 큰 모독들을 저질렀습니다
  alternatives_korean:
  - 큰 신성모독들을 저질렀습니다
  - 큰 경멸들을 행했습니다
  - 큰 욕됨들을 저질렀습니다
  lexicon: HALOT
  rationale: נֶאָצוֹת은 단순한 욕설보다 하나님께 대한 심각한 모독·경멸을 뜻하므로, 한국어에서는 의미를 살리면서도 너무 교회식으로 굳어지지 않도록 ‘큰 모독들’로 옮겼습니다.
theological_decisions:
- issue: 예언자들이 한 경고의 성격
  chosen_reading: ‘그들을 당신께 돌아오게 하려고 경고했던 사람들’로 옮겨, 예언자적 경고가 회복을 목표로 한 언약적 증언임을 드러냈습니다.
  alternative_readings:
  - ‘그들을 향해 증언했던 사람들’
  - ‘그들에게 경고했던 사람들’
  rationale: הֵעִידוּ בָם과 לַהֲשִׁיבָם אֵלֶיךָ를 함께 살리면, 단순 정보 전달이 아니라 회개로 돌이키려는 경고였음이 보입니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency and documented exception)
- issue: ‘큰 모독들’의 강도
  chosen_reading: 직접적인 ‘신성모독’보다 ‘큰 모독들’을 본문에 두고, 하나님께 향한 모독의 성격은 문맥으로 드러내도록 했습니다.
  alternative_readings:
  - ‘큰 신성모독들’
  - ‘큰 경멸들’
  rationale: 히브리어는 하나님께 대한 경멸을 가리키지만, 한국어의 ‘신성모독’은 지나치게 전문적이거나 교리화될 수 있어, 본문 어조를 보존하는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §6 (readable modern Korean without flattening source force)
