  to: 주께서는 그의 마음이 주 앞에서 신실한 것을 보셨고, 그와 언약을 맺으셔서 가나안 사람, 헷 사람, 아모리 사람, 브리스 사람, 여부스 사람, 기르가스 사람의 땅을 그의 자손에게[a] 주시겠다고 하셨습니다. 주께서는 주의 말씀을 이루셨으니[b], 주께서 의로우시기 때문입니다.[c]
