id: NEH.9.8
reference: Nehemiah 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
  footnotes:
  - marker: a
    text: Or 'to his descendants'; Hebrew 'seed/offspring' is a collective singular.
    reason: lexical_alternative
  - marker: b
    text: Or 'you established/confirmed your words.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for you are just.'
    reason: alternative_reading
translation:
  language: ko
  text: 주께서는 그의 마음이 주 앞에서 신실한 것을 보셨고, 그와 언약을 맺으셔서 가나안 사람, 헷 사람, 아모리 사람, 브리스 사람, 여부스 사람, 기르가스 사람의 땅을 그의 자손에게[a] 주시겠다고 하셨습니다. 주께서는 주의 말씀을 이루셨으니[b], 주께서 의로우시기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자손’은 히브리어 זֶרַע의 집합적 단수로, 직역하면 ‘그의 씨’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이루셨다’는 본문의 ‘세우다/확립하다’(קום)가 여기서는 말씀을 실현하거나 성취한다는 뜻으로 쓰인 것을 따른 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘의로우시다’는 ‘공의로우시다’ 또는 ‘옳으시다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָצָאתָ
  english_pob_choice: You found
  chosen_korean: 보셨고
  alternatives_korean:
  - 찾으셨고
  - 발견하셨고
  lexicon: HALOT
  rationale: מצא의 핵심은 단순한 인지보다 확인·판별의 뉘앙스를 포함하므로, 하나님이 그의 내면 상태를 알아보셨다는 의미를 자연스럽게 살려 ‘보셨고’로 옮겼습니다.
- source_word: לְבָבוֹ נֶאֱמָן
  english_pob_choice: his heart faithful
  chosen_korean: 그의 마음이 … 신실한
  alternatives_korean:
  - 그의 마음이 … 충실한
  - 그의 심장이 … 믿을 만한
  lexicon: HALOT
  rationale: לֵבָב은 외적 기관이 아니라 인격의 중심을 가리키므로 ‘마음’이 적절하고, נֶאֱמָן은 언약적 충성의 성격을 살려 ‘신실한’으로 옮겼습니다.
- source_word: לְזַרְעוֹ
  english_pob_choice: to his offspring
  chosen_korean: 그의 씨에게
  alternatives_korean:
  - 그의 후손에게
  - 그의 자손에게
  lexicon: HALOT
  rationale: זֶרַע는 집합적 단수로서 혈통과 약속의 계승을 함께 담으므로, 번역어로는 더 직역적인 ‘씨’가 원문의 집합적 힘을 가장 잘 보존합니다.
- source_word: וַתָּקֶם אֶת דְּבָרֶיךָ
  english_pob_choice: And you have fulfilled your words
  chosen_korean: 주께서는 주의 말씀을 이루셨으니
  alternatives_korean:
  - 주께서는 주의 말씀을 세우셨으니
  - 주께서는 주의 말씀을 확증하셨으니
  lexicon: HALOT
  rationale: קום이 ‘말씀’과 함께 쓰일 때는 단순한 존재 확립보다 실현·성취의 뜻이 강하므로, 문맥상 더 자연스러운 ‘이루셨다’를 택했습니다.
- source_word: כִּי צַדִּיק אָתָּה
  english_pob_choice: for you are righteous
  chosen_korean: 주께서 의로우시기 때문입니다
  alternatives_korean:
  - 주께서 공의로우시기 때문입니다
  - 주께서 의인이시기 때문입니다
  lexicon: HALOT
  rationale: צַדִּיק은 여기서 하나님의 언약 성취를 뒷받침하는 도덕적·언약적 성품을 가리키므로, 한국어에서는 ‘의로우시다’가 가장 넓고 안정적인 대응입니다.
theological_decisions:
- issue: “씨”와 “후손”의 선택
  chosen_reading: 본문은 זֶרַע의 집합적 단수를 살려 ‘씨’로 두었습니다.
  alternative_readings:
  - 의미를 풀어 ‘후손’으로 옮길 수 있습니다.
  - ‘자손’도 가능하지만 더 일반적입니다.
  rationale: 이 문맥은 약속의 대상과 계승을 동시에 담고 있어, 해석을 과도하게 풀기보다 원문의 집합적 표현을 보존하는 편이 더 투명합니다.
  doctrine_reference: 언약 약속과 언약 계승 표현을 원문 구조대로 보존하는 번역 원칙
- issue: צַדִּיק의 신학적 색조
  chosen_reading: 하나님을 ‘의로우시다’로 번역해 언약 성취의 근거를 살렸습니다.
  alternative_readings:
  - ‘공의로우시다’는 재판적 뉘앙스를 더 강하게 줍니다.
  - ‘정의로우시다’는 현대어로는 다소 사회윤리적입니다.
  rationale: 본문은 하나님이 약속을 지키신 사실을 찬양하므로, משפט적 ‘정의’보다 언약적·도덕적 폭이 넓은 ‘의’가 더 적절합니다.
  doctrine_reference: צדק/δικαιοσύνη 계열을 기본적으로 ‘의’로 두는 번역 일관성
