  source_fidelity: 개정이 필요합니다. 초안의 ‘가나안 사람 … 기르가스 사람의 땅을 주시고’는 문법상 하나님께서 그 민족들에게 땅을 주신 것으로 읽힐 수 있습니다. 히브리어는 그 민족들의 땅을 아브라함의 후손에게 주겠다는 언약의 내용입니다. 이를 명확히 해야 합니다. ‘보셨고’는 מצא의 판별적 의미를 자연스럽게 나타낼 수 있으며, ‘말씀을 이루셨으니’와 ‘의로우시기 때문입니다’도 문맥에 충실합니다.
  naturalness: ‘그의 씨에게’는 한국어 성경 문맥에서는 가능하지만 현대 표준어의 본문으로는 다소 부자연스럽고 의미가 즉시 분명하지 않습니다. ‘그의 자손에게’가 집합적 의미를 자연스럽고 정확하게 전달합니다. 언약의 목적절을 한 문장으로 정리하면 수식 관계도 분명해집니다.
  terminology: ‘언약’, ‘신실한’, ‘자손’, ‘말씀을 이루셨다’, ‘의로우시다’는 적절합니다. 민족명은 통용 표기를 유지했습니다. זֶרַע의 집합적 단수라는 정보는 ‘자손’에 붙인 각주로 보존합니다.
