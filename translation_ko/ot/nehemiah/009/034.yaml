id: NEH.9.34
reference: Nehemiah 9:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
  footnotes:
  - marker: a
    text: Or 'our ancestors.' The Hebrew is literally 'our fathers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'did not listen to' or 'did not heed.'
    reason: lexical_alternative
  - marker: c
    text: '''Testimonies'' refers to God''s covenantal witness and solemn charges; the clause may also be rendered, ''which you testified against them with.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 왕들[a], 우리의 관리들, 우리의 제사장들, 그리고 우리의 조상들은 당신의 율법[c][b]을 지키지 않았고, 당신의 계명들과 그들에게 경고하신 증언들에 귀를 기울이지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 조상들’. 히브리어는 문자적으로 ‘우리의 아버지들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘귀를 기울이지 않았습니다’의 더 직접적인 표현으로 ‘듣지 않았습니다’가 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘증언들’은 하나님의 언약적 증언과 엄숙한 경고를 가리킵니다. 이 절은 ‘당신이 그들에게 증언으로 경고하신 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת מְלָכֵינוּ
  english_pob_choice: Even our kings
  chosen_korean: 우리 왕들
  alternatives_korean:
  - 심지어 우리 왕들
  - 그리고 우리 왕들
  lexicon: HALOT
  rationale: 열거에 추가되는 집단을 한국어에서는 별도의 강조어 없이 자연스럽게 풀어도 되지만, 문맥상 열거 확대의 느낌을 살리기 위해 앞에 주어를 바로 두었습니다.
- source_word: שָׂרֵינוּ
  english_pob_choice: our officials
  chosen_korean: 우리의 관리들
  alternatives_korean:
  - 우리의 통치자들
  - 우리의 지도자들
  - 우리의 방백들
  lexicon: HALOT
  rationale: שָׂרִים은 왕권 아래의 행정·통치 담당자를 가리키므로, 현대 한국어에서는 ‘관리들’이 문맥상 가장 자연스럽고 중립적입니다.
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  english_pob_choice: did not keep your law
  chosen_korean: 당신의 율법을 지키지 않았고
  alternatives_korean:
  - 당신의 율법을 행하지 않았고
  - 당신의 가르침을 지키지 않았고
  lexicon: HALOT
  rationale: עָשָׂה + תּוֹרָה는 단순히 ‘하다’가 아니라 언약적 의미의 준수/순종을 뜻하므로 ‘지키다’로 옮겼습니다. תּוֹרָה는 이 언약 고백 문맥에서 ‘율법’이 가장 적절합니다.
- source_word: הִקְשִׁיבוּ
  english_pob_choice: did not listen to
  chosen_korean: 귀를 기울이지 않았습니다
  alternatives_korean:
  - 듣지 않았습니다
  - 주의를 기울이지 않았습니다
  - 귀담아듣지 않았습니다
  lexicon: HALOT
  rationale: הִקְשִׁיבוּ는 단순 청취보다 주의 깊은 경청/경고에 대한 응답을 뜻하므로, 현대 한국어에서 가장 자연스러운 ‘귀를 기울이다’로 옮겼습니다.
- source_word: וּלְעֵדְוֺתֶיךָ אֲשֶׁר הַעִידֹתָ בָּהֶם
  english_pob_choice: and your testimonies with which you warned them
  chosen_korean: 당신의 증언들과 그들에게 경고하신 것들에
  alternatives_korean:
  - 당신의 증언들과 그들을 향해 경고하신 것들에
  - 당신의 증언들과 그들에 대하여 경고하신 것들에
  lexicon: HALOT
  rationale: עֵדוֹת은 단순 규례보다 하나님의 언약적 증언/증거의 성격을 가지므로 ‘증언들’로 유지했습니다. הַעִידֹתָ는 ‘증언하다/경고하다’의 뜻을 포함하므로, 본문 의미를 살려 ‘경고하신 것들’로 옮겼습니다.
theological_decisions:
- issue: אָבוֹת의 번역
  chosen_reading: 조상들
  alternative_readings:
  - 우리의 아버지들
  - 우리 조상들
  rationale: 히브리어는 문자적으로 ‘아버지들’이지만, 이 문맥은 세대적·역사적 선조를 가리키므로 한국어에서는 뜻을 분명히 하는 ‘조상들’이 더 자연스럽습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: עֵדוֹת과 הַעִידֹתָ의 관계
  chosen_reading: 증언들 / 경고하신 것들
  alternative_readings:
  - 증언들 / 증언하신 것들
  - 증거들 / 경고하신 것들
  rationale: 같은 어근 계열을 한국어에서도 어느 정도 드러내되, 한국어 문장 자연성을 위해 후반 절은 ‘경고’의 기능을 분명히 했습니다. 이렇게 해야 언약적 증언과 경고의 중첩이 유지됩니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
