revisions:
- from: 그렇기에 주께서 그들을 그들의 대적들의 손에 넘기시자, 그들이 그들을 압제하였습니다. 그러나 그들의 고난의 때에 그들이 주께 부르짖으니, 주께서는 하늘에서 들으셨고, 주의 크신 긍휼에 따라 그들에게 구원자들을 주셨으며, 그들이 그들을 그들의 대적들의 손에서 구원하였습니다.[a]
  to: 그러므로 주께서는 그들을 대적들의 손에 넘기셨고, 대적들은 그들을 압제하였습니다. 그러나 그들이 고난을 당할 때에 주께 부르짖으면, 주께서는 하늘에서 들으시고 주의 크신 긍휼을 따라 그들에게 구원자들을[a] 주셨으며, 그 구원자들은 그들을 대적들의 손에서 구원하였습니다.
  rationale: 원문의 반복적 역사 서술과 인칭 관계를 보존하면서, 한국어에서 모호한 대명사를 ‘대적들’과 ‘그 구원자들’로 명시했습니다. ‘넘기셨고’로 접속하여 원문에 없는 즉시성의 함의를 피했으며, 각주 표지를 설명 대상인 ‘구원자들’에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:52Z'
