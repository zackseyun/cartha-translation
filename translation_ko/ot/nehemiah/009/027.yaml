base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
  footnotes:
  - marker: a
    text: Or 'saviors.' The Hebrew word is from the verb 'to save' and refers here to human agents God raised up to rescue them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇기에 주께서 그들을 그들의 대적들의 손에 넘기시자, 그들이 그들을 압제하였습니다. 그러나 그들의 고난의 때에 그들이 주께 부르짖으니, 주께서는 하늘에서 들으셨고, 주의 크신 긍휼에 따라 그들에게 구원자들을 주셨으며, 그들이 그들을 그들의 대적들의 손에서 구원하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구원자들’은 히브리어 동사 ‘구원하다’에서 나온 말로, 여기서는 하나님이 일으키신 인간 구원자를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  english_pob_choice: you gave them into the hand of
  chosen_korean: 그들을 그들의 대적들의 손에 넘기시자
  alternatives_korean:
  - 그들을 그들의 대적들의 손에 주시자
  - 그들을 그들의 대적들의 권세 아래 두시자
  lexicon: HALOT
  rationale: נתן의 문맥상 의미는 단순한 ‘주다’보다 ‘넘기다/넘겨주다’에 가깝고, ‘손에’라는 히브리어 관용구를 그대로 살리는 것이 원문의 권력·통제 이미지를 보존합니다.
- source_word: צָרֵיהֶם / צָרֵי־
  english_pob_choice: their adversaries
  chosen_korean: 그들의 대적들
  alternatives_korean:
  - 그들의 적들
  - 그들의 원수들
  lexicon: HALOT
  rationale: צָרֵי는 단순한 일반적 ‘적’보다 대항하고 압박하는 상대를 가리키므로, 문맥과 병행어를 살려 ‘대적들’로 옮겼습니다.
- source_word: וַיָּצֵרוּ לָהֶם
  english_pob_choice: who oppressed them
  chosen_korean: 그들이 그들을 압제하였습니다
  alternatives_korean:
  - 그들이 그들을 괴롭혔습니다
  - 그들이 그들을 곤경에 빠뜨렸습니다
  lexicon: HALOT
  rationale: 동사의 압박·괴롭힘 의미를 한국어에서 가장 자연스럽게 드러내는 표현은 ‘압제하다’이며, 역사적 구원 서술의 강도를 유지합니다.
- source_word: מֹשִׁיעִים
  english_pob_choice: deliverers
  chosen_korean: 구원자들
  alternatives_korean:
  - 구해 주는 이들
  - 구출자들
  - 구세주들
  lexicon: HALOT
  rationale: 이 단어는 하나님이 일으키신 인간 도구를 가리키므로, 메시아적 호칭으로 오해될 수 있는 ‘구세주들’보다 기능을 드러내는 ‘구원자들’이 적절합니다.
- source_word: וְיוֹשִׁיעוּם
  english_pob_choice: who saved them
  chosen_korean: 그들이 그들을 구원하였습니다
  alternatives_korean:
  - 그들이 그들을 건져 주었습니다
  - 그들이 그들을 구출하였습니다
  lexicon: HALOT
  rationale: ישׁע의 핵심 의미를 직접 살리되, 앞의 ‘구원자들’과 어휘 대응을 이루도록 ‘구원하다’로 옮겼습니다.
theological_decisions:
- issue: 하나님이 ‘구원자들’을 주시는 표현의 신학적 긴장
  chosen_reading: 하나님께서 인간 구원자들을 세워 백성을 건지시는 역사적 구원으로 읽습니다.
  alternative_readings:
  - ‘구원자들’을 추상적으로 ‘구원’으로 완화하는 읽기
  - 메시아적 단수 호칭으로 오해하는 읽기
  rationale: 본문은 하나님 자신이 아니라 하나님이 세우신 인간 매개자를 말하므로, 인간 도구성과 하나님의 주권을 함께 보존하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
