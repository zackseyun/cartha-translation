- source_word: עֲזַבְתָּם
  english_pob_choice: did not abandon them
  chosen_korean: 그들을 광야에서 버리지 않으셨습니다
  alternatives_korean:
  - 그들을 광야에서 떠나지 않으셨습니다
  - 그들을 광야에서 버려 두지 않으셨습니다
  lexicon: HALOT
  rationale: עָזַב의 ‘떠나다/버리다’ 의미 가운데, 언약적 배반의 부정을 분명히 드러내는 ‘버리다’가 가장 적절합니다.
- source_word: עַמּוּד הֶעָנָן / עַמּוּד הָאֵשׁ
  english_pob_choice: the pillar of cloud / the pillar of fire
  chosen_korean: 구름기둥 / 불기둥
  alternatives_korean:
  - 구름의 기둥 / 불의 기둥
  - 구름으로 된 기둥 / 불로 된 기둥
  lexicon: HALOT
  rationale: 출애굽 전승의 고정 표현을 살려, 독자가 즉시 본문 상호연결을 인식할 수 있도록 표준적인 ‘구름기둥/불기둥’을 사용했습니다.
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  english_pob_choice: to lead them on the way
  chosen_korean: 그들을 길로 인도하였고
  alternatives_korean:
  - 그들을 길에서 인도하였고
