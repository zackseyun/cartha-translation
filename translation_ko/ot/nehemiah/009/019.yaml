  text: וְ/אַתָּה֙ בְּ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֔ים לֹ֥א עֲזַבְתָּ֖/ם בַּ/מִּדְבָּ֑ר אֶת עַמּ֣וּד הֶ֠/עָנָן לֹא סָ֨ר מֵ/עֲלֵי/הֶ֤ם בְּ/יוֹמָם֙ לְ/הַנְחֹתָ֣/ם בְּ/הַ/דֶּ֔רֶךְ וְ/אֶת עַמּ֨וּד הָ/אֵ֤שׁ בְּ/לַ֨יְלָה֙ לְ/הָאִ֣יר לָ/הֶ֔ם וְ/אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
  footnotes:
  - marker: a
    text: Or 'in your great compassion.' The Hebrew uses a plural noun, literally 'in your many mercies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님, 주님의 풍성한 긍휼로 그들을 광야에서 버리지 않으셨습니다. 구름기둥은 낮에 그들 위에서 떠나지 않아 그들을 길로 인도하였고, 불기둥은 밤에 그들을 비추어 그들이 가야 할 길을 밝혀 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘주님의 많은 긍휼들’이라는 복수 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  english_pob_choice: in your abundant mercies
  chosen_korean: 주님의 풍성한 긍휼로
  alternatives_korean:
  - 주님의 많은 긍휼로
  - 주님의 큰 긍휼로
  lexicon: HALOT
  rationale: 히브리어 복수형 רַחֲמִים과 형용사 הָרַבִּים를 함께 살려, ‘긍휼’의 풍성함과 다중성을 자연스러운 한국어로 옮겼습니다.
- source_word: עֲזַבְתָּם
  english_pob_choice: did not abandon them
  chosen_korean: 그들을 광야에서 버리지 않으셨습니다
  alternatives_korean:
  - 그들을 광야에서 떠나지 않으셨습니다
  - 그들을 광야에서 버려 두지 않으셨습니다
  lexicon: HALOT
  rationale: עָזַב의 ‘떠나다/버리다’ 의미 가운데, 언약적 배반의 부정을 분명히 드러내는 ‘버리다’가 가장 적절합니다.
- source_word: עַמּוּד הֶעָנָן / עַמּוּד הָאֵשׁ
  english_pob_choice: the pillar of cloud / the pillar of fire
  chosen_korean: 구름기둥 / 불기둥
  alternatives_korean:
  - 구름의 기둥 / 불의 기둥
  - 구름으로 된 기둥 / 불로 된 기둥
  lexicon: HALOT
  rationale: 출애굽 전승의 고정 표현을 살려, 독자가 즉시 본문 상호연결을 인식할 수 있도록 표준적인 ‘구름기둥/불기둥’을 사용했습니다.
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  english_pob_choice: to lead them on the way
  chosen_korean: 그들을 길로 인도하였고
  alternatives_korean:
  - 그들을 길에서 인도하였고
  - 그들을 그 길로 안내하였고
  lexicon: HALOT
  rationale: הנח의 ‘인도하다/이끌다’ 의미를 살려 간결하게 옮겼고, בְּהַדֶּרֶךְ는 한국어 관용에 맞게 ‘길로’로 자연화했습니다.
- source_word: לְהָאִיר לָהֶם וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  english_pob_choice: to give them light in the way in which they should go
  chosen_korean: 그들이 가야 할 길을 밝혀 주었습니다
  alternatives_korean:
  - 그들이 가야 할 길에 빛을 비추었습니다
  - 그들이 가야 할 길과 그 길을 비추었습니다
  lexicon: HALOT
  rationale: ‘빛을 주다’의 기능적 의미를 살리되, 본문의 핵심인 ‘가야 할 길’이 밝혀진다는 뜻을 한국어로 압축해 전달했습니다.
theological_decisions:
- issue: 여호와 이름의 처리와 시적 호칭
  chosen_reading: 본문의 2인칭 호칭을 ‘주님’으로 옮기고, 시적 회고 문맥을 유지했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절은 직접적인 YHWH 표기가 아니라 2인칭 خطاب이므로, 한국어 기도·회고 문맥에 맞는 ‘주님’이 가장 자연스럽습니다.
  doctrine_reference: POB 구약 인칭 호칭 처리 원칙
