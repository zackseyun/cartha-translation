  source_fidelity: 초안은 광야에서 버리지 않으심, 구름기둥과 불기둥, 낮과 밤의 인도라는 핵심을 충실히 담고 있습니다. 그러나 히브리어에서 ‘떠나지 않았다’는 진술은 구름기둥뿐 아니라 불기둥에도 병렬적으로 적용됩니다. 초안은 불기둥에 관해서는 그 지속적 임재를 명시하지 않습니다. 또한 불기둥의 목적어는 ‘그들에게’와 ‘그들이 가야 할 길’에 함께 빛을 비추는 병렬 구조인데, 이를 길만 밝힌 것으로 축소하지 않는 편이 더 가깝습니다.
  naturalness: ‘낮에는 …, 밤에는 …’의 병렬 구성이 현대 표준 한국어에서 자연스럽고 원문의 대조와 반복을 잘 드러냅니다. ‘그들에게 빛을 비추고 그들이 가야 할 길을 밝혀’는 사람과 길 모두에 대한 조명을 자연스럽게 표현합니다.
  terminology: ‘주님’, ‘긍휼’, ‘광야’, ‘구름기둥’, ‘불기둥’은 합쇼체 문맥 및 성서 한국어 용례에 적절합니다. ‘풍성한 긍휼’은 히브리어의 복수형을 한국어에서 자연스럽게 집합적으로 표현한 것으로, 각주가 이를 보완합니다.
