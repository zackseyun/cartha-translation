base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
  footnotes:
  - marker: a
    text: Or 'in your great compassion.' The Hebrew uses a plural noun, literally 'in your many mercies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주님, 주님의 풍성한 긍휼로 그들을 광야에서 버리지 않으셨습니다. 낮에는 구름기둥이 그들 위에서 떠나지 않고 그들을 길을 따라 인도하였으며, 밤에는 불기둥이 그들 위에서 떠나지 않고 그들에게 빛을 비추며 그들이 가야 할 길을 밝혀 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘주님의 많은 긍휼들’이라는 복수 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
