  to: 그러나 주님, 주님의 풍성한 긍휼로 그들을 광야에서 버리지 않으셨습니다. 낮에는 구름기둥이 그들 위에서 떠나지 않고 그들을 길을 따라 인도하였으며, 밤에는 불기둥이 그들 위에서 떠나지 않고 그들에게 빛을 비추며 그들이 가야 할 길을 밝혀 주었습니다.[a]
