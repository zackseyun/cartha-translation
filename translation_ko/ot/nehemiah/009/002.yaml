  text: 그리하여 이스라엘의 씨는 모든 이방 사람들로부터 분리되었고, 그들은 서서 자기들의 죄와 자기들의 조상들의 죄악을 자백했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
