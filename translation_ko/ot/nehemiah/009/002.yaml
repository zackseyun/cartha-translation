  rationale: ‘죄’와 ‘죄악’을 구분해 두 히브리어 명사를 함께 살리면서, 조상들의 범죄를 공동체 고백의 대상으로 유지했습니다.
theological_decisions:
- issue: 공동체적 회개와 조상들의 죄 고백
  chosen_reading: 본문은 자기 죄와 조상들의 죄악을 함께 자백하는 공동체적 회개를 말합니다.
  alternative_readings:
  - 단지 과거사를 인정하는 수준으로 볼 수 있습니다
  - 조상들의 죄는 자기 책임이 아니므로 고백 대상이 아니라고 제한할 수 있습니다
  rationale: 동사 ‘자백하다’가 두 목적어를 함께 취하므로, 본문이 개인적 죄책만이 아니라 언약 공동체의 연속성 안에서 조상들의 죄까지 고백하게 함을 그대로 드러냈습니다.
  doctrine_reference: 공동체적 회개와 언약적 연대
