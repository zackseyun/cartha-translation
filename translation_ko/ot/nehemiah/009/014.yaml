id: NEH.9.14
reference: Nehemiah 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת שַׁבַּ֥ת קָדְשְׁ/ךָ֖ הוֹדַ֣עַתָ לָ/הֶ֑ם וּ/מִצְו֤וֹת וְ/חֻקִּים֙ וְ/תוֹרָ֔ה צִוִּ֣יתָ לָ/הֶ֔ם בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
  footnotes:
  - marker: a
    text: Or 'instruction' for 'law' (תוֹרָה), highlighting teaching as well as legal obligation.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'by the hand of Moses your servant,' an idiom meaning 'through Moses your servant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 주의 거룩한 안식을 그들에게 알게 하셨으며, 모세 주의 종의 손을 통해 그들에게 계명들과 규례들과 율법을 명령하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가르침’. 히브리어 תּוֹרָה는 ‘법’뿐 아니라 ‘지시/가르침’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모세 주의 종의 손으로’입니다. 여기서는 매개를 뜻하는 관용구로 이해해 ‘통해’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  english_pob_choice: your holy Sabbath
  chosen_korean: 주의 거룩한 안식
  alternatives_korean:
  - 주의 거룩한 안식일
  - 주의 성스러운 안식일
  lexicon: HALOT
  rationale: שַׁבַּת는 안식/안식일 범주를 가리키지만, 본문은 ‘거룩한’이라는 속성을 붙여 언약적 예배 의미를 강조하므로 ‘주의 거룩한 안식’으로 옮겼습니다.
- source_word: הוֹדַעַתָ
  english_pob_choice: made ... known
  chosen_korean: 알게 하셨으며
  alternatives_korean:
  - 알려 주셨으며
  - 드러내셨으며
  lexicon: HALOT
  rationale: 히필형 ידע의 사역적 의미를 살려 ‘알게 하다’로 옮겼고, 수신자에게 인지시키는 행위를 자연스럽게 드러냈습니다.
- source_word: מִצְוֹת וְחֻקִּים וְתוֹרָה
  english_pob_choice: commandments and statutes and a law
  chosen_korean: 계명들과 규례들과 율법
  alternatives_korean:
  - 명령들과 규례들과 법
  - 계명들과 법도들과 가르침
  lexicon: HALOT
  rationale: 세 항목의 법적·언약적 구분을 살리되, תּוֹרָה는 이 문맥에서 ‘율법’이 가장 직접적이어서 기존 성경 용례와도 맞게 옮겼습니다.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  english_pob_choice: by the hand of Moses your servant
  chosen_korean: 모세 주의 종의 손을 통해
  alternatives_korean:
  - 모세 주의 종을 통해
  - 모세 주의 종의 손으로
  lexicon: HALOT
  rationale: בְּיַד의 관용적 매개 의미를 살리면서도 한국어에서 이해되도록 ‘손을 통해’로 옮겼고, עַבְדֶּךָ는 전통적이지만 직접적인 ‘주의 종’으로 유지했습니다.
theological_decisions:
- issue: תּוֹרָה의 번역 범위
  chosen_reading: 이 절에서는 ‘율법’으로 번역해 계명들과 규례들과 나란한 법적 계시의 성격을 드러냈습니다.
  alternative_readings:
  - ‘가르침’으로 옮겨 교육적 의미를 강조할 수 있습니다.
  - ‘법’으로 옮겨 보다 일반적 규범성을 나타낼 수 있습니다.
  rationale: 문맥이 모세를 통한 언약 규정 전달을 말하므로, ‘율법’이 단순한 교훈보다 본문의 법정적·언약적 무게를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §5 (Consistency of key terms, or documented exception)
