base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the heavens of heavens,'' an idiom meaning ''the highest heavens.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'you give life to all of them' / 'you keep them all alive.'
    reason: alternative_reading
  - marker: c
    text: Or 'the heavenly host bows down to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 주님만이 야훼이십니다. 주님께서는 하늘과 가장 높은 하늘[a]과 그 모든 군대를, 땅과 그 위에 있는 모든 것을, 바다와 그 안에 있는 모든 것을 만드셨습니다. 또 주님께서는 이 모든 것을 살아 있게 하시며[b], 하늘의 군대는 주님께 절합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘하늘들의 하늘’이며, 가장 높은 하늘을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 모든 것에 생명을 주시며’, ‘이 모든 것을 살려 두시며’.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘하늘의 군대’는 ‘하늘의 천체와 천상 존재들’을 포괄할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/전통 구별
  rationale: 고유한 신적 이름을 본문대로 드러내기 위해 관용적 호칭인 ‘주님’이 아니라 음역형 ‘야훼’를 사용했습니다.
- source_word: שְׁמֵי הַשָּׁמַיִם
  english_pob_choice: the highest heavens
  chosen_korean: 하늘들의 하늘
  alternatives_korean:
  - 가장 높은 하늘
  - 하늘의 하늘
  lexicon: HALOT
  rationale: 히브리어의 중첩된 최고급 표현을 직역에 가깝게 살리되, 한국어에서도 성경적 울림이 유지되는 ‘하늘들의 하늘’로 옮겼습니다.
- source_word: מְחַיֶּה אֶת כֻּלָּם
  english_pob_choice: preserve all of them alive
  chosen_korean: 이 모든 것을 살게 하시며
  alternatives_korean:
  - 이 모든 것을 생명 있게 하시며
  - 이 모든 것을 살려 두시며
  lexicon: HALOT
  rationale: ‘살게 하시다’는 창조 이후의 지속적 생명 부여/보존을 함께 담아, 본문의 지속적 섭리를 자연스럽게 표현합니다.
- source_word: וּצְבָא הַשָּׁמַיִם
  english_pob_choice: the host of heaven
  chosen_korean: 하늘 군대
  alternatives_korean:
  - 하늘의 군대
  - 하늘의 군대들
  lexicon: HALOT
  rationale: ‘צָבָא’의 군집·군대 이미지를 살리되, 한국어에서 천체와 천사적 존재를 함께 포괄하는 성경적 표현으로는 ‘하늘 군대’가 간결합니다.
- source_word: מִשְׁתַּחֲוִים
  english_pob_choice: bows down to you
  chosen_korean: 주님께 절합니다
  alternatives_korean:
  - 주님께 엎드려 절합니다
  - 주님께 경배합니다
  lexicon: HALOT
  rationale: 히브리어의 몸을 낮추는 동작을 우선 살리기 위해 ‘절합니다’를 택했고, 예배적 의미는 문맥상 자연스럽게 드러납니다.
theological_decisions:
- issue: יהוה를 본문에서 어떻게 드러낼지
  chosen_reading: ‘오직 주님만이 야훼이십니다’로 이름과 호칭을 함께 제시했습니다.
  alternative_readings:
  - 오직 야훼만이 주님이십니다
  - 주님만이 야훼이십니다
  rationale: 문맥의 선언적 강조를 살리면서도, 독자가 이름(야훼)과 호칭(주님)의 구분을 함께 파악하도록 했습니다.
  doctrine_reference: 'POB name-rendering policy: YHWH -> 야훼; maintain source-text emphasis'
- issue: מְחַיֶּה의 의미를 생명 부여와 보존 중 어디에 둘지
  chosen_reading: ‘이 모든 것을 살게 하시며’로 창조 후 지속적 생명 유지까지 포함해 옮겼습니다.
  alternative_readings:
  - 이 모든 것을 살려 두시며
  - 이 모든 것에 생명을 주시며
  rationale: 본문은 단순 창조 진술이 아니라 창조된 만물을 계속 붙드시는 하나님의 섭리를 말하므로, 두 의미를 과도하게 분리하지 않았습니다.
  doctrine_reference: 'Providence in creation: preserve theological tension rather than over-resolve'
