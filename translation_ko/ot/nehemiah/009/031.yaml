id: NEH.9.31
reference: Nehemiah 9:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
  footnotes:
  - marker: a
    text: Or, 'Yet in your great mercies you did not destroy them completely or forsake them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 주께서는 주의 풍성한 긍휼로 그들을 완전히 멸하지도 않으시고 버리지도 않으셨습니다. 이는 주께서 은혜로우시고 긍휼이 많으신 하나님이시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그러나 주의 큰 긍휼로 그들을 완전히 멸하지도 않고 저버리지도 않으셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  english_pob_choice: But in your abundant mercies
  chosen_korean: 그러나 주께서는 주의 큰 긍휼로
  alternatives_korean:
  - 그러나 주의 많은 긍휼로
  - 그렇지만 주의 풍성한 긍휼로
  lexicon: HALOT
  rationale: רַחֲמִים의 복수성과 הָרַבִּים의 증강 의미를 살려 ‘큰 긍휼’로 옮겼습니다. 문맥상 앞선 죄와 심판의 흐름을 거슬러 하나님의 자비를 대비시키므로 ‘그러나’가 자연스럽습니다.
- source_word: לֹא עֲשִׂיתָם כָּלָה
  english_pob_choice: you did not make an end of them
  chosen_korean: 그들을 완전히 멸하지도 않으셨고
  alternatives_korean:
  - 그들을 끝내지 않으셨고
  - 그들을 전멸시키지 않으셨고
  lexicon: HALOT
  rationale: ‘עשה כלה’의 관용구는 ‘완전히 끝장내다/멸절하다’의 뜻이므로, ‘완전히 멸하지 않으셨고’로 옮겨 완결성과 강도를 함께 살렸습니다.
- source_word: וְלֹא עֲזַבְתָּם
  english_pob_choice: or abandon them
  chosen_korean: 버리지도 않으셨습니다
  alternatives_korean:
  - 떠나지도 않으셨습니다
  - 내버려 두지도 않으셨습니다
  lexicon: HALOT
  rationale: עָזַב는 ‘떠나다, 버리다, 저버리다’의 뜻이 있어, 현대 한국어에서 명확한 ‘버리다’를 사용했습니다. 앞절과 평행을 이루도록 ‘-지도 않으셨습니다’로 맞췄습니다.
- source_word: חַנּוּן וְרַחוּם
  english_pob_choice: gracious and compassionate
  chosen_korean: 은혜로우시며 긍휼이 많으신
  alternatives_korean:
  - 은혜로우시며 자비로우신
  - 은혜로우시며 불쌍히 여기시는
  lexicon: HALOT
  rationale: 관용적 신적 성품 공식의 두 형용사를 구분해, חַנּוּן은 ‘은혜로우시며’, רַחוּם은 ‘긍휼이 많으신’으로 살렸습니다. 두 표현을 같은 뜻으로 합치지 않고 분리해 문구의 반복적 강조를 보존했습니다.
theological_decisions:
- issue: יאָתָּה־־의 보격적 진술을 한국어에서 어떻게 처리할지
  chosen_reading: ‘주께서 … 하나님이시기 때문입니다’로 원인절을 유지해 하나님의 성품 선언을 분명히 했습니다.
  alternative_readings:
  - ‘주께서는 … 하나님이십니다’로 단순 평서
  - ‘이는 주께서 … 이시기 때문입니다’
  rationale: 히브리어는 독립대명사와 명사구를 통해 성품을 강조하는 보격 구조입니다. 한국어에서는 이유절로 풀어 쓰면 문맥상 앞선 보존 행위의 근거가 더 분명하게 드러납니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
