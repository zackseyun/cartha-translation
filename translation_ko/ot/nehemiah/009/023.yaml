source:
  edition: WLC
  text: וּ/בְנֵי/הֶ֣ם הִרְבִּ֔יתָ כְּ/כֹכְבֵ֖י הַ/שָּׁמָ֑יִם וַ/תְּבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר אָמַ֥רְתָּ לַ/אֲבֹתֵי/הֶ֖ם לָ/ב֥וֹא לָ/רָֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
  footnotes:
  - marker: a
    text: Or 'their sons' or 'their descendants.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'like the stars of the heavens,' echoing God's promise to the patriarchs.
    reason: cross_reference
  - marker: c
    text: Or 'and take possession of'; the verb can also be rendered 'inherit' in some contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 자녀를[a] 하늘의 별들처럼[b] 많게 하시고, 그들의 조상들에게 들어가 차지하라고[c] 말씀하신 땅으로 그들을 데려가셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자녀’는 여기서 ‘아들들’ 또는 ‘후손들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘의 별들처럼’은 족장들에게 하신 약속을 떠올리게 합니다.
    reason: cross_reference
  - marker: c
    text: ‘차지하라고’는 문맥에 따라 ‘유업으로 받으라고’ 또는 ‘점유하라고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  english_pob_choice: their children
  chosen_korean: 그들의 자녀
  alternatives_korean:
  - 그들의 아들들
  - 그들의 후손
  lexicon: HALOT
  rationale: בנים는 좁게는 아들들이지만, 민족의 번성과 맥락상 성별을 제한하지 않는 ‘자녀’가 가장 자연스럽고 원문의 가족적 의미를 살립니다.
- source_word: הִרְבִּיתָ
  english_pob_choice: you multiplied
  chosen_korean: 많게 하시고
  alternatives_korean:
  - 증가시키시고
  - 불어나게 하시고
  lexicon: HALOT
  rationale: 히필 형태의 רבה는 ‘많게 하다/증가시키다’의 직접적 인과를 나타내므로, 한국어에서는 동작의 결과를 살리는 ‘많게 하시고’로 옮겼습니다.
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  english_pob_choice: like the stars of the heavens
  chosen_korean: 하늘의 별들처럼
  alternatives_korean:
  - 하늘의 별처럼
  - 하늘의 별무리처럼
  lexicon: HALOT
  rationale: 영어 POB의 하늘-천체 이미지를 유지하되, 한국어에서 과도하게 문어적인 ‘하늘들의 별들’보다 자연스러운 ‘하늘의 별들처럼’으로 옮겼습니다.
- source_word: וַתְּבִיאֵם
  english_pob_choice: you brought them
  chosen_korean: 그들을 데려가셨습니다
  alternatives_korean:
  - 그들을 데려오셨습니다
  - 그들을 인도하여 데려가셨습니다
  lexicon: HALOT
  rationale: בוא의 히필은 ‘데려오다/가져오다’의 인과를 가지며, 여기서는 약속의 땅으로의 이끌림을 강조하므로 ‘데려가셨습니다’가 가장 자연스럽습니다.
- source_word: לָרָשֶׁת
  english_pob_choice: and possess
  chosen_korean: 차지하라고
  alternatives_korean:
  - 소유하라고
  - 유업으로 받으라고
  lexicon: HALOT
  rationale: ירשׁ은 문맥상 땅을 ‘차지하다/점유하다’의 의미가 두드러지므로, 약속의 땅에 대한 실제 점유를 드러내는 ‘차지하라고’를 택했습니다.
theological_decisions:
- issue: 아브라함 언약의 상호본문적 울림
  chosen_reading: ‘하늘의 별들처럼’과 ‘그들의 조상들’ 표현을 유지해, 하나님이 족장들에게 하신 약속의 기억을 드러냈습니다.
  alternative_readings:
  - ‘하늘의 별처럼’처럼 매끈하게 단순화하는 번역
  - ‘조상’ 대신 ‘선조’로 일반화하는 번역
  rationale: 이 구절은 하나님의 언약 신실하심을 회상하는 맥락이므로, 직설적이더라도 약속-성취의 연결을 희미하게 하지 않는 쪽이 본문의 신학적 무게를 보존합니다.
  doctrine_reference: 창 15:5; 22:17; 번역 철학 §§1, 5
