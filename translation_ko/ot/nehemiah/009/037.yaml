review_pass:
  verdict: revise
  source_fidelity: 본문의 인과관계(‘우리의 죄 때문에’), 하나님께서 왕들을 우리 위에 세우셨다는 진술, 왕들이 사람들의 몸과 가축을 임의로 다스린다는 내용, 그리고 큰 곤경이라는 결론을 충실히 옮겼습니다. ‘그 땅의’는 앞절의 땅을 가리키는 히브리어 여성 단수 접미사를 자연스럽게 밝혀 줍니다.
  naturalness: 전반적으로 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 각주 a의 표지는 조사 ‘에’ 앞이 아니라 완결된 원인구 뒤에 두는 편이 읽기와 표지 범위 면에서 더 명료합니다.
  terminology: ‘소출’, ‘왕들’, ‘몸’, ‘가축’, ‘큰 고통’은 문맥과 어휘에 적절합니다. 각주 b의 ‘우리의 사람들’은 ‘우리의 몸’의 대안으로는 집단 구성원을 뜻할 수 있어 부정확하므로, 문맥상 인격적 존재를 나타내는 ‘우리 자신들’로 바로잡는 것이 좋습니다.
  issues:
