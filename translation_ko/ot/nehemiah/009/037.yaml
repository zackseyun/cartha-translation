language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
  footnotes:
  - marker: a
    text: Or 'its yield' or 'its harvest'; the suffix refers to the land mentioned in the previous verse.
    reason: lexical_alternative
  - marker: b
    text: Or 'our persons'; Hebrew 'our bodies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅의 풍성한 소출은 우리의 죄 때문에[a] 당신께서 우리 위에 세우신 왕들에게 돌아갑니다. 그들은 우리의 몸과 우리의 가축을 자기 뜻대로[b] 다스리니, 우리는 큰 고통 가운데 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅의 소출’, ‘그 땅의 수확’. 여기의 접미사는 앞절에 언급된 땅을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리 자신들’. 히브리어는 직역하면 ‘우리의 몸들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ מַרְבָּה
  english_pob_choice: Its abundant produce
  chosen_korean: 그 땅의 풍성한 소출
  alternatives_korean:
  - 그 땅의 많은 소출
  - 그 땅의 풍성한 수확
  lexicon: HALOT
  rationale: תְבוּאָה는 땅의 소출/생산물을 가리키므로 ‘소출’로 옮기고, מַרְבָּה의 ‘풍성한’으로 다산성과 많음을 함께 살렸습니다.
- source_word: לַמְּלָכִים אֲשֶׁר נָתַתָּה עָלֵינוּ
  english_pob_choice: to the kings whom you have set over us
  chosen_korean: 우리 위에 세우신 왕들에게
  alternatives_korean:
  - 우리 위에 두신 왕들에게
  - 우리 위에 맡기신 왕들에게
  lexicon: HALOT
  rationale: נתן + עַל은 ‘~위에 세우다/배치하다’의 뜻이므로, 하나님의 주권적 배치를 드러내는 ‘세우신’이 가장 자연스럽습니다.
- source_word: בְּחַטֹּאותֵינוּ
  english_pob_choice: because of our sins
  chosen_korean: 우리의 죄 때문
  alternatives_korean:
  - 우리 죄로 인해
  - 우리의 죄 때문에
  lexicon: HALOT
  rationale: 전치사 ב의 원인적 용법을 한국어로 분명히 드러내기 위해 ‘죄 때문’으로 옮겼습니다.
- source_word: גְּוִיֹּתֵינוּ
  english_pob_choice: our bodies / our persons
  chosen_korean: 우리의 몸
  alternatives_korean:
  - 우리의 몸뚱이
  - 우리의 사람됨
  lexicon: HALOT
  rationale: גְּוִיָּה는 여기서 죽은 몸이 아니라 압제 아래 놓인 육체적 존재를 뜻하므로, 직역에 가까운 ‘몸’이 적절합니다.
- source_word: כִּרְצוֹנָם
  english_pob_choice: as they please
  chosen_korean: 자기 뜻대로
  alternatives_korean:
  - 마음대로
  - 제멋대로
  lexicon: HALOT
  rationale: 임의적 통치를 나타내는 표현이므로, 원어의 ‘의지/원함’을 살려 ‘자기 뜻대로’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 주권과 열방 왕들의 압제
  chosen_reading: 본문은 죄 때문에 하나님께서 왕들을 우리 위에 세우셨다고 말하면서도, 그들의 압제가 정당하다고 말하지는 않습니다.
  alternative_readings:
  - 하나님이 단지 허용하셨다는 읽기
  - 왕들의 행위를 하나님이 승인하셨다는 읽기
  rationale: נָתַתָּה עָלֵינוּ는 심판적 주권을 직접 진술하지만, 이어지는 압제 묘사는 그 행위의 도덕적 승인과는 구별됩니다.
  doctrine_reference: Translation philosophy §1, §3
