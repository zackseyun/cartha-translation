source:
  edition: WLC
  text: וַ/יָּק֨וּמוּ֙ עַל עָמְדָ֔/ם וַֽ/יִּקְרְא֗וּ בְּ/סֵ֨פֶר תּוֹרַ֧ת יְהוָ֛ה אֱלֹהֵי/הֶ֖ם רְבִעִ֣ית הַ/יּ֑וֹם וּ/רְבִעִית֙ מִתְוַדִּ֣ים וּ/מִֽשְׁתַּחֲוִ֔ים לַ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
  footnotes:
  - marker: a
    text: Or 'at their standing place' or possibly 'on their platform.' The Hebrew expression is somewhat compressed.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a fourth of the day' ... 'and a fourth'; that is, one quarter of the day was spent reading, and another quarter in confession and bowing down.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 제자리에 서서 야훼 그들의 하나님의 율법책에서 하루의 4분의 1 동안 읽었고, 또 다른 4분의 1 동안은 죄를 고백하며 야훼 그들의 하나님께 엎드려 경배했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 압축되어 있어 ‘그들의 서 있는 자리에서’ 또는 ‘그들의 단 위에서’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘하루의 4분의 1’이며, 곧 하루의 4분의 1은 읽기에, 또 다른 4분의 1은 죄 고백과 엎드림에 사용되었음을 뜻합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָ֔ם
  english_pob_choice: they stood in their place
  chosen_korean: 그들은 제자리에 서서
  alternatives_korean:
  - 그들은 그 자리에 섰고
  - 그들은 서 있던 자리에서
  lexicon: HALOT
  rationale: עַל עָמְדָם의 압축된 표현을 한국어에서는 자연스럽게 ‘제자리에 서서’로 옮겨, 실제 위치와 정해진 대열이라는 함의를 모두 살렸습니다.
- source_word: בְּסֵפֶר תּוֹרַת יְהוָה
  english_pob_choice: from the Book of the Law of Yahweh
  chosen_korean: 야훼 그들의 하나님의 율법책에서
  alternatives_korean:
  - 야훼 그들의 하나님의 율법에서
  - 야훼 그들의 하나님의 율법 두루마리에서
  lexicon: HALOT
  rationale: קרא עם בְּסֵפֶר는 ‘책에서 읽다’의 의미이므로 ‘율법책에서’로 자연스럽게 옮겼고, יְהוָה는 본문 원칙에 따라 ‘야훼’로 유지했습니다.
- source_word: רְבִעִית הַיּוֹם / וּרְבִעִית
  english_pob_choice: for a fourth of the day / and for another fourth
  chosen_korean: 하루의 4분의 1 동안 / 또 다른 4분의 1 동안
  alternatives_korean:
  - 하루의 4분의 1을 / 또 4분의 1을
  - 하루의 사분의 일 동안 / 또 다른 사분의 일 동안
  lexicon: HALOT
  rationale: 두 시간표현의 평행구조를 한국어에서도 분명히 드러내기 위해 ‘4분의 1’과 ‘또 다른 4분의 1’을 사용했습니다.
- source_word: מִתְוַדִּים וּמִשְׁתַּחֲוִים
  english_pob_choice: they were confessing and bowing down
  chosen_korean: 죄를 고백하며 … 엎드려 경배했습니다
  alternatives_korean:
  - 자백하며 … 절하며
  - 고백하며 … 몸을 굽혀 경배했습니다
  lexicon: HALOT
  rationale: מִתְוַדִּים는 단순한 ‘고백’보다 죄의 자백이 문맥상 분명하므로 ‘죄를 고백하며’로 구체화했고, מִשְׁתַּחֲוִים는 몸의 동작을 살리되 예배 의미가 드러나도록 ‘엎드려 경배했습니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 YHWH가 직접 나오므로 전통적 대치어 ‘주’보다 고유 신명인 ‘야훼’를 유지해, 이스라엘에게 계시된 언약적 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מִשְׁתַּחֲוִים의 동작성과 예배성
  chosen_reading: 엎드려 경배했습니다
  alternative_readings:
  - 경배했습니다
  - 절했습니다
  rationale: 본문은 단순한 내적 예배가 아니라 신체적 굴복을 동반한 경배를 말하므로, ‘엎드려’로 동작을 보존하면서 ‘경배했습니다’로 예배 맥락을 분명히 했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; do not paraphrase beyond the source'
