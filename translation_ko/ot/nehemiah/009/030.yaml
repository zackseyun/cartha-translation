base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
  footnotes:
  - marker: a
    text: Or 'and testified against them by your Spirit through your prophets.'
    reason: lexical_alternative
translation:
  language: ko
  text: 오랜 세월 동안 주께서는 그들에게 오래 참으셨고, 당신의 영으로 당신의 예언자들을 통해 그들에게 경고하셨으나 그들은 듣지 않았습니다. 그래서 주께서는 그들을 그 땅의 민족들의 손에 넘기셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 예언자들을 통해 당신의 영으로 그들에게 경고하셨으나.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם שָׁנִים רַבּוֹת
  english_pob_choice: For many years you were patient with them
  chosen_korean: 오랜 세월 동안 주께서는 그들에게 오래 참으셨고
  alternatives_korean:
  - 오랜 세월 동안 주께서는 그들 위에 시간을 끌고 계셨고
  - 오랜 세월 동안 주께서는 그들과 함께 참으셨고
  lexicon: HALOT
  rationale: משׁך עַל의 문맥상 뜻은 심판을 지연하며 오래 참으시는 태도이므로, 현대 한국어에서는 ‘오래 참으셨고’가 의미와 자연스러움을 함께 살립니다.
- source_word: בְּרוּחֲךָ
  english_pob_choice: by your Spirit
  chosen_korean: 당신의 영으로
  alternatives_korean:
  - 당신의 영으로써
  - 당신의 숨으로
  lexicon: HALOT
  rationale: 예언자들을 통한 책망/증언의 매개가 하나님의 영이라는 점을 살리되, 한국어에서는 불필요한 신학적 과장을 피하면서도 직접적으로 옮기기 위해 ‘당신의 영으로’로 번역했습니다.
- source_word: בְּיַד נְבִיאֶיךָ
  english_pob_choice: through your prophets
  chosen_korean: 당신의 예언자들을 통해
  alternatives_korean:
  - 당신의 예언자들의 손을 통해
  - 당신의 예언자들을 손으로
  lexicon: HALOT
  rationale: ‘~의 손으로’라는 히브리어 관용구는 대개 대리·매개를 뜻하므로, 현대 한국어에서는 ‘~을/를 통해’가 가장 정확하고 읽기 쉽습니다.
- source_word: וְלֹא הֶאֱזִינוּ
  english_pob_choice: but they would not listen
  chosen_korean: 그들은 듣지 않았습니다
  alternatives_korean:
  - 그들은 귀를 기울이지 않았습니다
  - 그들은 들으려 하지 않았습니다
  lexicon: HALOT
  rationale: האזין은 주의 깊게 듣는 것을 뜻하지만, 여기서는 반복된 경고를 거부한 뜻이 핵심이므로 간결한 부정형으로 처리했습니다.
- source_word: וַתִּתְּנֵם בְּיַד
  english_pob_choice: So you gave them into the hand of
  chosen_korean: 그래서 주께서는 그들을 그 땅의 민족들의 손에 넘기셨습니다
  alternatives_korean:
  - 그래서 주께서는 그들을 그 땅의 민족들의 손으로 넘기셨습니다
  - 그래서 주께서는 그들을 그 땅의 민족들에게 넘기셨습니다
  lexicon: HALOT
  rationale: ‘손에 넘기다’는 히브리어의 지배·처분 관용구를 한국어 성경 문체로도 자연스럽게 보존합니다.
theological_decisions:
- issue: רוּחַ의 성격
  chosen_reading: 여기서는 예언적 경고를 수행하는 하나님의 영으로 이해했습니다.
  alternative_readings:
  - 단순히 ‘기운’이나 ‘호흡’으로 보는 읽기
  - 예언자들의 내적 태도를 가리키는 표현으로 보는 읽기
  rationale: ‘당신의 영으로 당신의 예언자들을 통해’라는 결합은 예언 사역의 신적 기원을 가리키므로, 문맥상 성령적 의미를 분명히 드러내는 것이 타당합니다.
  doctrine_reference: Translation philosophy §3; prophetic revelation
- issue: ‘듣지 않았습니다’의 뉘앙스
  chosen_reading: 반복된 경고를 단순히 놓친 것이 아니라 거부했다는 뜻을 담았습니다.
  alternative_readings:
  - 중립적 사실 진술로서 ‘듣지 않았습니다’
  - ‘귀를 기울이지 않았습니다’처럼 더 관용적인 표현
  rationale: 회개를 촉구하는 문맥에서 불순종의 책임을 분명히 하는 것이 본문의 탄식과 고발의 힘을 살립니다.
  doctrine_reference: Covenant warning and disobedience
