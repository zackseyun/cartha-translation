id: NEH.9.10
reference: Nehemiah 9:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֹתֹ֨ת וּ/מֹֽפְתִ֜ים בְּ/פַרְעֹ֤ה וּ/בְ/כָל עֲבָדָי/ו֙ וּ/בְ/כָל עַ֣ם אַרְצ֔/וֹ כִּ֣י יָדַ֔עְתָּ כִּ֥י הֵזִ֖ידוּ עֲלֵי/הֶ֑ם וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
  footnotes:
  - marker: a
    text: Or 'dealt presumptuously against them.' The Hebrew verb can denote acting proudly, insolently, or presumptuously.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 바로와 그의 모든 신하와 그의 땅의 모든 백성에게 표적과 기사를 행하셨습니다. 이는 그들이 그들에게 교만하게 굴었음을 주께서 아셨기 때문입니다. 그래서 오늘날과 같이 주께서 스스로 이름을 내셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 주제넘게 굴했다.’ 히브리어 동사는 교만하게, 오만하게, 주제넘게 행하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן אֹתֹת וּמֹפְתִים
  english_pob_choice: You performed signs and wonders
  chosen_korean: 표적과 기사를 행하셨습니다
  alternatives_korean:
  - 표적과 놀라운 일을 보이셨습니다
  - 이적과 기사를 행하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘주다’는 여기서 문자적 제공보다 하나님의 능동적 행위를 가리키므로 ‘행하다’가 적절합니다. זוג(표적/기사)의 짝을 살려 사건의 계시성과 경이성을 함께 드러냈습니다.
- source_word: בְּפַרְעֹה ... וּבְכָל עֲבָדָיו ... וּבְכָל עַם אַרְצוֹ
  english_pob_choice: against Pharaoh, against all his servants, and against all the people of his land
  chosen_korean: 바로와 그의 모든 신하와 그의 땅의 모든 백성에게
  alternatives_korean:
  - 바로와 그의 모든 종들과 그의 땅의 모든 사람들에게
  - 바로와 그의 모든 신하들과 그의 나라의 모든 백성에게
  lexicon: HALOT
  rationale: 전치사 ב의 대적/향해짐의 뜻을 한국어 조사 ‘-에게’로 살렸습니다. עֲבָדִים은 궁정 맥락상 ‘신하’가 더 정확하고 자연스럽습니다.
- source_word: הֵזִידוּ עֲלֵיהֶם
  english_pob_choice: they acted arrogantly against them
  chosen_korean: 그들이 그들에게 교만하게 굴었음을
  alternatives_korean:
  - 그들이 그들을 향해 주제넘게 굴었음을
  - 그들이 그들에게 presumptuously 행했음을
  lexicon: HALOT
  rationale: הֵזִידוּ는 ‘교만하게/주제넘게 굴다’의 뜻을 가지므로, 현대어에서 읽히는 ‘교만하게 굴다’로 옮겼습니다. ‘그들에게’는 출애굽 맥락의 이스라엘을 가리키는 대상을 본문 수준에서 과도하게 풀지 않기 위해 유지했습니다.
- source_word: וַתַּעַשׂ לְךָ שֵׁם כְּהַיּוֹם הַזֶּה
  english_pob_choice: So you made a name for yourself, as it is to this day
  chosen_korean: 그래서 오늘날과 같이 주께서 스스로 이름을 내셨습니다
  alternatives_korean:
  - 그래서 오늘날까지 주께서 이름을 얻으셨습니다
  - 그래서 오늘날과 같이 주께서 이름을 만드셨습니다
  lexicon: HALOT
  rationale: ‘이름을 내다’는 히브리어 관용구인 명성/명예의 확립을 자연스럽게 반영합니다. ‘스스로’는 목적어 없는 재귀적 의미를 살리기 위한 보조 표현입니다.
theological_decisions:
- issue: הֵזִידוּ의 대상과 역사적 지시
  chosen_reading: ‘그들에게’는 바로와 애굽이 하나님의 백성에게 대적하고 교만하게 군 것을 가리킵니다.
  alternative_readings:
  - 대상을 더 넓게 하나님께 대한 교만으로 볼 수 있음
  - 히브리어식으로 대상을 다소 암시적으로 남길 수 있음
  rationale: 출애굽 사건 회상을 감안하면 지시 대상은 이스라엘로 이해하는 것이 가장 자연스럽습니다. 다만 본문이 직접 ‘하나님의 백성’이라고 풀지 않으므로, 번역문은 대상을 과잉명시하지 않았습니다.
  doctrine_reference: 출애굽기 회상 맥락
