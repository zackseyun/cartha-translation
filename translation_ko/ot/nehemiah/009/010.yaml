  naturalness: ‘그들이 그들에게’는 한국어에서 반복이 다소 어색하므로 ‘그들이 그들을 향하여’가 더 자연스럽습니다. ‘오늘날과 같이’는 이 문맥에서 다소 부자연스러우므로 ‘오늘날에도 그러하듯이’로 옮기는 것이 지속되는 명성을 자연스럽게 나타냅니다.
