- from: 주께서는 그들을 율법[a]으로 돌아오게 하시려고 그들에게 경고하셨지만, 그들은 교만하게 행하여 주의 명령에 귀를 기울이지 않았고, 주의 법도에 죄를 지었습니다. 사람이 그것들을 행하면 그것으로 살 것이라고 하신 그 법도 말입니다. 그들은 완고한 어깨를 내밀고 목을 굳게 하여, 듣기를 거부했습니다.
  to: 주께서는 그들을 주의 율법으로 돌아오게 하시려고 그들에게 경고하셨지만, 그들은 주제넘게 행하여 주의 명령에 귀를 기울이지 않았고, 사람이 그것들을 행하면 그것들로 살게 되는 주의 법도에 죄를 지었습니다[a][b]. 그들은 완고한 어깨를 내밀고 목을 굳게 하여 듣기를 거부했습니다.
  rationale: 원문의 관계절을 ‘주의 법도’에 직접 연결하여 구문과 의미를 회복했고, 복수 대명사와 각주 표지를 바로잡았습니다. ‘율법/법도’의 용어 구분과 어깨·목의 저항 은유는 유지했습니다.
