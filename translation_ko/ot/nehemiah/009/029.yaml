id: NEH.9.29
reference: Nehemiah 9:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תָּ֨עַד בָּ/הֶ֜ם לַ/הֲשִׁיבָ֣/ם אֶל תּוֹרָתֶ֗/ךָ וְ/הֵ֨מָּה הֵזִ֜ידוּ וְ/לֹא שָׁמְע֤וּ לְ/מִצְוֺתֶ֨י/ךָ֙ וּ/בְ/מִשְׁפָּטֶ֣י/ךָ חָֽטְאוּ בָ֔/ם אֲשֶׁר יַעֲשֶׂ֥ה אָדָ֖ם וְ/חָיָ֣ה בָ/הֶ֑ם וַ/יִּתְּנ֤וּ כָתֵף֙ סוֹרֶ֔רֶת וְ/עָרְפָּ֥/ם הִקְשׁ֖וּ וְ/לֹ֥א שָׁמֵֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
  footnotes:
  - marker: a
    text: Or 'which if a person does, he shall live by them.' Hebrew 'man' is generic here, referring to any human being.
    reason: lexical_alternative
  - marker: b
    text: 'An allusion to Leviticus 18:5: obedience to God''s statutes is described as the path of life.'
    reason: cross_reference
translation:
  language: ko
  text: 주께서는 그들을 율법[a]으로 돌아오게 하시려고 그들에게 경고하셨지만, 그들은 교만하게 행하여 주의 명령에 귀를 기울이지 않았고, 주의 법도에 죄를 지었습니다. 사람이 그것들을 행하면 그것으로 살 것이라고 하신 그 법도 말입니다. 그들은 완고한 어깨를 내밀고 목을 굳게 하여, 듣기를 거부했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 사람이 행하면 그것들로 말미암아 살 것이다.’ 여기서 히브리어 ‘사람’은 일반 인간을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  english_pob_choice: You warned them
  chosen_korean: 그들에게 경고하셨지만
  alternatives_korean:
  - 그들에게 증언하셨지만
  - 그들에게 훈계하셨지만
  lexicon: HALOT
  rationale: 문맥상 언약적 책망의 의미가 강하므로, 현대 한국어에서 자연스럽고 무게가 있는 ‘경고하셨다’로 옮겼습니다.
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  english_pob_choice: in order to bring them back to your law
  chosen_korean: 율법으로 돌아오게 하시려고
  alternatives_korean:
  - 율법으로 되돌리시려고
  - 율법으로 돌이키시려고
  - 주의 가르침으로 돌아오게 하시려고
  lexicon: HALOT
  rationale: שׁוּב의 사역형을 살려 ‘돌아오게 하시려고’로 옮기되, תּוֹרָה는 이 언약 문맥에서 관례적으로 ‘율법’이 가장 분명합니다.
- source_word: הֵזִידוּ
  english_pob_choice: they acted presumptuously
  chosen_korean: 교만하게 행하여
  alternatives_korean:
  - 주제넘게 행하여
  - 오만하게 굴어
  - 무례하게 행하여
  lexicon: HALOT
  rationale: זיד의 핵심은 단순한 내면적 자만보다 하나님께 대한 뻔뻔한 불순종이므로, 행위의 태도를 드러내는 표현으로 풀었습니다.
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶי/ךָ
  english_pob_choice: did not listen to your commandments
  chosen_korean: 주의 명령에 귀를 기울이지 않았고
  alternatives_korean:
  - 주의 명령을 듣지 않았고
  - 주의 명령에 순종하지 않았고
  lexicon: HALOT
  rationale: שׁמע의 ‘듣다/경청하다’라는 말맛을 살리면서, 문맥상 불순종의 뜻도 함께 드러내도록 했습니다.
- source_word: וּבְמִשְׁפָּטֶי/ךָ חָטְאוּ בָם
  english_pob_choice: they sinned against your judgments
  chosen_korean: 주의 법도에 죄를 지었습니다
  alternatives_korean:
  - 주의 판결들에 죄를 지었습니다
  - 주의 규례들에 죄를 지었습니다
  - 주의 법도들을 거슬러 죄를 지었습니다
  lexicon: HALOT
  rationale: מִשְׁפָּטִים는 여기서 하나님의 규범적 판결/법도를 가리키므로, 한국어에서는 ‘법도’가 법적·규범적 뉘앙스를 비교적 잘 살립니다.
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  english_pob_choice: by which a man shall live if he does them
  chosen_korean: 사람이 그것들을 행하면 그것으로 살 것이라고 하신 그 법도 말입니다
  alternatives_korean:
  - 사람이 그것들을 행하면 그것들로 살 것이라고 하신 그 법도 말입니다
  - 한 사람이 그것들을 행하면 그것으로 살 것이라고 하신 그 법도 말입니다
  lexicon: HALOT
  rationale: 레위기 18:5를 반영하는 구절이므로 ‘행하면… 살 것’의 약속 구조를 유지했고, אָדָם은 문맥상 일반적 인간을 가리켜 ‘사람’으로 옮겼습니다.
theological_decisions:
- issue: אָדָם의 번역에서 성별 표지와 일반성의 균형
  chosen_reading: 사람
  alternative_readings:
  - 한 사람
  - 남자
  rationale: 이 구절의 אָדָם은 특정 남성보다 일반 인간을 가리키는 대표적 용법이므로, 한국어에서는 자연스럽고 포괄적인 ‘사람’을 본문에 두었습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4; Contested terms table for אָדָם
- issue: ‘율법’과 ‘법도’의 구분
  chosen_reading: 주의 율법 / 주의 법도
  alternative_readings:
  - 주의 가르침 / 주의 규례
  - 주의 법 / 주의 판결
  rationale: 첫 번째 תּוֹרָה는 언약 전체의 가르침을 가리키므로 ‘율법’이 적절하고, 뒤의 מִשְׁפָּטִים는 규범적 판결·법도이므로 ‘법도’로 구분해 반복을 살렸습니다.
  doctrine_reference: POB OT glossary policy
- issue: 문장 후반의 속담적 몸짓 표현 유지
  chosen_reading: 완고한 어깨를 내밀고 목을 굳게 하여
  alternative_readings:
  - 반항하는 어깨를 보이고 목을 곧게 세워
  - 거역하는 어깨를 보이고 목을 굳게 하여
  rationale: 히브리어 관용구인 ‘어깨’와 ‘목’의 이미지를 지우지 않고, 완고한 저항의 몸짓을 한국어에서도 그대로 느낄 수 있게 했습니다.
  doctrine_reference: Source-form preservation principle
