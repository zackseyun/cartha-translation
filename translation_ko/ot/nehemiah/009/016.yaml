    text: 히브리어 관용구로, “목을 굳게 하다”는 완고하고 반역적인 태도를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 “주의를 기울이지 않았습니다”, “순종하지 않았습니다.”
    reason: lexical_alternative
