  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 הֵזִידוּ는 단순 상태인 ‘교만하여’보다 의도적인 행동을 나타내는 ‘교만하게 행하고’가 더 잘 반영합니다. שׁמע אֶל은 여기서 ‘명령을 듣다’보다 ‘명령에 귀를 기울이다’가 히브리어 표현과 한국어 의미를 함께 더 정확히 살립니다.
  naturalness: ‘그들은, 우리 조상들은’은 동격 관계가 다소 어색하므로 ‘그들, 곧 우리 조상들은’으로 다듬는 것이 자연스럽습니다. 현대 정중체에 맞추어 ‘않았습니다’를 사용했습니다.
  terminology: ‘목을 굳게 하다’는 원문의 비유를 보존하는 적절한 표현입니다. ‘주님의 명령’은 본문의 2인칭 신적 호칭을 자연스럽게 반영합니다.
