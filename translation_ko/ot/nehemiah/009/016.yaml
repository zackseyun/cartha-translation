translation:
  language: ko
  text: 그러나 그들, 곧 우리 조상들은 교만하게 행하고[a] 목을 굳게 하였으며[b], 주님의 명령에 귀를 기울이지 않았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주제넘게 행하고”, “오만하게 행하고.”
