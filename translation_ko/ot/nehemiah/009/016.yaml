id: NEH.9.16
reference: Nehemiah 9:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵ֥ם וַ/אֲבֹתֵ֖י/נוּ הֵזִ֑ידוּ וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וְ/לֹ֥א שָׁמְע֖וּ אֶל מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
  footnotes:
  - marker: a
    text: Or 'acted arrogantly' or 'were presumptuous.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''stiffened their neck,'' meaning they became stubborn or rebellious.'
    reason: cultural_note
  - marker: c
    text: Or 'did not heed' or 'did not obey.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은[a], 우리 조상들은 교만하여 목을 굳게 하였고[b][c], 주의 명령을 듣지 아니하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “교만하게 행하였음”, “주제넘게 행하였음.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, “목을 굳게 하다”는 완고하고 반역적인 태도를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 “주의하지 아니하였음”, “순종하지 아니하였음.”
    reason: lexical_alternative
