    rationale: הַבָּנִים은 문맥상 이스라엘의 다음 세대, 곧 후손들을 가리키는 집단 표현입니다. ‘그 자손들’은 계보적 의미를 유지하며, 문자적 ‘아들들’은 각주에서 밝혀 둘 수 있습니다.
