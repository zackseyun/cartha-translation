base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
  footnotes:
  - marker: a
    text: Or 'the children' or more interpretively 'the Israelites.' The Hebrew is literally 'the sons.'
    reason: lexical_alternative
  - marker: b
    text: Or 'delivered them into their power.' The Hebrew reads literally 'gave them into their hand.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to deal with them as they pleased.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그 자손들이[a] 들어가 그 땅을 차지하였고, 주님께서는 그들 앞에서 그 땅의 주민들, 곧 가나안 사람들을 굴복시키시고, 그 주민들과 그들의 왕들과 그 땅의 여러 백성을 그 자손들의 손에 넘기셔서, 그들이 원하는 대로 그들을 다루게 하셨습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘아들들’입니다. 문맥상 이스라엘의 후손을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 손에 주셨다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그들의 뜻대로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּנִים
  english_pob_choice: the sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 이스라엘 백성
  - 그 자손들
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현을 살리면서도 현대 한국어에서 자연스럽게 읽히는 복수형으로 옮겼습니다. POB가 주석으로 밝힌 대로, 문맥상 이들은 이스라엘의 후손입니다.
- source_word: וַיִּירְשׁוּ
  english_pob_choice: took possession of
  chosen_korean: 차지하였고
  alternatives_korean:
  - 소유하였고
  - 상속받았고
  - 점유하였고
  lexicon: HALOT
  rationale: 땅 문맥의 ירשׁ가 가리키는 ‘소유권을 얻어 차지함’을 간결하게 담았습니다. ‘상속받다’보다 능동적 점유의 뉘앙스가 살아 있습니다.
- source_word: וַתַּכְנַע... וַתִּתְּנֵם בְּיָדָם
  english_pob_choice: you subdued ... gave them into their hand
  chosen_korean: 굴복시키시고 그들을 그들의 손에 넘기셨으며
  alternatives_korean:
  - 복종하게 하시고 그들을 그들의 손안에 주셨으며
  - 억누르시고 그들을 그들 손에 넘기셨으며
  lexicon: HALOT
  rationale: ‘그들의 손에’라는 히브리어 관용구를 보존하여 통치·통제의 이미지를 유지했습니다. ‘넘기셨다’는 POB의 ‘gave them into their hand’와 문장 구조도 맞습니다.
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  english_pob_choice: to do with them according to their will
  chosen_korean: 그들 마음대로 하게 하셨습니다
  alternatives_korean:
  - 그들 뜻대로 그들을 다루게 하셨습니다
  - 그들 의지에 따라 그들에게 행하게 하셨습니다
  lexicon: HALOT
  rationale: 히브리어의 결과절을 자연스러운 한국어로 옮기되, ‘마음대로’로 권한 부여와 자의적 처분의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 이스라엘을 가리키는 ‘아들들’의 번역
  chosen_reading: 문자적 표현을 살려 ‘아들들’로 두고, 문맥상 이스라엘의 후손을 가리키는 것으로 읽게 했습니다.
  alternative_readings:
  - ‘이스라엘 백성’으로 명시적으로 풀어 쓰는 해석적 번역
  rationale: 히브리어의 언약적 가족 언어를 보존하는 것이 본문이 말하는 계보적·서사적 연속성을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
- issue: 정복 언어의 강도 유지
  chosen_reading: ‘굴복시키시고’, ‘손에 넘기셨으며’처럼 강한 정복·주권 언어를 유지했습니다.
  alternative_readings:
  - 완화된 표현인 ‘이기게 하시고’, ‘제어하게 하시고’
  rationale: 본문은 승리를 인간의 능력이 아니라 하나님의 행위로 돌립니다. 그 강도를 약화하면 본문의 신학적 초점이 흐려집니다.
  doctrine_reference: 본문의 신적 주권과 언약 성취
