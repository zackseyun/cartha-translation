revisions:
- from: 그리하여 아들들이 들어와 그 땅을 차지하였고, 주님께서는 그들 앞에서 그 땅의 주민들, 곧 가나안 사람들을 굴복시키시고 그들을 그들의 손에 넘기셨으며, 그들의 왕들과 그 땅의 백성들을 그들 마음대로 하게 하셨습니다.[a][b][c]
  to: 그리하여 그 자손들이[a] 들어가 그 땅을 차지하였고, 주님께서는 그들 앞에서 그 땅의 주민들, 곧 가나안 사람들을 굴복시키시고, 그 주민들과 그들의 왕들과 그 땅의 여러 백성을 그 자손들의 손에 넘기셔서, 그들이 원하는 대로 그들을 다루게 하셨습니다.[b][c]
  rationale: 원문의 정복 언어와 ‘손에 넘기다’라는 권세의 관용구를 유지하되, 한국어 대명사의 선행사를 명확히 했습니다. ‘그 자손들’은 문맥상 집단적 계보 표현인 הַבָּנִים을 자연스럽게 옮기며, 문자적 표현은 각주로 보존했습니다. ‘그 주민들과 그들의 왕들과 그 땅의 여러 백성’은 וַתִּתְּנֵם의 선행 대상과 이어지는 왕들 및 여러 민족을 한국어 문장에서 분명히 연결합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:40Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 정복의 주체를 하나님으로, 대상과 결과를 가나안 땅의 주민·그 왕들·그 땅의 여러 백성으로 제시하여 히브리어의 핵심 의미를 대체로 충실히 옮겼습니다. 다만 마지막 절에서 반복되는 ‘그들’이 이스라엘의 후손과 정복당한 주민들을 모두 가리킬 수 있어, 원문의 지시 관계를 한국어에서 더 분명히 해야 합니다.
  naturalness: ‘아들들’은 문맥상 집단적 후손을 뜻하는 히브리어 표현을 지나치게 직역하여 현대 표준 한국어에서는 다소 부자연스럽고 남성 개인들의 집단처럼 들릴 수 있습니다. ‘그 자손들’이 계보적 표현을 보존하면서 자연스럽습니다. 또한 ‘그들 마음대로 하게 하셨습니다’는 목적어가 불명확하므로 ‘그들이 원하는 대로 그들을 다루게 하셨습니다’로 밝혀 쓰는 편이 좋습니다.
  terminology: ‘가나안 사람들’, ‘굴복시키시고’, ‘손에 넘기셨으며/넘기셔서’는 적절합니다. ‘그 땅의 백성들’은 עַמְמֵי הָאָרֶץ의 복수성을 더 잘 드러내도록 ‘그 땅의 여러 백성’으로 다듬었습니다. ‘주님’은 주어진 초안의 호칭과 합쇼체 문맥에 맞게 유지했습니다.
