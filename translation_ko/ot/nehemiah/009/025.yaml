  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
  footnotes:
  - marker: a
    text: Or 'rich land'; literally 'fat land.'
    reason: lexical_alternative
  - marker: b
    text: Or 'were satisfied.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they luxuriated in your great bounty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 견고한 성읍들과 비옥한 땅을 차지하고, 온갖 좋은 것으로 가득한 집들과 다듬은 우물들, 포도원들과 올리브나무들과 풍성한 과일나무들을 소유하게 되었습니다. 그래서 그들은 먹고 배부르고 살이 쪘으며, 주님의 큰 선하심 안에서 스스로 즐거워했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘살진 땅’입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּלְכְּדוּ עָרִים בְּצֻרוֹת
  english_pob_choice: captured fortified cities
  chosen_korean: 견고한 성읍들을 차지하고
  alternatives_korean:
  - 포위된 성읍들을 점령하고
  - 요새화된 성읍들을 함락하고
  lexicon: HALOT
  rationale: לכד는 성읍을 군사적으로 ‘붙잡다/점령하다’는 뜻이므로 ‘차지하다’로 옮기되, בצרות의 방어적 성격은 ‘견고한’으로 자연스럽게 살렸습니다.
- source_word: אֲדָמָה שְׁמֵנָה
  english_pob_choice: fertile land
  chosen_korean: 비옥한 땅
  alternatives_korean:
  - 기름진 땅
  - 살진 땅
  lexicon: HALOT
  rationale: 직역하면 ‘살진 땅’이지만 한국어 본문에서는 생산성이 풍부한 땅이라는 관용적 의미를 드러내는 ‘비옥한 땅’이 가장 자연스럽습니다.
- source_word: בֹּרוֹת חֲצוּבִים
  english_pob_choice: hewn cisterns
  chosen_korean: 다듬은 우물들
  alternatives_korean:
  - 파 놓은 cistern들
  - 다듬어 놓은 물저장 구덩이들
  lexicon: HALOT
  rationale: בּוֹר는 문맥상 물 저장 시설이지만 한국어에서 ‘우물’이 가장 즉각적으로 이해되므로, 준비된 시설이라는 점을 살려 ‘다듬은 우물들’로 옮겼습니다.
- source_word: וַיִּתְעַדְּנוּ בְּטוּבְךָ הַגָּדוֹל
  english_pob_choice: they delighted themselves in your great goodness
  chosen_korean: 주님의 큰 선하심 안에서 스스로 즐거워했습니다
  alternatives_korean:
  - 주님의 큰 은혜 안에서 즐거워했습니다
  - 주님의 큰 풍성함 안에서 스스로 기뻐했습니다
  lexicon: HALOT
  rationale: התעדן의 반사적 뉘앙스를 살리기 위해 단순히 ‘즐기다’보다 ‘스스로 즐거워하다’를 택했고, טוּב는 물질적 풍성함만이 아니라 인격적 선하심도 포함하므로 ‘선하심’으로 넓게 번역했습니다.
theological_decisions:
- issue: בְּטוּבְךָ הַגָּדוֹל의 신학적 뉘앙스
  chosen_reading: ‘주님의 큰 선하심 안에서’로 번역해, 이스라엘의 향유가 하나님의 관대함 속에서 이루어진 것임을 드러냈습니다.
  alternative_readings:
  - ‘주님의 큰 풍성함 안에서’
  - ‘주님의 큰 은혜 안에서’
  rationale: 본문은 단순한 물질 복의 목록이 아니라, 그 모든 누림이 야훼의 גדול한 טוב에서 비롯되었음을 강조합니다. ‘선하심’은 도덕적 선과 베풂의 의미를 함께 담아, 축복의 근원을 더 온전히 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
