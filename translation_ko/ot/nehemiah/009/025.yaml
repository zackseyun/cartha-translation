revisions:
- from: 그들은 견고한 성읍들과 비옥한 땅을 차지하고, 온갖 좋은 것으로 가득한 집들과 다듬은 우물들, 포도원들과 올리브나무들과 풍성한 과일나무들을 소유하게 되었습니다. 그래서 그들은 먹고 배부르고 살이 쪘으며, 주님의 큰 선하심 안에서 스스로 즐거워했습니다.[a]
  to: 그들은 견고한 성읍들을 함락하고 비옥한 땅[a]을 차지했으며, 온갖 좋은 것으로 가득한 집들과 파내어 만든 저수조들, 많은 포도원과 올리브나무와 과일나무들을 소유하게 되었습니다. 그래서 그들은 먹고 배부르고 살이 쪘으며, 주님의 크신 선하심 가운데서 기쁨을 누렸습니다.
  rationale: 군사적 정복(‘함락하고’)과 그 결과의 소유(‘차지했으며/소유하게 되었습니다’)를 구별했습니다. 물 저장 시설을 가리키는 ‘파내어 만든 저수조들’로 원문의 구체적 의미를 회복했고, 풍요를 나타내는 לָרֹב을 농경 자산의 풍성함으로 자연스럽게 반영했습니다. 각주는 해당 어구에 직접 연결했으며, 결말은 하나님의 ‘크신 선하심’ 안에서 누린 기쁨이라는 원문의 표현을 자연스러운 합쇼체로 보존했습니다.
