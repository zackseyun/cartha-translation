  naturalness: 초안의 마지막 문장(‘…고난을, 앗수르 왕들의 날들부터 오늘까지 말입니다’)은 문장 끝의 ‘말입니다’가 기도문 호격 및 청원문과 어울리지 않고, 열거가 뒤늦게 보충되어 읽기 어렵습니다. 시간 표현과 피해자 열거를 ‘고난’에 직접 연결해 재구성했습니다.
