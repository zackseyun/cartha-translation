  rationale: 원문의 호격 구조와 ‘고난’을 중심으로 한 피해자·기간 수식을 한국어 문장 안에서 직접 연결했습니다. 이에 따라 중복된 ‘고난’과 구어적인 보충 표현을 제거하고, 청원문의 합쇼체를 일관되게 유지했습니다. 주석 표지도 각각의 관련 어휘에 배치했습니다.
