revisions:
- from: 그리고 이제, 우리 하나님—크고 능하시며 두려우신 하나님, 언약과 인자를 지키시는 분이시여—우리에게 닥친 모든 고난을 주님 앞에서 작게 여기지 마십시오. 곧 우리 왕들과 우리 지도자들과 우리 제사장들과 우리 선지자들과 우리 조상들과 주님의 모든 백성에게 닥친 고난을, 앗수르 왕들의 날들부터 오늘까지 말입니다.[a][b]
