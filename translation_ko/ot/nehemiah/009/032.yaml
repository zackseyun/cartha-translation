  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
  footnotes:
  - marker: a
    text: Or 'awesome' for 'fearsome.' The Hebrew term conveys that God inspires reverent fear.
    reason: lexical_alternative
  - marker: b
    text: Or 'our ancestors' for 'our fathers.' The Hebrew is masculine and refers to the forefathers of the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 우리 하나님—크고 능하시며 두려우신 하나님, 언약과 인자를 지키시는 분이시여—우리에게 닥친 모든 고난을 주님 앞에서 작게 여기지 마십시오. 곧 우리 왕들과 우리 지도자들과 우리 제사장들과 우리 선지자들과 우리 조상들과 주님의 모든 백성에게 닥친 고난을, 앗수르 왕들의 날들부터 오늘까지 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려우신’은 ‘무서운’보다 경외와 떨림을 함께 담아, נורא의 의미를 살립니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상’은 히브리어의 남성형 표현을 한국어에서 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵינוּ / הָאֵל
  english_pob_choice: our God—the great, mighty, and fearsome God
  chosen_korean: 우리 하나님—크고 능하시며 두려우신 하나님
  alternatives_korean:
  - 우리 하나님—위대하고 능하시며 경외로운 하나님
  - 우리 하나님—크고 강하시며 무서우신 하나님
  lexicon: HALOT
  rationale: אֱלֹהֵינוּ에 호격을 살려 ‘우리 하나님’으로 부르고, הָאֵל은 별도의 추상화 없이 같은 대상을 풀어 설명하는 호칭으로 처리했습니다.
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  english_pob_choice: the great, mighty, and fearsome
  chosen_korean: 크고 능하시며 두려우신
  alternatives_korean:
  - 크고 강하시며 경외로우신
  - 위대하고 능력 많으시며 두려우신
  lexicon: HALOT
  rationale: 세 형용사는 언약적 하나님의 칭호이므로 의미를 약화하지 않도록 ‘크고 능하시며 두려우신’으로 옮겼습니다. ‘두려우신’은 reverent fear의 뉘앙스를 살립니다.
- source_word: שׁוֹמֵר הַבְּרִית וְהַחֶסֶד
  english_pob_choice: who keeps the covenant and steadfast love
  chosen_korean: 언약과 인자를 지키시는 분이시여
  alternatives_korean:
  - 언약과 변함없는 사랑을 지키시는 분이시여
  - 언약과 인애를 지키시는 분이시여
  lexicon: HALOT
  rationale: שׁוֹמֵר는 현재적·지속적 성격을 살려 ‘지키시는’으로, חֶסֶד는 본문 문맥의 언약적 의미를 따라 POB의 ‘steadfast love’에 대응하는 전통적이되 직역 성향의 ‘인자’로 옮겼습니다.
- source_word: אַל יִמְעַט לְפָנֶיךָ
  english_pob_choice: do not let all the hardship ... seem small before you
  chosen_korean: 우리에게 닥친 모든 고난을 주님 앞에서 작게 여기지 마십시오
  alternatives_korean:
  - 우리에게 닥친 모든 고난을 주님 앞에서 작게 보지 마십시오
  - 우리의 모든 고난을 주님 앞에서 사소하게 여기지 마십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 하나님이 그 고난을 ‘작은 것’으로 치지 않도록 하는 요청이므로, 한국어에서는 자연스럽게 ‘작게 여기지 마십시오’로 옮겼습니다. לְפָנֶיךָ는 ‘주님 앞에서’로 유지했습니다.
- source_word: מִימֵי מַלְכֵי אַשּׁוּר עַד הַיּוֹם הַזֶּה
  english_pob_choice: from the days of the kings of Assyria until this day
  chosen_korean: 앗수르 왕들의 날들부터 오늘까지
  alternatives_korean:
  - 앗수르 왕들의 시대부터 오늘까지
  - 앗수르 왕들의 때부터 오늘까지
  lexicon: HALOT
  rationale: 시작점과 종결점을 드러내는 시간 관용구를 간결하게 살려, 역사적 지속성을 분명히 했습니다. 고유명사는 통용되는 성서 표기인 ‘앗수르’를 사용했습니다.
theological_decisions:
- issue: ‘우리 조상’의 성별-정확성 유지
  chosen_reading: 우리 조상
  alternative_readings:
  - 우리 조상들
  - 우리 선조들
  rationale: 히브리어 אֲבֹתֵינוּ는 문자적으로 남성형 ‘우리 아버지들’이지만, 한국어 성서 문맥에서는 집단적 조상 지시로 가장 자연스럽고도 원문 긴장을 보존하는 ‘우리 조상’이 적절합니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
- issue: חֶסֶד의 번역
  chosen_reading: 인자
  alternative_readings:
  - 변함없는 사랑
  - 자비
  - 인애
  rationale: 본절은 언약을 지키시는 하나님을 호명하므로, חֶסֶד를 단순한 정서가 아니라 언약적 신실함을 동반한 사랑으로 읽어 ‘인자’로 유지했습니다. 이는 전통적 교회어를 무비판적으로 따르기보다 원문 의미를 우선한 선택입니다.
  doctrine_reference: Translation philosophy §6 (readable modern English, not flattening theological weight)
