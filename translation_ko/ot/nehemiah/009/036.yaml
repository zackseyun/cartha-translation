  text: Look[a], today we are slaves; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are slaves on it.
  footnotes:
  - marker: a
    text: Or 'servants' instead of 'slaves'; the Hebrew term denotes people in subjection, and here likely emphasizes Judah's bondage under imperial rule.
    reason: lexical_alternative
  - marker: b
    text: Or 'its bounty' for 'its good things.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew literally 'slaves on it,' that is, on the very land God gave to their fathers.
    reason: cultural_note
translation:
  language: ko
  text: 보십시오, 오늘 우리는 종이 되었고, 조상들에게 그 열매와 그 좋은 것을 먹게 하시며 주신 땅에서, 보십시오, 우리는 그 땅에 종이 되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '종'으로 번역할 수 있습니다. 히브리어 용어는 복종 상태에 있는 사람들을 지칭하며, 여기서는 아마도 제국 통치 하에 있는 유다의 종속 상태를 강조하는 것 같습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '그의 풍요'로 번역할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 문자적으로 '그 땅에 종'입니다. 즉, 조상들에게 주신 바로 그 땅에 종이라는 뜻입니다.
    reason: alternative_reading
