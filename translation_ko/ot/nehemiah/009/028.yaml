  to: 그들이 평안을 얻자마자[a] 다시 당신 앞에서 악을 행했습니다. 당신은 그들을 그들의 원수들의 손에[b] 버려 두셨고, 원수들이 그들을 다스렸습니다. 그때 그들은 다시 당신께 부르짖었고, 당신은 하늘에서 들으시고 당신의 풍성한 긍휼에 따라[c] 여러 번 그들을 구해 주셨습니다.
  rationale: 원수들이 지배했다는 문법적 관계를 명시하여 원문 의미와 한국어 문장성을 개선했습니다. 시간절의 ‘-자마자’, ‘손에 버려 두셨고’, 반복을 나타내는 ‘다시’와 ‘여러 번’, 그리고 풍성한 긍휼이라는 핵심 의미는 유지했습니다. 각주 표지를 해당 어구에 붙이고 각주 a의 대안 설명을 바로잡았습니다.
