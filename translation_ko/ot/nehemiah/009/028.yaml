source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But as soon as they had rest[a], they turned back to do evil before you, and you abandoned them into the hand of their enemies, who ruled over them. Then they turned back and cried out to you[c][b], and you heard from heaven and delivered them many times according to your abundant mercies.
  footnotes:
  - marker: a
    text: Or 'when they had rest.' The Hebrew temporal clause can be rendered more literally that way; 'as soon as they had rest' brings out the immediate relapse implied by the context.
    reason: lexical_alternative
  - marker: b
    text: Literally 'into the hand of their enemies,' a Hebrew idiom for being given over to another's power.
    reason: cultural_note
  - marker: c
    text: Or 'according to your great compassion.' The Hebrew uses a plural noun, 'your mercies/compassions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 평안을 얻자마자 당신 앞에서 악을 행하려고 다시 돌아섰습니다. 당신은 그들을 그들의 원수들의 손에 버려 두셨고, 그들이 그들을 다스렸습니다. 그때 그들은 다시 당신께 부르짖었고, 당신은 하늘에서 들으시고 당신의 풍성한 긍휼에 따라 여러 번 그들을 구해 주셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘그들이 평안을 얻자마자’로도 옮길 수 있습니다. 여기서는 문맥이 암시하는 즉각적 재범을 드러내기 위해 ‘-자마자’를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘그들의 원수들의 손에’는 다른 이의 권세 아래로 넘겨졌다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 원문은 ‘당신의 많은/풍성한 긍휼에 따라’라는 뜻으로, 복수형 명사로 된 긍휼/자비를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנוֹחַ
  english_pob_choice: as soon as they had rest
  chosen_korean: 평안을 얻자마자
  alternatives_korean:
  - 그들이 쉬게 되자
  - 그들이 안식을 얻었을 때
  lexicon: HALOT
  rationale: פנח/נוח의 시간 절은 단순한 동시가 아니라 회복 직후의 즉각적 퇴행을 강조하므로, ‘-자마자’로 그 긴박한 흐름을 살렸습니다.
- source_word: יָשׁוּבוּ / וַיָּשׁוּבוּ
  english_pob_choice: they turned back / Then they turned back
  chosen_korean: 다시 돌아섰습니다 / 다시
  alternatives_korean:
  - 돌아왔습니다
  - 되돌아갔습니다
  lexicon: HALOT
  rationale: שׁוּב의 반복은 단순 이동이 아니라 이전의 악행과 부르짖음 사이를 오가는 순환적 배반을 나타내므로, ‘다시 돌아서다’로 두 번의 반복을 맞췄습니다.
- source_word: בְּיַד אֹיְבֵיהֶם
  english_pob_choice: into the hand of their enemies
  chosen_korean: 그들의 원수들의 손에 버려 두셨고
  alternatives_korean:
  - 그들의 원수들의 권세에 넘기셨고
  - 그들의 원수들의 힘에 넘기셨고
  lexicon: HALOT
  rationale: 히브리어 관용구를 살리되 한국어에서 자연스럽게 읽히도록 ‘손에 버려 두시다’로 옮겨, 보호를 거두시는 심판적 뉘앙스를 유지했습니다.
- source_word: כְּרַחֲמֶי/ךָ רַבּוֹת
  english_pob_choice: according to your abundant mercies
  chosen_korean: 당신의 풍성한 긍휼에 따라
  alternatives_korean:
  - 당신의 많은 긍휼에 따라
  - 당신의 넘치는 긍휼에 따라
  lexicon: HALOT
  rationale: רַבּוֹת는 단순 수량보다 ‘풍성함/많음’을 드러내므로, 복수형의 뉘앙스를 살린 ‘풍성한 긍휼’이 가장 균형적입니다.
theological_decisions:
- issue: 하나님의 ‘버려 두심’의 의미
  chosen_reading: 당신은 그들을 그들의 원수들의 손에 버려 두셨고
  alternative_readings:
  - 당신은 그들을 그들의 원수들의 손에 넘기셨고
  - 당신은 그들을 그들의 원수들에게 맡기셨고
  rationale: 본문은 언약적 보호의 철회를 말하지, 하나님의 절대적 유기를 말하지 않습니다. ‘버려 두셨고’는 심판의 엄중함과 문맥상의 반복적 구원 서사를 함께 보존합니다.
  doctrine_reference: Translation philosophy §3
- issue: 반복적 과거 행위의 표현
  chosen_reading: 당신은 하늘에서 들으시고 ... 여러 번 그들을 구해 주셨습니다
  alternative_readings:
  - 당신은 하늘에서 들으시고 ... 여러 번 그들을 구하셨습니다
  - 당신은 하늘에서 들으시고 ... 자주 그들을 건지셨습니다
  rationale: 히브리어 미완료형은 요약된 역사 서술에서 반복된 과거 행동을 나타낼 수 있으므로, ‘여러 번’과 함께 단순 과거를 사용해 자연스럽게 반복성을 전달했습니다.
  doctrine_reference: Translation philosophy §6
