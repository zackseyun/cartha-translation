source:
  edition: WLC
  text: וַ/תֵּ֛רֶא אֶת עֳנִ֥י אֲבֹתֵ֖י/נוּ בְּ/מִצְרָ֑יִם וְ/אֶת זַעֲקָתָ֥/ם שָׁמַ֖עְתָּ עַל יַם סֽוּף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/009.yaml
  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Sea of Reeds.'' Traditionally rendered ''Red Sea.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 이집트에서 우리 조상들의 고난을 보셨고, 홍해에서 그들의 부르짖음을 들으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘갈대 바다’. 전통적으로는 ‘홍해’로 번역합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  english_pob_choice: you saw
  chosen_korean: 보셨고
  alternatives_korean:
  - 살피셨고
  - 돌보셨고
  lexicon: HALOT
  rationale: ראה는 여기서 단순한 시각보다 상황을 알아차리고 주목하시는 뜻이므로, 하나님께 직접 말하는 문맥에 맞게 자연스러운 존대형 ‘보셨고’로 옮겼습니다.
- source_word: עֳנִי
  english_pob_choice: affliction
  chosen_korean: 고난
  alternatives_korean:
  - 환난
  - 고통
  - 비참
  lexicon: HALOT
  rationale: עֳנִי는 압박받는 상태의 고통과 비참함을 아우르므로, 회중 기도체에 어울리면서도 의미를 과도하게 좁히지 않는 ‘고난’을 택했습니다.
- source_word: אֲבֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들
  alternatives_korean:
  - 우리 선조들
  - 우리 아버지들
  lexicon: HALOT
  rationale: 히브리어는 남성 복수 소유형이지만, 한국어에서는 성별을 불필요하게 부각하지 않으면서 공동체의 선대를 가리키는 ‘조상들’이 가장 자연스럽습니다.
- source_word: יַם סוּף
  english_pob_choice: the Red Sea
  chosen_korean: 홍해
  alternatives_korean:
  - 갈대 바다
  lexicon: HALOT
  rationale: 본문의 직역 가능성은 ‘갈대 바다’이지만, 영어 POB가 전통적 지리명인 ‘Red Sea’를 채택한 점을 따라 한국어에서도 통용성이 높은 ‘홍해’를 본문에 두었습니다.
theological_decisions:
- issue: 기도에서 하나님께 직접 말하는 2인칭 존대 표현
  chosen_reading: 주께서는 … 보셨고 … 들으셨습니다
  alternative_readings:
  - 주께서 … 보시고 … 들으셨습니다
  - 주여, … 보셨고 … 들으셨습니다
  rationale: 느헤미야 9장의 회중 기도문은 하나님께 대한 직접 호소이므로, 한국어 합쇼체 안에서도 하나님께 드리는 존대 표현을 유지했습니다.
  doctrine_reference: 기도의 직접성 및 하나님의 인격적 응답성
