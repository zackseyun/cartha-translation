source:
  edition: WLC
  text: וְ/הַ/יָּם֙ בָּקַ֣עְתָּ לִ/פְנֵי/הֶ֔ם וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְֽ/אֶת רֹ֨דְפֵי/הֶ֜ם הִשְׁלַ֧כְתָּ בִ/מְצוֹלֹ֛ת כְּמוֹ אֶ֖בֶן בְּ/מַ֥יִם עַזִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
  footnotes:
  - marker: a
    text: Or 'divided the sea.'
    reason: lexical_alternative
  - marker: b
    text: Or 'into the deeps.'
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서는 그들 앞에서 바다를 가르셨고, 그들은 바다 한가운데를 마른 땅으로 지나갔으며, 그들의 추격자들을 깊은 곳에 돌이 깊은 물 속에 가라앉듯 던지셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바다를 나누셨고’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깊은 곳으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַעְתָּ
  english_pob_choice: split
  chosen_korean: 가르셨고
  alternatives_korean:
  - 쪼개셨고
  - 나누셨고
  lexicon: HALOT
  rationale: בקע는 물체를 갈라 벌리는 뜻이므로, 바다를 실제로 벌리는 이미지를 살리는 ‘가르셨고’가 가장 자연스럽고 직접적입니다.
- source_word: לִפְנֵיהֶם
  english_pob_choice: before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 앞에
  - 그들 이전에
  lexicon: HALOT
  rationale: 행동의 위치를 드러내는 표현으로 ‘그들 앞에서’가 한국어에서 가장 자연스럽고, 하나님의 인도 행위도 분명히 보입니다.
- source_word: בְּתוֹךְ הַיָּם
  english_pob_choice: the midst of the sea
  chosen_korean: 바다 한가운데를
  alternatives_korean:
  - 바다 가운데를
  - 바다 속을
  lexicon: HALOT
  rationale: תוֹךְ는 ‘가운데/한복판’의 뜻이어서, 공간적 중심을 살리는 ‘한가운데를’이 서술의 힘을 잘 유지합니다.
- source_word: בַּיַּבָּשָׁה
  english_pob_choice: on dry ground
  chosen_korean: 마른 땅으로
  alternatives_korean:
  - 마른 땅 위로
  - 마른 땅에서
  lexicon: HALOT
  rationale: 여기서는 결과적 이동을 보여 주므로 ‘마른 땅으로’가 한국어 문맥에서 자연스럽고, 기적적으로 준비된 길의 상태를 잘 드러냅니다.
- source_word: בִמְצוֹלֹת
  english_pob_choice: into the depths
  chosen_korean: 깊은 곳에
  alternatives_korean:
  - 깊은 데로
  - 깊은 물속에
  lexicon: HALOT
  rationale: מְצוֹלוֹת는 물의 깊은 심연을 가리키므로, 한국어에서는 ‘깊은 곳’이 짧고 분명하게 그 이미지를 전달합니다.
theological_decisions:
- issue: 공동체 기도에서의 직접 호칭 유지
  chosen_reading: 문맥이 하나님께 드리는 회상과 찬양이므로, 서술 전체를 ‘주께서는 …’의 직접 호칭으로 유지했습니다.
  alternative_readings:
  - 3인칭 서술로 바꾸는 방식
  - 간접적으로 ‘주께서 하셨습니다’라고 약화하는 방식
  rationale: 본문의 신학적 힘은 출애굽 사건을 하나님께 직접 고백하는 데 있으므로, 호칭을 유지해야 감사와 기억의 성격이 살아납니다.
  doctrine_reference: 공동체 기도/기억의 문맥을 보존하는 번역 원칙
- issue: 마지막 비유의 강도 보존
  chosen_reading: כְּמוֹ אֶבֶן בְּמַיִם עַזִּים을 ‘돌이 깊은 물 속에 가라앉듯’으로 옮겨, 단순한 비유와 침몰의 이미지를 함께 살렸습니다.
  alternative_readings:
  - ‘돌처럼’으로만 처리하는 방식
  - ‘깊은 물들 속에 돌처럼’으로 직역하는 방식
  rationale: 히브리어는 추격자들이 물속에 던져져 돌처럼 가라앉는 장면을 그리므로, ‘가라앉듯’이 행동의 결과를 분명하게 보여 줍니다.
  doctrine_reference: 시적-서사적 비유의 이미지 보존
