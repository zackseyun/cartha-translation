  text: וַ/תִּתֵּ֨ן לָ/הֶ֤ם מַמְלָכוֹת֙ וַ/עֲמָמִ֔ים וַֽ/תַּחְלְקֵ֖/ם לְ/פֵאָ֑ה וַ/יִּֽירְשׁ֞וּ אֶת אֶ֣רֶץ סִיח֗וֹן וְ/אֶת אֶ֨רֶץ֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וְ/אֶת אֶ֖רֶץ ע֥וֹג מֶֽלֶךְ הַ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: ko
  text: 주께서 그들에게 왕국들과 민족들을 주시고, 그들을 사방으로 나누어 주셨습니다. 그래서 그들은 시혼의 땅, 곧 헤스본 왕의 땅과 바산 왕 옥의 땅을 차지했습니다.
  philosophy: formal
lexical_decisions:
- source_word: מַמְלָכוֹת
  english_pob_choice: kingdoms
  chosen_korean: 왕국들
  alternatives_korean:
  - 나라들
  - 왕들의 나라들
  lexicon: מַמְלָכָה
  rationale: 히브리어 복수형을 그대로 살려 정치적 지배 영역을 뜻하는 ‘왕국들’로 옮겼습니다.
- source_word: עֲמָמִים
  english_pob_choice: peoples
  chosen_korean: 민족들
  alternatives_korean:
  - 백성들
  - 사람들
  lexicon: עַם
  rationale: 문맥상 통치 대상으로 주어진 집단을 가리키므로 ‘민족들’이 가장 직접적입니다.
- source_word: וַתַּחְלְקֵם לְפֵאָה
  english_pob_choice: allotted them to every corner
  chosen_korean: 그들을 사방으로 나누어 주셨습니다
  alternatives_korean:
  - 그들을 모든 끝으로 나누어 주셨습니다
  - 그들을 사방 끝으로 분배하셨습니다
  lexicon: חלק + פֵאָה
  rationale: 직역하면 ‘모퉁이/끝’이지만 한국어로는 사방에 흩어 배치한다는 뜻이 자연스럽게 드러나도록 ‘사방으로 나누어 주셨습니다’로 옮겼습니다.
- source_word: וַיִּירְשׁוּ
  english_pob_choice: took possession of
  chosen_korean: 차지했습니다
  alternatives_korean:
  - 소유했습니다
  - 점령했습니다
  lexicon: ירש
  rationale: 문맥상 정복 후 상속받아 소유하게 되는 의미이므로, 너무 군사적인 ‘점령’보다 ‘차지하다’가 균형이 좋습니다.
theological_decisions:
- issue: 하나님의 주권적 분배와 정복의 표현
  chosen_reading: 주께서 민족들과 왕국들을 주시고, 땅을 사방으로 나누어 주신 뒤 그들이 차지하게 하셨다는 뜻을 분명히 드러냈습니다.
  alternative_readings:
  - 하나님이 단순히 영토를 허락하셨다는 일반적 표현
  - 정복 행위만 강조하는 표현
  rationale: 본문은 이스라엘의 소유가 인간의 힘이 아니라 주님의 분배 행위에서 비롯되었음을 강조하므로, 그 주권성을 드러내는 방향을 유지했습니다.
  doctrine_reference: 하나님의 섭리와 언약적 분배(신 32:8-9, 수 24:4-13 맥락)
