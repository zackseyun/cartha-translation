  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
  footnotes:
  - marker: a
    text: Or 'in your abundant goodness' or 'with your great bounty.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the broad and fat land,' an idiom for a spacious and fertile land.
    reason: cultural_note
  - marker: c
    text: Or 'they did not worship you'; the Hebrew verb can include both worship and service.
    reason: lexical_alternative
  - marker: d
    text: Or 'did not repent of their evil deeds'; literally, 'did not turn from their evil deeds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 왕국[a]에 있을 때조차, 또 당신이 그들에게 주신 큰 선하심과 당신이 그들 앞에 두신 넓고 기름진 땅[d][c][b] 가운데서도, 그들은 당신을 섬기지 않았고 자기들의 악한 행실에서 돌아서지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 큰 풍성함 가운데서’ 또는 ‘그들의 풍성한 복리 가운데서’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘넓고 기름진 땅’이며, 넓고 비옥한 땅을 가리키는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들이 당신을 예배하지 않았고’; 히브리어 동사는 예배와 섬김을 함께 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그들이 자기들의 악한 행실을 회개하지 않았고’; 문자적으로는 ‘자기들의 악한 행실에서 돌아서지 않았다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  english_pob_choice: in their kingdom
  chosen_korean: 그들의 왕국에 있을 때조차
  alternatives_korean:
  - 그들의 왕국 안에서
  - 그들의 통치 아래에서
  lexicon: HALOT
  rationale: מַלְכוּת은 왕국, 통치, 왕권을 아울러 가리킬 수 있으나, 문맥상 이미 누리던 안정된 국가적 지위를 가리키므로 ‘왕국’이 가장 직접적입니다.
- source_word: וּבְטוּבְךָ הָרָב
  english_pob_choice: amid your great goodness
  chosen_korean: 당신이 그들에게 주신 큰 선하심
  alternatives_korean:
  - 당신의 풍성한 선하심
  - 당신의 큰 은혜
  lexicon: HALOT
  rationale: טוּב은 선하심과 풍성한 후함을 함께 담을 수 있어, 하나님이 베푸신 호의라는 점을 살려 ‘큰 선하심’으로 옮겼습니다.
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  english_pob_choice: the broad and fertile land
  chosen_korean: 넓고 기름진 땅
  alternatives_korean:
  - 넓고 풍성한 땅
  - 광활하고 비옥한 땅
  lexicon: HALOT
  rationale: ‘넓다’와 ‘기름지다’는 히브리어의 공간적·비옥성 이미지를 함께 담는 관용적 표현이므로, 한국어에서도 짧고 자연스럽게 유지했습니다.
- source_word: לֹא עֲבָדוּךָ
  english_pob_choice: they did not serve you
  chosen_korean: 당신을 섬기지 않았고
  alternatives_korean:
  - 당신을 예배하지 않았고
  - 당신께 봉사하지 않았고
  lexicon: HALOT
  rationale: עבד는 하나님께 대한 예배와 섬김을 함께 포함할 수 있으므로, 예배로 좁히지 않고 언약적 순종까지 포괄하는 ‘섬기다’를 택했습니다.
- source_word: וְלֹא שָׁבוּ מִמַּעַלְלֵיהֶם הָרָעִים
  english_pob_choice: did not turn from their evil deeds
  chosen_korean: 자기들의 악한 행실에서 돌아서지 않았습니다
  alternatives_korean:
  - 자기들의 악한 행실에서 회개하지 않았습니다
  - 자기들의 악한 행실을 버리지 않았습니다
  lexicon: HALOT
  rationale: שׁוּב은 문자적으로 ‘돌아서다/돌아오다’이므로, 도덕적 개념을 덧입힌 ‘회개하다’보다 원어의 동작 이미지를 살렸습니다.
theological_decisions:
- issue: 'עבד의 의미 범위: 예배와 섬김'
  chosen_reading: 당신을 섬기지 않았고
  alternative_readings:
  - 당신을 예배하지 않았고
  rationale: 본문은 하나님께 드리는 예배 행위만이 아니라 언약적 봉사와 순종의 거부를 함께 말하므로, ‘섬기다’가 신학적 범위를 더 온전히 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: שׁוּב + מן의 윤리적 의미
  chosen_reading: 악한 행실에서 돌아서지 않았습니다
  alternative_readings:
  - 악한 행실을 회개하지 않았습니다
  rationale: 본문은 구체적으로 악한 행실에서 방향을 바꾸지 않았다는 진술이므로, 회개 용어로 확대하기보다 원문이 드러내는 전환의 부재를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
