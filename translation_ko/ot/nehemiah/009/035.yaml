  to: 그들은 자기들의 왕국 안에서도[a], 당신께서 그들에게 베푸신 풍성한 은혜 가운데서도, 또 당신께서 그들 앞에 주신 넓고 비옥한 땅에서도[b] 당신을 섬기지 않았고[c], 자기들의 악한 행실에서 돌아서지 않았습니다[d].
  rationale: 원문의 병렬적인 전치사구를 ‘…안에서도/가운데서도/…에서도’로 유지했습니다. בְּמַלְכוּתָם은 ‘자기들의 왕국 안에서도’로, הַשְּׁמֵנָה는 현대어에 맞게 ‘비옥한’으로 옮겼습니다. 원문의 제공·은택 문맥을 반영하여 טוּבְךָ הָרָב은 ‘풍성한 은혜’로 자연스럽게 표현하되, עבד와 שׁוּב의 폭은 각각 ‘섬기다’와 ‘돌아서다’로 보존했습니다. 모든 각주를 해당 어구에 재배치하고, a의 잘못된 내용을 원어 어휘 대안으로 바로잡았습니다.
