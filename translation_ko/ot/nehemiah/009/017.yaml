base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them[a]. They stiffened their neck and appointed a leader to return to their slavery in their rebellion. But you are a God of forgiveness, gracious and compassionate, slow to anger and abundant in steadfast love[b], and you did not forsake them.
  footnotes:
  - marker: a
    text: Hebrew 'a God of forgivenesses'; the plural likely intensifies the idea of abundant forgiveness. Many translations smooth this to 'a forgiving God' or 'a God ready to forgive.'
    reason: lexical_alternative
  - marker: b
    text: Or 'appointed a chief' or more literally 'set a head' to return to their slavery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 듣기를 거절하고 그들 가운데서 행하신 기적들을 기억하지 아니하였습니다. 그들은 목을 굳게 하여 반역 가운데서 다시 종살이로 돌아가기 위하여 지도자를 세웠습니다. 그러나 주는 사죄의 하나님이시라 자비로우시며 은혜로우시고 노하기를 더디하시며 인자하심이 많으시며 그들을 버리지 아니하셨나이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '사죄들의 하나님'입니다. 복수형은 사죄의 풍성함을 강조하는 것으로 보입니다. 많은 번역은 이를 '사죄하시는 하나님' 또는 '용서하기를 기뻐하시는 하나님'으로 매끄럽게 다듬었습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 '수장'을 세웠다고 번역하거나, 더 직역하면 '머리를 세웠다'는 뜻으로 다시 종살이로 돌아가기 위한 것입니다.
    reason: alternative_reading
