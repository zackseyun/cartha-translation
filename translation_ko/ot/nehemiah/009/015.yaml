  source_fidelity: 수정이 필요합니다. 초안의 ‘배를 채우시고’와 ‘목마름을 채우셨으며’는 각각 굶주림과 목마름을 해소하신 결과를 덧붙여 원문의 병렬적 표현(‘그들의 굶주림을 위하여/그들의 목마름을 위하여’)을 평면화합니다. 또한 ‘들어가 차지하라’는 명령의 내용과 땅을 주겠다고 하신 맹세의 관계를 한 문장 안에서 유지해야 합니다.
  naturalness: 합쇼체 문체는 대체로 적절하나, ‘목마름을 채우다’는 현대 표준어에서 자연스럽지 않습니다. ‘그들이 굶주릴 때’, ‘그들이 목마를 때’로 옮기면 원문의 의미 관계를 자연스럽게 살릴 수 있습니다.
  terminology: לֶחֶם은 ‘먹거리’보다 ‘빵’이 더 직접적이며, נָשָׂאתָ אֶת־יָדְךָ는 맹세를 뜻하는 히브리어 관용구이므로 본문에서는 ‘맹세하신’으로 옮기고 각주에서 문자적 이미지를 밝혀야 합니다. 기존 각주는 본문과 다른 구절을 대안으로 제시하여 앵커 기능을 하지 못합니다.
