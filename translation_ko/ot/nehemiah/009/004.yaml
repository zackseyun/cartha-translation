  text: 그때 예수아, 바니, 갓미엘, 스바냐, 분니, 스레뱌, 바니, 그리고 그나니가 레위 사람들의 단[a] 위에 일어서서 큰 소리로 그들의 하나님 야훼께 부르짖었습니다.
