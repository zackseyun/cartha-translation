translation:
  language: ko
  text: 그러나 주께서는 우리에게 닥친 모든 일에 대하여 의로우십니다. 이는 주께서 신실하게 행하셨고[a], 우리는 악하게 행하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘진실을 행하셨습니다’; 곧 ‘신실하게 행하셨습니다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה צַדִּיק
  english_pob_choice: Yet you are righteous
  chosen_korean: 그러나 주께서는 ... 의로우십니다
  alternatives_korean:
  - 그런데 주께서는 ... 의롭습니다
  - 그리고 주께서는 ... 의로우십니다
  lexicon: HALOT
  rationale: 문맥상 공동체의 죄 고백에 대한 대조를 살려 ‘그러나’로 역접을 분명히 했고, צַדִּיק은 하나님의 언약적·도덕적 정당성을 살려 ‘의로우십니다’로 옮겼습니다.
- source_word: עַל כָּל הַבָּא עָלֵינוּ
  english_pob_choice: in all that has come upon us
  chosen_korean: 이 모든 일이 우리에게 닥쳤어도
  alternatives_korean:
  - 우리에게 닥친 모든 일에 대하여
  - 우리 위에 임한 모든 일에서
  lexicon: HALOT
  rationale: 히브리어의 관계 표현을 자연스러운 한국어로 풀어, 재난의 범위를 가리키는 의미를 살리면서도 ‘우리에게 닥쳤어도’로 결과 속에서도 변함없는 하나님의 의를 드러냈습니다.
- source_word: אֱמֶת עָשִׂיתָ
  english_pob_choice: you have acted faithfully
  chosen_korean: 신실하게 행하셨으나
  alternatives_korean:
  - 진실하게 행하셨으나
  - 참되게 행하셨으나
  lexicon: HALOT
  rationale: אֱמֶת־עשה는 단순한 ‘진리’보다 신실함/신뢰성을 뜻하는 결합으로 보아, 한국어 성경에서 하나님께 자주 쓰이는 ‘신실하게’로 번역했습니다.
- source_word: וַאֲנַחְנוּ הִרְשָׁעְנוּ
  english_pob_choice: but we have acted wickedly
  chosen_korean: 우리는 악하게 행하였습니다
  alternatives_korean:
  - 우리는 악을 행하였습니다
  - 우리는 죄악되게 행하였습니다
  lexicon: HALOT
  rationale: 히브리어 ההרשע는 ‘악을 행하다/악하게 하다’의 행위적 뉘앙스를 가지므로, 고백문에 맞는 직접성을 유지해 ‘악하게 행하였습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 의와 백성의 재난의 관계
  chosen_reading: 재난이 임했음에도 하나님은 의로우시며, 그 판단의 정당성을 공동체가 스스로 인정하는 고백으로 읽었습니다.
  alternative_readings:
  - 하나님께서 우리를 벌하신 것이 옳습니다
  - 우리에게 일어난 모든 일은 정당합니다
  rationale: 본문은 하나님의 의를 약화시키지 않으면서, 이스라엘의 죄와 그 결과를 정직하게 인정하는 회개의 언어를 보존합니다.
  doctrine_reference: Translation philosophy §3; the confession preserves divine righteousness amid covenant judgment.
