id: NEH.11.16
reference: Nehemiah 11:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁבְּתַ֨י וְ/יוֹזָבָ֜ד עַל הַ/מְּלָאכָ֤ה הַ/חִֽיצֹנָה֙ לְ/בֵ֣ית הָ/אֱלֹהִ֔ים מֵ/רָאשֵׁ֖י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
  footnotes:
  - marker: a
    text: Or 'the outer work for the house of God.' The Hebrew phrase can be understood as work done outside the temple proper, in contrast to internal duties.
    reason: lexical_alternative
translation:
  language: ko
  text: 스밧야와 요사밧은 레위 사람들의 우두머리들 가운데서 하나님의 집의 외부 일[a]을 맡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 집을 위한 외부 일’로도 볼 수 있습니다. 히브리어 표현은 성전 내부의 직무와 대조되는 바깥쪽 업무로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי / וְיוֹזָבָד
  english_pob_choice: And Shabbethai and Jozabad
  chosen_korean: 스밧야와 요사밧
  alternatives_korean:
  - 샤벳대와 요자밧
  - 세밧야와 요자밧
  lexicon: 고유명사 음역
  rationale: 두 인명은 고유명사이므로 음역으로 옮겼고, 히브리어 철자와 통용 음가를 고려해 표준어식으로 적었습니다.
- source_word: עַל הַמְּלָאכָה
  english_pob_choice: were over the work
  chosen_korean: 일을 맡았습니다
  alternatives_korean:
  - 일을 감독했습니다
  - 일 위에 있었습니다
  lexicon: HALOT
  rationale: עַל은 행정·감독 책임을 나타내므로, 한국어로는 자연스럽게 ‘맡다’로 풀어 책임을 드러냈습니다.
- source_word: הַחִיצֹנָה
  english_pob_choice: outside work
  chosen_korean: 외부 일
  alternatives_korean:
  - 바깥 일
  - 외곽 일
  - 외부 작업
  lexicon: HALOT
  rationale: חִיצֹנָה는 ‘바깥/외부의’라는 뜻이므로, 성전 내부의 직무와 대비되는 외부 영역을 드러내는 ‘외부 일’로 옮겼습니다.
- source_word: לְבֵית הָאֱלֹהִים
  english_pob_choice: of the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 집을 위한
  - 하나님의 집의
  lexicon: HALOT
  rationale: לְבֵית은 목적·관련을 나타내므로, 한국어에서는 ‘하나님의 집’으로 자연스럽게 연결해 성전 관련 업무임을 살렸습니다.
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  english_pob_choice: from the heads of the Levites
  chosen_korean: 레위 사람들의 우두머리들 가운데서
  alternatives_korean:
  - 레위 사람들의 지도자들 가운데서
  - 레위 사람들의 머리들로부터
  lexicon: HALOT
  rationale: רָאשֵׁי는 직역상 ‘머리들’이지만 행정적 의미의 우두머리로 이해해야 하므로, 한국어에서 자연스러운 ‘우두머리들’로 옮겼습니다.
theological_decisions:
- issue: 성전 내부 직무와 외부 직무의 대비
  chosen_reading: ‘외부 일’로 옮겨, 성전 내부의 제의적 업무와 구별되는 관리·보조 업무라는 대비를 드러냈습니다.
  alternative_readings:
  - ‘바깥 일’
  - ‘외곽 일’
  rationale: 히브리어 הַחִיצֹנָה는 단순한 공간 바깥만이 아니라 내부와 구별되는 범주의 일을 가리킬 수 있어, 대비 구조를 보존하는 번역이 필요합니다.
  doctrine_reference: 성전 봉사와 레위 직무의 구분
