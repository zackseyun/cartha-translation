revisions:
- from: 왕의 명령이 그들에게 내려져 있었고, 노래하는 사람들에게는 정해진 공급이 있었으니, 곧 매일의 일은 그날에 맞추어 주어졌습니다.[a][b]
  to: 왕의 명령이 그들에게 내려져 있었고, 노래하는 이들을 위한 정해진 규정[b]도 있었으니, 날마다 그날의 일이 정해져 있었습니다.[a]
  rationale: 'The revision retains the source''s two coordinated administrative statements: the king''s command applied to them, and an established arrangement concerned the singers. It renders the final Hebrew idiom as a daily matter set for its own day, avoiding the unsupported assertion that it was materially supplied, while footnotes preserve the viable provision/allotment nuance.'
