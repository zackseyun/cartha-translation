  text: כִּֽי מִצְוַ֥ת הַ/מֶּ֖לֶךְ עֲלֵי/הֶ֑ם וַ/אֲמָנָ֥ה עַל הַ/מְשֹׁרְרִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/023.yaml
  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
  footnotes:
  - marker: a
    text: Or “the daily requirement,” that is, what was needed for each day.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered “a fixed provision” can also denote a firm arrangement or established obligation.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕의 명령이 그들에게 내려져 있었고, 노래하는 이들을 위한 정해진 규정[b]도 있었으니, 날마다 그날의 일이 정해져 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “날마다 필요한 것”, 곧 각 날에 필요한 분량이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘정해진 규정’에 해당하는 말은 정해진 지원이나 배정, 굳게 세운 마련을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְוַת הַמֶּלֶךְ
  english_pob_choice: the king’s command
  chosen_korean: 왕의 명령
  alternatives_korean:
  - 왕의 지시
  - 왕의 명령령
  - 왕의 어명
  lexicon: HALOT
  rationale: מִצְוָה는 여기서 왕이 내린 공식적 지시를 가리키므로, 현대 한국어에서는 '명령'이 가장 자연스럽고 힘을 보존합니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: was upon them
  chosen_korean: 그들에게 내려져 있었고
  alternatives_korean:
  - 그들 위에 있었고
  - 그들에게 미치고 있었고
  - 그들에게 적용되어 있었고
  lexicon: HALOT
  rationale: ‘위에/upon’의 이미지를 살리되, 한국어에서는 권위와 의무가 실제로 미친 상태를 나타내는 '내려져 있었고'가 문맥상 분명합니다.
- source_word: וַאֲמָנָה
  english_pob_choice: a fixed provision
  chosen_korean: 정해진 공급
  alternatives_korean:
  - 확정된 배당
  - 확립된 배정
  - 정착된 제도
  lexicon: HALOT
  rationale: 행정적·실무적 맥락에서 אֲמָנָה는 확정된 지원이나 배정을 뜻하므로, '공급'을 써서 생계 지원의 성격을 드러냈습니다.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: each day’s matter on its day
  chosen_korean: 매일의 일은 그날에 맞추어 주어졌습니다
  alternatives_korean:
  - 날마다 필요한 것은 그날에 주어졌습니다
  - 하루의 일은 그날에 따라 주어졌습니다
  - 각 날의 필요는 그날에 주어졌습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 날마다 필요한 분량을 뜻하므로, 한국어에서는 '그날에 맞추어'로 반복성과 분배성을 자연스럽게 살렸습니다.
theological_decisions:
- issue: 행정 문맥에서의 אֲמָנָה 해석
  chosen_reading: ‘정해진 공급’으로 옮겨, 단순한 추상적 ‘제도’보다 실제적인 지원·배정의 의미를 드러냈습니다.
  alternative_readings:
  - 정해진 제도
  - 확립된 규정
  - 확정된 배정
  rationale: 문맥상 레위인/노래하는 사람들을 위한 일상적 유지 조치이므로, 제도적 질서와 물질적 공급을 함께 느끼게 하는 번역이 적절합니다.
  doctrine_reference: 역사서의 행정 기록은 제사·성전 봉사자들의 생활 보장을 포함할 수 있으며, 번역은 그 실질성을 희석하지 않아야 합니다.
