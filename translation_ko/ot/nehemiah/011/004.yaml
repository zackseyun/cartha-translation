  text: וּ/בִֽ/ירוּשָׁלִַ֨ם֙ יָֽשְׁב֔וּ מִ/בְּנֵ֥י יְהוּדָ֖ה וּ/מִ/בְּנֵ֣י בִנְיָמִ֑ן מִ/בְּנֵ֣י יְ֠הוּדָה עֲתָיָ֨ה בֶן עֻזִּיָּ֜ה בֶּן זְכַרְיָ֧ה בֶן אֲמַרְיָ֛ה בֶּן שְׁפַטְיָ֥ה בֶן מַהֲלַלְאֵ֖ל מִ/בְּנֵי פָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
  footnotes:
  - marker: a
    text: Or 'dwelt' for 'there lived.' The Hebrew verb can denote residing or settling.
    reason: lexical_alternative
  - marker: b
    text: '''Sons of Judah'' and ''sons of Benjamin'' means members or descendants of those tribal lines.'
    reason: cultural_note
translation:
  language: ko
  text: 예루살렘에는 유다 자손 가운데 일부와 베냐민 자손 가운데 일부가 살았습니다[a]. 유다 자손 가운데서는 베레스 자손인 아다야가 있었는데, 그는 웃시야의 아들이며, 웃시야는 스가랴의 아들이고, 스가랴는 아마랴의 아들이며, 아마랴는 스바댜의 아들이고, 스바댜는 마할랄렐의 아들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살았습니다’에 해당하는 히브리어 동사 יָשַׁב은 ‘거주하다’ 또는 ‘정착하다’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  english_pob_choice: And in Jerusalem
  chosen_korean: 예루살렘에는
  alternatives_korean:
  - 그리고 예루살렘에
  - 예루살렘에서
  lexicon: HALOT
  rationale: 장소 전치사 구문은 한국어에서 조사 ‘-에는’으로 자연스럽게 살리되, 서술 흐름의 도입 기능을 유지했습니다.
- source_word: יָשְׁבוּ
  english_pob_choice: there lived
  chosen_korean: 살고 있었습니다
  alternatives_korean:
  - 거주했습니다
  - 살았습니다
  - 거기 살았습니다
  lexicon: HALOT
  rationale: ישב의 거주 의미를 현대 한국어의 현재진행/상태형으로 풀어 자연스럽게 옮기되, 단순 행위보다 정착·거주의 뉘앙스를 살렸습니다.
- source_word: מִבְּנֵי יְהוּדָה וּמִבְּנֵי בִנְיָמִן
  english_pob_choice: some of the sons of Judah and some of the sons of Benjamin
  chosen_korean: 유다 자손과 베냐민 자손 가운데서 일부
  alternatives_korean:
  - 유다 자손과 베냐민 자손 중 일부
  - 유다와 베냐민 사람들 가운데 일부
  lexicon: HALOT
  rationale: ‘sons of’는 지파-가문 계열을 가리키므로 ‘자손’으로 옮겼고, 부분적 의미는 ‘가운데서 일부’로 드러냈습니다.
- source_word: עֲתָיָה … בֶן פָּרֶץ
  english_pob_choice: Athaiah ... of the sons of Perez
  chosen_korean: 아타야, 곧 ... 베레스 자손이었습니다
  alternatives_korean:
  - 아타야 ... 베레스의 자손이었습니다
  - 아타야 ... 베레스 집안 사람이었습니다
  lexicon: HALOT
  rationale: 인명과 계보는 음역을 유지하고, 마지막의 ‘sons of Perez’는 유다 지파 내의 씨족 계열을 나타내므로 ‘베레스 자손’으로 보존했습니다.
theological_decisions:
