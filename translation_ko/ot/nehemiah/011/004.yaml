revisions:
- from: 예루살렘에는 유다 자손과 베냐민 자손 가운데서 일부가 살고 있었습니다[a]. 유다 자손 가운데서는 아타야, 곧 웃시야의 아들, 스가랴의 아들, 아마랴의 아들, 스바댜의 아들, 마할랄엘의 아들, 베레스 자손이었습니다.
  to: 예루살렘에는 유다 자손 가운데 일부와 베냐민 자손 가운데 일부가 살았습니다[a]. 유다 자손 가운데서는 베레스 자손인 아다야가 있었는데, 그는 웃시야의 아들이며, 웃시야는 스가랴의 아들이고, 스가랴는 아마랴의 아들이며, 아마랴는 스바댜의 아들이고, 스바댜는 마할랄렐의 아들이었습니다.
  rationale: 계보의 압축된 히브리어 연쇄를 한국어 문장 안에서 명확한 관계절과 병렬 절로 풀어, 아다야의 베레스 계통 소속과 조상들의 계보를 정확히 드러냈습니다. 두 지파 각각에 대한 부분 표현을 보존하고, 인명은 표준 한국어 성경식 음역으로 정리했습니다.
