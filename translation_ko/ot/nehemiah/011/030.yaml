base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
  footnotes:
  - marker: a
    text: Or 'its villages' / 'its dependent towns' for 'its daughter towns.'
    reason: lexical_alternative
  - marker: b
    text: The verb can also be rendered 'they encamped' or, by extension in this context, 'they settled.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사노아[a]와 아둘람 및 그 마을들, 라기스와 그 밭들, 아세가와 그 딸 성읍들[b]. 그들은 브엘세바에서부터 힌놈 골짜기까지 진을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자노아’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 딸 성읍들’로, 종속 정착지를 가리키는 지리적 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  english_pob_choice: Zanoah
  chosen_korean: 사노아
  alternatives_korean:
  - 자노아
  lexicon: HALOT
  rationale: 지명 고유명사이므로 음역하며, 한국어 성서권에서 통용되는 형태인 사노아를 택했습니다.
- source_word: חַצְרֵיהֶם
  english_pob_choice: their villages
  chosen_korean: 그 마을들
  alternatives_korean:
  - 그들의 마을들
  - 그 마을
  - 그 촌락들
  lexicon: HALOT
  rationale: 본문은 도시 목록의 맥락에서 واب속 촌락들을 가리키므로, 영어 POB의 'their villages'에 맞추어 자연스럽게 '그 마을들'로 옮겼습니다.
- source_word: שְׂדֹתֶיהָ
  english_pob_choice: its fields
  chosen_korean: 그 밭
  alternatives_korean:
  - 그 땅
  - 그 들판
  - 그 영토
  lexicon: HALOT
  rationale: שָׂדֶה의 기본 뜻인 '밭/들'을 살리되, 도시 소유 농경지를 가리키는 맥락을 고려해 '그 밭'으로 옮겼습니다.
- source_word: בְנֹתֶיהָ
  english_pob_choice: its daughter towns
  chosen_korean: 그 딸 성읍들
  alternatives_korean:
  - 그 부속 마을들
  - 그 종속 성읍들
  - 그 마을들
  lexicon: HALOT
  rationale: 지리 목록에서 '딸들'은 종속 정착지를 뜻하는 관용구이므로, 은유를 보존하는 '딸 성읍들'을 택했습니다.
- source_word: וַיַּחֲנוּ
  english_pob_choice: they camped
  chosen_korean: 진을 쳤습니다
  alternatives_korean:
  - 캠프했습니다
  - 야영했습니다
  - 진쳤습니다
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 '진을 치다/야영하다'를 살리면서, 군사적·집단적 정착의 뉘앙스를 자연스럽게 드러내는 표현으로 옮겼습니다.
