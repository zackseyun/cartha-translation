revisions:
- from: 요엘은 스가리의 아들이며 그들 위에 감독이었고[a], 하스누아의 아들 유다는 성읍의 둘째였습니다.
  to: 요엘은 시그리의 아들이며 그들을 맡은 감독이었고, 스누아의 아들 유다는 성읍을 맡은 둘째 사람이었습니다[a].
  rationale: 관계 표현을 자연스러운 한국어로 고치고, מִשְׁנֶה의 직책을 특정 제도로 단정하지 않도록 ‘둘째 사람’으로 유지했습니다. 각주의 위치와 내용을 해당 어구에 맞추었으며, 이름은 통용 한국어 성경 표기에 맞추었습니다.
