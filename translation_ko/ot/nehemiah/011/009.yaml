base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/009.yaml
  text: And Joel son of Zichri was overseer over them[a], and Judah son of Hassenuah was second over the city.
  footnotes:
  - marker: a
    text: Or 'deputy over the city' or 'second in command over the city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요엘은 스가리의 아들이며 그들 위에 감독이었고[a], 하스누아의 아들 유다는 성읍의 둘째였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성읍의 대리’ 혹은 ‘성읍에서 둘째 가는 사람’.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקִיד
  english_pob_choice: overseer
  chosen_korean: 감독
  alternatives_korean:
  - 관리자
  - 책임자
  - 감시관
  lexicon: HALOT
  rationale: 행정적·관리적 책임을 맡은 사람이라는 뜻을 살려, 한국어에서도 지배적 뉘앙스가 강하지 않은 ‘감독’으로 옮겼습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: over them
  chosen_korean: 그들 위에
  alternatives_korean:
  - 그들에 대한
  - 그들을 다스리는
  lexicon: HALOT
  rationale: 히브리어 전치사 על의 지배·감독 관계를 직역에 가깝게 드러내면서도 자연스러운 한국어 어순을 유지했습니다.
- source_word: מִשְׁנֶה
  english_pob_choice: second
  chosen_korean: 둘째
  alternatives_korean:
  - 부관
  - 대리
  - 제2인자
  lexicon: HALOT
  rationale: ‘둘째’는 원문의 간결함을 살리며, 정확한 직책 명칭을 과도하게 좁히지 않습니다.
- source_word: עַל הָעִיר
  english_pob_choice: over the city
  chosen_korean: 성읍의
  alternatives_korean:
  - 성읍 위의
  - 성읍을 맡은
  lexicon: HALOT
  rationale: ‘성읍의 둘째’로 자연스럽게 연결해, 도시 행정에서의 서열 관계를 한국어로 간명하게 표현했습니다.
- source_word: הַסְּנוּאָה
  english_pob_choice: Hassenuah
  chosen_korean: 하스누아
  alternatives_korean:
  - 스누아
  lexicon: HALOT
  rationale: 고유명사는 음역하며, 관사가 결합된 히브리어 형태를 반영해 통용되는 음역을 따랐습니다.
