  to: 백성은 예루살렘에 살기를 자원한 모든 남자에게 복을 빌어 주었습니다.[a]
  rationale: 원문의 성별 표지(‘모든 남자’)를 보존하고, 자원한 내용이 ‘예루살렘에 사는 것’임을 더 직접적으로 표현했습니다. 사람을 대상으로 한 ברך는 한국어에서 자연스럽게 ‘복을 빌어 주었습니다’로 옮겼습니다.
