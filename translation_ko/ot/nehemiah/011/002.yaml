  source_fidelity: 히브리어의 핵심 구조, 곧 백성이 예루살렘에 살기를 자원한 이들을 축복한 것은 대체로 잘 옮겼습니다. 그러나 הָאֲנָשִׁים는 여기서 ‘사람들’보다 명시적으로 ‘남자들’이며, 제공된 영어 감사 기록도 이 성별 표지를 유지합니다. 또한 לָשֶׁבֶת는 ‘거주하려고’보다 ‘살기를/거주하기를 자원한’처럼 자원의 내용을 나타내는 표현이 더 정확합니다.
  naturalness: ‘복을 빌어 주었습니다’는 사람이 다른 사람에게 ברך를 행하는 문맥을 자연스러운 현대 한국어 합쇼체로 나타냅니다. ‘예루살렘에 살기를 자원한’도 간결하고 자연스럽습니다.
