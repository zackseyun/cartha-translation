    text: Or 'who volunteered to live in Jerusalem.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 백성은 예루살렘에 거주하려고 자원한 모든 사람을 축복했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘에 살도록 자원한 사람들’로 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  english_pob_choice: blessed
  chosen_korean: 축복했습니다
  alternatives_korean:
  - 복을 빌었습니다
  - 칭찬했습니다
  lexicon: HALOT
  rationale: בּרך의 피엘형은 여기서 사람을 향해 축복하거나 복을 비는 뜻이므로, ‘축복했습니다’가 원문의 동사를 가장 직접적으로 살립니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성은
  alternatives_korean:
  - 사람들은
  - 무리들은
  lexicon: HALOT
  rationale: עם은 집합 명사로서 ‘백성’이 자연스럽고 원문과도 가깝습니다.
- source_word: לְכֹל הָאֲנָשִׁים
  english_pob_choice: all the men
  chosen_korean: 모든 사람을
  alternatives_korean:
  - 모든 남자를
  - 모든 이들을
  lexicon: HALOT
  rationale: 영어 POB의 gender-accurate 판단을 참고하되, 한국어에서는 ‘남자’보다 이 문맥의 집합적 대상을 드러내는 ‘모든 사람’을 택해 의미를 자연스럽게 전달했습니다.
- source_word: הַמִּתְנַדְּבִים לָשֶׁבֶת
  english_pob_choice: who willingly offered themselves to live
  chosen_korean: 거주하려고 자원한
  alternatives_korean:
  - 살기로 기꺼이 나선
  - 거주하기를 자청한
  lexicon: HALOT
  rationale: התנדב는 자원하여 자신을 내어놓는 뉘앙스가 있어 ‘자원한’으로, לָשֶׁבֶת는 정착을 뜻하는 문맥상 ‘거주하다’로 옮겼습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에
  alternatives_korean:
  - 예루살렘에서
  lexicon: HALOT
  rationale: 지명 앞의 전치사는 한국어에서 목적지·거주지의 방향을 반영해 ‘예루살렘에’로 옮겼습니다.
theological_decisions:
- issue: ‘축복하다’의 주체와 대상 관계
  chosen_reading: 백성이 자원하여 예루살렘에 살기로 한 사람들을 축복하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 칭찬하는 장면
  - 공적으로 승인하는 장면
  rationale: 히브리어 ברך의 기본 의미를 살리되, 사람을 대상으로 한 용례이므로 종교적 ‘찬양’이나 단순한 ‘승인’으로 약화시키지 않았습니다.
  doctrine_reference: '번역 원칙: 원문 어휘의 직접성 유지'
- issue: 이 문맥에서의 남성 복수 명사 처리
  chosen_reading: 히브리어 אנשים의 남성형을 원문상의 지시 범위로 보되, 한국어에서는 과도한 성별 표지를 피했습니다.
  alternative_readings:
  - ‘모든 남자’를 직역
  - ‘모든 사람’을 일반화
  rationale: 영어 POB는 성별 정확성을 위해 ‘all the men’을 유지했지만, 한국어 합쇼체 본문에서는 문맥 전달을 우선해 중립적 집합 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
