  yaml_path: translation/ot/nehemiah/011/021.yaml
  text: And the temple servants were living on the Ophel[a], and Ziha and Gishpa were over the temple servants.
  footnotes:
  - marker: a
    text: Hebrew נְתִינִים (Nethinim), a technical term for a class assigned to temple service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 성전 종들은 오벨에 살고 있었으며, 시하와 기스바는 성전 종들을 감독했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְתִינִים(Nethinim)은 성전 봉사에 배속된 한 부류를 가리키는 기술 용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  english_pob_choice: the temple servants
  chosen_korean: 성전 종들
  alternatives_korean:
  - 느디님
  - 성전 일꾼들
  - 종들
  lexicon: HALOT
  rationale: נְתִינִים은 포로기 이후 성전 봉사를 맡은 특정 집단을 가리키므로, 기능을 드러내는 ‘성전 종들’이 본문의 제도적 의미를 가장 잘 전달합니다.
- source_word: יֹשְׁבִים
  english_pob_choice: were living
  chosen_korean: 살고 있었으며
  alternatives_korean:
  - 거주하고 있었으며
  - 살았습니다
  - 거주했습니다
  lexicon: HALOT
  rationale: 분사는 지속적 거주를 나타내므로, 현대 한국어에서는 ‘살고 있었으며’가 현재 진행된 상태를 자연스럽게 살립니다.
- source_word: בָּעֹפֶל
  english_pob_choice: on the Ophel
  chosen_korean: 오벨에
  alternatives_korean:
  - 오벨 위에
  - 오벨에서
  - 오벨에 있는
  lexicon: HALOT
  rationale: עֹפֶל은 지명/지형명으로 굳어진 ‘오벨’이 적절하며, 위치 표시는 한국어 조사 ‘-에’로 간결하게 옮겼습니다.
- source_word: עַל
  english_pob_choice: were over
  chosen_korean: 감독했습니다
  alternatives_korean:
  - 책임지고 있었습니다
  - 위에 있었습니다
  - 관리했습니다
  lexicon: HALOT
  rationale: 행정적·감독적 관계를 나타내는 עַל을 직역식 ‘위에’보다 한국어 행정문맥에 맞는 ‘감독했습니다’로 옮겨 권한 관계를 분명히 했습니다.
theological_decisions:
- issue: 느디님 용어를 음역할지 기능어로 풀어쓸지
  chosen_reading: ‘성전 종들’로 기능을 드러내되, 본문 주석에서 기술용어임을 추적 가능하게 남깁니다.
  alternative_readings:
  - 느디님
  - 성전 봉사자들
  rationale: 본문 이해를 돕기 위해 기능을 우선했지만, 이는 특정 계층의 제도적 명칭이라는 점을 지우지 않는 번역입니다.
  doctrine_reference: 에즈라-느헤미야의 성전 질서와 봉사 구조
