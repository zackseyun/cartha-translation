  rationale: 본문 이해를 돕기 위해 기능을 우선했지만, 이는 특정 계층의 제도적 명칭이라는 점을 지우지 않는 번역입니다.
  doctrine_reference: 에즈라-느헤미야의 성전 질서와 봉사 구조
