  - 거주했습니다
  lexicon: HALOT
  rationale: 분사는 지속적 거주를 나타내므로, 현대 한국어에서는 ‘살고 있었으며’가 현재 진행된 상태를 자연스럽게 살립니다.
- source_word: בָּעֹפֶל
  english_pob_choice: on the Ophel
  chosen_korean: 오벨에
  alternatives_korean:
  - 오벨 위에
  - 오벨에서
  - 오벨에 있는
  lexicon: HALOT
  rationale: עֹפֶל은 지명/지형명으로 굳어진 ‘오벨’이 적절하며, 위치 표시는 한국어 조사 ‘-에’로 간결하게 옮겼습니다.
- source_word: עַל
  english_pob_choice: were over
  chosen_korean: 감독했습니다
  alternatives_korean:
  - 책임지고 있었습니다
  - 위에 있었습니다
  - 관리했습니다
  lexicon: HALOT
  rationale: 행정적·감독적 관계를 나타내는 עַל을 직역식 ‘위에’보다 한국어 행정문맥에 맞는 ‘감독했습니다’로 옮겨 권한 관계를 분명히 했습니다.
theological_decisions:
- issue: 느디님 용어를 음역할지 기능어로 풀어쓸지
  chosen_reading: ‘성전 종들’로 기능을 드러내되, 본문 주석에서 기술용어임을 추적 가능하게 남깁니다.
  alternative_readings:
  - 느디님
