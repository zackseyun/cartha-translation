  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
  footnotes:
  - marker: a
    text: Or 'chief' or 'overseer' of the house of God.
    reason: lexical_alternative
  - marker: b
    text: That is, the temple.
    reason: cultural_note
translation:
  language: ko
  text: 스라야는 힐기야의 아들이며, 므술람의 아들이며, 사독의 아들이며, 므라욧의 아들이며, 아히둡의 아들이고, 하나님의 집[b]을 맡은 지도자[a]였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우두머리’나 ‘감독’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 성전입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂרָיָה
  english_pob_choice: Seraiah
  chosen_korean: 스랴
  alternatives_korean:
  - 세라야
  - 스라야
  lexicon: 외래어 표기 관행
  rationale: 고유명사는 한국어 성경에서 널리 쓰이는 음역을 따르는 것이 자연스럽습니다. 본문의 인명은 표준 개신교 관행에 맞춰 '스랴'로 옮겼습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 후손
  - ~의 자
  lexicon: HALOT
  rationale: 반복되는 족보식 연결어이므로 관계를 직접 드러내는 '아들'이 가장 자연스럽고, 여기서는 세대를 일반화할 압박이 없습니다.
- source_word: נְגִיד
  english_pob_choice: leader
  chosen_korean: 지도자
  alternatives_korean:
  - 관리자
  - 우두머리
  - 지휘자
  lexicon: HALOT
  rationale: נְגִיד는 맡겨진 자리를 이끄는 사람을 가리키므로, 행정·성전 문맥에서 과도한 왕권 뉘앙스를 피하면서도 분명한 '지도자'가 적절합니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님 집
  alternatives_korean:
  - 하나님의 집
  - 성전
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리기 위해 '하나님 집'을 채택했습니다. POB의 영어처럼 본문이 말하는 투명한 표현을 유지하는 쪽이 낫고, 이를 곧바로 '성전'으로 풀어쓰면 원문 이미지가 약해집니다.
theological_decisions:
- issue: נְגִיד의 직분을 어떻게 한국어로 표시할지
  chosen_reading: 중립적 행정-성전 직분 표현인 '지도자'로 옮겼습니다.
  alternative_readings:
  - 관리자
  - 우두머리
  - 통치자
  rationale: 본문은 왕적 통치보다 하나님 집의 책임자라는 기능을 강조하므로, 위계는 드러내되 통치권을 과도하게 부각하지 않는 번역이 적합합니다.
  doctrine_reference: 성전 봉사와 공동체 질서에 대한 구약의 서술 맥락
