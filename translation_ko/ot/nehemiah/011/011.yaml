  source_fidelity: 계보의 반복된 בֶן을 ‘아들’로 유지하고 נְגִיד을 중립적인 ‘지도자’로 옮긴 방향은 원문에 충실합니다. 다만 인명 ‘스랴’는 표준 한국어 성경의 통용 표기 및 히브리어 발음에 비추어 ‘스라야’가 더 적절하며, 각주 표지가 가리키는 본문 요소와 일치하지 않습니다.
  naturalness: ‘하나님 집의 지도자’도 이해할 수 있으나, 현대 표준어에서는 ‘하나님의 집을 맡은 지도자’가 더 자연스럽고 직분의 관계를 분명히 합니다. 계보식 문장은 ‘아들이며/아들이고’로 연결하면 자연스럽습니다.
  terminology: ‘하나님의 집’은 בֵּית הָאֱלֹהִים의 직역성을 보존하며, 성전을 뜻한다는 문화적 각주를 유지할 수 있습니다. ‘지도자’는 נְגִיד의 의미 범위 안에 있으면서 왕적 의미를 과도하게 부여하지 않습니다.
  issues:
