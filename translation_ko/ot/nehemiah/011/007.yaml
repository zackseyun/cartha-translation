source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י בִנְיָמִ֑ן סַלֻּ֡א בֶּן מְשֻׁלָּ֡ם בֶּן יוֹעֵ֡ד בֶּן פְּדָיָה֩ בֶן ק֨וֹלָיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן אִֽיתִיאֵ֖ל בֶּן יְשַֽׁעְיָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of Benjamin' may also be understood more broadly as 'descendants of Benjamin' or 'Benjamites.'
    reason: lexical_alternative
  - marker: b
    text: The name 'Joed' follows the Masoretic Text here. A parallel genealogy in 1 Chronicles 9:7 reads 'Hodaviah.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이것들은 베냐민의 아들들입니다. 살루가 메술람의 아들이요[a], 요에드의 아들이요, 브다야의 아들이요, 골랴의 아들이요, 마아세야의 아들이요, 이디엘의 아들이요[b], 여사야의 아들들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘베냐민의 아들들’은 더 넓게는 ‘베냐민의 자손들’ 또는 ‘베냐민 사람들’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름은 여기서 마소라 본문의 ‘요에드’를 따랐습니다. 역대상 9:7의 평행 족보에는 ‘호다위야’가 나옵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these were
  chosen_korean: 그리고 이것들은
  alternatives_korean:
  - 이것들은
  - 그리고 이들은
  lexicon: BHS/WLC
  rationale: 계보 목록을 이어 주는 표지로서 자연스러운 연결을 살리되, 지나친 해설 없이 다음 항목을 도입하는 표현으로 옮겼습니다.
- source_word: בְּנֵי בִנְיָמִן
  english_pob_choice: the sons of Benjamin
  chosen_korean: 베냐민의 아들들
  alternatives_korean:
  - 베냐민의 자손들
  - 베냐민 사람들
  lexicon: HALOT
  rationale: 직역적 계보 표현을 유지해 혈통과 지파 정체성을 분명히 드러냈습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들이요
  alternatives_korean:
  - 아들입니다
  - 후손입니다
  lexicon: HALOT
  rationale: 반복되는 계보 공식이므로 한국어에서는 연결된 목록 리듬을 살리는 ‘아들이요’로 처리했습니다.
- source_word: יוֹעֵד
  english_pob_choice: Joed
  chosen_korean: 요에드
  alternatives_korean:
  - 조에드
  - 요이다
  lexicon: BDB/HALOT
  rationale: 본문의 마소라 자모형에 따라 요에드로 음역했고, 사본 조화형은 본문 대신 각주로만 다뤘습니다.
- source_word: אִיתִיאֵל
  english_pob_choice: Ithiel
  chosen_korean: 이디엘
  alternatives_korean:
  - 잇디엘
  - 이티엘
  lexicon: BDB/HALOT
  rationale: 고유명사는 현대 한국어 음역 원칙에 맞춰 음가를 보존하는 쪽으로 옮겼습니다.
- source_word: יְשַׁעְיָה
  english_pob_choice: Jeshaiah
  chosen_korean: 여사야
  alternatives_korean:
  - 예사야
  - 이사야
  lexicon: BDB/HALOT
  rationale: 예언자 이사야와 구별되는 계보 인명이므로, 영어 POB의 구분을 따라 별개의 고유명사로 음역했습니다.
theological_decisions:
- issue: Hebrew genealogical idiom בְּנֵי may denote broader descent, not only literal sons.
  chosen_reading: 기본 문구는 ‘베냐민의 아들들’로 두되, 혈통 표지로 읽히는 계보 문맥을 그대로 반영했습니다.
  alternative_readings:
  - 베냐민의 자손들
  - 베냐민 사람들
  rationale: 이 절은 직접 신학적 논쟁보다 족보적 소속을 보여 주는 문맥이므로, 원문의 형식을 우선하면서도 한국어 독자가 의미 확장을 추론할 수 있게 했습니다.
  doctrine_reference: 계보/지파 표지의 문맥적 의미
- issue: The phrase is a closed genealogy list with repeated son-formulas.
  chosen_reading: 한국어에서는 반복되는 ‘아들이요’ 구조로 계보의 호흡과 나열감을 살렸습니다.
  alternative_readings:
  - 각 항목을 ‘~의 아들’로 단순 병렬
  - 문장을 더 매끄럽게 재배열
  rationale: 원문이 가진 계보 공식성과 연쇄 구조를 약화시키지 않기 위해, 매끄러움보다 목록의 원형을 우선했습니다.
  doctrine_reference: 문학 형식 보존
