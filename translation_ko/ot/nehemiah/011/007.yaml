    rationale: a는 ‘베냐민의 아들들’에 관한 각주인데 메술람 뒤에 있고, b는 요에드의 이문에 관한 각주인데 이디엘 뒤에 있습니다.
  - severity: medium
    issue: קוֹלָיָה를 ‘골랴’로 음역함
    rationale: 끝의 -야(יָה)를 반영한 ‘골라야’가 히브리어 형태와 한국어 성서 인명 관습에 더 충실합니다.
  - severity: medium
