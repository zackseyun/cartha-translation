  text: וְ/אֵ֖לֶּה בְּנֵ֣י בִנְיָמִ֑ן סַלֻּ֡א בֶּן מְשֻׁלָּ֡ם בֶּן יוֹעֵ֡ד בֶּן פְּדָיָה֩ בֶן ק֨וֹלָיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן אִֽיתִיאֵ֖ל בֶּן יְשַֽׁעְיָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of Benjamin' may also be understood more broadly as 'descendants of Benjamin' or 'Benjamites.'
    reason: lexical_alternative
  - marker: b
    text: The name 'Joed' follows the Masoretic Text here. A parallel genealogy in 1 Chronicles 9:7 reads 'Hodaviah.'
    reason: alternative_reading
translation:
  language: ko
  text: 베냐민의 아들들은 이러합니다[a]. 살루는 메술람의 아들이며, 메술람은 요에드의 아들이고[b], 요에드는 브다야의 아들이며, 브다야는 골라야의 아들이고, 골라야는 마아세야의 아들이며, 마아세야는 이디엘의 아들이고, 이디엘은 여사야의 아들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘베냐민의 아들들’은 더 넓게는 ‘베냐민의 자손들’ 또는 ‘베냐민 사람들’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름은 여기서 마소라 본문의 ‘요에드’를 따랐습니다. 역대상 9:7의 평행 족보에는 ‘호다위야’가 나옵니다.
    reason: alternative_reading
