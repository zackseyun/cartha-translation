theological_decisions:
- issue: Hebrew genealogical idiom בְּנֵי may denote broader descent, not only literal sons.
  chosen_reading: 기본 문구는 ‘베냐민의 아들들’로 두되, 혈통 표지로 읽히는 계보 문맥을 그대로 반영했습니다.
  alternative_readings:
  - 베냐민의 자손들
  - 베냐민 사람들
  rationale: 이 절은 직접 신학적 논쟁보다 족보적 소속을 보여 주는 문맥이므로, 원문의 형식을 우선하면서도 한국어 독자가 의미 확장을 추론할 수 있게 했습니다.
  doctrine_reference: 계보/지파 표지의 문맥적 의미
- issue: The phrase is a closed genealogy list with repeated son-formulas.
  chosen_reading: 한국어에서는 반복되는 ‘아들이요’ 구조로 계보의 호흡과 나열감을 살렸습니다.
  alternative_readings:
  - 각 항목을 ‘~의 아들’로 단순 병렬
  - 문장을 더 매끄럽게 재배열
  rationale: 원문이 가진 계보 공식성과 연쇄 구조를 약화시키지 않기 위해, 매끄러움보다 목록의 원형을 우선했습니다.
  doctrine_reference: 문학 형식 보존
