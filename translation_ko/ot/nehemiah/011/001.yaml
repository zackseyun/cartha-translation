  text: 백성의 관리들은 예루살렘에 살았고, 나머지 백성은 열 명 가운데 한 명을 거룩한 성 예루살렘에 살게 하려고 제비를 뽑았습니다. 나머지 아홉 부분은 성읍들에 머물렀습니다.[a]
