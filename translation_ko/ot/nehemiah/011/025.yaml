  text: וְ/אֶל הַ/חֲצֵרִ֖ים בִּ/שְׂדֹתָ֑/ם מִ/בְּנֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ בְּ/קִרְיַ֤ת הָֽאַרְבַּע֙ וּ/בְנֹתֶ֔י/הָ וּ/בְ/דִיבֹן֙ וּ/בְנֹתֶ֔י/הָ וּ/בִֽ/יקַּבְצְאֵ֖ל וַ/חֲצֵרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
  footnotes:
  - marker: a
    text: Kiriath-arba is the older name for Hebron; compare Joshua 14:15.
    reason: cross_reference
  - marker: b
    text: Hebrew 'its daughters,' an idiom for a town's dependent or surrounding villages.
    reason: lexical_alternative
  - marker: c
    text: Jekabzeel is also rendered 'Kabzeel' in some related traditions and passages.
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 들판에 있는 마을들에 관해서는, 유다 자손 가운데 일부가 기럇아르바와 그 마을들, 디본과 그 마을들, 그리고 억갑스엘과 그 정착지들에 살았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 기럇아르바는 헤브론의 옛 이름입니다. 여호수아 14:15를 보십시오.
    reason: cross_reference
  - marker: b
    text: 히브리어의 '그의 딸들'은 한 도시의 종속된 주변 마을들을 가리키는 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 억갑스엘은 관련 전승과 다른 본문들에서 '갑스엘'로도 번역됩니다.
    reason: alternative_reading
