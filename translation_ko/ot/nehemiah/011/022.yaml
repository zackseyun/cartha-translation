id: NEH.11.22
reference: Nehemiah 11:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פְקִ֤יד הַ/לְוִיִּם֙ בִּ/יר֣וּשָׁלִַ֔ם עֻזִּ֤י בֶן בָּנִי֙ בֶּן חֲשַׁבְיָ֔ה בֶּן מַתַּנְיָ֖ה בֶּן מִיכָ֑א מִ/בְּנֵ֤י אָסָף֙ הַ/מְשֹׁ֣רְרִ֔ים לְ/נֶ֖גֶד מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
  footnotes:
  - marker: a
    text: Or 'in charge of the work of the house of God.' The Hebrew phrase with לְנֶגֶד can express oversight or responsibility in relation to the temple work.
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘의 레위인 감독은 아삽의 아들들인 노래하는 자들 가운데서, 느아니의 아들 우지요. 그는 하나님의 집의 일에 대한 책임을 맡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 집의 일을 맡은 자’. 히브리어 לְנֶגֶד는 이 문맥에서 감독 책임의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  english_pob_choice: the overseer of the Levites
  chosen_korean: 레위인 감독
  alternatives_korean:
  - 레위인들의 감독
  - 레위인 관리
  - 레위인 위원
  lexicon: HALOT
  rationale: פְּקִיד은 임명되어 감독·관리하는 직책을 가리키므로, 한국어에서는 직책명으로 자연스러운 ‘감독’이 가장 직접적입니다.
- source_word: מִבְּנֵי אָסָף הַמְשֹׁרְרִים
  english_pob_choice: from the sons of Asaph, the singers
  chosen_korean: 아삽의 아들들인 노래하는 자들 가운데서
  alternatives_korean:
  - 아삽의 아들들인 찬양하는 자들 가운데서
  - 아삽의 자손들인 노래하는 자들 가운데서
  lexicon: HALOT
  rationale: מִבְּנֵי는 혈통·계열 표시를 유지하고, הַמְשֹׁרְרִים은 성전 봉사 집단의 역할을 살려 ‘노래하는 자들’로 옮겼습니다.
- source_word: לְנֶגֶד מְלֶאכֶת בֵּית הָאֱלֹהִים
  english_pob_choice: over the work of the house of God
  chosen_korean: 하나님의 집의 일에 대한 책임을 맡았습니다
  alternatives_korean:
  - 하나님의 집의 일 위에 있었습니다
  - 하나님의 집의 일을 감독했습니다
  - 하나님의 집의 일에 대하여 맡았습니다
  lexicon: HALOT
  rationale: לְנֶגֶד는 단순한 ‘앞에’보다 책임·관할의 뉘앙스를 띠므로, 문맥상 감독 책임을 드러내는 한국어로 풀었습니다.
- source_word: בֵּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 아들인
  - 후손
  lexicon: HALOT
  rationale: 반복되는 בן 족보식을 투명하게 드러내기 위해 ‘아들’로 직역했습니다.
theological_decisions:
- issue: לְנֶגֶד의 행정적/감독적 의미
  chosen_reading: 이 구절은 단순히 ‘성전 일 앞에 있는 위치’가 아니라, 레위인 업무에 대한 실제 감독·책임을 말합니다.
  alternative_readings:
  - 단순한 위치 설명
  - 성전 일에 대한 일반적 관련성
  rationale: 영어 POB도 수정 과정을 통해 책임/감독 의미를 택했으므로, 한국어도 그 행정적 함의를 분명히 살렸습니다.
  doctrine_reference: 성전 직무와 위임 책임에 대한 본문 문맥
