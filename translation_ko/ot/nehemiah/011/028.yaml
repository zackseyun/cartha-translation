  text: and in Ziklag[a], and in Mekonah and its daughter villages.
  footnotes:
  - marker: a
    text: Literally, 'and in its daughters,' an idiom for the smaller villages or dependent settlements belonging to Mekonah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시글락에 있으며, 므고나에 있으며, 그 딸 마을들에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘그 딸들’이지만, 여기서는 메고나에 딸린 작은 마을이나 종속 정착지를 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/צִקְלַ֥ג
  english_pob_choice: and in Ziklag
  chosen_korean: 그리고 시글락에 있으며
  alternatives_korean:
  - 그리고 시글락에 있었습니다
  - 또한 시글락에 있으며
  lexicon: HALOT
  rationale: 전치사 בְּ는 여기서 위치를 나타내므로 ‘에’로 옮기고, המקום 이름 צִקְלַג는 통용 음역인 ‘시글락’을 썼습니다. 절문의 병렬 구조를 살려 연결어 ‘그리고’를 유지했습니다.
- source_word: וּ/בִ/מְכֹנָ֖ה
  english_pob_choice: and in Mekonah
  chosen_korean: 므고나에 있으며
  alternatives_korean:
  - 메코나에 있으며
  - 그리고 메코나에 있으며
  lexicon: HALOT
  rationale: מְכֹנָה는 고유지명으로 음역하되, 자음과 모음값을 반영해 ‘므고나’로 옮겼습니다. 영어 POB의 ‘Mekonah’에 대응하는 지명 음역입니다.
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  english_pob_choice: and its daughter villages
  chosen_korean: 그 딸 마을들에 있었습니다
  alternatives_korean:
  - 그 딸 마을들에 있으며
  - 그 딸들에 있었습니다
  - 그 종속 마을들에 있었습니다
  lexicon: HALOT
  rationale: בְּנוֹתֶיהָ는 문자적으로 ‘그의/그것의 딸들’이지만, 지배 마을에 딸린 하위 정착지를 가리키는 관용구이므로 ‘딸 마을들’로 살렸습니다. 영어 POB의 ‘daughter villages’와 같은 비유를 한국어에서도 보존했습니다.
