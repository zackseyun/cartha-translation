  text: וּ/מַעֲשֵׂיָ֣ה בֶן בָּר֣וּךְ בֶּן כָּל חֹ֠זֶה בֶּן חֲזָיָ֨ה בֶן עֲדָיָ֧ה בֶן יוֹיָרִ֛יב בֶּן זְכַרְיָ֖ה בֶּן הַ/שִּׁלֹנִֽי־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/005.yaml
  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
  footnotes:
  - marker: a
    text: Or "the Shelonite." The Hebrew gentilic may refer to association with Shiloh or with the clan of Shelah/Shilon in genealogical tradition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바룩[a]의 아들, 콜호제의 아들, 하사야의 아들, 아다야의 아들, 요이야립의 아들, 스가랴의 아들, 실로 사람인 마아세야였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “셀론 사람”입니다. 히브리어 종족명은 실로와의 연관, 또는 족보 전승 속 셀라/실론 계통과의 연관을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  english_pob_choice: and Maaseiah
  chosen_korean: 그리고 … 마아세야였습니다
  alternatives_korean:
  - 마아세야였고
  - 마아세야였습니다
  lexicon: HALOT
  rationale: 접속 וּ를 앞선 족보 열거의 연속을 나타내는 ‘그리고’로 살렸고, 인명은 음역하여 본문 구조를 보존했습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 자손
  - 후손
  lexicon: HALOT
  rationale: 반복되는 족보식 בֶן은 한국어에서 가장 직접적인 친족관계 표현인 ‘아들’로 옮겨 계보의 연결을 분명히 했습니다.
- source_word: כָּל חֹזֶה
  english_pob_choice: Col-hozeh
  chosen_korean: 콜호제
  alternatives_korean:
  - 콜호제
  - 콜호제(‘모두 보는 자’)
  lexicon: HALOT
  rationale: 영어 POB가 고유명사로 처리한 점을 따라 직역하지 않고 음역했습니다. 한국어에서는 하이픈 없이 붙여 쓰는 편이 자연스럽습니다.
- source_word: הַ/שִּׁלֹנִי
  english_pob_choice: the Shilonite
  chosen_korean: 실로 사람인
  alternatives_korean:
  - 실로 사람
  - 실로 사람인 자
  - 실로 사람(실로 출신)
  lexicon: HALOT
  rationale: 지명/씨족 연계가 가능한 gentilic을 ‘실로 사람’으로 풀어, 단순한 지명 표기보다 출신·소속을 드러내면서도 과도한 해석은 피했습니다.
