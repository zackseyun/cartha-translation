  yaml_path: translation/ot/nehemiah/011/008.yaml
  text: 'And after him were Gabbai and Sallai: nine hundred twenty-eight[a].'
  footnotes:
  - marker: a
    text: Or, less likely in context, 'next to him,' if the phrase is taken spatially rather than sequentially.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뒤에는 갓배와 살래가 있었는데, 모두 합해 아홉백스물여덟 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 문맥상 가능성은 낮지만, 이 표현을 시간적 순서가 아니라 공간적 위치로 이해하면 ‘그의 곁에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  english_pob_choice: And after him
  chosen_korean: 그의 뒤에는
  alternatives_korean:
  - 그 뒤를 이어
  - 그 뒤에
  - 그 다음에는
  lexicon: HALOT
  rationale: 이 표현은 순서를 나타내는 기본 의미를 살리되, 한국어에서는 ‘그의 뒤에는’이 자연스럽고 간결하게 읽힙니다. POB의 ‘after him’과 같은 순차성을 유지하면서도 공간적 뉘앙스를 과도하게 좁히지 않습니다.
- source_word: גַּבַּי
  english_pob_choice: Gabbai
  chosen_korean: 갓배
  alternatives_korean:
  - 가바이
  - 갭배
  - 가바이
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 음역하는 원칙에 따라 현대 한국어 표기법에 맞게 옮겼습니다. 영어형 Gabbai를 그대로 따르기보다 한국어 독음에 맞춘 표기를 택했습니다.
- source_word: סַלָּי
  english_pob_choice: Sallai
  chosen_korean: 살래
  alternatives_korean:
  - 살라이
  - 살레이
  lexicon: 고유명사 음역
  rationale: 두 번째 고유명사도 같은 원칙으로 음역했습니다. 한국어 독자에게 발음 가능성을 높이면서도 원어 이름의 형태를 유지합니다.
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  english_pob_choice: nine hundred twenty-eight
  chosen_korean: 아홉백스물여덟
  alternatives_korean:
  - '928'
  - 아홉백 스물여덟
  - 아홉백 이십팔
  lexicon: HALOT
  rationale: 히브리어 수사는 900+20+8의 단순 합계이므로 한국어에서도 자연스럽게 풀어 썼습니다. ‘스물여덟’은 현대 표준 표기에서 ‘이십팔’보다 읽기 쉽고, 합쇼체 본문 흐름에도 잘 맞습니다.
