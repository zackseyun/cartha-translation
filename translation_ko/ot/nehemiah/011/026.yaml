  text: and in Jeshua[a], and in Moladah, and in Beth-pelet;
  footnotes:
  - marker: a
    text: Beth-pelet is literally 'house of Pelet' or possibly 'house of escape,' but as a place name it is transliterated rather than translated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예수아와 몰라다와 벧-발렛에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벧-발렛’은 문자적으로는 ‘팔렛의 집’ 또는 ‘도피의 집’일 수 있지만, 지명으로서는 음역하는 것이 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ
  english_pob_choice: and in
  chosen_korean: 그리고 …에
  alternatives_korean:
  - 또 …에
  - 그리고 … 안에
  lexicon: HALOT
  rationale: 연결사 ו와 전치사 ב의 반복을 한국어에서는 자연스럽게 ‘그리고 …에’로 옮기면, 정착지 목록의 병렬성과 위치 관계를 함께 살릴 수 있습니다.
- source_word: יֵשׁוּעַ
  english_pob_choice: Jeshua
  chosen_korean: 예수아
  alternatives_korean:
  - 여수아
  - 예슈아
  lexicon: HALOT
  rationale: 고유 지명은 음역하는 것이 적절하며, 한국어 성경에서 통용되는 형태에 맞춰 ‘예수아’로 옮겼습니다.
- source_word: מוֹלָדָה
  english_pob_choice: Moladah
  chosen_korean: 몰라다
  alternatives_korean:
  - 몰라닷
  - 몰라다흐
  lexicon: HALOT
  rationale: 고유 지명으로서 음역을 유지했고, 표준 표기에 가까운 ‘몰라다’를 선택했습니다.
- source_word: בֵית פָּלֶט
  english_pob_choice: Beth-pelet
  chosen_korean: 벧-발렛
  alternatives_korean:
  - 벧발렛
  - 벧-페렛
  - 구출의 집
  lexicon: HALOT
  rationale: 이 표현은 지명으로 쓰이므로 직역하지 않고 음역했습니다. 영어 POB의 하이픈을 반영해 한국어에서도 복합 지명임이 드러나도록 표기했습니다.
