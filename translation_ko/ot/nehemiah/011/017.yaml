  to: 그리고 미가의 아들이며 삽디의 아들이며 아삽의 아들인 맛다냐는 기도할 때 감사를 드리는 일을 처음으로 맡은 우두머리였습니다.[a] 박북기야는 그의 형제들 가운데 둘째였고, 압다는 삼무아의 아들이며 갈랄의 아들이며 여두둔의 아들이었습니다.
  rationale: 수정문은 רֹאשׁ를 ‘우두머리’로 옮겨 직무상의 지도자 의미를 보존하고, הַתְּחִלָּה와 יְהוֹדֶה의 결합은 ‘감사를 드리는 일을 처음으로 맡은’으로 자연스럽게 표현했습니다. 이 표현은 맛다냐가 감사 행위를 시작하거나 그 시작을 주도했다는 가능한 의미를 유지하면서도, 세부 의례를 단정하지 않습니다. 각주 표지는 해당 구절 바로 뒤에 배치했습니다.
