source:
  edition: WLC
  text: וּ/מַתַּנְיָ֣ה בֶן מִ֠יכָה בֶּן זַבְדִּ֨י בֶן אָסָ֜ף רֹ֗אשׁ הַ/תְּחִלָּה֙ יְהוֹדֶ֣ה לַ/תְּפִלָּ֔ה וּ/בַקְבֻּקְיָ֖ה מִשְׁנֶ֣ה מֵ/אֶחָ֑י/ו וְ/עַבְדָּא֙ בֶּן שַׁמּ֔וּעַ בֶּן גָּלָ֖ל בֶּן ידיתון־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
  footnotes:
  - marker: a
    text: Or 'gave thanks in prayer'; the Hebrew may be rendered more literally, 'head of the beginning, giving thanks in prayer,' indicating that Mattaniah led or initiated the thanksgiving.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 미가의 아들이며 삽디의 아들이며 아삽의 아들인 맛다냐는 기도할 때 감사를 드리는 일을 처음으로 맡은 우두머리였습니다.[a] 박북기야는 그의 형제들 가운데 둘째였고, 압다는 삼무아의 아들이며 갈랄의 아들이며 여두둔의 아들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기도할 때 감사를 드리는 일의 시작을 맡은 우두머리’로 옮길 수 있습니다. 히브리어는 더 문자적으로 ‘시작의 우두머리, 기도할 때 감사를 드리는 자’라고 하며, 맛다냐가 감사의 행위를 시작하거나 주도하는 역할을 맡았음을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַתְּחִלָּה
  english_pob_choice: was the head, who began
  chosen_korean: 첫째로서
  alternatives_korean:
  - 우두머리로서
  - 머리로서
  - 처음을 맡은 자로서
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘머리’보다 이 문맥의 서열과 주도성을 함께 드러내는 ‘첫째로서’가 자연스럽고, 이어지는 ‘감사하는 일을 시작했고’와도 잘 맞습니다.
- source_word: יְהוֹדֶה לַתְּפִלָּה
  english_pob_choice: the thanksgiving in prayer
  chosen_korean: 기도 안에서 감사하는 일을 시작했고
  alternatives_korean:
  - 기도 가운데 감사했습니다
  - 기도할 때 감사를 드렸습니다
  - 기도 안에서 감사의 시작을 맡았습니다
  lexicon: HALOT
  rationale: יְהוֹדֶה의 감사/찬양 의미를 살리되, 문맥상 ‘시작하다’의 기능을 분명히 하기 위해 동사구로 풀어 옮겼습니다. ‘안에서’는 לַתְּפִלָּה의 상황적 용법을 반영합니다.
- source_word: מִשְׁנֶה מֵאֶחָיו
  english_pob_choice: was second among his brothers
  chosen_korean: 그의 형제들 가운데 둘째
  alternatives_korean:
  - 형제들 가운데 두 번째
  - 형제들 가운데 부관
  - 형제들 가운데 차석
  lexicon: HALOT
  rationale: מִשְׁנֶה의 서열 의미를 간결하게 살리면서, ‘among his brothers’는 직역보다 자연스러운 ‘그의 형제들 가운데’로 옮겼습니다.
- source_word: יְדִיתוּן
  english_pob_choice: Jeduthun
  chosen_korean: 여두둔
  alternatives_korean:
  - 예두둔
  - 여두둔
  lexicon: 표준 외래어 표기법
  rationale: 한국어 성경에서 널리 통용되는 인명 형태를 따라 ‘여두둔’으로 음역했습니다.
theological_decisions:
- issue: יְהוֹדֶה의 의미를 ‘고백’이 아니라 ‘감사’로 볼 것인가
  chosen_reading: 여기서는 성전 예배 명단의 문맥과 POB의 감사/찬양 해석을 따라 ‘감사하는 일’을 선택했습니다.
  alternative_readings:
  - 고백하는 일
  - 찬양하는 일
  rationale: 아삽 계열의 예배 직무 목록이라는 점에서 ידה는 죄 고백보다 감사/찬양의 기능이 더 적절합니다. 이는 교리적 쟁점이 아니라 문맥에 따른 어휘 결정입니다.
  doctrine_reference: 성전 예배와 레위 직무 문맥
