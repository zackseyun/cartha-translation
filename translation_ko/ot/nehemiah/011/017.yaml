    rationale: רֹאשׁ는 단순한 순번상 ‘첫째’보다 직무상의 우두머리 또는 책임자를 가리킵니다. הַתְּחִלָּה 및 뒤따르는 분사와 함께, 감사 행위를 시작하거나 주도하는 책임이라는 의미를 보존해야 합니다.
