revisions:
- from: 이들은 예루살렘에 살던 그 지방의 우두머리들입니다. 그러나 유다의 도시들에서는 각 사람이 자기 소유지에서 자기 도시들에 살았습니다. 곧 이스라엘, 제사장들, 레위 사람들, 성전 종들, 그리고 솔로몬의 종들의 자손입니다.[a][b]
  to: 이들은 예루살렘에 살던 그 지방의 지도자들입니다. 그러나 유다의 성읍들에서는 이스라엘[a], 제사장들, 레위 사람들, 성전 봉사자들[b], 그리고 솔로몬의 종들의 자손이 각자 자기들의 성읍에 있는 소유지에서 살았습니다.
  rationale: 수정문은 ‘유다의 성읍들’과 ‘그들의 성읍들’을 모두 보존하면서, 각 주민이 해당 성읍에 있는 자기 소유지에서 살았다는 뜻을 자연스러운 현대 합쇼체로 표현했습니다. 열거 집단을 거주 동사의 주어로 연결하여 문법적 관계를 명확히 했고, 두 각주는 각각 ‘이스라엘’과 ‘성전 봉사자들’에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:48Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 두 거주 집단(예루살렘의 지방 지도자들과 유다 성읍들의 주민들), 분배적 표현 אִישׁ, 소유지 אֲחֻזָּה, 그리고 주민 집단의 열거를 대체로 충실히 반영했습니다. 다만 초안의 ‘자기 소유지에서 자기 도시들에’는 전치사 관계와 소유·지시 관계가 부자연스럽게 겹쳐 원문의 ‘자기 소유지에서, 그들의 성읍들에’를 한국어로 명료하게 전달하지 못합니다.
  naturalness: ‘우두머리들’은 가능하나 행정·공동체 문맥에서는 ‘지도자들’이 현대 표준어에서 더 자연스럽습니다. 또한 열거 목록은 ‘곧 …입니다’로 독립시키기보다 유다 성읍에 거주한 주어로 연결해야 한국어 문장 구조가 자연스럽고 지시 대상도 분명해집니다.
  terminology: ‘이스라엘’은 히브리어의 집합 명칭을 보존하고 각주로 대안을 제시합니다. הַנְּתִינִים는 현대 한국어에서 ‘성전 봉사자들’로 옮기는 편이 ‘성전 종들’보다 자연스럽고, 성전 봉사에 배정된 집단이라는 각주 설명과도 잘 맞습니다. ‘제사장들’, ‘레위 사람들’, ‘솔로몬의 종들의 자손’은 적절합니다.
  issues:
  - severity: medium
    issue: ‘각 사람이 자기 소유지에서 자기 도시들에 살았습니다’라는 표현
