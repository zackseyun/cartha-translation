  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'Now these are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew simply reads 'Israel,' likely as a collective designation in the list.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Nethinim,' a class assigned to temple service.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 예루살렘에 살던 그 지방의 지도자들입니다. 그러나 유다의 성읍들에서는 이스라엘[a], 제사장들, 레위 사람들, 성전 봉사자들[b], 그리고 솔로몬의 종들의 자손이 각자 자기들의 성읍에 있는 소유지에서 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들’. 히브리어는 단지 ‘이스라엘’이라고만 되어 있어, 목록 안에서 집합명으로 쓰였을 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘느디님’은 성전 봉사에 배정된 한 계층을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  english_pob_choice: the heads of the province
  chosen_korean: 그 지방의 우두머리들
  alternatives_korean:
  - 그 지방의 지도자들
  - 그 지방의 수장들
  lexicon: HALOT
  rationale: ראשֵׁי는 직역하면 ‘머리들’이지만, 행정 구역의 대표자들을 가리키는 관용이므로 ‘우두머리들’이 형식과 의미를 함께 살립니다.
- source_word: יָשְׁבוּ / אִישׁ בַּאֲחֻזָּתוֹ
  english_pob_choice: each man lived in his own possession
  chosen_korean: 각 사람이 자기 소유지에서
  alternatives_korean:
  - 각 사람이 자기 유산에서
  - 각 사람이 자기 점유지에서
  lexicon: HALOT
  rationale: אֲחֻזָּה는 상속된 토지 소유를 가리키므로 ‘소유지’가 가장 직접적입니다. ‘자기’는 소유 관계를 분명히 하고, 한국어에서 자연스러운 위치 표현으로 처리했습니다.
- source_word: הַנְּתִינִים
  english_pob_choice: the temple servants
  chosen_korean: 성전 종들
  alternatives_korean:
  - 성전 봉사자들
  - 느디님
  lexicon: HALOT
  rationale: 직무 기능을 드러내는 번역이 현대 독자에게 더 분명하므로, 제도적 칭호를 음역하지 않고 ‘성전 종들’로 옮겼습니다.
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  english_pob_choice: the descendants of Solomon’s servants
  chosen_korean: 솔로몬의 종들의 자손
  alternatives_korean:
  - 솔로몬의 종들의 후손
  - 솔로몬의 종들의 아들들
  lexicon: HALOT
  rationale: בְּנֵי는 족보/공동체 목록에서 넓게 ‘자손’으로 이해되는 경우가 많아, 혈통 집단을 드러내는 표준적 한국어를 사용했습니다.
theological_decisions:
- issue: 유다의 도시들에 거주한 집단 목록의 집합적 표기
  chosen_reading: ‘이스라엘’을 그대로 두어 목록의 제목처럼 보이는 집합명으로 처리했습니다.
  alternative_readings:
  - ‘이스라엘 사람들’로 풀어 쓰기
  - ‘이스라엘 백성’으로 의역하기
  rationale: 히브리어는 단순히 Israel이라고만 적어 집합적 표지로 기능할 가능성이 크므로, 본문의 압축성과 열거 형식을 살리기 위해 확장하지 않았습니다.
  doctrine_reference: 본문 형식과 집합 명칭 보존
