  text: 또 므세사벨의 아들 브다히야는 유다의 아들 세라의 자손 가운데 한 사람으로서, 왕의 곁[a]에서 백성에 관한 모든 일[b]을 맡았습니다.
  philosophy: optimal-equivalence
  footnotes:
