    text: 또는 ‘왕의 대리자’ 또는 ‘왕을 섬기는 관리’. 히브리어는 문자적으로 ‘왕의 손에 있었다’고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘백성을 위하여’. 히브리어는 백성에 관한 일이나 백성을 대신하여 처리한 일을 의미할 수 있습니다.
    reason: alternative_reading
