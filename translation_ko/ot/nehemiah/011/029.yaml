  rationale: 원문은 각 지명 앞에 וּ/בְ가 반복되어 연속적인 거주/분포를 표시하므로, 이를 드러내는 쪽이 원문의 목록감을 더 잘 보존합니다.
  doctrine_reference: 본문의 지리 목록과 서술 리듬 보존 원칙
