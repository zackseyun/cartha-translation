- source_word: וּ/בְ/עֵין רִמּוֹן
  english_pob_choice: and in En-rimmon
  chosen_korean: 엔-림몬에
  alternatives_korean:
  - 아인-림몬에
  - 엔 림몬에
  lexicon: HALOT
  rationale: 지명은 음역으로 옮기되, 영어 POB의 En-rimmon 선택을 반영해 합성 지명 형태를 유지했습니다.
- source_word: וּ/בְ/צָרְעָה
  english_pob_choice: and in Zorah
  chosen_korean: 소라에
  alternatives_korean:
  - 자레아에
  - 조라에
  lexicon: HALOT
  rationale: צָרְעָה는 고유 지명으로서 관용적인 한국어 음역인 ‘소라’를 사용했습니다.
- source_word: וּ/בְ/יַרְמוּת
  english_pob_choice: and in Jarmuth
  chosen_korean: 야르뭇에
  alternatives_korean:
  - 얄무트에
  - 야름웃에
  lexicon: HALOT
  rationale: יַרְמוּת는 지명으로 처리하고, 영어 POB의 Jarmuth에 맞춰 현대 한국어 음역으로 옮겼습니다.
theological_decisions:
- issue: 히브리어 목록의 반복 접속 구조
  chosen_reading: ‘그리고 …에, …에, …에 있었습니다’로 세 정착지를 순차적으로 나열했습니다.
  alternative_readings:
  - 반복 접속을 생략한 단순 열거
