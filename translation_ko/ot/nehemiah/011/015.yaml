translation:
  language: ko
  text: 그리고 레위 사람들 가운데서는 스마야가 있었습니다. 그는 핫숩의 아들이며[a] 아스리감의 아들이며 하사뱌의 아들이며 분니의 아들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בן(‘아들’)은 족보 목록에서 직계 아버지와 아들의 관계가 아니라 더 먼 후손을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  english_pob_choice: And from
  chosen_korean: 그리고 ... 가운데서는
  alternatives_korean:
  - 그리고 ...에서
  - 또 레위 사람들 중에서
  lexicon: HALOT
  rationale: 앞 절과의 연결을 살리면서, 명단 서두의 חלק적 도입을 한국어에서 자연스럽게 표현했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
