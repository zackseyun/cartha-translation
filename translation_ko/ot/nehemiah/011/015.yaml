  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
  footnotes:
  - marker: a
    text: Hebrew בן ('son of') in genealogical lists can sometimes denote a more distant descendant, not necessarily an immediate father-son relationship.
