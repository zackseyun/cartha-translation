  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה בֶּן בּוּנִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
  footnotes:
  - marker: a
    text: Hebrew בן ('son of') in genealogical lists can sometimes denote a more distant descendant, not necessarily an immediate father-son relationship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 레위 사람들 가운데서는 스마야 — 하숩의 아들, 아즈리감의 아들, 하사뱌의 아들, 분니의 아들 — 이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בן(‘아들’)은 족보 목록에서 직계 아버지-아들 관계가 아니라 더 먼 후손을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  english_pob_choice: And from
  chosen_korean: 그리고 ... 가운데서는
  alternatives_korean:
  - 그리고 ...에서
  - 또 레위 사람들 중에서
  lexicon: HALOT
  rationale: 앞 절과의 연결을 살리면서, 명단 서두의 חלק적 도입을 한국어에서 자연스럽게 표현했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 명단 맥락에서 레위 지파 소속 집단을 가리키므로, 한국어에서는 간결하게 ‘레위 사람들’로 옮겼습니다.
- source_word: שְׁמַעְיָה
  english_pob_choice: Shemaiah
  chosen_korean: 스마야
  alternatives_korean:
  - 세마야
  - 쉐마야
  lexicon: BDB
  rationale: 고유명사는 현대 한국어 음역 관행에 따라 표기했습니다.
- source_word: בֶן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 후손
  - ~의 자손
  lexicon: HALOT
  rationale: 족보 목록의 반복 구조를 그대로 살리기 위해 ‘아들’로 번역했습니다.
