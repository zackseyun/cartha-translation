base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/031.yaml
  text: And the sons of Benjamin were from Geba[a], Michmash, Aijah, and Bethel and its villages.
  footnotes:
  - marker: a
    text: Or 'Ai' for 'Aijah'; the Hebrew form here is עַיָּה, which may reflect the same site or a closely related place-name in translation tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 베냐민 자손은 게바에서부터 믹마스와 아야[a]와 벧엘 및 그 부속 마을들에 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아야’는 히브리어 עַיָּה의 음역입니다. 이 지명은 ‘아이’로 이해될 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  english_pob_choice: And the sons of Benjamin
  chosen_korean: 베냐민 자손
  alternatives_korean:
  - 베냐민의 아들들
  - 베냐민 사람들
  lexicon: HALOT
  rationale: 직역인 ‘아들들’보다 이 문맥에서는 지파 구성원을 가리키는 관용적 표현으로 읽혀 ‘자손’이 의미를 더 자연스럽게 전달합니다.
- source_word: מִגָּבַע
  english_pob_choice: were from Geba
  chosen_korean: 게바
  alternatives_korean:
  - 게바에서
  - 게바로부터
  lexicon: HALOT
  rationale: 히브리어의 מִן은 이 정착 목록에서 출발점/소속 범위를 나타내므로 한국어에서는 동사를 보충해 ‘~에 있었습니다’로 자연스럽게 옮기고, 지명은 그대로 유지했습니다.
- source_word: וְעַיָּה
  english_pob_choice: Aijah
  chosen_korean: 아야
  alternatives_korean:
  - 아이
  - 아야(=아이)
  lexicon: HALOT
  rationale: 어형 עַיָּה를 한국어 음역으로 반영했습니다. 본문이 가리키는 지명이 ‘아이’와 연결될 수 있다는 점은 본문 외 주석 없이 본문에는 과도하게 풀지 않았습니다.
- source_word: וּבְנֹתֶיהָ
  english_pob_choice: and its villages
  chosen_korean: 그 마을들
  alternatives_korean:
  - 그 딸들
  - 부속 마을들
  lexicon: HALOT
  rationale: 직역하면 ‘그 딸들’이지만, 히브리어 관용구상 중심 도시의 딸 마을들을 뜻하므로 현대 한국어에서는 ‘그 마을들’이 가장 분명합니다.
