id: NEH.11.13
reference: Nehemiah 11:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶחָי/ו֙ רָאשִׁ֣ים לְ/אָב֔וֹת מָאתַ֖יִם אַרְבָּעִ֣ים וּ/שְׁנָ֑יִם וַ/עֲמַשְׁסַ֧י בֶּן עֲזַרְאֵ֛ל בֶּן אַחְזַ֥י בֶּן מְשִׁלֵּמ֖וֹת בֶּן אִמֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/013.yaml
  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
  footnotes:
  - marker: a
    text: Or 'heads of ancestral houses' or 'chiefs of families.' The Hebrew literally refers to clan heads within fathers’ houses.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''two hundred forty-two.'''
    reason: lexical_alternative
  - marker: c
    text: The name 'Amashsai' is sometimes rendered 'Amasai' in English.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그의 형제들[ㄱ]은 조상 가문의 우두머리들로서 242명이었고, 또 아마스새는 아사렐의 아들, 아흐새의 아들, 메실레못의 아들, 임멜의 아들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ㄱ
    text: 또는 ‘가문의 우두머리들’, ‘족장들’로 옮길 수 있습니다. 히브리어는 문자적으로 아버지들의 집 안에 속한 집단 우두머리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  english_pob_choice: and his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 친족들
  - 그의 동료들
  lexicon: HALOT
  rationale: 가문·제사장 계열의 명단에서 אָח의 복수는 혈연 형제 이상으로 같은 집단의 남성 구성원을 가리킬 수 있지만, 직역성을 살려 ‘형제들’로 옮겼습니다.
- source_word: רָאשִׁים לְאָבוֹת
  english_pob_choice: heads of fathers’ houses
  chosen_korean: 조상 가문의 우두머리들
  alternatives_korean:
  - 가문의 우두머리들
  - 족장들
  lexicon: HALOT
  rationale: 히브리어의 사회구조를 드러내기 위해 ‘아버지들의 집’의 직역을 너무 매끄럽게 풀지 않고, 문맥상 이해 가능한 ‘조상 가문’으로 옮겼습니다.
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  english_pob_choice: '242'
  chosen_korean: 242명
  alternatives_korean:
  - 이백사십이명
  lexicon: HALOT
  rationale: 인구·명단 문맥이므로 숫자 표기를 유지했고, 인원을 나타내는 한국어 관용에 따라 ‘명’을 덧붙였습니다.
- source_word: וַעֲמַשְׁסַי
  english_pob_choice: and Amashsai
  chosen_korean: 아마스새
  alternatives_korean:
  - 아마새
  - 아마사이
  lexicon: HALOT
  rationale: WLC의 자음·모음 표기를 따라 ‘Amashsai’에 가장 가까운 음역을 택했고, 영어 각주가 밝히는 이명 가능성은 본문 음역에 반영하지 않았습니다.
theological_decisions:
- issue: 계보·명단의 반복 구조를 한국어에서 어떻게 처리할지
  chosen_reading: 반복되는 בן 구문을 모두 ‘~의 아들’로 직역해 계보 관계의 누적을 드러냈습니다.
  alternative_readings:
  - ‘~의 후손’으로 완화
  - 마지막만 이름 연결로 축약
  rationale: 이 절은 행정적·계보적 기록이므로 원문 구조를 보존하는 것이 의미 전달에 가장 충실합니다.
  doctrine_reference: 성경의 역사·계보 기록은 실제 공동체 기억을 전달하는 문학 형식이라는 전제
