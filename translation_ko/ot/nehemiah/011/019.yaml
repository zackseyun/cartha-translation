  yaml_path: translation/ot/nehemiah/011/019.yaml
  text: 'And the gatekeepers: Akkub[a], Talmon, and their brothers who kept watch at the gates, were one hundred seventy-two.'
  footnotes:
  - marker: a
    text: Or 'their kinsmen'; Hebrew 'their brothers' can denote close male relatives or fellow members of the same group.
    reason: lexical_alternative
translation:
  language: ko
  text: '문지기들과: 악굽과 탈몬과, 성문에서 경계를 서는 그들의 형제들이 모두 백일흔둘이었습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 경우에 따라 가까운 남성 친족이나 같은 집단의 동료를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  english_pob_choice: the gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 성문지기들
  - 문지기들
  lexicon: HALOT
  rationale: 성문을 지키는 직무를 자연스럽게 드러내며, 본문의 행정·성전 문맥에 맞는 간결한 대응어입니다.
- source_word: וַאֲחֵיהֶם
  english_pob_choice: and their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 친족들
  - 그들과 같은 무리의 사람들
  lexicon: HALOT
  rationale: 히브리어 אָח의 기본 의미를 살리되, 여기서는 남성 집단을 가리키는 직역을 유지하여 원문의 결을 보존했습니다.
- source_word: הַשֹּׁמְרִים בַּשְּׁעָרִים
  english_pob_choice: who kept watch at the gates
  chosen_korean: 성문에서 경계를 서는
  alternatives_korean:
  - 성문을 지키는
  - 성문에서 지키는
  lexicon: HALOT
  rationale: ‘지키다’보다 ‘경계를 서다’가 파수·경계의 계속적 직무를 더 분명하게 드러내며, 성문 배치의 상황도 자연스럽게 나타냅니다.
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  english_pob_choice: one hundred seventy-two
  chosen_korean: 백일흔둘
  alternatives_korean:
