  source_fidelity: 계수와 계보 구조는 대체로 충실하나, יְרֹחָם은 ‘여호람’(Jehoram)이 아니라 ‘여로함’(Jeroham)으로 구별해야 합니다. 또한 פְּלַלְיָה는 통상 ‘블랄랴’로 옮기는 것이 적절합니다.
  naturalness: ‘집을 위해 일하는 이들’도 이해되지만, 히브리어의 ‘그 집을 위한 일’을 한국어로 자연스럽게 드러내려면 ‘그 집의 일을 하는 이들’이 더 좋습니다. 각 독립 절을 현대 합쇼체로 완결했습니다.
  terminology: ‘형제들’, ‘아들’, 그리고 문맥상 성전을 가리키는 ‘그 집’을 유지했습니다. ‘그 집’의 성전적 지시는 각주에서 설명하되 본문에는 해석어 ‘성전’을 넣지 않았습니다. 이름은 한국어 성경에서 통용되는 음역과 원어의 인명 구별에 맞추어 ‘여로함, 블랄랴, 암시, 스가랴, 바스훌, 말기야’로 정리했습니다.
