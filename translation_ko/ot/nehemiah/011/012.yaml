id: NEH.11.12
reference: Nehemiah 11:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֗ם עֹשֵׂ֤י הַ/מְּלָאכָה֙ לַ/בַּ֔יִת שְׁמֹנֶ֥ה מֵא֖וֹת עֶשְׂרִ֣ים וּ/שְׁנָ֑יִם וַ֠/עֲדָיָה בֶּן יְרֹחָ֤ם בֶּן פְּלַלְיָה֙ בֶּן אַמְצִ֣י בֶן זְכַרְיָ֔ה בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
  footnotes:
  - marker: a
    text: Or 'workers for the temple.' The Hebrew reads literally 'doers of the work for the house,' with 'the house' referring contextually to the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 형제들, 곧 그 집[a]의 일을 하는 이들은 팔백이십이 명이었습니다. 또 아다야는 여로함의 아들이며, 블랄랴의 아들이며, 암시의 아들이며, 스가랴의 아들이며, 바스훌의 아들이며, 말기야의 아들이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전을 위한 일’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘그 집을 위한 일’이라고 하며, 여기서 ‘그 집’은 문맥상 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  english_pob_choice: And their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 친족들
  - 그들의 동료 제사장들
  lexicon: HALOT
  rationale: 원문이 실제로 ‘형제들’이라고 말하므로, 문맥상 같은 제사장 집단을 가리키더라도 친족 의미를 보존하는 쪽이 출발어를 가장 직접적으로 드러냅니다.
- source_word: עֹשֵׂי הַמְּלָאכָה
  english_pob_choice: doers of the work
  chosen_korean: 집을 위해 일하는 이들
  alternatives_korean:
  - 일하는 사람들
  - 그 일을 한 사람들
  lexicon: HALOT
  rationale: 히브리어의 분사구문을 자연스럽게 풀되, 영어 POB가 유지한 ‘일의 수행자들’이라는 뜻을 살려 ‘일하는 이들’로 옮겼습니다.
- source_word: לַבַּיִת
  english_pob_choice: for the house
  chosen_korean: 집을 위해
  alternatives_korean:
  - 성전을 위해
  - 집을 위해서
  lexicon: HALOT
  rationale: בַּיִת의 기본 뜻인 ‘집’을 그대로 살렸고, 문맥상 성전임은 독자가 알 수 있도록 과도한 해석어를 본문에 넣지 않았습니다.
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  english_pob_choice: eight hundred twenty-two
  chosen_korean: 팔백스물두 명
  alternatives_korean:
  - 팔백스물둘
  - 팔백스물둘 명
  lexicon: HALOT
  rationale: 히브리어 수사를 현대 한국어 관용에 맞게 붙여 쓰되, 인원수를 분명히 하기 위해 ‘명’을 보완했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 후손
  - 자녀
  lexicon: HALOT
  rationale: 계보식 반복 구조를 유지하기 위해 ‘~의 아들’로 직역했습니다. 한국어에서는 반복을 줄이기보다 계보의 형태를 드러내는 편이 원문에 가깝습니다.
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  english_pob_choice: Jeroham / Pelaliah / Amzi / Zechariah / Pashhur / Malchijah
  chosen_korean: 여호람 / 브랄랴 / 암지 / 스가랴 / 바스훌 / 말기야
  alternatives_korean:
  - 예로함 / 펠랄리아 / 암지 / 제카랴 / 파스훌 / 말키야
  lexicon: HALOT
  rationale: 고유명사는 한국어 성경에서 널리 알려진 형태를 우선하고, 덜 정착된 이름은 음역으로 처리했습니다.
theological_decisions:
- issue: 대상 집단의 성격(형제들 vs 동료 제사장들)
  chosen_reading: 본문에는 친족 용어인 ‘형제들’을 유지하고, 제의적 소속은 문맥이 암시하도록 두었습니다.
  alternative_readings:
  - 동료 제사장들
  - 성전 일꾼들
  rationale: 이 절 자체는 집단의 정확한 직무를 해석어로 풀기보다, 원문이 선택한 친족 표현을 보존하는 것이 더 투명합니다.
  doctrine_reference: 본문 내 범위에 대한 서술 원칙
