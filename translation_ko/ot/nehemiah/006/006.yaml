reference: Nehemiah 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּת֣וּב בָּ֗/הּ בַּ/גּוֹיִ֤ם נִשְׁמָע֙ וְ/גַשְׁמ֣וּ אֹמֵ֔ר אַתָּ֤ה וְ/הַ/יְּהוּדִים֙ חֹשְׁבִ֣ים לִ/מְר֔וֹד עַל כֵּ֛ן אַתָּ֥ה בוֹנֶ֖ה הַ/חוֹמָ֑ה וְ/אַתָּ֗ה הֹוֶ֤ה לָ/הֶם֙ לְ/מֶ֔לֶךְ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
  footnotes:
  - marker: a
    text: Hebrew 'Gashmu'; many English versions render the name as 'Geshem.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 안에 이렇게 기록되어 있었습니다. 「민족들 사이에 소문이 퍼지고 있으며 — 게셈도 그렇게 말합니다 — 당신과 유다 사람들이 반역하려고 한다고 합니다. 그러므로 당신이 성벽을 다시 쌓고 있으며, 이 말들에 따르면 당신이 그들의 왕이 되려는 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 ‘Gashmu’이지만, 영어 번역들에서는 흔히 ‘Geshem’으로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  english_pob_choice: It was written in it
  chosen_korean: 그 안에 이렇게 기록되어 있었습니다
  alternatives_korean:
  - 그 안에 이렇게 쓰여 있었습니다
  - 거기에 이렇게 기록되어 있었습니다
  lexicon: HALOT
  rationale: 편지의 내용이 인용되는 서두이므로 과거 시제의 수동적 문맥을 살려 자연스럽게 옮겼습니다.
- source_word: בַּגּוֹיִם נִשְׁמָע
  english_pob_choice: It is being reported among the nations
  chosen_korean: 민족들 사이에 소문이 퍼지고 있으며
  alternatives_korean:
  - 민족들 사이에서 들리고 있으며
  - 민족들 가운데 보고되고 있으며
  lexicon: HALOT
  rationale: נשמע의 수동적 ‘들려짐/퍼짐’ 의미를 살려 ‘소문이 퍼지고 있다’로 옮겼습니다. 여기서는 גוים를 ‘민족들’로 두어 정치적·민족적 범위를 유지했습니다.
- source_word: וְגַשְׁמוּ אֹמֵר
  english_pob_choice: and Geshem also says it
  chosen_korean: 게셈도 그렇게 말합니다
  alternatives_korean:
  - 그리고 게셈도 말합니다
  - 게셈 역시 그렇게 말합니다
  lexicon: HALOT
  rationale: 접속사 וְ의 덧붙임을 ‘도’로 반영하고, 이름은 한국어에서 널리 쓰이는 ‘게셈’을 택했습니다.
- source_word: חֹשְׁבִים לִמְרוֹד
  english_pob_choice: are planning to rebel
  chosen_korean: 반역하려고 한다고 합니다
  alternatives_korean:
  - 반역할 계획이라고 합니다
  - 반란을 꾀한다고 합니다
  lexicon: HALOT
  rationale: חשב + مصدر의 의도/계획을 ‘~하려고 한다’로 옮겨, 고발성 소문이라는 문맥을 살렸습니다.
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  english_pob_choice: you are to become their king
  chosen_korean: 당신이 그들의 왕이 되려는 것입니다
  alternatives_korean:
  - 당신이 그들의 왕이 될 것입니다
  - 당신이 그들의 왕이 되는 것입니다
  lexicon: HALOT
  rationale: הוה + ל는 ‘~이 되다’의 결과/의도 뉘앙스가 있어, 적대적 추정을 드러내는 ‘되려는 것입니다’로 처리했습니다.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: according to these reports
  chosen_korean: 이 말들에 따르면
  alternatives_korean:
  - 이 보고들에 따르면
  - 이런 말들에 의하면
  lexicon: HALOT
  rationale: 직역하면 ‘이 말들에 따라’이지만, 문맥상 편지 속 유포된 혐의의 내용을 가리키므로 한국어에서는 ‘이 말들에 따르면’이 가장 자연스럽습니다.
theological_decisions:
- issue: 본문의 ‘민족들’과 ‘소문’ 표현을 역사 서신의 정치적 음모 주장으로 보존할지 여부
  chosen_reading: 중립적 사실 서술이 아니라 적대적인 유언비어의 전달로 읽히도록 ‘소문이 퍼지고 있으며’로 유지했습니다.
  alternative_readings:
  - ‘보고되고 있으며’로 더 중립적으로 옮길 수 있습니다.
  - ‘들리고 있습니다’로 더 문자적으로 옮길 수 있습니다.
  rationale: 네헤미야를 향한 비방성 서신의 성격이 핵심이므로, 소문의 유포성을 드러내되 과장된 음모론어는 피했습니다.
  doctrine_reference: 본문 장르와 서사 맥락에 근거한 문맥 신학
