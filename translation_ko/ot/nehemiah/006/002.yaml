id: NEH.6.2
reference: Nehemiah 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח סַנְבַלַּ֤ט וְ/גֶ֨שֶׁם֙ אֵלַ֣/י לֵ/אמֹ֔ר לְכָ֞/ה וְ/נִֽוָּעֲדָ֥ה יַחְדָּ֛ו בַּ/כְּפִירִ֖ים בְּ/בִקְעַ֣ת אוֹנ֑וֹ וְ/הֵ֨מָּה֙ חֹֽשְׁבִ֔ים לַ/עֲשׂ֥וֹת לִ֖/י רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
  footnotes:
  - marker: a
    text: Or possibly “in Chephirim,” taking the Hebrew as a place-name rather than “in the villages.”
    reason: alternative_reading
  - marker: b
    text: “Plain” may also be rendered “valley.”
    reason: lexical_alternative
translation:
  language: ko
  text: 산발랏과 게셈이 내게 사람을 보내어 말하였습니다. “오십시오. 그리고 오노 평원에 있는 마을들에서 함께 만나 봅시다.” 그러나 그들은 내게 해를 끼치려 하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마을들’ 대신 히브리어를 장소명 ‘게피림’으로 읽을 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘평원’은 ‘골짜기’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보내어
  - 편지를 보내어
  - 연락을 보내어
  lexicon: HALOT
  rationale: 히브리어 동사는 단순히 ‘보내다’이지만, 한국어에서는 뒤의 ‘말하다’와 자연스럽게 이어지도록 ‘사람을 보내어’로 풀어 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말하였습니다
  alternatives_korean:
  - 이르며
  - 말하여
  - 전하여
  lexicon: HALOT
  rationale: 서술 도입 공식이므로 과도한 확장 없이 직접화법을 여는 자연스러운 서술어로 옮겼습니다.
- source_word: בַּכְּפִירִים
  english_pob_choice: in the villages
  chosen_korean: 마을들에서
  alternatives_korean:
  - 마을들 가운데서
  - 촌락들에서
  - 게피림에서
  lexicon: HALOT
  rationale: 문맥상 ‘오노 평원에 있는 여러 마을’이라는 일반 명사적 용법을 따랐습니다. 장소명으로 볼 가능성은 본문 각주로 남길 수 있지만, 본문은 자연스러운 일반 명사 번역이 더 적절합니다.
- source_word: בְּבִקְעַת אוֹנוֹ
  english_pob_choice: in the plain of Ono
  chosen_korean: 오노 평원에
  alternatives_korean:
  - 오노 골짜기에
  - 오노의 평야에
  lexicon: HALOT
  rationale: בִּקְעָה는 넓은 계곡/평원을 뜻하므로 ‘평원’이 문맥에 가장 잘 맞습니다. '골짜기'도 가능하지만 더 넓은 지형감을 살렸습니다.
- source_word: לַעֲשׂוֹת לִי רָעָה
  english_pob_choice: to do me harm
  chosen_korean: 내게 해를 끼치려
  alternatives_korean:
  - 내게 악을 행하려
  - 나를 해치려
  - 내게 악을 도모하려
  lexicon: HALOT
  rationale: רָעָה를 추상적인 ‘악’보다 이 문맥의 직접적 위협인 ‘해를 끼치다’로 옮겨, 의도된 위해를 분명하게 드러냈습니다.
theological_decisions:
- issue: 적대자의 의도 표현
  chosen_reading: ‘그들은 내게 해를 끼치려 하고 있었습니다’로 번역하여, 겉으로는 회담 요청이지만 실제 의도가 위해였음을 분명히 드러냈습니다.
  alternative_readings:
  - ‘그들은 나를 해치려 했습니다’
  - ‘그들은 내게 악을 꾸미고 있었습니다’
  rationale: 히브리어 분사 חֹשְׁבִים은 단순한 생각이 아니라 계획·모의의 의미를 띠므로, 본문의 긴장감을 살려 의도적 위해로 번역하는 것이 적절합니다.
  doctrine_reference: 본문 서술의 윤리적·서사적 의미
- issue: 직접화법의 공손한 초청
  chosen_reading: 산발랏과 게셈의 유혹적 초청을 현대 한국어 공손 표현 ‘오십시오’로 옮겼습니다.
  alternative_readings:
  - ‘오라’
  - ‘와 보십시오’
  rationale: 히브리어 לְכָה는 초청형 관용구이므로, 한국어에서는 명령조보다 자연스러운 초대 표현이 더 잘 대응합니다.
  doctrine_reference: 서사체 직접화법의 화용론
