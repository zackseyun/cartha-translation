revisions:
- from: 산발랏과 게셈이 내게 사람을 보내어 말하였습니다. “오십시오. 그리고 오노 평원에 있는 마을들에서 함께 만나 봅시다.” 그러나 그들은 내게 해를 끼치려 하고 있었습니다.[a][b]
  to: 산발랏과 게셈이 내게 이렇게 전갈을 보냈습니다. “오십시오. 오노 평원[b]의 마을들[a]에서 함께 만납시다.” 그러나 그들은 내게 해를 끼칠 계획을 하고 있었습니다.
  rationale: 명시되지 않은 ‘사람’을 삭제하고, לֵאמֹר가 도입하는 전달 내용을 한국어에서 자연스럽게 나타내기 위해 ‘이렇게 전갈을 보냈습니다’로 고쳤습니다. 적대자들의 숨은 의도를 나타내는 분사를 ‘계획을 하고 있었습니다’로 옮겼으며, 두 각주 표지를 각각의 관련 어구에 배치했습니다.
