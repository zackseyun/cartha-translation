  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: Now when Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
  footnotes:
  - marker: a
    text: Or 'I had built the wall.' The Hebrew verb is simply 'built'; 'rebuilt' is used here because the context is the restoration of an existing wall.
    reason: lexical_alternative
  - marker: b
    text: Or 'Geshem the Arabian.'
    reason: lexical_alternative
translation:
  language: ko
  text: 산발랏과 도비야와 아랍 사람 게셈과 우리 다른 원수들이 내가 성벽을 다시 쌓아 올렸고 그 안에 허물어진 곳이 남지 않았으며 — 그때까지는 내가 성문들에 문짝을 세워 두지 않았다는 것을 듣게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׁמַע
  english_pob_choice: heard
  chosen_korean: 듣게 되었습니다
  alternatives_korean:
  - 들었습니다
  - 알게 되었습니다
  lexicon: HALOT
  rationale: 수동적 ‘들리다’의 결과를 자연스럽게 풀어, 소문이 그들에게 전해졌음을 현대 한국어로 매끄럽게 나타냈습니다.
- source_word: בָנִיתִי אֶת הַחוֹמָה
  english_pob_choice: I had rebuilt the wall
  chosen_korean: 성벽을 다시 쌓아 올렸고
  alternatives_korean:
  - 성벽을 쌓았고
  - 성벽을 재건했고
  lexicon: HALOT
  rationale: 예루살렘의 기존 성벽 복구라는 문맥을 살려 ‘다시 쌓아 올리다’로 옮겼습니다. ‘재건하다’는 가능하지만 다소 문어적이며, ‘다시’가 복원 뉘앙스를 분명히 합니다.
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  english_pob_choice: no breach was left in it
  chosen_korean: 그 안에 허물어진 곳이 남지 않았으며
  alternatives_korean:
  - 그 안에 틈이 남지 않았으며
  - 그 안에 무너진 곳이 남지 않았으며
  lexicon: HALOT
  rationale: פָּרֶץ는 성벽 문맥에서 ‘틈/허물어진 곳/무너진 곳’의 의미를 가지므로, ‘허물어진 곳’으로 옮겨 파괴·복구의 대비를 드러냈습니다.
- source_word: דְּלָתוֹת ... בַשְּׁעָרִים
  english_pob_choice: the doors in the gates
  chosen_korean: 성문들에 문짝을 세워 두지 않았다는
  alternatives_korean:
  - 성문에 문짝을 달지 않았다는
  - 성문들 안에 문짝을 설치하지 않았다는
  lexicon: HALOT
  rationale: דְּלָתוֹת은 구조물로서의 ‘문짝’이고, בַּשְּׁעָרִים은 ‘성문들’이므로 두 요소를 구분해 옮겼습니다. ‘세워 두다’는 장착·설치의 의미를 한국어로 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘원수들’의 집단 지칭을 본문 구조에 따라 어떻게 처리할지
  chosen_reading: ‘산발랏과 도비야와 아랍 사람 게셈과 우리 다른 원수들’로 옮겨, 인물명과 일반적 적대 집단을 구분했습니다.
  alternative_readings:
  - ‘산발랏과 도비야와 아랍 사람 게셈과 나머지 원수들’
  - ‘산발랏과 도비야와 아랍 사람 게셈과 남은 우리의 원수들’
  rationale: יַתֶּר אֹיְבֵינוּ는 단순히 남은 적대자들을 가리키므로, 특정 인물명 뒤에 일반 집단을 덧붙여 서술 구조를 보존했습니다.
  doctrine_reference: 본문 서술 구조/담화 분석
- issue: ‘rebuilt’의 복원 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘다시 쌓아 올렸’으로 번역해, 단순 신축이 아니라 무너진 성벽의 회복이라는 문맥을 반영했습니다.
  alternative_readings:
  - ‘쌓았습니다’
  - ‘재건했습니다’
  rationale: 히브리어 동사 자체는 단순히 ‘쌓다’이지만, 내러티브 맥락상 기존 성벽의 회복이므로 복원성을 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문 문맥/서사 의미
