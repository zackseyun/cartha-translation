  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
  footnotes:
  - marker: a
    text: Or, 'they lost much confidence in themselves' / 'they were greatly cast down in their own eyes.' The Hebrew preserves the image of falling in one's own estimation.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 모든 원수가 듣고, 우리 주변의 모든 민족이 보자, 그들은 자신들이 보기에 크게 낮아졌습니다. 그리고 이 일이 우리 하나님께서 이루신 것임을 알게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들은 자신들에 대한 확신을 크게 잃었다’ 또는 ‘그들은 자신들이 보기에 크게 꺾였다’로 옮길 수 있습니다. 히브리어는 그들이 자기 자신에 대한 평가에서 크게 ‘떨어졌다’는 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: And it happened / when
  chosen_korean: 그리고 … 했고
  alternatives_korean:
  - 그때 … 했고
  - 이렇게 되어 … 했고
  lexicon: HALOT
  rationale: 히브리어 서사 전환 공식을 과도하게 직역하지 않으면서도, 문장의 진행과 연결을 자연스럽게 살렸습니다.
- source_word: כָּל אֹיְבֵינוּ
  english_pob_choice: all our enemies
  chosen_korean: 우리 적들이 모두
  alternatives_korean:
  - 우리의 모든 적들이
  - 모든 우리 적들이
  lexicon: HALOT
  rationale: 소유격 관계를 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  english_pob_choice: they fell greatly in their own eyes
  chosen_korean: 자기 눈에 크게 떨어졌으며
  alternatives_korean:
  - 자기들 스스로 보기에 크게 낮아졌으며
  - 자기들 눈에 크게 꺾였으며
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지를 보존해 ‘보기에’와 ‘떨어졌으며’로 살렸습니다. 의미를 풀어쓴 표현보다 원문의 수사와 긴장을 드러냅니다.
- source_word: מֵאֵת אֱלֹהֵינוּ נֶעֶשְׂתָה
  english_pob_choice: had been done by our God
  chosen_korean: 우리 하나님께서 이루신 것임을
  alternatives_korean:
  - 우리 하나님께로 말미암아 된 것임을
  - 우리 하나님께서 하신 것임을
  lexicon: HALOT
  rationale: 수동형과 원인·행위 주체를 함께 반영하여, 단순한 ‘됨’보다 하나님의 행위성을 분명히 드러냈습니다.
theological_decisions:
- issue: ‘자기 눈에 크게 떨어졌다’는 관용구의 처리
  chosen_reading: 관용구를 직유적으로 보존해 그들의 자존감이 무너진 뉘앙스를 함께 드러냈습니다.
  alternative_readings:
  - ‘크게 낙심했다’로 의미만 풀어 옮김
  - ‘자기 확신을 잃었다’로 해석을 전면화함
  rationale: 본문은 단지 감정 상태가 아니라, 패배를 본 뒤 자기 평가가 무너지는 이미지를 말합니다. 그래서 원문 이미지를 유지하되 한국어로 읽히는 표현으로 조정했습니다.
  doctrine_reference: Translation philosophy §1, §3
