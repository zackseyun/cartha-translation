revisions:
- from: 그리고 우리 적들이 모두 들었고, 우리 주변의 모든 민족이 보고는 자기 눈에 크게 떨어졌으며, 이 일은 우리 하나님께서 이루신 것임을 알게 되었습니다.[a]
  to: 우리의 모든 원수가 듣고, 우리 주변의 모든 민족이 보자, 그들은 자신들이 보기에 크게 낮아졌습니다. 그리고 이 일이 우리 하나님께서 이루신 것임을 알게 되었습니다.[a]
  rationale: 수정문은 원수들과 주변 민족 모두가 결과적으로 낙심하거나 자신감을 잃었음을 ‘그들’로 명확히 했습니다. 난해한 히브리어 관용구는 현대 한국어에서 읽히는 ‘자신들이 보기에 크게 낮아졌다’로 옮기고, 각주에서 ‘떨어지다’라는 원문의 이미지를 보존했습니다. 하나님의 행위는 본문의 수동적 신적 주체성을 자연스럽게 전달하도록 유지했습니다.
  reviewer_model: gpt-5.6-terra
