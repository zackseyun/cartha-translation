    rationale: בְּעֵינֵיהֶם의 ‘그들 자신의 눈에/평가에서’라는 이미지는 유지하되, ‘그들 자신이 보기에 크게 낮아졌다’처럼 자연스러운 표현으로 조정할 필요가 있습니다.
