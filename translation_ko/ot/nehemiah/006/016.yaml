    rationale: 히브리어의 ‘그들이 크게 떨어졌다’는 앞서 언급된 원수들과 주변 민족들을 함께 받는 복수 표현입니다. 명시적 대명사로 이를 분명히 하는 것이 안전합니다.
  - severity: medium
