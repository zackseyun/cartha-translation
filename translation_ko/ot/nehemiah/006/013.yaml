  source_fidelity: 첫 절의 목적 연쇄(그가 고용됨 → 내가 두려워함 → 그렇게 행함 → 죄를 지음)는 대체로 반영되었으나, שָׂכוּר의 수동 의미인 ‘고용되었다’가 ‘돈을 받았다’로 바뀌어 행위의 초점이 다소 흐려졌습니다. 또한 마지막 יְחָרְפוּנִי(그들이 나를 모욕/비난하려고 하다)가 앞 문구에 흡수되어 독립된 최종 목적이 충분히 드러나지 않습니다.
  naturalness: ‘악한 평판거리’는 현대 표준 한국어에서 부자연스럽고 의미 관계도 불명확합니다. ‘나를 비방할 구실’이 자연스럽고 문맥에 맞습니다. 목적과 결과의 연결은 ‘그렇게 해서’로 명료하게 나타낼 수 있습니다.
  terminology: ‘고용되다’는 שָׂכוּר의 기본 의미를 보존하며, 본문 문맥이 드러내는 부정한 의도는 목적절에서 충분히 확인됩니다. ‘비방하다’는 שֵׁם רָע의 문맥적 기능에 적합하고, חרף는 별도로 ‘모욕하다’로 옮겨 공개적 수치의 뉘앙스를 보존합니다.
