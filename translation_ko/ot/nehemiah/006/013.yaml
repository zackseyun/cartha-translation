source:
  edition: WLC
  text: לְמַ֤עַן שָׂכוּר֙ ה֔וּא לְמַֽעַן אִירָ֥א וְ/אֶֽעֱשֶׂה כֵּ֖ן וְ/חָטָ֑אתִי וְ/הָיָ֤ה לָ/הֶם֙ לְ/שֵׁ֣ם רָ֔ע לְמַ֖עַן יְחָֽרְפֽוּ/נִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
  footnotes:
  - marker: a
    text: Or 'He was paid for this' or 'He was bribed for this.' The Hebrew participle שָׂכוּר most directly means 'hired' or 'paid'; 'bribed' makes the corrupt intent more explicit.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and it would be to them for an evil name.' The phrase likely means that Nehemiah's sin would give his enemies material for slander or a bad reputation to attach to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내가 두려워하게 되어 그렇게 하여 죄를 짓게 하려고 이 일로 돈을 받았습니다[a]. 그러면 그들에게는 나를 비방할 악한 평판거리가 생기게 됩니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '이 일로 고용되었다/돈을 받았다'입니다. 문맥상 단순 고용이 아니라 금전적 대가를 받고 음모에 가담했다는 뜻이 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 '악한 이름'이지만, 문맥상 적들이 나를 헐뜯을 근거, 곧 나쁜 평판거리를 얻게 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂכוּר
  english_pob_choice: hired
  chosen_korean: 돈을 받았습니다
  alternatives_korean:
  - 고용되었습니다
  - 매수되었습니다
  - 뇌물을 받았습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 고용이라기보다 금전적 대가를 받고 이 일을 맡은 뜻이므로, 직역의 '고용'보다 의미를 드러내는 '돈을 받았습니다'가 본문 의도를 더 분명히 살립니다.
- source_word: אִירָא
  english_pob_choice: I should become afraid
  chosen_korean: 내가 두려워하게 되어
  alternatives_korean:
  - 내가 두려워하여
  - 내가 무서워하게 되어
  - 내가 두려워할까 하여
  lexicon: HALOT
  rationale: 목적을 나타내는 לְמַעַן 아래의 결과를 살려, 단순 상태보다 유도된 반응인 '두려워하게 되어'로 옮겼습니다.
- source_word: וְאֶעֱשֶׂה כֵּן
  english_pob_choice: and act that way
  chosen_korean: 그렇게 하여
  alternatives_korean:
  - 그리하여
  - 그렇게 행동하여
  - 그대로 행하여
  lexicon: HALOT
  rationale: 문맥상 사악한 제안대로 행동하는 것을 가리키므로, 한국어에서는 반복을 줄이면서도 그 행위를 암시하는 '그렇게 하여'가 자연스럽습니다.
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  english_pob_choice: so that they would have grounds for an evil report
  chosen_korean: 그들에게는 나를 비방할 악한 평판거리가 생기게 됩니다
  alternatives_korean:
  - 그들에게 나쁜 이름이 되게 됩니다
  - 그들에게 악한 평판이 되게 됩니다
  - 그들에게 나를 헐뜯을 근거가 생기게 됩니다
  lexicon: HALOT
  rationale: '''이름'' 직역보다, אויב들이 붙잡아 공개적으로 비난할 재료라는 기능적 의미를 한국어에서 살리기 위해 ''평판거리''를 선택했습니다. 또한 ''비방할''로 השם הרע의 모욕적 뉘앙스를 드러냈습니다.'
- source_word: יְחָרְפוּנִי
  english_pob_choice: they might reproach me
  chosen_korean: 비방할
  alternatives_korean:
  - 책망할
  - 조롱할
  - 모욕할
  lexicon: HALOT
  rationale: חרף는 책망보다 공개적 수치 주기와 조롱에 가깝기 때문에, 앞의 '악한 평판거리'와 연결되는 '비방할'이 가장 적절합니다.
theological_decisions:
- issue: 문장 전체의 목적·결과 연쇄와 책임 강조
  chosen_reading: 그는 돈을 받은 목적이 내가 두려워하고 죄를 짓게 만드는 데 있었음을 분명히 드러내는 문장으로 옮겼습니다.
  alternative_readings:
  - 목적을 덜 드러내고 단순 서술형으로 완화하는 번역
  - '''뇌물''을 본문에 직접 넣어 도덕 평가를 전면화하는 번역'
  rationale: 히브리어의 לְמַעַן 반복은 의도적 목적을 강조하므로, 한국어에서도 그 인과 구조를 유지해야 본문의 고발성이 살아납니다. 다만 '뇌물'은 해석을 앞당길 수 있어 본문에는 넣지 않았습니다.
  doctrine_reference: '본문 해석학: 서사 내 인과와 의도 진술 보존'
