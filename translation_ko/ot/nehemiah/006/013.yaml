revisions:
- from: 그는 내가 두려워하게 되어 그렇게 하여 죄를 짓게 하려고 이 일로 돈을 받았습니다[a]. 그러면 그들에게는 나를 비방할 악한 평판거리가 생기게 됩니다[b].
  to: 이는 그가 내가 두려워하여 그렇게 행하고 죄를 짓게 하려고 고용되었던 것입니다[a]. 그렇게 해서 그들이 나를 비방할 구실을 얻고 나를 모욕하려 했던 것입니다[b].
  rationale: 수동 분사 שָׂכוּר를 ‘고용되었다’로 복원하고, 세 차례의 לְמַעַן이 만드는 목적 연쇄를 한국어에서 분명히 했습니다. ‘나쁜 이름’이라는 관용적 표현은 본문에서는 자연스러운 ‘나를 비방할 구실’로 풀되, 각주에 직역과 문맥적 의미를 제시했습니다. 마지막 ‘나를 모욕하려고’는 חרף의 의미와 독립된 목적절을 보존하도록 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:45Z'
