  text: וַ/יִּשְׁלַח֩ אֵלַ֨/י סַנְבַלַּ֜ט כַּ/דָּבָ֥ר הַ/זֶּ֛ה פַּ֥עַם חֲמִישִׁ֖ית אֶֽת נַעֲר֑/וֹ וְ/אִגֶּ֥רֶת פְּתוּחָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/005.yaml
  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
  footnotes:
  - marker: a
    text: Or 'with an unsealed letter in his hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 산발랏이 자기 종을 다섯 번째로 이와 같이 내게 보냈는데, 그의 손에는 열린 편지가 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '봉하지 않은 편지를 손에 들고'.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then ... sent
  chosen_korean: 그러자 ... 보냈는데
  alternatives_korean:
  - 그리고 ... 보냈습니다
  - 그때 ... 보냈습니다
  lexicon: HALOT
  rationale: 서사 진행의 연속성을 살리면서 한국어에서 자연스러운 사건 전개를 표현했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 저에게
  lexicon: HALOT
  rationale: 동사의 수신 대상을 분명히 드러내는 일인칭 방향 표현입니다.
- source_word: כַּדָּבָר הַזֶּה
  english_pob_choice: in this manner
  chosen_korean: 이와 같이
  alternatives_korean:
  - 이런 방식으로
  - 이처럼
  lexicon: HALOT
  rationale: 반복되는 방식이나 내용을 가리키는 관용구로서, 직역의 어색함을 피하면서도 지시적 의미를 유지했습니다.
- source_word: וְאִגֶּרֶת פְּתוּחָה בְּיָדוֹ
  english_pob_choice: with an open letter in his hand
  chosen_korean: 그의 손에는 열린 편지가 있었습니다
  alternatives_korean:
  - 그 손에 열린 편지를 들고 있었습니다
  - 그의 손에 봉하지 않은 편지가 있었습니다
  lexicon: HALOT
  rationale: 편지가 실제로 그가 휴대한 물건이라는 구체적 이미지를 살리면서, פְּתוּחָה의 기본 의미를 '열린'으로 옮겼습니다.
- source_word: פְּתוּחָה
  english_pob_choice: open / unsealed
  chosen_korean: 열린
  alternatives_korean:
  - 봉하지 않은
  - 개봉한
  lexicon: HALOT
  rationale: 문맥상 공개적으로 읽을 수 있는 상태를 뜻하므로, '열린'이 가장 간결하고 자연스럽습니다.
