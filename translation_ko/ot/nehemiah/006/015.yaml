reference: Nehemiah 6:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ הַֽ/חוֹמָ֔ה בְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה לֶ/אֱל֑וּל לַ/חֲמִשִּׁ֥ים וּ/שְׁנַ֖יִם יֽוֹם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/015.yaml
  text: So the wall was finished on the twenty-fifth day of Elul[b][a], in fifty-two days.
  footnotes:
  - marker: a
    text: Or 'was completed.'
    reason: lexical_alternative
  - marker: b
    text: Elul is the sixth month of the Hebrew calendar.
    reason: cultural_note
translation:
  language: ko
  text: 성벽은 엘룰월 스물다섯째 날에, 곧 쉰둘째 날에 완공되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘완공되었습니다’는 원문의 ‘was finished’를 자연스럽게 옮긴 것입니다. 문자적으로는 ‘완성되었습니다/끝났습니다’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 엘룰은 히브리 달력의 여섯째 달입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּשְׁלַם
  english_pob_choice: was finished
  chosen_korean: 완공되었습니다
  alternatives_korean:
  - 끝났습니다
  - 완성되었습니다
  lexicon: HALOT
  rationale: 여기서는 성벽이 공사가 마쳐진 상태에 이른 사건을 자연스럽고 공사 문맥에 맞게 표현하는 것이 중요하므로 ‘완공되었습니다’로 옮겼습니다. ‘완성되었습니다’도 가능하지만, 건축·토목 맥락에서는 ‘완공’이 더 정확합니다.
- source_word: הַחוֹמָה
  english_pob_choice: the wall
  chosen_korean: 성벽
  alternatives_korean:
  - 벽
  - 담장
  lexicon: HALOT
  rationale: 예루살렘의 성문·성벽 재건 문맥이 분명하므로 단순한 ‘벽’보다 ‘성벽’이 원문의 대상을 더 분명히 드러냅니다.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה לֶאֱלוּל
  english_pob_choice: on the twenty-fifth day of Elul
  chosen_korean: 엘룰월 스물다섯째 날에
  alternatives_korean:
  - 엘룰월 25일에
  - 엘룰월 스물다섯 날에
  lexicon: HALOT
  rationale: 히브리 달명은 음역해 ‘엘룰월’로 두고, 날짜 표현은 한국어 관용에 맞게 서수형 ‘스물다섯째 날’로 옮겼습니다.
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  english_pob_choice: in fifty-two days
  chosen_korean: 쉰둘째 날에
  alternatives_korean:
  - 쉰두 날 만에
  - 쉰두 날 동안에
  lexicon: HALOT
  rationale: 원문은 완공이 이루어진 총 경과 시간을 말하므로, 한국어에서는 ‘쉰둘째 날에’로 압축해 날짜 종결 표현으로 처리했습니다. 숫자와 ‘날’의 결합이 어색해질 수 있어 문맥상 가장 자연스러운 방식입니다.
theological_decisions:
- issue: 완공 시점의 의미를 단순 시간 정보로만 볼지, 하나님의 도우심 아래 성벽 재건의 성취로 읽을지
  chosen_reading: 본문은 역사적 보고문으로, 완공 시점 자체를 간결하게 진술합니다. 한국어 본문에는 해석적 확장을 덧붙이지 않고 사실 진술에 머물렀습니다.
  alternative_readings:
  - 하나님의 도우심으로 완공되었다는 식의 해석적 강조
  - 기적적 속도를 암시하는 표현
  rationale: 원문과 영어 POB는 모두 결과 사실과 기간을 보고할 뿐, 여기서 추가 신학적 설명을 요구하지 않습니다.
  doctrine_reference: 성경 본문 해석의 역사-서술적 문맥 존중
- issue: ‘was finished’의 상태 완료와 사건 완료 중 어느 쪽을 살릴지
  chosen_reading: ‘완공되었습니다’는 결과 상태와 사건 완료를 함께 드러내는 한국어 표현으로 처리했습니다.
  alternative_readings:
  - 끝났습니다
  - 완성되었습니다
  rationale: 원문의 완료상은 서술적 보고로 자연스럽게 전달되어야 하므로, 의미를 약화시키거나 공사 맥락을 흐리는 표현은 피했습니다.
  doctrine_reference: 문법적 상(aspect)과 서술 관용의 균형
