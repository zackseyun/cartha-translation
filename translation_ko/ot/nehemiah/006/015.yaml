  terminology: ‘성벽’과 ‘완공되었습니다’는 예루살렘 성벽 재건이라는 문맥 및 원문의 완료 동사에 잘 맞습니다. ‘엘룰월’은 음역된 히브리 월명으로 적절합니다.
