- source_word: וַאֲשֶׁר לְטוֹבִיָּה בָּאוֹת אֲלֵיהֶם
  english_pob_choice: those from Tobiah were coming to them
  chosen_korean: 도비야에게서 온 것들은 그들에게 오고 있었습니다
  alternatives_korean:
  - 도비야에게서 온 편지들은 그들에게 오고 있었습니다
  - 도비야 쪽에서 온 것들은 그들에게 도착하고 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 반복 구조를 따라 ‘것들’로 받되, 앞절의 ‘편지들’과 병행되는 의미가 분명하도록 자연스럽게 처리했습니다.
