  text: Also[a], in those days the nobles of Judah were sending many letters to Tobiah, and those from Tobiah were coming to them.
  footnotes:
  - marker: a
    text: Hebrew literally, 'their letters were going to Tobiah, and those belonging to Tobiah were coming to them.' The second clause likely implies 'letters' from the parallel first clause.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 그때에 유다의 귀족들이 많은 편지를 도비야에게 보내고 있었고, 도비야에게서 온 것들은 그들에게 오고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 편지들이 도비야에게 가고 있었고, 도비야에게 속한 것들이 그들에게 오고 있었다’에 가깝습니다. 둘째 절은 앞절과 평행하여 ‘편지들’을 가리키는 것으로 보입니다.
    reason: lexical_alternative
