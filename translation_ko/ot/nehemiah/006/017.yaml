  - 유다의 유력자들
  lexicon: HALOT
  rationale: 사회적·정치적 상층 지도층을 가리키는 표현으로, ‘귀족들’이 본문 맥락을 가장 잘 반영합니다.
- source_word: הוֹלְכֹת עַל טוֹבִיָּה
  english_pob_choice: to Tobiah
  chosen_korean: 도비야에게 보내고 있었고
