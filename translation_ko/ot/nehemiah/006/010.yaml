  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִי בָ֗אתִי בֵּ֣ית שְֽׁמַֽעְיָ֧ה בֶן דְּלָיָ֛ה בֶּן מְהֵֽיטַבְאֵ֖ל וְ/ה֣וּא עָצ֑וּר וַ/יֹּ֡אמֶר נִוָּעֵד֩ אֶל בֵּ֨ית הָ/אֱלֹהִ֜ים אֶל תּ֣וֹךְ הַֽ/הֵיכָ֗ל וְ/נִסְגְּרָה֙ דַּלְת֣וֹת הַ/הֵיכָ֔ל כִּ֚י בָּאִ֣ים לְ/הָרְגֶ֔/ךָ וְ/לַ֖יְלָה בָּאִ֥ים לְ/הָרְגֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
  footnotes:
  - marker: a
    text: Or “inside the sanctuary.” The Hebrew heikhal can refer specifically to the temple building or sanctuary, not merely the larger temple precincts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 세마야, 곧 들라야의 아들, 므헤다벨의 손자의 집에 갔더니 그가 갇혀 있었고, 그가 말하기를 「하나님의 집, 곧 성전 안에서 만나자. 그리고 성전 문들을 닫자. 그들이 너를 죽이러 오고 있기 때문이다. 밤에 그들이 너를 죽이러 오고 있다」라고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성소 안에서.” 히브리어 heikhal은 더 넓은 성전 경내가 아니라 성전 건물이나 성소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  english_pob_choice: Then I went
  chosen_korean: 그때 내가 ... 갔더니
  alternatives_korean:
  - 그리고 내가 갔습니다
  - 내가 갔습니다
  lexicon: HALOT
  rationale: 서술의 흐름을 살리되, 화자의 다음 행동이 이어지는 장면 전환을 자연스럽게 표현했습니다.
- source_word: עָצוּר
  english_pob_choice: who was confined
  chosen_korean: 갇혀 있었고
  alternatives_korean:
  - 가두어져 있었고
  - 제한되어 있었고
  - 막혀 있었고
  lexicon: HALOT
  rationale: 사람이 밖으로 나올 수 없는 상태를 드러내면서도, 그 이유를 단정하지 않도록 '갇혀 있었다'로 옮겼습니다.
- source_word: אֶל תּוֹךְ הַהֵיכָל
  english_pob_choice: inside the temple
  chosen_korean: 성전 안에서
  alternatives_korean:
  - 성전 내부에서
  - 성소 안에서
  lexicon: HALOT
  rationale: POB의 본문 번역은 'temple'로 두고 각주에서 'sanctuary' 가능성을 남기므로, 본문에는 더 자연스러운 '성전 안에서'를 택했습니다.
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  english_pob_choice: and let us shut the doors of the temple
  chosen_korean: 성전 문들을 닫자
  alternatives_korean:
  - 성전의 문들을 닫자
  - 성전 문을 닫자
  lexicon: HALOT
  rationale: 복수형 '문들'을 살리면서, 권유형의 흐름을 한국어에서도 자연스럽게 유지했습니다.
- source_word: בָּאִים לְהָרְגֶךָ ... וְלַיְלָה
  english_pob_choice: they are coming to kill you—yes, at night they are coming to kill you
  chosen_korean: 그들이 너를 죽이러 오고 있기 때문이다. 밤에 그들이 너를 죽이러 오고 있다
  alternatives_korean:
  - 그들이 너를 죽이러 오기 때문이다. 밤에도 그들이 너를 죽이러 온다
  - 그들이 너를 죽이러 올 것이다. 밤에도 그들이 너를 죽이러 올 것이다
  lexicon: HALOT
  rationale: 현재분사적 긴박감을 살려 '오고 있다'로 옮기고, 반복을 그대로 유지해 위협의 절박함을 보존했습니다.
theological_decisions:
- issue: הֵיכָל의 번역 범위
  chosen_reading: 본문에는 '성전'을 두고, '성소' 가능성은 각주로 보존합니다.
  alternative_readings:
  - 성소
  - 내부 성소
  rationale: 문맥상 제한된 거룩한 공간일 수 있지만, 어휘 자체는 성전 건물/성소를 모두 가리킬 수 있어 본문과 각주로 긴장을 유지했습니다.
  doctrine_reference: 본문-각주 분리로 어휘적 모호성 보존
