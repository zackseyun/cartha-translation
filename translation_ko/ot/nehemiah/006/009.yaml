  text: כִּ֣י כֻלָּ֗/ם מְיָֽרְאִ֤ים אוֹתָ֨/נוּ֙ לֵ/אמֹ֔ר יִרְפּ֧וּ יְדֵי/הֶ֛ם מִן הַ/מְּלָאכָ֖ה וְ/לֹ֣א תֵעָשֶׂ֑ה וְ/עַתָּ֖ה חַזֵּ֥ק אֶת יָדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
  footnotes:
  - marker: a
    text: Or 'their hands will become weak from the work.' The Hebrew idiom literally speaks of hands slackening or dropping.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause is a brief prayer: ''But now, strengthen my hands.'' Some have understood it differently, but the Hebrew vocalization supports a direct appeal to God.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들 모두가 우리를 겁주려 했습니다[a]. 곧 “그들의 손이 일에서 약해져서, 그 일은 이루어지지 않을 것이다”라고 말했습니다. 그러나 이제[b] 제 손을 강하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 손이 일에서 느슨해질 것이다/떨어질 것이다’라는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 짧은 기도입니다. 일부는 다른 방식으로 이해하지만, 히브리어 모음 표기는 하나님께 드리는 직접 간구를 지지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים אוֹתָנוּ
  english_pob_choice: were trying to frighten us
  chosen_korean: 우리를 겁주려 했습니다
  alternatives_korean:
  - 우리를 두려워하게 하려 했습니다
  - 우리를 위협하려 했습니다
  lexicon: HALOT
  rationale: 히필 분사는 지속적·의도적 공포 조성을 가리키므로, 문맥에 맞게 ‘겁주려 했습니다’로 옮겨 과정을 살렸습니다.
- source_word: יִרְפּוּ יְדֵיהֶם
  english_pob_choice: Their hands will grow weak
  chosen_korean: 그들의 손이 일에서 약해져서
  alternatives_korean:
  - 그들의 손이 일에서 느슨해져서
  - 그들의 손이 일에서 떨어져서
  lexicon: HALOT
  rationale: 직역하면 ‘손이 힘을 잃다/느슨해지다’라는 관용구이므로, 손의 이미지와 작업의 맥락을 함께 살려 ‘일에서 약해져서’로 옮겼습니다.
- source_word: וְעַתָּה חַזֵּק אֶת יָדַי
  english_pob_choice: But now, strengthen my hands
  chosen_korean: 그러나 이제 제 손을 강하게 하십시오
  alternatives_korean:
  - 그러나 이제 제 손을 굳세게 하십시오
  - 그러나 이제 제 손에 힘을 주십시오
  lexicon: HALOT
  rationale: 히브리어의 손 이미지와 간구의 직접성을 살리되, 한국어에서는 자연스러운 명령형 기도 표현으로 다듬었습니다.
theological_decisions:
- issue: 마지막 절의 화자와 발화 형식
  chosen_reading: 마지막 절을 하나님께 드리는 직접 간구로 처리해 ‘제 손을 강하게 하십시오’라고 옮겼습니다.
  alternative_readings:
  - 자기 독백 또는 자기 격려로 이해하는 번역
  rationale: 마소라 본문의 2인칭 남성 단수 명령형은 문맥상 하나님께 드리는 짧은 기도로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문 문맥과 마소라 점강에 따른 직접 기도 이해
