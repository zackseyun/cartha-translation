source:
  edition: WLC
  text: וְ/גַם נְבִיאִ֡ים הֶעֱמַ֣דְתָּ לִ/קְרֹא֩ עָלֶ֨י/ךָ בִֽ/ירוּשָׁלִַ֜ם לֵ/אמֹ֗ר מֶ֚לֶךְ בִּֽ/יהוּדָ֔ה וְ/עַתָּה֙ יִשָּׁמַ֣ע לַ/מֶּ֔לֶךְ כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וְ/עַתָּ֣ה לְכָ֔/ה וְ/נִֽוָּעֲצָ֖ה יַחְדָּֽו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
  footnotes:
  - marker: a
    text: Or 'these things' or 'such words.' The Hebrew can refer broadly to words, matters, or reports.
    reason: lexical_alternative
  - marker: b
    text: The quoted accusation is literally 'king in Judah,' a terse Hebrew report that implies a claim of kingship without explicitly naming Nehemiah in the quotation itself.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 당신은 예언자들까지 세워 예루살렘에서 당신에 관하여 선포하게 했습니다. “유다에 왕이 있습니다!” 이제 이런 보고가 왕에게 들릴 것입니다.[a] 그러니 이제 오셔서 함께 의논합시다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이런 말들’, ‘이런 일들’, 또는 ‘이런 보고들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And you have even
  chosen_korean: 그리고 당신은 …까지
  alternatives_korean:
  - 그리고 또한
  - 더욱이 당신은
  lexicon: HALOT
  rationale: 첨가와 강조를 함께 담아, 상대를 몰아붙이는 고발조의 뉘앙스를 살렸습니다.
- source_word: נְבִיאִים הֶעֱמַדְתָּ
  english_pob_choice: you have even appointed prophets
  chosen_korean: 예언자들까지 세웠습니다
  alternatives_korean:
  - 예언자들을 임명하셨습니다
  - 예언자들을 세워 두셨습니다
  lexicon: HALOT
  rationale: הֶעֱמַדְתָּ는 사람을 역할에 두는 뜻이어서, 한국어에서는 ‘세우다’가 가장 직접적입니다.
- source_word: לִקְרֹא עָלֶיךָ
  english_pob_choice: to proclaim about you
  chosen_korean: 당신에 관하여 알리도록
  alternatives_korean:
  - 당신에 관해 선포하도록
  - 당신에 대해 외치도록
  lexicon: HALOT
  rationale: עַל을 살려 ‘관하여’로 옮기고, 공개적 선포의 성격은 ‘알리다’로 담았습니다.
- source_word: מֶלֶךְ בִּיהוּדָה
  english_pob_choice: There is a king in Judah!
  chosen_korean: “유다에 왕이 있습니다!”
  alternatives_korean:
  - “유다에 왕이 있습니다!”
  - “유다의 왕입니다!”
  lexicon: HALOT
  rationale: 히브리어의 짧고 보고문 같은 표현을 살리되, 인용문 안에서 네헤미야의 이름을 덧붙이지 않았습니다.
- source_word: וְעַתָּה יִשָּׁמַע לַמֶּלֶךְ כַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: And now these reports will be heard by the king
  chosen_korean: 이제 이런 말이 왕에게 들릴 것입니다
  alternatives_korean:
  - 이제 이런 보고가 왕에게 전해질 것입니다
  - 이제 왕이 이런 말을 듣게 될 것입니다
  lexicon: HALOT
  rationale: דְּבָרִים는 문맥상 ‘말/보고’의 범위가 있어, 고발의 내용이 왕에게 전달되는 장면으로 자연스럽게 옮겼습니다.
- source_word: וְנִוָּעֲצָה יַחְדָּו
  english_pob_choice: and let us consult together
  chosen_korean: 함께 의논합시다
  alternatives_korean:
  - 함께 상의합시다
  - 함께 의논해 봅시다
  lexicon: HALOT
  rationale: נִוָּעֲצָה는 상호적 의논을 뜻하므로, 현대 한국어에서 격식 있는 권유형으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 인용문 내부의 ‘왕’ 표현과 대상 인물의 명시 여부
  chosen_reading: 인용문은 짧게 “유다에 왕이 있습니다!”로 두어, 본문이 직접 주는 고발의 형식만 유지했습니다.
  alternative_readings:
  - “당신이 유다의 왕입니다!”
  - “느헤미야가 유다의 왕입니다!”
  rationale: 히브리어는 이름을 명시하지 않는 서술형 인용이므로, 본문에 없는 대상을 덧붙이지 않고 고발의 함의를 유지했습니다.
  doctrine_reference: Original-language primacy; never paraphrase beyond what the source text warrants.
