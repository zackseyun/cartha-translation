  naturalness: ‘예언자들까지 세웠습니다’는 문법상 가능하나 사람을 물리적으로 세운다는 인상이 있어, 역할을 맡긴 뜻을 분명히 하는 ‘예언자들까지 세워 … 선포하게 했습니다’가 현대 한국어에서 더 자연스럽습니다. ‘이런 보고가 왕에게 들릴 것입니다’는 문맥상 자연스럽고 수동 표현도 유지합니다.
