  text: They sent to me four times in this way[a], and I answered them in the same way.
  footnotes:
  - marker: a
    text: Literally, 'according to this word' in both clauses; the phrase refers to the same message being sent and the same kind of answer being returned.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 이와 같은 방식으로 네 번이나 저에게 사람을 보냈고, 저는 같은 방식으로 그들에게 대답했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 절 모두에서 문자적으로 ‘이 말/일에 따라’에 해당하는 같은 표현을 사용합니다. 앞절은 보낸 내용, 뒷절은 그에 대한 응답의 동일한 성격을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  english_pob_choice: They sent
  chosen_korean: 사람을 보냈고
  alternatives_korean:
  - 보냈고
  - 전했습니다
  lexicon: HALOT
  rationale: 히브리어 שלח는 기본적으로 ‘보내다’이므로, 문맥상 암시된 전달자를 드러내어 한국어에서는 자연스럽게 ‘사람을 보냈고’로 옮겼습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 저에게
  alternatives_korean:
  - 나에게
  - 내게
  lexicon: HALOT
  rationale: 1인칭 단수 목적어를 현대 한국어 합쇼체로 자연스럽게 반영했습니다.
- source_word: כַּדָּבָר הַזֶּה
  english_pob_choice: in this way
  chosen_korean: 이와 같은 방식으로
  alternatives_korean:
  - 이렇게
  - 이와 같이
  - 이 같은 말로
  lexicon: HALOT
  rationale: 직역하면 ‘이 말/일에 따라’이지만, 두 절에서 같은 표현이 반복되는 점을 살리면서도 한국어에서 어색하지 않게 ‘이와 같은 방식으로’로 옮겼습니다.
- source_word: וָאָשִׁיב
  english_pob_choice: and I answered
  chosen_korean: 대답했습니다
  alternatives_korean:
  - 응답했습니다
  - 되돌려 답했습니다
  lexicon: HALOT
  rationale: 회신의 뜻을 가진 Hiphil שוב의 용법을 따라, 서신 왕복의 맥락에서 자연스러운 ‘대답했습니다’를 선택했습니다.
