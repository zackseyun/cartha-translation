id: NEH.6.11
reference: Nehemiah 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
  footnotes:
  - marker: a
    text: Or 'the sanctuary.' The point is likely not merely hiding indoors but entering a restricted temple area in a way that would be improper for Nehemiah, which explains the force of 'and live.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 말했습니다. 「나 같은 사람이 도망하겠습니까? 나 같은 사람이 성전에 들어가서 살아남을 수 있겠습니까? 나는 들어가지 않겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성전’은 여기서 단순한 건물이 아니라, 느헤미야에게 허용되지 않은 거룩한 구역에 들어가는 행위를 가리킬 가능성이 큽니다.
    reason: source_note
lexical_decisions:
- source_word: וָאֹמְרָה
  english_pob_choice: But I said
  chosen_korean: 그러나 나는 말했습니다
  alternatives_korean:
  - 그리고 나는 말했습니다
  - 그래서 나는 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 잇되 앞문맥의 유인에 대한 거절이라는 대조를 살려 ‘그러나’로 옮겼습니다.
- source_word: הָאִישׁ כָּמוֹנִי
  english_pob_choice: a man like me
  chosen_korean: 나 같은 사람
  alternatives_korean:
  - 나 같은 남자
  - 나와 같은 한 사람
  lexicon: HALOT
  rationale: 히브리어의 일반적이면서도 자기지시적인 표현을 자연스러운 한국어로 살리기 위해 ‘사람’을 사용했습니다.
- source_word: יִבְרָח
  english_pob_choice: flee
  chosen_korean: 도망하겠습니까
  alternatives_korean:
  - 달아나겠습니까
  - 도망가겠습니까
  lexicon: HALOT
  rationale: 겁에 질린 도피라는 뉘앙스를 유지하면서도 수사적 질문에 맞는 구어적·문어적 균형을 위해 ‘도망하다’를 택했습니다.
- source_word: הַהֵיכָל
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 성소
  - 성전 뜰
  lexicon: HALOT
  rationale: POB의 본문 번역은 ‘temple’이지만, 이 문맥에서의 cultic restriction을 한국어 독자가 바로 이해하도록 ‘성전’으로 옮겼습니다.
- source_word: וָחָי
  english_pob_choice: and live
  chosen_korean: 살아남을 수 있겠습니까
  alternatives_korean:
  - 살 수 있겠습니까
  - 무사하겠습니까
  lexicon: HALOT
  rationale: 단순 생존 가능성을 넘어 금지된 장소에 들어갈 경우의 결과라는 긴장을 드러내기 위해 ‘살아남다’를 사용했습니다.
- source_word: לֹא אָבוֹא
  english_pob_choice: I will not go in
  chosen_korean: 들어가지 않겠습니다
  alternatives_korean:
  - 가 들어가지 않겠습니다
  - 들어가 보지 않겠습니다
  lexicon: HALOT
  rationale: 앞선 ‘들어가다’와의 연계를 살리면서 거절 의지를 분명히 하기 위해 ‘들어가지 않겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 성전 प्रवेश의 의미
  chosen_reading: 느헤미야는 단순한 은신처 이동이 아니라 자신에게 부당하고 위험한 성전 출입을 거절합니다.
  alternative_readings:
  - 그저 실내로 숨는 제안을 거절한 것일 수 있습니다
  rationale: 문맥상 유혹은 느헤미야를 죄에 빠뜨리고 명예를 훼손하려는 의도로 보이므로, 본문은 그 cultic 함의를 유지해야 합니다.
  doctrine_reference: Translation philosophy §3 (theological tension 유지); 문맥 주해
