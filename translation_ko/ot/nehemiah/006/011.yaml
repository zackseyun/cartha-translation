  source_fidelity: 첫 수사 의문문은 הָאִישׁ כָּמוֹנִי יִבְרָח를 충실히 옮겼습니다. 그러나 둘째 절의 ‘그리고 나 같은 사람이 누가’는 히브리어의 וּמִי כָמוֹנִי(‘그리고 누가 나 같은 사람이겠습니까’)를 한국어에서 문법적으로 결합하지 못했습니다. ‘성전에 들어가서 살아남다’는 וָחָי의 생명 보전/생존의 함의를 무리 없이 드러냅니다.
  naturalness: ‘나 같은 사람이 누가 성전으로…’는 주격 표현과 의문사가 중복되어 비문입니다. ‘나 같은 사람이 성전에 들어가서 살아남을 수 있겠습니까?’로 하면 현대 표준 한국어의 자연스러운 합쇼체 수사 의문문이 되며, 원문의 반복된 자기 지시와 반문도 유지됩니다.
  terminology: ‘성전’은 הַהֵיכָל의 적절한 기본 번역입니다. 각주에서 이 말이 성전 건물 일반이 아니라 제한된 성소 구역을 가리킬 가능성을 설명하는 것은 문맥에 부합하되, ‘가능성이 큽니다’라는 신중한 표현도 유지되어야 합니다. ‘살아남다’는 여기서 부당한 출입에 연관된 생명 보전의 긴장을 전달합니다.
