  - 내 말을 그에게 알렸습니다
  - 내 말을 그에게 옮겼습니다
  lexicon: HALOT
  rationale: 직역하면 ‘내 말을 그에게 밖으로 가져가다’라는 관용구이므로, 정보 전달의 뜻을 드러내는 ‘전해 주었습니다’가 가장 자연스럽습니다.
- source_word: לְיָרְאֵנִי
  english_pob_choice: to frighten me
  chosen_korean: 나를 두렵게 하려고
  alternatives_korean:
  - 나를 무섭게 하려고
  - 나를 겁주려고
  - 나를 두려워하게 하려고
  lexicon: HALOT
  rationale: 원문의 목적 의미를 살려, 단순한 감정 상태가 아니라 의도적 위협을 나타내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 편지의 의도 표현
  chosen_reading: 도비야가 편지를 보낸 목적을 직접적으로 ‘나를 두렵게 하려고’로 옮겨, 정치적 압박과 위협의 강도를 드러냈습니다.
  alternative_readings:
  - 나를 겁주려고
  - 나를 무섭게 하려고
  rationale: 히브리어 목적 구문은 단순 통지가 아니라 공포 유발을 겨냥한 행위를 뜻하므로, 의미를 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 서사 문맥의 의미 보존
