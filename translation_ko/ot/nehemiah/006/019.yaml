  text: גַּ֣ם טוֹבֹתָ֗י/ו הָי֤וּ אֹמְרִים֙ לְ/פָנַ֔/י וּ/דְבָרַ֕/י הָי֥וּ מוֹצִיאִ֖ים ל֑/וֹ אִגְּר֛וֹת שָׁלַ֥ח טוֹבִיָּ֖ה לְ/יָֽרְאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/019.yaml
  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
  footnotes:
  - marker: a
    text: Or 'his good qualities' or 'the good things about him'; the Hebrew phrase is broader than deeds alone, but here it refers to favorable commendation of Tobiah before Nehemiah.
    reason: lexical_alternative
  - marker: b
    text: Literally 'they were bringing out my words to him,' an idiom for relaying or reporting Nehemiah's words to Tobiah.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 그들은 그의 좋은 점들을 내 앞에서 말했고[a], 내 말을 그에게 전해 주었습니다[b]. 도비야는 나를 두렵게 하려고 편지들을 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 좋은 일들/좋은 점들’처럼 더 넓을 수 있어, 여기서는 토비야에 대한 호의적 평판을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 말을 그에게 밖으로 가져가다’라는 관용구로, 곧 내 말을 그에게 전해 주는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
