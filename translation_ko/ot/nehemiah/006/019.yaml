  - 그의 좋은 일들
  - 그의 공로들
  lexicon: HALOT
  rationale: 히브리어는 단순한 ‘행위’보다 더 넓게 유리한 평판이나 장점들을 가리킬 수 있어, POB의 주석 취지를 살려 ‘좋은 점들’로 옮겼습니다.
- source_word: הָיוּ מוֹצִיאִים לוֹ
  english_pob_choice: they kept reporting ... to him
  chosen_korean: 내 말을 그에게 전해 주었습니다
  alternatives_korean:
