reference: Nehemiah 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁלְחָ֨/ה עֲלֵי/הֶ֤ם מַלְאָכִים֙ לֵ/אמֹ֔ר מְלָאכָ֤ה גְדוֹלָה֙ אֲנִ֣י עֹשֶׂ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/רֶ֑דֶת לָ֣/מָּה תִשְׁבַּ֤ת הַ/מְּלָאכָה֙ כַּ/אֲשֶׁ֣ר אַרְפֶּ֔/הָ וְ/יָרַדְתִּ֖י אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
  footnotes:
  - marker: a
    text: Or 'Why should the work cease while I leave it and go down to you?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 내가 그들에게 사자들을 보내어 말하기를, “나는 큰 일을 하고 있으므로 내려갈 수 없습니다. 내가 그 일을 내려놓고 여러분에게 내려가야 한다면, 어찌 그 일이 멈추겠습니까?”라고 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그 일을 내려놓고 여러분에게 내려가야 한다면, 어찌 그 일이 멈추겠습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 전령들
  - 사절들
  lexicon: HALOT
  rationale: 문맥상 천사가 아니라 메시지를 전달하는 인간 사절이므로, 공적인 전달자를 뜻하는 ‘사자들’이 가장 자연스럽습니다.
- source_word: מְלָאכָה גְדוֹלָה
  english_pob_choice: a great work
  chosen_korean: 큰 일
  alternatives_korean:
  - 위대한 일
  - 중대한 일
  lexicon: HALOT
  rationale: מְלָאכָה는 단순한 ‘일/작업/과업’이고, ‘큰’은 그 중요성과 규모를 함께 살립니다.
- source_word: וְלֹא אוּכַל לָרֶדֶת / וְיָרַדְתִּי אֲלֵיכֶם
  english_pob_choice: I cannot come down / and come down to you
  chosen_korean: 내려갈 수 없습니다 / 여러분에게 내려가야 한다면
  alternatives_korean:
  - 내려갈 수 없습니까
  - 내려가겠습니다
  lexicon: HALOT
  rationale: ירד의 반복은 예루살렘에서 상대에게 ‘내려가는’ 공간적 움직임을 유지하므로, 같은 동사를 살려 ‘내려가다’로 옮겼습니다.
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  english_pob_choice: Why should the work stop
  chosen_korean: 어찌 그 일이 멈추겠습니까
  alternatives_korean:
  - 왜 그 일이 멈추겠습니까
  - 그 일이 어찌 멈추겠습니까
  lexicon: HALOT
  rationale: שׁבת는 여기서 안식일이 아니라 ‘멈추다/중단되다’의 뜻이므로, 수사적 질문을 자연스러운 한국어로 살렸습니다.
theological_decisions:
- issue: 화자의 자기 진술이 ‘일’을 신학적 사명으로 제시하는 방식
  chosen_reading: ‘큰 일’은 단순한 바쁨이 아니라 예루살렘 성벽 재건이라는 주어진 사명을 가리키는 말로 유지했습니다.
  alternative_readings:
  - ‘중대한 과업’으로 완화
  - ‘중요한 사업’으로 일반화
  rationale: 본문의 긴급성과 사명 의식을 약화시키지 않도록, 작업의 중요성을 직접 드러내는 표현을 유지했습니다.
  doctrine_reference: 성경적 소명과 공동체 재건의 우선성
- issue: 직접 화법 안의 예의 수준
  chosen_reading: 화자는 청자를 정중하게 가리키는 ‘여러분에게’와 서술체 종결 ‘-습니다’를 유지했습니다.
  alternative_readings:
  - 더 평이한 반말형
  - 고전적 종결형
  rationale: 합쇼체 본문 스타일을 지키면서도, 인용문 내부의 요청을 과도하게 격하시킬 필요가 없습니다.
  doctrine_reference: 본문 화행의 문체 보존
