  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
  footnotes:
  - marker: a
    text: Or, more literally, 'many in Judah were possessors of an oath to him,' that is, they were obligated to him by oath.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'had taken the daughter of Meshullam son of Berechiah'; this is a standard idiom for marrying her.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다에 있는 많은 사람이 그에게 맹세로 얽매여 있었습니다.[a] 그가 아라의 아들 스가냐의 사위였고, 스가냐의 아들 여호하난이 베레갸의 아들 므술람의 딸을 아내로 맞이했기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘유다에 있는 많은 사람이 그에게 맹세의 소유자였다’입니다. 이는 그들이 맹세로 그에게 의무를 지고 있었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘베레갸의 아들 므술람의 딸을 취하였다’라고 합니다. 이는 그녀를 아내로 맞이했다는 관용적 표현입니다.
    reason: lexical_alternative
