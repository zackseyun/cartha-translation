  text: 유다에 있는 많은 사람이 그에게 맹세로 묶였으니, 이는 그가 아라的儿子 스그냐의 사위였기 때문이며, 그의 아들 여호하난이 베레기야의 아들 메술람의 딸을 아내로 삼았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
