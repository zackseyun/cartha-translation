    text: 더 정확히 말하면, '유다에 있는 많은 사람이 그에게 맹세의 소유자였다'는 뜻으로, 맹세로 그에게 의무가 있음을 의미합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 원문은 '메술람의 딸을 취하였다'로, 이는 그녀를 아내로 삼았다는 관용적 표현입니다.
