source:
  edition: WLC
  text: וָ/אֹמַ֣ר לַ/מֶּ֔לֶךְ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב וְ/אִם יִיטַ֥ב עַבְדְּ/ךָ֖ לְ/פָנֶ֑י/ךָ אֲשֶׁ֧ר תִּשְׁלָחֵ֣/נִי אֶל יְהוּדָ֗ה אֶל עִ֛יר קִבְר֥וֹת אֲבֹתַ֖/י וְ/אֶבְנֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
  footnotes:
  - marker: a
    text: Or 'If it pleases the king.' The Hebrew is a courtly idiom of royal approval.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'to the city of the graves of my fathers.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verb is 'build'; 'rebuild' makes explicit the context that the city lies in ruins.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 왕에게 말했습니다[a]. 「왕께서 좋게 여기시면, 또한 왕의 종인 제가 왕 앞에서 은혜를 입었다면, 저를 유다로 보내시어 제 조상들의 무덤이 있는 성읍으로 가게 하셔서, 제가 그것을 다시 세우게 해 주십시오[c][b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕께서 좋게 여기시면.” 히브리어는 왕의 승인을 묻는 궁정식 관용구입니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 “제 조상들의 무덤의 성읍으로”입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 단순히 “짓다”이지만, 여기서는 무너진 성읍을 다시 세우는 문맥입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: Then I said
  chosen_korean: 그때 내가 말했습니다
  alternatives_korean:
  - 그리고 내가 말했습니다
  - 그때 내가 왕에게 말했습니다
  lexicon: WLC + HALOT
  rationale: 와우-연속형의 서술 전진을 한국어 자연스러운 시간 전환으로 옮겼습니다.
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  english_pob_choice: If it pleases the king
  chosen_korean: 왕께서 좋게 여기시면
  alternatives_korean:
  - 왕께서 기뻐하시면
  - 왕의 뜻에 맞으시면
  lexicon: HALOT
  rationale: 궁정식 승인 관용구를 직역보다 공손한 현대 한국어로 살리되, 왕의 판단과 호의를 드러내는 표현을 유지했습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 왕의 종인 제가
  alternatives_korean:
  - 왕의 종인 저가
  - 당신의 종인 제가
  lexicon: HALOT
  rationale: 페르시아 궁정 호칭의 자기비하적 공손을 반영해 '종'을 유지했고, 한국어에서는 주어를 분명히 하기 위해 '제가'를 보완했습니다.
- source_word: אֶל עִיר קִבְרוֹת אֲבֹתַי
  english_pob_choice: to the city of my fathers' graves
  chosen_korean: 제 조상들의 무덤이 있는 성읍으로
  alternatives_korean:
  - 제 조상들의 무덤들의 성읍으로
  - 제 조상들의 무덤이 있는 도시로
  lexicon: HALOT
  rationale: 문자적 '무덤'과 '성읍'의 결합을 유지하되, 한국어에서 더 자연스럽게 관계절로 풀어 의미를 분명히 했습니다.
- source_word: וְאֶבְנֶנָּה
  english_pob_choice: so that I may rebuild it
  chosen_korean: 제가 그것을 다시 세우게 해 주십시오
  alternatives_korean:
  - 제가 그것을 건축하게 해 주십시오
  - 제가 그것을 다시 건축하게 해 주십시오
  lexicon: HALOT
  rationale: 문맥상 폐허가 된 성읍을 가리키므로 영어 POB의 'rebuild'에 대응해 '다시 세우다'를 택했습니다.
theological_decisions:
- issue: 궁정 청원문의 정중한 요청 형식
  chosen_reading: 직접 명령형이 아니라 '…하게 해 주십시오'로 청원형을 살렸습니다.
  alternative_readings:
  - 저를 보내십시오
  - 저를 보내주십시오
  rationale: 히브리어는 왕에게 드리는 정중한 요청으로, 화자가 왕을 향해 허가를 구하는 사회적·수사적 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 서사적 화행의 보존
