  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문은 ‘나를 유다, 곧 내 조상들의 무덤의 성읍으로 보내어’라는 목적지를 직접 연결하며, 초안의 ‘보내시어 … 가게 하셔서’는 ‘가게 하다’를 덧붙여 다소 우회적입니다. 또한 각주 c(‘다시 세우다’)의 표지가 지시 대상인 동사 대신 ‘성읍’ 구절 뒤에 붙어 있고, b와 c의 순서도 뒤바뀌어 있습니다.
  naturalness: 합쇼체와 청원문의 격식은 적절합니다. 그러나 ‘왕께서 좋게 여기시면, 또한 왕의 종인 제가 왕 앞에서’는 ‘왕’의 반복과 접속이 다소 무겁습니다. ‘왕께서 좋게 여기시고, 왕의 종인 제가 왕 앞에서 은혜를 입었다면’으로 다듬으면 궁정 청원의 공손함과 현대 한국어의 흐름을 함께 살릴 수 있습니다.
