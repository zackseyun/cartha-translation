base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
  footnotes:
  - marker: a
    text: Or 'was examining' or 'was surveying' the wall. The Hebrew verb here normally means 'breaking,' but in this context it is widely understood to describe Nehemiah's inspection of the damaged wall.
    reason: lexical_alternative
  - marker: b
    text: '''Wadi'' refers to a ravine or seasonal watercourse; some translations render it ''valley'' or ''brook.'''
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 저는 밤에 골짜기[b]를 따라 올라가 성벽을 살펴보았습니다[a]. 그리고 돌아서 골짜기 성문으로 들어가서 돌아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 שבר는 보통 ‘부수다’를 뜻하지만, 여기서는 성벽을 야간에 점검·시찰하는 뜻으로 널리 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘골짜기’는 히브리어 נחל의 지형적 의미를 반영한 번역입니다. 경우에 따라 ‘와디’ 또는 ‘시내’로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלֶה בַנַּחַל לַיְלָה
  english_pob_choice: went up by the wadi at night
  chosen_korean: 밤에 나흘을 따라 올라가
  alternatives_korean:
