  text: וָ/אֱהִ֨י עֹלֶ֤ה בַ/נַּ֨חַל֙ לַ֔יְלָה וָ/אֱהִ֥י שֹׂבֵ֖ר בַּ/חוֹמָ֑ה וָ/אָשׁ֗וּב וָ/אָב֛וֹא בְּ/שַׁ֥עַר הַ/גַּ֖יְא וָ/אָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
  footnotes:
  - marker: a
    text: Or 'was examining' or 'was surveying' the wall. The Hebrew verb here normally means 'breaking,' but in this context it is widely understood to describe Nehemiah's inspection of the damaged wall.
    reason: lexical_alternative
  - marker: b
    text: '''Wadi'' refers to a ravine or seasonal watercourse; some translations render it ''valley'' or ''brook.'''
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 저는 밤에 나흘을 따라 올라가 성벽을 살펴보았습니다[a]. 그리고 돌아서서 골짜기 문으로 들어갔다가 다시 돌아왔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 שבר는 보통 ‘부수다’를 뜻하지만, 여기서는 성벽을 야간에 점검·시찰하는 뜻으로 널리 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘골짜기’는 히브리어 נחל의 지형적 의미를 반영한 번역입니다. 경우에 따라 ‘와디’ 또는 ‘시내’로도 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלֶה בַנַּחַל לַיְלָה
  english_pob_choice: went up by the wadi at night
  chosen_korean: 밤에 나흘을 따라 올라가
  alternatives_korean:
  - 밤에 골짜기를 따라 올라가
  - 밤에 와디를 따라 올라가
  - 밤에 시내를 따라 올라가
  lexicon: HALOT
  rationale: נחל은 여기서 하천이 마르는 와디/골짜기 길을 가리키므로, 지형 감각을 살려 ‘나흘을 따라’로 옮기고 시간 부사 ‘밤에’를 앞에 두었습니다.
- source_word: שֹׂבֵר בַּחוֹמָה
  english_pob_choice: inspected the wall
  chosen_korean: 성벽을 살펴보았습니다
  alternatives_korean:
  - 성벽을 검사했습니다
  - 성벽을 조사했습니다
  - 성벽을 점검했습니다
  lexicon: HALOT
  rationale: שבר는 기본적으로 ‘부수다’이지만 이 문맥에서는 네헤미야의 야간 점검/시찰을 뜻하므로, 영어 POB의 ‘inspected’에 맞춰 ‘살펴보다’로 자연스럽게 풀었습니다.
- source_word: שַׁעַר הַגַּיְא
  english_pob_choice: the Valley Gate
  chosen_korean: 골짜기 문
  alternatives_korean:
  - 계곡 문
  - 골짜기 성문
  - 개울 문
  lexicon: HALOT
  rationale: שַׁעַר הַגַּיְא는 예루살렘의 고유 지명인 ‘Valley Gate’이므로, 한국어에서도 관용적으로 이해되는 ‘골짜기 문’으로 옮겼습니다.
- source_word: וָאָשׁוּב ... וָאָשׁוּב
  english_pob_choice: turned back ... returned
  chosen_korean: 돌아서서 ... 다시 돌아왔습니다
  alternatives_korean:
  - 되돌아가서 ... 돌아왔습니다
  - 돌아가서 ... 돌아왔습니다
  - 되돌아서서 ... 다시 돌아왔습니다
  lexicon: HALOT
  rationale: 동일한 שוב가 두 번 나오므로 첫 번째는 동선의 전환을 드러내는 ‘돌아서서’, 마지막은 서술을 맺는 ‘다시 돌아왔습니다’로 구분해 반복의 미묘한 차이를 살렸습니다.
