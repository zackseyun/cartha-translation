base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
  footnotes:
  - marker: a
    text: Or 'I had told no one.' The Hebrew says literally 'I had not told any man.'
    reason: lexical_alternative
  - marker: b
    text: Or 'what my God had put into my heart' or 'what my God was prompting in my heart.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'animal' (or 'beast'), a general term for a riding animal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 나는 밤에 일어났으며, 나와 함께한 사람은 몇 사람뿐이었습니다. 나는 하나님께서 내가 예루살렘을 위하여 행하도록 내 마음에 두고 계신 일을 아무에게도 알리지 않았습니다.[a][b] 내가 타고 있던 짐승 외에는 나와 함께한 짐승이 없었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 아무 사람에게도 알리지 않았습니다.’ 히브리어는 문자적으로 ‘나는 한 사람에게도 알리지 않았다’라고 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘하나님께서 내 마음에 두신 일’ 또는 ‘하나님께서 내 마음속에 일으키신 뜻’.
    reason: alternative_reading
  - marker: c
    text: 히브리어 ‘짐승’은 타는 데 쓰이는 짐승을 포함하는 일반적인 말입니다.
    reason: lexical_alternative
