base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
  footnotes:
  - marker: a
    text: Hebrew literally, 'the house of the tombs of my fathers,' an idiom referring to the place associated with his ancestors’ burial.
    reason: lexical_alternative
translation:
  language: ko
  text: 제가 왕께 아뢰었습니다. “왕이여, 만세를 누리소서! 어찌하여 내 얼굴이 슬퍼하지 않겠습니까? 내 조상들의 무덤의 곳인 그 성이 무너져 있고, 그 성문들이 불에 타 버렸으니 말입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘내 조상들의 무덤의 집’이지만, 조상 묘역을 가리키는 관용으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: I said
  chosen_korean: 제가 … 아뢰었습니다
  alternatives_korean:
  - 제가 … 말했습니다
  - 제가 … 여쭈었습니다
  lexicon: HALOT
  rationale: 궁정에서 왕에게 직접 말하는 장면이므로 단순한 ‘말했습니다’보다 존대가 분명한 ‘아뢰었습니다’가 문맥에 더 잘 맞습니다.
- source_word: לְעוֹלָם יִחְיֶה
  english_pob_choice: May the king live forever!
  chosen_korean: 왕이여, 만세를 누리소서!
  alternatives_korean:
  - 왕이여, 영원히 사소서!
  - 왕이여, 오래 사소서!
  lexicon: HALOT
  rationale: 히브리어의 왕에게 드리는 상투적 축원식을 한국어 궁정 예법에 가까운 ‘만세를 누리소서’로 옮겨 원문의 경어와 축원성을 살렸습니다.
- source_word: לֹא יֵרְעוּ פָנַי
  english_pob_choice: should my face not be sad
  chosen_korean: 내 얼굴이 슬퍼하지 않겠습니까
  alternatives_korean:
  - 내 얼굴이 근심스럽지 않겠습니까
  - 내 얼굴이 침울하지 않겠습니까
  lexicon: HALOT
  rationale: ‘얼굴’과 결합한 감정 표현을 그대로 살리되, 현대 한국어에서 자연스러운 ‘슬퍼하다’로 옮겨 외적 표정과 내적 상태를 함께 드러냈습니다.
- source_word: בֵּית קִבְרוֹת אֲבֹתַי
  english_pob_choice: the place of my fathers’ tombs
  chosen_korean: 내 조상들의 무덤의 곳인 그 성
  alternatives_korean:
  - 내 조상들의 무덤의 장소인 성
  - 내 조상들의 묘가 있는 곳인 성
  lexicon: HALOT
  rationale: 직역하면 ‘무덤의 집’이지만, 영어 POB의 주석처럼 조상 묘역을 가리키는 관용이므로 한국어에서는 ‘무덤의 곳’으로 의미를 드러내면서 뒤의 ‘그 성’과 연결해 자연스럽게 만들었습니다.
- source_word: אֻכְּלוּ בָאֵשׁ
  english_pob_choice: have been consumed by fire
  chosen_korean: 불에 타 버렸으니
  alternatives_korean:
  - 불에 삼켜졌으니
  - 불에 소모되었으니
  lexicon: HALOT
  rationale: 불이 ‘먹어 버리다’는 이미지가 한국어에서는 ‘타 버리다’가 가장 자연스럽게 대응하므로, 파괴의 결과를 간명하게 살렸습니다.
theological_decisions:
- issue: 왕 앞에서의 존대 표현과 직접 인용 내부의 발화 높임
  chosen_reading: 서술은 합쇼체로 유지하고, 왕에게 드리는 축원은 ‘만세를 누리소서’처럼 높은 공손 표현으로 옮겼습니다.
  alternative_readings:
  - 서술 전체를 평서형으로 낮춤
  - ‘영원히 사소서’ 같은 더 직역적인 축원
  rationale: 본문은 궁정 예절과 청원 장면이므로, 한국어에서도 화행의 높임을 분명히 해야 원문의 사회적 긴장이 보존됩니다.
  doctrine_reference: 문맥적 화용론
