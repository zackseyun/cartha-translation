  source_fidelity: 본문은 히브리어의 서술 순서와 핵심 의미를 대체로 충실히 옮깁니다. 다만 עֵבֶר הַנָּהָר는 단순한 방향 표현인 동시에 페르시아의 행정 구역 명칭으로 기능하므로, 해당 표현에 문화 주석을 직접 연결하는 것이 적절합니다. וַיִּשְׁלַח עִמִּי는 왕이 느헤미야와 함께 호위 인원을 보냈다는 뜻이며, 어순을 조정하면 이를 더 분명히 할 수 있습니다.
  naturalness: ‘왕은 이미 나와 함께 군 지휘관들과 기병을 보냈습니다’도 이해되지만, 목적어를 먼저 두고 ‘나와 함께 보냈습니다’로 마무리하면 현대 한국어에서 수식 관계가 더 명료하고 자연스럽습니다. ‘전하였습니다’는 공식 서한의 전달을 나타내기에 적절합니다.
  terminology: ‘총독들’, ‘서한’, ‘군 지휘관들’, ‘기병’은 문맥과 합쇼체 문체에 알맞습니다. 다만 문화 주석 a는 본문과 동일한 문구를 ‘또는’으로 제시하고 있어 실질적인 대안이 아니며, 문화 주석으로 고쳐야 합니다. 주석 표지도 각각 관련 어구에 붙여야 합니다.
