source:
  edition: WLC
  text: וָֽ/אָב֗וֹא אֶֽל פַּֽחֲווֹת֙ עֵ֣בֶר הַ/נָּהָ֔ר וָ/אֶתְּנָ֣/ה לָ/הֶ֔ם אֵ֖ת אִגְּר֣וֹת הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֤ח עִמִּ/י֙ הַ/מֶּ֔לֶךְ שָׂ֥רֵי חַ֖יִל וּ/פָרָשִֽׁים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
  footnotes:
  - marker: a
    text: Or “to the governors Beyond the River.” The Hebrew expression likely refers to the Persian administrative region west of the Euphrates, often called Trans-Euphrates.
    reason: cultural_note
  - marker: b
    text: Or “military officers and cavalry.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 나는 강 건너편[a] 총독들에게 가서 왕의 서한을 그들에게 전하였습니다. 왕은 이미 군 지휘관들과 기병을 나와 함께 보냈습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘강 건너편’은 보통 유프라테스강 서쪽의 페르시아 행정 구역을 가리키는 명칭으로 이해됩니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘군사 지휘관들과 기병대’.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחֲווֹת
  english_pob_choice: governors
  chosen_korean: 총독들
  alternatives_korean:
  - 관원들
  - 지방 총독들
  lexicon: HALOT
  rationale: 페르시아 제국의 행정 책임자를 가리키므로, 한국어에서는 역사적 행정 직함인 ‘총독들’이 가장 자연스럽고 의미도 분명합니다.
- source_word: עֵבֶר הַנָּהָר
  english_pob_choice: Beyond the River
  chosen_korean: 강 건너편
  alternatives_korean:
  - 강 건너
  - 유프라테스 건너편
  lexicon: HALOT
  rationale: 직역하면 ‘강 건너편’이지만, 이 표현은 단순한 지리 묘사보다 제국 행정 구역 명칭의 기능이 있으므로 문맥상 자연스럽게 살리되 과도한 해설은 넣지 않았습니다.
- source_word: אִגְּרוֹת
  english_pob_choice: letters
  chosen_korean: 서한
  alternatives_korean:
  - 편지들
  - 공문서들
  lexicon: HALOT
  rationale: 왕의 공식 서신이라는 맥락을 반영해 일상적인 ‘편지’보다 격식 있는 ‘서한’을 택했습니다.
- source_word: שָׂרֵי חַיִל וּפָרָשִׁים
  english_pob_choice: army officers and horsemen
  chosen_korean: 군 지휘관들과 기병
  alternatives_korean:
  - 군대 장교들과 말 탄 사람들
  - 군사 장관들과 기병대
  lexicon: HALOT
  rationale: ‘군 지휘관들’은 שָׂרֵי חַיִל의 지휘자 의미를, ‘기병’은 פָרָשִׁים의 무장한 기마 전력을 간결하게 드러냅니다.
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  english_pob_choice: the king had sent with me
  chosen_korean: 왕은 이미 나와 함께 … 보냈습니다
  alternatives_korean:
  - 왕은 나와 함께 … 보냈습니다
  - 왕이 나와 함께 … 보낸 상태였습니다
  lexicon: HALOT
  rationale: 배경 설명 역할을 하는 동작을 한국어에서는 ‘이미’로 풀어, 왕의 호송 조치가 앞서 있었음을 자연스럽게 나타냈습니다.
theological_decisions:
- issue: 재량적 해설 없이 페르시아 행정 구역명 보존
  chosen_reading: ‘강 건너편’으로 옮기되 본문 안에서는 지명 설명을 늘리지 않고, 공식 행정 구역이라는 뉘앙스는 문맥으로 유지합니다.
  alternative_readings:
  - ‘유프라테스 강 건너편’
  - ‘강 건너편 지역’
  rationale: 본문은 지리적 방향성보다 제국 행정 구역을 암시하지만, 한국어 본문에 설명을 과도하게 주입하면 서술 흐름이 무거워질 수 있어 본문은 간결하게 유지했습니다.
  doctrine_reference: 성경 번역의 문맥 보존과 과잉 해설 최소화
