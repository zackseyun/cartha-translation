  rationale: 문자적 ‘마음의 악함/나쁨’이 아니라 내적 괴로움을 뜻하므로, 도덕적 악의 뉘앙스를 피하면서 감정 상태를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 병듦과 내적 슬픔을 대비하는 왕의 진단
  chosen_reading: 왕은 표정의 변화가 육체적 병이 아니라 내적 슬픔에서 비롯된 것이라고 분별합니다.
  alternative_readings:
  - 단순한 건강 문제로 보지 않았다고만 옮길 수 있음
  - ‘마음의 악함’으로 직역해 도덕적 판단처럼 읽을 수 있음
  rationale: 원문은 병과 마음의 상태를 대조하여 네헤미야의 두려움 직전에 있는 심리적 압박을 드러내므로, 이를 그대로 살려야 서술의 긴장이 유지됩니다.
  doctrine_reference: 본문 주해상 대조 구조와 내적 상태 묘사
