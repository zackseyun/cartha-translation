  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
  footnotes:
  - marker: a
    text: Hebrew literally, 'your face is bad'—an idiom for a sad or troubled expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'sorrow of heart' or 'trouble of heart'; Hebrew literally, 'evil/badness of heart,' here referring to inner distress rather than moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 제게 말했습니다. “그대의 얼굴이[a] 어찌하여 슬픕니까? 그대가 병든 것도 아닌데 말입니다. 이것은 마음의 슬픔[b]일 뿐입니다.” 그러자 나는 몹시 두려웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그대의 얼굴이 나쁘다’라는 뜻의 관용구로, 슬프거나 근심 어린 표정을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘마음의 악/나쁨’이지만, 여기서는 도덕적 악이 아니라 내적 슬픔이나 괴로움을 뜻합니다.
    reason: lexical_alternative
