source:
  edition: WLC
  text: וָ/אוֹמַר֮ לַ/מֶּלֶךְ֒ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב אִגְּרוֹת֙ יִתְּנוּ לִ֔/י עַֽל פַּחֲו֖וֹת עֵ֣בֶר הַ/נָּהָ֑ר אֲשֶׁר֙ יַעֲבִיר֔וּ/נִי עַ֥ד אֲשֶׁר אָב֖וֹא אֶל יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
  footnotes:
  - marker: a
    text: Or “If it pleases the king.”
    reason: lexical_alternative
  - marker: b
    text: “Beyond the River” is the Persian administrative term for the region west of the Euphrates.
    reason: cultural_note
  - marker: c
    text: Or “that they may grant me passage.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 제가 왕에게 말했습니다. 「왕께서 좋게 여기시면, 저를 위해 강 건너편 총독들에게 주실 서한을 내리셔서, 그들이 제가 유다에 이를 때까지 저를 통과하게 해 주십시오」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕께서 좋게 여기시면.”
    reason: alternative_reading
  - marker: b
    text: “강 건너편”은 유프라테스 강 서쪽 지역을 가리키는 페르시아 행정 명칭입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “저에게 통행을 허락하게 해 주십시오.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: Then I said
  chosen_korean: 그때 제가 말했습니다
  alternatives_korean:
  - 그리고 제가 말했습니다
  - 그때 제가 말씀드렸습니다
  lexicon: WLC / HALOT
  rationale: 서술 흐름을 자연스럽게 이어 주는 בעברית의 waw-consecutive를 한국어의 시간 부사구로 살렸고, 국왕에게의 보고이므로 1인칭은 공손한 평서로 처리했습니다.
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  english_pob_choice: If it pleases the king / If it seems good to the king
  chosen_korean: 왕께서 좋게 여기시면
  alternatives_korean:
  - 왕께서 기쁘게 여기시면
  - 왕께서 좋다고 여기시면
  lexicon: WLC / HALOT
  rationale: 이 표현은 궁정 예절 공식이므로 직역보다 한국어 관용에 맞는 공손한 요청문으로 옮겼습니다. '좋게 여기시면'은 왕의 판단을 존중하는 뉘앙스를 잘 유지합니다.
- source_word: אִגְּרוֹת
  english_pob_choice: letters
  chosen_korean: 서한
  alternatives_korean:
  - 편지
  - 공문
  lexicon: WLC / HALOT
  rationale: 여기서는 단순한 사적 편지보다 왕의 권위를 동반한 공적 문서이므로 '서한'이 더 적절합니다.
- source_word: פַּחֲוֹת עֵבֶר הַנָּהָר
  english_pob_choice: the governors Beyond the River
  chosen_korean: 강 건너편 총독들
  alternatives_korean:
  - 유브라데 강 건너편의 총독들
  - 강 건너편의 총독들
  lexicon: WLC / HALOT
  rationale: פַּחֲוֹת은 페르시아 행정관을 가리키므로 '총독들'로 옮겼고, עֵבֶר הַנָּהָר는 고유 행정 구역명보다 의미를 드러내는 '강 건너편'으로 처리했습니다.
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  english_pob_choice: so that they may let me pass through
  chosen_korean: 저를 통과하게 해 주십시오
  alternatives_korean:
  - 저를 지나가게 해 주십시오
  - 저에게 통행을 허락해 주십시오
  lexicon: WLC / HALOT
  rationale: 동사의 사역적 의미를 살려 통행 허가의 맥락이 분명한 표현으로 옮겼습니다. 한국어에서는 '통과하게 해 주십시오'가 가장 자연스럽습니다.
- source_word: יְהוּדָה
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유대
  - 유다 땅
  lexicon: WLC / HALOT
  rationale: 지명 고유명사는 본래형에 가깝게 '유다'로 옮겼습니다. '유대'는 시대감이 달라지고, '유다 땅'은 원문에 없는 보충입니다.
theological_decisions:
- issue: 왕에게 올리는 청원문의 공손한 표현
  chosen_reading: 직접 인용문 안에서도 왕에게는 높임말을 유지하고, 요청 동사는 공손한 청유형으로 처리했습니다.
  alternative_readings:
  - 평서형으로만 옮겨 더 중립적으로 처리
  - '''말씀드렸습니다''처럼 더 강한 겸양어 사용'
  rationale: 이 구절은 신학적 난점보다 궁정 예절의 재현이 핵심입니다. 원문의 정중한 청원 분위기를 한국어의 높임말로 반영해야 독자가 장면의 긴장과 예의를 함께 이해할 수 있습니다.
  doctrine_reference: 서술체/화행 적합성
