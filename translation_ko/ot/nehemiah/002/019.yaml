  text: וַ/יִּשְׁמַע֩ סַנְבַלַּ֨ט הַ/חֹרֹנִ֜י וְ/טֹבִיָּ֣ה הָ/עֶ֣בֶד הָֽ/עַמּוֹנִ֗י וְ/גֶ֨שֶׁם֙ הָֽ/עַרְבִ֔י וַ/יַּלְעִ֣גוּ לָ֔/נוּ וַ/יִּבְז֖וּ עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים הַ/עַ֥ל הַ/מֶּ֖לֶךְ אַתֶּ֥ם מֹרְדִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite slave, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
  footnotes:
  - marker: a
    text: Or “Tobiah the Ammonite servant”; some take the designation more broadly as an official title.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 산발랏 호론 사람과 암몬 사람 노예 도비야와 아라비아 사람 게셈이 듣고는 우리를 조롱하고 우리를 업신여기며 말했습니다. 「이것이 너희가 하는 일이냐? 너희가 왕을 거역하고 있는 것이냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘노예’는 여기서 신분을 드러내는 번역입니다. 일부는 이를 더 넓게 ‘관리’나 ‘종’으로 이해하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 종신
  - 사환
  lexicon: HALOT
  rationale: 영어 POB가 본문에서 bonded status를 드러내기 위해 slave를 채택한 점을 따라, 한국어도 전통적 교회어인 ‘종’보다 더 직접적인 ‘노예’로 옮겨 본문의 긴장을 보존했습니다.
- source_word: הַחֹרֹנִי
  english_pob_choice: the Horonite
  chosen_korean: 호론 사람
  alternatives_korean:
  - 호로나 사람
  - 호론 출신
  lexicon: HALOT
  rationale: 지명/출신을 나타내는 Gentilic을 한국어에서 자연스럽게 풀어 ‘호론 사람’으로 옮겨, 인명에 붙은 식별 표지를 유지했습니다.
- source_word: וַיַּלְעִגוּ לָנוּ / וַיִּבְזוּ עָלֵינוּ
  english_pob_choice: they mocked us and despised us
  chosen_korean: 우리를 조롱하고 우리를 업신여기며
  alternatives_korean:
  - 우리를 비웃고 우리를 멸시하며
  - 우리를 희롱하고 우리를 경멸하며
  lexicon: HALOT
  rationale: 두 동사의 의미를 중복 없이 단계적으로 살려, 단순한 ‘웃음’이 아니라 공개적 조롱과 경멸의 강도를 드러냈습니다.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  english_pob_choice: What is this thing that you are doing?
  chosen_korean: 이것이 너희가 하는 일이냐?
  alternatives_korean:
  - 이것이 너희가 하고 있는 일이냐?
  - 너희가 하는 이 일이 무엇이냐?
  lexicon: HALOT
  rationale: 히브리어의 직설적인 질의 구조를 유지하되, 한국어에서 자연스러운 의문문으로 압축하여 수사적 공격성을 살렸습니다.
theological_decisions:
- issue: 대상의 호칭에서 ‘노예’ 사용 여부
  chosen_reading: 도비야의 신분/예속성을 드러내기 위해 ‘노예’를 본문에 유지했습니다.
  alternative_readings:
  - 종
  - 시종
  - 관리
  rationale: 본문의 הָעֶבֶד는 단순한 예의적 호칭보다 예속된 지위를 강하게 시사하므로, 이를 완화하지 않고 독자가 원문의 불편함과 역사성을 그대로 보도록 했습니다.
  doctrine_reference: Translation philosophy §1; contested bonded-status terminology policy
