  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אַגִּ֨יד לָ/הֶ֜ם אֶת יַ֣ד אֱלֹהַ֗/י אֲשֶׁר הִיא֙ טוֹבָ֣ה עָלַ֔/י וְ/אַף דִּבְרֵ֥י הַ/מֶּ֖לֶךְ אֲשֶׁ֣ר אָֽמַר לִ֑/י וַ/יֹּֽאמְרוּ֙ נָק֣וּם וּ/בָנִ֔ינוּ וַ/יְחַזְּק֥וּ יְדֵי/הֶ֖ם לַ/טּוֹבָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
  footnotes:
  - marker: a
    text: Or, 'was favorable to me' or 'was gracious toward me.' The Hebrew literally says, 'was good upon me.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'Let us arise and build.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'they strengthened their hands for good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나는 그들에게 내 하나님이 내게 좋으셨던 손과[a] 왕이 내게 한 말씀도 말했습니다. 그러자 그들이[b][c] “일어나 건축합시다.” 하고 말했습니다. 그리고 그들은 선한 일에[?] 손을 강하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 위에 좋았다’입니다. 이 표현은 하나님의 호의/은혜를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘일어나서 건축합시다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그들이 선을 위해 그들의 손을 강하게 했다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד אֱלֹהַי
  english_pob_choice: the hand of my God
  chosen_korean: 내 하나님이 내게 좋으셨던 손
  alternatives_korean:
  - 내 하나님의 손
  - 내 하나님이 내게 베푸신 은혜
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 비유를 살리면서, POB의 ‘was good upon me’에 맞춰 ‘내게 좋으셨던’으로 옮겨 하나님의 सक्रिय한 개입을 드러냈습니다.
- source_word: וְאַף דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  english_pob_choice: the words of the king that he had spoken to me
  chosen_korean: 왕이 내게 한 말씀
  alternatives_korean:
  - 왕이 내게 말한 것
  - 왕의 말
  lexicon: HALOT
  rationale: ‘말씀들’을 자연스러운 한국어로 압축하되, 왕의 발화가 실제로 전달된 내용이라는 점은 유지했습니다.
- source_word: נָקוּם וּבָנִינוּ
  english_pob_choice: Let us rise up and build
  chosen_korean: 일어나 건축합시다
  alternatives_korean:
  - 일어나서 건축합시다
  - 일어나서 세웁시다
  lexicon: HALOT
  rationale: 공동체적 결의의 촉구를 한국어 청유형으로 옮겼고, ‘build’를 본문 흐름에 맞게 ‘건축하다’로 직역했습니다.
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  english_pob_choice: they strengthened their hands
  chosen_korean: 손을 강하게 했습니다
  alternatives_korean:
  - 손을 굳게 했습니다
  - 용기를 냈습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 보존하여, ‘손’을 버리지 않고 그대로 살렸습니다.
theological_decisions:
- issue: יַד אֱלֹהַי의 신학적 비유 유지
  chosen_reading: 하나님의 ‘손’을 그대로 보존해, 하나님의 실제적인 개입과 호의를 동시에 드러내도록 했습니다.
  alternative_readings:
  - 하나님의 은혜
  - 하나님의 호의
  rationale: 본문은 성공의 원인을 하나님의 작용과 왕의 말 모두에 둡니다. 비유를 풀어버리면 신학적 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘let us rise up and build’의 공동체적 청유
  chosen_reading: 공동 결심을 드러내는 청유형(‘일어나 건축합시다’)으로 옮겼습니다.
  alternative_readings:
  - 일어나서 건축하십시오
  - 우리가 일어나 건축하겠습니다
  rationale: 문맥상 명령이 아니라 함께 시작하자는 결의의 표현이므로 청유형이 가장 적절합니다.
  doctrine_reference: Translation philosophy §1
