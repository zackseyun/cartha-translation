  text: Then the king said to me, “What is it that you are seeking?” So I prayed to the God of heaven.
translation:
  language: ko
  text: 그러자 왕이 저에게 말했습니다. “무엇을 원하십니까?” 그래서 저는 하늘의 하나님께 기도드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל מַה זֶּה אַתָּה מְבַקֵּשׁ
  english_pob_choice: What is it that you are seeking?
  chosen_korean: “무엇을 찾고 있습니까?”
  alternatives_korean:
  - “무엇을 구하고 있습니까?”
  - “무엇을 찾고 있습니까?”
  lexicon: מְבַקֵּשׁ
  rationale: 문맥상 왕이 느헤미야의 ‘요청’ 대상보다 ‘찾는 것/원하는 것’을 묻는 말이므로, POB의 최신 선택을 따라 ‘찾고 있습니까?’로 자연스럽게 옮겼습니다.
- source_word: וָאֶתְפַּלֵּל
  english_pob_choice: So I prayed
  chosen_korean: 그래서 저는 기도드렸습니다
  alternatives_korean:
  - 그리하여 저는 기도했습니다
  - 그래서 저는 기도했습니다
  lexicon: וָאֶתְפַּלֵּל
  rationale: 완료형 서술을 한국어 서사체로 옮기되, 하나님께 드리는 행위를 분명히 하도록 ‘기도드렸습니다’를 선택했습니다.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘에 계신 하나님
  - 하늘의 하나님
  lexicon: אֱלֹהֵי הַשָּׁמָיִם
  rationale: 히브리어 속격 구문을 직역하되, 한국어에서 자연스러운 신격 호칭인 ‘하늘의 하나님’으로 유지했습니다.
theological_decisions:
- issue: 느헤미야의 즉각적 기도 행위의 뉘앙스
  chosen_reading: 왕의 질문 직후 즉각적으로 하나님께 짧게 기도드린 것으로 반영했습니다.
  alternative_readings:
  - 마음속으로 기도한 것으로만 완곡하게 표현
  - 단순히 ‘기도했습니다’로 중립화
  rationale: 히브리어 완료형과 서사 문맥은 짧고 즉각적인 기도를 가리키며, 한국어에서도 그 긴박성과 의존성을 드러내는 것이 स्रोत 의미를 더 잘 살립니다.
  doctrine_reference: 서사 속 즉시 기도
