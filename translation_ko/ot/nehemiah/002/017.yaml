id: NEH.2.17
reference: Nehemiah 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אוֹמַ֣ר אֲלֵ/הֶ֗ם אַתֶּ֤ם רֹאִים֙ הָ/רָעָה֙ אֲשֶׁ֣ר אֲנַ֣חְנוּ בָ֔/הּ אֲשֶׁ֤ר יְרוּשָׁלִַ֨ם֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ נִצְּת֣וּ בָ/אֵ֑שׁ לְכ֗וּ וְ/נִבְנֶה֙ אֶת חוֹמַ֣ת יְרוּשָׁלִַ֔ם וְ/לֹא נִהְיֶ֥ה ע֖וֹד חֶרְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
  footnotes:
  - marker: a
    text: Or 'the distress' or 'the misery' for 'the trouble.' The Hebrew term can denote calamity or adversity rather than moral evil in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'Jerusalem is desolate.'
    reason: lexical_alternative
  - marker: c
    text: Or 'we will no longer be a disgrace' or 'an object of scorn.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 그들에게 말했습니다. 「여러분이 우리가 처한 재앙을 보고 있습니다. 예루살렘은 폐허가 되었고, 그 성문들은 불에 탔습니다. 오십시오. 예루살렘의 성벽을 다시 쌓읍시다. 그러면 우리가 더 이상 수치가 되지 않을 것입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘재앙’은 여기서 도덕적 악이 아니라 처참한 상황이나 곤경을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예루살렘은 황폐합니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘우리가 더 이상 수치가 되지 않을 것입니다’, ‘조롱거리가 되지 않을 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה
  english_pob_choice: the trouble
  chosen_korean: 재앙
  alternatives_korean:
  - 고난
  - 곤경
  - 불행
  lexicon: HALOT
  rationale: 이 문맥의 רָעָה는 도덕적 악이 아니라 공동체가 처한 참상과 위기이므로, '재앙'이 상황의 심각성을 살리면서도 윤리적 악의 뉘앙스를 피합니다.
- source_word: אֲשֶׁר אֲנַחְנוּ בָהּ
  english_pob_choice: we are in
  chosen_korean: 우리가 처한
  alternatives_korean:
  - 우리가 있는
  - 우리가 당한
  - 우리가 빠진
  lexicon: HALOT
  rationale: 현재 겪고 있는 상태를 자연스럽게 드러내는 한국어 관용으로 옮겨, 'in'의 상태 의미를 살렸습니다.
- source_word: חֲרֵבָה
  english_pob_choice: lies in ruins
  chosen_korean: 폐허가 되었고
  alternatives_korean:
  - 황폐해졌고
  - 무너져 있고
  - 황무지가 되었고
  lexicon: HALOT
  rationale: 도시의 물리적 붕괴를 간결하게 전달하면서, 예루살렘의 참상을 분명히 보여 주는 표현으로 옮겼습니다.
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  english_pob_choice: so that we may no longer be a reproach
  chosen_korean: 그러면 우리가 더 이상 수치가 되지 않을 것입니다
  alternatives_korean:
  - 그래서 우리가 더 이상 수치가 되지 않을 것입니다
  - 더 이상 치욕거리가 되지 않을 것입니다
  - 더 이상 조롱거리가 되지 않을 것입니다
  lexicon: HALOT
  rationale: חֶרְפָּה의 공개적 수치, 모욕, 조롱의 폭을 고려하되, 문맥상 공동체의 수치를 가장 자연스럽게 드러내는 '수치'를 선택했습니다.
theological_decisions:
- issue: 권유형 호소와 공동 결의의 뉘앙스
  chosen_reading: 「오십시오. … 다시 쌓읍시다」로 옮겨, לְכוּ의 호소와 וְנִבְנֶה의 공동 결의를 함께 살렸습니다.
  alternative_readings:
  - 가자
  - 가서 쌓읍시다
  - 오라, … 건축하자
  rationale: 본문은 단순 명령이 아니라 함께 행동하자는 촉구이므로, 한국어에서도 초대성과 연대성을 드러내는 표현이 적절합니다.
  doctrine_reference: 서사적 공동체 호소의 문맥 보존
- issue: 수치/치욕의 의미 범위
  chosen_reading: '''수치''를 사용해 공동체적 공개 망신의 의미를 담았습니다.'
  alternative_readings:
  - 치욕
  - 조롱거리
  - 불명예
  rationale: חֶרְפָּה는 단순 감정이 아니라 타자 앞에서 드러난 수치와 모욕을 포함하므로, '수치'가 가장 중립적이면서도 폭넓은 의미를 유지합니다.
  doctrine_reference: 공동체적 수치 개념
