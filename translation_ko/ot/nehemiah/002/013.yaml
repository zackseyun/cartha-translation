reference: Nehemiah 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֵצְאָ֨/ה בְ/שַֽׁעַר הַ/גַּ֜יא לַ֗יְלָה וְ/אֶל פְּנֵי֙ עֵ֣ין הַתַּנִּ֔ין וְ/אֶל שַׁ֖עַר הָ/אַשְׁפֹּ֑ת וָ/אֱהִ֨י שֹׂבֵ֜ר בְּ/חוֹמֹ֤ת יְרוּשָׁלִַ֨ם֙ אֲשֶׁר ה/מפרוצים וּ/שְׁעָרֶ֖י/הָ אֻכְּל֥וּ בָ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
  footnotes:
  - marker: a
    text: Or 'Serpent Spring' or 'Jackal Spring'; the Hebrew place name uses tannin, a term with a range including dragon, serpent, or similar creature.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression traditionally rendered 'I viewed' is literally more difficult; here it is understood in context as 'I was inspecting' the damaged walls.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나는 밤에 골짜기 문[a]으로 나가서 용 샘과 배설물 문[b]을 향해 갔습니다. 그리고 나는 무너진 예루살렘의 성벽과 불에 타 버린 그 성문들을 살펴보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 지명은 tannin을 사용하며, 이는 용·뱀·유사한 괴물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 전통적으로 ‘보았다’로 옮겨지지만, 문맥상 여기서는 무너진 성벽을 면밀히 살펴보는 뜻으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  english_pob_choice: So I went out
  chosen_korean: 그래서 나는 나갔습니다
  alternatives_korean:
  - 그리고 나는 나갔습니다
  - 그때 나는 나갔습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 잇는 wayyiqtol로 이해하여, 한국어에서도 결과·전개를 나타내는 ‘그래서’로 이어 주었습니다.
- source_word: בְּשַׁעַר הַגַּיְא
  english_pob_choice: through the Valley Gate
  chosen_korean: 골짜기 문
  alternatives_korean:
  - 골짜기 문을 지나
  - 계곡 문
  lexicon: HALOT
  rationale: 문 이름은 고유 지명으로 처리해 ‘골짜기 문’으로 옮겼고, 이동 동사는 뒤 문맥에서 이미 충분히 드러나므로 간결하게 유지했습니다.
- source_word: עֵין הַתַּנִּין
  english_pob_choice: the Dragon Spring
  chosen_korean: 용 샘
  alternatives_korean:
  - 뱀 샘
  - 용·뱀 샘
  - 잭알 샘
  lexicon: HALOT
  rationale: עין은 ‘샘’이고, תנין은 ‘용/뱀/큰 괴물’ 범위를 가지므로 장소명에서는 뜻을 살려 ‘용 샘’으로 옮겼습니다.
- source_word: וָאֱהִי שֹׂבֵר
  english_pob_choice: I inspected
  chosen_korean: 나는 … 살펴보았습니다
  alternatives_korean:
  - 나는 … 조사했습니다
  - 나는 … 점검했습니다
  - 나는 … 보고 있었습니다
  lexicon: HALOT
  rationale: 문맥상 성벽의 훼손 상태를 면밀히 확인하는 행위이므로, 직역적 ‘부수다’보다 한국어에서 자연스럽고 문맥에 맞는 ‘살펴보다’를 택했습니다.
theological_decisions:
- issue: 성벽과 성문의 파괴 상태를 묘사하는 동사 선택
  chosen_reading: ‘무너진’과 ‘불에 타 버린’으로, 피해의 완결성과 참상을 분명히 드러냈습니다.
  alternative_readings:
  - ‘허물어진’과 ‘불타 버린’
  - ‘무너져 있던’과 ‘불에 타 버린’
  rationale: 히브리어 수동 분사와 완료적 표현이 도시 방어선의 실질적 파괴를 강조하므로, 약화하지 않고 상태의 결과를 분명히 드러냈습니다.
  doctrine_reference: 본문 서술의 역사적·문학적 사실성 보존
