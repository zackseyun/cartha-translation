lexical_decisions:
- source_word: וָ/אָב֖וֹא
  english_pob_choice: So I came
  chosen_korean: 그래서 제가 … 이르러
  alternatives_korean:
  - 그리고 제가 … 왔습니다
  - 그때 제가 … 이르렀습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술적 진행을 살리되, 현대 한국어에서는 사건의 다음 전개를 자연스럽게 잇는 ‘그래서’와 도착 의미의 ‘이르러’가 가장 무난합니다.
- source_word: אֶל יְרוּשָׁלִָ֑ם
  english_pob_choice: to Jerusalem
  chosen_korean: 예루살렘에
  alternatives_korean:
  - 예루살렘으로
  - 예루살렘 안으로
  lexicon: HALOT
  rationale: 목적지 표지 אֶל은 도착 지점을 가리키므로 한국어 조사 ‘-에’가 가장 직접적입니다.
- source_word: וָ/אֱהִי שָׁ֖ם
  english_pob_choice: and was there
  chosen_korean: 그곳에 있었습니다
  alternatives_korean:
  - 거기 있었습니다
  - 그곳에 머물렀습니다
  lexicon: HALOT
  rationale: היה는 여기서 단순 존재보다 체류의 지속을 나타내므로, ‘있었습니다’로 옮기되 장소를 분명히 하는 ‘그곳에’를 붙였습니다.
- source_word: יָמִ֥ים שְׁלֹשָֽׁה
  english_pob_choice: three days
  chosen_korean: 사흘 동안
  alternatives_korean:
  - 삼 일 동안
  - 사흘
  lexicon: HALOT
  rationale: 히브리어 기간 표현은 지속 기간을 뜻하므로 한국어의 자연스러운 기간 표현인 ‘사흘 동안’이 가장 적절합니다.
