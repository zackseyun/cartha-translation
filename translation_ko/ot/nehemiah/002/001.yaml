source:
  edition: WLC
  text: וַ/יְהִ֣י בְּ/חֹ֣דֶשׁ נִיסָ֗ן שְׁנַ֥ת עֶשְׂרִ֛ים לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ יַ֣יִן לְ/פָנָ֑י/ו וָ/אֶשָּׂ֤א אֶת הַ/יַּ֨יִן֙ וָ/אֶתְּנָ֣/ה לַ/מֶּ֔לֶךְ וְ/לֹא הָיִ֥יתִי רַ֖ע לְ/פָנָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
  footnotes:
  - marker: a
    text: Or, more formally, 'and I was not sad before him.' The Hebrew literally says 'I was not bad before him,' an idiom for appearing sad or displeased in the king's presence.
    reason: lexical_alternative
translation:
  language: ko
  text: 니산월, 곧 아닥사스다 왕 제이십년에 이런 일이 있었습니다. 왕 앞에 포도주가 있었을 때에, 나는 그 포도주를 들어 왕에게 드렸습니다. 나는 그 왕 앞에서 슬픈 기색을 보인 적이 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 좀 더 직역하면, ‘나는 그 앞에서 나쁘지 않았습니다’입니다. 히브리어의 ‘나쁘다’는 여기서 왕 앞에서 슬퍼 보이거나 불쾌한 기색을 보이는 것을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 그것은 … 일어났습니다
  alternatives_korean:
  - 그 일이 있었습니다
  - 그때 일어났습니다
  lexicon: WLC/HALOT
  rationale: 히브리어 wayyiqtol 서두의 서사 진행을 살리되, 한국어에서는 문맥상 자연스러운 사건 개시로 풀어 옮겼습니다.
- source_word: בְּחֹדֶשׁ נִיסָן
  english_pob_choice: in the month of Nisan
  chosen_korean: 니산월에
  alternatives_korean:
  - 니산월에
  - 니산월에 있는 때에
  lexicon: HALOT
  rationale: 달 이름은 음역하고, 히브리어의 달 표지를 한국어 관용에 맞게 간결하게 처리했습니다.
- source_word: יַיִן לְפָנָיו
  english_pob_choice: when wine was before him
  chosen_korean: 왕 앞에 포도주가 있었고
  alternatives_korean:
  - 왕 앞에 포도주가 있었고
  - 왕 앞에 포도주가 놓여 있었고
  lexicon: HALOT
  rationale: 직역하면 어색한 ‘before him’을 궁정 식탁 장면으로 살려 ‘왕 앞에’로 옮겼고, 동사 없는 절의 상황 제시를 자연스럽게 처리했습니다.
- source_word: וָאֶשָּׂא אֶת הַיַּיִן וָאֶתְּנָה לַמֶּלֶךְ
  english_pob_choice: I took up the wine and gave it to the king
  chosen_korean: 나는 그 포도주를 들어 왕에게 드렸습니다
  alternatives_korean:
  - 나는 그 포도주를 들어 왕에게 주었습니다
  - 나는 그 포도주를 집어 들어 왕에게 드렸습니다
  lexicon: HALOT
  rationale: ‘들다’는 נשא의 기본 동작을 살리고, 왕에게 건네는 궁정 예법을 고려해 ‘드렸습니다’를 택했습니다.
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  english_pob_choice: I had not been sad in his presence
  chosen_korean: 나는 그분 앞에서 전에는 슬퍼한 적이 없었습니다
  alternatives_korean:
  - 나는 그분 앞에서 슬퍼 보인 적이 없었습니다
  - 나는 그분 앞에서 우울한 적이 없었습니다
  lexicon: HALOT
  rationale: רַע의 문자값 ‘나쁘다’보다 관용적 의미인 ‘슬퍼 보이다/침울하다’를 반영하되, POB의 문맥 판단을 따라 ‘슬퍼한 적이 없다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 왕 앞에서의 표정/태도에 대한 관용구 해석
  chosen_reading: ‘그분 앞에서 전에는 슬퍼한 적이 없었습니다’로 옮겨, 단순 감정 상태가 아니라 왕 앞에서 드러나는 표정과 태도의 문제임을 살렸습니다.
  alternative_readings:
  - 그분 앞에서 슬퍼 보인 적이 없었습니다
  - 그분 앞에서 우울한 적이 없었습니다
  rationale: 히브리어는 문자적으로 ‘나쁘지 않았다’이지만, 문맥상 왕 앞에서의 침울한 기색을 가리키므로 그 뉘앙스를 드러내는 번역이 필요합니다.
  doctrine_reference: 문맥적 관용구 처리
