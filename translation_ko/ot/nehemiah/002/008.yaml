  text: וְ/אִגֶּ֡רֶת אֶל אָסָף֩ שֹׁמֵ֨ר הַ/פַּרְדֵּ֜ס אֲשֶׁ֣ר לַ/מֶּ֗לֶךְ אֲשֶׁ֣ר יִתֶּן לִ֣/י עֵצִ֡ים לְ֠/קָרוֹת אֶת שַׁעֲרֵ֨י הַ/בִּירָ֤ה אֲשֶׁר לַ/בַּ֨יִת֙ וּ/לְ/חוֹמַ֣ת הָ/עִ֔יר וְ/לַ/בַּ֖יִת אֲשֶׁר אָב֣וֹא אֵלָ֑י/ו וַ/יִּתֶּן לִ֣/י הַ/מֶּ֔לֶךְ כְּ/יַד אֱלֹהַ֖/י הַ/טּוֹבָ֥ה עָלָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
  footnotes:
  - marker: a
    text: Or 'the king’s park' or 'the king’s orchard'; the Hebrew pardes denotes a royal preserve or managed woodland.
    reason: lexical_alternative
  - marker: b
    text: Or 'the gates of the citadel.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'the house'; here likely referring to the temple.
    reason: lexical_alternative
  - marker: d
    text: Literally 'according to the good hand of my God upon me,' an idiom for God’s favorable providence.
    reason: cultural_note
translation:
  language: ko
  text: 또 왕의 숲을 관리하는 아삽에게 보낼 편지도 주십시오. 그가 성전에 속한 요새의 문들에 들보를 놓고, 성벽과 제가 들어갈 집을 짓는 데 쓸 목재를 제게 주게 해 주십시오. 왕께서는 제 하나님께서 제게 베푸신 선한 손길에 따라 제게 주셨습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 숲’은 왕실의 공원, 과수원, 또는 관리된 삼림지대를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성채의 문들’.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그 집에 속한 요새’입니다. 문맥상 ‘그 집’은 성전을 가리킵니다.
    reason: source_note
  - marker: d
    text: 직역하면 ‘제 하나님께서 제 위에 두신 선한 손에 따라’입니다. 이는 하나님의 호의로운 섭리를 나타내는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  english_pob_choice: a letter
  chosen_korean: 공문
  alternatives_korean:
  - 편지
  - 서한
  lexicon: HALOT
  rationale: 왕에게 요청하는 공식 문맥이므로 단순한 개인 서신보다 관청 문서의 성격을 살려 '공문'으로 옮겼습니다.
- source_word: שֹׁמֵר הַפַּרְדֵּס
  english_pob_choice: the keeper of the king’s forest
  chosen_korean: 왕의 숲을 맡은 사람
  alternatives_korean:
  - 왕의 정원을 맡은 사람
  - 왕의 수목원을 지키는 사람
  lexicon: HALOT
  rationale: פַּרְדֵּס는 관리되는 왕실 수목지/숲을 가리킬 수 있으므로, 목재 공급의 맥락을 살려 '왕의 숲'으로 옮겼습니다.
- source_word: לְקָרוֹת
  english_pob_choice: to make beams
  chosen_korean: 들보를 만들
  alternatives_korean:
  - 들보를 놓을
  - 보를 만들
  lexicon: HALOT
  rationale: 목재의 용도가 단순한 자재가 아니라 건축용 들보임을 드러내기 위해 '들보를 만들'로 옮겼습니다.
- source_word: אֲשֶׁר לַבַּיִת
  english_pob_choice: the fortress by the temple / the gates of the fortress by the temple
  chosen_korean: 그 집에 속한 요새
  alternatives_korean:
  - 성전에 속한 요새
  - 그 집의 요새
  lexicon: HALOT
  rationale: 문맥상 '집'은 성전을 가리키므로, 요새와 성전의 소속 관계를 풀어 '그 집에 속한 요새'로 옮겼습니다.
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלָי
  english_pob_choice: according to the good hand of my God upon me
  chosen_korean: 내 하나님이 나에게 베푸신 선한 손길대로
  alternatives_korean:
  - 내 하나님의 선한 손이 내 위에 있었기에
  - 내 하나님이 나를 도우신 선한 손길에 따라
  lexicon: HALOT
  rationale: '''손''의 은유를 유지하되 한국어에서 자연스럽게 읽히도록 ''베푸신 선한 손길''로 옮겨, 섭리의 뉘앙스를 보존했습니다.'
theological_decisions:
- issue: 하나님의 섭리를 나타내는 'good hand' 관용구
  chosen_reading: 손길이라는 비유를 살려, 사건의 성취를 하나님의 실제적 도우심으로 제시했습니다.
  alternative_readings:
  - 단순히 '하나님이 나를 도우셨습니다'
  - '''하나님의 은혜로'''
  rationale: 에스라-느헤미야에서 반복되는 관용구의 이미지와 신학적 밀도를 유지하기 위해 은유를 평면화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
