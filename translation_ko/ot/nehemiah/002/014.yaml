base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
  footnotes:
  - marker: a
    text: Or 'the Spring Gate.' The Hebrew word can denote a spring or fountain.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for the animal under me to pass,' referring to the animal Nehemiah was riding.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 나는 샘문[a]과 왕의 못으로 더 나아갔습니다. 그러나 내가 타고 있던 짐승[b]이 지나갈 곳이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עַיִן은 여기서 ‘샘’ 또는 ‘분수’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 아래에 있는 짐승’입니다. 이는 느헤미야가 타고 있던 동물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  english_pob_choice: Then I went on
  chosen_korean: 나아갔습니다
  alternatives_korean:
  - 지나갔습니다
  - 가서 지나갔습니다
  lexicon: HALOT
  rationale: 연속적인 이동을 나타내는 עבר를 한국어 서술문에서는 자연스럽게 '나아가다'로 옮겨, 단순 통과보다 이동의 진행성을 살렸습니다.
- source_word: שַׁעַר הָעַיִן
  english_pob_choice: the Fountain Gate
  chosen_korean: 샘문
  alternatives_korean:
  - 샘의 문
  - 샘문(파운틴 게이트)
  lexicon: HALOT
  rationale: עַיִן은 이 지형 문맥에서 '샘/분수'의 뜻이므로, 예루살렘 지명으로 자연스러운 '샘문'을 택했습니다.
- source_word: בְּרֵכַת הַמֶּלֶךְ
  english_pob_choice: the King’s Pool
  chosen_korean: 왕의 못
  alternatives_korean:
  - 왕의 연못
  - 왕의 수조
  lexicon: HALOT
  rationale: בְּרֵכָה는 물을 모아 둔 못/연못을 뜻하므로, 성경 지명에 익숙한 '왕의 못'이 가장 간결하고 정확합니다.
- source_word: לַבְּהֵמָה ... תַּחְתָּי
  english_pob_choice: for the animal under me to pass
  chosen_korean: 내 아래의 짐승이 지나갈 자리가
  alternatives_korean:
  - 내가 타고 있던 짐승이 지나갈 자리가
  - 내 아래의 짐승이 통과할 자리가
  lexicon: HALOT
  rationale: בהמה는 일반적으로 '짐승/가축'이지만, כאן에서는 느헤미야가 타고 있던 탈것을 가리키므로 문맥을 드러내되 '짐승'을 유지해 원문 표현을 보존했습니다.
