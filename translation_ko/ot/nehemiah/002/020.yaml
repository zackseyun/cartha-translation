translation:
  language: ko
  text: 그때 내가 그들에게 이렇게 대답했습니다. 「하늘의 하나님이 우리에게 형통하게 하실 것입니다.[a] 그리고 그의 종인 우리는 일어나 건축할 것입니다. 그러나 당신들에게는 예루살렘에서 몫도 권리도 기념도 없습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리에게 성공을 주실 것입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  english_pob_choice: The God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘 하나님
  - 하늘에 계신 하나님
  lexicon: HALOT
  rationale: 후기 포로기적 호칭의 관용성을 살리면서도 한국어에서 자연스러운 소유격 표현으로 옮겼습니다.
- source_word: יַצְלִיחַ לָנוּ
  english_pob_choice: will make us prosper
  chosen_korean: 우리에게 형통하게 하실 것입니다
  alternatives_korean:
  - 우리에게 성공을 주실 것입니다
  - 우리를 번성하게 하실 것입니다
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살리되, 건축 계획의 성취를 뜻하는 문맥에 맞게 '형통하다'를 사용했습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종인 우리는
  alternatives_korean:
  - 그의 종들은
  - 그의 노예인 우리는
  lexicon: HALOT
  rationale: 여기서는 하나님께 대한 소속과 충성을 말하는 표현이므로 '종'이 적절하며, 문장 흐름상 주어를 앞세워 자연스럽게 정리했습니다.
- source_word: אֵין חֵלֶק וּצְדָקָה וְזִכָּרוֹן
  english_pob_choice: no share or right or memorial
  chosen_korean: 몫도 권리도 기념도 없습니다
  alternatives_korean:
  - 몫도 주장도 기념도 없습니다
  - 몫도 정당한 권리도 기억도 없습니다
  lexicon: HALOT
  rationale: 세 항목의 병렬을 살리면서, צְדָקָה를 이 문맥의 법적·관계적 의미에 따라 '권리'로 옮겼습니다.
theological_decisions:
- issue: '''servants''의 한국어 처리'
  chosen_reading: 그의 종
  alternative_readings:
  - 그의 노예
  - 그의 하인
  rationale: 하나님께 속한 자들의 충성과 신분을 드러내는 표현으로, 이 구절에서는 '노예'보다 '종'이 더 정확하고 과도한 사회적 뉘앙스를 피합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1
- issue: 후반부 배제 선언의 어조
  chosen_reading: 당신들에게는 예루살렘에서 몫도 권리도 기념도 없습니다
  alternative_readings:
  - 당신들에게는 예루살렘에서 몫도 주장도 기념도 없습니다
  - 당신들은 예루살렘에서 아무 몫도, 권리도, 기억도 없습니다
  rationale: 원문의 단호한 배제와 공동체적 경계 설정을 유지해야 하므로, 완곡하게 약화하지 않고 직설적으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
