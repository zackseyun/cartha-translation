  source_fidelity: 초안은 언약적 결속, 저주와 맹세, 모세를 통한 율법 수여, 그리고 명령·규례·율례의 준수를 대체로 충실히 반영합니다. 그러나 ‘그 율법은 … 지키고 행하기로 한 것입니다’는 히브리어의 연속된 목적부정사(‘율법을 따라 살며 … 지키고 행하기 위해’)를 설명문으로 바꾸어 문장 관계를 흐립니다. 또한 יהוה אֲדֹנֵינוּ는 한국어 어순상 ‘우리 주 야훼’가 더 자연스럽고 정확합니다.
  naturalness: ‘저주와 맹세에 들어갔습니다’와 ‘율법대로 걸어가기로’는 직역의 흔적이 강합니다. ‘저주와 맹세 아래 들어가’ 및 ‘율법을 따라 살아가고’는 언약적 의미와 ‘걷다’의 행위 은유를 유지하면서 현대 한국어 합쇼체 문장으로 자연스럽습니다.
  terminology: ‘하나님의 율법’, ‘하나님의 종 모세’, ‘저주와 맹세’, ‘명령’, ‘규례’, ‘율례’는 적절합니다. יהוה는 프로젝트 방침대로 ‘야훼’로 유지하되, ‘우리 주 야훼’로 배열합니다. 각주 표지는 해당 표현 바로 뒤에 배치하여 독자가 각주의 대상을 분명히 알 수 있게 해야 합니다.
