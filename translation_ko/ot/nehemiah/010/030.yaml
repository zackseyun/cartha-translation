id: NEH.10.30
reference: Nehemiah 10:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַחֲזִיקִ֣ים עַל אֲחֵי/הֶם֮ אַדִּירֵי/הֶם֒ וּ/בָאִ֞ים בְּ/אָלָ֣ה וּ/בִ/שְׁבוּעָ֗ה לָ/לֶ֨כֶת֙ בְּ/תוֹרַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר נִתְּנָ֔ה בְּ/יַ֖ד מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֑ים וְ/לִ/שְׁמ֣וֹר וְ/לַ/עֲשׂ֗וֹת אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֲדֹנֵ֔י/נוּ וּ/מִשְׁפָּטָ֖י/ו וְ/חֻקָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
  footnotes:
  - marker: a
    text: Or 'bind themselves to their brothers, their nobles.' The Hebrew idiom can suggest attaching oneself firmly to the leading members of the community in covenant solidarity.
    reason: lexical_alternative
  - marker: b
    text: '''A curse and an oath'' refers to a self-maledictory covenant pledge: they swear obedience and accept covenant sanctions if they break it.'
    reason: cultural_note
  - marker: c
    text: Or 'which was given through Moses.' Literally, 'which was given by the hand of Moses.'
    reason: lexical_alternative
  - marker: d
    text: '''Judgments'' may also be rendered ''ordinances'' or ''rules''; ''statutes'' may also be rendered ''decrees.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 형제들과 그들의 귀족들과 함께 굳게 결속하여, 하나님의 율법대로 걸어가기로 저주와 맹세에 들어갔습니다. 그 율법은 하나님의 종 모세의 손을 통해 주어졌으며, 야훼 우리 주의 모든 명령과 그의 규례와 그의 율례를 지키고 행하기로 한 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저주와 맹세’는 언약 위반 시 자신에게 제재를 불러들이는 자기저주의 맹약을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘모세의 손을 통해’는 ‘모세를 매개로 하여’라는 히브리어 관용구를 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘규례’와 ‘율례’는 각각 משפט과 חק의 법적·제정적 뉘앙스를 구별하려는 번역입니다.
    reason: lexical_alternative
  - marker: d
    text: 이름 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  english_pob_choice: join with
  chosen_korean: 굳게 결속하여
  alternatives_korean:
  - 함께하게 되어
  - 붙어 있게 되어
  - 동맹하여
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘붙잡다’가 아니라 공동체 안에서 형제들과 귀족들에게 자신을 단단히 붙이는 언약적 결속을 뜻하므로, 그 긴밀함을 드러내는 표현을 택했습니다.
- source_word: אֲחֵיהֶם / אַדִּירֵיהֶם
  english_pob_choice: their brothers / their nobles
  chosen_korean: 자기 형제들 / 그들의 귀족들
  alternatives_korean:
  - 그들의 친족들 / 그들의 지도자들
  - 그들의 동족들 / 그들의 유력자들
  lexicon: HALOT
  rationale: 히브리어의 친족어와 사회적 지위 표현을 각각 살려, 공동체적 연대와 공적 지도층을 함께 보이도록 옮겼습니다.
- source_word: בְּאָלָה וּבִשְׁבוּעָה
  english_pob_choice: a curse and an oath
  chosen_korean: 저주와 맹세
  alternatives_korean:
  - 언약 저주와 맹세
  - 저주와 서약
  lexicon: HALOT
  rationale: ‘אָלָה’는 언약 위반 시 자기에게 저주를 불러들이는 맹약의 성격이 있지만, 한국어 본문에서는 기본어 ‘저주’를 유지하고 ‘맹세’로 짝을 이루어 문맥의 엄중함을 드러냈습니다.
- source_word: תּוֹרַת הָאֱלֹהִים
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 가르침
  - 하나님의 규범
  lexicon: HALOT
  rationale: 언약·법적 문맥에서는 תּוֹרָה를 ‘율법’으로 옮기는 것이 가장 자연스럽고, POB의 ‘law of God’와도 대응됩니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: given by the hand of Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세의 손으로
  - 모세를 통해
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘by the hand of’는 매개 전달을 뜻하므로, 직역의 이미지와 의미를 함께 살리는 표현을 택했습니다.
- source_word: עֶבֶד הָאֱלֹהִים
  english_pob_choice: the servant of God
  chosen_korean: 하나님의 종
  alternatives_korean:
  - 하나님의 일꾼
  - 하나님의 노예
  lexicon: HALOT
  rationale: 모세에 대한 관용적 호칭이므로 신분적 강도를 의도적으로 부각하는 ‘노예’보다, 한국어에서 확립된 존칭적 의미를 가진 ‘종’이 더 정확합니다.
- source_word: יְהוָה אֲדֹנֵינוּ
  english_pob_choice: Yahweh our Lord
  chosen_korean: 야훼 우리 주
  alternatives_korean:
  - 야훼 우리 주님
  - 여호와 우리 주
  lexicon: HALOT
  rationale: 신명기적 언약 명칭인 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, אֲדֹנֵינוּ는 소유격을 살려 ‘우리 주’로 번역했습니다.
- source_word: מִשְׁפָּטָיו וְחֻקָּיו
  english_pob_choice: his judgments and his statutes
  chosen_korean: 그의 규례와 그의 율례
  alternatives_korean:
  - 그의 판결과 그의 규정
  - 그의 법도와 그의 규례
  lexicon: HALOT
  rationale: 법정적 뉘앙스의 מִשְׁפָּטִים와 제정된 규정의 뉘앙스의 חֻקִּים을 한국어 성경에서 구별되는 한 쌍으로 옮겼습니다.
theological_decisions:
- issue: 언약적 제재가 포함된 ‘저주와 맹세’의 표현
  chosen_reading: 언약 위반 시 제재를 수반하는 엄숙한 맹세로 이해되도록 ‘저주와 맹세’를 유지했습니다.
  alternative_readings:
  - ‘저주’를 완화해 ‘서약’으로 옮김
  - 문맥 설명을 본문 안에 더 직접 삽입
  rationale: 본문은 단순 서약이 아니라 자기저주를 동반한 언약적 결속을 말하므로, 긴장을 약화하지 않고 POB의 의미를 보존하는 것이 필요합니다.
  doctrine_reference: 'POB translation philosophy: source tension should not be erased'
