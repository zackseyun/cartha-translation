  text: וְ/הָיָ֨ה הַ/כֹּהֵ֧ן בֶּֽן אַהֲרֹ֛ן עִם הַ/לְוִיִּ֖ם בַּ/עְשֵׂ֣ר הַ/לְוִיִּ֑ם וְ/הַ/לְוִיִּ֞ם יַעֲל֨וּ אֶת מַעֲשַׂ֤ר הַֽ/מַּעֲשֵׂר֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ אֶל הַ/לְּשָׁכ֖וֹת לְ/בֵ֥ית הָ/אוֹצָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
  footnotes:
  - marker: a
    text: Or 'a tenth of the tithe.' The Hebrew expression is literally 'the tithe of the tithe,' referring to the portion the Levites themselves give from the tithe they receive.
    reason: lexical_alternative
  - marker: b
    text: Or 'treasury.' Here the sense is likely a storage area for tithes and offerings rather than a money treasury specifically.
    reason: lexical_alternative
translation:
  language: ko
  text: 아론의 아들인 제사장은 레위 사람들과 함께 있어야 하며, 레위 사람들은 십일조를 거둘 때에 십일조의 십일조를 우리 하나님의 집 곧 곳간의 방들로 올려야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘십일조의 십일조’는 레위인들이 받은 십일조 가운데 다시 드리는 몫을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘곳간’은 여기서 돈을 넣는 금고라기보다 십일조와 예물을 저장하는 보관 공간을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן בֶּן אַהֲרֹן
  english_pob_choice: the priest, a son of Aaron
  chosen_korean: 아론의 아들인 제사장
  alternatives_korean:
  - 아론의 아들 제사장
  - 아론 계열의 제사장
  lexicon: HALOT
  rationale: 히브리어의 혈통 표지를 살려 제사장이 아론 계통임을 분명히 하되, 한국어에서는 소유격 구조가 가장 자연스럽습니다.
- source_word: בַּעְשֵׂר
  english_pob_choice: when the Levites collect the tithe
  chosen_korean: 십일조를 거둘 때에
  alternatives_korean:
  - 십일조를 취할 때에
  - 십일조를 받을 때에
  lexicon: HALOT
  rationale: 여기서는 레위 사람들이 십일조를 ‘받는’ 것보다 ‘거두는’ 행위가 더 직접적으로 드러나므로, 문맥에 맞는 동사를 택했습니다.
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  english_pob_choice: the tithe of the tithe
  chosen_korean: 십일조의 십일조
  alternatives_korean:
  - 십일조에서 드리는 십일조
  - 십분의 일의 십분의 일
  lexicon: HALOT
  rationale: 히브리어의 반복 구조를 그대로 살려 기술적 표현의 형식을 유지했습니다.
- source_word: הַלְּשָׁכוֹת לְבֵית הָאוֹצָר
  english_pob_choice: the chambers of the storehouse
  chosen_korean: 곳간의 방들
  alternatives_korean:
  - 창고의 방들
  - 곳간 방들
  lexicon: HALOT
  rationale: אוֹצָר는 이 문맥에서 금고보다 저장 공간의 뜻이 강하므로, 곡물과 예물을 보관하는 장소라는 점이 드러나도록 ‘곳간’으로 옮겼습니다.
theological_decisions:
- issue: 제의적 보관 공간의 성격
  chosen_reading: 우리 하나님의 집 곧 곳간의 방들
  alternative_readings:
  - 우리 하나님의 집의 창고들
  - 우리 하나님의 집 곧 보물창고
  rationale: 문맥은 화폐 보관이 아니라 십일조와 제의적 물자의 보관이므로, ‘곳간’ 계열 표현이 본문의 실상을 더 정확히 전달합니다.
  doctrine_reference: 성전 봉헌과 레위인 십일조 규정(느헤미야 10장)
