lexical_decisions:
- source_word: הוֹדִיָּה
  english_pob_choice: Hodiah
  chosen_korean: 호디야
  alternatives_korean:
  - 호디야(하디야로 음역)
  lexicon: 고유명사
  rationale: 인명은 번역하지 않고 음역해야 하므로, 영어 POB의 Hodiah에 맞추되 표준 한국어 음역으로 옮겼습니다.
