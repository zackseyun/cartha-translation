- source_word: בְּנִינוּ
  english_pob_choice: Beninu
  chosen_korean: 베니누
  alternatives_korean:
  - 비누이
  lexicon: 고유명사
  rationale: 본문 형태를 투명하게 반영해 Beninu로 보는 POB의 처리에 따라, 전통적 조화형인 비누이가 아니라 현행 음역을 따랐습니다.
theological_decisions:
- issue: 이 절의 인명 표기에서 전통적 조화형을 따를지, 본문 형태를 투명하게 반영할지
  chosen_reading: 본문의 현재 형태를 우선해 호디야, 바니, 베니누로 옮겼습니다.
  alternative_readings:
  - 조화형으로 비누이를 택함
  rationale: 본문 자체의 인명 목록을 있는 그대로 드러내는 것이 이 절의 핵심이며, 영어 POB도 동일하게 투명한 본문형을 채택했습니다.
  doctrine_reference: 본문비평 및 고유명사 음역 원칙
