source:
  edition: WLC
  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
  footnotes:
  - marker: a
    text: Or 'the Israelites and the Levites.' The Hebrew more literally reads 'the sons of Israel and the sons of Levi.'
    reason: lexical_alternative
  - marker: b
    text: Or 'we will not forsake the house of our God.'
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 자손과 레위 자손은 곡식과 새 포도주와 기름의 예물을 골방들로 가져오고, 거기에는 성소의 기물들과 섬기는 제사장들과 문지기들과 노래하는 이들이 있습니다. 그리고 우리는 우리 하나님의 집을 소홀히 하지 않겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들과 레위 사람들’입니다. 히브리어는 문자적으로 ‘이스라엘 자손과 레위 자손’이라고 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리 하나님의 집을 버리지 않겠습니다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל / בְנֵי הַלֵּוִי
  english_pob_choice: the sons of Israel / the sons of Levi
  chosen_korean: 이스라엘 자손 / 레위 자손
  alternatives_korean:
  - 이스라엘의 아들들 / 레위의 아들들
  - 이스라엘 사람들 / 레위 사람들
  lexicon: HALOT
  rationale: 히브리어의 친족·계보 표현을 살리되 한국어에서는 자연스러운 성경식 표현인 ‘자손’을 택해, 영어 POB의 형식적 평행성을 과도하게 경직되지 않게 옮겼습니다.
- source_word: לְּשָׁכוֹת
  english_pob_choice: the chambers
  chosen_korean: 골방들
  alternatives_korean:
  - 방들
  - 창고들
  lexicon: HALOT
  rationale: 성전 부속 공간을 가리키는 건축 용어이므로, 한국어 성경에서 익숙한 ‘골방들’을 사용해 공간의 성격을 보존했습니다.
- source_word: תְּרוּמַת
  english_pob_choice: the contribution
  chosen_korean: 예물
  alternatives_korean:
  - 봉헌물
  - 헌물
  - 드리는 것
  lexicon: HALOT
  rationale: 곡식·새 포도주·기름과 함께 드려지는 성전용 헌납물이라는 문맥상, 보다 구체적인 제의적 성격을 드러내는 ‘예물’이 적절합니다.
- source_word: כְּלֵי הַמִּקְדָּשׁ
  english_pob_choice: the vessels of the sanctuary
  chosen_korean: 성소의 기물들
  alternatives_korean:
  - 성전의 그릇들
  - 성소의 기구들
  lexicon: HALOT
  rationale: מִקְדָּשׁ을 ‘성소’로, כלי를 예배·성전 집기를 뜻하는 ‘기물들’로 옮겨 성전 집기의 범위를 유지했습니다.
- source_word: הַמְשָׁרְתִים
  english_pob_choice: the priests who minister
  chosen_korean: 섬기는 제사장들
  alternatives_korean:
  - 봉사하는 제사장들
  - 시중드는 제사장들
  lexicon: HALOT
  rationale: 현재분사적 표현을 한국어 관용에 맞게 앞꾸밈말로 처리해, 제사장들의 지속적 직무 수행을 나타냈습니다.
- source_word: לֹא נַעֲזֹב
  english_pob_choice: we will not neglect
  chosen_korean: 소홀히 하지 않겠습니다
  alternatives_korean:
  - 버리지 않겠습니다
  - 저버리지 않겠습니다
  - 간과하지 않겠습니다
  lexicon: HALOT
  rationale: 문맥은 건물을 물리적으로 떠나는 것이 아니라 성전 유지와 예배 지원을 게을리하지 않겠다는 서약이므로, ‘소홀히 하다’가 가장 정확합니다.
theological_decisions:
- issue: 베풀어야 할 책임을 나타내는 종결 서약의 뉘앙스
  chosen_reading: 그리고 우리는 우리 하나님의 집을 소홀히 하지 않겠습니다.
  alternative_readings:
  - 그래서 우리는 우리 하나님의 집을 버리지 않겠습니다.
  - 우리는 우리 하나님의 집을 떠나지 않겠습니다.
  rationale: 이 절은 언약 갱신 맥락의 공동체적 서약으로, 단순한 장소 이탈보다 예배와 성전 지원을 지속하겠다는 책임의식을 드러내야 합니다. 따라서 ‘소홀히 하지 않겠습니다’가 신학적·문맥적 긴장을 가장 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
