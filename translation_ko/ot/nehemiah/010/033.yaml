translation:
  language: ko
  text: 우리는 또한 우리 하나님의 집의 일을 위해 해마다 한 세겔의 삼분의 일을 바치도록 우리 스스로 규정을 정했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
