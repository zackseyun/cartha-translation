translation:
  language: ko
  text: 우리는 또한 우리 하나님의 집을 섬기는 일에 해마다 한 세겔의 삼분의 일을 바치도록 우리 자신에게 계명을 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 해마다 한 세겔의 삼분의 일을 바치도록 우리 자신에게 의무를 부과했습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ
  english_pob_choice: we also laid
  chosen_korean: 우리는 또한 … 계명을 두었습니다
  alternatives_korean:
  - 우리는 또한 … 의무를 부과했습니다
  - 우리는 또한 … 세웠습니다
  - 우리는 또한 … 마련했습니다
  lexicon: HALOT
  rationale: 히필형 עמד의 ‘세우다/부과하다’는 뜻을 공동체가 자신들에게 규정하는 뉘앙스로 살리기 위해, 자연스러운 한국어로 ‘계명을 두다’로 옮겼습니다. English POB의 self-imposed obligation 감각도 반영됩니다.
- source_word: מִצְוֺת
  english_pob_choice: the commandment
  chosen_korean: 계명
  alternatives_korean:
  - 의무
  - 규정
  - 명령
  lexicon: HALOT
  rationale: 형태는 복수이지만 여기서는 공동체가 스스로에게 부과한 단일한 규범/의무를 가리키므로, POB의 ‘the commandment’를 따라 ‘계명’으로 옮기되 한국어에서는 단수로 자연스럽게 처리했습니다.
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  english_pob_choice: a third of a shekel
  chosen_korean: 한 세겔의 삼분의 일
  alternatives_korean:
  - 세겔의 삼분의 일
  - 세겔 한 닢의 삼분의 일
  - 세겔의 1/3
  lexicon: HALOT
  rationale: 분수 표현을 직역해 금액의 정확성을 유지했습니다. ‘한 세겔의 삼분의 일’은 현대 한국어에서 읽기 쉽고 원문의 수량감을 보존합니다.
- source_word: לַעֲבֹדַת בֵּית אֱלֹהֵינוּ
  english_pob_choice: for the service of the house of our God
  chosen_korean: 우리 하나님의 집을 섬기는 일에
  alternatives_korean:
  - 우리 하나님의 집의 봉사를 위해
  - 우리 하나님의 집의 예배 사역을 위해
  - 우리 하나님의 집의 일에
  lexicon: HALOT
  rationale: עֲבֹדָה는 성전 맥락에서 단순한 노동보다 ‘섬김/봉사’의 뜻이 강하므로, 한국어 ‘섬기는 일’로 옮겨 제의적·실무적 의미를 함께 살렸습니다.
theological_decisions:
- issue: 자기 부과의 성격을 어떻게 드러낼지
  chosen_reading: 공동체가 스스로에게 계명을 두었다는 식으로, 외부 명령이 아니라 자발적 서약의 성격을 드러냈습니다.
  alternative_readings:
  - 우리 자신에게 의무를 부과했습니다
  - 우리에게 명령으로 정해 두었습니다
  rationale: 본문은 공동체가 성전 유지비를 자발적으로 규정한 맥락이므로, ‘계명을 두었습니다’라고 하면 제도적 의무성과 자기서약성을 함께 보존할 수 있습니다.
  doctrine_reference: Nehemiah 10:32-39 문맥; 번역 철학 §1, §5
