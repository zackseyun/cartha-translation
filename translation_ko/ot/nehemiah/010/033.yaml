review_pass:
  verdict: revise
  source_fidelity: 히브리어는 공동체가 성전 봉사를 위하여 해마다 세겔 삼분의 일을 내도록 스스로에게 구속력 있는 규정을 부과했음을 말합니다. 초안의 금액·연례성·목적은 정확하지만, ‘계명’은 통상 하나님의 명령을 가리켜 자가 부과한 규정이라는 본문의 성격을 다소 흐릴 수 있습니다.
  naturalness: ‘우리 자신에게 계명을 두었습니다’는 현대 표준 한국어에서 어색합니다. ‘우리 스스로 … 규정을 정했습니다’는 자발적·구속적 성격을 자연스럽게 표현합니다.
  terminology: ‘한 세겔의 삼분의 일’과 ‘우리 하나님의 집’은 적절합니다. עֲבֹדַת בֵּית אֱלֹהֵינוּ는 제의와 유지 업무를 포괄하므로 ‘우리 하나님의 집의 일을 위해’가 ‘집을 섬기는 일에’보다 자연스럽고 원문의 명사 결합에 가깝습니다.
  issues:
  - severity: medium
    issue: ‘계명’ 및 ‘계명을 두었습니다’
    rationale: מִצְוֺת는 여기서 공동체가 자신들에게 정한 의무적 규정을 가리킵니다. 한국어 ‘계명’은 일반적으로 하나님이 내리신 명령이라는 함의를 강하게 지니며, ‘자신에게 계명을 두다’도 비자연스럽습니다.
  - severity: low
    issue: ‘우리 하나님의 집을 섬기는 일에’
    rationale: 의미는 가능하지만, ‘집을 섬기다’는 한국어에서 다소 부자연스럽습니다. 원문의 ‘하나님의 집의 봉사/일’을 ‘우리 하나님의 집의 일을 위해’로 옮기면 제의적·실무적 범위를 유지합니다.
