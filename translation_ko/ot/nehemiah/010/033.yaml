  to: 우리는 또한 우리 하나님의 집의 일을 위해 해마다 한 세겔의 삼분의 일을 바치도록 우리 스스로 규정을 정했습니다.[a]
  rationale: 자기 부과의 성격과 규범적 구속력을 보존하면서, 하나님에게서 비롯된 계명으로 오해될 수 있는 ‘계명’을 중립적인 ‘규정’으로 바꾸었습니다. 어색한 ‘집을 섬기는 일’도 원문의 성전 봉사·업무 범위를 유지하는 자연스러운 표현으로 다듬었습니다.
