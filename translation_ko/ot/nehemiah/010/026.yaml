lexical_decisions:
- source_word: רְחוּם
  english_pob_choice: Rehum
  chosen_korean: 르훔
  alternatives_korean:
  - 레훔
  - 르후姆
  lexicon: HALOT
  rationale: 본문이 신명기 목록의 고유명사들이므로 뜻풀이가 아니라 음역이 필요합니다. 영어 POB의 Rehum에 맞춰 한국어도 간결한 음역으로 처리했습니다.
- source_word: חֲשַׁבְנָה
  english_pob_choice: Hashabnah
  chosen_korean: 하솝나
  alternatives_korean:
  - 하샵나
  - 하샤브나
  lexicon: HALOT
  rationale: 고유명사로서 음역했습니다. 영어 POB가 Hashabnah를 택한 점을 반영하되, 한국어에서는 자음군을 자연스럽게 옮겨 읽기 쉬운 형태로 적었습니다.
- source_word: מַעֲשֵׂיָה
  english_pob_choice: Maaseiah
  chosen_korean: 마아세야
  alternatives_korean:
  - 마아세이아
  - 마아세야흐
  lexicon: HALOT
  rationale: 이름 자체를 번역하지 않고 음역하는 것이 본문 성격에 맞습니다. 영어 POB의 Maaseiah를 한국어 표기 관례에 맞게 옮겼습니다.
theological_decisions:
- issue: 이 절은 이름만 나열한 서명자 목록입니다.
  chosen_reading: 의미 번역이나 문장 보충 없이, 세 사람의 이름을 쉼표로만 제시했습니다.
  alternative_readings:
  - ‘…가 서명했습니다’ 같은 서술형 확장
  - 이름의 뜻을 살린 의미 번역
  rationale: 히브리어 본문이 개인 이름 세 개만으로 이루어져 있으므로, 서술을 덧붙이면 본문이 말하지 않는 내용을 추가하게 됩니다.
  doctrine_reference: 본문 형태 보존 원칙
