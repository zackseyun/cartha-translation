id: NEH.10.1
reference: Nehemiah 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
  footnotes:
  - marker: a
    text: Or, 'And in all this we are cutting a firm agreement and writing it.' The Hebrew uses covenant-making language literally, 'cutting,' and the noun may be rendered 'firm agreement' or 'faithful pledge.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'on the sealed document' / 'upon the sealed deed.' The Hebrew likely refers to the written agreement as formally sealed.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 일 때문에 우리는 확고한 약정을 맺고 그것을 기록합니다[a]. 봉인된 문서에는 우리 관리들과 레위인들과 제사장들이 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 일 가운데 우리는 확고한 약정을 맺고 그것을 기록합니다.’ 히브리어는 언약을 맺는 일을 문자적으로 ‘자르다’라고 표현하며, אֲמָנָה는 ‘확고한 약정’ 또는 ‘신실한 서약’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘봉인된 증서에’ 또는 ‘봉인된 문서 위에.’ 히브리어는 공식적으로 봉인된 기록 문서를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֹאת
  english_pob_choice: And because of all this
  chosen_korean: 그리고 이 모든 일 때문에
  alternatives_korean:
