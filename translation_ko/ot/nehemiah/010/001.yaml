id: NEH.10.1
reference: Nehemiah 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
  footnotes:
  - marker: a
    text: Or, 'And in all this we are cutting a firm agreement and writing it.' The Hebrew uses covenant-making language literally, 'cutting,' and the noun may be rendered 'firm agreement' or 'faithful pledge.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'on the sealed document' / 'upon the sealed deed.' The Hebrew likely refers to the written agreement as formally sealed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 모든 일 때문에 우리는 문서로서 바인한 언약을 맺습니다[a]. 그리고 봉인된 문서에는 우리의 지도자들과 우리의 레위 사람들과 우리의 제사장들이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 일 가운데 우리는 확고한 언약을 맺고 그것을 기록합니다.’ 히브리어는 문자적으로 ‘자르다’는 언약 체결 어법을 사용하며, אֲמָנָה는 ‘확고한 약정’ 또는 ‘신실한 서약’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֹאת
  english_pob_choice: And because of all this
  chosen_korean: 그리고 이 모든 일 때문에
  alternatives_korean:
  - 그리고 이 모든 일에서
  - 그리고 이 모든 것으로 인해
  lexicon: HALOT
  rationale: 문맥상 앞선 고백과 상황을 가리키는 원인·배경 표현이므로, 합쇼체에서 자연스럽게 원인 관계를 드러냈습니다.
- source_word: כֹּרְתִ֥ים אֲמָנָ֖ה
  english_pob_choice: are making a binding agreement
  chosen_korean: 문서로서 바인한 언약을 맺습니다
  alternatives_korean:
  - 굳게 언약을 맺습니다
  - 확정된 약정을 맺습니다
  - 맹세의 약정을 세웁니다
  lexicon: HALOT
  rationale: כרת의 언약 관용구를 ‘맺습니다’로 옮기되, אֲמָנָה의 ‘확고한/신뢰할 만한 약정’ 성격을 살려 법적·공식적 뉘앙스를 담았습니다.
- source_word: וְכֹתְבִ֑ים
  english_pob_choice: in writing
  chosen_korean: 문서로서
  alternatives_korean:
  - 글로
  - 기록하여
  - 문서에 적어
  lexicon: HALOT
  rationale: 이어지는 ‘봉인된 문서’와 연결되므로, 단순히 ‘적어’보다 문서화된 절차임을 드러내는 표현이 더 적절합니다.
- source_word: וְעַל הֶחָתוּם
  english_pob_choice: on the sealed document
  chosen_korean: 봉인된 문서에는
  alternatives_korean:
  - 봉인된 문서 위에는
  - 봉인된 서류에는
  - 봉인된 계약서에는
  lexicon: HALOT
  rationale: הֶחָתוּם은 봉인된 문서 자체를 가리키는 것으로 보이므로, 현대 독자가 이해하기 쉬운 ‘문서’로 옮겼습니다.
- source_word: שָׂרֵינוּ לְוִיֵּינוּ כֹּהֲנֵינוּ
  english_pob_choice: our officials, our Levites, and our priests
  chosen_korean: 우리의 지도자들과 우리의 레위 사람들과 우리의 제사장들
  alternatives_korean:
  - 우리의 관리들과 우리의 레위 사람들과 우리의 제사장들
  - 우리의 귀족들과 우리의 레위 사람들과 우리의 제사장들
  lexicon: HALOT
  rationale: שָׂרִים은 이 포로기 이후 행정적 문맥에서 왕족보다 ‘지도자들/관리들’이 더 자연스럽습니다. 레위인과 제사장은 표준 교회 용례를 따르되 본문 구조를 유지했습니다.
theological_decisions:
- issue: 언약 체결을 가리키는 כרת의 관용구
  chosen_reading: ‘맺습니다’로 옮기되, 뒤의 ‘문서로서’와 ‘봉인된 문서’로 공식적이고 구속력 있는 성격을 드러냈습니다.
  alternative_readings:
  - ‘끊습니다’
  - ‘자릅니다’
  rationale: 히브리어의 문자적 ‘자르다’ 이미지는 언약 체결 관용구이지만, 한국어 본문에서는 의미를 우선해 자연스럽게 표현하는 것이 적절합니다.
  doctrine_reference: 언약 신학/성경 히브리어 관용구
- issue: אֲמָנָה의 법적·신실성 뉘앙스
  chosen_reading: ‘바인한 언약’으로 옮겨 구속력과 신실성을 함께 살렸습니다.
  alternative_readings:
  - ‘확고한 약정’
  - ‘믿을 만한 맹세’
  - ‘굳은 언약’
  rationale: 본문은 단순한 합의보다 공식적으로 묶이는 서약을 말하므로, 독자가 문서적·법적 강도를 느끼도록 했습니다.
  doctrine_reference: 언약/서약 표현
