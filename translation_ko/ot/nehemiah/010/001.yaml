  - 확정된 약정을 맺습니다
  - 맹세의 약정을 세웁니다
  lexicon: HALOT
  rationale: כרת의 언약 관용구를 ‘맺습니다’로 옮기되, אֲמָנָה의 ‘확고한/신뢰할 만한 약정’ 성격을 살려 법적·공식적 뉘앙스를 담았습니다.
- source_word: וְכֹתְבִ֑ים
  english_pob_choice: in writing
  chosen_korean: 문서로서
  alternatives_korean:
  - 글로
  - 기록하여
  - 문서에 적어
  lexicon: HALOT
  rationale: 이어지는 ‘봉인된 문서’와 연결되므로, 단순히 ‘적어’보다 문서화된 절차임을 드러내는 표현이 더 적절합니다.
- source_word: וְעַל הֶחָתוּם
  english_pob_choice: on the sealed document
  chosen_korean: 봉인된 문서에는
  alternatives_korean:
  - 봉인된 문서 위에는
  - 봉인된 서류에는
  - 봉인된 계약서에는
  lexicon: HALOT
  rationale: הֶחָתוּם은 봉인된 문서 자체를 가리키는 것으로 보이므로, 현대 독자가 이해하기 쉬운 ‘문서’로 옮겼습니다.
- source_word: שָׂרֵינוּ לְוִיֵּינוּ כֹּהֲנֵינוּ
  english_pob_choice: our officials, our Levites, and our priests
  chosen_korean: 우리의 지도자들과 우리의 레위 사람들과 우리의 제사장들
  alternatives_korean:
  - 우리의 관리들과 우리의 레위 사람들과 우리의 제사장들
  - 우리의 귀족들과 우리의 레위 사람들과 우리의 제사장들
  lexicon: HALOT
  rationale: שָׂרִים은 이 포로기 이후 행정적 문맥에서 왕족보다 ‘지도자들/관리들’이 더 자연스럽습니다. 레위인과 제사장은 표준 교회 용례를 따르되 본문 구조를 유지했습니다.
theological_decisions:
- issue: 언약 체결을 가리키는 כרת의 관용구
  chosen_reading: ‘맺습니다’로 옮기되, 뒤의 ‘문서로서’와 ‘봉인된 문서’로 공식적이고 구속력 있는 성격을 드러냈습니다.
  alternative_readings:
  - ‘끊습니다’
  - ‘자릅니다’
  rationale: 히브리어의 문자적 ‘자르다’ 이미지는 언약 체결 관용구이지만, 한국어 본문에서는 의미를 우선해 자연스럽게 표현하는 것이 적절합니다.
  doctrine_reference: 언약 신학/성경 히브리어 관용구
- issue: אֲמָנָה의 법적·신실성 뉘앙스
  chosen_reading: ‘바인한 언약’으로 옮겨 구속력과 신실성을 함께 살렸습니다.
  alternative_readings:
  - ‘확고한 약정’
  - ‘믿을 만한 맹세’
  - ‘굳은 언약’
  rationale: 본문은 단순한 합의보다 공식적으로 묶이는 서약을 말하므로, 독자가 문서적·법적 강도를 느끼도록 했습니다.
  doctrine_reference: 언약/서약 표현
