lexical_decisions:
- source_word: חָרִ֥יף
  english_pob_choice: Hariph
  chosen_korean: 하립
  alternatives_korean:
  - 하리프
  lexicon: 고유명사
  rationale: 열거된 언약 서명자 이름이므로 의미를 풀지 않고 음역으로 옮겼습니다. 영어 POB의 Hariph에 맞추어 한국어에서도 간결한 고유명사 음가를 살렸습니다.
- source_word: עֲנָת֖וֹת
  english_pob_choice: Anathoth
  chosen_korean: 아나돗
  alternatives_korean:
  - 아나돗
  lexicon: 고유명사
  rationale: 본문 맥락상 지명처럼 읽히는 형태이지만, 영어 POB처럼 이 목록에서는 고유명사로 유지하는 것이 소스에 가장 충실합니다.
- source_word: נובי
  english_pob_choice: Nobai
  chosen_korean: 노바이
  alternatives_korean:
  - 노비
  lexicon: 고유명사
  rationale: 이름의 끝 음가를 살려 고유명사로 음역했습니다. 영어 POB의 Nobai를 기준으로 한국어에서도 마지막 반모음이 드러나도록 옮겼습니다.
theological_decisions:
- issue: 이 절이 뜻풀이가 아닌 이름 목록이라는 점을 어떻게 반영할지
  chosen_reading: 세 항목을 모두 의미 번역 없이 고유명사 음역으로 유지했습니다.
  alternative_readings:
  - 하립 사람
  - 아나돗 사람
  - 노바이 사람
  rationale: 문맥은 언약에 서명한 사람들의 명단이므로, 지명이나 일반명사로 풀기보다 서명자 명칭을 그대로 보존하는 것이 독자 이해와 소스 충실성에 더 적합합니다.
  doctrine_reference: 본문 장르/명단 해석 원칙
- issue: עֲנָתוֹת의 지명성 가능성 처리
  chosen_reading: 주석 없이 본문에서는 고유명사로만 처리했습니다.
  alternative_readings:
  - 아나돗(지명)
  - 아나돗 사람
  rationale: 영어 POB도 이 항목을 고유명사/지정명으로 유지하며, 본문에는 별도 설명을 덧붙이지 않았습니다. 이 절의 기능은 신학적 진술보다 명단 기록에 있습니다.
  doctrine_reference: 본문 장르/명단 해석 원칙
