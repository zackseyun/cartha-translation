    rationale: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ는 ‘우리 하나님의 집의 모든 일’을 뜻합니다. ‘드는 것들’은 비용·소요품이라는 의미를 덧붙이므로 삭제하는 것이 원문에 더 충실합니다.
  - severity: low
