    rationale: ‘…위함이었습니다’는 자연스러운 완결 문장이 아니며, 모든 각주 표지가 문장 끝에 몰려 있어 해당 어휘와의 연결이 불분명합니다. ‘이는 … 위한 것이었습니다’로 고치고 각 표지를 관련 어휘 뒤에 배치했습니다.
