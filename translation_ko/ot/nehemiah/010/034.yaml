id: NEH.10.34
reference: Nehemiah 10:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/לֶ֣חֶם הַֽ/מַּעֲרֶ֡כֶת וּ/מִנְחַ֣ת הַ/תָּמִ֣יד וּ/לְ/עוֹלַ֣ת הַ֠/תָּמִיד הַ/שַּׁבָּת֨וֹת הֶ/חֳדָשִׁ֜ים לַ/מּוֹעֲדִ֗ים וְ/לַ/קֳּדָשִׁים֙ וְ/לַ֣/חַטָּא֔וֹת לְ/כַפֵּ֖ר עַל יִשְׂרָאֵ֑ל וְ/כֹ֖ל מְלֶ֥אכֶת בֵּית אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
  footnotes:
  - marker: a
    text: Or 'the showbread' or 'the bread set out.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the continual grain offering' and 'the continual burnt offering.'
    reason: lexical_alternative
  - marker: c
    text: '''Appointed times'' can include the set festival occasions.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the holy offerings' or 'the consecrated things.'
    reason: lexical_alternative
  - marker: e
    text: '''Sin offerings'' may also be understood in some contexts as ''purification offerings.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 진설병[a]과 정기적인 곡식제물[b], 정기적인 번제물[b], 안식일과 초하루와 정해진 때들[c], 거룩한 것들[d], 이스라엘을 위하여 속죄하기 위한 속죄제물들[e], 그리고 우리 하나님의 집의 모든 일을 위한 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘진설병’은 문자적으로 ‘차려 놓은 빵’에 해당하며, 전통적으로 ‘진설병’으로 알려져 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정기적인’은 ‘늘 드리는’ 또는 ‘계속 드리는’이라는 뜻을 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘정해진 때들’에는 정해진 절기와 축제 기간이 포함될 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘거룩한 것들’은 ‘거룩한 예물들’ 또는 ‘성별된 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: ‘속죄제물들’은 어떤 문맥에서는 ‘정결제물들’로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  english_pob_choice: the bread of the arrangement
  chosen_korean: 진설병
  alternatives_korean:
  - 진열한 빵
  - 배열의 빵
  - 차려 놓은 빵
  lexicon: HALOT
  rationale: 성막/성전 제의에서 널리 알려진 대응어를 쓰되, 문맥상 제의용 떡이라는 점을 분명히 했습니다. 영어 POB의 ‘bread of the arrangement’는 직역성이 강하지만, 한국어에서는 의례 용어 ‘진설병’이 가장 자연스럽고 정확합니다.
- source_word: מִנְחַת הַתָּמִיד
  english_pob_choice: the regular grain offering
  chosen_korean: 정기적인 곡식제물
  alternatives_korean:
  - 늘 드리는 곡식제물
  - 지속적인 곡식제물
  - 상시적인 소제
  lexicon: HALOT
  rationale: מִנְחָה의 제의적 의미를 살려 ‘곡식제물’로 옮기고, תָּמִיד은 반복·지속을 가리키므로 ‘정기적인’으로 풀었습니다. ‘소제’는 전통적이지만 오늘 한국어에서 다소 교회 용어화되어 있어 더 투명한 표현을 택했습니다.
- source_word: עֹלַת הַתָּמִיד
  english_pob_choice: the regular burnt offering
  chosen_korean: 정기적인 번제물
  alternatives_korean:
  - 늘 드리는 번제물
  - 지속적인 번제물
  - 상시적인 번제
  lexicon: HALOT
  rationale: עֹלָה는 전부를 태워 드리는 번제를 가리키므로 ‘번제물’로 옮겼고, תָּמִיד은 앞 구절과 같은 방식으로 ‘정기적인’으로 처리했습니다. 제의 범주를 분명히 하면서도 현대 한국어로 읽히게 했습니다.
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  english_pob_choice: of the Sabbaths, the new moons, the appointed times
  chosen_korean: 안식일들과 초하루들과 정해진 절기들
  alternatives_korean:
  - 안식일들과 새 달들과 정한 때들
  - 안식일들과 월삭들과 절기들
  - 안식일들과 새달들과 정해진 때들
  lexicon: HALOT
  rationale: 열거 구조를 살려 각각 독립된 항목으로 옮겼습니다. מוֹעֲדִים은 문맥상 절기들을 포함하는 ‘정해진 절기들’이 가장 자연스럽고, ‘초하루들’은 히브리어의 달 시작 예식을 잘 드러냅니다.
- source_word: וְלַקֳּדָשִׁים
  english_pob_choice: and the holy things
  chosen_korean: 거룩한 것들
  alternatives_korean:
  - 거룩한 예물들
  - 성별된 것들
  - 거룩한 제물들
  lexicon: HALOT
  rationale: 히브리어의 범위가 넓어 제물로 좁히지 않고 ‘거룩한 것들’로 두어 포괄성을 유지했습니다. 영어 POB도 ‘holy things’로 넓게 잡고 있으므로 그 폭을 그대로 살렸습니다.
- source_word: וְלַחַטָּאוֹת
  english_pob_choice: and for the sin offerings
  chosen_korean: 속죄제물들
  alternatives_korean:
  - 죄제물들
  - 속죄제사들
  - 죄를 위한 제물들
  lexicon: HALOT
  rationale: חַטָּאת은 제의 문맥에서 죄와 속죄를 함께 떠올리게 하는 제물 이름이므로, 한국어에서는 기능을 드러내는 ‘속죄제물들’이 가장 자연스럽습니다. ‘죄제물’은 직역성이 강하지만 한국어 제의어로 덜 익숙합니다.
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  english_pob_choice: to make atonement for Israel
  chosen_korean: 이스라엘을 속죄하기 위한
  alternatives_korean:
  - 이스라엘을 위하여 속죄하기 위한
  - 이스라엘을 위해 속죄하기 위한
  - 이스라엘을 위해 속죄하는
  lexicon: HALOT
  rationale: כפר의 제의적 기능을 직접 살려 ‘속죄하기 위한’으로 옮겼습니다. 문맥상 목적구이므로 ‘~하기 위한’ 구조가 자연스럽고, 한국어에서 ‘속죄’가 화목·정결의 제의적 기능을 함께 떠올리게 합니다.
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  english_pob_choice: and for all the work of the house of our God
  chosen_korean: 우리 하나님의 집의 모든 일
  alternatives_korean:
  - 우리 하나님의 집의 모든 일거리
  - 우리 하나님의 집의 모든 업무
  - 우리 하나님의 집의 모든 사역
  lexicon: HALOT
  rationale: מְלָאכָה는 광범위한 ‘일/작업’이므로, 제의적 봉사를 지나치게 좁히지 않도록 ‘모든 일’로 옮겼습니다. 영어 POB의 ‘work’와 같은 폭을 유지하면서 한국어로도 자연스럽게 읽히게 했습니다.
theological_decisions:
- issue: 제의 용어를 현대 한국어로 옮길 때 전통 교회어와 투명성 사이의 균형
  chosen_reading: ‘진설병’, ‘곡식제물’, ‘번제물’, ‘속죄제물’처럼 제의 범주를 분명히 하되, 지나치게 교리화된 표현은 피했습니다.
  alternative_readings:
  - ‘진설병’, ‘소제’, ‘번제’, ‘속죄제’처럼 더 전통적인 교회 용어를 쓸 수 있습니다.
  - ‘차려 놓은 빵’, ‘곡물 예물’처럼 설명적으로 풀 수도 있습니다.
  rationale: 본문은 성전 운영의 물품과 제사를 열거하는 목록이므로, 후대 교회 관용어로 완전히 치환하기보다 제의적 기능이 드러나는 표현을 유지하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 번역 철학 §§1, 3, 6
- issue: ‘거룩한 것들’의 범위를 함부로 좁히지 않음
  chosen_reading: 대상을 제물로 한정하지 않고 포괄적인 표현을 유지했습니다.
  alternative_readings:
  - ‘거룩한 제물들’
  - ‘성별된 예물들’
  rationale: 히브리어의 복수형은 구체 항목을 확정하기에 충분히 좁지 않으므로, 본문이 허용하는 폭을 보존하는 것이 더 충실합니다.
  doctrine_reference: 번역 철학 §3
