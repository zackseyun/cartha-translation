  source_fidelity: 원문의 접속사와 부정사구는 앞선 언약 조항을 이어 가는 표현입니다. ‘또한 … 가져오기로 하였습니다’는 그 기능을 자연스럽게 반영합니다. אַדְמָתֵנוּ는 ‘우리 땅’, בִּכּוּרֵי는 ‘첫 열매’, שָׁנָה בְשָׁנָה는 ‘해마다’로 충실히 옮겼습니다. ‘모든 나무의 모든 과일의 첫 열매’는 히브리어의 포괄적 반복을 보존합니다.
  naturalness: 초안의 ‘가져오게 하려 함이요’는 주체와 문법 관계가 불명확하고 현대 표준 한국어의 합쇼체 문장으로도 부자연스럽습니다. 또한 ‘우리의 땅의’ 및 ‘열매의 첫 열매’의 연쇄는 다듬을 필요가 있습니다. 수정문은 문법적으로 완결되고 자연스럽습니다.
  terminology: בֵּית יְהוָה는 본문에서 ‘야훼의 성전’으로 문맥상 자연스럽게 옮기되, 각주에서 직역 ‘야훼의 집’을 밝혔습니다. 신명은 원문 표기에 맞추어 ‘야훼’로 통일했습니다. 기존 b 각주는 동일 표현을 반복하면서 문장 구조도 불완전하여 삭제해야 합니다.
