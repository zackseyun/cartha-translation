source:
  edition: WLC
  text: וְֽ/הַ/לְוִיִּ֑ם וְ/יֵשׁ֨וּעַ֙ בֶּן אֲזַנְיָ֔ה בִּנּ֕וּי מִ/בְּנֵ֥י חֵנָדָ֖ד קַדְמִיאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
  footnotes:
  - marker: a
    text: Or 'of the sons of Henadad'; the phrase may identify Binnui as belonging to the Henadad clan.
    reason: lexical_alternative
  - marker: b
    text: Many English versions spell the final name 'Kadmiel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 레위 사람들은 곧 예수아, 아자니야의 아들, 빈누이, 헤나다드의 아들들 가운데서, 그리고 깟미엘입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헤나다드의 아들들 가운데서’는 빈누이가 헤나다드 씨족에 속했음을 뜻할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 이름은 다른 영어본들에서 흔히 ‘Kadmiel’로 표기합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  english_pob_choice: and the Levites
  chosen_korean: 그리고 레위 사람들은
  alternatives_korean:
  - 그리고 레위인들은
  - 레위 사람들도
  lexicon: WLC
  rationale: 문맥상 앞선 서명자 목록을 이어 주는 연결어로 처리했고, 명사구는 현대 한국어에서 자연스러운 ‘레위 사람들’로 옮겼습니다.
- source_word: בֶּן אֲזַנְיָה
  english_pob_choice: son of Azaniah
  chosen_korean: 아자니야의 아들
  alternatives_korean:
  - 아자니야의 아들인
  - 아자니야의 아들
  lexicon: WLC
  rationale: 족보/소속 관계를 나타내는 בֶּן을 한국어의 소유격 구조로 직접 반영했습니다.
- source_word: מִבְּנֵי חֵנָדָד
  english_pob_choice: from the sons of Henadad
  chosen_korean: 헤나다드의 아들들 가운데서
  alternatives_korean:
  - 헤나다드의 아들들에서
  - 헤나다드의 자손들 가운데서
  lexicon: WLC
  rationale: 미ן의 출처/소속 뉘앙스를 살리면서, ‘sons of’는 혈통보다 씨족 소속을 가리킬 수 있어 ‘아들들 가운데서’로 옮겼습니다.
- source_word: קַדְמִיאֵל
  english_pob_choice: Kadmiel
  chosen_korean: 깟미엘
  alternatives_korean:
  - 갓미엘
  - 카드미엘
  lexicon: WLC
  rationale: 고유명사는 현대 외래어 표기 원칙에 따라 음역했고, 히브리어 어두 자음과 모음감을 반영해 ‘깟미엘’로 잡았습니다.
theological_decisions:
- issue: 이 절의 목록형 구조를 한국어에서 어떻게 처리할지
  chosen_reading: 서술형 동사 없이 인명 나열을 유지해, 히브리어의 단문 열거를 그대로 드러냈습니다.
  alternative_readings:
  - 그리고 레위 사람들은 이러하니…
  - 레위 사람들은 다음과 같습니다
  rationale: 원문에는 보충 동사가 없으므로, 한국어에서도 목록의 성격을 살려 과도한 문장화를 피했습니다.
  doctrine_reference: 본문 문체 보존 원칙
