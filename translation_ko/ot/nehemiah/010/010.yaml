  - marker: b
    text: Many English versions spell the final name 'Kadmiel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들은 아사냐의 아들 예수아, 헤나다드 자손 가운데 속한 빈누이, 카드미엘입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헤나다드 자손 가운데 속한’은 직역하면 ‘헤나다드의 아들들 가운데서’입니다. 이 말은 빈누이가 헤나다드 씨족에 속했음을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  english_pob_choice: and the Levites
  chosen_korean: 그리고 레위 사람들은
  alternatives_korean:
