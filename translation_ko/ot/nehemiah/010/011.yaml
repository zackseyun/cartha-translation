  text: 그리고 그들의 형제들은 스바냐, 호디야, 글리다, 블라야, 하난입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחֵי/הֶם
  english_pob_choice: and their brothers
  chosen_korean: 그리고 그들의 형제들은
  alternatives_korean:
  - 그리고 그들의 친족들은
  - 그리고 그들의 동료들은
  lexicon: HALOT
  rationale: 3인칭 남성 복수 접미사가 붙은 אֲחֵי를 이 명단 문맥에 맞게 직역하여, 성별이 드러나는 관계어인 ‘형제들’로 옮겼습니다.
- source_word: שְׁבַנְיָה
  english_pob_choice: Shebaniah
  chosen_korean: 스헤바냐
  alternatives_korean:
  - 세바냐
  - 스헤바니야
  lexicon: standard transliteration
  rationale: 고유명사는 번역하지 않고 음역하되, 현대 한국어 외래어 표기 기준에 맞춰 읽기 쉬운 형태로 옮겼습니다.
- source_word: הוֹדִיָּה
  english_pob_choice: Hodiah
  chosen_korean: 호디야
  alternatives_korean:
  - 호다야
  - 호디아
  lexicon: standard transliteration
  rationale: 고유명사는 표준 음역으로 처리하여 히브리어 형태를 가능한 한 보존했습니다.
- source_word: קְלִיטָא
  english_pob_choice: Kelita
  chosen_korean: 켈리다
  alternatives_korean:
  - 켈리타
  - 겔리다
  lexicon: standard transliteration
  rationale: 고유명사의 자음 구조를 살리면서 한국어 표기에서 자연스러운 음가로 옮겼습니다.
- source_word: פְּלָאיָה
  english_pob_choice: Pelaiah
  chosen_korean: 펠라야
  alternatives_korean:
  - 페라야
  - 펠라야후
  lexicon: standard transliteration
  rationale: 어말의 -יה 요소를 과도하게 풀지 않고, 본문 명단의 고유명사로서 간결하게 음역했습니다.
- source_word: חָנָן
  english_pob_choice: Hanan
  chosen_korean: 하난
  alternatives_korean:
  - 한난
  - 하난
  lexicon: standard transliteration
  rationale: 널리 쓰이는 히브리어 인명 음역을 따라 간단히 옮겼습니다.
