id: NEH.10.37
reference: Nehemiah 10:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת בְּכֹר֤וֹת בָּנֵ֨י/נוּ֙ וּ/בְהֶמְתֵּ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָ֑ה וְ/אֶת בְּכוֹרֵ֨י בְקָרֵ֜י/נוּ וְ/צֹאנֵ֗י/נוּ לְ/הָבִיא֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ לַ/כֹּ֣הֲנִ֔ים הַ/מְשָׁרְתִ֖ים בְּ/בֵ֥ית אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
  footnotes:
  - marker: a
    text: That is, in keeping with the Torah's commands concerning the firstborn of people and animals.
    reason: cross_reference
  - marker: b
    text: Or 'the firstborn of our cattle and of our sheep/goats.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 율법에 기록된 대로 우리 아들들 가운데 처음 난 이들과 가축 가운데 맏이를[a], 또 우리 소 떼와 양 떼와 염소 떼의 맏이를[b] 우리 하나님의 집으로, 곧 우리 하나님의 집에서 섬기는 제사장들에게 가져오기로 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 사람과 짐승의 맏이에 관한 토라의 명령을 따르는 것입니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘우리 소의 맏이와 우리 양/염소의 맏이’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  english_pob_choice: the firstborn of our sons
  chosen_korean: 우리의 아들들의 맏이
  alternatives_korean:
  - 우리 아들들의 첫째
  - 우리 아들들 가운데 첫째
  lexicon: HALOT
  rationale: בְּכֹרוֹת는 '맏이/첫째'의 뜻이지만, 한국어에서는 '아들들의 맏이'가 첫 출생 아들을 자연스럽게 드러내며, 단순한 순번이 아니라 언약적 첫열매의 의미도 살릴 수 있습니다.
- source_word: וּבְהֶמְתֵּינוּ
  english_pob_choice: and of our livestock
  chosen_korean: 우리의 가축의 맏이
  alternatives_korean:
  - 우리의 짐승의 맏이
  - 우리의 가축들 가운데 첫째
  lexicon: HALOT
  rationale: בְּהֵמָה는 포괄적으로 길들인 가축을 가리키므로, 뒤의 '소 떼'와 '양 떼'를 포괄하는 상위어로 '가축'을 택했습니다.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  english_pob_choice: as it is written in the Law
  chosen_korean: 율법에 기록된 대로
  alternatives_korean:
  - 율법에 기록된 것처럼
  - 토라에 기록된 대로
  lexicon: HALOT
  rationale: 정해진 규범을 가리키는 공식문으로서 한국어 성경 문체에 맞는 '기록된 대로'를 사용했고, תּוֹרָה는 이 문맥에서 구체적으로 '율법'을 뜻합니다.
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  english_pob_choice: the firstborn of our herds and of our flocks
  chosen_korean: 우리의 소 떼의 맏이와 우리의 양 떼의 맏이
  alternatives_korean:
  - 우리의 가축 떼의 맏이와 우리의 양 떼의 맏이
  - 우리의 소와 양의 맏이
  lexicon: HALOT
  rationale: בָּקָר과 צֹאן의 구분을 살리기 위해 '소 떼'와 '양 떼'로 옮겼습니다. '소 떼'는 목축 집단을, '양 떼'는 소형 가축 집단을 자연스럽게 드러냅니다.
- source_word: לְבֵית אֱלֹהֵינוּ
  english_pob_choice: to the house of our God
  chosen_korean: 우리 하나님의 집으로
  alternatives_korean:
  - 우리 하나님의 성전으로
  - 우리 하나님의 집에
  lexicon: HALOT
  rationale: 직역적이면서도 한국어에서 자연스럽게 목적지를 나타내기 위해 '집으로'를 썼습니다. '성전'은 해석을 앞서게 하므로 원문 표현을 유지했습니다.
theological_decisions:
- issue: 제물·헌납의 상세 규정을 본문에 덧붙일지 여부
  chosen_reading: 본문의 범위 안에서 단지 '맏이'를 가져오기로 한 서약으로 유지했습니다.
  alternative_readings:
  - 맏이를 속량하기로 한 것으로 풀어 쓰기
  - 첫태생 헌물로 명시하기
  rationale: 본문은 토라의 규정을 가리키지만, 여기서 속량인지 제물인지까지 구체화하지 않습니다. 따라서 원문의 절제를 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
