  to: 우리는 율법에 기록된 대로 우리 아들들 가운데 처음 난 이들과 가축 가운데 맏이를[a], 또 우리 소 떼와 양 떼와 염소 떼의 맏이를[b] 우리 하나님의 집으로, 곧 우리 하나님의 집에서 섬기는 제사장들에게 가져오기로 하였습니다.
  rationale: 원문의 나열 구조와 ‘가져오다’의 목적 표현을 유지하되, צֹאן의 범위를 양에만 한정하지 않도록 ‘양 떼와 염소 떼’로 보완했습니다. 각주는 설명 대상 직후로 옮겼으며, ‘하나님의 집’은 성전으로 해석하여 바꾸지 않고 원문의 표현을 보존했습니다.
