lexical_decisions:
- source_word: מַלּוּךְ
  english_pob_choice: Malluk / Malluch
  chosen_korean: 말룩
  alternatives_korean:
  - 말루크
  - 말룩
  lexicon: HNp
  rationale: 고유명사는 음역하는 것이 적절하며, 영어 POB의 기본형 Malluk을 따라 한국어 음역은 ‘말룩’으로 옮겼습니다. 영어 철자 변이(Malluch)는 한국어 표기에서 별도 반영이 필요하지 않습니다.
- source_word: חָרִם
  english_pob_choice: Harim
  chosen_korean: 하림
  alternatives_korean:
  - 하림
  lexicon: HNp
  rationale: 문맥상 인명/가문명 목록이므로 의미 번역이 아니라 음역이 적절합니다.
- source_word: בַּעֲנָה
  english_pob_choice: Baanah / Baana
  chosen_korean: 바아나
  alternatives_korean:
  - 바나
  - 바아나
  lexicon: HNp
  rationale: 히브리어의 이중 모음과 장모음을 비교적 그대로 살려 ‘바아나’로 옮겼습니다. 영어 POB의 Baanah에 대응하는 형태를 유지한 음역입니다.
