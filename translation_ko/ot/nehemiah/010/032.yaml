  source_fidelity: 초안은 שֶׁבֶר(곡식)를 별도의 판매 물품이 아니라 ‘짐’으로 잘못 옮겼고, ‘모든 곡식과 짐을 가지고 오면’은 히브리어의 구문을 충실히 반영하지 못합니다. 또한 마지막 절은 안식년의 경작 중단과 채무/청구의 면제를 함께 가리키는 것으로 보이므로, 한국어에서는 이를 분명하고 자연스럽게 표현할 필요가 있습니다.
  naturalness: ‘가지고 와서 팔며’와 ‘가지고 오면’이 중복되고 조건절 연결도 부자연스럽습니다. ‘팔려고 가져올 때에’가 원문의 분사와 목적 부정사를 자연스럽게 재현합니다. ‘사지 아니하며’는 현대 표준 합쇼체 문체에서는 ‘사지 않으며’가 더 적절합니다.
  terminology: ‘이 땅의 백성들’, ‘안식일’, ‘성일’, ‘일곱째 해’, ‘빚’은 적절합니다. 난해한 מַשָּׂא כָל־יָד의 대안은 ‘모든 청구’ 및 ‘모든 요구’로 제시할 수 있으며, 기존 각주의 중국어 문자 혼입은 반드시 수정되어야 합니다.
