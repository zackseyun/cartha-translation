base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
  footnotes:
  - marker: a
    text: Or 'for the wood offering.' The Hebrew preposition can be rendered either way; the sense is that lots were cast to assign responsibility for supplying the wood.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 제비를 뽑아 목재 공양에 대하여—제사장들, 레위 사람들, 그리고 백성이—우리 하나님의 집으로, 곧 우리 조상들의 집안대로, 정해진 때마다 해마다 가져다가, 야훼 우리 하나님의 제단 위에서 태우게 하였으니, 율법에 기록된 바와 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘목재 공양’은 본문의 קֻרְבַּן הָעֵצִים를 제의적 헌물로 본 번역입니다. עַל은 ‘대하여/관하여’의 뜻으로, 제비를 그 공양의 책임 배정과 관련하여 뽑았다는 의미를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  english_pob_choice: We cast lots
  chosen_korean: 우리는 제비를 뽑아
  alternatives_korean:
  - 우리는 제비들을 던져
  - 우리는 제비를 뽑았습니다
  lexicon: HALOT
  rationale: 히필 + גּוֹרָלוֹת의 관용구를 자연스러운 현대 한국어로 옮기되, 행위의 의미를 분명히 드러내기 위해 ‘제비를 뽑아’로 처리했습니다.
- source_word: עַל קֻרְבַּן הָעֵצִים
  english_pob_choice: concerning the wood offering
  chosen_korean: 목재 공양에 대하여
  alternatives_korean:
  - 나무 공양에 대하여
  - 목재 봉헌에 관하여
  lexicon: HALOT
  rationale: עַל의 행정적·주제적 용법을 살려 ‘대하여’로 옮겼고, קֻרְבַּן은 제의적 ‘공양’으로, הָעֵצִים은 실제 재료인 ‘목재’로 반영했습니다.
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  english_pob_choice: the priests, the Levites, and the people
  chosen_korean: 제사장들, 레위 사람들, 그리고 백성이
  alternatives_korean:
  - 제사장들, 레위인들, 그리고 백성이
  - 제사장들과 레위 사람들과 백성이
  lexicon: HALOT
  rationale: 세 집단의 병렬을 그대로 살렸고, לְבֵית אֲבֹתֵינוּ의 뒤쪽 문맥상 주어가 집단 전체임을 드러내기 위해 복수형으로 옮겼습니다.
- source_word: לְבֵית אֲבֹתֵינוּ
  english_pob_choice: according to our fathers’ houses
  chosen_korean: 우리 조상들의 집안대로
  alternatives_korean:
  - 우리 조상들의 가문대로
  - 우리 조상의 집안에 따라
  lexicon: HALOT
  rationale: 히브리어 관용구가 가문/씨족 단위를 뜻하므로, 한국어에서는 ‘집안’이 가장 자연스럽고 구조를 보존하는 대응입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유명사를 제목어로 바꾸지 않고, 프로젝트 기본값에 따라 신성명 יְהוָה를 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 공양 대상과 제단 행위의 제의적 표현
  chosen_reading: ‘목재 공양’과 ‘제단 위에서 태우다’로 옮겨, 단순한 물품 운반이 아니라 성전 제의의 책임 분담을 드러냈습니다.
  alternative_readings:
  - ‘나무 헌물’
  - ‘제단에서 태우다’
  rationale: 문맥은 제비뽑기로 책임을 배정해 성전 제의에 필요한 목재를 정기적으로 공급하는 규정이므로, 공양/제단의 제의성을 약화시키지 않는 표현이 적절합니다.
  doctrine_reference: Nehemiah 10의 성전 봉헌·질서 회복 문맥
- issue: 율법의 권위 표지
  chosen_reading: ‘율법에 기록된 바와 같습니다’로 번역해, 최종 근거가 모세 율법임을 명시했습니다.
  alternative_readings:
  - ‘율법에 적힌 대로’
  - ‘토라에 기록된 대로’
  rationale: כַּכָּתוּב בַּתּוֹרָה는 제의 규정의 성경적 정당성을 가리키므로, 한국어에서도 규범적 근거를 분명히 하는 표현이 가장 적합합니다.
  doctrine_reference: Torah as covenantal instruction
