revisions:
- from: 우리는 제비를 뽑아 목재 공양에 대하여—제사장들, 레위 사람들, 그리고 백성이—우리 하나님의 집으로, 곧 우리 조상들의 집안대로, 정해진 때마다 해마다 가져다가, 야훼 우리 하나님의 제단 위에서 태우게 하였으니, 율법에 기록된 바와 같습니다.[a]
  to: 우리는 제사장들과 레위인들과 백성이 우리 조상들의 집안별로 정해진 때마다 해마다 우리 하나님의 집으로 나무 헌물을 가져와 야훼 우리 하나님의 제단 위에서 태우도록, 나무 헌물에 관하여 제비를 뽑았습니다. 이는 율법에 기록된 대로입니다.[a]
  rationale: 제의적 헌물을 뜻하는 קֻרְבַּן은 현대 성서 한국어에 자연스러운 ‘헌물’로 옮기고, עַל의 가능한 ‘관하여/위하여’ 의미는 각주에서 보존했습니다. 세 집단이 조상들의 집안, 곧 가문 단위에 따라 정기적으로 나무를 공급하도록 제비를 뽑았다는 문장 관계를 명료하게 했습니다. 사역 의미를 제거하고 원문의 목적 표현과 율법 인용 표지를 자연스러운 합쇼체로 재구성했습니다.
