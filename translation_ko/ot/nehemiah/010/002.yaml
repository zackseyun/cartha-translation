base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/002.yaml
  text: And on the sealed document were Nehemiah the governor[a], son of Hacaliah[b], and Zedekiah.
  footnotes:
  - marker: a
    text: Or, more literally, 'the sealed ones'; the Hebrew likely refers to those whose names were on the sealed covenant document.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Tirshatha,' a Persian-period administrative title, traditionally transliterated rather than translated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 봉인된 문서[a]에는 학랴의 아들 느헤미야 총독[b]과 시드기야가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘봉인된 것들’입니다. 문맥상 봉인된 언약 문서, 또는 그 봉인에 참여한 이들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘티르솨타’로, 페르시아 시대의 행정 관직을 가리키는 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַחֲתוּמִים
  english_pob_choice: And on the sealed document
  chosen_korean: 그리고 봉인된 문서 위에는
  alternatives_korean:
  - 그리고 봉인된 자들 위에는
  - 그리고 봉인된 자들에 관하여
  lexicon: HALOT
  rationale: הַחֲתוּמִים는 형태상 ‘봉인된 것들/사람들’이지만, 문맥상 서명된 언약 문서를 가리키는 집합적 표현으로 읽히므로 ‘봉인된 문서 위에는’이 가장 자연스럽고 원문에 가깝습니다.
- source_word: הַתִּרְשָׁתָא
  english_pob_choice: the governor
  chosen_korean: 총독
  alternatives_korean:
  - 티르솨타
  - 행정관
  lexicon: HALOT
  rationale: 페르시아 시대의 관직 명칭이므로 의미를 살려 ‘총독’으로 옮겼습니다. 전통적 음역은 본문보다 주석에서 보완하는 것이 적절합니다.
- source_word: חֲכַלְיָה
  english_pob_choice: Hacaliah
  chosen_korean: 학랴의
  alternatives_korean:
  - 하칼랴의
  - 하갈랴의
  lexicon: standard transliteration
  rationale: 인명은 현대 한국어 음역 관행에 따라 옮겼습니다. 영어 본문의 Hacaliah에 대응하는 표기로 ‘학랴’가 가장 안정적입니다.
- source_word: וְצִדְקִיָּה
  english_pob_choice: and Zedekiah
  chosen_korean: 그리고 스가냐가
  alternatives_korean:
  - 그리고 시드기야가
  - 그리고 세드기야가
  lexicon: standard transliteration
  rationale: 열거된 또 하나의 이름이므로 접속사까지 살려 자연스럽게 옮겼습니다. 인명은 한국어 성경에서 통용되는 음역을 우선했습니다.
theological_decisions:
- issue: הַחֲתוּמִים의 문법형과 문맥 의미
  chosen_reading: 봉인된 문서 위에 선 이름 목록으로 이해해, 문서 자체와 그 위의 서명자들을 함께 드러내는 표현으로 번역했습니다.
  alternative_readings:
  - ‘봉인된 자들’
  - ‘봉인한 자들’
  rationale: 히브리어는 문자적으로는 ‘봉인된 것들/사람들’이지만, 문맥상 언약문서의 서명 명단을 가리키는 행정적 표현입니다. 의미를 과도하게 일반화하지 않으면서도 한국어에서 이해 가능한 형태로 유지했습니다.
  doctrine_reference: 본문 문맥 해석(언약 문서/서명 명단)
