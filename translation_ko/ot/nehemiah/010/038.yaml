revisions:
- from: 우리는 우리 반죽의 첫 것을, 우리의 예물과 모든 나무의 열매와 새 포도주와 기름을 제사장들에게, 곧 우리 하나님의 집 곁방들로 가져오고, 우리 땅의 십일조는 레위인들에게 가져오겠습니다. 레위인들은 우리가 일하는 모든 성읍에서 십일조를 거두는 사람들이기 때문입니다.[a][b][c]
  to: 우리는 우리 반죽의 첫 몫[a]과 우리의 예물과 모든 나무의 열매와 새 포도주와 기름을 제사장들에게, 우리 하나님의 집의 방들[b]로 가져오겠습니다. 또 우리 땅의 십일조를 레위인들에게 가져오겠습니다. 레위인들이 우리가 일하는 모든 성읍[c]에서 십일조를 거두는 이들이기 때문입니다.
  rationale: The revision preserves the Hebrew’s offering list and covenantal future commitment while correcting the relationship between the priests and temple chambers. It replaces the over-specific ‘곁방들’ with the broader ‘방들,’ removes the incorrect appositional ‘곧,’ repairs the footnote language, and places anchors at their relevant terms. The final clause remains moderately interpretive but is explicitly qualified in a footnote because עֲבֹדָתֵנוּ is compressed and may mean work, service, or labor.
  reviewer_model: gpt-5.6-terra
