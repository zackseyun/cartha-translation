  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
  footnotes:
  - marker: a
    text: Or 'our offerings'; the Hebrew term can denote a sacred contribution set apart for priestly use.
    reason: lexical_alternative
  - marker: b
    text: Or 'storerooms' for 'chambers.' The Hebrew refers to rooms in the temple complex, often used for storage.
    reason: lexical_alternative
  - marker: c
    text: Or 'in all the cities of our service/work.' The Hebrew expression is somewhat compressed and may refer to the towns associated with the people's agricultural labor.
    reason: alternative_reading
translation:
  language: ko
  text: 우리는 우리 반죽의 첫 몫[a]과 우리의 예물과 모든 나무의 열매와 새 포도주와 기름을 제사장들에게, 우리 하나님의 집의 방들[b]로 가져오겠습니다. 또 우리 땅의 십일조를 레위인들에게 가져오겠습니다. 레위인들이 우리가 일하는 모든 성읍[c]에서 십일조를 거두는 이들이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘반죽의 첫 몫’은 히브리어를 가깝게 옮긴 표현입니다. ‘반죽의 첫 것’ 또는 더 넓게 ‘첫 소출’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘방들’은 성전 건물 안의 방들을 가리키며, 저장 공간으로 사용되기도 했습니다. ‘성전 방들’ 또는 ‘창고방들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘우리의 일[봉사]의 모든 성읍에서’입니다. 이 압축된 표현은 백성의 농경 노동과 관련된 성읍들을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  english_pob_choice: the first of our dough
  chosen_korean: 우리 반죽의 첫 것
  alternatives_korean:
  - 우리 반죽의 첫 몫
  - 우리 반죽의 첫 소출
  lexicon: HALOT
  rationale: עֲרִיסָה는 일반적인 ‘반죽’이며, רֵאשִׁית는 그 첫 몫/첫 부분을 뜻하므로 ‘첫 소출’보다 구체적이고 문자적인 ‘첫 것’이 source에 가깝습니다.
- source_word: תְּרוּמֹתֵינוּ
  english_pob_choice: our contributions
  chosen_korean: 우리의 예물
  alternatives_korean:
  - 우리의 공물
  - 우리의 거제물
  lexicon: HALOT
  rationale: תְּרוּמָה는 구별하여 드리는 헌납물이라는 점을 살리되, 한국어에서는 ‘예물’이 가장 자연스럽고 과도한 제의 용어화도 피합니다.
- source_word: לִשְׁכוֹת
  english_pob_choice: the chambers
  chosen_korean: 곁방들
  alternatives_korean:
  - 방들
  - 창고방들
  lexicon: HALOT
  rationale: 성전 परिसर의 기능적 방들을 가리키므로 ‘곁방들’이 공간적 의미를 살리면서도, 본문의 저장 기능을 지나치게 좁히지 않습니다.
- source_word: תִּירוֹשׁ
  english_pob_choice: the new wine
  chosen_korean: 새 포도주
  alternatives_korean:
  - 새 술
  - 포도주
  lexicon: HALOT
  rationale: תִּירוֹשׁ는 포도 수확의 새 포도주를 가리키는 경우가 많아, 한국어에서도 ‘새 포도주’가 농경적 뉘앙스를 가장 잘 보존합니다.
- source_word: יִצְהָר
  english_pob_choice: the oil
  chosen_korean: 기름
  alternatives_korean:
  - 올리브 기름
  - 감람유
  lexicon: HALOT
  rationale: 문맥상 일반적으로 올리브 기름을 가리키지만, 히브리어 자체는 단순히 ‘기름’이므로 과도한 구체화 없이 번역했습니다.
- source_word: הַמְעַשְּׂרִים
  english_pob_choice: collect the tithes
  chosen_korean: 십일조를 거두는 사람들
  alternatives_korean:
  - 십일조를 받는 사람들
  - 십일조를 취하는 사람들
  lexicon: HALOT
  rationale: 분사형의 행위자를 드러내어 레위인의 기능을 분명히 했고, ‘거두다’가 한국어에서 세금/공물 수납의 행정적 뉘앙스를 잘 전달합니다.
theological_decisions:
- issue: 레위인들의 역할을 설명하는 יחס절의 처리
  chosen_reading: 레위인들은 우리가 일하는 모든 성읍에서 십일조를 거두는 사람들입니다.
  alternative_readings:
  - 레위인들은 우리가 수고하는 모든 성읍에서 십일조를 거두는 사람들입니다.
  - 레위인들은 우리 노동의 모든 성읍에서 십일조를 거두는 사람들입니다.
  rationale: עֲבֹדָה는 여기서 농경적 노동/일을 가리킬 가능성이 높아, ‘일하는’으로 옮기면 의미를 과장하지 않으면서도 문맥을 자연스럽게 살립니다.
  doctrine_reference: 본문의 언약적 헌신과 성전 봉사에 관한 역사서 맥락
