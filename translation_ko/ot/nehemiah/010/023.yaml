  lexicon: 고유명사
  rationale: 히브리어 인명은 번역하지 않고 음역하는 것이 원문에 가장 충실하므로, 영어 POB의 Pelatiah에 대응하는 표준적인 한국어 음역을 사용했습니다.
- source_word: חָנָן
  english_pob_choice: Hanan
