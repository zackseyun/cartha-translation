  - 한ан
  - 한난
  lexicon: 고유명사
  rationale: 히브리어 인명 Hanan은 한국어 성서 표기 관행에 따라 하난으로 옮기는 것이 가장 자연스럽습니다.
- source_word: עֲנָיָה
  english_pob_choice: Anaiah
  chosen_korean: 아나야
  alternatives_korean:
  - 아니야
  - 아나이야
  lexicon: 고유명사
  rationale: 같은 어근의 다른 인명들과 구별되도록, 영어 POB의 Anaiah에 대응하는 관용적 음역을 택했습니다.
theological_decisions:
