  chosen_reading: 한국어에서는 열거형 문장으로 옮겨, 인물 목록이라는 성격을 분명히 했습니다.
  alternative_readings:
  - 문장 성분을 풀어 쓰지 않고 이름만 쉼표로 나열
  - 각 이름 뒤에 조사 없이 단순 병렬
  rationale: 본문이 의미 전달보다 명단 제시에 목적이 있으므로, 과잉 설명 없이 간결한 열거로 재현하는 것이 원문 의도를 가장 잘 보존합니다.
  doctrine_reference: 본문 성격 반영(명단/열거)
