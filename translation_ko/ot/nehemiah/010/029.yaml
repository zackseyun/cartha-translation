  source_fidelity: 현 초안은 מֵעַמֵּי הָאֲרָצוֹת אֶל תּוֹרַת הָאֱלֹהִים의 두 방향을 모두 ‘…에서/…으로부터’로 처리하여, 사람들이 여러 땅의 민족들에게서 떠나 하나님의 율법을 향하였다는 핵심 관계를 역전합니다. 또한 이 절은 다음 절로 이어지는 명사구인데 ‘이었습니다’로 완결해 본문의 연결을 훼손합니다.
