  text: וּ/שְׁאָ֣ר הָ/עָ֡ם הַ/כֹּהֲנִ֣ים הַ֠/לְוִיִּם הַ/שּׁוֹעֲרִ֨ים הַ/מְשֹׁרְרִ֜ים הַ/נְּתִינִ֗ים וְֽ/כָל הַ/נִּבְדָּ֞ל מֵ/עַמֵּ֤י הָ/אֲרָצוֹת֙ אֶל תּוֹרַ֣ת הָ/אֱלֹהִ֔ים נְשֵׁי/הֶ֖ם בְּנֵי/הֶ֣ם וּ/בְנֹתֵי/הֶ֑ם כֹּ֖ל יוֹדֵ֥עַ מֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
  footnotes:
  - marker: a
    text: Or “the Nethinim,” a traditional transliteration for a class of temple servants.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew uses masculine singular forms with collective force: “everyone who had separated himself … everyone who knew and understood.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 남은 백성—제사장들, 레위 사람들, 문지기들, 찬양하는 사람들, 성전 봉사자들, 그리고 모든 이방 민족들에서 하나님의 율법으로부터 자신을 분리해 낸 모든 사람—그들의 아내들과 아들들과 딸들, 곧 알고 깨닫는 모든 사람이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 단수형을 집합적으로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘느디님’은 성전 봉사자 집단을 가리키는 전통 음역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  english_pob_choice: and the rest of the people
  chosen_korean: 남은 백성
  alternatives_korean:
  - 그리고 백성의 나머지
  - 그리고 그 민족의 나머지
  lexicon: HALOT
  rationale: שְׁאָר는 ‘남은/나머지’의 뜻이고, עָם은 여기서 언약 공동체를 가리키므로 ‘백성’이 가장 자연스럽습니다.
- source_word: הַשּׁוֹעֲרִים / הַמְשֹׁרְרִים / הַנְּתִינִים
  english_pob_choice: the gatekeepers / the singers / the temple servants
  chosen_korean: 문지기들 / 찬양하는 사람들 / 성전 봉사자들
  alternatives_korean:
  - 문지기들 / 노래하는 사람들 / 느디님들
  - 문지기들 / 음악하는 사람들 / 성전 일꾼들
  lexicon: HALOT
  rationale: 각 직분의 기능을 살려 옮겼습니다. ‘성전 봉사자들’은 הַנְּתִינִים을 현대 독자가 이해할 수 있게 의미 중심으로 풀어 준 표현입니다.
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת
  english_pob_choice: and all who had separated themselves from the peoples of the lands
  chosen_korean: 그리고 모든 이방 민족들에서… 자신을 분리해 낸 모든 사람
  alternatives_korean:
  - 그리고 땅들의 민족들에서 분리된 모든 사람
  - 그리고 그 땅의 여러 민족들에게서 떠나 구별된 모든 사람
  lexicon: HALOT
  rationale: ‘분리해 낸’은 נבדל의 능동적·자기분리 뉘앙스를 살립니다. מֵעַמֵּי הָאֲרָצוֹת은 여러 민족 집단을 가리키므로 ‘이방 민족들’로 옮겼습니다.
- source_word: כֹּל יוֹדֵעַ מֵבִין
  english_pob_choice: everyone who knew and understood
  chosen_korean: 알고 깨닫는 모든 사람
  alternatives_korean:
  - 알고 이해하는 모든 사람
  - 아는 바를 깨닫는 모든 사람
  lexicon: HALOT
  rationale: 두 분사의 병렬을 자연스러운 현대 한국어로 압축하되, 단순 지식이 아니라 분별 가능한 이해를 함께 담았습니다.
theological_decisions:
- issue: 히브리어의 집합적 단수와 성별 표지
  chosen_reading: ‘자신을 분리해 낸 모든 사람’과 ‘알고 깨닫는 모든 사람’으로 자연화하되, 집합적 의미는 전체 문맥으로 보존했습니다.
  alternative_readings:
  - 자신을 분리해 낸 모든 이들
  - 자신을 분리한 자들
  rationale: 본문은 문법적으로 남성 단수형을 쓰지만 집합적 의미를 가지므로, 한국어에서는 과도한 성별 표지를 피하면서도 공동체 전체를 가리키는 뜻을 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: הַנְּתִינִים의 처리
  chosen_reading: ‘느디님’ 음역 대신 ‘성전 봉사자들’로 번역했습니다.
  alternative_readings:
  - 느디님들
  - 성전 일꾼들
  rationale: 직분의 기능이 본문 이해에 중요하므로, 현대 독자가 곧바로 파악할 수 있는 의미역을 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 6
