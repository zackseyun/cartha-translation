source:
  edition: WLC
  text: בְּנֵי יַעְלָ֥א בְנֵי דַרְק֖וֹן בְּנֵ֥י גִדֵּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/058.yaml
  text: the sons of Jaala[a], the sons of Darkon, the sons of Giddel.
  footnotes:
  - marker: a
    text: Some English versions spell the first name 'Jaalah,' reflecting a variant spelling tradition and comparison with the parallel list in Ezra 2:56.
    reason: alternative_reading
translation:
  language: ko
  text: 야알라의 자손들과 다르곤의 자손들과 깃델의 자손들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영어 POB의 각주처럼, 이 이름은 비교 본문(에스라 2:56)과 철자 전승을 따라 ‘야알라’ 대신 ‘야알라흐’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
  alternatives_korean:
  - 아들들
  - 후손들
  lexicon: HALOT
  rationale: 이 절은 포로기 이후 족보·명단 형식이므로, 문자적 ‘아들들’보다 집단·가문을 드러내는 ‘자손들’이 한국어에서 자연스럽고 원문 기능을 잘 반영합니다.
- source_word: יַעְלָא
  english_pob_choice: Jaala
  chosen_korean: 야알라
  alternatives_korean:
  - 자알라
  - 야알라흐
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 적절하며, 영어 POB의 ‘Jaala’에 해당하는 히브리어 자음·모음값을 따라 ‘야알라’로 옮겼습니다.
- source_word: דַרְקוֹן
  english_pob_choice: Darkon
  chosen_korean: 다르곤
  alternatives_korean:
  - 다르콘
  lexicon: HALOT
  rationale: 고유명사를 음역했으며, 한국어 외래어 표기에서는 어말 -on을 ‘-곤’으로 옮기는 것이 더 자연스럽습니다.
- source_word: גִדֵּל
  english_pob_choice: Giddel
  chosen_korean: 깃델
  alternatives_korean:
  - 기델
  - 길델
  lexicon: HALOT
  rationale: 고유명사 음역입니다. 겹자음과 모음값을 반영해 ‘깃델’로 옮겨 원문의 발음을 비교적 가깝게 살렸습니다.
