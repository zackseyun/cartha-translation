    issue: ‘백성의 몇몇 족장들’은 רָאשֵׁי הָאָבוֹת의 가문/조상 집단 지시를 약화합니다.
    rationale: 원문은 단순히 백성 전체의 지도자들이 아니라 ‘조상 가문들’의 우두머리들을 가리킵니다.
