  source_fidelity: 수정이 필요합니다. רָאשֵׁי הָאָבוֹת는 일반적인 ‘백성의 족장들’보다 ‘조상 가문의 우두머리들/가문 지도자들’이라는 사회 단위를 가리킵니다. כָּתְנוֹת는 현대 한국어의 ‘속옷’으로 옮기면 지나치게 협소하고 오해를 낳을 수 있으므로 ‘긴 옷’이 적절합니다. מִזְרָקוֹת는 제의 용기의 성격을 고려해 ‘대접’으로 옮겼습니다.
  naturalness: ‘조상 가문의 우두머리들 가운데 몇몇’과 ‘그 일에 헌납하였습니다’는 원문의 부분성 및 목적을 자연스럽게 반영합니다. ‘국고’는 현대 국가 재정을 연상시킬 수 있어 문맥상 ‘보물창고’로 수정했습니다.
  terminology: ‘총독’은 הַתִּרְשָׁתָא의 적절한 번역이며, 음역 대안은 각주로 유지했습니다. ‘금 다릭’은 페르시아 금화 명칭을 보존합니다. ‘제사장들의 긴 옷’은 כָּתְנוֹת의 의복 의미를 유지하면서 ‘속옷’의 현대적 함의를 피합니다.
  issues:
