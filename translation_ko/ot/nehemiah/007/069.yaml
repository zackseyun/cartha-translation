id: NEH.7.69
reference: Nehemiah 7:69
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִ/קְצָת֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת נָתְנ֖וּ לַ/מְּלָאכָ֑ה הַ/תִּרְשָׁ֜תָא נָתַ֣ן לָ/אוֹצָ֗ר זָהָ֞ב דַּרְכְּמֹנִ֥ים אֶ֨לֶף֙ מִזְרָק֣וֹת חֲמִשִּׁ֔ים כָּתְנוֹת֙ כֹּֽהֲנִ֔ים שְׁלֹשִׁ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
  footnotes:
  - marker: a
    text: Hebrew reads 'five hundred thirty-five priests’ tunics.' The parallel in Ezra 2:69 reads 'one hundred priests’ tunics,' and some translations harmonize or reflect a different textual tradition.
    reason: textual_variant
  - marker: b
    text: Or 'the Tirshatha,' a Persian administrative title.
    reason: lexical_alternative
  - marker: c
    text: That is, Persian gold darics.
    reason: cultural_note
translation:
  language: ko
  text: 또한 조상 가문의 우두머리들 가운데 몇몇은 그 일에 헌납하였습니다. 총독[b]은 보물창고에 금 다릭 천 개[c], 대접 쉰 개, 제사장들의 긴 옷 오백서른다섯 벌[a]을 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘제사장들의 긴 옷 오백서른다섯 벌’이라고 합니다. 병행 본문인 에스라 2:69은 ‘제사장들의 긴 옷 백 벌’이라고 하며, 일부 번역은 이를 조화시키거나 다른 본문 전승을 반영합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘티르사타’. 페르시아 행정 관직명입니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 페르시아 금화 다릭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  english_pob_choice: And some of the heads of the fathers’ houses
  chosen_korean: 백성의 몇몇 족장들
  alternatives_korean:
  - 조상의 집안의 몇몇 우두머리들
  - 몇몇 조상 가문의 대표들
  lexicon: HALOT
  rationale: ‘머리들’의 직역보다 한국어에서 자연스럽고, 문맥상 가문/족장 집단을 가리키는 표현으로 ‘족장들’이 가장 투명합니다.
- source_word: לַמְּלָאכָה
  english_pob_choice: to the work
  chosen_korean: 일을 위해
  alternatives_korean:
  - 그 일에
  - 그 공사에
  lexicon: HALOT
  rationale: 여기서는 성전/성벽 관련 헌납의 목적을 가리키므로, ‘일’이 원문의 포괄적 의미를 무리 없이 살립니다.
- source_word: הַתִּרְשָׁתָא
  english_pob_choice: the governor
  chosen_korean: 총독
  alternatives_korean:
  - 티르사타
  - 페르시아 총독
  lexicon: HALOT
  rationale: POB의 결정을 따라 관직명을 뜻이 드러나게 번역했습니다. ‘티르사타’는 각주로 보존합니다.
- source_word: לָאוֹצָר
  english_pob_choice: to the treasury
  chosen_korean: 국고에
  alternatives_korean:
  - 보물창고에
  - 창고에
  lexicon: HALOT
  rationale: 금품 헌납 문맥에서 ‘국고’가 가장 자연스럽고, 저장소보다 재정적 귀속이 분명합니다.
- source_word: דַּרְכְּמֹנִים
  english_pob_choice: gold darics
  chosen_korean: 금 다릭
  alternatives_korean:
  - 금 드라크마
  - 금화
  lexicon: HALOT
  rationale: 페르시아 금화를 가리키는 고유 명칭이므로 음역을 유지하되, ‘금’으로 재질을 살렸습니다.
- source_word: כָּתְנוֹת כֹּהֲנִים
  english_pob_choice: priests’ tunics
  chosen_korean: 제사장들의 속옷
  alternatives_korean:
  - 제사장들의 튜닉
  - 제사장 예복
  lexicon: HALOT
  rationale: כָּתְנוֹת는 몸에 입는 속옷/속옷 겸 겉옷 성격의 옷으로, 한국어에서는 ‘속옷’이 가장 직접적으로 대응됩니다. 전통적 ‘예복’은 의미를 넓혀 버립니다.
theological_decisions:
- issue: 헌납의 성격과 동사 선택
  chosen_reading: ‘바쳤습니다’와 ‘헌납하였습니다’를 사용해 자원 헌물의 성격을 드러냈습니다.
  alternative_readings:
  - 주었습니다
  - 드렸습니다
  rationale: 원문은 단순한 전달보다 성전/공사 자금과 물품의 헌납을 강조하므로, 한국어에서도 헌납의 뉘앙스를 살렸습니다.
  doctrine_reference: 공동체의 성전 재건과 예물 헌납의 문맥
