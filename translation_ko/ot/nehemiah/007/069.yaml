  to: 또한 조상 가문의 우두머리들 가운데 몇몇은 그 일에 헌납하였습니다. 총독[b]은 보물창고에 금 다릭 천 개[c], 대접 쉰 개, 제사장들의 긴 옷 오백서른다섯 벌[a]을 바쳤습니다.
