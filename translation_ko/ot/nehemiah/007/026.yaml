translation:
  language: ko
  text: 베들레헴과 느도바 사람들[a]이 모두 백여든여덟 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘베들레헴과 느도바의 남자들’이라고 되어 있습니다. 이와 같은 명단 표현에서는 ‘사람들’로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  english_pob_choice: the men of
  chosen_korean: 사람들
  alternatives_korean:
  - 남자들
  - 남정네들
  - 백성
  lexicon: HALOT
  rationale: 족보·귀환 명단의 관용구에서 האנשים/אַנְשֵׁי는 특정 지역에 속한 집단을 가리키므로, 한국어에서는 성별을 지나치게 드러내지 않는 ‘사람들’로 자연스럽게 옮기되 주석으로 히브리어의 문자적 표현을 밝혔습니다.
- source_word: בֵית לֶחֶם
  english_pob_choice: Bethlehem
  chosen_korean: 베들레헴
  alternatives_korean:
  - 베들레헴 성
  - 베들레헴 사람들
  lexicon: HALOT
  rationale: 지명은 한국어에서 확립된 음역형 ‘베들레헴’을 사용했습니다.
- source_word: וּנְטֹפָה
  english_pob_choice: and Netophah
  chosen_korean: 느도바
  alternatives_korean:
  - 느도바 사람들
  - 네토바
  - 느도바와
  lexicon: HALOT
  rationale: 지명으로 이해되는 נטופה는 한국어 성경에서 통용되는 음역형 ‘느도바’를 택했고, 앞의 집단 표현을 살려 문장에서는 함께 묶었습니다.
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  english_pob_choice: one hundred eighty-eight
  chosen_korean: 백여든여덟 명
  alternatives_korean:
  - 일백팔십팔 명
  - 188명
  lexicon: HALOT
  rationale: 히브리어 수사는 188이므로, 현대 한국어에서는 읽기 쉬운 ‘백여든여덟 명’으로 옮겼습니다.
theological_decisions:
- issue: 인구/귀환 명단의 집단 표지 표현
  chosen_reading: ‘the men of’의 직역 구조를 유지하되 한국어에서는 자연스러운 집단명 ‘사람들’로 처리했습니다.
  alternative_readings:
  - ‘남자들’로 성별을 분명히 드러내는 번역
  - ‘백성’으로 일반화하는 번역
  rationale: 본문은 지역별 귀환자 집계를 보여 주는 명단으로, 히브리어의 남성형 관용구를 무리 없이 살리면서도 한국어 독자에게는 집단 소속을 우선 이해시키는 것이 적절합니다.
  doctrine_reference: 문맥상 역사 기록/명단 번역 원칙
