  lexicon: HALOT
  rationale: 고유명사는 음역하되, 현대 한국어 음역 관행에 맞춰 ‘Gazzam’을 ‘가잠’으로 옮겼습니다.
- source_word: עֻזָּא
  english_pob_choice: Uzza
  chosen_korean: 우자
  alternatives_korean:
