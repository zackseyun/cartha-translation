    text: 또는 각 경우의 ‘아들들’을 ‘후손들’로 옮길 수 있습니다. 히브리어 족보 공식은 직계 남자 자녀뿐 아니라 더 넓은 가계 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손
  alternatives_korean:
  - 아들들
  - 후손들
  - 가문의 사람들
  lexicon: HALOT
  rationale: 족보·명단 문맥에서 בְּנֵי는 직계 아들보다 더 넓은 계보를 가리킬 수 있어, 한국어에서는 의미를 살리되 자연스러운 ‘자손’으로 옮겼습니다.
