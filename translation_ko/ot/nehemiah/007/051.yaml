theological_decisions:
- issue: 족보 공식 בְּנֵי의 범위
  chosen_reading: ‘자손’으로 번역해 즉시적 아들 관계보다 계보 전체를 드러냈습니다.
  alternative_readings:
  - 직역하여 ‘아들들’로 옮김
  - ‘가문의 사람들’로 풀어 옮김
  rationale: 이 절은 인물 열거 형식의 족보 목록이므로, 한국어에서 오해 없이 계보적 소속을 나타내는 표현이 가장 적절합니다.
  doctrine_reference: 족보/계보 본문의 일반적 번역 원칙
