  rationale: 고유명사는 한국어 음역으로 옮기며, 영어 POB의 표기를 기준으로 ‘Uzza’를 ‘우자’로 처리했습니다.
- source_word: פָסֵחַ
  english_pob_choice: Paseah
  chosen_korean: 바세아
  alternatives_korean:
  - 파세아
