  terminology: '‘자손’ suitably conveys בְּנֵי in this list context without artificially restricting it to literal male children. The names should follow established Korean biblical forms where these also adequately represent the Hebrew: ‘바슬릿,’ ‘므히다,’ and ‘하르사.’'
  issues:
