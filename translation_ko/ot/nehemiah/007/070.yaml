  source_fidelity: 원문의 וּמֵרָאשֵׁי הָאָבוֹת는 단순히 ‘가문들 가운데 일부’가 아니라 ‘가문 우두머리들 가운데 일부’를 뜻합니다. 또한 שְׁתֵּי רִבּוֹת는 이만(20,000)이고, אַלְפַּיִם וּמָאתָיִם는 이천이백(2,200)입니다. 초안의 ‘스무만’과 ‘천이백이십’은 각각 원문의 수량과 맞지 않습니다.
  naturalness: ‘조상 가문의 우두머리들 가운데 일부’와 ‘그 일을 위한 재정에’는 현대 표준 한국어의 격식 있는 문체에서 자연스럽고, 원문의 행정·재정 문맥을 유지합니다.
  terminology: 다릭과 마네는 역사적 화폐·중량 단위로 음역을 유지하는 것이 적절합니다. ‘재정’은 여기서 기부금이 들어가는 treasury를 자연스럽게 나타냅니다.
