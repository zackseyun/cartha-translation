id: NEH.7.70
reference: Nehemiah 7:70
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מֵֽ/רָאשֵׁ֣י הָֽ/אָב֗וֹת נָֽתְנוּ֙ לְ/אוֹצַ֣ר הַ/מְּלָאכָ֔ה זָהָ֕ב דַּרְכְּמוֹנִ֖ים שְׁתֵּ֣י רִבּ֑וֹת וְ/כֶ֕סֶף מָנִ֖ים אַלְפַּ֥יִם וּ/מָאתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
  footnotes:
  - marker: a
    text: A daric was a Persian gold coin.
    reason: cultural_note
  - marker: b
    text: Or, more literally, 'from the heads of the fathers’ houses.'
    reason: lexical_alternative
  - marker: c
    text: A mina was an ancient unit of weight, and by extension of monetary value.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 아버지들의 가문들 가운데 일부가 그 일의 재정을 위해 보물창고에 금 다릭 스무만 개와 은 천이백 이십 마네를 드렸습니다[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다릭은 페르시아의 금화입니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 '아버지들의 가문들 가운데에서'라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마네는 고대의 무게 단위로, 곧 화폐 가치 단위로도 쓰였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  english_pob_choice: And some of the heads of the fathers’ houses
  chosen_korean: 아버지들의 가문들 가운데 일부
  alternatives_korean:
  - 아버지들의 가문들의 우두머리들 가운데 일부
  - 가문 우두머리들 가운데 일부
  - 아버지들의 집안의 우두머리들 가운데 일부
  lexicon: HALOT
  rationale: מן이 포함된 표현을 영어 POB가 'some of the heads'로 이해한 점을 따라, 한국어도 '가운데 일부'로 수량적 뉘앙스를 살렸습니다. הָאָבוֹת는 족장 단위의 사회 구조를 가리키므로 '가문들'로 옮겨 혈연-행정적 구조를 유지했습니다.
- source_word: לְאוֹצַר הַמְּלָאכָה
  english_pob_choice: to the treasury for the work
  chosen_korean: 그 일의 재정을 위해 보물창고에
  alternatives_korean:
  - 그 일의 창고에
  - 일을 위한 재정고에
  - 그 공사의 창고에
  lexicon: HALOT
  rationale: אוֹצָר는 단순한 저장고보다 가치 있는 것을 모아 두는 장소이므로 문맥상 '보물창고'가 적절합니다. הַמְּלָאָכָה는 프로젝트 자금 조달의 목적을 가리켜 '그 일의 재정'으로 풀었습니다.
- source_word: דַּרְכְּמוֹנִים
  english_pob_choice: darics
  chosen_korean: 금 다릭
  alternatives_korean:
  - 다릭
  - 페르시아 금화
  - 금화
  lexicon: HALOT
  rationale: 페르시아 금화라는 역사적 단위를 보존하기 위해 음역 '다릭'을 살리고, 원문과 영어 POB의 'gold darics'에 맞춰 '금'을 덧붙였습니다.
- source_word: שְׁתֵּי רִבּוֹת
  english_pob_choice: twenty thousand
  chosen_korean: 스무만
  alternatives_korean:
  - 이만
  - 이만 개
  - 2만
  lexicon: HALOT
  rationale: 히브리어의 '두 만'을 현대 한국어 수사법으로 자연스럽게 풀어 '스무만'으로 옮겼습니다. 단위 표현과 함께 읽혀 총액의 규모가 즉시 드러납니다.
- source_word: מָנִים
  english_pob_choice: minas
  chosen_korean: 마네
  alternatives_korean:
  - 미나
  - 마나
  - 민a
  lexicon: HALOT
  rationale: 고대 중량-화폐 단위인 mina를 한국어 음역 '마네'로 표기해 역사성을 유지했습니다. 영어 POB의 주석상 단위 설명이 필요하므로 본문에서는 단위명만 간결히 두었습니다.
