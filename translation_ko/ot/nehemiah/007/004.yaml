source:
  edition: WLC
  text: וְ/הָ/עִ֞יר רַחֲבַ֤ת יָדַ֨יִם֙ וּ/גְדוֹלָ֔ה וְ/הָ/עָ֥ם מְעַ֖ט בְּ/תוֹכָ֑/הּ וְ/אֵ֥ין בָּתִּ֖ים בְּנוּיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/004.yaml
  text: Now the city was wide and large[a], but the people within it were few, and no houses had been built.
  footnotes:
  - marker: a
    text: Or 'And the city was broad and large ... and the people were few in it, and there were no houses built.' The Hebrew is more formally coordinate; the main text smooths the syntax into natural English while preserving the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 성읍은 넓고 컸으나 그 가운데 백성은 적었고, 집들도 아직 세워지지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 성읍은 넓고 크며, 그 가운데 백성은 적고, 지어진 집이 없었습니다.” 히브리어는 더 대등한 연결 구조를 이루지만, 본문은 한국어 문장 흐름에 맞게 다듬었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִיר רַחֲבַת יָדַיִם וּגְדוֹלָה
  english_pob_choice: Now the city was wide and large
  chosen_korean: 그 성읍은 넓고 컸으나
  alternatives_korean:
  - 그 성읍은 넓고 컸습니다
  - 그리고 그 성읍은 넓고 컸으나
  lexicon: HALOT
  rationale: רַחֲבַת יָדַיִם은 공간적 넓이를, וּגְדוֹלָה는 크기를 가리키므로 한국어에서는 ‘넓고 컸다’로 간결하게 살렸습니다.
- source_word: וְהָעָם מְעַט בְּתוֹכָהּ
  english_pob_choice: but the people within it were few
  chosen_korean: 그 가운데 백성은 적었고
  alternatives_korean:
  - 그 안에 백성은 적었고
  - 그 가운데 사람들이 적었고
  lexicon: HALOT
  rationale: מְעַט은 수량의 적음을 뜻하므로 ‘적었고’로 옮겼고, בְּתוֹכָהּ은 ‘그 가운데’로 자연스럽게 나타냈습니다.
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  english_pob_choice: and no houses had been built
  chosen_korean: 집들도 아직 세워지지 않았습니다
  alternatives_korean:
  - 집들도 지어지지 않았습니다
  - 집들이 아직 세워지지 않았습니다
  lexicon: HALOT
  rationale: בָּתִּים בְּנוּיִם은 ‘세워진/지어진 집들’의 부재를 말하므로, 문맥상 미복구 상태를 드러내는 ‘아직 세워지지 않았습니다’로 옮겼습니다.
theological_decisions:
- issue: 도시의 큼과 백성의 적음을 대비하는 서술의 뉘앙스
  chosen_reading: 큰 성읍이지만 거주 인구가 적고 주거가 아직 갖추어지지 않은 상태로 읽었습니다.
  alternative_readings:
  - 단순한 인구 통계 설명으로만 읽기
  - 폐허 상태를 지나치게 강조하기
  rationale: 본문은 물리적 규모와 실제 점유 상태의 간극을 대비하며, 포로기 이후 예루살렘의 재건이 아직 완료되지 않았음을 암시합니다.
  doctrine_reference: 포로 귀환 이후의 회복 서사
