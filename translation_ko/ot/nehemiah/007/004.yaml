  text: Now the city was wide and large[a], but the people within it were few, and no houses had been built.
  footnotes:
  - marker: a
    text: Or 'And the city was broad and large ... and the people were few in it, and there were no houses built.' The Hebrew is more formally coordinate; the main text smooths the syntax into natural English while preserving the sense.
