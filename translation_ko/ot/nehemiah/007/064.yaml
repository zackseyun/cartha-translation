source:
  edition: WLC
  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑א וַ/יְגֹֽאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
  footnotes:
  - marker: a
    text: Or 'their genealogical record'; the Hebrew refers to a written document establishing lineage.
    reason: lexical_alternative
  - marker: b
    text: Or 'they were disqualified from the priesthood.' The Hebrew verb here conveys exclusion from priestly status because their ancestry could not be verified.
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 족보 명부에서 자신들의 기록을 찾았으나[a], 그것이 발견되지 않았으므로 제사장직에서 제외되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 족보 기록’입니다. 히브리어는 혈통을 입증하는 문서 자체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 제사장직에서 자격을 박탈당했습니다’입니다. 이 동사는 혈통을 확인할 수 없어서 제사장 신분에서 제외되었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְשׁוּ
  english_pob_choice: sought
  chosen_korean: 찾았습니다 / 찾았으나
  alternatives_korean:
  - 구했습니다
  - 찾아보았습니다
  lexicon: HALOT
  rationale: 행정적·문서적 맥락에서 필요한 문서를 ‘찾다’로 옮기면 영어 POB의 ‘sought’와 같은 간결한 탐색 의미를 자연스럽게 살릴 수 있습니다.
- source_word: כְתָבָם
  english_pob_choice: their record
  chosen_korean: 자기 기록
  alternatives_korean:
  - 그들의 기록
  - 자기 문서
  - 자기 족보 기록
  lexicon: HALOT
  rationale: כְתָב은 문자 그대로 ‘기록/문서’이지만, 이 문맥에서는 제사장 자격을 입증하는 공식 기록이므로 ‘기록’이 가장 무난합니다. 앞의 ‘자기’는 소유 관계를 분명히 하면서도 과도한 해석을 피합니다.
- source_word: הַמִּתְיַחְשִׂים
  english_pob_choice: among those enrolled by genealogy
  chosen_korean: 족보로 등록된 사람들 가운데서
  alternatives_korean:
  - 족보에 따라 등록된 사람들 가운데서
  - 족보에 올려진 사람들 가운데서
  lexicon: HALOT
  rationale: 히트파엘 분사는 혈통을 근거로 명부에 올린다는 행정적 의미가 있어, ‘족보로 등록된 사람들’이 POB의 ‘enrolled by genealogy’를 가장 잘 반영합니다.
- source_word: וַיְגֹאֲלוּ מִן הַכְּהֻנָּה
  english_pob_choice: they were excluded from the priesthood
  chosen_korean: 제사장직에서 제외되었습니다
  alternatives_korean:
  - 제사장직에서 배제되었습니다
  - 제사장직에서 자격을 잃었습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 물리적 제거보다 자격상 배제를 가리키므로, ‘제사장직에서 제외되었습니다’가 영어 POB의 해석을 한국어로 가장 정확하게 전달합니다.
theological_decisions:
- issue: 족보 확인 실패가 제사장 자격 박탈로 이어지는 행정·성소 질서의 의미
  chosen_reading: 문서로 혈통이 입증되지 않으면 제사장직에 들어갈 수 없다는, 언약 공동체의 제사장 자격 기준을 드러내는 것으로 옮겼습니다.
  alternative_readings:
  - 단순히 부정적 판정이 내려진 것으로 축소하는 읽기
  - 의식적 부정결로 이해하는 읽기
  rationale: 본문은 의례적 불결보다 혈통 입증의 실패와 그에 따른 제사장 신분 배제를 강조하므로, 이를 행정적·언약적 자격 문제로 제시하는 편이 원문 의미에 더 가깝습니다.
  doctrine_reference: 민수기 3–4장, 에스라 2:62
