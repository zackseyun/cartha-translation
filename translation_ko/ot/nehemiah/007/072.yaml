base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
  footnotes:
  - marker: a
    text: Or 'the Nethinim,' a traditional transliteration of the name for this class of temple servants.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' / 'the people of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장[a]과 레위 사람들과 문지기들과 노래하는 자들과 백성 일부와 신디님[b]과 온 이스라엘이 각기 그 성읍에 거하였더니, 일곱째 달이 이르렀을 때[c]에 이스라엘 자손들이 각기 그 성읍에 있었더라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '네디님', 이 계급의 성전 종들을 가리키는 이름의 전통적 음역.
