  - marker: b
    text: 또는 '이스라엘 자손' / '이스라엘 백성'. 히브리어는 '이스라엘의 아들들'이라 읽는다.
    reason: alternative_reading
  - marker: c
    text: 또는 '일곱째 달이 이르렀을 때에'.
    reason: alternative_reading
