    reason: lexical_alternative
  - marker: b
    text: Or 'the Israelites' / 'the people of Israel.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들과 레위 사람들과 문지기들과 노래하는 이들과 백성 가운데 일부와 성전 봉사자들[a]과 온 이스라엘이 각자의 성읍에 살았습니다. 그리고 일곱째 달이 이르렀을 때, 이스라엘 자손[b]은 각자의 성읍에 있었습니다.
  philosophy: optimal-equivalence
