  - 호드와의 후손
  lexicon: HALOT
  rationale: 중첩된 계보 표현을 한국어에서는 한 번의 ‘자손’으로 압축해도 본문 의미를 유지할 수 있어, 장황한 반복을 피했습니다.
theological_decisions:
