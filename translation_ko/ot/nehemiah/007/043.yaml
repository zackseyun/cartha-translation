base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/043.yaml
  text: 'The Levites: the sons of Jeshua[a], of Kadmiel, of the sons of Hodvah, seventy-four.'
  footnotes:
  - marker: a
    text: Or 'the descendants of Hodvah.' The Hebrew literally reads 'the sons of Hodvah,' a genealogical expression that can denote a wider family line, not only immediate sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들 곧 예수아의 자손과 갓미엘의 자손과 호드와의 자손은 칠십사 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호드와의 자손’으로도 옮길 수 있습니다. 히브리어의 ‘호드와의 아들들’은 직계 아들만이 아니라 더 넓은 가문/계보를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלוִיִּם
  english_pob_choice: The Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
