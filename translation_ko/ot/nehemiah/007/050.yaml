lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손
  alternatives_korean:
  - 아들들
  - 후손
  - 가문의 사람들
  lexicon: HALOT
  rationale: 족보 목록에서 בְּנֵי는 혈통적 소속을 나타내므로, 한국어에서는 구조를 지나치게 직역한 ‘아들들’보다 성별을 덜 제한하는 ‘자손’이 자연스럽고 원문의 계보 의미를 잘 살립니다.
- source_word: רְאָיָה
  english_pob_choice: Reaiah
  chosen_korean: 르아야
  alternatives_korean:
  - 레아야
  - 라아야
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 적절하므로, 현대 외래어 표기 감각에 맞게 ‘르아야’로 옮겼습니다.
- source_word: רְצִין
  english_pob_choice: Rezin
  chosen_korean: 르신
  alternatives_korean:
  - 레진
  - 르진
  lexicon: HALOT
  rationale: 히브리어 고유명사를 음역하되 한국어 표기 관행상 어두 자음군을 반영해 ‘르신’으로 옮겼습니다.
- source_word: נְקוֹדָא
  english_pob_choice: Nekoda
  chosen_korean: 느고다
  alternatives_korean:
  - 네고다
  - 느코다
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역하며, 히브리어 모음과 자음값을 반영해 ‘느고다’로 적었습니다.
