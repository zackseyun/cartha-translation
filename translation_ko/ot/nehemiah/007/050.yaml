lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손
  alternatives_korean:
  - 아들들
  - 후손
  - 가문의 사람들
  lexicon: HALOT
  rationale: 족보 목록에서 בְּנֵי는 혈통적 소속을 나타내므로, 한국어에서는 구조를 지나치게 직역한 ‘아들들’보다 성별을 덜 제한하는 ‘자손’이 자연스럽고 원문의 계보 의미를 잘 살립니다.
- source_word: רְאָיָה
