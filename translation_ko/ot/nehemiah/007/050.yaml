  - 라아야
  lexicon: HALOT
  rationale: 고유명사는 음역하는 것이 적절하므로, 현대 외래어 표기 감각에 맞게 ‘르아야’로 옮겼습니다.
- source_word: רְצִין
  english_pob_choice: Rezin
  chosen_korean: 르신
  alternatives_korean:
  - 레진
  - 르진
  lexicon: HALOT
  rationale: 히브리어 고유명사를 음역하되 한국어 표기 관행상 어두 자음군을 반영해 ‘르신’으로 옮겼습니다.
- source_word: נְקוֹדָא
  english_pob_choice: Nekoda
  chosen_korean: 느고다
  alternatives_korean:
  - 네고다
  - 느코다
  lexicon: HALOT
  rationale: 고유명사는 번역하지 않고 음역하며, 히브리어 모음과 자음값을 반영해 ‘느고다’로 적었습니다.
