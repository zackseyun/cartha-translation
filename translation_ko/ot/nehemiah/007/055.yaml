  lexicon: 고유명사 표기
  rationale: 고유명사는 음역하는 것이 원문 정보를 가장 직접적으로 보존하므로, 영어 POB의 Barkos에 맞춰 바르코스로 옮겼습니다.
- source_word: תָמַח
  english_pob_choice: Temah / Tamah
  chosen_korean: 테마
  alternatives_korean:
  - 타마
  lexicon: 고유명사 표기
  rationale: 이 이름은 영어 POB가 Temah를 본문으로 두고 각주로 Tamah 가능성을 제시하므로, 본문에는 영어 본문값에 맞춘 음역을 두고 변이형은 각주로 처리했습니다.
