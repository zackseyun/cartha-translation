    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי
  english_pob_choice: the men of
  chosen_korean: …의 사람들
  alternatives_korean:
  - …의 남자들
  - …의 주민들
  lexicon: HALOT
  rationale: 인구 목록의 관용구로서 소속 집단을 가리키는 말이므로, 성별을 과도하게 풀지 않으면서도 자연스러운 현대 한국어인 ‘…의 사람들’로 옮겼습니다.
- source_word: הָרָמָה
  english_pob_choice: Ramah
  chosen_korean: 라마
  alternatives_korean:
  - 라마아
  lexicon: HALOT
  rationale: 지명은 음역하는 것이 적절하며, 표준 외래어 표기 관행에 따라 라마로 옮겼습니다.
- source_word: וָגָבַע
  english_pob_choice: and Geba
  chosen_korean: 게바
  alternatives_korean:
  - 기브아
  lexicon: HALOT
  rationale: 히브리어 자음형이 גבע이므로 게바가 직접적인 대응입니다. 병행 목록의 영향으로 생길 수 있는 기브아는 본문 형태보다 해석적 선택이므로 본문에서는 따르지 않았습니다.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  english_pob_choice: six hundred twenty-one
  chosen_korean: 육백스물한 명
  alternatives_korean:
  - 621명
  - 육백이십한 명
  lexicon: HALOT
  rationale: 숫자는 본문의 가독성을 살려 한국어 수사로 풀고, 인구 집계를 분명히 하기 위해 ‘명’을 덧붙였습니다.
theological_decisions:
- issue: 지명 대조에서 게바와 기브아 중 어느 표기를 본문에 둘지
  chosen_reading: 본문에는 히브리어 자음형에 따른 게바를 두고, 기브아는 대안 읽기로만 처리했습니다.
  alternative_readings:
  - 기브아를 본문에 반영
  - 각주 없이 본문에 병기
  rationale: 이 절의 핵심은 인명/지명 목록의 서술이며, 원어 자음형과 일치하는 지명을 본문에 두는 것이 사본적·문헌학적으로 가장 직접적입니다.
  doctrine_reference: 본문 비평/지명 식별
- issue: 구조화된 목록 문체를 한국어에서 어떻게 살릴지
  chosen_reading: 간결한 명사구 뒤에 수량을 붙여 목록 항목의 건조한 행정 문체를 보존했습니다.
  alternative_readings:
  - 서술문으로 풀어쓰기
  - 더 문학적으로 의역
  rationale: 느헤미야의 계수 목록 성격을 유지하는 것이 본문 의도를 가장 잘 드러내므로, 장식적 표현을 최소화했습니다.
  doctrine_reference: 서사/명부 문체 보존
