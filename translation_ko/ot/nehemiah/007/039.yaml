  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of' can denote descendants or members of a family line, not only immediate sons.
    reason: lexical_alternative
  - marker: b
    text: Or 'Jeshua' could be rendered 'Joshua,' but 'Jeshua' better reflects the Hebrew form used in this post-exilic context.
    reason: lexical_alternative
translation:
  language: ko
  text: '제사장들: 예수아[b] 가문에 속한 여다야의 자손[a], 구백칠십삼 명입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘자손’은 직계 아들들만이 아니라 후손이나 가문의 구성원을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘예수아’는 ‘여호수아’로도 옮길 수 있으나, 여기서는 포로 후기 문맥에서 쓰인 히브리어 형태를 반영하여 ‘예수아’로 옮겼습니다.
    reason: lexical_alternative
