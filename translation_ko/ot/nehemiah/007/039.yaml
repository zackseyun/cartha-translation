  text: הַֽ/כֹּהֲנִ֑ים בְּנֵ֤י יְדַֽעְיָה֙ לְ/בֵ֣ית יֵשׁ֔וּעַ תְּשַׁ֥ע מֵא֖וֹת שִׁבְעִ֥ים וּ/שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/039.yaml
  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of' can denote descendants or members of a family line, not only immediate sons.
    reason: lexical_alternative
  - marker: b
    text: Or 'Jeshua' could be rendered 'Joshua,' but 'Jeshua' better reflects the Hebrew form used in this post-exilic context.
    reason: lexical_alternative
translation:
  language: ko
  text: '제사장들: 여다야의 자손, 예수아의 집, 구백칠십삼 명입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֲנִים
  english_pob_choice: The priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 제사장들 가운데
  - 제사장들이
  lexicon: HALOT
  rationale: 명사구를 그대로 살려 이 목록 항목의 분류명으로 제시했습니다. 한국어에서는 관사를 쓰지 않으므로 자연스럽게 복수형 명사로 처리했습니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손
  alternatives_korean:
  - 아들들
  - 후손들
  - 가문 사람들
  lexicon: HALOT
  rationale: 족보·인구조사 문맥에서 직계 아들보다 계통과 소속을 가리키므로, POB의 주석 취지를 반영해 혈통적 집단을 뜻하는 자손으로 옮겼습니다.
- source_word: לְבֵית יֵשׁוּעַ
  english_pob_choice: of the house of Jeshua
  chosen_korean: 예수아의 집
  alternatives_korean:
  - 예수아 가문
  - 예수아 집안
  - 예수아의 가문
  lexicon: HALOT
  rationale: בַּיִת의 가문/집안 의미를 살리되 한국어 목록문맥에서 가장 간결하고 자연스럽게 표현했습니다.
- source_word: יֵשׁוּעַ
  english_pob_choice: Jeshua
  chosen_korean: 예수아
  alternatives_korean:
  - 여호수아
  lexicon: HALOT
  rationale: 포로 후기 고유명사의 음가를 반영해 ‘예수아’로 음역했습니다. ‘여호수아’는 같은 인물 계열의 더 익숙한 형태지만, 여기서는 구별되는 후기 형태를 보존했습니다.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  english_pob_choice: nine hundred seventy-three
  chosen_korean: 구백칠십삼 명
  alternatives_korean:
  - 구백칠십삼
  - 973명
  lexicon: HALOT
  rationale: 히브리어 수사를 한국어 수사로 옮기고, 인원수임을 분명히 하기 위해 명을 덧붙였습니다.
