  text: 'The singers: the sons of Asaph[a], one hundred forty-eight.'
  footnotes:
  - marker: a
    text: Or 'the descendants of Asaph.' The Hebrew 'sons of' can denote a family line or guild membership, not only immediate sons.
    reason: lexical_alternative
translation:
  language: ko
  text: '노래하는 이들: 아삽의 자손[a]이 백사십팔 명입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아삽의 아들들’. 히브리어 ‘~의 아들들’은 직계 아들들뿐 아니라 가문이나 직능 집단의 계열을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  english_pob_choice: the singers
  chosen_korean: 노래하는 이들
  alternatives_korean:
  - 노래하는 사람들
  - 성가대원들
  - 노래하는 자들
  lexicon: HALOT
  rationale: 분사형이 가리키는 ‘노래하는 사람들’이라는 뜻을 살리되, 목록체 문맥에 맞게 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: ~의 자손
  alternatives_korean:
  - ~의 아들들
  - ~의 후손
  - ~의 구성원들
  lexicon: HALOT
  rationale: 족보·계열 표지로 쓰인 בְּנֵי는 직역하면 ‘아들들’이지만, 여기서는 아삽의 가문/계열 전체를 가리키므로 ‘자손’이 문맥에 더 정확합니다.
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  english_pob_choice: one hundred forty-eight
  chosen_korean: 백사십팔 명
  alternatives_korean:
  - 148명
  - 백사십팔
  lexicon: HALOT
  rationale: 인원 집계이므로 한국어에서는 수사 뒤에 단위 ‘명’을 붙여 자연스럽고 분명하게 처리했습니다.
