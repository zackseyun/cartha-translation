id: NEH.7.65
reference: Nehemiah 7:65
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/תִּרְשָׁ֨תָא֙ לָ/הֶ֔ם אֲשֶׁ֥ר לֹא יֹאכְל֖וּ מִ/קֹּ֣דֶשׁ הַ/קֳּדָשִׁ֑ים עַ֛ד עֲמֹ֥ד הַ/כֹּהֵ֖ן לְ/אוּרִ֥ים וְ/תוּמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
  footnotes:
  - marker: a
    text: Or 'the Tirshatha,' a Persian administrative title.
    reason: lexical_alternative
  - marker: b
    text: That is, the sacred priestly portions classed as 'most holy'; not the inner sanctuary ('the Holy of Holies').
    reason: cultural_note
translation:
  language: ko
  text: 총독은 그들에게 우림과 둠밈을 지닌 제사장이 일어날 때까지 가장 거룩한 것들을 먹어서는 안 된다고 말하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘총독’은 페르시아 행정 직함인 ‘티르솨타’를 풀어 옮긴 것입니다.
    reason: cultural_note
  - marker: b
    text: ‘가장 거룩한 것들’은 성소 건물 자체가 아니라 제사장에게 속한 지극히 거룩한 몫이나 제물을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  english_pob_choice: the governor
  chosen_korean: 총독
  alternatives_korean:
  - 티르솨타
  - 총독님
  lexicon: HALOT
  rationale: 페르시아 행정 직함을 뜻하므로, 기능을 드러내는 ‘총독’으로 옮겨 현대 독자가 이해하기 쉽게 했습니다. 본문은 직함이지 고유명이 아니므로 음역은 본문에 두지 않았습니다.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  english_pob_choice: that they should not eat
  chosen_korean: 먹어서는 안 된다고
  alternatives_korean:
  - 먹지 말라고
  - 먹어서는 안 된다고 하였습니다
  lexicon: HALOT
  rationale: 명령의 금지를 자연스러운 한국어로 옮기되, 히브리어의 간접명령 성격을 살려 직설적 금지보다 보고문 안의 금지로 표현했습니다.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  english_pob_choice: from the most holy things
  chosen_korean: 그 가장 거룩한 것들에서
  alternatives_korean:
  - 지극히 거룩한 것들에서
  - 가장 거룩한 제물에서
  - 지성소에서
  lexicon: HALOT
  rationale: 문맥상 성소 건물의 ‘지성소’가 아니라 제사장 몫의 거룩한 몫/제물을 가리키므로, 오해를 피하면서도 최상급의 의미를 살리는 표현을 택했습니다.
- source_word: לְאוּרִים וְתוּמִּים
  english_pob_choice: with Urim and Thummim
  chosen_korean: 우림과 둠밈을 갖추고
  alternatives_korean:
  - 우림과 둠밈과 함께
  - 우림과 둠밈으로
  - 우림과 둠밈을 가지고
  lexicon: HALOT
  rationale: 전통적인 제사장 판별 도구의 고유 명칭은 음역을 유지했습니다. כאן의 전치사는 단순 동반보다 ‘갖추고’가 한국어에서 기능적 상태를 더 자연스럽게 드러냅니다.
theological_decisions:
- issue: ‘가장 거룩한 것들’의 의미
  chosen_reading: 제사장 몫의 거룩한 제물/몫을 가리키며, 지성소가 아닙니다.
  alternative_readings:
  - 성전 내실인 지성소
  - 단순히 일반적인 거룩한 것
  rationale: 문맥이 제사장 혈통 확인 문제와 연결되므로, 먹을 수 있는 성물의 범주로 이해하는 것이 본문의 실제 초점을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 우림과 둠밈 표현
  chosen_reading: 전통 명칭을 음역으로 유지했습니다.
  alternative_readings:
  - 해석 수단으로 풀어쓰기
  - 주석 없이 일반화
  rationale: 본문이 가리키는 제사장적 분별 수단은 고유한 성물/도구이므로, 음역이 가장 직접적이고 오해를 덜 낳습니다.
  doctrine_reference: Translation philosophy §2
