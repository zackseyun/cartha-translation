revisions:
- from: 총독이 그들에게 말하기를, 제사장이 우림과 둠밈을 갖추고 일어날 때까지는 그 가장 거룩한 것들에서 먹어서는 안 된다고 하였습니다.[a][b]
  to: 총독은 그들에게 우림과 둠밈을 지닌 제사장이 일어날 때까지 가장 거룩한 것들을 먹어서는 안 된다고 말하였습니다.[a][b]
  rationale: 문장의 목적어 관계를 현대 한국어에 맞게 바로잡아 ‘가장 거룩한 것들을 먹다’로 수정했습니다. 또한 우림과 둠밈의 소유·사용 관계가 제사장을 수식하도록 다듬었습니다. 원문의 미래적 유보와 제사장적 판별 수단이라는 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:38:30Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 מִן의 목적어는 ‘가장 거룩한 것들’ 자체이므로, ‘것들에서 먹다’보다 ‘것들을 먹다’가 한국어 문법과 원문의 관계를 더 정확히 드러냅니다. לְאוּרִים וְתוּמִּים은 우림과 둠밈을 지닌/갖춘 제사장을 가리키는 것으로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘그 가장 거룩한 것들에서 먹다’는 현대 표준 한국어에서 부자연스럽습니다. ‘가장 거룩한 것들을 먹다’로 고치면 자연스럽고 뜻도 분명합니다. ‘우림과 둠밈을 지닌 제사장’은 ‘갖추고 일어날’보다 더 매끄럽습니다.
  terminology: ‘총독’, ‘우림과 둠밈’, ‘가장 거룩한 것들’은 적절합니다. ‘가장 거룩한 것들’은 지성소를 뜻하는 것으로 오해될 수 있으므로, 제사장에게 속한 성물의 몫이라는 주석을 유지하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘그 가장 거룩한 것들에서 먹어서는 안 된다’라는 목적어 표지
    rationale: 한국어에서 먹는 대상은 ‘~에서’가 아니라 목적격으로 표현하는 것이 자연스럽습니다. 원문의 מִקֹּדֶשׁ הַקֳּדָשִׁים도 여기서는 먹지 못할 성물의 범주를 나타내므로 ‘가장 거룩한 것들을 먹어서는’이 적절합니다.
  - severity: low
    issue: ‘우림과 둠밈을 갖추고 일어날’의 결합
    rationale: 뜻은 전달되지만 ‘우림과 둠밈을 지닌 제사장이 일어날 때까지’가 수식 관계를 더 명료하고 자연스럽게 나타냅니다.
  revised_text: 총독은 그들에게 우림과 둠밈을 지닌 제사장이 일어날 때까지 가장 거룩한 것들을 먹어서는 안 된다고 말하였습니다.[a][b]
  revised_footnotes:
