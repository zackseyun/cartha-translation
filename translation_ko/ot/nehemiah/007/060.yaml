base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/060.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
  footnotes:
  - marker: a
    text: Or “the Nethinim,” a traditional transliteration for a class of temple servants.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 성전 일꾼들과 솔로몬의 종들의 아들들은 삼백아흔두 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘느디님’은 성전 봉사에 속한 특정 집단을 가리키는 전통적 음역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  english_pob_choice: the temple servants
  chosen_korean: 성전 일꾼들
  alternatives_korean:
  - 느디님들
  - 성전 종들
  lexicon: HALOT
  rationale: 포로기 이후 회중의 성전 봉사 집단을 기능적으로 드러내기 위해 ‘성전 일꾼들’로 옮겼습니다. ‘느디님들’은 주석적 대안으로는 가능하지만 본문 이해가 바로 되지 않습니다.
- source_word: וּבְנֵי עַבְדֵי שְׁלֹמֹה
  english_pob_choice: and the sons of Solomon’s servants
  chosen_korean: 솔로몬의 종들의 아들들
  alternatives_korean:
  - 솔로몬의 종들의 자손들
  - 솔로몬의 종들의 후손들
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살려 고유한 집단명으로 보이도록 ‘종들의 아들들’로 옮겼습니다. 이 문맥에서는 단순한 생물학적 아들보다 소속된 후손 집단의 의미가 함께 있습니다.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  english_pob_choice: three hundred ninety-two
  chosen_korean: 삼백아흔두 명
  alternatives_korean:
  - 392명
  - 삼백 구십이 명
  lexicon: HALOT
  rationale: 인명·인구 목록의 서술 방식에 맞춰 한글 수사로 자연스럽게 제시했습니다. ‘명’을 붙여 인원 수임을 분명히 했습니다.
theological_decisions:
- issue: 느디님과 솔로몬의 종들에 대한 호칭
  chosen_reading: 두 집단을 성전 관련 봉사 집단으로 구분하되, 현대 독자가 기능을 즉시 이해하도록 번역합니다.
  alternative_readings:
  - 음역 중심으로 ‘느디님’과 ‘솔로몬의 종들’로 두기
  - 둘 다 ‘종들’로 평준화하기
  rationale: 본문은 포로기 이후 공동체 안의 특정 명단을 기록하므로, 역사적 집단명은 유지하되 의미는 풀어 주는 것이 가장 정확합니다.
  doctrine_reference: Neh 7:60 역사적-명부 본문
