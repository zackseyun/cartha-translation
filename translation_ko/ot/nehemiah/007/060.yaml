  verdict: revise
  source_fidelity: 히브리어 כָּל은 두 집단의 합계를 가리키며, ‘모두’와 총수 표현으로 잘 반영할 수 있습니다. הַנְּתִינִים은 성전 봉사에 속한 특정 집단이고, וּבְנֵי עַבְדֵי שְׁלֹמֹה는 명부상의 집단 명칭으로서 ‘솔로몬의 종들의 자손’이 자연스럽게 전달합니다. 수효 392도 정확합니다.
  naturalness: 초안의 ‘솔로몬의 종들의 아들들’은 히브리어 형식을 지나치게 그대로 따라 한국어에서 어색하고, 이 명부 문맥에서 집단적·계보적 의미를 충분히 드러내지 못합니다. ‘성전 봉사자들’과 ‘자손들’이 현대 표준어의 격식 있는 성경 문체에 더 자연스럽습니다.
  terminology: ‘성전 봉사자들’은 느디님을 기능적으로 옮기면서도 ‘일꾼’보다 성전 관련 직무 집단이라는 성격을 더 적절히 나타냅니다. 전통 음역 ‘느디님’은 각주에 대안으로 보존합니다. ‘종’은 עַבְדֵי의 번역으로 유지합니다.
  issues:
