  text: וַ/יִּתֵּ֤ן אֱלֹהַ/י֙ אֶל לִבִּ֔/י וָ/אֶקְבְּצָ֞/ה אֶת הַ/חֹרִ֧ים וְ/אֶת הַ/סְּגָנִ֛ים וְ/אֶת הָ/עָ֖ם לְ/הִתְיַחֵ֑שׂ וָֽ/אֶמְצָ֗א סֵ֤פֶר הַ/יַּ֨חַשׂ֙ הָ/עוֹלִ֣ים בָּ/רִאשׁוֹנָ֔ה וָ/אֶמְצָ֖א כָּת֥וּב בּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
  footnotes:
  - marker: a
    text: Or 'to register by genealogy.' The Hebrew refers to official enrollment according to family lineage.
    reason: lexical_alternative
  - marker: b
    text: Or 'the genealogical record of those who came up at the first.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 나의 하나님께서 내 마음에 넣어 주셔서, 내가 귀족들과 관리들과 백성을 모아 족보에 따라 등록하게 하였습니다. 그러고 나서 나는 먼저 올라온 이들의 족보책을 발견하였고, 거기에 기록된 것을 보았습니다:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘족보에 따라 등록하다’. 히브리어는 가문 계통에 따른 공식 등록을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘처음 올라온 이들의 족보 기록’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל לִבִּי
  english_pob_choice: Then my God put it into my heart
  chosen_korean: 나의 하나님께서 내 마음에 넣어 주셔서
  alternatives_korean:
  - 나의 하나님께서 내 마음에 두셔서
  - 나의 하나님께서 내 마음에 심어 주셔서
  lexicon: HALOT
  rationale: 하나님이 내적으로 촉발하신다는 뜻을 살리되, 한국어에서 자연스러운 ‘마음에 넣어 주셔서’로 옮겼습니다.
- source_word: הַחֹרִים / הַסְּגָנִים
  english_pob_choice: the nobles / the officials
  chosen_korean: 귀족들과 관리들과
  alternatives_korean:
  - 귀인들과 관리들과
  - 귀족들과 관원들과
  lexicon: HALOT
  rationale: 문맥상 행정·공적 지도층을 가리키므로, ‘귀족들’과 ‘관리들’이 가장 분명하게 대응합니다.
- source_word: לְהִתְיַחֵשׂ
  english_pob_choice: to be enrolled by genealogy
  chosen_korean: 족보에 따라 등록하게
  alternatives_korean:
  - 족보에 따라 기록하게
  - 가문을 따라 등록하게
  - 족보대로 등록하게
  lexicon: HALOT
  rationale: 공식 등록 절차와 혈통 기준을 함께 드러내기 위해 ‘족보에 따라 등록하게’로 옮겼습니다.
- source_word: סֵפֶר הַיַּחַשׂ
  english_pob_choice: the book of the genealogy
  chosen_korean: 족보책
  alternatives_korean:
  - 족보 기록
  - 족보의 책
  - 계보책
  lexicon: HALOT
  rationale: 뒤절에서 실제 열람한 문서임이 분명하므로, 간결한 현대어로 ‘족보책’이라고 했습니다.
theological_decisions:
- issue: 하나님의 내적 감동을 어떻게 표현할지
  chosen_reading: ‘마음에 넣어 주셔서’로, 단순한 자기결심이 아니라 하나님의 주도적 내적 प्रेर동을 드러냈습니다.
  alternative_readings:
  - ‘마음에 두셔서’로 더 직역하기
  - ‘영감을 주셔서’로 풀기
  rationale: 원문은 하나님이 마음 안에 어떤 생각을 ‘주시는’ 표현이지, 계시의 방식까지 규정하지는 않습니다. 그래서 신학적 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
