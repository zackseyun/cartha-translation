  source_fidelity: 원문의 ‘나의 하나님께서 내 마음에 두셨다’는 내적 촉구와, 귀족·관리·백성을 모아 계보에 따라 등록하려는 목적을 전반적으로 잘 반영합니다. 그러나 초안의 ‘등록하게 하였습니다’는 느헤미야가 그들에게 등록을 강제했다는 사역 의미로 읽힐 수 있어, 원문의 목적 표현을 더 중립적으로 옮길 필요가 있습니다. 또한 ‘처음에 올라온’은 בָּרִאשׁוֹנָה가 가리키는 선행 귀환 집단을 자연스럽게 나타냅니다.
  naturalness: ‘마음에 넣어 주셔서’도 이해되지만, 현대 표준어 성경 문체에서는 ‘마음에 두셔서’가 원문의 관용 표현을 더 자연스럽고 절제되게 전달합니다. ‘거기에 기록된 것을 보았습니다’보다 ‘그 안에 이렇게 기록되어 있는 것을 발견하였습니다’가 뒤따르는 인용·명단의 도입으로 더 분명합니다.
  terminology: ‘귀족들’, ‘관리들’, ‘백성’, ‘족보’는 문맥과 행정적 성격에 적절합니다. ‘족보책’은 실제 문서를 가리키는 데 무리가 없으나, ‘족보 기록 책’ 같은 불필요한 중복 없이 유지할 수 있습니다. 각주 표지는 대안이 설명하는 표현에 직접 붙여야 합니다.
