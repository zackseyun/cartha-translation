id: NEH.7.61
reference: Nehemiah 7:61
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
  footnotes:
  - marker: a
    text: Ezra 2:59 reads 'Addan' where Nehemiah here has 'Addon.'
    reason: textual_variant
  - marker: b
    text: Or 'their ancestral houses'; the Hebrew idiom is literally 'their fathers’ houses.'
    reason: lexical_alternative
  - marker: c
    text: Or 'whether they were Israelites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이들은 돌라온 자들인데, 텔멜라흐와 텔하르사와 그룹과 아돈과 임멜에서 올라왔습니다. 그러나 그들은 자기들의 아버지의 집과 자기들의 자손을 밝혀서, 자기들이 이스라엘 출신인지 여부를 말할 수 없었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아돈’은 히브리어 자음형을 따른 음역이며, 에스라 2:59의 이형 ‘아단’과 다릅니다.
    reason: textual_variant
  - marker: b
    text: ‘아버지의 집’은 문자적으로는 족보상 가문을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자기들이 이스라엘 사람인지’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  english_pob_choice: And these were the ones who came up
  chosen_korean: 그리고 이들은 돌라온 자들인데
  alternatives_korean:
  - 그리고 이들은 올라온 자들입니다
  - 그리고 이들은 올라온 사람들입니다
  lexicon: HALOT
  rationale: עלה의 포로귀환 맥락을 살리면서도 합쇼체 문맥에 맞게 자연스럽게 풀었습니다. '돌라온'은 문맥상 귀환을 드러내되 과도하게 해석하지 않는 표현입니다.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  english_pob_choice: from Tel-melah, Tel-harsha, Kerub, Addon, and Immer
  chosen_korean: 텔멜라흐와 텔하르사와 그룹과 아돈과 임멜
  alternatives_korean:
  - 텔-멜라흐와 텔-하르사와 케룹과 아돈과 임멜
  - 텔멜라와 텔하르샤와 그룹과 아단과 임멜
  lexicon: HALOT
  rationale: 지명/씨족명으로 보고 음역했습니다. Addon은 히브리어 자음형을 따라 '아돈'으로 옮겼고, Ezra 2:59의 이형 'Addan'과는 구별했습니다.
- source_word: בֵּית אֲבוֹתָם
  english_pob_choice: their fathers’ houses
  chosen_korean: 자기들의 아버지의 집
  alternatives_korean:
  - 그들의 조상 집안
  - 그들의 족보상 가문
  lexicon: HALOT
  rationale: 족보를 가리키는 관용구를 직역해 원문의 투명성을 살렸습니다. '집안'으로 풀 수도 있으나, 본문은 문자적으로 '아버지의 집'을 유지하는 편이 더 분명합니다.
- source_word: וְזַרְעָם
  english_pob_choice: or their offspring
  chosen_korean: 자기들의 자손
  alternatives_korean:
  - 그들의 후손
  - 그들의 씨
  lexicon: HALOT
  rationale: זרע의 계보적 의미를 살리면서 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다. 원문의 병렬성을 고려해 '아버지의 집'과 나란히 두었습니다.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  english_pob_choice: whether they were from Israel
  chosen_korean: 자기들이 이스라엘 출신인지 여부
  alternatives_korean:
  - 자기들이 이스라엘 사람인지
  - 이스라엘에게 속한 자들인지
  lexicon: HALOT
  rationale: 출신 여부를 묻는 불확정 표현을 보존했습니다. '이스라엘 출신'은 혈통·소속의 애매함을 함께 담을 수 있어 본문의 족보적 긴장을 잘 드러냅니다.
theological_decisions:
- issue: 족보 확인 불능의 서술을 어떻게 드러낼지
  chosen_reading: 명백한 배제나 단정 대신, 정체성 입증이 불가능했다는 사실 자체를 그대로 옮겼습니다.
  alternative_readings:
  - 그들이 이스라엘이 아니라고 단정했다
  - 그들의 신분이 의심스러웠다
  rationale: 본문은 판정이 아니라 입증 실패를 말합니다. 따라서 불확정성과 족보적 한계를 유지하는 번역이 원문 의도를 가장 잘 반영합니다.
  doctrine_reference: 계보/언약 공동체 정체성에 대한 본문 문맥
- issue: '''아버지의 집''의 관용구 처리'
  chosen_reading: 관용구를 설명적으로 바꾸지 않고 직역해 계보적·언약적 뉘앙스를 유지했습니다.
  alternative_readings:
  - 조상 집안
  - 가문
  rationale: 이 구절은 단순 가족 단위가 아니라 혈통과 소속의 확인 문제이므로, 해석을 덜어낸 직역이 더 적합합니다.
  doctrine_reference: 구약의 족보 언어와 공동체 소속 개념
