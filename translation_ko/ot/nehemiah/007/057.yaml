reference: Nehemiah 7:57
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סוֹטַ֥י בְּנֵי סוֹפֶ֖רֶת בְּנֵ֥י פְרִידָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/057.yaml
  text: 'The sons of Solomon’s servants: the sons of Sotai[a], the sons of Sophereth[b], the sons of Perida.'
  footnotes:
  - marker: a
    text: Or 'descendants of Solomon’s servants.' The Hebrew 'sons of' in genealogical lists can denote a broader family line, not only immediate sons.
    reason: lexical_alternative
  - marker: b
    text: Or 'Peridah.' English transliterations of this name vary slightly.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬의 종들의 자손들 — 소타이의 자손들, 소페레트의 자손들, 페리다의 자손들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬의 종들의 후손들’로 옮길 수 있습니다. 족보 목록의 ‘아들들’은 직계 아들뿐 아니라 더 넓은 혈통을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름은 영어 전승에서 철자가 약간 달리 나타나기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 자손들
  alternatives_korean:
  - 아들들
  - 후손들
  - 자녀들
  lexicon: HALOT
  rationale: 족보·귀환자 목록에서 בְּנֵי는 단순한 직계 아들보다 더 넓은 가문/혈통을 가리킬 수 있으므로, 한국어에서는 구조를 살리면서도 범위를 넓게 담는 ‘자손들’이 가장 자연스럽습니다.
- source_word: עַבְדֵי שְׁלֹמֹה
  english_pob_choice: servants of Solomon
  chosen_korean: 솔로몬의 종들
  alternatives_korean:
  - 솔로몬의 종사자들
  - 솔로몬의 노예들
  - 솔로몬의 신하들
  lexicon: HALOT
  rationale: 이 표현은 포로기 후 목록에서 하나의 집단명처럼 기능하므로, 직역에 가까운 ‘종들’을 유지해 원문의 계보적·행정적 성격을 드러냈습니다.
- source_word: סוֹטַי / סוֹפֶרֶת / פְרִידָא
  english_pob_choice: Sotai / Sophereth / Perida
  chosen_korean: 소타이 / 소페레트 / 페리다
  alternatives_korean:
  - 소타이 / 소페렛 / 페리다
  - 소타이 / 소페레트 / 페리다
  lexicon: modern transliteration
  rationale: 세 이름은 모두 고유명사이므로 번역하지 않고 음역했습니다. 특히 סוֹפֶרֶת는 ‘기록자’ 같은 뜻을 살리지 않고, 족보 항목으로서의 이름 자체를 보존하는 것이 맞습니다.
theological_decisions:
- issue: 족보 표현 בְּנֵי의 범위
  chosen_reading: ‘자손들’로 옮겨 직계 아들만이 아니라 가문 전체를 포함할 수 있게 했습니다.
  alternative_readings:
  - ‘아들들’로 더 직역하는 방식
  - ‘후손들’로 더 풀어 쓰는 방식
  rationale: 이 절은 인명 목록의 일부이므로 혈통 단위를 나타내는 관용적 용례를 살리는 것이 중요합니다. ‘자손들’은 형식을 유지하면서도 원문의 포괄적 의미를 오해 없이 전달합니다.
  doctrine_reference: 족보/귀환자 목록의 문법적 관용법
- issue: עַבְדֵי שְׁלֹמֹה의 신분 뉘앙스
  chosen_reading: 문맥상 집단명으로 기능하므로 ‘종들’을 유지하되, ‘노예들’로 강화하지 않았습니다.
  alternative_readings:
  - ‘노예들’로 신분 종속을 강조하는 방식
  - ‘신하들’로 완화하는 방식
  rationale: 원어 עֶבֶד는 문맥에 따라 노예/종을 모두 가질 수 있지만, 여기서는 솔로몬 궁정/행정과 연관된 계보적 명칭으로 보이므로 과도한 사회사적 해석을 피하고 중립적인 ‘종들’을 택했습니다.
  doctrine_reference: 문맥상 의미 우선의 어휘 선택
