  naturalness: 명단을 ‘…의 자손’으로 반복하고 문장을 ‘입니다’로 마무리한 표현은 현대 표준 한국어 합쇼체에서 자연스럽습니다. 각주 표지는 해당 어휘 또는 이름 바로 뒤에 두는 편이 참조 범위가 분명합니다.
  terminology: ‘스바댜’, ‘핫딜’, ‘아몬’은 무난합니다. פֹּכֶרֶת הַצְּבָיִים은 한국어 음역상 ‘보게렛-하스바임’으로 바로잡는 것이 적절합니다. ‘자손’은 족보 명단에서 בְּנֵי가 가문·계보를 뜻할 수 있는 범위를 자연스럽게 보존합니다.
