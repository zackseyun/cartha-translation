  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּנֵ֧י שְׁפַטְיָ֣ה בְנֵֽי חַטִּ֗יל בְּנֵ֛י פֹּכֶ֥רֶת הַצְּבָיִ֖ים בְּנֵ֥י אָמֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/059.yaml
  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pochereth-hazzebaim[b], the sons of Amon.
  footnotes:
  - marker: a
    text: Or possibly 'the descendants of' throughout the verse; Hebrew 'sons of' often denotes a family line in genealogical lists.
    reason: lexical_alternative
  - marker: b
    text: Pochereth-hazzebaim may also be represented as 'Pochereth of Zebaim'; the Hebrew is preserved here as a proper name.
    reason: alternative_reading
translation:
  language: ko
  text: 스바댜의 자손, 핫딜의 자손, 포게레드-하스바임의 자손, 아몬의 자손입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 ‘자손’은 히브리어 ‘아들들’이 족보 목록에서 가문/계보를 가리킬 수 있음을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 포게레드-하스바임은 별도의 뜻풀이보다 고유명사로 보존한 이름입니다. 히브리어는 ‘스바임의 포게레드’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: …의 자손
  alternatives_korean:
  - …의 아들들
  - …의 후손
  - …의 자녀들
  lexicon: HALOT
  rationale: 족보·명단 문맥에서는 직계 아들보다 가문/계보를 가리킬 수 있으므로, 한국어에서는 자연스럽고 그 범위를 보존하는 ‘자손’으로 옮겼습니다.
- source_word: שְׁפַטְיָה
  english_pob_choice: Shephatiah
  chosen_korean: 스바댜
  alternatives_korean:
  - 세바댜
  - 세파트야
  lexicon: HALOT
  rationale: 고유명사는 한국어 음역 관례에 따라 표기하되, 본문의 인명을 그대로 식별할 수 있도록 했습니다.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  english_pob_choice: Pochereth-hazzebaim
  chosen_korean: 포게레드-하스바임
  alternatives_korean:
  - 포헤렛-하스바임
  - 포게레드-하츠바임
  - ‘스바임의 포게레드’
  lexicon: HALOT
  rationale: 이 표현은 가족명으로 기능하므로 뜻풀이보다 고유명사 보존이 우선입니다. 연결 표지는 영어 POB의 하이픈을 따라 한 이름으로 인식되게 했습니다.
- source_word: אָמֽוֹן
  english_pob_choice: Amon
  chosen_korean: 아몬
  alternatives_korean:
  - 암몬
  - 아문
  lexicon: HALOT
  rationale: 문맥상 일반명사가 아니라 계보상의 인명이므로 음역으로 처리했습니다.
theological_decisions:
- issue: 족보 문맥에서 בְּנֵי의 범위
  chosen_reading: ‘자손’으로 옮겨, 남성 직계 아들만이 아니라 가문 전체를 가리킬 수 있는 여지를 남겼습니다.
  alternative_readings:
  - ‘아들들’
  - ‘후손들’
  rationale: 이 절은 명단 형식의 족보 자료이므로, 현대 한국어에서 오해 없이 계보적 의미를 전달하는 표현이 필요합니다.
  doctrine_reference: 공동체/계보 문맥의 서술 정확성
- issue: פֹּכֶרֶת הַצְּבָיִים의 처리
  chosen_reading: 뜻풀이를 하지 않고 음역형 고유명사로 보존했습니다.
  alternative_readings:
  - ‘스바임의 포게레드’
  - ‘사슴들의 포게레드’
  rationale: 본문의 기능이 이름 열거이므로 의미 분석을 본문에 삽입하면 명단의 형식과 고유명사성을 해칠 수 있습니다.
  doctrine_reference: 본문 장르 보존 및 고유명사 처리 원칙
