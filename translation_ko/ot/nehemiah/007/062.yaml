  - 직역에 가까운 ‘아들들’
  - 더 포괄적인 ‘후손들’
  rationale: 문맥은 인구 조사/명단이므로 개인보다 가문 단위를 나타내는 표현이 필요합니다. ‘자손’은 원문의 혈통 표지를 유지하면서도 한국어에서 덜 협소합니다.
  doctrine_reference: 민수기·에스라·느헤미야의 족보/명단 용례
