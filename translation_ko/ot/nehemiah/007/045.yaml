base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/045.yaml
  text: 'The gatekeepers: the sons of Shallum[a], the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, 138.'
  footnotes:
  - marker: a
    text: Hebrew 'sons of' may denote a broader family line or clan, not only immediate male children.
    reason: lexical_alternative
translation:
  language: ko
  text: 문지기들은 셀룸의 아들들, 아터의 아들들, 탈몬의 아들들, 악굽의 아들들, 하디타의 아들들, 쇼바이의 아들들로서 모두 138명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들들’은 여기서 직계 아들뿐 아니라 씨족이나 가문을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  english_pob_choice: The gatekeepers
  chosen_korean: 문지기들
  alternatives_korean:
  - 성문 지기들
  - 문지기들
  lexicon: HALOT
  rationale: 문맥이 성문·성전 출입을 지키는 직분/무리를 가리키므로, 한국어에서도 기능을 드러내는 ‘문지기들’이 자연스럽고 간결합니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: ~의 아들들
  alternatives_korean:
  - ~의 자손들
  - ~의 가족들
  lexicon: HALOT
  rationale: 족보·명부 형식을 살리기 위해 직역 구조를 유지했습니다. POB의 주석처럼 넓은 씨족/가문을 뜻할 수 있지만, 본문 형식은 ‘~의 아들들’이 가장 직접적입니다.
- source_word: שַׁלּוּם / אָטֵר / טַלְמֹן / עַקּוּב / חֲטִיטָא / שֹׁבָי
  english_pob_choice: Shallum / Ater / Talmon / Akkub / Hatita / Shobai
  chosen_korean: 셀룸 / 아터 / 탈몬 / 악굽 / 하디타 / 쇼바이
  alternatives_korean:
  - 살룸 / 에이터 / 탈문 / 아굽 / 하티타 / 소바이
  lexicon: 고유명사 음역
  rationale: 영어 POB의 표기 관례를 참고하되, 현대 한국어 음역으로 옮겼습니다. ‘Akkub’는 악굽으로, ‘Hatita’는 하디타로 옮겨 히브리어 자음을 너무 약화시키지 않도록 했습니다.
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  english_pob_choice: '138'
  chosen_korean: 138명
  alternatives_korean:
  - 백 서른여덟 명
  - '138'
  lexicon: HALOT
  rationale: 히브리어 수사는 총합 138이며, 한국어 명부 문맥에서는 숫자 표기가 가장 읽기 쉽습니다. 인원수를 가리키도록 ‘명’을 보완했습니다.
theological_decisions:
- issue: 족보/명부의 집합적 표현에서 ‘아들들’의 범위
  chosen_reading: 개별 남성 자녀라기보다 씨족·가문 단위를 가리키는 집합적 표현으로 유지했습니다.
  alternative_readings:
  - ‘자손들’로 풀어 의미를 완화함
  - ‘가문들’로 의역함
  rationale: 본문의 רשימה 형식과 POB의 audit trail이 모두 족보적 집합을 전제하므로, 직역 구조를 보존하면서도 한국어 독자가 오해하지 않도록 문맥으로 처리했습니다.
  doctrine_reference: 민수기·에스라·느헤미야의 족보/명부 표현 관례
