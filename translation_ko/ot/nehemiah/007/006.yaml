  text: אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יָּשׁ֧וּבוּ לִֽ/ירוּשָׁלִַ֛ם וְ/לִ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
  footnotes:
  - marker: a
    text: Or more smoothly, 'from the exile.' The Hebrew more literally reads 'from the captivity of the exiles,' preserving both related nouns.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man to his city,' a distributive expression referring to the returnees by household or family units.
    reason: lexical_alternative
  - marker: c
    text: Or 'and they returned'.
    reason: previous_rendering
translation:
  language: ko
  text: 이들은 바벨론 왕 느부갓네살이 사로잡아 유배시킨 포로 생활, 곧 유배에서 올라온 그 지방에 속한 이들입니다. 이들은 예루살렘과 유다로 돌아왔으며, 각기 자기 성읍으로 돌아갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포로 생활, 곧 유배’는 히브리어의 ‘포로 됨/포로 생활’과 ‘유배(된 이들)’라는 서로 관련된 두 명사를 함께 드러낸 번역입니다. 더 직역하면 ‘유배된 이들의 포로 생활에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘각기 자기 성읍으로’는 히브리어의 분배적 표현으로, 직역하면 ‘각 사람 자기 성읍으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  english_pob_choice: the sons of the province
  chosen_korean: 지방의 자손들
  alternatives_korean:
  - 그 지방의 사람들
  - 그 행정구역의 자손들
  lexicon: HALOT
  rationale: 히브리어의 ‘sons of’를 살리되, 페르시아 시대 행정 구역인 ‘province’는 한국어로 자연스럽게 ‘지방’으로 풀어 역사적 행정 뉘앙스를 유지했습니다.
- source_word: מִשְּׁבִי הַגּוֹלָה
  english_pob_choice: from the captivity of the exiles
  chosen_korean: 포로의 감금 상태에서
  alternatives_korean:
  - 포로 된 유배자들 가운데서
  - 포로 생활에서
  lexicon: HALOT
  rationale: 두 명사(‘포로/감금’과 ‘유배/포로들’)가 겹쳐 있는 표현을 단순화하지 않고, ‘감금 상태’로 상태성을 드러내어 POB의 중첩된 의미를 반영했습니다.
- source_word: הֶגְלָה
  english_pob_choice: had carried away
  chosen_korean: 사로잡아 끌고 간
  alternatives_korean:
  - 유배시킨
  - 끌고 가서 유배시킨
  lexicon: HALOT
  rationale: ‘exile/deport’의 강제 이송 의미를 한국어로 직설적으로 옮겨, 단순한 이동이 아니라 강제 포로화라는 역사적 행위를 분명히 했습니다.
- source_word: וַיָּשׁוּבוּ לִירוּשָׁלַם וְלִיהוּדָה
  english_pob_choice: and who returned to Jerusalem and to Judah
  chosen_korean: 예루살렘과 유다로 돌아온 사람들
  alternatives_korean:
  - 예루살렘과 유다로 돌아갔고
  - 예루살렘과 유다로 돌아온 이들
  lexicon: HALOT
  rationale: 히브리어의 병렬 서술을 한국어 관계절로 자연스럽게 살리면서, ‘to Jerusalem and to Judah’를 반복 전치사 없이 명료하게 표현했습니다.
- source_word: אִישׁ לְעִירוֹ
  english_pob_choice: each man to his city
  chosen_korean: 각기 자기 성읍으로
  alternatives_korean:
  - 각 사람마다 자기 성읍으로
  - 각자 자기 도시로
  lexicon: HALOT
  rationale: 분배적 표현을 한국어 관용에 맞게 옮기되, ‘each man’의 대표적 남성 단수 형식은 과도한 성중립화 없이 ‘각기’로 처리했습니다.
theological_decisions:
- issue: ‘sons of the province’의 집단 정체성 표현
  chosen_reading: 지방의 자손들
  alternative_readings:
  - 그 지방의 사람들
  - 지방 주민들
  rationale: 명단/귀환자 맥락에서 혈통·소속을 함께 암시하는 ‘자손들’을 유지해야 본문의 목록적 정체성 표지가 보존됩니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: ‘returned to Jerusalem and to Judah’의 서술 방식
  chosen_reading: 예루살렘과 유다로 돌아온 사람들
  alternative_readings:
  - 예루살렘과 유다로 돌아갔습니다
  - 예루살렘과 유다로 귀환한 사람들
  rationale: 귀환 목록의 서술문이므로 선언적 번역보다 명사구 중심으로 처리해, 원문의 분류·목록 기능을 더 잘 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2
