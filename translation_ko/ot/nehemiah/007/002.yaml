source:
  edition: WLC
  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
  footnotes:
  - marker: a
    text: Or, 'a man of truth' or 'a trustworthy man.'
    reason: lexical_alternative
  - marker: b
    text: The singular 'he' most naturally refers to Hananiah, though some understand the commendation to support the appointment more generally.
    reason: alternative_reading
translation:
  language: ko
  text: 그때에 나는 내 형제 하나니와 성채의 사령관 하나냐를 예루살렘을 맡도록 임명했습니다. 하나냐는 신실한 사람이었고[a], 많은 사람보다 하나님을 더 두려워했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진리의 사람’ 또는 ‘믿을 만한 사람’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 단수 표현은 가장 자연스럽게 하나냐를 가리키지만, 어떤 이들은 이 칭찬을 두 사람의 임명 전체를 뒷받침하는 말로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲצַוֶּה
  english_pob_choice: appointed
  chosen_korean: 맡겼습니다
  alternatives_korean:
  - 임명했습니다
  - 명령했습니다
  - 맡겨 책임을 주었습니다
  lexicon: HALOT
  rationale: 행정적 임명 상황에서 단순한 ‘명령하다’보다 책임을 부여하는 기능적 의미를 살려, 출발점의 위임·배정 뉘앙스를 자연스럽게 옮겼습니다.
- source_word: חֲנָנִי אָחִי
  english_pob_choice: my brother Hanani
  chosen_korean: 내 형제 하나니
  alternatives_korean:
  - 내 형제 하나니야
  - 하나니 내 형제
  lexicon: HALOT
  rationale: 소유 접미사가 가리키는 친족관계를 자연스러운 한국어 어순으로 풀어 ‘내 형제’로 옮겼습니다.
- source_word: שַׂר הַבִּירָה
  english_pob_choice: the commander of the fortress
  chosen_korean: 성하의 장관
  alternatives_korean:
  - 요새의 사령관
  - 성채의 관리
  - 요새의 장관
  lexicon: HALOT
  rationale: שַׂר는 통치·지휘 담당자를 가리키므로 ‘장관’으로, הַבִּירָה는 요새/성채의 행정·군사 시설로 이해하여 ‘성하’로 옮겼습니다.
- source_word: כְּאִישׁ אֱמֶת
  english_pob_choice: a faithful man
  chosen_korean: 참된 사람이었고
  alternatives_korean:
  - 신실한 사람이었고
  - 진실한 사람이었고
  - 믿을 만한 사람이었고
  lexicon: HALOT
  rationale: אֱמֶת의 의미 범위(진리, 신실함, 신뢰성) 가운데, 직무 적합성을 칭찬하는 문맥에 맞게 ‘참된’으로 옮겨 원문이 지닌 윤리적 진실성과 신뢰성을 함께 살렸습니다.
- source_word: מֵרַבִּים
  english_pob_choice: more than many
  chosen_korean: 많은 사람보다 더
  alternatives_korean:
  - 많은 이들보다
  - 대다수보다
  - 많은 사람들보다 더
  lexicon: HALOT
  rationale: 비교 구문을 과도하게 해석하지 않고 원문의 직역적 비교를 유지했습니다.
theological_decisions:
- issue: 단수 대명사의 지시 대상
  chosen_reading: ‘그는’은 가까운 선행사인 하나냐를 주된 지시 대상으로 유지했습니다.
  alternative_readings:
  - 두 사람을 통칭하는 공동 평가로 볼 수 있습니다.
  - 하나니와 하나냐 둘 다를 염두에 둔 표현으로 완화할 수 있습니다.
  rationale: 히브리어의 단수 문법과 가까운 선행사 관계를 보존하여, 본문이 지닌 약간의 긴장을 한국어에서 평탄화하지 않았습니다.
  doctrine_reference: 원문 문법 긴장 보존
