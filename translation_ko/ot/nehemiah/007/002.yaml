revisions:
- from: 그때 내가 내 형제 하나니와 성하의 장관 하나냐를 예루살렘에 대해 맡겼습니다[a][b]. 그는 참된 사람이었고, 하나님을 두려워하여 많은 사람보다 더 그랬습니다.
  to: 그때에 나는 내 형제 하나니와 성채의 사령관 하나냐를 예루살렘을 맡도록 임명했습니다. 하나냐는 신실한 사람이었고[a], 많은 사람보다 하나님을 더 두려워했습니다[b].
  rationale: 관할 임명의 뜻을 ‘예루살렘을 맡도록 임명했습니다’로 명확히 하고, 불명확한 ‘성하의 장관’을 ‘성채의 사령관’으로 바로잡았습니다. 단수 주어를 하나냐로 명시해 히브리어 단수 문법을 유지했으며, 비교 구문을 ‘많은 사람보다 하나님을 더 두려워했습니다’로 자연스럽고 충실하게 옮겼습니다. 각주 표지도 해당 어구에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:41Z'
