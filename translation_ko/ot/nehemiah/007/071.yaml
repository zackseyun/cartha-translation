source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר נָתְנוּ֮ שְׁאֵרִ֣ית הָ/עָם֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שְׁתֵּ֣י רִבּ֔וֹא וְ/כֶ֖סֶף מָנִ֣ים אַלְפָּ֑יִם וְ/כָתְנֹ֥ת כֹּֽהֲנִ֖ים שִׁשִּׁ֥ים וְ/שִׁבְעָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
  footnotes:
  - marker: a
    text: Or 'the remnant of the people gave.' Here 'the rest of the people' is chosen because the phrase functions administratively to distinguish the remaining populace from previously listed donors, not to make a theological point about a faithful remnant.
    reason: lexical_alternative
  - marker: b
    text: A daric was a Persian gold coin.
    reason: cultural_note
  - marker: c
    text: A mina was an ancient unit of weight, and by extension of monetary value.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 남은 백성이 드린 것은 금 다릭[가] 이만 닢과 은 이천 마나[나], 그리고 제사장들의 긴옷 예순일곱 벌이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: 가
    text: 다릭은 페르시아의 금화입니다.
    reason: cultural_note
  - marker: 나
    text: 마나는 고대의 무게 단위이며, 화폐 가치의 단위로도 쓰였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאֵרִית הָעָם
  english_pob_choice: the rest of the people
  chosen_korean: 남은 백성
  alternatives_korean:
  - 백성의 남은 자
  - 남은 사람들
  lexicon: HALOT
  rationale: 이 구절은 행정적 목록에서 앞서 언급된 집단과 구분되는 ‘남은’ 사람들을 가리키므로, POB의 판단을 따라 ‘남은 백성’으로 옮겼습니다.
- source_word: זָהָב דַּרְכְּמוֹנִים
  english_pob_choice: gold darics
  chosen_korean: 금 다릭
  alternatives_korean:
  - 금화
  - 다릭 금화
  lexicon: HALOT
  rationale: דַּרְכְּמוֹנִים는 페르시아의 금화인 다릭을 가리키므로, 역사적 구체성을 살려 ‘금 다릭’으로 옮겼습니다.
- source_word: מָנִים
  english_pob_choice: minas of silver
  chosen_korean: 은 마나
  alternatives_korean:
  - 은 므나
  - 은 무게 단위
  lexicon: HALOT
  rationale: מָנִים은 고대의 무게/화폐 단위이므로, 단위를 유지해 ‘마나’로 옮기고 재질을 분명히 하기 위해 ‘은’을 붙였습니다.
- source_word: וְכָתְנֹת כֹּהֲנִים
  english_pob_choice: priests’ tunics
  chosen_korean: 제사장들의 속옷
  alternatives_korean:
  - 제사장들의 튜닉
  - 제사장들의 긴 옷
  lexicon: HALOT
  rationale: כָּתְנֹת는 몸에 입는 속옷/속적삼 계열의 의복이므로, 한국어에서 자연스럽고 구체적인 ‘속옷’으로 옮겼습니다.
