  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר נִבְנְתָה֙ הַ/חוֹמָ֔ה וָ/אַעֲמִ֖יד הַ/דְּלָת֑וֹת וַ/יִּפָּֽקְד֛וּ הַ/שּׁוֹעֲרִ֥ים וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: Now when the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
  footnotes:
  - marker: a
    text: Or 'were assigned' or 'were enrolled'; the Hebrew verb can carry a broader administrative sense than formal appointment alone.
    reason: lexical_alternative
  - marker: b
    text: '''Had been built'' could also be rendered ''was built.'' The English pluperfect reflects the sequence within the narrative.'
    reason: lexical_alternative
translation:
  language: ko
  text: 성벽이 완공되고 내가 문들을 세운 뒤에, 문지기들과 노래하는 이들과 레위 사람들은 임명되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִבְנְתָה הַחוֹמָה
  english_pob_choice: the wall had been built
  chosen_korean: 성벽이 완공되고
  alternatives_korean:
  - 성벽이 지어지고
  - 성벽이 세워지고
  - 성벽이 재건되고
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 '건축됨'보다 공사가 끝난 상태를 드러내는 '완공되다'가 자연스럽고, נבנה의 수동 완료 의미를 과도하게 확장하지 않으면서도 서술 흐름을 살립니다.
- source_word: וָאַעֲמִיד הַדְּלָתֹות
  english_pob_choice: I had set up the doors
  chosen_korean: 내가 문들을 세운 뒤에
  alternatives_korean:
  - 내가 문들을 달아 놓은 뒤에
  - 내가 문들을 설치한 뒤에
  - 내가 문들을 세워 둔 뒤에
  lexicon: HALOT
  rationale: עָמַד의 사역형은 '서게 하다/세우다'의 뜻이므로, 문짝을 제자리에 놓는 행위를 한국어 동사 '세우다'로 옮기는 것이 원문에 가장 가깝습니다. '뒤에'는 זמן 관계를 자연스럽게 드러냅니다.
- source_word: הַשּׁוֹעֲרִים וְהַמְשֹׁרְרִים וְהַלְוִיִּם
  english_pob_choice: the gatekeepers, the singers, and the Levites
  chosen_korean: 문지기들과 노래하는 이들과 레위 사람들
  alternatives_korean:
  - 문지기들과 노래하는 자들과 레위인들
  - 성문지기들과 찬양하는 이들과 레위 사람들
  - 문지기들과 성가대원들과 레위 사람들
  lexicon: HALOT
  rationale: שׁוֹעֲרִים은 성전·성문 체계에서의 '문지기'가 자연스럽고, מְשֹׁרְרִים은 직역하면 '노래하는 이들'이지만 정체를 너무 교회적 용어로 고정하지 않기 위해 풀어 옮겼습니다. לְוִיִּם은 고유 집단명으로 '레위 사람들'을 택했습니다.
- source_word: וַיִּפָּקְדוּ
  english_pob_choice: were appointed
  chosen_korean: 임명되었습니다
  alternatives_korean:
  - 배치되었습니다
  - 지정되었습니다
  - 명부에 올려졌습니다
  lexicon: HALOT
  rationale: פקד의 피엘/니팔 계열은 행정적 배정·임명의 의미를 가질 수 있으므로, 이 문맥에서는 직무 부여를 분명히 하는 '임명되었습니다'가 가장 적절합니다.
theological_decisions:
- issue: 성벽 완공 후의 행정적 재정비를 어떻게 드러낼지
  chosen_reading: 문지기들과 노래하는 이들과 레위 사람들은 임명되었습니다
  alternative_readings:
  - 문지기들과 노래하는 이들과 레위 사람들은 배치되었습니다
  - 문지기들과 노래하는 이들과 레위 사람들은 등록되었습니다
  rationale: 본문은 단순한 명부 작성이 아니라 성벽 완공 이후 공동체 질서를 재편하는 장면이므로, 행정적·공적 직분 부여를 드러내는 '임명'이 가장 잘 맞습니다.
  doctrine_reference: 공동체 질서와 성전 봉사의 공적 배치
