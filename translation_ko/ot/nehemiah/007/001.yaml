  - 문지기들과 노래하는 이들과 레위 사람들은 등록되었습니다
  rationale: 본문은 단순한 명부 작성이 아니라 성벽 완공 이후 공동체 질서를 재편하는 장면이므로, 행정적·공적 직분 부여를 드러내는 '임명'이 가장 잘 맞습니다.
  doctrine_reference: 공동체 질서와 성전 봉사의 공적 배치
