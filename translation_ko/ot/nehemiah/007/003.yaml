id: NEH.7.3
reference: Nehemiah 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
  footnotes:
  - marker: a
    text: Or “until the sun grows hot,” that is, not merely at sunrise but later in the morning.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “hold them”; in context this means to fasten or secure the doors after shutting them.
    reason: lexical_alternative
  - marker: c
    text: Or “appoint watches from among the inhabitants of Jerusalem.” The Hebrew term can refer either to guards or to guard-duties/watches.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 내가 그들에게 말했습니다. 「예루살렘의 성문은 해가 뜨거워질 때까지 열어서는 안 됩니다. 그들이 아직 서 있을 동안에는 문을 닫고 그것을 단단히 잠그십시오. 그리고 예루살렘 주민들 가운데서 파수꾼들을 세우되, 각자는 자기 파수대로, 또 각자는 자기 집 맞은편에 서게 하십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘해가 뜨거울 때까지’입니다. 단순히 해가 뜨는 시점이 아니라, 아침이 더 지나 해가 충분히 뜨거워진 때를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그것들을 붙들다’라는 뜻이지만, 문맥상 문을 닫은 뒤 단단히 잠그거나 고정하라는 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 경비 인원이나 경비 임무/순번을 가리킬 수 있습니다. 여기서는 성문을 지키는 사람들로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִפָּתְחוּ שַׁעֲרֵי יְרוּשָׁלִַם
  english_pob_choice: must not be opened
  chosen_korean: 열어서는 안 됩니다
  alternatives_korean:
  - 열리면 안 됩니다
  - 열어서는 안 되겠습니다
  lexicon: HALOT
  rationale: 부정 명령의 강한 금지 뜻을 살려, 성문이 수동적으로 ‘열리는’ 상황을 금지하는 표현으로 옮겼습니다.
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  english_pob_choice: until the sun is hot
  chosen_korean: 해가 뜨거워질 때까지
  alternatives_korean:
  - 해가 뜨거울 때까지
  - 해가 밝아질 때까지
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘태양의 열기/뜨거움’을 살리면서, 한국어에서는 ‘해가 뜨거워지다’가 자연스럽고 문맥상 늦은 아침을 암시합니다.
- source_word: וְעַד הֵם עֹמְדִים
  english_pob_choice: while they are still standing guard
  chosen_korean: 그들이 아직 서 있을 동안에는
  alternatives_korean:
  - 그들이 아직 파수 중일 동안에는
  - 그들이 자리를 지키고 있는 동안에는
  lexicon: HALOT
  rationale: ‘서 있다’의 문자적 의미를 유지하되, 파수 문맥이므로 보조적으로 ‘아직’과 병기해 경계 상태를 드러냈습니다.
- source_word: יָגִיפוּ הַדְּלָתֹות וֶאֱחֹזוּ
  english_pob_choice: let them shut the doors and fasten them
  chosen_korean: 문을 닫고 그것을 단단히 잠그십시오
  alternatives_korean:
  - 문을 닫고 그것을 잠그십시오
  - 문을 닫고 그것을 굳게 잡으십시오
  lexicon: HALOT
  rationale: ‘닫다’와 함께 뒤의 ‘붙들다/단단히 잡다’의 뜻을 한국어 관용으로 풀어, 단순 폐쇄가 아니라 안전하게 고정하는 의미를 분명히 했습니다.
- source_word: מִשְׁמְרוֹת
  english_pob_choice: guards
  chosen_korean: 파수꾼들
  alternatives_korean:
  - 경비들
  - 파수대들
  - 경계병들
  lexicon: HALOT
  rationale: 이 명사는 ‘파수/경비 임무’와 그 담당자를 모두 가리킬 수 있으므로, 문맥상 사람을 가리키는 ‘파수꾼들’로 옮겼습니다.
- source_word: אִישׁ בְּמִשְׁמָרוֹ
  english_pob_choice: each at his watch
  chosen_korean: 각자는 자기 파수대로
  alternatives_korean:
  - 각자는 자기 파수에
  - 각자는 자기 근무대로
  lexicon: HALOT
  rationale: ‘משמר’의 임무/배치 의미를 살려, 개인별로 맡겨진 경계 구역을 뜻하는 한국어로 표현했습니다.
- source_word: וְאִישׁ נֶגֶד בֵּיתוֹ
  english_pob_choice: and each opposite his own house
  chosen_korean: 또 각자는 자기 집 맞은편에 서게 하십시오
  alternatives_korean:
  - 또 각자는 자기 집 앞에 서게 하십시오
  - 또 각자는 자기 집 맞은편에 배치하십시오
  lexicon: HALOT
  rationale: נגד의 ‘맞은편/정면’ 의미를 보존하면서, 실제 배치 명령이 분명히 드러나도록 동사 ‘서게 하십시오’를 보완했습니다.
theological_decisions:
- issue: 네헤미야의 경계 명령을 어떤 화법으로 전달할지
  chosen_reading: 직접 인용문 안에서는 명령형을 유지해, 공동체 안전을 위한 실제 행정 지시로 읽히게 했습니다.
  alternative_readings:
  - 서술형으로 완화해 ‘닫아야 했습니다’로 옮기는 방식
  - 권고형으로 약화해 ‘닫는 것이 좋습니다’로 옮기는 방식
  rationale: 본문은 왕권적/행정적 지시가 아니라 공동체 질서 유지를 위한 실천 명령이므로, 명령의 강도를 줄이지 않는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 본문의 문학적-역사적 의미 보존
- issue: ‘해가 뜨거워질 때까지’의 시간 표현을 어떻게 이해할지
  chosen_reading: 단순한 일출이 아니라 늦은 아침 무렵까지 문을 열지 말라는 뜻으로 이해되도록 유지했습니다.
  alternative_readings:
  - ‘해가 뜰 때까지’로 축소하는 해석
  - ‘낮이 완전히 밝을 때까지’로 의역하는 해석
  rationale: 히브리어의 구체적 이미지(‘태양의 열’)를 지우면 경계 강화의 뉘앙스가 약해지므로, 시간의 늦춤을 드러내는 표현을 택했습니다.
  doctrine_reference: 본문 의미의 구체성 보존
