id: NEH.3.14
reference: Nehemiah 3:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣ת שַׁ֣עַר הָ/אַשְׁפּ֗וֹת הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן רֵכָ֔ב שַׂ֖ר פֶּ֣לֶךְ בֵּית הַכָּ֑רֶם ה֣וּא יִבְנֶ֔/נּוּ וְ/יַעֲמִיד֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
  footnotes:
  - marker: a
    text: Or 'the Refuse Gate.' The Hebrew name refers to dung or refuse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 말기야는 레갑의 아들이요, 벧학게렘 지방의 관원으로서 분문을 수리했습니다. 그는 그것을 세우고, 그 문의 문짝들과 빗장들과 자물쇠들을 달았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오물문’. 히브리어 이름은 분뇨나 쓰레기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  english_pob_choice: repaired
  chosen_korean: 수리했습니다
  alternatives_korean:
  - 보수했습니다
  - 고쳤습니다
  lexicon: HALOT
  rationale: 느헤미야 3장의 목록 문맥에서 이 동사는 성벽과 성문 구간의 보수 책임을 맡는 기술적 표현이므로, 자연스러운 현대어인 ‘수리하다’로 옮겼습니다.
- source_word: שַׁעַר הָאַשְׁפּוֹת
  english_pob_choice: the Dung Gate
  chosen_korean: 분문
  alternatives_korean:
  - 거름문
  - 오물문
  lexicon: HALOT
  rationale: אַשְׁפּוֹת는 분뇨/쓰레기라는 구체적 뜻을 가지므로, 전통적으로 통용되는 예루살렘 성문명인 ‘분문’을 사용해 지명성을 유지했습니다.
- source_word: שַׂר פֶּלֶךְ
  english_pob_choice: ruler of the district
  chosen_korean: 지방의 관원
  alternatives_korean:
  - 지방의 통치자
  - 행정구역의 수장
  lexicon: HALOT
  rationale: שַׂר는 ‘관리/우두머리’ 계열이고 פֶּלֶךְ는 행정 구역을 가리키므로, 직역과 자연스러움을 함께 살린 ‘지방의 관원’을 택했습니다.
- source_word: וְיַעֲמִיד דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  english_pob_choice: set up its doors, its bolts, and its bars
  chosen_korean: 그 문의 문짝들과 빗장들과 자물쇠들을 달았습니다
  alternatives_korean:
  - 그 문의 문짝들과 빗장들과 잠금장치들을 설치했습니다
  - 그 문의 문과 빗장과 빗장을 고정하는 장치를 달았습니다
  lexicon: HALOT
  rationale: 문맥상 문짝, 잠금 장치, 가로지르는 빗장이라는 세 부품을 나열하므로, 성문 수리의 실제 작업을 떠올리게 하는 한국어 표현으로 대응했습니다.
theological_decisions:
- issue: 본문의 성문명과 행정 직책을 현대 한국어에서 어떻게 드러낼지
  chosen_reading: 지명과 직책을 과도하게 해설하지 않고, 본문이 말하는 건축·행정 사실을 평이하게 전달했습니다.
  alternative_readings:
  - 분문의 의미를 풀어 ‘오물문’으로 옮기는 방식
  - ‘관원’을 ‘통치자’로 강하게 옮기는 방식
  rationale: 이 절은 신학적 논쟁보다 역사적 기록의 성격이 강하므로, 본문의 정보량을 유지하면서도 현대 독자가 이해할 수 있는 수준의 직접성을 택했습니다.
  doctrine_reference: 성경 본문의 역사서술의 평이한 전달 원칙
