revisions:
- from: 그리고 말기야는 레갑의 아들이요, 벧학게렘 지방의 관원으로서 분문을 수리했습니다. 그는 그것을 세우고, 그 문의 문짝들과 빗장들과 자물쇠들을 달았습니다.[a]
  to: 레갑의 아들 말기야는 벧학게렘 지방의 관원으로서 분문[a]을 수리했습니다. 그는 그것을 짓고 그 문짝들과 빗장들과 가로빗장들을 설치했습니다.
  rationale: 원문의 건축 동사와 세 가지 성문 부품의 병렬을 보존하고, 현대 표준 한국어 합쇼체에 맞게 문장을 다듬었습니다. ‘분문’은 전통적 성문명으로 유지하되, 그 뜻은 해당 어휘에 직접 연결된 각주로 밝혔습니다.
