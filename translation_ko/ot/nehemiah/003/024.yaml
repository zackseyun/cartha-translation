  text: אַחֲרָ֣י/ו הֶחֱזִ֗יק בִּנּ֛וּי בֶּן חֵנָדָ֖ד מִדָּ֣ה שֵׁנִ֑ית מִ/בֵּ֣ית עֲזַרְיָ֔ה עַד הַ/מִּקְצ֖וֹעַ וְ/עַד הַ/פִּנָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
  footnotes:
  - marker: a
    text: Or 'a second section.' The Hebrew phrase may indicate either an additional stretch repaired by Binnui or simply a second measured portion.
    reason: lexical_alternative
  - marker: b
    text: The two terms rendered 'angle' and 'corner' are related but not identical in Hebrew; the wording likely distinguishes two nearby architectural features.
    reason: cultural_note
translation:
  language: ko
  text: 그의 뒤를 이어 헤나닷의 아들 빈누이가 또 한 구간을 수리했습니다. 아사랴의 집에서부터 꺾이는 곳까지, 또 모퉁이까지였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘또 한 구간’은 이 표현이 빈누이가 맡은 추가 구간을 가리킬 수도 있고, 두 번째 구획 또는 측량된 부분을 가리킬 수도 있음을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘꺾이는 곳’과 ‘모퉁이’는 히브리어에서 서로 관련되지만 동일하지 않은 두 표현입니다. 정확한 건축상의 구분은 확실하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그의 뒤를 이어
  alternatives_korean:
  - 그 다음으로
  - 그 뒤에
  lexicon: HALOT
  rationale: 네헤미야 3장의 공사 목록에서 순차적 진행을 표시하므로, 단순한 시간 순서를 자연스럽게 드러내는 ‘그의 뒤를 이어’가 적절합니다.
- source_word: הֶחֱזִיק
  english_pob_choice: repaired
  chosen_korean: 수리했습니다
  alternatives_korean:
  - 보수했습니다
  - 강화했습니다
  lexicon: HALOT
  rationale: 이 동사는 문자적으로는 ‘강하게 하다’에 가깝지만, 이 문맥에서는 성벽 공사를 가리키므로 ‘수리했습니다’가 가장 직역에 가깝고 현대 한국어에서도 자연스럽습니다.
- source_word: מִדָּה שֵׁנִית
  english_pob_choice: another section
  chosen_korean: 또 한 구간
  alternatives_korean:
  - 두 번째 구간
  - 다른 구간
  lexicon: HALOT
  rationale: 해당 표현은 이미 언급된 것에 더해진 추가 공사 구역일 수도 있고, 두 번째로 잰 구간일 수도 있어, 의미를 과도하게 확정하지 않는 ‘또 한 구간’으로 옮겼습니다.
- source_word: עַד הַמִּקְצוֹעַ / וְעַד הַפִּנָּה
  english_pob_choice: as far as the angle ... and as far as the corner
  chosen_korean: 모퉁이 돌까지, 그리고 모퉁이까지
  alternatives_korean:
  - 각진 곳까지, 그리고 모퉁이까지
  - 전환점까지, 그리고 모퉁이까지
  lexicon: HALOT
  rationale: 두 히브리어 명사는 서로 관련되지만 동일하지 않으므로, 한국어에서도 둘을 같은 말로 뭉개지 않고 첫째는 ‘모퉁이 돌’, 둘째는 ‘모퉁이’로 구분해 공사 지점을 살렸습니다.
