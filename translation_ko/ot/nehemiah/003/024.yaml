revisions:
- from: 그의 뒤를 이어 헨닷의 아들 빈누이가 또 한 구간을 수리했습니다. 아지랴의 집에서부터 모퉁이 돌까지, 그리고 모퉁이까지입니다.[a][b]
  to: 그의 뒤를 이어 헤나닷의 아들 빈누이가 또 한 구간을 수리했습니다. 아사랴의 집에서부터 꺾이는 곳까지, 또 모퉁이까지였습니다.[a][b]
  rationale: 인명 음역을 히브리어에 맞게 교정하고, 원문에 없는 ‘돌’을 삭제했습니다. 두 건축·지형 용어는 서로 다르게 번역하되, 그 정확한 물리적 차이를 단정하지 않도록 했습니다. מִדָּה שֵׁנִית의 해석상 여지는 각주에서 유지했습니다.
  reviewer_model: gpt-5.6-terra
