  text: אַחֲרָ֧י/ו הֶחֱזִ֛יק צָד֥וֹק בֶּן אִמֵּ֖ר נֶ֣גֶד בֵּית֑/וֹ וְ/אַחֲרָ֤י/ו הֶחֱזִיק֙ שְׁמַֽעְיָ֣ה בֶן שְׁכַנְיָ֔ה שֹׁמֵ֖ר שַׁ֥עַר הַ/מִּזְרָֽח־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
  footnotes:
  - marker: a
    text: Or 'repaired' for 'made repairs'; the Hebrew verb is literally 'strengthened,' but in this chapter it refers to repair work on the wall and gates.
    reason: lexical_alternative
  - marker: b
    text: Or 'opposite his own house' / 'in front of his house.'
    reason: lexical_alternative
  - marker: c
    text: Or 'guard of the East Gate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 임멜의 아들 사독이 자기 집 맞은편에서 수리했습니다[a][b]. 그 뒤에 스가냐의 아들 스마야, 곧 동문을 지키는 사람이 수리했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수리했다’. 히브리어 동사는 문자적으로는 ‘강하게 하다’이지만, 이 장에서는 성벽과 문을 고치는 공사를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 집 맞은편에서’ / ‘자기 집 앞에서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘동문을 맡은 사람’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  english_pob_choice: made repairs
  chosen_korean: 수리를 했습니다
  alternatives_korean:
  - 보수했습니다
  - 수리 작업을 했습니다
  - 보수 공사를 했습니다
  lexicon: HALOT
  rationale: 느헤미야 3장의 관용구에서 ‘강하게 하다’의 문자성을 살리기보다 성벽·문 수리의 문맥을 드러내는 표현이므로, 간결한 ‘수리를 했습니다’로 옮겼습니다.
- source_word: נֶגֶד בֵּיתוֹ
  english_pob_choice: opposite his house
  chosen_korean: 자기 집 맞은편에서
  alternatives_korean:
  - 자기 집 앞에서
  - 자기 집 건너편에서
  - 자기 집 앞쪽에서
  lexicon: HALOT
  rationale: נֶגֶד는 ‘앞에, 맞은편에’의 뜻이므로, 자연스러운 현대 한국어로 공간 관계를 분명히 하는 ‘맞은편에서’를 택했습니다.
- source_word: שֹׁמֵר
  english_pob_choice: keeper
  chosen_korean: 지키는 자
  alternatives_korean:
  - 파수꾼
  - 감시하는 자
  - 문지기
  lexicon: HALOT
  rationale: 시내/성문 관리 직분을 가리키는 분사로 보아, 기능을 드러내되 직분명으로 고정하지 않는 ‘지키는 자’로 처리했습니다.
- source_word: שַׁעַר הַמִּזְרָח
  english_pob_choice: the East Gate
  chosen_korean: 동문
  alternatives_korean:
  - 동쪽 문
  - 동문(東門)
  - 동쪽 성문
  lexicon: HALOT
  rationale: 특정한 성문 이름이므로 한국어 성경에서 널리 통용되는 지명형 표현인 ‘동문’을 사용했습니다.
