source:
  edition: WLC
  text: וַ/נִּבְנֶה֙ אֶת הַ֣/חוֹמָ֔ה וַ/תִּקָּשֵׁ֥ר כָּל הַ/חוֹמָ֖ה עַד חֶצְיָ֑/הּ וַ/יְהִ֧י לֵ֦ב לָ/עָ֖ם לַ/עֲשֽׂוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/038.yaml
  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the people had a heart to do.' The expression means they were inwardly resolved and willing for the work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 우리가 성벽을 세웠는데, 성벽 전체가 그 높이의 절반까지 서로 이어졌습니다. 그 이유는 백성이 일할 마음을 품었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘백성에게 일할 마음이 있었다’입니다. 이 표현은 그들이 속으로 그 일을 할 결의와 자원성을 지녔다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּבְנֶה
  english_pob_choice: So we rebuilt
  chosen_korean: 그래서 우리가 성벽을 세웠는데
  alternatives_korean:
  - 그래서 우리가 재건했습니다
  - 그리고 우리가 성벽을 세웠습니다
  lexicon: HALOT
  rationale: 과거 서술의 연속성을 살리되, 전후 문맥상 예루살렘 성벽 복구를 가리키므로 ‘재건하다/세우다’ 가운데 자연스러운 한국어 표현을 택했습니다. ‘그래서’는 waw의 진행 연결과 결과감을 함께 반영합니다.
- source_word: וַתִּקָּשֵׁר כָּל הַחוֹמָה
  english_pob_choice: the whole wall was joined together
  chosen_korean: 성벽 전체가 그 높이의 절반까지 서로 이어졌습니다
  alternatives_korean:
  - 성벽 전체가 연결되었습니다
  - 성벽 전체가 한데 이어졌습니다
  lexicon: HALOT
  rationale: נִפְעַל형의 수동·결과 상태를 살려 ‘서로 이어지다’로 옮겼고, 문맥상 건축 진척을 분명히 하기 위해 ‘그 높이의 절반까지’를 보충했습니다.
- source_word: לֵב לָעָם לַעֲשׂוֹת
  english_pob_choice: for the people had a heart to work
  chosen_korean: 백성이 일할 마음을 품었기 때문입니다
  alternatives_korean:
  - 백성이 일하려는 마음이 있었기 때문입니다
  - 백성이 일할 뜻을 품었기 때문입니다
  lexicon: HALOT
  rationale: 직역의 ‘마음이 있다’보다 한국어에서 자연스러운 내적 결심 표현인 ‘마음을 품다’를 택해, 원문의 관용구가 가리키는 자원적 결의와 의지를 살렸습니다.
theological_decisions:
- issue: 원문의 관용구 לֵב לָעָם לַעֲשׂוֹת의 번역 방식
  chosen_reading: ‘백성이 일할 마음을 품었기 때문입니다’로 옮겨, 내적 결단과 자원성을 드러냈습니다.
  alternative_readings:
  - ‘백성이 할 마음이 있었기 때문입니다’
  - ‘백성이 일하려는 의지가 있었기 때문입니다’
  rationale: 이 표현은 단순한 심리 상태보다 일에 대한 자발적 결의를 뜻하므로, 독자가 작업 참여의 적극성을 읽을 수 있게 해야 합니다.
  doctrine_reference: 본문의 인간 의지와 공동체적 헌신을 나타내는 서술적 표현
