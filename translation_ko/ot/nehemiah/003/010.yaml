id: NEH.3.10
reference: Nehemiah 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל יָדָ֧/ם הֶחֱזִ֛יק יְדָיָ֥ה בֶן חֲרוּמַ֖ף וְ/נֶ֣גֶד בֵּית֑/וֹ וְ/עַל יָד֣/וֹ הֶחֱזִ֔יק חַטּ֖וּשׁ בֶּן חֲשַׁבְנְיָֽה־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/010.yaml
  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
  footnotes:
  - marker: a
    text: Or 'in front of his house' for 'opposite his house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 옆에서 여다야, 하룸압의 아들이 자기 집 맞은편을 수리하였고, 그 다음에는 하숫, 하삽느야의 아들이 그 옆에서 수리하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 집 앞에’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  english_pob_choice: Next to them
  chosen_korean: 그들 옆에서
  alternatives_korean:
  - 그들 곁에서
  - 그들 가까이에
  lexicon: HALOT
  rationale: עַל יָד with 인칭 접미사는 느헤미야 3장의 공사 목록에서 ‘인접함’을 나타내므로, 한국어로는 자연스럽고 관계가 분명한 ‘옆에서’로 옮겼습니다.
- source_word: הֶחֱזִיק
  english_pob_choice: made repairs
  chosen_korean: 수리하였습니다
  alternatives_korean:
  - 보수하였습니다
  - 보강하였습니다
  lexicon: HALOT
  rationale: 이 동사는 본문에서 성벽 재건 작업에 참여했다는 기술적 표현이므로, 반복되는 문맥을 살려 ‘수리하다’로 옮겼습니다.
- source_word: וְנֶגֶד בֵּיתוֹ
  english_pob_choice: opposite his house
  chosen_korean: 자기 집 맞은편을
  alternatives_korean:
  - 자기 집 앞을
  - 자기 집 건너편을
  lexicon: HALOT
  rationale: נֶגֶד는 ‘마주한/맞은편의’ 의미이므로, 공간 관계를 그대로 살린 ‘맞은편’을 선택했습니다.
theological_decisions:
- issue: 공사 목록의 반복적 서술을 한국어에서 어떻게 살릴지
  chosen_reading: ‘수리하였습니다’와 ‘그 옆에서’의 반복 구조를 유지해 각 인물의 작업 위치와 순서를 드러냈습니다.
  alternative_readings:
  - 문맥을 단순화해 하나의 문장으로 압축하는 방식
  - ‘보수하였다’로 변화를 주는 방식
  rationale: 이 절은 역사적 서술이면서도 목록 형식이 중요하므로, 반복을 줄이지 않고 원문의 배열 감각을 보존하는 것이 의미 전달에 유리합니다.
  doctrine_reference: 본문의 서술 구조 보존 원칙
