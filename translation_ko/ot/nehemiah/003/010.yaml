revisions:
- from: 그들 옆에서 여다야, 하룸압의 아들이 자기 집 맞은편을 수리하였고, 그 다음에는 하숫, 하삽느야의 아들이 그 옆에서 수리하였습니다.[a]
  to: 그들 옆에서 하룸압의 아들 여다야가 자기 집 맞은편 부분을 수리했습니다.[a] 그의 옆에서 하삽느야의 아들 핫두스가 수리했습니다.
  rationale: 인명 ‘핫두스’를 원어 및 표준 성경 인명 관습에 맞게 바로잡았습니다. ‘맞은편 부분’으로 건축 작업의 대상과 위치를 자연스럽게 표현하고, 두 번째 인접 표지는 단수 지시를 살려 ‘그의 옆에서’로 옮겼습니다. 원문의 반복적인 공사 목록 형식과 공간적 배열은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:16Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 두 인접 관계(‘그들 옆에서’, ‘그의 옆에서’)와 여다야의 집에 대한 공간 표지는 대체로 반영되었습니다. 그러나 חַטּוּשׁ(Hattush)의 음역 ‘하숫’은 원어 자음과 통용 성경 인명 표기에 맞지 않습니다. 또한 ‘자기 집 맞은편을 수리하다’는 목적어가 생략되어 한국어로 다소 불완전하게 들립니다.
  naturalness: ‘그 다음에는’과 ‘그 옆에서’의 결합은 원문의 인접 표지를 순서 표현으로 약화시키고 지시 대상도 다소 모호하게 합니다. ‘그의 옆에서’와 ‘부분을 수리했습니다’로 하면 현대 한국어에서 더 자연스럽고 위치 관계도 분명해집니다.
  terminology: 여다야, 하룸압, 하삽느야는 적절합니다. חַטּוּשׁ은 표준 성경 인명 관습 및 히브리어 음가에 따라 ‘핫두스’로 옮기는 것이 안전합니다. הֶחֱזִיק의 건축 문맥은 ‘수리했습니다’로 적절히 전달됩니다.
  issues:
  - severity: high
    issue: 인명 ‘하숫’
    rationale: 히브리어 חַטּוּשׁ은 Hattush이며, 한국어 성경 인명 표기에서는 통상 ‘핫두스’입니다. ‘하숫’은 원어의 자음 및 확립된 인명 식별을 충분히 반영하지 못합니다.
  - severity: medium
    issue: ‘자기 집 맞은편을 수리하였습니다’의 목적어 구성
    rationale: ‘맞은편’은 이 문맥에서 수리 구간의 위치를 나타내므로, ‘맞은편 부분을’ 또는 ‘맞은편에서’처럼 구성해야 자연스럽습니다. ‘부분’을 보충해 수리 대상이 성벽의 한 구간임을 문맥상 명확히 합니다.
  - severity: low
    issue: 두 번째 인접 관계의 지시 대상
    rationale: ‘그 다음에는 … 그 옆에서’보다 ‘그의 옆에서’가 여다야를 직접 가리키며 וְעַל יָדוֹ의 단수 접미사를 더 분명히 반영합니다.
