source:
  edition: WLC
  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
  footnotes:
  - marker: a
    text: Or 'dedicated it.' The Hebrew verb can denote setting something apart as holy or specially dedicated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 엘리아십 대제사장이 그의 제사장 형제들과 함께 일어나 양의 문을 건축했습니다. 그들은 그것을 거룩히 구별하여 문짝을 달았고, 또 백 망대에서부터 하나넬 망대에 이르기까지 그것을 거룩히 구별했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘봉헌했습니다’. 히브리어 동사는 어떤 대상을 거룩하게 구별하여 바치거나 따로 떼어 두는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: rose up
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 일어섰습니다
  - 일어나 행동했습니다
  lexicon: HALOT
  rationale: 서사적 동작 시작을 자연스러운 현대 한국어로 옮기되, 단순히 ‘착수했다’로 풀어 의미를 좁히지 않았습니다.
- source_word: הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 최고 제사장
  lexicon: HALOT
  rationale: 히브리어의 관용적 직함을 한국어 성경에서 널리 통용되는 ‘대제사장’으로 옮겼습니다.
- source_word: שַׁעַר הַצֹּאן
  english_pob_choice: the Sheep Gate
  chosen_korean: 양의 문
  alternatives_korean:
  - 양문
  - 양 문
  lexicon: HALOT
  rationale: 예루살렘 성문의 고유 명칭이지만, 히브리어의 직역성을 살려 ‘양의 문’으로 두었습니다.
- source_word: קִדְּשׁוּהוּ
  english_pob_choice: consecrated it
  chosen_korean: 거룩히 구별했습니다
  alternatives_korean:
  - 봉헌했습니다
  - 성별했습니다
  - 봉헌하여 거룩하게 했습니다
  lexicon: HALOT
  rationale: קדש의 핵심은 단순 헌납보다 ‘거룩하게 구별함’에 있어, 제의적 의미를 살린 표현을 택했습니다.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  english_pob_choice: set up its doors
  chosen_korean: 문짝을 달았습니다
  alternatives_korean:
  - 문을 세웠습니다
  - 문짝을 설치했습니다
  lexicon: HALOT
  rationale: 문짝을 제자리에 달아 놓는 구체적 동작을 한국어 관용에 맞게 분명히 표현했습니다.
- source_word: מִגְדַּל הַמֵּאָה
  english_pob_choice: the Tower of the Hundred
  chosen_korean: 백 망대
  alternatives_korean:
  - 백의 망대
  - 백인 망대
  lexicon: HALOT
  rationale: 지명 구조를 간결하게 반영하면서도, 숫자 결합 지명임을 드러내기 위해 ‘백 망대’로 옮겼습니다.
- source_word: מִגְדַּל חֲנַנְאֵל
  english_pob_choice: the Tower of Hananel
  chosen_korean: 하나넬 망대
  alternatives_korean:
  - 하난엘 망대
  - 하나넬의 망대
  lexicon: HALOT
  rationale: 고유 지명은 현대 음역을 따르되, 성경 지명으로서 자연스럽게 읽히는 형태를 택했습니다.
theological_decisions:
- issue: קדש의 제의적 뉘앙스
  chosen_reading: ‘거룩히 구별하다’로 옮겨, 성문을 일반 건축물이 아니라 하나님께 구별된 대상으로 처리하는 의미를 드러냈습니다.
  alternative_readings:
  - 성별하다
  - 봉헌하다
  rationale: 문맥상 제사장들이 문을 단순히 완공한 것이 아니라 거룩한 용도로 따로 떼어 놓는 행위를 했으므로, 제의적 의미를 분명히 했습니다.
  doctrine_reference: OT cultic-setting-apart semantics; translation philosophy §1, §5
