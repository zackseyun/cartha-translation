  text: אַחֲרָ֨י/ו הֶחֱרָ֧ה הֶחֱזִ֛יק בָּר֥וּךְ בֶּן זבי מִדָּ֣ה שֵׁנִ֑ית מִן הַ֨/מִּקְצ֔וֹעַ עַד פֶּ֨תַח֙ בֵּ֣ית אֶלְיָשִׁ֔יב הַ/כֹּהֵ֖ן הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
  footnotes:
  - marker: a
    text: Or 'Baruch son of Zaccai,' following an alternative name tradition reflected in some versions.
    reason: alternative_reading
  - marker: b
    text: The Hebrew expression behind 'zealously repaired' is unusual and likely emphasizes Baruch's fervor or exceptional diligence in the work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 뒤에 바룩, 삽배의 아들이 열심히 두 번째 구간을 수리했습니다. 그 구간은 모퉁이에서 시작하여 대제사장 엘리아십의 집 입구까지였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘삽배’는 히브리어 자음 표기상 가능한 음역이며, 일부 전통은 ‘삽대/삽개’로도 전합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그의 뒤에
  alternatives_korean:
  - 그 뒤에
  - 그 다음에
  lexicon: HALOT
  rationale: 본문은 이전 작업자에 이어지는 순서와 인접한 위치를 함께 나타내므로, ‘그의 뒤에’가 가장 자연스럽고 문맥을 잘 살립니다.
- source_word: הֶחֱרָה הֶחֱזִיק
  english_pob_choice: zealously repaired
  chosen_korean: 열심히 수리했습니다
  alternatives_korean:
  - 열성으로 수리했습니다
  - 열렬히 보수했습니다
  - 간절히 수리했습니다
  lexicon: HALOT
  rationale: 이 결합은 단순한 보수보다 강한 열의와 특별한 성실함을 강조하므로, 과장되지 않으면서도 동작의 강도를 살리는 ‘열심히 수리했습니다’로 옮겼습니다.
- source_word: מִדָּה שֵׁנִית
  english_pob_choice: a second section
  chosen_korean: 두 번째 구간
  alternatives_korean:
  - 또 한 구간
  - 두 번째 부분
  - 두 번째 분량
  lexicon: HALOT
  rationale: 여기서는 실제 측량값이 아니라 성벽 공사의 할당된 구간을 가리키므로, ‘구간’이 문맥상 가장 분명합니다.
- source_word: מִן הַמִּקְצוֹעַ ... עַד פֶּתַח בֵּית
  english_pob_choice: from the angle to the entrance of the house of
  chosen_korean: 모퉁이에서 시작하여 ... 집 입구까지
  alternatives_korean:
  - 모서리에서 ... 현관까지
  - 각에서 ... 문까지
  lexicon: HALOT
  rationale: ‘מִקְצוֹעַ’는 벽의 꺾이는 지점, 곧 모퉁이를 뜻하고 ‘פֶּתַח’는 물리적 출입구를 가리키므로, 공간적 범위를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: Eliashib the high priest
  chosen_korean: 대제사장 엘리아십
  alternatives_korean:
  - 대사제 엘리아십
  - 큰 제사장 엘리아십
  lexicon: HALOT
  rationale: ‘הַכֹּהֵן הַגָּדוֹל’은 한국어 성경에서 표준적으로 ‘대제사장’으로 옮기며, 인명은 현대 음역 관행에 따라 엘리아십으로 적었습니다.
