source:
  edition: WLC
  text: וְ/אֵת֙ שַׁ֣עַר הַ/דָּגִ֔ים בָּנ֖וּ בְּנֵ֣י הַ/סְּנָאָ֑ה הֵ֣מָּה קֵר֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו מַנְעוּלָ֖י/ו וּ/בְרִיחָֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/003.yaml
  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
  footnotes:
  - marker: a
    text: Or 'covered it' or 'laid its beams.' The Hebrew verb refers to covering a structure in a building context.
    reason: lexical_alternative
  - marker: b
    text: '''Sons of'' may denote a family or clan group, that is, ''descendants of Hassenaah.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 하세나 자손이 어문을 건축했습니다. 그들은 그것을 지붕으로 덮고, 그 문의 문짝들과 빗장들과 빗장막대를 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어문’은 히브리어 ‘물고기 문’을 의미하는 성문 이름입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנוּ
  english_pob_choice: built
  chosen_korean: 건축했습니다
  alternatives_korean:
  - 지었습니다
  - 세웠습니다
  - 건설했습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 신축이 아니라 성문 보수 작업이지만, 히브리어 동사 자체는 기본적으로 ‘짓다/건축하다’이므로 이를 직접 살린 표현이 적절합니다.
- source_word: שַׁעַר הַדָּגִים
  english_pob_choice: the Fish Gate
  chosen_korean: 어문
  alternatives_korean:
  - 물고기 문
  - 생선 문
  - 어문
  lexicon: HALOT
  rationale: 예루살렘 성문의 고유명칭을 자연스러운 한국어로 옮기되, ‘어문’은 문자적 의미를 유지하면서도 고유명처럼 읽히는 형태입니다.
- source_word: קֵרֻהוּ
  english_pob_choice: roofed it
  chosen_korean: 그것을 지붕으로 덮고
  alternatives_korean:
  - 그것을 덮고
  - 그것의 들보를 놓고
  - 지붕을 얹고
  lexicon: HALOT
  rationale: 건축 문맥에서 ‘덮다/지붕을 덮다’의 뜻을 반영해야 하므로, 성문 위를 마감하는 행위를 드러내는 표현을 택했습니다.
- source_word: דַּלְתֹתָיו מַנְעוּלָיו וּבְרִיחָיו
  english_pob_choice: its doors, its bolts, and its bars
  chosen_korean: 그 문의 문짝들과 빗장들과 빗장막대
  alternatives_korean:
  - 그 문의 문들과 빗장들과 빗장들
  - 그 문의 문짝들과 자물쇠들과 빗장들
  - 그 문의 판문들과 잠금장치들과 빗장들
  lexicon: HALOT
  rationale: 성문 장치들의 나열이므로 각각의 구조물을 구분해 주는 것이 좋습니다. מַנְעוּלִים은 문맥상 ‘자물쇠’보다 고정 장치인 ‘빗장’ 계열이 더 적절하고, בְּרִיחִים은 그 막대 자체를 가리키므로 ‘빗장막대’로 구체화했습니다.
theological_decisions:
- issue: 성문과 건축 용어의 직역 정도
  chosen_reading: 전통적 교회 용어로 완전히 바꾸지 않고, 원문의 건축·복구 동작을 드러내는 직역을 유지했습니다.
  alternative_readings:
  - ‘수축했습니다’로 더 현대적으로 완화
  - ‘보수했습니다’로 기능 중심 번역
  rationale: 이 절은 도시 성문 재건의 세부 항목을 기록하는 목록체이므로, 서술의 기술적 성격을 살리는 편이 원문의 의도에 가깝습니다.
  doctrine_reference: 본문의 역사-서술적 성격 유지
- issue: 고유명칭의 음역과 의미 번역
  chosen_reading: 성문 고유명칭은 의미 번역을 우선하되, 한국어에서 낯설지 않게 ‘어문’으로 옮겼습니다.
  alternative_readings:
  - ‘물고기 문’처럼 직역
  - ‘피시 게이트’처럼 음역
  rationale: 고유명칭이지만 의미가 투명한 지명은 원문 의미를 보존하는 것이 더 중요하며, 동시에 한국어 독자에게도 이해 가능해야 합니다.
  doctrine_reference: 고유명칭 처리 원칙
