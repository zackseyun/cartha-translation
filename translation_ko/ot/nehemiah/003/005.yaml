revisions:
- from: 그들 곁에 드고아 사람들이 수리를 했습니다. 그러나 그들의 귀족들은 자기 주인들의 일에 목을 들이밀지 않았습니다.[a][b]
  to: 그들 곁에서는 드고아 사람들이 수리했습니다.[b] 그러나 그들의 귀족들은 그들의 상전들의 일에 목을 굽히지 않았습니다.[a]
  rationale: 수리 목록의 인접 관계와 드고아 주민의 작업은 유지했습니다. 귀족들의 거부를 나타내는 히브리어 ‘목’ 비유는 한국어에서 오해될 수 있는 ‘목을 들이밀다’ 대신 ‘목을 굽히다’로 옮기고, 각주에서 문자적 표현과 노동·복종의 함의를 밝혔습니다. ‘상전들’은 복수의 인간적 권위자를 보존하며, 이를 단수의 신적 ‘주님’으로 해석하지 않습니다.
