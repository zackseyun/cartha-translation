id: NEH.3.5
reference: Nehemiah 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל יָדָ֖/ם הֶחֱזִ֣יקוּ הַ/תְּקוֹעִ֑ים וְ/אַדִּֽירֵי/הֶם֙ לֹא הֵבִ֣יאוּ צַוָּרָ֔/ם בַּ/עֲבֹדַ֖ת אֲדֹנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
  footnotes:
  - marker: a
    text: Or 'their leading men' for 'their nobles.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'did not bring their neck to the work of their lords,' an idiom for refusing to submit to or take up the labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 곁에 드고아 사람들이 수리를 했습니다. 그러나 그들의 귀족들은 자기 주인들의 일에 목을 들이밀지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 목을 가져오지 않았다’는 관용구로, 순종하거나 노동에 참여하기를 거부했다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘드고아 사람들’은 드고아 주민들을 가리키는 집단명입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/עַל יָדָ֖/ם
  english_pob_choice: And next to them
  chosen_korean: 그들 곁에
  alternatives_korean:
  - 그들 옆에
  - 그들 다음으로
  - 그들 가까이에
  lexicon: HALOT
  rationale: עַל־יָד는 이 목록 문맥에서 인접을 나타내므로, 현대 한국어에서는 가장 자연스러운 ‘그들 곁에’로 옮겨 인접한 순서를 살렸습니다.
- source_word: הֶחֱזִ֣יקוּ
  english_pob_choice: made repairs
  chosen_korean: 수리를 했습니다
  alternatives_korean:
  - 수리했습니다
  - 보수했습니다
  - 보강했습니다
  lexicon: HALOT
  rationale: 느헤미야 3장의 반복 표현은 성벽을 고치고 복구하는 작업을 가리키므로, 목록체에 맞는 ‘수리를 했습니다’로 옮겼습니다.
- source_word: הַ/תְּקוֹעִ֑ים
  english_pob_choice: the Tekoites
  chosen_korean: 드고아 사람들
  alternatives_korean:
  - 드고아인들
  - 드고아 주민들
  lexicon: HALOT
  rationale: 지명에서 온 집단명이라 한국어 성경 관용에 맞게 ‘드고아 사람들’로 옮겨 집단 정체성을 분명히 했습니다.
- source_word: לֹא הֵבִ֣יאוּ צַוָּרָ֔/ם
  english_pob_choice: would not put their necks
  chosen_korean: 목을 들이밀지 않았습니다
  alternatives_korean:
  - 목을 굽히지 않았습니다
  - 목을 내밀지 않았습니다
  - 자기 목을 내놓지 않았습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘목’을 쓰는 관용구로, 순종하거나 노동에 참여하려 하지 않았다는 뜻입니다. 한국어에서는 그 거부감을 살리면서도 이해 가능한 ‘목을 들이밀지 않았습니다’로 옮겼습니다.
- source_word: בַּ/עֲבֹדַ֖ת אֲדֹנֵי/הֶֽם
  english_pob_choice: the work of their lords
  chosen_korean: 자기 주인들의 일
  alternatives_korean:
  - 자기 주인들의 작업
  - 그들의 주인들의 노동
  - 자기 상관들의 일
  lexicon: HALOT
  rationale: עֲבֹדָה는 여기서 추상적 ‘봉사’보다 실제 노동을 뜻하며, אֲדֹנֵיהֶם은 문맥상 인간 상전/상관을 가리키므로 직역성을 살린 ‘자기 주인들의 일’이 적절합니다.
theological_decisions:
- issue: ‘their lords’의 지시 대상
  chosen_reading: 야훼가 아니라, 성벽 재건을 지휘하는 인간 상전/상관들을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - ‘주님의 일’로 완화해 읽는 해석
  - 단수의 하나님 지시로 일반화하는 해석
  rationale: 본문은 복수형 ‘their lords’이며, 문맥도 공동체 노동 배치를 말하므로 신적 호칭으로 바꾸지 않고 인간 지배 관계를 그대로 드러내야 합니다.
  doctrine_reference: Translation philosophy §1, §3
