  timestamp: '2026-07-13T15:37:18Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘목을 들이밀지 않았습니다’는 히브리어의 멍에·복종 및 노동 참여의 비유를 충분히 전달하지 못하고, 한국어에서는 흔히 ‘참견하다’라는 다른 뜻으로 이해될 수 있습니다. ‘목을 굽히지 않았습니다’가 본문의 비유와 거부의 뜻을 더 정확히 보존합니다.
  naturalness: ‘그들 곁에’는 자연스럽고, ‘드고아 사람들’도 적절합니다. 그러나 ‘자기 주인들의 일에 목을 들이밀지 않았다’는 현대 한국어에서 부자연스럽고 의미가 어긋날 소지가 있습니다. 또한 드고아 주민 설명 각주는 해당 명칭 바로 뒤에 붙이는 편이 앵커 관계를 분명히 합니다.
  terminology: ‘귀족들’은 אַדִּירֵיהֶם의 문맥상 적절합니다. אֲדֹנֵיהֶם은 복수형 인간 상전을 가리키므로 신적 호칭인 ‘주님’으로 바꾸지 않고 ‘상전들’로 옮기는 것이 원문 및 영어 감사 기록에 부합합니다.
