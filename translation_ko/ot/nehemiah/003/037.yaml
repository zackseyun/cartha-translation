  text: 그들의 죄를 덮지 마시며, 그들의 죄를 당신 앞에서 지우지 마시옵소서. 그들이 건축자들 앞에서 노여움을 일으켰기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''그들의 불의를 용서하지 마시라''로 번역할 수도 있습니다. 히브리어의 이미지는 ''그들의 죄를 덮지 마시라''입니다.'
    reason: alternative_reading
  - marker: b
    text: '''그들이 건축자들 앞에서 당신을 노엽게 하였음이라''로 번역할 수도 있습니다. 히브리어에는 직접적인 대상이 명시되어 있지 않으나, 그들의 행위가 재건하는 자들 앞에서 공개적으로 노여움을 일으켰다는 뜻입니다.'
