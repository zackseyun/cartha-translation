  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/טוֹבִיָּ֥ה הָ/עַמֹּנִ֖י אֶצְל֑/וֹ וַ/יֹּ֗אמֶר גַּ֚ם אֲשֶׁר הֵ֣ם בּוֹנִ֔ים אִם יַעֲלֶ֣ה שׁוּעָ֔ל וּ/פָרַ֖ץ חוֹמַ֥ת אַבְנֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
  footnotes:
  - marker: a
    text: Or, “he will break down their wall of stones.” The Hebrew verb can suggest breaching or breaking down, and the phrase is part of Tobiah’s mockery of the wall’s weakness.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word for “fox” can in some contexts refer more broadly to a fox-like canid, though “fox” is the standard rendering here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 암몬 사람 도비야가 그 곁에 있었고, 그가 말했습니다. “그들이 짓는 저것도—만일 여우가 그 위로 올라가면, 그들의 돌담을 뚫어 버릴 것이다!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 곁에 있었고’는 אצל의 위치 관계를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여우’는 שׁוּעָל의 표준 번역이며, 일부 맥락에서 더 넓은 족제비류를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטוֹבִיָּה הָעַמֹּנִי
  english_pob_choice: Tobiah the Ammonite
  chosen_korean: 암몬 사람 도비야
  alternatives_korean:
  - 암몬 사람 토비야
  - 암몬 사람 도비아
  lexicon: WLC / 표준 외래어 표기
  rationale: 고유명사는 통용 표기를 따르되, 민족명은 מקור의 ազգ성 표지를 살려 ‘암몬 사람’으로 옮겼습니다.
- source_word: אֶצְלוֹ
  english_pob_choice: was beside him
  chosen_korean: 그 곁에 있었고
  alternatives_korean:
  - 그 옆에 있었고
  - 그와 함께 있었고
  lexicon: HALOT
  rationale: אצל은 근접 관계를 나타내므로, 산발랏 곁에 서 있던 상황을 자연스럽게 ‘그 곁에’로 옮겼습니다.
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  english_pob_choice: Even what they are building
  chosen_korean: 그들이 짓는 저것도
  alternatives_korean:
  - 그들이 짓고 있는 것도
  - 심지어 그들이 짓는 것도
  lexicon: HALOT
  rationale: גַּם의 조롱 섞인 강조를 살리기 위해 ‘저것도’로 다소 비웃는 뉘앙스를 유지했습니다.
- source_word: וּפָרַץ
  english_pob_choice: he will break through
  chosen_korean: 뚫어 버릴 것이다
  alternatives_korean:
  - 부숴 버릴 것이다
  - 무너뜨릴 것이다
  lexicon: HALOT
  rationale: פרץ는 ‘돌파하다, 뚫다, 허물다’의 뜻이므로, 담의 취약함을 조롱하는 맥락에 맞게 ‘뚫어 버릴 것이다’로 옮겼습니다.
- source_word: חוֹמַת אַבְנֵיהֶם
  english_pob_choice: their stone wall
  chosen_korean: 그들의 돌담
  alternatives_korean:
  - 그들의 돌로 된 담
  - 그들의 돌벽
  lexicon: HALOT
  rationale: 구성구는 문자적으로 ‘그들의 돌의 담’이므로, 한국어로는 간결하고 자연한 ‘돌담’이 원문의 재질 정보를 보존합니다.
theological_decisions:
- issue: 도비야의 조롱 발화의 직접화법 유지
  chosen_reading: 직접 인용부호를 유지해 도비야의 비웃는 말투를 그대로 드러냈습니다.
  alternative_readings:
  - 간접화법으로 완화하여 서술
  - 조롱을 풀어 설명적으로 번역
  rationale: 본문은 적대자의 조롱을 극적으로 제시하므로, 서술화하면 수사적 긴장이 약해집니다.
  doctrine_reference: 본문 서사·수사 보존
