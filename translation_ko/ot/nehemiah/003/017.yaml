  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/לְוִיִּ֖ם רְח֣וּם בֶּן בָּנִ֑י עַל יָד֣/וֹ הֶחֱזִ֗יק חֲשַׁבְיָ֛ה שַׂר חֲצִי פֶ֥לֶךְ קְעִילָ֖ה לְ/פִלְכּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
  footnotes:
  - marker: a
    text: Or 'repaired'; the Hebrew verb literally means 'made strong' but in Nehemiah 3 refers to repair work on the wall.
    reason: lexical_alternative
  - marker: b
    text: Literally 'at his hand,' an idiom here meaning 'next to him' or 'beside him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for his section.' The Hebrew may refer either to the district under Hashabiah's authority or to the portion assigned to him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤를 이어 레위 사람들인 르훔의 아들 바니가 수리했습니다. 그 옆에는 하샤뱌가 수리했는데, 그는 게일라 반 구역의 지도자였으며 자기 구역을 위해 수리했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수리했습니다’. 히브리어 동사는 문자적으로는 ‘강하게 하다’라는 뜻이지만, 느헤미야 3장에서는 성벽 보수 작업을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 문자적으로는 ‘그의 손에/손 곁에’이며, 여기서는 ‘그 옆에’라는 인접 위치를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 구역을 위해’. 히브리어는 하샤뱌의 관할 구역 또는 그에게 배정된 몫을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  english_pob_choice: carried out repairs
  chosen_korean: 수리했습니다
  alternatives_korean:
  - 보수했습니다
  - 보강했습니다
  - 수축(修築)했습니다
  lexicon: HALOT
  rationale: 느헤미야 3장의 반복 공식은 단순한 ‘강하게 하다’보다 성벽 공사를 가리키므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘수리하다’를 택했습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 지파 사람들
  lexicon: HALOT
  rationale: 공동체 명단 문맥에서 정체성을 분명히 하되, 현대 한국어에서 무리 없이 읽히는 표준 표현으로 옮겼습니다.
- source_word: עַל יָדוֹ
  english_pob_choice: Next to him
  chosen_korean: 그 옆에는
  alternatives_korean:
  - 그 곁에는
  - 바로 옆에는
  lexicon: HALOT
  rationale: 직역하면 ‘그의 손에’이지만, 명단 맥락에서는 인접한 작업 위치를 뜻하므로 ‘그 옆에는’이 가장 자연스럽습니다.
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  english_pob_choice: ruler of half the district of Keilah
  chosen_korean: 게일라 반 구역의 지도자
  alternatives_korean:
  - 게일라 반 지방의 통치자
  - 게일라 반 구역의 관리
  lexicon: HALOT
  rationale: שַׂר는 행정·통치 책임자를 가리키는 말이라 ‘지도자’로 옮겼고, פֶלֶךְ는 이 문맥에서 행정 구획이므로 ‘구역’으로 처리했습니다.
