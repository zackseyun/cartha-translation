id: NEH.3.36
reference: Nehemiah 3:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁמַ֤ע אֱלֹהֵ֨י/נוּ֙ כִּֽי הָיִ֣ינוּ בוּזָ֔ה וְ/הָשֵׁ֥ב חֶרְפָּתָ֖/ם אֶל רֹאשָׁ֑/ם וּ/תְנֵ֥/ם לְ/בִזָּ֖ה בְּ/אֶ֥רֶץ שִׁבְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
  footnotes:
  - marker: a
    text: Or 'we have become an object of scorn.' The Hebrew is literally 'we have become contempt.'
    reason: lexical_alternative
  - marker: b
    text: Or 'give them for plunder' or 'make them spoil.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in the land of captivity.' The Hebrew may be read either indefinitely or more specifically depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 들으소서, 우리 하나님. 우리는 멸시를 당하고 있습니다. 그들의 치욕을 그들 머리 위로 되돌리시고, 그들을 포로의 땅에서 노획물로 넘겨 주십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 멸시의 대상이 되었습니다.’ 히브리어는 문자적으로 ‘우리가 멸시가 되었습니다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노획물로 삼아 주십시오’ 또는 ‘노략감이 되게 하십시오.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘포로의 땅에서.’ 히브리어는 문맥에 따라 ‘어느 포로의 땅’으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע אֱלֹהֵינוּ
  english_pob_choice: Hear, our God
  chosen_korean: 들으소서, 우리 하나님
  alternatives_korean:
  - 들으십시오, 우리 하나님
  - 들으소서, 오 우리 하나님
  lexicon: HALOT
  rationale: 하나님께 드리는 직접 호소이므로 공손한 명령형을 살렸고, 영어의 자연스러운 호격을 한국어에서는 쉼표로 충분히 드러냈습니다.
- source_word: הָיִינוּ בוּזָה
  english_pob_choice: we are despised / we have become despised
  chosen_korean: 우리는 멸시를 당하고 있습니다
  alternatives_korean:
  - 우리는 멸시를 받았습니다
  - 우리는 멸시가 되었습니다
  - 우리는 경멸의 대상이 되었습니다
  lexicon: HALOT
  rationale: 히브리어의 결과 상태를 한국어 현재진행형으로 옮기면 ‘지금 그런 상태에 놓여 있음’이 자연스럽게 드러나며, בוּזָה의 수치를 ‘멸시’로 직접 보존했습니다.
- source_word: חֶרְפָּתָם אֶל רֹאשָׁם
  english_pob_choice: their reproach back on their own heads
  chosen_korean: 그들의 치욕을 그들 머리 위로 되돌리시고
  alternatives_korean:
  - 그들의 수치를 그들 머리 위로 되돌리시고
  - 그들의 모욕을 그들 머리 위로 되돌리시고
  - 그들의 치욕을 그들 머리에 되돌리시고
  lexicon: HALOT
  rationale: חרפה는 ‘치욕/수치/모욕’의 범위가 있으나, 문맥상 부끄러움과 수치의 되갚음을 살려 ‘치욕’으로 옮겼고, ‘머리 위로’는 보복적 반전을 자연스럽게 드러냅니다.
- source_word: וּתְנֵם לְבִזָּה
  english_pob_choice: give them over as plunder
  chosen_korean: 그들을 포로의 땅에서 노획물로 넘겨 주십시오
  alternatives_korean:
  - 그들을 노략감으로 넘겨 주십시오
  - 그들을 노획물로 삼아 주십시오
  - 그들을 전리품으로 넘겨 주십시오
  lexicon: HALOT
  rationale: בִּזָּה는 전리품/노획물의 의미이므로 전쟁·약탈의 성격을 분명히 하는 ‘노획물’이 적절합니다. 동사의 처분 의미는 ‘넘겨 주십시오’로 살렸습니다.
- source_word: בְּאֶרֶץ שִׁבְיָה
  english_pob_choice: in a land of captivity
  chosen_korean: 포로의 땅에서
  alternatives_korean:
  - 포로의 땅 안에서
  - 포로 생활의 땅에서
  - 감금의 땅에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘포로의 땅’이며, 한국어에서는 처소를 나타내는 ‘-에서’가 자연스럽습니다. 영어 주석의 불특정성은 문맥상 보존하면서도 매끄럽게 옮겼습니다.
theological_decisions:
- issue: 저주/보복 청원의 강도 보존
  chosen_reading: 원문의 반전 청원과 노획물화 요청을 완화하지 않고 직접적으로 유지했습니다.
  alternative_readings:
  - 일반적인 정의 청원으로 순화
  - 상징적 표현으로 약화
  rationale: 본문은 적들의 치욕을 그들 머리 위로 되돌리고 그들을 노획물로 넘겨 달라고 구체적으로 청합니다. 이 강도를 약화하면 시편적/예언적 탄원의 성격이 흐려집니다.
  doctrine_reference: Translation philosophy §1, §3
