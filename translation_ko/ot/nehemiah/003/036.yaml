  source_fidelity: 히브리어의 세 청원과 보복의 강도는 대체로 충실히 옮겼습니다. 다만 הָיִינוּ בוּזָה는 단순한 현재 수동 상태보다 ‘멸시거리가 되었다’라는 결과적 상태가 더 직접적이며, חֶרְפָּתָם은 적들이 가한 ‘모욕/비방’을 가리키므로 ‘치욕’보다 ‘모욕’이 소유격의 모호성을 줄입니다. בְּאֶרֶץ שִׁבְיָה는 ‘포로의 땅’보다 ‘사로잡혀 간 땅’이 한국어에서 더 자연스럽고 포로 상태의 땅이라는 뜻을 분명히 합니다.
