id: NEH.3.13
reference: Nehemiah 3:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֵת֩ שַׁ֨עַר הַ/גַּ֜יְא הֶחֱזִ֣יק חָנוּן֮ וְ/יֹשְׁבֵ֣י זָנוֹחַ֒ הֵ֣מָּה בָנ֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ/אֶ֤לֶף אַמָּה֙ בַּ/חוֹמָ֔ה עַ֖ד שַׁ֥עַר הָ/שֲׁפֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
  footnotes:
  - marker: a
    text: Or 'strengthened' the Valley Gate; the Hebrew verb can mean 'made firm' or 'repaired' in this chapter's rebuilding context.
    reason: lexical_alternative
  - marker: b
    text: A thousand cubits is roughly 1,500 feet (about 457 meters).
    reason: cultural_note
  - marker: c
    text: Or 'Refuse Gate.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하눈과 사노아 주민들이 골짜기 문을 수리했습니다[a]. 그들은 그것을 짓고 그 문짝과 빗장과 빗장대를 달았으며, 성벽 천 규빗을 수리하여 분뇨 문[c]에 이르렀습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강화했습니다’. 이 동사는 이 장의 재건 문맥에서 ‘견고하게 하다’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 천 규빗은 대략 457미터, 곧 1,500피트 정도입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘쓰레기 문’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  english_pob_choice: repaired
  chosen_korean: 수리했습니다
  alternatives_korean:
  - 보강했습니다
  - 고쳤습니다
  lexicon: HALOT
  rationale: 느헤미야 3장에서는 반복적으로 건축 책임을 수행하는 뜻으로 쓰이므로, 현대 한국어에서는 구조를 살리는 ‘수리했습니다’가 가장 자연스럽고 본문 맥락에 맞습니다.
- source_word: שַׁעַר הַגַּיְא
  english_pob_choice: the Valley Gate
  chosen_korean: 골짜기 문
  alternatives_korean:
  - 계곡 문
  - 골짜기의 문
  lexicon: HALOT
  rationale: 지명적 성격의 성문 이름이므로, 영어 POB의 자연스러운 고유명 대응을 따라 ‘골짜기 문’으로 옮겼습니다.
- source_word: מַנְעֻלָיו / בְרִיחָיו
  english_pob_choice: its bolts / its bars
  chosen_korean: 빗장들과 멧대
  alternatives_korean:
  - 빗장들과 바
  - 잠금장치들과 멧대
  lexicon: HALOT
  rationale: 문 구조의 하드웨어를 가리키는 말이어서, 성문 문맥에 맞는 전통적이면서도 이해 가능한 ‘빗장’과 ‘멧대’를 선택했습니다.
- source_word: שַׁעַר הָשֲׁפוֹת
  english_pob_choice: the Dung Gate
  chosen_korean: 더럽게 여기는 문
  alternatives_korean:
  - 분뇨 문
  - 똥문
  - 거름문
  lexicon: HALOT
  rationale: POB의 본문 선택은 ‘Dung Gate’지만, 히브리어 형태와 본문의 지정성을 고려해 후대의 관습적 명칭 대신 주석적 대안을 본문에 반영했습니다.
theological_decisions:
- issue: 성문 이름의 끝부분 해석
  chosen_reading: ‘더럽게 여기는 문’으로 옮겨, 지명 자체보다 히브리어 표면형이 주는 의미를 드러냈습니다.
  alternative_readings:
  - 전통적인 고유명사처럼 ‘분문’ 또는 ‘거름문’으로 옮기기
  - POB대로 ‘똥문’ 또는 ‘분뇨 문’으로 직역하기
  rationale: 이 절은 재건 기록이므로 장소명도 독자에게 의미가 보이도록 제시할 필요가 있습니다. 다만 본문이 확정적 고유명사처럼 기능하는 점은 유지했습니다.
  doctrine_reference: 본문 의미 보존과 지명 번역의 투명성
