  source_fidelity: ‘더럽게 여기는 문’은 히브리어 שַׁעַר הָאַשְׁפּוֹת/הַשֲׁפוֹת가 가리키는 성문 이름의 의미를 충실히 옮기지 못합니다. 이 명칭은 폐기물·분뇨와 관련된 문을 뜻하므로 ‘분뇨 문’(또는 ‘쓰레기 문’)으로 번역해야 합니다. 또한 בָּנוּהוּ는 문을 ‘세웠다’보다 ‘지었다’로 옮기는 편이 직접적입니다.
  naturalness: 전체 문장은 합쇼체로 자연스럽지만, ‘성벽을 천 규빗이나 고쳐서’의 ‘이나’는 강조로 들리며 거리의 범위를 나타내는 원문에 덜 맞습니다. ‘성벽 천 규빗을 수리하여’가 더 자연스럽고 정확합니다. ‘멧대’는 현대 독자에게 낯설 수 있으므로 기능이 분명한 ‘빗장대’를 사용했습니다.
  terminology: ‘하눈’, ‘사노아’, ‘골짜기 문’, ‘규빗’은 적절합니다. 성문 명칭은 ‘분뇨 문’으로 바로잡고, 대안으로 ‘쓰레기 문’을 주석에 제시합니다. 문 고정 장치는 ‘빗장’과 ‘빗장대’로 구별했습니다.
