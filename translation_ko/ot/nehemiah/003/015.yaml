id: NEH.3.15
reference: Nehemiah 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
  footnotes:
  - marker: a
    text: Or 'the Pool of Siloah' (traditionally associated with Siloam). The Hebrew place-name here is Shelah.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 눈샘 문을 할호세의 아들 살룬, 미스바 구역의 관리가 수리하였습니다. 그는 그것을 다시 세우고 지붕을 덮었으며, 그 문의 문짝과 빗장과 빗쇠를 달았고, 왕의 정원 곁에 있는 실로아 못의 담을, 다윗 성에서 내려가는 계단까지 수리하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘실로암 못’(전통적으로 실로암과 관련됨)으로 번역할 수 있습니다. 이 히브리어 지명은 셀라흐/실로아 형태입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  english_pob_choice: the Fountain Gate
  chosen_korean: 눈샘 문
  alternatives_korean:
  - 샘 문
  - 분수 문
  lexicon: HALOT
  rationale: עַיִן은 문맥상 물이 솟는 샘을 가리킬 수 있으므로, ‘Fountain Gate’의 의미를 살리되 ‘눈샘 문’으로 옮겨 물길과 지형 맥락을 직접 드러냈습니다.
- source_word: הֶחֱזִיק / יִבְנֶנּוּ / וִיטַלְלֶנּוּ
  english_pob_choice: repaired / rebuilt it / roofed it
  chosen_korean: 수리하였습니다 / 다시 세우고 지붕을 덮었으며
  alternatives_korean:
  - 보수하였습니다 / 다시 지었고 덮었으며
  - 고쳐 지었고 지붕을 올렸으며
  lexicon: HALOT
  rationale: 느헤미야 3장의 공사 맥락에서 הֶחֱזִיק은 ‘수리하다’, יִבְנֶנּוּ는 ‘다시 세우다’, וִיטַלְלֶנּוּ는 구조물을 ‘지붕을 덮다’로 옮기는 것이 가장 자연스럽고 의미를 정확히 전달합니다.
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  english_pob_choice: official of the district of Mizpah
  chosen_korean: 미스바 구역의 관리
  alternatives_korean:
  - 미스바 지방의 통치자
  - 미스바 구역의 장관
  lexicon: HALOT
  rationale: שַׂר은 과도하게 군주적 의미를 주지 않도록 ‘관리’로, פֶּלֶךְ은 행정 구역이므로 ‘구역’으로 옮겨 행정 직함의 성격을 살렸습니다.
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדוֹת מֵעִיר דָּוִיד
  english_pob_choice: as far as the stairs that go down from the City of David
  chosen_korean: 다윗 성에서 내려가는 계단까지
  alternatives_korean:
  - 다윗 성에서 내려가는 층계까지
  - 다윗 성에서 내려가는 사다리까지
  lexicon: HALOT
  rationale: מַעֲלוֹת는 문자적으로 ‘계단/층계’를 뜻하며, היורדות가 내려감을 분명히 하므로 ‘내려가는 계단’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 고유 지명 'שֶׁלַח'의 음역과 전통적 동일시
  chosen_reading: ‘실로아 못’으로 옮기되, 본문에서는 히브리어 지명 형태를 반영해 전통적 동일시를 살렸습니다.
  alternative_readings:
  - 실로암 못
  - 실로아(실로암) 못
  rationale: 영문 POB가 각주로 ‘Siloah/Siloam’ 전통 동일시를 남긴 점을 따라, 한국어 본문에는 ‘실로아 못’을 두고 전통적 익숙함은 각주 없이 본문 안에서 충분히 전달했습니다.
  doctrine_reference: 지리·역사 표기 문제
