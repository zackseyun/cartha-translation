base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: Now when Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
  footnotes:
  - marker: a
    text: Or 'the Judeans.' The Hebrew term can refer to the people of Judah in a regional sense as well as to the Jews more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 산발랏이 우리가 성벽을 쌓고 있다는 말을 듣자, 그는 화가 나서 몹시 격분했고 유다 사람들을 조롱했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다 사람들’은 히브리어 יְהוּדִים의 지역적 의미를 살린 번역으로, 문맥에 따라 ‘유대인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: Now when
  chosen_korean: ~하자 / ~자
  alternatives_korean:
  - 그리고 ~하였을 때
  - ~할 때
  lexicon: HALOT
  rationale: 서사 전환을 여는 관용구이므로 한국어에서는 자연스러운 사건 전환 표현으로 옮겼습니다.
- source_word: בּוֹנִים אֶת הַחוֹמָה
  english_pob_choice: we were rebuilding the wall
  chosen_korean: 우리가 성벽을 쌓고 있다는 말
  alternatives_korean:
  - 우리가 성벽을 다시 쌓고 있다는 말
  - 우리가 성벽을 건축하고 있다는 말
  lexicon: HALOT
  rationale: חוֹמָה는 문맥상 예루살렘의 방어용 성벽이므로 ‘성벽’으로 옮겼고, 동사 בוֹנִים은 진행 중인 건축 행위를 나타내어 한국어의 현재진행으로 자연스럽게 반영했습니다.
- source_word: וַיִּכְעַס הַרְבֵּה
  english_pob_choice: and very enraged
  chosen_korean: 크게 분개하고 몹시 화를 내며
  alternatives_korean:
  - 매우 격분하고
  - 크게 노하여
  lexicon: HALOT
  rationale: 두 개의 분노 동사가 연속되어 강도가 누적되므로, 첫 표현은 ‘분개하다’, 둘째는 ‘몹시 화를 내다’로 나누어 상승 효과를 살렸습니다.
- source_word: עַל הַיְּהוּדִים
  english_pob_choice: the Jews
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대 사람들
  - 유대인들
  lexicon: HALOT
  rationale: 히브리어 יְהוּדִים는 여기서 지역적·민족적 의미를 함께 가질 수 있어, 문맥상 예루살렘과 유다 지역 주민을 가리키는 뉘앙스를 살리기 위해 ‘유다 사람들’로 옮겼습니다.
theological_decisions:
- issue: יְהוּדִים의 번역 범위
  chosen_reading: ‘유다 사람들’로 옮겨, 단순한 종교 집단명이 아니라 유다 지역의 공동체라는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘유대인들’로 일반화
  - ‘유다인들’로 음역성 유지
  rationale: 본절의 조롱 대상은 예루살렘 성벽 재건에 참여하는 지역 공동체이므로, 지역적 함의를 보존하는 번역이 본문의 수신자 이해에 더 가깝습니다.
  doctrine_reference: Neh 3:33 문맥상 공동체 정체성
