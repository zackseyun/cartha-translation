id: NEH.3.18
reference: Nehemiah 3:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחֲרָי/ו֙ הֶחֱזִ֣יקוּ אֲחֵי/הֶ֔ם בַּוַּ֖י בֶּן חֵנָדָ֑ד שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ קְעִילָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/018.yaml
  text: 'After him their brothers repaired: Bavvai son of Henadad[a], ruler of half the district of Keilah.'
  footnotes:
  - marker: a
    text: Some textual traditions read the name as 'Binnui' instead of 'Bavvai.'
    reason: textual_variant
translation:
  language: ko
  text: 그의 뒤에 그들의 형제들이 수리했습니다. 바브바이, 헤나다닷의 아들, 곧 게일라의 반 구역의 통치자입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Some textual traditions read the name as ‘Binnui’ instead of ‘Bavvai.’
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרָיו / הֶחֱזִיקוּ
  english_pob_choice: After him / repaired
  chosen_korean: 그의 뒤에 / 수리했습니다
  alternatives_korean:
  - 그 뒤에 / 보수했습니다
  - 그 다음에 / 고쳤습니다
  lexicon: HALOT
  rationale: 수리 목록의 순차 표지를 자연스럽게 살리되, הֶחֱזִיקוּ의 공사 문맥상 의미를 ‘수리했습니다’로 옮겨 벽 복구 작업임을 분명히 했습니다.
- source_word: אֲחֵיהֶם
  english_pob_choice: their brothers
  chosen_korean: 그들의 형제들
  alternatives_korean:
  - 그들의 동족들
  - 그들의 형제
  lexicon: HALOT
  rationale: 히브리어의 직접 표현을 유지해 ‘형제들’로 옮겼고, 이 문맥의 공동 작업자 집단이라는 사회적 뉘앙스를 과도하게 풀어 쓰지 않았습니다.
- source_word: בַּוַּי / בֶּן חֵנָדָד
  english_pob_choice: Bavvai son of Henadad
  chosen_korean: 바브바이, 헤나다닷의 아들
  alternatives_korean:
  - 바바이, 헤나다닷의 아들
  - 비누이, 헤나다닷의 아들
  lexicon: HALOT
  rationale: 제공된 본문 형태를 따라 인명을 음역했고, patronymic은 ‘~의 아들’로 투명하게 옮겼습니다.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  english_pob_choice: ruler of half the district
  chosen_korean: 반 구역의 통치자
  alternatives_korean:
  - 반 지역의 관리
  - 반 도의 통치자
  lexicon: HALOT
  rationale: 행정 직함임을 반영해 ‘통치자’를 사용했고, חֲצִי פֶּלֶךְ는 분할된 행정 단위를 뜻하므로 ‘반 구역’으로 옮겼습니다.
- source_word: קְעִילָה
  english_pob_choice: Keilah
  chosen_korean: 게일라
  alternatives_korean:
  - 기일라
  - 케일라
  lexicon: HALOT
  rationale: 지명은 현대 한국어 음역으로 처리했으며, 영어 POB의 Keilah에 대응하도록 표준적인 외래어 표기 방식에 맞추었습니다.
theological_decisions:
- issue: 이 절의 동사 הֶחֱזִיקוּ를 기술적 의미로 옮길지, 일반 의미로 옮길지
  chosen_reading: 건축·복구 문맥의 관용적 의미를 따라 ‘수리했습니다’로 번역했습니다.
  alternative_readings:
  - ‘강화했습니다’
  - ‘견고하게 했습니다’
  rationale: 느헤미야 3장의 열거는 성벽 복구 작업 기록이므로, 문자적인 ‘강하게 하다’보다 독자가 즉시 이해할 수 있는 공사 의미를 살렸습니다.
  doctrine_reference: 본문의 역사 서술과 행정 기록성
- issue: שַׂר חֲצִי פֶּלֶךְ의 직함을 군사적으로 볼지 행정적으로 볼지
  chosen_reading: 행정 직함으로 이해하여 ‘통치자’로 옮겼습니다.
  alternative_readings:
  - ‘지휘관’
  - ‘수령’
  rationale: 문맥이 성벽 공사 참여자 명단이므로, 군사 지휘보다 지방 행정 책임자라는 기능이 더 적절합니다.
  doctrine_reference: 구약 역사서의 행정 문맥
