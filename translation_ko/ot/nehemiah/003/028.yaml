    reason: lexical_alternative
translation:
  language: ko
  text: 말의 문 앞, 제사장들이 각기 자기 집 맞은편에서 수리하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말들의 문’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַל
  english_pob_choice: Above
  chosen_korean: 말의 문 앞
  alternatives_korean:
  - 말의 문 위쪽
  - 말의 문에서 위로
  lexicon: HALOT
  rationale: 이 절은 성벽 수리 목록의 위치 표지이므로, 영어 POB의 ‘Above’를 한국어에서는 자연스럽게 ‘... 앞’으로 옮겨 앞선 구간과의 연속적 위치를 나타냈습니다.
- source_word: שַׁעַר הַסּוּסִים
  english_pob_choice: the Horse Gate
  chosen_korean: 말의 문
  alternatives_korean:
  - 말문
  - 말들의 문
  lexicon: HALOT
  rationale: 지명적 용법의 문 이름이므로 ‘Horse Gate’의 의미를 살려 한국어 지명형으로 옮겼습니다.
- source_word: הֶחֱזִיקוּ
  english_pob_choice: made repairs
  chosen_korean: 수리하였습니다
  alternatives_korean:
  - 보수하였습니다
  - 고쳤습니다
  - 강화하였습니다
  lexicon: HALOT
  rationale: 느헤미야 3장의 관용적 건축 동작을 반영하여, 단순한 ‘강화’보다 실제 작업을 드러내는 ‘수리하다’를 선택했습니다.
- source_word: אִישׁ לְנֶגֶד בֵּיתוֹ
  english_pob_choice: each one opposite his own house
  chosen_korean: 각기 자기 집 맞은편에서
  alternatives_korean:
  - 각 사람은 자기 집 앞에서
  - 한 사람씩 자기 집 맞은편에서
  lexicon: HALOT
  rationale: 분배적 ‘אִישׁ’과 위치 표현 ‘לְנֶגֶד’를 함께 살려, 각 제사장이 자기 집과 마주한 구간을 맡았다는 뜻을 자연스러운 한국어로 옮겼습니다.
