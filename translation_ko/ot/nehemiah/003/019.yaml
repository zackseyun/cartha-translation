source:
  edition: WLC
  text: וַ/יְחַזֵּ֨ק עַל יָד֜/וֹ עֵ֧זֶר בֶּן יֵשׁ֛וּעַ שַׂ֥ר הַ/מִּצְפָּ֖ה מִדָּ֣ה שֵׁנִ֑ית מִ/נֶּ֕גֶד עֲלֹ֥ת הַ/נֶּ֖שֶׁק הַ/מִּקְצֹֽעַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
  footnotes:
  - marker: a
    text: Or “a second section.” The Hebrew phrase may emphasize that Ezer repaired an additional stretch of wall.
    reason: lexical_alternative
  - marker: b
    text: Or “the arsenal” or “the weapons.” The Hebrew likely refers here to a place associated with stored weapons, hence “the armory.”
    reason: lexical_alternative
  - marker: c
    text: Or “the corner.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 곁에서 하죠의 아들 에셀이 미스바의 관리자로서[a] 또 한 구간[b]을 수리하였는데, 그 구간은 무기고로 올라가는 길 맞은편, 모퉁이[c]에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “두 번째 구간.” 히브리어 표현은 에셀이 추가로 한 구간을 더 수리했음을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “무기고” 혹은 “무기들.” 이곳은 무기 보관 장소를 가리킬 가능성이 높아 본문에는 “무기고”를 택했습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “코너.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  english_pob_choice: repaired
  chosen_korean: 수리하였는데
  alternatives_korean:
  - 보수하였는데
  - 강화하였는데
  - 복구하였는데
  lexicon: HALOT
  rationale: 느헤미야 3장의 반복 공식에서 이 동사는 성벽 공사 참여를 가리키므로, 단순한 ‘강하게 하다’보다 ‘수리하다’가 작업 의미를 가장 자연스럽게 드러냅니다.
- source_word: עַל יָדוֹ
  english_pob_choice: Next to him
  chosen_korean: 그의 곁에서
  alternatives_korean:
  - 그 옆에서
  - 그 다음으로
  - 그의 곁에
  lexicon: HALOT
  rationale: 문맥상 성벽 공사의 인접 배치를 나타내므로, 한국어에서는 이어지는 작업 순서를 보여 주는 ‘그의 곁에서’가 가장 매끄럽습니다.
- source_word: שַׂר הַמִּצְפָּה
  english_pob_choice: official of Mizpah
  chosen_korean: 미스바의 관리자로서
  alternatives_korean:
  - 미스바의 통치자로서
  - 미스바의 수령으로서
  - 미스바의 지도자로서
  lexicon: HALOT
  rationale: שַׂר는 왕적 호칭보다 행정적·공적 직분을 가리키므로, 이 재건 명단의 문맥에서는 ‘관리자’가 가장 무리 없습니다.
- source_word: מִדָּה שֵׁנִית
  english_pob_choice: another section
  chosen_korean: 또 한 구간
  alternatives_korean:
  - 두 번째 구간
  - 한 구간을 더
  - 두 번째 몫
  lexicon: HALOT
  rationale: 히브리어는 추가로 맡은 성벽의 길을 뜻할 가능성이 크므로, ‘또 한 구간’이 수량성을 과장하지 않으면서 자연스럽습니다.
- source_word: הַמִּקְצֹעַ
  english_pob_choice: the angle
  chosen_korean: 모퉁이
  alternatives_korean:
  - 각도
  - 코너
  - 꺾이는 지점
  lexicon: HALOT
  rationale: 성벽의 지형·건축 맥락에서는 ‘모퉁이’가 가장 이해하기 쉽고, 각진 전환 지점을 잘 드러냅니다.
