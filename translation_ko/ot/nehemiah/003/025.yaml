base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
  footnotes:
  - marker: a
    text: Or 'the corner.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the upper palace.' The Hebrew is literally 'from the upper house of the king.'
    reason: lexical_alternative
  - marker: c
    text: Or 'court of the prison.' The term likely refers to a guarded detention court.
    reason: lexical_alternative
translation:
  language: ko
  text: 웃사이의 아들 발랄은 그 모서리 맞은편과 경비 뜰에 있는 왕의 윗집에서 돌출해 나온 탑을 수리하였습니다[a][b][c]. 그 뒤에는 바로스의 아들 브다야가 수리하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모퉁이’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕의 윗궁전’. 히브리어는 문자적으로 ‘왕의 윗집’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘감옥 뜰’. 이 용어는 경비된 구금 뜰을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד הַמִּקְצוֹעַ
  english_pob_choice: opposite the angle
  chosen_korean: 그 모퉁이 맞은편
  alternatives_korean:
  - 그 각도 맞은편
  - 그 코너 맞은편
  lexicon: HALOT
  rationale: מִנֶּגֶד는 위치상 ‘맞은편/반대편’을 뜻하고, הַמִּקְצוֹעַ는 벽의 ‘모퉁이/코너’에 해당하므로 한국어에서는 자연스럽게 ‘그 모퉁이 맞은편’으로 옮겼습니다.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  english_pob_choice: the tower projecting
  chosen_korean: 나와
  alternatives_korean:
  - 튀어나온
  - 돌출한
  lexicon: HALOT
  rationale: יוצא의 ‘나오다/튀어나오다’라는 뜻을 살려 탑이 건물 밖으로 돌출해 있음을 간결하게 표현했습니다.
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  english_pob_choice: from the upper house of the king
  chosen_korean: 왕의 윗집
  alternatives_korean:
  - 왕의 위쪽 집
  - 상부 왕궁
  lexicon: HALOT
  rationale: בית를 기본 의미인 ‘집’으로 두어 히브리어의 직설성을 살리고, הָעֶלְיוֹן은 ‘윗/위쪽’으로 옮겨 왕의 다른 건물과 구별되는 상부 구조임을 드러냈습니다.
- source_word: חֲצַר הַמַּטָּרָה
  english_pob_choice: the court of the guard
  chosen_korean: 감옥 뜰
  alternatives_korean:
  - 파수 뜰
  - 경비 뜰
  lexicon: HALOT
  rationale: חצר־המטּרה는 경비된 구금 공간을 가리키는 문맥이므로, POB의 설명적 뉘앙스를 반영해 ‘감옥 뜰’로 옮겼습니다. 다만 ‘감옥’은 해석이 개입된 표현이어서 본문은 그 의미를 과도하게 확정하지 않도록 footnote로 보완했습니다.
- source_word: אַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그 뒤에는
  alternatives_korean:
  - 그 다음에는
  - 그의 뒤를 이어
  lexicon: contextual syntax
  rationale: 성벽 수리 목록의 순차 공식을 자연스러운 한국어로 옮겨, 다음 인물이 이어서 수리했다는 흐름을 살렸습니다.
theological_decisions:
- issue: 왕의 윗집과 감옥 뜰의 공간 관계
  chosen_reading: 본문은 성벽 수리 구간이 왕궁 상부 건축물과 경비된 뜰과 맞닿아 있음을 있는 그대로 제시합니다.
  alternative_readings:
  - 상부 궁전
  - 왕궁의 상층부
  rationale: 히브리어의 공간 표지를 약화시키지 않고, 건축·행정 중심지와 구금 공간이 인접한 역사적 현장을 드러내는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 본문 해설/지리적 맥락
