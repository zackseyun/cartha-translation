  source_fidelity: 수리 대상의 공간 관계가 원문과 다르게 표현되었습니다. 히브리어는 ‘왕의 윗집에서 돌출해 나온 탑’ 및 그 왕의 윗집과 ‘경비 뜰’의 관계를 말하는데, 초안의 ‘왕의 윗집에서 나와 감옥 뜰에 속한 탑’은 탑이 감옥 뜰에 소속된다는 뜻으로 관계를 바꾸고, ‘감옥’도 본문에서 과도하게 확정합니다. 둘째 절의 인명 및 문법도 바로잡아야 합니다.
  naturalness: ‘왕의 윗집에서 나와 감옥 뜰에 속한 탑’은 수식 관계가 불분명하고 현대 표준어 성서 문체로도 어색합니다. ‘그 뒤에는 베다야는 바록스의 아들이’는 주제 표지의 중복과 잘못된 인명 표기로 비문입니다.
  terminology: הַמִּקְצוֹעַ는 본문에서 ‘모서리’로 옮기고 ‘모퉁이’를 각주 대안으로 두는 것이 영어 POB의 ‘angle’과 대안을 충실히 반영합니다. חֲצַר הַמַּטָּרָה는 본문에서는 ‘경비 뜰’로 번역하고 ‘감옥 뜰’을 각주 대안으로 보존해야 합니다. 인명은 한국어 성서 관용 표기인 발랄, 웃사이, 브다야, 바로스로 정정합니다.
