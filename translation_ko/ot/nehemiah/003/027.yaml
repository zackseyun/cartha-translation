base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
  footnotes:
  - marker: a
    text: Or 'a second section.' The Hebrew phrase can emphasize that the Tekoites repaired an additional portion beyond their earlier assignment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 다 드렛 사람들은 또 다른 구간을 수리했는데, 큰 돌출 탑 맞은편에서 오벨 성벽까지였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 번째 구간’. 히브리어 구문은 드렛 사람들이 앞서 맡은 구간에 더해 추가 구간을 수리했음을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 후에
  - 그 다음에
  lexicon: HALOT
  rationale: 공사 명단의 순서를 나타내는 표현이므로, 공간적 의미보다 선후 관계를 살린 자연스러운 한국어로 옮겼습니다.
- source_word: הַתְּקֹעִים
  english_pob_choice: the Tekoites
  chosen_korean: 드렛 사람들
  alternatives_korean:
  - 드렛 주민들
  - 드렛 출신 사람들
  lexicon: HALOT
  rationale: 지명 Tekoa의 주민을 가리키는 집합명사이므로, 한국어에서는 지명에 '-사람들'을 붙여 집단 정체성을 간결하게 드러냈습니다.
- source_word: מִדָּה שֵׁנִית
  english_pob_choice: another section
  chosen_korean: 또 다른 구간
  alternatives_korean:
  - 두 번째 구간
  - 한 구간을 더
  lexicon: HALOT
  rationale: 같은 집단이 이전 할당에 더해 추가로 맡은 부분이라는 뜻을 살려, 구어적이면서도 본문의 건축 맥락에 맞는 표현을 택했습니다.
- source_word: הַיּוֹצֵא
  english_pob_choice: projecting
  chosen_korean: 돌출
  alternatives_korean:
  - 튀어나온
  - 바깥으로 나온
  lexicon: HALOT
  rationale: 성벽 선에서 바깥으로 튀어나온 탑의 형상을 직접적으로 드러내는 건축 용어로 옮겼습니다.
