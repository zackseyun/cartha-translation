  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
  footnotes:
  - marker: a
    text: Or 'Hashub' for Hasshub.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에는 베냐민과 하숩이 자기 집 맞은편에서 수리를 했습니다. 그 뒤에는 아사랴 — 마아세야의 아들이요, 아나냐의 손자 — 가 자기 집 곁에서 수리를 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그 뒤에는
  alternatives_korean:
  - 그 다음에는
  - 그 뒤를 이어
  lexicon: HALOT
  rationale: 이 절의 반복 구조는 시간표시보다 성벽 공사의 진행 순서를 나타내므로, 한국어도 자연스러운 순서 표지인 ‘그 뒤에는’으로 옮겼습니다.
- source_word: הֶחֱזִיק
  english_pob_choice: made repairs
  chosen_korean: 수리를 했습니다
  alternatives_korean:
  - 수리했습니다
  - 보수했습니다
  - 강화했습니다
  lexicon: HALOT
  rationale: 이 동사는 느헤미야 3장에서 성벽 보수 참여를 가리키는 관용적 표현이므로, 의미를 분명히 드러내는 ‘수리를 했습니다’를 선택했습니다.
- source_word: נֶגֶד
  english_pob_choice: opposite
  chosen_korean: 맞은편에서
  alternatives_korean:
  - 앞에서
  - 마주 보며
  lexicon: HALOT
  rationale: 위치 관계를 분명하게 보여 주는 말로, 문맥상 단순한 방향이 아니라 마주 보는 위치를 뜻하므로 ‘맞은편에서’가 적절합니다.
- source_word: אֵצֶל
  english_pob_choice: beside
  chosen_korean: 곁에서
  alternatives_korean:
  - 옆에서
  - 가까이에서
  lexicon: HALOT
  rationale: 두 번째 위치 표지는 첫 절의 ‘맞은편’과 구별되는 근접성을 나타내므로, 가장 자연스럽고 간결한 ‘곁에서’로 옮겼습니다.
