revisions:
- from: 그 뒤에는 베냐민과 하숩이 자기 집 맞은편에서 수리를 했습니다. 그 뒤에는 아사랴 — 마아세야의 아들이요, 아나냐의 손자 — 가 자기 집 곁에서 수리를 했습니다.
  to: 그 뒤에는 베냐민과 핫숩이 그들의 집 맞은편을 수리했습니다. 그 뒤에는 마아세야의 아들이며 아나냐의 손자인 아사랴가 자기 집 곁을 수리했습니다.
  rationale: 복수 소유를 명시하고, 인명 표기를 표준화하며, 위치 구문과 계보 구문을 자연스러운 합쇼체 문장으로 다듬었습니다. ‘그 뒤에는’은 성벽 보수 목록의 진행 순서를 보존하고, ‘맞은편’과 ‘곁’은 נֶגֶד와 אֵצֶל의 구별을 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:37:23Z'
