  text: And next to him the men of Jericho built[a], and next to them Zaccur the son of Imri built.
  footnotes:
  - marker: a
    text: 'Hebrew: ''next to him'' also in the second clause; the English ''next to them'' makes explicit the relation to the preceding group, the men of Jericho.'
