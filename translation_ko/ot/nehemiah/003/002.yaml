translation:
  language: ko
  text: 그리고 그의 곁에 여리고 사람들은 건축하였고[a], 그들의 곁에 삭굴이 임리의 아들로서 건축하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 두 번째 절에서도 ‘그의 곁에’에 해당하는 단수 표현을 쓰지만, 영어 POB처럼 앞의 집단과의 관계를 분명히 하기 위해 한국어에서는 ‘그들의 곁에’로 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  english_pob_choice: next to him
  chosen_korean: 그의 곁에
  alternatives_korean:
  - 그의 손에
  - 그와 나란히
  - 그의 옆에
  lexicon: HALOT
  rationale: עַל יָד + 대명사 접미사는 이 문맥에서 인접 위치를 뜻하므로, 현대 한국어에서는 자연스러운 ‘그의 곁에’로 옮겨 공간적 관계를 분명히 했습니다.
- source_word: אַנְשֵׁי יְרֵחוֹ
  english_pob_choice: the men of Jericho
  chosen_korean: 여리고 사람들은
  alternatives_korean:
  - 여리고의 남자들은
  - 여리고의 사람들은
  - 여리고 사람들은
  lexicon: HALOT
  rationale: 히브리어의 ‘남자들’ 형태를 그대로 살리면서도 한국어에서는 성별을 과도하게 드러내지 않는 집합 표현이 자연스러워 ‘여리고 사람들은’으로 옮겼습니다.
- source_word: בָּנוּ / בָּנָה
  english_pob_choice: built
  chosen_korean: 건축하였고 / 건축하였습니다
  alternatives_korean:
  - 쌓았고 / 쌓았습니다
  - 지었고 / 지었습니다
  - 재건하였고 / 재건하였습니다
  lexicon: HALOT
  rationale: 동사 בנה는 기본적으로 ‘짓다/건축하다’이므로, 성벽 문맥의 함의를 유지하면서도 본문 자체의 어휘를 해치지 않는 ‘건축하다’를 택했습니다.
- source_word: זַכּוּר בֶן אִמְרִי
  english_pob_choice: Zaccur the son of Imri
  chosen_korean: 삭굴이 임리의 아들로서
  alternatives_korean:
  - 삭굴, 임리의 아들
  - 자쿠르, 임리의 아들
  - 삭구르, 임리의 아들
  lexicon: HALOT
  rationale: 고유명사는 한국어 성서 관용에 따라 음역했고, בן 구조는 관계를 분명히 하기 위해 ‘임리의 아들로서’로 풀어 읽을 수 있게 했습니다.
theological_decisions:
- issue: 연속되는 ‘곁에’ 표현의 지시 대상
  chosen_reading: 두 번째 ‘그들의 곁에’는 바로 앞의 ‘여리고 사람들’을 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - 모두 단순히 ‘그의 곁에’로 통일하기
  - 두 번째도 원문 형식을 따라 ‘그의 곁에’로 두기
  rationale: 히브리어는 두 번째 절에서도 단수 접미사를 쓰지만, 한국어에서는 바로 앞 집단을 가리키는 관계가 더 분명해지므로 POB의 영어 audit처럼 문맥상 지시를 명시했습니다.
  doctrine_reference: 본문의 계보나 교리 쟁점이 아니라 서술 지시의 명료화에 관한 문제입니다.
