base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
  footnotes:
  - marker: a
    text: Hebrew 'Will they restore it for themselves?' The underlying phrase is difficult; alternatives include 'Will they rebuild it by themselves?' or, more literally, 'Will they leave it to themselves?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 자기 형제들과 사마리아 군대 앞에서 이렇게 말했습니다. “이 힘없는 유다 사람들이 무엇을 하고 있습니까? 그들이 자기들을 위해 그것을 복구하겠습니까?[a] 제사를 드리겠습니까? 하루 만에 끝내겠습니까? 불탄 돌들을 먼지 더미에서 되살리겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 이 구절은 난해합니다. 문맥에 따라 ‘그들이 자기들을 위해 그것을 복구하겠습니까?’로 옮겼습니다. 다른 해석으로는 ‘그들이 그것을 자기들 힘으로 다시 세우겠습니까?’가 가능하며, 더 직역하면 ‘그들이 그것을 자기들에게 맡겨 두겠습니까?’가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  english_pob_choice: before his brothers
  chosen_korean: 자기 형제들과 … 앞에서
  alternatives_korean:
  - 형제들의 면전에서
  - 형제들 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘~앞에서/~면전에서’의 공개적 발화를 나타내므로 자연스러운 현대 한국어로 옮겼습니다. אֶחָיו는 직역하면 ‘그의 형제들’이어서 그 구성을 살렸습니다.
- source_word: וְחֵיל שֹׁמְרוֹן
  english_pob_choice: and the army of Samaria
  chosen_korean: 사마리아 군대
  alternatives_korean:
  - 사마리아의 군사력
  - 사마리아의 군대
  lexicon: HALOT
  rationale: חֵיל은 군대/병력을 뜻하므로, 공적인 조롱 장면에 맞는 ‘군대’로 옮겼습니다.
- source_word: הָאֲמֵלָלִים
  english_pob_choice: feeble
  chosen_korean: 이 약한 유다 사람들
  alternatives_korean:
  - 이 비참한 유다 사람들
  - 이 보잘것없는 유다 사람들
  lexicon: HALOT
  rationale: 원어는 조롱조의 형용사로 약함과 초라함을 드러내므로, 의미를 분명하게 하는 ‘약한’으로 옮겼습니다. 문맥상 대상이 유다 사람들임을 한국어에 드러냈습니다.
- source_word: הֲיַעַזְבוּ לָהֶם
  english_pob_choice: Will they restore it for themselves?
  chosen_korean: 그들이 스스로를 위해 그것을 복구하겠습니까?
  alternatives_korean:
  - 그들이 그것을 자기들 힘으로 다시 세우겠습니까?
  - 그들이 그것을 자기들에게 맡겨 두겠습니까?
  lexicon: HALOT
  rationale: עזב는 본래 ‘떠나다/버리다’이지만 이 구절은 난해하여 복구·재건의 뜻으로 이해됩니다. POB의 ‘restore’에 맞추되, 한국어에서는 ‘복구하겠습니까?’로 옮겨 모욕적 수사와 재건의 맥락을 살렸습니다.
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  english_pob_choice: Will they revive the stones
  chosen_korean: 불탄 돌들을 … 되살리겠습니까?
  alternatives_korean:
  - 돌들을 다시 살리겠습니까?
  - 돌들에 생명을 불어넣겠습니까?
  lexicon: HALOT
  rationale: חיה는 문자적으로 ‘살리다/되살리다’이므로, 돌을 의인화한 조롱을 살려 ‘되살리다’로 옮겼습니다.
theological_decisions:
- issue: 조롱문장의 반어적 수사 유지
  chosen_reading: 질문들을 직설적 수사 의문문으로 유지하여, 성벽 재건을 비웃는 적대자의 톤을 살렸습니다.
  alternative_readings:
  - 완화된 서술형으로 풀어 쓰기
  - 의미를 설명적으로 의역하기
  rationale: 본문은 일련의 연속 질문으로 조롱을 구성하므로, 한국어도 그 긴장과 경멸을 그대로 전달하는 편이 원문 충실도에 부합합니다.
  doctrine_reference: 문학적-수사학적 충실성
- issue: ‘불탄 돌들’의 물질적 이미지 유지
  chosen_reading: ‘불탄 돌들’과 ‘먼지 더미’의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘잔해’로 일반화하기
  - ‘부서진 돌무더기’로 완화하기
  rationale: 원문은 돌과 먼지 더미를 병치해 재건 불가능성을 조롱하므로, 이미지를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 본문 이미지 보존
