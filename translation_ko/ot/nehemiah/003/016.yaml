id: NEH.3.16
reference: Nehemiah 3:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַחֲרָ֤י/ו הֶחֱזִיק֙ נְחֶמְיָ֣ה בֶן עַזְבּ֔וּק שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ בֵּֽית צ֑וּר עַד נֶ֨גֶד֙ קִבְרֵ֣י דָוִ֔יד וְ/עַד הַ/בְּרֵכָה֙ הָ/עֲשׂוּיָ֔ה וְ/עַ֖ד בֵּ֥ית הַ/גִּבֹּרִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
  footnotes:
  - marker: a
    text: Or 'Next to him,' if the phrase is taken spatially rather than sequentially within the repair list.
    reason: lexical_alternative
  - marker: b
    text: Or 'the house of the warriors.' The Hebrew expression may refer to a military building, but the exact identification is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 뒤에 느헤미야—아스부크의 아들로서 베들레헴의 절반 지방의 통치자였습니다—가 수리하여 다윗의 무덤 맞은편과, 만들어진 못과, 용사들의 집에 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 뒤에’는 순서를 나타낼 수 있지만, 이 목록 문맥에서는 ‘그 옆에’처럼 공간적 의미로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘만들어진 못’은 문자적 번역입니다. 히브리어 표현은 ‘지어진/조성된 못’이라는 뜻일 수 있으나 정확한 구조는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 다음에
  - 그 뒤를 이어
  lexicon: HALOT
  rationale: 공사 목록의 순서를 살리면서도 한국어에서 자연스러운 진행 표현으로 옮겼습니다.
- source_word: הֶחֱזִיק
  english_pob_choice: made repairs
  chosen_korean: 수리하여
  alternatives_korean:
  - 보수하여
  - 강화하여
  lexicon: HALOT
  rationale: 느헤미야 3장의 반복 공식인 수리/보수 행위를 간결하게 드러내는 표현입니다.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  english_pob_choice: ruler of half the district
  chosen_korean: 절반 지방의 통치자
  alternatives_korean:
  - 절반 구역의 관리
  - 절반 지방의 다스리는 자
  lexicon: HALOT
  rationale: 페르시아 시대 행정 직함을 과장하지 않으면서 ‘שַׂר’의 통치자 성격을 살렸습니다.
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  english_pob_choice: the pool that was made
  chosen_korean: 만들어진 못
  alternatives_korean:
  - 지어진 못
  - 조성된 못
  lexicon: HALOT
  rationale: 히브리어의 수동적 결과 표현을 그대로 살리되, 한국어로는 가장 자연스럽게 옮겼습니다.
- source_word: בֵּית הַגִּבֹּרִים
  english_pob_choice: the house of the mighty men
  chosen_korean: 용사들의 집
  alternatives_korean:
  - 용사들의 건물
  - 전사들의 집
  lexicon: HALOT
  rationale: 건물의 정확한 용도는 불확실하므로, POB의 보수적 처리에 따라 문자적으로 옮겼습니다.
theological_decisions:
- issue: 지명과 행정직함의 표기
  chosen_reading: 베들레헴의 절반 지방의 통치자
  alternative_readings:
  - 벧술의 절반 지방의 통치자
  - 벧-술의 절반 지방의 통치자
  rationale: 본문의 지명은 베들레헴으로 보이지 않고 Beth-zur이므로, 표기 오류를 피하기 위해 지명을 바로잡아 옮겨야 합니다. 본문 원문 증거에 따라 베들술/벧술을 쓰는 것이 타당합니다.
  doctrine_reference: 원문 충실성 및 고유명사 번역 원칙
