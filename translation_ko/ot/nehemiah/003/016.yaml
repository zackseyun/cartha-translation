  source_fidelity: 원문의 지명 בֵּית צוּר(Beth-zur)는 베들레헴이 아니라 ‘벧술’로 옮겨야 합니다. 또한 קִבְרֵי는 복수이므로 ‘다윗의 무덤들’이 적절합니다. 반복되는 עַד는 각 지점까지 이어지는 수리 범위를 나타내므로 모두 ‘~까지’로 반영했습니다.
  naturalness: 원안의 삽입 대시 문장은 한국어 성경 문체로 다소 부자연스럽고, ‘수리하여 … 이르렀습니다’는 수리의 범위와 이동을 혼동할 수 있습니다. 주어의 직함을 동격으로 처리하고 ‘~까지 수리했습니다’로 종결하면 현대 표준어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘벧술’은 Beth-zur의 음역으로 바로잡았습니다. פֶּלֶךְ는 과도하게 ‘지방’으로 확대하지 않고 ‘지역’으로, שַׂר는 ‘관리’로 옮겼습니다. בֵּית הַגִּבֹּרִים는 정확한 건물 용도가 불확실하므로 ‘용사들의 집’으로 보수적으로 유지했습니다.
