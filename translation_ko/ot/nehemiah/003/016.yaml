revisions:
- from: 그 뒤에 느헤미야—아스부크의 아들로서 베들레헴의 절반 지방의 통치자였습니다—가 수리하여 다윗의 무덤 맞은편과, 만들어진 못과, 용사들의 집에 이르렀습니다.[a][b]
  to: 그 뒤에[a] 아스북의 아들이며 벧술 지역 절반의 관리인 느헤미야가 다윗의 무덤들 맞은편까지, 조성된 못까지, 또 용사들의 집까지[b] 수리했습니다.
  rationale: 지명 오역을 벧술로 바로잡고, 복수형 ‘무덤들’ 및 수리 범위를 명확히 반영했습니다. 또한 각주 b를 원문의 ‘용사들의 집’에 연결하여 감사 기록의 어휘상 불확실성을 올바르게 표시했습니다. ‘조성된 못’은 הָעֲשׂוּיָה의 만들어진/인공적이라는 결과 상태를 자연스럽게 보존합니다.
