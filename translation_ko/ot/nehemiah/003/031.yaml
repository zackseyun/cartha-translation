  source_fidelity: 히브리어는 말기야의 수리 구간을 ‘느디님과 상인들의 집까지, 감찰문 맞은편, 그리고 모퉁이의 윗방까지’로 제시합니다. 초안의 ‘감찰문 맞은편에서부터’는 원문에 없는 출발점을 만들며, ‘성전 종들의 집과 상인들의 집’은 단수 ‘집’이 두 별개의 집을 가리키는 듯하게 만듭니다.
  naturalness: ‘그 뒤를 이어’, ‘금세공인의 아들’, ‘…까지, 또 …까지 수리하였습니다’가 현대 표준어 합쇼체 문맥에서 자연스럽습니다.
  terminology: נְתִינִים은 성전 봉사와 관련된 특정 집단의 명칭이므로 음역 ‘느디님’을 유지하고 간략한 설명을 각주로 제시하는 편이 정확합니다. מִפְקָד는 ‘감찰문’으로 옮길 수 있습니다.
  issues:
  - severity: medium
    issue: ‘감찰문 맞은편에서부터’라는 출발점
    rationale: נֶגֶד(맞은편)는 ‘감찰문’의 위치 관계를 나타내며, מִן(부터)가 없습니다. 수리 구간의 시작점으로 번역하면 원문 이상의 정보를 넣게 됩니다.
  - severity: medium
    issue: ‘성전 종들의 집과 상인들의 집’
    rationale: בֵּית(집)는 단수이며, ‘느디님과 상인들의 집’으로 연결됩니다. 초안은 두 개의 독립된 집으로 읽힐 수 있습니다.
  - severity: low
    issue: ‘금세공의 아들’
    rationale: 직업 명사에는 ‘금세공인의 아들’이 더 자연스럽고 명확합니다.
  revised_text: 그 뒤를 이어 금세공인의 아들 말기야가 감찰문 맞은편에 있는 느디님 사람들과 상인들의 집까지, 또 모퉁이의 윗방까지 수리하였습니다.
  revised_footnotes:
  - marker: 느디님
    text: 성전 봉사를 위해 구별된 사람들을 가리키는 명칭입니다.
    reason: 히브리어 נְתִינִים은 일반 명사가 아니라 특정 집단의 명칭이므로, 음역을 유지하면서 의미를 밝혀 줍니다.
  revision_rationale: 원문의 위치 관계와 단수 ‘집’의 연결을 보존하도록 문장을 고쳤습니다. ‘느디님’은 정착된 기술 명칭으로 음역하고 각주에서만 최소한으로 설명했으며, ‘모퉁이의 윗방’은 해석을 과도하게 확정하지 않고 원문의 표현을 따랐습니다.
