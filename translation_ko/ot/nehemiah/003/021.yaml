  text: אַחֲרָ֣י/ו הֶחֱזִ֗יק מְרֵמ֧וֹת בֶּן אוּרִיָּ֛ה בֶּן הַקּ֖וֹץ מִדָּ֣ה שֵׁנִ֑ית מִ/פֶּ֨תַח֙ בֵּ֣ית אֶלְיָשִׁ֔יב וְ/עַד תַּכְלִ֖ית בֵּ֥ית אֶלְיָשִֽׁיב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
  footnotes:
  - marker: a
    text: Or 'a second section.' The Hebrew phrase can denote either an additional stretch assigned to Meremoth or, more formally, 'a second measure/length.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 다음에 므레못—우리야의 아들, 학고스의 손자—가 또 다른 구간을 수리했는데, 엘리아십의 집 입구에서 그 집 끝까지였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그의 다음에’로도, 더 형식적으로는 ‘두 번째 구간’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그의 다음에
  alternatives_korean:
  - 그 뒤에
  - 그 다음에
  lexicon: HALOT
  rationale: 건축 작업 명단의 순서를 나타내는 말이므로, 공간적 ‘옆에’보다 작업 순서를 드러내는 ‘그의 다음에’가 원문의 흐름을 더 잘 살립니다.
- source_word: הֶחֱזִיק
  english_pob_choice: repaired
  chosen_korean: 수리했습니다
  alternatives_korean:
  - 보수했습니다
  - 강화했습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘강하게 하다’와 관련되지만 느헤미야 3장 문맥에서는 성벽이나 관련 구조물을 고치는 일을 뜻하므로, 자연스러운 현대 한국어로 ‘수리했습니다’가 적절합니다.
- source_word: מִדָּה שֵׁנִית
  english_pob_choice: another section
  chosen_korean: 또 다른 구간
  alternatives_korean:
  - 두 번째 구간
  - 또 하나의 구간
  lexicon: HALOT
  rationale: 이 표현은 단순한 ‘둘째’의 수량보다 추가로 맡은 작업 구간을 가리킬 수 있으므로, 본문 흐름을 살려 ‘또 다른 구간’으로 옮겼습니다.
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב ... וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  english_pob_choice: from the entrance of the house of Eliashib ... to the end of the house of Eliashib
  chosen_korean: 엘리아십의 집 입구에서 그 집 끝까지
  alternatives_korean:
  - 엘리아십의 집 문에서 그 집 끝까지
  - 엘리아십의 집 출입구에서 그 집 끝까지
  lexicon: HALOT
  rationale: פֶּתַח과 תַּכְלִית는 각각 출입 가능한 시작점과 끝 지점을 가리키는 공간 표현이므로, ‘입구’와 ‘끝’으로 대응해 구조를 분명히 했습니다.
