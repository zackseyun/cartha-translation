  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
  footnotes:
  - marker: a
    text: Or 'they left Jerusalem as far as the Broad Wall.' The Hebrew verb usually means 'left,' but in this rebuilding context it is commonly understood as 'restored' or 'repaired.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 곁에서 금세공인들 가운데 한 사람인 하르하야의 아들 웃시엘이 보수하였고, 또 그 곁에서 향수 제조자들 가운데 한 사람인 하나냐가 보수하였습니다. 그들이 예루살렘을 넓은 성벽[a]까지 보수했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 예루살렘을 넓은 성벽까지 떠나 버려두었다.’ 히브리어 동사는 보통 ‘떠나다’ 또는 ‘버리다’를 뜻하지만, 이 재건 문맥에서는 일반적으로 ‘보수하다’ 또는 ‘복구하다’로 이해됩니다.
    reason: alternative_reading
