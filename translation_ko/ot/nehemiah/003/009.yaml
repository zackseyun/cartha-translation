  source_fidelity: 핵심 의미는 대체로 충실합니다. וְעַל־יָדָם을 인접한 작업자의 위치를 나타내는 ‘그들 곁에서’로, הֶחֱזִיק을 이 장의 성벽 보수 문맥에 맞는 ‘수리했습니다’로 옮긴 것은 적절합니다. 다만 שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם은 르바야가 ‘예루살렘 지역 절반을 다스리는 관리’라는 행정적 직위를 가리키므로, ‘예루살렘 반 구역의 관리’보다 관계를 더 분명히 표현하는 편이 좋습니다.
  naturalness: ‘반 구역’은 현대 한국어에서 행정 구획의 절반인지 별도의 명칭인지 다소 불분명하고 어색합니다. 또한 ‘관리로서 수리를 했습니다’보다 동격 구조를 사용하여 직위와 행위를 연결하면 현대의 격식 있는 문장으로 더 자연스럽습니다.
  terminology: 인명은 한국어 성경의 통용 표기인 ‘훌’과 ‘르바야’를 사용하는 것이 적절합니다. ‘관리’는 שַׂר의 행정적 지도자라는 의미를 과도한 군주적 함의 없이 전달합니다.
