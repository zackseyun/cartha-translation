base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/009.yaml
  text: Next to them[a], Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs.
  footnotes:
  - marker: a
    text: Or 'strengthened'; the Hebrew verb literally means 'made strong,' but in this chapter it is used idiomatically for repair work.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 곁에서 훌의 아들 르바야, 곧 예루살렘 지역 절반을 다스리는 관리가 수리했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강화했습니다’로 옮길 수 있습니다. 히브리어 동사는 문자적으로 ‘강하게 만들다’라는 뜻이지만, 이 장에서는 관용적으로 보수·수리 작업을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  english_pob_choice: Next to them
  chosen_korean: 그들 곁에서
  alternatives_korean:
  - 그들 옆에서
  - 그들 가까이에
  lexicon: HALOT
  rationale: 이 관용구는 느헤미야 3장에서 인접한 작업 구간을 표시하므로, 자연스럽고 연속적인 열거 문맥을 살리는 ‘그들 곁에서’로 옮겼습니다.
- source_word: הֶחֱזִיק
  english_pob_choice: made repairs
  chosen_korean: 수리를 했습니다
  alternatives_korean:
  - 보수했습니다
  - 강화했습니다
  lexicon: HALOT
  rationale: 동사는 문자적으로는 ‘강하게 하다/강화하다’이지만, 본 장에서는 성벽 공사 맥락의 관용적 표현이므로 결과 행위를 드러내는 ‘수리를 했습니다’가 가장 자연스럽습니다.
- source_word: שַׂר
  english_pob_choice: ruler
  chosen_korean: 관리로서
  alternatives_korean:
  - 지도자로서
  - 통치자로서
  lexicon: HALOT
  rationale: 여기서는 행정 구역과 결합해 직분을 나타내므로, 한국어에서 과도하게 왕권적 뉘앙스를 주는 ‘통치자’보다 행정적 의미가 드러나는 ‘관리로서’가 적절합니다.
- source_word: חֲצִי פֶּלֶךְ
  english_pob_choice: half the district
  chosen_korean: 반 구역
  alternatives_korean:
  - 반 지구
  - 반 행정구역
  lexicon: HALOT
  rationale: פֶּלֶךְ는 이 문맥에서 행정 구획을 가리키므로, ‘half the district’의 의미를 간결하게 반영하는 ‘반 구역’으로 옮겼습니다.
theological_decisions:
- issue: וְעַל יָדָם의 문맥상 기능
  chosen_reading: 단순한 공간적 인접 표현으로 처리했습니다.
  alternative_readings:
  - 그들의 도움으로
  - 그들 다음으로
  rationale: 느헤미야 3장의 목록은 성벽 구간의 순서를 기록하는 문맥이어서, 이 표현을 협력의 추상적 의미보다 ‘곁/옆’의 위치 표시로 읽는 것이 본문 흐름에 맞습니다.
  doctrine_reference: 본문 문맥 해석
