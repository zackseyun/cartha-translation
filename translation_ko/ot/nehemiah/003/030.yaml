id: NEH.3.30
reference: Nehemiah 3:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אחר/י הֶחֱזִ֜יק חֲנַנְיָ֣ה בֶן שֶׁלֶמְיָ֗ה וְ/חָנ֧וּן בֶּן צָלָ֛ף הַ/שִּׁשִּׁ֖י מִדָּ֣ה שֵׁנִ֑י אַחֲרָ֣י/ו הֶחֱזִ֗יק מְשֻׁלָּם֙ בֶּן בֶּ֣רֶכְיָ֔ה נֶ֖גֶד נִשְׁכָּתֽ/וֹ־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
  footnotes:
  - marker: a
    text: Hebrew literally has 'a second measure'; in Nehemiah 3 this idiom refers to an additional section assigned for repair.
    reason: lexical_alternative
  - marker: b
    text: The first phrase is traditionally understood in context as 'After him,' matching the repeated sequence formula in this chapter.
    reason: textual_variant
translation:
  language: ko
  text: 그의 뒤에 셀레미야의 아들 하나니야와 살랍의 여섯째 아들 하눈이 또 다른 구간을 수축하였습니다. 그의 뒤에 베레기야의 아들 므술람이 자기 방 맞은편을 수축하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  english_pob_choice: After him
  chosen_korean: 그의 뒤에
  alternatives_korean:
  - 그 뒤에
  - 그 다음에
  lexicon: HALOT
  rationale: 열왕기·느헤미야의 성벽 공사 목록에서 반복되는 순서 표지이므로, 문맥상 ‘after him’의 위치·순서를 자연스럽게 드러내는 ‘그의 뒤에’로 옮겼습니다.
- source_word: הֶחֱזִיק
  english_pob_choice: repaired
  chosen_korean: 수축하였습니다
  alternatives_korean:
  - 보수하였습니다
  - 수리하였습니다
  - 강화하였습니다
  lexicon: HALOT
  rationale: 이 동사는 본문에서 성벽이나 구조물을 실제로 손보는 일을 가리키므로, 한국어 성경 문맥에서 익숙하고 공사 행위를 분명히 나타내는 ‘수축하다’를 선택했습니다.
- source_word: מִדָּה שֵׁנִי
  english_pob_choice: another section
  chosen_korean: 또 다른 구간
  alternatives_korean:
  - 두 번째 구간
  - 한 구간 더
  lexicon: HALOT
  rationale: 직역하면 ‘둘째 척도/구간’에 가깝지만, 느헤미야 3장의 반복 표현은 추가로 맡은 성벽 구간을 뜻하므로 ‘또 다른 구간’이 원문의 관용적 의미를 더 정확히 전달합니다.
- source_word: נֶגֶד נִשְׁכָּתוֹ
  english_pob_choice: opposite his chamber
  chosen_korean: 자기 방 맞은편을
  alternatives_korean:
  - 자기 방 건너편을
  - 자기 방 앞을
  lexicon: HALOT
  rationale: נֶגֶד는 ‘맞은편/마주한 곳’을 뜻하고, נִשְׁכָּה는 공식적·거주적 ‘방/전실’의 뜻이 있어 ‘자기 방 맞은편’을 간결하게 살렸습니다.
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  english_pob_choice: Hananiah / Shelemiah / Hanun / Zalaph / Meshullam / Berechiah
  chosen_korean: 하나니야 / 셀레미야 / 하눈 / 살랍 / 므술람 / 베레기야
  alternatives_korean:
  - 한나니야 / 셀레미야 / 하눈 / 잘랍 / 메슐람 / 베레기야
  lexicon: 고유명사 음역
  rationale: 고유명사는 현대 한국어 외래어 표기 관행에 따라 음역했고, 한국 성경에서 널리 쓰이는 형태와 발음 가능성을 함께 고려했습니다.
