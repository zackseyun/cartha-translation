theological_decisions:
- issue: 형제에게 이자를 받는 행위의 윤리적 비판을 어떻게 드러낼지
  chosen_reading: ‘각각 자기 형제에게서 이자를 받고 있습니다’라고 직설적으로 옮겨, 동족 간 착취라는 비판을 흐리지 않았습니다.
  alternative_readings:
  - ‘형제에게서 돈을 빌려주고 있습니다’
  - ‘동족에게 이자를 매기고 있습니다’
  rationale: 히브리어의 친족 언어(אִישׁ בְּאָחִיו)를 보존해야 본문의 도덕적 긴장이 선명해집니다.
  doctrine_reference: 토라의 언약 공동체 윤리
- issue: קְהִלָּה גְדוֹלָה의 공적 성격
  chosen_reading: ‘큰 회중’으로 옮겨, 사적인 항의가 아니라 공개적·공동체적 대응임을 드러냈습니다.
  alternative_readings:
  - ‘큰 집회’
  - ‘큰 assembly’
  rationale: 한국어 교회적 상투어로 좁히기보다, 본문이 의도하는 공적 대항의 성격을 유지하는 것이 더 적절합니다.
  doctrine_reference: 공동체적 책망과 공적 정의
