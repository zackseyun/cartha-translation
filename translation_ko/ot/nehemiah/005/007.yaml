  text: וַ/יִּמָּלֵ֨ךְ לִבִּ֜/י עָלַ֗/י וָ/אָרִ֨יבָ/ה֙ אֶת הַ/חֹרִ֣ים וְ/אֶת הַ/סְּגָנִ֔ים וָ/אֹמְרָ֣/ה לָ/הֶ֔ם מַשָּׁ֥א אִישׁ בְּ/אָחִ֖י/ו אַתֶּ֣ם נשאים וָ/אֶתֵּ֥ן עֲלֵי/הֶ֖ם קְהִלָּ֥ה גְדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
  footnotes:
  - marker: a
    text: Or “I contended with the nobles and the officials.” The Hebrew verb can carry either a legal-accusatory nuance (“brought charges”) or a more general sense of contention.
    reason: lexical_alternative
  - marker: b
    text: Or “You are charging interest, each from his fellow.” Literally, “a man against his brother you are exacting [it],” preserving the kinship language of fellow Israelites.
    reason: lexical_alternative
  - marker: c
    text: Or “I called a great assembly against them.” The Hebrew literally says, “I set/gave against them a great assembly,” an idiom for convening public opposition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 내 마음이 내 안에서 숙고되었고[a], 내가 귀족들과 관리들을 상대로 책망하며 그들에게 말했습니다. “너희는 각각 자기 형제에게서 이자를 받고 있습니다[b].” 그리고 나는 그들에 맞서 큰 회중을 모았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 귀족들과 관리들과 다투었습니다.” 히브리어 동사는 내적 숙의와 법적·대립적 항의를 모두 아우를 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “너희는 각각 자기 동료에게 이자를 받고 있습니다.” 직역하면 “한 사람이 자기 형제에게서 [그것을] 받고 있습니다”로, 동족 관계를 보존합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 “그들에 맞서 큰 회중을 소집했습니다.” 히브리어는 문자적으로 “그들 위에/대하여 큰 회중을 두었습니다”라는 관용적 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  english_pob_choice: I took counsel with myself
  chosen_korean: 내 마음이 내 안에서 숙고되었고
  alternatives_korean:
  - 내가 나 자신과 상의했고
  - 내 마음이 나를 두고 숙고했고
  - 내가 내 안에서 결정을 내렸고
  lexicon: HALOT
  rationale: נמלך의 반사적·내적 숙의 의미를 살리되, 한국어에서 자연스럽고 문어적인 표현으로 옮겼습니다.
- source_word: וָאָרִיבָה
  english_pob_choice: I brought charges against
  chosen_korean: 책망하며
  alternatives_korean:
  - 상대하며
  - 고발하며
  - 논쟁하며
  lexicon: HALOT
  rationale: 문맥상 지도자들을 향한 공개적 책망과 준사법적 항의가 함께 있어, 단순한 ‘논쟁’보다 강하지만 법정어만으로 닫히지 않는 표현을 택했습니다.
- source_word: הַחֹרִים וְאֶת הַסְּגָנִים
  english_pob_choice: the nobles and the officials
  chosen_korean: 귀족들과 관리들
  alternatives_korean:
  - 유력자들과 관원들
  - 귀족들과 감독관들
  - 귀족들과 통치자들
  lexicon: HALOT
  rationale: 사회적 상층과 행정 책임자를 가리키는 기본 의미를 현대 한국어로 분명하게 전달했습니다.
- source_word: מַשָּׁא
  english_pob_choice: interest
  chosen_korean: 이자
  alternatives_korean:
  - 고리대
  - 이자 부담
  - 빌린 값
  lexicon: HALOT
  rationale: 경제 문맥에서의 대금 부담을 오늘날 이해하기 쉬운 ‘이자’로 옮기되, 지나치게 도덕화된 ‘고리대’는 피했습니다.
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  english_pob_choice: I assembled a great assembly against them
  chosen_korean: 그들에 맞서 큰 회중을 모았습니다
  alternatives_korean:
  - 그들에 맞서 큰 집회를 소집했습니다
  - 그들에 대항하여 큰 모임을 열었습니다
  - 그들 위에 큰 회중을 세웠습니다
  lexicon: HALOT
  rationale: נתן + עַל의 관용적 결합을 ‘모았습니다’로 자연스럽게 풀고, קְהִלָּה는 공식적인 공개 집합을 나타내므로 ‘회중’을 택했습니다.
theological_decisions:
- issue: 형제에게 이자를 받는 행위의 윤리적 비판을 어떻게 드러낼지
  chosen_reading: ‘각각 자기 형제에게서 이자를 받고 있습니다’라고 직설적으로 옮겨, 동족 간 착취라는 비판을 흐리지 않았습니다.
  alternative_readings:
  - ‘형제에게서 돈을 빌려주고 있습니다’
  - ‘동족에게 이자를 매기고 있습니다’
  rationale: 히브리어의 친족 언어(אִישׁ בְּאָחִיו)를 보존해야 본문의 도덕적 긴장이 선명해집니다.
  doctrine_reference: 토라의 언약 공동체 윤리
- issue: קְהִלָּה גְדוֹלָה의 공적 성격
  chosen_reading: ‘큰 회중’으로 옮겨, 사적인 항의가 아니라 공개적·공동체적 대응임을 드러냈습니다.
  alternative_readings:
  - ‘큰 집회’
  - ‘큰 assembly’
  rationale: 한국어 교회적 상투어로 좁히기보다, 본문이 의도하는 공적 대항의 성격을 유지하는 것이 더 적절합니다.
  doctrine_reference: 공동체적 책망과 공적 정의
