id: NEH.5.10
reference: Nehemiah 5:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם אֲנִי֙ אַחַ֣/י וּ/נְעָרַ֔/י נֹשִׁ֥ים בָּ/הֶ֖ם כֶּ֣סֶף וְ/דָגָ֑ן נַֽעַזְבָה נָּ֖א אֶת הַ/מַּשָּׁ֥א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
  footnotes:
  - marker: a
    text: Or 'my servants' / 'my attendants' for 'my young men.'
    reason: lexical_alternative
  - marker: b
    text: Or 'are exacting loans from them'; the Hebrew verb can carry the sense of acting as a creditor, not merely lending neutrally.
    reason: lexical_alternative
  - marker: c
    text: Or 'this exaction' or 'this debt'; the Hebrew literally means 'this burden.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저도 제 형제들과 제 청년들이 그들에게 돈과 곡식을 빌려주고 있습니다. 부디, 이 부담을 그만두게 합시다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 청년들’은 ‘제 종들’ 또는 ‘제 시종들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 단순한 ‘빌려주다’보다 ‘채권자로서 빌려주다/대부하다’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘이 짐’이지만, 여기서는 경제적 압박의 의미를 살려 ‘부담’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: And I also
  chosen_korean: 저도
  alternatives_korean:
  - 또 저도
  - 그리고 저도
  lexicon: HALOT
  rationale: 앞선 고발에 네헤미야 자신도 포함된다는 추가·강조를 한국어로 간결하게 드러냅니다.
- source_word: אַחַי
  english_pob_choice: my brothers
  chosen_korean: 제 형제들
  alternatives_korean:
  - 제 형제
  - 제 동족들
  - 제 친족들
  lexicon: HALOT
  rationale: 문자적 친족 표현을 살리되, 공동체적 연대감이 드러나는 자연스러운 한국어로 옮겼습니다.
- source_word: וּנְעָרַי
  english_pob_choice: my young men
  chosen_korean: 제 청년들
  alternatives_korean:
  - 제 종들
  - 제 시종들
  - 제 부하들
  lexicon: HALOT
  rationale: 문맥상 네헤미야의 수행원/가신들을 가리킬 수 있으나, 원문의 연령·신분의 폭을 보존하는 쪽으로 ‘청년들’을 택했습니다.
- source_word: נֹשִׁים בָּהֶם כֶּסֶף וְדָגָן
  english_pob_choice: are lending them money and grain
  chosen_korean: 그들에게 돈과 곡식을 빌려주고 있습니다
  alternatives_korean:
  - 그들에게 돈과 곡식을 빌려주고 있습니다만
  - 그들에게 돈과 곡식으로 대부하고 있습니다
  - 그들에게 돈과 곡식을 빌려주고 있는데
  lexicon: HALOT
  rationale: נֹשִׁים은 단순한 중립적 대여보다 채권자 역할을 포함할 수 있지만, 직역을 과도하게 경직시키지 않으면서 현재의 금융 행위를 드러내는 표현을 택했습니다.
- source_word: הַמַּשָּׁא הַזֶּה
  english_pob_choice: this burden
  chosen_korean: 이 부담
  alternatives_korean:
  - 이 짐
  - 이 채무
  - 이 압제
  lexicon: HALOT
  rationale: ‘부담’은 문자적 ‘짐’의 은유를 유지하면서도 빚과 착취가 낳는 사회경제적 압박을 한국어로 자연스럽게 전달합니다.
theological_decisions:
- issue: 권고문의 어조
  chosen_reading: 부드러운 청유로 옮기되, 공동체 전체가 함께 멈추자는 협력적 명령성을 살렸습니다.
  alternative_readings:
  - ‘그만두십시오’ 같은 직접 명령형
  - ‘이 짐을 내려놓읍시다’ 같은 완화된 표현
  rationale: נַעַזְבָה נָּא는 청유형 요청이므로, ‘부디, … 그만두게 합시다’가 요청성과 공동 결단을 함께 보여 줍니다.
  doctrine_reference: 본문의 수사적 청유 구조
