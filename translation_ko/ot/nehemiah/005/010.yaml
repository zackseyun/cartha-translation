theological_decisions:
- issue: 권고문의 어조
  chosen_reading: 부드러운 청유로 옮기되, 공동체 전체가 함께 멈추자는 협력적 명령성을 살렸습니다.
  alternative_readings:
  - ‘그만두십시오’ 같은 직접 명령형
  - ‘이 짐을 내려놓읍시다’ 같은 완화된 표현
  rationale: נַעַזְבָה נָּא는 청유형 요청이므로, ‘부디, … 그만두게 합시다’가 요청성과 공동 결단을 함께 보여 줍니다.
  doctrine_reference: 본문의 수사적 청유 구조
