  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: Now what was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
  footnotes:
  - marker: a
    text: Or 'the governor’s bread' or 'the governor’s provisions.' The Hebrew literally says 'the bread of the governor,' likely referring to the official food allotment or allowance attached to the office.
    reason: lexical_alternative
  - marker: b
    text: Or 'the labor was burdensome' or 'the work was severe.' The Hebrew phrase emphasizes the weight of the people's burden.
    reason: lexical_alternative
translation:
  language: ko
  text: 매일 마련된 것은 수소 한 마리와 잘 고른 양 여섯 마리였고, 또 저를 위해 새들도 마련되었으며, 열흘마다 온갖 포도주가 풍성히 마련되었습니다. 그런데도 저는 총독의 양식[a]을 요구하지 않았습니다. 이 백성에게 지워진 일이 무거웠기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘총독의 빵’이나 ‘총독의 배급품’일 수 있습니다. 히브리어는 문자적으로 ‘총독의 빵’이라고 하며, 직책에 딸린 공식 식량 할당을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노동이 부담스러웠기 때문입니다’ 또는 ‘일이 심했기 때문입니다.’ 히브리어는 백성 위에 놓인 짐이 무거웠음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה
  english_pob_choice: Now what was prepared
  chosen_korean: 매일 준비된 것은
  alternatives_korean:
  - 그리고 준비된 것은
  - 그날그날 마련된 것은
  lexicon: HALOT
  rationale: 식사와 보급 문맥에서 נַעֲשֶׂה는 ‘만들어지다’보다 ‘준비되다’가 자연스럽고, 반복적 공급을 간결하게 드러냅니다.
- source_word: שׁוֹר אֶחָד
  english_pob_choice: one ox
  chosen_korean: 수소 한 마리
  alternatives_korean:
  - 황소 한 마리
  - 소 한 마리
  lexicon: HALOT
  rationale: שׁוֹר는 가축 일반보다 식용·공급 맥락의 큰 소를 가리키므로, 한국어에서는 자연스럽게 ‘수소 한 마리’로 옮겼습니다.
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  english_pob_choice: six choice sheep
  chosen_korean: 좋은 양 여섯 마리
  alternatives_korean:
  - 선택된 양 여섯 마리
  - 잘 고른 양 여섯 마리
  lexicon: HALOT
  rationale: בְּרֻרוֹת의 ‘선별된/좋은’ 의미를 살리면서, 공급 품목 문맥에 맞게 간결한 ‘좋은 양’으로 옮겼습니다.
- source_word: לֶחֶם הַפֶּחָה
  english_pob_choice: the governor’s food allowance
  chosen_korean: 총독의 양식
  alternatives_korean:
  - 총독의 빵
  - 총독의 식량
  lexicon: HALOT
  rationale: 직역하면 ‘총독의 빵’이지만, 관직에 딸린 공식 배급을 가리키는 관용으로 이해되어 한국어에서는 ‘양식’이 가장 자연스럽습니다.
theological_decisions:
- issue: 총독의 공식 배급을 거절한 이유의 윤리적 강조
  chosen_reading: 느헤미야는 백성의 부담이 무거웠기 때문에 관직에 딸린 양식을 요구하지 않았습니다.
  alternative_readings:
  - 단순히 요청하지 않았습니다.
  - 법적으로 받을 수 있는 몫을 포기했습니다.
  rationale: 이 절은 교리 진술보다 지도자의 윤리적 태도를 보여 줍니다. ‘요구하지 않았습니다’와 ‘일이 무거웠기 때문입니다’는 백성의 짐을 고려한 자발적 절제를 보존합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
