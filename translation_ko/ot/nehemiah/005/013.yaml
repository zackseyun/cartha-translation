- from: 나도 내 옷자락을 털면서 말했습니다. “이 약속을 지키지 않는 모든 사람은 하나님께서 그의 집과 그의 수고에서 그렇게 털어 내시고, 그렇게 털려 비워지게 하실 것입니다.” 그러자 온 회중이 “아멘” 하고 야훼를 찬양했습니다. 그리고 백성은 이 약속대로 행했습니다.[a][b][c]
  to: 나도 내 옷의 품을 털어 내고 말했습니다.[a] “하나님께서 이 약속을 지키지 않는 모든 사람을 그의 집과 그의 수고에서[b] 이처럼 털어 내시고, 그가 이처럼 털려 빈손이 되게 하시기를 바랍니다.” 그러자 온 회중이 “아멘” 하고 야훼를 찬양했습니다. 그리고 백성은 이 약속대로 행했습니다.[c]
  rationale: 옷의 품을 터는 상징 행위, 하나님이 서약을 지키지 않는 자를 집과 수고에서 털어 내신다는 저주, 그리고 그가 비워진다는 결과를 문법적으로 분명히 연결했습니다. 수고가 노동인지 그 열매인지에 관한 원문의 범위는 각주로 보존했으며, 야훼와 합쇼체 서술은 유지했습니다.
