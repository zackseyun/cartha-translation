  text: גַּם חָצְנִ֣/י נָעַ֗רְתִּי וָֽ/אֹמְרָ֡/ה כָּ֣כָה יְנַעֵ֪ר הָֽ/אֱלֹהִ֟ים אֶת כָּל הָ/אִישׁ֩ אֲשֶׁ֨ר לֹֽא יָקִ֜ים אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה מִ/בֵּית/וֹ֙ וּ/מִ֣/יגִיע֔/וֹ וְ/כָ֛כָה יִהְיֶ֥ה נָע֖וּר וָ/רֵ֑ק וַ/יֹּאמְר֨וּ כָֽל הַ/קָּהָ֜ל אָמֵ֗ן וַֽ/יְהַלְלוּ֙ אֶת יְהוָ֔ה וַ/יַּ֥עַשׂ הָ/עָ֖ם כַּ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
  footnotes:
  - marker: a
    text: Or 'my lap' or 'the front fold of my garment.' The Hebrew refers to the fold of a robe used to hold items; Nehemiah's gesture symbolizes being shaken out and stripped of possessions.
    reason: lexical_alternative
  - marker: b
    text: Or 'carry out this matter' or 'perform this word.' The Hebrew expression means to establish or fulfill what has been pledged.
    reason: lexical_alternative
  - marker: c
    text: Or 'from his house and from the fruit of his labor.' The Hebrew may refer either to his labor itself or to what his labor has produced.
    reason: lexical_alternative
translation:
  language: ko
  text: 나도 내 옷자락을 털면서 말했습니다. “이 약속을 지키지 않는 모든 사람은 하나님께서 그의 집과 그의 수고에서 그렇게 털어 내시고, 그렇게 털려 비워지게 하실 것입니다.” 그러자 온 회중이 “아멘” 하고 야훼를 찬양했습니다. 그리고 백성은 이 약속대로 행했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옷자락’은 히브리어 חָצֶן이 가리키는 옷의 접힌 부분/품을 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지키다’는 여기서 קִים דָּבָר의 맹세 이행 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그의 집과 그의 수고/수고의 열매’로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם חָצְנִי נָעַרְתִּי
  english_pob_choice: I also shook out the fold of my garment
  chosen_korean: 나도 내 옷자락을 털면서
  alternatives_korean:
  - 나도 내 옷의 접힌 부분을 털면서
  - 나도 내 품을 털면서
  lexicon: HALOT
  rationale: חָצֶן은 옷의 접히거나 품에 해당하는 부분을 가리키므로, 행위의 상징성을 자연스럽게 살리면서도 한국어로는 ‘옷자락’이 가장 구체적이고 읽기 쉽습니다.
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  english_pob_choice: fulfill this promise
  chosen_korean: 이 약속을 지키지 않는
  alternatives_korean:
  - 이 말씀을 세우지 않는
  - 이 일을 실행하지 않는
  - 이 약속을 이행하지 않는
  lexicon: HALOT
  rationale: קִים דָּבָר는 맹세·언약 문맥에서 ‘세우다/이행하다/지키다’의 뜻이므로, 한국어에서는 앞뒤 문맥에 맞게 ‘약속을 지키다’가 가장 자연스럽고 의미를 분명히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명기 표기는 전통적 대체어보다 고유명사 음역을 따르는 것이 원문 추적성과 일치하므로, 프로젝트 기본어인 ‘야훼’를 사용했습니다.
- source_word: וַיַּעַשׂ הָעָם כַּדָּבָר הַזֶּה
  english_pob_choice: And the people did according to this promise
  chosen_korean: 그리고 백성은 이 약속대로 행했습니다
  alternatives_korean:
  - 그리고 백성은 이 일대로 행했습니다
  - 그리고 백성은 이 말씀대로 행했습니다
  lexicon: HALOT
  rationale: כַּדָּבָר הַזֶּה의 דָּבָר는 여기서 서약된 내용을 가리키므로, ‘이 약속대로’가 한국어에서 가장 명료하게 대응합니다.
theological_decisions:
- issue: 거룩한 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 여호와 호칭이 아니라 신명기 표기를 직접 사용하므로, 고유 이름을 보존하는 번역 원칙에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 맹세·저주의 수행적 발화의 어조
  chosen_reading: 직접 인용 안에서는 미래/기원 형태를 유지하고, 전체 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - 명령형으로 평평하게 옮김
  - 더 강한 저주 표현으로 확대
  rationale: 본문은 상징 행위 뒤에 저주적 선언과 회중의 응답이 이어지므로, 현대 한국어에서도 선언의 힘을 살리되 과도하게 과장하지 않도록 했습니다.
  doctrine_reference: Translation philosophy § tone and register
