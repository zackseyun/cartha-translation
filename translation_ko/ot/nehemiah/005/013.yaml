review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 저주 선언에서 ‘모든 사람’을 ‘그의 집과 그의 수고에서’ 털어 내는 목적어로 문법상 명확히 연결하지 못합니다. 또한 חָצֶן은 옷의 아래 ‘자락’이라기보다 물건을 담을 수 있는 옷의 품 또는 앞쪽 접힌 부분을 가리키므로 ‘옷자락’은 부정확합니다. 반복되는 נער의 상징 행위와 저주의 어휘를 ‘털어 내다/털리다’로 보존하고, יְגִיעוֹ의 ‘수고’와 ‘수고의 열매’ 사이의 범위는 각주로 유지했습니다.
  naturalness: ‘하나님께서 그의 집과 그의 수고에서 그렇게 털어 내시고’는 누가 무엇을 털어 내는지 불명확하고 한국어 어순도 부자연스럽습니다. ‘모든 사람을 그의 집과 그의 수고에서 이처럼 털어 내시고’로 목적어와 출처를 명료하게 했습니다. 기원적 저주 형식은 현대 격식체에서 자연스러운 ‘하시기를 바랍니다’로 옮겼습니다.
  terminology: 야훼는 יְהוָה의 프로젝트 표기와 일치합니다. ‘회중’, ‘아멘’, ‘약속을 지키다’도 문맥과 현대 표준어에 적절합니다. רֵק은 소유를 박탈당하는 상징에 맞게 ‘빈손이 되다’로 옮겼습니다.
  issues:
  - severity: medium
    issue: 저주 선언의 목적어와 수식 관계가 불명확함
    rationale: 초안의 ‘하나님께서 그의 집과 그의 수고에서 그렇게 털어 내시고’는 ‘모든 사람’이 털려 나가는 대상이라는 히브리어 구문을 자연스럽고 명확하게 드러내지 못합니다.
  - severity: medium
    issue: חָצֶן을 ‘옷자락’으로 번역함
    rationale: חָצֶן은 옷의 자락 끝보다는 물건을 담는 옷의 품 또는 앞쪽 접힌 부분입니다. ‘옷의 품’이 상징 행위의 구체성을 더 잘 보존합니다.
