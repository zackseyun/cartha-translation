language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים לָוִ֥ינוּ כֶ֖סֶף לְ/מִדַּ֣ת הַ/מֶּ֑לֶךְ שְׂדֹתֵ֖י/נוּ וּ/כְרָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/004.yaml
  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
  footnotes:
  - marker: a
    text: Or “for the king’s tribute.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “silver”; that is, money.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 어떤 사람들은 「우리는 왕의 세금 때문에 밭과 포도원에 대해 돈을 빌렸습니다」라고 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘은’입니다. 여기서는 돈의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 왕에게 부과되는 조세, 곧 세금의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  english_pob_choice: And there were those who said
  chosen_korean: 또 어떤 사람들은 …라고 말했습니다
  alternatives_korean:
  - 그리고 말하는 사람들이 있었습니다
  - 또 어떤 이들이 말했습니다
  lexicon: HALOT
  rationale: 새로운 불평 집단을 도입하는 서술이므로 존재구문과 보고체를 자연스럽게 살려 ‘또 어떤 사람들은 …라고 말했습니다’로 옮겼습니다.
- source_word: לָוִינוּ
  english_pob_choice: we have borrowed
  chosen_korean: 우리는 … 돈을 빌렸습니다
  alternatives_korean:
  - 우리는 …을 차용했습니다
  - 우리는 … 대출을 받았습니다
  lexicon: HALOT
  rationale: 히브리어 동사의 기본 의미를 따라 ‘돈을 빌리다’로 옮기되, 현재의 부담이 남아 있는 호소문맥을 반영해 완료형으로 처리했습니다.
- source_word: כֶסֶף
  english_pob_choice: money
  chosen_korean: 돈
  alternatives_korean:
  - 은
  - 은전
  lexicon: HALOT
  rationale: 문맥상 ‘은’보다 통화 개념이 분명하므로 현대 독자에게 직접적인 ‘돈’이 적절합니다.
- source_word: לְמִדַּת הַמֶּלֶךְ
  english_pob_choice: for the king’s tax
  chosen_korean: 왕의 세금 때문에
  alternatives_korean:
  - 왕의 조세 때문에
  - 왕의 공물 때문에
  lexicon: HALOT
  rationale: 문구는 왕에게 정해진 부담금을 가리키므로 현대어로는 ‘세금’이 가장 분명합니다. 영어 POB의 ‘tax’ 선택도 이를 뒷받침합니다.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  english_pob_choice: on our fields and our vineyards
  chosen_korean: 밭과 포도원에 대해
  alternatives_korean:
  - 우리 밭과 포도원에
  - 우리의 밭과 포도원 위에
  lexicon: HALOT
  rationale: 세금이 토지 소유를 근거로 부과된다는 뜻이므로, 한국어에서는 ‘~에 대해’로 원인·대상 관계를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 히브리어 כסף의 물질적 의미와 경제적 의미
  chosen_reading: ‘은’의 직역보다 문맥상 금전 의미를 드러내는 ‘돈’으로 옮겼습니다.
  alternative_readings:
  - ‘은’으로 직역
  - ‘은전’으로 구체화
  rationale: 이 절은 시장 가치의 금속 자체보다 대출된 자금과 세금 부담을 강조하므로, 독자에게 같은 충격을 주는 현대어가 필요합니다.
  doctrine_reference: 문맥우선 원칙
