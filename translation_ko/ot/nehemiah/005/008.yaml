base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
  footnotes:
  - marker: a
    text: Or “our fellow Jews.” The Hebrew says “our brothers, the Jews,” using a masculine kinship term for fellow members of the community.
    reason: lexical_alternative
  - marker: b
    text: 'Or “and should they be sold to us?” The Hebrew clause is terse and may be understood as a rhetorical consequence: their brothers end up being sold back to their own people.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 그들에게 말했습니다. 「우리는 할 수 있는 만큼 우리 유대인 형제들 — 곧 민족들에게 팔려 간 자들 — 을 되사 왔습니다. 그런데 이제 당신들까지도 자기 형제들을 팔고 있습니다. 그러니 그들이 우리에게 팔려 와야 한단 말입니까?」 그러자 그들은 잠잠해졌고, 아무 말도 찾지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리와 같은 유대인들.” 히브리어는 공동체의 남성 친족어를 써서 “우리 형제들, 곧 유대인들”이라는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들이 우리에게 팔려 와야 합니까?” 히브리어는 압축된 수사적 결과문으로, 그들이 자기 형제들을 다시 자기 백성에게 팔아넘기게 되는 모순을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  english_pob_choice: have bought back
  chosen_korean: 되사 왔습니다
  alternatives_korean:
  - 되찾았습니다
  - 구매했습니다
  - 구속했습니다
  lexicon: HALOT
  rationale: 이 문맥은 포로 상태에 있던 동족을 값 주고 다시 사 온 뜻이므로, 단순한 ‘샀다’보다 ‘되사 오다’가 구원/해방의 뉘앙스를 과도하게 신학화하지 않으면서도 자연스럽습니다.
- source_word: אַחֵינוּ הַיְּהוּדִים / אַחֵיכֶם
  english_pob_choice: our Jewish brothers / your brothers
  chosen_korean: 우리 유대인 형제들 / 자기 형제들
  alternatives_korean:
  - 우리 유대인 동족들
  - 우리 유대 형제들
  - 형제자매들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족어를 살려 ‘형제들’로 옮기고, הַיְּהוּדִים는 ‘유대인’으로 직접 반영했습니다. 공동체적 포괄성은 문맥상 유지되지만, 본문은 성별 중립화하지 않았습니다.
- source_word: וְנִמְכְּרוּ לָנוּ
  english_pob_choice: and they must be sold to us
  chosen_korean: 그러니 그들이 우리에게 팔려 와야 한단 말입니까
  alternatives_korean:
  - 그들이 우리에게 팔려야 합니까
  - 그리고 그들이 우리에게 팔려 와야 합니까
  - 그들이 우리에게 팔려 오게 될 것입니다
  lexicon: HALOT
  rationale: 히브리어는 압축된 수사적 결과문이라 직역하면 어색합니다. 반문 형태로 옮겨 네헤미야의 책망과 모순을 분명히 드러내되, 원문의 긴장감은 유지했습니다.
- source_word: וַיַּחֲרִישׁוּ וְלֹא מָצְאוּ דָּבָר
  english_pob_choice: Then they were silent and found nothing to say
  chosen_korean: 그러자 그들은 잠잠해졌고, 아무 말도 찾지 못했습니다
  alternatives_korean:
  - 그러자 그들은 침묵했고 대답하지 못했습니다
  - 그러자 그들은 말이 없었습니다
  - 그러자 그들은 조용해졌고 아무 대답도 못 했습니다
  lexicon: HALOT
  rationale: ‘잠잠해지다’는 פעל의 정적 반응을 자연스럽게 살리고, ‘아무 말도 찾지 못했습니다’는 ‘말’을 찾지 못했다는 히브리식 관용을 비교적 밀착해 옮깁니다.
theological_decisions:
- issue: וְגַם אַתֶּם의 강조와 책망의 수사
  chosen_reading: ‘그런데 이제 당신들까지도’로 옮겨, 이미 동족을 되사 온 자들이 오히려 형제들을 파는 역설을 강조했습니다.
  alternative_readings:
  - 그리고 당신들도
  - 하지만 당신들은
  - 당신들 역시
  rationale: וְגַם은 단순 접속이 아니라 책망의 강화입니다. ‘그런데 이제’와 ‘까지도’를 써서 대조와 책망의 힘을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 유대인 형제들에 대한 공동체 호칭
  chosen_reading: 남성 친족어 ‘형제들’을 본문에 유지하되, 필요 없는 확장은 하지 않았습니다.
  alternative_readings:
  - 형제자매들
  - 동족들
  - 공동체 구성원들
  rationale: 히브리어 본문은 남성 복수 친족어를 사용합니다. 본문은 원문의 형식을 유지하고, 공동체 전체를 가리키는 의미는 문맥으로 전달되게 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
