  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/פַּחוֹת֩ הָ/רִאשֹׁנִ֨ים אֲשֶׁר לְ/פָנַ֜/י הִכְבִּ֣ידוּ עַל הָ/עָ֗ם וַ/יִּקְח֨וּ מֵ/הֶ֜ם בְּ/לֶ֤חֶם וָ/יַ֨יִן֙ אַחַר֙ כֶּֽסֶף שְׁקָלִ֣ים אַרְבָּעִ֔ים גַּ֥ם נַעֲרֵי/הֶ֖ם שָׁלְט֣וּ עַל הָ/עָ֑ם וַ/אֲנִי֙ לֹא עָשִׂ֣יתִי כֵ֔ן מִ/פְּנֵ֖י יִרְאַ֥ת אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
  footnotes:
  - marker: a
    text: Or 'in addition to forty shekels of silver.' The Hebrew phrase may indicate an added monetary levy on top of the bread and wine.
    reason: lexical_alternative
  - marker: b
    text: Or 'attendants' or 'young men' for 'servants.' The Hebrew can refer to subordinate officials in service to the governors.
    reason: lexical_alternative
  - marker: c
    text: Or 'out of reverence for God.' The Hebrew idiom is literally 'because of the fear of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이전의 총독들은 내 앞에 있던 자들로서 백성에게 무거운 짐을 지웠고, 빵과 포도주와 더불어 은 사십 세겔을 그들에게서 거두어 갔습니다. 심지어 그들의 종들까지 백성을 지배했습니다. 그러나 나는 하나님을 두려워하였기 때문에 그렇게 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 앞에 있던 자들’은 직역적으로는 ‘나보다 앞선 자들’이라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: הַפַּחוֹת הָרִאשֹׁנִים
  english_pob_choice: the former governors
  chosen_korean: 이전의 총독들
  alternatives_korean:
  - 옛 총독들
  - 선임 총독들
  - 이전의 관원들
  lexicon: HALOT
  rationale: פֶּחָה는 페르시아 시대의 총독/지방 행정관을 가리키므로 ‘총독들’이 가장 자연스럽고, הָרִאשֹׁנִים은 단순한 과거가 아니라 ‘이전의’ 사람들을 가리켜 ‘이전의 총독들’로 옮겼습니다.
- source_word: הִכְבִּידוּ עַל הָעָם
  english_pob_choice: laid heavy burdens on the people
  chosen_korean: 백성에게 무거운 짐을 지웠고
  alternatives_korean:
  - 백성을 압제했고
  - 백성에게 부담을 안겼고
  - 백성을 무겁게 했고
  lexicon: HALOT
  rationale: ‘무겁게 하다’라는 히필의 이미지를 살리기 위해 해석을 과도하게 좁히지 않고 ‘무거운 짐을 지우다’로 옮겼습니다.
- source_word: בְּלֶחֶם וָיַיִן אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  english_pob_choice: bread and wine, besides forty shekels of silver
  chosen_korean: 빵과 포도주와 더불어 은 사십 세겔
  alternatives_korean:
  - 빵과 포도주 외에 은 사십 세겔
  - 빵과 포도주에 더하여 은 사십 세겔
  - 빵과 포도주 말고도 은 사십 세겔
  lexicon: HALOT
  rationale: אַחַר는 여기서 시간적 ‘뒤에’가 아니라 부가를 나타내므로 ‘더불어/외에’의 의미로 처리했고, POB의 해석에 맞춰 현금 부과가 음식 공물에 더해졌다는 점을 드러냈습니다.
- source_word: נַעֲרֵיהֶם שָׁלְטוּ עַל הָעָם
  english_pob_choice: Even their servants ruled over the people
  chosen_korean: 심지어 그들의 종들까지 백성을 지배했습니다
  alternatives_korean:
  - 심지어 그들의 종들까지 백성을 다스렸습니다
  - 그들의 종들조차 백성 위에 군림했습니다
  - 그들의 시종들까지 백성을 지배했습니다
  lexicon: HALOT
  rationale: נַעַר는 문맥상 행정 보조자나 부하를 가리킬 수 있지만, POB가 드러내려는 종속성을 살리기 위해 ‘종들’로 옮기되, שָׁלַט의 권위 행사를 ‘지배하다’로 옮겨 압박감을 유지했습니다.
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  english_pob_choice: because of the fear of God
  chosen_korean: 하나님을 두려워하였기 때문에
  alternatives_korean:
  - 하나님을 경외하였기 때문에
  - 하나님께 대한 두려움 때문에
  - 하나님을 두려워하는 마음에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 직역인 ‘하나님을 두려워하다’는 성경적 긴장감을 보존하며, 단순한 예의 바름으로 약화시키지 않도록 했습니다.
theological_decisions:
- issue: יִרְאַת אֱלֹהִים의 신학적 뉘앙스
  chosen_reading: ‘하나님을 두려워하였기 때문에’로 유지하여 경외와 책임 앞의 두려움을 함께 드러냅니다.
  alternative_readings:
  - ‘하나님을 경외하였기 때문에’
  - ‘하나님에 대한 경건한 존중 때문에’
  rationale: 이 표현은 단순한 감정이 아니라 하나님 앞에서의 언약적 책임을 뜻하므로, ‘경외’로 완화하기보다 ‘두려워하다’의 성경적 관용을 살렸습니다.
  doctrine_reference: Translation philosophy §3, §6
