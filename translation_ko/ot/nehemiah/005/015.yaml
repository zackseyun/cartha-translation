revisions:
- from: 이전의 총독들은 내 앞에 있던 자들로서 백성에게 무거운 짐을 지웠고, 빵과 포도주와 더불어 은 사십 세겔을 그들에게서 거두어 갔습니다. 심지어 그들의 종들까지 백성을 지배했습니다. 그러나 나는 하나님을 두려워하였기 때문에 그렇게 하지 않았습니다.[a]
  to: 나보다 앞선 총독들은 백성에게 무거운 짐을 지우고, 그들에게서 빵과 포도주 외에 은 사십 세겔도 거두어 갔습니다.[a] 심지어 그들의 부하들까지 백성을 지배했습니다.[b] 그러나 나는 하나님을 두려워하였기 때문에 그렇게 하지 않았습니다.
  rationale: 원문의 행정·재정 문맥을 반영하여, 은 사십 세겔이 빵과 포도주에 추가된 징수였음을 명확히 했습니다. 또한 נַעֲרֵיהֶם의 의미를 ‘부하들’로 옮기고 각주에서 가능한 의미 범위를 보존했습니다. 하나님의 ‘두려움’이라는 핵심 표현은 유지했습니다.
