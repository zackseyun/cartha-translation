    rationale: 원문은 ‘돈과 곡식과 새 포도주와 기름의 백분의 일’로 이해하는 것이 문법과 문맥에 가장 잘 맞습니다. 초안의 어순은 곡식·새 포도주·기름 전체를 돌려주라는 의미로 오독될 수 있습니다.
