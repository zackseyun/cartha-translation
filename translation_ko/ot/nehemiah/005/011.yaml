  source_fidelity: 수정이 필요합니다. 히브리어 וּמְאַת는 뒤따르는 ‘돈, 곡식, 새 포도주, 기름’의 목록 전체와 연결되는 것이 자연스럽습니다. 초안의 ‘돈의 백분의 일과 곡식과…’은 백분의 일이 돈에만 걸리고 곡식 등은 전부 반환한다는 뜻으로 읽힐 수 있습니다.
  naturalness: ‘오늘 바로’와 ‘부디’는 자연스럽고 합쇼체에도 적절합니다. 다만 재산 목록과 백분의 일의 범위를 문장 구조로 분명히 하는 편이 더 명료하고 자연스럽습니다.
  terminology: ‘올리브 과수원’, ‘새 포도주’, ‘기름’, ‘돌려주십시오’는 적절합니다. נֹשִׁים는 문맥상 채권자로서 거두거나 요구하는 행위를 가리키므로 ‘거두고 있는’은 가능한 넓은 번역입니다. 각주에서 ‘빌려주고 있는’을 단독 대안으로 제시하는 것은 원문의 채권·요구의 의미를 약화하므로 고쳐야 합니다.
