base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
  footnotes:
  - marker: a
    text: Or 'the hundredth' / 'one percent' of the money, grain, new wine, and oil; the Hebrew likely refers to the portion being exacted from them.
    reason: lexical_alternative
  - marker: b
    text: Or 'that you are charging them' or 'that you are lending to them at interest.'
    reason: alternative_reading
translation:
  language: ko
  text: 부디 그들에게 오늘 바로 그들의 밭과 포도원과 올리브 과수원과 집들을, 그리고 그들에게서 거두고 있는 돈의 백분의 일과 곡식과 새 포도주와 기름을 돌려주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘백분의 일’ 또는 ‘돈의 백분의 일’일 수 있으며, 원문은 그들에게서 거두어 가는 몫을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 이자를 받고 있는’ 혹은 ‘그들에게 빌려주고 있는’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָשִׁיבוּ נָא
  english_pob_choice: Please restore
  chosen_korean: 부디 … 돌려주십시오
  alternatives_korean:
  - 돌려주십시오
  - 회복해 주십시오
  - 되돌려 주십시오
  lexicon: HALOT
  rationale: שׁוּב의 사역형 명령을 한국어에서는 소유와 금전적 반환 모두를 아우를 수 있는 공손한 명령형 ‘돌려주십시오’로 자연스럽게 옮겼고, נָא는 ‘부디’로 긴급한 청유를 살렸습니다.
- source_word: כְּהַיּוֹם
  english_pob_choice: this very day
  chosen_korean: 오늘 바로
  alternatives_korean:
  - 오늘
  - 바로 오늘
  - 오늘 당장
  lexicon: HALOT
  rationale: 즉시성을 강조하는 관용구이므로, 시간 부사 ‘오늘’에 강조 부사 ‘바로’를 붙여 원문의 긴급함을 살렸습니다.
- source_word: שְׂדֹתֵיהֶם כַּרְמֵיהֶם זֵיתֵיהֶם וּבָתֵּיהֶם
  english_pob_choice: their fields, their vineyards, their olive orchards, and their houses
  chosen_korean: 그들의 밭과 포도원과 올리브 과수원과 집들
  alternatives_korean:
  - 그들의 밭과 포도원과 올리브 동산과 집들
  - 그들의 밭과 포도원과 올리브 나무밭과 집들
  lexicon: HALOT
  rationale: 열거된 토지·재산 항목을 한국어에서도 병렬로 유지했습니다. זֵיתִים 계열은 개별 나무보다 경작지/소유지를 가리키는 흐름이므로 ‘올리브 과수원’으로 옮겼습니다.
- source_word: וּמְאַת הַכֶּסֶף
  english_pob_choice: the hundredth part of the money
  chosen_korean: 돈의 백분의 일
  alternatives_korean:
  - 백분의 일
  - 백분의 일을 뜻하는 돈
  - 돈의 백분의 일부분
  lexicon: HALOT
  rationale: מְאַת은 문자적으로 ‘백분의 일’이므로 수학적 표현을 그대로 살렸고, כסף는 이 문맥에서 ‘돈’이 자연스럽습니다. 본문이 말하는 착취의 비율을 분명히 하되, 기술적 금융용어로만 좁히지 않았습니다.
- source_word: אֲשֶׁר אַתֶּם נֹשִׁים בָּהֶם
  english_pob_choice: that you have been exacting from them
  chosen_korean: 그들에게서 거두고 있는
  alternatives_korean:
  - 그들에게서 이자를 받고 있는
  - 그들에게 빌려주고 있는
  - 그들에게서 받아내고 있는
  lexicon: HALOT
  rationale: נֹשִׁים는 단순 대출보다 빚·이자·압박을 동반한 행위를 가리킬 수 있으므로, 도덕적 강압성을 살리는 ‘거두고 있는’으로 넓게 옮겼습니다.
theological_decisions:
- issue: 뉴앙스가 있는 채무·착취 표현의 범위
  chosen_reading: ‘거두고 있는’으로 옮겨, 이자만이 아니라 본문이 고발하는 압제적 채무 관행 전체를 드러냈습니다.
  alternative_readings:
  - ‘이자를 받고 있는’
  - ‘빌려주고 있는’
  rationale: 본문의 핵심은 기술적 금융행위의 정의보다 가난한 형제들로부터 부당하게 취한 것을 즉시 반환하라는 사회윤리적 책망입니다. 따라서 의미 범위를 과도하게 좁히지 않는 번역이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
