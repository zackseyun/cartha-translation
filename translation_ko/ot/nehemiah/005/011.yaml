  lexicon: HALOT
  rationale: נֹשִׁים는 단순 대출보다 빚·이자·압박을 동반한 행위를 가리킬 수 있으므로, 도덕적 강압성을 살리는 ‘거두고 있는’으로 넓게 옮겼습니다.
theological_decisions:
- issue: 뉴앙스가 있는 채무·착취 표현의 범위
  chosen_reading: ‘거두고 있는’으로 옮겨, 이자만이 아니라 본문이 고발하는 압제적 채무 관행 전체를 드러냈습니다.
  alternative_readings:
  - ‘이자를 받고 있는’
  - ‘빌려주고 있는’
  rationale: 본문의 핵심은 기술적 금융행위의 정의보다 가난한 형제들로부터 부당하게 취한 것을 즉시 반환하라는 사회윤리적 책망입니다. 따라서 의미 범위를 과도하게 좁히지 않는 번역이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
