id: NEH.5.12
reference: Nehemiah 5:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ נָשִׁ֗יב וּ/מֵ/הֶם֙ לֹ֣א נְבַקֵּ֔שׁ כֵּ֣ן נַעֲשֶׂ֔ה כַּ/אֲשֶׁ֖ר אַתָּ֣ה אוֹמֵ֑ר וָ/אֶקְרָא֙ אֶת הַ/כֹּ֣הֲנִ֔ים וָֽ/אַשְׁבִּיעֵ֔/ם לַ/עֲשׂ֖וֹת כַּ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
  footnotes:
  - marker: a
    text: Or “to do according to this word/matter.” The Hebrew דָּבָר can mean “word,” “matter,” or, in context, a pledged commitment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. “우리는 그것을 돌려주고, 그들에게서 아무것도 요구하지 않겠습니다. 말씀하신 대로 하겠습니다.” 그러자 나는 제사장들을 불러, 그 지도자들에게 이 말[a]대로 하겠다고 맹세하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 말’은 히브리어 דָּבָר의 번역입니다. 이 말은 문맥에 따라 ‘말’, ‘일’, 또는 ‘약속’을 뜻할 수 있습니다.
    reason: דָּבָר의 의미 범위를 보존하며, 각주를 해당 표현에 직접 연결합니다.
lexical_decisions:
- source_word: נָשִׁיב
  english_pob_choice: we will restore it
  chosen_korean: 그것을 되돌려주고
  alternatives_korean:
  - 그것을 돌려주고
  - 그것을 회복하고
  lexicon: HALOT
  rationale: 히필 שוב의 의미를 채무·부당취득의 반환으로 보고, 문맥상 이미 언급된 대상이 생략되어 있으므로 한국어에서는 ‘그것을’로 보완했습니다.
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  english_pob_choice: from them we will require nothing
  chosen_korean: 그들에게서 아무것도 요구하지 않겠습니다
  alternatives_korean:
  - 그들에게서 아무것도 청구하지 않겠습니다
  - 그들에게서 아무것도 찾지 않겠습니다
  lexicon: HALOT
  rationale: בקש의 ‘요구하다/청구하다’ 의미를 살려 경제적·법적 압박을 철회한다는 뜻을 자연스럽게 옮겼습니다.
- source_word: כַּאֲשֶׁר אַתָּה אוֹמֵר
  english_pob_choice: as you say
  chosen_korean: 당신이 말한 대로
  alternatives_korean:
  - 당신이 말씀하신 대로
  - 말씀하신 그대로
  lexicon: HALOT
  rationale: 직접 화자의 약속에 대한 동의이므로, 정중하지만 구어적인 합쇼체로 ‘말한 대로’를 택해 순응의 뉘앙스를 유지했습니다.
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  english_pob_choice: to do according to this word
  chosen_korean: 이 말대로 하겠다고
  alternatives_korean:
  - 이 말씀대로 하겠다고
  - 이 약속대로 하겠다고
  - 이 일대로 하겠다고
  lexicon: HALOT
  rationale: דָּבָר를 영어 POB처럼 ‘word’에 가깝게 보되, 한국어에서는 ‘말’이 가장 직접적이어서 ‘이 말대로’로 옮겼습니다. 여기서 ‘약속’은 해석을 조금 더 강하게 넣는 대안입니다.
theological_decisions:
- issue: 서약의 행위와 제사장들의 역할
  chosen_reading: 내가 제사장들을 불러 이 말대로 하겠다고 그들에게 맹세하게 했습니다.
  alternative_readings:
  - 내가 제사장들을 불러 그들에게 이 일대로 하겠다고 맹세시키고
  - 내가 제사장들을 불러 그들로 하여금 이 말대로 하겠다고 맹세하게 했습니다
  rationale: 히브리어 עשה + שבע의 결합은 단순한 말이 아니라 공적 서약을 성립시키는 행위이므로, ‘맹세하게 했습니다’로 서약의 구속력을 드러냈습니다.
  doctrine_reference: Nehemiah 5:12의 공적 서약 서술
