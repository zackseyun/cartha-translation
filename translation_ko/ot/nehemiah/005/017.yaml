source:
  edition: WLC
  text: וְ/הַ/יְּהוּדִ֨ים וְ/הַ/סְּגָנִ֜ים מֵאָ֧ה וַ/חֲמִשִּׁ֣ים אִ֗ישׁ וְ/הַ/בָּאִ֥ים אֵלֵ֛י/נוּ מִן הַ/גּוֹיִ֥ם אֲשֶׁר סְבִיבֹתֵ֖י/נוּ עַל שֻׁלְחָנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: Now the Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
  footnotes:
  - marker: a
    text: Or 'the Judeans' for 'the Jews.'
    reason: lexical_alternative
  - marker: b
    text: '''At my table'' implies that Nehemiah provided food for them as part of his hospitality and administration.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 유다 사람들과 관리들, 곧 백오십 명과 우리 주변의 여러 민족에서 우리에게 온 사람들도 내 상에 함께 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다 사람들’은 여기서 민족적·지역적 정체성을 함께 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘내 상에 함께 있었습니다’는 단순한 위치가 아니라, 네헤미야의 환대와 식사 제공을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  english_pob_choice: the Jews
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유대 사람들
  lexicon: HALOT
  rationale: 여기서는 민족적·지역적 집단을 가리키므로, 전통 교회어인 ‘유대인들’보다 문맥상 더 직접적인 ‘유다 사람들’이 원문과 가깝습니다.
- source_word: וְהַסְּגָנִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 관원들
  - 지도자들
  - 총독들
  lexicon: HALOT
  rationale: 페르시아 행정 체계의 하위 관리들을 가리키므로, 지나치게 직함을 특정하지 않는 현대 한국어 ‘관리들’이 가장 자연스럽습니다.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  english_pob_choice: from the nations that were around us
  chosen_korean: 우리 주변의 여러 민족에서
  alternatives_korean:
  - 우리 주변의 여러 나라들에서
  - 우리 둘레의 민족들 가운데서
  lexicon: HALOT
  rationale: ‘민족들’은 גּוֹיִם의 넓은 범주를 살리며, ‘우리 주변의’는 지리적 둘러쌈을 간결하게 드러냅니다.
- source_word: עַל שֻׁלְחָנִי
  english_pob_choice: were at my table
  chosen_korean: 내 상에 함께 있었습니다
  alternatives_korean:
  - 내 식탁에 있었습니다
  - 내 상에서 대접을 받았습니다
  lexicon: HALOT
  rationale: ‘상’은 원문의 식사 자리 이미지를 살리고, ‘함께 있었습니다’는 단순한 위치가 아니라 네헤미야의 환대 아래 식사에 참여한 상황을 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘the Jews’의 번역 범위
  chosen_reading: ‘유다 사람들’로 옮겨, 민족명과 지역 정체성을 함께 드러냈습니다.
  alternative_readings:
  - ‘유대인들’
  - ‘유다인들’
  rationale: 느헤미야 문맥에서는 종교 집단명보다 귀환 공동체의 민족·지역적 정체성이 두드러지므로, 오해를 줄이는 쪽을 택했습니다.
  doctrine_reference: 구약 역사서의 공동체 정체성 표현
