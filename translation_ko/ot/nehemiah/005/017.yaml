base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: Now the Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
  footnotes:
  - marker: a
    text: Or 'the Judeans' for 'the Jews.'
    reason: lexical_alternative
  - marker: b
    text: '''At my table'' implies that Nehemiah provided food for them as part of his hospitality and administration.'
    reason: cultural_note
translation:
  language: ko
  text: 유다 사람들[a]과 관리들, 곧 백오십 명, 그리고 우리 주변의 여러 민족에서 우리에게 온 사람들도 내 상[b]에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다 사람들’은 ‘유대인들’로도 옮길 수 있으며, 여기서는 민족적·지역적 정체성을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 상에 있었습니다’는 단순한 위치만이 아니라 네헤미야가 그들에게 식사를 제공하고 대접했음을 뜻하는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  english_pob_choice: the Jews
  chosen_korean: 유다 사람들
  alternatives_korean:
