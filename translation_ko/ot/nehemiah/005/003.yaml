  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים שְׂדֹתֵ֛י/נוּ וּ/כְרָמֵ֥י/נוּ וּ/בָתֵּ֖י/נוּ אֲנַ֣חְנוּ עֹרְבִ֑ים וְ/נִקְחָ֥ה דָגָ֖ן בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/003.yaml
  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
  footnotes:
  - marker: a
    text: Or, “We are pledging our fields, our vineyards, and our houses.” The Hebrew verb refers to giving property as security for debt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 또 어떤 이들은 말했습니다. “우리는 흉년 동안 곡식을 마련하려고 우리 밭과 포도원과 집을 담보로 잡히고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘담보로 잡히고 있습니다’는 원문의 재산을 빚의 담보로 내놓는 뜻을 드러낸 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  english_pob_choice: And there were others who said
  chosen_korean: 그리고 또 어떤 이들은 말했습니다
  alternatives_korean:
  - 그리고 어떤 사람들은 말했습니다
  - 또 다른 이들은 말했습니다
  lexicon: HALOT
  rationale: 새로운 항의 집단을 이어 주는 담화 기능을 살리면서, 현대 한국어에서 자연스럽게 들리는 집단 소개로 옮겼습니다.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  english_pob_choice: our fields, our vineyards, and our houses
  chosen_korean: 우리 밭과 포도원과 집
  alternatives_korean:
  - 우리 들과 포도원과 집
  - 우리 토지와 포도원과 집
  lexicon: HALOT
  rationale: שָׂדוֹת은 넓은 ‘땅’보다 구체적인 ‘밭’이 더 직접적이고, בָּתִּים은 여기서 재산 항목으로 나열되므로 ‘집’이 ‘가정’보다 원문에 가깝습니다.
- source_word: אֲנַחְנוּ עֹרְבִים
  english_pob_choice: We are mortgaging
  chosen_korean: 담보로 잡히고 있습니다
  alternatives_korean:
  - 저당잡히고 있습니다
  - 담보로 넘기고 있습니다
  - 저당을 잡히고 있습니다
  lexicon: HALOT
  rationale: עֹרְבִים은 빚을 위해 재산을 담보로 제공하는 뜻이므로, 현대적 경제 문맥을 살리면서도 ‘담보’로 보증의 성격을 드러냈습니다.
- source_word: וְנִקְחָה דָגָן
  english_pob_choice: to get grain
  chosen_korean: 곡식을 마련하려고
  alternatives_korean:
  - 곡식을 얻으려고
  - 곡식을 사려고
  - 곡식을 구하려고
  lexicon: HALOT
  rationale: נִקְחָה는 단순한 ‘사다’보다 목적 달성의 뉘앙스가 있어, 흉년 속에서 생존을 위해 곡식을 ‘마련하다’로 옮겼습니다.
- source_word: בָּרָעָב
  english_pob_choice: during the famine
  chosen_korean: 흉년 동안
  alternatives_korean:
  - 기근 동안
  - 흉년 때
  lexicon: HALOT
  rationale: רָעָב은 단순한 식량 부족이 아니라 공동체 전체의 심각한 기근을 가리키므로, 한국어 성경 문맥에서 익숙하면서도 의미가 분명한 ‘흉년’으로 옮겼습니다.
