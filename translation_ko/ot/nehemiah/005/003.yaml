  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
  footnotes:
  - marker: a
    text: Or, “We are pledging our fields, our vineyards, and our houses.” The Hebrew verb refers to giving property as security for debt.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 어떤 이들은 이렇게 말했습니다. “우리는 기근 중에 곡식을 얻으려고 우리 밭과 포도원과 집을 담보로 내놓고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘담보로 내놓고 있습니다’는 빚을 위해 재산을 담보로 제공한다는 뜻입니다. ‘저당잡히고 있습니다’ 또는 ‘담보로 맡기고 있습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
