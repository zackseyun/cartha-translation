  rationale: שָׂדוֹת은 넓은 ‘땅’보다 구체적인 ‘밭’이 더 직접적이고, בָּתִּים은 여기서 재산 항목으로 나열되므로 ‘집’이 ‘가정’보다 원문에 가깝습니다.
- source_word: אֲנַחְנוּ עֹרְבִים
  english_pob_choice: We are mortgaging
  chosen_korean: 담보로 잡히고 있습니다
  alternatives_korean:
  - 저당잡히고 있습니다
