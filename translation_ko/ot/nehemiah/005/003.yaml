  - 곡식을 구하려고
  lexicon: HALOT
  rationale: נִקְחָה는 단순한 ‘사다’보다 목적 달성의 뉘앙스가 있어, 흉년 속에서 생존을 위해 곡식을 ‘마련하다’로 옮겼습니다.
- source_word: בָּרָעָב
  english_pob_choice: during the famine
  chosen_korean: 흉년 동안
  alternatives_korean:
  - 기근 동안
  - 흉년 때
  lexicon: HALOT
  rationale: רָעָב은 단순한 식량 부족이 아니라 공동체 전체의 심각한 기근을 가리키므로, 한국어 성경 문맥에서 익숙하면서도 의미가 분명한 ‘흉년’으로 옮겼습니다.
