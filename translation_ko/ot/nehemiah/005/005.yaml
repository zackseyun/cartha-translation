  revised_text: 이제[a] 우리 살이 우리 형제들의 살과 같고, 우리 자녀들이 그들의 자녀들과 같으나, 보십시오, 우리는 우리 아들들과 딸들을 노예로 내주고 있으며, 우리 딸들 중에는 노예가 된 이들도 있습니다. 그러나 우리에게는 힘이 없으며, 우리 밭과 포도원은 다른 사람들의 것입니다.
