  source_fidelity: 초안은 친족·공동체의 동등성을 나타내는 '살'의 비유와 밭·포도원이 타인의 소유라는 결말을 대체로 충실히 반영합니다. 그러나 '우리를 도울 힘'은 히브리어 관용구가 말하는 화자들의 무력함을 '우리를 도와줄 힘'으로 바꾸므로 수정이 필요합니다. 또한 כבשׁ와 לַעֲבָדִים의 결합은 자녀를 노예 상태로 내모는 강제성을 나타내므로 '종으로 삼다/종으로 잡히다'보다 '노예로 내주다/노예가 되다'가 더 정확합니다.
  naturalness: 합쇼체 문장으로 전반적으로 자연스럽지만, '종으로 잡혀 있습니다'는 현대 표준어에서 다소 부자연스럽고 무엇에 붙잡혔는지가 불명확합니다. '노예가 된 이들도 있습니다'가 자연스럽고 수동적 결과 상태를 잘 전달합니다. '우리에게는 힘이 없으며'는 원문의 무력함을 간결하게 표현합니다.
  terminology: בשר의 구체적 표현인 '살', אַחֵינוּ의 '형제들', 그리고 후반의 '아들들과 딸들'은 유지합니다. עֲבָדִים은 이 문맥에서 완화하지 않고 '노예'로 옮깁니다. אֵל은 신명칭이 아니라 '힘/능력'이므로 '우리에게는 힘이 없다'로 번역합니다.
