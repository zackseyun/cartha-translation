base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
  footnotes:
  - marker: a
    text: Or, 'we are of the same flesh as our brothers.' The Hebrew keeps the concrete image of shared flesh to stress common humanity and kinship.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'there is not to our hand power.' The clause expresses that they have no means or power, especially since their fields and vineyards are in the possession of others.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제[a] 우리 살이 우리 형제들의 살과 같고, 우리 자녀들이 그들의 자녀들과 같으나, 우리는 우리 아들들과 딸들을 종으로 삼고 있으며, 우리 딸들 중 일부는 이미 종으로 잡혀 있습니다. 그러나 우리를 도울 힘이[b] 없으며, 우리 밭과 포도원은 남의 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '우리는 우리 형제들과 같은 살을 가진 자들이다.' 히브리어는 공통된 인간성과 친족 관계를 강조하기 위해 살을 공유한다는 구체적인 이미지를 유지합니다.
    reason: alternative_reading
  - marker: b
    text: 문자적으로 '우리 손에 힘이 없음'입니다. 이 절은 그들이 다른 사람의 소유가 된 밭과 포도원 때문에 특히 수단이나 힘이 없음을 표현합니다.
    reason: alternative_reading
