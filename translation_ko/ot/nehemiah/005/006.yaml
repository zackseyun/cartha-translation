translation:
  language: ko
  text: 내가 그들의 부르짖음과 이 말들을 들었을 때 매우 분노했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דְּבָרִים는 여기서 ‘말들’ 또는 ‘사안들’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי
  english_pob_choice: I became angry
  chosen_korean: 매우 분노했습니다
  alternatives_korean:
  - 분노가 치밀었습니다
  - 화를 냈습니다
  - 몹시 노했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 חרה + ל의 감정 발화를 자연스럽게 살리되, 현대 한국어에서 강한 반응을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: מְאֹד
  english_pob_choice: very
  chosen_korean: 매우
  alternatives_korean:
  - 몹시
  - 크게
  - 지극히
  lexicon: HALOT
  rationale: 분노의 강도를 나타내는 부사로 직접 대응시키되, 문체상 가장 무난한 현대어를 택했습니다.
- source_word: זַעֲקָתָם
  english_pob_choice: their outcry
  chosen_korean: 그들의 부르짖음
  alternatives_korean:
  - 그들의 외침
  - 그들의 호소
  - 그들의 울부짖음
  lexicon: HALOT
  rationale: זעקה는 단순한 불평보다 절박한 소리의 뉘앙스가 강하므로, '부르짖음'이 긴박함과 호소성을 함께 살립니다.
- source_word: הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이런 말들
  alternatives_korean:
  - 이런 일들
  - 이런 사정들
  - 이런 사안들
  lexicon: HALOT
  rationale: דברים가 여기서는 실제로 들은 발언을 가리키므로 '말들'이 기본 뜻에 가장 가깝습니다. '이런'은 문맥상 앞선 호소 내용을 받아 자연스럽게 연결합니다.
theological_decisions:
- issue: 분노의 표현 수위
  chosen_reading: '''매우 분노했습니다''로 네헤미야의 강한 도덕적 반응을 그대로 드러냈습니다.'
  alternative_readings:
  - '''크게 노했습니다'''
  - '''몹시 화가 났습니다'''
  rationale: 본문은 단순한 서운함이 아니라 압제와 불의를 들은 즉각적이고 강한 분노를 말하므로, 완화하지 않고 드러내는 것이 문맥에 더 충실합니다.
  doctrine_reference: 성경 내 의인(義人)의 분노와 불의에 대한 반응
