  text: And there were those who said[a], “We have many sons and daughters. Let us get grain, so that we may eat and live.”
  footnotes:
  - marker: a
    text: Or, more smoothly, 'We have many sons and daughters.' The Hebrew more literally stacks the family members with 'we' and 'are many.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이런 말을 하는 사람들이 있었습니다. 「우리에게는 아들과 딸이 많습니다. 곡식을 구해 먹고 살아갑시다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘우리, 우리의 아들과 우리의 딸, 우리는 많다’라는 식으로 더 압축적으로 배열되어 있습니다.
    reason: lexical_alternative
