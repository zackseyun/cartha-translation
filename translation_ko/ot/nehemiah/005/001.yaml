translation:
  language: ko
  text: 백성과 그들의 아내들이 그들의 형제인 유다 사람들을 향하여 크게 부르짖었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 유대인 형제들.” 히브리어 용어는 민족적 정체성을 강조할 때는 “유대인”으로, 지역적 정체성을 강조할 때는 “유다 사람”으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  english_pob_choice: Now there arose
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 있었습니다
  - 생겼습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 살려, 단순 존재 진술보다 새로운 상황의 발생을 드러내는 동사를 택했습니다.
- source_word: צַעֲקַת
  english_pob_choice: outcry
  chosen_korean: 부르짖음
  alternatives_korean:
  - 외침
  - 호소
  lexicon: HALOT
  rationale: 억울함과 절박함이 섞인 공개적 외침이라는 뉘앙스를 살리기 위해, 평평한 '외침'보다 '부르짖음'이 더 적절합니다.
- source_word: הַיְּהוּדִים
  english_pob_choice: Jewish
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유다인들
  lexicon: HALOT
  rationale: 이 문맥에서는 민족·지역적 소속이 함께 작동하므로, 현대 한국어에서 가장 자연스럽고 역사적 배경도 보존하는 '유다 사람들'로 옮겼습니다.
theological_decisions:
- issue: אֶל의 대립적 방향성
  chosen_reading: 그들의 형제들인 유다 사람들 against로
  alternative_readings:
  - 그들의 형제들인 유다 사람들에게
  - 그들의 형제들인 유다 사람들에 대하여
  rationale: 히브리어 אֶל은 문자적으로는 '…에게/를 향하여'이지만, 여기서는 항의의 표적을 가리키므로 대립 관계를 드러내야 합니다. 다만 한국어 본문은 문장 자연성을 위해 'against'를 남기는 대신, 의미상 '반대하여'의 힘을 보존하려는 의도를 반영했습니다.
  doctrine_reference: Translation philosophy §5 (source-directed lexical force)
