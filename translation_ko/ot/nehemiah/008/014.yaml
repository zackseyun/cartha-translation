base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
  footnotes:
  - marker: a
    text: Or 'the Israelites' or 'the children of Israel'; Hebrew 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 율법에서, 야훼께서 모세를 통해 명하신 대로 이스라엘 자손이 절기 동안 일곱째 달에 초막에 거주해야 한다는 기록을 발견했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어 직역입니다. 영어 POB의 각주처럼 ‘이스라엘 사람들’ 또는 ‘이스라엘의 자녀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  english_pob_choice: they found it written
  chosen_korean: 기록을 발견했습니다
  alternatives_korean:
  - 기록된 것을 발견했습니다
  - 기록이 있음을 발견했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘찾아내다/발견하다’와 ‘기록되다’의 결합을 자연스러운 한국어로 옮기되, 단순히 ‘알게 되었습니다’처럼 약화시키지 않았습니다.
- source_word: בַּתּוֹרָה
  english_pob_choice: in the Law
  chosen_korean: 율법에서
  alternatives_korean:
  - 토라에서
  - 율법책에서
  lexicon: HALOT
  rationale: 여기서 תּוֹרָה는 모세 율법의 문자 기록을 가리키므로, 한국어 성경의 표준적이고 문맥에 맞는 ‘율법’을 사용했습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: through Moses
  chosen_korean: 모세를 통해
  alternatives_korean:
  - 모세의 손으로
  - 모세를 통하여
  lexicon: HALOT
  rationale: ‘손을 통해’라는 히브리어 관용구를 현대 한국어의 매개 수단 표현으로 옮겨, 모세의 중개적 역할을 분명히 했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 자손들
  lexicon: HALOT
  rationale: 히브리어 직역을 유지해 본문이 말하는 집단명을 그대로 드러냈고, 남성형 복수 표현을 무리 없이 한국어 관용구로 살렸습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 있는 신명 사두문자 יהוה를 한국어 본문에서 학술적 음역인 ‘야훼’로 옮겨, 본문이 가진 언약 სახელ칭을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 절기와 초막절의 관계
  chosen_reading: 절기 동안 ... 초막에 거주해야 한다
  alternative_readings:
  - 초막절 동안 ... 초막에 거주해야 한다
  - 그 절기 동안 ... 초막에 살도록 하신다
  rationale: 본문은 특정 절기(חָג)와 그 안의 거처 명령을 함께 진술하므로, 절기 일반과 초막절의 문맥적 연관을 드러내되 본문에 없는 명칭을 과도하게 덧붙이지 않았습니다.
  doctrine_reference: 문맥상 레위기 23장과 느헤미야 8장의 절기 준수 언급
