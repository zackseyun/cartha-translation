id: NEH.8.6
reference: Nehemiah 8:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
  footnotes:
  - marker: a
    text: 'Hebrew: “Amen, Amen,” a repeated liturgical response of assent.'
    reason: cultural_note
translation:
  language: ko
  text: 에스라는 야훼, 곧 위대하신 하나님을 찬송했고, 온 백성은 손을 들면서 “아멘, 아멘”[a] 하고 응답했습니다. 그러고 나서 그들은 몸을 굽혀 얼굴을 땅에 대고 야훼께 경배했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아멘, 아멘’은 예배에서 동의를 나타내는 반복 응답입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  english_pob_choice: blessed
  chosen_korean: 찬송했고
  alternatives_korean:
  - 축복했고
  - 복을 빌었고
  lexicon: HALOT
  rationale: 하나님을 대상으로 한 ברך의 예배적 용법은 단순한 ‘축복’보다 하나님께 드리는 찬양·송축의 성격이 분명하므로, 자연스러운 합쇼체 문맥에서는 ‘찬송하다’가 의미를 가장 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사본의 여호와 계명명인 יְהוָה를 한국어 표준 음역인 ‘야훼’로 옮겨 고유한 신명성을 보존했습니다.
- source_word: הָאֱלֹהִים הַגָּדוֹל
  english_pob_choice: the great God
  chosen_korean: 위대하신 하나님
  alternatives_korean:
  - 큰 하나님
  - 크신 하나님
  lexicon: HALOT
  rationale: ‘큰’보다 인격적 존칭이 살아 있는 ‘위대하신’이 문맥의 예배적 선포를 더 잘 살리며, 하나님은 프로젝트 기본 용례에 따라 ‘하나님’으로 옮겼습니다.
- source_word: וַיַּעֲנוּ
  english_pob_choice: answered
  chosen_korean: 응답했습니다
  alternatives_korean:
  - 대답했습니다
  - 화답했습니다
  lexicon: HALOT
  rationale: 백성의 집단적 구두 반응이므로 ‘응답하다’가 예배적·문맥적 기능을 가장 자연스럽게 전달합니다.
- source_word: בְּמֹעַל יְדֵיהֶם
  english_pob_choice: while lifting up their hands
  chosen_korean: 손을 들면서
  alternatives_korean:
  - 손을 들어 올리면서
  - 손을 높이 들면서
  lexicon: HALOT
  rationale: 동반 행위를 나타내는 구문이므로 한국어에서는 간결한 ‘손을 들면서’가 몸짓을 분명히 보여 줍니다.
- source_word: וַיִּשְׁתַּחֲווּ
  english_pob_choice: worshiped
  chosen_korean: 경배했습니다
  alternatives_korean:
  - 예배했습니다
  - 절했습니다
  lexicon: HALOT
  rationale: 이미 ‘몸을 굽혀’가 신체 동작을 나타내므로, 뒤의 동사는 예배 행위의 의미를 살려 ‘경배하다’로 옮겨 중복 없이 두 동작을 구분했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 본문에 직접 신명이 나오므로, 제목적 대체어보다 고유 이름을 유지하는 것이 원문과 POB의 명명 원칙을 더 충실히 반영합니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
