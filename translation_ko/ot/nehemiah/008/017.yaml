    text: 예수아는 눈의 아들 여호수아를 가리킵니다.
    reason: alternative_reading
  revision_rationale: The revision corrects the personal names, moves the footnote anchor to the name it explains, and uses modern formal-polite Korean. It retains '초막' for סֻכּוֹת, '온 회중' for the gathered community, and '이처럼' for the contextual force of כֵּן, without making the verse claim that the festival had never at all been observed since Joshua's time.
