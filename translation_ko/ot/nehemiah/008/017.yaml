- from: 포로에서 돌아온 모든 회중이 쉿코트를 짓고 쉿코트에서 살았으니, 이는 요수아 아들 누나의 날부터 그 날까지 이스라엘 자손이 그렇게 행한 일이 없었기 때문이라. 기쁨이 심히 크더라.[a]
