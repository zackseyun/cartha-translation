translation:
  language: ko
  text: 그들은 하나님의 율법책을 분명하게[a] 읽고, 뜻을 풀이하여, 낭독된 말씀을 이해하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘또렷하게’. 이 히브리어는 또렷하게 읽는 것, 설명을 통해 본문을 분명하게 하는 것, 또는 청중을 위해 번역하는 것을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  english_pob_choice: They read
  chosen_korean: 읽고
  alternatives_korean:
  - 낭독하고
  - 선포하고
  lexicon: HALOT
  rationale: קרא는 본문을 대상으로 할 때 ‘읽다’의 뜻이 가장 자연스럽고, 여기서는 공적 낭독 장면이므로 ‘읽고’로 옮겼습니다.
- source_word: בַּסֵּפֶר
  english_pob_choice: from the book
  chosen_korean: 율법책에서
  alternatives_korean:
  - 책에서
  - 책으로부터
  lexicon: HALOT
  rationale: 문맥상 단순한 책이 아니라 공적으로 읽히는 성문 본문을 가리키므로, 한국어에서는 ‘율법책’으로 구체화해 의미를 살렸습니다.
- source_word: מְפֹרָשׁ
  english_pob_choice: clearly
  chosen_korean: 뜻을 밝혀 주어
  alternatives_korean:
  - 분명히
  - 명확하게
  - 구별되게
  lexicon: HALOT
  rationale: 이 형용사는 단순한 발음의 명료함뿐 아니라 설명으로 본문을 분명하게 만드는 뜻까지 포함할 수 있으므로, 결과절의 설명 기능을 드러내는 표현을 택했습니다.
- source_word: וְשׂוֹם שֶׂכֶל
  english_pob_choice: and they gave the sense
  chosen_korean: 뜻을 밝혀 주어
  alternatives_korean:
  - 뜻을 풀이하여
  - 이해를 주어
  - 의미를 설명하여
  lexicon: HALOT
  rationale: 직역하면 ‘이해를 두다’에 가까운 관용구이므로, 한국어에서는 앞 구와 연결해 해설 행위를 자연스럽게 나타내는 표현으로 옮겼습니다.
- source_word: בַּמִּקְרָא
  english_pob_choice: the reading
  chosen_korean: 읽는 것을
  alternatives_korean:
  - 낭독을
  - 봉독한 내용을
  lexicon: HALOT
  rationale: מִקְרָא는 읽어 낸 행위와 그 낭독된 본문을 가리킬 수 있어, 여기서는 앞의 설명으로 인해 사람들이 이해하게 된 대상인 ‘읽는 것’을 살렸습니다.
theological_decisions:
- issue: 본문의 이해 방식
  chosen_reading: 읽기와 해설이 함께 이루어져 공동체가 성문의 뜻을 실제로 이해하도록 했다는 점을 분명히 드러냈습니다.
  alternative_readings:
  - 단순 낭독 중심으로만 읽는 해석
  - 번역 행위만 강조하는 해석
  rationale: 히브리어는 낭독, 설명, 이해의 결과를 연속적으로 제시하므로, 한국어도 이 흐름을 살려 가르침의 실제 기능을 보여 주는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 느헤미야 8장 문맥의 성경 공적 낭독과 해설
- issue: ‘율법’의 범위
  chosen_reading: תּוֹרָה를 전통적 교회어인 ‘율법’으로 유지하되, 문맥상 하나님의 언약적 가르침이라는 점을 반영했습니다.
  alternative_readings:
  - ‘교훈’
  - ‘가르침’
  rationale: 에스라-느헤미야 문맥에서는 מדובר하는 본문이 모세 율법의 공적 낭독이므로, ‘율법’이 가장 직접적이고 본문-기반적인 표현입니다.
  doctrine_reference: 토라/율법의 공적 낭독
- issue: 설명의 결과
  chosen_reading: 마지막 절은 단순 정보 전달이 아니라 공동체적 이해의 성취를 말하므로, 결과를 보여 주는 구조로 옮겼습니다.
  alternative_readings:
  - 직역형으로 ‘그리고 그들은 읽는 것을 이해했습니다’
  - 원인-결과를 약화한 평행 구조
  rationale: 히브리어 동사 배열은 설명을 통해 이해에 이르는 결과를 강조하므로, 한국어도 결과성을 살려야 본문의 힘이 유지됩니다.
  doctrine_reference: 성경 해석과 공동체 이해
