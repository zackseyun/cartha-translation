id: NEH.8.18
reference: Nehemiah 8:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יִּקְרָא בְּ/סֵ֨פֶר תּוֹרַ֤ת הָ/אֱלֹהִים֙ י֣וֹם בְּ/י֔וֹם מִן הַ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן עַ֖ד הַ/יּ֣וֹם הָ/אַחֲר֑וֹן וַ/יַּֽעֲשׂוּ חָג֙ שִׁבְעַ֣ת יָמִ֔ים וּ/בַ/יּ֧וֹם הַ/שְּׁמִינִ֛י עֲצֶ֖רֶת כַּ/מִּשְׁפָּֽט׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
  footnotes:
  - marker: a
    text: Or 'from the scroll of the law of God.' The Hebrew word can refer to a written document generally, including a scroll.
    reason: lexical_alternative
  - marker: b
    text: Or 'they celebrated the feast seven days.'
    reason: lexical_alternative
  - marker: c
    text: Or 'as prescribed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 하루하루 하나님의 율법책에서 읽었습니다[a]. 첫날부터 마지막 날까지 그렇게 했습니다. 그들은 이레 동안 절기를 지켰고, 여덟째 날에는 규례에 따른 엄숙한 모임이 있었습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 율법 두루마리에서.’ 히브리어는 일반적으로 기록된 문서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들은 절기를 지켰습니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘규례대로.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: he read
  chosen_korean: 읽었습니다
  alternatives_korean:
  - 낭독했습니다
  - 선포했습니다
  lexicon: HALOT
  rationale: 이 문맥에서 קרא는 책에서 소리 내어 읽는 뜻이므로 ‘읽었습니다’가 가장 직접적이며, 본문의 읽기 행위를 살립니다.
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  english_pob_choice: from the Book of the Law of God
  chosen_korean: 하나님의 율법책
  alternatives_korean:
  - 하나님의 율법의 책
  - 하나님의 율법 두루마리
  lexicon: HALOT
  rationale: סֵפֶר의 기본값인 ‘책’을 살리되, 읽기 행위와의 결합을 자연스럽게 한국어로 옮겨 ‘하나님의 율법책’으로 간명하게 표현했습니다.
- source_word: יֹום בְּיֹום
  english_pob_choice: day by day
  chosen_korean: 하루하루
  alternatives_korean:
  - 날마다
  - 매일
  lexicon: HALOT
  rationale: 반복성과 점층성을 함께 드러내는 관용구이므로, 리듬을 살리는 ‘하루하루’가 가장 근접합니다.
- source_word: עֲצֶרֶת
  english_pob_choice: a solemn assembly
  chosen_korean: 엄숙한 모임
  alternatives_korean:
  - 성회
  - 집회
  lexicon: HALOT
  rationale: 절기 শেষ날의 규정된 거룩한 모임이라는 뉘앙스를 살리되, 한국어에서 과도하게 교회식으로 굳지 않도록 ‘엄숙한 모임’으로 옮겼습니다.
- source_word: כַּמִּשְׁפָּט
  english_pob_choice: according to the ordinance
  chosen_korean: 규례에 따른
  alternatives_korean:
  - 율례대로
  - 규정에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 절기 준수의 규범적 기준을 가리키므로, 법적·규범적 뉘앙스를 유지하는 ‘규례’로 번역했습니다.
theological_decisions:
- issue: 독자의 시각에서 본 ‘읽음’과 공동체의 ‘지킴’의 구분
  chosen_reading: ‘그는 읽었습니다’와 ‘그들은 지켰습니다’를 구분해 원문의 역할 차이를 보존했습니다.
  alternative_readings:
  - 주어를 통합해 ‘그들이 읽고 지켰습니다’로 매끄럽게 처리
  rationale: 히브리어는 단수 독서 행위와 복수 절기 준수를 의도적으로 구분하므로, 이를 평탄화하지 않고 유지하는 것이 본문의 구조를 더 정확히 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: עֲצֶרֶת의 종교적 무게
  chosen_reading: ‘엄숙한 모임’으로 옮겨 절기의 종결에 이루어지는 규정된 거룩한 집회의 성격을 드러냈습니다.
  alternative_readings:
  - ‘모임’
  - ‘마지막 집회’
  rationale: 본문의 의례적·규범적 성격을 유지하면서도, 후대 교회 용어를 과도하게 끌어오지 않는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
