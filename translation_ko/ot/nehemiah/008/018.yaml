  source_fidelity: 원문의 단수 주어(‘그는 읽었습니다’)와 복수 주어(‘그들은 절기를 지켰습니다’)의 구별은 유지되어야 합니다. ‘첫날부터 마지막 날까지’는 ‘날마다’와 직접 연결하는 편이 히브리어의 시간 표현을 더 충실히 반영합니다. עֲצֶרֶת는 ‘엄숙한 모임’으로, כַּמִּשְׁפָּט은 ‘규례대로’로 옮기는 것이 적절합니다.
  naturalness: 합쇼체 문체는 자연스럽습니다. 다만 현행 문장은 ‘규례에 따른 엄숙한 모임’에 각주 c가 붙어 있으나 c의 내용은 ‘규례대로’에 해당하고, 각주 b도 절기 준수 구절에 붙어야 하므로 각주 위치를 바로잡는 것이 필요합니다.
  terminology: ‘하나님의 율법책’, ‘절기’, ‘엄숙한 모임’, ‘규례대로’는 현대 표준 한국어의 격식 있는 성경 번역 문체에서 자연스럽고 원문의 법적·의례적 의미를 보존합니다. ‘율법 두루마리’는 본문이 아니라 선택적 각주로 처리하는 것이 적절합니다.
