  naturalness: ‘큰 기쁨으로 즐거워하려고’는 ‘기쁨’과 ‘즐거워하다’가 중복되어 다소 부자연스럽습니다. ‘크게 기뻐하려고’가 현대 표준어 합쇼체 문맥에서 더 자연스럽습니다.
  terminology: ‘몫’은 מָנוֹת의 폭을 보존하는 적절한 표현입니다. 공적 낭독과 해설의 문맥에서 ‘말씀’도 가능하며, 대안인 ‘일들’은 각주에서 제시할 수 있습니다.
