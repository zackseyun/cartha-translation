id: NEH.8.12
reference: Nehemiah 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם לֶ/אֱכֹ֤ל וְ/לִ/שְׁתּוֹת֙ וּ/לְ/שַׁלַּ֣ח מָנ֔וֹת וְ/לַ/עֲשׂ֖וֹת שִׂמְחָ֣ה גְדוֹלָ֑ה כִּ֤י הֵבִ֨ינוּ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר הוֹדִ֖יעוּ לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
  footnotes:
  - marker: a
    text: Or 'to send food portions'—that is, portions to others as part of the festival celebration.
    reason: lexical_alternative
  - marker: b
    text: Or 'the matters that had been explained to them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모든 백성은 먹고 마시며[a], 몫을 보내고, 큰 기쁨으로 즐거워하려고 떠났습니다[b]. 이는 그들이 자신들에게 알려진 말씀을 이해했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘음식 몫을 보내기 위해’—곧 절기 축제의 일부로 다른 이들에게 몫을 나누어 보내는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 설명된 일들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  english_pob_choice: went away
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 가서
  - 물러갔습니다
  lexicon: HALOT
  rationale: 서술의 흐름상 백성이 모임 자리에서 각자의 식사와 축하로 이동하는 뉘앙스를 살려 ‘떠났습니다’로 옮겼습니다.
- source_word: וּלְשַׁלַּח מָנוֹת
  english_pob_choice: to send portions
  chosen_korean: 몫을 보내고
  alternatives_korean:
  - 음식 몫을 보내고
  - 음식을 나누어 보내고
  lexicon: HALOT
  rationale: מָנוֹת는 축제 맥락의 ‘몫/분량’을 뜻하므로, ‘음식’을 덧붙여 해석을 고정하기보다 짧게 ‘몫을 보내고’로 옮겨 원문의 폭을 유지했습니다.
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  english_pob_choice: to celebrate with great joy
  chosen_korean: 큰 기쁨으로 즐거워하려고
  alternatives_korean:
  - 큰 기쁨으로 축하하려고
  - 크게 기뻐하려고
  lexicon: HALOT
  rationale: ‘make great joy’의 관용적 표현을 한국어 자연문장으로 풀되, 기쁨의 강도를 ‘큰 기쁨’으로 보존했습니다.
- source_word: בַּדְּבָרִים
  english_pob_choice: the words
  chosen_korean: 말씀을
  alternatives_korean:
  - 말들을
  - 일들을
  lexicon: HALOT
  rationale: 공적 낭독과 해설의 문맥에서 ‘말씀’이 가장 자연스럽고, 단순한 정보가 아니라 들려준 내용의 권위를 살립니다.
theological_decisions:
- issue: 기쁨의 근거
  chosen_reading: 그들의 기쁨은 본문이 명시한 대로, 자신들에게 알려진 말씀을 이해한 데서 비롯된 것으로 옮겼습니다.
  alternative_readings:
  - 회개와 언약 갱신의 신학을 더 강하게 드러내는 읽기
  - 절기 축제의 사회적 기쁨으로만 완화하는 읽기
  rationale: 본문은 기쁨의 이유를 해석적으로 확장하지 않고 ‘이해했기 때문입니다’라고 직접 말하므로, 그 인과관계를 그대로 드러냈습니다.
  doctrine_reference: 성경 본문 우선 원칙, 해석의 과잉 방지
