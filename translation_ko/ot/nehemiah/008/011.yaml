  verdict: revise
  source_fidelity: 히브리어는 레위인들이 온 백성을 계속 잠잠하게 하며 말한 것을 나타냅니다. ‘레위인들이 모든 백성을 잠잠하게 하면서’는 이 진행적·능동적 제지의 뜻을 충실히 드러냅니다. וְאַל תֵּעָצֵבוּ는 염려에 치우친 ‘근심하지 마십시오’보다 슬픔·비탄을 나타내는 ‘슬퍼하지 마십시오’가 더 가깝습니다.
  naturalness: ‘레위인’은 현대 성경 한국어에서 통용되는 자연스러운 집단명입니다. ‘잠잠하게 하면서’와 ‘잠잠하십시오’는 합쇼체를 유지하면서도 문맥상 자연스럽습니다.
  terminology: ‘레위인’과 ‘거룩한 날’은 각각 통용되는 고유 집단명 및 קָדוֹשׁ의 신학적 무게를 적절히 보존합니다. ‘오늘’은 문맥상 הַיּוֹם의 자연스러운 한국어 표현입니다.
  issues:
