id: NEH.8.11
reference: Nehemiah 8:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם מַחְשִׁ֤ים לְ/כָל הָ/עָם֙ לֵ/אמֹ֣ר הַ֔סּוּ כִּ֥י הַ/יּ֖וֹם קָדֹ֑שׁ וְ/אַל תֵּעָצֵֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
  footnotes:
  - marker: a
    text: Or “Be quiet” or “Hush.”
    reason: lexical_alternative
  - marker: b
    text: Or “do not mourn” or “do not be sad.”
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들은 모든 백성을 조용히 시키며 말하였습니다. "잠잠하십시오. 오늘은 거룩한 날이니 근심하지 마십시오."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “잠잠하십시오” 또는 “조용히 하십시오.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “슬퍼하지 마십시오” 또는 “애통하지 마십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  english_pob_choice: And the Levites
  chosen_korean: 레위 사람들은
  alternatives_korean:
  - 레위인들은
  - 레위인들이
  lexicon: HALOT
  rationale: 집단명으로서의 레위인을 현대 한국어에서 자연스럽게 풀어 옮겼습니다. 형식상 주어를 분명히 하되, 성직 호칭처럼 굳히지 않고 본문의 집단성을 살렸습니다.
- source_word: מַחְשִׁים
  english_pob_choice: were quieting
  chosen_korean: 조용히 시키며
  alternatives_korean:
  - 잠잠하게 하며
  - 조용하게 하며
  - 침묵시키며
  lexicon: HALOT
  rationale: 진행 중인 제지 동작을 나타내므로 완료형보다 진행형 표현이 적절합니다. POB의 'were quieting'에 맞추되, 한국어에서 자연스러운 '조용히 시키며'로 옮겼습니다.
- source_word: הַסּוּ
  english_pob_choice: Be still
  chosen_korean: 잠잠하십시오
  alternatives_korean:
  - 조용히 하십시오
  - 가만히 계십시오
  - 입 다무십시오
  lexicon: HALOT
  rationale: 예배 현장에서의 엄중한 침묵 요구를 담기 위해 명령형을 유지했습니다. '잠잠하십시오'는 고요함과 엄숙함을 함께 전달합니다.
- source_word: כִּי הַיּוֹם קָדֹשׁ
  english_pob_choice: for the day is holy
  chosen_korean: 오늘은 거룩한 날이니
  alternatives_korean:
  - 이 날은 거룩하니
  - 날이 거룩하니
  - 오늘이 거룩하니
  lexicon: HALOT
  rationale: 히브리어의 이유 제시를 자연스럽게 풀어 '...이니'로 연결했습니다. '거룩한 날'은 날의 구별됨을 직관적으로 드러냅니다.
- source_word: וְאַל תֵּעָצֵבוּ
  english_pob_choice: do not be grieved
  chosen_korean: 근심하지 마십시오
  alternatives_korean:
  - 슬퍼하지 마십시오
  - 애통하지 마십시오
  - 마음 아파하지 마십시오
  lexicon: HALOT
  rationale: 본문의 עצב는 슬픔과 괴로움의 정서를 가리키며, POB도 단순한 'sad'보다 더 깊은 정서적 반응을 염두에 둡니다. 한국어에서는 예배 자리의 금지된 반응으로 '근심하다'가 가장 자연스럽고 포괄적입니다.
theological_decisions:
- issue: 거룩한 날에 대한 금지의 정서 표현
  chosen_reading: '''do not be grieved''를 ''근심하지 마십시오''로 번역해 단순한 감정 억제가 아니라 공동체적 애통의 중지를 드러냈습니다.'
  alternative_readings:
  - 슬퍼하지 마십시오
  - 애통하지 마십시오
  rationale: 문맥은 율법 낭독에 대한 백성의 울음을 배경으로 하므로, '근심'은 슬픔과 염려를 함께 포괄하면서도 예배 공동체의 반응을 자연스럽게 보여 줍니다.
  doctrine_reference: 문맥 중심 번역과 정서어휘의 범위 유지
