    rationale: 이 동사는 여기서 슬퍼함·비탄을 금하는 뜻이며, 바로 앞 문맥의 백성의 울음과도 연결됩니다. ‘슬퍼하지 마십시오’가 불필요한 의미 확장 없이 더 직접적입니다.
