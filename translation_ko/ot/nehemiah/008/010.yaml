  source_fidelity: 본문은 전반적으로 히브리어를 충실히 따릅니다. 다만 לַאדֹנֵינוּ의 ‘우리 주님께 거룩한 날’은 한국어에서 관계가 다소 불명확하므로 ‘우리 주님께 거룩하게 구별된 날’로 명시하는 것이 적절합니다. לְאֵין נָכוֹן לוֹ는 ‘준비된 것이 없는 사람’으로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘단 음료’보다 ‘달콤한 음료’가 현대 표준 한국어에서 더 자연스럽습니다. ‘아무것도 준비되지 않은 사람’도 의미는 통하지만, ‘준비된 것이 없는 사람’이 사람에게 필요한 잔치 준비가 없다는 문맥을 더 매끄럽게 전달합니다.
  terminology: יהוה는 초안의 프로젝트 관용에 따라 ‘여호와’로 유지하고, אֲדֹנֵינוּ는 ‘우리 주님’으로 구별합니다. חֶדְוַת יְהוָה의 소유격 표현인 ‘여호와의 기쁨’과 מָעֻזְּכֶם의 구체적 은유인 ‘여러분의 요새’도 유지합니다.
