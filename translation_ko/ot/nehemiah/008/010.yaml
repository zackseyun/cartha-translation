source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֡ם לְכוּ֩ אִכְל֨וּ מַשְׁמַנִּ֜ים וּ/שְׁת֣וּ מַֽמְתַקִּ֗ים וְ/שִׁלְח֤וּ מָנוֹת֙ לְ/אֵ֣ין נָכ֣וֹן ל֔/וֹ כִּֽי קָד֥וֹשׁ הַ/יּ֖וֹם לַ/אֲדֹנֵ֑י/נוּ וְ/אַל תֵּ֣עָצֵ֔בוּ כִּֽי חֶדְוַ֥ת יְהוָ֖ה הִ֥יא מָֽעֻזְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
  footnotes:
  - marker: a
    text: Or, 'send portions to him for whom nothing is prepared.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'for the joy in the LORD is your stronghold.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'the joy of YHWH'; rendered 'the LORD' according to the project standard for the divine name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. “가서 기름진 음식을 먹고 달콤한 음료를 마시며, 준비된 것이 없는 사람에게 음식 몫을 보내십시오. 오늘은 우리 주님께 거룩하게 구별된 날이기 때문입니다. 근심하지 마십시오. 여호와의 기쁨[a]이 여러분의 요새이기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여호와 안에서 누리는 기쁨이 여러분의 요새이기 때문입니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁמַנִּים
  english_pob_choice: rich food
  chosen_korean: 기름진 음식
  alternatives_korean:
  - 좋은 음식
  - 진미
  lexicon: HALOT
  rationale: 잔치 자리의 풍성하고 좋은 음식을 가리키는 표현이므로, 직역의 ‘기름진 것들’보다 자연스러운 ‘기름진 음식’이 문맥과 어울립니다.
- source_word: מַֽמְתַקִּים
  english_pob_choice: sweet drinks
  chosen_korean: 단 음료
  alternatives_korean:
  - 달콤한 것들
  - 단 술
  lexicon: HALOT
  rationale: 앞의 ‘마시다’와 평행을 이루므로, 넓은 뜻의 ‘단 것들’보다 ‘단 음료’가 한국어에서 더 분명합니다.
- source_word: לְאֵין נָכוֹן לוֹ
  english_pob_choice: to anyone for whom nothing is prepared
  chosen_korean: 아무것도 준비되지 않은 사람에게는
  alternatives_korean:
  - 준비된 것이 없는 사람에게는
  - 아무 준비도 되지 않은 사람에게는
  lexicon: HALOT
  rationale: 히브리어의 준비 부재를 그대로 살리되, 대상이 분명하도록 ‘사람에게는’으로 옮겼습니다.
- source_word: חֶדְוַת יְהוָה
  english_pob_choice: the joy of Yahweh
  chosen_korean: 여호와의 기쁨
  alternatives_korean:
  - 여호와 안의 기쁨
  - 여호와께서 기뻐하심
  lexicon: HALOT
  rationale: 구문 자체의 소유격 구조를 보존해 원문 긴장을 살렸습니다. 해석적으로 풀어쓴 ‘여호와 안의 기쁨’은 본문 주해를 미리 결정하므로 본문에는 채택하지 않았습니다.
- source_word: מָעֻזְּכֶם
  english_pob_choice: your stronghold
  chosen_korean: 여러분의 요새
  alternatives_korean:
  - 여러분의 피난처
  - 여러분의 힘
  lexicon: HALOT
  rationale: 비유적 안전지대를 가리키는 구체적 이미지가 있어, 추상적인 ‘힘’보다 ‘요새’가 원문 은유를 더 잘 보존합니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 절의 본문은 하나님의 언약 이름을 직접 사용하므로, 한국어 본문에서는 프로젝트의 기존 성경적 관용에 따라 ‘여호와’로 표기했습니다.
  doctrine_reference: 'POB contested terms: divine name rendering'
- issue: ‘주님’과 ‘여호와’의 구분
  chosen_reading: 우리 주님 / 여호와
  alternative_readings:
  - 우리의 주인 / 야훼
  rationale: לַאֲדֹנֵינוּ는 경외적 호칭이므로 ‘우리 주님’으로, יְהוָה는 고유명으로 구분해 번역했습니다.
  doctrine_reference: Translation philosophy §3 (preserve lexical and theological distinctions)
