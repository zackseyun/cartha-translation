  text: וַ/אֲשֶׁ֣ר יַשְׁמִ֗יעוּ וְ/יַעֲבִ֨ירוּ ק֥וֹל בְּ/כָל עָרֵי/הֶם֮ וּ/בִ/ירוּשָׁלִַ֣ם לֵ/אמֹר֒ צְא֣וּ הָ/הָ֗ר וְ/הָבִ֨יאוּ֙ עֲלֵי זַ֨יִת֙ וַ/עֲלֵי עֵ֣ץ שֶׁ֔מֶן וַ/עֲלֵ֤י הֲדַס֙ וַ/עֲלֵ֣י תְמָרִ֔ים וַ/עֲלֵ֖י עֵ֣ץ עָבֹ֑ת לַ/עֲשֹׂ֥ת סֻכֹּ֖ת כַּ/כָּתֽוּב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
  footnotes:
  - marker: a
    text: 'Or ''oil tree'' or ''oleaster'' for ''wild olive'' (Hebrew: עֵץ שֶׁמֶן). The exact species identification is uncertain.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'leaves of olive ... leaves of myrtle ...' The translation uses 'branches' where English more naturally expresses the construction material gathered for the booths.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 예루살렘과 자기네 모든 성읍에서 이를 선포하고 널리 알리게 하여, 「산지로 나가서 올리브 나무와 기름 나무와 도금양과 종려와 그 밖의 잎이 무성한 나무의 가지를 가져와서, 기록된 대로 초막을 만들라」고 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기름 나무’는 עֵץ שֶׁמֶן의 직역입니다. 식물 동일성은 확정적이지 않아 ‘올리브나무/야생 올리브’ 계열로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘잎/가지’ 표현을 사용하지만, 한국어에서는 초막을 짓는 재료를 가리키는 말로 ‘가지’를 자연스럽게 드러냈습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁמִיעוּ
  english_pob_choice: they should proclaim
  chosen_korean: 선포하고
  alternatives_korean:
  - 외치고
  - 알리고
  lexicon: HALOT
  rationale: 히필형의 ‘듣게 하다/공표하다’는 공적 발표의 의미이므로, 한국어에서는 ‘선포하다’가 가장 직접적입니다.
- source_word: וְיַעֲבִירוּ קוֹל
  english_pob_choice: and spread the message
  chosen_korean: 널리 알리게 하여
  alternatives_korean:
  - 소리를 퍼뜨리게 하여
  - 공포하게 하여
  lexicon: HALOT
  rationale: 직역하면 ‘소리를 지나가게 하다’이지만, 널리 전파하는 관용구이므로 자연스러운 공적 전파 의미를 살려 옮겼습니다.
- source_word: עֲלֵי זַיִת / עֵץ שֶׁמֶן / הֲדַס / תְמָרִים / עֵץ עָבֹת
  english_pob_choice: branches of olive, oil tree, myrtle, palm, and other leafy trees
  chosen_korean: 올리브 나무와 기름 나무와 도금양과 종려와 그 밖의 잎이 무성한 나무
  alternatives_korean:
  - 올리브 가지와 기름 나무와 도금양과 종려와 그 밖의 잎이 무성한 나무
  - 올리브와 유목과 도금양과 종려와 그 밖의 무성한 나무
  lexicon: HALOT
  rationale: 본문의 ‘잎/가지’ 표현은 한국어에서 나무 종류를 나열하는 방식보다 ‘나무의 가지’라는 구조로 자연스럽게 드러낼 수 있어, POB의 공적 안내문 어감을 유지하면서도 원문의 식물 목록을 보존했습니다.
- source_word: סֻכּוֹת
  english_pob_choice: booths
  chosen_korean: 초막
  alternatives_korean:
  - 초막들
  - 부스
  - 임시 거처
  lexicon: HALOT
  rationale: 절기 용어인 수코트의 표준적인 한국어 대응을 사용하되, 한국 교회 전통의 ‘초막절’과도 연결되도록 했습니다.
theological_decisions:
- issue: 절기 행위의 규범성
  chosen_reading: ‘기록된 대로’라는 표현을 그대로 살려, 이 행위가 자의적 관행이 아니라 기록된 율례에 따른 순종임을 드러냈습니다.
  alternative_readings:
  - 단순한 관습 설명으로 완화하는 번역
  - ‘성경에 적힌 대로’처럼 현대적 설명을 덧붙이는 번역
  rationale: 히브리어 כַּכָּתוּב은 명시적으로 ‘기록된 대로’라는 준거를 제시하므로, 규범성과 권위를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 성경의 규범성, 율법 준수
- issue: 직접 화법의 명령문 유지
  chosen_reading: 직접 인용 안에서 명령형을 유지해 공동체가 실제로 따라야 할 지시임을 분명히 했습니다.
  alternative_readings:
  - 간접화법으로 풀어 ‘가라고 했다’ 정도로 약화
  - 명령을 설명문으로 바꾸어 완곡하게 표현
  rationale: 본문은 공동체의 즉각적 실행을 요구하는 공적 지시이므로, 명령의 긴박성과 공동체성을 보존했습니다.
  doctrine_reference: 언약 공동체의 순종
