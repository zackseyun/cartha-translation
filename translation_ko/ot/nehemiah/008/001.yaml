    rationale: כְּאִישׁ אֶחָד은 통일된 행동을 나타내는 관용구입니다. ‘마치’는 실제로 한 사람이 아닌 듯한 비교 뉘앙스를 덧붙이므로 ‘한 사람처럼’이 더 충실합니다.
  - severity: medium
    issue: ‘말했으니, 그것은 야훼께서 이스라엘에게 명하신 것이었습니다’
    rationale: 히브리어의 관계절은 ‘모세의 율법책’을 수식합니다. 현 문장은 관계절을 독립 서술로 바꾸어 지시 대상이 다소 모호해지고, ‘-으니’가 원문에 없는 인과적 연결을 만듭니다.
