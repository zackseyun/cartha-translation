base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''as one man,'' an idiom meaning ''as one'' or ''with one accord.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 백성이 물문 앞 광장에 한 사람처럼[a] 모였습니다. 그들은 에스라 서기관에게 야훼께서 이스라엘에게 명하신 모세의 율법책을 가져오라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘한 사람처럼’은 ‘한마음으로’ 또는 ‘일제히’라는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 온 백성
  - 백성 모두
  lexicon: HALOT
  rationale: 공동체 전체의 집합을 가리키므로, 현대 한국어에서 자연스러운 ‘모든 백성’으로 옮겼습니다.
- source_word: כְּאִישׁ אֶחָד
  english_pob_choice: as one man
  chosen_korean: 마치 한 사람처럼
  alternatives_korean:
  - 한 사람처럼
  - 한마음으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘한 사람’ 이미지를 살리되, 한국어에서는 성별 표지를 덜 전면화한 자연스러운 표현으로 옮겼습니다.
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 학자
  - 기록관
  lexicon: HALOT
  rationale: 에스라의 공적 직함을 드러내는 표준 대응어이므로 ‘서기관’을 유지했습니다.
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  english_pob_choice: the Book of the Law of Moses
  chosen_korean: 모세의 율법책
  alternatives_korean:
  - 모세의 율법서
  - 모세의 율법 두루마리
  lexicon: HALOT
  rationale: סֵפֶר의 문맥상 책/두루마리 의미를 한국어 성경 문체에 맞게 간결하게 살리되, ‘율법’은 טוֹרָה의 기본 대응을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신적 고유명사를 직역 대신 음역하여, ‘야훼’로 표기했습니다.
- source_word: צִוָּה יְהוָה אֶת יִשְׂרָאֵל
  english_pob_choice: which Yahweh had commanded Israel
  chosen_korean: 야훼께서 이스라엘에게 명하신 것이었습니다
  alternatives_korean:
  - 야훼께서 이스라엘에게 명령하신 것이었습니다
  - 야훼께서 이스라엘을 명하신 것이었습니다
  lexicon: HALOT
  rationale: צוה의 기본 의미를 ‘명하다’로 살렸고, 목적어 표지를 따라 ‘이스라엘에게’로 풀어 한국어 문법에 맞게 정리했습니다.
theological_decisions:
- issue: 여호와/야훼 표기 문제
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 단순 호칭이 아니라 언약적 고유명사이므로, 전통 교회어를 따르기보다 프로젝트 기준에 따라 ‘야훼’로 번역했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: ‘as one man’ 관용구의 성별 표지 보존
  chosen_reading: 마치 한 사람처럼
  alternative_readings:
  - 한 사람처럼
  - 한마음으로
  rationale: 히브리어 관용구의 통일성과 집합성을 보존하면서도 한국어 독자가 오해 없이 읽도록, 직역의 경직성을 약간 완화한 표현을 택했습니다.
  doctrine_reference: Translation philosophy §4
