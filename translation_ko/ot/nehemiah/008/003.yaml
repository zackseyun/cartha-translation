id: NEH.8.3
reference: Nehemiah 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
  footnotes:
  - marker: a
    text: Or 'from dawn.' Literally, 'from the light.'
    reason: lexical_alternative
  - marker: b
    text: Or 'those with understanding,' likely referring to all who were old enough to comprehend the reading.
    reason: lexical_alternative
  - marker: c
    text: '''Book'' may also be rendered ''scroll.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 수문 앞에 있는 광장 앞에서, 해가 뜨는 때부터 정오까지, 남자들과 여자들과 그것을 이해할 수 있는 사람들 앞에서 그것을 읽었습니다. 그리고 모든 백성의 귀가 율법책에 기울어져 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해가 뜨는 때’는 직역하면 ‘빛으로부터’이며, 시간상 ‘새벽/동틀 무렵’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이해할 수 있는 사람들’은 문맥상 읽는 내용을 알아들을 수 있는 이들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: ‘율법책’은 문맥상 ‘율법의 책’ 또는 ‘율법 두루마리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: he read
  chosen_korean: 읽었습니다
  alternatives_korean:
  - 낭독했습니다
  - 선포했습니다
  lexicon: HALOT
  rationale: 본문은 두루마리/책을 두고 하는 공개 낭독이므로, 일반적인 ‘읽다’가 가장 직접적입니다. ‘선포하다’는 의미를 지나치게 넓히고, ‘낭독하다’는 가능하지만 동사로서는 다소 설명적입니다.
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  english_pob_choice: before the square that was in front of the Water Gate
  chosen_korean: 수문 앞에 있는 광장 앞에서
  alternatives_korean:
  - 수문 앞 광장 앞에서
  - 수문 앞의 광장 앞에서
  lexicon: HALOT
  rationale: רְחוֹב는 공공의 빈 공간/광장에 해당하므로 ‘광장’이 자연스럽습니다. 관계절은 한국어에서 ‘…에 있는’으로 풀어 위치를 분명히 했습니다.
- source_word: מִן הָאוֹר עַד מַחֲצִית הַיּוֹם
  english_pob_choice: from daybreak until midday
  chosen_korean: 해가 뜨는 때부터 정오까지
  alternatives_korean:
  - 새벽부터 정오까지
  - 동틀 무렵부터 한낮까지
  lexicon: HALOT
  rationale: 직역하면 ‘빛으로부터’이지만 시간상 ‘daybreak’의 뜻입니다. 한국어에서는 ‘해가 뜨는 때’가 원문의 시작 시점을 과도하게 해석하지 않으면서도 자연스럽습니다.
- source_word: וְהַמְּבִינִים
  english_pob_choice: those who could understand
  chosen_korean: 그것을 이해할 수 있는 사람들
  alternatives_korean:
  - 이해할 수 있는 이들
  - 이해력이 있는 사람들
  lexicon: HALOT
  rationale: בין의 분사는 단순한 지적 능력 이상으로 ‘이해할 수 있는 자들’을 뜻합니다. 문맥상 낭독을 알아들을 수 있는 사람들을 가리키므로 이렇게 옮겼습니다.
- source_word: אֶל סֵפֶר הַתּוֹרָה
  english_pob_choice: to the Book of the Law
  chosen_korean: 율법책에
  alternatives_korean:
  - 율법서에
  - 토라책에
  lexicon: HALOT
  rationale: תּוֹרָה는 이 문맥에서 언약적 권위를 지닌 모세 율법을 가리키므로 ‘율법’이 적절합니다. סֵפֶר은 문맥상 ‘책/두루마리’이지만 한국어에서는 간결하게 ‘율법책’으로 처리했습니다.
theological_decisions:
- issue: תּוֹרָה의 번역을 ‘율법’으로 둘지 ‘토라’로 둘지
  chosen_reading: 율법
  alternative_readings:
  - 토라
  - 가르침
  rationale: 느헤미야 8장은 공적 낭독을 통해 백성이 하나님의 규범적 말씀에 다시 노출되는 장면이므로, 독자에게 즉시 의미가 전달되는 ‘율법’이 본문 기능을 가장 잘 드러냅니다.
  doctrine_reference: 'translation philosophy: optimal-equivalence'
- issue: ‘남자들과 여자들과 그것을 이해할 수 있는 사람들’의 범주를 구분해 유지할지
  chosen_reading: 남자들과 여자들과 그것을 이해할 수 있는 사람들
  alternative_readings:
  - 남자와 여자와 모든 이해 가능한 사람들
  - 남자들, 여자들, 그리고 이해할 수 있는 사람들
  rationale: 히브리어는 남자, 여자, 그리고 이해 가능한 사람들을 구분해 열거합니다. 한국어에서도 이 구분을 유지해 청중 범위를 흐리지 않도록 했습니다.
  doctrine_reference: gender-accurate translation principle
