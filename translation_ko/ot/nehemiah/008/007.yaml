  source_fidelity: 핵심 동사 מְבִינִים(히필)는 백성이 율법을 이해하도록 하다/깨닫도록 하다는 사역적 뜻입니다. 초안의 ‘깨닫게 하였다’는 이 뜻을 대체로 반영하지만, ‘백성이 율법을 깨닫도록 하였다’가 목적어와 율법에 대한 전치사구의 관계를 더 분명하고 자연스럽게 드러냅니다. 마지막 절은 백성이 각자의 자리에 서 있었다는 뜻으로 보존했습니다.
  naturalness: ‘제자리에서 서 있었습니다’도 이해되지만 ‘각자 제자리에 서 있었습니다’가 현대 표준 한국어에서 더 자연스럽고, 히브리어의 집합적 복수 소유 표현을 잘 전달합니다. 또한 각주 표지는 해당 표현 바로 뒤에 두는 편이 독자의 연결을 분명히 합니다.
  terminology: ‘율법’은 이 문맥의 לַתּוֹרָה에 적절합니다. 인명은 표준 한국어 성경의 통용 표기와 원어 자음에 맞추어 예수아, 스레뱌, 삽브대, 글리다, 요사밧, 블라야 등으로 바로잡는 것이 안전합니다. 특히 ‘깔리다’는 현대 한국어 일반 동사와 겹치며 인명 표기로 부적절합니다.
