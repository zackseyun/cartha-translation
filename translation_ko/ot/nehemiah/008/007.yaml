id: NEH.8.7
reference: Nehemiah 8:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֵשׁ֡וּעַ וּ/בָנִ֡י וְ/שֵׁרֵ֥בְיָ֣ה יָמִ֡ין עַקּ֡וּב שַׁבְּתַ֣י הֽוֹדִיָּ֡ה מַעֲשֵׂיָ֡ה קְלִיטָ֣א עֲזַרְיָה֩ יוֹזָבָ֨ד חָנָ֤ן פְּלָאיָה֙ וְ/הַ/לְוִיִּ֔ם מְבִינִ֥ים אֶת הָ/עָ֖ם לַ/תּוֹרָ֑ה וְ/הָ/עָ֖ם עַל עָמְדָֽ/ם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
  footnotes:
  - marker: a
    text: 'Or, ''helped the people understand the law.'' The Hebrew verb is causative: the Levites were making the law understood.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'while the people stood in their place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예슈아, 바니, 스레비야, 야민, 악굽, 샤브대, 호디야, 마아세야, 깔리다, 아사랴, 요자밧, 하난, 벨라야와 레위 사람들이 백성에게 율법을 깨닫게 하였고, 백성은 제자리에서 서 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성에게 율법을 이해시키고 있었다.’ 히브리어 동사는 사역형으로, 레위 사람들이 율법을 이해 가능하게 만들었다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘백성은 자기 자리에 서 있었습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁוּעַ ... וְהַלְוִיִּם
  english_pob_choice: And Jeshua ... and the Levites
  chosen_korean: 예슈아 …와 레위 사람들이
  alternatives_korean:
  - 여호수아 …와 레위 사람들이
  - 예수아 …와 레위 사람들이
  lexicon: 고유명사 표기 관행
  rationale: 히브리어 고유명사는 음역하되, 여호수아와 혼동을 줄이기 위해 예슈아를 택했습니다. 문장 구조상 마지막에 레위 사람들을 따로 연결하는 관계를 유지했습니다.
- source_word: מְבִינִים
  english_pob_choice: explained / gave the people understanding
  chosen_korean: 백성에게 율법을 깨닫게 하였고
  alternatives_korean:
  - 백성에게 율법을 설명하였고
  - 백성에게 율법을 이해시키였고
  lexicon: HALOT
  rationale: 히필 분사는 ‘이해하게 하다’라는 사역적 의미가 핵심이므로, 설명 행위보다 결과를 드러내는 ‘깨닫게 하다’가 원문의 사역성을 잘 살립니다.
- source_word: אֶת הָעָם לַתּוֹרָה
  english_pob_choice: the law to the people
  chosen_korean: 백성에게 율법을
  alternatives_korean:
  - 백성에게 토라를
  - 백성에게 율법에 관하여
  lexicon: HALOT
  rationale: 토라를 이 문맥에서는 ‘율법’으로 옮기는 것이 자연스럽고, 대상 표지는 한국어 어순에 맞게 ‘백성에게’로 처리했습니다.
- source_word: וְהָעָם עַל עָמְדָם
  english_pob_choice: while the people remained in their places
  chosen_korean: 백성은 제자리에서 서 있었습니다
  alternatives_korean:
  - 백성은 자기 자리에 서 있었습니다
  - 백성은 서 있던 자리에서 있었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 의미를 살려, 사람들의 위치를 유지한 상태를 현대 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 레위 사람들의 역할을 ‘설명’이 아니라 사역적 이해 제공으로 옮김
  chosen_reading: ‘율법을 깨닫게 하였다’로 번역하여, 말씀을 단순 낭독하는 것이 아니라 이해 가능하게 만드는 사역을 드러냈습니다.
  alternative_readings:
  - ‘율법을 설명하였다’
  - ‘율법을 가르쳤다’
  rationale: 본문의 히필 분사는 원인 제공과 이해 유도에 초점이 있으므로, 교육 행위의 기능을 유지하면서도 과도한 해석을 피했습니다.
  doctrine_reference: 성경 해석과 가르침의 사역
- issue: 고유명사 예슈아의 표기
  chosen_reading: 예슈아
  alternative_readings:
  - 여호수아
  - 예수아
  rationale: 문맥상 여호수아와 구별되는 인명 음역을 유지해야 하므로, 전통적 한글 성경식 표기보다 स्रोत-기반 표기를 택했습니다.
  doctrine_reference: 본문 충실성 및 고유명사 구별
