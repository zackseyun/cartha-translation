  text: וַֽ/יַּעֲמֹ֞ד עֶזְרָ֣א הַ/סֹּפֵ֗ר עַֽל מִגְדַּל עֵץ֮ אֲשֶׁ֣ר עָשׂ֣וּ לַ/דָּבָר֒ וַ/יַּֽעֲמֹ֣ד אֶצְל֡/וֹ מַתִּתְיָ֡ה וְ/שֶׁ֡מַע וַ֠/עֲנָיָה וְ/אוּרִיָּ֧ה וְ/חִלְקִיָּ֛ה וּ/מַעֲשֵׂיָ֖ה עַל יְמִינ֑/וֹ וּ/מִ/שְּׂמֹאל֗/וֹ פְּ֠דָיָה וּ/מִֽישָׁאֵ֧ל וּ/מַלְכִּיָּ֛ה וְ/חָשֻׁ֥ם וְ/חַשְׁבַּדָּ֖נָה זְכַרְיָ֥ה מְשֻׁלָּֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a tower of wood''; that is, a raised wooden structure or stand.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for the matter' or 'for the purpose.'
    reason: lexical_alternative
translation:
  language: ko
  text: 서기관 에스라가 그 일을 위하여 만든 나무로 만든 연단 위에 섰습니다. 그의 곁에는 맛디댜, 스마, 아나야, 우리야, 힐기야, 마아세야가 그의 오른쪽에 섰고, 브다야, 미사엘, 말기야, 하숨, 하삽다나, 스가랴, 므술람이 그의 왼쪽에 섰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: 학사
  alternatives_korean:
  - 서기관
  - 필경사
  lexicon: HALOT
  rationale: 에스라는 단순한 필사자가 아니라 율법과 문서를 다루는 공적 서기관이므로, 한국어로는 교회 전통의 낡은 뉘앙스를 덜고 기능을 드러내는 ‘학사’가 적절합니다.
- source_word: מִגְדַּל עֵץ
  english_pob_choice: a wooden platform
  chosen_korean: 나무 단
  alternatives_korean:
  - 나무 탑
  - 나무로 된 단
  - 나무 연단
  lexicon: HALOT
  rationale: 직역하면 ‘나무 탑’이지만, 문맥상 공적 낭독을 위한 높인 구조물이므로 기능을 살려 ‘나무 단’으로 옮겼습니다.
- source_word: לַדָּבָר
  english_pob_choice: for the occasion
  chosen_korean: 그 목적을 위해
  alternatives_korean:
  - 그 일을 위해
  - 그 사건을 위해
  - 그 일에 맞추어
  lexicon: HALOT
  rationale: דָּבָר는 여기서 ‘일/사건/목적’의 폭넓은 의미를 가지므로, 구조물이 준비된 목적을 드러내는 ‘그 목적을 위해’가 가장 무난합니다.
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  english_pob_choice: on his right hand / on his left hand
  chosen_korean: 그의 오른쪽 / 그의 왼쪽
  alternatives_korean:
  - 그의 오른편 / 그의 왼편
  - 오른손 편 / 왼손 편
  lexicon: HALOT
  rationale: 히브리어의 신체 방향 표현을 한국어의 자연스러운 공간 표현으로 풀되, 대칭 구조는 그대로 보존했습니다.
