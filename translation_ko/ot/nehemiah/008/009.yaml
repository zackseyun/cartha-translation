base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
  footnotes:
  - marker: a
    text: Or “the Tirshatha,” a Persian administrative title.
    reason: lexical_alternative
  - marker: b
    text: Or “the words of the Torah.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 느헤미야—그가 총독이었고—에스라 제사장 겸 서기관과 백성을 깨닫게 하던 레위 사람들이 모든 백성에게 말했습니다. "이 날은 너희 하나님 야훼께 거룩한 날입니다. 슬퍼하지도 말고 울지도 마십시오." 모든 백성이 율법의 말씀을 들으며 울고 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘티르샤타’; 페르시아 행정 직함입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘토라의 말씀’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  english_pob_choice: the governor
  chosen_korean: 총독
  alternatives_korean:
  - 티르샤타
  lexicon: HALOT
  rationale: 페르시아 시대 행정 직함으로서 기능을 드러내는 번역이므로, 의미를 직접 전달하는 ‘총독’을 택하고 음역은 대안으로만 남겼습니다.
- source_word: הַכֹּהֵן הַסֹּפֵר
  english_pob_choice: the priest and scribe
  chosen_korean: 제사장 겸 서기관
  alternatives_korean:
  - 제사장과 서기관
  - 제사장이자 서기관
  lexicon: HALOT
  rationale: 에스라에게 붙은 두 직함을 함께 보존하되, 한국어에서 자연스러운 겸칭으로 압축해 두 역할이 모두 보이게 했습니다.
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  english_pob_choice: the Levites who were instructing the people
  chosen_korean: 백성을 깨닫게 하던 레위 사람들
  alternatives_korean:
  - 백성을 가르치던 레위 사람들
  - 백성을 이해하게 하던 레위 사람들
  lexicon: HALOT
  rationale: בין의 히필 분사는 단순 정보 전달보다 ‘이해하게 하다/깨닫게 하다’의 사역적 의미가 강하므로, 교육 기능을 살리면서도 직역에 가까운 표현을 택했습니다.
- source_word: דִּבְרֵי הַתּוֹרָה
  english_pob_choice: the words of the law
  chosen_korean: 율법의 말씀
  alternatives_korean:
  - 토라의 말씀
  - 율법의 말들
  lexicon: HALOT
  rationale: 공적 낭독과 언약 갱신의 맥락에서 תּוֹרָה는 ‘율법’이 가장 투명하며, ‘말씀’으로 묶어 청중이 들은 내용의 권위를 살렸습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh your God
  chosen_korean: 너희 하나님 야훼
  alternatives_korean:
  - 너희 하나님 여호와
  - 너희 하나님 야훼께
  lexicon: HALOT
  rationale: 본문의 여호와 계시명을 학술 음역인 ‘야훼’로 일관되게 옮겼고, 여격은 한국어 화법상 ‘-께’를 생략하지 않는 위치에만 자연스럽게 반영했습니다.
theological_decisions:
- issue: YHWH의 음역을 한국어 본문에 어떻게 드러낼지
  chosen_reading: 하나님 이름을 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 יְהוָה를 직접 사용하므로, 계시된 언약명을 가리는 우회 표현보다 본문 가시성을 우선했습니다. 이는 POB의 원문-직결 원칙과도 맞습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
