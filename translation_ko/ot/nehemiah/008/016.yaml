revisions:
- from: 그리하여 백성이 나가서 가져왔고, 자기들을 위해 초막들을 지었습니다. 각 사람은 자기 지붕 위와 자기 마당들과 하나님의 집의 마당들과 물문 광장과 에브라임문 광장에 지었습니다.[a][b]
  to: 그리하여 백성은 나가서 그것들을 가져와, 각자 자기 지붕 위와 자기들의 뜰, 하나님의 집 뜰, 수문 광장과 에브라임 문 광장에 자기들을 위하여 초막들[a]을 지었습니다.[b]
  rationale: 중복된 ‘짓다’ 서술을 제거하고, 원문의 분배 표현 אִישׁ(‘각자’)가 장소 목록과 초막 건축 행위를 직접 수식하도록 문장을 재구성했습니다. ‘그것들’은 앞 절에서 가져오라고 한 가지들을 가리키는 문맥상 암시된 목적어를 보완합니다. 두 각주 표지는 각각 ‘초막들’과 두 ‘광장’ 표현을 포괄하는 문장 끝에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:38:37Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 동사 연쇄(나가다–가져오다–초막을 만들다)와 각 장소의 병렬을 유지해야 합니다. 초안은 ‘초막들을 지었습니다’라고 이미 서술한 뒤 ‘각 사람은 … 지었습니다’라고 다시 반복하여, 원문의 단일 서술 구조와 분배 구문이 흐려졌습니다. 또한 וַיָּבִיאוּ의 암시된 목적어는 앞 절의 가지들을 가리키므로 ‘그것들을’로 보충하는 것이 영어 POB의 처리 및 문맥에 부합합니다.
  naturalness: ‘각 사람이 … 지었습니다’의 주어를 앞의 ‘백성’과 자연스럽게 연결하고, 병렬 장소 목록에는 반복되는 조사 대신 마지막 항목에만 조사를 두어 현대 표준 한국어 문장으로 다듬었습니다. ‘자신들을 위하여’는 분배적 ‘각 사람’과 결합할 때 다소 부자연스러우므로 ‘자기들을 위하여’를 피하고 ‘각자 … 초막들을 지었습니다’로 처리했습니다.
  terminology: סֻכּוֹת은 절기명 ‘초막절’과의 연결을 보존하는 ‘초막들’로 유지합니다. חָצֵר는 ‘뜰’, רְחוֹב는 성문 곁의 열린 공공 공간이라는 뜻에서 ‘광장’으로 옮깁니다. 고유 지명은 한국어 성경 관례와 자연스러운 표기에 따라 ‘수문’과 ‘에브라임 문’으로 표기했습니다.
