base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
  footnotes:
  - marker: a
    text: Or 'shelters' for סֻכּוֹת; 'booths' is retained to preserve the connection with the Feast of Booths.
    reason: lexical_alternative
  - marker: b
    text: Hebrew רְחוֹב refers to an open public area or plaza near a gate; traditionally, 'broad place.'
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 백성은 나가서 그것들을 가져와, 각자 자기 지붕 위와 자기들의 뜰, 하나님의 집 뜰, 수문 광장과 에브라임 문 광장에 자기들을 위하여 초막들[a]을 지었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘초막들’은 히브리어 סֻכּוֹת을 옮긴 말이며, 절기인 초막절과의 연결을 유지합니다.
    reason: source_note
  - marker: b
    text: ‘광장’은 히브리어 רְחוֹב, 곧 성문 가까이에 있는 열린 공공 공간을 옮긴 말입니다. 전통 번역의 ‘넓은 곳’에 해당합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  english_pob_choice: So the people went out
  chosen_korean: 그리하여 백성이 나가서
  alternatives_korean:
  - 그래서 백성이 나가서
  - 그리하여 사람들이 나가서
  lexicon: HALOT
  rationale: וַיֵּצְאוּ의 서술 진행을 자연스러운 합쇼체로 옮기고, הָעָם은 집합체로서 ‘백성’이 문맥상 더 정확합니다.
- source_word: וַיָּבִיאוּ
  english_pob_choice: brought them
  chosen_korean: 가져왔고
  alternatives_korean:
  - 가져왔습니다
  - 가져왔으며
  lexicon: HALOT
  rationale: 앞절의 가지와 잎사귀를 가리키는 대상을 한국어 본문 안에서는 굳이 반복하지 않고, ‘가져왔고’로 자연스럽게 연결했습니다.
- source_word: סֻכּוֹת
  english_pob_choice: booths
  chosen_korean: 초막들
  alternatives_korean:
  - 부스들
  - 장막들
  - 임시 거처들
  lexicon: HALOT
  rationale: 절기 명칭과의 연결을 살리면서도 현대 한국어에서 이해 가능한 말로, 전통 교회어휘 ‘초막’이 문맥에 가장 적합합니다.
- source_word: אִישׁ עַל גַּגּוֹ
  english_pob_choice: each on his roof
  chosen_korean: 각 사람은 자기 지붕 위에
  alternatives_korean:
  - 각자는 자기 옥상에
  - 사람마다 자기 지붕 위에
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 ‘각 사람’으로 살리고, גָּג는 현대적으로 ‘지붕 위’가 가장 분명합니다.
- source_word: וּבְחַצְרֹתֵיהֶם / וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  english_pob_choice: in their courtyards / in the courtyards of the house of God
  chosen_korean: 자기 마당들과 하나님의 집의 마당들과
  alternatives_korean:
  - 자기 뜰들과 하나님의 집의 뜰들과
  - 자기 마당들과 하나님의 집의 뜰들
  lexicon: HALOT
  rationale: חָצֵר는 울타리 안의 마당·뜰을 가리키므로, 일상적이면서도 공간감을 살리는 ‘마당’이 자연스럽고, בֵּית הָאֱלֹהִים은 관습적으로 ‘하나님의 집’이 분명합니다.
- source_word: וּבִרְחוֹב שַׁעַר הַמַּיִם / וּבִרְחוֹב שַׁעַר אֶפְרָיִם
  english_pob_choice: in the square of the Water Gate / in the square of the Gate of Ephraim
  chosen_korean: 물문 광장과 에브라임문 광장에
  alternatives_korean:
  - 물문 광장과 에브라임문 광장에
  - 물문 앞 광장과 에브라임문 앞 광장에
  lexicon: HALOT
  rationale: רְחוֹב는 성문 가까이의 열린 공공 공간이므로 ‘광장’으로 옮겼고, שני שערים는 고유 지명으로 처리해 간결하게 살렸습니다.
theological_decisions:
- issue: 절기 초막의 의미를 어떻게 살릴 것인지
  chosen_reading: ‘초막들’로 옮겨 절기적·본문상 연결을 유지했습니다.
  alternative_readings:
  - ‘임시 거처들’
  - ‘장막들’
  rationale: 본문은 절기 초막절의 실천을 서술하므로, 기능 설명보다 절기적 용어를 보존하는 편이 독자에게 저자 의도를 더 분명히 전달합니다.
  doctrine_reference: 레 23:42-43; 느 8:14-18
