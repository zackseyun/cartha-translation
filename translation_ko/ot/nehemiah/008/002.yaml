revisions:
- from: 그때 에스라 제사장이 율법을 회중 앞에 가져왔습니다. 곧 남자에서 여자에 이르기까지, 그리고 들은 것을 이해할 수 있는 모든 사람이었습니다. 그날은 일곱째 달의 첫째 날이었습니다.[a][b]
  to: 제사장 에스라는 남자와 여자[a]와 듣고 이해할 수 있는 모든 사람이 모인 회중 앞에 율법을 가져왔습니다[b]. 때는 일곱째 달 첫째 날이었습니다.
  rationale: 원문의 한 문장 구조를 유지하면서, 회중이 남자와 여자 및 낭독을 듣고 이해할 수 있는 모든 사람으로 이루어졌음을 자연스럽게 표현했습니다. 날짜는 원문의 시간 부사구 기능을 살려 ‘때는’으로 연결했으며, 각주 표지는 각각의 설명 대상에 직접 배치했습니다.
