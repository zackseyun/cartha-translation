base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
  footnotes:
  - marker: a
    text: Or “both men and women.” The Hebrew reads literally “from man to woman,” expressing the full range of the assembly.
    reason: lexical_alternative
  - marker: b
    text: Or “all who could understand by hearing,” that is, all who were able to comprehend the reading.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 에스라 제사장이 율법을 회중 앞에 가져왔습니다. 곧 남자에서 여자에 이르기까지, 그리고 들은 것을 이해할 수 있는 모든 사람이었습니다. 그날은 일곱째 달의 첫째 날이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “남자에서 여자까지”라고 되어 있어, 회중 전체의 범위를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “들은 것으로 이해할 수 있는 모든 사람”, 곧 낭독을 알아들을 수 있는 모든 사람입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 성직자
  lexicon: HALOT
  rationale: עזרא의 직함을 가리키는 직접 대응으로 제사장이 가장 자연스럽고, 문맥의 성전/율법 공적 낭독 장면과도 맞습니다.
- source_word: הַתּוֹרָה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 토라
  - 법
  lexicon: HALOT
  rationale: 이 문맥은 모세 율법의 공적 낭독이므로, 일반 독자가 알아듣기 쉬우면서도 covenantal 성격을 유지하는 율법이 적절합니다.
- source_word: לִפְנֵי הַקָּהָל
  english_pob_choice: before the assembly
  chosen_korean: 회중 앞에
  alternatives_korean:
  - 회중 앞에서
  - 모임 앞에
  - 공동체 앞에
  lexicon: HALOT
  rationale: קָהָל은 모인 백성을 가리키므로 회중이 자연스럽고, 예배적/제도적 뉘앙스를 과도하게 덧씌우지 않습니다.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  english_pob_choice: from man to woman
  chosen_korean: 남자에서 여자에 이르기까지
  alternatives_korean:
  - 남녀 모두
  - 남자부터 여자까지
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 살려 원문의 범위를 드러내되, 한국어에서는 '이르기까지'로 자연스럽게 풀었습니다.
- source_word: מֵבִין לִשְׁמֹעַ
  english_pob_choice: all who could understand what they heard
  chosen_korean: 들은 것을 이해할 수 있는 모든 사람
  alternatives_korean:
  - 듣고 이해할 수 있는 모든 사람
  - 들어서 이해하는 모든 사람
  - 듣는 것을 분별할 수 있는 모든 사람
  lexicon: HALOT
  rationale: 단순 청취가 아니라 낭독을 이해할 수 있는 능력을 뜻하므로, '들은 것을 이해할 수 있는'으로 청각적 이해를 살렸습니다.
- source_word: בְּי֥וֹם אֶחָ֖ד לַחֹ֥דֶשׁ הַשְּׁבִיעִֽי
  english_pob_choice: on the first day of the seventh month
  chosen_korean: 그날은 일곱째 달의 첫째 날이었습니다
  alternatives_korean:
  - 일곱째 달의 첫째 날이었습니다
  - 그 달의 첫날이었습니다
  lexicon: HALOT
  rationale: 히브리어 날짜 공식의 관용적 표현을 한국어 성경체로 옮겼습니다.
theological_decisions:
