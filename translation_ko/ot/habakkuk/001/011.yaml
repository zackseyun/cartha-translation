- from: 그러므로 그는 바람처럼 스쳐 지나가며, 지나가고는 죄를 짓습니다[a][b]. 이 힘은 그의 신입니다.
  to: 그때 그는 바람[b]처럼 휩쓸고 지나가며 계속 나아가고, 죄를 범합니다[a]. 그의 이 힘이 그의 신입니다.
  rationale: Temporal אָז is corrected to ‘그때’; the sequential movement is made idiomatic while preserving both verbs; culpability is expressed in standard formal Korean; and both footnote anchors now attach to the words and claims they annotate. The terse and disputed final clause remains represented by the main reading and its alternatives are retained in footnote a.
