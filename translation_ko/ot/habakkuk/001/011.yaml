id: HAB.1.11
reference: Habakkuk 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֣ז חָלַ֥ף ר֛וּחַ וַֽ/יַּעֲבֹ֖ר וְ/אָשֵׁ֑ם ז֥וּ כֹח֖/וֹ לֵ/אלֹהֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/011.yaml
  text: Then he sweeps by like the wind and passes on—he becomes guilty[b][a]; this strength of his is his god.
  footnotes:
  - marker: a
    text: Or, 'he becomes guilty, attributing this strength to his god,' or 'his strength belongs to his god.' The Hebrew final clause is terse and can be understood in more than one way.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'wind' can also mean 'spirit'; here the context favors the image of swift, forceful movement like the wind.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그는 바람처럼 스쳐 지나가며, 지나가고는 죄를 짓습니다[a][b]. 이 힘은 그의 신입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '그는 이 힘을 그의 신에게 돌리며 죄를 짓습니다' 혹은 '그의 힘은 그의 신에게 속합니다.' 히브리어 마지막 절은 매우 압축되어 있어 여러 방식으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 '바람'은 '영'을 뜻할 수도 있지만, 여기서는 신속하고 강력한 이동의 이미지를 드러내는 '바람'이 문맥에 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그러므로
  alternatives_korean:
  - 그때
  - 그리하여
  lexicon: HALOT
  rationale: 앞선 진술에 이어지는 결론적 전환을 자연스럽게 드러내는 합쇼체 표현으로 옮겼습니다.
- source_word: חָלַף רוּחַ
  english_pob_choice: sweeps by like the wind
  chosen_korean: 바람처럼 스쳐 지나가며
  alternatives_korean:
  - 바람처럼 휙 지나가며
  - 바람처럼 휩쓸고 지나가며
  lexicon: HALOT
  rationale: 동사 חָלַף와 뒤따르는 רוּחַ의 급속한 이동 이미지를 살려, 단순한 '지나가다'보다 속도와 힘을 드러내는 표현으로 옮겼습니다.
- source_word: וַיַּעֲבֹר
  english_pob_choice: and passes on
  chosen_korean: 지나가고는
  alternatives_korean:
  - 그리고 지나가며
  - 그리하여 지나가고
  lexicon: HALOT
  rationale: 앞 동작을 이어받는 연속 동사로서, 한국어에서는 연속성을 보이는 연결형으로 처리했습니다.
- source_word: וְאָשֵׁם
  english_pob_choice: he becomes guilty
  chosen_korean: 죄를 짓습니다
  alternatives_korean:
  - 유죄가 됩니다
  - 죄책을 짊어집니다
  - 죄를 범합니다
  lexicon: HALOT
  rationale: 히브리어의 '죄책을 지게 됨'을 합쇼체에서 가장 직설적으로 드러내되, 문맥상 단순 상태보다 행위·책임의 발생을 보이기 위해 동사적으로 옮겼습니다.
- source_word: לֵאלֹהוֹ
  english_pob_choice: is his god
  chosen_korean: 그의 신입니다
  alternatives_korean:
  - 그의 하나님입니다
  - 그의 신이 됩니다
  - 그의 신에게 속합니다
  lexicon: HALOT
  rationale: 마지막 절의 압축된 표현을 한국어로 간결하게 살렸습니다. 여기서는 우상적 자기의지의 비판이므로 일반적인 '하나님'보다 '신'이 원문 긴장을 더 잘 드러냅니다.
theological_decisions:
- issue: 마지막 절 זוּ כֹחוֹ לֵאלֹהוֹ의 해석
  chosen_reading: 그의 힘 자체가 그의 신이라는, 우상화된 자기의지에 대한 책망으로 읽었습니다.
  alternative_readings:
  - 이 힘을 그의 신에게 돌린다는 뜻
  - 그의 힘이 그의 신에게 속한다는 뜻
  rationale: 원문의 압축성과 다의성을 유지하되, 문맥상 침략자의 오만한 힘을 신격화하는 비판이 가장 자연스럽습니다. 따라서 본문은 그 해석을 본문 안에 담고, 다른 가능성은 각주에 남깁니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
