id: HAB.1.16
reference: Habakkuk 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּן֙ יְזַבֵּ֣חַ לְ/חֶרְמ֔/וֹ וִֽ/יקַטֵּ֖ר לְ/מִכְמַרְתּ֑/וֹ כִּ֤י בָ/הֵ֨מָּה֙ שָׁמֵ֣ן חֶלְק֔/וֹ וּ/מַאֲכָל֖/וֹ בְּרִאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/016.yaml
  text: Therefore he sacrifices to his net and burns incense to his dragnet[a], because by them his portion is rich and his food is plentiful.
  footnotes:
  - marker: a
    text: Or 'his share is fat, and his food is rich/choice.' The Hebrew uses imagery of fatness to express abundance and prosperity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그는 자기 그물에게 희생제사를 드리고 자기 덫그물에게 향을 피웁니다. 그것들로 그의 몫이 풍성해지고 그의 음식이 넉넉해지기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몫이 기름지다, 음식이 기름지다’라는 뜻으로도 옮길 수 있습니다. 히브리어는 풍요와 번영을 나타내는 ‘살찜’의 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְזַבֵּחַ
  english_pob_choice: he sacrifices
  chosen_korean: 희생제사를 드립니다
  alternatives_korean:
  - 제사를 드립니다
  - 희생을 바칩니다
  - 제물로 드립니다
  lexicon: HALOT
  rationale: זבח의 제의적 의미를 살리되, 우상숭배적 맥락이 분명하므로 단순한 일반 동작보다 ‘희생제사’를 택했습니다.
- source_word: לְחֶרְמוֹ / לְמִכְמַרְתּוֹ
  english_pob_choice: to his net / to his dragnet
  chosen_korean: 그물 / 덫그물
  alternatives_korean:
  - 그물 / 투망
  - 그물 / 큰그물
  - 그물 / 자망
  lexicon: HALOT
  rationale: 두 어휘의 구별을 유지하려고 첫째는 일반적인 ‘그물’, 둘째는 더 포괄적으로 잡아 끄는 뜻을 살린 ‘덫그물’로 옮겼습니다.
- source_word: וִיקַטֵּר
  english_pob_choice: and burns incense
  chosen_korean: 향을 피웁니다
  alternatives_korean:
  - 분향합니다
  - 향을 사릅니다
  - 향을 올립니다
  lexicon: HALOT
  rationale: קטר의 제의적 ‘향을 피우다’라는 뜻을 직접 살려, 단순한 비유적 의존이 아니라 실제 예배 행위를 연상시키게 했습니다.
- source_word: שָׁמֵן חֶלְקוֹ / בְּרִיאָה
  english_pob_choice: his portion is rich / his food is plentiful
  chosen_korean: 그의 몫이 풍성해지고 그의 음식이 넉넉해지기
  alternatives_korean:
  - 그의 몫이 살이 쪄지고 그의 음식이 기름져지기
  - 그의 몫이 비대해지고 그의 음식이 풍족해지기
  - 그의 분깃이 풍요로워지고 그의 먹을거리가 충분해지기
  lexicon: HALOT
  rationale: ‘fat/choice’의 직역적 이미지를 한국어에서는 ‘풍성하다, 넉넉하다’로 풀어, 풍요와 번영의 은유를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 전리품과 전쟁 수단을 대상으로 한 제의적 언어
  chosen_reading: 이 구절은 그가 자기 성공의 수단을 실제로 예배 대상으로 삼는다는 직설적 표현을 그대로 살렸습니다.
  alternative_readings:
  - 군사력이나 수단에 대한 과도한 신뢰라는 비유로 완화해 읽을 수 있습니다.
  rationale: 히브리어가 희생제사와 향 피우기의 제의 용어를 분명히 사용하므로, 이를 약화시키지 않고 우상숭배적 역설을 드러내는 편이 원문의 힘에 가깝습니다.
  doctrine_reference: Translation philosophy §1, §3
