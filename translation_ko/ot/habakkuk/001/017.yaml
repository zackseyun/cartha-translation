source:
  edition: WLC
  text: הַ֥/עַל כֵּ֖ן יָרִ֣יק חֶרְמ֑/וֹ וְ/תָמִ֛יד לַ/הֲרֹ֥ג גּוֹיִ֖ם לֹ֥א יַחְמֽוֹל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/017.yaml
  text: Will he therefore keep emptying his net and continually slaughtering nations without mercy?[a][b]
  footnotes:
  - marker: a
    text: Or, 'and not spare.' The Hebrew verb can be rendered more literally as 'spare' or 'have pity.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'his dragnet.' The noun refers to fishing gear; 'net' is used here for natural English within the extended fishing metaphor of the context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그가 자기 그물을 계속 비우고, 끊임없이 민족들을 살육하며 그들을 아끼지 않겠습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 불쌍히 여기지.’ 히브리어 동사는 더 문자적으로 ‘아끼다’ 또는 ‘불쌍히 여기다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기 투망.’ 이 명사는 물고기를 잡는 그물을 가리킵니다. 이 구절의 확장된 어부 비유에서는 ‘그물’이 자연스러운 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל כֵּן
  english_pob_choice: Will he therefore
  chosen_korean: 그러므로 그가
  alternatives_korean:
  - 그러니 그가
  - 그런즉 그가
  lexicon: HALOT
  rationale: 문맥상 앞절에서 이어지는 추론을 살리기 위해 ‘그러므로’를 두고, 히브리어의 의문문 힘은 종결 어미로 반영했습니다.
- source_word: יָרִיק חֶרְמוֹ
  english_pob_choice: keep emptying his net
  chosen_korean: 자기 그물을 계속 비우며
  alternatives_korean:
  - 자기 그물을 계속 비우고
  - 자기 그물을 비워 가며
  lexicon: HALOT
  rationale: יָרִיק의 ‘비우다’ 의미를 살리되, 반복·지속의 뉘앙스를 ‘계속’으로 반영했습니다. חֶרְם은 문맥의 어획 비유를 따라 ‘그물’로 옮겼습니다.
- source_word: לַהֲרֹג גּוֹיִם
  english_pob_choice: slaughtering nations
  chosen_korean: 민족들을 살육하면서
  alternatives_korean:
  - 나라들을 죽이면서
  - 민족들을 죽이면서
  lexicon: HALOT
  rationale: 여기서 לַהֲרֹג는 단순한 ‘죽이다’보다 대량 학살의 폭력을 드러내므로 ‘살육하다’로 옮겼고, גּוֹיִם은 정치·민족 집단을 가리키므로 ‘민족들’이 가장 자연스럽습니다.
- source_word: לֹא יַחְמֹל
  english_pob_choice: without mercy
  chosen_korean: 자비를 베풀지 않겠습니까
  alternatives_korean:
  - 불쌍히 여기지 않겠습니까
  - 사면하지 않겠습니까
  lexicon: HALOT
  rationale: חמל의 ‘불쌍히 여기다/아끼다’ 의미를 한국어 문맥에 맞게 부정형으로 풀어, 반복되는 폭력 속에서 ‘자비를 베풀지 않다’는 뜻을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 수사 의문문의 처리
  chosen_reading: 문장 전체를 실제 질문으로 옮겨, 예언적 탄식과 반문의 긴장을 유지했습니다.
  alternative_readings:
  - 진술문처럼 ‘그러므로 그가… 하지 않겠습니까’보다 약하게 처리하는 방식
  - 평서문으로 풀어 ‘그는… 자비를 베풀지 않습니다’로 옮기는 방식
  rationale: 히브리어 의문문은 단순 정보 요청이 아니라 도덕적 반문이므로, 한국어에서도 질문형을 유지하는 것이 본문의 수사력을 가장 잘 보존합니다.
  doctrine_reference: 예언서 수사와 문맥 충실성
- issue: 폭력 표현의 강도
  chosen_reading: ‘살육하다’를 사용해 군사적 학살의 잔혹성을 직접 반영했습니다.
  alternative_readings:
  - ‘죽이다’로 완화하는 방식
  - ‘처형하다’처럼 제도적 표현으로 바꾸는 방식
  rationale: 문맥은 단순한 살해가 아니라 민족을 대상으로 한 무차별적 폭력을 묘사하므로, 강한 어휘를 유지하는 것이 원문의 의미에 더 충실합니다.
  doctrine_reference: 원문 의미 보존
