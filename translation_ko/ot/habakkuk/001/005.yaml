revisions:
- from: 여러 민족들 가운데를 살펴보고 보십시오[a]. 놀라고, 크게 놀라십시오[b]. 내가 여러분의 시대에 한 일을 하고 있기 때문입니다. 그것이 이야기된다 해도 여러분은 믿지 못할 것입니다.
  to: 민족들을 바라보고 살펴보십시오. 놀라고 또 놀라십시오[a]. 내가 여러분의 시대에 어떤 일을 하고 있으니, 그 일이 전해진다 해도 여러분은 믿지 못할 것입니다[b].
  rationale: 두 관찰 명령을 '바라보고 살펴보십시오'로 구별하고, 놀람 동사의 반복은 '놀라고 또 놀라십시오'로 보존했습니다. '민족들'로 간결하게 고쳤으며, פֹעַל פֹּעֵל은 문맥상 암시된 1인칭 주어를 유지해 '내가 … 어떤 일을 하고 있으니'로 자연스럽게 옮겼습니다. 수동형 יְסֻפָּר의 의미는 '그 일이 전해진다 해도'로 유지했습니다. 각주 표지도 각주가 실제로 설명하는 절에 맞추어 재배치했습니다.
  reviewer_model: gpt-5.6-terra
