base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/005.yaml
  text: Look among the nations and see[a]; be astonished, be astounded[b]. For I am doing a work in your days that you would not believe if it were told.
  footnotes:
  - marker: a
    text: Or, 'Look at the nations and see; be astonished, be astonished.' The Hebrew repeats the astonishment verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or, 'For a deed is being done in your days that you would not believe if it were recounted.'
    reason: alternative_reading
translation:
  language: ko
  text: 민족들을 바라보고 살펴보십시오. 놀라고 또 놀라십시오[a]. 내가 여러분의 시대에 어떤 일을 하고 있으니, 그 일이 전해진다 해도 여러분은 믿지 못할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들을 바라보고 살펴보십시오. 놀라십시오, 또 놀라십시오.’ 히브리어는 놀람을 뜻하는 동사를 반복하여 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분의 시대에 어떤 일이 이루어지고 있으니, 그것이 전해진다 해도 여러분은 믿지 못할 것입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ
  english_pob_choice: Look
  chosen_korean: 살펴보고 보십시오
  alternatives_korean:
  - 보십시오
  - 살펴보십시오
  lexicon: HALOT
  rationale: 복수 명령형의 주의를 환기하는 뉘앙스를 살리면서, 뒤의 동사와 중복을 피하려고 ‘살펴보고 보십시오’로 옮겼습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 여러 민족들 가운데
  alternatives_korean:
  - 열방 가운데
  - 민족들 가운데
  - 나라들 가운데
  lexicon: HALOT
  rationale: 예언 문맥에서 גּוֹיִם은 정치·민족 집단을 가리키므로, 교회적 관용어보다 ‘민족들’이 원뜻을 더 직접적으로 드러냅니다.
- source_word: וְהִתַּמְּהוּ תְּמָהוּ
  english_pob_choice: be astonished, be astounded
  chosen_korean: 놀라고, 크게 놀라십시오
  alternatives_korean:
  - 놀라고, 놀라십시오
  - 경악하고, 경악하십시오
  lexicon: HALOT
  rationale: 같은 어근의 중복으로 강한 강조를 만들므로, 한국어에서는 동일어 반복보다 자연스러운 점층 표현으로 그 강조를 살렸습니다.
- source_word: פֹעַל פֹּעֵל
  english_pob_choice: I am doing a work
  chosen_korean: 한 일을 하고 있기 때문입니다
  alternatives_korean:
  - 일을 하고 있기 때문입니다
  - 한 사역을 하고 있기 때문입니다
  lexicon: HALOT
  rationale: 명사+분사 결합의 강조를 살리되, 한국어에서는 어색한 직역을 피하고 현재 진행 중인 하나님의 행위를 자연스럽게 표현했습니다.
- source_word: לֹא תַאֲמִינוּ כִּי יְסֻפָּר
  english_pob_choice: you would not believe if it were told
  chosen_korean: 그것이 이야기된다 해도 여러분은 믿지 못할 것입니다
  alternatives_korean:
  - 그것이 전해진다 해도 여러분은 믿지 못할 것입니다
  - 말해 준다 해도 여러분은 믿지 못할 것입니다
  lexicon: HALOT
  rationale: 조건적·잠정적 뉘앙스를 담아 ‘이야기된다 해도’로 옮겼고, העתיד형의 불신 가능성을 ‘믿지 못할 것입니다’로 표현했습니다.
theological_decisions:
- issue: 주어가 생략된 ‘작업/일’의 화자
  chosen_reading: 내가 한 일을 하고 있기 때문입니다
  alternative_readings:
  - 하나님이 한 일을 하고 있기 때문입니다
  - 한 일이 일어나고 있기 때문입니다
  rationale: 문맥상 화자는 야훼이므로, 한국어에서는 직접 주어를 드러내어 선지자적 선언의 긴박함을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 복수 명령의 강한 충격을 어떻게 재현할지
  chosen_reading: 놀라고, 크게 놀라십시오
  alternative_readings:
  - 놀라고, 놀라십시오
  - 크게 놀라고 또 놀라십시오
  rationale: 히브리어의 반복은 단순 중복이 아니라 충격의 극대화이므로, 한국어에서도 강조를 분명히 드러내되 과도한 해석은 피했습니다.
  doctrine_reference: Translation philosophy §6
