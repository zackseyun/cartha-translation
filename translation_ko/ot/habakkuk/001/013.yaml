  lexicon: HALOT
  rationale: 의로운 분이 악인의 삼킴을 앞에 두고 아무 개입도 하지 않는다는 탄식을 한국어 질문형으로 자연스럽게 드러내기 위해 ‘잠잠하십니까’를 선택했습니다.
