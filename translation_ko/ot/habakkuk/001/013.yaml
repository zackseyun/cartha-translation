source:
  edition: WLC
  text: טְה֤וֹר עֵינַ֨יִם֙ מֵ/רְא֣וֹת רָ֔ע וְ/הַבִּ֥יט אֶל עָמָ֖ל לֹ֣א תוּכָ֑ל לָ֤/מָּה תַבִּיט֙ בּֽוֹגְדִ֔ים תַּחֲרִ֕ישׁ בְּ/בַלַּ֥ע רָשָׁ֖ע צַדִּ֥יק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/013.yaml
  text: Your eyes are too pure to look on evil[a], and you cannot gaze at wrongdoing[c][b]. Why then do you look on the treacherous and keep silent when the wicked swallows up one more righteous than he?
  footnotes:
  - marker: a
    text: Or 'to see evil'; the Hebrew idiom is literally 'too pure of eyes from seeing evil.'
    reason: lexical_alternative
  - marker: b
    text: Or 'misery,' 'trouble,' or 'mischief' for 'wrongdoing.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the wicked swallows up one more righteous than he'—a comparative statement, not necessarily a claim of absolute righteousness.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 눈은 악을 보기에 너무 정결하시며[a], 불의를 바라보실 수 없습니다[b]. 그런데도 어찌하여 주님은 배반을 일삼는 자들을 바라보시며, 악인이 자신보다 더 의로운 사람을 삼킬 때에도 잠잠하십니까[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악을 보는 데’; 히브리어 관용은 문자적으로 ‘악을 보는 데서 정결한 눈’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불의’는 또한 ‘고통’, ‘괴로움’, 또는 ‘해악’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘악인이 자신보다 더 의로운 사람을 삼킨다’는 비교 문장입니다. 반드시 절대적으로 의로운 사람을 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
