id: HAB.1.13
reference: Habakkuk 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: טְה֤וֹר עֵינַ֨יִם֙ מֵ/רְא֣וֹת רָ֔ע וְ/הַבִּ֥יט אֶל עָמָ֖ל לֹ֣א תוּכָ֑ל לָ֤/מָּה תַבִּיט֙ בּֽוֹגְדִ֔ים תַּחֲרִ֕ישׁ בְּ/בַלַּ֥ע רָשָׁ֖ע צַדִּ֥יק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/013.yaml
  text: Your eyes are too pure to look on evil[a], and you cannot gaze at wrongdoing[c][b]. Why then do you look on the treacherous and keep silent when the wicked swallows up one more righteous than he?
  footnotes:
  - marker: a
    text: Or 'to see evil'; the Hebrew idiom is literally 'too pure of eyes from seeing evil.'
    reason: lexical_alternative
  - marker: b
    text: Or 'misery,' 'trouble,' or 'mischief' for 'wrongdoing.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the wicked swallows up one more righteous than he'—a comparative statement, not necessarily a claim of absolute righteousness.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 눈은 악을 보기에 너무 깨끗하시며[a], 불의를 바라보실 수 없습니다[c][b]. 그런데 어찌하여 주님은 배신자들을 바라보시며, 악인이 자기보다 더 의로운 사람을 삼키는데도 잠잠하십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악을 보기에’; 히브리어 관용은 문자적으로 ‘악을 보는 데서 너무 깨끗한 눈’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘고통’, ‘재앙’, ‘해악’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘악인이 자기보다 더 의로운 사람을 삼킨다’는 비교 문장입니다. 반드시 절대적 의인을 뜻하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טְהוֹר עֵינַיִם
  english_pob_choice: Your eyes are too pure
  chosen_korean: 주님의 눈은 … 너무 깨끗하시며
  alternatives_korean:
  - 주님의 눈은 더 깨끗하시며
  - 주님은 눈이 너무 깨끗하시며
  lexicon: HALOT
  rationale: ‘pure of eyes’라는 히브리어 관용을 자연스러운 한국어로 옮기되, 비교적·관계적 뉘앙스를 살리기 위해 ‘너무 깨끗하시며’를 택했습니다.
- source_word: מֵרְאוֹת רָע / וְהַבִּיט אֶל עָמָל
  english_pob_choice: to look on evil / and you cannot gaze at wrongdoing
  chosen_korean: 악을 보기에 … 불의를 바라보실 수 없습니다
  alternatives_korean:
  - 악을 보실 수 없습니다
  - 해악을 바라보실 수 없습니다
  - 고통을 바라보실 수 없습니다
  lexicon: HALOT
  rationale: 앞의 רָע와 뒤의 עָמָל을 각각 ‘악’과 ‘불의’로 나누어, 시적 평행법과 윤리적 문맥을 함께 드러냈습니다.
- source_word: בּוֹגְדִים
  english_pob_choice: the treacherous
  chosen_korean: 배신자들
  alternatives_korean:
  - 배신하는 자들
  - 간사한 자들
  - 불성실한 자들
  lexicon: HALOT
  rationale: 관계의 배반과 신의 없음이라는 뜻을 담는 말로 ‘배신자들’이 가장 직관적이며, 문맥상 히브리어의 도덕적 규정을 잘 살립니다.
- source_word: תַּחֲרִישׁ
  english_pob_choice: keep silent
  chosen_korean: 잠잠하십니까
  alternatives_korean:
  - 침묵하십니까
  - 말없이 계십니까
  - 아무 말씀도 하지 않으십니까
  lexicon: HALOT
  rationale: 의로운 분이 악인의 삼킴을 앞에 두고 아무 개입도 하지 않는다는 탄식을 한국어 질문형으로 자연스럽게 드러내기 위해 ‘잠잠하십니까’를 선택했습니다.
- source_word: צַדִּ֥יק מִמֶּֽנּוּ
  english_pob_choice: one more righteous than he
  chosen_korean: 자기보다 더 의로운 사람
  alternatives_korean:
  - 그보다 더 의로운 한 사람
  - 자기보다 의로운 이
  - 그보다 더 의로운 자
  lexicon: HALOT
  rationale: 비교 표현 מן의 의미를 살려 절대적 무죄가 아니라 상대적 의로움을 가리키도록 옮겼습니다.
theological_decisions:
- issue: 하나님의 ‘보심’과 ‘보실 수 없음’의 긴장
  chosen_reading: 하나님의 거룩함을 말하는 첫 행과, 이어지는 항의적 질문인 ‘어찌하여’의 대조를 그대로 살려 신학적 긴장을 해소하지 않았습니다.
  alternative_readings:
  - ‘악을 아예 보지 않으신다’는 절대적 진술로 읽는 방식
  - ‘악을 용납하지 못하신다’로 의미를 풀어 쓰는 방식
  rationale: 이 구절은 하박국의 탄식문으로, 하나님을 향한 수사적 항의가 포함되어 있습니다. 따라서 본문이 허용하는 긴장—거룩하신 하나님과 현실의 악—을 번역에서 유지하는 것이 적절합니다.
  doctrine_reference: 예언서의 탄식과 수사적 질문을 해석상 평탄화하지 않음.
