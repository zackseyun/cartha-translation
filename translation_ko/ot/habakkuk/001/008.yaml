id: HAB.1.8
reference: Habakkuk 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קַלּ֨וּ מִ/נְּמֵרִ֜ים סוּסָ֗י/ו וְ/חַדּוּ֙ מִ/זְּאֵ֣בֵי עֶ֔רֶב וּ/פָ֖שׁוּ פָּֽרָשָׁ֑י/ו וּ/פָֽרָשָׁי/ו֙ מֵ/רָח֣וֹק יָבֹ֔אוּ יָעֻ֕פוּ כְּ/נֶ֖שֶׁר חָ֥שׁ לֶ/אֱכֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/008.yaml
  text: His horses are swifter than leopards and fiercer than wolves at dusk[a]. His horsemen spread out; his horsemen come from far away. They fly like an eagle hurrying to devour.
  footnotes:
  - marker: a
    text: Or 'like a vulture rushing to devour.' The Hebrew נֶשֶׁר can refer more broadly to a large carrion bird or raptor, not necessarily the modern eagle.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 말들은 표범보다 더 빠르고 해 질 녘의 늑대들보다 더 사납습니다. 그의 기병들은 퍼져 나가고, 그의 기병들은 먼 곳에서 옵니다. 그들은 먹으려고 서두르는 독수리처럼 날아갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 사체식 조류’ 또는 ‘큰 맹금’. 히브리어 נֶשֶׁר는 현대의 ‘독수리’에만 한정되지 않고, 더 넓게 큰 맹금이나 사체를 먹는 큰 새를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַלּוּ מִנְּמֵרִים סוּסָיו
  english_pob_choice: His horses are swifter than leopards
  chosen_korean: 그의 말들은 표범보다 더 빠르고
  alternatives_korean:
  - 그의 말들은 표범들보다 더 날렵하고
  - 그의 말들은 표범보다 더 민첩하고
  lexicon: WLC + HALOT
  rationale: קַלּוּ는 단순한 '가벼움'보다 속도감을 강조하므로, 비교 구문에서는 '더 빠르고'가 자연스럽고 의미를 잘 살립니다.
- source_word: וְחַדּוּ מִזְּאֵבֵי עֶרֶב
  english_pob_choice: and fiercer than wolves at dusk
  chosen_korean: 저녁의 늑대보다 더 사납습니다
  alternatives_korean:
  - 황혼의 늑대보다 더 사납습니다
  - 저녁때의 늑대보다 더 날카롭습니다
  lexicon: WLC + HALOT
  rationale: חַדּוּ의 비유적 의미는 '날카롭다'보다 맹수의 공격성을 드러내는 '사납다'가 문맥에 맞습니다. מִזְּאֵבֵי עֶרֶב은 시간 이미지를 살려 '저녁의 늑대'로 옮겼습니다.
- source_word: וּפָשׁוּ פָּרָשָׁיו / וּפָרָשָׁיו
  english_pob_choice: His horsemen spread out; his horsemen come from far away
  chosen_korean: 그의 기병들은 퍼져 나가며, 그의 기병들은 먼 곳에서 옵니다
  alternatives_korean:
  - 그의 기병들은 흩어져 나가며, 그의 기병들은 멀리서 옵니다
  - 그의 기병들은 넓게 전개되며, 그의 기병들은 먼 데서 옵니다
  lexicon: WLC + HALOT
  rationale: פָּרָשׁ는 구체적인 기마 전사/기병을 가리키므로 '기병들'이 적절합니다. וּפָשׁוּ는 군사적 전개와 확산을 함께 담아 '퍼져 나가며'로 옮겼습니다.
- source_word: יָעֻפוּ כְּנֶשֶׁר חָשׁ לֶאֱכֹל
  english_pob_choice: They fly like an eagle hurrying to devour
  chosen_korean: 그들은 먹이를 덮치려 서두르는 독수리처럼 날아갑니다
  alternatives_korean:
  - 그들은 먹이를 삼키려 서두르는 독수리처럼 날아갑니다
  - 그들은 먹이를 잡아먹으려 급히 날아갑니다
  lexicon: WLC + HALOT
  rationale: כְּנֶשֶׁר은 일반적으로 '독수리'로 옮기되, 본문이 강조하는 사냥성과 속도를 살리기 위해 '먹이를 덮치려 서두르는'으로 마무리했습니다.
theological_decisions:
- issue: 시적 비유의 폭력성과 속도감 유지
  chosen_reading: 이 구절의 전쟁 이미지와 포식자 비유를 완화하지 않고, 빠름·사나움·덮침의 어조를 그대로 살렸습니다.
  alternative_readings:
  - 보다 중립적인 군사 묘사로 약화하는 번역
  - 비유를 완곡하게 바꾸는 번역
  rationale: 예언시의 수사적 힘은 판단 선언의 위협성과 직결되므로, 독자가 본문의 긴장과 위압을 바로 느끼도록 유지하는 것이 적절합니다.
  doctrine_reference: 예언서의 심판 경고와 시적 과장
- issue: נֶשֶׁר의 동물명 선택
  chosen_reading: 본문은 मुख्य ტექ스트에서 '독수리'를 두되, 필요하면 각주로 더 넓은 대형 맹금/사체식 조류 가능성을 열어 둡니다.
  alternative_readings:
  - 매로움을 피하려 '사체새'로 본문 처리
  - 일반적인 '맹금'으로 중화
  rationale: POB의 영어 본문이 'eagle'을 유지하면서도 각주로 'vulture' 가능성을 열어 두었으므로, 한국어 본문도 자연스러운 주표현을 유지하되 과도한 단정은 피하는 편이 원문과 주석 모두에 충실합니다.
  doctrine_reference: 동물학적 어휘의 범위와 본문 비유
