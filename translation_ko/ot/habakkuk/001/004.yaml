base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/004.yaml
  text: Therefore the law grows numb, and justice never goes forth. For the wicked surrounds the righteous; therefore justice goes forth twisted.
translation:
  language: ko
  text: 그러므로 율법은 무력해지고, 정의는 결코 실현되지 않습니다. 악인이 의인을 에워싸고 있으므로, 정의가 왜곡된 채로 시행됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹרָה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: 법/토라
  rationale: 하박국 문맥에서 תּוֹרָה는 일반적 ‘법’보다 언약적 규범인 ‘율법’이 더 정확하며, POB의 the law를 자연스럽게 반영합니다.
- source_word: תָּפ֣וּג
  english_pob_choice: grows numb
  chosen_korean: 기력을 잃고
  alternatives_korean:
  - 무감각해지고
  - 마비되고
  - 힘을 잃고
  lexicon: 감각 저하/쇠약
  rationale: 법과 정의가 제대로 작동하지 못하는 상태를 한국어로 자연스럽게 나타내되, ‘늙다/느슨해지다’ 같은 약화의 뉘앙스를 살렸습니다.
- source_word: מַכְתִּ֣יר
  english_pob_choice: surrounds
  chosen_korean: 에워싸므로
  alternatives_korean:
  - 둘러싸므로
  - 관을 씌우므로
  - 둘러침으로
  lexicon: 둘러싸다
  rationale: 히브리어의 기본적 ‘둘러싸다’ 의미를 살려, 악인이 의인을 압박해 감싸는 상태를 직접적으로 표현했습니다.
- source_word: מְעֻקָּל
  english_pob_choice: twisted
  chosen_korean: 비뚤어져
  alternatives_korean:
  - 뒤틀려
  - 왜곡되어
  - 굽어져
  lexicon: 곡선/왜곡
  rationale: POB의 ‘twisted’를 직역하되, 판결과 정의가 곧지 않다는 의미를 한국어에서 선명하게 드러냅니다.
theological_decisions:
- issue: ‘정의’와 ‘율법’의 병렬 유지
  chosen_reading: 율법과 정의를 각각 따로 두어, 제도적 규범의 붕괴와 공적 공의의 붕괴를 함께 드러냈습니다.
  alternative_readings:
  - ‘법’과 ‘공의’로 완화
  - 두 용어를 하나로 합쳐 자연스럽게 처리
  rationale: 본문은 תּוֹרָה와 מִשְׁפָּט의 붕괴를 병렬로 말하므로, 한국어에서도 두 항목의 긴장을 보존해야 합니다.
  doctrine_reference: 예언서의 언약적 고발 구조
