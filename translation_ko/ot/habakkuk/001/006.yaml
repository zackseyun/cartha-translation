  - severity: medium
    issue: 각주의 위치와 내용
    rationale: 민족명 설명 각주는 해당 민족명 바로 뒤에 붙이는 것이 앵커와 주석 대상의 관계를 분명히 합니다. ‘바벨론 제국’보다 ‘신바빌로니아 제국’이 역사적으로 더 정확합니다.
