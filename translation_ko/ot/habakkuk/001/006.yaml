- from: 그런데 보십시오, 내가 갈대 사람들을 일으키고 있습니다. 그들은 쓰고도 급한 민족이며, 땅의 넓은 곳들을 가로질러 가서 자기 소유가 아닌 거처들을 차지하려 합니다.[a]
