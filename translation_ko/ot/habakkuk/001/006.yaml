  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הִנְ/נִ֤י מֵקִים֙ אֶת הַ/כַּשְׂדִּ֔ים הַ/גּ֖וֹי הַ/מַּ֣ר וְ/הַ/נִּמְהָ֑ר הַֽ/הוֹלֵךְ֙ לְ/מֶרְחֲבֵי אֶ֔רֶץ לָ/רֶ֖שֶׁת מִשְׁכָּנ֥וֹת לֹּא לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/006.yaml
  text: For behold[a], I am raising up the Chaldeans, that bitter and hasty nation[b], which marches through the broad places of the earth to seize dwelling places not its own.
  footnotes:
  - marker: a
    text: Or 'the Babylonians.' The Hebrew reads 'the Chaldeans,' the historical people associated with Neo-Babylonian power.
    reason: lexical_alternative
  - marker: b
    text: Or 'stirring up' for 'raising up.' The Hebrew can express causing a power to arise or be roused for action.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 보십시오, 내가 갈대 사람들을 일으키고 있습니다. 그들은 쓰고도 급한 민족이며, 땅의 넓은 곳들을 가로질러 가서 자기 소유가 아닌 거처들을 차지하려 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대 사람들’은 히브리어의 민족명 직역입니다. 이 역사적 집단은 바벨론 제국과 연결됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: look, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 내가 보십시오
  lexicon: HALOT
  rationale: 호소적·강조적 표현을 살리면서도 현대 한국어에서 자연스럽고 공적 문체에 맞게 옮겼습니다.
- source_word: מֵקִים
  english_pob_choice: raising up
  chosen_korean: 일으키고 있습니다
  alternatives_korean:
  - 일으키고 있습니다
  - 세우고 있습니다
  - 일으켜 세우고 있습니다
  lexicon: HALOT
  rationale: 하나님이 역사 속 세력을 등장시키신다는 능동적 행위를 살리되, 본문의 진행성을 반영해 현재진행형으로 옮겼습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대 사람들을
  alternatives_korean:
  - 갈대아 사람들을
  - 갈대아인들을
  lexicon: HALOT
  rationale: 히브리어 민족명에 대응하는 현대 표기를 택하되, 역사적 집단을 가리키는 점을 분명히 했습니다.
- source_word: הַמַּר וְהַנִּמְהָר
  english_pob_choice: that bitter and hasty nation
  chosen_korean: 쓰고도 급한 민족이며
  alternatives_korean:
  - 쓰고 급한 민족이며
  - 쓴맛 나는 듯하고 성급한 민족이며
  - 잔혹하고 성급한 민족이며
  lexicon: HALOT
  rationale: ‘bitter’의 기본어휘를 살리면서 문맥상 냉혹함을 암시하는 ‘쓰고도’로 처리했고, ‘hasty’는 성급함보다 한 단계 강한 ‘급한’으로 옮겼습니다.
- source_word: לְמֶרְחֲבֵי אֶרֶץ
  english_pob_choice: through the broad places of the earth
  chosen_korean: 땅의 넓은 곳들을 가로질러
  alternatives_korean:
  - 땅의 넓은 곳들을 가로질러
  - 땅의 넓은 지역들을 따라
  - 세상의 넓은 곳들을 지나
  lexicon: HALOT
  rationale: 직역에 가까운 ‘넓은 곳들’의 이미지를 유지하면서, 이동의 방향성을 드러내기 위해 ‘가로질러’를 사용했습니다.
- source_word: לָרֶשֶׁת מִשְׁכָּנוֹת לֹּא לֽוֹ
  english_pob_choice: to seize dwelling places not its own
  chosen_korean: 자기 소유가 아닌 거처들을 차지하려 합니다
  alternatives_korean:
  - 자기 소유가 아닌 거처들을 차지하려 합니다
  - 자기 것이 아닌 거처들을 차지하려 합니다
  - 자기에게 속하지 않은 거처들을 점유하려 합니다
  lexicon: HALOT
  rationale: ירשׁ의 정복·점유 뉘앙스를 ‘차지하다’로 살리고, ‘not its own’은 소유 귀속의 부당함이 드러나도록 풀었습니다.
theological_decisions:
- issue: 하나님이 바벨론 세력을 일으키신다는 진술
  chosen_reading: 하나님이 갈대 사람들을 역사 속에 일으켜 세우시는 주권적 행위로 옮겼습니다.
  alternative_readings:
  - 하나님이 단지 허용하신 것으로 완화할 수 있습니다.
  - ‘일으키고 있습니다’를 ‘불러올리고 있습니다’로 중화할 수 있습니다.
  rationale: 히브리어는 바벨론의 부상을 하나님의 직접적 행위로 서술하므로, 이를 약화하지 않고 그대로 드러내는 쪽을 택했습니다.
  doctrine_reference: 섭리와 주권에 대한 본문 자체의 진술
