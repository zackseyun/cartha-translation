id: HAB.1.12
reference: Habakkuk 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֧וֹא אַתָּ֣ה מִ/קֶּ֗דֶם יְהוָ֧ה אֱלֹהַ֛/י קְדֹשִׁ֖/י לֹ֣א נָמ֑וּת יְהוָה֙ לְ/מִשְׁפָּ֣ט שַׂמְתּ֔/וֹ וְ/צ֖וּר לְ/הוֹכִ֥יחַ יְסַדְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/012.yaml
  text: Are you not from of old, O Yahweh my God, my Holy One? We will not die.[a] O Yahweh, you have appointed him for judgment, and you, O Rock, have established him for reproof.
  footnotes:
  - marker: a
    text: 'Or, following an alternative reading preserved in some traditions: “You do not die.” The Hebrew Masoretic Text reads “We will not die.”'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼 나의 하나님, 나의 거룩하신 분이여, 주께서는 옛적부터 계신 분이 아니십니까? 우리는 죽지 않을 것입니다.[a] 야훼여, 주께서는 그를 심판을 위하여 세우셨고, 반석이신 분이여, 그를 책망을 위하여 세우셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 일부 전승에 따르면, “주께서는 죽지 않으십니다.” 마소라 본문은 “우리는 죽지 않을 것입니다.”라고 읽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Are you not
  chosen_korean: 「…아니십니까?」
  alternatives_korean:
  - 「…아니십니까,」
  - 「정녕 …이 아니십니까?」
  lexicon: HALOT
  rationale: 예상되는 긍정 답변을 전제하는 수사 의문문이므로, 한국어에서도 반문형으로 유지해 하박국의 호소력을 살렸습니다.
- source_word: מִקֶּדֶם
  english_pob_choice: from of old
  chosen_korean: 태초부터
  alternatives_korean:
  - 옛적부터
  - 먼 옛날부터
  lexicon: HALOT
  rationale: 단순한 과거가 아니라 매우 오래된, 원초적인 기원을 가리키므로 문맥상 가장 강한 고어적 깊이를 주는 표현을 택했습니다.
- source_word: קְדֹשִׁי
  english_pob_choice: my Holy One
  chosen_korean: 주님
  alternatives_korean:
  - 나의 거룩하신 분
  - 나의 거룩한 이
  lexicon: HALOT
  rationale: 직역하면 ‘나의 거룩하신 분’이지만, 앞선 ‘주님’ 호칭과 병렬을 이루는 하나님 호칭으로 자연스럽게 살리기 위해 한국어 본문에서는 호칭을 유지하고, 거룩함은 직전 맥락으로 보강했습니다.
- source_word: לֹא נָמוּת
  english_pob_choice: We will not die
  chosen_korean: 우리는 죽지 않을 것입니다
  alternatives_korean:
  - 우리는 죽지 않습니다
  - 당신은 죽지 않으십니다
  lexicon: HALOT
  rationale: 마소라 본문의 1인칭 복수형을 그대로 따라 공동체적 확신을 유지했습니다. 영어 POB가 보존한 대안 독법은 각주로 남겼습니다.
- source_word: לְמִשְׁפָּט
  english_pob_choice: for judgment
  chosen_korean: 심판을 위해
  alternatives_korean:
  - 판결을 위해
  - 정의를 위해
  lexicon: HALOT
  rationale: 여기서는 율법적 ‘정의’보다 하나님의 징벌적·재판적 목적이 분명하므로 ‘심판’을 택했습니다.
- source_word: צוּר
  english_pob_choice: Rock
  chosen_korean: 반석
  alternatives_korean:
  - 바위
  - 바위 같은 분
  lexicon: HALOT
  rationale: 하나님의 견고함을 나타내는 표상적 칭호이므로 한국어 성경에서 널리 쓰이는 ‘반석’을 사용했습니다.
- source_word: לְהוֹכִיחַ
  english_pob_choice: for reproof
  chosen_korean: 책망을 위해
  alternatives_korean:
  - 책선하기 위해
  - 바로잡기 위해
  - 증명하기 위해
  lexicon: HALOT
  rationale: 이 동사는 단순 교정보다 잘못을 드러내고 꾸짖는 뉘앙스가 강하므로, 문맥상 자연스러운 ‘책망’을 택했습니다.
theological_decisions:
- issue: לֹא נָמוּת의 주어와 해석
  chosen_reading: 우리는 죽지 않을 것입니다
  alternative_readings:
  - 주님은 죽지 않으십니다
  rationale: 형태론적으로 1인칭 복수형이 가장 직접적이므로, 공동체가 전멸하지 않을 것이라는 고백을 본문에 반영했습니다. 신적 영원성을 강조하는 대안 독법은 본문 각주로 보존했습니다.
  doctrine_reference: 원문 우선 원칙과 본문이 지닌 해석적 긴장 보존
