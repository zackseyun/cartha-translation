  to: 야훼 나의 하나님, 나의 거룩하신 분이여, 주께서는 옛적부터 계신 분이 아니십니까? 우리는 죽지 않을 것입니다.[a] 야훼여, 주께서는 그를 심판을 위하여 세우셨고, 반석이신 분이여, 그를 책망을 위하여 세우셨습니다.
