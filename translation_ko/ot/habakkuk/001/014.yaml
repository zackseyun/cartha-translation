base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/014.yaml
  text: You make man like the fish of the sea[a], like creeping things that have no ruler over them.
  footnotes:
  - marker: a
    text: Or 'humankind.' The Hebrew אָדָם is singular ('man') but can represent humanity collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 사람을 바다의 물고기들처럼, 다스리는 자가 없는 기는 생물처럼 만드십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류’. 히브리어 אָדָם은 단수형(‘사람’)이지만, 문맥상 인류 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲשֶׂה
  english_pob_choice: You make
  chosen_korean: 만드십니다
  alternatives_korean:
  - 만듭니다
  - 만드십니까
  lexicon: HALOT
  rationale: 2인칭으로 하나님께 직접 말하는 현재적 고발/탄식의 문맥을 살려, 한국어에서는 자연스러운 합쇼체 현재형으로 옮겼습니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  lexicon: HALOT
  rationale: 히브리어 אָדָם의 단수형이지만 문맥상 포괄적 인간을 가리키므로, 한국어에서는 성별을 과도하게 드러내지 않으면서도 일반 대표성을 살리는 ‘사람’이 적절합니다.
- source_word: כִּדְגֵי הַיָּם
  english_pob_choice: like the fish of the sea
  chosen_korean: 바다의 물고기들처럼
  alternatives_korean:
  - 바다의 물고기처럼
  - 바닷물고기처럼
  lexicon: HALOT
  rationale: 히브리어의 비유 구조를 그대로 살리되 한국어에서 더 자연스럽게 복수 뉘앙스를 드러내기 위해 ‘물고기들’로 옮겼습니다.
- source_word: כְּרֶמֶשׂ
  english_pob_choice: like creeping things
  chosen_korean: 기는 것처럼
  alternatives_korean:
  - 기어 다니는 것처럼
  - 움직이는 것들처럼
  lexicon: HALOT
  rationale: רֶמֶשׂ는 넓게는 기어 다니는 작은 생물을 가리키므로, 특정 동물을 정하지 않고 이미지의 폭을 유지하는 ‘기는 것’이 적절합니다.
- source_word: לֹא מֹשֵׁל בּוֹ
  english_pob_choice: that have no ruler over them
  chosen_korean: 다스리는 자 없는
  alternatives_korean:
  - 그들을 다스리는 자 없는
  - 주관하는 자 없는
  lexicon: HALOT
  rationale: 모셸의 분사적 성격을 살려 명사구로 처리했고, ‘다스리는 자’는 통치/지배의 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: אָדָם의 대표적·집합적 의미
  chosen_reading: 사람
  alternative_readings:
  - 인간
  - 인류
  rationale: 본문의 단수형 표현을 지우지 않으면서도 문맥상 집합적 인간성을 드러내기 위해 ‘사람’을 택했습니다. 이는 원문의 대표적 단수와 의미 범위를 함께 보존합니다.
  doctrine_reference: 'DOCTRINE.md: gender-accurate over gender-neutral; contested terms principle for אָדָם'
