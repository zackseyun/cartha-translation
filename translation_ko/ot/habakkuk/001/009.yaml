source:
  edition: WLC
  text: כֻּלֹּ/ה֙ לְ/חָמָ֣ס יָב֔וֹא מְגַמַּ֥ת פְּנֵי/הֶ֖ם קָדִ֑ימָ/ה וַ/יֶּאֱסֹ֥ף כַּ/ח֖וֹל שֶֽׁבִי׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/009.yaml
  text: All of them come for violence[a]; the set of their faces is forward[c][b], and they gather captives like sand.
  footnotes:
  - marker: a
    text: 'Or ''the intent of their faces is eastward.'' The Hebrew expression is difficult: קָדִימָה can denote ''forward'' or ''eastward,'' and מְגַמַּת may mean ''set,'' ''intent,'' or ''direction.'''
    reason: lexical_alternative
  - marker: b
    text: Hebrew has a singular verb, 'and he gathers,' treating the invading force as a collective unit.
    reason: lexical_alternative
  - marker: c
    text: Or 'gathers captivity like sand,' if שֶׁבִי is taken abstractly rather than personally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모두 폭력을 행하려고 옵니다. 그들의 얼굴은 앞으로 향해 있으며[a], 포로들을 모래처럼 모읍니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 얼굴이 향하는 방향은 동쪽입니다.’ 히브리어 표현은 어렵습니다. קָדִימָה는 ‘앞으로’ 또는 ‘동쪽으로’를 뜻할 수 있고, מְגַמַּת은 ‘정해진 방향’, ‘의도’, 또는 ‘지향’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수 동사, 곧 ‘그가 모읍니다’를 사용하여 침략군을 하나의 집단으로 다룹니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘포로 됨을 모래처럼 모읍니다.’ שֶׁבִי를 사람들인 ‘포로들’이 아니라 추상적인 ‘포로 됨’으로 이해할 경우입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחָמָס
  english_pob_choice: for violence
  chosen_korean: 폭력을 위해
  alternatives_korean:
  - 폭력 때문에
  - 폭력하려고
  - 폭력과 파괴를 위해
  lexicon: HALOT
  rationale: לְ + 명사는 목적/지향을 나타내므로, 여기서는 ‘폭력을 위해’가 원문의 간결한 목적 뉘앙스를 가장 직접적으로 살립니다.
- source_word: מְגַמַּת פְּנֵיהֶם קָדִימָה
  english_pob_choice: the set of their faces is forward
  chosen_korean: 그들의 얼굴은 앞으로 향해 있으며
  alternatives_korean:
  - 그들의 얼굴의 방향은 앞으로이며
  - 그들의 얼굴의 결심은 동쪽이며
  - 그들의 얼굴은 동쪽을 향해 있으며
  lexicon: HALOT
  rationale: 희귀 표현의 핵심은 ‘얼굴의 정해진 방향/지향’이므로, 한국어에서는 자연스럽게 ‘앞으로 향해’로 옮겨 군사적 전진 이미지를 보존했습니다.
- source_word: וַיֶּאֱסֹף כַּחוֹל שֶׁבִי
  english_pob_choice: and they gather captives like sand
  chosen_korean: 사로잡은 자들을 모으기를 모래같이 합니다
  alternatives_korean:
  - 포로들을 모래같이 모읍니다
  - 사로잡힌 자들을 모래처럼 모읍니다
  - 사로잡은 자를 모래같이 모읍니다
  lexicon: HALOT
  rationale: שֶׁבִי는 개인 ‘포로들’로도, 추상적 ‘포로 상태’로도 읽힐 수 있어, POB의 ‘captives’에 맞춰 개인적 의미를 택하되 한국어에서는 ‘사로잡은 자들’로 풀어 표현했습니다.
theological_decisions:
- issue: 단수 동사와 집단 주어의 관계
  chosen_reading: 문맥상 침략 집단 전체를 하나의 집단으로 보되, 한국어는 다수 주어에 맞춰 자연스럽게 복수 서술로 옮겼습니다.
  alternative_readings:
  - ‘그가 모읍니다’로 단수 동사를 더 직접 반영
  - ‘그들이 모읍니다’로 집단의 행동을 풀어 번역
  rationale: 히브리어는 단수 동사로 집단을 하나의 집합체처럼 다루지만, 한국어 독해의 자연스러움을 위해 본문 의미를 훼손하지 않는 범위에서 복수적 집단 동작으로 풀었습니다.
  doctrine_reference: 문법-의미 일치에 대한 번역 원칙
