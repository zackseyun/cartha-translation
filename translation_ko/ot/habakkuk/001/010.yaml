    issue: ‘그것을 빼앗습니다’가 וַיִּלְכְּדָהּ의 군사적 의미를 충분히 드러내지 못합니다.
    rationale: 동사는 앞의 여성 명사 ‘요새/견고한 곳’을 가리키며, 이 문맥에서는 단순 탈취보다 요새의 점령 또는 함락을 뜻합니다.
  - severity: low
    issue: 공성 이미지에 관한 각주 표지가 문장 끝에 놓여 있습니다.
    rationale: 각주는 ‘흙을 쌓아 올려’라는 표현을 설명하므로 해당 구절 바로 뒤에 배치하는 것이 앵커의 범위를 정확하게 합니다.
