  source_fidelity: 전반적으로 히브리어의 단수 의인화된 침략자, 왕들과 고관들에 대한 조롱, 요새를 향한 비웃음, 흙을 쌓는 공성 이미지를 충실히 옮겼습니다. 다만 לָכַד는 군사적으로 요새를 ‘사로잡다/점령하다/함락하다’라는 뜻이므로, ‘빼앗습니다’보다 ‘함락합니다’가 מִבְצָר 및 여성 단수 접미사와의 연결을 더 정확히 드러냅니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. ‘그것을 빼앗습니다’는 지시 대상과 군사적 결과가 다소 약하게 들릴 수 있으므로, ‘그 요새를 함락합니다’로 명시하면 한국어 문맥이 더 선명해집니다. 각주 표지는 설명되는 ‘흙을 쌓아 올려’ 뒤에 두는 편이 적절합니다.
  terminology: ‘조롱하다’, ‘통치자들’, ‘웃음거리’, ‘요새’는 본문의 경멸적·정치적·군사적 의미를 잘 반영합니다. ‘함락하다’는 לָכַד의 군사적 포획 의미에 가장 알맞습니다.
  issues:
