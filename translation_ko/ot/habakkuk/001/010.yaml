id: HAB.1.10
reference: Habakkuk 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הוּא֙ בַּ/מְּלָכִ֣ים יִתְקַלָּ֔ס וְ/רֹזְנִ֖ים מִשְׂחָ֣ק ל֑/וֹ ה֚וּא לְ/כָל מִבְצָ֣ר יִשְׂחָ֔ק וַ/יִּצְבֹּ֥ר עָפָ֖ר וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/010.yaml
  text: He mocks kings[a], and rulers are a laughingstock to him. He laughs at every fortress; he heaps up earth and captures it.
  footnotes:
  - marker: a
    text: Literally, 'he heaps up dust/earth'; the image is of piling up an earthen siege ramp to take a fortified place.
    reason: cultural_note
translation:
  language: ko
  text: 그는 왕들을 조롱하고, 통치자들은 그에게 웃음거리가 됩니다. 그는 모든 요새를 비웃으며, 흙을 쌓아 올려[a] 그 요새를 함락합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘흙/먼지를 쌓아 올린다’는 뜻입니다. 이는 요새를 공격하기 위해 흙을 쌓아 공성용 둑을 만드는 모습을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יִתְקַלָּס
  english_pob_choice: mocks
  chosen_korean: 조롱하며
  alternatives_korean:
  - 비웃으며
  - 조소하며
  lexicon: HALOT
  rationale: 통치자들을 향한 경멸적 조롱이라는 뉘앙스를 자연스러운 현대 한국어로 살리기 위해 ‘조롱하다’를 택했습니다.
- source_word: רֹזְנִים
  english_pob_choice: rulers
  chosen_korean: 통치자들
  alternatives_korean:
  - 군주들
  - 관리들
  lexicon: HALOT
  rationale: 높은 권세를 가진 자들을 가리키는 말이므로, 시대색이 강한 ‘군주들’보다 의미 범위가 분명한 ‘통치자들’이 적절합니다.
- source_word: מִשְׂחָק לוֹ
  english_pob_choice: are a laughingstock to him
  chosen_korean: 그에게 웃음거리가 됩니다
  alternatives_korean:
  - 그에게 조롱거리가 됩니다
  - 그에게 웃음감이 됩니다
  lexicon: HALOT
  rationale: ‘웃음거리’는 단순히 웃긴 대상이 아니라 멸시와 조롱의 대상으로 전락했다는 점을 잘 드러냅니다.
- source_word: וַיִּצְבֹּר עָפָר
  english_pob_choice: he heaps up earth
  chosen_korean: 흙을 쌓아 올리고
  alternatives_korean:
  - 흙을 쌓고
  - 흙더미를 쌓아
  lexicon: HALOT
  rationale: 직역하면 ‘흙/먼지를 쌓다’이지만, 포위 공성의 이미지를 유지하면서 한국어로는 자연스럽게 ‘쌓아 올리다’로 옮겼습니다.
theological_decisions:
- issue: 의인화된 침략자의 단수 지시
  chosen_reading: ‘그는’으로 단수 인칭을 유지해, 본문이 하나의 침략 세력을 인격화해 묘사하는 흐름을 살렸습니다.
  alternative_readings:
  - ‘그것은’으로 중성화하기
  - 복수 주어로 풀어쓰기
  rationale: 히브리어의 단수 인칭과 POB의 personified singular을 보존하는 것이 본문의 수사적 힘을 가장 잘 전달합니다.
  doctrine_reference: 본문 수사와 문법 관찰
- issue: ‘흙을 쌓아 올리고 그것을 빼앗습니다’의 공성 이미지
  chosen_reading: 주석 없이 본문은 유지하고, 포위망 구축의 구체적 용어는 본문 밖에 두었습니다.
  alternative_readings:
  - 본문에 ‘공성로’를 직접 넣기
  - ‘성벽을 무너뜨리고’로 의역하기
  rationale: 원문은 문자적 이미지인 ‘흙을 쌓다’를 사용하므로, 본문을 과도하게 해설화하지 않고 독자가 이미지를 보존하도록 했습니다.
  doctrine_reference: 번역 원칙
