id: HAB.1.3
reference: Habakkuk 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֣/מָּה תַרְאֵ֤/נִי אָ֨וֶן֙ וְ/עָמָ֣ל תַּבִּ֔יט וְ/שֹׁ֥ד וְ/חָמָ֖ס לְ/נֶגְדִּ֑/י וַ/יְהִ֧י רִ֦יב וּ/מָד֖וֹן יִשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/003.yaml
  text: Why do you make me see wrongdoing[a], and why do you look at trouble? Destruction and violence are before me; strife comes to be[c][b], and contention rises up.
  footnotes:
  - marker: a
    text: Or 'Why do you show me iniquity, and why do you behold trouble?'
    reason: lexical_alternative
  - marker: b
    text: '''Destruction'' may also be rendered ''devastation'' or ''plunder.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'strife arises, and contention is lifted up / breaks out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 주께서는 제게 악을 보게 하시며, 어찌하여 재앙을 바라보십니까? 파멸과 폭력이 제 앞에 있고, 다툼이 일어나며, 분쟁이 치솟습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왜 제게 불의를 보게 하시며, 왜 괴로움을 바라보십니까?’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘파멸’은 ‘황폐’나 ‘약탈’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘다툼이 일어나고 분쟁이 들끓습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְאֵנִי
  english_pob_choice: do you make me see
  chosen_korean: 제게 보게 하시며
  alternatives_korean:
  - 제게 보여 주시며
  - 제게 보게 하십니까
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살려, 단순한 ‘보이다’보다 하나님이 예언자로 하여금 직접 보게 하시는 강한 의미를 반영했습니다.
- source_word: אָוֶן
  english_pob_choice: wrongdoing
  chosen_korean: 악
  alternatives_korean:
  - 악행
  - 불의
  - 죄악
  lexicon: HALOT
  rationale: 본문의 도덕적·언약적 부정을 간결하게 드러내는 현대 한국어로 ‘악’을 택했습니다. 영어 POB의 ‘wrongdoing’과 대응하면서도 예언적 탄식의 폭을 유지합니다.
- source_word: וְעָמָל
  english_pob_choice: trouble
  chosen_korean: 재앙
  alternatives_korean:
  - 고통
  - 괴로움
  - 수고
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘수고’가 아니라 억압적이고 해로운 상태를 가리키므로, 시각적으로도 강한 ‘재앙’을 사용해 탄식의 긴장을 살렸습니다.
- source_word: שֹׁד וְחָמָס
  english_pob_choice: Destruction and violence
  chosen_korean: 파멸과 폭력
  alternatives_korean:
  - 멸망과 폭력
  - 파괴와 폭력
  - 파멸과 강포
  lexicon: HALOT
  rationale: 두 명사가 함께 그리는 폭력적 사회 붕괴를 한국어로 자연스럽게 묶었습니다. ‘강포’보다 현대 독자에게 투명한 ‘폭력’을 유지했습니다.
- source_word: יִשָּׂא
  english_pob_choice: rises up
  chosen_korean: 치솟습니다
  alternatives_korean:
  - 일어납니다
  - 솟아오릅니다
  - 떠오릅니다
  lexicon: HALOT
  rationale: ‘들려 올려지다’의 이미지를 살리면서, 분쟁이 점점 고조되는 상태를 현대 한국어로 가장 생생하게 전달하는 동사로 처리했습니다.
theological_decisions:
- issue: 예언자의 탄식에서 하나님께 직접 책임을 묻는 어조를 어떻게 보존할지
  chosen_reading: ‘어찌하여 주께서는… 하시며, 어찌하여… 하십니까?’로 직설적 질문을 유지했습니다.
  alternative_readings:
  - ‘왜 제게… 하십니까?’로 완화
  - ‘어찌하여 허락하십니까?’로 해석적 완화
  rationale: 히브리어 본문은 단순 관찰이 아니라 하나님께 직접 호소하며 원인을 묻는 탄식입니다. 문장을 완화하지 않고 직설적으로 옮겨, 본문이 의도하는 신학적 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §3
