  source_fidelity: 히브리어의 히필(‘제게 … 보게 하시며’), 하나님께 직접 묻는 탄식의 어조, ‘파멸과 폭력’, 그리고 다툼과 분쟁의 병행은 대체로 잘 반영되었습니다. 그러나 עָמָל은 여기서 억압적 괴로움·고통을 가리키며, 사건성·재난성이 강한 ‘재앙’은 다소 좁고 강합니다. 또한 וַיְהִי의 발생·출현의 의미에는 ‘생기며’가 자연스럽고 충실합니다.
