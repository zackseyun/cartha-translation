  terminology: ‘악’, ‘파멸’, ‘폭력’, ‘다툼’, ‘분쟁’은 문맥과 현대 표준어에 적절합니다. עָמָל은 ‘고통’으로 옮겨 악행과 그로 인한 억압적 피해를 구별합니다. 각주 c의 대안은 יִשָּׂא의 ‘들리다/일어서다’ 이미지를 지나치게 해석하지 않도록 조정했습니다.
