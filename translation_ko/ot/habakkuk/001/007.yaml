    rationale: 원문의 문법적 단수는 집합적 민족을 가리키며, 한국어에서는 ‘그 민족’ 및 ‘그들’이 문맥상 자연스럽고 명료합니다.
  - severity: medium
    issue: מִשְׁפָּט을 ‘정의’로 옮기면 도덕적으로 정당한 정의라는 인상이 강합니다.
    rationale: 이 구절은 침략 세력이 자기에게서 나오는 판결·법적 권위를 행사함을 말합니다. ‘판결’은 해당 의미를 더 직접적으로 보존합니다.
  - severity: low
    issue: 문화 주석의 ‘명예 주장들’은 שְׂאֵת의 직접적 의미가 아니며 해석을 덧붙입니다.
    rationale: ‘판결권과 위엄’이라고 하면 본문의 어휘와 자기기원적 권위라는 설명을 함께 유지할 수 있습니다.
