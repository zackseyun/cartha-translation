  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָיֹ֥ם וְ/נוֹרָ֖א ה֑וּא מִמֶּ֕/נּוּ מִשְׁפָּט֥/וֹ וּ/שְׂאֵת֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/007.yaml
  text: It is dreadful and fearsome[b][a]; its justice and its majesty proceed from itself.
  footnotes:
  - marker: a
    text: Or 'its judgment and its majesty come from itself.'
    reason: lexical_alternative
  - marker: b
    text: The sense is that this nation's standards of rule and claims to honor arise from itself, not from any authority above it.
    reason: cultural_note
translation:
  language: ko
  text: 그 민족은 두렵고 무섭습니다. 그들의 판결과 위엄은 그들 자신에게서 나옵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 정의와 위엄은 그들 자신에게서 나옵니다.’
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 이 민족의 판결권과 위엄이 어떤 상위 권위가 아니라 그들 자신에게서 나온다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אָיֹם
  english_pob_choice: dreadful
  chosen_korean: 두렵고
  alternatives_korean:
  - 끔찍하고
  - 무섭고
  - 두려운
  lexicon: HALOT
  rationale: 위협과 공포를 불러일으키는 상태를 자연스러운 현대 한국어로 살리기 위해 ‘두렵고’를 택했습니다.
- source_word: וְנוֹרָא
  english_pob_choice: fearsome
  chosen_korean: 무섭습니다
  alternatives_korean:
  - 두렵습니다
  - 위압적입니다
  - 무시무시합니다
  lexicon: HALOT
  rationale: 앞 항목과 병렬되는 형용사로서 공포의 강도를 보태므로, 과장되지 않으면서도 힘 있는 ‘무섭습니다’를 썼습니다.
- source_word: מִשְׁפָּטוֹ
  english_pob_choice: its justice
  chosen_korean: 그것의 정의
  alternatives_korean:
  - 그것의 심판
  - 그것의 판단
  - 그것의 재판
  lexicon: HALOT
  rationale: 여기서는 단순한 판결 행위보다 그 집단이 행사하는 규범적 통치·판정의 성격이 앞서므로, ‘정의’가 POB의 영어 선택과 가장 잘 맞습니다.
- source_word: וּשְׂאֵתוֹ
  english_pob_choice: its majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 권세
  - 존엄
  - 고귀함
  lexicon: HALOT
  rationale: שְׂאֵת의 ‘높아짐/들림’에서 나온 지위·권위의 뉘앙스를 반영해, 자가 기원한 권위의 품격을 드러내는 ‘위엄’으로 옮겼습니다.
- source_word: מִמֶּנּוּ
  english_pob_choice: from itself
  chosen_korean: 그것으로부터
  alternatives_korean:
  - 자기 자신으로부터
  - 그 자신에게서
  - 스스로
  lexicon: HALOT
  rationale: 원문은 출처와 기원을 말하므로, 주어진 권위와 규범이 외부가 아니라 자기 내부에서 나온다는 뜻을 간명하게 드러냈습니다.
theological_decisions:
- issue: חברה/국가의 자기기원적 권위 진술
  chosen_reading: 이 민족의 정의와 위엄이 상위 권위가 아니라 자기 자신에게서 비롯된다는 진술로 읽었습니다.
  alternative_readings:
  - 단순히 그들의 재판권과 영화가 내부에서 나온다는 읽기
  - ‘정의’를 더 약하게 ‘판단’으로 읽는 해석
  rationale: 앞뒤 문맥에서 갈대아인의 폭력성과 오만이 강조되므로, 본절은 그들의 통치 기준이 자기 정당화에 근거한다는 비판으로 옮기는 것이 자연합니다.
  doctrine_reference: 하나님의 주권과 피조물의 자기절대화에 대한 예언서적 비판
