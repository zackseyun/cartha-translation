  to: 그 민족은 두렵고 무섭습니다. 그들의 판결과 위엄은 그들 자신에게서 나옵니다.[a][b]
  rationale: 민족을 가리키는 지시어를 한국어답게 명시하고, מִשְׁפָּט의 문맥적 의미를 ‘판결’로 조정했습니다. 원문의 반복적 공포 묘사, 위엄, 그리고 권위의 자기기원이라는 표현은 유지했습니다. 각주 표지는 본문 끝에서 두 각주 모두에 연결되며, 대안 번역과 문화 설명의 기능도 보존됩니다.
