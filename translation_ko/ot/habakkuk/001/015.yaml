source:
  edition: WLC
  text: כֻּלֹּ/ה֙ בְּ/חַכָּ֣ה הֵֽעֲלָ֔ה יְגֹרֵ֣/הוּ בְ/חֶרְמ֔/וֹ וְ/יַאַסְפֵ֖/הוּ בְּ/מִכְמַרְתּ֑/וֹ עַל כֵּ֖ן יִשְׂמַ֥ח וְ/יָגִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/015.yaml
  text: He brings all of them up with a hook[a]; he drags him away with his net, and gathers him in with his dragnet[b]. Therefore he rejoices and exults.
  footnotes:
  - marker: a
    text: Or 'draws him out with his net.' The Hebrew shifts between collective and singular imagery for the captured prey.
    reason: lexical_alternative
  - marker: b
    text: 'Two different Hebrew words for fishing nets are used here: ''net'' and ''dragnet.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 갈고리로 그들 모두를 끌어올리며[a], 자기 그물로 그를 끌고 가고, 자기 투망으로 그를 모읍니다[b]. 그러므로 그는 기뻐하고 즐거워합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그물을 던져 그들 모두를 끌어올립니다’로 옮길 수도 있습니다. 히브리어는 여기서 집합적 이미지와 단수 이미지를 오가고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어에는 서로 다른 두 낚시/포획 그물 용어가 쓰였습니다: ‘그물’과 ‘투망’입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻלֹּה
  english_pob_choice: all of them
  chosen_korean: 그들 모두
  alternatives_korean:
  - 모두를
  - 그들 전부
  lexicon: HALOT
  rationale: 형태는 단수 접미사처럼 보이지만 문맥상 포획된 대상 전체를 가리키므로, 한국어에서도 집합성을 살려 ‘그들 모두’로 옮겼습니다.
- source_word: בְּחַכָּה
  english_pob_choice: with a hook
  chosen_korean: 갈고리로
  alternatives_korean:
  - 낚시갈고리로
  - 고리로
  lexicon: HALOT
  rationale: 낚시 도구의 ‘hook’ 이미지를 자연스러운 현대 한국어로 살리면서도 비유적 어조를 유지하기 위해 ‘갈고리로’로 옮겼습니다.
- source_word: יְגֹרֵהוּ ... וְיַאַסְפֵהוּ
  english_pob_choice: he drags him away ... and gathers him in
  chosen_korean: 그를 끌고 가고 … 그를 모읍니다
  alternatives_korean:
  - 그를 끌어내고 … 그를 거두어들입니다
  - 그를 잡아끌고 … 그를 모읍니다
  lexicon: HALOT
  rationale: 두 동사는 포획된 대상을 강제로 이동시키고 한데 모으는 동작을 나타내므로, 과장 없이 동작의 연속성을 살려 ‘끌고 가고 / 모읍니다’로 옮겼습니다.
- source_word: בְּחֶרְמֹו / בְּמִכְמַרְתֹּו
  english_pob_choice: with his net / with his dragnet
  chosen_korean: 자기 그물 / 자기 투망
  alternatives_korean:
  - 자기 그물 / 자기 끌그물
  - 자기 그물 / 자기 포획망
  lexicon: HALOT
  rationale: 서로 다른 두 히브리어 어휘의 구분을 살리기 위해 일반적인 ‘그물’과 더 큰 포획용의 ‘투망’을 구별해 번역했습니다.
- source_word: יִשְׂמַח ... וְיָגִיל
  english_pob_choice: he rejoices and exults
  chosen_korean: 기뻐하고 즐거워합니다
  alternatives_korean:
  - 기뻐하고 크게 기뻐합니다
  - 환호하며 즐거워합니다
  lexicon: HALOT
  rationale: 두 기쁨 표현을 동일어로 평평하게 만들지 않으면서도 현대 한국어의 자연스러운 병렬 표현으로 옮겼습니다.
theological_decisions:
- issue: 포획 대상의 집합성과 단수 전환
  chosen_reading: 첫 절반에서는 ‘그들 모두’로 집합성을 드러내고, 뒤의 단수 목적어는 ‘그를’로 유지해 히브리어의 집합→단수 전환을 반영했습니다.
  alternative_readings:
  - 전 구절을 일관되게 복수로 처리하는 읽기
  - 전 구절을 일관되게 단수로 처리하는 읽기
  rationale: 본문은 시적 이미지 안에서 포획된 대상을 집합적으로 말하다가 단수 접미사로 전환하므로, 이를 평준화하지 않고 그대로 살기는 것이 원문 구조를 더 잘 드러냅니다.
  doctrine_reference: 원문 시적 수사와 문법 관찰에 따른 번역 결정
