  - marker: a
    text: Or 'draws him out with his net.' The Hebrew shifts between collective and singular imagery for the captured prey.
    reason: lexical_alternative
  - marker: b
    text: 'Two different Hebrew words for fishing nets are used here: ''net'' and ''dragnet.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 낚시갈고리로 그들 모두를 끌어올리며[a], 그의 그물로 그를 끌어가고, 그의 끌그물로 그를 거두어들입니다[b]. 그러므로 그는 기뻐하고 환호합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 그물로 그를 끌어올립니다’로 번역할 수도 있습니다. 히브리어는 포획 대상을 집합적으로 표현하다가 단수로 전환합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에는 서로 다른 두 그물 용어가 쓰였습니다. 앞은 일반적인 ‘그물’, 뒤는 ‘끌그물’입니다.
    reason: lexical_alternative
