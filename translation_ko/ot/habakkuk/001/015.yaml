  naturalness: ‘그를 모읍니다’는 포획물을 그물 안으로 거두는 문맥에서 다소 부자연스럽습니다. ‘그를 거두어들입니다’가 자연스럽고 동작을 더 정확히 드러냅니다. 또한 ‘기뻐하고 환호합니다’는 두 히브리어 기쁨 동사의 점층을 현대 한국어로 자연스럽게 살립니다.
  terminology: חֵרֶם은 ‘그물’, מִכְמֶרֶת는 ‘끌그물’로 구별했습니다. ‘투망’은 보통 던져 사용하는 그물을 뜻하므로 여기의 dragnet/enclosing-net 이미지와 혼동될 수 있습니다. חַכָּה는 ‘낚시갈고리’로 구체화했습니다.
