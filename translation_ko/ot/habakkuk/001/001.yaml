  yaml_path: translation/ot/habakkuk/001/001.yaml
  text: The oracle that Habakkuk the prophet saw:[a]
  footnotes:
  - marker: a
    text: Or 'burden' or 'pronouncement.' Hebrew massaʾ is a prophetic heading for a weighty message.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 하박국 예언자에게 보여 주신 예언입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부담’, ‘선언’. 히브리어 massaʾ는 무거운 예언적 메시지를 가리키는 표제어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשָׂא
  english_pob_choice: the oracle
  chosen_korean: 예언
  alternatives_korean:
  - 경고
  - 선포
  - 묵시
  lexicon: HALOT
  rationale: פה prophetic superscription의 מַשָּׂא를 한국어로는 무거운 ‘부담’보다 예언서 제목으로 자연스러운 ‘예언’으로 옮겨, 장르 기능과 현대 가독성을 함께 살렸습니다.
- source_word: חָזָה
  english_pob_choice: saw
  chosen_korean: 보여 주신
  alternatives_korean:
  - 보신
  - 환상으로 보신
  - 받으신
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘보다’이지만 예언적 계시 수용을 가리키므로, 한국어에서는 계시의 수동성을 드러내는 ‘보여 주신’이 원문의 의미를 가장 자연스럽게 반영합니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자
  lexicon: HALOT
  rationale: 히브리어 נָבִיא의 직역은 ‘예언자’이며, 현대 표준어와 원어 의미를 함께 살리기 위해 교회 전통어 ‘선지자’보다 ‘예언자’를 택했습니다.
theological_decisions:
- issue: מַשָּׂא의 장르 뉘앙스
  chosen_reading: 본문은 무거운 감정의 ‘부담’이 아니라 선지자적 계시 제목입니다.
  alternative_readings:
  - 부담
  - 선언
  - 묵시
  rationale: 영어 POB가 ‘oracle’을 택한 이유와 같이, 본문은 예언의 내용 분류를 제시할 뿐 감정 상태를 말하지 않으므로 제목 기능을 살리는 번역이 필요합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve source genre and force without importing unsupported nuance.'
