id: HAB.2.12
reference: Habakkuk 2:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֛וֹי בֹּנֶ֥ה עִ֖יר בְּ/דָמִ֑ים וְ/כוֹנֵ֥ן קִרְיָ֖ה בְּ/עַוְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/012.yaml
  text: Woe to him who builds a city with bloodshed and establishes a town by injustice[a][b].
  footnotes:
  - marker: a
    text: Hebrew 'with bloods,' an idiom for bloodshed or bloodguilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'founds a city' for 'establishes a town.'
    reason: lexical_alternative
translation:
  language: ko
  text: 피 흘림으로 도시를 세우고 불의로 성읍을 견고히 세우는 자에게 화가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘피들로’입니다. 이는 피 흘림 또는 피의 죄를 뜻하는 관용적 표현입니다.
    reason: source_note
  - marker: b
    text: ‘성읍을 견고히 세우는’은 ‘성읍을 세우는’ 또는 ‘성읍을 확립하는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프도다
  - 불행하여라
  lexicon: HALOT
  rationale: 예언적 심판 선언의 강한 감탄사로서, ‘화 있을진저’가 ‘Woe’의 경고성과 단호함을 가장 잘 살립니다.
- source_word: בֹּנֶה עִיר
  english_pob_choice: who builds a city
  chosen_korean: 도시를 세우고
  alternatives_korean:
  - 성을 건축하고
  - 도시를 짓고
  lexicon: HALOT
  rationale: בֹּנֶה의 지속적·서술적 분사 의미를 살려 ‘세우다’로 옮겼고, עִיר은 현대 한국어에서 자연스러운 ‘도시’로 옮겼습니다.
- source_word: בְּדָמִים
  english_pob_choice: with bloodshed
  chosen_korean: 피로
  alternatives_korean:
  - 피 흘림으로
  - 유혈로
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘피들’의 관용적 의미인 유혈·피흘림을 반영하되, 한국어에서는 원인·수단을 간결하게 드러내는 ‘피로’가 가장 압축적입니다.
- source_word: וְכוֹנֵן קִרְיָה
  english_pob_choice: and establishes a town
  chosen_korean: 성읍을 굳게 세우는
  alternatives_korean:
  - 성읍을 세우고
  - 성을 견고히 세우는
  lexicon: HALOT
  rationale: כוֹנֵן의 ‘견고하게 세우다, 확립하다’는 뉘앙스를 살려 ‘굳게 세우다’로 옮겼고, קִרְיָה는 병행법상 ‘성읍’으로 처리했습니다.
- source_word: בְּעַוְלָה
  english_pob_choice: by injustice
  chosen_korean: 불의로
  alternatives_korean:
  - 부정으로
  - 불의 가운데
  lexicon: HALOT
  rationale: 수단을 나타내는 전치사의 값을 살리면서, עַוְלָה의 도덕적·법적 왜곡을 한국어의 표준적 표현 ‘불의’로 전달했습니다.
theological_decisions:
- issue: 예언적 저주의 어조
  chosen_reading: 도덕적 비난이 아니라 하나님 심판을 선포하는 예언적 ‘화’로 읽히도록 했습니다.
  alternative_readings:
  - 단순한 탄식으로 약화해 읽기
  rationale: הוֹי는 예언서에서 죄에 대한 심판 선언을 여는 공식이므로, ‘화 있을진저’로 강한 դատ적 어조를 유지하는 것이 본문의 의도에 부합합니다.
  doctrine_reference: 예언서의 심판 선언 형식
- issue: ‘피’와 ‘불의’의 병렬
  chosen_reading: 도시 건설의 수단 자체가 폭력과 부정의임을 드러내도록 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 사회적 비판을 완화하여 일반적 부패로 처리
  rationale: 본문은 단순한 행정적 비판이 아니라 폭력과 불의로 이루어진 국가/도시 형성에 대한 정죄이므로, 두 표현의 날카로움을 보존해야 합니다.
  doctrine_reference: 정의와 폭력에 대한 예언자적 책망
