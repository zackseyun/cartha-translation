- from: 화 있을진저, 자기 집을 위하여 불의한 이익을 얻고, 높은 곳에 자기 보금자리를 두어, 재앙의 손아귀에서 벗어나려 하는 자여.
  to: 자기 집을 위해 불의한 이익을 얻고, 높은 곳에 자기 둥지를 틀어 해악의 손에서 벗어나려 하는 자에게 화가 있습니다.
  rationale: 현대 합쇼체에 맞추어 심판 선언을 ‘화가 있습니다’로 다듬었습니다. ‘둥지’로 원문의 은유를 직접 보존하고, רָע를 ‘재앙’으로 좁히지 않고 ‘해악’으로 옮겨 원문의 의미 범위와 영어 POB의 ‘harm’을 유지했습니다.
