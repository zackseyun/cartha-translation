  text: ה֗וֹי בֹּצֵ֛עַ בֶּ֥צַע רָ֖ע לְ/בֵית֑/וֹ לָ/שׂ֤וּם בַּ/מָּרוֹם֙ קִנּ֔/וֹ לְ/הִנָּצֵ֖ל מִ/כַּף רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/009.yaml
  text: Woe to him who gains evil profit for his house, to set his nest on high, to escape from the grasp of harm.
translation:
  language: ko
  text: 자기 집을 위해 불의한 이익을 얻고, 높은 곳에 자기 둥지를 틀어 해악의 손에서 벗어나려 하는 자에게 화가 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe to
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프도다
  - 불행할진저
  lexicon: 감탄사/심판 선언
  rationale: 예언문맥의 심판적 탄식을 한국어 성경 문체에 맞게 강하게 드러내되, 현대 합쇼체 흐름을 해치지 않도록 옮겼습니다.
- source_word: בֹּצֵעַ בֶּצַע רָע
  english_pob_choice: who gains evil profit
  chosen_korean: 불의한 이익을 얻고
  alternatives_korean:
  - 악한 이익을 취하고
  - 불순한 이득을 챙기고
  lexicon: 탐욕/부정한 이익
  rationale: 직역보다 ‘부당하게 얻은 이익’이라는 의미를 살리기 위해 ‘불의한 이익’으로 옮겼습니다.
- source_word: לְבֵיתוֹ
  english_pob_choice: for his house
  chosen_korean: 자기 집을 위하여
  alternatives_korean:
  - 자기 집을 위해
  - 자기 가문을 위하여
  lexicon: 가정/가문
  rationale: 문맥상 물질적 안전과 자기 보전을 위한 공간을 가리키므로 ‘집’으로 기본 의미를 살렸습니다.
- source_word: בַּמָּרוֹם קִנּוֹ
  english_pob_choice: set his nest on high
  chosen_korean: 높은 곳에 자기 보금자리를 두어
  alternatives_korean:
  - 높은 곳에 자기 둥지를 틀어
  - 높은 곳에 자기 보금자리를 마련하여
  lexicon: 은유 표현
  rationale: ‘nest’의 새 둥지 이미지를 한국어에서 자연스럽게 전달하되, 의도적 안전 추구의 은유를 유지하기 위해 ‘보금자리’로 옮겼습니다.
- source_word: מִכַּף רָע
  english_pob_choice: from the grasp of harm
  chosen_korean: 재앙의 손아귀에서 벗어나려 하는
  alternatives_korean:
  - 해악의 손에서 벗어나려 하는
  - 재난의 손아귀에서 피하려 하는
  lexicon: 위험/해악 은유
  rationale: 영문 POB의 ‘harm’를 따라 직접적인 재난보다 더 넓은 ‘재앙’으로 옮겨, 회피하려는 자기보전의 뜻을 보존했습니다.
theological_decisions:
- issue: 심판 선언의 어조
  chosen_reading: 예언자적 ‘화 있을진저’를 앞세워, 탐욕과 자기보호를 함께 정죄하는 구조를 분명히 했습니다.
  alternative_readings:
  - 단순 경고문처럼 완화하는 번역
  - 감탄사 없이 서술문으로 처리
  rationale: 히브리어 הוֹי는 단순한 유감 표현이 아니라 심판 선언이므로, 한국어에서도 그 긴장과 선고성을 유지해야 합니다.
  doctrine_reference: 예언자적 심판 신탁
