  rationale: 수사 의문문의 긍정 기대를 ‘아니겠습니까?’로 유지하고, הִנֵּה는 ‘보십시오’로, מֵאֵת는 ‘~에게서 난 일’로 반영했습니다. 두 병행절의 낯선 목적 표현은 본문에서 보존하고 각 해당 어구 뒤에 각주를 배치했습니다. 신명과 칭호는 원문 및 영어 POB의 ‘Yahweh of hosts’에 맞추어 ‘만군의 야훼’로 바로잡았습니다.
