  source_fidelity: 원문의 수사 의문문, מֵאֵת(‘~에게서/말미암아’), 그리고 두 병행절의 ‘불’과 ‘공허’의 목적·귀결 표현을 더 직접적으로 드러내야 합니다. 초안의 ‘이런 일’은 지시 대상이 다소 모호하고, ‘지치게 되는’은 원문의 능동 주어인 나라들이 스스로 지침을 충분히 반영하지 못합니다.
