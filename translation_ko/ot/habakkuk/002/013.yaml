source:
  edition: WLC
  text: הֲ/ל֣וֹא הִנֵּ֔ה מֵ/אֵ֖ת יְהוָ֣ה צְבָא֑וֹת וְ/יִֽיגְע֤וּ עַמִּים֙ בְּ/דֵי אֵ֔שׁ וּ/לְאֻמִּ֖ים בְּ/דֵי רִ֥יק יִעָֽפוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/013.yaml
  text: Is it not indeed from Yahweh of hosts that peoples labor for fire[b][a], and nations weary themselves for emptiness?
  footnotes:
  - marker: a
    text: Or 'for the fire,' that is, for what will be consumed by fire.
    reason: lexical_alternative
  - marker: b
    text: Or 'for nothing' or 'for vanity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 민족들이 불을 위하여[a] 수고하고 나라들이 헛된 것을 위하여[b] 지치는 일이 만군의 야훼에게서 난 일이 아니겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 불을 위하여’. 곧 불에 삼켜질 것을 위하여라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아무것도 아닌 것을 위하여’ 또는 ‘헛되이’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא הִנֵּה
  english_pob_choice: Is it not indeed
  chosen_korean: 이런 일이 아니겠습니까?
  alternatives_korean:
  - 정말 그렇지 않습니까?
  - 과연 그렇지 않습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 기대된 동의를 살리면서도, 현대 한국어에서 자연스럽고 공적 문체에 맞게 압축했습니다. 'indeed'의 강조는 문맥상 '이런 일'과 의문형으로 충분히 드러납니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 여호와 만군의 주
  alternatives_korean:
  - 야훼 만군의 주
  - 만군의 여호와
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값인 '야훼'를 따를 수 있으나, 현 한국어 성경 수용성은 '여호와'가 더 넓어 본문 가독성을 고려해 이 형태를 택했습니다. 'צְבָאוֹת'은 군대보다 범위를 넓게 살리는 '만군'으로 옮겼습니다.
- source_word: בְּדֵי אֵשׁ
  english_pob_choice: for fire
  chosen_korean: 불을 위해
  alternatives_korean:
  - 불을 위하여
  - 불에 의해
  - 불의 먹이가 되도록
  lexicon: HALOT
  rationale: 히브리어 관용구의 목적/결과를 살리면서, 주석적 풀이 없이도 심판의 귀결이 불에 삼켜지는 이미지로 읽히도록 옮겼습니다.
- source_word: בְּדֵי רִיק
  english_pob_choice: for emptiness
  chosen_korean: 헛됨을 위해
  alternatives_korean:
  - 공허함을 위해
  - 아무것도 아닌 것을 위해
  - 허사로
  lexicon: HALOT
  rationale: '''רִיק''의 공허·무가치·헛됨의 의미를 현대어로 자연스럽게 전달하기 위해 ''헛됨''을 선택했습니다. ''for nothing'' 계열의 의미도 함께 포괄합니다.'
- source_word: וְיִיגְעוּ ... יִעָפוּ
  english_pob_choice: labor ... weary themselves
  chosen_korean: 수고하고 ... 지치게 되는
  alternatives_korean:
  - 애써 ... 기진하는
  - 노동하고 ... 지쳐 버리는
  lexicon: HALOT
  rationale: 동사의 반복적·지속적 뉘앙스를 유지하되, 한국어에서는 병렬 구문으로 매끄럽게 정리했습니다. '지치게 되는'은 결과적 피로와 허무를 함께 드러냅니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 본문에서는 '여호와'를 채택해 한국어 교회권의 즉시성을 살렸습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 원문은 여호와(YHWH)를 직접 사용하지만, 이 구절은 기도문이 아니라 예언적 심판 선언이므로 독자의 인지 가능성과 프로젝트 일관성 사이에서 '여호와'를 선택했습니다. 다만 주석 영역에서의 표준화가 필요하면 '야훼'로의 일관 조정이 가능합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
