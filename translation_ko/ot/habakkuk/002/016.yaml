  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׂבַ֤עְתָּ קָלוֹן֙ מִ/כָּב֔וֹד שְׁתֵ֥ה גַם אַ֖תָּה וְ/הֵֽעָרֵ֑ל תִּסּ֣וֹב עָלֶ֗י/ךָ כּ֚וֹס יְמִ֣ין יְהוָ֔ה וְ/קִיקָל֖וֹן עַל כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/016.yaml
  text: You have had your fill of shame instead of glory. Drink, you also, and show your uncircumcision! The cup from the LORD’s right hand will come around to you, and utter disgrace will be upon your glory.
translation:
  language: ko
  text: 너는 영광 대신 수치를 충분히 당했습니다. 너도 마시고, 네 할례받지 않은 모습을 드러내십시오! 야훼의 오른손의 잔이 네게 돌아올 것이며, 네 영광 위에는 극심한 수치가 있을 것입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 ‘할례받지 않은 것/상태’를 드러내는 표현입니다. 수치와 노출의 이미지를 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼의 오른손의 잔’은 심판과 보응의 상징입니다.
    reason: theological_note
lexical_decisions:
- source_word: שָׂבַעְתָּ קָלוֹן מִכָּבוֹד
  english_pob_choice: You have had your fill of shame instead of glory.
  chosen_korean: 영광 대신 수치를 충분히 당했습니다
  alternatives_korean:
  - 영광 대신 수치로 배를 채웠습니다
  - 영광 대신 수치로 가득 찼습니다
  lexicon: שָׂבַע + קָלוֹן/כָּבוֹד
  rationale: ‘가득 차다/배부르다’의 대조를 살리되, 한국어에서 자연스럽고 문맥상 비난이 분명한 표현으로 ‘충분히 당했습니다’를 택했습니다.
- source_word: הֵעָרֵל
  english_pob_choice: show your uncircumcision
  chosen_korean: 네 할례받지 않은 모습을 드러내십시오
  alternatives_korean:
  - 네 무할례를 보이십시오
  - 네 포피를 드러내십시오
  lexicon: ערל
  rationale: 직역적이지만 한국어 독자에게 의미가 분명하도록 ‘할례받지 않은 모습’으로 풀어, 수치의 노출이라는 문맥을 유지했습니다.
- source_word: כּוֹס יְמִין יְהוָה
  english_pob_choice: The cup from the LORD’s right hand
  chosen_korean: 야훼의 오른손의 잔
  alternatives_korean:
  - 야훼의 오른손에서 온 잔
  - 주님의 오른손의 잔
  lexicon: כּוֹס + יָמִין + יְהוָה
  rationale: ‘오른손의 잔’이라는 히브리어 결합을 살리되, 본문이 여호와(YHWH)를 가리키므로 POB 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: קִיקָלוֹן עַל כְּבוֹדֶךָ
  english_pob_choice: utter disgrace will be upon your glory
  chosen_korean: 네 영광 위에는 극심한 수치가 있을 것입니다
  alternatives_korean:
  - 네 영광 위에는 극도의 수치가 있을 것입니다
  - 네 영광 위에는 완전한 수치가 덮일 것입니다
  lexicon: קִיקָלוֹן + כָּבוֹד
  rationale: 영광과 대비되는 최종 심판의 강도를 살리기 위해 ‘극심한 수치’로 옮겼습니다. ‘utter disgrace’의 절정감을 한국어에서 과장 없이 드러냅니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 본문 속 신명은 학술적 전사인 ‘야훼’를 사용해 원문 식별성을 유지했습니다.
  doctrine_reference: 출 3:15; 시 83:18
- issue: ‘uncircumcision’ as shame imagery
  chosen_reading: ‘할례받지 않은 모습’으로 완곡하되 노출과 수치의 의미를 살렸습니다.
  alternative_readings:
  - 무할례
  - 포피
  rationale: 예언적 조롱의 수치 이미지를 보존하면서도 현대 한국어에서 과도하게 생경하거나 신체 중심적으로 들릴 수 있는 표현을 피했습니다.
  doctrine_reference: 합 2:16
