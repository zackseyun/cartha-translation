source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה שַׁלּ֨וֹתָ֙ גּוֹיִ֣ם רַבִּ֔ים יְשָׁלּ֖וּ/ךָ כָּל יֶ֣תֶר עַמִּ֑ים מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/008.yaml
  text: Because you have plundered many nations[a], all the remnant of the peoples will plunder you—because of human blood and violence done to the land, to the city, and to all who dwell in it.
  footnotes:
  - marker: a
    text: Or “because of human bloodshed.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그대가 많은 나라들을 약탈하였으므로, 남은 모든 민족이 그대를 약탈할 것입니다. 이는 사람의 피와 땅과 성읍과 그 안에 사는 모든 이에게 가한 폭력 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלּוֹתָ / יְשָׁלּוּךָ
  english_pob_choice: have plundered / will plunder you
  chosen_korean: 약탈하였으므로 / 약탈할 것입니다
  alternatives_korean:
  - 노략하였으므로 / 노략할 것입니다
  - 빼앗았으므로 / 빼앗을 것입니다
  lexicon: HALOT
  rationale: 동일한 동사 계열을 앞뒤에 대응시켜, 약탈자가 곧 약탈당하는 역전의 의미를 한국어에서도 분명히 드러냈습니다.
- source_word: גּוֹיִם רַבִּים
  english_pob_choice: many nations
  chosen_korean: 많은 나라들을
  alternatives_korean:
  - 많은 민족들을
  - 많은 국가들을
  lexicon: HALOT
  rationale: 국제적·정치적 대상이라는 문맥을 따라 '나라들'을 택해 현대 한국어에서 자연스럽게 옮겼습니다.
- source_word: כָּל יֶתֶר עַמִּים
  english_pob_choice: all the remnant of the peoples
  chosen_korean: 모든 민족의 남은 자가
  alternatives_korean:
  - 모든 민족의 나머지가
  - 모든 백성의 남은 자가
  lexicon: HALOT
  rationale: יֶתֶר의 '남은 것'이라는 뜻을 살리면서, 주어가 집합적 잔존자를 가리키도록 '남은 자'로 옮겼습니다.
- source_word: מִדְּמֵי אָדָם
  english_pob_choice: because of human blood
  chosen_korean: 사람의 피
  alternatives_korean:
  - 인간의 피
  - 인간의 유혈
  lexicon: HALOT
  rationale: 직역에 가까운 '사람의 피'로 히브리어의 표현을 보존하되, 문맥상 원인 표지는 앞의 '때문에'로 자연스럽게 처리했습니다.
- source_word: וַחֲמַס אֶרֶץ קִרְיָה וְכָל יֹשְׁבֵי בָהּ
  english_pob_choice: and violence done to the land, to the city, and to all who dwell in it
  chosen_korean: 땅과 성읍과 그 안에 사는 모든 자에게 행한 폭력
  alternatives_korean:
  - 땅과 성읍과 그 안의 모든 거주자에게 행한 폭력
  - 땅과 도시와 거기 사는 모든 이에게 행한 폭력
  lexicon: HALOT
  rationale: '''폭력''으로 חָמָס의 가혹하고 불의한 성격을 살리고, ''행한''을 보태 히브리어의 대상 관계를 한국어에서 분명히 했습니다.'
theological_decisions:
- issue: אָדָם의 일반 인간 지칭을 한국어로 어떻게 유지할지
  chosen_reading: 사람의 피
  alternative_readings:
  - 인간의 피
  - 인류의 피
  rationale: אָדָם은 남성만이 아니라 대표적 인간을 가리키는 일반 표현이므로, 본문 의미를 보존하면서도 현대 한국어에서 가장 직접적인 '사람'을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; contested terms on generic humanity
