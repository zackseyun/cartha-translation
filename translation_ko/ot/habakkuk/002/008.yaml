    rationale: ‘땅과 성읍과 그 안에 사는 모든 자에게 행한 폭력’도 이해되지만, ‘가한 폭력’이 대상에 대한 폭력을 나타내는 현대 한국어 결합으로 더 자연스럽습니다.
