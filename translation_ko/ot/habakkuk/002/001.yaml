  naturalness: ‘자리잡으며’는 띄어쓰기를 포함해 ‘자리 잡고’가 자연스럽고, 장면의 연속 동작에는 ‘서서 … 자리 잡고’가 더 매끄럽습니다. ‘무엇으로 대답해야 할지’도 가능하지만, 한국어 성경 문체에서는 ‘무엇이라 대답해야 할지’가 더 자연스럽습니다. 전체 문장은 현대 표준어 합쇼체로 정리했습니다.
