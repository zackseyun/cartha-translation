id: HAB.2.1
reference: Habakkuk 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל מִשְׁמַרְתִּ֣/י אֶעֱמֹ֔דָה וְ/אֶֽתְיַצְּבָ֖ה עַל מָצ֑וֹר וַ/אֲצַפֶּ֗ה לִ/רְאוֹת֙ מַה יְדַבֶּר בִּ֔/י וּ/מָ֥ה אָשִׁ֖יב עַל תּוֹכַחְתִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/001.yaml
  text: I will stand at my guard post and station myself on the rampart[a]; I will keep watch to see what he will speak in me[b], and what I should answer concerning my complaint.
  footnotes:
  - marker: a
    text: Or 'what he will speak in me,' possibly referring to inward prophetic speech.
    reason: alternative_reading
  - marker: b
    text: Or 'concerning my rebuke' or 'concerning my argument/case.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 파수대에 서고 성루 위에 자리잡으며, 그가 내게 무엇을 말씀하실지, 또 내 शिकायत에 대하여 내가 무엇으로 대답해야 할지를 보려고 지켜보겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 내 안에서 말씀하실지’로도 옮길 수 있습니다. 내적 예언적 발화를 가리킬 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내 책망에 대하여’, ‘내 논쟁/변론에 대하여’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמַרְתִּי
  english_pob_choice: my guard post
  chosen_korean: 내 파수대
  alternatives_korean:
  - 내 경계
  - 내 감시 자리
  - 내 보초 자리
  lexicon: HALOT
  rationale: 지정된 감시 위치라는 구체성을 살리면서도 한국어로 자연스럽게 들리도록 ‘파수대’를 택했습니다.
- source_word: וְאֶתְיַצְּבָה
  english_pob_choice: and station myself
  chosen_korean: 자리잡으며
  alternatives_korean:
  - 자리를 잡으며
  - 굳게 서며
  - 내 자리를 정하며
  lexicon: HALOT
  rationale: 자기 위치를 정하고 고정하는 반신적 뉘앙스를 살리되, 앞의 ‘서다’와 중복되지 않도록 ‘자리잡다’로 옮겼습니다.
- source_word: מָצוֹר
  english_pob_choice: the rampart
  chosen_korean: 성루
  alternatives_korean:
  - 성벽
  - 요새
  - 토루
  lexicon: HALOT
  rationale: 경계하며 바라보는 높은 방어 구조라는 이미지를 한국어로 가장 자연스럽게 전달하는 표현을 택했습니다.
- source_word: מַה יְדַבֶּר בִּי
  english_pob_choice: what he will speak in me
  chosen_korean: 그가 내게 무엇을 말씀하실지
  alternatives_korean:
  - 그가 내 안에서 무엇을 말씀하실지
  - 그가 내 안에 무엇을 말씀하실지
  lexicon: HALOT
  rationale: 본문의 בִּי가 문맥상 예언자에게 향한 말로 읽히는 주된 흐름을 따르되, 한국어 본문에서는 가장 분명한 ‘내게’로 옮겼습니다.
- source_word: תּוֹכַחְתִּי
  english_pob_choice: my complaint
  chosen_korean: 내 शिकायत
  alternatives_korean:
  - 내 책망
  - 내 논쟁
  - 내 변론
  - 내 호소
  lexicon: HALOT
  rationale: 본문의 תּוֹכַחַת이 책망, 논쟁, 호소, 항변의 폭을 가지므로, 여기서는 하박국의 앞선 탄식과 항변을 가리키는 말로 읽었습니다.
theological_decisions:
- issue: מַה יְדַבֶּר בִּי의 방향성
  chosen_reading: 하나님이 예언자에게 하시는 말로 이해하여 ‘내게’로 번역했습니다.
  alternative_readings:
  - 예언자 내부에서 일어나는 영감의 말씀(‘내 안에서’)
  rationale: 앞선 문맥이 야훼의 응답을 기다리는 장면이므로, 주된 의미는 대화 상대가 예언자 자신이라는 점에 있습니다. 다만 히브리어의 여지는 해석상 남아 있으므로 본문은 간명하게 옮겼습니다.
  doctrine_reference: '번역 원칙: 본문의 긴장을 지우지 않되 문맥의 우선 의미를 보존합니다.'
