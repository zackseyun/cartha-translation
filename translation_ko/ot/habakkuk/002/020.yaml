base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/020.yaml
  text: But Yahweh is in his holy temple[c][b][a]; let all the earth be silent before him.
  footnotes:
  - marker: a
    text: Or 'Yahweh' for 'the LORD.'
    reason: alternative_reading
  - marker: b
    text: Or 'keep silence' or 'hush' before him.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'all the earth'; possibly 'the whole land' in a narrower contextual sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼[a]께서는 그의 거룩한 성전에 계십니다. 온 땅[c]아, 그분 앞에서 잠잠하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼’는 본문 히브리어 יהוה를 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘잠잠하십시오’는 ‘침묵하십시오’ 또는 ‘조용히 하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘온 땅’은 문맥에 따라 ‘온 세상’으로, 또는 더 좁게 ‘온 지역’으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  english_pob_choice: But Yahweh
  chosen_korean: 그러나 야훼께서는
  alternatives_korean:
  - 그리고 야훼께서는
  - 이제 야훼께서는
  - 주님께서는
  lexicon: WLC
  rationale: 문맥상 앞선 우상 풍자와 대비되는 역접이 자연스럽고, יהוה는 이 프로젝트 기본어인 ‘야훼’로 옮겨 원문 고유명을 보존했습니다.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  english_pob_choice: is in his holy temple
  chosen_korean: 그의 거룩한 성전에 계십니다
  alternatives_korean:
  - 그의 거룩한 궁전에 계십니다
  - 그의 거룩한 성소에 계십니다
  lexicon: WLC
  rationale: הֵיכָל은 여기서 예배적·왕적 거처를 아우르지만, 한국어에서는 ‘성전’이 가장 자연스럽고 장엄한 대응이며, ‘거룩한’은 קָדְשׁוֹ의 소유격 수식을 살립니다.
- source_word: הַס מִפָּנָיו
  english_pob_choice: let all the earth be silent before him
  chosen_korean: 온 땅은 그분 앞에서 잠잠하십시오
  alternatives_korean:
  - 온 땅은 그분 앞에서 침묵하십시오
  - 온 땅은 그분 앞에서 조용하십시오
  lexicon: HALOT
  rationale: הַס는 단순한 정적이 아니라 경외의 침묵을 요구하는 명령이므로 ‘잠잠하십시오’가 가장 적절하며, מִפָּנָיו는 ‘그분 앞에서’로 자연스럽게 풀었습니다.
- source_word: כָּל הָאָרֶץ
  english_pob_choice: all the earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 전 세계
  lexicon: HALOT
  rationale: 여기서는 지역적 ‘땅’보다 보편적 범위가 강조되므로 ‘온 땅’이 원문의 포괄성을 유지합니다.
theological_decisions:
- issue: 야훼의 임재와 침묵의 명령
  chosen_reading: 야훼께서 거룩한 성전에 계시므로 온 땅은 그분 앞에서 잠잠해야 합니다.
  alternative_readings:
  - 야훼께서 하늘 성전에 계시므로 온 땅이 경배해야 합니다.
  - 야훼께서 성전에 계시니 온 땅은 두려워해야 합니다.
  rationale: 본문은 하나님의 거룩한 임재가 우상들의 무력함과 대조되며, 이에 대한 적절한 반응으로 ‘침묵’이 제시됩니다. ‘경배’나 ‘두려워해야’는 본문이 직접 말하는 반응을 넘어서므로 보류했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
