    rationale: 해석상 모호한 부분은 לְמַעַן יָרוּץ קֹרֵא בוֹ 전체이므로, 표지는 ‘새기십시오’가 아니라 목적절에 붙어야 합니다.
  - severity: low
    issue: לֻחוֹת의 복수성
    rationale: 한국어에서 단수형이 매체 일반을 가리킬 수는 있으나, 안전하게 ‘판들’로 옮기면 원문의 복수형을 보존할 수 있습니다.
