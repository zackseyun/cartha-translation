    issue: 목적절의 형식과 인용문 문체
    rationale: ‘이는 읽는 이가 달려갈 수 있게 하려는 것이다’는 히브리어의 לְמַעַן 목적절을 서술적 해설로 전환하며, 인용문 안의 명령형 ‘새겨라’도 요구된 합쇼체와 맞지 않습니다.
  - severity: low
