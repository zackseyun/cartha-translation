  to: 그러자 야훼께서 제게 대답하여 말씀하셨습니다. “그 환상을 기록하고 판들에 분명하게 새기십시오. 그것을 읽는 이가 달려갈 수 있도록 하십시오[a].”
  rationale: 개정문은 야훼의 직접 발화를 현대 합쇼체로 일관되게 유지하고, 기록을 명료하게 하라는 명령과 그 목적을 연결했습니다. ‘판들’로 원문의 복수성을 살렸으며, 논쟁적인 목적절에 각주 표지를 직접 붙여 대안적 해석을 보존했습니다.
