id: HAB.2.2
reference: Habakkuk 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲנֵ֤/נִי יְהוָה֙ וַ/יֹּ֔אמֶר כְּת֣וֹב חָז֔וֹן וּ/בָאֵ֖ר עַל הַ/לֻּח֑וֹת לְמַ֥עַן יָר֖וּץ ק֥וֹרֵא בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/002.yaml
  text: 'Then Yahweh answered me and said: “Write the vision; make it plain on tablets[a], so that one who reads it may run.”'
  footnotes:
  - marker: a
    text: Or “so that the one who reads it may run with it,” or “so that one may read it quickly/at a run.” The Hebrew phrase is compact and allows more than one plausible sense.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 야훼께서 저에게 대답하여 말씀하셨습니다. 「너는 그 환상을 기록하고, 판에 분명히 새겨라[a]. 이는 읽는 이가 달려갈 수 있게 하려는 것이다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구문은 압축적이어서 “읽는 이가 그것과 함께 달려가게 하려는 것” 또는 “읽는 이가 빨리 읽게 하려는 것”으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명 표기는 고유명사로 보존해야 하므로, 전통적 대체어인 '주님' 대신 학술적 음역 '야훼'를 사용했습니다.
- source_word: כְּתוֹב חָזוֹן
  english_pob_choice: Write the vision
  chosen_korean: 그 환상을 기록하고
  alternatives_korean:
  - 그 환상을 쓰고
  - 환상을 적어라
  lexicon: HALOT
  rationale: כתב의 기본 뜻을 살리되, 예언적 계시를 가리키는 חזון은 문맥상 '환상'이 자연스럽고, 현대 문어에서 '기록하다'가 명령형의 공적 성격을 잘 드러냅니다.
- source_word: וּבָאֵר
  english_pob_choice: make it plain
  chosen_korean: 분명히 새겨라
  alternatives_korean:
  - 분명하게 쓰라
  - 명확하게 적어라
  lexicon: HALOT
  rationale: באר의 '명료하게 하다'는 뜻을 살려 단순히 '쓰다'보다 해석적 전달을 덜어낸 표현을 택했습니다. 이어지는 '판'과의 결합을 고려해 '새기다'를 사용했습니다.
- source_word: עַל הַלֻּחוֹת
  english_pob_choice: on tablets
  chosen_korean: 판에
  alternatives_korean:
  - 돌판에
  - 판들에
  lexicon: HALOT
  rationale: לוחות는 기록용 판을 뜻하므로 '판'이 직접적입니다. 본문이 돌판을 명시하지 않으므로 '돌판'은 피했습니다.
- source_word: לְמַעַן יָרוּץ קֹרֵא בוֹ
  english_pob_choice: so that one who reads it may run
  chosen_korean: 이는 읽는 이가 달려갈 수 있게 하려는 것이다
  alternatives_korean:
  - 이는 읽는 이가 달릴 수 있게 하려는 것이다
  - 이는 읽는 이가 그것과 함께 달릴 수 있게 하려는 것이다
  - 이는 읽는 이가 빨리 읽을 수 있게 하려는 것이다
  lexicon: HALOT
  rationale: קֹרֵא בוֹ를 실질적 주어로 처리하는 가장 직접적인 읽기를 따르되, 히브리어의 압축성을 반영하여 목적절의 긴박함을 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: לְמַעַן יָרוּץ קֹרֵא בוֹ의 해석
  chosen_reading: 읽는 이가 달려갈 수 있게 하려는 목적절로 옮겼습니다.
  alternative_readings:
  - 읽는 이가 그것과 함께 달려가게 하려는 뜻
  - 읽는 이가 빨리 읽게 하려는 뜻
  rationale: 히브리어 구문은 간결하여 여러 해석이 가능하지만, 가장 직접적인 독법은 '읽는 이'를 달리는 주체로 보는 것입니다. 본문이 지닌 긴박성과 추진력을 살리면서도, 확정되지 않은 부가적 의미를 본문에 덧씌우지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
