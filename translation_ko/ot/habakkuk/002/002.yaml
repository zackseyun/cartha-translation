  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 목적절을 ‘이는 … 하려는 것이다’라는 설명문으로 바꾸어 직접 명령의 흐름과 목적 관계가 다소 약해졌고, 히브리어의 복수형 לֻחוֹת(판들)를 단수 ‘판’으로 처리했습니다.
  naturalness: ‘저에게’보다 문어적 성경 문맥에서는 ‘제게’가 더 자연스럽습니다. 또한 목표 문체인 현대 합쇼체에 맞추어 인용된 명령도 ‘기록하고 … 새기십시오’로 옮기는 것이 일관됩니다.
  terminology: ‘야훼’, ‘환상’, ‘기록하다’, ‘판들’은 적절합니다. בָּאֵר는 기록 내용을 알아보기 쉽게 하라는 뜻이므로 ‘분명하게 새기십시오’가 문맥상 수용 가능합니다.
  issues:
