id: HAB.2.15
reference: Habakkuk 2:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֚וֹי מַשְׁקֵ֣ה רֵעֵ֔/הוּ מְסַפֵּ֥חַ חֲמָתְ/ךָ֖ וְ/אַ֣ף שַׁכֵּ֑ר לְמַ֥עַן הַבִּ֖יט עַל מְעוֹרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/015.yaml
  text: Woe to him who makes his neighbor drink[a], pouring out your wrath and even making him drunk[c][b], in order to look on their nakedness.
  footnotes:
  - marker: a
    text: Or 'pouring out your venom'; the Hebrew term for 'wrath' can also carry the sense of heat or venom in context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew is difficult; some understand this clause differently, such as 'adding your bottle' or smoothing the person shift to 'his wrath.'
    reason: alternative_reading
  - marker: c
    text: Or 'their private parts'; the Hebrew refers to exposed nakedness in a shameful sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 자기 이웃에게 마시게 하며 당신의 분노[a]를 쏟아붓고[b], 심지어 그를 취하게 하여 그들의 벌거벗음[c]을 보려 하는 자에게 화가 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘분노’는 문맥에 따라 ‘독기’ 또는 ‘열기’의 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 이 구절에서 어렵습니다. 어떤 이들은 이를 ‘그의 술병을 더하다’로 이해하거나, 인칭 전환을 평탄하게 하여 ‘그의 분노’로 이해합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그들의 은밀한 곳’입니다. 히브리어는 수치스럽게 드러난 나체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프도다
  - 아, 재앙이여
  lexicon: HALOT
  rationale: 예언 문맥의 심판 선언을 가장 자연스럽고 강하게 드러내는 표준적 대응입니다.
- source_word: מַשְׁקֵה רֵעֵהוּ
  english_pob_choice: who makes his neighbor drink
  chosen_korean: 자기 이웃에게 마시게 하는 자여
  alternatives_korean:
  - 자기 이웃에게 술을 주는 자여
  - 자기 이웃을 마시게 하는 자여
  lexicon: HALOT
  rationale: 히필 분사로서 ‘마시게 하다’의 강제성을 살리면서, רֵעַ는 예언 윤리에서 흔한 ‘이웃’으로 옮겼습니다.
- source_word: חֲמָתְךָ
  english_pob_choice: your wrath
  chosen_korean: 당신의 분노를
  alternatives_korean:
  - 당신의 진노를
  - 당신의 독을
  lexicon: HALOT
  rationale: 기본 의미인 ‘분노’를 본문에 두고, 주석 가능성으로서의 ‘독/독기’ 뉘앙스는 직역을 흐리지 않기 위해 본문에 채택하지 않았습니다.
- source_word: וְאַף שַׁכֵּר
  english_pob_choice: and even making him drunk
  chosen_korean: 심지어 그를 취하게 하여
  alternatives_korean:
  - 그리고 그를 술 취하게 하여
  - 더 나아가 그를 취하게 하여
  lexicon: HALOT
  rationale: אַף의 점층성을 ‘심지어’로 살리고, שׁכר의 결과를 간결하게 표현했습니다.
- source_word: מְעוֹרֵיהֶם
  english_pob_choice: their nakedness
  chosen_korean: 그들의 벌거벗음을
  alternatives_korean:
  - 그들의 알몸을
  - 그들의 수치를
  lexicon: HALOT
  rationale: 노출된 나체라는 뜻을 직접적으로 담되, 지나치게 해부학적으로 만들지 않기 위해 ‘벌거벗음’을 택했습니다.
theological_decisions:
- issue: 사람 지시의 뒤섞임과 본문의 난해성
  chosen_reading: 본문의 인칭 전환을 평탄화하지 않고, ‘당신의 분노’라는 형태를 유지했습니다.
  alternative_readings:
  - ‘그의 분노’로 풀어 쓰기
  - ‘당신의 독한 잔’처럼 의미를 재구성하기
  rationale: 마소라 본문의 거친 인칭 전환은 의도적으로 보존할 가치가 있으며, 이를 매끄럽게 고치면 경고의 수사적 충격이 약해집니다.
  doctrine_reference: '번역 원칙 #1, #3'
- issue: 수치 노출의 목적절
  chosen_reading: ‘그들의 벌거벗음을 보려고’로 노골적 수치 이미지를 유지했습니다.
  alternative_readings:
  - ‘그들의 수치를 보려고’
  - ‘그들의 은밀한 곳을 보려고’
  rationale: 본문의 도덕적 모욕성을 흐리지 않으면서도, 추가적인 해석을 덧붙이지 않는 선에서 번역했습니다.
  doctrine_reference: '번역 원칙 #1, #6'
