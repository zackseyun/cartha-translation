  lexicon: אמונה
  rationale: 하박국 2:4의 האמונה는 단순 내적 신념보다 지속적 성실·신실함을 포함할 수 있어, POB의 선택을 따라 ‘신실함’으로 옮겼습니다.
theological_decisions:
- issue: 의인의 삶의 근거를 ‘믿음’으로 일반화할지, 원문·POB대로 ‘신실함’으로 둘지
  chosen_reading: 의인은 그의 신실함으로 살 것입니다.
  alternative_readings:
  - 의인은 그의 믿음으로 살 것입니다.
  - 의인은 믿음으로 살 것입니다.
  rationale: 이 절은 본문 자체가 의인의 지속적 신실함을 강조하는 문맥을 지니므로, 신약의 수용사와 구별하여 원문 의미를 우선해 ‘신실함’으로 유지했습니다.
  doctrine_reference: Habakkuk 2:4; Romans 1:17; Galatians 3:11; Hebrews 10:38
