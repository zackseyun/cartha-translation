  - 그의 생명
  lexicon: נפש
  rationale: 문맥상 내면의 중심을 가리키므로 ‘영혼’이 한국어 독자에게 가장 분명하며, POB의 ‘soul’ 대응을 과도하게 완화하지 않습니다.
- source_word: בֶאֱמוּנָתוֹ
