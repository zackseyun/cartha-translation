  lexicon: הִנֵּה
  rationale: 문맥상 주의를 환기하는 감탄/호명어이므로, 합쇼체에서 자연스럽고 직접적인 경고·선언의 뉘앙스를 살려 ‘보십시오’로 옮겼습니다.
- source_word: עֻפְּלָה
  english_pob_choice: his soul is puffed up
  chosen_korean: 그의 영혼은 교만하여
