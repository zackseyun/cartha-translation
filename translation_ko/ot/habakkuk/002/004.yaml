  rationale: 영혼/혼을 문자적으로 단정하기보다, 원문의 ‘부풀다/교만하다’는 상태를 한국어에서 자연스럽게 드러내는 쪽을 택했습니다.
- source_word: נַפְשׁוֹ
  english_pob_choice: his soul
  chosen_korean: 그의 영혼
  alternatives_korean:
