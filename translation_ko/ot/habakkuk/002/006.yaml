id: HAB.2.6
reference: Habakkuk 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לוֹא אֵ֣לֶּה כֻלָּ֗/ם עָלָי/ו֙ מָשָׁ֣ל יִשָּׂ֔אוּ וּ/מְלִיצָ֖ה חִיד֣וֹת ל֑/וֹ וְ/יֹאמַ֗ר ה֚וֹי הַ/מַּרְבֶּ֣ה לֹּא ל֔/וֹ עַד מָתַ֕י וּ/מַכְבִּ֥יד עָלָ֖י/ו עַבְטִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/006.yaml
  text: Will not all of these take up a taunt against him[a], with mockery and riddles about him, and say, “Woe to him who heaps up what is not his—how long?—and loads himself with pledged goods!”
  footnotes:
  - marker: a
    text: Or 'loads himself with thick clay.' The Hebrew term is rare and may carry a wordplay between debt taken in pledge and a heavy mass that burdens the one who gathers it.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 모든 자들이 그를 두고 조롱의 노래를 부르며, 그에 관한 조롱의 말과 수수께끼를 말하며 이렇게 말할 것입니다. “자기 것이 아닌 것을 쌓아 모으고—언제까지 그러겠는가?—담보물[a]을 쌓아 자신을 무겁게 하는 자에게 화가 있다!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두꺼운 진흙’. 이 히브리어 단어는 드물며, 담보물의 이미지와 모으는 자에게 무거운 짐이 되는 흙덩이의 이미지 사이의 말장난일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָשָׁל
  english_pob_choice: taunt
  chosen_korean: 조소의 노래
  alternatives_korean:
  - 비방의 노래
  - 조롱
  - 풍자 노래
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 מָשָׁל은 지혜 격언보다 적대적·조롱적 발화를 가리키므로, 대상의 멸망을 비웃는 말투를 살린 ‘조소의 노래’로 옮겼습니다.
- source_word: מְלִיצָה
  english_pob_choice: mockery
  chosen_korean: 비웃는 말
  alternatives_korean:
  - 조롱
  - 풍자
  - 빈정거림
  lexicon: HALOT
  rationale: 앞의 מָשָׁל과 병행하면서 경멸적 어조를 강화하므로, 자연스러운 현대어로 scorn을 드러내는 ‘비웃는 말’을 선택했습니다.
- source_word: חִידוֹת
  english_pob_choice: riddles
  chosen_korean: 수수께끼
  alternatives_korean:
  - 난해한 말
  - 수수께끼 같은 말
  - 비유
  lexicon: HALOT
  rationale: 의미가 직접적이지 않고 찌르는 듯한 암시성을 가진 복수형이므로, 가장 직역에 가깝고 한국어 독자에게도 분명한 ‘수수께끼’로 옮겼습니다.
- source_word: עַבְטִיט
  english_pob_choice: pledged goods
  chosen_korean: 저당잡힌 것들
  alternatives_korean:
  - 저당물
  - 담보물
  - 맡겨진 물건들
  lexicon: HALOT
  rationale: 문맥상 불의한 축적과 채무·담보의 경제적 이미지가 중심이므로, POB의 본문 선택을 따라 ‘저당잡힌 것들’로 자연화했습니다. 전통적인 ‘진흙’/‘두꺼운 진흙’ 계열 해석은 본문이 아니라 여백에서 다루는 편이 더 투명합니다.
theological_decisions:
- issue: 희귀어 עַבְטִיט의 의미 선택
  chosen_reading: 본문에서는 착취적 축적을 가리키는 경제적 이미지로 읽고, ‘저당잡힌 것들’로 번역했습니다.
  alternative_readings:
  - ‘두꺼운 진흙’
  - ‘진흙덩이’
  rationale: 이 구절의 화의는 불의하게 모은 재물과 빚의 무게에 있으므로, 본문 의미를 가장 잘 드러내는 해석을 채택했습니다. 동시에 역사적 번역 전통에 남은 ‘진흙’ 관련 해석은 단순히 제거하지 않고, 텍스트 뒤의 주해에서 검토할 수 있도록 남겨 두는 것이 바람직합니다.
  doctrine_reference: Translation philosophy §3, §5
