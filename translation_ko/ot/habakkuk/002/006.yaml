revisions:
- from: 이 모든 자들이 그에게 대해 조소의 노래를 지으며, 비웃는 말과 수수께끼를 던지며 말할 것입니다. 「화 있을진저, 자기 것이 아닌 것을 쌓아 모으는 자여 — 언제까지냐? — 그리고 저당잡힌 것들 위에 짐을 얹는 자여!」[a]
  to: 이 모든 자들이 그를 두고 조롱의 노래를 부르며, 그에 관한 조롱의 말과 수수께끼를 말하며 이렇게 말할 것입니다. “자기 것이 아닌 것을 쌓아 모으고—언제까지 그러겠는가?—담보물[a]을 쌓아 자신을 무겁게 하는 자에게 화가 있다!”
  rationale: 수정은 히브리어 원문을 우선하여 조롱 발화의 대상을 자연스럽게 표시하고, ‘짐을 무겁게 함’의 주체가 축적자 자신임을 회복했습니다. עַבְטִיט의 불확실성은 본문에서 영어 POB의 ‘담보물’ 독법을 따르되, 전통적 ‘두꺼운 진흙’ 독법을 각주에 남겨 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:45Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘그에게 대해’와 ‘저당잡힌 것들 위에 짐을 얹는’은 각각 לֹו의 대상 관계 및 וּמַכְבִּיד עָלָיו의 재귀적 부담 이미지를 충분히 반영하지 못합니다. 이를 ‘그를 두고’ 및 ‘담보물을 쌓아 자신을 무겁게 하는’으로 고쳐 히브리어의 통사와 비유를 살렸습니다.
  naturalness: ‘조소의 노래를 지으며’와 ‘수수께끼를 던지며’보다 ‘조롱의 노래를 부르며’와 ‘수수께끼를 말하며’가 현대 표준어 문맥에서 더 자연스럽습니다. ‘화 있을진저’는 고풍스러우므로 현대적이면서 예언서의 엄숙성을 유지하는 ‘화가 있다’로 바꾸었습니다.
  terminology: מָשָׁל은 ‘조롱의 노래’, מְלִיצָה와 חִידוֹת는 ‘조롱의 말과 수수께끼’로 옮겼습니다. 희귀어 עַבְטִיט은 영어 POB의 경제적 독법에 따라 ‘담보물’로 번역하고, ‘두꺼운 진흙’이라는 대안을 각주에 보존했습니다.
  issues:
  - severity: medium
    issue: ‘그에게 대해’는 한국어 결합이 부자연스럽고, לֹו가 가리키는 조롱의 대상을 충분히 자연스럽게 나타내지 못합니다.
    rationale: ‘그를 두고’는 조롱과 수수께끼가 그를 대상으로 한다는 의미를 자연스럽고 정확하게 표현합니다.
  - severity: high
    issue: ‘저당잡힌 것들 위에 짐을 얹는 자’는 짐을 담보물 ‘위에’ 놓는다는 뜻이 되어 עָלָיו의 ‘자기 자신 위에/자신에게’라는 부담 이미지를 바꿉니다.
    rationale: 문맥과 영어 POB의 독법은 탐욕스럽게 모은 담보물이 축적자 자신에게 무거운 짐이 됨을 가리킵니다. ‘담보물을 쌓아 자신을 무겁게 하는 자’가 이를 보존합니다.
  - severity: low
    issue: ‘화 있을진저’는 목표로 한 현대 합쇼체에 비해 고풍스럽습니다.
    rationale: ‘화가 있다’는 현대 표준어이면서 예언적 심판 선언의 격식을 유지합니다.
