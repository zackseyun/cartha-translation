id: HAB.2.11
reference: Habakkuk 2:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי אֶ֖בֶן מִ/קִּ֣יר תִּזְעָ֑ק וְ/כָפִ֖יס מֵ/עֵ֥ץ יַעֲנֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/011.yaml
  text: For a stone will cry out from the wall, and a beam from the woodwork will answer it.
translation:
  language: ko
  text: 이는 돌이 벽에서 부르짖을 것이요, 나무에서 나온 들보가 그것에 응답할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶבֶן
  english_pob_choice: a stone
  chosen_korean: 돌
  alternatives_korean:
  - 석재
  - 돌덩이
  lexicon: אֶבֶן
  rationale: 문맥상 건축 자재로서의 무생물 'stone'을 자연스러운 한국어 '돌'로 옮겼습니다.
- source_word: מִקִּיר
  english_pob_choice: from the wall
  chosen_korean: 벽에서
  alternatives_korean:
  - 성벽에서
  - 담에서
  lexicon: קִיר
  rationale: 히브리어 קִיר는 일반적으로 '벽'을 뜻하므로, 과도한 특정화 없이 '벽에서'로 옮겼습니다.
- source_word: כָפִיס
  english_pob_choice: a beam
  chosen_korean: 들보
  alternatives_korean:
  - 보
  - 서까래
  lexicon: כָפִיס
  rationale: English POB의 'beam'을 한국어 건축용어 '들보'로 자연스럽게 대응시켜 구조물의 하중 지지 뉘앙스를 살렸습니다.
- source_word: יַעֲנֶנָּה
  english_pob_choice: will answer it
  chosen_korean: 그것에 응답할 것입니다
  alternatives_korean:
  - 그것을 대답할 것입니다
  - 그것에게 응답할 것입니다
  lexicon: ענה
  rationale: 인격화된 응답을 유지하면서도 한국어로는 '응답하다'가 더 매끄러워 대상을 받는 형태로 옮겼습니다.
theological_decisions:
- issue: 의인화된 피조물이 건축 부정의를 증언하는 이미지
  chosen_reading: 돌과 들보가 서로를 향해 '부르짖고' '응답하는' 강한 증언 이미지로 유지했습니다.
  alternative_readings:
  - 비유적 표현을 완화하여 단순한 '울부짖다/반응하다'로 옮김
  - 해설적으로 풀어 도덕적 경고를 덧붙임
  rationale: 본문은 건축 자재가 부정한 행위를 고발하는 법정적·예언적 수사를 사용하므로, 그 강도를 약화하지 않는 번역이 적절합니다.
  doctrine_reference: 예언서의 의인화 수사와 심판 경고
