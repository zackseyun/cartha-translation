  to: 이는 벽의 돌이 부르짖고 나무 들보가 그 돌에게 응답할 것이기 때문입니다.
  rationale: 원문의 인과 관계와 돌·들보의 의인화된 상호 발화를 보존하면서, 목재를 뜻하는 표현과 현대 한국어 문장 구성을 다듬었습니다. כָפִיס의 세부 건축 용어는 논쟁의 여지가 있으나, 영어 POB의 'beam' 및 초안의 '들보'를 유지하여 불필요한 특정화를 피했습니다.
