source:
  edition: WLC
  text: כִּ֣י חֲמַ֤ס לְבָנוֹן֙ יְכַסֶּ֔/ךָּ וְ/שֹׁ֥ד בְּהֵמ֖וֹת יְחִיתַ֑/ן מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/017.yaml
  text: For the violence done to Lebanon will cover you[a], and the destruction of beasts will terrify you, because of the blood of man and the violence done to the land, to the city[b], and to all who dwell in it.
  footnotes:
  - marker: a
    text: Or 'because of human bloodshed.' The Hebrew says literally 'because of the blood of man,' with 'man' functioning representatively.
    reason: lexical_alternative
  - marker: b
    text: Or 'will overwhelm you' for 'will cover you'; the Hebrew preserves the image of being covered or engulfed.
    reason: lexical_alternative
translation:
  language: ko
  text: 레바논에 가해진 폭력이 당신을 덮을 것입니다.[a] 짐승들의 파멸이 당신을 두렵게 할 것입니다. 이는 사람의 피와 땅과 성읍과 그 안에 사는 모든 이에게 가해진 폭력 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신을 덮을 것이다’입니다. 여기서는 재앙이 뒤덮어 오는 이미지를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַס
  english_pob_choice: violence done to
  chosen_korean: 행해진 폭력
  alternatives_korean:
  - 가해진 폭력
  - 폭력 행위
  - 폭력으로 인한 해악
  lexicon: HALOT
  rationale: חָמָס는 단순한 난폭함보다 ‘가해진 폭력/불의’를 뜻하므로, 대상에 대해 가해진 행위를 드러내는 ‘행해진 폭력’으로 옮겼습니다.
- source_word: יְכַסֶּךָּ
  english_pob_choice: will cover you
  chosen_korean: 당신을 덮을 것이고
  alternatives_korean:
  - 당신을 뒤덮을 것이고
  - 당신을 엄습할 것이고
  lexicon: HALOT
  rationale: כסה의 기본 이미지는 ‘덮다’이므로, 보복이 닥쳐오는 형상을 살려 직설적으로 ‘덮을 것이다’로 유지했습니다.
- source_word: בְּהֵמֹת
  english_pob_choice: beasts
  chosen_korean: 짐승들
  alternatives_korean:
  - 짐승
  - 동물들
  - 가축들
  lexicon: HALOT
  rationale: בְּהֵמֹת은 넓게 동물들을 가리키지만, 예언문맥의 격식을 살리면서도 범위를 지나치게 좁히지 않도록 ‘짐승들’로 옮겼습니다.
- source_word: מִדְּמֵי אָדָם
  english_pob_choice: because of the blood of man
  chosen_korean: 사람의 피
  alternatives_korean:
  - 인간의 피
  - 사람의 피 흘림
  - 인류의 피
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘사람의 피’이며, 대표적·총칭적 의미를 그대로 살려 한국어에서도 가장 직접적인 표현을 택했습니다.
theological_decisions:
- issue: 피와 폭력이 재앙의 원인으로 제시되는 인과 구조
  chosen_reading: 이 구절은 심판의 이유를 단순한 역사적 불행이 아니라, 사람과 땅과 성읍에 가해진 폭력과 유혈로 제시합니다.
  alternative_readings:
  - 자연적 붕괴에 대한 묘사
  - 전쟁의 일반적 후과
  rationale: 문맥상 이 구절은 도덕적·언약적 책임을 전면에 두는 신탁이므로, 인과 관계를 약화시키지 않도록 ‘... 때문입니다’ 구조를 유지했습니다.
  doctrine_reference: Habakkuk 2:17의 심판-보응 구조
