id: HAB.2.7
reference: Habakkuk 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֣וֹא פֶ֗תַע יָק֨וּמוּ֙ נֹשְׁכֶ֔י/ךָ וְ/יִקְצ֖וּ מְזַעְזְעֶ֑י/ךָ וְ/הָיִ֥יתָ לִ/מְשִׁסּ֖וֹת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/007.yaml
  text: Will not your creditors suddenly rise[a], and those who make you tremble awake? Then you will become plunder for them.
  footnotes:
  - marker: a
    text: Hebrew literally, 'those who bite you.' The wording may intentionally echo both biting attackers and creditors exacting payment.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 채권자들이 갑자기 일어나지 않겠습니까, 그리고 너를 떨게 하는 자들이 깨어나지 않겠습니까? 그러면 네가 그들에게 노획물이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너를 무는 자들’입니다. 이 표현은 이자를 요구하는 채권자들과 공격적으로 물어뜯는 자들을 함께 떠올리게 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲל֣וֹא
  english_pob_choice: Will not
  chosen_korean: …아니겠습니까?
  alternatives_korean:
  - …않겠습니까?
  - 정녕 …하지 않겠습니까?
  lexicon: HALOT
  rationale: 반어적 예측을 담은 שאלת-부정 형식이어서, 합쇼체에서 자연스럽고 수사성을 살릴 수 있는 종결로 옮겼습니다.
- source_word: פֶ֗תַע
  english_pob_choice: suddenly
  chosen_korean: 갑자기
  alternatives_korean:
  - 순식간에
  - 별안간
  lexicon: HALOT
  rationale: 돌발성과 즉시성을 드러내는 부사로서, 문맥의 급작스러운 역전을 간결하게 전달합니다.
- source_word: נֹשְׁכֶ֔יךָ
  english_pob_choice: your creditors
  chosen_korean: 네 채권자들
  alternatives_korean:
  - 너를 무는 자들
  - 네 빚 받는 자들
  lexicon: HALOT
  rationale: POB의 해석처럼 경제적 상환을 요구하는 자들로 읽는 것이 문맥상 자연스럽고, 히브리어의 직역적 이미지(‘무는 자들’)는 아래 각주로 보존합니다.
- source_word: וְיִקְצ֖וּ
  english_pob_choice: awake
  chosen_korean: 깨어나지 않겠습니까
  alternatives_korean:
  - 일어나지 않겠습니까
  - 잠에서 깨지 않겠습니까
  lexicon: HALOT
  rationale: ‘깨어나다’는 원문의 각성 이미지와 병행 구조를 살리면서도, 앞의 ‘일어나다’와 구별되는 대응을 유지합니다.
- source_word: מְזַעְזְעֶ֑יךָ
  english_pob_choice: those who make you tremble
  chosen_korean: 너를 떨게 하는 자들
  alternatives_korean:
  - 너를 흔드는 자들
  - 너를 두렵게 하는 자들
  lexicon: HALOT
  rationale: 동사적 원인 관계를 드러내기 위해 ‘~하게 하는 자들’로 옮겼고, ‘떨다’는 신체적·정서적 동요를 함께 담습니다.
- source_word: וְהָיִיתָ לִמְשִׁסּוֹת
  english_pob_choice: Then you will become plunder
  chosen_korean: 그러면 네가 그들에게 노획물이 될 것입니다
  alternatives_korean:
  - 그러면 네가 그들의 약탈물이 될 것입니다
  - 그러면 네가 그들의 전리품이 될 것입니다
  lexicon: HALOT
  rationale: לִמְשִׁסּוֹת의 ‘빼앗겨 몫이 된 것’이라는 의미를 살리기 위해 ‘노획물’로 옮겼습니다. 무력적 역전의 이미지를 유지하면서도 법정·경제적 맥락보다 파괴적 결과를 드러냅니다.
theological_decisions:
- issue: 복수 대명사 לָמוֹ의 지시 대상
  chosen_reading: ‘그들에게’로 돌려, 약탈자들이 곧 역전의 대상이 되는 구조를 살렸습니다.
  alternative_readings:
  - ‘그것으로’처럼 비인칭적으로 처리
  - ‘그들 앞에서’처럼 장소적 의미로 완화
  rationale: 문맥상 지시 대상은 침입해 빼앗는 자들이며, 결과가 그들에게 귀속된다는 심판적 역전을 분명히 해야 합니다.
  doctrine_reference: 심판의 역전과 도덕적 보응
