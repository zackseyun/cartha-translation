base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/010.yaml
  text: You have devised shame for your house by cutting off many peoples[a], and have sinned against your own life.
  footnotes:
  - marker: a
    text: Or 'your soul' or 'yourself' for 'your own life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 많은 민족들을 끊어 버려 당신의 집에 수치를 도모하였고, 자기 생명[a]에 죄를 지었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼’ 또는 ‘자기’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָעַצְתָּ
  english_pob_choice: you have devised
  chosen_korean: 도모하였고
  alternatives_korean:
  - 계획하였고
  - 궁리하였고
  lexicon: HALOT
  rationale: יעץ의 ‘계획하다/궁리하다’보다, 심판 문맥에서 의도적으로 악을 꾸몄다는 뉘앙스를 살리기 위해 ‘도모하다’를 선택했습니다.
- source_word: בֹּשֶׁת
  english_pob_choice: shame
  chosen_korean: 수치를
  alternatives_korean:
  - 치욕을
  - 부끄러움을
  lexicon: HALOT
  rationale: 명사 בֹּשֶׁת은 개인과 집안 위에 드리워지는 공개적 수치를 가리키므로, 한국어에서도 가장 직접적인 ‘수치’로 옮겼습니다.
- source_word: קְצוֹת עַמִּים רַבִּים
  english_pob_choice: by cutting off many peoples
  chosen_korean: 많은 민족들을 끊어 버려
  alternatives_korean:
  - 많은 백성을 멸하여
  - 많은 민족들을 잘라 내어
  lexicon: HALOT
  rationale: קְצוֹת의 종결·절단 이미지를 살리면서, רבים עַמִּים의 집단적 폭력을 자연스럽게 드러내기 위해 ‘끊어 버리다’를 택했습니다.
- source_word: נַפְשֶׁךָ
  english_pob_choice: your own life
  chosen_korean: 당신 자신의 생명
  alternatives_korean:
  - 당신의 혼
  - 당신 자신
  lexicon: HALOT
  rationale: נֶפֶשׁ의 가능한 의미 가운데, 심판의 결과가 자기 파괴로 되돌아온다는 문맥에 맞게 ‘생명’을 택해 영혼론적 오해를 피했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역을 ‘생명’으로 둘지 ‘혼/자기’로 둘지
  chosen_reading: 생명
  alternative_readings:
  - 혼
  - 자기
  rationale: 이 구절은 가해가 결국 가해자 자신의 실존을 파괴한다는 점을 고발하므로, 구체적이고 심판적인 의미를 드러내는 ‘생명’이 가장 적합합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
