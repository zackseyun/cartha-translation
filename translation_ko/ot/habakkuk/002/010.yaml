  to: 당신은 많은 민족들을 끊어 버려 당신의 집에 수치를 도모하였고, 자기 생명[a]에 죄를 지었습니다.
  rationale: 원문의 ‘자기 생명/자신’을 대상으로 하는 죄의 의미를 보존하면서, 한국어에서 부자연스럽고 의미 관계를 흐리는 ‘생명에게’를 ‘생명에’로 고쳤습니다. 각주 표지를 해당 어휘 뒤로 옮기고, 각주 문구를 간결하게 정비했습니다. 그 밖의 표현은 원문의 모호성과 고발의 어조를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:38Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문의 문장 구조와 핵심 어휘를 충실히 반영합니다. 그러나 נַפְשֶׁךָ는 여기서 ‘자기 생명/자기 자신’을 향한 결과를 나타내므로, ‘생명에게’보다 ‘생명에’ 또는 ‘생명을 거슬러’가 적절합니다. ‘집’은 물리적 집과 집안·가문을 함께 포괄할 수 있으므로 그대로 유지하는 것이 안전합니다.
  naturalness: ‘당신 자신의 생명에게 죄를 지었습니다’는 한국어 결합이 어색합니다. ‘자기 생명에 죄를 지었습니다’는 원문의 대상을 보존하면서도 더 자연스럽습니다. 또한 각주 표지는 대안이 되는 ‘생명’ 바로 뒤에 두는 편이 명확합니다.
  terminology: ‘수치’, ‘도모하다’, ‘끊어 버리다’, ‘생명’은 문맥과 원문의 의미 범위에 적절합니다. 다만 예언적 고발 문맥에서 반복되는 ‘당신’은 존대 호칭이라기보다 2인칭 지시로 기능하므로, 합쇼체 문장 종결과 함께 사용해도 무방합니다.
  issues:
  - severity: medium
    issue: ‘당신 자신의 생명에게 죄를 지었습니다’의 부적절한 조사 선택
    rationale: 히브리어 חטא נַפְשֶׁךָ는 자신의 생명/자신을 향해 죄를 범한다는 뜻입니다. 한국어 ‘생명에게’는 생명을 수혜자나 사람처럼 처리하여 의미 관계와 자연스러운 용법 모두에 맞지 않습니다.
