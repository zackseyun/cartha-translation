    issue: 각주 표지의 연결 대상이 불명확함
    rationale: 각주는 נַפְשֶׁךָ의 대안적 번역에 관한 것이므로 문장 끝이 아니라 ‘생명’ 뒤에 붙여야 해당 어휘를 분명히 가리킵니다.
  revised_text: 당신은 많은 민족들을 끊어 버려 당신의 집에 수치를 도모하였고, 자기 생명[a]에 죄를 지었습니다.
