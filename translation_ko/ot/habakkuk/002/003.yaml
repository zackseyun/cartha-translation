id: HAB.2.3
reference: Habakkuk 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י ע֤וֹד חָזוֹן֙ לַ/מּוֹעֵ֔ד וְ/יָפֵ֥חַ לַ/קֵּ֖ץ וְ/לֹ֣א יְכַזֵּ֑ב אִם יִתְמַהְמָהּ֙ חַכֵּה ל֔/וֹ כִּֽי בֹ֥א יָבֹ֖א לֹ֥א יְאַחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/003.yaml
  text: For the vision is still for the appointed time[a]; it hastens toward the end and will not lie. If it delays, wait for it, for it will surely come[b]; it will not be late.
  footnotes:
  - marker: a
    text: Or 'If he delays, wait for him.' The Hebrew pronoun can be rendered personally, though in context it most naturally refers to 'the vision.' Hebrews 10:37 applies the line in a personal way.
    reason: alternative_reading
  - marker: b
    text: Or 'it pants toward the end' / 'it speaks of the end.' The Hebrew verb is difficult; the main text conveys the sense that the vision moves urgently toward its appointed fulfillment.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 환상은 아직 정해진 때를 위해 있습니다[a]. 그것은 끝을 향해 급히 나아가며 거짓말하지 않습니다. 더딜지라도 그것을 기다리십시오. 그것은 반드시 올 것이며[b], 늦지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 더디면 그를 기다리십시오.’ 히브리어 대명사는 인격적으로도 옮길 수 있지만, 문맥에서는 ‘환상’을 가장 자연스럽게 가리킵니다. 히브리서 10:37은 이 문장을 인격적으로 적용합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘끝을 향해 숨을 헐떡입니다’ / ‘끝을 말합니다.’ 히브리어 동사는 뜻이 어려우며, 본문 본문은 환상이 예정된 성취를 향해 긴급히 나아간다는 뜻을 전달합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזוֹן
  english_pob_choice: vision
  chosen_korean: 환상
  alternatives_korean:
  - 계시
  - 예언
  lexicon: HALOT
  rationale: 예언자적 ‘vision’의 표준 대응을 따르되, 문맥상 하박국이 받아 기록하고 기다릴 대상이라는 점을 살려 현대 한국어에서 자연스러운 ‘환상’으로 옮겼습니다.
- source_word: לַמּוֹעֵד
  english_pob_choice: for the appointed time
  chosen_korean: 정해진 때를 위해
  alternatives_korean:
  - 정하신 때를 위해
  - 지정된 때를 위해
  - 정해진 시기를 위해
  lexicon: HALOT
  rationale: מוֹעֵד의 ‘정해진/임명된 때’라는 의미를 살려, 하나님이 정하신 일정성을 드러내는 표현으로 번역했습니다.
- source_word: וְלֹא יְכַזֵּב
  english_pob_choice: and will not lie
  chosen_korean: 거짓말하지 않습니다
  alternatives_korean:
  - 거짓되지 않습니다
  - 허망하지 않습니다
  - 틀리지 않습니다
  lexicon: HALOT
  rationale: חזון을 인격적으로 의인화하기보다 본문 그대로 ‘거짓말하다’의 직접적 의미를 살려, 약속된 성취가 불성실하지 않음을 분명히 했습니다.
- source_word: כִּי בֹא יָבֹא
  english_pob_choice: for it will surely come
  chosen_korean: 반드시 올 것이며
  alternatives_korean:
  - 정녕 올 것이며
  - 틀림없이 올 것이며
  - 분명히 올 것이며
  lexicon: HALOT
  rationale: 히브리어의 강조구문(부정사 절대형+동사)이 표현하는 확실성을 한국어 관용에 맞게 ‘반드시’로 살렸습니다.
theological_decisions:
- issue: 대명사 ‘לוֹ/it’의 지시 대상
  chosen_reading: 문맥상 주된 지시 대상은 ‘환상’이므로 ‘그것’으로 옮겼습니다.
  alternative_readings:
  - ‘그를’로 읽어 더 인격적으로 옮길 수 있습니다.
  - 히브리서 10:37의 수용처럼 메시아적으로 읽을 수 있습니다.
  rationale: 히브리어 문맥에서는 직전 선행사가 여성명사 ‘환상’이 아니라도, 본문 흐름상 예언의 성취가 주어이므로 ‘그것’이 원문 의미를 가장 직접적으로 반영합니다. 개인화된 읽기는 후대 수용사에 중요하지만 본문 번역은 그 긴장을 보존해야 합니다.
  doctrine_reference: 원문 우선, 수용사 해석은 주석/각주로 분리해 긴장을 보존합니다.
