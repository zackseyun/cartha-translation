  text: ה֣וֹי אֹמֵ֤ר לָ/עֵץ֙ הָקִ֔יצָ/ה ע֖וּרִי לְ/אֶ֣בֶן דּוּמָ֑ם ה֣וּא יוֹרֶ֔ה הִנֵּה ה֗וּא תָּפוּשׂ֙ זָהָ֣ב וָ/כֶ֔סֶף וְ/כָל ר֖וּחַ אֵ֥ין בְּ/קִרְבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/019.yaml
  text: Woe to the one who says to wood[a], “Wake up!” and to silent stone, “Arise!” Can it teach? Look— it is overlaid with gold and silver, yet there is no breath at all within it.
  footnotes:
  - marker: a
    text: 'Or ''spirit'': the Hebrew word can mean ''breath,'' ''wind,'' or ''spirit.'' Here it emphasizes that the idol has no life within it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나무에게 “깨어나라!” 하고, 잠잠한 돌에게 “일어나라!” 하는 자에게 화가 있습니다. 그것이 가르칠 수 있겠습니까? 보십시오—그것은 금과 은으로 입혀져 있지만, 그 안에는 조금도 숨결이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 ‘영’: 히브리어 단어는 ‘숨’, ‘바람’, ‘영’을 뜻할 수 있습니다. 여기서는 우상 안에 생명이 없다는 점을 강조합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 슬프다
  - 화 있으라
  lexicon: HALOT
  rationale: 예언자적 책망과 심판 선언의 어조를 살리면서도 현대 한국어 합쇼체에 자연스럽게 들리도록 했습니다.
- source_word: לָעֵץ / לְאֶבֶן דּוּמָם
  english_pob_choice: to wood / to silent stone
  chosen_korean: 나무에게 / 잠잠한 돌에게
  alternatives_korean:
  - 나무에게 / 침묵하는 돌에게
  - 목재에게 / 소리 없는 돌에게
  lexicon: HALOT
  rationale: 우상 재료를 가리키는 물질적 뉘앙스를 살리되, ‘잠잠한’으로 돌의 무응답성을 드러내어 아이러니를 보존했습니다.
- source_word: הָקִיצָה / עוּרִי
  english_pob_choice: Wake up! / Arise!
  chosen_korean: 깨어나라! / 일어나라!
  alternatives_korean:
  - 잠에서 깨어나라! / 일어서라!
  - 깨어나시오! / 일어나시오!
  lexicon: HALOT
  rationale: 무생물 우상에게 던지는 조롱 섞인 명령형의 대구를 살리기 위해 짧고 강한 명령형으로 옮겼습니다.
- source_word: וְכָל רוּחַ אֵין בְּקִרְבּוֹ
  english_pob_choice: yet there is no breath at all within it
  chosen_korean: 그 안에는 조금도 숨결이 없습니다
  alternatives_korean:
  - 그 안에는 전혀 숨이 없습니다
  - 그 안에는 영이 조금도 없습니다
  lexicon: HALOT
  rationale: 여기서 רוּחַ는 생명을 주는 ‘숨결’로 이해하는 것이 우상 비판의 초점을 가장 분명히 드러냅니다. ‘조금도’로 전면적 부재를 강조했습니다.
theological_decisions:
- issue: רוּחַ의 의미
  chosen_reading: 숨결
  alternative_readings:
  - 영
  - 숨
  rationale: 본문은 우상의 무생명성을 대조적으로 폭로하는 문맥이므로, 비인격적 ‘숨결’이 가장 적절합니다. 이는 영적 존재론을 단정하기보다, 살아 있는 존재에게서 기대되는 생명의 결여를 강조합니다.
  doctrine_reference: 우상 무력성에 대한 예언적 조롱을 유지하고, רוּחַ의 의미 범위를 과도하게 좁히지 않습니다.
