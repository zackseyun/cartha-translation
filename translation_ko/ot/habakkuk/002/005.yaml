source:
  edition: WLC
  text: וְ/אַף֙ כִּֽי הַ/יַּ֣יִן בּוֹגֵ֔ד גֶּ֥בֶר יָהִ֖יר וְ/לֹ֣א יִנְוֶ֑ה אֲשֶׁר֩ הִרְחִ֨יב כִּ/שְׁא֜וֹל נַפְשׁ֗/וֹ וְ/ה֤וּא כַ/מָּ֨וֶת֙ וְ/לֹ֣א יִשְׂבָּ֔ע וַ/יֶּאֱסֹ֤ף אֵלָי/ו֙ כָּל הַ/גּוֹיִ֔ם וַ/יִּקְבֹּ֥ץ אֵלָ֖י/ו כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/005.yaml
  text: Moreover[a], wine betrays; an arrogant man does not remain at rest. He enlarges his appetite like Sheol, and he is like death and is never satisfied[c][b]. He gathers to himself all the nations and collects to himself all the peoples.
  footnotes:
  - marker: a
    text: Or 'wine is treacherous' or 'wine deceives.' The Hebrew is concise and somewhat difficult; some interpreters also connect the line more broadly with the proud conqueror's intoxicated arrogance.
    reason: lexical_alternative
  - marker: b
    text: Or 'does not stay at home' or 'does not abide.' The Hebrew verb is difficult; the main text reflects the sense of restless instability in context.
    reason: lexical_alternative
  - marker: c
    text: Sheol is the realm of the dead; alternatively, 'the grave.'
    reason: cultural_note
translation:
  language: ko
  text: 더구나 포도주는 간사합니다[a]. 오만한 사람은 머물러 있지 못합니다[b]. 그는 스올처럼 자기 욕망을 한없이 키우며, 죽음과 같아서 만족할 줄 모릅니다[c]. 그는 모든 나라를 자기에게로 모으고, 모든 백성을 자기에게로 끌어모읍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포도주는 배반합니다’ 또는 ‘포도주는 속입니다.’ 히브리어 표현은 간결하고 다소 어렵습니다. 일부 해석은 이 구절을 술에 취한 교만한 정복자의 태도와 더 넓게 연결하기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘집에 머물지 않습니다’ 또는 ‘거하지 않습니다.’ 히브리어 동사는 어렵습니다. 본문은 문맥상 불안정하게 머물지 못하는 모습을 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: 스올은 죽은 자들의 영역을 가리킵니다. 또는 ‘무덤’으로 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַף כִּי
  english_pob_choice: Moreover
  chosen_korean: 더구나
  alternatives_korean:
  - 또한
  - 더욱이
  - 더구나 더욱
  lexicon: HALOT
  rationale: 문맥을 이어 가는 강조적 전환이어서, 직접적 원인보다 누적·첨가의 뉘앙스를 살리는 ‘더구나’가 가장 자연스럽습니다.
- source_word: בּוֹגֵד
  english_pob_choice: betrays
  chosen_korean: 배신합니다
  alternatives_korean:
  - 간사합니다
  - 속입니다
  - 배반합니다
  lexicon: HALOT
  rationale: 인격화된 ‘포도주’의 treacherous한 작용을 현대 한국어에서 분명하고 강하게 드러내는 말로 ‘배신합니다’를 선택했습니다.
- source_word: וְלֹא יִנְוֶה
  english_pob_choice: does not remain at rest
  chosen_korean: 안식을 얻지 못합니다
  alternatives_korean:
  - 집에 머물지 않습니다
  - 머물러 있지 않습니다
  - 쉬지 못합니다
  lexicon: HALOT
  rationale: 히브리어 동사는 해석이 어렵고 ‘거처함/머묾/쉼’의 범위가 있어, 문맥의 불안정성과 탐욕을 살려 ‘안식을 얻지 못합니다’로 옮겼습니다.
- source_word: כִּשְׁאוֹל נַפְשׁוֹ
  english_pob_choice: like Sheol, his appetite
  chosen_korean: 스올처럼 자신의 욕망을 넓히고
  alternatives_korean:
  - 스올처럼 그의 영혼을 넓히고
  - 스올처럼 그의 마음을 넓히고
  - 스올처럼 그의 욕심을 넓히고
  lexicon: HALOT
  rationale: נפשׁ는 여기서 단순한 ‘영혼’보다 탐욕스러운 갈망을 가리키므로 ‘욕망’이 문맥상 더 정확합니다. ‘스올’은 원문 세계를 보존하기 위해 그대로 두었습니다.
- source_word: וְהוּא כַמָּוֶת וְלֹא יִשְׂבָּע
  english_pob_choice: and he is like death and is never satisfied
  chosen_korean: 죽음과 같아서 만족할 줄 모릅니다
  alternatives_korean:
  - 죽음과 같고 만족하지 못합니다
  - 죽음처럼 만족할 줄 모릅니다
  - 죽음과 같아서 결코 만족하지 못합니다
  lexicon: HALOT
  rationale: ‘만족할 줄 모릅니다’는 지속적·습관적 불만족을 자연스러운 한국어로 표현하며, ‘죽음’의 의인화된 탐식성을 유지합니다.
- source_word: כָּל הַגּוֹיִם / כָּל הָעַמִּים
  english_pob_choice: all the nations / all the peoples
  chosen_korean: 모든 나라 / 모든 백성
  alternatives_korean:
  - 모든 민족 / 모든 백성들
  - 모든 나라들 / 모든 민족들
  - 모든 열방 / 모든 백성
  lexicon: HALOT
  rationale: גוים과 עמים의 병렬을 살리되, 한국어에서 예언 문맥에 자연스러운 ‘나라’와 ‘백성’으로 구분해 번역했습니다.
theological_decisions:
- issue: שְׁאוֹל의 번역 보존
  chosen_reading: ‘스올’로 음역하여 원문 세계의 죽은 자의 영역 이미지를 유지했습니다.
  alternative_readings:
  - 무덤
  - 음부
