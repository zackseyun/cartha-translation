review_pass:
  verdict: revise
  source_fidelity: The draft preserves the major clauses and the imagery of Sheol and death. However, ‘안식을 얻지 못합니다’ imports a religiously colored sense of ‘rest’ that is not required by the difficult verb יִנְוֶה, whose core alternative senses concern dwelling, abiding, or remaining. ‘머물러 있지 못합니다’ is less interpretive while retaining the contextual sense of instability. The comparative construction is more faithfully and clearly represented by placing ‘스올처럼’ with the insatiable expansion of desire.
  naturalness: ‘포도주는 배신합니다’ and ‘욕망을 넓히고’ are understandable but somewhat unnatural Korean collocations. ‘포도주는 간사합니다’ preserves the Hebrew personification without adding an object, and ‘욕망을 한없이 키우며’ is idiomatic while communicating the metaphor of boundless appetite.
  terminology: ‘스올’ is appropriately retained, with a concise cultural note. ‘나라’ and ‘백성’ preserve the parallelism between גּוֹיִם and עַמִּים. The formal-polite register is consistently maintained.
  issues:
  - severity: medium
    issue: ‘안식을 얻지 못합니다’ is overly specific for וְלֹא יִנְוֶה.
    rationale: The Hebrew verb is textually and lexically difficult and may mean does not dwell, stay at home, abide, or remain. ‘안식’ can suggest spiritual or salvific rest beyond the wording. A broader rendering better preserves the ambiguity.
  - severity: low
    issue: Several Korean collocations are stiff or unnatural.
    rationale: ‘포도주는 배신합니다’ lacks a natural object in Korean, and ‘욕망을 넓히다’ is less idiomatic than describing desire as being endlessly enlarged or intensified.
  revised_text: 더구나 포도주는 간사합니다[a]. 오만한 사람은 머물러 있지 못합니다[b]. 그는 스올처럼 자기 욕망을 한없이 키우며, 죽음과 같아서 만족할 줄 모릅니다[c]. 그는 모든 나라를 자기에게로 모으고, 모든 백성을 자기에게로 끌어모읍니다.
