id: HAB.2.18
reference: Habakkuk 2:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מָֽה הוֹעִ֣יל פֶּ֗סֶל כִּ֤י פְסָל/וֹ֙ יֹֽצְר֔/וֹ מַסֵּכָ֖ה וּ/מ֣וֹרֶה שָּׁ֑קֶר כִּ֣י בָטַ֞ח יֹצֵ֤ר יִצְר/וֹ֙ עָלָ֔י/ו לַ/עֲשׂ֖וֹת אֱלִילִ֥ים אִלְּמִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/018.yaml
  text: What profit is an idol when its maker has carved it— a cast image and a teacher of lies? For the one who formed it trusts in it[d][c][b][a], making mute idols.
  footnotes:
  - marker: a
    text: Or 'a carved image'; 'idol' makes explicit that the carved object is an object of false worship.
    reason: lexical_alternative
  - marker: b
    text: Or 'a molten image.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'teacher of lies,' likely personifying the idol as something that misleads its worshipers.
    reason: lexical_alternative
  - marker: d
    text: אֱלִילִים can carry the sense 'worthless idols' or 'nothings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우상은 무슨 유익이 있습니까? 그것을 만든 자가 새긴 것이니 — 부어 만든 형상과 거짓을 가르치는 이입니다. 그것을 지은 자가 그것을 신뢰하여, 말 못 하는 우상들을 만들기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה הוֹעִיל
  english_pob_choice: What profit is
  chosen_korean: 무슨 유익이 있습니까?
  alternatives_korean:
  - 무슨 이익이 있습니까?
  - 무슨 소용이 있습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 핵심은 ‘유익/이익’의 부재이므로, 현대 한국어에서는 ‘무슨 유익이 있습니까?’가 가장 자연스럽고 간결합니다.
- source_word: פֶּסֶל
  english_pob_choice: an idol
  chosen_korean: 우상
  alternatives_korean:
  - 새긴 형상
  - 조각한 형상
  lexicon: HALOT
  rationale: 본문은 단순한 조형물이 아니라 거짓 예배의 대상인 것을 가리키므로, 의미를 분명히 하는 ‘우상’이 적절합니다.
- source_word: מַסֵּכָה
  english_pob_choice: a cast image
  chosen_korean: 부어 만든 형상
  alternatives_korean:
  - 주조한 형상
  - 불에 녹여 만든 형상
  lexicon: HALOT
  rationale: מַסֵּכָה는 주조된 형상을 가리키므로 ‘부어 만든 형상’이 전통적이면서도 오늘날 읽기에도 자연스럽습니다.
- source_word: וּמוֹרֶה שָּׁקֶר
  english_pob_choice: and a teacher of lies
  chosen_korean: 거짓을 가르치는 이
  alternatives_korean:
  - 거짓의 교사
  - 거짓말을 가르치는 자
  lexicon: HALOT
  rationale: 우상을 의인화해 ‘가르치는’ 존재로 묘사하는 풍자를 살리기 위해, 직역보다 한국어에서 살아 있는 표현으로 옮겼습니다.
- source_word: אֱלִילִים אִלְּמִים
  english_pob_choice: mute idols
  chosen_korean: 말 못 하는 우상들
  alternatives_korean:
  - 벙어리 우상들
  - 침묵하는 우상들
  lexicon: HALOT
  rationale: אִלְּמִים는 ‘말할 수 없는’ 뜻이므로, 현대어에서 오해를 줄이는 ‘말 못 하는’이 적절합니다.
theological_decisions:
- issue: 우상에 대한 풍자적 의인화
  chosen_reading: ‘거짓을 가르치는 이’는 우상이 실제로 가르친다는 뜻이 아니라, 예배자를 속이는 기능을 풍자적으로 드러낸 표현으로 유지했습니다.
  alternative_readings:
  - ‘거짓 선생’으로 평면화
  - 제작자나 거짓 선지자를 지칭하는 것으로 완화
  rationale: 히브리어 병렬 구조가 우상 자체를 풍자적으로 묘사하므로, 그 수사적 날카로움을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 우상비판의 예언자적 풍자
- issue: ‘지은 자가 그것을 신뢰하여’의 관계
  chosen_reading: 메이커가 자기 손으로 만든 것을 의지하는 역설을 살리기 위해, ‘그것을 지은 자가 그것을 신뢰하여’로 옮겼습니다.
  alternative_readings:
  - ‘그 손으로 만든 것을 신뢰하여’
  - ‘그것의 만든 것을 신뢰하여’
  rationale: 히브리어는 만든 자와 만들어진 대상의 역전을 강조하므로, 주체와 대상을 분명히 하되 과도한 해설은 넣지 않았습니다.
  doctrine_reference: 피조물에 대한 의존의 어리석음
