id: HAB.2.14
reference: Habakkuk 2:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֚י תִּמָּלֵ֣א הָ/אָ֔רֶץ לָ/דַ֖עַת אֶת כְּב֣וֹד יְהוָ֑ה כַּ/מַּ֖יִם יְכַסּ֥וּ עַל יָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/014.yaml
  text: For the earth will be filled with the knowledge of the glory of Yahweh[a], as the waters cover the sea.
  footnotes:
  - marker: a
    text: Or 'the land,' if taken in a more localized sense; here 'the earth' is preferred because the verse's scope appears universal.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 물이 바다를 덮듯이 땅이 야훼의 영광에 대한 지식으로 가득 찰 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘땅’은 문맥에 따라 특정 지역을 가리킬 수도 있습니다. 여기서는 이 비유의 보편적 범위를 반영하여 ‘땅’을 넓은 의미로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 온 땅
  - 세상
  - 땅(지역적 의미)
  lexicon: HALOT
  rationale: 문맥상 범위가 넓다는 점은 유지하되, 한국어에서는 ‘땅’이 가장 자연스럽게 ארץ의 광범위한 대상을 담습니다. 다만 ‘온 땅’처럼 범위를 더 노출하는 표현도 가능해 주석으로 보완했습니다.
- source_word: לָדַעַת אֶת כְּבוֹד יְהוָה
  english_pob_choice: with the knowledge of the glory of Yahweh
  chosen_korean: 야훼의 영광을 아는 지식
  alternatives_korean:
  - 야훼의 영광에 대한 지식
  - 야훼의 영광을 알게 됨
  - 야훼의 영광을 아는 것
  lexicon: HALOT
  rationale: לָדַעַת의 목적/내용을 한국어에서는 ‘아는 지식’으로 풀어, 단순 정보가 아니라 인식적·관계적 앎이라는 본문 힘을 살렸습니다. ‘영광’은 כָּבוֹד의 표준적인 신학 용례를 따랐습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 관례/프로젝트 기본
  rationale: 본문의 여호와 이름은 제목이 아니라 고유명사이므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 이는 본문이 말하는 하나님의 이름 자체를 드러내기 위한 선택입니다.
- source_word: כַּמַּיִם יְכַסּוּ עַל יָם
  english_pob_choice: as the waters cover the sea
  chosen_korean: 마치 물이 바다를 덮듯이
  alternatives_korean:
  - 물이 바다를 덮는 것처럼
  - 바다를 물이 덮듯이
  - 물이 바다 위를 덮듯이
  lexicon: HALOT
  rationale: 비유구조를 자연스러운 한국어로 옮기되, ‘덮다’와 ‘바다’의 이미지를 그대로 보존했습니다. 반복적·완전한 충만의 감각을 유지하는 데 초점을 두었습니다.
theological_decisions:
- issue: הָאָרֶץ의 범위
  chosen_reading: ‘땅’으로 옮기되, 문맥상 전 지구적 충만의 뜻을 유지합니다.
  alternative_readings:
  - ‘온 땅’
  - ‘세상’
  - ‘지역’으로 제한하는 번역
  rationale: 영문 POB가 지적하듯 문맥은 지역적 땅을 넘어 보편적 범위를 시사합니다. 한국어 본문은 과도한 설명 없이 ‘땅’으로 간결하게 두되, 비유의 전면성과 예언적 확장을 해치지 않도록 했습니다.
  doctrine_reference: 원어 우선 번역 원칙; 예언 본문의 보편적 종말론적 스코프 보존
