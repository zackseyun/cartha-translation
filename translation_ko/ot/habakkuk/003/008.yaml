id: HAB.3.8
reference: Habakkuk 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/בִ/נְהָרִים֙ חָרָ֣ה יְהוָ֔ה אִ֤ם בַּ/נְּהָרִים֙ אַפֶּ֔/ךָ אִם בַּ/יָּ֖ם עֶבְרָתֶ֑/ךָ כִּ֤י תִרְכַּב֙ עַל סוּסֶ֔י/ךָ מַרְכְּבֹתֶ֖י/ךָ יְשׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/008.yaml
  text: Was your anger against the rivers[a], Yahweh? Was your wrath against the rivers, or your fury against the sea, that you rode on your horses, on your chariots of salvation?
  footnotes:
  - marker: a
    text: Or 'for you rode on your horses, on your victorious chariots.' The Hebrew יְשׁוּעָה can also carry the sense of deliverance or victory in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 강가들을 향해 주님의 분노가 타오르셨습니까? 강가들을 향해 주님의 진노가, 바다를 향해 주님의 격노가 타오르셨습니까? 그러므로 주님께서는 주님의 말들을 타시고, 구원의 병거들을 타셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님께서 주님의 말을 타시고, 주님의 승리의 병거들을 타셨습니다.’ 히브리어 יְשׁוּעָה는 문맥에 따라 ‘구원’, ‘구출’, ‘승리’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/בִ/נְהָרִים
  english_pob_choice: Was your anger against the rivers
  chosen_korean: 강가들을 향해
  alternatives_korean:
  - 강들에 대하여
  - 강물들을 향해
  lexicon: HALOT
  rationale: 히브리어의 בְּ는 대상을 가리키는 전치사로, 한국어에서는 자연스럽게 ‘-을/를 향해, -에 대하여’로 옮길 수 있습니다. ‘강가들’은 복수형 이미지를 살리면서도 문맥상 물의 범람을 가리키는 시적 표현을 보존합니다.
- source_word: חָרָה / אַף / עֶבְרָה
  english_pob_choice: anger / wrath / fury
  chosen_korean: 분노 / 진노 / 격노
  alternatives_korean:
  - 노여움 / 분노 / 불타는 노여움
  - 분노 / 노여움 / 격노
  lexicon: HALOT
  rationale: 세 동의어를 모두 완전히 평준화하면 히브리어 평행법의 강도 차이가 사라집니다. 따라서 첫째는 ‘분노’, 둘째는 좀 더 직접적인 ‘진노’, 셋째는 강도가 높은 ‘격노’로 두어 시적 상승을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: HALOT
  rationale: 시편적/예언서적 시어에서는 하나님의 이름이 직접 호명되지만, 본문 흐름에서 한국어 합쇼체의 출판 가독성을 고려해 ‘주님’으로 옮겼습니다. 이는 본 단락의 명시적 신명 대체를 정본화하는 결정이 아니라, 이 절의 한국어 문장 내 호격을 자연스럽게 처리한 것입니다.
- source_word: תִרְכַּב עַל סוּסֶי/ךָ מַרְכְּבֹתֶי/ךָ
  english_pob_choice: you rode on your horses, on your chariots
  chosen_korean: 주님의 말들을 타시고, 구원의 병거들을 타셨습니다
  alternatives_korean:
  - 주님의 말 위에 타시고, 구원의 병거 위에 타셨습니다
  - 주님의 말들을 타고, 구원의 병거들을 타고 가셨습니다
  lexicon: HALOT
  rationale: רכב는 기본적으로 ‘타다/타고 달리다’의 뜻이므로, 구체적 수단을 따라 ‘말들’과 ‘병거들’을 병렬로 살렸습니다. ‘타셨습니다’는 עברו의 서술형 과거를 자연스럽게 반영합니다.
- source_word: יְשׁוּעָה
  english_pob_choice: chariots of salvation
  chosen_korean: 구원의
  alternatives_korean:
  - 구출의
  - 승리의
  lexicon: HALOT
  rationale: 영어 POB가 ‘salvation’을 택한 이유를 따라, 히브리어 יְשׁוּעָה의 더 넓은 ‘구원/구출’ 의미를 보존했습니다. ‘승리’로만 좁히면 하나님의 구원 행위라는 신학적 폭이 줄어듭니다.
theological_decisions:
- issue: 시어의 인칭과 호칭 처리
  chosen_reading: 본문의 하나님의 행위는 직접 호명과 서술을 병행하며, 한국어에서는 존칭 서술(-십니다)로 유지했습니다.
  alternative_readings:
  - 2인칭 직설의 반말형
  - 전면적으로 ‘여호와’ 표기
  rationale: 하박국 3장의 신현 찬가에서는 하나님의 능동적 개입이 시적으로 진술됩니다. 한국어 본문에서는 화자의 경외를 드러내기 위해 합쇼체를 유지하되, 텍스트 자체의 긴박한 수사적 질문은 그대로 보존했습니다.
  doctrine_reference: 'POB Korean style guideline: divine direct address in formal-polite register'
