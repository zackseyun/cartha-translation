  text: וַ/אֲנִ֖י בַּ/יהוָ֣ה אֶעְל֑וֹזָה אָגִ֖ילָה בֵּ/אלֹהֵ֥י יִשְׁעִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/018.yaml
  text: Yet I will rejoice in Yahweh[b][a]; I will exult in the God of my salvation.
  footnotes:
  - marker: a
    text: 'Hebrew: ''But/And as for me''; the opening words emphasize Habakkuk''s personal resolve in contrast to the devastation described in the previous verse.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will be glad' for 'I will exult.' The two Hebrew verbs are near-synonyms, expressing intensified joy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는[a] 야훼 안에서 기뻐하겠습니다[b]. 나의 구원의 하나님 안에서 즐거워하겠습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그리고/그러나 나는’은 독립 인칭대명사를 사용하여 화자 자신을 강조하며, 앞 문맥과의 대조를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 두 동사(אֶעְלֹוזָה, אָגִילָה)는 뜻이 가까운 동의 반복으로, 기쁨을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: Yet I
  chosen_korean: 비록 …일지라도, 나는
