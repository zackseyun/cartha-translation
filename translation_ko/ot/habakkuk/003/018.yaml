  source_fidelity: 원문 하박국 3:18은 ‘그러나/그리고 나는’으로 시작하여 야훼 안에서 기뻐하고 자신의 구원의 하나님 안에서 즐거워한다는 두 절만 포함합니다. 현 초안은 3:17의 재난 목록 전체를 부당하게 포함하므로, 지정 절의 범위를 크게 벗어납니다. 또한 וַאֲנִי의 대조는 ‘그러나 나는’으로 직접 반영하는 것이 안전합니다.
