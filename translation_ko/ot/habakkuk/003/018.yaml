  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. אֱלֹהֵי יִשְׁעִי는 소유 관계와 시적 압축을 보존하여 ‘나의 구원의 하나님’으로 옮겼습니다.
