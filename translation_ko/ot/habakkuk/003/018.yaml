base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/018.yaml
  text: Yet I will rejoice in Yahweh[b][a]; I will exult in the God of my salvation.
  footnotes:
  - marker: a
    text: 'Hebrew: ''But/And as for me''; the opening words emphasize Habakkuk''s personal resolve in contrast to the devastation described in the previous verse.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will be glad' for 'I will exult.' The two Hebrew verbs are near-synonyms, expressing intensified joy.
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 무화과나무가 무성하지 못하고 포도나무에 열매가 없으며 감람나무의 소출이 그치고 밭이 먹을 것을 내지 못하며 양 떼가 우리에서 끊어질지라도, 나는 야훼 안에서 기뻐하겠습니다. 내 구원의 하나님 안에서 즐거워하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 וַאֲנִי 는 단순한 ‘그리고 나는’이 아니라 앞 문맥에 대한 강한 대조를 띠는 ‘그러나/하지만 나는’의 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 두 동사 אֶעְלֹוזָה, אָגִילָה 는 의미가 매우 가까운 동의 반복으로, 기쁨의 강도를 높입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: Yet I
  chosen_korean: 비록 …일지라도, 나는
  alternatives_korean:
  - 그러나 나는
  - 나는
  - 그래도 나는
  lexicon: HALOT
  rationale: 앞 구절의 재난 진술과 대조되는 화자의 결연한 개인적 결심을 한국어에서는 양보절로 풀어 자연스럽게 드러냈습니다.
- source_word: בַּיהוָה
  english_pob_choice: in Yahweh
  chosen_korean: 야훼 안에서
  alternatives_korean:
  - 야훼 안에
  - 야훼에게서
  - 주님 안에서
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 번역 관례상 ‘야훼’로 옮기고, 기쁨의 대상/영역을 나타내는 ב를 ‘안에서’로 자연스럽게 반영했습니다.
- source_word: אֶעְלֹוזָה
  english_pob_choice: I will rejoice
  chosen_korean: 기뻐하겠습니다
  alternatives_korean:
  - 즐거워하겠습니다
  - 환호하겠습니다
  - 기뻐할 것입니다
  lexicon: HALOT
  rationale: exult의 강한 기쁨을 살리되 한국어 합쇼체에서 과도하게 시적인 어휘보다 의미가 분명한 표현을 택했습니다.
- source_word: אָגִילָה
  english_pob_choice: I will exult
  chosen_korean: 즐거워하겠습니다
  alternatives_korean:
  - 기뻐하겠습니다
  - 환희하겠습니다
  - 크게 기뻐하겠습니다
  lexicon: HALOT
  rationale: 앞의 동사와 가까운 뜻을 가진 병렬 표현이므로, 반복을 완전히 평준화하지 않되 한국어에서는 ‘즐거워하다’로 약간의 강세 차이를 남겼습니다.
- source_word: בֵּאלֹהֵי יִשְׁעִי
  english_pob_choice: the God of my salvation
  chosen_korean: 내 구원의 하나님
  alternatives_korean:
  - 내 구원의 하나님
  - 나를 구원하시는 하나님
  - 내 구원자이신 하나님
  lexicon: HALOT
  rationale: 구문상 ‘my salvation’의 소유 관계를 살려 ‘내 구원의 하나님’으로 옮기고, 시적 압축을 유지했습니다.
theological_decisions:
- issue: YHWH의 음역 여부
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 예언서 히브리어의 신명사 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 두 기쁨 동사의 중복 보존 정도
  chosen_reading: ‘기뻐하겠습니다’와 ‘즐거워하겠습니다’로 약간 구분
  alternative_readings:
  - 두 동사를 모두 ‘기뻐하겠습니다’로 통일
  - 두 동사를 모두 ‘즐거워하겠습니다’로 통일
  rationale: 히브리어의 עלוז/גיל은 근접 동의어이지만 시적 강조를 이루므로, 한국어에서도 완전 통일보다 약한 어휘 차이를 두어 반복의 힘을 보존했습니다.
  doctrine_reference: POB poetic parallelism policy
