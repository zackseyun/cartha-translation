  - 주님 안에서
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 번역 관례상 ‘야훼’로 옮기고, 기쁨의 대상/영역을 나타내는 ב를 ‘안에서’로 자연스럽게 반영했습니다.
- source_word: אֶעְלֹוזָה
  english_pob_choice: I will rejoice
  chosen_korean: 기뻐하겠습니다
  alternatives_korean:
  - 즐거워하겠습니다
  - 환호하겠습니다
