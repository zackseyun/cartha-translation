  lexicon: HALOT
  rationale: exult의 강한 기쁨을 살리되 한국어 합쇼체에서 과도하게 시적인 어휘보다 의미가 분명한 표현을 택했습니다.
- source_word: אָגִילָה
  english_pob_choice: I will exult
  chosen_korean: 즐거워하겠습니다
  alternatives_korean:
  - 기뻐하겠습니다
  - 환희하겠습니다
  - 크게 기뻐하겠습니다
  lexicon: HALOT
  rationale: 앞의 동사와 가까운 뜻을 가진 병렬 표현이므로, 반복을 완전히 평준화하지 않되 한국어에서는 ‘즐거워하다’로 약간의 강세 차이를 남겼습니다.
- source_word: בֵּאלֹהֵי יִשְׁעִי
  english_pob_choice: the God of my salvation
  chosen_korean: 내 구원의 하나님
  alternatives_korean:
  - 내 구원의 하나님
  - 나를 구원하시는 하나님
  - 내 구원자이신 하나님
  lexicon: HALOT
  rationale: 구문상 ‘my salvation’의 소유 관계를 살려 ‘내 구원의 하나님’으로 옮기고, 시적 압축을 유지했습니다.
theological_decisions:
- issue: YHWH의 음역 여부
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 예언서 히브리어의 신명사 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 표기했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 두 기쁨 동사의 중복 보존 정도
  chosen_reading: ‘기뻐하겠습니다’와 ‘즐거워하겠습니다’로 약간 구분
  alternative_readings:
  - 두 동사를 모두 ‘기뻐하겠습니다’로 통일
  - 두 동사를 모두 ‘즐거워하겠습니다’로 통일
  rationale: 히브리어의 עלוז/גיל은 근접 동의어이지만 시적 강조를 이루므로, 한국어에서도 완전 통일보다 약한 어휘 차이를 두어 반복의 힘을 보존했습니다.
  doctrine_reference: POB poetic parallelism policy
