  yaml_path: translation/ot/habakkuk/003/007.yaml
  text: I saw the tents of Cushan under affliction; the tent curtains of the land of Midian were trembling.
translation:
  language: ko
  text: 고난 아래에 저는 구산의 장막들을 보았고, 미디안 땅의 장막 휘장은 떨렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고난 아래에’는 히브리어 תחת אָוֶן의 직역적 감각을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּ֣חַת אָ֔וֶן
  english_pob_choice: under affliction
  chosen_korean: 고난 아래에
  alternatives_korean:
  - 환난 아래에
  - 재앙 아래에
  - 고통 가운데
  lexicon: אָוֶן
  rationale: POB의 ‘under affliction’을 살려, מצב을 나타내는 תחת 구문을 한국어의 ‘아래에’로 직역하되 자연스럽게 ‘고난’으로 옮겼습니다.
- source_word: רָאִ֖יתִי
  english_pob_choice: I saw
  chosen_korean: 저는 보았고
  alternatives_korean:
  - 내가 보았고
  - 제가 보았고
  lexicon: ראה
  rationale: 예언자 화자의 직접 진술을 표준적인 1인칭 서술로 옮겼습니다.
- source_word: אָהֳלֵ֣י כוּשָׁ֑ן
  english_pob_choice: the tents of Cushan
  chosen_korean: 구산의 장막들
  alternatives_korean:
  - 구산의 천막들
  - 구산 장막들
  lexicon: אָהֶל
  rationale: אָהֳלֵי의 복수를 살려 ‘장막들’로 옮겼고, 고유명사 כּוּשָׁן은 음역했습니다.
- source_word: יְרִיע֖וֹת
  english_pob_choice: tent curtains
  chosen_korean: 장막 휘장
  alternatives_korean:
  - 천막 휘장
  - 막 천
  - 휘장
  lexicon: יריעה
  rationale: יריעות의 ‘천/휘장’ 이미지를 보존하면서 문맥상 장막의 덮개라는 뜻이 드러나게 했습니다.
- source_word: אֶ֥רֶץ מִדְיָֽן
  english_pob_choice: the land of Midian
  chosen_korean: 미디안 땅
  alternatives_korean:
  - 미디안의 땅
  - 미디안 지역
  lexicon: אֶרֶץ
  rationale: שֵׁם־מקום과 결합한 אֶרֶץ를 관용적인 지명 표현인 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: 시적 평행 구조 보존
  chosen_reading: 첫 행과 둘째 행을 병렬적으로 유지해 두 대상을 함께 흔드는 야훼의 현현 장면을 살렸습니다.
  alternative_readings:
  - 두 행을 하나의 완문으로 합치는 읽기
  - 이미지를 풀어서 설명하는 번역
  rationale: 하박국 3장의 신현 시는 압축된 시적 병행이 핵심이므로, 의미를 풀어쓰지 않고 병렬 구조를 유지하는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 시적 본문 번역 원칙
