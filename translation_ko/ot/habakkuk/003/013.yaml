id: HAB.3.13
reference: Habakkuk 3:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָצָ֨אתָ֙ לְ/יֵ֣שַׁע עַמֶּ֔/ךָ לְ/יֵ֖שַׁע אֶת מְשִׁיחֶ֑/ךָ מָחַ֤צְתָּ רֹּאשׁ֙ מִ/בֵּ֣ית רָשָׁ֔ע עָר֛וֹת יְס֥וֹד עַד צַוָּ֖אר סֶֽלָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/013.yaml
  text: You went out for the salvation of your people[a], for the salvation of your anointed one; you crushed the head of the house of the wicked, laying bare the foundation up to the neck[c][b]. Selah
  footnotes:
  - marker: a
    text: Or 'for the salvation of your anointed'; the Hebrew repeats 'for salvation' in parallel with 'your people.'
    reason: lexical_alternative
  - marker: b
    text: '''Your anointed one'' may refer to the Davidic ruler, to the people in representative form, or typologically to the Messiah; the Hebrew does not force a single interpretation here.'
    reason: alternative_reading
  - marker: c
    text: Or 'stripping bare the foundation up to the neck.' The Hebrew imagery is difficult and may mix the picture of demolishing a house with exposing a body.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 주의 백성을 구원하시려고 나오셨고[a], 당신의 기름부음 받은 자를 구원하시려고 나오셨습니다. 당신은 악인의 집의 머리를 부수시고, 기초를 목까지 드러내셨습니다[c][b]. 셀라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 기름부음 받은 자의 구원을 위하여’. 히브리어는 ‘구원’을 평행 구조로 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신의 기름부음 받은 자’는 다윗 왕, 대표적 인물, 또는 메시아를 가리킬 수 있으며, 히브리어는 어느 하나로 단정하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘기초를 드러내어 놓으시며 목까지 벗기셨습니다’. 히브리어의 이미지가 어렵고, 집을 허무는 그림과 몸을 드러내는 그림이 섞였을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָאתָ
  english_pob_choice: You went out
  chosen_korean: 나오셨고
  alternatives_korean:
  - 가셨고
  - 출정하셨고
  lexicon: WLC / HALOT
  rationale: יהוה의 결정적 출현을 한국어로 간결하게 옮기기 위해 ‘나오셨다’를 택했고, 반복되는 목적절을 자연스럽게 받기 위해 연결형으로 처리했습니다.
- source_word: לְיֵשַׁע עַמֶּךָ
  english_pob_choice: for the salvation of your people
  chosen_korean: 주의 백성을 구원하시려고
  alternatives_korean:
  - 주의 백성의 구원을 위하여
  - 주의 백성을 건지시려고
  lexicon: WLC / HALOT
  rationale: 명사형 ‘구원’을 살리되 한국어에서는 목적 표현이 매끄럽도록 동사적 구조로 옮겼습니다. ‘백성’은 언약 공동체를 그대로 드러냅니다.
- source_word: מְשִׁיחֶךָ
  english_pob_choice: your anointed one
  chosen_korean: 당신의 기름부음 받은 자
  alternatives_korean:
  - 당신의 메시아
  - 당신의 기름부음 받은 이
  lexicon: WLC / HALOT
  rationale: 본문이 특정한 종말론적 칭호를 강제하지 않으므로, 메시아로 고정하지 않고 직역적 표현을 유지했습니다. 영어 POB의 해설상 열린 참조성을 한국어에서도 보존했습니다.
- source_word: מָחַצְתָּ רֹאשׁ
  english_pob_choice: you crushed the head
  chosen_korean: 당신은 … 머리를 부수시고
  alternatives_korean:
  - 당신은 … 머리를 짓부수시고
  - 당신은 … 머리를 깨뜨리시고
  lexicon: WLC / HALOT
  rationale: 전투적 파괴 이미지를 살리면서도 ‘머리’의 신체적 이미지를 유지하기 위해 ‘부수시다’를 택했습니다.
- source_word: עָרוֹת יְסוֹד עַד צַוָּאר
  english_pob_choice: laying bare the foundation up to the neck
  chosen_korean: 기초를 목까지 드러내셨습니다
  alternatives_korean:
  - 기초를 목까지 벗기셨습니다
  - 기초를 목까지 드러내어 놓으셨습니다
  lexicon: WLC / HALOT
  rationale: 어려운 결구는 영어 POB의 주석대로 ‘드러내다/벗기다’의 이미지를 살리되, 한국어에서는 문장 흐름상 ‘기초’를 목적어로 두고 ‘목까지’를 함께 유지했습니다.
- source_word: סֶלָה
  english_pob_choice: Selah
  chosen_korean: 셀라
  alternatives_korean:
  - 셀라!
  lexicon: WLC / HALOT
  rationale: 의미가 확정되지 않은 전통 용어이므로 음역을 보존했습니다.
theological_decisions:
- issue: מְשִׁיחֶךָ의 지시 대상
  chosen_reading: ‘당신의 기름부음 받은 자’로 직역해, 다윗 왕/대표적 인물/예표적 메시아 가능성을 본문 자체에서 열어 둡니다.
  alternative_readings:
  - 당신의 메시아
  - 당신의 기름부음 받은 왕
  - 당신의 백성
  rationale: 영어 POB 주석이 지적하듯 본문은 단일 해석을 강요하지 않습니다. 한국어 본문에서도 해석을 선점하지 않고, 역사적·대표적·예표적 가능성을 보존하는 쪽이 원문 충실성에 맞습니다.
  doctrine_reference: translation philosophy; Hab 3:13 lexical/theological note
- issue: ‘셀라’ 처리
  chosen_reading: 의미를 번역하지 않고 음역으로 남깁니다.
  alternative_readings:
  - 멈추어라
  - 휴지
  rationale: 용례와 기능이 불명확해 번역이 곧 과잉해석이 되므로, 전통적 음역을 유지하는 것이 가장 보수적입니다.
  doctrine_reference: text-critical/poetic caution
