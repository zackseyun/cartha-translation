    rationale: 기존 ‘기초를 드러내어 놓으시며 목까지 벗기셨습니다’는 ‘목까지’가 무엇을 수식하는지 불명료합니다. ‘기초를 목까지 벗겨 내시며’로 하여 원문의 난해한 혼합 이미지를 유지하되 문법적 연결을 개선합니다.
