id: HAB.3.16
reference: Habakkuk 3:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמַ֣עְתִּי וַ/תִּרְגַּ֣ז בִּטְנִ֗/י לְ/קוֹל֙ צָלֲל֣וּ שְׂפָתַ֔/י יָב֥וֹא רָקָ֛ב בַּ/עֲצָמַ֖/י וְ/תַחְתַּ֣/י אֶרְגָּ֑ז אֲשֶׁ֤ר אָנ֨וּחַ֙ לְ/י֣וֹם צָרָ֔ה לַ/עֲל֖וֹת לְ/עַ֥ם יְגוּדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/016.yaml
  text: I heard[a], and my inward parts trembled; at the sound my lips quivered. Rot enters into my bones, and beneath me I tremble, as I wait quietly for the day of distress[b], for the coming up of the people who will invade us.
  footnotes:
  - marker: a
    text: Or 'that I may rest for the day of distress.' The Hebrew verb can mean 'rest' or 'settle/be quiet'; here it is rendered 'wait quietly' because the context emphasizes hushed expectation before coming trouble.
    reason: alternative_reading
  - marker: b
    text: Or 'the people who attack us' or 'the raiding people.' The Hebrew verb refers to invading or raiding.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 들으니, 내 창자가 떨렸습니다. 그 소리에 내 입술이 떨렸고, 내 뼈에는 썩음이 들어왔으며, 내 아래에서 내가 떨었습니다. 내가 환난의 날을 기다리며 조용히 쉬는 것은, 우리를 침략할 백성이 올라오기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 환난의 날에 쉬려고.’ 히브리어 동사는 ‘쉬다’와 ‘조용히 머물다/잠잠하다’의 뜻이 될 수 있으며, 여기서는 다가올 재앙 앞의 잠잠한 대기를 따라 ‘조용히 기다리며’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘침략하는 백성’이나 ‘약탈하는 백성.’ 히브리어 동사는 침입하거나 노략질하는 행위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  english_pob_choice: I heard
  chosen_korean: 내가 들으니
  alternatives_korean:
  - 내가 들었습니다
  - 내가 들어서
  lexicon: HALOT
  rationale: 첫 동사는 시적 서술의 도입으로, 한국어에서는 ‘내가 들으니’가 뒤따르는 반응을 자연스럽게 여는 표현입니다.
- source_word: וַתִּרְגַּז בִּטְנִי
  english_pob_choice: my inward parts trembled
  chosen_korean: 내 창자가 떨렸습니다
  alternatives_korean:
  - 내 속이 떨렸습니다
  - 내 배가 떨렸습니다
  lexicon: HALOT
  rationale: בטן의 육체적·내면적 떨림을 살리되, 현대 한국어에서 생생하고 직관적인 ‘창자’로 시적 충격을 보존했습니다.
- source_word: יָבֹא רָקָב בַּעֲצָמַי
  english_pob_choice: Rot enters into my bones
  chosen_korean: 내 뼈에는 썩음이 들어왔으며
  alternatives_korean:
  - 내 뼈속으로 썩음이 들어왔으며
  - 내 뼈에는 부패가 들어왔으며
  lexicon: HALOT
  rationale: רָקָב의 ‘썩음/부패’ 이미지를 그대로 살려, 두려움으로 인한 신체 붕괴의 은유를 약화하지 않았습니다.
- source_word: אֲשֶׁר אָנֻוּחַ לְיוֹם צָרָה
  english_pob_choice: as I wait quietly for the day of distress
  chosen_korean: 내가 환난의 날을 기다리며 조용히 쉬는 것은
  alternatives_korean:
  - 내가 환난의 날에 쉬는 것은
  - 내가 환난의 날을 위해 조용히 있는 것은
  lexicon: HALOT
  rationale: נוח를 단순한 ‘쉼’으로만 두기보다 문맥상 ‘조용히 기다리다/쉬다’의 뉘앙스를 살려, 두려움 속의 잠잠한 대기를 표현했습니다.
- source_word: לְעַם יְגוּדֶנּוּ
  english_pob_choice: the coming up of the people who will invade us
  chosen_korean: 우리를 침략할 백성이 올라오기 때문입니다
  alternatives_korean:
  - 우리에게로 침략해 올 백성이 올라오기 때문입니다
  - 우리에게 달려들 백성이 올라오기 때문입니다
  lexicon: HALOT
  rationale: גּוּד의 군사적 의미를 따라 ‘침략할’로 옮겼고, עלה의 ‘올라오다’ 이미지는 유지하되 한국어에서 자연스럽게 ‘백성이 올라오기’로 연결했습니다.
theological_decisions:
- issue: אֲשֶׁר אָנֻוּחַ의 의미를 ‘안식’으로 강하게 확정할지 여부
  chosen_reading: 문맥상 약속된 안식보다는, 환난의 날을 앞두고 조용히 기다리며 잠잠히 있는 태도로 읽었습니다.
  alternative_readings:
  - 내가 환난의 날에 쉬기 위하여
  - 내가 환난의 날에 안식을 누리기 위하여
  rationale: 앞뒤 문맥이 두려움과 떨림을 묘사하므로, 이 절을 위로의 보증으로 과도하게 매끄럽게 만들지 않고 긴장과 신뢰를 함께 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
