  - severity: medium
    issue: 각주 표지가 해당 단어에 연결되지 않음
    rationale: a는 אָנֻוּחַ의 대안 의미, b는 יְגוּדֶנּוּ의 군사적 의미에 관한 각주이므로 각각 ‘기다리겠습니다’와 ‘침략할’에 붙여야 합니다.
  - severity: medium
    issue: ‘내 아래에서 내가 떨었습니다’의 부자연스러운 직역
    rationale: 한국어에서는 ‘내 아래’가 무엇을 뜻하는지 불명확합니다. 원문의 흔들리는 자세를 ‘내가 서 있는 곳에서 떨었습니다’로 전달하는 편이 자연스럽습니다.
