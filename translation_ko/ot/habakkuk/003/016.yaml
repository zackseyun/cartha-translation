  to: 내가 들으니 내 속이 떨렸습니다. 그 소리에 내 입술이 파르르 떨렸습니다. 썩음이 내 뼈에 들어왔고, 내가 서 있는 곳에서 떨었습니다. 나는 환난의 날을 조용히 기다리겠습니다[a]. 우리를 침략할[b] 백성이 쳐올라오는 날을 말입니다.
  rationale: 원문의 연속된 공포 반응과 이어지는 잠잠한 기다림을 보존하고, 침략군의 접근을 인과절이 아니라 환난의 날을 규정하는 내용으로 처리했습니다. 각주 표지도 해당 히브리어 어휘가 번역된 위치로 옮겼습니다.
