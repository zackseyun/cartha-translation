review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 마지막 ‘...때문입니다’는 히브리어의 לְ/אֲשֶׁר 구문을 원인·결과 관계로 바꾸어, 화자가 환난의 날을 잠잠히 기다리는 내용을 ‘침략자가 올라오기 때문’이라는 이유절로 오해하게 합니다. 또한 ‘내 아래에서 내가 떨었습니다’는 וְתַחְתַּי אֶרְגָּז의 몸의 불안정 이미지를 한국어로 부자연스럽게 반복합니다. 수정문은 이를 ‘내가 서 있는 곳에서 떨었습니다’로 자연스럽게 표현하되, 과도한 신체 부위 해석은 피했습니다.
  naturalness: ‘내 창자’는 원문의 내장적 공포를 살리지만 현대 표준 한국어 성경 문체에서는 다소 의학적이고 거칩니다. ‘내 속이 떨렸습니다’가 בֶּטֶן의 내면적·신체적 용법을 자연스럽게 전달합니다. ‘입술이 떨렸고’보다 ‘입술이 파르르 떨렸습니다’가 צָלֲלוּ의 떨림을 더 분명하게 나타냅니다.
  terminology: ‘환난’, ‘썩음’, ‘침략하다’는 적절합니다. לַעֲלוֹת의 군사적 접근 이미지는 ‘쳐올라오다’로 관용적이고 자연스럽게 살렸습니다. אָנֻוּחַ는 문맥상 ‘조용히 기다리겠습니다’로 번역하되, ‘쉬다/잠잠히 머물다’라는 가능한 다른 의미는 각주에 남겼습니다.
  issues:
  - severity: high
    issue: 마지막 절을 인과문으로 처리함
