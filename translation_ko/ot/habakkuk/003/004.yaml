id: HAB.3.4
reference: Habakkuk 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֹ֨גַהּ֙ כָּ/א֣וֹר תִּֽהְיֶ֔ה קַרְנַ֥יִם מִ/יָּד֖/וֹ ל֑/וֹ וְ/שָׁ֖ם חֶבְי֥וֹן עֻזֹּֽ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/004.yaml
  text: His brightness was like the light; rays were from his hand[a], and there his power was hidden.
  footnotes:
  - marker: a
    text: Literally, 'horns from his hand.' Here 'horns' is understood metaphorically as rays or beams of light.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 광채는 빛과 같았으며, 광선[a]이 그의 손에서 나왔고, 그곳에는 그의 능력이 숨겨져 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그의 손에서 뿔들이’입니다. 여기서 ‘뿔들’은 빛살 또는 광선을 비유적으로 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגַהּ
  english_pob_choice: brightness
  chosen_korean: 광채
  alternatives_korean:
  - 밝음
  - 광명
  - 빛남
  lexicon: HALOT
  rationale: נֹגַהּ는 빛나는 밝음이나 광휘를 가리키므로, 현대 한국어에서 자연스러운 ‘광채’가 POB의 ‘brightness’와 가장 잘 맞습니다.
- source_word: כָּאוֹר
  english_pob_choice: like the light
  chosen_korean: 빛 같았으며
  alternatives_korean:
  - 빛과 같았으며
  - 그 빛 같았으며
  - 햇빛 같았으며
  lexicon: HALOT
  rationale: כ־의 비교 용법을 살려 직역적으로 ‘같다’를 유지했고, ‘빛’으로 옮겨 시적 평행을 살렸습니다.
- source_word: קַרְנַיִם
  english_pob_choice: rays
  chosen_korean: 횃불은
  alternatives_korean:
  - 광선은
  - 빛줄기는
  - 뿔은
  lexicon: HALOT
  rationale: 문맥상 문자적 ‘뿔’보다 신현(theophany) 이미지의 발산하는 빛살이 더 자연스러워, 본문의 은유를 살리는 표현으로 옮겼습니다. 다만 주석에서 문자적 의미를 보존할 수 있습니다.
- source_word: מִיָּדוֹ
  english_pob_choice: from his hand
  chosen_korean: 그의 손에서 나왔고
  alternatives_korean:
  - 그의 손에서
  - 그의 손으로부터
  - 그 손에서 나왔고
  lexicon: HALOT
  rationale: מִן + יָד의 출처 표지를 한국어 동사구로 풀어, 손에서 발원한다는 소스-지향적 이미지를 유지했습니다.
- source_word: חֶבְיוֹן עֻזּוֹ
  english_pob_choice: his power was hidden
  chosen_korean: 그의 능력이 숨겨져 있었습니다
  alternatives_korean:
  - 그의 힘이 감추어져 있었습니다
  - 그의 능력이 감춰져 있었습니다
  - 그의 힘의 숨김이 있었습니다
  lexicon: HALOT
  rationale: חֶבְיוֹן은 ‘숨김/은닉’의 명사지만, 한국어에서는 상태 서술로 옮기는 편이 자연스럽습니다. עֹז는 문맥상 ‘능력/힘’ 모두 가능하나, 신현 문맥에서 ‘능력’이 더 적절합니다.
theological_decisions:
- issue: 호른(뿔) 이미지와 광선 이미지의 긴장
  chosen_reading: 본문의 문자적 ‘뿔’ 이미지를 노골적으로 풀어 쓰기보다, 문맥이 요구하는 광선/발산 이미지로 번역했습니다.
  alternative_readings:
  - 그의 손에서 뿔이 나왔고
  - 그의 손에서 뿔 같은 것이 나왔고
  rationale: 히브리어는 의도적으로 다의적인 시적 표현을 사용합니다. 한국어 본문에서는 독자가 신현의 광휘를 즉시 이해하도록 하되, 본문의 은유적 긴장은 주석으로 보존하는 것이 적절합니다.
  doctrine_reference: 시적 신현 표현의 보존; 문자주의와 은유 해석의 균형
