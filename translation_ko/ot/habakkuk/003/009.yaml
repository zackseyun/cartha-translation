  text: עֶרְיָ֤ה תֵעוֹר֙ קַשְׁתֶּ֔/ךָ שְׁבֻע֥וֹת מַטּ֖וֹת אֹ֣מֶר סֶ֑לָה נְהָר֖וֹת תְּבַקַּע אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/009.yaml
  text: Your bow is laid bare[a]; the rods are sworn by command. Selah[b]. You split the earth with rivers.
  footnotes:
  - marker: a
    text: The Hebrew of 'the rods are sworn by command' is difficult and may also be understood as 'oaths to the tribes were spoken' or similarly, preserving the ideas of oaths, rods/tribes, and spoken word.
    reason: alternative_reading
  - marker: b
    text: Or 'tribes' for 'rods'; the Hebrew מַטּוֹת can be understood either way in this poetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 활은 벌거벗겨집니다[a]. 맹세된 채찍들은 말씀으로 주어졌습니다. 셀라[b]. 당신은 강들로 땅을 가르십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 난해한 구절로, ‘맹세된 채찍들’ 외에도 ‘지파들에게 맹세가 선포되었다’ 등으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 מַטּוֹת는 이 시적 문맥에서 ‘채찍들/막대들’ 또는 ‘지파들’로 이해될 수 있습니다.
    reason: lexical_alternative
