  - 맹세가 지파들에게 선포되었습니다
  rationale: 히브리어의 압축성과 모호성을 한국어에서도 유지하되, 맹세·채찍/막대·말씀의 핵심 요소를 모두 드러내어 해석을 과도하게 단정하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
