  source_fidelity: 첫 행의 활 이미지와 마지막 행의 강·땅 이미지는 대체로 반영했지만, עֶרְיָה תֵעוֹר는 활이 전투를 위해 완전히 드러나는 뜻인데 ‘벌거벗겨집니다’는 한국어에서 부자연스럽고 대상에도 어울리지 않습니다. 또한 מַטּוֹת는 ‘채찍’보다 ‘막대기들/지팡이들’이 충실하며, 난해한 중간 구절에 ‘주어졌습니다’를 보태는 것은 אֹמֶר(말/명령)를 넘어서는 해석입니다.
  naturalness: ‘활은 벌거벗겨집니다’와 ‘맹세된 채찍들은 말씀으로 주어졌습니다’는 현대 표준 한국어의 시적 문장으로도 어색합니다. ‘활이 완전히 드러납니다’ 및 ‘막대기들은 명령으로 맹세되었습니다’는 여전히 원문의 의도적인 압축성과 난해성을 보존하면서 더 자연스럽습니다.
  terminology: 하나님을 향한 직접 호칭에는 현대 한국어 성경 문체상 ‘당신’보다 ‘주님’을 쓰는 것이 더 적절합니다. אֹמֶר는 이 문맥에서 ‘말씀’보다 비인격적이고 명령적 의미를 유지하는 ‘명령’이 적합합니다. מַטּוֹת의 주 번역은 ‘막대기들’로 하고 ‘지파들’ 가능성은 각주에 보존해야 합니다.
