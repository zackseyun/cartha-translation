  text: עָמַ֣ד וַ/יְמֹ֣דֶד אֶ֗רֶץ רָאָה֙ וַ/יַּתֵּ֣ר גּוֹיִ֔ם וַ/יִּתְפֹּֽצְצוּ֙ הַרְרֵי עַ֔ד שַׁח֖וּ גִּבְע֣וֹת עוֹלָ֑ם הֲלִיכ֥וֹת עוֹלָ֖ם לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/006.yaml
  text: He stood and measured the earth[a]; he looked and made nations tremble. The ancient mountains were shattered; the everlasting hills sank low[b]. His ways are everlasting.
  footnotes:
  - marker: a
    text: Or 'and startled the nations,' or possibly 'and scattered the nations.' The Hebrew verb here is difficult, and the exact nuance is debated.
    reason: lexical_alternative
  - marker: b
    text: Or 'His goings are everlasting' or 'His paths are eternal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 서서 땅을 재셨습니다[a]; 그가 보고 나라들을 떨게 하셨습니다. 옛 산들이 부서졌고, 영원한 언덕들이 낮아졌습니다[b]. 그의 길들은 영원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나라들을 놀라게 하셨습니다’, 혹은 ‘나라들을 흩으셨습니다’. 이 히브리어 동사는 의미가 어려워 정확한 뉘앙스가 논의됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 걸음들은 영원합니다’ 혹은 ‘그의 길들은 영원합니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמַד
  english_pob_choice: He stood
  chosen_korean: 서서
  alternatives_korean:
  - 자리를 잡고
  - 서셨습니다
  lexicon: HALOT
  rationale: 기본 의미인 ‘서다’를 살리되, 뒤의 행동들과 함께 이어지는 시적 전개를 자연스럽게 만들기 위해 동작 연결형으로 처리했습니다.
- source_word: וַיְמֹדֶד אֶרֶץ
  english_pob_choice: and measured the earth
  chosen_korean: 땅을 재셨습니다
  alternatives_korean:
  - 땅을 측량하셨습니다
  - 땅을 재셨습니다
  lexicon: HALOT
  rationale: מדד의 직접적 의미는 ‘재다/측량하다’이므로, 문맥의 장엄함을 유지하면서도 소스를 가장 가깝게 반영하는 ‘재다’를 택했습니다.
- source_word: וַיַּתֵּר גּוֹיִם
  english_pob_choice: and made nations tremble
  chosen_korean: 나라들을 떨게 하셨습니다
  alternatives_korean:
  - 열국을 떨게 하셨습니다
  - 나라들을 놀라게 하셨습니다
  lexicon: HALOT
  rationale: 동사의 세부 뉘앙스가 논쟁적이라는 영어 주석을 반영해, 결과적 효과인 ‘떨게 하다’를 택해 본문이 말하는 공포와 동요를 자연스럽게 살렸습니다.
- source_word: הַרְרֵי עַד / גִּבְעוֹת עוֹלָם
  english_pob_choice: the ancient mountains / the everlasting hills
  chosen_korean: 옛 산들 / 영원한 언덕들
  alternatives_korean:
  - 영원한 산들 / 오래된 언덕들
  - 태초의 산들 / 영원한 언덕들
  lexicon: HALOT
  rationale: עַד와 עוֹלָם의 ‘오래됨·영속성’ 대구를 한국어에서도 살리기 위해 ‘옛’과 ‘영원한’을 대응시켰습니다.
- source_word: הֲלִיכוֹת עוֹלָם לוֹ
  english_pob_choice: His ways are everlasting
  chosen_korean: 그의 길들은 영원합니다
  alternatives_korean:
  - 그의 걸음들은 영원합니다
  - 그의 행진은 영원합니다
  lexicon: HALOT
  rationale: הליכות는 ‘길/걸음/행보’의 폭이 있으나, 문맥상 여호와의 지속적 행위와 방식이 요약되므로 현대 한국어에서 가장 분명한 ‘길들’로 옮겼습니다.
theological_decisions:
- issue: 시적 신현(theophany) 언어를 어떻게 살릴 것인가
  chosen_reading: 하나님의 나타나심이 땅과 나라, 산과 언덕에 미치는 장엄한 효과를 그대로 유지했습니다.
  alternative_readings:
  - 이를 단순한 비유로만 약화시키는 번역
  - 우주적 파괴 사건으로 과도하게 구체화하는 번역
  rationale: 하박국 3장은 신현 시이므로, 본문이 말하는 두려움과 흔들림을 약화하지 않되 특정 해석으로 과잉 고정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3
