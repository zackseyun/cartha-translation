base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/015.yaml
  text: You marched through the sea with your horses[a], through the heap of mighty waters.
  footnotes:
  - marker: a
    text: Or 'through the surging mass of many waters.' The Hebrew term rendered 'churning' is difficult and may denote the heaped or turbulent mass of the waters.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 바다를 지나 가시며 주의 말들을 타고, 많은 물의 무더기를 밟으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘많은 물의 이는 무더기’를 뜻할 수 있습니다. 히브리어 표현은 어렵고, 물이 솟구치며 쌓인 덩어리나 소용돌이치는 무리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַכְתָּ
  english_pob_choice: you marched
  chosen_korean: 밟으셨습니다
  alternatives_korean:
  - 걸으셨습니다
  - 진군하셨습니다
  - 내디디셨습니다
  lexicon: HALOT
  rationale: דרך는 문자적으로 ‘밟다/걷다’의 뜻이지만, 시적·신현 맥락에서는 하나님의 위엄 있는 전진을 드러내는 동사가 필요해 ‘밟으셨습니다’로 옮겼습니다.
- source_word: בַיָּם
  english_pob_choice: through the sea
  chosen_korean: 바다를 지나
  alternatives_korean:
  - 바다 속에서
  - 바다 가운데
  - 바다를 통해
  lexicon: HALOT
  rationale: 전치사 ב는 이동 동사와 함께 경로를 나타내므로, 한국어에서는 자연스럽게 ‘바다를 지나’로 옮겨 횡단의 이미지를 살렸습니다.
- source_word: סוּסֶיךָ
  english_pob_choice: with your horses
  chosen_korean: 주의 말들을 타고
  alternatives_korean:
  - 주의 말들과 함께
  - 주의 말들을 데리고
  - 주의 말들로
  lexicon: HALOT
  rationale: 히브리어는 ‘주의 말들’을 직접 말하지만, 한국어에서는 선두의 이동 이미지를 살리기 위해 ‘타고’를 보탰습니다. 이는 본문이 그리는 신적 전진의 구체성을 보존하려는 선택입니다.
- source_word: חֹמֶר
  english_pob_choice: the churning
  chosen_korean: 무더기
  alternatives_korean:
  - 뒤섞임
  - 소용돌이
  - 덩어리
  lexicon: HALOT
  rationale: חֹמֶר는 여기서 진흙보다 ‘쌓인 무더기/덩어리’에 가까운 난해한 표현이므로, POB의 주석이 인정한 의미 범위 안에서 ‘무더기’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 전사-왕 이미지 보존
  chosen_reading: 하나님이 바다를 가르며 말들을 타고 전진하시는 구체적 시적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 말들을 상징적으로 구름이나 천사 군대로 풀어 쓰기
  - 바다를 이긴 하나님의 권능이라는 일반 진술로 평탄화하기
  rationale: 이 구절은 신현시의 전사-왕 묘사이므로, 해석적으로 희석하지 않고 본문의 육상적·전투적 이미지를 유지하는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
