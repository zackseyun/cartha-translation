id: HAB.3.14
reference: Habakkuk 3:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נָקַ֤בְתָּ בְ/מַטָּי/ו֙ רֹ֣אשׁ פרז/ו יִסְעֲר֖וּ לַ/הֲפִיצֵ֑/נִי עֲלִ֣יצֻתָ֔/ם כְּמוֹ לֶ/אֱכֹ֥ל עָנִ֖י בַּ/מִּסְתָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/014.yaml
  text: You pierced the head of his warriors with his own staffs; they stormed out to scatter me[a], their exultation like one about to devour the poor in secret.
  footnotes:
  - marker: a
    text: Or 'the head of his villages' / 'the head of his hordes'; the Hebrew term is difficult, and many understand it more generally of the enemy's bands or leaders.
    reason: alternative_reading
translation:
  language: ko
  text: 주께서 그의 창으로 전사들의 머리를 찌르시니, 그들이 나를 흩으려[a] 폭풍처럼 몰려나왔습니다. 그들의 환희는 마치 가난한 자를 몰래 삼키려는 자 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 마을들의 머리’ / ‘그의 무리들의 머리’. 히브리어 표현이 어렵고, 많은 해석은 이를 더 일반적으로 적의 분대나 지도자들로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נָקַבְתָּ
  english_pob_choice: you pierced
  chosen_korean: 찌르시니
  alternatives_korean:
  - 뚫으시니
  - 관통시키시니
  lexicon: HALOT
  rationale: 전투 맥락에서 נקב의 강한 타격·관통 이미지를 한국어 동사 ‘찌르다’로 자연스럽게 살렸습니다.
- source_word: בְמַטָּיו
  english_pob_choice: with his own staffs
  chosen_korean: 그의 창으로
  alternatives_korean:
  - 그의 막대기로
  - 그의 지팡이로
  lexicon: HALOT
  rationale: מַטֶּה는 기본적으로 ‘막대/지팡이’이지만, 여기서는 무기적 맥락이 강해 전투 도구로서의 의미를 드러내는 ‘창’이 더 잘 읽힙니다.
- source_word: רֹאשׁ פְּרָזָיו
  english_pob_choice: the head of his warriors
  chosen_korean: 전사들의 머리
  alternatives_korean:
  - 그의 마을들의 머리
  - 그의 무리들의 머리
  - 그의 지도자의 머리
  lexicon: HALOT
  rationale: פְּרָזָיו는 의미가 어려워 본문 주해의 선택을 반영해야 하므로, 전쟁 맥락에 맞는 ‘전사들’로 옮기되 footnote로 다른 가능성을 보존했습니다.
- source_word: יִסְעֲרוּ
  english_pob_choice: they stormed out
  chosen_korean: 폭풍처럼 몰려나왔습니다
  alternatives_korean:
  - 휘몰아쳤습니다
  - 광란하듯 달려나왔습니다
  lexicon: HALOT
  rationale: סער의 폭풍·격렬한 돌진 이미지를 한국어의 동작성과 함께 살리기 위해 ‘폭풍처럼 몰려나오다’를 택했습니다.
- source_word: לַהֲפִיצֵנִי
  english_pob_choice: to scatter me
  chosen_korean: 나를 흩으려
  alternatives_korean:
  - 나를 흩뜨리려
  - 나를 분산시키려
  lexicon: HALOT
  rationale: פוץ의 기본 의미를 가장 직접적으로 반영하는 ‘흩으려’가 문맥상도 가장 자연스럽습니다.
- source_word: עֲלִיצוּתָם
  english_pob_choice: their exultation
  chosen_korean: 그들의 환희
  alternatives_korean:
  - 그들의 기쁨
  - 그들의 승리감
  lexicon: HALOT
  rationale: 명사의 높아진 정서와 도취된 승리감을 담기 위해 ‘환희’를 택했습니다.
- source_word: כְּמוֹ לֶאֱכֹל עָנִי בַּמִּסְתָּר
  english_pob_choice: like one about to devour the poor in secret
  chosen_korean: 마치 가난한 자를 몰래 삼키려는 자 같았습니다
  alternatives_korean:
  - 마치 가난한 자를 비밀리에 먹어 치우려는 자 같았습니다
  - 마치 가난한 자를 숨은 곳에서 잡아먹으려는 자 같았습니다
  lexicon: HALOT
  rationale: ‘먹다’의 비유를 한국어에서 더 강하게 드러내는 ‘삼키다’로 옮겨, 은밀한 약탈성과 포식 이미지를 살렸습니다.
theological_decisions:
- issue: פְּרָזָיו의 의미가 분명하지 않은 문제
  chosen_reading: 전사들
  alternative_readings:
  - 마을들
  - 무리들
  - 지도자들
  rationale: 문맥상 적대적 공격대가 달려와 흩으려는 장면이므로 군사적 독해를 채택하되, 본문 난점을 드러내기 위해 각주로 다른 가능성을 남겼습니다.
  doctrine_reference: 번역 원칙 §3 — 본문이 실제로 품는 해석적 긴장을 지우지 않고 보존합니다.
