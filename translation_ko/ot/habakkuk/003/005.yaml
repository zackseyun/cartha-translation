base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/005.yaml
  text: Before him goes pestilence[b][a], and plague comes out at his feet.
  footnotes:
  - marker: a
    text: Or 'burning plague,' 'fever,' or possibly 'Resheph,' the name of a plague deity alluded to in poetic imagery.
    reason: lexical_alternative
  - marker: b
    text: Literally 'at his feet'; the phrase may also suggest 'behind him' or 'in his train.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 앞에서는 전염병이 가고, 그의 발치[b]에서는 재앙[a]이 나옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רֶשֶׁף는 ‘불길’, ‘열병’, ‘불타는 재앙’을 뜻할 수 있으며, 시적 이미지에서는 고대 근동의 역병 신 ‘레셰프’를 가리킬 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 발에/발치에’이며, 문맥상 ‘그의 뒤를 따라’ 또는 ‘그의 행렬을 따라’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו / Before him
  english_pob_choice: Before him
  chosen_korean: 그의 앞에는
  alternatives_korean:
  - 그 앞에는
  - 그 앞에서
  lexicon: HALOT
  rationale: לְ + פָּנִים + 접미사는 위치상 ‘앞에/앞으로’를 뜻하므로, 영어 POB의 공간 이미지를 따라 자연스러운 한국어 ‘그의 앞에는’으로 옮겼습니다.
- source_word: דָּבֶר
  english_pob_choice: pestilence
  chosen_korean: 전염병
  alternatives_korean:
  - 페스트
  - 역병
  - 재앙
  lexicon: HALOT
  rationale: 문맥상 심판을 동반하는 질병성 재앙을 가리키므로, 비교적 직접적이면서도 현대 한국어에서 이해되는 ‘전염병’을 택했습니다. ‘역병’도 가능하지만, 본문에 이어지는 짝 표현과 함께 읽을 때 더 설명적입니다.
- source_word: רֶשֶׁף
  english_pob_choice: plague
  chosen_korean: 재앙
  alternatives_korean:
  - 불길
  - 열병
  - 전염병
  - 레스헵
  lexicon: HALOT
  rationale: רֶשֶׁף는 화염, 열병, 재앙, 혹은 신격 암시까지 가능하지만, 본문은 דָּבֶר과 평행을 이루는 파괴적 힘을 묘사하므로 मुख्य 본문에서는 일반명사적 의미를 살려 ‘재앙’으로 옮겼습니다.
- source_word: לְרַגְלָיו
  english_pob_choice: at his feet
  chosen_korean: 그의 발뒤에는
  alternatives_korean:
  - 그의 발에
  - 그의 발 앞에
  - 그의 뒤를 따라
  lexicon: HALOT
  rationale: 직역은 ‘그의 발에/발에서’이지만, 영어 POB가 주석에서 열어 둔 ‘behind him / in his train’의 가능성을 고려해, 행진의 뒤를 따르는 이미지를 살린 ‘그의 발뒤에는’으로 옮겼습니다.
theological_decisions:
- issue: רֶשֶׁף의 신격화 가능성
  chosen_reading: 본문 본문에는 고유명사 ‘레스헵’을 두지 않고 ‘재앙’으로 번역했습니다.
  alternative_readings:
  - 레스헵
  - 불길
  - 열병
  rationale: 시적·고대근동적 배경 가능성은 있으나, 히브리어 본문 자체와 바로 앞의 דָּבֶר 평행법은 파괴적 현상으로 읽게 하므로, 본문 의미를 과장하지 않는 일반명사 번역을 유지했습니다.
  doctrine_reference: 시적 이미지와 역사적 배경은 주해로 다루되, 본문 번역은 원문이 명시한 의미 범위를 넘지 않아야 합니다.
