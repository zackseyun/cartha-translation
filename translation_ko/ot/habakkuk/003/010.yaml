  to: 산들이 주님을 보고 몸부림쳤으며[a], 거센 물살이 휩쓸고 지나갔습니다[b]. 깊음이 그 소리를 내고[c], 그 두 손을 높이 들었습니다.
  rationale: 산들의 반응은 חול/חיל이 지닌 떨림과 뒤틀림의 뉘앙스를 살려 ‘몸부림쳤으며’로 옮겼습니다. 급류의 움직임은 원문의 기본 뜻을 넘어서지 않는 범위에서 한국어의 자연스러운 동작 표현으로 다듬었습니다. 마지막 행은 ‘깊음’의 의인화를 보존하면서 히브리어의 ‘두 손’을 반영했습니다. 각주 표지도 해당 어구 바로 뒤에 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:49:38Z'
review_pass:
