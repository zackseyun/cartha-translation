  source_fidelity: 원문의 병렬적 시어와 창조 세계의 의인화는 대체로 잘 보존되었습니다. 그러나 יָדֵיהוּ는 문자적으로 ‘그의 두 손/손들’이므로 본문의 ‘그 손’은 수를 충분히 반영하지 못합니다. 또한 עָבָר는 기본적으로 ‘지나가다’이지만, 급류라는 주어에 맞추어 ‘휩쓸고 지나갔습니다’로 옮기면 원문의 역동성을 자연스럽게 드러낼 수 있습니다.
  naturalness: ‘물의 급류’보다 ‘거센 물살’이 현대 한국어에서 더 자연스럽습니다. ‘깊음’은 시적·성경적 문맥에서 가능한 표현이며, ‘그 소리를 내고, 그 두 손을 높이 들었습니다’는 의인화된 주어의 연결을 분명히 합니다.
  terminology: 문맥상 2인칭은 하나님을 가리키므로 ‘주님’을 유지할 수 있습니다. תְּהוֹם은 해석적으로 ‘바다’로 한정하지 않고 ‘깊음’으로 두어 우주적 깊은 물의 이미지를 보존했습니다. ‘두 손’은 히브리어의 쌍수 형태를 한국어에서 자연스럽게 반영합니다.
