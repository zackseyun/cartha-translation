id: HAB.3.10
reference: Habakkuk 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָא֤וּ/ךָ יָחִ֨ילוּ֙ הָרִ֔ים זֶ֥רֶם מַ֖יִם עָבָ֑ר נָתַ֤ן תְּהוֹם֙ קוֹל֔/וֹ ר֖וֹם יָדֵ֥י/הוּ נָשָֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/010.yaml
  text: The mountains saw you and writhed[a]; a torrent of waters swept by. The deep gave its voice[c][b]; it lifted its hands on high.
  footnotes:
  - marker: a
    text: Or 'trembled,' 'were in anguish,' or 'quaked' for 'writhed.' The Hebrew verb can suggest shaking or labor-like writhing.
    reason: lexical_alternative
  - marker: b
    text: Or 'passed by.' The Hebrew verb is the common word for passing over or by; 'swept by' brings out the force of the torrent imagery.
    reason: lexical_alternative
  - marker: c
    text: Literally 'it lifted its hands on high.' Some understand 'hands' metaphorically of the deep's surging waves.
    reason: lexical_alternative
translation:
  language: ko
  text: 산들이 주님을 보고 떨었으며[a], 물의 급류가 지나갔습니다[b]. 깊음이 소리를 냈고[c], 그 손을 높이 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸부림쳤으며’, ‘산고하듯 떨었으며’, ‘전율했으며’로도 옮길 수 있습니다. 히브리어 동사는 떨림이나 산고 같은 뒤틀림을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지나갔습니다’. 히브리어 동사는 흔히 ‘지나가다’의 뜻이어서, ‘급류가 지나갔습니다’는 그 힘을 드러내는 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그 손을 높이 들었습니다’입니다. 여기서 ‘손’은 깊음의 솟구치는 물결을 가리키는 은유로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  english_pob_choice: saw you
  chosen_korean: 주님을 보고
  alternatives_korean:
  - 주님을 보았고
  - 주님을 바라보았고
  lexicon: HALOT
  rationale: 2인칭 목적어를 살려 하나님의 현현에 대한 즉각적인 반응을 분명히 하되, 시어에 맞게 자연스러운 ‘보다’로 옮겼습니다.
- source_word: יָחִילוּ
  english_pob_choice: writhed
  chosen_korean: 떨었으며
  alternatives_korean:
  - 몸부림쳤으며
  - 산고하듯 떨었으며
  - 전율했으며
  lexicon: HALOT
  rationale: 히브리어 חול/חיל의 떨림·뒤틀림의 폭을 고려해, 과도하게 해석적이지 않으면서도 산의 의인화된 격동을 살렸습니다.
- source_word: זֶרֶם מַיִם עָבָר
  english_pob_choice: a torrent of waters swept by
  chosen_korean: 물의 급류가 지나갔습니다
  alternatives_korean:
  - 물의 소용돌이가 스쳐 갔습니다
  - 물의 torrent가 지나갔습니다
  - 급류가 휩쓸고 지나갔습니다
  lexicon: HALOT
  rationale: זֶרֶם의 ‘급류/몰아치는 물’ 이미지를 살리면서, עָבָר의 기본 의미인 ‘지나가다’를 유지해 영어의 ‘swept by’에 해당하는 동작을 자연스럽게 표현했습니다.
- source_word: נָתַן תְּהוֹם קוֹלֹו
  english_pob_choice: The deep gave its voice
  chosen_korean: 깊음이 소리를 냈고
  alternatives_korean:
  - 깊음이 그 소리를 냈고
  - 깊음이 자기 소리를 내었고
  - 깊음이 음성을 냈고
  lexicon: HALOT
  rationale: תְּהוֹם을 ‘깊음’으로 옮겨 우주적 물의 의인화를 보존했고, ‘voice’를 ‘소리’로 풀어 한국어에서 과도한 인격화로 들리지 않게 하면서도 시적 표현을 유지했습니다.
- source_word: רוֹם יָדֵיהוּ נָשָׂא
  english_pob_choice: it lifted its hands on high
  chosen_korean: 그 손을 높이 들었습니다
  alternatives_korean:
  - 손을 높이 들었습니다
  - 그 손들을 높이 들었습니다
  - 높은 곳으로 손을 들어 올렸습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘손’을 그대로 살려 깊음의 의인화를 유지하되, 한국어에서는 단수 의존형으로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 자연 현상인가, 의인화된 창조의 응답인가
  chosen_reading: 산과 깊음을 실제로 감정을 가진 존재처럼 묘사하는 시적 의인화를 그대로 유지했습니다.
  alternative_readings:
  - 산들이 떨리고 물이 흘러갔습니다처럼 자연 현상으로 평면화함
  - 의인적 표현을 완화해 비유로만 처리함
  rationale: 이 본문은 신현(theophany) 시로서 창조 세계가 하나님 앞에서 반응하는 장면을 의도하므로, 의인화를 약화하지 않는 것이 원문의 힘을 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
