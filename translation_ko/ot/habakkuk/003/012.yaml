id: HAB.3.12
reference: Habakkuk 3:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/זַ֖עַם תִּצְעַד אָ֑רֶץ בְּ/אַ֖ף תָּד֥וּשׁ גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/012.yaml
  text: In wrath you marched through the earth[b][a]; in anger you threshed the nations.
  footnotes:
  - marker: a
    text: Or 'the land'; Hebrew אֶרֶץ can refer either to the earth generally or to a particular land.
    reason: lexical_alternative
  - marker: b
    text: Or 'you trampled the nations'; the Hebrew verb evokes threshing, often by trampling.
    reason: lexical_alternative
translation:
  language: ko
  text: 진노 가운데 주께서는 땅을 밟고 나아가셨으며, 분노 가운데 나라들을 타작하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶרֶץ는 일반적인 ‘땅/대지’를 뜻할 수도 있고 특정한 지역이나 나라를 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나라들을 짓밟으셨습니다’; 히브리어 동사는 흔히 발로 밟아 타작하는 모습을 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזַעַם
  english_pob_choice: In wrath
  chosen_korean: 진노하실 때에
  alternatives_korean:
  - 진노 가운데
  - 분노 가운데
  - 노하실 때에
  lexicon: HALOT
  rationale: ב plus זַעַם는 상태/수단을 나타내는 부사적 표현으로, 한국어에서는 원인적·상황적 의미를 살려 ‘진노하실 때에’로 자연스럽게 옮겼습니다.
- source_word: תִּצְעַד
  english_pob_choice: you marched through
  chosen_korean: 주께서 땅을 걸으셨으며
  alternatives_korean:
  - 주께서 땅을 행진하셨으며
  - 주께서 땅을 지나가셨으며
  - 주께서 땅을 밟으셨으며
  lexicon: HALOT
  rationale: צעד의 기본 의미는 ‘걸어가다/행진하다’이지만, 시적 신현 묘사에서는 한국어로 ‘걸으셨다’가 원문의 힘과 절제된 이미지를 함께 살립니다.
- source_word: תָּדוּשׁ
  english_pob_choice: you threshed
  chosen_korean: 타작하셨습니다
  alternatives_korean:
  - 밟아 타작하셨습니다
  - 타작하셨으며
  - 짓밟으셨습니다
  lexicon: HALOT
  rationale: דושׁ는 단순한 ‘짓밟다’보다 ‘타작하다’가 핵심 농경 은유를 더 분명히 드러내므로, 시적 동작을 유지하면서도 메타포를 살리는 ‘타작하셨습니다’를 택했습니다.
- source_word: גּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 나라들을
  alternatives_korean:
  - 민족들을
  - 열방을
  - 이방들을
  lexicon: HALOT
  rationale: גּוֹיִם은 문맥상 심판받는 집단을 가리키므로, 한국어에서는 ‘나라들’이 가장 직접적으로 대응하며 ‘이방들’처럼 구약적-신학적 뉘앙스를 불필요하게 덧붙이지 않습니다.
theological_decisions:
- issue: אָרֶץ의 범위와 한국어 자연스러움
  chosen_reading: 땅
  alternative_readings:
  - 땅/나라
  - 세상
  - 지구
  rationale: 이 절은 우주적 신현 장면이지만, 한국어 ‘땅’은 אָרֶץ의 폭넓은 의미를 무리 없이 담으면서도 시적 리듬을 유지합니다. 본문 뒤의 ‘나라들’과도 잘 어울립니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: 시적 병행에서 동사의 강도
  chosen_reading: 걸으셨으며 / 타작하셨습니다
  alternative_readings:
  - 행진하셨으며 / 짓밟으셨습니다
  rationale: 원문의 병행은 하나님의 위엄 있는 진행과 심판 행위를 함께 드러냅니다. 한국어에서 ‘타작하다’는 심판의 강도를 유지하면서도 농경 은유를 훼손하지 않습니다.
  doctrine_reference: Translation philosophy §1, §5
