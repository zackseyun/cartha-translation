id: HAB.3.2
reference: Habakkuk 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֗ה שָׁמַ֣עְתִּי שִׁמְעֲ/ךָ֮ יָרֵאתִי֒ יְהוָ֗ה פָּֽעָלְ/ךָ֙ בְּ/קֶ֤רֶב שָׁנִים֙ חַיֵּ֔י/הוּ בְּ/קֶ֥רֶב שָׁנִ֖ים תּוֹדִ֑יעַ בְּ/רֹ֖גֶז רַחֵ֥ם תִּזְכּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/002.yaml
  text: Yahweh[a], I have heard the report of you; I stand in awe. Yahweh, revive your work in the midst of the years; in the midst of the years make it known[e][d][c][b]; in wrath remember mercy.
  footnotes:
  - marker: a
    text: Or 'your fame' or 'the hearing of you.' The Hebrew expression refers to what has been heard concerning the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'I feared' / 'I was afraid.' The Hebrew can express fear or reverential awe.
    reason: lexical_alternative
  - marker: c
    text: Or 'preserve it alive' or 'renew it.' The Hebrew literally has 'make it live.'
    reason: lexical_alternative
  - marker: d
    text: Or 'in turmoil' or 'in rage.'
    reason: lexical_alternative
  - marker: e
    text: 'Hebrew: ''remember compassion'' or ''remember to have mercy.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 제가 당신에 관한 소식[a]을 듣고 두려워했습니다[b]. 야훼여, 세월 가운데서 당신의 일을 되살리시고[c], 세월 가운데서 그 일을 알리십시오. 진노 중에[d] 자비를 기억하십시오[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘당신에 관한 소식’은 ‘당신의 명성’ 또는 ‘당신에 대해 들은 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘두려워했습니다’는 ‘경외했습니다’ 또는 ‘두려워 떨었습니다’로도 옮길 수 있습니다. 히브리어는 두려움과 경외의 뉘앙스를 모두 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘되살리시고’는 직역하면 ‘그것을 살게 하시고’입니다. ‘보존하시고’ 또는 ‘새롭게 하시고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘진노 중에’는 ‘격동 중에’ 또는 ‘격노 중에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 히브리어는 ‘긍휼을 기억하십시오’ 또는 ‘긍휼을 베푸는 것을 기억하십시오’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유신명 YHWH는 프로젝트 기본값에 따라 야훼로 옮겨, 언약적 이름을 드러내면서도 본문 자체의 고유성을 보존했습니다.
- source_word: שִׁמְעֲךָ
  english_pob_choice: the report of you
  chosen_korean: 주님의 소문
  alternatives_korean:
  - 주님의 보고
  - 주님의 명성
  - 주님에 대한 소식
  lexicon: HALOT
  rationale: שמע 계열은 ‘들린 말/소식/보고’를 가리킬 수 있어, 여기서는 하나님에 관해 들은 전승적 소식을 자연스럽게 드러내는 ‘소문’으로 옮겼습니다.
- source_word: יָרֵאתִי
  english_pob_choice: I stand in awe
  chosen_korean: 제가 두려워했습니다
  alternatives_korean:
  - 제가 경외했습니다
  - 제가 두려워 떨었습니다
  lexicon: HALOT
  rationale: 히브리어 ירא는 두려움과 경외를 함께 포함할 수 있으므로, 완곡하게 미화하지 않고 두려움의 요소를 살리되 문맥상 경외의 뉘앙스가 남도록 했습니다.
- source_word: חַיֵּהוּ
  english_pob_choice: revive
  chosen_korean: 다시 살리십시오
  alternatives_korean:
  - 되살리십시오
  - 소생시키십시오
  - 살려 주십시오
  lexicon: HALOT
  rationale: ‘make it live’의 이미지를 한국어에서 가장 직접적으로 살리는 표현으로, 하나님의 일을 다시 생동하게 해 달라는 청원을 유지합니다.
- source_word: בְּרֹגֶז
  english_pob_choice: in wrath
  chosen_korean: 진노하실 때에도
  alternatives_korean:
  - 진노 중에
  - 격노하실 때에도
  - 격동 속에서
  lexicon: HALOT
  rationale: 문맥상 하나님의 심판적 분노를 가리키므로, 추상명사보다 행위 주체를 드러내는 ‘진노하실 때에도’로 옮겨 기도문의 흐름을 살렸습니다.
theological_decisions:
- issue: יָרֵאתִי의 정서적·신학적 중첩
  chosen_reading: 두려움의 वास्तविक성을 살리면서도 경외의 맥락을 해치지 않도록 번역했습니다.
  alternative_readings:
  - 경외했습니다
  - 무서워했습니다
  rationale: 본문은 단순 공포가 아니라 야훼의 말씀을 들은 자의 떨림과 경외를 함께 담고 있으므로, 의미를 희석하지 않는 방향으로 선택했습니다.
  doctrine_reference: 역어는 문맥의 경외와 두려움의 긴장을 함께 보존해야 합니다.
- issue: ‘세월 한가운데서’의 요청 대상
  chosen_reading: 하나님의 역사하신 일을 다시 드러내 달라는 청원으로 읽었습니다.
  alternative_readings:
  - 우리 시대에
  - 이 기간 안에
  rationale: ‘your work’의 대명사는 인간의 일이 아니라 야훼의 일을 가리키므로, 역사 속 하나님의 행동을 다시 살리고 알리라는 기도로 번역했습니다.
  doctrine_reference: 원어 우선 원칙에 따라 신적 행위의 주체를 분명히 해야 합니다.
