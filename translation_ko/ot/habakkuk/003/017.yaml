  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תְאֵנָ֣ה לֹֽא תִפְרָ֗ח וְ/אֵ֤ין יְבוּל֙ בַּ/גְּפָנִ֔ים כִּחֵשׁ֙ מַעֲשֵׂה זַ֔יִת וּ/שְׁדֵמ֖וֹת לֹא עָ֣שָׂה אֹ֑כֶל גָּזַ֤ר מִ/מִּכְלָה֙ צֹ֔אן וְ/אֵ֥ין בָּקָ֖ר בָּ/רְפָתִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/017.yaml
  text: Though the fig tree does not blossom[a], and there is no produce on the vines; the yield of the olive fails, and the fields produce no food; the flock is cut off from the fold, and there is no herd in the stalls[b],
  footnotes:
  - marker: a
    text: Or 'For the fig tree does not blossom ...' The Hebrew opening particle can be read causally ('for') or concessively ('though'); the concessive sense fits the flow into the declaration of joy in the following verse.
    reason: alternative_reading
  - marker: b
    text: Literally, 'the work/product of the olive proves false,' an idiom meaning that the olive crop fails.
    reason: lexical_alternative
translation:
  language: ko
  text: 무화과나무가 꽃을 피우지 않고, 포도나무에 열매가 없으며, 감람나무의 소출이 없어지고[b], 밭이 먹을거리를 내지 못하며, 양 떼가 우리에서 끊어지고 외양간에 소떼가 없을지라도[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּי는 ‘~이므로’로도 읽을 수 있으나, 문맥상 뒤의 기쁨 선언을 준비하는 양보 의미가 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘감람의 산물/작품’에 가깝지만, 여기서는 감람나무의 소출이 기대에 미치지 않아 없어지는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: Though
  chosen_korean: -일지라도
  alternatives_korean:
  - -해서
  - -이므로
  - -라도
  lexicon: HALOT
  rationale: 시적 대조를 이루며 뒤 절의 기쁨 선언으로 나아가는 양보 의미를 한국어 조건·양보 종결어미로 자연스럽게 살렸습니다.
- source_word: תְאֵנָה
  english_pob_choice: fig tree
  chosen_korean: 무화과나무
