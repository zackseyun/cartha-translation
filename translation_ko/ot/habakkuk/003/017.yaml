id: HAB.3.17
reference: Habakkuk 3:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תְאֵנָ֣ה לֹֽא תִפְרָ֗ח וְ/אֵ֤ין יְבוּל֙ בַּ/גְּפָנִ֔ים כִּחֵשׁ֙ מַעֲשֵׂה זַ֔יִת וּ/שְׁדֵמ֖וֹת לֹא עָ֣שָׂה אֹ֑כֶל גָּזַ֤ר מִ/מִּכְלָה֙ צֹ֔אן וְ/אֵ֥ין בָּקָ֖ר בָּ/רְפָתִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/017.yaml
  text: Though the fig tree does not blossom[a], and there is no produce on the vines; the yield of the olive fails, and the fields produce no food; the flock is cut off from the fold, and there is no herd in the stalls[b],
  footnotes:
  - marker: a
    text: Or 'For the fig tree does not blossom ...' The Hebrew opening particle can be read causally ('for') or concessively ('though'); the concessive sense fits the flow into the declaration of joy in the following verse.
    reason: alternative_reading
  - marker: b
    text: Literally, 'the work/product of the olive proves false,' an idiom meaning that the olive crop fails.
    reason: lexical_alternative
translation:
  language: ko
  text: 무화과나무가 꽃을 피우지 못하고, 포도나무에 열매가 없으며, 감람의 수확이 실패하고, 밭이 먹을거리를 내지 못하며, 양 떼가 우리에서 끊어지고 외양간에 소떼가 없을지라도[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּי는 ‘~이므로’로도 읽을 수 있으나, 문맥상 뒤의 기쁨 선언을 준비하는 양보 의미가 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘감람의 산물/작품’에 가깝지만, 여기서는 올리브 수확이 실패한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: Though
  chosen_korean: -일지라도
  alternatives_korean:
  - -해서
  - -이므로
  - -라도
  lexicon: HALOT
  rationale: 시적 대조를 이루며 뒤 절의 기쁨 선언으로 나아가는 양보 의미를 한국어 조건·양보 종결어미로 자연스럽게 살렸습니다.
- source_word: תְאֵנָה
  english_pob_choice: fig tree
  chosen_korean: 무화과나무
  alternatives_korean:
  - 무화과
  lexicon: HALOT
  rationale: 과실이 아니라 나무 자체를 가리키므로 ‘무화과나무’가 더 정확합니다.
- source_word: תִפְרָח
  english_pob_choice: does not blossom
  chosen_korean: 꽃을 피우지 못하고
  alternatives_korean:
  - 피지 않고
  - 꽃피지 않고
  lexicon: HALOT
  rationale: 나무의 개화 이미지를 현대 한국어에서 자연스럽게 전달하면서도 ‘번성하다’ 같은 비유로 약화시키지 않았습니다.
- source_word: מַעֲשֵׂה זַיִת
  english_pob_choice: the yield of the olive
  chosen_korean: 감람의 수확이 실패하고
  alternatives_korean:
  - 감람의 열매가 실패하고
  - 올리브 수확이 실패하고
  - 감람의 소산이 헛되고
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 ‘작품/산물’이라는 관용구의 뜻인 올리브 수확 실패를 드러내기 위해 ‘수확이 실패하다’로 옮겼습니다.
- source_word: גָּזַר מִמִּכְלָה צֹאן
  english_pob_choice: the flock is cut off from the fold
  chosen_korean: 양 떼가 우리에서 끊어지고
  alternatives_korean:
  - 양 떼가 우리에서 잘려 나가고
  - 양 떼가 우리에서 끊기고
  lexicon: HALOT
  rationale: ‘끊다/끊어지다’는 단절과 상실을 보존하면서 목축 맥락에서 자연스럽게 읽힙니다.
theological_decisions:
- issue: 절의 종결 방식과 18절로 이어지는 양보 구조
  chosen_reading: 이 절을 ‘~일지라도’로 끝내 18절의 기쁨 선언을 준비하는 양보적 흐름으로 잡았습니다.
  alternative_readings:
  - ‘~이므로’로 인과적으로 읽기
  - ‘~지만’으로 대립만 강조하기
  rationale: 히브리어 כִּי는 문맥상 인과도 가능하지만, 여기서는 결핍의 총체성을 제시한 뒤에도 하나님 안에서 기뻐하는 태도로 이어지는 대비가 핵심이므로 양보를 살리는 것이 가장 적절합니다.
  doctrine_reference: Habakkuk 3:18의 문맥적 연속성
