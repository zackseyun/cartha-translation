translation:
  language: ko
  text: 하박국 선지자의 기도 — 시기오놋에 따라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 시기오놋은 아마도 음악적 또는 예전적 용어로, 곡조·연주 방식·격정적인 노래의 शैली를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  english_pob_choice: A prayer
  chosen_korean: 기도
  alternatives_korean:
  - 기도문
  - 기도의 노래
  lexicon: HALOT
  rationale: 표제문의 תְּפִלָּה는 일반적인 ‘기도’이면서도 기도-노래의 성격을 띨 수 있어, 간결한 표제 형식에 맞는 ‘기도’로 옮겼습니다.
- source_word: לַחֲבַקּוּק
  english_pob_choice: of Habakkuk
  chosen_korean: 하박국 선지자의
  alternatives_korean:
  - 하박국의
  - 하박국을 위한
  lexicon: HALOT
  rationale: 표제문에서 ל는 저자/귀속을 나타내는 용법으로 이해되므로, 한국어에서는 소유격보다 자연스러운 ‘하박국 선지자의’로 처리했습니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 선지자
  alternatives_korean:
  - 예언자
  - 그 선지자
  lexicon: HALOT
  rationale: 정관사를 살리면서도 표제문의 압축성을 유지하기 위해 직함을 명시했습니다. POB의 ‘the prophet’ 취지를 반영해 ‘선지자’로 옮겼습니다.
- source_word: עַל שִׁגְיֹנוֹת
  english_pob_choice: according to Shigionoth
  chosen_korean: 시기오놋에 따라
  alternatives_korean:
  - 시기오놋을 따라
  - 시기오놋 곡조에 맞추어
  - 시기오놋에 맞추어
  lexicon: HALOT
  rationale: עַל은 여기서 악곡/연주 지시일 가능성이 높아 ‘따라’로 중립적으로 살렸고, 희귀어 שִׁגְיֹנוֹת은 정확한 뜻이 불확실하므로 음역을 유지했습니다.
theological_decisions:
- issue: 표제문의 기능과 번역 톤
  chosen_reading: 본문이 아니라 시편식 표제문으로 보고, 간결한 명사구 스타일을 유지했습니다.
  alternative_readings:
  - 문장형으로 풀어 옮기기
  - 설명적 번역을 덧붙이기
  rationale: 히브리어 표제문은 정보 전달과 예배적 사용 지시를 함께 담으므로, 과도한 설명을 피하고 원문의 간결성을 보존하는 것이 적절합니다.
  doctrine_reference: 성경 표제문의 문학적 기능 보존
- issue: שִׁגְיֹנוֹת의 불확실성
  chosen_reading: 확정적 의미를 부여하지 않고 음역과 중립적 관계표현만 사용했습니다.
  alternative_readings:
  - 격정적인 노래
  - 곡조에 맞추어
  rationale: 희귀어에 불확실한 의미를 단정하면 원문이 가진 모호성을 지워버리므로, POB의 주석적 신중함을 따라 음역을 유지했습니다.
  doctrine_reference: 본문의 불확실성 보존 원칙
