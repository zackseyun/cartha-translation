  source_fidelity: 히브리어의 대구와 시적 현재는 대체로 잘 반영되었습니다. 다만 한국어 성경 지명 관례에 따라 Teman과 Paran은 각각 ‘데만’과 ‘바란’으로 옮기는 편이 정확하고 혼동이 없습니다. 히브리어 שָׁמַיִם의 복수형은 한국어에서는 관용적으로 ‘하늘’로 옮기는 것이 자연스럽습니다.
  naturalness: ‘하늘들을’은 현대 표준 한국어에서 부자연스럽습니다. 또한 각주 표지는 해당 어구 바로 뒤에 배치해야 독자가 각주의 대상을 분명히 알 수 있습니다.
