id: HAB.3.3
reference: Habakkuk 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱל֨וֹהַ֙ מִ/תֵּימָ֣ן יָב֔וֹא וְ/קָד֥וֹשׁ מֵֽ/הַר פָּארָ֖ן סֶ֑לָה כִּסָּ֤ה שָׁמַ֨יִם֙ הוֹד֔/וֹ וּ/תְהִלָּת֖/וֹ מָלְאָ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/003.yaml
  text: God comes from Teman[a], and the Holy One from Mount Paran. Selah. His splendor covers the heavens[d][c][b], and his praise fills the earth.
  footnotes:
  - marker: a
    text: Teman may also be understood more generally as 'the south,' though here it is likely the place name, parallel to Mount Paran.
    reason: lexical_alternative
  - marker: b
    text: Selah is a liturgical or musical term of uncertain meaning, traditionally left untranslated.
    reason: cultural_note
  - marker: c
    text: Or 'his majesty' or 'his glory' covers the heavens.
    reason: lexical_alternative
  - marker: d
    text: Or 'his praise has filled the earth.' The Hebrew verbal form may also be rendered as past or future in this poetic context.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께서 데만에서 오시고[a], 거룩하신 분께서 바란 산에서 오십니다. 셀라[b]. 그의 광채가 하늘을 덮고[c], 그의 찬양이 땅에 가득합니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘데만’은 ‘남쪽’이라는 일반적 뜻으로도 이해될 수 있지만, 여기서는 다음 행의 ‘바란 산’과 평행하는 지명으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘셀라’는 의미가 분명하지 않은 예배·음악 용어로, 전통적으로 번역하지 않고 음역으로 남깁니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그의 위엄이’ 혹은 ‘그의 영광이’ 하늘을 덮습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그의 찬양이 땅을 가득 채웠습니다.’ 히브리어 동사형은 이 시적 문맥에서 과거나 미래로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלוֹהַ
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 신
  - 신격
  lexicon: HALOT
  rationale: 단수 신칭으로 하나님을 가리키는 표현이므로, 한국어에서는 표준적인 신칭인 하나님이 가장 자연스럽고 원문 의미를 과도하게 좁히지 않습니다.
- source_word: מִתֵּימָן
  english_pob_choice: from Teman
  chosen_korean: 테만에서
  alternatives_korean:
  - 남쪽에서
  lexicon: HALOT
  rationale: 영어 POB가 지명 Teman으로 처리한 점을 따라, 시적 병행을 살리기 위해 음역을 유지했습니다. 일반 방향어로 풀면 지명성과 대구가 약해집니다.
- source_word: וְקָדוֹשׁ
  english_pob_choice: and the Holy One
  chosen_korean: 거룩하신 분이
  alternatives_korean:
  - 거룩한 이가
  - 성자
  lexicon: HALOT
  rationale: 문맥상 하나님을 가리키는 존칭적 호칭이므로, 추상 형용사보다 ‘거룩하신 분’이 한국어에서 인격적·칭호적 뉘앙스를 잘 드러냅니다.
- source_word: מָלְאָה הָאָרֶץ
  english_pob_choice: fills the earth
  chosen_korean: 땅에 가득합니다
  alternatives_korean:
  - 땅을 채웁니다
  - 세상에 가득합니다
  lexicon: HALOT
  rationale: 시적 현재의 충만함을 살리면서, ‘땅’이 하늘과 짝을 이루는 우주적 대비를 유지하도록 번역했습니다.
theological_decisions:
- issue: 하나님 출현의 시제 표현
  chosen_reading: 현재형으로 ‘오십니다 / 가득합니다’를 사용해 시적 현장감을 살렸습니다.
  alternative_readings:
  - 과거형으로 ‘오셨습니다 / 가득했습니다’
  - 미래형으로 ‘오실 것입니다 / 가득할 것입니다’
  rationale: 하박국 3장은 회상과 재현이 겹치는 신현 시이므로, 한국어에서도 현재형이 예배적·시적 긴박감을 가장 잘 전달합니다. 동시에 과거·미래로 단정하지 않아 원문의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it
- issue: ‘거룩하신 분’의 지칭
  chosen_reading: ‘하나님’과 평행하는 동일한 신적 호칭으로 읽었습니다.
  alternative_readings:
  - 별도의 거룩한 존재
  - 메시아적 인물
  rationale: 두 행의 병행 구조가 동일한 신적 주체를 가리키는 것으로 강하게 보이므로, 분리된 인물로 해석하지 않고 호칭으로 번역했습니다.
  doctrine_reference: 병행법에 따른 동일 주어 보존
