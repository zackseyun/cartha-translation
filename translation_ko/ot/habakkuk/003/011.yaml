  rationale: 첫 절의 עָמַד는 단순한 체류보다 ‘멈추어 섰다’가 정지의 이미지를 더 분명히 전달합니다. 후반절은 원문의 한 동사와 두 병행구를 반영하여 한 번의 ‘나아갔습니다’로 옮겼습니다. 주어는 한국어에서 생략하여, 천체와 신적 무기 이미지 사이의 원문상 압축성과 해석적 여지를 보존했습니다. ‘빛을 따라’는 לְאוֹר 및 병행되는 לְנֹגַהּ의 시적 관계를 과도하게 기계적 인과나 단순 도구로 확정하지 않습니다.
