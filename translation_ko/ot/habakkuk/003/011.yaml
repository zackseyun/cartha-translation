  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֶׁ֥מֶשׁ יָרֵ֖חַ עָ֣מַד זְבֻ֑לָ/ה לְ/א֤וֹר חִצֶּ֨י/ךָ֙ יְהַלֵּ֔כוּ לְ/נֹ֖גַהּ בְּרַ֥ק חֲנִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/011.yaml
  text: Sun and moon stood in their lofty place[a]; at the light of your arrows they went[c][b], at the brightness of the flash of your spear.
  footnotes:
  - marker: a
    text: Or 'Sun and moon stood in their habitation'; the Hebrew זְבֻלָה refers to a lofty dwelling or exalted place.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew is compressed: ''they went'' may refer to the heavenly bodies, or more likely to the flight of God''s arrows and spear.'
    reason: alternative_reading
  - marker: c
    text: Or 'the lightning of your spear.'
    reason: lexical_alternative
translation:
  language: ko
  text: 해와 달이 높은 처소에 멈추어 섰습니다[a]. 주님의 화살의 빛을 따라, 주님의 창의 섬광을 따라 나아갔습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 거처에’; 히브리어 זְבֻלָה는 높은 거처나 고귀한 처소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 매우 압축되어 있어, ‘나아갔습니다’의 주체는 해와 달일 수도 있고, 더 가능성 있게는 주님의 화살과 창이 날아가는 것을 가리킬 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘주님의 창의 번개’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ יָרֵחַ
  english_pob_choice: Sun and moon
  chosen_korean: 해와 달
  alternatives_korean:
  - 태양과 달
  - 해와 월
  lexicon: WLC/HALOT
  rationale: 히브리어의 대구적 짝을 자연스러운 한국어 시적 표현으로 옮기되, 두 천체를 분명히 구분하도록 했습니다.
- source_word: זְבֻלָה
  english_pob_choice: in their lofty place
  chosen_korean: 그 높은 처소에
  alternatives_korean:
  - 그들의 거처에
  - 그 높은 거처에
  - 그 처소에
  lexicon: HALOT
  rationale: זְבֻלָה는 ‘높은 거처/고귀한 처소’의 뜻이므로, 단순한 ‘하늘’보다 상승된 거처의 뉘앙스를 살렸습니다.
- source_word: יְהַלֵּכוּ
  english_pob_choice: they went
  chosen_korean: 움직였습니다
  alternatives_korean:
  - 갔습니다
  - 걸었습니다
  - 나아갔습니다
  lexicon: HALOT
  rationale: 문맥상 화살/창의 운동과 천체의 정지가 압축되어 있어, 직역적 ‘갔습니다’보다 시적·중립적인 ‘움직였습니다’가 원문의 긴장을 더 잘 보존합니다.
- source_word: בְּרַק חֲנִיתֶךָ
  english_pob_choice: the flash of your spear
  chosen_korean: 주님의 창의 번쩍임의 밝음
  alternatives_korean:
  - 주님의 창의 번개
  - 주님의 창의 섬광
  - 주님의 창의 번쩍임
  lexicon: HALOT
  rationale: בָּרָק은 번개/섬광의 시각적 밝기를 모두 가질 수 있어, 무기 이미지와 병행을 살리기 위해 ‘번쩍임의 밝음’으로 옮겼습니다.
theological_decisions:
- issue: ‘그들은’의 지시 대상과 운동 주체의 압축성
  chosen_reading: 두 번째 절의 ‘그들은’은 히브리어의 압축성을 따라 명시적으로 풀지 않고, 문맥상 천체와/또는 신적 무기 이미지가 겹쳐 읽히는 긴장을 유지했습니다.
  alternative_readings:
  - 해와 달이 주님의 화살의 빛에 따라 움직였다는 읽기
  - 화살과 창이 움직였다는 읽기
  rationale: 원문은 주어를 단정적으로 하나로 고정하지 않으므로, 한국어도 해석을 과도하게 확정하지 않고 시적 모호성을 남겨 두는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
