id: MAL.2.16
reference: Malachi 2:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי שָׂנֵ֣א שַׁלַּ֗ח אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כִסָּ֤ה חָמָס֙ עַל לְבוּשׁ֔/וֹ אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/נִשְׁמַרְתֶּ֥ם בְּ/רוּחֲ/כֶ֖ם וְ/לֹ֥א תִבְגֹּֽדוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/016.yaml
  text: For he hates divorce[a], says Yahweh, the God of Israel, and the one who covers his garment with violence, says Yahweh of Armies. So guard yourselves in your spirit[b], and do not act faithlessly.
  footnotes:
  - marker: a
    text: 'Traditional rendering: ''For I hate divorce,'' says the LORD, the God of Israel. The Hebrew text here is difficult and can be understood in more than one way.'
    reason: alternative_reading
  - marker: b
    text: Or 'do not deal treacherously' / 'do not be unfaithful.' The Hebrew speaks of acting faithlessly in covenant relationship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이혼을 미워합니다[a], 이스라엘의 하나님이신 야훼께서 말씀하십니다. 또한 자기 옷을 폭력으로 덮는 사람을 미워하십니다. 만군의 야훼께서 말씀하십니다. 그러므로 여러분은 자기 영[b]을 삼가 지키고, 신실하지 않게 행동하지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '전통 번역: ‘나는 이혼을 미워한다’(여호와께서 말씀하신다). 이 히브리어 구절은 난해하며, 여러 방식으로 이해될 수 있습니다.'
    reason: alternative_reading
  - marker: b
    text: 또는 ‘신실하지 않게 행하지 마십시오’/‘배신하지 마십시오.’ 히브리어는 언약 관계에서의 불성실을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵא שַׁלַּח
  english_pob_choice: he hates divorce
  chosen_korean: 이혼을 미워합니다
  alternatives_korean:
  - 버림을 미워합니다
  - 내쫓음을 미워합니다
  lexicon: HALOT
  rationale: 본문은 결혼 관계에서의 ‘보냄/내보냄’을 가리키므로 한국어에서는 의미가 드러나는 현대어 ‘이혼’을 택하되, 원문이 가진 난해함은 각주로 보존했습니다.
- source_word: וְכִסָּה חָמָס עַל לְבוּשׁוֹ
  english_pob_choice: and the one who covers his garment with violence
  chosen_korean: 자기 옷을 폭력으로 덮는 사람
  alternatives_korean:
  - 자기 옷을 폭력으로 가리는 사람
  - 자기 옷에 폭력을 입히는 사람
  lexicon: HALOT
  rationale: 원문의 압축된 비유를 살려 ‘옷’과 ‘폭력’을 직접 연결했고, 문맥상 불의와 배신의 흔적을 가리는 이미지를 자연스럽게 전달했습니다.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל / יְהוָה צְבָאֹות
  english_pob_choice: Yahweh, the God of Israel / Yahweh of Armies
  chosen_korean: 이스라엘의 하나님이신 야훼
  alternatives_korean:
  - 이스라엘의 하나님이신 여호와
  - 이스라엘의 하나님이신 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 YHWH는 ‘야훼’로 옮기고, 첫 호칭은 ‘이스라엘의 하나님’으로 풀어 주어 뒤의 ‘만군의 야훼’와 병행되도록 했습니다.
- source_word: בְּרוּחֲכֶם
  english_pob_choice: in your spirit
  chosen_korean: 자기 영
  alternatives_korean:
  - 마음
  - 심령
  lexicon: HALOT
  rationale: רוּחַ는 여기서 내적 태도와 신앙적 충실성을 가리키므로 관용적 종교어인 ‘심령’보다 원문에 가까운 ‘영’을 사용했습니다.
- source_word: תִבְגֹּדוּ
  english_pob_choice: do not act faithlessly
  chosen_korean: 신실하지 않게 행동하지 마십시오
  alternatives_korean:
  - 배신하지 마십시오
  - 간음하지 마십시오
  lexicon: HALOT
  rationale: בגד는 언약 관계에서의 불성실과 배신을 뜻하므로, 단순 도덕화보다 관계적 뉘앙스를 살리는 ‘신실하지 않게 행동하다’를 택했습니다.
theological_decisions:
- issue: שָׂנֵא שַׁלַּח의 난해한 주어와 전통 번역
  chosen_reading: 본문의 더 난해한 3인칭 흐름을 살려 ‘그는 이혼을 미워합니다’로 두고, 전통적 1인칭 읽기는 각주로 남겼습니다.
  alternative_readings:
  - 나는 이혼을 미워합니다
  rationale: 원문 형태를 우선하되, 오랜 교회 번역 전통이 가진 읽기 가능성은 삭제하지 않고 보존해 두 입장을 함께 추적할 수 있게 했습니다.
  doctrine_reference: 번역 원칙 §1, §3
- issue: וְלֹא תִבְגֹּדוּ의 covenantal faithlessness
  chosen_reading: ‘신실하지 않게 행동하지 마십시오’로 옮겨 결혼 언약의 배신이라는 문맥을 드러냈습니다.
  alternative_readings:
  - 배신하지 마십시오
  - 부정하게 행하지 마십시오
  rationale: 단순한 감정 문제보다 언약적 불성실을 겨냥한 경고이므로, 도덕적 완곡어보다 관계적·신학적 무게를 유지했습니다.
  doctrine_reference: 번역 원칙 §3
