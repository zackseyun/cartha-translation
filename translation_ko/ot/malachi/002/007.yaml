id: MAL.2.7
reference: Malachi 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי שִׂפְתֵ֤י כֹהֵן֙ יִשְׁמְרוּ דַ֔עַת וְ/תוֹרָ֖ה יְבַקְשׁ֣וּ מִ/פִּ֑י/הוּ כִּ֛י מַלְאַ֥ךְ יְהוָֽה צְבָא֖וֹת הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/007.yaml
  text: For the lips of a priest should guard knowledge[a], and they should seek instruction from his mouth[b], because he is the messenger of Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or "law" or "teaching" for "instruction" (Hebrew torah).
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: "the LORD of hosts."'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장의 입술은 지식을 지켜야 하며, 사람들은 그의 입에서 교훈을[a] 구해야 합니다. 이는 그가 야훼 만군의 사자이기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘율법’ 또는 ‘가르침’. 히브리어 토라의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: '전통적 번역: ‘만군의 여호와’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי כֹהֵן
  english_pob_choice: the lips of a priest
  chosen_korean: 제사장의 입술
  alternatives_korean:
  - 한 제사장의 입술
  - 제사장들의 입술
  lexicon: HALOT
  rationale: 히브리어의 구성은 제사장의 입술을 가리키며, 한국어에서는 소유격으로 자연스럽고 간결하게 옮기는 편이 원문의 일반적 대표성을 잘 살립니다.
- source_word: יִשְׁמְרוּ דַעַת
  english_pob_choice: should guard knowledge
  chosen_korean: 지식을 지켜야 하고
  alternatives_korean:
  - 지식을 지켜야 하며
  - 지식을 보존해야 하고
  lexicon: HALOT
  rationale: יִשְׁמְרוּ의 규범적 힘을 살리기 위해 단순 미래보다 의무적 표현으로 옮겼고, דַעַת는 여기서 단순 정보가 아니라 하나님과 그의 길에 대한 바른 지식을 뜻하므로 지식으로 번역했습니다.
- source_word: וְתוֹרָה יְבַקְשׁוּ מִפִּיהוּ
  english_pob_choice: they should seek instruction from his mouth
  chosen_korean: 그들의 입에서 사람들은 교훈을 찾아야 합니다
  alternatives_korean:
  - 그들의 입에서 사람들은 율법을 찾아야 합니다
  - 그의 입에서 사람들은 교훈을 찾아야 합니다
  lexicon: HALOT
  rationale: תּוֹרָה는 여기서 제사장의 입에서 구해지는 권위 있는 가르침을 가리키므로, 전통적 '율법'보다 문맥에 맞는 교훈을 택했습니다. 히브리어의 3인칭 복수 동사와 한국어 자연성을 함께 살리기 위해 주어를 일반화했습니다.
- source_word: מַלְאַךְ יְהוָה צְבָאוֹת
  english_pob_choice: the messenger of Yahweh of Armies
  chosen_korean: 야훼 만군의 사자
  alternatives_korean:
  - 야훼 만군의 천사
  - 여호와 만군의 사자
  lexicon: HALOT
  rationale: 이 문맥의 מַלְאַךְ는 천사 존재가 아니라 제사장에게 적용된 '사자/전달자'를 뜻하므로 사자로 옮겼고, יְהוָה는 본 프로젝트 기본값에 따라 야훼로 렌더링했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본 표기에 따라 야훼를 사용하여 히브리어 고유명과 음성형을 더 직접적으로 드러냈습니다.
  doctrine_reference: 'POB glossary: יְהוָה / YHWH → 야훼'
- issue: 예언자적/제사장적 직분 진술의 어조
  chosen_reading: 지켜야 하고 / 찾아야 합니다
  alternative_readings:
  - 지킬 것입니다 / 찾을 것입니다
  - 지켜라 / 찾아라
  rationale: 본문은 제사장 직분에 대한 규범적 진술이므로, 명령형의 직접성은 유지하되 한국어 합쇼체로 공적 진술의 톤을 살렸습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence; preserve source sense without paraphrase'
