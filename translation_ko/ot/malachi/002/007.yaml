  source_fidelity: 히브리어 מִפִּיהוּ는 단수 ‘그의 입에서’인데, 초안의 ‘그들의 입에서’는 수 일치가 맞지 않습니다. 또한 מַלְאַךְ는 이 문맥에서 제사장의 직분을 비유하는 ‘사자/전령’이며, ‘사자’는 적절합니다. 두 미완료형의 규범적 의미도 ‘~해야 합니다’로 잘 반영할 수 있습니다.
  naturalness: ‘교훈을 찾아야 합니다’보다 제사장의 권위 있는 가르침을 ‘구해야 합니다’가 현대 한국어에서 더 자연스럽습니다. ‘제사장의 입술’과 이후 단수 대명사 ‘그의’의 일관성도 확보해야 합니다.
  terminology: תּוֹרָה는 여기서 ‘교훈’으로 옮길 수 있으나, 대안 번역을 알리는 각주는 해당 단어에 붙여야 합니다. ‘야훼 만군’ 및 ‘사자’는 제공된 프로젝트 용례와 문맥에 부합합니다.
