  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אֲלֵי/כֶ֛ם הַ/מִּצְוָ֥ה הַ/זֹּ֖את הַ/כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/001.yaml
  text: And now[a], this command is for you, O priests.
  footnotes:
  - marker: a
    text: Or 'to you, O priests.' The Hebrew preposition can be rendered more literally as 'to,' but 'for you' better conveys the sense in English that the command is specifically directed at them.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이 명령이 너희에게, 제사장들아, 주어집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 시간 전환과 담화 전개를 함께 드러내는 표현으로, 예언적 경고의 전환을 간결하게 살립니다.
- source_word: אֲלֵיכֶם
  english_pob_choice: for you
  chosen_korean: 너희에게
  alternatives_korean:
  - 너희를 위해
  - 너희를 향해
  lexicon: HALOT
  rationale: 히브리어 전치사 엘과 2인칭 복수 접미사는 여기서 제사장들을 향한 직접 지시를 나타내므로, 한국어에서는 중립적인 여격 '너희에게'가 가장 자연스럽습니다.
- source_word: הַמִּצְוָה
  english_pob_choice: command
  chosen_korean: 이 명령
  alternatives_korean:
  - 이 계명
  - 이 지시
  lexicon: HALOT
  rationale: מִצְוָה의 기본 의미를 따라 '명령'으로 옮기되, 문두에 두어 경고성 있는 톤을 유지했습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: O priests
  chosen_korean: 제사장들아
  alternatives_korean:
  - 제사장들
  - 오 제사장들
  lexicon: HALOT
  rationale: 직접 호격이므로 한국어 호격 어미 '-아'를 사용해 대면 호소를 분명히 했습니다.
theological_decisions:
- issue: 직접 호격의 공적 예언 담화 톤
  chosen_reading: 예언자적 책망의 호격을 살려 '제사장들아'로 번역했습니다.
  alternative_readings:
  - 제사장들
  - 오 제사장들
  rationale: 본문은 제사장들을 향한 직접적 선언이므로, 단순 서술보다 호격 표지가 있는 번역이 청자를 향한 책망의 강도를 더 정확히 전달합니다.
  doctrine_reference: 예언서의 공적 책망 담화
