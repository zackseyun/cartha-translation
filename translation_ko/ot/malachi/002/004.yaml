  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֕ם כִּ֚י שִׁלַּ֣חְתִּי אֲלֵי/כֶ֔ם אֵ֖ת הַ/מִּצְוָ֣ה הַ/זֹּ֑את לִֽ/הְי֤וֹת בְּרִיתִ/י֙ אֶת לֵוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/004.yaml
  text: Then you will know that I have sent this command to you[a], that my covenant with Levi may be[b], says Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, more literally, 'to be my covenant with Levi.' The Hebrew is compressed; the sense may be that this command is sent in relation to the continuance of God's covenant with Levi.
    reason: alternative_reading
  - marker: b
    text: 'Traditional rendering: ''the LORD of hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내가 너희에게 이 명령을 보낸 것을 알게 될 것이니, 그것은 나의 레위와의 언약이 되게 하려는 것입니다. 만군의 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나의 레위와의 언약이 되게 하려는’이라는 뜻일 수 있습니다. 히브리어는 압축되어 있어, 명령이 레위와의 언약의 지속/성립과 관련된다는 뜻으로도 읽힙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וִידַעְתֶּם
  english_pob_choice: Then you will know
  chosen_korean: 그러면 ... 알게 될 것입니다
  alternatives_korean:
  - 그리고 ... 알게 될 것입니다
  - 그때 ... 알게 될 것입니다
  lexicon: HALOT
  rationale: 예언적 결과를 나타내는 waw 결합 완료형의 미래적/결과적 힘을 한국어에서 자연스러운 순차 표현으로 옮겼습니다.
- source_word: שִׁלַּחְתִּי אֲלֵיכֶם
  english_pob_choice: I have sent ... to you
  chosen_korean: 내가 너희에게 ... 보낸
  alternatives_korean:
  - 내가 너희에게 ... 보냈
  - 내가 너희를 향해 ... 보낸
  lexicon: HALOT
  rationale: אֶל의 기본 방향성을 살려 수신자에게 보낸 것으로 처리했고, ‘너희에게’가 가장 직접적인 수신 대상을 드러냅니다.
- source_word: הַמִּצְוָה הַזֹּאת
  english_pob_choice: this command
  chosen_korean: 이 명령
  alternatives_korean:
  - 이 계명
  - 이 명령문
  lexicon: HALOT
  rationale: מִצְוָה는 여기서 제사장들에게 주어진 예언적 명령이므로, 현대 한국어에서 가장 자연스러운 ‘명령’을 택했습니다.
- source_word: לִהְיוֹת בְּרִיתִי אֶת לֵוִי
  english_pob_choice: that my covenant with Levi may be
  chosen_korean: 나의 레위와의 언약이 되게 하려는 것입니다
  alternatives_korean:
  - 나의 레위와의 언약이 되도록 하는 것입니다
  - 나의 레위와의 언약이 있게 하려는 것입니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 לִהְיוֹת를 직역해 ‘되게’로 살리되, 한국어 문맥상 목적/결과 관계를 드러내는 보조 표현을 더해 문장을 읽을 수 있게 했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 주
  lexicon: HALOT
  rationale: 프로젝트 기본어인 ‘야훼’를 따르며, צְבָאוֹת은 전통적 ‘만군’으로 옮겨 군대적 복수성을 유지했습니다.
theological_decisions:
- issue: לִהְיוֹת בְּרִיתִי אֶת לֵוִי의 의미 범위
  chosen_reading: 문제의 명령은 레위와의 언약을 ‘새로 세운다’기보다 그 언약이 그렇게 되도록, 곧 그 언약적 관계가 성립·유지되도록 하는 방향으로 이해했습니다.
  alternative_readings:
  - 나의 레위와의 언약이 되도록 하려는 것입니다
  - 나의 레위와의 언약을 새로 세우려는 것입니다
  rationale: 본문은 압축적이어서 해석 여지가 있지만, 문맥상 새로운 언약 체결보다 레위와의 기존 언약 질서를 유지·실현하는 방향이 더 자연스럽습니다. 다만 한국어 본문은 원문의 압축성을 지나치게 풀지 않도록 유지했습니다.
  doctrine_reference: 본문의 긴장을 보존하고 과도한 신학적 확정을 피함
