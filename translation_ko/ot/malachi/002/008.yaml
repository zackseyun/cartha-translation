id: MAL.2.8
reference: Malachi 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּם֙ סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ הִכְשַׁלְתֶּ֥ם רַבִּ֖ים בַּ/תּוֹרָ֑ה שִֽׁחַתֶּם֙ בְּרִ֣ית הַ/לֵּוִ֔י אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/008.yaml
  text: But you have turned aside from the way; you have caused many to stumble in the law; you have corrupted the covenant of Levi[a], says Yahweh of hosts.
  footnotes:
  - marker: a
    text: Or 'by instruction' or 'in the law'; the Hebrew torah can mean 'law' or 'instruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 길에서 벗어났으며, 율법 안에서 많은 사람을 넘어지게 하였고, 레위와 맺은 언약을 더럽혔습니다. 야훼 만군의 하나님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교훈 속에서’ 혹은 ‘율법 안에서’로 옮길 수 있습니다. 히브리어 토라(תּוֹרָה)는 ‘율법’ 또는 ‘교훈’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְתֶּם מִן הַדֶּרֶךְ
  english_pob_choice: have turned aside from the way
  chosen_korean: 길에서 벗어났으며
  alternatives_korean:
  - 길에서 떠났으며
  - 길을 벗어났으며
  lexicon: HALOT
  rationale: סור의 핵심 의미인 ‘벗어남/돌아섬’을 한국어로 자연스럽게 살리되, הַדֶּרֶךְ의 비유적 의미를 ‘길’로 유지했습니다.
- source_word: הִכְשַׁלְתֶּם רַבִּים בַּתּוֹרָה
  english_pob_choice: have caused many to stumble in the law
  chosen_korean: 율법 안에서 많은 사람을 넘어지게 하였고
  alternatives_korean:
  - 율법으로 많은 사람을 넘어뜨렸고
  - 율법에서 많은 사람을 넘어지게 하였고
  lexicon: HALOT
  rationale: 히필형의 사역성을 ‘넘어지게 하다’로 반영했고, תּוֹרָה는 여기서 제사장적 교훈의 권위를 지닌 ‘율법’으로 옮겼습니다. 전치사는 장소/범위감을 살려 ‘안에서’로 처리했습니다.
- source_word: שִׁחַתֶּם בְּרִית הַלֵּוִי
  english_pob_choice: have corrupted the covenant of Levi
  chosen_korean: 레위와 맺은 언약을 더럽혔습니다
  alternatives_korean:
  - 레위의 언약을 타락시켰습니다
  - 레위의 언약을 훼손하였습니다
  lexicon: HALOT
  rationale: שׁחת의 파괴·부패 의미를 ‘더럽히다’로 옮겨 언약적 오염의 뉘앙스를 살렸고, בְּרִית הַלֵּוִי는 ‘레위와 맺은 언약’으로 자연스럽게 표현했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: says Yahweh of hosts
  chosen_korean: 야훼 만군의 하나님께서 말씀하십니다
  alternatives_korean:
  - 야훼 만군의 주께서 말씀하십니다
  - 야훼 군대의 하나님께서 말씀하십니다
  lexicon: HALOT
  rationale: 고유명 יְהוָה는 본문 지시대로 ‘야훼’로 옮기고, צְבָאוֹת은 예언문 맥락에서 전통적으로 이해되는 위엄을 살려 ‘만군의 하나님’으로 렌더링했습니다.
theological_decisions:
- issue: תּוֹרָה의 번역 범위
  chosen_reading: 율법
  alternative_readings:
  - 교훈
  - 가르침
  rationale: 제사장들이 맡은 언약적 가르침의 권위를 드러내기 위해 여기서는 ‘율법’을 본문 번역으로 두고, ‘교훈/가르침’ 가능성은 본문 의미의 배경으로만 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
- issue: יְהוָה צְבָאוֹת의 한국어 호칭
  chosen_reading: 야훼 만군의 하나님
  alternative_readings:
  - 야훼 만군의 주
  - 야훼 만군의 여호와
  rationale: 본문의 신명 호칭을 직접 보존하면서도 한국어 독자가 이해하기 쉬운 예언자적 서술로 정리했습니다. 다만 ‘만군의 하나님’은 צְבָאוֹת의 위엄을 설명하는 번역적 확장입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 직접화법의 종결
  chosen_reading: 말씀하십니다
  alternative_readings:
  - 말합니다
  - 이르십니다
  rationale: 예언 선포문의 공식성을 살리면서도 현대 한국어 합쇼체에 맞게 정리했습니다.
  doctrine_reference: Korean style guideline
