  edition: WLC
  text: בָּגְדָ֣ה יְהוּדָ֔ה וְ/תוֹעֵבָ֛ה נֶעֶשְׂתָ֥ה בְ/יִשְׂרָאֵ֖ל וּ/בִ/ירֽוּשָׁלִָ֑ם כִּ֣י חִלֵּ֣ל יְהוּדָ֗ה קֹ֤דֶשׁ יְהוָה֙ אֲשֶׁ֣ר אָהֵ֔ב וּ/בָעַ֖ל בַּת אֵ֥ל נֵכָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/011.yaml
  text: Judah has acted treacherously[a], and an abomination has been committed in Israel and in Jerusalem, for Judah has profaned the sanctuary of Yahweh, which he loves[b], and has married the daughter of a foreign god.
  footnotes:
  - marker: a
    text: Or 'the sanctuary of the LORD' or 'the holy people of the LORD'; the Hebrew phrase is ambiguous.
    reason: alternative_reading
  - marker: b
    text: Literally, 'the daughter of a foreign god'; this likely refers to a woman aligned with foreign worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 신의를 저버렸고[a], 이스라엘과 예루살렘에서 가증한 일이 일어났습니다. 곧 유다가 야훼께서 사랑하시는 그 거룩한 것을 더럽혔고[b], 이방 신의 딸과 결혼한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신실하지 못하게 행했다’라고도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘야훼의 거룩한 것’, ‘야훼의 성소’, ‘야훼의 거룩한 백성’로도 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּגְדָה
  english_pob_choice: has acted treacherously
  chosen_korean: 신의를 저버렸고
  alternatives_korean:
  - 배신했고
  - 간사하게 행했고
  - 언약을 어겼고
  lexicon: HALOT
  rationale: בגד는 언약적 문맥에서 신의/배신의 뉘앙스를 지니므로, 한국어로는 자연스럽되 도덕적·언약적 강도를 살리는 ‘신의를 저버리다’가 적절합니다.
- source_word: תוֹעֵבָה
  english_pob_choice: an abomination
  chosen_korean: 가증한 일
  alternatives_korean:
  - 혐오스러운 일
  - 역겨운 일
  - 가증스러운 것
  lexicon: HALOT
  rationale: 예언서의 강한 종교·도덕적 평가를 살리기 위해 관용적이면서도 무게감 있는 ‘가증한 일’을 선택했습니다.
- source_word: חִלֵּל קֹדֶשׁ יְהוָה
  english_pob_choice: has profaned the holiness of Yahweh
  chosen_korean: 야훼께서 사랑하시는 그 거룩한 것을 더럽혔고
  alternatives_korean:
  - 야훼의 거룩함을 더럽혔고
  - 야훼의 성소를 더럽혔고
  - 야훼의 거룩한 백성을 더럽혔고
  lexicon: HALOT
  rationale: קֹדֶשׁ יְהוָה는 성소/거룩함/거룩한 백성 등으로 갈릴 수 있는 모호한 표현이므로, 해석을 미리 좁히지 않고 ‘그 거룩한 것’을 살린 뒤, POB의 긴장을 반영해 ‘사랑하시는’도 유지했습니다.
- source_word: וּבָעַל בַּת אֵל נֵכָר
  english_pob_choice: has married the daughter of a foreign god
  chosen_korean: 이방 신의 딸과 결혼한 것입니다
  alternatives_korean:
  - 낯선 신의 딸과 결혼한 것입니다
  - 이방 신에게 속한 여인과 결혼한 것입니다
  - 외국 신의 딸과 결혼한 것입니다
  lexicon: HALOT
  rationale: 직역을 너무 거칠게 유지하기보다, 여성과 외래 숭배의 결합이라는 종교적 함의를 보존하면서 한국어로는 자연스러운 ‘이방 신의 딸’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사를 드러내는 프로젝트 기본값에 따라 יהוה는 ‘야훼’로 표기했습니다.
theological_decisions:
- issue: קֹדֶשׁ יְהוָה의 지시 대상
  chosen_reading: ‘그 거룩한 것’으로 옮겨, 성소/거룩한 백성/거룩함의 어느 쪽으로도 단정하지 않았습니다.
  alternative_readings:
  - 성소
  - 거룩한 백성
  - 야훼의 거룩함
  rationale: 히브리어가 의도적으로 열어 둔 범위를 한국어에서도 유지하는 것이, 본문의 예언적 고발을 과도하게 해석하지 않는 길입니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
- issue: ‘이방 신의 딸’의 의미
  chosen_reading: 단순한 외국인 여성이 아니라 외래 신앙과 연결된 인물을 가리키는 종교적 뉘앙스를 보존했습니다.
  alternative_readings:
  - 이방 여자
  - 외국 여자
  - 이방 신을 섬기는 여자
  rationale: 문맥이 혼인 자체보다 언약적 배신과 우상숭배를 문제 삼으므로, 종교적 함의를 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: Original-language primacy; preserve covenantal warning.
