id: MAL.2.9
reference: Malachi 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם אֲנִ֞י נָתַ֧תִּי אֶתְ/כֶ֛ם נִבְזִ֥ים וּ/שְׁפָלִ֖ים לְ/כָל הָ/עָ֑ם כְּ/פִ֗י אֲשֶׁ֤ר אֵֽינְ/כֶם֙ שֹׁמְרִ֣ים אֶת דְּרָכַ֔/י וְ/נֹשְׂאִ֥ים פָּנִ֖ים בַּ/תּוֹרָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/009.yaml
  text: So I also have made you despised and abased before all the people[a], because you are not keeping my ways but are showing partiality in the law.
  footnotes:
  - marker: a
    text: Or 'in instruction' or 'in the Torah' for 'in the law.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나도 너희를 모든 백성 앞에서 멸시받고 낮아지게 하였습니다. 이는 너희가 내 길을 지키지 않고 율법에서 편파적으로 대하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אֲנִי
  english_pob_choice: So I also
  chosen_korean: 그래서 나도
  alternatives_korean:
  - 나도 또한
  - 그러므로 나도
  lexicon: HALOT
  rationale: 앞선 책망에 대한 대응과 연결되는 결과·강조를 살리면서, 현대 한국어에서 자연스러운 접속을 택했습니다.
- source_word: נָתַתִּי אֶתְכֶם נִבְזִים וּשְׁפָלִים
  english_pob_choice: have made you despised and abased
  chosen_korean: 멸시받고 낮아지게 하였습니다
  alternatives_korean:
  - 멸시받고 비천하게 하였습니다
  - 경멸받고 낮아지게 하였습니다
  lexicon: HALOT
  rationale: ‘주다’의 직역보다 결과 상태를 일으키는 사역적 의미를 살렸고, נִבְזִים은 수동적 수치인 ‘멸시받고’로, שְׁפָלִים은 ‘낮아지게’로 옮겼습니다.
- source_word: לְכָל הָעָם
  english_pob_choice: before all the people
  chosen_korean: 모든 백성 앞에서
  alternatives_korean:
  - 온 백성이 보는 앞에서
  - 모든 백성이 보는 데서
  lexicon: HALOT
  rationale: 공적 수치를 드러내는 장소적 의미를 한국어의 관용적 표현으로 보존했습니다.
- source_word: בַּתּוֹרָה
  english_pob_choice: in the law
  chosen_korean: 율법에서
  alternatives_korean:
  - 가르침에서
  - 토라에서
  lexicon: HALOT
  rationale: 이 문맥은 제사장들의 판정과 행정이 관련된 자리이므로, 넓은 ‘instruction’보다 POB의 ‘the law’에 맞춰 ‘율법’으로 옮겼습니다.
theological_decisions:
- issue: בַּתּוֹרָה의 범위
  chosen_reading: 율법에서
  alternative_readings:
  - 가르침에서
  - 토라에서
  rationale: 본문은 제사장들이 하나님의 기준을 공정하게 다루지 않은 책임을 책망하므로, 법적·언약적 뉘앙스를 드러내는 ‘율법’이 가장 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 공적 수치의 강도
  chosen_reading: 멸시받고 낮아지게 하였습니다
  alternative_readings:
  - 멸시받고 비천하게 하였습니다
  - 멸시받고 굴욕을 당하게 하였습니다
  rationale: 히브리어의 공개적 수치와 낮아짐을 유지하되, 한국어에서 과도하게 해석을 덧붙이지 않도록 절제했습니다.
  doctrine_reference: Translation philosophy §6
