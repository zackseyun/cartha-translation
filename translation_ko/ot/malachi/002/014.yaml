  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֖ם עַל מָ֑ה עַ֡ל כִּי יְהוָה֩ הֵעִ֨יד בֵּינְ/ךָ֜ וּ/בֵ֣ין אֵ֣שֶׁת נְעוּרֶ֗י/ךָ אֲשֶׁ֤ר אַתָּה֙ בָּגַ֣דְתָּה בָּ֔/הּ וְ/הִ֥יא חֲבֶרְתְּ/ךָ֖ וְ/אֵ֥שֶׁת בְּרִיתֶֽ/ךָ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/014.yaml
  text: But you say[a], “Why?” Because Yahweh has been a witness between you and the wife of your youth, to whom you have been unfaithful[b], though she is your companion and your wife by covenant.
  footnotes:
  - marker: a
    text: Or, “with whom you have dealt faithlessly.” The Hebrew verb can denote treachery, betrayal, or faithless dealing, especially in covenant contexts.
    reason: lexical_alternative
  - marker: b
    text: Or, “your covenant wife” or “the wife of your covenant.”
    reason: lexical_alternative
translation:
  language: ko
  text: 「어찌냐고 하십니까?」 야훼께서 너와 네 젊은 시절의 아내 사이에서 증인이 되셨으니, 너는 그 여자에게 신의를 저버렸습니다. 그런데도 그 여자는 너의 동반자이며 네 언약의 아내입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어찌냐고 하십니까?’는 히브리어의 반문을 현대 한국어로 자연스럽게 옮긴 것입니다.
    reason: korean_style_note
  - marker: b
    text: ‘신의를 저버렸습니다’는 히브리어 בגד의 언약적 배신·불성실의 뉘앙스를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם / עַל מָה
  english_pob_choice: But you say, “Why?”
  chosen_korean: 「어찌냐고 하십니까?」
  alternatives_korean:
  - 「왜냐고 말합니까?」
  - 「무엇 때문이냐고 합니까?」
  lexicon: HALOT
  rationale: 의문의 응답을 한국어로 자연스럽게 살리되, 본문의 반문성과 직접 인용을 유지하기 위해 간결한 질문형으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 토라 및 예언서의 여호와 신명은 본 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 신적 고유명을 보존했습니다.
- source_word: הֵעִיד
  english_pob_choice: has been a witness
  chosen_korean: 증인이 되셨으니
  alternatives_korean:
  - 증언하셨으니
  - 증인이 되어 주셨으니
  lexicon: HALOT
  rationale: 법정·언약 문맥에서 ‘증인이 되다’가 가장 직접적이며, 한국어에서도 관계 사이에 서신 증언의 의미를 자연스럽게 드러냅니다.
- source_word: בָּגַדְתָּה בָּהּ
  english_pob_choice: to whom you have been unfaithful / against whom you have acted treacherously
  chosen_korean: 그 여자에게 신의를 저버렸습니다
  alternatives_korean:
  - 그 여자에게 배신하였습니다
  - 그 여자에게서 배반하였습니다
  lexicon: HALOT
  rationale: בגד의 핵심은 단순 감정적 불충실보다 관계·언약을 저버리는 배신이므로, 완곡한 ‘바람을 피우다’보다 ‘신의를 저버리다’가 문맥의 무게를 살립니다.
- source_word: חֲבֶרְתְּךָ / אֵשֶׁת בְּרִיתֶךָ
  english_pob_choice: your companion and your wife by covenant
  chosen_korean: 너의 동반자이며 네 언약의 아내입니다
  alternatives_korean:
  - 너의 동무이며 네 언약의 아내입니다
  - 너와 함께한 아내이며 네 언약의 아내입니다
  lexicon: HALOT
  rationale: חברתך는 친밀한 결합 관계를 가리키므로 ‘동반자’가 가장 무난하며, ‘언약의 아내’는 ברית의 언약성을 직설적으로 보존합니다.
theological_decisions:
- issue: Marriage as covenant witness
  chosen_reading: 본문을 단순한 부부 갈등이 아니라, 야훼께서 증인이 되시는 언약적 결혼 파기로 읽히도록 번역했습니다.
  alternative_readings:
  - 일반적 불성실로만 약화시키는 읽기
  - 관계적 유감 정도로 완화하는 읽기
  rationale: ‘증인’과 ‘언약’이 함께 나타나므로, 배신의 죄책을 윤리적 호감 상실이 아니라 언약 위반의 문제로 보존해야 합니다.
  doctrine_reference: 말 2:14의 언약 신학
- issue: Register in the quoted objection
  chosen_reading: ‘어찌냐고 하십니까?’로 공손한 반문을 사용해, 예언자적 논쟁문맥의 직접 인용을 현대 한국어로 유지했습니다.
  alternative_readings:
  - ‘왜냐고 합니까?’
  - ‘어찌하여라 합니까?’
  rationale: 화자가 백성의 반문을 인용하는 구조이므로, 합쇼체를 유지하되 원문의 도전적 뉘앙스를 흐리지 않도록 했습니다.
  doctrine_reference: 인용문 화법 처리
