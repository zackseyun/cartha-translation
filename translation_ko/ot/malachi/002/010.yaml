  source_fidelity: 첫 질문의 אָב אֶחָד은 바로 다음 절의 ‘한 하나님’과 평행을 이루지만, 그 지시 대상을 본문 안에서 명시하지 않습니다. 초안의 ‘아버지는 한 분’은 한국어의 존칭 ‘분’ 때문에 하나님을 가리키는 뜻으로 다소 확정될 수 있습니다. ‘한 아버지’로 옮기면 본문의 표현과 남아 있는 해석상 여지를 더 잘 보존합니다. 나머지 핵심 어휘와 수사 의문문의 의미는 대체로 충실합니다.
  naturalness: ‘우리 모두에게 한 아버지가 있지 않습니까?’는 현대 표준어 합쇼체로 자연스럽고, 원문의 ‘우리 모두에게/우리 모두가’라는 포괄성을 살립니다. ‘각기 자기 형제에게 신의를 저버려’는 기존의 연결 구조를 유지하면서도 질문의 서술어와 매끄럽게 이어집니다.
  terminology: ‘한 하나님’, ‘언약’, ‘조상들’, ‘더럽히다’는 적절합니다. ‘신의를 저버리다’는 בגד의 배신·불성실의 뜻을 자연스럽게 전달합니다. 각주 표지는 해당 표현 바로 뒤에 배치하여 각주의 적용 범위를 분명히 해야 합니다.
