id: MAL.2.10
reference: Malachi 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֨וֹא אָ֤ב אֶחָד֙ לְ/כֻלָּ֔/נוּ הֲ/ל֛וֹא אֵ֥ל אֶֽחָ֖ד בְּרָאָ֑/נוּ מַדּ֗וּעַ נִבְגַּד֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לְ/חַלֵּ֖ל בְּרִ֥ית אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/010.yaml
  text: Do we not all have one Father? Has not one God created us? Why then are we faithless[a], each man to his brother[b], profaning the covenant of our fathers?
  footnotes:
  - marker: a
    text: Or, 'Why then do we deal treacherously, each man with his brother?' The Hebrew verb carries the sense of acting treacherously or faithlessly in a covenant relationship.
    reason: lexical_alternative
  - marker: b
    text: '''One Father'' may refer directly to God, as the parallel ''one God created us'' suggests; some understand it more broadly as a shared covenant ancestor.'
    reason: alternative_reading
translation:
  language: ko
  text: 우리 모두에게 아버지는 한 분이 아니십니까? 한 하나님께서 우리를 지으신 것이 아니십니까? 그런데 어찌하여 우리는 각기 자기 형제에게 신의를 저버리고, 우리 조상들의 언약을 더럽힙니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘어찌하여 우리가 각기 자기 형제에게 신의를 저버립니까?’ 히브리어 동사는 언약 관계에서의 배신 또는 불신실함을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한 아버지’는 바로 뒤의 ‘한 하나님께서 우리를 지으셨다’와 평행을 이루므로 하나님을 직접 가리킬 수 있습니다. 다만 어떤 이들은 이를 더 넓게 공동의 조상으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲל֨וֹא אָ֤ב אֶחָד֙ לְכֻלָּ֔נוּ
  english_pob_choice: Do we not all have one Father?
  chosen_korean: 우리 모두에게 아버지는 한 분이 아니십니까?
  alternatives_korean:
  - 우리 모두의 아버지는 한 분이 아니십니까?
  - 우리에게는 한 아버지만 계시지 않습니까?
  lexicon: HALOT
  rationale: 수사적 질문 구조를 살리면서, 앞뒤 평행을 고려해 ‘한 분’으로 단일성과 강조를 표현했습니다. ‘우리 모두에게’는 לְכֻלָּנוּ의 포괄성을 자연스럽게 담습니다.
- source_word: אֵ֥ל אֶחָ֖ד בְּרָאָ֑נוּ
  english_pob_choice: Has not one God created us?
  chosen_korean: 한 하나님께서 우리를 지으신 것이 아니십니까?
  alternatives_korean:
  - 한 하나님께서 우리를 창조하신 것이 아니십니까?
  - 한 하나님이 우리를 만드신 것이 아니십니까?
  lexicon: HALOT
  rationale: בָּרָא의 신학적 무게를 살리되, 한국어에서는 ‘지으시다’가 문맥상 자연스럽고 고전적 의미의 ‘창조’도 포괄할 수 있습니다. 수사적 반문 형식은 그대로 유지했습니다.
- source_word: נִבְגַּד
  english_pob_choice: are we faithless
  chosen_korean: 신의를 저버리고
  alternatives_korean:
  - 배신하고
  - 간사하게 행하고
  - 언약을 어기고
  lexicon: HALOT
  rationale: 이 동사는 언약 관계에서의 배신·불신실함을 뜻하므로, 한국어로는 ‘신의를 저버리다’가 문맥과 도덕적 뉘앙스를 함께 살립니다. 영어 본문의 ‘faithless’와도 대응됩니다.
- source_word: אִישׁ בְּאָחִיו
  english_pob_choice: each man to his brother
  chosen_korean: 각기 자기 형제에게
  alternatives_korean:
  - 각 사람마다 자기 형제에게
  - 서로에게
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현을 유지하면서, 남성 단수 표현을 한국어에서 자연스럽게 옮겼습니다. 관계를 직접적으로 표시하는 ‘자기 형제에게’는 본문의 책임성도 드러냅니다.
- source_word: לְחַלֵּל
  english_pob_choice: profaning
  chosen_korean: 더럽히고
  alternatives_korean:
  - 속되고 만들고
  - 모독하고
  - 더럽혀
  lexicon: HALOT
  rationale: 언약을 성스럽게 다루지 않는 행위를 가리키므로, 한국어에서는 현재분사적 연결을 살린 ‘더럽히고’가 자연스럽습니다. 지나치게 의례적인 표현보다 본문의 직접성을 유지합니다.
- source_word: בְּרִית אֲבֹתֵינוּ
  english_pob_choice: the covenant of our fathers
  chosen_korean: 우리 조상들의 언약
  alternatives_korean:
  - 우리 조상과 맺으신 언약
  - 조상들의 언약
  lexicon: HALOT
  rationale: 소유격 구조를 그대로 살려 언약의 전승성과 공동체적 책임을 드러냈습니다. ‘우리 조상들’은 המקרא적 집단 기억을 자연스럽게 반영합니다.
theological_decisions:
- issue: ‘한 아버지’의 지시 대상
  chosen_reading: 본문의 표현을 따라 ‘아버지’라고 유지하되, 바로 뒤의 ‘한 하나님’과의 평행을 통해 하나님의 부성(父性)을 암시하도록 두었습니다.
  alternative_readings:
  - ‘한 조상’으로 일반화
  - ‘하나님 아버지’로 명시
  rationale: 히브리어는 ‘아버지’와 ‘하나님’을 나란히 두어 긴장을 형성합니다. 번역에서 이를 미리 해소하지 않고, 독자가 평행 구조에서 의미를 읽어내도록 남겨 두는 것이 source-direct합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: אִישׁ ... אָחִיו의 성별 표지
  chosen_reading: ‘각기 자기 형제에게’로 옮겨, 히브리어의 남성 단수 일반화를 유지했습니다.
  alternative_readings:
  - ‘서로에게’
  - ‘각 사람에게’
  rationale: 공동체 전체를 포괄하되, 원문의 남성형을 중화하지 않는 것이 본문 표지에 더 충실합니다. 이 선택은 공동체적 비난의 보편성을 약화하지 않습니다.
  doctrine_reference: Translation philosophy §4 Gender-accurate over gender-neutral
