revisions:
- from: 야훼께서 야곱의 장막들에서 이 일을 행하는 그 사람을, 깨어 있는 자와 대답하는 자를, 그리고 야훼 만군의 하나님께 예물을 드리는 자를 끊어 버리시기를 원합니다.[a]
  to: 야훼께서 야곱의 장막들 가운데서 이 일을 행하는 사람, 곧 깨어 있는 자와 대답하는 자, 또 만군의 야훼께 예물을 드리는 자를 끊어 버리시기를 바랍니다.[a]
  rationale: The revision corrects the divine title to ‘만군의 야훼,’ improves the modern formal-polite rendering of the jussive, and retains the difficult phrase in a transparent form with a clearer uncertainty note. The coordinated wording preserves the Hebrew’s deliberately difficult sequence without deciding whether the expression denotes specific roles or a comprehensive group.
