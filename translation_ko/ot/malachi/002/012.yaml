source:
  edition: WLC
  text: יַכְרֵ֨ת יְהוָ֜ה לָ/אִ֨ישׁ אֲשֶׁ֤ר יַעֲשֶׂ֨/נָּה֙ עֵ֣ר וְ/עֹנֶ֔ה מֵ/אָהֳלֵ֖י יַֽעֲקֹ֑ב וּ/מַגִּ֣ישׁ מִנְחָ֔ה לַֽ/יהוָ֖ה צְבָאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/012.yaml
  text: May Yahweh cut off from the tents of Jacob the man who does this[a], him who is awake and him who answers, and him who brings an offering to Yahweh of hosts.
  footnotes:
  - marker: a
    text: Hebrew 'awake and answering.' The phrase is difficult; it may be an idiom meaning something like 'witness and advocate' or a merism meaning everyone involved.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 야곱의 장막들에서 이 일을 행하는 그 사람을, 깨어 있는 자와 대답하는 자를, 그리고 야훼 만군의 하나님께 예물을 드리는 자를 끊어 버리시기를 원합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘깨어 있는 자와 대답하는 자’라고 되어 있습니다. 이 표현은 어렵고, ‘증인과 변호자’ 같은 뜻의 관용구이거나 관련된 모든 사람을 가리키는 머리수 표현일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יַכְרֵת יְהוָה
  english_pob_choice: May Yahweh cut off
  chosen_korean: 야훼께서 ... 끊어 버리시기를 원합니다
  alternatives_korean:
  - 야훼께서 ... 끊으실 것입니다
  - 야훼께서 ... 끊어 버리십시오
  lexicon: HALOT
  rationale: 문맥상 단순 미래보다 저주/선언의 소망형이므로, 한국어에서는 ‘...하시기를 원합니다’로 임precatory 뉘앙스를 살렸습니다.
- source_word: מֵאָהֳלֵי יַעֲקֹב
  english_pob_choice: from the tents of Jacob
  chosen_korean: 야곱의 장막들에서
  alternatives_korean:
  - 야곱의 장막에서
  - 야곱의 집에서
  lexicon: HALOT
  rationale: ‘장막들’은 히브리어 복수 이미지를 보존하면서 언약 공동체를 가리키는 표현도 유지합니다.
- source_word: עֵר וְעֹנֶה
  english_pob_choice: him who is awake and him who answers
  chosen_korean: 깨어 있는 자와 대답하는 자
  alternatives_korean:
  - 증인과 변호자
  - 모든 사람
  lexicon: HALOT
  rationale: 의미가 불확실하므로 본문에서는 가능한 한 직역해 긴장을 남기고, 해석적 대안은 덧붙이지 않았습니다.
- source_word: מִנְחָה
  english_pob_choice: offering
  chosen_korean: 예물
  alternatives_korean:
  - 헌물
  - 곡식제물
  - 제물
  lexicon: HALOT
  rationale: 제의 맥락을 살리되 한국어에서 너무 특정한 제사 종류로 좁히지 않기 위해 ‘예물’을 택했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of hosts
  chosen_korean: 야훼 만군의 하나님
  alternatives_korean:
  - 야훼 만군의 주님
  - 만군의 야훼
  lexicon: HALOT
  rationale: ‘만군의’는 צְבָאוֹת의 군대/천상군대 뉘앙스를 살리고, יְהוָה는 프로젝트 기본어인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 열렬한 저주/심판 선언의 문체
  chosen_reading: ‘끊어 버리시기를 원합니다’로 기도문 같은 저주적 선언을 살렸습니다.
  alternative_readings:
  - ‘끊어 버리실 것입니다’
  - ‘끊어 버리소서’
  rationale: 본문은 예언자의 심판 선언이자 소망형 저주로 읽히므로, 한국어에서도 단순 예고보다 발화의 강도를 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘깨어 있는 자와 대답하는 자’의 해석 보류
  chosen_reading: 직역에 가까운 표현을 유지해 문법적·의미적 불확실성을 드러냈습니다.
  alternative_readings:
  - ‘증인과 변호자’
  - ‘모든 관련자’
  rationale: 히브리어 관용구의 정확한 범위가 불확실하므로, 본문에서 해석을 과도하게 확정하지 않고 독자가 원문의 난점을 보게 했습니다.
  doctrine_reference: Translation philosophy §3
