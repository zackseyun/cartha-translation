id: MAL.2.17
reference: Malachi 2:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הוֹגַעְתֶּ֤ם יְהוָה֙ בְּ/דִבְרֵי/כֶ֔ם וַ/אֲמַרְתֶּ֖ם בַּ/מָּ֣ה הוֹגָ֑עְנוּ בֶּ/אֱמָרְ/כֶ֗ם כָּל עֹ֨שֵׂה רָ֜ע ט֣וֹב בְּ/עֵינֵ֣י יְהוָ֗ה וּ/בָ/הֶם֙ ה֣וּא חָפֵ֔ץ א֥וֹ אַיֵּ֖ה אֱלֹהֵ֥י הַ/מִּשְׁפָּֽט־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/017.yaml
  text: You have wearied Yahweh with your words. Yet you say[a], “How have we wearied him?” By saying, “Everyone who does evil is good in the eyes of Yahweh, and he delights in them,” or, “Where is the God of justice?”
  footnotes:
  - marker: a
    text: Or “the God of judgment.”
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 말로 야훼를 지치게 하셨습니다. 그런데도 “우리가 어떻게 그를 지치게 했다는 것입니까?” 하고 말합니다. 곧 “악을 행하는 자마다 야훼의 눈에 좋게 보이며, 그가 그들을 기뻐하신다” 하거나, “정의의 하나님은 어디 계십니까?” 하는 말로 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “심판의 하나님.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹגַעְתֶּם / הוֹגָעְנוּ
  english_pob_choice: have wearied / have we wearied
  chosen_korean: 지치게 하셨습니다 / 지치게 했다는 것입니까
  alternatives_korean:
  - 피곤하게 하셨습니다
  - 괴롭히셨습니다
  lexicon: HALOT
  rationale: הוֹגַע은 ‘지치게 하다, 수고하게 하다’의 뜻이므로, 하나님의 인격적 반응을 살리면서도 과도하게 약화하지 않는 ‘지치게 하다’를 택했습니다.
- source_word: בְּדִבְרֵיכֶם / בֶּאֱמָרְכֶם
  english_pob_choice: with your words / By saying
  chosen_korean: 말로 / 말로 그렇습니다
  alternatives_korean:
  - 당신들의 말로
  - 말하는 것으로
  lexicon: HALOT
  rationale: 두 표현 모두 말이 수단이자 원인임을 나타내므로, 본문 흐름에 맞게 간결한 ‘말로’로 묶어 전달했습니다.
- source_word: אֱלֹהֵי הַמִּשְׁפָּט
  english_pob_choice: the God of justice
  chosen_korean: 정의의 하나님
  alternatives_korean:
  - 심판의 하나님
  - 공의의 하나님
  lexicon: HALOT
  rationale: מִשְׁפָּט는 여기서 단순한 판결보다 하나님이 세우시는 도덕적 질서와 정의를 가리키므로, 현대 한국어에서 그 뉘앙스를 분명히 드러내는 ‘정의의 하나님’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 계약적 고유명사 יְהוָה는 본 프로젝트 기본어인 ‘야훼’로 옮겨, 전통적 호칭으로 대체하지 않았습니다.
theological_decisions:
- issue: 하나님을 ‘지치게 하다’라는 인격적·비유적 표현 유지
  chosen_reading: 직역적 긴장을 살려 ‘지치게 하셨습니다’로 유지했습니다.
  alternative_readings:
  - ‘실망시키셨습니다’
  - ‘괴롭히셨습니다’
  rationale: 예언자적 책망의 날카로움은 본문의 비유적 표현에 있으므로, 이를 완화하지 않고 그대로 보존했습니다.
  doctrine_reference: Translation philosophy §3
- issue: 마지막 구절의 מִשְׁפָּט 의미
  chosen_reading: ‘정의’로 옮겨 하나님의 공정한 통치와 도덕적 질서를 드러냈습니다.
  alternative_readings:
  - ‘심판’
  - ‘판단’
  rationale: 문맥상 문제는 법정 판결 자체보다 하나님이 악을 바로잡는가 하는 질문이므로, 한국어에서 더 넓은 의미를 전달하는 ‘정의’가 적절합니다.
  doctrine_reference: Translation philosophy §6
