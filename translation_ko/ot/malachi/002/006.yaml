id: MAL.2.6
reference: Malachi 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תּוֹרַ֤ת אֱמֶת֙ הָיְתָ֣ה בְּ/פִ֔י/הוּ וְ/עַוְלָ֖ה לֹא נִמְצָ֣א בִ/שְׂפָתָ֑י/ו בְּ/שָׁל֤וֹם וּ/בְ/מִישׁוֹר֙ הָלַ֣ךְ אִתִּ֔/י וְ/רַבִּ֖ים הֵשִׁ֥יב מֵ/עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/006.yaml
  text: The law of truth was in his mouth[a], and no injustice was found on his lips. He walked with me in peace and uprightness[c][b], and he turned many back from iniquity.
  footnotes:
  - marker: a
    text: Or 'true instruction was in his mouth.'
    reason: lexical_alternative
  - marker: b
    text: Or 'no wrongdoing' or 'no unrighteousness was found on his lips.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he caused many to return from sin.'
    reason: lexical_alternative
translation:
  language: ko
  text: 진리의 율법이 그의 입에 있었고[a], 그의 입술에서는 불의가 발견되지 않았습니다[b]. 그는 평강과 정직함 가운데서 나와 함께 걸었고, 많은 사람을 죄악에서 돌이켰습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 입에 참된 가르침이 있었다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 입술에서는 잘못이나 불의가 발견되지 않았다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그가 많은 사람을 죄에서 돌아서게 했다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת אֱמֶת
  english_pob_choice: the law of truth
  chosen_korean: 진리의 율법
  alternatives_korean:
  - 참된 가르침
  - 진리의 가르침
  lexicon: HALOT
  rationale: תּוֹרָה의 율법/가르침 중 율법을 기본으로 살리되, אֱמֶת을 ‘진리의’로 옮겨 언약적·규범적 의미를 유지했습니다.
- source_word: בְּפִיהוּ / בִשְׂפָתָיו
  english_pob_choice: in his mouth / on his lips
  chosen_korean: 그의 입에 / 그의 입술에서는
  alternatives_korean:
  - 그의 말에 / 그의 말에서는
  lexicon: HALOT
  rationale: 히브리어의 신체 표현을 그대로 살려, 말과 가르침의 출처를 입과 입술에 두는 직설적 이미지를 보존했습니다.
- source_word: עַוְלָה
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 부정
  - 잘못
  - 불법
  lexicon: HALOT
  rationale: 윤리적 왜곡과 불공정을 가리키는 말로, 문맥상 ‘불의’가 가장 자연스럽고 정죄의 강도도 잘 드러냅니다.
- source_word: מִישׁוֹר
  english_pob_choice: uprightness
  chosen_korean: 바름
  alternatives_korean:
  - 정직
  - 곧음
  - 공평
  lexicon: HALOT
  rationale: מִישׁוֹר의 직선성·곧음 이미지를 살리면서, 평강과 평행을 이루는 도덕적 성품으로 한국어에서 간결하게 전달했습니다.
theological_decisions:
- issue: 제사장적 가르침을 나타내는 תּוֹרָה의 번역
  chosen_reading: ‘진리의 율법’으로 두어, 제사장적 교훈의 뜻을 지나치게 풀지 않았습니다.
  alternative_readings:
  - 참된 가르침
  - 진리의 교훈
  rationale: 이 구절은 레위 계열의 이상적 제사장/교사의 입을 묘사하므로, 설명적 풀이는 가능하지만 원문의 언약적 토라 성격을 약화시킬 수 있습니다.
  doctrine_reference: 번역 철학 §1, §5
- issue: ‘그는 나와 함께 걸었다’는 언약적 표현
  chosen_reading: ‘나와 함께 평강과 바름으로 걸었고’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 나와 친밀히 지냈고
  - 나 앞에서 바르게 행했고
  rationale: הלך אִתִּי는 단순한 동행을 넘어 하나님과의 언약적 교제를 가리키므로, 해설적 의역보다 원문의 관계성을 보존하는 편이 적절합니다.
  doctrine_reference: 번역 철학 §3
