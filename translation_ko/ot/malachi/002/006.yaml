- from: 진리의 율법이 그의 입에 있었고, 그의 입술에서는 불의가 발견되지 않았습니다. 그는 나와 함께 평강과 바름으로 걸었고, 많은 사람을 죄악에서 돌이켰습니다.[a][b][c]
