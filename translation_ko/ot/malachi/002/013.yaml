id: MAL.2.13
reference: Malachi 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זֹאת֙ שֵׁנִ֣ית תַּֽעֲשׂ֔וּ כַּסּ֤וֹת דִּמְעָה֙ אֶת מִזְבַּ֣ח יְהוָ֔ה בְּכִ֖י וַֽ/אֲנָקָ֑ה מֵ/אֵ֣ין ע֗וֹד פְּנוֹת֙ אֶל הַ/מִּנְחָ֔ה וְ/לָ/קַ֥חַת רָצ֖וֹן מִ/יֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/013.yaml
  text: 'And this second thing you do: you cover the altar of Yahweh with tears[a], with weeping and groaning, because he no longer regards the offering or accepts it with favor from your hand.'
  footnotes:
  - marker: a
    text: Or 'the grain offering.' The Hebrew מִנְחָה can denote a specific grain offering or, more broadly, an offering.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 두 번째 일도 행하십니다. 곧 눈물로, 울음과 탄식으로 야훼의 제단을 덮으니, 그분이 더 이상 제물을 돌아보지 않으시고 당신들 손에서 그것을 기꺼이 받지 않으시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제물’은 히브리어 מִנְחָה의 넓은 의미를 따른 번역입니다. 문맥에 따라 곡물 제사인 ‘소제’를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת שֵׁנִית
  english_pob_choice: And this second thing
  chosen_korean: 그리고 이 두 번째 일도
  alternatives_korean:
  - 그리고 이것을 두 번째로
  - 그리고 이것 또한
  lexicon: HALOT
  rationale: שֵׁנִית의 순차적·고발적 뉘앙스를 살리면서, 한국어에서는 ‘두 번째 일’이 가장 자연스럽게 반복 항목을 드러냅니다.
- source_word: כַּסּוֹת דִּמְעָה אֶת מִזְבַּח יְהוָה
  english_pob_choice: you cover the altar of Yahweh with tears
  chosen_korean: 눈물로 … 야훼의 제단을 덮으니
  alternatives_korean:
  - 눈물로 … 야훼의 제단을 가리니
  - 눈물로 … 야훼의 제단을 적시니
  lexicon: HALOT
  rationale: כסה의 기본 의미인 ‘덮다’를 그대로 살려, 슬픔이 제단을 뒤덮는 강한 이미지를 보존했습니다.
- source_word: בְּכִי וַאֲנָקָה
  english_pob_choice: with weeping and groaning
  chosen_korean: 울음과 탄식
  alternatives_korean:
  - 울음과 신음
  - 우는 것과 신음
  lexicon: HALOT
  rationale: בְּכִי와 אֲנָקָה의 짝을 한국어의 병렬 표현으로 옮기되, 예배 문맥에 어울리는 ‘탄식’으로 고통의 소리를 드러냈습니다.
- source_word: מֵאֵין עוֹד פְּנוֹת אֶל הַמִּנְחָה
  english_pob_choice: because he no longer regards the offering
  chosen_korean: 그분이 더 이상 제물을 돌아보지 않으시기 때문입니다
  alternatives_korean:
  - 더 이상 제물을 주목하지 않으시기 때문입니다
  - 더 이상 제물 쪽으로 돌이키지 않으시기 때문입니다
  lexicon: HALOT
  rationale: פנה אל의 화용적 의미를 ‘돌아보다’로 옮겨, POB의 해석인 ‘regards’와 본문이 말하는 불수납의 뜻을 함께 살렸습니다.
- source_word: מִנְחָה
  english_pob_choice: the offering
  chosen_korean: 제물
  alternatives_korean:
  - 소제
  - 예물
  - 헌물
  lexicon: HALOT
  rationale: 문맥상 특정한 곡물 제사로 한정하기보다, 하나님께 드리는 제의적 ‘제물’로 넓게 옮기는 것이 POB의 유보를 반영합니다.
- source_word: וְלָקַחַת רָצוֹן מִיֶּדְכֶם
  english_pob_choice: accepts it with favor from your hand
  chosen_korean: 당신들 손에서 그것을 기꺼이 받지 않으시기
  alternatives_korean:
  - 당신들 손에서 그것을 호의로 받지 않으시기
  - 당신들 손에서 그것을 받아 주지 않으시기
  lexicon: HALOT
  rationale: לקח + רצון은 단순 수령보다 ‘기꺼이 받음/호의로운 수납’의 관용적 의미가 있어, 한국어에서도 ‘기꺼이 받다’로 예배 수납의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 제단을 더럽히는 눈물의 이미지와 제의적 거절의 관계
  chosen_reading: 하나님께서 그들의 예배를 수납하지 않으시는 상태를 직접적으로 드러내는 심판적 고발로 옮겼습니다.
  alternative_readings:
  - 단순히 감정적 슬픔의 묘사로 완화하는 번역
  - 제의적 거절의 원인을 흐리는 번역
  rationale: 본문은 슬픔 자체보다, 그들의 행위가 야훼의 제단을 덮을 만큼 심각하며 결국 제물을 받지 않으시는 결과로 이어진다는 점을 강조합니다.
  doctrine_reference: 예배의 진정성과 하나님의 수납 여부를 분명히 드러내는 선지자적 고발
