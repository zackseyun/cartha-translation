source:
  edition: WLC
  text: אִם לֹ֣א תִשְׁמְע֡וּ וְ/אִם לֹא֩ תָשִׂ֨ימוּ עַל לֵ֜ב לָ/תֵ֧ת כָּב֣וֹד לִ/שְׁמִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וְ/שִׁלַּחְתִּ֤י בָ/כֶם֙ אֶת הַ/מְּאֵרָ֔ה וְ/אָרוֹתִ֖י אֶת בִּרְכֽוֹתֵי/כֶ֑ם וְ/גַם֙ אָרוֹתִ֔י/הָ כִּ֥י אֵינְ/כֶ֖ם שָׂמִ֥ים עַל לֵֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/002.yaml
  text: If you will not listen[a], and if you will not take it to heart to give glory to my name, says Yahweh of Armies, then I will send the curse among you, and I will curse your blessings; indeed, I have already cursed them[b], because you are not taking it to heart.
  footnotes:
  - marker: a
    text: Or, 'the LORD of Hosts.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew could also be understood, 'I also will curse them,' or with a singular sense, 'I have cursed it.'
    reason: alternative_reading
translation:
  language: ko
  text: 너희가 듣지 않고 내 이름에 영광을 돌리는 일을 마음에 두지 않으면 — 만군의 야훼께서 말씀하십니다[a] — 내가 너희 가운데에 저주를 보내고 너희의 복을 저주하겠으며, 참으로 이미 그것들을 저주하였나니[b], 이는 너희가 마음에 두지 않기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군의 주님’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 동사는 ‘또 그것들을 저주하겠다’로도 이해할 수 있습니다. 여성 단수 접미사는 집합적으로 ‘그것들을’을 가리킬 수도 있고, 단수로 ‘그것을’이라고 이해할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמְעוּ
  english_pob_choice: listen
  chosen_korean: 듣지
  alternatives_korean:
  - 들으려 하지
  - 순종하지
  lexicon: HALOT
  rationale: שמע의 기본 감각인 ‘듣다/들어주다’를 살리면서, 언약 경고 문맥의 순종 뉘앙스는 과도하게 풀지 않고 문맥에 맡겼습니다.
- source_word: תָשִׂימוּ עַל לֵב
  english_pob_choice: take it to heart
  chosen_korean: 마음에 두지
  alternatives_korean:
  - 마음에 새기지
  - 가슴에 두지
  lexicon: HALOT
  rationale: 히브리어 관용구의 내면화·유념의 뜻을 자연스러운 한국어로 옮기되, 반복되는 수사 구조가 드러나도록 같은 표현을 유지했습니다.
- source_word: כָּבוֹד לִשְׁמִי
  english_pob_choice: to give glory to my name
  chosen_korean: 내 이름에 영광을 돌리도록
  alternatives_korean:
  - 내 이름을 존귀하게 여기도록
  - 내 이름에 영예를 드리도록
  lexicon: HALOT
  rationale: כָּבוֹד는 ‘영광’이 예언서의 신학적 어휘와 잘 맞고, לִשְׁמִי는 여호와의 계시된 이름에 대한 존귀를 가리키므로 이를 직접 살렸습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 야훼는 본문의 신명 표기를 직접 반영하고, צְבָאוֹת는 전통적 ‘만군’으로 옮겨 군대적·우주적 권위의 뉘앙스를 보존했습니다.
- source_word: וְשִׁלַּחְתִּי בָכֶם אֶת הַמְּאֵרָה
  english_pob_choice: I will send the curse among you
  chosen_korean: 내가 너희 가운데에 저주를 보내고
  alternatives_korean:
  - 내가 너희 위에 저주를 보내고
  - 내가 너희에게 저주를 보내고
  lexicon: HALOT
  rationale: בָכֶם의 집합적 대상성을 자연스럽게 살리기 위해 ‘너희 가운데에’로 옮겨, 저주가 공동체 내부로 파고드는 이미지를 유지했습니다.
- source_word: וְאָרוֹתִי אֶת בִּרְכוֹתֵיכֶם
  english_pob_choice: I will curse your blessings
  chosen_korean: 너희의 복을 저주하겠으며
  alternatives_korean:
  - 너희의 복을 저주하고
  - 너희의 복들을 저주하겠으며
  lexicon: HALOT
  rationale: ‘복들’로 분해하기보다 히브리어 복수 명사를 집합적으로 처리하여, 축복의 전반을 거스르는 선언이라는 점을 드러냈습니다.
- source_word: וְגַם אָרוֹתִי/הָ
  english_pob_choice: indeed, I have already cursed them
  chosen_korean: 참으로 이미 그것들을 저주하였나니
  alternatives_korean:
  - 또한 그것들을 저주하겠나니
  - 참으로 그것들도 저주하였나니
  lexicon: HALOT
  rationale: 예언적 완료의 이미-시작된 심판 감각을 살리되, 히브리어의 성별·수 일치가 불확실한 대명사는 한국어에서 중립적인 ‘그것들’로 처리했습니다.
- source_word: כִּי אֵינְכֶם שָׂמִים עַל לֵב
  english_pob_choice: because you are not taking it to heart
  chosen_korean: 이는 너희가 마음에 두지 않기 때문입니다
  alternatives_korean:
  - 이는 너희가 마음에 새기지 않기 때문입니다
  - 이는 너희가 유념하지 않기 때문입니다
  lexicon: HALOT
  rationale: 앞선 관용구와 호응시키면서 원인의 반복을 분명히 하기 위해 동일한 한국어 핵심어를 재사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 신명 표기를 가리고 전통 관용어로 대체하지 않기 위해, 본문에는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 마지막 완료형 אָרוֹתִי/הָ의 시제·상
  chosen_reading: 이미 저주하였나니
  alternative_readings:
  - 또 저주하겠나니
  - 저주하였나이다
  rationale: 문맥이 경고의 미래에서 이미 시작된 심판으로 이동하므로, 완료형의 성취감과 긴박함을 살려 ‘이미’로 반영했습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
