  source_fidelity: 본문의 기본 의미와 경고의 진행은 대체로 충실합니다. 다만 마지막 완료형 אָרוֹתִיהָ의 시제 및 여성 단수 접미사의 불확실성을 각주에서 더 온전히 보존해야 합니다. 본문의 ‘이미’는 문맥적으로 가능한 해석이지만, 본문에 명시되지 않은 시간 부사이므로 각주가 그 대안을 분명히 밝혀야 합니다.
