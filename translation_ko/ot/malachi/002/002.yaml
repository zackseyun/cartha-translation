  terminology: ‘야훼’, ‘만군’, ‘영광’, ‘복’, ‘저주’는 원문의 신명과 핵심 어휘를 적절히 반영합니다. 신명 대안에 관한 각주는 해당 표현 바로 뒤에, 마지막 동사 해석 각주는 해당 동사 바로 뒤에 배치해야 합니다.
