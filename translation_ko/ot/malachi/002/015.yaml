id: MAL.2.15
reference: Malachi 2:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא אֶחָ֣ד עָשָׂ֗ה וּ/שְׁאָ֥ר ר֨וּחַ֙ ל֔/וֹ וּ/מָה֙ הָֽ/אֶחָ֔ד מְבַקֵּ֖שׁ זֶ֣רַע אֱלֹהִ֑ים וְ/נִשְׁמַרְתֶּם֙ בְּ/ר֣וּחֲ/כֶ֔ם וּ/בְ/אֵ֥שֶׁת נְעוּרֶ֖י/ךָ אַל יִבְגֹּֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/015.yaml
  text: Did not the one God make them[a]? Yet a remnant of the Spirit was his. And what was the one seeking? Godly offspring. So guard yourselves in your spirit[c][b], and let no one deal treacherously with the wife of his youth.
  footnotes:
  - marker: a
    text: 'Hebrew is difficult: ''Did not one make, and a remnant of spirit was his?'' Other interpretations include, ''No one with even a remnant of spirit does this,'' or taking ''the one'' as Abraham.'
    reason: alternative_reading
  - marker: b
    text: Or 'a remnant of spirit was his'; possibly 'he had abundance of spirit.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'seed of God'; also rendered 'godly seed' or 'offspring of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 한 분이 그들을 만들지 않았습니까? 그러나 그의 몫으로는 영의 남은 부분이 있었습니다. 그런데 그 한 분이 무엇을 찾으셨습니까? 하나님을 닮은 자손입니다. 그러므로 여러분의 영을 지키고, 자기 젊은 시절의 아내에게 배신을 저지르는 사람이 없게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 매우 난해합니다. ‘한 분이 만들었고, 그의 몫으로 영의 남은 부분이 있었다’처럼 읽을 수도 있고, ‘영의 남은 부분이라도 가진 자가 이런 일을 하지 않는다’로 볼 수도 있으며, ‘한 분’을 아브라함으로 이해하는 견해도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그에게는 영의 남은 부분이 있었다’; ‘그에게는 영이 풍성했다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘하나님의 씨/자손’입니다. ‘하나님을 닮은 자손’ 또는 ‘경건한 자손’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא אֶחָ֣ד עָשָׂ֗ה
  english_pob_choice: Did not the one God make them?
  chosen_korean: 한 분이 그들을 만들지 않았습니까?
  alternatives_korean:
  - 한 분이 만들지 않았습니까?
  - 한 분 하나님이 그들을 만들지 않았습니까?
  lexicon: HALOT
  rationale: 히브리어는 압축적이고 주어가 생략된 듯한 난해한 구조이므로, 한국어에서는 자연스러운 반문으로 풀되 본문이 직접 말하지 않는 ‘하나님’을 본문 안에 넣지 않았습니다. 영어 POB의 해석적 보충은 주석으로만 유지했습니다.
- source_word: וּ/שְׁאָ֥ר ר֨וּחַ֙ ל֔/וֹ
  english_pob_choice: Yet a remnant of the Spirit was his.
  chosen_korean: 그러나 그의 몫으로는 영의 남은 부분이 있었습니다.
  alternatives_korean:
  - 그러나 그에게는 영의 남은 부분이 있었습니다.
  - 그에게는 영의 잔여가 있었습니다.
  - 그에게는 성령의 남은 부분이 있었습니다.
  lexicon: HALOT
  rationale: שְׁאָר는 ‘남은 부분/잔여’의 뜻을 살렸고, רוּחַ는 본문이 명시적으로 구별하지 않는 만큼 기본값인 ‘영’으로 두었습니다. ‘그의 몫으로는’은 לּוֹ의 소유/귀속 관계를 반영합니다.
- source_word: זֶ֣רַע אֱלֹהִ֑ים
  english_pob_choice: Godly offspring
  chosen_korean: 하나님을 닮은 자손
  alternatives_korean:
  - 하나님께 속한 자손
  - 경건한 자손
  - 하나님의 자손
  lexicon: HALOT
  rationale: זֶרַע는 현대 한국어에서 ‘씨’보다 ‘자손’이 자연스럽고, אֱלֹהִים은 소유격보다 질적 의미가 강하므로 ‘하나님을 닮은’으로 옮겨 결혼 문맥의 목적을 살렸습니다. 영어의 ‘godly offspring’에 해당하는 의미를 너무 교회적 관용어로 굳히지 않았습니다.
- source_word: וְ/נִשְׁמַרְתֶּם֙ בְּ/ר֣וּחֲ/כֶ֔ם
  english_pob_choice: So guard yourselves in your spirit
  chosen_korean: 그러므로 여러분의 영을 지키고
  alternatives_korean:
  - 그러므로 여러분의 영 안에서 스스로를 지키고
  - 그러므로 여러분의 영에 주의하고
  - 그러므로 여러분의 영을 살피고
  lexicon: HALOT
  rationale: 니팔형은 반사적 의미를 지녀 ‘지키다/보호하다’로 옮기고, בְּרוּחֲכֶם는 ‘영 안에서’보다 간결한 목적격 표현으로 처리해 내적 경계의 초점을 살렸습니다. 영어 POB의 관용적 보충인 ‘yourselves’는 한국어에서는 동사 선택으로 충분히 전달됩니다.
- source_word: וּ/בְ/אֵ֥שֶׁת נְעוּרֶ֖י/ךָ אַל יִבְגֹּֽד
  english_pob_choice: and let no one deal treacherously with the wife of his youth
  chosen_korean: 자기 젊은 시절의 아내에게 배신을 저지르는 사람이 없게 하십시오
  alternatives_korean:
  - 자기 젊은 시절의 아내를 배신하지 않게 하십시오
  - 젊은 시절의 아내에게 불성실하게 굴지 않게 하십시오
  - 젊은 시절의 아내를 향해 배신하지 말게 하십시오
  lexicon: HALOT
  rationale: בגד는 언약적 배신의 뉘앙스가 강해 ‘배신하다/배신을 저지르다’로 옮겼습니다. 3인칭 단수 금지형의 일반성을 한국어에서는 ‘사람이 없게 하십시오’로 풀어 자연스럽게 만들었습니다.
theological_decisions:
- issue: 첫 절의 난해한 주어를 어떻게 처리할 것인가
  chosen_reading: 본문이 압축되어 있으므로 ‘한 분이 그들을 만들지 않았습니까?’로 옮겨 문맥상 창조자이신 한 분의 행위를 암시하되, 본문에 없는 해석어 ‘하나님’을 본문 안에 직접 삽입하지는 않았습니다.
  alternative_readings:
  - ‘한 분 하나님이 그들을 만들지 않았습니까?’
  - ‘한 분이 만들지 않았습니까?’
  - 본문은 주어를 확정하기 어렵다
  rationale: 히브리어의 축약성과 문맥의 결합을 한국어에서 모두 보존하려면 과도한 해석과 과도한 직역 사이의 균형이 필요합니다. 본문이 실제로 말하는 범위를 넘지 않으면서도 독자가 이해할 수 있게 하는 방향을 택했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: רוּחַ를 ‘영’으로 둘지 ‘성령’으로 볼지
  chosen_reading: ‘영’
  alternative_readings:
  - ‘성령’
  - ‘영의 남은 부분’
  rationale: 히브리어 본문은 대문자 구분이 없고, 이 구절의 רוּחַ는 문맥상 신적 영인지 인간의 내적 영인지가 논쟁적입니다. 한국어 본문에서는 해석을 고정하지 않고 ‘영’으로 두어 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
