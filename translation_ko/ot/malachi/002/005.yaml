  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּרִיתִ֣/י הָיְתָ֣ה אִתּ֗/וֹ הַֽ/חַיִּים֙ וְ/הַ֨/שָּׁל֔וֹם וָ/אֶתְּנֵֽ/ם ל֥/וֹ מוֹרָ֖א וַ/יִּֽירָאֵ֑/נִי וּ/מִ/פְּנֵ֥י שְׁמִ֖/י נִחַ֥ת הֽוּא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/005.yaml
  text: My covenant with him was one of life and peace[a], and I gave them to him; this called for reverence, and he revered me[b], and he stood in awe before my name.
  footnotes:
  - marker: a
    text: Or 'for fear' or 'for reverence'; the Hebrew syntax after 'I gave them to him' is compressed.
    reason: lexical_alternative
  - marker: b
    text: Or 'he was humbled,' 'he trembled,' or 'he was dismayed' before my name.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 언약은 그와 함께 있었으니, 생명과 평강이었습니다. 나는 그것들을 그에게 주었습니다.[a] 이는 경외를 위한 것이었고, 그는 나를 경외했으며, 내 이름 앞에서 떨었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내가 그것들을 그에게 주었다’ 뒤의 구문이 압축되어 있습니다. ‘경외를 위하여’ 또는 ‘두려움으로’라고도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그가 내 이름 앞에서 겸손해졌다’, ‘두려워했다’ 또는 ‘낙담했다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיתִי
  english_pob_choice: My covenant
  chosen_korean: 내 언약
  alternatives_korean:
  - 나의 언약
  lexicon: HALOT
  rationale: בְּרִית은 문맥상 '언약'이 가장 직접적이며, 1인칭 소유를 간결하게 살려 '내 언약'으로 옮겼습니다.
- source_word: הָיְתָה אִתּוֹ
  english_pob_choice: was with him
  chosen_korean: 그와 함께
  alternatives_korean:
  - 그와 함께 있었습니다
  - 그에게 속해 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 관계 구문을 한국어에서는 자연스럽게 풀어 '그와 함께'로 옮겨, 언약의 동반 관계를 살렸습니다.
- source_word: הַחַיִּים וְהַשָּׁלוֹם
  english_pob_choice: life and peace
  chosen_korean: 생명과 평강
  alternatives_korean:
  - 생명과 평화
  - 삶과 평강
  lexicon: HALOT
  rationale: חַיִּים은 단순한 생물학적 생명보다 언약적 생명으로 읽히므로 '생명'이 적절하고, שָׁלוֹם은 POB 기본어휘에 맞춰 '평강'으로 옮겼습니다.
- source_word: מוֹרָא
  english_pob_choice: this called for reverence / as fear
  chosen_korean: 경외를 불러일으켰고
  alternatives_korean:
  - 두려움을 요구했고
  - 경외가 되었습니다
  lexicon: HALOT
  rationale: 문장이 압축되어 있어 מוֹרָא의 의미를 그대로 살리되, 다음 절의 반응과 연결되도록 '경외를 불러일으켰고'로 풀었습니다.
- source_word: וַיִּירָאֵנִי
  english_pob_choice: and he revered/fared me
  chosen_korean: 그는 나를 경외했으며
  alternatives_korean:
  - 그는 나를 두려워했으며
  - 그는 나를 경외하였고
  lexicon: HALOT
  rationale: ירא는 이 문맥에서 공포보다 경건한 경외를 뜻하므로 '경외하다'를 택해 מוֹרָא와 어휘 연결을 유지했습니다.
- source_word: נִחַת
  english_pob_choice: he stood in awe / he was humbled, trembled, or dismayed
  chosen_korean: 떨었습니다
  alternatives_korean:
  - 겸손해졌습니다
  - 놀라움에 사로잡혔습니다
  lexicon: HALOT
  rationale: נחת/חתת 계열의 상태를 한국어에서 가장 직접적으로 드러내는 표현으로 '떨었습니다'를 선택해, 긍정적이지만 엄중한 반응을 보존했습니다.
theological_decisions:
- issue: mōra와 yarēʼ의 정서적 강도
  chosen_reading: 이 구절은 하나님 앞의 공포보다 언약적 경외를 말합니다.
  alternative_readings:
  - 두려움과 떨림의 더 강한 정서를 강조할 수 있습니다.
  rationale: 생명과 평강의 언약이라는 긍정적 문맥 안에서, פחד류의 공포보다 경외와 존중의 반응으로 읽는 것이 전체 흐름을 더 잘 반영합니다.
  doctrine_reference: Translation philosophy §3, §6
