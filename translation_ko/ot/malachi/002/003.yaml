  source_fidelity: ‘그것과 함께 끌려갈 것입니다’는 마지막 구절의 전치사 אֵלָיו(‘그것에게로/그곳으로’)를 ‘함께’로 바꾸어 버립니다. 이 난해한 절의 선행사와 주어는 단정할 수 없으므로, 본문에서는 목적·방향 관계를 유지하고 각주에서 불확실성을 밝혀야 합니다. 또한 절기 관련 명사는 히브리어상 단순히 ‘너희 절기들’이므로, ‘절기에 바친 제물’은 문맥적 풀이임을 각주에서 분명히 해야 합니다.
  naturalness: ‘너희 절기 제물의 똥’보다 ‘너희 절기에 바친 제물의 똥’이 현대 한국어에서 더 자연스럽습니다. ‘똥’은 격식 있는 문맥에서는 거칠지만, 원문의 의도적인 불결함과 모욕성을 자연스럽게 보존할 수 있습니다. 합쇼체 종결을 일관되게 유지했습니다.
  terminology: הַזֶּרַע는 농업적 ‘씨’와 후손의 뜻을 함께 가질 수 있으므로 ‘너희의 씨’를 유지합니다. פֶּרֶשׁ는 완곡화하지 않고 ‘똥’으로 옮깁니다. 마지막 절은 제사장들의 제거라는 가능한 문맥적 이해를 각주에만 제시하고, 본문은 히브리어의 모호성을 보존합니다.
