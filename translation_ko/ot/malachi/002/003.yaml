id: MAL.2.3
reference: Malachi 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֨י גֹעֵ֤ר לָ/כֶם֙ אֶת הַ/זֶּ֔רַע וְ/זֵרִ֤יתִי פֶ֨רֶשׁ֙ עַל פְּנֵי/כֶ֔ם פֶּ֖רֶשׁ חַגֵּי/כֶ֑ם וְ/נָשָׂ֥א אֶתְ/כֶ֖ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/002/003.yaml
  text: Look[a], I am rebuking your offspring[c][b], and I will spread dung on your faces—the dung of your festival sacrifices—and one will carry you away with it.
  footnotes:
  - marker: a
    text: Or 'your seed'; some take this as a reference to grain or crops rather than offspring.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'the dung of your festivals'; this likely refers to the refuse from animals offered at the festivals.
    reason: lexical_alternative
  - marker: c
    text: The final clause is difficult. It likely means that the priests will be removed along with the dung/offal to an unclean place.
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오[a], 내가 너희의 씨를 책망하겠습니다[c][b]. 내가 너희 얼굴에 똥, 곧 너희 절기 제물의 똥을 뿌릴 것이며, 너희는 그것과 함께 끌려갈 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보라’; 예언적 주의를 환기하는 감탄사입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘너희의 절기들’입니다. 여기서는 절기에 바쳐진 제물의 똥을 가리키는 것으로 이해했습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 압축되어 있어 해석이 어렵습니다. 제사장들이 그 똥과 함께 부정한 곳으로 제거된다는 뜻으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 내가 있다
  lexicon: BDB
  rationale: 예언적 선언의 주의를 환기하는 감탄사는 현대 한국어에서 ‘보십시오’가 합쇼체와 잘 맞고, 곧이어 오는 심판 선언의 긴박함도 살립니다.
- source_word: גֹעֵר
  english_pob_choice: am rebuking
  chosen_korean: 책망하겠습니다
  alternatives_korean:
  - 꾸짖겠습니다
  - 경고하겠습니다
  lexicon: HALOT
  rationale: גער의 핵심은 꾸짖음/책망이며, 본문이 제사장들에 대한 심판 선언이므로 단순 경고보다 ‘책망’이 더 직접적입니다.
- source_word: הַזֶּרַע
  english_pob_choice: your offspring
  chosen_korean: 너희의 씨
  alternatives_korean:
  - 너희의 후손
  - 너희의 자손
  - 너희의 씨앗
  lexicon: HALOT
  rationale: 히브리어 זֶרַע는 문맥에 따라 후손/자손 또는 씨를 뜻하므로, 본문 단어에 더 밀착한 ‘씨’를 유지하되 한국어에서 생물학적·계승적 의미가 함께 느껴지도록 했습니다.
- source_word: פֶּרֶשׁ
  english_pob_choice: dung
  chosen_korean: 똥
  alternatives_korean:
  - 분뇨
  - 오물
  - 거름
  lexicon: HALOT
  rationale: 의도적으로 모욕적이고 불결한 이미지를 드러내는 어휘이므로, 완곡한 표현보다 직접적인 ‘똥’이 원문의 충격을 가장 잘 전달합니다.
- source_word: פֶּרֶשׁ חַגֵּיכֶם
  english_pob_choice: the dung of your festival sacrifices
  chosen_korean: 너희 절기 제물의 똥
  alternatives_korean:
  - 너희 절기의 똥
  - 너희 절기들의 똥
  - 너희 축제 제물의 똥
  lexicon: HALOT
  rationale: חַגֵּיכֶם은 문자적으로 ‘너희의 절기들’이지만, 여기서는 절기에 바쳐진 제물의 오염을 가리키므로 POB의 해석을 따라 ‘절기 제물’로 풀었습니다.
- source_word: וְנָשָׂא אֶתְכֶם אֵלָיו
  english_pob_choice: and one will carry you away with it
  chosen_korean: 너희는 그것과 함께 끌려갈 것입니다
  alternatives_korean:
  - 누군가 너희를 그것과 함께 끌고 갈 것입니다
  - 그것이 너희를 그것에게로 가져갈 것입니다
  - 너희는 그것과 함께 옮겨질 것입니다
  lexicon: HALOT
  rationale: 동사와 대명사의 결합이 압축적이므로, 불특정 행위자를 한국어에 자연스럽게 반영하면서도 ‘그것과 함께’라는 연합된 제거/수치의 뜻을 살렸습니다.
theological_decisions:
- issue: 'הַזֶּרַע의 의미: 농작물인가, 후손인가'
  chosen_reading: ‘씨’로 번역하되, 문맥상 후손/계승에 열려 있게 유지했습니다.
  alternative_readings:
  - 농작물/곡식
  - 후손/자손
  rationale: 제사장 심판 맥락에서 농업적 의미보다 혈통적·계승적 의미가 더 유력하지만, 히브리어 자체의 다의성을 지우지 않기 위해 한국어는 ‘씨’를 택했습니다.
  doctrine_reference: 본문 문맥과 어휘 다의성
