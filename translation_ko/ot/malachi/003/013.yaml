  text: חָזְק֥וּ עָלַ֛/י דִּבְרֵי/כֶ֖ם אָמַ֣ר יְהוָ֑ה וַ/אֲמַרְתֶּ֕ם מַה נִּדְבַּ֖רְנוּ עָלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/013.yaml
  text: Your words have been hard against me[a], says Yahweh. But you say, “What have we spoken against you?”
  footnotes:
  - marker: a
    text: Or 'Your words have been harsh against me.' The Hebrew literally says 'have been strong against me,' using 'strong' idiomatically for forceful or severe speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하십니다. “너희의 말이 나를 거슬러 거셌습니다[a].” 그러나 너희는 말합니다. “우리가 당신을 거슬러 무슨 말을 했습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 말이 나를 거슬러 심했습니다.’ 히브리어는 문자적으로 ‘너희의 말이 나를 거슬러 강했습니다’라고 하며, 여기서 ‘강하다’는 강경하거나 가혹한 말을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזְקוּ עָלַי דִּבְרֵיכֶם
  english_pob_choice: Your words have been hard against me
  chosen_korean: 너희의 말이 나에게 거슬렀습니다
  alternatives_korean:
  - 너희의 말이 나에게 강했습니다
  - 너희의 말이 나에게 심했습니다
  - 너희의 말이 나에게 거셌습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘강하다’는 말이 여기서는 사람을 향한 강경하고 해로운 언사를 뜻하므로, 한국어에서는 의미를 살려 ‘거슬렀습니다’로 옮겨 불쾌하고 공격적인 뉘앙스를 드러냈습니다.
- source_word: דִּבְרֵיכֶם
  english_pob_choice: your words
  chosen_korean: 너희의 말
  alternatives_korean:
  - 너희의 말들
  - 너희의 발언
  - 너희의 언사
  lexicon: HALOT
  rationale: 복수형 ‘말들’을 직역하기보다, 한국어에서 자연스러운 집합적 표현인 ‘말’로 옮겨 원문의 의미를 간결하게 살렸습니다.
- source_word: וַאֲמַרְתֶּם
  english_pob_choice: But you say
  chosen_korean: 그런데 너희는 말합니다
  alternatives_korean:
  - 그러나 너희는 말합니다
  - 하지만 너희는 말합니다
  - 그렇지만 너희는 말합니다
  lexicon: HALOT
  rationale: 대조를 이루는 접속을 살리면서도 말다툼 구조를 자연스럽게 드러내기 위해 ‘그런데’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 여호와
  lexicon: project default + context
  rationale: 본문의 신적 발화 표지는 한국어 독자에게 직접적인 예언자적 화법으로 읽히도록 ‘주님’으로 처리하되, 본문 자체는 합쇼체의 서술형으로 유지했습니다.
theological_decisions:
- issue: 말의 성격을 ‘강하다’의 직역으로 둘지, 공격성과 불쾌함을 드러낼지
  chosen_reading: ‘거슬렀습니다’로 옮겨 말이 하나님을 향한 반역적·모욕적 성격임을 드러냈습니다.
  alternative_readings:
  - ‘강했습니다’로 직역
  - ‘심했습니다’로 완화
  - ‘거셌습니다’로 표현
  rationale: 문맥은 단순한 말의 세기보다 하나님께 대한 불경한 항변을 고발합니다. 따라서 한국어에서는 어감상 공격성과 불쾌함이 살아나는 표현이 본문의 논지를 더 잘 전달합니다.
  doctrine_reference: Malachi 3:13 context; prophetic disputation speech
- issue: ‘주님’의 표기와 예언자적 직접화법
  chosen_reading: 예언자 서술문은 합쇼체로 유지하고, 인용문 안의 사람들의 반문도 합쇼체를 유지했습니다.
  alternative_readings:
  - 인용문을 반말로 처리
  - 보다 문어적인 고어체 사용
  rationale: 현대 표준어 합쇼체를 기본으로 하되, 본문의 논쟁적 구조를 보존하기 위해 직접화법의 경계만 분명히 했습니다.
  doctrine_reference: Korean style guidance
