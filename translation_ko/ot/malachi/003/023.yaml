source:
  edition: WLC
  text: הִנֵּ֤ה אָֽנֹכִי֙ שֹׁלֵ֣חַ לָ/כֶ֔ם אֵ֖ת אֵלִיָּ֣ה הַ/נָּבִ֑יא לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/023.yaml
  text: Look[b][a], I am sending Elijah the prophet to you before the coming of the great and fearful day of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the great and terrible day of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''Elijah'' may be understood literally or as an Elijah-like forerunner; the Hebrew text itself simply says ''Elijah the prophet.'''
    reason: cross_reference
translation:
  language: ko
  text: 보십시오[a], 내가 엘리야 선지자를 여러분에게 보내기[b] 전에, 곧 야훼의 크고 두려운 날이 오기 전에 보내겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '야훼의 크고 두려운 날'로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: '''엘리야''는 문자 그대로의 엘리야를 뜻할 수도 있고, 엘리야 같은 선구자를 가리킬 수도 있습니다. 히브리어 본문은 단지 ''엘리야 선지자''라고 말합니다.'
    reason: cross_reference
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 끄는 감탄을 현대 합쇼체로 옮기되, 단순 서술보다 즉각성을 살렸습니다.
- source_word: אֵלִיָּה הַנָּבִיא
  english_pob_choice: Elijah the prophet
  chosen_korean: 엘리야 선지자
  alternatives_korean:
  - 엘리야 예언자
  - 선지자 엘리야
  lexicon: HALOT
  rationale: 고유명사는 음역하고, הַנָּבִיא는 직함으로 풀어 옮겼습니다. 한국어 성경에서 통용되는 '선지자'를 사용하되, 본문이 단순히 엘리야를 직접 지칭한다는 점은 유지했습니다.
- source_word: לִפְנֵי בּוֹא
  english_pob_choice: before the coming of
  chosen_korean: 오기 전에
  alternatives_korean:
  - 도래하기 전에
  - 임하기 전에
  lexicon: HALOT
  rationale: לִפְנֵי + 부정사 구문은 한국어에서 자연스러운 시간 부사절로 옮기는 것이 가장 직접적입니다.
- source_word: יוֹם יְהוָה הַגָּדוֹל וְהַנּוֹרָא
  english_pob_choice: the great and fearful day of Yahweh
  chosen_korean: 야훼의 크고 두려운 날
  alternatives_korean:
  - 야훼의 크고 무서운 날
  - 야훼의 크고 엄위로운 날
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기준에 따라 야훼로 옮기고, הַנּוֹרָא의 공포·두려움의 뉘앙스를 살리기 위해 '두려운'을 택했습니다. '크고'는 규모와 중대성을 함께 보존합니다.
theological_decisions:
- issue: 엘리야의 지시 대상
  chosen_reading: 본문에는 해석을 덧붙이지 않고 '엘리야 선지자'로 직역했습니다.
  alternative_readings:
  - 엘리야 같은 선구자
  - 엘리야의 영과 능력으로 오는 인물
  rationale: 히브리어는 해석적 확장을 붙이지 않고 엘리야를 직접 명명합니다. 이후의 전승적 연결은 주석이나 대조 구절에서 다루는 편이 본문 충실성에 맞습니다.
  doctrine_reference: 원문 우선과 본문-주석 구분
