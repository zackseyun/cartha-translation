    reason: cross_reference
  revision_rationale: 파송의 대상과 시간 부사절의 수식을 원문대로 회복했습니다. הִנֵּה의 선언적 기능은 '보십시오'로, שֹׁלֵחַ의 예언적 미래성은 자연스러운 한국어 합쇼체 '보내겠습니다'로 옮겼습니다. 번역 대안 각주는 '두려운'에 직접 연결하고, 엘리야의 지시 대상에 관한 비해석적 각주는 유지했습니다.
