id: MAL.3.20
reference: Malachi 3:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/זָרְחָ֨ה לָ/כֶ֜ם יִרְאֵ֤י שְׁמִ/י֙ שֶׁ֣מֶשׁ צְדָקָ֔ה וּ/מַרְפֵּ֖א בִּ/כְנָפֶ֑י/הָ וִֽ/יצָאתֶ֥ם וּ/פִשְׁתֶּ֖ם כְּ/עֶגְלֵ֥י מַרְבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/020.yaml
  text: But for you who fear my name[a], the sun of righteousness will rise with healing in its wings[c][b]; and you will go out and leap like calves from the stall.
  footnotes:
  - marker: a
    text: Or 'the sun of vindication.' The Hebrew צדקה can carry the sense of righteousness, justice, or vindication.
    reason: lexical_alternative
  - marker: b
    text: Or 'in its rays.' Hebrew 'wings' can be used metaphorically for the extremities or rays of the sun.
    reason: lexical_alternative
  - marker: c
    text: Or 'skip' or 'frolic.' The Hebrew verb is rare and may denote exuberant movement; some have understood it as 'grow fat.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내 이름을 경외하는 너희에게는 의의 해가 떠오르며, 그 날개에는 치유가 있을 것입니다[b]; 너희는 나가서 외양간에서 나온 송아지처럼 뛰놀 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘그 광선 안에’. 히브리어 ‘날개’는 태양의 가장자리나 광선을 비유적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘뛰어오르다’, ‘활기차게 놀다’. 히브리어 동사는 희귀하며, 넘치는 움직임을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרְחָה
  english_pob_choice: will rise
  chosen_korean: 떠오르며
  alternatives_korean:
  - 일어나며
  - 비치며
  - 떠오르며 비치며
  lexicon: HALOT
  rationale: 해가 하늘에서 솟아오르는 이미지를 자연스럽게 살리면서 미래적 의미를 유지합니다.
- source_word: שֶׁמֶשׁ צְדָקָה
  english_pob_choice: the sun of righteousness
  chosen_korean: 의의 해
  alternatives_korean:
  - 의의 태양
  - 의로운 해
  - 의의 태양빛
  lexicon: HALOT
  rationale: צדקה를 ‘의’로 옮겨 본문의 광범위한 의미를 보존하고, 태양 이미지는 한국어에서 가장 간결한 ‘해’로 옮겼습니다.
- source_word: בִּכְנָפֶיהָ
  english_pob_choice: in its wings
  chosen_korean: 그 날개에는
  alternatives_korean:
  - 그 날개에
  - 그 깃에
  - 그 날갯죽지에는
  lexicon: HALOT
  rationale: ‘날개’의 은유를 그대로 유지하되, 태양의 가장자리나 광선을 가리킬 수 있는 표현의 여지를 남깁니다.
- source_word: וּמַרְפֵּא
  english_pob_choice: with healing
  chosen_korean: 치유가 있을 것입니다
  alternatives_korean:
  - 치유가 있습니다
  - 치유가 따를 것입니다
  - 회복이 있을 것입니다
  lexicon: HALOT
  rationale: 명사 מרפא의 ‘치유/치료’를 자연스러운 서술로 풀어, 떠오르는 해와 함께 오는 효력을 분명히 했습니다.
- source_word: וּפִשְׁתֶּם
  english_pob_choice: you will leap
  chosen_korean: 뛰놀 것입니다
  alternatives_korean:
  - 뛰어오를 것입니다
  - 껑충뛸 것입니다
  - 깡충거리며 나갈 것입니다
  lexicon: HALOT
  rationale: 희귀한 동사의 활기찬 움직임을 한국어의 관용적 표현으로 살려, 갇혔다가 풀려난 송아지의 기쁨을 전달합니다.
theological_decisions:
- issue: ‘의의 해’의 해석을 메시아 명칭으로 명시할지 여부
  chosen_reading: 본문의 은유를 그대로 두고, 메시아로 직접 규정하지 않았습니다.
  alternative_readings:
  - 메시아를 가리키는 예언적 칭호로 명시하기
  - ‘의의 태양’으로 옮겨 기독론적 독해를 강화하기
  rationale: 히브리어 본문은 야훼를 경외하는 자들을 향한 종말론적 구원의 시각적 은유를 제시하므로, 번역문에서 해석을 앞서 주입하지 않고 이미지 자체를 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
