    rationale: מרבק은 외양간·우리·살찌우는 곳을 가리키며, 이 구절의 비교 표현은 ‘외양간의 송아지들처럼’입니다. 앞선 ‘너희는 나가서’가 이미 나감을 표현하므로, 비교구에 ‘나온’을 다시 넣으면 원문의 표현을 해석적으로 확장합니다.
  - severity: low
    issue: ‘의의 해’에 대한 צדקה의 의미상 대안 각주가 없습니다.
    rationale: ‘의’는 가능한 주번역이지만, צדקה는 문맥상 공의 또는 신원/입증의 의미도 낼 수 있습니다. 영어 감사 기록의 해당 각주 취지를 한국어에서도 보존하는 것이 좋습니다.
