id: MAL.3.15
reference: Malachi 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֲנַ֖חְנוּ מְאַשְּׁרִ֣ים זֵדִ֑ים גַּם נִבְנוּ֙ עֹשֵׂ֣י רִשְׁעָ֔ה גַּ֧ם בָּחֲנ֛וּ אֱלֹהִ֖ים וַ/יִּמָּלֵֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/015.yaml
  text: So now we call the arrogant blessed[a]; evildoers are even built up[c][b]; they even test God and escape.’
  footnotes:
  - marker: a
    text: Or 'the proud' for 'the arrogant.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'are built up'; that is, they are established or prosper.
    reason: lexical_alternative
  - marker: c
    text: Or 'put God to the test.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 우리는 교만한 자들을 복되다고 여기며[b], 악을 행하는 자들이 오히려 세워지고[b] 하나님을 시험해도[c] 벗어나기만 한다고 여깁니다.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or 'the proud' for 'the arrogant.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'are built up'; that is, they are established or prosper.
    reason: lexical_alternative
  - marker: c
    text: Or 'put God to the test.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그리고 이제
  lexicon: HALOT
  rationale: 문맥상 앞선 불평을 받아 이어지는 결론이므로, 단순한 시간 표시보다 추론의 뉘앙스를 담은 ‘그러므로 이제’가 자연스럽습니다.
- source_word: מְאַשְּׁרִים זֵדִים
  english_pob_choice: we call ... blessed / the arrogant
  chosen_korean: 교만한 자들을 복되다고 여기며
  alternatives_korean:
  - 오만한 자들을 복되다고 여기며
  - 교만한 자들을 복되다 하고
  lexicon: HALOT
  rationale: מְאַשְּׁרִים은 ‘복되다/행복하다’고 평가하는 말이어서, 한국어에서도 평가 동사를 살린 표현이 적절합니다. זֵדִים은 ‘교만한 자들’로 옮겨 전통적 어감보다 본문의 도덕적 비난을 분명히 했습니다.
- source_word: נִבְנוּ
  english_pob_choice: are built up
  chosen_korean: 세워지고
  alternatives_korean:
  - 번성하고
  - 세움을 입고
  lexicon: HALOT
  rationale: 직역하면 ‘세워지다’이지만 문맥상 번성·성공의 은유입니다. 한국어에서는 그 은유를 과도하게 풀지 않으면서도 ‘오히려 세워지다’로 원문 이미지를 유지했습니다.
- source_word: בָּחֲנוּ אֱלֹהִים
  english_pob_choice: test God
  chosen_korean: 하나님을 시험해도
  alternatives_korean:
  - 하나님을 시험하고도
  - 하나님을 떠보아도
  lexicon: HALOT
  rationale: אֱלֹהִים은 여기서 하나님의 보통명사적 호칭이므로 ‘하나님’으로 옮깁니다. בָּחַן의 의미는 단순 확인이 아니라 불경하게 시험하는 것이어서 ‘시험하다’가 가장 직접적입니다.
- source_word: וַיִּמָּלֵטוּ
  english_pob_choice: escape
  chosen_korean: 벗어나기만 한다고
  alternatives_korean:
  - 도망치기만 한다고
  - 빠져나가기만 한다고
  lexicon: HALOT
  rationale: 문맥은 처벌 없이 빠져나감이라는 불평이므로, ‘벗어나기만 한다’로 결과의 아이러니와 무책임한 회피감을 함께 살렸습니다.
theological_decisions:
- issue: 본문 화자의 자기 진술을 현대 한국어로 어떻게 재현할 것인가
  chosen_reading: ‘우리’가 교만한 자와 악인을 옳다고 평가하는 집단적 불평으로 옮겼습니다.
  alternative_readings:
  - ‘그들은’이라고 삼인칭화하기
  - 직접 화법의 집단적 인용을 완화하기
  rationale: 히브리어는 ‘우리는’으로 시작하는 공동체의 자기고백/불평을 유지합니다. 한국어도 이를 그대로 살려 책임의 주체를 흐리지 않는 것이 본문 효과를 보존합니다.
  doctrine_reference: 'DOCTRINE.md: 원문 우선, 문맥적 수사 보존'
