revisions:
- from: 모세 내 종의 율법을 기억하십시오. 내가 그에게 호렙에서 온 이스라엘을 위하여 명령한 것 — 곧 규례들과 법도들입니다.[a][b][c]
  to: 내 종 모세의 율법[a], 곧 내가 호렙[b]에서 그에게 모든 이스라엘을 위하여 규례들과 법도들[c]을 명령한 것을 기억하십시오.
  rationale: ‘모든 이스라엘’을 사용하여 כָּל־יִשְׂרָאֵל의 범위를 정확히 반영하고, ‘규례들과 법도들을 명령한’이라는 관계절로 אֲשֶׁר צִוִּיתִי אֹתוֹ ... חֻקִּים וּמִשְׁפָּטִים의 통사적 연결을 자연스럽게 옮겼습니다. 원문의 명령형, 모세의 존칭, 호렙의 지명, 그리고 두 법률 용어의 구별은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:50:04Z'
