id: MAL.3.22
reference: Malachi 3:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זִכְר֕וּ תּוֹרַ֖ת מֹשֶׁ֣ה עַבְדִּ֑/י אֲשֶׁר֩ צִוִּ֨יתִי אוֹת֤/וֹ בְ/חֹרֵב֙ עַל כָּל יִשְׂרָאֵ֔ל חֻקִּ֖ים וּ/מִשְׁפָּטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/022.yaml
  text: Remember the law of Moses my servant[c][b][a], which I commanded him at Horeb for all Israel—statutes and judgments.
  footnotes:
  - marker: a
    text: Or 'the instruction of Moses my servant.'
    reason: lexical_alternative
  - marker: b
    text: '''Horeb'' is another name for Sinai, the mountain where God gave Israel the covenant law through Moses.'
    reason: cultural_note
  - marker: c
    text: Or 'statutes and ordinances.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 종 모세의 율법[a], 곧 내가 호렙[b]에서 그에게 모든 이스라엘을 위하여 규례들과 법도들[c]을 명령한 것을 기억하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모세 내 종의 교훈’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 호렙은 시내산의 다른 이름으로, 하나님이 모세를 통해 이스라엘에게 언약 율법을 주신 산입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘율례들과 판결들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하세요
  - 기억하라
  lexicon: HALOT
  rationale: 복수 명령형의 촉구를 현대 표준어 합쇼체로 옮기면서, 언약적 소환의 무게를 살리기 위해 단순한 서술형보다 명령형 ‘기억하십시오’를 택했습니다.
- source_word: תּוֹרַת
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 가르침
  - 교훈
  - 법
  lexicon: HALOT
  rationale: 모세, 호렙, 그리고 이스라엘 전체를 향한 언약 규정의 맥락이므로, 넓은 ‘가르침’보다 모세오경적·언약적 의미를 드러내는 ‘율법’이 더 직접적입니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 종자
  - 내 하인
  lexicon: HALOT
  rationale: 모세에 대한 호칭은 위임받은 하나님의 종이라는 신분을 드러내므로, POB의 ‘my servant’를 따라 한국어도 ‘내 종’으로 옮겼습니다.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  english_pob_choice: statutes and judgments
  chosen_korean: 규례들과 법도들
  alternatives_korean:
  - 규례들과 판단들
  - 율례들과 규례들
  - 명령들과 판단들
  lexicon: HALOT
  rationale: 히브리어의 두 법률 용어를 구별해 살리되, 한국어 성경에서 널리 이해되는 짝인 ‘규례들 / 법도들’로 옮겨 법적·언약적 성격을 유지했습니다.
theological_decisions:
- issue: 'תּוֹרָה의 범위: 일반적 가르침인가, 모세 율법인가'
  chosen_reading: 율법
  alternative_readings:
  - 가르침
  - 교훈
  rationale: 호렙에서 이스라엘 전체를 위해 주어진 내용이라는 문맥상, 단순한 교육적 ‘가르침’보다 언약 법전으로서의 의미를 드러내는 번역이 적절합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over tradition; context-sensitive rendering of torah.'
- issue: 모세를 가리키는 עַבְדִּי의 뉘앙스
  chosen_reading: 내 종
  alternative_readings:
  - 내 노예
  - 내 하인
  rationale: 여기서 עבד는 노예 신분을 강조하기보다 하나님의 대표적 종으로서의 소명과 권위를 가리키므로, 본문 의도에 맞게 ‘종’으로 유지했습니다.
  doctrine_reference: Contextual equivalence; honorific covenant title vs. bonded-status rendering.
