    rationale: ‘규례들과 율례들’은 원문의 두 법률 용어에 대한 구별된 대안으로는 불명확합니다. חֻקִּים/מִשְׁפָּטִים에 대응하는 대안으로 ‘율례들과 판결들’이 더 적절합니다.
