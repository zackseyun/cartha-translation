id: MAL.3.11
reference: Malachi 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גָעַרְתִּ֤י לָ/כֶם֙ בָּֽ/אֹכֵ֔ל וְ/לֹֽא יַשְׁחִ֥ת לָ/כֶ֖ם אֶת פְּרִ֣י הָ/אֲדָמָ֑ה וְ/לֹא תְשַׁכֵּ֨ל לָ/כֶ֤ם הַ/גֶּ֨פֶן֙ בַּ/שָּׂדֶ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/011.yaml
  text: And I will rebuke the devourer for you[a], so that it will not destroy for you the fruit of the ground, and the vine in the field will not fail to bear for you[b], says Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the vine in the field will not miscarry for you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 위하여 삼키는 자를[a] 꾸짖겠습니다. 그가 너희를 위하여 땅의 열매를 망치지 못하게 하겠습니다. 밭의 포도나무도 너희를 위하여 열매를 떨어뜨리지[b] 않을 것입니다. 만군의 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먹는 자’, ‘파괴하는 자’. 히브리어는 농작물을 먹어 없애는 존재를 가리키며, 그 정체를 특정하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘밭의 포도나무가 너희를 위하여 유산하지 않을 것입니다’. 여기서는 포도나무가 맺은 열매를 잃는다는 비유적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָעַרְתִּי
  english_pob_choice: I will rebuke
  chosen_korean: 꾸짖을 것이니
  alternatives_korean:
  - 책망할 것이니
  - 꾸짖겠습니다
  lexicon: HALOT
  rationale: אַעֲרַר/גָּעַר은 단순한 제지보다 권위 있는 꾸짖음의 뜻이 강하므로, 하나님의 능동적 개입을 살리는 동사로 옮겼습니다.
- source_word: בָּאֹכֵל
  english_pob_choice: the devourer
  chosen_korean: 먹어치우는 것
  alternatives_korean:
  - 먹는 자
  - 삼키는 자
  lexicon: HALOT
  rationale: 구체적 실체를 특정하기보다 농작물을 갉아먹고 해치는 파괴적 존재를 가리키므로, 한국어에서 기능을 드러내는 표현을 택했습니다.
- source_word: יַשְׁחִת
  english_pob_choice: destroy
  chosen_korean: 파괴하지 못할 것이며
  alternatives_korean:
  - 무너뜨리지 못할 것이며
  - 망치지 못할 것이며
  lexicon: HALOT
  rationale: 농업적 맥락에서 생산물을 해치고 없애는 뜻을 분명히 하기 위해 강한 동사로 옮겼습니다.
- source_word: תְשַׁכֵּל
  english_pob_choice: will not fail to bear
  chosen_korean: 열매를 맺지 못하는 일이 없을 것입니다
  alternatives_korean:
  - 유산하지 않을 것입니다
  - 열매를 맺지 못할 것입니다
  lexicon: HALOT
  rationale: 포도나무에 대한 용례에서는 ‘유산하다’가 문자적으로는 가깝지만 현대 한국어에서 매우 생소하므로, 열매 형성을 잃는 뜻을 자연스럽게 풀어 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군의 주
  alternatives_korean:
  - 야훼 군대의 주
  - 야훼 만군의 하나님
  lexicon: HALOT
  rationale: 본문의 고유명사 יְהוָה는 프로젝트 기본값에 따라 야훼로, צְבָאוֹת는 전통적 ‘만군’ 표현을 유지하되 의미상 ‘주’와 결합해 자연스럽게 배치했습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 본문에 있는 여호와의 이름을 직접 드러내는 프로젝트 기준을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: צְבָאוֹת의 의미 전달
  chosen_reading: 만군의 주
  alternative_readings:
  - 만군의 하나님
  - 군대의 주
  rationale: צְבָאוֹת의 역사적·문맥적 의미를 한국어에서 널리 알려진 ‘만군’으로 보존하면서, 독자가 호칭으로 읽을 수 있게 구성했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2, §6
