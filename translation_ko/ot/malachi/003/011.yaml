revisions:
- from: 내가 너희를 위해 먹어치우는 것을 꾸짖을 것이니, 그것이 너희를 위해 땅의 열매를 파괴하지 못할 것이며, 들의 포도나무도 너희를 위해 열매를 맺지 못하는 일이 없을 것입니다. 야훼 만군의 주께서 말씀하십니다.[a][b]
  to: 내가 너희를 위하여 삼키는 자를[a] 꾸짖겠습니다. 그가 너희를 위하여 땅의 열매를 망치지 못하게 하겠습니다. 밭의 포도나무도 너희를 위하여 열매를 떨어뜨리지[b] 않을 것입니다. 만군의 야훼께서 말씀하십니다.
  rationale: 원문의 농업적 이미지와 행위자의 불특정성을 보존하면서, 한국어에서 자연스러운 문장 구조로 다듬었습니다. 특히 포도나무가 ‘유산한다’는 직역적 비유는 본문에서는 ‘열매를 떨어뜨리다’로 옮기고 각주에 직역을 제시했습니다. 신명 칭호는 히브리어의 수식 관계에 맞추어 ‘만군의 야훼’로 바로잡았으며, 각주 표지도 설명 대상에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
