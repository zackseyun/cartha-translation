  text: וְ/הֵשִׁ֤יב לֵב אָבוֹת֙ עַל בָּנִ֔ים וְ/לֵ֥ב בָּנִ֖ים עַל אֲבוֹתָ֑/ם פֶּן אָב֕וֹא וְ/הִכֵּיתִ֥י אֶת הָ/אָ֖רֶץ חֵֽרֶם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/024.yaml
  text: And he will turn the hearts of fathers to their children[a], and the hearts of children to their fathers, lest I come and strike the land with a ban of destruction.
  footnotes:
  - marker: a
    text: Or 'with utter destruction'; traditionally, 'with a curse.' The Hebrew term refers to something placed under a ban and devoted to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아버지들의 마음을 자녀들에게로, 자녀들의 마음을 그들의 아버지들에게로 돌이킬 것입니다. 그렇지 않으면 내가 와서 그 땅을 진멸의 대상으로 삼아 칠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전한 멸망으로’; 전통적으로는 ‘저주로’라고도 옮깁니다. 히브리어 ‘헤렘’은 신적 심판 아래 진멸을 위해 바쳐진 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  english_pob_choice: And he will turn
  chosen_korean: 돌이키고
  alternatives_korean:
  - 돌려
  - 회복시키고
  lexicon: HALOT
  rationale: 관계와 충성의 방향을 바꾸는 히필 שוב의 뜻을 살리면서, 한국어에서는 ‘돌이키다’가 가장 자연스럽고 원문과의 거리를 최소화합니다.
- source_word: לֵב
  english_pob_choice: hearts
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 마음들
  lexicon: HALOT
  rationale: 히브리어 לֵב는 감정만이 아니라 의지와 내면 전체를 가리키므로, 한국어 성서 문맥에서 ‘마음’이 가장 적절합니다.
- source_word: חֵרֶם
  english_pob_choice: with a ban of destruction
  chosen_korean: 진멸의 금령 아래
  alternatives_korean:
  - 진멸의 저주 아래
  - 진멸의 금지 아래
  - 멸망의 금령 아래
  lexicon: HALOT
  rationale: חֵרֶם은 단순한 ‘저주’가 아니라 심판 아래 바쳐져 파괴에 넘겨지는 상태를 가리키므로, 전통어를 그대로 옮기기보다 그 개념을 드러내는 표현을 택했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅
  - 그 나라
  lexicon: HALOT
  rationale: 문맥상 이스라엘 공동체와 관련된 언약적 심판을 가리키므로, 우주적 의미의 ‘땅/세상’보다 ‘그 땅’이 더 정확합니다.
theological_decisions:
- issue: חֵרֶם의 종결 경고를 한국어로 어떻게 살릴지
  chosen_reading: ‘진멸의 금령 아래 두어 칠 것입니다’로, 심판의 엄중함과 금령 개념을 함께 드러냈습니다.
  alternative_readings:
  - ‘저주를 내릴 것입니다’
  - ‘완전히 멸하실 것입니다’
  rationale: 본문은 단순한 감정적 저주가 아니라 언약적 심판으로서 ‘금령/진멸’의 개념을 담고 있으므로, 교회적 관용구보다 원문 개념을 우선했습니다.
  doctrine_reference: Malachi 4:6 / covenant judgment and חֵרֶם
