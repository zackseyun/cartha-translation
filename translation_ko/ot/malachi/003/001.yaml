revisions:
- from: 보라, 내가 내 사자를 보내리니 그가 내 앞에서 길을 닦을 것입니다. 그리고 주께서 갑자기 그분의 성전으로 오실 것이며, 너희가 찾는 언약의 사자가—보라, 그가 오고 있습니다—만군의 야훼께서 말씀하십니다.[a][b]
  to: 보십시오, 내가 내 사자[a]를 보낼 것입니다. 그가 내 앞에서 길을 닦을 것입니다. 그리고 너희가 찾는 주께서 갑자기 자신의 성전으로 오실 것이며, 너희가 기뻐하는 언약의 사자가 오고 있습니다. 보십시오, 그가 오고 있습니다. 만군의 야훼께서[b] 말씀하십니다.
  rationale: 후반부의 관계절을 각각 ‘주’와 ‘언약의 사자’에 올바르게 연결하고, 누락된 ‘너희가 기뻐하는’을 복원했습니다. 두 호칭이 동일 인물을 가리키는지 여부는 번역문에서 명시적으로 해석하지 않았습니다. 문장을 나누어 현대 합쇼체의 가독성을 높였으며, 원문의 갑작스러운 도래와 확실한 임박성을 유지했습니다.
