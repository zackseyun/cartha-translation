id: MAL.3.1
reference: Malachi 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֤י שֹׁלֵחַ֙ מַלְאָכִ֔/י וּ/פִנָּה דֶ֖רֶךְ לְ/פָנָ֑/י וּ/פִתְאֹם֩ יָב֨וֹא אֶל הֵיכָל֜/וֹ הָ/אָד֣וֹן אֲשֶׁר אַתֶּ֣ם מְבַקְשִׁ֗ים וּ/מַלְאַ֨ךְ הַ/בְּרִ֜ית אֲשֶׁר אַתֶּ֤ם חֲפֵצִים֙ הִנֵּה בָ֔א אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/001.yaml
  text: Behold[a], I am sending my messenger, and he will clear the way before me. And suddenly the Lord whom you seek will come to his temple, and the messenger of the covenant in whom you delight—behold, he is coming[b], says Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or 'my angel' / 'the angel of the covenant'; the Hebrew word מַלְאָךְ can mean either 'messenger' or 'angel.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''the LORD of hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 내 사자[a]를 보낼 것입니다. 그가 내 앞에서 길을 닦을 것입니다. 그리고 너희가 찾는 주께서 갑자기 자신의 성전으로 오실 것이며, 너희가 기뻐하는 언약의 사자가 오고 있습니다. 보십시오, 그가 오고 있습니다. 만군의 야훼께서[b] 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַלְאָךְ는 문맥에 따라 ‘사자’ 또는 ‘천사’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 전통 번역은 ‘만군의 여호와’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ / מַלְאָכִי
  english_pob_choice: my messenger
  chosen_korean: 내 사자
  alternatives_korean:
  - 내 메신저
  - 내 천사
  - 나의 사자
  lexicon: HALOT
  rationale: מַלְאָךְ는 ‘사자/메신저’와 ‘천사’의 뜻을 모두 가질 수 있지만, 여기서는 길을 예비하는 기능이 분명하므로 문맥상 ‘사자’가 가장 자연스럽고 본문 흐름을 잘 드러냅니다.
- source_word: וּפִנָּה דֶרֶךְ
  english_pob_choice: he will clear the way
  chosen_korean: 길을 닦을 것입니다
  alternatives_korean:
  - 길을 준비할 것입니다
  - 길을 마련할 것입니다
  - 길을 치울 것입니다
  lexicon: HALOT
  rationale: ‘닦다’는 장애를 없애고 길을 예비한다는 이미지를 한국어로 자연스럽게 살리며, POB의 ‘clear the way’와도 맞습니다.
- source_word: הָאָדוֹן
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 주인께서
  - 그 주께서
  lexicon: HALOT
  rationale: 정관사 있는 הָאָדוֹן은 높임의 호칭으로 읽히므로, 한국어에서도 위계와 존칭을 살린 ‘주께서’가 적절합니다.
- source_word: הֵיכָלוֹ
  english_pob_choice: his temple
  chosen_korean: 그분의 성전
  alternatives_korean:
  - 그의 성전
  - 그분의 궁전
  - 성전으로
  lexicon: HALOT
  rationale: 문맥상 הֵיכָל은 성전이며, 소유격을 살려 ‘그분의 성전’으로 옮겨 주체의 권위를 분명히 했습니다.
- source_word: מַלְאַךְ הַבְּרִית
  english_pob_choice: the messenger of the covenant
  chosen_korean: 언약의 사자
  alternatives_korean:
  - 언약의 천사
  - 언약의 메신저
  - 계약의 사자
  lexicon: HALOT
  rationale: ‘언약’은 하늘의 계약보다 성경적 언약 개념을 직접 반영하며, מַלְאָךְ는 여기서도 ‘사자’가 가장 일관됩니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  - 군대의 야훼
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 יהוה는 ‘야훼’로, צְבָאוֹת는 현대 독자에게 더 투명한 ‘만군’으로 옮겼습니다.
theological_decisions:
- issue: יהוה צְבָאוֹת의 한국어 표기
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 만군의 여호와
  - 만군의 주
  rationale: 본 프로젝트의 기준 번역을 따르되, 전통 교회 용례보다 원문 추적 가능성과 일관성을 우선했습니다.
  doctrine_reference: YHWH default rendering policy
- issue: ‘주’와 ‘언약의 사자’의 관계
  chosen_reading: 본문이 두 인물을 단정적으로 동일시하지 않도록 둘 다 평면적으로 번역했습니다.
  alternative_readings:
  - 두 표현을 같은 인물로 해석
  - ‘사자’를 별도 존재로 분리
  rationale: 히브리어의 긴장과 다층성을 보존하는 것이 번역의 역할이므로, 해석을 앞서지 않고 본문이 허용하는 범위 안에서 옮겼습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
