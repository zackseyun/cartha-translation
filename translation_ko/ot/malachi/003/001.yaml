  source_fidelity: 초안은 첫 절반의 ‘내 사자’와 ‘내 앞에서 길을 닦다’를 대체로 충실하게 옮겼습니다. 그러나 후반부에서 히브리어의 ‘너희가 찾는 주’(הָאָדוֹן אֲשֶׁר אַתֶּם מְבַקְשִׁים)를 ‘너희가 찾는 언약의 사자’로 결합하여 수식 관계가 바뀌었습니다. 또한 ‘너희가 기뻐하는’(אֲשֶׁר אַתֶּם חֲפֵצִים)이 빠졌습니다. 이를 바로잡고 두 호칭의 관계는 본문처럼 해석적으로 확정하지 않았습니다.
  naturalness: ‘보십시오’와 ‘오고 있습니다’는 현대 한국어 합쇼체에 자연스럽습니다. ‘자신의 성전’은 히브리어 소유 접미사를 자연스럽게 반영합니다. 각주 표지는 해당 어휘와 신명에 바로 붙여 독자가 가리키는 대상을 알 수 있게 했습니다.
