id: MAL.3.21
reference: Malachi 3:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַסּוֹתֶ֣ם רְשָׁעִ֔ים כִּֽי יִהְי֣וּ אֵ֔פֶר תַּ֖חַת כַּפּ֣וֹת רַגְלֵי/כֶ֑ם בַּ/יּוֹם֙ אֲשֶׁ֣ר אֲנִ֣י עֹשֶׂ֔ה אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/021.yaml
  text: And you will trample the wicked[a], for they will be ashes under the soles of your feet on the day when I act, says Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, “the LORD of Hosts.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 악인들을 짓밟을 것입니다. 그들이 내가 행하는 날에 너희 발바닥 아래 재가 될 것이기 때문입니다. 만군의 야훼께서 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만군의’는 히브리어 צְבָאוֹת(‘군대들’, ‘군대’)의 전통적 한국어 번역입니다. 전통적 교회 용례로는 ‘만군의 주’ 또는 ‘만군의 여호와’가 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַסּוֹתֶם
  english_pob_choice: And you will trample
  chosen_korean: 그리고 여러분은 악인들을 짓밟을 것입니다
  alternatives_korean:
  - 그리고 여러분은 악인들을 밟아 누를 것입니다
  - 그리고 여러분은 악인들을 짓밟아 버릴 것입니다
  lexicon: WLC/HALOT
  rationale: 문맥상 승리한 의인이 악인을 발로 눌러 제압하는 चित्र이므로, 현대 한국어에서 자연스럽고 강한 동작을 드러내는 ‘짓밟다’를 택했습니다.
- source_word: רְשָׁעִים
  english_pob_choice: the wicked
  chosen_korean: 악인들
  alternatives_korean:
  - 악한 자들
  - 불의한 자들
  lexicon: WLC/HALOT
  rationale: 형용사적 명사 복수로 사람들을 가리키므로, 간결하게 ‘악인들’로 옮겨 도덕적 범주를 보존했습니다.
- source_word: כַּפּוֹת רַגְלֵיכֶם
  english_pob_choice: the soles of your feet
  chosen_korean: 여러분의 발바닥 아래
  alternatives_korean:
  - 여러분의 발바닥 밑
  - 여러분의 발바닥
  lexicon: WLC/HALOT
  rationale: כַּף־רֶגֶל의 관용적 의미를 한국어의 표준 해부학 표현인 ‘발바닥’으로 풀어, 원문의 ‘발의 아랫면’ 이미지를 자연스럽게 살렸습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: WLC/HALOT
  rationale: 정책에 따라 신명은 ‘야훼’로, צְבָאוֹת은 의미를 드러내는 관형어 ‘만군의’로 옮겨 ‘만군의 야훼’라는 예언서적 호칭을 보존했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명을 사용하므로, 전통적 ‘주’로 완화하지 않고 원문 식별성이 가장 높은 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 종말적 심판 장면의 동작성
  chosen_reading: 짓밟을 것입니다
  alternative_readings:
  - 밟을 것입니다
  - 짓눌러 버릴 것입니다
  rationale: 악인이 재가 된 뒤 의인이 그 위를 밟는 심판 이미지를 약화하지 않기 위해, 물리적·승리적 함의가 분명한 표현을 택했습니다.
  doctrine_reference: 말라기 3:21 문맥 — 심판과 정결의 예언
