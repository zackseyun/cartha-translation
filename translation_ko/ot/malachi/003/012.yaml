  text: וְ/אִשְּׁר֥וּ אֶתְ/כֶ֖ם כָּל הַ/גּוֹיִ֑ם כִּֽי תִהְי֤וּ אַתֶּם֙ אֶ֣רֶץ חֵ֔פֶץ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/012.yaml
  text: Then all the nations will call you blessed[a], for you will be a delightful land, says Yahweh of hosts.
  footnotes:
  - marker: a
    text: Or 'a land of delight' or 'a desirable land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에는 모든 민족이 너희를 복되다고 부를 것입니다. 너희가 기쁨을 주는 땅[a]이 될 것이기 때문입니다. 만군의 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들이 바라는 땅’, ‘기쁨의 땅’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשְּׁרוּ
  english_pob_choice: will call you blessed
  chosen_korean: 복되다 할 것이니
  alternatives_korean:
  - 행복하다 할 것이니
  - 복을 받은 자라 할 것이니
  - 복되다고 부를 것이니
  lexicon: HALOT
  rationale: Piel of אשר는 누군가를 복되다고 선언하거나 인정하는 뜻이므로, 현대 한국어에서는 ‘복되다 하다’가 공적인 평가를 가장 자연스럽게 드러냅니다.
- source_word: כָּל הַגּוֹיִם
  english_pob_choice: all the nations
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 나라들
  - 모든 이방 민족들
  lexicon: HALOT
  rationale: 문맥상 주변의 민족 집단 전체를 가리키므로 ‘민족’이 가장 무난하며, 여기서는 후대의 신학적 대조어인 ‘이방인’보다 원문의 범위를 더 잘 반영합니다.
- source_word: אֶרֶץ חֵפֶץ
  english_pob_choice: a delightful land
  chosen_korean: 기쁨의 땅
  alternatives_korean:
  - 기뻐하는 땅
  - 즐거운 땅
  - 사랑스러운 땅
  lexicon: HALOT
  rationale: חֵפֶץ는 ‘기쁨/즐거움/원함’의 영역을 가지므로, ‘기쁨의 땅’은 문자성을 유지하면서도 한국어에서 시적·가독성 균형이 좋습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군
  - 만군의 주
  - 만군의 여호와
  lexicon: HALOT
  rationale: 고유명 יְהוָה는 POB 원칙에 따라 ‘야훼’로, צְבָאוֹת는 전통적이지만 의미 범위가 넓은 ‘만군’으로 옮겨 합성 호칭을 보존합니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 처리
  chosen_reading: ‘야훼’로 음역하여 하나님의 고유 이름을 드러냈습니다.
  alternative_readings:
  - ‘주’로 번역
  - ‘여호와’로 음역
  rationale: 본문이 титула가 아니라 언약적 고유명 יְהוָה를 사용하므로, POB 원칙에 따라 ‘야훼’를 유지해 이름 자체를 가리키는 힘을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
