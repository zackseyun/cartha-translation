  to: 그때에 너희는 다시 의인과 악인, 하나님을 섬기는 자와 그분을 섬기지 않는 자 사이의 구별을 보게 될 것입니다.[a]
  rationale: ‘그때에’는 접속사 וְ의 문맥상 미래 전개를 자연스럽게 나타내며, ‘다시’는 וְשַׁבְתֶּם의 관용적 의미를 보존합니다. 반복되는 ‘사이’를 ‘사이의 구별’로 정리하여 בֵּין의 대조를 명료하게 드러내되, ‘분별하여 보다’의 중복과 불필요한 해석적 확장을 제거했습니다. 각 대조항과 하나님을 섬긴다는 핵심 용어는 유지했습니다.
