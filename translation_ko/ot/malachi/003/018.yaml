id: MAL.3.18
reference: Malachi 3:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שַׁבְתֶּם֙ וּ/רְאִיתֶ֔ם בֵּ֥ין צַדִּ֖יק לְ/רָשָׁ֑ע בֵּ֚ין עֹבֵ֣ד אֱלֹהִ֔ים לַ/אֲשֶׁ֖ר לֹ֥א עֲבָדֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/018.yaml
  text: Then you will again see the difference between the righteous and the wicked[a], between one who serves God and one who does not serve him.
  footnotes:
  - marker: a
    text: Or, more literally, 'Then you will return and see between the righteous and the wicked.' The Hebrew idiom likely means that they will once again perceive the distinction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너희는 다시 의인과 악인 사이를, 하나님을 섬기는 자와 그분을 섬기지 않는 자 사이를 분별하여 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그러면 너희는 돌아와 의인과 악인 사이를 보게 될 것입니다.’ 히브리어 관용구는 그들이 다시 그 구별을 분별하게 된다는 뜻일 가능성이 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם
  english_pob_choice: Then you will again
  chosen_korean: 그러면 너희는 다시
  alternatives_korean:
  - 너희는 돌아와
  - 그때 너희는 다시
  lexicon: HALOT
  rationale: שוב의 기본 뜻은 ‘돌아오다/되돌다’이지만, 뒤의 ‘보다’와 함께 쓰여 ‘다시 알아보게 되다’는 관용적 의미를 가지므로, 한국어에서는 자연스럽게 ‘다시’로 풀어 되풀이된 인식을 드러냈습니다.
- source_word: בֵּין ... בֵּין
  english_pob_choice: the difference between
  chosen_korean: 사이
  alternatives_korean:
  - 구별
  - 차이
  - 분별
  lexicon: HALOT
  rationale: 반복된 בין은 대조와 구분을 나타내므로, 본문 안에서는 ‘...사이’로 유지하고 앞의 ‘분별하여 보게’와 함께 구별의 의미를 살렸습니다.
- source_word: צַדִּיק / רָשָׁע
  english_pob_choice: the righteous / the wicked
  chosen_korean: 의인 / 악인
  alternatives_korean:
  - 의로운 자 / 악한 자
  - 의로운 사람 / 악한 사람
  lexicon: HALOT
  rationale: צַדִּיק와 רָשָׁע의 예언서·지혜문학적 표준 대립을 한국어 성경어휘로 가장 직접적으로 옮길 수 있는 대응은 ‘의인/악인’입니다.
- source_word: עֹבֵד אֱלֹהִים
  english_pob_choice: one who serves God
  chosen_korean: 하나님을 섬기는 자
  alternatives_korean:
  - 하나님을 섬기는 사람
  - 하나님을 예배하는 자
  lexicon: HALOT
  rationale: עבד + 하나님은 단순한 예배 행위보다 언약적 충성과 섬김을 넓게 가리키므로, ‘예배하는’보다 포괄적인 ‘섬기는 자’가 원문의 범위를 더 잘 보존합니다.
- source_word: לֹא עֲבָדוֹ
  english_pob_choice: one who does not serve him
  chosen_korean: 그분을 섬기지 않는 자
  alternatives_korean:
  - 그를 섬기지 않는 자
  - 그분을 섬긴 적이 없는 자
  lexicon: HALOT
  rationale: 히브리어는 하나님을 가리키는 대명사 접미사를 사용하므로, 한국어에서는 지시 대상이 분명한 ‘그분’을 써서 문맥상 하나님을 가리키는 것을 드러냈습니다.
theological_decisions:
- issue: ‘돌아오다’(שוב)를 시간적 회귀가 아닌 인식의 재개로 옮길지 여부
  chosen_reading: 본문의 미래형 인식을 따라 ‘다시 ... 분별하여 보게 될 것입니다’로 옮기고, 최종 심판 같은 해석어는 덧붙이지 않았습니다.
  alternative_readings:
  - ‘돌아와 보게 될 것입니다’처럼 직역하기
  - ‘심판 때 분별하게 될 것입니다’처럼 명시하기
  rationale: 문맥상 하나님의 개입으로 이전에 보지 못하던 구분을 다시 인식하게 된다는 뜻이므로, 원문의 관용을 살리되 해석을 과도하게 확정하지 않았습니다.
  doctrine_reference: 본문이 직접 말하는 인식의 회복을 보존하고, 종말론적 세부는 열어 둡니다.
