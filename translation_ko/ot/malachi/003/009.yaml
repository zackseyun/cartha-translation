  lexicon: HALOT
  rationale: 문맥상 십일조와 헌물의 미지급을 가리키는 קבע를 단순한 '도둑질'보다 '속여 빼앗다'로 옮겨, 하나님께 대한 배신성과 착취성을 함께 드러냈습니다.
- source_word: הַגּוֹי כֻּלּוֹ
  english_pob_choice: the whole nation of you
  chosen_korean: 너희 온 나라가 그러합니다
