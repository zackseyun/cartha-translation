  text: 너희는 저주를 받아 저주 아래에 있습니다. 너희가 나에게서 빼앗고 있습니다. 온 나라가 모두 그러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희는 저주를 받아 저주 아래에 있습니다. 그런데도 너희가 나에게서 빼앗고 있습니다. 너희 모두, 곧 온 나라가 그러합니다.”
    reason: 히브리어 접속사 וְ는 단순 접속으로도, 문맥상 ‘그런데도’라는 역접으로도 이해될 수 있으며, 마지막 표현은 공동체 전체를 강조한다.
