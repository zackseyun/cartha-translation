theological_decisions:
- issue: 공동체 전체에 대한 언약적 책망
  chosen_reading: 이 절은 개인 몇 사람만이 아니라 언약 공동체 전체가 저주 아래 있으며, 하나님을 속여 빼앗는 책임이 공동체적으로 퍼져 있음을 말합니다.
  alternative_readings:
  - 단순히 과장된 집합적 표현으로 보고 공동체 책임을 약화시킬 수 있습니다.
  rationale: 본문의 마지막 절이 '온 나라'를 명시하므로, 심판과 책망의 범위를 공동체 전체로 드러내는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 공동체적 책임과 언약적 저주를 보존
