translation:
  language: ko
  text: 그때 유다와 예루살렘의 제물이 야훼께 기쁘게 받아들여질 것입니다[a][b], 옛날의 날들과 지난 세월처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼께서 기쁘게 여기실 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제물’은 문맥에 따라 더 구체적으로 ‘곡식제물’일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָֽרְבָה
  english_pob_choice: Then ... will be pleasing
  chosen_korean: 기쁘게 받아들여질 것입니다
  alternatives_korean:
  - 기쁘게 여겨질 것입니다
  - 받아들여질 것입니다
  - 기쁘게 될 것입니다
  lexicon: HALOT
  rationale: ערב의 핵심 뜻은 ‘기쁘다/기쁘게 하다, 받아들일 만하다’이므로, 제물이 하나님께 호의적으로 수납된다는 의미를 살려 자연스럽게 옮겼습니다. 미래 시상은 예언 문맥을 따라 표현했습니다.
- source_word: לַֽ/יהוָ֔ה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼에게
  - 주님께
  - 여호와께
  lexicon: WLC
  rationale: 본문의 신명은 יְהוָה이므로 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. ל는 방향/관계의 표지로서, 여기서는 제물이 야훼를 향해, 곧 그분께 기쁘게 받아들여진다는 관계를 드러냅니다.
- source_word: מִנְחַת
  english_pob_choice: the offering
  chosen_korean: 제물
  alternatives_korean:
  - 예물
  - 소제물
  - 공물
  lexicon: HALOT
  rationale: מִנְחָה는 문맥에 따라 곡식제물을 가리킬 수 있지만, 여기서는 회복된 예배의 총칭으로 쓰여 ‘제물’이 가장 넓고 무리 없는 표현입니다. POB의 더 넓은 ‘offering’ 선택과도 맞습니다.
- source_word: כִּימֵי עוֹלָם וּ/כְ/שָׁנִ֖ים קַדְמֹנִיּֽוֹת
  english_pob_choice: as in the days of old and as in former years
  chosen_korean: 옛날과 옛적의 해들처럼
  alternatives_korean:
  - 옛날과 이전의 해들처럼
  - 태고의 날들과 옛 해들처럼
  - 옛적의 날들처럼
  lexicon: HALOT
  rationale: 두 병행구는 과거의 오래된 시기를 가리키는 시적 평행법이므로, 두 표현의 중복을 한국어에서도 압축된 병렬로 살렸습니다. ‘옛적의 해들’은 직역에 가깝지만 한국어에서 다소 문학적이어서 본문에서는 자연스러운 ‘옛날과 옛적의 해들’로 조정했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  - the LORD
  rationale: 본문이 신명기적 언약 이름 יְהוָה를 직접 사용하므로, 전통적 대체어보다 고유 신명 자체를 드러내는 번역이 원문의 신학적 무게를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
