id: MAL.3.7
reference: Malachi 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/מִ/ימֵ֨י אֲבֹתֵי/כֶ֜ם סַרְתֶּ֤ם מֵֽ/חֻקַּ/י֙ וְ/לֹ֣א שְׁמַרְתֶּ֔ם שׁ֤וּבוּ אֵלַ/י֙ וְ/אָשׁ֣וּבָה אֲלֵי/כֶ֔ם אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֥ה נָשֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/007.yaml
  text: From the days of your fathers you have turned aside from my statutes and have not kept them. Return to me[a], and I will return to you, says Yahweh of hosts. But you say, “How shall we return?”
  footnotes:
  - marker: a
    text: Or “your ancestors.” The Hebrew reads literally “your fathers.”
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 조상들의 시대부터[a] 너희는 내 규례들에서 떠났고 그것들을 지키지 않았습니다. 내게로 돌아오십시오. 그러면 나도 너희에게로 돌아오겠습니다. 만군의 야훼께서 말씀하십니다. 그런데 너희는 “우리가 어떻게 돌아가겠습니까?”라고 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희 아버지들의 때부터.” 히브리어는 문자적으로 “너희 아버지들의 날들부터”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִימֵי אֲבֹתֵיכֶם
  english_pob_choice: From the days of your fathers
  chosen_korean: 조상들의 시대부터
  alternatives_korean:
  - 너희 아버지들의 날들부터
  - 너희 선조들의 때부터
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘너희 아버지들’과 ‘~의 날들/시대’의 결합이지만, 한국어에서는 시간적 범위를 자연스럽게 드러내는 ‘조상들의 시대부터’가 문맥의 뜻을 잘 보존합니다.
- source_word: סַרְתֶּם מֵחֻקַּי
  english_pob_choice: you have turned aside from my statutes
  chosen_korean: 내 규례들에서 떠나
  alternatives_korean:
  - 내 규례들에서 벗어나
  - 내 법도들에서 떠나
  lexicon: HALOT
  rationale: סור는 길이나 기준에서 ‘벗어나다/떠나다’의 뜻이므로, 언약적 불순종의 이미지를 살려 ‘떠나’로 옮겼습니다. חֻקִּים은 여기서 ‘규례들’이 가장 무난하고 투명합니다.
- source_word: וְלֹא שְׁמַרְתֶּם
  english_pob_choice: and have not kept them
  chosen_korean: 그것을 지키지 않았습니다
  alternatives_korean:
  - 그것들을 지키지 않았습니다
  - 그것을 준수하지 않았습니다
  lexicon: HALOT
  rationale: שׁמר는 법적·언약적 맥락에서 ‘지키다’가 표준적이며, 앞의 ‘규례들’을 받아 한국어에서는 자연스럽게 단수 대명사 ‘그것’을 썼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주
  - 야훼 만군의 하나님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본 프로젝트 기본값에 따라 יְהוָה는 ‘야훼’로, צְבָאוֹת는 군대/천상 군대의 이미지를 살리는 ‘만군의’로 옮겼습니다.
theological_decisions:
- issue: 회개 촉구와 상호 귀환의 언약적 대칭
  chosen_reading: ‘내게로 돌아오십시오… 그러면 나도 너희에게로 돌아오겠습니다’를 서로 대응되게 유지했습니다.
  alternative_readings:
  - ‘돌아오라… 내가 너희에게 돌아가겠다’
  - ‘회개하라…’로 의역
  rationale: 히브리어 שׁוּב의 반복은 단순 이동이 아니라 언약적 귀환과 회복의 대칭을 강조하므로, 한국어에서도 같은 동사를 반복해 수사적 힘을 보존했습니다.
  doctrine_reference: Malachi 3:7 covenant admonition
- issue: 여호와 대신 야훼 사용
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 만군의 여호와
  - 만군의 주
  rationale: 본문의 신명기적 언약 이름을 가리키는 יְהוָה를 프로젝트 기본 규정에 따라 음역해, 전통 교회어보다 स्रोत 직접성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
