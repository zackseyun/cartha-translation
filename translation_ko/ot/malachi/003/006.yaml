id: MAL.3.6
reference: Malachi 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֛י אֲנִ֥י יְהוָ֖ה לֹ֣א שָׁנִ֑יתִי וְ/אַתֶּ֥ם בְּנֵֽי יַעֲקֹ֖ב לֹ֥א כְלִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/006.yaml
  text: For I[a], Yahweh, do not change; and you, sons of Jacob[b], have not come to an end.
  footnotes:
  - marker: a
    text: Or 'have not been consumed' or 'have not perished.' The Hebrew verb can carry the sense of being finished, consumed, or brought to an end.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Jacob,' a covenantal designation for Jacob's descendants, that is, Israel.
    reason: cultural_note
translation:
  language: ko
  text: 내가 야훼이므로[a] 변하지 않습니다. 그러나 너희, 야곱의 자손[b]은 끝장나지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘변하지 않았다’로 옮길 수 있습니다. 히브리어 동사는 여기서 하나님의 불변성을 나타내는 상태를 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야곱의 자손’은 야곱의 후손, 곧 이스라엘을 가리키는 언약적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 그러나
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: HALOT
  rationale: 앞절의 선언과 이어지는 대조·근거 관계를 한국어에서 자연스럽게 드러내되, 문맥상 하나님의 불변성과 야곱의 보존 사이의 대비를 살려 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 야훼로 옮겨, 원문 고유 신명성과 언약적 호칭을 유지했습니다.
- source_word: שָׁנִיתִי
  english_pob_choice: do not change
  chosen_korean: 변하지 않습니다
  alternatives_korean:
  - 변하지 않았습니다
  - 바뀌지 않습니다
  lexicon: HALOT
  rationale: 하나님의 지속적 불변성을 나타내는 현재적 진술로 자연스럽게 풀어, 완료 시제의 상태적 의미를 한국어로 살렸습니다.
- source_word: כְלִיתֶם
  english_pob_choice: have not come to an end
  chosen_korean: 끝장나지 않았습니다
  alternatives_korean:
  - 끝나지 않았습니다
  - 소멸되지 않았습니다
  - 사라지지 않았습니다
  lexicon: HALOT
  rationale: כלה의 핵심 의미인 ‘끝나다/소진되다/멸절되다’를 한국어에서 강하게 드러내되, 심판 아래서도 완전히 소멸되지 않은 상태를 간결하게 표현했습니다.
theological_decisions:
- issue: 야훼의 불변성과 언약 백성의 보존
  chosen_reading: 하나님의 변하지 않으심과 야곱의 자손이 완전히 소멸되지 않음의 병치를 그대로 유지했습니다.
  alternative_readings:
  - 논리 관계를 더 풀어 ‘그러므로’로 명시하는 방식
  - 보존의 의미를 약화시켜 단순히 ‘끝나지 않았습니다’로 옮기는 방식
  rationale: 원문은 하나님의 불변성과 야곱의 지속적 존속을 직접 연결하지만, 한국어에서는 지나친 논리 보강보다 대조를 살린 직역-의역 균형이 본문의 신학적 긴장을 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘야곱의 자손’의 표지성
  chosen_reading: ‘야곱의 자손’으로 유지해 언약적 호칭임을 보존했습니다.
  alternative_readings:
  - ‘야곱의 후손’
  - ‘이스라엘’
  rationale: 히브리어의 직설적 표현을 살려, 역사적·언약적 정체성을 독자가 바로 인식하도록 했습니다.
  doctrine_reference: Translation philosophy §4
