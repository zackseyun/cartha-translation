id: MAL.3.3
reference: Malachi 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָשַׁ֨ב מְצָרֵ֤ף וּ/מְטַהֵר֙ כֶּ֔סֶף וְ/טִהַ֤ר אֶת בְּנֵֽי לֵוִי֙ וְ/זִקַּ֣ק אֹתָ֔/ם כַּ/זָּהָ֖ב וְ/כַ/כָּ֑סֶף וְ/הָיוּ֙ לַֽ/יהוָ֔ה מַגִּישֵׁ֥י מִנְחָ֖ה בִּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/003.yaml
  text: He will sit as a refiner and purifier of silver[a], and he will purify the sons of Levi and refine them like gold and like silver, and they will be for Yahweh, presenting an offering in righteousness.
  footnotes:
  - marker: a
    text: Or 'bringing a grain offering.' The Hebrew term minḥah often refers specifically to a grain offering, though it can also be used more broadly for an offering or gift.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 은을 제련하고 깨끗하게 하는 이처럼 앉으실 것이며, 레위의 자손들을 깨끗하게 하시고 그들을 금과 같이, 은과 같이 정련하실 것입니다. 그들은 야훼께 속한 자들이 되어, 의로 예물을 드리는 자들이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡식 제물을 드리는 자들’로도 옮길 수 있습니다. 히브리어 미느하(minḥah)는 흔히 곡식 제물을 가리키지만, 더 넓게는 예물이나 제물도 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב מְצָרֵף וּמְטַהֵר כֶּסֶף
  english_pob_choice: He will sit as a refiner and purifier of silver
  chosen_korean: 은을 제련하고 깨끗하게 하는 이처럼 앉으실 것입니다
  alternatives_korean:
  - 은을 제련하는 이로 앉으실 것입니다
  - 은을 정련하고 깨끗하게 하는 이처럼 앉으실 것입니다
  lexicon: HALOT
  rationale: ‘앉다’와 직분 표현을 살리되, 한국어에서는 ‘제련하고 깨끗하게 하는 이처럼’으로 자연스럽게 옮겨 정련 작업을 지켜보는 이미지와 직업적 비유를 함께 살렸습니다.
- source_word: בְּנֵי לֵוִי
  english_pob_choice: the sons of Levi
  chosen_korean: 레위의 자손들
  alternatives_korean:
  - 레위 사람들
  - 레위의 아들들
  lexicon: HALOT
  rationale: 직역하면 ‘레위의 아들들’이지만, 한국어에서는 혈통·지파 표현을 자연스럽게 드러내는 ‘레위의 자손들’이 가장 적절합니다.
- source_word: וְזִקַּק
  english_pob_choice: and refine
  chosen_korean: 정련하실 것입니다
  alternatives_korean:
  - 정제하실 것입니다
  - 깨끗하게 하실 것입니다
  lexicon: HALOT
  rationale: 앞의 제련 이미지와 대응하는 금속 정련 동사로서 ‘정련하다’가 원문의 금속공학적 비유를 가장 정확하게 보존합니다.
- source_word: מַגִּישֵׁי מִנְחָה
  english_pob_choice: presenting an offering
  chosen_korean: 예물을 드리는 자들
  alternatives_korean:
  - 소제를 드리는 자들
  - 곡식 제물을 드리는 자들
  lexicon: HALOT
  rationale: מִנְחָה는 문맥상 제의적 ‘예물/제물’로 넓게 읽을 수 있어, 본문 의미를 지나치게 좁히지 않으면서도 제사 드림의 행위를 살렸습니다.
- source_word: בִּצְדָקָה
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 안에서
  - 의롭게
  lexicon: HALOT
  rationale: 부사화된 한국어 표현 ‘의로’가 צְדָקָה의 윤리적·제의적 성격을 간결하게 드러내며, 영어 POB의 ‘in righteousness’와도 잘 대응합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에서는 전통적 번역어 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 프로젝트의 기본값에 따라 יהוה를 학술적 음역인 ‘야훼’로 옮겨 원문 고유명을 분명히 드러냈습니다. 문맥상 경외어로 바꾸지 않고 원문 표기를 유지하는 것이 source-direct 원칙에 부합합니다.
  doctrine_reference: 원문 우선 원칙 및 יהוה 표기 일관성
- issue: מִנְחָה의 구체성
  chosen_reading: 본문에는 넓은 의미의 ‘예물’을 두고, 제의적 성격을 유지했습니다.
  alternative_readings:
  - 곡식 제물
  - 소제
  rationale: 이 단어는 흔히 ‘소제/곡식 제물’을 뜻하지만, 여기서는 정결케 된 제사장적 봉사의 결과를 말하므로 지나치게 기술적인 용어로 좁히지 않았습니다.
  doctrine_reference: 의미 범위 보존 및 과도한 특정화 회피
