  to: 그가 은을 제련하고 정결하게 하는 이로 앉아 계실 것이며, 레위의 자손들을 정결하게 하시고 그들을 금처럼, 또 은처럼 정련하실 것입니다. 그리하여 그들은 야훼를 위하여 의로 예물을 드리는 이들이 될 것입니다.[a]
  rationale: 첫 문장의 비교 표현을 역할을 나타내는 표현으로 바로잡아 히브리어 분사구문의 의미를 보존했습니다. לַיהוה는 ‘야훼를 위하여’로 옮겨 봉헌 문맥을 직접 반영했으며, 금·은의 반복된 비유와 מִנְחָה의 어휘적 여지는 유지했습니다.
