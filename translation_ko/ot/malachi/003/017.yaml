review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 신명 ‘야훼’ 및 ‘만군’의 처리는 대체로 충실합니다. 그러나 סְגֻלָּה를 ‘보물 같은 소유’라고 한 것은 다소 느슨하고, חמל의 심판 유보/보호 의미는 ‘아끼다’로 가능하나 문맥상 더 분명히 표현할 수 있습니다. 또한 ‘수종드는’은 현대 표준어 성경 문체로는 지나치게 고어적입니다.
  naturalness: ‘자기에게 수종드는 아들’은 현대 한국어에서 부자연스럽고, ‘보물 같은 소유’도 사람들을 가리키는 서술어로 다소 어색합니다. ‘자기를 섬기는 아들’, ‘귀중한 소유’가 현대적이며 자연스럽습니다.
  terminology: ‘만군의 야훼’는 원문의 יהוה צבאות을 적절히 반영합니다. 전통적 대안 표기는 ‘만군의 주’보다 신명을 보존하는 ‘만군의 여호와’가 더 정확합니다. ‘아들’은 בן의 남성 단수 이미지를 유지해야 합니다.
  issues:
  - severity: medium
    issue: ‘수종드는’이 고어적이고 관계가 다소 불명확합니다.
    rationale: הָעֹבֵד אֹתוֹ는 ‘그를 섬기는’이라는 뜻입니다. ‘자기를 섬기는’이 현대 표준어에서 더 명료하고 자연스럽습니다.
  - severity: medium
    issue: ‘보물 같은 소유’가 סְגֻלָּה의 소유·귀중함 의미를 다소 구어적으로 처리합니다.
    rationale: ‘귀중한 소유’는 특별히 가치 있는 소유라는 뜻을 간결하고 자연스럽게 전달하며, 원문의 단수 보어도 유지합니다.
  - severity: low
    issue: 각주 a의 전통적 대안이 ‘만군의 주’로 되어 있습니다.
    rationale: יהוה의 전통적 한국어 성경 표기는 일반적으로 ‘여호와’이므로, ‘만군의 여호와’가 대안 표기로 더 정확합니다.
  revised_text: 그들은 내 것이 될 것입니다[a], 만군의 야훼께서 말씀하십니다. 내가 그들을 귀중한 소유로 삼는 날에, 나는 한 사람이 자기를 섬기는 아들을 아끼듯이 그들을 아낄 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 더 전통적으로, ‘만군의 여호와’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘보배로운 소유’, ‘나의 특별한 소유’로도 옮길 수 있습니다. 히브리어는 왕이나 주인이 특별히 귀하게 여기는 소유를 가리킵니다.
    reason: lexical_alternative
  revision_rationale: ‘귀중한 소유’로 סְגֻלָּה의 특별히 가치 있는 소유라는 의미를 자연스럽게 드러냈습니다. ‘수종드는’을 ‘자기를 섬기는’으로 고쳐 현대 합쇼체 문체에 맞추고 원문의 관계를 명확히 했습니다. ‘아끼다’의 반복은 히브리어 חמל의 반복을 보존합니다. 각주 b는 본문에서 해당 어휘에 붙도록 유지했습니다.
