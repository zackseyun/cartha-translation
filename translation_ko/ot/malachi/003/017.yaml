id: MAL.3.17
reference: Malachi 3:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ֣יוּ לִ֗/י אָמַר֙ יְהוָ֣ה צְבָא֔וֹת לַ/יּ֕וֹם אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה סְגֻלָּ֑ה וְ/חָמַלְתִּ֣י עֲלֵי/הֶ֔ם כַּֽ/אֲשֶׁר֙ יַחְמֹ֣ל אִ֔ישׁ עַל בְּנ֖/וֹ הָ/עֹבֵ֥ד אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/017.yaml
  text: And they will be mine[a], says Yahweh of Armies, on the day when I make them a treasured possession[c][b], and I will spare them as a man spares his son who serves him.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: Or 'a treasured possession' or 'my special possession'; the Hebrew term denotes a specially valued possession belonging to a king or master.
    reason: lexical_alternative
  - marker: c
    text: The comparison is to a father sparing a son who serves him.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 내 것이 될 것입니다[a], 만군의 야훼께서 말씀하십니다. 내가 그들을 보물 같은 소유[b]로 삼는 그날에, 나는 사람이 자기에게 수종드는 아들을 아끼듯 그들을 아낄 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, ‘만군의 주’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘귀한 소유’, ‘나의 특별한 소유’로도 옮길 수 있습니다. 히브리어는 왕이나 주인의 특별히 귀히 여겨지는 소유를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ לִי
  english_pob_choice: And they will be mine
  chosen_korean: 그들은 내 것이 될 것입니다
  alternatives_korean:
  - 그들은 내 소유가 될 것입니다
  - 그들은 내게 속할 것입니다
  lexicon: HALOT
  rationale: 미래의 소유·귀속 관계를 자연스러운 현대 한국어로 옮기되, 언약적 소속의 힘을 유지하기 위해 ‘내 것’ 표현을 택했습니다.
- source_word: יְהוָה צְבָאֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주
  lexicon: HALOT
  rationale: 신명은 POB 기본값에 따라 야훼로 옮기고, צְבָאֹת은 전통어 ‘만군’으로 옮겨 군사적·우주적 뉘앙스를 살렸습니다.
- source_word: סְגֻלָּה
  english_pob_choice: a treasured possession
  chosen_korean: 보물 같은 소유
  alternatives_korean:
  - 특별한 소유
  - 귀한 소유
  lexicon: HALOT
  rationale: סְגֻלָּה의 ‘특별히 귀히 여겨지는 소유물’이라는 뜻을 살리되, 현대 한국어에서 자연스럽고 평가적 뉘앙스가 드러나는 표현으로 옮겼습니다.
- source_word: וְחָמַלְתִּי עֲלֵיהֶם
  english_pob_choice: and I will spare them
  chosen_korean: 나는 그들을 아낄 것입니다
  alternatives_korean:
  - 나는 그들을 불쌍히 여길 것입니다
  - 나는 그들을 용서할 것입니다
  lexicon: HALOT
  rationale: 문맥상 심판을 거두어 주는 뜻이므로 ‘아끼다’로 옮겼고, 이어지는 아버지-아들 비유와도 잘 맞습니다.
- source_word: כַּאֲשֶׁר יַחְמֹל אִישׁ
  english_pob_choice: as a man spares
  chosen_korean: 사람이 … 아끼듯
  alternatives_korean:
  - 한 남자가 … 아끼듯
  - 누군가 … 아끼듯
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 אִישׁ을 반영하되, 한국어 비유 문맥에서는 ‘사람’이 가장 자연스러워 그 수사적 기능을 살렸습니다.
- source_word: עַל בְּנוֹ הָעֹבֵד אֹתוֹ
  english_pob_choice: his son who serves him
  chosen_korean: 자기에게 수종드는 아들
  alternatives_korean:
  - 자기에게 일하는 아들
  - 자기를 섬기는 아들
  lexicon: HALOT
  rationale: ‘아들’(בֵּן)과 ‘섬기다/수종들다’의 관계를 함께 살리기 위해 간결하게 묶어 옮겼습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명기를 사용하므로 POB 기준에 따라 ‘야훼’를 유지해 언약 სახელ명의 가시성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 시적 비유에서의 성중립화 여부
  chosen_reading: ‘사람’으로 비유를 시작하되 ‘아들’은 유지
  alternative_readings:
  - 한 남자가 그의 아들을 아끼듯
  - 누군가 자기 자녀를 아끼듯
  rationale: 원문은 אִישׁ과 בֵּן의 남성 단수 이미지를 사용하므로 이를 지우지 않되, 한국어에서는 비유의 자연스러움을 위해 ‘사람’을 선택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
