id: MAL.3.16
reference: Malachi 3:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֧ז נִדְבְּר֛וּ יִרְאֵ֥י יְהוָ֖ה אִ֣ישׁ אֶת רֵעֵ֑/הוּ וַ/יַּקְשֵׁ֤ב יְהוָה֙ וַ/יִּשְׁמָ֔ע וַ֠/יִּכָּתֵב סֵ֣פֶר זִכָּר֤וֹן לְ/פָנָי/ו֙ לְ/יִרְאֵ֣י יְהוָ֔ה וּ/לְ/חֹשְׁבֵ֖י שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/016.yaml
  text: Then those who feared Yahweh spoke with one another[a], and Yahweh paid attention and heard[b]; and a book of remembrance was written before him for those who fear Yahweh and who esteem his name.
  footnotes:
  - marker: a
    text: Literally, 'a man with his companion.' The Hebrew idiom means they spoke with one another.
    reason: lexical_alternative
  - marker: b
    text: Or 'who think on his name' / 'who regard his name.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 야훼를 경외하는 사람들이 서로 이야기했습니다[a]. 야훼께서 귀를 기울여 들으셨고[b], 야훼를 경외하며 그의 이름을 소중히 여기는 사람들을 위해 그의 앞에 기억의 책이 기록되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 사람과 그의 동무’이지만, 히브리어 관용구로서 ‘서로’라는 상호적 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주의 깊게 들으셨다’.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그 후
  lexicon: HALOT
  rationale: 장면의 이어짐을 자연스럽게 드러내면서, 앞선 상황에 대한 응답이라는 시간 표지를 간결하게 살립니다.
- source_word: יִרְאֵי יְהוָה
  english_pob_choice: those who feared Yahweh
  chosen_korean: 야훼를 경외하는 사람들
  alternatives_korean:
  - 야훼를 두려워하는 사람들
  - 야훼를 경외하는 자들
  lexicon: HALOT
  rationale: ירא의 언약적·경건적 뉘앙스를 살려 ‘경외하다’로 옮기되, 현대 한국어의 자연스러움을 위해 사람들로 풀었습니다.
- source_word: נִדְבְּרוּ אִישׁ אֶת־רֵעֵהוּ
  english_pob_choice: spoke with one another
  chosen_korean: 서로 이야기했습니다
  alternatives_korean:
  - 서로 말했습니다
  - 함께 대화했습니다
  lexicon: HALOT
  rationale: 직역하면 ‘한 사람이 자기 이웃과’이지만, 관용적으로 상호 대화를 뜻하므로 상호성을 분명히 하는 표현을 택했습니다.
- source_word: וַיַּקְשֵׁב וַיִּשְׁמָע
  english_pob_choice: paid attention and heard
  chosen_korean: 귀를 기울여 들으셨고
  alternatives_korean:
  - 주의 깊게 들으셨고
  - 마음을 기울여 들으셨고
  lexicon: HALOT
  rationale: קשב와 שמע의 병렬을 한국어에서 중복 없이 살리기 위해, ‘귀를 기울이다’와 ‘듣다’를 결합한 표현으로 attentiveness와 hearing을 함께 전달했습니다.
- source_word: סֵפֶר זִכָּרוֹן
  english_pob_choice: a book of remembrance
  chosen_korean: 기억의 책
  alternatives_korean:
  - 기념책
  - 기억책
  lexicon: HALOT
  rationale: 문맥상 왕 앞의 공식 기록물을 가리키므로, ‘remembrance’의 기념·기억 기능을 살리면서도 현대 한국어에서 자연스러운 명사구로 옮겼습니다.
- source_word: וּלְחֹשְׁבֵי שְׁמוֹ
  english_pob_choice: and who esteem his name
  chosen_korean: 그의 이름을 소중히 여기는 사람들
  alternatives_korean:
  - 그의 이름을 생각하는 사람들
  - 그의 이름을 귀하게 여기는 사람들
  lexicon: HALOT
  rationale: חשב의 단순한 ‘생각하다’보다 가치 부여와 존중의 뜻이 강하므로, 하나님 이름에 대한 경외적 평가를 드러내는 표현을 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명사를 보존하기 위해 전통 대체어 대신 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 야훼를 경외하는 자들의 정체성 표현
  chosen_reading: 야훼를 경외하는 사람들
  alternative_readings:
  - 야훼를 두려워하는 사람들
  - 야훼를 공경하는 사람들
  rationale: 이 구절의 ‘경외’는 공포만이 아니라 언약적 충성과 경배를 함께 지시하므로, 신학적 무게를 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘이름을 소중히 여기다’의 해석
  chosen_reading: 그의 이름을 소중히 여기는 사람들
  alternative_readings:
  - 그의 이름을 생각하는 사람들
  - 그의 이름을 존중하는 사람들
  rationale: 히브리어는 단순한 인지보다 하나님의 이름에 대한 मूल्य화와 경외를 말하므로, 의미를 흐리지 않는 방향으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §6
