id: MAL.3.10
reference: Malachi 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָבִ֨יאוּ אֶת כָּל הַֽ/מַּעֲשֵׂ֜ר אֶל בֵּ֣ית הָ/אוֹצָ֗ר וִ/יהִ֥י טֶ֨רֶף֙ בְּ/בֵיתִ֔/י וּ/בְחָנ֤וּ/נִי נָא֙ בָּ/זֹ֔את אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת אִם לֹ֧א אֶפְתַּ֣ח לָ/כֶ֗ם אֵ֚ת אֲרֻבּ֣וֹת הַ/שָּׁמַ֔יִם וַ/הֲרִיקֹתִ֥י לָ/כֶ֛ם בְּרָכָ֖ה עַד בְּלִי דָֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/010.yaml
  text: Bring the full tithe into the storehouse[a], so that there may be food in my house. And test me now in this, says Yahweh of hosts[c][b], whether I will not open for you the windows of heaven and pour out for you blessing until there is no more need.
  footnotes:
  - marker: a
    text: Or 'all the tithe' or 'the whole tithe.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the floodgates of heaven.' The Hebrew literally says 'the windows of heaven.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew idiom means an abundance beyond sufficiency; traditionally, 'until there is no more room' or 'beyond measure.'
    reason: lexical_alternative
translation:
  language: ko
  text: 온전한 십일조를 창고로 가져와 내 집에 먹을 것이 있게 하십시오. 만군의 야훼께서 말씀하십니다. “이 일로 나를 시험해 보십시오. 내가 하늘의 창문들[a]을 여러분에게 열고 여러분에게 복을 쏟아부어 더는 부족함이 없게[b] 하지 않겠는지.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘하늘의 창문들’입니다. 전통적으로는 ‘하늘의 문’ 또는 ‘하늘의 수문’으로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구는 ‘더는 부족함이 없는 때까지’, 곧 충분함을 넘는 풍성함을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאוּ
  english_pob_choice: Bring
  chosen_korean: 가져오십시오
  alternatives_korean:
  - 가져오세요
  - 들여오십시오
  lexicon: HALOT
  rationale: 명령형 복수의 직접성을 살리면서, 십일조를 성소 안으로 ‘가져오는’ 맥락을 자연스럽게 드러냅니다.
- source_word: כָּל הַמַּעֲשֵׂר
  english_pob_choice: the full tithe
  chosen_korean: 온전한 십일조
  alternatives_korean:
  - 모든 십일조
  - 십분의 일 전체
  lexicon: HALOT
  rationale: כָּל이 가리키는 전체성은 ‘온전한’으로 잘 전달되며, 단순한 수량보다 요구된 몫을 빠짐없이 가져오라는 뜻을 분명히 합니다.
- source_word: בֵּית הָאוֹצָר
  english_pob_choice: the storehouse
  chosen_korean: 창고
  alternatives_korean:
  - 저장고
  - 곳간
  lexicon: HALOT
  rationale: 성전 부속 저장 공간을 가리키는 말이므로, 현대 한국어에서 가장 자연스러운 대응인 ‘창고’를 택했습니다.
- source_word: טֶרֶף
  english_pob_choice: food
  chosen_korean: 먹을 것
  alternatives_korean:
  - 양식
  - 식량
  lexicon: HALOT
  rationale: 성전 집에 필요한 공급을 뜻하므로, 문맥상 가장 직접적인 의미인 ‘먹을 것’으로 옮겼습니다.
- source_word: אֲרֻבּוֹת הַשָּׁמַיִם
  english_pob_choice: the windows of heaven
  chosen_korean: 하늘의 창문
  alternatives_korean:
  - 하늘의 문
  - 하늘의 수문
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 보존해, 전통적 의역인 ‘폭포수 문’류보다 원문에 더 가까운 표현을 유지했습니다.
- source_word: עַד בְּלִי דָי
  english_pob_choice: until there is no more need
  chosen_korean: 더는 부족함이 없게
  alternatives_korean:
  - 더는 모자라지 않게
  - 족함이 넘치게
  lexicon: HALOT
  rationale: 관용구가 말하는 ‘충분함을 넘어서는 풍성함’을 한국어로 자연스럽게 풀어, 공간적 ‘더 이상 둘 데 없음’으로 좁히지 않았습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 이 항목의 이름-칭호 조합은 POB의 원칙에 따라 신명은 ‘야훼’로, צְבָאוֹת는 ‘만군의’로 옮겨야 합니다.
theological_decisions:
- issue: 말라기 3:10의 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה를 직접 반영하기 위해, 프로젝트 기본값대로 고유한 언약명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘하늘의 창문’ 이미지의 보존
  chosen_reading: 하늘의 창문
  alternative_readings:
  - 하늘의 수문
  - 하늘의 폭포수 문
  rationale: 예언적 약속의 시각적 이미지를 약화하지 않도록 문자적 비유를 유지했습니다.
  doctrine_reference: 'Translation philosophy: Maintain what the author meant for the audience to understand'
