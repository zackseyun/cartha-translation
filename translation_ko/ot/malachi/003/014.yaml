source:
  edition: WLC
  text: אֲמַרְתֶּ֕ם שָׁ֖וְא עֲבֹ֣ד אֱלֹהִ֑ים וּ/מַה בֶּ֗צַע כִּ֤י שָׁמַ֨רְנוּ֙ מִשְׁמַרְתּ֔/וֹ וְ/כִ֤י הָלַ֨כְנוּ֙ קְדֹ֣רַנִּ֔ית מִ/פְּנֵ֖י יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/014.yaml
  text: You have said[a], ‘It is vain to serve God[d][c][b]. And what profit is it that we have kept his charge and that we have walked in mourning before Yahweh of hosts?’
  footnotes:
  - marker: a
    text: Or 'futile' instead of 'vain.'
    reason: lexical_alternative
  - marker: b
    text: Or 'what gain' instead of 'what profit.'
    reason: lexical_alternative
  - marker: c
    text: '''His charge'' may also be rendered ''what he required'' or ''his requirement.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'walked gloomily' or 'gone about in black,' likely referring to mournful or penitential behavior.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신들은 “하나님을 섬기는 것이 헛되다.[a] 우리가 그의 명령을 지키고[c] 만군의 야훼 앞에서 애통한 모습으로 행하여도[d] 무슨 이익이 있느냐?[b]”라고 말하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛되다’는 ‘무익하다’ 또는 ‘공허하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이익’은 ‘이득’ 또는 ‘수익’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그의 명령’은 ‘그의 요구’ 또는 ‘그의 맡기신 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘애통한 모습으로’는 ‘우울하게’ 또는 ‘검은 옷을 입고’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  english_pob_choice: vain
  chosen_korean: 헛되다
  alternatives_korean:
  - 헛되다
  - 공허하다
  - 무익하다
  lexicon: HALOT
  rationale: שָׁוְא의 핵심은 헛됨과 무익함인데, ‘헛되다’는 시비조의 평가를 자연스럽게 살리면서도 과도한 의역을 피합니다.
- source_word: עֲבֹד אֱלֹהִים
  english_pob_choice: to serve God
  chosen_korean: 하나님을 섬기는 것
  alternatives_korean:
  - 하나님께 예배하는 것
  - 하나님을 섬기는 일
  lexicon: HALOT
  rationale: 여기서 עבד는 단순한 예배 행위보다 하나님께 대한 봉사·섬김의 넓은 의미를 가지므로, ‘섬기는 것’이 가장 직접적입니다.
- source_word: בֶּצַע
  english_pob_choice: profit
  chosen_korean: 이익
  alternatives_korean:
  - 이득
  - 수익
  - 보람
  lexicon: HALOT
  rationale: בֶּצַע는 얻는 바가 있느냐는 상업적 뉘앙스를 띠므로, 질문형 문맥에서 ‘이익’이 가장 자연스럽고 직설적입니다.
- source_word: מִשְׁמַרְתּוֹ
  english_pob_choice: his charge
  chosen_korean: 그의 명령
  alternatives_korean:
  - 그의 맡기신 일
  - 그의 요구
  - 그의 계명
  lexicon: HALOT
  rationale: מִשְׁמֶרֶת는 지켜야 할 책임·의무를 가리키므로, 예배적 색채가 지나치게 좁아지지 않도록 ‘명령’으로 옮겼습니다.
- source_word: קְדֹרַנִּית
  english_pob_choice: in mourning
  chosen_korean: 애통한 모습으로
  alternatives_korean:
  - 슬픈 모습으로
  - 우울하게
  - 검은 옷을 입고
  lexicon: HALOT
  rationale: 이 부사는 어둡고 침울한 태도, 곧 애통이나 상복의 모습을 가리킬 수 있으므로, 외형과 태도를 함께 드러내는 ‘애통한 모습으로’가 적절합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 본문의 신명사 יְהוָה를 프로젝트 기본값대로 ‘야훼’로 옮기고, צְבָאוֹת은 군대적·천상적 위엄을 살려 ‘만군’으로 번역합니다.
theological_decisions:
- issue: 신명사 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직접 표기합니다.
  alternative_readings:
