revisions:
- from: 그때 나는 너희에게 가까이 가서 심판하겠고, 마술하는 자들과 간음하는 자들과 거짓으로 맹세하는 자들과 품꾼의 삯을 억압하는 자들, 과부와 고아, 나그네를 굽게 하는 자들을 향하여 신속한 증인이 되겠습니다. 또한 그들은 나를 두려워하지 않습니다. 야훼 만군의 하나님께서 말씀하십니다.[a][b]
  to: 그때 내가 너희에게 가까이 가서 심판하겠습니다. 나는 주술을 행하는 자들과, 간음하는 자들과, 거짓으로 맹세하는 자들과, 품꾼의 삯을 억압하고[a] 과부와 고아를 학대하며 나그네의 권리를 빼앗고[b] 나를 두려워하지 않는 자들을 대적하여 신속한 증인이 되겠습니다. 만군의 야훼께서 말씀하십니다.
  rationale: 원문의 법정적 열거 구조를 한국어에서 명료하게 재구성했습니다. ‘과부와 고아’는 억압의 피해자로, גֵר는 권리를 침해당하는 보호 대상자로 드러내되, 히브리어가 생략한 ‘권리/정의’는 관용적 의미를 전달하기 위한 최소한의 보충으로 처리하고 각주에서 직역에 가까운 대안을 제시했습니다. 신명 칭호에서는 원문에 없는 ‘하나님’을 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:50:42Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 심판과 신속한 증언의 법정 이미지를 대체로 보존하지만, 과부와 고아가 ‘대적하는’ 대상 목록에 문법적으로 온전히 연결되지 않고, גֵר에 대한 ‘굽게 하다’의 관용적 법적 의미도 한국어에서 불명확합니다. 또한 יְהוָה צְבָאוֹת에 원문에 없는 ‘하나님’을 더했습니다.
  naturalness: ‘나그네를 굽게 하는 자들’은 현대 표준 한국어에서 뜻이 불투명합니다. ‘나그네의 권리를 빼앗는’으로 옮기고 각 악행을 병렬로 연결하면 자연스럽고, 그들이 모두 ‘나를 두려워하지 않는 자들’이라는 원문의 관계도 분명해집니다.
  terminology: מְכַשְּׁפִים은 공연·오락의 뉘앙스가 있는 ‘마술하는 자들’보다 ‘주술을 행하는 자들’이 적절합니다. יְהוָה צְבָאוֹת는 ‘만군의 야훼’로 옮겨야 하며, ‘하나님’은 원문에 없는 명사를 보태므로 حذف했습니다.
  issues:
  - severity: high
    issue: 과부와 고아가 악행자 목록에 문법적으로 불완전하게 연결됨
    rationale: 히브리어의 עֹשְׁקֵי는 품꾼의 삯뿐 아니라 과부와 고아에 대한 억압을 포함하는 열거입니다. 초안은 ‘...자들, 과부와 고아, ...자들’로 되어 과부와 고아가 대적 대상인지 악행의 피해자인지 불분명합니다.
  - severity: medium
    issue: ‘나그네를 굽게 하는’ 표현이 불명확함
    rationale: מַטֵּי גֵר는 나그네를 배제하거나 그의 권리·정의를 왜곡하는 행위를 가리킵니다. 직역적인 ‘굽게 하다’는 한국어에서 이 법적·사회적 의미를 전달하지 못합니다.
  - severity: medium
    issue: ‘야훼 만군의 하나님’에 원문에 없는 ‘하나님’이 추가됨
    rationale: 원문은 ‘야훼 만군의/군대들의’이라는 신명과 칭호이며, 별도의 אֱלֹהִים은 없습니다. ‘만군의 야훼’가 더 정확합니다.
  - severity: low
    issue: ‘마술하는 자들’의 의미 범위
    rationale: מְכַשְּׁפִים은 주술·마법 행위의 실천자를 뜻합니다. 현대어 ‘마술’은 오락적 공연을 연상시킬 수 있어 ‘주술을 행하는 자들’이 더 정확합니다.
  - severity: medium
    issue: 각주 표지의 위치
    rationale: a와 b가 절 끝에 함께 놓여 있어 각각 삯 억압과 גֵר 중 어느 표현을 설명하는지 알기 어렵습니다. 해당 표현 바로 뒤에 배치해야 합니다.
