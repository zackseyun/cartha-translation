id: MAL.3.5
reference: Malachi 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/קָרַבְתִּ֣י אֲלֵי/כֶם֮ לַ/מִּשְׁפָּט֒ וְ/הָיִ֣יתִי עֵ֣ד מְמַהֵ֗ר בַּֽ/מְכַשְּׁפִים֙ וּ/בַ/מְנָ֣אֲפִ֔ים וּ/בַ/נִּשְׁבָּעִ֖ים לַ/שָּׁ֑קֶר וּ/בְ/עֹשְׁקֵ֣י שְׂכַר שָׂ֠כִיר אַלְמָנָ֨ה וְ/יָת֤וֹם וּ/מַטֵּי גֵר֙ וְ/לֹ֣א יְרֵא֔וּ/נִי אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/005.yaml
  text: Then I will come near to you for judgment[a], and I will be a swift witness against sorcerers, against adulterers, against those who swear falsely, against those who oppress the wage of a hired worker, the widow, and the fatherless, and those who turn aside the sojourner, and do not fear me[c][b], says Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'those who defraud a hired worker of wages.' The Hebrew is literally 'those who oppress the wage of a hired worker.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the foreigner' or 'the resident foreigner.' The Hebrew גֵר denotes a non-native living among Israel under its protection.
    reason: lexical_alternative
  - marker: c
    text: 'Traditional rendering: ''the LORD of Hosts.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그때 내가 너희에게 가까이 가서 심판하겠습니다. 나는 주술을 행하는 자들과, 간음하는 자들과, 거짓으로 맹세하는 자들과, 품꾼의 삯을 억압하고[a] 과부와 고아를 학대하며 나그네의 권리를 빼앗고[b] 나를 두려워하지 않는 자들을 대적하여 신속한 증인이 되겠습니다. 만군의 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘품꾼의 삯을 착취하는 자들’이라고 옮길 수 있습니다. 히브리어는 문자적으로 ‘품꾼의 삯을 억압하는 자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나그네를 밀어내는 자들’이라고 옮길 수 있습니다. 히브리어 גֵר는 이스라엘 가운데 보호 아래 거주하는 비토착민을 가리키며, 이 표현은 문맥상 그의 권리나 정의를 왜곡하는 일을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתִּי אֲלֵיכֶם
  english_pob_choice: Then I will come near to you
  chosen_korean: 그때 나는 너희에게 가까이 가서
  alternatives_korean:
  - 그때 나는 너희에게 다가가서
  - 그때 나는 너희에게 가까이 올 것이며
  lexicon: HALOT
  rationale: 예언적 미래를 자연스럽게 살리면서, משפט과 연결되는 재판적 접근 이미지를 '가까이 가서'로 보존했습니다.
- source_word: לַמִּשְׁפָּט
  english_pob_choice: for judgment
  chosen_korean: 심판하겠고
  alternatives_korean:
  - 판결하겠고
  - 재판하겠고
  lexicon: HALOT
  rationale: 여기서는 증인과 결합된 법정 맥락이므로 '심판'이 가장 자연스럽고, 단순한 '정의'보다 문맥을 더 분명히 반영합니다.
- source_word: וְהָיִיתִי עֵד מְמַהֵר
  english_pob_choice: and I will be a swift witness
  chosen_korean: 신속한 증인이 되겠습니다
  alternatives_korean:
  - 빠른 증인이 되겠습니다
  - 신속히 증언하겠습니다
  lexicon: HALOT
  rationale: 명사적 구조를 한국어에서 자연스럽게 풀어 옮기되, 하나님의 증언이 즉각적이라는 강조를 살렸습니다.
- source_word: בַּמְכַשְּׁפִים
  english_pob_choice: against sorcerers
  chosen_korean: 마술하는 자들
  alternatives_korean:
  - 주술사들
  - 마법사들
  lexicon: HALOT
  rationale: 한국어에서 '마술하는 자들'은 מקור의 행위 중심 표현을 비교적 직접적으로 옮기며, 현대 독자에게도 과도한 문화적 오해를 줄입니다.
- source_word: וּבְעֹשְׁקֵי שְׂכַר שָׂכִיר
  english_pob_choice: against those who oppress the wage of a hired worker
  chosen_korean: 품꾼의 삯을 억압하는 자들
  alternatives_korean:
  - 품꾼의 삯을 착취하는 자들
  - 품꾼의 임금을 가로채는 자들
  lexicon: HALOT
  rationale: 영어 POB의 source-closeness를 따라 'wage'에 해당하는 בִּ삭/שְׂכַר의 구체성을 살렸고, 한국어에서는 '삯'이 가장 직접적입니다.
- source_word: אַלְמָנָה וְיָתוֹם
  english_pob_choice: the widow, and the fatherless
  chosen_korean: 과부와 고아
  alternatives_korean:
  - 과부와 아버지 없는 자
  - 과부와 고아
  lexicon: HALOT
  rationale: 관용적으로 굳어진 약자 범주를 한국어 성경 독자에게도 즉시 인식되게 하면서, לצד יָתוֹם의 사회적 취지를 유지합니다.
- source_word: וּמַטֵּי גֵר
  english_pob_choice: and those who turn aside the sojourner
  chosen_korean: 나그네를 굽게 하는 자들
  alternatives_korean:
  - 나그네를 외면하는 자들
  - 나그네를 억누르는 자들
  lexicon: HALOT
  rationale: 직역만으로는 어색한 히브리어 관용을 한국어에서 '굽게 하다'로 살려, 사회적·법적 굴절의 의미를 보존했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군의 하나님
  alternatives_korean:
  - 야훼 군대의 하나님
  - 야훼 만군의 주
  lexicon: HALOT
  rationale: 본 프로젝트의 기본값인 '야훼'를 따르되, צְבָאוֹת는 한국어 성경에서 널리 통용되는 '만군'으로 옮겨 독자의 가독성과 원문의 장엄함을 함께 살렸습니다.
theological_decisions:
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 규범에 따라 טְק스트의 직접적 신명 표기를 '야훼'로 유지해 언약적 고유성을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: צְבָאוֹת의 한국어화
  chosen_reading: 만군
  alternative_readings:
  - 군대들
  - 군대의
  rationale: '''Hosts''식 전통어를 그대로 따르기보다, המקור의 군사적 복수 뉘앙스를 한국어 독자에게 익숙한 ''만군''으로 전달합니다.'
  doctrine_reference: DOCTRINE.md Translation philosophy §2, §6
