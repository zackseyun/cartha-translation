base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/019.yaml
  text: For behold[a], the day is coming, burning like an oven, when all the arrogant and every evildoer will be stubble. The coming day will set them ablaze, says Yahweh of Armies[c][b], so that it will leave them neither root nor branch.
  footnotes:
  - marker: a
    text: Or 'burning like a furnace.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the proud' for 'the arrogant.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD of hosts'; rendered 'the LORD of Armies' to express the meaning of the title more transparently in modern English.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 타오르는 화로 같은 그 날이 오고 있습니다. 교만한 자들과 모든 악을 행하는 자들은 다 지푸라기처럼 될 것입니다. 그 오는 날이 그들을 불살라 버릴 것이라고 만군의 야훼께서 말씀하십니다. 그래서 그 날은 그들에게 뿌리도 가지도 남기지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘화로’는 כַּתַּנּוּר의 불타는 용광로/화덕 이미지를 포괄하기 위한 번역입니다.
    reason: source_note
  - marker: b
    text: ‘지푸라기’는 קַשׁ의 농경적 이미지를 현대 한국어에서 가장 자연스럽게 전달하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  english_pob_choice: For behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 보라
  lexicon: HALOT
  rationale: 히브리어의 주의 환기 기능을 살리되, 현대 한국어 예언문체에 자연스럽고 직접적인 호소로 옮겼습니다.
- source_word: הַיּוֹם בָּא בֹּעֵר כַּתַּנּוּר
  english_pob_choice: the day is coming, burning like an oven
  chosen_korean: 타오르는 화로 같은 그 날이 오고 있습니다
  alternatives_korean:
  - 용광로처럼 타는 그 날이 오고 있습니다
  - 화덕처럼 불타는 그 날이 오고 있습니다
  lexicon: HALOT
  rationale: בֹּעֵר과 כַּתַּנּוּר의 이미지를 과도하게 해석하지 않고, 뜨겁게 타오르는 심판의 날이라는 감각을 살렸습니다.
- source_word: זֵדִים וְכָל עֹשֵׂה רִשְׁעָה
  english_pob_choice: the arrogant and every evildoer
  chosen_korean: 교만한 자들과 모든 악을 행하는 자들
  alternatives_korean:
  - 오만한 자들과 모든 불의를 행하는 자들
  - 거만한 자들과 모든 악행자들
  lexicon: HALOT
  rationale: זֵדִים의 오만하고 뻔뻔한 태도와, עֹשֵׂה רִשְׁעָה의 행위 중심 표현을 각각 드러내기 위해 직역에 가깝게 옮겼습니다.
- source_word: קַשׁ
  english_pob_choice: stubble
  chosen_korean: 지푸라기
  alternatives_korean:
  - 짚
  - 짚단
  lexicon: HALOT
  rationale: 불에 쉽게 타는 농경 이미지를 한국어로 자연스럽게 전달하면서, 심판의 허무함과 취약함을 살렸습니다.
- source_word: וְלִהַט ... יַעֲזֹב לָהֶם שֹׁרֶשׁ וְעָנָף
  english_pob_choice: will set them ablaze ... so that it will leave them neither root nor branch
  chosen_korean: 그들을 불살라 버릴 것이라고 ... 뿌리도 가지도 남기지 않을 것입니다
  alternatives_korean:
  - 그들을 불태울 것이라고 ... 뿌리도 가지도 남기지 않을 것입니다
  - 그들을 불사르며 ... 뿌리와 가지를 남기지 않을 것입니다
  lexicon: HALOT
  rationale: אש/להט의 강한 소진 이미지를 ‘불살라 버리다’로 옮기고, שֹׁרֶשׁ וְעָנָף는 완전한 소멸을 뜻하는 대비로 보존했습니다.
theological_decisions:
- issue: יְהוָה צְבָאוֹת의 처리
  chosen_reading: 만군의 야훼
  alternative_readings:
  - 야훼 만군의 주
  - 만군의 주님
  rationale: YHWH는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고, צְבָאוֹת은 군대/우주적 권세를 투명하게 드러내기 위해 ‘만군’으로 렌더링했습니다.
  doctrine_reference: 'PROJECT GLOSSARY: יהוה / YHWH → 야훼; יְהוָה צְבָאוֹת → 만군의 야훼'
- issue: 심판 이미지의 단계성
  chosen_reading: 점화-연소-완전 제거의 순서를 살렸습니다.
  alternative_readings:
  - 그냥 ‘완전히 멸망시킬 것입니다’로 압축
  - ‘불로 태워 없앨 것입니다’로 단순화
  rationale: 본문은 ‘타오름’과 ‘뿌리도 가지도 남김 없음’을 구분해 말하므로, 한국어에서도 단계적 이미지가 유지되도록 했습니다.
  doctrine_reference: 'POB translation philosophy: preserve source imagery and tension'
