  to: 참으로, 보십시오. 불타는 화덕[a] 같은 그 날이 오고 있습니다. 모든 교만한 자와 악을 행하는 모든 자가 짚[b]이 될 것입니다. 만군의 야훼께서 말씀하십니다. 다가오는 그 날이 그들을 불태워, 그들에게 뿌리도 가지도 남기지 않을 것입니다.
  rationale: 접속사 כִּי를 ‘참으로’로 반영하고, תַּנּוּר의 이미지를 ‘화덕’으로 바로잡았습니다. קַשׁ의 서술적 비유를 ‘짚이 될 것입니다’로 유지했으며, 불태움과 뿌리·가지가 남지 않는 결과를 원문의 순서대로 보존했습니다. 각주도 실제 해당 표현 뒤에 배치하고 ‘용광로’라는 과도한 해석을 제거했습니다.
