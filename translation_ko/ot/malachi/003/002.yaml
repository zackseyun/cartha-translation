  to: 그러나 누가 그가 오시는 날을 견딜 수 있겠으며, 누가 그가 나타나실 때에 설 수 있겠습니까? 그는 정련하는 이의 불과 같고, 세탁하는 이들의 비누와 같습니다.[a]
  rationale: 수사 의문문의 잠재적 의미(‘견딜 수 있겠으며/설 수 있겠습니까?’), 나타남의 시간절, 그리고 두 정화 비유를 유지했습니다. ‘그가 오시는 날’로 한국어의 자연스러움을 높이고, 세탁공 및 알칼리성 세정제라는 어휘적 정보를 각주에 분명히 했습니다.
