  text: וּ/מִ֤י מְכַלְכֵּל֙ אֶת י֣וֹם בּוֹא֔/וֹ וּ/מִ֥י הָ/עֹמֵ֖ד בְּ/הֵרָֽאוֹת֑/וֹ כִּֽי הוּא֙ כְּ/אֵ֣שׁ מְצָרֵ֔ף וּ/כְ/בֹרִ֖ית מְכַבְּסִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/002.yaml
  text: But who can endure the day of his coming[a], and who can stand when he appears? For he is like a refiner’s fire and like launderers’ soap.
  footnotes:
  - marker: a
    text: Or “like fullers’ soap.” The Hebrew refers to a strong cleansing alkali used in washing cloth.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 누가 그의 오심의 날을 견딜 수 있겠으며, 누가 그가 나타나실 때에 설 수 있겠습니까? 그는 마치 정련하는 불 같고, 마치 빨래하는 이들의 비누 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “풀러들의 비누”입니다. 히브리어는 옷을 씻는 데 쓰던 강한 알칼리성 세정물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַלְכֵּל
  english_pob_choice: can endure
  chosen_korean: 견딜 수 있겠으며
  alternatives_korean:
  - 버틸 수 있겠으며
  - 감당할 수 있겠으며
  - 지탱할 수 있겠으며
  lexicon: HALOT
  rationale: 문맥상 ‘감당하다/견디다’의 뜻이므로, 심판적 도래 앞에서 무너짐 없이 버티는 뉘앙스를 현대 한국어로 자연스럽게 살렸습니다.
- source_word: יוֹם בּוֹאוֹ
  english_pob_choice: the day of his coming
  chosen_korean: 그의 오심의 날
  alternatives_korean:
  - 그가 오시는 날
  - 그의 오시는 날
  - 그의 도래의 날
  lexicon: HALOT
  rationale: גניטివ్ 구조를 유지하면서 예언적·종말론적 무게를 살리기 위해 ‘오심의 날’로 옮겼습니다.
- source_word: בְּהֵרָאוֹתוֹ
  english_pob_choice: when he appears
  chosen_korean: 그가 나타나실 때에
  alternatives_korean:
  - 그가 보이실 때에
  - 그가 보이실 때
  - 그가 드러나실 때에
  lexicon: HALOT
  rationale: 니팔형의 ‘보이게 되다/드러나다’ 의미를 반영하되, 문맥의 시간절로 자연스럽게 풀어 ‘나타나실 때에’로 렌더링했습니다.
- source_word: כְּבֹרִית מְכַבְּסִים
  english_pob_choice: launderers’ soap
  chosen_korean: 빨래하는 이들의 비누
  alternatives_korean:
  - 세탁하는 이들의 비누
  - 풀러들의 비누
  - 빨래꾼들의 잿물
  lexicon: HALOT
  rationale: בֹרִית의 알칼리성 세정 물질을 현대 독자가 이해하기 쉬운 이미지로 옮기되, 소독·정화의 비유를 약화하지 않도록 ‘비누’로 번역했습니다.
theological_decisions:
- issue: 정련의 불과 세정물의 비유가 암시하는 심판/정화의 긴장
  chosen_reading: 한쪽으로 ‘파괴적 심판’이나 ‘정화만’으로 좁히지 않고, 심한 검증과 정결케 함을 함께 드러내는 이미지로 유지했습니다.
  alternative_readings:
  - 주로 멸망시키는 심판
  - 주로 제사장적 정화
  rationale: 본문 자체가 정련하는 불과 빨래하는 비누를 병치하므로, 두 기능이 모두 살아 있도록 번역해 신학적 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
