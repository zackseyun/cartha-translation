  source_fidelity: 히브리어의 두 수사 의문문, ‘그의 오심의 날’과 ‘그가 나타날 때’의 병행, 그리고 정련하는 불과 세탁용 알칼리성 세정제의 비유를 대체로 충실히 반영했습니다. 다만 ‘그의 오심의 날’은 히브리어의 의미는 전달하지만 한국어로는 중복적이고 부자연스러워, ‘그가 오시는 날’이 더 정확하고 자연스럽습니다.
  naturalness: 합쇼체의 문체와 높임은 적절합니다. 그러나 ‘그의 오심의 날’ 및 ‘빨래하는 이들의 비누’는 현대 표준 한국어에서 다소 어색합니다. 각각 ‘그가 오시는 날’, ‘세탁하는 이들의 비누’로 다듬는 것이 자연스럽습니다.
  terminology: ‘정련하는 이의 불’은 מְצָרֵף의 행위자 의미를, ‘세탁하는 이들의 비누’는 מְכַבְּסִים의 복수 행위자 의미를 살립니다. 보리트는 현대의 일반 비누와 정확히 일치하지 않는 강한 알칼리성 세정제이므로, 각주에서 이를 명시합니다. 신학적 의미를 정화나 파괴 어느 한 방향으로 제한하지 않았습니다.
