id: MAL.3.8
reference: Malachi 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יִקְבַּ֨ע אָדָ֜ם אֱלֹהִ֗ים כִּ֤י אַתֶּם֙ קֹבְעִ֣ים אֹתִ֔/י וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה קְבַעֲנ֑וּ/ךָ הַֽ/מַּעֲשֵׂ֖ר וְ/הַ/תְּרוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/003/008.yaml
  text: Will a man rob God? Yet you are robbing me[a]. But you say[b], “How have we robbed you?” In the tithe and the contribution.
  footnotes:
  - marker: a
    text: Or “Will a person rob God?” The Hebrew 'man' here has a generic human sense.
    reason: lexical_alternative
  - marker: b
    text: Or “offering.” The Hebrew term can denote a contribution set apart for sacred use.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 하나님을 속일 수 있습니까? 그러나 너희는 나를 속이고 있습니다[a]. 그런데 너희는 말합니다[b]. “우리가 어떻게 주님을 속였습니까?” 십일조와 헌물에서입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사람이 하나님을 속일 수 있습니까?” 히브리어 ‘사람’은 여기서 일반적인 인간을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “헌물.” 히브리어 용어는 거룩한 용도로 따로 구별된 바침을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְבַּע / קֹבְעִים / קְבַעֲנוּךָ
  english_pob_choice: rob / robbing / robbed
  chosen_korean: 속이다 / 속이고 있습니다
  alternatives_korean:
  - 빼앗다
  - 착복하다
  - 강탈하다
  lexicon: HALOT
  rationale: 이 문맥의 קבע는 하나님께 돌려야 할 것을 부당하게 가로채는 행위를 가리키므로, 한국어로는 재정·헌물 맥락에서 자연스럽고 비난의 강도가 살아 있는 ‘속이다’가 가장 적절합니다.
- source_word: אָדָם
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 어떤 사람
  lexicon: HALOT
  rationale: 히브리어 אָדָם의 일반적·보편적 의미를 살려, 성별을 특정하지 않는 현대 한국어 ‘사람’으로 옮겼습니다.
- source_word: הַמַּעֲשֵׂר
  english_pob_choice: the tithe
  chosen_korean: 십일조
  alternatives_korean:
  - 열의
  - 열째 몫
  lexicon: HALOT
  rationale: מַעֲשֵׂר은 하나님께 드리는 정해진 십분의 일을 가리키는 표준 종교 용어이므로, 한국어 성서어휘로 확립된 ‘십일조’를 사용했습니다.
- source_word: הַתְּרוּמָה
  english_pob_choice: the contribution
  chosen_korean: 헌물
  alternatives_korean:
  - 봉헌물
  - 기부물
  - 거제물
  lexicon: HALOT
  rationale: תְּרוּמָה는 거룩한 용도로 따로 구별된 바침을 뜻하므로, 한국어로는 제의적·헌납적 성격을 무리 없이 드러내는 ‘헌물’을 택했습니다.
theological_decisions:
- issue: 예언자적 책망의 직접성
  chosen_reading: ‘너희는 나를 속이고 있습니다’로 현재진행형을 써서, 하나님의 책망이 단순한 과거 사실이 아니라 현재의 지속된 죄를 고발하는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘너희는 나를 속였습니다’
  - ‘너희가 나를 속이는구나’
  rationale: 본문의 대조 구조와 책망의 즉시성을 한국어에서 분명히 드러내기 위한 선택입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: ‘주님’과 ‘하나님’의 구분
  chosen_reading: 마지막 질문의 직접 인용에서는 ‘주님’을 사용하고, 서술부에서는 ‘하나님’을 사용했습니다.
  alternative_readings:
  - 모두 ‘하나님’
  - 모두 ‘주’
  rationale: אַתֶּם קֹבְעִים אֹתִי는 1인칭 직접 대조를 유지하고, 인용문 안의 너희 대상을 자연스럽게 지칭하기 위해 한국어 호칭을 문맥에 맞게 구분했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
