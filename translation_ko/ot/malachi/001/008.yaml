  verdict: revise
  source_fidelity: 첫 번째 동사 הֲיִרְצְךָ는 상대를 기꺼이 받아들이거나 좋게 여기는 뜻이고, 이어지는 הֲיִשָּׂא פָנֶיךָ는 ‘얼굴을 들어 주다’라는 관용구로서 호의를 보인다는 뜻입니다. 초안은 이를 ‘기뻐하다’와 ‘받아 주다’로 옮겨 두 표현의 의미 차이를 충분히 드러내지 못했습니다.
  naturalness: ‘제물로 눈먼 짐승을 바치다’, ‘저는 짐승이나 병든 짐승’은 자연스럽습니다. 지정된 현대 합쇼체에 맞추어 질문과 명령을 ‘아닙니까/보십시오/겠습니까’로 조정하는 것이 적절합니다.
  terminology: ‘총독’은 פֶחָה에 적절하며, ‘만군의 야훼’도 프로젝트의 신명 표기 원칙에 부합합니다. ‘호의를 베풀다’는 נשא פנים의 관용적 의미를 명료하게 보존합니다.
