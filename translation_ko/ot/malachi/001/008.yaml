id: MAL.1.8
reference: Malachi 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כִֽי תַגִּשׁ֨וּ/ן עִוֵּ֤ר לִ/זְבֹּ֨חַ֙ אֵ֣ין רָ֔ע וְ/כִ֥י תַגִּ֛ישׁוּ פִּסֵּ֥חַ וְ/חֹלֶ֖ה אֵ֣ין רָ֑ע הַקְרִיבֵ֨/הוּ נָ֜א לְ/פֶחָתֶ֗/ךָ הֲ/יִּרְצְ/ךָ֙ א֚וֹ הֲ/יִשָּׂ֣א פָנֶ֔י/ךָ אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/008.yaml
  text: When you present a blind animal for sacrifice[a], is that not evil? And when you present one that is lame or sick, is that not evil? Present it, please, to your governor. Will he accept you[c][b], or show you favor? says Yahweh of hosts.
  footnotes:
  - marker: a
    text: Hebrew literally, 'there is no evil' ... 'there is no evil'; the translation renders the lines as rhetorical questions to reflect the rebuking force in context.
    reason: lexical_alternative
  - marker: b
    text: Or 'Will he be pleased with you?'
    reason: alternative_reading
  - marker: c
    text: 'Hebrew idiom: ''lift up your face,'' meaning to show favor or grant acceptance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 희생제물로 눈먼 짐승을 바치면 — 그것이 악한 일이 아니냐? 너희가 저는 짐승이나 병든 짐승을 바치면 — 그것이 악한 일이 아니냐? 그것을 네 총독에게 한번 바쳐 보아라. 그가 너를 기뻐하겠느냐, 아니면 너를 받아 주겠느냐? 만군의 야훼께서 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘악이 없다’이지만, 문맥상 반어적 책망이므로 질문형으로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘네 얼굴을 들어 주겠느냐’라는 관용구로, 호의적 수락을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּשׁוּן / תַגִּישׁוּ
  english_pob_choice: present
  chosen_korean: 바치면 / 바쳐 보아라
  alternatives_korean:
  - 가져오면
  - 드리면
  lexicon: HALOT
  rationale: 제사 문맥의 הִפְעִיל נגשׁ는 단순한 이동이 아니라 제물로 앞으로 내는 행위이므로, 한국어에서는 자연스럽게 ‘바치다’로 옮겼습니다. 뒤의 도발적 명령에는 ‘바쳐 보아라’를 써서 반어적 압박을 살렸습니다.
- source_word: עִוֵּר
  english_pob_choice: a blind animal
  chosen_korean: 눈먼 짐승
  alternatives_korean:
  - 맹인
  - 눈먼 것
  lexicon: HALOT
  rationale: 형용사가 제사에 쓰는 짐승을 가리키므로, 의미를 분명히 하기 위해 ‘짐승’을 보충했습니다. ‘눈먼’은 제의적 결함을 직접 드러내는 자연스러운 표현입니다.
- source_word: אֵין רָע
  english_pob_choice: is that not evil?
  chosen_korean: 그것이 악한 일이 아니냐?
  alternatives_korean:
  - 그것이 나쁜 일이 아니냐?
  - 악이 아니냐?
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘악이 없다’이지만, 문맥상 제사장들의 태도를 책망하는 반어적 질문이므로 한국어에서도 질문형으로 처리했습니다. ‘악한 일’은 단순한 품질 평가보다 도덕적 비난을 살립니다.
- source_word: פִּסֵּחַ / חֹלֶה
  english_pob_choice: lame or sick
  chosen_korean: 저는 짐승이나 병든 짐승
  alternatives_korean:
  - 절뚝거리는 짐승이나 병든 짐승
  - 불구이거나 병든 짐승
  lexicon: HALOT
  rationale: 둘 다 제물의 하자를 가리키는 말이므로, ‘저는’과 ‘병든’으로 자연스럽게 대응했습니다. ‘저는’은 현대한글에서 동물의 절름거림을 무리 없이 전달합니다.
- source_word: פֶחָה
  english_pob_choice: governor
  chosen_korean: 총독
  alternatives_korean:
  - 지방 총독
  - 관원
  lexicon: HALOT
  rationale: 페르시아 시대 행정관을 가리키는 말이므로, 시대색을 살리되 한국어 독자에게 익숙한 ‘총독’을 택했습니다. ‘관원’은 너무 일반적입니다.
- source_word: הֲיִשָּׂא פָנֶיךָ
  english_pob_choice: show you favor
  chosen_korean: 너를 받아 주겠느냐
  alternatives_korean:
  - 너를 좋게 보겠느냐
  - 너를 호의로 대하겠느냐
  lexicon: HALOT
  rationale: 직역은 ‘얼굴을 들어 주다’이지만, 관용적 의미는 호의적 수락입니다. 앞의 ‘기뻐하겠느냐’와 병렬을 이루도록 ‘받아 주다’로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 야훼 만군의 하나님
  lexicon: HALOT
  rationale: יהוה는 이 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, צְבָאוֹת은 전통적 신칭을 보존하는 ‘만군’으로 처리했습니다. 두 요소의 결합은 예언서의 권위 있는 종결 공식을 살립니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 언약명 יהוה를 직접 사용하므로, 전통적 대체어보다 고유한 언약 이름을 드러내는 ‘야훼’를 유지했습니다. 이는 본문이 단순한 칭호가 아니라 발화 주체의 계시된 이름을 강조하기 때문입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 반어적 질문의 처리
  chosen_reading: 질문형으로 옮겨 책망의 강도를 살림
  alternative_readings:
  - 평서형으로 직역해 ‘악이 없다’로 옮김
  - 완곡하게 ‘좋지 않다’로 옮김
  rationale: 문맥상 야훼께서 제사장들의 경멸을 드러내시는 반어이므로, 평서형은 화자의 책망을 약화시킵니다. 질문형은 원문의 수사적 압박과 도덕적 단죄를 가장 분명히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence; preserve source sense over tradition'
