    rationale: הֲיִרְצְךָ는 ‘너를 받아들이다/기꺼이 여기다’이고, הֲיִשָּׂא פָנֶיךָ는 ‘네게 호의를 보이다’입니다. 초안의 ‘기뻐하겠느냐, 아니면 너를 받아 주겠느냐’는 후자를 ‘호의’가 아닌 일반적 수락으로 옮겨 원문의 병렬을 흐립니다.
