  source_fidelity: 히브리어의 2인칭 단수 목적어(‘당신을’)와 ‘야훼의 상’이라는 제의 은유는 초안에 대체로 보존되어 있습니다. 그러나 ‘바치면서도’의 역접은 원문에 없는 대조를 더하며, 마지막 ‘말해서입니다’는 בֶּאֱמָרְכֶם의 수단·설명 관계를 자연스럽고 정확하게 표현하지 못합니다.
  naturalness: 현대 표준어 합쇼체로 ‘이는 너희가 … 말하기 때문입니다’가 원문의 논리와 한국어 문장을 모두 자연스럽게 살립니다. ‘상’은 현대 한국어에서 다소 모호할 수 있으나, 은유를 보존하는 데에는 가능하며 각주로 보완됩니다.
  terminology: יהוה는 본문과 각주에서 모두 ‘야훼’로 통일하는 것이 POB 표기 원칙 및 원문 충실성에 맞습니다. 따라서 직접 호소의 대상도 ‘주님’이 아니라 ‘야훼’를 써서 신명 표기를 일관되게 했습니다. ‘더럽혀진 음식’과 ‘멸시받는다’는 적절합니다.
