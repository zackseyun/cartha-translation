id: MAL.1.7
reference: Malachi 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַגִּישִׁ֤ים עַֽל מִזְבְּחִ/י֙ לֶ֣חֶם מְגֹאָ֔ל וַ/אֲמַרְתֶּ֖ם בַּ/מֶּ֣ה גֵֽאַלְנ֑וּ/ךָ בֶּ/אֱמָרְ/כֶ֕ם שֻׁלְחַ֥ן יְהוָ֖ה נִבְזֶ֥ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/007.yaml
  text: By presenting defiled food on my altar[a]. But you say, “How have we defiled you?” By saying[c][b], “The table of Yahweh is despised.”
  footnotes:
  - marker: a
    text: Hebrew literally 'bread,' but here in sacrificial context it refers more broadly to food presented on the altar.
    reason: lexical_alternative
  - marker: b
    text: Or 'How have we polluted you?' The Hebrew directly addresses God with 'you,' expressing that contempt for his altar is an affront to him.
    reason: alternative_reading
  - marker: c
    text: '''The table of the LORD'' is a metaphor for the altar and its sacrificial service.'
    reason: cultural_note
translation:
  language: ko
  text: 너희가 내 제단에 더럽혀진 음식[a]을 바치면서도, "우리가 어떻게 주님을 더럽혔습니까?"라고 말합니다. "야훼의 상은 멸시받는다"고 말해서입니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문자 그대로는 ‘빵’이지만, 제의 문맥에서는 제단에 바쳐지는 음식/제물을 더 넓게 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘어떻게 우리가 주님을 더럽혔습니까?’입니다. 히브리어는 하나님께 직접 ‘당신’을 향해 말해, 제단과 식탁을 멸시하는 것이 곧 하나님께 대한 모독임을 드러냅니다.
    reason: alternative_reading
  - marker: c
    text: ‘야훼의 상’은 제단과 그 제의 서비스를 가리키는 은유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מַגִּישִׁים עַל מִזְבְּחִי
  english_pob_choice: By presenting ... on my altar
  chosen_korean: 내 제단에 ...을 바치면서
  alternatives_korean:
  - 내 제단에 ...을 드리면서
  - 내 제단 위에 ...을 올리면서
  lexicon: HALOT
  rationale: 히필 분사로서 행위의 방식과 근거를 나타내므로, 한국어는 현재 진행의 부사적 연결인 "-면서"로 자연스럽게 풀었습니다. 제단에 대한 제의 행위라는 점은 "바치다"가 가장 잘 살립니다.
- source_word: לֶחֶם מְגֹאָל
  english_pob_choice: defiled food
  chosen_korean: 더럽혀진 음식
  alternatives_korean:
  - 더럽혀진 떡
  - 부정한 음식
  - 오염된 음식
  lexicon: HALOT
  rationale: לֶחֶם은 여기서 단순한 빵보다 제의적 음식/제물을 가리키므로, 문맥을 따라 "음식"으로 넓게 옮겼습니다. מְגֹאָל의 오염·더러움의 강도를 살려 "더럽혀진"을 택했습니다.
- source_word: בַּמֶּה גֵאַלְנוּךָ
  english_pob_choice: How have we defiled you?
  chosen_korean: 우리가 어떻게 주님을 더럽혔습니까?
  alternatives_korean:
  - 우리가 어떻게 주님을 오염시켰습니까?
  - 우리가 어떻게 주님을 더럽혔습니까?
  lexicon: HALOT
  rationale: 히브리어는 2인칭 남성 단수 목적어를 사용해 하나님 자신에게 직접 말하는 수사를 유지합니다. 한국어에서도 그 직설성을 살리기 위해 완곡화하지 않고 "주님을 더럽혔습니까?"로 옮겼습니다.
- source_word: שֻׁלְחַן יְהוָה
  english_pob_choice: the table of Yahweh
  chosen_korean: 야훼의 상
  alternatives_korean:
  - 야훼의 식탁
  - 야훼의 상
  lexicon: HALOT
  rationale: 제단과 그 제의 서비스를 가리키는 은유를 보존하기 위해 직역에 가까운 "상"을 유지했습니다. POB의 신명 표기 원칙에 따라 יְהוָה는 "야훼"로 옮겼습니다.
theological_decisions:
- issue: 하나님을 향한 직접 호칭을 한국어에서 어떻게 유지할지
  chosen_reading: '"주님을 더럽혔습니까?"로 직접 대상을 드러내어, 제단/식탁을 향한 모독이 곧 하나님 자신에 대한 모독이라는 수사적 긴장을 보존했습니다.'
  alternative_readings:
  - '"그것을 더럽혔습니까?"'
  - '"주의 제단을 더럽혔습니까?"'
  rationale: 히브리어 접미사는 하나님께 대한 2인칭 직접 목적을 분명히 가리키므로, 대상 지시를 제단으로만 평평하게 바꾸지 않았습니다. 이는 본문의 신학적 공격성을 그대로 드러내는 선택입니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
