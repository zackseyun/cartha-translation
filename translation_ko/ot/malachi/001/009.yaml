id: MAL.1.9
reference: Malachi 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֛ה חַלּוּ נָ֥א פְנֵי אֵ֖ל וִֽ/יחָנֵ֑/נוּ מִ/יֶּדְ/כֶם֙ הָ֣יְתָה זֹּ֔את הֲ/יִשָּׂ֤א מִ/כֶּם֙ פָּנִ֔ים אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/009.yaml
  text: And now[a], entreat God for favor, that he may be gracious to us. From your hand has this come[b]; will he show favor to any of you? says Yahweh of hosts.
  footnotes:
  - marker: a
    text: Hebrew literally, 'implore the face of God.' The expression means to seek God's favor.
    reason: lexical_alternative
  - marker: b
    text: Or, 'This has come from your hand; will he accept any of you?'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 이제 하나님께 은혜를 구하여 그분이 우리에게 은혜를 베푸시게 하십시오. 이것이 여러분의 손에서 나온 것인데[a], 그분이 여러분 가운데 누구를 기꺼이 받아 주시겠습니까? 만군의 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘하나님의 얼굴을 구하다’입니다. 이 표현은 하나님의 은혜를 구한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוּ נָא פְנֵי אֵל
  english_pob_choice: entreat God for favor
  chosen_korean: 하나님께 은혜를 구하여
  alternatives_korean:
  - 하나님의 얼굴을 간청하여
  - 하나님께 간구하여
  - 하나님께 은혜를 간청하여
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘하나님의 얼굴을 구하다’이지만, 문맥상 하나님의 호의를 구하는 뜻이므로 현대 한국어에서는 ‘은혜를 구하다’가 가장 자연스럽고 의미를 잘 보존합니다.
- source_word: וִיחָנֵּנוּ
  english_pob_choice: that he may be gracious to us
  chosen_korean: 그분이 우리에게 은혜를 베푸시게
  alternatives_korean:
  - 그분이 우리를 은혜롭게 하시게
  - 그분이 우리에게 호의를 베푸시게
  lexicon: HALOT
  rationale: חנן은 언약적 뉘앙스가 있는 ‘은혜를 베풀다/베풀게 하다’로 옮기는 것이 적절하므로, 단순한 호의보다 ‘은혜’를 유지했습니다.
- source_word: מִיֶּדְכֶם הָיְתָה זֹּאת
  english_pob_choice: From your hand has this come
  chosen_korean: 이것이 여러분의 손에서 나온 것인데
  alternatives_korean:
  - 이것이 여러분의 손에서 왔는데
  - 이것은 여러분의 손에서 비롯된 것인데
  - 여러분의 손에서 이것이 왔는데
  lexicon: HALOT
  rationale: ‘손’은 행위와 책임의 출처를 나타내는 히브리적 표현이므로, 직역을 과도하게 어색하게 만들지 않으면서도 책임 귀속을 드러내는 표현으로 옮겼습니다.
- source_word: הֲיִשָּׂא מִכֶּם פָּנִים
  english_pob_choice: will he show favor to any of you?
  chosen_korean: 그분이 여러분 가운데 누구를 기꺼이 받아 주시겠습니까?
  alternatives_korean:
  - 그분이 여러분 가운데 누구에게나 호의를 보이시겠습니까?
  - 그분이 여러분에게 편파적으로 대하시겠습니까?
  - 그분이 여러분의 얼굴을 들어 주시겠습니까?
  lexicon: HALOT
  rationale: 문맥의 수사적 질문은 ‘얼굴을 들어 주다’라는 직역보다, 부정한 예물에 대한 하나님의 수용 거부를 드러내는 ‘기꺼이 받아 주다’가 더 정확합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: says Yahweh of hosts
  chosen_korean: 만군의 야훼께서 말씀하십니다
  alternatives_korean:
  - 만군의 주께서 말씀하십니다
  - 만군의 여호와께서 말씀하십니다
  lexicon: HALOT
  rationale: 이 문맥의 신명은 오리지널 표기 원칙에 따라 ‘야훼’로 옮기고, צְבָאוֹת은 통상적이면서도 위엄을 유지하는 ‘만군’으로 처리했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 신명 יְהוָה를 사용하므로, 본 프로젝트의 기준에 따라 ‘야훼’로 드러내어 언약적 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 수사적 질문 הֲיִשָּׂא מִכֶּם פָּנִים의 처리
  chosen_reading: 그분이 여러분 가운데 누구를 기꺼이 받아 주시겠습니까?
  alternative_readings:
  - 그분이 여러분에게 호의를 보이시겠습니까?
  - 그분이 여러분을 편파적으로 대하시겠습니까?
  rationale: 이 질문은 제사장의 부정한 행위를 책망하며 하나님의 수용 가능성을 부정하는 말이므로, 단순한 ‘편파성’보다 ‘받아 주심/수용’의 거부를 드러내는 표현이 본문의 효과를 잘 살립니다.
  doctrine_reference: 문맥상 하나님의 공정성보다 제사 예물의 수용 거부를 강조하는 수사적 질문
