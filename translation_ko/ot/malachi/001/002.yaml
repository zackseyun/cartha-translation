- source_word: הֲלוֹא אָח עֵשָׂו לְיַעֲקֹב
  english_pob_choice: Was not Esau Jacob’s brother?
  chosen_korean: 에서가 야곱의 형제가 아니었느냐?
  alternatives_korean:
