id: MAL.1.2
reference: Malachi 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָהַ֤בְתִּי אֶתְ/כֶם֙ אָמַ֣ר יְהוָ֔ה וַ/אֲמַרְתֶּ֖ם בַּ/מָּ֣ה אֲהַבְתָּ֑/נוּ הֲ/לוֹא אָ֨ח עֵשָׂ֤ו לְ/יַֽעֲקֹב֙ נְאֻם יְהוָ֔ה וָ/אֹהַ֖ב אֶֽת יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/002.yaml
  text: “I have loved you,” says Yahweh. But you say[a], “How have you loved us?” “Was not Esau Jacob’s brother?” declares Yahweh. “Yet I loved Jacob,”
  footnotes:
  - marker: a
    text: Or, more formally, “I loved you … How did you love us? … Did I not love Jacob?” The Hebrew perfect forms can be rendered with simple past in English.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 너희를 사랑하였다”라고 야훼께서 말씀하십니다. 그런데 너희는 “어떻게 우리를 사랑하셨습니까?”라고 말합니다. “에서가 야곱의 형제가 아니었느냐?”라고 야훼께서 선언하십니다. “그런데도 내가 야곱을 사랑하였다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 완료형은 한국어에서 단순 과거로 옮겨도 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהַבְתִּי
  english_pob_choice: I have loved
  chosen_korean: 내가 너희를 사랑하였다
  alternatives_korean:
  - 내가 너희를 사랑해 왔다
  - 내가 너희를 사랑했습니다
  lexicon: HALOT
  rationale: 완전과거형의 과거 행위를 한국어에서는 자연스러운 단순 과거로 옮기되, 현재적 효력을 굳이 덧붙이지 않아도 문맥의 논쟁적 선언이 살아납니다.
- source_word: אָמַר יְהוָה / נְאֻם יְהוָה
  english_pob_choice: says Yahweh / declares the LORD
  chosen_korean: 야훼께서 말씀하십니다 / 야훼께서 선언하십니다
  alternatives_korean:
  - 야훼께서 말씀하셨습니다
  - 야훼의 말씀이십니다
  lexicon: HALOT
  rationale: 본문의 예언자적 발화 표지를 구분해, 앞의 직접 발화는 '말씀하십니다', 뒤의 엄숙한 판결성 진술은 '선언하십니다'로 살렸습니다.
- source_word: בַּמָּה אֲהַבְתָּנוּ
  english_pob_choice: How have you loved us
  chosen_korean: 어떻게 우리를 사랑하셨습니까?
  alternatives_korean:
  - 무슨 일로 우리를 사랑하셨습니까?
  - 어떤 방식으로 우리를 사랑하셨습니까?
  lexicon: HALOT
  rationale: בַּמָּה의 도전적 질문 성격을 한국어의 자연스러운 의문형 '어떻게'로 옮겨, 불평 섞인 반문을 유지했습니다.
- source_word: הֲלוֹא אָח עֵשָׂו לְיַעֲקֹב
  english_pob_choice: Was not Esau Jacob’s brother?
  chosen_korean: 에서가 야곱의 형제가 아니었느냐?
  alternatives_korean:
  - 에서는 야곱의 형제가 아니었느냐?
  - 에서가 야곱의 형제가 아니냐?
  lexicon: HALOT
  rationale: אָח를 관계적 표현으로 풀어 '야곱의 형제'로 옮겨, 히브리어의 친족 관계를 직역보다 자연스럽게 드러냈습니다.
- source_word: וָאֹהַב אֶת יַעֲקֹב
  english_pob_choice: Yet I loved Jacob
  chosen_korean: 그런데도 내가 야곱을 사랑하였다
  alternatives_korean:
  - 그러나 내가 야곱을 사랑하였다
  - 그렇지만 내가 야곱을 사랑하였다
  lexicon: HALOT
  rationale: 문맥상 에서와 야곱의 대비를 드러내는 접속력을 한국어 '그런데도'로 살려, 단순 병렬보다 반전의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 야훼의 이름을 본문에서 어떻게 처리할지
  chosen_reading: 히브리어 본문의 여호와 표준 대신 '야훼'를 본문에 직접 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기준에 따라 여호와를 대체하지 않고, 원문 고유명사인 YHWH를 음역해 하나님의 개인 이름을 보존했습니다.
  doctrine_reference: 원문 우선 및 YHWH 음역 원칙
- issue: 야곱에 대한 사랑을 '선택'으로 풀지 여부
  chosen_reading: 본문의 אהב를 그대로 '사랑하다'로 유지했습니다.
  alternative_readings:
  - 선택하다
  - 언약적 사랑을 베풀다
  rationale: 문맥상 선택의 신학이 암시되더라도, 본문 자체가 말하는 동사는 사랑이므로 해석어를 본문에 앞서 넣지 않고 긴장을 보존했습니다.
  doctrine_reference: 원어-본문 우선, 해석 과잉 자제
