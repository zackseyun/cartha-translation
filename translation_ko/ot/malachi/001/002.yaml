  lexicon: HALOT
  rationale: אָח를 관계적 표현으로 풀어 '야곱의 형제'로 옮겨, 히브리어의 친족 관계를 직역보다 자연스럽게 드러냈습니다.
- source_word: וָאֹהַב אֶת יַעֲקֹב
  english_pob_choice: Yet I loved Jacob
  chosen_korean: 그런데도 내가 야곱을 사랑하였다
  alternatives_korean:
