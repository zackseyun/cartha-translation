  lexicon: HALOT
  rationale: 문맥상 에서와 야곱의 대비를 드러내는 접속력을 한국어 '그런데도'로 살려, 단순 병렬보다 반전의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 야훼의 이름을 본문에서 어떻게 처리할지
  chosen_reading: 히브리어 본문의 여호와 표준 대신 '야훼'를 본문에 직접 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기준에 따라 여호와를 대체하지 않고, 원문 고유명사인 YHWH를 음역해 하나님의 개인 이름을 보존했습니다.
  doctrine_reference: 원문 우선 및 YHWH 음역 원칙
- issue: 야곱에 대한 사랑을 '선택'으로 풀지 여부
  chosen_reading: 본문의 אהב를 그대로 '사랑하다'로 유지했습니다.
  alternative_readings:
  - 선택하다
  - 언약적 사랑을 베풀다
  rationale: 문맥상 선택의 신학이 암시되더라도, 본문 자체가 말하는 동사는 사랑이므로 해석어를 본문에 앞서 넣지 않고 긴장을 보존했습니다.
  doctrine_reference: 원어-본문 우선, 해석 과잉 자제
