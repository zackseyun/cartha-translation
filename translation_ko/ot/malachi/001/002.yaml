base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/002.yaml
  text: “I have loved you,” says Yahweh. But you say[a], “How have you loved us?” “Was not Esau Jacob’s brother?” declares Yahweh. “Yet I loved Jacob,”
  footnotes:
  - marker: a
    text: Or, more formally, “I loved you … How did you love us? … Did I not love Jacob?” The Hebrew perfect forms can be rendered with simple past in English.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 너희를 사랑했습니다.”라고 야훼께서 말씀하십니다. 그러나 너희는 “어떻게 우리를 사랑하셨습니까?”라고 말합니다. “에서는 야곱의 형제가 아니었습니까?”라고 야훼께서 선언하십니다. “그러나 내가 야곱을 사랑했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 완료형은 문맥상 ‘사랑해 왔다’ 등으로도 옮길 수 있으나, 한국어에서는 단순 과거로 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
