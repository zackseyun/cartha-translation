id: MAL.1.12
reference: Malachi 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּ֖ם מְחַלְּלִ֣ים אוֹת֑/וֹ בֶּ/אֱמָרְ/כֶ֗ם שֻׁלְחַ֤ן אֲדֹנָ/י֙ מְגֹאָ֣ל ה֔וּא וְ/נִיב֖/וֹ נִבְזֶ֥ה אָכְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/012.yaml
  text: But you are profaning it by saying[a], ‘The table of the Lord is defiled, and its fruit, its food[b], is despised.’
  footnotes:
  - marker: a
    text: Or, 'you are profaning him,' if the pronoun is taken as referring directly to the Lord rather than to his name.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'its fruit, its food.' The phrase likely refers to the food offerings associated with the altar/table.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신들은 「주님의 식탁은 더럽혀졌으며, 그 제물, 곧 그 음식은 멸시받는다」라고 말함으로써 그것을 더럽히고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘그것을’로 읽는 것이 자연스럽지만, 문맥상 ‘그분을’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그 열매, 그 음식’입니다. 이 표현은 제단/식탁과 연결된 제의적 음식물을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְחַלְּלִים
  english_pob_choice: are profaning
  chosen_korean: 더럽히고 있습니다
  alternatives_korean:
  - 모독하고 있습니다
  - 속되고 있습니다
  - 더럽히고 있습니다
  lexicon: HALOT
  rationale: חלל의 제의적 의미는 단순한 오염보다 성스러운 것을 속되게 만드는 행위를 가리키므로, 문맥상 ‘더럽히다’보다 ‘모독하다’가 가능하지만 한국어에서 자연스럽고 강한 표현으로는 ‘더럽히고 있습니다’가 적절합니다.
- source_word: אוֹתוֹ
  english_pob_choice: it
  chosen_korean: 그것을
  alternatives_korean:
  - 그분을
  - 그것
  lexicon: HALOT
  rationale: 직접목적어는 앞선 문맥의 ‘이름’을 가리키는 것으로 읽는 것이 자연스러우므로, 인칭화하지 않고 ‘그것을’로 옮겨 원문과 POB의 해석을 반영했습니다.
- source_word: שֻׁלְחַן אֲדֹנָי
  english_pob_choice: the table of the Lord
  chosen_korean: 주님의 식탁
  alternatives_korean:
  - 주님의 상
  - 주님의 제단
  - 주님의 식탁
  lexicon: HALOT
  rationale: שֻׁלְחָן은 문자적으로 ‘식탁’이지만 제의 문맥에서는 제단/제물과 연결된 식탁 이미지이므로, 직역을 살리면서도 현대 한국어에서 자연스러운 ‘주님의 식탁’으로 옮겼습니다.
- source_word: נִיבוֹ / אָכְלוֹ
  english_pob_choice: its fruit, its food
  chosen_korean: 그 제물, 곧 그 음식
  alternatives_korean:
  - 그 열매, 그 음식
  - 그 산물, 그 음식
  - 그 제물, 곧 그 음식
  lexicon: HALOT
  rationale: 두 표현은 압축된 병렬로 제단/식탁에 딸린 제의적 산물을 가리키므로, 의미를 풀어 ‘그 제물, 곧 그 음식’으로 옮겨 מקור의 중첩을 보존했습니다.
theological_decisions:
- issue: 오וֹתוֹ의 지시 대상
  chosen_reading: 앞선 문맥의 ‘이름’을 가리키는 것으로 보아 비인칭적으로 ‘그것을’로 번역했습니다.
  alternative_readings:
  - ‘그분을’로 번역해 주님 자신을 직접 가리키는 것으로 볼 수 있습니다.
  rationale: 말라기 1:11의 ‘내 이름’과의 연속성을 살리면, 이 구절은 주님의 이름을 욕되게 하는 행위를 말하는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §3
