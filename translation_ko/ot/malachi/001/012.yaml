revisions:
- from: 그러나 당신들은 「주님의 식탁은 더럽혀졌으며, 그 제물, 곧 그 음식은 멸시받는다」라고 말함으로써 그것을 더럽히고 있습니다.[a][b]
  to: 그러나 여러분은 “주님의 식탁은 더럽혀진 것이며, 그 산물, 곧 그 음식은[a] 멸시받는다”라고 말하여 그것을[b] 욕되게 하고 있습니다.
  rationale: 제의적으로 거룩한 것을 속되게 한다는 חלל의 의미를 ‘욕되게 하다’로 반영하고, נִיבוֹ를 해석적으로 ‘제물’이라 특정하지 않고 ‘산물’로 옮겼습니다. 직접목적어의 가능한 두 지시 대상과 ‘산물, 음식’의 제의적 의미는 각각 해당 위치에 각주로 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:50:02Z'
review_pass:
  verdict: revise
  source_fidelity: ‘더럽히고 있습니다’는 חלל의 핵심인 성스러운 것을 속되게 하거나 욕되게 한다는 제의적 의미를 충분히 드러내지 못합니다. ‘욕되게 하고 있습니다’가 문맥과 앞 절의 ‘이름’이라는 가능한 선행사를 더 잘 반영합니다. 또한 נִיבוֹ는 ‘제물’로 특정하기보다 ‘산물’로 옮겨 원문의 표현을 보존하는 편이 안전합니다.
  naturalness: ‘그러나 여러분은’과 ‘~라고 말하여’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘그 산물, 곧 그 음식’은 히브리어의 압축된 동격 표현을 무리 없이 보존합니다.
  terminology: אֲדֹנָי는 ‘주님’으로 적절히 옮겼습니다. שֻׁלְחַן은 ‘식탁’으로 유지하고, מְחַלְּלִים은 제의적 모독의 뜻이 드러나는 ‘욕되게 하다’로 바로잡습니다.
