  edition: WLC
  text: כִּ֣י מִ/מִּזְרַח שֶׁ֜מֶשׁ וְ/עַד מְבוֹא֗/וֹ גָּד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם וּ/בְ/כָל מָק֗וֹם מֻקְטָ֥ר מֻגָּ֛שׁ לִ/שְׁמִ֖/י וּ/מִנְחָ֣ה טְהוֹרָ֑ה כִּֽי גָד֤וֹל שְׁמִ/י֙ בַּ/גּוֹיִ֔ם אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/011.yaml
  text: For from the rising of the sun to its setting[a], my name is great among the nations, and in every place incense is offered, and a pure offering is brought, to my name; for my name is great among the nations[d][c][b], says Yahweh of hosts.
  footnotes:
  - marker: a
    text: Or 'from the east to the west'; literally, 'from the rising of the sun to its setting.'
    reason: lexical_alternative
  - marker: b
    text: Or 'among the Gentiles.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew may be read as describing present reality, a prophetic present, or future certainty; the translation preserves the Hebrew wording without resolving the timing.
    reason: alternative_reading
  - marker: d
    text: '''A pure offering'' translates Hebrew minchah, a term that can denote an offering generally, often a grain offering in sacrificial contexts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 해가 뜨는 곳에서부터 지는 곳까지[a] 내 이름은 민족들 가운데서[b] 위대합니다. 또한 모든 곳에서 내 이름을 위하여 향이 피워지고 정결한 제물이 드려집니다[d]. 내 이름은 민족들 가운데서 위대합니다[c]. 만군의 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '동쪽에서 서쪽까지'; 문자적으로는 '해가 뜨는 곳에서부터 지는 곳까지'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '이방인들 가운데'.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 현재의 사실, 예언적 현재, 또는 미래의 확실성을 가리키는 것으로 읽을 수 있습니다. 번역은 시점을 단정하지 않고 히브리어의 표현을 유지합니다.
    reason: alternative_reading
  - marker: d
    text: '''정결한 제물''은 히브리어 minchah를 옮긴 것으로, 문맥상 일반 제물 또는 흔히 곡식 제물을 가리킬 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּזְרַח שֶׁמֶשׁ וְעַד מְבוֹאוֹ
  english_pob_choice: from the rising of the sun to its setting
  chosen_korean: 해가 뜨는 곳에서부터 지는 곳까지
  alternatives_korean:
  - 동쪽에서 서쪽까지
  - 일출부터 일몰까지
  lexicon: HALOT
  rationale: 관용적 표현의 지리적·우주적 범위를 살리면서도, 한국어에서 자연스럽고 현대적인 표현으로 옮겼습니다.
- source_word: גָּדוֹל שְׁמִי
  english_pob_choice: my name is great
  chosen_korean: 내 이름은 민족들 가운데서 크게 여겨집니다
  alternatives_korean:
  - 내 이름은 큽니다
  - 내 이름이 위대합니다
  lexicon: HALOT
  rationale: 히브리어의 '이름'은 단순한 호칭이 아니라 명성과 영광을 포함하므로, 한국어에서는 '크게 여겨집니다'로 공적 존귀의 뜻을 드러냈습니다.
- source_word: מֻקְטָר מֻגָּשׁ ... וּמִנְחָה טְהוֹרָה
  english_pob_choice: incense is offered, and a pure offering is brought
  chosen_korean: 향이 피워지고, 내 이름에 순전한 제물이 드려집니다
  alternatives_korean:
  - 향이 드려지고, 순전한 제물이 바쳐집니다
  - 향이 올려지고, 깨끗한 예물이 바쳐집니다
  lexicon: HALOT
  rationale: 두 분사에 담긴 제의적 행위를 한국어로 분리해 살리되, '향'과 '제물'을 통해 제사적 어휘를 분명히 유지했습니다. '순전한'은 טהור의 의례적 순결과 품질을 함께 반영합니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 열국 가운데서
  - 이방들 가운데서
  lexicon: HALOT
  rationale: '''민족들''은 문맥상 רחב한 열국적 범위를 담으면서도, ''이방인들''보다 구약 예언서의 כלל적 표현에 더 가깝습니다.'
- source_word: אָמַר יְהוָה צְבָאוֹת
  english_pob_choice: says Yahweh of hosts
  chosen_korean: 만군의 야훼께서 말씀하십니다
  alternatives_korean:
  - 만군의 주님께서 말씀하십니다
  - 만군의 여호와께서 말씀하십니다
  lexicon: HALOT
  rationale: 이름 יהוה는 본 프로젝트 기본값에 따라 '야훼'로 옮기고, צבאות는 '만군의'로 직역해 예언자적 호칭의 군사적·우주적 울림을 보존했습니다.
theological_decisions:
- issue: 현재적 진술인지, 예언적 현재인지, 미래 성취인지의 문제
  chosen_reading: 현재 시제로 읽히는 문장 형태를 유지하여, '크게 여겨집니다'와 '드려집니다'로 옮겼습니다.
  alternative_readings:
  - '''크게 여겨질 것입니다''와 같은 미래형'
  - 예언적 현재를 더 강하게 드러내는 표현
  rationale: 히브리어는 완료형/분사와 비인칭 구조로 되어 있어 시점을 단정하지 않으므로, 한국어도 시간 해석을 열어 둔 채 표면 구조를 보존하는 편이 원문에 충실합니다.
  doctrine_reference: 성취 시점을 본문 밖에서 단정하지 말고 긴장을 보존합니다.
