revisions:
- from: “보십시오. 얼마나 피곤한 일입니까!” 하고 너희는 그것을 코웃음칩니다. 만군의 야훼께서 말씀하십니다. 너희는 도둑맞은 것과 다리 저는 것과 병든 것을 가져오면서, 그렇게 예물을 가져옵니다. 내가 그것을 너희 손에서 받겠느냐? 야훼께서 말씀하십니다.[a][b]
  to: “보십시오, 이 얼마나 번거로운 일입니까!” 하고 너희는 그것을 코웃음 칩니다[a]. 만군의 야훼께서[b] 말씀하십니다. 너희는 도둑맞은 것과 저는 것과 병든 것을 가져오고, 이렇게 예물을 가져옵니다. 내가 그것을 너희 손에서 받겠느냐? 야훼께서 말씀하십니다.
  rationale: 원문의 의미를 변경하지 않고, מַתְּלָאָה의 ‘번거롭고 고된 부담’이라는 불평의 뉘앙스를 더 잘 반영했습니다. 또한 ‘코웃음 치다’의 자연스러운 표기와 제물 목록의 간결한 병렬을 적용했으며, 두 각주 표지를 각각의 해당 본문 어구에 배치하고 b 각주의 원문 명칭 설명을 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T18:50:00Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문의 반복, 책망의 어조, 제물 목록, 수사 의문문을 충실히 옮겼습니다. 다만 מַתְּלָאָה는 단순히 육체적으로 ‘피곤한 일’이라기보다 귀찮고 고된 수고라는 불평을 나타내므로 ‘번거로운 일’이 더 알맞습니다. ‘도둑맞은 것’도 גָּזוּל(도둑질/강탈로 취한 것)을 무리 없이 반영합니다.
  naturalness: ‘그것을 코웃음칩니다’는 띄어쓰기와 결합상 ‘그것을 코웃음 칩니다’가 자연스럽습니다. 제물 목록의 ‘다리 저는 것’은 ‘저는 것’으로 간결하게 할 수 있습니다. 인용문 안의 감탄은 현대 한국어에서 ‘보십시오, 이 얼마나 번거로운 일입니까!’가 자연스럽고 합쇼체에도 맞습니다.
  terminology: ‘야훼’ 및 ‘만군의 야훼’는 제시된 프로젝트 용어 원칙과 히브리어 יהוה צבאות를 잘 보존합니다. 다만 각주 b의 ‘하늘 군대의 주’는 원문에 없는 ‘주’를 보태고 야훼라는 이름을 흐리므로, ‘만군의 야훼’의 뜻과 만군의 의미를 설명하도록 고쳐야 합니다.
