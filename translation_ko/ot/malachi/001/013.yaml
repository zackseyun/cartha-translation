source:
  edition: WLC
  text: וַ/אֲמַרְתֶּם֩ הִנֵּ֨ה מַ/תְּלָאָ֜ה וְ/הִפַּחְתֶּ֣ם אוֹת֗/וֹ אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וַ/הֲבֵאתֶ֣ם גָּז֗וּל וְ/אֶת הַ/פִּסֵּ֨חַ֙ וְ/אֶת הַ֣/חוֹלֶ֔ה וַ/הֲבֵאתֶ֖ם אֶת הַ/מִּנְחָ֑ה הַ/אֶרְצֶ֥ה אוֹתָ֛/הּ מִ/יֶּדְ/כֶ֖ם אָמַ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/013.yaml
  text: And you say[a], ‘Look, what a weariness this is,’ and you snort at it, says Yahweh of hosts. And you bring what is stolen, and the lame, and the sick; thus you bring the offering[b]. Should I accept it from your hand? says Yahweh.
  footnotes:
  - marker: a
    text: Or 'and you snort at it' or 'and you disdain it.' The Hebrew verb pictures a contemptuous exhalation, expressing scorn.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the LORD of hosts,' that is, the LORD of heavenly armies.
    reason: cultural_note
translation:
  language: ko
  text: “보십시오. 얼마나 피곤한 일입니까!” 하고 너희는 그것을 코웃음칩니다. 만군의 야훼께서 말씀하십니다. 너희는 도둑맞은 것과 다리 저는 것과 병든 것을 가져오면서, 그렇게 예물을 가져옵니다. 내가 그것을 너희 손에서 받겠느냐? 야훼께서 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 경멸의 숨 내쉼/코웃음의 이미지를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 יְהוָה צְבָאוֹת는 문자적으로 ‘만군의 야훼’, 곧 하늘 군대의 주를 뜻합니다.
    reason: ot_citation
lexical_decisions:
- source_word: מַתְּלָאָה
  english_pob_choice: what a weariness this is
  chosen_korean: 얼마나 피곤한 일입니까
  alternatives_korean:
  - 얼마나 번거로운 일입니까
  - 정말 지겨운 일입니다
  lexicon: HALOT
  rationale: 피곤함/고단함을 뜻하는 명사적 표현을 한국어 감탄문으로 살려, 제사를 귀찮은 일로 여기는 태도를 자연스럽게 드러냈습니다.
- source_word: וְהִפַּחְתֶּם אֹתוֹ
  english_pob_choice: and you sniff at it
  chosen_korean: 그것을 코웃음칩니다
  alternatives_korean:
  - 그것을 코로 내쉽니다
  - 그것을 멸시합니다
  lexicon: HALOT
  rationale: 직역하면 ‘불어내다/훌쩍이다’의 이미지이지만, 문맥의 조롱·경멸을 한국어 관용구 ‘코웃음치다’로 살렸습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 야훼 만군의 주
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 יהוה는 ‘야훼’로 옮기고, צְבָאוֹת은 하늘 군대/군대의 주권을 보존하는 ‘만군의’로 번역했습니다.
- source_word: גָּזוּל ... הַפִּסֵּחַ ... הַחוֹלֶה
  english_pob_choice: what is stolen, and the lame, and the sick
  chosen_korean: 도둑맞은 것과 다리 저는 것과 병든 것
  alternatives_korean:
  - 도둑질당한 것과 저는 것과 아픈 것
  - 약탈당한 것과 절름발이와 병든 것
  lexicon: HALOT
  rationale: 제사에 드려진 흠 있는 것들의 목록을 그대로 살리되, 동물 제물로서의 결함을 드러내는 데 필요한 최소한의 한국어를 사용했습니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the offering
  chosen_korean: 예물
  alternatives_korean:
  - 제물
  - 헌물
  - 소제
  lexicon: HALOT
  rationale: 문맥상 특정한 곡식제물로 한정하기보다, 드려지는 제물을 포괄하는 말로 ‘예물’을 택해 앞의 흠 있는 제물들과의 연결을 유지했습니다.
theological_decisions:
- issue: 야훼의 본문 내 음역 유지
  chosen_reading: 본문에서 ‘야훼’를 사용합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 원문에 יְהוָה가 직접 나오므로, 프로젝트 기본값과 원문 추적성을 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 만군의 제목 보존
  chosen_reading: ‘만군의’로 옮겨 군사적/천상적 위엄을 보존합니다.
  alternative_readings:
  - 전능하신
  - 천군만군의
  rationale: צְבָאוֹת을 설명적으로 풀기보다 전승적 호칭의 긴장과 위엄을 유지하는 쪽이 원문의 꾸짖는 어조에 더 가깝습니다.
  doctrine_reference: POB glossary — יְהוָה צְבָאוֹת
