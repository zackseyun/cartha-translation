  rationale: POB가 'burden'을 유지한 점을 따라, 예언문의 무게감과 심판적 긴장을 살릴 수 있는 ‘짐’으로 옮겼습니다. '예언'은 의미를 완화하고, '부담'은 현대어로 다소 추상적입니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of the LORD
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 주님의 말씀
  - 여호와의 말씀
  - 하나님의 말씀
  lexicon: WLC דְבַר + יְהוָה
  rationale: 본문의 신명(יהוה)을 POB 기본 원칙에 따라 ‘야훼’로 직역했고, ‘말씀’은 דְבַר의 기본 대응으로 유지했습니다. '주님'은 인용 표식이 약해지고, '하나님의 말씀'은 מקור의 고유 신명 정보를 지웁니다.
- source_word: אֶל יִשְׂרָאֵל
  english_pob_choice: to Israel
  chosen_korean: 이스라엘에게
  alternatives_korean:
