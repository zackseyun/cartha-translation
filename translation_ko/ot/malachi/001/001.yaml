  text: מַשָּׂ֥א דְבַר יְהוָ֖ה אֶל יִשְׂרָאֵ֑ל בְּ/יַ֖ד מַלְאָכִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/001.yaml
  text: 'The burden of the word of the LORD to Israel by the hand of Malachi:'
translation:
  language: ko
  text: 야훼의 말씀의 짐이 말라기의 손을 통해 이스라엘에게 임했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַשָּׂא는 ‘짐/무거운 짐’뿐 아니라 예언적 ‘경고의 말씀’의 관용적 표지가 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: בְּיַד는 직역하면 ‘손으로’이지만, 여기서는 ‘…을 통해/واسطة로’라는 전달 매개를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂ֥א
  english_pob_choice: burden
  chosen_korean: 짐
  alternatives_korean:
  - 부담
  - 경고의 말씀
  - 예언
  lexicon: WLC מַשָּׂא
  rationale: POB가 'burden'을 유지한 점을 따라, 예언문의 무게감과 심판적 긴장을 살릴 수 있는 ‘짐’으로 옮겼습니다. '예언'은 의미를 완화하고, '부담'은 현대어로 다소 추상적입니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of the LORD
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 주님의 말씀
  - 여호와의 말씀
  - 하나님의 말씀
  lexicon: WLC דְבַר + יְהוָה
  rationale: 본문의 신명(יהוה)을 POB 기본 원칙에 따라 ‘야훼’로 직역했고, ‘말씀’은 דְבַר의 기본 대응으로 유지했습니다. '주님'은 인용 표식이 약해지고, '하나님의 말씀'은 מקור의 고유 신명 정보를 지웁니다.
- source_word: אֶל יִשְׂרָאֵל
  english_pob_choice: to Israel
  chosen_korean: 이스라엘에게
  alternatives_korean:
  - 이스라엘을 향해
  - 이스라엘에
  - 이스라엘에게로
  lexicon: WLC אֶל + יִשְׂרָאֵל
  rationale: אֶל의 방향성을 자연스러운 한국어 여격 ‘-에게’로 옮겨, 예언의 수신 대상을 분명히 했습니다.
- source_word: בְּיַד מַלְאָכִי
  english_pob_choice: by the hand of Malachi
  chosen_korean: 말라기의 손을 통해
  alternatives_korean:
  - 말라기를 통해
  - 말라기의 손으로
  - 말라기에게 맡겨
  lexicon: WLC בְּיַד + מַלְאָכִי
  rationale: 관용구 ‘by the hand of’의 매개/전달 의미를 보존하면서도 한국어에서 자연스러운 표현인 ‘손을 통해’로 옮겼습니다. ‘말라기를 통해’는 더 간결하지만 ‘손’의 매개성을 약화시킵니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문의 יהוה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 프로젝트 기본 원칙에 따라 히브리어 고유 신명을 가려내어 번역하되, NT의 인용 문제는 본 절에 해당하지 않으므로 별도 주석 없이 본문에 반영했습니다.
  doctrine_reference: OT divine name policy
