  - 이스라엘에게로
  lexicon: WLC אֶל + יִשְׂרָאֵל
  rationale: אֶל의 방향성을 자연스러운 한국어 여격 ‘-에게’로 옮겨, 예언의 수신 대상을 분명히 했습니다.
- source_word: בְּיַד מַלְאָכִי
  english_pob_choice: by the hand of Malachi
  chosen_korean: 말라기의 손을 통해
  alternatives_korean:
  - 말라기를 통해
  - 말라기의 손으로
  - 말라기에게 맡겨
  lexicon: WLC בְּיַד + מַלְאָכִי
  rationale: 관용구 ‘by the hand of’의 매개/전달 의미를 보존하면서도 한국어에서 자연스러운 표현인 ‘손을 통해’로 옮겼습니다. ‘말라기를 통해’는 더 간결하지만 ‘손’의 매개성을 약화시킵니다.
theological_decisions:
