id: MAL.1.4
reference: Malachi 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי תֹאמַ֨ר אֱד֜וֹם רֻשַּׁ֗שְׁנוּ וְ/נָשׁוּב֙ וְ/נִבְנֶ֣ה חֳרָב֔וֹת כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הֵ֥מָּה יִבְנ֖וּ וַ/אֲנִ֣י אֶהֱר֑וֹס וְ/קָרְא֤וּ לָ/הֶם֙ גְּב֣וּל רִשְׁעָ֔ה וְ/הָ/עָ֛ם אֲשֶׁר זָעַ֥ם יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/004.yaml
  text: 'Though Edom says[a], “We are shattered, but we will return and rebuild the ruins,” this is what Yahweh of Armies says: “They may build, but I will tear down, and they will be called the territory of wickedness[d][c][b], the people with whom Yahweh is indignant forever.”'
  footnotes:
  - marker: a
    text: Or, “They will build, but I will tear down.” The Hebrew can be read predictively; the main text brings out the concessive force in context.
    reason: alternative_reading
  - marker: b
    text: 'Traditional rendering: “the LORD of hosts.”'
    reason: lexical_alternative
  - marker: c
    text: Or, “the borderland of wickedness.”
    reason: lexical_alternative
  - marker: d
    text: Or, “the people against whom the LORD is indignant forever.”
    reason: lexical_alternative
translation:
  language: ko
  text: 에돔이 말하기를 “우리는 산산이 부서졌지만, 돌아와서 무너진 곳들을 다시 세우겠습니다” 하더라도, 만군의 야훼께서 이렇게 말씀하십니다. “그들이 세울지라도 나는 헐어 버릴 것이며, 사람들은 그들을 ‘악의 지역’이라 부를 것이고, 야훼께서 영원히 분노하시는 백성이라 부를 것입니다.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그들은 세울지라도 나는 헐어 버릴 것이다”로도 읽을 수 있습니다. 히브리어는 예언적 미래로 읽힐 수 있으나, 문맥에서는 양보적 뉘앙스가 더 분명합니다.
    reason: alternative_reading
  - marker: b
    text: '전통적 번역: “만군의 여호와”'
    reason: lexical_alternative
  - marker: c
    text: 또는 “악의 경계 지역”
    reason: lexical_alternative
  - marker: d
    text: 또는 “야훼께서 영원히 분노하시는 백성”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר אֱדוֹם
  english_pob_choice: Though Edom says
  chosen_korean: 에돔이 말하기를 “...하더라도”
  alternatives_korean:
  - 에돔이 말합니다
  - 에돔이 말할지라도
  lexicon: HALOT
  rationale: כִּי의 역접적·양보적 힘을 살려 단순 인용보다 양보 구문으로 옮겼습니다. תֹאמַר은 현재적·관용적 발화로 처리해 예언적 진술의 생동감을 유지했습니다.
- source_word: רֻשַּׁשְׁנוּ וְנָשׁוּב וְנִבְנֶה חֳרָבוֹת
  english_pob_choice: We are shattered, but we will return and rebuild the ruins
  chosen_korean: 우리는 산산이 부서졌지만, 돌아와서 무너진 곳들을 다시 세우겠습니다
  alternatives_korean:
  - 우리는 무너졌지만, 돌아와서 폐허를 재건하겠습니다
  - 우리는 산산이 부서졌지만, 다시 돌아가 무너진 곳들을 세우겠습니다
  lexicon: HALOT
  rationale: רֻשַּׁשְׁנוּ는 단순한 경제적 빈곤보다 국가적 파괴를 가리키므로 ‘산산이 부서졌습니다’로 강도를 살렸습니다. חֳרָבוֹת는 ‘폐허’도 가능하지만, 문맥상 무너진 곳들의 재건을 자연스럽게 드러내기 위해 ‘무너진 곳들’로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 군대의 야훼
  lexicon: HALOT
  rationale: תְנ
- source_word: הֵמָּה יִבְנוּ וַאֲנִי אֶהֱרֹס
  english_pob_choice: They may build, but I will tear down
  chosen_korean: 그들이 세울지라도 나는 헐어 버릴 것이며
  alternatives_korean:
  - 그들이 세우겠지만 나는 무너뜨릴 것이며
  - 그들이 건축할지라도 나는 헐어 버릴 것입니다
  lexicon: HALOT
  rationale: 독립대명사 הֵמָּה와 אֲנִי의 대조를 살려 주어를 분명히 했습니다. יִבְנוּ는 단순 건축보다 성립·세움의 뉘앙스가 있어 ‘세울지라도’로, אֶהֱרֹס는 강한 파괴를 드러내는 ‘헐어 버릴 것이다’로 옮겼습니다.
- source_word: גְּבוּל רִשְׁעָה
  english_pob_choice: the territory of wickedness
  chosen_korean: ‘악의 지역’
  alternatives_korean:
  - ‘악의 경계’
  - ‘악의 땅’
  lexicon: HALOT
  rationale: גְּבוּל은 지경/지역/경계를 가질 수 있으나, 이 절에서는 민족적 영역을 가리키는 뜻이 자연스럽습니다. רִשְׁעָה의 도덕적 평가를 그대로 살려 ‘악의 지역’으로 옮겼습니다.
- source_word: וְהָעָם אֲשֶׁר זָעַם יְהוָה
  english_pob_choice: the people with whom Yahweh is indignant forever
  chosen_korean: 야훼께서 영원히 분노하시는 백성
  alternatives_korean:
  - 야훼께서 영원히 노하시는 백성
  - 야훼께서 영원토록 진노하시는 백성
  lexicon: HALOT
  rationale: זָעַם은 단순 화남보다 공적·심판적 분노에 가깝기에 ‘분노하시는’으로 옮겼습니다. 관계를 자연스럽게 풀어 ‘~하시는 백성’으로 처리하되, 영속성을 ‘영원히’로 살렸습니다.
theological_decisions:
- issue: Divine name יְהוָה in prophetic speech
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 언약명 יְהוָה를 직접 드러내기 위해 전통적 간접칭호보다 ‘야훼’를 유지했습니다. 이는 예언 본문의 원문 식별성을 높이고 POB의 स्रोत-직결 원칙과도 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: כֹּה אָמַר יְהוָה צְבָאוֹת
  chosen_reading: 만군의 야훼께서 이렇게 말씀하십니다
  alternative_readings:
  - 여호와 만군의 하나님이 말씀하시기를
  - 만군의 주께서 이같이 말씀하십니다
  rationale: 예언자적 전언 공식은 현대 한국어에서 ‘이렇게 말씀하십니다’가 가장 자연스럽고, צְבָאוֹת은 의미를 살려 ‘만군의’로 옮겼습니다. 직접 신탁 인용의 권위를 유지하면서도 합쇼체를 지켰습니다.
  doctrine_reference: Translation philosophy §§2, 6
