id: MAL.1.3
reference: Malachi 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת עֵשָׂ֖ו שָׂנֵ֑אתִי וָ/אָשִׂ֤ים אֶת הָרָי/ו֙ שְׁמָמָ֔ה וְ/אֶת נַחֲלָת֖/וֹ לְ/תַנּ֥וֹת מִדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/003.yaml
  text: but Esau I hated[c][b][a], and I made his mountains a desolation and his inheritance for the jackals of the wilderness.
  footnotes:
  - marker: a
    text: Or 'I rejected' or 'I loved less.' The Hebrew verb normally means 'hate'; these alternatives reflect interpretive attempts to express covenantal preference or rejection.
    reason: lexical_alternative
  - marker: b
    text: Or 'his hill country.'
    reason: lexical_alternative
  - marker: c
    text: Traditionally 'for the dragons of the wilderness'; the Hebrew likely refers to jackals.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 에서는 내가 미워하였고, 그의 산들을 황무지로 만들었으며, 그의 유산은 광야의 승냥이들에게 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 ‘내가 거절하였다’ 또는 ‘내가 덜 사랑하였다’. 히브리어 동사는 보통 ‘미워하다’를 뜻하며, 이 대안들은 언약적 선호나 거절을 풀어내려는 해석적 시도입니다.
    reason: lexical_alternative
  - marker: b
    text: 혹은 ‘그의 산지’입니다.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로는 ‘광야의 용들’로 옮기기도 하지만, 히브리어는 자칼을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  english_pob_choice: I hated
  chosen_korean: 내가 미워하였고
  alternatives_korean:
  - 내가 거절하였고
  - 내가 덜 사랑하였고
  lexicon: HALOT
  rationale: 히브리어 שׂנא의 기본값은 강한 미움이므로, 본문이 가진 직접적 긴장을 살려 ‘미워하였고’로 옮겼습니다. 완화된 표현들은 해석을 앞세우므로 본문 중심 번역에서는 채택하지 않았습니다.
- source_word: הָרָיו
  english_pob_choice: his mountains
  chosen_korean: 그의 산들을
  alternatives_korean:
  - 그의 산지(산악지대)
  - 그의 구릉지
  lexicon: HALOT
  rationale: 복수형 הָרָיו를 가장 직접적으로 살려 ‘산들’로 옮겼습니다. ‘산지’는 지역적 해석을 덧붙이므로 본문어형을 우선했습니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 황무지로
  alternatives_korean:
  - 폐허로
  - 황폐함으로
  - 황무함으로
  lexicon: HALOT
  rationale: 명사 שְׁמָמָה의 황폐·폐허 상태를 한국어에서 자연스럽게 드러내는 표현으로 ‘황무지로’ 옮겼습니다. 결과 상태를 나타내는 문맥상 ‘만들었습니다’와 잘 어울립니다.
- source_word: לְתַנּוֹת מִדְבָּר
  english_pob_choice: for the jackals of the wilderness
  chosen_korean: 광야의 승냥이들에게
  alternatives_korean:
  - 광야의 자칼들에게
  - 사막의 승냥이들에게
  - 광야의 용들에게
  lexicon: HALOT
  rationale: תַנּוֹת은 כיום의 어휘학적 합의에 따라 광야 짐승인 자칼을 가리키므로, 전통적 ‘용들’보다 의미를 반영하는 ‘승냥이들’/‘자칼들’ 중 한국어 수용성을 고려해 ‘승냥이들’로 옮겼습니다. ‘광야의’는 מִדְבָּר의 소유·관형 관계를 반영합니다.
theological_decisions:
- issue: 야곱-에서 대조 속에서의 접속사 처리
  chosen_reading: 형식상 ‘그리고’에 해당하는 연결을 문맥상 대조를 분명히 하는 ‘그러나’로 옮겼습니다.
  alternative_readings:
  - 그리고
  - 또는
  rationale: 이 절은 앞절의 야곱에 대한 선택 선언과 분명한 대조를 이루므로, 한국어에서 의미 관계가 즉시 드러나도록 역접을 사용했습니다. 이는 원문의 대조적 힘을 보존하기 위한 문맥 기반 처리입니다.
  doctrine_reference: Hebrew syntax; Translation philosophy §1, §3
- issue: 하나님의 에서에 대한 강한 진술 유지
  chosen_reading: ‘미워하였고’라는 직접적 표현을 본문에 유지했습니다.
  alternative_readings:
  - 거절하였고
  - 덜 사랑하였고
  rationale: 히브리어 본문이 가진 신학적 긴장을 완화하지 않고 그대로 드러내는 것이 원문 충실성에 부합합니다. 해석적 완화는 주석에서 다룰 성격이지, 본문 대체어로 삼을 것은 아닙니다.
  doctrine_reference: Translation philosophy §1, §3
