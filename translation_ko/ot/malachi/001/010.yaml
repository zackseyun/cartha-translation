id: MAL.1.10
reference: Malachi 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ֤י גַם בָּ/כֶם֙ וְ/יִסְגֹּ֣ר דְּלָתַ֔יִם וְ/לֹֽא תָאִ֥ירוּ מִזְבְּחִ֖/י חִנָּ֑ם אֵֽין לִ֨/י חֵ֜פֶץ בָּ/כֶ֗ם אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/מִנְחָ֖ה לֹֽא אֶרְצֶ֥ה מִ/יֶּדְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/010.yaml
  text: Oh[a], that there were even one among you who would shut the doors, so that you would not kindle my altar in vain! I have no pleasure in you, says Yahweh of hosts[c][b], and I will not accept an offering from your hand.
  footnotes:
  - marker: a
    text: 'Or, ''Who is there even among you who would shut the doors?'' The Hebrew can be read as a rhetorical question, but here it likely expresses a wish: that someone would close the temple doors rather than continue empty worship.'
    reason: alternative_reading
  - marker: b
    text: '''Kindle my altar for nothing'' may also be rendered ''light my altar in vain.'''
    reason: lexical_alternative
  - marker: c
    text: '''Offering'' translates Hebrew minḥah, which can more specifically mean ''grain offering'' in sacrificial contexts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 너희 가운데서라도 문을 닫아 내 제단에 헛되이[b] 불을 피우지 않게 할 사람이 있다면 좋겠습니다[a]! 나는 너희를 기뻐하지 않습니다. 만군의 야훼께서 말씀하십니다. 너희 손에서 드리는 예물[c]은 받지 않겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 가운데서라도 누가 문을 닫겠습니까?’ 히브리어는 수사적 질문으로도 읽을 수 있지만, 여기서는 계속되는 공허한 예배를 그만두게 하려는 바람을 더 잘 드러내는 표현으로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘헛되이’는 히브리어 חִנָּם을 옮긴 말이며, ‘아무 소용 없이’ 또는 ‘헛된 일로’라고도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘예물’은 히브리어 מִנְחָה를 옮긴 말로, 문맥에 따라 곡식제사나 제의적 예물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי גַם בָּכֶם
  english_pob_choice: Oh, that there were even one among you
  chosen_korean: 아, 너희 가운데서라도 문을 닫아… 할 사람이 있으면 좋겠습니다
  alternatives_korean:
  - 너희 가운데 누가 있겠습니까
  - 너희 가운데 누가 문을 닫겠습니까
  - 너희 가운데서라도 문을 닫을 사람이 있으면 좋겠습니다
  lexicon: HALOT
  rationale: 히브리어는 단순 질문보다 탄식 섞인 소망/바람을 나타내므로, 한국어도 수사적 질문보다 ‘있으면 좋겠습니다’로 optative 뉘앙스를 살렸습니다.
- source_word: וְיִסְגֹּר דְּלָתַיִם
  english_pob_choice: who would shut the doors
  chosen_korean: 문을 닫아
  alternatives_korean:
  - 문을 닫고
  - 문들을 닫아
  - 성전 문을 닫아
  lexicon: HALOT
  rationale: 동사는 ‘닫다/잠그다’이고 복수형 ‘문들’은 성전 문맥을 가리키므로, 예배 중단을 암시하는 간결한 동작으로 옮겼습니다.
- source_word: חִנָּם
  english_pob_choice: for nothing
  chosen_korean: 헛되이
  alternatives_korean:
  - 아무 소용 없이
  - 헛되이
  - 값없이
  lexicon: HALOT
  rationale: 문맥상 제단에 불을 피우는 행위가 무의미하고 공허하다는 뜻이므로, 현대 한국어에서 자연스럽고 성경적 어감도 있는 ‘헛되이’를 택했습니다.
- source_word: אֵין לִי חֵפֶץ בָּכֶם
  english_pob_choice: I have no pleasure in you
  chosen_korean: 나는 너희를 기뻐하지 않습니다
  alternatives_korean:
  - 나는 너희를 즐거워하지 않습니다
  - 나는 너희에게 기쁨이 없습니다
  - 나는 너희를 좋아하지 않습니다
  lexicon: HALOT
  rationale: חֵפֶץ는 기쁨/호의/즐거움을 뜻하므로, 언약적 거절의 어조를 유지하면서도 직역보다 자연스러운 ‘기뻐하지 않습니다’로 옮겼습니다.
- source_word: וּמִנְחָה
  english_pob_choice: an offering
  chosen_korean: 예물
  alternatives_korean:
  - 제물
  - 소제물
  - 공물
  lexicon: HALOT
  rationale: מִנְחָה는 제의 문맥에서 곡식제사까지 포함할 수 있지만, 여기서는 예배 전체를 향한 거절이므로 너무 좁히지 않는 ‘예물’이 적절합니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  - 야훼 만군의 하나님
  lexicon: HALOT
  rationale: 신명은 본문 원형을 따라 ‘야훼’로 옮기고, צְבָאוֹת는 전통적이며 문맥적으로도 강한 칭호인 ‘만군의’로 살렸습니다.
- source_word: לֹא אֶרְצֶה מִיֶּדְכֶם
  english_pob_choice: I will not accept an offering from your hand
  chosen_korean: 너희 손에서 드리는 예물은 받지 않겠습니다
  alternatives_korean:
  - 너희 손에서 드리는 제물은 받지 않겠습니다
  - 너희 손에서 나는 예물을 받아들이지 않겠습니다
  - 너희 손에서 드리는 것을 받지 않겠습니다
  lexicon: HALOT
  rationale: רצה는 제의 문맥에서 ‘기쁘게 받다/받아들이다’의 뜻이므로 ‘받지 않겠습니다’로 간결하게 옮기되, ‘from your hand’는 한국어 자연어에서 ‘너희 손에서 드리는’으로 반영했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 여호와 신명을 사용하므로, 프로젝트 기본 원칙에 따라 한국어 본문에는 ‘야훼’를 사용해 언약적 고유명을 드러냈습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
- issue: 예배 거절의 강도
  chosen_reading: 문을 닫아… 예물은 받지 않겠습니다
  alternative_readings:
  - 성전 문을 닫아… 예물을 받지 않겠습니다
  - 예배를 그만두게 하십시오
  rationale: 본문의 초점은 단순한 제사 방식 비판이 아니라, 공허한 예배 자체를 멈추는 편이 낫다는 강한 선언입니다. 이를 완곡하게 줄이지 않기 위해 직접적이고 단호한 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
