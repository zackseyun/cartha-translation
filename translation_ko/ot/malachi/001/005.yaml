id: MAL.1.5
reference: Malachi 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עֵינֵי/כֶ֖ם תִּרְאֶ֑ינָה וְ/אַתֶּ֤ם תֹּֽאמְרוּ֙ יִגְדַּ֣ל יְהוָ֔ה מֵ/עַ֖ל לִ/גְב֥וּל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/005.yaml
  text: Your own eyes will see[a], and you yourselves will say, “Great is Yahweh beyond the border of Israel.”
  footnotes:
  - marker: a
    text: Or, “The LORD is great beyond the border of Israel,” or “Great is the LORD beyond the border of Israel.” The Hebrew may be read as an acclamation or as a statement.
    reason: alternative_reading
translation:
  language: ko
  text: 너희가 너희 눈으로 직접 보게 될 것이며, 너희 자신도 말할 것입니다. “야훼는 이스라엘의 경계 너머에서도 위대하십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘의 경계 너머에서도 야훼께서 크게 되시기를 바랍니다.” 히브리어 표현은 선언문으로도, 야훼의 위대하심을 찬양하거나 기원하는 외침으로도 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֵינֵיכֶם
  english_pob_choice: Your own eyes
  chosen_korean: 너희의 눈은 직접
  alternatives_korean:
  - 너희의 눈은
  - 너희 눈으로
  lexicon: HALOT
  rationale: 소유격과 강조를 함께 살려 단순한 ‘너희 눈’보다 ‘너희의 눈은 직접’으로 옮겨, 눈으로 실제 확인하게 된다는 직접성을 드러냈습니다.
- source_word: תִּרְאֶינָה
  english_pob_choice: will see
  chosen_korean: 보게 될 것이며
  alternatives_korean:
  - 볼 것이며
  - 보게 됩니다
  lexicon: HALOT
  rationale: 미래형의 사건성을 살리면서 문맥상 이어지는 절을 자연스럽게 연결하도록 ‘보게 될 것이며’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 고유 신명 ע/יהוה를 제목어 ‘주님’으로 바꾸지 않고, 본 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
- source_word: מֵעַל לִגְבוּל יִשְׂרָאֵל
  english_pob_choice: beyond the border of Israel
  chosen_korean: 이스라엘의 경계 밖에서도
  alternatives_korean:
  - 이스라엘의 경계를 넘어
  - 이스라엘의 경계 너머에서도
  lexicon: HALOT
  rationale: ‘מֵעַל’의 공간적 초과를 ‘밖에서도’로 자연스럽게 풀어, 하나님의 위대하심이 이스라엘 경계에 국한되지 않음을 분명히 했습니다.
theological_decisions:
- issue: יִגְדַּל יְהוָה의 절정 표현
  chosen_reading: ‘야훼는 … 위대하십니다’로 합쇼체의 선언문처럼 옮겼습니다.
  alternative_readings:
  - ‘야훼가 크게 되십니다’
  - ‘야훼는 위대하십니다’
  rationale: 히브리어는 경구적/찬양적 선언으로 들릴 수 있으므로, 한국어에서는 자연스러운 신앙 고백형으로 처리하되 과도한 해석을 피했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: 문장 종결의 인용문 처리
  chosen_reading: 백성의 고백을 직접인용으로 두고, 그 안은 존대형 선언으로 유지했습니다.
  alternative_readings:
  - 간접화법으로 처리
  - 평서문으로만 처리
  rationale: 본문의 ‘너희 자신도 말할 것입니다’에 이어지는 고백을 직접화법으로 유지해 증언의 생동감을 살렸습니다.
  doctrine_reference: Korean style guide — quoted speech may shift register when the source demands it
