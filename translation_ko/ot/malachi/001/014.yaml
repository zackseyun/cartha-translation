id: MAL.1.14
reference: Malachi 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָר֣וּר נוֹכֵ֗ל וְ/יֵ֤שׁ בְּ/עֶדְר/וֹ֙ זָכָ֔ר וְ/נֹדֵ֛ר וְ/זֹבֵ֥חַ מָשְׁחָ֖ת לַֽ/אדֹנָ֑/י כִּי֩ מֶ֨לֶךְ גָּד֜וֹל אָ֗נִי אָמַר֙ יְהוָ֣ה צְבָא֔וֹת וּ/שְׁמִ֖/י נוֹרָ֥א בַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/malachi/001/014.yaml
  text: But cursed is the deceiver who has a male in his flock[a], and vows it, but sacrifices a blemished animal to the Lord. For I am a great King, says Yahweh of Armies[b], and my name is feared among the nations.
  footnotes:
  - marker: a
    text: Or, 'the LORD of hosts.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'my name is revered among the nations.' The Hebrew term carries the sense of inspiring fear, awe, and reverence.
    reason: lexical_alternative
translation:
  language: ko
  text: “자기 가축 떼에 수컷이 있으면서도 서원하고 흠 있는 것을 주께 제물로 바치는 속이는 자는 저주를 받습니다. 이는 내가 큰 왕이기 때문입니다. 만군의 야훼[a]께서 말씀하십니다. 내 이름은 민족들 가운데서 두려움의 대상입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군대들의 야훼’. 히브리어 표현은 전통적으로 ‘만군의 주’로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 이름은 민족들 가운데서 경외받습니다.’ 히브리어는 두려움과 경외, 위엄의 뜻을 함께 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹכֵל
  english_pob_choice: the deceiver
  chosen_korean: 속이는 자
  alternatives_korean:
  - 기만하는 자
  - 속임수를 쓰는 자
  lexicon: HALOT
  rationale: 제의적 부정직을 저지르는 사람이라는 점을 살리면서도, 현대 한국어에서 자연스럽고 문어체에 맞는 표현으로 옮겼습니다.
- source_word: יֵשׁ בְּעֶדְר/וֹ זָכָר
  english_pob_choice: who has a male in his flock
  chosen_korean: 양 떼에 수컷이 있는데도
  alternatives_korean:
  - 그의 양 떼에 수컷이 있는데도
  - 그의 떼에 수컷이 있는데도
  lexicon: HALOT
  rationale: 문맥상 합당한 제물이 되는 수컷을 이미 가지고 있으면서도 다른 것을 바친다는 점을 드러내기 위해, 관계절보다 조건·대조의 흐름으로 자연스럽게 옮겼습니다.
- source_word: מָשְׁחָת
  english_pob_choice: a blemished animal
  chosen_korean: 흠 있는 제물
  alternatives_korean:
  - 결함 있는 제물
  - 불구의 제물
  lexicon: HALOT
  rationale: 제의 문맥에서 부적합한 제물을 뜻하므로, 현대 독자가 이해하기 쉬운 ‘흠 있는’으로 옮겼습니다. 동물성을 과잉 강조하지 않고 제의적 부적합을 우선 살렸습니다.
- source_word: לַאדֹנָי
  english_pob_choice: to the Lord
  chosen_korean: 주께
  alternatives_korean:
  - 주님께
  - 주인께
  lexicon: HALOT
  rationale: 하나님께 드리는 제사의 수신자를 가리키므로, 예배 문맥에 맞는 ‘주’로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 군대들의 야훼
  - 하늘 군대의 야훼
  lexicon: HALOT
  rationale: 지침에 따라 YHWH는 ‘야훼’로 옮기고, צְבָאוֹת는 전통적 교회어보다 투명한 의미를 유지하는 ‘만군’으로 표현했습니다. 한국어 성경에서 널리 알려진 신칭호도 함께 살렸습니다.
- source_word: נוֹרָא
  english_pob_choice: is feared
  chosen_korean: 두려워받습니다
  alternatives_korean:
  - 두려움을 받습니다
  - 경외받습니다
  lexicon: HALOT
  rationale: 히브리어가 단순한 존경보다 두려움과 경외를 함께 내포하므로, 수동적 상태를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 여호와(=YHWH) 표기와 전통 교회어의 충돌
  chosen_reading: 본문의 신명은 지침에 따라 ‘야훼’로 옮기고, ‘만군의 야훼’로 전체 칭호를 재현했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 직접 나타난 여호와 이름을 가려 버리지 않고, 본문이 말하는 언약적·왕권적 자기선언을 독자에게 보존하기 위해서입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: נוֹרָא의 의미를 ‘revered’가 아니라 ‘feared’로 살림
  chosen_reading: ‘두려워받습니다’로 번역해 경외와 두려움의 긴장을 유지했습니다.
  alternative_readings:
  - 경외받습니다
  - 존중받습니다
  rationale: 문맥은 민족들 사이에서 하나님의 이름이 단순히 존중된다는 정도가 아니라, 위엄 앞에서 두려움과 경외를 일으킨다는 점을 강조합니다.
  doctrine_reference: 시 99편, 말 1:14의 예배·열방 문맥
