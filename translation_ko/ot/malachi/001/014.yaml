    issue: ‘그것을 서원하고는’이 서원의 목적어를 수컷으로 확정합니다.
    rationale: 히브리어 본문은 서원의 목적어를 명시하지 않으므로, ‘서원하고’로 두어 모호성을 보존하는 것이 안전합니다.
  - severity: high
    issue: 각주 a의 앵커와 내용이 일치하지 않습니다.
    rationale: 기존 [a]는 문장 끝에 붙어 있으나 내용은 ‘야훼께’라는 대안을 제시하고, 실제 본문에는 ‘만군의 야훼’가 있습니다. 앵커를 해당 신명에 두고 그 어구에 대한 번역 대안을 제시해야 합니다.
