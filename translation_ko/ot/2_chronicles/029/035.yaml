id: 2CH.29.35
reference: 2 Chronicles 29:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם עֹלָ֨ה לָ/רֹ֜ב בְּ/חֶלְבֵ֧י הַ/שְּׁלָמִ֛ים וּ/בַ/נְּסָכִ֖ים לָ/עֹלָ֑ה וַ/תִּכּ֖וֹן עֲבוֹדַ֥ת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
  footnotes:
  - marker: a
    text: Or "fellowship offerings" for "peace offerings."
    reason: lexical_alternative
translation:
  language: ko
  text: 번제도 또한 매우 많았으며, 화목제물[a]의 기름과 번제를 위한 전제도 있었습니다. 이렇게 야훼의 집에서 드리는 예배가 확립되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “평화제물”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלָה / לָרֹב
  english_pob_choice: the burnt offerings were also in abundance
  chosen_korean: 번제도 또한 매우 많았고
  alternatives_korean:
  - 번제들도 또한 풍성했고
  - 번제도 또한 많았고
  lexicon: HALOT
  rationale: עֹלָה는 여기서 집합적으로 쓰였고 לָרֹב은 ‘매우 많았고/풍성했고’로 자연스럽게 풀어 번제의 다수를 살렸습니다.
- source_word: בְּחֶלְבֵי הַשְּׁלָמִים
  english_pob_choice: with the fat of the peace offerings
  chosen_korean: 화목제물의 기름과
  alternatives_korean:
  - 화목제물의 기름과 함께
  - 평화제물의 기름과
  lexicon: HALOT
  rationale: חלב는 제의 문맥에서 희생 제물의 ‘기름’으로 이해하는 것이 적절하며, הַשְּׁלָמִים은 성경 제의 용어로서 ‘화목제물’을 유지했습니다.
- source_word: וּבַנְּסָכִים
  english_pob_choice: and the drink offerings
  chosen_korean: 전제도
  alternatives_korean:
  - 붓는 제물도
  - 전제와
  lexicon: HALOT
  rationale: נְסָכִים은 부어 드리는 액체 제물로, 한국어 성경 문맥에서는 ‘전제’가 가장 간결하고 제의적 의미를 잘 살립니다.
- source_word: וַתִּכּוֹן עֲבוֹדַת בֵּית יְהוָה
  english_pob_choice: So the service of the house of Yahweh was established
  chosen_korean: 그래서 야훼의 집에서 드리는 예배가 확립되었습니다
  alternatives_korean:
  - 그래서 야훼의 집의 섬김이 확립되었습니다
  - 그러므로 야훼의 집의 봉사가 확립되었습니다
  lexicon: HALOT
  rationale: עֲבוֹדָה는 여기서 성전 제의의 ‘예배/봉사’ 범주를 가지며, ‘확립되었습니다’는 כון의 수동 결과를 자연스럽게 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 신명기적 고유명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 제의 용어 עֲבוֹדַת בֵּית יְהוָה의 한국어 처리
  chosen_reading: ‘야훼의 집에서 드리는 예배’로 옮겨 제의 행위의 공적·예배적 성격을 드러냈습니다.
  alternative_readings:
  - ‘야훼의 집의 섬김’
  - ‘야훼의 집의 봉사’
  rationale: 문맥상 단순 노동보다 성전 회복의 제의 행위를 가리키므로, 한국어에서 이해되는 예배성을 살리되 과도한 교회 제도 용어는 피했습니다.
  doctrine_reference: 성전 예배/제의 용어 일관성
- issue: שְׁלָמִים의 처리
  chosen_reading: ‘화목제물’로 유지했습니다.
  alternative_readings:
  - ‘평화제물’
  - ‘교제제물’
  rationale: 전통적 제의 범주를 유지하면서도 본문이 말하는 제물의 종류를 분명히 하기 위해, 관용적이되 과도한 재해석을 피했습니다.
  doctrine_reference: 제의 용어 보존
