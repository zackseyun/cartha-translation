  lexicon: HALOT
  rationale: כלה의 완료 시점을 나타내는 זמן절로 읽어, 자연스러운 한국어 순서 관계를 살려 옮겼습니다.
- source_word: לְ/הַעֲל֑וֹת
  english_pob_choice: offering up
  chosen_korean: 제사를
  alternatives_korean:
  - 올려 드리는 것을
  - 번제를 올려 드리는 것을
  lexicon: HALOT
  rationale: 문맥상 성전 제의 행위이므로 단순한 '올리다'보다 제사 행위 전체를 드러내는 표현을 택했습니다.
- source_word: כָּרְע֗וּ
  english_pob_choice: knelt down
  chosen_korean: 무릎을 꿇고
  alternatives_korean:
  - 무릎을 꿇으며
  - 굽혀
  lexicon: HALOT
  rationale: 신체적 동작을 분명히 드러내는 כרע의 기본 의미를 살려, 뒤의 שחה와 구별되도록 했습니다.
- source_word: וַ/יִּֽשְׁתַּחֲוֽוּ
  english_pob_choice: worshiped
  chosen_korean: 절하며 예배했습니다
