source:
  edition: WLC
  text: וּ/כְ/כַלּ֖וֹת לְ/הַעֲל֑וֹת כָּרְע֗וּ הַ/מֶּ֛לֶךְ וְ/כָֽל הַ/נִּמְצְאִ֥ים אִתּ֖/וֹ וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
  footnotes:
  - marker: a
    text: Hebrew literally, 'when they finished offering up'; in this sacrificial context the sense is the completion of presenting the burnt offering.
    reason: lexical_alternative
  - marker: b
    text: Or 'bowed down' / 'prostrated themselves.' The Hebrew verb can denote the physical act of bowing in reverence; here it is rendered 'worshiped' because of the temple-sacrifice context.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 제사를 마치자, 왕과 그와 함께 있는 모든 사람이 무릎을 꿇고 절하며 예배했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘올리기를 마쳤을 때’에 가깝습니다. 여기서는 성전 제의 문맥상 제사를 드리는 행위가 완결되었음을 뜻합니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사는 문자적으로 ‘절하다/몸을 굽히다’의 뜻도 있습니다. 여기서는 예배의 의미를 살려 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְ/כַלּוֹת
  english_pob_choice: And when they had finished
  chosen_korean: 제사를 마치자
  alternatives_korean:
  - 그리고 그들이 끝내자
  - 그리고 마치자
  lexicon: HALOT
  rationale: כלה의 완료 시점을 나타내는 זמן절로 읽어, 자연스러운 한국어 순서 관계를 살려 옮겼습니다.
- source_word: לְ/הַעֲל֑וֹת
  english_pob_choice: offering up
  chosen_korean: 제사를
  alternatives_korean:
  - 올려 드리는 것을
  - 번제를 올려 드리는 것을
  lexicon: HALOT
  rationale: 문맥상 성전 제의 행위이므로 단순한 '올리다'보다 제사 행위 전체를 드러내는 표현을 택했습니다.
- source_word: כָּרְע֗וּ
  english_pob_choice: knelt down
  chosen_korean: 무릎을 꿇고
  alternatives_korean:
  - 무릎을 꿇으며
  - 굽혀
  lexicon: HALOT
  rationale: 신체적 동작을 분명히 드러내는 כרע의 기본 의미를 살려, 뒤의 שחה와 구별되도록 했습니다.
- source_word: וַ/יִּֽשְׁתַּחֲוֽוּ
  english_pob_choice: worshiped
  chosen_korean: 절하며 예배했습니다
  alternatives_korean:
  - 엎드려 예배했습니다
  - 경배했습니다
  lexicon: HALOT
  rationale: 몸의 자세를 나타내는 앞 동작과 달리, 이 동사는 예배의 종교적 의미를 담고 있어 '예배했습니다'로 옮기되, 절하는 동작도 함께 드러냈습니다.
theological_decisions:
- issue: כרע와 שחה의 이중 동작을 한국어에서 어떻게 구별할지
  chosen_reading: ‘무릎을 꿇고 절하며 예배했습니다’로, 신체적 자세와 예배 행위를 둘 다 보존했습니다.
  alternative_readings:
  - ‘무릎을 꿇고 경배했습니다’
  - ‘엎드려 예배했습니다’
  rationale: 본문은 제물 봉헌 직후의 전례적 반응을 묘사하므로, 단순한 자세 묘사로 축소하지 않고 예배의 의미를 살려야 합니다. 동시에 두 동사를 같은 뜻으로 평준화하지 않도록 구별했습니다.
  doctrine_reference: Translation philosophy §5 (key term consistency with documented exception)
