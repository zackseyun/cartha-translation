  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
  footnotes:
  - marker: a
    text: Or 'David his ancestor' or 'David his forefather'; 'father' here reflects dynastic descent, not immediate paternity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 눈에 옳은 일을 행했으며, 자기 아버지 다윗이 했던 모든 것을 따랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘아버지’는 직계 부친이 아니라 왕조적 혈통의 조상/선조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He did
  chosen_korean: 행했습니다
  alternatives_korean:
  - 하였습니다
  - 했습니다
  lexicon: HALOT
  rationale: 서술형 완료 동작을 자연스러운 합쇼체로 옮겼습니다. 본문의 평가적 진술에 맞게 ‘행하다’를 써서 단순한 행위보다 윤리적 실천의 뉘앙스를 살렸습니다.
- source_word: הַיָּשָׁר בְּעֵינֵי
  english_pob_choice: what was right in the eyes of
  chosen_korean: 야훼의 눈에 옳은 일
  alternatives_korean:
  - 야훼 보시기에 옳은 일
  - 야훼 앞에서 옳은 일
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되 한국어에서 자연스럽게 읽히도록 정리했습니다. ‘눈에’는 평가의 시점을 보존하고, ‘옳은 일’은 substantival한 ‘the right’를 반영합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥상 언약의 고유명사이므로 관례적 대체어 ‘주’가 아니라 프로젝트 기본값인 ‘야훼’를 유지했습니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  english_pob_choice: according to all that ... had done
  chosen_korean: '...이 했던 모든 것을 따랐습니다'
  alternatives_korean:
  - '...이 행한 모든 것과 같이 했습니다'
  - '...이 했던 모든 대로 했습니다'
  lexicon: HALOT
  rationale: 비교·준거의 כְּכֹל אֲשֶׁר를 한국어의 ‘따르다’로 자연스럽게 옮겨, 다윗의 전체적인 행적이 기준이 되었음을 드러냈습니다. 완료 관점은 ‘했었던’보다 간결한 ‘했던’으로 유지했습니다.
- source_word: דָּוִיד אָבִיו
  english_pob_choice: David his father
  chosen_korean: 자기 아버지 다윗
  alternatives_korean:
  - 그의 아버지 다윗
  - 조상 다윗
  lexicon: HALOT
  rationale: 직역을 유지하되 한국어 어순에 맞게 ‘자기 아버지 다윗’으로 조정했습니다. 왕조적 계보를 가리키는 ‘아버지’의 넓은 의미는 본문 문맥에서 유지하며, 과도한 해설은 본문 밖으로 남겼습니다.
theological_decisions:
- issue: 야훼의 이름을 한국어로 어떻게 처리할지
  chosen_reading: ‘야훼’로 음역하여 고유한 언약 이름을 드러냈습니다.
  alternative_readings:
  - ‘주’로 번역
  - ‘여호와’로 번역
  rationale: 본문은 일반 호칭이 아니라 히브리어 사본의 Tetragrammaton을 직접 사용하므로, 제목어 대체보다 고유명사 보존이 स्रोत에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘그의 아버지’가 즉각적 부친인지 왕조적 조상인지
  chosen_reading: 본문에는 ‘자기 아버지 다윗’을 두어 왕조적 계보 표현을 그대로 살렸습니다.
  alternative_readings:
  - ‘자기 조상 다윗’
  - ‘자기 선조 다윗’
  rationale: 히브리어 אָבִיו는 문맥상 직계 부친이 아니라 다윗 왕조의 선조를 가리킬 수 있으나, 본문 표현을 유지하는 것이 우선이므로 직역을 본문에 두고 해석 여지는 별도 주석 없이 남겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
