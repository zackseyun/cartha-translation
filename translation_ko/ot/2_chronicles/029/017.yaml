base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
  footnotes:
  - marker: a
    text: Or 'portico' or 'porch' of the LORD' for 'vestibule of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 첫째 달 초하루에 성별하기 시작했고, 그 달 여드레에 야훼의 현관[a]에 이르렀습니다. 그들은 여덟 날 동안 야훼의 집을 성별했고, 첫째 달 열여섯째 날에 마쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘현관’은 히브리어 ‘אוּלָם’을 옮긴 말로, ‘전실’이나 ‘포치’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֵלּוּ
  english_pob_choice: they began
  chosen_korean: 성별하기 시작했고
  alternatives_korean:
  - 시작했고
  - 거룩하게 하기 시작했고
  lexicon: HALOT
  rationale: 문맥상 성전 정결·준비를 위한 행위의 개시이므로, 단순한 ‘시작하다’보다 목적을 드러내는 ‘성별하기 시작하다’가 מקור의 קדשׁ와 더 잘 맞습니다.
- source_word: לְקַדֵּשׁ
  english_pob_choice: to consecrate
  chosen_korean: 성별하다
  alternatives_korean:
  - 거룩하게 하다
  - 성화하다
  - 봉헌하다
  lexicon: HALOT
  rationale: קדשׁ의 핵심은 ‘거룩한 용도로 구별하다’는 뜻이어서, 교회적 관용보다 स्रोत에 직접적인 ‘성별하다’를 택했습니다.
- source_word: אוּלָם
  english_pob_choice: vestibule
  chosen_korean: 현관
  alternatives_korean:
  - 전실
  - 현관홀
  - 포치
  lexicon: HALOT
  rationale: 성전 앞부분의 건축 용어로서 ‘vestibule’에 대응하는 한국어로, 너무 전문적이지 않으면서도 앞공간의 의미를 살릴 수 있는 ‘현관’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자 그대로의 고유명사를 보존하기 위해 본문과 동일하게 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 야훼의 집과 현관이라는 성전 공간 표현
  chosen_reading: ‘야훼의 현관’과 ‘야훼의 집’을 유지하여 성전 내부·외부의 공간 구분을 드러냈습니다.
  alternative_readings:
  - ‘주님의 성전’으로 완화
  - ‘야훼의 처소’처럼 일반화
  rationale: 본문은 건축적·예전적 진행을 순서대로 기록하므로, 공간 명칭을 흐리지 않고 원문 구조를 따라야 합니다.
  doctrine_reference: Chronicles temple-consecration narrative; no doctrinal adjustment beyond source fidelity
