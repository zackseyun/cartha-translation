source:
  edition: WLC
  text: וַ/יְהִי֙ קֶ֣צֶף יְהוָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם וַ/יִּתְּנֵ֤/ם ל/זועה לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה כַּ/אֲשֶׁ֛ר אַתֶּ֥ם רֹאִ֖ים בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
  footnotes:
  - marker: a
    text: Or 'a horror' for 'an object of terror'; the Hebrew term denotes something that causes shuddering or horror.
    reason: lexical_alternative
  - marker: b
    text: Or 'of scornful whistling'; 'hissing' refers to the derisive reaction of onlookers to devastation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼의 진노가 유다와 예루살렘에 임했고[a], 그분은 그들을 공포, 황폐, 그리고 조롱의 대상[b]이 되게 하셨습니다. 여러분이 직접 두 눈으로 보고 있는 그대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와의 진노’.
    reason: previous_rendering
  - marker: b
    text: 또는 ‘경악의 대상’, 곧 사람들로 하여금 전율하거나 야유하게 만드는 폐허의 광경입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קֶצֶף יְהוָה
  english_pob_choice: the wrath of Yahweh
  chosen_korean: 야훼의 진노
  alternatives_korean:
  - 야훼의 분노
  - 야훼의 노여움
  lexicon: HALOT
  rationale: קֶצֶף는 단순한 감정보다 심판적 분노를 가리키므로, 한국어로도 성경적 심판 어휘인 ‘진노’가 가장 직접적입니다.
- source_word: וַיִּתְּנֵם לְזוֹעָה
  english_pob_choice: he made them a horror / an object of terror
  chosen_korean: 그들을 공포의 대상이 되게 하셨습니다
  alternatives_korean:
  - 그들을 소름끼치는 존재가 되게 하셨습니다
  - 그들을 두려움의 대상으로 삼으셨습니다
  lexicon: HALOT
  rationale: לְזוֹעָה는 ‘경악/전율을 일으키는 대상’의 뜻이어서, 결과 상태를 드러내는 ‘대상이 되게 하셨습니다’가 원문의 구조를 잘 살립니다.
- source_word: וְלִשְׁרֵקָה
  english_pob_choice: of hissing
  chosen_korean: 조롱의 대상
  alternatives_korean:
  - 비웃음거리가 되게
  - 휘파람질의 대상
  lexicon: HALOT
  rationale: 이 표현은 단순한 소리가 아니라 폐허를 향한 조롱 섞인 휘파람/야유를 가리키므로, 한국어에서는 그 반응을 드러내는 ‘조롱의 대상’으로 옮겼습니다.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  english_pob_choice: as you see with your own eyes
  chosen_korean: 여러분이 직접 두 눈으로 보고 있는 그대로입니다
  alternatives_korean:
  - 여러분이 눈으로 직접 보고 있는 그대로입니다
  - 여러분이 직접 보고 있듯이입니다
  lexicon: HALOT
  rationale: ‘두 눈으로’는 히브리어의 강조를 살리면서 현재의 가시적 증거를 독자에게 직접 환기합니다.
theological_decisions:
- issue: 야훼의 진노와 심판 결과를 완화하지 않는 번역
  chosen_reading: 야훼의 진노가 유다와 예루살렘에 임했고, 그분은 그들을 공포, 황폐, 그리고 조롱의 대상이 되게 하셨습니다.
  alternative_readings:
  - 야훼의 분노가 유다와 예루살렘에 있었고, 그들을 황폐하게 두셨습니다.
  - 주님의 노여움이 임해 그들을 망하게 하셨습니다.
  rationale: 원문은 언약적 심판의 강도를 직접적으로 말하므로, 한국어에서도 그 긴장을 약화하지 않고 공개적 수치와 폐허의 결과를 함께 드러냈습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.'
