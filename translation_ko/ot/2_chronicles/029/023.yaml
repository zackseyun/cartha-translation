  source_fidelity: ‘죄를 위한 숫염소들’은 חַטָּאת의 제의적 의미를 대체로 전달하며, ‘그 위에 손을 얹었습니다’도 סמך의 의례 행위를 충실히 반영합니다. 그러나 원문의 두 번째 복수 주어는 논의의 여지가 있는데, 초안의 각주는 그 점을 설명하지 않고 단지 동사의 뜻만 풀이합니다. 또한 ‘그들이 … 자기들의 손’이라는 연결은 한국어에서 제물을 가져온 사람들을 주어로 더 강하게 고정할 수 있습니다.
  naturalness: ‘가져오고 … 얹었습니다’도 이해되지만, 현대의 격식 있는 한국어에서는 두 동작을 문장으로 나누는 편이 더 매끄럽습니다. ‘속죄제 숫염소들’은 제의 명칭으로 정착된 자연스러운 표현입니다.
  terminology: חַטָּאת는 이 문맥에서 ‘속죄제’로 옮기는 것이 제물의 종류임을 가장 명료하게 드러냅니다. קָהָל의 ‘회중’은 적절합니다. סמך는 교회적 용례가 과도하게 연상될 수 있는 ‘안수하다’보다 ‘손을 얹다’로 유지하는 것이 좋습니다.
