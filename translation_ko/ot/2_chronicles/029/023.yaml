  text: וַ/יַּגִּ֨ישׁוּ֙ אֶת שְׂעִירֵ֣י הַֽ/חַטָּ֔את לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ וְ/הַ/קָּהָ֑ל וַ/יִּסְמְכ֥וּ יְדֵי/הֶ֖ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
  footnotes:
  - marker: a
    text: Or 'presented the sin-offering goats before the king and the congregation.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew says 'they laid their hands on them'; the subject most naturally refers to the king and the assembly, possibly acting through representatives.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 죄를 위한 숫염소들을 왕과 회중 앞에 가져오고, 자기들의 손을 그 위에 얹었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 כאן의 קָהָל을 제의적·공적 모임으로 이해한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 위에 얹었습니다’는 제의 문맥의 סמך를 자연스럽게 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  english_pob_choice: they brought near
  chosen_korean: 가져오고
  alternatives_korean:
  - 가까이 가져오고
  - 드리고
  - 가져다 놓고
  lexicon: HALOT
  rationale: 제의적 문맥에서 제물을 성소 쪽으로 이동시켜 제시하는 동작을 자연스럽게 옮겼습니다. ‘드리고’도 가능하지만, 여기서는 동사의 물리적 이동감을 살려 ‘가져오고’로 번역했습니다.
- source_word: שְׂעִירֵי הַחַטָּאת
  english_pob_choice: the goats for the sin offering
  chosen_korean: 죄를 위한 숫염소들
  alternatives_korean:
  - 속죄제 숫염소들
  - 죄의 제물인 숫염소들
  - 죄를 위한 염소들
  lexicon: HALOT
  rationale: שְׂעִירֵי는 숫염소들이고, הַחַטָּאת는 추상적 ‘죄’보다 제의적 ‘속죄/죄를 위한 제사’의 뜻입니다. 새번역식의 자연성을 살리되, 제의적 기능을 드러내기 위해 ‘죄를 위한 숫염소들’로 옮겼습니다.
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  english_pob_choice: the king and the assembly
  chosen_korean: 왕과 회중
  alternatives_korean:
  - 왕과 집회
  - 왕과 백성
  - 왕과 총회
  lexicon: HALOT
  rationale: קָהָל은 모인 공동체를 가리키므로, 제의적·공적 맥락에서 가장 직접적인 한국어는 ‘회중’입니다. POB의 ‘assembly’ 의미를 살리면서도, 한국어 성경에서 자연스럽게 읽히도록 했습니다.
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  english_pob_choice: they laid their hands
  chosen_korean: 자기들의 손을 그 위에 얹었습니다
  alternatives_korean:
  - 손을 얹었습니다
  - 손을 그 위에 놓았습니다
  - 손을 그 위에 얹어 안수했습니다
  lexicon: HALOT
  rationale: סמך는 제의 문맥에서 제물 위에 손을 얹는 행위이지만, ‘안수했습니다’는 한국 교회 용어가 먼저 떠오를 수 있어 원문의 구체적 행위를 드러내는 표현을 택했습니다. 손의 위치를 분명히 하려고 ‘그 위에’로 옮겼습니다.
theological_decisions:
- issue: ‘죄’와 제의적 ‘속죄제’의 관계
  chosen_reading: 본문의 הַחַטָּאת는 제물의 종류를 가리키며, 한국어 본문에서는 의미를 바로 드러내는 ‘죄를 위한 숫염소들’로 유지합니다.
  alternative_readings:
  - 속죄제 숫염소들
  - 죄의 제물인 숫염소들
  rationale: 이 절은 추상적 죄 개념보다, 왕과 회중 앞에 제물을 가져와 손을 얹는 제의 행위를 묘사합니다. 따라서 본문은 의미를 풀어 쓰되, 제의적 기능을 독자가 놓치지 않도록 했습니다.
  doctrine_reference: 제의적 문맥에서의 חַטָּאת 용례
