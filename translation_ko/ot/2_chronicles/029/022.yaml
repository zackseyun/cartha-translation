  text: וַֽ/יִּשְׁחֲטוּ֙ הַ/בָּקָ֔ר וַ/יְקַבְּל֤וּ הַ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וַֽ/יִּזְרְק֖וּ הַ/מִּזְבֵּ֑חָ/ה וַ/יִּשְׁחֲט֣וּ הָ/אֵלִ֗ים וַ/יִּזְרְק֤וּ הַ/דָּם֙ הַ/מִּזְבֵּ֔חָ/ה וַֽ/יִּשְׁחֲטוּ֙ הַ/כְּבָשִׂ֔ים וַ/יִּזְרְק֥וּ הַ/דָּ֖ם הַ/מִּזְבֵּֽחָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
  footnotes:
  - marker: a
    text: Or 'splashed the blood on the altar' or 'dashed the blood against the altar.' The Hebrew verb denotes a forceful ritual application of blood, not a light sprinkling.
    reason: lexical_alternative
  - marker: b
    text: '''Cattle'' renders a collective Hebrew term for bovine animals; some translations specify ''bulls'' from the sacrificial context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 수소들을 잡아 죽였고, 제사장들은 그 피를 받아 제단에 뿌렸습니다. 그들은 숫양들을 잡아 죽였고, 그 피를 제단에 뿌렸습니다. 그들은 어린 양들을 잡아 죽였고, 그 피를 제단에 뿌렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  english_pob_choice: they slaughtered
  chosen_korean: 잡아 죽였고
  alternatives_korean:
  - 도살했고
  - 죽였고
  lexicon: HALOT
  rationale: 제사 맥락의 שׁחט는 단순한 살해가 아니라 의례적 도살을 가리키므로, 한국어에서는 자연스럽게 ‘잡아 죽이다’로 옮겨 제사 행위를 드러냈습니다.
- source_word: הַבָּקָר
  english_pob_choice: the cattle
  chosen_korean: 수소들
  alternatives_korean:
  - 가축들
  - 소떼
  lexicon: HALOT
  rationale: 히브리어는 집합명사이지만 제사 문맥상 희생 동물이 되는 큰 소를 가리키므로, 지나치게 포괄적인 ‘가축들’보다 구체적인 ‘수소들’이 더 적절합니다.
- source_word: וַיִּזְרְקוּ
  english_pob_choice: splashed it against / splashed the blood against
  chosen_korean: 뿌렸습니다
  alternatives_korean:
  - 뿌렸습니다
  - 던졌습니다
  - 튕겼습니다
  lexicon: HALOT
  rationale: זרק은 제의적 피 처리의 강한 동작을 뜻하지만, 한국어에서는 ‘피를 제단에 뿌리다’가 관용적으로도 자연스럽고 의례적 강도를 잘 전달합니다.
- source_word: הָאֵלִים
  english_pob_choice: the rams
  chosen_korean: 숫양들
  alternatives_korean:
  - 수양들
  - 양들
  lexicon: HALOT
  rationale: אילים는 제사에 쓰이는 수컷 양, 곧 숫양이므로 정확성을 위해 ‘숫양들’로 옮겼습니다.
- source_word: הַכְּבָשִׂים
  english_pob_choice: the lambs
  chosen_korean: 어린 양들
  alternatives_korean:
  - 양들
  - 새끼 양들
  lexicon: HALOT
  rationale: כבשים는 제사 목록에서 어린 양을 가리키는 경우가 많아, 제사 맥락을 살려 ‘어린 양들’로 번역했습니다.
