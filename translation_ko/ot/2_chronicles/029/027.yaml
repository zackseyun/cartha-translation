base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
  footnotes:
  - marker: a
    text: Or, “the song to the LORD.” The Hebrew literally reads “the song of the LORD.”
    reason: alternative_reading
  - marker: b
    text: Or 'said to offer up'.
    reason: previous_rendering
translation:
  language: ko
  text: 히스기야가 번제물을 제단 위에 드리라고 명령했습니다[a]. 그리고 번제물이 시작될 때, 야훼의 노래도 함께 시작되었는데[b], 나팔들과 이스라엘 왕 다윗의 악기들을 따라 그렇게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “번제물을 제단 위에 드리다”입니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “야훼의 노래가 시작되었다”로 옮길 수 있습니다. 히브리어는 문자적으로 “야훼의 노래가 시작되었다”입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: commanded
  chosen_korean: 명령했습니다
  alternatives_korean:
  - 말했습니다
  - 지시했습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 기본적으로 '말하다'이지만, 뒤따르는 부정사구 לְהַעֲלוֹת가 간접명령으로 기능하므로 한국어에서는 명령의 힘을 드러내는 것이 문맥상 정확합니다.
- source_word: לְהַעֲלוֹת הָעֹלָה
  english_pob_choice: to offer up the burnt offering
  chosen_korean: 번제물을 드리라고
  alternatives_korean:
  - 번제물을 올리라고
  - 번제물을 바치라고
  lexicon: HALOT
  rationale: עָלָה의 제의적 용법을 살려 '드리다'로 옮기되, 간접명령 구조를 반영해 자연스러운 한국어로 표현했습니다.
- source_word: שִׁיר יְהוָה
  english_pob_choice: the song of Yahweh
  chosen_korean: 야훼의 노래
  alternatives_korean:
  - 야훼를 향한 노래
  - 야훼의 찬양
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 그대로 살려 '야훼의 노래'로 옮겼습니다. 이는 POB의 본문 선택을 따라 'to/for'로 의미를 미리 해석하지 않기 위함입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대신 고유명사로서 '야훼'를 유지했습니다.
- source_word: וְעַל יְדֵי כְּלֵי דָּוִיד
  english_pob_choice: by means of the instruments of David
  chosen_korean: 다윗의 악기들을 따라
  alternatives_korean:
  - 다윗의 악기들로
  - 다윗의 악기들을 통해
  lexicon: HALOT
  rationale: יָדֵי의 도구적 용법을 한국어의 자연스러운 연결로 풀어 옮겼습니다. כאן '악기'는 예배 맥락에서 כְּלִי의 의미를 가장 잘 드러냅니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신적 칭호가 아니라 언약 이름을 직접 사용하므로, 이를 '야훼'로 표기해 원문이 가진 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: שִׁיר יְהוָה의 관계성
  chosen_reading: 야훼의 노래
  alternative_readings:
  - 야훼를 향한 노래
  - 야훼를 위한 노래
  rationale: 본문은 노래가 누구에게 속하거나 누구를 향하는지 완전히 해소하지 않고, 제의적 동시성을 보여 줍니다. 본문이 유지하는 이 긴장을 한국어에서도 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
