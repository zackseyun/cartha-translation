reference: 2 Chronicles 29:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד אֶת הַ/לְוִיִּ֜ם בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ בִּ/נְבָלִ֣ים וּ/בְ/כִנֹּר֔וֹת בְּ/מִצְוַ֥ת דָּוִ֛יד וְ/גָ֥ד חֹזֵֽה הַ/מֶּ֖לֶךְ וְ/נָתָ֣ן הַ/נָּבִ֑יא כִּ֧י בְ/יַד יְהוָ֛ה הַ/מִּצְוָ֖ה בְּ/יַד נְבִיאָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
  footnotes:
  - marker: a
    text: Or, more literally, 'for by the hand of the LORD was the command, by the hand of his prophets.'
    reason: lexical_alternative
  - marker: b
    text: '''Gad the king’s seer'' uses ''seer'' to reflect the Hebrew title חֹזֶה, a term distinct from ''prophet,'' though closely related in function.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 레위인들을 야훼의 집에 세워, 다윗과 왕의 선견자 갓과 예언자 나단의 명령에 따라 제금과 비파와 수금으로 연주하게 했습니다. 이는 명령이 야훼에게서 나와 그의 예언자들을 통해 주어졌기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘선견자’(חֹזֶה)는 ‘예언자’(נָבִיא)와 관련이 있지만 같은 직함은 아닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼에게서 나와 그의 예언자들을 통해’는 히브리어의 ‘야훼의 손으로… 그의 예언자들의 손으로’라는 관용을 자연스럽게 풀어 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּעֲמֵד / He stationed
  english_pob_choice: He stationed
  chosen_korean: 세워
  alternatives_korean:
  - 배치하여
  - 임명하여
  - 세웠습니다
  lexicon: HALOT
  rationale: 사역형 뉘앙스와 예배 직무를 위한 공식적 배치를 함께 살리기 위해 ‘세워’로 옮겼습니다. 단순한 ‘놓다’보다 기능적 임명이 드러납니다.
- source_word: בֵּית יְהוָה / the house of Yahweh
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살려 ‘집’을 유지했습니다. ‘성전’은 뜻은 맞지만 원문 표현의 투명성이 조금 약해집니다.
- source_word: בִּמְצִלְתַּיִם ... בְּנְבָלִים ... וּבְכִנֹּרוֹת
  english_pob_choice: with cymbals, harps, and lyres
  chosen_korean: 제금과 비파와 수금으로
  alternatives_korean:
  - 징과 하프와 류트로
  - 심벌즈와 하프와 리라로
  lexicon: HALOT
  rationale: 세 악기를 한국어 성경에서 널리 쓰는 식별 가능한 명칭으로 구분해 옮겼습니다. ‘비파’와 ‘수금’은 두 현악기를 서로 구별해 주어 원문의 목록성을 보존합니다.
- source_word: גָּד חֹזֵה הַמֶּלֶךְ / Gad the king’s seer
  english_pob_choice: Gad the king’s seer
  chosen_korean: 왕의 선견자 갓
  alternatives_korean:
  - 왕의 예언자 갓
  - 갓, 왕의 선견자
  lexicon: HALOT
  rationale: חֹזֶה는 נָבִיא와 구별되는 직함이므로 ‘예언자’로 평준화하지 않고 ‘선견자’로 옮겼습니다. 수식어의 순서는 한국어 관용에 맞게 조정했습니다.
- source_word: בְּיַד יְהוָה ... בְּיַד נְבִיאָיו / was from Yahweh through his prophets
  english_pob_choice: was from Yahweh through his prophets
  chosen_korean: 야훼에게서 나와 그의 예언자들을 통해 주어졌기 때문입니다
  alternatives_korean:
  - 야훼의 손으로 그의 예언자들의 손으로 된 것이기 때문입니다
  - 야훼에게서 비롯되어 그의 예언자들을 매개로 한 것이기 때문입니다
  lexicon: HALOT
  rationale: ‘손으로’라는 히브리어 관용은 원인을 뜻하는 중첩된 매개성을 가지므로, 현대 한국어에서 더 자연스럽게 ‘에게서 나와 ... 통해’로 풀어 옮겼습니다. 최종 출처가 야훼이고 매개가 예언자들임을 모두 보존합니다.
theological_decisions:
- issue: YHWH의 고유명과 번역 관행
  chosen_reading: יהוה를 ‘야훼’로 일관되게 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본어와 원문 투명성을 따르기 위해 고유명 그대로 옮겼습니다. 본문에서 하나님의 인격적 이름이 드러나는 점을 보존합니다.
  doctrine_reference: Divine name rendering policy
- issue: 왕권과 예언자적 권위의 관계
  chosen_reading: 다윗, 갓, 나단의 명령을 언급하되 최종 근거는 ‘야훼에게서’ 나온 것으로 표현했습니다.
  alternative_readings:
  - 다윗의 예배 정책을 후대가 신학화한 것으로 읽는 방식
  rationale: 원문은 인간 지도자들의 이름을 나열하면서도 명령의 궁극적 출처를 야훼와 그의 예언자들에게 둡니다. 이를 분리하지 않고 함께 드러내는 것이 본문의 신학을 가장 잘 반영합니다.
  doctrine_reference: Providence and prophetic mediation
