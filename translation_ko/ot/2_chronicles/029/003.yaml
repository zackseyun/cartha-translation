base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
  footnotes:
  - marker: a
    text: Or 'and strengthened them,' that is, made the doors secure or sound again.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 왕위에 오른 첫해 첫째 달에 야훼의 집 문들을 열고 그 문들을 보수하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 문들을 튼튼하게 하였다’, 곧 문들을 다시 안전하고 견고하게 만들었다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  english_pob_choice: he
  chosen_korean: 그는
  alternatives_korean:
  - 그가
  - 그 자신이
  lexicon: HALOT
  rationale: 독립 인칭대명사는 서술의 초점을 분명히 하는 역할을 하지만, 한국어에서는 자연스럽게 주어로만 옮기는 것이 가장 매끄럽습니다.
- source_word: בַ/שָּׁנָה הָ/רִאשׁוֹנָה לְ/מָלְכ֜/וֹ
  english_pob_choice: in the first year of his reign
  chosen_korean: 즉위 첫 해
  alternatives_korean:
  - 그의 통치 첫 해
  - 그가 왕이 된 첫 해
  lexicon: HALOT
  rationale: 히브리어의 연대 표현을 한국어에서 관용적으로 압축하되, 왕의 즉위 시점을 분명히 드러내도록 옮겼습니다.
- source_word: פָּתַ֛ח אֶת דַּלְת֥וֹת
  english_pob_choice: opened the doors
  chosen_korean: 문들을 열고
  alternatives_korean:
  - 문짝들을 열고
  - 문들을 열어
  lexicon: HALOT
  rationale: דַּלְתוֹת는 성문이 아니라 ‘문들/문짝들’의 복수형이므로, 자연스러운 한국어로 ‘문들을’이 가장 직접적입니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, בֵּית는 원문 표현을 살려 ‘집’으로 유지했습니다.
- source_word: וַיְחַזְּקֵם
  english_pob_choice: and repaired them
  chosen_korean: 보수하였습니다
  alternatives_korean:
  - 강화하였습니다
  - 튼튼하게 하였습니다
  - 수리하였습니다
  lexicon: HALOT
  rationale: חזק의 기본 의미는 ‘강하게 하다’이지만, 문맥상 문을 다시 안전하고 견고하게 만드는 실제 작업이므로 ‘보수하다’가 의미를 가장 잘 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 고유명사 יהוה를 직접 사용하므로, 약호적 대체어인 ‘주’보다 고유이름을 보존하는 ‘야훼’가 원문 가시성을 더 잘 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
