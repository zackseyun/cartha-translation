base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/014.yaml
  text: 'And from the sons of Heman: Jehuel and Shimei[a]; and from the sons of Jeduthun: Shemaiah and Uzziel.'
  footnotes:
  - marker: a
    text: Jehuel may also be rendered 'Jahiel' in some English traditions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 헤만의 아들들 가운데는 여우엘과 시므이이며[a], 여두둔의 아들들 가운데는 스마야와 웃시엘입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여우엘은 일부 영어 전승에서 ‘야히엘’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  english_pob_choice: And from
  chosen_korean: 그리고 … 가운데는
  alternatives_korean:
  - 그리고 … 중에서
  - …에서
  lexicon: HALOT
  rationale: 열거를 이어 주는 접속적 기능을 살려 문맥의 목록 흐름을 자연스럽게 드러냈습니다.
- source_word: בְּנֵי
  english_pob_choice: the sons of
  chosen_korean: 아들들
  alternatives_korean:
  - 자손들
  - 가문 사람들
  lexicon: HALOT
  rationale: 족보·명단 문맥이므로 직역에 가까운 ‘아들들’을 유지해 원문의 혈통 표지를 살렸습니다.
- source_word: יחואל
  english_pob_choice: Jehuel
  chosen_korean: 여우엘
  alternatives_korean:
  - 예후엘
  - 야히엘
  lexicon: 고유명사 음역
  rationale: 히브리어 자음 배열에 맞춰 한국어 음역을 붙였고, 영어 전승의 대안인 Jahiel은 본문이 아니라 주석에서만 다룰 수 있습니다.
- source_word: שְׁמַעְיָה
  english_pob_choice: Shemaiah
  chosen_korean: 스마야
  alternatives_korean:
  - 세마야
  - 스헤마야
  lexicon: 고유명사 음역
  rationale: 이 이름은 한국 교회 전통형 ‘스마야’가 널리 통용되므로 이를 채택하되, 히브리어 형태를 해치지 않도록 음역 일관성을 유지했습니다.
- source_word: וְעֻזִּיאֵל
  english_pob_choice: and Uzziel
  chosen_korean: 웃시엘
  alternatives_korean:
  - 우지엘
  - 우찌엘
  lexicon: 고유명사 음역
  rationale: 히브리어 עֻזִּיאֵל의 자음·모음을 반영한 현대 표기형으로 옮겼습니다.
theological_decisions:
- issue: 족보 명단의 서술 톤
  chosen_reading: 직설적인 열거문으로 번역해 인물·계보 정보만 전달했습니다.
  alternative_readings:
  - 의역하여 관계를 풀어 쓰는 방식
  rationale: 본문은 신학적 해설보다 명단 정보 전달이 목적이므로, 수사적 확장 없이 원문의 열거 구조를 보존했습니다.
  doctrine_reference: 성경 본문의 장르 보존 원칙
