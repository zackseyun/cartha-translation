revisions:
- from: 그때 히스기야 왕과 관리들이 레위 사람들에게 야훼를 다윗과 예언자 아삽의 말로 찬양하라고 말했습니다. 그래서 그들은 기쁨으로 찬양했고, 몸을 굽혀 경배했습니다.[a][b]
  to: 그때 히스기야 왕과 관리들은 레위 사람들에게 다윗과 선견자 아삽의 말로[a] 야훼를 찬양하라고 말했습니다. 그러자 그들은 기쁨으로[b] 찬양하고, 몸을 굽히고 경배했습니다.
  rationale: ‘선견자’는 הַחֹזֶה라는 고유한 예언자적 칭호를 보존합니다. 각주 표지를 해당 표현 바로 뒤로 옮기고, 마지막 두 동사를 접속 표현으로 나란히 옮겨 원문의 구조를 더 충실히 반영했습니다. עַד לְשִׂמְחָה의 어려운 표현은 본문에서는 자연스럽게 번역하되 각주에서 문자적 표현과 해석의 여지를 밝혔습니다.
