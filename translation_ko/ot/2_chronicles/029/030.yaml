source:
  edition: WLC
  text: וַ֠/יֹּאמֶר יְחִזְקִיָּ֨הוּ הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ לַ/לְוִיִּ֔ם לְ/הַלֵּל֙ לַֽ/יהוָ֔ה בְּ/דִבְרֵ֥י דָוִ֖יד וְ/אָסָ֣ף הַ/חֹזֶ֑ה וַֽ/יְהַלְלוּ֙ עַד לְ/שִׂמְחָ֔ה וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
  footnotes:
  - marker: a
    text: Or 'according to the words of David and of Asaph the seer.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'until joy' or 'unto joy'; the sense is that their praise was marked by rejoicing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 히스기야 왕과 관리들은 레위 사람들에게 다윗과 선견자 아삽의 말로[a] 야훼를 찬양하라고 말했습니다. 그러자 그들은 기쁨으로[b] 찬양하고, 몸을 굽히고 경배했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗과 선견자 아삽의 말에 따라’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘기쁨까지’ 또는 ‘기쁨에 이르기까지’라고 합니다. 이 표현은 다소 관용적이며, 찬양이 기쁨 가운데 이루어졌다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: told
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였다
  - 지시했습니다
  lexicon: HALOT
  rationale: 문맥상 단순 발화가 아니라 레위 사람들에게 찬양하도록 지시하는 말이므로, 자연스러운 한국어로 ‘말했습니다’를 택하되 과도한 명령조는 피했습니다.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  english_pob_choice: the king and the officials
  chosen_korean: 왕과 관리들
  alternatives_korean:
  - 왕과 지도자들
  - 왕과 방백들
  lexicon: HALOT
  rationale: שָׂרִים는 행정적·통치적 지도자들을 가리키므로, 현대 독자에게 분명한 ‘관리들’이 가장 적절합니다.
- source_word: לְהַלֵּל ... וַיְהַלְלוּ
  english_pob_choice: to praise / they praised
  chosen_korean: 찬양하라고 / 찬양했고
  alternatives_korean:
  - 찬송하라고 / 찬송했고
  - 높이 찬양하라고 / 높이 찬양했고
  lexicon: HALOT
  rationale: 히브리어 הלל의 예배적 의미를 살리면서도 한국어에서 가장 직접적인 대응어인 ‘찬양하다’를 사용했습니다.
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  english_pob_choice: with the words of David and of Asaph the seer
  chosen_korean: 다윗과 예언자 아삽의 말로
  alternatives_korean:
  - 다윗과 선견자 아삽의 말로
  - 다윗과 아삽 선견자의 말로
  lexicon: HALOT
  rationale: דִּבְרֵי는 ‘말/말씀’의 뜻이므로 ‘말로’가 가장 간결하고, הַחֹזֶה는 예언자적 직함이어서 ‘예언자’로 옮겼습니다.
- source_word: עַד לְשִׂמְחָה
  english_pob_choice: with gladness
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐거움으로
  - 기뻐하며
  lexicon: HALOT
  rationale: 직역하면 다소 어색한 관용구이지만, 결과 상태를 자연스럽게 드러내는 ‘기쁨으로’가 의미를 잘 전달합니다.
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲוּ
  english_pob_choice: they bowed down and worshiped
  chosen_korean: 몸을 굽혀 경배했습니다
  alternatives_korean:
  - 엎드려 경배했습니다
  - 몸을 굽혀 예배했습니다
  lexicon: HALOT
  rationale: 두 동사는 함께 예배적 자세를 나타내므로, 한국어에서는 본문 흐름을 매끄럽게 하되 두 행위를 함께 드러내는 표현을 사용했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기준에 따라 하나님의 고유명은 관습적 대체어보다 소스 직결형인 ‘야훼’로 옮겨, 본문의 언약명 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יהוה YHWH'
- issue: 두 예배 동작의 관계
  chosen_reading: ‘몸을 굽혀’와 ‘경배했습니다’를 분리해 유지
  alternative_readings:
  - ‘경배하듯 몸을 굽혔습니다’처럼 합침
  - ‘엎드려 경배했습니다’로 통합
  rationale: 히브리어는 서로 다른 두 동사를 사용하므로, 신체적 동작과 예배 행위를 구분해 번역했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
