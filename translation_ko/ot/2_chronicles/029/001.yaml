  chosen_korean: 히스기야
  alternatives_korean:
  - 히즈기야
  lexicon: 표준 성경 인명 표기
  rationale: 한국어에서 널리 쓰이는 인명 표기를 따르되, 원문의 고유명사라는 점을 유지했습니다.
- source_word: מָלַךְ
  english_pob_choice: became king / he reigned
