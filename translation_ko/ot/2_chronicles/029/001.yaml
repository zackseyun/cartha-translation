  text: Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abijah daughter of Zechariah.
translation:
  language: ko
  text: 히스기야가 왕이 된 것은 그가 스물다섯 살 때였습니다. 그는 예루살렘에서 스물아홉 해 동안 다스렸습니다. 그의 어머니의 이름은 스가랴의 딸 아비야였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
