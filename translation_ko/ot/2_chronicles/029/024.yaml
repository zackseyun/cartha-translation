base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
  footnotes:
  - marker: a
    text: Or 'applied their blood to the altar to purify it'; the Hebrew verb can carry the sense of performing a purification/sin-offering rite.
    reason: lexical_alternative
  - marker: b
    text: Or 'the purification offering.'
    reason: alternative_reading
translation:
  language: ko
  text: 제사장들이 그들을 잡아 죽이고, 그 피를 제단에 뿌려[a] 온 이스라엘을 위하여 속죄하였으니, 왕이 번제와 속죄제[b]는 온 이스라엘을 위한 것이라고 말하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 피를 제단에 발라 제단을 정결하게 하다’; 히브리어 동사는 정결제 의식을 수행하거나 정결하게 한다는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정결제’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  english_pob_choice: slaughtered them
  chosen_korean: 그들을 잡아 죽이고
  alternatives_korean:
  - 그들을 도살하고
  - 그들을 제물로 잡아 죽이고
  lexicon: HALOT
  rationale: 희생제 문맥의 שׁחט는 단순 살해보다 제의적 도살에 가깝지만, 한국어에서는 자연스럽고 과도하게 기술적이지 않게 ‘잡아 죽이고’로 옮겼습니다.
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  english_pob_choice: applied their blood to the altar
  chosen_korean: 그 피를 제단에 뿌려
  alternatives_korean:
  - 그 피를 제단에 바르고
  - 그 피로 제단을 정결하게 하고
  lexicon: HALOT
  rationale: חטא의 제의적 용법은 혈액을 제단에 적용하는 행위와 정결/속죄의 기능을 함께 가집니다. 본문은 피를 제단에 ‘뿌려’라는 구체적 행위를 살리면서도 제의적 의미를 자연스럽게 드러냅니다.
- source_word: לְכַפֵּר עַל כָּל יִשְׂרָאֵל
  english_pob_choice: to make atonement for all Israel
  chosen_korean: 온 이스라엘을 위하여 속죄하였으니
  alternatives_korean:
  - 온 이스라엘을 위해 속죄하였으니
  - 온 이스라엘을 위하여 화목하게 하였으니
  lexicon: HALOT
  rationale: כפר는 제의 문맥에서 표준적으로 ‘속죄하다’가 가장 직접적입니다. ‘위하여’는 עַל의 수혜 대상을 자연스럽게 반영합니다.
- source_word: הָעֹלָה וְהַחַטָּאת
  english_pob_choice: the burnt offering and the sin offering
  chosen_korean: 번제와 속죄제
  alternatives_korean:
  - 번제와 죄제
  - 번제와 정결제
  lexicon: HALOT
  rationale: עֹלָה는 번제, חַטָּאת은 제의 문맥에서 통상 ‘속죄제’로 옮기는 것이 가장 분명합니다. 영어 POB의 ‘sin offering’에 대응하면서도 한국어 성경 관용을 따랐습니다.
theological_decisions:
- issue: חטא/חטאת의 제의적 뉘앙스
  chosen_reading: 본문의 मुख्य 의미는 속죄 행위와 제단에 대한 피의 적용을 함께 말하는 것으로 보고, मुख्य 본문에는 ‘속죄제’와 ‘속죄하였으니’를 사용했습니다.
  alternative_readings:
  - 정결제
  - 죄제
  rationale: 히브리어는 죄 문제와 정결/정화 기능을 모두 환기할 수 있지만, 이 절의 절차적 문맥에서는 속죄 언어가 가장 직접적입니다. 따라서 본문은 간결하게 두되, 용어상 정결 뉘앙스를 과잉 확정하지 않았습니다.
  doctrine_reference: Translation philosophy §3; §5
