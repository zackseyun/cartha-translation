  source_fidelity: ‘그 피를 제단에 뿌려’는 제의 문맥에서 히브리어 וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה의 구체적 혈액 적용을 자연스럽게 반영하며, ‘온 이스라엘을 위하여 속죄하였으니’도 לְכַפֵּר עַל־כָּל־יִשְׂרָאֵל에 충실합니다. 다만 각주 표지는 해당 어구에 직접 붙여야 하며, 현행 문장의 ‘왕이 말하기를 … 하였기’는 현대 한국어로 부자연스럽습니다.
  naturalness: ‘왕이 번제와 속죄제는 온 이스라엘을 위한 것이라고 말하였기 때문입니다’가 중복 없이 자연스럽고, 합쇼체 문체에도 맞습니다. 각주 a의 ‘적용하여’는 한국어 제의 서술로 다소 어색하므로 ‘바르다’로 고쳤습니다.
  terminology: ‘번제’, ‘속죄제’, ‘속죄하다’는 한국어 성경의 통용 제의 용어이며, חַטָּאת의 ‘정결제’ 가능성은 해당 용어에 붙인 각주로 보존합니다. ‘잡아 죽이고’는 שָׁחַט의 희생 제의적 뜻을 문맥상 충분히 전달합니다.
