translation:
  language: ko
  text: 그때 히스기야 왕이 일찍 일어나, 성읍의 관리들을 모으고, 야훼의 집으로 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 집’은 히브리어 בֵּית יְהוָה를 직접 옮긴 표현입니다. 전통적 교회 번역의 ‘여호와의 집’ 대신 본 프로젝트의 표준 표기를 따랐습니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  english_pob_choice: rose early
  chosen_korean: 일찍 일어나
  alternatives_korean:
  - 새벽에 일어나
  - 일찍이 일어나
  lexicon: HALOT
  rationale: שׁכם의 서술적 용법은 ‘이른 시간에 일어나다’라는 시간감을 담으므로, 현대 한국어에서는 자연스러운 ‘일찍 일어나’가 가장 적절합니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: King
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 군왕
  lexicon: HALOT
  rationale: 히스기야의 직함을 현대적이고 중립적인 ‘왕’으로 옮겨, 인명 앞의 관형적 쓰임을 자연스럽게 살렸습니다.
- source_word: שָׂרֵי הָעִיר
  english_pob_choice: the officials of the city
  chosen_korean: 성읍의 관리들
  alternatives_korean:
  - 성읍의 지도자들
  - 도시의 방백들
  lexicon: HALOT
  rationale: שָׂרִים는 이 문맥에서 귀족적 ‘방백’보다 행정적·공적 기능을 가진 사람들을 가리키므로, ‘관리들’이 의미를 가장 정확하게 전달합니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 여호와의 성전
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현인 ‘YHWH의 집’을 유지하기 위해 ‘야훼의 집’으로 옮겼습니다. ‘성전’은 의미를 풀어주지만 원문의 어구를 덜 직접적으로 반영합니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 야훼의 이름을 직접 사용하므로, 프로젝트 기본값에 따라 고유한 언약명을 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
