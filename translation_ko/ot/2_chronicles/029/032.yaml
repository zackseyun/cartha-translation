  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: ko
  text: 회중이 가져온 번제물의 수는 소 떼가 칠십 마리, 숫양이 백 마리, 어린양이 이백 마리였으며, 이 모든 것은 야훼께 드리는 번제였습니다.
  philosophy: formal
lexical_decisions:
- source_word: הַקָּהָל
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모인 무리
  - 총회
  lexicon: ἐκκλησία / קָהָל
  rationale: 여기서는 공식적으로 모인 공동체를 가리키므로, 현대 한국어에서 공적인 종교 집단을 자연스럽게 드러내는 ‘회중’으로 옮겼습니다.
- source_word: בָּקָר
  english_pob_choice: cattle
  chosen_korean: 소 떼
  alternatives_korean:
  - 소
  - 황소
  lexicon: בָּקָר
  rationale: POB의 ‘cattle’을 그대로 반영하되, 제물의 수량 표현에 맞게 집합적 의미가 드러나도록 ‘소 떼’로 풀어 썼습니다.
- source_word: לַ/יהוָה
  english_pob_choice: to the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: יהוה
  rationale: 본문의 신명 표지를 한국어 기본값인 ‘야훼’로 직접 옮기고, 조사 ‘께’를 붙여 제사적 헌납 방향을 분명히 했습니다.
- source_word: עֹלָה
  english_pob_choice: burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 전소제
  lexicon: עֹלָה
  rationale: 제사 용어로 고정된 의미를 반영해 ‘번제’로 번역했고, 문맥상 앞의 ‘번제물’은 설명적 표현으로만 처리했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 본문의 לַיהוָה는 한국어 본문에서 ‘야훼께’로 표기했습니다.
  alternative_readings:
  - 주님께
  - 여호와께
  rationale: 프로젝트 기본 원칙에 따라 יהוה는 학문적 음역인 ‘야훼’를 사용하여, 전통적 교회어가 주는 완곡함보다 המקור의 직접성을 살렸습니다.
  doctrine_reference: YHWH transliteration policy
