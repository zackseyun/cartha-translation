  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
  footnotes:
  - marker: a
    text: Or 'committed trespass' / 'dealt treacherously'; the Hebrew verb carries the sense of acting unfaithfully, often in covenantal matters.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the dwelling place of the LORD'; 'tabernacle' is possible as a lexical gloss for מִשְׁכָּן, but here the reference is to the temple as the LORD's dwelling.
    reason: lexical_alternative
  - marker: c
    text: Literally 'gave the neck.' The idiom means to turn away in refusal or rebellion.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 조상들은 신의를 저버리고[a], 우리 하나님 야훼 보시기에 악한 일을 했습니다. 그들은 그분을 버리고 야훼의 처소에서 얼굴을 돌리고[b], 등을 돌렸습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불성실하게 행했다’, ‘배신했다’로 옮길 수 있습니다. 히브리어 동사는 특히 언약 관계에서 신의를 저버리는 일을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼의 처소에서’입니다. מִשְׁכָּן은 ‘성막’으로도 옮길 수 있으나, 여기서는 성전을 야훼의 거처로 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘목덜미를 내주었다’입니다. 이 관용구는 완고한 거절이나 반역의 태도를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  english_pob_choice: acted unfaithfully
  chosen_korean: 신실하지 못했고
  alternatives_korean:
  - 신실하지 않았고
  - 배신했고
  - 간악하게 행했고
  lexicon: HALOT
  rationale: מעל은 단순한 도덕 실패보다 언약적 불성실을 나타내므로, 한국어에서는 '신실하지 못하다'로 그 관계적 뉘앙스를 살렸습니다.
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֵינוּ
  english_pob_choice: in the eyes of Yahweh our God
  chosen_korean: 우리 하나님 야훼의 눈앞에서
  alternatives_korean:
  - 우리 하나님 야훼 보시기에
  - 우리 하나님 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 표준적인 한국어로 자연스럽게 들리도록 '눈앞에서'를 택해 평가·판단의 시선을 보존했습니다.
- source_word: מִשְׁכַּן יְהוָה
  english_pob_choice: the dwelling place of Yahweh
  chosen_korean: 야훼의 처소
  alternatives_korean:
  - 야훼의 거처
  - 야훼의 성막
  - 야훼의 성소
  lexicon: HALOT
  rationale: 문맥상 광야 성막이 아니라 성전의 야훼 거처를 가리키므로, POB의 'dwelling place'를 따라 '처소'로 옮겨 어휘 의미를 보존했습니다.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם ... וַיִּתְּנוּ עֹרֶף
  english_pob_choice: turned their faces away ... turned their backs
  chosen_korean: 얼굴을 돌렸으며[c], 등을 돌렸습니다
  alternatives_korean:
  - 등을 보였으며
  - 외면했으며
  lexicon: HALOT
  rationale: 두 절은 대구를 이루는 몸짓 표현이므로, '얼굴을 돌리다/등을 돌리다'로 대비를 살려 반역적 거부의 이미지를 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: יהוה를 야훼로 표기했습니다.
  alternative_readings:
