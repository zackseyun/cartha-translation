  naturalness: ‘우리 하나님 야훼의 눈앞에서’보다 ‘우리 하나님 야훼 보시기에’가 현대 표준어 성서 문맥에서 자연스럽고, 평가의 의미도 정확히 전달합니다. ‘야훼의 처소에서 얼굴을 돌리고 등을 돌렸습니다’는 원문의 의도적인 병렬 신체 이미지를 유지합니다.
  terminology: יַהְוֶה는 방침에 따라 ‘야훼’로 유지했습니다. מִשְׁכָּן은 성전 문맥을 고려하여 ‘처소’로 유지하되, 본문에는 전치사 ‘에서’를 반영했습니다. מָעֲלוּ는 언약적 신의의 파기를 드러내도록 ‘신의를 저버리고’로 옮겼습니다.
