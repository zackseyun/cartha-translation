  naturalness: 합쇼체 문장은 전반적으로 자연스럽습니다. 다만 '여호와의 집 뜰로 ... 밖으로 끌어냈습니다'는 이동의 도착점과 '밖으로'가 다소 겹치므로 '뜰로 옮겨 내놓았습니다'가 더 명료합니다. '기드론 시내로, 곧 밖에 있는'이라는 뜻을 문장에 자연스럽게 풀어 제시했습니다.
  terminology: '''제사장들'', ''레위 사람들'', ''여호와의 집'', ''성전'', ''뜰'', ''부정''은 문맥과 한국어 성경 문체에 적절합니다. נַחַל קִדְרוֹן은 골짜기보다 물길/와디를 가리키므로 ''기드론 시내''가 더 직접적입니다.'
