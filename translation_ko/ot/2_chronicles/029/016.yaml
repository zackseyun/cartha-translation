  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ הַ֠/כֹּהֲנִים לִ/פְנִ֣ימָה בֵית יְהוָה֮ לְ/טַהֵר֒ וַ/יּוֹצִ֗יאוּ אֵ֤ת כָּל הַ/טֻּמְאָה֙ אֲשֶׁ֤ר מָֽצְאוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה לַ/חֲצַ֖ר בֵּ֣ית יְהוָ֑ה וַֽ/יְקַבְּלוּ֙ הַ/לְוִיִּ֔ם לְ/הוֹצִ֥יא לְ/נַֽחַל קִדְר֖וֹן חֽוּצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: ko
  text: 그때 제사장들이 정결하게 하려고 여호와의 집 안쪽으로 들어가서, 여호와의 집 뜰로 그들이 성전에서 찾아낸 모든 부정을 밖으로 끌어냈습니다. 그다음 레위 사람들이 그것을 받아 기드론 골짜기 밖으로 내갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안쪽’은 히브리어 לִפְנִימָה의 공간적 방향을 반영한 표현입니다.
    reason: source_note
  - marker: b
    text: ‘부정’은 히브리어 טֻמְאָה의 의례적 부정성을 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘밖으로 내갔습니다’는 히브리어 חוּצָה와 ‘밖으로 내다’의 반복적 외향성을 살린 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וַיָּבֹאוּ הַכֹּהֲנִים לִפְנִימָה בֵית יְהוָה לְטַהֵר
  english_pob_choice: the priests went into the inner part of the house of the LORD to cleanse it
  chosen_korean: 제사장들이 정결하게 하려고 여호와의 집 안쪽으로 들어가서
  alternatives_korean:
  - 정결하게 하려고 여호와의 집 안으로 들어가서
  - 깨끗하게 하려고 여호와의 집 깊숙이 들어가서
  lexicon: כֹּהֲנִים=제사장들; לִפְנִימָה=안쪽으로/안으로
  rationale: לִפְנִימָה는 단순한 ‘안으로’보다 성전 공간의 내부를 가리키는 ‘안쪽으로’가 더 분명하며, לְטַהֵר는 의례적 정결의 의미를 살려 ‘정결하게 하려고’로 옮겼습니다.
- source_word: כָּל הַטֻּמְאָה
  english_pob_choice: all the uncleanness
  chosen_korean: 모든 부정
  alternatives_korean:
  - 모든 더러움
  - 모든 부정한 것
  lexicon: טֻמְאָה=부정/더러움
  rationale: טֻמְאָה는 단순한 위생적 ‘더러움’보다 의례적·제의적 ‘부정’이 중심이므로, 문맥에 맞게 ‘부정’을 채택했습니다.
- source_word: בְּהֵיכַל יְהוָה ... לַחֲצַר בֵּית יְהוָה
  english_pob_choice: in the temple of the LORD ... to the court of the house of the LORD
  chosen_korean: 성전에서 ... 여호와의 집 뜰로
  alternatives_korean:
  - 여호와의 성전에서 ... 여호와의 집 뜰로
  - 여호와의 성전 안에서 ... 집 뜰로
  lexicon: הֵיכָל=성전; חָצֵר=뜰
  rationale: הֵיכָל은 예배 공간으로서 ‘성전’이 자연스럽고, חָצֵר은 건물 외곽의 뜰을 가리키므로 ‘뜰’로 옮겼습니다.
- source_word: וַיְקַבְּלוּ ... לְהוֹצִיא לְנַחַל קִדְרוֹן חוּצָה
  english_pob_choice: the Levites received it to carry it outside to the Kidron Valley
  chosen_korean: 레위 사람들이 그것을 받아 기드론 골짜기 밖으로 내갔습니다
  alternatives_korean:
  - 레위 사람들이 그것을 받아 기드론 골짜기 밖으로 옮겼습니다
  - 레위 사람들이 그것을 받아 기드론 시내로 밖에 내갔습니다
  lexicon: וַיְקַבְּלוּ=받다; לְהוֹצִיא=밖으로 내다/옮기다; נַחַל קִדְרוֹן=기드론 골짜기
  rationale: וַיְקַבְּלוּ는 물건을 ‘받다’는 뜻을 살렸고, לְהוֹצִיא와 חוּצָה의 반복된 외향성을 반영하여 ‘밖으로 내갔습니다’로 간결하게 처리했습니다.
theological_decisions:
- issue: יהוה의 음역
  chosen_reading: 본절의 יהוה는 관례적이고 본문 기반인 ‘여호와’로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 구절은 구약 서술문이며, 제공된 English POB가 LORD로 정리한 전통적 호칭을 따라 한국어 독자에게는 ‘여호와’가 가장 안정적인 본문 재현입니다.
  doctrine_reference: 구약 신명적 호칭의 표기 관행
- issue: טֻמְאָה의 성격
  chosen_reading: 의례적/제의적 부정으로 이해해 ‘부정’으로 옮겼습니다.
  alternative_readings:
  - 더러움
  - 불결함
  rationale: 성전 정화 문맥에서는 도덕적 오염보다 예배를 방해하는 제의적 부정이 핵심이므로, 한국어에서도 그 신학적·의례적 의미가 드러나도록 했습니다.
  doctrine_reference: 정결법 및 성전 정화 문맥
