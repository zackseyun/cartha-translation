revisions:
- from: 그때 제사장들이 정결하게 하려고 여호와의 집 안쪽으로 들어가서, 여호와의 집 뜰로 그들이 성전에서 찾아낸 모든 부정을 밖으로 끌어냈습니다. 그다음 레위 사람들이 그것을 받아 기드론 골짜기 밖으로 내갔습니다.[a][b][c]
  to: 그때 제사장들이 여호와의 집 안쪽으로 들어가 그것을 정결하게 하려고 하였습니다.[a] 그들은 여호와의 성전에서 찾아낸 모든 부정을[b] 여호와의 집 뜰로 옮겨 내놓았습니다. 그러자 레위 사람들이 그것을 받아 밖에 있는 기드론 시내로 가져갔습니다.[c]
  rationale: 원문의 두 단계, 즉 제사장들이 성전에서 뜰로 부정한 것들을 내오는 일과 레위 사람들이 그것을 외부의 기드론 나할로 운반하는 일을 분명히 구분했습니다. 특히 ‘기드론 골짜기 밖으로’가 낳는 수식 범위의 혼동을 피하고 נַחַל의 지리적 의미를 ‘시내’로 반영했습니다.
