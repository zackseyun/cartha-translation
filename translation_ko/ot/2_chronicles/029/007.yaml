base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
  footnotes:
  - marker: a
    text: Or 'the doors of the porch' or 'entry hall'; the Hebrew אוּלָם refers to the temple's entrance hall.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the holy place'; the Hebrew term can denote the sacred area of the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 또한 주랑의 문들을 닫고, 등불들을 껐으며, 분향하지도 않았고, 이스라엘의 하나님께 성소에서 번제도 드리지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주랑의 문들’, ‘전실의 문들’로 옮길 수 있습니다. 히브리어 אוּלָם은 성전의 입구 홀이자 전실을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성소 안에서’로 볼 수 있습니다. 히브리어 표현은 성전의 거룩한 구역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고
  - 심지어
  lexicon: HALOT
  rationale: 앞선 죄목에 덧붙는 누적적 의미를 한국어의 자연스러운 연결어로 살리기 위해 ‘또한’을 택했습니다.
- source_word: דַּלְתוֹת הָאוּלָם
  english_pob_choice: the doors of the vestibule
  chosen_korean: 주랑의 문들
  alternatives_korean:
  - 현관의 문들
  - 전실의 문들
  - 포치의 문들
  lexicon: HALOT
  rationale: אוּלָם은 성전의 입구 공간을 가리키므로, 전통 교회어인 ‘현관’보다 건축적 의미가 드러나는 ‘주랑’이 원문 대응에 더 가깝습니다.
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  english_pob_choice: put out the lamps
  chosen_korean: 등불들을 껐으며
  alternatives_korean:
  - 등불들을 꺼버렸으며
  - 등불을 껐으며
  lexicon: HALOT
  rationale: 성전의 예배용 등불을 끄는 구체적 행위를 자연스럽게 옮기되, 복수형을 반영해 ‘등불들을’로 번역했습니다.
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  english_pob_choice: did not burn incense
  chosen_korean: 분향하지도 않았고
  alternatives_korean:
  - 향을 사르지도 않았고
  - 향을 피우지도 않았고
  lexicon: HALOT
  rationale: קטר의 제의적 의미를 살리기 위해 한국어 성경에서 널리 쓰이지만, 단순한 일상행위로 오해되기 쉬운 ‘분향하다’를 사용했습니다.
- source_word: בַ/קֹּדֶשׁ
  english_pob_choice: in the sanctuary
  chosen_korean: 성소에서
  alternatives_korean:
  - 성전에서
  - 거룩한 곳에서
  lexicon: HALOT
  rationale: 여기서는 성전의 거룩한 예배 공간을 가리키므로, POB의 ‘sanctuary’를 반영해 ‘성소’가 가장 직접적입니다.
theological_decisions:
- issue: 성전 예전의 구체성 유지
  chosen_reading: ‘분향하다’, ‘번제’, ‘성소’ 같은 제의적 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘예배하다’처럼 일반화하기
  - ‘헌물하다’로 포괄적으로 옮기기
  rationale: 이 구절은 유다의 타락을 일반 종교성 부족이 아니라 지정된 성전 예전을 폐기한 사건으로 고발하므로, 구체적 제의 용어를 보존해야 합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
