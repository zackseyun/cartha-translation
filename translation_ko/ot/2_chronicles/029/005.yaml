  terminology: ‘야훼’, ‘레위 사람들’, ‘거룩하게 하십시오’, ‘부정한 것’은 문맥과 용어 선택에 적절합니다. ‘거룩한 곳’은 הַקֹּדֶשׁ의 번역으로 가능하며, 각주에서 ‘성소’를 대안으로 제시할 수 있습니다.
