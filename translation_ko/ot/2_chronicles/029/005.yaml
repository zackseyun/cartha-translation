  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
  footnotes:
  - marker: a
    text: Or “the impurity” or “the filth”; the Hebrew term refers to what defiles the sanctuary.
    reason: lexical_alternative
  - marker: b
    text: Or “from the sanctuary.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「레위 사람들아, 내 말을 들으십시오. 이제 여러분 자신을 거룩하게 하십시오. 그리고 야훼의 집, 곧 여러분 조상의 하나님의 집을 거룩하게 하십시오. 그리고 그 거룩한 곳에서 부정한 것을 내보내십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “부정함”이나 “더러움”. 히브리어 용어는 성소를 더럽히는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “성소에서”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
