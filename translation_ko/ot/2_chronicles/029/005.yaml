  rationale: 히트파엘과 피엘의 동사를 둘 다 같은 한국어 뿌리로 맞춰, 사람과 집 모두를 제의적 정결 상태로 ‘거룩하게 함’이라는 대응을 살렸습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
