  lexicon: HALOT
  rationale: יהוה를 본문 원형에 따라 ‘야훼’로 옮기고, ‘집’은 성전의 히브리어 표현을 직역해 유지했습니다.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  english_pob_choice: the God of your fathers
  chosen_korean: 여러분 조상의 하나님
  alternatives_korean:
  - 여러분의 조상들의 하나님
  - 너희 조상의 하나님
  lexicon: HALOT
  rationale: 언약적 정체성을 드러내는 관용구를 살리면서, 현대 한국어에서 가장 자연스러운 소유·관계 표현으로 정리했습니다.
- source_word: הַנִּדָּה מִן הַקֹּדֶשׁ
  english_pob_choice: the uncleanness from the holy place
  chosen_korean: 그 거룩한 곳에서 부정한 것을
  alternatives_korean:
  - 그 성소에서 부정한 것을
  - 거룩한 곳으로부터 더러움을
  lexicon: HALOT
  rationale: נִדָּה는 단순한 추상적 ‘부정’보다 제의적 오염물을 가리키는 경우가 많으므로, 문맥에 맞게 ‘부정한 것’으로 옮겨 실제로 제거해야 할 대상을 드러냈습니다.
