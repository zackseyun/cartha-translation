  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: ko
  text: 그들은 왕국과 성소와 유다를 위한 속죄제물로 수소 일곱 마리와 숫양 일곱 마리와 어린양 일곱 마리와 숫염소 일곱 마리를 가져왔습니다. 그리고 그는 아론의 자손, 곧 제사장들에게 여호와의 제단 위에 그것들을 드리라고 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  english_pob_choice: They brought
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 바쳤습니다
  - 데려왔습니다
  lexicon: HALOT
  rationale: 제의 문맥에서 제물들을 '가져오다'는 가장 자연스럽고 직접적인 대응입니다. '바치다'도 가능하지만, 히브리어의 기본 서술 동작을 먼저 드러내는 쪽이 더 투명합니다.
- source_word: פָרִים / אֵילִים / כְבָשִׂים / צְפִירֵי עִזִּים
  english_pob_choice: bulls / rams / lambs / male goats
  chosen_korean: 수소 / 숫양 / 어린양 / 숫염소
  alternatives_korean:
  - 황소 / 양 숫컷 / 새끼양 / 염소 수컷
  lexicon: HALOT
  rationale: 희생 제물 목록의 종별을 한국어 제의 어휘로 간결하게 옮겼습니다. '수소'는 פָרִים의 일반적 제의 용례에 맞고, '숫염소'는 צְפִירֵי עִזִּים의 수컷 표지를 분명히 합니다.
- source_word: לְחַטָּאת
  english_pob_choice: as a sin offering
  chosen_korean: 속죄제물로
  alternatives_korean:
  - 속죄제사로
  - 죄를 위한 제물로
  lexicon: HALOT
  rationale: חַטָּאת는 이 문맥에서 추상적 '죄'보다 특정한 제의 범주를 가리키므로, 한국어 성경에서 널리 통용되면서도 제의적 기능을 드러내는 '속죄제물'이 적절합니다.
- source_word: לְהַעֲלוֹת
  english_pob_choice: to offer them
  chosen_korean: 드리라고
  alternatives_korean:
  - 올리라고
  - 번제로 드리라고
  lexicon: HALOT
  rationale: 제단 위에 올려 제사 행위를 하라는 뜻을 한국어 동사 '드리다'로 옮겼습니다. '올리다'는 직역성이 강해 문장 흐름이 어색할 수 있어, 제의적 헌납을 자연스럽게 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 본문의 고유신명사에 대한 한국어 독자층의 인지도를 고려해, POB 영어 본문이 'Yahweh'를 쓰더라도 한국어 전통 표기인 '여호와'를 채택했습니다. 이는 문맥상 특정한 개인 신명 표지를 분명히 하는 선택입니다.
theological_decisions:
- issue: 제단 위에서의 제의 동작 표현
  chosen_reading: '''드리다''를 사용해 제물의 헌납과 제사 행위를 함께 드러냈습니다.'
  alternative_readings:
  - '''올리다''를 사용해 제의적 상승 이미지를 더 직접적으로 살리는 읽기'
  - '''바치다''를 사용해 헌납성을 강조하는 읽기'
  rationale: 히브리어 לְהַעֲלוֹת는 문자적으로는 '올리다'이지만, 제의 문맥에서는 제단에 제물을 드리는 행위를 가리킵니다. 한국어에서는 의미를 살리면서도 문장을 자연스럽게 하는 '드리다'가 가장 균형적입니다.
  doctrine_reference: 제사/예배 용어의 문맥적 번역 원칙
- issue: 제물의 용도인 לְחַטָּאת
  chosen_reading: '''속죄제물''로 특정 제의 범주를 유지했습니다.'
  alternative_readings:
  - '''죄를 위한 제물''로 더 설명적으로 옮기는 읽기'
  - '''속죄제''로 간략화하는 읽기'
  rationale: 본문은 일반적 죄책 설명이 아니라 제의적 분류를 말하므로, 구약 희생 제사의 기술 용어를 유지하는 것이 본문의 의미를 가장 정확히 보존합니다.
  doctrine_reference: 레위기 제사 용어의 범주 보존
