revisions:
- from: 오직 제사장들이 수가 너무 적어 모든 번제물의 가죽을 벗길 수 없었으므로, 그들의 형제 레위 사람들이 그들을 도와 공사가 끝날 때까지, 그리고 제사장들이 스스로를 거룩하게 할 때까지 그들을 붙들어 주었습니다. 레위 사람들은 제사장들보다 스스로를 거룩하게 하려는 마음이 더 올바랐기 때문입니다.
  to: 다만 제사장들이 너무 적어서 모든 번제물의 가죽을 벗길 수 없었으므로, 레위 사람들인 그들의 형제들이 일이 끝나고 제사장들이 자신을 성결하게 할 때까지 그들을 도와주었습니다. 레위 사람들이 자신을 성결하게 하는 데에는 제사장들보다 마음이 더 올곧았기 때문입니다.
  rationale: ‘공사’를 제의 업무를 가리키는 ‘일’로 바로잡고, 레위 사람들이 제사장들을 실제로 지원했다는 문맥적 의미를 자연스럽게 표현했습니다. 마지막 비교절에서는 원문의 내적 올바름과 ‘성결하게 하는 데’라는 관련 범위를 보존하면서, ‘의도’라는 추가 의미를 제거했습니다.
