  source_fidelity: 핵심 내용은 대체로 충실합니다. 다만 מְלָאכָה는 여기서 제의 처리의 ‘일/업무’이지 건설 공사를 뜻하지 않으므로 ‘공사’는 부정확합니다. 또한 יִשְׁרֵי לֵבָב לְהִתְקַדֵּשׁ의 비교는 자신을 성결하게 하는 일에서의 내적 올바름을 말하며, ‘하려는 마음’은 의도라는 뉘앙스를 다소 첨가합니다.
  naturalness: ‘그들을 … 그들을 붙들어 주었습니다’는 목적어가 반복되어 어색하며, ‘공사’는 성전 문맥에서도 이 절의 희생제 처리 업무와 맞지 않습니다. ‘레위 사람들인 그들의 형제들이 … 도와주었습니다’ 및 ‘일이 끝나고’가 자연스럽고 분명합니다.
  terminology: ‘번제물’, ‘제사장’, ‘레위 사람’은 적절합니다. הִתְקַדֵּשׁ에는 제의적 자기 준비의 뜻이 있으므로 ‘자신을 성결하게 하다’를 사용했습니다. יִשְׁרֵי לֵבָב은 ‘마음이 더 올곧았다’로 옮겨 내적 정직성과 비교를 유지했습니다.
