  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רַ֤ק הַ/כֹּֽהֲנִים֙ הָי֣וּ לִ/מְעָ֔ט וְ/לֹ֣א יָֽכְל֔וּ לְ/הַפְשִׁ֖יט אֶת כָּל הָ/עֹל֑וֹת וַֽ/יְּחַזְּק֞וּ/ם אֲחֵי/הֶ֣ם הַ/לְוִיִּ֗ם עַד כְּל֤וֹת הַ/מְּלָאכָה֙ וְ/עַ֣ד יִתְקַדְּשׁ֣וּ הַ/כֹּֽהֲנִ֔ים כִּ֤י הַ/לְוִיִּם֙ יִשְׁרֵ֣י לֵבָ֔ב לְ/הִתְקַדֵּ֖שׁ מֵֽ/הַ/כֹּהֲנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
  footnotes:
  - marker: a
    text: Or 'helped them'; the Hebrew verb is literally 'strengthened them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'more wholehearted' or 'upright of heart'; the Hebrew emphasizes inner sincerity or rectitude.
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 제사장들이 수가 너무 적어 모든 번제물의 가죽을 벗길 수 없었으므로, 그들의 형제 레위 사람들이 그들을 도와 공사가 끝날 때까지, 그리고 제사장들이 스스로를 거룩하게 할 때까지 그들을 붙들어 주었습니다. 레위 사람들은 제사장들보다 스스로를 거룩하게 하려는 마음이 더 올바랐기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 그러나
  - 다만
  lexicon: HALOT
  rationale: 앞절의 상황을 제한하며 문제의 핵심을 제시하는 표지이므로, 단순한 역접보다 제한적 의미를 살리는 ‘오직’이 적절합니다.
- source_word: לִמְעָט
  english_pob_choice: too few
  chosen_korean: 수가 너무 적어
  alternatives_korean:
  - 적어
  - 부족하여
  - 소수여서
  lexicon: HALOT
  rationale: 단순한 수적 진술이 아니라 제사 업무를 감당할 수 없을 정도의 부족함을 뜻하므로, ‘수가 너무 적어’로 부족함을 분명히 드러냈습니다.
- source_word: לְהַפְשִׁיט אֶת כָּל הָעֹלוֹת
  english_pob_choice: to skin all the burnt offerings
  chosen_korean: 모든 번제물의 가죽을 벗길 수 없었으므로
  alternatives_korean:
  - 모든 번제물을 벗겨낼 수 없었으므로
  - 모든 번제물의 껍질을 벗길 수 없었으므로
  lexicon: HALOT
  rationale: 제의적 절차인 ‘가죽을 벗기다’를 현대 한국어로 직접 옮기되, 제물의 대상이 번제물임을 분명히 하였습니다.
- source_word: וַיְּחַזְּק֞וּ/ם
  english_pob_choice: strengthened them
  chosen_korean: 그들을 붙들어 주었습니다
  alternatives_korean:
  - 그들을 강하게 했습니다
  - 그들을 도왔습니다
  - 그들을 지지했습니다
  lexicon: HALOT
  rationale: 동사의 직역은 ‘강하게 하다’이지만, 문맥상 부족한 제사장들을 실제로 떠받치고 계속 일하게 한 도움의 의미가 강하므로 자연스러운 한국어로 기능을 살렸습니다.
- source_word: יִשְׁרֵ֣י לֵבָ֔ב
  english_pob_choice: more upright in heart
  chosen_korean: 스스로를 거룩하게 하려는 마음이 더 올바랐기 때문입니다
  alternatives_korean:
  - 마음이 더 올바랐기 때문입니다
  - 더 진실한 마음이었기 때문입니다
  - 마음이 더 곧았기 때문입니다
  lexicon: HALOT
  rationale: 핵심은 내적 정직성/성실성입니다. ‘더 올바른 마음’의 의미를 살리되, 이어지는 ‘거룩하게 하려는’ 목적과 자연스럽게 연결되도록 풀었습니다.
theological_decisions:
- issue: ‘레위 사람들이 … 제사장들보다’의 비교가 무엇을 가리키는가
  chosen_reading: 레위 사람들은 제사장들보다 스스로를 거룩하게 하려는 내적 성실성에서 더 올바랐다고 이해했습니다.
  alternative_readings:
  - 더 빨리 자신을 거룩하게 하려 했다는 뜻
  - 의식적으로 더 준비되어 있었다는 뜻
  rationale: 히브리어 표현은 속도나 행정적 준비보다 내면의 바름/성실성을 강조합니다. 본문이 말하는 비교를 유지하되, 제사장 직분 전체에 대한 일반적 비난으로 확대하지 않았습니다.
  doctrine_reference: 본문이 유지하는 비교의 긴장을 해소하지 않고 그대로 보존합니다.
