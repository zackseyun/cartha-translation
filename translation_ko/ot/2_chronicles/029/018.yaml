base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
  footnotes:
  - marker: a
    text: Or “the table of showbread,” that is, the table for the bread arranged before the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 안으로 들어가 히스기야 왕에게 말했습니다. "우리는 야훼의 온 집과 번제 제단과 그 모든 기구들, 그리고 진설의 떡 상과 그 모든 기구들을 깨끗하게 했습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “진설병 상”, 곧 야훼 앞에 차려 놓는 떡을 위한 상입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנִימָה
  english_pob_choice: inside / in
  chosen_korean: 안으로
  alternatives_korean:
  - 안에
  - 안쪽으로
  lexicon: HALOT
  rationale: 움직여 들어감을 나타내는 부사로, 보고를 위해 왕에게 들어가는 장면에 자연스럽고도 원문에 가깝습니다.
- source_word: טִהַרְנוּ
  english_pob_choice: have cleansed
  chosen_korean: 깨끗하게 했습니다
  alternatives_korean:
  - 정결하게 했습니다
  - 정화했습니다
  lexicon: HALOT
  rationale: 성전 맥락의 의례적 정결을 한국어로 과도하게 기술화하지 않으면서, 완료된 보고체를 살렸습니다.
- source_word: מִזְבַּח הָעֹלָה
  english_pob_choice: the altar of burnt offering
  chosen_korean: 번제 제단
  alternatives_korean:
  - 번제단
  - 불태워 드리는 제단
  lexicon: HALOT
  rationale: 히브리어의 관용적 성전 용어를 간결하고 표준적인 현대 한국어로 옮겼습니다.
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  english_pob_choice: the table of the rows
  chosen_korean: 진설의 떡 상
  alternatives_korean:
  - 진설 떡 상
  - 진설상
  - 진설된 떡의 상
  lexicon: HALOT
  rationale: 전통적 교회 용어인 '진설병'보다 배열된 떡이라는 원문 의미를 드러내되, 한국어 성경에서 이해 가능한 표현으로 옮겼습니다.
- source_word: כֵּלָיו
  english_pob_choice: its utensils
  chosen_korean: 그 모든 기구들
  alternatives_korean:
  - 그 모든 기물들
  - 그 모든 도구들
  - 그 모든 집기들
  lexicon: HALOT
  rationale: 성전 기구를 가리키는 포괄적 의미를 살리면서, 같은 절의 두 번 반복을 자연스럽게 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 고유명사 음역인 '야훼'를 유지해 하나님의 언약 이름을 드러냈습니다.
theological_decisions:
- issue: 성전 정결 보고의 어조
  chosen_reading: 의례적 정결 완료를 담담한 보고문으로 표현했습니다.
  alternative_readings:
  - 정결하게 하다를 더 강하게 종교적 용어로 표기
  - 완전히 깨끗하게 하다로 강조
  rationale: 원문은 왕에게 올리는 완료 보고이므로, 의미는 유지하되 과장 없이 사실 보고의 톤을 살렸습니다.
  doctrine_reference: 성전 정결/예배 용어의 서술적 정확성
