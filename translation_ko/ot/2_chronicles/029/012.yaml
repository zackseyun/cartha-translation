theological_decisions:
- issue: 레위 지파 명단의 족보적/대표성 표현
  chosen_reading: ‘~ 자손이며 … 가운데서는’이라는 구조로, 특정 이름들이 각 레위 종족을 대표하는 인물임을 드러냈습니다.
  alternative_readings:
  - 각 종족 출신으로 단순화해 옮기는 방식
  - 모든 이름을 병렬 나열만 하는 방식
  rationale: 히브리어의 반복되는 מִן בְּנֵי/מִן 구조는 단순 출신 표시를 넘어 대표자 표지로 기능하므로, POB의 각주 취지에 맞게 그 의미를 본문에서 살렸습니다.
  doctrine_reference: 민수기 3장 레위 종족 구성과 족보적 대표성
