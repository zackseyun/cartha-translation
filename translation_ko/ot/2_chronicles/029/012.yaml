- from: 그때 레위 사람들이 일어났습니다. 마핫은 아마새의 아들이고, 요엘은 아사랴의 아들인데, 고핫 자손이며, 므라리 자손 가운데서는 기스가 압디의 아들이고 아사랴는 여할렐렐의 아들이며, 게르손 자손 가운데서는 요아가 지마의 아들이고 에덴이 요아의 아들이었습니다.[a][b]
