base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
  footnotes:
  - marker: a
    text: Hebrew literally, 'from the sons of the Kohathites ... from the sons of Merari.' This genealogical wording identifies the named men as representatives of those Levitical clans.
    reason: cultural_note
  - marker: b
    text: Or, 'from the sons of Gershon.' The Hebrew uses a clan designation here rather than repeating the exact earlier formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 레위 사람들이 일어났습니다. 고핫 자손 가운데서는 아마새의 아들 마핫과 아사랴의 아들 요엘이었고, 므라리 자손 가운데서는 압디의 아들 기스와 여할렐렐의 아들 아사랴였으며, 게르손 자손 가운데서는 지마의 아들 요아와 요아의 아들 에덴이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘고핫 자손 … 므라리 자손’이라는 족보적 표현을 사용하여, 이 이름들이 각 레위 종족을 대표하는 인물임을 보여 줍니다.
    reason: source_note
  - marker: b
    text: 또는 ‘게르손 사람들 가운데서는’입니다. 히브리어는 여기서 앞의 ‘자손들 가운데서’라는 표현 대신 게르손 계열을 가리키는 집단적 명칭을 사용합니다.
    reason: lexical_alternative
