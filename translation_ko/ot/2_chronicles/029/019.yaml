id: 2CH.29.19
reference: 2 Chronicles 29:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל הַ/כֵּלִ֗ים אֲשֶׁ֣ר הִזְנִיחַ֩ הַ/מֶּ֨לֶךְ אָחָ֧ז בְּ/מַלְכוּת֛/וֹ בְּ/מַעֲל֖/וֹ הֵכַ֣נּוּ וְ/הִקְדָּ֑שְׁנוּ וְ/הִנָּ֕/ם לִ/פְנֵ֖י מִזְבַּ֥ח יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
  footnotes:
  - marker: a
    text: Or 'cast aside' or 'neglected' for 'discarded.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in his trespass' or 'in his faithlessness.' The Hebrew emphasizes Ahaz's breach of faith.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아하스 왕이 그의 통치 기간 동안 그의 불성실함으로 버려 두었던 모든 기물들을 우리가 준비하고 거룩하게 구별하였습니다. 보십시오, 그것들이 야훼의 제단 앞에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘버려 두었던’ 혹은 ‘내버렸던’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 아하스의 언약적 불성실을 강조합니다.
    reason: theological_note
lexical_decisions:
- source_word: הַכֵּלִים
  english_pob_choice: the vessels
  chosen_korean: 기물들
  alternatives_korean:
  - 그릇들
  - 기구들
  - 도구들
  lexicon: HALOT
  rationale: 성전 문맥의 כֵּלִים은 단순한 그릇보다 넓은 성전 기물 전체를 가리키므로, 한국어에서는 ‘기물들’이 가장 포괄적이고 문맥에 맞습니다.
- source_word: הִזְנִיחַ
  english_pob_choice: cast aside / discarded
  chosen_korean: 버려 두었던
  alternatives_korean:
  - 내버렸던
  - 내팽개쳤던
  - 치워 두었던
  lexicon: HALOT
  rationale: 동사는 단순한 방치보다 적극적 폐기를 함축하므로, ‘버려 두었던’이 아하스가 성전 기물을 의도적으로 소홀히 한 뉘앙스를 비교적 자연스럽게 살립니다.
- source_word: בְּמַלְכוּתוֹ
  english_pob_choice: during his reign
  chosen_korean: 그의 통치 기간 동안
  alternatives_korean:
  - 그의 왕위 동안
  - 그가 다스리던 동안
  lexicon: HALOT
  rationale: 시간 부사구이므로 한국어에서는 ‘통치 기간 동안’이 가장 명료하며, 본문의 역사 서술 톤에도 맞습니다.
- source_word: בְּמַעֲלוֹ
  english_pob_choice: in his unfaithfulness
  chosen_korean: 그의 불성실함으로
  alternatives_korean:
  - 그의 배신으로
  - 그의 죄과로
  - 그의 범죄로
  lexicon: HALOT
  rationale: מַעַל은 언약적·종교적 ‘불성실/배반’의 뜻이 핵심이므로, 전통적 교회어휘보다 그 관계적 배반성을 드러내는 ‘불성실함’이 적절합니다.
- source_word: הֵכַנּוּ
  english_pob_choice: we have prepared
  chosen_korean: 우리가 준비하고
  alternatives_korean:
  - 우리가 갖추고
  - 우리가 마련하고
  - 우리가 예비하고
  lexicon: HALOT
  rationale: 본문의 회복 행위를 현재 완료의 한국어 서술로 자연스럽게 옮기되, 성전 기구를 다시 갖추는 의미를 ‘준비하고’로 살렸습니다.
- source_word: וְהִקְדָּשְׁנוּ
  english_pob_choice: and consecrated
  chosen_korean: 거룩하게 구별하였습니다
  alternatives_korean:
  - 봉헌하였습니다
  - 성별하였습니다
  - 성결하게 하였습니다
  lexicon: HALOT
  rationale: קדשׁ의 핵심은 ‘거룩하게 따로 떼어 놓음’이므로, 문맥상 예배용 회복을 분명히 하는 ‘거룩하게 구별하다’가 가장 직역적이면서도 이해하기 쉽습니다.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  english_pob_choice: before the altar of Yahweh
  chosen_korean: 야훼의 제단 앞에
  alternatives_korean:
  - 야훼의 제단 앞에
  - 야훼의 제단 앞에 있습니다
  lexicon: HALOT
  rationale: לִפְנֵי는 위치를 나타내므로 ‘앞에’가 자연스럽고, יְהוָה는 본 프로젝트 기본어휘에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 아하스의 불성실함을 어떻게 드러낼지
  chosen_reading: ‘그의 불성실함’으로 옮겨, 단순한 행정적 태만이 아니라 하나님과 성전 질서를 향한 언약적 배반을 드러냈습니다.
  alternative_readings:
  - ‘그의 범죄’
  - ‘그의 배반’
  - ‘그의 죄과’
  rationale: 문맥은 성전 기물을 방치한 역사적 사실을 넘어, 아하스의 신앙적 불충실을 평가합니다. 한국어에서도 그 도덕·언약적 무게를 보존하는 것이 필요합니다.
  doctrine_reference: 언약적 불성실(מַעַל)과 성전 정결 회복
