base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
  footnotes:
  - marker: a
    text: Or, 'because God had prepared things for the people' or 'because God had established this for the people.'
    reason: alternative_reading
translation:
  language: ko
  text: 히스기야와 온 백성은 하나님께서 백성을 위하여 준비하신 것[a]을 두고 기뻐하였습니다. 이는 그 일이 갑자기 이루어졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님께서 백성을 위하여 일들을 준비하신 것’ 또는 ‘하나님께서 이것을 백성을 위하여 세우신 것’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׂמַח
  english_pob_choice: rejoiced
  chosen_korean: 기뻐하였으니
  alternatives_korean:
  - 기뻐했습니다
  - 환호했습니다
  lexicon: HALOT
  rationale: שׂמח는 기쁨을 나타내므로, 서술체에 맞는 ‘기뻐하다’로 옮기되 문맥의 결과를 살려 연결 어미를 사용했습니다.
- source_word: וְכָל הָעָם
  english_pob_choice: and all the people
  chosen_korean: 온 백성
  alternatives_korean:
  - 모든 백성
  - 온 ժողովուրդ
  lexicon: HALOT
  rationale: 공동체 전체를 가리키는 표현이므로, 현대 한국어 성경체에서 자연스러운 ‘온 백성’으로 옮겼습니다.
- source_word: הֵכִין ... לָעָם
  english_pob_choice: had prepared for the people
  chosen_korean: 백성을 위해 준비하신
  alternatives_korean:
  - 백성을 위해 예비하신
  - 백성을 위해 마련하신
  lexicon: HALOT
  rationale: הכין의 기본 의미를 살려 ‘준비하다’로 옮기되, לָעָם의 수혜 대상을 ‘-을 위해’로 분명히 드러냈습니다.
- source_word: בְּפִתְאֹם הָיָה הַדָּבָר
  english_pob_choice: for the matter had happened suddenly
  chosen_korean: 그 일이 갑자기 일어났기 때문입니다
  alternatives_korean:
  - 그 일이 갑자기 되었기 때문입니다
  - 그 일이 돌연 일어났기 때문입니다
  lexicon: HALOT
  rationale: דָּבָר의 넓은 의미를 ‘일’로 풀어 자연스럽게 하였고, בְּפִתְאֹם의 급작스러움을 ‘갑자기’로 분명히 살렸습니다.
theological_decisions:
- issue: 하나님의 준비의 대상
  chosen_reading: 하나님이 백성을 위해 준비하신 일
  alternative_readings:
  - 하나님이 백성을 준비하신 일
  - 하나님이 백성에게 준비해 두신 일
  rationale: 히브리어와 POB 수정 이력은 ‘백성 자체’보다 ‘백성을 위한 일/상황’을 가리키는 쪽을 지지하므로, 수혜 대상을 살리면서도 오해를 피하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §3, §5
