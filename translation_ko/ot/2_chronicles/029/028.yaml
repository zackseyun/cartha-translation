id: 2CH.29.28
reference: 2 Chronicles 29:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל הַ/קָּהָל֙ מִֽשְׁתַּחֲוִ֔ים וְ/הַ/שִּׁ֣יר מְשׁוֹרֵ֔ר וְ/הַ/חֲצֹצְר֖וֹת מחצצרים הַ/כֹּ֕ל עַ֖ד לִ/כְל֥וֹת הָ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/028.yaml
  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
  footnotes:
  - marker: a
    text: Or 'the singing was singing/sounding'; the Hebrew literally has 'the song' with a participle, an idiom rendered more naturally in English as 'the song was being sung.'
    reason: lexical_alternative
translation:
  language: ko
  text: 온 회중은 엎드려 경배하고 있었고, 노래는 불리고 나팔들은 울리고 있었습니다. 이 모든 일은 번제가 끝날 때까지 계속되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 집회
  - 총회
  lexicon: HALOT
  rationale: 예배 장면에서 모인 공동체를 가리키므로, 문맥에 맞는 현대적 표현인 ‘회중’을 택했습니다. ‘교회’는 제도적 뉘앙스가 있어 여기서는 피했습니다.
- source_word: מִשְׁתַּחֲוִים
  english_pob_choice: was bowing down
  chosen_korean: 엎드려 경배하고
  alternatives_korean:
  - 절하며
  - 몸을 굽혀 경배하고
  - 예배하고
  lexicon: HALOT
  rationale: 동작의 핵심은 신체적으로 엎드려 경배하는 행위이므로, 단순한 ‘예배하다’보다 몸짓을 드러내는 표현을 사용했습니다.
- source_word: הַשִּׁיר מְשׁוֹרֵר
  english_pob_choice: the song was being sung
  chosen_korean: 노래가 불리고
  alternatives_korean:
  - 노래가 불려지고
  - 노래 소리가 울리고
  - 노래가 울려 퍼지고
  lexicon: HALOT
  rationale: 히브리어의 ‘노래’ + 분사 결합은 자연스러운 한국어로는 ‘노래가 불리다’로 옮기는 것이 가장 가까우며, 원문의 비정상적 구문을 무리하게 직역하지 않았습니다.
- source_word: חֲצֹצְרוֹת מחצצרים
  english_pob_choice: the trumpets were sounding
  chosen_korean: 나팔들이 울리는
  alternatives_korean:
  - 나팔들이 불리는
  - 나팔 소리가 울리는
  - 나팔들이 불리고
  lexicon: HALOT
  rationale: 성전 제의의 나팔 소리를 한국어로 자연스럽게 살리기 위해 ‘울리는’을 택했습니다. 이는 실제 연주 행위를 포함하면서도 음향적 효과를 잘 드러냅니다.
- source_word: עַד לִכְלוֹת הָעֹלָה
  english_pob_choice: until the burnt offering was finished
  chosen_korean: 번제물이 끝날 때까지
  alternatives_korean:
  - 번제물이 마칠 때까지
  - 번제가 끝날 때까지
  - 번제물이 다 소진될 때까지
  lexicon: HALOT
  rationale: ‘עֹלָה’는 제의적 용어로 ‘번제물’이 적절하며, 완료 동작은 한국어의 관용적 표현인 ‘끝날 때까지’로 옮겼습니다.
theological_decisions:
- issue: 예배 행위의 본질을 ‘경배’와 ‘노래/나팔’의 병렬로 어떻게 드러낼지
  chosen_reading: 몸으로 엎드려 경배하는 행위와, 음악적 예배가 동시에 진행되는 장면으로 옮겼습니다.
  alternative_readings:
  - ‘예배하고’로 일반화하는 읽기
  - ‘절하고’로만 축소하는 읽기
  rationale: 본문은 공동체의 물리적 경배와 제의적 음악이 함께 진행되는 모습을 강조하므로, 두 요소를 모두 보이게 해야 합니다.
  doctrine_reference: 공동예배의 가시적·의례적 표현
- issue: ‘הַשִּׁיר מְשׁוֹרֵר’의 비정상적 구문을 한국어에서 어떻게 처리할지
  chosen_reading: 의미를 살려 ‘노래가 불리고’로 자연화했습니다.
  alternative_readings:
  - ‘노래가 노래하고’의 직역
  - ‘노래가 불리는 중에’의 확대
  rationale: 히브리어는 문자적으로는 어색한 중첩 표현이지만, 뜻은 노래가 실제로 불리고 있음을 가리킵니다. 한국어에서는 이 관용을 살리는 것이 더 충실합니다.
  doctrine_reference: 원문 문법의 관용적 재현
