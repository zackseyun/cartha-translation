translation:
  language: ko
  text: 그들은 자기 형제들을 모으고 스스로를 거룩하게 하였으며, 왕의 명령에 따라, 야훼의 말씀을 따라 야훼의 집을 깨끗하게 하려고 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּאַסְפוּ אֶת אֲחֵיהֶם
  english_pob_choice: They gathered their brothers
  chosen_korean: 그들은 자기 형제들을 모으고
  alternatives_korean:
  - 그들은 자기 형제들을 모아
  - 그들은 자기 동료들을 모으고
  lexicon: HALOT
  rationale: וַיַּאַסְפוּ는 ‘모으다/집합시키다’의 능동적 의미를 가지므로 ‘모으고’로 옮겼고, אֲחֵיהֶם의 친족 표현을 ‘형제들’로 살렸습니다.
- source_word: וַיִּתְקַדְּשׁוּ
  english_pob_choice: consecrated themselves
  chosen_korean: 스스로를 거룩하게 하였으며
  alternatives_korean:
  - 자신을 성결하게 하였으며
  - 자신을 성별하였으며
  lexicon: HALOT
  rationale: 성전 봉사를 위한 의례적 자기 정결/헌신을 가리키므로, 현대 한국어에서 자연스럽고 의미를 드러내는 ‘거룩하게 하다’로 옮겼습니다.
- source_word: כְמִצְוַת הַמֶּלֶךְ בְּדִבְרֵי יְהוָה
  english_pob_choice: according to the command of the king, by the words of Yahweh
  chosen_korean: 왕의 명령에 따라, 야훼의 말씀을 따라
  alternatives_korean:
  - 왕의 명령대로, 야훼의 말씀에 따라
  - 왕의 명령에 따라, 야훼의 말씀에 근거하여
  lexicon: HALOT
  rationale: 히브리어는 왕의 명령이 야훼의 ‘말씀들’에 의해 규정된다는 관계를 보여 줍니다. ‘따라’로 두 번 옮겨 순종의 기준 관계를 자연스럽게 드러내면서, 문구의 중첩된 전치사를 과도하게 풀지 않았습니다.
- source_word: לְטַהֵר בֵּית יְהוָה
  english_pob_choice: to cleanse the house of Yahweh
  chosen_korean: 야훼의 집을 깨끗하게 하려고
  alternatives_korean:
  - 야훼의 집을 정결하게 하려고
  - 야훼의 집을 깨끗이 하려고
  lexicon: HALOT
  rationale: טהר는 성전 문맥에서 의례적 정결/정화의 의미를 가지므로 ‘깨끗하게 하다’로 옮겼고, ‘집’은 원문 표현을 살렸습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: יַהְוֶה를 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 신적 고유명은 대체 титул보다 음역을 우선하여, 본문의 언약적 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה / YHWH → 야훼'
- issue: 왕의 명령과 야훼의 말씀의 관계
  chosen_reading: 왕의 명령이 야훼의 말씀을 기준으로 삼는다는 점을 드러내기 위해 두 구문을 모두 살렸습니다.
  alternative_readings:
  - ‘왕의 명령에 따라’만 두고 뒤를 매끄럽게 묶는 방식
  - ‘야훼의 말씀에 따라’로만 의미를 통합하는 방식
  rationale: 히브리어는 왕의 명령과 야훼의 말씀을 병치하며, 인간 왕권이 신적 말씀에 종속됨을 보여 줍니다. 이 긴장은 본문에 중요한 신학적 의미가 있으므로 약화하지 않았습니다.
  doctrine_reference: '본문 내 권위 질서: 왕권의 정당성은 야훼의 말씀에 의해 규정됨'
