translation:
  language: ko
  text: 보십시오[a], 우리 아버지들은 칼에 쓰러졌고, 우리 아들과 딸들과 아내들은 이 일 때문에 포로로 잡혀 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 담화 표지는 뒤따르는 진술을 강하게 주목시키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘포로 상태에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold / And look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 이 담화 표지는 뒤따르는 말을 강하게 환기하는 기능이므로, 현대 한국어에서는 정중한 주의 환기 표현인 ‘보십시오’가 가장 자연스럽고 공손합니다.
- source_word: נָפְלוּ
  english_pob_choice: have fallen
  chosen_korean: 쓰러졌고
  alternatives_korean:
  - 떨어졌고
  - 넘어졌고
  - 죽었고
  lexicon: HALOT
  rationale: 전쟁 문맥에서 ‘fell’의 직역성을 살리되, 죽음을 과도하게 풀이하지 않도록 ‘쓰러졌고’로 옮겼습니다.
- source_word: אֲבוֹתֵינוּ
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들은
  alternatives_korean:
  - 우리 아버지들은
  - 우리 선조들은
  lexicon: HALOT
  rationale: 문맥상 한 세대의 전쟁 희생을 가리키며, 한국어에서는 혈연적 남성 조상에 한정된 ‘아버지들’보다 집단적 역사 주체를 드러내는 ‘조상들’이 더 자연스럽습니다.
- source_word: בַּשְּׁבִי
  english_pob_choice: are in captivity
  chosen_korean: 포로가 되었습니다
  alternatives_korean:
  - 사로잡혀 있습니다
  - 포로 상태에 있습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘포로 됨’의 상태를 말하므로, 현대 한국어에서 가장 직접적인 대응인 ‘포로가 되었습니다’를 선택했습니다.
theological_decisions:
- issue: 전쟁 심판의 결과를 가족 전체의 상실로 제시하는 방식
  chosen_reading: 우리 아들과 딸들과 아내들은 이 일 때문에 포로가 되었습니다
  alternative_readings:
  - 우리 자녀들과 아내들은 이 일 때문에 포로가 되었습니다
  - 우리 아들딸들과 아내들은 이 일 때문에 사로잡혀 있습니다
  rationale: 히브리어가 아들과 딸을 구별해 열거하므로, 성별 구분을 지워 버리는 ‘자녀들’보다 원문의 구분을 보존했습니다. 또한 원인 표현 ‘이 일 때문에’는 앞 문맥의 죄와 심판을 가리키지만, 본절 자체가 직접 그 죄를 설명하지는 않으므로 과도한 해석은 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
