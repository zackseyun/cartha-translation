  source_fidelity: 히브리어의 두 동사(‘데려오다’, ‘모으다’)와 대상(제사장들, 레위 사람들), 그리고 집결 장소(동쪽의 넓은 공적 공간)를 충실히 반영합니다. ‘동쪽 광장에’는 לִרְחוֹב הַמִּזְרָח의 문맥상 자연스럽고 적절한 번역입니다.
  naturalness: ‘그는 제사장들과 레위 사람들을 데려와 동쪽 광장에 모았습니다’는 현대 표준 한국어의 합쇼체 서술로 자연스럽습니다. 연결 어미 ‘-와’는 히브리어 서사적 동작 연쇄를 무리 없이 전달합니다.
  terminology: ‘제사장들’과 ‘레위 사람들’은 성전 직무 집단을 구별하는 전통적이고 이해하기 쉬운 용어입니다. ‘광장’은 רחוב의 열린 넓은 장소라는 의미를 적절히 살립니다.
