translation:
  language: ko
  text: 그는 제사장들과 레위 사람들을 데려와 동쪽 광장에 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘동쪽 편 광장에 그들을 모았습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  english_pob_choice: Then he brought in
  chosen_korean: 데려와
  alternatives_korean:
  - 가져와
  - 데려오고
  lexicon: HALOT
  rationale: 히필 완료 연속형으로서 단순히 ‘오다’가 아니라 사람들을 어떤 곳으로 이르게 하는 뜻이므로, 자연스러운 한국어로 ‘데려와’가 본문 흐름을 잘 살립니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 성직자들
  lexicon: HALOT
  rationale: כהנים의 표준 대응은 제사장들입니다. 본문이 성전 직무를 말하므로 ‘사제들’보다 직접적입니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 자손들
  lexicon: HALOT
  rationale: 공동체적 직무 집단을 가리키는 표현으로 한국어 성경에서 통용되는 ‘레위 사람들’을 택했습니다.
- source_word: לִרְחוֹב הַמִּזְרָח
  english_pob_choice: in the eastern square
  chosen_korean: 동쪽 광장에
  alternatives_korean:
  - 동쪽 뜰에
  - 동편 광장에
  - 동쪽 마당에
  lexicon: HALOT
  rationale: רחוב은 ‘넓은 공공 공간’으로서 광장/장소의 의미가 강하므로, POB의 ‘square’에 맞춰 ‘광장’으로 옮겼습니다. מזרח는 지시적 방향이므로 ‘동쪽’이 가장 자연스럽습니다.
theological_decisions:
- issue: 성전 집결 장소의 공간 뉘앙스
  chosen_reading: ‘동쪽 광장’으로 옮겨, 단순한 실내나 추상적 집합이 아니라 공개적인 성전 인접 공간에서의 소집임을 드러냈습니다.
  alternative_readings:
  - ‘동쪽 뜰’
  - ‘동편 광장’
  rationale: 본문의 רחוב은 폐쇄된 뜰보다 더 넓은 공적 공간을 가리킬 수 있어, 성전 문맥을 유지하면서도 공간의 개방성을 살리는 번역이 필요합니다.
  doctrine_reference: 역대하 29장 문맥의 성전 정화와 소집
