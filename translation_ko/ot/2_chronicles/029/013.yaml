  rationale: 직역형은 ‘아들들’이지만, 문맥상 즉시적 자녀보다 씨족/계열을 가리킬 수 있어 한국어에서는 ‘아들들 가운데서는’으로 유지하되 뜻을 과도하게 풀지 않았습니다.
