  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
  footnotes:
  - marker: a
    text: Hebrew 'sons of' may denote a wider family line or clan membership, not only immediate sons.
    reason: lexical_alternative
  - marker: b
    text: The name 'Jeuel' is spelled differently from some similar names elsewhere (for example, 'Jeiel'); the Hebrew form here supports 'Jeuel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 엘리사반의 아들들 가운데서는 시므리와 여이엘이 있으며, 아삽의 아들들 가운데서는 스가랴와 맛다냐가 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들들’은 때로 직계 아들뿐 아니라 더 넓은 씨족이나 계열 소속을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서는 이름의 히브리어 형태가 ‘여이엘’보다 ‘여우엘/여이엘 계열’의 표기에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  english_pob_choice: and from
  chosen_korean: 그리고 … 가운데서는
