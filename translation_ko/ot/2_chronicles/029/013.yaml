translation:
  language: ko
  text: 그리고 엘리사반의 아들들[a] 가운데서는 시므리와 여우엘[b]이 있고, 아삽의 아들들 가운데서는 스가랴와 맛다냐가 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아들들’은 때로 직계 아들뿐 아니라 더 넓은 씨족이나 계열 소속을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 이름은 ‘여우엘’에 해당합니다. 비슷한 이름이 다른 곳에서는 ‘여이엘’로 표기되기도 하지만, 이 절의 히브리어 형태는 여우엘을 뒷받침합니다.
    reason: lexical_alternative
