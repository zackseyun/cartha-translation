translation:
  language: ko
  text: 내 아들들아, 이제는 태만하지 마십시오. 야훼께서 너희를 택하셔서 그분 앞에 서서 그분을 섬기고, 그분의 일꾼이 되며 분향하는 자가 되게 하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘태만하지 마십시오’는 ‘게으르다/소홀하다/태만하다’의 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그분 앞에 서서’는 하나님 앞에서 섬기는 제사장적 관용구입니다.
    reason: cultural_note
  - marker: c
    text: ‘분향하는 자’는 문자적으로는 ‘향을 피우는 자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי
