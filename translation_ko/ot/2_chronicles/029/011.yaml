  lexicon: HALOT
  rationale: 문맥이 성전 직무에 대한 경고이므로 ‘negligent’의 실천적 의미를 살려 ‘태만하지 마십시오’로 옮겼습니다.
- source_word: לַעֲמֹד לְפָנָיו / לְשָׁרְתוֹ / מְשָׁרְתִים / מַקְטִרִים
  english_pob_choice: to stand before him ... to minister to him ... to be his ministers and burners of incense
  chosen_korean: 그분 앞에 서서 그분을 섬기고, 그분의 일꾼이 되며 분향하는 자
  alternatives_korean:
  - 그분 앞에 서서 그분을 섬기며, 그분의 일꾼이 되며 향을 올리는 자
  - 그분 앞에 서서 그분께 봉사하고, 그분의 봉사자들이 되며 분향하는 자
  lexicon: HALOT
  rationale: ‘그분 앞에 서다’는 성전 봉사의 관용구를 살리고, מְשָׁרְתִים은 직분적 의미를 가진 ‘일꾼’으로, מַקְטִרִים은 제의적 행위를 드러내는 ‘분향하는 자’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
