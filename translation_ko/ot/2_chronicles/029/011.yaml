theological_decisions:
- issue: 성전 직무에 대한 소명 표현의 직역성
  chosen_reading: ‘그분 앞에 서서’와 ‘분향하는 자’는 단순한 일반 봉사가 아니라 제사장적 소명과 예배 직무를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘그분께 봉사하도록’처럼 일반 봉사로 완화
  - ‘향을 피우는 사람’처럼 직무성을 약화
  rationale: 히브리어는 성전에서의 임직과 예배 행위를 함께 묶어 말하므로, 문맥의 제의적 긴장을 보존하는 쪽이 소스에 더 충실합니다.
  doctrine_reference: 2 Chronicles 29:11 cultic vocation context
