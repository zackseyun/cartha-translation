  rationale: 1인칭 소유격이 붙은 남성 복수 호격이므로, 문맥상 제사장/레위인들에게 하는 직접 호칭을 살려 ‘내 아들들아’로 옮겼습니다.
- source_word: אַל תִּשָּׁלוּ
