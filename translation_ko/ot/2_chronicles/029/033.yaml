lexical_decisions:
- source_word: וְהַקֳּדָשִׁים
  english_pob_choice: the consecrated offerings
  chosen_korean: 성별된 예물
  alternatives_korean:
  - 거룩한 것들
  - 성별된 것들
  - 바쳐진 예물
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘거룩함’이 아니라 성전용으로 구별된 제물을 가리키므로, POB의 ‘consecrated offerings’를 살려 자연스럽게 옮겼습니다.
- source_word: בָּקָר
  english_pob_choice: cattle
  chosen_korean: 소
  alternatives_korean:
  - 소떼
  - 가축
  - 암수소
  lexicon: HALOT
  rationale: 히브리어는 소의 집합적 명칭이지만, 한국어 목록 표현에서는 ‘소’가 가장 간결하고 자연스럽습니다.
- source_word: וְצֹאן
  english_pob_choice: and three thousand sheep
  chosen_korean: 양 3,000마리
  alternatives_korean:
  - 그리고 3,000마리의 작은 가축
  - 그리고 3,000마리의 떼짐승
  - 그리고 3,000마리의 양과 염소
  lexicon: HALOT
  rationale: צֹאן은 양과 염소를 아우를 수 있으나, 이 절의 목록 문맥에서는 POB처럼 통상적 요약어인 ‘양’이 적절합니다.
