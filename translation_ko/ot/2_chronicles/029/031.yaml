  source_fidelity: 핵심 관용구 מִלֵּאתֶם יֶדְכֶם를 그대로 옮긴 ‘손을 채웠습니다’는 한국어에서 뜻을 전달하지 못합니다. 이 표현은 성전 봉사를 위한 성별/위임의 관용구이므로, 본문에서는 그 의미를 자연스럽게 번역하고 각주에서 직역과 관용적 의미를 밝혀야 합니다. 나머지 제의 용어, ‘회중’, 자원하여 드린 번제라는 구분은 원문에 충실합니다.
