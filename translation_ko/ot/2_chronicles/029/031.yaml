  text: וַ/יַּ֨עַן יְחִזְקִיָּ֜הוּ וַ/יֹּ֗אמֶר עַתָּ֨ה מִלֵּאתֶ֤ם יֶדְ/כֶם֙ לַ/יהוָ֔ה גֹּ֧שׁוּ וְ/הָבִ֛יאוּ זְבָחִ֥ים וְ/תוֹד֖וֹת לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבִ֤יאוּ הַ/קָּהָל֙ זְבָחִ֣ים וְ/תוֹד֔וֹת וְ/כָל נְדִ֥יב לֵ֖ב עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
  footnotes:
  - marker: a
    text: 'Hebrew: ''you have filled your hand for the LORD,'' an idiom for being consecrated or installed for sacred service.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 히스기야가 대답하여 말했습니다. “이제 여러분은 야훼를 위해 손을 채웠습니다. 가까이 오셔서 야훼의 집으로 제물과 감사제를 가져오십시오.” 그러자 회중이 제물과 감사제를 가져왔고, 마음이 기꺼운 모든 사람이 번제물을 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 '손을 채웠습니다'로, 성전 봉사에 위임되거나 성별되었다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 대답했습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적 서술인 '대답하여 말하다'를 자연스러운 합쇼체로 옮겨, 뒤이은 직접화를 예고하는 구조를 살렸습니다.
- source_word: מִלֵּאתֶם יֶדְכֶם
  english_pob_choice: you have filled your hand for Yahweh
  chosen_korean: 야훼를 위해 손을 채웠습니다
  alternatives_korean:
  - 야훼를 위해 자신을 성별하셨습니다
  - 야훼를 위해 손을 가득 채우셨습니다
  lexicon: HALOT
  rationale: 문맥상 성전 봉사를 위한 위임/성별을 가리키는 관용구를 직역에 가깝게 유지했습니다. 한국어에서는 '손을 채웠습니다'가 원문의 이미지와 의례적 뉘앙스를 가장 가깝게 드러냅니다.
- source_word: לַיהוָה / לְבֵית יְהוָה
  english_pob_choice: for Yahweh / to the house of Yahweh
  chosen_korean: 야훼를 위해 / 야훼의 집으로
  alternatives_korean:
  - 주님을 위해 / 주님의 성전으로
  - 여호와를 위해 / 여호와의 집으로
  lexicon: 표준 용례
  rationale: 본문의 언약명 יהוה를 '야훼'로 일관되게 옮기고, '집'은 성전의 직역 표현을 유지해 원문의 성소 언어를 보존했습니다.
- source_word: זְבָחִים ... תוֹדוֹת ... עֹלוֹת
  english_pob_choice: sacrifices and thank offerings ... burnt offerings
  chosen_korean: 제물과 감사제 ... 번제물
  alternatives_korean:
  - 희생제물과 감사제 ... 번제
  - 희생제사와 감사제사 ... 번제
  lexicon: HALOT
  rationale: 제물/감사제/번제물은 제의적 분류를 현대 한국어에서 분명하게 드러내면서도 지나치게 교회화된 표현을 피합니다.
- source_word: הַקָּהָל
  english_pob_choice: the assembly
  chosen_korean: 회중
  alternatives_korean:
  - 공동체
  - 모인 무리
  lexicon: HALOT
  rationale: 예배 맥락의 모임을 가리키므로, 한국어 성서에서 자연스럽고 기능적으로 정확한 '회중'을 택했습니다.
- source_word: כָל נְדִיב לֵב
  english_pob_choice: all who were willing of heart
  chosen_korean: 마음이 기꺼운 모든 사람
  alternatives_korean:
  - 마음이 자원한 모든 사람
  - 너그러운 마음의 모든 사람
  lexicon: HALOT
  rationale: '''마음이 기꺼운''은 자원성과 내적 동기를 함께 드러내며, 문자적이면서도 현대 한국어로 읽히는 표현입니다.'
theological_decisions:
