id: 2CH.29.26
reference: 2 Chronicles 29:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּֽעַמְד֤וּ הַ/לְוִיִּם֙ בִּ/כְלֵ֣י דָוִ֔יד וְ/הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְרֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/026.yaml
  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
  footnotes:
  - marker: a
    text: Or 'with David's instruments.' The Hebrew phrase may mean instruments belonging to, commissioned by, or associated with David.
    reason: lexical_alternative
  - marker: b
    text: That is, the cultic trumpets used by the priests; some contexts specify them as silver, but that detail is not stated here.
    reason: cultural_note
translation:
  language: ko
  text: 그때 레위 사람들은 다윗의 악기들[a]을 가지고 섰고, 제사장들은 나팔[b]을 가지고 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다윗과 관련된 악기들’. 히브리어 표현은 다윗에게 속한 것, 그가 정한 것, 또는 그와 관련된 것을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉 제사장들이 사용한 제의용 나팔입니다. 어떤 문맥에서는 은나팔로 더 구체적으로 말하지만, 여기에는 그 세부가 없습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  english_pob_choice: Then ... stood
  chosen_korean: 서고
  alternatives_korean:
  - 서 있었습니다
  - 자리를 잡았습니다
  - 그 자리에 섰습니다
  lexicon: HALOT
  rationale: 서술 진행을 살리면서 עמד의 기본 의미인 ‘서다/자리를 취하다’를 자연스럽게 옮겼습니다.
- source_word: בִּכְלֵי דָוִיד
  english_pob_choice: with the instruments of David
  chosen_korean: 다윗의 악기들로
  alternatives_korean:
  - 다윗의 기구들로
  - 다윗의 악기와 함께
  - 다윗의 악기들로서
  lexicon: HALOT
  rationale: כְּלִי는 넓게는 ‘도구/기구’이지만 여기서는 예배 음악 문맥이므로 ‘악기’가 가장 직접적입니다. 다윗과의 관계는 소유격으로 유지했습니다.
- source_word: בַּחֲצֹצְרוֹת
  english_pob_choice: with the trumpets
  chosen_korean: 나팔로
  alternatives_korean:
  - 나팔들과 함께
  - 트럼펫으로
  - 은나팔로
  lexicon: HALOT
  rationale: חֲצֹצְרוֹת는 제의적 나팔을 가리키므로 한국어 성경 문맥에 맞는 ‘나팔’로 옮겼습니다. 본문에는 ‘은’이 없으므로 덧붙이지 않았습니다.
theological_decisions:
- issue: 예배 음악 용어의 범위
  chosen_reading: ‘다윗의 악기들’은 다윗에게 속하거나 다윗이 정한 제의적 악기들을 가리키는 넓은 표현으로 유지했습니다.
  alternative_readings:
  - ‘다윗의 악기’처럼 소유만 강조하는 해석
  - ‘다윗이 만든 악기’처럼 제작을 단정하는 해석
  rationale: 히브리어 בִּכְלֵי דָוִיד는 소유, 임명, 연관성을 모두 열어 두는 표현이므로, 본문이 허용하는 범위를 넘겨 특정 관계를 단정하지 않았습니다.
  doctrine_reference: 성경 본문의 문법적 여지를 보존하는 원칙
- issue: 제사장들의 제의적 나팔
  chosen_reading: ‘나팔’만 두어 문맥상 제의용 악기임을 드러내되, 없는 정보인 ‘은’을 보태지 않았습니다.
  alternative_readings:
  - ‘은나팔’이라고 구체화
  - ‘트럼펫’으로 현대화
  rationale: 영어 POB도 본문 자체에 없는 세부를 주석으로만 처리하므로, 한국어 본문 역시 같은 절제 수준을 유지했습니다.
  doctrine_reference: 본문 충실성 및 절제 번역 원칙
