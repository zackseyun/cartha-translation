source:
  edition: WLC
  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'like all the abominations of the nations' or 'in keeping with all the detestable practices of the nations.'
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 또한 제사장들과 백성의 모든 지도자들은 이방 민족들의 모든 가증한 일을 따라 불성실한 일을 더욱 많이 저질렀고, 야훼께서 예루살렘에서 거룩하게 구별하신 야훼의 집을 더럽혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불성실한 일을 더욱 많이 저질렀고’는 히필 동사와 동족목적어가 결합한 표현으로, 불성실한 행위를 거듭하고 크게 늘렸다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  english_pob_choice: all the leaders of the priests and the people
  chosen_korean: 제사장들의 모든 우두머리와 백성
  alternatives_korean:
  - 제사장들의 모든 지도자와 백성
  - 제사장들의 모든 관리와 백성
  lexicon: HALOT
  rationale: שָׂרֵי는 제사장 집단 안의 ‘우두머리들/지도자들’이라는 구조를 가리키므로, ‘제사장들’ 자체와 겹치지 않게 ‘우두머리’로 옮겼습니다.
- source_word: הִרְבּוּ לִמְעָול מַעַל
  english_pob_choice: increased in unfaithfulness
  chosen_korean: 더욱 불성실해져서
  alternatives_korean:
  - 불성실함을 크게 늘려서
  - 배신을 거듭하여
  lexicon: HALOT
  rationale: 히필 동사와 동족목적어가 결합된 강한 반복·증대 표현이므로, 한국어에서는 동작의 누적을 살린 ‘더욱 불성실해져서’로 자연스럽게 옮겼습니다.
- source_word: תֹּעֲבוֹת הַגּוֹיִם
  english_pob_choice: the abominations of the nations
  chosen_korean: 이방 민족들의 모든 가증한 일
  alternatives_korean:
  - 열방의 모든 가증한 일
  - 민족들의 모든 역겨운 행위
  lexicon: HALOT
  rationale: תּוֹעֵבוֹת의 종교적·윤리적 강도를 살리기 위해 관용적으로 ‘가증한 일’을 택했고, גּוֹיִם은 문맥상 ‘이방 민족들’로 구체화했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신명기적 고유명사 יְהוָה는 ‘야훼’로 음역해 인격적 이름을 보존했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼께서 … 그의 집
  alternatives_korean:
  - 야훼의 집
  - 여호와의 성전
  lexicon: HALOT
  rationale: בַּיִת은 직역상 ‘집’이므로 이를 유지했고, 본절의 핵심은 성전의 거룩한 구별과 더러움의 대조이기에 ‘집’이 원문의 표현을 가장 잘 살립니다.
- source_word: הִקְדִּישׁ
  english_pob_choice: he had consecrated
  chosen_korean: 거룩하게 구별하신
  alternatives_korean:
  - 봉헌하신
  - 성별하신
  lexicon: HALOT
  rationale: הקדיש는 단순히 ‘만들다’가 아니라 하나님께 속하게 ‘거룩하게 구별하다’는 뜻이므로, 현대 한국어에서 의미가 분명한 표현을 택했습니다.
theological_decisions:
- issue: ‘house of Yahweh’와 성전 더러움의 대비를 어떻게 살릴지
  chosen_reading: ‘야훼께서 예루살렘에서 거룩하게 구별하신 그의 집을 더럽혔습니다’로 번역해 거룩한 구별과 실제 더러움을 직접 대비했습니다.
  alternative_readings:
  - ‘야훼의 집을 더럽혔습니다’
  - ‘야훼의 성전을 더럽혔습니다’
  rationale: 원문은 מקום의 거룩한 지정과 그 위반을 강조하므로, ‘집’을 유지하되 ‘거룩하게 구별하신’으로 그 신학적 무게를 분명히 했습니다.
  doctrine_reference: Translation philosophy §§1, 5
