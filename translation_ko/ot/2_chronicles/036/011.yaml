  - 스물한 살이었을 때
  lexicon: HALOT
  rationale: 히브리어 나이 표현은 한국어에서도 관용적으로 ‘스물한 살’로 옮기는 것이 자연스럽고, 직역형 ‘아들’ 표현은 뜻을 흐릴 수 있습니다.
- source_word: בְמָלְכֹו
