  lexicon: HALOT
  rationale: 접두 בְ와 동사형 결합은 즉위 시점을 나타내므로, 자연스러운 현대 한국어로 ‘왕이 되었을 때’라고 옮겼습니다.
- source_word: מָלַךְ
  english_pob_choice: he reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 재위했습니다
  lexicon: HALOT
  rationale: 왕의 재위 기간을 말하므로 ‘재위했습니다’도 가능하지만, 문장의 흐름상 ‘다스렸습니다’가 한국어에서 더 자연스럽고 의미를 분명히 합니다.
