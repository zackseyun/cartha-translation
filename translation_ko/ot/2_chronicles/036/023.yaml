source:
  edition: WLC
  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
  footnotes:
  - marker: a
    text: Or, more smoothly, 'Whoever among you belongs to any of his people.' The Hebrew expression is compressed and can be represented in more than one close English form.
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD his God is with him.' The Hebrew can be read as an indicative statement, though the context favors a benedictory sense.
    reason: alternative_reading
  - marker: c
    text: That is, go up to Jerusalem; 'go up' is the conventional biblical idiom for ascent to the holy city.
    reason: cultural_note
  - marker: d
    text: Or 'Whoever among you is from all his people'.
    reason: previous_rendering
translation:
  language: ko
  text: 「페르시아 왕 고레스가 이렇게 말합니다. 하늘의 하나님 야훼께서 땅의 모든 나라를 내게 주셨고, 또 유다에 있는 예루살렘에 그를 위하여 집을 세우라고 내게 맡기셨습니다. 너희 가운데 그의 백성에 속한 자가 누구든지, 그의 하나님 야훼께서 그와 함께 계시기를 바라며, 올라가십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 가운데 그의 백성에 속한 자’는 히브리어의 압축된 부분 표현을 풀어 옮길 수 있으며, 더 매끄럽게는 ‘그의 백성 중 너희 가운데 있는 자’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그와 함께 계시기를 바라며’는 본문을 서술문으로도 읽을 수 있지만, 문맥상 축복/소원의 뜻이 더 적절합니다.
    reason: alternative_reading
  - marker: c
    text: ‘올라가십시오’는 예루살렘으로의 상승을 가리키는 성경의 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר כּוֹרֶשׁ מֶלֶךְ פָּרַס
  english_pob_choice: Thus says Cyrus king of Persia
  chosen_korean: 「페르시아 왕 고레스가 이렇게 말합니다」
  alternatives_korean:
  - 「페르시아 왕 고레스가 말합니다」
  - 「고레스, 페르시아 왕이 이렇게 말합니다」
  lexicon: WLC; 왕호 관용
  rationale: 예언자/왕명 선포문의 정형 표현을 한국어 자연문으로 옮기되, ‘이렇게 말합니다’로 현재형 선언의 공적 성격을 살렸습니다.
- source_word: יְהוָה אֱלֹהֵי הַשָּׁמַיִם
  english_pob_choice: Yahweh, the God of heaven
  chosen_korean: 하늘의 하나님 야훼
  alternatives_korean:
  - 하늘의 하나님 여호와
  - 하늘의 하나님 야훼 하나님
  lexicon: 프로젝트 기본어휘; WLC
  rationale: יהוה는 프로젝트 기본값대로 ‘야훼’로 옮기고, אֱלֹהֵי הַשָּׁמַיִם는 관용적으로 ‘하늘의 하나님’으로 처리했습니다.
- source_word: פָקַד עָלַי לִבְנוֹת לוֹ בַיִת
  english_pob_choice: has charged me to build for him a house
  chosen_korean: 그를 위하여 집을 세우라고 내게 맡기셨습니다
  alternatives_korean:
  - 그를 위하여 집을 짓도록 내게 명하셨습니다
  - 그를 위하여 성전을 세우라고 내게 맡기셨습니다
  lexicon: HALOT
  rationale: פָקַד은 단순 명령보다 위임·소명에 가까운 뉘앙스가 있어 ‘맡기셨습니다’로 옮겼고, בַיִת은 본문 어휘를 따라 ‘집’으로 유지했습니다.
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  english_pob_choice: Whoever is among you of all his people
  chosen_korean: 너희 가운데 그의 백성에 속한 자가 누구든지
  alternatives_korean:
  - 너희 가운데 그의 백성인 사람은 누구든지
  - 너희 가운데 그의 모든 백성 중 누구든지
  lexicon: HALOT
  rationale: 압축된 히브리어의 부분적 소속 표현을 한국어에서는 ‘속한 자’로 자연스럽게 풀어, ‘among you’와 ‘of all his people’의 두 요소를 함께 살렸습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 신명은 프로젝트 기준에 따라 음역 표기하여, 본문 자체의 언약명과 번역 결정의 투명성을 유지했습니다.
  doctrine_reference: '프로젝트 기본 어휘: יהוה / YHWH'
- issue: ‘그와 함께 계시기를 바라며’의 문장 기능
  chosen_reading: 축복적 소원/권면으로 처리했습니다.
  alternative_readings:
  - '단순 서술: ‘그의 하나님 야훼께서 그와 함께 계십니다’'
  - 명령형 없이 직설적으로 번역
  rationale: 문맥상 귀환을 촉구하는 폐구문이므로, 한국어에서는 축복의 뜻이 드러나는 ‘계시기를 바라며’가 가장 자연스럽습니다.
  doctrine_reference: WLC 문맥; 축복 공식
