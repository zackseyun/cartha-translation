base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
  footnotes:
  - marker: a
    text: 'Hebrew: ''at the return/turn of the year,'' an idiom for when the year came around.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the valuable/treasured vessels of the house of the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'his brother'; Zedekiah was Jehoiachin's close royal relative, more specifically his uncle.
    reason: cultural_note
translation:
  language: ko
  text: 새해가 돌아올 무렵에 바벨론 왕 느부갓네살이 사람을 보내 그를 바벨론으로 끌고 갔습니다. 또한 야훼의 집의 귀한 그릇들을 함께 가져갔습니다. 그리고 그의 형제를 유다와 예루살렘의 왕으로 세웠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘해의 돌아옴/되돌아옴’이며, 해가 순환하여 다시 돌아오는 시점을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 집의 값진/보배로운 그릇들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘그의 형제’라고 하지만, 여기서는 더 넓은 왕족 관계를 가리키는 표현일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  english_pob_choice: At the turn of the year
  chosen_korean: 새해가 돌아올 무렵에
  alternatives_korean:
  - 해가 돌아올 때에
  - 연초에
  - 새해가 되었을 때
  lexicon: HALOT
  rationale: 직역하면 ‘해의 돌아옴/되돌아옴’이므로, 한국어에서는 자연스럽게 ‘새해가 돌아올 무렵’으로 옮겨 시간의 순환 이미지를 살렸습니다.
- source_word: כְּלֵי חֶמְדַּת
  english_pob_choice: the precious vessels
  chosen_korean: 귀한 그릇들
  alternatives_korean:
  - 보배로운 그릇들
  - 귀중한 기물들
  - 소중한 기물들
  lexicon: HALOT
  rationale: 성전 기구를 가리키는 문맥이므로 ‘그릇들’로 옮기되, חֶמְדַּת의 가치 강조를 ‘귀한’으로 반영했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 지정된 원칙에 따라 신명기적 고유명사 יְהוָה를 ‘야훼’로 유지하고, 히브리어 표현 ‘집’을 그대로 살렸습니다.
- source_word: אָחִיו
  english_pob_choice: his brother
  chosen_korean: 그의 형제
  alternatives_korean:
  - 그의 동생
  - 그의 친족
  lexicon: HALOT
  rationale: 히브리어 친족 용례를 따라 직역을 유지했습니다. 영어 주석이 밝히는 더 구체적 친족 관계는 본문이 아니라 주석에서만 처리하는 편이 원문에 충실합니다.
- source_word: וַיַּמְלֵךְ
  english_pob_choice: made ... king
  chosen_korean: 왕으로 세웠습니다
  alternatives_korean:
  - 왕으로 삼았습니다
  - 왕이 되게 했습니다
  - 왕으로 임명했습니다
  lexicon: HALOT
  rationale: 사역형 의미를 자연스럽게 살리면서도, 군주 즉위 맥락에 맞는 한국어로 옮겼습니다.
