revisions:
- from: 새해가 돌아올 무렵에 바벨론 왕 느부갓네살이 사람을 보내 그를 바벨론으로 끌고 갔습니다. 또한 야훼의 집의 귀한 그릇들을 함께 가져갔습니다. 그리고 그의 형제를 유다와 예루살렘의 왕으로 세웠습니다.[a][b][c]
  to: 해가 돌아올 때에[a] 느부갓네살 왕이 사람을 보내어 그를 야훼의 집의 귀한 그릇들[b]과 함께 바벨론으로 데려갔습니다. 그리고 그의 형제[c] 시드기야를 유다와 예루살렘을 다스릴 왕으로 세웠습니다.
  rationale: 시드기야를 명시하여 원문의 필수 정보를 복원했습니다. 시간 표현은 특정한 ‘새해’로 좁히지 않고 원문의 관용적 모호성을 보존했습니다. ‘사람을 보내어 … 데려갔습니다’는 שָׁלַח와 사역형 וַיְבִאֵהוּ의 연속을 자연스러운 한국어로 반영하며, ‘그의 형제’는 본문에 보존하고 역사적 관계는 주석으로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:17Z'
