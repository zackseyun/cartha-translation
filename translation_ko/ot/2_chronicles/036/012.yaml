translation:
  language: ko
  text: 그는 그의 하나님 야훼 보시기에 악한 일을 하였고, 야훼의 입에서 나온 말씀을 전한 예언자 예레미야[a] 앞에서 스스로 낮추지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘야훼의 입에서 말한 예레미야 예언자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악한 일을 하였고
  alternatives_korean:
  - 악을 행하였고
  - 악한 것을 하였고
  lexicon: HALOT
  rationale: עשה הרע의 관용적 평가를 한국어에서 자연스럽게 살리되, 반복되는 ‘행하다’보다 서술 흐름이 매끄러운 ‘악한 일을 하다’를 택했습니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 보시기에
  alternatives_korean:
  - 눈에
  - 눈앞에
  lexicon: HALOT
  rationale: ‘~의 눈에/보시기에’는 평가 기준을 나타내는 히브리어 관용구를 직접 반영하며, 왕하·대하 문맥의 판정 표현을 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름을 관례적 대체어가 아니라 고유명 ‘야훼’로 옮겨, 원문의 언약적 호칭을 유지했습니다.
- source_word: לֹא נִכְנַע
  english_pob_choice: he did not humble himself
  chosen_korean: 스스로 낮추지 않았습니다
  alternatives_korean:
  - 겸손해지지 않았습니다
  - 자기를 낮추지 않았습니다
  lexicon: HALOT
  rationale: נכנע의 수동형을 단순 상태가 아니라 반성적 태도 거부로 이해해, 대하의 도덕적 책임감을 드러내는 ‘스스로 낮추다’로 옮겼습니다.
- source_word: מִפִּי יְהוָה
  english_pob_choice: who spoke from the mouth of Yahweh
  chosen_korean: 야훼의 입에서 말한 이
  alternatives_korean:
  - 야훼의 입으로 말한 이
  - 야훼께로부터 말한 이
  lexicon: HALOT
  rationale: ‘입’ 이미지를 보존해 예언 전달의 직접성을 살렸고, 관계절로 처리해 예레미야를 수식하도록 했습니다.
theological_decisions:
- issue: 예언자 발화의 매개성
  chosen_reading: ‘야훼의 입에서 말한 이’로 예언이 하나님의 직접 발화에 근거한 중개 메시지임을 드러냈습니다.
  alternative_readings:
  - ‘야훼의 말씀으로 말한 이’
  - ‘야훼의 명령에 따라 말한 이’
  rationale: 원문은 단순 출처 표기가 아니라 ‘입’이라는 신체 은유로 예언의 권위를 강조하므로, 이를 약화시키지 않는 번역을 유지했습니다.
  doctrine_reference: Prophetic speech mediation in the Hebrew Bible
