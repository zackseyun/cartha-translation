source:
  edition: WLC
  text: לְ/מַלֹּ֤אות דְּבַר יְהוָה֙ בְּ/פִ֣י יִרְמְיָ֔הוּ עַד רָצְתָ֥ה הָ/אָ֖רֶץ אֶת שַׁבְּתוֹתֶ֑י/הָ כָּל יְמֵ֤י הָשַּׁמָּ/ה֙ שָׁבָ֔תָה לְ/מַלֹּ֖אות שִׁבְעִ֥ים שָׁנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
  footnotes:
  - marker: a
    text: Or 'through Jeremiah.' Literally, 'by the mouth of Yirmeyahu.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had accepted' or 'had made up for' its Sabbaths; the sense is that the land received the sabbatical rest it had been denied.
    reason: lexical_alternative
  - marker: c
    text: This wording echoes the covenant warnings about the land enjoying its sabbaths during exile (see Lev 26:34–35).
    reason: cross_reference
  - marker: d
    text: 'Or ''it rested.'' The Hebrew keeps the Sabbath/rest wordplay: ''its Sabbaths ... it kept Sabbath.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야의 입을 통한 야훼의 말씀을 이루려고, 이 땅이 자기의 안식일들을 누릴 때까지 — 온전한 황폐의 모든 날 동안 그것이 안식하였으니 — 칠십 년을 이루려는 것이었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예레미야를 통해.’ 직역하면 ‘예레미야의 입으로.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기의 안식일들을 받아들였다’ 혹은 ‘보상하였다.’ 뜻은 땅이 그동안 빼앗겼던 안식의 휴식을 되돌려 받았다는 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 포로기 동안 땅이 자기의 안식일들을 누린다는 언약 경고를 떠올리게 합니다(레 26:34–35).
    reason: cross_reference
  - marker: d
    text: 또는 ‘그것이 쉬었다.’ 히브리어는 ‘안식일들… 안식하다’의 말장난을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלֹּאות דְּבַר יְהוָה
  english_pob_choice: to fulfill the word of Yahweh
  chosen_korean: 야훼의 말씀을 이루려고
  alternatives_korean:
  - 야훼의 말씀을 성취하려고
  - 야훼의 말씀을 완수하려고
  lexicon: HALOT
  rationale: לְמַלֹּאות의 목적 용법을 살려 결과가 아니라 의도된 성취를 나타내는 한국어 ‘이루다’ 계열로 옮겼습니다.
- source_word: בְּפִי יִרְמְיָהוּ
  english_pob_choice: by the mouth of Yirmeyahu
  chosen_korean: 예레미야의 입을 통한
  alternatives_korean:
  - 예레미야를 통해
  - 예레미야의 입으로
  lexicon: HALOT
  rationale: 예언적 발화의 관용구를 살리되 한국어 문장으로는 ‘입을 통한’이 가장 자연스럽고 원문의 상징성을 유지합니다.
- source_word: רָצְתָה הָאָרֶץ אֶת שַׁבְּתוֹתֶיהָ
  english_pob_choice: until the land had enjoyed its Sabbaths
  chosen_korean: 이 땅이 자기의 안식일들을 누릴 때까지
  alternatives_korean:
  - 이 땅이 자기의 안식일들을 받았을 때까지
  - 이 땅이 자기의 안식일들을 채웠을 때까지
  lexicon: HALOT
  rationale: ‘안식일들’의 복수를 유지해 레위기적 토지 안식 개념을 드러내고, רצה의 수동적 수혜 뉘앙스는 ‘누리다’로 자연스럽게 살렸습니다.
- source_word: שָׁבָתָה
  english_pob_choice: it kept Sabbath
  chosen_korean: 그것이 안식하였으니
  alternatives_korean:
  - 그것이 안식일을 지켰으니
  - 그것이 쉬었으니
  lexicon: HALOT
  rationale: 히브리어의 동사-명사 어근 연결을 살리면서도 한국어에서는 반복을 과도하게 드러내지 않도록 ‘안식하다’로 옮겼습니다.
- source_word: שִׁבְעִים שָׁנָה
  english_pob_choice: to fulfill seventy years
  chosen_korean: 칠십 년을 이루려는 것이었습니다
  alternatives_korean:
  - 칠십 년을 채우려는 것이었습니다
  - 칠십 년이 성취되게 하려는 것이었습니다
  lexicon: HALOT
  rationale: 앞의 ‘이루다’와 병렬을 이루게 하여, 예레미야적 기간의 성취라는 구조를 한국어로도 분명히 드러냅니다.
theological_decisions:
- issue: 야훼의 말씀과 예레미야의 예언 사이의 매개 표현
  chosen_reading: 예레미야의 입을 통한 야훼의 말씀
  alternative_readings:
  - 야훼께서 예레미야를 통해 하신 말씀
  - 예레미야의 입으로 나온 야훼의 말씀
  rationale: 직역에 가까운 ‘입을 통한’ 표현을 유지해 예언이 단순한 인간 발언이 아니라 신적 계시의 매개라는 점을 보존했습니다.
  doctrine_reference: 예언적 영감과 말씀 전달의 매개성
