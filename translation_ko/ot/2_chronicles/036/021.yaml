  text: לְ/מַלֹּ֤אות דְּבַר יְהוָה֙ בְּ/פִ֣י יִרְמְיָ֔הוּ עַד רָצְתָ֥ה הָ/אָ֖רֶץ אֶת שַׁבְּתוֹתֶ֑י/הָ כָּל יְמֵ֤י הָשַּׁמָּ/ה֙ שָׁבָ֔תָה לְ/מַלֹּ֖אות שִׁבְעִ֥ים שָׁנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
  footnotes:
  - marker: a
    text: Or 'through Jeremiah.' Literally, 'by the mouth of Yirmeyahu.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had accepted' or 'had made up for' its Sabbaths; the sense is that the land received the sabbatical rest it had been denied.
    reason: lexical_alternative
  - marker: c
    text: This wording echoes the covenant warnings about the land enjoying its sabbaths during exile (see Lev 26:34–35).
    reason: cross_reference
  - marker: d
    text: 'Or ''it rested.'' The Hebrew keeps the Sabbath/rest wordplay: ''its Sabbaths ... it kept Sabbath.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야의 입을 통하여 전해진 야훼의 말씀을 이루기 위하여, 땅이 자기 안식일들을 누릴 때까지[b][c], 곧 황폐해져 있던 모든 날 동안 안식하여[d] 칠십 년을 채우게 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예레미야를 통해.’ 직역하면 ‘예레미야의 입으로.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기의 안식일들을 받아들였다’ 또는 ‘자기의 안식일들을 보상받았다.’ 땅이 그동안 누리지 못했던 안식의 휴식을 받았다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 포로 기간에 땅이 자기 안식일들을 누릴 것이라는 언약의 경고를 떠올리게 합니다(레 26:34–35).
    reason: cross_reference
  - marker: d
    text: 또는 ‘쉬었다.’ 히브리어는 ‘안식일들 … 안식하다’라는 어근의 연결을 유지합니다.
    reason: lexical_alternative
