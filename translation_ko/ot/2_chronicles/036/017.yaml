- from: 그리하여 그분께서 갈대아 사람의 왕[a]을 그들 위에 올라오게 하셔서, 그들의 젊은이들을 성소의 집에서 칼로 죽이게 하셨습니다. 그분께서는 젊은 남자나 처녀[c], 노인이나 백발 노인[b]을 불쌍히 여기지 않으셨습니다. 그분께서 그 모든 것을 그의 손에 넘기셨습니다.
  to: 그리하여 그분께서 갈대아인들의 왕[a]을 그들을 치러 올라오게 하셨습니다. 그가 그들의 젊은이들을 그들의 성전에서 칼로 죽였고, 젊은 남자나 처녀[c], 노인이나 아주 늙은 이를 불쌍히 여기지 않았습니다[b] 그분께서 모든 것을 그의 손에 넘기셨습니다.
  rationale: 하나님께서 갈대아 왕을 오게 하신 행위와 그 왕이 살육하고 자비를 보이지 않은 행위를 별개의 절로 표현하여 원문의 문법적 주체를 보존했습니다. ‘그들을 치러’는 עֲלֵיהֶם의 군사적 방향성을 자연스럽게 드러냅니다. 용어와 각주 앵커도 현대 표준어 및 해당 히브리어 어휘에 맞추어 정리했습니다.
