source:
  edition: WLC
  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
  footnotes:
  - marker: a
    text: Or 'the king of the Babylonians'; Hebrew 'Chaldeans.'
    reason: lexical_alternative
  - marker: b
    text: Or 'did not spare.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'virgin,' specifically a young unmarried woman.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그분께서 갈대아인들의 왕[a]을 그들을 치러 올라오게 하셨습니다. 그가 그들의 젊은이들을 그들의 성전에서 칼로 죽였고, 젊은 남자나 처녀[c], 노인이나 아주 늙은 이를 불쌍히 여기지 않았습니다[b] 그분께서 모든 것을 그의 손에 넘기셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바빌론 왕’일 수 있으나, 히브리어는 ‘갈대아인들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아끼지 않았습니다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘처녀’는 특히 미혼의 젊은 여성을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ כשדיים
  english_pob_choice: the king of the Chaldeans
  chosen_korean: 갈대아 사람의 왕
  alternatives_korean:
  - 바빌론 왕
  - 갈대아 왕
  lexicon: HALOT
  rationale: 히브리어 כשדיים을 직역해 ‘갈대아 사람’으로 살리되, 한국어에서 자연스러운 속격 구조로 옮겼습니다. POB의 각주처럼 ‘바빌론 왕’도 가능하지만, 본문은 원어 명칭을 우선 반영합니다.
- source_word: בְּבֵית מִקְדָּשָׁם
  english_pob_choice: in the house of their sanctuary
  chosen_korean: 성소의 집에서
  alternatives_korean:
  - 그들의 성전에서
  - 그들의 성소 집에서
  lexicon: HALOT
  rationale: 직역의 ‘성소의 집’ 구조를 유지해 성소가 더럽혀진 장소감을 살렸습니다. ‘성전’은 뜻은 자연스럽지만 원어 표현의 결을 약간 일반화합니다.
- source_word: וְלֹא חָמַל
  english_pob_choice: had no compassion
  chosen_korean: 불쌍히 여기지 않으셨습니다
  alternatives_korean:
  - 아끼지 않으셨습니다
  - 가엾게 여기지 않으셨습니다
  - 용서하지 않으셨습니다
  lexicon: HALOT
  rationale: חמל은 단순한 절약보다 자비의 결핍을 뜻하므로, ‘불쌍히 여기다’로 감정적·윤리적 무감을 드러냈습니다. ‘아끼지 않다’도 가능하지만 정서적 뉘앙스는 약합니다.
- source_word: בָּחוּר וּבְתוּלָה זָקֵן וְיָשֵׁשׁ
  english_pob_choice: young man or virgin, old man or aged man
  chosen_korean: 젊은 남자나 처녀, 노인이나 백발 노인
  alternatives_korean:
  - 청년이나 처녀, 노인이나 매우 늙은 사람
  - 젊은이와 처녀, 노인과 연로한 사람
  lexicon: HALOT
  rationale: בְּתוּלָה는 단순한 ‘젊은 여자’가 아니라 ‘처녀’이므로 성적·사회적 상태를 보존했습니다. זָקֵן וְיָשֵׁשׁ의 중첩은 연령 범주를 강화하므로 ‘노인이나 백발 노인’으로 차이를 드러냈습니다.
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  english_pob_choice: He gave all into his hand
  chosen_korean: 그 모든 것을 그의 손에 넘기셨습니다
  alternatives_korean:
  - 모든 것을 그의 손에 주셨습니다
  - 그 모든 것을 그의 손에 맡기셨습니다
  lexicon: HALOT
  rationale: ‘손에 넘기다’는 성서적 관용구인 ‘권한/지배 아래에 넘기다’를 자연스럽게 살립니다. 목적어를 ‘그 모든 것’으로 두어 히브리어의 포괄성을 반영했습니다.
theological_decisions:
- issue: 앞뒤 동사의 주어가 여호와를 가리키는지 여부
  chosen_reading: 주어를 명시적으로 ‘그분께서’로 이어, 앞 문맥의 하나님의 심판 행위를 계속 드러냈습니다.
  alternative_readings:
  - 주어를 생략해 수동적 사건처럼 처리할 수 있음
  - ‘그가’로 단순 지시할 수 있음
  rationale: 히브리어는 전후 문맥상 여호와의 심판 행위를 계속하는 3인칭 남성 단수입니다. 한국어에서는 신학적 주체를 흐리지 않기 위해 존대 표현과 함께 명시적으로 연결했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘מִקְדָּשׁ’ 계열 표현의 번역 톤
  chosen_reading: ‘성소의 집’으로 옮겨 성전 파괴의 신성모독성을 직접 드러냈습니다.
  alternative_readings:
  - ‘성전’으로 완화된 표현
  - ‘거룩한 집’
  rationale: 원어의 결합어는 단순한 건물보다 거룩한 소속을 강조합니다. 전통적 ‘성전’도 가능하지만, 본문이 말하는 모욕의 강도를 살리기 위해 더 직역적인 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1
