  rationale: 바로 뒤의 ‘그의 예언자들’과 병렬되므로 하늘 존재가 아니라 선지자적 경고를 전한 인간 사절로 읽는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 문맥 우선 원칙; 2 Chr 36:15-16의 선지자적 경고 구조
