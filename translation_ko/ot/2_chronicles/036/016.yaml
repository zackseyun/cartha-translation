  rationale: 프로젝트 기본값과 원문 보존 원칙에 따라 신명은 ‘야훼’로 직접 옮겨, 심판 주체의 고유명을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
