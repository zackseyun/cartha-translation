  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
  footnotes:
  - marker: a
    text: Or 'the angels of God'; here the context strongly favors 'messengers,' that is, God's human envoys, because the next clause speaks of 'his prophets.'
    reason: lexical_alternative
  - marker: b
    text: Or 'until there was no healing' or 'until it was beyond cure.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 하나님의 사자들을 계속 조롱하며, 그의 말씀을 업신여기고, 그의 예언자들을 비웃었습니다. 마침내 야훼의 분노가 그의 백성에게 일어나, 더는 치료할 수 없게 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님의 사자들’은 여기서 천사들보다 인간적 전령을 가리키는 것으로 보는 것이 문맥에 더 맞습니다.
    reason: source_note
  - marker: b
    text: 히브리어 표현은 문자적으로 ‘치료 없음’이지만, 뜻은 ‘더는 회복할 길이 없음’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְעִבִים
  english_pob_choice: mocking
  chosen_korean: 조롱하며
  alternatives_korean:
  - 비웃으며
  - 희롱하며
  lexicon: HALOT
  rationale: 모욕적이고 경멸적인 반복 행위를 자연스럽게 드러내며, 뒤의 ‘비웃다’와도 의미가 겹치지 않게 조정했습니다.
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  english_pob_choice: the messengers of God
  chosen_korean: 하나님의 사자들을
  alternatives_korean:
  - 하나님의 천사들을
  - 하나님의 전령들을
  lexicon: HALOT
  rationale: 문맥상 ‘예언자들’과 평행을 이루므로 천사보다 인간 전령의 뜻을 살렸고, 한국어 성경에서 익숙한 ‘사자’로 옮겼습니다.
- source_word: דְּבָרָיו
  english_pob_choice: his words
  chosen_korean: 그의 말씀을
  alternatives_korean:
  - 그의 말들을
  - 그의 말을
  lexicon: HALOT
  rationale: 히브리어 복수형의 직역 가능성은 있으나, 하나님이 전하신 계시를 가리키는 문맥이므로 한국어에서는 단수적 집합명사 ‘말씀’을 쓰는 것이 더 자연스럽습니다.
- source_word: וּמִתַּעְתְּעִים
  english_pob_choice: scoffing at
  chosen_korean: 비웃고
  alternatives_korean:
  - 조롱하고
  - 희롱하고
  lexicon: HALOT
  rationale: 앞의 ‘조롱하다’와 함께 삼중 병렬의 강도를 유지하되, 여기서는 반복을 피하려고 ‘비웃다’로 구분했습니다.
- source_word: חֲמַת יְהוָה
  english_pob_choice: the wrath of Yahweh
  chosen_korean: 야훼의 분노
  alternatives_korean:
  - 야훼의 진노
  - 야훼의 노
  lexicon: HALOT
  rationale: 하나님의 심판적 분노를 가리키므로 ‘분노’로 옮기되, 프로젝트 기본값에 따라 신명은 ‘야훼’로 유지했습니다.
- source_word: עַד לְאֵין מַרְפֵּא
  english_pob_choice: until there was no remedy
  chosen_korean: 더는 치료할 수 없게
  alternatives_korean:
  - 더는 치유책이 없게
  - 도무지 회복할 길이 없게
  lexicon: HALOT
  rationale: 제재가 더 이상 불가능해진 최종 상태를 한국어로 자연스럽게 풀어, 문자적 ‘치료’와 의미상 ‘회복 불가’를 함께 드러냈습니다.
theological_decisions:
- issue: מַלְאֲכֵי הָאֱלֹהִים의 의미
  chosen_reading: 하나님의 사자들, 곧 인간적 전령/사절
  alternative_readings:
  - 천사들
  - 하나님의 사자들
  rationale: 바로 뒤의 ‘그의 예언자들’과 병렬되므로 하늘 존재가 아니라 선지자적 경고를 전한 인간 사절로 읽는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 문맥 우선 원칙; 2 Chr 36:15-16의 선지자적 경고 구조
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값과 원문 보존 원칙에 따라 신명은 ‘야훼’로 직접 옮겨, 심판 주체의 고유명을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
