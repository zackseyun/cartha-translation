base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
  footnotes:
  - marker: a
    text: Or 'the angels of God'; here the context strongly favors 'messengers,' that is, God's human envoys, because the next clause speaks of 'his prophets.'
    reason: lexical_alternative
  - marker: b
    text: Or 'until there was no healing' or 'until it was beyond cure.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 하나님의 사자들[a]을 계속 조롱하고, 그의 말씀을 업신여기며, 그의 예언자들을 비웃었습니다. 야훼의 분노가 그의 백성을 향하여 일어나, 더는 회복할 길이 없게 될 때까지 그러했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님의 사자들’은 ‘하나님의 천사들’로도 옮길 수 있습니다. 그러나 바로 뒤의 ‘그의 예언자들’과의 문맥상, 여기서는 하나님의 인간 전령들을 가리키는 것으로 보는 것이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 직역하면 ‘치유(또는 회복)가 없음’입니다. 문맥상 더는 회복하거나 바로잡을 길이 없다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְעִבִים
  english_pob_choice: mocking
  chosen_korean: 조롱하며
  alternatives_korean:
