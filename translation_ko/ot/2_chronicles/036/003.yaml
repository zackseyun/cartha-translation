base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
  footnotes:
  - marker: a
    text: Or 'deposed him'; the Hebrew verb can mean to remove someone from position or to take him away.
    reason: alternative_reading
  - marker: b
    text: Or 'imposed a fine on the land'; the verb refers to levying a monetary penalty.
    reason: lexical_alternative
  - marker: c
    text: A talent was a large unit of weight; the text preserves the ancient measure rather than converting it.
    reason: cultural_note
translation:
  language: ko
  text: 이집트 왕은 예루살렘에서 그를 물러나게 하고[a] 그 땅에 은 백 달란트와 금 한 달란트를 벌과금으로 부과했습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 폐위시키고” 또는 “그를 데려가 버리고”; 이 동사는 직위에서 물러나게 하거나 데려가 버리는 뜻을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “그 땅에 벌금을 부과했습니다”; 이 동사는 금전적 벌과금을 매기는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 달란트는 고대의 중량 단위입니다. 본문은 이를 현대 단위로 바꾸지 않고 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  english_pob_choice: deposed him
  chosen_korean: 그를 예루살렘에서 끌어내리고
  alternatives_korean:
  - 그를 폐위하고
  - 그를 제거하고
  - 그를 끌어내리고
  lexicon: HALOT
  rationale: 히브리어 הסיר의 사역형은 단순히 '없애다'보다 권력 자리에서 물러나게 하거나 데려가 버리는 뜻이 있어, 왕권 상실과 강제 이송을 함께 드러내는 표현으로 옮겼습니다.
- source_word: וַיַּעֲנֹשׁ
  english_pob_choice: imposed ... a tribute
  chosen_korean: 조공을 부과했습니다
  alternatives_korean:
  - 벌금을 부과했습니다
  - 벌을 내렸습니다
  - 과징금을 매겼습니다
  lexicon: HALOT
  rationale: 문맥상 단순 처벌이 아니라 금액을 정해 강제로 거둬들인 재정적 부과이므로, 현대 한국어에서 자연스럽고 의미를 살리는 '조공을 부과했습니다'로 옮겼습니다.
- source_word: מֵאָה כִכַּר כֶּסֶף / וְכִכַּר זָהָב
  english_pob_choice: a hundred talents of silver and a talent of gold
  chosen_korean: 은 백 달란트와 금 한 달란트
  alternatives_korean:
  - 은 일백 달란트와 금 한 달란트
  - 은 백 달란트와 금 한 달란트의 세금
  lexicon: HALOT
  rationale: כִּכָּר는 고대 중량 단위이므로 달란트를 그대로 유지했고, כסף/זהב의 재질은 한국어에서도 자연스럽게 앞세워 재정 부담의 성격을 분명히 했습니다.
- source_word: מֶלֶךְ מִצְרַיִם
  english_pob_choice: the king of Egypt
  chosen_korean: 이집트 왕
  alternatives_korean:
  - 애굽 왕
  - 이집트의 왕
  lexicon: HALOT
  rationale: 본문은 이름이 아니라 칭호를 사용하므로, 현대 표준어에서 직관적인 '이집트 왕'으로 옮겨 역사적 지시를 유지했습니다.
