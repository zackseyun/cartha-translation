  text: בֶּן שְׁמוֹנֶ֤ה שָׁנִים֙ יְהוֹיָכִ֣ין בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֤ה חֳדָשִׁים֙ וַ/עֲשֶׂ֣רֶת יָמִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
  footnotes:
  - marker: a
    text: 2 Kings 24:8 reads 'eighteen years old' instead of 'eight years old.'
    reason: textual_variant
translation:
  language: ko
  text: 여호야긴은 왕위에 오를 때에 여덟 살이었고, 예루살렘에서 석 달 열흘 동안 다스렸습니다. 그는 야훼의 눈에 악한 일을 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2열왕기 24:8은 ‘여덟 살’ 대신 ‘열여덟 살’로 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  english_pob_choice: was eight years old
  chosen_korean: 여덟 살이었고
  alternatives_korean:
  - 여덟 해 된 아들이었고
  - 여덟 살 된 아들이었고
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 자연스러운 현대 한국어로 풀어 옮기되, 단순한 직역보다 연령 표현인 ‘여덟 살’을 살렸습니다.
- source_word: בְּמָלְכֹו
  english_pob_choice: when he began to reign
  chosen_korean: 왕위에 오를 때에
  alternatives_korean:
  - 다스리기 시작할 때에
  - 왕이 되었을 때에
  lexicon: HALOT
  rationale: 즉위 시점을 나타내는 문맥이므로, ‘begin to reign’의 시간을 한국어 관용으로 분명하게 드러냈습니다.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  english_pob_choice: three months and ten days
  chosen_korean: 석 달 열흘 동안
  alternatives_korean:
  - 세 달과 열흘 동안
  - 세 달 열흘 동안
  lexicon: HALOT
  rationale: 기간 표현을 한국어에서 가장 자연스럽고 간결하게 제시하되, 원문의 총기간을 정확히 보존했습니다.
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악한 일을 행했습니다
  alternatives_korean:
  - 악을 행했습니다
  - 악을 저질렀습니다
  lexicon: HALOT
  rationale: 열왕기·역대기에서 반복되는 평가 관용구로서, 결과를 완곡하게 풀기보다 ‘악한 일을 행하다’로 원문의 평가성을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 텔트라그라마톤은 신적 고유명 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 2 Kings 24:8과의 연대 충돌을 어떻게 다룰 것인가
  chosen_reading: 본문의 ‘여덟 살’ 표기를 본문에 그대로 두고, 각주로 2열왕기 24:8의 ‘열여덟 살’ 이문을 알립니다.
  alternative_readings:
  - 열여덟 살로 조정
  - 본문과 조화시키기 위해 수정
  rationale: 번역은 주어진 स्रोत 본문을 우선해야 하므로, 조화시키지 않고 문헌상 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙 및 문헌 간 긴장 보존
