    rationale: אָצָרוֹת의 ‘보물들/보물창고들’ 어휘 대안은 야훼의 집의 보물들을 가리키므로, 독자가 대상 어휘를 즉시 알 수 있도록 그 직후에 두는 것이 좋습니다.
