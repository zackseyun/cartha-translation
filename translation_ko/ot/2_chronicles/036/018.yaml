  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 יְהוָה는 ‘야훼’로 옮기고, מקור의 소유격 구조를 그대로 살렸습니다.
- source_word: וְשָׂרָי/ו
  english_pob_choice: and of his officials
  chosen_korean: 그의 관리들의 보물들
