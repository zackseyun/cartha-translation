  rationale: מכלול의 성전 기구를 가리키므로 ‘기물’이 가장 포괄적이고, ‘모든’으로 וְכֹל의 총괄 의미를 살렸습니다.
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
