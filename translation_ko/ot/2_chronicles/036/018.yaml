base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the treasures''; the term can also mean ''treasuries'' or ''storehouses.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'the treasures of the king and his princes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 집의 모든 기물, 큰 것과 작은 것, 야훼의 집의 보물들[a], 왕과 그의 관리들의 보물들[b], 이 모든 것을 그가 바빌론으로 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘보물들’은 문맥에 따라 ‘보물창고들’ 또는 ‘저장고들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘관리들’은 ‘고관들’로도 옮길 수 있습니다.
    reason: lexical_alternative
