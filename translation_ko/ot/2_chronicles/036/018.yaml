  lexicon: HALOT
  rationale: 크기 대비의 관용적 대구이므로 한국어에서는 ‘큰 것과 작은 것’이 자연스럽고, 물건 목록의 문맥에 맞습니다.
- source_word: בֵּית יְהוָה
