  - 그의 고관들의 보물들
  lexicon: HALOT
  rationale: שָׂרִים는 문맥상 왕의 공식적 관리·관료를 가리키므로, 현대 독자가 이해하기 쉬운 ‘관리들’로 옮겼습니다.
- source_word: הֵבִיא
  english_pob_choice: he brought
