base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the treasures''; the term can also mean ''treasuries'' or ''storehouses.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'the treasures of the king and his princes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 집의 모든 기물, 큰 것과 작은 것, 그리고 야훼의 집의 보물들과 왕의 보물들과 그의 관리들의 보물들을 모두 바빌론으로 가져갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘보물들’로 되어 있으며, 문맥에 따라 ‘보물창고들’ 또는 ‘저장고들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕과 그의 고관들의 보물들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  english_pob_choice: the vessels of the house of God
  chosen_korean: 하나님의 집의 모든 기물
