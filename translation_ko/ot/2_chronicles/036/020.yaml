id: 2CH.36.20
reference: 2 Chronicles 36:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֶּ֛גֶל הַ/שְּׁאֵרִ֥ית מִן הַ/חֶ֖רֶב אֶל בָּבֶ֑ל וַֽ/יִּהְיוּ ל֤/וֹ וּ/לְ/בָנָי/ו֙ לַ/עֲבָדִ֔ים עַד מְלֹ֖ךְ מַלְכ֥וּת פָּרָֽס־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became slaves to him and to his sons until the reign of the kingdom of Persia.
  footnotes:
  - marker: a
    text: Or 'servants.' The Hebrew term can denote either servants or slaves, but here the context of conquest and exile favors 'slaves.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 바벨론으로 그 칼을 피한 남은 자들을 포로로 끌고 가니, 그들은 바벨론 왕국의 통치가 시작될 때까지 그와 그의 아들들의 노예가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '종들.' 히브리어는 '종들' 또는 '노예들'을 뜻할 수 있으나, 정복과 포로의 맥락이므로 여기서는 '노예들'이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  english_pob_choice: He carried into exile
  chosen_korean: 포로로 끌고 가니
  alternatives_korean:
  - 바벨론으로 유배시키니
  - 바벨론으로 끌어가니
  lexicon: HALOT
  rationale: 가לה의 강제 이주/포로화 의미를 살리면서, 한국어에서 자연스럽고 서술적입니다. '유배'보다 전쟁 포로의 강제성을 더 분명히 드러냅니다.
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  english_pob_choice: the remnant who had escaped the sword
  chosen_korean: 그 칼을 피한 남은 자들
  alternatives_korean:
  - 칼에서 살아남은 남은 자들
  - 칼을 면한 남은 자들
  lexicon: HALOT
  rationale: '''남은 자들''은 שְׁאֵרִית의 핵심 의미를 보존하고, ''칼을 피한''은 전쟁과 학살의 맥락을 한국어로 자연스럽게 풉니다.'
- source_word: לַעֲבָדִים
  english_pob_choice: slaves
  chosen_korean: 노예가
  alternatives_korean:
  - 종이
  - 종속된 자가
  lexicon: HALOT
  rationale: 정복과 강제 이주 이후의 종속 상태를 가리키므로, EN POB의 판단을 따라 '노예'를 사용해 강제성과 예속을 분명히 했습니다.
- source_word: מְלֹךְ מַלְכוּת פָּרָס
  english_pob_choice: until the reign of the kingdom of Persia
  chosen_korean: 바벨론 왕국의 통치가 시작될 때까지
  alternatives_korean:
  - 페르시아 왕국의 통치가 시작될 때까지
  - 페르시아 제국이 다스리기 시작할 때까지
  lexicon: HALOT
  rationale: 히브리어는 페르시아의 통치 개시 시점을 가리키는 시간 표현입니다. 한국어에서는 '통치가 시작될 때까지'가 가장 자연스럽고, 문맥상 바벨론에 대한 종속의 종결점을 분명히 보여 줍니다.
theological_decisions:
- issue: עֲבָדִים의 번역에서 servant/slave 구분
  chosen_reading: 노예
  alternative_readings:
  - 종
  - 일꾼
  rationale: 이 절은 전쟁 포로와 정복 이후의 강제 지배를 묘사하므로, 단순한 봉사자를 뜻하는 '종'보다 예속 상태를 드러내는 '노예'가 본문의 폭력적 현실을 더 정확히 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1; contested terms table on servile status
- issue: 주어의 지시
  chosen_reading: 그가
  alternative_readings:
  - 그 왕이
  - 느부갓네살이
  rationale: 앞절의 바벨론 왕을 이어 받는 지시이므로, 본문 내 연결을 유지해 대명사로 처리했습니다. 한국어 문맥상 명시적 고유명사를 반복하지 않아도 의미가 분명합니다.
  doctrine_reference: 문맥 지시어 처리 원칙
