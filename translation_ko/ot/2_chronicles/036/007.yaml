source:
  edition: WLC
  text: וּ/מִ/כְּלֵי֙ בֵּ֣ית יְהוָ֔ה הֵבִ֥יא נְבוּכַדְנֶאצַּ֖ר לְ/בָבֶ֑ל וַ/יִּתְּנֵ֥/ם בְּ/הֵיכָל֖/וֹ בְּ/בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
  footnotes:
  - marker: a
    text: Or 'his palace,' since the Hebrew word can refer to either a temple or a palace depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 느부갓네살은 또 야훼의 집 기물들 가운데 일부를 바빌론으로 가져가서, 바빌론에 있는 자기 신전에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헤이칼(הֵיכָל)은 문맥에 따라 ‘신전’ 또는 ‘궁전’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִכְּלֵי
  english_pob_choice: also brought some of the vessels
  chosen_korean: 그릇들 가운데서 일부를 가져다가
  alternatives_korean:
  - 그리고 그릇들 가운데서 가져다가
  - 또 그릇들 중 일부를 가져다가
  - 그릇들에서 일부를 가져다가
  lexicon: HALOT
  rationale: וּ와 מִן의 결합이 단순한 병렬보다 ‘일부를 떼어 옮김’의 뉘앙스를 담으므로, 한국어에서는 ‘가운데서 일부를’로 부분성을 분명히 살렸습니다.
- source_word: בֵּית יְהוָה / יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  - 하나님의 집
  lexicon: HALOT
  rationale: 본문의 מוכנה ‘YHWH’는 프로젝트 기본값에 따라 야훼로 옮기고, בֵּית יְהוָה는 직역해 ‘야훼의 집’으로 유지했습니다.
- source_word: הֵיכָל
  english_pob_choice: his temple
  chosen_korean: 자기 궁전의 신전
  alternatives_korean:
  - 자기 궁전
  - 자기 성전
  - 자기 궁의 신전
  lexicon: HALOT
  rationale: הֵיכָל은 문맥에 따라 신전/궁전이 모두 가능하지만, POB의 주석처럼 여기서는 ‘temple’ 의미를 살리면서도 문맥상 느부갓네살의 건물을 분명히 하기 위해 ‘자기 궁전의 신전’으로 옮겼습니다.
- source_word: וַיִּתְּנֵם
  english_pob_choice: and put them
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 두어 놓았습니다
  - 배치했습니다
  lexicon: HALOT
  rationale: 기명들을 어떤 장소에 ‘두다/놓다’는 평이한 동작이므로, 현대 문체에 맞게 간결한 ‘두었습니다’를 택했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 방침에 따라 신적 고유명사는 대체 호칭이 아니라 음역으로 보존해, 언약 이름의 직접성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: הֵיכָל의 의미 범위
  chosen_reading: 이 문맥에서는 바빌론의 종교적 건물인 ‘신전’으로 이해했습니다.
  alternative_readings:
  - 궁전
  - 궁전 안의 방
  rationale: 성전 기명들을 보관하는 장소라는 점에서 단순한 왕궁보다 예배적/제의적 공간을 가리키는 ‘신전’이 문맥에 더 잘 맞습니다.
  doctrine_reference: POB audit trail lexical decision on הֵיכָל
