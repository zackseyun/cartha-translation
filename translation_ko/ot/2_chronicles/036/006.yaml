base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/006.yaml
  text: Nebuchadnezzar king of Babylon came up against him and bound him with bronze chains to take him to Babylon[a].
  footnotes:
  - marker: a
    text: Or 'with bronze fetters' or 'with bronze shackles.' The Hebrew refers to bronze restraints placed on him.
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨론 왕 느부갓네살이 그에게 올라와서 그를 놋 사슬로 묶어 바벨론으로 데려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘놋 사슬’은 본문의 구속 수단을 자연스럽게 드러낸 번역이며, 히브리어는 놋으로 된 결박 도구를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  english_pob_choice: came up against him
  chosen_korean: 그에게 올라와서
  alternatives_korean:
  - 그를 치러 올라와서
  - 그를 향해 올라와서
  - 그에게 맞서 올라와서
  lexicon: HALOT
  rationale: 전쟁 문맥의 עָלָה עַל은 단순 이동보다 적대적 접근을 뜻하므로, 직접적이면서도 과장되지 않게 ‘올라와서’로 옮겼습니다.
- source_word: נְבוּכַדְנֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
  alternatives_korean:
  - 느부갓네살르
  - 네부카드네자르
  lexicon: 표준 외래어 표기 관행
  rationale: 본 인명은 한국어 성경에서 널리 정착된 형태인 ‘느부갓네살’을 사용했습니다.
- source_word: וַיַּאַסְרֵהוּ
  english_pob_choice: bound him
  chosen_korean: 그를 ... 묶어
  alternatives_korean:
  - 그를 결박하여
  - 그를 포박하여
  - 그를 속박하여
  lexicon: HALOT
  rationale: אָסַר는 포박·결박의 의미를 가지므로, 사슬과 연결되는 동작을 자연스럽게 드러내는 ‘묶어’가 가장 직접적입니다.
- source_word: בַּנְחֻשְׁתַּיִם
  english_pob_choice: with bronze chains
  chosen_korean: 놋 사슬로
  alternatives_korean:
  - 놋 족쇄로
  - 놋 쇠사슬로
  - 청동 사슬로
  lexicon: HALOT
  rationale: 히브리어는 놋으로 된 구속 도구를 가리키므로, 전통적이면서도 이해하기 쉬운 ‘놋 사슬’로 옮겼습니다. 영어 POB의 ‘bronze chains’와 대응됩니다.
- source_word: לְהֹלִיכוֹ בָּבֶלָה
  english_pob_choice: to take him to Babylon
  chosen_korean: 바벨론으로 데려갔습니다
  alternatives_korean:
  - 바벨론으로 끌고 갔습니다
  - 바벨론으로 데리고 가게 했습니다
  - 바벨론으로 이끌어 갔습니다
  lexicon: HALOT
  rationale: 인과적 이동 동사 לְהֹלִיכוֹ는 포로 이송의 맥락이므로, 목적지까지의 강제 이동을 자연스럽게 나타내는 ‘데려갔습니다’로 옮겼습니다.
