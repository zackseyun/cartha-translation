  rationale: 히브리어는 놋으로 된 구속 도구를 가리키므로, 전통적이면서도 이해하기 쉬운 ‘놋 사슬’로 옮겼습니다. 영어 POB의 ‘bronze chains’와 대응됩니다.
- source_word: לְהֹלִיכוֹ בָּבֶלָה
