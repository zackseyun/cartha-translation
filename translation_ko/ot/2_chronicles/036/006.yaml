  text: 바벨론 왕 느부갓네살이 그를 치러 올라와, 그를 청동 사슬로 묶어 바벨론으로 데려가기 위해서였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘청동 족쇄로’, ‘청동 결박쇠로’. 히브리어는 청동으로 만든 결박 도구를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  english_pob_choice: came up against him
  chosen_korean: 그에게 올라와서
  alternatives_korean:
