  text: Nebuchadnezzar king of Babylon came up against him and bound him with bronze chains to take him to Babylon[a].
  footnotes:
  - marker: a
    text: Or 'with bronze fetters' or 'with bronze shackles.' The Hebrew refers to bronze restraints placed on him.
