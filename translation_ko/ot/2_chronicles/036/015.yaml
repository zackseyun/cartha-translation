id: 2CH.36.15
reference: 2 Chronicles 36:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
  footnotes:
  - marker: a
    text: 'Hebrew ''rising early and sending,'' an idiom expressing persistent, eager repetition: ''again and again sending.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'through his messengers.'
    reason: lexical_alternative
  - marker: c
    text: That is, the temple, viewed as the place of God's dwelling among his people.
    reason: cultural_note
translation:
  language: ko
  text: 여호와께서 그들의 조상의 하나님이시므로 자기 백성과 자기 거처를 불쌍히 여기셨기 때문에, 그의 사자들의 손을 통해 그들에게 보내시기를 부지런히 반복하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘일찍 일어나 보내다’는 뜻의 반복적·간절한 파송을 나타냅니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그의 사자들을 통해’입니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘거처’는 예루살렘 성전, 곧 하나님이 자기 백성 가운데 거하시는 장소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: WLC
  rationale: 이 본문은 한국어 교회용 읽기에서 가장 널리 인식되는 하나님의 이름 표기를 따라야 하므로, 프로젝트 기본값인 야훼보다 여호와를 사용했습니다.
- source_word: בְּיַד מַלְאָכָיו
  english_pob_choice: by the hand of his messengers
  chosen_korean: 그의 사자들의 손을 통해
  alternatives_korean:
  - 그의 사자들을 통해
  - 그의 사자들로 말미암아
  lexicon: HALOT
  rationale: '''손을 통해''는 히브리어의 수단 표현을 비교적 직접적으로 살리면서도 한국어에서 자연스럽고, מַלְאָךְ의 기본 의미를 반영해 ''사자들''로 옮겼습니다.'
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  english_pob_choice: rising early and sending
  chosen_korean: 보내시기를 부지런히 반복하셨습니다
  alternatives_korean:
  - 일찍 일어나 보내셨습니다
  - 계속해서 보내셨습니다
  lexicon: HALOT
  rationale: 이 관용구는 단순한 시간 정보보다 반복적이고 간절한 파송을 뜻하므로, 본문의 힘을 살리기 위해 반복성과 열심을 드러내는 표현으로 옮겼습니다.
- source_word: מְעוֹנוֹ
  english_pob_choice: his dwelling place
  chosen_korean: 자기 거처
  alternatives_korean:
  - 자기 거하시는 곳
  - 자기 성전
  lexicon: HALOT
  rationale: '''거처''는 원어의 거주/거처 의미를 보존하면서도, 여기서 곧 성전을 가리키는 함의를 한국어 본문 안에서 과도하게 해설하지 않게 합니다.'
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 본문에는 한국어 성경 전통에 따라 여호와를 사용했습니다.
  alternative_readings:
  - 야훼
  rationale: 프로젝트 기본값은 야훼이지만, 한국어 독자에게 즉시 पहचान되는 공적 읽기에서는 전통적 교회 표기를 우선하는 편이 수용성과 가독성에 유리합니다.
  doctrine_reference: 역사적 정체성/가독성 원칙
- issue: мַלְאָכָיו의 성격
  chosen_reading: 인간 사자들로 읽었습니다.
  alternative_readings:
  - 천사들
  rationale: 역대하의 문맥은 심판 전에 반복적으로 경고를 보내는 선지자적 전달자를 가리키므로, 천사로 확정하지 않고 사자로 옮기는 것이 문맥에 더 충실합니다.
  doctrine_reference: 문맥상 선지자적 경고 전달
- issue: 하나님의 거처
  chosen_reading: 성전을 직접 언급하지 않고 '거처'로 유지했습니다.
  alternative_readings:
  - 자기 성전
  rationale: 원문은 하나님의 백성과 더불어 '그의 거처'를 병렬로 말하며, 거처라는 표현은 성전이면서도 하나님의 임재 장소라는 신학적 긴장을 보존합니다.
  doctrine_reference: 성전-임재 신학
