  to: 그들의 조상들의 하나님이신 여호와께서는 자기 백성과 자기의 거처를 불쌍히 여기셨기 때문에, 일찍 일어나[a] 자신의 사자들을 통하여[b] 그들에게 말씀을 보내셨습니다. 그분은 자기 백성과 자기의 거처[c]를 불쌍히 여기셨기 때문입니다.
