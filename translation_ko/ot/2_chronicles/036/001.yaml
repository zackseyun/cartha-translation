  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְחוּ֙ עַם הָ/אָ֔רֶץ אֶת יְהוֹאָחָ֖ז בֶּן יֹאשִׁיָּ֑הוּ וַ/יַּמְלִיכֻ֥/הוּ תַֽחַת אָבִ֖י/ו בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
  footnotes:
  - marker: a
    text: Or 'the common people.' The Hebrew expression 'the people of the land' can denote the populace of the land and, in some contexts, a particular social group within it.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 땅의 백성이 요시야의 아들 여호아하스를 데려다가 예루살렘에서 그의 아버지 대신 왕으로 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅의 일반 백성’. 히브리어 표현 ‘그 땅의 백성’은 그 땅의 주민 전체를 가리킬 수도 있고, 어떤 문맥에서는 그 안의 특정 사회집단을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 그 땅의 주민들
  - 백성
  lexicon: HALOT
  rationale: 히브리어 관용구를 비교적 직역하되, 한국어에서 자연스럽게 읽히도록 ‘백성’으로 옮겨 ‘the people of the land’의 투명성을 살렸습니다.
- source_word: וַיִּקְחוּ
  english_pob_choice: took
  chosen_korean: 데려다가
  alternatives_korean:
  - 데려갔습니다
  - 취했습니다
  - 붙잡았습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘취하다’보다 인물을 어떤 행동을 위해 ‘데려다가’라는 서술이 더 자연스럽고, English POB의 ‘took’이 함의하는 선택/취득의 뉘앙스를 무리 없이 반영합니다.
- source_word: וַיַּמְלִיכֻהוּ
  english_pob_choice: made him king
  chosen_korean: 왕으로 세웠습니다
  alternatives_korean:
  - 왕으로 삼았습니다
  - 왕이 되게 했습니다
  - 왕으로 만들었습니다
  lexicon: HALOT
  rationale: 히브리어 사역형의 ‘왕 되게 함’을 현대 한국어에서 가장 직관적으로 드러내는 표현으로, 즉위 의식의 세부를 덧붙이지 않으면서 causative 의미를 보존합니다.
- source_word: תַּחַת אָבִיו
  english_pob_choice: in place of his father
  chosen_korean: 그의 아버지 대신
  alternatives_korean:
  - 그의 아버지를 대신하여
  - 아버지 자리를 이어
  - 아버지의 뒤를 이어
  lexicon: HALOT
  rationale: 여기서 תחת는 위치적 ‘아래’가 아니라 대체·승계를 뜻하므로, 왕위 계승의 의미를 분명히 하는 ‘대신’이 가장 적합합니다.
theological_decisions:
- issue: עַם הָאָרֶץ의 범위
  chosen_reading: ‘그 땅의 백성’으로 본문에 두고, 특정 사회계층으로 좁히지 않았습니다.
  alternative_readings:
  - ‘그 땅의 일반 백성’
  - ‘그 나라의 주민들’
  rationale: 이 표현은 문맥에 따라 단순한 인구 전체를 가리키기도 하고 특정 사회집단을 가리키기도 하므로, 본문에서는 의미를 과도하게 한정하지 않는 번역을 택했습니다.
  doctrine_reference: 역사 서술의 문맥 보존 및 어휘적 다의성 유지
- issue: 왕위 계승의 표현
  chosen_reading: ‘왕으로 세웠습니다’로 옮겨 즉위 행위를 분명히 했습니다.
  alternative_readings:
  - ‘왕으로 만들었습니다’
  - ‘왕으로 삼았습니다’
  rationale: 본문은 요시아의 죽음 이후의 정통성/승계를 서술하므로, 단순한 임명보다 ‘세우다’가 왕권 부여의 역사적 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: 왕권 서술의 서사적 명료성
