  text: Jehoahaz was twenty-three years old when he became king[a], and he reigned three months in Jerusalem.
  footnotes:
  - marker: a
    text: Literally, 'a son of twenty-three years'—a standard Hebrew idiom for age.
    reason: lexical_alternative
