  text: 그들은 하나님의 집[a]을 불태우고, 예루살렘의 성벽을 허물었으며, 그 성의 모든 궁전을 불로 태우고, 그 성의 모든 귀중한 기물[b]을 파괴했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 성전’. 히브리어는 문자적으로 ‘하나님의 집’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 성의 모든 보배로운 물건들’ 혹은 ‘그 성의 모든 탐스러운 물품들’.
