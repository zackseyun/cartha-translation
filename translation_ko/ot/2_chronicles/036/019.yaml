id: 2CH.36.19
reference: 2 Chronicles 36:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּשְׂרְפוּ֙ אֶת בֵּ֣ית הָ/אֱלֹהִ֔ים וַֽ/יְנַתְּצ֔וּ אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/כָל אַרְמְנוֹתֶ֨י/הָ֙ שָׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל כְּלֵ֥י מַחֲמַדֶּ֖י/הָ לְ/הַשְׁחִֽית־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
  footnotes:
  - marker: a
    text: Or 'the temple of God.' The Hebrew reads literally 'the house of God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all its treasured objects' or 'all its desirable articles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 하나님의 집을 불태우고, 예루살렘의 성벽을 허물었으며, 그 성의 모든 궁전들을 불로 태우고, 그 소중한 기물들을 모두 파괴했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 성전’. 히브리어는 문자적으로 ‘하나님의 집’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 소중한 물건들’ 혹은 ‘그의 바람직한 기물들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님 집
  lexicon: WLC
  rationale: 직역은 ‘하나님의 집’이며, 문맥상 성전을 가리키지만 원어 표현의 직설성을 살리는 쪽이 더 source-grounded합니다.
- source_word: וַיְנַתְּצוּ
  english_pob_choice: tore down
  chosen_korean: 허물었으며
  alternatives_korean:
  - 무너뜨렸으며
  - 헐어 버렸으며
  lexicon: HALOT
  rationale: 건축물을 ‘끌어내려 무너뜨리다’는 뜻을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: אַרְמְנוֹתֶיהָ
  english_pob_choice: its palaces
  chosen_korean: 그 성의 모든 궁전들
  alternatives_korean:
  - 그 성의 모든 왕궁들
  - 그 성의 모든 성채들
  lexicon: HALOT
  rationale: אַרְמוֹן은 문맥상 궁전/왕궁이 가장 자연스럽고, ירושלים를 받는 소유 표현은 ‘그 성’으로 풀었습니다.
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  english_pob_choice: its precious vessels
  chosen_korean: 그 소중한 기물들
  alternatives_korean:
  - 그 귀중한 물건들
  - 그 보배로운 기물들
  - 그 값진 기구들
  lexicon: HALOT
  rationale: כְּלִי의 넓은 의미(그릇, 기구, 기물, 물건)를 반영하면서, מַחֲמַד의 ‘귀한/소중한’ 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 반복되는 ‘burn’ 표현의 처리
  chosen_reading: ‘불태우고’와 ‘불로 태우고’로 반복을 유지했습니다.
  alternative_readings:
  - 한 번만 ‘불태웠습니다’로 압축
  - ‘불을 질렀습니다’로 통일
  rationale: 본문은 성전, 성벽, 궁전, 기물의 파괴를 연속적으로 강조하므로 반복을 줄이지 않고 파괴의 총체성을 드러냈습니다.
  doctrine_reference: 본문 수사와 역사 서술의 강조를 보존하는 번역 원칙
