  - 야훼께로 돌이키지 않으려 했습니다
  lexicon: HALOT
  rationale: מִן+부정사 구조의 결과를 한국어에서는 부정문으로 자연스럽게 풀어, 돌아옴의 거부를 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
