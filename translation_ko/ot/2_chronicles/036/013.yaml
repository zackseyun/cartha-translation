revisions:
- from: 그도 바벨론 왕 느부갓네살에게 반역하였는데, 그가 하나님을 두고 맹세하게 한 자입니다. 그는 목을 굳게 하고 마음을 완고하게 하여 야훼, 이스라엘의 하나님께로 돌아오지 않았습니다.[a][b]
  to: 그도 자신에게 하나님을 두고 맹세하게 한 느부갓네살 왕에게 반역하였습니다.[a] 그는 목을 곧게 하고[b] 마음을 완고하게 하여 야훼, 이스라엘의 하나님께로 돌아오지 않았습니다.
  rationale: 관계절을 느부갓네살 왕에 직접 연결하여 원문의 통사와 과거 시제를 보존했습니다. 원문에 없는 ‘바벨론’을 삭제하고, 두 각주를 각각의 해당 표현에 붙였습니다. ‘돌아오지 않았습니다’는 야훼께로 돌이키기를 거부한 의미를 자연스러운 합쇼체로 나타냅니다.
