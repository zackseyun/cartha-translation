  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하되, 한국어에서 읽히는 완고함의 이미지를 보존했습니다.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  english_pob_choice: hardened his heart
  chosen_korean: 마음을 완고하게 하여
