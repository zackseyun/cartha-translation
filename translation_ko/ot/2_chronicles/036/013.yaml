  - 그리고 그도
  lexicon: HALOT
  rationale: 앞 문맥에 더해지는 인물을 자연스럽게 이어 주는 첨가 의미를 간결하게 살렸습니다.
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר
  english_pob_choice: against King Nebuchadnezzar
  chosen_korean: 바벨론 왕 느부갓네살에게
  alternatives_korean:
