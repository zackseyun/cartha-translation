  - 왕 느부갓네살을 상대로
  lexicon: HALOT
  rationale: מָרַד와 결합한 נגד/ב의 반역 대상을 한국어에서는 목적어 표지로 자연스럽게 옮겼습니다.
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  english_pob_choice: he stiffened his neck
  chosen_korean: 목을 굳게 하고
  alternatives_korean:
  - 목을 뻣뻣하게 하고
  - 완고해지고
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하되, 한국어에서 읽히는 완고함의 이미지를 보존했습니다.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  english_pob_choice: hardened his heart
  chosen_korean: 마음을 완고하게 하여
  alternatives_korean:
  - 마음을 굳게 하여
  - 마음을 강하게 하여
  lexicon: HALOT
  rationale: 문맥상 단순한 강화가 아니라 회개 거부의 완고함이므로 ‘완고하게’가 더 정확합니다.
- source_word: מִשּׁוּב אֶל יְהוָה
  english_pob_choice: from turning to Yahweh
  chosen_korean: 야훼께로 돌아오지 않았습니다
  alternatives_korean:
  - 야훼께 돌아서지 못하게 되었습니다
  - 야훼께로 돌이키지 않으려 했습니다
  lexicon: HALOT
  rationale: מִן+부정사 구조의 결과를 한국어에서는 부정문으로 자연스럽게 풀어, 돌아옴의 거부를 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신학적·학술적 표기인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: ‘그가 하나님을 두고 맹세하게 한 자’의 오역 가능성
  chosen_reading: 느부갓네살이 그에게 하나님을 두고 맹세하게 한 것으로 옮겼습니다.
  alternative_readings:
  - 그가 하나님에 의해 맹세하도록 된 자
  - 그가 하나님 앞에서 맹세하게 한 자
  rationale: 히브리어 שׁבע의 사역형은 ‘맹세하게 하다’의 의미이므로, 주체를 느부갓네살로 드러내는 것이 문맥과 영어 POB의 분석에 맞습니다.
  doctrine_reference: lexical-syntax reading of Hiphil שׁבע
- issue: 야훼로의 귀환 거부 표현
  chosen_reading: ‘돌아오지 않았습니다’로 번역해 회개/귀향의 방향성을 살렸습니다.
  alternative_readings:
  - ‘돌이키지 않았습니다’
  - ‘돌아오려 하지 않았습니다’
  rationale: מִשּׁוּב אֶל יְהוָה는 단순 이동이 아니라 언약적 회귀를 가리키므로, ‘돌아오다’가 더 적절합니다.
  doctrine_reference: repentance/return idiom
