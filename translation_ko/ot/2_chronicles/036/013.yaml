  rationale: 프로젝트 기본값에 따라 신학적·학술적 표기인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: ‘그가 하나님을 두고 맹세하게 한 자’의 오역 가능성
  chosen_reading: 느부갓네살이 그에게 하나님을 두고 맹세하게 한 것으로 옮겼습니다.
  alternative_readings:
  - 그가 하나님에 의해 맹세하도록 된 자
  - 그가 하나님 앞에서 맹세하게 한 자
  rationale: 히브리어 שׁבע의 사역형은 ‘맹세하게 하다’의 의미이므로, 주체를 느부갓네살로 드러내는 것이 문맥과 영어 POB의 분석에 맞습니다.
  doctrine_reference: lexical-syntax reading of Hiphil שׁבע
- issue: 야훼로의 귀환 거부 표현
  chosen_reading: ‘돌아오지 않았습니다’로 번역해 회개/귀향의 방향성을 살렸습니다.
  alternative_readings:
  - ‘돌이키지 않았습니다’
  - ‘돌아오려 하지 않았습니다’
  rationale: מִשּׁוּב אֶל יְהוָה는 단순 이동이 아니라 언약적 회귀를 가리키므로, ‘돌아오다’가 더 적절합니다.
  doctrine_reference: repentance/return idiom
