  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה בְּ/פִ֣י יִרְמְיָ֑הוּ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כּ֣וֹרֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'Now in the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
  footnotes:
  - marker: a
    text: Or 'through Jeremiah'; Hebrew literally, 'by the mouth of Jeremiah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 페르시아 왕 고레스의 첫해에, 야훼의 말씀을 예레미야의 입을 통해 이루시려고 야훼께서 페르시아 왕 고레스의 영을 깨우시니, 그가 자기 온 왕국에 공포문을 내고 또 글로도 알리며 이르렀습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예레미야를 통해’. 히브리어는 문자적으로 ‘예레미야의 입으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת אַחַ֗ת
  english_pob_choice: Now in the first year
  chosen_korean: 첫해에
  alternatives_korean:
  - 그리고 첫해에
  - 처음 해에
  lexicon: HALOT
  rationale: 서사 전환의 waw를 한국어에서는 무리하게 옮기지 않고, 연대 표지를 자연스럽게 처리했습니다.
- source_word: בְּ/פִ֣י יִרְמְיָ֑הוּ
  english_pob_choice: by the mouth of Jeremiah
  chosen_korean: 예레미야의 입을 통해
  alternatives_korean:
  - 예레미야를 통해
  - 예레미야의 입으로
  lexicon: HALOT
  rationale: ‘입’이라는 히브리어 관용을 살리면서, 예언 말씀이 매개된다는 뜻이 한국어로도 분명하게 드러나도록 했습니다.
- source_word: הֵעִ֣יר ... אֶת ר֨וּחַ֙ כּ֣וֹרֶשׁ
  english_pob_choice: stirred up the spirit of Cyrus
  chosen_korean: 고레스의 영을 깨우시니
  alternatives_korean:
  - 고레스의 영을 일으키시니
  - 고레스의 마음을 움직이시니
  lexicon: HALOT
  rationale: רוּחַ를 단순한 심리 상태로 좁히지 않고 ‘영’으로 옮기되, 동사는 ‘깨우다’로 자연스러운 촉발 이미지를 살렸습니다.
- source_word: וַ/יַּֽעֲבֶר קוֹל֙
  english_pob_choice: he made a proclamation
  chosen_korean: 공포문을 내고
  alternatives_korean:
  - 선포하고
  - 공포를 내리고
  lexicon: HALOT
  rationale: 히브리어 관용은 공개적 선포를 뜻하므로, 단순한 ‘말하다’보다 공식적 공표의 성격이 드러나는 표현을 택했습니다.
- source_word: וְ/גַם בְּ/מִכְתָּ֖ב
  english_pob_choice: and also in writing
  chosen_korean: 또 글로도 알리며
  alternatives_korean:
  - 또 문서로도 알리며
  - 또 서면으로도 알리며
  lexicon: HALOT
  rationale: 구두 공포와 병렬된 서면 통지를 한국어에서 자연스럽게 표현했습니다.
theological_decisions:
