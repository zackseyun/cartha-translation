revisions:
- from: 이집트 왕은 엘리아킴을 그의 형제로서 유다와 예루살렘의 왕으로 세우고, 그의 이름을 여호야김으로 바꾸었습니다. 또 느고는 그의 형제 여호아하스를 붙잡아 이집트로 데려갔습니다.[a]
  to: 이집트 왕은 여호아하스의 형제 엘리아김을 유다와 예루살렘의 왕으로 세우고, 그의 이름을 여호야김으로 바꾸었습니다. 또 느고[a]는 엘리아김의 형제인 여호아하스를 이집트로 데려갔습니다.
  rationale: 형제 관계의 문맥상 지시 대상을 명시하여 한국어의 불필요한 모호성을 제거했습니다. ‘붙잡아’를 원문의 기본 의미에 맞는 ‘이집트로 데려갔습니다’로 조정했고, 이름 표기 각주를 ‘느고’에 직접 연결했습니다. 왕위 임명, 개명, 여호아하스의 이집트 이송이라는 원문의 내용과 순서는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:13Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 사건 순서와 왕위 임명의 사역적 의미는 대체로 충실합니다. 그러나 초안의 두 ‘그의 형제’는 바로 앞 주어인 이집트 왕 또는 느고의 형제로 오해될 수 있습니다. 히브리어의 소유 접미사는 문맥상 엘리아김과 여호아하스의 형제 관계를 가리키므로 이를 명시하는 편이 충실합니다. 또한 ‘붙잡아’는 לָקַח(데려가다/취하다)보다 강한 체포의 뜻을 덧붙입니다.
  naturalness: ‘엘리아킴을 그의 형제로서’는 현대 한국어에서 부자연스럽고 관계의 기준점도 모호합니다. ‘여호아하스의 형제 엘리아김’, ‘엘리아김의 형제인 여호아하스’가 자연스럽고 명료합니다. 느고의 행동은 ‘이집트로 데려갔습니다’로 충분히 자연스럽게 표현됩니다.
  terminology: 인명 표기는 엘리아김, 여호야김, 여호아하스, 느고로 일관되게 유지할 수 있습니다. 각주가 느고라는 이름의 표기 대안을 다루므로 표지 [a]는 문장 끝이 아니라 ‘느고’에 직접 붙여야 합니다.
  issues:
  - severity: medium
    issue: 형제 관계의 지시 대상이 한국어에서 모호함
    rationale: ‘엘리아킴을 그의 형제로서’ 및 ‘느고는 그의 형제 여호아하스를’는 각각 이집트 왕이나 느고의 형제로 읽힐 수 있습니다. 본문 문맥의 형제 관계인 엘리아김과 여호아하스를 명시해야 합니다.
  - severity: medium
    issue: ‘붙잡아’가 원문의 동사보다 강한 의미를 추가함
    rationale: לָקַח는 여기서 여호아하스를 데려간 행위를 말하며, 체포·제압을 뜻하는 ‘붙잡아’를 반드시 요구하지 않습니다.
  - severity: low
    issue: 각주 표지 위치와 내용의 연결이 부정확함
    rationale: 각주는 느고/Neco/Necho의 표기 문제를 설명하지만 표지가 문장 끝에 있어 어느 표현을 설명하는지 불분명합니다. ‘느고’ 뒤에 두는 것이 적절합니다.
  revised_text: 이집트 왕은 여호아하스의 형제 엘리아김을 유다와 예루살렘의 왕으로 세우고, 그의 이름을 여호야김으로 바꾸었습니다. 또 느고[a]는 엘리아김의 형제인 여호아하스를 이집트로 데려갔습니다.
