  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Necho,'' commonly rendered ''Necho'' in English translations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트 왕은 엘리아킴을 그의 형제로서 유다와 예루살렘의 왕으로 세우고, 그의 이름을 여호야김으로 바꾸었습니다. 또 느고는 그의 형제 여호아하스를 붙잡아 이집트로 데려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 느고는 영어 성경에서 흔히 'Neco'로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  english_pob_choice: made ... king
  chosen_korean: 왕으로 세우고
  alternatives_korean:
  - 왕으로 삼고
  - 왕으로 임명하고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려, 단순히 즉위했다기보다 이집트 왕이 엘리아킴을 왕으로 세웠다는 뜻을 분명히 했습니다.
- source_word: אֶת אֶלְיָקִים אָחִיו
  english_pob_choice: Eliakim his brother
  chosen_korean: 엘리아킴을 그의 형제로서
  alternatives_korean:
  - 그의 형제 엘리아킴을
  - 형제 엘리아킴을
  lexicon: HALOT
  rationale: אָחִיו가 여호아하스를 가리키므로, 한국어에서는 소속 관계가 먼저 오도록 정리하되 형제 관계를 분명히 드러냈습니다.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  english_pob_choice: changed his name to
  chosen_korean: 그의 이름을 ... 바꾸었습니다
  alternatives_korean:
  - 그의 이름을 ... 바꾸어
  - 그를 ...로 이름 지었습니다
  lexicon: HALOT
  rationale: 이 관용구는 이름을 바꾸거나 개명하는 행위를 뜻하므로, 현대 한국어의 자연스러운 표현으로 옮겼습니다.
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  english_pob_choice: brought him to Egypt
  chosen_korean: 이집트로 데려갔습니다
  alternatives_korean:
  - 이집트로 끌고 갔습니다
  - 이집트로 데려왔습니다
  lexicon: HALOT
  rationale: 방향성 있는 حرکت을 반영하여 'to Egypt'를 살렸고, לקח의 결과를 한국어에서 가장 무리 없이 전달하는 동사로 옮겼습니다.
theological_decisions:
- issue: 형제 관계와 왕위 교체의 정치적 뉘앙스
  chosen_reading: 엘리아킴과 여호아하스를 모두 '그의 형제'로 표기해 혈연 관계를 유지하면서, 한 사람은 세우고 다른 한 사람은 붙잡아 데려가는 대비를 그대로 살렸습니다.
  alternative_readings:
  - 엘리아킴을 그의 형제라고 단순화하는 읽기
  - 여호아하스를 '잡아갔다'보다 약하게 표현하는 읽기
  rationale: 본문은 이집트 왕의 정치적 개입과 왕위 교체를 직접적으로 서술하므로, 서술의 강도를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 본문 서술의 역사적-서사적 의미 보존
