base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Necho,'' commonly rendered ''Necho'' in English translations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트 왕은 여호아하스의 형제 엘리아김을 유다와 예루살렘의 왕으로 세우고, 그의 이름을 여호야김으로 바꾸었습니다. 또 느고[a]는 엘리아김의 형제인 여호아하스를 이집트로 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름 נְכוֹ는 영어 성경에서 흔히 ‘Necho’로 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  english_pob_choice: made ... king
  chosen_korean: 왕으로 세우고
  alternatives_korean:
  - 왕으로 삼고
  - 왕으로 임명하고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살려, 단순히 즉위했다기보다 이집트 왕이 엘리아킴을 왕으로 세웠다는 뜻을 분명히 했습니다.
- source_word: אֶת אֶלְיָקִים אָחִיו
  english_pob_choice: Eliakim his brother
  chosen_korean: 엘리아킴을 그의 형제로서
  alternatives_korean:
  - 그의 형제 엘리아킴을
  - 형제 엘리아킴을
  lexicon: HALOT
  rationale: אָחִיו가 여호아하스를 가리키므로, 한국어에서는 소속 관계가 먼저 오도록 정리하되 형제 관계를 분명히 드러냈습니다.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  english_pob_choice: changed his name to
  chosen_korean: 그의 이름을 ... 바꾸었습니다
