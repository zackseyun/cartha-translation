- from: 여호야김의 남은 행적과 그가 행한 그의 abominations, 그리고 그에 대해 드러난 것들은—보십시오, 그것들은 이스라엘과 유다 왕들의 책에 기록되어 있습니다. 그리고 그의 아들 여호야긴이 그의 뒤를 이어 왕이 되었습니다.[a]
  to: 여호야김의 남은 행적과 그가 행한 가증한 일들과 그에 관하여 드러난 것들은[a]—보십시오, 이스라엘과 유다 왕들의 책에 기록되어 있습니다. 그의 아들 여호야긴이 그 뒤를 이어 왕이 되었습니다.
  rationale: 영어 혼입을 ‘가증한 일들’로 바로잡고 중복된 소유 표현을 제거했습니다. עָלָיו는 부정적 문맥을 각주에서 밝혀 두되, 본문에서는 가능한 중립적 의미도 보존하도록 ‘그에 관하여’로 옮겼습니다. 또한 각주 표지를 해당 모호한 표현에 붙였습니다.
