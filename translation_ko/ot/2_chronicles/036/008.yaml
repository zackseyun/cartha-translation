  terminology: תּוֹעֲבוֹתָיו는 현대 표준어 성경 문체에서 ‘가증한 일들’로 옮겨 강한 도덕적·종교적 평가를 보존할 수 있습니다. ‘이스라엘과 유다 왕들의 책’은 원문의 자료명 표현을 충실히 반영합니다. 여호야김 및 여호야긴 표기도 적절합니다.
