  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהֽוֹיָקִ֜ים וְ/תֹֽעֲבֹתָ֤י/ו אֲשֶׁר עָשָׂה֙ וְ/הַ/נִּמְצָ֣א עָלָ֔י/ו הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר מַלְכֵ֥י יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: Now the rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'what was found concerning him.' The Hebrew expression may refer generally to matters discovered about Jehoiakim, though 'against him' best fits the negative context.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야김의 남은 행적과 그가 행한 그의 abominations, 그리고 그에 대해 드러난 것들은—보십시오, 그것들은 이스라엘과 유다 왕들의 책에 기록되어 있습니다. 그리고 그의 아들 여호야긴이 그의 뒤를 이어 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그에 대해 드러난 것들’은 히브리어 עָלָיו의 문맥상 부정적 내용을 가리키지만, ‘그에 관한 것들’처럼 중립적으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts of
  chosen_korean: 여호야김의 남은 행적
  alternatives_korean:
  - 그리고 여호야김의 남은 일들
  - 여호야김의 남은 사건들
  lexicon: HALOT
  rationale: 왕 연대기 공식에서 דִּבְרֵי는 단순한 ‘말’이 아니라 통치의 나머지 기록을 가리키므로, 한국어에서는 자연스럽고 역사서체에 맞는 ‘남은 행적’으로 옮겼습니다.
- source_word: וְתֹעֲבֹתָיו
  english_pob_choice: the abominations
  chosen_korean: 그가 행한 그의 abominations
  alternatives_korean:
  - 그의 가증한 일들
  - 그가 행한 그의 가증한 행위들
  lexicon: HALOT
  rationale: תֹעֲבֹת는 강한 도덕·종교적 혐오를 담으므로 의미를 약화하지 않기 위해 ‘가증한 것들’ 계열을 유지했습니다. 다만 영어 POB의 보존된 판독을 존중해 원문적 긴장을 그대로 두었습니다.
- source_word: וְהַנִּמְצָא עָלָיו
  english_pob_choice: and what was found against him
  chosen_korean: 그리고 그에 대해 드러난 것들은
  alternatives_korean:
  - 그리고 그에게서 발견된 것들은
  - 그리고 그를 상대로 드러난 것들은
  lexicon: HALOT
  rationale: עַליו는 문맥상 불리한 내용이 ‘그에 대해’ 드러났음을 뜻하므로, 법률용어로 과도하게 구체화하지 않고도 불리한 뉘앙스를 살릴 수 있는 표현을 택했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: And Jehoiachin his son reigned in his place
  chosen_korean: 그리고 그의 아들 여호야긴이 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그리고 그의 아들 여호야긴이 그 대신 통치했습니다
  - 그리고 그의 아들 여호야긴이 그 자리를 이어 다스렸습니다
  lexicon: HALOT
  rationale: 즉위 공식을 한국어 왕정 서술에 맞게 풀어 쓰되, תַּחְתָּיו의 ‘대체/승계’ 의미를 ‘그의 뒤를 이어’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 역사서의 열거 형식과 평가어의 강도
  chosen_reading: ‘가증한 것들’과 ‘그에 대해 드러난 것들’을 통해 여호야김에 대한 부정적 평가를 완화하지 않았습니다.
  alternative_readings:
  - 부드러운 중립어로 순화
  - ‘문제들’처럼 일반화
  rationale: 본문은 왕의 행적을 단순 기록이 아니라 도덕적 평가와 함께 제시하므로, 평가의 강도를 유지하는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 본문의 역사-신학적 평가 보존
