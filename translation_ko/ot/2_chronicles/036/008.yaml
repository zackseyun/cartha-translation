  source_fidelity: 히브리어의 열거 구조, ‘가증한 일들’의 강한 평가, 그리고 왕위 계승은 대체로 반영되었습니다. 그러나 본문에 영어 단어 ‘abominations’가 남아 있어 한국어 번역으로 성립하지 않으며, עָלָיו의 의미는 문맥상 불리할 가능성이 크지만 ‘관하여’라는 중립적 여지도 있으므로 본문과 각주에서 그 모호성을 보존하는 편이 적절합니다.
