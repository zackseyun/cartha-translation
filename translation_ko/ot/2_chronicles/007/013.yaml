  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵ֣ן אֶֽעֱצֹ֤ר הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הֵן אֲצַוֶּ֥ה עַל חָגָ֖ב לֶ/אֱכ֣וֹל הָ/אָ֑רֶץ וְ/אִם אֲשַׁלַּ֥ח דֶּ֖בֶר בְּ/עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
  footnotes:
  - marker: a
    text: Or 'If I shut up the heavens ...' The Hebrew opening particle can be rendered more literally as 'if indeed' or 'behold, if.'
    reason: lexical_alternative
  - marker: b
    text: Or 'plague' for 'pestilence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 하늘을 닫아 비가 내리지 않게 하거나[a], 메뚜기에게 땅을 먹어 치우라고 명령하거나, 내 백성 가운데에 전염병을 보내면[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "내가 하늘을 닫아 ..." 히브리어 첫머리의 입자는 더 문자적으로 "만일 참으로" 또는 "보라, 만일"로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 "역병"으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  english_pob_choice: When
  chosen_korean: 내가 … 하면
  alternatives_korean:
  - 만일 내가 … 하면
  - 보십시오, 내가 … 하면
  lexicon: HALOT
  rationale: 문두의 조건 표지는 한국어에서 자연스러운 조건문으로 옮기는 것이 적절하므로, 직접적인 조건 형태인 "… 하면"으로 처리했습니다.
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  english_pob_choice: I shut up the heavens
  chosen_korean: 하늘을 닫아
  alternatives_korean:
  - 하늘을 거두어
  - 하늘을 멈추어
  lexicon: HALOT
  rationale: 비를 멈추게 하는 관용 표현의 물리적 이미지를 살리기 위해 "하늘을 닫다"를 유지했습니다.
- source_word: חָגָב לֶאֱכֹל הָאָרֶץ
  english_pob_choice: command the locust to devour the land
  chosen_korean: 메뚜기에게 땅을 먹어 치우라고 명령하거나
  alternatives_korean:
  - 메뚜기 떼를 보내 땅을 삼키게 하거나
  - 메뚜기가 땅을 먹어 없애게 하거나
  lexicon: HALOT
  rationale: חָגָב의 집합적 의미는 한국어에서 단수 대표명사보다 복수의 떼를 떠올리게 하지만, 원문의 간결한 병렬 구조를 살리기 위해 단수형 "메뚜기"를 쓰고 파괴성을 "먹어 치우다"로 옮겼습니다.
- source_word: דֶּבֶר
  english_pob_choice: pestilence
  chosen_korean: 전염병
  alternatives_korean:
  - 역병
  - 재앙
  lexicon: HALOT
  rationale: 문맥상 공동체 내부에 퍼지는 질병성 재앙을 가리키므로, 한국어에서 직접적이고 이해하기 쉬운 "전염병"을 선택했습니다.
- source_word: בְּעַמִּי
  english_pob_choice: among my people
  chosen_korean: 내 백성 가운데에
  alternatives_korean:
  - 내 백성 위에
  - 내 백성에게
  lexicon: HALOT
  rationale: ב의 내재적·공동체적 범위를 드러내기 위해 "가운데에"를 사용하여, 재앙이 백성 안에서 발생함을 나타냈습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위의 조건문 표현
  chosen_reading: 하나님이 비, 메뚜기, 전염병을 직접 보내시는 주권적 행위로 읽히도록 "내가 … 하면 / 명령하거나 / 보내면"의 직접 화법을 유지했습니다.
  alternative_readings:
  - 수동적으로 풀어 쓰는 표현
  - 일반적 자연현상처럼 완곡하게 옮기는 표현
  rationale: 본문은 언약적 징계를 하나님의 주권적 행위로 제시하므로, 행위 주체를 흐리지 않는 직역적 표현이 필요합니다.
  doctrine_reference: 언약적 징계와 하나님의 주권
- issue: 조건절 첫머리의 의미
  chosen_reading: 히브리어 הֵן의 조건적 기능을 반영해 한국어에서는 자연스러운 조건 연결인 "내가 … 하면"으로 옮겼습니다.
  alternative_readings:
  - 만일 내가 …
  - 보십시오, 만일 …
  rationale: 원문의 조건적 열거를 살리면서도 현대 한국어 문장 흐름을 해치지 않는 방식입니다.
  doctrine_reference: 본문 문법과 서술 구조
