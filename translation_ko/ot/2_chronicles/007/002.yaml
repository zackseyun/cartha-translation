  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''house of the LORD''; that is, the temple. The translation keeps ''house'' to reflect the Hebrew wording.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 제사장들은 여호와의 집에 들어갈 수 없었습니다. 여호와의 영광이 여호와의 집에 가득했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 제관들
  lexicon: HALOT
  rationale: 성전 문맥의 כֹּהֲנִים은 한국어 성경에서 관용적으로 ‘제사장들’로 옮기는 것이 가장 자연스럽고, 직무도 분명하게 드러납니다.
- source_word: לָבוֹא אֶל
  english_pob_choice: to enter
  chosen_korean: 들어갈 수 없었습니다
  alternatives_korean:
  - 들어올 수 없었습니다
  - 들어갈 수 없었습니다
  lexicon: HALOT
  rationale: בוא + אל은 장소 안으로 ‘들어가다’의 뜻이므로, 행위 자체보다 진입 불능을 드러내는 표현으로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 여호와의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘집’을 유지해 원문 반복을 살렸고, POB의 영어 본문이 footnote로 설명한 ‘temple’ 해석은 본문이 아니라 주석에서 처리하는 편이 원문에 더 가깝습니다.
- source_word: כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 여호와의 영광
  alternatives_korean:
  - 야훼의 영광
  - 여호와의 영광
  lexicon: HALOT
  rationale: כבוד־יהוה의 관용적 결합을 그대로 살려 하나님의 현현과 임재의 중량감을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 데이터셋의 한국어 표기는 기존 POB의 영어 본문과 마찬가지로 전통적 교회 용례를 따르는 형태가 가장 읽기 자연스럽고, 본문 의미도 충분히 전달합니다.
  doctrine_reference: POB Korean project naming convention for YHWH
- issue: 성전의 임재로 인해 제사장이 들어가지 못한 상황의 의미
  chosen_reading: 하나님의 영광이 임재를 압도하여 제사장들이 들어갈 수 없었다는 의미를 유지했습니다.
  alternative_readings:
  - 단순히 의식 절차상 출입이 제한되었다는 의미
  - 과장된 표현으로 완화하는 해석
  rationale: 문맥은 물리적 장벽보다 야훼의 영광이 성전을 가득 채워 인간의 접근이 불가능해진 상황을 말하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 2 Chr 7:1-3 temple theophany context
