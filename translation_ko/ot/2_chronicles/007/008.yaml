source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה אֶת הֶ֠/חָג בָּ/עֵ֨ת הַ/הִ֜יא שִׁבְעַ֤ת יָמִים֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ קָהָ֖ל גָּד֣וֹל מְאֹ֑ד מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
  footnotes:
  - marker: a
    text: Or 'from the entrance of Hamath.' The Hebrew may be understood either as a place-name ('Lebo-hamath') or as a descriptive boundary expression.
    reason: alternative_reading
  - marker: b
    text: Or 'to the Wadi of Egypt.' The Hebrew word can denote a seasonal watercourse or brook rather than a major river.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 솔로몬이 이 절기를 칠 일 동안 지켰으며, 온 이스라엘이 그와 함께 있었고, 레보-하맛에서부터 이집트 시내까지 이르는 매우 큰 회중이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 레보-하맛은 지명으로 볼 수도 있고, ‘하맛의 어귀’라는 경계 표현으로 볼 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘나할’은 큰 강보다 시내나 와디를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  english_pob_choice: kept the feast
  chosen_korean: 이 절기를 지켰으며
  alternatives_korean:
  - 이 절기를 지켰고
  - 절기를 지켰으며
  - 그 절기를 지켰으며
  lexicon: HALOT
  rationale: חָג는 단순한 ‘잔치’보다 절기/축제의 성격이 강하므로 ‘절기’로 옮기고, וַיַּעַשׂ의 관용적 의미는 예배적 준수의 뉘앙스를 살려 ‘지켰습니다’로 옮겼습니다.
- source_word: שִׁבְעַת יָמִים
  english_pob_choice: for seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 일곱 날에 걸쳐
  - 칠 일간
  lexicon: HALOT
  rationale: 지속 기간을 자연스러운 현대 한국어로 풀어 ‘동안’을 더해 표현했으며, 성경 문체에서는 ‘칠 일’이 수사적 리듬도 잘 살립니다.
- source_word: קָהָל גָּדוֹל מְאֹד
  english_pob_choice: a very great assembly
  chosen_korean: 매우 큰 회중
  alternatives_korean:
  - 매우 큰 모임
  - 엄청나게 큰 회중
  - 지극히 큰 회중
  lexicon: HALOT
  rationale: קָהָל은 단순한 군중보다 ‘모여 있는 공동체’의 의미가 강하므로 ‘회중’으로 옮겼고, מְאֹד는 ‘매우’로 직접 살렸습니다.
- source_word: מִלְּבוֹא חֲמָת ... עַד נַחַל מִצְרָיִם
  english_pob_choice: from Lebo-hamath to the Brook of Egypt
  chosen_korean: 레보-하맛에서부터 이집트 시내까지
  alternatives_korean:
  - 하맛 어귀에서부터 이집트 시내까지
  - 레보하맛에서 이집트 시내까지
  - 하맛의 입구에서부터 이집트 시내까지
  lexicon: HALOT
  rationale: מִלְּבוֹא חֲמָת은 POB의 처리처럼 지명적 표현으로 유지해 ‘레보-하맛’으로 옮겼고, נַחַל מִצְרַיִם은 큰 강이 아니라 와디/시내의 범주이므로 ‘이집트 시내’로 번역했습니다.
theological_decisions:
- issue: 이스라엘의 광역 경계 표현을 어떻게 전달할지
  chosen_reading: 지리적 전역을 가리키는 경계 표현으로 읽어, 민족적/정치적 범위를 드러내는 문장으로 옮겼습니다.
  alternative_readings:
  - 종교적 공동체의 범위를 암시하는 표현으로 완화
  - 단순한 지역적 과장으로 축소
  rationale: 본문은 성전 봉헌과 함께 이스라엘의 총체적 집합과 영토적 최대 범위를 강조하므로, 경계 표현의 역사·지리적 힘을 유지하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 역사서의 서술적·지리적 강조
