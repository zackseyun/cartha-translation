  - 주
  rationale: 본문이 하나님의 고유한 이름을 직접 사용하므로, 제목적 대치어인 ‘주’보다 음역형 ‘야훼’가 원문 의미를 더 직접적으로 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
