reference: 2 Chronicles 7:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
  footnotes:
  - marker: a
    text: Or “clung to other gods” or “embraced other gods.” The Hebrew verb literally means “took hold of,” expressing deliberate attachment to foreign gods.
    reason: lexical_alternative
  - marker: b
    text: “All this disaster” refers to calamity/judgment, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: ‘그들이 “이 모든 재앙은 그들이 자기들의 조상들의 하나님, 곧 그들을 이집트 땅에서 이끌어 내신 야훼를 버리고, 다른 신들을 붙들고 그들에게 절하고 섬겼기 때문이다”라고 말할 것입니다[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붙들고’는 히브리어 동사의 직역적 이미지이며, 우상들에게 의도적으로 매달리는 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  english_pob_choice: And they will say
  chosen_korean: “말할 것입니다”
  alternatives_korean:
  - “말합니다”
  - “말할 수 있습니다”
  lexicon: HALOT
  rationale: 앞 문맥의 예고를 이어 받는 미래형으로 처리해, 원문의 예언적 서술을 자연스럽게 살렸습니다.
- source_word: עַל אֲשֶׁר
  english_pob_choice: Because
  chosen_korean: “때문이다”
  alternatives_korean:
  - “이유는”
  - “~로 말미암아”
  lexicon: HALOT
  rationale: 전치사+관계절이 원인 설명을 이루므로, 한국어에서는 직접적인 인과 표현으로 옮기는 것이 가장 자연스럽습니다.
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  english_pob_choice: and took hold of other gods
  chosen_korean: “다른 신들을 붙들고”
  alternatives_korean:
  - “다른 신들을 붙잡고”
  - “다른 신들에게 매달리고”
  lexicon: HALOT
  rationale: חזק의 구체적 ‘붙들다/잡다’ 이미지를 살리되, 우상에 대한 의도적 집착이라는 의미가 드러나도록 한국어 동사를 선택했습니다.
- source_word: וַיִּשְׁתַּחֲוּוּ לָהֶם וַיַּעַבְדוּם
  english_pob_choice: and bowed down to them and served them
  chosen_korean: “그들에게 절하고 섬겼기 때문이다”
  alternatives_korean:
  - “그들 앞에 엎드리고 섬겼기 때문이다”
  - “그들에게 경배하고 섬겼기 때문이다”
  lexicon: HALOT
  rationale: שׁחה는 몸을 굽혀 절하는 행위로, עבד는 이어지는 종교적 섬김을 가리키므로 두 동사를 구분해 살렸습니다.
- source_word: כָּל הָרָעָה הַזֹּאת
  english_pob_choice: all this disaster
  chosen_korean: “이 모든 재앙”
  alternatives_korean:
  - “이 모든 화”
  - “이 모든 재난”
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 심판으로 임한 재난을 뜻하므로, 현대 한국어의 ‘재앙’이 가장 적절합니다.
theological_decisions:
- issue: 여호와의 이름 יְהוָה 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 하나님의 고유한 이름을 직접 사용하므로, 제목적 대치어인 ‘주’보다 음역형 ‘야훼’가 원문 의미를 더 직접적으로 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
