base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
  footnotes:
  - marker: a
    text: Literally, 'upon whom my name is called,' a Hebrew idiom expressing belonging to God or bearing his name.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 내 이름으로 불리는[a] 내 백성이 스스로 낮추고 기도하며 내 얼굴을 찾고 그들의 악한 길에서 돌아서면, 내가 하늘에서 듣고 그들의 죄를 용서하고 그들의 땅을 치유하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 위에 내 이름이 불리는’이며, 하나님께 속하고 그분의 이름을 지닌 백성임을 나타내는 히브리어 관용구입니다.
    reason: source_note
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  english_pob_choice: humble themselves
  chosen_korean: 스스로 낮추다
  alternatives_korean:
  - 겸손해지다
  - 자신을 낮추다
  - 낮아지다
  lexicon: HALOT
  rationale: 니팔형의 반사적·자발적 뉘앙스를 살리기 위해, 단순한 상태 변화보다 행위성을 드러내는 ‘스스로 낮추다’를 택했습니다.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  english_pob_choice: who are called by my name
  chosen_korean: 내 이름이 그들 위에 불리는
  alternatives_korean:
  - 내 이름으로 불리는
  - 내 이름이 불린 자들인
  - 내 이름 아래에 있는
  lexicon: HALOT
  rationale: 직역에 가까운 관용구를 유지해 소속과 표지를 나타내는 히브리어 관용을 보존했습니다. 본문 주석 없이도 이해되도록 한국어 어순만 다듬었습니다.
- source_word: וִֽיבַקְשׁוּ פָנַי
  english_pob_choice: seek my face
  chosen_korean: 내 얼굴을 찾고
  alternatives_korean:
  - 내 얼굴을 구하고
  - 나를 찾고
  - 내 은혜를 구하고
  lexicon: HALOT
  rationale: ‘얼굴’을 ‘임재’로 풀지 않고 원문의 비유를 유지했습니다. 다만 한국어에서 ‘seek my face’를 자연스럽게 옮기기 위해 ‘찾다’를 사용했습니다.
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  english_pob_choice: heal their land
  chosen_korean: 그들의 땅을 고치겠습니다
  alternatives_korean:
  - 그들의 땅을 치유하겠습니다
  - 그들의 땅을 회복하겠습니다
  - 그들의 땅을 낫게 하겠습니다
  lexicon: HALOT
  rationale: רפא의 기본 의미인 ‘치유/고침’을 살리되, 땅이 병든 것처럼 의인화된 원문 이미지를 현대 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 조건-결과 구조
  chosen_reading: ‘만일 … 하면’으로 시작해, 조건이 충족될 때 이어지는 야훼의 응답을 ‘내가 … 하겠습니다’로 분명히 구분했습니다.
  alternative_readings:
  - 모든 절을 단순한 병렬 ‘그리고’로 처리하는 방식
  rationale: 히브리어는 연결사를 반복하지만, 문맥상 회개 조건과 신적 응답의 결과 관계가 분명하므로 한국어에서는 조건 구조를 드러내는 것이 원문의 논리와 신학을 더 잘 전달합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source syntax and discourse force.'
- issue: ‘내 이름이 그들 위에 불리는’ 관용구
  chosen_reading: 소속과 언약적 식별을 나타내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘내 이름으로 불리는’처럼 더 매끈하게 일반화하는 방식
  - ‘내 이름이 그들 위에 놓인’으로 과도하게 직역하는 방식
  rationale: 이 관용구는 단순 호칭이 아니라 하나님께 속한 백성이라는 언약적 소속을 나타냅니다. 한국어에서도 이 신학적 함의를 흐리지 않도록 직역성과 자연성을 함께 살렸습니다.
  doctrine_reference: Covenantal identity in the Hebrew idiom; source-driven rendering.
