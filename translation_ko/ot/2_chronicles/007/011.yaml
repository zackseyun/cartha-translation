source:
  edition: WLC
  text: וַ/יְכַ֧ל שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל הַ/בָּ֜א עַל לֵ֣ב שְׁלֹמֹ֗ה לַ/עֲשׂ֧וֹת בְּ/בֵית יְהוָ֛ה וּ/בְ/בֵית֖/וֹ הִצְלִֽיחַ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
  footnotes:
  - marker: a
    text: Or 'the royal palace' for 'the house of the king.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''everything that came upon Solomon’s heart,'' meaning what he intended or desired to do.'
    reason: cultural_note
  - marker: c
    text: Or 'he prospered' / 'he succeeded.' The Hebrew verb can denote succeeding or causing something to succeed.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 야훼의 집과 왕의 집을, 그리고 야훼의 집과 자기 집에서 솔로몬의 마음에 든 모든 일을 다 이루어 마쳤습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕궁’으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, ‘솔로몬의 마음에 든’은 그가 뜻했거나 계획한 일을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘형통하게 이루었습니다’, ‘성공하였습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘집’을 살려 원문의 표현을 보존했고, 하나님의 이름은 본문과 오디트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the house of the king
  chosen_korean: 왕의 집
  alternatives_korean:
  - 왕궁
  - 왕의 궁전
  lexicon: HALOT
  rationale: 히브리어가 반복하는 ‘집’(בַּיִת)을 본문에서 유지하여, 보다 해석적인 ‘왕궁’보다 원문 구조를 살렸습니다.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  english_pob_choice: everything that came upon Solomon’s heart
  chosen_korean: 솔로몬의 마음에 든 모든 일
  alternatives_korean:
  - 솔로몬의 마음속에 떠오른 모든 것
  - 솔로몬이 뜻한 모든 일
  lexicon: HALOT
  rationale: ‘마음 위로 이르다/들다’라는 히브리어 관용구를 한국어 자연성에 맞게 풀되, 단순한 생각이 아니라 의도한 계획을 가리킨다는 점을 유지했습니다.
- source_word: הִצְלִיחַ
  english_pob_choice: he successfully accomplished
  chosen_korean: 다 이루어 마쳤습니다
  alternatives_korean:
  - 성공적으로 이루었습니다
  - 형통하게 하였습니다
  lexicon: HALOT
  rationale: 건축과 실행의 맥락에서 הצליח의 ‘성공/성취’ 의미를 살려, 단순한 일반적 번영보다 계획의 완수를 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 본문의 신명은 ‘야훼’로 표기합니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 오디트 기준과 원어 대응을 따라, 언약적 고유명을 일반 호칭으로 완화하지 않고 직접 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
