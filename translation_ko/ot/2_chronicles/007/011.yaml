  text: וַ/יְכַ֧ל שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל הַ/בָּ֜א עַל לֵ֣ב שְׁלֹמֹ֗ה לַ/עֲשׂ֧וֹת בְּ/בֵית יְהוָ֛ה וּ/בְ/בֵית֖/וֹ הִצְלִֽיחַ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
  footnotes:
  - marker: a
    text: Or 'the royal palace' for 'the house of the king.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''everything that came upon Solomon’s heart,'' meaning what he intended or desired to do.'
    reason: cultural_note
  - marker: c
    text: Or 'he prospered' / 'he succeeded.' The Hebrew verb can denote succeeding or causing something to succeed.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 야훼의 집과 왕의 집[a]을 완공했으며, 야훼의 집과 자기 집에서 행하려고 마음에 품었던[b] 모든 일을 성공적으로 이루었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕궁’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, ‘마음에 품었던’은 그가 뜻했거나 계획한 일을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘형통했습니다’, ‘성공했습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
