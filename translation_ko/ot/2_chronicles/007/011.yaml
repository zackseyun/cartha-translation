  - 왕의 궁전
  lexicon: HALOT
  rationale: 히브리어가 반복하는 ‘집’(בַּיִת)을 본문에서 유지하여, 보다 해석적인 ‘왕궁’보다 원문 구조를 살렸습니다.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  english_pob_choice: everything that came upon Solomon’s heart
  chosen_korean: 솔로몬의 마음에 든 모든 일
  alternatives_korean:
  - 솔로몬의 마음속에 떠오른 모든 것
  - 솔로몬이 뜻한 모든 일
  lexicon: HALOT
  rationale: ‘마음 위로 이르다/들다’라는 히브리어 관용구를 한국어 자연성에 맞게 풀되, 단순한 생각이 아니라 의도한 계획을 가리킨다는 점을 유지했습니다.
- source_word: הִצְלִיחַ
  english_pob_choice: he successfully accomplished
  chosen_korean: 다 이루어 마쳤습니다
  alternatives_korean:
  - 성공적으로 이루었습니다
  - 형통하게 하였습니다
  lexicon: HALOT
  rationale: 건축과 실행의 맥락에서 הצליח의 ‘성공/성취’ 의미를 살려, 단순한 일반적 번영보다 계획의 완수를 드러내는 표현을 선택했습니다.
