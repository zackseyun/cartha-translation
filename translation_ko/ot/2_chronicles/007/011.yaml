  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘집’을 살려 원문의 표현을 보존했고, 하나님의 이름은 본문과 오디트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the house of the king
  chosen_korean: 왕의 집
  alternatives_korean:
