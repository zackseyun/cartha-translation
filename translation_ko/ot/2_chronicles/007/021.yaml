revisions:
- from: 이 집은 전에 높았으나, 지나가는 모든 사람에게 두려운 것이 될 것이며, 그들은 「야훼께서 어찌하여 이 땅과 이 집에 이같이 하셨는가」 하고 말할 것입니다.[a][b]
  to: 한때 높았던 이 집은 그 곁을 지나는 모든 사람에게 경악을 불러일으킬 것이며, 그들은 “야훼께서 어찌하여 이 땅과 이 집에 이같이 하셨는가?” 하고 말할 것입니다.[a]
  rationale: 명시되지 않은 역접을 제거하고, ‘높았던’으로 과거의 탁월함을 보존했습니다. יִשֹּׁם은 물리적 황폐와 그것이 불러일으키는 목격자의 경악을 함께 시사하므로 ‘경악을 불러일으킬 것’으로 옮겼습니다. 불필요한 단수형 설명 각주는 삭제하고, בַּיִת의 문맥상 지시 대상만 남겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:16:35Z'
review_pass:
  verdict: revise
  source_fidelity: ‘전에 높았으나’의 ‘-으나’는 히브리어 관계절에 없는 역접을 더합니다. 또한 יִשֹּׁם은 이 집이 지나가는 이들에게 황폐의 충격과 경악을 일으키는 대상이 된다는 뜻이므로, ‘두려운 것’보다 ‘경악을 불러일으킬 것’이 더 정확합니다.
  naturalness: ‘한때 높았던 이 집’은 현대 표준어에서 자연스럽고, ‘지나가는 모든 사람에게 경악을 불러일으킬 것입니다’는 본문의 공적 충격을 명료하게 전달합니다. 인용문도 합쇼체 서술과 자연스럽게 연결됩니다.
  terminology: בַּיִת는 본문에서 ‘집’으로 유지하고, 문맥상 성전을 가리킨다는 점만 각주로 밝힙니다. יְהוָה는 프로젝트 방침과 영어 POB에 따라 ‘야훼’로 유지합니다.
  issues:
  - severity: medium
    issue: ‘전에 높았으나’의 역접
    rationale: אֲשֶׁר הָיָה עֶלְיוֹן은 ‘한때 높았던’이라는 관계절이며, ‘그러나’에 해당하는 접속 의미가 명시되어 있지 않습니다.
  - severity: medium
    issue: יִשֹּׁם의 ‘두려운 것’ 번역
    rationale: ‘두려운 것’은 위협적이거나 무서운 대상을 주로 뜻해, 황폐를 목격한 이들의 경악·참혹함을 나타내는 שמם의 문맥적 의미를 충분히 드러내지 못합니다.
  - severity: low
    issue: 각주 b의 필요성 및 영어 감사기록과의 불일치
    rationale: 단수 동사의 분배적 용법은 한국어 본문에서 복수 ‘그들은’으로 자연스럽게 처리되므로 각주가 필요하지 않습니다. 영어 POB의 b 각주는 오히려 ‘house’의 문맥적 의미를 설명하므로, 한국어에서는 ‘집’ 각주 하나로 정리하는 편이 적절합니다.
