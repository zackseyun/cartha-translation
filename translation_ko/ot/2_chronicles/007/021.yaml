id: 2CH.7.21
reference: 2 Chronicles 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
  footnotes:
  - marker: a
    text: Or, 'will be desolate' or 'will be appalling.' The Hebrew verb can emphasize devastation and the horror it provokes.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house'; here referring to the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 집은 전에 높았으나, 지나가는 모든 사람에게 두려운 것이 될 것이며, 그들은 「야훼께서 어찌하여 이 땅과 이 집에 이같이 하셨는가」 하고 말할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 여기서 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수형이지만, ‘지나가는 모든 사람’에 대한 분배적 용법이므로 한국어는 복수로 자연스럽게 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  english_pob_choice: And this house
  chosen_korean: 이 집은
  alternatives_korean:
  - 이 성전은
  - 이 집
  lexicon: HALOT
  rationale: בַּיִת의 기본뜻은 ‘집’이므로, 본문이 성전을 가리키더라도 원문 어휘를 먼저 살려 ‘집’으로 옮기고 문맥상 의미를 유지했습니다.
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  english_pob_choice: which was exalted
  chosen_korean: 전에 높았으나
  alternatives_korean:
  - 높았던
  - 존귀했으나
  - 높이 들려 있었으나
  lexicon: HALOT
  rationale: עֶלְיוֹן은 ‘높은, 높여진’의 뜻이므로, 과거의 영화와 지위를 함께 드러내는 자연스러운 한국어로 ‘전에 높았으나’를 택했습니다.
- source_word: לְכָל עֹבֵר עָלָיו יִשֹּׁם
  english_pob_choice: will become a horror to everyone passing by it
  chosen_korean: 지나가는 모든 사람에게 두려운 것이 될 것이며
  alternatives_korean:
  - 지나가는 모든 사람에게 황폐해 보일 것이며
  - 지나가는 모든 사람을 놀라게 할 것이며
  - 지나가는 모든 사람에게 공포가 될 것이며
  lexicon: HALOT
  rationale: יִשֹּׁם은 단순한 ‘황폐함’보다 보는 이가 충격과 경악을 느끼는 뉘앙스를 포함하므로, 결과와 반응을 함께 살린 ‘두려운 것이 될 것’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 여호와/주님 관용번역 대신, 프로젝트 기본값에 따라 신적 고유명사로서 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 성전이 심판의 표징이 되는 표현의 강도
  chosen_reading: ‘두려운 것이 될 것’으로 옮겨, 단순한 물리적 폐허보다 지나가는 이들이 느끼는 경악과 경고의 의미를 함께 드러냈습니다.
  alternative_readings:
  - ‘황폐하게 될 것입니다’
  - ‘소름끼치는 것이 될 것입니다’
  rationale: 히브리어 יִשֹּׁם은 파괴의 상태와 그로 인한 경악을 함께 시사하므로, 본문이 말하는 공적 심판의 충격을 약화하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
