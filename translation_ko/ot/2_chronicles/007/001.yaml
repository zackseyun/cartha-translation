review_pass:
  verdict: revise
  source_fidelity: 히브리어는 솔로몬이 기도를 마친 뒤 불이 하늘에서 내려와 번제와 다른 제물들을 소비하고, 야훼의 영광이 그 집을 채웠다고 말합니다. 초안의 전반적 의미는 충실하나, מָלֵא의 타동사 구문은 ‘그 집에 가득 찼습니다’보다 ‘그 집을 가득 채웠습니다’가 더 직접적으로 반영합니다.
  naturalness: ‘불이 … 삼켰고’도 이해되지만, 제의 문맥에서 불이 제물을 ‘태워 버렸다’는 표현이 현대 표준 한국어에서 더 자연스럽고 의미가 분명합니다. ‘번제물’과 일반 ‘제물들’의 구별은 유지했습니다.
  terminology: יהוה는 프로젝트 방침과 영어 POB에 맞추어 ‘야훼’로 유지합니다. עֹלָה는 ‘번제물’, זְבָחִים는 이를 포괄하지 않는 복수의 ‘제물들’로 옮겼습니다. הַבַּיִת는 본문상 성전을 가리키지만 원문의 ‘그 집’을 보존하고 주석으로 설명합니다.
