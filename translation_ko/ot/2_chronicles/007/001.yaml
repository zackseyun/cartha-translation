- from: 솔로몬이 기도를 마쳤을 때, 불이 하늘에서 내려와 번제물과 제물들을 삼켰고, 야훼의 영광이 그 집에 가득 찼습니다.[a][b]
  to: 솔로몬이 기도를 마쳤을 때, 불이 하늘에서 내려와 번제물과 제물들을 태워 버렸고, 야훼의 영광이 그 집을 가득 채웠습니다.[b]
