reference: 2 Chronicles 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
  footnotes:
  - marker: a
    text: Or 'descended from heaven.'
    reason: lexical_alternative
  - marker: b
    text: That is, the temple; Hebrew 'the house.'
    reason: cultural_note
translation:
  language: ko
  text: 솔로몬이 기도를 마쳤을 때, 불이 하늘에서 내려와 번제물과 제물들을 태워 버렸고, 야훼의 영광이 그 집을 가득 채웠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 여기서 ‘그 집’은 문맥상 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  english_pob_choice: And when Solomon finished praying
  chosen_korean: 솔로몬이 기도를 마쳤을 때
  alternatives_korean:
  - 솔로몬이 기도를 끝마쳤을 때
  - 솔로몬이 기도를 마무리했을 때
  lexicon: HALOT
  rationale: כְּכַלּוֹת은 ‘~을 마치다’의 시간절이므로 한국어도 완료 시점을 자연스럽게 나타내는 ‘~을 때’로 옮겼습니다. לְהִתְפַּלֵּל은 단순한 ‘기도하다’보다 문맥상 ‘기도를 마치다’로 자연스럽게 결합됩니다.
- source_word: וְהָאֵשׁ יָרְדָה מֵהַשָּׁמַיִם
  english_pob_choice: the fire came down from heaven
  chosen_korean: 불이 하늘에서 내려와
  alternatives_korean:
  - 불이 하늘로부터 내려와
  - 불이 하늘에서 내려왔고
  lexicon: HALOT
  rationale: שָׁמַיִם의 관용적 표현은 한국어에서 ‘하늘’이 가장 자연스럽고, 내려옴의 방향성을 살리기 위해 ‘내려와’로 연결했습니다.
- source_word: וַתֹּאכַל הָעֹלָה וְהַזְּבָחִים
  english_pob_choice: and consumed the burnt offering and the sacrifices
  chosen_korean: 번제물과 제물들을 삼켰고
  alternatives_korean:
  - 번제와 제물들을 삼켰고
  - 번제물과 희생제물들을 삼켰고
  lexicon: HALOT
  rationale: 불이 ‘먹다’의 동사를 쓰는 히브리어 관용을 그대로 살리되, 한국어에서는 ‘삼키다’가 가장 강한 대응어입니다. הָעֹלָה는 ‘번제물’, וְהַזְּבָחִים는 구체적 번제와 구별되는 일반 제물로 보아 ‘제물들’로 옮겼습니다.
- source_word: וּכְבוֹד יְהוָה
  english_pob_choice: and the glory of Yahweh
  chosen_korean: 야훼의 영광이
  alternatives_korean:
  - 야훼의 영광이
  - 주님의 영광이
  lexicon: HALOT
  rationale: יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, כָּבוֹד는 단순한 명예가 아니라 현현하는 하나님의 영광을 가리키므로 ‘영광’이 적절합니다.
- source_word: מָלֵא אֶת הַבָּיִת
  english_pob_choice: filled the house
  chosen_korean: 그 집에 가득 찼습니다
  alternatives_korean:
  - 그 집을 가득 채웠습니다
  - 그 성전에 가득 찼습니다
  lexicon: HALOT
  rationale: בַּיִת의 직역은 ‘집’이지만, 열왕기·역대기 문맥에서 성전을 가리키는 관용을 살리되 한국어에서는 상태 결과를 자연스럽게 표현하기 위해 ‘가득 찼습니다’로 옮겼습니다.
theological_decisions:
- issue: 여호와(יהוה)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 언약명 יהוה를 직접 사용하므로, 전통적 대치어 ‘주’보다 고유 신명 표기 ‘야훼’를 유지하는 것이 원문 신학을 더 투명하게 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
