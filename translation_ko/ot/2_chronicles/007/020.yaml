source:
  edition: WLC
  text: וּ/נְתַשְׁתִּ֗י/ם מֵ/עַ֤ל אַדְמָתִ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אַשְׁלִ֖יךְ מֵ/עַ֣ל פָּנָ֑/י וְ/אֶתְּנֶ֛/נּוּ לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
  footnotes:
  - marker: a
    text: 'Or ''this temple.'' Hebrew: ''this house.'''
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from before my face.'
    reason: lexical_alternative
  - marker: c
    text: Or 'a proverb and an object of scorn' / 'a taunt and a byword.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 내가 그들을 내가 그들에게 준 내 땅에서 뿌리 뽑을 것이며, 내가 내 이름을 위해 거룩하게 한 이 집을 내 앞에서 던져 버릴 것이고, 그것을 모든 백성들 가운데서 속담과 비방거리로 삼을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 성전.’ 히브리어는 ‘이 집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내 얼굴 앞에서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘속담과 조롱거리’ / ‘비웃음거리와 비방거리’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  english_pob_choice: then I will uproot them
  chosen_korean: 내가 그들을 뿌리 뽑을 것이며
  alternatives_korean:
  - 내가 그들을 뽑아낼 것이며
  - 내가 그들을 끌어낼 것이며
  lexicon: HALOT
  rationale: נטשׁ는 땅에서 식물을 뽑아 올리듯 제거하는 뜻이 있어, 관계의 단절과 추방의 이미지를 살리는 ‘뿌리 뽑다’가 가장 적절합니다.
- source_word: הַבַּיִת הַזֶּה
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 집(성전)
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘이 집’이므로 이를 유지했습니다. 문맥상 성전을 가리키지만, 원문 표현을 살리는 것이 POB의 방침에 맞습니다.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  english_pob_choice: I have consecrated for my name
  chosen_korean: 내 이름을 위해 거룩하게 한
  alternatives_korean:
  - 내 이름을 위해 성별한
  - 내 이름을 위해 성화한
  lexicon: HALOT
  rationale: קדשׁ의 핵심은 ‘거룩하게 구별하다’이므로 ‘거룩하게 하다’로 옮겼습니다. ‘내 이름을 위해’는 하나님의 임재/명예를 가리키는 표현을 유지합니다.
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  english_pob_choice: I will cast out of my sight
  chosen_korean: 내 앞에서 던져 버릴 것이고
  alternatives_korean:
  - 내 얼굴 앞에서 던져 버릴 것이고
  - 내 임재에서 던져 버릴 것이고
  lexicon: HALOT
  rationale: 직역하면 ‘내 얼굴/앞에서’이지만, 한국어에서는 ‘내 앞에서 던져 버리다’가 버림과 추방의 뜻을 가장 자연스럽게 전달합니다.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  english_pob_choice: a proverb and a byword
  chosen_korean: 속담과 비방거리로
  alternatives_korean:
  - 교훈과 조롱거리로
  - 잠언과 비웃음거리로
  lexicon: HALOT
  rationale: מָשָׁל과 שְׁנִינָה는 함께 쓰일 때 공적으로 회자되는 조롱의 말, 즉 ‘proverb/byword’의 짝을 이룹니다. 한국어에서는 의미쌍을 살려 ‘속담과 비방거리’로 옮겼습니다.
theological_decisions:
- issue: ‘my name’와 성전의 관계
  chosen_reading: ‘내 이름을 위해 거룩하게 한’은 성전이 하나님의 이름이 머무는 곳으로 구별되었다는 의미를 살리며, 단순한 건물 이상의 언약적 성격을 드러냅니다.
  alternative_readings:
  - ‘내게 거룩하게 한’
  - ‘내 이름을 위하여 성별한’
  rationale: 원문은 성전을 하나님의 이름과 연결해 이해시키므로, 이름-임재의 신학을 보존하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: ‘before my face’의 처리
  chosen_reading: ‘내 앞에서’는 히브리어 관용구를 자연스럽게 옮기되, 하나님의 거절과 추방을 분명히 드러냅니다.
  alternative_readings:
  - ‘내 얼굴 앞에서’
  - ‘내 임재에서’
  rationale: 원문은 직접적인 얼굴/임재 표현을 사용하지만, 한국어 성경문체에서는 ‘내 앞에서’가 가장 안정적으로 거절의 뉘앙스를 전달합니다.
  doctrine_reference: Translation philosophy §6
