revisions:
- from: 그때 내가 그들을 내가 그들에게 준 내 땅에서 뿌리 뽑을 것이며, 내가 내 이름을 위해 거룩하게 한 이 집을 내 앞에서 던져 버릴 것이고, 그것을 모든 백성들 가운데서 속담과 비방거리로 삼을 것입니다.[a][b][c]
  to: 그러면 내가 그들을 내가 그들에게 준 내 땅에서 뿌리 뽑아 내고, 내가 내 이름을 위하여 거룩하게 구별한 이 집을 내 앞에서 버리며,[a][b] 그것을 모든 민족 가운데서 속담과 조롱거리로 삼겠습니다.[c]
  rationale: 원문의 조건절 뒤에 이어지는 결과를 ‘그러면’으로 자연스럽게 연결했습니다. נתשׁ의 추방·제거 이미지는 ‘뿌리 뽑아 내고’로, 성전의 봉헌 의미는 ‘거룩하게 구별한’으로 보존했습니다. 하나님의 배척을 뜻하는 관용구는 오해 소지가 있는 ‘던져 버리다’ 대신 ‘내 앞에서 버리다’로 옮겼고, 공적 조롱의 의미는 ‘속담과 조롱거리’로 반영했습니다. 각주 표지는 해당 표현 바로 뒤에 배치했습니다.
