  rationale: 원문의 자세 묘사(얼굴을 땅으로 향함, 포장된 바닥 위에서)를 더 자연스러운 한국어로 명료화하고, 전례적 찬양문의 인과적 흐름을 보존했습니다. 의미를 바꾸지 않고 각주 표지를 각각의 설명 대상 표현 바로 뒤로 옮겼습니다.
