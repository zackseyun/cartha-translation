id: 2CH.7.3
reference: 2 Chronicles 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
  footnotes:
  - marker: a
    text: Or 'all the Israelites.' The Hebrew is literally 'all the sons of Israel,' a standard collective expression for the people of Israel.
    reason: lexical_alternative
  - marker: b
    text: '''The house'' refers to the temple.'
    reason: cultural_note
  - marker: c
    text: Or 'his mercy endures forever' or 'his covenant faithfulness endures forever.' The Hebrew חֶסֶד includes the sense of loyal, covenantal love.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 모든 자손이 불이 내려오는 것과 야훼의 영광이 그 집[a] 위에 임하는 것을 보고, 포장된 바닥에 얼굴을 땅에 대고 엎드려 경배하고 야훼께 감사드렸습니다. “그분은 선하시니, 그분의 한결같은 사랑[b]은 영원합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 집’은 성전을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד의 의미를 반영한 표현으로, 자비·언약적 신실함의 뉘앙스를 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  english_pob_choice: and all the sons of Israel
  chosen_korean: 이스라엘의 모든 자손
  alternatives_korean:
  - 이스라엘의 모든 사람들
  - 이스라엘의 모든 이스라엘 사람들
  lexicon: HALOT
  rationale: ‘sons of Israel’의 집합적 표현을 살리면서도 한국어에서는 자연스럽게 ‘자손’으로 옮겨, 민족 전체를 가리키는 의미를 유지했습니다.
- source_word: בְּרֶדֶת הָאֵשׁ
  english_pob_choice: the fire come down
  chosen_korean: 불이 내려오는 것
  alternatives_korean:
  - 불이 강림하는 것
  - 불이 내려오는 장면
  lexicon: HALOT
  rationale: 히브리어의 ‘내려오다’ 동작을 그대로 반영하되, 합쇼체 문맥에 맞게 자연스러운 진행형으로 표현했습니다.
- source_word: וּכְבוֹד יְהוָה
  english_pob_choice: and the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 영광스러운 임재
  - 주님의 영광
  lexicon: HALOT
  rationale: 본문의 신적 현현을 가리키는 ‘영광’을 유지하고, YHWH는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְהוֹדוֹת לַיהוָה
  english_pob_choice: and gave thanks to Yahweh
  chosen_korean: 야훼께 감사드렸습니다
  alternatives_korean:
  - 야훼를 찬송했습니다
  - 야훼께 감사했습니다
  lexicon: HALOT
  rationale: 히브리어 히필형 ידה의 감사/찬양 의미를 살리되, 예배적 문맥에 맞는 공손한 ‘감사드리다’로 옮겼습니다.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  english_pob_choice: for his steadfast love endures forever
  chosen_korean: 그분의 한결같은 사랑은 영원합니다
  alternatives_korean:
  - 그분의 인자하심은 영원합니다
  - 그분의 언약적 사랑은 영원합니다
  lexicon: HALOT
  rationale: חֶסֶד의 핵심을 살리면서도 한국어 독자가 이해하기 쉬운 ‘한결같은 사랑’으로 옮겨, 언약적 충실성과 지속성을 함께 드러냈습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 본문의 יהוה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 야훼의 언약적 고유성을 드러내는 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Public worship register in quoted acclamation
  chosen_reading: 직접 인용의 찬양문은 공적 예배의 선포체로 자연스럽게 유지했습니다.
  alternative_readings:
  - 더 구어적인 감탄형
  - 전통적 교회어조
  rationale: “그분은 선하시고… 영원합니다”라는 회중적 찬양을 현대 한국어 합쇼체로 그대로 살려, 예배적 반복성을 보존했습니다.
  doctrine_reference: Translation philosophy §5
