  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ וּ/בָחַ֜רְתִּי בַּ/מָּק֥וֹם הַ/זֶּ֛ה לִ֖/י לְ/בֵ֥ית זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
  footnotes:
  - marker: a
    text: Or “at night.”
    reason: lexical_alternative
  - marker: b
    text: Or “for a house of sacrifice”; that is, a place set apart for sacrificial worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼께서 밤에 솔로몬에게 나타나셔서 그에게 말씀하셨습니다. “나는 네 기도를 들었고, 이곳을 나를 위한 제사의 집으로 택하였다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 “희생제의 집으로”; 곧 제의적 예배를 위해 구별된 곳이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא יְהוָה
  english_pob_choice: appeared / Yahweh
  chosen_korean: 야훼께서 … 나타나시고
  alternatives_korean:
  - 야훼께서 … 보이시고
  - 야훼께서 … 현현하시고
  lexicon: HALOT
  rationale: נראה의 수동형은 여기서 솔로몬 앞에 드러나신 신현을 뜻하므로, 자연스럽고 신학적 함의를 살리는 ‘나타나시고’로 옮겼습니다.
- source_word: בַּלָּיְלָה
  english_pob_choice: by night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤중에
  - 야간에
  lexicon: HALOT
  rationale: 전치사 בְּ가 붙은 시간 표현은 한국어에서 보통 ‘밤에’로 가장 자연스럽고, 사건의 시점을 충분히 전달합니다.
- source_word: שָׁמַעְתִּי אֶת תְּפִלָּתֶךָ
  english_pob_choice: I have heard your prayer
  chosen_korean: 나는 네 기도를 들었고
  alternatives_korean:
  - 나는 네 기도를 들었다
  - 나는 너의 기도를 들었고
  lexicon: HALOT
  rationale: 완료형의 응답성을 살리되, 직접 화법 안에서 자연스러운 한국어로 ‘들었고’로 연결했습니다. ‘기도’가 תְּפִלָּה의 표준 대응입니다.
- source_word: וּבָחַרְתִּי בַּמָּקוֹם הַזֶּה לִי
  english_pob_choice: have chosen this place for myself
  chosen_korean: 이곳을 나 자신을 위한
  alternatives_korean:
  - 이곳을 내 것을 위한
  - 이곳을 나를 위하여
  lexicon: HALOT
  rationale: לִי는 단순한 ‘나를 위하여’보다 소유·귀속을 드러내므로, 하나님의 주권적 선택을 살리는 ‘나 자신을 위한’으로 옮겼습니다.
- source_word: לְבֵית זָבַח
  english_pob_choice: as a house of sacrifice
  chosen_korean: 희생제의 집으로
  alternatives_korean:
  - 제사의 집으로
  - 희생 제물의 집으로
  - 제사 드리는 집으로
  lexicon: HALOT
  rationale: זֶבַח는 단순한 ‘제사’보다 제의적 희생행위를 가리키므로, 전통적 교회 용어를 무비판적으로 좁히기보다 ‘희생제의’로 source를 더 직접적으로 반영했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유한 언약명으로서, 대체 칭호가 아니라 음역인 ‘야훼’로 보존하는 것이 원문 신학과 감사 가능성을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
