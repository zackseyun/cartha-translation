  source_fidelity: 야훼, 밤에, 솔로몬에게 나타나심, 기도를 들으심, 이곳을 하나님 자신을 위한 제사의 장소로 택하심이라는 핵심은 보존되었습니다. 그러나 לִי는 문맥상 ‘나 자신을 위한’이라는 강조보다 ‘나를 위한’이 더 직접적이며, 원문의 לְבֵית זָבַח은 여기서 자연스러운 한국어로 ‘제사의 집’이라 할 수 있습니다.
  naturalness: ‘희생제의 집’은 현대 표준어 성경 문맥에서 지나치게 전문적이고 어색합니다. 또한 서술은 합쇼체인데 직접화법이 고어적 평서체인 ‘택하였느니라’로 끝나 문체가 불균질합니다. 직접화법은 신적 선언의 격조를 유지하되 현대적인 ‘택하였다’로 다듬었습니다.
  terminology: יְהוָה는 방침에 따라 ‘야훼’로 유지합니다. זֶבַח는 이 문맥에서 ‘제사’로 옮겨도 희생 제사의 의미가 충분히 보존됩니다. ‘나 자신을 위한’은 원문에 없는 재귀적 강조이므로 ‘나를 위한’으로 조정합니다.
  issues:
