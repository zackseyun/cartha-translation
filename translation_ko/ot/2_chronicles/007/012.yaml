    rationale: לִי는 ‘나를 위하여/나를 위한’이라는 여격·목적 표현이며, 재귀 대명사에 해당하는 별도의 강조 형식은 없습니다.
  - severity: medium
    issue: ‘희생제의 집’이 현대 한국어에서 부자연스럽고 불필요하게 전문적입니다.
    rationale: לְבֵית זָבַח의 희생·제사 의미는 ‘제사의 집’으로 자연스럽게 전달됩니다. 성전이라는 해석어를 본문에 추가하지 않습니다.
  - severity: low
    issue: 각주 a가 본문 ‘밤에’를 그대로 반복하여 실질적인 대안을 제공하지 않습니다.
