revisions:
- from: 그러자 야훼께서 밤에 솔로몬에게 나타나시고 그에게 말씀하셨습니다. “나는 네 기도를 들었고, 이곳을 나 자신을 위한 희생제의 집으로 택하였느니라.”[a][b]
  to: 그러자 야훼께서 밤에 솔로몬에게 나타나셔서 그에게 말씀하셨습니다. “나는 네 기도를 들었고, 이곳을 나를 위한 제사의 집으로 택하였다.”[b]
  rationale: 원문의 의미와 야훼라는 신명을 유지하면서, לִי의 과도한 강조를 제거하고 לְבֵית זָבַח을 자연스러운 현대 한국어로 옮겼습니다. 본문과 중복되는 각주 a는 삭제하고, ‘희생제의 집’은 가능한 직역적 대안으로 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:18:43Z'
