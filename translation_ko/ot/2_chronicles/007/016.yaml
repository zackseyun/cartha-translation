revisions:
- from: 이제 내가 이 집을 택하여 거룩하게 하였으니, 내 이름이 그곳에 영원히 있게 하며, 내 눈과 내 마음도 거기에 항상 있겠습니다.[a][b]
  to: 이제 내가 내 이름이 그곳에 영원히 있도록 이 집[a]을 택하고 거룩하게 구별하였습니다[b]. 내 눈과 내 마음이 그곳에 모든 날 동안 있을 것입니다.
  rationale: 목적절을 원문의 통사 관계에 맞게 재구성하고, 미래 선언을 합쇼체의 비의지적 서술로 고쳤습니다. 지속 표현은 ‘모든 날 동안’으로 옮겨 כָּל הַיָּמִים의 범위를 보존했습니다. 각주는 최소한의 어휘·문화 설명으로 정리하고, 해석적 신학 설명은 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:18:44Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘이 집’, ‘내 이름’, ‘내 눈과 내 마음’이라는 핵심 표현을 대체로 보존합니다. 그러나 לִהְיוֹת의 목적 용법을 ‘있게 하며’로 옮긴 것은 앞선 완료 동사와의 관계를 흐리며, 마지막 미완료 동사에 대한 ‘있겠습니다’는 화자의 공손한 약속처럼 들려 본문의 단순한 신적 선언과 맞지 않습니다. כָּל־הַיָּמִים은 ‘모든 날 동안’으로 보존하는 편이 안전합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서 목적절을 ‘~하도록’으로 자연스럽게 연결합니다. ‘그곳’과 ‘모든 날 동안’은 성전 및 성서 문맥에 어울리며 의미가 명확합니다.
  terminology: קדשׁ의 히필은 ‘거룩하게 구별하다’로 옮겨 성별·봉헌의 뜻을 드러냈습니다. ‘집’은 원문의 표현을 유지하되 각주에서 성전 지시를 설명합니다. ‘내 이름’에 대한 해석적 신학 각주는 원문의 구체적 표현을 넘어가므로 삭제하고, 영어 감사 기록의 두 각주에 대응하도록 ‘집’ 및 ‘거룩하게 구별하다’에 각주를 배치했습니다.
  issues:
  - severity: high
    issue: ‘내 이름이 그곳에 영원히 있게 하며’는 목적 부정사 לִהְיוֹת의 통사적 기능을 부정확하게 연결합니다.
    rationale: 이는 하나님께서 이 집을 택하고 거룩하게 하신 목적, 곧 자신의 이름이 그곳에 있게 하려는 목적을 나타냅니다. 한국어에서는 ‘내 이름이 그곳에 영원히 있도록’이 그 관계를 분명히 합니다.
  - severity: medium
    issue: ‘내 눈과 내 마음도 거기에 항상 있겠습니다’의 ‘있겠습니다’는 공손한 1인칭 의지·약속의 뉘앙스를 냅니다.
    rationale: 히브리어는 ‘내 눈과 내 마음이 거기에 있을 것이다’라는 선언입니다. 합쇼체에서는 ‘있을 것입니다’가 화법과 인칭 해석을 더 정확히 전달합니다.
  - severity: medium
    issue: 각주 b의 ‘하나님의 언약적 자기계시’는 본문의 ‘내 이름’을 해설 수준으로 해석 확장하며, 영어 감사 기록의 각주 내용 및 배치와도 일치하지 않습니다.
    rationale: ‘이름’을 본문에서 그대로 두고, 필요한 최소 문화 설명은 ‘집’이 성전을 가리킨다는 각주로 제한해야 합니다. קדשׁ의 대안은 해당 어휘에 붙이는 것이 적절합니다.
  revised_text: 이제 내가 내 이름이 그곳에 영원히 있도록 이 집[a]을 택하고 거룩하게 구별하였습니다[b]. 내 눈과 내 마음이 그곳에 모든 날 동안 있을 것입니다.
