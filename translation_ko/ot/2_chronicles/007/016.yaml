id: 2CH.7.16
reference: 2 Chronicles 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
  footnotes:
  - marker: a
    text: Or 'sanctified.' The Hebrew verb means to set apart as holy.
    reason: lexical_alternative
  - marker: b
    text: '''This house'' refers to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 내가 이 집을 택하여 거룩하게 하였으니, 내 이름이 그곳에 영원히 있게 하며, 내 눈과 내 마음도 거기에 항상 있겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 여기서 성전을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘내 이름’은 하나님의 언약적 자기계시를 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 지금
  - 지금
  lexicon: HALOT
  rationale: 문맥 전환을 나타내는 הזמן 부사로서, 한국어에서는 짧고 자연스러운 ‘이제’가 화자의 선언을 가장 잘 살립니다.
- source_word: בָּחַרְתִּי
  english_pob_choice: I have chosen
  chosen_korean: 내가 … 택하여
  alternatives_korean:
  - 내가 … 선택하여
  - 내가 … 골라
  lexicon: HALOT
  rationale: 완료된 신적 행위를 현재적 효력과 함께 드러내기 위해 ‘택하다’를 사용했습니다.
- source_word: וְהִקְדַּשְׁתִּי
  english_pob_choice: and consecrated
  chosen_korean: 거룩하게 하였으니
  alternatives_korean:
  - 성별하였으니
  - 봉헌하였으니
  lexicon: HALOT
  rationale: קדשׁ의 히필은 ‘거룩하게 하다/구별하다’의 뜻이므로, 성전 봉헌 맥락을 살리면서도 본동사의 의미를 직접 드러냈습니다.
- source_word: הַבַּיִת הַזֶּה
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 성전
  - 이 집(성전)
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현인 ‘집’을 유지해 원문 이미지를 보존했습니다. 문맥상 성전을 가리키지만, 본문 자체의 어휘를 지키는 편이 더 소스에 가깝습니다.
- source_word: שְׁמִי
  english_pob_choice: my name
  chosen_korean: 내 이름
  alternatives_korean:
  - 내 명성
  - 내 이름(곧 내 임재)
  lexicon: HALOT
  rationale: 성전 신학에서 ‘이름’은 단순한 표지가 아니라 하나님의 언약적 자기계시를 가리키므로, 해석을 덧씌우지 않고 그대로 옮겼습니다.
- source_word: עַד עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
  lexicon: HALOT
  rationale: 영속적 지속을 나타내는 관용구로서 한국어 성서 문맥에서 자연스러운 ‘영원히’를 택했습니다.
- source_word: כָּל הַיָּמִים
  english_pob_choice: all the days
  chosen_korean: 항상
  alternatives_korean:
  - 모든 날에
  - 모든 날들 동안
  lexicon: HALOT
  rationale: 히브리어 직역은 ‘모든 날들’이지만, 한국어에서는 ‘항상’이 동일한 지속성을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘내 이름이 그곳에’라는 성전 언어
  chosen_reading: ‘이름’의 성전 언약적 의미를 유지하고, ‘임재’로 풀어쓰지 않았습니다.
  alternative_readings:
  - 내 임재가 그곳에
  - 내가 그곳에
  rationale: 본문은 하나님의 이름이 그곳에 있게 된다고 말하며, 이는 성전 신학의 전형적 표현입니다. 해석적 확장을 피하고 원문이 가진 신학적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘내 눈과 내 마음’의 인격적 표현
  chosen_reading: 인간형 비유를 그대로 살려 ‘내 눈과 내 마음’으로 옮겼습니다.
  alternative_readings:
  - 내 관심과 내 뜻
  - 내 돌봄과 내 의중
  rationale: 원문은 하나님의 주의와 애착을 구체적 신체 은유로 표현합니다. 이를 완화하면 텍스트의 정서적·언약적 힘이 약해집니다.
  doctrine_reference: Translation philosophy §3, §6
