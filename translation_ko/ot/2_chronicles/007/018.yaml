  text: 그러면 내가 네 왕국의 왕좌를 세워 주겠다[a]. 내가 네 아버지 다윗과 언약을 맺고 말하기를, “이스라엘을 다스리는 사람이 너에게서 끊어지지 않을 것이다.”
