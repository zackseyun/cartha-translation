  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
  footnotes:
  - marker: a
    text: Or, more idiomatically, “You will not lack a man to rule over Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 내가 네 왕국의 왕좌를 굳게 세우겠다[a]. 내가 네 아버지 다윗과 언약을 맺어 이렇게 말하였다. “이스라엘을 다스리는 사람이 네게서 끊어지지 않을 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, “네게는 이스라엘을 다스릴 사람이 끊이지 않을 것이다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  english_pob_choice: then I will establish
  chosen_korean: 그러면 내가 …을 세워 주겠다
  alternatives_korean:
  - 내가 …을 확립하겠다
  - 내가 …을 세우겠다
  lexicon: HALOT
  rationale: 히필형 קום의 ‘세우다/확립하다’ 의미를 살리되, 앞 절과의 연결을 자연스럽게 보여 주기 위해 ‘그러면’으로 옮겼습니다.
- source_word: כִּסֵּא מַלְכוּתֶךָ
  english_pob_choice: the throne of your kingdom
  chosen_korean: 네 왕국의 왕좌
  alternatives_korean:
  - 네 나라의 왕좌
  - 네 통치의 왕좌
  lexicon: HALOT
  rationale: ‘왕좌’와 ‘왕국’을 함께 드러내는 구조를 유지했습니다. ‘왕국’은 직역성이 있고, ‘왕좌’는 כסא의 기본 이미지를 보존합니다.
- source_word: לֹא יִכָּרֵת
  english_pob_choice: will not be cut off
  chosen_korean: 끊어지지 않을 것이다
  alternatives_korean:
  - 잘려 나가지 않을 것이다
  - 사라지지 않을 것이다
  lexicon: HALOT
  rationale: 동사의 문자적 ‘잘라 내다’ 이미지를 한국어에서 가장 자연스럽게 살릴 수 있는 표현으로 ‘끊어지다’를 선택했습니다.
- source_word: אִישׁ מוֹשֵׁל בְּיִשְׂרָאֵל
  english_pob_choice: A man to rule over Israel
  chosen_korean: 이스라엘을 다스리는 사람
  alternatives_korean:
  - 이스라엘을 통치하는 사람
  - 이스라엘의 통치자
  lexicon: HALOT
  rationale: פּוֹעֵל/분사 구조를 반영해 ‘다스리는 사람’으로 옮겼습니다. 남성 단수 איש을 무성별화하지 않고 ‘사람’으로 자연스럽게 전달했습니다.
theological_decisions:
- issue: 다윗 언약의 왕조적 약속 표현
  chosen_reading: 이스라엘을 다스리는 사람이 너에게서 끊어지지 않을 것이다
  alternative_readings:
  - 너에게 이스라엘을 다스릴 사람이 끊어지지 않을 것이다
  - 이스라엘을 다스릴 남자가 너에게서 끊어지지 않을 것이다
  rationale: 이 절은 한 개인의 즉각적 임무보다 다윗 왕조의 지속을 약속하는 문맥이므로, 원문의 ‘끊어지다’ 이미지를 유지하면서 왕조적 의미가 드러나게 번역했습니다.
  doctrine_reference: 2 Sam 7:12-16의 다윗 언약 맥락
