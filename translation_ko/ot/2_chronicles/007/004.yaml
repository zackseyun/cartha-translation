  rationale: 히브리어 זֹבְחִים은 단순 과거 완료보다 진행 중 행위를 드러내므로, 서술의 현장성과 제의의 지속성을 살리는 방향을 택했습니다.
  doctrine_reference: 문법-의미상 관찰
