    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  english_pob_choice: Then the king
  chosen_korean: 그때 왕
  alternatives_korean:
  - 그리고 왕
  - 그런 다음 왕
  lexicon: HALOT
  rationale: 문맥상 접속 וְ는 단순 병렬보다 서술의 진행을 나타내므로, 한국어에서는 자연스러운 시간 부사 ‘그때’로 풀었습니다.
- source_word: זֹבְחִים זֶבַח
  english_pob_choice: were offering sacrifices / offered sacrifices
  chosen_korean: 제물을 바치고 있었습니다
  alternatives_korean:
  - 희생제물을 드리고 있었습니다
  - 제사를 드리고 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 분사와 목적어의 관용적 결합을 한국어에서는 진행 중 동작으로 옮겨, 반복적·지속적 제의 행위를 드러냈습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼 면전에서
  - 야훼의 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי는 단순한 공간적 ‘앞’이 아니라 하나님의 임재 앞에서 행하는 제의적 위치를 뜻하므로, ‘앞에서’로 간결하게 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 신명사를 POB 원칙에 따라 ‘야훼’로 옮겨, 하나님의 고유한 이름을 보존했습니다.
theological_decisions:
- issue: 제의 동작의 지속성 표현
  chosen_reading: ‘제물을 바치고 있었습니다’로 분사적 진행을 살렸습니다.
  alternative_readings:
