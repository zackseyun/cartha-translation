id: 2CH.7.17
reference: 2 Chronicles 7:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֤ר הָלַךְ֙ דָּוִ֣יד אָבִ֔י/ךָ וְ/לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ וְ/חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
  footnotes:
  - marker: a
    text: Or 'my ordinances' for 'my judgments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신은, 만일 내 앞에서 당신의 아버지 다윗이 걸었던 것처럼 걸으며, 내가 당신에게 명령한 모든 것을 행하고, 내 규례들과 내 법도들을 지키면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 법도들’은 본문의 מִשְׁפָּטַי(“my judgments”)에 대한 대안적 옮김으로, 여기서는 규범적 의미를 따라 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: And as for you
  chosen_korean: 그리고 당신은
  alternatives_korean:
  - 그리고 당신도
  - 그리고 당신에게는
  lexicon: HALOT
  rationale: 문두의 접속사와 대명사 결합이 담화 전환과 강조를 나타내므로, 한국어에서도 대상자 솔로몬을 직접 집어 올리는 표현으로 옮겼습니다.
- source_word: תֵּלֵךְ לְפָנַי
  english_pob_choice: you walk before me
  chosen_korean: 내 앞에서 … 걸으며
  alternatives_korean:
  - 내 앞에서 … 걸어가며
  - 내 앞에서 … 살아가며
  lexicon: HALOT
  rationale: ‘walk before me’의 언약적 관용구를 살리되, 한국어에서는 자연스러운 합쇼체 서술로 ‘내 앞에서 걸으며’라고 옮겼습니다.
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  english_pob_choice: doing all that I have commanded you
  chosen_korean: 내가 당신에게 명령한 모든 것을 행하고
  alternatives_korean:
  - 내가 당신에게 명령한 모든 것을 하고
  - 내가 당신에게 명령한 대로 모두 행하고
  lexicon: HALOT
  rationale: 히브리어 부정사구가 앞 조건절에 종속된 의무를 나타내므로, 한국어에서도 별도 독립절로 나누지 않고 ‘-하고’로 이어서 구조를 보존했습니다.
- source_word: חֻקַּי וּמִשְׁפָּטַי
  english_pob_choice: my statutes and my judgments
  chosen_korean: 내 규례들과 내 법도들
  alternatives_korean:
  - 내 규례들과 내 판단들
  - 내 법령들과 내 판단들
  lexicon: HALOT
  rationale: 두 용어를 구별해 살리되, 전통적이면서도 현대 한국어에서 이해 가능한 언약-법률 어휘로 옮겼습니다. ‘judgments’는 여기서 ‘법도들’이 더 자연스럽고 문맥상 ‘판단’보다 규범적 의미를 잘 드러냅니다.
- source_word: תִּשְׁמֹר
  english_pob_choice: you keep
  chosen_korean: 지키면
  alternatives_korean:
  - 준수하면
  - 보존하면
  lexicon: HALOT
  rationale: 언약적 순종을 나타내는 기본 동사로, 조건문 안에서 자연스럽고 간결한 ‘지키면’을 선택했습니다.
theological_decisions:
- issue: 조건절의 순종 요구를 완화하지 않기
  chosen_reading: 조건형 구조를 그대로 살려, ‘걸으며… 행하고… 지키면’이라는 순종의 요구를 명시적으로 유지했습니다.
  alternative_readings:
  - 일반적 충실성으로 완화하기
  - 은혜 중심 표현으로 바꾸기
  rationale: 본문은 솔로몬에게 주어진 실제 언약 조건을 말하므로, 신학적으로 부드럽게 돌려 말하지 않고 원문의 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3
