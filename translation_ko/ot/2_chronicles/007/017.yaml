revisions:
- from: 그리고 당신은, 만일 내 앞에서 당신의 아버지 다윗이 걸었던 것처럼 걸으며, 내가 당신에게 명령한 모든 것을 행하고, 내 규례들과 내 법도들을 지키면,[a]
  to: 그러나 네가 만일 네 아버지 다윗이 걸었던 것처럼 내 앞에서 걸으며, 내가 네게 명령한 모든 것을 행하고, 내 규례와 내 법도를 지키면,[a]
  rationale: 문두의 וְאַתָּה는 앞 절과의 전환 및 솔로몬을 향한 강조를 지니므로 ‘그러나 네가’로 옮겼습니다. 조건절 안의 히브리어 부정사 וְלַעֲשׂוֹת는 ‘행하고’로 연결하여 종속적 병렬을 보존했습니다. 문장이 다음 절로 이어지는 원문의 미완결성을 반영해 끝 쉼표와 각주 위치도 유지했습니다.
