  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
  footnotes:
  - marker: a
    text: Or 'the midst of the court.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'did/made' in sacrificial idiom, that is, 'offered.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the fat of the fellowship offerings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬이 야훼의 집 앞에 있는 뜰의 가운데를 거룩하게 구별하였는데, 거기에서 번제물과 화목제의 기름을 드렸기 때문입니다. 솔로몬이 만든 놋 제단이 번제물과 곡식제물[a]과 기름을 다 담을 수 없었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곡식 제물’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  english_pob_choice: consecrated
  chosen_korean: 거룩하게 구별하였는데
  alternatives_korean:
  - 성별하였는데
  - 봉헌하였는데
  lexicon: HALOT
  rationale: קדשׁ의 사역형은 어떤 공간을 예배용으로 따로 떼어 놓는 뜻이므로, ‘거룩하게 구별하다’가 제의적 구별을 현대 한국어로 가장 자연스럽게 드러냅니다.
- source_word: תּוֹךְ הֶחָצֵר
  english_pob_choice: the middle of the court
  chosen_korean: 뜰의 가운데
  alternatives_korean:
  - 뜰의 한가운데
  - 뜰의 중심
  lexicon: HALOT
  rationale: תּוֹךְ의 핵심 의미인 ‘가운데, 중앙’을 살려 제단이 부족해져 중앙 공간까지 사용된 정황을 반영했습니다.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  english_pob_choice: the fat portions of the peace offerings
  chosen_korean: 화목제의 기름
  alternatives_korean:
  - 화목제의 기름 부분
  - 화목제의 기름기
  lexicon: HALOT
  rationale: 제의 문맥의 חלב는 단순한 일반적 ‘기름기’가 아니라 제물로 떼어 내는 지방 부분을 가리키므로, 한국어 제사 용례에 맞는 ‘기름’으로 옮기되 ‘화목제’와 결합해 제의적 의미를 유지했습니다.
- source_word: הַמִּנְחָה
  english_pob_choice: the grain offering
  chosen_korean: 곡식제물
  alternatives_korean:
  - 소제
  - 곡식제
  lexicon: HALOT
  rationale: מִנְחָה는 제의 문맥에서 곡물 제물을 뜻하므로, 현대 독자가 이해하기 쉬운 ‘곡식제물’을 택했습니다. 전통 교회 용어 ‘소제’는 현대어 감각이 약해 본문 기능을 덜 분명하게 할 수 있습니다.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  english_pob_choice: the bronze altar
  chosen_korean: 놋 제단
  alternatives_korean:
  - 청동 제단
  - 놋으로 만든 제단
  lexicon: HALOT
  rationale: 성막·성전 제의 용어에서 נחשת은 관용적으로 ‘놋’으로 굳어져 있어, 한국어 성서 문맥에서 가장 알아듣기 쉬운 전통적이되 직접적인 표현을 유지했습니다.
theological_decisions:
- issue: YHWH(יְהוָה)의 한국어 처리
  chosen_reading: ‘야훼’로 음역해 하나님의 고유명을 드러냈습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본문이 하나님의 이름 יְהוָה를 직접 사용하므로, 제목 호칭으로 바꾸지 않고 고유명 자체를 살리는 것이 원문 의미를 가장 투명하게 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
