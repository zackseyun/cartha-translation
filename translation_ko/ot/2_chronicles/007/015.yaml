  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַתָּ֗ה עֵינַ/י֙ יִהְי֣וּ פְתֻח֔וֹת וְ/אָזְנַ֖/י קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/015.yaml
  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
  footnotes:
  - marker: a
    text: Or 'to prayer offered in this place' or 'to prayer from this place.' The Hebrew more literally reads 'to the prayer of this place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내 눈은 열려 있을 것이며, 내 귀는 이곳에서 드리는 기도에 기울여질 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이곳에서 드리는 기도를 향해' 혹은 '이곳으로부터 드리는 기도를 향해'로 옮길 수도 있습니다. 히브리어를 더 문자적으로는 '이곳의 기도'라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금부터
  - 이제부터
  lexicon: HALOT
  rationale: 시간적 전환을 자연스러운 한국어로 옮기되, 문맥의 즉각적 응답성을 살려 '이제'로 렌더링했습니다.
- source_word: עֵינַי / יִהְיוּ פְתֻחוֹת
  english_pob_choice: my eyes will be open
  chosen_korean: 내 눈은 열려 있을 것이며
  alternatives_korean:
  - 내 눈은 열릴 것이며
  - 내 눈은 열려 있을 것입니다
  lexicon: HALOT
  rationale: 하나님의 주의와 감찰을 나타내는 비유를 그대로 살려 '눈'과 '열려 있다'의 이미지를 유지했습니다.
- source_word: וְאָזְנַי קַשֻּׁבוֹת
  english_pob_choice: and my ears attentive
  chosen_korean: 내 귀는 ... 기울여질 것입니다
  alternatives_korean:
  - 내 귀는 주의를 기울일 것입니다
  - 내 귀는 귀 기울일 것입니다
  lexicon: HALOT
  rationale: '''קַשֻּׁבוֹת''의 적극적인 청취를 한국어 동사구로 풀어, ''주의를 기울이다''의 의미를 살렸습니다.'
- source_word: לִתְפִלַּת הַמָּקוֹם הַזֶּה
  english_pob_choice: to the prayer offered in this place
  chosen_korean: 이곳에서 드리는 기도에
  alternatives_korean:
  - 이곳의 기도에
  - 이곳에서 올리는 기도에
  lexicon: HALOT
  rationale: 히브리어는 직역하면 '이곳의 기도'에 가깝지만, 문맥상 이 장소에서 드리는 기도를 뜻하므로 한국어에서는 자연스럽게 '이곳에서 드리는 기도'로 옮겼습니다.
theological_decisions:
- issue: 하나님의 신체적 은유를 유지할 것인가
  chosen_reading: '''내 눈'', ''내 귀''의 인격적·신체적 이미지를 보존했습니다.'
  alternative_readings:
  - 하나님이 지켜보실 것입니다
  - 하나님이 들으실 것입니다
  rationale: 본문의 의인법을 평탄화하지 않고 유지함으로써, 성전 봉헌 이후 야훼의 응답과 주의가 실제로 임한다는 언약적 강조를 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
