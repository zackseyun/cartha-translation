base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/015.yaml
  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
  footnotes:
  - marker: a
    text: Or 'to prayer offered in this place' or 'to prayer from this place.' The Hebrew more literally reads 'to the prayer of this place.'
