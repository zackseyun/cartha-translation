source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים עַל מִשְׁמְרוֹתָ֣/ם עֹמְדִ֗ים וְ/הַ/לְוִיִּ֞ם בִּ/כְלֵי שִׁ֤יר יְהוָה֙ אֲשֶׁ֨ר עָשָׂ֜ה דָּוִ֣יד הַ/מֶּ֗לֶךְ לְ/הֹד֤וֹת לַ/יהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ בְּ/הַלֵּ֥ל דָּוִ֖יד בְּ/יָדָ֑/ם וְ/הַ/כֹּהֲנִים֙ מחצצרים נֶגְדָּ֔/ם וְ/כָל יִשְׂרָאֵ֖ל עֹמְדִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
  footnotes:
  - marker: a
    text: Or 'with the musical instruments of the LORD.' The Hebrew phrase may mean instruments dedicated to the LORD or instruments used for the LORD's song.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'For his steadfast love is forever,' an idiom commonly rendered 'For his steadfast love endures forever.'
    reason: lexical_alternative
  - marker: c
    text: Or 'when David praised through them.' The Hebrew is compressed and likely means that the Levites rendered Davidic praise as his agents.
    reason: alternative_reading
translation:
  language: ko
  text: 제사장들은 각자 맡은 직무에 서 있었고, 레위 사람들은 다윗 왕이 야훼께 감사드리려고 만든, 야훼께 드리는 노래를 위한 악기들[a]을 가지고 있었습니다. 곧 “그의 한결같은 사랑은 영원합니다”[b]라고 다윗이 그들을 통하여[c] 찬양할 때에 쓰도록 만든 악기들이었습니다. 제사장들은 그들 맞은편에서 나팔을 불고 있었고, 온 이스라엘은 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 노래를 위한 악기들’ 또는 ‘야훼의 노래에 쓰는 악기들’. 히브리어 표현은 야훼께 드리는 노래에 쓰는 악기들을 가리키며, 야훼와의 관계를 표현하는 방식에는 여지가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그의 인자하심이 영원히’입니다. 이는 감사와 찬양에서 쓰이는 정형구로, 문맥상 ‘그의 한결같은 사랑은 영원합니다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘다윗이 그들의 손으로’. 히브리어는 압축된 표현으로, 다윗의 찬양이 레위 사람들을 통하여 수행되었음을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  english_pob_choice: their posts
  chosen_korean: 자기 직무를 맡아 서 있었고
  alternatives_korean:
  - 자기 부서에 서 있었고
  - 자기 배치 자리에 서 있었고
  - 자기 직무에 서 있었고
  lexicon: HALOT
  rationale: 문맥상 성전 봉사에 지정된 자리나 임무를 뜻하므로, 단순한 ‘직책’보다 현재진행의 장면을 살리는 표현을 택했습니다.
- source_word: בִּכְלֵי שִׁיר יְהוָה
  english_pob_choice: with the instruments for the song of Yahweh
  chosen_korean: 야훼의 노래를 위한 악기들
  alternatives_korean:
  - 야훼께 드리는 노래의 악기들
  - 야훼의 노래에 쓰는 악기들
  - 야훼의 찬양 악기들
  lexicon: HALOT
  rationale: 히브리어의 소유·관계 구조를 살려, 악기가 야훼와 연결된 예배용임을 드러내면서도 ‘음악 악기’로만 축소하지 않도록 했습니다.
- source_word: לְהֹדוֹת לַיהוָה
  english_pob_choice: to give thanks to Yahweh
  chosen_korean: 야훼께 감사드리기 위해
  alternatives_korean:
  - 야훼를 찬양하기 위해
  - 야훼께 감사하기 위해
  - 야훼께 감사를 드리기 위해
  lexicon: HALOT
  rationale: ידה의 기본 의미를 따라 감사로 옮기되, 예배 맥락에 맞게 자연스러운 한국어 동사구로 정리했습니다.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  english_pob_choice: for his steadfast love endures forever
  chosen_korean: “그의 인자하심은 영원합니다”
  alternatives_korean:
  - “그의 한결같은 사랑은 영원합니다”
  - “그의 인자하심은 영원합니다”
  - “그의 변함없는 사랑은 영원합니다”
  lexicon: HALOT
  rationale: חֶסֶד의 언약적 사랑을 살리기 위해 ‘인자하심’을 유지했고, 영어 POB의 관용적 보강을 한국어에서는 현재형으로 자연스럽게 반영했습니다.
- source_word: נֶגְדָּם
  english_pob_choice: opposite them
  chosen_korean: 그들 맞은편에서
  alternatives_korean:
  - 그들 앞에서
  - 그들 앞쪽에서
  - 그들을 마주하여
  lexicon: HALOT
  rationale: 제사장들이 레위 사람들을 향해 위치한 공간 관계를 가장 직접적으로 드러내는 표현입니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 히브리어 יְהוָה는 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본 원칙에 따라 성호를 가리거나 전통음으로 대체하지 않고, 원문이 드러내는 언약 નામ을 직접 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘그들의 손으로 찬양을 드릴 때’의 의미
  chosen_reading: 다윗이 레위인들을 매개로 찬양을 드렸다는 중간적/대리적 의미를 살렸습니다.
  alternative_readings:
  - 다윗이 그들로 말미암아 찬양했다
  - 다윗이 그들을 통해 찬양했다
  - 다윗이 그들의 손을 빌려 찬양했다
  rationale: 히브리어 בְּיָדָם의 압축된 표현을 너무 매끄럽게 풀어버리면 중개성의 뉘앙스가 사라지므로, ‘그들의 손으로’라는 표현을 유지해 대리 행위를 보존했습니다.
  doctrine_reference: 2Chr 7:6 구문 해석
