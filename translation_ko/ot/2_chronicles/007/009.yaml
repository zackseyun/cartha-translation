id: 2CH.7.9
reference: 2 Chronicles 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י עֲצָ֑רֶת כִּ֣י חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ עָשׂוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/הֶ/חָ֖ג שִׁבְעַ֥ת יָמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
  footnotes:
  - marker: a
    text: Or 'assembly' or 'closing assembly' for 'solemn assembly.' The Hebrew עֲצָרֶת refers to a special concluding gathering in a sacred festival context.
    reason: lexical_alternative
  - marker: b
    text: Or 'celebrated' or more literally 'did' the dedication of the altar for seven days.
    reason: lexical_alternative
translation:
  language: ko
  text: 여덟째 날에 그들은 성회[a]를 열었습니다. 이는 제단의 봉헌을 칠 일 동안 지켰고, 또 그 절기를 칠 일 동안 지켰기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성회’는 히브리어 עֲצָרֶת의 번역으로, 절기 마지막에 드리는 특별한 거룩한 모임을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָרֶת
  english_pob_choice: solemn assembly
  chosen_korean: 성회
  alternatives_korean:
  - 집회
  - 마지막 모임
  lexicon: HALOT
  rationale: 절기 문맥에서 마무리 성격의 거룩한 모임을 가리키므로, 일반적인 ‘집회’보다 예배적 함의를 살린 ‘성회’가 원문의 종교적 무게를 잘 드러냅니다.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  english_pob_choice: the dedication of the altar
  chosen_korean: 제단의 봉헌
  alternatives_korean:
  - 제단의 헌당
  - 제단의 축성
  lexicon: HALOT
  rationale: 제사적 의식으로서 제단을 하나님께 바쳐 구별하는 의미이므로, 한국어 성서 문맥에서 자연스러운 ‘봉헌’을 택했습니다.
- source_word: עָשׂוּ
  english_pob_choice: observed
  chosen_korean: 지켰습니다
  alternatives_korean:
  - 행했습니다
  - 하였습니다
  - 거행했습니다
  lexicon: HALOT
  rationale: 히브리어의 일반 동사 ‘하다’를 절기 수행의 관용적 의미로 옮겨, 반복을 피하면서도 의식 준수의 뜻을 살렸습니다.
- source_word: וְהֶחָג
  english_pob_choice: the feast
  chosen_korean: 그 절기
  alternatives_korean:
  - 그 축제
  - 그 명절
  lexicon: HALOT
  rationale: 문맥상 특정 절기를 가리키는 표현이므로, 본문의 절기성을 유지하는 ‘그 절기’가 가장 중립적이고 소스에 가깝습니다.
theological_decisions:
- issue: ‘성회’의 성격을 어떻게 드러낼지
  chosen_reading: 단순한 행정적 모임이 아니라, 절기 শেষে 거룩하게 구별된 마무리 예배 모임으로 이해해 번역했습니다.
  alternative_readings:
  - 그냥 ‘모임’으로 옮김
  - ‘폐회 집회’로 구체화
  rationale: עֲצָרֶת은 절기의 끝을 장식하는 특별한 종교 집회를 뜻하므로, 문맥의 경건성과 종결성을 함께 보존해야 합니다.
  doctrine_reference: 레 23장의 절기 규례와 성전 예배 문맥
- issue: ‘봉헌’과 ‘절기’를 각각 일곱 날로 반복한 구조
  chosen_reading: 제단 봉헌과 절기 준수를 각각 독립된 칠 일 기간으로 유지해 번역했습니다.
  alternative_readings:
  - 두 표현을 하나로 합쳐 축약
  - 둘째 ‘칠 일’을 생략
  rationale: 본문은 제단 봉헌과 절기 준수를 병렬로 제시하므로, 두 기간을 분리해 반복 구조를 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 역대하의 성전 봉헌 및 절기 서술
