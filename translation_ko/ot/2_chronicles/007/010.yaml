base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
  footnotes:
  - marker: a
    text: Or 'to their homes'; literally 'to their tents.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'had done'; the translation 'had shown' expresses the sense of beneficent action in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 일곱째 달 스물셋째 날에 그는 백성을 그들의 장막으로 돌려보냈습니다[a]. 그들은 야훼께서 다윗과 솔로몬과 야훼의 백성 이스라엘에게 베푸신 선하심 때문에 기뻐하고 마음이 즐거웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장막’은 직역이고, 문맥상 ‘집’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  english_pob_choice: And on the twenty-third day of the seventh month
  chosen_korean: 그리고 일곱째 달 스물셋째 날에
  alternatives_korean:
  - 일곱째 달 스물셋째 날에
  - 그리고 일곱째 달의 스물셋째 날에
  lexicon: WLC
  rationale: 히브리어 날짜 표현을 한국어 자연문장으로 옮기되, 서술 연결을 위한 ‘그리고’를 살려 내러티브 흐름을 유지했습니다.
- source_word: שִׁלַּח אֶת הָעָם לְאָהֳלֵיהֶם
  english_pob_choice: he sent the people to their tents
  chosen_korean: 그는 백성을 그들의 장막으로 돌려보냈습니다
  alternatives_korean:
  - 그는 백성을 그들의 장막으로 보냈습니다
  - 그는 백성을 그들의 집으로 돌려보냈습니다
  lexicon: HALOT
  rationale: ‘장막’은 히브리어의 구체적 이미지를 살리고, ‘돌려보냈습니다’는 집회가 끝나 각자 돌아가게 했다는 뜻을 자연스럽게 드러냅니다.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  english_pob_choice: rejoicing and glad of heart
  chosen_korean: 기뻐하며 마음에 즐거움이 가득했습니다
  alternatives_korean:
  - 기뻐하며 마음이 즐거웠습니다
  - 즐거워하며 마음에 기쁨이 있었습니다
  lexicon: HALOT
  rationale: ‘기뻐하며’와 ‘마음에 즐거움이 가득했습니다’로 병렬 표현을 살려, 외적 기쁨과 내적 즐거움을 함께 표현했습니다.
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה יְהוָה
  english_pob_choice: because of the goodness that Yahweh had shown
  chosen_korean: 야훼께서 … 베푸신 그 선하심 때문에
  alternatives_korean:
  - 야훼께서 … 하신 선한 일 때문에
  - 야훼께서 … 행하신 그 선함 때문에
  lexicon: HALOT
  rationale: עָשָׂה는 단순한 ‘하다’보다 혜택을 베푸는 행위를 가리키므로, 한국어에서는 ‘베푸시다’로 옮겨 하나님의 호의적 행위를 드러냈습니다. ‘선하심’은 הטּוֹבָה의 명사성을 살립니다.
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  english_pob_choice: to David and to Solomon and to Israel his people
  chosen_korean: 다윗과 솔로몬과 그의 백성 이스라엘에게
  alternatives_korean:
  - 다윗과 솔로몬과 이스라엘 그의 백성에게
  - 다윗과 솔로몬과 이스라엘 백성에게
  lexicon: HALOT
  rationale: 반복된 ל- 전치사는 수혜 대상을 표시하므로 ‘에게’로 옮겼고, ‘그의 백성 이스라엘’은 히브리어의 소유-명사 결합을 그대로 반영했습니다.
