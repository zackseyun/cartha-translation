  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ אֶל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכּוּ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל מָ֑יִם וְ/אֵ֥ת כָּֽל מִסְכְּנ֖וֹת עָרֵ֥י נַפְתָּלִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
  footnotes:
  - marker: a
    text: Abel-maim is the reading of the Hebrew text here; some identify it with Abel-beth-maacah known from parallel passages.
    reason: alternative_reading
translation:
  language: ko
  text: 벤하닷은 아사의 말을 듣고 자기 군대의 지휘관들을 보내 이스라엘의 성읍들을 치게 했습니다. 그들은 이욘과 단과 아벨마임과 납달리의 모든 저장 성읍을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아벨마임은 여기 히브리어 본문에 있는 읽기입니다. 병행본문에서는 아벨벳마아가로 알려진 곳과 연결되기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: listened to
  chosen_korean: 들은
  alternatives_korean:
  - 들었습니다
  - 귀를 기울였습니다
  - 따랐습니다
  lexicon: HALOT
  rationale: 벤하닷이 아사의 요청에 호의적으로 반응하는 문맥이므로, 단순히 ‘들었다’보다 응답적 뉘앙스를 살리면서도 ‘순종했다’까지는 나가지 않는 ‘듣다’ 계열이 적절합니다.
- source_word: שָׂרֵי הַחֲיָלִים
  english_pob_choice: the commanders of his armies
  chosen_korean: 군대의 지휘관들
  alternatives_korean:
  - 군대의 지휘자들
  - 군대의 대장들
  - 병력의 지휘관들
  lexicon: HALOT
  rationale: שָׂרֵי는 ‘지도자/지휘관’의 뜻이고, הַחֲיָלִים은 군사 집단을 가리키므로 현대 한국어에서는 자연스럽게 ‘군대의 지휘관들’로 옮기는 것이 좋습니다.
- source_word: עָרֵי יִשְׂרָאֵל
  english_pob_choice: the cities of Israel
  chosen_korean: 이스라엘의 성읍들
  alternatives_korean:
  - 이스라엘의 도시들
  - 이스라엘 성읍들
  lexicon: HALOT
  rationale: 북이스라엘의 정치·지리적 표지를 보존하기 위해 ‘성읍들’이 적절하며, 전통적 성경 문체와 현대 가독성을 함께 살립니다.
- source_word: מִסְכְּנוֹת
  english_pob_choice: store-cities
  chosen_korean: 저장 성읍
  alternatives_korean:
  - 비축 성읍
  - 창고 성읍
  - 저장 도시
  lexicon: HALOT
  rationale: 이 단어는 물자 비축·보관 기능을 가진 성읍을 뜻하므로, 직역성을 유지하면서도 의미가 드러나는 ‘저장 성읍’으로 옮겼습니다.
- source_word: אָבֵל מָיִם
  english_pob_choice: Abel-maim
  chosen_korean: 아벨마임
  alternatives_korean:
  - 아벨-마임
  - 아벨-마임성
  lexicon: HALOT
  rationale: 히브리어 본문을 따라 지명을 음역했고, 병행본문과의 조화를 본문에 섞어 넣지 않았습니다.
theological_decisions:
- issue: 병행본문과의 조화 여부(אָבֵל מָיִם / 알려진 다른 지명)
  chosen_reading: 본문의 아벨마임을 그대로 두었습니다.
  alternative_readings:
  - 병행본문에 따라 아벨벳마아가로 조화
  rationale: 이 절의 히브리어 본문 자체가 אָבֵל מָיִם을 읽으므로, 알려진 병행 전승을 본문에 흡수하지 않고 본문 읽기를 보존하는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 본문비평/지명 전승
- issue: וַיַּכּוּ의 군사적 폭력성
  chosen_reading: ‘쳤습니다’로 직접적으로 옮겼습니다.
  alternative_readings:
  - 공격했습니다
  - 타격했습니다
  - 무찔렀습니다
  rationale: נכה는 군사 서술에서 실제 타격·격파를 뜻할 수 있으므로, 사건의 물리적·전투적 성격을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 서사 문체/어휘 보존
