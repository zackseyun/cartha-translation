- from: 벤하닷은 아사의 말을 듣고 자기 군대의 지휘관들을 보내 이스라엘의 성읍들을 치게 했습니다. 그들은 이욘과 단과 아벨마임과 납달리의 모든 저장 성읍을 쳤습니다.[a]
  to: 벤하닷은 아사 왕의 말을 듣고 자기 군대의 지휘관들을 이스라엘의 성읍들로 보냈습니다. 그들은 이욘과 단과 아벨마임과 납달리의 모든 저장 성읍을 쳤습니다.[a]
