base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Now behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
  footnotes:
  - marker: a
    text: Or, more formally, 'the words/matters of Asa, the former and the latter.' Here 'acts' and 'from first to last' reflect the idiomatic sense of the Hebrew historiographical formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a]. 아사의 처음부터 끝까지의 행적은, 보십시오, 유다와 이스라엘 왕들의 책에 기록되어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘아사의 말들/일들, 처음 것들과 마지막 것들’입니다. 여기서는 히브리어 역사 서술의 관용적 뜻을 따라 ‘행적’과 ‘처음부터 끝까지’를 반영했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: Now behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 이제 보십시오
  - 보라
  - 자, 보십시오
  lexicon: HALOT
  rationale: 서사 결말의 주의를 끄는 감탄·지시 표현으로, 한국어에서는 자연스럽고 직접적인 호소형인 ‘보십시오’가 가장 잘 대응합니다.
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  english_pob_choice: from first to last
  chosen_korean: 처음부터 끝까지의
  alternatives_korean:
  - 처음과 마지막의
  - 처음부터 마지막까지의
  - 전 기간의
  lexicon: HALOT
  rationale: 히브리어의 상투적 표현이 전 범위를 가리키므로, 의미를 자연스럽게 풀어 ‘처음부터 끝까지’로 옮겼습니다.
- source_word: דִּבְרֵי
  english_pob_choice: the acts of
  chosen_korean: 행적은
  alternatives_korean:
  - 말씀은
  - 사실들은
  - 일들은
  lexicon: HALOT
  rationale: 왕의 기록 서술문에서 דִּבְרֵי는 단순한 ‘말’보다 넓게 ‘행적/사적’의 뜻을 가지므로, 문맥상 ‘행적’이 가장 적절합니다.
- source_word: סֵפֶר הַמְּלָכִים
  english_pob_choice: the Book of the Kings
  chosen_korean: 왕들의 책
  alternatives_korean:
  - 왕들의 기록책
  - 열왕기
  - 왕실 기록
  lexicon: HALOT
  rationale: 원문은 특정 문헌을 가리키지만, 여기서는 히브리어 표현을 그대로 반영해 ‘왕들의 책’으로 두어 기록 সূত্র의 성격을 드러냈습니다.
theological_decisions:
- issue: 고정 관용구의 범위 보존
  chosen_reading: ‘처음부터 끝까지’로 전체 생애를 포괄하는 왕조 기록 요약을 유지했습니다.
  alternative_readings:
  - ‘처음과 마지막’의 직역
  - ‘전부’로 단순화
  rationale: 본문은 아사의 생애 전반을 아우르는 결론 공식을 사용하므로, 직역보다 관용적 범위를 드러내는 표현이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: 역대기 역사서의 서술 공식
