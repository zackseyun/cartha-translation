    issue: The second attention marker is omitted.
    rationale: The Hebrew has an initial וְהִנֵּה and then הִנָּם before כְּתוּבִים. The draft renders only the initial marker as ‘보십시오.’
  - severity: low
    issue: The footnote’s literal alternative is imprecise.
    rationale: ‘이전 것과 이후 것’ does not represent the source expression as closely as ‘처음 것들과 마지막 것들’ (or ‘처음과 마지막’) and obscures its conventional comprehensive force.
  revised_text: 보십시오[a]. 아사의 처음부터 끝까지의 행적은, 보십시오, 유다와 이스라엘 왕들의 책에 기록되어 있습니다.
