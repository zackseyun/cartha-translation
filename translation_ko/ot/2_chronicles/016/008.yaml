base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
  footnotes:
  - marker: a
    text: Or 'the Ethiopians and the Libyans.' The Hebrew names are rendered here as 'Cushites' and 'Lubites' to stay close to the source ethnonyms.
    reason: lexical_alternative
translation:
  language: ko
  text: 쿠스 사람들과 루브 사람들은 매우 큰 군대였고, 병거와 마병도 아주 많지 않았습니까? 그러나 당신이 야훼를 의지했을 때, 그분이 그들을 당신의 손에 넘겨주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘쿠스 사람들’은 ‘에티오피아 사람들’, ‘루브 사람들’은 ‘리비아 사람들’로도 옮길 수 있습니다. 여기서는 히브리어 민족명에 가깝게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוּשִׁים
  english_pob_choice: the Cushites
  chosen_korean: 쿠스 사람들
  alternatives_korean:
  - 에티오피아 사람들
  - 구스 사람들
  lexicon: HALOT
  rationale: 영어 POB가 음역형 민족명으로 처리한 점을 따라, 후대 지리명으로 굳어질 수 있는 ‘에티오피아 사람들’보다 원문에 가까운 민족명 ‘쿠스 사람들’을 택했습니다.
- source_word: וְהַלּוּבִים
  english_pob_choice: and the Lubites
  chosen_korean: 루브 사람들
  alternatives_korean:
  - 리비아 사람들
  - 루빔 사람들
  lexicon: HALOT
  rationale: 히브리어 고유 민족명을 음역해, 동일한 절의 다른 민족명과 일관되게 원문 근접성을 살렸습니다.
- source_word: הָיוּ לְחַיִל לָרֹב
  english_pob_choice: were ... a very great army
  chosen_korean: 매우 큰 군대가 아니었습니까
  alternatives_korean:
  - 매우 큰 군대였습니다
  - 강대한 군대가 아니었습니까
  lexicon: HALOT
  rationale: 수사적 질문 형식을 살리면서 חַיִל의 군사적 의미를 ‘군대’로 옮겼습니다. ‘아니었습니까’는 기대되는 긍정 답변의 반문 뉘앙스를 유지합니다.
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  english_pob_choice: with chariots and horsemen in great abundance
  chosen_korean: 병거와 마병이 매우 많아
  alternatives_korean:
  - 병거와 마병이 대단히 많아
  - 병거와 기병이 매우 많아
  lexicon: HALOT
  rationale: 병거와 말탄 전력을 구체적으로 드러내는 원문의 병렬을 유지했습니다. ‘마병’은 고대 전투 이미지를 직접적으로 전달합니다.
- source_word: וּבְהִשָּׁעֶנְךָ עַל יְהוָה
  english_pob_choice: Yet when you relied on Yahweh
  chosen_korean: 그러나 당신이 야훼를 의지하셨을 때
  alternatives_korean:
  - 그런데 당신이 야훼를 의지했을 때
  - 야훼를 의지하였을 때
  lexicon: HALOT
  rationale: 문맥상 대조를 분명히 하기 위해 ‘그러나’를 넣고, ‘의지하다’로 히브리어의 비유적 ‘기대다/의탁하다’ 의미를 자연스럽게 살렸습니다.
- source_word: נְתָנָם בְּיָדֶךָ
  english_pob_choice: he gave them into your hand
  chosen_korean: 그분이 그들을 당신의 손에 넘겨주셨습니다
  alternatives_korean:
  - 그분이 그들을 당신의 손에 주셨습니다
  - 그들을 당신 손에 넘기셨습니다
  lexicon: HALOT
  rationale: ‘손에 넘겨주다’는 히브리어 관용구를 한국어에서 가장 자연스럽게 드러내며, 전투에서의 패배/승리를 함축하는 의미를 보존합니다.
theological_decisions:
- issue: יהוה의 번역
