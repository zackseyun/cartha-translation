  alternative_readings:
  - 일관된 ‘당신’ 평서
  - 2인칭 비존대
  rationale: 본문은 아사에게 주는 질책성 반문이므로 현대 합쇼체로 유지하되, 직접 호칭 대상에 대한 존대를 위해 ‘의지하셨을 때’와 같은 높임을 사용했습니다.
