  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י יְהוָ֗ה עֵינָ֞י/ו מְשֹׁטְט֤וֹת בְּ/כָל הָ/אָ֨רֶץ֙ לְ֠/הִתְחַזֵּק עִם לְבָבָ֥/ם שָׁלֵ֛ם אֵלָ֖י/ו נִסְכַּ֣לְתָּ עַל זֹ֑את כִּ֣י מֵ/עַ֔תָּה יֵ֥שׁ עִמְּ/ךָ֖ מִלְחָמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
  footnotes:
  - marker: a
    text: Or 'to show himself strong for those whose heart is blameless toward him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼의 눈이 온 땅을 두루 살피며, 온전한 마음으로 그에게 향하는 사람들에게 강하게 역사하시기 때문입니다[a]. 당신은 이 일에서 어리석게 행하셨습니다. 그러므로 이제부터 당신에게 전쟁이 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음이 그에게 완전한 사람들에게 자신을 강하게 보이시기 위해’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: POB의 기본 원칙에 따라 신적 이름은 학술적 음역인 야훼로 옮겨, 언약적 고유성을 보존했습니다.
- source_word: מְשֹׁטְטוֹת בְּכָל הָאָרֶץ
  english_pob_choice: range throughout all the earth
  chosen_korean: 온 땅을 두루 살피며
  alternatives_korean:
  - 온 땅을 두루 다니며
  - 온 땅을 두루 돌아다니며
  lexicon: HALOT
  rationale: 히브리어의 활동적 순회 이미지를 살리되, 한국어에서는 ‘살피다’가 하나님의 감찰과 관심을 함께 드러내어 문맥에 더 자연스럽습니다.
- source_word: לְהִתְחַזֵּק
  english_pob_choice: to strengthen
  chosen_korean: 강하게 역사하시기
  alternatives_korean:
  - 강하게 하시기
  - 능력을 나타내시기
  lexicon: HALOT
  rationale: 영어 POB의 ‘strengthen’을 따라, 하나님이 누구를 위해 능동적으로 일하시는지 드러나도록 ‘강하게 역사하시기’로 옮겼습니다.
- source_word: עִם לְבָבָם שָׁלֵם אֵלָיו
  english_pob_choice: those whose heart is wholly toward him
  chosen_korean: 온전한 마음으로 그에게 향하는 사람들
  alternatives_korean:
  - 마음이 온전히 그를 향한 사람들
  - 그에게 온전히 마음을 둔 사람들
  lexicon: HALOT
  rationale: שָׁלֵם을 도덕적 무결함보다 ‘분열되지 않은 전적인 충성’으로 이해해, ‘온전한 마음으로 그에게 향하다’로 자연스럽게 풀었습니다.
- source_word: נִסְכַּלְתָּ
  english_pob_choice: You have acted foolishly
  chosen_korean: 당신은 이 일에서 어리석게 행하셨습니다
  alternatives_korean:
  - 당신은 어리석게 행하셨습니다
  - 당신은 어리석은 짓을 하셨습니다
  lexicon: HALOT
  rationale: 예언적 책망의 강도를 유지하면서도 현대 한국어의 공적 문체에 맞게 옮겼습니다.
theological_decisions:
- issue: שָׁלֵם의 의미
  chosen_reading: 죄 없음을 뜻하는 '완전함'이 아니라, 야훼께 대한 분열되지 않은 전적인 마음
  alternative_readings:
  - 흠 없는 마음
  - 완벽한 마음
  rationale: 문맥은 행위의 무결성보다 의지와 신뢰의 방향을 다루므로, ‘온전한 마음’으로 언약적 충성을 드러냈습니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 야훼의 ‘눈’과 ‘강하게 역사하심’
  chosen_reading: 하나님의 전지적 감찰과 그에 따른 능동적 개입을 함께 보존
  alternative_readings:
  - 단순히 지켜보심
  - 사람들을 격려하심
  rationale: 히브리어의 의인화된 표현을 약화하지 않기 위해 ‘눈이… 살피며’와 ‘강하게 역사하시기’를 병치했습니다.
  doctrine_reference: Translation philosophy §2
