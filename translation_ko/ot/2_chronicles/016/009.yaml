revisions:
- from: 이는 야훼의 눈이 온 땅을 두루 살피며, 온전한 마음으로 그에게 향하는 사람들에게 강하게 역사하시기 때문입니다[a]. 당신은 이 일에서 어리석게 행하셨습니다. 그러므로 이제부터 당신에게 전쟁이 있을 것입니다.
  to: 이는 야훼의 눈이 온 땅을 두루 살피며, 마음이 온전히 그를 향한 사람들을 강하게 하시기 때문입니다[a]. 왕께서는 이 일에서 어리석게 행했습니다. 그러므로 이제부터 왕께 전쟁들이 있을 것입니다.
  rationale: 본문의 ‘강하게 역사하시기’를 원문의 목적 표현 및 영어 POB의 ‘to strengthen’에 더 가깝게 ‘사람들을 강하게 하시기 위해’로 고쳤습니다. 아사에게 직접 말하는 문맥에 맞추어 공적 합쇼체에서 자연스러운 ‘왕께서는/왕께’를 사용했습니다. ‘전쟁들’은 히브리어 복수형을 보존하되, 지속적인 전쟁 상태를 뜻하는 문맥도 유지합니다. 각주는 히트파엘의 가능한 대안, 곧 하나님이 자신을 강하게 보이신다는 의미를 명확히 제시합니다.
