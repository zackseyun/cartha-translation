  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/בֵ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּֽי לְ/ךָ֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֞ךְ הָפֵ֣ר בְּרִֽיתְ/ךָ֗ אֶת בַּעְשָׁא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
  footnotes:
  - marker: a
    text: Or 'covenant' or 'alliance' for 'treaty' (Hebrew בְּרִית); here the context is a political pact between kings.
    reason: lexical_alternative
  - marker: b
    text: Literally 'and he may go up from upon me'; the idiom likely means that Baasha would withdraw his pressure or military action from Asa.
    reason: lexical_alternative
translation:
  language: ko
  text: 나와 당신 사이, 그리고 내 아버지와 당신의 아버지 사이에 조약이 있습니다. 보십시오, 제가 당신에게 은과 금을 보냈습니다. 가서, 이스라엘 왕 바아사와 맺은 당신의 조약을 깨십시오[a]. 그러면 그가 저에게서 물러날 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약’, ‘동맹’으로 옮길 수 있습니다. כאן בְּרִית는 왕들 사이의 정치적 조약을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘저에게서 올라가게 할 것입니다’입니다. 여기서는 바아사가 압박이나 군사 행동을 거두는 뜻으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  english_pob_choice: treaty
  chosen_korean: 조약
  alternatives_korean:
  - 언약
  - 동맹
  lexicon: HALOT
  rationale: 왕들 사이의 외교적 합의이므로 교회적 뉘앙스가 강한 ‘언약’보다 정치적 관계를 드러내는 ‘조약’이 원문의 기능을 더 잘 살립니다.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  english_pob_choice: between me and you, and between my father and your father
  chosen_korean: 나와 당신 사이, 그리고 내 아버지와 당신의 아버지 사이
  alternatives_korean:
  - 나와 당신 사이에, 내 아버지와 당신의 아버지 사이에
  - 나와 당신 사이와 내 아버지와 당신의 아버지 사이
  lexicon: HALOT
  rationale: 반복되는 ‘between’을 살려 양측 관계를 병렬로 제시했습니다. 한국어에서는 자연스러운 문장 흐름을 위해 조사와 어순만 최소한으로 조정했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 외교적 연설에서 상대의 주의를 환기하는 감탄을 공손한 명령형으로 옮겨 현대 한국어 합쇼체에 맞추었습니다.
- source_word: וְיַעֲלֶה מֵעָלַי
  english_pob_choice: so that he may withdraw from me
  chosen_korean: 그러면 그가 저에게서 물러날 것입니다
  alternatives_korean:
  - 그러면 그가 저에게서 올라갈 것입니다
  - 그러면 그가 저를 떠날 것입니다
  - 그러면 그가 저에게서 물러나게 하십시오
  lexicon: HALOT
  rationale: 직역의 ‘올라가다’는 한국어에서 의미가 불분명하므로, 본문 맥락의 군사적 압박 해소를 살려 ‘물러나다’로 옮겼습니다.
theological_decisions:
- issue: 예언/신탁이 아니라 왕들 간의 정치적 담화라는 장르
  chosen_reading: 본문을 신학적 선언이 아니라 외교 협상 발화로 유지하고, ‘조약’과 ‘물러나다’로 정치적 의미를 드러냈습니다.
  alternative_readings:
  - 언약적 관계로 강조하기
  - 영적 의미를 덧붙이기
  rationale: 히브리어 בְּרִית의 반복과 문맥상 베아사에게 가해지는 군사적 압박을 고려하면, 본문은 국가 간 협약의 해제 요청으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 왕정사 서술의 문맥 이해
