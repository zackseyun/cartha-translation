  source_fidelity: 첫 문장의 반복된 외교 공식과 ‘조약’의 정치적 의미는 잘 반영했습니다. 그러나 마지막 וְיַעֲלֶה는 앞선 명령에 이어지는 요청/목적의 미완료법(‘그가 물러가게 하십시오/물러나도록’)으로 이해하는 것이 적절합니다. 현행 ‘그러면 … 물러날 것입니다’는 결과를 단정하는 미래 서술로 바꾸어 원문의 화행을 약화합니다.
  naturalness: 전반적으로 현대 표준 한국어 합쇼체에 맞고 자연스럽습니다. 다만 ‘가서,’의 쉼표는 불필요하며, 마지막 문장은 요청의 흐름을 살려 ‘물러가게 하십시오’로 하면 더 자연스럽고 정확합니다.
  terminology: ‘조약’은 왕들 사이의 בְּרִית를 이 문맥에서 적절히 옮깁니다. ‘바아사’, ‘이스라엘 왕’, ‘은과 금’도 적절합니다. 각주 a의 히브리어 앞에 한국어 문장 안에서 부적절하게 삽입된 ‘כאן’은 ‘여기서’로 고쳐야 합니다. 각주 b는 원문의 주어가 바아사이며, ‘올라가게 할 것입니다’가 아니라 요청형이라는 점을 반영해야 합니다.
