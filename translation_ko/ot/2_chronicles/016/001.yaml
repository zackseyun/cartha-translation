source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֵׁשׁ֙ לְ/מַלְכ֣וּת אָסָ֔א עָלָ֞ה בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יוֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the thirty-sixth year of Asa’s reign.'' This creates a chronological tension with 1 Kings’ timeline for Baasha; some understand it as counting from the division of the kingdom, and others propose a harmonizing textual adjustment.'
    reason: alternative_reading
translation:
  language: ko
  text: 아사의 통치 삼십육 년에[a] 이스라엘 왕 바아사가 유다를 치러 올라와 라마를 건축했습니다. 이는 유다 왕 아사에게 드나드는 사람이 없게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아사의 통치 삼십육 년’이라고 읽습니다. 이는 열왕기의 연대와 긴장이 있습니다. 어떤 이들은 왕국 분열 이후부터 계산한 연도로 이해하고, 어떤 이들은 연대를 조화시키기 위한 본문 수정을 제안합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּשְׁנַ֨ת שְׁלֹשִׁ֤ים וָשֵׁשׁ֙ לְמַלְכ֣וּת אָסָ֔א
  english_pob_choice: In the thirty-sixth year of Asa’s reign
  chosen_korean: 아사의 통치 삼십육 년에
  alternatives_korean:
  - 아사의 왕위 삼십육 년에
  - 아사의 치세 삼십육 년에
  lexicon: WLC / HALOT
  rationale: בְּ + ‘year’ 표현은 시점을 나타내므로 ‘~년에’로 옮기고, מַלְכוּת는 왕의 통치 기간이므로 ‘통치’가 가장 직접적입니다.
- source_word: עָלָה ... עַל יְהוּדָה
  english_pob_choice: went up against Judah
  chosen_korean: 유다를 치러 올라와
  alternatives_korean:
  - 유다를 향해 올라와
  - 유다를 공격하러 올라와
  lexicon: WLC / HALOT
  rationale: עלה + על의 군사적 용법을 반영하되, 한국어에서 자연스러운 전쟁 서술인 ‘치러 올라오다’로 옮겼습니다.
- source_word: וַיִּבֶן אֶת הָרָמָה
  english_pob_choice: and built up Ramah
  chosen_korean: 라마를 쌓아 올렸습니다
  alternatives_korean:
  - 라마를 세웠습니다
  - 라마를 건축했습니다
  lexicon: WLC / HALOT
  rationale: בנה는 기본적으로 ‘짓다/건설하다’이지만 문맥상 방어용 시설을 강화하는 뉘앙스가 있어 ‘쌓아 올리다’로 옮겨 의미를 살렸습니다.
- source_word: לְבִלְתִּי תֵּת יוֹצֵא וָבָא
  english_pob_choice: so as not to allow anyone to go out or come in
  chosen_korean: 드나드는 자가 없게 하려는 것이었습니다
  alternatives_korean:
  - 나가거나 들어오는 일이 없게 하려는 것이었습니다
  - 나가고 들어오지 못하게 하려는 것이었습니다
  lexicon: WLC / HALOT
  rationale: 히브리어의 목적/방지 구문과 ‘go out or come in’의 관용적 범위를 한국어 관용인 ‘드나들다’로 압축해 전달했습니다.
theological_decisions:
- issue: ‘라마를 쌓아 올렸다’의 강도와 방어성
  chosen_reading: 직역보다 문맥상 요새화의 뉘앙스를 살리되, 본문의 동사 ‘짓다’ 자체를 과도하게 확대하지는 않았습니다.
  alternative_readings:
  - ‘라마를 건설했습니다’
  - ‘라마를 요새화했습니다’
  rationale: 본문은 단순한 건축 이상을 암시하지만, 히브리어 동사 자체가 명시적으로 ‘요새화하다’는 뜻은 아니므로 의미를 과장하지 않는 선에서 표현했습니다.
  doctrine_reference: 원문 우선 원칙 및 역사서 서술의 문맥 보존
