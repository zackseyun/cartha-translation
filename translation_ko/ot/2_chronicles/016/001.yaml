    rationale: 히브리어 בנה는 ‘짓다, 건축하다’입니다. 문맥상 방어적 목적은 보이지만, 이 동사가 명시적으로 ‘쌓아 올리다’ 또는 ‘요새화하다’를 뜻하지는 않습니다. ‘라마를 건축했습니다’가 더 직접적이고 자연스럽습니다.
  - severity: low
