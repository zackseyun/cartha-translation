    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  english_pob_choice: And when Baasha heard it
  chosen_korean: 그리고 바아사가 그것을 듣자
  alternatives_korean:
  - 바아사가 그것을 들었을 때
  - 바아사가 그것을 들으니
  lexicon: HALOT
  rationale: 히브리어의 זמן 절은 ‘~하자/들으니’로 자연스럽게 옮기되, 앞뒤 사건의 순서를 분명히 드러냈습니다.
- source_word: וַיֶּחְדַּל מִבְּנוֹת אֶת הָרָמָה
  english_pob_choice: he stopped building Ramah
  chosen_korean: 그는 라마를 건축하는 일을 멈추고
  alternatives_korean:
  - 라마를 짓는 일을 중단하고
  - 라마 건축을 멈추고
  lexicon: HALOT
  rationale: חדל + מן + 부정사구는 ‘~하는 일을 멈추다/중단하다’로 옮기는 것이 자연스럽고, 라마는 지명으로서 건축·축성 활동의 대상으로 이해됩니다.
- source_word: וַיַּשְׁבֵּת אֶת מְלַאכְתּוֹ
  english_pob_choice: and ceased his work
  chosen_korean: 자기 일을 그만두었습니다
  alternatives_korean:
  - 자기의 일을 중단했습니다
  - 그의 일을 멈추었습니다
  lexicon: HALOT
  rationale: שׁבת의 사역형은 ‘그치게 하다/그만두다’의 뜻이므로, ‘자기 일’을 멈춘 결과를 자연스러운 현대 한국어로 살렸습니다.
theological_decisions:
- issue: 라마 축성/건축 활동의 의미
  chosen_reading: ‘라마를 건축하는 일’을 단순 건물 신축보다 방어 시설을 세우는 축성·공사로 넓게 이해하되, 본문에는 추가 해석을 넣지 않았습니다.
  alternative_readings:
  - ‘라마를 요새화하는 일’
  - ‘라마를 쌓아 올리는 일’
  rationale: 히브리어는 라마에 대한 건축 활동의 중단을 말하며, 문맥상 축성 의미가 강하지만 본문 자체가 그 범위를 직접 설명하지 않으므로 절제해서 옮겼습니다.
  doctrine_reference: 본문 역사서술의 문맥 이해
