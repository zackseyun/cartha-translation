  source_fidelity: 초안은 매장, 향품을 채운 안치용 침상, 그리고 고인을 위한 큰 불사름이라는 사건 순서를 대체로 따릅니다. 그러나 ‘애통의 불’은 히브리어 שְׂרֵפָה에 없는 애통의 의미를 보태므로 삭제해야 합니다. 또한 히브리어의 복수형 קִבְרוֹתָיו는 왕실 묘역 또는 복수의 묘실을 가리킬 수 있으므로 본문에서 복수의 여지를 보존하는 편이 안전합니다.
  naturalness: ‘무덤에 장사하였는데, 이는 … 것이었습니다’와 ‘침상에 눕혔는데, 이는 … 것이었습니다’는 관계절을 부자연스럽게 분리합니다. ‘향기로운 향품’, ‘여러 가지 섞은 기름’도 중복되거나 어색합니다. 관계절을 선행사에 직접 붙이고, 장례 문맥을 드러내는 ‘안치용 침상’과 ‘조제한 여러 가지 향료’로 다듬었습니다.
  terminology: ‘묘실들’은 히브리어 복수형을 보존하면서 왕실 장지 문맥에 자연스럽습니다. מִשְׁכָּב은 관으로 단정하지 않고 ‘안치용 침상’으로 옮겼습니다. מְרֻקָּחִים 및 בְּמִרְקַחַת מַעֲשֶׂה는 향료 장인의 기술로 조제된 향료라는 뜻으로 반영했습니다. שְׂרֵפָה는 본문에서 ‘불사름’으로 유지하고, 화장 여부를 확정하지 않는 설명을 각주에 두었습니다.
