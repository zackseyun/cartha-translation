revisions:
- from: 그들이 그를 다윗 성에 있는 그의 무덤[a]에 장사하였는데, 이는 그가 자신을 위해 파 놓은 것이었습니다. 또 그를 향기로운 향품과 여러 가지 섞은 기름으로 채운 침상에 눕혔는데, 이는 향료 장인의 솜씨로 만든 것이었습니다[b]. 그리고 그를 위해 매우 큰 애통의 불을 피웠습니다.
  to: 그들이 그를 다윗 성에 있는, 그가 자신을 위하여 파 둔 묘실들[a]에 장사하고, 향품과 향료 장인의 솜씨로 조제한 여러 가지 향료를 가득 채운 안치용 침상에 그를 누였습니다. 그리고 그를 위하여 아주 큰 불사름을 하였습니다[b].
  rationale: 원문의 복수형 묘실과 장례용 불사름의 해석 여지를 보존했습니다. 근거 없이 추가된 ‘애통’을 제거하고, 불사름이 시신 화장이라고 단정하지 않도록 본문은 직역적 표현으로 유지하며 각주만 절제하여 보완했습니다. 또한 관계절과 향료 관련 표현을 현대 표준 한국어 합쇼체에 맞게 자연스럽게 정리하고 각주 b를 해당 표현 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
