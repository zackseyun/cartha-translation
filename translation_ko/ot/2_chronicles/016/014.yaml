source:
  edition: WLC
  text: וַ/יִּקְבְּרֻ֣/הוּ בְ/קִבְרֹתָ֗י/ו אֲשֶׁ֣ר כָּֽרָה ל/וֹ֮ בְּ/עִ֣יר דָּוִיד֒ וַ/יַּשְׁכִּיבֻ֗/הוּ בַּ/מִּשְׁכָּב֙ אֲשֶׁ֤ר מִלֵּא֙ בְּשָׂמִ֣ים וּ/זְנִ֔ים מְרֻקָּחִ֖ים בְּ/מִרְקַ֣חַת מַעֲשֶׂ֑ה וַ/יִּשְׂרְפוּ ל֥/וֹ שְׂרֵפָ֖ה גְּדוֹלָ֥ה עַד לִ/מְאֹֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
  footnotes:
  - marker: a
    text: Or 'bed' or 'couch'; the Hebrew term refers to a place of lying down, here likely a funerary bier.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression 'they made a great burning for him' likely refers to an honorific burning of spices or aromatics at the funeral, not necessarily cremation of the body.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 그를 다윗 성에 있는, 그가 자신을 위하여 파 둔 묘실들[a]에 장사하고, 향품과 향료 장인의 솜씨로 조제한 여러 가지 향료를 가득 채운 안치용 침상에 그를 누였습니다. 그리고 그를 위하여 아주 큰 불사름을 하였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘묘실들’이라는 복수형입니다. 여기서는 왕실 묘역이나 복수의 묘실을 가리킬 수 있으며, 문맥상 하나의 왕실 장지라는 총칭적 의미로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 불사름’은 고인을 위한 장례 예우의 불사름을 가리키는 것으로 이해될 수 있습니다. 향품이나 향료를 태운 행위였을 가능성이 있으나, 본문은 무엇을 태웠는지 명시하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְקִבְרֹתָיו
  english_pob_choice: in his tomb
  chosen_korean: 그의 무덤
  alternatives_korean:
  - 그의 무덤들
  - 그의 매장처
  lexicon: HALOT
  rationale: 히브리어는 복수형이지만, 한국어에서는 왕의 장지/무덤을 자연스럽게 단수로 옮기는 편이 문맥에 맞고, POB의 주해도 단수 의미를 전제합니다.
- source_word: אֲשֶׁר כָּרָה לוֹ
  english_pob_choice: which he had cut out for himself
  chosen_korean: 그가 자신을 위해 파 놓은
  alternatives_korean:
  - 그가 자신을 위해 판
  - 그가 자신을 위해 다듬어 만든
  lexicon: HALOT
  rationale: קָרָה/כָּרָה는 무덤을 ‘파다/깎아 만들다’는 뜻이므로, 석굴 무덤의 맥락을 살려 ‘파 놓은’으로 옮겼습니다.
- source_word: בַּמִּשְׁכָּב
  english_pob_choice: on the bier
  chosen_korean: 침상
  alternatives_korean:
  - 들것
  - 장례용 침상
  - 관
  lexicon: HALOT
  rationale: 이 어휘는 본래 ‘눕는 자리’이지만 장례 문맥에서는 장례용 침상/시신 안치대의 의미가 강하므로, 주석을 달지 않고는 ‘침상’이 가장 원문에 가깝습니다.
- source_word: בְּשָׂמִים וּזְנִים מְרֻקָּחִים
  english_pob_choice: spices and various blended ointments
  chosen_korean: 향기로운 향품과 여러 가지 섞은 기름
  alternatives_korean:
  - 향품과 여러 가지 향유
  - 향료와 각종 섞은 연고
  lexicon: HALOT
  rationale: בְּשָׂמִים과 הַזְּנִים 계열은 장례용 향료/향품을 가리키므로, 한국어에서 과도하게 전례화된 ‘향유’보다 ‘향품’과 ‘기름’을 함께 써서 혼합 향료의 느낌을 살렸습니다.
- source_word: בְּמִרְקַחַת מַעֲשֶׂה
  english_pob_choice: prepared by a perfumer’s craft
  chosen_korean: 향료 장인의 솜씨로 만든
  alternatives_korean:
  - 향료 장인의 기술로 만든
  - 조향사의 솜씨로 만든
  lexicon: HALOT
  rationale: ‘마르카하트 마아세’는 숙련된 조향/제조 작업을 뜻하므로, 현대 한국어에서 이해하기 쉬운 ‘향료 장인’으로 옮겨 장인의 수공을 드러냈습니다.
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְדוֹלָה
  english_pob_choice: and they made a very great burning for him
  chosen_korean: 그를 위해 매우 큰 애통의 불을 피웠습니다
  alternatives_korean:
  - 그를 위해 매우 큰 불사름을 하였습니다
  - 그를 위해 매우 큰 장례의 불을 피웠습니다
  lexicon: HALOT
  rationale: 이 표현은 시신 소각이라기보다 장례적·예우적 화염/향사(향품 소각)를 가리킬 수 있어, 본문 의미를 해치지 않도록 ‘애통의 불’로 처리했습니다.
theological_decisions:
- issue: 여기서의 ‘큰 불사름’의 성격
  chosen_reading: 시신 화장이 아니라 왕의 장례에서 행한 예우적 소각/향료 소각으로 이해했습니다.
  alternative_readings:
  - 시신의 화장
  - 의미가 불분명한 일반적 장례용 화염
  rationale: 본문은 이미 장사와 안치 과정을 말한 뒤에 ‘큰 불’을 언급하므로, 히브리어 관용구를 그대로 살리되 화장으로 단정하지 않는 것이 문맥과 POB 주해에 부합합니다.
  doctrine_reference: 장례 관습 해석
- issue: ‘무덤’의 수와 한국어 표현
  chosen_reading: 히브리어 복수형을 한국어 단수형 ‘무덤’으로 자연화했습니다.
  alternative_readings:
  - 무덤들
  - 묘실들
  rationale: 한국어에서는 특정 왕릉/장지를 복수형으로 직역하면 의미가 어색해질 수 있으며, 본문 의도는 묘역의 규모보다 다윗 성의 왕실 장지에 안장되었다는 사실에 있습니다.
  doctrine_reference: 번역 관용과 문맥 우선
