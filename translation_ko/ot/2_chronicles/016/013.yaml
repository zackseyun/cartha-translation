    issue: ‘누웠다가’는 히브리어 죽음 관용구의 한국어 대응으로 부자연스럽습니다.
    rationale: ‘-았다가’는 보통 뒤따르는 사건에 앞선 일시적 행위를 나타내므로, ‘조상들과 함께 누웠다가 죽었다’는 문자적으로 먼저 누운 뒤 죽었다는 뜻처럼 들릴 수 있습니다. ‘잠들었고’가 관용적 완곡 표현을 더 자연스럽게 전달합니다.
  - severity: low
    issue: ‘아사도’의 ‘도’가 원문에 없는 첨가입니다.
    rationale: 히브리어 주어는 단순히 ‘아사’이며, 대조·첨가를 나타낼 수 있는 보조사 ‘도’는 필요하지 않습니다.
  - severity: low
    issue: 각주의 ‘왕실적 관용구’라는 한정은 본문의 표현을 지나치게 좁힙니다.
    rationale: 이 표현은 왕실 서술에 나타나지만, 그 자체가 왕에게만 고유한 관용구라는 뜻은 아닙니다. 죽음과 조상들 곁에 묻힘을 가리키는 관용구라고 설명하는 편이 정확합니다.
