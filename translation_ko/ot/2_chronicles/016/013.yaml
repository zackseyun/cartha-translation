  to: 아사는 그의 조상들과 함께 잠들었고[a], 왕으로 다스린 지 사십일 년째에 죽었습니다.
  rationale: 원문의 이중 표현, 곧 ‘조상들과 함께 잠들다’와 ‘죽다’를 모두 유지했습니다. 다만 한국어에서 어색하고 시간적 선후를 암시하는 ‘누웠다가’를 ‘잠들었고’로 바꾸고, 불필요한 보조사 ‘도’를 삭제했습니다. 재위 연대는 현대 한국어로 자연스럽게 ‘왕으로 다스린 지 사십일 년째’로 옮겼으며, 각주 표지는 관용구가 나오는 자리로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
