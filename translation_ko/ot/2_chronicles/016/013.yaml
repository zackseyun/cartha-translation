source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֥ב אָסָ֖א עִם אֲבֹתָ֑י/ו וַ/יָּ֕מָת בִּ/שְׁנַ֛ת אַרְבָּעִ֥ים וְ/אַחַ֖ת לְ/מָלְכֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/013.yaml
  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
  footnotes:
  - marker: a
    text: 'Hebrew: ''slept with his fathers,'' a customary expression for death and burial among one''s ancestors.'
    reason: cultural_note
translation:
  language: ko
  text: 아사도 그의 조상들과 함께 누웠다가, 자기 통치 제사십일년에 죽었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘조상들과 함께 누웠다’는 죽음과 매장을 가리키는 왕실적 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 누웠다가
  alternatives_korean:
  - 잠들었다가
  - 쉬었다가
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘조상들과 함께 누웠다’를 살리기 위해 직역에 가깝게 옮기되, 한국어에서는 죽음과 매장을 함께 암시하는 자연스러운 표현으로 처리했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 조상들 곁에
  lexicon: HALOT
  rationale: 왕조 문맥의 장례·매장 관용구이므로, 혈연적 계보를 드러내는 ‘조상들’로 옮겨 원문의 가족/왕조적 뉘앙스를 보존했습니다.
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  english_pob_choice: in the forty-first year
  chosen_korean: 제사십일년에
  alternatives_korean:
  - 마흔한 해에
  - 제41년에
  lexicon: HALOT
  rationale: 연대기 공식의 문체를 살리기 위해 한자어 서수형 ‘제사십일년’을 사용했습니다.
- source_word: לְמָלְכוֹ
  english_pob_choice: of his reign
  chosen_korean: 자기 통치
  alternatives_korean:
  - 그의 왕위 통치
  - 그의 치세
  lexicon: HALOT
  rationale: 히브리어의 통치 기간을 가리키는 연대기 표현을 한국어에서 자연스럽게 풀어 ‘통치’로 옮겼습니다. 다만 ‘reign’의 왕권 맥락은 전체 문맥에서 유지됩니다.
theological_decisions:
- issue: ‘slept with his fathers’와 ‘died’를 함께 유지할지 여부
  chosen_reading: 관용구 ‘누웠다가’와 명시적 서술 ‘죽었습니다’를 함께 유지했습니다.
  alternative_readings:
  - 둘 중 하나만 옮겨 중복을 줄이는 방식
  - ‘잠들었다가 죽었습니다’처럼 완전히 풀이하는 방식
  rationale: 히브리어는 의도적으로 관용적 완곡 표현과 직접 서술을 나란히 둡니다. 둘 다 살려야 왕실 연대기 특유의 정중한 죽음 서술과 사실 진술이 함께 전달됩니다.
  doctrine_reference: 성경 번역의 관용구 보존 원칙
