  text: 그때 아사는 여호와의 집과 왕궁의 곳간에서 은과 금을 꺼내어 다메섹에 사는 아람 왕[a] 벤하닷에게 보내며 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
