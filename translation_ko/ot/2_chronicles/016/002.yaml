base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
  footnotes:
  - marker: a
    text: 'Hebrew: ''king of Aram''; traditionally, ''king of Syria.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아사 왕이 여호와의 집과 왕궁의 곳간에서 은과 금을 꺼내어[a] 아람 왕 벤하닷, 곧 다메섹에 사는 자에게 보내며 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아람 왕’입니다. 전통적으로는 ‘시리아 왕’으로 번역하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  english_pob_choice: brought out
  chosen_korean: 꺼내어
  alternatives_korean:
  - 가져내어
  - 빼내어
  lexicon: HALOT
  rationale: 저장된 곳에서 실제로 밖으로 꺼내는 구체적 동작을 살리면서, 현대 한국어 문맥에서도 자연스럽습니다.
- source_word: מֵאֹצְרוֹת
  english_pob_choice: from the treasuries
  chosen_korean: 곳간에서
  alternatives_korean:
  - 보물창고에서
  - 창고들에서
  lexicon: HALOT
  rationale: 복수형 ‘treasuries’의 저장소 이미지를 살리되, 한국어에서 왕실·성전 보관소를 무리 없이 나타내는 말로 ‘곳간’을 택했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 야훼의 집
  - 여호와 성전
  lexicon: HALOT
  rationale: 원문 그대로는 ‘하나님의 집’이 아니라 언약명 יְהוָה가 붙은 ‘집’이므로, 본문 전통에 따라 ‘여호와의 집’으로 옮겼습니다.
- source_word: מֶלֶךְ אֲרָם
  english_pob_choice: king of Aram
  chosen_korean: 아람 왕
  alternatives_korean:
  - 시리아 왕
  - 아람의 왕
  lexicon: HALOT
  rationale: POB의 원어 우선 원칙에 따라 ארם을 ‘아람’으로 두고, 전통적이지만 해석적인 ‘시리아’는 피했습니다.
theological_decisions:
- issue: YHWH의 한국어 처리
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주님
  rationale: 본문에 신명기적 언약명 יְהוָה가 직접 나오므로, 한국어 본문에서는 기존 POB 기준을 따라 ‘여호와’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
