id: 2CH.16.10
reference: 2 Chronicles 16:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּכְעַ֨ס אָסָ֜א אֶל הָ/רֹאֶ֗ה וַֽ/יִּתְּנֵ֨/הוּ֙ בֵּ֣ית הַ/מַּהְפֶּ֔כֶת כִּֽי בְ/זַ֥עַף עִמּ֖/וֹ עַל זֹ֑את וַ/יְרַצֵּ֥ץ אָסָ֛א מִן הָ/עָ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
  footnotes:
  - marker: a
    text: Or 'the house of the stocks'; the Hebrew expression likely refers to a place of confinement involving restraint.
    reason: lexical_alternative
  - marker: b
    text: Or 'crushed' or 'mistreated'; the Hebrew verb is literally violent and conveys harsh abuse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아사는 선견자에게 화를 내고 그를 감옥에 가두었습니다[a]. 그가 이 일로 그에게 격분했기 때문입니다[b]. 아사는 그때 일부 백성을 억압했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘채찍의 집’; 히브리어 표현은 구속이나 제압이 수반된 구금 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘몹시 미워했기 때문에’, ‘분개했기 때문에’; 히브리어는 강한 분노와 적개심을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאֶה
  english_pob_choice: the seer
  chosen_korean: 선견자
  alternatives_korean:
  - 예언자
  lexicon: HALOT
  rationale: 히브리어 רֹאֶה의 직역은 ‘보는 자’로, 예언자를 가리키는 고유한 칭호이므로 ‘선견자’가 원문 구분을 더 잘 보존합니다.
- source_word: בֵּית הַמַּהְפֶּכֶת
  english_pob_choice: the prison house
  chosen_korean: 감옥
  alternatives_korean:
  - 옥
  - 구금소
  - 감옥집
  lexicon: HALOT
  rationale: 문맥상 단순한 구금 장소를 가리키므로 현대 한국어에서는 ‘감옥’이 가장 자연스럽고, 영어 POB의 ‘prison house’도 이 기능적 의미를 반영합니다.
- source_word: בְזַעַף עִמּוֹ
  english_pob_choice: he was in a rage with him
  chosen_korean: 그에게 격분했습니다
  alternatives_korean:
  - 그에게 몹시 화가 났습니다
  - 그에게 분노했습니다
  lexicon: HALOT
  rationale: זַעַף는 강한 분노를 뜻하므로 ‘격분하다’가 감정의 강도를 잘 살리며, 합쇼체 서술에도 자연스럽습니다.
- source_word: וַיְרַצֵּץ
  english_pob_choice: brutally oppressed
  chosen_korean: 억압했습니다
  alternatives_korean:
  - 짓눌렀습니다
  - 학대했습니다
  - 가혹하게 억눌렀습니다
  lexicon: HALOT
  rationale: 기본 의미는 ‘짓부수다/짓누르다’지만 사람을 목적어로 할 때는 가혹한 억압을 뜻하므로, 본문 전체의 역사 서술에 맞게 ‘억압했습니다’로 옮기고 강한 폭력성은 동사 자체로 과장하지 않았습니다.
theological_decisions:
- issue: 아사가 선견자를 가두고 백성을 억압한 서술의 도덕적 강도
  chosen_reading: 원문의 폭력성과 통치 비판을 완화하지 않고, 단순한 분노 표출이 아니라 권력 남용으로 드러나게 옮겼습니다.
  alternative_readings:
  - 부드럽게 ‘벌했습니다’로 처리
  - ‘불쾌해했습니다’처럼 감정만 강조
  rationale: 히브리어 동사들과 서사 흐름은 아사의 행동이 단순한 기분 상함을 넘어 억압적 처사였음을 보여 주므로, 한국어도 그 윤리적 무게를 유지해야 합니다.
  doctrine_reference: 역사서의 예언자 비판 본문에 나타나는 책임성과 왕권 심판
