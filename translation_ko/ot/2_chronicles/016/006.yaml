base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
  footnotes:
  - marker: a
    text: Or 'summoned/enlisted all Judah'; literally 'took all Judah.'
    reason: lexical_alternative
  - marker: b
    text: That is, the stones and timber Baasha had used to build up Ramah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아사 왕은 온 유다를 데리고 나갔고, 그들이 라마의 돌과 그 목재를 옮겼으니, 이는 바아사가 쌓은 것이었습니다. 아사는 그것들로 게바와 미스바를 건축하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  english_pob_choice: took all Judah
  chosen_korean: 온 유다를 데리고 나갔고
  alternatives_korean:
  - 온 유다를 소집했고
  - 온 유다를 동원했고
  lexicon: HALOT
  rationale: 직역의 '데리고'는 히브리어의 'take'를 살리면서도, 문맥상 아사가 유다 사람들을 불러 모아 작업에 참여시켰다는 뜻을 자연스럽게 드러냅니다.
- source_word: וַיִּשְׂאוּ אֶת אַבְנֵי הָרָמָה וְאֶת עֵצֶיהָ
  english_pob_choice: they carried away the stones of Ramah and its timber
  chosen_korean: 라마의 돌과 그 목재를 옮겼으니
  alternatives_korean:
  - 라마의 돌과 그 나무를 옮겼으니
  - 라마의 돌과 그 재목을 옮겼으니
  lexicon: HALOT
  rationale: וַיִּשְׂאוּ의 이동 의미를 '옮겼다'로 살리고, 건축 자재임을 반영해 '목재'를 선택했습니다.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  english_pob_choice: with which Baasha had built
  chosen_korean: 이는 바아사가 쌓은 것이었습니다
  alternatives_korean:
  - 이는 바아사가 지은 것이었습니다
  - 바아사가 그것들로 라마를 건축했습니다
  lexicon: HALOT
  rationale: 관계절이 앞의 돌과 목재 전체를 가리키므로 '그것들로'를 뒤 문장에 풀어 주어, 바아사가 라마를 세울 때 사용한 자재라는 뜻을 분명히 했습니다.
- source_word: גֶּבַע וְאֶת הַמִּצְפָּה
  english_pob_choice: Geba and Mizpah
  chosen_korean: 게바와 미스바
  alternatives_korean:
  - 게바와 미스바
  - 게바와 그 미스바
  lexicon: HALOT
  rationale: 지명은 한국어 음역 관례를 따라 표준적으로 옮겼습니다.
