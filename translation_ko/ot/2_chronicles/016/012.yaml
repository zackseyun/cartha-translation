source:
  edition: WLC
  text: וַ/יֶּחֱלֶ֣א אָסָ֡א בִּ/שְׁנַת֩ שְׁלוֹשִׁ֨ים וָ/תֵ֤שַׁע לְ/מַלְכוּת/וֹ֙ בְּ/רַגְלָ֔י/ו עַד לְ/מַ֖עְלָ/ה חָלְי֑/וֹ וְ/גַם בְּ/חָלְי/וֹ֙ לֹא דָרַ֣שׁ אֶת יְהוָ֔ה כִּ֖י בָּ/רֹפְאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
  footnotes:
  - marker: a
    text: Or 'did not inquire of the LORD, but from the physicians.' The Hebrew clause is elliptical and contrasts seeking the LORD with turning to physicians.
    reason: lexical_alternative
translation:
  language: ko
  text: 아사가 다스린 지 서른아홉째 해에 발에 병이 들어, 그 병이 매우 심해졌습니다. 그러나 그는 병 중에도 야훼를 찾지 않고 의사들을 찾았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼를 찾다’와 ‘의사들’을 대조합니다. 후반부에는 앞의 동사 ‘찾다’가 생략되어 있습니다. 따라서 ‘의사들에게 구했다’로 풀어 옮길 수도 있지만, 본문은 그 대조를 살려 ‘의사들을 찾았습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  english_pob_choice: became diseased
  chosen_korean: 병이 들어
  alternatives_korean:
  - 병이 났습니다
  - 아프게 되었습니다
  lexicon: HALOT
  rationale: חלה는 단순한 일시적 아픔보다 병들어 약해지는 상태를 가리키므로, 현대 한국어에서 자연스럽고 지속성을 살리는 ‘병이 들어’로 옮겼습니다.
- source_word: בְּרַגְלָיו
  english_pob_choice: in his feet
  chosen_korean: 그의 발에
  alternatives_korean:
  - 그의 다리에
  - 그의 발목에
  lexicon: HALOT
  rationale: רֶגֶל은 기본적으로 ‘발’이므로, 병의 위치를 직접 드러내는 ‘그의 발에’가 가장 स्रोत에 가깝습니다.
- source_word: דָרַשׁ אֶת יְהוָה
  english_pob_choice: did not seek Yahweh
  chosen_korean: 야훼를 찾지 않고
  alternatives_korean:
  - 야훼께 구하지 않고
  - 야훼를 찾지 않았고
  lexicon: HALOT
  rationale: דרש의 하나님 대상 용례는 단순한 정보 문의보다 관계적·신앙적 ‘찾음’의 뜻이 강하므로, POB의 의도를 따라 ‘찾다’로 옮겼습니다.
- source_word: בָּרֹפְאִים
  english_pob_choice: the physicians
  chosen_korean: 의사들을
  alternatives_korean:
  - 의사들에게
  - 의사들만
  lexicon: HALOT
  rationale: 히브리어는 전치사가 생략된 압축 표현이므로, 앞의 ‘야훼를 찾지 않고’와 대비가 분명하도록 목적어로 자연스럽게 풀어 ‘의사들을’로 옮겼습니다.
theological_decisions:
- issue: ‘야훼를 찾지 않고, 의사들을 찾았다’의 대비를 어떻게 살릴 것인가
  chosen_reading: 의학적 도움 자체를 부정하기보다, 구원의 최종적 의지처를 야훼가 아니라 의사들로 돌린 대비를 드러냈습니다.
  alternative_readings:
  - 의사들을 찾았다는 점만 중립적으로 서술하기
  - 의사들을 의지했다는 뉘앙스를 더 강하게 넣기
  rationale: 히브리어는 ‘야훼를 찾다’와 ‘의사들’ 사이의 대조를 통해 아사의 신앙적 실패를 보여 주므로, 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
