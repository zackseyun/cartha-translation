  naturalness: 현대 표준 한국어와 합쇼체 서술로 대체로 자연스럽습니다. ‘야훼, 당신의 하나님’처럼 동격을 쉼표로 분명히 하면 호칭 관계가 더 자연스럽고 명료합니다.
  terminology: ‘선견자’, ‘아람’, ‘야훼’, ‘의지하다’는 원문의 용어와 문맥에 적절합니다. 각주가 제시하는 대안은 본문 ‘아람 왕’의 대안이어야 하는데, 현재 각주가 본문과 같은 ‘아람 왕’을 대안으로 제시하여 기능하지 않습니다.
