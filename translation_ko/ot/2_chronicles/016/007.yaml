  - severity: medium
    issue: 각주 a의 대안어 오류
    rationale: 각주는 영어 POB의 ‘Syria/시리아 왕’ 대안을 반영해야 합니다. 현재 ‘또는 아람 왕’은 본문과 동일하여 대안이 아니며, ‘히브리어는 아람’이라는 설명과도 실질적 대조를 이루지 못합니다.
