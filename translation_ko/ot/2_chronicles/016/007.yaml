base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
  footnotes:
  - marker: a
    text: Or “the king of Syria.” The Hebrew reads “Aram.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 한니 선견자가 유다 왕 아사에게 와서 그에게 말했습니다. 「아람 왕을 의지하고 야훼 당신의 하나님을 의지하지 않았으므로, 아람 왕의 군대가 당신의 손에서 벗어났습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아람 왕”입니다. 히브리어는 “아람”이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시각에
  - 그때
  lexicon: HALOT
  rationale: 시간 전환을 자연스러운 현대 한국어로 옮기되, 문맥의 단순한 서술 전환을 살렸습니다.
- source_word: הָרֹאֶה
  english_pob_choice: the seer
  chosen_korean: 선견자
  alternatives_korean:
  - 예언자
  - 보는 자
  lexicon: HALOT
  rationale: רֹאֶה의 직역적 의미를 살리면서도 한국어에서 직무 호칭으로 자연스럽게 읽히는 표현을 택했습니다.
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  english_pob_choice: Because you relied ... and did not rely
  chosen_korean: 의지하고 ... 의지하지 않았으므로
  alternatives_korean:
  - 기대고 ... 기대지 않았으므로
  - 믿고 ... 믿지 않았으므로
  lexicon: HALOT
  rationale: שׁען의 비유적 ‘의존/신뢰’ 의미를 한국어의 '의지하다'로 유지하여 두 동사의 반복 대조를 보존했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: the LORD your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 네 하나님
  - 주 당신의 하나님
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 규범에 따라 신명은 '야훼'로 옮기고, 2인칭 직접 책망 화법에 맞게 '당신의'를 사용했습니다.
- source_word: מִיָּדֶךָ
  english_pob_choice: from your hand
  chosen_korean: 당신의 손에서
  alternatives_korean:
  - 당신의 손에서 벗어나
  - 당신의 권세에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 통제·패배의 이미지를 유지했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 직접 나타난 여호와 신명을 이 프로젝트 기본어인 '야훼'로 드러내어 본문의 언약적 책망을 가리지 않도록 했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
