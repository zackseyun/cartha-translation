revisions:
- from: 그때에 한니 선견자가 유다 왕 아사에게 와서 그에게 말했습니다. 「아람 왕을 의지하고 야훼 당신의 하나님을 의지하지 않았으므로, 아람 왕의 군대가 당신의 손에서 벗어났습니다.」[a]
  to: 그때에 하나니 선견자가 유다 왕 아사에게 와서 그에게 말했습니다. 「아람 왕[a]을 의지하고 야훼, 당신의 하나님을 의지하지 않았으므로, 아람 왕의 군대가 당신의 손에서 벗어났습니다.」
  rationale: 히브리어 인명 חֲנָנִי를 ‘하나니’로 바로잡았습니다. 원문의 신명-동격 구조를 한국어에서 명료하게 하기 위해 ‘야훼, 당신의 하나님’으로 표기했습니다. 또한 어휘 대안 각주를 ‘시리아 왕’으로 수정하고 ‘아람 왕’에 직접 연결했습니다. 그 밖의 문장 구조와 원문의 인과 관계 및 ‘의지하다’의 반복은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:18:04Z'
