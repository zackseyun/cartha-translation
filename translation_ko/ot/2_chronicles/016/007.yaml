base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
  footnotes:
  - marker: a
    text: Or “the king of Syria.” The Hebrew reads “Aram.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 하나니 선견자가 유다 왕 아사에게 와서 그에게 말했습니다. 「아람 왕[a]을 의지하고 야훼, 당신의 하나님을 의지하지 않았으므로, 아람 왕의 군대가 당신의 손에서 벗어났습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시리아 왕”입니다. 히브리어는 “아람”이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
