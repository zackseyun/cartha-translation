base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/004.yaml
  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
  footnotes:
  - marker: a
    text: Or 'and advanced as far as Jerusalem.' The Hebrew says literally 'came as far as Jerusalem,' emphasizing that he reached Jerusalem after taking Judah's fortified cities.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 유다에 속한 견고한 성읍들을 함락하고 예루살렘까지 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘까지 진격했습니다.’ 히브리어는 문자적으로 ‘예루살렘까지 왔다’고 말하여, 유다의 견고한 성읍들을 함락한 뒤 예루살렘까지 이르렀음을 강조합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכֹּד
  english_pob_choice: captured
  chosen_korean: 점령하고
  alternatives_korean:
  - 사로잡고
  - 빼앗고
  lexicon: HALOT
  rationale: 성읍을 전쟁으로 ‘붙잡다/빼앗다’는 뜻을 자연스럽게 살리면서, 현대 한국어에서 군사적 점유를 분명히 드러내는 말로 옮겼습니다.
- source_word: עָרֵי הַמְּצֻרוֹת
  english_pob_choice: the fortified cities
  chosen_korean: 견고한 성들
  alternatives_korean:
  - 요새화된 성들
  - 견고한 도시들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘요새화된 성읍들’이지만, 한국어에서는 ‘성들’이 군사적으로 방어된 도시를 자연스럽게 드러내며 문맥에 잘 맞습니다.
- source_word: אֲשֶׁר לִיהוּדָה
  english_pob_choice: that belonged to Judah
  chosen_korean: 유다의
  alternatives_korean:
  - 유다에 속한
  - 유다에 속한 것
  lexicon: HALOT
  rationale: 소유 또는 귀속을 나타내는 ל의 의미를 간결하게 살려, ‘유다의’로 자연스럽고 압축적으로 표현했습니다.
- source_word: וַיָּבֹא עַד יְרוּשָׁלָם
  english_pob_choice: and came as far as Jerusalem
  chosen_korean: 예루살렘까지 이르렀습니다
  alternatives_korean:
  - 예루살렘까지 왔습니다
  - 예루살렘에 이르렀습니다
  lexicon: HALOT
  rationale: עַד의 도달 한계를 살려 ‘까지’와 ‘이르렀습니다’를 사용해, 예루살렘에 도달했음을 말하되 반드시 입성했다는 뜻으로 좁히지 않았습니다.
theological_decisions:
- issue: 예루살렘 도달 표현의 범위
  chosen_reading: ‘예루살렘까지 이르렀습니다’로 옮겨, 도달 지점은 분명히 하되 도시 내부 진입 여부는 열어 두었습니다.
  alternative_readings:
  - ‘예루살렘에 들어갔습니다’
  - ‘예루살렘까지 진군했습니다’
  rationale: 히브리어 בוא + עַד는 도달의 한계를 나타내므로, 본문이 말하는 수준을 넘지 않도록 번역했습니다.
  doctrine_reference: 본문 의미 보존과 서사적 정확성
