revisions:
- from: 르호보암의 왕국이 확고해지고 그가 강성해졌을 때, 그는 야훼의 율법을 버렸습니다. 그리고 온 이스라엘도 그와 함께했습니다.[a]
  to: 르호보암의 왕국이 굳게 세워지고 그가 강성해졌을 때, 그는 야훼의 율법을 버렸으며, 온 이스라엘도 그와 함께 버렸습니다.[a]
  rationale: The revision preserves the temporal-circumstantial structure of the Hebrew and retains “온 이스라엘” without narrowing its scope. It makes explicit in idiomatic Korean that Israel joined Rehoboam in abandoning Yahweh's law, which is the force of the Hebrew's final elliptical phrase. No doctrinal interpretation has been added.
