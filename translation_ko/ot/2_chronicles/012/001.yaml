base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
  footnotes:
  - marker: a
    text: Or 'the instruction of the LORD.' The Hebrew torah can mean 'law' or 'instruction,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 르호보암의 왕국이 굳게 세워지고 그가 강성해졌을 때, 그는 야훼의 율법을 버렸으며, 온 이스라엘도 그와 함께 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법’ 또는 ‘교훈’으로 번역할 수 있습니다. 히브리어 토라는 문맥에 따라 ‘법’이나 ‘가르침/교훈’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהָכִין מַלְכוּת
  english_pob_choice: was established
  chosen_korean: 왕국이 확고해지고
  alternatives_korean:
  - 왕국이 세워지고
  - 왕국이 확립되고
  - 왕권이 확고해지고
  lexicon: HALOT
  rationale: כְּהָכִין은 단순한 존재가 아니라 왕국의 안정적 성립·정착을 가리키므로, 한국어에서는 ‘확고해지다’로 왕권의 굳어짐을 자연스럽게 드러냈습니다.
- source_word: וּכְחֶזְקָתוֹ
  english_pob_choice: and he had become strong
  chosen_korean: 그가 강성해졌을 때
  alternatives_korean:
  - 그가 강해졌을 때
  - 그가 강성해지고
  - 그가 힘을 얻었을 때
  lexicon: HALOT
  rationale: חזק의 상태 완성 의미를 살려, 단순 상태보다 ‘강성해지다’로 왕의 세력·안정이 갖춰진 뒤라는 시간 배경을 분명히 했습니다.
- source_word: עָזַב
  english_pob_choice: abandoned
  chosen_korean: 버렸습니다
  alternatives_korean:
  - 떠났습니다
  - 저버렸습니다
  - 버려 두었습니다
  lexicon: HALOT
  rationale: 언약적 이탈의 뉘앙스를 살리되 한국어에서 과도하게 문어적인 ‘저버리다’보다, 본문 행위의 단호함이 드러나는 ‘버리다’를 택했습니다.
- source_word: תּוֹרַת יְהוָה
  english_pob_choice: the law of Yahweh
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 야훼의 가르침
  - 야훼의 토라
  - 주님의 율법
  lexicon: HALOT
  rationale: 토라의 의미 범위는 넓지만, 이 역사·언약 문맥에서는 POB의 ‘law’에 대응해 ‘율법’이 가장 직접적입니다. 신명 대신 본문 명칭을 따라 ‘야훼’를 유지했습니다.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  english_pob_choice: and all Israel with him
  chosen_korean: 그리고 온 이스라엘도 그와 함께했습니다
  alternatives_korean:
  - 그리고 온 이스라엘이 그와 함께 있었습니다
  - 그리고 모든 이스라엘이 그와 함께했습니다
  lexicon: HALOT
  rationale: 히브리어의 압축된 결구를 한국어에서는 자연스럽게 풀어, ‘함께했다’로 동조·동참의 의미를 살렸습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 여호와 대신 학술적 음역 ‘야훼’를 유지해 원문 신명 표지를 가립니다.
  doctrine_reference: Source-language primacy; divine name transliteration policy
- issue: ‘온 이스라엘’의 범위
  chosen_reading: 문자 그대로 ‘온 이스라엘’을 유지했습니다.
  alternative_readings:
  - 유다
  - 그의 백성
  rationale: 열왕기·역대기 맥락상 역사적 범위를 해석으로 좁히지 않고, 본문의 표현과 그 신학적 긴장을 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
