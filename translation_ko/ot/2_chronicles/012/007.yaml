base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
  footnotes:
  - marker: a
    text: Or “I will give them a little escape” or “I will grant them a few survivors.” The Hebrew phrase is compact and may emphasize limited rescue rather than total destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그들이 자신을 낮추는 것을 보시자, 야훼의 말씀이 스마야에게 임하여 이렇게 말씀하셨습니다. “그들이 자신을 낮추었습니다. 나는 그들을 멸하지 않겠습니다. 그들에게 얼마간의 구원을 베풀겠으며[a], 내 분노를 시삭을 통하여 예루살렘 위에 쏟아붓지 않겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 조금의 도피를 주겠다’ 또는 ‘그들에게 몇 사람의 생존자를 주겠다’로 옮길 수 있습니다. 히브리어 표현은 압축되어 있으며, 완전한 멸망이 아니라 제한된 구제 또는 남은 자를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB가 신명사 표기를 직접 살리는 방침이므로, 전통적 대체칭호인 ‘여호와/주님’ 대신 학술적 음역 ‘야훼’를 유지했습니다.
- source_word: נִכְנָעוּ
  english_pob_choice: they had humbled themselves
  chosen_korean: 자신을 낮추는 것
  alternatives_korean:
  - 스스로 겸손해지는 것
  - 자신을 낮추는 것
  lexicon: HALOT
  rationale: 니팔형 כנע는 단순히 ‘낮아지다’가 아니라 반성적·자기비하적 의미를 가지므로, 문맥상 ‘자신을 낮추다’로 옮겼습니다.
- source_word: הָיָה דְבַר יְהוָה אֶל שְׁמַעְיָה לֵאמֹר
  english_pob_choice: the word of Yahweh came to Shemaiah, saying
  chosen_korean: 야훼의 말씀이 스마야에게 임하여 말씀하셨습니다
  alternatives_korean:
  - 야훼의 말씀이 스마야에게 이르러 말씀하셨습니다
  - 야훼께서 스마야에게 말씀하셨습니다
  lexicon: HALOT
  rationale: 예언 공식인 ‘말씀이 …에게 임하다’를 살려, 단순한 ‘말하다’보다 계시의 도착감을 보존했습니다.
- source_word: לִפְלֵיטָה
  english_pob_choice: some deliverance
  chosen_korean: 약간의 구원
  alternatives_korean:
  - 조금의 도피
  - 몇 사람의 생존
  lexicon: HALOT
  rationale: כִמְעַט לִפְלֵיטָה는 압축된 표현이라 ‘구원/도피/생존자’ 가능성이 있으나, 여기서는 심판 완화의 의미를 가장 자연스럽게 드러내는 ‘약간의 구원’을 택했습니다.
- source_word: בְּיַד שִׁישָׁק
  english_pob_choice: by the hand of Shishak
  chosen_korean: 시삭의 손에 의해
  alternatives_korean:
  - 시삭을 통해
  - 시삭의 손으로
  lexicon: HALOT
  rationale: 히브리어의 행위자 표현을 보존하되, 한국어에서는 ‘손에 의해’가 가장 직역에 가깝고 문맥상도 분명합니다.
theological_decisions:
- issue: ‘a little deliverance’의 분량과 성격
  chosen_reading: ‘약간의 구원’으로 옮겨 제한된 구조를 드러냈습니다.
  alternative_readings:
  - ‘조금의 도피’
  - ‘몇 사람의 생존’
  - ‘조금의 구출’
  rationale: 원문은 완전한 해방이 아니라 제한된 구제를 말하므로, 그 긴장을 흐리지 않도록 범위를 좁게 유지했습니다.
  doctrine_reference: 2 Chronicles 12:7 source wording and POB audit note on כִמְעַט לִפְלֵיטָה
