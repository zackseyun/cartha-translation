source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
  footnotes:
  - marker: a
    text: Or 'the runners,' that is, the royal guard.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'them' refers to the bronze shields mentioned in the previous verse.
    reason: cross_reference
  - marker: c
    text: Or 'guardroom.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 야훼의 집에 들어갈 때마다, 경호병들이 와서 그것들을 가져다가 경호병의 방으로 되돌려 놓았습니다.[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘달리는 자들’, 곧 왕의 경호병들.
    reason: lexical_alternative
  - marker: b
    text: ‘그것들’은 바로 앞절에 언급된 놋 방패들을 가리킵니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘경호실’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  english_pob_choice: whenever ... entered
  chosen_korean: ~할 때마다
  alternatives_korean:
  - ~할 때
  - ~할 때마다 반복하여
  lexicon: HALOT
  rationale: 반복적 발생을 나타내는 관용구이므로, 단발 사건이 아닌 반복성을 살려 ‘~할 때마다’로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 직역 구조를 유지해 ‘집’과 신명 표기를 살렸고, 문맥상 성전이지만 원문 표현을 보존했습니다.
- source_word: הָרָצִים
  english_pob_choice: the guards
  chosen_korean: 경호병들
  alternatives_korean:
  - 달리는 자들
  - 왕의 호위병들
  lexicon: HALOT
  rationale: 왕실 문맥에서 기능상 호위·경비를 맡는 집단이므로, ‘달리는 자들’의 문자성을 넘기되 군사적 기능을 드러내는 ‘경호병들’로 옮겼습니다.
- source_word: תָּא
  english_pob_choice: guardroom
  chosen_korean: 방
  alternatives_korean:
  - 경호실
  - 작은 방
  - 보관실
  lexicon: HALOT
  rationale: 영어 POB가 주석으로 ‘guardroom’ 가능성을 보이지만, 한국어 본문은 자연스럽게 읽히는 ‘방’으로 두고, 필요하면 주석에서 용어 대안을 처리할 수 있게 했습니다.
theological_decisions:
- issue: 야훼 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: WLC의 יְהוָה를 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨 언약 անուն의 직접성을 보존했습니다.
  doctrine_reference: Project glossary — יהוה / YHWH → 야훼
