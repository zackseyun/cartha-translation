  - 마병
  lexicon: פָּרָשׁ
  rationale: 말을 타고 전투에 참여한 병력을 뜻하므로 ‘기병’이 군사적 의미를 가장 자연스럽게 반영합니다.
- source_word: וְאֵין מִסְפָּר לָעָם
  english_pob_choice: were without number
  chosen_korean: 셀 수 없이 많았습니다
  alternatives_korean:
  - 수가 없었습니다
  - 헤아릴 수 없었습니다
  lexicon: אֵין מִסְפָּר
  rationale: 직역하면 ‘수가 없습니다’이지만 한국어에서는 ‘셀 수 없이 많다’가 원문의 과장법을 자연스럽게 살립니다.
- source_word: סֻכִּיִּים
  english_pob_choice: Sukkites
  chosen_korean: 수키 사람들
  alternatives_korean:
  - 수킷 사람들
  - 숙기 사람들
  lexicon: סֻכִּיִּים
  rationale: 정확한 정체가 불확실한 집단명이므로 음역을 유지하되, 한국어 표기에서는 발음을 반영해 ‘수키 사람들’로 옮겼습니다.
- source_word: וְכוּשִׁים
  english_pob_choice: Cushites
  chosen_korean: 구스 사람들
  alternatives_korean:
  - 에티오피아 사람들
  lexicon: כּוּשִׁים
  rationale: 히브리어의 민족·지명적 용례를 더 직접적으로 반영하는 표기를 택해, 해석적 대체어인 ‘에티오피아 사람들’은 피했습니다.
theological_decisions:
- issue: 무수함을 나타내는 표현
  chosen_reading: ‘셀 수 없이 많았습니다’로 옮겨 전쟁 동원 규모의 압도성을 살렸습니다.
  alternative_readings:
  - ‘헤아릴 수 없었습니다’
  - ‘무수했습니다’
  rationale: 본문은 실제로 수를 세지 못한다는 의미를 넘어, 매우 큰 다수임을 강조하는 문맥이므로 한국어 과장법으로 힘을 유지하는 것이 적절합니다.
  doctrine_reference: 문맥상 역사 서술의 수사이며 교리적 쟁점은 없습니다.
