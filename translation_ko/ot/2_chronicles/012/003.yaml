  - 천이백 수레
  lexicon: רֶכֶב
  rationale: 전투용 병거를 가리키므로 현대어로는 ‘병거’가 가장 직접적이며, 수량 표현은 원문의 숫자 구조를 그대로 따랐습니다.
- source_word: פָּרָשִׁים
  english_pob_choice: horsemen
  chosen_korean: 기병
