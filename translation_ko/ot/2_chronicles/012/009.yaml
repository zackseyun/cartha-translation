  terminology: ‘야훼의 집’은 프로젝트의 신명 방침과 בית יהוה의 직역을 따릅니다. ‘왕의 집’도 원문의 대구를 유지합니다. 다만 각 대안 각주는 해당 표현 바로 뒤에 붙어야 하며, 기존 표지는 서로 잘못 연결되어 있습니다.
