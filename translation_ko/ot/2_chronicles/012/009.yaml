source:
  edition: WLC
  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
  footnotes:
  - marker: a
    text: Or 'the temple of the LORD' for 'the house of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the royal palace' for 'the king’s house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 시삭, 곧 이집트 왕이 예루살렘으로 올라와 야훼의 집의 창고들과 왕의 집의 창고들을 빼앗아 갔습니다. 그는 모든 것을 가져갔습니다[b]. 또한 솔로몬이 만들었던 금 방패들도 가져갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와의 성전’으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕실’을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  english_pob_choice: came up against Jerusalem
  chosen_korean: 예루살렘으로 올라와
  alternatives_korean:
  - 예루살렘을 치러 올라와
  - 예루살렘에 대하여 올라와
  lexicon: HALOT
  rationale: 군사적 상황의 עלה + עַל은 ‘올라오다/쳐 올라오다’의 관용을 살리는 것이 자연스럽고, 본문이 말하는 침공의 방향을 충분히 드러냅니다.
- source_word: אֹצְרוֹת
  english_pob_choice: treasuries
  chosen_korean: 창고들
  alternatives_korean:
  - 보물창고들
  - 금고들
  lexicon: HALOT
  rationale: 성전과 왕궁에서 빼앗긴 귀중품의 보관 장소를 가리키므로, 단순한 ‘보물’보다 저장소 성격을 드러내는 ‘창고들’이 원문에 더 가깝습니다.
- source_word: בֵּית יְהוָה / יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  lexicon: HALOT
  rationale: 여호와의 집이라는 전통적 한국어 대신, 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨 본문의 성전 지칭을 직접 보존했습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king’s house
  chosen_korean: 왕의 집
  alternatives_korean:
  - 왕궁
  - 왕의 궁전
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘왕의 집’이 ‘야훼의 집’과의 대구를 가장 분명하게 살리므로, 궁전으로 의역하지 않았습니다.
- source_word: אֶת הַכֹּל לָקָח
  english_pob_choice: He took everything
  chosen_korean: 모든 것을 가져갔습니다
  alternatives_korean:
  - 그는 다 가져갔습니다
  - 그는 그것들을 모두 빼앗았습니다
  lexicon: HALOT
  rationale: 완전한 약탈을 강조하는 총칭 표현으로, 한국어에서도 ‘모든 것’을 분명히 드러내는 것이 원문의 총체성을 보존합니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼로 옮겨 성전 표현 ‘야훼의 집’으로 유지했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 직접 나타난 신명 יְהוָה를 프로젝트 기본값대로 음역하여, 성전 명칭의 언약적 고유성을 희석하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
