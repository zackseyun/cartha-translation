  source_fidelity: ‘예루살렘으로 올라와’는 עלה + עַל의 군사적 대상을 충분히 드러내지 못합니다. ‘예루살렘을 치러 올라와’로 옮겨 침공의 뜻을 보존하는 것이 안전합니다. ‘그 모든 것을’은 앞의 두 보물 창고의 내용 전체를 취했다는 אֶת־הַכֹּל לָקָח의 총괄을 자연스럽게 반영합니다.
