  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתֵּי/הֶ֔ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
  footnotes:
  - marker: a
    text: Hebrew 'the runners,' likely referring to the royal guards or couriers who served as palace guards.
    reason: lexical_alternative
  - marker: b
    text: That is, bronze shields replacing the gold shields taken by Shishak (see the previous verse).
    reason: cross_reference
translation:
  language: ko
  text: 솔로몬 왕 르호보암은 그들 대신에 놋 방패를 만들고, 그것을 궁전 문을 지키는 경비대 지휘관들의 책임 아래 맡겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘달리는 자들’은 왕실의 경호병이나 전령을 가리키는 표현일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 앞 절에서 시삭이 가져간 금 방패를 대신한 놋 방패입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: made
  chosen_korean: 만들고
  alternatives_korean:
  - 제작하고
  - 지어
  lexicon: HALOT
  rationale: עשה의 기본 의미를 자연스럽게 살려, 현대 한국어 서술문에서 가장 직접적인 ‘만들다’로 옮겼습니다.
- source_word: תַּחְתֵּיהֶם
  english_pob_choice: in their place
  chosen_korean: 그들 대신에
  alternatives_korean:
  - 그 자리에서
  - 그 자리에
  - 그들을 대신하여
  lexicon: HALOT
  rationale: 직전 절에서 빼앗긴 금 방패를 가리키는 대체 의미를 분명히 드러내기 위해 ‘대신에’를 사용했습니다.
- source_word: מָגִנֵּי נְחֹשֶׁת
  english_pob_choice: bronze shields
  chosen_korean: 놋 방패
  alternatives_korean:
  - 청동 방패
  - 구리 방패
  lexicon: HALOT
  rationale: 무기·방패 문맥에서는 한국어 성경 전통에서 널리 쓰이는 ‘놋’이 가장 자연스럽고, 청동/구리보다 문맥 적합성이 높습니다.
- source_word: שָׂרֵי הָרָצִים
  english_pob_choice: commanders of the guards
  chosen_korean: 경비대 지휘관들
  alternatives_korean:
  - 달리는 자들의 지휘관들
  - 왕실 경호대의 지휘관들
  - 시종들의 지휘관들
  lexicon: HALOT
  rationale: ‘달리는 자들’의 문자 의미를 보존하기보다, 왕궁 출입을 지키는 기능을 드러내는 한국어로 풀어 ‘경비대’로 옮겼습니다.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  english_pob_choice: the entrance of the king’s house
  chosen_korean: 궁전 문
  alternatives_korean:
  - 왕의 집 문
  - 왕궁 어귀
  - 왕의 궁전 입구
  lexicon: HALOT
  rationale: בֵּית הַמֶּלֶךְ는 왕의 거처인 왕궁을 가리키므로, 현대 독자가 이해하기 쉬운 ‘궁전 문’으로 옮기되 출입 통제의 장소라는 점을 살렸습니다.
theological_decisions:
- issue: 사실 서술에서 왕호 표기와 무기 교체의 의미 전달
  chosen_reading: ‘르호보암 왕’과 ‘그들 대신에’로, 정황상 금 방패를 대신한 놋 방패의 대체성을 분명히 했습니다.
  alternative_readings:
  - ‘유다 왕 르호보암’
  - ‘대신하여’
  - ‘그 자리에’
  rationale: 본문의 초점은 군사적 장식의 쇠락과 대체 조치에 있으므로, 직전 문맥의 상실과 대조가 드러나도록 옮겼습니다.
  doctrine_reference: 문맥 충실성과 역사서 서술의 연속성
- issue: הָרָצִים의 사회적 기능
  chosen_reading: 문자적 ‘달리는 자들’보다 왕궁을 지키는 실무 기능을 드러내는 ‘경비대’로 옮겼습니다.
  alternative_readings:
  - ‘달리는 자들’
  - ‘왕실 시종들’
  - ‘왕의 사자들’
  rationale: 이 용어는 궁정 연락병이면서 경호 역할도 수행하는 집단을 가리킬 수 있어, 본문 기능상 오해를 줄이는 번역이 필요합니다.
  doctrine_reference: 역사적·사회언어학적 문맥 반영
