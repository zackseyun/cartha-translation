  source_fidelity: 첫머리의 ‘솔로몬 왕 르호보암’은 히브리어 הַמֶּלֶךְ רְחַבְעָם(르호보암 왕)과 맞지 않으며, 솔로몬과 르호보암을 혼동한 중대한 인명·역사 오류입니다. 또한 복수인 방패를 받는 대명사는 ‘그것들을’이 적절합니다. 나머지 핵심 구문은 대체로 원문에 충실합니다.
  naturalness: ‘경비대 지휘관들의 책임 아래 맡겼습니다’는 뜻은 통하지만 현대 한국어로 다소 무겁고 어색합니다. ‘궁전 문을 지키는 경비대의 지휘관들에게 맡겼습니다’가 히브리어의 수식 관계와 위탁 의미를 자연스럽게 드러냅니다.
  terminology: ‘놋 방패’는 성경 문체에서 자연스럽고 נְחֹשֶׁת의 통상적 문맥 번역으로 적절합니다. הָרָצִים을 ‘경비대’로 기능 번역한 것은 가능하며, 문자적 의미와 역사적 범위를 각주로 보존한 점도 적절합니다. ‘궁전 문’은 왕의 집의 입구라는 뜻을 자연스럽게 전달합니다.
