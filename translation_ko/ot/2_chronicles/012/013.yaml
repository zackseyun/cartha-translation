  source_fidelity: 본문의 주요 정보(르호보암의 즉위 연령, 17년 통치, 예루살렘의 선택, 나아마의 암몬 출신)는 보존되어 있습니다. 그러나 וַיִּתְחַזֵּק의 반사적·정치적 강화 의미를 ‘스스로 굳건해져서’로 옮긴 것은 한국어에서 부자연스럽고, ‘그 예루살렘은 … 성읍입니다’는 과거 서술 안에 현재형 설명문을 삽입하여 원문의 예루살렘 동격 수식을 충분히 반영하지 못합니다. b 각주의 내용도 해당 위치의 원문 및 번역과 관련되지 않습니다.
