id: 2CH.12.13
reference: 2 Chronicles 12:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
  footnotes:
  - marker: a
    text: Or 'established himself in Jerusalem.' The Hebrew verb can denote becoming strong or firmly established.
    reason: lexical_alternative
  - marker: b
    text: Or 'strengthened himself in Jerusalem and reigned'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리하여 르호보암 왕은 예루살렘에서 스스로 굳건해져서 다스렸습니다[a]. 르호보암은 왕이 되기 시작할 때 마흔한 살이었고, 예루살렘에서 십칠 년 동안 다스렸습니다. 그 예루살렘은 야훼께서 이스라엘의 모든 지파 가운데에서 자기 이름을 두시려고 선택하신 성읍입니다[b]. 그의 어머니의 이름은 암몬 여인 나아마였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예루살렘에서 스스로 굳건해졌습니다.’ 히브리어 동사는 ‘강해지다’ 또는 ‘굳게 서다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다스렸습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  english_pob_choice: strengthened himself
  chosen_korean: 스스로 굳건해져서
  alternatives_korean:
  - 스스로 강해져서
  - 권력을 굳혔고
  lexicon: HALOT
  rationale: 히트파엘형의 반사적·점진적 뉘앙스를 살리기 위해 단순히 ‘다스렸다’로 흡수하지 않고, 권력 기반이 안정되는 의미를 드러내는 ‘스스로 굳건해져서’를 택했습니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: and reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 왕 노릇을 했습니다
  lexicon: HALOT
  rationale: 앞 동사의 결과로 이어지는 왕권 행사를 자연스러운 현대 한국어로 표현했습니다.
- source_word: בְּמָלְכוֹ
  english_pob_choice: when he began to reign
  chosen_korean: 왕이 되기 시작할 때
  alternatives_korean:
  - 즉위할 때
  - 통치하기 시작할 때
  lexicon: HALOT
  rationale: 접속사 בְּ+부정사구의 시간표현을 살려, 단순한 연령 정보가 아니라 즉위 시점을 분명히 했습니다.
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  english_pob_choice: to put his name there
  chosen_korean: 자기 이름을 두시려고
  alternatives_korean:
  - 자기 이름을 두려고
  - 자기 이름을 두게 하시려고
  lexicon: HALOT
  rationale: ‘이름을 두다’라는 성소-언약 관용구를 보존해, 의미를 신학적으로 풀어쓰지 않고 원문의 구체성을 유지했습니다.
- source_word: הָעַמֹּנִית
  english_pob_choice: the Ammonite
  chosen_korean: 암몬 여인
  alternatives_korean:
  - 암몬 사람 여인
  - 암몬 사람
  lexicon: HALOT
  rationale: 나아마의 출신을 여성형으로 분명히 하되, 한국어에서 어색한 ‘암몬 여자’보다 자연스러운 민족 출신 표지로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 고유한 언약명인 יְהוָה를 직역적 관습어인 ‘주’로 가리지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘자기 이름을 두시려고’라는 성전/예루살렘 선택 공식
  chosen_reading: 원문의 관용구를 유지하고 ‘임재’ 같은 설명적 확대는 하지 않음
  alternative_readings:
  - 자기 임재를 두시려고
  - 거기에서 자기 이름이 거하게 하시려고
  rationale: 히브리어는 예루살렘을 선택하신 목적을 ‘이름을 두다’로 말하므로, 본문이 말하는 수준을 넘는 신학적 풀이는 피했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
