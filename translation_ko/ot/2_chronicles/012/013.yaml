revisions:
- from: 그리하여 르호보암 왕은 예루살렘에서 스스로 굳건해져서 다스렸습니다[a]. 르호보암은 왕이 되기 시작할 때 마흔한 살이었고, 예루살렘에서 십칠 년 동안 다스렸습니다. 그 예루살렘은 야훼께서 이스라엘의 모든 지파 가운데에서 자기 이름을 두시려고 선택하신 성읍입니다[b]. 그의 어머니의 이름은 암몬 여인 나아마였습니다.
  to: 르호보암 왕은 예루살렘에서 세력을 굳히고 다스렸습니다[a]. 르호보암은 왕위에 올랐을 때 마흔한 살이었으며, 야훼께서 이스라엘의 모든 지파 가운데서 자신의 이름을 그곳에 두시려고 선택하신 성읍 예루살렘에서 십칠 년 동안 다스렸습니다. 그의 어머니의 이름은 암몬 사람 나아마였습니다.
  rationale: 첫 동사는 문맥상 왕권의 공고화를 나타내는 자연스러운 표현인 ‘세력을 굳히고’로 조정했습니다. 즉위 연령 공식은 ‘왕위에 올랐을 때’로 다듬었고, 예루살렘을 수식하는 선택 공식을 원문의 구조에 맞게 통치 장소와 결합했습니다. 잘못된 b 각주는 삭제했으며, a 각주는 실제 어휘 대안을 제시하도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:16:52Z'
