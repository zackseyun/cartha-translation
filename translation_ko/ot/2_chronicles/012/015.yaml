  text: וְ/דִבְרֵ֣י רְחַבְעָ֗ם הָ/רִאשֹׁנִים֙ וְ/הָ/אֲ֣חַרוֹנִ֔ים הֲ/לֹא הֵ֨ם כְּתוּבִ֜ים בְּ/דִבְרֵ֨י שְׁמַֽעְיָ֧ה הַ/נָּבִ֛יא וְ/עִדּ֥וֹ הַ/חֹזֶ֖ה לְ/הִתְיַחֵ֑שׂ וּ/מִלְחֲמ֧וֹת רְחַבְעָ֛ם וְ/יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: Now the acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
  footnotes:
  - marker: a
    text: Or 'in the genealogical records,' or 'for genealogical enrollment.' The Hebrew phrase is difficult and may describe the form or purpose of the source material associated with Iddo.
    reason: lexical_alternative
translation:
  language: ko
  text: 르호보암의 첫째 일과 나중 일이 모두 스마야 선지자와 잇도 선견자의 기록—계보 등록에 관한 것인가—에 기록되어 있지 않습니까? 르호보암과 여로보암 사이에는 그들의 평생 동안 전쟁이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘계보 등록을 따라’, 혹은 ‘계보 등록을 위해’. 히브리어 구절은 난해하며, 잇도와 관련된 자료의 형식이나 목적을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי
  english_pob_choice: acts
  chosen_korean: 일
  alternatives_korean:
  - 행적
  - 일들
  - 사적
  lexicon: HALOT
  rationale: 왕의 통치 요약 공식에서 דִבְרֵי는 단순한 ‘말’보다 재위의 행적과 사건들을 가리키므로, 간결하고 역사서 문맥에 맞는 ‘일’로 옮겼습니다.
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  english_pob_choice: the first and the last
  chosen_korean: 첫째 일과 나중 일
  alternatives_korean:
  - 처음과 마지막
  - 처음부터 끝까지의 일
  - 처음 일과 마지막 일
  lexicon: HALOT
  rationale: 히브리어의 대구 구조를 살리면서도 한국어에서 자연스럽게 왕의 통치 전체를 가리키도록 옮겼습니다.
- source_word: בְּדִבְרֵי שְׁמַעְיָה ... וְעִדּוֹ
  english_pob_choice: in the records of Shemaiah ... and of Iddo
  chosen_korean: 스마야 선지자와 잇도 선견자의 기록
  alternatives_korean:
  - 스마야의 기록과 잇도의 기록
  - 스마야 선지자와 잇도 선견자의 문서
  - 스마야 선지자와 잇도 보자의 기록
  lexicon: HALOT
  rationale: בְּדִבְרֵי를 문서 자료를 가리키는 ‘기록’으로 처리했고, נָבִיא/חֹזֶה는 각각 ‘선지자’와 ‘선견자’로 구분해 두 호칭의 차이를 보존했습니다.
- source_word: לְהִתְיַחֵשׂ
  english_pob_choice: according to genealogical enrollment
  chosen_korean: 계보 등록에 관한 것인가
  alternatives_korean:
  - 계보적으로 등록된 것인가
  - 계보 기록을 위한 것인가
  - 계보 등록을 따라
  lexicon: HALOT
  rationale: 어려운 לשון을 과도하게 풀지 않고, 기록의 성격이나 용도를 시사하는 난해성을 한국어에서도 드러내도록 ‘관한 것인가’로 처리했습니다.
- source_word: וּמִלְחֲמוֹת ... כָּל הַיָּמִים
  english_pob_choice: And there were wars ... all their days
  chosen_korean: 전쟁이 있었습니다 ... 그들의 평생 동안
  alternatives_korean:
  - 전쟁이 계속되었습니다 ... 모든 날 동안
  - 전쟁이 있었습니다 ... 그 모든 날 동안
  lexicon: HALOT
  rationale: 연대기적 요약을 자연스러운 서술형으로 옮기되, כָּל הַיָּמִים의 지속성을 ‘평생 동안’으로 분명히 했습니다.
theological_decisions:
- issue: 예언자 직함의 번역 구분
  chosen_reading: נָבִיא는 ‘선지자’, חֹזֶה는 ‘선견자’로 구분해 서로 다른 예언 직함을 유지했습니다.
  alternative_readings:
  - 둘 다 ‘선지자’로 통일
  - חֹזֶה를 ‘환상가’로 번역
  rationale: 히브리어 본문이 두 직함을 나란히 두므로, 한국어에서도 직함의 구분을 보존하는 편이 source-direct합니다.
  doctrine_reference: 원문 직함 구분 보존
- issue: 계보 관련 난구의 처리
  chosen_reading: לְהִתְיַחֵשׂ는 의미를 단정하지 않고 문장 안에 난해성을 남겨 두었습니다.
  alternative_readings:
  - ‘계보 등록을 위해’로 단정
  - ‘계보에 따라’로 평탄화
  rationale: 본문 자체가 애매하므로, 해석을 과도하게 확정하기보다 독자가 난점의 존재를 알 수 있게 하는 것이 더 충실합니다.
  doctrine_reference: 본문 난해구 보존
