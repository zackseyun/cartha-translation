base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/016.yaml
  text: And Rehoboam slept with his fathers and was buried in the city of David[a], and Abijah his son reigned in his place.
  footnotes:
  - marker: a
    text: Hebrew 'slept with his fathers,' a customary expression for death and joining the ancestral line.
    reason: lexical_alternative
translation:
  language: ko
  text: 르호보암은 그의 조상들과 함께 잠들어 다윗의 성읍에 묻혔으며[a], 그의 아들 아비야가 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘조상들과 함께 잠들다’는 죽음과 조상 대열에 합류함을 가리키는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들어
  alternatives_korean:
  - 누워
  - 죽어
  lexicon: HALOT
  rationale: 왕의 죽음을 가리키는 관용 표현을 살리기 위해 직설적인 ‘죽어’보다 ‘잠들어’를 택했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 조상들과
  lexicon: HALOT
  rationale: 동족서사의 관용구를 자연스럽게 옮기되, 한국어에서 의미가 분명하도록 ‘조상들’로 풀었습니다.
- source_word: בְּעִיר דָּוִיד
  english_pob_choice: in the city of David
  chosen_korean: 다윗의 성읍에
  alternatives_korean:
  - 다윗 성읍에
  - 다윗의 도시로
  lexicon: HALOT
  rationale: 성경의 익숙한 지명을 유지하면서도 현대 한국어 문장 흐름에 맞게 옮겼습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 뒤를 이어
  alternatives_korean:
  - 그의 자리에
  - 그를 대신하여
  lexicon: HALOT
  rationale: 왕위 승계를 나타내는 תחתיו의 의미를 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 왕의 죽음에 대한 관용 표현의 보존
  chosen_reading: ‘잠들어’로 옮겨 죽음과 왕조적 연속성을 함께 드러냈습니다.
  alternative_readings:
  - ‘죽어’로 평이하게 번역
  - ‘묻혀’만으로 의미를 처리
  rationale: 히브리어 관용구를 유지하면 본문의 공식적 왕위 계승 문체가 보존되며, 뒤의 매장 진술이 의미를 분명히 합니다.
  doctrine_reference: 구약 역사서의 관용적 사망 공식
