  text: כִּ֥י יִהְיוּ ל֖/וֹ לַ/עֲבָדִ֑ים וְ/יֵדְעוּ֙ עֲב֣וֹדָתִ֔/י וַ/עֲבוֹדַ֖ת מַמְלְכ֥וֹת הָ/אֲרָצֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his slaves[a], so that they may know my service and the service of the kingdoms of the lands.
  footnotes:
  - marker: a
    text: Or 'my worship ... and the service of the kingdoms of the lands.' The Hebrew word for 'service' can include worshipful service as well as servitude or labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들이 그의 종들이 되어, 나를 섬기는 일과 여러 나라의 왕국들을 섬기는 일이 어떤 것인지 알게 될 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 예배하는 일 ... 여러 나라의 왕국들을 섬기는 일.’ 히브리어 ‘섬김’은 예배로 드리는 섬김뿐 아니라 종속이나 노동도 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ ... לַעֲבָדִים
  english_pob_choice: they will become his slaves
  chosen_korean: 그의 종들이 되어
  alternatives_korean:
  - 그의 노예가 되어
  - 그의 종이 될 것이므로
  lexicon: HALOT
  rationale: עֲבָדִים는 문맥상 예속 상태를 가리키며, 한국어에서는 현대 합쇼체에서 ‘노예’가 너무 직접적이고 ‘종’이 더 넓게 읽히므로, 본문 의미를 살리되 문체를 유지하는 방향으로 ‘종들이 되어’라고 옮겼습니다.
- source_word: וְיֵדְעוּ
  english_pob_choice: so that they may know
  chosen_korean: 알게 될 것입니다
  alternatives_korean:
  - 그래서 알게 될 것입니다
  - 알게 하려는 것입니다
  lexicon: HALOT
  rationale: 앞 절과 이어지는 결과·목적 뉘앙스를 한국어에서 자연스럽게 풀어, 예속의 결과로 ‘알게 될 것입니다’라고 번역했습니다.
- source_word: עֲבוֹדָתִי
  english_pob_choice: my service
  chosen_korean: 나의 섬김
  alternatives_korean:
  - 나의 봉사
  - 나의 예배
  lexicon: HALOT
  rationale: עֲבוֹדָה는 ‘섬김/봉사/예배’의 폭이 있으나, 여기서는 여호와께 대한 언약적 섬김과 열방의 섬김이 병렬되므로 ‘섬김’이 가장 넓고도 직접적입니다.
- source_word: וַעֲבוֹדַת מַמְלְכ֥וֹת הָ/אֲרָצֽוֹת
  english_pob_choice: and the service of the kingdoms of the lands
  chosen_korean: 이 땅의 나라들의 섬김
  alternatives_korean:
  - 그 땅들의 왕국들의 섬김
  - 열방의 나라들의 섬김
  lexicon: HALOT
  rationale: 히브리어의 복수적 ‘땅들/나라들’ 구조를 살리면서도 한국어에서 가장 자연스러운 정치적 표현으로 ‘이 땅의 나라들’이라고 옮겼습니다.
theological_decisions:
- issue: עֲבָדִים를 한국어에서 ‘종’으로 둘지 ‘노예’로 둘지
  chosen_reading: ‘종’으로 두되, 문맥상 예속·복속의 강한 의미를 유지했습니다.
  alternative_readings:
  - 노예
  - 종이 아니라 하인/섬김꾼
  rationale: 본문은 르호보암의 백성이 느부갓네살식 종속 상태로 떨어지는 정치적·징계적 맥락이지만, 한국어 ‘노예’는 현대어에서 지나치게 인신매매적 뉘앙스를 띠어 합쇼체 본문 흐름을 해칠 수 있어, 예속 의미를 잃지 않는 ‘종’을 선택했습니다.
  doctrine_reference: Translation philosophy §3, §5
