source:
  edition: WLC
  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''from before Shishak,'' that is, because of or in fear of Shishak.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 스마야 예언자가 르호보암과 예루살렘에 시삭 때문에 모여 있던 유다의 지도자들에게 와서 그들에게 말했습니다. "야훼께서 이렇게 말씀하십니다. 너희가 나를 버렸으므로 나도 너희를 시삭의 손에 넘겼습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘시삭 앞에서’이며, 곧 시삭의 진격을 두려워하거나 그 때문에 모였다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: וּשְׁמַעְיָה הַנָּבִיא
  english_pob_choice: Then Shemaiah the prophet
  chosen_korean: 그때 스마야 예언자가
  alternatives_korean:
  - 그리고 스마야 예언자가
  - 이때 스마야 예언자가
  lexicon: HALOT
  rationale: 서술 전개를 자연스럽게 이어 주는 וּ를 한국어 서술 관용에 맞게 ‘그때’로 옮기고, נָבִיא는 ‘예언자’로 옮겨 현대 한국어에서 이해하기 쉽게 했습니다.
- source_word: וְשָׂרֵי יְהוּדָה
  english_pob_choice: and the officials of Judah
  chosen_korean: 유다의 지도자들
  alternatives_korean:
  - 유다의 관원들
  - 유다의 통치자들
  lexicon: HALOT
  rationale: שָׂרִים은 문맥상 왕실/국정 지도층을 가리키므로, ‘관원’보다 넓고 자연스러운 ‘지도자들’로 옮겼습니다.
- source_word: מִפְּנֵי שִׁישָׁק
  english_pob_choice: because of Shishak
  chosen_korean: 시삭 때문에
  alternatives_korean:
  - 시삭 앞에서
  - 시삭을 두려워하여
  - 시삭의 위협 때문에
  lexicon: HALOT
  rationale: 직역하면 ‘시삭 앞에서’이지만 여기서는 원인·상황을 드러내는 뜻이므로, 본문 흐름을 해치지 않는 범위에서 ‘때문에’로 자연스럽게 옮겼습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 주님께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: יִהְוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 선지자 전언 공식은 현대 한국어에서 가장 자연스러운 직접 인용 형식으로 처리했습니다.
- source_word: עֲזַבְתֶּם אֹתִי / עָזַבְתִּי אֶתְכֶם
  english_pob_choice: You have forsaken me / have forsaken you
  chosen_korean: 너희가 나를 버렸으므로 나도 너희를 ... 넘겼습니다
  alternatives_korean:
  - 너희가 나를 떠났으므로 나도 너희를 떠났습니다
  - 너희가 나를 버렸으므로 나도 너희를 버렸습니다
  lexicon: HALOT
  rationale: 같은 동사를 반복해 상호 대응을 살리되, 마지막 절은 한국어에서 ‘시삭의 손에 넘기다’가 더 자연스럽고 히브리어 수동적 내맡김의 뜻을 잘 드러내므로 ‘넘겼습니다’로 옮겼습니다.
- source_word: בְּיַד שִׁישָׁק
  english_pob_choice: into the hand of Shishak
  chosen_korean: 시삭의 손에
  alternatives_korean:
  - 시삭의 권세 아래
  - 시삭에게
  lexicon: HALOT
  rationale: 히브리어의 관용구를 살려 ‘손에’로 옮겨, 단순한 소유가 아니라 권력 아래로 넘겨진다는 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 표준에 따라 신명기적 언약 이름을 가리는 관용 번역 대신, 원문에 드러난 신명 자체를 직접 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 선지자 전언 공식의 한국어 인용 톤
  chosen_reading: '"야훼께서 이렇게 말씀하십니다"로 현대적 직접 인용을 유지했습니다.'
  alternative_readings:
  - '"야훼가 이렇게 말합니다"'
  - '"주님께서 이렇게 말씀하십니다"'
  rationale: 히브리어의 공적 선포 형식을 살리면서도 현대 문체의 합쇼체에 맞추어, 신탁 인용이 분명히 드러나도록 했습니다.
  doctrine_reference: Korean style / prophetic speech register
