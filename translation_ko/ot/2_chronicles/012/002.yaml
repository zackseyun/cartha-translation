  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
  footnotes:
  - marker: a
    text: Or, 'had been unfaithful to the LORD' or 'had trespassed against the LORD.' The Hebrew verb carries the sense of breach of faith or covenantal unfaithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 르호보암 왕 제오년에 이집트 왕 시삭이 예루살렘을 치러 올라왔습니다. 이는 그들이 야훼께 신의를 저버렸기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מעל은 신의나 언약을 저버리는 행위를 가리킵니다. ‘야훼께 불충하였다’ 또는 ‘야훼를 배반하였다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
