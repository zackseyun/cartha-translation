- source_word: עָלָה ... עַל יְרוּשָׁלִָם
  english_pob_choice: came up against Jerusalem
  chosen_korean: 예루살렘을 치러 올라왔는데
  alternatives_korean:
  - 예루살렘을 향해 올라왔는데
  - 예루살렘을 공격하러 올라왔는데
  lexicon: HALOT
  rationale: עלה + על의 군사적 용례를 살려 단순 이동이 아니라 적대적 침공을 드러냈습니다. ‘치러 올라오다’는 한국어 성경 문맥에서 이 동작을 비교적 직접적으로 전달합니다.
- source_word: מָעֲלוּ בַּיהוָה
  english_pob_choice: had acted unfaithfully against Yahweh
  chosen_korean: 그들이 야훼께 범죄하였기 때문입니다
  alternatives_korean:
  - 그들이 야훼께 신실하지 않았기 때문입니다
  - 그들이 야훼를 배반하였기 때문입니다
  lexicon: HALOT
  rationale: מעל의 핵심은 언약적 불성실/배신이므로 ‘범죄하다’로 도덕적·언약적 위반을 압축해 옮겼습니다. 전통적 ‘불충’보다 행위의 위반성과 결과를 더 분명히 드러냅니다.
theological_decisions:
