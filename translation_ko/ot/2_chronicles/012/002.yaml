  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
  footnotes:
  - marker: a
    text: Or, 'had been unfaithful to the LORD' or 'had trespassed against the LORD.' The Hebrew verb carries the sense of breach of faith or covenantal unfaithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕 르호보암의 다섯째 해에, 이집트 왕 시삭이 예루살렘을 치러 올라왔는데, 그들이 야훼께 범죄하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מעל은 단순한 일반적 ‘불신’보다 언약을 어기는 배신·불충의 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  english_pob_choice: in the fifth year of King Rehoboam
  chosen_korean: 솔로몬 왕 르호보암의 다섯째 해에
  alternatives_korean:
  - 르호보암 왕의 다섯째 해에
  - 르호보암 왕의 통치 5년째에
  lexicon: WLC regnal formula
  rationale: 레호보암의 왕권 연대를 한국어로 자연스럽게 옮기되, ‘다섯째 해’로 원문의 연대 표현을 보존했습니다. ‘솔로몬 왕 르호보암’은 본문상 ‘왕’의 직함을 살리면서도 문맥상 명확성을 높입니다.
- source_word: עָלָה ... עַל יְרוּשָׁלִָם
  english_pob_choice: came up against Jerusalem
  chosen_korean: 예루살렘을 치러 올라왔는데
  alternatives_korean:
  - 예루살렘을 향해 올라왔는데
  - 예루살렘을 공격하러 올라왔는데
  lexicon: HALOT
  rationale: עלה + על의 군사적 용례를 살려 단순 이동이 아니라 적대적 침공을 드러냈습니다. ‘치러 올라오다’는 한국어 성경 문맥에서 이 동작을 비교적 직접적으로 전달합니다.
- source_word: מָעֲלוּ בַּיהוָה
  english_pob_choice: had acted unfaithfully against Yahweh
  chosen_korean: 그들이 야훼께 범죄하였기 때문입니다
  alternatives_korean:
  - 그들이 야훼께 신실하지 않았기 때문입니다
  - 그들이 야훼를 배반하였기 때문입니다
  lexicon: HALOT
  rationale: מעל의 핵심은 언약적 불성실/배신이므로 ‘범죄하다’로 도덕적·언약적 위반을 압축해 옮겼습니다. 전통적 ‘불충’보다 행위의 위반성과 결과를 더 분명히 드러냅니다.
theological_decisions:
- issue: 야훼에 대한 언약적 위반의 인과 설명
  chosen_reading: 그들이 야훼께 범죄하였기 때문입니다
  alternative_readings:
  - 그들이 야훼께 불충하였기 때문입니다
  - 그들이 야훼를 배반하였기 때문입니다
  rationale: 역대기는 시삭의 침공을 단순한 국제정세가 아니라 야훼께 대한 언약 위반의 심판으로 해석합니다. 본 번역은 그 신학적 인과를 약화하지 않도록 직접적으로 표현했습니다.
  doctrine_reference: 역대하의 보응 신학
