  rationale: 역대기는 시삭의 침공을 단순한 국제정세가 아니라 야훼께 대한 언약 위반의 심판으로 해석합니다. 본 번역은 그 신학적 인과를 약화하지 않도록 직접적으로 표현했습니다.
