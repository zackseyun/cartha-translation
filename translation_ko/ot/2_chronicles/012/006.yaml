  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the leaders of Israel.'' In this context some understand this to refer specifically to Judah''s leaders under Rehoboam, but the text itself says ''Israel.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그때 이스라엘의 지도자들[a]과 왕이 스스로를 낮추고 말했습니다. “야훼는 의로우십니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 지도자들’이라고 말합니다. 이 문맥에서 일부는 이것이 르호보암 아래의 유다 지도자들을 가리킨다고 이해하지만, 본문 자체는 ‘이스라엘’이라고 되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  english_pob_choice: humbled themselves
  chosen_korean: 스스로를 낮추고
  alternatives_korean:
  - 겸손해지고
  - 스스로 굴복하고
  lexicon: HALOT
  rationale: 니팔형 כנע는 단순한 외적 복종보다 자신을 낮추는 반응을 나타내므로, 문맥의 회개·응답 성격을 살려 ‘스스로를 낮추고’로 옮겼습니다.
- source_word: שָׂרֵי יִשְׂרָאֵל
  english_pob_choice: the leaders of Israel
  chosen_korean: 이스라엘의 지도자들
  alternatives_korean:
  - 이스라엘의 방백들
  - 이스라엘의 관리들
  lexicon: HALOT
  rationale: שָׂרֵי는 통치층을 가리키는 말이지만, 현대 한국어에서는 ‘지도자들’이 가장 자연스럽고 본문의 공식적·대표적 뉘앙스를 잘 전달합니다.
- source_word: צַדִּיק
  english_pob_choice: righteous
  chosen_korean: 의로우십니다
  alternatives_korean:
  - 의롭습니다
  - 옳으십니다
  lexicon: HALOT
  rationale: 야훼의 판단과 성품에 대한 선언이므로, 단순한 ‘옳다’보다 신학적 무게가 있는 ‘의롭다’를 사용했고, 하나님께 대한 존대를 반영해 ‘-십니다’로 마무리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 고유신명 יְהוָה를 제목이나 대체어로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
theological_decisions:
- issue: 이스라엘을 유다로 조화시킬지 여부
  chosen_reading: ‘이스라엘의 지도자들’로 그대로 유지했습니다.
  alternative_readings:
  - ‘유다의 지도자들’로 조화함
  - ‘이스라엘’에 각주를 달아 역사적 긴장을 완화함
  rationale: 히브리어 본문이 분명히 ‘이스라엘’이라고 말하므로, 역사적 설명을 위해 본문을 수정하지 않고 원문 표현을 보존했습니다.
  doctrine_reference: 원어 우선 원칙; 번역 전통보다 원문 문구 보존
