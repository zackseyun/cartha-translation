  source_fidelity: 수정이 필요합니다. 초안은 כנע의 재귀적 의미, 야훼의 분노가 르호보암에게서 돌아선 점, 그리고 유다의 ‘좋은 것들’이라는 넓은 표현을 대체로 잘 반영합니다. 그러나 ‘분노가 ... 돌아서서 그를 ... 멸하지 않으셨고’는 주어가 ‘분노’에서 존대 주어인 ‘야훼’로 부자연스럽게 전환됩니다. 또한 히브리어의 ‘멸하다’에는 목적어가 명시되지 않으므로 이를 번역문에서 단정적으로 ‘그를’로 보충하지 않는 편이 안전합니다.
  naturalness: ‘야훼의 분노가 그에게서 돌아섰고, 야훼께서는 완전히 멸하지 않으셨습니다’는 현대 표준어 합쇼체로 자연스럽고, 원문의 연결 관계도 분명하게 전달합니다. ‘유다에도 또한’보다는 문두의 ‘또한 유다에는’이 더 자연스럽습니다.
  terminology: ‘야훼’, ‘분노’, ‘멸하다’, ‘유다’는 일관되고 적절합니다. ‘좋은 것들’은 다소 일반적이지만 דְּבָרִים טוֹבִים의 의도적인 포괄성을 보존하므로 유지하는 것이 좋습니다.
  issues:
