id: 2CH.12.12
reference: 2 Chronicles 12:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/הִכָּֽנְע֗/וֹ שָׁ֤ב מִמֶּ֨/נּוּ֙ אַף יְהוָ֔ה וְ/לֹ֥א לְ/הַשְׁחִ֖ית לְ/כָלָ֑ה וְ/גַם֙ בִּֽ/יהוּדָ֔ה הָיָ֖ה דְּבָרִ֥ים טוֹבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
  footnotes:
  - marker: a
    text: Or, 'the LORD's anger turned back from him.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'good things'; the phrase is broad and may refer to commendable conditions, actions, or matters in Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자신을 낮추었을 때[a], 야훼의 분노가 그에게서 돌아서서 그를 완전히 멸하지 않으셨고[b], 유다에도 또한 좋은 것들이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그가 스스로를 낮추었을 때’
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘그를 완전히 멸하기 위해서가 아니라’에 가깝습니다. 문맥상 심판의 전면 철회가 아니라 완화로 읽는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  english_pob_choice: when he humbled himself
  chosen_korean: 그가 자신을 낮추었을 때
  alternatives_korean:
  - 그가 스스로 겸손해졌을 때
  - 그가 자신을 굽혔을 때
  lexicon: HALOT
  rationale: 히트파엘형 כנע의 반사적 의미를 살려, 단순히 ‘낮아짐을 당했다’가 아니라 스스로를 낮춘 행위를 나타내도록 옮겼습니다.
- source_word: אַף יְהוָה
  english_pob_choice: the anger of Yahweh
  chosen_korean: 야훼의 분노
  alternatives_korean:
  - 야훼의 진노
  - 야훼의 노여움
  lexicon: HALOT
  rationale: אַף의 관용적 뜻인 ‘분노’를 자연스럽게 살리되, 본문에 있는 신적 분노의 직접성을 유지했습니다.
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  english_pob_choice: so as not to destroy him completely
  chosen_korean: 그를 완전히 멸하지 않으셨고
  alternatives_korean:
  - 그를 전멸시키지 않으셨고
  - 그를 철저히 파괴하지 않으셨고
  lexicon: HALOT
  rationale: 부정과 부정사구가 결과/목적을 나타내므로, 한국어에서는 앞절의 분노가 돌아선 결과로 이어지는 문맥을 살려 ‘완전히 멸하지 않으셨고’로 자연스럽게 옮겼습니다.
- source_word: הָיָה דְּבָרִים טוֹבִים
  english_pob_choice: there were good things
  chosen_korean: 좋은 것들이 있었습니다
  alternatives_korean:
  - 좋은 일들이 있었습니다
  - 좋은 사정들이 있었습니다
  lexicon: HALOT
  rationale: דְּבָרִים의 넓은 의미를 좁히지 않기 위해, POB의 ‘good things’처럼 모호성을 유지하는 표현을 택했습니다.
theological_decisions:
- issue: 야훼의 분노와 긍휼의 완화 관계
  chosen_reading: 야훼의 분노가 그에게서 돌아서서 그를 완전히 멸하지 않으셨고
  alternative_readings:
  - 야훼가 뜻을 돌이키셔서 그를 멸하지 않으셨고
  - 야훼의 분노가 가셔서 그를 멸망시키지 않으셨고
  rationale: 본문은 회개의 응답으로 심판이 완화되었음을 말하지만, 심판 자체가 처음부터 없었던 것은 아니므로 ‘돌아서서’와 ‘완전히 멸하지 않으셨고’로 긴장을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 마지막 절의 ‘좋은 것들’ 범위
  chosen_reading: 유다에도 또한 좋은 것들이 있었습니다
  alternative_readings:
  - 유다에도 또한 좋은 일들이 있었습니다
  - 유다에도 또한 좋은 사정이 있었습니다
  rationale: 히브리어가 무엇을 ‘좋은 것들’이라 지칭하는지 구체화하지 않으므로, 도덕적 개혁이나 정치적 호전으로 한정하지 않고 폭넓게 남겼습니다.
  doctrine_reference: Translation philosophy §3
