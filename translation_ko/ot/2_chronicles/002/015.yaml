id: 2CH.2.15
reference: 2 Chronicles 2:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/אֲנַחְנוּ נִכְרֹ֨ת עֵצִ֤ים מִן הַ/לְּבָנוֹן֙ כְּ/כָל צָרְכֶּ֔/ךָ וּ/נְבִיאֵ֥/ם לְ/ךָ֛ רַפְסֹד֖וֹת עַל יָ֣ם יָפ֑וֹ וְ/אַתָּ֛ה תַּעֲלֶ֥ה אֹתָ֖/ם יְרוּשָׁלִָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'bring them to you in rafts' or 'bring them to you as floats.'
    reason: lexical_alternative
  - marker: b
    text: Joppa is the seaport later known as Jaffa.
    reason: cultural_note
  - marker: c
    text: Hebrew 'bring them up to Jerusalem'; 'up' reflects Jerusalem's higher elevation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리는 레바논에서 필요한 만큼의 목재를 베어 내어 바다를 통해 야포까지 뗏목으로 가져다드리겠습니다. 그러면 당신이 그것을 예루살렘으로 올리십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야포’는 성경 지명 Joppa의 표준 음역입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어의 ‘올리다’는 예루살렘의 높은 지형을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרֹת
  english_pob_choice: we will cut
  chosen_korean: 베어 내어
  alternatives_korean:
  - 자르겠습니다
  - 벌목하겠습니다
  lexicon: HALOT
  rationale: 나무를 대상으로 한 כרת의 뜻을 자연스럽게 살리면서, 실제 목재 조달의 맥락을 분명히 드러내기 위해 ‘베어 내어’를 택했습니다.
- source_word: עֵצִים
  english_pob_choice: timber
  chosen_korean: 목재
  alternatives_korean:
  - 나무
  - 목재들
  - 통나무
  lexicon: HALOT
  rationale: 여기서는 살아 있는 나무보다 건축용 자재를 가리키므로, 한국어에서도 자재 의미가 분명한 ‘목재’가 가장 적절합니다.
- source_word: רַפְסֹדוֹת
  english_pob_choice: as rafts
  chosen_korean: 뗏목으로
  alternatives_korean:
  - 뗏목으로서
  - 뗏목 형태로
  - 뗏목으로 실어
  lexicon: HALOT
  rationale: 목재를 묶어 띄워 운송하는 수단이므로, 수단을 나타내는 조사와 함께 자연스럽게 ‘뗏목으로’라고 옮겼습니다.
- source_word: עַל יָם יָפוֹ
  english_pob_choice: by sea to Joppa
  chosen_korean: 바다를 통해 야포까지
  alternatives_korean:
  - 바다로 야포까지
  - 바닷길로 야포까지
  lexicon: HALOT
  rationale: מִן/עַל의 해상 운송 뉘앙스를 살리기 위해 ‘바다를 통해’로 옮기고, 지명은 표준 음역인 ‘야포’를 사용했습니다.
- source_word: תַּעֲלֶה אֹתָם
  english_pob_choice: you will take it up
  chosen_korean: 그것을 예루살렘으로 올리십시오
  alternatives_korean:
  - 그것들을 예루살렘으로 올리십시오
  - 예루살렘으로 가져가십시오
  lexicon: HALOT
  rationale: עלה의 ‘올리다’라는 방향성을 살리되, 한국어에서는 명령형으로 자연스럽게 표현했습니다. 대상은 집합명사적 ‘목재’를 반영해 ‘그것’으로 받았습니다.
theological_decisions:
- issue: 예루살렘으로 ‘올리다’는 지리적 상향성과 성전 건축의 중심성을 함께 암시합니다.
  chosen_reading: ‘올리십시오’로 직역해 상승 방향을 보존했습니다.
  alternative_readings:
  - 예루살렘으로 가져가십시오
  - 예루살렘으로 운반하십시오
  rationale: 본문의 עלה는 단순 이동보다 상향 이동을 말하므로, 의미를 평면화하지 않고 예루살렘의 높은 지형을 드러내는 표현을 유지했습니다.
  doctrine_reference: 문맥적 지리 표현
