  source_fidelity: 개정이 필요합니다. 히브리어 תַּעֲלֶה는 2인칭 남성 단수 미완료형으로, 문맥상 ‘당신이/임금님께서 ... 올리실 것입니다’라는 미래 서술입니다. 초안의 ‘올리십시오’는 명령으로 바꾸어 원문의 법과 발화 내용을 변경합니다. 또한 אֹתָם은 복수로, 앞선 목재를 가리키므로 ‘그 목재를’로 자연스럽게 받는 것이 적절합니다.
  naturalness: ‘그러면 당신이’와 명령형의 결합은 한국어 문맥에서 부자연스럽고, 히람이 솔로몬에게 보내는 공적 서신이라는 문맥에는 ‘임금님께서는 ... 하실 것입니다’가 현대 한국어 합쇼체로 자연스럽습니다. ‘바다를 통해’보다 ‘바다를 거쳐’가 운송 경로를 더 매끄럽게 나타냅니다.
  terminology: 건축 자재 문맥의 עֵצִים를 ‘목재’로, רַפְסֹדוֹת를 ‘뗏목으로’로 옮긴 것은 적절합니다. 한국어 성경 지명 관례상 Joppa는 ‘야포’보다 ‘욥바’가 표준적으로 널리 쓰이므로 이를 사용합니다. ‘올리다’는 예루살렘으로의 상향 이동을 잘 보존합니다.
  issues:
