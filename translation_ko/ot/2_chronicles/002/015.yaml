revisions:
- from: 그리고 우리는 레바논에서 필요한 만큼의 목재를 베어 내어 바다를 통해 야포까지 뗏목으로 가져다드리겠습니다. 그러면 당신이 그것을 예루살렘으로 올리십시오.[a][b]
  to: 우리는 레바논에서 임금님께서 필요로 하시는 만큼 목재를 베어, 뗏목으로 만들어 바다를 거쳐 욥바까지 가져다드리겠습니다. 그러면 임금님께서는 그 목재를 예루살렘으로 올리실 것입니다.[a][b]
  rationale: 원문의 미래 서술을 한국어 미래 서술로 바로잡고, 수신자 호칭을 서신 문맥에 맞게 자연화했습니다. 목재의 복수 지시 대상은 한국어 집합명사 표현인 ‘그 목재’로 처리했으며, 확립된 한국어 성경 지명 표기인 ‘욥바’를 적용했습니다.
