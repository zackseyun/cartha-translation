  naturalness: ‘내가 짓는 집은 클 것입니다’가 현대 표준 한국어에서 자연스럽고, 건축물의 규모와 위상을 함께 나타내는 원문의 술어를 잘 반영합니다. ‘모든 신들 위에 크십니다’는 한국어로 부자연스러우므로 각주 대안을 고쳤습니다.
