source:
  edition: WLC
  text: וְ/הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֑וֹל כִּֽי גָד֥וֹל אֱלֹהֵ֖י/נוּ מִ/כָּל הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/004.yaml
  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
  footnotes:
  - marker: a
    text: Or 'the temple that I am building will be great.' Hebrew literally, 'the house that I am building.'
    reason: lexical_alternative
  - marker: b
    text: Or 'our God is great above all gods.' The Hebrew uses 'great' with 'than all gods' to express comparison.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 내가 짓는 그 집은 크게 될 것입니다[a][b]. 이는 우리 하나님이 모든 신들보다 크시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 짓는 성전은 크게 될 것입니다.’ 히브리어는 문자적으로 ‘내가 짓는 집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리 하나님은 모든 신들 위에 크십니다.’ 히브리어는 ‘크다’와 ‘모든 신들’을 함께 써 비교를 나타냅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/בַּיִת
  english_pob_choice: And the house
  chosen_korean: 그리고 내가 짓는 그 집
  alternatives_korean:
  - 그리고 내가 짓는 성전
  - 그리고 내가 건축하는 집
  lexicon: WLC; HALOT
  rationale: בַּיִת의 기본 의미인 ‘집’을 살리되, 문맥상 성전/성소를 가리키므로 ‘그 집’으로 옮겨 히브리어의 표현을 보존했습니다. 동작 주체를 자연스럽게 드러내기 위해 ‘내가 짓는’을 붙였습니다.
- source_word: גָּדוֹל
  english_pob_choice: great
  chosen_korean: 크게
  alternatives_korean:
  - 위대하게
  - 큰
  lexicon: HALOT
  rationale: 히브리어의 크기·중요성의 의미를 한국어에서 ‘크게 될 것입니다’로 살려, 건축물의 규모와 위상을 함께 전달했습니다.
- source_word: אֱלֹהֵי/נוּ
  english_pob_choice: our God
  chosen_korean: 우리 하나님
  alternatives_korean:
  - 우리의 하나님
  - 우리의 하느님
  lexicon: HALOT
  rationale: 공적 성경 문체에서 통용되는 ‘하나님’을 사용했고, 1인칭 복수 소유격은 한국어에서 자연스럽게 ‘우리 하나님’으로 옮겼습니다.
- source_word: מִ/כָּל הָ/אֱלֹהִים
  english_pob_choice: than all gods
  chosen_korean: 모든 신들보다
  alternatives_korean:
  - 모든 신보다
  - 모든 신들 위에
  lexicon: HALOT
  rationale: 비교 구조를 분명히 드러내기 위해 ‘-보다’를 사용했습니다. 여기서 אֱלֹהִים은 다른 신들을 가리키므로 ‘신들’로 옮겨 원문의 대조를 보존했습니다.
theological_decisions:
- issue: 하나님의 우월성을 비교 구문으로 유지할지 여부
  chosen_reading: 우리 하나님이 모든 신들보다 크시기 때문입니다
  alternative_readings:
  - 우리 하나님은 모든 신들 위에 크십니다
  - 우리 하나님은 모든 신들보다 크십니다
  rationale: 히브리어의 비교 표현(‘크다’ + ‘~보다’)을 한국어에서도 직역에 가깝게 유지하여, 다른 신들과의 대조라는 본문의 수사적 긴장을 그대로 살렸습니다.
  doctrine_reference: 본문의 비교 신학을 완화하지 않고 보존
