  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
  footnotes:
  - marker: a
    text: Or “scarlet” for “crimson.”
    reason: lexical_alternative
  - marker: b
    text: “From the daughters of Dan” likely indicates that his mother was from the tribe of Dan.
    reason: cultural_note
translation:
  language: ko
  text: 단의 딸들 가운데서 난 한 여인의 아들이며, 그의 아버지는 두로 사람입니다. 그는 금과 은, 놋과 철, 돌과 나무, 자색과 청색과 세마포와 홍색으로 일하는 데 능숙하고, 온갖 새김을 새기며, 그에게 맡겨지는 모든 도안을 당신의 숙련된 기술자들과 내 주 다윗, 곧 당신의 아버지의 숙련된 기술자들과 함께 고안할 줄 아는 사람입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘단의 딸들’은 그의 어머니가 단 지파 출신이었음을 가리키는 표현일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  english_pob_choice: the son of a woman from the daughters of Dan
  chosen_korean: 한 여인의 아들인데, 그 여인은 단의 딸들 가운데 한 사람
  alternatives_korean:
  - 단 지파의 여자들 가운데 한 사람의 아들
  - 단의 딸들 출신의 아들
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리기 위해 ‘단의 딸들’이라는 표현을 유지하되, 한국어 문맥에서는 자연스럽게 풀어 ‘한 여인의 아들’로 연결했습니다.
- source_word: וְאָבִיו אִישׁ צֹרִי
  english_pob_choice: and his father was a man of Tyre
  chosen_korean: 그의 아버지는 두로 사람입니다
  alternatives_korean:
  - 그의 아버지는 두로 출신의 사람입니다
  - 그의 아버지는 두로 사람 한 명입니다
  lexicon: HALOT
  rationale: צֹרִי는 ‘두로 출신’을 뜻하므로, 한국어에서는 관용적으로 ‘두로 사람’으로 옮겨 지리적 출신을 분명히 했습니다.
- source_word: יוֹדֵעַ לַעֲשׂוֹת ... וּלְפַתֵּחַ ... וְלַחְשֹׁב
  english_pob_choice: skilled to work ... to engrave ... to devise
  chosen_korean: 일하는 데 능숙하며, 각종 새김을 새기고, ... 모든 설계를 고안할 수 있습니다
  alternatives_korean:
  - 기술을 가지고 ... 새기고 ... 생각해 낼 수 있습니다
  - '... 만드는 데 능하며 ...'
  lexicon: HALOT
  rationale: יוֹדֵעַ לַעֲשׂוֹת는 단순 지식이 아니라 숙련된 기술을 가리키므로 ‘능숙하다’로 옮겼고, פתח/חשב의 공예 맥락은 ‘새기다’와 ‘고안하다’로 살렸습니다.
- source_word: בַּזָּהָב ... בַּכַּרְמִיל
  english_pob_choice: in gold and silver, bronze and iron ... purple, blue, fine linen, and crimson
  chosen_korean: 금과 은, 놋과 철, 돌과 나무, 자색과 청색과 세마포와 홍색
  alternatives_korean:
  - 금과 은, 구리와 철 ... 자주색과 청색과 고운 베와 주홍색
  - 금과 은, 청동과 쇠 ...
  lexicon: HALOT
  rationale: 재료 목록은 공예 재료로서 한국어 성경에서 익숙한 전통 용례를 따르되, ‘홍색’은 영어의 ‘crimson’과 히브리어의 붉은 물감 계열을 반영하는 비교적 직설적인 선택입니다.
- source_word: עִם חֲכָמֶיךָ וְחַכְמֵי אֲדֹנִי דָּוִיד אָבִיךָ
  english_pob_choice: with your skilled men and the skilled men of my lord David your father
  chosen_korean: 당신의 지혜로운 사람들과 내 주 다윗, 당신의 아버지의 지혜로운 사람들과 함께 일할 것입니다
  alternatives_korean:
  - 당신의 기술자들과 내 주 다윗, 당신의 아버지의 기술자들과 함께 일할 것입니다
  - 당신의 지혜로운 장인들과 ...
  lexicon: HALOT
  rationale: חכמים의 기본값은 ‘지혜로운 사람들’이지만, 여기서는 공예 맥락상 숙련공을 가리킬 수 있어 ‘지혜로운 사람들’로 두되 문맥상 함께 일하는 장인 집단임을 드러냈습니다.
theological_decisions:
- issue: 단의 딸들 가운데 한 사람이라는 표현의 해석
  chosen_reading: 가문/지파 소속을 암시하는 직역을 유지하고, 본문에서는 해석을 과도하게 확정하지 않았습니다.
  alternative_readings:
  - 그는 단 지파 출신입니다
  - 그의 어머니는 단 지파 사람입니다
  rationale: 히브리어는 문자적으로 ‘단의 딸들 가운데서’라고만 말하므로, 지파 소속을 암시할 수는 있어도 문장 자체가 명시적으로 풀이하지는 않습니다. 그래서 본문은 열린 상태를 유지했습니다.
  doctrine_reference: 족보·가문 표기의 문자성 유지 원칙
- issue: 아도니(אֲדֹנִי)의 처리
  chosen_reading: 내 주
  alternative_readings:
  - 내 주인
  - 내 상전
  rationale: 여기서는 인간 군주에 대한 공손한 호칭이므로, 주님의 신적 칭호와 혼동되지 않도록 관용적으로 ‘내 주’로 옮겼습니다.
  doctrine_reference: 인간 호칭과 신적 칭호 구별 원칙
