source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ מֵ/הֶ֜ם שִׁבְעִ֥ים אֶ֨לֶף֙ סַבָּ֔ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֣ב בָּ/הָ֑ר וּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת מְנַצְּחִ֖ים לְ/הַעֲבִ֥יד אֶת הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
  footnotes:
  - marker: a
    text: Or 'quarrymen in the mountains.' The Hebrew literally says 'hewers in the mountain/hill country,' with the object implied by context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데서 짐꾼 일만 칠천 명과 산지에서 돌을 다듬는 사람 팔만 명과, 백성을 부릴 감독 삼천육백 명을 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산지의 채석꾼들.’ 히브리어는 문자적으로 ‘산/산지에서 돌을 캐는 사람들’이며, 돌의 목적어는 문맥에서 보충됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  english_pob_choice: From them he made
  chosen_korean: 그들 가운데서 …을 두었습니다
  alternatives_korean:
  - 그들 가운데서 …을 만들었습니다
  - 그들 중에서 …로 삼았습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘~중에서 만들어/두다’라는 구성은 한국어에서 ‘그들 가운데서 …을 두다’로 자연스럽게 옮기면 출처 집단에서 직무 인원을 선발한 뜻이 잘 드러납니다.
- source_word: סַבָּל
  english_pob_choice: burden-bearers
  chosen_korean: 짐꾼
  alternatives_korean:
  - 짐 나르는 사람
  - 부역꾼
  lexicon: HALOT
  rationale: 짐을 나르는 사람이라는 핵심 의미를 살리되, 오늘 한국어에서 이해가 쉬운 ‘짐꾼’을 택했습니다.
- source_word: חֹצֵב בָּהָר
  english_pob_choice: stonecutters in the hill country
  chosen_korean: 산지에서 돌을 다듬는 사람
  alternatives_korean:
  - 산에서 돌을 캐는 사람
  - 산지의 석공
  lexicon: HALOT
  rationale: 동사 חצב는 건축용 돌을 캐고 다듬는 뜻이지만, 영어 POB의 주석처럼 목적어가 생략되어 있어 ‘돌을 다듬는 사람’으로 옮겨 의미를 드러냈습니다. בָּהָר는 문맥상 ‘산지’가 자연스럽습니다.
- source_word: מְנַצְּחִים לְהַעֲבִיד אֶת הָעָם
  english_pob_choice: overseers to make the people work
  chosen_korean: 백성을 부릴 감독
  alternatives_korean:
  - 백성을 부려 일하게 하는 감독
  - 백성을 일시키는 감독
  lexicon: HALOT
  rationale: 문맥의 행정·노무 감독을 ‘감독’으로 살리고, לְהַעֲבִיד의 사역적 의미는 ‘부리다’로 압축해 원문의 강한 통제 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 노동 동원에 대한 표현의 강도
  chosen_reading: ‘백성을 부릴 감독’으로 번역해 단순한 관리가 아니라 동원·노역 지시의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘백성을 감독할 사람’
  - ‘백성을 관리하는 감독’
  rationale: 히브리어 히필 לְהַעֲבִיד는 ‘일하게 하다/부려 일시키다’의 사역성을 가지므로, 이를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 본문의 역사적 서술과 어휘 강도 보존
