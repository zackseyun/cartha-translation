review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘사람을 보내어’는 히브리어 וַיִּשְׁלַח이 목적어 없이 ‘후람에게 보내다’라고 한 것을 구체적으로 ‘사람’을 보낸 것으로 한정합니다. 또한 ‘집을 세워 거기에 거주하게 한 것’은 후람이 다윗을 거주하게 했다는 인과를 비교적 강하게 만들며, 원문의 목적 표현(다윗이 자신이 거주할 집을 짓기 위하여)을 충분히 보존하지 못합니다.
  naturalness: ‘솔로몬이 … 전했습니다’는 직접 인용을 자연스럽게 도입하면서도 보내는 대상이 사람인지 물건인지 특정하지 않습니다. ‘그가 자신이 살 집을 짓도록 백향목을 보내 주신 것처럼’은 현대 표준어 합쇼체에서 명료하며, 백향목을 보낸 목적을 자연스럽게 드러냅니다.
  terminology: חוּרָם은 본문 형태를 따라 ‘후람’으로 유지합니다. 혼동될 수 있는 열왕기서의 ‘히람’ 형태는 각주로 처리합니다. אֲרָזִים는 ‘백향목’으로, 왕실 외교 요청의 존대는 ‘주신/주십시오’로 유지합니다.
  issues:
  - severity: medium
    issue: ‘사람을 보내어’가 원문에 없는 목적어를 보충함
    rationale: וַיִּשְׁלַח은 ‘보내다’이지만 본절에는 보낸 사람을 명시하지 않습니다. 사절을 보냈을 가능성은 있으나, 본문 번역에서 이를 단정할 필요는 없습니다.
  - severity: medium
    issue: ‘자기 집을 세워 거기에 거주하게 한 것’이 목적 구문과 행위 주체를 흐림
    rationale: לִבְנוֹת לוֹ בַיִת לָשֶׁבֶת בּוֹ는 다윗이 자신을 위해, 거주할 집을 짓는 목적을 나타냅니다. 초안은 후람이 다윗을 거주하게 했다는 뜻으로 읽힐 수 있습니다.
  - severity: low
    issue: 후람/히람 이름 형태의 각주 누락
    rationale: 본문은 역대기의 히브리어 형태 ‘후람’을 따르되, 열왕기서 병행 본문에서 흔한 ‘히람’과의 차이를 각주로 밝혀 독자의 식별을 돕는 것이 적절합니다.
  revised_text: 솔로몬이 두로 왕 후람에게 전했습니다. “당신이 제 아버지 다윗에게 해 주시고, 그가 자신이 살 집을 짓도록 그에게 백향목을 보내 주신 것처럼, 저에게도 그렇게 해 주십시오.”
  revised_footnotes:
  - marker: a
    text: ‘후람’은 여기 히브리어 본문의 형태입니다. 열왕기서의 병행 본문에는 흔히 ‘히람’이라는 형태가 나옵니다.
    reason: alternative_reading
  revision_rationale: 원문에 없는 ‘사람’을 제거하고, ‘보내다’와 직접화법 도입을 한국어에서 자연스럽게 연결하기 위해 ‘전했습니다’로 옮겼습니다. 백향목을 보낸 일이 다윗이 자신이 거주할 집을 짓도록 한 목적임을 ‘그가 자신이 살 집을 짓도록’으로 명확히 했습니다. 원문에는 다음 절로 이어지는 비교의 귀결이 생략되어 있으나, 요청의 의미상 ‘저에게도 그렇게 해 주십시오’를 유지했습니다.
