source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח שְׁלֹמֹ֔ה אֶל חוּרָ֥ם מֶֽלֶךְ צֹ֖ר לֵ/אמֹ֑ר כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִם דָּוִ֣יד אָבִ֔/י וַ/תִּֽשְׁלַֽח ל֣/וֹ אֲרָזִ֔ים לִ/בְנֽוֹת ל֥/וֹ בַ֖יִת לָ/שֶׁ֥בֶת בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
  footnotes:
  - marker: a
    text: Huram is the Hebrew form here; the parallel in Kings commonly has the name Hiram.
    reason: alternative_reading
translation:
  language: ko
  text: 솔로몬이 두로 왕 후람에게 사람을 보내어 말했습니다. 「당신이 내 아버지 다윗에게 한 것과 같이, 그리고 그에게 백향목을 보내어 자기 집을 세워 거기에 거주하게 한 것과 같이, 나에게도 그렇게 해 주십시오」.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then ... sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보냈습니다
  - 파견했습니다
  lexicon: HALOT
  rationale: 서술의 진행을 자연스럽게 살리면서, 이어지는 대화 도입과 함께 현대 한국어에서 가장 매끄러운 표현으로 옮겼습니다.
- source_word: חוּרָם
  english_pob_choice: Huram
  chosen_korean: 후람
  alternatives_korean:
  - 히람
  lexicon: HALOT
  rationale: 히브리어 본문 형태 חוּרָם을 따라 후람으로 옮기고, 열왕기서의 익숙한 형태는 따로 취하지 않았습니다.
- source_word: מֶלֶךְ צֹר
  english_pob_choice: king of Tyre
  chosen_korean: 두로 왕
  alternatives_korean:
  - 두로의 왕
  - 티레 왕
  lexicon: HALOT
  rationale: 히브리어의 소유/지배 관계를 한국어 관용에 맞게 ‘두로 왕’으로 간결하게 표현했습니다.
- source_word: כַּאֲשֶׁר ... כֵּן
  english_pob_choice: As ... so do with me
  chosen_korean: 당신이 ... 한 것과 같이 ... 나에게도 그렇게 해 주십시오
  alternatives_korean:
  - '...한 대로 ... 저에게도 해 주십시오'
  - '...한 것처럼 ... 나에게도 해 주십시오'
  lexicon: HALOT
  rationale: 비교 대응 구조를 본문이 허용하는 범위 안에서 드러내기 위해 ‘...한 것과 같이 ... 그렇게 해 주십시오’로 옮겼습니다.
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים לִבְנוֹת לוֹ בַיִת לָשֶׁבֶת בּוֹ
  english_pob_choice: and sent him cedars to build himself a house to dwell in
  chosen_korean: 그에게 백향목을 보내어 자기 집을 세워 거기에 거주하게 한 것
  alternatives_korean:
  - 그에게 백향목을 보내어 그가 거할 집을 세우게 한 것
  - 그에게 백향목을 보내어 살 집을 짓게 한 것
  lexicon: HALOT
  rationale: אֲרָזִים를 건축용 목재로 이해하되, 본문이 직접 말하는 ‘백향목’을 유지했습니다. לִבְנוֹת לוֹ는 목적과 수혜를 함께 담고, לָשֶׁבֶת בּוֹ는 ‘거주하게 한 것’으로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 직접화법의 공손도
  chosen_reading: 솔로몬의 사신 말과 요청을 현대 한국어 합쇼체로 유지했습니다.
  alternative_readings:
  - 보다 구어적인 평서형
  - 고전적 성경체
  rationale: 본문의 왕실 외교적 요청을 현대 독자가 바로 이해하도록 하되, 경어 체계를 유지해 서술의 격식을 살렸습니다.
  doctrine_reference: 번역 문체 결정
- issue: ‘자기 집’의 해석
  chosen_reading: 다윗이 ‘거주할 집’을 세우기 위한 백향목 제공으로 이해했습니다.
  alternative_readings:
  - 성전 건축 암시를 넣는 해석
  - 일반 주거용 궁전으로만 좁히는 해석
  rationale: 현재 절 자체는 다윗의 ‘집’과 거주 목적만 말하므로, 다음 절로 이어지는 성전 문맥을 미리 주입하지 않고 본문이 말하는 범위에 머물렀습니다.
  doctrine_reference: 본문 문맥 보존
