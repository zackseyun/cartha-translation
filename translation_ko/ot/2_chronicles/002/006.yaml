  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Now send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
  footnotes:
  - marker: a
    text: Or 'scarlet' for 'crimson.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'to engrave engravings,' a cognate expression for skilled engraved work.
    reason: lexical_alternative
  - marker: c
    text: Or 'whom my father David appointed' / 'made ready'; the Hebrew verb can cover preparation or appointment depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 내게 금[a], 은, 놋, 철, 자색, 홍색, 청색으로 일할 수 있고, 새김[ [b]]을 새기는 법을 아는 한 지혜로운 사람을 보내어 주십시오. 그는 내가 유다와 예루살렘에 함께 두고 있는 지혜로운 사람들과 함께할 것입니다[c]. 그들은 내 아버지 다윗이 준비한 사람들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진홍색’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘새김들을 새기다’라는 동족어 표현을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 아버지 다윗이 임명한 사람들’ / ‘마련한 사람들’로도 옮길 수 있습니다. 히브리어 동사는 문맥에 따라 준비나 임명을 모두 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ חָכָם
  english_pob_choice: a skilled man
  chosen_korean: 한 지혜로운 사람
  alternatives_korean:
  - 한 기술자
  - 한 숙련된 사람
  lexicon: HALOT
  rationale: 공예 문맥에서 חָכָם은 추상적 ‘지혜’보다 기술·숙련을 가리키므로, 한국어에서도 뜻을 살리면서도 단순한 직함으로 오해되지 않게 옮겼습니다.
- source_word: בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  english_pob_choice: in gold, silver, bronze, iron
  chosen_korean: 금, 은, 놋, 철
  alternatives_korean:
  - 금, 은, 청동, 철
  - 금, 은, 구리, 철
  lexicon: HALOT
  rationale: 재료 목록으로서의 병렬을 유지했고, נְחֹשֶׁת은 이 역사적·재료적 문맥에서 ‘놋’이 한국어 성경 전통과 가장 잘 맞습니다.
- source_word: וּבָאַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  english_pob_choice: purple, crimson, and blue
  chosen_korean: 자색, 홍색, 청색
  alternatives_korean:
  - 보라색, 진홍색, 파란색
  - 자주색, 붉은색, 푸른색
  lexicon: HALOT
  rationale: 이 항목들은 직물/염색 색채를 가리키므로, 전통적이면서도 재료 목록의 뉘앙스를 보존하는 ‘자색·홍색·청색’을 택했습니다.
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  english_pob_choice: who knows how to engrave engravings
  chosen_korean: 새김을 새기는 법을 아는
  alternatives_korean:
  - 조각무늬를 새길 줄 아는
  - 새기는 일을 아는
  lexicon: HALOT
  rationale: 히브리어의 동족어 반복을 살려 ‘새김을 새기다’로 옮겼고, 장식 조각의 숙련성을 드러내면서도 과도한 해설을 피했습니다.
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  english_pob_choice: whom my father David prepared
  chosen_korean: 내 아버지 다윗이 준비한 사람들
  alternatives_korean:
  - 내 아버지 다윗이 임명한 사람들
  - 내 아버지 다윗이 마련한 사람들
  lexicon: HALOT
  rationale: הֵכִין은 문맥에 따라 ‘준비하다/마련하다/임명하다’를 포괄하므로, 문맥상 가장 넓고 무리 없는 ‘준비하다’를 유지했습니다.
theological_decisions:
- issue: 영화·재료 목록의 번역에서 전통 용어와 직역 사이의 균형
  chosen_reading: ‘놋’과 ‘자색·홍색·청색’을 사용해 성전 공예 재료 목록의 성격을 보존했습니다.
  alternative_readings:
  - ‘청동’과 ‘보라색·진홍색·파란색’으로 더 현대화하는 읽기
  rationale: 이 절은 예배용 장인의 재료와 색채를 나열하는 문맥이므로, 교회 전통에서 익숙한 용어를 유지하는 편이 원문의 문화적·재료적 분위기를 더 정확히 전달합니다.
  doctrine_reference: 성전 준비와 예술적 장인의 소명(출 31장, 왕상 5장 병행 문맥)
