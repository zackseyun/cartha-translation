base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Now send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
  footnotes:
  - marker: a
    text: Or 'scarlet' for 'crimson.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally, 'to engrave engravings,' a cognate expression for skilled engraved work.
    reason: lexical_alternative
  - marker: c
    text: Or 'whom my father David appointed' / 'made ready'; the Hebrew verb can cover preparation or appointment depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 금, 은, 놋, 철, 자색, 홍색[a], 청색으로 일하고, 새김들을 새길 줄 알며, 내 아버지 다윗이 준비한[c] 내가 유다와 예루살렘에 함께 두고 있는 숙련된 사람들과 함께할 한 숙련된 사람을 내게 보내 주십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진홍색’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘새김들을 새기다’라는 동족어 표현을 사용합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내 아버지 다윗이 임명한 사람들’ 또는 ‘마련한 사람들’로도 옮길 수 있습니다. 히브리어 동사는 문맥에 따라 준비하거나 마련하는 것을, 경우에 따라 임명하는 것을 뜻할 수 있습니다.
    reason: alternative_reading
