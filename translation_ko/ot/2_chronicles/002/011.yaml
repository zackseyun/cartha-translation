source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
  footnotes:
  - marker: a
    text: Huram is spelled 'Hiram' in the parallel account in 1 Kings; Chronicles here has the Hebrew form Huram.
    reason: alternative_reading
  - marker: b
    text: Or 'having insight and understanding' for 'knowing discretion and understanding.'
    reason: lexical_alternative
  - marker: c
    text: That is, a house for his royal rule; possibly referring to the palace complex.
    reason: cultural_note
translation:
  language: ko
  text: 그때 후람이 말했습니다[a]. “하늘과 땅을 만드신 이스라엘의 하나님 야훼는 찬양받으소서. 그분께서 다윗 왕에게 분별력과 통찰력을 지닌 지혜로운 아들을 주셨습니다[b]. 그 아들은 야훼를 위한 집과 자신의 왕권을 위한 집을 지을 것입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 역대기 본문은 이 이름을 히브리어 형태인 ‘후람’으로 적습니다. 열왕기 병행 본문에는 ‘히람’이 나옵니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘분별과 통찰을 아는’입니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 그의 왕권을 위한 집이며, 궁전 단지를 가리킬 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר חוּרָם
  english_pob_choice: Then Huram said
  chosen_korean: 그때 후람이 말했습니다
  alternatives_korean:
  - 그리고 후람이 말했습니다
  - 그때 히람이 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 한국어로는 자연스러운 시간 표지인 '그때'로 풀고, 열왕기 병행의 익숙한 '히람'이 아니라 역대기의 히브리어 형태 '후람'을 따랐습니다.
- source_word: בָּרוּךְ יְהוָה
  english_pob_choice: Blessed be Yahweh
  chosen_korean: 야훼, ...를 찬양합니다
  alternatives_korean:
  - 야훼는 복되십니다
  - 야훼를 복되다고 말합니다
  lexicon: HALOT
  rationale: 히브리어 축복 공식은 한국어에서 직접적인 찬양 발화로 옮기는 것이 자연스러워, '복되다'의 서술형보다 예배적 뉘앙스를 살린 '찬양합니다'를 택했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하느님
  - 이스라엘의 신
  lexicon: HALOT
  rationale: 언약적 소유격을 그대로 살려 '이스라엘의 하나님'으로 옮겼습니다.
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  english_pob_choice: who knows discretion and understanding
  chosen_korean: 분별과 통찰을 알고
  alternatives_korean:
  - 분별과 이해를 지니고
  - 분별과 명철을 알고
  lexicon: HALOT
  rationale: POB의 수정 취지대로 분사적 성격을 유지하면서, שֵׂכֶל은 '분별', בִּינָה는 '통찰'로 옮겨 지적 능력의 짝을 자연스럽게 드러냈습니다.
- source_word: בַּיִת לַיהוָה וּבַיִת לְמַלְכוּתוֹ
  english_pob_choice: a house for Yahweh and a house for his kingdom
  chosen_korean: 야훼를 위한 집과 그의 왕국을 위한 집
  alternatives_korean:
  - 야훼를 위한 성전과 그의 왕국을 위한 궁전
  - 야훼의 집과 그의 왕국의 집
  lexicon: HALOT
  rationale: 원문이 '집'을 반복하므로, 의미를 지나치게 구체화한 '성전/궁전' 대신 같은 어휘를 유지해 병행 구조를 보존했습니다.
theological_decisions:
