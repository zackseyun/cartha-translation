    rationale: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו는 ‘그의 아버지 다윗이 그들을 계수한’이라는 관계절입니다. 이를 명시하면 원문 관계와 시간적 순서를 모두 보존합니다.
