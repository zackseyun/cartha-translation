source:
  edition: WLC
  text: וַ/יִּסְפֹּ֣ר שְׁלֹמֹ֗ה כָּל הָ/אֲנָשִׁ֤ים הַ/גֵּירִים֙ אֲשֶׁר֙ בְּ/אֶ֣רֶץ יִשְׂרָאֵ֔ל אַחֲרֵ֣י הַ/סְּפָ֔ר אֲשֶׁ֥ר סְפָרָ֖/ם דָּוִ֣יד אָבִ֑י/ו וַ/יִּמָּצְא֗וּ מֵאָ֤ה וַ/חֲמִשִּׁים֙ אֶ֔לֶף וּ/שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
  footnotes:
  - marker: a
    text: Or 'the sojourners' or 'the resident aliens.' The Hebrew term refers to non-Israelites residing within Israelite territory.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬이 이스라엘 땅에 있는 모든 거류 외국인을 그 아버지 다윗이 조사한 인구조사 뒤에 계수하니, 그 수가 십삼만육천 명이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֲנָשִׁים הַגֵּירִים
  english_pob_choice: the resident foreigners
  chosen_korean: 거류 외국인
  alternatives_korean:
  - 거주 외국인
  - 나그네
  - 거류민
  lexicon: HALOT
  rationale: גֵּר는 단순한 여행자가 아니라 이스라엘 안에 거주하는 비이스라엘인을 가리키므로, POB의 의미를 살리면서도 현대 한국어에서 이해되는 ‘거류 외국인’을 택했습니다.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  english_pob_choice: in the land of Israel
  chosen_korean: 이스라엘 땅에
  alternatives_korean:
  - 이스라엘 בארץ
  - 이스라엘의 땅에
  - 이스라엘 땅 안에
  lexicon: HALOT
  rationale: אֶרֶץ의 지리적·언약적 뉘앙스를 살리기 위해 ‘땅’을 유지했습니다. 한국어에서는 ‘이스라엘 땅’이 자연스럽고 원문의 영역 감각을 드러냅니다.
- source_word: וַ/יִּסְפֹּ֣ר
  english_pob_choice: counted
  chosen_korean: 계수하니
  alternatives_korean:
  - 세어 보니
  - 인구를 조사하니
  - 번호를 매기니
  lexicon: HALOT
  rationale: 단순한 셈이 아니라 사람을 대상으로 한 열거·집계를 가리키므로, 서술문에서 자연스럽게 쓰이면서도 공식적인 느낌을 주는 ‘계수하다’를 선택했습니다.
- source_word: הַ/סְּפָר
  english_pob_choice: the census
  chosen_korean: 인구조사
  alternatives_korean:
  - 계수
  - 조사
  - 센서스
  lexicon: HALOT
  rationale: 앞선 ‘계수하다’와 대응하는 명사로서, 현대 한국어 독자가 즉시 이해할 수 있는 ‘인구조사’를 사용했습니다. 여기서는 민수 기록의 성격을 분명히 합니다.
theological_decisions:
- issue: גֵּרִים의 사회적 지위 표현
  chosen_reading: ‘거류 외국인’으로 옮겨 이들이 이스라엘 안에 머무는 비이스라엘인이라는 사회·법적 위치를 드러냈습니다.
  alternative_readings:
  - ‘나그네’로 완화하여 번역
  - ‘이방인’으로 일반화
  rationale: 본문은 단순한 외부인이 아니라 이스라엘 땅 안에 거주하는 범주를 말하므로, 전통적 종교어휘보다 사회적 지위를 드러내는 번역이 source-direct합니다.
  doctrine_reference: 토라의 גֵּר 이해(출 12:48-49; 레 19:33-34)
