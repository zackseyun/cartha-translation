  source_fidelity: 개정이 필요합니다. 원문의 수량은 ‘십오만 삼천육백’(153,600)인데, 초안은 ‘십삼만육천’(136,000)으로 잘못 옮겼습니다. 또한 אַחֲרֵי הַסְּפָר를 ‘인구조사 뒤에’로 옮긴 방향은 유지할 수 있으나, 다윗이 ‘그들을’ 조사했다는 관계를 명시해야 원문 אֲשֶׁר סְפָרָם을 충실히 반영합니다.
  naturalness: ‘그 아버지 다윗이 조사한 인구조사 뒤에’는 수식 관계가 무겁고 다소 부자연스럽습니다. ‘그의 아버지 다윗이 그들을 조사한 인구조사 후에’로 하면 현대 표준 한국어 합쇼체에서 명료합니다. ‘그 수는 …로 확인되었습니다’는 וַיִּמָּצְאוּ의 결과적 수동 표현을 자연스럽게 살립니다.
  terminology: ‘거류 외국인’은 גֵּרִים의 비이스라엘계 정주민이라는 사회적 범주를 적절히 전달합니다. 다만 독자가 다른 가능한 번역을 알 수 있도록 해당 표현에 각주를 붙이는 것이 좋습니다. ‘이스라엘 땅’과 ‘인구조사’도 원문 및 영어 POB의 선택에 부합합니다.
  issues:
