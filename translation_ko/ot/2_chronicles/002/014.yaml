id: 2CH.2.14
reference: 2 Chronicles 2:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/עַתָּה הַ/חִטִּ֨ים וְ/הַ/שְּׂעֹרִ֜ים הַ/שֶּׁ֤מֶן וְ/הַ/יַּ֨יִן֙ אֲשֶׁ֣ר אָמַ֣ר אֲדֹנִ֔/י יִשְׁלַ֖ח לַ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/014.yaml
  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
  footnotes:
  - marker: a
    text: Or 'the oil' may be understood more specifically as 'olive oil' in this provisioning context.
    reason: lexical_alternative
  - marker: b
    text: Or 'which he said'; the Hebrew does not require the stronger sense 'which he promised.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 제 주께서 말씀하신[b] 밀과 보리와 기름[a]과 포도주를 자기 종들에게 보내 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 이 공급 품목의 문맥에서는 ‘올리브기름’으로 더 구체적으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 말한’으로 옮길 수 있습니다. 히브리어는 ‘그가 약속한’이라는 더 강한 뜻을 반드시 요구하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 대화의 전환과 요청의 도입을 자연스럽게 살리면서, 한국어에서는 ‘이제’가 가장 간결하고 공문체에 어울립니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 제 주께서는
  alternatives_korean:
  - 내 주여
  - 주인님께서는
  - 제 어르신께서는
  lexicon: HALOT
  rationale: 예루살렘 궁정의 정중한 호칭을 반영해 ‘제 주께서는’으로 옮겼습니다. ‘주’는 여기서 인간 상관에 대한 존칭이며, 신적 호칭과 혼동되지 않도록 문맥상 보완했습니다.
- source_word: לַעֲבָדָיו
  english_pob_choice: to his servants
  chosen_korean: 자기 종들에게
  alternatives_korean:
  - 그의 종들에게
  - 그의 일꾼들에게
  lexicon: HALOT
  rationale: 히브리어 전치사 ל+‘종들’의 직접적 의미를 살리면서, 수신자인 솔로몬보다 발신자의 소유를 드러내는 ‘자기’로 자연스럽게 정리했습니다.
- source_word: הַחִטִּים וְהַשְּׂעֹרִים הַשֶּׁמֶן וְהַיַּיִן
  english_pob_choice: the wheat and the barley, the oil and the wine
  chosen_korean: 밀과 보리와 기름과 포도주
  alternatives_korean:
  - 밀과 보리, 기름과 포도주
  - 밀, 보리, 기름, 포도주
  lexicon: HALOT
  rationale: 공급 물품의 목록이므로 한국어에서는 관사를 반복하지 않고 단순 병렬로 옮겼습니다. ‘기름’은 원문처럼 일반어를 유지해 과도한 구체화(올리브기름)를 피했습니다.
theological_decisions:
- issue: אֲדֹנִי의 호칭 처리
  chosen_reading: 인간 상관에 대한 궁정적 존대 표현으로 ‘제 주께서는’이라고 옮겼습니다.
  alternative_readings:
  - 신적 호칭처럼 ‘주님’으로 처리
  - 단순히 ‘내 주께서’로 처리
  rationale: 본문은 두로 왕 히람이 솔로몬에게 정중히 요청하는 맥락이므로, 신적 ‘주님’으로 올리면 의미가 흐려집니다. 동시에 한국어 공손체를 유지해 관계의 위계를 드러냈습니다.
  doctrine_reference: 서술 맥락과 호칭 의미 구분
- issue: אֲשֶׁר אָמַר의 의미
  chosen_reading: ‘그가 말한/언급한’ 정도로 이해하고, 강한 ‘약속했다’는 의미는 본문에 넣지 않았습니다.
  alternative_readings:
  - ‘그가 약속한’
  - ‘그가 말씀하신’
  rationale: אמר 자체는 발화/언급을 뜻하며, 문맥상 이미 말한 공급 항목을 가리킵니다. 따라서 영어 POB의 절제된 판단을 따라 ‘약속’의 신학적 강도를 부여하지 않았습니다.
  doctrine_reference: 어휘 의미와 서사 문맥
