  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
  footnotes:
  - marker: a
    text: Or 'quarrymen in the mountains.' The Hebrew literally says 'hewing in the mountain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 짐을 나르는 사람들 일만 칠천 명과, 산에서 돌을 다듬는 사람들 팔만 명과, 그들 위에 감독 삼천육백 명을 계수했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפֹּר
  english_pob_choice: counted
  chosen_korean: 계수했습니다
  alternatives_korean:
  - 세었습니다
  - 헤아렸습니다
  lexicon: HALOT
  rationale: 인원 집계의 행정적 뉘앙스를 살리면서도 현대 문체에 자연스럽게 맞는 표현입니다.
- source_word: אִישׁ ... סַבָּל
  english_pob_choice: men as burden-bearers
  chosen_korean: 짐을 나르는 사람들
  alternatives_korean:
  - 짐꾼들
  - 부담을 지는 사람들
  lexicon: HALOT
  rationale: סַבָּל의 ‘짐을 나르는 사람’이라는 기능을 드러내되, 한국어에서 어색한 직역어를 피했습니다.
- source_word: חֹצֵב בָּהָר
  english_pob_choice: stonecutters in the hill country
  chosen_korean: 산에서 돌을 다듬는 사람들
  alternatives_korean:
  - 산에서 돌을 캐는 사람들
  - 산지의 석공들
  lexicon: HALOT
  rationale: ‘hewing/cutting in the mountain’이라는 원문 감각을 유지하면서, 영어 POB의 해석적 보완을 한국어로도 자연스럽게 옮겼습니다.
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  english_pob_choice: overseers over them
  chosen_korean: 그들 위에 감독
  alternatives_korean:
  - 그들을 감독하는 사람들
  - 그들 위의 감독들
  lexicon: HALOT
  rationale: 관리·감독을 뜻하는 נצח의 행정적 용법을 살려 ‘감독’으로 옮기고, עֲלֵיהֶם의 상위 관계는 ‘위에’로 반영했습니다.
