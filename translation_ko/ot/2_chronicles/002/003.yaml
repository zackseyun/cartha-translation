revisions:
- from: 보십시오[a], 저는 야훼 내 하나님이신 분의 이름을 위하여 집을 짓고 있습니다. 그것을 그분께 구별하여 드리고, 그분 앞에서 향기로운 향을 피우며, 진설된 빵의 차림[b]과 아침과 저녁의 번제, 안식일들과 초하루들, 그리고 야훼 우리 하나님의 정한 절기들에 드리기 위함입니다. 이것은 이스라엘을 위한 영원한 규례입니다[c].
  to: 보십시오[a], 저는 내 하나님이신 야훼의 이름을 위하여 집을 짓고 있습니다. 그 집을 그분을 위하여 거룩하게 구별하고, 그분 앞에서 향기로운 향을 피우며, 늘 진설하는 빵을 차려 놓고[b], 아침과 저녁에, 안식일과 초하루와 우리 하나님 야훼의 정한 절기에 번제를 드리기 위함입니다. 이는 이스라엘에게 영원히 지켜야 할 규례입니다[c].
  rationale: 원문의 동격 관계를 '내 하나님이신 야훼'로 바로잡고, 향을 피움·빵을 진설함·번제를 드림을 병렬적으로 구분했습니다. 번제에 연결되는 시간과 절기를 자연스러운 한국어로 명시했으며, 마지막 표현은 수혜가 아니라 이스라엘의 지속적 의무라는 뜻이 드러나게 수정했습니다. 각주 b도 히브리어에 '빵'이 명시되어 있지 않다는 점을 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:16:36Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. '야훼 내 하나님이신 분'은 히브리어의 '나의 하나님 야훼'라는 소유·동격 관계를 부자연스럽고 다소 모호하게 처리합니다. 또한 현행 문장은 '진설된 빵의 차림'과 시간·절기 표현을 모두 '드리기'에 직접 연결하여, 빵의 진설과 번제를 구별하는 원문의 열거 구조가 흐려집니다. 마지막의 '이스라엘을 위한'은 עַל־יִשְׂרָאֵל의 의무 부과 의미를 수혜 의미로 바꿀 수 있습니다.
  naturalness: 합쇼체의 격식은 대체로 적절하나, '야훼 내 하나님이신 분', '진설된 빵의 차림과 아침과 저녁의 번제 ... 에 드리기'는 현대 표준 한국어로 매끄럽지 않습니다. 각각의 성전 봉사 행위를 병렬 동사구로 명료하게 제시하는 편이 자연스럽습니다.
  terminology: '''야훼'', ''번제'', ''안식일'', ''초하루''는 적절합니다. מַעֲרֶכֶת תָּמִיד은 문맥상 진설빵의 지속적인 배열을 가리키므로, 본문에서는 쉬운 표현인 ''늘 진설하는 빵을 차려 놓고''로 옮기고 각주에서 전통 용어와 문자적 표현을 밝혀 두는 것이 좋습니다.'
  issues:
  - severity: medium
    issue: '''야훼 내 하나님이신 분의 이름'''
    rationale: יְהוָה אֱלֹהָי는 '내 하나님이신 야훼'이며, 현행 표현은 '야훼'와 '내 하나님'의 관계를 부자연스럽게 풀어 원문의 소유·동격 구문을 흐립니다.
  - severity: medium
    issue: 진설의 빵과 번제 및 시간·절기의 연결
    rationale: מַעֲרֶכֶת תָּמִיד과 עֹלוֹת 및 그 시간·절기 수식어는 서로 구별되어 열거됩니다. 현행 문장은 '차림'까지 '드리기'의 대상으로 보이게 하여 한국어 문장 구조상 불명확합니다.
  - severity: medium
    issue: '''이스라엘을 위한 영원한 규례'''
    rationale: לְעוֹלָם זֹאת עַל־יִשְׂרָאֵל은 이스라엘에게 영속적으로 부과된 의무를 뜻합니다. '이스라엘을 위한'은 이스라엘의 유익을 위한 규례라는 뜻으로 읽힐 수 있습니다.
