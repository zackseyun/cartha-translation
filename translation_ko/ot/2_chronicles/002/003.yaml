  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the continual showbread' or 'the bread set out continually.'
    reason: lexical_alternative
  - marker: b
    text: '''House'' refers to the temple; the Hebrew literally says ''a house for the name of the LORD.'''
    reason: lexical_alternative
  - marker: c
    text: The phrase 'This is forever for Israel' means that these offerings are a perpetual obligation for Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 저는 야훼 내 하나님이신 분의 이름을 위하여 집을 짓고 있습니다. 그것을 그분께 구별하여 드리고, 그분 앞에서 향기로운 향을 피우며, 진설된 빵의 차림[b]과 아침과 저녁의 번제, 안식일들과 초하루들, 그리고 야훼 우리 하나님의 정한 절기들에 드리기 위함입니다. 이것은 이스라엘을 위한 영원한 규례입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 왕의 격식 있는 주의를 환기하는 표현입니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어는 직역하면 '빵의 차림' 또는 '빵을 진설한 배열'입니다. 전통적으로는 '진설병'으로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 이스라엘에게 주어진 지속적 의무를 뜻합니다.
    reason: theological_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 담화 표지로, 왕의 선언체에 어울리는 격식을 살리면서도 현대 한국어에서 자연스럽게 옮겼습니다.
- source_word: בַּיִת
  english_pob_choice: house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 집
  lexicon: HALOT
  rationale: 히브리어의 직역을 따라 '집'을 유지했고, 문맥상 성전이지만 본문에는 '집'이므로 해석어인 '성전'은 본문에서 피했습니다.
- source_word: לְשֵׁם יְהוָה
  english_pob_choice: for the name of Yahweh
  chosen_korean: 야훼 내 하나님이신 분의 이름을 위하여
  alternatives_korean:
  - 야훼의 이름을 위하여
  - 야훼의 이름을 위해
  lexicon: HALOT
  rationale: '''이름''이 단순 호칭이 아니라 임재와 명예를 가리키는 언약적 표현이므로, 한국어로도 목적어 구문을 유지하되 소유 관계를 자연스럽게 풀었습니다.'
- source_word: מַעֲרֶכֶת תָּמִיד
  english_pob_choice: the regular arrangement of bread
  chosen_korean: 진설된 빵의 차림
  alternatives_korean:
  - 늘 차려 놓는 빵
  - 상에 늘어놓는 빵의 배열
  lexicon: HALOT
  rationale: 전통적 '진설병'을 본문 대신 쓰지 않고, 원문의 배열·진설 행위를 드러내면서도 제의적 의미를 살리기 위해 이렇게 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값을 따라 신명사의 고유명을 보존했습니다. '주'는 칭호이므로 본문의 명칭성을 약화시킵니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מַעֲרֶכֶת תָּמִיד의 이해
  chosen_reading: 진설된 빵의 차림
  alternative_readings:
  - 진설병
  - 계속 놓아 둔 빵
  rationale: 본문은 성전 제의의 지속적 배열을 말하므로, 전통 용어를 바로 쓰기보다 원문 구조를 드러내되 '빵'을 명시해 제의적 참조를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §6, readable modern Korean without ecclesial jargon
