translation:
  language: ko
  text: 또 저를 위해 목재를 넉넉히 준비해 주십시오. 제가 짓고 있는 그 집[a]은 크고 놀라울 것이기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전’. 히브리어는 문자적으로 ‘집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘크고 놀라운’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהָכִין
  english_pob_choice: and to prepare
  chosen_korean: 준비해 주십시오
  alternatives_korean:
  - 마련해 주십시오
  - 준비하십시오
  lexicon: HALOT
  rationale: משך되는 요청의 목적 표현을 자연스럽게 살려, 요청형으로 옮기되 상대의 협력 행위를 분명히 했습니다.
- source_word: עֵצִים
  english_pob_choice: timber
  chosen_korean: 나무
  alternatives_korean:
  - 목재
  - 목재용 나무
  lexicon: HALOT
  rationale: 문맥상 건축 재료를 가리키지만, 한국어에서는 이 절에서 과도하게 전문화된 '목재'보다 일반적인 '나무'가 더 자연스럽고 원문 대응도 유지합니다.
- source_word: לָרֹב
  english_pob_choice: in abundance
  chosen_korean: 넉넉히
  alternatives_korean:
  - 풍성히
  - 많이
  lexicon: HALOT
  rationale: 양의 충족과 풍부함을 간결하게 전하는 부사로, '많이'보다 요청의 뉘앙스가 더 살아납니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 그 성전
  - 그 전각
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현인 '집'을 살리되, 앞뒤 문맥에서 대상이 분명하므로 지시어를 더해 한국어에서 어색하지 않게 했습니다.
theological_decisions:
- issue: 성전의 명칭을 '집'으로 유지할지 '성전'으로 풀어쓸지
  chosen_reading: 본문의 문자적 표현을 따라 '집'을 유지했습니다.
  alternative_readings:
  - 성전
  - 성전집
  rationale: 히브리어가 실제로 '집'이라고 말하므로, 성전이라는 해석을 미리 확정하기보다 원문의 표현을 보존하는 쪽이 사본 기반 번역 원칙에 더 맞습니다.
  doctrine_reference: 원문 충실성 및 성전 호칭의 문체적 보존
