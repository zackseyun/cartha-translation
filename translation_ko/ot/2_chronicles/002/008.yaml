  text: and to prepare for me timber in abundance[b][a], for the house that I am building will be great and wonderful.
  footnotes:
  - marker: a
    text: Or 'the temple'; Hebrew literally 'the house.'
    reason: lexical_alternative
  - marker: b
    text: Or 'great and marvelous.'
