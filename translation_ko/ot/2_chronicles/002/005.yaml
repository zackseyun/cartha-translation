base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
  footnotes:
  - marker: a
    text: 'Hebrew: ''the heavens and the heavens of the heavens,'' an idiom meaning the highest heavens.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to offer incense before him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분을 위해 집을 지을 힘을 가진 사람이 누구이겠습니까? 하늘들, 곧 하늘들의 하늘도 그분을 담아내지 못하는데 말입니다. 그런데 내가 누구이기에 그분을 위해 집을 짓겠습니까? 다만 그분 앞에서 분향할 뿐입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘하늘들과 하늘들의 하늘’로, 가장 높은 하늘을 가리키는 관용적 중첩 표현입니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그분 앞에서 분향하다’이며, 문맥상 제의적 향기 올림을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  english_pob_choice: has the strength
  chosen_korean: 힘을 가진
  alternatives_korean:
  - 감당할 힘을 가진
  - 버틸 힘이 있는
