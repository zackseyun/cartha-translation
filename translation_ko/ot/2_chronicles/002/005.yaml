  lexicon: HALOT
  rationale: ‘힘’은 שאל/עצר+כוח의 능력·역량 뉘앙스를 자연스럽게 살리며, 질문형 수사와도 잘 맞습니다.
- source_word: לִבְנוֹת לוֹ בַיִת
  english_pob_choice: to build a house for him
  chosen_korean: 그분을 위해 집을 짓
  alternatives_korean:
