- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  english_pob_choice: the heavens, even the highest heavens
  chosen_korean: 하늘들, 곧 하늘들의 하늘
  alternatives_korean:
