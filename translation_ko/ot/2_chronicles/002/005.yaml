  lexicon: HALOT
  rationale: ‘집’은 히브리어 בַיִת를 직접 반영하고, ‘성전’으로 좁히지 않아 원문 표현의 여지를 보존합니다.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  english_pob_choice: the heavens, even the highest heavens
  chosen_korean: 하늘들, 곧 하늘들의 하늘
  alternatives_korean:
  - 하늘과 하늘들의 하늘
  - 하늘들과 하늘들의 하늘
  - 가장 높은 하늘
  lexicon: HALOT
  rationale: 두 겹의 표현을 한국어로도 유지하되, ‘곧’으로 보강해 최상급적 중첩을 드러냈습니다.
- source_word: לֹא יְכַלְכְּלֻהוּ
  english_pob_choice: cannot contain him
  chosen_korean: 그분을 담아내지 못하는데
  alternatives_korean:
  - 그분을 담지 못하는데
  - 그분을 포함하지 못하는데
  - 그분을 수용하지 못하는데
  lexicon: HALOT
  rationale: ‘contain’에 해당하는 의미를 한국어에서 가장 자연스럽게 옮기면서, 단순한 물리적 수용을 넘어 감당 불가의 뉘앙스를 살렸습니다.
- source_word: לְהַקְטִיר לְפָנָיו
  english_pob_choice: to burn incense before him
  chosen_korean: 그분 앞에서 분향할
  alternatives_korean:
  - 그분 앞에서 향을 피울
  - 그분 앞에서 향을 사를
  - 그분 앞에서 향을 올릴
  lexicon: HALOT
  rationale: הקטיר는 제의적 ‘분향’이 가장 직접적이며, לְפָנָיו의 관계·위치 감각은 ‘앞에서’로 보존했습니다.
theological_decisions:
- issue: 성전과 하나님의 내재/초월 관계
  chosen_reading: 집은 하나님을 담는 장소가 아니라, 그분 앞에서 제의적으로 섬기는 자리로 제시했습니다.
  alternative_readings:
  - 집을 하나님의 거처로 더 강하게 표현하는 읽기
  rationale: ‘하늘들의 하늘도 그분을 담아내지 못한다’는 진술이 하나님의 초월성을 규정하므로, 끝의 분향은 거처화가 아니라 예배 행위로 제한해 번역했습니다.
  doctrine_reference: Translation philosophy §3
