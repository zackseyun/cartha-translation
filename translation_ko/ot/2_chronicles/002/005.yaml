  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
  footnotes:
  - marker: a
    text: 'Hebrew: ''the heavens and the heavens of the heavens,'' an idiom meaning the highest heavens.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to offer incense before him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분을 위하여 집을 지을 힘이 있는 사람이 누구이겠습니까? 하늘들, 곧 하늘들의 하늘도[a] 그분을 담을 수 없는데, 제가 누구이기에 그분을 위하여 집을 짓겠습니까? 다만 그분 앞에서 분향하기[b] 위함일 뿐입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘하늘들과 하늘들의 하늘’로, 가장 높은 하늘을 가리키는 관용적 중첩 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그분 앞에서 향을 올리기’.
    reason: lexical_alternative
