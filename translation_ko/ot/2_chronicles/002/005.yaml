  source_fidelity: 마지막 절의 לְהַקְטִיר לְפָנָיו는 ‘내가 분향할 뿐입니다’라는 독립 서술이 아니라, 집을 짓는 목적을 제한하는 부정사구입니다. 이를 ‘분향하기 위함일 뿐입니다’로 옮겨 목적·제한의 관계를 보존해야 합니다. ‘하늘들, 곧 하늘들의 하늘’과 ‘담을 수 없다’는 원문의 강조와 초월성 진술을 충실히 반영합니다.
  naturalness: 초안의 ‘담아내지 못하는데 말입니다’는 다소 구어적이고 ‘담아내다’는 창작·표현의 연상을 줄 수 있습니다. ‘담을 수 없는데’가 현대 표준어 합쇼체에서 자연스럽고 정확합니다. 또한 ‘제가 누구이기에’가 화자의 겸양적 수사 의문을 더 자연스럽게 드러냅니다.
  terminology: בַיִת는 해석적으로 ‘성전’으로 좁히지 않고 ‘집’으로 유지했습니다. הַקְטִיר는 문맥상 ‘분향하다’로 적절합니다. 각주는 첫째는 히브리어 중첩 관용구, 둘째는 ‘분향하다’의 가능한 대안 표현에만 한정하고, 해당 본문 위치에 각각 연결했습니다.
