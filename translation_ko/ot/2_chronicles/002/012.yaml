revisions:
- from: 그리고 이제 저는 지혜로운 사람, 곧 이해를 잘 아는 사람 훌람-아비를 보냈습니다.[a]
  to: 이제 저는 지혜롭고 분별력 있는 사람, 후람-아비를 보냈습니다.[a]
  rationale: 문두의 접속적 흐름은 ‘이제’로 자연스럽게 살리고, ‘지혜로운’과 ‘분별을 아는’이라는 원문의 두 وصف는 ‘지혜롭고 분별력 있는’으로 옮겼습니다. 후람-아비는 친족 관계나 직함을 본문에서 확정하지 않도록 음역을 유지하되, 표준 한국어 성서 인명 표기인 ‘후람’을 적용했습니다.
  reviewer_model: gpt-5.6-terra
