source:
  edition: WLC
  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
  footnotes:
  - marker: a
    text: Hebrew Huram-abi. The final term literally means 'my father,' but here it is likely an honorific title or part of the craftsman's designation; compare also 'Huram his father' in 2 Chronicles 4:16.
    reason: alternative_reading
translation:
  language: ko
  text: 이제 저는 지혜롭고 분별력 있는 사람, 후람-아비를 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘후람-아비’. 마지막 말은 문자적으로 ‘나의 아버지’를 뜻하지만, 여기서는 존칭이거나 장인의 명칭 일부일 수 있습니다. 2역대기 4:16의 ‘후람 그의 아버지’도 비교하십시오.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  lexicon: HALOT
  rationale: 문맥의 전환과 즉시성을 함께 살리기 위해 접속적 뉘앙스의 ‘그리고’와 시간 부사 ‘이제’를 함께 옮겼습니다.
- source_word: שָׁלַחְתִּי
  english_pob_choice: I have sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 보냈습니다(현재완료 뉘앙스)
  - 보내었습니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 완료된 행위를 자연스러운 한국어 서술로 옮겼습니다.
- source_word: חָכָם
  english_pob_choice: wise
  chosen_korean: 지혜로운
  alternatives_korean:
  - 지혜 있는
  - 슬기로운
  - 능숙한
  lexicon: HALOT
  rationale: 목공/기술 문맥에서 단순 지식보다 숙련을 포함하지만, 원어의 직접적 대응을 살려 기본 의미인 ‘지혜로운’을 유지했습니다.
- source_word: יוֹדֵעַ בִּינָה
  english_pob_choice: skilled in understanding
  chosen_korean: 이해를 잘 아는
  alternatives_korean:
  - 분별을 아는
  - 통찰력이 있는
  - 판단에 능한
  lexicon: HALOT
  rationale: 직역하면 ‘이해를 아는’이지만 한국어에서는 ‘잘 아는’으로 다듬어 인지적·실용적 숙련을 함께 드러냈습니다.
- source_word: לְחוּרָם אָבִי
  english_pob_choice: Huram-abi
  chosen_korean: 훌람-아비
  alternatives_korean:
  - 훌람 제 아버지
  - 훌람 나의 아버지
  - 훌람, 내 장인
  lexicon: HALOT
  rationale: ‘아비’의 친족적 의미를 본문에서 단정하지 않고, POB의 음역 방침에 따라 이름/칭호처럼 기능하는 결합형으로 처리했습니다.
theological_decisions:
- issue: לְחוּרָם אָבִי의 의미를 한국어에서 어떻게 보존할지
  chosen_reading: ‘훌람-아비’로 음역하여 호칭/명칭의 모호성을 유지했습니다.
  alternative_readings:
  - ‘훌람 나의 아버지’
  - ‘훌람, 내 장인’
  - ‘훌람 마스터 공인’
  rationale: 본문의 ‘아비’는 혈연 관계만 뜻한다고 단정하기 어려우므로, 의미를 해석으로 고정하지 않고 이름/칭호의 경계를 열어 두는 번역이 원문 긴장을 가장 잘 보존합니다.
  doctrine_reference: Translation philosophy §3, preserve ambiguity rather than resolving it
