reference: 2 Chronicles 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה לַֽ/חֹטְבִ֣ים לְֽ/כֹרְתֵ֣י הָ/עֵצִ֡ים נָתַתִּי֩ חִטִּ֨ים מַכּ֜וֹת לַ/עֲבָדֶ֗י/ךָ כֹּרִים֙ עֶשְׂרִ֣ים אֶ֔לֶף וּ/שְׂעֹרִ֕ים כֹּרִ֖ים עֶשְׂרִ֣ים אָ֑לֶף וְ/יַ֗יִן בַּתִּים֙ עֶשְׂרִ֣ים אֶ֔לֶף וְ/שֶׁ֕מֶן בַּתִּ֖ים עֶשְׂרִ֥ים אָֽלֶף׀׀׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
  footnotes:
  - marker: a
    text: Or possibly 'wheat as food' or 'crushed/beaten wheat'; the Hebrew expression is unusual.
    reason: lexical_alternative
  - marker: b
    text: A kor is an ancient dry measure.
    reason: cultural_note
  - marker: c
    text: A bath is an ancient liquid measure.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 보십시오. 나무를 베는 목수들 곧 나무를 자르는 자들에게 나는 당신의 종들에게 밀가루 같은 곡식 이만 고르, 보리 이만 고르, 포도주 이만 밧, 기름 이만 밧을 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밀가루 같은 곡식’은 히브리어의 특이한 표현을 풀어 옮긴 것으로, 문자적으로는 ‘찧거나 빻은 밀’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 고르는 고대 마른 곡식의 도량형입니다.
    reason: cultural_note
  - marker: c
    text: 밧은 고대 액체의 도량형입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 보십시오
  - 그리고 보라
  lexicon: HALOT
  rationale: 주의를 환기하는 הִנֵּה의 기능을 살리되, 현대 한국어에서 자연스럽고 공손한 호소형으로 옮겼습니다.
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  english_pob_choice: for the woodcutters, the cutters of the trees
  chosen_korean: 나무를 베는 목수들 곧 나무를 자르는 자들
  alternatives_korean:
  - 목재를 베는 자들
  - 나무꾼들 곧 나무를 자르는 자들
  lexicon: HALOT
  rationale: 두 동격 분사구를 중첩해 강조하는 구조를 유지했고, הָעֵצִים의 문자적 의미인 ‘나무’를 살리되 문맥상 목재 작업자를 가리키는 점을 반영했습니다.
- source_word: חִטִּים מַכּוֹת
  english_pob_choice: crushed wheat
  chosen_korean: 밀가루 같은 곡식
  alternatives_korean:
  - 부서진 밀
  - 빻은 밀
  - 찧은 밀
  lexicon: HALOT
  rationale: 문구가 특이하므로 POB의 해석을 따라 ‘crushed wheat’의 뜻을 살리되, 한국어에서 더 자연스럽게 소비용 곡물이라는 뉘앙스를 주는 표현으로 옮겼습니다.
- source_word: כֹּרִים / בַּתִּים
  english_pob_choice: kors / baths
  chosen_korean: 고르 / 밧
  alternatives_korean:
  - 코르 / 밧
  - 고르스 / 바스
  lexicon: HALOT
  rationale: 고대 도량형은 현대 단위로 환산하지 않고 음역해 본문의 문화적 거리감을 보존했습니다.
theological_decisions:
- issue: 봉헌/배급 명세의 문체
  chosen_reading: 이 절은 성전 건축 지원을 위한 배급 목록이므로, 과장이나 영적 재해석 없이 행정적·물질적 제공의 톤을 유지했습니다.
  alternative_readings:
  - 은유적으로 재구성하기
  - 더 경건한 후원 문구로 풀어쓰기
  rationale: 히브리어 원문은 실제 물자 공급을 나열하므로, 한국어에서도 그 사실성을 보존하는 것이 본문의 뜻에 충실합니다.
  doctrine_reference: 본문 문맥과 서술 장르
