  source_fidelity: 수정이 필요합니다. ‘목수들’은 히브리어 חֹטְבִים/כֹרְתֵי הָעֵצִים가 가리키는 벌목·목재 절단 노동자와 맞지 않으며, ‘밀가루 같은 곡식’은 חִטִּים(밀)과 מַכּוֹת의 난해하지만 가공된 밀이라는 뜻을 지나치게 바꾸었습니다. 수량과 고대 도량형은 유지해야 합니다.
  naturalness: ‘그리고 보십시오’은 가능하나, 본문 안에서는 ‘보십시오’가 더 자연스럽습니다. 또한 ‘나무를 베는 목수들 곧 나무를 자르는 자들’은 의미가 부정확하고 반복도 부자연스럽습니다. 동격 관계를 살려 ‘나무를 베는 자들, 곧 나무를 자르는 당신의 종들에게’로 다듬었습니다.
  terminology: 고대 건량 단위는 ‘고르’, 액량 단위는 ‘밧’으로 유지합니다. מַכּוֹת는 의미가 확정되지 않은 특이한 표현이므로 본문에서는 ‘찧은 밀’로 옮기고, 각주에서 ‘식량용 밀’ 및 ‘빻은 밀’의 가능성을 밝혔습니다.
