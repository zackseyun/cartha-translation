    issue: ‘밀가루 같은 곡식’
    rationale: 원문의 ‘밀’을 ‘곡식’으로 일반화하고 ‘밀가루’라는 별도 가공물을 도입합니다. 난해성을 각주로 보존하면서 ‘찧은 밀’로 옮기는 편이 더 충실합니다.
