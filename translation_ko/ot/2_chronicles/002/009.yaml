- source_word: חִטִּים מַכּוֹת
  english_pob_choice: crushed wheat
  chosen_korean: 밀가루 같은 곡식
  alternatives_korean:
  - 부서진 밀
  - 빻은 밀
  - 찧은 밀
  lexicon: HALOT
  rationale: 문구가 특이하므로 POB의 해석을 따라 ‘crushed wheat’의 뜻을 살리되, 한국어에서 더 자연스럽게 소비용 곡물이라는 뉘앙스를 주는 표현으로 옮겼습니다.
- source_word: כֹּרִים / בַּתִּים
  english_pob_choice: kors / baths
  chosen_korean: 고르 / 밧
  alternatives_korean:
  - 코르 / 밧
  - 고르스 / 바스
  lexicon: HALOT
  rationale: 고대 도량형은 현대 단위로 환산하지 않고 음역해 본문의 문화적 거리감을 보존했습니다.
theological_decisions:
- issue: 봉헌/배급 명세의 문체
  chosen_reading: 이 절은 성전 건축 지원을 위한 배급 목록이므로, 과장이나 영적 재해석 없이 행정적·물질적 제공의 톤을 유지했습니다.
  alternative_readings:
  - 은유적으로 재구성하기
  - 더 경건한 후원 문구로 풀어쓰기
  rationale: 히브리어 원문은 실제 물자 공급을 나열하므로, 한국어에서도 그 사실성을 보존하는 것이 본문의 뜻에 충실합니다.
  doctrine_reference: 본문 문맥과 서술 장르
