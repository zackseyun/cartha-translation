id: 2CH.2.10
reference: 2 Chronicles 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
  footnotes:
  - marker: a
    text: Hebrew Huram; traditionally Hiram.
    reason: alternative_reading
  - marker: b
    text: Or “Out of the LORD’s love for his people.”
    reason: lexical_alternative
  - marker: c
    text: Or 'said in a letter, and sent it to Solomon'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 두로 왕 후람이 편지로 솔로몬에게 답하여 말했습니다. “야훼께서 자기 백성을 사랑하시므로, 당신을 그들 위에 왕으로 세우셨습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전통적 영어형 Hiram 대신 히브리어 본문형 Huram을 따른 것입니다.
    reason: previous_rendering
  - marker: b
    text: 히브리어 בְּאַהֲבַת는 여기서 ‘...의 사랑 안에서’보다 원인 의미의 ‘...하므로’로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּרָם
  english_pob_choice: Huram
  chosen_korean: 후람
  alternatives_korean:
  - 히람
  lexicon: HALOT
  rationale: 히브리어 본문 형태 חוּרָם을 직접 반영해 후람으로 옮겼습니다. 전통적 인명형 히람은 친숙하지만 여기서는 본문의 철자와 맞지 않습니다.
- source_word: וַיֹּאמֶר ... בִּכְתָב ... וַיִּשְׁלַח
  english_pob_choice: answered in a letter that he sent to Solomon
  chosen_korean: 편지로 ... 답하여 ... 보냈습니다
  alternatives_korean:
  - 편지에 적어 솔로몬에게 보냈습니다
  - 편지로 솔로몬에게 말했습니다
  lexicon: HALOT
  rationale: 두 동사(‘말하다’와 ‘보내다’)를 한국어에서 자연스럽게 풀어, 서신 회답이라는 문맥을 살리면서도 중복을 줄였습니다.
- source_word: בְּאַהֲבַת יְהוָה אֶת עַמּוֹ
  english_pob_choice: Because Yahweh loves his people
  chosen_korean: 야훼께서 자기 백성을 사랑하시므로
  alternatives_korean:
  - 야훼의 자기 백성을 향한 사랑 때문에
  - 야훼께서 자기 백성을 사랑하시는 까닭에
  lexicon: HALOT
  rationale: בְּ + 명사구가 여기서는 원인 의미로 작동하므로, 결과 절을 이끄는 ‘...하므로’로 옮겼습니다. ‘자기 백성’은 עַמּוֹ의 언약적 소유격을 반영합니다.
- source_word: נְתָנְךָ עֲלֵיהֶם מֶלֶךְ
  english_pob_choice: he has made you king over them
  chosen_korean: 당신을 그들 위에 왕으로 세우셨습니다
  alternatives_korean:
  - 당신을 그들 위의 왕으로 삼으셨습니다
  - 당신을 그들의 왕으로 임명하셨습니다
  lexicon: HALOT
  rationale: נָתַן은 문자적으로 ‘주다’지만 왕위 수여 문맥에서는 ‘세우다/삼다’가 더 정확합니다. ‘그들 위에’는 עלֵיהֶם의 지배 관계를 살립니다.
theological_decisions:
- issue: YHWH(יהוה) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 여호와 명칭이 아니라 야훼의 이름을 직접 쓰므로, 프로젝트 기본 원칙에 따라 고유명으로 옮겼습니다. 이는 ‘주’로 대치하는 방식보다 원문 투명성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
