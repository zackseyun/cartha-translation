  terminology: ‘백향목’과 ‘알구목’은 적절합니다. בְּרוֹשִׁים에는 ‘사이프러스’를 채택하되 수종 불확실성과 잣나무·전나무 등의 대안을 각주에 보존합니다. וְהִנֵּה의 ‘보십시오’는 현대 격식체에서 주의 환기 기능을 잘 살립니다.
