base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Now send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
  footnotes:
  - marker: a
    text: Or 'juniper' or 'fir' for 'cypress' (Hebrew beroshim); the exact species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: '''Algum'' may also be rendered ''almug''; some identify it with sandalwood, but the species is uncertain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 저에게 레바논에서 백향목과 사이프러스[a]와 알구목[b] 목재를 보내십시오. 당신의 종들이 레바논의 나무를 베는 데 능숙하다는 것을 저는 알고 있습니다. 보십시오[c], 제 종들이 당신의 종들과 함께 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사이프러스’는 히브리어 בְּרוֹשִׁים(베로쉼)를 옮긴 것입니다. 잣나무, 전나무 등으로도 번역되지만, 정확한 수종은 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘알구목’은 히브리어 אַלְגּוּמִּים을 음역한 것입니다. ‘알무그’로도 옮기며, 일부는 백단목으로 보지만 정확한 수종은 불확실합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 וְהִנֵּה는 뒤따르는 진술에 주의를 환기하는 표현입니다.
    reason: lexical_alternative
