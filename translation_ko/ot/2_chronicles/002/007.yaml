id: 2CH.2.7
reference: 2 Chronicles 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּֽ/שְׁלַֽח לִ/י֩ עֲצֵ֨י אֲרָזִ֜ים בְּרוֹשִׁ֣ים וְ/אַלְגּוּמִּים֮ מֵֽ/הַ/לְּבָנוֹן֒ כִּ֚י אֲנִ֣י יָדַ֔עְתִּי אֲשֶׁ֤ר עֲבָדֶ֨י/ךָ֙ יֽוֹדְעִ֔ים לִ/כְר֖וֹת עֲצֵ֣י לְבָנ֑וֹן וְ/הִנֵּ֥ה עֲבָדַ֖/י עִם עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Now send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
  footnotes:
  - marker: a
    text: Or 'juniper' or 'fir' for 'cypress' (Hebrew beroshim); the exact species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: '''Algum'' may also be rendered ''almug''; some identify it with sandalwood, but the species is uncertain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 저에게 레바논에서 백향목과 잣나무와 알구목[a] 목재를 보내십시오. 저는 당신의 종들이 레바논에서 나무를 베는 일을 잘 안다는 것을 알고 있습니다. 보십시오[b], 제 종들이 당신의 종들과 함께 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘알구목’은 히브리어 אַלְגּוּמִּים을 음역한 것입니다. 정확한 수종은 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 וְהִנֵּה는 여기서 주의를 끄는 표지로 쓰였으며, 문맥상 ‘보십시오’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח
  english_pob_choice: Now send me
  chosen_korean: 이제 저에게 … 보내십시오
  alternatives_korean:
  - 그러니 저에게 … 보내십시오
  - 그리고 저에게 … 보내십시오
  lexicon: HALOT
  rationale: 접속된 명령형의 흐름을 살리되, 한국어에서는 문맥 전개를 자연스럽게 여는 ‘이제’가 가장 잘 맞습니다.
- source_word: עֲצֵי אֲרָזִים
  english_pob_choice: cedar ... timber
  chosen_korean: 백향목 … 목재
  alternatives_korean:
  - 백향목 나무
  - 백향목 재목
  lexicon: HALOT
  rationale: 건축용 자재 문맥이므로 ‘나무’보다 재료성을 드러내는 ‘목재’가 원문 의도에 가깝습니다.
- source_word: בְּרוֹשִׁים
  english_pob_choice: cypress
  chosen_korean: 잣나무
  alternatives_korean:
  - 사이프러스
  - 측백나무
  lexicon: HALOT
  rationale: 종 식별이 확정적이지 않으므로, POB의 주해 취지를 따라 한국어 본문에는 흔히 대응되는 수종명을 두고, 불확실성은 주석으로 처리했습니다.
- source_word: אַלְגּוּמִּים
  english_pob_choice: algum
  chosen_korean: 알구목
  alternatives_korean:
  - 알굼목
  - 알무그
  lexicon: HALOT
  rationale: 히브리어 음가를 비교적 투명하게 옮겨 고유한 목재 명칭임을 보존했습니다. 본문에서 임의로 특정 수종으로 단정하지 않았습니다.
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보시옵소서
  - 보라
  lexicon: HALOT
  rationale: 주의 환기 기능을 한국어 명령/감탄형으로 자연스럽게 옮기면서도, 격식체를 유지했습니다.
theological_decisions:
- issue: 솔로몬의 요청문에서 대등한 협력 관계를 어떻게 드러낼지
  chosen_reading: ‘제 종들이 당신의 종들과 함께 있을 것입니다’로 옮겨, 원문의 단순 진술형 약속과 공동 작업의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - ‘제 종들이 당신의 종들과 함께하겠습니다’
  - ‘제 종들이 당신의 종들과 함께 있습니다’
  rationale: 원문은 미래형/예정 진술로 협력 관계를 제시하므로, 한국어에서도 지나친 호의나 명령처럼 읽히지 않도록 균형을 잡았습니다.
  doctrine_reference: 본문 맥락의 외교적·실무적 협력 진술
- issue: 베브로서의 ‘보십시오’ register
  chosen_reading: ‘보십시오’로 두어 격식을 유지하되, 직접적 외침의 힘을 살렸습니다.
  alternative_readings:
  - ‘보라’
  - ‘보시옵소서’
  rationale: 왕의 요청문에 어울리는 현대 한국어 격식체를 택했고, 예배적 어투로 과도하게 신학화하지 않았습니다.
  doctrine_reference: 화행(register) 보존
