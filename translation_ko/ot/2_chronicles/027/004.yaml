lexical_decisions:
- source_word: עָרִים
  english_pob_choice: cities
  chosen_korean: 성읍들
  alternatives_korean:
  - 도시들
  - 성들
  lexicon: HALOT
  rationale: 왕의 건축 기사에서 עָרִים는 단순한 마을보다 규모 있는 거주 중심지를 가리키므로, 현대 한국어에서는 ‘성읍들’이 역사적·서술적 뉘앙스를 가장 자연스럽게 살립니다.
- source_word: בְּהַר יְהוּדָה
  english_pob_choice: in the hill country of Judah
  chosen_korean: 유다 산지에
  alternatives_korean:
  - 유다의 산지에
  - 유다 산지 지역에
  lexicon: HALOT
  rationale: הַר는 여기서 단일 ‘산’보다 지리적 영역을 뜻하므로, 한국어의 관용적 지리 표현인 ‘산지’로 옮겨 지역적 의미를 분명히 했습니다.
- source_word: בִּירָנִיּוֹת
  english_pob_choice: fortresses
  chosen_korean: 요새
  alternatives_korean:
  - 성채
  - 성루
  lexicon: HALOT
  rationale: 이 단어는 방어용으로 견고하게 세운 시설을 가리키므로, ‘성채’보다 더 포괄적이고 현대 독자에게도 분명한 ‘요새’를 선택했습니다.
- source_word: מִגְדָּלִים
  english_pob_choice: towers
  chosen_korean: 망대들
  alternatives_korean:
  - 탑들
  - 감시탑들
  lexicon: HALOT
  rationale: מִגְדָּלִים는 일반적인 ‘탑’이지만, 본문은 방어 시설 맥락이므로 기능이 드러나는 전통적 한국어 표현 ‘망대들’이 적절합니다.
