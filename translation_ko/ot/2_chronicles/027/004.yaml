  naturalness: ‘유다 산지’, ‘성읍들’, ‘요새’, ‘망대들’은 현대 한국어의 격식 있는 성경 서술문에서 자연스럽습니다. ‘숲 속에는’도 가능하지만, 원문의 단순한 장소 표현과 더 가깝고 간결한 ‘숲에는’이 더 적절합니다.
