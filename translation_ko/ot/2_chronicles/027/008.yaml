lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  english_pob_choice: twenty-five years old
  chosen_korean: 스물다섯 살
  alternatives_korean:
  - 스물다섯 해의 나이
  - 스물다섯 살 된
  lexicon: HALOT
  rationale: 히브리어의 전형적인 연령 표현을 한국어의 자연스러운 나이 표현으로 옮겼습니다. '살'이 본문의 연령 정보와 가장 직접적으로 대응합니다.
- source_word: הָיָה בְמָלְכ/וֹ
  english_pob_choice: when he began to reign
  chosen_korean: 왕위에 오를 때
  alternatives_korean:
  - 통치하기 시작할 때
  - 왕이 되었을 때
  lexicon: HALOT
  rationale: 직역하면 '그가 그의 다스림 안에 있었다'는 관용구로, 즉위 시점을 가리킵니다. '왕위에 오를 때'가 그 기능을 가장 간결하게 드러냅니다.
- source_word: מָלַךְ
  english_pob_choice: he reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 재위했습니다
  lexicon: HALOT
  rationale: 왕으로서의 통치 행위를 나타내므로, 현대 한국어에서 자연스럽고 서술적인 '다스렸습니다'를 선택했습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에
  lexicon: HALOT
  rationale: 전치사 ב의 장소 의미를 그대로 반영하여 통치 장소를 분명히 했습니다.
