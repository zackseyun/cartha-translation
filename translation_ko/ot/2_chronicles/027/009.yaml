base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'died with his fathers.' The Hebrew says 'slept with his fathers,' a standard royal death formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 요담이 그의 조상들과 함께 잠들었습니다[a]. 그를 다윗 성에 장사하였습니다. 그리고 그의 아들 아하스가 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 조상들과 함께 잠들었다’입니다. 이는 왕실 기록에서 흔히 죽음을 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들었습니다
  alternatives_korean:
  - 누웠습니다
  - 죽었습니다
  lexicon: HALOT
  rationale: 왕들의 죽음 공식을 살려 직역성을 유지하면서도 한국어에서 자연스러운 완곡 표현인 ‘잠들다’를 사용했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: ‘아버지들’의 문자성을 살리되, 한국어에서는 왕조 문맥의 관용구를 더 자연스럽게 드러내기 위해 ‘조상들’로 옮겼습니다.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  english_pob_choice: they buried him
  chosen_korean: 사람들이 그를 장사하였습니다
  alternatives_korean:
  - 그를 장사하였습니다
  - 그를 묻었습니다
  lexicon: HALOT
  rationale: 히브리어의 능동 복수를 한국어에서 자연스럽게 나타내기 위해 무정칭 주어 ‘사람들이’를 사용했고, 매장 행위를 ‘장사하다’로 옮겼습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 뒤를 이어
  alternatives_korean:
  - 그의 자리에
  - 그 대신
  lexicon: HALOT
  rationale: 왕위 계승 문맥에서 ‘in his place’의 계승·대체 의미를 한국어 관용으로 가장 분명하게 드러내는 표현입니다.
theological_decisions:
- issue: 왕의 죽음 공식을 어떻게 한국어로 보존할지
  chosen_reading: ‘잠들었습니다’로 죽음의 관용구를 유지하되, 본문은 실제 매장을 분명히 말하도록 구성했습니다.
  alternative_readings:
  - 직역적으로 ‘잤습니다’
  - 해석적으로 ‘죽었습니다’
  rationale: 히브리어의 전형적 왕실 사망 공식을 평이하게 풀면 의미가 약해질 수 있고, 반대로 ‘죽었습니다’만 쓰면 원문의 관용적 표현이 사라집니다. ‘잠들다’가 두 요소를 가장 잘 함께 살립니다.
  doctrine_reference: 본문의 역사 서술과 장례 관습 표현
- issue: ‘그의 조상들’의 범위를 어떻게 이해할지
  chosen_reading: 왕조 계보 전체를 가리키는 관용구로 보아 ‘조상들’로 처리했습니다.
  alternative_readings:
  - 문자적으로 ‘아버지들’
  - ‘선조들’
  rationale: 이 표현은 교리적 논점이 아니라 왕실 연대기의 전형적 장례/사망 공식입니다. 한국어에서는 혈연 직계만을 뜻하는 ‘아버지들’보다 왕조 맥락을 넓게 받는 ‘조상들’이 의미 전달에 유리합니다.
  doctrine_reference: 역사서의 관용적 왕실 공식
