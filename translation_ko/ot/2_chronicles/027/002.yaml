revisions:
- from: 그는 야훼 보시기에 옳은 일을 행했습니다. 그의 아버지 웃시야가 행한 모든 것과 같았으나, 야훼의 성전에는 들어가지 않았습니다. 그러나 백성은 여전히 부패한 일을 하고 있었습니다.[a][b]
  to: 그는 야훼 보시기에 옳은 일을 행했습니다. 그의 아버지 웃시야가 행한 모든 것과 같이 행했으나, 야훼의 성전에는 들어가지 않았습니다.[a] 그러나 백성은 여전히 타락한 행위를 계속하고 있었습니다.[b]
  rationale: 비교 구문의 주어가 행한 일을 명시하고, 마지막 분사의 지속적이며 포괄적인 부패 의미를 더 자연스럽게 옮겼습니다. 주석은 영어 POB 감사 기록의 두 핵심 사항, 곧 웃시야와의 문맥적 대조 및 מַשְׁחִיתִים의 어휘적 대안을 각각 해당 위치에 배치했습니다.
