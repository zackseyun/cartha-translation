  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: ko
  text: 요담은 강해졌습니다. 이는 그가 그의 하나님 야훼 앞에서 자신의 길들을 굳게 세웠기 때문입니다.[a]
  philosophy: optimal-equivalence
