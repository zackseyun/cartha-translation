- from: 여담은 굳어졌습니다. 그의 길을 야훼 그의 하나님 앞에서 바로잡았기 때문입니다.[a]
  to: 요담은 강해졌습니다. 이는 그가 그의 하나님 야훼 앞에서 자신의 길들을 굳게 세웠기 때문입니다.[a]
  rationale: 인명을 바로잡고, 왕의 강성함을 뜻하는 동사를 자연스럽게 ‘강해졌습니다’로 옮겼습니다. ‘길들을 굳게 세웠다’는 הֵכִין דְּרָכָיו의 확립·정비 의미를 보존하면서, 원문에 없는 도덕적 교정의 함의를 피합니다. 각주에는 가능한 어휘적 대안을 제시했습니다.
