source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֖ק יוֹתָ֑ם כִּ֚י הֵכִ֣ין דְּרָכָ֔י/ו לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/006.yaml
  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: ko
  text: 여담은 굳어졌습니다. 그의 길을 야훼 그의 하나님 앞에서 바로잡았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 길들을 준비/정돈했다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  english_pob_choice: became strong
  chosen_korean: 굳어졌습니다
  alternatives_korean:
  - 강해졌습니다
  - 튼튼해졌습니다
  lexicon: חזק
  rationale: 히필/니팔 계열의 상태 변화로서 단순한 물리적 ‘강함’보다 왕권과 국정이 안정되어 ‘굳어짐’이란 표현이 문맥상 더 자연스럽습니다.
- source_word: הֵכִין דְּרָכָיו
  english_pob_choice: ordered his ways
  chosen_korean: 그의 길을 바로잡았기 때문입니다
  alternatives_korean:
  - 그의 길을 준비했기 때문입니다
  - 그의 길을 정돈했기 때문입니다
  lexicon: כון
  rationale: POB의 ‘ordered’는 행위의 정비·정돈을 반영하므로, 한국어에서는 도덕적·행정적 삶의 정렬을 드러내는 ‘바로잡다’가 가장 가깝습니다.
- source_word: לִפְנֵי יְהוָה אֱלֹהָיו
  english_pob_choice: before the LORD his God
  chosen_korean: 야훼 그의 하나님 앞에서
  alternatives_korean:
  - 주 그의 하나님 앞에서
  - 여호와 그의 하나님 앞에서
  lexicon: יהוה
  rationale: 본 프로젝트 기본값에 따라 יהוה는 ‘야훼’로 옮기되, POB의 LORD를 반영해 인칭 대명사 ‘그의 하나님’을 유지했습니다.
theological_decisions:
- issue: ‘강해짐’의 원인이 군사력이나 개인 역량이 아니라 야훼 앞에서의 삶의 정비라는 점
  chosen_reading: 마지막 절반을 인과절로 처리해, 그의 강함이 하나님 앞에서 길을 바로잡은 결과임을 드러냈습니다.
  alternative_readings:
  - 독립절로 ‘여담은 굳어졌습니다. 그는…’
  - ‘그는 강해졌습니다’만으로 평이하게 처리
  rationale: 히브리어 כִּי가 원인 관계를 명시하므로, 한국어에서도 인과를 분명히 보여 주어 본문의 신학적 강조를 보존했습니다.
  doctrine_reference: 섭리와 순종의 인과 관계
