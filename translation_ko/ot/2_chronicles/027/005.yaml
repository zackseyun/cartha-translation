  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
  footnotes:
  - marker: a
    text: Hebrew 'ten thousand cors of wheat, and ten thousand of barley'; the measure 'cors' is understood with 'barley' as well.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 암몬 자손의 왕과 싸워 그들을 이겼습니다. 암몬 자손은 그해에 은 백 달란트와 밀 만 코르와 보리 만 코르[a]를 그에게 주었습니다. 그들은 이것을 둘째 해와 셋째 해에도 그에게 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘밀 만 코르와 보리 만’이라고 하며, ‘코르’는 보리에도 적용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא נִלְחַם עִם
  english_pob_choice: He fought with
  chosen_korean: 그는 ...과 싸워
  alternatives_korean:
  - 그는 ...과 전쟁을 벌여
  - 그는 ...과 싸웠습니다
  lexicon: HALOT
  rationale: נלחם עם는 상대와 전투를 벌인다는 뜻이므로, 한국어에서는 자연스럽고 직설적인 ‘싸워’로 옮기되 문체는 합쇼체로 맞췄습니다.
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  english_pob_choice: prevailed against them
  chosen_korean: 그들을 이겼습니다
  alternatives_korean:
  - 그들보다 강해졌습니다
  - 그들 위에 우세했습니다
  - 그들을 압도했습니다
  lexicon: HALOT
  rationale: חזק עַל은 단순한 강해짐이 아니라 전투에서 우세를 점해 이기는 의미이므로, 결과를 분명히 드러내는 ‘이겼습니다’로 옮겼습니다.
- source_word: מֵאָה כִּכַּר כֶּסֶף
  english_pob_choice: one hundred talents of silver
  chosen_korean: 은 백 달란트
  alternatives_korean:
  - 은 일백 달란트
  - 은 백 재능
  lexicon: HALOT
  rationale: כִּכָּר는 고대 중량 단위이므로 관용적으로 ‘달란트’를 사용했고, 수량은 현대 한국어 어순에 맞게 간결하게 배치했습니다.
- source_word: כֹּרִים חִטִּים וּשְׂעוֹרִים ... עֲשֶׂרֶת אֲלָפִים
  english_pob_choice: ten thousand cors of wheat, and ten thousand of barley
  chosen_korean: 밀 만 코르와 보리 만 코르
  alternatives_korean:
  - 밀 만 코르와 보리 만 코르
  - 밀 만과 보리 만 코르
  lexicon: HALOT
  rationale: 코르는 본문의 드라이 측량 단위로 음역을 유지했고, 영어 POB의 각주처럼 보리에도 생략된 측량 단위가 이어진다는 점을 본문에 보완해 균형 있게 옮겼습니다.
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  english_pob_choice: This ... paid to him
  chosen_korean: 이 일은 ... 그에게 바친 것입니다
  alternatives_korean:
  - 이것을 그에게 돌려준 것입니다
  - 이것을 그에게 지급한 것입니다
  lexicon: HALOT
  rationale: הֵשִׁיבוּ는 문자적으로 ‘돌려주다’이지만 조공 문맥에서는 반복적으로 바치는 행위이므로, 경제적·제의적 뉘앙스를 모두 해치지 않는 ‘바치다’로 처리했습니다.
theological_decisions:
- issue: 조공의 성격을 어떻게 드러낼지
  chosen_reading: 본문의 ‘주었다/돌려주었다’는 단순 전달이 아니라 패전 뒤에 반복적으로 바쳐진 조공으로 이해해, ‘바쳤습니다’로 번역했습니다.
  alternative_readings:
  - 그에게 주었습니다
  - 그에게 지급했습니다
  rationale: 히브리어 הֵשִׁיבוּ와 문맥 전체가 전쟁 패배 뒤의 속공/조공을 가리키므로, 독자가 힘의 종속 관계를 분명히 읽도록 했습니다.
  doctrine_reference: 본문 의미와 서술 맥락에 대한 역사-문법적 판단
- issue: 보리의 측량 단위 생략 보완
  chosen_reading: 영어 POB 각주를 따라 ‘보리’에도 코르를 보충해 읽히도록 했습니다.
  alternative_readings:
  - 보리 만
  - 보리 만 코르
  rationale: 히브리어는 두 번째 항목에서 측량 단위를 생략하지만 의미상 공유되므로, 한국어 본문에서는 오해를 줄이기 위해 보충해 자연스럽게 만들었습니다.
  doctrine_reference: 본문의 생략 보완에 관한 번역상 판단
