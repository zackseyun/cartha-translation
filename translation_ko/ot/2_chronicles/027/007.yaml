  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶתֶר֙ דִּבְרֵ֣י יוֹתָ֔ם וְ/כָל מִלְחֲמֹתָ֖י/ו וּ/דְרָכָ֑י/ו הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: Now the rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
  footnotes:
  - marker: a
    text: Or 'the words/matters concerning Jotham'; the Hebrew idiom here refers to the record of his deeds or affairs.
    reason: lexical_alternative
  - marker: b
    text: '''His ways'' can also mean ''his conduct.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 요담의 남은 행적과 그의 모든 전쟁과 그의 행실은, 보십시오, 이스라엘과 유다의 열왕의 책에 기록되어 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용법상 ‘말들’보다는 왕의 행적·사적을 가리키는 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 행실’은 문자적으로는 ‘그의 길들’이며, 여기서는 그의 삶의 방식이나 처신을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  english_pob_choice: Now the rest of the acts of Jotham
  chosen_korean: 요담의 남은 행적
  alternatives_korean:
  - 요담의 나머지 행적
  - 요담의 남은 일들
  - 요담에 관한 남은 기록
  lexicon: HALOT
  rationale: 왕의 결산 공식에서 דִּבְרֵי는 단순한 ‘말’보다 행적·사적을 가리키므로, ‘남은 행적’이 POB의 ‘acts’와 מקור의 관용법을 함께 살립니다.
- source_word: וְכָל מִלְחֲמֹתָיו
  english_pob_choice: and all his wars
  chosen_korean: 그의 모든 전쟁
  alternatives_korean:
  - 그의 모든 전투
  - 그의 모든 전쟁과 싸움
  - 그의 모든 군사 원정
  lexicon: HALOT
  rationale: מִלְחָמָה의 기본 의미를 직접 살려 ‘전쟁’으로 옮겼고, 역사 요약문의 열거성을 유지했습니다.
- source_word: וּדְרָכָיו
  english_pob_choice: and his ways
  chosen_korean: 그의 행실
  alternatives_korean:
  - 그의 길들
  - 그의 삶의 방식
  - 그의 행위
  lexicon: HALOT
  rationale: 직역 ‘길’도 가능하지만, 여기서는 인물의 삶의 태도·행동을 가리키는 관용적 의미가 분명하므로 ‘행실’이 가장 자연스럽습니다.
- source_word: הִנָּם כְּתוּבִים עַל סֵפֶר
  english_pob_choice: behold, they are written
  chosen_korean: 보십시오, … 기록되어 있습니다
  alternatives_korean:
  - 보라, … 기록되어 있습니다
  - 실로 … 기록되어 있습니다
  - … 기록되어 있습니다
  lexicon: HALOT
  rationale: הִנָּם의 지시·강조 기능을 살리되 현대 한국어에서는 ‘보십시오’가 합쇼체 서술과 잘 맞아, 아카이브형 공식 문체를 유지합니다.
