  text: 그는 야훼의 집의 윗문을 세우고, 오벨 성벽에 많은 것을 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오벨 성벽에서 많이 건축했습니다’ 또는 ‘오벨 성벽에 풍성하게 건축했습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָה
  english_pob_choice: built
  chosen_korean: 건축하고
  alternatives_korean:
  - 지었고
  - 세웠고
  - 건설하고
  lexicon: HALOT
  rationale: 성전 문과 성벽에 대한 말이므로 단순한 ‘짓다’보다 공사적 뉘앙스가 살아 있는 ‘건축하다’가 적합합니다.
- source_word: שַׁעַר
  english_pob_choice: gate
  chosen_korean: 문
  alternatives_korean:
  - 성문
  - 출입문
  lexicon: HALOT
  rationale: 성전 맥락의 שַׁעַר는 일반적인 ‘문’보다 특정한 출입 구조물을 가리키므로 ‘윗문’으로 간결하게 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  - 야훼의 성전
  lexicon: HALOT
  rationale: source가 문자적으로 ‘야훼의 집’이므로, 전통적 완곡어 ‘성전’보다 원문 구조를 살린 표현을 택했습니다.
- source_word: לָרֹב
  english_pob_choice: much
  chosen_korean: 많이
  alternatives_korean:
  - 풍성히
  - 대량으로
  - 크게
  lexicon: HALOT
  rationale: 이 부사는 건축 행위의 양과 범위를 나타내므로, 한국어에서는 ‘많이’가 원문의 간결한 정도 표현을 가장 자연스럽게 반영합니다.
theological_decisions:
- issue: יהוה의 표기
