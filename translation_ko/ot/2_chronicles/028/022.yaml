  - 주
  rationale: 원문에 יְהוָה가 직접 나오므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨 언약 이름을 가렸습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
