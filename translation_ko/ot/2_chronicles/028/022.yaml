  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
  footnotes:
  - marker: a
    text: 'Hebrew: ''added to act unfaithfully against the LORD,'' an idiom meaning he continued or went further in unfaithfulness.'
