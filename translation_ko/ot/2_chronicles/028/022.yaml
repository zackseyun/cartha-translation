  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 לִמְעוֹל בַּיהוָה는 야훼를 향한 언약적 배신/불성실을 뜻하므로, ‘신실하지 않게 행동하다’보다 ‘야훼께 불성실하게 행하다’가 원문의 적극적 동사와 대상 관계를 더 정확히 드러냅니다. וַיּוֹסֶף의 ‘더 나아가다/계속하다’도 ‘더욱더’로 보존했습니다.
  naturalness: 초안의 ‘야훼께 더욱 신실하지 않게 행동하였습니다’는 부정 표현이 다소 우회적이고 한국어 관용상 무겁습니다. ‘야훼께 더욱더 불성실하게 행했습니다’가 현대 표준어 합쇼체로 더 자연스럽고 간결합니다. 강조적 동격은 대시와 ‘바로 그’로 유지했습니다.
  terminology: יהוה는 프로젝트 용례에 따라 ‘야훼’로 유지합니다. מעל은 일반적인 잘못보다 신의·언약을 저버리는 행위이므로 ‘불성실하게 행하다’로 옮기는 것이 적절합니다. 아하스는 통용 인명 표기입니다.
