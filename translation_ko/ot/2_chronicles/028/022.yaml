translation:
  language: ko
  text: 환난의 때에 그는 야훼께 더욱 신실하지 않게 행동하였습니다—바로 그 아하스 왕입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘불성실하게 행하기를 더하다’라는 뜻으로, 계속해서 또는 더 나아가 신실하지 않게 행동한다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הָצֵר לוֹ
  english_pob_choice: In the time of his distress
  chosen_korean: 환난의 때에
  alternatives_korean:
  - 그가 곤경에 처했을 때
  - 그의 고난의 때에
  - 그가 압박을 받을 때에
  lexicon: HALOT
  rationale: 시간을 나타내는 표현으로 옮기되, הָצֵר לוֹ의 압박·환난 뉘앙스를 자연스러운 합쇼체로 압축했습니다.
- source_word: וַיּוֹסֶף לִמְעוֹל
  english_pob_choice: he continued to act unfaithfully
  chosen_korean: 그는 … 더욱 신실하지 않게 행동하였습니다
  alternatives_korean:
  - 그는 계속 불성실하게 행동하였습니다
  - 그는 계속 야훼를 배반하였습니다
  - 그는 더욱 범죄하였습니다
  lexicon: HALOT
  rationale: יסף+부정사 구조를 단순한 ‘계속’보다 ‘더욱’으로 살려, 이미 있던 불성실함에 추가되거나 더 나아간 행동이라는 뜻을 반영했습니다.
- source_word: לִמְעוֹל בַּיהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 야훼를 향해
  - 야훼 앞에서
  - 주님께
  lexicon: HALOT
  rationale: מעל은 대상에 대한 언약적 불성실을 뜻하므로, 한국어에서는 단순한 방향보다 ‘~께’로 관계적·배신적 성격을 드러냈습니다. 본문은 Tetragrammaton을 학술적으로 ‘야훼’로 옮기는 프로젝트 기본값을 따릅니다.
- source_word: הוּא הַמֶּלֶךְ אָחָז
  english_pob_choice: he, King Ahaz
  chosen_korean: 바로 그 아하스 왕입니다
  alternatives_korean:
  - 그 아하스 왕입니다
  - 그는 아하스 왕이었습니다
  - 곧 아하스 왕입니다
  lexicon: HALOT
  rationale: 독립 대명사 הוּא의 강조를 ‘바로 그’로 살리고, 서술적 동격을 한국어 어순에 맞게 처리했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
