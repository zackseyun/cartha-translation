translation:
  language: ko
  text: 그가 환난을 당할 때에, 그는 야훼께 더욱더 불성실하게 행했습니다[a]—바로 그 아하스 왕입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘불성실하게 행하는 일을 더하였다’라는 뜻으로, 계속해서 또는 더욱 불성실하게 행했다는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הָצֵר לוֹ
  english_pob_choice: In the time of his distress
  chosen_korean: 환난의 때에
  alternatives_korean:
