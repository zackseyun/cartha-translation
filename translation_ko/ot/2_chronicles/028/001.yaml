id: 2CH.28.1
reference: 2 Chronicles 28:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
  footnotes:
  - marker: a
    text: Hebrew 'David his father'; 'father' here means royal ancestor, not immediate parent.
    reason: cultural_note
translation:
  language: ko
  text: 아하스는 왕이 되었을 때에 스무 살이었고, 예루살렘에서 열여섯 해 동안 다스렸습니다. 그는 야훼의 눈에 바른 일을 하지 않았는데, 그의 조상 다윗이 한 것과 같지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘조상’은 직계 부친이 아니라 왕조의 선조를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִ֤ים שָׁנָה֙
  english_pob_choice: was twenty years old
  chosen_korean: 스무 살이었고
  alternatives_korean:
  - 스무 살의 아들이었고
  - 스무 해가 되었고
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 현대 한국어로 자연스럽게 옮기되, 연령 정보를 그대로 보존했습니다.
- source_word: בְּ/מָלְכ֔/וֹ
  english_pob_choice: when he became king
  chosen_korean: 왕이 되었을 때에
  alternatives_korean:
  - 즉위할 때에
  - 왕위에 올랐을 때에
  lexicon: HALOT
  rationale: 즉위 시점을 나타내는 관용 표현으로, 연대기적 서술의 기능을 살렸습니다.
- source_word: לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה
  english_pob_choice: He did not do what was right in the eyes of Yahweh
  chosen_korean: 야훼의 눈에 바른 일을 하지 않았는데
  alternatives_korean:
  - 야훼 보시기에 옳은 일을 하지 않았는데
  - 야훼 앞에서 옳은 일을 하지 않았는데
  lexicon: HALOT
  rationale: ‘눈에’라는 평가 관용구를 살리면서, אַ֫שָׁר/יָשָׁר의 도덕 평가를 ‘바른 일’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨 하나님의 고유 이름을 보존했습니다.
- source_word: כְּ/דָוִ֥יד אָבִֽי/ו
  english_pob_choice: as David his father had done
  chosen_korean: 그의 조상 다윗이 한 것과 같지 않았습니다
  alternatives_korean:
  - 그의 아버지 다윗이 한 것과 같지 않았습니다
  - 다윗 그의 아버지가 한 것과 같지 않았습니다
  lexicon: HALOT
  rationale: 영어 POB 주석처럼 여기서 ‘아버지’는 직계 부친이 아니라 왕조적 조상 다윗을 가리키므로, 오해를 피하도록 ‘조상 다윗’으로 풀었습니다.
theological_decisions:
- issue: 예정된 평가 어구의 신학적·서술적 톤
  chosen_reading: ‘야훼의 눈에 바른 일을 하지 않았습니다’로, 신적 평가의 공적 기준을 분명히 드러냈습니다.
  alternative_readings:
  - ‘야훼 앞에 바른 일을 하지 않았습니다’
  - ‘야훼께서 보시기에 옳은 일을 하지 않았습니다’
  rationale: 역대기의 왕 평가 공식은 단순한 윤리 진술이 아니라 하나님의 기준 아래 있는 왕권 평가이므로, ‘눈에’의 직역 감각을 유지했습니다.
  doctrine_reference: 역대기 왕 평가 공식에 대한 서술 신학
