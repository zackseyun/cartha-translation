  source_fidelity: 본문의 ‘제사를 드리고 향을 피웠습니다’는 וַיְזַבֵּחַ וַיְקַטֵּר를 충실하고 자연스럽게 반영합니다. 그러나 בָּמוֹת는 제의 장소를 가리키는 복수 기술어이므로 ‘높은 산당’보다는 ‘산당들’이 더 정확하며, ‘높은’은 산당이라는 말에 이미 담긴 전통적 의미를 불필요하게 지형적으로 제한할 수 있습니다.
  naturalness: ‘산당들과 언덕들에서, 또 모든 푸른 나무 아래에서’는 현대 표준어 합쇼체 문맥에서 자연스럽고, 각 장소에서 행위가 이루어졌다는 뜻을 명료하게 전달합니다.
  terminology: ‘산당’, ‘제사를 드리다’, ‘향을 피우다’는 적절한 성서·제의 용어입니다. ‘푸른 나무’도 히브리어의 관용적 이미지를 보존합니다.
  issues:
