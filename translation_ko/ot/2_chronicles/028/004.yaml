    issue: 본문의 ‘높은 산당’
    rationale: בַּבָּמוֹת는 단순히 높은 지형에 있는 산당이라는 뜻보다 ‘산당들’이라는 제의 장소의 기술어입니다. ‘높은’을 덧붙이면 의미가 불필요하게 지형적으로 좁아질 수 있고, 히브리어 복수도 드러나지 않습니다.
  - severity: high
