    rationale: 대안 각주는 원문의 세 장소(산당들, 언덕들, 모든 푸른 나무 아래)를 모두 반영해야 합니다. 현 각주의 ‘곧’은 원문의 등위 접속을 동격 설명으로 바꾸며, ‘언덕들’을 빠뜨립니다.
