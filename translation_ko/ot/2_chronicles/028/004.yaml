  lexicon: HALOT
  rationale: 이 문맥은 우상 숭배의 제의 행위를 가리키므로, 한국어에서는 관용적인 ‘향을 피우다’가 가장 직접적이고 읽기 자연스럽습니다.
- source_word: בַּבָּמוֹת
  english_pob_choice: on the high places
  chosen_korean: 높은 산당
  alternatives_korean:
  - 산당들
  - 높은 곳
  lexicon: HALOT
  rationale: בָּמוֹת는 단순한 지형이 아니라 이스라엘의 비공인 제의 장소를 가리키는 기술어이므로, 전통적이면서도 의미를 보존하는 ‘산당’으로 옮겼습니다.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  english_pob_choice: and under every green tree
  chosen_korean: 모든 푸른 나무 아래
  alternatives_korean:
  - 모든 잎이 무성한 나무 아래
  - 모든 푸르고 번성한 나무 아래
  lexicon: HALOT
  rationale: 직역적 이미지를 살려 stock expression의 상징성을 보존했습니다. ‘푸른 나무’는 본문의 우상숭배 장소 관용구를 한국어로도 유지합니다.
theological_decisions:
- issue: 우상숭배 제의 장소를 어떻게 드러낼 것인가
  chosen_reading: ‘산당’이라는 기술어를 유지해, 단순한 지리 묘사가 아니라 금지된 예배 행위임을 분명히 했습니다.
  alternative_readings:
  - ‘높은 곳’으로 일반화하기
  - ‘이교 제단’으로 풀어 쓰기
  rationale: 본문은 이 표현을 반복되는 성경적 관용구로 사용하므로, 의미를 완화하지 않고 intertextual resonance를 보존하는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
