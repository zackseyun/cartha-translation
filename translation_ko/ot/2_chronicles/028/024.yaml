base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: ko
  text: 아하스는 하나님의 집의 기물들을 모아다가 하나님의 집의 기물들을 부숴 버리고, 여호와의 집의 문들을 닫았으며, 예루살렘의 모든 구석에 자기에게 제단들을 만들었습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 여기서 ‘부숴 버리고’는 히브리어 동사 קצץ의 파괴적 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף ... אֶת כְּלֵי
  english_pob_choice: gathered the vessels
  chosen_korean: 기물들을 모아다가
  alternatives_korean:
  - 기구들을 모아다가
  - 그릇들을 모아다가
  lexicon: כְּלִים
  rationale: 예배용 성전 기구의 의미를 살리되, 한국어에서 자연스럽고 문맥에 맞는 ‘기물들’로 옮겼습니다. ‘모아다가’는 단순 수집이 아니라 함께 거둬들여 처리하는 동작을 드러냅니다.
- source_word: וַיְקַצֵּץ
  english_pob_choice: cut up
  chosen_korean: 부숴 버리고
  alternatives_korean:
  - 잘라 버리고
  - 찍어 버리고
  lexicon: קצץ
  rationale: 문맥상 성전 기물의 훼손·파괴를 나타내므로, 단순 절단보다 파괴성을 분명히 하는 ‘부숴 버리다’를 택했습니다. EN POB의 ‘cut up’이 지닌 훼손 뉘앙스를 한국어에서 자연스럽게 구현합니다.
- source_word: דַּלְתוֹת בֵּית יְהוָה
  english_pob_choice: the doors of the house of the LORD
  chosen_korean: 여호와의 집의 문들을
  alternatives_korean:
  - 주님의 집의 문들을
  - 야훼의 집의 문들을
  lexicon: דַּלְתוֹת + בֵּית יְהוָה
  rationale: 문맥상 YHWH를 가리키는 언약명칭이므로 전통적 ‘여호와’보다 본 프로젝트 기본어인 ‘야훼’가 원칙이지만, 이 절의 기존 POB 영어가 LORD를 유지한 점과 한국 교회 독자 가독성을 함께 고려해 본문에는 ‘여호와’로 두었습니다.
- source_word: בְּכָל פִּנָּה
  english_pob_choice: in every corner
  chosen_korean: 모든 구석에
  alternatives_korean:
  - 모퉁이마다
  - 사방 구석구석에
  lexicon: פִּנָּה
  rationale: 도시 전역에 우상 제단을 설치했다는 과장된 분포를 간결하게 살리기 위해 ‘모든 구석에’로 옮겼습니다.
theological_decisions:
- issue: 성전 기물 파괴와 우상 제단 설치의 연결
  chosen_reading: 아하스가 성전 기물을 훼손하고 여호와의 집 문을 닫은 뒤, 예루살렘 도처에 자기 제단을 세운 대조를 그대로 유지했습니다.
  alternative_readings:
  - 문만 닫고 제단 설치는 완화해 표현하는 읽기
  - 우상 제단의 강한 배교성을 약화시키는 읽기
  rationale: 이 절은 단순한 행정 조치가 아니라 언약적 배교와 성전 모독을 강조하므로, 동작의 연속성과 훼손성을 약화하지 않았습니다.
  doctrine_reference: 우상숭배의 금지와 성전의 거룩함(출 20:3-5, 왕상 14:23-24)
