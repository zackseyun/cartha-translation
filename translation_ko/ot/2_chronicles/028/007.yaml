theological_decisions:
- issue: 왕실 직책 표현의 현대 한국어화
  chosen_reading: 본문의 왕실 관직들을 직역하되, 독자가 곧바로 이해할 수 있도록 ‘궁의 감독’, ‘왕 다음 가는’처럼 기능 중심으로 풀어 썼습니다.
  alternative_readings:
  - 전통 교회어인 ‘궁내대신’류 표현
  - 더 문자적인 ‘집의 감독’
  rationale: 이 구절은 신학적 난점보다 역사 서술의 직책 묘사가 핵심이므로, 원문의 관직 관계를 흐리지 않는 범위에서 자연스러운 현대어를 택했습니다.
  doctrine_reference: 역사서의 서술 정확성 및 관직 표현의 의미 보존
