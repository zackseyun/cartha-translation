  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
  footnotes:
  - marker: a
    text: Or 'a warrior of Ephraim' or 'an Ephraimite hero.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the overseer of the house,' likely referring to the royal palace or household.
    reason: lexical_alternative
  - marker: c
    text: Or 'the king’s second-in-command.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 에브라임의 용사 시그리가 왕의 아들 마아세야와 궁정의 감독 아스리감, 그리고 왕 다음 가는 사람 엘가나를 죽였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에브라임의 전사’ 또는 ‘에브라임의 영웅’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 ‘집의 감독’이며, 왕궁 또는 왕실을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘왕의 제2인자’.
    reason: lexical_alternative
