  alternative_readings:
  - 전통 교회어인 ‘궁내대신’류 표현
  - 더 문자적인 ‘집의 감독’
  rationale: 이 구절은 신학적 난점보다 역사 서술의 직책 묘사가 핵심이므로, 원문의 관직 관계를 흐리지 않는 범위에서 자연스러운 현대어를 택했습니다.
