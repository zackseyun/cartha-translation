source:
  edition: WLC
  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
  footnotes:
  - marker: a
    text: Or 'divided' / 'apportioned'; here the sense is that Ahaz stripped valuables from these places and persons.
    reason: lexical_alternative
  - marker: b
    text: Or 'the officials.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the house of the LORD, and the house of the king and the princes'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 아하스가 야훼의 집과 왕궁과 고관들의 집을 약탈하여 앗시리아 왕에게 주었으나, 그것이 그에게 도움이 되지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘약탈하여’는 여기서 ‘나누다/분배하다’의 중립적 뜻이 아니라, 재물을 빼앗아 옮긴다는 의미를 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - …이기 때문입니다
  lexicon: BDB
  rationale: 앞 절의 이유를 설명하는 연결사로서, 서술 문맥에 맞는 현대 한국어 인과 표현으로 옮겼습니다.
- source_word: חָלַק
  english_pob_choice: plundered
  chosen_korean: 약탈하여
  alternatives_korean:
  - 빼앗아
  - 분배하여
  - 나누어
  lexicon: HALOT
  rationale: 문맥상 중립적 ‘나누다/나누어 주다’가 아니라, 성전과 왕궁에서 재물을 걷어 앗시리아에 바친 행위를 드러내는 ‘약탈하다’가 원문의 피해·침탈 뉘앙스를 가장 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 하나님의 고유명사를 음역하여, 일반 호칭인 ‘주님’으로 완화하지 않았습니다.
- source_word: הַשָּׂרִים
  english_pob_choice: the princes / the officials
  chosen_korean: 고관들
  alternatives_korean:
  - 관리들
  - 방백들
  - 제후들
  lexicon: BDB
  rationale: 궁정 맥락의 고위 인물을 가리키므로, 현대 한국어에서 위계를 살리면서도 과도하게 귀족적이지 않은 ‘고관들’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 집을 약탈한 뒤 앗시리아 왕에게 바친 행위의 평가
  chosen_reading: 본문은 아하스의 외교적 조공이 구원을 가져오지 못했음을 서술적으로 판정합니다.
  alternative_readings:
  - 단순한 군사·재정 조치로 중립적으로 읽기
  - ‘도움이 되지 않았다’를 완곡하게 처리하기
  rationale: 히브리어 말미의 ‘그에게 도움이 되지 않았다’는 결과 진술이므로, 아하스의 조치가 실제 구원으로 이어지지 않았다는 본문의 평가를 그대로 드러냈습니다.
  doctrine_reference: 본문 서술의 결과 진술; 열왕기/역대기 역사신학 맥락
