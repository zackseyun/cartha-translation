  - severity: low
    issue: ‘약탈하여’는 חָלַק의 기본 의미인 ‘나누다, 떼어 내다, 할당하다’보다 다소 강한 폭력적 뉘앙스를 낼 수 있습니다.
    rationale: 문맥상 재물을 취하여 앗시리아 왕에게 준 행위이지만, 동사 자체의 의미 범위와 열왕기하의 관련 서술을 고려하면 ‘재물을 떼어 내어’가 의미를 과도하게 강화하지 않으면서 문맥을 자연스럽게 전달합니다.
