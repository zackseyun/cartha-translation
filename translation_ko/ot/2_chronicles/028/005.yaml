  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
  footnotes:
  - marker: a
    text: Or 'the king of Syria'; Hebrew 'Aram.'
    reason: lexical_alternative
  - marker: b
    text: Or 'took many captives from him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'inflicted a great defeat on him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 그를 아람 왕의 손에 넘기셨고, 그들이 그를 쳐서 많은 포로를 사로잡아 다메섹으로 끌고 갔습니다. 그가 또한 이스라엘 왕의 손에 넘겨졌는데, 그가 그에게 큰 타격을 입혔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아람’은 영어 POB의 각주처럼 ‘시리아’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘많은 포로를 사로잡아’는 직역적으로는 ‘그에게서 많은 포로를 빼앗아’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘큰 타격’은 군사적 맥락에서 ‘큰 패배를 입혔다’는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC 표기 관례 / POB 용어집
  rationale: 히브리어 고유명사 יְהוָה를 제목어 ‘주님’으로 바꾸지 않고, 프로젝트 기본값에 따라 음역 ‘야훼’로 옮겨 신적 이름 자체를 드러냈습니다.
- source_word: בְּיַד מֶלֶךְ אֲרָם
  english_pob_choice: into the hand of the king of Aram
  chosen_korean: 아람 왕의 손에 넘기셨고
  alternatives_korean:
  - 아람 왕에게 넘기셨고
  - 아람 왕의 권세 아래 두셨고
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용을 살리되, 한국어에서는 ‘넘기다’로 자연스럽게 풀어 하나님의 주권적 인도를 보이게 했습니다.
- source_word: שִׁבְיָה גְדוֹלָה
  english_pob_choice: a great number of captives
  chosen_korean: 많은 포로를 사로잡아
  alternatives_korean:
  - 큰 포로의 무리를
  - 많은 포로들을
  lexicon: HALOT
  rationale: שִׁבְיָה는 추상적 ‘포로 상태’보다 실제로 끌려간 사람들을 가리키는 문맥이므로, 결과를 분명히 하는 ‘많은 포로’를 택했습니다.
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  english_pob_choice: who struck him with a great blow
  chosen_korean: 그에게 큰 타격을 입혔습니다
  alternatives_korean:
  - 그를 큰 타격으로 쳤습니다
  - 그에게 큰 상처를 입혔습니다
  lexicon: HALOT
  rationale: 직역의 ‘큰 치다’는 한국어에서 어색하므로, 전투 맥락을 유지하면서도 관용적으로 이해되는 ‘큰 타격’을 선택했습니다.
theological_decisions:
- issue: 전쟁 패배의 원인 서술에서 하나님의 주도성
  chosen_reading: 본문의 두 번의 수동/타동 ‘주다’ 표현을 살려, 전쟁 결과가 단순한 군사 사건이 아니라 야훼의 심판 아래 일어난 일로 읽히게 했습니다.
  alternative_readings:
  - 순수한 역사적 패배로만 중립화하는 번역
  - 사람이 주어를 보강해 하나님의 행위를 약화하는 번역
  rationale: 히브리어는 야훼가 그를 ‘주셨다’와 ‘그가 넘겨졌다’를 반복하여 원인을 신학적으로 제시합니다. 번역도 이 인과를 흐리지 않도록 유지했습니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
- issue: 아람(Aram)과 이스라엘 왕에 대한 표기
  chosen_reading: ‘아람’과 ‘이스라엘 왕’을 그대로 두어, 후대 지명인 ‘시리아’로 바꾸지 않았습니다.
  alternative_readings:
  - 시리아 왕
  - 아람/시리아 혼용
  rationale: 본문의 역사적·언어적 표지는 히브리어 고유명사 ‘아람’입니다. 후대의 지명으로 바꾸면 원문이 지닌 시대감이 약해집니다.
  doctrine_reference: 'Contested terms: אֲרָם'
