  yaml_path: translation/ot/2_chronicles/028/017.yaml
  text: The Edomites had also come and attacked Judah and carried away captives[a].
  footnotes:
  - marker: a
    text: Or 'came and struck Judah and took captives.' The Hebrew uses the common military verb 'strike' and a cognate expression for taking captivity.
    reason: lexical_alternative
translation:
  language: ko
  text: 에돔 사람들이 또 와서 유다를 쳤으며, 포로들을 사로잡아 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “와서 유다를 치고 포로들을 사로잡아 갔다.” 히브리어는 군사 문맥의 ‘치다’라는 동사와 ‘포로로 잡아감’을 뜻하는 동족어 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  english_pob_choice: had also
  chosen_korean: 또한
  alternatives_korean:
  - 또
  - 그리고 또
  - 게다가
  lexicon: HALOT
  rationale: 추가된 침공을 나타내는 עוד의 누적 의미를 살려, 서술 흐름 속에서 자연스럽게 ‘또한’으로 옮겼습니다.
- source_word: אֲדוֹמִים
  english_pob_choice: the Edomites
  chosen_korean: 에돔 사람들
  alternatives_korean:
  - 에돔 족속
