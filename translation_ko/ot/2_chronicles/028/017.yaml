  rationale: 지명 자체보다 에돔의 민족 집단을 가리키므로, 현대 한국어 독자에게 분명한 ‘에돔 사람들’로 옮겼습니다.
- source_word: וַיַּכּוּ בִיהוּדָה
  english_pob_choice: attacked Judah
  chosen_korean: 유다를 쳤으며
  alternatives_korean:
  - 유다를 공격했으며
  - 유다를 때렸으며
  - 유다를 쳐서
  lexicon: HALOT
  rationale: נכה의 기본 뜻인 ‘치다’를 살리면서 군사적 맥락을 유지해, 영어 POB의 해석을 따르되 본문 표현을 더 직접적으로 반영했습니다.
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  english_pob_choice: carried away captives
  chosen_korean: 포로를 사로잡아 갔습니다
  alternatives_korean:
  - 포로를 끌고 갔습니다
  - 사로잡아 포로로 삼았습니다
  - 포로를 잡아갔습니다
  lexicon: HALOT
  rationale: שבה와 명사 שֶׁבִי의 포로화 표현을 살려, 중복을 피하면서도 ‘사로잡다/가져가다’의 강한 군사적 의미를 보존했습니다.
