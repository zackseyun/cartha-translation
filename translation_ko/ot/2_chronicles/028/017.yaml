  text: 에돔 사람들이 또한 와서 유다를 쳤으며 포로를 사로잡아 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 군사적 동사 ‘치다’와 포로 사로잡기를 뜻하는 연관 표현을 사용합니다.
