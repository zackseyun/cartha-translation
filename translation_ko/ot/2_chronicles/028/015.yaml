base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
  footnotes:
  - marker: a
    text: Or 'their kin' or 'their fellow Israelites' for 'their brothers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이름으로 지명된 사람들이 일어나 포로들을 맡아 돌보았고, 그들 가운데 벌거벗은 사람 모두에게 노획물에서 가져온 옷을 입혀 주었습니다. 그들에게 옷을 입혀 주고, 신발을 신겨 주고, 먹을 것과 마실 것을 주고, 기름을 발라 주었으며, 그들 가운데 기운이 빠진 사람은 모두 나귀에 태워 이끌고 갔습니다. 그들은 그들을 그들의 형제들[a]에게로, 곧 종려나무 성읍 여리고로 데려갔고, 그 후 사마리아로 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 히브리어 남성 복수형 표현입니다. 문맥상 남유다의 동족이나 친족을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  english_pob_choice: had been designated by name
  chosen_korean: 그 이름으로 지목된
  alternatives_korean:
  - 이름으로 지정된
  - 이름으로 불린
  lexicon: HALOT
  rationale: נקר/נקב 계열의 ‘이름으로 지목되다’는 특정 인물들을 공식적으로 지정해 세웠다는 뜻을 살리기에 가장 적절합니다.
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  english_pob_choice: took charge of the captives
  chosen_korean: 포로들을 맡아 돌보았고
  alternatives_korean:
  - 포로들을 붙들었고
  - 포로들을 책임졌고
  lexicon: HALOT
  rationale: 이 동사는 여기서 적대적 ‘붙잡음’이 아니라 보호와 돌봄의 책임을 맡는 뜻이므로, ‘맡아 돌보다’로 옮겨 자비의 맥락을 드러냈습니다.
- source_word: וַיְנַהֲל֤וּם בַּחֲמֹרִים
  english_pob_choice: led all the feeble among them on donkeys
  chosen_korean: 그들 가운데 기운이 빠진 사람은 모두 나귀에 태워 이끌고 갔습니다
  alternatives_korean:
  - 그들 가운데 허약한 사람은 모두 나귀를 타게 했습니다
  - 그들 가운데 힘없는 사람은 모두 나귀로 데려갔습니다
  lexicon: HALOT
  rationale: נהל은 부드럽게 이끌다의 뜻이 있어, ‘나귀에 태워 이끌고 갔다’로 옮기면 연약한 자들을 배려한 운송의 이미지를 살릴 수 있습니다.
- source_word: אֲחֵיהֶם
  english_pob_choice: their brothers
  chosen_korean: 그들의 형제들에게
  alternatives_korean:
  - 그들의 친족들에게
  - 그들의 동족에게
  lexicon: HALOT
  rationale: 히브리어의 직접적 표현을 따라 ‘형제들’로 유지하되, 문맥상 남유다의 동족을 가리키는 넓은 친족 의미를 훼손하지 않도록 했습니다.
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  english_pob_choice: Jericho, the city of palm trees
  chosen_korean: 종려나무 성읍인 여리고
  alternatives_korean:
  - 종려수들의 성읍 여리고
  - 종려나무들의 성읍 여리고
  lexicon: HALOT
  rationale: 관용구를 한국어에서 자연스럽게 풀어 ‘종려나무 성읍’으로 옮겼습니다. 지명 여리고의 고유 별칭을 보존했습니다.
theological_decisions:
- issue: 아군이 된 포로들에게 제공된 연속 동작의 뉘앙스
  chosen_reading: 옷 입히기, 신기, 먹이기, 마시게 하기, 기름 바르기, 태워 옮기기가 한 줄의 자비 행위로 이어집니다.
  alternative_readings:
  - 단순한 물질 지원의 나열로 볼 수 있습니다
  - 의례적 정결 행위로 볼 수 있습니다
  rationale: 문맥상 이것은 전리품을 이용한 구호와 회복의 서술이며, 제의보다 구제의 성격이 강합니다. 따라서 동작들의 연속성을 살려 자비의 실천으로 읽었습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2 (Source-directed meaning)
