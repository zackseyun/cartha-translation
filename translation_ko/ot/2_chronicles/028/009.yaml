  text: וְ֠/שָׁם הָיָ֨ה נָבִ֥יא לַֽ/יהוָה֮ עֹדֵ֣ד שְׁמ/וֹ֒ וַ/יֵּצֵ֗א לִ/פְנֵ֤י הַ/צָּבָא֙ הַ/בָּ֣א לְ/שֹׁמְר֔וֹן וַ/יֹּ֣אמֶר לָ/הֶ֗ם הִ֠נֵּה בַּ/חֲמַ֨ת יְהוָ֧ה אֱלֹהֵֽי אֲבוֹתֵי/כֶ֛ם עַל יְהוּדָ֖ה נְתָנָ֣/ם בְּ/יֶדְ/כֶ֑ם וַ/תַּֽהַרְגוּ בָ֣/ם בְ/זַ֔עַף עַ֥ד לַ/שָּׁמַ֖יִם הִגִּֽיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: Now there was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: ko
  text: 그곳에 야훼의 선지자 오벳이 있었는데, 그가 사마리아로 오는 군대 앞에 나가 그들에게 말했습니다. “보십시오, 너희 조상들의 하나님 야훼께서 유다에게 진노하셔서 그들을 너희 손에 넘기셨습니다. 그런데 너희는 그들을 하늘에까지 닿는 분노로 죽였습니다.”
  philosophy: formal
lexical_decisions:
- source_word: נָבִיא לַיהוָה
  english_pob_choice: a prophet of the LORD
  chosen_korean: 야훼의 선지자
  alternatives_korean:
  - 야훼의 예언자
  - 주님의 선지자
  lexicon: נָבִיא
  rationale: 본문의 직함은 단순한 종교 지도자 일반이 아니라 야훼에게 속한 예언자라는 소속 관계를 드러내므로, POB의 LORD를 따라 야훼를 쓰고 선지자를 기본어로 옮겼습니다.
- source_word: וַיֵּצֵא לִפְנֵי הַצָּבָא
  english_pob_choice: he went out before the army
  chosen_korean: 그가 … 군대 앞에 나가
  alternatives_korean:
  - 그가 … 군대 앞에서 나가
  - 그가 … 군대 앞에 나타나
  lexicon: יצא + לפני
  rationale: 전치사 לפני는 단순한 ‘앞에서’보다 공개적으로 맞서는 위치를 나타내므로 ‘앞에 나가’로 자연스럽게 살렸습니다.
- source_word: וַתַּהַרְגוּ בָם בְזַעַף
  english_pob_choice: you have killed them in a rage
  chosen_korean: 너희는 그들을 … 분노로 죽였습니다
  alternatives_korean:
  - 너희는 그들을 … 격분하여 죽였습니다
  - 너희는 그들을 … 격노 속에서 죽였습니다
  lexicon: זַעַף
  rationale: זַעַף는 감정의 폭발을 뜻하므로 ‘분노’로 옮기되, 행위의 방식이 폭력적으로 드러나도록 문장 구조를 유지했습니다.
- source_word: עַד לַשָּׁמַיִם הִגִּיעַ
  english_pob_choice: that has reached up to heaven
  chosen_korean: 하늘에까지 닿는
  alternatives_korean:
  - 하늘에까지 미치는
  - 하늘에 이르는
  lexicon: עַד + שָׁמַיִם
  rationale: 과장법적 표현을 약화하지 않기 위해 ‘하늘에까지 닿는’으로 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: 야훼 진노의 원인과 유다에 대한 넘겨주심, 그리고 이스라엘 군대의 과잉 폭력
  chosen_reading: 야훼의 진노가 유다에게 임해 그들을 넘기셨지만, 군대는 그 상황을 넘어 분노로 죽였습니다.
  alternative_readings:
  - 야훼께서 유다를 진노 가운데 넘기셨고, 군대는 단지 전쟁 행위를 했습니다.
  - 유다에 대한 심판만 강조하고 이스라엘 군대의 책임은 약화하는 읽기
  rationale: 본문은 신적 심판과 인간의 과잉 폭력을 동시에 말하므로, 둘 중 하나를 약화하지 않도록 ‘그들을 너희 손에 넘기셨습니다. 그런데 … 죽였습니다’의 대조를 보존했습니다.
  doctrine_reference: 신적 섭리와 인간 책임의 동시 진술
