base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
  footnotes:
  - marker: a
    text: Or 'from the chiefs of the Ephraimites.' The Hebrew reads literally 'from the heads of the sons of Ephraim.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 에브라임의 자손의 우두머리들 가운데 몇 사람이 일어나 전장에서 오는 이들에 맞섰습니다. 아사랴[주] 요하난의 아들, 베레기야 메실레못의 아들, 히스기야 살룸의 아들, 아마사 핫달래의 아들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘에브라임의 자손의 우두머리들 가운데’입니다. POB 영어 본문처럼 ‘에브라임 사람들의 우두머리들 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ אֲנָשִׁים
  english_pob_choice: Then some men ... stood up
  chosen_korean: 그러자 ... 몇 사람이 일어났습니다
  alternatives_korean:
  - 몇 사람이 일어섰습니다
  - 어떤 사람들이 일어났습니다
  lexicon: HALOT
  rationale: 서사 진행의 개시를 보여 주는 wayyiqtol과 불특정 복수를 자연스럽게 살려, ‘몇 사람이’로 일부 지도자들의 등장과 ‘일어났습니다’로 결연한 행동을 표현했습니다.
- source_word: מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  english_pob_choice: from the heads of the sons of Ephraim
  chosen_korean: 에브라임의 자손의 우두머리들 가운데
  alternatives_korean:
  - 에브라임 자손의 우두머리들 가운데
  - 에브라임 사람들의 지도자들 가운데
  lexicon: HALOT
  rationale: 히브리어의 ‘머리들/우두머리들’ 표현을 비교적 직역적으로 유지해, 단순한 일반인보다 공인된 지도층이라는 점을 드러냈습니다.
- source_word: עַל הַבָּאִים מִן הַצָּבָא
  english_pob_choice: against those coming from the army
  chosen_korean: 전장에서 오는 이들에 맞섰습니다
  alternatives_korean:
  - 군대에서 오는 이들에 맞섰습니다
  - 군에서 돌아오는 이들에 맞섰습니다
  lexicon: HALOT
  rationale: עַל과 קום의 대립·맞섬의 뉘앙스를 ‘맞섰습니다’로 살렸고, מִן הַצָּבָא를 이 문맥에서 ‘전장’으로 풀어 전투 후 귀환 상황을 한국어로 분명하게 전달했습니다.
- source_word: אֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... וִיחִזְקִיָּהוּ ... עֲמָשָׂא
  english_pob_choice: Azariah ... Berechiah ... Hezekiah ... Amasa
  chosen_korean: 아사랴, 베레기야, 히스기야, 아마사
  alternatives_korean:
  - 아사랴야후, 베레기야후, 히스기야후, 아마사
  lexicon: standard transliteration conventions
  rationale: 고유명사는 통용 표기 관행에 따라 음역했고, 본문 이해에 필요하지 않은 장음·신명 요소는 한국어 표기에서 자연스럽게 정리했습니다.
theological_decisions:
- issue: 공동체 지도자들의 행동을 설명하는 동사 선택
  chosen_reading: ‘일어났습니다’와 ‘맞섰습니다’로 지도자들의 결단과 공개적 반대를 분명히 드러냈습니다.
  alternative_readings:
  - ‘나섰습니다’로 더 완화할 수 있음
  - ‘대항했습니다’로 더 직접적일 수 있음
  rationale: 본문은 단순한 기상 동작이 아니라 군대에서 돌아오는 이들에 대한 공적 반대 행동을 말하므로, 서사적 힘을 유지하는 방향을 택했습니다.
  doctrine_reference: 문맥상 역사 서술
- issue: ‘전장’의 해석 범위
  chosen_reading: ‘전장’은 צָבָא를 단순히 ‘군대’로만 번역할 때보다 귀환 군사 집단의 실제 상황을 더 분명히 보여 주는 문맥적 번역으로 사용했습니다.
  alternative_readings:
  - ‘군대’로 직역
  - ‘군사 원정’으로 설명
  rationale: 본문의 초점은 조직된 병력 자체보다 전투를 마치고 돌아오는 사람들에 대한 대응이므로, 한국어 독자가 상황을 즉시 이해하도록 문맥을 반영했습니다.
  doctrine_reference: 문맥상 역사 서술
