revisions:
- from: 그러자 에브라임의 자손의 우두머리들 가운데 몇 사람이 일어나 전장에서 오는 이들에 맞섰습니다. 아사랴[주] 요하난의 아들, 베레기야 메실레못의 아들, 히스기야 살룸의 아들, 아마사 핫달래의 아들입니다.[a]
  to: 그러자 에브라임 자손의 우두머리들 가운데 몇 사람이 군대에서 오는 이들에게 맞서 일어났습니다. 그들은 여호하난의 아들 아사랴, 므실레못의 아들 베레갸, 살룸의 아들 히스기야, 하들래의 아들 아마사였습니다.[a]
  rationale: The revision removes the unanchored marker, restores the proper patronymic relationships, uses natural modern Korean construct phrasing, and translates ‘from the army’ without importing the narrower idea of a battlefield. The opposition nuance of קום עַל is retained in ‘맞서 일어났습니다.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:19:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that certain Ephraimite leaders opposed people coming from the military force. However, ‘전장’ narrows מִן־הַצָּבָא (‘from the army/force’) to a battlefield, and the names are syntactically misordered in Korean relative to their patronymics.
  naturalness: The phrase ‘에브라임의 자손의 우두머리들’ is unnecessarily repetitive in Korean, the stray ‘[주]’ is a structural defect, and the name list (‘아사랴 요하난의 아들’) is unnatural. Recasting the list with Korean patronymic order improves clarity while retaining the source’s identification of the four men.
  terminology: ‘에브라임 자손의 우두머리들’ preserves the formal collective expression without awkward double possession. ‘군대에서 오는 이들’ retains the broader sense of צָבָא. Conventional Korean biblical forms are used for the personal names.
  issues:
  - severity: medium
    issue: ‘전장에서’ renders מִן הַצָּבָא too specifically.
    rationale: The Hebrew denotes those coming from the army/military force; it does not explicitly say ‘from the battlefield.’
  - severity: medium
    issue: The patronymic name list is incorrectly ordered and contains a stray anchor.
    rationale: The Hebrew means ‘Azariah son of Jehohanan,’ etc. Korean naturally expresses this as ‘여호하난의 아들 아사랴.’ The inserted ‘[주]’ has no corresponding footnote and disrupts the text.
  - severity: low
    issue: ‘에브라임의 자손의 우두머리들’ is awkward Korean.
    rationale: ‘에브라임 자손의 우두머리들’ conveys the same construct relationship naturally.
  revised_text: 그러자 에브라임 자손의 우두머리들 가운데 몇 사람이 군대에서 오는 이들에게 맞서 일어났습니다. 그들은 여호하난의 아들 아사랴, 므실레못의 아들 베레갸, 살룸의 아들 히스기야, 하들래의 아들 아마사였습니다.[a]
