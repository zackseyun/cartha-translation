  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּזְבַּ֗ח לֵֽ/אלֹהֵ֣י דַרְמֶשֶׂק֮ הַ/מַּכִּ֣ים בּ/וֹ֒ וַ/יֹּ֗אמֶר כִּ֠י אֱלֹהֵ֤י מַלְכֵֽי אֲרָם֙ הֵ֚ם מַעְזְרִ֣ים אוֹתָ֔/ם לָ/הֶ֥ם אֲזַבֵּ֖חַ וְ/יַעְזְר֑וּ/נִי וְ/הֵ֛ם הָֽיוּ ל֥/וֹ לְ/הַכְשִׁיל֖/וֹ וּ/לְ/כָל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
  footnotes:
  - marker: a
    text: Or 'that were defeating him.' The Hebrew participle may be rendered as ongoing or characteristic action.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the gods of the kings of Aram,' preserving the plural 'kings.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and they were for his ruin and for all Israel.' The Hebrew literally says 'they were to him for causing him to stumble, and to all Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자신을 친 다마스쿠스의 신들에게 제사하였고, 말하기를 “아람의 왕들의 신들이 그들을 돕는다고 하니, 나도 그들에게 제사하여 그들이 나를 도우게 하겠습니다.” 그러나 그 신들은 그에게, 그리고 온 이스라엘에게 넘어짐이 되었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사는 진행 중이거나 특징적인 행위를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아람의 왕들’이라고 복수로 말합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그에게 넘어지게 함이 되었다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאלֹהֵי דַרְמֶשֶׂק
  english_pob_choice: to the gods of Damascus
  chosen_korean: 다마스쿠스의 신들에게
  alternatives_korean:
  - 다마스쿠스의 신들께
  - 다마스쿠스의 신들에게
  lexicon: WLC + POB audit trail
  rationale: 히브리어 복수형 אֱלֹהֵי를 살려 ‘신들’로 옮겼고, 지명은 현대 한국어에서 통용되는 다마스쿠스보다 원음에 가까운 ‘다마스쿠스’로 처리했습니다.
- source_word: הַמַּכִּים בּוֹ
  english_pob_choice: that had struck him
  chosen_korean: 자신을 친
  alternatives_korean:
  - 그를 치고 있는
  - 그를 패배시킨
  lexicon: WLC + POB audit trail
  rationale: 분사구는 그 신들을 수식하는 속성으로 읽히므로, 과거 사건을 가리키는 ‘자신을 친’이 자연스럽고 원문의 관계를 보존합니다.
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  english_pob_choice: the gods of the kings of Aram
  chosen_korean: 아람의 왕들의 신들
  alternatives_korean:
  - 아람 왕들의 신들
  - 아람의 왕의 신들
  lexicon: WLC + POB audit trail
  rationale: 히브리어의 복수 ‘왕들’을 평탄화하지 않고 그대로 반영했습니다. 이 구절의 논리는 아하스의 왜곡된 판단을 드러내므로 복수형을 유지하는 것이 중요합니다.
- source_word: וַיֹּאמֶר כִּי ... וְיַעְזְרוּנִי
  english_pob_choice: and he said, “Because ... I will sacrifice to them, so that they may help me.”
  chosen_korean: 말하기를 “... 그들이 나를 도우게 하겠습니다.”
  alternatives_korean:
  - 말하기를 “... 그들이 나를 도울 것입니다.”
  - 말하기를 “... 그들이 나를 돕도록 하겠습니다.”
  lexicon: WLC + POB audit trail
  rationale: אָזַבֵּחַ의 의향과 목적절의 뉘앙스를 살려 ‘도우게 하겠습니다’로 옮겼습니다. 이는 단순 미래 진술보다 제의적 의도를 더 분명히 드러냅니다.
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ וּלְכָל יִשְׂרָאֵל
  english_pob_choice: But they became the downfall of him and of all Israel.
  chosen_korean: 그러나 그 신들은 그에게, 그리고 온 이스라엘에게 넘어짐이 되었습니다.
  alternatives_korean:
  - 그러나 그 신들은 그와 온 이스라엘의 몰락이 되었습니다.
  - 그러나 그 신들은 그에게 걸림돌이 되었고 온 이스라엘에게도 그러했습니다.
  lexicon: WLC + POB audit trail
  rationale: הכשיל의 핵심인 ‘넘어지게 하다/걸려 넘어지게 하다’를 살리되, 결과를 자연스럽게 보이기 위해 ‘넘어짐이 되었습니다’로 옮겼습니다. ‘온 이스라엘’은 공동체 전체를 가리키는 범위를 분명히 합니다.
theological_decisions:
- issue: 아하스의 발언을 서술하는 화자 관점과 실제 신학적 평가
  chosen_reading: 본문은 아하스의 이교적 해석을 그대로 보고하며, 그 신들이 실제로 도운다는 뜻이 아니라 오히려 넘어짐의 원인이 되었다는 반전을 드러냅니다.
  alternative_readings:
  - 서술자가 그 신들의 능력을 어느 정도 인정하는 것으로 읽을 수 있음
  - 아하스의 말을 덜 분명하게 처리하여 아이러니를 약화시킴
  rationale: 역대기의 문맥상 이 진술은 우상숭배에 대한 비판입니다. 그래서 아하스의 주장은 따옴표 안에서 그대로 살리되, 결말은 명시적으로 ‘넘어짐’으로 번역해 신학적 방향을 분명히 했습니다.
  doctrine_reference: 우상숭배 비판 / 본문 문맥의 반어
- issue: 목적절의 번역
  chosen_reading: ‘그들이 나를 도우게 하겠습니다’로 목적성을 유지했습니다.
  alternative_readings:
  - ‘그들이 나를 도울 것입니다’로 단순 미래화
  - ‘그들이 나를 돕도록 하겠습니다’로 보다 해설적 표현
  rationale: 히브리어의 의도 표현을 살리면서도 한국어에서 지나치게 설명적이지 않도록 조정했습니다.
  doctrine_reference: 문법-의미 보존
