  text: At that time King Ahaz sent to the kings of Assyria for help[a].
  footnotes:
  - marker: a
    text: 'Hebrew: ''the kings of Assyria''; some translations render ''the king of Assyria'' to harmonize with the historical situation.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때에 아하스 왕은 앗수르의 왕들에게 사람을 보내어 그를 돕게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘앗수르의 왕들’(복수형)로 되어 있으며, 일부 번역은 역사적 상황에 맞추어 ‘앗수르 왕’(단수형)으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시각에
  - 그 당시
  lexicon: HALOT
  rationale: 서사 흐름을 자연스럽게 이어 주는 표준 시간 부사로 옮겼습니다.
- source_word: הַמֶּלֶךְ אָחָז
  english_pob_choice: King Ahaz
  chosen_korean: 아하스 왕
  alternatives_korean:
  - 왕 아하스
  - 아하스 임금
  lexicon: HALOT
  rationale: 히브리어의 직함+인명 구조를 한국어에서 가장 자연스럽게 반영했습니다.
- source_word: שָׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보내어
  - 전령을 보내어
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘보내다’보다 실제 전달 행위를 드러내되, 본문에 없는 ‘전령’을 확정적으로 넣지는 않았습니다.
- source_word: מַלְכֵי אַשּׁוּר
  english_pob_choice: the kings of Assyria
  chosen_korean: 앗수르의 왕들
  alternatives_korean:
  - 앗수르 왕들
  - 앗수르의 왕
  lexicon: HALOT
  rationale: 원문의 복수형을 보존해 본문 가시성을 유지했습니다. 영어 POB의 본문 선택도 이 복수형을 따릅니다.
- source_word: לַעְזֹר לוֹ
  english_pob_choice: for help / to help him
  chosen_korean: 그를 돕게 하였습니다
  alternatives_korean:
  - 그를 돕도록 하였습니다
  - 도움을 청하였습니다
  lexicon: HALOT
  rationale: 목적의 לְ + 동사구를 한국어에서 자연스럽게 옮기되, ‘도움’을 추상명사로만 두지 않고 도움 행위의 목적을 분명히 했습니다.
theological_decisions:
- issue: ‘앗수르의 왕들’ 복수형을 본문에 유지할지, 역사적으로 익숙한 단수형으로 조정할지
  chosen_reading: 본문은 복수형을 유지하고, 단수형 조화는 주석적 선택으로 남깁니다.
  alternative_readings:
  - 앗수르의 왕
  - 앗수르 왕
  rationale: 이 절은 교리 문제가 아니라 원문 가시성의 문제입니다. 마소라 본문이 복수형을 읽으므로, 역사적 평탄화보다 원문 우선을 따랐습니다.
  doctrine_reference: Translation philosophy §1, §5
