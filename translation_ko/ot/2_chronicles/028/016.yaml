- from: 그때에 아하스 왕은 앗수르의 왕들에게 사람을 보내어 그를 돕게 하였습니다.[a]
  to: 그때에 아하스 왕은 앗수르의 왕들에게 도움을 청하는 사람을 보냈습니다.[a]
  rationale: '본문의 ‘앗수르의 왕들’은 유지했습니다. ‘도움을 청하는 사람을 보냈습니다’는 히브리어의 ‘보내다’와 도움을 얻으려는 목적을 함께 살리며, 현 번역의 부자연스러운 사역 의미를 제거합니다. ‘사람’은 한국어에서 ‘보내다’의 생략된 목적어를 최소한으로 보완한 것이며, 특정한 직책(예: 사신·전령)은 단정하지 않습니다.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:19:27Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 아하스가 앗수르의 왕들(복수)에게 보내어 자신을 돕게 하려 했음을 말합니다. 현 번역의 ‘사람을 보내어’는 원문에 명시되지 않은 목적어를 보충하며, 특히 ‘그를 돕게 하였습니다’는 아하스가 왕들이 돕도록 실제로 하게 했다는 사역·결과의 뉘앙스를 낳아, 도움을 요청한 목적을 정확히 나타내지 못합니다.
  naturalness: ‘그때에’와 ‘아하스 왕’은 자연스럽고 합쇼체 문체에도 맞습니다. 목적을 ‘도움을 청하는 사람을 보냈습니다’로 표현하면 한국어 문장으로도 자연스럽고, 요청의 목적과 ‘보냈다’의 행위를 함께 드러낼 수 있습니다.
  terminology: ‘앗수르’와 ‘아하스’는 적절합니다. ‘앗수르의 왕들’은 마소라 본문의 복수형을 충실히 보존합니다. 각주도 본문 복수형 및 역사적 조화에 따른 단수형 번역을 적절히 설명합니다.
  issues:
  - severity: medium
    issue: ‘그를 돕게 하였습니다’의 사역 표현
    rationale: לַעְזֹר לוֹ는 아하스가 도움을 받기 위한 목적을 나타냅니다. 현 표현은 아하스가 앗수르 왕들이 그를 돕도록 만들었다는 결과 또는 사역의 의미로 읽힐 수 있으므로, ‘도움을 청하는’으로 고쳐야 합니다.
  - severity: low
    issue: ‘사람을 보내어’의 불필요하게 구체적인 보충
    rationale: 히브리어 שָׁלַח에는 보내는 대상이 명시되지 않았습니다. 한국어에서는 전달자를 보낸 뜻을 자연스럽게 표현하기 위해 보충이 가능하지만, ‘사람’ 자체보다 그 역할을 목적절 안에서 최소한으로 드러내는 편이 낫습니다.
  revised_text: 그때에 아하스 왕은 앗수르의 왕들에게 도움을 청하는 사람을 보냈습니다.[a]
