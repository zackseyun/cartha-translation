id: 2CH.28.3
reference: 2 Chronicles 28:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/ה֥וּא הִקְטִ֖יר בְּ/גֵ֣יא בֶן הִנֹּ֑ם וַ/יַּבְעֵ֤ר אֶת בָּנָי/ו֙ בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
  footnotes:
  - marker: a
    text: Or, 'he made his sons pass through the fire.' The Hebrew here more directly says 'he burned his sons in the fire.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 또한 힌놈의 아들 골짜기에서 분향하고, 그의 아들들을 불로 태웠습니다[a]. 이는 야훼께서 이스라엘 자손 앞에서 쫓아내신 민족들의 가증한 일들을 따른 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아들들을 불 가운데로 지나가게 했다.’ 그러나 כאן 히브리어는 더 직접적으로 ‘그의 아들들을 불로 태웠다’고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִקְטִיר
  english_pob_choice: burned incense
  chosen_korean: 분향하고
  alternatives_korean:
  - 향을 피우고
  - 제물을 불살라 바치고
  lexicon: HALOT
  rationale: 여기서는 קטר의 제의적 ‘피워 올리다’ 의미를 살리되, 문맥상 가장 자연스럽고 간결한 한국어 표현인 ‘분향하다’를 썼습니다.
- source_word: בְּגֵיא בֶן־הִנֹּם
  english_pob_choice: in the Valley of Ben-hinnom
  chosen_korean: 힌놈의 아들 골짜기
  alternatives_korean:
  - 벤힌놈 골짜기
  - 게힌놈 골짜기
  lexicon: HALOT
  rationale: 지명은 음역보다는 히브리어 구조를 보여 주는 ‘힌놈의 아들 골짜기’가 원문 대응이 분명합니다.
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  english_pob_choice: he burned his sons in the fire
  chosen_korean: 그의 아들들을 불로 태웠습니다
  alternatives_korean:
  - 그의 아들들을 불 가운데로 지나가게 했습니다
  - 그의 자녀들을 불에 태웠습니다
  lexicon: HALOT
  rationale: 본문은 ‘불 가운데로 지나가게 하다’가 아니라 בער의 강한 표현을 쓰므로, 영어 POB의 강한 해석을 반영해 실제로 불태웠다는 뜻을 유지했습니다. ‘아들들’은 원문 복수형을 살린 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대신 신명기적 고유명사 ‘야훼’를 사용했습니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방 민족들
  lexicon: HALOT
  rationale: 여기서는 가나안 주민 집단을 가리키는 역사적 용법이므로, 신학적 색채가 덜한 ‘민족들’이 가장 무난합니다.
theological_decisions:
- issue: 인신제사/아동 희생을 완곡하게 약화할지 여부
  chosen_reading: 본문의 강한 진술을 따라 ‘그의 아들들을 불로 태웠습니다’로 옮겼습니다.
  alternative_readings:
  - 그의 아들들을 불 가운데로 지나가게 했습니다
  rationale: 히브리어는 단순한 통과 의례보다 더 직접적인 소각 표현을 사용하므로, 문장의 잔혹성을 희석하지 않고 원문의 충격을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
