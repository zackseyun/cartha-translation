base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
  footnotes:
  - marker: a
    text: Or “Soco.”
    reason: lexical_alternative
translation:
  language: ko
  text: 블레셋 사람들이 유다의 저지대와 네게브에 있는 도시들을 습격하여 벧세메스와 아얄론과 그데롯과 소고[a]와 그에 딸린 마을들, 딤나와 그에 딸린 마을들, 김소와 그에 딸린 마을들을 점령하고 그곳에 정착하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소고’는 ‘소코’로도 표기할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  english_pob_choice: And the Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
  - 그리고 블레셋 사람들
  - 필리스티아 사람들
  lexicon: HALOT
  rationale: 민족명으로서 ‘블레셋 사람들’이 표준적이고 자연스러우며, 서사 흐름의 접속은 한국어에서 생략해도 무리가 없습니다.
- source_word: פָּשְׁטוּ
  english_pob_choice: had raided
  chosen_korean: 약탈하여
  alternatives_korean:
  - 침략하여
  - 습격하여
  - 기습하여
  lexicon: HALOT
  rationale: 군사적 습격과 약탈의 함의를 함께 살려, 단순한 ‘침입’보다 결과를 분명히 드러내는 표현을 택했습니다.
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  english_pob_choice: the cities of the lowland and the Negeb of Judah
  chosen_korean: 유다의 저지대와 네게브의 여러 도시
  alternatives_korean:
  - 유다의 평지와 네게브의 도시들
  - 유다의 저지대와 남방의 도시들
  lexicon: HALOT
  rationale: הַשְּׁפֵלָה는 지리 용어로 ‘저지대’가 직역에 가깝고, הַנֶּגֶב은 고유한 지역명 ‘네게브’를 유지했습니다.
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  english_pob_choice: and its villages
  chosen_korean: 그 딸 마을들
  alternatives_korean:
  - 그 소속 마을들
  - 그 주변 마을들
  - 그 산하 마을들
  lexicon: HALOT
  rationale: 직역상 ‘그녀의 딸들’이지만, 한국어에서는 도시의 종속 취락을 가리키는 관용을 살려 ‘딸 마을들’로 옮겼습니다.
- source_word: וַיֵּשְׁבוּ שָׁם
  english_pob_choice: and they settled there
  chosen_korean: 거기에 살게 되었습니다
  alternatives_korean:
  - 거기에 정착했습니다
  - 거기서 살았습니다
  - 거기에 거주하게 되었습니다
  lexicon: HALOT
  rationale: 점령 후 주거 정착의 결과를 나타내므로, 단순 거주보다 ‘살게 되었습니다’가 서사적 종결감을 잘 전달합니다.
theological_decisions:
- issue: 정복 서술의 동사 뉘앙스
  chosen_reading: ‘약탈하여… 점령하고’로 옮겨 군사적 침탈과 점유를 모두 드러냈습니다.
  alternative_readings:
  - ‘침입하여… 차지하고’
  - ‘습격하여… 빼앗고’
  rationale: 본문은 단순 이동이 아니라 유다 영토에 대한 실제 침탈과 점령을 서술하므로, 그 폭력성과 결과를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 역사서의 서술 정확성; 지리·전쟁 서술의 직접성
