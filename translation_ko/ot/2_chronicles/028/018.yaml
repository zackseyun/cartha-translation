  source_fidelity: 수정이 필요합니다. 지명 두 곳이 원문과 맞지 않습니다. בֵּית שֶׁמֶשׁ은 ‘벧세메스’인데 초안은 ‘베델세메스’로 되어 있으며, גִּמְזוֹ는 ‘김소’인데 ‘깁스’로 잘못 옮겨졌습니다. 또한 בְּנוֹתֶיהָ는 주성읍에 딸린 종속 취락을 뜻하므로 ‘딸 마을들’보다 ‘그에 딸린 마을들’이 의미를 더 자연스럽고 정확하게 전달합니다.
  naturalness: 합쇼체 문체는 유지되어 있으나, ‘거기에 살게 되었습니다’는 정복자들이 그곳에 거주·정착했다는 완료된 서술을 다소 우회적으로 표현합니다. ‘그곳에 정착하였습니다’가 원문의 וַיֵּשְׁבוּ שָׁם에 더 자연스럽고 직접적으로 대응합니다. 각주 표지도 해당 지명인 ‘소고’ 바로 뒤에 두어야 합니다.
