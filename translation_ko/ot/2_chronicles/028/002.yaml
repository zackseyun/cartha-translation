  - 바알 우상들에게
  rationale: 본문의 복수형을 평탄화하지 않고 유지해, 여러 바알 숭배 형태를 시사하는 소스를 그대로 드러내려 했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 왕들의 길을 ‘걷다’는 관용구
  chosen_reading: 그는 이스라엘 왕들의 길로 걸어갔고
  alternative_readings:
  - 그는 이스라엘 왕들의 관행을 따랐고
  - 그는 이스라엘 왕들의 방식대로 행했고
  rationale: 도덕적 행위를 나타내는 히브리어 은유를 보존하면서도, 독자가 의미를 즉시 이해할 수 있도록 직역과 자연스러움의 균형을 맞췄습니다.
  doctrine_reference: Translation philosophy §1, §6
