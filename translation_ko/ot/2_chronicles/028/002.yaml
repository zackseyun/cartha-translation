  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
  footnotes:
  - marker: a
    text: Or 'molten images.' The Hebrew term refers specifically to images made by casting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for the Baals,' preserving the plural; this may refer to multiple local manifestations or representations associated with Baal worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이스라엘 왕들의 길을 걸었고, 바알들을 위한[b] 주조 형상들도[a] 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부어 만든 형상들’. 히브리어는 일반적인 우상보다 주조하여 만든 형상을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 복수형 ‘바알들’을 사용합니다. 이는 바알 숭배와 관련된 여러 지역적 형태나 표상을 가리킬 수 있습니다.
    reason: lexical_alternative
