  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
  footnotes:
  - marker: a
    text: Or 'molten images.' The Hebrew term refers specifically to images made by casting.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for the Baals,' preserving the plural; this may refer to multiple local manifestations or representations associated with Baal worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이스라엘 왕들의 길로 걸어갔고, 바알들에게 cast image도 만들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘cast images’는 일반적인 ‘우상’보다, 부어 만들어 낸 형상이라는 제작 방식을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 복수형 ‘바알들’을 사용해, 바알 숭배의 여러 지역적 표상이나 형태를 시사합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  english_pob_choice: He walked in the ways of
  chosen_korean: 걸어갔고
