  - 바알들에게 대한
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘바알들’을 보존하여 여러 지역적/제의적 바알 표상을 드러냈습니다.
theological_decisions:
- issue: ‘바알들’ 복수형 보존
  chosen_reading: 바알들에게
  alternative_readings:
