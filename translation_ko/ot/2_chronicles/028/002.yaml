  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘걷다’ 비유를 살리되, 현대 한국어에서 자연스러운 행위 서술로 옮겼습니다.
- source_word: מַסֵּכֹות
  english_pob_choice: cast images
  chosen_korean: cast image도
  alternatives_korean:
  - 부어 만든 우상도
  - 주조한 우상도
  - 조각상도
  lexicon: HALOT
  rationale: 히브리어는 일반적 우상보다 ‘부어/주조하여 만든 형상’을 가리키므로, 그 제조 방식을 드러내는 방향을 택했습니다. 다만 영어 표현이 주어진 상태를 그대로 반영한 초안이므로, 본문 최종화에서는 한국어 표현을 더 매끄럽게 다듬을 필요가 있습니다.
- source_word: לַבְּעָלִים
