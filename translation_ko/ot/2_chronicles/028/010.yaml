id: 2CH.28.10
reference: 2 Chronicles 28:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/עַתָּה בְּנֵֽי יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִ/כְבֹּ֛שׁ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת לָ/כֶ֑ם הֲ/לֹ֤א רַק אַתֶּם֙ עִמָּ/כֶ֣ם אֲשָׁמ֔וֹת לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female slaves for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
  footnotes:
  - marker: a
    text: Or, more literally, 'sons of Judah and Jerusalem.' The Hebrew uses a masculine plural expression for the people corporately.
    reason: lexical_alternative
  - marker: b
    text: Or 'to subdue as slaves and female slaves for yourselves.'
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew of the final question is compressed: literally, something like ''Are there not, indeed, with you guilt-offenses for the LORD your God?'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 유다와 예루살렘의 자손들아, 너희는 남자 종들과 여자 종들을 너희를 위해 굴복시키려고 한다고 말하고 있습니다. 그런데 너희에게도 야훼 너희 하나님 앞에 죄책이 있지 않습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로 ‘유다와 예루살렘의 아들들’입니다. 히브리어는 백성을 집합적으로 가리키는 남성 복수 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘남자 종들과 여자 종들로 너희를 위해 굴복시키려고 한다’.
    reason: lexical_alternative
  - marker: c
    text: 마지막 질문의 히브리어는 압축되어 있습니다. 문자적으로는 ‘너희에게, 사실, 야훼 너희 하나님께 대한 죄책들이 있지 않느냐’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלִַם
  english_pob_choice: the people of Judah and Jerusalem
  chosen_korean: 유다와 예루살렘의 자손들
  alternatives_korean:
  - 유다와 예루살렘의 사람들
  - 유다와 예루살렘의 백성들
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘유다와 예루살렘의 아들들’이지만, 여기서는 공동체 전체를 호명하는 표현이므로 ‘자손들’로 옮겨 집합적 호칭을 살렸습니다.
- source_word: לִכְבֹּשׁ
  english_pob_choice: are to be subdued
  chosen_korean: 굴복시키려고 한다
  alternatives_korean:
  - 정복하려고 한다
  - 복종시키려고 한다
  - 제압하려고 한다
  lexicon: HALOT
  rationale: כָּבַשׁ의 핵심은 강제로 굴복시킨다는 뜻이므로, 단순한 ‘정복’보다 대상의 의지와 처지를 드러내는 ‘굴복시키다’가 더 가깝습니다.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  english_pob_choice: as male and female slaves
  chosen_korean: 남자 종들과 여자 종들
  alternatives_korean:
  - 남자 노예들과 여자 노예들
  - 남종들과 여종들
  - 남자와 여자 노예들
  lexicon: HALOT
  rationale: 본문은 성별을 구분한 노예 상태를 말하므로 두 성을 모두 드러냈습니다. 한국어에서는 ‘종’이 본래적 예속성을 어느 정도 담으면서도 문맥상 자연스럽습니다.
- source_word: לָכֶם
  english_pob_choice: for yourselves
  chosen_korean: 너희를 위해
  alternatives_korean:
  - 너희에게
  - 너희 자신을 위해
  - 너희 소유로
  lexicon: HALOT
  rationale: 여기서는 전리품처럼 자기 이익을 위해 사람들을 취하려는 의도를 나타내므로, 소유화를 너무 노골적으로 덧붙이지 않으면서 ‘너희를 위해’로 옮겼습니다.
- source_word: עִמָּכֶם אֲשָׁמוֹת
  english_pob_choice: you yourselves also have guilt
  chosen_korean: 너희에게도 … 죄책이 있지 않습니까
  alternatives_korean:
  - 너희에게도 죄가 있지 않습니까
  - 너희도 죄책을 지니고 있지 않습니까
  - 너희에게도 허물이 있지 않습니까
  lexicon: HALOT
  rationale: אֲשָׁמוֹת는 단순한 감정적 죄책감이 아니라 실제 책임 있는 ‘죄책/허물’의 복수 개념이어서, 반문 형식으로 ‘죄책’을 살렸습니다.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  english_pob_choice: before Yahweh your God
  chosen_korean: 야훼 너희 하나님 앞에
  alternatives_korean:
  - 야훼 너희 하나님께
  - 야훼 너희 하나님 앞에서
  - 여호와 너희 하나님 앞에
  lexicon: HALOT
  rationale: 고유명사 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, ל는 책임과 대면의 뉘앙스를 살려 ‘앞에’로 표현했습니다.
theological_decisions:
- issue: 가축처럼 인간을 전리품화하는 전쟁 승리 언어의 강도
  chosen_reading: ‘남자 종들과 여자 종들을 너희를 위해 굴복시키려고 한다’로, 폭력적 예속의 의미를 완화하지 않고 드러냈습니다.
  alternative_readings:
  - ‘노예로 삼으려고 한다’
  - ‘종들로 만들려고 한다’
  rationale: 문맥상 전쟁 포로를 인간 소유물처럼 다루려는 행위를 선지자가 책망하는 것이므로, 한국어에서도 그 잔혹성을 흐리지 않는 방향이 필요합니다.
  doctrine_reference: 번역 원칙 §1; 예속 표현은 문맥의 사회적·윤리적 무게를 우선 반영
