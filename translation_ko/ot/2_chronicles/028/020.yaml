  rationale: 적대적 문맥의 בוא על을 ‘그를 치러 와서’로 반영하되, 각주에서 문자적 대안을 제시했습니다. צור는 ‘압박하다’로, חזק은 ‘강하게 해 주다’로 옮겨 원문의 의미와 병렬 구조를 보존했습니다. 명시되지 않은 ‘도리어’는 본문에서 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:25:32Z'
