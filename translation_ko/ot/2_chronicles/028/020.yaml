    issue: ‘그에게로 와서’가 עָלָיו의 적대적 문맥상 뉘앙스를 충분히 반영하지 못합니다.
    rationale: בוא על은 군사·정치 문맥에서 ‘~을 치러/대적하여 오다’라는 의미로 흔히 쓰입니다. 뒤따르는 ‘압박하다’와도 일관되게 ‘그를 치러 왔다’가 더 충실합니다.
  - severity: low
    issue: ‘도리어’가 히브리어에 명시되지 않은 대비를 강화합니다.
    rationale: 원문은 ‘그를 압박하였고 그를 강하게 하지 않았다’라고 두 동사를 접속합니다. 문맥상 대조는 유지할 수 있으나, 본문에는 추가하지 않는 편이 안전합니다.
  - severity: low
    issue: ‘괴롭혔으나’는 צור의 압박·곤경에 빠뜨림이라는 공적·정치적 의미를 다소 일반적인 개인적 괴롭힘으로 만듭니다.
    rationale: ‘압박하였고’는 의미 범위를 더 잘 보존하며, 병렬된 부정절의 접속도 그대로 반영합니다.
