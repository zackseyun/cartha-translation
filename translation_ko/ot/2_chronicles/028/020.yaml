  text: וַ/יָּבֹ֣א עָלָ֔י/ו תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּ֥צַר ל֖/וֹ וְ/לֹ֥א חֲזָקֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
  footnotes:
  - marker: a
    text: Or 'distressed him ... and did not strengthen him.' The Hebrew may be rendered more formally without making the contrastive force explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 앗수르 왕 디글랏빌레셀이 그를 치러 와서 그를 압박하였고, 그를 강하게 해 주지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에게로 와서 그를 압박하였고, 그를 강하게 해 주지 않았다.” 히브리어의 ‘그를 치러 와서’는 문맥상 적대적 의미를 나타내지만, 문자적으로는 ‘그에게로 와서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  english_pob_choice: came against him
  chosen_korean: 그에게로 와서
  alternatives_korean:
  - 그에게로 왔습니다
  - 그를 치려고 왔습니다
  - 그에게로 다가왔습니다
  lexicon: HALOT
  rationale: 문맥상 적대적 방문이지만 히브리어 עצמו는 ‘오다’ 동사를 쓰므로, 과도한 해석을 피하면서도 뒤의 괴롭힘과 함께 적대 행위를 드러내도록 풀었습니다.
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  english_pob_choice: Tiglath-pileser
  chosen_korean: 디글랏빌레셀
  alternatives_korean:
  - 틸갓빌네셀
  - 디글랏-빌레셀
  lexicon: 고유명사 표기 관례
  rationale: 한국어 성경과 학술 표기에서 널리 쓰이는 음역을 따라 인명으로 보존했습니다.
- source_word: וַיָּצַר לוֹ
  english_pob_choice: distressed him / afflicted him
  chosen_korean: 그를 괴롭혔으나
  alternatives_korean:
  - 그를 괴롭혔습니다
  - 그를 압박했으나
  - 그를 고통스럽게 했으나
  lexicon: HALOT
  rationale: צור의 압박·핍박 의미를 살리되, 한국어에서 관계적·정치적 압박과 개인적 해악을 함께 담는 ‘괴롭히다’로 옮겨 자연스럽게 표현했습니다.
- source_word: וְלֹא חֲזָקֽוֹ
  english_pob_choice: but did not strengthen him / instead of strengthening him
  chosen_korean: 도리어 그를 강하게 해 주지는 않았습니다
  alternatives_korean:
  - 그를 강하게 해 주지 않았습니다
  - 그를 돕지 않았습니다
  - 오히려 그를 강하게 해 주지는 않았습니다
  lexicon: HALOT
  rationale: חזק의 ‘강하게 하다, 돕다’ 의미를 유지하면서 앞의 부정과 대비를 살리기 위해 ‘도리어’와 부정을 함께 써서 원문의 역설적 대조를 드러냈습니다.
theological_decisions:
- issue: 앗수르 왕의 행위가 단순한 방문인지 적대적 침공인지
  chosen_reading: 본문의 동사 자체는 단순한 ‘오다’이지만, 뒤의 압박·괴롭힘과 결합하여 적대적 행위로 읽히는 점을 드러내되, 해석을 과도하게 확정하지는 않았습니다.
  alternative_readings:
  - 그에게로 왔습니다
  - 그를 치려고 왔습니다
  rationale: 히브리어 표현의 범위와 문맥상의 적대성을 함께 보존해야 하므로, 서술어를 지나치게 군사화하지 않고도 결과적 해악은 분명히 드러냈습니다.
  doctrine_reference: 본문 맥락에 근거한 서술 선택
