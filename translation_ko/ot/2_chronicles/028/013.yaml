  rationale: 히브리어의 압축된 표현이 ‘야훼로 말미암아 우리에게 돌아오는 책임/죄책’을 함께 담고 있어, ‘허물 아래 두다’로 번역해 원문의 부담과 심판 뉘앙스를 살렸습니다.
- source_word: אַתֶּם אֹמְרִים לְהֹסִיף עַל חַטֹּאתֵינוּ וְעַל אַשְׁמָתֵינוּ
  english_pob_choice: you are proposing to add to our sins and to our guilt
