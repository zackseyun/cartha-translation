  rationale: ‘말하다’보다 문맥상 의도 표명이므로 ‘더하려 하면서’로 자연스럽게 옮겼고, ‘죄/허물’의 병렬을 유지해 히브리어의 이중 어휘를 살렸습니다.
- source_word: וַחֲרוֹן אָף
  english_pob_choice: fierce anger
  chosen_korean: 맹렬한 진노
  alternatives_korean:
