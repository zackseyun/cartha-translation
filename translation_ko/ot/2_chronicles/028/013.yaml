  terminology: יהוה는 ‘야훼’로 유지했습니다. חטאות는 ‘죄’, אשמות/אשמה는 ‘죄책’으로 구별했습니다. חרון אף는 ‘맹렬한 진노’로 유지했으며, Israel은 해석적으로 좁히지 않고 ‘이스라엘’로 보존했습니다.
