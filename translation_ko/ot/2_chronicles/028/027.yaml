base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the kings of Israel.'' Since Ahaz was king of Judah, some understand this as referring to the royal tombs of the Davidic kings, or would expect ''kings of Judah.'''
    reason: alternative_reading
translation:
  language: ko
  text: 아하스가 그의 조상들과 함께 누웠고, 그들은 그를 예루살렘의 성읍에 묻었습니다. 이는 그를 이스라엘의 왕들의 묘실에 들여놓지 않았기 때문입니다. 그의 아들 히스기야가 그의 뒤를 이어 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘의 왕들’이라고 읽습니다. 아하스는 유다 왕이므로, 이는 다윗 계열 왕들의 묘실을 가리키거나 ‘유다의 왕들’로 기대할 수 있다는 뜻으로 이해되기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: lay down
  chosen_korean: 누웠고
  alternatives_korean:
  - 죽었고
  - 잠들었고
  lexicon: HALOT
  rationale: 왕의 사망 기록에서 관용적으로 쓰이는 표현을 살려, 해석어인 ‘죽었고’보다 히브리어의 완곡한 동작 이미지를 보존했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 왕조 계보를 나타내는 관용구의 의미를 유지했습니다.
- source_word: בָעִיר בִּירוּשָׁלִַם
  english_pob_choice: in the city, in Jerusalem
  chosen_korean: 예루살렘의 성읍에
  alternatives_korean:
  - 성읍에, 예루살렘에
  - 예루살렘 성읍에
  lexicon: HALOT
  rationale: 히브리어의 이중 표현을 한국어에서 자연스럽게 통합하되, 예루살렘 안에서의 매장임을 분명히 했습니다.
- source_word: מַלְכֵי יִשְׂרָאֵל
  english_pob_choice: of the kings of Israel
  chosen_korean: 이스라엘의 왕들의 묘실
  alternatives_korean:
  - 유다의 왕들의 묘실
  - 이스라엘 왕들의 무덤
  lexicon: HALOT
  rationale: 본문의 ‘이스라엘’을 본문 그대로 유지하고, 왕실 매장 공간임을 드러내기 위해 ‘묘실’로 옮겼습니다.
theological_decisions:
- issue: ‘이스라엘의 왕들’을 ‘유다의 왕들’로 조정할지 여부
  chosen_reading: 본문의 ‘이스라엘의 왕들’을 그대로 유지했습니다.
  alternative_readings:
  - 유다의 왕들
  rationale: 히브리어 본문이 명시적으로 ‘이스라엘’이라 읽으므로, 역사적 기대에 맞추어 조정하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: Original-language primacy; preserve textual tension rather than harmonize it.
