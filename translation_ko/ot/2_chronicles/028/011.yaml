id: 2CH.28.11
reference: 2 Chronicles 28:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֣ה שְׁמָע֔וּ/נִי וְ/הָשִׁ֨יבוּ֙ הַ/שִּׁבְיָ֔ה אֲשֶׁ֥ר שְׁבִיתֶ֖ם מֵ/אֲחֵי/כֶ֑ם כִּ֛י חֲר֥וֹן אַף יְהוָ֖ה עֲלֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
  footnotes:
  - marker: a
    text: Or 'from your fellow Israelites.' The Hebrew says 'from your brothers,' using kinship language for members of the same covenant people.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 제 말을 들으시고, 여러분이 여러분의 형제들[a] 가운데서 사로잡은 포로들을 돌려보내십시오. 야훼의 타오르는 분노가 여러분에게 임해 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘형제들’은 같은 언약 백성을 가리키는 말일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
  english_pob_choice: listen to me
  chosen_korean: 제 말을 들으시고
  alternatives_korean:
  - 제 말을 들으십시오
  - 내 말을 들으시고
  lexicon: HALOT
  rationale: 1인칭 목적어가 붙은 명령형은 단순한 청취가 아니라 즉각적이고 순종적인 경청을 요구하므로, 합쇼체에서 자연스럽게 ‘제 말을 들으시고’로 옮겼습니다.
- source_word: וְהָשִׁיבוּ
  english_pob_choice: return
  chosen_korean: 돌려보내십시오
  alternatives_korean:
  - 돌아가게 하십시오
  - 다시 보내십시오
  lexicon: HALOT
  rationale: 히필형 שוב는 ‘돌아가게 하다’의 강한 사역 의미이므로, 사로잡은 사람들을 해방시켜 되돌려 보내는 뉘앙스를 살려 ‘돌려보내십시오’로 번역했습니다.
- source_word: הַשִּׁבְיָה
  english_pob_choice: the captives
  chosen_korean: 포로들
  alternatives_korean:
  - 사로잡힌 자들
  - 잡혀간 사람들
  - 포로 된 무리
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘포로 상태’가 아니라 실제로 붙잡힌 사람들을 가리키므로, 현대 한국어에서 가장 सीधे하고 구체적인 ‘포로들’을 택했습니다.
- source_word: מֵאֲחֵיכֶם
  english_pob_choice: from your brothers
  chosen_korean: 여러분의 형제들에게서
  alternatives_korean:
  - 여러분의 형제들 가운데서
  - 여러분의 동족에게서
  - 여러분의 친족에게서
  lexicon: HALOT
  rationale: 히브리어 אָח의 혈연/동족적 의미를 살리되, 한국어에서는 복수 대상을 자연스럽게 드러내기 위해 ‘형제들에게서’로 옮겼습니다. POB의 주석처럼 같은 언약 백성이라는 의미를 유지합니다.
- source_word: חֲרוֹן אַף
  english_pob_choice: the burning anger
  chosen_korean: 타오르는 분노
  alternatives_korean:
  - 불타는 분노
  - 격렬한 분노
  - 진노
  lexicon: HALOT
  rationale: 직역적 관용구인 ‘불타는/타오르는 분노’ 중에서, ‘타오르는’이 하나님의 분노가 지금 임하고 있다는 현재적 긴박감을 더 잘 드러내므로 채택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유명사 יְהוָה는 칭호가 아니라 언약적 신명으로서, 프로젝트 기본어 ‘야훼’를 사용해 이름 자체를 보존했습니다.
theological_decisions:
- issue: 언약 공동체 내부의 ‘형제들’ 표현
  chosen_reading: ‘여러분의 형제들’로 직역하되 포로의 동족성은 문맥에 맡깁니다.
  alternative_readings:
  - ‘여러분의 동족’으로 완화
  - ‘여러분의 이스라엘 동족’으로 풀어 씀
  rationale: 히브리어는 아예 ‘형제들’이라고 말하며, POB도 그 친족 언어를 유지하고 주석으로 의미를 설명합니다. 본문이 요구하는 윤리적 압박을 약화시키지 않기 위해 직역을 유지했습니다.
  doctrine_reference: 언약 백성의 상호책임과 형제애
- issue: YHWH의 분노를 나타내는 표현
  chosen_reading: ‘야훼의 타오르는 분노가 여러분에게 임해 있습니다’
  alternative_readings:
  - ‘야훼의 진노가 여러분에게 있습니다’
  - ‘야훼의 분노가 여러분을 향해 있습니다’
  rationale: ‘עֲלֵיכֶם’은 단순한 감정 상태가 아니라 화가 그들에게 ‘위에/향해’ 놓여 있음을 나타내므로, 임박하고 실제적인 심판의 긴장을 살려 ‘임해 있습니다’로 옮겼습니다.
  doctrine_reference: 하나님의 심판과 언약적 징계
