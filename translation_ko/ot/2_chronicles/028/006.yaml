base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
  footnotes:
  - marker: a
    text: Or 'in one day.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of valor'; that is, valiant fighting men.
    reason: lexical_alternative
  - marker: c
    text: Or 'when they had forsaken the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 베가의 아들 페가가 유다에서 하루에 한 번에 십이만 명을 죽였는데, 그들은 모두 용사들이었습니다. 그 이유는 그들이 자기 조상의 하나님이신 야훼를 저버렸기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하루에’.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘용사의 아들들’ 곧 용맹한 전사들을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들이 야훼를 저버렸을 때’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  english_pob_choice: killed
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 죽였는데
  - 도륙했습니다
  - 쳐 죽였습니다
  lexicon: HALOT
  rationale: הרג는 단순히 ‘죽이다’라는 뜻이므로, 현대 한국어의 직접적이고 분명한 ‘죽였습니다’를 사용했습니다.
- source_word: בִּיהוּדָה
  english_pob_choice: in Judah
  chosen_korean: 유다에서
  alternatives_korean:
  - 유다 안에서
  - 유다 땅에서
  - 유다 가운데서
  lexicon: HALOT
  rationale: 전치사 ב의 위치 의미를 살려, 역사적 지역명인 ‘유다에서’로 옮겼습니다.
- source_word: בְּיוֹם אֶחָד
  english_pob_choice: in a single day
  chosen_korean: 하루에
  alternatives_korean:
  - 한 날에
  - 하루 동안에
  - 한 날 만에
  lexicon: HALOT
  rationale: 직역하면 ‘한 날에’이지만, 한국어에서는 사건의 압도를 자연스럽게 드러내는 ‘하루에’가 가장 간결합니다.
- source_word: בְּנֵי חָיִל
  english_pob_choice: valiant men
  chosen_korean: 용사들
  alternatives_korean:
  - 용맹한 사람들
  - 싸움 잘하는 사람들
  - 무사들
  lexicon: HALOT
  rationale: 문맥상 전투에 능한 남자들을 가리키므로, 한국어 관용과 의미를 함께 살리는 ‘용사들’로 옮겼습니다.
- source_word: בְּעָזְבָם
  english_pob_choice: because they had forsaken
  chosen_korean: 저버렸기 때문입니다
  alternatives_korean:
  - 버렸기 때문입니다
  - 떠났기 때문입니다
  - 배반했기 때문입니다
  lexicon: HALOT
  rationale: 언약적 배교의 뉘앙스를 살리기 위해 단순한 ‘버리다’보다 관계를 끊는 느낌이 강한 ‘저버리다’를 선택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 여호와 대신 하나님의 고유명사로서 ‘야훼’를 사용했습니다.
- source_word: אֱלֹהֵי אֲבוֹתָם
  english_pob_choice: the God of their fathers
  chosen_korean: 자기 조상의 하나님
  alternatives_korean:
  - 그들의 조상들의 하나님
  - 조상들의 하나님
  - 선조들의 하나님
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 살리되, 소유 대명사 ‘their’는 문맥상 ‘자기’로 분명히 했습니다.
theological_decisions:
- issue: 야훼에 대한 신명칭 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 고유명사를 직접 드러내는 것이 본문의 언약적 진술을 가장 분명하게 보존합니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH = 야훼'
- issue: בְּעָזְבָם의 관계 의미
  chosen_reading: ‘그들이 ... 야훼를 저버렸기 때문입니다’로 원인의 의미를 살렸습니다.
  alternative_readings:
  - ‘...을 저버릴 때’
  - ‘...을 버렸을 때’
  rationale: 역대기서가 재난을 언약 위반의 결과로 해석하는 흐름을 한국어에서도 유지하기 위해 인과로 번역했습니다.
  doctrine_reference: Translation philosophy §3
