translation:
  language: ko
  text: 르말랴의 아들 베가가 유다에서 하루에[a] 십이만 명을 죽였습니다. 그들은 모두 용사들이었습니다[b]. 이는 그들이 그들의 조상들의 하나님이신 야훼를 저버렸기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 날에’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘용사의 아들들’; 곧 용맹한 전사들을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들이 야훼를 저버렸을 때’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  english_pob_choice: killed
  chosen_korean: 죽였습니다
  alternatives_korean:
