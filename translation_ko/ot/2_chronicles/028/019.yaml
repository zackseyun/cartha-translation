  text: כִּֽי הִכְנִ֤יעַ יְהוָה֙ אֶת יְהוּדָ֔ה בַּ/עֲב֖וּר אָחָ֣ז מֶֽלֶךְ יִשְׂרָאֵ֑ל כִּ֤י הִפְרִ֨יעַ֙ בִּֽ/יהוּדָ֔ה וּ/מָע֥וֹל מַ֖עַל בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Ahaz king of Israel.'' Ahaz was king of Judah; the Chronicler''s wording is retained rather than harmonized.'
    reason: alternative_reading
  - marker: b
    text: Or 'had acted recklessly in Judah' or 'had cast off restraint in Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 아하스, 이스라엘의 왕 때문에 유다를 낮추셨습니다.[a] 이는 그가 유다에서 절제를 풀어 버리고[b] 야훼께 크게 신의를 저버렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아하스, 이스라엘의 왕’이라고 읽습니다. 아하스는 역사적으로 유다의 왕이었지만, 역대기의 표현을 조화시키지 않고 그대로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 또는 ‘유다에서 무모하게 행하고’ 또는 ‘유다에서 질서를 무너뜨리고’. 히브리어 동사는 절제를 풀어 놓거나 무질서를 초래하는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명 יְהוָה는 POB 원칙에 따라 신적 칭호가 아니라 고유 이름으로 옮기므로, 한국어도 전통적 대치어보다 학술적 음역인 ‘야훼’를 택했습니다.
- source_word: הִכְנִיעַ
  english_pob_choice: humbled
  chosen_korean: 낮추셨습니다
  alternatives_korean:
  - 겸손하게 하셨습니다
  - 굴복시키셨습니다
  - 억누르셨습니다
  lexicon: HALOT
  rationale: 하필사적 히필이 야훼의 행위로 유다의 지위와 형편을 낮추는 뜻이므로, 관계적·신학적 뉘앙스를 살리는 ‘낮추다’로 옮겼습니다.
- source_word: הִפְרִיעַ
  english_pob_choice: had cast off restraint
  chosen_korean: 방종하게 하고
  alternatives_korean:
  - 무절제하게 하고
  - 제멋대로 하게 하고
  - 질서를 무너뜨리게 하고
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘무모함’보다 제어를 풀어놓아 질서와 절제를 깨뜨리는 뉘앙스가 있어, 문맥상 자연스러운 한국어로 ‘방종하게 하고’라고 옮겼습니다.
- source_word: וּמָעוֹל מַעַל
  english_pob_choice: had acted very unfaithfully
  chosen_korean: 매우 신실하지 않게 행하였기
  alternatives_korean:
  - 극심하게 배신하였기
  - 크게 언약을 저버렸기
  - 심히 불충실하게 행하였기
  lexicon: HALOT
  rationale: 마알 계열 표현은 단순 실수보다 언약적 불성실과 배신을 가리키므로, 직역을 지나치게 도덕화하지 않으면서도 그 강도를 살려 ‘매우 신실하지 않게 행하다’로 옮겼습니다.
theological_decisions:
- issue: 아하스를 ‘이스라엘의 왕’으로 부르는 표현
  chosen_reading: 본문의 표현을 그대로 살려 ‘아하스 — 곧 이스라엘의 왕 — ’으로 두었습니다.
  alternative_readings:
  - ‘유다의 왕’으로 조화해서 번역
  - 주석으로만 처리하고 본문은 역사적 호칭으로 완화
  rationale: 역사적으로 아하스는 유다 왕이지만, 역대기는 의도적으로 ‘이스라엘’이라는 호칭을 사용할 수 있으므로, 원문의 긴장을 보존하고 독자가 본문 자체를 보도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 지닌 신학적 긴장 보존
