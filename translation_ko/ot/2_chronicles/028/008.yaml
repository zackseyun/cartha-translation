base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
  footnotes:
  - marker: a
    text: Or 'from their kinsmen' or 'from their fellow Israelites.' The Hebrew says 'from their brothers,' emphasizing shared kinship.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 자기 형제들[a]에게서 여자와 아들들과 딸들 20만 명을 사로잡았습니다. 그들은 또 그들에게서 많은 전리품을 빼앗아 그 전리품을 사마리아로 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 친족들에게서’ 또는 ‘자기 동족들에게서’. 히브리어는 ‘자기 형제들에게서’라고 하여 같은 이스라엘 공동체에 속한 이들임을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 혈연적·언약적 집단 표현을 살리면서도 한국어로는 관용적인 성서 표현인 ‘이스라엘 자손’이 가장 자연스럽습니다.
- source_word: מֵאֲחֵיהֶם
  english_pob_choice: from their brothers
  chosen_korean: 자기 형제들 가운데서
  alternatives_korean:
  - 자기 친족들 가운데서
  - 자기 동족들 가운데서
  lexicon: HALOT
  rationale: 히브리어 אָח의 친족 의미를 살리되, POB의 ‘brothers’가 가진 도덕적 긴장을 유지하기 위해 직역에 가깝게 옮겼습니다.
- source_word: שָׁלָל רָב / בָּזְזוּ
  english_pob_choice: much spoil / took much spoil
  chosen_korean: 많은 전리품을 빼앗아
  alternatives_korean:
  - 많은 노획물을 빼앗아
  - 큰 전리품을 탈취하여
  lexicon: HALOT
  rationale: שָׁלָל과 בָּזַז의 전쟁 약탈 의미를 함께 반영하기 위해 ‘전리품’과 ‘빼앗다’를 사용했습니다.
theological_decisions:
- issue: 동족 간 포로화의 윤리적 긴장
  chosen_reading: ‘자기 형제들 가운데서’로 옮겨 이스라엘 내부의 상호 포획이라는 충격을 그대로 드러냈습니다.
  alternative_readings:
  - ‘자기 친족들 가운데서’로 완화
  - ‘자기 동족들 가운데서’로 일반화
  rationale: 본문은 단순한 전쟁 보도가 아니라 같은 언약 공동체 안에서 벌어진 폭력을 강조하므로, 그 긴장을 희석하지 않는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §3, tension-preserving rendering
