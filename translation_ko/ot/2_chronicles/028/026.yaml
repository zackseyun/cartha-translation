  text: Now the rest of his acts and all his ways, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: ko
  text: 이제 그의 남은 행적과 그의 모든 행실, 처음 것과 나중 것이 보십시오, 유다와 이스라엘 왕들의 책에 기록되어 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 말들/사건들’이지만, 왕의 요약 연대표에서는 ‘행적’이 문맥상 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘처음 것과 나중 것’은 히브리어의 시간 전체를 포괄하는 관용적 대구입니다.
    reason: source_note
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  english_pob_choice: Now the rest of his acts
  chosen_korean: 이제 그의 남은 행적
  alternatives_korean:
  - 그의 남은 일들
  - 그의 남은 행위
  lexicon: HALOT
  rationale: דְּבָרִים는 문자 그대로는 ‘말들/사건들’이지만, 열왕기적 요약문맥에서는 왕의 행적·사건을 가리키므로 ‘행적’이 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: וְכָל דְּרָכָיו
  english_pob_choice: and all his ways
  chosen_korean: 그리고 그의 모든 행실
  alternatives_korean:
  - 그리고 그의 모든 길
  - 그리고 그의 모든 처신
  lexicon: HALOT
  rationale: דֶּרֶךְ의 기본 은유인 ‘길’을 살릴 수도 있으나, 여기서는 왕의 삶의 방식과 행동 양식을 뜻하므로 한국어에서는 ‘행실’이 더 분명합니다.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  english_pob_choice: the first and the last
  chosen_korean: 처음 것과 나중 것
  alternatives_korean:
  - 첫째와 마지막
  - 처음과 나중
  lexicon: HALOT
  rationale: 이 표현은 시간 전체를 포괄하는 관용적 대구이므로, 직역의 투명성을 유지하면서도 한국어 자연성을 위해 ‘것’을 보충했습니다.
- source_word: הִנָּם
  english_pob_choice: behold, they are
  chosen_korean: 보십시오,
  alternatives_korean:
  - 보라,
  - 실로
  lexicon: HALOT
  rationale: 히브리어의 지시적 강조를 한국어 독자에게 자연스럽게 전달하기 위해 감탄사형 ‘보십시오’를 택했습니다.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  english_pob_choice: the Kings of Judah and Israel
  chosen_korean: 유다와 이스라엘 왕들의 책
  alternatives_korean:
  - 유다와 이스라엘의 왕들의 책
  - 유다 왕들과 이스라엘 왕들의 책
  lexicon: HALOT
  rationale: 사료 제목처럼 기능하는 문구이므로 관용적으로 ‘...왕들의 책’이라 옮기되, 히브리어의 속격 관계를 보존했습니다.
theological_decisions:
- issue: 사료 인용 공식의 문체
  chosen_reading: ‘보십시오’로 지시성을 살려 사료 인용의 권위를 유지했습니다.
  alternative_readings:
  - ‘보라’
  - 단순히 생략
  rationale: 히브리어 הִנָּם의 지시적 강조는 단순 연결어보다 독자 주의를 환기하는 기능이 있으므로, 현대 한국어 합쇼체 안에서 이를 드러내는 편이 본문 기능에 충실합니다.
  doctrine_reference: 문헌 인용 공식과 역사서적 서술 관례
