  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in every city and city of Judah,'' a distributive expression meaning throughout all the cities of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 모든 성읍마다 그는 산당을 세워 다른 신들에게 분향하게 하였고, 그의 조상들의 하나님이신 야훼를 격노하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘유다의 성읍마다 성읍마다’라는 분배 표현으로, 유다 전역의 모든 성읍을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  english_pob_choice: And in every city and city of Judah
  chosen_korean: 유다의 모든 성읍마다
  alternatives_korean:
  - 유다의 모든 성읍마다
  - 유다의 각 성읍마다
  - 유다의 성읍마다 두루
  lexicon: HALOT
  rationale: 히브리어의 분배 반복(‘성읍과 성읍’)은 한국어에서 자연스럽게 ‘모든 성읍마다’로 풀어, 포괄성을 유지하면서도 읽기 흐름을 살렸습니다.
- source_word: בָמוֹת
  english_pob_choice: high places
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 산당들
  - 고지 제단
  lexicon: HALOT
  rationale: bāmôt의 통상적 제의 용어인 ‘산당’을 사용해 우상숭배 장소라는 문맥적 의미를 정확히 전달했습니다.
- source_word: לְקַטֵּר
  english_pob_choice: to burn incense
  chosen_korean: 분향하게 하였고
  alternatives_korean:
  - 향을 피우게 하였고
  - 향을 사르게 하였고
  - 제사를 드리게 하였고
  lexicon: HALOT
  rationale: ‘분향하다’가 본문의 제의 행위를 가장 직접적으로 옮기며, 단순한 향내 발생이 아니라 제의적 분향임을 드러냅니다.
- source_word: אֱלֹהִים אֲחֵרִים
  english_pob_choice: other gods
  chosen_korean: 다른 신들에게
  alternatives_korean:
  - 다른 하나님들에게
  - 이방 신들에게
  - 타신들에게
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 따라 ‘다른 신들’로 옮겼고, 본문이 예배 대상을 바꾸어 버린 죄를 분명히 보이도록 했습니다.
- source_word: וַיַּכְעֵס אֶת יְהוָה
  english_pob_choice: and he provoked Yahweh
  chosen_korean: 야훼를 격노하게 하였습니다
  alternatives_korean:
  - 야훼를 분노하게 하였습니다
  - 야훼를 노하게 하였습니다
  - 야훼를 분개하게 하였습니다
  lexicon: HALOT
  rationale: hiphil כעס의 인과적 뉘앙스를 살려 ‘격노하게 하다’로 옮겼습니다. ‘노하게 하다’보다 더 강한 도발의 의미가 본문에 어울립니다.
- source_word: יְהוָה אֱלֹהֵי אֲבֹתָיו
  english_pob_choice: Yahweh, the God of his fathers
  chosen_korean: 그의 조상들의 하나님이신 야훼
  alternatives_korean:
  - 조상들의 하나님이신 야훼
  - 그 조상들의 하나님 야훼
  - 그의 조상들의 하나님인 야훼
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기준에 따라 ‘야훼’로 옮기고, ‘아브라함·이삭·야곱’ 계열의 언약적 호칭을 한국어의 관용에 맞게 ‘조상들의 하나님’으로 처리했습니다.
