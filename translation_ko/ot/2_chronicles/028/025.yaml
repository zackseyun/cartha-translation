  - 그 조상들의 하나님 야훼
  - 그의 조상들의 하나님인 야훼
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기준에 따라 ‘야훼’로 옮기고, ‘아브라함·이삭·야곱’ 계열의 언약적 호칭을 한국어의 관용에 맞게 ‘조상들의 하나님’으로 처리했습니다.
