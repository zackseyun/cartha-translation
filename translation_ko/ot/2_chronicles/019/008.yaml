  - 주님
  rationale: 프로젝트 기본값을 따라 고유신명사로 처리해, 본문의 직접성을 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
- issue: לְמִשְׁפַּט יְהוָה의 의미 범위
  chosen_reading: 야훼의 판결
  alternative_readings:
