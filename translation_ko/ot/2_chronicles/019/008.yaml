base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'for the LORD’s judgment,' that is, for cases governed by the LORD’s law.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''and they returned to Jerusalem.'' Some understand the text differently, such as ''and they sat/dwelt in Jerusalem,'' because the received wording is somewhat abrupt in context.'
    reason: alternative_reading
translation:
  language: ko
  text: 또한 예루살렘에서 여호사밧은 레위 사람들과 제사장들, 그리고 이스라엘 자손의 가문 우두머리들 가운데서 몇 사람을 야훼의 판결[a]과 분쟁을 위하여 세웠습니다. 그들이 예루살렘으로 돌아왔습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 율법에 따른 재판을 위하여’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 직역하면 ‘그리고 그들이 예루살렘으로 돌아왔습니다’입니다. 문맥상 갑작스럽게 느껴져, 어떤 이들은 ‘예루살렘에 앉아 있었습니다’ 또는 ‘예루살렘에 머물렀습니다’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고 또한
  - 아울러
  lexicon: HALOT
  rationale: 이야기 진행에 덧붙는 요소를 자연스럽게 이어 주는 한국어 부사로, 추가성만 유지했습니다.
- source_word: הֶעֱמִיד
  english_pob_choice: appointed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 배치했습니다
  - 세워 두었습니다
  lexicon: HALOT
  rationale: 재판 기능을 맡기는 행정적 설정을 드러내면서도, 히필의 ‘세우다/자리에 두다’라는 기본 감각을 살렸습니다.
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  english_pob_choice: some of the Levites, the priests, and the heads of the fathers’ houses of Israel
  chosen_korean: 레위 사람들과 제사장들, 그리고 이스라엘의 조상 가문들의 우두머리들 가운데서 몇 사람
  alternatives_korean:
  - 레위 사람들과 제사장들, 그리고 이스라엘의 조상들의 집 우두머리들 가운데서
  - 레위인들과 제사장들과 이스라엘의 족장들 가운데서 몇 사람
  lexicon: HALOT
  rationale: מן/מֵ의 부분적 선택을 ‘가운데서 몇 사람’으로 드러냈고, רָאשֵׁי הָאָבוֹת는 공동체 구조를 살려 ‘조상 가문들의 우두머리들’로 옮겼습니다.
- source_word: לְמִשְׁפַּט יְהוָה
  english_pob_choice: for the judgment of Yahweh
  chosen_korean: 야훼의 판결
  alternatives_korean:
  - 야훼의 재판
  - 야훼의 판단
  - 야훼를 위한 판결
  lexicon: HALOT
  rationale: 문맥상 사법적 사안을 가리키므로 ‘판결’이 적합합니다. 동시에 ‘야훼의’는 판결의 근거·권위가 야훼에게 있다는 폭넓은 의미를 보존합니다.
- source_word: וְלָרִיב
  english_pob_choice: and for disputes
  chosen_korean: 분쟁을 위하여
  alternatives_korean:
  - 다툼을 위하여
  - 송사를 위하여
  - 법적 다툼을 위하여
  lexicon: HALOT
  rationale: רִיב은 단순한 말다툼보다 법적·공적 분쟁까지 아우를 수 있어, 현대어로는 ‘분쟁’이 가장 무난합니다.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  english_pob_choice: and they returned to Jerusalem
  chosen_korean: 그들이 예루살렘으로 돌아왔습니다
  alternatives_korean:
  - 그들이 예루살렘에 머물렀습니다
  - 그들이 예루살렘에 앉았습니다
  lexicon: HALOT
  rationale: 표준 자음본문의 שוב를 가장 सीधे하게 반영한 기본 의미를 택했습니다. 본문이 다소 급작스럽다는 점은 대안 독법을 각주로 남겨 처리했습니다.
theological_decisions:
