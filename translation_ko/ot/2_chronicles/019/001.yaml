  text: And Jehoshaphat king of Judah returned in peace to his house in Jerusalem[a].
  footnotes:
  - marker: a
    text: Or 'returned safely to his house in Jerusalem.' The Hebrew phrase 'in peace' can also emphasize safe return.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 여호사밧이 예루살렘에 있는 자기 집으로 평안히 돌아왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안전하게 자기 집으로 돌아왔습니다.’ 히브리어 ‘평안히’는 안전한 귀환을 강조할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아왔습니다
  alternatives_korean:
  - 되돌아왔습니다
  - 돌아갔습니다
  lexicon: WLC שוב
  rationale: 서술문에서 שוב의 기본 의미인 ‘돌아오다’를 자연스럽고 격식 있게 반영합니다.
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: king of Judah
  chosen_korean: 유다 왕
  alternatives_korean:
  - 유다의 왕
  - 유다의 임금
  lexicon: WLC מלך + יהודה
  rationale: 히브리어의 신분 표지를 한국어 관용적 관형 구조로 옮겨, 직함을 간결하게 드러냅니다.
- source_word: אֶל בֵּיתוֹ
  english_pob_choice: to his house
  chosen_korean: 자기 집으로
  alternatives_korean:
  - 자기 집에
  - 자기 가정으로
  lexicon: WLC בית
  rationale: בית의 구체적 거처 의미를 살리되, 한국어에서는 도착점을 나타내는 ‘-으로’가 가장 자연스럽습니다.
- source_word: בְּשָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평화롭게
  - 안전하게
  lexicon: WLC שלום
  rationale: ‘평안’과 ‘안전한 무사귀환’의 뉘앙스를 함께 보존하면서, 한국어 부사로 유려하게 표현합니다.
theological_decisions:
- issue: בְּשָׁלוֹם의 의미 범위
  chosen_reading: ‘평안히’로 번역해 무사한 귀환과 평강의 상태를 함께 암시합니다.
  alternative_readings:
  - ‘안전하게’로 한정
  - ‘평화롭게’로만 번역
  rationale: 히브리어 שָׁלוֹם은 단순한 안전뿐 아니라 평안·안녕을 포함하므로, 어느 한쪽으로만 좁히지 않는 것이 본문에 충실합니다.
  doctrine_reference: 구약 어휘의 의미 범위 보존
