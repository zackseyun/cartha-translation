source:
  edition: WLC
  text: אֲבָ֕ל דְּבָרִ֥ים טוֹבִ֖ים נִמְצְא֣וּ עִמָּ֑/ךְ כִּֽי בִעַ֤רְתָּ הָ/אֲשֵׁרוֹת֙ מִן הָ/אָ֔רֶץ וַ/הֲכִינ֥וֹתָ לְבָבְ/ךָ֖ לִ/דְרֹ֥שׁ הָֽ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
  footnotes:
  - marker: a
    text: Or 'have prepared your heart to seek God.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Asheroth'; that is, cult objects associated with the goddess Asherah.
    reason: cultural_note
translation:
  language: ko
  text: 그러나 왕께는 좋은 점들도 있습니다. 왕께서 아세라 제의물들[b]을 이 땅에서 없애고, 하나님을 찾기로 마음을 정하셨기[a] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 찾도록 마음을 준비하셨기 때문입니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아세라들’입니다. 아세라 여신과 관련된 제의 물건들을 가리킵니다.
    reason: cultural_note
