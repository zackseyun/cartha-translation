base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
  footnotes:
  - marker: a
    text: Or 'have prepared your heart to seek God.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Asheroth'; that is, cult objects associated with the goddess Asherah.
    reason: cultural_note
translation:
  language: ko
  text: 그러나[ [a] ] 좋은 것들이 당신에게서 발견되었습니다[ [b] ] — 곧 당신이 아세라 목상들을 땅에서 제거하고, 하나님을 찾으려고 마음을 정하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 찾도록 마음을 준비하였기 때문입니다.’
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘아세라들’로, 아세라 여신과 관련된 우상 숭배 물건을 가리킵니다.
    reason: cultural_note
lexical_decisions:
