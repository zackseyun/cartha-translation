  lexicon: HALOT
  rationale: 역대기에서의 신학적 표어인 ‘seek God’를 살리면서도, 현대 한국어에서 자연스러운 갈망·지향의 표현으로 옮겼습니다.
theological_decisions:
- issue: 아세라 관련 우상 용어의 처리
  chosen_reading: 고유명을 보존하되 대상이 우상 물건임을 분명히 하는 ‘아세라 목상들’로 번역했습니다.
  alternative_readings:
  - 아세라
  - 아세라 기둥들
  - 아세라 상들
  rationale: 본문은 단순한 종교 관념이 아니라 제거된 구체적 우상 표지를 말하므로, 독자가 그 물질성을 즉시 파악할 수 있게 했습니다.
  doctrine_reference: Original-language primacy over inherited ecclesial wording; preserve idolatry critique without softening.
- issue: לִדְרֹשׁ הָאֱלֹהִים의 신학적 뉘앙스
  chosen_reading: ‘하나님을 찾으려고 마음을 정하다’로 옮겨, 단순한 정보 탐색이 아니라 언약적 지향을 표현했습니다.
  alternative_readings:
  - 하나님께 묻으려고
  - 하나님을 찾다
  - 하나님을 구하다
  rationale: 역대기에서 이 표현은 하나님을 향한 내적 결단과 추구를 가리키므로, 그 영적·관계적 의미를 유지했습니다.
  doctrine_reference: Preserve theological force of Chronicles' seeking language rather than reducing it to inquiry.
