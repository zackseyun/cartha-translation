review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. כֹהֵן הָרֹאשׁ는 직역상 ‘제사장 우두머리/수석 제사장’이며, 본문이 더 기술적인 제도 직함인 ‘대제사장’을 확정하지 않습니다. עֲלֵיכֶם의 감독 관계도 ‘관여하고’보다 분명히 드러내야 합니다. 마지막 וִיהִי는 조건절 ‘그러면’이 아니라 독립적인 기원·축원입니다.
  naturalness: 초안은 전반적으로 읽기 쉽지만, ‘여러분을 맡아 … 관여하고’는 감독 권한과 사건 관할을 다소 흐립니다. ‘힘을 내어 그렇게 하십시오’의 ‘그렇게’는 원문에 없는 지시 대상을 보충합니다. ‘선한 이’는 현대 공적 문체에서 자연스럽고, 일반적 단수의 뜻도 유지합니다.
  terminology: 야훼, 아마랴, 스바댜, 유다 집은 유지할 수 있습니다. שֹׁטְרִים는 ‘관리’로 옮길 수 있으나, 레위 사람들이 재판관들 ‘앞에서’ 보좌·봉사하는 관계를 문장에 반영하는 편이 좋습니다. ‘수석 제사장’은 ‘대제사장’보다 원문의 비기술적 표현을 더 안전하게 보존합니다.
  issues:
  - severity: medium
    issue: ‘대제사장’
    rationale: כֹהֵן הָרֹאשׁ는 ‘우두머리/수석 제사장’이라는 표현이며, 이 구절만으로 정식 대제사장 직위를 확정할 수 없습니다.
  - severity: medium
    issue: ‘여러분을 맡아 … 관여하고’
    rationale: עֲלֵיכֶם는 여러분에 대한 감독·상위 권한을, לְכֹל דְּבַר는 각 사안의 관할을 가리킵니다. ‘관여하다’는 이 관계를 약화합니다.
  - severity: medium
    issue: ‘그러면’
    rationale: וִיהִי는 앞 명령의 결과를 표시하는 조건절이 아니라 ‘야훼께서 … 함께하시기를’이라는 독립된 기원입니다.
  - severity: low
    issue: ‘그렇게 하십시오’
    rationale: וַעֲשׂוּ는 ‘행하십시오/실행하십시오’이지, 원문에 없는 특정 행동을 가리키는 ‘그렇게’는 아닙니다.
  - severity: low
    issue: 각주 a와 b의 기능
    rationale: a는 선택하지 않은 ‘대제사장’을 본문 번역처럼 정당화하며, b는 어휘 대안을 제시하지 않습니다. 원문상 논쟁적 대안은 필요한 경우 ‘선한 자/선한 이’ 정도입니다.
