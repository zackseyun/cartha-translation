id: 2CH.19.11
reference: 2 Chronicles 19:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
  footnotes:
  - marker: a
    text: Or 'the high priest' for 'the chief priest.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD be with the one who is good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 아마랴는 대제사장으로서 여러분을 맡아 야훼의 모든 일에 관여하고, 이스마엘의 아들 스바댜는 유다 집의 지도자로서 왕의 모든 일에 관여합니다. 또한 레위 사람 관리들은 여러분 앞에 있습니다. 힘을 내어 그렇게 하십시오. 그러면 야훼께서 선한 사람과 함께하시기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘대제사장’은 여기의 ‘제사장 우두머리’를 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘선한 사람’은 히브리어 ‘the good’의 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹהֵן הָרֹאשׁ
  english_pob_choice: the chief priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 수석 제사장
  - 제사장 우두머리
  lexicon: HALOT
  rationale: 이 표현은 제사장들 가운데 우두머리라는 행정적 지위를 가리키므로, 한국어에서는 자연스럽고 널리 이해되는 ‘대제사장’이 가장 적절합니다.
- source_word: עֲלֵיכֶם
  english_pob_choice: is over you
  chosen_korean: 여러분을 맡아
  alternatives_korean:
  - 여러분 위에 있습니다
  - 여러분을 감독합니다
  lexicon: HALOT
  rationale: 단순한 위치보다 관할·감독의 의미가 강하므로, 공적 직무를 나타내는 ‘여러분을 맡아’로 옮겼습니다.
- source_word: לְכֹל דְּבַר יְהוָה / לְכֹל דְּבַר הַמֶּלֶךְ
  english_pob_choice: for every matter of Yahweh / for every matter of the king
  chosen_korean: 야훼의 모든 일 / 왕의 모든 일
  alternatives_korean:
  - 야훼와 관련된 모든 사안 / 왕과 관련된 모든 사안
  - 야훼의 모든 사건 / 왕의 모든 사건
  lexicon: HALOT
  rationale: דָּבָר는 ‘말’보다 ‘일, 사안, 일들’의 범위를 넓게 포함하므로, 병렬 구조를 살리면서도 지나치게 법률적이지 않은 ‘모든 일’로 옮겼습니다.
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  english_pob_choice: and the Levites will serve as officers before you
  chosen_korean: 레위 사람 관리들은 여러분 앞에 있습니다
  alternatives_korean:
  - 레위 사람들은 여러분 앞에서 관리로 섭니다
  - 레위 사람 관리들은 여러분을 보좌합니다
  lexicon: HALOT
  rationale: שֹׁטְרִים는 일반적인 ‘관리자/공무 담당자’에 가까우므로, 한국어 독자가 이해하기 쉬운 ‘관리들’로 두었고, לִפְנֵיכֶם는 단순한 위치가 아니라 공적 섬김의 자리이므로 ‘여러분 앞에’로 보존했습니다.
- source_word: חִזְקוּ וַעֲשׂוּ
  english_pob_choice: Be strong and act
  chosen_korean: 힘을 내어 그렇게 하십시오
  alternatives_korean:
  - 강하고 행하십시오
  - 담대히 행하십시오
  lexicon: HALOT
  rationale: 두 명령형의 압축된 호소를 한국어에서 더 자연스럽게 전달하기 위해, 결단 촉구의 뉘앙스를 살린 관용적 표현으로 옮겼습니다.
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  english_pob_choice: and may Yahweh be with the good
  chosen_korean: 그러면 야훼께서 선한 사람과 함께하시기를 바랍니다
  alternatives_korean:
  - 야훼께서 선한 이와 함께하시기를 바랍니다
  - 야훼께서 선한 자와 함께 계시기를 바랍니다
  lexicon: HALOT
  rationale: הַטּוֹב는 단순한 추상명사 ‘선함’보다 사람을 가리키는 용례가 자연스러워, ‘선한 사람’으로 풀어 의미를 분명히 했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 여호와/주님의 전통적 대역이 아니라 본문 자체의 고유한 신명 표기를 드러내야 하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB contested terms: יהוה / YHWH → 야훼'
- issue: 마지막 축복문의 주체와 대상
  chosen_reading: 야훼께서 선한 사람과 함께하시기를 바랍니다
  alternative_readings:
  - 야훼께서 선한 이와 함께하시기를 바랍니다
  - 야훼께서 선한 자와 함께 계시기를 바랍니다
  rationale: 히브리어는 축복형 jussive로 읽히며, ‘the good’은 성품이 선한 사람을 가리키는 일반적 표현으로 이해하는 것이 무난합니다. 다만 추상화하지 않고 인격적 대상을 남겼습니다.
  doctrine_reference: 문맥상 축복/기도형 종결
