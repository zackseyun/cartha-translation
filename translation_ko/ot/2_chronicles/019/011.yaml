revisions:
- from: 보십시오, 아마랴는 대제사장으로서 여러분을 맡아 야훼의 모든 일에 관여하고, 이스마엘의 아들 스바댜는 유다 집의 지도자로서 왕의 모든 일에 관여합니다. 또한 레위 사람 관리들은 여러분 앞에 있습니다. 힘을 내어 그렇게 하십시오. 그러면 야훼께서 선한 사람과 함께하시기를 바랍니다.[a][b]
  to: 보십시오, 수석 제사장 아마랴가 야훼의 모든 사안에서 여러분을 감독하고, 이스마엘의 아들 스바댜가 유다 집의 지도자로서 왕의 모든 사안에서 여러분을 감독합니다. 레위 사람들은 여러분 앞에서 관리로 섬깁니다. 힘을 내어 행하십시오. 야훼께서 선한 이와 함께하시기를 바랍니다.[a]
  rationale: ‘수석 제사장’으로 כֹהֵן הָרֹאשׁ의 비기술적 위계 표현을 보존하고, 두 병렬 절에 ‘모든 사안에서 여러분을 감독합니다’를 적용하여 עֲלֵיכֶם 및 לְכֹל דְּבַר의 관할 관계를 명확히 했습니다. 레위 사람들은 שֹׁטְרִים의 직무와 לִפְנֵיכֶם의 보좌 관계를 살려 ‘여러분 앞에서 관리로 섬깁니다’로 옮겼습니다. 결말에서는 원문에 없는 조건 연결과 지시어를 제거하고 기원형을 독립적으로 번역했습니다.
  reviewer_model: gpt-5.6-terra
