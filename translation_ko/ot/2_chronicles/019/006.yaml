id: 2CH.19.6
reference: 2 Chronicles 19:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
  footnotes:
  - marker: a
    text: Or 'for humankind.' Hebrew 'for man' uses the singular אָדָם as a generic contrast to the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the matter of justice.' The Hebrew phrase can refer either to the act of judging or to judicial matters generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 재판관들에게 말했습니다. “여러분이 무엇을 하고 있는지 잘 살피십시오. 여러분은 사람을 위하여 재판하는 것이 아니라 야훼를 위하여 재판하는 것입니다. 그분은 재판할 때에 여러분과 함께 계십니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  english_pob_choice: the judges
  chosen_korean: 재판관들
  alternatives_korean:
  - 판사들
  - 심판하는 이들
  lexicon: HALOT
  rationale: 문맥상 임명된 사법 담당자를 가리키므로, 현대 한국어에서 법정 직무를 가장 자연스럽게 드러내는 ‘재판관들’을 택했습니다.
- source_word: רְאוּ
  english_pob_choice: See
  chosen_korean: 잘 보십시오
  alternatives_korean:
  - 보십시오
  - 살펴보십시오
  lexicon: HALOT
  rationale: 단순한 시각 행위가 아니라 자신들의 행위를 주의 깊게 점검하라는 촉구이므로, 명령의 강조를 살린 ‘잘 보십시오’로 옮겼습니다.
- source_word: לְאָדָם
  english_pob_choice: for man
  chosen_korean: 사람을 위해
  alternatives_korean:
  - 인간을 위해
  - 사람에게
  - 한 사람을 위해
  lexicon: HALOT
  rationale: 히브리어 단수 אָדָם의 일반적 대비를 유지하면서도 한국어에서 성별 표지를 덜 강하게 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를 위해
  alternatives_korean:
  - 주님을 위해
  - 여호와를 위해
  lexicon: HALOT
  rationale: 이 본문은 직접적으로 야훼의 이름을 사용하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
- source_word: בִּדְבַר מִשְׁפָּט
  english_pob_choice: in the matter of judgment
  chosen_korean: 재판의 일에서
  alternatives_korean:
  - 판결의 문제에서
  - 정의의 일에서
  - 재판의 문제에서
  lexicon: HALOT
  rationale: דבר의 ‘일/사안’과 משפט의 사법적 의미를 함께 살리면서, 문맥의 법정성을 자연스럽게 드러내는 표현으로 처리했습니다.
theological_decisions:
- issue: 여호와의 이름을 어떻게 옮길 것인가
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 히브리어 원문이 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 고유한 언약 이름을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘사람’과 ‘야훼’의 대비를 어떻게 살릴 것인가
  chosen_reading: 사람을 위해 / 야훼를 위해
  alternative_readings:
  - 인간을 위해 / 주님을 위해
  - 사람에게 / 야훼에게
  rationale: 본문의 핵심은 인간 법정이 아니라 야훼 앞에서 행하는 재판이라는 대비이므로, 두 대상을 평행 구조로 분명하게 드러냈습니다.
  doctrine_reference: Translation philosophy §4
