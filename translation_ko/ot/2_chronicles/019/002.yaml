id: 2CH.19.2
reference: 2 Chronicles 19:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א אֶל פָּנָ֗י/ו יֵה֣וּא בֶן חֲנָ֘נִי֮ הַ/חֹזֶה֒ וַ/יֹּ֨אמֶר֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹשָׁפָ֔ט הֲ/לָ/רָשָׁ֣ע לַ/עְזֹ֔ר וּ/לְ/שֹׂנְאֵ֥י יְהוָ֖ה תֶּאֱהָ֑ב וּ/בָ/זֹאת֙ עָלֶ֣י/ךָ קֶּ֔צֶף מִ/לִּ/פְנֵ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
  footnotes:
  - marker: a
    text: Or, more literally, 'went out before him.' The Hebrew idiom means 'went out to meet him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from the presence of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나니의 아들 예후, 곧 선견자가 그에게 나아와 여호사밧 왕에게 말했습니다. “악한 자를 돕고 야훼를 미워하는 자들을 사랑해서야 되겠습니까? 이 일로 말미암아 당신에게 야훼 앞에서 진노가 임합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구상 ‘그의 앞에 나가’라는 뜻입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘야훼의 앞에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֶל פָּנָיו
  english_pob_choice: went out to meet him
  chosen_korean: 그에게 나아와
  alternatives_korean:
  - 그의 앞에 나가
  - 그를 만나러 나아가
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자적으로는 ‘그의 얼굴/앞을 향해’이지만, 문맥상 대면하러 가는 동작이므로 자연스러운 ‘나아와’로 옮겼습니다.
- source_word: הַחֹזֶה
  english_pob_choice: the seer
  chosen_korean: 선견자
  alternatives_korean:
  - 예언자
  - 보는 자
  lexicon: HALOT
  rationale: חֹזֶה는 일반적 ‘예언자’보다 시각적 인식의 뉘앙스가 있는 호칭이므로, 그 구별을 살려 ‘선견자’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 개인명으로서 ‘야훼’로 옮겨, 호칭 대체를 피했습니다.
- source_word: מִלִּפְנֵי יְהוָה
  english_pob_choice: from the presence of Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 임재로부터
  - 야훼로부터
  lexicon: HALOT
  rationale: ‘מִלִּפְנֵי’의 직역감은 ‘앞에서/앞으로부터’에 가까우므로, 한글에서는 자연스럽게 ‘야훼 앞에서’로 처리해 원문의 공간적 이미지를 살렸습니다.
theological_decisions:
- issue: 신명(יהוה) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 이름을 직접 사용하므로, 전통적 호칭으로 대체하지 않고 고유명으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘악한 자’와 ‘야훼를 미워하는 자들’의 범위
  chosen_reading: 보편적 도덕 범주로 유지
  alternative_readings:
  - 아합을 직접 지칭하는 문구
  - 악한 왕
  rationale: 히브리어는 특정 인물을 이름으로 풀지 않고 도덕적 범주로 책망하므로, 그 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Never paraphrase beyond what the source text warrants'
