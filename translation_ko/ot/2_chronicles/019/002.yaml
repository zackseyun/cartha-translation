- from: 그때 하나니의 아들 예후, 곧 선견자가 그에게 나아와 여호사밧 왕에게 말했습니다. “악한 자를 돕고 야훼를 미워하는 자들을 사랑해서야 되겠습니까? 이 일로 말미암아 당신에게 야훼 앞에서 진노가 임합니다.”[a][b]
  to: 하나니의 아들 예후, 곧 선견자가 그에게 나아와[a] 여호사밧 왕에게 말했습니다. “악한 자를 돕고 야훼를 미워하는 자들을 사랑해서야 되겠습니까? 이 일 때문에 야훼의 앞에서 나온 진노가 당신에게 임했습니다.”[b]
  rationale: 불필요한 시간 부사를 삭제하고, 두 각주를 해당 어구 뒤로 옮겼습니다. 특히 ‘야훼의 앞에서 나온 진노’로 고쳐 진노가 야훼의 임재로부터 온다는 מִלִּפְנֵי의 의미를 자연스럽고 명확하게 나타냈습니다. ‘임했습니다’는 히브리어의 동사 없는 판정적 선언을 한국어의 완결된 경고 문장으로 옮긴 것입니다.
