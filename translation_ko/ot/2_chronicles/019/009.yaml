translation:
  language: ko
  text: 그는 그들에게 명령했습니다. “너희는 야훼를 경외하며[b], 신실함으로[c], 온전한 마음으로[d] 이렇게 행하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이렇게 하십시오.”
    reason: lexical_alternative
  - marker: b
    text: “야훼를 경외하며”는 “야훼에 대한 경외심으로”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “신실하게” 혹은 “성실함으로.”
    reason: lexical_alternative
  - marker: d
    text: 또는 “나뉘지 않은 마음으로.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם
  english_pob_choice: he commanded them
  chosen_korean: 그가 그들에게 명령하며
  alternatives_korean:
  - 그가 그들에게 명하고
  - 그가 그들을 명령하며
  lexicon: HALOT
  rationale: צוה는 권위를 가진 명령을 뜻하므로, 한국어에서는 자연스럽고 직접적인 ‘명령하다’를 택했습니다. `그들에게`는 עֲלֵיהֶם의 대상 표시를 간명하게 반영합니다.
- source_word: בְּיִרְאַת יְהוָה
  english_pob_choice: in the fear of Yahweh
  chosen_korean: 야훼를 경외하는 가운데
  alternatives_korean:
  - 야훼를 두려워하는 가운데
  - 야훼에 대한 경외심으로
  lexicon: HALOT
  rationale: יְרָאָה는 단순 공포보다 하나님 앞의 경외를 가리키므로, 관용구를 살려 ‘경외하는 가운데’로 옮겼습니다. 하나님의 이름은 원문 직역 원칙에 따라 ‘야훼’로 렌더링했습니다.
- source_word: בֶּאֱמוּנָה
  english_pob_choice: with faithfulness
  chosen_korean: 신실함으로
  alternatives_korean:
  - 성실함으로
  - 믿음으로
  - 충실함으로
  lexicon: HALOT
  rationale: 이 문맥의 אֱמוּנָה는 내면적 ‘믿음’보다 재판을 수행하는 데 필요한 신뢰성, 충실성을 뜻하므로 ‘신실함’이 가장 적절합니다.
- source_word: וּבְלֵבָב שָׁלֵם
  english_pob_choice: with a whole heart
  chosen_korean: 온전한 마음으로
  alternatives_korean:
  - 온전한 마음을 가지고
  - 한결같은 마음으로
  - 온전하고 나뉘지 않은 마음으로
  lexicon: HALOT
  rationale: לֵבָב שָׁלֵם은 분열되지 않은 전심, 완전한 내적 태도를 뜻하므로 한국어의 표준적이고 자연스러운 ‘온전한 마음’으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문의 יְהוָה는 이름 자체이므로, 본문에서는 관용적 대체어보다 음역형 ‘야훼’를 사용해 원문 신명성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘경외’의 뉘앙스
  chosen_reading: 야훼를 경외하는 가운데
  alternative_readings:
  - 야훼를 두려워하며
  - 야훼를 공경하며
  rationale: 재판 지침의 맥락에서 이 표현은 단순 공포가 아니라 하나님 앞에서의 경건한 두려움과 존중을 포함하므로, ‘경외’로 옮겨 신학적 무게를 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
