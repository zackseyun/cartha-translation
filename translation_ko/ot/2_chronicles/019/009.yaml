  naturalness: 현행 ‘명령하며 말했습니다’는 한국어에서 동작 연결이 다소 부자연스럽고, ‘명령했습니다’ 뒤의 직접 인용이 더 간결하고 현대적인 합쇼체 문장입니다. ‘야훼를 경외하며’는 ‘야훼를 경외하는 가운데’보다 자연스럽습니다.
