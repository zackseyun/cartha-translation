base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
  footnotes:
  - marker: a
    text: Hebrew 'between blood and blood,' likely referring to cases involving bloodshed or homicide.
    reason: lexical_alternative
translation:
  language: ko
  text: 여러분에게 성읍에 사는 여러분의 형제들에게서 모든 분쟁이 제기될 때, 곧 피와 피 사이의 사건[a], 율법과 계명 사이의 문제, 규례와 법도 사이의 문제일 때에는, 그들에게 경고하여 그들이 야훼께 죄책을 지지 않게 하십시오. 그렇지 않으면 진노가 여러분과 여러분의 형제들에게 내릴 것입니다. 이렇게 하십시오. 그러면 여러분은 죄책을 지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘피와 피 사이’이며, 유혈이나 살인과 관련된 사건을 가리키는 것으로 보입니다.
    reason: lexical_alternative
