revisions:
- from: 그리고 여러분에게 오는 모든 분쟁—곧 여러분의 형제들, 그들이 자기 성읍들에 거주하는 가운데 생기는 일들, 곧 피와 피 사이, 율법과 계명 사이, 규례들과 법도들 사이의 모든 일—에 대하여는 그들에게 경고하십시오. 그러면 그들이 야훼 앞에서 죄를 짓지 않을 것입니다. 그렇지 않으면 여러분과 여러분의 형제들에게 진노가 임할 것입니다. 이렇게 하십시오. 그러면 여러분은 죄를 짓지 않을 것입니다.[a]
  to: 여러분에게 성읍에 사는 여러분의 형제들에게서 모든 분쟁이 제기될 때, 곧 피와 피 사이의 사건[a], 율법과 계명 사이의 문제, 규례와 법도 사이의 문제일 때에는, 그들에게 경고하여 그들이 야훼께 죄책을 지지 않게 하십시오. 그렇지 않으면 진노가 여러분과 여러분의 형제들에게 내릴 것입니다. 이렇게 하십시오. 그러면 여러분은 죄책을 지지 않을 것입니다.
  rationale: 수식 관계를 원문에 맞게 바로잡고, 법률적 열거를 읽기 쉬운 병렬 구조로 정리했습니다. אשם의 반복은 ‘죄책을 지다’로 일관되게 옮겨 행위로서의 범죄와 그에 따른 유죄·책임 상태를 구별했습니다. ‘피와 피 사이’는 해석을 본문에 과도하게 넣지 않고 문자적으로 유지하며, 제한적인 설명을 각주로 제공했습니다.
