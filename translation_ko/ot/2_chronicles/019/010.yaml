theological_decisions:
- issue: 형제들(אֲחֵיכֶם)의 번역
  chosen_reading: 여러분의 형제들
  alternative_readings:
  - 여러분의 동족
  - 여러분의 동료 이스라엘 사람들
  rationale: 언약 공동체 구성원을 가리키는 친족 ভাষ를 중화하지 않고 직접 살리되, 문맥으로 공동체적 의미가 분명하도록 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: יהוה 앞에서 죄를 짓지 않게 함의 번역
  chosen_reading: 야훼 앞에서 죄를 짓지 않을 것입니다
  alternative_readings:
  - 야훼께 죄책을 지지 않을 것입니다
  - 야훼 앞에서 죄책을 지지 않을 것입니다
  rationale: אשׁם의 핵심인 ‘죄를 짓다/죄책을 지다’ 중, 문맥의 판결·경고 기능을 고려해 결과 상태를 자연스럽게 표현했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: אשׁם'
- issue: 진노(קֶצֶף)
  chosen_reading: 진노가 임할 것입니다
  alternative_readings:
  - 분노가 임할 것입니다
  - 격노가 임할 것입니다
  rationale: 언약적 심판의 무게를 살리기 위해 ‘진노’를 택해 하나님의 न्याय적 분노를 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
