base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
  footnotes:
  - marker: a
    text: Or 'returned and went out among the people'; the Hebrew repeats the verb 'return' before 'went out,' likely indicating that Jehoshaphat resumed this activity after returning to Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 여호사밧은 예루살렘에 살았고, 다시 백성 가운데로 나가 브엘세바에서부터 에브라임 산지까지 그들을 그들의 조상들의 하나님 야훼께로 돌아오게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다시 백성 가운데로 나가’는 히브리어의 ‘돌아가다’와 ‘나가다’의 연속을 자연스럽게 옮긴 것입니다.
    reason: korean_style_note
  - marker: b
    text: 야훼는 히브리어 하나님의 이름 יְהוָה의 음역입니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 살았고
  alternatives_korean:
  - 거주했고
  - 머물렀고
  lexicon: HALOT
  rationale: 문맥상 예루살렘에 정착해 거주했다는 뜻이므로, 현대 한국어에서는 자연스러운 ‘살다’로 옮기는 것이 적절합니다.
- source_word: וַיָּשָׁב וַיֵּצֵא בָעָם
  english_pob_choice: went out again among the people
  chosen_korean: 다시 백성 가운데로 나가
  alternatives_korean:
  - 다시 백성 가운데로 돌아가 나가
  - 백성에게로 나가
  lexicon: HALOT
  rationale: 히브리어의 ‘돌아가다’와 ‘나가다’의 연속은 활동의 재개를 나타내므로, ‘다시’로 그 뉘앙스를 살리고 ‘백성 가운데로’로 순회하며 다닌 의미를 반영했습니다.
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  english_pob_choice: from Beersheba to the hill country of Ephraim
  chosen_korean: 브엘세바에서부터 에브라임 산지까지
  alternatives_korean:
  - 브엘세바에서 에브라임의 산지까지
  - 브엘세바에서부터 에브라임 산지에 이르기까지
  lexicon: HALOT
  rationale: 남북 경계를 이루는 전형적 범위 표현이므로, 지리적 관용어인 ‘산지’를 사용해 원문의 포괄 범위를 자연스럽게 옮겼습니다.
- source_word: וַיְשִׁיבֵם אֶל יְהוָה אֱלֹהֵי אֲבוֹתֵיהֶם
  english_pob_choice: brought them back to Yahweh, the God of their fathers
  chosen_korean: 그들을 그들의 조상들의 하나님 야훼께로 돌아오게 했습니다
  alternatives_korean:
  - 그들을 야훼, 그들의 조상들의 하나님께로 돌아오게 했습니다
  - 그들을 그들의 조상들의 하나님 야훼께 돌아오게 했습니다
  lexicon: HALOT
  rationale: 히필의 שוב는 ‘돌아오게 하다’가 핵심이므로, 종교적 해석을 덧붙이지 않고 회복·귀환의 동사를 살렸습니다. ‘야훼’는 יְהוָה의 표준 음역을 따릅니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 신명기적 언약 이름을 직접 사용하므로, 본 프로젝트의 기본 원칙에 따라 ‘야훼’로 옮겨 고유성을 드러냈습니다.
  doctrine_reference: 'POB contested terms: יהוה / YHWH → 야훼'
