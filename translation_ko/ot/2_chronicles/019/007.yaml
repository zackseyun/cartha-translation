  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
  footnotes:
  - marker: a
    text: 'Hebrew: ''lifting up of faces,'' an idiom meaning showing favoritism or partiality.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제는 야훼를 경외하는 마음이 여러분 위에 있게 하십시오. 주의해서 행하십시오. 우리 하나님 야훼께는 불의도, 편파도, 뇌물 수수도 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 문자적으로는 ‘얼굴을 들어줌’이라는 관용구로, 사람을 보고 편을 드는 편파를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now then
  chosen_korean: 이제는
  alternatives_korean:
  - 그리고 이제
  - 이제
  lexicon: HALOT
  rationale: 문맥상 앞선 권고를 마무리하며 새 권면으로 전환하는 말이므로, 한국어에서는 자연스럽게 결론적 전환을 드러내는 ‘이제는’이 적절합니다.
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  english_pob_choice: let the fear of Yahweh be upon you
  chosen_korean: 야훼를 경외하는 마음이 여러분 위에 있게 하십시오
  alternatives_korean:
  - 야훼에 대한 두려움이 여러분 위에 있게 하십시오
  - 야훼를 두려워하는 마음이 여러분 위에 있게 하십시오
  lexicon: HALOT
  rationale: פַחַד는 단순 공포보다 경외를 포함할 수 있으므로 ‘경외하는 마음’으로 옮겼고, יְהִי의 권면형은 합쇼체 명령으로 처리했습니다.
- source_word: שִׁמְרוּ וַעֲשׂוּ
  english_pob_choice: Be careful and act
  chosen_korean: 주의해서 행하십시오
  alternatives_korean:
  - 조심하고 행하십시오
  - 살피고 행하십시오
  - 주의하여 행하십시오
  lexicon: HALOT
  rationale: 법정적 권면에서 두 동사는 주의 깊은 실행을 함께 요구하므로, 한국어에서는 의미를 보존하면서도 자연스러운 하나의 권면 표현으로 압축했습니다.
- source_word: עַוְלָה
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 부정
  - 불공정
  - 부당함
  lexicon: HALOT
  rationale: 재판 맥락에서 עַוְלָה는 도덕적·사법적 불의를 가리키므로, 성경적·공적 문맥에 모두 잘 맞는 ‘불의’를 선택했습니다.
- source_word: מַשֹּׂא פָנִים
  english_pob_choice: partiality
  chosen_korean: 편파
  alternatives_korean:
  - 편애
  - 사람을 보아줌
  - 낯을 들어줌
  lexicon: HALOT
  rationale: 직역인 ‘얼굴을 들어줌’은 한국어에서 관용성이 약하므로, 인물의 지위나 면모에 따라 치우치는 의미를 간결하게 드러내는 ‘편파’를 택했습니다.
- source_word: מִקַּח שֹׁחַד
  english_pob_choice: taking of a bribe
  chosen_korean: 뇌물 수수
  alternatives_korean:
  - 뇌물을 받는 일
  - 뇌물 받음
  - 뇌물 취득
  lexicon: HALOT
  rationale: 명사구는 뇌물을 ‘받는 행위’를 뜻하므로, 현대 한국어에서 가장 명료한 법률·윤리 용어인 ‘뇌물 수수’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 칭호 ‘주’로 대체하지 않고 학술 음역인 ‘야훼’로 유지해 원문의 고유한 신명성을 드러냈습니다.
theological_decisions:
