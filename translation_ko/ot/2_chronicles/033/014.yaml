  rationale: 본문은 왕의 공사와 배치를 기록하는 서술문이므로, 의미를 과장하거나 해석을 본문 안에 끼워 넣지 않는 것이 원문 의도에 충실합니다.
  doctrine_reference: 성경의 역사 서술은 사건 자체를 증언하도록 읽어야 함
