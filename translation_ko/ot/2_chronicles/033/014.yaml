id: 2CH.33.14
reference: 2 Chronicles 33:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֡ן בָּנָ֣ה חוֹמָ֣ה חִֽיצוֹנָ֣ה לְ/עִיר דָּוִ֡יד מַעְרָבָ/ה֩ לְ/גִיח֨וֹן בַּ/נַּ֜חַל וְ/לָ/ב֨וֹא בְ/שַׁ֤עַר הַ/דָּגִים֙ וְ/סָבַ֣ב לָ/עֹ֔פֶל וַ/יַּגְבִּיהֶ֖/הָ מְאֹ֑ד וַ/יָּ֧שֶׂם שָֽׂרֵי חַ֛יִל בְּ/כָל הֶ/עָרִ֥ים הַ/בְּצֻר֖וֹת בִּ/יהוּדָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
  footnotes:
  - marker: a
    text: Or 'and to the entrance of the Fish Gate.' The Hebrew expression may be read as marking the wall's extent toward that gate.
    reason: lexical_alternative
  - marker: b
    text: '''Ophel'' is a place-name in Jerusalem, likely the raised area south of the temple mount.'
    reason: cultural_note
  - marker: c
    text: Or 'encircled Ophel.' The Hebrew verb can emphasize surrounding rather than simply going around.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일 후에 그는 다윗 성을 위한 바깥 성벽을 지었는데, 기혼 서쪽 골짜기에서 물고기 문 입구까지 이르렀으며, 오펠을 둘러가며 그 성벽을 매우 높였습니다. 또 유다의 모든 요새 성읍들에 군사 지휘관들을 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오펠’은 예루살렘의 지명으로, 성전 산 남쪽의 높아진 구역을 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 성벽이 오펠을 ‘둘러갔다’는 뜻으로도, ‘오펠을 둘러쌌다’는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 그 후에
  - 이후에
  lexicon: HALOT
  rationale: 시간 순서를 자연스럽게 이어 주는 표현으로, 문맥상 앞선 사건 이후를 가리킵니다.
- source_word: חוֹמָה חִיצוֹנָה
  english_pob_choice: an outer wall
  chosen_korean: 바깥 성벽
  alternatives_korean:
  - 외벽
  - 밖 성벽
  lexicon: HALOT
  rationale: חִיצוֹנָה가 성벽의 외곽성을 나타내므로, 한국어에서도 성읍 방어 구조를 드러내는 바깥 성벽이 가장 자연스럽습니다.
- source_word: וְסָבַב לָעֹפֶל
  english_pob_choice: he went around Ophel
  chosen_korean: 오펠을 둘러가며
  alternatives_korean:
  - 오펠을 둘러싸며
  - 오펠을 돌아
  lexicon: HALOT
  rationale: 주어는 성벽이므로, 동작의 주체를 벽으로 드러내면서도 סבב의 '둘러가다/둘러싸다' 의미를 살렸습니다.
- source_word: שָׂרֵי חַיִל
  english_pob_choice: military commanders
  chosen_korean: 군사 지휘관들
  alternatives_korean:
  - 군 지휘관들
  - 무장한 지휘관들
  lexicon: HALOT
  rationale: 군사적 기능을 분명하게 보여 주되, 고어체 '장관/두령'류를 피하고 현대적인 관직 명칭으로 옮겼습니다.
theological_decisions:
