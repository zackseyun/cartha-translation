- from: 이 일 후에 그는 다윗 성을 위한 바깥 성벽을 지었는데, 기혼 서쪽 골짜기에서 물고기 문 입구까지 이르렀으며, 오펠을 둘러가며 그 성벽을 매우 높였습니다. 또 유다의 모든 요새 성읍들에 군사 지휘관들을 두었습니다.[a][b]
  to: 그 후에 그는 다윗 성을 위한 바깥 성벽을 세웠습니다. 그 성벽은 골짜기에 있는 기혼의 서쪽에서 물고기 문 입구까지 이르렀고, 오펠[a] 주위로 성벽을 두르고[b] 매우 높이 세웠습니다. 또 그는 유다의 요새화된 모든 성읍에 군사 지휘관들을 배치했습니다.
