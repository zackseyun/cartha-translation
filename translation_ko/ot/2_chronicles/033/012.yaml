source:
  edition: WLC
  text: וּ/כְ/הָצֵ֣ר ל֔/וֹ חִלָּ֕ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יִּכָּנַ֣ע מְאֹ֔ד מִ/לִּ/פְנֵ֖י אֱלֹהֵ֥י אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/012.yaml
  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
  footnotes:
  - marker: a
    text: Or, 'implored the LORD his God' or 'entreated the LORD his God'; the Hebrew idiom is literally 'softened/appeased the face of.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the God of his fathers'; 'ancestors' is a possible inclusive rendering, but the main text keeps the masculine form present in the source.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 고통 속에 있을 때에는 야훼 그의 하나님께 은혜를 구하고, 그의 조상들의 하나님 앞에서 크게 자신을 낮추었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘얼굴을 부드럽게 하다/달래다’라는 뜻이지만, 여기서는 ‘간구하다/은혜를 구하다’의 의미입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조상들’은 히브리어의 남성 복수 표현을 따라간 번역입니다. 문맥상 ‘선조들’도 가능하지만, 본문은 남성형을 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  english_pob_choice: And when he was in distress
  chosen_korean: 그가 고통 속에 있을 때에는
  alternatives_korean:
  - 그가 곤경에 처했을 때에는
  - 그가 환난 가운데 있을 때에는
  lexicon: HALOT
  rationale: 시간적 상황을 나타내는 표현으로 이해해 한국어에서는 자연스러운 ‘~할 때’ 구조로 옮기고, צר의 압박·곤란 감각은 ‘고통 속에’로 살렸습니다.
- source_word: חִלָּה אֶת פְּנֵי
  english_pob_choice: sought the favor of
  chosen_korean: 은혜를 구하고
  alternatives_korean:
  - 간청하고
  - 호소하고
  - 얼굴을 부드럽게 하여
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 어색하므로, ‘간구하여 호의를 얻다’의 뜻을 한국어로 자연스럽게 풀어 ‘은혜를 구하다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문에 직접 나온 신명사 tetragrammaton을 전통적 대체어가 아니라 음역형 ‘야훼’로 반영하여 본문 고유의 이름을 보존했습니다.
- source_word: מִלִּפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 면전에서
  - 존전에서
  lexicon: HALOT
  rationale: ‘~의 얼굴 앞에서’라는 관용적 전치 표현을 현대 한국어에서 가장 자연스럽게 전달하는 ‘앞에서’로 옮겼습니다.
theological_decisions:
- issue: 아버지들의 하나님을 성중립화할지 여부
  chosen_reading: ‘그의 조상들의 하나님’ 대신 히브리어의 남성 복수 표현을 유지하여 ‘그의 조상들의 하나님’으로 번역했습니다.
  alternative_readings:
  - 그의 조상들의 하나님
  - 그의 선조들의 하나님
  rationale: 히브리어가 ‘아버지들’(אֱלֹהֵי אֲבֹתָיו)이라고 분명히 말하므로, 본문의 역사·언약적 표현을 희석하지 않기 위해 성중립화하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: מְאֹד의 강도 표현
  chosen_reading: ‘크게 자신을 낮추었습니다’로 humility의 강도를 분명히 드러냈습니다.
  alternative_readings:
  - 매우 자신을 낮추었습니다
  - 지극히 자신을 낮추었습니다
  rationale: מְאֹד는 단순한 정도 부사가 아니라 겸손의 강도를 증폭하므로, 한국어에서도 동작 전체를 강하게 수식하는 표현을 택했습니다.
  doctrine_reference: HALOT
