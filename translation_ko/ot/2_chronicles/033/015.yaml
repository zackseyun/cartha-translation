id: 2CH.33.15
reference: 2 Chronicles 33:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יָּסַר אֶת אֱלֹהֵ֨י הַ/נֵּכָ֤ר וְ/אֶת הַ/סֶּ֨מֶל֙ מִ/בֵּ֣ית יְהוָ֔ה וְ/כָל הַֽ/מִּזְבְּח֗וֹת אֲשֶׁ֥ר בָּנָ֛ה בְּ/הַ֥ר בֵּית יְהוָ֖ה וּ/בִ/ירוּשָׁלִָ֑ם וַ/יַּשְׁלֵ֖ךְ ח֥וּצָ/ה לָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
  footnotes:
  - marker: a
    text: Or 'the image.' The Hebrew סֶמֶל can denote an idol or cult image.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the hill of the house of the LORD'; that is, the temple mount.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이방의 신들과 우상[a]을 야훼의 집에서 제거하고, 야훼의 집 산[b]과 예루살렘에 그가 세운 모든 제단도 제거한 뒤, 그것들을 성 밖으로 내던졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형상’. 히브리어 סֶמֶל은 우상이나 제의적 형상을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 집 산 위에’, 곧 성전 산입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  english_pob_choice: He removed
  chosen_korean: 치워 버리고
  alternatives_korean:
  - 제거하고
  - 옮겨 버리고
  - 없애고
  lexicon: HALOT
  rationale: 문맥상 우상 숭배의 대상들을 예배 공간에서 강제로 없애는 행위이므로, 단순한 이동보다 단호한 제거를 드러내는 표현을 택했습니다.
- source_word: אֱלֹהֵי הַנֵּכָר
  english_pob_choice: the foreign gods
  chosen_korean: 이방의 신들
  alternatives_korean:
  - 외국의 신들
  - 낯선 신들
  lexicon: HALOT
  rationale: 히브리어의 ‘낯선/이방의’ 뉘앙스를 한국어 성경 문맥에서 자연스럽게 옮기되, 야훼 신앙 밖의 신들을 가리키는 의미를 분명히 했습니다.
- source_word: הַסֶּמֶל
  english_pob_choice: the idol
  chosen_korean: 우상
  alternatives_korean:
  - 형상
  - 조각상
  lexicon: HALOT
  rationale: POB가 각주에서 ‘image’ 가능성을 열어 두었지만, 본문에서는 제의적이고 비판적인 대상이라는 점을 가장 직접적으로 드러내는 ‘우상’이 적절합니다.
- source_word: בְּהַר בֵּית יְהוָה
  english_pob_choice: on the mountain of the house of the LORD
  chosen_korean: 야훼의 집 산에
  alternatives_korean:
  - 야훼의 집 언덕에
  - 성전 산에
  lexicon: HALOT
  rationale: 히브리어의 ‘산/언덕’ 표현을 그대로 살려 POB의 투명성을 유지했습니다. ‘성전 산’은 의미는 분명하지만 해석을 한 단계 더 넣는 표현입니다.
theological_decisions:
- issue: 예루살렘과 성전 관련 장소를 어떻게 드러낼 것인가
  chosen_reading: ‘야훼의 집’과 ‘야훼의 집 산’이라는 히브리어 표현을 유지했습니다.
  alternative_readings:
  - ‘성전’으로 통일
  - ‘성전 산’으로 풀어 번역
  rationale: 본문은 단순한 건물명보다 예배 장소의 성격과 지리적 범위를 함께 보여 줍니다. 따라서 독자가 원문 구조를 따라가도록 ‘야훼의 집’ 표현을 보존했습니다.
  doctrine_reference: Source transparency / temple-mount reference
- issue: 야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 יְהוָה를 직접 사용하므로, POB 원칙에 따라 고유 이름을 유지했습니다. ‘주님’은 칭호로 바뀌어 원문 식별성이 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
