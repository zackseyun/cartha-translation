source:
  edition: WLC
  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הַ/סֶּ֖מֶל אֲשֶׁ֣ר עָשָׂ֑ה בְּ/בֵ֣ית הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר אָמַ֤ר אֱלֹהִים֙ אֶל דָּוִיד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִֽ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עֵילֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
  footnotes:
  - marker: a
    text: Or, 'the carved image of the idol'; the Hebrew uses two closely related terms for an idol statue.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기가 만든 새긴 형상, 곧 우상[a]을 하나님의 집에 두었습니다. 하나님께서는 그 집에 관하여 다윗과 그의 아들 솔로몬에게 말씀하셨습니다. “내가 이스라엘의 모든 지파 가운데서 택한 이 집과 예루살렘에 내 이름을 영원히 두겠다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우상의 새긴 형상’. 히브리어는 우상 형상을 가리키는 서로 밀접한 두 용어를 함께 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: He put
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 두어 놓았습니다
  lexicon: HALOT
  rationale: 서술 동작을 자연스럽게 전하면서도 뒤의 우상 배치를 분명히 드러내기 위해 ‘두었습니다’로 옮겼습니다.
- source_word: פֶּסֶל הַסֶּמֶל
  english_pob_choice: the carved image, the idol
  chosen_korean: 우상 형상, 곧 새긴 우상
  alternatives_korean:
  - 새긴 형상, 우상
  - 조각한 형상, 우상
  lexicon: HALOT
  rationale: 두 명사를 겹쳐 쓴 히브리어의 강한 중첩을 살리기 위해 ‘우상 형상’과 ‘새긴 우상’을 병렬로 옮겼습니다. ‘곧’은 두 표현이 같은 대상을 가리킨다는 점을 드러냅니다.
- source_word: בְּבֵית הָאֱלֹהִים
  english_pob_choice: in the house of God
  chosen_korean: 하나님의 집에
  alternatives_korean:
  - 하나님의 성전에
  - 하나님 집에
  lexicon: HALOT
  rationale: 본문의 בית 이미지를 유지하기 위해 ‘집’을 살렸고, 제의적 맥락은 문맥상 자연스럽게 전달된다고 보았습니다.
- source_word: אָשִׂים אֶת שְׁמִי
  english_pob_choice: I will put my name
  chosen_korean: 내 이름을 … 두겠다
  alternatives_korean:
  - 내 이름을 … 두리라
  - 내 이름을 … 두겠습니다
  lexicon: HALOT
  rationale: ‘이름을 두다’라는 언약적 관용구를 풀어쓰지 않고 보존했습니다. 한국어에서도 하나님의 임재/표지를 함축하는 직역성이 살아 있습니다.
- source_word: לְעֵילֹום
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 영원토록
  lexicon: HALOT
  rationale: 언약적 지속성을 가장 자연스럽고 표준적으로 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: יהוה가 아니라 אֱלֹהִים이 사용된 신명 호칭
  chosen_reading: 모두 ‘하나님’으로 옮기고, 이 절에는 야훼를 도입하지 않았습니다.
  alternative_readings:
  - 여호와
  - 야훼
  rationale: 본문 히브리어는 יְהוָה가 아니라 אֱלֹהִים을 사용하므로, 하나님으로 유지해 본문 자체의 호칭을 보존했습니다.
  doctrine_reference: 'Contested terms table: יְהוָה rendered ''the LORD'' when present'
- issue: 성전/집, 그리고 이름을 두는 언약적 진술
  chosen_reading: ‘내 이름을 영원히 두겠다’로 직역하여 신학적 의미를 유지했습니다.
  alternative_readings:
  - 내 이름이 영원히 거기 거하게 하겠다
  - 내 이름을 영원히 세우겠다
  rationale: 하나님의 ‘이름을 두다’라는 성경적 관용구를 설명적으로 바꾸면 본문이 지닌 표지/임재의 함축이 약해지므로, 가능한 한 원문 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
