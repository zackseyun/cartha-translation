base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'for all the heavenly host.' The Hebrew expression refers to the celestial host worshiped in astral religion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 여호와의 집 안 두 뜰에 하늘의 모든 군대를 위하여 제단들을 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 천군을 위하여’. 이 히브리어 표현은 별과 천체를 숭배하던 천상 무리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבְּחֹות
  english_pob_choice: altars
  chosen_korean: 제단들을
  alternatives_korean:
  - 제단
  - 번제단들
  lexicon: HALOT
  rationale: מִזְבֵּחַ의 복수형을 자연스럽고 직접적으로 옮겼습니다. 문맥상 우상숭배용 제단이므로 일반적인 교회 용어보다 중립적인 ‘제단들’이 원문에 가깝습니다.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  english_pob_choice: for all the host of heaven
  chosen_korean: 하늘의 모든 군대를 위하여
  alternatives_korean:
  - 하늘의 모든 군대에게
  - 하늘의 모든 천군을 위하여
  lexicon: HALOT
  rationale: צְבָא הַשָּׁמַיִם의 관용적 의미를 살리되, 한국어에서는 ‘군대’가 천체/천상 존재의 무리를 가장 직접적으로 드러냅니다. ‘위하여’는 제단을 그 존재들을 향해/그들을 위해 세웠다는 헌신의 방향을 반영합니다.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  english_pob_choice: in the two courts
  chosen_korean: 두 뜰 안에
  alternatives_korean:
  - 두 뜰에
  - 두 뜰 가운데
  lexicon: HALOT
  rationale: 성전 문맥의 חַצְרוֹת는 ‘뜰’이 가장 자연스럽고, ‘두’의 수량 정보를 분명히 드러내기 위해 ‘두 뜰’로 옮겼습니다. 위치 전치사 בְּ는 한국어에서 자연스럽게 ‘안에’로 풀었습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 야훼의 집
  - 여호와의 성전
  lexicon: HALOT
  rationale: 원문의 בית יהוה를 직역해 ‘집’으로 유지했습니다. 본 문맥은 성전 전체를 가리키지만, 원문 표현을 보존하는 것이 해석을 덜 개입시키는 방식입니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주
  rationale: 제공된 영문 POB 감사본이 이 절에서 divine name을 Yahweh로 표기하고 있으나, 현재 한국어 초안에서는 기존 교회 용례와의 가독성을 고려해 ‘여호와’를 사용했습니다. 다만 문맥상 원문은 분명히 여호와의 이름을 지칭합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
