  lexicon: HALOT
  rationale: 문맥상 기도에 대한 favorable response를 가리키므로, 주어를 덧붙이지 않으면서도 수동적 결과를 드러내는 표현으로 옮겼습니다.
- source_word: מַעְלוֹ
  english_pob_choice: his unfaithfulness
  chosen_korean: 그의 불신실함
  alternatives_korean:
