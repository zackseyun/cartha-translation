  text: וּ/תְפִלָּת֣/וֹ וְ/הֵֽעָתֶר ל/וֹ֮ וְ/כָל חַטָּאת֣/וֹ וּ/מַעְל/וֹ֒ וְ/הַ/מְּקֹמ֗וֹת אֲשֶׁר֩ בָּנָ֨ה בָ/הֶ֤ם בָּמוֹת֙ וְ/הֶעֱמִיד֙ הָ/אֲשֵׁרִ֣ים וְ/הַ/פְּסִלִ֔ים לִ/פְנֵ֖י הִכָּנְע֑/וֹ הִנָּ֣/ם כְּתוּבִ֔ים עַ֖ל דִּבְרֵ֥י חוֹזָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
  footnotes:
  - marker: a
    text: Or 'the Asherah poles.' The Hebrew term may refer to cultic objects associated with Asherah.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the words of Hozai.' The final phrase may preserve a proper name rather than mean 'the seers.'
    reason: alternative_reading
translation:
  language: ko
  text: 그의 기도[a], 그가 응답을 받은 일, 그의 모든 죄와 그의 불신실함, 그리고 그가 산 산당들과 아세라 목상들과 새긴 우상들을 세운 곳들—그가 스스로 낮아지기 전에 한 일들이니—보십시오[b], 그것들은 선견자들의 기록에 적혀 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아세라 목상들’. 히브리어 용어는 아세라와 관련된 제의적 물건을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘호자이의 말들’일 수 있습니다. 마지막 구절은 ‘선견자들’이 아니라 고유명사 ‘호자이’를 보존한 표현일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  english_pob_choice: his prayer
  chosen_korean: 그의 기도
  alternatives_korean:
  - 그의 간구
  - 그의 기원
  lexicon: HALOT
  rationale: תְּפִלָּה의 기본적이고 가장 자연스러운 현대어 대응은 ‘기도’이므로 이를 따랐습니다.
- source_word: הֵעָתֶר לוֹ
  english_pob_choice: how he was entreated
  chosen_korean: 그가 응답을 받은 일
  alternatives_korean:
  - 그가 응답받은 일
  - 그가 들으심을 받은 일
  - 그에게 호의를 입은 일
  lexicon: HALOT
  rationale: 문맥상 기도에 대한 favorable response를 가리키므로, 주어를 덧붙이지 않으면서도 수동적 결과를 드러내는 표현으로 옮겼습니다.
- source_word: מַעְלוֹ
  english_pob_choice: his unfaithfulness
  chosen_korean: 그의 불신실함
  alternatives_korean:
  - 그의 배신
  - 그의 범죄
  - 그의 불충실함
  lexicon: HALOT
  rationale: מעל의 언약적 뉘앙스를 살리기 위해 단순한 ‘죄’보다 관계 파괴의 의미가 드러나는 ‘불신실함’을 택했습니다.
- source_word: הָאֲשֵׁרִים
  english_pob_choice: the Asherim
  chosen_korean: 아세라 목상들
  alternatives_korean:
  - 아세라들
  - 아세라 상들
  - 아세라 기둥들
  lexicon: HALOT
  rationale: 이 용례는 아세라와 관련된 제의적 물건을 가리킬 가능성이 크므로, 본문에서는 기능을 드러내는 ‘목상들’을 쓰고, 용어의 불확실성은 footnote로 남겼습니다.
- source_word: הַפְּסִלִים
  english_pob_choice: the carved images
  chosen_korean: 새긴 우상들
  alternatives_korean:
  - 새긴 형상들
  - 조각한 우상들
  - 조각상들
  lexicon: HALOT
  rationale: פסילים의 구체적 조형성과 우상적 기능을 함께 살리기 위해 ‘새긴 우상들’로 옮겼습니다.
- source_word: לִפְנֵי הִכָּנְעוֹ
  english_pob_choice: before he humbled himself
  chosen_korean: 그가 스스로 낮아지기 전에
  alternatives_korean:
  - 그가 겸손해지기 전에
  - 그가 낮아지기 전에
  - 그가 낮추어지기 전에
  lexicon: HALOT
  rationale: 히트파엘/반사적 의미를 반영해 수동적으로 풀지 않고, 회개의 주체성을 드러내는 ‘스스로 낮아지다’로 번역했습니다.
- source_word: עַל דִּבְרֵי חוֹזָי
  english_pob_choice: in the records of the seers
  chosen_korean: 선견자들의 기록
  alternatives_korean:
  - 호자이의 말들
  - 선견자 호자이의 기록
  - 선견자들의 말
  lexicon: HALOT
  rationale: POB의 본문 채택을 따라 ‘선견자들’로 옮겨 역사 기록체의 의미를 살렸고, 고유명사 가능성은 각주로 보존했습니다.
theological_decisions:
- issue: 아세라(Asherim)와 기록처의 모호성 보존
  chosen_reading: 본문에는 의미가 분명한 ‘아세라 목상들’과 ‘선견자들의 기록’을 두되, 각주로 대안 독법을 남깁니다.
  alternative_readings:
  - 아세라 상들 / 아세라 기둥들
  - 호자이의 말들
  rationale: 원문과 POB 주석이 인정하는 어휘적 긴장을 풀어버리지 않기 위해, 본문은 읽기 쉬운 표현을 채택하되 대안 독법을 각주로 보존했습니다.
  doctrine_reference: 보존된 본문 긴장과 주해적 겸손
