  source_fidelity: 현 초안의 ‘그가 산 산당들’은 히브리어 בָּנָה(‘세웠다/지었다’)를 ‘샀다’로 잘못 옮긴 것으로, 안전한 수정이 필요합니다. 또한 הֵעָתֶר לוֹ는 기도에 대한 호의적인 응답, 곧 그의 기도가 받아들여진 일을 가리키므로 이를 자연스럽고 비확정적으로 반영했습니다. הָאֲשֵׁרִים은 본문에서 음역하여 대상의 형태를 단정하지 않았고, חוֹזָי의 고유명사 가능성은 각주에 보존했습니다.
  naturalness: 수정문은 히브리어의 열거 구조와 ‘그가 스스로 낮아지기 전에’라는 시간 관계를 유지하면서, 현대 표준 한국어 합쇼체로 자연스럽게 읽히도록 다듬었습니다. ‘보십시오’는 הִנָּם의 제시 기능을 살립니다.
  terminology: ‘산당’, ‘아세라’, ‘새긴 형상’, ‘선견자’는 성서 번역에서 통용되는 표현입니다. ‘아세라 목상들’은 불확실한 물질적 형태를 단정할 수 있으므로 본문이 아니라 각주 대안으로 처리했습니다. פסילים은 ‘새긴 형상들’로 옮겨 조각된 형상이라는 어휘 의미를 보존했습니다.
