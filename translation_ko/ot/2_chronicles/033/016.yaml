  rationale: אמר + ל의 기본값인 '말하다'를 유지하되, 한국어에서는 간결하게 '말했습니다'로 옮겨 원문의 직접 화법을 자연스럽게 전달했습니다.
- source_word: לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל
  english_pob_choice: to serve Yahweh, the God of Israel
  chosen_korean: 이스라엘의 하나님 야훼를 섬기라고
