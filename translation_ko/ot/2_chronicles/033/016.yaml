  text: 그는 야훼의 제단을 복원하고, 그 위에 화목제 희생제물[a]과 감사 제물[b]을 드렸습니다. 그리고 유다에게 이스라엘의 하나님이신 야훼를 섬기라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
