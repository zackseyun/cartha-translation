base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
  footnotes:
  - marker: a
    text: Or 'peace offerings'; alternatively, some render 'fellowship offerings.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'thanksgiving'; that is, thanksgiving offerings in this sacrificial context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 제단을 복원하고, 그 위에 화목제의 제사와 감사의 제사를 드렸습니다. 그리고 유다에게 이스라엘의 하나님 야훼를 섬기라고 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화제’; 문맥상 ‘교제제’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘감사’이며, 이 제의 문맥에서는 ‘감사의 제사’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
