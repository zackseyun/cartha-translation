base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 눈에 악한 일을 행하여, 야훼께서 이스라엘 자손 앞에서 쫓아내신 민족들의 가증한 일들처럼 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 사람들’로 풀어 쓸 수도 있지만, 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악한 일을 행하여
  alternatives_korean:
  - 악을 행하여
  - 악한 일을 하여
  lexicon: HALOT
  rationale: עשה + הָרַע의 관용적 결합을 한국어로 자연스럽게 살리되, 행위의 도덕적 평가를 분명히 드러내기 위해 ‘악한 일을 행하다’로 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 평가적 관용구를 직역에 가깝게 유지하여, 단순한 ‘악함’이 아니라 야훼의 판단 기준 앞에서의 악이라는 뜻을 보존했습니다.
- source_word: כְּתוֹעֲבוֹת הַגּוֹיִם
  english_pob_choice: according to the abominations of the nations
  chosen_korean: 민족들의 가증한 일들처럼
  alternatives_korean:
  - 민족들의 가증한 관행들처럼
  - 나라들의 가증한 일들에 따라
  lexicon: HALOT
  rationale: תועבות의 강한 종교·도덕적 혐오감을 ‘가증한 일들’로 살리고, כְּ의 비교·준거 의미를 ‘처럼’으로 자연스럽게 표현했습니다.
- source_word: הוֹרִישׁ מִפְּנֵי
  english_pob_choice: had driven out before
  chosen_korean: 앞에서 쫓아내신
  alternatives_korean:
  - 앞에서 몰아내신
  - ~의 앞에서 내쫓으신
  lexicon: HALOT
  rationale: הוריש의 추방/축출 의미를 ‘쫓아내다’로 옮기고, מִפְּנֵי를 ‘앞에서’로 처리하여, 이전 민족들이 이스라엘 앞에서 제거되었다는 역사적 맥락을 유지했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 표현을 직역에 가깝게 보존해, 영어 POB의 ‘the sons of Israel’과 같은 형태적 정보를 한국어에서도 유지했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 고유명사 ‘야훼’를 본문에 직접 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 יְהוָה가 직접 나오므로, POB 원칙에 따라 하나님의 언약적 이름을 호칭/호칭대체어가 아니라 고유명사로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 이스라엘 자손의 성별 표지 보존
  chosen_reading: ‘이스라엘 자손’을 유지했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문은 בְּנֵי יִשְׂרָאֵל의 남성·친족 표지를 지니므로, 이를 평준화하지 않고 소스의 형태를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
