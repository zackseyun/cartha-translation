  text: Now the rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
  footnotes:
  - marker: a
    text: Or 'in the book/annals of the kings of Israel.' The Hebrew citation formula refers to a written royal source.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 므낫세의 나머지 행적과 그의 하나님께 드린 기도, 그리고 그에게 야훼, 곧 이스라엘의 하나님이라는 이름으로 말한 선견자들의 말씀이 보십시오, 이스라엘 왕들의 기록들 가운데에 적혀 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문서 공식은 문자적으로는 ‘기록들/말들’이지만, 왕실 연대기 자료를 가리키는 관용 표현입니다.
    reason: source_note
lexical_decisions:
