  to: 므낫세의 나머지 행적과 그가 자기 하나님께 드린 기도와 야훼, 곧 이스라엘의 하나님의 이름으로 그에게 말한 선견자들의 말은, 보십시오, 이스라엘 왕들의 기록에 적혀 있습니다.[a]
