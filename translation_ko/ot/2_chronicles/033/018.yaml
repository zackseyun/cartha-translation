base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: Now the rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
  footnotes:
  - marker: a
    text: Or 'in the book/annals of the kings of Israel.' The Hebrew citation formula refers to a written royal source.
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세의 나머지 행적과 그가 자기 하나님께 드린 기도와 야훼, 곧 이스라엘의 하나님의 이름으로 그에게 말한 선견자들의 말은, 보십시오, 이스라엘 왕들의 기록에 적혀 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 왕들의 기록’은 왕들의 행적을 기록한 왕실 연대기 자료를 가리키는 문헌 인용 공식입니다. 히브리어 본문은 ‘이스라엘’을 읽습니다.
    reason: source_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  english_pob_choice: the rest of the acts
  chosen_korean: 나머지 행적
  alternatives_korean:
  - 그 나머지 일들
  - 남은 행적
  - 그 밖의 행적
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 ‘말’보다 왕의 업적·사건을 가리키므로, 역사 서술에 맞는 ‘행적’으로 옮겼습니다.
- source_word: תְפִלָּתוֹ אֶל אֱלֹהָיו
  english_pob_choice: his prayer to his God
  chosen_korean: 그의 하나님께 드린 기도
  alternatives_korean:
  - 그의 하나님께 드린 그의 기도
  - 하나님께 드린 기도
  lexicon: HALOT
  rationale: 소유격과 მიმართող 방향을 살리되 한국어에서는 자연스럽게 ‘드린 기도’로 표현했습니다.
- source_word: הַחֹזִים
  english_pob_choice: the seers
  chosen_korean: 선견자들
  alternatives_korean:
  - 선지자들
  - 예언자들
  lexicon: HALOT
  rationale: 히브리어 고유의 예언자 호칭을 보존하기 위해 일반적인 ‘선지자’보다 직역성이 있는 ‘선견자들’을 택했습니다.
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: in the name of Yahweh, the God of Israel
  chosen_korean: 야훼, 곧 이스라엘의 하나님이라는 이름으로
  alternatives_korean:
  - 야훼, 이스라엘의 하나님의 이름으로
  - 야훼 곧 이스라엘의 하나님 이름으로
  lexicon: HALOT
  rationale: בְּשֵׁם은 단순한 출처 표시가 아니라 권위에 따른 발화를 나타내므로 ‘이름으로’로 옮기고, יְהוָה는 본 지침에 따라 ‘야훼’로 렌더링했습니다.
- source_word: הִנָּם
  english_pob_choice: behold, they are
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 그것들은
  lexicon: HALOT
  rationale: 문서 인용을 강조하는 감탄적 지시어의 기능을 한국어에서 자연스럽게 살려 주의를 환기하는 표현으로 옮겼습니다.
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  english_pob_choice: among the records of the kings of Israel
  chosen_korean: 이스라엘 왕들의 기록들 가운데에
  alternatives_korean:
  - 이스라엘 왕들의 기록 속에
  - 이스라엘 왕들의 연대기 가운데
  lexicon: HALOT
  rationale: עַל의 문서 참조 용법을 반영해 단순한 ‘책’보다 자료 집합 안의 위치를 드러내는 ‘기록들 가운데에’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
