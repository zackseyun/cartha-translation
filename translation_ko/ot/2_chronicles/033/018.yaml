  - 주님
  rationale: 본문의 신명문자는 고유명으로 드러나 있으므로, 관습적 대체호칭보다 원문 보존을 우선해 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘이스라엘 왕들’ 문구 유지
