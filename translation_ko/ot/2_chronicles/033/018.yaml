  rationale: 본문은 ‘이스라엘’을 적고 있으므로, 기대되는 역사적 조화보다 소스 텍스트를 우선해 그대로 보존했습니다.
  doctrine_reference: 'Translation philosophy §1: Original-language primacy over harmonization'
