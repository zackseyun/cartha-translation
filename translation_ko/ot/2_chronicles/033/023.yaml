  source_fidelity: 원문의 대조적 접속(וְלֹא)과 ‘야훼 앞에서’ 및 두 차례의 כנע 어근 반복은 대체로 반영되었습니다. 다만 현행문은 첫머리의 대조를 표시하지 않고, כִּי가 이끄는 설명 관계도 두 문장 사이에서 충분히 드러나지 않습니다. ‘아몬 자신’은 הוּא אָמוֹן의 강조를 자연스럽게 반영합니다.
  naturalness: ‘그가 곧 아몬은’은 현대 표준 한국어 문장으로 매우 부자연스럽습니다. ‘이는 아몬 자신이 … 때문입니다’로 고치면 합쇼체 문체를 유지하면서도 강조와 문장 연결이 자연스럽습니다.
