id: 2CH.33.23
reference: 2 Chronicles 33:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֤א נִכְנַע֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה כְּ/הִכָּנַ֖ע מְנַשֶּׁ֣ה אָבִ֑י/ו כִּ֛י ה֥וּא אָמ֖וֹן הִרְבָּ֥ה אַשְׁמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
  footnotes:
  - marker: a
    text: Or “before Yahweh.”
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 그는 그의 아버지 므낫세가 자신을 낮춘 것처럼 야훼 앞에서 자신을 낮추지 않았습니다. 이는 아몬 자신이 죄책을 크게 늘렸기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְנַע
  english_pob_choice: did not humble himself
  chosen_korean: 자신을 낮추지 않았습니다
  alternatives_korean:
  - 겸비하지 않았습니다
  - 스스로 복종하지 않았습니다
  - 자신을 굽히지 않았습니다
  lexicon: HALOT
  rationale: 니팔형 כנע는 반사적으로 ‘자신을 낮추다/겸비하다’는 뜻이 적절하며, 회개 문맥에서 가장 자연스럽고 원문의 대조를 살립니다.
- source_word: מִלִּפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 앞에서
  - 주 앞에서
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘앞에서, 앞에’의 관계를 분명히 하므로 직역적이면서도 한국어로 자연스러운 ‘야훼 앞에서’가 적합합니다.
- source_word: כְּהִכָּנַע מְנַשֶּׁה אָבִיו
  english_pob_choice: as his father Manasseh humbled himself
  chosen_korean: 그의 아버지 므낫세가 자신을 낮춘 것처럼
  alternatives_korean:
  - 아버지 므낫세가 자신을 낮춘 것처럼
  - 므낫세 그의 아버지가 자신을 낮춘 것처럼
  lexicon: HALOT
  rationale: 비교구문 כְ는 앞의 동사를 반복해 ‘-한 것처럼’으로 살리면 대조가 선명해지며, 한국어 어순상 ‘그의 아버지 므낫세’가 자연스럽습니다.
- source_word: הִרְבָּה אַשְׁמָה
  english_pob_choice: increased guilt
  chosen_korean: 죄책을 크게 더했습니다
  alternatives_korean:
  - 죄를 크게 늘렸습니다
  - 죄책을 증가시켰습니다
  - 허물을 크게 쌓았습니다
  lexicon: HALOT
  rationale: אַשְׁמָה는 제물의 ‘속건제’가 아니라 여기서는 책임/유죄성의 의미이므로 ‘죄책’이 적절하고, הִרְבָּה는 ‘크게 더하다’로 힘 있게 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문에는 Tetragrammaton을 음역한 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 프로젝트 기준에 따라 יְהוָה는 ‘야훼’로 옮겨 언약적 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘죄책’의 의미 선택
  chosen_reading: Amon의 행위 평가를 단순한 행정적 증가가 아니라 도덕적 책임의 누적로 이해해 ‘죄책’으로 옮겼습니다.
  alternative_readings:
  - 죄
  - 허물
  - 불의
  rationale: 문맥의 אַשְׁמָה는 희생제물이 아니라 유죄/책임을 가리키므로, 독자가 도덕적 비난의 강도를 바로 이해하도록 했습니다.
  doctrine_reference: 'HALOT: אַשְׁמָה in culpability sense'
