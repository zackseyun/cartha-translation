  source_fidelity: 원문의 핵심 의미는 대체로 충실합니다. 그러나 ‘야훼의 눈에’는 한국어에서 다소 직역투이므로 히브리어의 평가 관용구를 자연스럽게 드러내는 ‘야훼께서 보시기에’가 더 적절합니다. 또한 פְּסִילִים와 עבד의 각주 표지가 해당 어구에 직접 붙어야 합니다.
  naturalness: 합쇼체의 문장 종결은 유지되어 있으나, ‘그의 아버지 므낫세가 행한 것과 같았습니다’보다 ‘그의 아버지 므낫세가 행한 것과 같이 행하였습니다’가 비교 대상과 주어를 더 분명하고 자연스럽게 연결합니다. ‘조각된 형상들에게 제사를 드리다’는 우상 숭배의 대상임을 문맥상 나타내며 문법적으로도 가능합니다.
  terminology: ‘야훼’, ‘므낫세’, ‘아몬’은 적절합니다. פְּסִילִים는 ‘조각된 형상들’로 유지할 수 있고, עבד는 해석을 과도하게 좁히지 않도록 ‘섬겼습니다’로 옮기는 것이 적절합니다. 기존 각주의 ‘כאן’은 본문 언어와 무관한 혼입이므로 삭제해야 합니다.
  issues:
