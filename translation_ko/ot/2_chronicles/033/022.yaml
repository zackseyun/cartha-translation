source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֣ה אָבִ֑י/ו וּֽ/לְ/כָל הַ/פְּסִילִ֗ים אֲשֶׁ֤ר עָשָׂה֙ מְנַשֶּׁ֣ה אָבִ֔י/ו זִבַּ֥ח אָמ֖וֹן וַ/יַּֽעַבְדֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
  footnotes:
  - marker: a
    text: Or 'idols' for 'carved images.' The Hebrew specifically refers to images that were carved or hewn.
    reason: lexical_alternative
  - marker: b
    text: Or 'worshiped them.' The Hebrew verb literally means 'served them,' often used for religious service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 눈에 악한 일을 행하였는데, 그의 아버지 므낫세가 행한 것과 같았습니다. 아몬은 그의 아버지 므낫세가 만든 모든 조각된 형상에게 제사를 드리고 그것들을 섬겼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조각된 형상’은 כאן의 פְּסִילִים가 ‘우상’보다 더 구체적으로 조각되거나 새긴 형상을 가리킨다는 점을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘섬겼습니다’는 우상숭배의 종교적 의미를 포함할 수 있지만, 히브리어 동사 자체는 문자적으로 ‘섬기다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악한 일을 행하였는데
  alternatives_korean:
  - 악을 행하였는데
  - 악한 것을 행하였는데
  lexicon: HALOT
  rationale: 히브리어 관용구 עשה + הרע는 단순한 행위보다 도덕적 평가를 담아 ‘악한 일을 행하다’로 자연스럽게 옮기는 것이 좋습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 앞에서
  - 야훼 보시기에
  lexicon: HALOT
  rationale: ‘눈에’는 원문의 관용적 평가 표현을 가장 직접적으로 살리며, POB의 야훼 선택도 그대로 반영합니다.
- source_word: הַפְּסִילִים
  english_pob_choice: the carved images
  chosen_korean: 조각된 형상
  alternatives_korean:
  - 새긴 우상
  - 조각상
  lexicon: HALOT
  rationale: פְּסִילִים은 단순한 ‘우상’보다 조각하거나 새긴 물체라는 구체성이 있어, POB의 ‘carved images’에 맞춰 ‘조각된 형상’으로 옮겼습니다.
- source_word: וַיַּעַבְדֵם
  english_pob_choice: and served them
  chosen_korean: 그것들을 섬겼습니다
  alternatives_korean:
  - 그것들을 예배했습니다
  - 그것들을 섬겨 예배했습니다
  lexicon: HALOT
  rationale: עבד의 기본 뜻은 ‘섬기다’이므로, 우상숭배 문맥이라도 lexical tension을 살려 ‘섬겼습니다’로 옮기고, 종교적 의미는 문맥이 드러내게 했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 음역해 인격적 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 우상에게 ‘섬기다’의 의미
  chosen_reading: 표면 번역은 ‘섬겼습니다’로 유지하고, 예배적 함의를 본문 문맥에 맡김
  alternative_readings:
  - 예배했습니다
  - 숭배했습니다
  rationale: 히브리어 עבד는 우상 문맥에서 예배/숭배를 함축하지만, 어휘 자체의 ‘섬기다’를 유지하는 것이 원문 어감과 반복 구조를 더 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
