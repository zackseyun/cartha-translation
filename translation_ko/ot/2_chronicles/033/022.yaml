revisions:
- from: 그는 야훼의 눈에 악한 일을 행하였는데, 그의 아버지 므낫세가 행한 것과 같았습니다. 아몬은 그의 아버지 므낫세가 만든 모든 조각된 형상에게 제사를 드리고 그것들을 섬겼습니다.[a][b]
