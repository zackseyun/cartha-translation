    issue: 각주 표지가 문장 끝에 함께 배치되어 각주 대상 어구와 직접 연결되지 않습니다.
    rationale: a는 ‘조각된 형상들’, b는 ‘섬겼습니다’에 각각 붙여야 독자가 각주의 적용 대상을 명확히 알 수 있습니다.
  - severity: medium
