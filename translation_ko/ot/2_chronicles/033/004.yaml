id: 2CH.33.4
reference: 2 Chronicles 33:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָנָ֥ה מִזְבְּח֖וֹת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֥ם יִֽהְיֶה שְּׁמִ֖/י לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
  footnotes:
  - marker: a
    text: Or “in the temple of the LORD.” Literally, “in the house of the LORD.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “my name will be forever”; compare the common biblical expression “my name will be there forever.”'
    reason: cross_reference
translation:
  language: ko
  text: 그는 야훼의 집에 제단들을 세웠습니다[a]. 야훼께서 예루살렘에서 “내 이름이 영원히 있을 것이다”라고 말씀하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 성전 안에”. 문자적으로는 “야훼의 집 안에”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנָה
  english_pob_choice: He built
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 지었습니다
  - 만들었습니다
  lexicon: HALOT
  rationale: מִזְבְּחוֹת(제단들)과 결합될 때 한국어에서는 ‘제단을 세우다’가 가장 자연스럽고, 건축 행위의 결과를 잘 드러냅니다.
- source_word: מִזְבְּח֖וֹת
  english_pob_choice: altars
  chosen_korean: 제단들을
  alternatives_korean:
  - 단들을
  - 번제단들을
  lexicon: HALOT
  rationale: פלural 형태를 살려 복수로 옮기되, 일반적인 성경 용어인 ‘제단’을 사용했습니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집에
  alternatives_korean:
  - 야훼의 성전에
  - 주님의 집에
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘집’을 유지해 본문 표현을 보존했고, 문맥상 성전을 가리키지만 풀이를 과도하게 확장하지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본 프로젝트 기본어휘에 따라 신적 고유명사를 ‘야훼’로 옮겨, 호칭 대체를 피했습니다.
- source_word: יִהְיֶה שְּׁמִי לְעוֹלָם
  english_pob_choice: my name will be forever
  chosen_korean: 내 이름이 영원히 있을 것이다
  alternatives_korean:
  - 내 이름이 영원할 것이다
  - 내 이름이 영원히 있게 될 것이다
  lexicon: HALOT
  rationale: 본문에는 ‘거기’에 해당하는 말이 없으므로 ‘있을 것이다’로 옮겨, ‘my name will be’의 구조를 그대로 살렸습니다. ‘영원히’는 לְעוֹלָם의 지속성을 자연스럽게 드러냅니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 언약적 고유명사를 직접 사용하므로, 이를 호칭으로 바꾸지 않고 고유명사 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘내 이름이 영원히 있을 것이다’의 처리
  chosen_reading: 본문에 없는 ‘거기’를 보충하지 않고 직결 구조를 유지
  alternative_readings:
  - 내 이름이 거기 영원히 있을 것이다
  - 내 이름이 그곳에 영원히 있을 것이다
  rationale: 병행구절의 관용을 끌어오면 의미는 익숙해지지만, 본문 자체의 어휘적 긴장을 지울 수 있으므로 원문에 있는 표현만 남겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Original-language primacy over translation tradition'
