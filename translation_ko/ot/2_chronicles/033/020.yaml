source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב מְנַשֶּׁה֙ עִם אֲבֹתָ֔י/ו וַֽ/יִּקְבְּרֻ֖/הוּ בֵּית֑/וֹ וַ/יִּמְלֹ֛ךְ אָמ֥וֹן בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'in his palace'; the Hebrew says 'in his house,' which in a royal context may refer to the palace complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세가 그의 조상들과 함께 잠들었고, 그를 그의 집에 장사하였습니다. 그리고 그의 아들 아몬이 그의 뒤를 이어 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘그의 집’이라고 말하며, 왕실 문맥에서는 궁전이나 궁성 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들었고
  alternatives_korean:
  - 누웠고
  - 죽었고
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘조상들과 함께 잠들다’의 장례적 표현을 살리되, 한국어에서는 ‘잠들다’가 죽음을 직접 가리키는 완곡하면서도 자연스러운 대응입니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 직역의 ‘아버지들’은 한국어에서 오해를 부를 수 있어, 왕조적 장례 관용구의 의미를 드러내는 ‘조상들’로 옮겼습니다.
- source_word: בֵּיתוֹ
  english_pob_choice: in his house
  chosen_korean: 그의 집에
  alternatives_korean:
  - 그의 궁에
  - 그의 궁전 안에
  lexicon: HALOT
  rationale: 원문은 단순히 ‘집’이라고 되어 있으므로 기본 의미를 유지했습니다. 왕실 문맥에서 ‘궁’/‘궁전’도 가능하지만, 본문 자체의 표현을 우선했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그의 자리에 왕이 되었습니다
  - 그를 대신하여 통치하였습니다
  lexicon: HALOT
  rationale: 계승 공식의 의미를 한국어 왕위 승계 표현으로 자연스럽게 풀어, ‘그의 뒤를 이어’와 ‘왕이 되었습니다’로 전달했습니다.
theological_decisions:
- issue: 왕위 계승 공식의 표현 방식
  chosen_reading: ‘그의 뒤를 이어 왕이 되었습니다’로 직설적 계승 의미를 유지했습니다.
  alternative_readings:
  - ‘그를 대신하여 다스렸습니다’
  - ‘그 뒤에 왕위에 올랐습니다’
  rationale: 본문은 단순한 시간 순서가 아니라 정식 왕위 승계를 말하므로, ‘뒤를 이어’로 계승성과 연속성을 분명히 했습니다.
  doctrine_reference: 왕정사 서술의 문맥적 의미 보존
