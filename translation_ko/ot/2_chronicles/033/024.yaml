source:
  edition: WLC
  text: וַ/יִּקְשְׁר֤וּ עָלָי/ו֙ עֲבָדָ֔י/ו וַ/יְמִיתֻ֖/הוּ בְּ/בֵיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/024.yaml
  text: And his servants conspired against him and put him to death in his own house.
translation:
  language: ko
  text: 그의 종들이 그를 대적하여 음모를 꾸미고, 그의 집에서 그를 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  english_pob_choice: conspired
  chosen_korean: 반역을 꾀하여
  alternatives_korean:
  - 음모를 꾸며
  - 모의하여
  lexicon: HALOT
  rationale: קשר על의 왕정 문맥상 의미를 살려, 단순한 ‘계획하다’보다 적대적 결의를 드러내는 ‘반역을 꾀하다’로 옮겼습니다.
- source_word: עָלָיו
  english_pob_choice: against him
  chosen_korean: 그에게
  alternatives_korean:
  - 그를 향하여
  - 그를 대적하여
  lexicon: HALOT
  rationale: 한국어에서는 ‘반역을 꾀하다’가 이미 대상에 대한 적대성을 내포하므로, 중복을 피하면서도 전치사 על의 표적 관계를 자연스럽게 드러냈습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들이
  alternatives_korean:
  - 그의 신하들이
  - 그의 노예들이
  lexicon: HALOT
  rationale: 왕실 맥락의 עבד는 넓게 ‘종/신하’일 수 있으나, 본문이 신분을 특정하지 않으므로 가장 직접적인 ‘종들’로 유지했습니다. ‘노예들’은 본문이 요구하는 것보다 강합니다.
- source_word: בְּבֵיתוֹ
  english_pob_choice: in his own house
  chosen_korean: 자기 집에서
  alternatives_korean:
  - 그의 집에서
  - 자기 집 안에서
  lexicon: HALOT
  rationale: 소유 접미사를 자연스러운 한국어로 반영해, 살해가 이루어진 장소의 가까움과 충격을 드러내는 ‘자기 집에서’를 선택했습니다.
theological_decisions:
- issue: 왕실 살해 사건의 직접성 표현
  chosen_reading: ‘그를 죽였습니다’로 직설적으로 옮겨 살해의 사실성과 폭력을 희석하지 않았습니다.
  alternative_readings:
  - ‘살해했습니다’
  - ‘목숨을 빼앗았습니다’
  rationale: 히브리어 וַיְמִיתֻהוּ는 사역형으로 인한 죽임을 직접 서술하므로, 역사 서술의 냉정한 직접성을 유지하는 번역이 적절합니다.
  doctrine_reference: 역사서의 서술 문체와 사역형 동사 의미
- issue: ‘그의 종들’의 사회적 지위
  chosen_reading: עֲבָדָיו를 ‘종들’로 번역해 본문이 말하는 관계를 유지했습니다.
  alternative_readings:
  - ‘관리들’
  - ‘신하들’
  rationale: 본문 자체는 직함을 제시하지 않으므로, 해석을 덧붙이는 고급 관료화보다 용어를 열어 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문 의미 보존과 과도한 사회사적 추정 회피
