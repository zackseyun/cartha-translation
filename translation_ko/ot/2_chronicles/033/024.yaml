  naturalness: ‘그에게 반역을 꾀하여’는 현대 한국어에서 다소 어색합니다. ‘그를 대적하여 음모를 꾸미고’가 표적 관계와 공모 행위를 자연스럽고 명확하게 나타냅니다.
  terminology: עֲבָדָיו의 ‘종들’은 원문이 직함을 특정하지 않는 점을 보존하므로 유지할 수 있습니다. וַיְמִיתֻהוּ는 ‘그를 죽였습니다’로 충분히 직접적이고 자연스럽게 옮겨집니다.
