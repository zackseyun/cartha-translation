  source_fidelity: ‘들으려 하지 않았습니다’는 주의를 기울여 듣지 않았다는 히브리어 הִקְשִׁיבוּ의 의미보다 의도적 거절을 다소 더 강하게 표현합니다. ‘귀를 기울이지 않았습니다’는 주의 깊은 청취와 그에 따르는 반응의 뉘앙스를 보존하면서도 불필요한 의지 표현을 덧붙이지 않습니다.
