  terminology: ‘야훼’, ‘므낫세’, ‘백성’은 고유명사 및 공동체를 가리키는 용어로 적절합니다. ‘그들’은 므낫세와 그의 백성을 함께 가리킬 수 있는 히브리어 복수형의 범위를 유지합니다.
