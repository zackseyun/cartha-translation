base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/010.yaml
  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
  footnotes:
  - marker: a
    text: Or 'heed' or 'pay attention.' The Hebrew verb can carry the sense of attentive listening that implies response.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 므낫세와 그의 백성에게 말씀하셨으나, 그들은 귀를 기울이지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의를 기울이지 않았습니다’ 또는 ‘경청하지 않았습니다’로 옮길 수 있습니다. 히브리어 동사는 주의 깊게 듣고 그에 반응하는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּ֧ר
  english_pob_choice: spoke
  chosen_korean: 말씀하셨으나
  alternatives_korean:
  - 말하셨으나
  - 이르셨으나
  lexicon: BDB/HALOT
  rationale: דבר의 피엘형은 단순한 발화보다 공식적·권위 있는 ‘말씀하다’가 자연스럽고, 여기서는 뒤의 불순종과 대비되므로 ‘-셨으나’로 연결했습니다.
- source_word: יְהוָ֛ה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신적 고유명사는 POB 원칙대로 제목이 아닌 고유명사로 음역해 ‘야훼’를 썼습니다.
- source_word: עַמּ֖וֹ
  english_pob_choice: his people
  chosen_korean: 그의 백성에게
  alternatives_korean:
  - 그의 ժողովուրդ에게
  - 그의 사람들에게
  lexicon: BDB/HALOT
  rationale: עַם은 단순한 ‘사람들’보다 소속된 공동체/백성을 가리키므로, 문맥상 통치 아래 있는 무리를 드러내는 ‘백성’을 택했습니다.
- source_word: הִקְשִֽׁיבוּ
  english_pob_choice: listen
  chosen_korean: 들으려 하지 않았습니다
  alternatives_korean:
  - 귀를 기울이지 않았습니다
  - 주의하지 않았습니다
  - 듣지 않았습니다
  lexicon: HALOT
  rationale: הקשיב는 단순 청취보다 주의를 기울여 듣는 뜻이 있어, 여기서는 응답을 내포한 거절을 살리기 위해 ‘들으려 하지 않다’로 옮겼습니다.
theological_decisions:
- issue: “they did not listen”의 복수 주어 범위
  chosen_reading: 므낫세와 그의 백성이 함께 들으려 하지 않은 것으로 읽었습니다.
  alternative_readings:
  - ‘그들’이 백성만 가리키고 므낫세는 별도 피호출자로 볼 수 있습니다.
  rationale: 히브리어는 ‘므낫세와 그의 백성’ 두 대상에게 말씀하신 뒤 복수 동사로 끝나므로, 둘 다 불응한 것으로 옮기는 것이 가장 직접적입니다.
  doctrine_reference: 본문 문법과 서술 흐름
