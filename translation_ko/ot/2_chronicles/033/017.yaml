theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 있는 고유한 언약명 יהוה를 음역해 보존하며, 본문 내에서 고유명성을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 산당 제사의 제한점
  chosen_reading: 백성은 산당에서 계속 제사를 드렸지만, 그 대상은 야훼 자신으로 제한되었습니다.
  alternative_readings:
  - 백성이 산당에서만 야훼께 제사를 드렸습니다.
  - 백성이 산당에서 이방 신들에게는 제사하지 않았습니다.
  rationale: 히브리어는 제사의 ‘장소’와 ‘대상’을 구별하며, 제한은 대상(야훼) 쪽에 걸립니다. 이 긴장을 살려 개혁이 완전하지 않았음을 보존합니다.
  doctrine_reference: Chronicles high-place reform tension
