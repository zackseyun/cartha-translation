base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
  footnotes:
  - marker: a
    text: Or 'he built again'; the Hebrew uses two verbs, literally 'he returned and built,' expressing that he restored what had been removed.
    reason: lexical_alternative
  - marker: b
    text: '''The Baals'' preserves the Hebrew plural, likely referring to multiple local manifestations or images of Baal; some translations simplify to ''Baal.'''
    reason: lexical_alternative
  - marker: c
    text: Or simply 'Asherahs'; the Hebrew term may refer to cultic poles or symbols associated with the goddess Asherah.
    reason: lexical_alternative
  - marker: d
    text: '''Host of heaven'' here refers to celestial bodies as objects of worship; compare 2 Kings 21:3.'
    reason: cross_reference
translation:
  language: ko
  text: 그는 그의 아버지 히스기야가 헐어 버린 산당들을 다시 세우고, 바알들에게 제단들을 세우며, 아세라 목상들을 만들고, 하늘의 온 군상에게 절하고 그것들을 섬겼습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다시 세우고’는 히브리어의 ‘돌아가서 짓다’라는 두 동사의 결합을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 복수형 ‘바알들’을 반영해 단수로 완화하지 않았습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘아세라 목상들’은 아세라와 연결된 제의용 물체를 가리킬 수 있는 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘하늘의 군상’은 이 문맥에서 천체들을 예배 대상으로 삼는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  english_pob_choice: he rebuilt
  chosen_korean: 다시 세우고
  alternatives_korean:
  - 다시 지어
  - 회복하고
  - 다시 건축하고
  lexicon: BDB
  rationale: ‘돌아가서 짓다’의 두 동사를 자연스럽게 살리면서, 헐려 있던 것을 복구했다는 의미를 한국어 동사구로 간결하게 드러냅니다.
- source_word: הַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당들을
  alternatives_korean:
  - 높은 곳들을
  - 고지의 제단들을
  lexicon: BDB
  rationale: 예배 장소를 가리키는 전통적 성서 용어를 유지해 우상숭배의 구체성을 보존합니다.
- source_word: לַבְּעָלִים
  english_pob_choice: the Baals
  chosen_korean: 바알들에게
  alternatives_korean:
  - 바알들에
  - 바알에게
  lexicon: BDB
  rationale: 히브리어 복수를 반영해 단수화하지 않았고, ‘~에게’로 제단의 대상을 자연스럽게 나타냈습니다.
- source_word: אֲשֵׁרוֹת
  english_pob_choice: Asherah poles
  chosen_korean: 아세라 목상들을
  alternatives_korean:
  - 아세라 상들을
  - 아세라 기둥들을
  - 아세라들을
  lexicon: BDB
  rationale: 실물 숭배 대상을 분명히 보여 주는 표현을 택해, 단순한 추상명사보다 우상 숭배의 물적 성격을 살렸습니다.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  english_pob_choice: to all the host of heaven
  chosen_korean: 하늘의 온 군상에게
  alternatives_korean:
  - 하늘의 모든 군대에게
  - 하늘의 온 천상 군대에게
  lexicon: BDB
  rationale: 문맥상 별과 천체를 예배 대상으로 삼는 표현이므로, 천사보다 천체적 집합을 떠올리게 하는 ‘군상’을 사용했습니다.
theological_decisions:
- issue: 예배 행위의 이중 표현(절하다/섬기다) 보존
  chosen_reading: ‘절하고 그것들을 섬겼습니다’로 둘 다 살렸습니다.
  alternative_readings:
  - ‘경배하고 섬겼습니다’
  - ‘그것들을 예배하고 섬겼습니다’
  rationale: 원문은 엎드림과 봉사의 두 동사를 병렬로 써 우상숭배의 전면성을 강조하므로, 한국어에서도 두 행위를 구분해 드러냅니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: ‘하늘의 군대’의 범위
  chosen_reading: 천사로 좁히지 않고 별과 천체를 포함한 예배 대상의 집합으로 이해했습니다.
  alternative_readings:
  - 천상 군대(천사들)
  - 하늘의 별들
  rationale: 문맥이 바알과 아세라와 병렬되는 이방 숭배 목록이므로, 하늘의 군상은 천체 숭배를 가리키는 것이 가장 자연스럽습니다.
  doctrine_reference: Translation philosophy §§1, 3
