base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
  footnotes:
  - marker: a
    text: Or, 'he let himself be entreated by him' / 'he responded favorably to him.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to his kingdom,' that is, to his royal rule or kingship.
    reason: lexical_alternative
  - marker: c
    text: Or 'and he was moved by his plea and heard his supplication, and he brought him back'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그에게 기도하자[a], 그분은 그의 간청을 받아들이시고 그의 탄원을 들으시며 그를 예루살렘, 곧 그의 왕권으로[b] 돌려보내셨습니다[c]. 그러고 나서 므낫세는 야훼께서 하나님이심을 알게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 간청하자’, ‘그가 그에게 호의를 베풀어 달라고 구하자’.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘그의 왕국으로’입니다. 곧 그의 왕권 또는 통치 자리로 돌아가게 하셨다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 탄원을 들으시고 예루살렘으로 그를 돌려보내셨습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  english_pob_choice: He prayed to him
  chosen_korean: 그가 그에게 기도하자
  alternatives_korean:
  - 그가 그에게 간구하자
  - 그가 그에게 빌자
  lexicon: HALOT
  rationale: hitpael התפלל의 기본 의미를 따라 ‘기도하다’로 옮기되, דative 구조의 ‘그에게’를 살려 직접적 대상 관계를 보존했습니다.
- source_word: וַיֵּעָתֶר לוֹ
  english_pob_choice: he was moved by his entreaty
  chosen_korean: 그분은 그의 간청을 받아들이시고
  alternatives_korean:
  - 그분은 그의 간청에 응답하시고
  - 그분은 그의 간청을 허락하시고
  lexicon: HALOT
  rationale: נפעל עתר의 ‘간청을 받아들이다/호의적으로 응답하다’는 뜻을 한국어에서 자연스럽게 드러내기 위해 ‘받아들이시고’로 옮겼습니다.
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  english_pob_choice: heard his supplication
  chosen_korean: 그의 탄원을 들으시며
  alternatives_korean:
  - 그의 간청을 들으시며
  - 그의 호소를 들으시며
  lexicon: HALOT
  rationale: תְּחִנָּה는 단순한 ‘기도’보다 애원성 있는 ‘탄원/간청’이 더 가깝기에, 엄중한 뉘앙스를 유지하는 ‘탄원’을 선택했습니다.
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלִַם לְמַלְכוּתוֹ
  english_pob_choice: he brought him back to Jerusalem to his kingdom
  chosen_korean: 그를 예루살렘, 곧 그의 왕권으로 돌려보내셨습니다
  alternatives_korean:
  - 그를 예루살렘으로, 곧 그의 왕권으로 되돌리셨습니다
  - 그를 예루살렘으로 다시 데려오셔서 그의 왕권에 복귀시키셨습니다
  lexicon: HALOT
  rationale: שׁוּב의 히필 ‘돌려보내다/되돌리다’와 מַלְכוּת의 ‘왕국’보다 ‘왕권, 왕위에 대한 통치권’이라는 뜻을 함께 살리기 위해 설명적 동격을 사용했습니다.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  english_pob_choice: that Yahweh is God
  chosen_korean: 야훼께서 하나님이심을
  alternatives_korean:
  - 야훼께서 하나님이신 것을
  - 야훼께서 하나님이심을
  lexicon: HALOT
  rationale: 예언/서술적 고백의 문장을 한국어로는 명사절로 자연스럽게 옮기되, יְהוָה를 프로젝트 기본값인 ‘야훼’로 유지하여 고유명과 신앙고백의 힘을 보존했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 언약적 신명은 ‘야훼’로 음역하여, 본문의 고유한 신명성과 대조 구조를 가리지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: וַיֵּעָתֶר לוֹ와 וַיִּשְׁמַע תְּחִנָּתוֹ의 연속 반응
  chosen_reading: 간청을 받아들이시고 그의 탄원을 들으시며
  alternative_readings:
  - 간청에 응답하시고 그의 탄원을 들으시며
  - 그의 간청을 받아들이시고 그의 탄원을 들으셨습니다
  rationale: 히브리어의 나란한 동사 연쇄를 살리기 위해 두 개의 반응을 분리해 번역했고, 마지막 동사와 함께 하나의 흐름으로 읽히게 했습니다.
  doctrine_reference: 'Translation philosophy #3'
