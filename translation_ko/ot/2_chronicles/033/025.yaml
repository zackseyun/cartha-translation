  to: 그러나 그 땅의 백성[a]은 아몬 왕을 거슬러 음모를 꾸민 모든 자를 쳐 죽였고, 그 땅의 백성은 그의 아들 요시야를 그의 자리에 왕으로 세웠습니다.
  rationale: 음모를 뜻하는 원문의 핵심 어휘를 ‘반역’으로 확대하지 않고 ‘음모를 꾸민’으로 수정했습니다. 또한 문화 주석의 표지를 설명 대상인 ‘그 땅의 백성’에 직접 연결하고, 주석도 특정 계층으로 단정하지 않도록 원문의 열린 사회·정치적 함의를 반영했습니다.
