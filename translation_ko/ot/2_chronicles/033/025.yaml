  text: וַ/יַּכּוּ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּֽשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
  footnotes:
  - marker: a
    text: Or 'all the conspirators.'
    reason: lexical_alternative
  - marker: b
    text: '''The people of the land'' is a Hebrew expression that can denote the populace of the country, possibly with socio-political overtones.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 그 땅의 백성[a]은 아몬 왕을 거슬러 음모를 꾸민 모든 자를 쳐 죽였고, 그 땅의 백성은 그의 아들 요시야를 그의 자리에 왕으로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 땅의 백성’은 히브리어 표현으로, 그 나라의 주민을 가리킬 수 있으며 사회·정치적인 뉘앙스를 지닐 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכּוּ
  english_pob_choice: struck down
  chosen_korean: 쳐 죽였고
  alternatives_korean:
  - 죽였고
  - 쳐서 죽였고
  - 쳐 눕혔고
  lexicon: HALOT
  rationale: נכה의 서사적 용법은 단순히 ‘치다’보다 실제 처형/살해를 드러내는 경우가 많아, 문맥의 폭력을 분명히 하되 과도한 의역은 피하는 표현으로 옮겼습니다.
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 나라의 백성
  - 그 땅 사람들
  lexicon: HALOT
  rationale: 히브리어 관용구의 표면 형식을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘그 땅의 백성’으로 옮겼습니다.
- source_word: כָּל הַקֹּשְׁרִים
  english_pob_choice: all those who had conspired / all the conspirators
  chosen_korean: 반역한 모든 자를
  alternatives_korean:
  - 모든 공모자들을
  - 모든 반역자들을
  lexicon: HALOT
  rationale: קשר의 분사형은 ‘공모하다/음모하다’의 뜻이지만, 한국어에서는 왕에 대한 정치적 음모라는 점을 더 직접적으로 드러내는 ‘반역한’이 문맥에 잘 맞습니다.
- source_word: וַיַּמְלִיכוּ
  english_pob_choice: made ... king
  chosen_korean: 왕으로 세웠습니다
  alternatives_korean:
  - 왕이 되게 했습니다
  - 왕으로 삼았습니다
  lexicon: HALOT
  rationale: מלך의 히필은 누군가를 왕으로 세우는 행위이므로, 즉위의 결과를 자연스럽게 전달하는 ‘왕으로 세웠습니다’가 적절합니다.
theological_decisions:
- issue: 왕권 승계의 주체와 정치적 책임을 어떻게 드러낼지
  chosen_reading: ‘그 땅의 백성’이 아몬에게 반역한 자들을 처형하고 요시야를 왕으로 세웠다는 서술로 옮겨, 본문의 정치적 행위성을 분명히 했습니다.
  alternative_readings:
  - 중립적으로 ‘처벌했다’로 완화하는 읽기
  - ‘백성’의 사회정치적 뉘앙스를 약화시키는 읽기
  rationale: 본문은 단순한 민중 반응이 아니라 왕위 교체를 둘러싼 정치적 결단을 서술하므로, 행위의 강도와 주체성을 유지하는 것이 본문 의미에 부합합니다.
  doctrine_reference: 역사서의 서술적 본문 해석 원칙
