base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
  footnotes:
  - marker: a
    text: Literally, 'the foot of Israel,' an idiom for Israel's presence in the land.
    reason: lexical_alternative
  - marker: b
    text: Or 'by the hand of Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이스라엘의 발을 너희 조상들에게 정해 준 땅에서 다시는 옮기지 않겠고, 오직 그들이 내가 모세의 손을 통해 그들에게 명령한 모든 것, 곧 온 율법과 규례들과 법도를 다 행하도록 주의한다면 그렇게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 발’은 이스라엘의 거주와 존재를 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모세의 손으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אוֹסִיף לְהָסִיר
  english_pob_choice: I will no longer remove
  chosen_korean: 다시는 옮기지 않겠고
  alternatives_korean:
  - 다시는 제거하지 않겠고
  - 더 이상 옮기지 않겠고
  lexicon: HALOT
  rationale: 오וֹסִיף לְהָסִיר의 '더 이상/다시는 …하지 않다'는 계속성 부정과 제거 동작을 함께 담아야 하므로, 자연스러운 합쇼체로 '다시는 옮기지 않겠다'가 적절합니다.
- source_word: רֶגֶל יִשְׂרָאֵל
  english_pob_choice: the foot of Israel
  chosen_korean: 이스라엘의 발
  alternatives_korean:
  - 이스라엘의 발걸음
  - 이스라엘
  lexicon: HALOT
  rationale: 직역 이미지를 살려 '발'을 유지해야 POB가 주석한 관용구의 구체성이 보존됩니다. 문맥상 출입/거주를 가리키지만, 본문은 은유를 그대로 드러내는 편이 더 충실합니다.
- source_word: לְכָל הַתּוֹרָה וְהַחֻקִּים וְהַמִּשְׁפָּטִים
  english_pob_choice: according to all the law and the statutes and the judgments
  chosen_korean: 온 율법과 규례들과 법도
  alternatives_korean:
  - 온 율법과 규례들과 판단들
  - 온 율법과 율례들과 법규
  lexicon: HALOT
  rationale: 토라, 후킴, 미쉬파팀의 삼중 법률 표현을 한국어에서도 구별되게 유지해야 하므로, POB의 'law/statutes/judgments' 대응을 따라 '율법/규례/법도'로 번역했습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: given through Moses
  chosen_korean: 모세의 손을 통해
  alternatives_korean:
  - 모세를 통하여
  - 모세의 손으로
  lexicon: HALOT
  rationale: POB가 각주로 남긴 대로 이 관용구는 매개적 전달을 뜻합니다. '통해'가 현대 한국어에서 가장 자연스럽지만, 본문에서는 '손'을 유지해 히브리어의 매개 이미지를 보존했습니다.
theological_decisions:
- issue: 조건절의 실제적 경고와 약속
  chosen_reading: 본문의 약속은 순종을 전제한 조건적 진술로 유지하고, 언약적 긴장을 해소하지 않았습니다.
  alternative_readings:
  - 무조건적 영구 소유의 선언
  - 수사적 표현일 뿐 실제 조건은 아님
  rationale: 히브리어의 רַק אִם은 강한 조건을 분명히 제시하므로, 번역도 그 긴장을 그대로 드러내야 합니다. 본문 자체보다 더 넓은 교리 논쟁으로 확장하지 않았습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
