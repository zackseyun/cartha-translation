translation:
  language: ko
  text: 므낫세가 유다와 예루살렘 주민들을 미혹하여, 야훼께서 이스라엘 자손 앞에서 멸하신 민족들보다 더 악을 행하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 사람들” 혹은 “이스라엘 백성”. 히브리어는 “이스라엘의 아들들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּתַע
  english_pob_choice: led ... astray
  chosen_korean: 미혹하여
  alternatives_korean:
  - 길을 잘못 들게 하여
  - 잘못 이끌어
  - 유혹하여
  lexicon: HALOT
  rationale: תעה의 사역형으로 ‘잘못 가게 만들다’는 뜻이므로, 현대 한국어에서 간결하고 원뜻을 살리는 ‘미혹하여’로 옮겼습니다.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  english_pob_choice: Judah and the inhabitants of Jerusalem
  chosen_korean: 유다와 예루살렘 주민들
  alternatives_korean:
  - 유다와 예루살렘에 사는 사람들
  - 유다와 예루살렘 거주자들
  lexicon: HALOT
  rationale: 두 대상, 곧 유다 전체와 예루살렘의 주민들을 모두 분명히 드러내기 위해 자연스러운 현대어 표현을 택했습니다.
- source_word: מִן הַגּוֹיִם
  english_pob_choice: more evil than the nations
  chosen_korean: …보다 더 악을 행하게
  alternatives_korean:
  - 민족들보다 더 악하게
  - 나라들보다 더 악을 행하게
  lexicon: HALOT
  rationale: 비교 구문을 한국어의 ‘…보다 더’로 풀어, 단순한 질적 진술이 아니라 ‘그들보다 더’라는 비교를 분명히 했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역적 표지를 유지하되, 한국어 성경에서 널리 쓰이는 ‘이스라엘 자손’으로 자연스럽게 옮겼습니다.
