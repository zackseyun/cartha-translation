  rationale: 문서의 기본 원칙에 따라 언약적 신명은 호칭으로 바꾸지 않고 고유명에 가깝게 ‘야훼’로 표기했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
