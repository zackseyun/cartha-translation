  to: 야훼께서 앗수르 왕의 군대 지휘관들을 그들에게 대항하여 데려오셨습니다. 그들은 므낫세를 갈고리로[a] 사로잡고, 청동 사슬로 묶어 바벨론으로 끌고 갔습니다.
