id: 2CH.33.11
reference: 2 Chronicles 33:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֵ֨א יְהוָ֜ה עֲלֵי/הֶ֗ם אֶת שָׂרֵ֤י הַ/צָּבָא֙ אֲשֶׁר֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וַ/יִּלְכְּד֥וּ אֶת מְנַשֶּׁ֖ה בַּ/חֹחִ֑ים וַ/יַּֽאַסְרֻ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם וַ/יּוֹלִיכֻ֖/הוּ בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
  footnotes:
  - marker: a
    text: Or 'with a hook'; the Hebrew term can denote hooks or thorns, and some understand it more generally as a restraint placed on a captive.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 앗수르 왕에게 속한 군대 지휘관들을 그들 위에 보내시니, 그들이 므낫세를 갈고리로 잡아끌고, 놋사슬로 묶어 바벨론으로 끌고 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC/N/A
  rationale: פּersonal name인 야훼를 제목어인 ‘주’로 바꾸지 않고, POB의 원칙에 따라 음역으로 드러냈습니다.
- source_word: שָׂרֵי הַצָּבָא
  english_pob_choice: the commanders of the army
  chosen_korean: 군대 지휘관들
  alternatives_korean:
  - 군대의 장관들
  - 군사 지휘관들
  lexicon: HALOT
  rationale: שָׂרֵי는 통치/지휘층을 가리키므로 현대 한국어에서는 ‘지휘관들’이 가장 자연스럽고, הַצָּבָא의 군사적 맥락도 살릴 수 있습니다.
- source_word: בַּחֹחִים
  english_pob_choice: with hooks
  chosen_korean: 갈고리로
  alternatives_korean:
  - 고리로
  - 후크로
  lexicon: HALOT
  rationale: 형벌·포로 구속의 구체적 이미지를 보존하기 위해 문자적으로 ‘갈고리’에 해당하는 표현을 택했습니다.
- source_word: בַּנְחֻשְׁתַּיִם
  english_pob_choice: with bronze chains
  chosen_korean: 놋사슬로
  alternatives_korean:
  - 청동사슬로
  - 놋족쇄로
  lexicon: HALOT
  rationale: 본문의 금속 재질을 살리되 한국어 성경에서 익숙한 ‘놋’으로 옮겼고, 구속 도구의 형태는 문맥상 ‘사슬’이 무난합니다.
theological_decisions:
- issue: 하나님의 주권적 심판 진술
  chosen_reading: 야훼께서 앗수르 군 지휘관들을 ‘보내셨다’는 직접적인 원인 진술을 유지했습니다.
  alternative_readings:
  - ‘허락하셨다’로 완화하는 번역
  - ‘일어나게 하셨다’로 우회하는 번역
  rationale: 히필형 וַיָּבֵא는 단순 허용이 아니라 주체적 개입을 드러내므로, 심판의 주권성을 약화하지 않도록 직역적 의미를 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
