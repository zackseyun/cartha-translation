  to: 그는 힌놈 아들의 골짜기에서 자기 아들들을 불 가운데로 지나가게 했으며[a], 점을 치고 길흉을 살피며 술법을 부리고, 신접한 자와 영매를 가까이했습니다[b]. 그는 야훼 보시기에 악을 많이 행하여 그분을 노하게 했습니다.
  rationale: 지명 표현을 자연스러운 한국어로 다듬고, 매체·영매에 대한 히브리어 표현을 ‘두었다’라는 좁은 의미 대신 폭넓은 관여를 나타내도록 수정했습니다. 본문의 불 통과 관용구는 해석적으로 확정하지 않았으며, 신명 ‘야훼’와 원문의 악행 강조도 유지했습니다. 각주 표지를 해당 본문 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
