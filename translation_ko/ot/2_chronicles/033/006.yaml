  verdict: revise
  source_fidelity: ‘무당과 영매를 두었습니다’는 וְעָשָׂה אֹוב וְיִדְּעֹנִי의 폭넓은 ‘관여하다/상대하다’라는 뜻을 다소 부정확하게 ‘두다’로 한정합니다. 또한 ‘힌놈의 아들 골짜기’는 지명으로서 한국어에서 매우 어색합니다. 불 가운데로 지나가게 했다는 표현과 악을 많이 행했다는 표현은 원문의 관용성과 강조를 대체로 잘 보존합니다.
  naturalness: ‘힌놈 아들의 골짜기’가 지명 구조를 더 자연스럽게 드러냅니다. ‘신접한 자와 영매를 가까이했습니다’는 한국 문화 특수어인 ‘무당’을 피하면서도 원문의 관여 의미를 과도하게 ‘상담했다’로 좁히지 않습니다. 각주 표지는 해당 어구 바로 뒤에 배치하는 것이 독해와 표지 연결 면에서 적절합니다.
  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. אֹוב는 ‘신접한 자’, יִדְּעֹנִי는 ‘영매’로 옮겨 서로 다른 술자/행위 범주라는 원문의 병렬을 보존합니다. ‘술법을 부리다’는 כִשֵּׁף에 무난하며, ‘점을 치다’와 ‘길흉을 살피다’는 앞선 두 동사의 구별을 자연스럽게 반영합니다.
  issues:
