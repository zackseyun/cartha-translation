source:
  edition: WLC
  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'sacrificed his sons in the fire.' The Hebrew idiom is literally 'made his sons pass through the fire.'
    reason: lexical_alternative
  - marker: b
    text: '''Mediums and spiritists'' renders Hebrew terms for practitioners associated with consulting the dead or spirits.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 힌놈 아들의 골짜기에서 자기 아들들을 불 가운데로 지나가게 했으며[a], 점을 치고 길흉을 살피며 술법을 부리고, 신접한 자와 영매를 가까이했습니다[b]. 그는 야훼 보시기에 악을 많이 행하여 그분을 노하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 분명하게는 ‘자기 아들들을 불로 희생시켰다’는 뜻일 수 있습니다. 히브리어 관용구는 문자적으로는 ‘자기 아들들을 불 가운데로 지나가게 했다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘신접한 자와 영매’는 죽은 자나 영과 교통하거나 그들에게 묻는 일과 관련된 히브리어 용어들을 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  english_pob_choice: made his sons pass through the fire
  chosen_korean: 자기 아들들을 불 가운데로 지나가게 했으며
  alternatives_korean:
  - 자기 아들들을 불 가운데로 통과하게 했으며
  - 자기 아들들을 불 속에 넣었으며
  lexicon: HALOT
  rationale: 히필 동사의 관용구를 너무 노골적으로 풀지 않고, ‘불 가운데로 지나가게 하다’로 원문의 이미지를 보존했습니다.
- source_word: בְּגֵי בֶן־הִנֹּם
  english_pob_choice: in the Valley of the Son of Hinnom
  chosen_korean: 힌놈의 아들 골짜기에서
  alternatives_korean:
  - 힌놈 아들의 골짜기에서
  - 베엔-힌놈 골짜기에서
  lexicon: HALOT
  rationale: 지명 구조를 살리면서도 현대 한국어에서 읽히도록 음역과 관계 표현을 조정했습니다.
- source_word: וְעוֹנֵן וְנִחֵשׁ וְכִשֵּׁף
  english_pob_choice: practiced soothsaying and divination and sorcery
  chosen_korean: 점을 치고 길흉을 살피고 술법을 부리고
  alternatives_korean:
  - 주술을 행하고 점을 치고 마술을 부리고
  - 복술과 점술과 주술을 행하고
  lexicon: HALOT
  rationale: 서로 구별되는 세 개의 금지된 행위를 한국어에서 중복 없이 살리되, 지나치게 교회식·전통식 어휘로 평탄화하지 않았습니다.
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  english_pob_choice: dealt with mediums and spiritists
  chosen_korean: 무당과 영매를 두었습니다
  alternatives_korean:
  - 무당과 신접자들을 다루었습니다
  - 매개자와 신령 접촉자들을 두었습니다
  lexicon: HALOT
  rationale: 본문이 가리키는 초자연적 중개자들을 현대 한국어에서 이해 가능한 표현으로 옮기되, 직설적이면서도 본문 강도를 유지했습니다.
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  english_pob_choice: He multiplied doing what was evil
  chosen_korean: 그는 야훼 보시기에 악한 일을 많이 하여
  alternatives_korean:
  - 그는 야훼 보시기에 악을 거듭하여 행하여
  - 그는 야훼 보시기에 악한 일을 거듭 많이 하여
  lexicon: HALOT
  rationale: 히필־רבה+부정사구의 반복·증가 뉘앙스를 한국어에서 자연스럽게 ‘많이 하여’로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md Contested terms
  rationale: 본 프로젝트의 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 어린이 희생의 암시를 본문에서 얼마나 명시할지
  chosen_reading: 주석 없이도 본문은 ‘불 가운데로 지나가게 했다’는 관용구를 유지해 암시를 남겼습니다.
  alternative_readings:
  - 아들들을 불에 바쳤다
  - 아들들을 희생 제물로 불살랐다
  rationale: 원문이 직접 쓰는 관용구를 보존하고, 해석을 본문에 과도하게 앞당기지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: יוָה의 고유명 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - the LORD
  rationale: 이 본문은 יהוה를 직접 사용하므로, 프로젝트 용례에 따라 고유한 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
