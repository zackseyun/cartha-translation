source:
  edition: WLC
  text: וַ/יִּ֥בֶן אֶת תַּדְמֹ֖ר בַּ/מִּדְבָּ֑ר וְ/אֵת֙ כָּל עָרֵ֣י הַֽ/מִּסְכְּנ֔וֹת אֲשֶׁ֥ר בָּנָ֖ה בַּ/חֲמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/004.yaml
  text: He built Tadmor in the wilderness[a], and all the storage cities that he built in Hamath.
  footnotes:
  - marker: a
    text: Tadmor is traditionally identified with Palmyra.
    reason: cross_reference
translation:
  language: ko
  text: 그는 광야에 다드몰을 건축했으며, 하맛에 그가 건축한 모든 저장 성읍도 건축했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다드몰은 전통적으로 팔미라와 동일시됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: He built
  chosen_korean: 건축했습니다
  alternatives_korean:
  - 세웠습니다
  - 지었습니다
  lexicon: HALOT
  rationale: 완료된 역사 서술의 동작을 자연스러운 현대 한국어로 옮기되, 도시를 세우는 맥락이 드러나도록 ‘건축했습니다’를 택했습니다.
- source_word: תַּדְמֹר
  english_pob_choice: Tadmor
  chosen_korean: 다드몰
  alternatives_korean:
  - 타드모르
  - 팔미라
  lexicon: HALOT
  rationale: 고유지명은 음역을 따르되, 영어 POB가 주석에서 Palmyra를 별도 설명하므로 본문에는 원형 지명을 반영한 음역을 유지했습니다.
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  english_pob_choice: all the storage cities
  chosen_korean: 모든 저장 성읍들
  alternatives_korean:
  - 모든 저장 도시들
  - 모든 비축 성읍들
  - 모든 창고 성읍들
  lexicon: HALOT
  rationale: מִסְכְּנוֹת의 기능이 물자 저장용 성읍들이므로, 전통적이지만 다소 낡은 ‘저장 성읍’보다 기능을 드러내는 표현을 사용했습니다.
- source_word: בַּחֲמָת
  english_pob_choice: in Hamath
  chosen_korean: 하맛에 있는
  alternatives_korean:
  - 하맛에
  - 하맛의
  lexicon: HALOT
  rationale: 지명 앞의 ב를 한국어에서 자연스럽게 풀어 ‘-에 있는’으로 옮겨, 뒤의 관계절과 함께 읽히도록 했습니다.
