  yaml_path: translation/ot/2_chronicles/008/005.yaml
  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
  footnotes:
  - marker: a
    text: Or 'fortress cities.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'doors'; this likely refers to the gate-doors of the fortified cities.
    reason: lexical_alternative
  - marker: c
    text: Or 'bars' could be rendered 'bolts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 상부 벧호론과 하부 벧호론을 건축하고, 성벽과 문짝과 빗장을 갖춘 요새 도시들을 세웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: And he built
  chosen_korean: 건축하고
  alternatives_korean:
  - 세우고
  - 지었고
  - 재건하고
  lexicon: HALOT
  rationale: 본문의 동사 בנה는 단순한 건축 행위를 나타내므로, ‘재건’처럼 복구 의미를 앞세우지 않고 ‘건축하다’로 옮겼습니다.
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן / בֵּית חוֹרוֹן הַתַּחְתּוֹן
  english_pob_choice: Upper Beth-horon / Lower Beth-horon
  chosen_korean: 상부 벧호론과 하부 벧호론
  alternatives_korean:
  - 윗 벧호론과 아랫 벧호론
  - 상층 벧호론과 하층 벧호론
  lexicon: HALOT
  rationale: 지명은 음역을 유지하되, 상·하의 지리적 대조를 한국어로 자연스럽게 드러내기 위해 ‘상부/하부’를 사용했습니다.
- source_word: עָרֵי מָצוֹר
  english_pob_choice: fortified cities
  chosen_korean: 요새 도시들
  alternatives_korean:
  - 요새화된 도시들
  - 성채 도시들
  - 견고한 도시들
  lexicon: HALOT
  rationale: מָצוֹר는 방어용 요새성을 가리키므로, 단순한 ‘성벽 도시’보다 군사적 성격이 드러나는 ‘요새 도시들’이 source-direct합니다.
- source_word: חוֹמוֹת דְּלָתַיִם וּבְרִיחַ
  english_pob_choice: walls, doors, and bars
  chosen_korean: 성벽과 문짝과 빗장
  alternatives_korean:
  - 성벽과 문과 빗장
  - 성벽과 문짝과 볼트
  - 담과 문짝과 빗장
  lexicon: HALOT
  rationale: דְּלָתַיִם은 일반적 ‘문’보다 이중문/문짝의 느낌이 강하고, בְּרִיחַ는 문을 잠그는 빗장에 해당하므로 그 기능을 살려 옮겼습니다.
