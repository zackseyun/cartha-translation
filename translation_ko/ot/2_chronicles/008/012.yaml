translation:
  language: ko
  text: 그때 솔로몬은 야훼께 번제물을 야훼의 제단 위에 바쳤습니다. 이 제단은 그가 성전 앞 현관[a]에 지은 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포르티코’, ‘현관 앞의 기둥 있는 입구’로도 옮길 수 있습니다. 히브리어는 성전의 입구 홀을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
