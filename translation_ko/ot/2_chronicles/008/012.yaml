  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
  footnotes:
  - marker: a
    text: Or 'the portico' or 'the porch.' The Hebrew refers to the temple's entrance hall.
