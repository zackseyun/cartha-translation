source:
  edition: WLC
  text: וְ/לֹ֣א סָרוּ֩ מִצְוַ֨ת הַ/מֶּ֜לֶךְ עַל הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם לְ/כָל דָּבָ֖ר וְ/לָ/אֹצָרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
  footnotes:
  - marker: a
    text: Or “and concerning the storehouses.” The Hebrew אֹצָרוֹת can refer to treasuries or storehouses; “treasuries” fits the temple-administrative context here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 제사장들과 레위인들에 관한 모든 일과 보물 창고들에 관하여 왕이 내린 명령에서 벗어나지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֹצָרוֹת은 ‘보물 창고들’ 또는 ‘저장 창고들’을 뜻할 수 있습니다. 여기서는 성전 행정의 문맥에 맞추어 ‘보물 창고들’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹ֣א סָרוּ
  english_pob_choice: did not turn aside
  chosen_korean: 벗어나지 않았습니다
  alternatives_korean:
  - 돌아서지 않았습니다
  - 떠나지 않았습니다
  - 일탈하지 않았습니다
  lexicon: HALOT
  rationale: סור의 핵심 이미지는 방향을 틀어 '벗어남' 또는 '돌아섬'이므로, 한국어로는 자연스럽고 행정적 충실성을 드러내는 '벗어나지 않았습니다'가 가장 잘 맞습니다.
- source_word: מִצְוַת הַמֶּלֶךְ
  english_pob_choice: the king’s command
  chosen_korean: 왕의 명령
  alternatives_korean:
  - 왕의 명령에
  - 왕의 지시
  - 왕의 계명
  lexicon: HALOT
  rationale: מִצְוָה는 여기서 법적·행정적 명령을 뜻하므로, 종교적 색채가 강한 '계명'보다 '명령'이 원문과 POB의 문맥을 더 정확히 반영합니다.
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם לְכָל דָּבָר
  english_pob_choice: concerning the priests and the Levites in any matter
  chosen_korean: 제사장들과 레위인들에 관해, 그리고 모든 일과 보고에 관해
  alternatives_korean:
  - 제사장들과 레위인들에 대하여 어떤 일에서든
  - 제사장들과 레위인들에 관한 모든 일에서
  - 제사장들과 레위인들에 대해 어떤 사안에서든
  lexicon: HALOT
  rationale: עַל + 대상은 '관하여/대하여'가 자연스럽고, לְכָל דָּבָר은 단순한 '모든 일'보다 범위를 넓혀 '모든 일과 보고'로 풀어야 문맥상 왕의 행정 명령이 제사장·레위인의 업무 전반에 적용됨을 드러냅니다.
- source_word: וְלָאֹצָרוֹת
  english_pob_choice: or concerning the treasuries
  chosen_korean: 그리고 … 보고에 관해
  alternatives_korean:
  - 그리고 곳간에 관해
  - 그리고 창고에 관해
  - 그리고 보물고에 관해
  lexicon: HALOT
  rationale: אֹצָרוֹת는 성전 행정 문맥에서 'treasuries'가 적절하며, 한국어에서는 일반적인 '창고'보다 '보고'와 함께 행정적 관리 영역을 나타내는 표현이 더 자연스러워 원문의 의미 범주를 살리도록 옮겼습니다.
theological_decisions:
- issue: 왕의 명령이 제사장과 레위인에게 적용되는 행정적 관계의 표현
  chosen_reading: 본문은 신앙적 교훈을 직접 말하기보다, 성전 조직에서 왕의 명령이 제사장들과 레위인들의 업무 전반과 재정 관리까지 실제로 준수되었음을 말합니다.
  alternative_readings:
  - 영적 순종의 일반 원리로만 읽기
  - 제사장·레위인의 종교적 권위에 대한 강조로 읽기
  rationale: 역대기 문맥에서는 다윗 왕조의 성전 질서와 행정 집행이 핵심이므로, 본문을 추상화하지 않고 역사적·행정적 의미를 유지하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 역대기 성전 질서와 왕권-제사장직의 역사적 서술
