reference: 2 Chronicles 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶ/עָרִ֗ים אֲשֶׁ֨ר נָתַ֤ן חוּרָם֙ לִ/שְׁלֹמֹ֔ה בָּנָ֥ה שְׁלֹמֹ֖ה אֹתָ֑/ם וַ/יּ֥וֹשֶׁב שָׁ֖ם אֶת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
  footnotes:
  - marker: a
    text: Hebrew Huram; traditionally Hiram.
    reason: alternative_reading
  - marker: b
    text: Or 'built them.' The Hebrew verb can mean either 'built' or, in context, 'rebuilt/restored.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'the sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호람이 솔로몬에게 준 도시들에 관하여 말하자면, 솔로몬이 그것들을 다시 세우고 거기에 이스라엘 백성을 살게 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 이름은 חוּרָם으로, 전통적으로는 히람으로도 부릅니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사는 문맥에 따라 ‘세우다’ 또는 ‘다시 세우다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  english_pob_choice: As for the cities
  chosen_korean: 도시들에 관하여 말하자면
  alternatives_korean:
  - 그리고 그 도시들은
  - 그 도시들은
  lexicon: HALOT
  rationale: 문두의 וְ를 단순 접속사로만 옮기기보다, 본절이 앞뒤 서술을 이어 받아 새 항목을 제시하는 흐름이므로 ‘~에 관하여 말하자면’으로 자연스럽게 정리했습니다.
- source_word: חוּרָם
  english_pob_choice: Huram
  chosen_korean: 여호람
  alternatives_korean:
  - 후람
  - 히람
  lexicon: HALOT
  rationale: 원문 자음형은 חוּרָם이므로 음역을 따르되, 한국어 성경 전통에서 널리 통용되는 표기를 고려해 ‘여호람’으로 처리하는 대신 주석 없이 본문에서 일관된 인명 표기를 사용하지 않도록 검토가 필요하지만, 여기서는 원문 인명 차이를 반영하기 위해 서술상 이질감을 최소화한 형태로 옮겼습니다.
- source_word: בָּנָה
  english_pob_choice: rebuilt
  chosen_korean: 다시 세우고
  alternatives_korean:
  - 세우고
  - 재건하고
  lexicon: HALOT
  rationale: 이미 존재하던 도시들을 대상으로 하므로 단순 ‘세우다’보다 ‘다시 세우다’가 POB의 ‘rebuilt’가 담은 복원·재건 뉘앙스를 잘 드러냅니다.
- source_word: וַיּוֹשֶׁב
  english_pob_choice: settled
  chosen_korean: 살게 했습니다
  alternatives_korean:
  - 정착시켰습니다
  - 거주하게 했습니다
  lexicon: HALOT
  rationale: 히필형의 사역 의미를 살리기 위해 단순한 결과 상태보다 ‘살게 하다’로 옮겨, 솔로몬이 사람들을 그곳에 거주하도록 배치한 행위를 드러냈습니다.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the people of Israel
  chosen_korean: 이스라엘 백성
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘이스라엘의 아들들’이지만, 이 문맥에서는 성별이 아니라 공동체 전체를 가리키므로 한국어에서는 자연스럽고 포괄적인 ‘이스라엘 백성’이 적절합니다.
theological_decisions:
- issue: 왕이 점령·재배치한 도시를 설명하는 서술의 톤
  chosen_reading: 솔로몬이 점유된 도시들을 복구한 뒤 이스라엘 백성을 그곳에 거주시키는 행정적·역사적 행위로 읽었습니다.
  alternative_readings:
  - 건축 사업 중심의 단순 도시 건설로 읽을 수 있음
  - 정복지에 대한 식민적 재배치로 더 강하게 읽을 수 있음
  rationale: 원문은 건축과 거주 배치를 함께 말하므로, 정치적 함의를 과장하지 않으면서도 솔로몬의 통치 행위를 분명히 드러내는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 역사서의 서술 목적과 왕권 행정 묘사
- issue: 본문 인명 표기와 전통 표기의 차이
  chosen_reading: 원문 자음형에 따라 인명을 음역해야 합니다.
  alternative_readings:
  - 익숙한 전통 표기 ‘히람’을 사용할 수 있음
  rationale: POB 원칙상 מקור어 표기를 우선해야 하므로, 전통 명칭보다 स्रोत 형식을 반영하는 쪽이 본문 이해와 감사 가능성을 높입니다.
  doctrine_reference: 원문 우선 원칙
