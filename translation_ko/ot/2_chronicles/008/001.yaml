  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
  footnotes:
  - marker: a
    text: Or 'his palace.' The Hebrew reads literally 'his house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이십 년이 끝날 무렵, 곧 솔로몬이 야훼의 집과 자기 집을 건축하였을 때였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 …였습니다
  alternatives_korean:
  - 그리고 …되었습니다
  - 그리고 …이 있었습니다
  lexicon: HALOT
  rationale: 새로운 서술 전환을 알리는 서두로, 현대 한국어에서 자연스럽고 문어체에 맞는 「그리고 …였습니다」를 사용했습니다.
- source_word: מִקֵּץ עֶשְׂרִים שָׁנָה
  english_pob_choice: at the end of twenty years
  chosen_korean: 이십 년이 끝날 무렵
  alternatives_korean:
  - 이십 년의 끝에
  - 이십 년이 지난 끝에
  lexicon: HALOT
  rationale: 시간 경과의 도달점을 자연스럽게 살려, 직역의 어색함을 줄이면서도 원문의 시점 의미를 유지했습니다.
- source_word: בָּנָה
  english_pob_choice: had built
  chosen_korean: 건축하였을 때
  alternatives_korean:
  - 지었을 때
  - 세웠을 때
  lexicon: HALOT
  rationale: 완료된 건축 행위를 드러내기 위해 과거완료의 결과 상태를 반영했습니다. 「건축하다」는 원문의 건축 행위를 비교적 직접적으로 보여 줍니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: בהיִת의 기본 의미인 「집」을 살리고, 프로젝트 기본값에 따라 יְהוָה는 「야훼」로 옮겼습니다. 「성전」은 해석이 더 들어간 표현이므로 본문에서는 피했습니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his own house
  chosen_korean: 자기 집
  alternatives_korean:
  - 그의 집
  - 자기 궁전
  lexicon: HALOT
  rationale: 히브리어의 소유 대명사를 반영하되, 솔로몬의 왕궁을 뜻할 수 있는 가능성은 각주로 처리하지 않고 본문에서는 원문 그대로 「집」을 유지했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 본문에서 「야훼」를 사용했습니다.
  alternative_readings:
  - 「주님」
  - 「여호와」
  rationale: 이 프로젝트의 기본 원칙에 따라 신명기적 언약 이름을 가려 버리는 관습적 대체어보다 원문 식별성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
