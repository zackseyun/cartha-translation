- source_word: בָּנָה
  english_pob_choice: had built
  chosen_korean: 건축하였을 때
  alternatives_korean:
  - 지었을 때
  - 세웠을 때
  lexicon: HALOT
  rationale: 완료된 건축 행위를 드러내기 위해 과거완료의 결과 상태를 반영했습니다. 「건축하다」는 원문의 건축 행위를 비교적 직접적으로 보여 줍니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: בהיִת의 기본 의미인 「집」을 살리고, 프로젝트 기본값에 따라 יְהוָה는 「야훼」로 옮겼습니다. 「성전」은 해석이 더 들어간 표현이므로 본문에서는 피했습니다.
- source_word: בֵּיתוֹ
  english_pob_choice: his own house
  chosen_korean: 자기 집
  alternatives_korean:
  - 그의 집
  - 자기 궁전
  lexicon: HALOT
  rationale: 히브리어의 소유 대명사를 반영하되, 솔로몬의 왕궁을 뜻할 수 있는 가능성은 각주로 처리하지 않고 본문에서는 원문 그대로 「집」을 유지했습니다.
