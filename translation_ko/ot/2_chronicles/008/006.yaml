source:
  edition: WLC
  text: וְ/אֶֽת בַּעֲלָ֗ת וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ כָּל עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת כָּל חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירֽוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
  footnotes:
  - marker: a
    text: Or 'store cities,' 'supply cities,' or possibly 'treasure cities.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all the desire of Solomon that he desired to build,' a cognate expression emphasizing Solomon's wish or pleasure.
    reason: lexical_alternative
  - marker: c
    text: Or 'the cities for horses'; the Hebrew more commonly refers to horsemen/cavalry.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 바알랏과[a] 솔로몬에게 속한 모든 저장 도시[b]와 모든 병거 도시와 기병들의 도시[c]와, 솔로몬이 예루살렘과 레바논과 그의 통치 아래 있는 온 땅에 짓고자 한 모든 것을 건축하였습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 바알랏은 지명입니다. ‘바알라트’로도 음역할 수 있습니다.
    reason: proper_name_transliteration
  - marker: b
    text: 또는 ‘창고 도시’, ‘보급 도시’, 또는 ‘보물 도시’일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘말들을 위한 도시’. 히브리어는 보통 말 자체보다 기병 또는 기마병을 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘솔로몬이 짓기를 원한 솔로몬의 모든 원함’입니다. 히브리어는 같은 어근을 반복하여 그의 바람 또는 뜻을 강조합니다.
    reason: cognate_expression
lexical_decisions:
- source_word: בַּעֲלָת
  english_pob_choice: Baalath
  chosen_korean: 바알랏
  alternatives_korean:
  - 바알라트
  lexicon: HALOT
  rationale: 고유 지명은 번역하지 않고 음역하는 것이 원문 지시를 가장 잘 보존하므로, 현대 외래어 표기 관행에 맞춰 바알랏으로 옮겼습니다.
- source_word: עָרֵי הַמִּסְכְּנוֹת
  english_pob_choice: storage cities
  chosen_korean: 저장 도시
  alternatives_korean:
  - 창고 도시
  - 비축 도시
  - 보물 도시
  lexicon: HALOT
  rationale: 문맥상 물자와 공급을 저장하는 도시들이므로, ‘storage cities’의 기능을 드러내는 간결한 표현으로 저장 도시를 선택했습니다.
- source_word: עָרֵי הַפָּרָשִׁים
  english_pob_choice: the cities of the horsemen
  chosen_korean: 기병들의 도시
  alternatives_korean:
  - 말들의 도시
  - 기병 도시
  - 기마병들의 도시
  lexicon: HALOT
  rationale: פָּרָשִׁים은 말 자체보다 기병/기마병을 가리키므로, 병거 도시와 구별되도록 기병들의 도시로 옮겼습니다.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  english_pob_choice: all that Solomon desired
  chosen_korean: 솔로몬이 예루살렘과 레바논과 그의 통치 아래 있는 온 땅에 짓고자 한 모든 것
  alternatives_korean:
  - 솔로몬의 모든 소원
  - 솔로몬이 바라던 모든 것
  - 솔로몬의 온갖 इच्छा
  lexicon: HALOT
  rationale: 히브리어는 명사-동사 어근 반복으로 ‘소망/원함’을 강조하지만, 한국어에서는 ‘짓고자 한’으로 풀어 원문의 의도와 문맥의 건축 행위를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 왕의 건축 행위의 범위와 뉘앙스
  chosen_reading: ‘짓고자 한 모든 것’을 유지해 솔로몬의 개인적 열망과 실제 건축 계획의 긴장을 함께 보이도록 했습니다.
  alternative_readings:
  - ‘원했던 모든 것’
  - ‘건축하려 했던 모든 것’
  rationale: 원문은 단순한 소망이 아니라 건축을 향한 소망을 말하므로, 한국어에서도 동사 ‘짓다’를 넣어 행위 지향성을 보존하는 편이 낫습니다.
  doctrine_reference: 왕권/성전-성읍 건축의 역사 서술
