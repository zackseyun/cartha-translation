  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן בְּנֵי֙ יִשְׂרָאֵ֔ל אֲ֠שֶׁר לֹא נָתַ֧ן שְׁלֹמֹ֛ה לַ/עֲבָדִ֖ים לִ/מְלַאכְתּ֑/וֹ כִּי הֵ֜מָּה אַנְשֵׁ֤י מִלְחָמָה֙ וְ/שָׂרֵ֣י שָׁלִישָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make slaves for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew reads 'the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'did not assign any of them as slaves for his labor.' The Hebrew expression refers to placing them in slave labor.
    reason: lexical_alternative
  - marker: c
    text: The term rendered 'officers' likely refers to elite military officials or aides; more specific renderings such as 'captains' are possible.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스라엘 자손 중에서는 솔로몬이 그의 일을 위하여 노예로 삼지 않았습니다. 그들은 전사들이며, 그의 장관들과 그의 병거의 지휘관들과 그의 기병들이었기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 히브리어의 직역입니다. ‘이스라엘 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘노예로 삼지 않았다’는 표현은 히브리어가 실제로는 노역에 종사시키는 처지를 가리킨다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘장관들’은 שָׁלִישׁ의 뜻을 지나치게 좁히지 않기 위한 번역입니다. ‘장교들’이나 ‘지휘관들’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי יִשְׂרָאֵל
  english_pob_choice: But from the sons of Israel
  chosen_korean: 그러나 이스라엘 자손 중에서는
  alternatives_korean:
  - 그러나 이스라엘의 아들들 중에서는
  - 그러나 이스라엘인들 가운데서는
  lexicon: HALOT
  rationale: 문두의 וּ/מִן은 앞절과의 대비를 살려 ‘그러나 … 중에서는’로 옮겼고, בְּנֵי יִשְׂרָאֵל은 본문 질감을 살려 ‘이스라엘 자손’으로 직역했습니다.
- source_word: לֹא נָתַן שְׁלֹמֹה לַעֲבָדִים
  english_pob_choice: Solomon did not make slaves
  chosen_korean: 솔로몬이 그의 일을 위하여 노예로 삼지 않았습니다
  alternatives_korean:
  - 솔로몬이 노예로 만들지 않았습니다
  - 솔로몬이 종으로 삼지 않았습니다
  lexicon: HALOT
  rationale: לַעֲבָדִים은 단순한 ‘종’보다 강한 강제 노역/노예 상태를 가리키므로, POB의 선택을 따라 ‘노예로 삼지 않았다’로 옮겨 본문의 강도를 보존했습니다.
- source_word: לִמְלַאכְתּוֹ
  english_pob_choice: for his work
  chosen_korean: 그의 일을 위하여
  alternatives_korean:
  - 그의 노동을 위하여
  - 그의 일에
  lexicon: HALOT
  rationale: מְלָאכָה는 솔로몬에게 부과될 공적 노역을 가리킬 수 있어, 자연스럽고 넓은 의미를 유지하는 ‘그의 일’을 택했습니다.
- source_word: אַנְשֵׁי מִלְחָמָה
  english_pob_choice: men of war
  chosen_korean: 전사들이며
  alternatives_korean:
  - 전쟁의 사람들이며
  - 용사들이며
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 가장 간결하게 살릴 수 있는 ‘전사들’로 옮겼습니다. 이는 군사적 역할을 분명히 드러냅니다.
- source_word: שָׂרֵי שָׁלִישָׁיו
  english_pob_choice: his officers
  chosen_korean: 그의 장관들과
  alternatives_korean:
  - 그의 장교들과
  - 그의 관리들과
  lexicon: HALOT
  rationale: שָׁלִישׁ는 엘리트 군사 관료/보좌관 계열의 불분명한 용어이므로, 지나친 특정화를 피하면서도 지위의 높이를 드러내는 ‘장관들’로 옮겼습니다.
- source_word: שָׂרֵי רִכְבּוֹ וּפָרָשָׁיו
  english_pob_choice: the commanders of his chariots and his horsemen
  chosen_korean: 그의 병거의 지휘관들과 그의 기병들이었기 때문입니다
  alternatives_korean:
  - 그의 병거 지휘관들과 그의 기병들이었기 때문입니다
  - 그의 전차 부대 지휘관들과 그의 기병들이었기 때문입니다
  lexicon: HALOT
  rationale: שָׂרֵי는 ‘지휘관들’로, רִכְבּוֹ는 군사 맥락을 살려 ‘병거’로, פָרָשָׁיו는 표준적인 ‘기병들’로 옮겨 문맥의 군사 열거를 유지했습니다.
theological_decisions:
- issue: עֲבָדִים의 사회적 강도
  chosen_reading: 이스라엘 자손에게는 노예화를 적용하지 않았다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 고용된 종으로 삼지 않았다는 뜻
  - 일반적 하인 직분을 주지 않았다는 뜻
  rationale: 본문의 대비는 주변 절의 강제 노역과 연결되므로, 사회적 강도를 약화시키는 ‘종’보다 ‘노예’가 source-direct하게 본문의 의미를 드러냅니다.
  doctrine_reference: 출애굽기/열왕기·역대기의 강제노동 문맥
