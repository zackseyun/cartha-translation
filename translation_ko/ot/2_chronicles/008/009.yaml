  rationale: 병거와 기병을 모두 수식하는 ‘지휘관들’의 통사 관계를 회복했습니다. שָׂרֵי שָׁלִישָׁיו의 정확한 직책이 불확실하므로 현대 정부 직함을 연상시키는 ‘장관들’을 포괄적인 ‘관원들’로 바꾸고, 가능한 대안을 각주에 보존했습니다. ‘그들을’을 보충하여 한국어에서 노예화의 대상을 명확히 했으며, 이는 원문의 목적어가 문맥상 선행하는 이스라엘 자손임을 드러낼 뿐 의미를 추가하지 않습니다.
