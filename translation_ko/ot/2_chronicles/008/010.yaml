base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/010.yaml
  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
  footnotes:
  - marker: a
    text: Or “overseers” for “deputies”; the Hebrew term refers to appointed officials under royal authority.
    reason: lexical_alternative
  - marker: b
    text: Or “who supervised the people” or “who were in charge of the people”; the verb can denote exercising authority in an administrative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕의 관리들을 거느린 우두머리들은 모두 이백오십 명이었으며, 백성을 다스렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관리들’로 옮긴 히브리어 נְצִיבִים은 왕의 권위 아래 임명된 관리들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다스렸습니다’에 해당하는 말은 행정적으로 권한을 행사하거나 관할하는 뜻을 나타낼 수도 있습니다.
    reason: lexical_alternative
