base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/010.yaml
  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
  footnotes:
  - marker: a
    text: Or “overseers” for “deputies”; the Hebrew term refers to appointed officials under royal authority.
    reason: lexical_alternative
  - marker: b
    text: Or “who supervised the people” or “who were in charge of the people”; the verb can denote exercising authority in an administrative sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것들은 솔로몬 왕의 부관들이었습니다. 모두 이백오십 명이었고, 백성을 다스렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부관들’은 히브리어 נְצִיבִים의 행정적 직분을 풀어 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다스렸습니다’는 이 문맥에서 행정적 통치 또는 관할을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַנְּצִיבִים
  english_pob_choice: chiefs of ... deputies
  chosen_korean: 부관들
  alternatives_korean:
  - 감독들
  - 관리들
  - 대리자들
  lexicon: HALOT
  rationale: 복합 표현은 왕권 아래 임명된 행정 책임자들을 가리키므로, 한국어에서는 직역을 늘이기보다 문맥상 기능이 드러나는 ‘부관들’로 간결하게 옮겼습니다.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  english_pob_choice: two hundred and fifty
  chosen_korean: 이백오십 명
  alternatives_korean:
  - 두백오십 명
  - 이백오십명
  lexicon: HALOT
  rationale: 히브리어 수사를 표준 한국어 수량 표현으로 자연스럽게 옮겼습니다.
- source_word: הָרֹדִים בָּעָם
  english_pob_choice: who ruled over the people
  chosen_korean: 백성을 다스렸습니다
  alternatives_korean:
  - 백성을 다스렸던 사람들입니다
  - 백성을 감독했습니다
  - 백성 위에 권세를 행사했습니다
  lexicon: HALOT
  rationale: רדה는 단순 감독보다 통치·지배의 뉘앙스가 있어, 행정 문맥을 반영하되 의미를 약화하지 않는 ‘다스리다’를 선택했습니다.
