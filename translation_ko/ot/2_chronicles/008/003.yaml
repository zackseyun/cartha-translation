  text: Then Solomon went to Hamath-zobah and prevailed against it[a].
  footnotes:
  - marker: a
    text: Or "prevailed over it" or "took control of it." The Hebrew idiom is literally "was strong over it."
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬은 하맛-소바로 가서 그것을 굴복시켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것을 이겼다”, “그것을 장악했다”. 히브리어 관용구는 문자적으로는 “그것 위에 강해졌다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 살리되, 히브리어 자체가 여기서 직접적으로 적대 행위를 표시하지는 않으므로 ‘가서’로 옮겼습니다.
- source_word: חֲמָת צוֹבָה
