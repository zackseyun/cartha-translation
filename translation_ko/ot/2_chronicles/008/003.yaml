  yaml_path: translation/ot/2_chronicles/008/003.yaml
  text: Then Solomon went to Hamath-zobah and prevailed against it[a].
  footnotes:
  - marker: a
    text: Or "prevailed over it" or "took control of it." The Hebrew idiom is literally "was strong over it."
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬은 하맛소바로 가서 그곳에 맞서 우세를 점했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그곳을 압도했다”, “그곳을 장악했다”. 히브리어 관용구는 문자적으로 “그곳에 대하여 강해졌다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 갔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: 서술 흐름을 자연스럽게 살리되, 히브리어 자체가 여기서 직접적으로 적대 행위를 표시하지는 않으므로 ‘가서’로 옮겼습니다.
- source_word: חֲמָת צוֹבָה
  english_pob_choice: Hamath-zobah
  chosen_korean: 하맛-소바
  alternatives_korean:
  - 하맛-조바
  - 하맛-소바
  lexicon: HALOT
  rationale: 두 지명이 결합된 형태를 보존하기 위해 하이픈으로 연결해 음역했습니다.
- source_word: וַיֶּחֱזַק עָלֶיהָ
  english_pob_choice: prevailed against it
  chosen_korean: 그것을 굴복시켰습니다
  alternatives_korean:
  - 그것을 압도했습니다
  - 그것을 이겨냈습니다
  - 그것을 제압했습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그것 위에 강해지다/그것을 상대로 강해지다’의 관용구이므로, 왕의 군사적 결과를 드러내는 한국어로 ‘굴복시켰습니다’가 가장 자연스럽습니다.
