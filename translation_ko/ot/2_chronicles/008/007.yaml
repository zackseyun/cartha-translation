  english_pob_choice: the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites
  chosen_korean: 히타이트 사람들, 아모리 사람들, 브리스 사람들, 히위 사람들, 여부스 사람들
  alternatives_korean:
  - 헷 사람들, 아모리 사람들, 브리스 사람들, 히위 사람들, 여부스 사람들
  lexicon: HALOT
  rationale: 민족명은 현대 한국어 음역을 따르되, 히브리어 복수 집합을 반영하여 모두 ‘사람들’로 처리했습니다.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  english_pob_choice: who were not from Israel
  chosen_korean: 이스라엘에 속하지 않은 사람들이었습니다
  alternatives_korean:
