    text: 또는 ‘이스라엘 출신이 아닌.’ 히브리어는 더 문자적으로 ‘이스라엘에서/이스라엘로부터’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 사람
