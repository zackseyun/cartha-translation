  - 이스라엘 사람들은 아니었습니다
  lexicon: HALOT
  rationale: מִן의 출처 뉘앙스를 살리면서도 한국어에서는 ‘이스라엘에 속하지 않은’이 가장 자연스럽고, POB의 ‘from Israel’을 과도하게 민족론적으로 좁히지 않도록 했습니다.
theological_decisions:
- issue: 이스라엘에 대한 소속 표현의 범위
  chosen_reading: ‘이스라엘에 속하지 않은 사람들’로 두어 출처/소속의 구분을 강조했습니다.
  alternative_readings:
  - ‘이스라엘 사람이 아닌 사람들이었습니다’
  - ‘이스라엘 민족이 아니었습니다’
  rationale: 히브리어는 מִיִּשְׂרָאֵל(‘이스라엘로부터/이스라엘에서’)이라고만 하므로, 민족적·법적 동일시를 과도하게 덧씌우지 않고 원문의 소속 구분을 유지했습니다.
  doctrine_reference: 본문 관찰/번역 원칙
