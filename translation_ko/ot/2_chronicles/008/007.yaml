  text: כָּל הָ֠/עָם הַ/נּוֹתָ֨ר מִן הַ/חִתִּ֜י וְ/הָ/אֱמֹרִ֤י וְ/הַ/פְּרִזִּי֙ וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֔י אֲשֶׁ֛ר לֹ֥א מִ/יִּשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
  footnotes:
  - marker: a
    text: Or, 'who were not Israelites.' The Hebrew more literally says, 'who were not from Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 히타이트 사람들과 아모리 사람들과 브리스 사람들과 히위 사람들과 여부스 사람들 가운데서 남아 있던 모든 사람—곧 이스라엘에 속하지 않은 사람들이었습니다—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들이 아니었습니다.’ 히브리어는 더 문자적으로 ‘이스라엘에서/이스라엘로부터’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 백성
  - 모든 인민
  lexicon: HALOT
  rationale: 집합적 표현인 כָּל הָעָם을 한국어에서는 가장 자연스럽게 ‘모든 사람’으로 옮기되, 문맥상 남아 있던 비이스라엘 집단 전체를 가리키는 의미를 유지했습니다.
- source_word: הַנּוֹתָר
  english_pob_choice: who were left
  chosen_korean: 남아 있던
  alternatives_korean:
  - 남은
  - 남겨진
  lexicon: HALOT
  rationale: 분사형이 ‘남아 남은 상태에 있던 사람들’을 가리키므로, 역사 서술에 자연스러운 ‘남아 있던’으로 옮겼습니다.
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  english_pob_choice: the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites
  chosen_korean: 히타이트 사람들, 아모리 사람들, 브리스 사람들, 히위 사람들, 여부스 사람들
  alternatives_korean:
  - 헷 사람들, 아모리 사람들, 브리스 사람들, 히위 사람들, 여부스 사람들
  lexicon: HALOT
  rationale: 민족명은 현대 한국어 음역을 따르되, 히브리어 복수 집합을 반영하여 모두 ‘사람들’로 처리했습니다.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  english_pob_choice: who were not from Israel
  chosen_korean: 이스라엘에 속하지 않은 사람들이었습니다
  alternatives_korean:
  - 이스라엘 출신이 아니었습니다
  - 이스라엘 사람들은 아니었습니다
  lexicon: HALOT
  rationale: מִן의 출처 뉘앙스를 살리면서도 한국어에서는 ‘이스라엘에 속하지 않은’이 가장 자연스럽고, POB의 ‘from Israel’을 과도하게 민족론적으로 좁히지 않도록 했습니다.
theological_decisions:
- issue: 이스라엘에 대한 소속 표현의 범위
  chosen_reading: ‘이스라엘에 속하지 않은 사람들’로 두어 출처/소속의 구분을 강조했습니다.
  alternative_readings:
  - ‘이스라엘 사람이 아닌 사람들이었습니다’
  - ‘이스라엘 민족이 아니었습니다’
  rationale: 히브리어는 מִיִּשְׂרָאֵל(‘이스라엘로부터/이스라엘에서’)이라고만 하므로, 민족적·법적 동일시를 과도하게 덧씌우지 않고 원문의 소속 구분을 유지했습니다.
  doctrine_reference: 본문 관찰/번역 원칙
