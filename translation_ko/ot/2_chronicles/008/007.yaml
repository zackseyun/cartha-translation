  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
  footnotes:
  - marker: a
    text: Or, 'who were not Israelites.' The Hebrew more literally says, 'who were not from Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 히타이트 사람들, 아모리 사람들, 브리스 사람들, 히위 사람들, 여부스 사람들 가운데 남아 있던 모든 사람, 곧 이스라엘 사람이 아닌[a] 사람들은—
  philosophy: optimal-equivalence
  footnotes:
