id: 2CH.8.8
reference: 2 Chronicles 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִן בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נוֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֥ר לֹֽא כִלּ֖וּ/ם בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַ֔ס עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
  footnotes:
  - marker: a
    text: Or 'the Israelites had not wiped out.' The Hebrew says 'the sons of Israel,' a standard national designation.
    reason: lexical_alternative
  - marker: b
    text: Or 'for labor levy.' The Hebrew term refers to compulsory state labor.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 자손 가운데서, 곧 그들 뒤에 이 땅에 남아 있던 자들, 이스라엘 자손이 멸하지 않은 자들을 솔로몬이 오늘날까지 노역에 동원하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들이 멸하지 않은 자들’입니다. 히브리어는 표준 민족 호칭인 ‘이스라엘 자손’을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘노역 할당’입니다. 히브리어 용어는 강제적인 국가 노역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  english_pob_choice: From their descendants
  chosen_korean: 그들의 자손 가운데서
  alternatives_korean:
  - 그들의 아들들 가운데서
  - 그들의 자녀들 가운데서
  lexicon: HALOT
  rationale: בְּנֵי는 직역하면 ‘아들들’이지만, 족보·민족 문맥에서는 ‘자손’이 더 넓은 지시 대상을 자연스럽게 드러냅니다.
- source_word: נוֹתְרוּ אַחֲרֵיהֶם
  english_pob_choice: who were left after them
  chosen_korean: 그들 뒤에 이 땅에 남아 있던 자들
  alternatives_korean:
  - 그들 뒤에 남은 자들
  - 그들 뒤에 살아남은 자들
  lexicon: HALOT
  rationale: נוֹתְרוּ는 ‘남다/남겨지다’의 결과 상태를 나타내므로, 단순한 생존보다 ‘이 땅에 남아 있던’이라는 문맥적 표현이 원문에 가깝습니다.
- source_word: לְמַס
  english_pob_choice: for forced labor
  chosen_korean: 노역에 동원하였습니다
  alternatives_korean:
  - 강제 노역에 부렸습니다
  - 노역 부과를 했습니다
  lexicon: HALOT
  rationale: מַס은 공납성 강제 노역을 가리키므로, 현대 한국어에서는 ‘노역에 동원하다’가 행정적 강제성을 살리면서도 자연스럽습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 이 날까지
  - 이때까지
  lexicon: HALOT
  rationale: 히브리어 관용구는 본문 시점까지 지속됨을 뜻하므로, 한국어 성경 문체에서 익숙한 ‘오늘날까지’로 옮겼습니다.
theological_decisions:
- issue: 솔로몬의 조치인 לְמַס의 성격
  chosen_reading: 본 절은 정복 이후 남은 주민을 솔로몬이 국가적 강제 노역 체계에 편입한 것으로 읽었습니다.
  alternative_readings:
  - 일반적인 세금 징수로 완화해 읽는 견해
  - 단순한 부역 동원으로만 읽는 견해
  rationale: 문맥과 לְמַס의 용례가 행정적 강제 노동을 가리키므로, 본문의 정치·사회적 긴장을 약화시키지 않고 반영하는 것이 더 적절합니다.
  doctrine_reference: 구약 내 왕권과 종속 노동의 역사적 서술
