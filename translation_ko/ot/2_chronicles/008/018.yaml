reference: 2 Chronicles 8:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּֽשְׁלַֽח ל/וֹ֩ חוּרָ֨ם בְּ/יַד עֲבָדָ֜י/ו אוניות וַ/עֲבָדִים֮ י֣וֹדְעֵי יָם֒ וַ/יָּבֹ֜אוּ עִם עַבְדֵ֤י שְׁלֹמֹה֙ אוֹפִ֔ירָ/ה וַ/יִּקְח֣וּ מִ/שָּׁ֔ם אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים כִּכַּ֣ר זָהָ֑ב וַ/יָּבִ֖יאוּ אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
  footnotes:
  - marker: a
    text: Hebrew 'by the hand of his servants,' an idiom meaning 'through his servants.'
    reason: cultural_note
  - marker: b
    text: Or 'servants experienced at sea' or simply 'sailors.' The Hebrew reads literally 'servants knowing the sea.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew has 'brought them'; English could also render 'brought it,' referring collectively to the gold.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 후람은 그의 종들의 손을 통해 배와 바다를 아는 종들을 보냈습니다. 그들은 솔로몬의 종들과 함께 오빌로 가서 거기서 금 사백오십 달란트를 가져와 솔로몬 왕에게 가져갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘그의 종들의 손을 통해’는 ‘그의 종들을 통해’라는 뜻입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘바다를 아는 종들’로, ‘뱃사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד עֲבָדָיו
  english_pob_choice: by the hand of his servants
  chosen_korean: 그의 종들의 손을 통해
  alternatives_korean:
  - 그의 종들을 통해
  - 그의 종들로 말미암아
  lexicon: HALOT
  rationale: 히브리어 관용구의 매개적 행위를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘손을 통해’로 옮겼습니다.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  english_pob_choice: servants who knew the sea
  chosen_korean: 바다를 아는 종들
  alternatives_korean:
  - 바다에 익숙한 종들
  - 해상 경험이 있는 종들
  - 뱃사람들
  lexicon: HALOT
  rationale: POB의 핵심은 ‘종들’이라는 신분 표시와 해양 지식입니다. ‘뱃사람들’은 의미는 쉽지만 עבדים를 약화하므로 피했습니다.
- source_word: אֳנִיּוֹת
  english_pob_choice: ships
  chosen_korean: 배
  alternatives_korean:
  - 배들
  - 선박
  lexicon: HALOT
  rationale: 문맥상 오빌로 가는 해상 원정이므로 ‘배’가 자연스럽고, 한국어 합쇼체 문장 흐름에도 잘 맞습니다.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  english_pob_choice: four hundred and fifty talents of gold
  chosen_korean: 금 사백오십 달란트
  alternatives_korean:
  - 금 450 달란트
  - 금 사백오십 달란트의 양
  lexicon: HALOT
  rationale: 고대 중량 단위 ‘달란트’를 유지해 역사성을 보존했고, 히브리어의 수량 표현을 직역에 가깝게 반영했습니다.
theological_decisions:
- issue: 왕실 원정의 주체와 종속 관계
  chosen_reading: 후람이 보내는 대상은 솔로몬이지만, 본문은 ‘그의 종들의 손을 통해’라는 매개 표현을 통해 전달 경로를 강조합니다.
  alternative_readings:
  - 후람이 직접 솔로몬에게 보냈다는 단순 서술
  - 후람이 하무랄/히람 계열 인명 변형으로 별개 인물이라는 독해
  rationale: 히브리어 관용구 자체가 중개 행위를 강조하므로, 단순화해 관계를 흐리지 않고 전달 방식의 간접성을 보존했습니다.
  doctrine_reference: 본문 의미 보존 원칙
