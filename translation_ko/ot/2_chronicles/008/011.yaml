base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'for holy are they to which the ark of the LORD has come'; the translation makes the implied plural referent explicit as 'the places.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬은 파라오의 딸을 다윗 성에서 그녀를 위해 지은 집으로 올려 옮겼습니다. 그는 “내 아내는 이스라엘 왕 다윗의 집에서 살지 않을 것입니다. 야훼의 궤가 이른 곳들[a]은 거룩하기 때문입니다”라고 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것들은 거룩하다. 야훼의 궤가 그것들에게 이르렀다’라고 하며, 두 표현 모두 복수형입니다. 문맥상 암시된 대상을 한국어에서 ‘곳들’로 드러내었습니다.
    reason: source_note
lexical_decisions:
- source_word: הֶעֱלָה
  english_pob_choice: brought ... up
  chosen_korean: 올려보냈습니다
  alternatives_korean:
  - 데리고 올라갔습니다
  - 올려갔습니다
  - 데려갔습니다
  lexicon: HALOT
  rationale: העלה의 ‘위로 데려가다/올리다’라는 방향성을 살리면서, 거처 이동을 자연스럽게 표현했습니다.
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  english_pob_choice: to the house that he had built for her
  chosen_korean: 그를 위해 지은 집으로
  alternatives_korean:
  - 그녀를 위해 지은 집으로
  - 그를 위해 지은 궁전으로
  - 그를 위해 지은 저택으로
  lexicon: HALOT
  rationale: בַּיִת의 기본값을 ‘집’으로 유지했고, 히브리어의 목적 대명사 לָהּ를 한국어에서 자연스럽게 ‘그를 위해’로 옮겼습니다.
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  english_pob_choice: My wife shall not live
  chosen_korean: 내 아내는 … 살지 못합니다
  alternatives_korean:
  - 내 아내는 … 거주하지 못합니다
  - 여자는 … 살지 못합니다
  - 내 아내는 … 머물지 못합니다
  lexicon: HALOT
  rationale: אִשָּׁה를 여기서는 솔로몬의 배우자를 가리키는 말로 읽어 ‘아내’로 옮겼고, תֵשֵׁב의 거주 의미는 ‘살다’로 자연스럽게 살렸습니다.
- source_word: קֹדֶשׁ הֵמָּה
  english_pob_choice: are holy
  chosen_korean: 거룩하기 때문입니다
  alternatives_korean:
  - 거룩합니다
  - 성스럽기 때문입니다
  - 거룩한 곳이기 때문입니다
  lexicon: HALOT
  rationale: 복수 주어가 지닌 거룩함의 이유를 한국어에서는 원인절로 풀어, 뒤의 설명을 간결하고 명료하게 만들었습니다.
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  english_pob_choice: the places to which the ark of Yahweh has come
  chosen_korean: 주님의 언약궤가 들어간 곳들
  alternatives_korean:
  - 주님의 언약궤가 온 곳들
  - 주님의 언약궤가 이른 곳들
  - 주님의 언약궤가 들어온 곳들
  lexicon: HALOT
  rationale: 히브리어의 복수 대상을 드러내기 위해 ‘곳들’을 사용했고, 아크의 도착을 한국어 독자에게 자연한 동사 ‘들어간’으로 표현했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 구절은 야훼의 언약궤를 직접 언급하지만, 본문 내 인용문이 아니라 서술문 안의 통상 호칭이므로 출판용 한국어 흐름을 위해 ‘주님’을 사용했습니다.
  doctrine_reference: POB name-rendering policy; OT divine-name audit practice
- issue: הֵמָּה / אֲלֵיהֶם의 복수 지시
  chosen_reading: ‘곳들’로 복수 지시를 명시함
  alternative_readings:
  - 다윗의 집 전체를 단수로 처리
  - 원문 복수성을 한국어에서 완화
  rationale: 히브리어의 복수 대명사를 그대로 살리면 한국어에서 어색하므로, 문맥상 타당한 ‘곳들’을 보충해 솔로몬의 논리를 분명하게 했습니다.
  doctrine_reference: 'Translation philosophy #3 and #6'
