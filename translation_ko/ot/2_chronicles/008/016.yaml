  text: וַ/תִּכֹּן֙ כָּל מְלֶ֣אכֶת שְׁלֹמֹ֔ה עַד הַ/יּ֛וֹם מוּסַ֥ד בֵּית יְהוָ֖ה וְ/עַד כְּלֹת֑/וֹ שָׁלֵ֖ם בֵּ֥ית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
  footnotes:
  - marker: a
    text: Or, 'all Solomon's work was prepared/set in order.' The Hebrew verb can carry the sense of being established, made ready, or set in order.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from the day of the founding of the house of the LORD until its completion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 솔로몬의 모든 공사가, 야훼의 집의 기초가 놓인 날부터 그것이 완공될 때까지, 준비되었습니다[a][b]. 그래서 야훼의 집이 완공되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬의 모든 공사가 준비되었다/정돈되었다’. 히브리어 동사는 ‘세워지다, 준비되다, 정돈되다’의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼의 집이 기초 놓인 날부터 그 완공 때까지’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכֹּן
  english_pob_choice: was established
  chosen_korean: 준비되었습니다
  alternatives_korean:
  - 설립되었습니다
  - 정비되었습니다
  - 확립되었습니다
  - 마련되었습니다
  lexicon: HALOT
  rationale: כּוּן의 완료·결과적 의미를 살려 공사가 단순히 시작된 것이 아니라 필요한 상태로 갖추어지고 정돈되었음을 나타내기 위해 ‘준비되었습니다’로 옮겼습니다.
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  english_pob_choice: all the work of Solomon
  chosen_korean: 솔로몬의 모든 공사
  alternatives_korean:
  - 솔로몬의 모든 일
  - 솔로몬의 모든 작업
  - 솔로몬의 모든 공역
  lexicon: HALOT
  rationale: 문맥상 성전 건축과 관련된 왕의 사업 전체를 가리키므로, 현대 한국어에서 자연스럽고 범위를 분명히 드러내는 ‘공사’를 택했습니다.
- source_word: מוּסַד בֵּית יְהוָה
  english_pob_choice: the house of Yahweh was founded
  chosen_korean: 야훼의 집의 기초가 놓인
  alternatives_korean:
  - 야훼의 집이 세워진
  - 야훼의 집이 기초 놓인
  - 야훼의 집이 설립된
  lexicon: HALOT
  rationale: מוּסַד은 ‘기초가 놓임/기초 놓여짐’의 의미를 가지므로, 건물의 시작점을 드러내는 ‘기초가 놓인’으로 번역해 본문의 시간표현과 맞췄습니다.
- source_word: וְעַד כְּלֹתוֹ / שָׁלֵם
  english_pob_choice: until it was finished / was completed
  chosen_korean: 그것이 완공될 때까지 ... 완공되었습니다
  alternatives_korean:
  - 그것이 끝날 때까지 ... 끝났습니다
  - 그것이 완성될 때까지 ... 완성되었습니다
  - 그것이 마무리될 때까지 ... 마무리되었습니다
  lexicon: HALOT
  rationale: כָּלָה와 שָׁלֵם이 모두 종결과 완성을 말하므로, 한국어에서는 건축 문맥에 맞는 ‘완공’으로 통일해 중복을 자연스럽게 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 공용어 번역 전통의 대체 тит울을 따르지 않고, 본문의 신적 고유명사를 직접 반영하기 위해 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 성전 명칭을 어떻게 처리할 것인가
  chosen_reading: ‘야훼의 집’으로 직역하여, 건축 대상이 단순한 건물이 아니라 언약의 하나님께 속한 집임을 드러냈습니다.
  alternative_readings:
  - ‘성전’으로 의역
  - ‘여호와의 성전’으로 전통화
  rationale: 히브리어 בֵּית יְהוָה는 문자적으로 ‘야훼의 집’이므로, 본문의 소유·관계 의미를 유지하는 쪽이 원문 충실도가 높습니다.
  doctrine_reference: 'POB 기준: divine name יְהוָה는 ‘야훼’로 표기'
