  text: 그리하여 솔로몬의 모든 공사는 야훼의 집의 기초가 놓인 날부터 그것이 완공될 때까지 갖추어졌습니다[a][b]. 그리하여 야훼의 집은 완공되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬의 모든 공사가 세워졌다’, ‘정돈되었다’. 히브리어 동사는 ‘세워지다, 갖추어지다, 정돈되다’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼의 집의 기초가 놓인 날부터 그 완공 때까지’입니다.
    reason: lexical_alternative
