  to: 그리고 그는 그의 아버지 다윗의 규례에 따라 제사장들의 분반을 그들의 직무를 위해 세우고, 레위 사람들은 그들의 맡은 임무를 위해 세워 각 날에 필요한 대로 찬양하고 제사장들 앞에서 섬기게 하였으며, 문지기들도 각 문을 위해 그들의 분반대로 세웠습니다. 이는 하나님의 사람 다윗의 명령이 그러하였기 때문입니다.[a]
  rationale: 명시되지 않은 찬양의 대상은 삭제하여 히브리어 본문의 범위를 보존했습니다. 레위인의 ‘맡은 임무’와 ‘각 날에 필요한 대로’라는 수행 규정을 원문의 구조에 맞게 재배치했습니다. 문지기들의 분반은 각 문에 대한 배치라는 뜻을 유지했습니다.
  reviewer_model: gpt-5.6-terra
