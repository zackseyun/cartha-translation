id: 2CH.8.14
reference: 2 Chronicles 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
  footnotes:
  - marker: a
    text: Or 'David his ancestor'; 'father' here reflects common royal/genealogical Hebrew usage for a forefather.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'according to the matter of a day on its day,' that is, according to each day's prescribed requirement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그의 아버지 다윗의 규례에 따라 제사장들의 분반을 그들의 직무를 위해 세우고, 레위 사람들은 그들의 맡은 임무를 위해 세워 각 날에 필요한 대로 찬양하고 제사장들 앞에서 섬기게 하였으며, 문지기들도 각 문을 위해 그들의 분반대로 세웠습니다. 이는 하나님의 사람 다윗의 명령이 그러하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 날의 일을 그 날에 따라’이며, 각 날에 요구되는 바에 따라라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִשְׁפַּט
  english_pob_choice: according to the ordinance
  chosen_korean: 규례에 따라
  alternatives_korean:
  - 명령에 따라
  - 법도에 따라
  - 규정에 따라
  lexicon: HALOT
  rationale: מִשְׁפָּט는 이 제의·행정 맥락에서 정해진 규범이나 규례를 뜻하므로, 한국어로는 ‘규례’가 가장 자연스럽고 स्रोत의 제도적 뉘앙스를 살립니다.
- source_word: מַחְלְקוֹת
  english_pob_choice: divisions
  chosen_korean: 분반
  alternatives_korean:
  - 부서
  - 조
  - 반
  lexicon: HALOT
  rationale: 제사장과 레위인의 조직된 배치라는 점을 드러내기 위해 ‘분반’을 택했습니다. 교회직분 용어로 굳지 않으면서도 조직적 구분을 전달합니다.
- source_word: לְהַלֵּל וּלְשָׁרֵת
  english_pob_choice: to praise and to minister
  chosen_korean: 찬양하고 … 섬기게
  alternatives_korean:
  - 찬양하고 … 봉사하게
  - 찬양하며 … 시중들게
  lexicon: HALOT
  rationale: לְהַלֵּל은 ‘찬양하다’가 직접적이며, שָׁרֵת는 성소 봉사의 맥락에서 ‘섬기다’가 한국어 독자에게 의미를 가장 분명하게 전달합니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 사람으로
  - 하나님의 종
  lexicon: HALOT
  rationale: 이는 성경의 관용적 호칭이므로 직역에 가까운 ‘하나님의 사람’을 유지했습니다. ‘하나님의 종’은 의미는 통하지만 호칭의 고유성을 약화시킵니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에서 ‘야훼’로 번역했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에는 직접 הבר을 가리키는 신명기적 호칭이 아니라, 다윗이 레위인에게 맡긴 찬양 행위의 대상이 배경상 야훼이므로 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ‘다윗 그의 아버지’의 친족 표현
  chosen_reading: ‘그의 아버지 다윗’을 유지했습니다.
  alternative_readings:
  - 그의 조상 다윗
  - 그의 선조 다윗
  rationale: 히브리어의 직설적 왕조-계보 관용구를 평이하게 살려, ‘아버지’를 ‘조상’으로 풀어 도식화하지 않았습니다. 이는 문맥상 다윗을 직계 부친으로 주장하는 뜻이 아니라 선왕/선조를 가리킵니다.
  doctrine_reference: 'Translation principle: preserve source idiom unless context requires interpretive expansion'
