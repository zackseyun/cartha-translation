  text: וּ/בִ/דְבַר י֣וֹם בְּ/י֗וֹם לְ/הַעֲלוֹת֙ כְּ/מִצְוַ֣ת מֹשֶׁ֔ה לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וְ/לַ/מּ֣וֹעֲד֔וֹת שָׁל֥וֹשׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֥ג הַ/סֻּכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
  footnotes:
  - marker: a
    text: Or 'according to the rule for each day' (literally, 'according to the matter of a day on its day').
    reason: lexical_alternative
  - marker: b
    text: '''Feast of Weeks'' is later called ''Pentecost'' in Greek usage.'
    reason: cross_reference
  - marker: c
    text: Or 'Feast of Tabernacles'; Hebrew 'Booths.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날그날의 규정에 따라 제물을 드리되, 모세가 명령한 대로 안식일과 초하루와 정해진 절기마다 드렸습니다. 곧 해마다 세 번, 무교절과 칠칠절[b]과 초막절[c]에 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그날그날의 규정에 따라’. 히브리어는 문자적으로 ‘그날의 일을 그날에 따라’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘맥추절’. 이 절기는 후대 그리스어 용례에서 ‘오순절’로도 불립니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘장막절’. 히브리어는 ‘초막들’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  english_pob_choice: according to the daily requirement
  chosen_korean: 날마다 드려야 하는 제물의 규례에 따라
  alternatives_korean:
  - 날마다의 일에 따라
  - 날마다의 규정에 따라
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘날의 일/사안’이라는 뜻으로 일일 제의 규정을 가리키므로, ‘제물의 규례’로 풀어 그 제의적 의미를 분명히 했습니다.
- source_word: לְהַעֲלוֹת
  english_pob_choice: for offering up sacrifices
  chosen_korean: 드려야 하는 제물
  alternatives_korean:
  - 올려 바치기 위해
  - 제사를 드리기 위해
  lexicon: HALOT
  rationale: עלה의 제의적 용법은 ‘올려 바치다’이지만, 한국어에서는 제물의 봉헌을 자연스럽게 드러내는 ‘드리다’가 가장 직접적입니다.
- source_word: לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמּוֹעֲדוֹת
  english_pob_choice: for the Sabbaths, the new moons, and the appointed feasts
  chosen_korean: 안식일과 초하루와 정해진 절기마다
  alternatives_korean:
  - 안식일들과 새 달들과 정해진 절기마다
  - 안식일과 초하루들과 지정된 절기마다
  lexicon: HALOT
  rationale: 문맥상 예배 일정의 항목들이므로 ‘초하루’로 חודש의 제의적 관용을 살리고, ‘정해진 절기’로 appointed feasts의 달력적 성격을 옮겼습니다.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  english_pob_choice: three times in the year
  chosen_korean: 해마다 세 번
  alternatives_korean:
  - 일 년에 세 번
  - 매년 세 번
  lexicon: HALOT
  rationale: 히브리어의 시간 표현을 간결한 한국어로 옮기되, 순례 절기들의 연간 반복성을 유지했습니다.
- source_word: חַג הַשָּׁבֻעוֹת
  english_pob_choice: Feast of Weeks
  chosen_korean: 칠칠절
  alternatives_korean:
  - 맥추절
  - 오순절
  lexicon: HALOT
  rationale: 히브리어 명칭 שבועות의 문자적 대응은 ‘칠칠절’이며, 본문이 히브리어 절기명을 사용하므로 그 투명성을 살렸습니다.
- source_word: חַג הַסֻּכּוֹת
  english_pob_choice: Feast of Booths
  chosen_korean: 초막절
  alternatives_korean:
  - 장막절
  - 천막절
  lexicon: HALOT
  rationale: סֻכּוֹת의 문자 이미지는 ‘booths/booths’이지만, 한국어 성경에서 널리 인지되는 명칭인 ‘초막절’을 사용해 의미와 가독성을 함께 확보했습니다.
theological_decisions:
- issue: 절기 명칭을 히브리어 직역형과 한국 교회 익숙형 사이에서 어떻게 처리할지
  chosen_reading: 칠칠절, 초막절
  alternative_readings:
  - 오순절, 장막절
  - 맥추절, 초막절
  rationale: 본문은 히브리어 절기 명칭을 열거하므로, 영어 POB처럼 원문 투명성을 우선하되 한국어에서 이해 가능한 표준형을 택했습니다. ‘칠칠절’은 Weeks의 히브리어 구조를, ‘초막절’은 Booths의 구체적 이미지를 보존합니다.
  doctrine_reference: Translation philosophy §§1, 6
