  source_fidelity: 초안은 야훼께서 다윗의 집을 멸하기를 원하지 않으셨다는 뜻, 다윗과 맺은 언약, 그리고 다윗과 그의 아들들에게 등불을 주신다는 표현을 대체로 충실히 반영합니다. 그러나 ‘그것이 모든 날 동안 이어지게 하려는 것이었습니다’는 원문에 없는 목적절과 해설적 내용을 덧붙입니다. 히브리어는 하나님이 등불을 ‘주겠다’고 말씀하신 사실을 말할 뿐, ‘이어지게 하려는’ 목적을 명시하지 않습니다.
