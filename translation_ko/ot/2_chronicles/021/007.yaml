  terminology: ‘야훼’, ‘다윗의 집’, ‘언약’, ‘등불’은 적절합니다. ‘등불’ 은유를 본문에서 왕조나 계보로 풀어쓰지 않은 점도 좋습니다. 각주 c는 실제로는 본문과 같은 수여 구문을 반복할 뿐 유의미한 대안 독법을 제공하지 않으므로 제거하는 것이 바람직합니다.
