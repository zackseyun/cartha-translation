  to: 그러나 야훼께서는 다윗의 집을 멸하기를 원하지 않으셨습니다. 이는 그가 다윗과 맺으신 언약 때문이며, 또 그가 말씀하신 대로 다윗과 그의 아들들에게 모든 날 동안 한 등불을 주시겠다고 하셨기 때문입니다.[a][b]
