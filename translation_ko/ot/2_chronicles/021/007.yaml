id: 2CH.21.7
reference: 2 Chronicles 21:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
  footnotes:
  - marker: a
    text: Or 'light.' The Hebrew metaphor likely refers to the continuing line or rule of David.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'for all the days'; some translations render this more interpretively as 'forever.'
    reason: lexical_alternative
  - marker: c
    text: Or 'give him a lamp, and to his sons,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 야훼께서는 다윗의 집을 멸하려고 하지 않으셨습니다. 이는 그가 다윗과 맺으신 언약 때문이며, 또 그가 이미 말씀하신 대로 다윗과 그의 아들들에게 한 등불을 주셔서 그것이 모든 날 동안 이어지게 하려는 것이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘등불’은 다윗의 계속되는 계보나 통치를 가리키는 비유일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모든 날들’입니다. 일부 번역은 이를 ‘영원히’로 더 해석적으로 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그와 그의 아들들에게 한 등불을 주겠다’로도 읽을 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וְלֹא אָבָה
  english_pob_choice: was not willing
  chosen_korean: 멸하려고 하지 않으셨습니다
  alternatives_korean:
  - 멸하기를 원하지 않으셨습니다
  - 멸하려 하지 않으셨습니다
  - 멸하지 않으셨습니다
  lexicon: HALOT
  rationale: אָבָה는 단순한 감정보다 의지적 동의를 가리키므로, 야훼의 주권적 의사를 드러내는 ‘하려고 하지 않으셨습니다’로 옮겼습니다.
- source_word: בֵּית דָּוִיד
  english_pob_choice: the house of David
  chosen_korean: 다윗의 집
  alternatives_korean:
  - 다윗의 왕조
  - 다윗 집안
  - 다윗의 가문
  lexicon: HALOT
  rationale: 히브리어의 왕조적 관용구를 살리면서도 자연스러운 한국어로 옮기기 위해 ‘다윗의 집’을 유지했습니다.
- source_word: נִיר
  english_pob_choice: a lamp
  chosen_korean: 한 등불
  alternatives_korean:
  - 등불
  - 빛
  - 횃불
  lexicon: HALOT
  rationale: 문맥상 다윗 계열의 지속을 가리키는 상징이므로, 메타포를 보존하는 ‘등불’을 택했습니다. 수량감도 살리기 위해 ‘한’을 덧붙였습니다.
- source_word: כָּל הַיָּמִים
  english_pob_choice: for all days
  chosen_korean: 모든 날 동안
  alternatives_korean:
  - 영원히
  - 항상
  - 날마다
  lexicon: HALOT
  rationale: 직역에 가까운 ‘모든 날 동안’으로 히브리어 표현을 보존하고, ‘영원히’처럼 해석을 강화하는 표현은 피했습니다.
theological_decisions:
- issue: 다윗 언약과 등불 은유의 보존
  chosen_reading: 다윗과 그의 아들들에게 한 등불
  alternative_readings:
  - 다윗과 그의 아들들에게 빛
  - 다윗 왕조를 지속시키는 표지
  rationale: 본문은 언약에 근거한 다윗 계열의 지속을 ‘등불’ 이미지로 말하므로, 이를 평서적으로 풀지 않고 그대로 살려 상호본문적 의미를 유지했습니다.
  doctrine_reference: 다윗 언약의 지속성과 메시아적 계열에 대한 본문 내 은유를 보존
