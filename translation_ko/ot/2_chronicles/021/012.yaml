  - 주님
  rationale: 본문이 언약명 יְהוָה를 직접 사용하므로, 전통적 대체어보다 고유 이름을 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
