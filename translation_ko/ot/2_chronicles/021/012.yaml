  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
  footnotes:
  - marker: a
    text: 'Or “and in the ways of Asa king of Judah.” Hebrew has “and,” but English often uses “or” after a negation: “not ... or ...”.'
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리야 예언자로부터 그에게 편지가 왔습니다. 그 편지에는 다음과 같이 적혀 있었습니다. “야훼, 당신의 조상 다윗의 하나님께서 이렇게 말씀하십니다. 당신이 당신의 조상 여호사밧의 길이나 유다 왕 아사의 길을 따르지 않았으므로,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  english_pob_choice: Then a letter came to him
  chosen_korean: 그에게는 … 편지가 왔는데
  alternatives_korean:
  - 그는 편지를 받았는데
  - 그에게 편지가 도착했는데
  lexicon: HALOT
  rationale: 히브리어는 ‘편지’가 주어로 와서 ‘왔다’고 말하므로, 한국어도 문장의 초점을 유지해 ‘편지가 왔는데’로 옮겼습니다.
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  english_pob_choice: from Elijah the prophet
  chosen_korean: 엘리야 선지자로부터
  alternatives_korean:
  - 예언자 엘리야로부터
  - 엘리야 예언자로부터
  lexicon: HALOT
  rationale: 인명은 통용형 엘리야를 따르고, נָבִיא는 본문 맥락상 ‘선지자’가 가장 자연스러우며 직설적입니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼 … 이같이 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 여호와께서 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 직접적인 예언자 메시지 형식을 살려 ‘이같이 말씀하십니다’로 옮기고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 표기했습니다.
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  english_pob_choice: the God of David your father
  chosen_korean: 당신의 조상 다윗의 하나님
  alternatives_korean:
  - 당신의 아버지 다윗의 하나님
  - 다윗 당신의 조상의 하나님
  lexicon: HALOT
  rationale: 왕조 맥락에서 אָבִיךָ는 직계 아버지라기보다 조상/선조를 가리킬 수 있어, 한국어도 자연스럽게 ‘조상 다윗’으로 풀었습니다.
- source_word: בְּדַרְכֵי
  english_pob_choice: in the ways of
  chosen_korean: …의 길을 따르지 않았기 때문입니다
  alternatives_korean:
  - …의 길로 행하지 않았기 때문입니다
  - …의 길을 걷지 않았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘길’은 행실과 삶의 방식이므로, 한국어에서는 동작을 분명히 하는 ‘길을 따르지 않다’로 자연스럽게 옮겼습니다.
