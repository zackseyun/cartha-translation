  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: Now when Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
  footnotes:
  - marker: a
    text: Or 'officials' or 'leaders' for 'princes.' The Hebrew term can denote high-ranking rulers or administrators.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호람이 아버지의 왕국을 다스리게 되어 스스로 세력을 굳힌 뒤, 자기 형제들을 모두 칼로 죽였고, 이스라엘의 고관들 가운데 일부도 죽였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘고관들’은 문맥에 따라 ‘관리들’ 또는 ‘지도자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם ... עַל מַמְלֶכֶת אָבִיו
  english_pob_choice: had risen over his father's kingdom
  chosen_korean: 그의 아버지의 왕국에 올라와
  alternatives_korean:
  - 그의 아버지의 왕국을 차지하여
  - 그의 아버지의 왕국 위에 올라와
  - 그의 아버지의 왕국에 즉위하여
  lexicon: HALOT
  rationale: קום + עַל은 단순한 이동보다 왕권의 장악과 통치를 나타내므로, ‘올라와’로 접근하되 ‘왕국’을 보존해 즉위의 권위적 뉘앙스를 살렸습니다.
- source_word: וַיִּתְחַזַּק
  english_pob_choice: had strengthened himself
  chosen_korean: 스스로 굳건해지자
  alternatives_korean:
  - 스스로 강해지자
  - 자신의 권세를 굳히자
  - 자신의 입지를 다지자
  lexicon: HALOT
  rationale: 히트파엘형의 반사적 의미를 살려 단순히 ‘강해지다’보다 자기 강화를 드러내는 표현을 택했습니다.
- source_word: שָׂרֵי יִשְׂרָאֵל
  english_pob_choice: princes of Israel
  chosen_korean: 이스라엘의 귀인들
  alternatives_korean:
  - 이스라엘의 방백들
  - 이스라엘의 지도자들
  - 이스라엘의 대신들
  lexicon: HALOT
  rationale: שָׂרִים은 문맥상 궁정·행정 고위층을 가리킬 수 있어, 한국어에서는 계층감을 드러내는 ‘귀인들’이 ‘방백들’보다 현대 독자에게 자연스럽고, POB의 주해상 ‘officials or leaders’의 여지를 남깁니다.
- source_word: מִשָּׂרֵי
  english_pob_choice: some of the princes
  chosen_korean: 귀인들 가운데서도 몇 사람을
  alternatives_korean:
  - 귀인들 중 일부를
  - 귀인들 가운데 몇을
  - 귀인들 가운데 일부를
  lexicon: HALOT
  rationale: 전치사 מִן의 부분적 의미를 한국어의 ‘가운데서도 몇 사람’으로 표현해 ‘일부’라는 분할 의미를 분명히 했습니다.
theological_decisions:
- issue: ‘이스라엘’의 범위
  chosen_reading: ‘이스라엘’을 그대로 유지하여 유다 왕국으로 좁히지 않았습니다.
  alternative_readings:
  - 유다
  - 그 나라
  - 백성
  rationale: 역대기는 유다 문맥에서도 ‘이스라엘’을 더 넓은 언약적·왕조적 표지로 사용할 수 있으므로, 본문이 가진 역사적 긴장을 해소하지 않고 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
