  source_fidelity: 원문의 서술 순서와 핵심 의미는 대체로 보존했으나, 문두의 ‘이제’는 히브리어에 명시된 시간 부사가 아니므로 삭제하는 것이 좋습니다. 또한 ‘왕국에 올라와’는 한국어에서 왕국이라는 통치 영역에 물리적으로 올라가는 듯하여, 왕권 계승·통치의 의미를 더 자연스럽게 나타낼 필요가 있습니다. מִשָּׂרֵי의 부분 의미와 ‘이스라엘’을 그대로 둔 점은 적절합니다.
  naturalness: ‘그의 아버지의 왕국에 올라와’와 ‘귀인들’은 현대 표준어 성경 문체에서 다소 부자연스럽거나 의미가 넓습니다. ‘아버지의 왕국을 다스리게 되어’, ‘고관들 가운데 일부’가 자연스럽고 문맥상 정확합니다. 합쇼체 종결도 유지했습니다.
  terminology: שָׂרִים에는 ‘고관들’을 사용하여 왕실·행정의 고위 인사라는 문맥을 살렸습니다. 이는 ‘귀인들’보다 현대어에서 더 명확하며, 각주의 ‘관리들/지도자들’이라는 대안도 유지할 수 있습니다. ‘이스라엘’은 해석적으로 ‘유다’로 좁히지 않았습니다.
