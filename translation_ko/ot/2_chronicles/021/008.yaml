id: 2CH.21.8
reference: 2 Chronicles 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/יָמָי/ו֙ פָּשַׁ֣ע אֱד֔וֹם מִ/תַּ֖חַת יַד יְהוּדָ֑ה וַ/יַּמְלִ֥יכוּ עֲלֵי/הֶ֖ם מֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/008.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
  footnotes:
  - marker: a
    text: Or 'revolted from Judah's control.' The Hebrew literally says 'rebelled from under the hand of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 시대에 에돔이 유다의 지배에서 벗어나 반역하고, 자신들을 다스릴 왕을 세웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיָמָיו
  english_pob_choice: In his days
  chosen_korean: 그의 시대에
  alternatives_korean:
  - 그의 날들에
  - 그가 다스리던 때에
  lexicon: HALOT
  rationale: 히브리어 관용구로서 특정 인물의 통치 시기를 가리키므로, 한국어에서는 자연스러운 ‘그의 시대에’로 옮겨 시간적 범위를 살렸습니다.
- source_word: פָּשַׁע
  english_pob_choice: rebelled
  chosen_korean: 반역하고
  alternatives_korean:
  - 반란을 일으키고
  - 배반하고
  lexicon: HALOT
  rationale: 정치적 종속 관계를 끊는 행위이므로 단순한 ‘배반’보다 국가적·정치적 뉘앙스가 있는 ‘반역하다’가 원문에 더 가깝습니다.
- source_word: מִתַּחַת יַד יְהוּדָה
  english_pob_choice: from under the hand of Judah
  chosen_korean: 유다의 손 아래에서
  alternatives_korean:
  - 유다의 지배 아래에서
  - 유다의 통제 아래에서
  lexicon: HALOT
  rationale: ‘손 아래’라는 히브리어 이미지를 그대로 살려 원문의 구체성을 유지하되, 한국어 문맥상 이해되도록 구성했습니다.
- source_word: וַיַּמְלִיכוּ עֲלֵיהֶם מֶלֶךְ
  english_pob_choice: made a king over themselves
  chosen_korean: 자기들 위에 왕을 세웠습니다
  alternatives_korean:
  - 자기들 위에 왕을 임명했습니다
  - 자기들을 다스릴 왕을 세웠습니다
  lexicon: HALOT
  rationale: ‘왕이 되게 하다/세우다’의 사역적 의미를 자연스럽게 반영했고, ‘over themselves’는 ‘자기들 위에’로 처리해 에돔이 자기 통치자를 선택했음을 드러냈습니다.
theological_decisions:
- issue: 유다와 에돔의 정치적 종속 관계를 묘사하는 관용구의 보존
  chosen_reading: ‘유다의 손 아래에서’라는 직역적 이미지를 유지했습니다.
  alternative_readings:
  - ‘유다의 지배 아래에서’로 평이하게 풀기
  - ‘유다의 통제 아래에서’로 해석하기
  rationale: 이 구절은 단순한 정보 전달 이상으로 종속 관계의 그림을 강조하므로, 원문 이미지를 보존하는 편이 서술의 힘을 유지합니다.
  doctrine_reference: 역사서의 서술적 충실성
- issue: ‘반역하다’의 정치적 의미 선택
  chosen_reading: 도덕적 ‘범하다’보다 정치적 ‘반역하다’로 번역했습니다.
  alternative_readings:
  - ‘죄를 범하다’처럼 일반적 위반으로 처리하기
  - ‘전복하다’로 강하게 옮기기
  rationale: 문맥상 유다가 지배하던 에돔의 이탈을 말하므로, 정치·군사적 반역의 의미를 드러내는 것이 적절합니다.
  doctrine_reference: 열왕기/역대기 역사 서술의 문맥 의미
