  terminology: ‘에돔’, ‘유다’, ‘반역하다’, ‘왕을 세우다’는 역사적·정치적 문맥에 적절합니다. ‘지배’는 כאן의 ‘손 아래’라는 권위·종속 관용구를 자연스럽게 전달합니다.
