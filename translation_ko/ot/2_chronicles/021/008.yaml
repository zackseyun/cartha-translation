  source_fidelity: ‘유다의 손 아래에서 반역하고’는 히브리어의 ‘유다의 손 아래로부터 반역하였다’에서 이탈의 방향을 충분히 나타내지 못하며, 한국어에서는 유다의 지배 아래에 있으면서 반역했다는 뜻으로도 읽힐 수 있습니다. 에돔이 유다의 종주권에서 벗어났다는 뜻을 명료하게 해야 합니다.
