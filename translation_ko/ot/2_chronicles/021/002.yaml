base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''king of Israel.'' Jehoshaphat is more commonly identified historically as king of Judah; Chronicles here uses ''Israel,'' likely in a broader covenantal sense.'
    reason: alternative_reading
  - marker: b
    text: The fourth name is spelled differently in Hebrew from the first Azariah; the distinction is preserved here as 'Azariahu.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그에게는 형제들—여호사밧의 아들들—아사랴와 여히엘과 스가랴와 아사랴후와 미가엘과 스바댜가 있었습니다. 이 모든 사람은 이스라엘 왕 여호사밧의 아들들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֽוֹ אַחִים
  english_pob_choice: And he had brothers
  chosen_korean: 그에게는 형제들
  alternatives_korean:
  - 그에게는 형제들이
  - 그에게는 형제가
  lexicon: HALOT
  rationale: 소유를 나타내는 관용을 한국어에서 자연스럽게 풀어, 기본 의미를 유지하되 문맥상 남자 형제들임을 드러냈습니다.
- source_word: בְּנֵי יְהוֹשָׁפָט
  english_pob_choice: the sons of Jehoshaphat
  chosen_korean: 여호사밧의 아들들
  alternatives_korean:
  - 여호사밧의 아들들인
  - 여호사밧의 자손들
  lexicon: HALOT
  rationale: 족보 문맥의 형식성을 살려 직설적으로 옮겼습니다.
- source_word: וַעֲזַרְיָהוּ
  english_pob_choice: Azariahu
  chosen_korean: 아사랴후
  alternatives_korean:
