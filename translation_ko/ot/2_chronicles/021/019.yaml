language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/יָמִ֣ים מִ/יָּמִ֡ים וּ/כְ/עֵת֩ צֵ֨את הַ/קֵּ֜ץ לְ/יָמִ֣ים שְׁנַ֗יִם יָצְא֤וּ מֵעָי/ו֙ עִם חָלְי֔/וֹ וַ/יָּ֖מָת בְּ/תַחֲלֻאִ֣ים רָעִ֑ים וְ/לֹא עָ֨שׂוּ ל֥/וֹ עַמּ֛/וֹ שְׂרֵפָ֖ה כִּ/שְׂרֵפַ֥ת אֲבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
  footnotes:
  - marker: a
    text: Or 'his intestines came out.' The Hebrew literally refers to his inward organs.
    reason: lexical_alternative
  - marker: b
    text: The 'burning' here likely refers to a funerary honor, such as the burning of spices, not the cremation of his body; compare royal burial customs elsewhere in Chronicles.
    reason: cultural_note
translation:
  language: ko
  text: 얼마 후, 두 해가 끝날 때에 그의 창자가[a] 그의 병 때문에 밖으로 나왔고, 그는 심한 병으로 죽었습니다. 그의 백성은 그의 조상들에게 한 불사름과 같은 불사름을 그에게 베풀지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 그의 몸속 기관들, 곧 내장을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 ‘불사름’은 시신의 화장이라기보다 향료 등을 태우는 장례 예우를 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  english_pob_choice: after some time
  chosen_korean: 얼마 후
  alternatives_korean:
  - 날들이 지나고
  - 오랜 시간이 지난 뒤
  lexicon: HALOT
  rationale: 히브리어 관용구가 막연한 시간 경과를 가리키므로, 한국어에서는 자연스러운 ‘얼마 후’로 옮겨 의미를 분명히 했습니다.
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  english_pob_choice: at the end of two years
  chosen_korean: 곧 두 해가 끝날 무렵에
  alternatives_korean:
  - 두 해의 끝에
  - 두 해가 지난 때에
  lexicon: HALOT
  rationale: 병의 종결 시점을 두 해로 특정하므로, 시간의 완료를 살리면서도 현대 한국어답게 표현했습니다.
- source_word: מֵעָיו
  english_pob_choice: his bowels
  chosen_korean: 창자
  alternatives_korean:
  - 내장
  - 배 속의 기관
  lexicon: HALOT
  rationale: 구체적이고 충격적인 신체 묘사를 유지해야 하므로 완화하지 않았고, ‘창자’가 본문의 적나라한 이미지를 비교적 직접적으로 드러냅니다.
- source_word: בְּתַחֲלֻאִים רָעִים
  english_pob_choice: in severe diseases
  chosen_korean: 심한 병으로
  alternatives_korean:
  - 극심한 질병으로
  - 몹시 괴로운 병으로
  lexicon: HALOT
  rationale: 복수형 질병 표현을 한국어에서 과도하게 어색하지 않게 옮기되, 병세의 중함을 보존했습니다.
- source_word: שְׂרֵפָה
  english_pob_choice: burning
  chosen_korean: 불사름
  alternatives_korean:
  - 불태움
  - 장례 불사름
  lexicon: HALOT
  rationale: 이 표현은 시신 화장이라기보다 장례적 예우의 불사름을 가리킬 가능성이 높으므로, 본문에서는 원어에 가까운 ‘불사름’을 택했습니다.
theological_decisions:
- issue: 시신 화장 여부가 아니라 장례 예우의 생략을 드러내는가
  chosen_reading: 본문의 ‘불사름’은 몸의 화장이 아니라 왕실 장례 관습상의 예우를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 시신 화장
  - 불명확한 화형 의식
  rationale: 역대기의 왕실 문맥에서 앞선 조상들에게 행한 장례적 불사름과 대비되므로, 본문은 예우의 결핍을 말하는 것으로 이해하는 편이 문맥상 타당합니다.
  doctrine_reference: 역대기 왕실 장례 관습
