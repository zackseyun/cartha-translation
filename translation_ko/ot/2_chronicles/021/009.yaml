  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
  footnotes:
  - marker: a
    text: Or 'the chariot commanders.' The Hebrew phrase may refer specifically to officers over the chariot force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 여호람은 자기의 군 지휘관들과 그와 함께한 모든 병거와 함께 건너갔습니다. 그러고는 밤에 일어나, 자신을 둘러싼 에돔과 병거의 지휘관들을 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘병거 지휘관들’일 수 있습니다. 히브리어 구절은 특히 병거 부대의 장교들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: crossed over
  chosen_korean: 건너갔습니다
  alternatives_korean:
  - 지나갔습니다
  - 건너편으로 갔습니다
  - 넘어갔습니다
  lexicon: HALOT
  rationale: עבר의 기본 의미인 ‘건너다/건너가다’를 살리면서, 군사적 이동의 구체성을 과도하게 덧붙이지 않기 위해 ‘건너갔습니다’로 옮겼습니다.
- source_word: שָׂרָיו / שָׂרֵי הָרָכֶב
  english_pob_choice: his commanders / the commanders of the chariots
  chosen_korean: 군 지휘관들 / 병거의 지휘관들
  alternatives_korean:
  - 장관들
  - 군대 지휘관들
  - 병거 지휘관들
  lexicon: HALOT
  rationale: שַׂר는 문맥상 군사 지휘자를 가리키므로 ‘지휘관’이 가장 자연스럽습니다. 뒤의 שָׂרֵי הָרָכֶב도 같은 어휘를 반복하므로, 앞은 일반 군 지휘관들, 뒤는 병거 부대의 지휘관들로 구분해 의미를 드러냈습니다.
- source_word: הָרֶכֶב
  english_pob_choice: the chariots
  chosen_korean: 병거
  alternatives_korean:
  - 전차
  - 병거대
  - 병거들
  lexicon: HALOT
  rationale: 히브리어 רֶכֶב은 병거 자체 또는 병거 전력을 가리킬 수 있으나, 한국어 성경에서 군사 장비로는 ‘병거’가 가장 직접적이고 표준적입니다.
- source_word: הַסּוֹבֵב אֵלָיו
  english_pob_choice: which had surrounded him
  chosen_korean: 자신을 둘러싼
  alternatives_korean:
  - 그를 둘러싼
  - 그 주위를 에워싼
  - 그에게 둘러붙은
  lexicon: HALOT
  rationale: סבב의 ‘둘러싸다’ 의미를 분명히 하되, 관계절을 간결하게 처리해 적군이 여호람을 포위한 상황을 자연스럽게 전달했습니다.
theological_decisions:
- issue: תיאור 전투 동사의 강도
  chosen_reading: וַיַּךְ는 ‘쳤습니다’로 옮겨, 본문이 말하는 실제 타격 행위를 유지했습니다.
  alternative_readings:
  - 공격했습니다
  - 무찔렀습니다
  - 타격했습니다
  rationale: נכה는 단순히 ‘공격하다’보다 직접적인 ‘치다/때리다’에 가깝지만, 여기서는 전투 서술이므로 한국어로 자연스럽게 ‘쳤습니다’가 원문의 강도를 가장 잘 보존합니다.
  doctrine_reference: 본문 서사 정확성
