  text: וְ/אַתָּ֛ה בָּ/חֳלָיִ֥ים רַבִּ֖ים בְּ/מַחֲלֵ֣ה מֵעֶ֑י/ךָ עַד יֵצְא֤וּ מֵעֶ֨י/ךָ֙ מִן הַ/חֹ֔לִי יָמִ֖ים עַל יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
  footnotes:
  - marker: a
    text: Or 'your intestines' for 'your bowels'; the Hebrew term refers to the inner organs.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'days upon days,' an idiom meaning 'day after day' or 'for many days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 당신 자신은 많은 질병을 앓게 될 것이며[a], 곧 당신의 배 속 병으로, 그 병 때문에 당신의 배 속이 날마다 밖으로 나올 때까지입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘장’으로 옮길 수 있습니다. 히브리어는 내부 장기를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘날들 위에 날들’이라는 관용구로, ‘날마다’ 또는 ‘오랜 날 동안’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: And you yourself
  chosen_korean: 그리고 당신 자신은
  alternatives_korean:
  - 그리고 당신은
  - 하지만 당신은
  lexicon: HALOT
  rationale: 독립 대명사와 접속사는 여호람 개인에게 직접 떨어지는 경고를 강조하므로, ‘당신 자신은’으로 강조를 살렸습니다.
- source_word: בָּחֳלָיִים רַבִּים
  english_pob_choice: will suffer many illnesses
  chosen_korean: 많은 질병을 앓게 될 것이며
  alternatives_korean:
  - 많은 병들에 걸릴 것이며
  - 많은 질환을 겪게 될 것이며
  lexicon: HALOT
  rationale: 복수형과 지속적 고통의 뉘앙스를 살려 자연스러운 현대 한국어로 옮기되, 단순한 상태보다 ‘앓게 될’로 고통의 경험을 드러냈습니다.
- source_word: בְּמַחֲלֵה
  english_pob_choice: with a disease
  chosen_korean: 배 속 병으로
  alternatives_korean:
  - 배 속의 병으로
  - 장 질환으로
  lexicon: HALOT
  rationale: ב는 여기서 분리의 ‘~로부터’가 아니라 수반/상태를 나타내므로, 앞의 일반적 질병에 이어지는 구체적 병을 ‘배 속 병으로’ 연결했습니다.
- source_word: מֵעֶיךָ
  english_pob_choice: of your bowels
  chosen_korean: 당신의 배 속
  alternatives_korean:
  - 당신의 창자
  - 당신의 내장
  lexicon: HALOT
  rationale: 히브리어가 내부 장기를 가리키므로, 직역성을 유지하되 현대 독자에게 덜 생경한 ‘배 속’을 택했습니다.
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  english_pob_choice: until your bowels come out
  chosen_korean: 당신의 배 속이 날마다 밖으로 나올 때까지
  alternatives_korean:
  - 당신의 창자가 밖으로 나올 때까지
  - 당신의 내장이 나올 때까지
  lexicon: HALOT
  rationale: יצא의 직설적 의미를 약화시키지 않되, 한국어에서는 내부 장기가 ‘밖으로 나오다’로 자연스럽게 표현했습니다.
- source_word: יָמִים עַל יָמִים
  english_pob_choice: day after day
  chosen_korean: 날마다
  alternatives_korean:
  - 날이 날마다
  - 여러 날에 걸쳐
  lexicon: HALOT
  rationale: 히브리어 관용구의 반복·지속성을 간명하게 전달하는 현대적 표현으로 옮겼습니다.
