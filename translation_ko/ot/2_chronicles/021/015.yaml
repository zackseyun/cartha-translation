  rationale: 이 절은 여호람에게 내리는 구체적 저주 선언이므로, स्रोत이 드러내는 혐오스럽고 육체적인 이미지를 약화하지 않는 것이 본문의 의도에 더 충실합니다.
  doctrine_reference: 문맥상 왕에 대한 심판 선언(2 Chr 21장 전체)
