id: 2CH.21.1
reference: 2 Chronicles 21:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'died'; literally 'slept with his fathers.'
    reason: lexical_alternative
  - marker: b
    text: '''With his fathers'' is a Hebrew idiom for joining one''s ancestors in death and burial.'
    reason: cultural_note
translation:
  language: ko
  text: 여호사밧이 그의 조상들과 함께 잠들고[a], 다윗의 성읍에 그의 조상들과 함께 장사되었으며[b], 그의 아들 여호람이 그의 자리에 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽고’; 문자적으로는 ‘그의 조상들과 함께 잠들고’입니다.
    reason: alternative_reading
  - marker: b
    text: ‘그의 조상들과 함께’는 히브리어 관용구로, 죽음과 장사를 통해 선조의 대열에 합류함을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들고
  alternatives_korean:
  - 죽고
  - 누워 있고
  lexicon: HALOT
  rationale: 왕의 서술문에서 쓰이는 ‘자다/잠들다’ 관용을 살리면서, 영어 POB의 ‘slept’처럼 죽음을 완곡하게 드러내는 표현으로 옮겼습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 히브리어의 족장·왕조 관용구를 한국어에서 자연스럽게 풀어, 문자적이면서도 현대 독자가 이해할 수 있게 했습니다.
- source_word: בְּעִיר דָּוִיד
  english_pob_choice: in the city of David
  chosen_korean: 다윗의 성읍에
  alternatives_korean:
  - 다윗 성에
  - 다윗의 도시에서
  lexicon: HALOT
  rationale: 지명 관용구를 보존하되 한국어 성경에서 널리 통용되는 ‘다윗의 성읍’ 형태를 유지했습니다.
- source_word: וַיִּמְלֹךְ... תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 자리에 왕이 되었습니다
  alternatives_korean:
  - 그를 대신하여 통치했습니다
  - 그의 뒤를 이어 다스렸습니다
  lexicon: HALOT
  rationale: תחתיו의 계승 의미를 살리면서, מלך의 왕위 계승 공식을 한국어로 자연스럽게 재현했습니다.
theological_decisions:
- issue: ‘slept with his fathers’의 죽음 완곡어법 처리
  chosen_reading: ‘잠들고 … 장사되었으며’로 이어지는 왕실 장례 공식으로 옮겼습니다.
  alternative_readings:
  - 직역하여 ‘그의 조상들과 함께 잠들고’
  - 해석하여 ‘죽고’로 번역
  rationale: 본문은 단순한 사망 통보가 아니라 왕조적 죽음과 장사를 함께 알리는 관용구이므로, 완곡성과 장례 절차를 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 왕실 연대기 서술의 관용어 이해
- issue: ‘his fathers’의 지시 대상
  chosen_reading: ‘그의 조상들’로 처리하여 가족적 아버지들보다 왕조의 선조들을 가리키도록 했습니다.
  alternative_readings:
  - ‘그의 아버지들’
  - ‘그의 선조들’
  rationale: 문맥상 개별 아버지들이 아니라 왕들과 조상들의 집합을 가리키는 관용구이므로, 한국어에서도 역사적·왕조적 의미가 드러나도록 했습니다.
  doctrine_reference: 구약 히브리 관용구의 왕조적 용법
