  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  english_pob_choice: was thirty-two years old
  chosen_korean: 서른두 살이었고
  alternatives_korean:
  - 서른두 살의 아들이었고
  - 서른두 해 된 나이였고
  lexicon: HALOT
  rationale: 나이 공식은 한국어에서도 자연스럽게 ‘서른두 살’로 옮기는 것이 원문의 관용적 의미를 가장 분명하게 전달합니다.
- source_word: בְּמָלְכוֹ
  english_pob_choice: when he became king
  chosen_korean: 왕이 될 때
  alternatives_korean:
  - 그가 통치하기 시작할 때
  - 왕위에 오를 때
  lexicon: HALOT
  rationale: ב + 부정사 구문이 즉위 시점을 가리키므로, ‘왕이 될 때’로 옮겨 즉위의 시점을 드러냈습니다.
- source_word: מָלַךְ
  english_pob_choice: he reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 왕 노릇했습니다
  lexicon: HALOT
  rationale: 연대기적 왕정 공식에서 מָלַךְ는 단순한 ‘왕이었다’보다 통치 행위를 드러내는 ‘다스리다’가 한국어에 더 자연스럽습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에
  lexicon: HALOT
  rationale: स्थान/장소 부사구는 한국어 관용에 따라 ‘~에서’로 처리해 그의 통치 거점을 분명히 했습니다.
