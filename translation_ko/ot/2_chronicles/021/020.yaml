base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
  footnotes:
  - marker: a
    text: Or 'he went away without being desired,' preserving the more literal sense of the Hebrew phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 서른두 살에 왕이 되었고, 예루살렘에서 팔 년 동안 다스렸습니다. 그는 아무도 그를 아쉬워하지 않는 가운데 세상을 떠났습니다.[a] 사람들이 그를 다윗 성에 묻었지만 왕들의 무덤에는 묻지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 직역하면 ‘원함/바람 없이’로도 옮길 수 있습니다. 여기서는 그의 죽음을 아쉬워하거나 그리워하는 이가 없었다는 뜻으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם / בְמָלְכוֹ
  english_pob_choice: thirty-two years old when he began to reign
  chosen_korean: 서른두 살에 왕이 되었고
  alternatives_korean:
