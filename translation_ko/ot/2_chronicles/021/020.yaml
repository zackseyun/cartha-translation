  lexicon: HALOT
  rationale: 히브리어의 연령 공식과 즉위 시점을 자연스러운 한국어로 옮기되, ‘왕이 되다’로 간결하게 왕위 즉위를 드러냈습니다.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  english_pob_choice: he reigned eight years
  chosen_korean: 예루살렘에서 팔 년 동안 다스렸습니다
  alternatives_korean:
  - 예루살렘에서 팔 년 동안 통치했습니다
  - 예루살렘에서 팔 해 동안 왕이었습니다
  lexicon: HALOT
  rationale: מָלַךְ의 통치 의미를 살리면서도 한국어 역사 서술에 자연스러운 ‘다스리다’로 옮겼습니다.
- source_word: בְּלֹא חֶמְדָּה
  english_pob_choice: with no regret
  chosen_korean: 아무런 애도도 받지 못한 채
  alternatives_korean:
  - 아무런 아쉬움도 없이
  - 사람들의 바람이나 애정 없이
  lexicon: HALOT
  rationale: 직역하면 ‘욕망 없이/원함 없이’이지만, 문맥상 죽음에 대한 상실감과 애도의 부재를 가리키므로 그 뉘앙스를 한국어로 드러냈습니다.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  english_pob_choice: they buried him in the city of David, but not in the tombs of the kings
  chosen_korean: 사람들이 그를 다윗 성에 묻었지만 왕들의 무덤에는 묻지 않았습니다
  alternatives_korean:
  - 그를 다윗 성에 묻었지만 왕들의 묘실에는 묻지 않았습니다
  - 그를 다윗 성에 장사했지만 왕들의 무덤에는 장사하지 않았습니다
  lexicon: HALOT
  rationale: ‘묻다’로 매장 동사를 일관되게 옮기고, ‘다윗 성’과 ‘왕들의 무덤’의 대비를 분명히 했습니다.
