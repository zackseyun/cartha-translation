  text: בֶּן שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וּ/שְׁמוֹנֶ֣ה שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יֵּ֨לֶךְ֙ בְּ/לֹ֣א חֶמְדָּ֔ה וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֖א בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
  footnotes:
  - marker: a
    text: Or 'he went away without being desired,' preserving the more literal sense of the Hebrew phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 서른두 살에 왕이 되었고, 예루살렘에서 팔 년 동안 다스렸습니다. 그는 아무런 애도도 받지 못한 채 세상을 떠났고, 사람들이 그를 다윗 성에 묻었지만 왕들의 무덤에는 묻지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아무런 애도도 받지 못한 채’는 히브리어 בְּלֹא חֶמְדָּה의 직역 가능성(‘원함/소망 없이’)을 문맥에 따라 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם / בְמָלְכוֹ
  english_pob_choice: thirty-two years old when he began to reign
  chosen_korean: 서른두 살에 왕이 되었고
  alternatives_korean:
  - 서른두 살이었고 왕이 되었을 때
  - 서른두 살에 다스리기 시작했고
  lexicon: HALOT
  rationale: 히브리어의 연령 공식과 즉위 시점을 자연스러운 한국어로 옮기되, ‘왕이 되다’로 간결하게 왕위 즉위를 드러냈습니다.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  english_pob_choice: he reigned eight years
  chosen_korean: 예루살렘에서 팔 년 동안 다스렸습니다
  alternatives_korean:
  - 예루살렘에서 팔 년 동안 통치했습니다
  - 예루살렘에서 팔 해 동안 왕이었습니다
  lexicon: HALOT
  rationale: מָלַךְ의 통치 의미를 살리면서도 한국어 역사 서술에 자연스러운 ‘다스리다’로 옮겼습니다.
- source_word: בְּלֹא חֶמְדָּה
  english_pob_choice: with no regret
  chosen_korean: 아무런 애도도 받지 못한 채
  alternatives_korean:
  - 아무런 아쉬움도 없이
  - 사람들의 바람이나 애정 없이
  lexicon: HALOT
  rationale: 직역하면 ‘욕망 없이/원함 없이’이지만, 문맥상 죽음에 대한 상실감과 애도의 부재를 가리키므로 그 뉘앙스를 한국어로 드러냈습니다.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  english_pob_choice: they buried him in the city of David, but not in the tombs of the kings
  chosen_korean: 사람들이 그를 다윗 성에 묻었지만 왕들의 무덤에는 묻지 않았습니다
  alternatives_korean:
  - 그를 다윗 성에 묻었지만 왕들의 묘실에는 묻지 않았습니다
  - 그를 다윗 성에 장사했지만 왕들의 무덤에는 장사하지 않았습니다
  lexicon: HALOT
  rationale: ‘묻다’로 매장 동사를 일관되게 옮기고, ‘다윗 성’과 ‘왕들의 무덤’의 대비를 분명히 했습니다.
