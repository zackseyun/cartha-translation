id: 2CH.21.16
reference: 2 Chronicles 21:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
  footnotes:
  - marker: a
    text: Or 'aroused' or 'incited.' The Hebrew verb expresses the LORD's causing these nations to rise in hostility against Jehoram.
    reason: lexical_alternative
  - marker: b
    text: Or 'who were near the Cushites.' The phrase may describe the Arabians geographically as neighboring the Cushites.
    reason: lexical_alternative
  - marker: c
    text: Or 'the spirit of the Philistines and of the Arabians'.
    reason: previous_rendering
translation:
  language: ko
  text: 야훼께서 여호람에게 맞서 블레셋 사람들의 영과 구스 사람들 곁에 있는 아라비아 사람들의 영을 일으키셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “일으키셨습니다”, “자극하셨습니다.” 이 히브리어 동사는 여호와께서 이 민족들을 여호람에게 적대적으로 일어나게 하신다는 뜻을 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “구스 사람들 곁에 있는.” 이 구절은 아라비아 사람들을 지리적으로 구스 사람들 인근에 있었던 집단으로 묘사할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “블레셋 사람들의 영과 아라비아 사람들의 영”.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיָּעַר
  english_pob_choice: stirred up
  chosen_korean: 일으키셨습니다
  alternatives_korean:
  - 자극하셨습니다
  - 불러일으키셨습니다
  - 격동시키셨습니다
  lexicon: HALOT
  rationale: 원문의 동사와 영어 POB의 'stirred up'는 단순 허용이 아니라 적대적 행동을 일으키는 뉘앙스를 담으므로, 한국어에서는 '일으키셨습니다'로 옮겨 원인 행위를 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 편집 지침에 따라 신명기는 '야훼'로 음역하여 하나님의 고유명을 보존했습니다.
- source_word: עַל יְהוֹרָם
  english_pob_choice: against Jehoram
  chosen_korean: 여호람에게 맞서
  alternatives_korean:
  - 여호람을 향해
  - 여호람에 대하여
  lexicon: HALOT
  rationale: 적대적 동사와 결합된 עַל은 한국어에서 '맞서'가 가장 자연스럽고 공격 방향을 분명히 드러냅니다.
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  english_pob_choice: who were beside the Cushites
  chosen_korean: 구스 사람들 곁에 있는
  alternatives_korean:
  - 구스 사람들 가까이에 있는
  - 구스 사람들 옆에 있는
  lexicon: HALOT
  rationale: עַל יַד는 위치 관계를 나타내는 관용구이므로, 지리적 근접을 드러내는 '곁에 있는'으로 옮겼습니다.
theological_decisions:
- issue: 여호와의 주권적 개입과 적대의 발생
  chosen_reading: 본문은 야훼께서 이 민족들의 적대적 영을 직접 일으키셨다고 말합니다.
  alternative_readings:
  - 야훼께서 단지 이미 있던 적대감을 허용하셨다는 읽기
  rationale: 히브리어 동사가 직접적 원인 행위를 부여하므로, 이를 완화하지 않고 그대로 유지했습니다. 본문이 주는 신학적 긴장은 설명으로 해소하지 않았습니다.
  doctrine_reference: '번역 원칙: 신학적 긴장을 보존하고, 본문이 말하는 만큼만 말한다.'
