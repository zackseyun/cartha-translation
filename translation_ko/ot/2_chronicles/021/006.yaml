  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: ko
  text: 그는 이스라엘 왕들의 길로 걸었으니 — 아합의 집이 행한 것과 같았습니다. 이는 아합의 딸이 그의 아내였기 때문입니다. 그리하여 그는 야훼의 눈에 악한 일을 행했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  english_pob_choice: He walked in the way of
  chosen_korean: 그는 … 길로 걸었습니다
  alternatives_korean:
  - 그는 … 길을 갔습니다
  - 그는 … 방식을 따랐습니다
  lexicon: HALOT
  rationale: הלך with בְּדֶרֶךְ은 행실이나 삶의 방식을 가리키는 관용구이므로, 한국어에서는 ‘걸었습니다’로 비유를 살리면서 자연스럽게 옮겼습니다.
- source_word: מַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the kings of Israel
  chosen_korean: 이스라엘 왕들
  alternatives_korean:
  - 이스라엘의 왕들
  - 이스라엘의 열왕
  lexicon: HALOT
  rationale: 직역에 가까운 소유구문을 유지하되 한국어에서는 간결하게 ‘이스라엘 왕들’로 처리했습니다.
- source_word: בֵּית אַחְאָב
  english_pob_choice: the house of Ahab
  chosen_korean: 아합의 집
  alternatives_korean:
  - 아합의 가문
  - 아합의 왕조
  lexicon: HALOT
  rationale: 왕실 문맥에서 בַּיִת는 가문/왕조를 뜻하지만, 히브리어 표현의 표면성을 살리기 위해 ‘집’을 유지했습니다.
- source_word: בַּת אַחְאָב
  english_pob_choice: Ahab’s daughter
  chosen_korean: 아합의 딸
  alternatives_korean:
  - 아합의 여자 자손
  - 아합에게서 난 딸
  lexicon: HALOT
  rationale: 본문은 여기서 아달랴의 이름이 아니라 관계 표현을 쓰므로, 동일한 관계성을 한국어에서도 그대로 드러냈습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 평가 공식인 ‘눈에’를 유지해 히브리어 관용을 보존했고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
