  - 이스라엘의 열왕
  lexicon: HALOT
  rationale: 직역에 가까운 소유구문을 유지하되 한국어에서는 간결하게 ‘이스라엘 왕들’로 처리했습니다.
- source_word: בֵּית אַחְאָב
  english_pob_choice: the house of Ahab
  chosen_korean: 아합의 집
  alternatives_korean:
  - 아합의 가문
  - 아합의 왕조
  lexicon: HALOT
  rationale: 왕실 문맥에서 בַּיִת는 가문/왕조를 뜻하지만, 히브리어 표현의 표면성을 살리기 위해 ‘집’을 유지했습니다.
- source_word: בַּת אַחְאָב
  english_pob_choice: Ahab’s daughter
  chosen_korean: 아합의 딸
  alternatives_korean:
