  - 아합에게서 난 딸
  lexicon: HALOT
  rationale: 본문은 여기서 아달랴의 이름이 아니라 관계 표현을 쓰므로, 동일한 관계성을 한국어에서도 그대로 드러냈습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에
