  text: 그는 아합의 집이 행한 것처럼 이스라엘 왕들의 길을 걸었습니다. 아합의 딸이 그의 아내였기 때문입니다. 그는 야훼의 눈에 악한 일을 행했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  english_pob_choice: He walked in the way of
  chosen_korean: 그는 … 길로 걸었습니다
  alternatives_korean:
  - 그는 … 길을 갔습니다
  - 그는 … 방식을 따랐습니다
  lexicon: HALOT
  rationale: הלך with בְּדֶרֶךְ은 행실이나 삶의 방식을 가리키는 관용구이므로, 한국어에서는 ‘걸었습니다’로 비유를 살리면서 자연스럽게 옮겼습니다.
- source_word: מַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the kings of Israel
  chosen_korean: 이스라엘 왕들
  alternatives_korean:
