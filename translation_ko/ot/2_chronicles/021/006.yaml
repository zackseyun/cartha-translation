  source_fidelity: 히브리어의 세 절은 여호람의 행실, 그 배경이 되는 혼인 관계, 야훼 앞에서의 도덕적 평가를 차례로 진술합니다. 초안은 핵심 의미와 ‘야훼’를 충실히 보존했으나, 첫 문장에서 과거 서술의 시제가 ‘걸었으니’와 ‘같았습니다’로 어긋나며, 비교절의 연결도 다소 불명료합니다.
