  to: 그리하여 에돔은 유다에 반역하여 오늘날까지 유다의 지배에서 벗어나 있습니다[a]. 그때에 립나도 그의 지배에서 벗어나 반역했습니다. 그가 자기 조상들의 하나님 야훼[c][b]를 버렸기 때문입니다.
  rationale: 히브리어 관용구를 현대 한국어에서 자연스러운 ‘지배에서 벗어나다’로 번역하되, 원문의 ‘손 아래’ 표현은 각주에서 밝혔습니다. 또한 ‘오늘날까지’가 에돔의 유다로부터의 이탈 상태가 지속됨을 수식하도록 문장을 재구성했습니다. 마지막 원인절은 별도 문장으로 두어 에돔과 립나의 사건 전체 또는 립나의 반역에만 적용될 수 있는 원문의 범위상 여지를 유지했습니다.
