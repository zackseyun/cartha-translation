source:
  edition: WLC
  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
  footnotes:
  - marker: a
    text: Or 'revolted' / 'broke away' for 'rebelled.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from under the hand of Judah' and 'from under his hand,' an idiom for escaping rule or control.
    reason: cultural_note
  - marker: c
    text: The causal clause may explain Jehoram's troubles generally, or more specifically Libnah's rebellion.
    reason: alternative_reading
translation:
  language: ko
  text: 그리하여 에돔은 유다에 반역하여 오늘날까지 유다의 지배에서 벗어나 있습니다[a]. 그때에 립나도 그의 지배에서 벗어나 반역했습니다. 그가 자기 조상들의 하나님 야훼[c][b]를 버렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘반란을 일으켰다’, ‘반기를 들었다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘유다의 손 아래에서’와 ‘그의 손 아래에서’는 지배나 통치 아래에서 벗어남을 뜻하는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 이 원인절은 여호람에게 닥친 재난 전반을 설명할 수도 있고, 더 좁게는 립나의 반역만을 설명할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  english_pob_choice: rebelled
  chosen_korean: 반역했습니다
  alternatives_korean:
  - 반란을 일으켰습니다
  - 배반했습니다
  lexicon: HALOT
  rationale: 정치적 종속 관계를 깨는 פשע의 힘을 살리기 위해, 단순히 ‘떠났다’보다 강한 ‘반역하다’를 택했습니다.
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  english_pob_choice: from under the hand of / from under his hand
  chosen_korean: 손 아래에서
  alternatives_korean:
  - 권세 아래에서
  - 통제 아래에서
  lexicon: HALOT
  rationale: 히브리어의 관용구를 그대로 살려 ‘손 아래에서’로 옮겨, 지배에서 벗어났다는 이미지를 보존했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 이날까지
  - 지금까지
  lexicon: HALOT
  rationale: 기록 당시까지 지속된 상태를 나타내는 관용적 표현으로 자연스럽고, 원문의 시간 표지를 유지합니다.
- source_word: עָזַב
  english_pob_choice: had forsaken
  chosen_korean: 버렸기 때문입니다
  alternatives_korean:
  - 떠났기 때문입니다
  - 저버렸기 때문입니다
  lexicon: HALOT
  rationale: 여기서는 단순한 이탈보다 언약적·관계적 단절의 뉘앙스가 강하므로 ‘버리다’가 적절합니다.
theological_decisions:
- issue: ਯְהוָה의 한국어 처리
  chosen_reading: 개인적 이름으로서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 하나님의 고유명을 직접 사용하므로, 관용적 대체칭호보다 स्रोत-직접형을 택했습니다.
  doctrine_reference: Tetragrammaton rendering policy
- issue: ‘그의 조상들의 하나님’의 수식 관계
  chosen_reading: ‘그의 조상들의 하나님인 야훼’로 붙여, 아버지/조상들과의 언약적 연속성을 드러냈습니다.
  alternative_readings:
  - 그의 조상들의 하나님 야훼
  - 야훼, 그의 조상들의 하나님
  rationale: 히브리어 속격구조를 한국어에서도 명시적으로 보여 주어, 단순 호칭이 아니라 역사적·언약적 정체성을 유지했습니다.
  doctrine_reference: Covenant continuity in Chronicles
