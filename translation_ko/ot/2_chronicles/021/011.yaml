source:
  edition: WLC
  text: גַּם ה֥וּא עָשָֽׂה בָמ֖וֹת בְּ/הָרֵ֣י יְהוּדָ֑ה וַ/יֶּ֨זֶן֙ אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וַ/יַּדַּ֖ח אֶת יְהוּדָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
  footnotes:
  - marker: a
    text: Or 'caused the inhabitants of Jerusalem to prostitute themselves'; the Hebrew uses covenant-infidelity language that can evoke both sexual immorality and religious apostasy.
    reason: lexical_alternative
  - marker: b
    text: Or 'led Judah astray' or 'drove Judah away from the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그도 유다 산지에 산당들을 만들고, 예루살렘 주민들이 음행하게 했으며[a], 유다를 그릇된 길로 이끌었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זנה는 문자적인 성적 부도덕을 가리킬 수도 있고, 언약에 대한 불성실 곧 배교를 음행에 빗대어 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נדח는 여기서 ‘그릇된 길로 이끌다’라는 뜻으로 이해할 수 있습니다. ‘유다를 떠나게 하다’ 또는 ‘유다를 미혹하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  english_pob_choice: He also
  chosen_korean: 그도
  alternatives_korean:
  - 그 역시
  - 또 그도
  lexicon: HALOT
  rationale: 가ם과 독립 인칭대명사의 덧붙임과 강조를 자연스러운 현대 한국어로 살려, 앞선 악행의 연속이라는 의미를 간결하게 전달했습니다.
- source_word: בָמ֖וֹת
  english_pob_choice: high places
  chosen_korean: 산당들을
  alternatives_korean:
  - 높은 곳들
  - 산당들
  lexicon: HALOT
  rationale: 역사적·종교적 맥락에서 בָּמוֹת는 우상 숭배의 산당을 가리키므로, 한국어 성경 용례에 맞는 ‘산당’이 가장 직접적입니다.
- source_word: וַיֶּזֶן
  english_pob_choice: led ... into prostitution
  chosen_korean: 음행으로 이끌었으며
  alternatives_korean:
  - 창녀짓하게 했으며
  - 매춘으로 이끌었으며
  - 음행하게 했으며
  lexicon: HALOT
  rationale: 히필형 זנה의 강한 유발 의미를 살리되, 한국어에서 과도하게 노골적이거나 현대적 속어로 흐르지 않도록 ‘음행으로 이끌다’로 옮겼습니다.
- source_word: וַיַּדַּח
  english_pob_choice: led Judah astray
  chosen_korean: 미혹시켰습니다
  alternatives_korean:
  - 잘못된 길로 이끌었습니다
  - 길을 잃게 했습니다
  - 유다를 떠나게 했습니다
  lexicon: HALOT
  rationale: נדח의 ‘쫓아내다’보다는 여기서의 ‘그릇된 길로 이끎’이 핵심이므로, 우상 숭배와 언약 불성실을 함께 담을 수 있는 ‘미혹시키다’를 택했습니다.
theological_decisions:
- issue: וַיֶּזֶן과 וַיַּדַּח의 관계를 성적 부도덕과 언약적 배교 사이에서 어떻게 드러낼지
  chosen_reading: 본문에는 ‘음행’과 ‘미혹’이라는 두 층위를 분리해 두어, 성적·종교적 불성실이 함께 암시되도록 했습니다.
  alternative_readings:
  - 예루살렘 주민들을 매춘으로 이끌었으며, 유다를 배교하게 했습니다
  - 예루살렘 주민들을 부정하게 만들었으며, 유다를 떠나게 했습니다
  rationale: 히브리어는 성적 은유와 언약 배신의 의미를 함께 담을 수 있으므로, 한쪽으로만 좁히지 않고 두 표현을 병치해 원문의 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
