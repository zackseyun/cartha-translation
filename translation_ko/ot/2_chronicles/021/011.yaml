- from: 그도 유다 산지에 산당들을 만들고, 예루살렘 주민들을 음행으로 이끌었으며, 유다를 미혹시켰습니다.[a][b]
  to: 그도 유다 산지에 산당들을 만들고, 예루살렘 주민들이 음행하게 했으며[a], 유다를 그릇된 길로 이끌었습니다.[b]
