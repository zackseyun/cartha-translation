revisions:
- from: 그러나 당신은 이스라엘 왕들의 길로 걸어가셨고, 유다와 예루살렘 주민들을[a] 성적 부도덕으로 이끄셨습니다. 아합의 집이 그들을 성적 부도덕으로 이끌었던 것처럼 말입니다. 당신은 또한 당신보다 더 나은[b] 당신 아버지의 집의 형제들을 죽였습니다.
  to: 그러나 당신은 이스라엘 왕들의 길을 따랐으며, 아합의 집[b]이 그들을 음행하게 한 것처럼 유다와 예루살렘 주민들을 음행하게 했습니다[a]. 또한 당신보다 더 나았던 당신 아버지 집안의 형제들을 죽였습니다.
  rationale: 사역형 זנה의 반복과 아합 집과의 비교를 ‘음행하게 하다’로 일관되게 반영했습니다. ‘음행’은 본문의 성적 은유를 유지하면서도, 각주가 밝히는 언약 불성실의 비유적 차원을 좁히지 않습니다. ‘아합의 집’ 각주는 해당 낱말 바로 뒤로 옮겼고, 왕가 친족을 뜻하는 표현은 자연스러운 한국어로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:18:13Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. וַתַּזְנֶה 및 כְּהַזְנוֹת의 사역(使役) 표현은 ‘성적 부도덕으로 이끌다’보다 ‘음행하게 하다’가 더 직접적으로 보존합니다. 또한 אַחֶיךָ בֵּית אָבִיךָ는 ‘당신 아버지 집안의 형제들’로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: 초안의 ‘길로 걸어가셨고’와 ‘당신 아버지의 집의 형제들’은 현대 표준어에서 다소 부자연스럽습니다. ‘길을 따랐으며’와 ‘아버지 집안의 형제들’이 자연스럽습니다. 합쇼체는 유지하되, 책망받는 인물에 대한 불필요한 주체 높임 '-시-'는 제거했습니다.
  terminology: ‘아합의 집’은 왕조를 가리키는 성경적 표현으로 유지하고 각주를 그 말에 정확히 연결했습니다. זנה의 은유는 ‘음행하게 하다’로 보존하며, 각주에서 언약 불성실 및 우상숭배의 문맥적 함의를 설명합니다.
  issues:
  - severity: medium
    issue: 각주 b의 앵커 위치가 잘못되었습니다.
    rationale: 각주 b는 ‘아합의 집’이 아합 왕조를 뜻한다는 문화적 설명인데, 초안에서는 ‘당신보다 더 나은’ 뒤에 붙어 있어 해당 표현을 수식하지 못합니다.
  - severity: medium
    issue: ‘성적 부도덕으로 이끌다’가 반복된 히브리어 사역형 זנה의 표현력을 약화합니다.
    rationale: 본문은 유다와 예루살렘 주민을 음행하게 ‘만든’ 행위를 아합 집의 행위와 비교합니다. ‘음행하게 하다’는 예언서의 성적·언약적 은유와 사역성을 함께 더 잘 보존합니다.
  - severity: low
