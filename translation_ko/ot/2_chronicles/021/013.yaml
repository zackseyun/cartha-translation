    rationale: ‘길로 걸어가셨고’보다 ‘길을 따랐으며’가 관용적으로 자연스럽고, 악한 왕을 향한 고발문에서 ‘-시-’를 쓰지 않아도 합쇼체의 격식은 충분히 유지됩니다.
