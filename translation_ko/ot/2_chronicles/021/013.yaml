id: 2CH.21.13
reference: 2 Chronicles 21:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
  footnotes:
  - marker: a
    text: Or, more literally, 'made Judah and the inhabitants of Jerusalem play the prostitute,' a prophetic metaphor for covenant unfaithfulness, often expressed in idolatry.
    reason: lexical_alternative
  - marker: b
    text: '''The house of Ahab'' refers to Ahab’s ruling dynasty.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 당신은 이스라엘 왕들의 길로 걸어가셨고, 유다와 예루살렘 주민들을[a] 성적 부도덕으로 이끄셨습니다. 아합의 집이 그들을 성적 부도덕으로 이끌었던 것처럼 말입니다. 당신은 또한 당신보다 더 나은[b] 당신 아버지의 집의 형제들을 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘유다와 예루살렘 주민들을 창녀처럼 살게 하셨다’. 이는 언약에 대한 불성실, 특히 우상숭배를 가리키는 예언적 은유입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아합의 집’은 아합의 왕조를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  english_pob_choice: have walked in the way of
  chosen_korean: …의 길로 걸어가셨고
  alternatives_korean:
  - …의 길을 따르셨고
  - …의 길로 가셨고
  lexicon: HALOT
  rationale: 히브리어 관용구는 삶의 방식과 행위를 따르는 뜻이므로, 한국어에서도 ‘길로 걷다’의 비유를 살리되 현대 문체로 자연스럽게 옮겼습니다.
- source_word: מַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the kings of Israel
  chosen_korean: 이스라엘 왕들의
  alternatives_korean:
  - 이스라엘의 왕들의
  - 이스라엘 왕들의
  lexicon: HALOT
  rationale: 유다와의 역사적 대비를 보존하기 위해 직역에 가깝게 처리했습니다.
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלַם
  english_pob_choice: have led Judah and the inhabitants of Jerusalem into sexual immorality
  chosen_korean: 유다와 예루살렘 주민들을 성적 부도덕으로 이끄셨습니다
  alternatives_korean:
  - 유다와 예루살렘 주민들을 음행하게 하셨습니다
  - 유다와 예루살렘 주민들을 창녀처럼 살게 하셨습니다
  lexicon: HALOT
  rationale: זנה의 예언적 비유를 한국어에서 노골적이면서도 현대적으로 드러내기 위해 ‘성적 부도덕’으로 옮겼습니다. 영어 POB의 결정과 같이 우상숭배적 배교의 함의를 과도하게 좁히지 않았습니다.
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  english_pob_choice: as the house of Ahab led them into sexual immorality
  chosen_korean: 아합의 집이 그들을 성적 부도덕으로 이끌었던 것처럼
  alternatives_korean:
  - 아합의 집이 그들을 음행하게 했던 것처럼
  - 아합의 집이 그들에게 음행을 행하게 했던 것처럼
  lexicon: HALOT
  rationale: 반복되는 זנה를 평행적으로 살리면서도 비교 구조(כְּ)를 분명히 드러냈습니다.
- source_word: בֵּית אַחְאָב
  english_pob_choice: the house of Ahab
  chosen_korean: 아합의 집
  alternatives_korean:
  - 아합의 가문
  - 아합의 왕조
  lexicon: HALOT
  rationale: 성경의 통용 표현을 유지하되, 단순한 건물이 아니라 왕조를 가리키는 용법은 문맥으로 드러나게 했습니다.
- source_word: אַחֶיךָ בֵית אָבִיךָ
  english_pob_choice: your brothers of your father’s house
  chosen_korean: 당신 아버지의 집의 형제들
  alternatives_korean:
  - 당신 아버지 집안의 형제들
  - 당신 아버지의 집에 속한 형제들
  lexicon: HALOT
  rationale: 앱포지션 관계를 살려 형제들이 왕가 내부의 친족임을 드러냈습니다. 영어 개정판이 복원한 구조에 맞추었습니다.
- source_word: הַטּוֹבִים מִמְּךָ
  english_pob_choice: who were better than you
  chosen_korean: 당신보다 더 나은
  alternatives_korean:
  - 당신보다 더 훌륭한
  - 당신보다 더 선한
  lexicon: HALOT
  rationale: טוב의 비교 의미를 과장 없이 옮겨, 문맥의 책망을 간결하게 유지했습니다.
- source_word: הָרָגְתָּ
  english_pob_choice: you have killed
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 살해했습니다
  - 죽이셨습니다
  lexicon: HALOT
  rationale: 직접적인 살해 진술을 현대 한국어의 표준 서술형으로 옮겼습니다.
theological_decisions:
- issue: זנה의 비유적 의미
  chosen_reading: ‘성적 부도덕’으로 옮겨 예언적 성적 은유를 유지하되, 우상숭배/언약 불성실의 함의는 문맥으로 남겨 두었습니다.
  alternative_readings:
  - ‘우상숭배’로 명시적으로 옮김
  - ‘음행’으로 보다 문자적으로 옮김
  rationale: 원문은 성적 은유를 통해 영적 배교를 책망합니다. 한국어에서는 지나치게 고어적이거나 지나치게 해석적인 표현을 피하고, 본문의 수사를 보존하는 쪽이 더 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
