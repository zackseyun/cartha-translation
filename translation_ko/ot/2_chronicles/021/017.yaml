  text: וַ/יַּעֲל֤וּ בִֽ/יהוּדָה֙ וַ/יִּבְקָע֔וּ/הָ וַ/יִּשְׁבּ֗וּ אֵ֤ת כָּל הָ/רְכוּשׁ֙ הַ/נִּמְצָ֣א לְ/בֵית הַ/מֶּ֔לֶךְ וְ/גַם בָּנָ֖י/ו וְ/נָשָׁ֑י/ו וְ/לֹ֤א נִשְׁאַר ל/וֹ֙ בֵּ֔ן כִּ֥י אִם יְהוֹאָחָ֖ז קְטֹ֥ן בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
  footnotes:
  - marker: a
    text: Jehoahaz is likely the same person elsewhere called Ahaziah (compare 2 Kings 8:24–26; 2 Chronicles 22:1).
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 유다로 올라와 그곳을 침입하여, 왕궁에서 찾아낸 모든 소유물과 그의 아들들과 그의 아내들까지도 모두 빼앗아 갔습니다. 그래서 요아스에게는 그의 아들들 가운데 막내인 여호아하스[a]밖에 남지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여호아하스는 다른 곳에서 아하시야로 불리는 동일 인물일 가능성이 있습니다(열왕기하 8:24–26; 2역대기 22:1 비교).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  english_pob_choice: They came up against Judah
  chosen_korean: 유다로 올라와
  alternatives_korean:
  - 유다를 향해 올라와
  - 유다에 쳐들어와
  lexicon: HALOT
  rationale: עלה עם/ב의 이동 관용을 살리되, 문맥상 적대적 진군이 분명하므로 한국어에서는 간결하게 전쟁 서술로 자연스럽게 옮겼습니다.
- source_word: וַיִּבְקָעוּהָ
  english_pob_choice: invaded it
  chosen_korean: 그곳을 침입하여
  alternatives_korean:
  - 그곳을 돌파하여
  - 그곳을 무너뜨려
  lexicon: HALOT
  rationale: בקע는 ‘쪼개다/가르다’의 뜻이지만 여기서는 유다를 무력으로 뚫고 들어간 상황이므로, 과도한 해석 없이 군사적 ‘침입’으로 옮겼습니다.
- source_word: וַיִּשְׁבּוּ
  english_pob_choice: carried away
  chosen_korean: 빼앗아 갔습니다
  alternatives_korean:
  - 사로잡아 갔습니다
  - 끌고 갔습니다
  lexicon: HALOT
  rationale: 포획과 약탈을 함께 포함하는 동사이므로, 재산과 사람 모두에 자연스럽게 적용되는 표현을 택했습니다.
- source_word: יְהוֹאָחָז
  english_pob_choice: Jehoahaz
  chosen_korean: 여호아하스
  alternatives_korean:
  - 아하시야
  lexicon: HALOT
  rationale: 본문의 히브리어 표기는 יְהוֹאָחָז이므로 본문에는 이를 그대로 반영하되, 한국어 음역은 표준적인 ‘여호아하스’로 적었습니다.
theological_decisions:
- issue: 본문의 인명 동일시 문제(여호아하스 vs. 아하시야)
  chosen_reading: 본문에는 히브리어 마소라 본문의 이름을 따라 여호아하스를 두고, 각주에서 아하시야와의 동일인 가능성을 밝혔습니다.
  alternative_readings:
  - 아하시야로 본문을 정리하는 읽기
  rationale: 이는 교리 문제가 아니라 본문 대조와 인명 식별의 문제이므로, 원문 우선 원칙을 지키면서 독자의 혼동을 줄이기 위해 대체 동일시를 각주로 처리했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 평행본문 대조(열왕기하 8:24–26; 2역대기 22:1)
