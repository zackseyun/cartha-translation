  lexicon: HALOT
  rationale: מַגֵּפָה는 전염병일 수도 있지만, 문맥상 여호와께서 내리시는 치명적 재앙/타격의 폭이 핵심이므로 ‘큰 재앙’이 가장 포괄적이고 자연스럽습니다.
theological_decisions:
- issue: 예언적 분사 נֹגֵף의 시제/상
  chosen_reading: 진행형 현재로서의 임박한 심판(‘치고 계십니다’)
  alternative_readings:
  - ‘치실 것입니다’로 옮기는 단순 미래
  - ‘치고 있습니다’의 현재 서술
  rationale: 히브리어의 הִנֵּה + 분사 조합은 임박한 심판을 생생하게 알리는 기능이 있어, 단순 미래보다 현재 진행형이 경고의 긴박함을 더 잘 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
