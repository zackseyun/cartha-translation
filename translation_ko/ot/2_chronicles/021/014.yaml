  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
  footnotes:
  - marker: a
    text: Or 'will strike ... with a great blow/affliction.' The Hebrew participle can be rendered as imminent or simple future, and מַגֵּפָה can denote a plague or a severe divinely inflicted blow.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 야훼께서 큰 재앙으로 당신의 백성과 당신의 아들들과 당신의 아내들과 당신의 모든 소유를 치실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 큰 재앙으로 … 치고 계십니다.’ 히브리어 분사는 임박한 행동이나 단순 미래로 옮길 수 있으며, מַגֵּפָה는 전염병 또는 야훼께서 내리시는 심한 타격을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
