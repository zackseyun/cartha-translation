- source_word: נֹגֵף
  english_pob_choice: is striking
  chosen_korean: 치고 계십니다
  alternatives_korean:
  - 치십니다
  - 치실 것입니다
  - 때리고 계십니다
  lexicon: HALOT
  rationale: 히브리어 분사형의 진행적·임박한 현재성을 살리면서, 징벌 행위의 힘을 한국어 동사 ‘치다’로 자연스럽게 드러냈습니다.
- source_word: מַגֵּפָה גְדוֹלָה
  english_pob_choice: with a great plague
  chosen_korean: 큰 재앙으로
  alternatives_korean:
