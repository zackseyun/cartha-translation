  source_fidelity: 히브리어 הִנֵּה + 분사 נֹגֵף는 심판의 임박성을 강하게 드러내며, 한국어의 ‘치실 것입니다’는 이를 자연스럽게 미래의 경고로 전달합니다. מַגֵּפָה는 전염병에 한정되지 않고 하나님께서 내리시는 심한 재앙 또는 타격을 뜻할 수 있으므로 ‘큰 재앙’은 적절합니다.
  naturalness: 기존의 ‘큰 재앙으로 … 치고 계십니다’는 문법적으로 가능하나, 한국어에서는 심판이 이미 진행 중이라는 인상을 비교적 강하게 줍니다. 예언적 경고 문맥에서는 ‘큰 재앙으로 … 치실 것입니다’가 더 자연스럽고 명료합니다. 반복되는 소유 대명사는 히브리어의 강조를 보존하므로 유지할 수 있습니다.
