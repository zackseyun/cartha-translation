source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
  footnotes:
  - marker: a
    text: Or 'will strike ... with a great blow/affliction.' The Hebrew participle can be rendered as imminent or simple future, and מַגֵּפָה can denote a plague or a severe divinely inflicted blow.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 야훼께서 큰 재앙으로 당신의 백성과 당신의 아들들과 당신의 아내들과 당신의 모든 소유를 치고 계십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 타격/재앙을 내리실 것입니다.’ 히브리어 분사는 임박한 현재나 단순 미래로 옮길 수 있고, מַגֵּפָה는 전염병이나 심한 신적 타격을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: HALOT
  rationale: 예언적 경고의 주의를 끄는 감탄사로, 현대 한국어에서 격식과 즉시성을 함께 살릴 수 있는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 절은 여호와 이름을 직접 사용하므로, 본 프로젝트 기본값에 따라 고유한 언약 სახელ을 ‘야훼’로 옮겼습니다.
- source_word: נֹגֵף
  english_pob_choice: is striking
  chosen_korean: 치고 계십니다
  alternatives_korean:
  - 치십니다
  - 치실 것입니다
  - 때리고 계십니다
  lexicon: HALOT
  rationale: 히브리어 분사형의 진행적·임박한 현재성을 살리면서, 징벌 행위의 힘을 한국어 동사 ‘치다’로 자연스럽게 드러냈습니다.
- source_word: מַגֵּפָה גְדוֹלָה
  english_pob_choice: with a great plague
  chosen_korean: 큰 재앙으로
  alternatives_korean:
  - 큰 전염병으로
  - 큰 재난으로
  - 큰 징벌로
  lexicon: HALOT
  rationale: מַגֵּפָה는 전염병일 수도 있지만, 문맥상 여호와께서 내리시는 치명적 재앙/타격의 폭이 핵심이므로 ‘큰 재앙’이 가장 포괄적이고 자연스럽습니다.
theological_decisions:
- issue: 예언적 분사 נֹגֵף의 시제/상
  chosen_reading: 진행형 현재로서의 임박한 심판(‘치고 계십니다’)
  alternative_readings:
  - ‘치실 것입니다’로 옮기는 단순 미래
  - ‘치고 있습니다’의 현재 서술
  rationale: 히브리어의 הִנֵּה + 분사 조합은 임박한 심판을 생생하게 알리는 기능이 있어, 단순 미래보다 현재 진행형이 경고의 긴박함을 더 잘 전달합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
