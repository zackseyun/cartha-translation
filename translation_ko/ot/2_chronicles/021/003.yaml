base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
  footnotes:
  - marker: a
    text: Or 'choice things' or 'costly gifts' for 'precious things.' The Hebrew term can refer broadly to valuable or select items.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 아버지는 은과 금과 값진 물건들[a]과 함께, 유다의 견고한 성읍들도 그들에게 많이 주었습니다. 그러나 그는 왕국을 여호람에게 주었는데, 이는 그가 맏아들이었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘귀한 물건들’, ‘선택된 물건들’로도 옮길 수 있습니다. 히브리어는 값비싼 물품과 귀한 선택품을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּנוֹת רַבּוֹת
  english_pob_choice: many gifts
  chosen_korean: 많이 주었습니다
  alternatives_korean:
  - 많은 선물을 주었습니다
  - 풍성한 선물을 주었습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘많은 선물들’이라는 양적 풍성을 말하므로, 문맥상 더 자연스러운 동사구로 옮기되 ‘많이’로 풍성함을 살렸습니다.
- source_word: וּלְמִגְדָּנֹות
  english_pob_choice: precious things
  chosen_korean: 값진 물건들
  alternatives_korean:
  - 귀한 것들
  - 선택된 물건들
  - 값비싼 물건들
  lexicon: HALOT
  rationale: מִגְדָּנוֹת는 단순한 식품이 아니라 선택된 귀중품을 넓게 가리킬 수 있으므로, 현대 한국어에서는 ‘값진 물건들’이 가장 포괄적으로 대응합니다.
- source_word: עָרֵי מְצֻרוֹת
  english_pob_choice: fortified cities
  chosen_korean: 견고한 성읍들
  alternatives_korean:
  - 요새화된 성읍들
  - 튼튼한 성읍들
  lexicon: HALOT
  rationale: 군사적 방어 기능이 있는 עיר־מצורות를 한국어 성서 문맥에서 자연스럽게 드러내는 표현으로 ‘견고한 성읍들’을 택했습니다.
- source_word: הַבְּכוֹר
  english_pob_choice: the firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 장자
  - 첫째 아들
  lexicon: HALOT
  rationale: 법적·가족적 지위를 뜻하는 표현이므로 ‘맏아들’이 현대 독자에게 가장 직관적이며, 장자의 권리를 자연스럽게 전달합니다.
theological_decisions:
- issue: 왕국을 여호람에게 준 이유의 표현
  chosen_reading: ‘그러나’로 형제들에게 준 많은 선물과 왕국의 귀속 사이의 대비를 살리고, ‘이는 그가 맏아들이었기 때문입니다’로 이유를 분명히 했습니다.
  alternative_readings:
  - ‘그리고’로 단순 연결
  - ‘그가 첫째였기 때문입니다’
  rationale: 본문은 선물 분배와 왕국 승계를 대비시키므로, 한국어에서도 대조를 분명히 드러내는 편이 서술 의도를 더 잘 반영합니다.
  doctrine_reference: 왕위 계승의 서술적 정당화(역대기 사가의 왕권 이해)
