lexical_decisions:
- source_word: וְאַחֲרֵי כָּל זֹאת
  english_pob_choice: And after all this
  chosen_korean: 이 모든 일 후에
  alternatives_korean:
  - 그 모든 일 후에
  - 그리고 이 모든 일 후에
  lexicon: HALOT
  rationale: 앞선 사건들을 가리키는 요약적 시간표현이므로, 자연스러운 한국어로 '이 모든 일 후에'라고 옮기되 서술 흐름은 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 고유한 신명은 관습적 호칭이 아니라 음역형 '야훼'로 옮겨, 본문이 직접 지시하는 하나님의 이름을 드러냈습니다.
- source_word: בְּמֵעָיו
  english_pob_choice: in his intestines
  chosen_korean: 그의 창자에
  alternatives_korean:
  - 그의 내장에
  - 그의 배 속에
  lexicon: HALOT
  rationale: מֵעֶה는 내장/창자를 가리키므로, 현대 한국어에서 구체적이면서도 지나치게 해부학적으로 딱딱하지 않은 '창자'를 선택했습니다.
- source_word: לְאֵין מַרְפֵּא
  english_pob_choice: incurable
  chosen_korean: 고칠 수 없는
  alternatives_korean:
  - 치유할 수 없는
  - 낫지 않는
  lexicon: HALOT
  rationale: 직역하면 '치유가 없음'이지만, 한국어에서는 질병의 절망적 상태를 분명히 드러내는 '고칠 수 없는'이 가장 자연스럽습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼로 표기했습니다.
