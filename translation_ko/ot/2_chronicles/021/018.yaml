  to: 이 모든 일 후에 야훼께서 그를 창자에 생긴 고칠 수 없는 병으로 치셨습니다.[a]
  rationale: 수정문은 원문의 직접적 행위 표현(‘그를 치셨습니다’)을 보존하면서, 질병이 창자에 관련되었음을 자연스러운 한국어 어순으로 명확히 합니다. ‘생긴’은 한국어에서 ‘창자에 [있는] 병’의 관계를 자연스럽게 표현하는 최소한의 보완입니다. 각주는 לְאֵין מַרְפֵּא의 문자적 의미와 대안적 번역을 정확히 반영하도록 고쳤습니다.
