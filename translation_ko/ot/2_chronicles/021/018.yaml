  text: 이 모든 일 후에 야훼께서 그의 창자에 고칠 수 없는 병으로 그를 치셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “치유할 수 없는”이며, 문자적으로는 “치유가 없게 되는 상태로.”
