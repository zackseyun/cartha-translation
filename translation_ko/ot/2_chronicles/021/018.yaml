  - 주
  rationale: 본문이 고유명사 יְהוָה를 직접 사용하므로, 이를 호칭이나 대체어로 완화하지 않고 이름 자체로 드러내는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
