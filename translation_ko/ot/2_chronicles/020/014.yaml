id: 2CH.20.14
reference: 2 Chronicles 20:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: ko
  text: 그리고 스가랴의 아들이며 브나야의 아들이며 여이엘의 아들이며 맛다냐의 아들인 레위 사람, 곧 아삽 자손 가운데 속한 여하시엘에게 회중 가운데에서 야훼의 영이 임했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יַחֲזִיאֵל
  english_pob_choice: And Jahaziel
  chosen_korean: 그리고 여하시엘은
  alternatives_korean:
  - 또 여하시엘은
  - 그리고 야하시엘은
  lexicon: 고유명사 음역
  rationale: 서사의 연결을 살려 ‘그리고’로 옮기고, 인명은 현대 외래어 표기 관행에 맞게 음역했습니다.
- source_word: בֶּן זְכַרְיָ֡הוּ בֶּן בְּנָיָה בֶּן יְעִיאֵל בֶּן מַתַּנְיָ֛ה
  english_pob_choice: son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah
  chosen_korean: 아들 스가랴, 아들 브냐, 아들 여이엘, 아들 맛다냐의 아들
  alternatives_korean:
  - 스가랴의 자손, 브냐의 자손, 여이엘의 자손, 맛다냐의 자손
  - 스가랴, 브냐, 여이엘, 맛다냐의 후손
  lexicon: HALOT
  rationale: 반복되는 בֶּן 계열은 계보 표지를 분명히 드러내기 위해 ‘아들’로 직역했고, 한국어 어순에 맞게 마지막 ‘아들’에 소유격을 붙였습니다.
- source_word: הַ/לֵּוִי מִן בְּנֵ֣י אָסָ֑ף
  english_pob_choice: the Levite, from the sons of Asaph
  chosen_korean: 레위 사람으로서 아삽의 자손 가운데 있었는데
  alternatives_korean:
  - 레위 사람이며 아삽의 자손 가운데 있었는데
  - 레위 사람, 곧 아삽의 자손 가운데서
  lexicon: HALOT
  rationale: ‘레위 사람’과 ‘아삽의 자손’은 직분과 계열을 함께 밝히는 말이므로, 관계를 자연스럽게 드러내는 ‘으로서 … 가운데’로 옮겼습니다.
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  english_pob_choice: the Spirit of Yahweh came upon him
  chosen_korean: 야훼의 영이 그 위에 임하셨습니다
  alternatives_korean:
  - 야훼의 영이 그에게 임하셨습니다
  - 야훼의 영이 그에게 임했습니다
  lexicon: HALOT
  rationale: 성경적 관용구의 사건성을 살려 ‘임하셨습니다’로 옮겼고, 주어가 하나님의 영이므로 한국어 관례에 따라 높임을 사용하지 않고 중립적 서술로 처리했습니다.
- source_word: בְּ/ת֖וֹךְ הַ/קָּהָֽל
  english_pob_choice: in the midst of the assembly
  chosen_korean: 회중 한가운데에
  alternatives_korean:
  - 회중 가운데에
  - 모임 한가운데에
  lexicon: HALOT
  rationale: קָהָל은 이 문맥에서 공적으로 모인 공동체를 가리키므로 ‘회중’이 적절하며, בְּתוֹךְ의 공간적 힘은 ‘한가운데에’로 살렸습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 고유명사 יְהוָה를 직접 사용하므로, POB 기준에 따라 제목어 대체가 아닌 고유명사 ‘야훼’로 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: רוּחַ יְהוָה의 의미
  chosen_reading: 야훼의 영이 … 임하셨습니다
  alternative_readings:
  - 야훼의 영이 … 위에 계셨습니다
  - 야훼의 영이 … 위에 있었다
  rationale: 여기서 רוּחַ는 단순한 내적 감정이 아니라 예언적 발화와 행동을 가능케 하는 하나님의 임재와 능력을 가리키므로, 사건성을 드러내는 ‘임하셨습니다’를 택했습니다.
  doctrine_reference: Affirmations; Translation philosophy §6
