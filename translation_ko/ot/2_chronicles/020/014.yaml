  revised_text: 그리고 스가랴의 아들이며 브나야의 아들이며 여이엘의 아들이며 맛다냐의 아들인 레위 사람, 곧 아삽 자손 가운데 속한 여하시엘에게 회중 가운데에서 야훼의 영이 임했습니다.
