  - severity: medium
    issue: ‘그 위에’와 위치어의 결합이 부자연스럽습니다.
    rationale: עָלָיו는 한국어 관용상 이 문맥에서 ‘그에게 임했다’가 자연스럽습니다. בְּתוֹךְ הַקָּהָל은 그 사건이 회중 가운데에서 일어났음을 수식하게 해야 합니다.
  - severity: low
