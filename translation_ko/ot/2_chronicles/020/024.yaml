source:
  edition: WLC
  text: וִֽ/יהוּדָ֛ה בָּ֥א עַל הַ/מִּצְפֶּ֖ה לַ/מִּדְבָּ֑ר וַ/יִּפְנוּ֙ אֶל הֶ֣/הָמ֔וֹן וְ/הִנָּ֧/ם פְּגָרִ֛ים נֹפְלִ֥ים אַ֖רְצָ/ה וְ/אֵ֥ין פְּלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
  footnotes:
  - marker: a
    text: Or 'dead bodies fallen to the ground.' The Hebrew phrase is more literally 'corpses, fallen to the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다가 광야를 향한 망대에 이르러 그 무리를 바라보니, 보십시오, 시체들이 땅에 쓰러져 있었고 살아남은 자가 하나도 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘땅으로 쓰러진 시체들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוּדָה
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유다 사람들
  - 유다의 군대
  lexicon: 고유명사
  rationale: 히브리어 고유명사를 기본적으로 음역해 두고, 문맥상 집단 전체를 가리키는 뉘앙스는 서술 동사와 후행 목적어로 드러내는 것이 자연합니다.
- source_word: הַמִּצְפֶּה לַמִּדְבָּר
  english_pob_choice: the lookout over the wilderness
  chosen_korean: 광야의 망대
  alternatives_korean:
  - 광야를 내려다보는 전망대
  - 광야의 감시초소
  lexicon: HALOT
  rationale: מִצְפֶּה는 ‘망대/조망 지점’ 계열의 장소명으로 이해하는 것이 적절하며, לַמִּדְבָּר는 광야와 연결된 지리적 방향성을 간결하게 살려 옮겼습니다.
- source_word: וַיִּפְנוּ אֶל הֶהָמוֹן
  english_pob_choice: they turned toward the multitude
  chosen_korean: 그 무리를 향해 돌아보니
  alternatives_korean:
  - 그 무리를 향해 몸을 돌리니
  - 그 무리를 바라보니
  lexicon: HALOT
  rationale: פנה의 핵심은 ‘돌이키다/향하다’이므로 ‘돌아보니’로 시각적 전환과 서술 진행을 함께 살렸고, הָמוֹן은 여기서 적군의 집합을 가리키지만 직접적으로는 ‘무리’가 무난합니다.
- source_word: פְּגָרִים נֹפְלִים אַרְצָה
  english_pob_choice: corpses lying on the ground
  chosen_korean: 시체들이 땅에 쓰러져 있었고
  alternatives_korean:
  - 시체들이 땅에 엎드러져 있었고
  - 주검들이 땅에 쓰러져 있었고
  lexicon: HALOT
  rationale: פֶּגֶר는 ‘시체/주검’이 가능하지만, 문장 전체의 생생함과 현대 한국어의 자연스러움을 고려해 ‘시체’로 옮겼고, נֹפְלִים אַרְצָה는 결과 상태를 ‘쓰러져 있었고’로 표현했습니다.
- source_word: וְאֵין פְּלֵיטָה
  english_pob_choice: and there was no survivor
  chosen_korean: 살아남은 자가 하나도 없었습니다
  alternatives_korean:
  - 도망친 자가 하나도 없었습니다
  - 남은 자가 하나도 없었습니다
  lexicon: HALOT
  rationale: פְּלֵיטָה는 단순한 탈출이 아니라 생존/도피의 결과를 포함하므로, 문맥상 ‘살아남은 자’가 가장 분명하게 의미를 전달합니다.
theological_decisions:
- issue: 시점의 생동감과 감탄 표현
  chosen_reading: וְהִנָּם의 돌발성을 살리기 위해 ‘보십시오’로 화자 내러티브의 급격한 전환을 표현했습니다.
  alternative_readings:
  - 그리고 보니
  - 보라
  rationale: 군중의 참상을 갑작스럽게 제시하는 서술 효과를 한국어에서도 유지하려는 선택입니다.
  doctrine_reference: 서사적 수사 보존
