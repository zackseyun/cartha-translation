  source_fidelity: 원문의 왕정 평가 관용구인 ‘아버지 아사의 길로/길에서 걸었다’와 ‘그 길에서 벗어나지 않았다’, 그리고 ‘야훼 보시기에 옳은 일을 했다’를 충실히 반영합니다. 다만 한국어에서는 ‘길을 걸었다’가 이 비유를 자연스럽게 보존합니다.
