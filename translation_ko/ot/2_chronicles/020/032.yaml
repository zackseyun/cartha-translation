  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: ko
  text: 그는 아버지 아사의 길을 걸었고, 그 길에서 벗어나지 않았으며, 야훼 보시기에 옳은 일을 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: He walked
  chosen_korean: 걸었습니다
  alternatives_korean:
  - 갔습니다
  - 살았습니다
  lexicon: HALOT
  rationale: 왕들의 행적을 평가하는 관용구에서 הלך은 단순한 이동보다 삶의 방식과 행실을 뜻하므로, ‘걸었습니다’로 원문의 비유를 살렸습니다.
- source_word: בְּדֶרֶךְ
  english_pob_choice: in the way
  chosen_korean: 길로
  alternatives_korean:
  - 길에서
  - 행실대로
  lexicon: HALOT
  rationale: דֶּרֶךְ의 비유적 의미를 유지하면서도 한국어 문맥에서는 ‘길로’가 가장 자연스럽고, 이어지는 ‘벗어나지 않았습니다’와도 잘 맞습니다.
- source_word: וְלֹא סָר מִמֶּנָּה
  english_pob_choice: and did not turn aside from it
  chosen_korean: 그 길에서 벗어나지 않았으며
  alternatives_korean:
  - 그 길에서 떠나지 않았으며
  - 그 길에서 치우치지 않았으며
  lexicon: HALOT
  rationale: סור מן은 ‘돌아서다/벗어나다’의 뜻이므로, ‘벗어나지 않았습니다’로 길-행실 은유를 자연스럽게 이어 갔습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 여호와 보시기에
  - 야훼의 눈에
  lexicon: HALOT
  rationale: ‘눈에’라는 직역보다 한국어 성경에서 익숙한 평가 관용구인 ‘보시기에’가 원문의 심판적·평가적 의미를 더 분명히 드러냅니다.
theological_decisions:
- issue: יהוה(YHWH)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 신명기적 평가 공식에서 여호와 이름을 직접 사용하므로, 프로젝트 기본값과 주어진 영어 POB의 ‘Yahweh’를 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
