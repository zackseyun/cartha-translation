  naturalness: 초안의 ‘나팔을 들고 예루살렘에 와서 … 갔습니다’는 악기를 실제로 들고 이동했다는 부가 의미를 넣고, ‘와서 … 갔습니다’가 한 원문의 동사를 두 이동 동사로 풀어 다소 어색합니다. 수정문은 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘야훼’, ‘수금’, ‘비파’, ‘나팔’은 각각 원문의 신명, 서로 구별되는 현악기 명칭, חֲצֹצְרוֹת의 일반적 번역을 적절히 반영합니다. נְבָלִים의 불확실성은 각주에서 유지합니다.
