source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ יְר֣וּשָׁלִַ֔ם בִּ/נְבָלִ֥ים וּ/בְ/כִנֹּר֖וֹת וּ/בַ/חֲצֹצְר֑וֹת אֶל בֵּ֖ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'with harps/lutes'; the exact form of the ancient instrument denoted by נְבָלִים is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the temple of the LORD'; literally, 'to the house of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 수금과 비파와 나팔을 들고 예루살렘에 와서 야훼의 집으로 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '수금/류트와 같은 현악기'; נְבָלִים의 정확한 고대 악기 형태는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '야훼의 성전으로'; 문자적으로는 '야훼의 집으로'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: And they came
  chosen_korean: 와서
  alternatives_korean:
  - 들어와서
  - 도착하여
  lexicon: HALOT
  rationale: 연속 서술의 הבא(오다)를 자연스러운 한국어 서술 연결로 옮겼습니다. 여기서는 이동의 결과를 이어 주는 '와서'가 가장 간결하고 원문 흐름을 잘 살립니다.
- source_word: בִּנְבָלִים
  english_pob_choice: with harps
  chosen_korean: 수금
  alternatives_korean:
  - 하프
  - 류트
  lexicon: HALOT
  rationale: נבל은 정확한 고대 악기 형태가 불확실하지만, 문맥상 현악기를 가리키므로 전통적이면서도 중립적인 '수금'을 택했습니다. 영어 본문의 불확실성은 본문이 아니라 주석으로 보존했습니다.
- source_word: וּבְכִנֹּרוֹת
  english_pob_choice: and lyres
  chosen_korean: 비파
  alternatives_korean:
  - 하프
  lexicon: HALOT
  rationale: כִּנּוֹר는 통상 '비파'로 옮깁니다. 앞의 נבל과 구별하여 서로 다른 두 현악기를 드러내도록 했습니다.
- source_word: וּבַחֲצֹצְרוֹת
  english_pob_choice: and trumpets
  chosen_korean: 나팔
  alternatives_korean:
  - 트럼펫
  - 은나팔
  lexicon: HALOT
  rationale: חֲצֹצְרָה는 예배 맥락의 관악기를 가리키므로 '나팔'이 자연스럽습니다. 본문에 '은'이 없으므로 '은나팔'은 본문보다 좁게 만드는 해석을 피했습니다.
- source_word: אֶל בֵּית יְהוָה
  english_pob_choice: to the house of Yahweh
  chosen_korean: 야훼의 집으로
  alternatives_korean:
  - 야훼의 성전으로
  - 주님의 집으로
  lexicon: HALOT
  rationale: בית יהוה의 직역을 살려 '야훼의 집'으로 옮겼습니다. '성전'은 의미를 분명히 하지만 본문 표현보다 해석적이므로 본문은 더 직접적으로 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 언약명 יְהוָה를 직접 사용하므로, POB 기준에 따라 이를 고유명사로 드러내는 '야훼'를 유지했습니다. '주'는 의미는 맞지만 이름의 직접성을 약화시킵니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
