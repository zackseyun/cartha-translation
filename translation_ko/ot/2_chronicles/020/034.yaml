id: 2CH.20.34
reference: 2 Chronicles 20:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יְהוֹשָׁפָ֔ט הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֗ים בְּ/דִבְרֵי֙ יֵה֣וּא בֶן חֲנָ֔נִי אֲשֶׁ֣ר הֹֽעֲלָ֔ה עַל סֵ֖פֶר מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: Now the rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
  footnotes:
  - marker: a
    text: Or 'in the account of Jehu son of Hanani'; Hebrew 'in the words/records of Jehu son of Hanani.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew clause literally says 'which he caused to go up upon the Book of the Kings of Israel,' likely meaning that Jehu's record was incorporated into or included in that larger royal source.
    reason: alternative_reading
translation:
  language: ko
  text: 여호사밧의 나머지 행적, 곧 처음 일과 마지막 일은 보십시오, 그것이 하나니의 아들 예후의 기록에 적혀 있으며, 그 기록은 이스라엘 왕들의 책에 포함되어 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts of
  chosen_korean: 나머지 행적
  alternatives_korean:
  - 남은 일들
  - 그 밖의 행적
  - 나머지 사건들
  lexicon: HALOT
  rationale: 왕조 사료 형식에서 דִּבְרֵי는 단순한 ‘말’이 아니라 통치의 행적과 관련된 기록을 가리키므로, 자연스러운 역사체인 ‘행적’이 가장 적절합니다.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  english_pob_choice: the first and the last
  chosen_korean: 처음 일과 마지막 일
  alternatives_korean:
  - 처음과 마지막
  - 처음부터 끝까지
  - 초기의 일과 후기의 일
  lexicon: HALOT
  rationale: 히브리어의 관용적 대구를 한국어로 그대로 살리되, 여호사밧의 생애 전체를 포괄하는 뜻이 드러나도록 ‘일’을 보완했습니다.
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  english_pob_choice: in the records of Jehu son of Hanani
  chosen_korean: 하나니의 아들 예후의 기록에
  alternatives_korean:
  - 예후의 기록에
  - 하나니의 아들 예후의 문서에
  - 예후의 말들에
  lexicon: HALOT
  rationale: בְּדִבְרֵי를 문서적 자료로 이해하여 ‘기록’으로 옮겼고, בן은 계보적 식별을 위해 ‘하나니의 아들’로 옮겼습니다.
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  english_pob_choice: which are included in the Book of the Kings of Israel
  chosen_korean: 그 기록은 이스라엘 왕들의 책에 포함되어 있습니다
  alternatives_korean:
  - 그것은 이스라엘 왕들의 책에 실려 있습니다
  - 그 기록은 이스라엘 왕들의 책으로 옮겨져 있습니다
  - 그 기록은 이스라엘 왕들의 책 안에 들어 있습니다
  lexicon: HALOT
  rationale: הֹעֲלָה는 문자적으로는 ‘올려지다’이지만, 문맥상 더 큰 왕실 사료에 편입되었다는 뜻이므로 ‘포함되어 있습니다’가 가장 자연스럽고 의미를 잘 살립니다.
theological_decisions:
- issue: 문장 내 ‘보십시오’의 처리
  chosen_reading: 히브리어 הִנָּם의 시각적·강조적 기능을 살려 ‘보십시오’로 옮겼습니다.
  alternative_readings:
  - 생략
  - 보라
  - 참으로
  rationale: 서술의 단순 정보 전달을 넘어 독자의 주의를 끄는 표지이므로, 고어체 ‘보라’보다 현대 합쇼체의 ‘보십시오’가 문체와 기능을 함께 살립니다.
  doctrine_reference: 본문 수용 태도와 역사 서술의 수사적 강조
