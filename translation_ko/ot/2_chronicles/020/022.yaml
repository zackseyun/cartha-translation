source:
  edition: WLC
  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
  footnotes:
  - marker: a
    text: Or 'the LORD set ambushers' / 'men in ambush.' The Hebrew participle can denote persons lying in ambush as well as the ambush action more generally.
    reason: lexical_alternative
  - marker: b
    text: Or 'who were coming to Judah.' In context the movement is hostile, so 'against Judah' is used in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 노래와 찬양을 시작하였을 때에, 야훼께서 유다를 치러 올라오던 암몬 자손과 모압과 세일 산에 복병들을 두셨고, 그들은 쳐서 쓰러졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מְאָרְבִים은 ‘복병들’처럼 사람을 가리킬 수도 있고, ‘매복’ 같은 행위 자체를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 이는 단순히 ‘유다로’가 아니라 적대적으로 ‘유다를 치러’ 오는 움직임입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  english_pob_choice: And at the time they began
  chosen_korean: 그리고 그들이 시작하는 바로 그때
  alternatives_korean:
  - 그리고 그들이 시작할 때
  - 그들이 시작한 그때
  lexicon: HALOT
  rationale: 시간을 여는 부사구와 서사적 동시성을 자연스럽게 살리면서, 문장 흐름을 현대 한국어로 매끈하게 옮겼습니다.
- source_word: בְּרִנָּה וּתְהִלָּה
  english_pob_choice: with singing and praise
  chosen_korean: 노래와 찬양
  alternatives_korean:
  - 기쁨의 노래와 찬양
  - 노래와 찬미
  lexicon: HALOT
  rationale: רִנָּה는 이 예배 문맥에서 단순한 외침보다 노래의 성격이 강하므로, POB의 'singing and praise'에 맞춰 '노래와 찬양'으로 옮겼습니다.
- source_word: מְאָרְבִים
  english_pob_choice: ambushes
  chosen_korean: 복병들
  alternatives_korean:
  - 매복
  - 매복병들
  - 매복군
  lexicon: HALOT
  rationale: 히브리어 분사형이 '복병/매복에 놓인 자들' 또는 그 행동을 가리킬 수 있으므로, 행위와 사람을 함께 암시하는 한국어 '복병들'을 택했습니다.
- source_word: לִיהוּדָה
  english_pob_choice: against Judah
  chosen_korean: 유다를 치러 올라오던
  alternatives_korean:
  - 유다를 향해 오던
  - 유다에게 오던
  lexicon: HALOT
  rationale: 문맥이 분명한 적대적 진군이므로 단순한 방향성보다 침공의 의미를 드러내는 표현을 사용했습니다.
- source_word: וַיִּנָּגֵפוּ
  english_pob_choice: and they were struck down
  chosen_korean: 그들은 패배하였습니다
  alternatives_korean:
  - 그들은 쓰러졌습니다
  - 그들은 치명타를 입었습니다
  lexicon: HALOT
  rationale: נגע/נגף의 수동형은 '쳐서 넘어뜨리다/패배시키다'의 결과를 가리키므로, 군사적 서술에서는 자연스럽고도 원문의 결말을 분명히 하는 '패배하였습니다'를 선택했습니다.
theological_decisions:
