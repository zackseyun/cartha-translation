source:
  edition: WLC
  text: וַ/יְחַבְּרֵ֣/הוּ עִמּ֔/וֹ לַ/עֲשׂ֥וֹת אֳנִיּ֖וֹת לָ/לֶ֣כֶת תַּרְשִׁ֑ישׁ וַ/יַּעֲשׂ֥וּ אֳנִיּ֖וֹת בְּ/עֶצְי֥וֹן גָּֽבֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
  footnotes:
  - marker: a
    text: Or 'partnered with him' or 'joined him.' The Hebrew verb denotes entering into association or alliance.
    reason: lexical_alternative
  - marker: b
    text: Or 'to sail to Tarshish.' Some interpreters understand Tarshish-language in shipping contexts more idiomatically, but here the Hebrew most naturally expresses destination.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 다시스로 갈 배들을 만들려고 그와 동맹을 맺었고[a], 그들은 에시온게벨에서 배들을 만들었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그와 연합했다’, ‘그와 협력 관계를 맺었다’. 히브리어 동사는 어떤 사람과 결합하거나 협력 관계를 이루는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다시스로 항해할’. 일부 해석은 해상 문맥에서 다시스 관련 표현을 관용적으로 이해하지만, 여기서는 히브리어가 가장 자연스럽게 목적지를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ עִמּוֹ
  english_pob_choice: allied himself with him
  chosen_korean: 그와 동맹을 맺어
  alternatives_korean:
  - 그와 연합하여
  - 그와 관계를 맺어
  - 그와 손잡아
  lexicon: HALOT
  rationale: חבר의 여기서는 단순히 ‘함께하다’보다 정치적·상업적 결합을 뜻하므로, 문맥을 살려 ‘동맹을 맺어’로 옮겼습니다.
- source_word: לַעֲשׂוֹת אֳנִיּוֹת
  english_pob_choice: to make ships
  chosen_korean: 배를 만들었고
  alternatives_korean:
  - 배를 지었고
  - 선박을 만들었고
  lexicon: HALOT
  rationale: אֳנִיּוֹת는 해상용 배/선박을 가리키며, 한국어에서는 이 문맥에 ‘배’가 자연스럽고 직관적입니다.
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  english_pob_choice: to go to Tarshish
  chosen_korean: 다시스로 가는
  alternatives_korean:
  - 다시스로 항해하는
  - 다시스로 가려고 하는
  lexicon: HALOT
  rationale: 히브리어는 목적지를 나타내는 동사구이므로, 본문에는 ‘다시스로 가는’이 가장 직접적입니다.
- source_word: בְּעֶצְיוֹן גָּבֶר
  english_pob_choice: at Ezion-geber
  chosen_korean: 에시온게벨에서
  alternatives_korean:
  - 에시온게벨에서
  - 에지온게벨에서
  lexicon: HALOT
  rationale: 지명은 음역하여 표기하고, 전치사 ב는 장소를 나타내는 한국어 ‘에서’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 배 건조와 동맹의 성격을 과도하게 도덕화하지 않기
  chosen_reading: 본문은 선악 평가보다 여호사밧의 해상 사업 협력을 서술하는 역사 진술로 읽었습니다.
  alternative_readings:
  - 상업적 공모에 대한 암묵적 비판으로 읽기
  - 단순한 우정 관계로 완화해 읽기
  rationale: 히브리어 동사와 문맥은 실제 협력 관계를 말하지만, 본문 자체는 그 의미를 평가하지 않으므로 서술의 중립성을 유지했습니다.
  doctrine_reference: 역사서 서술의 문맥적 중립성
