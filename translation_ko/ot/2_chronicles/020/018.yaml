  text: וַ/יִּקֹּ֧ד יְהוֹשָׁפָ֛ט אַפַּ֖יִם אָ֑רְצָ/ה וְ/כָל יְהוּדָ֞ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם נָֽפְלוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
  footnotes:
  - marker: a
    text: Or 'fell before the LORD to bow down to the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호사밧이 얼굴을 땅에 대고 절하였고, 온 유다와 예루살렘 주민들도 야훼 앞에 엎드려 야훼를 예배하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼 앞에 엎드려 야훼께 절하였다”로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּד / אַפַּיִם אָרְצָה
  english_pob_choice: bowed with his face to the ground
  chosen_korean: 얼굴을 땅에 대고 절하였고
  alternatives_korean:
  - 무릎을 꿇었고
  - 몸을 굽혀 땅에 엎드렸고
  lexicon: HALOT
  rationale: קָדַד의 절하는 자세를 살리되, אַפַּיִם אָרְצָה의 완전한 엎드림을 한국어 관용으로 자연스럽게 담기 위해 ‘얼굴을 땅에 대고 절하다’로 옮겼습니다.
- source_word: וְכָל יְהוּדָה
  english_pob_choice: all Judah
  chosen_korean: 온 유다
  alternatives_korean:
  - 유다의 모든 사람들
  - 온 유다 백성
  lexicon: HALOT
  rationale: 지명 유다가 집합적으로 백성을 가리키는 용법이므로, 간결하게 ‘온 유다’로 유지했습니다.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  english_pob_choice: the inhabitants of Jerusalem
  chosen_korean: 예루살렘 주민들
  alternatives_korean:
  - 예루살렘에 사는 사람들
  - 예루살렘의 거주자들
  lexicon: HALOT
  rationale: ‘거주하는 자들’의 의미를 현대 한국어의 자연스러운 집합 명사로 옮겼습니다.
- source_word: וַיִּקֹּד / נָפְלוּ לִפְנֵי יְהוָה / לְהִשְׁתַּחֲוֺת
  english_pob_choice: fell down before Yahweh to worship Yahweh
  chosen_korean: 야훼 앞에 엎드려 야훼를 예배하였습니다
  alternatives_korean:
  - 야훼 앞에 엎드려 야훼께 경배하였습니다
  - 야훼 앞에 엎드려 야훼께 절하였습니다
  lexicon: HALOT
  rationale: 이미 몸의 동작이 앞부분에 있으므로, 목적의 לְהִשְׁתַּחֲוֺת는 중복을 피하면서도 예배 행위를 분명히 하는 ‘예배하다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명기적 이름을 제목이 아닌 고유명사로 보존하기 위해 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 엎드림과 예배의 관계
  chosen_reading: 몸의 엎드림과 예배 행위를 분리해, 첫 동작은 ‘절하다/엎드리다’로, 목적은 ‘예배하다’로 표현했습니다.
  alternative_readings:
  - 두 동사를 모두 ‘경배하다’로 평준화하는 읽기
  - 모두 ‘절하다’로 통일하는 읽기
  rationale: 히브리어는 신체적 굴복과 예배 목적을 함께 말하므로, 한국어에서도 둘을 겹치지 않게 구별해야 본문의 강도가 살아납니다.
  doctrine_reference: 성경 본문 서술의 구체성과 예배의 내외적 차원
