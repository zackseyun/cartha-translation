source:
  edition: WLC
  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
  footnotes:
  - marker: a
    text: Or 'the deliverance of the LORD.' The Hebrew term can refer to rescue in battle as well as salvation more broadly.
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD will be with you.' The Hebrew clause has no explicit verb, and English may express the assurance as present or future.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 전투에서는 여러분이 싸울 필요가 없습니다. 자리를 잡고 서서 야훼의 구원을 보십시오. 유다와 예루살렘아, 두려워하지 말고, 낙담하지도 마십시오. 내일 그들 앞에 나가십시오. 야훼가 여러분과 함께하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이 전투에서 여러분이 싸울 필요가 없다’는 뜻으로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘그들 앞에 나가라’ 또는 ‘그들 앞에 나설 것이다’로도 옮길 수 있습니다. 동사는 생략되어 있어 현재형과 미래형 모두 가능성이 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  english_pob_choice: You will not need to fight in this battle
  chosen_korean: 이 전투에서는 여러분이 싸울 필요가 없습니다
  alternatives_korean:
  - 이 전투에서 여러분은 싸우지 않아도 됩니다
  - 여러분이 이 전투에서 싸워야 하는 것은 아닙니다
  lexicon: HALOT
  rationale: 히브리어의 부정적 관용구를 한국어에서 자연스럽게 풀어, 실제로 전투에 참여할 필요가 없다는 뜻을 분명히 했습니다.
- source_word: הִתְיַצְּבוּ עִמְדוּ
  english_pob_choice: Take your positions, stand still
  chosen_korean: 자리를 잡고 서서
  alternatives_korean:
  - 진을 치고 가만히 서서
  - 자세를 갖추고 서서
  lexicon: HALOT
  rationale: 두 명령형의 군사적 긴박감을 살리면서도 한국어에서 지나치게 직역적으로 들리지 않도록 했습니다.
- source_word: וּרְאוּ אֶת יְשׁוּעַת יְהוָה
  english_pob_choice: and see the salvation of Yahweh
  chosen_korean: 야훼의 구원을 보십시오
  alternatives_korean:
  - 야훼의 구출을 보십시오
  - 야훼의 구원을 지켜보십시오
  lexicon: HALOT
  rationale: יְשׁוּעָה는 전투 맥락의 구출을 가리킬 수 있지만, 더 넓은 신학적 범위를 살려 '구원'으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사실상 본문의 고유한 언약 이름을 드러내기 위해 전통적 대체어 대신 음역형 '야훼'를 유지했습니다.
- source_word: וְאַל תֵּחַתּוּ
  english_pob_choice: and do not be dismayed
  chosen_korean: 낙담하지도 마십시오
  alternatives_korean:
  - 당황하지도 마십시오
  - 두려움에 무너지지도 마십시오
  lexicon: HALOT
  rationale: חתת의 의미를 한국어의 자연스러운 심리·정서 표현으로 풀어, 무너짐/침체의 뉘앙스를 전달했습니다.
- source_word: מָחָר צְא֣וּ לִפְנֵיהֶם
  english_pob_choice: Tomorrow go out before them
  chosen_korean: 내일 그들 앞에 나가십시오
  alternatives_korean:
  - 내일 그들 앞에 출정하십시오
  - 내일 그들 앞에 진군하십시오
  lexicon: HALOT
  rationale: 전투 상황의 이동 명령을 한국어 명령문으로 간결하게 옮기되, לִפְנֵיהֶם의 전면 대치를 반영했습니다.
theological_decisions:
- issue: יהוה의 고유명사 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 단순한 호칭이 아니라 하나님의 언약 이름을 직접 사용하므로, 프로젝트 기본 원칙에 따라 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: יְשׁוּעַת יְהוָה의 범위
  chosen_reading: 야훼의 구원
  alternative_readings:
  - 야훼의 구출
  - 야훼의 승리
  rationale: 즉각적 전투 구출의 의미를 배제하지 않으면서도, 본문이 지닌 더 넓은 구원 신학을 보존하기 위해 '구원'을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
