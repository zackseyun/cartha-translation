  naturalness: 현대 합쇼체에서는 ‘와서 이렇게 보고했습니다’가 자연스럽습니다. 인용문 안의 지명 식별은 괄호보다 ‘그곳은 엔게디입니다’로 독립 문장으로 처리하는 편이 매끄럽고 원문의 설명 기능도 유지합니다.
  terminology: 여호사밧, 아람, 하사손다말, 엔게디의 음역은 원문 지명 보존 방침에 부합합니다. 각주 표지는 해당 어구 바로 뒤에 배치해 앵커를 분명히 했습니다.
