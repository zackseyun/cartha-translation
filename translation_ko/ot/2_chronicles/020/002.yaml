  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
  footnotes:
  - marker: a
    text: Or “from across the sea.”
    reason: lexical_alternative
  - marker: b
    text: Aram is the Hebrew place-name often rendered “Syria.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 여호사밧에게 와서 보고하며 말했습니다. “큰 무리가 바다 건너편 아람에서 왕을 치러 오고 있습니다. 보십시오, 그들이 하사손다말에 있습니다.”(곧 엔게디입니다.)[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바다 건너편’은 문자적으로는 ‘바다를 넘어/건너서’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 아람은 흔히 ‘시리아’로 옮겨지는 히브리어 지명입니다.
    reason: lexical_alternative
