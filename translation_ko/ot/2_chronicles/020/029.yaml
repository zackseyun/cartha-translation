  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
  footnotes:
  - marker: a
    text: Or 'terror from God.' The Hebrew phrase can denote fear associated with God's presence or action.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 두려움이 모든 지방의 왕국들에 임하였으니, 그들이 야훼께서 이스라엘의 적들과 싸우셨다는 것을 들었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님으로부터 온 공포.’ 히브리어 구는 하나님의 임재나 행위와 관련된 두려움을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחַד אֱלֹהִים
  english_pob_choice: the fear of God
  chosen_korean: 하나님의 두려움
  alternatives_korean:
  - 하나님에 대한 두려움
  - 하나님으로 말미암은 두려움
  - 하나님을 향한 경외
  lexicon: HALOT
  rationale: 문맥상 열방에 임한 공포를 가리키지만, מקור 표현의 직역성을 살리기 위해 ‘하나님의 두려움’으로 두어 신적 기원의 두려움을 드러냈습니다.
- source_word: מַמְלְכֹת הָאֲרָצוֹת
  english_pob_choice: all the kingdoms of the lands
  chosen_korean: 모든 지방의 왕국들
  alternatives_korean:
  - 모든 땅의 왕국들
  - 모든 나라들의 왕국들
  - 모든 땅의 나라들
  lexicon: HALOT
  rationale: 복수형 ‘lands’를 반영해 ‘지방들’로 옮기되, 문맥상 주변 지역의 여러 왕국들을 가리키는 뜻을 살리기 위해 ‘왕국들’과 함께 자연스럽게 구성했습니다.
- source_word: בְּשָׁמְעָם כִּי
  english_pob_choice: when they heard that
  chosen_korean: 그들이 … 들었기 때문입니다
  alternatives_korean:
  - 그들이 … 들었을 때
  - 그들이 … 들었을 때에
  - 그들이 … 들은 것을 들었을 때
  lexicon: HALOT
  rationale: 히브리어의 시간 부사구와 내용절을 한국어에서 가장 자연스럽고 명료하게 풀어, ‘들었기 때문입니다’로 결과적 상황을 설명했습니다.
- source_word: נִלְחַם יְהוָה עִם
  english_pob_choice: Yahweh had fought against
  chosen_korean: 야훼께서 … 싸우셨다는 것을
  alternatives_korean:
  - 야훼께서 … 싸우셨다는 사실을
  - 야훼께서 … 대적하여 싸우셨다는 것을
  - 야훼께서 … 맞서 싸우셨다는 것을
  lexicon: HALOT
  rationale: ‘עם’이 전투 맥락에서 상대편을 가리키는 점을 반영해 ‘싸우셨다’로 옮기고, 보고 내용임을 분명히 하기 위해 ‘…다는 것을’ 구조를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 고유명사인 신명사를 관례에 따라 ‘야훼’로 옮겨, 호칭이 아닌 언약적 고유 이름을 보존했습니다.
theological_decisions:
- issue: פַּחַד אֱלֹהִים의 의미 범위
  chosen_reading: ‘하나님의 두려움’으로 옮기되, 이는 단순한 경외보다 하나님의 행위로 인해 생긴 실제적 공포를 포함합니다.
  alternative_readings:
  - ‘하나님으로 말미암은 두려움’
  - ‘경외’
  - ‘하나님께서 주신 공포’
  rationale: 영어 POB가 ‘fear of God’와 각주에서 ‘terror from God’ 가능성을 함께 열어 둔 만큼, 한국어 본문도 의미의 긴장을 지우지 않도록 직역성을 유지했습니다.
  doctrine_reference: POB lexical note on פַּחַד אֱלֹהִים / lexical_alternative
