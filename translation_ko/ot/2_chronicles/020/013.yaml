    text: 히브리어 ‘아들들’은 문맥에 따라 ‘아들들’을 뜻하거나 더 넓게 ‘자녀들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  english_pob_choice: And all
  chosen_korean: 온
  alternatives_korean:
  - 그리고 온
  - 모든
  lexicon: HALOT
  rationale: וְ의 연결성과 כָל의 전체성을 함께 살리기 위해, 문맥상 자연스러운 수식어인 ‘온’을 사용했습니다.
- source_word: עֹמְדִים
  english_pob_choice: was standing
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 서 있었습니다
  - 서 있었습니다
  lexicon: HALOT
  rationale: 분사형이 나타내는 지속된 자세를 한국어의 진행적 서술로 옮겼습니다. 집합적 주어인 ‘유다’에 맞게 자연스럽게 정리했습니다.
- source_word: טַפָּם
  english_pob_choice: their little ones
  chosen_korean: 그들의 어린 자녀들
  alternatives_korean:
  - 그들의 어린아이들
  - 그들의 어린 자녀들
  lexicon: HALOT
  rationale: טַף의 의존적인 어린 자녀들을 가리키는 폭넓은 의미를 살리되, 한국어에서 너무 유아에만 좁혀지지 않도록 했습니다.
- source_word: וּ/בְנֵיהֶם
  english_pob_choice: and their children
  chosen_korean: 아들들까지도
  alternatives_korean:
  - 자녀들
  - 아들들
  lexicon: HALOT
  rationale: 히브리어 בנים의 남성형 표면을 반영하되, 문맥상 가족 단위 전체를 포함하는 열거로 읽히므로 별도 항목으로 구분해 번역했습니다.
theological_decisions:
- issue: 예배 현장에서의 하나님의 이름 יְהוָה 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 언약명 יְהוָה를 직접 사용하므로, 전통적 대체어인 ‘주님’보다 신명 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 가족 목록의 성별 표지 보존
  chosen_reading: 어린 자녀들, 아내들, 아들들까지도
  alternative_readings:
  - 어린아이들, 아내들, 자녀들까지도
  - 어린 자녀들, 아내들, 아들들까지도
  rationale: 히브리어가 제시하는 가정 구성 요소를 평탄화하지 않고, 본문이 실제로 열거하는 범주를 한국어에서도 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Gender-accurate over gender-neutral'
