  lexicon: HALOT
  rationale: 본문의 재앙 목록 속 용례를 살리면서도, 여기서는 משפט 계열의 추상적 행위보다 임하는 판단/심판의 뜻이므로 ‘판단’보다는 ‘심판’이 더 자연스러울 수 있으나, 한국어 성경 관용을 고려해 문맥상 함께 열거되는 재앙 항목으로 읽히게 했습니다. 다만 본 구절의 간결성을 위해 ‘판단’ 형태로 두었습니다.
- source_word: שִׁמְךָ בַּבַּיִת הַזֶּה
  english_pob_choice: your name is in this house
  chosen_korean: 주님의 이름이 이 집에 있기 때문입니다
  alternatives_korean:
  - 주님의 이름이 이 집 안에 있기 때문입니다
