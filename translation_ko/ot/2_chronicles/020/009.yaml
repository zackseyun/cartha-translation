  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
  footnotes:
  - marker: a
    text: Or, 'your name is upon this house,' that is, this house bears your name.
    reason: lexical_alternative
translation:
  language: ko
  text: 재앙이 우리에게 임하되—칼이나 판단이나 전염병이나 기근이 오더라도—우리는 이 집 앞과 주님 앞에 서겠습니다. 이는 주님의 이름이 이 집에 있기 때문입니다. 우리는 우리의 환난 속에서 주님께 부르짖을 것이며, 주님은 들으시고 구원하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님의 이름이 이 집에 있다’는 표현은 ‘이 집이 주님의 이름을 지닌다/주님의 이름이 이 집 위에 있다’는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 재해
  - 불행
  lexicon: HALOT
  rationale: 이 문맥에서 도덕적 악이 아니라 임하는 해로운 재난을 가리키므로, 현대 한국어로 자연스럽고 성경적 어감을 살리는 ‘재앙’이 적절합니다.
- source_word: חֶרֶב
  english_pob_choice: sword
  chosen_korean: 칼
  alternatives_korean:
  - 전쟁
  - 검
  lexicon: HALOT
  rationale: 목록의 구체성을 살리기 위해 추상적인 ‘전쟁’보다 구체적 무기인 ‘칼’로 옮겼습니다.
- source_word: שְׁפוֹט
  english_pob_choice: judgment
  chosen_korean: 판단
  alternatives_korean:
  - 심판
  - 징벌
  - 판결
  lexicon: HALOT
  rationale: 본문의 재앙 목록 속 용례를 살리면서도, 여기서는 משפט 계열의 추상적 행위보다 임하는 판단/심판의 뜻이므로 ‘판단’보다는 ‘심판’이 더 자연스러울 수 있으나, 한국어 성경 관용을 고려해 문맥상 함께 열거되는 재앙 항목으로 읽히게 했습니다. 다만 본 구절의 간결성을 위해 ‘판단’ 형태로 두었습니다.
- source_word: שִׁמְךָ בַּבַּיִת הַזֶּה
  english_pob_choice: your name is in this house
  chosen_korean: 주님의 이름이 이 집에 있기 때문입니다
  alternatives_korean:
  - 주님의 이름이 이 집 안에 있기 때문입니다
  - 이 집이 주님의 이름을 지니고 있기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 하나님의 소유와 임재를 함께 드러내는 표현으로 ‘이름이 이 집에 있다’를 ‘이름이 이 집에 있기 때문’으로 유지했습니다. ‘집’은 본문의 בַּיִת를 직접 반영합니다.
- source_word: וְנִזְעַק
  english_pob_choice: we will cry out
  chosen_korean: 부르짖을 것이며
  alternatives_korean:
  - 외칠 것이며
  - 간구할 것이며
  lexicon: HALOT
  rationale: 절박한 호소를 나타내는 동사이므로 단순한 ‘기도하다’보다 강한 ‘부르짖다’가 적절합니다.
- source_word: וְתוֹשִׁיעַ
  english_pob_choice: and save
  chosen_korean: 구원하실 것입니다
  alternatives_korean:
  - 구해 주실 것입니다
  - 건져 주실 것입니다
  lexicon: HALOT
  rationale: 단순한 일시적 구조보다 포괄적 구원의 뜻을 살려 ‘구원하다’를 사용했습니다.
theological_decisions:
- issue: ‘주님’ 표기와 야훼/여호와 문제
  chosen_reading: 여기서는 직접적인 신명 표기가 아니라 주어로서의 주님을 한국어 독자에게 자연스럽게 전달하기 위해 ‘주님’을 사용했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 본문은 하나님의 이름이 ‘이 집에 있다’고 말하지만, 실제 대화 대상은 기도문 안의 하나님이므로 한국어 본문에서는 전통적 신명 표기보다 ‘주님’이 더 자연스럽고 일관됩니다.
  doctrine_reference: Translation philosophy §3, source-direct rendering with readable contemporary Korean
