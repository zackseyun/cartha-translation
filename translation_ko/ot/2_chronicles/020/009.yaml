  - 건져 주실 것입니다
  lexicon: HALOT
  rationale: 단순한 일시적 구조보다 포괄적 구원의 뜻을 살려 ‘구원하다’를 사용했습니다.
theological_decisions:
- issue: ‘주님’ 표기와 야훼/여호와 문제
  chosen_reading: 여기서는 직접적인 신명 표기가 아니라 주어로서의 주님을 한국어 독자에게 자연스럽게 전달하기 위해 ‘주님’을 사용했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 본문은 하나님의 이름이 ‘이 집에 있다’고 말하지만, 실제 대화 대상은 기도문 안의 하나님이므로 한국어 본문에서는 전통적 신명 표기보다 ‘주님’이 더 자연스럽고 일관됩니다.
  doctrine_reference: Translation philosophy §3, source-direct rendering with readable contemporary Korean
