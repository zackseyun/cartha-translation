  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 한국어로 옮기되, 하나님의 소유와 임재를 함께 드러내는 표현으로 ‘이름이 이 집에 있다’를 ‘이름이 이 집에 있기 때문’으로 유지했습니다. ‘집’은 본문의 בַּיִת를 직접 반영합니다.
- source_word: וְנִזְעַק
  english_pob_choice: we will cry out
