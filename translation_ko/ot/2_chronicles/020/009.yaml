  terminology: ‘칼’, ‘전염병’, ‘기근’, ‘부르짖다’, ‘구원하다’는 적절합니다. בַּיִת는 본문에서 ‘이 집’으로 유지할 수 있으며, 하나님의 이름이 그 집에 있다는 표현은 해설로 본문에서 풀지 않는 것이 좋습니다. 각주 표지는 해당 표현 바로 뒤에 두어야 합니다.
