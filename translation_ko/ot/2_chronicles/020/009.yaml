  lexicon: HALOT
  rationale: 절박한 호소를 나타내는 동사이므로 단순한 ‘기도하다’보다 강한 ‘부르짖다’가 적절합니다.
- source_word: וְתוֹשִׁיעַ
  english_pob_choice: and save
  chosen_korean: 구원하실 것입니다
  alternatives_korean:
