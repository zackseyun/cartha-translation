revisions:
- from: 재앙이 우리에게 임하되—칼이나 판단이나 전염병이나 기근이 오더라도—우리는 이 집 앞과 주님 앞에 서겠습니다. 이는 주님의 이름이 이 집에 있기 때문입니다. 우리는 우리의 환난 속에서 주님께 부르짖을 것이며, 주님은 들으시고 구원하실 것입니다.[a]
  to: 재앙, 곧 칼이나 심판이나 전염병이나 기근이 우리에게 닥쳐올 때에, 우리는 이 집 앞에, 그리고 주님 앞에 서겠습니다. 주님의 이름이 이 집에 있기 때문입니다.[a] 우리는 우리의 환난 가운데서 주님께 부르짖을 것이며, 주님께서는 들으시고 구원하실 것입니다.
  rationale: 재앙 목록에서 שְׁפוֹט을 ‘심판’으로 바로잡고, 중복된 조건 구문을 원문의 한 조건절에 맞게 정리했습니다. 하나님의 이름에 관한 히브리어 관용구는 본문에서 보존하고, 가능한 대안적 이해는 해당 구절에 연결한 각주로 제시했습니다. 원문의 기도체와 미래적 서원, 그리고 ‘듣고 구원하다’의 두 동사를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:17:27Z'
