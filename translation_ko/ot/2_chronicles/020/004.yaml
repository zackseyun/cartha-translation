  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ יְהוּדָ֔ה לְ/בַקֵּ֖שׁ מֵֽ/יְהוָ֑ה גַּ֚ם מִ/כָּל עָרֵ֣י יְהוּדָ֔ה בָּ֖אוּ לְ/בַקֵּ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/004.yaml
  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
  footnotes:
  - marker: a
    text: Or, more literally, 'to seek from the LORD.' The sense in context is to seek help or deliverance from him.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''to seek the LORD.'' The verse uses a slightly different construction in the second clause than in the first.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 사람들이 야훼를 찾으려고 함께 모였고, 유다의 모든 성읍에서 사람들까지도 야훼를 찾으려고 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 첫 절과 둘째 절에서 ‘찾다’의 문법적 구성이 조금 다릅니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  english_pob_choice: gathered together
  chosen_korean: 함께 모였고
  alternatives_korean:
  - 모였고
  - 함께 집결했고
  lexicon: HALOT
  rationale: 어근 קבץ의 수동적/집합적 의미를 살리면서, 현대 한국어에서 자연스럽게 공동 행동을 나타내는 표현으로 옮겼습니다.
- source_word: לְבַקֵּשׁ מֵיְהוָה / לְבַקֵּשׁ אֶת יְהוָה
  english_pob_choice: to seek Yahweh / to seek Yahweh
  chosen_korean: 야훼를 찾으려고
  alternatives_korean:
  - 야훼를 구하려고
  - 야훼를 찾기 위해
  lexicon: HALOT
  rationale: בקש의 핵심을 ‘찾다/구하다’로 옮기되, 두 절의 반복을 자연스럽게 유지했습니다. 두 구문 사이의 미묘한 차이는 한국어 본문에서는 과도한 해설 없이 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: project default
  rationale: 본문의 신명사 표기는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 고유한 신적 이름을 보존했습니다.
- source_word: מִכָּל עָרֵי יְהוּדָה
  english_pob_choice: from all the cities of Judah
  chosen_korean: 유다의 모든 성읍에서
  alternatives_korean:
  - 유다의 모든 도시에서
  - 유다의 모든 성읍들로부터
  lexicon: HALOT
  rationale: 전체 참여 범위를 강조하는 표현이므로 ‘모든 성읍’으로 옮기고, 한국어 문맥에 맞게 장소 출처를 자연스럽게 표시했습니다.
theological_decisions:
- issue: 기명(神名) יְהוָה의 처리
  chosen_reading: 주(主)로 대체하지 않고 본문에서 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 하나님의 이름 자체를 반복하며, 문맥상 인물들이 야훼께 도움을 구하는 장면이므로 고유명을 보존하는 편이 원문의 의미를 더 직접적으로 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 두 번의 ‘구하다’ 표현의 차이
  chosen_reading: 둘 다 ‘야훼를 찾으려고’로 옮기되, 반복 구조를 유지했습니다.
  alternative_readings:
  - 첫 절은 ‘도움을 구하려고’, 둘째 절은 ‘야훼를 찾으려고’
  - 두 절 모두 ‘야훼를 찾으려고’
  rationale: 히브리어는 전치사 구성이 다르지만, 한국어에서는 본문이 말하는 공적 회개와 의존의 행위를 간결하게 드러내는 것이 더 중요하므로, 과도한 해설적 분화를 피했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #5: Consistency of key terms, or documented exception'
