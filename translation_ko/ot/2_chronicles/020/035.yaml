  - severity: low
    issue: 각주 b가 대명사의 가능한 지시 대상과 ‘그렇게 하여’의 해석적 성격을 충분히 설명하지 않습니다.
    rationale: 히브리어는 문자적으로 ‘그는 행하는 데 악하게 하였다’에 가까운 압축된 표현이며, 대명사는 아하시야를 가리키는 것이 가장 자연스럽지만 논의의 여지가 있습니다. 각주가 이를 밝혀야 번역의 명시화를 투명하게 제시할 수 있습니다.
