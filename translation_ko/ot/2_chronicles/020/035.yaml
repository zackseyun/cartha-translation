source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
  footnotes:
  - marker: a
    text: Or, 'joined with Ahaziah king of Israel.'
    reason: lexical_alternative
  - marker: b
    text: The clause 'who acted wickedly in doing so' most naturally refers to Ahaziah; the Hebrew could be rendered more literally, 'he acted wickedly to do.'
    reason: alternative_reading
translation:
  language: ko
  text: 이 일 후에 유다 왕 여호사밧은 이스라엘 왕 아하시야와 동맹을 맺었습니다[a]. 아하시야는 그렇게 하는 일에 악을 행했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아하시야와 연합하였다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 더 문자적으로 ‘그는 행하는 데 악하게 하였다’라고 할 수 있습니다. ‘그’는 아하시야를 가리키는 것이 가장 자연스럽지만, 문맥상 지시 대상에 관해 다른 이해도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  english_pob_choice: After this
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 그 후에
  - 그 일 뒤에
  lexicon: HALOT
  rationale: 이전 사건에서 다음 사건으로 넘어가는 시간 표지를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: אֶתְחַבַּר
  english_pob_choice: allied himself with
  chosen_korean: 동맹을 맺었습니다
  alternatives_korean:
  - 함께했습니다
  - 연합했습니다
  - 동맹했습니다
  lexicon: HALOT
  rationale: 단순한 동행이 아니라 정치적·관계적 결속을 나타내므로, 본문 의미를 분명히 하는 표현을 택했습니다.
- source_word: הִרְשִׁיעַ
  english_pob_choice: acted wickedly
  chosen_korean: 악을 행했습니다
  alternatives_korean:
  - 악하게 행했습니다
  - 악행을 저질렀습니다
  - 패역하게 행했습니다
  lexicon: HALOT
  rationale: 히필형의 도덕적 평가를 한국어로 직접 드러내되, 과도하게 해석을 확장하지 않는 표현으로 옮겼습니다.
- source_word: לַעֲשׂוֹת
  english_pob_choice: in doing so
  chosen_korean: 그렇게 하여
  alternatives_korean:
  - 그 행동으로
  - 그 일에서
  - 그 일에 있어
  lexicon: HALOT
  rationale: 연결된 행위를 가리키는 간결한 부사구로 처리하여, ‘그렇게 함으로써’라는 행위의 맥락을 살렸습니다.
theological_decisions:
- issue: ב본문의 הוּא가 가리키는 대상
  chosen_reading: ‘그는’은 가까운 선행사인 아하시야를 가리키며, 그가 악을 행한 것으로 읽었습니다.
  alternative_readings:
  - 동맹 행위 자체를 가리킨다고 볼 수 있습니다.
  - 여호사밧의 행위를 더 넓게 평가하는 말로 볼 수 있습니다.
  rationale: 문장 구조상 가장 가까운 선행사가 아하시야이며, 영어 POB 주석도 이 이해를 채택하므로 그 읽음을 따랐습니다.
  doctrine_reference: 본문 주해의 문법·문맥 판단
