  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
  footnotes:
  - marker: a
    text: Or 'ravine' or 'brook' for 'wadi' (Hebrew נחל), a term for a valley or seasonal watercourse.
    reason: lexical_alternative
translation:
  language: ko
  text: 내일 그들을 향해 내려가십시오. 보십시오, 그들은 시스 산길을 따라 올라오고 있으니, 여러분은 그들을 와디 끝, 곧 여루엘 광야 앞에서 찾게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘와디’는 계절성 수로 또는 계곡을 가리키는 히브리어 נחל의 지리 용어입니다.
    reason: lexical_alternative
