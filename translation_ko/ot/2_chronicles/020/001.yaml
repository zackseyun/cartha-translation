  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
  footnotes:
  - marker: a
    text: 'Hebrew: ''some of the Ammonites.'' Many interpreters, following context and ancient versions, understand this as referring to the Meunites or a similar allied group rather than repeating the Ammonites.'
    reason: textual_variant
translation:
  language: ko
  text: 이 일 후에 모압 자손과 암몬 자손, 그리고 그들과 함께 있던 메우니 사람들a이 여호사밧을 치러 전쟁하러 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문 자음은 ‘암몬 사람들’로도 읽힐 수 있으나, 문맥과 고대 역본을 따라 많은 번역본은 별도의 연합 민족인 ‘메우니 사람들’로 이해합니다.
    reason: textual_variant
