  source_fidelity: 마소라 본문의 מֵהָעַמּוֹנִים는 문면상 ‘암몬 사람들 가운데 일부’입니다. 이를 본문에서 곧바로 ‘메우니 사람들’로 확정하면 문맥과 역본에 근거한 해석을 본문 자체로 올려놓게 됩니다. 해당 난점은 각주에서 밝혀야 합니다.
  naturalness: ‘모압 자손/암몬 자손’은 이해 가능하지만 현대 표준 한국어의 민족 명칭으로는 ‘모압 사람들/암몬 사람들’이 더 자연스럽습니다. 또한 ‘여호사밧을 치러 전쟁하러’는 목적 표현이 중복되므로 ‘여호사밧을 치러’로 간결하게 옮기는 것이 좋습니다.
  terminology: ‘여호사밧’, ‘모압’, ‘암몬’은 적절합니다. 논쟁적인 집단명 ‘메우니 사람들’은 본문이 아니라 본문 비평 각주에 한정하여 제시해야 합니다.
