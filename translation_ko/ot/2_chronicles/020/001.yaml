base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
  footnotes:
  - marker: a
    text: 'Hebrew: ''some of the Ammonites.'' Many interpreters, following context and ancient versions, understand this as referring to the Meunites or a similar allied group rather than repeating the Ammonites.'
    reason: textual_variant
translation:
  language: ko
  text: 이 일이 있은 뒤에 모압 사람들과 암몬 사람들, 그리고 그들과 함께한 암몬 사람들 가운데 일부가[a] 여호사밧을 치러 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘암몬 사람들 가운데 일부’라고 합니다. 그러나 문맥과 고대 역본을 따라 많은 번역본은 이것을 암몬 사람들의 반복이 아닌 별도의 연합 집단, 곧 ‘메우니 사람들’ 또는 이와 비슷한 집단을 가리키는 것으로 이해합니다.
    reason: textual_variant
