base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
  footnotes:
  - marker: a
    text: Or 'had not prepared their hearts for the God of their fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 산당은 제거되지 않았고, 백성은 여전히 조상들의 하나님께 마음을 정하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조상들의 하나님께 마음을 준비하지 않았습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: However
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그렇지만
  lexicon: HALOT
  rationale: 문맥상 앞의 긍정적 평가에 대한 양보·대조를 표시하므로, 현대 한국어에서 자연스러운 역접 접속사 ‘그러나’로 옮겼습니다.
- source_word: הַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 산 위 제사처
  lexicon: HALOT
  rationale: 여기서는 이스라엘 제의의 고정된 용어이므로 ‘산당’이 가장 간결하고 역사적·종교적 용례를 보존합니다.
- source_word: לֹא הֵכִינוּ לְבָבָם
  english_pob_choice: had not set their hearts / had not prepared their hearts
  chosen_korean: 마음을 준비하지 않았습니다
  alternatives_korean:
  - 마음을 두지 않았습니다
  - 마음을 정하지 않았습니다
  - 마음을 굳게 세우지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 הֵכִינוּ לְבָבָם은 ‘마음을 준비하다/방향 지우다’의 뜻을 가지므로, 본문이 말하는 내적 예비와 방향성을 살려 ‘마음을 준비하지 않았다’로 옮겼습니다.
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  english_pob_choice: toward the God of their fathers
  chosen_korean: 그 조상들의 하나님께
  alternatives_korean:
  - 그 조상들의 하나님을 향해
  - 조상들의 하나님에게
  - 그들의 조상들의 하나님께
  lexicon: HALOT
  rationale: 여격 표지를 한국어에서는 일반적으로 ‘…께’로 자연스럽게 드러낼 수 있어, 언약적 대상인 ‘그 조상들의 하나님께’를 유지했습니다.
theological_decisions:
- issue: 마음의 방향성 표현
  chosen_reading: 백성의 문제는 단순한 감정 부족이 아니라, 언약의 하나님께 대한 내적 준비와 지향이 아직 갖추어지지 않았다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 백성이 아직 예배할 마음을 갖추지 못했다
  - 백성이 아직 하나님께 완전히 헌신하지 못했다
  rationale: 본문은 산당의 미제거와 함께 마음의 미정렬을 병렬로 말하므로, 이를 예배 감정이나 후대 교리 용어로 좁히지 않고 원문의 관계를 살렸습니다.
  doctrine_reference: Translation philosophy §3, §6
