  revised_text: 그때 유다와 예루살렘의 모든 남자가[a] 여호사밧을 앞장세우고, 기뻐하며 예루살렘으로 돌아가려고 돌아섰습니다.[b] 야훼께서 그들의 원수들로 말미암아 그들을 기뻐하게 하셨기 때문입니다.
