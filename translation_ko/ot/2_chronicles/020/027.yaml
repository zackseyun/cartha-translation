language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יָּשֻׁבוּ כָּל אִ֨ישׁ יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ וִֽ/יהוֹשָׁפָ֣ט בְּ/רֹאשָׁ֔/ם לָ/שׁ֥וּב אֶל יְרוּשָׁלִַ֖ם בְּ/שִׂמְחָ֑ה כִּֽי שִׂמְּחָ֥/ם יְהוָ֖ה מֵֽ/אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
  footnotes:
  - marker: a
    text: Or 'all the men of Judah and Jerusalem.' The Hebrew literally has 'every man of Judah and Jerusalem,' a distributive expression for the whole group.
    reason: lexical_alternative
  - marker: b
    text: Or 'returned to go back'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 유다와 예루살렘의 모든 남자가[a] 여호사밧을 앞장세우고, 기뻐하며 예루살렘으로 돌아가려고 돌아섰습니다.[b] 야훼께서 그들의 원수들로 말미암아 그들을 기뻐하게 하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘유다와 예루살렘의 모든 남자’라고 하며, 단수형을 분배적으로 사용하여 집단 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘돌아가다’라는 동사를 두 번 사용합니다. 또는 ‘기뻐하며 예루살렘으로 돌아갔습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלַם
  english_pob_choice: every man of Judah and Jerusalem
  chosen_korean: 유다와 예루살렘의 모든 사람들이
  alternatives_korean:
  - 유다와 예루살렘의 모든 남자들이
  - 유다와 예루살렘의 각 사람이
  lexicon: HALOT
  rationale: 히브리어의 אִישׁ 단수 분배 용법은 집합 전체를 가리키므로, 한국어에서는 자연스러운 집합 표현으로 옮기되 전체 집단성을 분명히 했습니다.
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  english_pob_choice: with Jehoshaphat at their head
  chosen_korean: 여호사밧을 앞세우고
  alternatives_korean:
  - 여호사밧이 그들의 머리에 서서
  - 여호사밧이 그들을 이끌고
  lexicon: HALOT
  rationale: בְּרֹאשָׁם은 앞장섬/지도 위치를 뜻하는 관용구이므로, 한국어의 ‘앞세우다’로 앞에 선 지도자라는 이미지를 간결하게 살렸습니다.
- source_word: בְּשִׂמְחָה
  english_pob_choice: with joy
  chosen_korean: 기쁨 가운데
  alternatives_korean:
  - 기쁨으로
  - 기뻐하며
  lexicon: HALOT
  rationale: 명사 שִׂמְחָה의 상태를 살리면서도 현대 한국어에서 어색하지 않은 부사구로 옮겼습니다.
- source_word: שִׂמְּחָם
  english_pob_choice: had made them rejoice
  chosen_korean: 그들을 기뻐하게 하셨기 때문입니다
  alternatives_korean:
  - 그들에게 기쁨을 주셨기 때문입니다
  - 그들을 즐겁게 하셨기 때문입니다
  lexicon: HALOT
  rationale: 피엘 동사의 사역성을 유지하되, 한국어에서는 ‘기뻐하게 하다’가 원인의 강도를 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여호와 대신 학술적 전사인 ‘야훼’를 사용하여 언약 이름을 직접 보존했습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유 이름을 직접 사용하므로, 전통적 대체어보다 이름 자체를 드러내는 번역이 소스에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 원수들로 인한 기쁨의 인과 관계
  chosen_reading: ‘그들의 원수들로 인해 그들을 기뻐하게 하셨기 때문입니다’로 옮겼습니다.
  alternative_readings:
  - 그들의 원수들 때문에 그들에게 기쁨을 주셨기 때문입니다
  - 원수들 위에서 그들을 기뻐하게 하셨기 때문입니다
  rationale: מֵאֹיְבֵיהֶם은 단순한 ‘from’보다 원수들에 대한 승리/반응의 맥락을 가지므로, 기쁨의 근거를 분명히 드러내는 방향을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §2: Source-sense clarity over domestication'
