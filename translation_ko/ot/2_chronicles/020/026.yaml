  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
  footnotes:
  - marker: a
    text: Beracah means “blessing.”
    reason: lexical_alternative
translation:
  language: ko
  text: 넷째 날에 그들은 브라가 골짜기에 모였습니다[a]. 거기에서 그들은 야훼를 송축하였기 때문입니다. 그러므로 그들은 오늘날까지도 그곳의 이름을 브라가 골짜기라고 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 브라가는 ‘송축’ 또는 ‘복’이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְהֲלוּ
  english_pob_choice: they assembled
  chosen_korean: 그들은 …에 모였습니다
  alternatives_korean:
  - 그들은 …에 집결했습니다
  - 그들은 …에 모였습니다
  lexicon: HALOT
  rationale: 니팔형 קהל은 단순히 ‘만났다’보다 ‘함께 모이다’의 의미가 분명하므로, 자연스러운 합쇼체로 ‘모였습니다’를 택했습니다.
- source_word: עֵמֶק
  english_pob_choice: Valley
  chosen_korean: 골짜기
  alternatives_korean:
  - 계곡
  - 골짜기
  lexicon: HALOT
  rationale: 지명 구조에서 עֵמֶק은 현대 한국어의 ‘골짜기’가 가장 직접적이고 자연스럽습니다.
- source_word: בְּרָכָה
  english_pob_choice: Beracah
  chosen_korean: 브라가
  alternatives_korean:
  - 베라가
  - 브라카
  lexicon: HALOT
  rationale: 이곳은 고유 지명이므로 음역을 유지했고, 한국어 외래어 표기 관행에 따라 ‘브라가’로 옮겼습니다. 뒤의 설명 절이 ‘송축하였기 때문’이므로 이름의 뜻과 말놀이가 보존됩니다.
- source_word: בֵּרֲכוּ אֶת יְהוָה
  english_pob_choice: they blessed Yahweh
  chosen_korean: 그들은 야훼를 송축하였기 때문입니다
  alternatives_korean:
  - 그들은 야훼를 축복하였기 때문입니다
  - 그들은 야훼를 복되게 하였기 때문입니다
  lexicon: HALOT
  rationale: בָּרַךְ는 하나님을 대상으로 할 때 ‘송축하다’가 문맥에 맞고, מקום 이름 ‘브라가’와의 어근 연결도 드러납니다. 전통적 ‘축복하다’는 여기서는 의미가 덜 선명합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 사본의 신명기적 표기를 그대로 반영해 하나님의 고유 이름을 ‘야훼’로 옮겼습니다. 이는 직함인 ‘주’로 대체하지 않고 POB의 명명 원칙을 따릅니다.
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  english_pob_choice: they called the name of that place
  chosen_korean: 그들은 그곳의 이름을 …라고 불렀습니다
  alternatives_korean:
  - 그들은 그곳을 …라고 이름 붙였습니다
  - 그들은 그곳의 이름을 …라고 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 명명 관용구를 한국어에서 과도하게 평어화하지 않으면서도 자연스럽게 풀어, ‘이름을 …라고 불렀습니다’로 옮겼습니다.
theological_decisions:
- issue: 여호와 대신 야훼로 표기하는 하나님의 이름
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겨 고유 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 이름 자체를 반복적으로 강조하며, 장소 이름의 유래도 그 이름을 ‘송축한’ 행위에 연결됩니다. 따라서 직함 대체보다 고유명 보존이 본문의 의도를 더 잘 살립니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
