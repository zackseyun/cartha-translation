id: 2CH.20.12
reference: 2 Chronicles 20:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
  footnotes:
  - marker: a
    text: Or, more formally, 'for our eyes are upon you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 하나님이시여, 그들을 심판하시지 않겠습니까? 우리에게는 우리에게 맞서 오는 이 큰 무리 앞에서 힘이 없습니다. 우리는 무엇을 해야 할지 알지 못하지만, 우리의 눈은 하나님께 향해 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  english_pob_choice: Our God
  chosen_korean: 우리 하나님이시여
  alternatives_korean:
  - 우리 하나님
  - 오 우리 하나님
  lexicon: HALOT
  rationale: 기도의 호칭이므로 직설적이면서도 공손한 호격 표현을 살렸습니다. ‘이시여’는 합쇼체 기도문에서 자연스럽고, 소속감인 ‘우리’도 유지합니다.
- source_word: הֲלֹא תִשְׁפָּט בָּם
  english_pob_choice: will you not judge them?
  chosen_korean: 그들을 심판하시지 않겠습니까?
  alternatives_korean:
  - 그들을 판단하시지 않겠습니까?
  - 그들을 심판하지 않으시겠습니까?
  lexicon: HALOT
  rationale: שׁפט는 이 문맥에서 단순한 ‘판단’보다 하나님이 원수들을 향해 사법적으로 개입하시는 뜻이 강하므로 ‘심판하다’가 가장 직접적입니다.
- source_word: אֵין בָּנוּ כֹּחַ
  english_pob_choice: we have no power
  chosen_korean: 우리에게는 … 힘이 없습니다
  alternatives_korean:
  - 우리에게는 능력이 없습니다
  - 우리에게는 힘이 없습니다
  lexicon: HALOT
  rationale: 전쟁 위기 속의 무력함을 드러내는 말이므로 ‘힘’이 자연스럽습니다. ‘능력’도 가능하지만, 여기서는 물리적·실질적 무력감을 더 선명하게 드러내는 표현을 택했습니다.
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  english_pob_choice: but our eyes are on you
  chosen_korean: 우리의 눈은 주님께 향해 있습니다
  alternatives_korean:
  - 우리의 눈은 주님을 향하고 있습니다
  - 우리의 눈은 주님께 있습니다
  lexicon: HALOT
  rationale: 직역의 ‘~에 있다’보다 한국어에서 자연스러운 방향성 표현 ‘향해 있습니다’를 택해 의존과 기대의 이미지를 살렸습니다. 영어 POB의 관찰처럼 ‘for/but’의 문맥적 뉘앙스는 앞뒤 절의 대비로 드러납니다.
theological_decisions:
- issue: 호칭 ‘우리 하나님’의 기도문 어조
  chosen_reading: ‘우리 하나님이시여’로 옮겨, 공동체적 호소와 직접적인 기도 호격을 함께 살렸습니다.
  alternative_readings:
  - 우리 하나님
  - 오 우리 하나님
  rationale: 히브리어의 직접 호칭을 한국어 기도체로 자연스럽게 표지해야 하며, 지나치게 고어적인 표현은 피하면서도 예배적 긴장을 유지할 필요가 있습니다.
  doctrine_reference: 기도 언어의 존칭과 호격 처리
- issue: 마지막 절의 관계사/접속 의미
  chosen_reading: ‘우리의 눈은 주님께 향해 있습니다’로 옮겨, 헬라어식 대비를 억지로 넣지 않고 원문의 의존과 기대를 드러냈습니다.
  alternative_readings:
  - 우리는 주님만 바라보고 있습니다
  - 그러나 우리의 눈은 주님께 향해 있습니다
  rationale: כִּי의 기본값은 ‘왜냐하면/~이므로’이지만, 여기서는 간구의 절정으로서 하나님께 시선을 고정하는 신뢰의 진술이 핵심입니다. 한국어에서는 문맥상 대비가 이미 충분하므로 과도한 접속어를 덧붙이지 않았습니다.
  doctrine_reference: 시편적 간구의 수사 구조
