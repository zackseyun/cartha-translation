translation:
  language: ko
  text: 그가 말했습니다. 「유다 모든 사람과 예루살렘 주민과 여호사밧 왕이여, 들으십시오. 야훼께서 여러분에게 이렇게 말씀하십니다. ‘이 큰 무리 때문에 두려워하지도 말고 낙심하지도 마십시오. 이 전쟁은 여러분의 것이 아니라 하나님의 것입니다[a].’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘이 전쟁은 여러분의 것이 아니라 하나님께 속한 것입니다.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  english_pob_choice: Listen
  chosen_korean: 들으십시오
  alternatives_korean:
  - 잘 들으십시오
  - 귀를 기울이십시오
  lexicon: HALOT
  rationale: 복수 명령의 즉각적이고 공개적인 청취 요청을 자연스러운 현대 공손어로 살렸습니다.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
