base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''for the battle is not yours, but belongs to God.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 말했습니다[a], 「들으십시오, 온 유다와 예루살렘 주민들과 왕 여호사밧이여. 야훼께서 여러분에게 이렇게 말씀하십니다. ‘두려워하지 말고, 이 큰 무리 때문에 낙심하지 마십시오. 이 전쟁은 여러분의 것이 아니라 하나님의 것입니다.’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘이 전쟁은 여러분의 것이 아니라 하나님께 속한 것입니다.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  english_pob_choice: Listen
  chosen_korean: 들으십시오
  alternatives_korean:
  - 잘 들으십시오
  - 귀를 기울이십시오
  lexicon: HALOT
  rationale: 복수 명령의 즉각적이고 공개적인 청취 요청을 자연스러운 현대 공손어로 살렸습니다.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  english_pob_choice: inhabitants of Jerusalem
  chosen_korean: 예루살렘 주민들
  alternatives_korean:
  - 예루살렘에 사는 이들
  - 예루살렘 거주자들
  lexicon: HALOT
  rationale: 거주를 뜻하는 분사를 한국어에서는 ‘주민들’이 가장 자연스럽고 공적인 집단 호칭으로 전달합니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 … 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이렇게 말씀하십니다
  - 주께서 … 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 공식문을 현재형 선언으로 살리고, 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  english_pob_choice: Do not fear, and do not be dismayed
  chosen_korean: 두려워하지 말고, … 낙심하지 마십시오
  alternatives_korean:
  - 두려워하지 말고, … 당황하지 마십시오
  - 두려워하지 말고, … 무너지지 마십시오
  lexicon: HALOT
  rationale: ירא와 חתת의 두 개 금지 명령을 분리해 보존하되, 현대 한국어에서 군사적 맥락에 자연스러운 ‘낙심하다’로 감정적 붕괴를 전달했습니다.
- source_word: הַמִּלְחָמָה
  english_pob_choice: the battle
  chosen_korean: 이 전쟁은
  alternatives_korean:
  - 이 싸움은
  - 이 전투는
  lexicon: HALOT
  rationale: 문맥상 단일 교전이 아니라 공동체의 위기 상황을 가리키므로 ‘전쟁’이 가장 적절합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 역본의 공용 기본값과 사전 명시된 번역 원칙에 따라 신명은 ‘야훼’로 유지해 언약명의 고유성을 드러냈습니다.
  doctrine_reference: Contested terms — יהוה / YHWH → 야훼
- issue: 전쟁의 소유격 표현
  chosen_reading: 이 전쟁은 여러분의 것이 아니라 하나님의 것입니다
  alternative_readings:
  - 이 전쟁은 여러분의 것이 아니라 하나님께 속한 것입니다
  - 이 전쟁은 여러분의 것이 아니라 하나님의 전쟁입니다
  rationale: 히브리어의 소유/귀속 대조를 한국어 소유격으로 직역하되, 하나님이 전쟁을 주관하신다는 점만 드러내고 과도한 신학적 확장은 피했습니다.
  doctrine_reference: Translation philosophy §1, §3
