  to: 그들은 아침 일찍 일어나 드고아 광야로 나갔습니다. 그들이 나갈 때에 여호사밧이 서서 말했습니다. “유다와 예루살렘 주민들아, 내 말을 들으십시오. 너희 하나님 야훼를 믿으십시오. 그러면 굳게 설 것입니다.[a] 그의 예언자들을 믿으십시오. 그러면 형통할 것입니다.”
  rationale: 불명확하고 정보 가치가 낮은 광야 관련 각주를 삭제하고, 원문의 אמן 반복과 결과절의 견고함을 설명하는 각주만 해당 구절 뒤에 배치했습니다. 본문은 원문의 반복된 이동 동사와 시간절을 자연스러운 현대 한국어로 유지했으며, 신명 ‘야훼’와 병행 권면의 구조를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:17:40Z'
