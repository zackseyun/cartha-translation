source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יֵּצְא֖וּ לְ/מִדְבַּ֣ר תְּק֑וֹעַ וּ/בְ/צֵאתָ֞/ם עָמַ֣ד יְהוֹשָׁפָ֗ט וַ/יֹּ֨אמֶר֙ שְׁמָע֗וּ/נִי יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם הַאֲמִ֜ינוּ בַּ/יהוָ֤ה אֱלֹהֵי/כֶם֙ וְ/תֵ֣אָמֵ֔נוּ הַאֲמִ֥ינוּ בִ/נְבִיאָ֖י/ו וְ/הַצְלִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
  footnotes:
  - marker: a
    text: 'Or ''trust in the LORD your God, and you will stand firm.'' The Hebrew uses a wordplay on אמן: ''believe'' ... ''be established/stand firm.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'believe his prophets' or 'trust his prophets.' The same Hebrew verb is repeated for rhetorical effect.
    reason: lexical_alternative
  - marker: c
    text: '''the LORD'' renders the divine name YHWH.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 아침 일찍 일어나 드고아 광야로 나갔습니다. 그들이 나갈 때에 여호사밧이 서서 말했습니다. “유다와 예루살렘 주민들아, 내 말을 들으십시오. 너희 하나님 야훼를 믿으십시오. 그러면 굳게 설 것입니다.[a] 그의 예언자들을 믿으십시오. 그러면 형통할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘믿으십시오’와 ‘굳게 설 것입니다’에 같은 어근(אמן)을 사용하여 말놀이를 이룹니다. ‘굳게 설 것입니다’는 ‘확고하게 될 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  english_pob_choice: They rose early in the morning
  chosen_korean: 아침 일찍 일어나서
  alternatives_korean:
  - 새벽에 일어나서
  - 아침에 일찍 일어나서
  lexicon: HALOT
  rationale: שׁכם의 서술적 용법을 자연스러운 현대 한국어로 옮기되, 이른 출발의 긴박감을 살렸습니다.
- source_word: לְמִדְבַּר תְּקוֹעַ
  english_pob_choice: to the wilderness of Tekoa
  chosen_korean: 드고아 광야로
  alternatives_korean:
  - 드고아의 황야로
  - 드고아 벌판으로
  lexicon: HALOT
  rationale: מִדְבָּר는 단순한 사막보다 광야/황야의 넓은 비거주지를 가리키므로 ‘광야’로 옮겼습니다.
- source_word: הַאֲמִינוּ
  english_pob_choice: believe in
  chosen_korean: 믿으십시오
  alternatives_korean:
  - 신뢰하십시오
  - 믿어 주십시오
  lexicon: HALOT
  rationale: 앞뒤에 반복되는 אמן의 말장난을 살리기 위해 ‘믿으십시오’를 유지했고, 한국어에서도 권면체로 직접성을 보존했습니다.
- source_word: וְתֵאָמֵנוּ
  english_pob_choice: and you will be established
  chosen_korean: 그러면 굳게 설 것입니다
  alternatives_korean:
  - 그러면 확립될 것입니다
  - 그러면 든든히 설 것입니다
  lexicon: HALOT
  rationale: 같은 어근 אמן의 결과를 한국어의 ‘굳게 서다’로 옮겨 믿음과 견고함의 연결을 살렸습니다.
- source_word: וְהַצְלִיחוּ
  english_pob_choice: and you will succeed
  chosen_korean: 그러면 형통할 것입니다
  alternatives_korean:
  - 그러면 성공할 것입니다
  - 그러면 잘될 것입니다
  lexicon: HALOT
  rationale: צלח는 단순 성공보다 일이 잘 풀려 번성하는 뉘앙스가 있어, 문맥상 전쟁 상황을 해치지 않는 범위에서 ‘형통하다’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 주
  rationale: 본문의 고유한 신적 이름을 제목적 표현으로 바꾸지 않고, POB 원칙에 따라 음역하여 인격적 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: נביאיו의 번역
  chosen_reading: 그의 예언자들을
  alternative_readings:
  - 그의 선지자들을
  - 그의 예언자들
  rationale: 히브리어 נביאים의 기본 의미를 현대 한국어에서 가장 직접적으로 드러내기 위해 ‘예언자’로 옮겼습니다. 교회 전통어 ‘선지자’는 익숙하지만, 원문 기능을 보다 투명하게 드러내는 표현을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
