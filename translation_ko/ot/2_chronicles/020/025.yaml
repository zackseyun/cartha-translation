    rationale: ‘시체들’은 문맥상 어려운 독법이며 일부 고대 증거와 번역은 ‘옷’과 같은 독법을 반영하거나 이 말을 생략합니다. 본문은 MT를 따르되, 독자가 이 문제를 이해하도록 해당 단어에 각주를 붙이는 것이 적절합니다.
