review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 마소라 본문의 פְגָרִים는 통상 ‘시체들’을 뜻하는데, 초안은 이를 생략하고 근거 없이 ‘옷’을 본문에 넣었습니다. 영어 POB의 본문과 주석 사이에도 불일치가 있으나, 원어 본문을 우선하여 ‘시체들’을 본문에 보존하고 본문비평적 문제는 각주로 처리해야 합니다. לְאֵין מַשָּׂא는 단순한 ‘감당’보다 운반·짐의 한계에 관한 표현으로 옮기는 편이 정확합니다.
  naturalness: 합쇼체 문체는 대체로 적절합니다. 다만 ‘그들 가운데서’는 반복되는 대명사 때문에 다소 모호할 수 있으나, 원문의 넓은 지시 범위를 유지하기 위해 보존할 수 있습니다. 열거 항목에 ‘시체들’을 포함하면 역사 서술의 불편한 요소를 불필요하게 완화하지 않고 자연스럽게 전달할 수 있습니다.
  terminology: ‘전리품’, ‘물품’, ‘값진 물건들’은 문맥에 적절합니다. 전투 뒤 전리품을 취하는 행위에는 ‘노략하다’도 가능하나, 현대 한국어에서 ‘전리품을 거두다’가 더 자연스럽고 의미를 과도하게 바꾸지 않습니다. פְגָרִים는 ‘시체들’로 옮기며, 이례적인 목록 항목은 각주에서 설명합니다.
  issues:
