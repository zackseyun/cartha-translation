    issue: פְגָרִים(‘시체들’)의 생략 및 ‘옷’으로의 대체
    rationale: WLC 본문은 רְכוּשׁ וּפְגָרִים וּכְלֵי חֲמֻדוֹת, 곧 ‘물품/소유물, 시체들, 값진 물건들’을 읽습니다. ‘옷’은 마소라 본문에 없으며, 본문을 매끈하게 만들기 위해 원문 단어를 삭제하거나 대체해서는 안 됩니다.
  - severity: medium
    issue: לְאֵין מַשָּׂא의 운반 의미 약화
    rationale: ‘감당할 수 없을 만큼’은 양적 압도라는 결과를 전달하지만, ‘짐을 지거나 운반할 수 없음’이라는 관용적 표현의 구체성을 잃습니다. ‘짊어질 수 없을 만큼’이 더 가깝습니다.
  - severity: low
