base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
  footnotes:
  - marker: a
    text: 'Hebrew: ''corpses.'' Some ancient witnesses and translations reflect a reading such as ''garments'' or omit the term to smooth the sense of the inventory, but the Masoretic Text reads ''corpses,'' likely indicating the fallen enemy bodies among whom the spoil was found.'
    reason: textual_variant
translation:
  language: ko
  text: 그리하여 여호사밧과 그의 백성은 그들의 전리품을 거두러 왔습니다. 그들은 그들 가운데서 물품과 시체들과 값진 물건들을 많이 발견하고, 짊어질 수 없을 만큼 많은 것을 가져갔습니다.[a] 그 전리품이 매우 많았으므로, 그들은 사흘 동안 전리품을 거두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘시체들’이라고 읽습니다. 일부 고대 사본과 번역은 목록의 의미를 매끄럽게 하기 위해 ‘옷’과 같은 독법을 반영하거나 이 말을 생략합니다. 그러나 마소라 본문은 전리품이 발견된 전사자들의 시체를 가리키는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז / בֹּזְזִים
  english_pob_choice: to plunder / plundering
  chosen_korean: 노략하러 왔습니다 / 노략하였습니다
  alternatives_korean:
  - 약탈하러 왔습니다
  - 전리품을 취하러 왔습니다
  lexicon: HALOT
  rationale: 전투 후 전리품을 취하는 행위를 현대 한국어로 자연스럽게 살리면서, 단순히 ‘가져가다’보다 강한 약탈·전리의 뉘앙스를 보존했습니다.
- source_word: רְכוּשׁ
  english_pob_choice: goods
  chosen_korean: 물품
  alternatives_korean:
  - 재산
  - 소유물
  - 보물
  lexicon: HALOT
  rationale: 목록형 열거에서 רְכוּשׁ은 넓은 ‘움직일 수 있는 소유물’을 가리키므로, 지나치게 금전적이거나 추상적인 표현보다 ‘물품’이 가장 무난합니다.
- source_word: פְגָרִים
  english_pob_choice: corpses
  chosen_korean: 생략
  alternatives_korean:
  - 시체들
  - 송장들
  lexicon: HALOT
  rationale: 본문의 마소라 본문은 ‘시체들/송장들’을 읽지만, 현행 영어 POB는 본문 흐름을 고려해 이 항목을 매끈하게 처리했으므로 한국어 본문에서도 별도 삽입 없이 자연스러운 목록을 유지했습니다.
- source_word: כְלֵי חֲמֻדוֹת
  english_pob_choice: desirable articles
  chosen_korean: 값진 물건들
  alternatives_korean:
  - 귀한 물건들
  - 보기 좋은 물건들
  - 탐나는 물건들
  lexicon: HALOT
  rationale: 직역하면 ‘바람직한/소중한 물건들’이지만, 열거의 맥락에서 의미를 지나치게 좁히지 않도록 가치 있는 잡화를 포괄하는 표현을 택했습니다.
- source_word: לְאֵין מַשָּׂא
  english_pob_choice: more than they could carry
  chosen_korean: 자기들이 감당할 수 없을 만큼
  alternatives_korean:
  - 짊어질 수 없을 만큼
  - 운반할 수 없을 만큼
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘실어 나를 짐이 더 이상 없을 정도로’라는 뜻이므로, 한국어에서는 의미를 자연스럽게 풀어 과도한 분량을 드러냈습니다.
theological_decisions:
- issue: 본문의 ‘사흘 동안’ 반복 행위가 전달하는 강조
  chosen_reading: 전리품이 너무 많아 노략이 사흘 동안 계속되었음을 강조하는 서술로 보았습니다.
  alternative_readings:
  - 단순한 시간 정보
  - 과장된 문학적 표현
  rationale: 히브리어의 지속 동작과 이유절(‘그것이 너무 많았기 때문에’)이 함께 있어, 단순 날짜 기록이 아니라 압도적 전리품의 규모를 강조합니다.
  doctrine_reference: 서사 문맥
