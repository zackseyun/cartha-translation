translation:
  language: ko
  text: 여호사밧은 유다와 예루살렘의 회중 가운데, 야훼의 집에서 새 뜰 앞에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘새 뜨락’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  english_pob_choice: stood
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 섰습니다
  - 자리를 잡고 섰습니다
  lexicon: HALOT
  rationale: 서술적 과거로 자연스럽게 옮기되, 군중 앞에 나서는 장면의 단순한 동작을 과장하지 않기 위해 ‘서 있었습니다’를 택했습니다.
- source_word: בִּקְהַל
  english_pob_choice: in the assembly of
  chosen_korean: 회중 앞에서
  alternatives_korean:
  - 회중 가운데
  - 모인 무리 앞에서
  - 총회 가운데
  lexicon: HALOT
  rationale: קהל은 단순한 인적 집합보다 공개적으로 모인 공동체를 가리키므로, 현대 한국어에서 공적인 장면을 드러내는 ‘회중’으로 옮겼습니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 성전
  lexicon: HALOT
  rationale: 원문은 직역상 ‘집’이며, POB의 יְהוָה 처리 원칙에 따라 ‘야훼’를 유지했습니다. ‘성전’은 뜻은 맞지만 본문이 가진 직설성을 약화할 수 있어 기본형을 살렸습니다.
- source_word: הֶחָצֵר הַחֲדָשָׁה
  english_pob_choice: the new court
  chosen_korean: 새 뜰
  alternatives_korean:
  - 새 뜨락
  - 새 뜰터
  - 새뜰
  lexicon: HALOT
  rationale: חָצֵר는 성전 문맥에서 뜰/뜰 공간을 가리키므로, 영어의 ‘court’에 대응하는 자연스러운 한국어로 ‘뜰’을 택했습니다. ‘새’는 형용사를 그대로 반영했습니다.
theological_decisions:
- issue: 여호사밧의 공개적 위치를 나타내는 전치사구의 처리
  chosen_reading: ‘회중 앞에서 — 곧 야훼의 집, 새 뜰 앞에서 —’로 배치해 장소와 청중을 모두 드러냈습니다.
  alternative_readings:
  - ‘회중 가운데에서’
  - ‘회중 앞, 야훼의 집의 새 뜰 앞에’
  rationale: 원문은 단순히 그가 어디에 ‘서 있었는지’와 누구 앞에서 말했는지를 함께 보여 줍니다. 한국어에서는 두 층위를 분리해 읽기 쉽도록 대시로 보충했지만, 내용 자체는 과장하지 않았습니다.
  doctrine_reference: 서사 문맥의 공간 표지와 공적 선포 장면의 보존
