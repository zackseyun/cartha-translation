  lexicon: HALOT
  rationale: 접두 ב + 부정사구의 시점 용법을 한국어 시간절로 풀어, 즉위 시점을 분명히 드러냈습니다.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  english_pob_choice: thirty-five years old
  chosen_korean: 서른다섯 살
  alternatives_korean:
  - 서른다섯 해 된
  - 서른다섯 살이었습니다
  lexicon: HALOT
  rationale: 히브리어 연령 관용구를 현대 한국어의 연령 표현으로 옮겼습니다.
- source_word: עֲזוּבָה בַּת שִׁלְחִי
  english_pob_choice: Azubah daughter of Shilhi
  chosen_korean: 실히의 딸 아수바
  alternatives_korean:
  - 아수바, 실히의 딸
  - 아수바, 실히의 딸입니다
  lexicon: HALOT
  rationale: 족보식 표기를 유지하면서 한국어 친족 관계를 자연스럽게 배열했습니다.
