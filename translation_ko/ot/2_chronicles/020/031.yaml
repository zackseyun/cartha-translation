base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: ko
  text: 여호사밧은 유다를 다스렸습니다. 그가 왕이 되었을 때는 서른다섯 살이었고, 예루살렘에서 이십오 년 동안 다스렸습니다. 그의 어머니의 이름은 실히의 딸 아수바였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ ... עַל יְהוּדָה
  english_pob_choice: reigned over Judah
  chosen_korean: 유다를 다스렸습니다
  alternatives_korean:
  - 유다를 통치했습니다
  - 유다의 왕이 되었습니다
  lexicon: HALOT
  rationale: מלך의 왕권 행사와 על + 대상의 지배 관계를 자연스러운 현대 한국어로 옮기되, 연대기적 왕정 서술의 간결함을 살렸습니다.
- source_word: בְּמָלְכ/וֹ
  english_pob_choice: when he began to reign
  chosen_korean: 그가 왕이 되었을 때는
  alternatives_korean:
