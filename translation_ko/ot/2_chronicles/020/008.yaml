translation:
  language: ko
  text: 그들은 그 땅에 살았고[a], 그곳에 주님을 위하여 주님의 이름을 위한 성소를 세우고[b] 이렇게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳에 거주했다’ 또는 ‘그곳에 정착했다’.
    reason: lexical_alternative
  - marker: b
    text: ‘주님의 이름을 위한 성소’는 주님의 이름, 곧 그분의 드러난 임재와 영광에 헌정된 거룩한 장소를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  english_pob_choice: they lived
  chosen_korean: 살았고
  alternatives_korean:
  - 거주했고
  - 머물렀고
  - 살아 있었고
  lexicon: HALOT
  rationale: 땅에 들어가 정착하여 지속적으로 거주했다는 뜻을 자연스러운 현대 한국어로 풀었습니다.
- source_word: בָהּ
  english_pob_choice: in it
  chosen_korean: 그 땅에
  alternatives_korean:
  - 그 안에
  - 거기에
  - 그 속에
  lexicon: HALOT
  rationale: 지시 대상이 땅이므로 한국어에서는 ‘그 땅에’가 가장 분명하고 자연스럽습니다.
- source_word: מִקְדָּשׁ
  english_pob_choice: a sanctuary
  chosen_korean: 한 성소
  alternatives_korean:
  - 한 성전
  - 한 성역
  - 한 거룩한 곳
  lexicon: HALOT
  rationale: ‘מִקְדָּשׁ’의 거룩한 장소라는 뜻을 살리되, 제도적 의미로 굳은 ‘성전’보다 더 넓은 ‘성소’를 택했습니다.
- source_word: לְשִׁמְךָ
  english_pob_choice: for your name
  chosen_korean: 주님의 이름을 위하여
  alternatives_korean:
  - 주님의 이름을 위해
  - 주님의 이름을 따라
  - 주님의 이름 안에서
  lexicon: HALOT
  rationale: 여기서 ‘이름’은 하나님의 드러난 명예와 현존에 대한 헌신을 가리키므로, 단순 목적 이상의 헌정 의미를 살렸습니다.
theological_decisions:
- issue: ‘이름을 위하여’의 신학적 함의
  chosen_reading: 성소는 하나님을 가두는 건물이 아니라, 하나님의 이름—곧 드러난 임재와 영광—에 헌정된 장소로 이해했습니다.
  alternative_readings:
  - 주님의 명예를 위한 건물
  - 주님의 이름이 새겨진 장소
  rationale: 본문의 전형적 성전 신학을 보존하면서, 하나님이 공간에 제한된다는 인상을 주지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3
