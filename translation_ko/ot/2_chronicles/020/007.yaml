base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
  footnotes:
  - marker: a
    text: Or, more literally, “the one who loved you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 우리 하나님, 주께서는 이 땅의 주민들을 주의 백성 이스라엘 앞에서 쫓아내시고, 그것을 영원히 주의 친구 아브라함의 자손에게 주지 않으셨습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아브라함을 가리키는 이 표현은 문자적으로는 ‘주를 사랑한 사람’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Did you not
  chosen_korean: ~하지 않으셨습니까?
  alternatives_korean:
  - ~하지 않으셨습니까
  - 정녕 ~하셨지 않습니까?
  lexicon: HALOT
  rationale: 수사적 질문으로서 대답을 기대하는 뉘앙스를 살리기 위해 반문형 과거 부정 의문으로 옮겼습니다.
- source_word: הוֹרַשְׁתָּ
  english_pob_choice: drive out
  chosen_korean: 쫓아내시고
  alternatives_korean:
  - 몰아내시고
  - 내쫓으시고
  - 추방하시고
  lexicon: HALOT
  rationale: 정복 문맥의 ‘사람을 그 자리에서 물러나게 하다’는 의미를 자연스러운 현대 한국어로 살렸습니다.
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  english_pob_choice: the inhabitants of this land
  chosen_korean: 이 땅의 주민들
  alternatives_korean:
  - 이 땅에 거주하던 사람들
  - 이 땅의 거민들
  lexicon: HALOT
  rationale: ‘거주자들’의 집합적 표현을 현대 한국어로 간결하게 옮겼습니다.
- source_word: לְזֶרַע אַבְרָהָם
  english_pob_choice: to the offspring of Abraham
  chosen_korean: 아브라함의 자손에게
  alternatives_korean:
  - 아브라함의 후손에게
  - 아브라함의 씨에게
  lexicon: HALOT
  rationale: זֶרַע의 집합명사성을 한국어 성경 문맥에서 가장 자연스럽게 드러내는 표현을 택했습니다.
- source_word: אֹהַבְךָ
  english_pob_choice: your friend
  chosen_korean: 주의 친구
  alternatives_korean:
  - 주를 사랑한 사람
  - 주를 사랑하는 사람
  lexicon: HALOT
  rationale: 아브라함에 대한 관용적 칭호를 살리되, 한국어에서 직접 호칭으로 자연스럽게 들리도록 ‘주의 친구’로 옮겼습니다.
theological_decisions:
- issue: 아브라함 칭호 אֹהַבְךָ의 처리
  chosen_reading: ‘주의 친구’로 본문에 두어, 관계적 칭호를 유지했습니다.
  alternative_readings:
  - ‘주를 사랑한 사람’으로 더 직역할 수 있습니다.
  - ‘주를 사랑하는 자’로 옮길 수 있습니다.
  rationale: 본문은 아브라함의 사랑을 말하면서도 언약적 관계를 칭호처럼 부각합니다. 한국어 본문에서는 익숙한 성경적 호칭을 살리고, 더 문자적인 의미는 영어 주석과 함께 추적 가능하게 두는 편이 적절합니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension where ambiguity is genuine)
