translation:
  language: ko
  text: 그러므로 여호사밧의 왕국은 평안하였고, 그의 하나님께서 사방으로 그에게 안식을 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러므로 여호사밧의 왕국은 조용하였고, 그의 하나님께서 사방으로 그에게 안식을 주셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  english_pob_choice: was at peace
  chosen_korean: 평안하였고
  alternatives_korean:
  - 조용하였고
  - 고요하였고
  - 잠잠하였고
  lexicon: HALOT
  rationale: שׁקט는 ‘조용하다’보다 ‘평안하다/고요하다’의 뜻이지만, 왕국이 주어일 때 한국어에서는 상태를 자연스럽게 살린 ‘평안하다’가 가장 적절합니다.
- source_word: מַלְכוּת
  english_pob_choice: kingdom
  chosen_korean: 왕국
  alternatives_korean:
  - 나라
  - 통치
  lexicon: HALOT
  rationale: 여호사밧의 정치적 영역을 가리키므로 ‘왕국’이 직역성과 문맥 적합성을 함께 살립니다.
- source_word: וַיָּנַח
  english_pob_choice: gave him rest
  chosen_korean: 안식을 주셨습니다
  alternatives_korean:
  - 쉬게 하셨습니다
  - 평안을 주셨습니다
  - 편히 하셨습니다
  lexicon: HALOT
  rationale: נוח의 사역적 의미를 살리면서 한국어에서 가장 자연스러운 결과 표현은 ‘안식을 주다’입니다.
- source_word: מִסָּבִיב
  english_pob_choice: all around
  chosen_korean: 사방으로
  alternatives_korean:
  - 사방에서
  - 둘러싸인 모든 곳에서
  - 온 사방에
  lexicon: HALOT
  rationale: 주변의 위협이 제거되어 전면적 안정이 주어졌다는 뜻을 간결하게 담기 위해 ‘사방으로’로 옮겼습니다.
theological_decisions:
- issue: 첫 절의 접속과 원인/결과 관계
  chosen_reading: 히브리어는 단순한 연속 접속이지만, 한국어에서는 앞절의 평안이 뒤절의 하나님의 행위로 성립된 결과임이 드러나도록 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘그리고 그의 하나님께서 사방으로 그에게 안식을 주셨습니다’처럼 더 직설적으로 옮길 수 있습니다.
  rationale: 원문의 의미를 더 명확히 전달하되, 하나님의 주권적 행위가 평안의 근원이라는 점을 과장 없이 드러내기 위한 번역 판단입니다.
  doctrine_reference: Translation philosophy §1, §3, §6
