reference: 2 Chronicles 20:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
  footnotes:
  - marker: a
    text: Or “God of our ancestors.” The Hebrew reads “God of our fathers.”
    reason: lexical_alternative
  - marker: b
    text: Or “there is no one who can withstand you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 말했습니다. 「야훼, 우리 조상들의 하나님, 당신은 하늘에 계신 하나님이 아니십니까? 또 당신은 모든 민족의 왕국들을 다스리지 않으십니까? 당신의 손에는 능력과 권세가 있으며, 당신을 대적하여 설 자가 없습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 선조들의 하나님”으로 옮길 수 있습니다. 히브리어는 “우리 조상들의 하나님”이라고 읽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “당신을 견딜 자가 없습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / project default
  rationale: 원문 고유명인 YHWH를 본문에서 직접 드러내기 위해 프로젝트 기본값인 ‘야훼’를 따랐습니다. ‘주님’은 존칭 의미는 살지만 신명 표지를 지우므로 여기서는 덜 적합합니다.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  english_pob_choice: God of our fathers
  chosen_korean: 우리 조상들의 하나님
  alternatives_korean:
  - 우리의 아버지들의 하나님
  - 우리 선조들의 하나님
  lexicon: HALOT
  rationale: 히브리어의 관계구문을 자연스러운 현대 한국어로 옮기되, EN POB가 지적한 남성 복수의 직접성을 크게 훼손하지 않도록 ‘조상들’을 사용했습니다.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  english_pob_choice: the kingdoms of the nations
  chosen_korean: 모든 민족의 왕국들
  alternatives_korean:
  - 열방의 왕국들
  - 민족들의 나라들
  lexicon: HALOT
  rationale: ‘왕국들’의 정치적 실체를 유지하면서, הַגּוֹיִם의 집합적 의미를 한국어에서 가장 자연스럽게 풀어 ‘민족들’로 옮겼습니다.
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  english_pob_choice: there is none who can stand against you
  chosen_korean: 당신을 대적하여 설 자가 없습니다
  alternatives_korean:
  - 당신을 견딜 자가 없습니다
  - 당신 앞에 설 자가 없습니다
  lexicon: HALOT
  rationale: 히브리어 동사 יָצַב/הִתְיַצֵּב의 ‘서다’ 이미지를 살리면서, 문맥상 대항의 뜻을 분명히 하기 위해 ‘대적하여 서다’로 옮겼습니다.
theological_decisions:
- issue: 신명(YHWH)의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 주님
  rationale: 이 절은 יְהוָה를 직접 사용하므로, 프로젝트 기준에 따라 언약적 고유명 자체를 보존하는 ‘야훼’가 본문 충실도 면에서 가장 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘하늘에 계신 하나님’의 서술 방식
  chosen_reading: 하늘에 계신 하나님이 아니십니까?
  alternative_readings:
  - 하늘의 하나님이 아니십니까?
  - 하늘에 있는 하나님이 아니십니까?
  rationale: 히브리어의 בַּשָּׁמַיִם는 단순 위치보다 하나님의 초월적 통치를 함께 드러내므로, 한국어에서는 자연스럽고도 신학적으로 무리 없는 ‘하늘에 계신’으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2 (source-directed clarity)
