  rationale: 가장 필요한 의미상 수정은 גְּבוּרָה를 ‘권세’가 아니라 ‘위력’으로 옮긴 것입니다. 또한 두 각주를 각각의 해당 본문 표현에 붙여 연결을 바로잡았고, a 각주에서 원문의 남성 복수 명사 ‘아버지들’을 명시했습니다. 그 외 문장은 원문의 수사적 구조와 현대 합쇼체를 잘 보존하므로 유지했습니다.
