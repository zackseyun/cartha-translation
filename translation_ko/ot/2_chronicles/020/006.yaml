- from: 그리고 말했습니다. 「야훼, 우리 조상들의 하나님, 당신은 하늘에 계신 하나님이 아니십니까? 또 당신은 모든 민족의 왕국들을 다스리지 않으십니까? 당신의 손에는 능력과 권세가 있으며, 당신을 대적하여 설 자가 없습니다.」[a][b]
