source:
  edition: WLC
  text: וַ֠/יַּֽעַמְדוּ בְּנֵ֨י עַמּ֧וֹן וּ/מוֹאָ֛ב עַל יֹשְׁבֵ֥י הַר שֵׂעִ֖יר לְ/הַחֲרִ֣ים וּ/לְ/הַשְׁמִ֑יד וּ/כְ/כַלּוֹתָ/ם֙ בְּ/יוֹשְׁבֵ֣י שֵׂעִ֔יר עָזְר֥וּ אִישׁ בְּ/רֵעֵ֖/הוּ לְ/מַשְׁחִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
  footnotes:
  - marker: a
    text: Hebrew 'to put them under the ban,' that is, to devote them to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 암몬 사람들과 모압 사람들이 세일 산 주민들을 대적하여 일어나 그들을 진멸하고[a] 멸망시키려고 했습니다. 세일 주민들을 멸망시킨 뒤에는 서로 도와 서로를 멸망시켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘금지 아래 두다’라는 말로, 곧 멸절에 바친다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  english_pob_choice: rose up against
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 맞섰습니다
  - 들고일어났습니다
  lexicon: HALOT
  rationale: 전쟁 문맥의 עמד는 단순히 '서다'보다 적대적으로 행동에 나서다의 뜻이 강하므로, 한국어에서는 간결하게 '일어났습니다'로 옮겨 적대성을 살렸습니다.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  english_pob_choice: the Ammonites and Moabites
  chosen_korean: 암몬 자손과 모압 자손
  alternatives_korean:
  - 암몬 사람들과 모압 사람들
  - 암몬과 모압의 아들들
  lexicon: HALOT
  rationale: 히브리어의 관용적 집합명칭을 한국어 성경 문맥에 자연스러운 '자손'으로 옮겨 민족 집단을 분명히 했습니다.
- source_word: לְהַחֲרִים
  english_pob_choice: to devote them to destruction
  chosen_korean: 진멸하고
  alternatives_korean:
  - 멸절하고
  - 금지 아래 두고 멸망시키려고
  lexicon: HALOT
  rationale: חרם의 언약적·전쟁적 함의를 살리면서도 현대 한국어에서 읽히도록 '진멸'을 택했습니다. '멸망시키려고'는 앞의 목적구조를 자연스럽게 풀어 준 표현입니다.
- source_word: וּלְהַשְׁמִיד
  english_pob_choice: to wipe them out
  chosen_korean: 멸망시키려고
  alternatives_korean:
  - 없애려고
  - 완전히 없애려고
  lexicon: HALOT
  rationale: שמד는 앞선 חרם보다 파괴의 결과를 강조하므로, 같은 '진멸'을 반복하지 않고 '멸망시키려고'로 두 번째 파괴 동사를 구분했습니다.
- source_word: וּכְכַלּוֹתָם
  english_pob_choice: and when they had finished
  chosen_korean: 그리고 세일 주민들을 다 끝내고 나서는
  alternatives_korean:
  - 그리고 세일 주민들을 끝내고 나서
  - 세일 주민들을 모두 끝낸 뒤
  lexicon: HALOT
  rationale: 시간 부사절의 순서를 드러내기 위해 '끝내고 나서는'을 사용했고, 목적어를 반복해 앞절과의 연결을 분명히 했습니다.
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ
  english_pob_choice: they helped each other
  chosen_korean: 서로 서로를 도왔습니다
  alternatives_korean:
  - 서로 도왔습니다
  - 각자 자기 동무를 도왔습니다
  lexicon: HALOT
  rationale: 직역하면 '사람이 자기 이웃을 도왔다'는 상호적 표현이므로, 한국어에서는 상호성을 분명히 하는 '서로'를 사용했습니다.
theological_decisions:
- issue: חרם 전쟁어의 번역 강도
  chosen_reading: '''진멸''로 옮겨 전쟁과 심판의 강한 종교적 의미를 유지했습니다.'
  alternative_readings:
  - '''전멸'''
  - '''하나님께 바쳐 없앰'''
  rationale: 본문의 לְהַחֲרִים은 단순 살육이 아니라 금지 아래 두어 멸절시키는 의미이므로, 교회적 순화보다 원문의 무게를 살리는 표현이 적절합니다.
  doctrine_reference: 번역 원칙 §§1, 5, 6
