    text: 직역하면 ‘그의 얼굴을 두었다’입니다. 이는 어떤 목적을 향해 단호히 뜻을 정한다는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  english_pob_choice: was afraid
  chosen_korean: 두려워하여
