    reason: lexical_alternative
translation:
  language: ko
  text: 여호사밧이 두려워하여, 야훼를 찾으려고 얼굴을 굳게 하고, 온 유다에 금식을 선포하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼굴을 굳게 하다’는 히브리어 관용구로, 어떤 목적을 향해 단호히 결심하고 나아간다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  english_pob_choice: was afraid
  chosen_korean: 두려워하여
  alternatives_korean:
  - 무서워하여
  - 두려움을 느껴
  lexicon: HALOT
  rationale: ירא는 여기서 실제 두려움을 나타내므로, 현대 한국어에서는 자연스럽고 직설적인 ‘두려워하여’로 옮겼습니다.
- source_word: וַיִּתֵּן ... אֶת פָּנָיו
  english_pob_choice: set his face
  chosen_korean: 얼굴을 굳게 하고
  alternatives_korean:
