  - 마음을 굳게 먹고
  - 결심하고
  lexicon: HALOT
  rationale: 히브리어 관용구의 이미지와 결단성을 살리기 위해 직역에 가까운 표현을 유지하되, 한국어에서 의미가 통하도록 ‘얼굴을 굳게 하고’로 옮겼습니다.
- source_word: לִדְרוֹשׁ
  english_pob_choice: to seek
  chosen_korean: 찾으려고
  alternatives_korean:
  - 구하려고
  - 찾고자
  - 여쭈려고
  lexicon: HALOT
  rationale: 하나님께 ‘דרש’는 단순 정보 문의보다 도움과 인도를 구하는 태도를 포함하므로, 가장 넓고 자연스러운 ‘찾다’ 계열로 번역했습니다.
- source_word: וַיִּקְרָא צוֹם
  english_pob_choice: proclaimed a fast
  chosen_korean: 금식을 선포하였습니다
  alternatives_korean:
  - 금식을 공포하였습니다
  - 금식을 선언하였습니다
  - 금식을 외쳤습니다
  lexicon: HALOT
  rationale: 공적인 왕의 조치를 나타내므로, 제도적이고 공식적인 뉘앙스가 있는 ‘선포하다’를 택했습니다.
theological_decisions:
