    text: 또는 ‘주님의 유업에서, 곧 주께서 우리에게 차지하게 하신 곳에서’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold / And look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오, 이제
  - 자, 보십시오
  - 보라
  lexicon: HALOT
  rationale: 문맥상 여호사밧의 긴박한 호소를 열어 주는 강조 표현이므로, 현대 한국어에서는 정중하면서도 즉각적인 주의를 환기하는 명령형 ‘보십시오’가 가장 자연스럽습니다.
- source_word: גֹּמְלִים עָלֵינוּ
  english_pob_choice: are repaying us
  chosen_korean: 우리에게 갚으려 하여
  alternatives_korean:
  - 우리에게 보답하여
  - 우리에게 보복하여
  - 우리에게 되갚고
  lexicon: HALOT
  rationale: גמל의 ‘되갚다/보답하다’ 의미를 살리되, 전투·침탈 문맥에서 아이러니를 드러내도록 진행형 의미를 완화한 ‘갚으려 하여’로 옮겼습니다.
- source_word: לְגָרְשֵׁנוּ
  english_pob_choice: to drive us out
  chosen_korean: 우리를 쫓아내려 합니다
  alternatives_korean:
  - 우리를 몰아내려 합니다
  - 우리를 내쫓으려 합니다
  - 우리를 추방하려 합니다
  lexicon: HALOT
  rationale: גרש의 핵심 의미인 ‘내쫓다/몰아내다’를 현대적이고 직접적인 동사구로 옮겨 군사적·토지적 긴장을 분명히 했습니다.
- source_word: מִיְּרֻשָּׁתְךָ
  english_pob_choice: of your possession
  chosen_korean: 당신의 소유에서
  alternatives_korean:
  - 당신의 유업에서
  - 당신의 기업에서
  - 당신의 상속 재산에서
  lexicon: HALOT
  rationale: 히브리어가 하나님의 궁극적 소유권을 가리키므로, 한국어에서도 전통적 교회어휘인 ‘유업’보다 ‘소유’가 본문 대비를 더 분명히 드러냅니다.
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  english_pob_choice: which you gave us as an inheritance
  chosen_korean: 주께서 우리에게 유업으로 주신
  alternatives_korean:
  - 주께서 우리에게 상속으로 주신
  - 주께서 우리에게 차지하게 하신
  - 주께서 우리에게 기업으로 주신
  lexicon: HALOT
  rationale: Hiphil의 ‘상속받게 하다/차지하게 하다’ 의미를 살리면서, 문맥상 하나님이 땅을 선물하신다는 점을 한국어 ‘유업으로 주신’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 하나님의 궁극적 소유와 이스라엘의 유업 관계
  chosen_reading: 당신의 소유에서 … 주께서 우리에게 유업으로 주신
  alternative_readings:
  - 당신의 유업에서 … 주께서 우리에게 차지하게 하신
  - 당신의 상속 재산에서 … 주께서 우리에게 상속으로 주신
  rationale: 본문은 땅이 먼저 하나님께 속하고, 그다음 이스라엘이 그것을 선물로 받았음을 구분합니다. 한국어에서도 이 이중 의미가 흐려지지 않도록 ‘소유’와 ‘유업’을 함께 살렸습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
