revisions:
- from: 보십시오. 그들이 우리에게 갚으려 하여 와서, 주께서 우리에게 유업으로 주신 당신의 소유에서 우리를 쫓아내려 합니다.[a]
  to: 보십시오. 그들이 와서 주께서 우리에게 유업으로 주신 주님의 소유에서 우리를 쫓아내려고, 우리에게 이렇게 되갚고 있습니다.[a]
  rationale: ‘되갚고 있습니다’로 גֹּמְלִים의 진행적이고 아이러니한 보응의 뜻을 보존했습니다. ‘주님의 소유’와 ‘우리에게 유업으로 주신’을 함께 사용하여 하나님의 궁극적 소유와 이스라엘의 수여받은 유업을 구별했으며, 문체를 일관된 현대 합쇼체로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:17:46Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, 현재의 ‘갚으려 하여’는 분사 גֹּמְלִים의 실제적·진행적 ‘되갚고 있다’보다 의도나 미수의 뉘앙스를 강하게 만듭니다. ‘와서’는 그들이 이 보복을 실행하는 방식과 목적을 나타내므로, ‘와서 … 쫓아내려고’로 명확히 연결하는 편이 좋습니다.
  naturalness: ‘주께서’와 ‘당신의’를 한 문장 안에서 함께 쓰는 것은 하나님께 직접 호소하는 한국어 기도체에서 호칭 체계가 흔들립니다. ‘주님의’으로 통일하면 현대 표준어 합쇼체에서 자연스럽고 경건한 공적 문체가 됩니다.
  terminology: מִיְּרֻשָּׁתְךָ는 하나님의 소유/유산을, הוֹרַשְׁתָּנוּ는 하나님께서 이스라엘이 그것을 유업으로 받도록 하신 일을 가리킵니다. ‘주님의 소유’와 ‘우리에게 유업으로 주신’을 병치하여 이 구별을 유지했습니다. 각주 대안도 ‘곳’이라는 명시적 선행사를 넣어 한국어 문장 구조를 바로잡았습니다.
  issues:
  - severity: medium
    issue: ‘우리에게 갚으려 하여’의 상적 의미
    rationale: 히브리어 분사 גֹּמְלִים은 ‘되갚고 있다/갚고 있다’라는 현재의 행위를 나타냅니다. ‘갚으려 하여’는 아직 실행되지 않은 의도처럼 들릴 수 있습니다.
  - severity: low
    issue: 하나님을 가리키는 호칭의 불일치
    rationale: ‘주께서’ 뒤에 ‘당신의’가 이어지면 직접 호소의 높임말 체계가 혼합됩니다. ‘주님의’이 문맥과 등록에 맞습니다.
  - severity: low
    issue: 각주 대안의 문장 구조
    rationale: 기존 각주는 ‘…것에서’가 앞의 ‘유업에서’와 중첩되어 무엇을 가리키는지 다소 불명확합니다. ‘곳에서’로 선행사를 밝혀야 합니다.
  revised_text: 보십시오. 그들이 와서 주께서 우리에게 유업으로 주신 주님의 소유에서 우리를 쫓아내려고, 우리에게 이렇게 되갚고 있습니다.[a]
