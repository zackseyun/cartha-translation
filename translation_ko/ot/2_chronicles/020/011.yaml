  text: 보십시오. 그들이 와서 주께서 우리에게 유업으로 주신 주님의 소유에서 우리를 쫓아내려고, 우리에게 이렇게 되갚고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
