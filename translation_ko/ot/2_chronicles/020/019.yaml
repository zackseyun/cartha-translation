base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
  footnotes:
  - marker: a
    text: 'Or: ''with a loud voice exceedingly''—the Hebrew idiom intensifies the volume of their praise.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 레위 사람들—고핫 사람들과 고라 사람들의 자손들이—일어나 이스라엘의 하나님 야훼를 아주 큰 소리로 찬양했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: ‘매우 큰 소리로’. 히브리어 관용구는 찬양의 음량을 강조합니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  english_pob_choice: stood up
  chosen_korean: 일어나
  alternatives_korean:
  - 서서
  - 일어섰습니다
  lexicon: HALOT
  rationale: 서다/일어나다의 동작을 나타내는 서술로, 예배 자리에서의 공개적 행동을 자연스럽게 드러내기 위해 “일어나”로 옮겼습니다.
- source_word: מִן בְּנֵי הַקְּהָתִים וּמִן בְּנֵי הַקָּרְחִים
  english_pob_choice: from the sons of the Kohathites and from the sons of the Korahites
  chosen_korean: 고핫 사람들과 고라 사람들의 자손들
  alternatives_korean:
  - 고핫 사람들과 고라 사람들
  - 고핫 자손들과 고라 자손들
  lexicon: HALOT
  rationale: ‘sons of’의 족속 표현을 살리되 한국어에서 자연스럽게 읽히도록 ‘…의 자손들’로 정리했고, 고핫/고라는 음역을 유지했습니다.
- source_word: לְהַלֵּל
  english_pob_choice: to praise
  chosen_korean: 찬양했습니다
  alternatives_korean:
  - 찬송했습니다
  - 찬양하기 위해 일어났습니다
  lexicon: HALOT
  rationale: הלל은 단순한 칭찬보다 예배적 찬양의 성격이 강하므로, 문맥상 ‘찬양하다’가 가장 적절합니다.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 이스라엘의 하나님 야훼
  alternatives_korean:
  - 이스라엘의 하나님 여호와
  - 이스라엘의 하나님 주님
  lexicon: HALOT
  rationale: יהוה는 본 프로젝트 기본어인 ‘야훼’로 옮기고, ‘이스라엘의 하나님’이라는 수식을 함께 살려 언약적 호칭을 유지했습니다.
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  english_pob_choice: with a very loud voice
  chosen_korean: 아주 큰 소리로
  alternatives_korean:
  - 매우 큰 소리로
  - 극히 큰 소리로
  lexicon: HALOT
  rationale: 직역하면 ‘큰 소리로, 더욱’의 중첩이지만 한국어에서는 하나의 강한 강조로 자연스럽게 합쳐 ‘아주 큰 소리로’로 표현했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 본문의 יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 기록의 기본 원칙에 따라 신적 고유명사를 전통적 치환어보다 원어 대응형으로 드러내어, 예배 찬양의 대상이 단순한 호칭이 아니라 언약 이름임을 보존했습니다.
  doctrine_reference: Project glossary — יהוה / YHWH → 야훼
