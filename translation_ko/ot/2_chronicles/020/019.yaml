  rationale: 이 기록의 기본 원칙에 따라 신적 고유명사를 전통적 치환어보다 원어 대응형으로 드러내어, 예배 찬양의 대상이 단순한 호칭이 아니라 언약 이름임을 보존했습니다.
  doctrine_reference: Project glossary — יהוה / YHWH → 야훼
