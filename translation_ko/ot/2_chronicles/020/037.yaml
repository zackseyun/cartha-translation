source:
  edition: WLC
  text: וַ/יִּתְנַבֵּ֞א אֱלִיעֶ֤זֶר בֶּן דֹּדָוָ֨הוּ֙ מִ/מָּ֣רֵשָׁ֔ה עַל יְהוֹשָׁפָ֖ט לֵ/אמֹ֑ר כְּ/הִֽתְחַבֶּרְ/ךָ֣ עִם אֲחַזְיָ֗הוּ פָּרַ֤ץ יְהוָה֙ אֶֽת מַעֲשֶׂ֔י/ךָ וַ/יִּשָּׁבְר֣וּ אֳנִיּ֔וֹת וְ/לֹ֥א עָצְר֖וּ לָ/לֶ֥כֶת אֶל תַּרְשִֽׁישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
  footnotes:
  - marker: a
    text: Or “the LORD has shattered your undertaking.” The Hebrew says “your works,” referring here to Jehoshaphat’s shipbuilding enterprise.
    reason: lexical_alternative
  - marker: b
    text: Or “could not go” or “were prevented from going” to Tarshish.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 엘리에젤—도다와후의 아들, 마레사 사람—이 여호사밧을 향하여 예언하며 말했습니다. “당신이 아하시야와 함께하였으므로, 야훼께서 당신의 일을 부수셨습니다.” 그래서 배들이 파선하여 다시는 다소스로 갈 수 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 사업을 야훼께서 부수셨다.” 히브리어는 문자적으로 “당신의 일들”이라고 하며, 여기서는 여호사밧의 함대 건조 사업을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “갈 수 없었거나” “가는 것이 막혔습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  english_pob_choice: prophesied
  chosen_korean: 예언하며
  alternatives_korean:
  - 예언했습니다
  - 선지자처럼 말했습니다
  lexicon: HALOT
  rationale: נבא의 예언 행위를 자연스러운 현대 한국어로 옮기되, 서술문 안에서 동사형으로 처리해 사건 진행을 살렸습니다.
- source_word: עַל יְהוֹשָׁפָט
  english_pob_choice: against Jehoshaphat
  chosen_korean: 여호사밧을 향하여
  alternatives_korean:
  - 여호사밧에게
  - 여호사밧을 거슬러
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘대하여’보다 책망과 심판의 방향이 드러나는 표현이 필요하여, 원문의 예언 대상과 공박의 뉘앙스를 함께 살렸습니다.
- source_word: כְּהִתְחַבֶּרְךָ עִם אֲחַזְיָהוּ
  english_pob_choice: Because you joined yourself with Ahaziah
  chosen_korean: 당신이 아하시야와 함께하였으므로
  alternatives_korean:
  - 당신이 아하시야와 결합하였으므로
  - 당신이 아하시야와 동맹을 맺었으므로
  lexicon: HALOT
  rationale: 히트파엘의 ‘스스로 결합하다/연합하다’는 의미를 살리되, 본문이 명시하지 않는 ‘동맹’은 해석을 덧씌울 수 있어 더 넓은 표현을 택했습니다.
- source_word: מַעֲשֶׂי/ךָ
  english_pob_choice: your works
  chosen_korean: 당신의 일을
  alternatives_korean:
  - 당신의 행위를
  - 당신의 계획을
  - 당신의 사업을
  lexicon: HALOT
  rationale: 직역하면 ‘일들/작업들’이지만, 문맥상 함대 건조 사업 전체를 가리키므로 한국어에서는 그 실질을 드러내는 ‘일’로 옮겼습니다.
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  english_pob_choice: the ships were wrecked
  chosen_korean: 배들이 파선하여
  alternatives_korean:
  - 배들이 부서져
  - 배들이 깨져
  - 배들이 난파되어
  lexicon: HALOT
  rationale: 배의 손상을 말할 때 한국어에서는 ‘파선하다/난파하다’가 가장 자연스럽고, 결과 절의 연결도 매끄럽게 해줍니다.
theological_decisions:
