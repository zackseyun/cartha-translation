  to: 그때 마레사 사람 도다와후의 아들 엘리에셀이 여호사밧을 거슬러 예언하여 말했습니다. “당신이 아하시야와 연합하였으므로, 야훼께서 당신의 일들을 무너뜨리셨습니다.[a]” 그래서 배들이 파선하여 다소스로 갈 수 없었습니다.[b]
