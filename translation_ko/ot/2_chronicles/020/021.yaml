  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
  footnotes:
  - marker: a
    text: Or “the beauty of holiness.” The Hebrew phrase may also be rendered “holy splendor.”
    reason: lexical_alternative
  - marker: b
    text: Or “before the advance troops” or “before the front line.”
    reason: lexical_alternative
  - marker: c
    text: Or “for his mercy endures forever.” The Hebrew חֶסֶד includes the sense of steadfast, covenantal love.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성과 의논한 뒤에 그는 노래하는 사람들을 야훼를 위해 세우고, 거룩함의 아름다움을 찬양하게 하였습니다. 그들이 선두 부대 앞에서 나아가며 「야훼께 감사하십시오. 그의 인자하심은 영원합니다」라고 말하게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거룩함의 아름다움”입니다. 히브리어 구절은 “거룩한 광채”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “전위대 앞에서” 혹은 “전선 앞에서”입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “그의 인자하심은 영원합니다”의 “인자”는 언약적이고 신실한 사랑의 뜻을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל הָעָם
  english_pob_choice: After consulting with the people
  chosen_korean: 백성과 의논한 뒤에
  alternatives_korean:
  - 백성과 상담한 뒤에
  - 백성과 상의한 뒤에
  lexicon: HALOT
  rationale: נִפְעַל 형태의 יעץ는 단순한 말하기보다 함께 의논하고 조언을 구하는 뜻이므로, 자연스러운 현대 한국어로는 ‘의논한 뒤에’가 가장 적절합니다.
- source_word: וַיַּעֲמֵד מְשֹׁרֲרִים
  english_pob_choice: he appointed singers
  chosen_korean: 노래하는 사람들을 세우고
  alternatives_korean:
  - 찬양하는 사람들을 임명하고
  - 가수들을 세우고
  lexicon: HALOT
  rationale: מְשֹׁרֲרִים는 단순한 연주자가 아니라 노래하는 사람들을 가리키므로 ‘노래하는 사람들’이 직역에 가깝고, הִקְים/הֶעֱמִיד의 행정적 의미는 ‘세우고’로 무리 없이 살렸습니다.
- source_word: לְהַדְרַת קֹדֶשׁ
  english_pob_choice: the splendor of holiness
  chosen_korean: 거룩함의 아름다움
  alternatives_korean:
  - 거룩한 광채
  - 거룩함의 영광
  lexicon: HALOT
  rationale: 이 구는 전통적으로 ‘거룩함의 아름다움’으로도 옮길 수 있으나, 본문이 예배의 장엄함을 가리키는 점을 살려 ‘거룩함의 아름다움’으로 옮겼습니다.
- source_word: לִפְנֵי הֶחָלוּץ
  english_pob_choice: before the vanguard
  chosen_korean: 선두 부대 앞에서
  alternatives_korean:
  - 전위대 앞에서
  - 전열 앞에서
  lexicon: HALOT
  rationale: הֶחָלוּץ는 전체 군대가 아니라 앞서 나가는 선봉대를 뜻하므로, 군사적 의미를 분명히 하되 한국어로 자연스러운 ‘선두 부대’로 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love
  chosen_korean: 인자하심
  alternatives_korean:
  - 변함없는 사랑
  - 언약적 사랑
  - 긍휼
  lexicon: HALOT
  rationale: חֶסֶד는 ‘인자’보다 넓게 언약적 신실함과 자비를 포함하지만, 시편과 역대기에서 익숙한 예배 언어를 살려 ‘인자하심’으로 번역했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 야훼의 언약명이 직접 나오므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨 하나님의 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
