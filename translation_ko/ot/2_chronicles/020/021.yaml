revisions:
- from: 백성과 의논한 뒤에 그는 노래하는 사람들을 야훼를 위해 세우고, 거룩함의 아름다움을 찬양하게 하였습니다. 그들이 선두 부대 앞에서 나아가며 「야훼께 감사하십시오. 그의 인자하심은 영원합니다」라고 말하게 하였습니다.[a][b][c]
  to: 백성과 의논한 뒤에 그는 야훼를 위하여 노래할 사람들과 거룩한 아름다움으로 찬양할 사람들을 세웠습니다.[a] 그들은 선봉대 앞에 나아가며[b] 이렇게 말하였습니다. “야훼께 감사드리십시오. 그분의 한결같은 사랑은 영원합니다.”[c]
  rationale: 원문의 단일 임명 동사와 두 병렬 분사를 보존하고, ‘거룩한 아름다움’이 찬양의 대상인지 찬양의 방식·장엄한 복장인지에 관한 표현상의 여지를 각주에 남겼습니다. 사역 구문을 제거하여 노래하는 이들이 선봉대 앞에서 감사의 선언을 한 원문의 서술을 자연스럽게 재현했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:17:37Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 וַיַּעֲמֵד는 ‘세우다/임명하다’라는 한 동사로 ‘야훼를 위한 노래하는 이들’과 ‘거룩한 아름다움(거룩한 장엄함)으로 찬양하는 이들’을 함께 수식합니다. 초안은 이를 각각 ‘찬양하게 하였다’와 ‘말하게 하였다’로 풀어, 임명과 직접 발화의 구조를 불필요하게 사역 구문으로 바꾸었습니다. 또한 לְהַדְרַת קֹדֶשׁ는 문맥과 용례상 찬양의 대상이라기보다 ‘거룩한 아름다움/장엄함으로’라는 방식 또는 복장의 표현으로 읽는 것이 더 직접적입니다.
  naturalness: ‘노래하는 사람들’보다 예배·군사 행렬 문맥에서는 ‘노래할 사람들’이 자연스럽고, ‘그들이 … 말하게 하였습니다’는 한국어 문장 흐름상 부자연스럽습니다. 주절과 인용을 연결하여 자연스러운 합쇼체로 다듬었습니다.
  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. חֶסֶד는 현대 독자에게 다소 불투명한 ‘인자하심’ 대신 ‘한결같은 사랑’으로 옮겨, 지속성과 신실함의 의미를 드러냈습니다. הֶחָלוּץ는 ‘선봉대’로 유지하되, 각주에서 무장한 선발대라는 뜻을 밝혔습니다.
  issues:
  - severity: medium
    issue: ‘거룩함의 아름다움을 찬양하게 하였습니다’는 לְהַדְרַת קֹדֶשׁ를 찬양의 직접 목적어로 처리하고, וַיַּעֲמֵד의 임명 구조를 사역 구조로 바꿉니다.
    rationale: 히브리어는 찬양하는 이들을 세웠다고 하며, לְהַדְרַת קֹדֶשׁ는 ‘거룩한 아름다움으로/거룩한 장엄함을 갖추고’라는 수식으로 읽는 것이 원문 어순과 유사 용례에 더 잘 맞습니다.
  - severity: medium
    issue: ‘…라고 말하게 하였습니다’는 원문의 분사 וְאֹמְרִים(말하며/말하기를)보다 강한 사역 의미를 추가합니다.
    rationale: 노래하는 이들이 행진하며 직접 말한 내용을 인용하는 구조로 옮겨야 합니다.
  - severity: low
    issue: 각주 표지가 관련 어구에 직접 붙어 있지 않고 모두 문장 끝에 집중되어 있습니다.
    rationale: 대안 번역의 적용 범위를 분명하게 하도록 해당 어구 뒤에 표지를 배치합니다.
