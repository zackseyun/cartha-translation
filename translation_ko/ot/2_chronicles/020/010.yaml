reference: 2 Chronicles 20:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֡ה הִנֵּה֩ בְנֵֽי עַמּ֨וֹן וּ/מוֹאָ֜ב וְ/הַר שֵׂעִ֗יר אֲ֠שֶׁר לֹֽא נָתַ֤תָּה לְ/יִשְׂרָאֵל֙ לָ/ב֣וֹא בָ/הֶ֔ם בְּ/בֹאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם כִּ֛י סָ֥רוּ מֵ/עֲלֵי/הֶ֖ם וְ/לֹ֥א הִשְׁמִידֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
  footnotes:
  - marker: a
    text: Or 'the Ammonites and Moabites and those of Mount Seir.' The Hebrew literally names 'the sons of Ammon and Moab and Mount Seir.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'whom you did not give Israel to enter into/against'; the sense in context is that God did not permit Israel to attack them.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 보십시오. 암몬 자손과 모압과 세일 산 사람들은 — 이집트 땅에서 올 때에 주께서 이스라엘이 그들에게 들어가게 하지 않으셨고, 이스라엘이 그들에게서 돌아서서 그들을 멸하지도 않았습니다 —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 지금
  - 지금
  lexicon: HALOT
  rationale: 기도의 흐름을 잇는 전환 표지로서 한국어에서는 간결한 ‘이제’가 가장 자연스럽고, 뒤의 호소를 이끕니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기에
  lexicon: HALOT
  rationale: 문어체 감탄/지시의 힘을 살리면서도 현대 한국어에서 자연스러운 주의를 환기하는 표현으로 옮겼습니다.
- source_word: בְנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  english_pob_choice: the people of Ammon and Moab and Mount Seir
  chosen_korean: 암몬 자손과 모압과 세일 산 사람들
  alternatives_korean:
  - 암몬 사람들과 모압 사람들과 세일 산 사람들
  - 암몬 자손과 모압 자손과 세일 산
  lexicon: HALOT
  rationale: ‘암몬 자손’은 히브리어 직설을 살리고, ‘세일 산’은 장소명 자체가 집단을 가리키는 병행구이므로 자연스러운 한국어로 풀었습니다.
- source_word: לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  english_pob_choice: whom you did not allow Israel to enter against
  chosen_korean: 이스라엘이 그들에게 들어가게 하지 않으셨고
  alternatives_korean:
  - 이스라엘이 그들에게로 들어가도록 허락하지 않으셨고
  - 이스라엘이 그들에 맞서 들어가게 하지 않으셨고
  lexicon: HALOT
  rationale: 직역의 ‘들어가다’와 전투적 방향성을 살리되, 한국어에서는 ‘들어가게 하지 않으셨고’가 가장 과도한 해설 없이 원문 의미를 전달합니다.
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם וְלֹא הִשְׁמִידוּם
  english_pob_choice: for they turned away from them and did not destroy them
  chosen_korean: 이스라엘이 그들에게서 돌아서서 그들을 멸하지도 않았습니다
  alternatives_korean:
  - 그들에게서 물러나서 그들을 멸하지도 않았습니다
  - 그들에게서 벗어나 그들을 진멸하지도 않았습니다
  lexicon: HALOT
  rationale: ‘돌아서다’는 적대 행위를 하지 않고 경로를 돌린다는 맥락을 잘 드러내며, ‘멸하다’는 전쟁 문맥의 강한 파괴 의미를 유지합니다.
theological_decisions:
- issue: 기도문에서 하나님을 직접 호칭하는 높임말 처리
  chosen_reading: 주께서 … 하지 않으셨고
  alternative_readings:
  - 하나님께서 … 하지 않으셨고
  - 여호와께서 … 하지 않으셨고
  rationale: 이 구절은 여호사밧의 직접 기도이므로 2인칭 호칭을 살리되, 한국어 기도체에서 자연스러운 존대 표현으로 정리했습니다.
  doctrine_reference: 직접 خطاب 유지 및 예배용 한국어 문체 원칙
