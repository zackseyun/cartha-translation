- from: 그때 아마샤는 유다를 모아 조상 가문별로 천부장들과 백부장들 아래에 세웠으며, 온 유다와 베냐민을 위하여 그들을 배치했습니다. 그는 그들을 스무 살 이상으로 계수했고, 삼십만 명의 선발된 사람들, 곧 전쟁에 나갈 수 있고 창과 방패를 다룰 수 있는 사람들로 여겼습니다.[a][b][c]
