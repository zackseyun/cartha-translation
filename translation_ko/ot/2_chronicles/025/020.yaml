base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
  footnotes:
  - marker: a
    text: Literally, 'into the hand'; a Hebrew idiom meaning 'into the power' of another.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아마샤는 듣지 않았습니다[a]. 그것은 하나님에게서 난 일이었으니, 그들이 에돔의 신들을 찾았기 때문에 그들을 적군의 손에 넘기려 하심이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '손에'입니다. 히브리어 관용구로, '권세 아래' 또는 '패배의 상태로' 넘겨진다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  english_pob_choice: would not listen
  chosen_korean: 듣지 않았습니다
  alternatives_korean:
  - 귀를 기울이지 않았습니다
  - 말을 듣지 않았습니다
  lexicon: HALOT
  rationale: 여기서는 단순 청취가 아니라 경고와 권고를 받아들이지 않는 뜻이므로, 자연스러운 합쇼체로 '듣지 않았습니다'가 가장 간결하게 대응합니다.
- source_word: מֵהָאֱלֹהִים הִיא
  english_pob_choice: it was from God
  chosen_korean: 하나님에게서 난 일이었으니
  alternatives_korean:
  - 그것은 하나님에게서였습니다
  - 하나님에게서 온 일이었습니다
  lexicon: HALOT
  rationale: 지시대명사 'it'의 대상이 앞선 상황 전체라는 점을 살려, 결과가 하나님에게서 비롯된 사건임을 한국어로 자연스럽게 드러냈습니다.
- source_word: בְּיָד
  english_pob_choice: into the hand of their enemies
  chosen_korean: 적군의 손에
  alternatives_korean:
  - 그들의 손에
  - 원수의 손에
  lexicon: HALOT
  rationale: 히브리어 관용구 '손에'를 유지하되, 문맥상 포획·패배의 의미가 분명하므로 '적군의 손에'로 옮겨 전승된 관용을 살렸습니다.
- source_word: דָרְשׁוּ אֵת אֱלֹהֵי אֱדֽוֹם
  english_pob_choice: had sought the gods of Edom
  chosen_korean: 에돔의 신들을 찾았기 때문에
  alternatives_korean:
  - 에돔의 신들을 구했기 때문에
  - 에돔의 신들에게 의지했기 때문에
  lexicon: HALOT
  rationale: דרשׁ는 신을 상대로 한 종교적 '구함/찾음'의 의미가 있어, 우상 숭배의 행위를 과장하지 않으면서도 그 종교적 방향성을 보존하는 '찾았기 때문에'를 택했습니다.
theological_decisions:
- issue: 하나님 주권과 인간 책임의 긴장
  chosen_reading: 아마샤의 불순종과 패배가 '하나님에게서 난 일'이라고 직접 말하면서도, 그 원인을 에돔의 신들을 찾은 행위에 둡니다.
  alternative_readings:
  - 하나님의 단순 허용으로 완화하는 읽기
  - 인간 책임만 강조해 '하나님에게서'를 약화하는 읽기
  rationale: 히브리어는 원인과 목적을 함께 진술하므로, 두 요소를 모두 살려 긴장을 해소하지 않는 번역이 본문에 가장 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
