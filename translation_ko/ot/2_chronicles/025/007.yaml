  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
  footnotes:
  - marker: a
    text: Or “all the Ephraimites.” The Hebrew reads “all the sons of Ephraim.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 하나님의 사람이 그에게 와서 말했습니다. “왕이여, 이스라엘 군대를 왕과 함께 가게 하지 마십시오. 야훼께서는 이스라엘, 곧 에브라임의 모든 아들과 함께 계시지 않기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “에브라임 사람들 모두”. 히브리어에는 “에브라임의 모든 아들들”이라고 되어 있습니다.
    reason: lexical_alternative
