  rationale: 본문에 직접 나온 신명을 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 표제어 차이를 보존했습니다.
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  english_pob_choice: all the sons of Ephraim
  chosen_korean: 에브라임의 모든 아들들
  alternatives_korean:
