  text: וְ/אִ֣ישׁ הָ/אֱלֹהִ֗ים בָּ֤א אֵלָי/ו֙ לֵ/אמֹ֔ר הַ/מֶּ֕לֶךְ אַל יָבֹ֥א עִמְּ/ךָ֖ צְבָ֣א יִשְׂרָאֵ֑ל כִּ֣י אֵ֤ין יְהוָה֙ עִם יִשְׂרָאֵ֔ל כֹּ֖ל בְּנֵ֥י אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
  footnotes:
  - marker: a
    text: Or “all the Ephraimites.” The Hebrew reads “all the sons of Ephraim.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 하나님의 사람이 그에게 와서 말했습니다. “왕이여, 이스라엘의 군대가 당신과 함께 가지 못하게 하십시오. 왜냐하면 야훼께서 이스라엘과 함께하지 않으시기 때문입니다. 곧 에브라임의 모든 아들들과도 함께하지 않으십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “에브라임 사람들 모두”. 히브리어는 “에브라임의 모든 아들들”이라고 되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: a man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님께 속한 사람
  - 하나님의 종
  lexicon: HALOT
  rationale: 히브리어 관용구로서 단순한 ‘한 사람’보다 신적 위임을 받은 인물을 가리키므로, 한국어에서는 관용적인 ‘하나님의 사람’이 가장 자연스럽고 source-direct합니다.
- source_word: בָּא אֵלָיו
  english_pob_choice: came to him
  chosen_korean: 그에게 와서
  alternatives_korean:
  - 그에게 왔습니다
  - 그에게 다가와
  lexicon: HALOT
  rationale: אֶל-인 동작을 한국어 서술문에서 매끄럽게 살리기 위해 ‘그에게 와서’로 옮겼습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: O king
  chosen_korean: 왕이여
  alternatives_korean:
  - 임금님
  - 왕님
  lexicon: HALOT
  rationale: 직접 호칭의 호격을 분명히 드러내면서도 현대 문체에 맞는 공손한 직접 주소로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문에 직접 나온 신명을 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 표제어 차이를 보존했습니다.
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  english_pob_choice: all the sons of Ephraim
  chosen_korean: 에브라임의 모든 아들들
  alternatives_korean:
  - 에브라임 사람들 모두
  - 에브라임의 모든 자손
  lexicon: HALOT
  rationale: 히브리어의 ‘아들들’을 그대로 반영해 혈연/집단적 표현을 보존했으며, 필요하면 주석에서 더 관용적인 민족명으로 풀 수 있습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 이 절의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기적 선언이 아니라 고유한 신명 표지를 사용하므로, 주석 없이 일반 칭호로 완화하지 않고 고유명으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘이스라엘’과 ‘에브라임의 모든 아들들’의 관계
  chosen_reading: ‘이스라엘’과 ‘에브라임의 모든 아들들’을 병렬적으로 살려, 북이스라엘 전체를 에브라임으로 지칭하는 수사적 긴장을 유지했습니다.
  alternative_readings:
  - 에브라임 사람들 모두
  - 곧 에브라임 사람들 모두
  rationale: 히브리어는 마지막 절에서 같은 대상을 설명적으로 덧붙이며 범위를 좁히므로, 설명적 동격을 너무 매끈하게 합치지 않고 두 표현을 모두 보존했습니다.
  doctrine_reference: 텍스트의 민족-언약적 범위 표현
