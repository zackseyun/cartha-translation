  - 에브라임의 모든 자손
  lexicon: HALOT
  rationale: 히브리어의 ‘아들들’을 그대로 반영해 혈연/집단적 표현을 보존했으며, 필요하면 주석에서 더 관용적인 민족명으로 풀 수 있습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 이 절의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명기적 선언이 아니라 고유한 신명 표지를 사용하므로, 주석 없이 일반 칭호로 완화하지 않고 고유명으로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘이스라엘’과 ‘에브라임의 모든 아들들’의 관계
  chosen_reading: ‘이스라엘’과 ‘에브라임의 모든 아들들’을 병렬적으로 살려, 북이스라엘 전체를 에브라임으로 지칭하는 수사적 긴장을 유지했습니다.
  alternative_readings:
  - 에브라임 사람들 모두
  - 곧 에브라임 사람들 모두
  rationale: 히브리어는 마지막 절에서 같은 대상을 설명적으로 덧붙이며 범위를 좁히므로, 설명적 동격을 너무 매끈하게 합치지 않고 두 표현을 모두 보존했습니다.
  doctrine_reference: 텍스트의 민족-언약적 범위 표현
