base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
  footnotes:
  - marker: a
    text: Or, “let us meet face to face.” The Hebrew idiom is literally about seeing one another’s face and here likely signals a direct confrontation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다 왕 아마샤는 상의하고 이스라엘 왕, 여호아하스의 아들이요 예후의 손자인 요아스에게 사람을 보내어 말했습니다. “오시오, 우리가 서로 얼굴을 맞대어 봅시다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 직역하면 “서로의 얼굴을 보다”이며, 여기서는 직접 대면하거나 정면으로 맞서는 뜻을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  english_pob_choice: took counsel
  chosen_korean: 상의하고
  alternatives_korean:
  - 의논하고
  - 숙의하고
  lexicon: HALOT
  rationale: 상의를 통해 신중히 결정한 뒤 행동했다는 서술을 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: וַיִּשְׁלַח אֶל
  english_pob_choice: sent to
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보내어
  - 전하여
  lexicon: HALOT
  rationale: ‘보내다’의 기본 의미를 살리되, 한국어에서 명확한 목적어를 보완해 자연스럽게 표현했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르되
  - 말하여
  lexicon: HALOT
  rationale: 서술문 속 직접 화법의 도입으로 가장 자연스럽고 현대적인 표현을 택했습니다.
- source_word: נִתְרָאֶה פָנִים
  english_pob_choice: let us face one another
  chosen_korean: 우리가 서로 얼굴을 맞대어 봅시다
  alternatives_korean:
  - 우리 서로 얼굴을 대봅시다
  - 우리가 서로 마주봅시다
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴을 보다’ 관용구를 보존하면서, 단순한 만남보다 대결적 대면의 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: 직접 화법의 명령/초청 톤
  chosen_reading: “오시오, 우리가 서로 얼굴을 맞대어 봅시다.”
  alternative_readings:
  - “오라, 우리가 서로 대면하자.”
  - “오시오, 우리 서로 만나봅시다.”
  rationale: 왕들 사이의 도전적 초청이라는 문맥을 따라 공손한 형식의 초청이지만 실질적으로는 대결을 예고하는 톤을 유지했습니다.
  doctrine_reference: 서사 문맥에 따른 담화 톤 유지
