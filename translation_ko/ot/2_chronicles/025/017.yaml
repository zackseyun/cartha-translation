    issue: ‘사람을’을 본문에 보충함
    rationale: 히브리어는 ‘요아스에게 보냈다’라고만 하며 사절이나 사람을 명시하지 않습니다. 사절이 문맥상 암시될 수는 있어도 본문 번역에서는 보충하지 않는 편이 원문 충실성에 맞습니다.
  - severity: low
    issue: ‘서로 얼굴을 맞대어 보다’의 어색함과 의미 이동 가능성
    rationale: 이 표현은 물리적으로 얼굴을 가까이 맞대는 뜻으로도 들릴 수 있습니다. 원문의 ‘얼굴을 보다’ 관용구와 대결적 대면의 문맥에는 ‘서로 얼굴을 마주 보다’가 더 적절합니다.
