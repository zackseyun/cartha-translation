  to: 아마지야가 자신과 함께 전쟁에 나가지 못하게 하고 돌려보낸 그 부대의 사람들은 유다의 성읍들을[a] 사마리아에서 벧호론까지 습격하여, 그들 가운데 삼천 명을 쳐서 쓰러뜨리고 많은 전리품을 빼앗았습니다.[b]
  rationale: 아마지야와의 동행 관계 및 부대가 돌려보내진 이유를 분명히 하고, 원문의 군사 동사 נכה가 지닌 의미 범위를 본문과 각주에 나누어 보존했습니다. 지리 범위 각주도 원문의 기능에 맞게 수정했으며, 전리품은 ‘약탈하다’의 결과인 ‘빼앗다’로 자연스럽게 옮겼습니다.
