  text: וּ/בְנֵ֣י הַ/גְּד֗וּד אֲשֶׁ֨ר הֵשִׁ֤יב אֲמַצְיָ֨הוּ֙ מִ/לֶּ֤כֶת עִמּ/וֹ֙ לַ/מִּלְחָמָ֔ה וַֽ/יִּפְשְׁטוּ֙ בְּ/עָרֵ֣י יְהוּדָ֔ה מִ/שֹּׁמְר֖וֹן וְ/עַד בֵּ֣ית חוֹר֑וֹן וַ/יַּכּ֤וּ מֵ/הֶם֙ שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/יָּבֹ֖זּוּ בִּזָּ֥ה רַבָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
  footnotes:
  - marker: a
    text: Or 'from Samaria as far as Beth-horon.' The Hebrew expression marks the extent of the raid.
    reason: lexical_alternative
  - marker: b
    text: Or 'killed three thousand of them.' The Hebrew verb can be rendered more explicitly in a battle context.
    reason: lexical_alternative
translation:
  language: ko
  text: 아마지야가 그와 함께 전쟁에 나가는 것을 되돌려 보낸 그 부대의 사람들은 유다의 도시들을 사마리아에서부터 벧호론까지 습격하여 그들 가운데서 삼천 명을 죽이고 많은 전리품을 약탈했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사마리아에서부터 벧호론까지’는 약탈의 범위를 나타내는 표현일 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그들 가운데서 삼천 명을 죽이고’는 ‘삼천 명을 죽이다’ 또는 전투 맥락상 ‘삼천 명을 쓰러뜨리다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  english_pob_choice: the men of the troop
  chosen_korean: 그 부대의 사람들은
  alternatives_korean:
  - 그 무리의 아들들은
  - 그 습격대의 사람들은
  - 그 병사들은
  lexicon: HALOT
  rationale: 직역의 ‘아들들’은 한국어에서 어색하므로, 문맥상 군사 단위를 가리키는 ‘부대’로 자연스럽게 옮기되 구성원이라는 뜻을 살렸습니다.
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  english_pob_choice: whom Amaziah had sent back from going with him to battle
  chosen_korean: 아마지야가 그와 함께 전쟁에 나가는 것을 되돌려 보낸
  alternatives_korean:
  - 아마지야가 그와 함께 전쟁에 가는 것을 돌려보낸
  - 아마지야가 그와 함께 싸우러 가는 것을 보내지 않은
  lexicon: HALOT
  rationale: הֵשִׁיב의 사역적 의미를 살려 ‘되돌려 보낸’으로 옮겼고, מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה는 자연스럽게 ‘전쟁에 나가는 것’으로 표현했습니다.
- source_word: וַיִּפְשְׁטוּ בְּעָרֵי יְהוּדָה מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  english_pob_choice: raided the cities of Judah, from Samaria to Beth-horon
  chosen_korean: 유다의 도시들을 사마리아에서부터 벧호론까지 습격하여
  alternatives_korean:
  - 유다의 도시들을 사마리아에서 벧호론까지 습격하여
  - 유다의 도시들을 사마리아에서 벧호론에 이르기까지 공격하여
  lexicon: HALOT
  rationale: פּשט는 단순한 ‘공격’보다 약탈적 기습의 뉘앙스가 있어 ‘습격하다’로 옮겼고, מִן…וְעַד의 범위를 ‘에서부터 …까지’로 분명히 했습니다.
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  english_pob_choice: took much plunder
  chosen_korean: 많은 전리품을 약탈했습니다
  alternatives_korean:
  - 많은 노획물을 취했습니다
  - 많은 전리품을 가져갔습니다
  lexicon: HALOT
  rationale: 동족어 반복의 강조를 한국어에서는 자연스러운 결과 중심 표현인 ‘전리품을 약탈하다’로 풀어, 강한 약탈 행위를 드러냈습니다.
theological_decisions:
- issue: 전쟁 서술의 폭력 표현
  chosen_reading: ‘죽이고’와 ‘약탈했습니다’로 전투의 결과를 분명히 드러냈습니다.
  alternative_readings:
  - ‘쳐 죽이고’로 더 직설적으로 옮김
  - ‘죽게 하고’처럼 완화함
  rationale: 본문은 실제 사상과 약탈을 서술하므로, 의미를 약화시키지 않고 현대 한국어에서 명확하게 전달하는 표현을 택했습니다.
  doctrine_reference: 본문의 역사 서술을 과장하거나 완화하지 않는 원문 충실성
