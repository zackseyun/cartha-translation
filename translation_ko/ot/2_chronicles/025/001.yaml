  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a son of twenty-five years.'
    reason: lexical_alternative
  - marker: b
    text: Or 'began to reign' for 'became king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아마샤는 왕이 되었을 때 스물다섯 살이었고[a], 예루살렘에서 스물아홉 해 동안 다스렸습니다. 그의 어머니의 이름은 예호아단이었으며[b], 예루살렘 출신이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘스물다섯 해의 아들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘왕이 되었다’는 뜻으로, 문자적으로는 ‘다스리기 시작했다’도 가능합니다.
    reason: lexical_alternative
