  source_fidelity: 히브리어의 순서와 핵심 어휘를 충실히 반영합니다. וַיִּשָּׂאֻהוּ를 ‘그를 … 싣고’로, עַל הַסּוּסִים의 복수형을 ‘말들 위에’로, עִם אֲבֹתָיו라는 왕조적 장례 관용구를 ‘그의 조상들과 함께’로 옮겼습니다. 또한 בְּעִיר יְהוּדָה를 익숙한 ‘다윗 성’으로 조화시키지 않고 ‘유다의 성읍’으로 보존했습니다.
  naturalness: ‘그를 말들 위에 싣고 그의 조상들과 함께 유다의 성읍에 장사하였습니다’는 성경 서술문으로 자연스럽고 현대 표준어 합쇼체에 맞습니다. ‘말들 위에’라는 다소 낯선 표현은 원문의 명시적이고 다소 특이한 묘사를 보존하는 데 적절합니다.
  terminology: ‘조상들’은 여기서 ‘아버지들’이라는 히브리 장례 관용구의 왕조·가계적 의미를 자연스럽게 전달합니다. ‘장사하였습니다’도 장례·매장 문맥에 적합한 격식 있는 표현입니다. ‘유다의 성읍’은 MT의 표현을 그대로 따릅니다.
