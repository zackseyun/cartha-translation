  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
  footnotes:
  - marker: a
    text: Or, more formally, 'upon the horses.' The Hebrew explicitly mentions horses in the plural.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 말들 위에 싣고 그의 조상들과 함께 유다의 성읍에 장사하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 '말들'의 복수를 분명히 밝힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  english_pob_choice: They carried him
  chosen_korean: 그를 말들 위에 싣고
  alternatives_korean:
  - 그를 실어 나르고
  - 그를 메고
  lexicon: HALOT
  rationale: נשא의 수동적 이동 의미를 한국어 자연문으로 옮기되, 시신을 운반하는 상황에 맞게 '싣고'를 택했습니다.
- source_word: עַל הַסּוּסִים
  english_pob_choice: on horses
  chosen_korean: 말들 위에
  alternatives_korean:
  - 말 위에
  - 말들에
  lexicon: HALOT
  rationale: 히브리어가 복수형 '말들'을 분명히 말하므로 복수를 살렸고, 영어 주해와 마찬가지로 말이라는 이미지를 직접 반영했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 직역하면 '그의 아버지들과 함께'이지만, 장례 관용구로서의 dynastic 의미를 살리기 위해 '조상들'로 옮겼습니다.
- source_word: בְּעִיר יְהוּדָה
  english_pob_choice: in the city of Judah
  chosen_korean: 유다의 성읍에
  alternatives_korean:
  - 유다 성읍에
  - 유다의 도시에서
  lexicon: HALOT
  rationale: 본문이 '유다의 성읍'이라고 말하므로, 익숙한 다른 표현으로 조정하지 않고 원문 질서를 따라 옮겼습니다.
theological_decisions:
- issue: 장례 위치 표현을 평행본문과 조화시킬지 여부
  chosen_reading: 본문의 '유다의 성읍'을 그대로 유지했습니다.
  alternative_readings:
  - '''다윗 성''으로 이해하기'
  - '''유다에''로 일반화하기'
  rationale: 이 구절은 교리 논쟁이 아니라 본문 보존의 문제이므로, 더 익숙한 표현으로 동화시키지 않고 MT의 어휘를 유지했습니다.
  doctrine_reference: 원문 우선 번역 원칙; 평행본문 조화보다 현 본문 보존 우선
