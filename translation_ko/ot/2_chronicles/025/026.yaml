translation:
  language: ko
  text: 아마샤의 남은 행적, 곧 처음부터 마지막까지의 모든 일은 유다와 이스라엘 왕들의 책에[a] 기록되어 있지 않습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘책 위에’라는 표현은 한국어 관용상 ‘책에 기록되어’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어를 더 직역하면 ‘아마샤의 남은 말들/일들, 처음 것들과 마지막 것들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 남은 행적
  alternatives_korean:
