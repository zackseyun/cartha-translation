  rationale: 직역하면 ‘말들’이지만, 열왕기·역대기의 왕 결산 공식에서는 인물의 사건과 행위를 가리키므로 ‘행적’이 가장 정확합니다.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  english_pob_choice: from first to last
  chosen_korean: 처음부터 마지막까지
