  - 처음 것들과 나중 것들
  lexicon: HALOT
  rationale: 이 대구는 생애 전체를 가리키는 관용구이므로, 한국어에서는 ‘처음부터 마지막까지’가 총체적 의미를 가장 자연스럽게 전달합니다.
- source_word: סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  english_pob_choice: the Book of the Kings of Judah and Israel
  chosen_korean: 유다와 이스라엘 왕들의 책
  alternatives_korean:
  - 유다와 이스라엘 왕들의 기록책
  - 유다와 이스라엘 왕들의 책에
  lexicon: HALOT
  rationale: 원문의 סֵפֶר는 문헌명이며, 한국어에서는 제목형 표현으로 ‘...왕들의 책’이 가장 सीधे하며, שייך 관계를 그대로 살립니다.
theological_decisions:
- issue: 역사 보고문체의 수사 의문문 처리
  chosen_reading: 질문 형식이지만 실제로는 ‘기록되어 있다’는 긍정적 진술을 전제하므로, 한국어도 반어적 의문으로 유지했습니다.
  alternative_readings:
