translation:
  language: ko
  text: 아마샤의 남은 행적, 곧 처음부터 마지막까지의 행적이 유다와 이스라엘 왕들의 책에 기록되어 있지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아마샤의 말들/행적, 곧 처음과 마지막’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 ‘책 위에’라는 표현은 한국어 관용상 ‘책에 기록되어’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 남은 행적
  alternatives_korean:
  - 나머지 일
  - 남은 일들
  lexicon: HALOT
  rationale: 왕의 회고적 종결 공식에서 יֶתֶר은 단순한 ‘나머지’보다 앞선 기록에 이어지는 ‘남은 행적’이 자연스럽고, דִּבְרֵי와 결합한 역사 서술의 의미를 살립니다.
- source_word: דִּבְרֵי
  english_pob_choice: the acts of
  chosen_korean: 행적
  alternatives_korean:
  - 말들
  - 일들
  - 행동들
  lexicon: HALOT
  rationale: 직역하면 ‘말들’이지만, 열왕기·역대기의 왕 결산 공식에서는 인물의 사건과 행위를 가리키므로 ‘행적’이 가장 정확합니다.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  english_pob_choice: from first to last
  chosen_korean: 처음부터 마지막까지
  alternatives_korean:
  - 먼저 것과 나중 것
  - 처음 것들과 나중 것들
  lexicon: HALOT
  rationale: 이 대구는 생애 전체를 가리키는 관용구이므로, 한국어에서는 ‘처음부터 마지막까지’가 총체적 의미를 가장 자연스럽게 전달합니다.
- source_word: סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  english_pob_choice: the Book of the Kings of Judah and Israel
  chosen_korean: 유다와 이스라엘 왕들의 책
  alternatives_korean:
  - 유다와 이스라엘 왕들의 기록책
  - 유다와 이스라엘 왕들의 책에
  lexicon: HALOT
  rationale: 원문의 סֵפֶר는 문헌명이며, 한국어에서는 제목형 표현으로 ‘...왕들의 책’이 가장 सीधे하며, שייך 관계를 그대로 살립니다.
theological_decisions:
- issue: 역사 보고문체의 수사 의문문 처리
  chosen_reading: 질문 형식이지만 실제로는 ‘기록되어 있다’는 긍정적 진술을 전제하므로, 한국어도 반어적 의문으로 유지했습니다.
  alternative_readings:
  - '직설형: ‘...책에 기록되어 있습니다.’'
  - '감탄형: ‘...책에 기록되어 있지요!’'
  rationale: הֲלֹא는 확인을 요구하는 수사 의문이므로, 평서로 평탄화하면 원문의 문체적 힘이 약해집니다.
  doctrine_reference: 역대기 결말 공식의 수사 의문 보존
