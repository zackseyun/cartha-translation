id: 2CH.25.12
reference: 2 Chronicles 25:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים חַיִּ֗ים שָׁבוּ֙ בְּנֵ֣י יְהוּדָ֔ה וַ/יְבִיא֖וּ/ם לְ/רֹ֣אשׁ הַ/סָּ֑לַע וַ/יַּשְׁלִיכ֛וּ/ם מֵֽ/רֹאשׁ הַ/סֶּ֖לַע וְ/כֻלָּ֥/ם נִבְקָֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
  footnotes:
  - marker: a
    text: Or 'the rock' or 'the crag' for 'the cliff' (Hebrew selaʿ).
    reason: lexical_alternative
  - marker: b
    text: Literally, 'all of them were split open' or 'broken apart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 자손은 살아 있는 만 명을 사로잡아 그들을 절벽[a] 꼭대기로 데려가서, 그 절벽 꼭대기에서 그들을 내던졌으며, 그들 모두가 산산이 부서졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바위’나 ‘암벽’으로 옮길 수 있습니다. 히브리어 셀라(סֶלַע)는 여기서 절벽 또는 바위 절벽을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들 모두가 갈라졌다’ 또는 ‘쪼개졌다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ + חַיִּים
  english_pob_choice: captured alive
  chosen_korean: 살아 있는 …를 사로잡다
  alternatives_korean:
  - 생포하다
  - 산 채로 붙잡다
  lexicon: HALOT
  rationale: 전투 맥락에서 단순한 ‘붙잡다’보다 살아 있는 포로로 잡았다는 뜻을 분명히 하도록 ‘살아 있는’과 ‘사로잡다’를 함께 살렸습니다.
- source_word: לְרֹאשׁ הַסָּלַע / מֵרֹאשׁ הַסֶּלַע
  english_pob_choice: to/from the top of the cliff
  chosen_korean: 바위 꼭대기
  alternatives_korean:
  - 절벽 꼭대기
  - 바위산 꼭대기
  lexicon: HALOT
  rationale: סֶלַע는 단순한 돌보다 바위 절벽·암벽을 가리키는 경우가 많아, 높은 지형의 꼭대기라는 장면을 자연스럽게 드러내는 ‘바위 꼭대기’로 옮겼습니다.
- source_word: וַיַּשְׁלִיכוּם
  english_pob_choice: threw them down
  chosen_korean: 그들을 던져 떨어뜨렸으며
  alternatives_korean:
  - 그들을 내던졌으며
  - 그들을 아래로 던졌으며
  lexicon: HALOT
  rationale: שלך의 ‘던지다/내던지다’ 의미를 살리되, 뒤따르는 ‘from the top of the cliff’와 결합된 하강 동작을 한국어로 분명히 하기 위해 ‘떨어뜨리다’를 보탰습니다.
- source_word: נִבְקָעוּ
  english_pob_choice: were dashed to pieces
  chosen_korean: 산산이 부서졌습니다
  alternatives_korean:
  - 산산조각 났습니다
  - 갈라져 버렸습니다
  lexicon: HALOT
  rationale: בקע의 ‘갈라지다/쪼개지다’ 의미를 폭력적 결과에 맞게 자연스러운 현대 한국어로 옮기되, 너무 완곡하지 않게 ‘산산이 부서지다’로 처리했습니다.
theological_decisions:
- issue: 본문의 폭력적 묘사 강도
  chosen_reading: 원문의 처형 장면을 완화하지 않고 그대로 드러내는 쪽을 택했습니다.
  alternative_readings:
  - ‘죽였습니다’처럼 일반화하여 완곡하게 옮김
  - ‘산산조각’ 등 더 강한 구어체로 과장
  rationale: 히브리어 서술은 포로를 절벽에서 떨어뜨려 완전히 부서지게 되는 장면을 직접적으로 말하므로, 독자의 충격을 줄이기보다 본문의 역사적·서사적 강도를 유지했습니다.
  doctrine_reference: 본문 충실성 및 서사 텍스트의 직접적 묘사 유지
