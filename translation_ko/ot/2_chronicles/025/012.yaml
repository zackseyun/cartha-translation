revisions:
- from: 유다 자손은 살아 있는 만 명을 사로잡아 그들을 바위 꼭대기로 데려가서 바위 꼭대기에서 그들을 던져 떨어뜨렸으며, 그들 모두는 산산이 부서졌습니다.[a][b]
  to: 유다 자손은 살아 있는 만 명을 사로잡아 그들을 절벽[a] 꼭대기로 데려가서, 그 절벽 꼭대기에서 그들을 내던졌으며, 그들 모두가 산산이 부서졌습니다.[b]
  rationale: ‘절벽’으로 지형 의미를 명확히 하고, 중첩된 동작 표현을 ‘내던졌으며’로 다듬었습니다. 또한 두 각주를 각각 관련 본문 어휘에 연결했습니다. 원문의 접속 관계는 결과나 목적을 덧붙이지 않고 ‘~으며’로 유지했습니다.
