base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
  footnotes:
  - marker: a
    text: Or 'the people/descendants of Seir.' The Hebrew reads 'the sons of Seir,' an ethnic-genealogical expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아마샤가 힘을 내어 자기 백성을 거느리고 소금 골짜기로 가서 세일의 아들들 만 명을 쳐서 쓰러뜨렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘세일의 아들들’입니다. 이는 혈연을 가리키기보다 민족·족속 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזַּק
  english_pob_choice: strengthened himself
  chosen_korean: 힘을 내어
  alternatives_korean:
  - 스스로 강해져
  - 마음을 굳게 먹고
  - 용기를 내어
  lexicon: HALOT
  rationale: 히트파엘의 반사적·내적 강화 의미를 살리면서, 한국어에서 자연스럽고 군사 문맥에도 맞는 표현으로 옮겼습니다.
- source_word: וַיִּנְהַג אֶת עַמּוֹ
  english_pob_choice: led his people
  chosen_korean: 자기 백성을 거느리고
