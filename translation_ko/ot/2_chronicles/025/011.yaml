- source_word: וַיִּנְהַג אֶת עַמּוֹ
  english_pob_choice: led his people
  chosen_korean: 자기 백성을 거느리고
  alternatives_korean:
  - 자기 백성을 이끌고
  - 자기 백성을 몰고
  - 자기 백성을 인솔하고
  lexicon: HALOT
  rationale: נהג는 ‘이끌다/인도하다/몰다’의 폭이 있어, 군사적 이동을 드러내되 과도하게 동물 몰이처럼 들리지 않도록 ‘거느리고’를 택했습니다.
- source_word: גֵּיא הַמֶּלַח
  english_pob_choice: the Valley of Salt
  chosen_korean: 소금 골짜기
  alternatives_korean:
  - 소금 계곡
  - 소금 골짜기
  lexicon: HALOT
  rationale: 지명 구성요소를 직접 반영해 투명하게 옮겼고, 한국어 지명 표현으로는 ‘골짜기’가 가장 무난합니다.
- source_word: בְּנֵי שֵׂעִיר
  english_pob_choice: the sons of Seir
  chosen_korean: 세일의 아들들
  alternatives_korean:
  - 세일 사람들
  - 세일의 후손들
  - 세일의 백성
  lexicon: HALOT
  rationale: 히브리어의 친족·민족적 관용구를 보존해, 단순한 지리명보다 족속 표지를 드러내는 원문의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 전투 서술의 동사 강도
  chosen_reading: ‘쳐서 쓰러뜨렸습니다’로 옮겨, מלחמה 서술의 실제 타격성과 결과를 드러냈습니다.
  alternative_readings:
  - ‘무찔렀습니다’
  - ‘죽였습니다’
  - ‘쳤습니다’
  rationale: וַיַּךְ는 문맥상 단순 타격보다 전투적 격파를 가리키지만, 본문이 이미 사상자 수를 제시하므로 지나치게 단정적인 ‘죽였습니다’보다 결과를 열어 둔 표현이 적절합니다.
  doctrine_reference: '서사 본문 번역 원칙: 문맥이 허용하는 범위 안에서 전투 행위와 결과를 모두 드러냄'
