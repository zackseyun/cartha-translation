  source_fidelity: 원문의 동사 וַיִּשְׂכֹּר는 ‘고용했다’로 정확히 옮겼고, מִיִּשְׂרָאֵל, מֵאָה אֶלֶף, גִּבּוֹר חָיִל도 충실히 반영했습니다. 다만 בְּמֵאָה כִכַּר כָּסֶף는 고용의 대가로 지불한 액수를 뜻하므로, 한국어에서는 ‘은 백 달란트에’보다 ‘은 백 달란트를 주고’가 지불 관계를 더 분명하게 나타냅니다.
  naturalness: ‘용맹한 전사 십만 명’과 ‘고용했습니다’는 자연스러운 현대 표준어 합쇼체입니다. ‘은 백 달란트를 주고’로 바꾸면 비용을 나타내는 연결도 더 자연스럽고 오해의 여지가 줄어듭니다.
  terminology: ‘이스라엘’, ‘달란트’, ‘용맹한 전사’는 적절합니다. ‘달란트’는 고대 중량·화폐 단위로 음역을 유지하는 것이 적절합니다. 각주에는 번역어의 가능한 대안을 명시하여 lexical_alternative 표지의 기능을 분명히 하는 편이 좋습니다.
