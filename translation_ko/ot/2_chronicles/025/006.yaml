id: 2CH.25.6
reference: 2 Chronicles 25:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׂכֹּ֣ר מִ/יִּשְׂרָאֵ֗ל מֵ֥אָה אֶ֛לֶף גִּבּ֥וֹר חָ֖יִל בְּ/מֵאָ֥ה כִכַּר כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/006.yaml
  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
  footnotes:
  - marker: a
    text: Or 'valiant warriors' or 'mighty warriors.' The Hebrew expression denotes capable fighting men.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이스라엘에서 용맹한 전사 십만 명을 은 백 달란트에 고용했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 능력 있는 전투병, 곧 용맹한 전사들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  english_pob_choice: he hired
  chosen_korean: 고용했습니다
  alternatives_korean:
  - 고용하였습니다
  - 삯을 주고 데려왔습니다
  lexicon: HALOT
  rationale: שׂכר의 기본 의미인 ‘임금을 주고 고용하다’를 자연스럽게 살렸습니다. 여기서는 단순히 ‘사왔다’보다 인력 고용의 뉘앙스가 분명합니다.
- source_word: גִּבּוֹר חָיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 전사
  alternatives_korean:
  - 용사
  - 힘센 전사들
  - 용맹한 군사
  lexicon: HALOT
  rationale: 이 결합어는 단순한 ‘힘센 사람’보다 전투 능력과 용맹을 함께 가리키므로, 한국어로는 군사적 의미가 분명한 ‘용맹한 전사’로 옮겼습니다.
- source_word: כִכַּר כָּסֶף
  english_pob_choice: talents of silver
  chosen_korean: 은 백 달란트
  alternatives_korean:
  - 은 일백 달란트
  - 은 백 달란트 상당의 돈
  lexicon: HALOT
  rationale: כִּכָּר는 고대 중량 단위 ‘달란트’에 해당하므로 음역을 유지했습니다. כסף는 통화가 아니라 은 재화를 가리키므로 ‘은 백 달란트’로 처리했습니다.
theological_decisions:
- issue: 인력의 성격을 ‘mercenaries’로 명시할지 여부
  chosen_reading: 본문은 ‘고용했다’는 사실만 말하고, ‘용병’이라는 평가는 직접적으로 붙이지 않았습니다.
  alternative_readings:
  - 용병들을 고용했습니다
  - 전투 용병을 삯 주고 데려왔습니다
  rationale: 영어 POB도 ‘mercenaries’를 해석적으로 덧붙이지 않고 단순한 고용을 택했습니다. 원문의 서술을 넘지 않도록 유지했습니다.
  doctrine_reference: 원문 충실성 / 과잉해석 방지
