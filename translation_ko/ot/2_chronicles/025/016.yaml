base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
  footnotes:
  - marker: a
    text: Or, 'Have we appointed you as an adviser to the king?'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'why should they strike you?' The subject is an unspecified plural, likely referring to those who would punish him at the king’s command.
    reason: lexical_alternative
  - marker: c
    text: Or, 'God has purposed/planned to destroy you.' The Hebrew verb literally relates to counsel or planning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말하고 있을 때에 왕이 그에게 이르렀습니다. 「우리가 너를 왕의 조언자로 세웠느냐? 그만두어라! 어째서 네가 얻어맞아야 하겠느냐?」 그러자 예언자가 그치고 말했습니다. 「하나님께서 너를 멸망시키기로 정하신 줄 내가 압니다. 이는 네가 이런 일을 행하고 내 조언을 듣지 않았기 때문입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세웠느냐’는 직무 임명을 드러내는 번역입니다. 히브리어는 ‘만들다/두다/세우다’의 의미 범위를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘얻어맞아야 하겠느냐’는 히브리어의 ‘그들이 너를 칠 것이다’라는 불특정 복수 주어를 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사 יָעַץ는 ‘조언하다’뿐 아니라 ‘계획하다/정하다’의 뜻도 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְיוֹעֵ֤ץ לַמֶּ֨לֶךְ֙ / הַלְיוֹעֵץ
  english_pob_choice: the king’s adviser
  chosen_korean: 왕의 조언자
  alternatives_korean:
  - 왕의 참모
  - 왕의 상담자
  - 왕의 모사
  lexicon: HALOT
  rationale: 왕에게 붙는 직무명으로서 ‘조언자’가 현대 한국어에서 가장 자연스럽고, 히브리어의 상담/자문 역할도 잘 드러냅니다. ‘모사’는 전통적이지만 문어체 성격이 강해 합쇼체 본문에서는 덜 직접적입니다.
- source_word: נְתַנּוּךָ
  english_pob_choice: Have we made you
  chosen_korean: 우리가 너를 … 세웠느냐
  alternatives_korean:
  - 우리가 너를 … 만들었느냐
  - 우리가 너를 … 임명했느냐
  - 우리가 너를 … 정했느냐
  lexicon: HALOT
  rationale: נתן의 문맥상 ‘직분을 부여하다/세우다’의 의미를 살려, 단순한 존재론적 ‘만들다’보다 직무 임명에 가까운 ‘세우다’를 택했습니다.
- source_word: חֲדַל
  english_pob_choice: Stop!
  chosen_korean: 그만두어라
  alternatives_korean:
  - 멈추어라
  - 그치어라
  - 그만하라
  lexicon: HALOT
  rationale: 예언자에게 발화 중지를 명하는 강한 명령으로, 현대 한국어에서 자연스럽고 단호한 표현인 ‘그만두어라’를 사용했습니다.
- source_word: לָמָּה יַכּוּךָ
  english_pob_choice: Why should they strike you down?
  chosen_korean: 어째서 네가 얻어맞아야 하겠느냐
  alternatives_korean:
  - 어째서 그들이 너를 치겠느냐
  - 왜 너를 치려 하느냐
  - 어째서 네가 맞아야 하겠느냐
  lexicon: HALOT
  rationale: 히브리어의 불특정 복수 주어와 위협적 뉘앙스를 살리면서도, 한국어에서는 수동형으로 더 자연스럽게 들리는 ‘얻어맞아야 하겠느냐’로 옮겼습니다.
- source_word: יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ
  english_pob_choice: God has determined to destroy you
  chosen_korean: 하나님께서 너를 멸망시키기로 정하신 줄
  alternatives_korean:
  - 하나님께서 너를 멸망시키기로 계획하신 줄
  - 하나님께서 너를 멸망시키도록 뜻하신 줄
  - 하나님께서 너를 파멸시키기로 작정하신 줄
  lexicon: HALOT
  rationale: יעץ의 ‘상담/계획/의도’ 범위를 살리되, 선고된 심판의 확정성을 드러내기 위해 ‘정하신 줄’로 번역했습니다. ‘멸망’은 שׁחת의 직접적인 파괴 의미를 보존합니다.
- source_word: לַעֲצָתִי
  english_pob_choice: my counsel
  chosen_korean: 내 조언
  alternatives_korean:
  - 내 상담
  - 내 충고
  - 내 권면
  lexicon: HALOT
  rationale: 앞의 ‘조언자’와 어근 연결을 유지하면서, 예언자의 발언을 현대 한국어에서 가장 이해하기 쉬운 ‘조언’으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 악을 일으키는 것처럼 들릴 수 있는 표현인 יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ
  chosen_reading: 하나님께서 너를 멸망시키기로 정하신 줄
  alternative_readings:
  - 하나님께서 너를 멸망시키도록 뜻하신 줄
  - 하나님께서 너를 멸망시키기로 계획하신 줄
  rationale: 본문의 심판 선언을 약화하지 않고, 하나님이 이 상황에서 실제로 파멸을 결정하셨다는 긴장을 그대로 보존했습니다. 본문이 허용하는 범위를 넘어서 원인론을 설명하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
