base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: Now it happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
  footnotes:
  - marker: a
    text: Or 'the gods of the people of Seir.' The Hebrew reads 'the gods of the sons of Seir.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he prostrated himself before them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'after Amaziah came from striking down the Edomites'.
    reason: previous_rendering
translation:
  language: ko
  text: 아마샤가 에돔 사람들을 쳐서 돌아온 뒤에, 그는 세일의 신들을 가져다가 자기의 신들로 삼아 세우고, 그들 앞에 엎드려 절하며 그들에게 분향했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세일의 아들들’로도 옮길 수 있으나, 히브리어의 친족 표현을 한국어에서는 보통 ‘세일 사람들’로 자연화할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘엎드려 절하다’는 히브리어 השתחוה의 동작을 살린 번역이며, 예배적 의미는 문맥이 뒷받침합니다.
    reason: lexical_alternative
  - marker: c
    text: 본문의 동사 연쇄는 사건의 순서를 분명히 하므로, ‘돌아온 뒤에’로 이해해도 됩니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא
  english_pob_choice: Now it happened, after ... came
  chosen_korean: '...한 뒤에'
  alternatives_korean:
  - '...한 후에'
  - '...에서 돌아온 뒤에'
  lexicon: HALOT
  rationale: wayyiqtol로 시작하는 서술 전환과 뒤이은 시간 부사를 자연스럽게 현대 한국어로 옮기되, 사건의 선후 관계를 분명히 드러내기 위해 ‘뒤에’를 사용했습니다.
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  english_pob_choice: from striking down the Edomites
  chosen_korean: 에돔 사람들을 쳐서
  alternatives_korean:
  - 에돔 사람들을 무찔러서
  - 에돔 사람들을 쳐부수고
  lexicon: HALOT
  rationale: נכה의 직접적 의미를 살려 ‘치다’ 계열로 옮겼고, 완료된 전투 행위를 자연스럽게 표현하기 위해 연결어미 ‘-서’를 사용했습니다.
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  english_pob_choice: the gods of the sons of Seir
  chosen_korean: 세일의 신들
  alternatives_korean:
  - 세일 사람들의 신들
  - 세일의 아들들의 신들
  lexicon: HALOT
  rationale: 문맥상 우상 숭배의 대상이므로 복수형 ‘신들’로 옮겼고, בְּנֵי שֵׂעִיר는 한국어에서 가장 덜 어색한 소유 구문으로 압축했습니다.
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  english_pob_choice: set them up for himself as gods
  chosen_korean: 자기의 신들로 삼아 세우고
  alternatives_korean:
  - 자기에게 신들로 세우고
  - 그것들을 신들로 두고
  lexicon: HALOT
  rationale: ‘세우다’는 우상의 설치를, ‘삼다’는 그것을 자기 신으로 채택한 의미를 함께 담아 원문의 물리적·관계적 의미를 모두 보존합니다.
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה וְלָהֶם יְקַטֵּר
  english_pob_choice: before them he bowed down, and to them he burned incense
  chosen_korean: 그들 앞에 엎드려 절하며 그들에게 분향했습니다
  alternatives_korean:
  - 그들 앞에 절하며 그들에게 향을 피웠습니다
  - 그들 앞에 몸을 굽혀 그들에게 분향했습니다
  lexicon: HALOT
  rationale: ישׁתחוה는 단순한 예배보다 몸을 낮추는 동작을 포함하므로 ‘엎드려 절하다’로 옮겼고, קטר는 제의적 행위를 드러내는 ‘분향하다’로 번역했습니다.
theological_decisions:
- issue: 우상 숭배 서술에서 אֱלֹהִים의 한국어 처리
  chosen_reading: ‘신들’로 번역하여 아마샤의 배교와 아이러니를 분명히 드러냅니다.
  alternative_readings:
  - ‘하나님들’
  - ‘신적 존재들’
  rationale: 본문은 야훼가 아니라 이방 우상들을 가리키므로, 한국어에서도 일반적으로 이해되는 복수 명사 ‘신들’이 가장 직접적이며 문맥의 비판적 뉘앙스를 살립니다.
  doctrine_reference: 열왕기/역대기의 우상 숭배 비판 서술
