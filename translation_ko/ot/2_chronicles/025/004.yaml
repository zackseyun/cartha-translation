source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶ֖ם לֹ֣א הֵמִ֑ית כִּ֣י כַ/כָּת֣וּב בַּ/תּוֹרָ֡ה בְּ/סֵ֣פֶר מֹשֶׁה֩ אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יָמ֨וּתוּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יָמ֣וּתוּ עַל אָב֔וֹת כִּ֛י אִ֥ישׁ בְּ/חֶטְא֖/וֹ יָמֽוּתוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
  footnotes:
  - marker: a
    text: Or, more literally, “fathers shall not die for sons, and sons shall not die for fathers.” The Hebrew legal idiom is rendered in the main text as “be put to death” to make the judicial sense clear.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 그들의 아들들을 죽이지 않았습니다[a]. 이는 율법, 곧 모세의 책에 기록되어 있기 때문입니다. 야훼께서 말씀하시기를, “아버지들은 아들들 때문에 죽임을 당해서는 안 되고, 아들들도 아버지들 때문에 죽임을 당해서는 안 된다. 오직 각 사람은 자기 죄 때문에 죽어야 한다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “아버지들은 아들들 때문에 죽지 않고, 아들들도 아버지들 때문에 죽지 않는다”입니다. 히브리어 법률 관용구를 본문에서는 사법적 의미가 분명하도록 “죽임을 당하다”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת בְּנֵי/הֶם
  english_pob_choice: But ... their sons
  chosen_korean: 그러나 ... 그들의 아들들을
  alternatives_korean:
  - 그리고 ... 그들의 아들들을
  - 그런데 ... 그들의 자녀들을
  lexicon: HALOT
  rationale: 앞 절의 처형과 대비되는 전환이므로 ‘그러나’가 적절합니다. בְּנֵיהֶם은 문자적으로 ‘그들의 아들들’이므로, 법적 문맥의 남성 복수를 살려 ‘아들들’을 유지했습니다.
- source_word: לֹא הֵמִית
  english_pob_choice: he did not put to death
  chosen_korean: 죽이지 않았습니다
  alternatives_korean:
  - 죽음에 넘기지 않았습니다
  - 처형하지 않았습니다
  lexicon: HALOT
  rationale: 히필의 법적·사법적 의미는 유지하되, 한국어에서는 자연스럽고 직접적인 ‘죽이지 않았습니다’가 가장 무난합니다. 다만 1절의 재판/집행 맥락이 분명하므로 법적 뉘앙스가 흐려지지 않도록 했습니다.
- source_word: בַּ/תּוֹרָה בְּ/סֵפֶר מֹשֶׁה
  english_pob_choice: in the Law, in the Book of Moses
  chosen_korean: 율법, 곧 모세의 책에
  alternatives_korean:
  - 율법에, 곧 모세의 책에
  - 율법, 모세의 책에
  lexicon: HALOT
  rationale: תּוֹרָה는 본문 인용의 법적 권위를 살려 ‘율법’으로 옮겼고, בְּסֵפֶר מֹשֶׁה는 고유한 서지적 표현으로 ‘모세의 책’이라 했습니다. ‘곧’은 뒤의 설명적 동격을 자연스럽게 연결합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 이 본문은 하나님의 언약명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다. 이는 일반 호칭 ‘주님’과 구별하여 원문 고유성을 드러냅니다.
- source_word: יָמ֨וּתוּ אָב֤וֹת ... וּ/בָנִים֙ ... יָמ֣וּתוּ
  english_pob_choice: Fathers shall not be put to death for sons ... and sons shall not be put to death for fathers
  chosen_korean: 아버지들은 아들들 때문에 죽임을 당해서는 안 되고, 아들들도 아버지들 때문에 죽임을 당해서는 안 된다
  alternatives_korean:
  - 아버지들은 아들들 때문에 죽어서는 안 되고, 아들들도 아버지들 때문에 죽어서는 안 된다
  - 아버지들은 아들들에 대해 죽임을 당해서는 안 되고, 아들들도 아버지들에 대해 죽임을 당해서는 안 된다
  lexicon: HALOT
  rationale: 히브리어의 사법적 관용구를 한국어로는 ‘죽임을 당하다’로 옮겨 판결/집행의 의미를 분명히 했습니다. ‘때문에’는 עַל의 책임 귀속을 자연스럽게 나타냅니다.
- source_word: אִ֥ישׁ בְּ/חֶטְא֖/וֹ
  english_pob_choice: each man ... for his own sin
  chosen_korean: 오직 각 사람은 자기 죄 때문에
  alternatives_korean:
  - 오직 각 사람은 자기 죄로 인해
  - 그러나 사람마다 자기 죄 때문에
  lexicon: HALOT
  rationale: אִישׁ은 일반적 대표 단수이므로 ‘각 사람’으로 풀어 distributive 의미를 살렸습니다. בְּחֶטְאוֹ는 책임의 근거를 분명히 하여 ‘자기 죄 때문에’로 옮겼습니다.
theological_decisions:
- issue: 불특정 법적 진술을 인용하는 형식과 하나님의 명령 표지
  chosen_reading: 본문의 인용부는 단순한 옛 법문이 아니라 야훼께서 모세를 통해 명하신 규범으로 제시했습니다.
  alternative_readings:
  - 인용문을 그냥 옛 법규로만 처리하는 번역
  - ‘여호와’로 일반적 교회어법에 맞추는 번역
  rationale: 본문은 ‘율법, 모세의 책, 야훼께서 말씀하시기를’의 삼중 장치를 통해 인용 권위를 강조합니다. 이를 그대로 드러내야 책임 귀속이 분명해집니다.
  doctrine_reference: Source-text legal authority / covenant name usage
