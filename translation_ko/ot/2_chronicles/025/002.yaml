base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
  footnotes:
  - marker: a
    text: Or 'not with a perfect heart' or 'not wholeheartedly.' The Hebrew says 'not with a whole/complete heart,' referring to incomplete devotion.
