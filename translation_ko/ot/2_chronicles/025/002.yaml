translation:
  language: ko
  text: 그는 야훼 보시기에 옳은 일을 행하였으나, 온전한 마음으로는 하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘완전한 마음으로 하지 않았다’, ‘전심으로 하지 않았다’. 히브리어는 ‘온전한/완전한 마음으로 하지 않았다’라는 뜻이며, 헌신이 온전하지 않았음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He did
  chosen_korean: 행하였습니다
  alternatives_korean:
  - 하였습니다
  - 했습니다
  lexicon: HALOT
  rationale: 서술적 과거를 자연스러운 현대 한국어 동사로 풀어, 단순 사실 진술을 유지했습니다.
- source_word: הַיָּשָׁר
  english_pob_choice: what was right
  chosen_korean: 옳은 일
  alternatives_korean:
  - 바른 일
  - 의로운 일
  - 옳은 것
  lexicon: HALOT
  rationale: 히브리어의 실질적 의미인 도덕적·종교적 ‘옳음’을 간결하게 살리되, 본문이 사물명사처럼 쓰인 느낌을 한국어에서 자연스럽게 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  - 야훼 보기에
  lexicon: HALOT
  rationale: 평가를 뜻하는 관용구를 직역에 가깝게 살리면서도 한국어 문체에서는 ‘보시기에’가 가장 자연스럽고 공손합니다.
- source_word: בְּלֵבָב שָׁלֵם
  english_pob_choice: with a whole heart
  chosen_korean: 온전한 마음으로
  alternatives_korean:
  - 완전한 마음으로
  - 온 마음으로
  - 온전하고 완전한 마음으로
  lexicon: HALOT
  rationale: 히브리어가 말하는 ‘완전/충만한 내적 헌신’을 한국어에서 ‘온전한 마음’으로 옮겨, 단순 감정이 아니라 내적 충성의 결핍을 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유 신명으로 직접 표기해, 호칭으로 바꾸지 않고 언약 이름의 의미를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘온전한 마음’의 함의
  chosen_reading: 온전한 마음으로는 하지 않았습니다
  alternative_readings:
  - 완전한 마음으로는 하지 않았습니다
  - 진심으로 하지 않았습니다
  - 전심으로 하지 않았습니다
  rationale: 본문은 겉으로는 옳은 일을 했으나 내적 헌신이 결여되었음을 말하며, 죄를 더 강하게 규정하지는 않습니다. 그래서 ‘온전한 마음’으로 긴장을 그대로 남겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
