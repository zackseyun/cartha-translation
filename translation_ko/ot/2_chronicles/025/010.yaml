base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
  footnotes:
  - marker: a
    text: Or 'became very angry against Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 아마샤는 에브라임에서 자기에게 온 그 부대를 보내어 제자리로 가게 했습니다. 그러자 그들은 유다에게 크게 화가 나서 격분한 채 제자리로 돌아갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  english_pob_choice: separated them
  chosen_korean: 보내어 제자리로 가게 했습니다
  alternatives_korean:
  - 분리했습니다
  - 떼어 놓았습니다
  - 해산시켰습니다
  lexicon: HALOT
  rationale: 이 동사는 문자적으로는 ‘나누다/분리하다’이지만, 문맥상 아마샤가 군대를 전역시키고 돌려보내는 행위이므로 한국어에서는 자연스럽게 ‘보내어 제자리로 가게 했습니다’로 옮겼습니다.
- source_word: לְהַגְּדוּד
  english_pob_choice: the troops
  chosen_korean: 그 부대
  alternatives_korean:
  - 그 군대
  - 그 떼
  - 그 일단
  lexicon: HALOT
  rationale: גְּדוּד는 군사 단위를 가리킬 수 있으므로, 에브라임에서 온 용병/전투 부대를 가리키는 문맥에 맞게 ‘부대’가 가장 분명합니다.
- source_word: וַיִּחַר אַפָּם מְאֹד
  english_pob_choice: they became very angry
  chosen_korean: 크게 화가 나서 격분한 채
  alternatives_korean:
  - 매우 화가 나서
  - 몹시 분노하여
  - 분노가 크게 타올라
  lexicon: HALOT
  rationale: ‘콧김이 타오르다’라는 히브리어 관용구를 한국어에서 그대로 살리기보다, 현대 독자에게 분명한 감정 강도로 전달되도록 ‘크게 화가 나서 격분한 채’로 옮겼습니다.
- source_word: בָּחֳרִי אָף
  english_pob_choice: in fierce anger
  chosen_korean: 격분한 채
  alternatives_korean:
  - 맹렬한 분노로
  - 불타는 분노 속에서
  - 거센 분노로
  lexicon: HALOT
  rationale: 이 표현은 앞선 분노를 한층 강화하는 종결 상태를 나타내므로, 중복을 피하면서도 강도를 유지하는 ‘격분한 채’로 처리했습니다.
theological_decisions:
- issue: 화의 방향을 나타내는 전치사 בִּיהוּדָה
  chosen_reading: 유다에게 크게 화가 나서
  alternative_readings:
  - 유다를 향해
  - 유다와 함께
  - 유다에 대하여
  rationale: 이 전치사는 단순한 ‘with’가 아니라 분노의 대상을 나타내므로, 한국어에서는 관계를 분명히 드러내는 ‘유다에게’가 가장 자연스럽습니다.
  doctrine_reference: 문맥-의미론적 판단
