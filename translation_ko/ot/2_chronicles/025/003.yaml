base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/003.yaml
  text: Now when the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'when the kingdom was established under his control.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 왕국이 그의 손에 굳게 잡히자, 그는 자기 아버지인 왕을 죽인 자기 종들을 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  english_pob_choice: Now when
  chosen_korean: 이제 …자
  alternatives_korean:
  - 그리고 …때
  - …할 때에
  lexicon: WLC narrative formula
  rationale: 서사 전환을 자연스럽게 살리면서도, 히브리어의 시간적 연결을 과도하게 풀지 않기 위해 ‘이제 …자’를 택했습니다.
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  english_pob_choice: the kingdom was firmly in his hand
  chosen_korean: 왕국이 그의 손에 굳게 잡히자
  alternatives_korean:
  - 왕국이 그의 손에 확고히 서자
  - 그의 통치가 굳어지자
  lexicon: HALOT
  rationale: ‘강해지다/확고해지다’의 통치 안정 의미를 살리되, POB의 손-소유 은유를 유지하기 위해 ‘그의 손에 굳게 잡히다’로 옮겼습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 종들
  alternatives_korean:
  - 자기 신하들
  - 자기 관원들
  lexicon: HALOT
  rationale: 궁정 맥락에서 ‘종’은 왕에게 속한 사람들을 넓게 가리킬 수 있어 원문의 소유 관계를 보존하면서도, ‘관원들’처럼 의미를 좁히지 않기 위해 선택했습니다.
- source_word: הַמַּכִּים אֶת הַמֶּלֶךְ אָבִיו
  english_pob_choice: who had struck down the king his father
  chosen_korean: 자기 아버지인 왕을 죽인
  alternatives_korean:
  - 자기 아버지인 왕을 쳐서 죽인
  - 아버지인 왕을 쳐서 쓰러뜨린
  lexicon: HALOT
  rationale: ‘כה’의 폭력적 타격을 한국어에서 가장 자연스럽게 전달하는 표현은 이 문맥에서 ‘죽인’이며, 뒤의 처형과의 연속성도 분명하게 드러납니다.
theological_decisions:
- issue: 왕권의 강화 표현
  chosen_reading: 왕국이 그의 손에 굳게 잡히자
  alternative_readings:
  - 왕국이 그의 통치 아래 확립되자
  - 왕국이 그의 권세 아래 굳어지자
  rationale: 정치적 안정과 장악을 함께 드러내는 본문의 의미를 살리기 위해, 단순한 ‘강해지다’보다 손-통제 은유를 유지하는 표현을 택했습니다.
  doctrine_reference: 본문의 왕권 서술
