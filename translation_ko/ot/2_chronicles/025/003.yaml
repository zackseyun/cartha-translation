  english_pob_choice: who had struck down the king his father
  chosen_korean: 자기 아버지인 왕을 죽인
  alternatives_korean:
  - 자기 아버지인 왕을 쳐서 죽인
  - 아버지인 왕을 쳐서 쓰러뜨린
  lexicon: HALOT
  rationale: ‘כה’의 폭력적 타격을 한국어에서 가장 자연스럽게 전달하는 표현은 이 문맥에서 ‘죽인’이며, 뒤의 처형과의 연속성도 분명하게 드러납니다.
theological_decisions:
