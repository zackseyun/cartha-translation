base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''the hundred talents''; the previous verse specifies these as silver talents.'
    reason: cross_reference
  - marker: b
    text: Or 'The LORD has enough to give you much more than this.' The Hebrew expression emphasizes the LORD's capacity to provide.
    reason: lexical_alternative
translation:
  language: ko
  text: 아마샤가 하나님의 사람에게 말했습니다. “그런데 내가 이스라엘 군대에게 준 그 백 달란트[a]는 어떻게 해야 합니까?” 하나님의 사람이 말했습니다. “야훼께서는 이것보다 훨씬 더 많이 주실 수 있습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 앞절에서 이것은 ‘은 백 달란트’로 구체화됩니다.
    reason: cross_reference
  - marker: b
    text: 히브리어는 야훼의 능력과 충분함을 강조하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 예언자
  lexicon: HALOT
  rationale: 히브리어의 표준 호칭을 살려 직역에 가깝게 옮기되, 직분을 예언자로 과도하게 특정하지 않도록 했습니다.
- source_word: מְאַת הַכִּכָּר
  english_pob_choice: the hundred talents
  chosen_korean: 그 백 달란트
  alternatives_korean:
  - 백 달란트
  - 은 백 달란트
  lexicon: HALOT
  rationale: 앞절에서 이미 은 달란트임이 드러나지만, 이 절 자체의 표현은 단위와 수량을 유지해 옮겼습니다.
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ הַרְבֵּה מִזֶּה
  english_pob_choice: Yahweh is able to give you much more than this
  chosen_korean: 야훼께서는 이것보다 훨씬 더 많이 주실 수 있습니다
  alternatives_korean:
  - 야훼께서 이것보다 훨씬 더 많이 주실 수 있습니다
  - 야훼께는 이것보다 훨씬 더 많이 주실 수 있습니다
  lexicon: HALOT
  rationale: 히브리어의 능력·충분성 표현을 한국어에서 자연스럽게 풀어, ‘주실 수 있습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문의 신명은 관용적 대체어 ‘주’ 대신 프로젝트 기본값인 고유명 ‘야훼’로 일관되게 옮겼습니다.
theological_decisions:
- issue: 야훼의 공급 능력을 어떻게 표현할지
  chosen_reading: ‘주실 수 있습니다’로 하나님의 실제 능력과 충분성을 함께 드러냈습니다.
  alternative_readings:
  - ‘주실 것입니다’
  - ‘충분히 주실 수 있습니다’
  rationale: 히브리어의 ישׁ ל־ 구조는 단순 가능성보다 자원과 능력의 충만함을 암시하므로, 직역을 넘지 않으면서도 그 뉘앙스를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
