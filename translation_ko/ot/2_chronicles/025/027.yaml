  rationale: 직역은 ‘뒤에 보내다’이지만 문맥상 추격을 위한 파견이므로, 한국어에서는 자연스럽게 ‘사람을 보내어’로 풀어 주었습니다.
- source_word: וַיְמִיתֻהוּ
  english_pob_choice: and put him to death
  chosen_korean: 그를 죽였습니다
  alternatives_korean:
