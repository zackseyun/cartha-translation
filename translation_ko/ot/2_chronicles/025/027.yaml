base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: Now from the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
  footnotes:
  - marker: a
    text: 'Hebrew: ''turned away from after the LORD,'' an idiom meaning he ceased following the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아마샤가 야훼[a]를 따르는 데서 돌아선 때부터, 그들은 예루살렘에서 그를 해치려는 음모를 꾸몄습니다. 아마샤는 라기스로 도망하였으나, 그들은 그의 뒤를 따라 라기스로 사람을 보내어 그곳에서 그를 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘야훼 뒤에서 돌아서다’이며, 여기서는 야훼를 따르던 데서 떠난다는 뜻의 관용구입니다.
    reason: source_note
