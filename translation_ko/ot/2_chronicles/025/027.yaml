  rationale: 문맥은 암살의 원인을 왕의 배신보다 먼저 신앙적 이탈에 두므로, 한국어도 그 신학적 긴장을 약화하지 않도록 유지했습니다.
  doctrine_reference: 신명기적 역사 이해 / 언약적 충성
