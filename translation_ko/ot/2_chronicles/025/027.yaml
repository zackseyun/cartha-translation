  text: Now from the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
  footnotes:
  - marker: a
    text: 'Hebrew: ''turned away from after the LORD,'' an idiom meaning he ceased following the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아마샤가 야훼를 따르지 않기 시작한 때부터 예루살렘에서 그를 상대로 음모를 꾸몄고, 그는 라기스로 도망하였으나 그들은 라기스로 사람을 보내어 거기에서 그를 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘야훼 뒤에서 돌아서다’로, 여기서는 야훼를 따르기를 그만둔다는 관용구입니다.
    reason: source_note
