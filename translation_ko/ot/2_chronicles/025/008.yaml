  rationale: 현대 한국어 합쇼체의 자연스러움을 위해 어색한 ‘굳세게 하십시오’를 ‘전투에 임하여 힘을 내십시오’로 고쳤습니다. 마지막 절은 원문의 단일 ‘능력’과 ‘돕다/넘어지게 하다’의 병렬을 살려 ‘도우시고 넘어지게 하실 능력’으로 정리했습니다. 하나님의 직접적 행위와 동사 반복은 유지했습니다.
