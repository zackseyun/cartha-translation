  - 하나님께서 당신을 방해하실 것입니다
  rationale: 히브리어는 단지 허용이 아니라 직접적 원인 작용을 말하므로, 이를 완화하지 않고 그대로 드러내는 것이 원문과 신학적 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
