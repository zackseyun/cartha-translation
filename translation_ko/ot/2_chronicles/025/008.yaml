  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
  footnotes:
  - marker: a
    text: Or 'be strong for the battle' or 'show yourself strong in battle.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew repeats the same verb: God has power both ''to help'' and ''to make stumble.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신이 정말로 가려거든[a], 전투에 임하여 힘을 내십시오. 하나님께서 원수 앞에서 당신을 넘어지게 하실 것입니다[b]. 하나님께는 도우시고 넘어지게 하실 능력이 있으시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전투를 위해 강해지십시오’ 또는 ‘전투에서 강한 모습을 보이십시오.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘넘어지게 하다’라는 같은 동사를 이 절의 앞부분과 끝부분에서 반복합니다. 하나님께는 도우실 능력과 넘어지게 하실 능력이 모두 있으십니다.
    reason: lexical_alternative
