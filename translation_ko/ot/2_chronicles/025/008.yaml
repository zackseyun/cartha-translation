base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
  footnotes:
  - marker: a
    text: Or 'be strong for the battle' or 'show yourself strong in battle.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew repeats the same verb: God has power both ''to help'' and ''to make stumble.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 당신이 실제로 가서 싸우려거든, 전투에서 굳세게 하십시오. 하나님께서 당신을 원수 앞에서 넘어지게 하실 것입니다. 하나님 안에는 돕는 힘과 넘어지게 하는 힘이 있기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전투에서 강하게 되십시오’ 혹은 ‘전투에서 강한 모습을 보이십시오.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 같은 동사를 반복합니다. 하나님은 ‘돕는 것’과 ‘넘어지게 하는 것’ 모두에 능력이 있으십니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But if
  chosen_korean: 그러나 … 하려거든
  alternatives_korean:
  - 그런데 만일
  - 그러나 만일
  lexicon: HALOT
  rationale: 앞절과 대조를 이루는 조건절이므로 ‘그러나’로 역접을 살리고, 합쇼체 문맥에 맞게 ‘-하려거든’으로 조건과 권고의 뉘앙스를 함께 살렸습니다.
- source_word: בֹּא אַתָּה
  english_pob_choice: you do go
  chosen_korean: 당신이 실제로 가서
  alternatives_korean:
  - 당신이 가면
  - 당신이 가고
  lexicon: HALOT
  rationale: 인칭 대명사의 강조를 반영해 ‘실제로’로 가는 행위를 분명히 했고, 단순 조건보다 의도적 참여를 드러냈습니다.
- source_word: עֲשֵׂה חֲזַק לַמִּלְחָמָה
  english_pob_choice: act resolutely in battle
  chosen_korean: 전투에서 굳세게 하십시오
  alternatives_korean:
  - 전투에서 강하게 하십시오
  - 전투를 위해 굳세게 하십시오
  - 전투에 임해 굳세게 하십시오
  lexicon: HALOT
  rationale: 직역의 ‘강하다’보다 전투 상황에서의 결연한 태도를 살리는 ‘굳세게 하다’를 택했고, 군사적 맥락을 자연스럽게 반영했습니다.
- source_word: יַכְשִׁילְךָ
  english_pob_choice: will make you stumble
  chosen_korean: 당신을 … 넘어지게 하실 것입니다
  alternatives_korean:
  - 당신을 넘어뜨리실 것입니다
  - 당신이 쓰러지게 하실 것입니다
  lexicon: HALOT
  rationale: כשל의 ‘넘어지다/걸려 넘어지다’ 이미지를 보존해, 뒤의 반복 동사와 연결되는 어휘적 긴장을 유지했습니다.
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  english_pob_choice: there is power in God
  chosen_korean: 하나님 안에는 돕는 힘과 넘어지게 하는 힘이 있기 때문입니다
  alternatives_korean:
  - 하나님께는 돕는 힘과 넘어지게 하는 힘이 있기 때문입니다
  - 하나님께는 능력이 있어서 돕기도 하시고 넘어지게도 하십니다
  lexicon: HALOT
  rationale: 히브리어의 ‘하나님 안에 힘이 있다’는 구조를 살리되, 이어지는 שני 동사 부정사와의 평행을 한국어에서 분명히 드러내기 위해 ‘돕는 힘 / 넘어지게 하는 힘’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접적 패배 야기 표현
  chosen_reading: 본문의 직설을 따라 하나님께서 실제로 ‘넘어지게 하실 것’이라고 번역했습니다.
  alternative_readings:
  - 하나님께서 패배를 허락하실 것입니다
  - 하나님께서 당신을 방해하실 것입니다
  rationale: 히브리어는 단지 허용이 아니라 직접적 원인 작용을 말하므로, 이를 완화하지 않고 그대로 드러내는 것이 원문과 신학적 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
