  source_fidelity: 본문은 요아스가 ‘올라가’ 아마샤와 벧세메스에서 대면했다는 히브리어의 기본 의미와 장소의 유다 소속을 대체로 충실히 전달합니다. 다만 ‘올라와서’는 뒤 절에 종속된 연결형이므로, 독립 서술인 וַיַּעַל은 ‘올라갔습니다’로 직접 옮기는 편이 더 정확합니다.
