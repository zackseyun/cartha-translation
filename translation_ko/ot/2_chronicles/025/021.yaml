  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
  footnotes:
  - marker: a
    text: Or 'met face to face.' The Hebrew idiom is literally 'saw faces.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이스라엘 왕 요아스가 올라갔습니다. 그와 유다 왕 아마샤는 유다에 속한 벧세메스에서 서로 대면했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
