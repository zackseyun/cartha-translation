base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
  footnotes:
  - marker: a
    text: Or 'met face to face.' The Hebrew idiom is literally 'saw faces.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 이스라엘 왕 요아스가 올라와서, 그와 유다 왕 아마샤가 유다에 속한 벧세메스에서 서로 얼굴을 마주했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서로 얼굴을 맞대었다.’ 히브리어 관용구는 문자적으로는 ‘얼굴들을 보았다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라와서
  alternatives_korean:
  - 올라갔습니다
  - 진군했습니다
  lexicon: HALOT
  rationale: עלה의 기본적인 서술 의미를 살려, 전투 문맥이지만 과도하게 군사적으로 좁히지 않고 자연스럽게 옮겼습니다.
- source_word: וַיִּתְרָאוּ פָנִים
  english_pob_choice: faced one another
  chosen_korean: 서로 얼굴을 마주했습니다
  alternatives_korean:
  - 서로 대면했습니다
  - 얼굴을 맞대었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴을 보다’에 가까운 관용구이므로, POB의 ‘faced one another’를 반영해 상호 대면의 긴장감을 살렸습니다.
- source_word: בְּבֵית שֶׁמֶשׁ אֲשֶׁר לִיהוּדָה
  english_pob_choice: at Beth-shemesh, which belongs to Judah
  chosen_korean: 유다에 속한 벧세메스에서
  alternatives_korean:
  - 유다에 있는 벧세메스에서
  - 유다의 벧세메스에서
  lexicon: HALOT
  rationale: לִיהוּדָה의 소속·귀속 관계를 단순한 위치 표현으로만 약화시키지 않기 위해 ‘속한’으로 옮겼습니다.
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  english_pob_choice: king of Israel / king of Judah
  chosen_korean: 이스라엘 왕 / 유다 왕
  alternatives_korean:
  - 이스라엘의 왕 / 유다의 왕
  - 이스라엘 임금 / 유다 임금
  lexicon: HALOT
  rationale: 왕호를 현대 한국어에서 가장 직접적이고 읽기 쉬운 형태로 유지했습니다.
theological_decisions:
- issue: 전투 장면에서의 관용구 처리
  chosen_reading: ‘서로 얼굴을 마주했습니다’로 옮겨, 직접 충돌 직전의 대면성을 드러냈습니다.
  alternative_readings:
  - ‘서로 대면했습니다’
  - ‘서로 마주했습니다’
  rationale: 이 구절의 핵심은 단순한 만남이 아니라 적대적 대치이므로, 관용구의 물리적·서사적 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: 서사 본문에서의 관용구와 문맥적 뉘앙스 보존
