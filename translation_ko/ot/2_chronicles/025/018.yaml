  text: וַ/יִּשְׁלַ֞ח יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
  footnotes:
  - marker: a
    text: Or 'thistle' or 'briar' for 'thornbush.' The Hebrew names a thorny plant; the exact species is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 왕 요아스가 유다 왕 아마샤에게 사람을 보내어 말했습니다. 「레바논에 있던 가시덤불이 레바논에 있던 백향목에게 사람을 보내어, ‘내 아들에게 네 딸을 아내로 주십시오.’라고 했습니다. 그러자 그 레바논의 들짐승이 지나가 그 가시덤불을 짓밟았습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 חוֹחַ는 정확한 식물을 특정하기 어려운 가시성 덤불을 가리키므로, ‘가시덤불’ 외에 ‘엉겅퀴’나 ‘가시나무’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  english_pob_choice: sent ... saying
  chosen_korean: 사람을 보내어 말했습니다
  alternatives_korean:
  - 보내어 말했습니다
  - 편지를 보내 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘보내다 + 말하다’ 구조를 자연스러운 합쇼체로 옮기되, 발신이 메시지 전달임을 드러내기 위해 ‘사람을 보내어’로 처리했습니다.
- source_word: הַחוֹחַ
  english_pob_choice: the thornbush
  chosen_korean: 가시덤불
  alternatives_korean:
  - 가시나무
  - 엉겅퀴
  - 가시덤불
  lexicon: HALOT
  rationale: חוֹחַ는 정확한 종을 특정하기 어려운 가시성 식물로, POB의 ‘thornbush’에 맞춰 낮고 거친 이미지를 유지하는 ‘가시덤불’이 적절합니다.
- source_word: הָאֶרֶז
  english_pob_choice: the cedar
  chosen_korean: 백향목
  alternatives_korean:
  - 삼나무
  - 향나무
  - 백향목
  lexicon: HALOT
  rationale: אֶרֶז는 성경적 문맥에서 높고 견고한 향목을 가리키며, 한국어 성경 전통에서 널리 인지되는 ‘백향목’이 비유의 대조를 잘 살립니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: a wild beast of the field
  chosen_korean: 들짐승
  alternatives_korean:
  - 들판의 짐승
  - 야생 짐승
  - 들짐승
  lexicon: HALOT
  rationale: 직역보다 현대 한국어에서 자연스럽고 강한 표현인 ‘들짐승’이 본문의 일반적 야생 동물을 잘 전달합니다.
- source_word: וַתַּעֲבֹר ... וַתִּרְמֹס
  english_pob_choice: passed by ... trampled
  chosen_korean: 지나가 그 가시덤불을 짓밟았습니다
  alternatives_korean:
  - 지나가 그 가시덤불을 밟아 짓이겼습니다
  - 지나가 그 가시덤불을 짓밟았습니다
  lexicon: HALOT
  rationale: ‘지나가’와 ‘짓밟다’는 사건의 순서와 압도적 파괴를 간결하게 재현하며, POB의 ‘passed by and trampled’와 의미가 맞닿습니다.
theological_decisions:
- issue: 비유의 수사적 의도와 직설 유지
  chosen_reading: 본문을 우화적 협박 발언으로 그대로 옮기고, 완곡화하지 않았습니다.
  alternative_readings:
  - 비유를 풀어 설명하는 번역
  - 의미를 약화한 평이한 표현
  rationale: 이 구절은 요아스의 교만한 경고를 비유로 전달하므로, 수사적 공격성과 대조(가시덤불/백향목/들짐승)를 보존하는 것이 원문의 효과를 살립니다.
  doctrine_reference: 문맥적 수사 분석
- issue: 왕에게 보내는 발화의 높임말 처리
  chosen_reading: 서술문은 합쇼체로, 인용문 내부는 원문 명령형을 살려 높임을 유지했습니다.
  alternative_readings:
  - 인용문까지 전면 평서형
  - 더 완곡한 청유형
  rationale: 직접 인용의 명령 ‘내 딸을 네 아들에게 주라’는 관계적 압박을 보여 주므로, 예의체로 희석하지 않고 ‘주십시오’로 옮겼습니다.
  doctrine_reference: 문체·화행 보존
