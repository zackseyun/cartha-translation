  edition: WLC
  text: אָמַ֗רְתָּ הִנֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּ/נְשָׂאֲ/ךָ֥ לִבְּ/ךָ֖ לְ/הַכְבִּ֑יד עַתָּה֙ שְׁבָ֣/ה בְּ/בֵיתֶ֔/ךָ לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
  footnotes:
  - marker: a
    text: Or 'your heart has exalted you for glory' / 'your heart has made you proud for honor.' The Hebrew expression is idiomatic and conveys self-exaltation after victory.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신은 이렇게 말했습니다. 「보십시오, 당신이 에돔을 쳤으니 당신의 마음이 당신을 교만하게 하여 자만하게 하였습니다. 이제 집에 머무르십시오. 어찌하여 재앙을 자초하여, 당신과 당신과 함께 있는 유다가 함께 넘어지려고 하십니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음이 당신을 교만하게 하여 자만하게 하였습니다’는 히브리어 관용구를 풀어 옮긴 것입니다. 직역하면 ‘당신의 마음이 당신을 높였습니다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתָּ
  english_pob_choice: You said
  chosen_korean: 당신은 이렇게 말했습니다
  alternatives_korean:
  - 당신이 말했습니다
  - 당신은 말했습니다
  lexicon: HALOT
  rationale: 보고된 발화를 자연스러운 현대 한국어로 풀되, 인용문 도입 기능을 분명히 살리기 위해 ‘이렇게 말했습니다’를 사용했습니다.
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  english_pob_choice: your heart has lifted you up
  chosen_korean: 당신의 마음이 당신을 교만하게 하여
  alternatives_korean:
  - 당신의 마음이 당신을 들어 올려
  - 당신의 마음이 당신을 높여
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심인 ‘마음이 높아짐/들려짐’을 살리면서, 문맥상 결과로 드러나는 교만을 한국어 동사로 풀었습니다.
- source_word: לְהַכְבִּיד
  english_pob_choice: to boast
  chosen_korean: 자만하게 하였습니다
  alternatives_korean:
  - 자랑하게 하였습니다
  - 교만하게 하였습니다
  lexicon: HALOT
  rationale: 본문의 의도는 전리 후의 자기과시이므로, 단순한 ‘영광’보다 문맥에 맞는 ‘자만’으로 렌더링했습니다.
- source_word: בְּרָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 화
  - 악
  lexicon: HALOT
  rationale: 여기서 רעה는 도덕적 악이 아니라 정치·군사적 파멸의 위험을 가리키므로 ‘재앙’이 가장 적절합니다.
theological_decisions:
- issue: 왕의 오만이 유다 전체의 سقوط로 이어질 수 있다는 경고의 집단적 책임
  chosen_reading: ‘당신과 당신과 함께 있는 유다가 함께 넘어지려고 하십니까?’로 번역해, 왕 개인의 실책이 공동체 전체에 미치는 파국성을 분명히 했습니다.
  alternative_readings:
  - ‘당신과 유다가 함께 넘어지게 되려고 하십니까?’
  - ‘당신과 함께 유다가 넘어지게 되겠습니까?’
  rationale: 히브리어의 최종 열거는 왕과 유다를 함께 묶어 경고하므로, 공동체적 붕괴의 무게를 약화하지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 언약 공동체의 대표성/연대성
