  source_fidelity: 히브리어의 경고 구조와 에돔 승리 뒤의 자기고양이라는 핵심은 대체로 반영되었습니다. 그러나 ‘교만하게 하여 자만하게’는 같은 의미를 중복하며, 마지막의 ‘넘어지려고 하십니까?’는 결과로 예고된 몰락을 의도·목적처럼 들리게 합니다.
  naturalness: 현대 표준어 합쇼체의 기본 register는 유지됩니다. 다만 ‘당신과 당신과 함께 있는 유다’는 ‘당신’이 중복되어 명백한 오류이며, ‘마음이 … 교만하게 하여 자만하게 하였습니다’는 부자연스럽고 장황합니다.
  terminology: ‘에돔’, ‘재앙’, ‘유다’는 적절합니다. נשאך לבך와 להכביד는 ‘마음이 당신을 높여 자랑하게 되었습니다’로 옮기면 비유와 자기과시의 결과를 유지하면서 중복을 피할 수 있습니다. 교리적 용어를 덧붙일 필요는 없습니다.
