source:
  edition: WLC
  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ וַ/יְבִיאֵ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹ֞ץ בְּ/חוֹמַ֣ת יְרוּשָׁלִַ֗ם מִ/שַּׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פּוֹנֶ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
  footnotes:
  - marker: a
    text: Or, more literally, 'from the Ephraim Gate to the gate that turns/faces.' The rendering 'Corner Gate' follows the likely identification from the parallel account in 2 Kings 14:13.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 왕 요아스가 유다 왕 아마지야를 — 요아스의 아들, 여호아하스의 손자 — 벧세메스에서 사로잡아 예루살렘으로 데려왔습니다. 그런 다음 그는 예루살렘 성벽을 에브라임 문에서부터 모퉁이 문까지 사백 규빗이나 허물어 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘돌아서는/향하는 문’에 더 가깝지만, 병행 본문인 2열왕기 14:13을 따라 보통 ‘모퉁이 문’으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּפַשׂ
  english_pob_choice: captured
  chosen_korean: 사로잡아
  alternatives_korean:
  - 붙잡아
  - 포로로 잡아
  lexicon: HALOT
  rationale: 군사적 상황에서 상대를 힘으로 제압해 끌고 가는 의미를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: וַיְבִיאֵהוּ
  english_pob_choice: brought him
  chosen_korean: 데려왔습니다
  alternatives_korean:
  - 데리고 왔습니다
  - 끌고 왔습니다
  lexicon: HALOT
  rationale: 단순한 'bring'의 인과적 이동을 반영하되, 포로를 동반 이동시키는 뉘앙스를 자연스럽게 전달합니다.
- source_word: שַׁעַר הַפּוֹנֶה
  english_pob_choice: Corner Gate
  chosen_korean: 모퉁이 문
  alternatives_korean:
  - 구석 문
  - 돌아서는 문
  lexicon: HALOT
  rationale: 영어 POB의 ‘Corner Gate’와 병행 본문(왕하 14:13)에서 유력한 특정 문 이름을 따라, 직역의 모호함보다 식별 가능한 지명을 살렸습니다.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  english_pob_choice: four hundred cubits
  chosen_korean: 사백 규빗
  alternatives_korean:
  - 사백 큐빗
  - 길이 사백 규빗
  lexicon: HALOT
  rationale: 히브리어의 측정 표현을 그대로 유지해 본문의 수치와 파괴 범위를 정확히 보여 주었습니다.
theological_decisions:
- issue: 왕하 14:13과의 병행에서 'Corner Gate'의 식별 문제
  chosen_reading: 모퉁이 문으로 옮겨, 특정 문 이름이라는 점을 유지했습니다.
  alternative_readings:
  - 돌아서는 문으로 직역
  - 모퉁이로 추정되는 문으로 완화
  rationale: 본문은 단순한 방향 설명이 아니라 예루살렘 성벽의 특정 구간을 가리키므로, 병행 본문의 전승을 반영한 명칭을 유지하는 편이 본문 이해에 더 충실합니다.
  doctrine_reference: 본문 비평/역사 지리
