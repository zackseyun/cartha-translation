  lexicon: WLC; HALOT
  rationale: 히브리어의 총괄성(כָּל)은 문맥상 뒤의 목록 전체에 걸려 있으므로 한국어에서는 자연스럽게 간결하게 처리하되, 금과 은의 두 항목은 분명히 구분했습니다.
- source_word: הַ/כֵּלִים הַ/נִּמְצְאִ֨ים בְּ/בֵית הָ/אֱלֹהִ֜ים עִם עֹבֵ֣ד אֱד֗וֹם
  english_pob_choice: all the vessels found in the house of God with Obed-edom
  chosen_korean: 야훼의 성전에서 오벳에돔과 함께 있던…거기서 발견된 모든 기구
  alternatives_korean:
  - 오벳에돔의 관리 아래 있던…발견된 모든 기구
  - 오벳에돔과 함께 있던…발견된 모든 성기구
  lexicon: HALOT
  rationale: כֵּלִים은 성전 맥락에서 ‘기구’가 가장 무난하며, עִם은 문자적으로 ‘함께’이지만 영어 POB의 주석처럼 관리/보관의 뉘앙스를 가질 수 있어 본문은 직역에 가깝게 두고 한국어도 그 열린 의미를 유지했습니다.
- source_word: אֹצְרוֹת בֵּית הַ/מֶּ֔לֶךְ
  english_pob_choice: the treasures of the king’s house
  chosen_korean: 왕궁의 보물
  alternatives_korean:
  - 왕궁의 창고들
  - 왕의 집의 보물
  lexicon: HALOT
  rationale: אֹצְרוֹת는 ‘보물’ 또는 ‘저장고’가 가능하지만, 약탈된 재물의 목록이라는 문맥상 ‘보물’이 가장 자연스럽고, בֵּית הַמֶּלֶךְ은 한국어에서 ‘왕궁’으로 옮기는 것이 현대 독자에게 명확합니다.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
