base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
  footnotes:
  - marker: a
    text: Or 'in the custody of Obed-edom'; the Hebrew reads literally 'with Obed-edom.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of the pledges,' likely meaning persons taken as security, that is, hostages.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 야훼의 성전에서 오벳에돔과 함께 있던 금과 은과, 거기서 발견된 모든 기구와 왕궁의 보물과 인질들을 모두 가지고 사마리아로 돌아왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עִם עֹבֵד אֱדוֹם은 문자적으로 ‘오벳에돔과 함께’입니다. 문맥상 ‘오벳에돔의 관리 아래’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그 담보의 아들들’에 가깝지만, 문맥상 사람을 보증물로 잡아 둔 인질을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָֽל הַ/זָּהָ֣ב וְ/הַ/כֶּ֡סֶף
  english_pob_choice: all the gold and the silver
  chosen_korean: 금과 은
