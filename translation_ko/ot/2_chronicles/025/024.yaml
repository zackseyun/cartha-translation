  lexicon: HALOT
  rationale: 히브리어의 직역은 불투명하지만 POB가 주석으로 ‘hostages’ 해석을 채택하므로, 한국어 본문도 의미를 분명히 드러내는 ‘인질들’을 사용했습니다.
