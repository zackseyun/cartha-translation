base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
  footnotes:
  - marker: a
    text: Or 'consulted' or 'inquired of' the gods of the people.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 야훼의 분노가 아마샤에게 타올랐습니다. 야훼께서 그에게 예언자를 보내셨고, 예언자가 그에게 말했습니다. “어찌하여 너는 자기 백성을 네 손에서 건져 내지 못한 그 백성의 신들을 찾았습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 신들에게 문의했습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  english_pob_choice: the LORD’s anger burned
  chosen_korean: 야훼의 분노가 타올랐습니다
  alternatives_korean:
  - 야훼의 노가 타올랐습니다
  - 야훼의 분노가 일어났습니다
  - 야훼께서 분노하셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘코가 타오르다’는 강한 분노를 뜻하므로, ‘분노가 타올랐습니다’로 이미지와 강도를 함께 살렸습니다.
- source_word: וַיִּשְׁלַח אֵלָיו נָבִיא
  english_pob_choice: and he sent a prophet to him
  chosen_korean: 그래서 그가 그에게 예언자를 보내셨고
  alternatives_korean:
  - 그리고 그에게 예언자를 보내셨고
  - 예언자를 그에게 보내셨고
  lexicon: HALOT
  rationale: 주어의 행동을 자연스럽게 잇되, ‘וַיִּשְׁלַח’의 파송 의미를 분명히 살렸습니다. 또한 문맥상 ‘그’는 야훼를 가리킵니다.
- source_word: לָמָּה דָרַשְׁתָּ
  english_pob_choice: Why have you sought
  chosen_korean: 어찌하여 너는 ... 찾았느냐
  alternatives_korean:
  - 어찌하여 너는 ... 구하였느냐
  - 어찌하여 너는 ... 찾아다녔느냐
  - 어찌하여 너는 ... 찾았느냐
  lexicon: HALOT
  rationale: דָרַשׁ는 종교적 맥락에서 ‘구하다/찾다/문의하다’의 폭이 있으나, 여기서는 우상 신들을 의지하러 간 행위를 포괄적으로 드러내는 ‘찾다’가 가장 직접적입니다.
- source_word: אֱלֹהֵי הָעָם
  english_pob_choice: the gods of the people
  chosen_korean: 그 백성의 신들
  alternatives_korean:
  - 그 민족의 신들
  - 그 사람들의 신들
  lexicon: HALOT
  rationale: 히브리어 속격을 자연스럽게 옮기되, 문맥상 이교 신들을 가리키므로 ‘신들’로 번역했습니다.
- source_word: מִיָּדֶךָ
  english_pob_choice: from your hand
  chosen_korean: 네 손에서
  alternatives_korean:
  - 네 권세에서
  - 네 손아귀에서
  lexicon: HALOT
  rationale: ‘손’은 히브리어에서 권세·통제의 관용적 표현이므로, 이미지를 보존한 채 현대 한국어로도 이해되는 ‘네 손에서’를 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 고유명사이므로, 프로젝트 기준에 따라 칭호 대체 대신 ‘야훼’로 옮겨 신명성의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 예언자의 발화에서 인용문 내부 호칭과 문체
  chosen_reading: 직설적 질책형 반말
  alternative_readings:
  - 합쇼체로 완화
  - 중립적 서술형
  rationale: 예언자 발언은 왕에게 대한 신탁적 질책이므로, 원문의 날카로운 수사 질문을 유지하기 위해 인용문 내부는 반말 체계로 두었습니다.
  doctrine_reference: POB Korean style guidance
