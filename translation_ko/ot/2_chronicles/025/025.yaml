  to: 유다 왕 요아스의 아들 아마샤는 이스라엘 왕 여호아하스의 아들 요아스가 죽은 뒤에도 십오 년을 더 살았습니다.
  rationale: 본문의 연대기적 진술과 왕들의 부칭·왕국 표지를 보존했습니다. 한국어 표준 성경 인명 관례에 따라 아마샤와 요아스를 사용하고, 동일한 히브리어 이름은 동일하게 표기했습니다. 별도 각주는 본문의 의미를 이해하는 데 필수적이지 않습니다.
