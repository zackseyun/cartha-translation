base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''lived ... fifteen years after the death of Joash.'' The sense is that Amaziah outlived Joash of Israel by fifteen years.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 요아스의 아들 아마샤는 이스라엘 왕 여호아하스의 아들 요아스가 죽은 뒤에도 십오 년을 더 살았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살아 있었습니다
  - 생존했습니다
  lexicon: HALOT
  rationale: 연대기적 통보에서 חיים는 계속 생존했다는 뜻이므로, 자연스럽고 문맥에 맞는 ‘살았습니다’로 옮겼습니다.
- source_word: אַחֲרֵי מוֹת
  english_pob_choice: after the death of
  chosen_korean: 죽은 뒤
  alternatives_korean:
  - 죽음 후에
  - 죽은 후에
  lexicon: HALOT
  rationale: 명사구 ‘죽음’을 직역하기보다 한국어에서 더 자연스러운 시간 부사구 ‘죽은 뒤’로 옮기되, 뒤따르는 시간 관계는 그대로 유지했습니다.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  english_pob_choice: fifteen years
  chosen_korean: 십오 년
  alternatives_korean:
  - 열다섯 해
  - 15년
  lexicon: HALOT
  rationale: 히브리어 수사 표현을 간결하게 반영하기 위해 한자어 수사 ‘십오 년’을 사용했습니다.
- source_word: יוֹאָשׁ / יְהוֹאָחָז
  english_pob_choice: Joash / Jehoahaz
  chosen_korean: 여호야스 / 요아스 / 여호아하스
  alternatives_korean:
  - 요아스 / 여호야스 / 여호아하스
  - 여호아스 / 요아스
  lexicon: 표준 음역 + 본문 구별
  rationale: 두 인물이 모두 요아스라는 이름형을 공유하므로, 한국어 독자가 왕들을 구별할 수 있도록 아버지와 왕국 정보를 함께 살려 음역했습니다.
theological_decisions:
- issue: 연대기적 진술의 동사 처리
  chosen_reading: ‘살았습니다’로 평이하게 번역해 단순한 생존이 아니라 통치 후 생애 전체를 포함하는 연대기적 진술로 이해하게 했습니다.
  alternative_readings:
  - ‘남아 있었습니다’
  - ‘생존했습니다’
  rationale: 히브리어 문맥은 사건의 생존 여부보다 왕의 생애 기간을 기록하는 역사 서술이므로, 과도한 강조 없이 사실 보고로 제시했습니다.
  doctrine_reference: 역사서의 서술 기능
