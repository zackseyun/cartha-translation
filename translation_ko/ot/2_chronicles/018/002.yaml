id: 2CH.18.2
reference: 2 Chronicles 18:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּרֶד֩ לְ/קֵ֨ץ שָׁנִ֤ים אֶל אַחְאָב֙ לְ/שֹׁ֣מְר֔וֹן וַ/יִּֽזְבַּֽח ל֨/וֹ אַחְאָ֜ב צֹ֤אן וּ/בָקָר֙ לָ/רֹ֔ב וְ/לָ/עָ֖ם אֲשֶׁ֣ר עִמּ֑/וֹ וַ/יְסִיתֵ֕/הוּ לַ/עֲל֖וֹת אֶל רָמ֥וֹת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
  footnotes:
  - marker: a
    text: Or 'enticed him' or 'incited him' to go up to Ramoth-gilead.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to Ramoth-gilead'; the sense in context is a military move against the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 몇 해가 지난 뒤에 그는 아합에게로, 사마리아에 내려갔습니다. 아합은 그와 함께한 사람들과 그를 위해 양과 소를 풍성히 잡았고, 그에게 길르앗 라못으로 올라가라고 권했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְקֵץ שָׁנִים
  english_pob_choice: After some years
  chosen_korean: 몇 해가 지난 뒤에
  alternatives_korean:
  - 몇 년이 지난 뒤에
  - 세월이 흐른 뒤에
  - 여러 해가 지난 뒤에
  lexicon: HALOT
  rationale: 직역하면 ‘몇 해의 끝에’이지만, 한국어에서는 시간 경과를 자연스럽게 드러내는 ‘몇 해가 지난 뒤에’가 원문 의미를 가장 무리 없이 전달합니다.
- source_word: וַיֵּרֶד ... אֶל אַחְאָב לְשֹׁמְרוֹן
  english_pob_choice: he went down to Ahab in Samaria
  chosen_korean: 그는 아합에게로, 사마리아에 내려갔습니다
  alternatives_korean:
  - 아합이 있는 사마리아로 내려갔습니다
  - 아합에게 사마리아로 내려갔습니다
  lexicon: HALOT
  rationale: ירד의 ‘내려가다’와 지리적 하강을 살리되, 아합의 위치를 함께 밝히는 한국어 어순으로 옮겼습니다.
- source_word: וַיְסִיתֵהוּ
  english_pob_choice: urged him
  chosen_korean: 그에게 ... 권했습니다
  alternatives_korean:
  - 그를 부추겼습니다
  - 그를 꾀어 올렸습니다
  - 그를 부추겨
  lexicon: HALOT
  rationale: סות는 단순한 권유보다 더 강한 부추김/유혹의 뉘앙스를 가질 수 있지만, 이 문맥에서는 군사 행동으로 끌어들이는 압박을 자연스럽게 드러내는 ‘권했습니다’가 가장 무난합니다.
- source_word: צֹאן וּבָקָר לָרֹב
  english_pob_choice: sheep and cattle in abundance
  chosen_korean: 양과 소를 풍성히 잡았고
  alternatives_korean:
  - 양과 소를 많이 잡았고
  - 양과 소를 넉넉히 잡았고
  - 양떼와 소떼를 풍성히 잡았고
  lexicon: HALOT
  rationale: 제의적 의미보다 연회용 도살의 구체성을 살려 ‘잡았다’로 옮기고, לָרֹב는 ‘풍성히’로 자연스럽게 반영했습니다.
- source_word: רָמוֹת גִּלְעָד
  english_pob_choice: Ramoth-gilead
  chosen_korean: 길르앗 라못
  alternatives_korean:
  - 라못-길르앗
  - 길르앗 라못 성
  - 길르앗의 라못
  lexicon: modern_biblical_proper_nouns
  rationale: 한국어 성경에서 널리 알려진 지명 관용형을 따라 ‘길르앗 라못’으로 적었습니다.
theological_decisions:
- issue: וַיְסִיתֵהוּ의 강도
  chosen_reading: 아합이 여호사밧을 단순히 초대한 것이 아니라, 군사 원정을 하도록 강하게 부추기고 설득한 것으로 읽었습니다.
  alternative_readings:
  - 단순한 호의적 권유
  - 중립적인 제안
  rationale: 히브리어 סות는 문맥상 행동으로 끌어들이는 유인/부추김의 뉘앙스를 가지므로, 문맥이 허용하는 강한 압력을 한국어에서 약화시키지 않았습니다.
  doctrine_reference: 본문 의미 보존 원칙
- issue: לַעֲלוֹת אֶל רָמוֹת גִּלְעָד의 방향성
  chosen_reading: ‘길르앗 라못으로 올라가다’로 옮겨, 원문의 ‘올라가다’와 군사 작전의 방향성을 함께 살렸습니다.
  alternative_readings:
  - 길르앗 라못을 치러 가다
  - 길르앗 라못을 향해 올라가다
  rationale: 히브리어의 전형적 군사 관용을 살리면서도, 본문 자체가 명시하는 ‘올라가다’를 유지하는 편이 더 원문에 가깝습니다.
  doctrine_reference: 원문 관용구 보존
