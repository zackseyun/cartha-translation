source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/ר֗וּחַ וַֽ/יַּעֲמֹד֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יֹּ֖אמֶר אֲנִ֣י אֲפַתֶּ֑/נּוּ וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו בַּ/מָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
  footnotes:
  - marker: a
    text: Or 'I will deceive him' or 'I will persuade him.' The Hebrew verb can carry the sense of enticing, persuading, or deceiving depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 영이 앞으로 나와 야훼 앞에 서서 말했습니다. 「내가 그를 유혹하겠습니다.」 그러자 야훼께서 그에게 말씀하셨습니다. 「어떻게 하겠느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유혹하다’는 כאן פתה의 문맥적 범위를 반영한 번역입니다. 이 동사는 문맥에 따라 ‘꾀다’, ‘설득하다’, ‘속이다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  english_pob_choice: the spirit
  chosen_korean: 그 영
  alternatives_korean:
  - 그 바람
  - 그 숨
  lexicon: HALOT
  rationale: 이 장면은 천상 회의의 인격적 존재가 말하고 응답하는 문맥이므로, רוּחַ의 넓은 범위 중 ‘영’이 가장 적절합니다.
- source_word: וַיֵּצֵא
  english_pob_choice: came forward
  chosen_korean: 앞으로 나와
  alternatives_korean:
  - 나갔습니다
  - 나와 섰습니다
  lexicon: HALOT
  rationale: 단순한 ‘나감’보다, 야훼 앞에 자신을 제시하는 장면의 진행을 살려 ‘앞으로 나와’로 옮겼습니다.
- source_word: אֲפַתֶּנּוּ
  english_pob_choice: I will entice him
  chosen_korean: 내가 그를 유혹하겠습니다
  alternatives_korean:
  - 내가 그를 꾀겠습니다
  - 내가 그를 속이겠습니다
  lexicon: HALOT
  rationale: פעל פתה는 문맥에 따라 유혹하다/꾀다/속이다의 의미를 가질 수 있는데, 여기서는 다음 절의 거짓 예언을 통한 기만과 연결되므로 ‘유혹하겠습니다’로 번역해 긴장을 보존했습니다.
- source_word: בַּמָּה
  english_pob_choice: By what means?
  chosen_korean: 어떻게 하겠느냐?
  alternatives_korean:
  - 무슨 방법으로냐?
  - 어떤 방식이냐?
  lexicon: HALOT
  rationale: 방법이나 수단을 묻는 짧은 질문이므로, 한국어에서는 자연스럽고 격식을 유지하는 ‘어떻게 하겠느냐?’가 적절합니다.
theological_decisions:
- issue: יוֹהָה / YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신적 고유명사 יְהוָה는 титул ‘주’로 대체하지 않고 ‘야훼’로 옮겨, 본문이 드러내는 하나님의 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: פּתה의 도덕적 뉘앙스
  chosen_reading: 유혹하다
  alternative_readings:
  - 꾀다
  - 속이다
  rationale: 이 절은 영이 실제로 어떤 방식으로 아합을 무너뜨릴지 아직 밝히지 않고, 다음 절에서 그 수단이 드러납니다. 따라서 여기서는 의도적 유혹의 제안을 살리되, 해석을 과도하게 결정하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
