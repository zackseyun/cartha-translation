  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ לְ/ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
  footnotes:
  - marker: a
    text: Or 'a spirit of falsehood.'
    reason: lexical_alternative
  - marker: b
    text: Or 'You will deceive him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 말했습니다. "내가 나가서 그의 모든 예언자들의 입에 있는 거짓 영이 되겠습니다." 그러자 그가 말했습니다. "네가 그를 꾀어낼 것이며, 또한 네가 성공할 것입니다[b]. 나가서 그렇게 하십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘거짓 영’은 ‘거짓의 영’ 또는 ‘속이는 영’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘네가 그를 속일 것이다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  english_pob_choice: I will go out
  chosen_korean: 내가 나가서
  alternatives_korean:
  - 내가 나가겠습니다
  - 내가 나갈 것입니다
  lexicon: HALOT
  rationale: 미래 의지의 1인칭 표현을 자연스러운 합쇼체로 옮기되, 이동의 방향성을 살려 ‘나가서’로 처리했습니다.
- source_word: וְהָיִיתִי לְרוּחַ שֶׁקֶר
  english_pob_choice: and become a lying spirit
  chosen_korean: 거짓 영이 되겠습니다
  alternatives_korean:
  - 거짓의 영이 되겠습니다
  - 거짓말하는 영이 되겠습니다
  lexicon: HALOT
  rationale: he/was-become의 술어적 용법을 반영해 ‘되다’로 옮겼고, רוּחַ שֶׁקֶר은 POB의 ‘lying spirit’에 맞춰 ‘거짓 영’으로 직역했습니다.
- source_word: תּוּכָל
  english_pob_choice: you will also succeed
  chosen_korean: 또한 네가 성공할 것입니다
  alternatives_korean:
  - 또한 네가 이길 것입니다
  - 또한 네가 이룰 것입니다
  lexicon: HALOT
  rationale: יכל의 핵심은 단순 가능이 아니라 실제로 일을 이뤄냄이므로, POB의 ‘succeed’를 한국어의 ‘성공하다’로 옮겨 화자의 승인 뉘앙스를 살렸습니다.
- source_word: כָּל נְבִיאָיו
  english_pob_choice: all his prophets
  chosen_korean: 그의 모든 예언자들
  alternatives_korean:
  - 그의 모든 선지자들
  - 그의 모든 예언자들
  lexicon: HALOT
  rationale: ‘נביאים’은 문맥상 아합의 예언자들을 가리키므로, 본문적 직역인 ‘예언자들’을 택해 교회 전통어 ‘선지자’보다 용어의 중립성을 유지했습니다.
theological_decisions:
- issue: 악한 영의 파견과 하나님의 허용이 드러나는 장면을 완곡하게 만들지 않을지
  chosen_reading: 본문의 불편한 긴장을 유지해, 거짓 영이 예언자들 입에 들어가게 되는 진술을 그대로 옮겼습니다.
  alternative_readings:
  - ‘거짓말하는 영’으로 완화해 도덕적 거리를 두는 번역
  - ‘속이는 영’으로만 옮겨 행위의 결과를 약화하는 번역
  rationale: 히브리어와 POB 둘 다 장면의 직설성을 유지하므로, 번역에서도 신학적 긴장을 희석하지 않는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
