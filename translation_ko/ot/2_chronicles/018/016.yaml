source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפוֹצִ֣ים עַל הֶֽ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ן רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “like sheep without a shepherd.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “These have no masters.” Some translations smooth the plural to “no master” or “no lord.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말하였습니다. 「나는 온 이스라엘이 산들 위에 흩어져 있는 것을 보았습니다. 목자가 없는 양들 같았습니다. 야훼께서 말씀하셨습니다. ‘이들에게는 주인들이 없습니다. 각 사람은 평안히 자기 집으로 돌아가게 하십시오.’」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “양들처럼, 목자가 없는”에 가깝습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 복수형은 문자적으로 “주인들”입니다. 일부 번역은 이를 단수화하여 “주인” 또는 “주”로 매끈하게 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפוֹצִים
  english_pob_choice: scattered
  chosen_korean: 흩어져 있는
  alternatives_korean:
  - 흩어진
  - 분산된
  lexicon: HALOT
  rationale: 분사형 상태를 한국어에서 자연스럽게 살리면서, 전쟁 패배 후 이스라엘이 여기저기 흩어진 모습을 전달합니다.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  english_pob_choice: like sheep that have no shepherd
  chosen_korean: 목자가 없는 양들 같았습니다
  alternatives_korean:
  - 목자가 없는 양과 같았습니다
  - 목자 없는 양들 같았습니다
  lexicon: HALOT
  rationale: 비유를 직역에 가깝게 유지하되 한국어로 읽기 자연스럽게 다듬었습니다. '목자'는 문맥상 지도자 부재의 이미지도 함께 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥의 고유한 신명은 대체 호칭이 아니라 음역형 '야훼'로 옮겨, 본문의 인칭적 신명 사용을 드러냅니다.
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  english_pob_choice: These have no masters
  chosen_korean: 이들에게는 주인들이 없습니다
  alternatives_korean:
  - 이들에게는 주인이 없습니다
  - 이들에게는 통치자가 없습니다
  lexicon: HALOT
  rationale: 히브리어 복수형 אֲדֹנִים을 반영해 복수 '주인들'로 옮겼습니다. 여기서는 하나님 호칭이 아니라 지도력 부재를 말하는 정치적 표현입니다.
theological_decisions:
- issue: “주인들”의 복수 유지
  chosen_reading: 복수형을 살려 '주인들이 없습니다'로 번역했습니다.
  alternative_readings:
  - '''주인이 없습니다''로 단수화'
  - '''지도자가 없습니다''로 의미만 옮김'
  rationale: 본문은 왕이 없는 상태에서의 무주관(無主官) 상태를 강조하므로, 히브리어 복수형을 평탄화하지 않고 보존하는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: '형태론적 보존 원칙: 히브리어 복수형 אֲדֹנִים'
- issue: 직접화법 안의 어조
  chosen_reading: 야훼의 직접 화법은 명령형 '돌아가게 하십시오'로 옮겼습니다.
  alternative_readings:
  - '''돌아가라''로 평서적 명령'
  - '''돌아가게 됩니다''로 서술화'
  rationale: 예언적 직접 화법의 명령성을 살리되, 한국어 합쇼체의 공식성을 유지했습니다.
  doctrine_reference: 대화체/예언체 문체 보존
