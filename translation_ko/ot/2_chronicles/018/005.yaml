  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''into the hand of the king.'' The phrase is an idiom meaning into the king''s power or control.'
    reason: lexical_alternative
  - marker: b
    text: The prophets answer, 'Go up, and God will give it into the hand of the king.' Hebrew leaves 'the king' unspecified rather than saying 'your hand.'
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 왕은 예언자들[a] 사백 명을 모아 놓고 그들에게 물었습니다. "우리가 길르앗 라못으로 올라가 싸워야 합니까, 아니면 제가 그만두어야 합니까?" 그들이 대답했습니다. "올라가십시오[b]. 하나님이 그것을 왕의 손에 넘기실 것입니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘예언자들’입니다. 전통적 한국어 성경의 ‘선지자들’ 대신 원어의 직능을 드러내기 위해 이렇게 옮겼습니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어는 단순히 ‘올라가라’라고 말하며, 목적어를 ‘너의 손에’로 바꾸지 않습니다. 따라서 왕의 손을 가리키는 일반적 표현을 유지했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ / gathered
  english_pob_choice: gathered
  chosen_korean: 모아 놓고
  alternatives_korean:
  - 모으고
  - 소집하고
  lexicon: HALOT
  rationale: קבץ의 기본 의미를 살리면서, 왕이 예언자들을 불러 의견을 묻는 장면을 자연스럽게 드러내기 위해 ‘모아 놓고’로 옮겼습니다.
- source_word: הַנְּבִאִים / the prophets
  english_pob_choice: the prophets
  chosen_korean: 예언자들
  alternatives_korean:
  - 선지자들
  - 예언자들 무리
  lexicon: HALOT
  rationale: 히브리어 נביאים의 직접 대응으로 ‘예언자들’을 택했습니다. 한국 교회 전통어 ‘선지자들’보다 원어의 기능을 더 직접적으로 드러냅니다.
- source_word: עֲלֵה / Go up
  english_pob_choice: Go up
  chosen_korean: 올라가십시오
  alternatives_korean:
  - 올라가라
  - 진군하십시오
  lexicon: HALOT
  rationale: עלה의 기본 동사상을 유지하되, 군사적 맥락에서 왕에게 하는 응답으로 공손한 명령형을 사용했습니다.
- source_word: בְּיַד הַמֶּלֶךְ / into the hand of the king
  english_pob_choice: into the hand of the king
  chosen_korean: 왕의 손에
  alternatives_korean:
  - 왕의 권세에
  - 왕의 힘 아래
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 그대로 살려 ‘왕의 손에’로 옮겼습니다. 이는 단순한 소유가 아니라 통제권/지배권의 의미를 보존합니다.
theological_decisions:
- issue: 히브리어가 말하는 ‘왕’의 지시 대상
  chosen_reading: ‘왕의 손에’라는 표현을 그대로 유지하여, 어느 왕인지 한국어에서 추가로 지정하지 않았습니다.
  alternative_readings:
  - 이스라엘 왕의 손으로 구체화하기
  - 아합을 가리키는 왕으로 풀어쓰기
  rationale: 본문은 פשוט히 ‘왕’이라고만 말하므로, 병행본문의 정보를 끌어와 지시 대상을 확정하지 않고 원문의 여지를 보존했습니다.
  doctrine_reference: 본문이 열어 둔 지시의 긴장을 해소하지 않고 유지합니다.
