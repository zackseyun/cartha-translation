- from: 그때 전차대의 지휘관들이 그가 이스라엘의 왕이 아님을 보고, 그를 따르는 일을 멈추고 되돌아갔습니다.[a]
  to: 전차대의 지휘관들은 그가 이스라엘의 왕이 아닌 것을 보고, 그의 뒤를 쫓다가 돌아갔습니다.[a]
  rationale: 시간절의 중복을 제거하고, 히브리어의 ‘그의 뒤에서 돌아가다’라는 추격 관용구를 자연스러운 한국어로 간결하게 반영했습니다. 추격 대상이 이스라엘 왕이 아님을 알아차린 인물이라는 원문의 문맥상 지시는 유지했습니다.
