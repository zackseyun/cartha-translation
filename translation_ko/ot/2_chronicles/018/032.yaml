id: 2CH.18.32
reference: 2 Chronicles 18:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּ֥י לֹא הָיָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יָּשֻׁ֖בוּ מֵ/אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
  footnotes:
  - marker: a
    text: Hebrew literally, 'they turned back from after him,' an idiom meaning they stopped following or pursuing him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 전차대의 지휘관들이 그가 이스라엘의 왕이 아님을 보고, 그를 따르는 일을 멈추고 되돌아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 뒤에서 돌아섰다’는 뜻으로, 추격을 멈추었다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  english_pob_choice: And when ... saw
  chosen_korean: 그때 … 보고
  alternatives_korean:
  - 그리고 … 보았을 때
  - …을 보자
  lexicon: HALOT
  rationale: 서사 연결과 시간절을 자연스러운 현대 한국어로 옮기되, 히브리어의 사건 진행을 유지하기 위해 ‘그때’와 동사형을 사용했습니다.
- source_word: שָׂרֵי הָרֶכֶב
  english_pob_choice: the commanders of the chariots
  chosen_korean: 전차대의 지휘관들
  alternatives_korean:
  - 전차들의 지휘관들
  - 전차병력의 지휘관들
  lexicon: HALOT
  rationale: שָׂרֵי의 군사 지휘자 의미와 הָרֶכֶב의 전차 부대를 함께 반영하여, 현대어로는 ‘전차대의 지휘관들’이 가장 자연스럽습니다.
- source_word: מֵאַחֲרָיו
  english_pob_choice: from following him
  chosen_korean: 그를 따르는 일을 멈추고 되돌아갔습니다
  alternatives_korean:
  - 그 뒤를 따라가다 그만두고 되돌아갔습니다
  - 그의 뒤에서 물러나 되돌아갔습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그 뒤에서’이지만, POB의 주석처럼 추격을 멈추는 관용구이므로 한국어에서는 그 의미를 분명히 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 왕의 식별을 둘러싼 서술의 분명함
  chosen_reading: ‘그가 이스라엘의 왕이 아님’을 전차대가 알아차린 것으로 옮겼습니다.
  alternative_readings:
  - ‘그것이 이스라엘의 왕이 아님’
  - ‘이 사람이 이스라엘의 왕이 아님’
  rationale: 히브리어는 목적대상 지시가 간접적이지만, 문맥상 추격 대상인 인물(여호사밧)을 가리키므로 자연스러운 인칭 대명사를 보충했습니다.
  doctrine_reference: 내러티브 문맥 해석
