translation:
  language: ko
  text: 그리고 이렇게 말하십시오. ‘왕이 이렇게 말씀하십니다. 이 사람을 감옥에 넣고, 내가 평안히 돌아올 때까지 고난의 빵과 고난의 물을 주십시오.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘환난의 빵과 환난의 물’, 곧 감옥 생활의 고난과 궁핍을 나타내는 제한된 배급을 가리킵니다.
    reason: lexical_alternative
