  text: וַ/אֲמַרְתֶּ֗ם כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ שִׂ֥ימוּ זֶ֖ה בֵּ֣ית הַ/כֶּ֑לֶא וְ/הַאֲכִלֻ֜/הוּ לֶ֤חֶם לַ֨חַץ֙ וּ/מַ֣יִם לַ֔חַץ עַ֖ד שׁוּבִ֥/י בְ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/026.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
  footnotes:
  - marker: a
    text: Or 'bread of distress and water of distress,' that is, reduced rations associated with imprisonment and hardship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이렇게 말하십시오. ‘왕이 이렇게 말씀하십니다. 이 사람을 감옥에 넣고, 내가 평안히 돌아올 때까지 고난의 빵과 고난의 물로 먹이십시오.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고난의 빵과 고난의 물’, 곧 감옥의 고된 배급과 어려움을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  english_pob_choice: and say
  chosen_korean: 그리고 이렇게 말하십시오
  alternatives_korean:
  - 그리고 말하십시오
  - 그다음 말하십시오
  lexicon: HALOT
  rationale: 왕의 명령에 이어지는 전달 지시로 이해하여, 한국어에서는 공손한 명령형인 ‘말하십시오’로 자연스럽게 옮겼습니다.
- source_word: בֵּית הַכֶּלֶא
  english_pob_choice: in the prison
  chosen_korean: 감옥에
  alternatives_korean:
  - 감옥 안에
  - 구금소에
  lexicon: HALOT
  rationale: 직역형 ‘감옥의 집’보다 한국어에서는 기능을 분명히 하는 ‘감옥에’가 가장 자연스럽고 명확합니다.
- source_word: לֶחֶם לַחַץ / וּמַיִם לַחַץ
  english_pob_choice: bread of affliction / water of affliction
  chosen_korean: 고난의 빵과 고난의 물
  alternatives_korean:
  - 환난의 빵과 환난의 물
  - 고통의 빵과 고통의 물
  - 곤궁의 빵과 곤궁의 물
  lexicon: HALOT
  rationale: POB의 ‘affliction’에 대응해 ‘고난’을 택해, 감옥의 제한된 배급과 압박이라는 의미를 살리면서도 한국어에서 이해 가능하도록 했습니다.
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  english_pob_choice: until I return in peace
  chosen_korean: 내가 평안히 돌아올 때까지
  alternatives_korean:
  - 내가 평안 가운데 돌아올 때까지
  - 내가 안전히 돌아올 때까지
  lexicon: HALOT
  rationale: ‘בְשָׁלוֹם’은 단순한 정서적 평안보다 무사한 귀환을 포함하므로, 한국어에서는 ‘평안히’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 왕의 공식 전달문 속 명령체와 인용부 처리
  chosen_reading: 직접 인용을 따옴표로 구분하고, 왕의 발화를 공적인 명령문체로 유지했습니다.
  alternative_readings:
  - 간접화법으로 풀어 쓰기
  - 따옴표 없이 서술문으로 처리하기
  rationale: 본문은 전령에게 전달할 공식 명령문이므로, 문체를 흐리지 않기 위해 직접 인용 구조를 유지하는 것이 소스에 더 충실합니다.
  doctrine_reference: 문체/담화 관찰
