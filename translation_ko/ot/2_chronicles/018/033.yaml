  edition: WLC
  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּךְ֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לָֽ/רַכָּ֗ב הֲפֹ֧ךְ ידי/ך וְ/הוֹצֵאתַ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
  footnotes:
  - marker: a
    text: Or 'without aiming' / 'in his innocence.' The Hebrew לְתֻמּוֹ can denote simplicity or innocence, but in this battle context it most likely means the archer shot without specific aim.
    reason: lexical_alternative
  - marker: b
    text: Literally 'Turn your hand.' The expression likely means to turn the chariot around or maneuver it away from the fighting.
    reason: lexical_alternative
  - marker: c
    text: Or 'between the joints of the armor and the breastplate.' The exact armor terminology is uncertain, but the sense is that the arrow found a gap in the king's armor.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 한 사람이 우연히 활을 당겨 이스라엘 왕을 갑옷의 이음매와 흉갑 사이에 맞혔습니다[a]. 그러자 왕이 병거를 모는 사람에게 말했습니다. “손을 돌려 나를 진 밖으로 데리고 나가십시오[b][c]. 내가 다쳤습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아무 목표 없이’. 히브리어 לְתֻמּוֹ는 ‘순전함’이나 ‘순박함’도 뜻할 수 있지만, 이 전투 문맥에서는 특정 표적 없이 쏘았다는 뜻으로 보는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘손을 돌려’입니다. 여기서는 병거의 방향을 바꾸거나 전투 지역에서 벗어나게 하라는 뜻으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 갑옷 용어는 정확한 세부가 불확실하지만, 뜻은 왕의 갑옷 사이의 빈틈에 화살이 들어갔다는 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  english_pob_choice: But a man
  chosen_korean: 그런데 한 사람이
  alternatives_korean:
  - 그리고 한 사람이
  - 또 한 사람이
  lexicon: HALOT
  rationale: 서술의 급전환을 살리되, 한국어에서는 사건 전개의 반전과 새 장면 진입을 자연스럽게 보이도록 ‘그런데’로 옮겼습니다.
- source_word: מָשַׁךְ בַּקֶּשֶׁת לְתֻמּוֹ
  english_pob_choice: drew his bow at random
  chosen_korean: 우연히 활을 당겨
  alternatives_korean:
  - 아무 목표 없이 활을 당겨
  - 의도 없이 활을 당겨
  lexicon: HALOT
  rationale: 전쟁 문맥에서 לְתֻמּוֹ는 도덕적 ‘순전함’이 아니라 특정 표적 없이 쏜다는 뜻이므로, ‘우연히’로 핵심을 간결하게 전달했습니다.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  english_pob_choice: between the scale armor and the breastplate
  chosen_korean: 갑옷의 이음매와 흉갑 사이에
  alternatives_korean:
  - 갑옷의 조각들 사이와 흉갑 사이에
  - 갑옷의 관절 사이와 흉갑 사이에
  lexicon: HALOT
  rationale: 정확한 갑옷 용어가 불확실하므로, POB의 주석 취지를 반영해 ‘틈’의 의미를 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: לָרַכָּב
  english_pob_choice: to the charioteer
  chosen_korean: 병거를 모는 사람에게
  alternatives_korean:
  - 병거꾼에게
  - 전차병에게
  lexicon: HALOT
  rationale: 고대 전차를 한국어 독자에게 바로 이해되게 하되, 직역보다 의미 전달이 분명한 ‘병거를 모는 사람’으로 처리했습니다.
- source_word: הֲפֹךְ יָדֶיךָ
  english_pob_choice: Turn your hand
  chosen_korean: 손을 돌려
  alternatives_korean:
  - 방향을 돌려
  - 손을 바꿔
  lexicon: HALOT
  rationale: 히브리어의 직설적 관용구를 살리되, 한국어에서는 병거의 방향 전환을 자연스럽게 떠올리게 하는 표현으로 옮겼습니다.
- source_word: הָחֳלֵיתִי
  english_pob_choice: for I am wounded
  chosen_korean: 내가 다쳤습니다
  alternatives_korean:
  - 내가 상했습니다
  - 내가 부상을 입었습니다
  lexicon: HALOT
  rationale: 원문은 부상으로 약해진 상태를 가리키므로, 과도한 강세 없이 현재 상태를 직접적으로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 우연한 화살이 왕을 맞히는 사건의 신학적 함의
  chosen_reading: 본문은 인간의 무작위로 보이는 행동 속에서도 사건의 결과가 결정적으로 진행됨을 서술적으로 보여 주며, 본문 자체는 여기서 하나님의 직접 언급을 덧붙이지 않습니다.
  alternative_readings:
  - 단순한 운의 사건으로 읽기
  - 암시된 섭리로 읽기
  rationale: 히브리어는 화살이 ‘우연히’ 날아간 것처럼 보이는 사건을 말하지만, 본문은 그 의미를 노골적으로 해설하지 않으므로 서술의 절제를 유지했습니다.
  doctrine_reference: 섭리론(Providence)과 본문 내 서술 절제
