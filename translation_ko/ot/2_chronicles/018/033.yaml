  - 또 한 사람이
  lexicon: HALOT
  rationale: 서술의 급전환을 살리되, 한국어에서는 사건 전개의 반전과 새 장면 진입을 자연스럽게 보이도록 ‘그런데’로 옮겼습니다.
- source_word: מָשַׁךְ בַּקֶּשֶׁת לְתֻמּוֹ
  english_pob_choice: drew his bow at random
  chosen_korean: 우연히 활을 당겨
  alternatives_korean:
  - 아무 목표 없이 활을 당겨
