  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּךְ֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לָֽ/רַכָּ֗ב הֲפֹ֧ךְ ידי/ך וְ/הוֹצֵאתַ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
  footnotes:
  - marker: a
    text: Or 'without aiming' / 'in his innocence.' The Hebrew לְתֻמּוֹ can denote simplicity or innocence, but in this battle context it most likely means the archer shot without specific aim.
    reason: lexical_alternative
  - marker: b
    text: Literally 'Turn your hand.' The expression likely means to turn the chariot around or maneuver it away from the fighting.
    reason: lexical_alternative
  - marker: c
    text: Or 'between the joints of the armor and the breastplate.' The exact armor terminology is uncertain, but the sense is that the arrow found a gap in the king's armor.
    reason: cultural_note
translation:
  language: ko
  text: 그런데 한 사람이 특정한 표적을 겨누지 않고 활을 쏘아 이스라엘 왕을 갑옷의 이음새와 흉갑 사이에 맞혔습니다[a]. 그러자 왕이 병거를 모는 사람에게 말했습니다. “손을 돌려 나를 진영 밖으로 데리고 나가십시오[b][c]. 내가 부상을 입었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아무 목표 없이’. 히브리어 לְתֻמּוֹ는 ‘순전함’이나 ‘순박함’도 뜻할 수 있지만, 이 전투 문맥에서는 특정 표적을 겨누지 않고 쏘았다는 뜻으로 보는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘손을 돌려’입니다. 여기서는 병거의 방향을 바꾸거나 전투 지역에서 벗어나게 하라는 뜻으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 갑옷 용어는 정확한 세부가 불확실하지만, 뜻은 왕의 갑옷 사이의 빈틈에 화살이 들어갔다는 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  english_pob_choice: But a man
  chosen_korean: 그런데 한 사람이
  alternatives_korean:
