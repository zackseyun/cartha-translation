    rationale: לְתֻמּוֹ는 여기서 궁수의 도덕적 상태가 아니라 특정 표적을 의도하지 않은 발사를 가리키며, מָשַׁךְ בַּקֶּשֶׁת은 문맥상 활을 쏜 행위입니다.
