translation:
  language: ko
  text: 그러자 미가야가 말했습니다. “야훼께서 살아 계심을 두고 맹세하지만, 내 하나님께서 말씀하시는 것은 무엇이든지 내가 말하겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘야훼께서 살아 계십니다. 내 하나님께서 말씀하시는 것은 무엇이든지, 바로 그것을 내가 말하겠습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מִיכָיְהוּ
  english_pob_choice: But Micaiah said
  chosen_korean: 그러자 미가야가 말했습니다
  alternatives_korean:
  - 그리고 미가야가 말했습니다
  - 그때 미가야가 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형은 단순한 동시 진행보다 앞선 요청에 대한 응답·대조의 흐름을 이루므로, 한국어에서는 ‘그러자’로 자연스럽게 살렸습니다. 인명 מִיכָיְהוּ는 통용 표기 ‘미가야’로 옮겼습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심과 같이
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 삶으로 맹세합니다
  lexicon: HALOT
  rationale: 히브리어의 전형적인 맹세 공식이므로, 단순 서술이 아니라 맹세의 힘이 드러나도록 ‘…하심과 같이’로 옮겼습니다. יְהוָה는 이 프로젝트 기본 원칙에 따라 ‘야훼’로 렌더링했습니다.
- source_word: אֱלֹהַי
  english_pob_choice: my God
  chosen_korean: 내 하나님
  alternatives_korean:
  - 나의 하나님
  - 내가 섬기는 하나님
  lexicon: HALOT
  rationale: 1인칭 단수 소유격을 분명히 드러내기 위해 ‘내 하나님’으로 옮겼습니다. 이는 미가야의 व्यक्तिगत한 충성과 예언자적 권위를 함께 보존합니다.
- source_word: אֲדַבֵּר
  english_pob_choice: I will speak
  chosen_korean: 내가 그대로 말하겠습니다
  alternatives_korean:
  - 내가 말하겠습니다
  - 내가 그대로 전하겠습니다
  lexicon: HALOT
  rationale: דבר의 예언자적 발화는 단순 ‘말하다’보다 ‘그대로 말하다’가 맥락상 더 적절하여, 하나님이 말씀하시는 내용을 변개 없이 전달하겠다는 뜻을 드러냈습니다. ‘전하다’보다 직접 발화성을 살리기 위해 ‘말하겠습니다’를 선택했습니다.
theological_decisions:
- issue: 맹세 공식에서 야훼 이름을 어떻게 드러낼지
  chosen_reading: 야훼께서 살아 계심과 같이
  alternative_readings:
  - 야훼는 살아 계십니다
  - 주님께서 살아 계심과 같이
  rationale: 원문은 여호와 하나님의 생존을 근거로 한 서약이므로, 제목형 ‘주님’보다 고유명 ‘야훼’를 유지하는 것이 서약의 직접성과 언약적 무게를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
