  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 맹세 공식 חַי יְהוָה는 한국어에서 ‘야훼께서 살아 계심을 두고 맹세하지만’으로 풀어야 서약의 기능이 자연스럽고 분명하게 드러납니다. 또한 ‘그대로’는 원문에 명시되지 않은 ‘변개 없이’의 뜻을 보태므로 삭제하는 것이 안전합니다.
  naturalness: ‘야훼께서 살아 계심과 같이’는 현대 한국어의 자연스러운 맹세 표현으로는 다소 어색합니다. ‘…살아 계심을 두고 맹세하지만’은 합쇼체의 엄숙한 직접 발화로 자연스럽습니다.
  terminology: ‘미가야’, ‘야훼’, ‘내 하나님’은 원문 및 프로젝트의 명명 원칙에 부합합니다. ‘말하겠습니다’는 אֲדַבֵּר의 직접 발화 의미를 충분히 보존합니다.
