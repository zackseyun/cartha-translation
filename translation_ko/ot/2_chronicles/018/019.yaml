  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יֹּ֕אמֶר זֶ֚ה אֹמֵ֣ר כָּ֔כָה וְ/זֶ֖ה אֹמֵ֥ר כָּֽכָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
  footnotes:
  - marker: a
    text: Or 'deceive' or 'persuade' for 'entice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 말씀하셨습니다[a] “누가 이스라엘 왕 아합을 꾀어 그가 올라갔다가 길르앗 라못에서 쓰러지게 하겠느냐?” 그러자 어떤 이는 이렇게 말하고, 또 어떤 이는 저렇게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속이다’, ‘설득하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신적 고유명사를 제목어로 바꾸지 않고 음역하여, POB의 ‘Yahweh’ 선택과 원문의 인칭성을 그대로 살렸습니다.
- source_word: יְפַתֶּה
  english_pob_choice: will entice
  chosen_korean: 꾀어
  alternatives_korean:
  - 유혹하여
  - 설득하여
  - 속여
  lexicon: HALOT
  rationale: 이 동사는 상황에 따라 ‘설득하다/속이다/꾀다’의 범위를 가지므로, 아합을 잘못된 결말로 이끄는 맥락을 살리면서도 본문이 요구하는 모호성을 유지하는 ‘꾀어’를 선택했습니다.
- source_word: וְיִפֹּל
  english_pob_choice: and fall
  chosen_korean: 쓰러지게 하겠느냐
  alternatives_korean:
  - 엎드러지게 하겠느냐
  - 죽게 하겠느냐
  - 패하게 하겠느냐
  lexicon: HALOT
  rationale: 직역상 ‘떨어지다/넘어지다’이지만 전투 문맥에서 패배와 죽음을 포함할 수 있어, 한국어로는 결과를 드러내는 ‘쓰러지게 하다’가 가장 자연스럽습니다.
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  english_pob_choice: And one said this, and another said that
  chosen_korean: 어떤 이는 이렇게 말하고, 또 어떤 이는 저렇게 말했습니다
  alternatives_korean:
  - 한 이는 이렇다고 말하고, 다른 이는 저렇다고 말했습니다
  - 이 사람은 이렇게, 저 사람은 저렇게 말했습니다
  lexicon: HALOT
  rationale: 천상 회의의 병렬 대비를 한국어의 자연스러운 대조 구문으로 옮겨, POB의 반복 구조와 서로 다른 제안을 함께 제시하는 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 야훼가 아합의 몰락을 주도적으로 논의하시는 표현
  chosen_reading: 질문형을 완화하지 않고, 야훼께서 누가 아합을 꾀어 올라가게 할지 묻는 직접 발화를 그대로 옮겼습니다.
  alternative_readings:
  - 허용형으로 완화하여 ‘누가 아합을 유혹하도록 하겠느냐’로 옮김
  - 간접화하여 ‘아합이 미혹되게 할 사람을 찾으셨다’로 옮김
  rationale: 원문은 야훼의 주권적 주도성을 분명히 드러내므로, 그 긴장을 해소하지 않고 본문의 직접성을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
