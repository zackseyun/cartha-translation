  to: 야훼께서 말씀하셨습니다[a]. “누가 이스라엘 왕 아합을 꾀어, 그가 길르앗 라못으로 올라가 쓰러지도록 하겠느냐?” 그러자 어떤 이는 이렇게 말하고, 또 어떤 이는 저렇게 말했습니다.
  rationale: 원문의 신명, 아합의 왕호, פתה의 의미 범위, 그리고 길르앗 라못에서의 몰락이라는 내용을 보존했습니다. ‘올라갔다가’를 ‘올라가’로 수정하여 히브리어의 목적/결과 관계를 반영하고, 문장을 최소한으로 다듬었습니다.
