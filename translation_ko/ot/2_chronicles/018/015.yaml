  rationale: 히브리어 본문이 테트라그라마톤을 직접 사용하므로, 본문 보존성과 감사 가능성을 위해 전통적 대체어보다 ‘야훼’를 채택했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
