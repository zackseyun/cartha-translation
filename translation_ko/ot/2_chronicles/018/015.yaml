  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: ko
  text: 그러자 왕이 그에게 말했습니다. “내가 몇 번이나 당신에게, 야훼의 이름으로 오직 진실만을 내게 말하라고 맹세시켜야 하겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속으로 이어지는 서술 전개를 한국어에서 자연스럽게 앞선 사건의 다음 순서를 나타내는 표현으로 옮겼습니다.
- source_word: עַד כַּמֶּה פְעָמִים
  english_pob_choice: How many times
  chosen_korean: 몇 번이나
  alternatives_korean:
  - 얼마나 자주
  - 몇 차례나
  lexicon: HALOT
  rationale: 반복에 대한 짜증 섞인 질문이므로, 현대 한국어에서 가장 자연스러운 반복 횟수 표현으로 옮겼습니다.
- source_word: מַשְׁבִּיעֶךָ
  english_pob_choice: must I make you swear
  chosen_korean: 맹세하게 해야 하겠습니까
  alternatives_korean:
  - 맹세시키려 해야 하겠습니까
  - 맹세하라고 해야 하겠습니까
  lexicon: HALOT
  rationale: 히필형 שבע의 ‘맹세하게 하다/맹세시키다’의 강제성을 살리되, 왕의 조급함과 압박감을 반영하는 한국어로 옮겼습니다.
- source_word: רַק אֱמֶת
  english_pob_choice: nothing but the truth
  chosen_korean: 오직 진실만을
  alternatives_korean:
  - 진실만을
  - 다만 진실만을
  lexicon: HALOT
  rationale: רַק의 배타성을 한국어의 ‘오직 ...만’ 구조로 살렸고, אֱמֶת는 이 문맥에서 단순한 사실성보다 ‘진실’이 자연스럽습니다.
- source_word: בְּשֵׁם יְהוָה
  english_pob_choice: in the name of Yahweh
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 야훼의 이름 안에서
  - 야훼 이름으로
  lexicon: HALOT
  rationale: 본문이 여호와/야훼의 이름을 직접 사용하므로, 프로젝트 기본어휘에 따라 ‘야훼’로 옮기고 ‘이름으로’는 맹세의 권위 영역을 표현했습니다.
theological_decisions:
