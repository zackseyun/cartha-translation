id: 2CH.18.34
reference: 2 Chronicles 18:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תַּ֤עַל הַ/מִּלְחָמָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וּ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הָיָ֨ה מַעֲמִ֧יד בַּ/מֶּרְכָּבָ֛ה נֹ֥כַח אֲרָ֖ם עַד הָ/עָ֑רֶב וַ/יָּ֕מָת לְ/עֵ֖ת בּ֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
  footnotes:
  - marker: a
    text: Or, 'at sunset' or 'when the sun went down.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 전투는 더욱 격렬해졌습니다. 이스라엘 왕은 저녁까지 아람을 마주한 채 병거 안에 서 있었고, 해가 질 때 죽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해 질 무렵에’ 또는 ‘일몰 때에’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  english_pob_choice: the battle intensified
  chosen_korean: 그 전투는 … 더욱 격렬해졌습니다
  alternatives_korean:
  - 그 전투는 치열해졌습니다
  - 그 싸움은 더 거세졌습니다
  - 전투가 고조되었습니다
  lexicon: HALOT
  rationale: עלה가 전투를 주어로 받을 때는 단순한 ‘올라가다’보다 전투의 격화·고조를 뜻하므로, 자연스러운 합쇼체로 ‘더욱 격렬해졌습니다’를 택했습니다.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: the king of Israel
  chosen_korean: 이스라엘 왕
  alternatives_korean:
  - 이스라엘의 왕
  - 이스라엘 임금
  lexicon: HALOT
  rationale: 직역 관계를 유지하면서도 한국어 서술에서 자연스럽게 읽히는 관형 구조로 옮겼습니다.
- source_word: מַעֲמִיד בַּמֶּרְכָּבָה
  english_pob_choice: remained standing in the chariot
  chosen_korean: 병거에 서 있었고
  alternatives_korean:
  - 병거에 서 있었습니다
  - 병거 안에 버티고 있었고
  - 병거에 선 채로
  lexicon: HALOT
  rationale: היה + 분사는 지속 상태를 나타내므로 ‘서 있었습니다’로 옮기되, 문맥상 부상에도 불구하고 자세를 유지한 상태를 드러냈습니다. ‘병거’는 전통적이면서도 원문의 전차를 가리키는 표준 번역입니다.
- source_word: נֹכַח אֲרָם
  english_pob_choice: facing Aram
  chosen_korean: 아람을 마주한 채
  alternatives_korean:
  - 아람을 향해
  - 아람 앞에서
  - 아람을 대면한 채
  lexicon: HALOT
  rationale: נכח는 ‘마주하다/앞에 있다’의 뜻이므로, 전투 배치의 대치 상태를 살리는 ‘마주한 채’를 선택했습니다.
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  english_pob_choice: at the time of the sun’s going down
  chosen_korean: 해가 지는 때에
  alternatives_korean:
  - 해 질 무렵에
  - 해가 질 때
  - 일몰 무렵에
  lexicon: HALOT
  rationale: 원문은 ‘해가 내려오는/지는’ 동작을 비교적 분명히 표현하므로, 축약된 관용어보다 동작성을 보존한 표현을 택했습니다.
theological_decisions:
- issue: 서술의 종결과 시간 표현의 직역성
  chosen_reading: 사건의 진행을 그대로 따라가며, ‘해가 지는 때’라는 시간표현을 보존했습니다.
  alternative_readings:
  - ‘일몰 무렵에’처럼 더 관용적인 표현
  - ‘해 질 때’처럼 더 간결한 표현
  rationale: 이 절은 신학적 해석이 크게 개입되는 본문이 아니라 서술의 정확성이 중요하므로, 시간표현을 축약하지 않고 원문 동작성을 드러내는 방향을 택했습니다.
  doctrine_reference: 성서 서술의 역사성 및 문맥 충실성
