revisions:
- from: 그리고 그 전투는 그날 더욱 격렬해졌습니다. 이스라엘 왕은 저녁까지 아람을 마주한 채 병거에 서 있었고, 해가 지는 때에 죽었습니다.[a]
  to: 그날 전투는 더욱 격렬해졌습니다. 이스라엘 왕은 저녁까지 아람을 마주한 채 병거 안에 서 있었고, 해가 질 때 죽었습니다.[a]
  rationale: 문장의 시간 표현을 자연스러운 한국어 어순으로 조정하고, 병거 안이라는 공간 관계를 명확히 했습니다. ‘해가 질 때’는 לְעֵת בּוֹא הַשָּׁמֶשׁ의 동작적 시간 표현을 보존하며, 각주에는 간결한 대안 표현을 제시했습니다.
