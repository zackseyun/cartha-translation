  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
  footnotes:
  - marker: a
    text: Or, 'through whom we may inquire of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 왕이 여호사밧에게 말하였습니다. “그를 통해 야훼께 여쭐 사람이 아직 한 사람 있습니다. 그러나 나는 그를 미워합니다. 그는 내게 좋은 것은 예언하지 않고 언제나 나쁜 것만 예언하기 때문입니다. 그는 이므라의 아들 미가야입니다.” 여호사밧이 말하였습니다. “왕께서는 그렇게 말씀하지 마십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  english_pob_choice: There is still one man
  chosen_korean: 아직 한 사람 더 있습니다
  alternatives_korean:
  - 아직 한 사람이 있습니다
  - 아직 한 사람만 남아 있습니다
  lexicon: HALOT
  rationale: עֹוד + אִישׁ אֶחָד는 ‘아직/여전히 한 사람’의 잔여 가능성을 나타내므로, 자연스러운 현대 한국어로 ‘아직 한 사람 더 있습니다’로 옮겨 남아 있는 인물의 존재감을 살렸습니다.
- source_word: לִ/דְרוֹשׁ אֶת יְהוָה מֵ/אֹתוֹ
  english_pob_choice: by whom we may inquire of Yahweh
  chosen_korean: 야훼께 문의할
  alternatives_korean:
  - 야훼를 찾을
  - 그를 통해 야훼께 묻을
  lexicon: HALOT
  rationale: דרשׁ는 여기서 예언자에게서 야훼의 뜻을 ‘묻다/문의하다’는 뜻이므로, 중간 매개를 드러내면서도 한국어에서 자연한 ‘문의하다’를 택했습니다.
- source_word: וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ
  english_pob_choice: but I hate him
  chosen_korean: 그러나 나는 그를 미워합니다
  alternatives_korean:
  - 그리고 나는 그를 미워합니다
  - 나는 그를 미워합니다
  lexicon: HALOT
  rationale: 완료형은 고정된 태도를 가리키므로, 현재형 ‘미워합니다’가 지속적인 감정을 가장 잘 드러냅니다. 앞뒤 대조를 따라 ‘그러나’를 보탰습니다.
- source_word: כִּֽי אֵינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה
  english_pob_choice: because he never prophesies good concerning me, but always evil
  chosen_korean: 그는 내게 좋은 일은 예언하지 않고, 늘 나쁜 일만 예언하기 때문입니다
  alternatives_korean:
  - 그는 내게 좋은 것을 예언하지 않고, 늘 해로운 것만 예언하기 때문입니다
  - 그는 내게 복된 일은 예언하지 않고, 늘 악한 일만 예언하기 때문입니다
  lexicon: HALOT
  rationale: 좋음/나쁨의 대조를 직역하기보다, 예언 내용의 성격을 한국어 관용에 맞게 풀어 ‘좋은 일/나쁜 일’로 옮겼습니다. ‘늘’은 반복적·상습적 의미를 살립니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 옮길지
  chosen_reading: יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - the LORD를 반영해 ‘주님’으로 처리
  - ‘여호와’ 사용
  rationale: 본문이 신명기적 서술 속에서도 하나님의 고유 이름을 직접 사용하므로, 대체 칭호보다 음역 ‘야훼’가 स्रोत의 직접성을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
