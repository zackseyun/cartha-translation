id: 2CH.18.22
reference: 2 Chronicles 18:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: ko
  text: 이제 보십시오. 야훼께서 이 당신의 예언자들의 입에 거짓 영을 넣으셨고, 야훼께서 당신에게 재앙을 말씀하셨습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘보십시오’는 הִנֵּה의 주의 환기 기능을 살린 번역입니다.
    reason: korean_style_note
  - marker: b
    text: ‘거짓 영’은 영어 본문의 “lying spirit”를 따라, 영적 존재의 성격과 거짓의 속성을 함께 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה / And now
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 지금
  - 이제는
  lexicon: עַתָּה
  rationale: 전환을 나타내는 접속부사로서, 문맥의 판정 선언을 자연스럽게 여는 ‘이제’를 택했습니다.
- source_word: הִנֵּה / look
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오요
  lexicon: הִנֵּה
  rationale: 청자에게 주의를 환기하는 감탄/호명 용법이므로, 합쇼체에 맞게 ‘보십시오’로 옮겼습니다.
- source_word: רוּחַ שֶׁקֶר
  english_pob_choice: a lying spirit
  chosen_korean: 거짓 영
  alternatives_korean:
  - 거짓말하는 영
  - 거짓된 영
  lexicon: רוּחַ
  rationale: ‘spirit’의 영적 존재성을 살리면서도 ‘lying’의 성격을 ‘거짓’으로 직접 드러내어, 본문의 위장된 예언의 원인을 분명히 했습니다.
- source_word: רָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 불행
  - 화
  lexicon: רָעָה
  rationale: יהוה의 घोषित된 심판 결과를 가리키는 말이므로, 도덕적 악보다 재난·심판의 뉘앙스가 분명한 ‘재앙’을 선택했습니다.
theological_decisions:
- issue: יהוה의 주권적 허용과 거짓 영의 관계
  chosen_reading: 야훼께서 거짓 영을 ‘넣으셨다’는 표현을 그대로 유지했습니다.
  alternative_readings:
  - 야훼께서 허락하셨다
  - 야훼께서 보내셨다
  rationale: 히브리어의 직접적 인과 표현을 약화시키지 않고, 본문이 드러내는 심판의 주권성을 그대로 전달하기 위해서입니다.
  doctrine_reference: 섭리와 심판에 대한 성경적 진술(왕상 22장 병행 본문 포함)
