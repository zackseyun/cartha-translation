  text: וְ/הַ/מַּלְאָ֞ךְ אֲשֶׁר הָלַ֣ךְ לִ/קְרֹ֣א לְ/מִיכָ֗יְהוּ דִּבֶּ֤ר אֵלָי/ו֙ לֵ/אמֹ֔ר הִנֵּ֞ה דִּבְרֵ֧י הַ/נְּבִאִ֛ים פֶּֽה אֶחָ֥ד ט֖וֹב אֶל הַ/מֶּ֑לֶךְ וִֽ/יהִי נָ֧א דְבָרְ/ךָ֛ כְּ/אַחַ֥ד מֵ/הֶ֖ם וְ/דִבַּ֥רְתָּ טּֽוֹב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: Now the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'with one mouth,' an idiom meaning in complete agreement or with one voice.
    reason: lexical_alternative
translation:
  language: ko
  text: 미가야를 부르러 갔던 사자가 그에게 말했습니다. “보십시오, 예언자들의 말은 한목소리로[a] 왕에게 유리합니다. 당신의 말도 그들의 말 가운데 하나처럼 되게 하시고, 왕에게 유리하게 말씀하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘한 입으로’이며, 완전한 일치 또는 한목소리를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  english_pob_choice: messenger
  chosen_korean: 사자
  alternatives_korean:
  - 메신저
  - 천사
  lexicon: HALOT
  rationale: 이 문맥에서는 미가야를 부르러 간 인간 사절이므로, ‘사자’가 원문의 인물 기능을 가장 직접적으로 살립니다.
- source_word: לִקְרֹא
  english_pob_choice: to summon
  chosen_korean: 부르다
  alternatives_korean:
  - 소집하다
  - 소환하다
  lexicon: HALOT
  rationale: 왕 앞에 나오게 하는 공식적 호출이라는 점을 드러내되, 한국어에서 지나치게 관료적으로 들리지 않도록 했습니다.
- source_word: פֶּה אֶחָד
  english_pob_choice: with one mouth
  chosen_korean: 한 입으로
  alternatives_korean:
  - 한 목소리로
  - 일제히
  lexicon: HALOT
  rationale: POB가 유지한 관용구의 이미지인 ‘one mouth’를 살려, 의미를 평탄화하지 않고 본문 질감을 보존했습니다.
- source_word: טוֹב אֶל הַמֶּלֶךְ / וְדִבַּרְתָּ טּוֹב
  english_pob_choice: favorable to the king / speak favorably
  chosen_korean: 왕에게 좋다고 / 좋게 말하십시오
  alternatives_korean:
  - 왕에게 유익하다고
  - 왕에게 호의적으로
  lexicon: HALOT
  rationale: 여기서 ‘좋다’는 도덕적 선이 아니라 왕에게 유리하고 듣기 좋은 말을 가리키므로, 같은 어근의 반복을 한국어에서도 유지했습니다.
theological_decisions:
- issue: 예언 발화에 대한 촉구의 뉘앙스
  chosen_reading: “좋게 말하십시오”로 옮겨, 예언자를 왕의 입맛에 맞추도록 압박하는 장면을 그대로 드러냈습니다.
  alternative_readings:
  - “좋은 말만 하십시오”
  - “왕에게 유리하게 말하십시오”
  rationale: 이 구절의 긴장은 단순한 친절 요청이 아니라 예언 내용을 조정하라는 압력입니다. 이를 약화하지 않기 위해 직접적인 권고를 유지했습니다.
  doctrine_reference: 예언의 진실성과 인간 권력의 압력이라는 성경적 긴장
- issue: 직접화법의 공손성
  chosen_reading: 직접화법 전체를 현대 한국어 합쇼체로 유지했습니다.
  alternative_readings:
  - 명령형 반말
  - 고어체
  rationale: 본문의 정중한 권유(נָא)를 현대 독자가 즉시 이해할 수 있게 하면서도, 계시적 말투를 과장하지 않기 위해 합쇼체를 택했습니다.
  doctrine_reference: 본문 화행과 담화 톤의 보존
