revisions:
- from: 그 사자를 보낸 이가 미가야에게 와서 말했습니다. “보십시오, 예언자들의 말이 한 입으로 왕에게 좋다고 말하고 있습니다. 당신의 말도 그들 중 하나처럼 되게 하시고, 좋게 말하십시오.”[a]
  to: 미가야를 부르러 갔던 사자가 그에게 말했습니다. “보십시오, 예언자들의 말은 한목소리로[a] 왕에게 유리합니다. 당신의 말도 그들의 말 가운데 하나처럼 되게 하시고, 왕에게 유리하게 말씀하십시오.”
  rationale: 원문의 행위자는 ‘미가야를 부르러 갔던 사자’로 바로잡았습니다. פֶּה אֶחָד은 현대 한국어 관용 표현인 ‘한목소리로’로 옮기고 직역은 각주에서 보존했습니다. 두 차례의 טוֹב은 왕에게 유리한 예언을 하라는 압력이라는 문맥을 반영하여 일관되게 ‘왕에게 유리하다/유리하게 말씀하다’로 번역했습니다. כְּאַחַד מֵהֶם은 선행하는 예언자들의 말과의 비교를 자연스럽게 드러내도록 ‘그들의 말 가운데 하나처럼’으로 표현했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:17:15Z'
