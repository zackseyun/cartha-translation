  to: 그러자 이스라엘 왕이 한 궁정 관리[a]를 불러 말했습니다. 「어서 임라의 아들 미가야를 데려오시오.」
  rationale: The revision makes Micaiah, identified as Imla’s son, unambiguously the object of the king’s command. It also uses a contextually appropriate Korean rendering for the semantically broad title סָרִיס and places the lexical-alternative footnote at its proper anchor.
