  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
  footnotes:
  - marker: a
    text: Or “one eunuch” or “a court official”; the Hebrew term can refer either to a literal eunuch or more generally to a royal officer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘 왕이 한 내시를 불러 말했습니다. 「어서 미가야, 임라의 아들을 데려오시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סָרִיס는 문자적으로는 ‘내시’를 뜻하지만, 문맥에 따라 더 넓게 ‘궁정 관리’나 ‘왕실 신하’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
