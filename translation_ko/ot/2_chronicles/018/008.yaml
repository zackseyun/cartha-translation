  lexicon: HALOT
  rationale: 히브리어 סָרִיס는 문자적으로 ‘내시’일 수 있고, 더 넓게는 궁정 관리를 가리킬 수 있습니다. 본문은 기능보다 호칭을 먼저 드러내므로, 본문 어휘를 살려 ‘내시’를 기본으로 옮겼습니다.
- source_word: מַהֵר
  english_pob_choice: Quickly bring
