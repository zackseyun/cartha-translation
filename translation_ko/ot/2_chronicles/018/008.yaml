  lexicon: HALOT
  rationale: 급박한 명령의 뉘앙스를 살리되, 한국어에서 명령형으로 자연스럽고 과도하게 거칠지 않은 표현으로 옮겼습니다.
- source_word: מיכהו בֶן יִמְלָא
  english_pob_choice: Micaiah son of Imla
  chosen_korean: 미가야, 임라의 아들
