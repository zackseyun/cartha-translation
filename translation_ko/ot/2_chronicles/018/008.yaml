  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
  footnotes:
  - marker: a
    text: Or “one eunuch” or “a court official”; the Hebrew term can refer either to a literal eunuch or more generally to a royal officer.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘 왕이 한 궁정 관리[a]를 불러 말했습니다. 「어서 임라의 아들 미가야를 데려오시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סָרִיס는 문자적으로는 ‘내시’를 뜻할 수 있으며, 더 넓게는 ‘궁정 관리’나 ‘왕실 신하’를 가리키기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
