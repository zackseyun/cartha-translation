  - 미가야, 임라의 아들
  lexicon: HALOT
  rationale: 인명은 통용되는 한국어 음역을 따르고, 아버지 이름은 히브리어의 직계 계보 표현을 그대로 반영했습니다.
theological_decisions:
- issue: סָרִיס의 번역에서 신분적 함의를 어느 정도 드러낼지
  chosen_reading: ‘내시’를 본문 번역에 두고, 문맥상 궁정 관리일 수도 있다는 해석 가능성은 발주문맥이 아닌 주해 차원에 남깁니다.
  alternative_readings:
  - ‘관리’로 완화
  - ‘궁정 관리’로 기능만 번역
  rationale: 사무 기능만 강조하면 히브리어 어휘가 가진 문자적 긴장이 사라집니다. 본문은 용어 자체를 그대로 유지해 독자가 원문 어휘의 폭을 보게 하는 편이 좋습니다.
  doctrine_reference: 본문 비평/어휘 의미 보존 원칙
