base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
  footnotes:
  - marker: a
    text: 'Or, more idiomatically, ''Your people are my people.'' The Hebrew wording is literally comparative: ''and as your people, my people.'''
    reason: lexical_alternative
  - marker: b
    text: The final clause is elliptical in Hebrew, literally 'and with you in the battle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 왕 아합이 유다 왕 여호사밧에게 말했습니다. “나와 함께 길르앗 라못으로 가시겠습니까?” 여호사밧이 그에게 대답했습니다. “저는 왕과 같고, 제 백성은 왕의 백성과 같습니다[a]. 전쟁에서도 왕과 함께하겠습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 동사를 생략한 비교 병렬로, 직역하면 ‘그리고 왕의 백성과 같은 제 백성’입니다. 더 관용적으로는 ‘왕의 백성은 제 백성입니다’라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 동사가 생략된 짧은 구로, 직역하면 ‘그리고 왕과 함께 전쟁에서’입니다.
    reason: lexical_alternative
