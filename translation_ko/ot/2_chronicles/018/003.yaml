base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
  footnotes:
  - marker: a
    text: 'Or, more idiomatically, ''Your people are my people.'' The Hebrew wording is literally comparative: ''and as your people, my people.'''
    reason: lexical_alternative
  - marker: b
    text: The final clause is elliptical in Hebrew, literally 'and with you in the battle.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 아합, 곧 이스라엘의 왕이 여호사밧, 곧 유다의 왕에게 말하되, 「나와 함께 길르앗 라못으로 가시겠습니까?」 하니, 그가 그에게 말하되, 「저는 당신과 같습니다. 제 백성은 당신의 백성과 같습니다[a]. 저는 전쟁에서 당신과 함께 있겠습니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 백성은 제 백성입니다’에 가까운 비교적 병렬입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 동사를 생략한 짧은 구로, 직역하면 ‘그리고 당신과 함께 전쟁에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  english_pob_choice: to Jehoshaphat king of Judah
  chosen_korean: 여호사밧, 곧 유다의 왕에게
  alternatives_korean:
  - 유다 왕 여호사밧에게
  - 유다의 왕 여호사밧에게
  lexicon: HALOT
  rationale: 호칭 구조를 자연스럽게 풀되, ‘유다의 왕’이라는 왕호를 보존해 원문의 인물 식별을 분명히 했습니다.
- source_word: הֲתֵלֵךְ עִמִּי
  english_pob_choice: Will you go with me
  chosen_korean: 나와 함께 길르앗 라못으로 가시겠습니까?
  alternatives_korean:
  - 나와 함께 가시겠습니까?
  - 나와 함께 오시겠습니까?
  lexicon: HALOT
  rationale: 질문형 הֲ + הלך + עִם의 동행 요청을 직접적으로 살려 ‘가시겠습니까?’로 옮겼고, 목적지인 ‘길르앗 라못’도 본문 흐름상 함께 제시했습니다.
- source_word: כָּמוֹנִי כָמוֹךָ וּכְעַמְּךָ עַמִּי
  english_pob_choice: I am as you are, and my people as your people
  chosen_korean: 저는 당신과 같습니다. 제 백성은 당신의 백성과 같습니다
  alternatives_korean:
  - 저는 당신처럼입니다. 제 백성은 당신의 백성과 같습니다
  - 당신의 백성이 제 백성입니다
  lexicon: HALOT
  rationale: 히브리어의 비교적 병렬을 유지해 ‘…와 같습니다’로 옮겼습니다. 후자의 더 자연스러운 ‘당신의 백성이 제 백성입니다’는 원문의 비교·대응 구조를 다소 평준화합니다.
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  english_pob_choice: and I am with you in the battle
  chosen_korean: 저는 전쟁에서 당신과 함께 있겠습니다
  alternatives_korean:
  - 전쟁에서 당신과 함께하겠습니다
  - 당신과 함께 전쟁에 있겠습니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 동사를 한국어에서는 보충해야 하므로, 동행의 의지를 드러내는 미래형으로 자연스럽게 풀었습니다. ‘전쟁에서’는 전치사적 관계를, ‘함께 있겠습니다’는 결속을 살립니다.
theological_decisions:
- issue: 회답의 register and diplomatic politeness
  chosen_reading: 여호사밧의 응답은 왕에게 하는 정중한 합쇼체로 유지했습니다.
  alternative_readings:
  - 더 평평한 진술체
  - 구어체로 완화한 표현
  rationale: 본문은 왕 대 왕의 정치적·외교적 대화이므로, 한국어에서도 예의와 긴장을 유지하는 것이 화용적 의미를 잘 보존합니다.
  doctrine_reference: 서사 화용론 / 직설 발화의 사회적 거리 보존
