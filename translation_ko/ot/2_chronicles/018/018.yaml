  lexicon: HALOT
  rationale: 하나님의 왕좌 이미지에 맞는 현재 진행적 상태를 살리면서, 하나님을 가리키는 존대 표현을 사용했습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: יַהְוֶה를 ‘야훼’로 음역합니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 표기
  rationale: 본문에 יְהוָה가 직접 나오므로 칭호가 아니라 고유 신명으로 보존하는 것이 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하늘 군대의 성격
  chosen_reading: ‘하늘의 모든 군대’로 옮겨 천상 회의의 군집적 장면을 드러냅니다.
  alternative_readings:
  - ‘하늘의 모든 천사들’
  - ‘하늘의 모든 군상’
  rationale: צְבָא는 단순한 ‘천사’보다 질서정연한 군대/부대의 이미지를 더 직접적으로 담으므로, 원문의 궁정적·군사적 긴장을 유지합니다.
  doctrine_reference: POB source rendering principle
