base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''all the host of heaven''; alternatively, ''all the heavenly host'' or ''all the army of heaven.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말하였습니다. 「그러므로 야훼의 말씀을 들으십시오. 내가 야훼께서 보좌에 앉아 계신 것과 하늘의 모든 군대가 그 오른편과 왼편에 서 있는 것을 보았습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘하늘의 모든 군대’입니다. POB 영어는 이를 ‘all the host of heaven’으로 옮겼으며, 문맥상 ‘하늘의 모든 천군’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 발언에 대한 결론·귀결을 나타내는 연결어로, 예언적 선언의 논리적 전환을 분명히 드러냅니다.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  english_pob_choice: hear the word of Yahweh
  chosen_korean: 야훼의 말씀을 들으십시오
  alternatives_korean:
  - 야훼의 말씀을 들으시오
  - 야훼의 말을 들으십시오
  lexicon: HALOT
  rationale: דְבַר יְהוָה는 정형화된 예언 공식이므로 ‘말씀’을 유지했고, 복수 명령형의 호소는 공적인 청중을 향한 공손한 명령으로 옮겼습니다.
- source_word: כָל צְבָא הַשָּׁמַיִם
  english_pob_choice: all the host of heaven
  chosen_korean: 하늘의 모든 군대
  alternatives_korean:
  - 하늘의 모든 군사들
  - 하늘의 모든 천군
  lexicon: HALOT
  rationale: צָבָא의 기본 의미인 군대/군무 집단을 살려, 천상 회의 장면의 집합성과 질서를 드러내는 표현으로 옮겼습니다.
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  english_pob_choice: at his right hand and at his left
  chosen_korean: 그 오른편과 왼편에
  alternatives_korean:
  - 그 오른쪽과 왼쪽에
  - 그 오른손과 왼손에
  lexicon: HALOT
  rationale: 왕좌 주변의 궁정적 위치 관계를 자연스러운 한국어로 재현하되, 오른편/왼편의 대칭성을 보존했습니다.
- source_word: יוֹשֵׁב
  english_pob_choice: sitting
  chosen_korean: 앉아 계신
  alternatives_korean:
  - 앉아 있는
  - 좌정하신
  lexicon: HALOT
  rationale: 하나님의 왕좌 이미지에 맞는 현재 진행적 상태를 살리면서, 하나님을 가리키는 존대 표현을 사용했습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: יַהְוֶה를 ‘야훼’로 음역합니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 표기
  rationale: 본문에 יְהוָה가 직접 나오므로 칭호가 아니라 고유 신명으로 보존하는 것이 원문 가시성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하늘 군대의 성격
  chosen_reading: ‘하늘의 모든 군대’로 옮겨 천상 회의의 군집적 장면을 드러냅니다.
  alternative_readings:
  - ‘하늘의 모든 천사들’
  - ‘하늘의 모든 군상’
  rationale: צְבָא는 단순한 ‘천사’보다 질서정연한 군대/부대의 이미지를 더 직접적으로 담으므로, 원문의 궁정적·군사적 긴장을 유지합니다.
  doctrine_reference: POB source rendering principle
