  chosen_korean: 잡아서
  alternatives_korean:
  - 데려가서
  - 붙잡아서
  lexicon: HALOT
  rationale: 명령형의 직접성을 살리되 한국어에서 가장 자연스럽게 체포·연행의 뉘앙스를 전달하는 표현을 택했습니다.
- source_word: וַהֲשִׁיבֻהוּ
  english_pob_choice: return him
  chosen_korean: 돌려보내십시오
  alternatives_korean:
  - 되돌려 보내십시오
  - 보내십시오
  lexicon: HALOT
  rationale: 히필 שוב의 ‘돌려보내다/돌려보내게 하다’라는 인과적 의미를 반영했습니다.
- source_word: שַׂר הָעִיר
  english_pob_choice: the governor of the city
  chosen_korean: 성읍의 총독
  alternatives_korean:
  - 성읍의 장관
  - 성읍의 지휘관
  - 성읍의 관리
  lexicon: HALOT
  rationale: 이 문맥의 שַׂר는 군사 지휘관보다 행정 책임자를 가리키는 것으로 보이며, 현대 한국어에서는 ‘총독’이 그 직함적 성격을 가장 간결하게 살립니다.
- source_word: בֶּן הַמֶּלֶךְ
  english_pob_choice: the king’s son
  chosen_korean: 왕의 아들
  alternatives_korean:
  - 왕의 아들자손
  - 왕자
  lexicon: HALOT
  rationale: 문자적 친족 관계를 유지해 히브리어 표현을 그대로 드러냈습니다. ‘왕자’는 해석을 덧붙이는 표현이어서 피했습니다.
theological_decisions:
- issue: 직함 표현을 인명보다 앞세운 서술 방식
  chosen_reading: 이스라엘 왕이라는 직함을 유지해, 본문이 아합의 이름보다 왕권 행위를 전면에 내세운 서술을 반영했습니다.
  alternative_readings:
  - 아합이 말했습니다
  - 이스라엘의 왕 아합이 말했습니다
  rationale: 히브리어 본문은 여기서 개인명보다 왕의 지위를 강조합니다. 이를 보존하면 본문의 법적·정치적 긴장감이 더 분명해집니다.
  doctrine_reference: 본문 서술 구조 보존
