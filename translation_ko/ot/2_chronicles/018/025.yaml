  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
  footnotes:
  - marker: a
    text: Or “the commander of the city.” The Hebrew title can denote a civic or military official.
    reason: lexical_alternative
  - marker: b
    text: Or “son of the king.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 왕이 말했습니다[a]. 「미가야를 잡아서, 그를 성읍의 총독 아몬과 왕의 아들 요아스에게로 돌려보내십시오[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘의 왕이 말했습니다.” 히브리어는 개인명보다 직함을 사용합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “성읍의 지휘관” / “왕의 아들.” 히브리어 직함과 친족 표현의 범위를 반영한 번역 여지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: the king of Israel
  chosen_korean: 이스라엘 왕
  alternatives_korean:
  - 이스라엘의 왕
  lexicon: HALOT
  rationale: 히브리어의 소유·관계 구조를 자연스러운 현대 한국어로 옮기면서도, 인칭 이름 대신 직함을 유지했습니다.
