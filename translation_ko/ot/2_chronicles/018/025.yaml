  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
  footnotes:
  - marker: a
    text: Or “the commander of the city.” The Hebrew title can denote a civic or military official.
    reason: lexical_alternative
  - marker: b
    text: Or “son of the king.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘 왕이 말했습니다. 「미가야를 데려가 성읍의 관리 아몬[a]과 왕의 아들 요아스에게 돌려보내십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성읍의 지휘관.” 히브리어 직함은 행정 관리나 군사 지휘관을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
