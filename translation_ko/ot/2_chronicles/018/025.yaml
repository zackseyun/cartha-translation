  rationale: 문자적 친족 관계를 유지해 히브리어 표현을 그대로 드러냈습니다. ‘왕자’는 해석을 덧붙이는 표현이어서 피했습니다.
theological_decisions:
- issue: 직함 표현을 인명보다 앞세운 서술 방식
  chosen_reading: 이스라엘 왕이라는 직함을 유지해, 본문이 아합의 이름보다 왕권 행위를 전면에 내세운 서술을 반영했습니다.
  alternative_readings:
  - 아합이 말했습니다
  - 이스라엘의 왕 아합이 말했습니다
  rationale: 히브리어 본문은 여기서 개인명보다 왕의 지위를 강조합니다. 이를 보존하면 본문의 법적·정치적 긴장감이 더 분명해집니다.
