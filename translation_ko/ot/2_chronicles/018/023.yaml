  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
  footnotes:
  - marker: a
    text: Or, “By which way did the Spirit of the LORD pass from me to speak to you?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그나아나의 아들 시드기야가 가까이 와서 미가야의 뺨을 치며 말했습니다. “야훼의 영이 내게서 어떤 길로 지나가 너에게 말했느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “야훼의 영이 내게서 어떤 길로 지나가 너에게 말했느냐?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  english_pob_choice: came near
  chosen_korean: 가까이 와서
  alternatives_korean:
  - 다가와서
  - 나아와서
  lexicon: HALOT
  rationale: 대면 장면의 물리적 접근을 살리되, 현대 한국어에서 자연스럽고 긴장감을 유지하는 표현으로 옮겼습니다.
- source_word: וַיַּךְ אֶת מִיכָיְהוּ עַל הַ לֶּחִי
  english_pob_choice: struck Micaiah on the cheek
  chosen_korean: 미가야의 뺨을 치며
  alternatives_korean:
  - 미가야의 뺨을 때리며
  - 미가야를 뺨에 맞히며
  lexicon: HALOT
  rationale: נכה의 기본적 의미인 ‘치다/때리다’를 살리되, 한국어에서는 얼굴을 치는 동작을 가장 자연스럽게 드러내는 ‘뺨을 치며’로 옮겼습니다.
- source_word: רוּחַ יְהוָה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 여호와의 영
  - 주님의 영
  lexicon: HALOT
  rationale: 본문의 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, רוּחַ는 이 문맥에서 하나님의 영을 가리키므로 ‘영’으로 번역했습니다.
- source_word: אֵי זֶה הַדֶּרֶךְ עָבַר
  english_pob_choice: Which way did ... pass
  chosen_korean: 어떤 길로 지나가
  alternatives_korean:
  - 어느 길로 지나가
  - 무슨 경로로 지나가
  lexicon: HALOT
  rationale: ‘어떤 길로’는 히브리어의 도상적 질문을 살리면서도 한국어로 자연스럽고, עָבַר의 이동·통과 이미지를 ‘지나가’로 보존합니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 텔라트라그램 יְהוָה를 직접 사용하므로, POB 기본 원칙에 따라 고유 신명 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
