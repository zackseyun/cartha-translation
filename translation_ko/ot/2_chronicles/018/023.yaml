  source_fidelity: 히브리어는 시드기야가 가까이 다가가 미가야의 뺨을 친 뒤, 야훼의 영이 자기에게서 미가야에게 말씀하시러 ‘어느 길로’ 떠나갔는지를 빈정거리며 묻는 내용입니다. 초안의 ‘어떤 길로 지나가’는 목적지와 출발점을 잇는 동작으로 한국어에서 다소 어색하므로 ‘내게서 떠나’로 옮겨 이동의 의미와 문맥상 도전을 명료하게 했습니다.
  naturalness: ‘뺨을 치며 말했습니다’는 두 동작의 동시성을 암시할 수 있습니다. 사건의 연속을 자연스럽게 나타내도록 ‘뺨을 때리고 말했습니다’로 다듬었습니다. ‘어느 길로’는 이 도상적·수사적 질문에 자연스럽습니다.
  terminology: 고유명사 ‘그나아나’, ‘시드기야’, ‘미가야’와 신명 ‘야훼’는 유지했습니다. רוּחַ יְהוָה는 예언 문맥에 맞게 ‘야훼의 영’으로 유지하고, 그 영의 발화에는 한국어의 통상적인 높임 표현 ‘말씀하셨느냐’를 사용했습니다.
  issues:
