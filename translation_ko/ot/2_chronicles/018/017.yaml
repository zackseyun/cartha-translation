  source_fidelity: 인용문의 수신자는 히브리어 אֵלֶיךָ(‘당신에게’)이며, 예언자는 3인칭입니다. 초안의 ‘내가 그에게’는 여호사밧을 가리켜야 할 2인칭을 3인칭으로 바꾸므로 수정이 필요합니다. 또한 עָלַי는 예언의 대상이 ‘나에 관하여’임을 나타냅니다.
  naturalness: ‘그러자’, ‘이스라엘 왕’, ‘말했습니다’는 현대 표준어 합쇼체 서사에 자연스럽습니다. 직접 인용에서는 ‘당신에게’와 ‘나에 관하여’를 사용하면 지시 대상과 문장 관계가 분명해집니다.
  terminology: ‘예언하다’는 יִתְנַבֵּא에 적절합니다. טוֹב/לְרָע의 대조는 ‘좋은 것/나쁜 것’으로 보존하되, 본문 문맥상 아합에게 유리하거나 불리한 예언이라는 뜻이 드러납니다. 대안 각주에서는 לְרָע의 문맥적 의미인 ‘재앙’을 제시할 수 있습니다.
