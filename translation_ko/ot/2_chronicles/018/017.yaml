- from: 그러자 이스라엘 왕이 여호사밧에게 말했습니다. “내가 그에게 내게 좋은 것을 예언하지 않고 오직 해로운 것만 예언할 것이라고 말하지 않았습니까?”[a]
  to: 그러자 이스라엘 왕이 여호사밧에게 말했습니다. “내가 당신에게, 그가 나에 관하여 좋은 것은 예언하지 않고 오직 나쁜 것만 예언할 것이라고 말하지 않았습니까?”[a]
  rationale: 수신 대명사를 원문의 2인칭에 맞게 ‘당신에게’로 바로잡았습니다. ‘나에 관하여’를 보충하여 예언의 대상이 아합 자신임을 명료하게 했으며, 히브리어의 ‘좋은 것/나쁜 것’ 대조는 본문에서 유지했습니다. 각주는 문법을 정리하고 영어 감사 기록의 ‘disaster’ 대안을 반영했습니다.
