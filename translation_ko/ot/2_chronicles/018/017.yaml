  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
  footnotes:
  - marker: a
    text: Or 'he would not prophesy anything good about me, but only disaster.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘 왕이 여호사밧에게 말했습니다. “내가 당신에게, 그가 나에 관하여 좋은 것은 예언하지 않고 오직 나쁜 것만 예언할 것이라고 말하지 않았습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 나에 관하여 좋은 것은 아무것도 예언하지 않고 오직 재앙만 예언할 것’이라고 옮길 수 있습니다.
    reason: לְרָע의 문맥적 의미를 ‘재앙’으로 옮긴 대안입니다.
