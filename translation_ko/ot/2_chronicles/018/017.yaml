  english_pob_choice: he would not prophesy good concerning me, but only evil
  chosen_korean: 내게 좋은 것을 예언하지 않고 오직 해로운 것만 예언할 것
  alternatives_korean:
  - 내게 좋은 것을 예언하지 않고 오직 악한 것만 예언할 것
