translation:
  language: ko
  text: 그러자 이스라엘 왕이 여호사밧에게 말했습니다. “내가 그에게 내게 좋은 것을 예언하지 않고 오직 해로운 것만 예언할 것이라고 말하지 않았습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게 좋은 것을 아무것도 예언하지 않고 오직 재앙만 예언할 것’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
