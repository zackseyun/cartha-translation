  lexicon: HALOT
  rationale: 수사 의문문을 한국어의 확인 요청형으로 옮겨, 앞서 이미 경고했다는 뉘앙스를 유지했습니다.
theological_decisions:
- issue: ‘טוֹב / לְרָע’의 의미 범위
  chosen_reading: 윤리적 선악으로 풀지 않고, 예언 내용이 자신에게 유리한지 불리한지에 초점을 둔 ‘좋은 것 / 해로운 것’으로 번역했습니다.
  alternative_readings:
  - 좋은 ... 악한
  - 유익한 ... 해로운
  - 좋은 ... 재앙
  rationale: 본문은 예언의 도덕성을 논하기보다 아합이 미가야의 예언을 불리한 말로 받아들이는 장면입니다. 따라서 히브리어 대조를 보존하면서도 문맥상 의도를 더 정확히 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §5
