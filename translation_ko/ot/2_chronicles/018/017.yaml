  lexicon: HALOT
  rationale: ‘טוֹב’와 ‘לְרָע’의 대조를 살리되, 한국어에서는 자연스러운 관용으로 ‘좋은 것 / 해로운 것’으로 옮겨 Ahab의 불평이라는 문맥을 드러냈습니다.
