  source_fidelity: 히브리어는 두 왕이 각각 보좌에 앉아 있고, 옷을 입은 채 사마리아 성문 입구의 타작마당에 다시 ‘앉아’ 있으며, 모든 예언자가 그들 앞에서 예언하는 장면을 제시합니다. 초안은 이 요소들과 ‘앉다’의 반복을 대체로 충실히 보존합니다.
