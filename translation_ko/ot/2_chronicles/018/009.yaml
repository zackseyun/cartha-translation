base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: Now the king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
  footnotes:
  - marker: a
    text: Or 'And the king of Israel.' The Hebrew conjunction can be rendered either 'and' or, in English narrative style, 'now.'
    reason: alternative_reading
  - marker: b
    text: Or 'arrayed in robes.' The Hebrew says literally 'clothed in garments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 왕과 유다 왕 여호사밧이 각기 자기 보좌에 앉아 있었으며, 옷을 입은 채 사마리아 성문 어귀에 있는 타작마당에 앉아 있었고, 모든 예언자들은 그들 앞에서 예언하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘앉아 있다’라는 표현을 반복하여 장면을 이어 보여 줍니다.
    reason: source_note
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל / וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  english_pob_choice: Now the king of Israel and Jehoshaphat king of Judah
  chosen_korean: 이스라엘 왕과 유다 왕 여호사밧
  alternatives_korean:
  - 이스라엘 왕과 여호사밧 유다 왕
  - 이스라엘 왕과 유다의 왕 여호사밧
  lexicon: WLC; POB audit trail
  rationale: 히브리어의 나열 구조를 자연스럽게 옮기되, 여호사밧의 왕호는 한국어 어순에 맞게 뒤로 보내지 않고 앞의 관형구로 정리했습니다.
- source_word: יוֹשְׁבִים אִישׁ עַל כִּסְאֹו
  english_pob_choice: were sitting, each on his throne
  chosen_korean: 각기 자기 보좌에 앉아 있었는데
  alternatives_korean:
  - 각자 자기 왕좌에 앉아 있었는데
  - 각기 자기 의자에 앉아 있었는데
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미를 ‘각기’로 살리고, כִּסֵּא는 왕적 문맥에서 ‘보좌’가 본문의 위엄을 유지하면서도 과장되지 않는 대응입니다.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  english_pob_choice: clothed in garments
  chosen_korean: 옷을 입은 채
  alternatives_korean:
  - 의복을 입은 채
  - 겉옷을 걸친 채
  lexicon: HALOT
  rationale: 문자적으로는 ‘옷들로 입혀진’이지만 한국어에서는 중복을 줄여도 공적 장면의 외형을 충분히 보존하므로, POB의 직역적 의미를 간결하게 반영했습니다.
- source_word: בְּגֹרֶן פֶּתַח שַׁעַר שֹׁמְרוֹן
  english_pob_choice: at the threshing floor at the entrance of the gate of Samaria
  chosen_korean: 사마리아 성문 어귀의 타작마당에
  alternatives_korean:
  - 사마리아 성문의 입구 타작마당에
  - 사마리아 성문 어귀에 있는 타작마당에
  lexicon: HALOT
  rationale: ‘타작마당’과 ‘성문 어귀’의 두 공간 표지를 모두 살려, 장소가 성문 입구 부근의 타작마당이라는 본문 정보를 유지했습니다.
- source_word: מִתְנַבְּאִים לִפְנֵיהֶם
  english_pob_choice: were prophesying before them
  chosen_korean: 모든 예언자들은 그들 앞에서 예언하고 있었습니다
  alternatives_korean:
  - 모든 예언자들은 그들 앞에서 예언하고 있었습니다
  - 모든 예언자들은 그들 면전에서 예언하고 있었습니다
  lexicon: HALOT
  rationale: מִתְנַבֵּא의 행위성을 살려 ‘예언하고 있었습니다’로 옮기고, לִפְנֵיהֶם은 ‘앞에서’로 평이하게 대응했습니다.
theological_decisions:
- issue: 왕과 예언자들의 공개적 배치와 문맥적 긴장
  chosen_reading: 두 왕이 공적 심판/의례의 자리처럼 보이는 공간에 앉아 있고, 예언자들이 그들 앞에서 발화하는 장면을 그대로 드러냈습니다.
  alternative_readings:
  - 단순히 회의 장면으로 완화해 옮기기
  - ‘왕좌’ 대신 ‘의자’로 낮추어 권위감을 약화시키기
  rationale: 본문은 권력과 예언의 공개적 대면을 시각적으로 강조하므로, 이를 완화하지 않고 공간적·위계적 긴장을 유지하는 것이 स्रोत의 의도를 더 잘 반영합니다.
  doctrine_reference: 왕권과 예언자적 발화의 긴장 구조(열왕기상/역대기 맥락)
