base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
  footnotes:
  - marker: a
    text: Or 'the LORD has not spoken through me.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew has 'peoples' (plural), a broader prophetic form of address than simply 'people.'
    reason: lexical_alternative
translation:
  language: ko
  text: 미가야가 말했습니다. “네가 정말로 평안히 돌아오면, 야훼께서 나를 통해 말씀하신 것이 아닙니다.”[a] 그가 또 말했습니다. “모든 민족들아,[b] 들으십시오!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 내게 말씀하신 것이 아닙니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘민족들’(복수형)로 되어 있어, 단수 ‘백성’보다 더 넓은 예언적 호명을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָיְהוּ
  english_pob_choice: Micaiah
  chosen_korean: 미가야
  alternatives_korean:
  - 미가야후
  lexicon: 표준 외래어 표기
  rationale: 히브리어 고유명사는 한국어 성경에서 널리 정착된 형태인 ‘미가야’를 따르는 것이 자연스럽고 인지 가능성이 높습니다.
- source_word: אִם שׁוֹב תָּשׁוּב בְּשָׁלוֹם
  english_pob_choice: If you indeed return in peace
  chosen_korean: 네가 정말로 평안히 돌아오면
  alternatives_korean:
  - 네가 반드시 평안히 돌아오면
  - 네가 평안히 돌아오기만 하면
  lexicon: HALOT
  rationale: 이 조건문은 단순한 반환 여부가 아니라 ‘정말로/반드시’라는 강조를 담고 있어 이를 살리면서도 한국어 문장으로 자연스럽게 옮겼습니다.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  english_pob_choice: Yahweh has not spoken by me
  chosen_korean: 야훼께서는 나를 통해 말씀하지 않으신 것입니다
  alternatives_korean:
  - 야훼께서는 나를 통해 말씀하지 않으신 것입니다
  - 야훼께서 내게 말씀하지 않으신 것입니다
  lexicon: HALOT
  rationale: ‘בִּי’를 단순한 수단/매개 표현으로 반영해 ‘나를 통해’로 옮겼고, 예언의 진위를 가르는 선언적 문맥을 살리기 위해 종결을 단정형으로 처리했습니다.
- source_word: עַמִּים כֻּלָּם
  english_pob_choice: all you peoples
  chosen_korean: 모든 민족들아
  alternatives_korean:
  - 모든 백성들아
  - 모든 민족들아, 들으라
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘peoples’를 평면적인 단수 ‘백성’으로 줄이지 않고, 예언적 호명의 범위를 넓게 드러내는 ‘민족들’로 옮겼습니다.
theological_decisions:
