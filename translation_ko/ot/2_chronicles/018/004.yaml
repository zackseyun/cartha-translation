lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And ... said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그리고 말했습니다
  - 이르렀습니다
  lexicon: HALOT
  rationale: 히브리어 내러티브의 단순 서술형을 자연스러운 현대 한국어 과거 서술로 옮겼습니다.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: to the king of Israel
  chosen_korean: 이스라엘 왕에게
  alternatives_korean:
  - 이스라엘의 왕에게
  lexicon: HALOT
  rationale: 직접 대상 표지를 살리되, 한국어에서는 간결한 관형 구조보다 ‘~에게’ 구문이 더 자연스럽습니다.
- source_word: דְּרָשׁ
  english_pob_choice: inquire
  chosen_korean: 물어보십시오
  alternatives_korean:
  - 문의하십시오
  - 찾아보십시오
  - 상담하십시오
  lexicon: HALOT
  rationale: 이 동사는 예언적/신탁적 ‘상담’의 뉘앙스를 가지지만, 한국어에서는 하나님께 말씀을 구하는 행위를 가장 분명하게 드러내는 ‘물어보다’가 자연스럽습니다.
- source_word: נָא
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 청컨대
  lexicon: HALOT
  rationale: 정중한 요청을 나타내는 입자를 현대 공손 표현으로 반영했습니다.
- source_word: אֶת דְּבַר יְהוָה
  english_pob_choice: for the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 한 말씀
  - 야훼께서 하시는 말씀
  lexicon: HALOT
  rationale: ‘말씀’을 통해 예언적 신탁을 살리고, 목적격 표지는 한국어에서 자연스럽게 생략했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 주(主)나 여호와 대신, 프로젝트 기본값에 따라 언약 이름을 음역한 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 정중한 요청의 종결형
  chosen_reading: 본문 서술은 합쇼체로 유지하되, 인용문 안에서는 요청의 공손함을 ‘부디 ... 하십시오’로 표현했습니다.
  alternative_readings:
  - 인용문도 평서형으로 낮추기
  - 더 강한 청유형으로 옮기기
  rationale: 여호사밧의 발화가 왕에게 드리는 요청이므로, 원문의 공손한 어조를 한국어의 정중한 명령/요청으로 반영하는 것이 적절합니다.
  doctrine_reference: 공손어법과 화행 재현
