id: 2CH.18.11
reference: 2 Chronicles 18:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל הַ֨/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
  footnotes:
  - marker: a
    text: Or, “the LORD will give it into the hand of the king.” The Hebrew form can be rendered as an assured future in this prophetic context.
    reason: alternative_reading
translation:
  language: ko
  text: 모든 예언자도 이렇게 예언하여 말했습니다. 「라못길르앗에 올라가 승리하십시오. 야훼께서 라못길르앗을 왕의 손에 넘겨주실 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 완료형은 이 예언적 문맥에서 확정된 미래를 나타낼 수 있으므로, ‘넘겨주실 것입니다’처럼 미래로 옮길 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: וְכָל הַנְּבִאִים
  english_pob_choice: And all the prophets
  chosen_korean: 모든 예언자들이
  alternatives_korean:
  - 그리고 모든 예언자들이
  - 모든 선지자들이
  lexicon: HALOT
  rationale: 복수 주어의 총칭을 자연스럽게 살리되, 예언자/선지자 중에서는 현대 표준어이면서 의미가 분명한 ‘예언자들’을 택했습니다.
- source_word: נִבְּאִים כֵּן
  english_pob_choice: were prophesying thus
  chosen_korean: 이와 같이 예언하며
  alternatives_korean:
  - 그렇게 예언하며
  - 이렇게 예언하며
  lexicon: HALOT
  rationale: 진행적 분사를 한국어의 연결형으로 옮겨 동시적·반복적 예언 행위를 살렸고, כֵּן은 단순 ‘그렇게’보다 문어체인 ‘이와 같이’가 원문의 방식성을 더 잘 드러냅니다.
- source_word: עֲלֵה רָמֹת גִּלְעָד וְהַצְלַח
  english_pob_choice: Go up to Ramoth-gilead and succeed
  chosen_korean: 라못길르앗으로 올라가 승리하십시오
  alternatives_korean:
  - 라못길르앗으로 올라가 성공하십시오
  - 라못길르앗으로 올라가 형통하십시오
  lexicon: HALOT
  rationale: עֲלֵה는 문자적으로 ‘올라가다’이므로 보존했고, 군사적 맥락에서 ‘승리하십시오’가 ‘succeed/prosper’보다 한국어 의미를 더 정확하게 전달합니다.
- source_word: וְנָתַן יְהוָה בְּיַד הַמֶּלֶךְ
  english_pob_choice: and Yahweh will give it into the hand of the king
  chosen_korean: 야훼께서 그것을 왕의 손에 넘겨주실 것입니다
  alternatives_korean:
  - 야훼께서 그것을 왕의 손에 주실 것입니다
  - 야훼께서 그것을 왕에게 넘겨주실 것입니다
  lexicon: HALOT
  rationale: בְּיַד의 관용구를 직역하면 ‘손에’가 되므로 이를 살렸고, ‘넘겨주다’가 원문의 인도·양도 이미지를 가장 잘 드러냅니다.
theological_decisions:
- issue: 예언적 완료(qatal)와 미래 확언의 처리
  chosen_reading: ‘넘겨주실 것입니다’로 번역해 예언 속 확정된 미래를 한국어 미래 종결로 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘넘겨주셨습니다’
  - ‘넘겨주고 계십니다’
  rationale: 히브리어 완료형은 예언적 확언으로 기능하므로, 한국어에서는 완료 시제보다 확정된 약속의 미래가 더 적절합니다. 문맥상 예언자들의 확신을 분명히 보존합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
- issue: יהוה의 표기
  chosen_reading: 본문에서는 야훼로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 신명기적 성호를 직접 사용하므로, 프로젝트 기본값에 따라 개인 이름을 보존하는 ‘야훼’를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
