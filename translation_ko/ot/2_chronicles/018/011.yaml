review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 וְנָתַן יְהוָה의 직접 목적어는 문맥상 라못길르앗을 가리키지만 본문에는 명시되어 있지 않습니다. 한국어 ‘그것’은 지시 대상이 다소 불명확하고, ‘넘겨주다’에는 한국어에서 보통 필요한 수혜자 표지가 결여되어 어색합니다. 히브리어 관용구 ‘왕의 손에’를 자연스럽게 보존하면서 목적어를 보충하는 편이 안전합니다.
  naturalness: ‘모든 예언자들이 이와 같이 예언하며 말했습니다’는 의미상 가능하지만, 완료 서술 ‘말했습니다’와 연결형 ‘예언하며’의 결합이 다소 뻣뻣합니다. ‘모든 예언자도 이렇게 예언하여 말했습니다’가 서사 문맥과 현대 문어체에 더 자연스럽습니다. 인용문에서 ‘라못길르앗으로 올라가’보다 지명에 조사 없이 ‘라못길르앗에 올라가’가 더 자연스럽습니다.
  terminology: ‘예언자’, ‘야훼’, ‘라못길르앗’은 일관되고 적절합니다. ‘승리하십시오’는 군사 문맥에서 וְהַצְלַח을 자연스럽게 전달합니다. ‘왕의 손에’는 בְּיַד의 통제·인도 관용구를 보존합니다.
  issues:
  - severity: medium
    issue: ‘그것을 왕의 손에 넘겨주실 것입니다’의 목적어 및 결합이 불명확하고 다소 부자연스럽습니다.
    rationale: 원문은 목적어를 생략하며 앞의 라못길르앗을 가리킵니다. 한국어에서는 ‘그것’이 무엇인지 선명하지 않고, ‘왕의 손에 넘겨주다’는 ‘왕에게’보다 덜 자연스럽습니다. ‘라못길르앗을 왕의 손에 넘겨주실 것입니다’는 문맥적 지시 대상을 명확히 하면서 히브리어 관용구도 보존합니다.
  - severity: low
    issue: ‘예언하며 말했습니다’의 시제·연결 표현이 다소 어색합니다.
    rationale: 히브리어 분사의 동시·지속성을 한국어에서 ‘예언하여 말했습니다’로 처리하면 과도한 진행성을 부여하지 않으면서 서사 문장으로 매끄럽습니다.
