base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: Now the king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “Do not fight with anyone, small or great, but only with the king of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 아람 왕이 자기에게 속한 병거대장들에게 명령하여 말했습니다. 「너희는 작은 자와 큰 자를 상대해서 싸우지 말고, 다만 이스라엘 왕만을 상대하라.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “작은 자든 큰 자든 누구와도 싸우지 말고, 오직 이스라엘 왕만을 상대하라”는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מֶלֶךְ אֲרָם
  english_pob_choice: Now the king of Aram
  chosen_korean: 이제 아람 왕이
  alternatives_korean:
  - 그리고 아람 왕이
  - 그런데 아람 왕이
  lexicon: HALOT
  rationale: 서사 전환을 자연스럽게 살리면서도 히브리어 접속사의 흐름을 유지하기 위해 ‘이제’로 옮겼습니다.
- source_word: שָׂרֵי הָ/רֶכֶב
  english_pob_choice: the commanders of the chariots
  chosen_korean: 병거대장들
  alternatives_korean:
  - 병거들의 지휘관들
  - 병거 군대의 대장들
  - 병거 지휘관들
  lexicon: HALOT
  rationale: שָׂרֵי는 군사 지휘관이고 הָרֶכֶב은 병거 부대를 가리키므로, 한국어 군사 표현으로 압축해도 의미가 분명한 ‘병거대장들’이 적절합니다.
- source_word: אֲשֶׁר ל/וֹ
  english_pob_choice: that were his
  chosen_korean: 자기에게 속한
  alternatives_korean:
  - 그의 것인
  - 그의 지휘 아래 있는
  - 그의 소유인
  lexicon: HALOT
  rationale: 단순 소유보다 지휘권/소속을 함께 드러내는 표현으로, 문맥상 병거대장들이 왕의 휘하에 있음을 자연스럽게 나타냅니다.
- source_word: לֹא תִּלָּחֲמוּ אֶת הַ/קָּטֹן אֶת הַ/גָּדֹל
  english_pob_choice: Do not fight with either small or great
  chosen_korean: 작은 자와 큰 자를 상대해서 싸우지 말고
  alternatives_korean:
  - 작든 크든 누구와도 싸우지 말고
  - 작은 자든 큰 자든 싸우지 말고
  - 작은 자와 큰 자를 가리지 말고 싸우지 말고
  lexicon: HALOT
  rationale: 히브리어 관용구는 신분의 높고 낮음을 가리지 말라는 뜻이므로, POB의 ‘small or great’ 의미를 살려 한국어로는 ‘작은 자와 큰 자’를 유지했습니다. ‘상대해서’는 전투 대상이라는 관계를 자연스럽게 보충합니다.
theological_decisions:
- issue: 전투 금지 명령의 범위
  chosen_reading: ‘작은 자와 큰 자’는 개별 계급을 모두 포괄하는 관용구로 읽고, 예외는 ‘이스라엘 왕만’으로 한정했습니다.
  alternative_readings:
  - ‘아무와도’로 확대해 옮기는 해석
  - ‘병졸과 장군’을 특정 계층으로 나누는 해석
  rationale: 히브리어 대구는 포괄적 범위를 말한 뒤 단 하나의 표적을 지정하므로, 문맥보다 넓히지 않고 예외의 초점을 유지하는 것이 적절합니다.
  doctrine_reference: 문맥 해석 및 수사 구조
