revisions:
- from: 이제 아람 왕이 자기에게 속한 병거대장들에게 명령하여 말했습니다. 「너희는 작은 자와 큰 자를 상대해서 싸우지 말고, 다만 이스라엘 왕만을 상대하라.」[a]
  to: 아람 왕은 자기 휘하의 병거 부대 지휘관들에게 이렇게 명령해 두었습니다. “작은 자든 큰 자든[a] 누구와도 싸우지 말고, 오직 이스라엘 왕하고만 싸워라.”
  rationale: 원문에 없는 ‘이제’를 삭제하고, 선행된 명령이라는 서사적 관계를 ‘명령해 두었습니다’로 반영했습니다. 병거 지휘관의 뜻을 현대 한국어로 명료화했으며, ‘작은 자와 큰 자’라는 관용적 대조는 ‘작은 자든 큰 자든’으로 보존하되 각주에서 그 포괄적 의미를 밝혔습니다.
