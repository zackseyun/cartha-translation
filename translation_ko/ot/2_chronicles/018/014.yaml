base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
  footnotes:
  - marker: a
    text: Micaiah's reply is likely ironic or sarcastic in light of the surrounding context; the Hebrew itself does not explicitly mark the irony.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 왕에게 오자 왕이 그에게 말했습니다. “미가야, 우리가 길르앗 라못으로 전쟁하러 가야 합니까, 아니면 내가 그만두어야 합니까?” 그러자 그가 말했습니다. “올라가십시오. 승리하십시오. 그러면 그들이 당신들의 손에 넘겨질 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 답변은 문맥상 아이러니 또는 비꼼일 가능성이 큽니다. 히브리어 본문 자체는 그 의도를 명시적으로 표시하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: So he came
  chosen_korean: 그가 왕에게 오자
  alternatives_korean:
  - 그리고 그가 왕에게 왔습니다
  - 그가 왕에게 왔습니다
  lexicon: HALOT
  rationale: 이야기의 다음 동작을 자연스럽게 이어 주는 wayyiqtol의 순서를 살리면서, 한국어에서는 ‘오자’가 간결하게 선행 동작을 표시합니다.
- source_word: הֲנֵלֵךְ
  english_pob_choice: should we go
  chosen_korean: 우리가 … 가야 합니까
  alternatives_korean:
  - 우리가 … 가겠습니까
  - 우리가 … 가야 하겠습니까
  lexicon: HALOT
  rationale: 왕의 숙의형 질문을 현대 한국어의 정중한 의문으로 옮기되, 단순 가능 질문보다 결정 여부를 묻는 뉘앙스를 살렸습니다.
- source_word: אִם אֶחְדָּל
  english_pob_choice: or should I refrain
  chosen_korean: 아니면 내가 그만두어야 합니까
  alternatives_korean:
  - 아니면 내가 멈춰야 합니까
  - 아니면 내가 물러서야 합니까
  lexicon: HALOT
  rationale: חדל의 ‘그치다/그만두다’ 의미를 살려, 앞의 복수형 질문과 이어지면서도 왕 자신이 결정을 내려야 하는 개인적 어조를 보존했습니다.
- source_word: עֲלוּ וְהַצְלִיחוּ
  english_pob_choice: Go up and prosper
  chosen_korean: 올라가십시오. 승리하십시오.
  alternatives_korean:
  - 올라가십시오. 형통하십시오.
  - 올라가십시오. 번영하십시오.
  lexicon: HALOT
  rationale: עלה의 군사적 관용구를 ‘올라가십시오’로 직역하고, הצליח의 결과를 전투 맥락에 맞게 ‘승리하십시오’로 옮겼습니다. 한국어 ‘형통하다’는 지나치게 일반적일 수 있습니다.
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  english_pob_choice: and they will be given into your hand
  chosen_korean: 그러면 그들이 당신들의 손에 넘겨질 것입니다
  alternatives_korean:
  - 그러면 그들이 당신들의 손에 주어질 것입니다
  - 그러면 그들이 당신들의 손에 맡겨질 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손에 주어지다’를 한국어의 자연스러운 수동 표현 ‘넘겨지다’로 옮겨, 지배·패배의 뜻을 분명히 했습니다.
theological_decisions:
- issue: 미가야의 답변이 표면상 긍정적이지만, 문맥상 아이러니가 암시되는 문제
  chosen_reading: 본문에는 아이러니 표지를 덧붙이지 않고 표면적 긍정 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘비꼬듯이’ 같은 설명을 본문에 넣기
  - 따옴표 안에 반어를 드러내는 표현을 추가하기
  rationale: 히브리어는 화자의 반어를 명시하지 않으므로, 본문은 있는 그대로 두고 긴장은 문맥이 드러내게 하는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문의 표면 의미와 서술 문맥 사이의 긴장을 보존합니다.
