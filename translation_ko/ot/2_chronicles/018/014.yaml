  source_fidelity: 전반적으로 히브리어의 서술 순서, 왕의 복수 질문에서 단수 ‘내가’로 전환되는 점, 두 개의 복수 명령, 그리고 마지막의 복수 수동형을 잘 보존했습니다. 다만 ‘승리하십시오’는 הצליחו가 가리키는 ‘성공하다/형통하다’를 전투의 승리로 다소 좁힐 수 있으므로, 보다 포괄적인 표현이 적절합니다.
  naturalness: ‘당신들의 손’은 현대 표준어 성경 문체에서 다소 부자연스럽고 청자 복수도 선명하지 않습니다. ‘여러분의 손’이 자연스럽고 히브리어 복수 2인칭을 명확히 드러냅니다. 또한 첫 문장은 접속형보다 독립된 순차 서술로 옮기는 편이 wayyiqtol의 진행을 더 직접적으로 반영합니다.
  terminology: ‘미가야’와 ‘길르앗 라못’은 적절합니다. ‘전쟁하러’는 לַמִּלְחָמָה의 목적 용법을 자연스럽게 반영합니다. ‘성공하십시오’는 군사 원정의 성공을 뜻하는 הצליחו를 현대적인 합쇼체로 무리 없이 옮깁니다.
