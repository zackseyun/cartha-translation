reference: 2 Chronicles 18:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''a prophet of Yahweh.'' The main text follows the project’s standard rendering of the divine name as ''the LORD.'''
    reason: alternative_reading
  - marker: b
    text: Or 'Is there not yet another prophet of the LORD here...?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 여호사밧이 말했습니다. "여기에 아직 야훼의 예언자가 한 사람 더 없습니까? 우리가 그에게 물어보겠습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “야훼의 예언자”입니다.
    reason: alternative_reading
  - marker: b
    text: 원문의 עוֹד는 문맥상 “아직” 또는 “또 한 사람”의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר / אמר
  english_pob_choice: But ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 이어 주면서, 앞선 발언들에 대한 여호사밧의 반응이라는 문맥상 대조도 살리기 위해 '그러자'를 택했습니다.
- source_word: הֲאֵין ... עוֹד
  english_pob_choice: Is there not still here
  chosen_korean: 여기에 아직 ... 없습니까
  alternatives_korean:
  - 여기에 아직 ... 있지 않습니까
  - 여기에 ... 한 사람 더 없습니까
  lexicon: HALOT
  rationale: '''아직''과 부정 의문형으로 남아 있는 가능성을 살렸고, עוֹד의 ''아직/더'' 뉘앙스는 뒤의 ''한 사람 더''로 자연스럽게 풀었습니다.'
- source_word: נָבִיא לַיהוָה
  english_pob_choice: a prophet of Yahweh
  chosen_korean: 야훼의 예언자
  alternatives_korean:
  - 여호와의 예언자
  - 야훼께 속한 예언자
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 יהוה를 '야훼'로 옮겼고, נָבִיא는 예언자라고 옮겨 직분과 기능을 분명히 했습니다.
- source_word: וְנִדְרְשָׁה מֵאֹתוֹ
  english_pob_choice: that we may inquire of him
  chosen_korean: 우리가 그에게 물어보겠습니다
  alternatives_korean:
  - 우리가 그에게 문의해 보겠습니다
  - 우리가 그를 통해 알아보겠습니다
  lexicon: HALOT
  rationale: דרשׁ는 여기서 예언자를 통해 뜻을 묻는 의미이므로, 한국어에서는 짧고 자연스럽게 '그에게 물어보겠습니다'로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 야훼의 이름이 직접 나오므로, 본 프로젝트 기본값과 원문 가시성을 따라 '야훼'로 표기했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
