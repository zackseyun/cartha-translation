id: 2CH.18.31
reference: 2 Chronicles 18:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
  footnotes:
  - marker: a
    text: Or “He is the king of Israel.”
    reason: lexical_alternative
  - marker: b
    text: Or “God diverted them from him.” The Hebrew verb can mean to turn or move someone away from a target.
    reason: lexical_alternative
translation:
  language: ko
  text: 병거의 지휘관들이 여호사밧을 보고 “그가 이스라엘 왕입니다”라고 말했습니다.[a] 그래서 그들은 그를 치려고 그를 향해 방향을 돌렸습니다. 그러나 여호사밧이 부르짖자, 야훼께서 그를 도우셨고 하나님께서는 그들을 그에게서 돌이키셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 왕입니다.”
    reason: alternative_reading
  - marker: b
    text: 또는 “하나님께서 그들을 그에게서 멀어지게 하셨습니다.” 히브리어 동사는 대상을 향하던 방향을 바꾸는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָרֶכֶב
  english_pob_choice: the commanders of the chariots
  chosen_korean: 병거의 지휘관들
  alternatives_korean:
  - 병거의 대장들
  - 병거 지휘관들
  lexicon: HALOT
  rationale: שָׂרֵי는 군사 지휘자를 가리키므로 ‘지휘관들’이 의미를 분명히 전합니다. הָרֶכֶב은 병거 부대를 뜻하므로 ‘병거의’로 옮겼습니다.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  english_pob_choice: It is the king of Israel
  chosen_korean: 저가 이스라엘 왕이다
  alternatives_korean:
  - 그가 이스라엘 왕이다
  - 이스라엘 왕이다
  lexicon: HALOT
  rationale: 히브리어 명사문은 여호사밧을 그들의 표적으로 식별하는 말이므로, 한국어에서는 직접화법 안에서 자연스러운 ‘저가 …이다’로 옮겼습니다.
- source_word: וַיָּסֹבּוּ עָלָיו לְהִלָּחֵם
  english_pob_choice: they turned against him to fight
  chosen_korean: 그를 치러 돌아섰지만
  alternatives_korean:
  - 그를 향해 돌아서 싸우려 했지만
  - 그를 에워싸고 싸우려 했지만
  lexicon: HALOT
  rationale: סבב는 방향을 바꾸어 대상을 향하는 움직임을 나타낼 수 있어, 전투 문맥상 ‘치러 돌아서다’가 공격성을 살리면서도 ‘에워싸다’보다 덜 단정적입니다.
- source_word: וַיִּזְעַק
  english_pob_choice: cried out
  chosen_korean: 부르짖자
  alternatives_korean:
  - 외치자
  - 큰 소리로 부르짖자
  lexicon: HALOT
  rationale: זעק은 긴박한 호소의 외침을 뜻하므로, 단순히 ‘외치다’보다 절박함이 드러나는 ‘부르짖다’가 더 가깝습니다.
- source_word: וַיהוָה עֲזָרוֹ
  english_pob_choice: Yahweh helped him
  chosen_korean: 야훼께서 그를 도우셨고
  alternatives_korean:
  - 야훼께서 그를 도와주셨고
  - 주께서 그를 도우셨고
  lexicon: HALOT
  rationale: יְהוָה는 본문 직역 원칙에 따라 ‘야훼’로 옮겼고, עזר는 기본 의미인 ‘돕다’를 살려 주어를 분명히 했습니다.
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  english_pob_choice: God drew them away from him
  chosen_korean: 하나님이 그들을 그에게서 돌이키셨습니다
  alternatives_korean:
  - 하나님이 그들을 그에게서 물러나게 하셨습니다
  - 하나님이 그들을 그에게서 돌려세우셨습니다
  lexicon: HALOT
  rationale: סית는 여기서 대상을 향한 움직임을 다른 방향으로 돌리는 뜻이므로, 도덕적 ‘유혹’보다 방향 전환을 분명히 하는 ‘돌이키다’가 적절합니다.
theological_decisions:
- issue: 여호와/아도나이 관습 대신 YHWH를 어떻게 처리할지
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로, אֱלֹהִים은 ‘하나님’으로 구별해 옮겼습니다.
  alternative_readings:
  - 둘 다 ‘주’ 또는 ‘여호와’로 통일
  - 둘 다 ‘주님’으로 통일
  rationale: 이 절은 같은 문장 안에서 언약 이름과 일반 호칭을 함께 쓰므로, 구별을 지우지 않는 번역이 원문 관찰에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 여호사밧의 외침을 명시적 기도로 확장할지 여부
  chosen_reading: ‘부르짖자’로 두어, 누구에게 부르짖었는지는 본문에 없는 그대로 남겼습니다.
  alternative_readings:
  - 여호사밧이 야훼께 부르짖자
  - 여호사밧이 도움을 청하자
  rationale: 히브리어는 외침의 사실만 말하고 대상은 명시하지 않으므로, 1열왕 22:32의 평행본문 정보를 본문 안에 끌어오지 않았습니다.
  doctrine_reference: 'Translation philosophy #1 / 본문이 말하지 않는 내용을 덧붙이지 말 것'
