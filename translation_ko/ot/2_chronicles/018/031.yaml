revisions:
- from: 병거의 지휘관들이 여호사밧을 보자, 그들이 “저가 이스라엘 왕이다”라고 말했습니다. 그래서 그들은 그를 치러 돌아섰지만, 여호사밧이 부르짖자 야훼께서 그를 도우셨고, 하나님이 그들을 그에게서 돌이키셨습니다.[a][b]
  to: 병거의 지휘관들이 여호사밧을 보고 “그가 이스라엘 왕입니다”라고 말했습니다.[a] 그래서 그들은 그를 치려고 그를 향해 방향을 돌렸습니다. 그러나 여호사밧이 부르짖자, 야훼께서 그를 도우셨고 하나님께서는 그들을 그에게서 돌이키셨습니다.[b]
  rationale: 현대 표준어 합쇼체로 직접화법을 정비하고, 적군이 여호사밧을 표적으로 삼아 방향을 전환한 의미를 더 명료하게 했습니다. 원문이 밝히지 않는 외침의 대상이나 완전한 포위 여부는 추가하지 않았습니다. 각주는 해당 본문 단어에 각각 연결했습니다.
