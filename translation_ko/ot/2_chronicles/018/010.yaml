source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥הוּ בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלּוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
  footnotes:
  - marker: a
    text: Or 'you will push Aram'; the Hebrew verb refers to the thrusting or goring action of a horned animal.
    reason: lexical_alternative
  - marker: b
    text: '''Aram'' can also be rendered ''the Arameans'' or, less precisely in later terms, ''Syria.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그나아나의 아들 시드기야가 자기를 위해 쇠로 만든 뿔들을 만들고 말했습니다. “야훼께서 이렇게 말씀하십니다. ‘이것들로 네가 아람[b]을 들이받아[a] 그들이 멸망할 때까지 할 것입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들이받다’는 히브리어 동사가 뿔 달린 짐승이 뿔로 받는 동작을 가리키는 데서 나온 표현입니다. ‘받다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아람’은 ‘아람인들’로도 옮길 수 있으며, 후대적 지명으로는 ‘시리아’라고 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  english_pob_choice: made for himself
  chosen_korean: 자기를 위해 만들고
  alternatives_korean:
  - 그를 위해 만들고
  - 만들고
  lexicon: HALOT
  rationale: לּוֹ는 여기서 소유/반사적 뉘앙스를 가지므로, ‘자기를 위해’로 옮겨 행위의 주체가 자기용 표징을 만든다는 점을 살렸습니다.
- source_word: קַרְנֵי בַרְזֶל
  english_pob_choice: horns of iron
  chosen_korean: 쇠뿔들
  alternatives_korean:
  - 철뿔들
  - 쇠로 된 뿔들
  lexicon: HALOT
  rationale: 히브리어의 짧은 상징적 표현을 자연스럽게 살리면서, ‘뿔’ 이미지가 가진 힘과 들이받는 행위를 유지하기 위해 ‘쇠뿔들’로 옮겼습니다.
- source_word: תְּנַגַּח
  english_pob_choice: you will gore
  chosen_korean: 들이받아
  alternatives_korean:
  - 받아
  - 들이받고
  lexicon: HALOT
  rationale: נגח은 뿔 달린 짐승이 들이받거나 들이받아 상처를 내는 동작이므로, 한국어에서는 ‘들이받다’가 이미지와 동작을 가장 직접적으로 전달합니다.
- source_word: אֶת אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 아람인들
  - 시리아
  lexicon: HALOT
  rationale: 히브리어 지명을 직접 반영해 ‘아람’으로 유지했습니다. 이는 역사적 대상과 용어를 가장 가깝게 보존합니다.
- source_word: עַד כַּלּוֹתָם
  english_pob_choice: until they are finished off
  chosen_korean: 그들이 끝장날 때까지
  alternatives_korean:
  - 그들이 소멸될 때까지
  - 그들을 멸할 때까지
  lexicon: HALOT
  rationale: כלה의 완료/종결 의미를 한국어의 강한 종결 표현으로 옮겨, 선언의 결과성과 최종성을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה는 신적 호칭이 아니라 고유한 언약적 이름이므로, 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언 선언문의 전달
  chosen_reading: “야훼께서 이렇게 말씀하십니다.”
  alternative_readings:
  - “주님께서 이렇게 말씀하십니다.”
  - “야훼의 말씀이 이렇습니다.”
  rationale: כה אָמַר יְהוָה는 예언자적 전령 공식이므로, 한국어에서도 직접 인용 형식으로 보존해 선포의 권위를 드러냈습니다.
  doctrine_reference: Prophetic speech formula in Hebrew narrative
