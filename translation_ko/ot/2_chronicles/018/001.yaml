translation:
  language: ko
  text: 여호사밧은 매우 큰 재물과 명예를 누렸고, 아합과 혼인 동맹을 맺었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아합과 혼인으로 친족 관계가 되었다’, 혹은 ‘아합과 혼인 동맹을 맺었다’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׁר
  english_pob_choice: wealth
  chosen_korean: 재물
  alternatives_korean:
  - 부
  - 부유함
  - 재산
  lexicon: HALOT
  rationale: 물질적 풍요를 가리키는 말이므로, 현대 한국어에서 자연스러운 ‘재물’로 옮겨 소유의 실질을 살렸습니다.
- source_word: וְכָב֖וֹד
  english_pob_choice: honor
  chosen_korean: 명예
  alternatives_korean:
  - 영광
  - 존귀
  - 위세
  lexicon: HALOT
  rationale: 이 왕권 문맥에서는 신적 ‘영광’보다 지위와 위신을 뜻하는 의미가 강하므로, ‘명예’가 가장 적절합니다.
- source_word: לָרֹב
  english_pob_choice: great
  chosen_korean: 매우 큰
  alternatives_korean:
  - 풍성한
  - 넘치도록 많은
  - 대단한
  lexicon: HALOT
  rationale: 앞의 두 명사를 수식해 그 양과 정도가 매우 큼을 나타내므로, 한국어에서는 자연스럽게 정도를 강화하는 표현으로 풀었습니다.
- source_word: וַיִּתְחַתֵּן לְאַחְאָב
  english_pob_choice: he allied himself by marriage with Ahab
  chosen_korean: 아합과 혼인 동맹을 맺었습니다
  alternatives_korean:
  - 아합과 혼인으로 친족 관계를 맺었습니다
  - 아합과 혼인 관계로 동맹했습니다
  lexicon: HALOT
  rationale: 동사가 단순한 ‘결혼’이 아니라 왕조적·정치적 혼인 동맹을 뜻하므로, 그 관계 성격이 드러나도록 옮겼습니다.
theological_decisions:
- issue: וַיִּתְחַתֵּן의 관계 성격
  chosen_reading: 여호사밧이 아합과 개인적으로 결혼했다기보다, 왕조적 혼인 동맹을 맺었다고 읽었습니다.
  alternative_readings:
  - 아합과 혼인으로 관련되었다
  - 아합과 혼인 동맹을 만들었다
  rationale: 문맥은 인물 간 사적 결혼이 아니라 왕국 간 결합을 말하므로, 본문의 역사적 의미를 유지하는 번역이 필요합니다.
  doctrine_reference: 역사 서술의 문맥적 의미 보존
