base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
  footnotes:
  - marker: a
    text: Or, more literally, 'disguise yourself'; the Hebrew form is terse, but the context and following clause indicate the king of Israel is speaking of disguising himself.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스라엘 왕이 여호사밧에게 말했습니다. 「나는 변장하고[a] 전투에 들어가겠습니다. 그러나 당신은 당신의 옷을 입으십시오.」 그래서 이스라엘 왕이 변장하였고, 그들은 전투에 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘변장하라’로도 형태상 옮길 수 있습니다. 그러나 이어지는 “그러나 당신은 당신의 옷을 입으십시오”라는 대조와 다음 절의 서술에 비추어, 여기서는 이스라엘 왕이 자신이 변장하겠다고 말하는 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  english_pob_choice: Disguise yourself
  chosen_korean: 변장하고
  alternatives_korean:
  - 변장하라
  - 모습을 바꾸고
  lexicon: HALOT
  rationale: 직설적 명령형으로서 상대인 여호사밧에게 하는 말이므로 한국어에서도 명령으로 옮기되, 군사적 맥락에 맞는 자연스러운 표현인 ‘변장하다’를 택했습니다.
- source_word: וָבֹא בַמִּלְחָמָה
  english_pob_choice: go into the battle
  chosen_korean: 전투에 들어가라
  alternatives_korean:
  - 전투로 들어가라
  - 전투에 가라
  lexicon: HALOT
  rationale: בוא의 이동성을 살리기 위해 ‘들어가다’를 택했고, 전치사 ב with מִלְחָמָה는 한국어에서 자연스럽게 ‘전투에’로 옮겼습니다.
- source_word: לְבַשׁ בְּגָדֶיךָ
  english_pob_choice: put on your robes
  chosen_korean: 네 옷을 입어라
  alternatives_korean:
  - 네 예복을 입어라
  - 네 겉옷을 입어라
  lexicon: HALOT
  rationale: בְּגָדִים는 기본적으로 ‘옷/의복’이므로, 원문의 일반성을 과도하게 특정하지 않기 위해 기본값인 ‘옷’으로 옮겼습니다. 왕실 복식의 뉘앙스는 문맥상 읽히지만, 본문 자체에는 구체어가 없습니다.
- source_word: וַיִּתְחַפֵּשׂ
  english_pob_choice: disguised himself
  chosen_korean: 변장하였고
  alternatives_korean:
  - 스스로 변장하였고
  - 자신을 변장하였고
  lexicon: HALOT
  rationale: 서술문에서는 영어 POB처럼 결과를 분명히 하기 위해 완료형으로 옮기되, 대명사 ‘자신을’은 한국어에서 중복되므로 생략했습니다.
- source_word: וַיָּבֹאוּ
  english_pob_choice: they went
  chosen_korean: 그들은 전투에 들어갔습니다
  alternatives_korean:
  - 그들은 전투로 갔습니다
  - 그들은 전투에 나아갔습니다
  lexicon: HALOT
  rationale: 복수 동사는 두 왕이 함께 움직였음을 가리키므로 ‘그들은’으로 살리고, בוא의 방향성을 유지하기 위해 ‘들어갔습니다’로 옮겼습니다.
theological_decisions:
- issue: 전투 직전 왕의 지시가 상대를 속이기 위한 전술적 변장이라는 점의 반영
  chosen_reading: 명령문을 그대로 살려 여호사밧에게 변장을 지시하는 말로 읽었습니다.
  alternative_readings:
  - 자기 자신에게 하는 말로 완화하는 읽기
  - 서술적 표현으로 순화하는 읽기
  rationale: 히브리어와 POB audit trail 모두 여호사밧에게 향한 직접 명령으로 처리하므로, 본문의 긴장과 상황적 아이러니를 약화시키지 않기 위해 그대로 옮겼습니다.
  doctrine_reference: 본문 맥락 보존
- issue: ‘왕의 옷’의 구체화 여부
  chosen_reading: ‘네 옷’을 유지해 히브리어의 일반명사성을 보존했습니다.
  alternative_readings:
  - ‘네 예복’으로 구체화
  - ‘네 왕복’을 해석적으로 제시
  rationale: 문맥상 왕실 복식을 암시하더라도 מקור어는 일반적인 ‘옷’이므로, 과도한 해석을 피하고 독자가 문맥으로 파악하도록 두는 것이 더 충실합니다.
  doctrine_reference: 원문 형식 보존
