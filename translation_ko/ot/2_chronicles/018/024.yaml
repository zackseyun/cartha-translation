  source_fidelity: 개정이 필요합니다. 초안은 הִנְּךָ의 주의 환기와 חדר בְּחֶדֶר의 더 안쪽으로 들어가는 움직임을 대체로 반영하지만, 핵심 동사 רֹאֶה(문맥상 예언적 의미의 ‘보게 될 것입니다’)를 누락했습니다. 또한 לְהֵחָבֵא는 ‘피하려고’보다 자기 몸을 감추는 뜻의 ‘몸을 숨기려고’로 옮기는 것이 정확합니다.
  naturalness: ‘안쪽 방에서 안쪽 방으로 들어가게 될 것입니다’는 다소 부자연스럽고, 원문의 시간 절과 예언적 ‘보다’를 함께 드러내지 못합니다. ‘안쪽 방으로 더 들어가게 될 그날, 당신은 보게 될 것입니다’는 현대 한국어 합쇼체로 자연스럽고 원문의 의도적 목적어 생략도 보존합니다.
  terminology: ‘미가야’는 통용되는 한국어 성경 인명 표기로 적절합니다. ‘보십시오’는 הִנְּךָ의 주의 환기와 합쇼체 문체에 잘 맞습니다. ‘몸을 숨기려고’는 신학적 해석을 덧붙이지 않으면서 לְהֵחָבֵא의 재귀적 의미를 정확히 전달합니다.
