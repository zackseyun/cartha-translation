  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
  footnotes:
  - marker: a
    text: Or “a severe blow” or “a great slaughter.” The Hebrew phrase is literally “a great blow.”
    reason: lexical_alternative
  - marker: b
    text: Or “five hundred thousand picked men of Israel.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아비야와 그의 백성이 그들을 쳐서 큰 타격을 가하였고,[a] 이스라엘의 선발된 사람 오십만 명이 전사하여 쓰러졌습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “심한 타격” 또는 “큰 학살”. 히브리어는 문자적으로 “큰 타격”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “이스라엘에서 뽑힌 사람 오십만 명”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ ... מַכָּה רַבָּה
  english_pob_choice: struck them with a great blow
  chosen_korean: 쳐서 큰 타격을 입혔고
  alternatives_korean:
  - 쳐서 큰 치명타를 입혔고
  - 쳐서 큰 학살을 일으켰고
  lexicon: HALOT
  rationale: מכה רבה를 문자적으로 살린 ‘큰 타격’으로 두었고, 다음 절의 사망 진술과 구분되도록 ‘학살’은 앞절에 과도하게 결과를 흡수하는 표현이라 피했습니다.
- source_word: אֲבִיָּה וְעַמּוֹ
  english_pob_choice: Abijah and his people
  chosen_korean: 아비야와 그의 백성이
  alternatives_korean:
  - 아비야와 그의 군대가
  - 아비야와 그의 사람들과
  lexicon: HALOT
  rationale: עַם의 기본 의미를 따라 ‘백성’으로 옮겨, 전투 문맥이더라도 히브리어 표현을 좁히지 않았습니다.
- source_word: וַיִּפְּלוּ חֲלָלִים
  english_pob_choice: fell slain
  chosen_korean: 죽어 쓰러졌습니다
  alternatives_korean:
  - 전사했습니다
  - 죽임을 당해 쓰러졌습니다
  lexicon: HALOT
  rationale: חללים의 ‘전장에서 죽은 자들’이라는 뜻을 살리면서, 서술 동사 נפל의 이미지인 ‘쓰러지다’를 함께 보존했습니다.
- source_word: אִישׁ בָּחוּר
  english_pob_choice: chosen men
  chosen_korean: 뽑힌 사람들
  alternatives_korean:
  - 선발된 용사들
  - 뽑힌 군사들
  lexicon: HALOT
  rationale: בָּחוּר를 ‘선발/뽑힌’으로 옮겨 선택된 정예라는 의미를 드러내되, 영어 본문처럼 군사성을 과도하게 좁히지 않았습니다.
theological_decisions:
- issue: 이스라엘의 대규모 전사 수치
  chosen_reading: 본문이 제시한 오십만 명의 수치를 그대로 유지하고, 상징화나 축소 해석을 본문에 반영하지 않았습니다.
  alternative_readings:
  - 과장된 수사로 처리하기
  - 본문 밖의 역사비평적 조정으로 숫자를 완화하기
  rationale: 히브리어 본문은 숫자를 직접적으로 제시하므로, 번역문은 이를 해석적으로 재구성하지 않고 그대로 반영해야 합니다.
  doctrine_reference: 성경 본문 충실성
- issue: ‘아비야와 그의 백성’의 집단 지칭
  chosen_reading: ‘백성’을 유지해 히브리어 עַם의 폭넓은 집단 의미를 살렸습니다.
  alternative_readings:
  - ‘군대’로 한정하기
  - ‘병사들’로 구체화하기
  rationale: 전투 문맥이더라도 원문은 단순히 병력만이 아니라 그를 따르는 집단 전체를 가리킬 수 있으므로, 의미를 좁히지 않는 편이 적절합니다.
  doctrine_reference: 어휘 보존 원칙
