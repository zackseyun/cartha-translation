  text: וַ/יַּכּ֥וּ בָ/הֶ֛ם אֲבִיָּ֥ה וְ/עַמּ֖/וֹ מַכָּ֣ה רַבָּ֑ה וַ/יִּפְּל֤וּ חֲלָלִים֙ מִ/יִּשְׂרָאֵ֔ל חֲמֵשׁ מֵא֥וֹת אֶ֖לֶף אִ֥ישׁ בָּחֽוּר־׃
base_translation:
