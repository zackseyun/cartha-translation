base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/013.yaml
  text: But Yarobam had turned the ambush around to come behind them, so they were in front of Judah, and the ambush was behind them.
translation:
  language: ko
  text: 그러나 여로보암은 매복한 부대를 돌아서 그들 뒤로 오게 하였으므로, 그들은 유다 앞에 있었고 매복한 부대는 그들 뒤에 있었습니다.
  philosophy: formal
lexical_decisions:
- source_word: וְיָרָבְעָם
  english_pob_choice: Yarobam
  chosen_korean: 여로보암
  alternatives_korean:
  - 야로밤
  - 예로보암
  lexicon: 고유명사
  rationale: 본문 인명의 표기에는 한국어 성경에서 가장 널리 알려진 형태를 채택했습니다. POB의 영어 표기 'Yarobam'은 음가를 반영한 것이지만, 한국어 가독성과 식별성을 위해 기존 관용형을 사용했습니다.
- source_word: הֵסֵב
  english_pob_choice: had turned around
  chosen_korean: 돌아서 … 오게 하였으므로
  alternatives_korean:
  - 둘러서게 하였으므로
  - 되돌려 … 오게 하였으므로
  lexicon: סוּב
  rationale: 동사 הֵסֵב는 단순한 이동이 아니라 매복대를 '돌려 배치하다'는 뉘앙스를 담으므로, 결과적으로 적의 뒤로 오게 한 동작을 자연스럽게 표현했습니다.
- source_word: הַמַּאְרָב
  english_pob_choice: the ambush
  chosen_korean: 매복한 부대
  alternatives_korean:
  - 매복
  - 복병
  lexicon: מַאְרָב
  rationale: 지시된 대상이 장소가 아니라 병력 집단이므로, 단순히 '매복'보다 '매복한 부대'가 더 명시적입니다. 전통적 군사 어휘 '복병'도 가능하지만, 본문 흐름을 드러내기 위해 풀어 옮겼습니다.
theological_decisions:
- issue: 전쟁 서술에서의 직선적 사건 묘사 유지
  chosen_reading: 전투 전개를 완곡하게 만들지 않고, 매복대가 위치를 바꾸어 유다 앞과 뒤의 관계가 뒤집힌 상황을 그대로 유지했습니다.
  alternative_readings:
  - 의역하여 '기습 부대를 후방으로 돌아가게 하였다'
  - 축약하여 '배치를 바꾸었다'
  rationale: 이 절은 전략적 위치 변화를 서술하는 역사 기록이므로, 원문의 대칭 구조(앞/뒤, 유다 앞/뒤)를 유지하는 것이 사건의 긴장감을 보존합니다.
  doctrine_reference: 역사서 서술의 사건성 보존
- issue: 인명 표기에서 영어 POB의 음역과 한국어 관용형 사이의 선택
  chosen_reading: 영어 POB의 'Yarobam'을 참고하되 한국어 본문에는 '여로보암'을 사용했습니다.
  alternative_readings:
  - 야로밤
  - 예로보암
  rationale: 인명 자체는 신학적 쟁점이 없으며, 한국어 독자에게 즉시 식별되는 관용형을 우선하는 것이 본문 이해에 유익합니다.
  doctrine_reference: 고유명사 가독성 원칙
