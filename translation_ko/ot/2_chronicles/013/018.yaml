    rationale: 니팔형은 이 문맥에서 이스라엘 측이 제압되어 낮아진 결과를 나타냅니다. ‘제압당했고’가 자발적 복종이라는 뉘앙스를 피하면서도 ‘were subdued’를 충실히 반영합니다.
