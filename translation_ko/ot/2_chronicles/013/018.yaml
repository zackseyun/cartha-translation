  edition: WLC
  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: ko
  text: 그때 이스라엘의 아들들은 굴복했고, 유다의 아들들은 강해졌습니다. 그들이 조상들의 하나님, 야훼를 의지하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘이스라엘의 아들들’과 ‘유다의 아들들’을 평행시켜 민족/지파 집단을 형식적으로 대비합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  english_pob_choice: were subdued
  chosen_korean: 굴복했고
  alternatives_korean:
  - 억눌렸고
  - 제압되었고
  - 낮아졌고
  lexicon: HALOT
  rationale: נכנע의 니팔은 ‘스스로 낮아지다’보다 ‘억눌려 복종 상태가 되다’의 결과를 담으므로, 전투 맥락에서 자연스럽고 강한 ‘굴복하다’로 옮겼습니다.
- source_word: וַיֶּאֶמְצוּ
  english_pob_choice: prevailed
  chosen_korean: 강해졌습니다
  alternatives_korean:
  - 우세했습니다
  - 이겼습니다
  - 힘을 얻었습니다
  lexicon: HALOT
  rationale: אמץ는 ‘강해지다/힘을 내다’의 뜻이므로, 승패 결과를 드러내면서도 원뜻을 살리는 표현으로 ‘강해졌습니다’를 택했습니다.
- source_word: נִשְׁעֲנוּ עַל
  english_pob_choice: relied on
  chosen_korean: 의지하였기 때문입니다
  alternatives_korean:
  - 기댔기 때문입니다
  - 믿고 의지하였기 때문입니다
  - 신뢰하였기 때문입니다
  lexicon: HALOT
  rationale: שען + על의 비유적 의미는 ‘기대다/의지하다’이므로, 한국어에서도 관계와 행위성을 함께 드러내는 ‘의지하다’가 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 Tetragrammaton을 대체 칭호로 바꾸지 않고, 프로젝트 기본값에 따라 고유한 신명 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: ‘의지하다’의 신뢰 행위와 전투 승리의 인과 관계
  chosen_reading: 유다가 강해진 이유를 단순한 군사력보다 야훼 의지에 둡니다.
  alternative_readings:
  - 군사적 우세가 직접 원인이라는 읽기
  - 일반적 도움을 받은 결과라는 완화된 읽기
  rationale: 히브리어 כִּי는 명시적 이유를 제시하므로, 승리의 원인을 야훼를 향한 의지에 연결하는 문장 구조를 유지해야 합니다.
  doctrine_reference: 본문의 인과 구조와 신뢰-구원 관계
- issue: ‘조상들의 하나님’과 신명 표기
  chosen_reading: ‘조상들의 하나님, 야훼’로 연결해 조상-언약의 연속성을 드러냈습니다.
  alternative_readings:
  - ‘조상들의 하나님’만 번역하고 신명은 생략
  - ‘주님’으로 대체
  rationale: אֱלֹהֵי אֲבוֹתֵיהֶם은 언약적 기억을 환기하므로, 고유명 ‘야훼’를 병기해 관계적·역사적 의미를 보존했습니다.
  doctrine_reference: YHWH 표기 원칙
