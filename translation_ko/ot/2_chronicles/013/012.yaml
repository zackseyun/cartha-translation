  naturalness: 초안의 ‘우리 머리 앞에’는 현대 한국어에서 비문에 가깝고, ‘전투 함성을 위한 나팔을 가지고 있어’도 문장 연결이 부자연스럽습니다. ‘우리의 선두에서 우리와 함께 계시며’와 ‘전쟁 신호를 울리기 위한 나팔들을 가지고 있습니다’는 합쇼체의 현대적 격식과 원문의 수사적 어조를 함께 살립니다.
  terminology: ‘야훼’, ‘너희 조상들의 하나님’, ‘이스라엘의 아들들아’는 프로젝트의 용어 및 성별-정확성 방침에 부합하므로 유지합니다. תְּרוּעָה는 함성·신호·경보의 의미 범위를 지니므로 본문에서는 군사 문맥에 맞게 ‘전쟁 신호’로, 각주에서 의미 범위를 밝혔습니다.
