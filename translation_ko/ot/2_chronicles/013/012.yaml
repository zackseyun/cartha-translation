id: 2CH.13.12
reference: 2 Chronicles 13:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
  footnotes:
  - marker: a
    text: Or 'Children of Israel.' The Hebrew reads 'sons of Israel,' a masculine plural form used here as a direct address to the Israelites.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 하나님께서 우리와 함께 계시며 우리 머리 앞에 계시고, 그분의 제사장들은 전투 함성[a]을 위한 나팔을 가지고 있어, 너희를 향해 신호를 외치고 있습니다. 이스라엘의 아들들아, 야훼, 너희 조상들의 하나님과 싸우지 마십시오. 너희는 성공하지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전투 함성’은 히브리어 תְּרוּעָה의 전쟁 맥락을 살린 번역입니다. 본문에는 나팔과 함성/신호의 두 요소가 함께 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 담화 표지이므로, 현대 합쇼체에서 긴박한 호소를 살리는 ‘보십시오’로 옮겼습니다.
- source_word: בָרֹאשׁ
  english_pob_choice: at our head
  chosen_korean: 우리 머리 앞에
  alternatives_korean:
  - 우리의 선두에
  - 우리의 머리로
  lexicon: HALOT
  rationale: 직역하면 ‘머리/우두머리 자리’이지만, 문맥상 선두와 인도를 함께 드러내도록 ‘우리 머리 앞에’로 자연화했습니다.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  english_pob_choice: the trumpets for the battle cry
  chosen_korean: 전투 함성[a]을 위한 나팔
  alternatives_korean:
  - 전쟁 외침의 나팔
  - 함성의 나팔
  lexicon: HALOT
  rationale: ‘trumpets’는 나팔로, ‘תְּרוּעָה’는 전투적 환호/신호를 포함하므로 전쟁 맥락을 살려 ‘전투 함성’으로 옮겼습니다.
- source_word: לְהָרִיעַ עֲלֵיכֶם
  english_pob_choice: to sound the alarm against you
  chosen_korean: 너희를 향해 신호를 외치고 있습니다
  alternatives_korean:
  - 너희를 향해 경보를 울리고 있습니다
  - 너희를 향해 함성을 지르고 있습니다
  lexicon: HALOT
  rationale: 히필 רוע의 목적 표현을 별도 동작으로 유지하여, 단순한 소음이 아니라 적대적 신호/함성이라는 의미를 드러냈습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: Sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 백성
  - 이스라엘 자손
  lexicon: HALOT
  rationale: 남성 복수의 직접 호칭을 평준화하지 않고, POB의 성별-정확성을 따라 문자적 호칭을 유지했습니다.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  english_pob_choice: the God of your fathers
  chosen_korean: 너희 조상들의 하나님
  alternatives_korean:
  - 너희 조상들의 하나님
  - 너희 조상의 하나님
  lexicon: HALOT
  rationale: 언약적 상속 관계를 분명히 하는 관용구이므로, 한국어에서도 가장 자연스러운 소유 구조를 택했습니다.
theological_decisions:
- issue: יהוה / YHWH의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원어의 고유명사성과 언약적 대립 구도를 보존하기 위해 POB 기본값인 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: בְּנֵי יִשְׂרָאֵל의 직접 호칭
  chosen_reading: 이스라엘의 아들들아
  alternative_readings:
  - 이스라엘 백성들아
  - 이스라엘 자손들아
  rationale: 군사적 대치 상황에서 남성 복수 직접 호칭의 날카로움을 유지하기 위해 중성화하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
