  yaml_path: translation/ot/2_chronicles/013/015.yaml
  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: ko
  text: 그때 유다 사람들이 함성을 질렀습니다. 유다 사람들이 함성을 지르자 하나님께서 아비야와 유다 앞에서 여로보암과 온 이스라엘을 치셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  english_pob_choice: raised a shout / shouted
  chosen_korean: 함성을 질렀습니다 / 함성을 지르자
  alternatives_korean:
  - 소리를 질렀습니다
  - 환호했습니다
  lexicon: הריע
  rationale: 전쟁·승리 장면의 전형적 동사라서 단순한 ‘소리냄’보다 집단적 승전 함성을 드러내는 ‘함성을 지르다’가 원문의 역동을 더 잘 살립니다.
- source_word: נָגַף
  english_pob_choice: struck down
  chosen_korean: 치셨습니다
  alternatives_korean:
  - 쳐서 쓰러뜨리셨습니다
  - 무찌르셨습니다
  lexicon: נגע/נגף
  rationale: 이 동사는 단순한 ‘때리다’가 아니라 전투에서 적을 패배시키는 하나님의 직접적 타격을 뜻하므로, POB의 ‘struck down’을 따라 ‘치셨습니다’로 옮겼습니다.
- source_word: יְהוּדָה / אֲבִיָּה
  english_pob_choice: Judah / Abijah
  chosen_korean: 유다 / 아비야
  alternatives_korean:
  - 유대 / 아비아
  lexicon: 고유명사
  rationale: 성경에서 널리 굳어진 한국어 음역을 유지해 독자가 인물을 즉시 식별할 수 있게 했습니다.
theological_decisions:
- issue: 하나님의 전투 개입을 드러내는 군사적 서술
  chosen_reading: ‘하나님께서 … 치셨습니다’로 하나님의 직접 개입을 전면에 두었습니다.
  alternative_readings:
  - ‘하나님이 … 패하게 하셨습니다’
  - ‘하나님이 … 무너뜨리셨습니다’
  rationale: 본문은 승패의 최종 원인을 인간의 전술이 아니라 하나님의 행위로 돌리므로, 이를 완화하지 않고 직접적인 동사로 유지했습니다.
  doctrine_reference: 섭리와 하나님의 주권
