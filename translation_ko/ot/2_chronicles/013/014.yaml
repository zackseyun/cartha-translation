  lexicon: HALOT
  rationale: 양방향 포위를 가리키는 관용 표현을 직역에 가깝게 유지하면서도 한국어 어순에 맞게 정리했습니다.
- source_word: לַיְהוָה
  english_pob_choice: to the LORD
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 이 프로젝트의 기본 원칙에 따라 여호와 대신 야훼를 사용해 원문 고유명과 음가를 직접 반영했습니다.
- source_word: מחצצרים בַּחֲצֹצְרוֹת
  english_pob_choice: were blowing the trumpets
  chosen_korean: 나팔을 불고 있었습니다
  alternatives_korean:
  - 나팔을 불었습니다
  - 나팔을 불고 있었습니다
  lexicon: HALOT
  rationale: 분사형의 지속/동시 진행감을 살리기 위해 진행형으로 옮겼고, 예배·군사 문맥 모두에 어울리는 일반어 ‘나팔’을 택했습니다.
theological_decisions:
