  - 돌아서자
  lexicon: HALOT
  rationale: 전장 상황에서 갑작스럽게 방향을 바꾸는 동작을 자연스러운 현대 한국어로 드러내되, 단순한 ‘돌다’보다 구체성을 살렸습니다.
- source_word: וְהִנֵּה
