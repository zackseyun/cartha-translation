  - 보십시오, 갑자기
  lexicon: HALOT
  rationale: 히브리어의 주의 환기와 장면의 급작스러움을 살리기 위해 한국어에서 자연스럽고 호소력 있는 감탄형으로 옮겼습니다.
- source_word: פָּנִים וְאָחוֹר
  english_pob_choice: before them and behind them
  chosen_korean: 그들 앞과 뒤에
  alternatives_korean:
