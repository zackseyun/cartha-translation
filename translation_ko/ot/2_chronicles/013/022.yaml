base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: Now the rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
  footnotes:
  - marker: a
    text: Or 'commentary,' 'exposition,' or more generally 'record.' The Hebrew term 'midrash' here refers to a written interpretive or investigative work, not necessarily the later rabbinic genre in its developed form.
    reason: lexical_alternative
translation:
  language: ko
  text: 아비야의 나머지 행적과 그의 행실과 그의 말은 예언자 잇도의 미드라시에 기록되어 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주석’, ‘해설’, 더 일반적으로는 ‘기록’입니다. 여기서 히브리어 ‘미드라시’는 후대 랍비 문헌의 발달한 장르를 반드시 뜻하는 것이 아니라, 해석적·조사적 성격의 기록물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts of
  chosen_korean: 이제 …의 나머지 행적
  alternatives_korean:
  - 그리고 …의 남은 일들
  - …의 나머지 사건들
  lexicon: HALOT
  rationale: 문맥상 왕들의 연대기적 결어에서 דִּבְרֵי는 단순한 ‘말들’보다 폭넓은 행적·일들을 가리키므로, 한국어에서도 역사 서술에 자연스러운 ‘행적’으로 옮겼습니다.
- source_word: וּ/דְרָכָי/ו
  english_pob_choice: and his ways
  chosen_korean: 그의 길들
  alternatives_korean:
  - 그의 행실
  - 그의 살아온 방식
  lexicon: HALOT
  rationale: דֶּרֶךְ의 기본 이미지를 살려 ‘길들’로 직역하되, 한국어에서도 인격적 행실을 함께 떠올릴 수 있게 했습니다.
- source_word: וּ/דְבָרָי/ו
  english_pob_choice: and his sayings
  chosen_korean: 그의 말들
  alternatives_korean:
  - 그의 말한 것들
  - 그의 말씀이
  lexicon: HALOT
  rationale: 앞의 ‘행적’과 ‘길들’과 구별되는 실제 발화들을 가리키므로, 가장 직접적인 ‘말들’을 선택했습니다.
- source_word: בְּ/מִדְרַשׁ
  english_pob_choice: in the midrash
  chosen_korean: 예언자 잇도의 미드라시
  alternatives_korean:
  - 예언자 잇도의 주석
  - 예언자 잇도의 해설
  lexicon: HALOT
  rationale: מִדְרָשׁ는 후대의 장르명으로만 축소하지 않고 히브리어 용어 자체를 보존하는 편이 원문의 특수성을 잘 드러내므로 ‘미드라시’를 음역했습니다.
theological_decisions:
- issue: 문학적·역사적 기록물로서의 '미드라시' 처리
  chosen_reading: 본문에서는 용어를 그대로 살려 ‘미드라시’로 두고, 독자가 역사서 안의 인용 자료라는 사실을 읽도록 했습니다.
  alternative_readings:
  - ‘주석’으로 일반화
  - ‘기록’으로 일반화
  rationale: 원문의 특수한 문헌명을 평이한 일반어로 바꾸면 자료의 성격이 흐려지므로, 역사서의 출처 표기를 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 성경 본문의 문헌적 성격과 출처 표기의 보존
