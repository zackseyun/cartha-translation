reference: 2 Chronicles 13:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ מִיכָיָ֥הוּ בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
  footnotes:
  - marker: a
    text: The parallel in 1 Kings 15:2 gives Abijah’s mother’s name as Maacah. Hebrew 'daughter' can also be used more broadly for a female descendant, so the two accounts may reflect different naming or genealogical conventions.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 예루살렘에서 세 해 동안 다스렸습니다. 그의 어머니의 이름은 기브아 출신 우리엘의 딸 미가야였습니다[a]. 아비야와 여로보암 사이에는 전쟁이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 열왕기상 15:2에는 아비야의 어머니 이름이 마아가로 나옵니다. 히브리어 ‘딸’은 더 넓은 여성 후손을 가리킬 수도 있으므로, 두 기록은 이름 표기나 족보 관행의 차이를 반영할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙
  english_pob_choice: He reigned three years
  chosen_korean: 세 해 동안 다스렸습니다
  alternatives_korean:
  - 세 해 동안 통치했습니다
  - 세 해 동안 왕이었습니다
  lexicon: HALOT
  rationale: מָלַךְ의 왕권 행위를 한국어로 자연스럽게 살리면서도, 연대기적 왕위 서술의 간결함을 유지했습니다.
- source_word: בִּ/יר֣וּשָׁלִַ֔ם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서
  alternatives_korean:
  - 예루살렘 안에서
  - 예루살렘에
  lexicon: HALOT
  rationale: 지배/통치의 장소를 나타내는 전치사는 한국어에서 ‘에서’가 가장 자연스럽고 직접적입니다.
- source_word: מִיכָיָ֥הוּ
  english_pob_choice: Micaiah
  chosen_korean: 미가야
  alternatives_korean:
  - 미가야후
  - 미카야
  lexicon: HALOT
  rationale: 히브리어 인명 מִיכָיָהוּ를 한국어 음역으로 옮기되, 성경 인명 표기 관행에 맞게 ‘미가야’로 정리했습니다.
- source_word: בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה
  english_pob_choice: daughter of Uriel from Gibeah
  chosen_korean: 기브아 출신인 우리엘의 딸
  alternatives_korean:
  - 우리엘의 딸 기브아 사람
  - 기브아의 우리엘의 딸
  lexicon: HALOT
  rationale: בַת는 직계 ‘딸’로 두고, מִן גִּבְעָה는 ‘출신인’으로 옮겨 우리엘의 출신지를 자연스럽게 드러냈습니다.
- source_word: וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם
  english_pob_choice: And there was war between Abijah and Jeroboam
  chosen_korean: 아비야와 여로보암 사이에는 전쟁이 있었습니다
  alternatives_korean:
  - 아비야와 여로보암 사이에 전쟁이 있었습니다
  - 아비야와 여로보암 사이에 전쟁이 벌어졌습니다
  lexicon: HALOT
  rationale: הָיְתָה는 존재 진술이므로 ‘있었습니다’가 가장 직접적이며, בֵּין ... וּבֵין의 상호 대립 구조를 한국어로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 역대기와 열왕기의 어머니 이름 차이(미가야/마아가)
  chosen_reading: 본문은 역대기의 표현을 그대로 따라 ‘미가야’로 유지하고, 열왕기와의 차이는 주석으로만 처리했습니다.
  alternative_readings:
  - 열왕기와 맞추어 ‘마아가’로 조정
  - 두 이름을 번역에서 통합
  rationale: 번역은 본문의 실제 표기를 보존해야 하며, 상호 조화는 해석 주석의 역할입니다. 히브리어의 ‘딸’도 더 넓은 친족 관계를 가리킬 수 있어 본문 자체를 수정할 필요는 없습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
