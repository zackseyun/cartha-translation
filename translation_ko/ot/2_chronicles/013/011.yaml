  - 주님
  rationale: 본문의 신명기적 언약 이름을 보존하기 위해 전통적 대체 표현보다 ‘야훼’를 택했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 제의적 반복의 강조
  chosen_reading: 아침마다 아침마다, 저녁마다 저녁마다
  alternative_readings:
  - 매일 아침과 저녁
  - 아침마다, 저녁마다
  rationale: 히브리어의 반복을 지워버리지 않고, 성전 제사의 정규성과 지속성을 청중이 즉시 느끼도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
