  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
  footnotes:
  - marker: a
    text: Or 'the showbread' or 'the bread of the Presence.' Literally, 'the arrangement of bread.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 아침마다 아침마다, 저녁마다 저녁마다 번제물을 야훼께 드리고, 향기로운 향을 피우며, 정해 놓은 빵을 정결한 상 위에 차려 놓고, 금 등잔대와 그 등잔들을 저녁마다 저녁마다 켜도록 합니다. 이는 우리가 야훼 우리 하나님의 맡기신 일을 지키고 있기 때문이지만, 여러분은 그분을 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정해 놓은 빵’은 문자적으로는 ‘빵의 배열’입니다. 전통적으로는 ‘진설병’ 또는 ‘진설한 빵’으로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַקְטִרִים
  english_pob_choice: we offer up
  chosen_korean: 드리고
  alternatives_korean:
  - 번제로 바치고
  - 향을 피우고
  lexicon: HALOT
  rationale: 문맥상 제사 행위를 가리키므로 단순한 ‘태우다’보다 예배적 헌납을 드러내는 ‘드리다’가 적절합니다.
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר ... בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב
  english_pob_choice: morning by morning ... evening by evening
  chosen_korean: 아침마다 아침마다, 저녁마다 저녁마다
  alternatives_korean:
  - 매일 아침마다 ... 매일 저녁마다
  - 아침마다 ... 저녁마다
  lexicon: HALOT
  rationale: 히브리어의 반복 구조를 살려 규칙성과 지속성을 드러내되, 한국어에서는 자연스럽게 ‘마다’ 반복으로 옮겼습니다.
- source_word: וּ/קְטֹרֶת סַמִּים
  english_pob_choice: fragrant incense
  chosen_korean: 향기로운 향
  alternatives_korean:
  - 향료 섞은 향
  - 향료 향
  lexicon: HALOT
  rationale: 향의 아로마적 성격을 살리면서도 한국어 제사 문맥에서 자연스럽게 읽히도록 간결하게 옮겼습니다.
- source_word: וּ/מַעֲרֶ֨כֶת לֶ֜חֶם
  english_pob_choice: the arrangement of bread
  chosen_korean: 정해 놓은 빵
  alternatives_korean:
  - 빵의 배열
  - 진설병
  lexicon: HALOT
  rationale: 본문의 직역적 의미인 ‘배열된 빵’의 핵심을 유지하면서, 전통 교회 용어인 ‘진설병’은 본문 자체보다 해석을 앞세울 수 있어 본문에는 두지 않았습니다.
- source_word: הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר
  english_pob_choice: the pure table
  chosen_korean: 정결한 상
  alternatives_korean:
  - 깨끗한 상
  - 정결한 식탁
  lexicon: HALOT
  rationale: 예배 공간의 기구를 가리키므로 일상적 ‘깨끗한’보다 제의적 정결을 뜻하는 ‘정결한’이 더 정확합니다.
- source_word: וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב
  english_pob_choice: the golden lampstand
  chosen_korean: 금 등잔대
  alternatives_korean:
  - 금으로 된 등잔대
  - 황금 등잔대
  lexicon: HALOT
  rationale: 히브리어 합성구의 자연스러운 한국어 표현으로, 성막/성전 기구를 떠올리게 하는 표준적 번역을 택했습니다.
- source_word: וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙
  english_pob_choice: with its lamps to burn
  chosen_korean: 그 등잔들을 저녁마다 저녁마다 켜도록 합니다
  alternatives_korean:
  - 그 등잔들을 밝혀 두도록 합니다
  - 그 등잔들을 켜도록 합니다
  lexicon: HALOT
  rationale: 기능을 나타내는 부정사 용법을 한국어 목적 표현으로 옮겨, 등잔 관리의 행위를 자연스럽게 드러냈습니다.
- source_word: שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ
  english_pob_choice: for we are keeping the charge of Yahweh our God
  chosen_korean: 이는 우리가 야훼 우리 하나님의 맡기신 일을 지키고 있기 때문입니다
  alternatives_korean:
  - 이는 우리가 야훼 우리 하나님의 직무를 지키고 있기 때문입니다
  - 이는 우리가 야훼 우리 하나님의 명령을 지키고 있기 때문입니다
  lexicon: HALOT
  rationale: ‘맡기신 일’은 מִשְׁמֶרֶת의 위탁된 책임/임무 뉘앙스를 살리며, 단순한 규례 준수보다 성전 봉사의 신탁성을 드러냅니다.
- source_word: וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ
  english_pob_choice: but you have forsaken him
  chosen_korean: 여러분은 그분을 버렸습니다
  alternatives_korean:
  - 여러분은 그분을 떠났습니다
  - 여러분은 그분을 저버렸습니다
  lexicon: HALOT
  rationale: 언약적 배신의 뉘앙스를 살리면서도 현대 한국어에서 자연스럽고 직접적인 표현으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
