  text: וַ/יֶּאְסֹ֨ר אֲבִיָּ֜ה אֶת הַ/מִּלְחָמָ֗ה בְּ/חַ֨יִל֙ גִּבּוֹרֵ֣י מִלְחָמָ֔ה אַרְבַּע מֵא֥וֹת אֶ֖לֶף אִ֣ישׁ בָּח֑וּר וְ/יָרָבְעָ֗ם עָרַ֤ךְ עִמּ/וֹ֙ מִלְחָמָ֔ה בִּ/שְׁמוֹנֶ֨ה מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ בָּח֖וּר גִּבּ֥וֹר חָֽיִל־־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
  footnotes:
  - marker: a
    text: Or 'engaged in battle' for 'joined battle'; the Hebrew idiom is literally 'bound the battle.'
    reason: lexical_alternative
  - marker: b
    text: '''Mighty men of valor'' renders a Hebrew military expression for valiant, capable fighting men.'
    reason: cultural_note
translation:
  language: ko
  text: 아비야는 사백만 명의 선택된 사람들, 곧 용맹한 전사들과 함께 전투를 벌였고, 여로보암은 팔백만 명의 선택된 사람들, 곧 용맹한 군인들과 함께 그에게 맞서 전투 대열을 갖추었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 אסר는 여기서 문자적으로는 ‘묶다’이지만, ‘전투를 벌이다/가담하다’는 군사 관용구로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘용맹한 전사들/군인들’은 히브리어의 군사 관용구가 가리키는 전투에 능한 사람들을 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאְסֹר אֲבִיָּה אֶת הַמִּלְחָמָה
  english_pob_choice: joined battle
  chosen_korean: 전투를 벌였고
  alternatives_korean:
  - 전투를 시작했고
  - 전투에 들어갔고
  - 전투를 묶었고
  lexicon: HALOT
  rationale: אסר의 문자적 뜻은 ‘묶다’이지만, כאן에서는 전쟁 관용구로서 ‘전투에 가담하다/벌이다’의 뜻이므로 자연스러운 현대 한국어로 옮겼습니다.
- source_word: בְּחַיִל
  english_pob_choice: with an army
  chosen_korean: 사백만 명의 선택된 사람들
  alternatives_korean:
  - 사백만 명의 군대로
  - 사백만 명의 군사들과
  - 사백만 명의 용사들과
  lexicon: HALOT
  rationale: 본문은 이어지는 인원수와 함께 군사 집결을 말하므로 ‘군대/군사’의 뜻이 분명하지만, 문장 구조상 수와 수식어를 자연스럽게 살리기 위해 앞 절은 인원 표현으로 풀었습니다.
- source_word: גִּבּוֹרֵי מִלְחָמָה / גִּבּוֹר חָיִל
  english_pob_choice: mighty warriors / mighty men of valor
  chosen_korean: 용맹한 전사들 / 용맹한 군인들
  alternatives_korean:
  - 용사들
  - 전투에 능한 사람들
  - 무용한 자들
  lexicon: HALOT
  rationale: 두 표현은 모두 전투 능력과 용맹을 나타내는 군사용 관용구이므로, 격식을 유지하면서도 현대 독자가 이해하기 쉬운 ‘용맹한 전사들/군인들’로 옮겼습니다.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ ... בִּשְׁמוֹנֶה מֵאוֹת אֶלֶף אִישׁ
  english_pob_choice: four hundred thousand ... men / eight hundred thousand ... men
  chosen_korean: 사백만 명 / 팔백만 명
  alternatives_korean:
  - 사십만 명 / 팔십만 명
  - 사백천 명 / 팔백천 명
  lexicon: HALOT
  rationale: 히브리어의 엘레프는 대개 ‘천’을 뜻하므로, 본문 수치는 문자적으로 ‘사백만/팔백만 명’이 됩니다. 이 절의 군사 규모를 소스대로 반영해야 하므로 전통적 축소 해석으로 바꾸지 않았습니다.
