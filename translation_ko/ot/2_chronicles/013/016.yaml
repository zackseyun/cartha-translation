translation:
  language: ko
  text: 이스라엘 자손은[a] 유다를 피해 달아났고, 하나님께서는 그들을 유다의 손에[b] 넘기셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들의 손에’이며, 여기서 ‘그들의’는 유다를 가리킵니다. 이는 ‘그들의 권세 또는 지배 아래’를 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  english_pob_choice: fled
  chosen_korean: 도망하였고
  alternatives_korean:
  - 달아났고
  - 도망쳤고
  lexicon: HALOT
  rationale: 전투 맥락의 נוּס는 패주·도주를 뜻하므로, 간결하고 자연스러운 ‘도망하다’로 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
