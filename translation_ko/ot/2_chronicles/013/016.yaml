  lexicon: HALOT
  rationale: 히브리어의 직역 표현을 살려 ‘아들들’을 유지하되, 한국어에서는 속격 구조로 자연스럽게 정리했습니다.
- source_word: מִפְּנֵי יְהוּדָה
  english_pob_choice: before Judah
  chosen_korean: 유다 앞에서
  alternatives_korean:
  - 유다 앞에서부터
  - 유다를 피하여
  lexicon: HALOT
  rationale: מִפְּנֵי는 상대 앞에서 물러나거나 도망하는 상황을 나타내므로, 직역에 가까운 ‘앞에서’를 유지했습니다.
- source_word: וַיִּתְּנֵם ... בְּיָדָם
  english_pob_choice: gave them into their hand
  chosen_korean: 그들을 그들의 손에 넘기셨습니다
  alternatives_korean:
  - 그들을 그들의 손에 주셨습니다
  - 그들을 그들의 권세 아래 두셨습니다
  lexicon: HALOT
  rationale: ‘손에’는 히브리어 관용구로 권세·지배를 뜻하지만, 본문은 그 표현을 보존하면서도 한국어에서 자연스러운 ‘넘기다’로 결과를 드러냈습니다.
theological_decisions:
- issue: 전쟁 결과의 신적 주권
  chosen_reading: 하나님이 패주한 이스라엘을 유다의 손에 넘기셨습니다.
  alternative_readings:
  - 하나님이 그들이 유다의 손에 떨어지도록 허락하셨습니다
  rationale: נתן은 단순 허용보다 직접적 처분을 가리키므로, 전투의 승패를 하나님의 주권적 행위로 분명히 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘손’ 관용구의 보존
  chosen_reading: 그들의 손에
  alternative_readings:
  - 그들의 권세 아래
  - 그들의 통제 아래
  rationale: 히브리어 관용구를 너무 평이하게 풀면 원문의 투명성이 약해지므로, 본문에는 ‘손’을 살리고 의미는 문맥이 받쳐 주도록 했습니다.
  doctrine_reference: Translation philosophy §4
