  text: וְ/לֹֽא עָצַ֧ר כֹּֽחַ יָרָבְעָ֛ם ע֖וֹד בִּ/ימֵ֣י אֲבִיָּ֑הוּ וַ/יִּגְּפֵ֥/הוּ יְהוָ֖ה וַ/יָּמֹֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
  footnotes:
  - marker: a
    text: Or 'the LORD afflicted him' or 'the LORD plagued him.' The Hebrew says only that the LORD 'struck' Jeroboam and does not specify the exact means.
    reason: lexical_alternative
translation:
  language: ko
  text: 여로보암은 아비야 시대에 더 이상 힘을 유지하지 못했습니다. 야훼께서 그를 치셨고[a], 그는 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 그를 괴롭히셨다’ 혹은 ‘야훼께서 그에게 재앙을 내리셨다’로도 옮길 수 있습니다. 히브리어는 야훼께서 여로보암을 ‘치셨다’고만 말하며, 정확한 방식은 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  english_pob_choice: retained strength
  chosen_korean: 힘을 유지하지 못했습니다
  alternatives_korean:
  - 힘을 지키지 못했습니다
  - 더 이상 힘이 없었습니다
  - 세력을 유지하지 못했습니다
  lexicon: HALOT
  rationale: עָצַר는 ‘붙들다/보유하다’의 뉘앙스가 있어, 단순히 약해졌다는 뜻보다 ‘힘을 계속 간직하지 못했다’는 의미를 살려 번역했습니다.
- source_word: עוֹד
  english_pob_choice: no longer
  chosen_korean: 더 이상
  alternatives_korean:
  - 이제는 더는
  - 더는
  - 다시는
  lexicon: HALOT
  rationale: 부정문과 결합한 עוֹד의 관용적 의미를 현대 한국어의 ‘더 이상’으로 자연스럽게 옮겼습니다.
- source_word: בִּימֵי אֲבִיָּהוּ
  english_pob_choice: in the days of Abijah
  chosen_korean: 아비야의 시대에
  alternatives_korean:
  - 아비야의 날들에
  - 아비야의 때에
  - 아비야의 통치 기간에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서 가장 자연스럽게 풀어 주되, 기간/시기를 뜻하는 역사 서술의 성격을 유지했습니다.
- source_word: וַיִּגְּפֵהוּ יְהוָה
  english_pob_choice: Yahweh struck him
  chosen_korean: 야훼께서 그를 치시매
  alternatives_korean:
  - 야훼께서 그를 치셨고
  - 야훼께서 그를 때리셨고
  - 야훼께서 그를 내리치셨고
  lexicon: HALOT
  rationale: נגף의 의미가 질병·패배·타격을 모두 열어 두므로, 원문의 불특정성을 보존하는 가장 넓은 표현인 ‘치다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 사전 기본값에 따라 신적 고유명은 칭호로 대체하지 않고 음역형 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 야훼의 징계 방식의 구체성
  chosen_reading: 본문은 야훼께서 여로보암을 치셔서 죽게 하셨다고 직접 말하지만, 그 수단이 질병인지 전투 상처인지 등은 특정하지 않습니다.
  alternative_readings:
  - 야훼께서 그에게 병을 내리셨다
  - 야훼께서 그를 즉시 전투에서 치셨다
  rationale: 히브리어 동사 נגף가 제공하는 폭을 유지하여, 본문이 말하는 신적 심판은 분명히 하되 구체적 수단은 독단적으로 좁히지 않았습니다.
  doctrine_reference: 본문의 신적 행위 서술은 유지하되, 미지의 수단은 해설로 확정하지 않습니다.
