  edition: WLC
  text: וַ/יִּתְחַזֵּ֣ק אֲבִיָּ֔הוּ וַ/יִּ֨שָּׂא ל֔/וֹ נָשִׁ֖ים אַרְבַּ֣ע עֶשְׂרֵ֑ה וַ/יּ֗וֹלֶד עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ בָּנִ֔ים וְ/שֵׁ֥שׁ עֶשְׂרֵ֖ה בָּנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
  footnotes:
  - marker: a
    text: Or, 'became mighty' or 'strengthened himself.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'took for himself fourteen wives,' an idiom meaning he married them.
    reason: lexical_alternative
translation:
  language: ko
  text: 아비야는 강성해졌고[a], 열네 명의 아내를 맞이하여[a] 스물두 아들과 열여섯 딸을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강대해졌습니다’, ‘스스로 강하게 했습니다’로도 옮길 수 있습니다. ‘열네 명의 아내를 맞이하여’는 ‘아내들을 취하다’라는 히브리어 관용을 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  english_pob_choice: grew strong
  chosen_korean: 강성해졌고
  alternatives_korean:
  - 강해졌고
  - 세력을 얻었고
  - 힘을 얻었고
  lexicon: HALOT
  rationale: 히트파엘형 חזק은 단순한 신체적 강함보다 ‘강해지다/세력을 얻다’의 의미가 자연스럽고, 문맥상 아비야의 상태가 증대되었음을 간결하게 드러냅니다.
- source_word: וַיִּשָּׂא לוֹ נָשִׁים
  english_pob_choice: he took for himself fourteen wives
  chosen_korean: 열네 명의 아내를 맞이하여
  alternatives_korean:
  - 열네 명의 아내를 두어
  - 열네 명의 아내를 취하여
  - 열네 명의 아내와 결혼하여
  lexicon: HALOT
  rationale: 남편이 아내를 ‘취하다’는 히브리어 관용을 한국어에서는 ‘맞이하다’로 옮겨, 단순한 사실 서술을 유지하면서도 혼인 의미를 분명히 했습니다.
- source_word: וַיּוֹלֶד
  english_pob_choice: fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아들을 두었습니다
  - 생겼습니다
  - 낳아 두었습니다
  lexicon: HALOT
  rationale: 남성 주어의 히필 ילד는 ‘낳다/낳게 하다’의 의미로, 자녀를 두었다는 결과를 자연스러운 현대 한국어로 전달합니다.
theological_decisions:
- issue: 열네 아내와 많은 자녀에 대한 서술의 평가 여부
  chosen_reading: 본문의 서술을 평가 없이 사실 진술로만 옮겼습니다.
  alternative_readings:
  - 혼인과 다산을 암시적으로 칭찬하는 표현
  - 윤리적 평가를 덧붙이는 표현
  rationale: 이 절은 아비야의 다처와 자녀 수를 기록할 뿐, 본문 자체로는 승인이나 비판을 명시하지 않으므로 번역에서 판단을 덧붙이지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 신학적 판단을 주입하지 않고, 본문의 긴장을 그대로 보존합니다.'
