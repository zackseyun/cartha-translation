  source_fidelity: 전반적으로 히브리어 왕위 계승 및 장례 공식을 충실히 반영합니다. 다만 וַיִּקְבְּרוּ의 불특정 능동 복수 주어를 ‘사람들이’로 명시하면 원문에 없는 일반적 행위자를 다소 부각할 수 있습니다. 한국어의 주어 생략 능동문으로 옮기면 능동성을 보존하면서도 불특정성을 더 잘 유지합니다.
  naturalness: 합쇼체와 문장 흐름은 자연스럽습니다. ‘그를 다윗 성에 장사하였습니다’는 주어를 생략해도 문법적으로 완전하며, 장례 서술의 한국어 성경 문체에도 잘 맞습니다.
  terminology: ‘조상들과 함께 잠들다’, ‘다윗 성’, ‘그의 뒤를 이어 왕이 되다’는 적절합니다. שָׁקְטָה의 ‘평온하였습니다’도 국가·영토의 안정 상태를 과도하게 해석하지 않는 안전한 번역입니다. 각주도 ‘조용하였습니다’라는 어휘적 대안을 적절히 제시합니다.
