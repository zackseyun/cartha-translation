reference: 2 Chronicles 13:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב אֲבִיָּ֜ה עִם אֲבֹתָ֗י/ו וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בְּ/עִ֣יר דָּוִ֔יד וַ/יִּמְלֹ֛ךְ אָסָ֥א בְנ֖/וֹ תַּחְתָּ֑י/ו בְּ/יָמָ֛י/ו שָׁקְטָ֥ה הָ/אָ֖רֶץ עֶ֥שֶׂר שָׁנִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
  footnotes:
  - marker: a
    text: Or 'the land was quiet for ten years.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아비야가 그의 조상들과 함께 잠들었고, 그를 다윗 성에 장사하였습니다. 그의 아들 아사가 그의 뒤를 이어 왕이 되었습니다. 그의 시대에 그 땅은 십 년 동안 평온하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅은 십 년 동안 조용하였습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들었고
  alternatives_korean:
  - 누웠고
  - 죽었고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘조상들과 함께 잠들다’의 장례적 표현을 살리기 위해 직접적인 죽음 풀이보다 ‘잠들다’를 택했습니다.
- source_word: וַיִּקְבְּרוּ אֹתֹו
  english_pob_choice: they buried him
  chosen_korean: 사람들이 그를 ... 장사하였습니다
  alternatives_korean:
  - 그를 장사하였습니다
  - 그가 장사되었습니다
  lexicon: HALOT
  rationale: 동사는 능동 복수형이므로 행위 주체가 불특정이더라도 수동형보다 ‘사람들이 그를’로 옮겨 원문 형식을 더 잘 드러냈습니다.
- source_word: בְּעִיר דָּוִיד
  english_pob_choice: in the City of David
  chosen_korean: 다윗 성
  alternatives_korean:
  - 다윗의 성
  - 다윗 성읍
  lexicon: HALOT
  rationale: 고유 지명으로 굳어진 성경적 표현을 따라 ‘다윗 성’으로 옮겼습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 뒤를 이어
  alternatives_korean:
  - 그의 자리에
  - 그를 대신하여
  lexicon: HALOT
  rationale: 왕위 계승의 뜻을 한국어에서 자연스럽게 전달하면서도 ‘대신/교체’의 의미를 보존하기 위해 ‘그의 뒤를 이어’를 사용했습니다.
- source_word: שָׁקְטָה הָאָרֶץ
  english_pob_choice: had rest
  chosen_korean: 그 땅은 ... 평온하였습니다
  alternatives_korean:
  - 그 땅은 안식하였습니다
  - 그 땅은 조용하였습니다
  - 그 땅은 평안하였습니다
  lexicon: HALOT
  rationale: ‘שָׁקַט’의 정지·평온 의미를 살리되, 전쟁 중단의 상태를 너무 좁게 한정하지 않도록 ‘평온’으로 옮겼습니다.
theological_decisions:
- issue: 왕위 계승 서술에서 ‘reigned in his place’의 뉘앙스
  chosen_reading: 아사가 아비야의 뒤를 이어 왕이 되었다는 계승과 정통성을 분명히 드러냈습니다.
  alternative_readings:
  - 아사가 그의 자리에 올랐습니다
  - 아사가 그를 대신해 다스렸습니다
  rationale: 본문은 단순한 시간 순서보다 왕권의 정당한 승계를 말하므로, 계승 관계가 드러나는 표현을 택했습니다.
  doctrine_reference: 왕조 계승과 언약적 역사 서술
