translation:
  language: ko
  text: 그때 아비야가 에브라임 산지에 있는[a] 세마라임 산 위에 서서 말했습니다. “여로보암과 온 이스라엘은 내 말을 들으십시오!”
  philosophy: optimal-equivalence
  footnotes:
