base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
  footnotes:
  - marker: a
    text: Or “which is in the mountains of Ephraim.” The Hebrew expression can denote the Ephraimite hill country or mountainous region.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아비야가 에브라임 산지에 있는 세마라임 산에서 일어나 말했습니다. “여로보암과 온 이스라엘은 내 말을 들으십시오!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “에브라임 산악지대에 있는.” 히브리어 표현은 에브라임의 구릉 지대나 산악 지역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: stood
  chosen_korean: 일어나다
  alternatives_korean:
  - 서다
  - 자리를 잡고 서다
  lexicon: HALOT
  rationale: 서술 전개 속에서 아비야가 연설을 시작하기 위해 몸을 일으키는 동작을 자연스럽게 옮겼습니다. 바로 뒤의 발화 도입과도 잘 이어집니다.
- source_word: לְהַר צְמָרַיִם / בְּהַר אֶפְרָיִם
  english_pob_choice: Mount Zemaraim, which is in the hill country of Ephraim
  chosen_korean: 에브라임 산지에 있는 세마라임 산
  alternatives_korean:
  - 에브라임의 산지에 있는 세마라임 산
  - 에브라임 산지의 세마라임 산
  lexicon: HALOT
  rationale: הַר אֶפְרָיִם의 지역적 의미를 살려 ‘에브라임 산지’로 옮겼고, 고유지명은 음역했습니다. ‘산지’가 단일 봉우리보다 산악 지역을 가리킬 수 있다는 점을 반영합니다.
- source_word: שְׁמָעוּנִי
  english_pob_choice: Hear me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 나를 들으십시오
  - 내게 귀를 기울이십시오
  lexicon: HALOT
  rationale: 직접적 명령의 힘을 살리되, 한국어에서 가장 자연스러운 공적 호소형 표현으로 옮겼습니다. 군중과 왕에게 하는 공개 연설의 뉘앙스도 유지합니다.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  english_pob_choice: Jeroboam and all Israel
  chosen_korean: 여로보암과 온 이스라엘
  alternatives_korean:
  - 여로보암과 모든 이스라엘
  - 여로보암과 온 이스라엘 백성
  lexicon: HALOT
  rationale: 분열 왕국 문맥에서 המקרא의 공동체 호칭을 약화하지 않기 위해 ‘온 이스라엘’을 유지했습니다. ‘백성’을 덧붙이지 않아 정치-신학적 긴장을 보존합니다.
theological_decisions:
- issue: 분열 왕국 문맥에서 ‘이스라엘’의 범위
  chosen_reading: ‘온 이스라엘’을 그대로 유지하여 북왕국 회중을 포함한 국가적 호칭으로 읽습니다.
  alternative_readings:
  - ‘이스라엘 사람들’
  - ‘이스라엘 백성 전체’
  rationale: 역대기는 북왕국을 향해도 covenantal-national name을 사용하므로, 이를 완화하지 않고 직역에 가깝게 유지하는 편이 저자의 수사와 긴장을 더 잘 드러냅니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
