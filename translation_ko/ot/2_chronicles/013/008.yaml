source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
  footnotes:
  - marker: a
    text: Or, 'you say that you will show yourselves strong before the kingdom of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the hand of the sons of David,' an idiom for rule or administration through David's line.
    reason: cultural_note
  - marker: c
    text: Or, 'for gods.' The Hebrew is plural, referring polemically to Jeroboam's calf idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 여러분은 다윗의 아들들의 손에 있는 야훼의 나라에 맞서 강해지려 한다고 말합니다.[a][b] 여러분은 큰 무리이고, 여로보암이 여러분을 위해 신들로 만든 금송아지들이 여러분과 함께 있습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘여러분은 야훼의 나라 앞에서 강해지려 한다고 말합니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘다윗의 아들들의 손에 있는’은 다윗 계열을 통하여 통치나 행정이 이루어짐을 가리키는 히브리어 관용 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는, ‘신들로.’ 히브리어는 복수형이며, 여로보암이 세운 송아지 우상을 논쟁적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  english_pob_choice: you are saying
  chosen_korean: 말하고 있습니다
  alternatives_korean:
