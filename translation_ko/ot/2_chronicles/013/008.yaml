revisions:
- from: 그리고 이제 여러분은, 야훼의 나라에 맞서 다윗의 아들들의 손에 있는 그 나라 앞에 서서 자신들이 강하다고 말하고 있습니다. 여러분은 큰 무리이며, 여로보암이 여러분을 위하여 신들로 만든 금송아지들도 함께 가지고 있습니다.[a][b][c]
  to: 그리고 이제 여러분은 다윗의 아들들의 손에 있는 야훼의 나라에 맞서 강해지려 한다고 말합니다.[a][b] 여러분은 큰 무리이고, 여로보암이 여러분을 위해 신들로 만든 금송아지들이 여러분과 함께 있습니다.[c]
  rationale: 원문의 통사 관계를 회복하여 ‘야훼의 나라’가 ‘다윗의 아들들의 손에 있는’ 나라임을 명확히 했습니다. 또한 대결을 뜻하는 לִפְנֵי의 문맥적 의미와 לְהִתְחַזֵּק의 자기강화/강함을 보이려는 의미를 ‘맞서 강해지려 한다’로 간결하게 반영했습니다. 각주는 해당 본문 어구에 직접 연결되도록 재배치하고 표현을 본문 번역과 일치시켰습니다.
