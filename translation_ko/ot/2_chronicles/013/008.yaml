source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
  footnotes:
  - marker: a
    text: Or, 'you say that you will show yourselves strong before the kingdom of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the hand of the sons of David,' an idiom for rule or administration through David's line.
    reason: cultural_note
  - marker: c
    text: Or, 'for gods.' The Hebrew is plural, referring polemically to Jeroboam's calf idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제 여러분은, 야훼의 나라에 맞서 다윗의 아들들의 손에 있는 그 나라 앞에 서서 자신들이 강하다고 말하고 있습니다. 여러분은 큰 무리이며, 여로보암이 여러분을 위하여 신들로 만든 금송아지들도 함께 가지고 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘여러분은 야훼의 나라 앞에서 자신들을 강하게 보이려 한다고 말합니다.’
    reason: alternative_reading
  - marker: b
    text: ‘다윗의 아들들의 손에 있는’은 다윗 계열을 통한 통치나 행정을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는, ‘신들로.’ 히브리어는 복수형으로, 여로보암이 세운 송아지 우상을 조롱적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  english_pob_choice: you are saying
  chosen_korean: 말하고 있습니다
  alternatives_korean:
  - 말합니다
  - 말하고 있습니
  lexicon: HALOT
  rationale: 현재 분사적 표현을 살려 상대의 발언을 인용하는 진행형으로 옮겼습니다.
- source_word: לְהִתְחַזֵּק לִפְנֵי
  english_pob_choice: that you are strong enough to stand against
  chosen_korean: 자신들이 강하다고 말하고 있습니다 … 앞에 서서
  alternatives_korean:
  - 맞서 강해지려 한다고
  - 대항할 만큼 강하다고
  lexicon: HALOT
  rationale: 히트파엘의 ‘스스로 강해지다/강한 체하다’와 לִפְנֵי의 대결적 뉘앙스를 함께 살리기 위해, 직역과 의미를 절충해 표현했습니다.
- source_word: מַמְלֶכֶת יְהוָה
  english_pob_choice: the kingdom of Yahweh
  chosen_korean: 야훼의 나라
  alternatives_korean:
  - 야훼의 왕국
  - 여호와의 나라
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 יהוה는 야훼로 옮기고, מַמְלֶכֶת은 한국어에서 자연스러운 ‘나라’로 옮겼습니다.
- source_word: בְּיַד בְּנֵי דָוִיד
  english_pob_choice: in the hand of the sons of David
  chosen_korean: 다윗의 아들들의 손에 있는
  alternatives_korean:
  - 다윗의 자손들의 손 안에 있는
  - 다윗의 아들들에게 맡겨진
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용구를 보존해, 통치·집행 권한이 다윗 계열을 통해 행사된다는 점을 드러냈습니다.
- source_word: לֵאלֹהִים
  english_pob_choice: as gods
  chosen_korean: 신들로
  alternatives_korean:
  - 신으로
  - 신들이 되도록
  lexicon: HALOT
  rationale: 히브리어 복수형과 우상 숭배에 대한 조롱적 뉘앙스를 살려 ‘신들로’라고 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 신명기 이름 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: YHWH → 야훼'
- issue: 다윗 왕조와 야훼의 나라의 긴장
  chosen_reading: 야훼의 나라 … 다윗의 아들들의 손에 있는
  alternative_readings:
  - 야훼의 나라가 다윗의 아들들의 통치 아래 있는
  - 다윗의 아들들에게 맡겨진 야훼의 나라
  rationale: 나라의 소유권은 야훼께 있고, 실제 행사는 다윗 계열의 손을 통해 이루어진다는 긴장을 풀지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it'
