translation:
  language: ko
  text: 유다 왕 여로보암의 열여덟째 해에 아비야가 유다의 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아비야는 평행본문인 열왕기상 15:1에서는 '아비얌'으로도 불립니다. 역대기는 여기에서 '아비야' 형태를 사용합니다.
    reason: cross_reference
