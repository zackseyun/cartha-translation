  source_fidelity: ‘그를 둘러모였고’는 한국어 문법상 부자연스럽고, עָלָיו의 대상인 여로보암에게 사람들이 모여든 뜻을 분명히 하지 못합니다. 또한 וַיִּתְאַמְּצוּ עַל은 르호보암을 상대로 세력을 과시하여 우세해진 뜻이므로 ‘르호보암보다 더 강해졌습니다’보다 대항 관계를 드러내는 번역이 적절합니다. 마지막 절은 반복되는 חזק 어근과 ‘그들 앞에서’라는 표현을 보존합니다.
  naturalness: ‘무가치한 자들, 곧 벨리알의 아들들’은 원문의 동격을 자연스럽게 반영합니다. ‘그에게 모여들어’와 ‘맞서 우세를 보였습니다’는 현대 표준어 합쇼체에서 명료하고 자연스럽습니다.
  terminology: ‘벨리알의 아들들’은 고유명사화 여부를 단정하지 않는 직역으로 유지합니다. 각주는 해당 표현 바로 뒤에 배치하여 앵커를 바로잡고, 관용적 대안을 제시합니다. ‘마음이 약하여’는 רַךְ לֵבָב의 결단력 부족을 과도한 해석 없이 전달합니다.
