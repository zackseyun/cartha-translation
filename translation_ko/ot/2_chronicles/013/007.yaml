base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
  footnotes:
  - marker: a
    text: Or 'scoundrels' or 'worthless men' for 'sons of Belial.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 무가치한 사람들, 곧 벨리알의 아들들이 그를 둘러모였고, 솔로몬의 아들 르호보암보다 더 강해졌습니다. 르호보암은 젊고 마음이 약했으며, 그들 앞에서 스스로 강해지지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불량한 자들’, ‘무가치한 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנָשִׁים רֵקִים
  english_pob_choice: worthless men
  chosen_korean: 무가치한 사람들
  alternatives_korean:
  - 헛된 사람들
  - 쓸모없는 사람들
  - 가치 없는 사람들
  lexicon: HALOT
  rationale: רֵקִים의 문자적 뜻은 ‘비어 있는’이지만, 문맥상 인격적·도덕적 무가치를 나타내므로 현대 한국어로는 ‘무가치한 사람들’이 자연스럽고 의미를 보존합니다.
- source_word: בְּנֵי בְלִיַּעַל
  english_pob_choice: sons of Belial
  chosen_korean: 벨리알의 아들들
  alternatives_korean:
  - 불량한 자들
  - 사악한 사람들
  - 쓸모없는 자들
  lexicon: HALOT
  rationale: 본문의 직역적 표현을 살려 ‘벨리알의 아들들’로 두고, 고유명사화 가능성과 관용적 의미를 함께 열어 둡니다.
- source_word: וַיִּתְאַמְּצוּ עַל
  english_pob_choice: proved stronger than
  chosen_korean: 더 강해졌습니다
  alternatives_korean:
  - 대항하여 스스로 강해졌습니다
  - 그보다 우세해졌습니다
  - 그를 눌렀습니다
  lexicon: HALOT
  rationale: 히트파엘 동사의 비교적·대항적 힘을 살리되, 한국어에서는 ‘더 강해졌습니다’가 가장 간결하게 대응합니다.
- source_word: רַךְ לֵבָב
  english_pob_choice: fainthearted
  chosen_korean: 마음이 약했으며
  alternatives_korean:
  - 겁이 많았으며
  - 낙심이 많았으며
  - 유약했으며
  lexicon: HALOT
  rationale: 직역하면 ‘부드러운 마음’이지만, 정치·군사적 맥락에서는 결단력 부족을 뜻하므로 ‘마음이 약했다’가 문맥을 잘 반영합니다.
- source_word: לֹא הִתְחַזַּק לִפְנֵיהֶם
  english_pob_choice: had not strengthened himself against them
  chosen_korean: 그들 앞에서 스스로 강해지지 못했습니다
  alternatives_korean:
  - 그들 앞에서 자신을 강하게 하지 못했습니다
  - 그들에 맞서 굳세지 못했습니다
  - 그들을 대적할 힘을 갖추지 못했습니다
  lexicon: HALOT
  rationale: 반복되는 어근 חזק을 유지하면서도, 한국어에서는 ‘스스로 강해지지 못했습니다’가 원문의 자기 강화 실패를 비교적 직접적으로 드러냅니다.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל의 번역 전략
  chosen_reading: 본문에는 ‘벨리알의 아들들’로 유지하고, 의미는 문맥으로 드러내게 합니다.
  alternative_readings:
  - 불량한 자들
  - 사악한 사람들
  - 무가치한 자들
  rationale: 이 표현은 단순한 품행 묘사인지, 혹은 고정된 악의 명칭인지 본문만으로 단정하기 어렵습니다. 따라서 직역을 본문에 두어 해석 여지를 보존합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
