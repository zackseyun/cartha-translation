revisions:
- from: 그리고 무가치한 사람들, 곧 벨리알의 아들들이 그를 둘러모였고, 솔로몬의 아들 르호보암보다 더 강해졌습니다. 르호보암은 젊고 마음이 약했으며, 그들 앞에서 스스로 강해지지 못했습니다.[a]
  to: 무가치한 자들, 곧 벨리알의 아들들[a]이 그에게 모여들어 솔로몬의 아들 르호보암에게 맞서 우세를 보였습니다. 르호보암은 젊고 마음이 약하여 그들 앞에서 스스로 강해지지 못했습니다.
  rationale: 문법상 어색한 ‘그를 둘러모였고’를 여로보암을 향한 결집을 나타내는 ‘그에게 모여들어’로 고쳤습니다. 르호보암에 대한 적대적·비교적 우세를 ‘맞서 우세를 보였습니다’로 명시하되, 본문이 말하는 구체적 방식은 덧붙이지 않았습니다. 벨리알 표현은 본문에서 보존하고, 그 관용적 의미는 적절한 위치의 각주로 제시했습니다.
