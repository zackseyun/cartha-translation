revisions:
- from: 여러분은 알지 못합니까? 이스라엘의 하나님이신 야훼께서 다윗에게, 곧 그와 그의 아들들에게, 이스라엘 위에 나라를 영원히, 소금의 언약으로 주셨습니다.[a][b]
  to: 이스라엘의 하나님이신 야훼께서 다윗과 그의 아들들에게[b] 이스라엘에 대한 왕권을 영원히 소금의 언약[a]으로 주셨다는 것을 여러분은 알지 못합니까?
  rationale: 수여 대상을 ‘다윗과 그의 아들들에게’로 자연스럽게 옮겨 원문의 왕조적 계승 범위를 보존했습니다. מַמְלָכָה עַל־יִשְׂרָאֵל은 ‘이스라엘에 대한 왕권’으로 번역하여 통치권의 의미를 명확히 했습니다. ‘소금의 언약’은 문자적으로 유지하고, 각주 표지를 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:17:20Z'
