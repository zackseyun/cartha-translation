  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
  footnotes:
  - marker: a
    text: Or 'with a covenant of salt.' The expression likely denotes a binding, enduring covenant; compare Numbers 18:19.
    reason: lexical_alternative
  - marker: b
    text: '''To his sons'' refers to David''s royal line or dynasty.'
    reason: cultural_note
translation:
  language: ko
  text: 여러분은 알지 못합니까? 이스라엘의 하나님이신 야훼께서 다윗에게, 곧 그와 그의 아들들에게, 이스라엘 위에 나라를 영원히, 소금의 언약으로 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소금의 언약’은 대체로 끊어지지 않는, 지속적인 언약을 가리키는 표현입니다. 민수기 18:19와 비교해 보십시오.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 아들들’은 다윗의 왕실 계보, 곧 왕조를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא לָכֶם לָדַעַת
  english_pob_choice: Do you not know
  chosen_korean: 여러분은 알지 못합니까?
  alternatives_korean:
  - 여러분은 모르십니까?
  - 알고 있지 않습니까?
  lexicon: HALOT
  rationale: 반어적 질문의 압박감을 살리면서도 현대 한국어에서 자연스럽고 공적 문체에 맞게 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 이스라엘의 하나님이신 야훼
  alternatives_korean:
  - 이스라엘의 하나님이신 주님
  - 이스라엘의 하나님 야훼
  lexicon: HALOT
  rationale: 본문이 개인명 יְהוָה를 사용하므로 기본 원칙대로 야훼를 유지했고, 동격을 한국어에서 자연스럽게 풀어 말했습니다.
- source_word: מַמְלָכָה עַל יִשְׂרָאֵל
  english_pob_choice: the kingdom over Israel
  chosen_korean: 이스라엘 위에 나라
  alternatives_korean:
  - 이스라엘 위에 왕권
  - 이스라엘에 대한 왕국
  lexicon: HALOT
  rationale: 이곳의 מַמְלָכָה는 단순한 영토보다 다윗에게 맡겨진 통치권/왕권을 가리키지만, 한국어에서는 '나라'가 그 통치 영역과 왕권을 함께 가장 자연스럽게 드러냅니다.
- source_word: לְעוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영구히
  - 끝없이
  lexicon: HALOT
  rationale: 언약의 지속성을 나타내는 표준적 대응으로, 본문의 영속성 주장을 그대로 살렸습니다.
- source_word: בְּרִית מֶלַח
  english_pob_choice: a covenant of salt
  chosen_korean: 소금의 언약
  alternatives_korean:
  - 소금으로 맺은 언약
  - 소금 언약
  lexicon: HALOT
  rationale: 관용구를 직역해 본문의 상징성을 보존하고, 지속적·불변의 의미는 본문 자체의 표현과 주석으로 읽히게 했습니다.
theological_decisions:
- issue: 다윗 왕조의 지속성과 언약 표현
  chosen_reading: 본문은 야훼께서 다윗에게 이스라엘 위의 통치를 영원한 언약적 선물로 주셨다고 진술하며, '소금의 언약'은 그 지속성과 구속력을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - '''소금의 언약''을 ''영속적인 언약''으로 의역'
  rationale: 히브리어가 לְעוֹלָם과 בְּרִית מֶלַח를 함께 쓰므로, 번역에서 상징어를 지우기보다 그대로 살리는 것이 원문의 신학적 무게를 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
