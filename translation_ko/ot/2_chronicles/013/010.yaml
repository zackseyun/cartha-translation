source:
  edition: WLC
  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
  footnotes:
  - marker: a
    text: Or 'we have not abandoned him.'
    reason: lexical_alternative
  - marker: b
    text: Lit. 'the Levites in the work,' that is, engaged in their assigned service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 우리에게는 야훼께서 우리 하나님이시며, 우리는 그분을 버리지 않았습니다. 그리고 야훼를 섬기는 제사장들은 아론의 아들들이고, 레위 사람들은 자기 맡은 일에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분을 저버리지 않았습니다’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘레위 사람들은 그 일 안에 있다’는 뜻으로, 곧 맡겨진 봉사에 종사하고 있다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  english_pob_choice: But as for us
  chosen_korean: 그러나 우리에게는
  alternatives_korean:
  - 그러나 우리는
  - 그리고 우리는
  lexicon: HALOT
  rationale: 대조적 담화 표지를 살려 북이스라엘과 대비되는 유다의 입장을 분명히 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: יהוה의 고유 이름을 제목어로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְלֹא עֲזַבְנֻהוּ
  english_pob_choice: and we have not forsaken him
  chosen_korean: 우리는 그분을 버리지 않았습니다
  alternatives_korean:
  - 우리는 그분을 떠나지 않았습니다
  - 우리는 그분을 배반하지 않았습니다
  lexicon: HALOT
  rationale: עָזַב의 핵심 의미인 ‘버리다, 저버리다’를 살리되, 한국어에서는 ‘그분을 버리지 않았습니다’가 가장 직접적이고 자연스럽습니다.
- source_word: בַּמְלָאכֶת
  english_pob_choice: are in their work
  chosen_korean: 자기 맡은 일에 있습니다
  alternatives_korean:
  - 자기 일에 있습니다
  - 그들의 직무를 맡고 있습니다
  - 자기 맡은 일 가운데 있습니다
  lexicon: HALOT
  rationale: מְלָאכָה를 단순한 일반 노동이 아니라 성전에서 부여된 직무로 이해하여, ‘자기 맡은 일’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 하나님의 언약적 이름을 직접 사용하므로, 제목어인 ‘주’로 대체하지 않고 고유 नाम을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
