  naturalness: ‘당신들은’, ‘그 땅들의 백성들’, ‘자기들을 위해’, ‘자기 손을 채우는 자’는 현대 표준어 합쇼체 성경 문맥에서 다소 부자연스럽거나 어색합니다. ‘여러분은’, ‘여러 땅의 백성들’, ‘자신들을 위하여’, ‘자기 손을 … 채우면’으로 다듬는 것이 자연스럽습니다.
