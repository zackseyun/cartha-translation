source:
  edition: WLC
  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to fill his hand,'' a technical expression for priestly ordination or installation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for non-gods' or 'of false gods'; Hebrew literally denies that these objects of worship are truly gods.
    reason: alternative_reading
translation:
  language: ko
  text: 당신들은 야훼의 제사장들, 곧 아론의 자손들과 레위 사람들을 쫓아내고, 그 땅들의 백성들처럼 자기들을 위해 제사장들을 세우지 않았습니까? 누구든지 수송아지 한 마리와 숫양 일곱 마리를 가지고 와서 자기 손을 채우는 자는, 신들이 아닌 것들의 제사장이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘손을 채우다’는 제사장 직분의 서임 또는 임직을 가리키는 기술어입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘신들이 아닌 것들’이며, 우상들을 실제 신으로 인정하지 않는 부정 진술입니다.
    reason: theological_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC 표기 관례 + 프로젝트 기본 용례
  rationale: 원문의 언약 이름을 보존하기 위해 한국어 본문에서도 음역형 ‘야훼’를 사용했습니다.
- source_word: הִדַּחְתֶּם
  english_pob_choice: driven out
  chosen_korean: 쫓아내고
  alternatives_korean:
  - 몰아내고
  - 내쫓고
  lexicon: HALOT
  rationale: 제사장들을 강제로 제거했다는 공격성을 자연스러운 현대 한국어 동사로 전달했습니다.
- source_word: לְמַלֵּא יָדוֹ
  english_pob_choice: to fill his hand
  chosen_korean: 자기 손을 채우는
  alternatives_korean:
  - 자신을 서임하는
  - 자신을 임직하는
  lexicon: HALOT
  rationale: 제의적 기술어인 ‘손을 채우다’를 본문에서 그대로 살려, 위임/서임의 절차적 의미를 드러냈습니다.
- source_word: לְלֹא אֱלֹהִים
  english_pob_choice: of what are not gods
  chosen_korean: 신들이 아닌 것들
  alternatives_korean:
  - 거짓 신들의
  - 신이 아닌 것들의
  lexicon: HALOT
  rationale: 원문의 부정적 진술을 유지해, ‘거짓 신들’로 정리해 버리지 않고 참된 신성이 없다는 점을 직접적으로 표현했습니다.
theological_decisions:
- issue: וְהָיָה כֹהֵן לְלֹא אֱלֹהִים의 신학적 뉘앙스
  chosen_reading: ‘신들이 아닌 것들의 제사장이 됩니다’로 옮겨, 대상의 무신성에 대한 폄하를 본문 수준에서 유지했습니다.
  alternative_readings:
  - ‘거짓 신들의 제사장이 됩니다’
  - ‘신이 아닌 것들의 제사장이 됩니다’
  rationale: 히브리어는 단순한 분류가 아니라 참된 신성을 부정하는 논박이므로, 해석을 앞당겨 완화하지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: 레위/아론 계열의 정통 제사장직과 대비되는 부당한 임명의 강조
  chosen_reading: ‘쫓아내고… 자기들을 위해 제사장들을 세우지 않았습니까?’로 번역해 자기중심적 제도화의 비난을 선명하게 했습니다.
  alternative_readings:
  - ‘임명하고’
  - ‘삼아’
  rationale: 원문은 단순한 행정 행위보다 언약 질서를 거스른 자기편의적 설치를 비판하므로 그 긴장을 살렸습니다.
  doctrine_reference: 민수기 3–4장, 출애굽기 28–29장 제사장직 맥락
