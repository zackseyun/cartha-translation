  to: 느밧의 아들 여로보암은 다윗의 아들 솔로몬의 종이었습니다. 그가 일어나 그의 주인에게 반역했습니다.[a]
  rationale: 원문의 동격어 ‘다윗의 아들 솔로몬의 종’과 ‘그의 주인’을 명시하여 인물 관계와 반역의 대상을 보존했습니다. ‘일어나’는 קום의 행동 개시를, ‘반역했습니다’는 מרד의 정치적·권위적 반항을 반영합니다.
