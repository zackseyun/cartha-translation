  text: וַ/יָּ֨קָם֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט עֶ֖בֶד שְׁלֹמֹ֣ה בֶן דָּוִ֑יד וַ/יִּמְרֹ֖ד עַל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
  footnotes:
  - marker: a
    text: Or “against his master.”
    reason: lexical_alternative
translation:
  language: ko
  text: 느밧의 아들 여로보암은 다윗의 아들 솔로몬의 종이었습니다. 그가 일어나 그의 주인에게 반역했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 상전에게.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: rose up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어났습니다
  - 들고일어나
  lexicon: HALOT
  rationale: 서사적 동작의 개시를 자연스럽게 살리면서, 반역 행동으로의 전환을 과도하게 해석하지 않도록 ‘일어나다’로 옮겼습니다.
- source_word: עֶבֶד
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 종살이하는 자
  - 노예
  - 시종
  lexicon: HALOT
  rationale: 여기서는 솔로몬과의 신분·봉사 관계를 가리키므로 기본값인 ‘종’이 가장 무난하며, 영어 POB의 ‘servant’보다도 한국어에서 위계적 종속성을 분명히 드러냅니다.
- source_word: וַיִּמְרֹד
  english_pob_choice: rebelled
  chosen_korean: 반역했습니다
  alternatives_korean:
  - 반란을 일으켰습니다
  - 배반했습니다
  lexicon: HALOT
  rationale: מָרַד의 핵심은 권위에 대한 반역이므로, 현대 한국어에서 정치·권위적 반항을 분명하게 드러내는 ‘반역하다’로 옮겼습니다.
- source_word: עַל אֲדֹנָיו
  english_pob_choice: against his lord
  chosen_korean: 대항하여
  alternatives_korean:
  - 그의 주인에게
  - 그의 주에게
  - 그의 주인에 맞서
  lexicon: HALOT
  rationale: 인간 상급자를 가리키는 말이므로 신적 ‘주’와 구별해야 합니다. ‘대항하여’는 한국어에서 관계의 방향을 자연스럽게 드러내면서도, POB의 ‘his lord’가 지닌 권위 관계를 보존합니다.
theological_decisions:
- issue: 인간 אדֹן의 번역과 ‘주’ 용어 구분
  chosen_reading: 솔로몬을 인간 상급자로 보아 ‘종’과 함께 관계를 표현하되, ‘주님’이 아니라 서술적 관계어로 처리했습니다.
  alternative_readings:
  - 솔로몬의 주인
  - 솔로몬의 주
  rationale: 본문의 אֲדֹנָיו는 여호와나 메시아 칭호가 아니라 인간 통치자에 대한 종속 관계이므로, 신적 호칭과 혼동되지 않도록 문맥형 관계 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: human titles are rendered by context; divine name/title distinctions must be preserved.'
