  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָנָ֞י/ו ו/רב הַ/מַּשָּׂ֣א עָלָ֗י/ו וִ/יסוֹד֙ בֵּ֣ית הָ/אֱלֹהִ֔ים הִנָּ֣/ם כְּתוּבִ֔ים עַל מִדְרַ֖שׁ סֵ֣פֶר הַ/מְּלָכִ֑ים וַ/יִּמְלֹ֛ךְ אֲמַצְיָ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: Now his sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
  footnotes:
  - marker: a
    text: Or possibly, 'the greatness of the burden upon him,' 'the abundance of the pronouncement against him,' or even 'the heavy tribute laid on him.' The Hebrew phrase is difficult, and מַשָּׂא can mean 'burden,' 'oracle,' or in some contexts a load imposed.
    reason: lexical_alternative
  - marker: b
    text: '''Midrash'' here likely means an interpretive record, exposition, or commentary associated with the Book of the Kings.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 그의 아들들과, 그에 대한 많은 신탁들과, 하나님의 집의 기초 작업이—보십시오, 그것들이 왕들의 책의 미드라시에 기록되어 있습니다. 그리고 그의 아들 아마샤가 그의 자리를 이어 통치하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַשָּׂא 는 ‘부담’, ‘신탁’, 또는 어떤 경우에는 ‘부과된 짐’까지도 뜻할 수 있어, 이 구절은 해석상 여지가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘미드라시’는 여기서 왕들의 책과 관련된 해석적 기록, 해설, 또는 주해를 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  english_pob_choice: Now his sons
  chosen_korean: 이제 그의 아들들과
  alternatives_korean:
  - 그리고 그의 아들들과
  - 그의 아들들
  lexicon: HALOT
  rationale: 문맥상 왕의 생애를 마무리하는 요약 공지로 보아 연결어를 자연스럽게 살리되, 히브리어의 소유격을 그대로 반영했습니다.
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  english_pob_choice: the many oracles against him
  chosen_korean: 그에 대한 많은 신탁들과
  alternatives_korean:
  - 그에게 내린 많은 말씀이
  - 그에 대한 많은 선언들과
  - 그에 대한 많은 부담이
  lexicon: HALOT
  rationale: מַשָּׂא의 ‘부담’보다 예언적·심판적 발화라는 문맥을 우선해 ‘신탁’으로 옮겼고, רֹב은 ‘많은’으로 처리했습니다.
- source_word: וִיסוֹד
  english_pob_choice: the founding of
  chosen_korean: 하나님의 집의 기초 작업이
  alternatives_korean:
  - 하나님의 집의 기초가
  - 하나님의 집의 터놓음이
  - 하나님의 집의 건립이
  lexicon: HALOT
  rationale: יסד의 기본 의미를 살려 ‘기초 작업’으로 옮겨, 이 구절이 건물의 기초를 놓는 행위를 가리키는지를 열어 두었습니다.
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  english_pob_choice: in the Midrash of the Book of the Kings
  chosen_korean: 왕들의 책의 미드라시에
  alternatives_korean:
  - 왕들의 책의 주해서에
  - 왕들의 책에 대한 해설에
  - 왕들의 책의 미드라시 문헌에
  lexicon: HALOT
  rationale: מִדְרַשׁ을 고유명사적으로 음역해 원문의 장르적 뉘앙스를 보존했고, 본문 내부에서는 장소격 조사로 처리했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּי/ו
  english_pob_choice: And Amaziah his son reigned in his place
  chosen_korean: 그리고 그의 아들 아마샤가 그의 자리를 이어 통치하였습니다
  alternatives_korean:
  - 그리고 그의 아들 아마샤가 그 대신 왕이 되었습니다
  - 그리고 그의 아들 아마샤가 그를 대신하여 다스렸습니다
  lexicon: HALOT
  rationale: 왕위 계승 공식을 현대 한국어로 자연스럽게 풀되, ‘통치하였습니다’로 공식성을 유지했습니다.
theological_decisions:
- issue: מַשָּׂא의 의미 선택
  chosen_reading: 심판적 신탁의 의미를 살려 ‘신탁들’로 번역했습니다.
  alternative_readings:
  - ‘부담’으로 번역
  - ‘선언들’로 중립화
  rationale: 주어진 영어 POB가 ‘oracles’를 채택했고, 역대기의 문맥에서도 조악의 종말을 둘러싼 예언적 발화로 읽는 편이 더 직접적입니다. 다만 의미 폭은 주석으로 남겨 둡니다.
  doctrine_reference: 역사서의 예언-성취 문맥
