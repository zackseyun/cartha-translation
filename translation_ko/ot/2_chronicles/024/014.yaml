base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
  footnotes:
  - marker: a
    text: Or 'he made it into vessels'; the Hebrew verb is singular with a singular object suffix referring to the remaining silver.
    reason: lexical_alternative
  - marker: b
    text: Or 'articles for service.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'for offering up'; the object is not stated here, though 'burnt offerings' is named explicitly later in the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 마치자, 남은 은을 왕과 여호야다 앞에 가져왔습니다. 그것으로 야훼의 집을 위한 기구들, 곧 섬김을 위한 기구들과 드려 올리는 데 쓰는 기구들과 대접들, 그리고 금과 은 기구들을 만들었습니다[c][b]. 그리고 그들은 여호야다가 살아 있는 모든 날 동안 야훼의 집에서 번제물을 계속 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 '봉사를 위한 기구들'.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 '드려 올리는 데'라고만 하며, 무엇을 드리는지는 여기서 직접 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  english_pob_choice: When they had finished
  chosen_korean: 그들이 마치자
  alternatives_korean:
  - 그들이 끝마치자
  - 그들이 마친 뒤에
  lexicon: HALOT
  rationale: 시간을 나타내는 분사적 구문으로, 뒤따르는 행동의 배경을 자연스럽게 여는 한국어 표현으로 옮겼습니다.
- source_word: שְׁאָר הַכֶּסֶף
  english_pob_choice: the rest of the silver
  chosen_korean: 남은 은
  alternatives_korean:
  - 나머지 은
  - 남은 돈
  lexicon: HALOT
  rationale: כֶּסֶף는 여기서 단순한 금전보다 재료로서의 은을 가리키므로, 물질 의미를 살렸습니다.
- source_word: כְּלֵי שָׁרֵת
  english_pob_choice: articles for ministry
  chosen_korean: 섬김을 위한 기구들
  alternatives_korean:
  - 사역을 위한 기구들
  - 봉사를 위한 기구들
  - 예배용 기구들
  lexicon: HALOT
  rationale: שָׁרֵת의 성소적 기능을 살리되, 현대 한국어에서 어색하지 않도록 '섬김'으로 옮겼습니다.
- source_word: וְהַעֲלֹות
  english_pob_choice: for offering up
  chosen_korean: 드려 올리는 데 쓰는
  alternatives_korean:
  - 드리는 데 쓰는
  - 제사를 올리는 데 쓰는
  - 올려 드리는
  lexicon: HALOT
  rationale: 동사가 명시적 목적어 없이 제의적 '올려 드림'을 뜻하므로, 과도하게 특정하지 않고 기능을 풀어 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상의 언약 이름을 직역 관례에 따라 '야훼'로 일관되게 렌더링했습니다.
- source_word: מַעֲלִים עֹלֹות
  english_pob_choice: they were offering burnt offerings
  chosen_korean: 번제물을 계속 드렸습니다
  alternatives_korean:
  - 번제물을 드렸습니다
  - 번제를 계속 드렸습니다
  - 번제물을 계속 올렸습니다
  lexicon: HALOT
  rationale: תָּמִיד와 함께 지속적 관습을 나타내므로 '계속'을 넣어 지속성을 드러냈고, '드렸습니다'로 제의적 동작을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 본문의 제의적 지속성(תָּמִיד) 표현
  chosen_reading: 여호야다가 살아 있는 동안 야훼의 집에서 번제물을 계속 드렸습니다
  alternative_readings:
  - 번제물을 드렸습니다
  - 번제물을 정기적으로 드렸습니다
  rationale: 히브리어는 단회 사건이 아니라 지속적 관행을 가리키므로, 신학적·서사적 강조를 살려 지속성을 명시했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §6
- issue: 제의적 용어 שָׁרֵת의 한국어화
  chosen_reading: 섬김을 위한 기구들
  alternative_readings:
  - 봉사를 위한 기구들
  - 예배용 기구들
  rationale: 전통 교회어의 고정 관용보다 원문의 기능 중심 의미를 드러내어, 성전 기구의 용도를 더 직접적으로 보여줍니다.
  doctrine_reference: DOCTRINE.md contested terms — cultic service vocabulary
