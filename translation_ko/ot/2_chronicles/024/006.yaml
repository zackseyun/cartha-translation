revisions:
- from: 그때 왕이 여호야다 대제사장을 불러 그에게 말했습니다. “어찌하여 레위 사람들에게 유다와 예루살렘에서 모세, 곧 야훼의 종과 이스라엘 회중의 성막을 위한 세금을 가져오게 하도록 요구하지 않았습니까?”
  to: 그때 왕이 지도자 여호야다를 불러 그에게 말했습니다. “어찌하여 레위 사람들에게 유다와 예루살렘에서, 야훼의 종 모세와 이스라엘 회중이 증거의 장막을 위하여 정한 부담금을 가져오라고 요구하지 않았습니까?”
  rationale: 원문이 명시하지 않은 ‘대제사장’ 직함을 제거하고, ‘증거의 장막’으로 원문의 어휘 요소를 회복했습니다. ‘모세와 이스라엘 회중’은 히브리어의 병렬 관계를 보존하되, 부담금의 부과·규정 주체라는 문맥상 관계가 한국어에서 이해되도록 ‘정한’을 보충했습니다. 이는 의무 납부금이라는 영어 POB의 ‘tax’ 의미를 유지하면서도 현대 한국어에서 행정적 국가세로만 오해될 가능성을 줄입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:19:28Z'
