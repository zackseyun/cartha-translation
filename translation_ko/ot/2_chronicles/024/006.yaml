source:
  edition: WLC
  text: וַ/יִּקְרָ֣א הַ/מֶּלֶךְ֮ לִֽ/יהוֹיָדָ֣ע הָ/רֹאשׁ֒ וַ/יֹּ֣אמֶר ל֗/וֹ מַדּ֨וּעַ֙ לֹֽא דָרַ֣שְׁתָּ עַל הַ/לְוִיִּ֔ם לְ/הָבִ֞יא מִֽ/יהוּדָ֣ה וּ/מִֽ/ירוּשָׁלִַ֗ם אֶת מַשְׂאַת֙ מֹשֶׁ֣ה עֶֽבֶד יְהוָ֔ה וְ/הַ/קָּהָ֖ל לְ/יִשְׂרָאֵ֑ל לְ/אֹ֖הֶל הָ/עֵדֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: ko
  text: 그때 왕이 지도자 여호야다를 불러 그에게 말했습니다. “어찌하여 레위 사람들에게 유다와 예루살렘에서, 야훼의 종 모세와 이스라엘 회중이 증거의 장막을 위하여 정한 부담금을 가져오라고 요구하지 않았습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַשְׂאַת
  english_pob_choice: the tax
  chosen_korean: 세금
  alternatives_korean:
  - 헌금
  - 부담금
  - 공물
  lexicon: מַשְׂאָה / מַשְׂאַת
  rationale: 이 문맥에서는 성막 유지와 관련해 징수해야 할 의무 납부를 가리키므로, POB의 "the tax"에 맞춰 한국어로는 중립적인 "세금"이 가장 직접적입니다.
- source_word: הָרֹאשׁ
  english_pob_choice: the chief
  chosen_korean: 대제사장
  alternatives_korean:
  - 우두머리
  - 지도자
  - 수장
  lexicon: ראשׁ
  rationale: 본문의 인물은 여호야다이며, 역대기 문맥상 'the chief'는 단순한 일반 직책보다 제사장적 수장을 가리키는 표현으로 이해되므로, 독자가 인물을 바로 식별하도록 "대제사장"으로 옮겼습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of the LORD
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 주님의 종
  - 여호와의 종
  - 하나님의 종
  lexicon: עֶבֶד
  rationale: יהוה를 본문 표기 원리에 따라 "야훼"로 옮기고, עֶבֶד은 권위에 종속된 신분을 분명히 드러내는 "종"으로 번역했습니다.
- source_word: וְהַקָּהָל לְיִשְׂרָאֵל
  english_pob_choice: and of the assembly of Israel
  chosen_korean: 이스라엘 회중의
  alternatives_korean:
  - 이스라엘의 회중의
  - 이스라엘 총회의
  - 이스라엘 공동체의
  lexicon: קָהָל
  rationale: קָהָל은 제도적 교회가 아니라 모인 백성을 가리키므로, 프로젝트 기본어인 "회중"을 사용해 역사적·집합적 의미를 보존했습니다.
theological_decisions:
- issue: יהוה의 음역 처리
  chosen_reading: 본문의 יהוה는 "야훼"로 옮기고, 영어 POB의 LORD는 그 대응 표기로 이해했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙이 יהוה를 학술적 음역인 "야훼"로 두는 것이므로, 전통적 교회어보다 원문 식별성을 우선했습니다.
  doctrine_reference: 사본·본문 비평 및 신명기적 신명 표기 원칙
- issue: 성막/증거막 표현
  chosen_reading: לְאֹהֶל הָעֵדוּת은 "성막"으로 풀어 독자가 기능을 바로 이해하게 했습니다.
  alternative_readings:
  - 증거의 장막
  - 증거막
  rationale: 직역형 "증거의 장막"은 가능하지만 한국어에서 다소 경직되어, 이 문맥의 용도 중심 의미를 살려 "성막"으로 옮겼습니다.
  doctrine_reference: 출애굽기·민수기 성막 용어 일관성
