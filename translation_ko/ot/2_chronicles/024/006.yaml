  source_fidelity: 원문의 הָרֹאשׁ는 직함의 종류를 명시하지 않는 ‘the chief’이므로 ‘대제사장’으로 특정하지 않는 편이 안전합니다. 또한 לְאֹהֶל הָעֵדוּת의 ‘증거/증언’ 요소가 초안의 ‘성막’에서 빠졌습니다. מַשְׂאַת는 이 문맥에서 공동체에 부과된 납부금·부담금으로 이해될 수 있으며, ‘세금’도 가능하나 문장 내 수식 관계를 더 분명히 할 필요가 있습니다.
  naturalness: ‘가져오게 하도록 요구하지 않았습니까’는 사역과 요구가 중복되어 다소 무겁습니다. ‘가져오라고 요구하지 않았습니까’가 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 질문 형식도 잘 살립니다.
  terminology: ‘야훼의 종 모세’, ‘이스라엘 회중’, ‘증거의 장막’을 사용하여 원문의 인명·신명·집합 명사 및 אֹהֶל הָעֵדוּת의 핵심 요소를 보존했습니다. הָרֹאשׁ는 ‘지도자’로 옮겨 원문과 영어 POB의 비특정성을 유지했습니다.
