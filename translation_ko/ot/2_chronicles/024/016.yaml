  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְבְּרֻ֥/הוּ בְ/עִיר דָּוִ֖יד עִם הַ/מְּלָכִ֑ים כִּֽי עָשָׂ֤ה טוֹבָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/עִ֥ם הָ/אֱלֹהִ֖ים וּ/בֵיתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
  footnotes:
  - marker: a
    text: Or 'with the kings.'
    reason: lexical_alternative
  - marker: b
    text: That is, toward God and toward God's house, the temple.
    reason: cross_reference
translation:
  language: ko
  text: 그를 다윗의 성에 왕들과 함께 묻었는데[a], 이는 그가 이스라엘에서 선을 행하고 하나님과 그의 집을 향해 선을 행했기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕들과 더불어’.
    reason: lexical_alternative
  - marker: b
    text: 곧 하나님과 하나님의 집, 성전을 향해 선을 행했다는 뜻입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  english_pob_choice: And they buried him
  chosen_korean: 그를 … 묻었는데
  alternatives_korean:
  - 그를 묻었습니다
  - 그를 장사했습니다
  lexicon: WLC
  rationale: 히브리어는 3인칭 복수의 능동형이므로 주체를 명시하지 않은 채 ‘그를 … 묻었는데’로 옮겨 원문 형식을 살렸습니다.
- source_word: בְעִיר דָּוִיד
  english_pob_choice: in the city of David
  chosen_korean: 다윗의 성에
  alternatives_korean:
  - 다윗 성에
  - 다윗의 도시에
  lexicon: HALOT
  rationale: 고유한 지명 표현이므로 익숙한 성경적 지명을 유지해 자연스럽게 옮겼습니다.
- source_word: עִם הַמְּלָכִים
  english_pob_choice: among the kings
  chosen_korean: 왕들과 함께
  alternatives_korean:
  - 왕들 가운데
  - 왕들과 더불어
  lexicon: HALOT
  rationale: 장례 맥락에서 ‘עם’의 공존 의미를 한국어 ‘함께’로 자연스럽게 살렸고, 왕들 사이에 안장되었다는 함의를 보존했습니다.
- source_word: עָשָׂה טוֹבָה
  english_pob_choice: he had done good
  chosen_korean: 선을 행하고
  alternatives_korean:
  - 좋은 일을 하고
  - 선한 일을 하고
  lexicon: HALOT
  rationale: ‘טוֹבָה’는 단순한 호감이 아니라 선행의 평가를 담으므로, 한국어 성경에서 흔히 쓰는 ‘선을 행하다’로 압축해 옮겼습니다.
- source_word: וְעִם הָאֱלֹהִים וּבֵיתוֹ
  english_pob_choice: and toward God and his house
  chosen_korean: 하나님과 그의 집을 향해 선을 행했기
  alternatives_korean:
  - 하나님과 그의 집을 위하여
  - 하나님과 그의 집에 대하여
  lexicon: HALOT
  rationale: 영어 POB의 ‘toward’를 따라 관계의 방향성을 드러냈고, ‘그의 집’은 바로 뒤 설명이 없더라도 문맥상 하나님의 집을 가리키는 것으로 읽히게 했습니다.
theological_decisions:
- issue: ‘그의 집’의 지시 대상
  chosen_reading: ‘그의 집’은 하나님 집, 곧 성전으로 읽었습니다.
  alternative_readings:
  - 여호야다 자신의 집안
  - 이스라엘의 집
  rationale: 직전의 ‘하나님과’가 가장 가까운 선행사이며, 문맥 전체도 성전 관련 충성을 강조하므로 하나님 집으로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥·대명사 지시 해석
- issue: 마지막 절의 평가 표현
  chosen_reading: ‘그가 … 선을 행하고’로 두 번의 선행을 분리해 원문의 평가를 보존했습니다.
  alternative_readings:
  - ‘이스라엘과 하나님께 선을 행했다’로 통합
  - ‘이스라엘에서 하나님과 그의 집을 위해 좋은 일을 했다’로 의역
  rationale: 히브리어의 병렬 평가를 평준화하지 않고, 이스라엘 안에서의 선행과 하나님/그의 집을 향한 선행을 함께 드러내는 것이 원문의 긴장과 강조를 더 잘 보존합니다.
  doctrine_reference: 문맥적 병렬 구조
