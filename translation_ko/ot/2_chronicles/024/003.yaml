translation:
  language: ko
  text: 여호야다는 그를 위해 두 아내를 맞이하게 하였고, 그는 아들과 딸들을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 가능성은 낮지만, ‘여호야다가 두 아내를 맞이하고 아들과 딸들을 낳았다’로도 볼 수 있습니다. 이 경우에는 여호야다가 구절 전체의 주어로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא לּוֹ
  english_pob_choice: took for him
  chosen_korean: 그를 위해 … 맞이하게 하였고
  alternatives_korean:
  - 그를 위해 … 데려왔고
  - 그를 위해 … 취하였고
  lexicon: HALOT
  rationale: נשא + אשה/נשים는 결혼 문맥에서 ‘아내를 들이다/맞이하다’의 뜻이지만, לּוֹ가 ‘그를 위해’라는 수혜 의미를 분명히 하므로 여호야다가 주도적으로 혼인을 마련한 뉘앙스를 살렸습니다.
- source_word: נָשִׁים שְׁתָּיִם
  english_pob_choice: two wives
  chosen_korean: 두 아내
  alternatives_korean:
  - 두 여자
  - 두 부인
  lexicon: HALOT
  rationale: נשים는 이 문맥에서 단순한 ‘여자들’이 아니라 혼인 관계의 대상이므로 ‘아내’로 옮겼고, 수사는 ‘두’로 그대로 유지했습니다.
- source_word: וַיּוֹלֶד
  english_pob_choice: he fathered
  chosen_korean: 낳았습니다
  alternatives_korean:
  - 아버지가 되었습니다
  - 생기게 했습니다
  lexicon: HALOT
  rationale: 남성 주어의 ילד는 ‘낳다/자식을 두다’보다 ‘아버지가 되다’에 가깝지만, 한국어에서는 자연스럽고 간결하게 ‘낳았습니다’로 옮겨 부성 생성의 결과를 분명히 했습니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons and daughters
  chosen_korean: 아들과 딸들
  alternatives_korean:
  - 아들들과 딸들
  - 자녀들
  lexicon: HALOT
  rationale: 히브리어가 남녀 자녀를 구분하므로 ‘자녀들’로 평탄화하지 않고 성별을 살려 번역했습니다.
theological_decisions:
- issue: 여호야다와 요아스의 행위 주체 구분
  chosen_reading: 표면 문장은 여호야다가 ‘그를 위해’ 두 아내를 마련한 것으로 두고, 뒤의 출산은 문맥상 요아스를 가리키는 것으로 읽히게 했습니다.
  alternative_readings:
  - 여호야다가 직접 두 아내를 맞이하고 자녀를 낳았다
  rationale: 원문은 여호야다를 명시 주어로 두지만 לּוֹ가 수혜자를 가리키므로, 영어 POB의 문맥 판단을 따라 주체 혼선을 한국어 본문에서 과도하게 해소하지 않고 그대로 남겼습니다.
  doctrine_reference: 문맥적 지시어 해석
