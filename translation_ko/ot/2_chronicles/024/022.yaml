id: 2CH.24.22
reference: 2 Chronicles 24:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא זָכַ֞ר יוֹאָ֣שׁ הַ/מֶּ֗לֶךְ הַ/חֶ֨סֶד֙ אֲשֶׁ֨ר עָשָׂ֜ה יְהוֹיָדָ֤ע אָבִי/ו֙ עִמּ֔/וֹ וַֽ/יַּהֲרֹ֖ג אֶת בְּנ֑/וֹ וּ/כְ/מוֹת֣/וֹ אָמַ֔ר יֵ֥רֶא יְהוָ֖ה וְ/יִדְרֹֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
  footnotes:
  - marker: a
    text: Or 'the loyalty' or 'the covenant faithfulness' that Jehoiada had shown him.
    reason: lexical_alternative
  - marker: b
    text: '''His father'' likely reflects Jehoiada''s fatherly role toward Joash rather than biological paternity.'
    reason: cultural_note
  - marker: c
    text: Or 'May the LORD see and require it.' The Hebrew verb can carry the sense of seeking out wrongdoing in order to hold someone accountable.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 요아스 왕은 그의 아버지[b] 여호야다가 요아스에게 베푼 호의[a]를 기억하지 않았고, 여호야다의 아들을 죽였습니다. 그 아들이 죽어 가면서 말했습니다. “야훼께서 보시고 책임을 물으시기를 바랍니다.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호의’는 여기서 ‘충성’ 또는 ‘언약적 신실함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 아버지’는 여호야다가 요아스의 생물학적 아버지였다는 뜻이라기보다, 그에게 아버지 같은 보호자 역할을 했음을 반영한 표현일 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: ‘책임을 물으시기를 바랍니다’는 히브리어 동사가 불의를 찾아내어 책임을 추궁하거나 그에 대한 책임을 요구하는 뜻을 가질 수 있음을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶסֶד
  english_pob_choice: the kindness
  chosen_korean: 친절
  alternatives_korean:
  - 은혜
  - 인애
  - 언약적 신실함
  lexicon: HALOT
  rationale: חֶסֶד은 상황에 따라 친절, 인애, 언약적 신실함까지 가질 수 있지만, 여기서는 사람 사이의 구체적 호의이므로 현대 한국어의 자연스러운 ‘친절’이 가장 직접적입니다.
- source_word: זָכַר
  english_pob_choice: did not remember
  chosen_korean: 기억하지 않았고
  alternatives_korean:
  - 떠올리지 않았고
  - 마음에 두지 않았고
  lexicon: HALOT
  rationale: 히브리어의 ‘기억하다’는 단순 회상이 아니라 그 은혜를 따라 반응하지 않는 뜻을 포함하므로, 직설적인 ‘기억하지 않았다’를 유지했습니다.
- source_word: אָבִיו
  english_pob_choice: his father
  chosen_korean: 그의 아버지
  alternatives_korean:
  - 그의 양아버지
  - 그의 후견인
  lexicon: HALOT
  rationale: 본문은 여호야다를 요아스의 생물학적 아버지라기보다 아버지처럼 돌본 존재로 부르므로, 원문의 표현을 살리되 한국어에서도 자연스럽게 ‘그의 아버지’로 옮겼습니다.
- source_word: יֵרֶא יְהוָה
  english_pob_choice: May Yahweh see
  chosen_korean: 야훼여, 보시고
  alternatives_korean:
  - 야훼여, 보아 주십시오
  - 야훼께서 보시기를
  lexicon: HALOT
  rationale: חֶסֶד 이후의 마지막 탄원은 하나님의 관찰과 개입을 구하는 간구이므로, 합쇼체 기도문에 맞게 ‘보시고’로 옮겼습니다.
- source_word: וְיִדְרֹשׁ
  english_pob_choice: and require it
  chosen_korean: 갚으십시오
  alternatives_korean:
  - 요구하십시오
  - 찾으십시오
  - 책임을 물으십시오
  lexicon: HALOT
  rationale: דרש는 여기서 단순 요구보다 불의에 대한 응답과 책임 추궁을 뜻하므로, 한국어에서 그 결과를 함축하는 ‘갚으십시오’가 가장 자연스럽고 압축적입니다.
theological_decisions:
- issue: 야훼의 이름과 간구체 처리
  chosen_reading: 본문의 직접 화법을 살려 ‘야훼여’로 부르고, 청유형 기도로 ‘보시고 갚으십시오’라고 번역했습니다.
  alternative_readings:
  - ‘주님이 보시고 갚으시기를’이라는 서술형
  - ‘주여 보시고 요구하십시오’라는 직역형
  rationale: 원문은 여호와 이름을 직접 호명하는 탄원입니다. 한국어 합쇼체에서는 하나님께 드리는 직접 청원으로 옮기는 것이 화행상 가장 충실합니다.
  doctrine_reference: Imprecatory prayer and divine judicial reckoning
