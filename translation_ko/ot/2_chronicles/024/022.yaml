- from: 그러나 왕 요아스는 그의 아버지 여호야다가 자기에게 베푼 친절을 기억하지 않았고, 그의 아들을 죽였습니다. 그가 죽어 가면서 말했습니다. 「야훼여, 보시고 갚으십시오.」[a][b][c]
  to: 그러나 요아스 왕은 그의 아버지[b] 여호야다가 요아스에게 베푼 호의[a]를 기억하지 않았고, 여호야다의 아들을 죽였습니다. 그 아들이 죽어 가면서 말했습니다. “야훼께서 보시고 책임을 물으시기를 바랍니다.”[c]
  rationale: 인물 관계와 행동의 대상을 명시하여 원문의 지시 관계를 보존했습니다. 마지막 청원은 야훼가 주어인 히브리어 표현을 유지하고, דרש의 의미를 특정한 보복으로 단정하지 않도록 ‘책임을 물으시다’로 조정했습니다. 각주 표지도 해당 단어와 구절에 직접 배치했습니다.
