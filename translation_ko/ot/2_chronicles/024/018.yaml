id: 2CH.24.18
reference: 2 Chronicles 24:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
  footnotes:
  - marker: a
    text: Or 'the Asherah poles.' The Hebrew term refers to cultic Asherah objects, and may also evoke the goddess Asherah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 조상들의 하나님이신 야훼의 집을 버리고 아세라 목상들과 우상들을 섬겼습니다. 그러므로 이들의 이러한 죄로 인해 유다와 예루살렘 위에 진노가 임했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아세라 목상들’은 히브리어 복수형 아쉐림을 풀이한 것입니다. 이 말은 아세라와 관련된 제의용 물체를 가리킬 수 있으며, 어떤 경우에는 여신 아세라를 연상시키기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יַּֽעַזְב֗וּ
  english_pob_choice: abandoned
  chosen_korean: 버리고
  alternatives_korean:
  - 떠나고
  - 저버리고
  lexicon: HALOT
  rationale: עזב은 떠나다, 버리다, 저버리다의 뜻이 있으므로, 문맥의 언약적 불충성을 자연스럽게 드러내는 ‘버리고’로 옮겼습니다.
- source_word: בֵּ֤ית יְהוָה֙
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘집’을 살리면서도, 본문이 가리키는 성전 맥락은 문맥상 분명하므로 ‘야훼의 집’으로 옮겼습니다.
- source_word: הָ/אֲשֵׁרִ֖ים
  english_pob_choice: the Asherim
  chosen_korean: 아세라 목상들
  alternatives_korean:
  - 아세라 상들
  - 아세라 기둥들
  lexicon: HALOT
  rationale: 해당 용어는 아세라와 연관된 제의적 물체를 가리킬 수 있으므로, 의미를 드러내되 과도하게 단정하지 않는 ‘아세라 목상들’을 채택했습니다.
- source_word: הָֽ/עֲצַבִּ֑ים
  english_pob_choice: the idols
  chosen_korean: 우상들
  alternatives_korean:
  - 형상들
  - 조각상들
  lexicon: HALOT
  rationale: עצבים은 우상, 새긴 형상이라는 부정적 종교 용례가 강하므로, 그 폄하적 뉘앙스를 살려 ‘우상들’로 옮겼습니다.
- source_word: וַֽ/יְהִי קֶ֗צֶף
  english_pob_choice: So wrath came
  chosen_korean: 그러므로 … 진노가 임했습니다
  alternatives_korean:
  - 그리하여 분노가 일어났습니다
  - 그래서 노여움이 임했습니다
  lexicon: HALOT
  rationale: קצף는 여기서 심판으로서의 진노를 뜻하므로, 한국어 성경 문맥에 자연스러운 ‘진노가 임했습니다’로 옮기고, 앞선 원인절을 반영해 결과 연결을 분명히 했습니다.
theological_decisions:
- issue: אָמְשָׁתָם/בְּאַשְׁמָתָם의 인과 관계
  chosen_reading: ‘이들의 이러한 죄로 인해’로 옮겨, 죄책이 진노의 원인임을 드러냈습니다.
  alternative_readings:
  - ‘이들의 죄책 때문에’
  - ‘이 일의 죄과로 인해’
  rationale: בְּאַשְׁמָתָם는 원인적 ב를 동반한 ‘그들의 죄책/죄과로 인해’라는 뜻이므로, 단순한 사유가 아니라 책임 있는 죄의 결과라는 점을 살렸습니다.
  doctrine_reference: source syntax and narrative causality
- issue: 야훼의 진노의 주체
  chosen_reading: 본문에 없는 ‘하나님의’/‘야훼의’가 ‘진노’ 앞에 직접 붙지 않도록 했습니다.
  alternative_readings:
  - ‘야훼의 진노가 임했습니다’
  - ‘하나님의 진노가 임했습니다’
  rationale: 히브리어는 단순히 ‘진노가 임했다’고 말하므로, 주체를 암시적으로 두어 본문이 말하는 서술의 절제를 유지했습니다.
  doctrine_reference: translation philosophy items 1 and 3
