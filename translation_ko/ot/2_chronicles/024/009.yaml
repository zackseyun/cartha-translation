base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
  footnotes:
  - marker: a
    text: Or 'the contribution' or 'the tax of Moses the servant of God.' The Hebrew term refers to an assessed offering or levy.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 유다와 예루살렘에서 야훼께 모세—하나님의 종—가 광야에서 이스라엘에게 부과한 할당금을 가져오라고 선포했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘할당금’은 문맥상 ‘헌납’보다 의무적·부과적 성격을 더 잘 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  english_pob_choice: they made a proclamation
  chosen_korean: 선포했습니다
  alternatives_korean:
  - 공포했습니다
  - 외쳤습니다
  lexicon: HALOT
  rationale: 공적인 통지를 전국적으로 알리는 뜻을 살려, 자연스러운 현대 한국어로는 ‘선포했습니다’가 가장 적절합니다.
- source_word: מַשְׂאַת
  english_pob_choice: the levy
  chosen_korean: 할당금
  alternatives_korean:
  - 부담금
  - 헌납금
  - 세금
  lexicon: HALOT
  rationale: 이 단어는 자발적 헌금보다 ‘부과된 정해진 몫’에 가깝기 때문에, 의무성과 산정된 성격을 드러내는 ‘할당금’을 택했습니다.
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  english_pob_choice: Moses the servant of God
  chosen_korean: 모세—하나님의 종—
  alternatives_korean:
  - 모세, 하나님의 종
  - 하나님의 종 모세
  lexicon: HALOT
  rationale: 히브리어 관형구를 그대로 살리면서도, 삽입구처럼 보이도록 대시로 묶어 모세를 수식하는 호칭임을 드러냈습니다.
- source_word: לַֽיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 본문에 직접 나온 신명은 프로젝트 기본 원칙에 따라 ‘야훼’로 옮기고, 여격은 ‘-께’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 할당금의 성격
  chosen_reading: 이 항목은 단순한 자발적 헌금이 아니라 모세의 명령에 따라 이스라엘에게 부과된 정해진 부담입니다.
  alternative_readings:
  - 헌납
  - 기부
  - 세금
  rationale: 히브리어 מַשְׂאַת의 맥락상 의무적으로 산정된 공납의 뉘앙스가 있어, 이를 약화시키지 않도록 ‘할당금’으로 표현했습니다.
  doctrine_reference: 본문의 역사-언약적 부담 규정
