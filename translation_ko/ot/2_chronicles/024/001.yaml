  - 즉위할 때
  lexicon: HALOT
  rationale: 접두 ב의 시점 의미를 살려 즉위 시점을 나타내는 한국어로 옮겼습니다.
- source_word: מָלַךְ
  english_pob_choice: he reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 재위했습니다
  lexicon: HALOT
  rationale: 왕이 다스린 기간을 나타내는 서술로, 연대기적 문맥에 맞는 동사를 선택했습니다.
- source_word: מִבְּאֵר שָׁבַע
  english_pob_choice: from Beer-sheba
