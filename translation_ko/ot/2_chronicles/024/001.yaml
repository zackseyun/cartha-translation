  lexicon: HALOT
  rationale: 출신지를 나타내는 מ-를 한국어의 출신 표현으로 반영했습니다.
theological_decisions:
- issue: 왕위 서술의 문체
  chosen_reading: 연대기형 왕실 기록의 간결한 서술을 살려, 설명을 덧붙이지 않고 사실 진술만 제시했습니다.
  alternative_readings:
  - 즉위와 재위의 의미를 풀어쓴 서술
  - 왕이 되었다는 설명형 문장
  rationale: 본문은 신학적 논설이 아니라 왕의 연령, 재위 기간, 출신 정보를 기록하는 공식 기록 형식이므로 그 형식을 보존하는 것이 가장 충실합니다.
  doctrine_reference: 역대기 왕조 연대기 서술 관습
