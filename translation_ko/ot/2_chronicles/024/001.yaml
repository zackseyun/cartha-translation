  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: ko
  text: 요아시는 왕위에 오를 때 나이가 일곱 살이었고, 예루살렘에서 사십 년 동안 다스렸습니다. 그의 어머니의 이름은 브엘세바 출신의 지브야였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  english_pob_choice: was seven years old
  chosen_korean: 나이가 일곱 살이었고
  alternatives_korean:
  - 일곱 살의 아들이었고
  - 일곱 해의 아들이었고
  lexicon: HALOT
  rationale: 히브리어 나이 표현을 자연스러운 한국어로 옮기되, 단순 연령 진술이라는 본뜻을 유지했습니다.
- source_word: בְּמָלְכוֹ
  english_pob_choice: when he began to reign
  chosen_korean: 왕위에 오를 때
