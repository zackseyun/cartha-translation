  rationale: 본문이 신명기 이름 יְהוָה를 직접 사용하므로, 전통적 대체어 대신 고유한 신명 형태를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
