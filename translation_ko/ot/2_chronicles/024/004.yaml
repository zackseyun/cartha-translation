lexical_decisions:
- source_word: וַיְהִ֖י אַחֲרֵי כֵ֑ן
  english_pob_choice: After this
  chosen_korean: 이 일 후에
  alternatives_korean:
  - 그 후에
  - 이후에
  lexicon: HALOT
  rationale: 시간의 전환을 자연스럽게 살리면서도 서술의 흐름을 간결하게 유지하는 표현입니다.
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  english_pob_choice: it was in the heart of Joash
  chosen_korean: 요아스의 마음에 … 뜻이 있었습니다
  alternatives_korean:
  - 요아스의 마음에 있었습니다
  - 요아스가 마음에 품었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 내적 의도성을 살리되, 현대 한국어에서 이해되기 쉬운 방식으로 옮겼습니다. 단순한 감정보다 결단을 포함한 내적 의향을 드러냅니다.
- source_word: לְחַדֵּשׁ
  english_pob_choice: to restore
  chosen_korean: 새롭게 하려는
  alternatives_korean:
  - 복구하려는
  - 수리하려는
  - 갱신하려는
  lexicon: HALOT
  rationale: 건물 문맥에서 ‘다시 새롭게 하다’는 뜻을 가장 넓고 자연스럽게 전달합니다. ‘수리하다’보다 덜 협소하고, 영어 POB의 ‘restore’와도 잘 대응합니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: 원문의 직역 구조를 살리되, POB의 고유명사 원칙에 따라 신명은 ‘야훼’로 옮겼습니다. ‘성전’은 해석적이지만 여기서는 원형 표현을 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
