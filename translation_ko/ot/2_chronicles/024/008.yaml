  rationale: 본 절의 יְהוָה는 고유한 언약명으로 직접 표기되어 있으므로, 프로젝트 기준에 맞춰 ‘야훼’로 일관되게 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
