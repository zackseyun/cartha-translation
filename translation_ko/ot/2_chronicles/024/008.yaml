revisions:
- from: 그러자 왕이 명령하니, 그들이 하나의 궤를 만들고 야훼의 집 문 밖에, 곧 바깥에 두었습니다.[a]
  to: 그러자 왕이 명령했습니다. 그들은 상자 하나를 만들어 야훼의 집 문 밖에 두었습니다.[a]
  rationale: The revision removes the duplicated rendering of ‘outside,’ uses consistent modern formal-polite narration, and renders the container as ‘상자 하나’ to preserve the explicit numeral while avoiding confusion with the covenant ark. The footnote retains the lexical alternative ‘궤’ and limits its explanation to what the Hebrew wording can support.
