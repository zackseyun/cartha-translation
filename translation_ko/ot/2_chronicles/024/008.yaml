translation:
  language: ko
  text: 그러자 왕이 명령했습니다. 그들은 상자 하나를 만들어 야훼의 집 문 밖에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궤 하나’. 히브리어는 직역하면 ‘상자 하나’이며, ‘하나’는 하나의 지정된 상자라는 점을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  english_pob_choice: Then the king commanded
  chosen_korean: 그러자 왕이 명령하니
  alternatives_korean:
  - 왕이 말하니
  - 왕이 지시하니
  lexicon: HALOT
  rationale: 문맥상 단순 발화보다 시행을 유발하는 행정적 명령의 힘이 있으므로, 한국어도 ‘명령하니’로 옮겨 원문의 기능을 드러냈습니다.
- source_word: אֲרוֹן אֶחָד
  english_pob_choice: one chest
  chosen_korean: 하나의 궤
  alternatives_korean:
  - 한 궤
  - 궤 하나
  - 상자 하나
  lexicon: HALOT
  rationale: אֲרוֹן은 보관용 용기를 가리키므로 ‘궤’가 적절하며, אֶחָד의 수적 강조를 살려 ‘하나의’로 옮겼습니다.
- source_word: וַיִּתְּנֻהוּ בְּשַׁעַר
  english_pob_choice: placed it at the gate
  chosen_korean: 왕의 집 문 밖에, 곧 바깥에 두었습니다
  alternatives_korean:
  - 문간에 놓았습니다
  - 문 곁에 두었습니다
  - 문 밖에 놓았습니다
  lexicon: HALOT
  rationale: וַיִּתְּנֻהוּ는 단순히 ‘주다’가 아니라 물건을 특정 위치에 두는 뜻이므로 ‘두었습니다’가 자연스럽고, בְּשַׁעַר חוּצָה의 위치를 ‘문 밖에, 곧 바깥에’로 풀어 공적 접근성을 살렸습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  - 성전
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 유지하고, ‘집’은 히브리어 בית의 직역을 따라 성전 이미지를 보존했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
