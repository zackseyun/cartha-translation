theological_decisions:
- issue: ֵׁ‘strengthen’ versus ‘repair’ in temple context
  chosen_reading: ‘견고하게 하려고’로 옮겨, 성전 건물을 실제로 보수하는 뜻을 드러내되 원문 동사의 ‘강하게 하다’ 감각도 남겼습니다.
  alternative_readings:
  - 성전을 수리하려고
  - 성전을 보수하려고
  rationale: 본문은 성전의 구조를 ‘강하게’ 만드는 실제 공사를 가리키므로, 한국어에서도 단순한 추상적 ‘강화’가 아니라 건축 맥락을 떠올리게 해야 합니다.
  doctrine_reference: 원문 의미 우선, 건축 맥락의 구체적 지시를 보존
- issue: ‘all Israel’ in a Judah-focused setting
  chosen_reading: ‘온 이스라엘로부터’라고 유지했습니다.
  alternative_readings:
  - 유다 온 백성으로부터
  - 온 이스라엘 사람들로부터
  rationale: 역대기 기자의 ‘이스라엘’ 사용은 종종 유다만이 아니라 언약 백성 전체를 가리키므로, 이를 좁혀 버리면 본문의 역사·신학적 폭이 줄어듭니다.
  doctrine_reference: 본문의 범위를 해석으로 축소하지 않음
