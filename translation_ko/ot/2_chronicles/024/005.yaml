base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
  footnotes:
  - marker: a
    text: Or 'money' for 'silver.' The Hebrew uses 'silver' as the concrete term for monetary collection.
    reason: lexical_alternative
  - marker: b
    text: Or 'to strengthen' the house of your God; here the sense is repairing or restoring the temple structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제사장들과 레위 사람들을 모으고 그들에게 말하였습니다. “유다의 성읍들로 나가서, 해마다 너희 하나님의 집을 견고하게 하려고 온 이스라엘로부터 은을 거두어들이십시오. 그리고 이 일은 서두르십시오.” 그러나 레위 사람들은 서두르지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘은’을 사용하지만, 화폐 수납을 가리키는 구체어입니다.
    reason: source_note
  - marker: b
    text: 이 동사는 문자적으로는 ‘강하게 하다’이지만, 여기서는 성전 건물을 보수하거나 복원한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  english_pob_choice: he gathered
  chosen_korean: 모으고
  alternatives_korean:
  - 모으고 불러
  - 소집하고
  - 모아
  lexicon: HALOT
  rationale: 사람들을 한데 불러 모으는 동작을 자연스럽게 살리되, 뒤의 발화로 이어지는 서술 흐름을 유지했습니다.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  english_pob_choice: the priests and the Levites
  chosen_korean: 제사장들과 레위 사람들
  alternatives_korean:
  - 제사장들과 레위인들
  - 제사장들과 레위인
  lexicon: HALOT
  rationale: 두 직무 집단의 구분을 분명히 드러내기 위해 관용적인 한국어 교회 용어를 쓰되, 레위인을 사람들로 풀어 서술의 자연스러움을 살렸습니다.
- source_word: לְחַזֵּק
  english_pob_choice: to repair
  chosen_korean: 견고하게 하려고
  alternatives_korean:
  - 수리하려고
  - 보수하려고
  - 강화하려고
  lexicon: HALOT
  rationale: 이 동사는 본래 ‘강하게 하다’이므로, 건물 맥락에서의 ‘수리’ 의미를 살리면서도 히브리어의 직접적인 동사 감각을 보존했습니다.
- source_word: כֶּסֶף
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은돈
  - 돈
  lexicon: HALOT
  rationale: 히브리어의 구체어 ‘은’을 그대로 살려, 화폐 수납을 가리키는 물질명사로서의 긴장을 유지했습니다.
- source_word: מִכָּל יִשְׂרָאֵל
  english_pob_choice: from all Israel
  chosen_korean: 온 이스라엘로부터
  alternatives_korean:
  - 모든 이스라엘로부터
  - 이스라엘 온 집안으로부터
  lexicon: HALOT
  rationale: 역사적으로 유다 중심 문맥이더라도 본문이 말하는 ‘이스라엘’을 넓게 유지하여, 지파·왕국 범위를 미리 좁히지 않았습니다.
theological_decisions:
- issue: ֵׁ‘strengthen’ versus ‘repair’ in temple context
  chosen_reading: ‘견고하게 하려고’로 옮겨, 성전 건물을 실제로 보수하는 뜻을 드러내되 원문 동사의 ‘강하게 하다’ 감각도 남겼습니다.
  alternative_readings:
  - 성전을 수리하려고
  - 성전을 보수하려고
  rationale: 본문은 성전의 구조를 ‘강하게’ 만드는 실제 공사를 가리키므로, 한국어에서도 단순한 추상적 ‘강화’가 아니라 건축 맥락을 떠올리게 해야 합니다.
  doctrine_reference: 원문 의미 우선, 건축 맥락의 구체적 지시를 보존
- issue: ‘all Israel’ in a Judah-focused setting
  chosen_reading: ‘온 이스라엘로부터’라고 유지했습니다.
  alternative_readings:
  - 유다 온 백성으로부터
  - 온 이스라엘 사람들로부터
  rationale: 역대기 기자의 ‘이스라엘’ 사용은 종종 유다만이 아니라 언약 백성 전체를 가리키므로, 이를 좁혀 버리면 본문의 역사·신학적 폭이 줄어듭니다.
  doctrine_reference: 본문의 범위를 해석으로 축소하지 않음
