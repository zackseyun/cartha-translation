base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
  footnotes:
  - marker: a
    text: Or 'money' for 'silver.' The Hebrew uses 'silver' as the concrete term for monetary collection.
    reason: lexical_alternative
  - marker: b
    text: Or 'to strengthen' the house of your God; here the sense is repairing or restoring the temple structure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 제사장들과 레위 사람들을 모아 그들에게 말하였습니다. “유다의 성읍들로 가서, 해마다 여러분의 하나님의 집을 보수할[b] 은을[a] 온 이스라엘에게서 거두십시오. 그리고 여러분은 이 일을 서두르십시오.” 그러나 레위 사람들은 서두르지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 ‘은’을 사용하지만, 화폐로 거두는 것을 가리키는 구체적인 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사는 문자적으로 ‘강하게 하다’라는 뜻이지만, 여기서는 성전 건물을 보수하거나 복원하는 것을 가리킵니다.
    reason: lexical_alternative
