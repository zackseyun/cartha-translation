  terminology: ‘야훼’, ‘여호야다’, ‘야훼의 집’은 일관되고 적절합니다. נְחֹשֶׁת는 이 건축·금속 작업 문맥에서 ‘놋’보다 현대 표준어인 ‘청동’이 적절합니다.
