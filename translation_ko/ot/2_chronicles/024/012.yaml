  text: וַ/יִּתְּנֵ֨/הוּ הַ/מֶּ֜לֶךְ וִֽ/יהוֹיָדָ֗ע אֶל עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת בֵּית יְהוָ֔ה וַ/יִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְ/חָרָשִׁ֔ים לְ/חַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה וְ֠/גַם לְ/חָרָשֵׁ֤י בַרְזֶל֙ וּ/נְחֹ֔שֶׁת לְ/חַזֵּ֖ק אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'delivered it' or 'handed it over'; the pronoun refers to the collected money in context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD'; that is, the temple.
    reason: lexical_alternative
  - marker: c
    text: Or 'smiths in iron and bronze.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕과 여호야다가 그것을 야훼[a]의 집에서 일하는 자들에게 주었습니다. 그들은 야훼의 집을 새롭게 하려고 돌을 다듬는 자들과 기술자들을 고용했고, 또 철과 놋의 기술자들도 고용하여 야훼의 집을 보강했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼의 집’, 곧 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  english_pob_choice: gave it
  chosen_korean: 그것을 주었습니다
  alternatives_korean:
  - 그것을 넘겨주었습니다
  - 그것을 건네주었습니다
  lexicon: HALOT
  rationale: 문맥상 앞선 헌금/은을 가리키므로, 한국어에서는 과도한 해석 없이 단순한 직접 목적어 구조로 옮겼습니다.
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  english_pob_choice: to those doing the work of the service of the house of Yahweh
  chosen_korean: 야훼의 집에서 일하는 자들에게
  alternatives_korean:
  - 야훼의 집의 봉사 일을 하는 자들에게
  - 야훼의 집의 일을 맡은 이들에게
  lexicon: HALOT
  rationale: 히브리어의 겹친 표현을 한국어로 지나치게 풀지 않고, ‘집에서 일하는 자들’로 기능과 대상의 관계를 보존했습니다.
- source_word: לְחַדֵּשׁ
  english_pob_choice: to restore
  chosen_korean: 새롭게 하려고
  alternatives_korean:
  - 수리하려고
  - 회복하려고
  lexicon: HALOT
  rationale: 동사의 기본 뜻인 ‘새롭게 하다’를 살리되, 성전 수리 문맥에 맞게 목표를 자연스럽게 드러냈습니다.
- source_word: חָרָשִׁים / חָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  english_pob_choice: craftsmen / craftsmen in iron and bronze
  chosen_korean: 기술자들 / 철과 놋의 기술자들
  alternatives_korean:
  - 장인들 / 철과 놋의 장인들
  - 공예가들 / 철과 놋의 공예가들
  lexicon: HALOT
  rationale: חָרָשׁ은 특정 직종보다 숙련된 제작자를 넓게 가리키므로, 일반적으로 이해되는 ‘기술자’로 옮겨 목록의 폭을 보존했습니다.
- source_word: לְחַזֵּק
  english_pob_choice: to strengthen
  chosen_korean: 보강했습니다
  alternatives_korean:
  - 강화했습니다
  - 튼튼하게 했습니다
  lexicon: HALOT
  rationale: 건축 문맥에서 ‘강화하다’보다 구조를 보완해 더 견고하게 만든다는 뜻을 분명히 드러내기 위해 ‘보강하다’를 택했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 성전 맥락에서 하나님의 고유명을 직접 사용하므로, POB 원칙에 따라 한국어 본문에도 ‘야훼’를 유지했습니다.
  doctrine_reference: POB contested terms — יְהוָה / YHWH → 야훼
