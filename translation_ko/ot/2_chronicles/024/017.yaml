  source_fidelity: 히브리어의 시간 표현, 유다의 שָׂרֵי, 왕에게 한 몸굽힘, 그리고 왕이 그들에게 귀를 기울인다는 서술이 모두 대체로 정확히 반영되었습니다. 다만 각주 표지가 해당 어구에 붙지 않고 문장 끝에 함께 배치되어 있어, a와 b의 참조 대상이 불명확합니다.
