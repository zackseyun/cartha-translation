  terminology: ‘여호야다’, ‘유다의 관리들’은 표준 한국어 성경 독자에게 이해하기 쉽고 원문의 통치 계층 의미를 무리 없이 전달합니다. ‘그들의 말을 들었습니다’는 שׁמע אל의 직접적 의미를 보존하며, 더 강한 ‘따르다/귀를 기울이다’의 가능성은 각주로 남기는 것이 적절합니다.
