  text: וְ/אַֽחֲרֵ֥י מוֹת֙ יְה֣וֹיָדָ֔ע בָּ֚אוּ שָׂרֵ֣י יְהוּדָ֔ה וַ/יִּֽשְׁתַּחֲו֖וּ לַ/מֶּ֑לֶךְ אָ֛ז שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
  footnotes:
  - marker: a
    text: Or 'the princes of Judah' or 'the leaders of Judah.'
    reason: lexical_alternative
  - marker: b
    text: '''Listened to them'' may also carry the sense ''heeded them'' or ''complied with them.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야다의 죽음 후에 유다의 관리들이 와서 왕에게 몸을 굽혔습니다. 그러자 왕은 그들의 말을 들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다의 방백들’, ‘유다의 지도자들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 말을 들었다’는 ‘그들에게 귀를 기울였다’ 또는 ‘그들을 따랐다’는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי יְהוּדָה
  english_pob_choice: the officials of Judah
  chosen_korean: 유다의 관리들
  alternatives_korean:
  - 유다의 방백들
  - 유다의 지도자들
  lexicon: HALOT
  rationale: שָׂרִים은 문맥상 통치 계층을 가리키므로, 현대 한국어에서는 위계감은 살리되 ‘방백’보다 자연스러운 ‘관리들’로 옮겼습니다.
- source_word: וַיִּשְׁתַּחֲווּ
  english_pob_choice: bowed down
  chosen_korean: 몸을 굽혔습니다
  alternatives_korean:
  - 절했습니다
  - 엎드려 절했습니다
  lexicon: HALOT
  rationale: 동작 자체를 드러내되, 인간 왕에게 대한 행위이므로 ‘예배하다’로 과잉 해석하지 않고 ‘몸을 굽히다’로 처리했습니다.
- source_word: שָׁמַע ... אֲלֵיהֶם
  english_pob_choice: listened to them
  chosen_korean: 그들의 말을 들었습니다
  alternatives_korean:
  - 그들에게 귀를 기울였습니다
  - 그들을 따랐습니다
  lexicon: HALOT
  rationale: שׁמע אל은 단순 청취보다 ‘말을 듣다/귀를 기울이다’의 뜻이 자연스럽습니다. 여기서는 즉각적인 응답을 단정하지 않기 위해 ‘그들의 말을 들었습니다’로 옮겼습니다.
- source_word: יְהוֹיָדָע
  english_pob_choice: Jehoiada
  chosen_korean: 여호야다
  alternatives_korean:
  - 여호야다
  lexicon: standard Korean biblical form
  rationale: 인명은 한국어 성경에서 널리 쓰이는 음역형을 따랐습니다.
theological_decisions:
- issue: 왕 앞에서의 절 행위의 성격
  chosen_reading: 인간 왕에게 대한 정치적·예우적 몸굽힘으로 유지하고, 예배 언어로 확장하지 않았습니다.
  alternative_readings:
  - 예배했습니다
  - 경배했습니다
  - 충성을 맹세했습니다
  rationale: 히브리어 동사는 문맥에 따라 예배도 가리킬 수 있지만, 여기서는 대상이 왕이므로 예배로 번역하면 의미를 과장합니다. ‘몸을 굽혔다’는 원문의 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §3 (preserve tension rather than resolve it)
