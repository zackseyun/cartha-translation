source:
  edition: WLC
  text: כִּ֤י עֲתַלְיָ֨הוּ֙ הַ/מִּרְשַׁ֔עַת בָּנֶ֥י/הָ פָרְצ֖וּ אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/גַם֙ כָּל קָדְשֵׁ֣י בֵית יְהוָ֔ה עָשׂ֖וּ לַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
  footnotes:
  - marker: a
    text: Or 'had made all the holy things of the house of the LORD for the Baals.' The Hebrew verb can be rendered more literally as 'made,' but in context it likely means they appropriated or used the temple's sacred objects for Baal worship.
    reason: lexical_alternative
translation:
  language: ko
  text: Athaliah[a] — 그 사악한 여인과 그의 아들들은 하나님의 집을 파괴하였고, 야훼의 집의 모든 거룩한 것들을 바알들에게 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 집의 모든 거룩한 것들을 바알들에게 만들었다’로 옮길 수 있습니다. 히브리어 동사는 더 문자적으로는 ‘만들었다’이지만, 문맥상 성전의 거룩한 물건들을 바알 숭배에 전용했다는 뜻으로 이해하는 편이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: —
  alternatives_korean:
  - 그러므로
  - 이는
  lexicon: HALOT
  rationale: 앞선 행위들을 설명하는 연결어이지만, 한국어에서는 문장 전체를 자연스럽게 이어 주는 대시 처리로 충분히 설명적 기능을 살릴 수 있습니다.
- source_word: הַמִּרְשַׁעַת
  english_pob_choice: that wicked woman
  chosen_korean: 그 사악한 여인
  alternatives_korean:
  - 그 악한 여자
  - 그 악한 여인
  lexicon: HALOT
  rationale: 여성형 비난 표현을 살리면서도 현대 한국어에서 지나치게 구어적인 ‘여자’보다 ‘여인’이 서술문에 더 어울립니다.
- source_word: בָּנֶיהָ
  english_pob_choice: her sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그녀의 아들들
  - 그 자식들
  lexicon: HALOT
  rationale: 히브리어의 성별 표지를 살려 ‘아들들’로 옮기되, 한국어에서는 소유 대명사를 문맥상 자연스러운 ‘그의’로 처리했습니다.
- source_word: פָרְצוּ אֶת בֵּית הָאֱלֹהִים
  english_pob_choice: had broken into the house of God
  chosen_korean: 하나님의 집을 파괴하였고
  alternatives_korean:
  - 하나님의 집에 난입하였고
  - 하나님의 집을 부수고 들어갔고
  lexicon: HALOT
  rationale: 문맥상 단순 침입보다 성전의 침해·훼손을 함께 포함하는 폭력적 훼손을 가리키므로 ‘파괴하다’로 압축해 옮겼습니다.
- source_word: כָּל קָדְשֵׁי בֵית יְהוָה
  english_pob_choice: all the holy things of the house of Yahweh
  chosen_korean: 야훼의 집의 모든 거룩한 것들
  alternatives_korean:
  - 야훼의 집의 모든 성물
  - 야훼의 집의 모든 성스럽게 구별된 것들
  lexicon: HALOT
  rationale: ‘קדשׁ’의 성별/봉헌된 대상을 직역에 가깝게 드러내되, 한국어 성경 용례와 어감을 고려해 ‘거룩한 것들’로 유지했습니다.
- source_word: עָשׂוּ לַבְּעָלִים
  english_pob_choice: had also made all the holy things ... for the Baals
  chosen_korean: 바알들에게 바쳤습니다
  alternatives_korean:
  - 바알들을 위해 만들었습니다
  - 바알 숭배에 사용했습니다
  lexicon: HALOT
  rationale: 영어 POB의 ‘made’를 기계적으로 옮기기보다, 문맥상 성전의 거룩한 것들을 우상 숭배에 전용했다는 의미를 한국어 동사 ‘바치다’로 분명하게 전달했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 프로젝트 기본값에 따라 고유명으로 보존해 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
- issue: בְּעָלִים의 복수성
  chosen_reading: 바알들에게
  alternative_readings:
  - 바알에게
  - 바알 우상들에게
  rationale: 히브리어 복수형을 흐리지 않기 위해 단수화하지 않고 복수 대상인 우상 숭배의 방향을 드러냈습니다.
  doctrine_reference: Source plurality of בְּעָלִים
