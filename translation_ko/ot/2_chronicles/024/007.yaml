revisions:
- from: Athaliah[a] — 그 사악한 여인과 그의 아들들은 하나님의 집을 파괴하였고, 야훼의 집의 모든 거룩한 것들을 바알들에게 바쳤습니다.
  to: 이는 그 악한 여인 아달랴의 아들들이 하나님의 집을 헐어 버리고, 야훼의 집의 모든 성물을 바알들을 위하여 사용했기[a] 때문입니다.
  rationale: 히브리어의 통사 관계를 따라 ‘그 악한 여인 아달랴’가 ‘그녀의 아들들’을 수식하도록 바로잡고, 이름·성별·복수성을 보존했습니다. 성전 훼손과 성물의 우상 숭배를 위한 전용이라는 문맥을 자연스러운 현대 한국어 합쇼체로 반영했으며, עָשׂוּ의 문자적 대안은 관련 위치의 각주에 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:21:31Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 히브리어 구문을 잘못 분석하여 아달랴를 아들들과 함께 동사 주어로 만들었습니다. הַמִּרְשַׁעַת는 아달랴를 수식하고, בָּנֶיהָ가 복수 동사 פָרְצוּ 및 עָשׂוּ의 주어입니다. 또한 ‘그의 아들들’은 여성 선행사 아달랴와 맞지 않습니다. פָרְצוּ는 여기서 성전을 단순히 ‘파괴했다’기보다 ‘헐다/부수다’의 뜻으로 옮기는 것이 적절합니다. עָשׂוּ לַבְּעָלִים은 문맥상 성물을 바알들을 위하여 사용·전용했다는 뜻으로 번역하되, 문자적 ‘만들었다’는 각주로 남깁니다.
  naturalness: 아달랴를 음역하지 않은 점과 대시 뒤의 어색한 주어 결합을 바로잡았습니다. ‘이는 … 때문입니다’는 앞 절의 설명을 이끄는 כִּי를 현대 한국어 합쇼체 문장으로 자연스럽게 나타냅니다. ‘성물’은 이 문맥에서 ‘거룩한 것들’보다 간결하고 자연스럽습니다.
  terminology: עֲתַלְיָהוּ는 ‘아달랴’, יְהוָה는 프로젝트 원칙에 따라 ‘야훼’, 복수 בְּעָלִים은 ‘바알들’로 옮겼습니다. ‘성물’은 כָּל קָדְשֵׁי의 봉헌되고 거룩한 물건이라는 의미를 적절히 보존합니다.
  issues:
