  source_fidelity: 첫 시간절의 주어가 히브리어 3인칭 복수(아람 군대)인데 초안은 ‘그가 떠날 때에’로 단수 주어를 사용하여 의미가 달라집니다. ‘그들이 그에게서 떠날 때에’로 바로잡아야 합니다. 또한 ‘그에게서’라는 이탈의 대상을 보존해야 합니다. 여호야다의 ‘아들들’이라는 마소라 본문의 복수형과 그에 관한 각주 설명은 적절합니다.
  naturalness: 삽입된 이유절을 ‘때문입니다’로 끝내고 동일 문장을 계속하는 방식은 현대 한국어 합쇼체 문장으로 다소 부자연스럽습니다. 괄호 안의 완결 문장으로 처리하면 원문의 삽입적 설명과 공식적 문체를 자연스럽게 함께 살릴 수 있습니다. 왕의 궁정 문맥에서 עֲבָדָיו는 ‘종들’보다 ‘신하들’이 자연스럽고 오해가 적습니다.
