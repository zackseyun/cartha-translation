revisions:
- from: 그가 떠날 때에—그들이 그를 여러 질병에 걸린 채로 버려 두었기 때문입니다—그의 종들이 제사장 여호야다의 아들들의 피 때문에 그를 거슬러 모반하여, 그를 침상에서 죽였고 그가 죽었습니다. 그들은 그를 다윗 성에 장사하였으나, 왕들의 묘실에는 장사하지 않았습니다.[a]
  to: 그들이 그에게서 떠날 때에(그들은 그를 여러 질병에 걸린 채로 버려 두었습니다), 그의 신하들이 제사장 여호야다의 아들들의[a] 피 때문에 그를 거슬러 모반을 꾀하여, 그를 침상에서 죽였고 그는 죽었습니다. 그들은 그를 다윗 성에 장사하였으나, 왕들의 묘실에는 장사하지 않았습니다.
  rationale: 시간절의 복수 주어와 ‘그에게서’라는 대상을 원문대로 회복했습니다. 삽입된 כִּי절은 괄호 안의 완결 문장으로 옮겨 자연스러운 합쇼체 문장으로 다듬었으며, 원문의 설명적 기능을 유지했습니다. 궁정 문맥의 עֲבָדָיו는 현대 한국어에서 자연스러운 ‘신하들’로 옮겼습니다. 마소라 본문의 복수형은 본문에 유지하고, 문맥상 단수 가능성은 해당 어구에 연결된 각주로만 제시했습니다.
