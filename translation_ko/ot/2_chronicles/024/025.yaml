base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the blood of the sons of Jehoiada the priest.'' In context this may refer specifically to ''the son of Jehoiada,'' that is, Zechariah (24:20–22).'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 떠날 때에—그들이 그를 여러 질병에 걸린 채로 버려 두었기 때문입니다—그의 종들이 제사장 여호야다의 아들들의 피 때문에 그를 거슬러 모반하여, 그를 침상에서 죽였고 그가 죽었습니다. 그들은 그를 다윗 성에 장사하였으나, 왕들의 묘실에는 장사하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘제사장 여호야다의 아들들’이라고 되어 있습니다. 문맥상 이는 ‘여호야다의 아들’, 곧 스가랴를 가리킬 수 있습니다(24:20–22).
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  english_pob_choice: When they departed from him
  chosen_korean: 그가 떠날 때에
  alternatives_korean:
  - 그들이 그를 떠날 때에
  - 그들이 그에게서 떠날 때에
  lexicon: HALOT
  rationale: 여기서는 사건의 시간 배경을 자연스럽게 살리되, 직역적인 ‘그에게서’보다 한국어 흐름상 간결한 시간절로 옮겼습니다.
- source_word: כִּי עָזְבוּ אֹתוֹ בְמַחֳלָיִם רַבִּים
  english_pob_choice: for they left him with many diseases
  chosen_korean: 그들이 그를 여러 질병에 걸린 채로 버려 두었기 때문입니다
  alternatives_korean:
  - 그들이 그를 많은 질병 가운데 남겨 두었기 때문입니다
  - 그를 심한 병들 가운데 버려 두었기 때문입니다
  lexicon: HALOT
  rationale: מַחֳלָיִם은 단순한 상처보다 ‘질병들’의 뜻이 분명하므로 복수성을 살렸고, 원인절의 כִּי를 ‘때문입니다’로 처리했습니다.
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  english_pob_choice: his servants conspired against him
  chosen_korean: 그의 종들이 … 그를 거슬러 모반하여
  alternatives_korean:
  - 그의 종들이 … 그에게 반역하여
  - 그의 종들이 … 그와 맞서 공모하여
  lexicon: HALOT
  rationale: הִתְקַשְּׁרוּ는 단순한 ‘음모를 꾸미다’보다 결속된 반역/모반의 뉘앙스가 있어 ‘모반하여’로 옮겼습니다.
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  english_pob_choice: because of the blood of the sons of Jehoiada the priest[a]
  chosen_korean: 제사장 여호야다의 아들들의 피 때문에
  alternatives_korean:
  - 제사장 여호야다의 아들의 피 때문에
  - 제사장 여호야다의 아들들의 유혈 때문에
  lexicon: HALOT
  rationale: בְּדְמֵי는 혈흔 자체보다 ‘피로 인한 책임/원인’을 가리키므로 ‘피 때문에’로 간명하게 옮겼고, 본문에 있는 복수형을 보존했습니다.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד
  english_pob_choice: They buried him in the city of David
  chosen_korean: 그들은 그를 다윗 성에 장사하였으나
  alternatives_korean:
  - 그들은 그를 다윗 성에 묻었으나
  - 그들은 그를 다윗의 도성에 장사하였으나
  lexicon: HALOT
  rationale: בְּעִיר דָּוִיד은 통상적 고유 지명으로 ‘다윗 성’을 택했고, 뒤절과의 대비를 위해 접속을 살렸습니다.
theological_decisions:
- issue: MT의 복수형 ‘여호야다의 아들들’과 서술 문맥이 암시하는 단수 인물
  chosen_reading: 본문은 히브리어 복수형을 그대로 두고, 주석 각주로는 단수 해석 가능성을 열어 두었습니다.
  alternative_readings:
  - 여호야다의 아들(즉, 스가랴)의 피 때문에
  rationale: 원문 보존을 우선하되, 바로 앞 문맥(24:20–22)에서 스가랴 한 사람을 가리킬 가능성이 크므로 독자가 텍스트 긴장을 확인할 수 있게 했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
