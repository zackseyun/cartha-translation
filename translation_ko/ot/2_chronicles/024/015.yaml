base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'had lived a full life.' The Hebrew says 'was full of days.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야다는 늙고 날들이 충만하여 죽었습니다.[a] 그가 죽을 때에 백삼십 세였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, ‘충만한 삶을 살았다’는 뜻입니다. 히브리어는 ‘날들로 충만하였다’고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְקַן
  english_pob_choice: grew old
  chosen_korean: 늙어
  alternatives_korean:
  - 늙었습니다
  - 나이가 들었습니다
  lexicon: HALOT
  rationale: זקן의 진행적 의미를 살리면서도 현대 한국어에서 자연스러운 노년 표현으로 옮겼습니다.
- source_word: וַיִּשְׂבַּע יָמִים
  english_pob_choice: was full of days
  chosen_korean: 나이가 차서
  alternatives_korean:
  - 날들로 가득하여
  - 수명이 다하여
  lexicon: HALOT
  rationale: 직역하면 ‘날들로 가득하다’이지만, 히브리어 관용구가 가리키는 ‘충만한 삶/수명’을 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  english_pob_choice: one hundred and thirty years old
  chosen_korean: 백삼십 세
  alternatives_korean:
  - 백삼십 살
  - 일백삼십 세
  lexicon: HALOT
  rationale: 연령 공식은 한국어 성경 문체에서 ‘세’가 가장 자연스럽고, 숫자만 간명하게 제시해 원문의 연령 진술을 보존했습니다.
- source_word: בְּמוֹתוֹ
  english_pob_choice: at his death
  chosen_korean: 죽을 때의
  alternatives_korean:
  - 그가 죽을 때의
  - 그의 죽음 때의
  lexicon: HALOT
  rationale: ב + 명사 ‘죽음’의 시간 표시를 한국어에서 자연스럽게 풀어, 나이 진술이 죽음 시점과 연결된다는 점을 분명히 했습니다.
theological_decisions:
- issue: ‘was full of days’의 관용적 의미를 어떻게 드러낼지
  chosen_reading: ‘나이가 차서’로 옮겨, 단순한 생물학적 노화가 아니라 완결된 생애의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘수명이 다하여’
  - ‘충만한 삶을 살고’
  rationale: 히브리어 관용구는 장수와 삶의 충만함을 함께 암시하므로, 한국어에서도 죽음 직전의 단순 노쇠가 아니라 삶의 완성을 드러내는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 지혜문학·역사서의 수명/생애 완결 표현
