  - severity: medium
    issue: ‘그렇게 하였습니다’의 지시 대상이 불명확함
    rationale: 히브리어는 가져오고 궤에 던져 넣는 행위의 지속을 서술하는데, 한국어의 ‘그렇게’는 그 행위를 불필요하게 우회하여 표현하고 의미 연결을 약화시킵니다.
  - severity: low
    issue: ‘지도자’는 שָׂרִים의 관직적 의미를 다소 일반화함
    rationale: ‘관리들’은 왕국의 고위 관료·통치자라는 문맥적 기능을 더 직접적으로 전달합니다.
