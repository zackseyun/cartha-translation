  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֥וּ כָל הַ/שָּׂרִ֖ים וְ/כָל הָ/עָ֑ם וַ/יָּבִ֛יאוּ וַ/יַּשְׁלִ֥יכוּ לָ/אָר֖וֹן עַד לְ/כַלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/010.yaml
  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
  footnotes:
  - marker: a
    text: Or 'until they finished.' The Hebrew expression can more generally mean 'until completion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 모든 지도자와 모든 백성이 기뻐하였고, 가져와서 궤에 던져 넣었으며, 다 끝날 때까지 그렇게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끝날 때까지’. 히브리어 표현은 더 일반적으로 ‘완료될 때까지’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הַשָּׂרִים
  english_pob_choice: all the officials
  chosen_korean: 모든 지도자
  alternatives_korean:
  - 모든 관리들
  - 모든 귀인
  lexicon: HALOT
  rationale: שָׂרִים는 통치권을 가진 인물들을 가리키므로, 현대 한국어에서는 ‘지도자’가 ‘공직자’ 뉘앙스를 지나치게 좁히지 않으면서도 기능을 드러냅니다.
- source_word: וַיִּשְׂמְחוּ
  english_pob_choice: rejoiced
  chosen_korean: 기뻐하였고
  alternatives_korean:
  - 즐거워하였고
  - 기뻐하였습니다
  lexicon: HALOT
  rationale: שׂמח의 기본 뜻인 기쁨을 그대로 살리되, 공동체의 반응을 자연스럽게 드러내는 서술형으로 옮겼습니다.
- source_word: וַיָּבִיאוּ וַיַּשְׁלִיכוּ לָאָרוֹן
  english_pob_choice: they brought and threw into the chest
  chosen_korean: 가져와서 궤에 던져 넣었으며
  alternatives_korean:
  - 가져와 궤에 던졌으며
  - 가져다 궤에 넣었으며
  lexicon: HALOT
  rationale: 본문은 ‘가져오다’와 ‘던져 넣다’의 연속 동작을 강하게 제시하므로, ‘궤에 던져 넣다’로 구체성을 살렸습니다.
- source_word: עַד לְכַלֵּה
  english_pob_choice: until it was full
  chosen_korean: 다 끝날 때까지
  alternatives_korean:
  - 끝날 때까지
  - 완료될 때까지
  - 궤가 가득 찰 때까지
  lexicon: HALOT
  rationale: 이 표현은 ‘끝남/완료’의 범위를 가지므로, POB의 문맥 판단을 따라 봉헌 행위가 ‘다 끝날 때까지’ 계속되었음을 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: לְכַלֵּה의 종결을 ‘가득 참’으로 볼지 ‘완료됨’으로 볼지
  chosen_reading: 봉헌 행위가 더 이상 할 일이 남지 않을 때까지 계속되었다는 의미를 살려 ‘다 끝날 때까지’로 옮겼습니다.
  alternative_readings:
  - 궤가 가득 찰 때까지
  - 그들이 마칠 때까지
  rationale: 본문의 초점은 궤의 물리적 충만보다 헌금 수집의 종결에 있으므로, 의미 중심으로 ‘완료’ 쪽을 반영했습니다.
  doctrine_reference: 문맥 우선의 서술 번역 원칙
