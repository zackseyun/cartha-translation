  naturalness: ‘암몬 여인 시므앗의 아들 사밧’ 및 ‘모압 여인 시므릿의 아들 여호사밧’으로 배열하면 원문의 족보식 수식 관계를 보존하면서 현대 한국어에서도 명확합니다. ‘그를 대적하여 모의한 사람들’은 자연스럽고 문맥에 맞습니다.
