translation:
  language: ko
  text: 그리고 그를 대적하여 모의한 사람들은 이들이었습니다. 곧 암몬 여인 시므앗의 아들 사밧과 모압 여인 시므릿의 아들 여호사밧입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  english_pob_choice: And these were
  chosen_korean: 그리고 이들은 …였습니다
  alternatives_korean:
  - 그리고 이들은 …입니다
  - 그리고 이들은 …였던 사람들입니다
  lexicon: BDB
  rationale: 서술형 도입을 살리면서도 한국어에서 자연스러운 과거 서술로 처리했습니다.
- source_word: הַמִּתְקַשְּׁרִים עָלָיו
  english_pob_choice: the men who conspired against him
  chosen_korean: 그를 대적하여 모의한 사람들
  alternatives_korean:
  - 그를 상대로 공모한 사람들
  - 그를 대항하여 결탁한 사람들
  lexicon: HALOT
  rationale: קשר의 ‘모의/공모’ 의미와 עליו의 표적성을 함께 살려, ‘대적하여 모의한’으로 압축했습니다.
- source_word: הָעַמּוֹנִית
  english_pob_choice: the Ammonite woman
  chosen_korean: 암몬 여인
  alternatives_korean:
  - 암몬 사람 여자
  - 암몬 여성
  lexicon: HALOT
  rationale: 히브리어 여성형 표지를 반영하되, 한국어에서는 혈통·출신을 나타내는 간결한 ‘암몬 여인’이 가장 자연스럽습니다.
- source_word: הַמּוֹאָבִית
  english_pob_choice: the Moabite woman
  chosen_korean: 모압 여인
  alternatives_korean:
  - 모압 사람 여자
  - 모압 여성
  lexicon: HALOT
  rationale: 앞의 표현과 일관되게 여성형 출신 표지를 간결하게 살렸습니다.
theological_decisions:
- issue: 아들의 정체를 바로 뒤의 어머니 출신표와 연결하는 족보식 구성
  chosen_reading: ‘시므앗의 아들 사밧, 곧 암몬 여인’과 ‘시므릿의 아들 여호사밧, 곧 모압 여인’으로, 어머니의 출신을 덧붙이는 방식으로 옮겼습니다.
  alternative_readings:
  - ‘시므앗의 아들 사밧, 암몬 여자’
  - ‘시므릿의 아들 여호사밧, 모압 여자’
  rationale: 히브리어의 여성형 형용사는 어머니의 출신을 표시하므로, 인물 식별 정보를 훼손하지 않도록 설명적으로 옮겼습니다.
  doctrine_reference: 본문의 역사서술 및 족보적 식별
- issue: ‘מִתְקַשְּׁרִים’의 의미 범위
  chosen_reading: ‘모의한’으로 번역해 단순한 동맹이 아니라 왕을 해치는 음모라는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘결탁한’
  - ‘함께 결의한’
  rationale: 역대하 24장의 사건 문맥상 단순 협력이 아니라 반역적 음모이므로, 한국어에서도 그 긴장을 분명히 했습니다.
  doctrine_reference: 역사적 서술의 문맥 보존
