base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
  footnotes:
  - marker: a
    text: Or "At the end of the year"; the Hebrew idiom refers to the year's turning or seasonal cycle.
    reason: lexical_alternative
  - marker: b
    text: '"Aram" is the Hebrew name often rendered "Syria."'
    reason: cultural_note
  - marker: c
    text: Or "all their plunder."
    reason: lexical_alternative
translation:
  language: ko
  text: 한 해가 바뀔 무렵에[a] 아람[b] 군대가 그를 치러 올라와 유다와 예루살렘에 이르러, 백성의 모든 지도자들을 멸하고, 그들의 모든 전리품[c]을 다마스쿠스 왕에게 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 해가 바뀔 무렵’은 히브리어 관용구로, 해의 전환이나 계절의 순환 시점을 가리킵니다. ‘한 해의 끝에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아람’은 히브리어 고유명사이며, 흔히 ‘시리아’로도 번역됩니다.
    reason: cultural_note
  - marker: c
    text: ‘전리품’은 전쟁에서 빼앗은 재물을 가리킵니다. ‘노획물’ 또는 ‘약탈물’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  english_pob_choice: At the turn of the year
  chosen_korean: 한 해가 바뀔 무렵에
  alternatives_korean:
  - 한 해의 끝에
  - 해가 바뀌었을 때
  lexicon: HALOT
  rationale: תְּקוּפָה의 ‘돌아옴/전환’ 의미를 살려 단순한 연말이 아니라 해의 전환 시점을 자연스럽게 옮겼습니다.
- source_word: עָלָה עָלָיו
  english_pob_choice: came up against him
  chosen_korean: 그를 치러 올라와
  alternatives_korean:
  - 그를 대적하러 올라와
  - 그에게 맞서 올라와
  lexicon: HALOT
  rationale: עלה + על의 군사적 관용을 살리되, 한국어에서는 ‘치러 올라오다’가 공격과 상승 이미지를 함께 전달합니다.
- source_word: חֵיל אֲרָם
  english_pob_choice: the army of Aram
  chosen_korean: 아람 군대
  alternatives_korean:
  - 아람의 군대
  - 시리아 군대
  lexicon: HALOT
  rationale: 고유명사는 원문 지시를 따라 ‘아람’으로 옮기고, חֵיל은 군사력을 가리키므로 ‘군대’로 번역했습니다.
- source_word: שָׂרֵי הָעָם
  english_pob_choice: all the leaders of the people
  chosen_korean: 백성의 모든 지도자들
  alternatives_korean:
  - 백성의 모든 방백들
  - 백성의 모든 관리들
  lexicon: HALOT
  rationale: שָׂרִים의 통치·지도 의미를 현대 독자가 바로 이해할 수 있게 ‘지도자들’로 옮겼습니다.
theological_decisions:
- issue: 군사 서술에서 ‘멸하다’의 강도
  chosen_reading: וַיַּשְׁחִיתוּ를 ‘멸하고’로 옮겨, 지도자들이 단순히 패배한 것이 아니라 파괴적으로 제거되었음을 드러냈습니다.
  alternative_readings:
  - 죽이고
  - 파괴하고
  rationale: 문맥상 인명 피해를 포함한 급격한 파괴를 뜻하므로, 서술의 강도를 약화시키지 않으면서도 자연스러운 한국어로 유지했습니다.
  doctrine_reference: 역사서의 전쟁 서술
