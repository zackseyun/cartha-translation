lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 했습니다
  alternatives_korean:
  - 행했습니다
  - 행동했습니다
  - 하였습니다
  lexicon: HALOT
  rationale: עשה는 이 문맥의 평가 공식에서 자연스럽게 '하다'로 옮기는 것이 가장 간결하며, '옳은 일'과의 결합도 한국어에서 안정적입니다.
- source_word: הַיָּשָׁר
  english_pob_choice: what was right
  chosen_korean: 옳은 일
  alternatives_korean:
  - 바른 일
  - 의로운 일
  - 올바른 일
  lexicon: HALOT
  rationale: יַשָׁר는 '곧다, 바르다, 옳다'의 뜻이므로, 왕 평가 공식에서는 의미를 살려 '옳은 일'로 옮겨야 평가적 뉘앙스가 분명해집니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 보시기에
  alternatives_korean:
  - 눈에
  - 눈앞에
  - 여겨 보시기에
  lexicon: HALOT
  rationale: 히브리어 관용구의 평가 관점을 살리기 위해 '보시기에'를 택해, 단순한 판단이 아니라 야훼의 시각에서의 평가임을 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 테트라그라마톤은 본문이 가리키는 고유한 언약 이름을 보존하기 위해 한국어 본문에서도 '야훼'로 옮깁니다.
theological_decisions:
- issue: 문장 끝의 평서 종결과 왕 평가 공식의 문체
  chosen_reading: 서술문은 현대 표준어 합쇼체로 유지하고, 평가 공식은 '야훼 보시기에 옳은 일'로 직역적 의미를 보존했습니다.
  alternative_readings:
  - '''옳은 일을 행했습니다''로 더 축약하는 방식'
  - '''야훼 앞에서 옳은 일을 했습니다''로 관용적으로 풀어 쓰는 방식'
  rationale: 본문은 역사 서술의 객관적 보고이므로, 문체는 현대적이되 원문의 평가 구조를 보존하는 쪽이 출처 충실성에 더 적합합니다.
  doctrine_reference: 역사서의 왕 평가 공식과 하나님의 시선에 따른 도덕적 판정
