- from: 그러나 그는 그들 가운데에 예언자들을 보내어 그들을 야훼께로 돌아오게 하려고 하였습니다. 그들이 그들에게 증언하였으나, 그들은 귀를 기울이지 않았습니다.[a]
  to: 그러나 그는 그들 가운데에 예언자들을 보내어 그들이 야훼께로 돌아오게 하려고 하셨습니다. 예언자들이 그들을 거슬러 증언하였으나[a], 그들은 귀를 기울이지 않았습니다.
