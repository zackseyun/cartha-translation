id: 2CH.24.19
reference: 2 Chronicles 24:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח בָּ/הֶם֙ נְבִאִ֔ים לַ/הֲשִׁיבָ֖/ם אֶל יְהוָ֑ה וַ/יָּעִ֥ידוּ בָ֖/ם וְ/לֹ֥א הֶאֱזִֽינוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
  footnotes:
  - marker: a
    text: Or 'they warned them.' The Hebrew verb can carry the sense of solemn warning, but here it also has the nuance of bearing witness against them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그는 그들 가운데에 예언자들을 보내어 그들을 야훼께로 돌아오게 하려고 하였습니다. 그들이 그들에게 증언하였으나, 그들은 귀를 기울이지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 경고하였으나.’ 히브리어 동사는 엄숙한 경고의 뜻을 담을 수 있지만, 여기서는 그들을 향한 증언의 뉘앙스도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח בָּהֶם נְבִאִים
  english_pob_choice: he sent prophets among them
  chosen_korean: 그들 가운데에 예언자들을 보내어
  alternatives_korean:
  - 그들에게 예언자들을 보내어
  - 그들 중에 예언자들을 파견하여
  lexicon: HALOT
  rationale: בָּהֶם은 단순한 ‘그들에게’보다 ‘그들 가운데에’라는 의미가 살아 있어, 예언자들이 공동체 한복판으로 보내졌다는 뉘앙스를 살렸습니다.
- source_word: לַהֲשִׁיבָם
  english_pob_choice: to bring them back
  chosen_korean: 그들을 … 돌아오게 하려고
  alternatives_korean:
  - 그들을 … 돌이키려고
  - 그들을 … 회복시키려고
  lexicon: HALOT
  rationale: הִפְעִיל의 שוב는 ‘돌아오게 하다’는 사역 의미가 핵심이므로, 관계적·행동적 귀환을 드러내는 표현을 택했습니다.
- source_word: אֶל יְהוָה
  english_pob_choice: to Yahweh / to the LORD
  chosen_korean: 야훼께로
  alternatives_korean:
  - 주께로
  - 여호와께로
  lexicon: DOCTRINE.md contested terms
  rationale: 본 프로젝트 기본값에 따라 야훼를 사용하여 원문 고유명성을 보존했습니다.
- source_word: וַיָּעִידוּ בָם
  english_pob_choice: they testified against them
  chosen_korean: 그들이 그들에게 증언하였으나
  alternatives_korean:
  - 그들이 그들을 경고하였으나
  - 그들이 그들에 대해 증언하였으나
  lexicon: HALOT
  rationale: 여기서는 법정적 대결보다는 선지자적 증언 행위가 전면에 드러나므로, ‘증언하다’로 옮기되 문맥상의 반대 의미는 앞뒤로 보완했습니다.
- source_word: וְלֹא הֶאֱזִינוּ
  english_pob_choice: but they would not listen
  chosen_korean: 그들은 귀를 기울이지 않았습니다
  alternatives_korean:
  - 그들은 듣지 않았습니다
  - 그들은 들으려 하지 않았습니다
  lexicon: HALOT
  rationale: אזן의 관용적 의미인 ‘주의 깊게 듣다’를 살리면서, 단순 청취 실패가 아니라 거부의 뜻도 전달합니다.
theological_decisions:
- issue: 예언자들의 말하기가 지닌 경고/증언의 이중성
  chosen_reading: 본문은 예언자들이 백성에게 회개를 촉구하는 동시에 그들의 불순종을 증언하는 역할을 했음을 드러내므로, ‘증언하였으나’로 간결하게 유지했습니다.
  alternative_readings:
  - 그들을 경고하였으나
  - 그들에게 불리하게 증언하였으나
  rationale: 원문 עוד의 뉘앙스를 지나치게 형사적으로만 고정하지 않으면서도, 문맥상 책임 추궁의 성격을 흐리지 않기 위함입니다.
  doctrine_reference: 'Translation philosophy #1 and #5'
