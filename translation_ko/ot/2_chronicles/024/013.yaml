  text: וַֽ/יַּעֲשׂוּ֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה וַ/תַּ֧עַל אֲרוּכָ֛ה לַ/מְּלָאכָ֖ה בְּ/יָדָ֑/ם וַֽ/יַּעֲמִ֜ידוּ אֶת בֵּ֧ית הָֽ/אֱלֹהִ֛ים עַל מַתְכֻּנְתּ֖/וֹ וַֽ/יְאַמְּצֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
  footnotes:
  - marker: a
    text: Or 'the restoration of the work advanced by their hands.' The Hebrew phrase uses אֲרוּכָה, a term that can mean healing or restoration, here applied to building repair.
    reason: lexical_alternative
  - marker: b
    text: Or 'they set the house of God on its proper footing' or 'to its original form.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 일꾼들이 수고하였고, 수리 작업이 그들의 손을 통해 진전되었으며, 그들이 하나님의 집을 본래의 상태로 세우고 그것을 견고하게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 일의 회복이 그들의 손을 통해 진전되었다.’ 히브리어 אֲרוּכָה는 ‘치유’나 ‘회복’을 뜻할 수 있으며, 여기서는 건물 수리에 적용되었습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 하나님의 집을 그 본래의 형태에 맞게 세웠다’ 혹은 ‘원래 모습으로 세웠다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  english_pob_choice: the workmen labored
  chosen_korean: 일꾼들이 수고하였고
  alternatives_korean:
  - 일하는 자들이 일하였고
  - 일꾼들이 일하였고
  lexicon: HALOT
  rationale: עֹשֵׂי הַמְּלָאכָה는 문자적으로는 ‘일을 하는 자들’이지만, 문맥상 성전 수리 현장에서의 적극적 노동을 가리키므로 ‘수고하였고’로 옮겨 자연스러운 합쇼체를 살렸습니다.
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  english_pob_choice: the repair work progressed
  chosen_korean: 수리 작업이 ... 진전되었으며
  alternatives_korean:
  - 수리 작업이 ... 올라왔으며
  - 수리 작업이 ... 회복되었으며
  lexicon: HALOT
  rationale: אֲרוּכָה는 ‘치유/회복/수리’의 뜻을 가질 수 있으나, 여기서는 건축 수리 맥락이므로 ‘수리 작업’으로 구체화하고, עלה의 진행 의미를 ‘진전되다’로 살렸습니다.
- source_word: בְּיָדָם
  english_pob_choice: by their hand
  chosen_korean: 그들의 손을 통해
  alternatives_korean:
  - 그들의 손으로
  - 그들의 손에 의해
  lexicon: HALOT
  rationale: 히브리어 관용구의 행위 주체성을 보존하면서도 한국어에서 자연스럽게 읽히도록 ‘그들의 손을 통해’로 풀었습니다.
- source_word: עַל מַתְכֻּנְתּוֹ
  english_pob_choice: to its proper condition
  chosen_korean: 본래의 상태로
  alternatives_korean:
  - 제자리에
  - 제대로 된 상태로
  - 정당한 형식으로
  lexicon: HALOT
  rationale: מַתְכֻּנְתּוֹ는 고정된 형식이나 마땅한 상태를 가리키므로, 성전이 수리되어 마땅한 모습으로 돌아갔다는 뜻을 살려 ‘본래의 상태로’로 옮겼습니다.
- source_word: וַיְאַמְּצֻהוּ
  english_pob_choice: and strengthened it
  chosen_korean: 그것을 견고하게 하였습니다
  alternatives_korean:
  - 그것을 강하게 하였습니다
  - 그것을 튼튼하게 하였습니다
  lexicon: HALOT
  rationale: אַמֵּץ의 기본 의미인 ‘강하게 하다/견고하게 하다’를 구조물 문맥에 맞게 ‘견고하게 하다’로 옮겼습니다.
theological_decisions:
