  rationale: אֲרוּכָה는 ‘치유/회복/수리’의 뜻을 가질 수 있으나, 여기서는 건축 수리 맥락이므로 ‘수리 작업’으로 구체화하고, עלה의 진행 의미를 ‘진전되다’로 살렸습니다.
- source_word: בְּיָדָם
  english_pob_choice: by their hand
  chosen_korean: 그들의 손을 통해
  alternatives_korean:
  - 그들의 손으로
  - 그들의 손에 의해
  lexicon: HALOT
  rationale: 히브리어 관용구의 행위 주체성을 보존하면서도 한국어에서 자연스럽게 읽히도록 ‘그들의 손을 통해’로 풀었습니다.
- source_word: עַל מַתְכֻּנְתּוֹ
  english_pob_choice: to its proper condition
  chosen_korean: 본래의 상태로
  alternatives_korean:
  - 제자리에
  - 제대로 된 상태로
  - 정당한 형식으로
  lexicon: HALOT
  rationale: מַתְכֻּנְתּוֹ는 고정된 형식이나 마땅한 상태를 가리키므로, 성전이 수리되어 마땅한 모습으로 돌아갔다는 뜻을 살려 ‘본래의 상태로’로 옮겼습니다.
- source_word: וַיְאַמְּצֻהוּ
  english_pob_choice: and strengthened it
  chosen_korean: 그것을 견고하게 하였습니다
  alternatives_korean:
  - 그것을 강하게 하였습니다
  - 그것을 튼튼하게 하였습니다
  lexicon: HALOT
  rationale: אַמֵּץ의 기본 의미인 ‘강하게 하다/견고하게 하다’를 구조물 문맥에 맞게 ‘견고하게 하다’로 옮겼습니다.
