  rationale: 히브리어 בֵּית הָאֱלֹהִים을 직역에 가깝게 유지하여, 성전이라는 후대적 설명어보다 원문 표현의 투명성을 살렸습니다.
  doctrine_reference: 원문 직역과 성전 수리 맥락 보존
