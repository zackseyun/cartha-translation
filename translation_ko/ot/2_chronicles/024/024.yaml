revisions:
- from: 아람의 군대는 적은 수의 사람들로 왔으나, 야훼께서 매우 큰 군대를 그들의 손에 넘겨주셨습니다. 이는 그들이 그들의 조상들의 하나님인 야훼를 버렸기 때문입니다. 그래서 그들은 요아스에게 심판을 집행했습니다.[a][b][c]
  to: 아람 군대가 적은 수의 군사만 거느리고 왔으나[a], 야훼께서는 매우 많은 군대를 그들의 손에 넘겨주셨습니다[b]. 유다 사람들이 그들의 조상들의 하나님이신 야훼를 버렸기 때문입니다. 그리하여 아람 군대는 요아스에게 심판을 내렸습니다[c]
  rationale: 유다가 야훼를 버렸다는 문맥상의 주체를 명시하여 아람 군대가 배교했다는 오독을 막았습니다. 또한 군사 문맥에 맞게 표현을 다듬고, 각주 표지를 해당 어구에 배치했습니다.
