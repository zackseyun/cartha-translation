  naturalness: ‘적은 수의 사람들로 왔으나’보다 ‘적은 수의 군사만 거느리고 왔으나’가 현대 표준어 성경 문체에서 더 자연스럽고 군사 문맥에도 맞습니다. ‘그들의 조상들의 하나님’은 소유 표현이 중복되어 어색하므로 ‘조상들의 하나님’으로 다듬는 것이 자연스럽습니다.
  terminology: ‘아람’, ‘야훼’, ‘요아스’는 일관되고 적절합니다. ‘심판을 집행했습니다’도 가능하나, 원문의 복수형이 가리키는 징벌적 행위를 한국어에서 자연스럽게 포괄하는 ‘심판을 내렸습니다’를 사용했습니다. 이는 특정 교리적 해석을 더하지 않습니다.
