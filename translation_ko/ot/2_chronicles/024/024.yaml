  edition: WLC
  text: כִּי֩ בְ/מִצְעַ֨ר אֲנָשִׁ֜ים בָּ֣אוּ חֵ֣יל אֲרָ֗ם וַֽ/יהוָה֙ נָתַ֨ן בְּ/יָדָ֥/ם חַ֨יִל֙ לָ/רֹ֣ב מְאֹ֔ד כִּ֣י עָֽזְב֔וּ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/אֶת יוֹאָ֖שׁ עָשׂ֥וּ שְׁפָטִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
  footnotes:
  - marker: a
    text: Or 'with a small number of men.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into their hand,' an idiom meaning 'into their power.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they carried out judgment on Joash.'
    reason: alternative_reading
translation:
  language: ko
  text: 아람의 군대는 적은 수의 사람들로 왔으나, 야훼께서 매우 큰 군대를 그들의 손에 넘겨주셨습니다. 이는 그들이 그들의 조상들의 하나님인 야훼를 버렸기 때문입니다. 그래서 그들은 요아스에게 심판을 집행했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘적은 수의 사람들로’는 ‘적은 사람들과 함께’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘그들의 손에’는 ‘그들의 권세에’라는 관용적 뜻을 가집니다.
    reason: lexical_alternative
  - marker: c
    text: ‘심판을 집행했습니다’는 ‘요아스에게 심판을 내렸습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמִצְעַר אֲנָשִׁים
  english_pob_choice: with few men
  chosen_korean: 적은 수의 사람들로
  alternatives_korean:
  - 소수의 사람들과 함께
  - 적은 사람들로
  lexicon: HALOT
  rationale: 인원 수의 적음을 자연스럽게 드러내면서, 원문의 대조 구조를 유지했습니다.
- source_word: חֵיל אֲרָם
  english_pob_choice: the army of Aram
  chosen_korean: 아람의 군대
  alternatives_korean:
  - 아람의 병력
  - 아람의 전군
  lexicon: HALOT
  rationale: חֵיל은 이 문맥에서 군사력/군대를 가리키므로, 간결한 표준어 표현으로 옮겼습니다.
- source_word: נָתַן בְּיָדָם
  english_pob_choice: gave ... into their hand
  chosen_korean: 그들의 손에 넘겨주셨습니다
  alternatives_korean:
  - 그들의 손에 주셨습니다
  - 그들의 권세에 넘기셨습니다
  lexicon: HALOT
  rationale: 영문 POB가 유지한 관용구를 한국어에서도 ‘손에’와 ‘넘겨주다’로 살려, 권세 아래 두는 의미를 드러냈습니다.
- source_word: עָזְבוּ אֶת יְהוָה אֱלֹהֵי אֲבוֹתֵיהֶם
  english_pob_choice: they had forsaken Yahweh, the God of their fathers
  chosen_korean: 그들이 그들의 조상들의 하나님인 야훼를 버렸기 때문입니다
  alternatives_korean:
  - 그들이 조상들의 하나님이신 야훼를 떠났기 때문입니다
  - 그들이 조상들의 하나님 야훼를 버렸기 때문입니다
  lexicon: HALOT
  rationale: ‘버리다’는 언약적 배교의 무게를 보존하고, ‘조상들의 하나님’도 원문 구조를 따라 유지했습니다.
- source_word: עָשׂוּ שְׁפָטִים
  english_pob_choice: they executed judgments on Joash
  chosen_korean: 심판을 집행했습니다
  alternatives_korean:
  - 심판들을 집행했습니다
  - 요아스에게 판결을 내렸습니다
  lexicon: HALOT
  rationale: שְׁפָטִים의 복수성을 한국어에서 어색하게 살리기보다, 본문이 가리키는 징벌적·사법적 행위를 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 여호와의 이름을 어떻게 옮길지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 여호와의 언약적 고유명을 직접 사용하므로, 제목화된 대체어보다 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 아람의 승리를 하나님의 심판 행위로 드러낼지
  chosen_reading: 그래서 그들은 요아스에게 심판을 집행했습니다
  alternative_readings:
  - 그래서 그들은 요아스에게 심판을 내렸습니다
  - 그래서 요아스에 대해 심판이 집행되었습니다
  rationale: 히브리어는 전쟁 결과를 여호와의 주권적 심판으로 제시하므로, 행위 주체와 심판성을 함께 보이도록 능동형으로 옮겼습니다.
  doctrine_reference: 역대기의 보응/심판 신학
