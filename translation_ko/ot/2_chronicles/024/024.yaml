base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
  footnotes:
  - marker: a
    text: Or 'with a small number of men.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into their hand,' an idiom meaning 'into their power.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they carried out judgment on Joash.'
    reason: alternative_reading
translation:
  language: ko
  text: 아람 군대가 적은 수의 군사만 거느리고 왔으나[a], 야훼께서는 매우 많은 군대를 그들의 손에 넘겨주셨습니다[b]. 유다 사람들이 그들의 조상들의 하나님이신 야훼를 버렸기 때문입니다. 그리하여 아람 군대는 요아스에게 심판을 내렸습니다[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘적은 수의 사람들과 함께’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그들의 손에’는 ‘그들의 권세에’라는 뜻의 관용 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘요아스에게 심판을 집행했습니다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמִצְעַר אֲנָשִׁים
  english_pob_choice: with few men
  chosen_korean: 적은 수의 사람들로
  alternatives_korean:
