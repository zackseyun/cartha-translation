- from: 그리고 레위 사람들이 그것을 왕의 감독 아래로 가져올 때마다, 그들이 돈이 많음을 보면 왕의 서기관과 대제사장의 관리가 와서 궤를 비우고, 그것을 가지고 다시 제자리에 돌려놓았습니다. 그들은 이렇게 날마다 했고, 돈을 풍성히 모았습니다.[a][b]
  to: 레위 사람들이 그 궤[a]를 왕의 감독을 받도록 가져올 때마다, 그 안에 돈[b]이 많이 든 것을 보면 왕의 서기관과 대제사장의 관리가 와서 궤를 비우고, 그것을 들어 제자리에 돌려놓곤 하였습니다. 그들은 이렇게 날마다 하여 돈을 풍성히 모았습니다.
  rationale: ‘왕의 감독 아래로’를 행정적 관할을 나타내는 자연스러운 한국어로 수정하고, 관찰 주체의 문법적 모호성을 ‘그 안에 돈이 많이 든 것을 보면’으로 완화했습니다. 반복적 관행을 ‘-곤 하였습니다’로 반영했으며, 각주 표지를 해당 어휘에 연결했습니다. 본문의 의미나 신학적 함의는 변경하지 않았습니다.
