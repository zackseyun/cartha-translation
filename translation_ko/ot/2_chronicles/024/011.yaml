review_pass:
  verdict: revise
  source_fidelity: 히브리어의 반복적 절차, 레위인의 운반, 왕 측의 감독, 돈이 많이 모인 때의 비움, 궤의 반환, 그리고 풍성한 모금이라는 흐름은 대체로 충실합니다. 다만 ‘왕의 감독 아래로 가져오다’는 목적지처럼 들려 פְּקֻדַּת הַמֶּלֶךְ의 행정적 감독/관할 의미를 한국어에서 부자연스럽게 처리합니다. ‘그들이’의 선행사도 다소 불분명하므로, 돈이 많이 든 상태를 직접 표현하는 편이 안전합니다.
  naturalness: 현대 표준어 합쇼체로 ‘왕의 감독 아래로’, ‘그들이 돈이 많음을 보면’, ‘그것을 가지고 다시 제자리에’는 다소 번역투이거나 지시 대상이 흐립니다. ‘왕의 감독을 받도록’, ‘그 안에 돈이 많이 든 것을 보면’, ‘궤를 들어 제자리에 돌려놓곤 하였습니다’로 다듬으면 자연스럽고 반복적 행정 절차도 드러납니다.
  terminology: הָאָרוֹן은 문맥상 언약궤가 아닌 헌금 수납 궤이므로 ‘궤’를 유지하되 해당 단어에 주석을 직접 연결하는 것이 적절합니다. כֶּסֶף는 이 문맥에서 ‘돈’으로 번역할 수 있으며, 주석도 ‘돈’에 연결해야 합니다. פְקִיד כֹּהֵן הָרֹאשׁ은 특정 계급을 과도하게 확정하지 않는 ‘대제사장의 관리’가 무난합니다.
  issues:
  - severity: medium
    issue: ‘왕의 감독 아래로 가져올 때마다’
