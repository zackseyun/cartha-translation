  - severity: low
    issue: ‘그들이 돈이 많음을 보면’의 선행사 불명확
    rationale: וְכִרְאוֹתָם의 복수 주체가 문장상 명확히 드러나지 않습니다. ‘그 안에 돈이 많이 든 것을 보면’은 본문의 관찰 내용을 보존하면서 한국어의 모호성을 줄입니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 함께 배치됨
    rationale: 각주는 각각 הָאָרוֹן과 כֶּסֶף에 관한 것이므로 ‘궤’와 ‘돈’ 뒤에 직접 붙여 독자가 주석 대상을 알 수 있게 해야 합니다.
