base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
  footnotes:
  - marker: a
    text: Or 'the ark' if taken more literally from the Hebrew term; here it refers to the collection chest, not the ark of the covenant.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'silver'; in this administrative context the term refers to collected money.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위 사람들이 그 궤[a]를 왕의 감독을 받도록 가져올 때마다, 그 안에 돈[b]이 많이 든 것을 보면 왕의 서기관과 대제사장의 관리가 와서 궤를 비우고, 그것을 들어 제자리에 돌려놓곤 하였습니다. 그들은 이렇게 날마다 하여 돈을 풍성히 모았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הָאָרוֹן은 문자적으로 ‘궤/상자’이지만, 여기서는 언약궤가 아니라 헌금용 수납 용기를 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어 כֶּסֶף은 문자적으로 ‘은’이지만, 이 행정적 문맥에서는 ‘돈’의 뜻으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  english_pob_choice: the chest
  chosen_korean: 궤
  alternatives_korean:
  - 상자
  - 궤짝
  lexicon: HALOT
  rationale: 이 구절의 הָאָרוֹן은 언약궤가 아니라 헌금용 수납 용기이므로, 문맥상 일반적인 ‘궤’로 옮겨 오해를 줄였습니다.
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  english_pob_choice: the king’s oversight
  chosen_korean: 왕의 감독 아래
  alternatives_korean:
  - 왕의 점검 아래
  - 왕의 관리 아래
  - 왕의 감독
  lexicon: HALOT
  rationale: 행정적 감시·관리의 의미가 강하므로 ‘감독’으로 옮겨 반복적으로 비워지고 되돌려지는 절차를 살렸습니다.
- source_word: רַב הַכֶּסֶף
  english_pob_choice: the money was abundant
  chosen_korean: 돈이 많음
  alternatives_korean:
  - 은이 많음
  - 돈이 풍부함
  - 은전이 많음
  lexicon: HALOT
  rationale: 이 문맥의 כֶּסֶף는 헌금의 실질인 돈을 가리키므로 ‘돈’으로 자연스럽게 풀고, רַב은 양의 많음을 그대로 반영했습니다.
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  english_pob_choice: they gathered money in abundance
  chosen_korean: 돈을 풍성히 모았습니다
  alternatives_korean:
  - 돈을 많이 모았습니다
  - 은을 많이 모았습니다
  - 돈을 크게 모았습니다
  lexicon: HALOT
  rationale: אָסַף의 ‘모으다’와 לָרֹב의 ‘풍성하게/많이’라는 양감이 함께 드러나도록 간결하게 옮겼습니다.
theological_decisions:
- issue: 고대 수납 용기 הָאָרוֹן을 현대 독자가 언약궤로 오해할 가능성
  chosen_reading: 문맥상 헌금 상자를 가리키는 ‘궤’로 번역하되, 본문 자체는 일반 용기임을 유지했습니다.
  alternative_readings:
  - ‘언약궤’로의 전통적 독해
  - ‘상자’로의 일반 명사화
  rationale: 본문의 행정적·재정적 흐름은 성막의 언약궤와 다르므로, 문맥을 따라 읽되 과도한 신학적 동일시는 피했습니다.
  doctrine_reference: 본문 문맥 우선 원칙
- issue: ‘왕의 감독’ 표현의 행정적 성격
  chosen_reading: 왕권의 절차적 통제를 나타내는 행정 표현으로 이해했습니다.
  alternative_readings:
  - 단순한 방문
  - 왕의 친검
  rationale: 레위인들이 가져오고, 공관이 돈의 많음을 보고, 담당자가 비우고 되돌리는 반복 절차를 설명하는 행정 용어로 보는 것이 자연합니다.
  doctrine_reference: 본문 문맥 우선 원칙
