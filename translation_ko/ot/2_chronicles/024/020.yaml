  source_fidelity: ‘그러면서도 형통하지 못하겠습니까?’는 히브리어의 결과/병행 절을 ‘그런데도 형통할 수 있겠는가’라는 한국어식 반문으로 바꾸어 의미가 달라집니다. 또한 각주가 ‘하나님의 영’을 ‘여호와의 영’으로 바꾸어 본문 및 원문과 일치하지 않습니다. ‘감싸시니’는 לבשׁ의 옷 입힘 비유를 다소 약화하지만, 본문 의미는 유지합니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 공적 예언 선포로 자연스럽습니다. ‘백성보다 높은 곳에 서서’는 한국어에서 ‘백성 위에 서서’보다 공간적 의미가 명확하면서도 자연스럽습니다.
  terminology: ‘하나님의 영’, ‘제사장 여호야다의 아들 스가랴’, ‘야훼’, ‘명령’, ‘버리다’는 원문의 명칭과 반복 구조를 적절히 반영합니다. ‘하나님께서 이렇게 말씀하십니다’는 כֹּה אָמַר הָאֱלֹהִים의 예언자적 공식에 맞습니다.
