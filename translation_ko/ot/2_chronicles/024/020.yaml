source:
  edition: WLC
  text: וְ/ר֣וּחַ אֱלֹהִ֗ים לָֽבְשָׁה֙ אֶת זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙ וְ/לֹ֣א תַצְלִ֔יחוּ כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
  footnotes:
  - marker: a
    text: Or 'came upon Zechariah'; literally, 'clothed Zechariah.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and you will not prosper.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 영이 여호야다의 아들 제사장 스가랴를[a] 감싸시니, 그가 백성 위에 서서 그들에게 말했습니다. “하나님이 이처럼 말씀하십니다. 어찌하여 여러분은 야훼의 명령을 어기고 있습니까? 그러면서도 형통하지 못하겠습니까? 여러분이 야훼를 버렸으니, 그도 여러분을 버리셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여호와의 영이 … 스가랴에게 임하셨다.” 직역하면 “스가랴를 감싸셨다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/ר֣וּחַ אֱלֹהִ֗ים
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님에게서 온 영
  lexicon: HALOT
  rationale: 이 문맥의 רוח אלהים은 예언적 능력 부여를 가리키므로 단순한 기운보다 하나님의 주도적 영으로 옮기는 것이 자연스럽습니다. 다만 본문이 특별히 성령 용어를 강제하지는 않으므로, 표준적이면서도 원문에 가까운 ‘하나님의 영’을 택했습니다.
- source_word: לָֽבְשָׁה֙ אֶת
  english_pob_choice: clothed
  chosen_korean: 감싸시니
  alternatives_korean:
  - 옷 입히시니
  - 덧입히시니
  - 입히시니
  lexicon: HALOT
  rationale: לבש의 직유적 이미지를 살리면서도 한국어에서는 ‘옷 입히다’보다 문맥상 더 자연스럽고 능동적 개입을 드러내는 ‘감싸다’가 예언적 임재의 느낌을 잘 전합니다. 완전히 평탄화된 ‘임하시니’보다 원문 이미지가 살아 있습니다.
- source_word: מֵ/עַ֣ל לָ/עָ֑ם
  english_pob_choice: he stood above the people
  chosen_korean: 백성 위에 서서
  alternatives_korean:
  - 백성 위에 서서
  - 백성 앞에 서서
  - 백성 위에 올라서
  lexicon: HALOT
  rationale: מעל의 수직적 뉘앙스를 유지해 ‘위에’로 옮겼습니다. ‘앞에’는 의미를 약화하므로 피했고, 한국어에서는 ‘서서’가 이어져 발화 장면을 자연스럽게 만듭니다.
- source_word: עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙
  english_pob_choice: transgressing the commandments of Yahweh
  chosen_korean: 야훼의 명령을 어기고
  alternatives_korean:
  - 야훼의 계명을 범하고
  - 야훼의 명령을 넘어가고
  lexicon: HALOT
  rationale: עבר는 계명과 결합할 때 단순한 이동이 아니라 경계 넘기, 곧 위반의 뜻이 강합니다. 한국어에서는 ‘어기다’가 현대 독자에게 가장 분명하게 그 위반성을 전달합니다.
- source_word: וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם
  english_pob_choice: he has also forsaken you
  chosen_korean: 그도 여러분을 버리셨습니다
  alternatives_korean:
  - 그도 여러분을 버리셨습니다
  - 그도 여러분을 저버리셨습니다
  lexicon: HALOT
  rationale: 앞절의 ‘버렸으니’와 동사 반복을 살려 상호응보 구조를 드러냈습니다. ‘저버리다’도 가능하지만, 앞뒤 대칭을 분명히 하기 위해 같은 동사 ‘버리다’를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 예언적 경고에서 여호와/주를 일반 대명사로 완화하지 않고 신명 자체를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유 신명 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 예언적 발화의 인용부호 안 어조
  chosen_reading: ‘하나님이 이처럼 말씀하십니다’로 시작하는 합쇼체 경고문
  alternative_readings:
  - ‘하나님이 이같이 말씀하셨다’의 서술형
  - 반말형 직접선언
  rationale: 본문은 예언자적 공적 선포이므로, 인용부호 안에서도 청중을 향한 공적인 경고의 높임말을 유지하는 것이 장면과 어울립니다. 다만 하나님 직접 발화의 위엄을 위해 문장 전체는 단정적 합쇼체로 유지했습니다.
  doctrine_reference: Korean style and discourse register
