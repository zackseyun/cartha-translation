base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'they plotted against him.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'stoned him with stone'; the expression means execution by stoning.
    reason: lexical_alternative
  - marker: c
    text: Or 'in the courtyard of the house of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그를 해하려고 모의하고[a] 왕의 명령에 따라 야훼의 집 뜰에서 그를 돌로 쳐 죽였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 대적하여 공모했습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그를 돌로 쳤습니다’입니다. 이 표현은 돌로 치는 처형을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  english_pob_choice: they conspired against him
  chosen_korean: 그를 대적하여 모의하고
  alternatives_korean:
  - 그를 대적하여 음모하고
  - 그에게 반역을 꾀하고
  lexicon: HALOT
  rationale: קשר + עַל은 단순한 ‘묶다’보다 적대적 공모를 뜻하므로, 자연스러운 한국어로 ‘대적하여 모의하다’가 의미를 가장 잘 살립니다.
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  english_pob_choice: stoned him with stones
  chosen_korean: 그에게 돌을 던졌습니다
  alternatives_korean:
  - 그를 돌로 쳐 죽였습니다
  - 그에게 돌을 던져 죽였습니다
  lexicon: HALOT
  rationale: רגם은 돌로 치는 처형을 가리키며, 문맥상 집행된 사형을 뜻합니다. 한국어에서는 동사적 표현을 살려 ‘돌을 던졌습니다’로 옮기되, 처형 맥락은 문장 전체가 유지합니다.
- source_word: בְּמִצְוַת הַמֶּלֶךְ
  english_pob_choice: at the command of the king
  chosen_korean: 왕의 명령으로
  alternatives_korean:
  - 왕의 지시로
  - 왕의 명령에 따라
  lexicon: HALOT
  rationale: מִצְוָה는 권위를 지닌 명령이므로, 왕의 직접 책임을 드러내는 ‘왕의 명령으로’가 가장 자연스럽습니다.
- source_word: בַּחֲצַר בֵּית יְהוָה
  english_pob_choice: in the court of the house of Yahweh
  chosen_korean: 야훼의 집 뜰에서
  alternatives_korean:
  - 야훼의 집 마당에서
  - 야훼의 성전 뜰에서
  lexicon: HALOT
  rationale: חָצֵר는 뜰/안뜰을 뜻하므로 ‘뜰’이 직접적입니다. בֵּית יְהוָה는 관용구를 보존해 ‘야훼의 집’으로 옮겼습니다.
theological_decisions:
- issue: 여호와 신명(יהוה) 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה를 신명 그대로 드러내기 위해 ‘야훼’를 유지했습니다. 이는 역사적·문헌학적 가시성을 살리는 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
