base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
  footnotes:
  - marker: a
    text: Or, 'Ethiopians.' The Hebrew says 'Cushites,' referring to people of Cush.
    reason: lexical_alternative
  - marker: b
    text: Or, 'before his camp.' The Hebrew word can mean 'camp' or 'army'; the suffix may be understood as referring to Asa's force, though some take it as the LORD's host.
    reason: alternative_reading
translation:
  language: ko
  text: 아사와 그와 함께한 백성은 그들을 그랄에 이르기까지 추격하였습니다. 구스 사람들 가운데 쓰러진 이들이 많아 살아남은 이가 하나도 없었습니다.[a] 그들이 야훼 앞과 그의 군대 앞에서 무너졌기 때문입니다.[b] 그들은 매우 많은 전리품을 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에티오피아 사람들’. 히브리어는 ‘구스 사람들’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 진영 앞’. 히브리어 ‘그의’는 아사의 군대나 진영을 가리킬 수도 있고, 야훼의 군대 또는 진영을 가리킨다고 보는 견해도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  english_pob_choice: pursued them
  chosen_korean: 추격하였고
  alternatives_korean:
  - 뒤쫓았고
  - 쫓아갔고
  lexicon: HALOT
  rationale: 군사적 문맥에서 רדף는 단순한 추적보다 ‘추격하다’가 더 자연스럽고, 전투 서술의 긴박함을 잘 살립니다.
- source_word: מִכּוּשִׁים
  english_pob_choice: Cushites
  chosen_korean: 구스 사람들
  alternatives_korean:
  - 에티오피아 사람들
  - 구스인들
  lexicon: HALOT
  rationale: 히브리어의 민족명 כּוּשִׁים을 직접 반영해 ‘구스 사람들’로 옮겨, 전통적이지만 시대착오적일 수 있는 지명을 피했습니다.
- source_word: לְאֵין לָהֶם מִחְיָה
  english_pob_choice: that none remained alive
  chosen_korean: 살아남은 이가 하나도 없었습니다
  alternatives_korean:
  - 그들에게 생명이 남지 않았습니다
  - 생존자가 하나도 없었습니다
  lexicon: HALOT
  rationale: 문구가 생존의 전면적 부재를 뜻하므로, 의미를 분명히 하되 과도하게 풀지 않는 한국어로 옮겼습니다.
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  english_pob_choice: before his army
  chosen_korean: 그의 군대 앞
  alternatives_korean:
  - 그의 진영 앞
  - 그의 야영지 앞
  lexicon: HALOT
  rationale: מַחֲנֶה는 ‘진영/군대’ 모두 가능하지만, 전투 결과의 능동적 주체를 드러내는 문맥에서는 ‘군대’가 더 적절합니다. 번역은 본문 의미를 따르되, 대안 독법은 주석으로 남겨 둡니다.
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  english_pob_choice: Then they carried off a very great amount of plunder.
  chosen_korean: 그들은 매우 많은 전리품을 가져갔습니다
  alternatives_korean:
  - 그들은 아주 많은 노획물을 가져갔습니다
  - 그들은 엄청난 전리품을 실어 갔습니다
  lexicon: HALOT
  rationale: נשא + שׁלל은 노획물을 ‘가져가다/옮기다’의 뜻이므로, 현대 한국어에서 자연스럽고 직설적인 ‘전리품을 가져갔습니다’로 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 신명기적 언약 이름 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 고유한 신적 이름 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: לִפְנֵי יְהוָה וְלִפְנֵי מַחֲנֵהוּ의 이중 진술
  chosen_reading: ‘야훼 앞과 그의 군대 앞’
  alternative_readings:
  - ‘야훼 앞과 그의 진영 앞’
  - ‘야훼 앞과 야훼의 군대 앞’
  rationale: 본문은 패배가 하나님 앞과 인간 군사력 앞에서 동시에 일어났다고 말하므로, 두 차원을 지우지 않고 그대로 살렸습니다. 여기서 ‘그의’는 서술 흐름상 아사를 가장 자연스럽게 가리킵니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 (preserve tension rather than resolve it beyond the text)
