  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
  footnotes:
  - marker: a
    text: Or 'for the land is still before us,' implying that the opportunity remains open or the territory lies unthreatened before them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 유다에게 말했습니다. 「이 성읍들을 건축하고, 성벽과 망대, 문과 빗장으로 둘러쌉시다. 땅이 아직 우리 앞에 있으니, 우리가 야훼 우리 하나님을 찾았기 때문입니다. 우리가 그를 찾았더니, 그가 우리에게 사방으로 평안을 주셨습니다.」 그리하여 그들이 건축했고, 일이 형통했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅이 아직 우리 앞에 있으니’ 곧 기회가 아직 열려 있거나 그 땅이 우리 앞에 위협 없이 놓여 있음을 뜻할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  english_pob_choice: And he said to Judah
  chosen_korean: 그가 유다에게 말했습니다
  alternatives_korean:
  - 그가 유다 사람들에게 말했습니다
  - 그가 유다 백성에게 말했습니다
  lexicon: HALOT
  rationale: לִיהוּדָה는 지명/국명인 유다가 사람들을 대표하는 메토님으로 쓰여, 한국어에서도 지시 대상을 자연스럽게 살리되 형식상은 ‘유다에게’로 옮겼습니다.
- source_word: חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  english_pob_choice: walls and towers, gates and bars
  chosen_korean: 성벽과 망대, 문과 빗장
  alternatives_korean:
  - 담과 망대, 문과 빗장
  - 성벽과 망대, 문과 빗장쇠
  lexicon: HALOT
  rationale: 성읍 방어시설 목록이므로 ‘성벽, 망대, 문, 빗장’으로 옮겨 방어적 성격을 분명히 했습니다. דְּלָתַיִם은 성문 맥락에서 ‘문’이 자연스럽고, בְּרִיחִים는 문을 잠그는 ‘빗장’이 적절합니다.
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  english_pob_choice: while the land is still before us
  chosen_korean: 땅이 아직 우리 앞에 있으니
  alternatives_korean:
  - 땅이 아직 우리 앞에 있으므로
  - 땅이 아직 우리 앞에 남아 있으니
  lexicon: HALOT
  rationale: עוֹדֶנּוּ의 ‘아직/여전히’와 לְפָנֵינוּ의 ‘우리 앞에’라는 관용을 살리되, 한국어 문맥상 이유절로 자연스럽게 연결했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥의 Tetragrammaton은 전통적 대체어가 아니라 고유명으로 다뤄야 하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 다림 없는 ‘평안’의 범위
  chosen_reading: 그가 우리에게 사방으로 평안을 주셨습니다
  alternative_readings:
  - 그가 우리에게 사방으로 안식을 주셨습니다
  - 그가 우리를 사방으로부터 쉬게 하셨습니다
  rationale: מִסָּבִיב은 문자적으로 ‘사방/둘레로부터’이며, 전쟁과 위협의 부재를 포함하는 결과를 암시하지만 본문이 직접 말하는 것은 ‘평안’/‘안식’입니다. 한국어에서는 결과를 과장하지 않고 자연스럽게 ‘사방으로 평안’을 택했습니다.
  doctrine_reference: 2 Chronicles 14:6 context of divine rest and covenant favor
