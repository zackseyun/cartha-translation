  naturalness: 합쇼체는 일관되어 있으며 전반적으로 자연스럽습니다. 그러나 ‘땅이 아직 우리 앞에 있으니, 우리가 … 찾았기 때문입니다’는 두 이유절의 연결이 다소 부자연스럽습니다. 이를 두 문장으로 처리하면 원문의 반복과 논리 관계를 더 명료하게 보존할 수 있습니다.
