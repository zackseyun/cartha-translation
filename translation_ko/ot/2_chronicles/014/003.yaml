  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: ko
  text: 그리고 그는 유다에게 그들의 조상들의 하나님 야훼를 찾고, 율법과 계명을 지키라고 말했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 דָּרַשׁ는 여기서 단순한 정보 탐색보다 ‘찾아 구하다’의 뜻을 갖습니다.
    reason: source_note
  - marker: b
    text: YHWH는 본 프로젝트의 기본 표기인 ‘야훼’로 옮겼습니다.
    reason: theological_note
lexical_decisions:
- source_word: לִֽ/יהוּדָ֔ה
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유다 지파
  - 유다 사람들
  lexicon: 고유명사
  rationale: 문맥상 왕국 전체가 아니라 유다에 대한 직접 명령이므로, 표준적인 고유명사 ‘유다’로 옮겼습니다.
- source_word: לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה
  english_pob_choice: to seek the LORD
  chosen_korean: 야훼를 찾고
  alternatives_korean:
  - 주를 찾고
  - 여호와를 찾고
  lexicon: דרשׁ
  rationale: 히브리어 דָּרַשׁ의 핵심은 단순한 종교적 탐색보다 ‘찾다/구하다’이므로, POB 원칙에 따라 YHWH는 ‘야훼’로, 동사는 자연스럽게 ‘찾다’로 옮겼습니다.
- source_word: הַ/תּוֹרָ֥ה וְ/הַ/מִּצְוָֽה
  english_pob_choice: the law and the commandment
  chosen_korean: 율법과 계명
  alternatives_korean:
  - 법과 명령
  - 율법과 명령
  lexicon: תורה / מצוה
  rationale: תּוֹרָה는 프로젝트 기본어휘에 따라 ‘율법’으로, מִצְוָה는 단수 개별 명령의 뉘앙스를 살려 ‘계명’으로 옮겼습니다.
theological_decisions:
- issue: YHWH의 표기와 구약 본문에서의 신명기적 호칭 유지
  chosen_reading: ‘야훼’로 표기해 본문의 하나님의 이름을 분명히 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트의 기본 표준은 YHWH를 학술적 전사인 ‘야훼’로 일관되게 드러내는 것이며, 본절은 그 표준을 따르는 것이 स्रोत 직결성과 추적 가능성을 가장 잘 보존합니다.
  doctrine_reference: POB name-rendering policy
