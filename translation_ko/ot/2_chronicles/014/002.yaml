  text: וַ/יָּ֛סַר אֶת מִזְבְּח֥וֹת הַ/נֵּכָ֖ר וְ/הַ/בָּמ֑וֹת וַ/יְשַׁבֵּר֙ אֶת הַ/מַּצֵּב֔וֹת וַ/יְגַדַּ֖ע אֶת הָ/אֲשֵׁרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
  footnotes:
  - marker: a
    text: Or 'the Asherah poles.' The Hebrew term refers to cultic objects associated with Asherah worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 이방의 제단들과 산당들을 제거하고, 그 돌기둥들을 깨뜨리고, 아세라 목상들을 찍어 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아세라 목상들’은 히브리어 용어가 가리키는 제의적 대상의 기능을 풀어 쓴 번역입니다. 원문은 아세라 숭배와 연관된 물적 숭배 대상들을 가리키며, 정확한 형상은 문맥상 단정하기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבְּח֥וֹת הַ/נֵּכָ֖ר
  english_pob_choice: the foreign altars
  chosen_korean: 이방의 제단들
  alternatives_korean:
  - 외국의 제단들
  - 낯선 제단들
  lexicon: HALOT
  rationale: נֵכָר는 단순한 국적보다 이스라엘의 예배 질서 밖에 있는 ‘이방/외래’의 성격을 가리키므로, 한국어에서는 관용적이면서도 종교적 대비가 분명한 ‘이방의 제단들’이 적절합니다.
- source_word: וְ/הַ/בָּמ֑וֹת
  english_pob_choice: the high places
  chosen_korean: 산당들
  alternatives_korean:
  - 높은 곳들
  - 언덕 신당들
  lexicon: HALOT
  rationale: בָּמוֹת는 고지의 일반 명칭이 아니라 우상 숭배와 연결된 제의 장소를 가리키는 정형어이므로, 한국어 성경에서 널리 쓰이면서도 기능을 드러내는 ‘산당들’로 옮겼습니다.
- source_word: וַיְשַׁבֵּר֙ אֶת הַ/מַּצֵּב֔וֹת
  english_pob_choice: shattered the sacred pillars
  chosen_korean: 그 돌기둥들을 깨뜨리고
  alternatives_korean:
  - 그 신성한 기둥들을 부수고
  - 그 세운 돌기둥들을 허물고
  lexicon: HALOT
  rationale: מַצֵּבָה는 예배용 ‘세운 돌’의 뜻이지만, POB가 ‘sacred pillars’로 해설한 점을 따르되 한국어에서는 과도한 해설 없이 물질성과 파괴 동작을 살려 ‘돌기둥들’을 택했습니다.
- source_word: הָ/אֲשֵׁרִים
  english_pob_choice: the Asherim
  chosen_korean: 아세라 목상들
  alternatives_korean:
  - 아세라 상들
  - 아세라 기둥들
  lexicon: HALOT
  rationale: 아세라 관련 제의물은 학술적으로 범위가 넓지만, POB가 각주에서 Asherah poles 가능성을 밝히므로 한국어 본문은 독자가 즉시 이해할 수 있는 ‘목상들’을 쓰되, 특정 형상으로 단정하지 않는 표현을 유지했습니다.
theological_decisions:
- issue: ‘high places’의 한국어 처리
  chosen_reading: ‘산당들’로 번역해 이 절이 우상 숭배 개혁 행위를 묘사한다는 점을 분명히 했습니다.
  alternative_readings:
  - 산 위의 제단들
  - 높은 곳들
  rationale: 이 절의 열거는 단순한 지리적 고지 제거가 아니라 예배 개혁의 파괴 행위이므로, 전통적이지만 의미가 분명한 ‘산당’이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3, §5
