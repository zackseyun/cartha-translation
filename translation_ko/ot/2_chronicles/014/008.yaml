source:
  edition: WLC
  text: וַ/יֵּצֵ֨א אֲלֵי/הֶ֜ם זֶ֣רַח הַ/כּוּשִׁ֗י בְּ/חַ֨יִל֙ אֶ֣לֶף אֲלָפִ֔ים וּ/מַרְכָּב֖וֹת שְׁלֹ֣שׁ מֵא֑וֹת וַ/יָּבֹ֖א עַד מָרֵשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
  footnotes:
  - marker: a
    text: Or 'one million.' The Hebrew reads literally 'a thousand thousands.'
    reason: lexical_alternative
  - marker: b
    text: '''Cushite'' is the Hebrew ethnogeographic term; traditionally, ''Ethiopian.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 구스 사람 세라가 그들을 치려고 나왔는데, 그의 군대는 백만 명과 삼백 대의 병거였으며, 마레사까지 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘백만 명’은 히브리어의 문자적 표현 ‘천천’을 수량으로 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘구스 사람’은 히브리어의 지리·민족 용어를 직접 반영한 번역입니다. 전통적으로는 ‘에티오피아 사람’으로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַח הַכּוּשִׁי
  english_pob_choice: Zerah the Cushite
  chosen_korean: 구스 사람 세라
  alternatives_korean:
  - 에티오피아 사람 세라
  - 구스 사람 제라
  lexicon: HALOT
  rationale: כּוּשִׁי를 전통적 해석어인 ‘에티오피아 사람’보다 지리·민족 용어를 직접 반영하는 ‘구스 사람’으로 옮겼고, 고유명사 זֶרַח은 표준 음역에 따라 ‘세라’로 적었습니다.
- source_word: בְּחַיִל
  english_pob_choice: with an army
  chosen_korean: 그의 군대는
  alternatives_korean:
  - 그의 군세는
  - 군대를 거느리고
  lexicon: HALOT
  rationale: חַיִל은 여기서 단순한 능력이 아니라 군사력/병력을 가리키므로, 자연스러운 현대 한국어로 ‘군대’라고 풀어 옮겼습니다.
- source_word: אֶלֶף אֲלָפִים
  english_pob_choice: a thousand thousands
  chosen_korean: 백만 명
  alternatives_korean:
  - 천의 천 곱절
  - 천천
  lexicon: HALOT
  rationale: 히브리어 표현을 문자적으로는 ‘천천’에 가깝지만, 수량의 관용적 의미를 반영해 한국어 독자가 즉시 이해할 수 있는 ‘백만 명’을 본문에 두었습니다.
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  english_pob_choice: and three hundred chariots
  chosen_korean: 삼백 대의 병거
  alternatives_korean:
  - 삼백 전차
  - 병거 삼백 대
  lexicon: HALOT
  rationale: מַרְכָּבוֹת는 고대 전쟁 장비를 가리키므로, 성경 번역 전통에 맞는 ‘병거’를 유지하되 현대 한국어 어순으로 자연스럽게 배치했습니다.
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  english_pob_choice: and he came as far as Mareshah
  chosen_korean: 마레사까지 이르렀습니다
  alternatives_korean:
  - 마레사에 이르렀습니다
  - 마레사까지 왔습니다
  lexicon: HALOT
  rationale: עַד + 지명은 도달 범위를 나타내므로 ‘까지 이르렀습니다’로 옮겨, 단순한 도착보다 전진의 한계를 드러냈습니다.
theological_decisions:
- issue: 전쟁 서술의 동사 뉘앙스
  chosen_reading: ‘그들을 치려고 나왔는데’로 옮겨 적대적 군사 행동을 분명히 했습니다.
  alternative_readings:
  - 그들에게 나왔습니다
  - 그들에게로 진군했습니다
  rationale: וַיֵּצֵא אֲלֵיהֶם은 문자적으로 ‘그들에게로 나갔다’이지만, 전투 문맥에서는 적대적 접근이므로 한국어에서 공격 의도를 드러내는 표현이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: narrative sense
