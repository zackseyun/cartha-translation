id: 2CH.14.7
reference: 2 Chronicles 14:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/אָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָ/רֹמַח֒ מִֽ/יהוּדָה֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וּ/מִ/בִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָ֑לֶף כָּל אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִלס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
  footnotes:
  - marker: a
    text: Or 'mighty warriors' or 'valiant men.' The Hebrew expression גִּבּוֹרֵי חָיִל is a stock term for strong, valiant fighting men.
    reason: lexical_alternative
translation:
  language: ko
  text: 아사에게는 유다에서 큰 방패와 창을 든 군사 삼십만 명과, 베냐민에서 방패를 들고 활을 당기는 이십팔만 명이 있었습니다. 이들은 모두 용맹한 용사들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיִל
  english_pob_choice: army
  chosen_korean: 군사
  alternatives_korean:
  - 군대
  - 병력
  lexicon: HALOT
  rationale: 이 문맥의 חַיִל은 추상적 힘보다 전투 인원을 가리키므로, 현대 한국어에서 자연스러운 집합 명사인 ‘군사’로 옮겼습니다.
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  english_pob_choice: bearing large shields and spears
  chosen_korean: 큰 방패와 창을 든
  alternatives_korean:
  - 큰 방패와 창을 지닌
  - 큰 방패와 창을 메고 있는
  lexicon: HALOT
  rationale: נֹשֵׂא는 단순 소지보다 무장을 갖춘 상태를 가리키므로, 군사적 맥락이 분명한 ‘든’으로 자연스럽게 옮겼습니다. צִנָּה의 크기 대비는 ‘큰 방패’로 반영했습니다.
- source_word: נֹשְׂאֵי מָגֵן
  english_pob_choice: bearing shields
  chosen_korean: 방패를 들고
  alternatives_korean:
  - 방패를 지고
  - 방패를 메고
  lexicon: HALOT
  rationale: 여기서는 앞의 צִנָּה와 달리 מָגֵן의 일반적 의미를 살려 단순히 ‘방패를 들고’로 옮겨, 두 종류의 방패가 구분되도록 했습니다.
- source_word: וְדֹרְכֵי קֶשֶׁת
  english_pob_choice: drawing bows
  chosen_korean: 활을 당기는
  alternatives_korean:
  - 활을 메는
  - 활을 휘두르는
  lexicon: HALOT
  rationale: 직역하면 ‘활을 밟는’ 관용구지만, 한국어에서는 실제 사용 동작을 드러내는 ‘활을 당기는’이 의미를 가장 분명하게 전달합니다.
- source_word: גִּבּוֹרֵי חָיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 용사들
  alternatives_korean:
  - 용맹한 사람들
  - 강한 전사들
  lexicon: HALOT
  rationale: 고정된 전투 용어의 힘을 살리면서도 현대 한국어에서 어색한 ‘남자들’ 직역은 피하고, 남성 전투 집단이라는 의미는 ‘용사들’로 충분히 드러나게 했습니다.
theological_decisions:
- issue: 전쟁 서술에서의 인원 수와 영웅적 표현 처리
  chosen_reading: 본문의 군사 규모와 ‘용맹한 용사들’이라는 평가를 그대로 유지했습니다.
  alternative_readings:
  - 인원을 완화해 표현하기
  - ‘강한 전사들’처럼 비평가적 어조로 바꾸기
  rationale: 본문은 아사의 군사력을 기술하는 역사 서술이므로, 수치와 평가를 약화하지 않고 원문의 강조를 보존하는 것이 적절합니다.
  doctrine_reference: POB translation philosophy
