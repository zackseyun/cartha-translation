  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם אָהֳלֵ֥י מִקְנֶ֖ה הִכּ֑וּ וַ/יִּשְׁבּ֨וּ צֹ֤אן לָ/רֹב֙ וּ/גְמַלִּ֔ים וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
  footnotes:
  - marker: a
    text: Or, more literally, 'the tents of livestock.' The phrase may refer to pastoral encampments or herdsmen's camps.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew verb can mean 'took captive'; with animals as the object, the sense is that they seized them as plunder.
    reason: lexical_alternative
  - marker: c
    text: '''Sheep'' may also be understood more broadly as ''flocks'' or ''small livestock.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 또한 가축의 천막들을 쳤으며, 양을 매우 많이, 그리고 낙타도 빼앗았습니다. 그런 다음 예루살렘으로 돌아왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלֵי מִקְנֶה
  english_pob_choice: the tents of livestock
  chosen_korean: 가축의 천막들
  alternatives_korean:
  - 가축 천막들
  - 가축의 장막들
  - 목축 천막들
  lexicon: HALOT
  rationale: 히브리어의 직역적 이미지인 ‘가축의 천막들’을 살리되, 한국어에서 자연스럽게 읽히도록 ‘가축의 천막들’로 옮겼습니다. ‘장막’은 다소 성서 문체가 강해 여기서는 덜 직접적인 느낌이 있어 피했습니다.
- source_word: הִכּוּ
  english_pob_choice: struck
  chosen_korean: 쳤으며
  alternatives_korean:
  - 공격했으며
  - 쳐부수었으며
  - 타격했으며
  lexicon: HALOT
  rationale: 전쟁 서술의 기본 동사로서 ‘치다’가 히브리어의 직접성을 가장 잘 반영합니다. 영어 POB의 ‘struck’처럼 과장하지 않고 문맥상 약탈 공격을 자연스럽게 표현합니다.
- source_word: וַיִּשְׁבּוּ
  english_pob_choice: they carried off
  chosen_korean: 빼앗았습니다
  alternatives_korean:
  - 사로잡았습니다
  - 노획했습니다
  - 끌고 갔습니다
  lexicon: HALOT
  rationale: 대상이 동물들이므로 ‘사로잡다’보다 전리품을 취한다는 뜻의 ‘빼앗다’가 더 정확합니다. 영어 POB가 포획/약탈의 의미를 유지한 것에 맞춰 한국어도 약탈적 획득을 드러냈습니다.
- source_word: צֹאן
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 양 떼
  - 가축
  - 작은 가축
  lexicon: HALOT
  rationale: צֹאן은 넓게는 양과 염소를 아우르지만, 여기서는 다수의 전리품을 가리키는 일반명사로서 ‘양’이 가장 간결하고 자연스럽습니다. 필요하면 ‘양 떼’로도 읽을 수 있습니다.
- source_word: לָרֹב
  english_pob_choice: in abundance
  chosen_korean: 매우 많이
  alternatives_korean:
  - 풍성하게
  - 엄청나게
  - 풍부하게
  lexicon: HALOT
  rationale: 히브리어의 양적 강조를 한국어에서 가장 직접적으로 전달하는 표현으로 ‘매우 많이’를 택했습니다. 문어체이면서도 수량의 강조가 분명합니다.
