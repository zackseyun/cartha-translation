  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: ko
  text: 그들은 그랄 사방의 모든 성읍을 쳤습니다. 야훼의 공포가 그들 위에 있었기 때문입니다. 그들은 모든 성읍을 약탈했습니다. 그 안에 많은 전리품이 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘공포’는 այստեղ의 פַּחַד가 사람들의 경외감이 아니라 야훼로 인해 임한 두려움/공황을 가리킨다는 점을 반영합니다.
    reason: theological_note
lexical_decisions:
- source_word: וַיַּכּוּ
  english_pob_choice: they struck down
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 쳐서 무찔렀습니다
  - 쳐서 쓰러뜨렸습니다
  - 멸했습니다
  lexicon: HALOT
  rationale: 군사 문맥의 נכה를 살리되, 한국어에서는 과도하게 해석을 덧붙이지 않고 ‘쳤습니다’로 간결하게 옮겨 원문의 폭력적 진술을 유지했습니다.
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  english_pob_choice: all the cities around Gerar
  chosen_korean: 그랄 사방의 모든 성읍
  alternatives_korean:
  - 그랄 주변의 모든 성읍
  - 그랄을 둘러싼 모든 성읍
  - 그랄 둘레의 모든 도시
  lexicon: HALOT
  rationale: סְבִיבוֹת를 자연스러운 한국어 어순인 ‘사방의’로 풀어 지리적 둘러쌈을 살렸고, עָרִים은 이 전투 서술의 행정적/군사적 규모를 반영해 ‘성읍’으로 옮겼습니다.
- source_word: פַּחַד יְהוָה
  english_pob_choice: the terror of Yahweh
  chosen_korean: 야훼의 공포
  alternatives_korean:
  - 야훼에 대한 두려움
  - 야훼의 두려움
  - 야훼의 위협
  lexicon: HALOT
  rationale: 여기서는 경외심이 아니라 주변 민족에게 임한 압도적 공포를 뜻하므로, ‘두려움’보다 강한 ‘공포’가 source-direct합니다.
- source_word: וַיָּבֹזּוּ ... בִּזָּה רַבָּה
  english_pob_choice: they plundered ... much spoil
  chosen_korean: 약탈했습니다 ... 많은 전리품
  alternatives_korean:
  - 노략질했습니다 ... 많은 노획물
  - 탈취했습니다 ... 많은 노획품
  - 빼앗았습니다 ... 많은 전리품
  lexicon: HALOT
  rationale: 동사 בזז와 명사 ביזה를 한국어에서 구별해야 하므로, 행위는 ‘약탈했습니다’, 결과물은 군사적 획득물인 ‘전리품’으로 나누어 표현했습니다.
