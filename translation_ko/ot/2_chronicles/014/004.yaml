language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨סַר֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה אֶת הַ/בָּמ֖וֹת וְ/אֶת הַֽ/חַמָּנִ֑ים וַ/תִּשְׁקֹ֥ט הַ/מַּמְלָכָ֖ה לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
  footnotes:
  - marker: a
    text: Or possibly “the sun pillars.” The Hebrew term refers to cultic objects and may in some contexts be associated with solar worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 유다의 모든 성읍에서 산당과 향단을 제거하였고, 왕국은 그의 앞에서 평온하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “태양 기둥”일 수 있습니다. 이 히브리어는 제의적 물건을 가리키며, 어떤 문맥에서는 태양 숭배와 관련될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  english_pob_choice: He removed
  chosen_korean: 제거하였고
  alternatives_korean:
  - 없앴고
  - 치웠고
  lexicon: HALOT
  rationale: 히필 형태의 동사 סור는 대상을 ‘치워 없애다/제거하다’는 뜻이므로, 개혁 조치의 실제 행위를 분명히 드러내는 ‘제거하다’를 택했습니다.
- source_word: מִכָּל עָרֵי יְהוּדָה
  english_pob_choice: from all the cities of Judah
  chosen_korean: 유다의 모든 성읍에서
  alternatives_korean:
  - 유다의 모든 도시에서
  - 유다의 각 성읍에서
  lexicon: HALOT
  rationale: מן + כל + ‘유다의 성읍들’ 구조를 자연스러운 한국어로 옮겨, 개혁의 지리적 범위를 분명히 했습니다.
- source_word: הַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 산 위의 제단
  lexicon: HALOT
  rationale: בָּמוֹת는 우상 숭배와 연결된 제의 장소를 가리키는 관용적 표현이므로, 한국어 성경 전통과도 맞는 ‘산당’을 유지했습니다.
- source_word: הַחַמָּנִים
  english_pob_choice: the incense altars
  chosen_korean: 향단
  alternatives_korean:
  - 해신 기둥
  - 해상(太阳像) 기둥
  - 분향 제단
  lexicon: HALOT
  rationale: 이 용어는 본문상 정확한 대상이 다소 불분명하지만, 영어 POB가 채택한 제의적 사물을 반영해 구어적으로 이해 가능한 ‘향단’을 사용하고, 해석을 과도하게 좁히지 않았습니다.
- source_word: וַתִּשְׁקֹט
  english_pob_choice: had rest
  chosen_korean: 평온하였습니다
  alternatives_korean:
  - 안식하였습니다
  - 고요하였습니다
  - 평안하였습니다
  lexicon: HALOT
  rationale: שׁקט는 소란이 멎고 잠잠해지는 상태를 뜻하므로, 왕국이 ‘rest’를 누렸다는 의미를 현대적이고 자연스럽게 전달하는 ‘평온하다’를 택했습니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그의 앞에서
  alternatives_korean:
  - 그 앞에서
  - 그 면전에서
  - 그의 통치 아래
  lexicon: HALOT
  rationale: 직역에 가까운 ‘그의 앞에서’를 유지해 히브리어 관용구의 형태를 살리되, 통치 기간의 평온이라는 의미도 함께 드러나게 했습니다.
theological_decisions:
- issue: חַמָּנִים의 구체적 해석을 얼마나 좁힐 것인가
  chosen_reading: 본문의 개혁 대상을 구체적 교리명으로 확정하지 않고, 제의적 설치물로서 제거되었다는 사실만 드러냈습니다.
  alternative_readings:
  - 태양 기둥으로 특정하기
  - 향을 피우는 제단으로 특정하기
  rationale: 히브리어와 영어 POB 모두 이 항목의 정확한 성격에 해석 여지를 남기므로, 번역에서도 그 긴장을 보존하는 편이 원문 충실성에 맞습니다.
  doctrine_reference: 원문 우선 원칙; 렉시컬 불확실성은 번역에서 과도하게 해소하지 않음
