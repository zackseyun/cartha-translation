lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 하였습니다
  alternatives_korean:
  - 행하였습니다
  - 했습니다
  lexicon: HALOT
  rationale: עשה는 이 평가 구문에서 단순한 ‘만들다’가 아니라 행위와 삶의 방식 전체를 가리키므로, 자연스러운 서술체 ‘하였습니다’로 옮겼습니다.
- source_word: הַטּוֹב וְהַיָּשָׁר
  english_pob_choice: what was good and right
  chosen_korean: 선하고 바른
  alternatives_korean:
  - 좋고 올바른
  - 선과 옳음인
  lexicon: HALOT
  rationale: 두 형용사는 도덕적 평가를 이룬 결합이므로, 한국어에서도 관용적인 윤리 평가인 ‘선하고 바른’으로 함께 살렸습니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 보시기에
  alternatives_korean:
  - 눈에
  - 보기에
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 시각이 아니라 평가 기준을 뜻하므로, 하나님을 주어로 자연스럽고 공손한 ‘보시기에’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 여호와의 이름은 제목이 아니라 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
- source_word: אֱלֹהָיו
  english_pob_choice: his God
  chosen_korean: 그의 하나님
  alternatives_korean:
  - 그의 신들
  - 자기 하나님
  lexicon: HALOT
  rationale: 형태는 복수형이지만 이 문맥에서는 이스라엘의 하나님을 가리키는 단수 의미이므로, 소유 관계를 드러내는 ‘그의 하나님’으로 번역했습니다.
theological_decisions:
- issue: 야훼의 이름을 직역이 아닌 음역으로 유지하는 문제
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮기고, ‘주’로 대체하지 않았습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 열왕·역대사의 평가 공식에서 하나님의 개인 이름을 유지하는 것이 본문의 언약적 강조를 더 분명히 드러내므로, 프로젝트 기본값을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
