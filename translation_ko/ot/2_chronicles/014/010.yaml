revisions:
- from: 아사야 여호와, 그의 하나님께 부르짖어 말하였습니다. 「여호와여, 강한 자와 힘없는 자 사이에 도우실 이는 당신밖에 없으십니다. 우리를 도우소서, 여호와 우리 하나님이여. 우리가 당신을 의지합니다. 또한 당신의 이름으로 이 많은 무리를 맞섰습니다. 여호와 우리 하나님이여, 당신은 우리의 하나님이십니다. 사람이 당신을 대적하여 이기지 못하게 하소서.」[a][b]
  to: 아사가 그의 하나님 야훼께 부르짖으며 말했습니다. 「야훼여, 강한 자든 힘없는 자든 도우시는 데 주님과 같으신 이는 없습니다.[a] 야훼 우리 하나님이여, 우리를 도우소서. 우리가 주님을 의지하며, 주님의 이름으로 이 무리를 치러 왔습니다. 야훼 우리 하나님이여, 주께서는 사람이 주님을 이기지 못하게 하소서.[b]」
  rationale: 문법 오류를 바로잡고, 신명을 POB 표준에 맞춰 ‘야훼’로 통일했습니다. 원문의 난해한 ‘강한/많은 것과 힘없음’ 대조는 본문에서 자연스럽게 옮기되 각주에서 대안적 구문과 의미 범위를 보존했습니다. ‘주님의 이름으로 이 무리를 치러 왔습니다’로 בָאנוּ עַל의 동작과 대적 방향을 회복했으며, 마지막 אַתָּה는 독립된 신학적 진술을 추가하지 않고 강조된 호칭·청원 연결로 처리했습니다.
  reviewer_model: gpt-5.6-terra
