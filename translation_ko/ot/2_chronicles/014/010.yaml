  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 기도의 전반적 뜻을 잘 전달하지만, וּבְשִׁמְךָ בָאנוּ עַל의 ‘당신의 이름으로 이 무리를 치러 왔습니다’라는 이동·대적 표현을 ‘맞섰습니다’로 바꾸어 약화·변형했습니다. 또한 אַתָּה는 뒤의 간구에 이어지는 강조된 2인칭으로 처리하는 편이 자연스러우며, ‘당신은 우리의 하나님이십니다’라는 독립 서술을 보태지 않는 것이 안전합니다.
  naturalness: ‘아사야’는 주격 조사 결합 오류이므로 ‘아사가’로 고쳐야 합니다. 하나님께 직접 말하는 문맥에서 ‘당신’의 반복은 현대 표준 한국어 기도문으로 다소 부자연스럽고 무례하게 들릴 수 있어, 호칭 ‘야훼여/우리 하나님이여’와 주어 생략을 사용했습니다. 본문 서술은 -습니다체, 청원은 한국어 기도문에 자연스러운 -소서체로 유지했습니다.
  terminology: 영어 POB의 Yahweh 및 프로젝트의 신명 표기 원칙에 맞추어 יְהוָה는 ‘야훼’로 통일했습니다. אֱנוֹשׁ은 단수 일반명사 ‘사람’으로, הָמוֹן은 군사 문맥을 불필요하게 과장하지 않는 ‘무리’로 옮겼습니다.
