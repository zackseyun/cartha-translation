base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
  footnotes:
  - marker: a
    text: Or, “there is none besides you to help, whether with many or with those who have no power.” The Hebrew of this clause is compact and may emphasize either numbers or strength.
    reason: alternative_reading
  - marker: b
    text: Or, “do not let mortal man retain strength against you” / “do not let man withstand you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아사가 그의 하나님 야훼께 부르짖으며 말했습니다. 「야훼여, 강한 자든 힘없는 자든 도우시는 데 주님과 같으신 이는 없습니다.[a] 야훼 우리 하나님이여, 우리를 도우소서. 우리가 주님을 의지하며, 주님의 이름으로 이 무리를 치러 왔습니다. 야훼 우리 하나님이여, 주께서는 사람이 주님을 이기지 못하게 하소서.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “강한 자와 힘없는 자 사이에서 도우실 이는 주님 외에는 없습니다.” 히브리어 이 구절은 매우 압축적이어서, 수의 대비를 강조하는지 힘의 대비를 강조하는지에 따라 다르게 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “죽을 사람이 주님 앞에서 힘을 유지하지 못하게 하소서” / “사람이 주님을 견뎌 내지 못하게 하소서.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: cried out
  chosen_korean: 부르짖어
  alternatives_korean:
  - 외쳐
  - 불러
  lexicon: HALOT
  rationale: 기도 문맥의 קרא는 단순한 호출보다 간절한 부르짖음이 더 자연스럽고, POB의 ‘cried out’가 담는 긴급성을 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 기존 한국어 성경의 가독성과 예배 언어를 고려해 본문은 ‘여호와’를 사용했습니다. 다만 POB의 원칙상 본 프로젝트 표준이 ‘야훼’인 점은 별도 검토 대상입니다.
- source_word: בֵּין רַב לְאֵין כֹּחַ
  english_pob_choice: between the mighty and the powerless
  chosen_korean: 강한 자와 힘없는 자 사이에
  alternatives_korean:
  - 많은 자와 힘없는 자 사이에
  - 대군과 무력한 자 사이에
  lexicon: HALOT
  rationale: רַב의 의미를 숫자보다 힘의 대비로 읽는 POB 해석을 따라 ‘강한 자’로 옮기고, לְאֵין כֹּחַ의 대구를 ‘힘없는 자’로 살렸습니다.
- source_word: עָזְרֵנוּ
  english_pob_choice: Help us
  chosen_korean: 우리를 도우소서
  alternatives_korean:
  - 우리를 도와주십시오
  - 우리를 구원하소서
  lexicon: HALOT
  rationale: 직접적인 간구형 명령을 살리되, 하나님께 드리는 기도체에 맞게 공손한 명령형 ‘-소서’를 사용했습니다.
- source_word: וּבְשִׁמְךָ בָאנוּ
  english_pob_choice: in your name we have come
  chosen_korean: 당신의 이름으로 이 많은 무리를 맞섰습니다
  alternatives_korean:
  - 당신의 이름으로 왔습니다
  - 당신의 이름으로 이 무리에 나아왔습니다
  lexicon: HALOT
  rationale: 문맥상 단순 이동보다 전투적 대면이 핵심이므로, ‘바אנו’의 상황적 의미를 드러내어 ‘맞섰습니다’로 옮겼습니다.
- source_word: אֱנוֹשׁ
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 죽을 사람
  lexicon: HALOT
  rationale: 단수 보통명사로서의 대표적 인간을 가리키므로 ‘사람’으로 옮겼고, 문장 전체의 대적 주체를 자연스럽게 유지했습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 인용의 호격과 명령형
  chosen_reading: 「여호와여… 도우소서… 하소서」
  alternative_readings:
  - 여호와여… 도와주십시오… 하십시오
  - 여호와여… 도우시옵소서
  rationale: 원문의 간구문은 왕에게 드리는 예우가 아니라 하나님께 드리는 직접 청원으로, 한국어 기도문체의 -소서를 사용해 간구의 긴급성과 경배적 태도를 함께 살렸습니다.
  doctrine_reference: 'POB Korean style guide: prayer register'
- issue: יְהוָה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 절의 본문은 구약 기도문으로서 한국 교회 독자에게 즉시 이해되는 전통 표기를 택했습니다. 다만 프로젝트 표준과의 긴장은 남아 있어 검토자가 추적할 수 있도록 기록합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
