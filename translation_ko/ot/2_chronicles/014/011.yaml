translation:
  language: ko
  text: 야훼께서 아사와 유다 앞에서 구스 사람들을 치시니, 구스 사람들이 도망쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에티오피아 사람들’. 히브리어 민족명은 ‘구스 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  english_pob_choice: struck down
  chosen_korean: 치시니
  alternatives_korean:
  - 격파하시니
  - 치셨으니
  - 쳐서 쓰러뜨리시니
  lexicon: HALOT
  rationale: 군사적 문맥에서 하나님의 공격적 개입을 자연스럽게 살리면서도, ‘smote’ 같은 고어를 피하고 한국어 서술로는 ‘치시니’가 가장 간결합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명 표기를 POB 원칙에 따라 고유명사 ‘야훼’로 옮겨, 칭호로 대체하지 않았습니다.
- source_word: הַכּוּשִׁים
  english_pob_choice: the Cushites
  chosen_korean: 구스 사람들
  alternatives_korean:
  - 구스인들
  - 에티오피아 사람들
  lexicon: HALOT
  rationale: 히브리어 민족명 כּוּשִׁים을 직접 반영하되, 한국어에서 ‘구스 사람들’은 원문 민족 표지를 유지하면서도 자연스럽습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 면전에서
  - 앞에
  lexicon: HALOT
  rationale: 전투 보고에서 ‘before’는 ‘앞에서’로 자연스럽게 풀 수 있으며, 진행 방향과 대면 상황을 함께 드러냅니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
