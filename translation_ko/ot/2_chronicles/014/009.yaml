id: 2CH.14.9
reference: 2 Chronicles 14:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א אָסָ֖א לְ/פָנָ֑י/ו וַ/יַּֽעַרְכוּ֙ מִלְחָמָ֔ה בְּ/גֵ֥יא צְפַ֖תָה לְ/מָרֵשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
  footnotes:
  - marker: a
    text: Or 'to meet him' or 'against him' for 'before him'; the Hebrew is literally 'before him' but in context it likely indicates Asa moving out to confront the opposing force.
    reason: lexical_alternative
  - marker: b
    text: Or 'they set themselves in battle array.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아사는 그의 앞에 나아갔고, 그들은 마레사에 있는 스바다 골짜기에서 전열을 갖추었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 맞으러’ 또는 ‘그를 대적하여’. 히브리어는 문자적으로 ‘그의 앞에’이지만, 문맥상 아사가 맞서 나아간다는 뜻일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘전투 대형을 갖추었습니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가고
  alternatives_korean:
  - 나갔습니다
  - 출전하고
  - 진군하고
  lexicon: HALOT
  rationale: 이 동사 연쇄는 서술 진행을 자연스럽게 잇는 형태가 적절하므로, 군사적 맥락을 유지하면서도 과도하게 해석하지 않는 ‘나가고’를 택했습니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그 앞에
  alternatives_korean:
  - 그를 맞으러
  - 그를 향해
  - 그를 대적하여
  lexicon: HALOT
  rationale: 히브리어의 문자적 의미인 ‘그 앞에’를 살리되, 문맥상 대면·대치의 가능성은 주석 없이 본문에 과도하게 주입하지 않았습니다.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  english_pob_choice: they drew up for battle
  chosen_korean: 전투 대형을 갖추었습니다
  alternatives_korean:
  - 전열을 정비했습니다
  - 전열을 갖추었습니다
  - 전투를 준비했습니다
  lexicon: HALOT
  rationale: ערך + מלחמה의 관용적 의미인 ‘전열을 갖추다/배치하다’를 한국어 군사 표현으로 옮겨, 단순한 준비보다 전투 배열의 뉘앙스를 드러냈습니다.
- source_word: בְּגֵיא צְפַתָה לְמָרֵשָׁה
  english_pob_choice: in the Valley of Zephathah at Mareshah
  chosen_korean: 마레사 곁 세밧 골짜기에서
  alternatives_korean:
  - 세밧 골짜기 마레사에서
  - 마레사 근처 세밧 골짜기에서
  - 마레사에 있는 세밧 골짜기에서
  lexicon: HALOT
  rationale: 지명은 음역하되, לְמָרֵשָׁה를 장소 표지로 자연스럽게 처리하기 위해 ‘곁’을 사용해 ‘at/near Mareshah’의 관계를 간결하게 드러냈습니다.
theological_decisions:
- issue: 전투 전개를 서술하는 문장의 인물 관계 표현
  chosen_reading: ‘그 앞에 나가고’로 두어 히브리어의 직역성을 유지하면서도, 문맥상 대치의 의미를 본문에 단정적으로 덧붙이지 않았습니다.
  alternative_readings:
  - ‘그를 맞으러 나가고’
  - ‘그를 대적하여 나가고’
  rationale: 본문은 실제로 ‘before him’이라고 말하므로, 대면의 함의는 인정하되 해석을 본문화하지 않는 것이 더 투명합니다.
  doctrine_reference: 본문해석의 절제와 문맥 우선 원칙
- issue: 전투 묘사에서 관용구의 한국어화
  chosen_reading: ‘전투 대형을 갖추었습니다’로 옮겨 고대 히브리어 군사 관용을 현대 독자가 이해할 수 있게 했습니다.
  alternative_readings:
  - ‘전열을 갖추었습니다’
  - ‘전투를 준비했습니다’
  rationale: 전투 행위의 실제 배열을 드러내는 것이 본문의 서사적 긴장을 더 잘 보존합니다.
  doctrine_reference: 서사문체의 명료성
