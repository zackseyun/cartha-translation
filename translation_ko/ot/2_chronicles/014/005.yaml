source:
  edition: WLC
  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
  footnotes:
  - marker: a
    text: Or 'there was no war with him.' The Hebrew idiom can be understood more generally as the absence of warfare involving Asa.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 유다에 견고한 도시들을 세웠습니다[a]. 그 땅이 평온했고, 그 여러 해 동안 그와 전쟁이 없었기 때문입니다. 야훼께서 그에게 안식을 주셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그와 전쟁이 없었다.” 이 히브리어 관용구는 아사를 둘러싼 전쟁이 없었다는 더 일반적인 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: He built
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 건축했습니다
  - 지었습니다
  lexicon: HALOT
  rationale: 도시를 세우는 행위라는 문맥에 맞게 자연스러운 과거 서술로 옮겼습니다.
- source_word: עָרֵי מְצוּרָה
  english_pob_choice: fortified cities
  chosen_korean: 견고한 도시들
  alternatives_korean:
  - 요새 도시들
  - 성곽 도시들
  lexicon: HALOT
  rationale: 도시가 방어를 위해 강화되었다는 뜻을 살리되, 현대 한국어에서 지나치게 군사적인 느낌보다 본문의 기능을 드러내는 표현으로 옮겼습니다.
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  english_pob_choice: there was no war with him
  chosen_korean: 그와 전쟁이 없었기 때문입니다
  alternatives_korean:
  - 그를 향한 전쟁이 없었기 때문입니다
  - 그에게 전쟁이 없었기 때문입니다
  lexicon: HALOT
  rationale: POB의 문맥상 ‘그와 전쟁이 없었다’는 관용적 의미를 한국어로 자연스럽게 살렸고, 전쟁의 부재가 아사 주변의 안정을 뜻한다는 점을 보존했습니다.
- source_word: הֵנִיחַ יְהוָה לֽ/וֹ
  english_pob_choice: Yahweh gave him rest
  chosen_korean: 야훼께서 그에게 안식을 주셨기 때문입니다
  alternatives_korean:
  - 야훼께서 그에게 평안을 주셨기 때문입니다
  - 야훼께서 그에게 쉬게 하셨기 때문입니다
  lexicon: HALOT
  rationale: הֵנִיחַ의 ‘쉬게 하다/안식 주다’ 의미를 살려, 단순한 평안보다 하나님이 주시는 안식이라는 신학적 뉘앙스를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 여호와 이름은 POB 기준에 따라 титular ‘주’가 아니라 고유명사 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 언약 სახელ로서의 신적 고유명을 직접 사용하므로, 이를 가리는 호칭보다 음역을 통해 드러내는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 전쟁 부재 표현의 방향성
  chosen_reading: 그와 전쟁이 없었기 때문입니다
  alternative_readings:
  - 그와 함께 전쟁이 없었기 때문입니다
  - 그에게 전쟁이 없었기 때문입니다
  rationale: 히브리어 관용구는 아사를 둘러싼 전쟁 상황의 부재를 뜻하므로, 한국어도 그 의미를 자연스럽게 드러내되 의미를 과도하게 좁히지 않았습니다.
  doctrine_reference: POB lexical audit on וְאֵין עִמּוֹ מִלְחָמָה
