  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ עִם אֲחֵי/כֶ֗ם שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵֽ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּשְׁמְעוּ֙ אֶת דִּבְרֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֖בוּ מִ/לֶּ֥כֶת אֶל יָרָבְעָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
  footnotes:
  - marker: a
    text: Or 'for this matter is from me.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your brothers,' emphasizing that those opposed are fellow Israelites.
    reason: cultural_note
  - marker: c
    text: Or 'turned back from going to Jeroboam'; in context the movement is toward armed conflict, hence 'against Jeroboam.'
    reason: alternative_reading
translation:
  language: ko
  text: 「야훼께서 이렇게 말씀하십니다. ‘너희는 올라가지[a]도 말고 너희 형제[b]와 싸우지도 마십시오. 각자 자기 집으로 돌아가십시오. 이 일은 나에게서 비롯된 것입니다.’」 그들은 야훼의 말씀을 듣고 여로보암에게 가는 것을 그만두고 돌아섰습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘올라가다’는 군사적 진군을 가리킬 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘형제’는 대적하는 이들이 같은 이스라엘 백성임을 강조합니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘여로보암에게 가는 것을 그만두고’입니다. 군사 문맥에서는 여로보암을 향한 적대적 진군을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이렇게 말씀하시기를
  - 야훼께서 이처럼 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전달 공식의 격식을 살리면서도 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  english_pob_choice: You must not go up or fight
  chosen_korean: 너희는 올라가서도 안 되고, 너희 형제와 싸워서도 안 됩니다
  alternatives_korean:
  - 올라가지 마십시오, 그리고 싸우지 마십시오
  - 올라가거나 싸우면 안 됩니다
  lexicon: HALOT
  rationale: ‘올라가다’는 히브리어의 군사적 관용구를 보존하고, ‘싸우다’로 전투 금지를 분명히 했습니다.
- source_word: עִם אֲחֵיכֶם
  english_pob_choice: against your brothers
  chosen_korean: 너희 형제와
  alternatives_korean:
  - 너희 형제에게
  - 너희 친족과
  lexicon: HALOT
  rationale: 직역상 ‘with’이지만 문맥상 적대 행위를 막는 뜻이므로 ‘형제’ 관계를 살리되 본문 이해를 돕기 위해 ‘싸워서도’와 함께 자연스럽게 구성했습니다.
- source_word: מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  english_pob_choice: for this thing has come from me
  chosen_korean: 이 일은 나에게서 나온 것이기 때문입니다
  alternatives_korean:
  - 이 일이 내게서 비롯되었기 때문입니다
  - 이 사건은 내게서 온 것이기 때문입니다
  lexicon: HALOT
  rationale: 하나님께서 이 상황의 원인과 주권을 가지신다는 점을 보존하면서, 한국어로는 ‘나에게서 나온 것’이 가장 직접적이고 자연스럽습니다.
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  english_pob_choice: So they listened to the words of Yahweh
  chosen_korean: 그들은 야훼의 말씀을 듣고
  alternatives_korean:
  - 그들은 야훼의 말씀에 순종하고
  - 그들은 야훼의 말씀을 들었습니다
  lexicon: HALOT
  rationale: שׁמע의 ‘듣다/듣고 따르다’의 폭을 살리되, 뒤따르는 행동으로 순응을 드러내어 과도한 해석을 피했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 신적 이름을 가리지 않고 드러내며, 본문이 야훼의 직접 발화임을 분명히 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 군사적 행위에 대한 금지와 형제 관계의 강조
  chosen_reading: 너희 형제와 싸워서도 안 됩니다
  alternative_readings:
  - 너희 형제와 전쟁해서도 안 됩니다
  - 너희 형제에게 올라가서도 안 됩니다
  rationale: ‘형제’는 북이스라엘 지파들의 동족성을 강조하며, 본문이 내전이 아니라 형제 간 무력 충돌을 금하는 장면임을 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
