reference: 2 Chronicles 11:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
  footnotes:
  - marker: a
    text: Or possibly 'descendant of Absalom'; Hebrew 'daughter' can sometimes be used more broadly in genealogical contexts.
    reason: alternative_reading
translation:
  language: ko
  text: 르호보암은 압살롬의 딸 마아가[a]를 그의 모든 아내와 첩들보다 더 사랑했습니다. 그는 아내 열여덟 명과 첩 예순 명을 맞아들였고, 아들 스물여덟 명과 딸 예순 명을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘압살롬의 후손’일 수 있습니다. 히브리어 ‘딸’은 계보 문맥에서 더 넓게 쓰일 때가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  english_pob_choice: loved
  chosen_korean: 더 사랑했습니다
  alternatives_korean:
  - 사랑했습니다
  - 좋아했습니다
  lexicon: HALOT
  rationale: אהב의 기본 의미는 사랑하다이므로 이를 살리되, 뒤의 비교 표현을 반영해 ‘더 사랑했습니다’로 자연스럽게 옮겼습니다.
- source_word: בַת אַבְשָׁלוֹם
  english_pob_choice: the daughter of Absalom
  chosen_korean: 압살롬의 딸
  alternatives_korean:
  - 압살롬의 후손
  - 압살롬의 손녀
  lexicon: HALOT
  rationale: בַת은 기본적으로 ‘딸’이므로 본문은 직역을 유지했고, 계보적 확장 가능성은 주석으로 처리하는 편이 원문에 가깝습니다.
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  english_pob_choice: more than all his wives and his concubines
  chosen_korean: 그의 모든 아내와 첩들보다 더
  alternatives_korean:
  - 그의 모든 아내와 첩보다
  - 그의 모든 아내와 후궁들보다 더
  lexicon: HALOT
  rationale: מִכָּל의 비교 의미를 드러내어 ‘보다 더’로 옮겼고, פִּילַגְשִׁים은 사회적 구분을 유지하기 위해 ‘첩들’로 렌더링했습니다.
- source_word: נָשָׂא ... פִילַגְשִׁים
  english_pob_choice: he had taken eighteen wives ... sixty concubines
  chosen_korean: 아내 열여덟 명과 첩 예순 명을 두었고
  alternatives_korean:
  - 아내 열여덟 명과 첩 예순 명을 맞아들였고
  - 아내 열여덟 명과 첩 예순 명을 취했고
  lexicon: HALOT
  rationale: נשא는 부인/아내를 ‘취하다, 맞아들이다’의 관용이 있지만, 현대 한국어에서는 ‘두었고’가 가장 자연스럽고 수량 정보도 잘 살립니다.
- source_word: וַיּוֹלֶד
  english_pob_choice: he fathered
  chosen_korean: 아들 스물여덟 명과 딸 예순 명을 낳았습니다
  alternatives_korean:
  - 아들 스물여덟 명과 딸 예순 명을 두었습니다
  - 아들 스물여덟 명과 딸 예순 명의 아버지가 되었습니다
  lexicon: HALOT
  rationale: 남성 주어의 ילד는 ‘낳다/낳았습니다’가 자연스럽고, ‘fathered’의 생식·부성 의미를 충분히 전달합니다.
theological_decisions:
- issue: 마아가의 족보 표지 ‘압살롬의 딸’의 처리
  chosen_reading: 본문은 그대로 ‘압살롬의 딸’로 유지했습니다.
  alternative_readings:
  - 압살롬의 후손으로 이해
  - 압살롬의 손녀로 이해
  rationale: 계보적 용례 가능성은 있으나, 본문 차원에서는 히브리어 표현을 과잉해석하지 않고 직역을 유지하는 것이 원문 가시성을 높입니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
