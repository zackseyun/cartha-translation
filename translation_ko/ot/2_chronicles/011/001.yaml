source:
  edition: WLC
  text: וַ/יָּבֹ֣א רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת בֵּ֨ית יְהוּדָ֜ה וּ/בִנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמוֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם יִשְׂרָאֵ֔ל לְ/הָשִׁ֥יב אֶת הַ/מַּמְלָכָ֖ה לִ/רְחַבְעָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
  footnotes:
  - marker: a
    text: Or 'Judah and Benjamin'; Hebrew 'the house of Judah and Benjamin,' a corporate designation for the southern kingdom.
    reason: lexical_alternative
  - marker: b
    text: Or 'one hundred eighty thousand select men fit for war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 르호보암이 예루살렘에 와서 유다 집과 베냐민[a], 곧 전쟁을 할 수 있는 정예 용사 십팔만 명[b]을 모아 이스라엘과 싸워 왕국을 르호보암에게 되돌리려 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유다와 베냐민”. 히브리어 “유다 집과 베냐민”은 남왕국을 가리키는 공동체적 명칭입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “전쟁에 적합한 택한 사람들”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 이르러
  alternatives_korean:
  - 왔습니다
  - 도착하였습니다
  lexicon: BDB
  rationale: הלך/בוא 계열의 서술을 현대 한국어의 자연스러운 이동 완료 표현으로 옮기되, 문맥상 예루살렘 ‘도착’을 분명히 보여 주는 ‘이르러’를 택했습니다.
- source_word: אֶת בֵּית יְהוּדָה וּבִנְיָמִן
  english_pob_choice: the house of Judah and Benjamin
  chosen_korean: 유다 집과 베냐민
  alternatives_korean:
  - 유다와 베냐민
  - 유다 집과 베냐민 집
  lexicon: BDB
  rationale: ‘집’(בֵּית)은 단순한 혈연이 아니라 정치적·공동체적 실체를 가리키므로, POB의 ‘house’를 살리되 베냐민에는 반복을 피하고 한국어 어순을 자연스럽게 했습니다.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  english_pob_choice: chosen warriors
  chosen_korean: 전쟁에 능한 택한 용사
  alternatives_korean:
  - 전쟁에 적합한 택한 사람들
  - 택한 전사들
  lexicon: BDB
  rationale: בָּחוּר는 ‘젊은’보다 군사적으로 ‘뽑힌/택한’ 뉘앙스가 강하고, עֹשֵׂה מִלְחָמָה는 직역보다 군사적 기능을 드러내는 표현이 적절해 ‘전쟁에 능한 택한 용사’로 옮겼습니다.
- source_word: לְ/הִלָּחֵם עִם יִשְׂרָאֵל לְ/הָשִׁיב
  english_pob_choice: to fight against Israel ... to restore
  chosen_korean: 이스라엘과 싸워 ... 나라를 ... 되돌리려
  alternatives_korean:
  - 이스라엘과 싸워 ... 왕국을 회복하려
  - 이스라엘에 맞서 싸워 ... 왕국을 되돌리려
  lexicon: BDB
  rationale: עִם은 적대적 문맥에서 ‘~과 함께’가 아니라 ‘~과 싸워/맞서’의 뜻이므로 이를 살렸고, לְהָשִׁיב은 ‘회복’보다 왕권이 본래 소유자에게 돌아감을 드러내는 ‘되돌리다’로 옮겼습니다.
theological_decisions:
- issue: 남왕국을 가리키는 ‘유다 집’의 공동체적 의미
  chosen_reading: ‘유다 집’으로 직역해 왕조·지파 연합체를 함께 드러냈습니다.
  alternative_readings:
  - 유다와 베냐민
  - 유다 사람들
  rationale: 히브리어는 단순 지리명이 아니라 정치적 실체를 나타내므로, ‘집’을 유지하는 편이 본문이 말하는 남왕국의 집단성을 더 정확히 전달합니다.
  doctrine_reference: 역대기의 역사서술상 남북 분열 이후의 정치적 공동체 표지
