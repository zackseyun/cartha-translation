base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
  footnotes:
  - marker: a
    text: Or 'fortresses' or 'strongholds' for 'fortified places.'
    reason: lexical_alternative
  - marker: b
    text: Or 'leaders,' 'rulers,' or 'officers' for 'commanders.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term can refer either to 'storehouses' or to stored supplies; here the sense is provisions kept in reserve.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 요새들을 견고하게 하고 그 안에 지휘관들을 두었으며, 식량과 기름과 포도주도 비축해 두었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요새들’에 해당하는 히브리어는 요새화된 곳들, 성채들, 또는 견고한 거점들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지휘관들’에 해당하는 히브리어는 지도자들, 통치자들, 또는 관리들을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘비축해 두었습니다’에 해당하는 히브리어는 저장고들을 뜻할 수도 있고 저장된 보급품을 뜻할 수도 있습니다. 여기서는 뒤따르는 식량·기름·포도주와의 관계상 비축 물자의 뜻으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  english_pob_choice: He strengthened
  chosen_korean: 견고하게 하고
  alternatives_korean:
  - 강하게 하고
  - 강화하고
  - 튼튼하게 하고
  lexicon: HALOT
  rationale: חזק의 피엘형은 ‘강하게 하다/견고하게 하다’의 뜻이므로, 성벽 자체를 ‘요새화했다’는 뉘앙스를 살리되 한국어에서는 자연스럽게 동작을 표현했습니다.
- source_word: הַמְּצֻרוֹת
  english_pob_choice: the fortified places
  chosen_korean: 요새들
  alternatives_korean:
  - 요새화된 곳들
  - 성채들
  - 견고한 곳들
  lexicon: HALOT
  rationale: 문맥상 군사적 방어 거점이므로 ‘요새들’이 가장 간결하고 자연스럽습니다. POB의 넓은 표현인 ‘fortified places’는 한국어에서 과도하게 풀지 않고도 요새 의미를 전달합니다.
- source_word: נְגִידִים
  english_pob_choice: commanders
  chosen_korean: 지휘관들
  alternatives_korean:
  - 지도자들
  - 통치자들
  - 관리들
  - 사령관들
  lexicon: HALOT
  rationale: 요새에 배치된 인물을 가리키므로 군사적 기능이 드러나는 ‘지휘관들’이 적절합니다. ‘지도자들/통치자들’은 너무 일반적입니다.
- source_word: וְאֹצְרוֹת מַאֲכָל וְשֶׁמֶן וָיָיִן
  english_pob_choice: stores of food, oil, and wine
  chosen_korean: 식량과 기름과 포도주의 저장품
  alternatives_korean:
  - 식량과 기름과 포도주의 저장고
  - 식량과 기름과 포도주의 비축품
  - 식량, 기름, 포도주의 창고
  lexicon: HALOT
  rationale: אֹצְרוֹת는 ‘창고’일 수도 있지만 여기서는 저장된 물자를 가리키는 뜻이 더 자연스러워 ‘저장품’으로 옮겼습니다. POB의 ‘stores of’와 같이 보급품의 비축 상태를 드러냅니다.
