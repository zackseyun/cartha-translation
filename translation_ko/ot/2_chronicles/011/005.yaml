    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 살았고
  alternatives_korean:
  - 거주했고
  - 머물렀고
  - 살았습니다
  lexicon: HALOT
  rationale: ישב의 기본 의미인 ‘살다/거주하다’를 자연스러운 현대 한국어로 옮겼습니다. ‘거주하다’보다 덜 관료적이고, 본문의 서술 흐름에 맞습니다.
- source_word: וַיִּבֶן
  english_pob_choice: built
  chosen_korean: 건축했습니다
  alternatives_korean:
  - 지었습니다
  - 세웠습니다
  - 건설했습니다
  lexicon: HALOT
  rationale: בנה는 기본적으로 ‘짓다, 건축하다’이므로, 성읍들을 새로 세운 행위를 분명히 드러내는 표현을 택했습니다.
- source_word: לְמָצוֹר
  english_pob_choice: for defense
  chosen_korean: 방어를 위한
  alternatives_korean:
  - 요새로서의
  - 요새화된
  - 수비용의
  lexicon: HALOT
  rationale: מָצוֹר의 기능적 의미를 살려 ‘방어를 위한’으로 옮겼습니다. 영어 POB의 주석이 지적하듯 단순히 ‘요새들’로 못 박기보다 목적을 드러내는 번역이 원문에 더 가깝습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘[a]에
  alternatives_korean:
  - 예루살렘에
  - 예루살렘 안에
  lexicon: HALOT
  rationale: 지명은 통상 표기를 따랐고, 영어 POB의 각주 표지를 한국어 본문에도 대응시켰습니다.
theological_decisions:
- issue: לְמָצוֹר의 군사적 기능을 어떻게 드러낼지
  chosen_reading: 성읍들을 ‘방어를 위한’ 것으로 옮겨, 본문이 도시 건설 자체보다 방어 목적을 강조함을 드러냈습니다.
  alternative_readings:
  - ‘요새 성읍들’
  - ‘요새화된 성읍들’
  rationale: 히브리어는 도시의 용도를 말하며, 사전적으로 가능한 ‘fortified’ 계열은 결과를 압축하지만 목적어미 לְ의 기능을 충분히 보여 주지 못할 수 있습니다. 그래서 목적을 직접 드러내는 표현을 택했습니다.
  doctrine_reference: 역대기서의 왕권·방어 서술
- issue: 본문의 서술 시제와 문체
  chosen_reading: 과거 서술을 현대 한국어 합쇼체로 유지했습니다.
  alternative_readings:
  - 문어적 ‘거하였고’
  - 더 간결한 ‘살며’
  rationale: 본문의 연속 서술을 자연스럽게 살리되, 성경 본문으로서의 격식을 유지하기 위해 합쇼체 과거형을 사용했습니다.
  doctrine_reference: 번역 문체 원칙
