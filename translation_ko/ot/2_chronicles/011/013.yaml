    issue: ‘그와 함께 서기로 했습니다’
    rationale: ‘서기로 했다’는 결심 또는 미래 행동을 뜻하지만, 히브리어 완료형은 제사장들과 레위 사람들이 실제로 취한 행동을 서술합니다.
  - severity: medium
    issue: ‘자기들의 모든 영역에서’
    rationale: גְּבוּלָם은 여기서 추상적인 ‘영역’보다 그들이 흩어져 있던 지역·영토를 가리킵니다. 또한 ‘에서’만으로는 그 지역들로부터 그에게 나아온 방향성이 충분히 드러나지 않습니다.
  - severity: medium
    issue: 각주의 ‘그에게 자신을 드러냈다’
    rationale: 이는 히브리어 동사의 통상적 의미 범위를 부정확하게 옮깁니다. 물리적 대안은 ‘그에게로 나아갔다’ 또는 ‘그 앞에 섰다’가 적절합니다.
