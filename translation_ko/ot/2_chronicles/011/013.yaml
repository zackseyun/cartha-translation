  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
  footnotes:
  - marker: a
    text: Or 'presented themselves to him' or 'stood before him.' The Hebrew idiom may denote either physical appearance before Rehoboam or taking his side; the context favors loyal alignment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 온 이스라엘에 있던 제사장들과 레위 사람들은 자기들의 모든 지역에서 그에게로 나아가 그의 편에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게로 나아갔다’, ‘그 앞에 섰다’. 이 히브리어 표현은 르호보암 앞에 실제로 나아갔다는 뜻일 수도 있고, 그의 편에 섰다는 뜻일 수도 있으나, 문맥은 충성스러운 지지를 더 잘 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים
  english_pob_choice: And the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 그리고 제사장들
  - 제사장들과
  lexicon: HALOT
  rationale: 히브리어 정관사와 접속사의 연결을 한국어에서는 문맥상 자연스럽게 풀어 '그리고'를 앞에 두고, 직분 명칭은 표준적인 '제사장들'로 옮겼습니다.
- source_word: וְהַלְוִיִּם
  english_pob_choice: and the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 사람들
  lexicon: HALOT
  rationale: ‘레위 사람들’은 직분 집단을 가리키되 한국어에서 지나치게 교회직분처럼 굳히지 않고 원어의 민족·계보적 범주를 드러냅니다.
- source_word: הִתְיַצְּבוּ עָלָיו
  english_pob_choice: took their stand with him
  chosen_korean: 그와 함께 서기로 했습니다
  alternatives_korean:
  - 그와 함께 섰습니다
  - 그 편에 서기로 했습니다
  - 그에게 충성을 보였습니다
  lexicon: HALOT
  rationale: 히트파엘 동사의 ‘자기 입장을 정하다/서다’는 뉘앙스와 עליו의 지지·동조 의미를 함께 살려, 단순한 ‘나아가다’보다 ‘그와 함께 서다’로 옮겼습니다.
- source_word: מִכָּל גְּבוּלָם
  english_pob_choice: from all their territories
  chosen_korean: 자기들의 모든 영역에서
  alternatives_korean:
  - 자기들의 모든 경계에서
  - 자기들의 모든 지역에서
  - 자기들의 모든 땅에서
  lexicon: HALOT
  rationale: גְּבוּל은 여기서 ‘경계선’보다 거주 구역·관할지를 가리키므로, 현대 한국어에서 자연스럽고 포괄적인 ‘영역’으로 옮겼습니다.
theological_decisions:
- issue: עָלָיו의 의미가 단순한 물리적 접근인지, 정치적·신학적 지지인지
  chosen_reading: 문맥상 르호보암 편에 서는 충성의 표시로 읽었습니다.
  alternative_readings:
  - 그에게 단순히 나타났다
  - 그 앞에 섰다
  rationale: 열왕기/역대기 문맥에서 이 동사는 중립적 출현보다 지지·동조를 암시하며, 영어 POB도 그 의미를 반영해 ‘with him’으로 처리했습니다.
  doctrine_reference: 문맥-역사적 해석
