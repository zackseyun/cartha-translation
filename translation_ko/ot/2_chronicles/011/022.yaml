source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד לָ/רֹ֧אשׁ רְחַבְעָ֛ם אֶת אֲבִיָּ֥ה בֶֽן מַעֲכָ֖ה לְ/נָגִ֣יד בְּ/אֶחָ֑י/ו כִּ֖י לְ/הַמְלִיכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/022.yaml
  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
  footnotes:
  - marker: a
    text: Or 'over his brothers' for 'among his brothers'; the Hebrew preposition can be understood to mark his precedence in relation to them.
    reason: lexical_alternative
translation:
  language: ko
  text: 류호보암은 자기 형제들 가운데서 아비야를 두목으로 세웠습니다. 이는 그를 왕으로 삼으려 했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘형제들 위에’로도 옮길 수 있습니다. 히브리어 전치사 ב는 그들 사이의 우선적 지위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  english_pob_choice: appointed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 임용했습니다
  - 배치했습니다
  lexicon: HALOT
  rationale: 히필형 עמד는 ‘서게 하다’에서 나아가 어떤 지위에 두는 행정을 뜻하므로, 여기서는 자연스러운 현대 한국어인 ‘세우다’가 적절합니다.
- source_word: לָרֹאשׁ / לְנָגִיד
  english_pob_choice: as chief
  chosen_korean: 두목으로
  alternatives_korean:
  - 우두머리로
  - 지도자로
  - 책임자로
  lexicon: HALOT
  rationale: רֹאשׁ과 נָגִיד은 단순한 직함보다 우선권과 대표성을 함께 가리키므로, ‘두목’이 본문의 우두머리적 지위를 간결하게 드러냅니다.
- source_word: בְּאֶחָיו
  english_pob_choice: among his brothers
  chosen_korean: 자기 형제들 가운데서
  alternatives_korean:
  - 형제들 위에
  - 형제들 사이에서
  - 형제들 가운데
  lexicon: HALOT
  rationale: 전치사 ב는 ‘~가운데’라는 소속적 관계로 읽을 수 있으므로, 지배를 단정하는 표현보다 ‘가운데서’가 더 조심스럽습니다.
- source_word: לְהַמְלִיכוֹ
  english_pob_choice: he intended to make him king
  chosen_korean: 그를 왕으로 삼으려 했기 때문입니다
  alternatives_korean:
  - 그를 왕이 되게 하려 했기 때문입니다
  - 그를 왕으로 세우려 했기 때문입니다
  - 그를 통치하게 하려 했기 때문입니다
  lexicon: HALOT
  rationale: 목적을 나타내는 부정사구를 한국어 목적절로 옮기되, ‘왕으로 삼다’가 가장 자연스럽게 임의적 의도를 전달합니다.
