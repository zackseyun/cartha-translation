source:
  edition: WLC
  text: וְ/אַחֲרֶ֣י/הָ לָקַ֔ח אֶֽת מַעֲכָ֖ה בַּת אַבְשָׁל֑וֹם וַ/תֵּ֣לֶד ל֗/וֹ אֶת אֲבִיָּה֙ וְ/אֶת עַתַּ֔י וְ/אֶת זִיזָ֖א וְ/אֶת שְׁלֹמִֽית־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
  footnotes:
  - marker: a
    text: Hebrew 'daughter of Absalom'; the term can sometimes denote a more remote female descendant, so some understand 'granddaughter of Absalom.'
    reason: alternative_reading
translation:
  language: ko
  text: 그 뒤에 그는 압살롬의 딸 마아가를 아내로 맞아들였고, 마아가는 그에게 아비야와 앗대와 지자와 슬로밋을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘압살롬의 딸’은 더 먼 후손을 가리킬 수도 있으므로, 일부는 이를 ‘압살롬의 손녀’로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  english_pob_choice: After her
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 후에
  - 그 뒤로
  lexicon: HALOT
  rationale: 앞절의 아내를 가리키는 ‘after her’를 한국어에서는 자연스럽게 시간 전개로 풀어 ‘그 뒤에’로 옮겼습니다.
- source_word: לָקַח
  english_pob_choice: he took
  chosen_korean: 맞아들였고
  alternatives_korean:
  - 데려왔고
  - 취하였고
  - 결혼하였고
  lexicon: HALOT
  rationale: 결혼 문맥의 ‘take’는 단순한 이동이 아니라 아내로 삼는 행위를 뜻하므로, 직역을 유지하면서도 혼인 의미가 드러나는 ‘맞아들이다’를 택했습니다.
- source_word: בַּת אַבְשָׁלוֹם
  english_pob_choice: the daughter of Absalom
  chosen_korean: 압살롬의 딸
  alternatives_korean:
  - 압살롬의 손녀
  - 압살롬의 후손
  lexicon: HALOT
  rationale: 히브리어 본문은 분명히 ‘딸’이라고 말하므로 본문 어휘를 그대로 살렸고, 더 넓은 친족 가능성은 본문 밖 해석으로 남겼습니다.
- source_word: וַתֵּלֶד לוֹ
  english_pob_choice: and she bore him
  chosen_korean: 그녀가 …을 낳았습니다
  alternatives_korean:
  - 그에게 …을 낳았습니다
  - 그를 위하여 …을 낳았습니다
  lexicon: HALOT
  rationale: ‘낳다’가 ילד의 표준적인 출산 표현이므로 이를 사용했고, 목적어 ‘לוֹ’는 한국어에서 자연스러운 ‘그녀가 …을 낳았습니다’로 처리했습니다.
theological_decisions:
- issue: 압살롬의 ‘딸’이라는 족보적 표현
  chosen_reading: 본문의 ‘압살롬의 딸’을 그대로 유지합니다.
  alternative_readings:
  - 압살롬의 손녀
  - 압살롬의 후손
  rationale: 이 구절은 교리 문제가 아니라 족보/친족 범주의 문제이므로, 본문이 직접 말하는 표현을 보존해 독자가 원문 긴장을 확인할 수 있게 했습니다.
  doctrine_reference: 번역 원칙 §1, §3
