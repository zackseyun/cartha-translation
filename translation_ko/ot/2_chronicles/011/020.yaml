revisions:
- from: 그 뒤에 그는 마아가 곧 압살롬의 딸을 맞아들였고, 그녀가 아비야와 앗대와 지자와 슬로밋을 낳았습니다.[a]
  to: 그 뒤에 그는 압살롬의 딸 마아가를 아내로 맞아들였고, 마아가는 그에게 아비야와 앗대와 지자와 슬로밋을 낳았습니다.[a]
  rationale: 본문의 족보상 표현을 ‘딸’로 그대로 보존하고, 혼인 문맥의 לָקַח은 자연스러운 한국어로 ‘아내로 맞아들였다’고 옮겼습니다. 동격 어순을 바로잡고, לוֹ가 나타내는 관계를 ‘그에게’로 드러내어 원문의 뜻을 분명히 했습니다. 각주는 본문에서 해결하지 않은 친족 범위의 가능성만 간결하게 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:16:46Z'
