  source_fidelity: 히브리어의 두 피엘 동사(חזק, אמץ), 두 차례의 ‘삼 년 동안’, 그리고 ‘다윗과 솔로몬의 길’이라는 비유를 모두 보존해야 합니다. 초안은 대체로 충실하나, 두 동사를 모두 ‘굳게 하다’로 옮겨 르호보암을 목적어로 하는 두 번째 표현이 현대 한국어에서 다소 부자연스럽습니다.
  naturalness: ‘유다 왕국을 굳게 세우고’와 ‘르호보암을 … 굳세게 하였습니다’는 각각 정치 공동체와 인물에 자연스럽게 결합하며, 현대의 격식 있는 합쇼체 문체를 유지합니다. 인과절도 ‘이는’보다 독립 문장인 ‘… 때문입니다’가 더 자연스럽습니다.
  terminology: ‘유다 왕국’, ‘솔로몬의 아들 르호보암’, ‘다윗과 솔로몬의 길’은 적절합니다. ‘길’은 행실의 관용적 비유를 해설 없이 보존합니다.
  issues:
