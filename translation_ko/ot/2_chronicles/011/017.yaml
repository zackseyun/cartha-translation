  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
  footnotes:
  - marker: a
    text: Or 'strengthened Rehoboam.' The Hebrew verb can be rendered similarly to the previous verb, but the wording here is varied in English to avoid unnecessary repetition while preserving the sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그들은 유다의 왕국을 굳게 하고, 솔로몬의 아들 르호보암을 삼 년 동안 굳게 하였습니다. 이는 그들이 다윗과 솔로몬의 길로 삼 년 동안 걸었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “르호보암을 굳게 하였다”. 히브리어 동사는 앞의 동사와 비슷하게 옮길 수 있지만, 영어 POB는 불필요한 반복을 피하면서 의미를 보존하려고 표현을 달리했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  english_pob_choice: they strengthened
  chosen_korean: 굳게 하였습니다
  alternatives_korean:
  - 강하게 하였습니다
  - 견고하게 하였습니다
  - 강화하였습니다
  lexicon: HALOT
  rationale: חזק의 피엘은 ‘강하게 하다, 견고하게 하다, 굳게 하다’의 뜻이므로, 문맥의 정치적 안정과 자연스러운 현대 한국어를 함께 살려 ‘굳게 하였습니다’로 옮겼습니다.
- source_word: מַלְכוּת יְהוּדָה
  english_pob_choice: the kingdom of Judah
  chosen_korean: 유다의 왕국
  alternatives_korean:
  - 유다 왕국
  - 유다의 나라
  - 유다의 통치
  lexicon: HALOT
  rationale: 여기서는 추상적 ‘왕권’보다 정치 실체를 가리키므로 ‘왕국’이 적절하며, 소유 관계를 자연스럽게 드러내기 위해 ‘유다의 왕국’으로 옮겼습니다.
- source_word: וַיְאַמְּצוּ
  english_pob_choice: strengthened
  chosen_korean: 굳게 하였습니다
  alternatives_korean:
  - 강하게 하였습니다
  - 격려하였습니다
  - 지지하였습니다
  lexicon: HALOT
  rationale: אמץ의 피엘도 ‘강하게 하다/굳세게 하다’의 의미이므로 앞의 חזק과 어휘상 겹치지만, 본문이 의도적으로 반복하는 강화의 의미를 한국어에서도 유지했습니다.
- source_word: לְשָׁנִים שָׁלוֹשׁ
  english_pob_choice: for three years
  chosen_korean: 삼 년 동안
  alternatives_korean:
  - 세 해 동안
  - 세 해 동안에
  lexicon: HALOT
  rationale: 지속 기간을 나타내는 ל 표현은 한국어에서 ‘~동안’이 가장 자연스럽습니다.
- source_word: בְּדֶרֶךְ דָּוִיד וּשְׁלֹמֹה
  english_pob_choice: in the way of David and Solomon
  chosen_korean: 다윗과 솔로몬의 길
  alternatives_korean:
  - 다윗과 솔로몬의 방식
  - 다윗과 솔로몬의 길을
  lexicon: HALOT
  rationale: 관용구 ‘~의 길’은 행위와 삶의 방식 전체를 가리키는 성경적 표현이므로, 이를 풀어 쓰지 않고 그대로 살렸습니다.
theological_decisions:
- issue: 반복된 ‘삼 년’과 ‘길’ 표현의 해석 범위
  chosen_reading: 이 구절은 특정한 세 해의 기간 동안 그들이 다윗과 솔로몬의 길을 걸었다는 역사적 평가를 말하며, 그 이상으로 포괄적 윤리 평가를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘다윗과 솔로몬처럼 온전히 여호와께 충성했다’로 확장해 번역하기
  rationale: 본문은 한정된 기간에 대한 진술이므로, 긍정적 평가를 유지하되 본문이 말하지 않는 포괄적 신학적 해석은 덧붙이지 않는 것이 적절합니다.
  doctrine_reference: translation philosophy items 1 and 3
