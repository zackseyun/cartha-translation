- from: 그리하여 그들은 유다의 왕국을 굳게 하고, 솔로몬의 아들 르호보암을 삼 년 동안 굳게 하였습니다. 이는 그들이 다윗과 솔로몬의 길로 삼 년 동안 걸었기 때문입니다.[a]
  to: 그리하여 그들은 유다 왕국을 굳게 세우고, 솔로몬의 아들 르호보암을 삼 년 동안 굳세게 하였습니다. 그들이 삼 년 동안 다윗과 솔로몬의 길을 걸었기 때문입니다.
