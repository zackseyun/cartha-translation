    rationale: ‘유다와 베냐민의 모든 지역’과 ‘모든 견고한 성읍’은 단순한 동격이라기보다 전 지역에 걸친 성읍별 배치를 나타내는 연속 표현입니다. ‘각 견고한 성읍에’로 옮기면 이 관계가 더 충실히 보존됩니다.
