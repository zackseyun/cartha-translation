id: 2CH.11.23
reference: 2 Chronicles 11:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֶן֩ וַ/יִּפְרֹ֨ץ מִ/כָּל בָּנָ֜י/ו לְֽ/כָל אַרְצ֧וֹת יְהוּדָ֣ה וּ/בִנְיָמִ֗ן לְ/כֹל֙ עָרֵ֣י הַ/מְּצֻר֔וֹת וַ/יִּתֵּ֥ן לָ/הֶ֛ם הַ/מָּז֖וֹן לָ/רֹ֑ב וַ/יִּשְׁאַ֖ל הֲמ֥וֹן נָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
  footnotes:
  - marker: a
    text: Or 'He showed understanding' or 'He acted with discernment.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew likely means that he dispersed or stationed some of his sons throughout the fortified cities, not that every son was sent to every location.
    reason: lexical_alternative
  - marker: c
    text: That is, he arranged marriages for his sons; the Hebrew literally says 'and he sought a multitude of wives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 지혜롭게 행동하여 자기 아들들 가운데서 몇을 유다와 베냐민의 온 땅, 곧 모든 견고한 성읍들에 두고, 그들에게 풍성한 양식을 주었으며, 많은 아내를 구해 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘이해하다/분별하다’의 뜻도 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서는 모든 아들을 모든 장소에 보냈다는 뜻이 아니라, 일부를 요새 성읍들에 배치했다는 의미로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘많은 아내들’을 뜻하며, 문맥상 아들들을 위해 혼인을 주선한 것으로 이해됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֶן
  english_pob_choice: He acted wisely
  chosen_korean: 지혜롭게 행동하여
  alternatives_korean:
  - 이해하여
  - 분별 있게 행동하여
  lexicon: HALOT
  rationale: 문맥이 왕의 행정 조치이므로 단순한 ‘이해하다’보다 지혜로운 판단과 행위를 드러내는 표현이 자연스럽습니다.
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  english_pob_choice: distributed some of all his sons
  chosen_korean: 자기 아들들 가운데서 몇을
  alternatives_korean:
  - 자기 아들들을 흩어
  - 자기 아들들을 분산시켜
  lexicon: HALOT
  rationale: מן의 부분적 의미를 살려 ‘몇을’로 옮기고, 문맥상 강제적 흩어짐이 아니라 배치의 뉘앙스가 드러나도록 했습니다.
- source_word: לְכָל אַרְצ֧וֹת יְהוּדָ֣ה וּבִנְיָמִ֗ן לְכֹל עָרֵ֣י הַמְּצֻר֔וֹת
  english_pob_choice: throughout all the lands of Judah and Benjamin, to all the fortified cities
  chosen_korean: 유다와 베냐민의 온 땅, 곧 모든 견고한 성읍들에
  alternatives_korean:
  - 유다와 베냐민의 모든 지방, 곧 모든 요새 성읍들에
  - 유다와 베냐민의 모든 지역, 곧 모든 성채 도시들에
  lexicon: HALOT
  rationale: 아르초트는 행정·지리적 ‘땅/지역’이며, מְצֻרוֹת는 ‘견고한/요새화된 성읍들’이므로 한국어에서도 두 층위를 함께 살렸습니다.
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  english_pob_choice: he gave them abundant provisions
  chosen_korean: 그들에게 풍성한 양식을 주었으며
  alternatives_korean:
  - 그들에게 많은 양식을 주었으며
  - 그들에게 풍족한 식량을 공급하였으며
  lexicon: HALOT
  rationale: מָזוֹן은 식량·양식·공급품의 범위를 가지므로, 군사·행정적 공급의 성격도 담는 ‘양식’으로 옮겼습니다.
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  english_pob_choice: sought many wives for them
  chosen_korean: 많은 아내를 구해 주었습니다
  alternatives_korean:
  - 많은 아내를 구했습니다
  - 많은 아내를 마련해 주었습니다
  lexicon: HALOT
  rationale: שׁאל은 ‘구하다/청하다’의 기본 의미를 가지며, 문맥상 아들들을 위해 혼인을 주선한 뜻이므로 ‘구해 주다’로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 왕의 지혜와 아내 마련이 같은 문장에서 결합된 표현
  chosen_reading: 본문의 행정적 지혜와 가문 확장의 실천을 함께 보존하고, 도덕적 평가는 덧붙이지 않았습니다.
  alternative_readings:
  - 아내를 ‘얻었다’로 완화해 읽기
  - 지혜로운 행위만 강조하고 뒤 문구를 약화해 읽기
  rationale: 히브리어는 두 행위를 나란히 제시할 뿐이므로, 번역도 둘 사이의 긴장을 지우지 않고 그대로 유지하는 것이 स्रोत에 충실합니다.
  doctrine_reference: 본문 충실성 원칙
- issue: וַיִּפְרֹץ의 동사 뉘앙스
  chosen_reading: ‘분산시키다’처럼 비자발적 흩어짐보다, 의도적 배치가 드러나는 표현을 택했습니다.
  alternative_readings:
  - 흩어 놓았다
  - 분산시켰다
  rationale: 영어 POB의 주석이 왕의 의도적 배치를 강조하므로, 한국어도 그 행정적 의도를 보존해야 합니다.
  doctrine_reference: 본문 역사서 서술의 행정적 의도
