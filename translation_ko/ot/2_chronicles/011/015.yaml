  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
  footnotes:
  - marker: a
    text: Or 'satyrs' or 'goats' for 'goat-demons.' The Hebrew term can refer to goat-like beings associated with illicit worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 산당과 염소귀신과 자기가 만든 송아지들을 위하여 자기에게 제사장들을 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사티로스들’, 혹은 ‘염소들’로도 옮길 수 있습니다. 이 히브리어는 염소 같은 형상의 존재나 우상적 존재를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֶד
  english_pob_choice: appointed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 설치했습니다
  lexicon: HALOT
  rationale: 제사장과 함께 쓰인 사역적 동사로, 단순히 서 있게 하기보다 직분을 세우거나 임명하는 뜻을 자연스럽게 드러냅니다.
- source_word: לּוֹ
  english_pob_choice: for himself
  chosen_korean: 자기에게
  alternatives_korean:
  - 자기를 위하여
  - 그를 위하여
  lexicon: HALOT
  rationale: 여로보암이 자기 편익과 자기 주도 아래 제사장들을 세웠다는 점을 한국어에서 간결하게 살립니다.
- source_word: לַבָּמוֹת
  english_pob_choice: for the high places
  chosen_korean: 산당과
  alternatives_korean:
  - 고지의 제단과
  - 높은 곳과
  lexicon: HALOT
  rationale: 한국 성경에서 굳어진 ‘산당’이 고지의 우상 숭배 장소를 가장 직접적으로 전달합니다.
- source_word: לַשְּׂעִירִים
  english_pob_choice: for the goat-demons
  chosen_korean: 염소귀신
  alternatives_korean:
