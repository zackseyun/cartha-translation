  - 염소들
  - 사티로스들
  lexicon: HALOT
  rationale: 문맥상 단순한 염소가 아니라 우상 숭배와 연결된 존재를 가리키므로, 영어 POB의 의도를 따라 ‘귀신’으로 옮겨 어두운 종교적 뉘앙스를 보존합니다.
- source_word: וְלָעֲגָלִים
  english_pob_choice: and for the calves
  chosen_korean: 송아지들을
  alternatives_korean:
  - 송아지 우상들을
  - 송아지들
  lexicon: HALOT
  rationale: 히브리어 자체는 ‘송아지들’이지만, 여기서는 여로보암이 만든 우상들을 가리키므로 문맥상 복수를 유지하면서도 대상이 우상임을 앞뒤 문맥으로 드러냅니다.
theological_decisions:
- issue: שְׂעִירִים의 종교적 성격
  chosen_reading: 염소귀신으로 옮겨, 우상 숭배와 결부된 비정상적 존재를 드러냈습니다.
  alternative_readings:
  - 염소들
  - 사티로스들
  rationale: 본문은 불법적 제의 체계를 나열하므로, 단순 동물 번역은 문맥의 신학적 긴장을 약화시킵니다. ‘염소귀신’은 원문 이미지와 우상 숭배의 어두움을 함께 보존합니다.
  doctrine_reference: 원어 우선 번역 원칙; 문맥이 요구하는 우상 숭배의 신학적 함의를 희석하지 않음
