  source_fidelity: ‘그것들을’은 문법상 바로 앞의 ‘방패와 창’을 가리키는 것으로 읽히기 쉬우나, 히브리어의 접미사는 앞 문맥에서 견고하게 한 성읍들을 가리키는 것이 자연스럽습니다. 또한 וַיְהִי לּוֹ는 여기서 새롭게 ‘되었다’는 변화보다 르호보암에게 유다와 베냐민이 속해 있었다는 귀속 상태를 말합니다.
  naturalness: ‘매우 크게 강화하였습니다’는 한국어에서 무엇을 어떻게 강화했는지가 불분명하고 다소 부자연스럽습니다. ‘그 성읍들을 매우 견고하게 하였습니다’가 문맥과 현대 표준어에 자연스럽습니다.
  terminology: ‘방패’, ‘창’, ‘성읍’, ‘유다’, ‘베냐민’은 적절합니다. 정치적 귀속을 ‘그에게 속해 있었습니다’로 옮겨 소유물처럼 들릴 수 있는 표현을 피하면서 원문의 뜻을 보존했습니다.
