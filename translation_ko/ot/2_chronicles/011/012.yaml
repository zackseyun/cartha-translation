language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בְ/כָל עִ֤יר וָ/עִיר֙ צִנּ֣וֹת וּ/רְמָחִ֔ים וַֽ/יְחַזְּקֵ֖/ם לְ/הַרְבֵּ֣ה מְאֹ֑ד וַ/יְהִי ל֖/וֹ יְהוּדָ֥ה וּ/בִנְיָמִֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
  footnotes:
  - marker: a
    text: 'Hebrew repeats ''city'' distributively: ''in every city and city,'' emphasizing each individual city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 모든 성읍에[a] 방패와 창을 갖추어 두고, 그 성읍들을 매우 견고하게 하였습니다. 유다와 베냐민은 그에게 속해 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘성읍과 성읍’이라고 분배적으로 반복하여, 각 성읍 하나하나를 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר
  english_pob_choice: in every city and city
  chosen_korean: 모든 성읍에
  alternatives_korean:
  - 각 성읍마다
  - 모든 성읍 성읍마다
  lexicon: HALOT
  rationale: 히브리어의 분배적 반복은 한국어에서 같은 어휘를 중복하기보다 ‘모든 성읍에’로 자연스럽게 살리되, 각 성읍을 빠짐없이 가리키는 분배 의미를 유지했습니다.
- source_word: צִנּוֹת
  english_pob_choice: shields
  chosen_korean: 방패
  alternatives_korean:
  - 큰 방패
  - 방어용 방패
  lexicon: HALOT
  rationale: 군사 문맥의 표준 대응으로 ‘방패’가 가장 직접적이며, 본문이 특정 크기를 명시하지 않으므로 수식어는 덧붙이지 않았습니다.
- source_word: וּרְמָחִים
  english_pob_choice: spears
  chosen_korean: 창
  alternatives_korean:
  - 투창
  - 긴 창
  lexicon: HALOT
  rationale: רְמָחִים은 보통 ‘창’으로 옮기며, 현대 한국어에서 가장 자연스럽고 과도한 세부화를 피할 수 있습니다.
- source_word: וַיְחַזְּקֵם לְהַרְבֵּה מְאֹד
  english_pob_choice: he strengthened them very greatly
  chosen_korean: 그것들을 매우 크게 강화하였으며
  alternatives_korean:
  - 그것들을 매우 강하게 하였으며
  - 그것들을 크게 강하게 하였으며
  lexicon: HALOT
  rationale: ‘강화하다’는 성읍들과 방비를 더 굳게 만든다는 뜻을 살리면서도 한국어에서 자연스럽고, ‘매우 크게’로 히브리어의 강한 강조를 보존했습니다.
- source_word: וַיְהִי לוֹ יְהוּדָה וּבִנְיָמִן
  english_pob_choice: and Judah and Benjamin belonged to him
  chosen_korean: 유다와 베냐민이 그의 것이 되었습니다
  alternatives_korean:
  - 유다와 베냐민은 그의 것이었습니다
  - 유다와 베냐민이 그에게 속했습니다
  lexicon: HALOT
  rationale: ויהי לו는 단순 소유보다 귀속·지배를 포함하므로, ‘그의 것이 되었습니다’로 관계의 전환과 통치를 함께 드러냈습니다.
theological_decisions:
- issue: 문장 마지막의 소유 표현을 단순 점유로 약화할지 여부
  chosen_reading: ‘그의 것이 되었습니다’로 번역해 유다와 베냐민이 르호보암의 통치 아래 들어간 상태를 드러냈습니다.
  alternative_readings:
  - ‘그는 유다와 베냐민을 가졌습니다’
  - ‘유다와 베냐민은 그의 것이었습니다’
  rationale: 히브리어 관용구는 단순 소유가 아니라 정치적 귀속을 포함하므로, 한국어에서도 통치 관계가 읽히도록 처리하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 역대하 11장 문맥의 왕권 귀속 표현
