  lexicon: HALOT
  rationale: 원문이 지시하는 신적 발화를 그대로 살려 ‘말씀’으로 옮기고, 문맥상 인격적 신명은 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: שְׁמַעְיָהוּ
