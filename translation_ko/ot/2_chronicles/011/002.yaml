- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 하나님 사람
  lexicon: HALOT
  rationale: 문맥상 선지자적 호칭인 관용구를 살려 직역보다 자연스러운 한국어 성경 표현으로 옮겼습니다.
theological_decisions:
