  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
  footnotes:
  - marker: a
    text: 'Hebrew genealogy is compressed: literally, ''Mahalath son/daughter of Jerimoth son of David, Abihail daughter of Eliab son of Jesse.'' The sense is likely that Mahalath was descended from both lines; some take Abihail as a second name in the family notice or, less likely, as a second wife.'
    reason: alternative_reading
translation:
  language: ko
  text: 르호보암이 아내로 마할랏을 맞았는데, 그는 다윗의 아들 여리못의 딸이며, 아비하일은 이새의 아들 엘리압의 딸이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 족보는 압축되어 있습니다. 문자적으로는 ‘마할랏, 여리못의 아들/딸, 다윗의 아들, 아비하일, 엘리압의 딸, 이새의 아들’에 가깝습니다. 문맥상 마할랏의 양계 조상을 함께 제시한 것으로 보이며, 아비하일을 둘째 아내로 보는 견해도 있으나 덜 가능성이 높습니다.
    reason: alternative_reading
