  lexicon: HALOT
  rationale: 히브리어 관용구의 혼인 의미를 자연스러운 현대 한국어로 살리되, 원문의 행위성을 유지하기 위해 ‘맞다’를 선택했습니다.
- source_word: מָחֲלַת
  english_pob_choice: Mahalath
  chosen_korean: 마할랏
  alternatives_korean:
  - 마할라트
  - 마할라스
  lexicon: 고유명사 음역 원칙
  rationale: 인명은 현대 외래어 표기와 음운을 고려해 음역했습니다.
- source_word: בַּת / בן
  english_pob_choice: the daughter of / son of
  chosen_korean: 딸이며
  alternatives_korean:
  - 딸입니다
  - 딸로서
  lexicon: HALOT
  rationale: 본문의 압축된 족보 구조를 한국어에서는 관계를 분명히 드러내는 방식으로 풀어, 마할랏의 계보 설명임을 자연스럽게 전달했습니다.
- source_word: יְרִימוֹת בֶּן דָּוִיד
  english_pob_choice: Jerimoth son of David
  chosen_korean: 다윗의 아들 여리못
  alternatives_korean:
  - 여리못, 다윗의 아들
  - 다윗의 아들인 여리못
  lexicon: HALOT
  rationale: 히브리어 계보의 소유·부자 관계를 한국어에 맞게 ‘다윗의 아들’로 옮겨, David를 여리못의 상위 계보로 이해하도록 했습니다.
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב בֶּן יִשָׁי
  english_pob_choice: Abihail the daughter of Eliab son of Jesse
  chosen_korean: 아비하일은 이새의 아들 엘리압의 딸
  alternatives_korean:
  - 아비하일, 이새의 아들 엘리압의 딸
  - 아비하일은 엘리압의 딸이며 이새의 아들입니다
  lexicon: HALOT
  rationale: 영어 POB의 족보 해석을 따라 아비하일을 독립된 인물 설명으로 옮기되, 히브리어의 압축된 연결을 한국어에서 명시해 오독을 줄였습니다.
theological_decisions:
- issue: 압축된 족보에서 아비하일의 지위
  chosen_reading: 아비하일을 마할랏과 병렬된 다른 아내로 보지 않고, 마할랏의 계보를 보충하는 족보 요소로 처리했습니다.
  alternative_readings:
  - 르호보암이 마할랏과 아비하일 두 여인을 아내로 맞았다는 읽기
  - 아비하일을 마할랏의 다른 이름으로 보는 읽기
  rationale: 본문은 단수형 ‘아내’를 사용하고, 영어 POB도 압축된 족보로 보아 마할랏의 양계 조상을 제시하는 해석을 채택합니다. 따라서 한국어도 그 구조를 따라야 문맥과 족보 체계가 보존됩니다.
  doctrine_reference: 본문 문맥과 족보 해석의 일관성
- issue: 다윗·이새 계보의 관계 표기
  chosen_reading: ‘다윗의 아들’, ‘이새의 아들’로 직역하여 계보의 상하관계를 분명히 했습니다.
  alternative_readings:
  - ‘다윗의 후손’, ‘이새의 후손’
  - 계보 관계를 완만하게 풀어 쓰는 방식
  rationale: 족보 본문에서는 혈통 관계를 직접 드러내는 것이 중요하므로, 전통적 완곡화보다 원문의 계보 논리를 보존하는 표현을 택했습니다.
  doctrine_reference: 본문의 족보적 진술
