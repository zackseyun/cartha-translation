  source_fidelity: 원문은 마할랏의 계보를 매우 압축적이고 문법적으로도 난해하게 제시합니다. 초안은 ‘그는’으로 마할랏만 여리못의 딸로 처리한 뒤 아비하일을 독립된 주어로 전환하여, 마할랏과 아비하일의 관계를 본문보다 더 불명확하게 만들고 아비하일이 별도 인물 또는 별도 아내처럼 읽힐 여지를 남깁니다. 가장 개연성 높은 족보적 이해, 곧 마할랏이 여리못과 아비하일의 딸이라는 이해를 본문에서 명료하게 제시하고 각주에서 난점을 보존하는 것이 안전합니다.
  naturalness: ‘아내로 … 맞았다’는 현대 정중 문체에 자연스럽습니다. 다만 ‘그는 … 딸이며, 아비하일은 … 딸이었습니다’는 지시 대상과 서술 연결이 어색하고, 한 문장 안에서 계보 관계가 끊깁니다. ‘~ 사이에서 난 딸 마할랏’은 복잡한 계보를 자연스럽고 명확하게 전달합니다.
  terminology: ‘르호보암’, ‘마할랏’, ‘여리못’, ‘아비하일’, ‘엘리압’, ‘이새’, ‘다윗’은 일관된 음역으로 적절합니다. ‘아내로 맞았습니다’와 ‘딸’도 본문의 혼인 및 계보 용어를 적절히 옮깁니다.
