  edition: WLC
  text: וַ/יִּֽקַּֽח ל֤/וֹ רְחַבְעָם֙ אִשָּׁ֔ה אֶת מָ֣חֲלַ֔ת בן יְרִימ֖וֹת בֶּן דָּוִ֑יד אֲבִיהַ֕יִל בַּת אֱלִיאָ֖ב בֶּן יִשָֽׁי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
  footnotes:
  - marker: a
    text: 'Hebrew genealogy is compressed: literally, ''Mahalath son/daughter of Jerimoth son of David, Abihail daughter of Eliab son of Jesse.'' The sense is likely that Mahalath was descended from both lines; some take Abihail as a second name in the family notice or, less likely, as a second wife.'
    reason: alternative_reading
translation:
  language: ko
  text: 르호보암은 다윗의 아들 여리못과 이새의 아들 엘리압의 딸 아비하일 사이에서 난 딸 마할랏을 아내로 맞았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 족보 표현은 매우 압축적이며 문법적으로도 난해합니다. 직역에 가까우면 ‘마할랏, 여리못의 아들, 다윗의 아들, 아비하일, 엘리압의 딸, 이새의 아들’입니다. 여기서는 마할랏이 여리못과 아비하일의 딸이라는 가장 개연성 높은 이해를 따랐습니다. 아비하일을 계보 설명의 다른 요소로 보거나, 드물게는 별도의 아내로 보는 해석도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח לּוֹ ... אִשָּׁה
  english_pob_choice: took as wife
  chosen_korean: 아내로 ... 맞았습니다
  alternatives_korean:
