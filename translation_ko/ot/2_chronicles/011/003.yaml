lexical_decisions:
- source_word: אֱמֹר
  english_pob_choice: Speak
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말하시오
  - 이르십시오
  lexicon: HALOT
  rationale: 예언/왕명 전달의 명령형을 자연스러운 현대 합쇼체로 살렸습니다. ‘이르십시오’도 가능하지만, 본문이 곧바로 전달문을 시작하는 구조라 ‘말하십시오’가 더 직접적입니다.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  english_pob_choice: Rehoboam son of Solomon
  chosen_korean: 르호보암—솔로몬의 아들
  alternatives_korean:
  - 르호보암, 솔로몬의 아들
  - 솔로몬의 아들 르호보암
  lexicon: HALOT
  rationale: 고유명사는 현대 음역을 따르고, ‘아들’의 혈통 표지를 유지해 인물 식별을 분명히 했습니다. 대시로 삽입구를 표시해 히브리어의 구성 관계를 드러냈습니다.
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: king of Judah
  chosen_korean: 유다의 왕
  alternatives_korean:
  - 유다 왕
  - 유다의 임금
  lexicon: HALOT
  rationale: 통치 титул의 자연스러운 한국어는 ‘유다의 왕’입니다. ‘임금’은 현대 문맥에서 다소 고전적입니다.
- source_word: וְאֶל כָּל יִשְׂרָאֵל בִּיהוּדָה וּבִנְיָמִן
  english_pob_choice: and to all Israel in Judah and Benjamin
  chosen_korean: 그리고 유다와 베냐민에 있는 온 이스라엘에게
  alternatives_korean:
  - 그리고 유다와 베냐민 가운데 있는 온 이스라엘에게
  - 그리고 유다와 베냐민에 거주하는 온 이스라엘에게
  lexicon: HALOT
  rationale: ב의 위치 의미를 살려 ‘~에 있는’으로 옮겼습니다. ‘온 이스라엘’은 민족-언약적 호칭을 유지해 ‘이스라엘 사람들’로 축소하지 않았습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 이렇게 말하십시오
  alternatives_korean:
  - 말하여 이르기를
  - 말하며
  lexicon: HALOT
  rationale: 다음 절로 이어지는 직접 인용의 도입을 한국어에서 자연스럽게 처리했습니다. 단순히 ‘말하며’보다 명령의 흐름이 분명합니다.
