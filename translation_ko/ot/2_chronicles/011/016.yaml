  to: 그들을 따라 이스라엘의 모든 지파에서 야훼, 곧 이스라엘의 하나님을 찾고자 마음을 둔 사람들이 예루살렘에 와서 그들의 아버지들의 하나님 야훼께 제사를 드렸습니다.[a][b]
