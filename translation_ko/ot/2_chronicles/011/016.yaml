source:
  edition: WLC
  text: וְ/אַחֲרֵי/הֶ֗ם מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל הַ/נֹּֽתְנִים֙ אֶת לְבָבָ֔/ם לְ/בַקֵּ֕שׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בָּ֚אוּ יְר֣וּשָׁלִַ֔ם לִ/זְבּ֕וֹחַ לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
  footnotes:
  - marker: a
    text: 'Hebrew: ''those giving their heart''; the idiom means to set or devote one''s heart to seek the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Or 'went to Jerusalem.' Hebrew commonly uses the same verb for 'come' and 'go,' with the choice shaped by narrative viewpoint.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 따라 이스라엘의 모든 지파에서 야훼, 곧 이스라엘의 하나님을 찾고자 마음을 둔 사람들이 예루살렘에 와서 그들의 아버지들의 하나님 야훼께 제사를 드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 마음을 주는’이지만, 관용적으로는 하나님을 찾는 데 ‘마음을 두다’ 또는 ‘전념하다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 בָּאוּ는 문맥에 따라 ‘왔다’ 또는 ‘갔다’로 옮길 수 있습니다. 여기서는 예루살렘을 향한 이동을 ‘와서’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  english_pob_choice: And after them
  chosen_korean: 그리고 그들 뒤로
  alternatives_korean:
  - 그리고 그들 뒤에
  - 그 뒤를 이어
  lexicon: HALOT
  rationale: 앞선 무리 다음에 이어지는 순서를 나타내므로, 연결사 וְ와 시간적 선후를 살려 자연스럽게 옮겼습니다.
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  english_pob_choice: those who set their hearts
  chosen_korean: 자기 마음을 두어
  alternatives_korean:
  - 마음을 두고
  - 자기들의 마음을 바쳐
  lexicon: HALOT
  rationale: 직역하면 ‘자기들의 마음을 주는’이지만, 히브리 관용구로서 ‘마음을 두다/두어’가 결심과 전념의 뜻을 가장 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 언약적 고유명으로서 신명기적 전승을 가리는 ‘주’ 대신, 본문과 주석 전통에 따라 하나님의 이름을 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  english_pob_choice: the God of their fathers
  chosen_korean: 자기들의 조상의 하나님
  alternatives_korean:
  - 조상들의 하나님
  - 그들의 조상들의 하나님
  lexicon: HALOT
  rationale: 히브리어의 ‘fathers’는 관례적 언약 표현이므로, 성중립화하지 않고 ‘조상’으로 유지해 한국어에서 자연스럽게 다듬었습니다.
theological_decisions:
- issue: 성스러운 이름 יְהוָה의 처리
  chosen_reading: 본문과 후반부를 모두 ‘야훼’로 통일했습니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 표기
  rationale: 본문이 하나님의 개인적 언약 이름을 직접 사용하므로, 칭호로 대체하지 않고 음역을 유지하는 것이 स्रोत 의미를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘그들의 아버지들’ 관용구
  chosen_reading: ‘조상’으로 옮기되, 언약 공식의 남성형 표현은 유지했습니다.
  alternative_readings:
  - ‘조상들’로 중화
  - ‘선조들’로 의역
  rationale: 본문의 전통적 언약 문구를 지키면서도 한국어에서 과도하게 경직되지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
