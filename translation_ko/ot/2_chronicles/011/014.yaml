  text: כִּֽי עָזְב֣וּ הַ/לְוִיִּ֗ם אֶת מִגְרְשֵׁי/הֶם֙ וַ/אֲחֻזָּתָ֔/ם וַ/יֵּלְכ֥וּ לִ/יהוּדָ֖ה וְ/לִֽ/ירוּשָׁלִָ֑ם כִּֽי הִזְנִיחָ֤/ם יָֽרָבְעָם֙ וּ/בָנָ֔י/ו מִ/כַּהֵ֖ן לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
  footnotes:
  - marker: a
    text: Or 'their common lands' or 'their grazing lands.' The Hebrew refers to the open land attached to their towns.
    reason: lexical_alternative
  - marker: b
    text: Or 'had excluded them from ministering as priests to the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 레위인들이 자기들의 목초지와 소유지를 버리고 유다와 예루살렘으로 갔습니다. 이는 여로보암과 그의 아들들이 그들을 야훼께 제사장으로 섬기지 못하게 했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  english_pob_choice: their pasturelands
  chosen_korean: 목초지
  alternatives_korean:
  - 들판
  - 공유지
  - 초지
  lexicon: HALOT
  rationale: 레위 성읍에 붙은 열린 땅을 가리키는 용법이므로, 단순한 ‘소유’보다 토지의 용도를 드러내는 ‘목초지’가 원문의 구체성을 잘 살립니다.
- source_word: אֲחֻזָּתָם
  english_pob_choice: their possessions
  chosen_korean: 소유지
  alternatives_korean:
  - 소유물
  - 재산
  - 분깃
  lexicon: HALOT
  rationale: אֲחֻזָּה는 특히 토지 소유나 보유지를 뜻하므로, 일반적인 물건보다 땅의 보유를 드러내는 ‘소유지’가 더 정확합니다.
- source_word: הִזְנִיחָם ... מִכַּהֵן
  english_pob_choice: had rejected them from serving as priests
  chosen_korean: 그들을 ... 제사장직에서 배제했기 때문입니다
  alternatives_korean:
  - 그들을 ... 제사장으로 섬기지 못하게 했기 때문입니다
  - 그들을 ... 제사장으로 봉사하지 못하게 했기 때문입니다
  - 그들을 ... 제사장직에서 밀어냈기 때문입니다
  lexicon: HALOT
  rationale: זנח의 히필은 단순 감정적 ‘거절’보다 직무에서의 배제를 포함하므로, 이어지는 ‘제사장으로 섬김’과 연결해 ‘제사장직에서 배제하다’로 옮겼습니다.
- source_word: יהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project glossary
  rationale: 이 프로젝트 기본 용어에 따라 여호와가 아니라 학술적 음역인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 레위인의 이동과 제사장직 배제의 인과 표현
  chosen_reading: ‘이는 ... 때문입니다’로 원문의 이유 설명을 분명히 드러냈습니다.
  alternative_readings:
  - ‘그리하여 ...’
  - ‘왜냐하면 ...’
  rationale: 히브리어의 두 כִּי를 한국어에서 자연스럽게 풀어, 앞절의 설명과 여로보암의 조치를 인과적으로 연결했습니다.
  doctrine_reference: Narrative causation in OT historical prose
- issue: יהוה의 번역
  chosen_reading: ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 본문이 신명기적 언약명 자체를 사용하므로, 프로젝트 기준에 따라 고유한 신적 이름을 보존했습니다.
  doctrine_reference: 'Project glossary: YHWH → 야훼'
