  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל יָד/וֹ֙ עֲמַסְיָ֣ה בֶן זִכְרִ֔י הַ/מִּתְנַדֵּ֖ב לַ/יהוָ֑ה וְ/עִמּ֛/וֹ מָאתַ֥יִם אֶ֖לֶף גִּבּ֥וֹר חָֽיִל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
  footnotes:
  - marker: a
    text: Or 'who willingly offered himself for the LORD.' The Hebrew participle can emphasize voluntary self-dedication, and the preposition may be understood as 'to' or 'for.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 지휘 아래에는 아마시야, 곧 시그리의 아들이 있었는데, 그는 야훼께 자원하여 몸을 바쳤습니다.[a] 그와 함께한 사람들은 용맹한 전사 이십만 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼를 위해 기꺼이 몸을 바친 사람’으로도 옮길 수 있습니다. 히브리어 분사는 자발적인 자기헌신을 강조하며, 전치사는 ‘~에게’ 또는 ‘~을 위해’라는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל יָד/וֹ
  english_pob_choice: And under his command was
  chosen_korean: 그의 지휘 아래에는
  alternatives_korean:
  - 그의 손 아래에는
  - 그의 곁에는
  - 그의 아래에는
  lexicon: HALOT
  rationale: 행정·군사 맥락에서 ‘~의 손 아래’는 통치/지휘 아래 있음을 뜻하므로, 현대 한국어에서는 기능적 의미를 드러내는 ‘지휘 아래’가 가장 자연스럽습니다.
- source_word: הַ/מִּתְנַדֵּב
  english_pob_choice: who volunteered himself
  chosen_korean: 자원하여 몸을 바쳤습니다
  alternatives_korean:
  - 자원하였습니다
  - 기꺼이 몸을 바쳤습니다
  - 자발적으로 헌신하였습니다
  lexicon: HALOT
  rationale: 히트파엘 분사는 단순한 자원보다 자기헌신의 뉘앙스가 있어, ‘몸을 바쳤습니다’로 자기 헌신을 살리면서 ‘자원하여’로 자발성을 함께 표현했습니다.
- source_word: לַ/יהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  - 하나님께
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮기고, ל의 방향성과 헌신의 대상을 살리기 위해 여격 조사 ‘께’를 사용했습니다.
- source_word: גִּבּ֥וֹר חָֽיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 장사
  alternatives_korean:
  - 용사
  - 능력 있는 전사들
  - 힘센 전사
  lexicon: HALOT
  rationale: 고전적 군사 관용구를 너무 평이하게 풀지 않으면서도 한국어에서 자연스러운 군사 표현으로 ‘용맹한 장사’를 택했습니다.
theological_decisions:
- issue: 여호와 신명 표기 대신 야훼 사용
  chosen_reading: ‘야훼’로 표기하여 언약 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה는 일반 명칭이 아니라 고유한 언약 이름이므로, 프로젝트 규정에 따라 ‘야훼’로 유지하는 것이 원문 의미를 더 직접적으로 전달합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘자원하다’와 ‘몸을 바치다’의 결합
  chosen_reading: 자발성과 자기헌신을 함께 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 자원하였습니다
  - 기꺼이 헌신하였습니다
  rationale: 히브리어 분사는 단순 지원 행위보다 자발적 헌신을 강조하므로, 한국어에서도 자원성과 헌신성을 둘 다 보존하는 것이 본문의 힘을 더 잘 반영합니다.
  doctrine_reference: 'HALOT: נדב hitpael participle'
