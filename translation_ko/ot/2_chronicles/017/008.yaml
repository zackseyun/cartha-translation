base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
  footnotes:
  - marker: a
    text: Hebrew 'Tob Adonijah,' likely a single compound personal name; some translations smooth it differently.
    reason: lexical_alternative
  - marker: b
    text: '''Jehonathan'' reflects the fuller Hebrew form of the name; some English versions shorten it to ''Jonathan.'''
    reason: lexical_alternative
  - marker: c
    text: '''Tobijah'' reflects the fuller Hebrew form; many English versions have ''Tobiah.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들과 함께한 레위 사람들은 스마야, 느다냐, 스바댜, 아사헬, 스마리못, 여호나단, 아도니야, 또비야, 도브아도니야였으며, 그들과 함께한 제사장들은 엘리사마와 여호람이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘도브 아도니야’는 합성 인명으로 보이며, 번역본들에 따라 띄어쓰기나 하이픈 처리에 차이가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여호나단’은 히브리어의 긴 형태 יְהוֹנָתָן을 반영한 음역입니다. 일부 번역본은 이를 ‘요나단’으로 줄입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘또비야’는 히브리어의 더 긴 형태 טוֹבִיָּהוּ를 반영한 음역입니다. 일부 번역본은 ‘도비야/토비야’로 줄입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  english_pob_choice: And with them were
  chosen_korean: 그들과 함께한
  alternatives_korean:
  - 그들과 함께 있던
  - 그들과 함께한 사람들이
  lexicon: HALOT
  rationale: 동반 관계를 자연스럽게 살리면서도, 뒤에 이어지는 명단의 기능을 흐리지 않도록 간결하게 옮겼습니다.
- source_word: הַלְוִיִּם
  english_pob_choice: the Levites
  chosen_korean: 레위 사람들
  alternatives_korean:
  - 레위인들
  - 레위 사람들인
  lexicon: HALOT
  rationale: 레위 지파 소속을 표지하는 집단명으로서 한국어에서는 ‘레위 사람들’이 가장 직역에 가깝고 이해하기 쉽습니다.
- source_word: שְׁמַעְיָהוּ ... וִיהוֹנָתָן
  english_pob_choice: Shemaiah ... Jehonathan
  chosen_korean: 스마야 ... 여호나단
  alternatives_korean:
  - 세마야 ... 요나단
  - 스마야 ... 요나단
  lexicon: standard biblical transliteration
  rationale: 고유명사는 현대 음역 원칙에 따라 옮겼고, יְהוֹנָתָן은 더 긴 형태를 반영해 ‘여호나단’으로 유지했습니다.
- source_word: טוֹב אֲדוֹנִיָּה
  english_pob_choice: Tob-adonijah
  chosen_korean: 도브아도니야
  alternatives_korean:
  - 도브-아도니야
  - 돕 아도니야
  lexicon: standard biblical transliteration
  rationale: 히브리어가 하나의 합성 인명으로 보이는 점을 살려 하이픈 없이 붙여 음역하되, 합성 이름이라는 성격은 보존했습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 제사장
  - 사제들
  lexicon: HALOT
  rationale: 문맥상 레위 사람들과 구별되는 별도 직분 집단이므로, 한국어 성경 관용에 맞는 ‘제사장들’로 분명하게 구분했습니다.
theological_decisions:
- issue: 레위 사람들과 제사장들의 구분
  chosen_reading: 마지막 두 사람을 레위 명단에 흡수하지 않고, 별도로 ‘제사장들’로 표시했습니다.
  alternative_readings:
  - 모든 이름을 한데 묶어 레위 사람들로 읽기
  - 단순히 인명 나열로 처리하기
  rationale: 히브리어 문장은 두 집단을 구분합니다. 이 구분을 유지해야 성전 관련 직분 구조가 흐려지지 않습니다.
  doctrine_reference: 역대기 문맥의 제사장/레위인 구분
