  - 주
  lexicon: HALOT
  rationale: 언약적 개인명인 יהוה는 POB 영어처럼 고유명사로 처리하여 '야훼'로 옮기고, 관습적 대체어 '주'는 피했습니다.
- source_word: וַיְהִי ... עִם
