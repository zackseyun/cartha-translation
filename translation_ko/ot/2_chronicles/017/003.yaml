  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
  footnotes:
  - marker: a
    text: Or 'the earlier ways of David his father.' The Hebrew specifies David's former conduct, likely distinguishing it from his later failures.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 여호사밧과 함께하셨습니다. 그는 그의 아버지 다윗의 이전 길들 가운데 행하며 야훼를 찾지 않고 바알들을 찾지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이전’은 다윗의 뒤늦은 실패와 구별되는 초기의 충실한 행위를 가리킬 수도 있습니다.
    reason: lexical_alternative
