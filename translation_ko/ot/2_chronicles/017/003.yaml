theological_decisions:
- issue: 하나님이 함께하심의 원인 표시
  chosen_reading: 여호사밧이 야훼를 찾지 않고 바알들을 찾지 않았기 때문입니다
  alternative_readings:
  - 그가 야훼를 찾지 않았고 바알들을 찾지 않았기 때문입니다
  - 그가 바알들을 구하지 않았기 때문입니다
  rationale: כִּי의 인과를 분명히 하되, 본문이 제시하는 신학적 평가가 여호사밧의 신실한 추구에 있음을 드러내도록 '찾다'를 유지했습니다.
  doctrine_reference: 역대기서의 보응 신학과 야훼-백성 관계
