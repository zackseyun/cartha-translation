  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
  footnotes:
  - marker: a
    text: Or 'his princes' or 'his leaders'; the Hebrew term can denote royal or administrative officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 재위 삼 년째에, 그는 그의 관리들[a]인 벤하일, 오바댜, 스가랴, 느다넬, 미가야를 보내어 유다의 성읍들에서 가르치게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관리들’은 히브리어 שָׂר의 가능한 뜻들 가운데 이 문맥에 맞는 행정적 의미를 따른 번역입니다.
    reason: lexical_alternative
