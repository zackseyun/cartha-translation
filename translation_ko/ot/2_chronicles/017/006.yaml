    rationale: 이 용어는 아세라 숭배와 연관된 제의물, 특히 기둥 또는 목제 표지물을 가리킬 수 있으므로, 본문에는 ‘아세림’을 쓰고 각주에서 가능한 뜻을 밝혀 모호성을 보존해야 합니다.
