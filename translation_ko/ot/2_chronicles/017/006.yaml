  text: וַ/יִּגְבַּ֥הּ לִבּ֖/וֹ בְּ/דַרְכֵ֣י יְהוָ֑ה וְ/ע֗וֹד הֵסִ֛יר אֶת הַ/בָּמ֥וֹת וְ/אֶת הָ/אֲשֵׁרִ֖ים מִ/יהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
  footnotes:
  - marker: a
    text: Or, 'his heart grew bold/was encouraged in the ways of the LORD.' The Hebrew idiom can denote an elevated or emboldened heart; here the context is positive, not arrogant.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the Asherim' or 'the sacred poles.' The Hebrew term refers to cultic objects associated with Asherah worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 마음이 야훼의 길을 따르는 데 담대해졌으며,[a] 또한 그는 유다에서 산당들과 아세림을 제거하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 마음이 야훼의 길에서 높아졌다.’ 히브리어 표현은 문자적으로 마음이 높아지는 것을 뜻하며, 이 문맥에서는 교만이 아니라 용기와 결의가 북돋워진 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아세림’은 아세라 숭배와 관련된 제의물을 가리키며, 기둥이나 목제 표지물 등을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  english_pob_choice: His heart was exalted
  chosen_korean: 그의 마음이 ... 높아졌으며
  alternatives_korean:
  - 그의 마음이 고양되었으며
  - 그의 마음이 용기 내었으며
  - 그의 마음이 높이 들렸으며
  lexicon: HALOT
  rationale: גבהּ는 문자적으로 ‘높다/들리다’의 뜻이어서, 긍정적 문맥에서는 교만보다 고양된 결의로 읽을 수 있습니다. 한국어는 ‘높아지다’로 이미지와 긍정적 문맥을 함께 살렸습니다.
- source_word: לִבּוֹ
  english_pob_choice: his heart
  chosen_korean: 그의 마음
  alternatives_korean:
  - 그의 심장
  - 그의 중심
  - 그의 용기
  lexicon: HALOT
  rationale: לֵב는 히브리어 인류학에서 내면 전체를 가리키므로, 표준적이고 자연스러운 ‘마음’이 가장 잘 대응합니다.
- source_word: בְּדַרְכֵי יְהוָה
  english_pob_choice: in the ways of Yahweh
  chosen_korean: 야훼의 길들 가운데서
  alternatives_korean:
  - 야훼의 길 안에서
  - 주님의 길들 가운데서
  - 야훼의 방식들 안에서
  lexicon: HALOT
  rationale: דֶּרֶךְ의 복수는 삶의 방식이나 행위를 뜻하는 관용구이므로, ‘길들 가운데서’로 관계성을 유지하면서 한국어 문맥을 자연스럽게 했습니다.
- source_word: הֵסִיר
  english_pob_choice: he removed
  chosen_korean: 제거하였습니다
  alternatives_korean:
  - 없애셨습니다
  - 치워버렸습니다
  - 제거했습니다
  lexicon: HALOT
  rationale: סוּר의 히필은 ‘치우다/제거하다’의 의미가 분명하므로, 우상 숭배 대상에 대한 개혁 행동을 분명하게 드러내는 ‘제거하다’를 택했습니다.
- source_word: הַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당들
  alternatives_korean:
  - 높은 곳들
  - 산상 제단들
  - 고지 제단들
  lexicon: HALOT
  rationale: בָּמוֹת는 이스라엘 종교사에서 표준적인 우상 숭배 장소를 가리키므로, 관용적이면서도 독자가 이해하기 쉬운 ‘산당들’을 사용했습니다.
- source_word: הָאֲשֵׁרִים
  english_pob_choice: the Asherim
  chosen_korean: 아세라 상들
  alternatives_korean:
  - 아세림
  - 신성한 기둥들
  - 아세라 목상들
  lexicon: HALOT
  rationale: אֲשֵׁרִים는 아세라 숭배와 관련된 제의물/기둥류를 가리킬 수 있어, 의미를 과도하게 단정하지 않으면서도 독자에게 대상을 드러내는 ‘아세라 상들’로 옮겼습니다.
- source_word: מִיהוּדָה
  english_pob_choice: from Judah
  chosen_korean: 유다에서
  alternatives_korean:
  - 유다로부터
  - 유다 땅에서
  - 유다 밖에서
  lexicon: HALOT
  rationale: מִן의 출발점 의미를 가장 자연스럽게 살리는 표현은 ‘~에서’이므로, 지리적 제거의 뉘앙스를 그대로 반영했습니다.
theological_decisions:
- issue: וַיִּגְבַּהּ לִבּוֹ를 교만으로 읽을지, 야훼의 길 안에서의 격려/고양으로 읽을지
  chosen_reading: 야훼의 길들 가운데서 마음이 높아진 긍정적 표현으로 읽었습니다.
  alternative_readings:
  - 그의 마음이 야훼의 길들 가운데서 교만해졌습니다.
  - 그의 마음이 야훼의 길들 안에서 담대해졌습니다.
  rationale: 직전 문맥과 이어지는 개혁 행위가 칭찬의 흐름이므로, 죄책적 교만을 주입하지 않고 히브리어 은유를 보존하는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 원문의 긍정/부정 긴장을 해소하지 말고 문맥으로 판별한다는 번역 원칙
