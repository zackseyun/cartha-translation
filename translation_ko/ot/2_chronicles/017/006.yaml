  source_fidelity: 히브리어 וַיִּגְבַּהּ לִבּוֹ는 직역하면 ‘그의 마음이 높아졌다’이지만, 야훼의 길과 뒤따르는 종교 개혁의 문맥상 긍정적인 담대함 또는 고양을 뜻합니다. 본문의 ‘높아졌으며’는 한국어에서 교만의 뜻으로 더 쉽게 읽히므로 문맥상 긍정 의미를 본문에 안전하게 반영하는 것이 낫습니다. הָאֲשֵׁרִים는 정확한 물리적 형태가 논쟁적이므로 ‘아세라 상들’처럼 상(像)으로 한정하기보다 음역 ‘아세림’을 사용하고 주석에서 설명하는 것이 원문의 모호성을 보존합니다.
  naturalness: ‘야훼의 길들 가운데서’는 직역투이며 현대 표준 한국어에서는 ‘야훼의 길을 따르는 데’가 자연스럽습니다. 또한 문장 종결은 합쇼체로 적절하나, ‘더욱이’보다 ‘또한’이 문맥상 더 매끄럽습니다.
  terminology: 야훼, 유다, 산당은 적절합니다. אֲשֵׁרִים는 복수형 음역인 ‘아세림’으로 옮겨 특정한 형태나 아세라 여신 자체와의 동일시를 본문에서 단정하지 않습니다. 주석 표지는 해당 어휘 바로 뒤에 두어야 하며, 현재처럼 문장 끝에 [a][b]를 함께 두면 각 주석의 연결 대상이 불명확합니다.
