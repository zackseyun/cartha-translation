translation:
  language: ko
  text: 그리고 그의 수하에는[a] 여호하난 지휘관이 있었고, 그와 함께 이십팔만 명이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 직역하면 ‘그의 손 위에’입니다. 여기서는 그의 지휘 아래 또는 그의 권한 아래 있음을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  english_pob_choice: under his command
  chosen_korean: 그의 수하에는
  alternatives_korean:
  - 그의 명령 아래에는
  - 그의 권한 아래에는
  - 그의 편에는
  lexicon: HALOT
  rationale: 군사·행정 문맥에서 עַל יָדֹו는 단순한 위치가 아니라 그의 지휘·관할 아래 있음을 뜻하므로, 자연스러운 한국어로 ‘수하에’라고 옮겼습니다.
- source_word: יְהוֹחָנָן
  english_pob_choice: Jehohanan
  chosen_korean: 여호하난
  alternatives_korean:
  - 요하난
  - 여호난
  lexicon: 음역
  rationale: 고유명사는 음역하되, 히브리어 형태를 반영하여 역대기 문맥에 맞는 ‘여호하난’을 채택했습니다.
- source_word: הַשָּׂר
  english_pob_choice: the commander
  chosen_korean: 장관
  alternatives_korean:
  - 지휘관
  - 대장
  - 지도자
  lexicon: HALOT
  rationale: שַׂר는 넓게 ‘우두머리/관리/지휘관’을 뜻하지만, 여기서는 군대 편제의 목록이므로 기능을 살려 ‘장관’으로 옮겼습니다.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  english_pob_choice: two hundred and eighty thousand
  chosen_korean: 이십팔만 명
  alternatives_korean:
  - 이백팔만 명
  - 이백팔십만 명
  lexicon: 수사
  rationale: 원문 수사는 28만을 뜻하므로 한국어에서는 현대적이고 정확한 수사 표현인 ‘이십팔만 명’이 가장 분명합니다.
