  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
  footnotes:
  - marker: a
    text: Or 'at his side/under his authority was Jehohanan the commander.' The Hebrew idiom literally reads 'upon his hand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그의 수하에는 여호하난 장관이 있었고, 그와 함께한 자는 이십팔만 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘그의 손 위에/그의 손에’이지만, 여기서는 그의 지휘 아래 있음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  english_pob_choice: under his command
  chosen_korean: 그의 수하에는
  alternatives_korean:
  - 그의 명령 아래에는
  - 그의 권한 아래에는
