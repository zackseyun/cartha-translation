source:
  edition: WLC
  text: וַ/יְהִ֣י פַּ֣חַד יְהוָ֗ה עַ֚ל כָּל מַמְלְכ֣וֹת הָֽ/אֲרָצ֔וֹת אֲשֶׁ֖ר סְבִיב֣וֹת יְהוּדָ֑ה וְ/לֹ֥א נִלְחֲמ֖וּ עִם יְהוֹשָׁפָֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
  footnotes:
  - marker: a
    text: Or 'terror from the LORD' or 'dread of the LORD.' The Hebrew phrase can denote fear associated with the LORD, here likely meaning a divinely sent dread on the surrounding kingdoms.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 두려움이 유다의 사방에 있는 땅들의 모든 왕국들에 임하였고, 그들은 여호사밧과 싸우지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼로부터 온 공포’, ‘야훼의 두려운 위엄’으로도 옮길 수 있습니다. 히브리어 표현은 야훼와 관련된 두려움이나 야훼께서 일으키신 공포를 뜻할 수 있으며, 여기서는 주변 왕국들에 임한 신적 공포를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחַד יְהוָה
  english_pob_choice: the fear of Yahweh
  chosen_korean: 야훼의 두려움
  alternatives_korean:
  - 야훼에 대한 두려움
  - 야훼로부터 온 두려움
  - 야훼를 경외함
  lexicon: HALOT
  rationale: פַּחַד은 문맥에 따라 두려움, 공포, 경외를 뜻하지만, 여기서는 주변 왕국들에 임한 신적 공포를 가리키므로 ‘두려움’을 택해 문맥의 긴장을 보존했습니다.
- source_word: עַל
  english_pob_choice: upon
  chosen_korean: …에 임하였고
  alternatives_korean:
  - …위에
  - …에
  - …에 내려와
  lexicon: HALOT
  rationale: 두려움이 어떤 대상 위에 덮이듯 임하는 뉘앙스를 한국어 동사 ‘임하다’로 자연스럽게 옮겼습니다.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  english_pob_choice: all the kingdoms of the lands
  chosen_korean: 유다의 사방에 있는 땅들의 모든 왕국들
  alternatives_korean:
  - 유다 주변의 모든 나라들
  - 유다를 둘러싼 모든 땅의 왕국들
  - 유다 주변의 모든 왕국들
  lexicon: HALOT
  rationale: ממלכות와 הארצות를 둘 다 살려 ‘왕국들’과 ‘땅들’로 대응했습니다. ‘유다의 사방에 있는’은 이어지는 יחס절의 지리적 의미를 분명히 합니다.
- source_word: וְלֹא נִלְחֲמוּ עִם
  english_pob_choice: and they did not make war against
  chosen_korean: 그들은 여호사밧과 싸우지 않았습니다
  alternatives_korean:
  - 그들은 여호사밧과 전쟁하지 않았습니다
  - 그들은 여호사밧과 전투하지 않았습니다
  lexicon: HALOT
  rationale: נלחם עם는 단순한 감정적 대립보다 군사적 충돌을 가리키지만, 한국어에서는 ‘전쟁하다’보다 ‘싸우다’가 더 자연스럽고 본문의 결과를 간결하게 전달합니다.
theological_decisions:
- issue: ‘야훼의 두려움’의 의미
  chosen_reading: 주변 왕국들이 야훼를 경외했다기보다, 야훼께서 보내신 두려움이 그들 위에 임해 침공을 막았다는 의미로 읽습니다.
  alternative_readings:
  - 경건한 경외심이 널리 퍼졌다는 의미
  - 야훼에 대한 일반적 종교적 두려움이라는 의미
  rationale: 이 절은 외교·군사적 맥락에서 적대 행위를 중단하게 만드는 신적 공포를 말하므로, 신학적 긴장을 풀어 ‘경외’로 순화하지 않고 문맥에 맞는 의미를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; original-language primacy'
