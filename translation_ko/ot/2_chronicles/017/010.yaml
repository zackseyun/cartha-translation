  source_fidelity: 히브리어의 ‘야훼의 두려움’과 그것이 주변 왕국들 위에 임하여 여호사밧과 전쟁하지 못하게 했다는 기본 의미는 대체로 충실하게 반영되었습니다. 다만 נלחם עם의 군사·정치적 의미는 ‘싸우지 않았다’보다 ‘전쟁을 벌이지 않았다’가 더 정확합니다.
