  lexicon: HALOT
  rationale: עִם + 대명사 접미사는 동반·연관을 나타내므로, 군사 목록 문맥에서 자연스러운 한국어로 ‘그와 함께’라고 옮겼습니다.
- source_word: חֲלוּצֵ֥י צָבָֽא
  english_pob_choice: 180,000 armed for war
  chosen_korean: 전쟁에 무장한 자가
  alternatives_korean:
