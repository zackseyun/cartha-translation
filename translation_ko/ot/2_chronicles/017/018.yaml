  - 전투에 대비한 군사들이
  lexicon: HALOT
  rationale: חֲלוּצֵי צָבָא는 전쟁을 위해 준비되거나 무장한 병력을 가리키므로, 영어 POB의 ‘armed for war’에 맞춰 ‘전쟁에 무장한 자’로 번역해 전투 준비 상태를 드러냈습니다.
- source_word: מֵאָֽה וּ/שְׁמוֹנִ֥ים אֶ֖לֶף
