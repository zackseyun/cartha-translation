  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל יָד֖/וֹ יְהוֹזָבָ֑ד וְ/עִמּ֛/וֹ מֵאָֽה וּ/שְׁמוֹנִ֥ים אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/018.yaml
  text: And at his side was Jehozabad[b][a], and with him were 180,000 armed for war.
  footnotes:
  - marker: a
    text: Hebrew 'at his hand'; this idiom can also suggest being under someone's direction or stationed alongside him.
    reason: lexical_alternative
  - marker: b
    text: Or '180,000 troops equipped for war.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 곁에는 여호자밧이 있었고, 그와 함께 전쟁에 무장한 자가 18만 명 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘그의 손 곁/옆’에 해당하며, ‘그의 지휘 아래’라는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전쟁에 갖춰진 18만 명’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל יָד֖/וֹ
  english_pob_choice: And at his side
  chosen_korean: 그의 곁에는
  alternatives_korean:
  - 그의 옆에는
  - 그의 손 아래에는
  - 그의 지휘 아래에는
  lexicon: HALOT
  rationale: 히브리어 관용구 עַל יָד는 문자적으로는 ‘손 곁/옆’이지만, 여기서는 인물과 병력의 연관을 자연스럽게 나타내므로 ‘그의 곁에는’으로 옮겨 관용성을 살렸습니다.
- source_word: יְהוֹזָבָד
  english_pob_choice: Jehozabad
  chosen_korean: 여호자밧
  alternatives_korean:
  - 여호사밧
  - 예호자밧
  lexicon: 고유명사 음역
  rationale: 히브리어 인명은 현대 외래어 표기 관행에 따라 음역하되, 본문의 인물명 형태를 유지하기 위해 ‘여호자밧’으로 적었습니다.
- source_word: וְעִמּ֛/וֹ
  english_pob_choice: and with him were
  chosen_korean: 그와 함께
  alternatives_korean:
  - 그와 함께 있었습니다
  - 그와 동행한
  lexicon: HALOT
  rationale: עִם + 대명사 접미사는 동반·연관을 나타내므로, 군사 목록 문맥에서 자연스러운 한국어로 ‘그와 함께’라고 옮겼습니다.
- source_word: חֲלוּצֵ֥י צָבָֽא
  english_pob_choice: 180,000 armed for war
  chosen_korean: 전쟁에 무장한 자가
  alternatives_korean:
  - 전쟁을 위해 갖춰진 자가
  - 전투에 대비한 군사들이
  lexicon: HALOT
  rationale: חֲלוּצֵי צָבָא는 전쟁을 위해 준비되거나 무장한 병력을 가리키므로, 영어 POB의 ‘armed for war’에 맞춰 ‘전쟁에 무장한 자’로 번역해 전투 준비 상태를 드러냈습니다.
- source_word: מֵאָֽה וּ/שְׁמוֹנִ֥ים אֶ֖לֶף
  english_pob_choice: 180,000
  chosen_korean: 18만 명
  alternatives_korean:
  - 18만
  - 18만 천
  lexicon: HALOT
  rationale: 히브리어 수사는 현대 한국어에서 읽기 쉬운 표기인 ‘18만 명’으로 옮겨 군사 수량임을 분명히 했습니다.
