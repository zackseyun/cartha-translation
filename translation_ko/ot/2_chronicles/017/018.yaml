translation:
  language: ko
  text: 그의 곁에는[a] 여호사밧이 있었고, 그와 함께 전쟁을 위해 무장한 병사들[b]이 18만 명 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 ‘그의 손 곁에’입니다. 이 관용구는 그의 곁에 있거나 그의 지휘 아래 있음을 시사할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘전쟁을 위해 갖추어진 18만 명의 병사들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
