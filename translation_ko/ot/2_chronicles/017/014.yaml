  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
  footnotes:
  - marker: a
    text: Or 'their number' or 'their enrollment'; the Hebrew term can refer to a census, muster, or the resulting arrangement of troops.
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 그들의 가문별 징집된 편성입니다. 유다의 경우 천부장들, 곧 지휘관 아드나와 그와 함께한 용맹한 전사 삼십만 명이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘징집된 편성’은 히브리어 פְקֻדָּתָם의 뜻을 따라, ‘수효’·‘등록’·‘편성’의 가능성을 함께 반영한 번역입니다.
    reason: lexical_alternative
