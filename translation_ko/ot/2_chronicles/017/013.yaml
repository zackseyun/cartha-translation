  text: And he had much work in the cities of Judah, and men of war, mighty men of valor, in Jerusalem.
translation:
  language: ko
  text: 그리고 그에게는 유다의 여러 성읍에서 할 일이 많았고, 또 예루살렘에는 전쟁하는 사람들과 용맹한 용사들이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 מְלָאכָה는 여기서 '재산'보다 '일, 할 일, 업무'의 뜻으로 이해하는 것이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלָאכָה רַבָּה / much work
  english_pob_choice: much work
  chosen_korean: 할 일이 많았고
  alternatives_korean:
  - 일이 많았고
  - 큰 일이 많았고
  - 많은 업무가 있었고
  lexicon: מְלָאכָה
  rationale: WLC의 מְלָאכָה는 단순한 '재산'이 아니라 노동·일거리·업무를 가리키므로, POB의 'work'를 따라 자연스럽게 '할 일'로 옮겼습니다.
- source_word: אַנְשֵׁי מִלְחָמָה
  english_pob_choice: men of war
  chosen_korean: 전쟁하는 사람들
  alternatives_korean:
  - 전사들
  - 전쟁의 사람들
  - 전쟁의 용사들
  lexicon: אִישׁ / אֲנָשִׁים + מִלְחָמָה
  rationale: 직역적이되 한국어에서 어색하지 않게 '전쟁하는 사람들'로 옮겨, 전투에 종사하는 사람들임을 드러냈습니다.
- source_word: גִּבּוֹרֵי חַיִל
  english_pob_choice: mighty men of valor
  chosen_korean: 용맹한 용사들
  alternatives_korean:
  - 큰 용사들
  - 강한 용사들
  - 무용한 사람들
  lexicon: גִּבּוֹר / חַיִל
  rationale: 전통적 '용사'를 살리되, חַיִל의 강인함·능력을 '용맹한'으로 보완하여 POB의 중첩 강조를 반영했습니다.
- source_word: בִּירוּשָׁלִָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에는
  alternatives_korean:
  - 예루살렘에
  - 예루살렘 안에
  lexicon: יְרוּשָׁלַ͏ִם
  rationale: 장소부사구를 한국어 문장 흐름에 맞게 배치해, 절의 병렬 구조를 자연스럽게 유지했습니다.
theological_decisions:
- issue: 군사 표현의 중복 강조
  chosen_reading: '''전쟁하는 사람들, 용맹한 용사들''로 원문의 이중 표현을 모두 살렸습니다.'
  alternative_readings:
  - '''군인들, 용사들''로 축약'
  - '''전사들과 장사들''로 완화'
  rationale: אַנְשֵׁי מִלְחָמָה와 גִּבּוֹרֵי חַיִל은 의미가 겹치지만 동일하지 않으므로, 군사적 역량의 강조를 약화시키지 않기 위해 둘 다 번역했습니다.
  doctrine_reference: source-faithfulness / semantic redundancy
- issue: מְלָאכָה의 의미
  chosen_reading: '''재산''이 아니라 ''할 일''로 번역했습니다.'
  alternative_readings:
  - '''재산'''
  - '''업무'''
  rationale: POB의 최신 확정본이 'work'로 되돌아간 점과 히브리어 어휘상 의미를 반영해, 본문을 경제적 소유가 아니라 왕의 행정·노무 상황으로 읽게 했습니다.
  doctrine_reference: lexical integrity
