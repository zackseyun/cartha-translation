id: 2CH.17.9
reference: 2 Chronicles 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְלַמְּדוּ֙ בִּֽ/יהוּדָ֔ה וְ/עִ֨מָּ/הֶ֔ם סֵ֖פֶר תּוֹרַ֣ת יְהוָ֑ה וַ/יָּסֹ֨בּוּ֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה וַֽ/יְלַמְּד֖וּ בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
  footnotes:
  - marker: a
    text: Or 'the scroll of the Law of the LORD.' The Hebrew word can denote a written document in scroll form.
    reason: lexical_alternative
  - marker: b
    text: Or 'and taught the people.' The Hebrew more literally says 'taught among the people.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with the Book of the Law of the LORD with them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 유다에서 가르쳤으며, 야훼의 율법책이 그들과 함께 있었고[a], 유다의 모든 성읍을 두루 다니며 백성 가운데서 가르쳤습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 율법 두루마리’일 수 있습니다. 히브리어 סֵפֶר는 두루마리 형태의 문서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그리고 백성을 가르쳤습니다.’ 히브리어는 더 문자적으로 ‘백성 가운데서 가르쳤습니다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ / וַיְלַמְּד֖וּ
  english_pob_choice: They taught / and taught
  chosen_korean: 가르쳤으며 / 가르쳤습니다
  alternatives_korean:
  - 가르쳤고 / 가르쳤습니다
  - 교훈했습니다
  lexicon: HALOT
  rationale: למד의 피엘형은 ‘가르치다/교육하다’가 자연스럽고, 본문에 두 번 반복되는 동사를 그대로 살려 행위의 지속성과 반복성을 유지했습니다.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  english_pob_choice: the Book of the Law of Yahweh
  chosen_korean: 야훼의 율법책
  alternatives_korean:
  - 야훼의 율법의 책
  - 야훼의 법책
  lexicon: HALOT
  rationale: סֵפֶר는 여기서 구체적인 문서로서 ‘책’이 가장 직설적이고, תּוֹרָה는 이 결합에서 ‘율법’이 본문의 언약적 법문 집합을 분명히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명 표기는 대체어가 아니라 고유명으로 드러내야 하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיָּסֹבּוּ בְּכָל עָרֵי יְהוּדָה
  english_pob_choice: they went around through all the cities of Judah
  chosen_korean: 유다의 모든 성읍을 두루 다니며
  alternatives_korean:
  - 유다의 모든 성읍을 돌아다니며
  - 유다의 모든 성읍을 두루 돌며
  lexicon: HALOT
  rationale: סבב은 이 문맥에서 순회하며 다니는 뜻이므로, 현대 한국어에서 자연스럽고 반복적 순회를 나타내는 ‘두루 다니며’를 선택했습니다.
- source_word: בָּעָם
  english_pob_choice: among the people
  chosen_korean: 백성 가운데서
  alternatives_korean:
  - 백성에게
  - 백성들 사이에서
  lexicon: HALOT
  rationale: 전치사 ב가 직접목적어가 아니라 ‘~가운데에서/사이에’라는 위치 관계를 나타내므로, POB의 주석 취지를 따라 ‘백성 가운데서’로 보존했습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 야훼를 고유명으로 유지했습니다.
  alternative_readings:
  - 여호와로 옮김
  - 주님으로 대체
  rationale: 이 절은 여호와의 율법이라는 일반적 표현이 아니라, 언약 백성에게 주어진 하나님의 고유한 이름을 직접 포함하므로 대체 칭호보다 음역이 स्रोत의 신학적 분별을 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
