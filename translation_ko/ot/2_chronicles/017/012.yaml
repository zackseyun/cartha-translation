  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
  footnotes:
  - marker: a
    text: Or 'citadels' for 'fortresses.' The Hebrew denotes fortified strongholds.
    reason: lexical_alternative
  - marker: b
    text: Or 'storage cities' or 'supply cities.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호사밧은 점점 더 강성해져 갔으며, 유다에 요새들과 저장 성읍들을 건축했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘요새들’은 히브리어가 가리키는 방어용 견고한 거점의 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘저장 성읍들’은 ‘storage cities / supply cities’에 해당하는 행정·군사적 비축 도시를 가리킵니다.
    reason: lexical_alternative
