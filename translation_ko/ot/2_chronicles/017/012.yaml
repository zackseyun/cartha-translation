theological_decisions:
- issue: 왕의 번영 묘사에서 강성함의 의미
  chosen_reading: 여호사밧의 상태를 개인적 성장뿐 아니라 왕권과 국가 기반의 확장까지 포함하는 '강성해짐'으로 넓게 반영했습니다.
  alternative_readings:
  - 더 커졌다
  - 번영했다
  - 위대해졌다
  rationale: 문맥상 단순한 신체적·개인적 성장보다 통치의 확장과 국력의 증대를 가리키므로, 독자에게 오해 없이 전달되는 표현을 택했습니다.
  doctrine_reference: 왕정사 문맥에서의 번영과 하나님의 섭리
