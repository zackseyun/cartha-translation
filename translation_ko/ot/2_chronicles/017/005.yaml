  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
  footnotes:
  - marker: a
    text: Or 'gift,' 'present,' or 'offering' for 'tribute' (Hebrew minchah); here the royal context favors 'tribute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 야훼께서 그의 손에 왕국을 견고하게 하셨고, 온 유다가 여호사밧에게 조공을 바쳤으며, 그에게는 재물과 존귀가 풍성하게 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조공’은 כאן의 מִנְחָה를 왕권 문맥에 따라 풀어 옮긴 것입니다. 일반적으로는 ‘예물’, ‘선물’, ‘헌물’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 번역본의 원칙에 따라 여호와 대신 고유한 신명 표기인 야훼를 사용하여, 본문이 지칭하는 언약의 이름을 직접 드러냈습니다.
- source_word: וַיָּכֶן
  english_pob_choice: established
  chosen_korean: 견고하게 하셨고
  alternatives_korean:
  - 세우셨고
  - 확립하셨고
  - 굳게 하셨고
  lexicon: HALOT
  rationale: 왕권을 정치적으로 안정시키는 의미를 살리기 위해 ‘견고하게 하다’를 택했으며, 단순한 물리적 강화보다 통치의 확립을 잘 드러냅니다.
- source_word: מִנְחָה
  english_pob_choice: tribute
  chosen_korean: 조공
  alternatives_korean:
  - 예물
  - 선물
  - 헌물
  lexicon: HALOT
  rationale: 왕권 문맥에서 מִנְחָה는 일반적 ‘예물’보다 통치자에게 바치는 공물의 성격이 강하므로, 의미를 분명히 하는 ‘조공’을 사용했습니다.
- source_word: כָבוֹד
  english_pob_choice: honor
  chosen_korean: 존귀
  alternatives_korean:
  - 명예
  - 영광
  - 존경
  lexicon: HALOT
  rationale: 궁정적·신분적 맥락에서 공적인 위신과 높임을 가리키므로, 하나님께만 돌리는 ‘영광’보다 ‘존귀’가 더 정확합니다.
theological_decisions:
- issue: 왕권의 주체와 신적 행위의 관계
  chosen_reading: 야훼께서 왕국을 여호사밧의 손에 견고하게 하신 결과, 유다가 그에게 조공을 바치고 그가 부와 존귀를 누리게 되었다고 읽습니다.
  alternative_readings:
  - 야훼가 단지 외적 번영을 허락하신 것으로 약화하여 읽는 방식
  - ‘그의 손에’의 이미지를 풀어 단순히 ‘그를 통해’로 일반화하는 방식
  rationale: 본문은 왕국의 안정, 백성의 조공, 개인의 부와 존귀를 모두 야훼의 주권적 행위 아래 연결합니다. 따라서 통치의 정당성과 번영이 하나님에게서 왔다는 점을 보존해야 합니다.
  doctrine_reference: '구약의 왕권 신학: 하나님이 왕국을 세우시고 번영을 주시는 주권자이심'
