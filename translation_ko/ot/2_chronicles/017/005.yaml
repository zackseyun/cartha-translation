  source_fidelity: 본문은 대체로 히브리어의 순서와 의미를 충실히 옮겼습니다. 다만 מִנְחָה는 왕에게 드리는 공물의 뜻이 문맥상 유력하나, ‘조공’은 종속국이 강제적으로 바치는 물품이라는 뉘앙스를 더할 수 있어 ‘공물’이 원문의 폭을 더 안전하게 보존합니다. ‘그의 손에’는 여호사밧의 통치 아래 왕국을 굳게 세우셨다는 히브리어 관용을 잘 반영합니다.
  naturalness: ‘그의 손에 왕국을 견고하게 하셨고’도 이해되지만, 현대 표준어에서는 ‘그의 손에 왕국을 굳게 세워 주셨고’가 더 자연스럽고 문장 결속도 좋습니다. ‘재물과 존귀가 풍성하게 있었습니다’는 자연스럽습니다.
  terminology: ‘야훼’, ‘여호사밧’, ‘왕국’, ‘재물’, ‘존귀’는 적절합니다. 각주의 ‘כאן의 מִנְחָה’는 히브리어 כאן(‘여기’)이 잘못 삽입된 형태이므로, 해당 어휘를 직접 ‘히브리어 מִנְחָה’로 밝혀야 합니다.
