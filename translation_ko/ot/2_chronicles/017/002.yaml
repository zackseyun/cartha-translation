source:
  edition: WLC
  text: וַ/יִּ֨תֶּן חַ֔יִל בְּ/כָל עָרֵ֥י יְהוּדָ֖ה הַ/בְּצֻר֑וֹת וַ/יִּתֵּ֤ן נְצִיבִים֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/עָרֵ֣י אֶפְרַ֔יִם אֲשֶׁ֥ר לָכַ֖ד אָסָ֥א אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
  footnotes:
  - marker: a
    text: Or 'governors,' 'deputies,' or 'prefects' for 'garrisons' (Heb. נְצִיבִים); the term can denote appointed officials as well as military posts, but the military context here favors 'garrisons.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 유다의 모든 견고한 성읍들에 군대를 두고, 유다의 땅과 그의 아버지 아사가 점령한 에브라임의 성읍들에 수비대를 배치했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수비대’는 히브리어 נְצִיבִים의 군사적 용법을 따른 번역입니다. 이 단어는 문맥에 따라 관리·대리관을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  english_pob_choice: he stationed forces
  chosen_korean: 군대를 두고
  alternatives_korean:
  - 군대를 주고
  - 병력을 배치하고
  - 군사력을 두고
  lexicon: HALOT
  rationale: חַיִל은 여기서 군사력/병력을 가리키며, 장소에 배치하는 문맥이므로 ‘군대를 두다’가 가장 자연스럽고 원문의 행정·군사 의미를 살립니다.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  english_pob_choice: in all the fortified cities of Judah
  chosen_korean: 유다의 모든 견고한 성읍들에
  alternatives_korean:
  - 유다의 모든 요새 성읍들에
  - 유다의 모든 fortified cities에
  lexicon: HALOT
  rationale: הַבְּצֻרוֹת은 성읍의 방어 상태를 나타내므로 관용적으로 ‘견고한 성읍들’로 옮겨 현대 한국어에서 자연스럽게 전달했습니다.
- source_word: וַיִּתֵּן נְצִיבִים
  english_pob_choice: he placed garrisons
  chosen_korean: 수비대를 배치했습니다
  alternatives_korean:
  - 주둔군을 두었습니다
  - 감독관들을 세웠습니다
  - 대리들을 임명했습니다
  lexicon: HALOT
  rationale: נְצִיבִים은 행정관/대리인 뜻도 있지만 여기서는 요새화와 군사 배치 문맥이므로 POB처럼 수비대 의미를 살려 ‘수비대’로 옮겼습니다.
- source_word: וּבְעָרֵי אֶפְרַיִם אֲשֶׁר לָכַד אָסָא אָבִיו
  english_pob_choice: and in the cities of Ephraim that Asa his father had captured
  chosen_korean: 그의 아버지 아사가 점령한 에브라임의 성읍들에
  alternatives_korean:
  - 그의 아버지 아사가 사로잡은 에브라임의 성읍들에
  - 아사가 빼앗은 에브라임의 성읍들에
  lexicon: HALOT
  rationale: לָכַד는 성읍을 무력으로 ‘점령/함락하다’의 뜻이므로, ‘점령한’이 군사적 결과를 가장 분명하게 드러냅니다.
