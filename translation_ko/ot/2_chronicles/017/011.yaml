- from: 그리고 블레셋 사람들 가운데서도 여호사밧에게 조공과 은, 곧 무거운 짐을 가져오는 이들이 있었으며, 아라비아 사람들도 그에게 양 떼를 가져왔습니다. 곧 숫양 7,700마리와 숫염소 7,700마리였습니다.[a][b]
  to: 그리고 블레셋 사람들 중에는[a] 여호사밧에게 조공과 은 한 짐[b]을 가져오는 이들도 있었으며, 아라비아 사람들도 그에게 양과 염소 떼를 가져왔습니다. 곧 숫양 7,700마리와 숫염소 7,700마리였습니다.
  rationale: 원문의 애매한 מִן은 본문에서 ‘블레셋 사람들 중에는’으로 보존하고 각주에서 출처 의미를 밝혔습니다. ‘은 한 짐’은 כֶסֶף מַשָּׂא의 운반 단위를 반영하되 원문에 없는 ‘무거운’을 보태지 않습니다. צֹאן은 뒤따르는 양과 염소의 열거에 맞추어 ‘양과 염소 떼’로 수정했습니다.
