  text: וּ/מִן פְּלִשְׁתִּ֗ים מְבִיאִ֧ים לִֽ/יהוֹשָׁפָ֛ט מִנְחָ֖ה וְ/כֶ֣סֶף מַשָּׂ֑א גַּ֣ם הָֽ/עַרְבִיאִ֗ים מְבִיאִ֥ים ל/וֹ֙ צֹ֕אן אֵילִ֔ים שִׁבְעַ֤ת אֲלָפִים֙ וּ/שְׁבַ֣ע מֵא֔וֹת וּ/תְיָשִׁ֕ים שִׁבְעַ֥ת אֲלָפִ֖ים וּ/שְׁבַ֥ע מֵאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
  footnotes:
  - marker: a
    text: Or 'from the Philistines'; the Hebrew may emphasize source rather than a partitive sense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'silver, a load'—that is, silver carried as tribute.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 블레셋 사람들 가운데서도 여호사밧에게 조공과 은, 곧 무거운 짐을 가져오는 이들이 있었으며, 아라비아 사람들도 그에게 양 떼를 가져왔습니다. 곧 숫양 7,700마리와 숫염소 7,700마리였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘블레셋 사람들로부터’일 수 있습니다. 히브리어는 일부를 뜻하기보다 출처를 강조할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘은, 곧 짐’의 뜻입니다. 곧 공물로 운반된 은을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִן פְּלִשְׁתִּים
  english_pob_choice: And some of the Philistines
  chosen_korean: 블레셋 사람들 가운데서도
  alternatives_korean:
  - 블레셋 사람들로부터
  - 블레셋 사람들 중 일부가
  lexicon: HALOT
  rationale: מִן은 출처를 가리킬 수도 있고 일부를 뜻할 수도 있어, 문맥상 ‘가운데서도’가 일부/출처의 여지를 함께 살립니다.
- source_word: מִנְחָה וְכֶסֶף מַשָּׂא
  english_pob_choice: tribute and silver, a burden
  chosen_korean: 조공과 은, 곧 무거운 짐
  alternatives_korean:
  - 조공과 은, 곧 짐
  - 조공과 은, 곧 운반물
  lexicon: HALOT
  rationale: מִנְחָה는 정치적 맥락에서 ‘조공’이 자연스럽고, כֶסֶף מַשָּׂא의 직역인 ‘은, 곧 무거운 짐’은 은이 공물로 실려 온 구체성을 보존합니다.
- source_word: גַּם הָעַרְבִיאִים
  english_pob_choice: the Arabians also
  chosen_korean: 아라비아 사람들도
  alternatives_korean:
  - 아라비아인들도
  - 아랍 사람들도
  lexicon: HALOT
  rationale: גַּם의 첨가 의미를 ‘-도’로 살리고, 이 역사 문맥의 민족명은 ‘아라비아 사람들’이 무난합니다.
- source_word: צֹאן אֵילִים ... וּתְיָשִׁים
  english_pob_choice: 'flocks: 7,700 rams and 7,700 male goats'
  chosen_korean: 양 떼를 가져왔습니다. 곧 숫양 7,700마리와 숫염소 7,700마리였습니다.
  alternatives_korean:
  - 가축 떼를 가져왔습니다. 곧 숫양 7,700마리와 숫염소 7,700마리였습니다.
  - 양 떼를 가져왔습니다. 곧 숫양 7,700마리와 수염소 7,700마리였습니다.
  lexicon: HALOT
  rationale: צֹאן은 집합명사로 ‘양 떼’가 자연스럽고, אֵילִים/תְיָשִים은 각각 숫양/숫염소로 구분해 숫자와 함께 명확하게 옮겼습니다.
theological_decisions:
- issue: 왕에게 드리는 외국 민족의 헌납을 어떻게 표현할지
  chosen_reading: 예루살렘 성전 헌물 용어인 ‘제물’로 바꾸지 않고, 정치적 관계를 드러내는 ‘조공’으로 옮겼습니다.
  alternative_readings:
  - 제물
  - 예물
  - 헌납
  rationale: 본문은 제의적 제물이 아니라 왕에게 바치는 외교적 공물을 말하므로, ‘조공’이 מקור의 의미를 가장 분명하게 전달합니다.
  doctrine_reference: 본문 문맥(열왕/역대의 왕권과 조공 서술)
