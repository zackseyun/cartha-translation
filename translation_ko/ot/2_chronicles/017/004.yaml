revisions:
- from: 그런데 그는 자기 아버지의 하나님을 찾고, 그분의 계명들 안에서 걸었으며, 이스라엘의 행위대로 하지 않았습니다.[a][b]
  to: 그런데 그는 그의 아버지의 하나님을 구하며, 그분의 계명을 따라 걸었고, 이스라엘의 행위대로 하지 않았습니다.[a][b]
  rationale: 수정은 한국어의 자연스러운 현대 합쇼체를 위해 최소한으로 시행했습니다. ‘계명을 따라 걸었다’는 원문의 ‘걷다’ 은유를 유지하면서 한국어의 관용적 결합을 따릅니다. כִּי의 역접적 번역은 문맥상 유지하되, 각주에서 인과적 대안을 중복 없이 제시했습니다. ‘이스라엘’은 본문 그대로 보존했습니다.
