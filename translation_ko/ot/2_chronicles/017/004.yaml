source:
  edition: WLC
  text: כִּ֠י לֵֽ/אלֹהֵ֤י אָבִי/ו֙ דָּרָ֔שׁ וּ/בְ/מִצְוֺתָ֖י/ו הָלָ֑ךְ וְ/לֹ֖א כְּ/מַעֲשֵׂ֥ה יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
  footnotes:
  - marker: a
    text: Or 'for he sought the God of his father.' The Hebrew conjunction can also be rendered 'for' or 'because'; 'but' is used in the main text to bring out the contrast with the previous verse.
    reason: lexical_alternative
  - marker: b
    text: '''Israel'' here likely refers to the northern kingdom in contrast with Judah.'
    reason: cultural_note
translation:
  language: ko
  text: 그런데 그는 그의 아버지의 하나님을 구하며, 그분의 계명을 따라 걸었고, 이스라엘의 행위대로 하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘’은 여기서 유다와 대비되는 북쪽 왕국을 가리킬 가능성이 높습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 כִּי는 ‘왜냐하면’ 또는 ‘~이기 때문에’로도 옮길 수 있습니다. 본문에서는 앞 절과의 대비를 살리기 위해 ‘그런데’를 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: but
  chosen_korean: 그런데
  alternatives_korean:
  - 왜냐하면
  - 그리고
  lexicon: HALOT
  rationale: 문맥상 바로 앞 절의 이스라엘의 행위와 대비를 이루므로, 한국어에서는 역접을 자연스럽게 드러내는 ‘그런데’가 적절합니다.
- source_word: לֵאלֹהֵי אָבִיו
  english_pob_choice: the God of his father
  chosen_korean: 자기 아버지의 하나님
  alternatives_korean:
  - 그의 아버지의 하나님
  - 조상들의 하나님
  lexicon: HALOT
  rationale: 단수 소유격을 살려 혈통적·언약적 연속성을 드러내되, 현대 한국어에서 자연스럽게 읽히도록 ‘자기 아버지의 하나님’으로 옮겼습니다.
- source_word: דָּרָשׁ
  english_pob_choice: sought
  chosen_korean: 찾고
  alternatives_korean:
  - 구하고
  - 여쭙고
  lexicon: HALOT
  rationale: דרש의 신앙적 ‘찾다/구하다’ 의미를 살리면서, 현대 합쇼체 문맥에서 하나님을 향한 전념을 자연스럽게 드러내는 ‘찾고’를 선택했습니다.
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  english_pob_choice: walked in his commandments
  chosen_korean: 그분의 계명들 안에서 걸었으며
  alternatives_korean:
  - 그분의 계명들을 따라 걸었으며
  - 그분의 계명 안에서 행했으며
  lexicon: HALOT
  rationale: ‘걷다’라는 성경적 은유를 보존해 삶의 방식 전체를 가리키는 의미를 살렸고, 복수형 ‘계명들’도 반영했습니다.
- source_word: כְּמַעֲשֵׂה יִשְׂרָאֵל
  english_pob_choice: according to the deeds of Israel
  chosen_korean: 이스라엘의 행위대로
  alternatives_korean:
  - 이스라엘의 행실처럼
  - 이스라엘이 행한 대로
  lexicon: HALOT
  rationale: מַעֲשֶׂה를 단순한 ‘일’이 아니라 생활 양식·관행으로 이해하여 ‘행위’로 옮겼고, 비교 의미를 담는 ‘대로’를 사용했습니다.
theological_decisions:
- issue: ‘이스라엘’의 지시 대상
  chosen_reading: 본문의 표면 형태를 따라 ‘이스라엘’을 그대로 유지했습니다.
  alternative_readings:
  - 북이스라엘
  - 이스라엘 왕국
  rationale: 역사적 지시 대상은 문맥상 북왕국일 가능성이 높지만, 본문이 직접 말하는 표현을 본문에서 확장하지 않는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: original-language primacy; preserve interpretive tension in translation
