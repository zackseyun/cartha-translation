  source_fidelity: 히브리어의 핵심 대조, ‘그 아버지의 하나님’을 찾음, 계명을 따라 삶, 이스라엘의 행위를 따르지 않음을 전반적으로 충실히 반영합니다. 다만 ‘계명들 안에서 걸었다’는 히브리어 은유를 기계적으로 옮겨 한국어로는 부자연스럽습니다. ‘계명을 따라 걸었다’는 은유와 준수의 뜻을 함께 보존합니다.
  naturalness: ‘자기 아버지의 하나님’은 의미상 가능하나, 본문 서술에서 ‘자기’는 다소 불필요하게 구어적이고 지시가 흐릴 수 있습니다. ‘그의 아버지의 하나님’이 더 자연스럽고 원문의 단수 소유 관계를 분명히 합니다. 하나님을 대상으로 한 דרש는 한국어 성경 문체에서 ‘구하다’가 ‘찾다’보다 자연스럽습니다.
  terminology: ‘하나님’, ‘계명’, ‘이스라엘’은 적절합니다. ‘이스라엘’은 본문에서 확장하지 않고 유지해야 하며, 북왕국일 가능성은 각주로 처리하는 것이 적절합니다.
