  yaml_path: translation/ot/2_chronicles/017/017.yaml
  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
  footnotes:
  - marker: a
    text: Or 'bearing bows and shields' or 'equipped with bow and shield.' The Hebrew participle indicates men furnished with these weapons.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 베냐민에서는 엘리아다가 있었는데, 그는 용맹한 용사였고, 그와 함께 활과 방패를 갖춘 사람 이십만 명이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사 נֹשְׁקֵי는 문자적으로는 ‘활과 방패를 갖춘/지닌’ 상태를 가리키므로, 영어 POB의 대안처럼 ‘무장한’보다 장비 상태를 더 직접적으로 드러낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  english_pob_choice: And from
  chosen_korean: 그리고 …에서는
  alternatives_korean:
  - 그리고 …에서
  - …에서
  lexicon: HALOT
  rationale: 지파 목록에 추가되는 항목임을 살리되, 한국어에서는 자연스러운 연결을 위해 ‘그리고’를 두고 소속 처소는 ‘에서는’으로 풀어 옮겼습니다.
- source_word: גִּבּוֹר חַיִל
  english_pob_choice: a mighty man of valor
  chosen_korean: 용맹한 용사
  alternatives_korean:
  - 용맹한 전사
  - 큰 용사
  - 힘센 용사
  lexicon: HALOT
  rationale: 두 단어가 결합한 관용적 칭호로서 단순한 힘이 아니라 전투적 용맹을 함께 드러내는 표현으로 옮겼습니다.
- source_word: נֹשְׁקֵי קֶשֶׁת וּמָגֵן
  english_pob_choice: armed with bow and shield
  chosen_korean: 활과 방패를 갖춘 사람
  alternatives_korean:
  - 활과 방패를 든 사람
  - 활과 방패를 지닌 사람
  - 활과 방패로 무장한 사람
  lexicon: HALOT
  rationale: 히브리어 분사 נֹשְׁקֵי는 무기를 ‘갖춘/지닌’ 상태를 뜻하므로, 단순 보유보다 장비 상태를 드러내는 한국어로 옮겼습니다. 활과 방패는 집합적으로 읽었습니다.
- source_word: מָאתַיִם אָלֶף
  english_pob_choice: two hundred thousand
  chosen_korean: 이십만 명
  alternatives_korean:
  - 이백천 명
  - 20만 명
  lexicon: HALOT
  rationale: 히브리어 수사 구문을 한국어 관용법에 따라 ‘이십만 명’으로 자연스럽게 표기했습니다.
