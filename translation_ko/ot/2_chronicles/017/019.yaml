  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
  footnotes:
  - marker: a
    text: Or 'besides those whom the king had placed in the fortified cities throughout all Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이들은 왕을 섬기는 사람들이었습니다. 이 밖에도 왕이 온 유다의 견고한 성읍들에 배치한 사람들이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕이 온 유다의 견고한 성읍들에 두신 사람들”로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשָׁרְתִים
  english_pob_choice: serving
  chosen_korean: 섬기는 사람들
  alternatives_korean:
  - 섬기는 자들
  - 봉사하는 사람들
  - 시중드는 사람들
  lexicon: HALOT
  rationale: שׁרת의 기본 의미는 섬기다/시중들다이며, 여기서는 왕에 대한 공식적 봉사를 가리키므로 ‘섬기는 사람들’이 자연스럽고 문맥에 맞습니다.
- source_word: מִלְּבַד
  english_pob_choice: besides
  chosen_korean: 이 밖에도
  alternatives_korean:
  - 그 밖에
  - 별도로
  - ~외에
  lexicon: HALOT
  rationale: 앞선 집단과 구별되는 추가 집단을 나타내므로, ‘이 밖에도’가 제외와 추가의 뉘앙스를 함께 살립니다.
- source_word: נָתַן
  english_pob_choice: had stationed
  chosen_korean: 배치한
  alternatives_korean:
  - 두신
  - 세운
  - 두게 한
  - 임명한
  lexicon: HALOT
  rationale: 전쟁·행정 맥락에서 נתן은 단순히 ‘주다’보다 직책이나 위치에 두다의 뜻이 강하므로, 성읍 방어를 위한 군사적 배치를 드러내는 ‘배치한’이 적절합니다.
- source_word: בְּעָרֵי הַמִּבְצָר
  english_pob_choice: in the fortified cities
  chosen_korean: 견고한 성읍들에
  alternatives_korean:
  - 요새 성읍들에
  - 요새화된 성읍들에
  - 튼튼한 성읍들에
  lexicon: HALOT
  rationale: מִבְצָר는 방어를 위해 강화된 성읍을 가리키므로, 성경적이면서도 현대 한국어에서 자연스러운 ‘견고한 성읍들’로 옮겼습니다.
