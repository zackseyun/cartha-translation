  text: 요시야가 예루살렘에서 야훼께 유월절을 지켰고, 그들은 첫째 달 열나흗날에 유월절 제물을 잡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 פֶּסַח는 절기 준수를 가리키고, 둘째 פֶּסַח는 잡는 제물로 읽힙니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּעַשׂ ... פֶּסַח
  english_pob_choice: kept the Passover
  chosen_korean: 유월절을 지켰고
  alternatives_korean:
