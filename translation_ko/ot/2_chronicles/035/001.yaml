  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
  footnotes:
  - marker: a
    text: Hebrew 'the Passover'; here the term refers to the Passover victim, hence 'the Passover lamb.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요시야가 예루살렘에서 야훼께 유월절을 지켰고, 그들은 첫째 달 열나흗날에 유월절 제물을[a] 잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פֶּסַח는 첫째 용례에서는 유월절 절기를 가리키고, 둘째 용례에서는 문맥상 잡는 유월절 제물을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וַיַּעַשׂ ... פֶּסַח
  english_pob_choice: kept the Passover
  chosen_korean: 유월절을 지켰고
  alternatives_korean:
  - 유월절을 행했고
  - 유월절을 지켰습니다
  - 유월절을 지켰으며
  lexicon: HALOT
  rationale: עשה + פֶּסַח는 단순히 '만들다'가 아니라 절기를 준수하다/지키다의 관용법이므로, 현대 한국어에서는 '지켰다'가 가장 자연스럽고 source-direct합니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 여호와께
  - 주님께
  lexicon: HALOT
  rationale: 본문의 신명은 YHWH이므로 프로젝트 기본값에 따라 '야훼'를 사용하고, ל는 헌정/지향을 나타내므로 '-께'로 옮겼습니다.
- source_word: וַיִּשְׁחֲטוּ הַפֶּסַח
  english_pob_choice: they slaughtered the Passover
  chosen_korean: 그들은 ... 유월절 제물을 잡았습니다
  alternatives_korean:
  - 그들은 ... 유월절을 잡았습니다
  - 그들은 ... 유월절 희생제물을 잡았습니다
  - 그들은 ... 유월절 제사를 드렸습니다
  lexicon: HALOT
  rationale: שׁחט는 제의적 도살이지만, 한국어에서는 '잡다'가 제물의 도살을 가장 직접적으로 표현합니다. 첫 פֶּסַח는 절기/준수 전체를, 둘째는 실제로 잡는 제물로 읽히므로 '유월절 제물'로 구분했습니다.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  english_pob_choice: on the fourteenth day of the first month
  chosen_korean: 첫째 달 열나흗날에
  alternatives_korean:
  - 첫째 달의 열나흗날에
  - 첫째 달 14일에
  - 정월 열나흗날에
  lexicon: HALOT
  rationale: 히브리어 날짜 표현을 한국어 관용 날짜순으로 간결하게 옮겼습니다. '첫째 달'은 원문을 직역하면서도 달력 표기를 분명하게 합니다.
theological_decisions:
- issue: 유월절 첫 번째 פֶּסַח의 의미 범위
  chosen_reading: 첫 번째 פֶּסַח는 절기 전체를 가리키는 '유월절'로, 두 번째 פֶּסַח는 실제로 잡는 제물로서 '유월절 제물'로 구분했습니다.
  alternative_readings:
  - 둘 다 '유월절'로 통일
  - 둘 다 '유월절 어린양'으로 통일
  rationale: 본문은 같은 শব্দ을 두 번 쓰지만 문맥 기능이 다릅니다. 첫째는 절기 준수, 둘째는 도살 대상이므로 의미 차이를 한국어에서 드러내는 편이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 문맥적 의미 구분 / 제의 용법
