  english_pob_choice: as prescribed in the writing of ... and in the writing of ...
  chosen_korean: …의 기록에 따라 그렇게 하십시오
  alternatives_korean:
  - …의 글에 따라 그렇게 하십시오
  - …의 문서에 따라 그렇게 하십시오
  - …에 기록된 대로 하십시오
