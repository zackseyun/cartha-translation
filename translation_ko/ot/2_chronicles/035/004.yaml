base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
  footnotes:
  - marker: a
    text: Or 'according to your fathers’ houses.' The Hebrew phrase refers to ancestral or paternal household groupings within Israel.
    reason: lexical_alternative
  - marker: b
    text: '''Divisions'' can also be rendered ''courses,'' especially in priestly or Levitical organizational contexts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 조상들의 집을 따라, 너희의 분반에 따라 준비하십시오[b][a]. 다윗 이스라엘 왕의 기록과 그의 아들 솔로몬의 기록에 따라 그렇게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상들의 집’은 히브리어의 ‘아버지들의 집’에 해당하며, 이스라엘의 가문·족속 단위를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘분반’은 제사장·레위인 조직에서 쓰이는 배정된 반차/편성의 뜻을 살린 번역입니다.
    reason: lexical_alternative
