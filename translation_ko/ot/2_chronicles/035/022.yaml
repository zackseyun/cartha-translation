    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 요시야는 그에게서 얼굴을 돌리지 않았습니다[a]. 오히려 그는 그와 싸우려고 변장했습니다. 그는 하나님의 입에서 나온 느고의 말[b]을 듣지 않고, 싸우러 므깃도 골짜기로 갔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게서 돌아서지 않았습니다.’
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘하나님의 입에서.’'
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘므깃도 평원에서.’
    reason: lexical_alternative
