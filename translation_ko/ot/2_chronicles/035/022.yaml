base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
  footnotes:
  - marker: a
    text: Or 'did not turn away from him.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''from the mouth of God.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'in the plain of Megiddo.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 요시야는 그에게서 얼굴을 돌리지 않았습니다[a]. 오히려 그는 그와 싸우려고 변장했습니다. 그는 하나님의 입에서 나온 느고의 말[b]을 듣지 않고, 므깃도 골짜기로 가서 싸웠습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게서 돌아서지 않았습니다.’
    reason: lexical_alternative
  - marker: b
    text: '히브리어: ‘하나님의 입에서.’'
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘므깃도 평원에서.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  english_pob_choice: did not turn his face away from him
  chosen_korean: 그에게서 얼굴을 돌리지 않았습니다
  alternatives_korean:
  - 그에게서 돌아서지 않았습니다
  - 그를 외면하지 않았습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴을 돌리다’ 이미지를 살리되, 한국어에서는 자연스럽고 문맥에 맞는 표현으로 옮겼습니다.
- source_word: הִתְחַפֵּשׂ
  english_pob_choice: disguised himself
  chosen_korean: 변장했습니다
  alternatives_korean:
  - 남의 모습으로 변장했습니다
  - 변복했습니다
  lexicon: HALOT
  rationale: 반사적 의미의 ‘자기 변장’이라는 기본 뜻을 간결하고 현대적인 한국어로 전달합니다.
- source_word: שָׁמַע אֶל
  english_pob_choice: did not listen to
  chosen_korean: 듣지 않고
  alternatives_korean:
  - 귀를 기울이지 않고
  - 듣고 따르지 않고
  lexicon: HALOT
  rationale: 문맥상 단순 청취가 아니라 수용/순종의 거절까지 포함하지만, 본문 수준에서는 가장 투명한 표현을 택했습니다.
- source_word: מִפִּי אֱלֹהִים
  english_pob_choice: from the mouth of God
  chosen_korean: 하나님의 입에서 나온
  alternatives_korean:
  - 하나님에게서 나온
  - 하나님의 말씀인
  lexicon: HALOT
  rationale: 히브리어 직유를 보존하여, 느고의 말이 본문 안에서 신적 기원을 가진 것으로 제시된다는 긴장을 그대로 드러냈습니다.
- source_word: בְּבִקְעַת מְגִדּוֹ
  english_pob_choice: in the Valley of Megiddo
  chosen_korean: 므깃도 골짜기
  alternatives_korean:
  - 므깃도 평원
  - 므깃도 계곡
  lexicon: HALOT
  rationale: בִּקְעָה의 지형적 의미를 한국어 성경 문체에 자연스럽게 반영했습니다.
theological_decisions:
- issue: 느고의 말이 실제로 하나님에게서 왔다는 진술을 어떻게 처리할지
  chosen_reading: 본문의 ‘하나님의 입에서 나온’이라는 직접 표현을 유지했습니다.
  alternative_readings:
  - ‘하나님에게서’로 완화할 수 있습니다.
  - 느고의 주장으로만 처리해 긴장을 약화시킬 수 있습니다.
  rationale: 역대기 기자가 제시하는 신학적 진술을 약화하지 않고, 해석상의 긴장을 본문 그대로 남기는 것이 원문 충실성에 더 맞습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolving it.'
