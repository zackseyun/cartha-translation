source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וַ/חֲסָדָ֑י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'Now the rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
  footnotes:
  - marker: a
    text: Or 'his faithful deeds,' 'his acts of loyalty,' or 'his kindnesses.' The Hebrew term can denote kindness, loyalty, or covenant faithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 요시야의 나머지 행적과 그의 신실한 사랑의 행위는 야훼의 율법에 기록된 바와 같습니다:[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘그의 신실한 행위들’, ‘그의 충성의 행위들’, ‘그의 친절들’로 옮길 수 있습니다. 이 히브리어 표현은 친절, 충성, 언약적 신실함을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 이제 남은
  alternatives_korean:
  - 그리고 나머지
  - 나머지
  lexicon: HALOT
  rationale: 문맥상 왕의 행적을 요약하는 결구이므로, 한국어에서는 자연스러운 전환 표현인 ‘이제’로 시작해 남아 있는 기록을 소개했습니다.
- source_word: דִּבְרֵי
  english_pob_choice: the acts of
  chosen_korean: 행적
  alternatives_korean:
  - 말들
  - 사실들
  - 일들
  lexicon: HALOT
  rationale: 왕 연대기 요약문에서 דִּבְרֵי는 문자적으로 ‘말들’이지만 실제로는 왕의 행위와 사건들을 가리키므로 ‘행적’이 가장 적절합니다.
- source_word: וַחֲסָדָיו
  english_pob_choice: his deeds of faithful love
  chosen_korean: 그의 신실한 사랑의 행위
  alternatives_korean:
  - 그의 충실한 행위
  - 그의 인애의 행위
  - 그의 언약적 신실함의 행위
  lexicon: HALOT
  rationale: חֶסֶד은 단순한 친절보다 언약적 충성/인애의 뉘앙스가 강하므로, ‘신실한 사랑’으로 옮겨 그 신학적 밀도를 살렸습니다.
- source_word: בְּתוֹרַת יְהוָה
  english_pob_choice: in the Law of Yahweh
  chosen_korean: 야훼의 율법에
  alternatives_korean:
  - 야훼의 가르침에
  - 야훼의 토라에
  lexicon: HALOT
  rationale: 이 역사 서술에서는 תּוֹרָה가 모세 율법을 가리키므로 ‘율법’이 가장 자연스럽고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 렌더링했습니다.
theological_decisions:
- issue: חֲסָדָיו의 신학적 뉘앙스
  chosen_reading: ‘신실한 사랑의 행위’로 옮겨 단순한 도덕적 선행보다 언약적 충성의 의미를 드러냈습니다.
  alternative_readings:
  - 그의 친절한 행위
  - 그의 충성스러운 행위
  - 그의 선행
  rationale: 요시야의 평가 문맥은 단순한 호의가 아니라 야훼와 율법에 대한 언약적 충실성을 가리키므로, 그 긴장을 보존하는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological weight; documented exception for חֶסֶד'
