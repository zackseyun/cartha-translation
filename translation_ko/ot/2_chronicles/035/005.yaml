  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עִמְד֣וּ בַ/קֹּ֗דֶשׁ לִ/פְלֻגּוֹת֙ בֵּ֣ית הָֽ/אָב֔וֹת לַ/אֲחֵי/כֶ֖ם בְּנֵ֣י הָ/עָ֑ם וַ/חֲלֻקַּ֥ת בֵּֽית אָ֖ב לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
  footnotes:
  - marker: a
    text: Or 'the lay people'—literally, 'the sons of the people,' distinguishing the non-Levitical Israelites from the Levites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너희는 거룩한 곳에 서서, 너희 형제들, 곧 백성의 아들들의 조상 가문들에 따른 분류와 레위인들을 위한 한 아버지 가문의 분할에 따라 서십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעִמְדוּ
  english_pob_choice: And stand
  chosen_korean: 그리고 … 서십시오
  alternatives_korean:
  - 서십시오
  - 그리고 서십시오
  - 서 있으십시오
  lexicon: HALOT
  rationale: 명령형 복수형의 직접 지시를 살리면서, 접속사 וְ도 문맥상 자연스럽게 ‘그리고’로 옮겼습니다.
- source_word: בַּקֹּדֶשׁ
  english_pob_choice: in the holy place
  chosen_korean: 거룩한 곳에
  alternatives_korean:
  - 성소에
  - 거룩한 장소에
  - 거룩한 곳 안에
  lexicon: HALOT
  rationale: 특정한 방 이름보다 성스러운 구역 전체를 가리키는 문맥이므로, ‘거룩한 곳’이 가장 직접적입니다.
- source_word: בְּנֵי הָעָם
  english_pob_choice: the sons of the people
  chosen_korean: 백성의 아들들
  alternatives_korean:
  - 백성
  - 평민들
  - 백성 사람들
  lexicon: HALOT
  rationale: 문자적으로 ‘백성의 아들들’을 유지해 레위인과 구별되는 일반 이스라엘 백성을 드러내되, 성별·종족 표지를 지우지 않았습니다.
- source_word: לִפְלֻגּוֹת ... וַחֲלֻקַּת
  english_pob_choice: according to the divisions ... and the division of
  chosen_korean: …에 따른 분류와 … 분할에 따라
  alternatives_korean:
  - …의 분열에 따라
  - …의 구분에 따라
  - …의 배치에 따라
  lexicon: HALOT
  rationale: פלגות/חלוקת의 조직적 ‘나뉨’ 의미를 살려 제사장·레위인 배치의 구조를 표현했습니다. 다만 한국어 문장에서는 두 번째 ל도 반영하여 ‘…에 따라’로 대응시켰습니다.
- source_word: בֵּית הָאָבוֹת / בֵּית אָב
  english_pob_choice: the fathers’ houses / a father’s house
  chosen_korean: 조상 가문들 / 한 아버지 가문
  alternatives_korean:
  - 아비들의 집들 / 아버지의 집
  - 부계 가문들 / 부계 가문
  lexicon: HALOT
  rationale: 관용구적 족보 단위를 한국어의 ‘가문’으로 풀어 의미를 분명히 하되, ‘아버지’ 요소는 유지해 원문 구조를 보존했습니다.
theological_decisions:
- issue: ‘백성의 아들들’과 레위인의 구별
  chosen_reading: 본문의 대비를 살려 ‘너희 형제들, 곧 백성의 아들들’로 옮겼습니다.
  alternative_readings:
  - 너희 동족
  - 평민들
  - 일반 백성
  rationale: 히브리어는 레위인이 아닌 이스라엘 공동체를 혈연적·사회적으로 구별해 말합니다. 이를 평탄화하면 본문의 제의적 배치 의미가 약해집니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
