- from: 그의 관리들도 백성과 제사장들과 레위 사람들을 위해 자원 제물을 바쳤습니다. 힐기야, 스가랴, 여히엘—하나님의 집의 지도자들—은 제사장들에게 2,600마리의 유월절 제물과 300마리의 소를 주었습니다.
  to: 그의 관리들도 백성과 제사장들과 레위 사람들을 위해 자원 예물을 바쳤습니다. 하나님의 성전 지도자들인 힐기야, 스가랴, 여히엘은 제사장들에게 유월절 제물 2,600마리와 소 300마리를 주었습니다.
  rationale: 두 표현만 안전하게 다듬었습니다. ‘자원 예물’은 לִנְדָבָה의 포괄적 명사 의미를 보존하며, ‘하나님의 성전 지도자들’은 נְגִידֵי בֵּית הָאֱלֹהִים의 문맥상 의미를 자연스러운 한국어로 전달합니다. 수량과 유월절 제물 및 소의 구분은 그대로 유지했습니다.
