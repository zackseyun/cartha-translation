reference: 2 Chronicles 35:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שָׂרָ֞י/ו לִ/נְדָבָ֥ה לָ/עָ֛ם לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם הֵרִ֑ימוּ חִלְקִיָּ֨ה וּ/זְכַרְיָ֜הוּ וִֽ/יחִיאֵ֗ל נְגִידֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים לַ/כֹּהֲנִ֞ים נָתְנ֣וּ לַ/פְּסָחִ֗ים אַלְפַּ֨יִם֙ וְ/שֵׁ֣שׁ מֵא֔וֹת וּ/בָקָ֖ר שְׁלֹ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
  footnotes:
  - marker: a
    text: Or "for the Passover sacrifices." The Hebrew plural may refer to the animals used for the Passover observance.
    reason: lexical_alternative
  - marker: b
    text: Or 'gave to the priests for the Passover offerings 2,600 and 300 cattle'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 관리들도 백성과 제사장들과 레위 사람들을 위해 자원 예물을 바쳤습니다. 하나님의 성전 지도자들인 힐기야, 스가랴, 여히엘은 제사장들에게 유월절 제물 2,600마리와 소 300마리를 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִנְדָבָה
  english_pob_choice: as a freewill offering
  chosen_korean: 자원 제물
  alternatives_korean:
  - 자원으로
  - 자원 헌물
  - 자원 예물
  lexicon: HALOT
  rationale: נְדָבָה는 단순한 태도보다 ‘자원하여 드리는 예물’이라는 명사적 의미가 핵심이므로, 한국어도 제물/예물 계열로 구체화했습니다.
- source_word: וְשָׂרָיו
  english_pob_choice: his officials
  chosen_korean: 그의 관리들
  alternatives_korean:
  - 그의 지도자들
  - 그의 방백들
  - 그의 장관들
  lexicon: HALOT
  rationale: 왕궁·행정 문맥에서 שָׂרִים은 지배층 전반을 가리킬 수 있어, 현대 한국어에서는 ‘관리들’이 가장 자연스럽고 과도한 귀족적 뉘앙스를 피합니다.
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  english_pob_choice: the leaders of the house of God
  chosen_korean: 하나님의 집의 지도자들
  alternatives_korean:
  - 하나님의 집의 감독들
  - 하나님의 집의 우두머리들
  - 하나님의 집의 통치자들
  lexicon: HALOT
  rationale: נָגִיד는 지도자/우두머리/통치자를 뜻할 수 있으나, 성전 행정 역할에 맞게 ‘지도자들’로 옮겼습니다.
- source_word: לַפְּסָחִים
  english_pob_choice: 2,600 Passover offerings
  chosen_korean: 2,600마리의 유월절 제물
  alternatives_korean:
  - 2,600마리의 유월절 희생제물
  - 2,600마리의 유월절 제사용 짐승
  - 2,600마리의 유월절 희생물
  lexicon: HALOT
  rationale: 히브리어 복수형은 유월절 의식에 쓰인 동물들을 가리킬 수 있으므로, POB의 판단을 따라 수량이 걸리는 대상이 드러나도록 ‘마리의 유월절 제물’로 옮겼습니다.
- source_word: וּבָקָר שְׁלֹשׁ מֵאוֹת
  english_pob_choice: and 300 cattle
  chosen_korean: 300마리의 소
  alternatives_korean:
  - 300마리의 가축
  - 300두의 소
  - 300마리의 큰가축
  lexicon: HALOT
  rationale: בָּקָר은 집합적으로 소/가축을 가리키지만, 제의 맥락에서 한국어로는 ‘소’가 가장 직접적이며 읽기에도 자연스럽습니다.
