revisions:
- from: 그 후에 그들은 자기들을 위해, 그리고 제사장들을 위해 준비하였는데, 제사장들 곧 아론의 아들들은 번제와 기름진 부분을 밤까지 드리는 일에 분주하였기 때문입니다. 그래서 레위인들이 자기들을 위해, 그리고 아론의 아들 제사장들을 위해 준비하였습니다.[a]
  to: 그 후에 그들은 자신들과 제사장들을 위하여 준비하였습니다.[a] 제사장들, 곧 아론의 자손들은 번제와 기름진 부분을 드리느라 밤까지 바빴기 때문입니다. 그래서 레위인들은 자신들과 아론의 자손인 제사장들을 위하여 준비하였습니다.[a]
  rationale: 반복되는 히브리어 대명사의 비재귀적 형태와 문맥상 유력한 재귀적 지시를 함께 보존하도록 각주를 두 용례 모두에 직접 연결했습니다. 또한 ‘자기들을’과 어색한 복합 명사를 현대 표준어 합쇼체에 맞게 다듬었으며, 제사장들이 밤까지 제의를 수행했기에 레위인들이 준비했다는 인과관계는 유지했습니다.
