  text: וְ/אַחַ֗ר הֵכִ֤ינוּ לָ/הֶם֙ וְ/לַ/כֹּ֣הֲנִ֔ים כִּ֤י הַ/כֹּהֲנִים֙ בְּנֵ֣י אַהֲרֹ֔ן בְּ/הַֽעֲל֛וֹת הָ/עוֹלָ֥ה וְ/הַ/חֲלָבִ֖ים עַד לָ֑יְלָה וְ/הַ/לְוִיִּם֙ הֵכִ֣ינוּ לָ/הֶ֔ם וְ/לַ/כֹּהֲנִ֖ים בְּנֵ֥י אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
  footnotes:
  - marker: a
    text: Or 'for them' in both occurrences of 'for themselves'; the Hebrew pronoun itself is not explicitly reflexive, but the context strongly suggests the Levites prepared for their own meal as well as for the priests.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 그들은 자신들과 제사장들을 위하여 준비하였습니다.[a] 제사장들, 곧 아론의 자손들은 번제와 기름진 부분을 드리느라 밤까지 바빴기 때문입니다. 그래서 레위인들은 자신들과 아론의 자손인 제사장들을 위하여 준비하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘그들을 위하여’는 형식상 재귀 표현이 아닙니다. 두 용례 모두 문맥상 레위인들이 자신들의 몫과 제사장들의 몫을 준비했다는 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  english_pob_choice: Afterward
  chosen_korean: 그 후에
  alternatives_korean:
  - 그 뒤에
  - 이후에
  lexicon: HALOT
  rationale: 이전 절 다음의 시간적 순서를 자연스럽게 표시하면서도, 현대 한국어에서 지나치게 구어적이지 않게 옮겼습니다.
- source_word: הֵכִינוּ לָהֶם
  english_pob_choice: they prepared for themselves
  chosen_korean: 자기들을 위해 준비하였는데
  alternatives_korean:
  - 그들 자신을 위해 준비하였는데
  - 자기 자신들을 위해 준비하였는데
  lexicon: HALOT
  rationale: 히브리어 대명사는 형식상 재귀형이 아니지만 문맥상 레위인들의 자기 몫을 가리키므로, 한국어에서는 ‘자기들을 위해’로 자연스럽게 밝혔습니다.
- source_word: וְלַכֹּהֲנִים
  english_pob_choice: and for the priests
  chosen_korean: 그리고 제사장들을 위해
  alternatives_korean:
  - 그리고 제사장들에게
  - 그리고 제사장들까지
  lexicon: HALOT
  rationale: 준비의 수혜 대상을 분명히 드러내는 여격으로 보아 ‘위해’로 옮겼습니다.
- source_word: בְּהַעֲלוֹת הָעוֹלָה וְהַחֲלָבִים
  english_pob_choice: were occupied in offering up the burnt offering and the fat portions
  chosen_korean: 번제와 기름진 부분을 밤까지 드리는 일에 분주하였기 때문입니다
  alternatives_korean:
  - 번제와 기름진 부분을 밤까지 올리는 일을 하고 있었기 때문입니다
  - 번제와 기름진 부분을 밤까지 바치는 일에 매여 있었기 때문입니다
  lexicon: HALOT
  rationale: עלה의 제의적 용법을 살려 ‘드리다’로 옮기고, חֲלָבִים은 일반 ‘기름’이 아니라 제단에 올려지는 제물의 기름진 부분이라는 점을 반영했습니다.
- source_word: עַד לָיְלָה
  english_pob_choice: until night
  chosen_korean: 밤까지
  alternatives_korean:
  - 밤이 될 때까지
  - 야간까지
  lexicon: HALOT
  rationale: 서비스가 밤으로 이어졌음을 간명하게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 제사장과 레위인의 역할 분담이 암시하는 서술 구조
  chosen_reading: 제사장들은 번제와 기름진 부분을 드리는 일에 매여 있었고, 그 결과 레위인들이 자신들과 제사장들을 위해 준비했습니다.
  alternative_readings:
  - 레위인들이 단순히 제사장들을 섬겼다
  - 제사장들도 자신들을 위해 준비했다
  rationale: 본문의 인과관계를 살려, 제사장들이 제의 집행으로 바빴기 때문에 레위인들이 준비를 맡았다는 서술 구조를 유지했습니다.
  doctrine_reference: 역대하 35:14 문맥 주해
- issue: 반복되는 לָהֶם의 지시 대상
  chosen_reading: 두 번 모두 문맥상 레위인 자신들의 몫을 포함하는 준비로 이해해 ‘자기들을 위해’로 옮겼습니다.
  alternative_readings:
  - 두 번 모두 단순히 ‘그들을 위해’
  - 엄밀히 비재귀적으로 ‘그들에게’
  rationale: 영문 POB의 주해처럼 히브리어 대명사는 형식상 재귀형이 아니지만, 문맥상 자기 몫의 음식 준비를 가리키므로 이를 한국어에서 분명히 해 주는 것이 오해를 줄입니다.
  doctrine_reference: 번역학적 문맥 판단
