  source_fidelity: 핵심 의미와 인과관계는 대체로 충실합니다. 다만 לָהֶם은 형태상 단순 3인칭 복수 대명사이므로 ‘자기들을’로 단정할 경우 문맥적 해석이 본문 표면보다 앞섭니다. 문맥상 레위인 자신의 몫을 포함한다는 이해는 매우 유력하되, 각 반복부에 각주를 연결하여 이 점을 분명히 하는 편이 원문의 여지를 더 잘 보존합니다.
  naturalness: ‘자기들을 위해’는 현대 한국어에서 다소 부자연스럽고, 사람들을 준비 대상으로 삼는 듯하게 들릴 수 있습니다. ‘자신들과 …을 위하여 준비하였습니다’가 자연스럽고, 합쇼체 문체에도 적절합니다. ‘드리느라 밤까지 바빴기 때문입니다’는 제사장들이 계속 제의를 수행하였다는 이유를 간결하고 자연스럽게 전달합니다.
  terminology: ‘번제’, ‘제사장’, ‘레위인’, ‘아론의 자손’, ‘기름진 부분’은 적절합니다. ‘아론의 아들들’보다 ‘아론의 자손들’은 한국어 성경 문체에서 자연스럽지만, 원문의 계보적 표현을 유지합니다. 두 번째 ‘아론의 아들 제사장들’은 ‘아론의 자손인 제사장들’로 다듬는 것이 자연스럽습니다.
