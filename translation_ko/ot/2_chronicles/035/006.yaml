  rationale: 히브리어 관용구를 너무 평평하게 만들지 않으면서도 한국어로 이해 가능하게 옮겼습니다. 매개된 권위와 전달 수단을 함께 드러냅니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
