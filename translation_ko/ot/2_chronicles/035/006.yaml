  lexicon: HALOT
  rationale: 히트파엘의 자기지시적 의미를 살리면서, 현대 한국어에서 제의적 준비를 가장 자연스럽게 전달하는 표현으로 옮겼습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀을 따라
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 명령에 따라
  lexicon: HALOT
  rationale: '''דָּבָר''의 기본값인 ''말씀''을 유지해 하나님의 지시라는 권위를 살리고, ''따라''로 규범적 준거를 자연스럽게 표현했습니다.'
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
