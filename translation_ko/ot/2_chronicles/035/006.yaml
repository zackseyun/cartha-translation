  source_fidelity: 초안은 유월절 희생 제물, 자기 성결, 야훼의 말씀, 모세를 통한 매개라는 핵심 요소를 대체로 보존합니다. 그러나 원문에 없는 ‘각자’를 첨가했고, ‘너희 형제들을 위해 준비하여 … 하도록 하십시오’는 누가 야훼의 말씀대로 행하는지 문법적으로 불분명합니다. לַעֲשׂוֹת는 형제들이 규정된 일을 행하도록 준비한다는 목적을 분명히 드러내는 편이 안전합니다.
  naturalness: ‘자신을 거룩하게 하며’와 ‘모세의 손을 통해’는 현대 표준 한국어로 다소 어색합니다. ‘스스로 성결하게 하십시오’와 ‘모세를 통하여’가 제의적 register와 합쇼체를 유지하면서 더 자연스럽습니다.
