  - 주
  rationale: 원문이 직접 신명기 이름을 사용하므로, 대체 호칭인 '주'를 쓰지 않고 프로젝트 기본값에 따라 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: בְּיַד מֹשֶׁה의 관용 표현
  chosen_reading: 모세의 손을 통해
  alternative_readings:
