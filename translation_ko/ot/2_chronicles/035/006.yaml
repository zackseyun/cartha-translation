  text: וְ/שַׁחֲט֖וּ הַ/פָּ֑סַח וְ/הִתְקַדְּשׁוּ֙ וְ/הָכִ֣ינוּ לַ/אֲחֵי/כֶ֔ם לַ/עֲשׂ֥וֹת כִּ/דְבַר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
  footnotes:
  - marker: a
    text: Or, more literally, 'the Passover'; the Hebrew term can denote the Passover sacrifice as a whole, but here it refers specifically to the animal being slaughtered.
    reason: lexical_alternative
  - marker: b
    text: Or, 'through Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 각자 유월절 양을 잡고, 자신을 거룩하게 하며, 너희 형제들을 위해 준비하여 야훼의 말씀을 따라 모세의 손을 통해 하도록 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  english_pob_choice: Slaughter
  chosen_korean: 잡고
  alternatives_korean:
  - 도살하고
  - 죽이고
  lexicon: HALOT
  rationale: 제사적 맥락의 զոհ/희생 동물을 처리하는 동작이므로, 지나치게 일상적인 '죽이다'보다 제의적 실상을 자연스럽게 드러내는 '잡다'를 택했습니다.
- source_word: הַפָּסַח
  english_pob_choice: the Passover lamb
  chosen_korean: 유월절 양
  alternatives_korean:
  - 유월절
  - 유월절 제물
  lexicon: HALOT
  rationale: 여기서는 절기 전체보다 실제로 잡는 짐승을 가리키므로, POB의 해석을 따라 동물을 분명히 보이게 했습니다.
- source_word: וְהִתְקַדְּשׁוּ
  english_pob_choice: consecrate yourselves
  chosen_korean: 자신을 거룩하게 하며
  alternatives_korean:
  - 자신을 성별하며
  - 스스로 성결하게 하며
  lexicon: HALOT
  rationale: 히트파엘의 자기지시적 의미를 살리면서, 현대 한국어에서 제의적 준비를 가장 자연스럽게 전달하는 표현으로 옮겼습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀을 따라
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 명령에 따라
  lexicon: HALOT
  rationale: '''דָּבָר''의 기본값인 ''말씀''을 유지해 하나님의 지시라는 권위를 살리고, ''따라''로 규범적 준거를 자연스럽게 표현했습니다.'
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문이 직접 신명기 이름을 사용하므로, 대체 호칭인 '주'를 쓰지 않고 프로젝트 기본값에 따라 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: בְּיַד מֹשֶׁה의 관용 표현
  chosen_reading: 모세의 손을 통해
  alternative_readings:
  - 모세를 통해
  - 모세의 손으로
  rationale: 히브리어 관용구를 너무 평평하게 만들지 않으면서도 한국어로 이해 가능하게 옮겼습니다. 매개된 권위와 전달 수단을 함께 드러냅니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
