base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
  footnotes:
  - marker: a
    text: Or, more literally, 'the Passover'; the Hebrew term can denote the Passover sacrifice as a whole, but here it refers specifically to the animal being slaughtered.
    reason: lexical_alternative
  - marker: b
    text: Or, 'through Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유월절 제물을 잡으십시오[a]. 스스로 성결하게 하고, 여러분의 형제들이 모세를 통하여 주신 야훼의 말씀대로 행하도록 준비하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유월절’. 히브리어는 유월절 희생 제물 전체를 가리킬 수 있으며, 여기서는 잡는 제물을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘모세의 손으로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  english_pob_choice: Slaughter
  chosen_korean: 잡고
  alternatives_korean:
