  - 죽이고
  lexicon: HALOT
  rationale: 제사적 맥락의 զոհ/희생 동물을 처리하는 동작이므로, 지나치게 일상적인 '죽이다'보다 제의적 실상을 자연스럽게 드러내는 '잡다'를 택했습니다.
- source_word: הַפָּסַח
  english_pob_choice: the Passover lamb
  chosen_korean: 유월절 양
  alternatives_korean:
  - 유월절
  - 유월절 제물
  lexicon: HALOT
  rationale: 여기서는 절기 전체보다 실제로 잡는 짐승을 가리키므로, POB의 해석을 따라 동물을 분명히 보이게 했습니다.
- source_word: וְהִתְקַדְּשׁוּ
  english_pob_choice: consecrate yourselves
  chosen_korean: 자신을 거룩하게 하며
  alternatives_korean:
