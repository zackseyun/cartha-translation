  yaml_path: translation/ot/2_chronicles/035/017.yaml
  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: ko
  text: 그때에 그 자리에 있던 이스라엘 자손들은 유월절을 지켰고, 무교절도 칠 일 동안 지켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the Israelites
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 이 표현은 집합적 민족 명칭이므로 ‘이스라엘 자손’이 원문 구조를 살리면서도 한국어 성경 전통과 현대 문체 사이의 균형을 유지합니다.
- source_word: הַנִּמְצְאִים
  english_pob_choice: who were present
  chosen_korean: 그 자리에 있던
  alternatives_korean:
  - 거기 있던
  - 출석한
  lexicon: HALOT
  rationale: מצא의 분사형은 여기서 ‘발견된’이 아니라 그때 그곳에 실제로 ‘있던/출석한’ 사람들을 가리키므로, 자연스러운 상황 묘사로 옮겼습니다.
- source_word: הַפֶּסַח
  english_pob_choice: the Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 과월절
  - 유월절 제사
  lexicon: HALOT
  rationale: 이 문맥에서는 절기 전체를 가리키므로, 한국어에서 가장 직접적이고 널리 통용되는 절기명 ‘유월절’로 옮겼습니다.
- source_word: חַג הַמַּצּוֹת
  english_pob_choice: the Feast of Unleavened Bread
  chosen_korean: 무교절
  alternatives_korean:
  - 무효병절
  - 누룩 없는 떡의 절기
  lexicon: HALOT
  rationale: חַג의 ‘절기/축제’ 의미는 한국어 성경에서 관용적으로 ‘무교절’로 정착되어 있어, 간결하면서도 절기명을 분명히 드러냅니다.
theological_decisions:
- issue: 절기 동사의 번역
  chosen_reading: ‘지켰습니다’로 옮겨 절기를 단순히 ‘행했다’가 아니라 언약적·예배적 준수로 드러냈습니다.
  alternative_readings:
  - 행했습니다
  - 기념했습니다
  - 준수했습니다
  rationale: וַיַּעֲשׂוּ는 문자적으로는 ‘했다’이지만, 절기 목적어와 결합할 때는 예배를 ‘지키다’는 관용이 원문의 종교적 함의를 가장 잘 보존합니다.
  doctrine_reference: 예전/절기 준수의 언약적 의미
- issue: 유월절과 무교절의 병렬
  chosen_reading: 두 절기를 모두 병렬로 유지해, 본문이 한 절기 사건이 아니라 연속된 두 절기 준수를 함께 진술함을 분명히 했습니다.
  alternative_readings:
  - 유월절만 강조하고 무교절은 부가 설명으로 처리
  - 두 표현을 하나의 포괄적 절기로 합침
  rationale: 히브리어는 두 목적어를 병렬로 제시하므로, 한국어에서도 둘을 함께 살려 본문이 말하는 역사적·예전적 범위를 축소하지 않았습니다.
  doctrine_reference: 성경 본문 구조의 보존
