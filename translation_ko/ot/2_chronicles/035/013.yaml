  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְבַשְּׁל֥וּ הַ/פֶּ֛סַח בָּ/אֵ֖שׁ כַּ/מִּשְׁפָּ֑ט וְ/הַ/קֳּדָשִׁ֣ים בִּשְּׁל֗וּ בַּ/סִּיר֤וֹת וּ/בַ/דְּוָדִים֙ וּ/בַ/צֵּ֣לָח֔וֹת וַ/יָּרִ֖יצוּ לְ/כָל בְּנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
  footnotes:
  - marker: a
    text: Or, more specifically, 'roasted the Passover lamb in the fire.' The Hebrew verb can mean 'cook' broadly, but Passover law required roasting rather than boiling (cf. Exod 12:8–9).
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 규례대로[ [a]] 그 파스카를 불에 구웠고, 거룩한 제물들은 냄비와 가마와 대접에 삶아 모든 백성에게 서둘러 가져다 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 구체적으로는 ‘파스카를 불에 구웠다’는 뜻으로도 옮길 수 있습니다. 히브리어 동사는 넓게는 ‘요리하다’를 뜻하지만, 파스카 규례는 삶기보다 굽기를 요구합니다(출 12:8-9 참조).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  english_pob_choice: cooked
  chosen_korean: 구웠고
  alternatives_korean:
  - 요리했고
  - 삶았고
  lexicon: HALOT
  rationale: פָּסַח이 ‘불에’라는 구체적 방식과 함께 나오므로, 첫 동사는 일반적 ‘조리’가 아니라 실제 제의 방식인 ‘굽다’로 옮기는 것이 자연스럽고 오해를 줄입니다.
- source_word: הַפֶּסַח
  english_pob_choice: the Passover
  chosen_korean: 그 파스카
  alternatives_korean:
  - 그 유월절
  - 그 유월절 제물
  lexicon: HALOT
  rationale: 여기서는 절기 자체보다 제의적으로 준비된 대상이 전제되지만, 본문이 명시적으로 ‘제물’이라고 부르지는 않으므로 의미를 과도하게 덧붙이지 않고 ‘파스카’로 유지했습니다.
- source_word: כַּמִּשְׁפָּט
  english_pob_choice: according to the rule
  chosen_korean: 규례대로
  alternatives_korean:
  - 율례대로
  - 명령대로
  - 정해진 대로
  lexicon: HALOT
  rationale: 제의 절차를 가리키는 משפט의 규범적 의미를 반영하면서도, 한국어 성경문체에서 자연스러운 ‘규례’로 옮겼습니다.
- source_word: וַיָּרִיצוּ
  english_pob_choice: quickly brought
  chosen_korean: 서둘러 가져다 주었습니다
  alternatives_korean:
  - 급히 가져갔습니다
  - 빨리 가져다 주었습니다
  - 서둘러 운반했습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 속도와 긴급성이므로, 단순한 이동보다 분배의 뉘앙스가 드러나는 ‘가져다 주다’로 풀었습니다.
theological_decisions:
- issue: ‘파스카’를 구웠다는 표현과 제의적 조리법의 긴장
  chosen_reading: 첫 동사는 ‘구웠고’로 옮기되, 문맥의 ‘불에’와 ‘규례대로’가 제의적 방식임을 드러내게 했습니다.
  alternative_readings:
  - ‘요리했고’로 넓게 옮기기
  - ‘볶았고’처럼 더 구체화하기
  rationale: 본문은 파스카와 다른 거룩한 제물을 구분해 서로 다른 조리 방식을 병렬로 제시하므로, 첫 항목을 ‘굽다’로 좁혀도 문맥에 부합합니다.
  doctrine_reference: 출애굽기 12:8-9와 제사 규례의 문맥
- issue: ‘거룩한 것들’의 범위
  chosen_reading: 다른 제의 음식/제물을 가리키는 복수로 보고 ‘거룩한 제물들’로 번역했습니다.
  alternative_readings:
  - ‘거룩한 것들’
  - 파스카를 포함한 모든 제의 음식
  rationale: 파스카와 병행되는 별도의 준비 항목이며, 뒤의 그릇 목록이 끓이는 조리와 맞물리므로 제의적 제물로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문의 병렬구조
