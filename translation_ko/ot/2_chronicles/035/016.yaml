  - severity: medium
    issue: 목적 부정사의 기능이 완료 서술로 바뀌었습니다.
    rationale: לַעֲשׂוֹת הַפֶּסַח וְהַעֲלוֹת עֹלוֹת는 ‘유월절을 지키고 번제를 드리기 위하여’라는 목적입니다. ‘지키고 … 드렸습니다’는 준비의 목적을 사건의 완료로 전환합니다.
  - severity: medium
    issue: עֲבוֹדָה의 제의적 의미가 ‘모든 일’에서 지나치게 일반화되었습니다.
    rationale: 문맥상 성전 예배와 제사의 봉사를 가리키므로 ‘예배 봉사’로 명시하는 것이 충실합니다.
