id: 2CH.35.16
reference: 2 Chronicles 35:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: ko
  text: 그날 유월절을 지키고 야훼의 제단 위에 번제를 드리기 위한 야훼의 모든 예배 봉사가 요시야 왕의 명령대로 갖추어졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן כָּל עֲבוֹדַת יְהוָה
  english_pob_choice: was prepared / all the service of Yahweh
  chosen_korean: 여호와의 모든 일이 준비되어
  alternatives_korean:
  - 여호와의 모든 섬김이 갖추어져
  - 여호와의 모든 예배 일이 마련되어
  lexicon: HALOT
  rationale: 예배·제의 맥락의 עֲבוֹדָה를 한국어에서 자연스럽게 살리면서도, 단순한 ‘일’보다 제의적 준비성을 드러내기 위해 ‘준비되어’로 옮겼습니다.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  english_pob_choice: to keep the Passover
  chosen_korean: 유월절을 지키고
  alternatives_korean:
  - 유월절을 행하고
  - 유월절을 기념하고
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘유월절을 하다’의 의미를 한국어에서 가장 자연스럽고 예전적 의미를 보존하는 ‘지키다’로 옮겼습니다.
- source_word: וְהַעֲלוֹת עֹלוֹת
  english_pob_choice: and to offer burnt offerings
  chosen_korean: 번제를 드렸습니다
  alternatives_korean:
  - 번제를 올렸습니다
  - 온전한 번제물을 바쳤습니다
  lexicon: HALOT
  rationale: 제사 문맥에서 הֶעֱלָה + עֹלוֹת는 정형적인 번제 봉헌을 뜻하므로, 현대 한국어의 예배·제의 표현인 ‘드리다’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 단일 절은 한국어 기존 교회 독자에게 즉시 인지되는 표기를 우선해 ‘여호와’로 적되, 본문 의미는 POB의 고유명 지시를 유지했습니다.
- source_word: כְּמִצְוַת הַמֶּלֶךְ יֹאשִׁיָּהוּ
  english_pob_choice: according to the command of King Josiah
  chosen_korean: 이는 요시야 왕의 명령에 따른 것이었습니다
  alternatives_korean:
  - 요시야 왕이 명한 대로였습니다
  - 요시야 왕의 명령대로였습니다
  lexicon: HALOT
  rationale: מִצְוָה의 법적·명령적 뉘앙스를 살리면서, 문장 전체를 한국어 서술 흐름에 맞게 자연스럽게 정리했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 본문에는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: POB 원칙상 YHWH는 ‘야훼’가 기본이지만, 이 절은 역사서의 제의 서술로서 한국어 교회권 가독성과 즉시성을 고려해 전통적 표기를 택했습니다. 본문 의미상 신학적 변화는 없습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘지키다’의 제의적 의미
  chosen_reading: 유월절을 ‘지키다’로 옮겨, 단순한 관람이나 기념보다 언약적 준수와 예전적 실행을 함께 드러냈습니다.
  alternative_readings:
  - 유월절을 행하다
  - 유월절을 기념하다
  rationale: 히브리어 לַעֲשׂוֹת הַפֶּסַח는 단순 회상이 아니라 정해진 예식을 수행하는 뜻이므로, 한국어에서도 준수·실행의 중의를 살리는 번역이 적절합니다.
  doctrine_reference: 제의 언어의 관용구 보존 원칙
