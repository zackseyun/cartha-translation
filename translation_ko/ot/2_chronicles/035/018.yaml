  source_fidelity: 핵심 비교와 유월절 관용어는 대체로 충실합니다. 그러나 원문에서 요시야와 제사장들, 레위 사람들, 온 유다, 현장에 있던 이스라엘, 예루살렘 주민은 모두 그 유월절을 지킨 참여자들인데, 초안은 이들을 별도 문장으로 옮겨 단지 ‘함께했다’고 표현함으로써 원문의 통사적 연결과 행위의 초점을 약화합니다. 또한 ‘사무엘 선지자의 시대 이후로’는 사무엘의 시대를 제외하는 뉘앙스를 낼 수 있어, מִימֵי의 시작점 의미에는 ‘시대부터/이래’가 더 알맞습니다.
