base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'No Passover like this had been observed in Israel since the days of Samuel the prophet.'
    reason: lexical_alternative
  - marker: b
    text: '''Israel that was present'' refers to members of Israel who were there for the celebration; alternatively, ''the Israelites who were present.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘에서는 사무엘 예언자의 시대부터 이와 같은 유월절을 지킨 일이 없었으며,[a] 이스라엘의 어느 왕도 요시야와 제사장들과 레위 사람들과 온 유다와 그 자리에 있었던 이스라엘[b]과 예루살렘 주민들이 지킨 이 유월절과 같은 유월절을 지키지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사무엘 예언자의 시대 이래 이와 같은 유월절이 이스라엘에서 지켜진 일이 없었습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘그 자리에 있었던 이스라엘’은 그 절기에 참석해 있던 이스라엘 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשָׂה פֶסַח
  english_pob_choice: had been kept
  chosen_korean: 지켜진 적이 없었고
  alternatives_korean:
  - 행해진 적이 없었고
  - 드려진 적이 없었고
  lexicon: HALOT
  rationale: פֶּסַח은 단순히 ‘만들어졌다’가 아니라 절기 전체를 ‘지키다/준수하다’는 관용을 따르는 것이 자연스럽습니다. 한국어에서는 ‘지켜진 적이 없었고’가 비교의 의미를 가장 직접적으로 살립니다.
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  english_pob_choice: since the days of Samuel the prophet
  chosen_korean: 사무엘 선지자의 시대 이후로
  alternatives_korean:
  - 사무엘 선지자의 날들 이후로
  - 사무엘 예언자의 시대부터
  lexicon: HALOT
  rationale: ‘ימים’는 직역상 ‘날들’이지만, 한국어 성경 문맥에서는 지속적 비교의 시작점을 ‘시대 이후로’로 옮기는 것이 자연스럽고 의미를 보존합니다.
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  english_pob_choice: Israel that was present
  chosen_korean: 그 자리에 있던 이스라엘 사람들
  alternatives_korean:
  - 그곳에 उपस्थित한 이스라엘
  - 그 자리에 있던 이스라엘
  lexicon: HALOT
  rationale: הנמצא는 ‘발견된/있는’이라는 뜻이지만 여기서는 절기에 실제로 참석한 사람들을 가리키므로, 집합명사적 표현을 한국어로 풀어 ‘그 자리에 있던 이스라엘 사람들’로 옮겼습니다.
- source_word: כַּפֶּסַח אֲשֶׁר עָשָׂה יֹאשִׁיָּהוּ
  english_pob_choice: the one that Josiah kept
  chosen_korean: 요시야가 지킨 그 유월절과 같은 것
  alternatives_korean:
  - 요시야가 행한 그 유월절과 같은 것
  - 요시야가 지킨 유월절
  lexicon: HALOT
  rationale: 비교문이므로 ‘그 유월절과 같은 것’으로 옮겨 원문의 대조 구조를 살렸습니다. ‘지킨’은 פֶּסַח + עשה의 관용을 반영합니다.
theological_decisions:
- issue: 절기의 유일성 진술과 역사적 범위
  chosen_reading: 본문의 비교를 그대로 살려, 요시야의 유월절이 사무엘 시대 이후 유다와 이스라엘 역사에서 매우 독특했음을 강조하되, 주석적 조화를 본문에 덧씌우지 않았습니다.
  alternative_readings:
  - 모든 다른 유월절을 배제하는 절대적 진술로 읽기
  - 이 표현을 단순한 과장으로 축소하기
  rationale: 히브리어는 질적 비교와 역사적 범주화를 함께 사용하므로, 번역문은 과도한 조정 없이 원문의 강도를 유지하는 편이 가장 투명합니다.
  doctrine_reference: 역사서의 수사와 비교 표현 해석
