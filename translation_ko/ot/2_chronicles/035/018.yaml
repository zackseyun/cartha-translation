revisions:
- from: 이스라엘에서 이와 같은 유월절은 사무엘 선지자의 시대 이후로 지켜진 적이 없었고, 이스라엘의 모든 왕도 요시야가 지킨 그 유월절과 같은 것을 지키지 않았습니다. 제사장들과 레위 사람들, 온 유다, 그 자리에 있던 이스라엘 사람들, 그리고 예루살렘 주민들도 함께했습니다.[a][b]
  to: 이스라엘에서는 사무엘 예언자의 시대부터 이와 같은 유월절을 지킨 일이 없었으며,[a] 이스라엘의 어느 왕도 요시야와 제사장들과 레위 사람들과 온 유다와 그 자리에 있었던 이스라엘[b]과 예루살렘 주민들이 지킨 이 유월절과 같은 유월절을 지키지 않았습니다.
  rationale: 유월절을 ‘지키다’로 옮긴 원문의 관용적 의미와 역사적 비교를 유지했습니다. 참여자 목록을 요시야와 함께 유월절을 지킨 공동 주어로 복원하여 히브리어의 통사와 의미 관계를 명확히 했고, 시간 표현을 ‘시대부터’로 조정했습니다.
  reviewer_model: gpt-5.6-terra
