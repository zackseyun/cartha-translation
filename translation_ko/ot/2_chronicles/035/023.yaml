base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/023.yaml
  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
  footnotes:
  - marker: a
    text: Or “Take me away, for I am severely hurt,” since the Hebrew verb can broadly mean being weak, sick, or badly wounded; here the battle context favors “wounded.”
    reason: lexical_alternative
translation:
  language: ko
  text: 활쏘는 이들이 요시야 왕을 쏘았고, 왕이 자기 종들에게 말했습니다. “나를 데려가십시오. 내가 매우 다쳤습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּרוּ / הַיֹּרִים
  english_pob_choice: the archers shot
  chosen_korean: 활쏘는 이들이 … 쏘았고
  alternatives_korean:
  - 궁수들이 … 쏘았고
  - 활 쏘는 자들이 … 쏘았고
  lexicon: HALOT
  rationale: ירוּ의 전투 문맥과 ההיורים(‘쏘는 자들’)를 따라, 일반적인 ‘쏘다’보다 무기와 역할이 드러나는 ‘활쏘는 이들’로 옮겼습니다.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  english_pob_choice: King Josiah
  chosen_korean: 요시야 왕
  alternatives_korean:
  - 왕 요시야
  - 요시야에게
  lexicon: HALOT
  rationale: 전치사 ל가 명중 대상임을 나타내므로 한국어에서는 직접목적어로 자연스럽게 처리하고, 통용되는 인명-직함 순서인 ‘요시야 왕’을 택했습니다.
- source_word: הַעֲבִירוּנִי
  english_pob_choice: Take me away
  chosen_korean: 나를 데려가십시오
  alternatives_korean:
  - 나를 옮겨 주십시오
  - 나를 데리고 가십시오
  lexicon: HALOT
  rationale: עבר의 사역형은 ‘옮기다/건너가게 하다’의 뜻이지만, 전투 중 부상당한 왕이 시종들에게 이동을 요청하는 상황이므로 현대 한국어에서 가장 자연스러운 ‘데려가다’로 옮겼습니다.
- source_word: הָחֳלֵיתִי מְאֹד
  english_pob_choice: I am severely wounded
  chosen_korean: 내가 매우 다쳤습니다
  alternatives_korean:
  - 내가 심하게 다쳤습니다
  - 내가 몹시 상했습니다
  - 내가 매우 아픕니다
  lexicon: HALOT
  rationale: חלה는 ‘아프다/쇠약하다’부터 ‘심하게 상하다’까지 폭이 있으나, 직전의 피격 맥락이 부상임을 분명히 하므로 ‘다치다’로 풀되, מְאֹד의 강도를 ‘매우’로 살렸습니다.
theological_decisions:
- issue: 왕의 직접 발화의 화법
  chosen_reading: 시종들에게 한 명령은 공손한 합쇼체로 처리하고, 인용문 안에서도 명령형 요청을 합쇼체로 유지했습니다.
  alternative_readings:
  - 인용문 안에서 반말형으로 낮추는 방법
  - ‘나를 데려가오’ 같은 고어체
  rationale: 히브리어 원문은 간단한 명령과 이유를 제시할 뿐이므로, 본문 의미를 바꾸지 않으면서 현대 한국어 독자에게 자연스럽고 품위 있는 직접화법을 택했습니다.
  doctrine_reference: 문체/화행
