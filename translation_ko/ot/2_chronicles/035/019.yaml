  - 요시야의 재위
  lexicon: HALOT
  rationale: מַלְכוּת는 왕의 통치 기간을 가리키므로, 현대 한국어에서는 '통치'가 가장 직역성이 있으면서도 자연스럽습니다.
- source_word: נַעֲשָׂה
  english_pob_choice: was kept
  chosen_korean: 지켜졌습니다
  alternatives_korean:
  - 행해졌습니다
  - 준수되었습니다
  - 치러졌습니다
  lexicon: HALOT
  rationale: פֶּסַח와 결합된 나아사ʾ는 단순한 '행해짐'보다 절기 준수의 의미를 담으므로, '지켜지다'가 원문의 관용적 뜻을 잘 드러냅니다.
- source_word: הַ/פֶּסַח
  english_pob_choice: Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 그 유월절
  - 파스카
  lexicon: HALOT
  rationale: פֶּסַח의 통상적 한국어 성경 용례는 '유월절'이므로, 본문을 즉시 식별 가능하게 합니다.
