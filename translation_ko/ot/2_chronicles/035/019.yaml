  - 요시야 왕의 제십팔 해에
  lexicon: HALOT
  rationale: 연대 표지로서의 ב + 수사구는 한국어에서 자연스럽게 왕의 통치 연대 표현으로 옮기는 것이 가장 명확합니다.
- source_word: לְ/מַלְכ֖וּת יֹאשִׁיָּהוּ
  english_pob_choice: of Josiah’s reign
  chosen_korean: 요시야의 통치
  alternatives_korean:
