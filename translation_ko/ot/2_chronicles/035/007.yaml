  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֣רֶם יֹאשִׁיָּ֣הוּ לִ/בְנֵ֪י הָ/עָ֟ם צֹ֞אן כְּבָשִׂ֣ים וּ/בְנֵֽי עִזִּים֮ הַ/כֹּ֣ל לַ/פְּסָחִים֒ לְ/כָל הַ/נִּמְצָ֗א לְ/מִסְפַּר֙ שְׁלֹשִׁ֣ים אֶ֔לֶף וּ/בָקָ֖ר שְׁלֹ֣שֶׁת אֲלָפִ֑ים אֵ֖לֶּה מֵ/רְכ֥וּשׁ הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
  footnotes:
  - marker: a
    text: Or 'to the people' or 'to the common people'; literally, 'to the sons of the people.'
    reason: lexical_alternative
  - marker: b
    text: Or 'all for the Passover sacrifices'; Hebrew 'Passovers' likely refers to the Passover animals/offerings collectively.
    reason: lexical_alternative
translation:
  language: ko
  text: 요시야는 백성에게 떼에서 어린 양들과 어린 염소들을 내어 주었습니다. 그것들은 모두 유월절 제물로, 거기에 있던 모든 사람을 위해서였으니, 수효는 삼만 마리였고 소는 삼천 마리였습니다. 이것들은 왕의 소유에서 나온 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘백성의 아들들’이지만, 한국어에서는 자연스럽지 않아 문맥상 ‘백성’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 복수형 פְּסָחִים은 여기서 유월절에 쓰인 제물들을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  english_pob_choice: contributed
  chosen_korean: 내어 주었습니다
  alternatives_korean:
  - 기증했습니다
  - 바쳤습니다
  - 제공했습니다
  lexicon: HALOT
  rationale: 히필형 רום은 여기서 단순히 ‘들어 올리다’가 아니라, 왕이 백성을 위해 예물을 마련해 주는 제공 행위를 뜻하므로, 제의적 맥락을 살리면서도 직접적 의미를 드러내는 표현으로 옮겼습니다.
- source_word: לִבְנֵי הָעָם
  english_pob_choice: to the sons of the people
  chosen_korean: 백성에게
  alternatives_korean:
  - 백성의 자손에게
  - 백성의 아들들에게
  - 일반 백성에게
  lexicon: HALOT
  rationale: 직역하면 ‘백성의 아들들’이지만, 한국어에서 어색하지 않도록 하되 평민층을 가리키는 뉘앙스를 유지하기 위해 ‘백성에게’로 옮겼습니다.
- source_word: צֹאן כְּבָשִׂים וּבְנֵי עִזִּים
  english_pob_choice: from the flock, lambs and young goats
  chosen_korean: 떼에서 어린 양들과 어린 염소들
  alternatives_korean:
  - 양떼와 염소들
  - 어린 양들과 새끼 염소들
  - 양과 염소의 새끼들
  lexicon: HALOT
  rationale: צֹאן은 집합적 ‘떼’이고, כְּבָשִׂים과 בְנֵי עִזִּים은 각각 어린 양과 어린 염소를 가리키므로, 현대 한국어에서 자연스럽고 구체적으로 보이도록 분리해 옮겼습니다.
- source_word: הַפְּסָחִים
  english_pob_choice: Passover offerings
  chosen_korean: 유월절 제물
  alternatives_korean:
  - 유월절 희생제물
  - 유월절 제사
  - 유월절 제사 제물
  lexicon: HALOT
  rationale: פְּסָחִים의 복수형이 유월절에 쓰인 제물들을 집합적으로 가리키므로, 전통 교회 용어와 소스의 제의성을 함께 살려 ‘유월절 제물’로 옮겼습니다.
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  english_pob_choice: These were from the king’s possessions
  chosen_korean: 이것들은 왕의 소유에서 나온 것이었습니다
  alternatives_korean:
  - 이것들은 왕의 재산에서 나온 것이었습니다
  - 이것들은 왕의 소유물이었습니다
  - 이것들은 왕의 소유였습니다
  lexicon: HALOT
  rationale: רְכוּשׁ은 재산·소유를 뜻하므로, 동산의 출처를 밝히는 문맥에 맞게 ‘왕의 소유에서 나온 것’으로 처리했습니다.
theological_decisions:
- issue: The verse presents Josiah as the provider of sacrificial animals for Passover rather than as the one performing the sacrifice himself.
  chosen_reading: 왕이 백성을 위해 제물을 마련해 주는 후원 행위로 이해했습니다.
  alternative_readings:
  - 요시야가 직접 제물을 바쳤다고 볼 수도 있음
  - 단순한 금전적 기부로만 볼 수도 있음
  rationale: 히필형 동사와 문맥상 왕실 소유에서 나온 동물들이 백성을 위해 공급되는 장면이므로, 요시야의 제의적 후원과 공동체 배려를 드러내되 직접 제사 집행으로 오해되지 않게 했습니다.
  doctrine_reference: 역대하 35장 문맥상 유월절 준비와 왕의 경건한 후원
- issue: The plural פְּסָחִים may sound awkward if rendered too literally.
  chosen_reading: 복수의 유월절 절기라기보다 유월절 제물들의 집합을 가리키는 말로 처리했습니다.
  alternative_readings:
  - ‘유월절들’로 직역
  - ‘유월절 제사들’로 직역
  rationale: 히브리어 복수형이 실제로는 유월절 제물의 묶음을 뜻할 수 있으므로, 독자가 의미를 바로 이해하도록 하되 제의적 뉘앙스는 유지했습니다.
  doctrine_reference: 어휘-용례에 따른 집합적 복수 처리
