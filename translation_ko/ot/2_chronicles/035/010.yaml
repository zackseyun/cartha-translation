id: 2CH.35.10
reference: 2 Chronicles 35:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּכּ֖וֹן הָ/עֲבוֹדָ֑ה וַ/יַּֽעַמְד֨וּ הַ/כֹּהֲנִ֧ים עַל עָמְדָ֛/ם וְ/הַ/לְוִיִּ֥ם עַל מַחְלְקוֹתָ֖/ם כְּ/מִצְוַ֥ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
  footnotes:
  - marker: a
    text: Or 'was set in order' or 'was established.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'at their standing/place'; that is, at their assigned positions.
    reason: lexical_alternative
  - marker: c
    text: Or 'according to their divisions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 그 봉사가 마련되었고, 제사장들은 각자의 자리[a]에 섰으며, 레위 사람들은 각자의 반열[b][c]대로 섰습니다. 이는 왕의 명령에 따른 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들이 서 있는 곳’ 또는 ‘그들의 자리’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 분반들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘각자의 분반에 따라’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן / הָעֲבוֹדָה
  english_pob_choice: the service was prepared
  chosen_korean: 그 직무가 준비되고
  alternatives_korean:
  - 그 봉사가 준비되고
  - 그 예식이 마련되고
  - 그 직무가 정돈되고
  lexicon: HALOT
  rationale: וַתִּכּוֹן은 ‘준비되다/설정되다/정돈되다’의 뜻을 가지며, עֲבוֹדָה는 성전 맥락에서 제의적 직무를 가리키므로 ‘직무가 준비되고’가 가장 자연스럽고 본문 맥락을 살립니다.
- source_word: עַל עָמְדָם
  english_pob_choice: at their stations
  chosen_korean: 자기들의 자리[a]에
  alternatives_korean:
  - 자기들의 위치에
  - 자기들의 자리에서
  - 자기들의 직위에
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 서 있는 곳/자리에’ 해당하므로, 정해진 배치를 드러내는 ‘자기들의 자리’가 POB의 ‘stations’를 한국어로 가장 간결하게 옮깁니다.
- source_word: עַל מַחְלְקוֹתָם
  english_pob_choice: by their divisions
  chosen_korean: 자기들의 반열[b][c]대로
  alternatives_korean:
  - 자기들의 분반대로
  - 자기들의 반열에 따라
  - 자기들의 구분대로
  lexicon: HALOT
  rationale: מַחְלְקוֹת은 조직된 분반/조를 뜻하므로, 제의적 조직성을 살리는 ‘반열’이 적절합니다. ‘대로’는 배열 기준을 자연스럽게 드러냅니다.
- source_word: כְּמִצְוַת הַמֶּלֶךְ
  english_pob_choice: according to the command of the king
  chosen_korean: 왕의 명령에 따라
  alternatives_korean:
  - 왕의 명령대로
  - 왕의 지시에 따라
  - 왕의 명령을 따라
  lexicon: HALOT
  rationale: מִצְוָה는 여기서 율법적 ‘계명’보다 특정 왕명에 가까우므로, ‘명령’이 더 정확합니다. כְּ는 기준/합치의 뜻으로 ‘에 따라’가 자연스럽습니다.
theological_decisions:
- issue: 성전 봉사에 대한 עֲבוֹדָה의 뉘앙스
  chosen_reading: 직무
  alternative_readings:
  - 봉사
  - 예식
  - 예배 봉사
  rationale: 본문은 성전 절차의 준비를 말하므로, 단순한 노동보다 제의적 역할을 드러내는 ‘직무’가 본문의 기능을 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 제사장과 레위인의 질서 있는 배치
  chosen_reading: 자기들의 자리 ... 자기들의 반열대로
  alternative_readings:
  - 자기들의 위치 ... 자기들의 분반에 따라
  - 자기들의 자리 ... 자기들의 구분대로
  rationale: 본문의 핵심은 성전 예식이 질서 있게 조직되었다는 점이므로, ‘자리’와 ‘반열’로 배치와 구분을 함께 드러내되 과도한 해설은 피했습니다.
  doctrine_reference: Translation philosophy §5, §6
