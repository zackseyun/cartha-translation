  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֵלָ֣י/ו מַלְאָכִ֣ים לֵ/אמֹר֩ מַה לִּ֨/י וָ/לָ֜/ךְ מֶ֣לֶךְ יְהוּדָ֗ה לֹא עָלֶ֨י/ךָ אַתָּ֤ה הַ/יּוֹם֙ כִּ֚י אֶל בֵּ֣ית מִלְחַמְתִּ֔/י וֵ/אלֹהִ֖ים אָמַ֣ר לְ/בַֽהֲלֵ֑/נִי חֲדַל לְ/ךָ֛ מֵ/אֱלֹהִ֥ים אֲשֶׁר עִמִּ֖/י וְ/אַל יַשְׁחִיתֶֽ/ךָ׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
  footnotes:
  - marker: a
    text: Or “against the place of my war,” or “against the house/kingdom with which I am at war.” The Hebrew phrase is difficult.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 사신들을 보내며 말했습니다. 「유다 왕이여, 나와 당신이 무슨 상관이 있습니까? 나는 오늘 당신을 치러 가는 것이 아니라, 내가 전쟁하는 집을 치러 가는 것입니다. 하나님께서 나에게 서둘러 가라고 말씀하셨습니다. 당신은 하나님과 맞서지 마십시오. 그분은 나와 함께 계시니, 그분이 당신을 멸하지 않도록 하십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 “내가 전쟁하는 집”은 난해한 표현입니다. “내가 전쟁하는 집”, “내 전쟁의 장소”, “내가 싸우는 왕조/나라” 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사신들
  alternatives_korean:
  - 전령들
  - 메신저들
  lexicon: HALOT
  rationale: 전투 상황에서 파라오 느고가 보낸 인간 대표자들이므로 천사적 의미를 배제하고, 현대 한국어에서 자연스러운 외교·군사적 표현인 ‘사신들’을 택했습니다.
- source_word: מַה לִּי וָלָךְ
  english_pob_choice: What have I to do with you
  chosen_korean: 나와 당신이 무슨 상관이 있습니까
  alternatives_korean:
  - 나와 당신 사이에 무엇이 있습니까
  - 당신이 내게 무슨 상관입니까
  lexicon: HALOT
  rationale: 관계 단절과 비개입의 관용구이므로, 직역보다 한국어 관용에 맞는 질문형으로 옮겨 의미의 거리감을 살렸습니다.
- source_word: אֶל בֵּית מִלְחַמְתִּי
  english_pob_choice: against the house with which I am at war
  chosen_korean: 내가 전쟁하는 집을 치러 가는 것입니다
  alternatives_korean:
  - 내 전쟁의 집을 치러 가는 것입니다
  - 내가 전쟁 중인 집을 향해 가는 것입니다
  - 내가 싸우는 왕조를 치러 가는 것입니다
  lexicon: HALOT
  rationale: 히브리어 표현이 모호하므로 ‘집’ 이미지는 유지하되, 공격 방향은 한국어 동사 ‘치러 가다’로 분명히 했습니다. ‘왕조’로 풀지 않고 원문의 अस्पनीय성을 남겼습니다.
- source_word: וֵאלֹהִים אָמַר לְבַהֲלֵנִי
  english_pob_choice: and God has told me to hurry
  chosen_korean: 하나님께서 나에게 서둘러 가라고 말씀하셨습니다
  alternatives_korean:
  - 하나님께서 나를 재촉하셨습니다
  - 하나님께서 나를 급히 가게 하셨습니다
  lexicon: HALOT
  rationale: בהל의 긴박한 뜻을 한국어 ‘서둘러 가다’로 자연스럽게 옮겼고, 느고의 발화를 그대로 살려 명령의 긴급성을 유지했습니다.
- source_word: חֲדַל לְךָ מֵאֱלֹהִים אֲשֶׁר עִמִּי
  english_pob_choice: Stop opposing God, who is with me
  chosen_korean: 당신은 하나님과 맞서지 마십시오. 그분은 나와 함께 계시니
  alternatives_korean:
  - 하나님을 그만 방해하십시오. 그분은 나와 함께 계십니다
  - 하나님에게서 물러서십시오. 그분은 나와 함께 계십니다
  lexicon: HALOT
  rationale: חֲדַל לְךָ는 단순 중단보다 ‘대항/간섭 중지’의 뉘앙스가 있어 ‘맞서다’로 옮겼습니다. 이어지는 관계절은 문장 흐름상 별도 절로 풀어 경고의 힘을 살렸습니다.
theological_decisions:
- issue: מֵאֱלֹהִים의 지시 대상
  chosen_reading: 모두 단수 ‘하나님’으로 번역했습니다.
  alternative_readings:
  - ‘신들’로 처리
  - ‘신’으로 처리
  rationale: 동사 אָמַר의 단수와 역대기 서술의 문맥이 단수 지시를 강하게 지지하므로, 느고의 이교적 배경을 과도하게 반영하지 않고 본문이 전달하는 경고를 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 대면 발화의 인칭과 정중성
  chosen_reading: 느고의 말은 ‘당신’ 체로, 하나님에 대한 직접 경계는 합쇼체로 유지했습니다.
  alternative_readings:
  - 전부 평서체/비격식으로 통일
  - 전부 격식체로 평준화
  rationale: 왕에게 하는 외교적 발화는 현대 한국어 합쇼체가 적절하고, 신에 대한 직접 언급도 동일한 존대 체계를 유지하되 본문 화자의 긴박한 경고를 보존했습니다.
  doctrine_reference: Korean target style guidance
