- from: 그는 그에게 사신들을 보내며 말했습니다. 「유다 왕이여, 나와 당신이 무슨 상관이 있습니까? 나는 오늘 당신을 치러 가는 것이 아니라, 내가 전쟁하는 집을 치러 가는 것입니다. 하나님께서 나에게 서둘러 가라고 말씀하셨습니다. 당신은 하나님과 맞서지 마십시오. 그분은 나와 함께 계시니, 그분이 당신을 멸하지 않도록 하십시오」.[a]
  to: 그는 그에게 사신들을 보내어 말했습니다. 「유다 왕이여, 나와 당신이 무슨 상관이 있습니까? 나는 오늘 당신을 치러 가는 것이 아니라, 내가 전쟁을 벌이고 있는 집을[a] 치러 가는 것입니다. 하나님께서 나에게 서두르라고 말씀하셨습니다. 그분께서 당신을 멸하지 않으시도록 하나님과 맞서지 마십시오. 그분은 나와 함께 계십니다.」
  rationale: 원문의 모호한 ‘집’ 이미지는 본문과 각주에서 유지하되, 한국어 문장 결합을 자연스럽게 다듬었습니다. 또한 마지막 경고의 목적·결과 관계를 명확히 하여, 하나님을 멸하지 않게 하라는 뜻으로 오해될 가능성을 없앴습니다. 하나님이 ‘나와 함께 계시다’라는 관계절은 원문의 강조를 살려 독립 문장으로 보존했습니다.
