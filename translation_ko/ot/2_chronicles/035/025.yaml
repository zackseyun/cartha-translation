  text: וַ/יְקוֹנֵ֣ן יִרְמְיָהוּ֮ עַל יֹאשִׁיָּהוּ֒ וַ/יֹּאמְר֣וּ כָֽל הַ/שָּׁרִ֣ים וְ֠/הַ/שָּׁרוֹת בְּ/קִינ֨וֹתֵי/הֶ֤ם עַל יֹאשִׁיָּ֨הוּ֙ עַד הַ/יּ֔וֹם וַ/יִּתְּנ֥וּ/ם לְ/חֹ֖ק עַל יִשְׂרָאֵ֑ל וְ/הִנָּ֥/ם כְּתוּבִ֖ים עַל הַ/קִּינֽוֹת־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
  footnotes:
  - marker: a
    text: Or 'written in the laments,' if the phrase refers generically to lament songs rather than to a specific collection titled Laments.
    reason: alternative_reading
translation:
  language: ko
  text: 예레미야는 요시야를 위하여 애도했습니다. 노래하는 남자들과 노래하는 여자들 모두가 오늘날까지 그들의 애가에서 요시야를 노래합니다. 그들은 그것들을 이스라엘의 규례로 삼았으며, 보십시오, 그것들은 애가에 기록되어 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘애가’는 특정 애가 모음집의 제목일 수도 있고, 일반적인 애가들을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְקוֹנֵן
  english_pob_choice: lamented
  chosen_korean: 애가를 지었다
  alternatives_korean:
  - 애도했다
  - 곡을 지었다
  - 슬퍼하며 불렀다
  lexicon: HALOT
  rationale: קונן은 죽은 이를 위한 애가/곡을 짓는 의미가 핵심이므로, 단순한 감정표현보다 문학적·의례적 행위를 드러내는 ‘애가를 지었다’가 가장 가깝습니다.
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  english_pob_choice: the male singers and female singers
  chosen_korean: 남자 노래하는 이들과 여자 노래하는 이들
  alternatives_korean:
  - 남녀 가수들
  - 노래하는 남자들과 노래하는 여자들
  - 남자와 여자 노래꾼들
  lexicon: HALOT
  rationale: 히브리어는 성별 구분을 분명히 하므로, 직분화된 ‘가수’보다 기능을 드러내는 ‘노래하는 이들’로 옮기되 남녀 구분을 보존했습니다.
- source_word: וַ/יֹּאמְר֣וּ ... בְּ/קִינ֨וֹתֵי/הֶ֤ם
  english_pob_choice: spoke of Josiah in their laments
  chosen_korean: 그들의 애가에서 요시야를 말합니다
  alternatives_korean:
  - 그들의 애가에서 요시야를 말했습니다
  - 그들의 애가로 요시야를 노래합니다
  - 그들의 애가 가운데 요시야를 언급합니다
  lexicon: HALOT
  rationale: ‘말하다’는 직역이지만, 애가 문맥에서는 노래/낭송의 지속적 관행을 뜻하므로 POB의 ‘speak of’에 맞춰 현재형으로 살렸습니다. ‘오늘까지’와 함께 지속성을 나타내기 위해 현재형이 더 적절합니다.
- source_word: לְחֹק
  english_pob_choice: a statute
  chosen_korean: 규례
  alternatives_korean:
  - 법령
  - 정례
  - 규정
  lexicon: HALOT
  rationale: חֹק은 고정된 규정·관례를 가리킬 수 있으므로, 제의·공동체 문맥에서 자연스럽고도 제도성을 담는 ‘규례’가 적절합니다.
theological_decisions:
- issue: וְהִנָּם כְּתוּבִים עַל הַקִּינוֹת의 범위
  chosen_reading: ‘애가에 기록되어 있습니다’로 옮겨, 특정 제목인 ‘The Laments’보다 일반적인 애가집/애가들에 기록된 가능성을 열어 두었습니다.
  alternative_readings:
  - ‘그 애가들에 기록되어 있습니다’
  - ‘애가라는 책에 기록되어 있습니다’
  rationale: 히브리어는 특정 문집 제목인지 일반 명칭인지 열려 있으므로, 본문 의미를 좁히지 않는 번역을 택했습니다. 이는 POB 각주가 지적한 해석 여지를 보존합니다.
  doctrine_reference: 본문비평/해석학적 유보
- issue: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל의 기능
  chosen_reading: ‘그들은 그것들을 이스라엘의 규례로 삼았으며’로 번역해, 애가가 공동체 안에서 고정된 관행이 되었음을 드러냈습니다.
  alternative_readings:
  - ‘이스라엘 가운데 규례로 세웠으며’
  - ‘이스라엘을 위한 규정으로 정했으며’
  rationale: 문맥상 단순한 행정 명령보다, 애가가 이스라엘 공동체의 지속적 관습으로 굳어진 뉘앙스가 강합니다. 따라서 제도성과 관습성을 함께 담았습니다.
  doctrine_reference: 성경적 전통/예전 문맥
