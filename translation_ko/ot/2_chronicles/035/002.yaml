    text: 또는 ‘그들의 근무조에’, ‘그들의 자리에’; 더 문자적으로는 ‘그들의 파수 위에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 강하게 하였습니다’ 또는 ‘그들에게 힘을 북돋웠습니다’.
