source:
  edition: WLC
  text: וַ/יַּעֲמֵ֥ד הַ/כֹּהֲנִ֖ים עַל מִשְׁמְרוֹתָ֑/ם וַֽ/יְחַזְּקֵ֔/ם לַ/עֲבוֹדַ֖ת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
  footnotes:
  - marker: a
    text: Or 'to their divisions,' 'at their posts,' or more literally 'over their watches.'
    reason: lexical_alternative
  - marker: b
    text: Or 'encouraged them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 제사장들을 그들의 직분에 세우고 야훼의 집의 봉사를 위해 그들을 격려하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 부서들’, ‘그들의 자리에’, 더 문자적으로는 ‘그들의 파수 위에’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들을 격려하였습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  english_pob_choice: He appointed
  chosen_korean: 세우고
  alternatives_korean:
  - 임명하고
  - 배치하고
  - 세워 두고
  lexicon: HALOT
  rationale: 히필형 עמד는 사람을 특정 위치나 역할에 두는 행정적 의미가 있어, 문맥에 맞게 ‘세우다’로 옮기면 임명·배치의 뜻을 자연스럽게 담을 수 있습니다.
- source_word: עַל מִשְׁמְרוֹתָם
  english_pob_choice: to their duties
  chosen_korean: 그들의 직분에
  alternatives_korean:
  - 그들의 부서에
  - 그들의 파수에
  - 그들의 직무에
  lexicon: HALOT
  rationale: מִשְׁמָרוֹת는 성전 봉사에서 맡은 맡은바 직분·순번·경비를 가리키므로, 현대 한국어에서는 ‘직분’이 기능적 의미를 가장 균형 있게 전달합니다.
- source_word: וַיְחַזְּקֵם
  english_pob_choice: and strengthened them
  chosen_korean: 격려하였습니다
  alternatives_korean:
  - 강하게 하였습니다
  - 굳세게 하였습니다
  - 용기를 주었습니다
  lexicon: HALOT
  rationale: חזק의 פּיעל은 실제로 힘을 북돋우거나 용기를 주는 뜻을 함께 지니므로, 이 문맥에서는 성전 봉사를 위해 사기를 북돋우는 뜻을 살려 ‘격려하다’로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집안
  lexicon: HALOT
  rationale: 직역성을 살리면서도 성전 문맥이 분명하므로, 본문 이미지인 ‘집’을 유지한 ‘야훼의 집’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 야훼의 고유명사가 직접 나오므로, 본 프로젝트 기본 방침에 따라 경칭 대체어 대신 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
