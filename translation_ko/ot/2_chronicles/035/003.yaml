  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
  footnotes:
  - marker: a
    text: Or 'the Levites who gave understanding to all Israel' or 'the Levites who were instructed for all Israel.' The Hebrew participle can carry the sense of being discerning/instructed or of giving instruction.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in the house'; that is, the temple built by Solomon.
    reason: cultural_note
  - marker: c
    text: Literally, 'there is no burden for you on the shoulder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 레위 사람들, 곧 온 이스라엘을 가르친 사람들[a], 곧 야훼께 거룩한 사람들에게 말했습니다. “거룩한 궤를 솔로몬이, 이스라엘 왕 다윗의 아들이 지은 집에 두십시오. 이제 여러분은 그것을 어깨에 멜 필요가 없습니다[c][b]. 이제 야훼, 여러분의 하나님과 그의 백성 이스라엘을 섬기십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 이스라엘을 위해 이해력을 지닌 레위 사람들’ 혹은 ‘온 이스라엘에게 가르침을 준 레위 사람들’로도 옮길 수 있습니다. 히브리어 분사는 이해력/가르침의 두 가능성을 모두 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘집 안에’입니다. 즉 솔로몬이 지은 성전을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘어깨에 짐이 없다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ה/מבונים
  english_pob_choice: who taught
  chosen_korean: 온 이스라엘을 가르친 사람들
  alternatives_korean:
  - 온 이스라엘을 위해 가르침을 받은 사람들
  - 온 이스라엘을 이해한 사람들
  - 온 이스라엘에게 가르침을 준 사람들
  lexicon: HALOT
  rationale: בין 계열 분사의 문맥상 의미를 레위인의 교육 기능으로 살려, 자연스럽고 기능적으로는 ‘가르친’으로 옮겼습니다.
- source_word: הַ/קְּדוֹשִׁים לַ/יהוָה
  english_pob_choice: who were holy to Yahweh
  chosen_korean: 야훼께 거룩한 사람들
  alternatives_korean:
  - 야훼께 성별된 사람들
  - 야훼께 속한 거룩한 사람들
  lexicon: HALOT
  rationale: קדושׁים לַיהוה의 성별/소속 뉘앙스를 살리면서, POB의 ‘Yahweh’를 반영해 ‘야훼께 거룩한’으로 옮겼습니다.
- source_word: תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּדֶשׁ בַּ/בַּיִת
  english_pob_choice: Put the holy ark in the house
  chosen_korean: 거룩한 궤를 … 집에 두십시오
  alternatives_korean:
  - 거룩한 궤를 … 성전에 두십시오
  - 거룩한 궤를 … 집 안에 두십시오
  lexicon: HALOT
  rationale: אֲרוֹן הַקֹּדֶשׁ은 ‘거룩한 궤’로 직역해 성스러움의 수식을 보존했고, בַּבַּיִת는 원문의 투명성을 위해 ‘집’으로 유지했습니다.
- source_word: אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף
  english_pob_choice: You no longer have to carry it on your shoulders
  chosen_korean: 이제 여러분은 그것을 어깨에 멜 필요가 없습니다
  alternatives_korean:
  - 이제 여러분에게는 어깨의 짐이 없습니다
  - 이제 여러분은 어깨로 그것을 질 일이 없습니다
  lexicon: HALOT
  rationale: 직역하면 ‘어깨에 짐이 없다’이지만, 한국어에서는 의미를 분명히 하되 이미지도 살려 ‘어깨에 멜 필요가 없다’로 옮겼습니다.
- source_word: עִבְדוּ
  english_pob_choice: Now serve
  chosen_korean: 이제 … 섬기십시오
  alternatives_korean:
  - 이제 … 봉사하십시오
  - 이제 … 예배하십시오
  lexicon: HALOT
  rationale: עבד의 예배/봉사 맥락을 고려하되, 야훼와 백성을 함께 목적어로 두는 구조를 살리기 위해 ‘섬기십시오’를 택했습니다.
- source_word: וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל
  english_pob_choice: and his people Israel
  chosen_korean: 그리고 그의 백성 이스라엘
  alternatives_korean:
  - 그리고 이스라엘, 그의 백성
  - 그리고 그의 백성인 이스라엘
  lexicon: HALOT
  rationale: 이스라엘을 하나님의 언약 백성으로 지칭하는 소유 관계를 한국어에서 가장 자연스럽게 드러내는 표현으로 처리했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문과 도치 모두에서 יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값과 원문 고유명사 보존 원칙에 따라, 칭호인 ‘주’로 대체하지 않고 신명 자체를 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 레위인의 역할 표현
  chosen_reading: ‘온 이스라엘을 가르친 사람들’로 옮겨 교육 기능을 드러냈습니다.
  alternative_readings:
  - 가르침을 받은 사람들
  - 이해력이 있는 사람들
  rationale: 분사의 의미 범위가 ‘이해하다/이해력을 갖다/가르치다’로 넓지만, 역대기 문맥에서 레위인의 공적 기능은 백성을 가르치는 쪽이 가장 잘 드러납니다.
  doctrine_reference: 'POB lexical decision: ה/מבונים'
