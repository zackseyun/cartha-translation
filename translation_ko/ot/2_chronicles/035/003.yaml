review_pass:
  verdict: revise
  source_fidelity: 원문의 주요 구조와 의미는 대체로 충실합니다. 다만 הַקְּדֹשִׁים לַיהוה는 단순히 ‘야훼께 거룩한 사람들’보다 야훼께 구별되어 드려진 신분을 드러내는 표현이 더 정확합니다. 또한 솔로몬을 ‘이스라엘 왕 다윗의 아들’로 명확히 수식해야 원문의 계보·왕칭 구조가 한국어에서 혼동되지 않습니다.
  naturalness: 초안의 ‘레위 사람들, 곧 … 사람들, 곧 … 사람들’은 동격이 반복되어 다소 무겁고, ‘솔로몬이, 이스라엘 왕 다윗의 아들이 지은’은 수식 관계가 부자연스럽습니다. 이를 현대 표준어 합쇼체의 매끄러운 관계절로 정리했습니다.
  terminology: ‘야훼’, ‘레위 사람들’, ‘이스라엘’, ‘하나님’, ‘섬기십시오’는 일관되고 적절합니다. אֲרוֹן הַקֹּדֶשׁ은 원문의 수식을 보존하여 ‘거룩한 궤’로 유지했습니다. הַקְּדֹשִׁים לַיהוה는 ‘야훼께 성별된’으로 조정했습니다.
  issues:
  - severity: medium
    issue: ‘야훼께 거룩한 사람들’의 표현
    rationale: 한국어에서는 ‘~께 거룩한’이 자연스럽지 않으며, לַיהוה가 나타내는 야훼께 드려지고 구별된 신분도 충분히 드러나지 않습니다.
  - severity: medium
    issue: ‘솔로몬이, 이스라엘 왕 다윗의 아들이 지은 집’의 수식 구조
    rationale: 쉼표와 조사의 배치 때문에 ‘이스라엘 왕’이 솔로몬인지 다윗인지, 그리고 누가 집을 지었는지가 순간적으로 불명확합니다. 원문은 ‘이스라엘 왕 다윗의 아들 솔로몬’이 성전을 지었다고 합니다.
  - severity: low
    issue: 각주 b와 c의 앵커 위치 및 순서
    rationale: b는 ‘집’의 의미를 설명하므로 ‘집’ 바로 뒤에 두고, c는 어깨에 지는 짐의 관용구를 설명하므로 해당 문장 끝에 두는 편이 독자의 참조를 분명하게 합니다.
  revised_text: 그가 온 이스라엘을 가르치며 야훼께 성별된 레위 사람들에게 말했습니다. “거룩한 궤를 이스라엘 왕 다윗의 아들 솔로몬이 지은 집에[b] 두십시오. 더 이상 여러분은 그것을 어깨에 멜 필요가 없습니다[c]. 이제 야훼, 여러분의 하나님과 그의 백성 이스라엘을 섬기십시오.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘온 이스라엘을 위해 이해력을 지닌 레위 사람들’ 또는 ‘온 이스라엘에게 가르침을 받은 레위 사람들’로 옮길 수 있습니다. 히브리어 분사는 이해력이 있거나 가르침을 주거나 받는 의미 범위를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘집 안에’입니다. 곧 솔로몬이 지은 성전을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘여러분에게 어깨에 질 짐이 없다’입니다.
    reason: lexical_alternative
  revision_rationale: 레위 사람들을 수식하는 두 분사를 반복 동격 대신 병렬 관계절로 옮겨 원문의 수식 관계를 자연스럽게 보존했습니다. ‘성별된’은 야훼께 속하도록 구별된 제의적 지위를 나타내며, 특정 교파적 해석을 덧붙이지 않습니다. 솔로몬의 계보와 왕칭을 ‘이스라엘 왕 다윗의 아들 솔로몬’으로 재배열했습니다. 각주 a는 본문에 선택된 ‘가르치며’의 의미를 보완하므로 본문 앵커 없이 각주 목록에 유지할 이유가 없으므로, 해당 의미 불확실성을 본문 앵커로 표시했습니다.
