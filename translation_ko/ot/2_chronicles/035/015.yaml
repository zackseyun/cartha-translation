  source_fidelity: 대체로 히브리어 본문을 충실히 반영합니다. 다만 주석 표지는 해당 표현 바로 뒤에 놓여야 하며, 히브리어의 '그들의 형제들, 곧 레위인들'이라는 병치 관계는 ‘그들의 형제인 레위인들’로 더 분명하게 드러낼 수 있습니다.
  naturalness: ‘자기 자리에’와 ‘레위 사람들’도 이해되지만, 성전 봉사의 정해진 배치라는 문맥에는 ‘정해진 자리에’가 자연스럽고, 직분 집단에는 ‘레위인들’이 더 통용됩니다. 주석 표지를 문장 끝에 함께 붙인 현재 방식은 어느 말에 관한 주석인지 불분명합니다.
  terminology: ‘선견자’, ‘문지기들’, ‘직무’는 적절합니다. ‘여두둔’에 대한 ‘왕의 선견자’의 수식 관계를 본문과 주석에서 유지합니다.
  issues:
