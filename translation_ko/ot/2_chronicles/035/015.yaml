source:
  edition: WLC
  text: וְ/הַ/מְשֹֽׁרֲרִ֨ים בְּנֵי אָסָ֜ף עַל מַעֲמָדָ֗/ם כְּ/מִצְוַ֤ת דָּוִיד֙ וְ/אָסָ֞ף וְ/הֵימָ֤ן וִֽ/ידֻתוּן֙ חוֹזֵ֣ה הַ/מֶּ֔לֶךְ וְ/הַ/שֹּׁעֲרִ֖ים לְ/שַׁ֣עַר וָ/שָׁ֑עַר אֵ֣ין לָ/הֶ֗ם לָ/סוּר֙ מֵ/עַ֣ל עֲבֹֽדָתָ֔/ם כִּֽי אֲחֵי/הֶ֥ם הַ/לְוִיִּ֖ם הֵכִ֥ינוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
  footnotes:
  - marker: a
    text: Or, 'They were not to depart from their service.' The Hebrew can be taken more strongly, though the following clause favors the sense that they did not need to leave because the Levites prepared for them.
    reason: alternative_reading
  - marker: b
    text: '''The king’s seer'' most naturally refers to Jeduthun.'
    reason: lexical_alternative
translation:
  language: ko
  text: 노래하는 자들, 곧 아삽의 자손들은 다윗과 아삽과 헤만과 왕의 선견자 여두둔[b]의 명령대로 정해진 자리에 있었고, 문지기들은 문마다 있었습니다. 그들은 자기들의 직무를 떠날 필요가 없었으니[a], 그들의 형제인 레위인들이 그들을 위해 준비해 주었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 자기들의 직무를 떠나서는 안 되었다.’ 히브리어는 더 강하게 읽을 수도 있으나, 이어지는 이유절은 레위인들이 준비해 주었기 때문에 그들이 떠날 필요가 없었다는 뜻을 뒷받침합니다.
    reason: alternative_reading
  - marker: b
    text: ‘왕의 선견자’는 가장 자연스럽게 여두둔을 수식합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  english_pob_choice: the singers
  chosen_korean: 노래하는 자들
  alternatives_korean:
  - 가수들
  - 노래꾼들
  lexicon: HALOT
  rationale: 히브리어 분사형은 성전 봉사에 종사하는 ‘노래하는 사람들’을 가리키므로, 단순 직역인 ‘노래하는 자들’이 문맥을 가장 정확하게 반영합니다.
- source_word: בְּנֵי אָסָף
  english_pob_choice: the sons of Asaph
  chosen_korean: 아삽의 자손들
  alternatives_korean:
  - 아삽의 아들들
  - 아삽의 후손들
  lexicon: HALOT
  rationale: 직역하면 ‘아삽의 아들들’이지만, 시편/성전 봉사 집단을 가리키는 관용으로 ‘자손들’이 한국어에서 더 자연스럽고 오해가 적습니다.
- source_word: חוֹזֵה הַמֶּלֶךְ
  english_pob_choice: the king’s seer
  chosen_korean: 왕의 선견자
  alternatives_korean:
  - 왕의 선지자
  - 왕의 예언자
  lexicon: HALOT
  rationale: חוֹזֶה는 일반적인 예언자보다 기술적인 ‘선견자’에 가깝기 때문에, 구약의 직분 뉘앙스를 살려 ‘선견자’로 옮겼습니다.
- source_word: לְשַׁעַר וָשָׁעַר
  english_pob_choice: at each gate
  chosen_korean: 각 문에
  alternatives_korean:
  - 문마다
  - 모든 문에
  lexicon: HALOT
  rationale: 분배적 표현이므로 성전의 각 출입문에 배치되었다는 뜻을 간결하게 살려 ‘각 문에’로 번역했습니다.
- source_word: עֲבֹדָתָם
  english_pob_choice: their service
  chosen_korean: 자기들의 직무
  alternatives_korean:
  - 자기들의 봉사
  - 자기들의 일
  lexicon: HALOT
  rationale: 성전 문맥의 עֲבֹדָה는 단순한 노동보다 공적 맡은 일을 뜻하므로, 현대 한국어에서 기능을 잘 드러내는 ‘직무’를 택했습니다.
theological_decisions:
- issue: אֵין לָהֶם לָסוּר의 힘
  chosen_reading: ‘떠날 필요가 없었다’는 뜻으로 이해해, 금지보다 필요 없음과 사정 설명을 살렸습니다.
  alternative_readings:
  - ‘그들은 떠나지 말아야 했다’처럼 금지로 옮길 수도 있습니다.
  rationale: 뒤이어 ‘그들의 형제 레위 사람들이 그들을 위하여 준비해 두었다’는 이유절이 오므로, 본문은 명령형보다 사정상 떠날 필요가 없었다는 설명으로 읽는 것이 자연스럽습니다.
  doctrine_reference: Translation philosophy §1, §5
