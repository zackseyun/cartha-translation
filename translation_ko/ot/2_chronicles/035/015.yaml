revisions:
- from: 노래하는 자들, 곧 아삽의 자손들은 다윗과 아삽과 헤만과 왕의 선견자 여두둔의 명령에 따라 자기 자리에 있었고, 문지기들은 각 문에 있었습니다. 그들은 자기들의 직무를 떠날 필요가 없었으니, 이는 그들의 형제 레위 사람들이 그들을 위하여 준비해 두었기 때문입니다.[a][b]
  to: 노래하는 자들, 곧 아삽의 자손들은 다윗과 아삽과 헤만과 왕의 선견자 여두둔[b]의 명령대로 정해진 자리에 있었고, 문지기들은 문마다 있었습니다. 그들은 자기들의 직무를 떠날 필요가 없었으니[a], 그들의 형제인 레위인들이 그들을 위해 준비해 주었기 때문입니다.
  rationale: 본문의 의미는 유지하면서, 주석 표지를 각 관련 어구에 붙여 지시 대상을 명확히 했습니다. 또한 성전 직분 집단을 가리키는 표현을 ‘레위인들’로 다듬고 히브리어의 동격 관계를 명료하게 했습니다. ‘준비해 주었다’는 목적어를 특정하지 않아 히브리어의 생략을 보존합니다.
  reviewer_model: gpt-5.6-terra
