base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
  footnotes:
  - marker: a
    text: Or 'the Passover sacrifice.' The Hebrew refers to the Passover victim being slaughtered.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'splashed' is the standard sacrificial term for applying blood at the altar; it can also be rendered 'sprinkled' in English tradition.
    reason: lexical_alternative
  - marker: c
    text: That is, the Levites were removing the hides from the slaughtered sacrificial animals.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 유월절 제물을 잡고, 제사장들은 그들의 손에서 피를 뿌렸으며, 레위 사람들은 가죽을 벗기고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유월절 희생제물’. 히브리어는 유월절 희생 짐승이 잡히는 장면을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘뿌렸다’는 표현은 제단에 피를 적용하는 제의적 동작을 가리키며, 전통 번역에서는 ‘뿌렸다’ 또는 ‘뿌리었다’로 옮겨 왔습니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 레위 사람들은 잡힌 희생 동물의 가죽을 벗기고 있었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּסַח
  english_pob_choice: the Passover lamb / the Passover sacrifice
  chosen_korean: 유월절 제물
  alternatives_korean:
