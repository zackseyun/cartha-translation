base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
  footnotes:
  - marker: a
    text: Or 'the Passover sacrifice.' The Hebrew refers to the Passover victim being slaughtered.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'splashed' is the standard sacrificial term for applying blood at the altar; it can also be rendered 'sprinkled' in English tradition.
    reason: lexical_alternative
  - marker: c
    text: That is, the Levites were removing the hides from the slaughtered sacrificial animals.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 유월절 제물[a]을 잡고, 제사장들은 그들의 손에서 피를 뿌렸으며[b], 레위 사람들은 가죽을 벗기고 있었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유월절 희생제물’. 히브리어는 유월절 희생 짐승이 잡히는 장면을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘뿌렸다’는 제단에 피를 적용하는 제의적 동작을 가리킵니다. 영어 번역 전통에서는 ‘뿌리다’로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 즉, 레위 사람들은 잡힌 희생 동물의 가죽을 벗기고 있었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּסַח
  english_pob_choice: the Passover lamb / the Passover sacrifice
  chosen_korean: 유월절 제물
  alternatives_korean:
  - 유월절 양
  - 유월절 희생제물
  lexicon: 유월절
  rationale: 문맥상 잡아 죽이는 제의적 희생을 가리키므로, ‘양’으로 좁히기보다 제물로 옮겨 히브리어의 제의적 범위를 살렸습니다.
- source_word: וַיִּזְרְקוּ
  english_pob_choice: splashed
  chosen_korean: 피를 뿌렸으며
  alternatives_korean:
  - 피를 튀겼으며
  - 피를 뿌리며
  lexicon: 뿌리다
  rationale: 제사장들의 제의 행위를 나타내는 표준적 표현으로, 전통적 제사 문맥을 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: מִיָּדָם
  english_pob_choice: from their hands
  chosen_korean: 그들의 손에서
  alternatives_korean:
  - 그들의 손으로부터
  - 그들의 손에서부터
  lexicon: 손
  rationale: 히브리어 전치사구를 자연스럽게 반영하되, 피를 제사장들이 직접 다루는 장면임을 유지했습니다.
- source_word: מַפְשִׁיטִים
  english_pob_choice: were skinning
  chosen_korean: 가죽을 벗기고 있었습니다
  alternatives_korean:
  - 껍질을 벗기고 있었습니다
  - 가죽을 벗기고 있었습니다
  lexicon: 가죽을 벗기다
  rationale: 희생 제물의 처리 동작을 직접적으로 보여 주는 표현으로, ‘skin’의 물리적 의미를 충실히 반영했습니다.
theological_decisions:
- issue: 유월절 제물의 제의적 성격
  chosen_reading: ‘유월절 제물’로 번역하여 단순한 식사용 양이 아니라 희생 제물임을 분명히 했습니다.
  alternative_readings:
  - 유월절 양
  - 유월절 희생제물
  rationale: 본문은 제사장들이 피를 뿌리고 레위 사람들도 제의 절차에 참여하는 장면이므로, 제의적 희생이라는 의미를 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 출애굽기 12장 유월절 규례와 역대기 제의 문맥
