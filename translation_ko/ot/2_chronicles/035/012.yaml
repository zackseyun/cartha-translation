  naturalness: '"제거하여"는 제물을 폐기한 듯 들릴 수 있어 제사 준비 문맥에서는 "따로 떼어 내어"가 더 자연스럽고 정확합니다. "아버지들의 집안"도 현대 표준어에서는 "조상들의 집안"이 더 자연스럽습니다. 마지막의 "소의 경우도"보다 "소도 그와 같이 하였습니다"가 히브리어의 타원적 확장을 자연스럽게 재현합니다.'
  terminology: '"번제물", "야훼", "모세의 책" 및 "바치다"는 적절합니다. לִבְנֵי הָעָם의 직역적 표현은 본문에 유지하되, 각주의 설명을 현대 한국어로 조금 다듬는 것이 좋습니다.'
