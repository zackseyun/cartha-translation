source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
  footnotes:
  - marker: a
    text: Or “to the people” or “to the lay people.” Hebrew “to the sons of the people,” a clan-based expression distinguishing the general populace from the priests and Levites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 번제물[a]을 따로 떼어 내어, 백성의 자손들 가운데 조상들의 집안별로 나누어 주고, 모세의 책에 기록된 대로 야훼께 바치게 하였습니다. 소도 그와 같이 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “백성에게”, “평민들에게”. 히브리어는 문자적으로 “백성의 자손들”이며, 제사장과 레위인에 견주어 일반 백성을 가리키는 씨족·가문 관련 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  english_pob_choice: They removed
  chosen_korean: 제거하여
  alternatives_korean:
  - 치워서
  - 옮겨서
  - 꺼내어
  lexicon: HALOT
  rationale: 제사 준비 과정에서 제물을 분리해 내는 동작을 간결하게 살리면서, 단순한 이동보다 '분리·제거'의 의미를 드러냅니다.
- source_word: הָעֹלָה
  english_pob_choice: the burnt offerings
  chosen_korean: 번제물
  alternatives_korean:
  - 번제들
  - 번제
  - 번제 제물
  lexicon: HALOT
  rationale: 히브리어 단수형이지만 문맥상 여러 제물의 집합을 가리키므로 한국어에서는 자연스럽게 집합명사처럼 '번제물'로 옮겼습니다.
- source_word: לִבְנֵי הָעָם
  english_pob_choice: to the sons of the people
  chosen_korean: 백성의 자손들에게
  alternatives_korean:
  - 백성에게
  - 평민들에게
  - 일반 백성에게
  lexicon: HALOT
  rationale: 직역인 '백성의 자손들'의 대표성 있는 표현을 유지하면서도 한국어 문맥에서 자연스럽게 읽히도록 했습니다. 이 표현은 제사직 계층과 구별되는 일반 백성을 가리킵니다.
- source_word: לְהַקְרִיב לַיהוָה
  english_pob_choice: to present to Yahweh
  chosen_korean: 야훼께 바치게
  alternatives_korean:
  - 야훼께 드리게
  - 야훼께 제사드리게
  - 야훼께 올리게
  lexicon: HALOT
  rationale: 제의적 맥락의 הקריב는 '바치다/드리다'가 자연스럽고, 대상이 야훼이므로 경외적 방향을 드러내는 '-께'를 사용했습니다.
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  english_pob_choice: as it is written in the Book of Moses
  chosen_korean: 모세의 책에 기록된 대로
  alternatives_korean:
  - 모세의 책에 기록된 것처럼
  - 모세의 책에 적힌 대로
  lexicon: HALOT
  rationale: 성문서 공식을 한국어 성경 문체로 자연스럽게 옮기되, 기록된 권위를 드러내는 '기록된 대로'를 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 YHWH가 직접 나오므로 프로젝트 기본값에 따라 고유 신명 '야훼'를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: לִבְנֵי הָעָם의 대표적·계층 구분적 의미
  chosen_reading: 백성의 자손들
  alternative_readings:
  - 백성
  - 평민들
  - 일반 백성
  rationale: 히브리어의 남성형·대표적 표현을 지우지 않으면서, 제의 담당자들과 구별되는 일반 백성이라는 문맥을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
