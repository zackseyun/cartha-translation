  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ו/כונניהו וּ/שְׁמַֽעְיָ֨הוּ וּ/נְתַנְאֵ֜ל אֶחָ֗י/ו וַ/חֲשַׁבְיָ֧הוּ וִ/יעִיאֵ֛ל וְ/יוֹזָבָ֖ד שָׂרֵ֣י הַ/לְוִיִּ֑ם הֵרִ֨ימוּ לַ/לְוִיִּ֤ם לַ/פְּסָחִים֙ חֲמֵ֣שֶׁת אֲלָפִ֔ים וּ/בָקָ֖ר חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
  footnotes:
  - marker: a
    text: Or 'for the Passover sacrifices' or more literally 'for the Passovers.' The Hebrew plural likely refers to the animals designated for Passover observance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 고나냐와 스마야, 그리고 그의 형제 넷난엘과 하사브야와 여이엘과 요사밧, 곧 레위 사람들의 우두머리들이 레위 사람들에게 유월절 제물로 소와 짐승 오천오백을 내놓았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ו/כונניהו
  english_pob_choice: Conaniah
  chosen_korean: 고나냐
  alternatives_korean:
  - 코나냐
  - 곤냐후
  lexicon: 고유명사
  rationale: 히브리어 האיש명 כונניהו를 표준 음역으로 옮겼습니다. 본문 인명의 식별성을 위해 기존 교회식 음역보다 원어 음가에 가까운 형태를 택했습니다.
- source_word: שָׂרֵי הַלְוִיִּם
  english_pob_choice: the chiefs of the Levites
  chosen_korean: 레위 사람들의 우두머리들
  alternatives_korean:
  - 레위 사람들의 지도자들
  - 레위 사람들의 수장들
  lexicon: HALOT
  rationale: שָׂרֵי는 공식적 지도층을 가리키므로, ‘우두머리들’로 옮겨 지위와 권위를 분명히 했습니다.
- source_word: הֵרִימוּ
  english_pob_choice: contributed
  chosen_korean: 내놓았습니다
  alternatives_korean:
  - 기부했습니다
  - 바쳤습니다
  - 드렸습니다
  lexicon: HALOT
  rationale: 이 동사는 문자적으로 ‘들어 올리다’이지만 여기서는 제의적/행정적 헌납 행위를 뜻하므로, 문맥에 맞게 ‘내놓았습니다’로 자연스럽게 풀었습니다.
- source_word: לַ/פְּסָחִים
  english_pob_choice: for the Passover offerings
  chosen_korean: 유월절 제물로
  alternatives_korean:
  - 유월절 제사로
  - 유월절 희생물로
  - 유월절 제물들을 위하여
  lexicon: HALOT
  rationale: 복수형 פְּסָחִים는 유월절 절기 자체보다 유월절에 쓰인 제의적 희생물을 가리키므로, ‘유월절 제물’로 옮겼습니다.
- source_word: וּ/בָקָר חֲמֵ֥שׁ מֵאֽוֹת
  english_pob_choice: and five hundred cattle
  chosen_korean: 소와 짐승 오천오백
  alternatives_korean:
  - 오천오백 마리의 소와 짐승
  - 가축 오천오백
  - 소 오천오백과 짐승 오백
  lexicon: HALOT
  rationale: בקר는 집합명사로 가축/소 떼를 가리키므로, 본문의 숫자와 함께 한국어에서 자연스러운 집합 표현으로 처리했습니다.
theological_decisions:
- issue: 유월절 제물의 범주 표현
  chosen_reading: 제의적 희생을 분명히 드러내는 ‘유월절 제물’로 번역했습니다.
  alternative_readings:
  - 유월절 양들
  - 유월절 희생제물
  - 유월절 제사
  rationale: 본문의 히브리어 복수형과 POB의 ‘Passover offerings’는 단순한 축제 명칭이 아니라 제의적 대상물을 가리킵니다. 따라서 절기명으로 완화하지 않고 제물성을 유지했습니다.
  doctrine_reference: 출애굽기 12장 유월절 제정, 레위기 제의 용례
