  lexicon: HALOT
  rationale: 주의를 끄는 강조 입자이므로 단순 생략하지 않고, 독자를 향한 직접적인 주목 요청으로 살렸습니다.
- source_word: עַל סֵפֶר
  english_pob_choice: in the Book
  chosen_korean: 책에
  alternatives_korean:
  - 두루마리에
