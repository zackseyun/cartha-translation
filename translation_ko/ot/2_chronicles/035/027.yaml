source:
  edition: WLC
  text: וּ/דְבָרָ֕י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: Now his acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
  footnotes:
  - marker: a
    text: Or 'his words' or 'his deeds'; the Hebrew term can denote words, matters, or acts. In this royal summary context, 'acts' best fits the sense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'behold,' an emphatic particle drawing attention to the written source.
    reason: lexical_alternative
  - marker: c
    text: Or 'on the scroll/book of the Kings of Israel and Judah.' The Hebrew preposition is literally 'on/upon,' but English idiom commonly uses 'in' for written records.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[b], 그의 행적[a], 곧 처음부터 마지막까지의 일은 이스라엘과 유다 왕들의 책[c]에 기록되어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דְבָרָיו는 ‘말들’, ‘일들’, ‘사안들’, 또는 ‘행적’을 뜻할 수 있습니다. 왕의 생애를 요약하는 이 문맥에서는 ‘행적’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 הִנָּם은 주의를 환기하며 뒤따르는 진술을 강조하는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 전치사는 문자적으로 ‘위에/위로’이지만, 기록 문헌을 가리키는 한국어 관용에 따라 ‘책에 기록되어 있습니다’로 옮겼습니다. ‘책’은 ‘두루마리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  english_pob_choice: his acts
  chosen_korean: 그의 행적
  alternatives_korean:
  - 그의 말들
  - 그의 일들
  - 그의 사건들
  lexicon: HALOT
  rationale: דבר는 '말'뿐 아니라 '일/사안/행적'까지 가리킬 수 있으며, 왕의 생애를 요약하는 문맥에서는 '행적'이 영어 POB의 'acts'를 가장 자연스럽게 반영합니다.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  english_pob_choice: first and last
  chosen_korean: 처음 것과 마지막 것
  alternatives_korean:
  - 처음과 마지막
  - 이전 것과 이후 것
  - 처음부터 마지막까지
  lexicon: HALOT
  rationale: 역대기에서 사람의 생애 전반을 가리키는 관용구이므로, 시간의 전 범위를 드러내되 한국어에서 문맥상 자연한 형태로 옮겼습니다.
- source_word: הִנָּם
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  - 참으로
  lexicon: HALOT
  rationale: 주의를 끄는 강조 입자이므로 단순 생략하지 않고, 독자를 향한 직접적인 주목 요청으로 살렸습니다.
- source_word: עַל סֵפֶר
  english_pob_choice: in the Book
  chosen_korean: 책에
  alternatives_korean:
  - 두루마리에
  - 책 위에
  - 책 안에
  lexicon: HALOT
  rationale: 문서 인용 공식에서 히브리어의 문자적 '위에'보다 한국어 관용에 맞는 '...에 기록되어 있습니다'가 더 자연스럽습니다.
