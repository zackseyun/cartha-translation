  source_fidelity: 전반적으로 히브리어의 사건 순서와 의미를 충실히 옮겼습니다. 다만 מִתְאַבְּלִים은 일반적인 애도의 뜻으로, ‘애곡하다’는 소리 내어 곡하는 행위를 다소 구체적으로 암시할 수 있으므로 ‘애도했습니다’가 더 직접적이고 안전합니다.
  naturalness: 합쇼체 서술은 일관되고 자연스럽습니다. ‘그의 것이던’도 이해되지만 ‘그가 가진’이 현대 한국어에서 더 간결하고 자연스럽습니다.
  terminology: ‘병거’, ‘유다’, ‘예루살렘’, ‘요시야’, ‘조상들의 무덤’은 적절합니다. עֲבָדָיו를 왕의 수행자라는 문맥에서 ‘신하들’로 옮긴 것도 가능합니다. 각주의 ‘둘째 [자의] 병거’는 한국어 표현으로 부자연스러우므로 히브리어 구문의 생략과 해석의 잠정성을 분명히 밝혀야 합니다.
