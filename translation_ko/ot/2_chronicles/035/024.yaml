base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the chariot of the second [one],' likely meaning Josiah's secondary or reserve chariot.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그의 신하들이 그를 병거에서 옮겨 그의 것이던 둘째 병거에 태워 예루살렘으로 데려왔습니다. 그가 죽어 그의 조상들의 무덤에 장사되었고, 온 유다와 예루살렘이 요시야를 두고 애곡했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘둘째 [자의] 병거’로, 여기서는 요시야의 예비 또는 보조 병거를 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו / his servants
  english_pob_choice: his servants
  chosen_korean: 그의 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 시종들
  lexicon: HALOT
  rationale: 왕을 수행하는 사람들로서의 맥락상 ‘신하들’이 자연스럽고, 단순 노복보다 신분과 수행 역할을 더 잘 드러냅니다.
- source_word: רֶכֶב הַמִּשְׁנֶה / the second chariot
  english_pob_choice: the second chariot
  chosen_korean: 둘째 병거
  alternatives_korean:
  - 두 번째 병거
  - 예비 병거
  lexicon: HALOT
  rationale: 히브리어의 ‘둘째/두 번째’ 뉘앙스를 살리면서도 현대 한국어에서 읽히는 간결한 표현으로 옮겼습니다.
- source_word: אֲשֶׁר לוֹ / that belonged to him
  english_pob_choice: that belonged to him
  chosen_korean: 그의 것이던
  alternatives_korean:
  - 그의 것이었던
  - 그에게 속한
  lexicon: HALOT
  rationale: 소유 관계를 자연스럽게 드러내면서도, 바로 앞의 ‘둘째 병거’와의 연결을 매끄럽게 유지합니다.
- source_word: וְכָל יְהוּדָה וִירוּשָׁלַם / all Judah and Jerusalem
  english_pob_choice: all Judah and Jerusalem
  chosen_korean: 온 유다와 예루살렘
  alternatives_korean:
  - 유다와 예루살렘 전체가
  - 유다의 모든 사람들과 예루살렘
  lexicon: HALOT
  rationale: 집단 전체의 애곡을 가리키는 병렬 표현을 보존하기 위해 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 조의 표현의 시제와 어감
  chosen_reading: ‘애곡했습니다’로 옮겨 서술형 과거로 처리했습니다.
  alternative_readings:
  - ‘애곡하고 있었습니다’
  - ‘슬퍼했습니다’
  rationale: 히브리어 분사 מִתְאַבְּלִים의 진행성을 과도하게 풀기보다, 내러티브 문맥에서 자연스러운 과거 서술로 표현하되 ‘애곡’으로 강한 슬픔의 정도를 유지했습니다.
  doctrine_reference: 문맥/서술 시제
