  to: 그러자 그의 신하들이 그를 병거에서 옮겨 그가 가진 둘째 병거에 태워 예루살렘으로 데려왔습니다. 그가 죽어 그의 조상들의 무덤에 장사되었고, 온 유다와 예루살렘이 요시야를 애도했습니다.[a]
  rationale: 본문의 사건 순서와 ‘둘째 병거’라는 히브리어 표현의 해석상 여지를 유지했습니다. 애도의 일반적 의미를 보존하도록 ‘애곡했습니다’를 ‘애도했습니다’로 조정했으며, 각주는 직역과 문맥상 가능한 이해를 자연스러운 한국어로 제시했습니다.
