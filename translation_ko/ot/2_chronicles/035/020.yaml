  text: אַחֲרֵ֣י כָל זֹ֗את אֲשֶׁ֨ר הֵכִ֤ין יֹֽאשִׁיָּ֨הוּ֙ אֶת הַ/בַּ֔יִת עָלָ֞ה נְכ֧וֹ מֶֽלֶךְ מִצְרַ֛יִם לְ/הִלָּחֵ֥ם בְּ/כַרְכְּמִ֖ישׁ עַל פְּרָ֑ת וַ/יֵּצֵ֥א לִ/קְרָאת֖/וֹ יֹאשִׁיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
  footnotes:
  - marker: a
    text: Or 'had prepared the house,' with 'the house' referring to the temple.
    reason: lexical_alternative
  - marker: b
    text: '''Went out to meet him'' can also carry the sense ''went out against him'' in this military context.'
    reason: alternative_reading
translation:
  language: ko
  text: 이 모든 일 뒤에, 요시야가 그 집을 준비해 둔 후에 이집트 왕 느고가 유브라데에 있는 갈그미스에서 싸우러 올라갔고, 요시야가 그를 맞으러 나갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 집’은 여기서 성전을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘맞으러 나갔습니다’는 군사 문맥에서 ‘맞서러 나갔습니다’라는 뜻도 될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵ֣י כָל זֹ֗את
  english_pob_choice: After all this
  chosen_korean: 이 모든 일 뒤에
  alternatives_korean:
  - 그 모든 뒤에
  - 이 모든 것 후에
  lexicon: HALOT
  rationale: 히브리어 관용구의 시간적 순서를 자연스러운 현대 한국어로 옮기되, 사건의 누적된 맥락을 살려 간결하게 표현했습니다.
- source_word: הֵכִין אֶת הַבַּיִת
  english_pob_choice: had prepared the house
  chosen_korean: 그 집을 준비해 둔
  alternatives_korean:
  - 그 집을 준비한
  - 그 집을 정비한
  lexicon: HALOT
  rationale: POB의 선택처럼 הֵכִין의 결과적 준비 상태를 살리기 위해 ‘준비해 둔’을 택했고, ‘집’은 본문 그대로 유지하되 문맥상 성전을 가리키는 점은 그대로 두었습니다.
- source_word: בְּכַרְכְּמִישׁ עַל פְּרָת
  english_pob_choice: at Carchemish on the Euphrates
  chosen_korean: 유브라데에 있는 갈그미스에서
  alternatives_korean:
  - 유브라데 강가의 갈그미스에서
  - 유브라데 위의 갈그미스에서
  lexicon: HALOT
  rationale: 장소 관계를 나타내는 전치사들을 한국어에서 가장 자연스럽게 풀어, 전투 무대가 유브라데 강가의 갈그미스임을 분명히 했습니다.
- source_word: לִקְרָאתוֹ
  english_pob_choice: went out to meet him
  chosen_korean: 그를 맞으러 나갔습니다
  alternatives_korean:
  - 그를 대적하러 나갔습니다
  - 그와 만나려고 나갔습니다
  lexicon: HALOT
  rationale: 히브리어 자체는 ‘맞다/대하다’의 중립적 의미를 가지므로, 문맥의 군사적 긴장은 유지하되 본문이 직접 말하지 않는 적대성을 과도하게 덧씌우지 않았습니다.
theological_decisions:
- issue: ‘the house’의 정체를 본문에서 어떻게 드러낼지
  chosen_reading: 본문은 히브리어 표현을 따라 ‘그 집’으로 두고, 성전을 뜻한다는 해석은 본문 밖의 맥락에 맡겼습니다.
  alternative_readings:
  - ‘성전’을 본문에 명시하기
  - ‘그 성전’으로 옮기기
  rationale: 대상 독자가 문맥으로 식별할 수 있는 곳에서는 원문 표현을 보존하는 편이 source-direct 원칙에 더 충실합니다.
  doctrine_reference: source-direct translation principle
