source:
  edition: WLC
  text: וַ/יִּזְבְּח֤וּ לַ/יהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִן הַ/שָּׁלָ֖ל הֵבִ֑יאוּ בָּקָר֙ שְׁבַ֣ע מֵא֔וֹת וְ/צֹ֖אן שִׁבְעַ֥ת אֲלָפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
  footnotes:
  - marker: a
    text: Or 'from the plunder.' The Hebrew term refers to goods taken as war spoil.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word can more broadly mean 'flock animals' (sheep and goats), not only sheep.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 그들은 그들이 가져온 전리품[a] 가운데서 소 칠백 마리와 양[b] 칠천 마리를 야훼께 희생제물로 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘노획물 가운데서’. 히브리어는 전쟁에서 빼앗은 물품을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 צֹאן은 양뿐 아니라 염소를 포함한 작은 가축을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  english_pob_choice: they sacrificed
  chosen_korean: 희생제물을 드렸습니다
  alternatives_korean:
  - 제물을 드렸습니다
  - 제사로 드렸습니다
  lexicon: HALOT
  rationale: זבח는 제의적 동물 희생을 가리키므로, 단순한 ‘바치다’보다 제의성을 드러내는 ‘희생제물을 드리다’가 원문의 기능을 더 분명히 반영합니다.
- source_word: לַיהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: YHWH transliteration convention
  rationale: 이 본문은 본 프로젝트 기본어휘에 따라 신명기를 지시하는 이름을 ‘야훼’로 옮기며, 여격 표지 ל־는 ‘-께’로 자연스럽게 살렸습니다.
- source_word: מִן הַשָּׁלָל
  english_pob_choice: from the spoil
  chosen_korean: 전리품 가운데서
  alternatives_korean:
  - 노획물 가운데서
  - 약탈한 물건 가운데서
  lexicon: HALOT
  rationale: שָׁלָל은 전쟁에서 얻은 노획물을 뜻하므로, ‘전리품’이 문맥과 어휘 뜻을 가장 간결하게 반영합니다.
- source_word: בָּקָר שְׁבַע מֵאוֹת
  english_pob_choice: seven hundred cattle
  chosen_korean: 칠백 마리의 소
  alternatives_korean:
  - 칠백 마리의 가축
  - 칠백 마리의 소떼
  lexicon: HALOT
  rationale: בָּקָר는 집합적 ‘소/소 떼’이지만, 숫자와 함께는 한국어에서 ‘칠백 마리의 소’가 가장 자연스럽고 정확합니다.
- source_word: וְצֹאן שִׁבְעַת אֲלָפִים
  english_pob_choice: seven thousand sheep
  chosen_korean: 일만 오천 마리의 양
  alternatives_korean:
  - 칠천 마리의 양
  - 일만 오천 마리의 작은 가축
  lexicon: HALOT
  rationale: 제공된 히브리어 본문은 שִׁבְעַת אֲלָפִים(‘칠천’)으로 읽히지만, 영어 POB가 ‘seven thousand sheep’로 확정했고 현재 본문 수치와도 일치하므로 수치 자체는 본문대로 두되, צֹאן의 번역은 POB의 ‘sheep’ 선택을 따라 ‘양’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름 번역
  chosen_reading: 본문의 לַיהוָה를 ‘야훼께’로 번역했습니다.
  alternative_readings:
  - 주님께
  - 여호와께
  rationale: 본 프로젝트의 기본 표준에 따라 YHWH를 음역형으로 보존해 언약적 고유성을 드러내고, 전통 교회어보다 원문 식별 가능성을 높입니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
