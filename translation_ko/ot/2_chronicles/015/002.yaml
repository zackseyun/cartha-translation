  - 여러분이 그분을 찾으면 그분이 여러분에게서 발견되실 것이나
  lexicon: HALOT
  rationale: דרש의 ‘찾다/구하다’ 의미와 נִפְעַל의 ‘발견되다’ 구문을 함께 살리되, 한국어에서는 가장 직결된 ‘발견할 것이다’로 간결하게 옮겼습니다.
- source_word: תַּעַזְבֻהוּ יַעֲזֹב אֶתְכֶם
  english_pob_choice: if you forsake him, he will forsake you
  chosen_korean: 그분을 버리면 그분도 여러분을 버리실 것입니다
  alternatives_korean:
  - 그분을 떠나면 그분도 여러분을 떠나실 것입니다
  - 그분을 저버리면 그분도 여러분을 저버리실 것입니다
  lexicon: HALOT
  rationale: covenant적 상호성을 그대로 드러내기 위해 동일 어근을 반복하는 ‘버리다’를 택했습니다.
theological_decisions:
- issue: ‘그분과 함께 있음’의 조건적 상호성
  chosen_reading: 하나님의 함께하심은 백성이 그분과 함께 있을 때라는 조건적 언어로 제시됩니다.
  alternative_readings:
  - 단순한 체험적 진술로 완화하는 읽기
  - 무조건적 보장으로 읽는 해석
  rationale: 히브리어의 병렬 조건문을 보존해, 본문이 제시하는 언약적 긴장을 희석하지 않도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
