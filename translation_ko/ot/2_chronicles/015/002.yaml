  lexicon: HALOT
  rationale: 본문의 신명은 전통적 대체어가 아니라 음역형 ‘야훼’로 일관해, 고유명과 신학적 구분을 보존했습니다.
- source_word: תִּדְרְשֻׁהוּ / יִמָּצֵא לָכֶם
  english_pob_choice: If you seek him, he will be found by you
  chosen_korean: 여러분이 그분을 찾으면 그분을 발견할 것이나
  alternatives_korean:
