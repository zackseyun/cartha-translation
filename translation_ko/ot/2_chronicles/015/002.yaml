base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
  footnotes:
  - marker: a
    text: Or, more simply, “he will be found by you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아사 앞에 나가 그에게 말했습니다. “아사와 온 유다와 베냐민아, 내 말을 들으십시오. 야훼께서 여러분이 그분과 함께 있을 때 여러분과 함께하십니다. 여러분이 그분을 찾으면 그분을 발견할 것이나, 여러분이 그분을 버리면 그분도 여러분을 버리실 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, “그분은 여러분에게서 발견되실 것입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  english_pob_choice: He went out to meet Asa
  chosen_korean: 아사 앞에 나가
  alternatives_korean:
