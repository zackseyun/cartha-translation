  - 아사와 만나러 나가
  lexicon: HALOT
  rationale: 앞으로 이동해 아사를 맞는 동작을 자연스럽게 살리되, 문맥상 대면·접촉의 뉘앙스를 유지하기 위해 ‘앞에 나가’로 옮겼습니다.
- source_word: שְׁמָעוּנִי
