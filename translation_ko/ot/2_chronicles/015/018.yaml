  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי ... וְקָדָשָׁיו
  english_pob_choice: his father's holy gifts / his own holy gifts
  chosen_korean: 그의 아버지의 거룩한 예물들 / 자기의 거룩한 예물들
  alternatives_korean:
  - 거룩한 것들
  - 성물들
  - 성스러운 예물들
  lexicon: קדש / קֹדֶשׁ 계열
  rationale: 영어 POB의 "holy gifts"를 따라, 단순한 물건이 아니라 하나님께 구별된 예물을 뜻하는 것으로 살려서 '거룩한 예물들'로 옮겼습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님 집
  lexicon: בית + אלהים
  rationale: 본문의 직역 구조를 살리면서도 한국어에서 자연스럽게 읽히는 표준 표현으로 '하나님의 집'을 택했습니다.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  english_pob_choice: silver, gold, and vessels
  chosen_korean: 은과 금과 그릇들
  alternatives_korean:
  - 은과 금과 기물들
  - 은과 금과 용기들
  lexicon: כסף / זהב / כלים
  rationale: 마지막 명사 כלים는 문맥상 예배용 기구를 포함할 수 있으나, 과도한 특정화를 피하고 포괄적 의미의 '그릇들'로 옮겼습니다.
theological_decisions:
- issue: holy gifts의 성격
  chosen_reading: 왕이 성전에 바친 거룩하게 구별된 봉헌물로 이해했습니다.
  alternative_readings:
  - 단순한 재산 목록
  - 제의용 성물의 일반적 지칭
  rationale: 문맥상 '하나님의 집'에 들여놓는 항목들이므로, 일반 재산이 아니라 하나님께 바쳐진 봉헌물이라는 점을 드러내는 번역이 적절합니다.
  doctrine_reference: 성전 봉헌과 거룩 구별의 맥락
