revisions:
- from: 그는 하나님의 집에 그의 아버지의 거룩한 예물들과 자기의 거룩한 예물들을 가져왔습니다. 은과 금과 그릇들이었습니다.
  to: 그는 아버지의 성물과 자신의 성물, 곧 은과 금과 기물을 하나님의 집 안으로 들여왔습니다.
  rationale: 원문의 두 병렬된 성물 표현과 그 뒤의 물품 목록을 보존했습니다. ‘아버지의’라는 소유 표현은 원문의 표현을 유지하며, 봉헌 행위를 과도하게 명시적으로 풀어쓰지 않았습니다. 목록은 성물의 동격 설명으로 한 문장에 통합했습니다.
