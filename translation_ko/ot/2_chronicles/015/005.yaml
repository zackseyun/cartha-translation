  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם אֵ֥ין שָׁל֖וֹם לַ/יּוֹצֵ֣א וְ/לַ/בָּ֑א כִּ֚י מְהוּמֹ֣ת רַבּ֔וֹת עַ֥ל כָּל יוֹשְׁבֵ֖י הָ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
  footnotes:
  - marker: a
    text: Or 'great tumults' for 'many disturbances'; the Hebrew term can denote turmoil, confusion, or panic.
    reason: lexical_alternative
  - marker: b
    text: The expression 'going out and coming in' is a Hebrew idiom for ordinary movement in daily life, especially travel or public activity.
    reason: cultural_note
translation:
  language: ko
  text: 그때에는 나가거나 들어오는 사람에게 평화가 없었습니다. 그 땅들에 사는 모든 사람에게 많은 소동이 닥쳤기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  english_pob_choice: And in those times
  chosen_korean: 그때에는
  alternatives_korean:
  - 그런 때에는
  - 그 시기에는
  lexicon: HALOT
  rationale: 시간 부사구를 간결한 현대 한국어로 옮기되, 문맥의 역사적 상황 제시 기능을 살렸습니다.
- source_word: אֵין שָׁלוֹם
  english_pob_choice: there was no peace
  chosen_korean: 평강이 없었습니다
  alternatives_korean:
  - 평화가 없었습니다
  - 안녕이 없었습니다
  lexicon: HALOT
  rationale: שָׁלוֹם의 넓은 의미를 반영하면서도, 한국어 성경 문체에서 자연스러운 ‘평강’을 택했습니다.
- source_word: לַיּוֹצֵא וְלַבָּא
  english_pob_choice: for the one going out or for the one coming in
  chosen_korean: 가고 오는 사람
  alternatives_korean:
  - 나가는 사람과 들어오는 사람
  - 출입하는 사람
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 지나치게 직역하지 않되, 일상적 이동과 공적 활동이 안전하지 않았다는 뜻을 보존했습니다.
- source_word: מְהוּמֹת רַבּוֹת
  english_pob_choice: many disturbances
  chosen_korean: 많은 소동
  alternatives_korean:
  - 많은 혼란
  - 큰 소동들
  - 많은 동요
  lexicon: HALOT
  rationale: מְהוּמָה의 혼란·동요·소동 범위를 살리되, 이 문맥의 사회적 불안을 자연스럽게 드러내는 표현을 선택했습니다.
theological_decisions:
- issue: 히브리어 관용구의 처리
  chosen_reading: ‘가고 오는 사람’으로 옮겨, 일상적 이동 전반이 위협받는 상황을 드러냈습니다.
  alternative_readings:
  - ‘나가는 사람과 들어오는 사람’으로 더 직역할 수 있습니다.
  - ‘출입하는 사람’으로 압축할 수 있습니다.
  rationale: 이 표현은 단순한 이동 묘사가 아니라 공동체 전체의 불안정한 삶을 가리키므로, 관용성을 유지하는 쪽이 본문의 효과를 잘 보존합니다.
  doctrine_reference: 문맥적 의미 보존
- issue: ‘평강’의 번역
  chosen_reading: 전통적 ‘평화’보다 ‘평강’을 써서 שָׁלוֹם의 포괄적 안녕 의미를 살렸습니다.
  alternative_readings:
  - 평화
  - 안녕
  rationale: 이 구절은 전쟁 부재만이 아니라 사회적 안전과 삶의 안정 전체의 부재를 말하므로, ‘평강’이 더 넓은 의미를 전달합니다.
  doctrine_reference: סֵפֶר 역사서의 일반적 평강 개념
