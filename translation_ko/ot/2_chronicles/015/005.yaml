revisions:
- from: 그때에는 가고 오는 사람에게 평강이 없었습니다. 이는 모든 주민에게 많은 소동이 닥쳤기 때문입니다.
  to: 그때에는 나가거나 들어오는 사람에게 평화가 없었습니다. 그 땅들에 사는 모든 사람에게 많은 소동이 닥쳤기 때문입니다.
  rationale: 원문의 지리적 복수 표현(‘그 땅들’)을 복원하고, 출입을 가리키는 병렬 관용구를 자연스럽게 보존했습니다. 교파적 어감이 있을 수 있는 ‘평강’은 문맥상 의미 손실 없이 현대적인 ‘평화’로 조정했습니다. ‘많은 소동’은 מְהוּמֹת רַבּוֹת의 복수적 사회 혼란을 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:16:56Z'
