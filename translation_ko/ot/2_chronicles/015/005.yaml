  verdict: revise
  source_fidelity: ‘그 땅들’(הָאֲרָצוֹת)의 복수 범위가 ‘모든 주민’이라는 현행 표현에서 빠져 있습니다. 또한 לַיּוֹצֵא וְלַבָּא의 짝을 ‘나가거나 들어오는’으로 드러내는 편이 원문의 포괄적·일반적 표현을 더 정확히 반영합니다.
  naturalness: 현행 문장은 전반적으로 자연스럽지만, ‘평강’은 현대 표준어의 일반 서술에서는 다소 교회적·문어적인 어감입니다. 이 사회적 불안의 문맥에는 ‘평화’가 자연스럽고 충분히 넓은 의미를 전달합니다.
