id: 2CH.15.3
reference: 2 Chronicles 15:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
  footnotes:
  - marker: a
    text: Or 'without a God of truth' or 'with no true God.'
    reason: lexical_alternative
  - marker: b
    text: Or 'without law' or 'without teaching'; Hebrew torah can mean 'instruction,' 'teaching,' or 'law' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 오랫동안 이스라엘에는 참되신 하나님도[a], 가르치는 제사장도, 율법도[b] 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘진리의 하나님’ 또는 ‘참 하나님’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가르침’ 또는 ‘교훈’. 히브리어 토라(תוֹרָה)는 문맥에 따라 ‘가르침’, ‘교훈’, ‘율법’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יָמִ֥ים רַבִּ֖ים
  english_pob_choice: For many days
  chosen_korean: 오래도록
  alternatives_korean:
  - 여러 날 동안
  - 오랜 기간 동안
  lexicon: HALOT
  rationale: 시간의 지속을 자연스러운 한국어 부사어로 옮기되, 장기간의 상태라는 문맥을 살려 간결하게 표현했습니다.
- source_word: לְ/לֹא אֱלֹהֵ֣י אֱמֶ֗ת
  english_pob_choice: without the true God
  chosen_korean: 참되신 하나님도 없었습니다
  alternatives_korean:
  - 진리의 하나님도 없었습니다
  - 참 하나님도 없었습니다
  lexicon: HALOT
  rationale: אֱלֹהֵי אֱמֶת의 핵심은 ‘진실함/참됨’의 속성입니다. 한국어에서는 ‘참되신 하나님’이 자연스럽고, 단순한 ‘한 하나님’이 아니라 유일하고 সত্য한 하나님이 부재했다는 대조를 살립니다.
- source_word: וּ/לְ/לֹא כֹּהֵ֥ן מוֹרֶ֖ה
  english_pob_choice: without a teaching priest
  chosen_korean: 가르치는 제사장도
  alternatives_korean:
  - 가르침을 베푸는 제사장도
  - 가르쳐 주는 제사장도
  lexicon: HALOT
  rationale: מוֹרֶה는 ‘가르치는/훈계하는’ 기능을 나타내므로, 직능을 드러내는 ‘가르치는 제사장’이 가장 직접적입니다. 반복되는 ‘도’는 앞뒤 부정의 병렬을 자연스럽게 연결합니다.
- source_word: וּ/לְ/לֹא תוֹרָֽה
  english_pob_choice: without the law
  chosen_korean: 율법도 없었습니다
  alternatives_korean:
  - 교훈도 없었습니다
  - 가르침도 없었습니다
  - 법도 없었습니다
  lexicon: HALOT
  rationale: 토라의 기본 의미는 ‘율법/가르침’이지만, 본문은 제사장의 가르침과 병렬을 이루면서도 공동체적 규범의 부재를 가리키므로 ‘율법’이 가장 직접적입니다.
theological_decisions:
- issue: תּוֹרָה의 범위
  chosen_reading: 율법
  alternative_readings:
  - 교훈
  - 가르침
  - 법
  rationale: 이 구절에서는 제사장의 가르침과 병렬로 놓이지만, 열왕기하/역대기 계열의 역사적 서술에서는 공동체를 규정하는 토라의 상실을 함께 말하는 효과가 있어 ‘율법’이 문맥상 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: אֱלֹהֵי אֱמֶת의 신학적 강조
  chosen_reading: 참되신 하나님
  alternative_readings:
  - 진리의 하나님
  - 참 하나님
  rationale: 이스라엘이 언약적으로 하나님과의 바른 관계를 상실했다는 점을 드러내기 위해, 단순한 유일신 진술보다 ‘참되신’이 문맥의 대조를 더 분명히 전달합니다.
  doctrine_reference: Translation philosophy §1, §6
