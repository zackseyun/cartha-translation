source:
  edition: WLC
  text: וְ/הַ֨/בָּמ֔וֹת לֹא סָ֖רוּ מִ/יִּשְׂרָאֵ֑ל רַ֧ק לְבַב אָסָ֛א הָיָ֥ה שָׁלֵ֖ם כָּל יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: ko
  text: 그러나 산당은 이스라엘에서 제거되지 않았습니다. 그럼에도 아사의 마음은 평생 온전했습니다.
  philosophy: formal
lexical_decisions:
- source_word: בָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당
  alternatives_korean:
  - 높은 곳
  - 산당들
  lexicon: OT high places terminology
  rationale: 히브리어 בָּמוֹת는 우상 숭배와 연결된 산당을 가리키는 관용어이므로, 한국어 성경에서 널리 쓰이면서도 의미가 분명한 ‘산당’을 택했습니다.
- source_word: לֹא סָרוּ
  english_pob_choice: were not removed
  chosen_korean: 제거되지 않았습니다
  alternatives_korean:
  - 없애지 않았습니다
  - 치워지지 않았습니다
  lexicon: סור
  rationale: 문맥상 단순 이동이 아니라 종교적·행정적 제거를 뜻하므로, 상태의 미완성과 결과를 드러내는 ‘제거되지 않았습니다’로 옮겼습니다.
- source_word: שָׁלֵם
  english_pob_choice: whole
  chosen_korean: 온전했습니다
  alternatives_korean:
  - 완전했습니다
  - 온전하게 헌신했습니다
  lexicon: שלם
  rationale: 영어 POB가 ‘fully devoted’에서 ‘whole’로 되돌아간 점을 반영해, 전적 헌신을 직접 덧붙이기보다 마음의 온전함과 완전함을 함께 담는 ‘온전했습니다’를 선택했습니다.
- source_word: כָּל יָמָיו
  english_pob_choice: all his days
  chosen_korean: 평생
  alternatives_korean:
  - 그의 모든 날 동안
  - 그가 사는 동안 내내
  lexicon: idiom
  rationale: 히브리어 관용구를 자연스럽고 간결한 현대 한국어로 풀어, 기간 전체를 뜻하는 ‘평생’으로 옮겼습니다.
theological_decisions:
- issue: 사사의 평가와 왕에 대한 전인적 진술
  chosen_reading: 아사의 마음이 ‘온전했다’는 표현을 유지해, 행위의 완전무결이 아니라 지속적인 내적 전일성을 말하는 것으로 읽었습니다.
  alternative_readings:
  - ‘완전히 헌신했다’로 풀어 영적 충성을 더 강조하는 읽기
  - ‘흠이 없었다’로 도덕적 완전성을 강화하는 읽기
  rationale: 본문은 산당이 제거되지 않았다는 역사적 한계를 인정하면서도 아사의 내적 상태를 별도로 진술하므로, 두 절반의 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: 본문의 역사서적 평가 구조와 השלם(온전함) 어휘의 의미 범위
