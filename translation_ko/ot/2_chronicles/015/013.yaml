  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
  footnotes:
  - marker: a
    text: Or 'whoever did not seek the LORD.' The Hebrew verb can be rendered more simply as 'did not seek,' but the context is a covenant oath stipulation.
    reason: lexical_alternative
  - marker: b
    text: Or 'from least to greatest.' The Hebrew idiom expresses totality across the whole community.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 이스라엘의 하나님이신 야훼를 찾지 않을 사람은 누구든지, 작은 자로부터 큰 자에 이르기까지, 남자에서 여자에 이르기까지 죽임을 당해야 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찾지 않은.’ 히브리어 동사는 더 단순하게 과거형으로 옮길 수도 있지만, 문맥상 이는 언약의 요구 조항입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘가장 작은 자로부터 가장 큰 자까지.’ 이 관용구는 공동체 전체를 포괄함을 나타냅니다.
    reason: lexical_alternative
