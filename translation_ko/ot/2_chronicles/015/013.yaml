source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יִדְרֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל יוּמָ֑ת לְ/מִן קָטֹן֙ וְ/עַד גָּד֔וֹל לְ/מֵ/אִ֖ישׁ וְ/עַד אִשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
  footnotes:
  - marker: a
    text: Or 'whoever did not seek the LORD.' The Hebrew verb can be rendered more simply as 'did not seek,' but the context is a covenant oath stipulation.
    reason: lexical_alternative
  - marker: b
    text: Or 'from least to greatest.' The Hebrew idiom expresses totality across the whole community.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 누구든지 이스라엘의 하나님이신 야훼를 찾지 않는 사람은, 작은 자에서 큰 자까지 — 남자에서 여자까지 — 죽임을 당해야 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '찾지 않는.' 히브리어 동사는 더 단순하게 '찾다'로도 옮길 수 있지만, 문맥상 이는 언약적 요구 조항입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '작은 자에서 큰 자까지.' 이 관용구는 공동체 전체를 가리키는 총칭적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  english_pob_choice: And everyone who
  chosen_korean: 그리고 누구든지
  alternatives_korean:
  - 그리고 모두가
  - 그리고 모든 사람 가운데
  lexicon: HALOT
  rationale: 포괄적 관계절을 자연스러운 현대 한국어로 옮기되, 범위를 넓게 잡는 의미를 유지했습니다.
- source_word: לֹא יִדְרֹשׁ
  english_pob_choice: would not seek
  chosen_korean: 찾지 않는
  alternatives_korean:
  - 구하지 않는
  - 찾아 구하지 않는
  - 찾지 않을
  lexicon: HALOT
  rationale: דרשׁ의 종교적·언약적 용법을 한국어의 '찾다'로 간명하게 살렸고, 본문의 규정적 뉘앙스는 문맥상 드러나도록 했습니다.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of Israel
  chosen_korean: 이스라엘의 하나님이신 야훼
  alternatives_korean:
  - 이스라엘의 하나님이신 여호와
  - 이스라엘의 하나님 야훼
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 프로젝트 기본값에 따라 '야훼'로 옮기고, 속격 관계는 한국어 관형절로 자연스럽게 처리했습니다.
- source_word: יוּמָת
  english_pob_choice: was to be put to death
  chosen_korean: 죽임을 당해야 했습니다
  alternatives_korean:
  - 사형을 당해야 했습니다
  - 죽여야 했습니다
  - 죽게 되어 있었습니다
  lexicon: HALOT
  rationale: 히필/수동의 형벌 표현을 완화하지 않고 '죽임을 당하다'로 옮겨 실제 처형의 강도를 유지했습니다.
- source_word: לְמִן קָטֹן ... וְעַד גָּדוֹל
  english_pob_choice: from small to great
  chosen_korean: 작은 자에서 큰 자까지
  alternatives_korean:
  - 가장 작은 자에서 가장 큰 자까지
  - 지위가 낮은 자에서 높은 자까지
  lexicon: HALOT
  rationale: 히브리어 관용구가 공동체 전체를 포괄함을 드러내기 위해 직역에 가까운 표현을 택했습니다.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  english_pob_choice: from man to woman
  chosen_korean: 남자에서 여자까지
  alternatives_korean:
  - 남성에서 여성까지
  - 남자와 여자 모두에게
  lexicon: HALOT
  rationale: 성별 대구를 유지하면서도 현대 한국어로 자연스럽게 전달되는 표현을 선택했습니다.
theological_decisions:
- issue: 언약 갱신 선언의 형벌 표현을 약화할지 여부
  chosen_reading: 본문이 명시하는 죽음의 형벌을 그대로 유지했습니다.
  alternative_readings:
  - 공동체에서 제외되었다고 완화하여 번역함
  - 단순히 '죽을 것이다'로 일반화함
  rationale: 히브리어 יוּמָת은 실제 처형을 뜻하므로, 본문의 엄중함을 희석하지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Never paraphrase beyond what the source text warrants.'
