id: 2CH.15.12
reference: 2 Chronicles 15:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
  footnotes:
  - marker: a
    text: Or, 'they bound themselves by covenant.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the God of their fathers'; that is, the covenant God worshiped by their forefathers.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 야훼[a], 곧 그들의 조상들의 하나님[b]을 온 마음과 온 영혼을 다해 찾기로 언약 안으로 들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들이 언약으로 자신을 묶었습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그들의 조상들의 하나님’; 곧 그들의 선조들이 예배한 언약의 하나님입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  english_pob_choice: they entered into the covenant
  chosen_korean: 언약 안으로 들어갔습니다
  alternatives_korean:
  - 언약을 맺었습니다
  - 언약에 들어갔습니다
  lexicon: HALOT
  rationale: בוא는 문자적으로 ‘들어가다’이므로, POB의 covenantal act를 살려 ‘언약 안으로 들어갔다’로 옮겼습니다. 이는 단순한 이동이 아니라 언약적 결단을 드러냅니다.
- source_word: לִדְרוֹשׁ אֶת יְהוָה
  english_pob_choice: to seek Yahweh
  chosen_korean: 야훼를 ... 찾기로
  alternatives_korean:
  - 야훼를 구하기로
  - 야훼께 문의하기로
  lexicon: HALOT
  rationale: דרש는 종교적·언약적 문맥에서 ‘찾다, 구하다’의 뜻이므로, 질문 행위보다 하나님을 향한 전인적 추구를 드러내는 ‘찾다’가 가장 적합합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md Contested terms
  rationale: POB의 기본 원칙에 따라 여호와 대신 신명기적 고유명사인 야훼를 사용해 언약적 이름을 보존했습니다.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  english_pob_choice: the God of their fathers
  chosen_korean: 그들의 조상들의 하나님
  alternatives_korean:
  - 그 조상들의 하나님
  - 그들의 조상의 하나님
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 ‘fathers’를 그대로 반영해, 조상/선조로 중화하지 않고 ‘그들의 조상들의 하나님’으로 옮겼습니다.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  english_pob_choice: with all their heart and with all their soul
  chosen_korean: 온 마음과 온 영혼을 다해
  alternatives_korean:
  - 마음을 다하고 영혼을 다해
  - 전심전령으로
  lexicon: HALOT
  rationale: ‘heart’와 ‘soul’의 고정된 총체성 표현을 한국어의 자연스러운 합쇼체로 옮기되, 의미를 약화시키지 않도록 ‘온 마음’과 ‘온 영혼’의 병렬 구조를 유지했습니다.
theological_decisions:
- issue: 언약 결단의 성격을 어떻게 드러낼지
  chosen_reading: ‘언약 안으로 들어갔습니다’로 옮겨, 단순한 합의가 아니라 공동체적·언약적 결단임을 드러냈습니다.
  alternative_readings:
  - ‘언약을 맺었습니다’
  - ‘언약에 들어갔습니다’
  rationale: 본문의 בַּבְּרִית는 단순한 계약 체결보다 언약 질서 안으로의 편입을 암시하므로, POB의 문맥적 의미를 살리는 번역이 필요합니다.
  doctrine_reference: 'POB translation philosophy: source-direct, covenantal specificity'
- issue: ‘fathers’의 성별 표지 유지
  chosen_reading: ‘조상들’로 완화하지 않고 ‘조상들의’로 유지했습니다.
  alternative_readings:
  - ‘선조들의’
  - ‘그들의 조상들의’
  rationale: 히브리어가 분명히 남성 복수형을 사용하므로, 성별을 중화하지 않고 원문의 표지를 보존하는 것이 소스 충실성에 부합합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4 (Gender-accurate over gender-neutral)
