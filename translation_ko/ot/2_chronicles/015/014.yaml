  rationale: 원문이 Tetragrammaton을 직접 사용하므로, 프로젝트 기본값에 따라 언약명 자체를 드러내는 ‘야훼’를 사용했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
