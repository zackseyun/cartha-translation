  text: 그들은 큰 소리와 외침과 나팔과 뿔나팔로 야훼께 맹세했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 שׁוֹפָרוֹת는 앞의 ‘나팔’과 구별되는 ‘뿔나팔’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  english_pob_choice: they swore
  chosen_korean: 맹세했습니다
  alternatives_korean:
  - 서약했습니다
  - 맹세를 했습니다
  lexicon: HALOT
  rationale: שׁבע의 완료적 맥락을 자연스럽게 살리면서, 공동체적 언약 행위를 분명하게 드러내는 현대 한국어로는 ‘맹세했습니다’가 가장 간명합니다.
- source_word: בְּקוֹל גָּדוֹל
  english_pob_choice: with a loud voice
  chosen_korean: 큰 소리와
  alternatives_korean:
  - 큰 목소리로
  - 큰 음성으로
  lexicon: HALOT
  rationale: 직역하면 ‘큰 소리로’이지만, 다음의 תְּרוּעָה와 병렬되는 구성을 살려 ‘큰 소리와 외침’으로 옮겨 집단적 발성을 자연스럽게 표현했습니다.
- source_word: וּבִתְרוּעָה
  english_pob_choice: with shouting
  chosen_korean: 외침과
  alternatives_korean:
  - 함성으로
  - 환호로
  lexicon: HALOT
  rationale: תְּרוּעָה는 단순한 소리보다 집단적 외침·환호를 가리키므로, 앞의 ‘큰 소리’와 중복을 피하면서도 의미를 살려 ‘외침’으로 옮겼습니다.
- source_word: וּבַחֲצֹצְרֹת / וּבְשׁוֹפָרוֹת
  english_pob_choice: with trumpets and horns
  chosen_korean: 나팔과 뿔나팔로
  alternatives_korean:
  - 나팔과 양각나팔로
  - 나팔과 쇼파르로
  lexicon: HALOT
  rationale: חֲצֹצְרוֹת과 שׁוֹפָרוֹת의 구별을 유지해야 하므로, 앞은 일반적인 ‘나팔’, 뒤는 전통적 교회어를 피하면서도 악기 차이를 드러내는 ‘뿔나팔’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
