id: 2CH.15.16
reference: 2 Chronicles 15:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
  footnotes:
  - marker: a
    text: Or 'an abominable image' or 'a horrid thing.' The Hebrew term denotes a repulsive or terrifying cult object.
    reason: lexical_alternative
  - marker: b
    text: '''Asherah'' may refer to the goddess or to the cult symbol associated with her; older English versions sometimes render it ''grove.'''
    reason: cultural_note
  - marker: c
    text: Or 'in the brook/wadi Kidron.'
    reason: lexical_alternative
translation:
  language: ko
  text: 더욱이 왕 아사의 어머니 마아가도 아스라[b]를 위해 역겨운 우상[a]을 만들었으므로, 그는 그녀를 태후의 자리에서 물러나게 했습니다. 아사 왕은 그녀의 역겨운 우상을 찍어 가루가 되도록 부수고, 기드론 골짜기[c]에서 그것을 불살랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가증스러운 우상’, ‘끔찍한 것’. 히브리어는 혐오스럽거나 두려움을 불러일으키는 제의물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아스라’는 여신 자체 또는 그와 관련된 제의물을 가리킬 수 있으며, 옛 번역들은 종종 이를 ‘숲’으로 옮겼습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘기드론 시내/와디에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  english_pob_choice: Even
  chosen_korean: 더욱이
  alternatives_korean:
  - 또한
  - 그리고 또한
  lexicon: HALOT
  rationale: 추가를 넘어 의외성과 강조를 함께 띠는 앞말이므로, 한국어에서는 ‘더욱이’가 POB의 ‘Even’을 가장 자연스럽게 살립니다.
- source_word: מִ/גְּבִירָ֔ה
  english_pob_choice: from being queen mother
  chosen_korean: 태후의 자리에서 물러나게 했습니다
  alternatives_korean:
  - 왕대비의 자리에서 물러나게 했습니다
  - 태후에서 해임했습니다
  lexicon: HALOT
  rationale: 유다 왕정의 직함을 고려하면 ‘queen mother’는 ‘태후’가 가장 적절하며, 동사 הֱסִירָהּ는 단순 이동보다 지위 박탈을 포함하므로 ‘자리에서 물러나게 했습니다’로 옮겼습니다.
- source_word: מִפְלָצֶת
  english_pob_choice: a dreadful image / her dreadful image
  chosen_korean: 역겨운 우상
  alternatives_korean:
  - 끔찍한 우상
  - 가증스러운 우상
  - 두려운 형상
  lexicon: HALOT
  rationale: 해당 명사는 단순 형상보다 혐오·공포를 불러일으키는 우상적 물체를 가리키므로, ‘역겨운 우상’이 현대 한국어에서 의미와 정서를 함께 전달합니다.
- source_word: בְּ/נַ֥חַל קִדְרֽוֹן
  english_pob_choice: in the Kidron Valley
  chosen_korean: 기드론 골짜기에서
  alternatives_korean:
  - 기드론 시내에서
  - 기드론 와디에서
  lexicon: HALOT
  rationale: נחל은 문맥상 골짜기/와디를 가리킬 수 있으나, 현대 독자가 즉시 이해하도록 지리명은 ‘기드론 골짜기’로 자연화했습니다.
theological_decisions:
- issue: 아스라(אֲשֵׁרָה)의 번역
  chosen_reading: 고유명사적 표지인 ‘아스라’를 유지하고, 관련 제의 대상을 ‘우상’으로 설명했습니다.
  alternative_readings:
  - 아세라 목상
  - 아세라 나무
  - 아세라 여신
  rationale: 본문은 특정 제작된 제의물을 말하지만, 정확한 형태를 단정하기보다 POB의 주석처럼 아스라 관련 제의물로 남기는 편이 본문이 허용하는 범위를 지킵니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 마아가의 제거 표현
  chosen_reading: 왕비가 아니라 왕의 어머니라는 점을 살리되, 제도적 직함은 ‘태후’로 번역했습니다.
  alternative_readings:
  - 왕의 어머니로부터 물러나게 했습니다
  - 왕대비의 자리에서 폐위했습니다
  rationale: 문맥상 아사의 개혁은 가족 관계보다 공적 지위의 제거를 뜻하므로, 왕정 제도 안에서 기능하는 직함인 ‘태후’가 가장 정확합니다.
  doctrine_reference: Translation philosophy §6
