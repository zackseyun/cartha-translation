  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. מִגְּבִירָה를 ‘태후의 자리에서 물러나게 했습니다’로 옮긴 것은 공적 지위의 박탈을 잘 드러냅니다. 다만 וַיָּדֶק은 단순히 손상시킨다는 뜻보다 잘게 부수거나 가루가 되게 하는 행위를 나타내므로, ‘가루가 되도록 부수고’가 더 정확합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. ‘그녀의 역겨운 우상’은 지시 대상이 분명하며, ‘가루가 되도록 부수고’는 파괴 행위의 연속을 자연스럽고 명료하게 표현합니다.
  terminology: ‘아스라’는 원문의 모호성을 보존하는 적절한 음역이며, ‘태후’와 ‘기드론 골짜기’도 문맥에 적합합니다. 그러나 각주 표지는 해당 어구 바로 뒤에 놓여야 합니다. 특히 아스라 관련 문화 주석[b]과 기드론 지형 대안[c]이 현재 ‘부수고’ 뒤에 잘못 붙어 있습니다.
