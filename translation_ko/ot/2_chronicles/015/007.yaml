  source_fidelity: 전반적으로 히브리어의 대조적 호소, 두 명령, 그리고 일에 대한 보상이라는 인과를 충실히 반영합니다. 다만 פְעֻלָּה는 이 문맥에서 ‘행위’보다 ‘하는 일/수고’가 더 직접적이며, ‘강건하십시오’는 현대 표준어 합쇼체로 다소 문어적·교회어적입니다.
  naturalness: ‘여러분의 손이 약해지지 않게 하십시오’는 원문의 손 관용구를 보존하면서도 이해 가능합니다. ‘힘을 내십시오’와 ‘여러분이 하는 일’은 더 자연스러운 현대 한국어입니다. 각주 표지는 설명하는 표현 바로 뒤에 놓는 것이 명확합니다.
