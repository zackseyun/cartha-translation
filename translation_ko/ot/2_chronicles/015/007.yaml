source:
  edition: WLC
  text: וְ/אַתֶּ֣ם חִזְק֔וּ וְ/אַל יִרְפּ֖וּ יְדֵי/כֶ֑ם כִּ֛י יֵ֥שׁ שָׂכָ֖ר לִ/פְעֻלַּתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
  footnotes:
  - marker: a
    text: Or 'do not let your hands be slack.' The Hebrew idiom refers to losing strength, resolve, or courage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분은 힘을 내십시오. 여러분의 손이 약해지지 않게 하십시오.[a] 여러분이 하는 일에는 보상이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여러분의 손이 약해지지 않게 하십시오’는 히브리어 관용구로, 기력이나 결의, 용기를 잃지 말라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  english_pob_choice: But as for you
  chosen_korean: 그러나 여러분은
  alternatives_korean:
  - 그리고 여러분은
  - 그런데 여러분은
  lexicon: HALOT
  rationale: 앞선 문맥과 대비되는 권면을 나타내므로, 단순한 접속보다 대조를 드러내는 ‘그러나’와 대상 강조 ‘여러분은’으로 옮겼습니다.
- source_word: חִזְק֔וּ
  english_pob_choice: be strong
  chosen_korean: 강건하십시오
  alternatives_korean:
  - 강해지십시오
  - 굳세십시오
  lexicon: HALOT
  rationale: 명령형 חזק의 핵심은 힘과 확고함의 요청이므로, 현대 한국어에서 권면으로 자연스럽고 품위 있는 ‘강건하십시오’를 택했습니다.
- source_word: יִרְפּ֖וּ יְדֵי/כֶם
  english_pob_choice: do not let your hands grow weak
  chosen_korean: 손이 약해지지 않게 하십시오
  alternatives_korean:
  - 손이 축 늘어지지 않게 하십시오
  - 손을 느슨하게 두지 마십시오
  lexicon: HALOT
  rationale: ‘손’은 힘과 결의의 관용적 표현이므로 직역을 유지하되, 영어 POB가 지적한 ‘약해짐/느슨해짐’의 의미를 살려 현대어로 풀었습니다.
- source_word: שָׂכָר
  english_pob_choice: reward
  chosen_korean: 보상
  alternatives_korean:
  - 삯
  - 상급
  - 보답
  lexicon: HALOT
  rationale: 문맥상 공로 계산보다는 격려의 보상 개념이 두드러지므로, 신학적 부담이 적고 의미 범위가 넓은 ‘보상’을 선택했습니다.
- source_word: לִ/פְעֻלַּתְ/כֶם
  english_pob_choice: for your work
  chosen_korean: 여러분의 행위에는
  alternatives_korean:
  - 여러분의 일에는
  - 여러분의 노동에는
  - 여러분이 한 일에는
  lexicon: HALOT
  rationale: פְעֻלָּה는 일/행위/노동을 아우르므로, 여기서는 결과를 강조하는 ‘행위’로 옮겨 보상의 대상이 되는 행동 전체를 드러냈습니다.
theological_decisions:
- issue: 보상의 성격
  chosen_reading: ‘보상’으로 옮겨, 순종에 대한 격려의 뜻은 살리되 공로론이나 구원 공로를 암시하지 않도록 했습니다.
  alternative_readings:
  - ‘상급’
  - ‘삯’
  - ‘댓가’
  rationale: 본문은 단순히 섬김에 대한 보상이 있다고 말할 뿐, 보상의 메커니즘이나 구원론적 공로를 규정하지 않습니다. 따라서 의미를 보존하면서도 신학적 과잉을 피하는 번역이 적절합니다.
  doctrine_reference: 본문이 말하는 격려의 보상과 후대의 공로/칭의 교리를 구분합니다.
