revisions:
- from: 그러나 여러분은 강건하십시오. 손이 약해지지 않게 하십시오. 여러분의 행위에는 보상이 있기 때문입니다.[a]
  to: 그러나 여러분은 힘을 내십시오. 여러분의 손이 약해지지 않게 하십시오.[a] 여러분이 하는 일에는 보상이 있습니다.
