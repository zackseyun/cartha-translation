source:
  edition: WLC
  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the prophecy of Oded the prophet.'' Some interpreters and textual discussions connect this with Azariah son of Oded in the surrounding context.'
    reason: textual_variant
translation:
  language: ko
  text: 아사가 이 말들과 선지자 오뎃의 예언을 듣고 용기를 얻어, 유다와 베냐민의 온 땅과 그가 에브라임 산지에서 점령한 성읍들에서 가증한 것들을 제거하고, 야훼의 낭실 앞에 있는 야훼의 제단을 새롭게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 '선지자 오뎃의 예언'입니다. 주변 문맥에서는 아사랴, 곧 오뎃의 아들에 대한 언급과 연결된다는 해석이 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  english_pob_choice: And when Asa heard
  chosen_korean: 아사가 … 듣고
  alternatives_korean:
  - 아사가 … 들었을 때
  - 아사가 … 듣자
  lexicon: HALOT
  rationale: 히브리어 부정사구는 시간 부사절로 풀어 읽는 것이 자연스럽고, 한국어에서는 앞절을 매끄럽게 연결하는 '-고' 구문이 적절합니다.
- source_word: הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이 말들
  alternatives_korean:
  - 이 일들
  - 이 말씀들
  lexicon: HALOT
  rationale: 직전 선지자 발언을 가리키므로 '말들'이 가장 직접적입니다. '일들'은 너무 넓고, '말씀들'은 종교적 뉘앙스를 더 강하게 만들 수 있습니다.
- source_word: הִתְחַזַּק
  english_pob_choice: he took courage
  chosen_korean: 용기를 얻어
  alternatives_korean:
  - 스스로 강해져
  - 마음을 굳게 먹고
  lexicon: HALOT
  rationale: 히트파엘의 반사적·내적 강화는 단순한 신체적 강함보다 '용기를 얻다'가 현재 한국어에서 자연스럽고 의미를 잘 살립니다.
- source_word: הַשִּׁקּוּצִים
  english_pob_choice: the detestable things
  chosen_korean: 가증한 것들
  alternatives_korean:
  - 혐오스러운 것들
  - 우상숭배의 가증한 것들
  lexicon: HALOT
  rationale: שִׁקּוּצִים는 우상적·제의적 불결을 가리키는 강한 표현이므로, 본문 의미를 유지하면서도 표준적인 성서 한국어 어감인 '가증한 것들'을 택했습니다.
- source_word: וַיְחַדֵּשׁ
  english_pob_choice: and he renewed
  chosen_korean: 새롭게 했습니다
  alternatives_korean:
  - 다시 세웠습니다
  - 수리했습니다
  lexicon: HALOT
  rationale: חדשׁ의 핵심은 '새롭게 하다/갱신하다'입니다. 단순 수리로 좁히지 않고, 제단의 기능 회복을 포함하는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 '야훼'로 옮겨, 고유한 언약 이름을 보존했습니다.
theological_decisions:
- issue: 신명 יְהוָה의 표기
  chosen_reading: 본문에서는 '야훼'를 사용했습니다.
  alternative_readings:
  - '''여호와'''
  - '''주'''
  rationale: 본문이 하나님의 고유명을 직접 사용하므로, 호칭 대체보다 이름 자체를 드러내는 번역이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה/YHWH → 야훼'
- issue: 오뎃/아사랴 관련 본문 긴장
  chosen_reading: 주어진 히브리어를 따라 '선지자 오뎃의 예언'으로 옮겼습니다.
  alternative_readings:
  - 주변 문맥과 조화한 '아사랴…' 해석
  - 본문 조화 번역
  rationale: 이 절의 형태는 주어진 원문을 우선해야 하며, 주변 문맥과의 긴장은 본문비평/주해상의 쟁점으로 남겨 두는 것이 적절합니다.
  doctrine_reference: 본문비평상 처리 원칙
