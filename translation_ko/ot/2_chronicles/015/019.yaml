base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/019.yaml
  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
  footnotes:
  - marker: a
    text: Or, 'until year thirty-five of Asa’s reign.' Some interpreters understand this number according to a broader chronological system rather than strictly Asa’s regnal count, in order to harmonize with related passages.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 아사가 다스린 지 삼십오 년째 되는 해까지 전쟁이 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아사의 통치 제삼십오 년까지’입니다. 일부 해석자는 관련 본문과 조화시키기 위해, 이 수치를 아사의 재위 연수로 엄격하게 보기보다 더 넓은 연대 체계에 따른 것으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה
  english_pob_choice: And there was no war
  chosen_korean: 전쟁이 없었습니다
  alternatives_korean:
  - 전쟁이 없었습니다
  - 전쟁이 일어나지 않았습니다
  lexicon: HALOT
  rationale: מִלְחָמָה는 기본적으로 ‘전쟁’이며, 존재 부정 구문이므로 한국어에서는 자연스럽게 ‘전쟁이 없었습니다’로 옮기는 것이 원문의 서술 기능을 잘 살립니다.
- source_word: לֹא הָיָתָה
  english_pob_choice: there was no
  chosen_korean: 없었습니다
  alternatives_korean:
  - 없었습니다
  - 있지 않았습니다
  lexicon: HALOT
  rationale: הָיָה의 존재동사 용법을 한국어의 존재 부정 ‘없었습니다’로 옮겨, 전쟁의 부재라는 사건 상태를 직접적으로 나타냈습니다.
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  english_pob_choice: the thirty-fifth year
  chosen_korean: 삼십오 년
  alternatives_korean:
  - 서른다섯째 해
  - 삼십오 해
  lexicon: HALOT
  rationale: 히브리어의 연대 표현을 한국어에서는 연호식 표현보다 ‘삼십오 년’이 더 자연스럽고 명료하여, 본문의 연대 정보가 바로 드러나도록 했습니다.
- source_word: לְ/מַלְכ֥וּת אָסָא
  english_pob_choice: of Asa’s reign
  chosen_korean: 아사의 통치
  alternatives_korean:
  - 아사의 치세
  - 아사의 왕위
  lexicon: HALOT
  rationale: מַלְכוּת는 여기서 왕권의 상태라기보다 통치 기간을 가리키므로, 현대 한국어에서는 ‘통치’가 가장 직접적이고 문맥에 맞습니다.
theological_decisions:
- issue: 대상 15:19의 연대 진술과 관련 병행 본문 사이의 긴장
  chosen_reading: 본문이 제시하는 연대 진술을 그대로 살려 ‘아사의 통치 삼십오 년까지’로 번역했습니다.
  alternative_readings:
  - 다른 연대 체계를 전제해 조화시키는 해석
  - 숫자를 조정하는 조화적 번역
  rationale: 이 구절의 쟁점은 어휘가 아니라 연대 이해에 관한 해석 문제이므로, 번역문은 히브리어가 말하는 바를 있는 그대로 드러내고 조화는 주석에서 다루는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
