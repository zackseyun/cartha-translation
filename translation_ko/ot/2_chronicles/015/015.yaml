id: 2CH.15.15
reference: 2 Chronicles 15:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
  footnotes:
  - marker: a
    text: Or, more literally, 'he was found by them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 온 유다는 그 맹세를 두고 기뻐했습니다. 이는 그들이 온 마음을 다해 맹세하고 온 뜻을 다해 그분을 찾았기 때문입니다. 그분께서 그들에게 발견되셨고, 야훼께서 그들 사방에 평안을 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  english_pob_choice: rejoiced
  chosen_korean: 기뻐했습니다
  alternatives_korean:
  - 즐거워했습니다
  - 환호했습니다
  lexicon: HALOT
  rationale: שׂמח는 단순한 감정보다 공동체적·언약적 기쁨을 가리키므로, 현대 합쇼체에서 자연스럽고 강한 ‘기뻐했습니다’로 옮겼습니다.
- source_word: עַל הַשְּׁבוּעָה
  english_pob_choice: over the oath
  chosen_korean: 그 맹세를 두고
  alternatives_korean:
  - 맹세 때문에
  - 맹세에 대해
  lexicon: HALOT
  rationale: עַל은 감정 동사의 대상/사유를 나타내므로, 맹세 자체를 기쁨의 근거로 드러내는 표현을 택했습니다.
- source_word: וּבְכָל רְצוֹנָם
  english_pob_choice: with all their will
  chosen_korean: 온 뜻을 다해
  alternatives_korean:
  - 온 इच्छा를 다해
  - 온 마음으로
  lexicon: HALOT
  rationale: רָצוֹן은 단순한 감정이 아니라 자발적 의지·원함을 가리키므로, 한국어에서 그 뉘앙스를 살리는 ‘온 뜻을 다해’를 선택했습니다.
- source_word: וַיִּמָּצֵא לָהֶם
  english_pob_choice: he let himself be found by them
  chosen_korean: 그를 발견하였고
  alternatives_korean:
  - 그분이 그들에게서 발견되셨고
  - 그들이 그를 찾을 수 있었습니다
  lexicon: HALOT
  rationale: 문맥상 하나님이 찾는 자들에게 응답하신다는 의미이므로, 지나치게 수동적이거나 설명적인 문장보다 결과를 간결히 드러내는 표현을 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 프로젝트 기본어휘에 따라 하나님의 고유명사는 대체 титул이 아니라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: וַיִּמָּצֵא לָהֶם의 신학적 뉘앙스
  chosen_reading: 그들이 그를 발견하였고
  alternative_readings:
  - 그가 그들에 의해 발견되었고
  - 그가 그들로부터 발견되게 하셨고
  rationale: 히브리어 수동형은 단순한 ‘찾아냄’ 이상으로, 하나님이 찾는 자들에게 자신을 드러내시는 관계적 응답을 담습니다. 한국어에서는 그 신학적 긴장을 유지하면서도 과도한 해설을 피했습니다.
  doctrine_reference: 하나님은 진실하게 찾는 자들에게 자신을 드러내신다는 성경적 응답성
