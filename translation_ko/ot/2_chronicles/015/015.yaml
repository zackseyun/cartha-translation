revisions:
- from: 온 유다는 그 맹세를 두고 기뻐했습니다. 이는 그들이 온 마음을 다해 맹세하고 온 뜻을 다해 그를 찾았기 때문입니다. 그러자 그들이 그를 발견하였고, 야훼께서 그들 사방에 평안을 주셨습니다.[a]
  to: 온 유다는 그 맹세를 두고 기뻐했습니다. 이는 그들이 온 마음을 다해 맹세하고 온 뜻을 다해 그분을 찾았기 때문입니다. 그분께서 그들에게 발견되셨고, 야훼께서 그들 사방에 평안을 주셨습니다.
  rationale: 원문의 נִמְצָא לָהֶם가 지닌 수동 구문을 ‘그분께서 그들에게 발견되셨고’로 보존했습니다. 이로써 하나님이 발견되심이라는 원문의 표현을 유지하고, 이를 단순히 인간이 능동적으로 발견했다는 말로 한정하지 않습니다. 본문이 이미 직역적 수동 표현을 채택하므로 중복 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:17:01Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그들이 그를 발견하였고’는 히브리어 נִמְצָא לָהֶם(‘그가 그들에게 발견되었다/찾아졌다’)의 수동 구문을 능동 구문으로 바꾸어, 원문의 표현상 주체성과 모호성을 충분히 보존하지 못합니다. ‘그분께서 그들에게 발견되셨고’로 옮기면 원문의 수동태를 유지하면서 문맥상 하나님을 가리키는 대명사도 분명해집니다. 나머지 핵심 의미, 곧 전 유다의 기쁨, 온 마음과 온 뜻으로 맹세하고 찾음, 야훼께서 주신 사방의 평안은 충실합니다.
  naturalness: 초안의 합쇼체는 전반적으로 자연스럽습니다. 다만 해당 수동 표현은 다소 문어적이지만, 성경 번역의 격식 안에서 자연스럽고 원문의 문법적 형태를 보존하는 데 적절합니다. ‘온 유다’, ‘그 맹세를 두고’, ‘온 뜻을 다해’, ‘그들 사방에 평안을 주셨습니다’도 현대 표준어의 격식 있는 문체에 맞습니다.
  terminology: ‘야훼’는 제공된 프로젝트 방침 및 영어 POB의 Yahweh와 일치합니다. שְׁבוּעָה는 ‘맹세’, רָצוֹן은 이 문맥에서 ‘뜻’으로 번역한 것이 적절합니다. 수동태를 본문에 반영하므로, 기존의 수동태 직역 대안 각주는 중복되어 삭제하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: נִמְצָא לָהֶם의 수동태가 능동태로 바뀌었습니다.
    rationale: ‘그들이 그를 발견하였고’는 의미상 가능한 해석이지만, 히브리어의 수동태와 ‘그가 자신을 발견되게 하셨다’라는 해석 가능성을 평면화합니다. 본문에서는 수동태를 보존해야 합니다.
  - severity: low
    issue: 각주가 본문 번역과 실질적으로 중복됩니다.
    rationale: 개정 본문이 ‘그분께서 그들에게 발견되셨고’라는 직역적 수동 표현을 채택하므로, ‘그가 그들에 의해 발견되었다’라는 각주는 별도의 번역 대안을 제공하지 않습니다.
  revised_text: 온 유다는 그 맹세를 두고 기뻐했습니다. 이는 그들이 온 마음을 다해 맹세하고 온 뜻을 다해 그분을 찾았기 때문입니다. 그분께서 그들에게 발견되셨고, 야훼께서 그들 사방에 평안을 주셨습니다.
