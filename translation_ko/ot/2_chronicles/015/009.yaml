  text: וַ/יִּקְבֹּ֗ץ אֶת כָּל יְהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/גָּרִים֙ עִמָּ/הֶ֔ם מֵ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וּ/מִ/שִּׁמְע֑וֹן כִּֽי נָפְל֨וּ עָלָ֤י/ו מִ/יִּשְׂרָאֵל֙ לָ/רֹ֔ב בִּ/רְאֹתָ֕/ם כִּֽי יְהוָ֥ה אֱלֹהָ֖י/ו עִמּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
  footnotes:
  - marker: a
    text: Or 'had come over to him' or more literally 'had fallen to him.' The Hebrew idiom refers to people transferring allegiance to Asa.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 유다와 베냐민의 모든 사람과, 그들과 함께한 나그네들, 곧 에브라임과 므낫세와 시므온에서 온 사람들을 모았습니다. 이는 이스라엘에서 많은 사람들이 그에게로 넘어왔기 때문인데, 그들이 야훼 그의 하나님이 그와 함께 계심을 보았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게로 넘어왔다’ 혹은 더 문자적으로는 ‘그에게로 떨어졌다’. 히브리어 관용구는 아사에게 충성을 옮긴 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  english_pob_choice: he gathered
  chosen_korean: 그는 … 모았습니다
  alternatives_korean:
  - 그는 … 모아들였습니다
  - 그는 … 집결시켰습니다
  lexicon: HALOT
  rationale: קבץ의 기본 뜻인 사람들을 모으다/소집하다를 자연스럽게 살려, 서술 흐름에 맞는 ‘모았습니다’를 택했습니다.
- source_word: הַגָּרִים
  english_pob_choice: the sojourners
  chosen_korean: 나그네들
  alternatives_korean:
  - 거주 외국인들
  - 이방인들
  - 타향살이하는 사람들
  lexicon: HALOT
  rationale: גֵּר의 사회적·거류민적 뉘앙스를 살리면서도 현대 독자가 이해하기 쉬운 말로 ‘나그네들’을 사용했습니다.
- source_word: נָפְלוּ עָלָיו
  english_pob_choice: had defected to him
  chosen_korean: 그에게로 넘어왔기
  alternatives_korean:
  - 그에게로 돌아섰기
  - 그에게 붙었기
  - 그에게로 떨어졌기
  lexicon: HALOT
  rationale: 정치·동맹 문맥의 관용구를 반영해 단순한 이동이 아니라 편이 바뀌는 의미를 드러내는 표현으로 옮겼습니다.
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  english_pob_choice: Yahweh his God was with him
  chosen_korean: 야훼 그의 하나님이 그와 함께 계심
  alternatives_korean:
  - 야훼 그의 하나님이 그 편이 되심
  - 야훼 그의 하나님이 그와 함께 하심
  lexicon: HALOT
  rationale: 하나님의 임재와 지지의 진술을 직설적으로 살리되, 한국어에서 하나님께 대한 높임을 반영해 ‘함께 계심’으로 옮겼습니다.
theological_decisions:
- issue: YHWH(יהוה) divine name rendering
  chosen_reading: 야훼
  alternative_readings:
