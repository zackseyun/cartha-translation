revisions:
- from: 그리고 그는 유다와 베냐민의 모든 사람과, 그들과 함께한 나그네들, 곧 에브라임과 므낫세와 시므온에서 온 사람들을 모았습니다. 이는 이스라엘에서 많은 사람들이 그에게로 넘어왔기 때문인데, 그들이 야훼 그의 하나님이 그와 함께 계심을 보았기 때문입니다.[a]
  to: 그리고 그는 유다와 베냐민의 모든 사람과, 그들과 함께한 에브라임과 므낫세와 시므온 출신의 거류민들을 모았습니다. 이는 이스라엘에서 많은 사람이 야훼, 그의 하나님께서 그와 함께 계심을 보고 그에게로 넘어왔기[a] 때문입니다.
  rationale: 거주 외부인을 뜻하는 הַגָּרִים을 ‘거류민들’로 바로잡고, 원문의 ‘그들이 보고’(בִּרְאֹתָם)를 주된 인과 절 안에 결합했습니다. ‘야훼’와 ‘그에게로 넘어왔기’는 유지했으며, 각주 앵커를 해당 관용구 번역어에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:17:01Z'
