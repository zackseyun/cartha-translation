  - severity: medium
    issue: 인과 표현이 ‘때문인데, … 때문입니다’로 중복되어 자연스럽지 않습니다.
    rationale: בִּרְאֹתָם은 ‘그들이 보고/보았을 때’라는 상황 또는 이유를 나타냅니다. 이를 주된 이유 절 안에 결합하면 원문의 관계와 한국어 문체를 모두 살릴 수 있습니다.
