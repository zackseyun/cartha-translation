  source_fidelity: ‘나그네들’은 הַגָּרִים(공동체 안에 거주하는 비토착민)의 거류민적 의미보다 일시적 여행자를 강하게 연상시킬 수 있습니다. 또한 원문의 ‘보고’라는 상황·이유 관계는 두 번의 ‘때문’ 절보다 한 문장 안에서 연결하는 편이 더 충실합니다.
  naturalness: 현 번역은 ‘이는 … 때문인데, … 때문입니다’라는 중첩된 인과 표현이 부자연스럽습니다. ‘거류민들’과 ‘… 보고 그에게로 넘어왔기 때문입니다’는 현대 표준 한국어 합쇼체에서 자연스럽고 명료합니다.
  terminology: יהוה는 방침에 따라 ‘야훼’로 유지했습니다. אֱלֹהָיו는 ‘그의 하나님’으로, עִמּוֹ는 존대 표현을 반영하여 ‘그와 함께 계심’으로 옮겼습니다. נָפְלוּ עָלָיו의 충성·소속 전환 의미는 ‘그에게로 넘어왔습니다’로 유지했습니다.
