base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
  footnotes:
  - marker: a
    text: Or 'had come over to him' or more literally 'had fallen to him.' The Hebrew idiom refers to people transferring allegiance to Asa.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 유다와 베냐민의 모든 사람과, 그들과 함께한 에브라임과 므낫세와 시므온 출신의 거류민들을 모았습니다. 이는 이스라엘에서 많은 사람이 야훼, 그의 하나님께서 그와 함께 계심을 보고 그에게로 넘어왔기[a] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게로 돌아섰기’. 더 문자적으로는 ‘그에게로 떨어졌기’. 히브리어 관용구는 사람들이 아사에게 충성을 옮겼음을 가리킵니다.
    reason: lexical_alternative
