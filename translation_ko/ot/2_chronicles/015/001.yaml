  lexicon: SBLGNT/HALOT proper-name usage not applicable; narrative conjunction handling
  rationale: 접두 접속사는 한국어에서 단순한 ‘그리고’보다 사건 전개를 자연스럽게 여는 ‘그때’로 옮겨, 서술의 흐름과 돌연한 전환감을 함께 살렸습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 후손
  - ~에게서 난
  lexicon: HALOT
  rationale: 문맥상 혈연 관계를 나타내므로 ‘아들’이 가장 직접적이며, ‘후손’보다 좁고 정확한 의미를 유지합니다.
- source_word: הָיְתָה עָלָיו
