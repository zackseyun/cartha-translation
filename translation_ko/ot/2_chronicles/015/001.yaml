lexical_decisions:
- source_word: וַעֲזַרְיָהוּ
  english_pob_choice: Now ... Azariah
  chosen_korean: 그때 ... 아사랴
  alternatives_korean:
  - 그리고 ... 아사랴
  - 이제 ... 아사랴
  lexicon: SBLGNT/HALOT proper-name usage not applicable; narrative conjunction handling
  rationale: 접두 접속사는 한국어에서 단순한 ‘그리고’보다 사건 전개를 자연스럽게 여는 ‘그때’로 옮겨, 서술의 흐름과 돌연한 전환감을 함께 살렸습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: ~의 아들
  alternatives_korean:
  - ~의 후손
  - ~에게서 난
  lexicon: HALOT
  rationale: 문맥상 혈연 관계를 나타내므로 ‘아들’이 가장 직접적이며, ‘후손’보다 좁고 정확한 의미를 유지합니다.
- source_word: הָיְתָה עָלָיו
  english_pob_choice: came upon
  chosen_korean: 임하셨습니다
  alternatives_korean:
  - 그에게 임하였습니다
  - 그 위에 계셨습니다
  lexicon: HALOT
  rationale: רוּחַ가 사람 위에 ‘있다’는 정적 표현보다, 예언적 영감이 ‘임하다’는 동적 의미가 본문에 더 잘 맞습니다. 한국어에서는 성령/하나님의 영의 작용을 가장 자연스럽게 드러내는 표현입니다.
- source_word: רוּחַ אֱלֹהִים
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님께로부터 온 영
  lexicon: HALOT
  rationale: 문맥이 예언적 감동과 권능 부여를 가리키므로 ‘하나님의 영’이 원문의 직접성을 유지합니다. 본문이 ‘성령’이라는 후기 교회 용어를 요구할 정도로 특정한 삼위일체적 표지를 갖고 있지는 않습니다.
