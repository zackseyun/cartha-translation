id: 2CH.15.4
reference: 2 Chronicles 15:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב֙ בַּ/צַּר ל֔/וֹ עַל יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יְבַקְשֻׁ֖/הוּ וַ/יִּמָּצֵ֥א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
  footnotes:
  - marker: a
    text: Or, more formally, 'in his distress,' with the singular referring collectively to Israel.
    reason: lexical_alternative
  - marker: b
    text: Or, 'he was found by them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 환난 가운데서 야훼[a], 이스라엘의 하나님께 돌아와 그를 찾았더니[b], 그가 그들에게 발견되셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 보다 형식적으로는 ‘그의 환난 가운데서’로도 옮길 수 있는데, 이 경우 단수 대명사는 이스라엘 전체를 집합적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그가 그들에게 발견되셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아와
  - 돌이켜
  lexicon: HALOT
  rationale: שׁוּב의 핵심은 단순 이동보다 관계의 회복을 포함한 ‘돌아옴’이므로, 앞절과 자연스럽게 이어지는 ‘돌아와’로 옮겼습니다.
- source_word: בַּצַּר לוֹ
  english_pob_choice: in their distress
  chosen_korean: 환난 가운데서
  alternatives_korean:
  - 고난 가운데서
  - 그들의 환난 중에
  - 그의 환난 가운데서
  lexicon: HALOT
  rationale: 문맥상 이스라엘 공동체를 가리키는 집합적 표현이므로 한국어에서는 자연스럽게 복수 주어를 풀지 않고, 압박과 곤경을 아우르는 ‘환난 가운데서’로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문맥의 신명은 예배적 대체어보다 고유명 표기인 ‘야훼’를 유지하는 것이 원문과 주석 전통에 더 직접적입니다.
- source_word: וַיְבַקְשֻׁהוּ
  english_pob_choice: sought him
  chosen_korean: 그를 찾았더니
  alternatives_korean:
  - 그를 구하였더니
  - 그를 찾고
  lexicon: HALOT
  rationale: בקשׁ는 하나님을 향한 의존적 추구를 뜻하므로, 한국어에서는 ‘찾다’가 가장 간결하고 자연스럽게 그 종교적 탐색을 담습니다.
- source_word: וַיִּמָּצֵא לָהֶם
  english_pob_choice: he was found by them
  chosen_korean: 그가 그들에게 발견되셨습니다
  alternatives_korean:
  - 그가 그들에게서 발견되었습니다
  - 그들이 그를 만나게 되었습니다
  lexicon: HALOT
  rationale: מצא의 니팔형은 단순 수동으로도 가능하지만, 하나님을 대상화된 발견물처럼 들리게 하지 않기 위해 ‘발견되셨습니다’로 옮겨 원문의 관계적 수동성을 살렸습니다.
theological_decisions:
- issue: 하나님의 ‘발견되심’의 번역 방식
  chosen_reading: ‘그가 그들에게 발견되셨습니다’로 옮겨, 찾는 자에게 응답하시는 하나님의 능동성을 보존했습니다.
  alternative_readings:
  - 그가 그들에게 발견되었습니다
  - 그들이 그를 찾을 수 있었습니다
  rationale: 히브리어 수동형은 형식적으로는 단순 수동이지만, 본문은 하나님을 우연히 찾은 사건이 아니라 회개와 탐구에 응답하신 사건으로 제시합니다. 한국어에서도 이 신학적 긴장을 유지하는 편이 좋습니다.
  doctrine_reference: '번역 철학: 원문의 관계적·언약적 의미를 보존하면서도 한국어 문체는 자연스럽게 유지'
