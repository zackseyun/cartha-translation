  rationale: 달의 서수 표현을 현대 한국어 시간 표현에 맞게 ‘셋째 달’로 옮겼습니다.
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה לְמַלְכ֥וּת אָסָא
