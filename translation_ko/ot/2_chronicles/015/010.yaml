  - 아사의 치세 열다섯째 해
  lexicon: HALOT
  rationale: 연대기 공식의 ל + year 구조를 ‘… 해’로 자연스럽게 처리하고, מַלְכוּת는 왕권/통치의 기간을 가리키므로 ‘통치’가 가장 직역에 가깝습니다.
