lexical_decisions:
- source_word: וְכֻתְּתוּ
  english_pob_choice: was crushed
  chosen_korean: 부딪혀 무너졌습니다
  alternatives_korean:
  - 산산이 부서졌습니다
  - 짓눌렸습니다
  - 무너졌습니다
  lexicon: HALOT
  rationale: כתת의 ‘부수다/짓부수다’는 뜻을 살리되, 주어가 집단이고 뒤의 분배 구문과 맞물리므로 한국어에서는 상호 충돌로 무너지는 모습을 자연스럽게 풀어 옮겼습니다.
- source_word: גוֹי בְּגוֹי / וְעִיר בְּעִיר
  english_pob_choice: nation by nation / and city by city
  chosen_korean: 한 민족이 다른 민족에게, 한 성읍이 다른 성읍에게
  alternatives_korean:
  - 민족 대 민족으로
  - 성읍 대 성읍으로
  - 민족마다 민족에게, 성읍마다 성읍에게
  lexicon: HALOT
  rationale: ב의 분배적·대립적 용법을 따라 ‘~에게’ 구조로 옮겨, 반복되는 내부 충돌의 느낌을 살렸습니다. ‘성읍’은 고대 문맥의 도시 공동체를 더 직접적으로 드러냅니다.
- source_word: הֲמָמָם בְּכָל צָרָה
  english_pob_choice: troubled them with every kind of distress
  chosen_korean: 그들을 온갖 고통으로 혼란에 빠뜨리셨기 때문입니다
  alternatives_korean:
  - 그들을 온갖 환난으로 괴롭게 하셨기 때문입니다
  - 그들을 온갖 어려움으로 어지럽히셨기 때문입니다
  - 그들을 온갖 고난으로 소동하게 하셨기 때문입니다
  lexicon: HALOT
  rationale: הָמַם의 ‘혼란에 빠뜨리다/어지럽히다’ 의미를 반영하면서, כָּל צָרָה의 포괄성을 ‘온갖 고통’으로 자연스럽게 전달했습니다. EN POB의 ‘distress’는 여기서 단순한 심리적 불안보다 넓은 압박을 가리킵니다.
theological_decisions:
- issue: 하나님의 직접 행위 표지
  chosen_reading: 본문의 원인절을 그대로 따라, 하나님께서 그들을 혼란에 빠뜨리셨다고 직설적으로 옮겼습니다.
  alternative_readings:
  - 하나님께서 그들을 그렇게 되도록 허락하셨다고 완곡하게 옮길 수 있음
  rationale: 히브리어는 하나님을 행위의 주어로 두고 있어, 이를 허용적 표현으로 약화하지 않고 본문이 말하는 주권적 개입을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3
