translation:
  language: ko
  text: 한 민족이 다른 민족에 의해, 한 성읍이 다른 성읍에 의해 짓부서졌습니다. 이는 하나님께서 온갖 고통으로 그들을 혼란에 빠뜨리셨기 때문입니다[a]
  philosophy: optimal-equivalence
  footnotes:
