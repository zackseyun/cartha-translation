  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
  footnotes:
  - marker: a
    text: Or 'ease the burden that your father put on us.' The Hebrew literally says 'lighten from the yoke,' preserving the image of a yoke as a metaphor for oppressive labor or rule.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말하였습니다. “당신들은 무엇을 조언하십니까? 우리가 이 백성에게 어떻게 대답해야 하겠습니까? 그들은 내게 ‘당신의 아버지가 우리에게 지운 멍에를 가볍게 해 주십시오’라고 말하였습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘멍에에서 가볍게 하다’라고 말합니다. POB는 압제적 노동이나 통치를 가리키는 비유로서의 멍에 이미지를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֽוֹעָצִים
  english_pob_choice: do you advise
  chosen_korean: 무엇을 조언하십니까?
  alternatives_korean:
  - 무슨 의견이 있으십니까?
  - 어떻게 하라고 조언하십니까?
  lexicon: HALOT
  rationale: ייעץ의 의미를 살려 ‘조언하다’로 옮겼고, 왕이 신하들에게 자문하는 상황이므로 존대 의문형이 자연스럽습니다.
- source_word: וְנָשִׁיב דָּבָר
  english_pob_choice: so that we may answer
  chosen_korean: 우리가 ... 어떻게 대답해야 하겠습니까
  alternatives_korean:
  - 우리가 ... 대답해야 할 수 있도록
  - 우리가 ... 대답할 말이 있게
  lexicon: HALOT
  rationale: 직역된 ‘말을 돌려보내다’보다 문맥상 ‘대답하다’가 한국어로 더 분명하며, 목적의 뉘앙스를 살렸습니다.
- source_word: מִן הָעֹל
  english_pob_choice: the yoke
  chosen_korean: 멍에
  alternatives_korean:
  - 짐
  - 부담
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 유지하기 위해 ‘멍에’를 택했고, 지배와 강제노동의 비유를 보존했습니다.
- source_word: הָקֵל ... נָתַן ... עָלֵינוּ
  english_pob_choice: Lighten ... put on us
  chosen_korean: 가볍게 해 주십시오 ... 우리에게 지운
  alternatives_korean:
  - 덜어 주십시오 ... 우리에게 얹은
  - 가볍게 만들어 주십시오 ... 우리 위에 놓으신
  lexicon: HALOT
  rationale: ‘가볍게 하다’는 히필 명령형의 부담 경감 의미를 자연스럽게 전달하며, ‘지운’은 외부에서 부과된 멍에의 이미지를 살립니다.
- source_word: הָעָם הַזֶּה
  english_pob_choice: this people
  chosen_korean: 이 백성
  alternatives_korean:
  - 이 사람들
  - 이 백성들
  lexicon: HALOT
  rationale: 집합적 단수 표현을 한국어 성경 문맥에 맞게 ‘이 백성’으로 옮겼습니다.
theological_decisions:
- issue: 왕의 자문 요청이 직접 화법 안에 다시 인용됨
  chosen_reading: 직접 인용 속에서 백성의 요구를 다시 인용하는 구조를 유지했습니다.
  alternative_readings:
  - 서술형으로 평탄화하여 한 번만 인용함
  - 백성의 말을 간접화법으로 완전히 바꿈
  rationale: 원문은 왕의 질문과 백성의 요청을 층위 있게 구분하므로, 중첩 인용을 살려 책임 소재와 발화 구조를 드러내는 것이 본문의 긴장을 보존합니다.
  doctrine_reference: 내러티브 문맥 보존
- issue: ‘멍에’ 비유의 유지 여부
  chosen_reading: 전통적으로 익숙한 ‘부담’보다 ‘멍에’를 본문 중심으로 유지했습니다.
  alternative_readings:
  - 부담
  - 짐
  rationale: 본문은 억압적 통치를 신체적 비유인 멍에로 제시하므로, 이를 완화하지 않고 그대로 드러내는 편이 저자의 의도를 더 잘 전달합니다.
  doctrine_reference: 본문의 은유 보존
