  text: So Israel has been in rebellion against the house of David to this day[a].
  footnotes:
  - marker: a
    text: Or 'Israel rebelled against the house of David to this day.' The Hebrew verb can be rendered as a simple past ('rebelled') or as emphasizing the continuing state ('has been in rebellion').
