translation:
  language: ko
  text: 그러므로 이스라엘은 오늘까지 다윗의 집에 대해 반역해 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '이스라엘은 오늘까지 다윗의 집에 반역했습니다.' 히브리어 동사는 단순한 과거('반역했습니다')로도, 계속되는 상태를 강조하는 표현('반역해 왔습니다')로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  english_pob_choice: has been in rebellion
  chosen_korean: 반역해 왔습니다
  alternatives_korean:
  - 반역했습니다
  - 반란을 일으켜 왔습니다
  - 배반해 왔습니다
  lexicon: HALOT
  rationale: פּשע는 단순한 도덕적 '죄'보다 권위에 대한 반역·봉기를 뜻하므로, 계속성을 드러내는 '반역해 왔습니다'로 옮겨 영어 POB의 지속 상태를 반영했습니다.
- source_word: בְּבֵית דָּוִיד
  english_pob_choice: against the house of David
  chosen_korean: 다윗의 집에 대해
  alternatives_korean:
  - 다윗의 집을 향해
  - 다윗의 집에 맞서
  - 다윗의 집에 대하여
  lexicon: HALOT
  rationale: ב와 함께 쓰인 이 구절은 반역의 대상이 되는 왕조를 가리키므로, 한국어에서는 자연스럽게 '다윗의 집에 대해'로 두어 왕조적 의미를 살렸습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 지금까지
  - 오늘날까지
  - 이 날까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 기준 시점이 본문의 현재까지 이어짐을 간결하게 나타내기 위해 '오늘까지'를 택했습니다.
theological_decisions:
- issue: 이스라엘의 범위
  chosen_reading: 여기서 '이스라엘'은 남유다와 대비되는 북이스라엘 공동체를 가리키는 집합명사로 유지했습니다.
  alternative_readings:
  - '''이스라엘 백성''으로 풀어 설명하기'
  - '''북이스라엘''로 명시하기'
  rationale: 본문의 역사·정치적 대조를 보존하기 위해 해석을 본문 안에 덧붙이지 않고, 고유명사 '이스라엘'을 그대로 유지했습니다.
  doctrine_reference: 역사서의 문맥 보존
