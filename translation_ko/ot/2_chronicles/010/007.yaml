  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֵלָ֜י/ו לֵ/אמֹ֗ר אִם תִּֽהְיֶ֨ה לְ/ט֜וֹב לְ/הָ/עָ֤ם הַ/זֶּה֙ וּ/רְצִיתָ֔/ם וְ/דִבַּרְתָּ֥ אֲלֵ/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
  footnotes:
  - marker: a
    text: Or “if you show them favor.” The Hebrew verb can carry the sense of being pleased with someone or treating them favorably.
    reason: lexical_alternative
  - marker: b
    text: Or “they will serve you continually.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말했습니다[a]. “만일 왕께서 이 백성에게 유익하게 하시고, 그들을 기쁘게 하시며, 그들에게 좋은 말을 하시면[b], 그들은 왕의 종이 되어 평생 왕을 섬길 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 그에게 호의를 베풀라고 말했습니다.” 히브리어 동사는 누군가를 기쁘게 여기거나 호의롭게 대한다는 뜻을 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그들이 당신을 계속 섬기게 될 것입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו לֵאמֹר
  english_pob_choice: They spoke to him, saying
  chosen_korean: 그들이 그에게 말했습니다
  alternatives_korean:
  - 그들이 그에게 이르러 말했습니다
  - 그들이 그에게 말하기를
  lexicon: WLC; דבר
  rationale: 말하다의 기본 서술을 따라 간결하게 옮기되, 이어지는 직접인용을 자연스럽게 받도록 했습니다.
- source_word: אִם תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה
  english_pob_choice: If you will be good to this people
  chosen_korean: 만일 왕께서 이 백성에게 유익하게 하시고
  alternatives_korean:
  - 만일 왕께서 이 백성에게 좋게 하시고
  - 만일 왕께서 이 백성을 선하게 대하시면
  lexicon: WLC; היה + לְ + טוֹב
  rationale: היה + לְ + טוֹב의 관계적·유익한 의미를 살려 ‘유익하게 하시고’로 옮겼습니다. ‘좋게 하다’보다 한국어에서 대상에게 이로운 처신이라는 점이 더 분명합니다.
- source_word: וּרְצִיתָם
  english_pob_choice: you please them
  chosen_korean: 그들을 기쁘게 하시며
  alternatives_korean:
  - 그들에게 호감을 얻으시며
  - 그들을 만족시키시며
  - 그들에게 은혜를 베푸시며
  lexicon: WLC; רצה
  rationale: 문맥상 백성의 호의를 얻는 뜻이므로, 직역보다 자연스러운 ‘기쁘게 하시며’로 관계적 유화의 뉘앙스를 살렸습니다.
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  english_pob_choice: and speak good words to them
  chosen_korean: 그들에게 좋은 말을 하시면
  alternatives_korean:
  - 그들에게 좋은 말들을 하시면
  - 그들에게 선한 말들을 하시면
  lexicon: WLC; דברים טובים
  rationale: 말/말들의 반복을 지나치게 무겁게 드러내기보다, 한국어에서 자연스러운 ‘좋은 말을 하시면’로 옮겨 권면의 내용을 살렸습니다.
- source_word: וְהָיוּ לְךָ עֲבָדִים כָּל הַיָּמִים
  english_pob_choice: then they will be your servants all your days
  chosen_korean: 그들은 왕의 종이 되어 평생 왕을 섬길 것입니다
  alternatives_korean:
  - 그들은 왕의 종이 되어 모든 날 왕의 종이 될 것입니다
  - 그들은 왕을 섬기는 자들이 될 것입니다
  lexicon: WLC; עֲבָדִים; כָּל הַיָּמִים
  rationale: 정치적 충성의 맥락이므로 ‘종’이 적절하며, כָּל הַיָּמִים는 한국어의 관용적 시간 표현인 ‘평생’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 르호보암에게 주는 조언의 어조와 왕 칭호
  chosen_reading: 직접적인 2인칭 왕호를 살려 ‘왕께서’로 번역했습니다.
  alternative_readings:
  - 그대가
  - 당신이
  rationale: 원문의 2인칭 خطاب을 현대 한국어에서 공손하면서도 왕에게 어울리는 호칭으로 드러내기 위해 ‘왕께서’를 사용했습니다.
  doctrine_reference: 본문 서술의 화자-청자 관계 및 왕정 문맥
- issue: עֲבָדִים의 사회적 뉘앙스
  chosen_reading: ‘종’으로 번역해 충성·봉사 관계를 표현했습니다.
  alternative_readings:
  - 노예
  - 신하
  rationale: 여기서는 매매되는 노예 신분이 아니라 왕권에 대한 종속과 봉사의 상태이므로, 한국어 성경 전통과 문맥을 함께 고려해 ‘종’이 가장 정확합니다.
  doctrine_reference: 고대 근동 왕정 문맥
