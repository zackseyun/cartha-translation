id: 2CH.10.4
reference: 2 Chronicles 10:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָבִ֖י/ךָ הִקְשָׁ֣ה אֶת עֻלֵּ֑/נוּ וְ/עַתָּ֡ה הָקֵל֩ מֵ/עֲבֹדַ֨ת אָבִ֜י/ךָ הַ/קָּשָׁ֗ה וּ/מֵ/עֻלּ֧/וֹ הַ/כָּבֵ֛ד אֲשֶׁר נָתַ֥ן עָלֵ֖י/נוּ וְ/נַֽעַבְדֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
  footnotes:
  - marker: a
    text: Or 'made our yoke hard' or 'made our yoke severe.'
    reason: lexical_alternative
  - marker: b
    text: '''Service'' here refers to imposed labor or obligation under royal rule; alternatively, ''labor.'''
    reason: cultural_note
translation:
  language: ko
  text: 당신의 아버지는 우리의 멍에를 무겁게 하셨습니다[a]. 그러니 이제 당신의 아버지의 힘든 섬김과 그분이 우리에게 지운 무거운 멍에를 가볍게 해 주십시오[b]. 그러면 우리가 당신을 섬기겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 멍에를 가혹하게 하셨습니다’ 또는 ‘우리의 멍에를 심하게 하셨습니다’.
    reason: lexical_alternative
  - marker: b
    text: ‘섬김’은 여기서 부과된 노역이나 왕권 아래의 의무를 가리키며, 달리 ‘노동’로 옮길 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִקְשָׁה / עֻלֵּנוּ
  english_pob_choice: made our yoke heavy
  chosen_korean: 우리의 멍에를 무겁게 하셨습니다
  alternatives_korean:
  - 우리의 멍에를 कठ하게 하셨습니다
  - 우리의 멍에를 힘들게 하셨습니다
  - 우리의 멍에를 가혹하게 하셨습니다
  lexicon: HALOT
  rationale: הִקְשָׁה의 사역적 의미를 살리면서, עֹל의 핵심 이미지인 멍에를 그대로 유지했습니다. 영어 POB의 ‘heavy’에 맞춰 ‘무겁게’로 옮겨 yoke 비유를 일관되게 했습니다.
- source_word: הָקֵל
  english_pob_choice: lighten
  chosen_korean: 가볍게 해 주십시오
  alternatives_korean:
  - 덜어 주십시오
  - 가벼워지게 해 주십시오
  - 가볍게 하여 주십시오
  lexicon: HALOT
  rationale: 명령형 요청으로서 부담을 줄여 달라는 뜻을 자연스럽게 드러내기 위해 ‘가볍게 해 주십시오’를 택했습니다. 멍에/짐 이미지와도 잘 맞습니다.
- source_word: מֵעֲבֹדַת ... הַקָּשָׁה
  english_pob_choice: the hard service
  chosen_korean: 힘든 섬김
  alternatives_korean:
  - 가혹한 노동
  - 혹독한 봉사
  - 힘든 노역
  lexicon: HALOT
  rationale: 문맥상 강제 노역이나 왕권 아래의 의무를 가리키므로 단순 노동보다 정치적·사회적 뉘앙스를 살릴 수 있는 ‘섬김’을 택했습니다. ‘힘든’은 הַקָּשָׁה의 강도를 반영합니다.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  english_pob_choice: and his heavy yoke
  chosen_korean: 그분이 우리에게 지운 무거운 멍에
  alternatives_korean:
  - 그분의 무거운 멍에
  - 그분이 우리에게 얹은 무거운 멍에
  - 그분이 우리에게 놓은 무거운 멍에
  lexicon: HALOT
  rationale: נתן עַל의 부담을 ‘지우다’로 옮겨 ‘put on us’의 부담-가해 이미지를 살렸습니다. ‘무거운 멍에’는 앞의 ‘멍에’를 반복해 원문의 병렬 구조를 보존합니다.
- source_word: וְנַעַבְדֶךָּ
  english_pob_choice: and we will serve you
  chosen_korean: 우리가 당신을 섬기겠습니다
  alternatives_korean:
  - 우리가 당신을 섬길 것입니다
  - 우리가 당신을 봉사하겠습니다
  - 우리가 당신에게 복종하겠습니다
  lexicon: HALOT
  rationale: יכבד한 정치적 충성의 약속이지만, 원문의 동사를 과도하게 해석하지 않도록 가장 직접적인 ‘섬기다’를 사용했습니다. 서술형 미래로 약속의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 왕권 아래 강제 의무를 가리키는 ‘service’의 의미
  chosen_reading: ‘섬김’으로 옮기되, 맥락상 자발적 종교 섬김이 아니라 왕권 아래의 강제적 의무라는 긴장을 유지했습니다.
  alternative_readings:
  - ‘노역’으로 옮기기
  - ‘봉사’로 옮기기
  rationale: 영어 POB 주석이 밝히듯 כאן의 service는 단순 노동보다 통치 아래의 의무를 가리킵니다. ‘섬김’은 그 문맥을 넓게 보존하면서도, 필요 이상으로 현대적 정치 용어로 치우치지 않습니다.
  doctrine_reference: 왕정 본문 문맥(왕상 12장 평행본문)
