  text: וְ/כָל יִשְׂרָאֵ֗ל כִּ֠י לֹא שָׁמַ֣ע הַ/מֶּלֶךְ֮ לָ/הֶם֒ וַ/יָּשִׁ֣יבוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜יד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י אִ֤ישׁ לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑יד וַ/יֵּ֥לֶךְ כָּל יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
  footnotes:
  - marker: a
    text: Or, more dynamically, 'to your homes.' The Hebrew reads 'to your tents,' an idiom for dispersing to one's own place.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Each man to your tents, O Israel' uses a masculine singular noun distributively.
    reason: cultural_note
translation:
  language: ko
  text: 온 이스라엘은 왕이 자기들의 말을 듣지 않자 왕에게 이렇게 대답했습니다. “다윗에게 우리가 무슨 몫이 있습니까? 이새의 아들에게는 우리에게 기업이 없습니다. 이스라엘아, 각자[b] 자기 천막들[a]로 돌아가라! 이제 다윗아, 네 집이나 돌보라!” 그래서 온 이스라엘은 각자의 천막으로 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너의 천막들’이라고 합니다. 이는 각자의 자리로 흩어지라는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘너의’는 남성 단수 형태이지만, 여기서는 이스라엘 전체에게 분배적으로 적용됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  english_pob_choice: listen to
  chosen_korean: 귀를 기울이지 않으므로
  alternatives_korean:
  - 듣지 않으므로
  - 들으려 하지 않으므로
  lexicon: HALOT
  rationale: 단순 청각이 아니라 왕이 백성의 요청을 받아들이지 않은 뜻이므로, 관계적·반응적 의미를 살려 옮겼습니다.
- source_word: וַיָּשִׁיבוּ
  english_pob_choice: answered
  chosen_korean: 대답하여
  alternatives_korean:
  - 응답하여
  - 되돌려 말하여
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘돌이켜 주다’ 계열이지만 관용적으로는 ‘대답하다’의 뜻이므로 자연스럽게 옮겼습니다.
- source_word: חֵלֶק / נַחֲלָה
  english_pob_choice: share / inheritance
  chosen_korean: 몫 / 기업
  alternatives_korean:
  - 분깃 / 유산
  - 지분 / 상속
  lexicon: HALOT
  rationale: 정치적 결별 선언에 쓰인 분배·상속 어휘를 살리기 위해 ‘몫’과 ‘기업’을 대응시켰습니다.
- source_word: לְאֹהָלֶיךָ / לְאֹהָלָיו
  english_pob_choice: to your tents / to their tents
  chosen_korean: 자기 천막으로 돌아가십시오 / 자기 천막으로 갔습니다
  alternatives_korean:
  - 자기 장막으로 돌아가십시오 / 자기 장막으로 갔습니다
  - 집으로 돌아가십시오 / 집으로 갔습니다
  lexicon: HALOT
  rationale: 관용구를 한국어의 ‘집으로’로 풀 수도 있지만, 원문 이미지인 ‘천막’을 유지해 역사적·문학적 질감을 살렸습니다.
- source_word: רְאֵה בֵיתְךָ
  english_pob_choice: see to your own house
  chosen_korean: 당신의 집이나 살펴보십시오
  alternatives_korean:
  - 당신의 집을 돌보십시오
  - 당신의 집이나 챙기십시오
  lexicon: HALOT
  rationale: 다윗 왕조를 향한 결별·철수의 뉘앙스를 반영하되, 과도한 해석 없이 ‘집’을 돌보라는 의미를 살렸습니다.
theological_decisions:
- issue: 분리 선언의 관용적 정치 어구 보존
  chosen_reading: “다윗에게 우리가 무슨 몫이 있습니까? 이새의 아들에게 우리가 무슨 기업이 있습니까?”
  alternative_readings:
  - “다윗과 무슨 상관이 있습니까?”
  - “다윗에게 우리는 아무 관계도 없습니다.”
  rationale: 원문의 언약·상속 언어가 이 본문의 정치적 결별을 형성하므로, 현대적 의역으로 약화하지 않고 그대로 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
- issue: 남성 단수 분배형 אִישׁ 처리
  chosen_reading: 각자 자기 천막으로 돌아가십시오
  alternative_readings:
  - 모두 자기 천막으로 돌아가십시오
  - 각 사람은 자기 집으로 돌아가십시오
  rationale: 히브리어의 남성 단수형이 분배적으로 쓰였으므로, 성별 표지를 완전히 지우지 않으면서도 한국어에서는 자연스러운 분배 표현으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
