source:
  edition: WLC
  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
  footnotes:
  - marker: a
    text: Or 'who attended him' or 'who served him,' reflecting a courtly idiom in 'stood before him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 르호보암은 장로들이 그에게 해 준 충고를 버리고, 그와 함께 자라서 그 앞에 서 있던 젊은이들과 상의하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '그 앞에 서 있던'은 궁정적 관용구로서 '그를 시중들던' 또는 '그를 섬기던'으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  english_pob_choice: abandoned
  chosen_korean: 버리고
  alternatives_korean:
  - 떠나
  - 저버리고
  - 포기하고
  lexicon: HALOT
  rationale: 문맥상 르호보암이 장로들의 충고를 단순히 뒤로 미룬 것이 아니라 받아들이지 않고 거절한 뜻이므로, 자연스러운 한국어로 '버리고'가 적절합니다.
- source_word: עֲצַת הַזְּקֵנִים
  english_pob_choice: the advice of the elders
  chosen_korean: 장로들이 해 준 충고
  alternatives_korean:
  - 장로들의 조언
  - 늙은이들의 충고
  lexicon: HALOT
  rationale: עֵצָה는 '조언'도 가능하지만, 여기서는 공식적이고 숙고된 권고를 가리키므로 '충고'가 문맥에 맞습니다. הַזְּקֵנִים은 단순한 나이보다 원로 자문단의 의미가 강해 '장로들'로 옮겼습니다.
- source_word: יְעָצֻהוּ
  english_pob_choice: they had given him
  chosen_korean: 해 준
  alternatives_korean:
  - 조언해 준
  - 권고한
  lexicon: HALOT
  rationale: 히브리어는 '그에게 충고하다'의 의미지만, 한국어에서는 앞의 '충고'를 반복하기보다 '해 준'으로 풀어 자연스럽게 재현했습니다.
- source_word: וַיִּוָּעַץ
  english_pob_choice: consulted with
  chosen_korean: 상의하였습니다
  alternatives_korean:
  - 자문하였습니다
  - 상의했습니다
  - 상담하였습니다
  lexicon: HALOT
  rationale: 니팔형의 '의논에 들어가다'라는 뜻을 살리면서도 현대 한국어에서 가장 자연스러운 공식 표현은 '상의하다'입니다.
- source_word: הָעֹמְדִים לְפָנָיו
  english_pob_choice: who stood before him
  chosen_korean: 자기 앞에 서 있던
  alternatives_korean:
  - 그를 시중들던
  - 그를 섬기던
  - 그 앞에 배석하던
  lexicon: HALOT
  rationale: 직역 이미지를 본문에 유지해 히브리어의 궁정적 표현을 살렸습니다. 영어 POB의 각주가 지적하듯, 이 표현은 궁정에서 섬기거나 시중드는 뜻을 담을 수 있습니다.
theological_decisions:
- issue: '''stood before him''의 궁정 관용구 처리'
  chosen_reading: 본문에는 직역적인 '자기 앞에 서 있던'을 두고, 관용적 의미는 주석 수준의 각주로 처리합니다.
  alternative_readings:
  - 그를 시중들던
  - 그를 섬기던
  - 그 앞에서 섬기던
  rationale: 히브리어의 궁정적 관용구를 한국어 본문에서 완전히 풀어버리면 원문 이미지가 약해지므로, 본문은 보존하고 의미 확장은 각주로 남기는 편이 source-direct합니다.
  doctrine_reference: '번역 원칙: 원문 이미지 보존과 관용구의 이중 의미 유지'
- issue: 장로들과 젊은이들의 대비 구조
  chosen_reading: 본문의 대조를 살려 장로들의 충고를 버리고 젊은이들과 상의한 것으로 옮깁니다.
  alternative_readings:
  - 어른들의 말을 버리고 젊은이들의 말을 들었습니다
  - 원로들의 조언을 무시하고 젊은 관리들과 의논하였습니다
  rationale: 이 절은 르호보암의 판단이 원로의 지혜보다 동년배 집단의 조언을 택했음을 보여 주므로, 대비 구조를 선명하게 유지해야 합니다.
  doctrine_reference: '문맥 신학: 왕의 선택과 지혜 거부의 서사'
