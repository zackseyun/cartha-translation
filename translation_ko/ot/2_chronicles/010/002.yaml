reference: 2 Chronicles 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֨עַ יָרָבְעָ֤ם בֶּן נְבָט֙ וְ/ה֣וּא בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י שְׁלֹמֹ֣ה הַ/מֶּ֑לֶךְ וַ/יָּ֥שָׁב יָרָבְעָ֖ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
  footnotes:
  - marker: a
    text: Or 'heard of it.' The Hebrew does not state the object explicitly; the context supplies what Jeroboam heard.
    reason: lexical_alternative
  - marker: b
    text: Literally 'where he had fled from before King Solomon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 느밧의 아들 여로보암이 그 소식을 들었는데 — 그는 이집트에 있었고, 솔로몬 왕 앞에서 도망해 갔던 곳이었습니다 — 여로보암은 이집트에서 돌아왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그 소식을”은 본문에 명시된 목적어가 없지만, 앞 문맥이 여로보암이 들은 내용을 분명히 제시합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘솔로몬 왕 앞에서 도망해 갔던 곳’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  english_pob_choice: And when ... heard
  chosen_korean: '...이 그 소식을 들었는데'
  alternatives_korean:
  - '...이 들었을 때'
  - '...이 듣고'
  lexicon: HALOT
  rationale: 히브리어의 הזמן절 도입을 한국어에서는 자연스러운 종속절로 풀어 ‘...이 그 소식을 들었는데’로 옮기면 서사 흐름을 살리면서도 과도한 직역을 피할 수 있습니다.
- source_word: וְהוּא בְמִצְרַיִם
  english_pob_choice: for he was in Egypt
  chosen_korean: 그는 이집트에 있었고
  alternatives_korean:
  - 그는 이집트에 있었는데
  - 그는 이집트에 있었습니다
  lexicon: HALOT
  rationale: 부연 설명의 기능을 살려 중간 삽입구로 처리했고, 문장 연결은 한국어에서 자연스러운 설명적 접속으로 조정했습니다.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  english_pob_choice: where he had fled from before King Solomon
  chosen_korean: 솔로몬 왕 앞에서 도망해 갔던 곳이었습니다
  alternatives_korean:
  - 솔로몬 왕 앞에서 달아났던 곳이었습니다
  - 솔로몬 왕의 얼굴 앞에서 도망했던 곳이었습니다
  lexicon: HALOT
  rationale: מִפְּנֵי의 ‘앞에서/면전에서’라는 의미를 살리되, 현대 한국어에서는 ‘앞에서 도망해 갔다’가 가장 직접적이고 이해하기 쉽습니다.
- source_word: וַיָּשָׁב ... מִמִּצְרָיִם
  english_pob_choice: Jeroboam returned from Egypt
  chosen_korean: 여로보암은 이집트에서 돌아왔습니다
  alternatives_korean:
  - 여로보암은 이집트에서 되돌아왔습니다
  - 여로보암은 이집트로부터 돌아왔습니다
  lexicon: HALOT
  rationale: שׁוּב는 여기서 회개가 아니라 장소로의 귀환을 뜻하므로, 서술형으로 단순히 ‘돌아왔습니다’라고 옮겼습니다.
