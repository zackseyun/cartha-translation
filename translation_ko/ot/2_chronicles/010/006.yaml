  to: 그러자 르호보암 왕은 그의 아버지 솔로몬이 살아 있을 때 솔로몬 앞에 서 있던 장로들과 의논하고 말했습니다. “이 백성에게 어떻게 대답해야 한다고 조언하십니까?”
  rationale: 원문은 르호보암이 솔로몬 생전에 그 앞에서 섬기던 장로들에게 조언을 구하고, 백성에게 어떤 답변을 해야 할지 묻는 장면입니다. 본문은 이를 자연스러운 합쇼체로 옮겼습니다. 기존 각주는 표지와 설명 대상이 일치하지 않아 삭제했습니다. ‘솔로몬 앞에 서 있던’은 원문의 관용적 표현을 보존하되, 그 의미를 특정 직무로 한정하지 않습니다.
