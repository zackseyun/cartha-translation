id: 2CH.10.6
reference: 2 Chronicles 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּוָּעַ֞ץ הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הַ/זְּקֵנִים֙ אֲשֶׁר הָי֣וּ עֹֽמְדִ֗ים לִ/פְנֵי֙ שְׁלֹמֹ֣ה אָבִ֔י/ו בִּֽ/הְיֹת֥/וֹ חַ֖י לֵ/אמֹ֑ר אֵ֚יךְ אַתֶּ֣ם נֽוֹעָצִ֔ים לְ/הָשִׁ֥יב לָֽ/עָם הַ/זֶּ֖ה דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
  footnotes:
  - marker: a
    text: Literally, “How are you advising to return a word to this people?” The Hebrew idiom means to give an answer or reply.
    reason: lexical_alternative
  - marker: b
    text: “Stood before Solomon” can also mean “attended” or “served” him in an official capacity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 르호보암 왕은 그의 아버지 솔로몬이 아직 살아 있을 때[a] 그의 앞에 서 있던 장로들에게 상담하며[b] 말했습니다. “이 백성에게 어떻게 대답하라고 여러분은 조언하십니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 아버지 솔로몬이 살아 있는 동안”입니다. 시간적 대비를 분명히 하기 위해 “아직 살아 있을 때”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 앞에 서 있던’은 궁정에서 공식적으로 대기하며 섬기던 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  english_pob_choice: consulted
  chosen_korean: 상담하며
  alternatives_korean:
  - 의논하며
  - 조언을 구하며
  - 자문하며
  lexicon: HALOT
  rationale: 니팔형의 יעץ는 단순히 혼자 숙고하는 것이 아니라 남의 의견을 구해 조언을 받는 뜻이므로, 문맥상 자연스러운 '상담하며'로 옮겼습니다.
- source_word: הַזְּקֵנִים
  english_pob_choice: the elders
  chosen_korean: 장로들
  alternatives_korean:
  - 늙은이들
  - 원로들
  - 노인들
  lexicon: HALOT
  rationale: 여기서는 연령 자체보다 왕에게 조언하는 공식적 위치가 강조되므로, 문맥에 맞는 '장로들'을 택했습니다.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  english_pob_choice: who had stood before
  chosen_korean: …의 앞에 서 있던
  alternatives_korean:
  - …을 섬기던
  - …을 시중들던
  - …앞에 서서 섬기던
  lexicon: HALOT
  rationale: 히브리어 관용구인 '앞에 서다'의 이미지를 살리면서도, 궁정에서의 공식적 대기·봉사의 뉘앙스를 과도하게 좁히지 않기 위해 직역 쪽을 유지했습니다.
- source_word: לְהָשִׁיב לָעָם הַזֶּה דָּבָר
  english_pob_choice: How do you advise me to answer this people?
  chosen_korean: 이 백성에게 어떻게 대답하라고
  alternatives_korean:
  - 이 백성에게 어떻게 답하라고
  - 이 백성에게 어떤 말을 하라고
  - 이 백성에게 어떻게 응답하라고
  lexicon: HALOT
  rationale: הֵשִׁיב דָּבָר는 관용적으로 '대답하다/응답하다'의 뜻이므로, 한국어에서는 자연스러운 '대답하라고'로 풀었습니다.
theological_decisions:
- issue: 왕에게 조언을 구하는 장면의 말투
  chosen_reading: 내레이션은 합쇼체로 유지하고, 인용문은 신하들에게 묻는 직접화법으로 자연스럽게 처리했습니다.
  alternative_readings:
  - 인용문 전체를 더 평이한 반말체로 처리
  - 왕의 권위가 드러나도록 더 고어체로 처리
  rationale: 히브리어 본문은 서술과 발화가 뚜렷이 구분되며, 한국어 합쇼체 서술 속에서 직접 질문을 자연스럽게 살리는 편이 원문의 장면성을 잘 보존합니다.
  doctrine_reference: 문체 일관성과 서사적 화행 보존
