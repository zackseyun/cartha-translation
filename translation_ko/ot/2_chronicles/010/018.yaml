id: 2CH.10.18
reference: 2 Chronicles 10:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Hadoram''; the parallel account in 1 Kings 12:18 has ''Adoram.'''
    reason: alternative_reading
  - marker: b
    text: Or 'the Israelites.' Hebrew 'the sons of Israel' is an idiomatic national designation.
    reason: lexical_alternative
  - marker: c
    text: Or 'who was over the labor levy.' The Hebrew term refers to imposed labor service.
    reason: lexical_alternative
  - marker: d
    text: Or 'made haste to mount the chariot.' The Hebrew more literally says 'strengthened himself to go up into the chariot.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 르호보암 왕이 세금을 관장하던 하도람을 보냈습니다[a]. 그러나 이스라엘 자손은 그를 돌로 쳐 죽였고, 그도 죽었습니다[d][c][b]. 르호보암 왕은 마차에 올라 예루살렘으로 도망하려고 몸을 가다듬었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 '하도람'이며, 평행본문인 1열왕기 12:18에는 '아도람'으로 나옵니다.
    reason: cross_reference
  - marker: b
    text: 직역하면 '이스라엘의 아들들'이지만, 여기서는 민족 집단을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 강제된 노동·부역의 성격을 가리키는 מַס를 사용합니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 '마차에 올라가려고 스스로를 강하게 하였다'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲדֹרָם
  english_pob_choice: Hadoram
  chosen_korean: 하도람
  alternatives_korean:
  - 아도람
  lexicon: HALOT
  rationale: 열왕기상 12:18의 평행본문에는 다른 이름형이 있으나, 본문 히브리어 형태 הֲדֹרָם을 따라 하도람으로 옮겼습니다.
- source_word: עַל הַמַּס
  english_pob_choice: who was over the forced labor
  chosen_korean: 세금을 관장하던
  alternatives_korean:
  - 강제 노역을 맡던
  - 노역 할당을 관장하던
  lexicon: HALOT
  rationale: מַס는 단순한 세금보다 강제된 부과·노역의 성격이 있어, 한국어에서는 행정적 직함을 살리면서도 본문의 억압적 관리를 드러내는 표현으로 옮겼습니다.
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  english_pob_choice: stoned him with stones
  chosen_korean: 돌로 쳐 죽였고
  alternatives_korean:
  - 돌을 던져 쳤고
  - 돌로 쳤고
  lexicon: HALOT
  rationale: 히브리어는 동사와 명사형 '돌'을 함께 써서 행위의 강도를 강조하지만, 한국어에서는 중복을 풀어 자연스럽게 하되 폭력성을 분명히 했습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 그대로 살리되, 한국어 성경 문체에서도 통용되는 직역형으로 유지했습니다.
- source_word: הִתְאַמֵּץ
  english_pob_choice: strengthened himself
  chosen_korean: 몸을 가다듬었습니다
  alternatives_korean:
  - 스스로 힘을 냈습니다
  - 굳게 먹었습니다
  lexicon: HALOT
  rationale: 히트파엘형의 자기 결집·기력 회복의 의미를 반영하되, 단순한 '서둘렀다'보다 원문의 자기강화 뉘앙스를 살리는 표현을 택했습니다.
theological_decisions:
- issue: 희화화되지 않는 폭력 묘사
  chosen_reading: 돌로 쳐 죽였고
  alternative_readings:
  - 돌로 쳤고
  - 돌을 던졌고
  rationale: 본문은 실제 살해를 말하므로 결과를 분명히 드러내는 번역이 서사적 긴장을 훼손하지 않습니다.
  doctrine_reference: 서사 본문은 사건의 사실성과 결과를 희석하지 않고 전달해야 합니다.
