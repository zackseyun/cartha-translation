source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Hadoram''; the parallel account in 1 Kings 12:18 has ''Adoram.'''
    reason: alternative_reading
  - marker: b
    text: Or 'the Israelites.' Hebrew 'the sons of Israel' is an idiomatic national designation.
    reason: lexical_alternative
  - marker: c
    text: Or 'who was over the labor levy.' The Hebrew term refers to imposed labor service.
    reason: lexical_alternative
  - marker: d
    text: Or 'made haste to mount the chariot.' The Hebrew more literally says 'strengthened himself to go up into the chariot.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 르호보암 왕이 강제 노역[c]을 맡은 하도람[a]을 보냈습니다. 그러나 이스라엘 자손[b]이 그를 돌로 쳤고, 그는 죽었습니다. 르호보암 왕은 마차에 올라 예루살렘으로 도망하려고 스스로 힘을 냈습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 ‘하도람’이며, 평행본문인 열왕기상 12:18에는 ‘아도람’으로 나옵니다.
    reason: cross_reference
  - marker: b
    text: 직역하면 ‘이스라엘의 아들들’이지만, 여기서는 민족 집단을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 מַס는 단순한 세금이 아니라 부과된 강제 노동·부역을 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘마차에 올라가려고 스스로를 강하게 하였다’입니다.
    reason: lexical_alternative
