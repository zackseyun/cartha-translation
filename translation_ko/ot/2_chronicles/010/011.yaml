review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ‘무거운 멍에를 지웠으나’는 הֶעְמִיס ... עֹל כָּבֵד의 부담 부과와 멍에 비유를 충실히 보존합니다. 다만 ‘너희 멍에를 더하겠소’는 한국어에서 무엇을 더하는지 불명확하므로, ‘더 무겁게 하겠습니다’로 뜻을 명료하게 해야 합니다. 마지막 절은 히브리어에서 앞 절의 동사가 생략된 병렬 구조이지만, 한국어 초안의 ‘너희를 전갈로 하겠소’는 문법적으로 성립하지 않습니다. 생략된 ‘징계하다’를 보충하고 ‘전갈들’을 본문에 유지하여 문자적 표현과 문맥상 가혹한 도구라는 가능성을 함께 보존했습니다.
  naturalness: 초안의 ‘하겠소’는 현대 표준 합쇼체의 기본 종결형으로는 다소 고풍스럽고, 특히 ‘전갈로 하겠소’는 비문입니다. ‘하겠습니다’ 및 명시된 동사를 사용하면 현대적이고 정중한 직접 화법이 되면서도 원문의 위협적 선언을 유지합니다.
  terminology: ‘멍에’, ‘징계하다’, ‘채찍’, ‘전갈들’은 각각 עֹל, יסר, שׁוֹט, עַקְרַבִּים에 적절히 대응합니다. ‘전갈들’은 본문에서 직역으로 두고, 전갈 채찍이라는 관용적·문맥적 이해는 각주에서 대안으로 제시하는 것이 안전합니다.
