id: 2CH.10.11
reference: 2 Chronicles 10:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֖י בָּֽ/עֲקְרַבִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
  footnotes:
  - marker: a
    text: Or possibly 'with scorpion-whips,' that is, whips fitted with sharp points or barbs; the Hebrew reads literally 'with scorpions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내 아버지는 너희에게 무거운 멍에를 지웠으나, 나는 너희 멍에를 더하겠소. 내 아버지는 너희를 채찍으로 징계했으나, 나는 너희를 전갈로 하겠소.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전갈이 달린 채찍’, 곧 날카로운 돌기나 가시가 달린 채찍일 수도 있습니다. 히브리어는 문자적으로 ‘전갈들’이라고 읽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס עֲלֵיכֶם
  english_pob_choice: made your yoke heavy
  chosen_korean: 너희에게 무거운 멍에를 지웠으나
  alternatives_korean:
  - 너희 멍에를 무겁게 했으나
  - 너희에게 무거운 짐을 얹었으나
  lexicon: HALOT
  rationale: 히필형 הֶעְמִיס는 ‘무겁게 하다’보다 ‘짐을 지우다/얹다’의 부담 부과를 나타내며, 한국어에서는 ‘멍에를 지우다’가 비유를 가장 자연스럽게 살립니다.
- source_word: עֹל כָּבֵד / עֻלְּכֶם
  english_pob_choice: a heavy yoke / your yoke
  chosen_korean: 무거운 멍에 / 너희 멍에
  alternatives_korean:
  - 심한 멍에 / 너희 짐
  - 가혹한 멍에 / 너희 멍에
  lexicon: HALOT
  rationale: עֹל은 문자적으로 ‘멍에’이므로 이미지를 보존했고, כָּבֵד는 ‘무거운’이 가장 सीधे 대응됩니다. 두 번째 절의 병행을 살려 ‘너희 멍에’를 유지했습니다.
- source_word: יִסַּר
  english_pob_choice: disciplined
  chosen_korean: 징계했으나
  alternatives_korean:
  - 훈계했으나
  - 때렸으나
  - 교정했으나
  lexicon: HALOT
  rationale: יִסַּר은 단순 처벌보다 교정적 징계를 뜻하므로, 현대 한국어에서 성경적이면서도 비문어체로 굳지 않은 ‘징계하다’가 가장 적절합니다.
- source_word: בַּשּׁוֹטִים / בָּעֲקְרַבִּים
  english_pob_choice: with whips / with scorpions
  chosen_korean: 채찍으로 / 전갈로
  alternatives_korean:
  - 채찍으로 / 전갈채찍으로
  - 채찍으로 / 전갈채찍으로 하겠소
  lexicon: HALOT
  rationale: בַּשּׁוֹטִים는 ‘채찍’, בָּעֲקְרַבִּים는 문자적으로 ‘전갈’입니다. 본문이 주는 강한 직설을 살리기 위해 직역을 유지했습니다.
theological_decisions:
- issue: 르호보암의 발화체와 직접 인용의 높임/비높임
  chosen_reading: 직접 화법 안에서는 왕의 강압적 발언을 드러내기 위해 평서 종결과 구어적 어조를 섞지 않고 단정적으로 옮겼습니다.
  alternative_readings:
  - 더 완곡한 왕령체
  - 현대 서사체로 완전히 중화한 표현
  rationale: 본문은 백성에게 대한 위협적 선언이므로, 문체를 완화하면 원문의 정치적 압박이 약해집니다.
  doctrine_reference: 서사적 화행과 문체 재현
