base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
  footnotes:
  - marker: a
    text: Or possibly 'with scorpion-whips,' that is, whips fitted with sharp points or barbs; the Hebrew reads literally 'with scorpions.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 젊은 신하들의 조언에 따라 그들에게 말했습니다. 「나는 너희의 멍에를 더 무겁게 할 것이고, 그것에 더하겠습니다. 내 아버지는 너희를 채찍으로 징계했지만, 나는 전갈로 하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전갈채찍’으로도 이해할 수 있습니다. 즉, 날카로운 돌기나 가시가 달린 채찍을 가리킬 수 있으나, 히브리어는 문자적으로 ‘전갈’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּ֣ר
  english_pob_choice: He spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 대답했습니다
  lexicon: HALOT
  rationale: דבר의 기본 의미는 ‘말하다’이므로, 문맥상 응답이지만 해석을 덜어낸 ‘말했습니다’로 옮겼습니다.
- source_word: כַּ/עֲצַ֤ת הַ/יְלָדִים֙
  english_pob_choice: according to the advice of the young men
  chosen_korean: 젊은 신하들의 조언에 따라
  alternatives_korean:
  - 젊은이들의 조언에 따라
  - 젊은 남자들의 조언에 따라
  lexicon: HALOT
  rationale: הַיְלָדִים는 문자적으로 ‘어린 자들’이지만, 여기서는 르호보암의 성장 동료이자 조언자들을 가리키므로 문맥상 ‘젊은 신하들’이 자연스럽습니다.
- source_word: אַכְבִּיד אֶת עֻלְּכֶם
  english_pob_choice: I will make your yoke heavier
  chosen_korean: 나는 너희의 멍에를 더 무겁게 할 것이고
  alternatives_korean:
  - 나는 너희의 멍에를 무겁게 할 것이고
  - 나는 너희의 멍에를 더할 것이고
  lexicon: HALOT
  rationale: כבד의 사역형은 ‘무겁게 하다’이므로, 이미 있는 압박을 더 가중시키는 뜻을 살려 ‘더 무겁게 할 것이고’로 옮겼습니다.
- source_word: וַאֲנִי בָּעֲקְרַבִּים
  english_pob_choice: but I with scorpions
  chosen_korean: 나는 전갈로 하겠습니다
  alternatives_korean:
  - 나는 전갈로 징계하겠습니다
  - 나는 전갈채찍으로 하겠습니다
  lexicon: HALOT
  rationale: עַקְרָבִּים의 문자적 뜻인 ‘전갈’을 본문에 유지해 강한 비유를 살렸습니다. 영어 POB의 주석처럼 ‘전갈채찍’ 가능성은 있으나, 본문은 직역적 이미지를 우선합니다.
theological_decisions:
- issue: 르호보암의 발언에서 의도된 폭력적 과장의 보존
  chosen_reading: ‘전갈’이라는 직설적 이미지를 그대로 살려, 더 가혹한 통치 의도를 드러냈습니다.
  alternative_readings:
  - ‘전갈채찍’으로 풀어 주어 더 명시적으로 만들기
  rationale: 본문의 수사적 충격을 약화시키지 않기 위해, 원문이 유지하는 거친 대비를 그대로 드러내는 쪽을 택했습니다.
  doctrine_reference: 본문 이해 및 수사 보존
