translation:
  language: ko
  text: 왕이 그들에게 거칠게[a] 대답하였고, 르호보암 왕은 장로들의 조언을 버렸습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “엄하게.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “저버렸습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנֵם
  english_pob_choice: answered them
  chosen_korean: 그들에게 대답하였고
  alternatives_korean:
  - 그들에게 응답하였고
  - 그들에게 답하였고
  lexicon: HALOT
  rationale: 3인칭 복수 목적어가 분명하므로 ‘그들에게’로 대상까지 드러내고, 문맥상 단순 응답보다 대응적 발화를 살려 ‘대답하였고’로 옮겼습니다.
- source_word: קָשָׁה
  english_pob_choice: harshly
  chosen_korean: 거칠게
  alternatives_korean:
  - 혹독하게
  - 엄하게
  - 가혹하게
  lexicon: HALOT
  rationale: 대답의 성격을 수식하는 말이므로 한국어에서는 형용사 직역보다 부사형 ‘거칠게’가 자연스럽고, 말투의 कठ함을 잘 드러냅니다.
- source_word: וַיַּעֲזֹב ... אֵת עֲצַת
  english_pob_choice: forsook the counsel
  chosen_korean: 조언을 버렸습니다
  alternatives_korean:
  - 조언을 저버렸습니다
  - 조언을 내버렸습니다
  - 조언을 떠났습니다
  lexicon: HALOT
  rationale: עָזַב의 ‘떠나다/버리다/저버리다’ 의미 중 여기서는 장로들의 권고를 의도적으로 채택하지 않는 뜻이므로 ‘버리다’가 가장 직접적입니다.
- source_word: עֲצַת הַזְּקֵנִים
  english_pob_choice: the counsel of the elders
  chosen_korean: 장로들의 조언
  alternatives_korean:
  - 장로들의 권고
  - 늙은이들의 조언
  - 장로들의 간언
  lexicon: HALOT
  rationale: הַזְּקֵנִים은 단순히 나이 든 사람들이 아니라 지도적·자문적 역할의 장로들을 가리키므로 ‘장로들’을 유지하고, עֵצָה는 이 문맥에서 공식적인 ‘조언’으로 옮겼습니다.
