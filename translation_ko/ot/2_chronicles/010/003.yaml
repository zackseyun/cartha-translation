base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
  footnotes:
  - marker: a
    text: Or 'they sent word and summoned him.' The Hebrew leaves the object of 'sent' implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 사람을 보내어 그를 부르게 했습니다[a]. 여로보암과 온 이스라엘이 와서 르호보암에게 말하며 이르기를,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 사람을 보내어 그를 소환했습니다.” 히브리어는 ‘보내다’의 목적어를 생략합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַֽ/יִּשְׁלְחוּ
  english_pob_choice: they sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보내어
  - 전령을 보내어
  - 사람을 보내어 부르게 했습니다
  lexicon: WLC/HALOT
  rationale: 히브리어는 보낸 대상이 생략되어 있어, 문맥상 암시되는 파견 행위를 한국어에서 자연스럽게 보완하되 ‘전령’을 단정하지 않도록 했습니다.
- source_word: וַ/יִּקְרְאוּ ל֔/וֹ
  english_pob_choice: called for him
  chosen_korean: 그를 부르게 했습니다
  alternatives_korean:
  - 그를 불렀습니다
  - 그를 소환했습니다
  - 그를 불러오게 했습니다
  lexicon: WLC/HALOT
  rationale: קרא + ל는 여기서 단순 호출보다 ‘오게 하도록 부르다/불러오다’의 요청 성격이 강하므로, 이어지는 첫 동작과 구분되도록 표현했습니다.
- source_word: וַיָּבֹ֥א יָרָבְעָ֖ם וְ/כָל יִשְׂרָאֵ֑ל
  english_pob_choice: Jeroboam and all Israel came
  chosen_korean: 여로보암과 온 이스라엘이 와서
  alternatives_korean:
  - 여로보암과 온 이스라엘이 왔습니다
  - 여로보암과 모든 이스라엘이 와서
  - 여로보암이 온 이스라엘과 함께 와서
  lexicon: WLC/HALOT
  rationale: 단수 동사 뒤에 여로보암이 대표 주어처럼 먼저 놓인 구조를 살려 ‘와서’로 연결했고, ‘온 이스라엘’은 공동체 전체를 드러내는 관용적 표현으로 보존했습니다.
- source_word: וַֽ/יְדַבְּר֔וּ אֶל רְחַבְעָ֖ם
  english_pob_choice: spoke to Rehoboam
  chosen_korean: 르호보암에게 말하며
  alternatives_korean:
  - 르호보암에게 말했습니다
  - 르호보암에게 말하여
  - 르호보암에게 말하고
  lexicon: WLC/HALOT
  rationale: דבר אל의 기본 의미를 살리면서, 뒤의 인용 도입 ‘이르기를’과 함께 히브리어 담화 흐름을 유지했습니다.
- source_word: לֵ/אמֹֽר־־־׃
  english_pob_choice: saying,
  chosen_korean: 이르기를,
  alternatives_korean:
  - 말하며,
  - 말하기를,
  - 이르되,
  lexicon: WLC/HALOT
  rationale: 다음 절의 직접 화법을 여는 המחבר 구조를 반영하기 위해 한국어에서도 인용 도입 표지를 남겼습니다.
