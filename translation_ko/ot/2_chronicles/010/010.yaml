source:
  edition: WLC
  text: וַ/יְדַבְּר֣וּ אִתּ֗/וֹ הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֡ר לָ/עָם֩ אֲשֶׁר דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תֹּאמַ֣ר אֲלֵ/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
  footnotes:
  - marker: a
    text: Hebrew literally, 'My littleness is thicker than my father’s waist'; the expression is idiomatically understood as 'My little finger is thicker than my father’s waist.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my father’s loins.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그와 함께 자라난 젊은이들이 그에게 말하였습니다. “백성에게 이렇게 말하십시오. ‘당신의 아버지께서는 우리의 멍에를 무겁게 하셨지만, 당신은 그것을 우리 위에서 가볍게 하십시오.’ 또 그들에게 이렇게 말하십시오. ‘내 작은 손가락이 내 아버지의 허리보다 더 굵습니다.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 작은 것(또는 작은 손가락)’이 아니라 ‘내 작음’의 관용적 표현이지만, 문맥상 ‘내 작은 손가락’으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 מָתְנַיִם은 ‘허리’ 또는 ‘허리춤/허리 부분’, 경우에 따라 ‘허리 아래(내장/생식기 부위)’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  english_pob_choice: the young men
  chosen_korean: 젊은이들
  alternatives_korean:
  - 소년들
  - 청년들
  lexicon: HALOT
  rationale: 왕실 조언 장면에서 ‘children’의 문자값보다 함께 성장한 동년배라는 사회적 의미가 중요하므로, 자연스러운 한국어로 ‘젊은이들’을 택했습니다.
- source_word: גָּדְלוּ אִתּוֹ
  english_pob_choice: had grown up with him
  chosen_korean: 그와 함께 자라난
  alternatives_korean:
  - 그와 함께 성장한
  - 그와 함께 길러진
  lexicon: HALOT
  rationale: 동시적 성장과 친밀한 관계를 나타내는 관용 표현이므로, 직역보다 ‘그와 함께 자라난’이 문맥에 맞습니다.
- source_word: הָקֵל מֵעָלֵינוּ
  english_pob_choice: make it lighter for us
  chosen_korean: 그것을 우리 위에서 가볍게 하십시오
  alternatives_korean:
  - 우리에게서 덜어 주십시오
  - 우리에게서 가볍게 하십시오
  lexicon: HALOT
  rationale: 영어 POB의 개정본이 한국어의 위치 관계를 그대로 살리는 쪽이 아니라는 점을 참고하되, 히브리어 מֵעָלֵינוּ의 ‘우리 위에서/우리에게서’라는 방향성을 보존하기 위해 ‘우리 위에서 가볍게 하십시오’로 옮겼습니다.
- source_word: קָטָנִּי עָבָה מִמָּתְנֵי אָבִי
  english_pob_choice: My little finger is thicker than my father’s waist
  chosen_korean: 내 작은 손가락이 내 아버지의 허리보다 더 굵습니다
  alternatives_korean:
  - 내 작은 손가락이 내 아버지의 허리보다 더 두껍습니다
  - 내 새끼손가락이 내 아버지의 허리보다 더 굵습니다
  lexicon: HALOT
  rationale: 관용적 비유를 한국어에서 즉시 이해되도록 풀어 옮겼습니다. ‘새끼손가락’은 자연스럽지만 원문의 ‘작은’이라는 형용사와 비교적 덜 밀착되므로 ‘작은 손가락’을 택했습니다.
theological_decisions:
- issue: 직설적 보복/자랑 표현의 강도 유지
  chosen_reading: ‘내 작은 손가락이 내 아버지의 허리보다 더 굵습니다’로 과장된 자만의 뉘앙스를 그대로 살렸습니다.
  alternative_readings:
  - ‘내 작은 손가락이 아버지의 허리보다 낫습니다’처럼 완화
  - ‘내 작은 손가락은 아버지의 허리보다 더 강합니다’처럼 의역
  rationale: 이 구절은 르호보암의 오만한 답변을 드러내는 수사이므로, 완화하거나 도덕화하지 않고 비교적 거친 자랑을 그대로 유지하는 것이 본문 효과에 충실합니다.
  doctrine_reference: 본문의 서사적 수사 보존
- issue: 명령문 어조
  chosen_reading: 대상에게 전달되는 지시를 현대 한국어 합쇼체 명령으로 옮겼습니다.
  alternative_readings:
  - 평서형으로 완화
  - -라 체로 직접화
  rationale: 원문은 반복되는 지시문 구조이므로, 현대적이면서도 권고/명령의 긴장을 유지하는 합쇼체가 가장 적절합니다.
  doctrine_reference: 문체·화행 보존
