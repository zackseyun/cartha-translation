  lexicon: HALOT
  rationale: 동시적 성장과 친밀한 관계를 나타내는 관용 표현이므로, 직역보다 ‘그와 함께 자라난’이 문맥에 맞습니다.
- source_word: הָקֵל מֵעָלֵינוּ
  english_pob_choice: make it lighter for us
  chosen_korean: 그것을 우리 위에서 가볍게 하십시오
  alternatives_korean:
  - 우리에게서 덜어 주십시오
  - 우리에게서 가볍게 하십시오
  lexicon: HALOT
  rationale: 영어 POB의 개정본이 한국어의 위치 관계를 그대로 살리는 쪽이 아니라는 점을 참고하되, 히브리어 מֵעָלֵינוּ의 ‘우리 위에서/우리에게서’라는 방향성을 보존하기 위해 ‘우리 위에서 가볍게 하십시오’로 옮겼습니다.
- source_word: קָטָנִּי עָבָה מִמָּתְנֵי אָבִי
  english_pob_choice: My little finger is thicker than my father’s waist
  chosen_korean: 내 작은 손가락이 내 아버지의 허리보다 더 굵습니다
  alternatives_korean:
  - 내 작은 손가락이 내 아버지의 허리보다 더 두껍습니다
  - 내 새끼손가락이 내 아버지의 허리보다 더 굵습니다
  lexicon: HALOT
  rationale: 관용적 비유를 한국어에서 즉시 이해되도록 풀어 옮겼습니다. ‘새끼손가락’은 자연스럽지만 원문의 ‘작은’이라는 형용사와 비교적 덜 밀착되므로 ‘작은 손가락’을 택했습니다.
theological_decisions:
- issue: 직설적 보복/자랑 표현의 강도 유지
  chosen_reading: ‘내 작은 손가락이 내 아버지의 허리보다 더 굵습니다’로 과장된 자만의 뉘앙스를 그대로 살렸습니다.
  alternative_readings:
