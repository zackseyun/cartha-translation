translation:
  language: ko
  text: 그러나 르호보암이 유다의 성읍들에 사는 이스라엘 자손을 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ‘유다의 성읍들에 사는 이스라엘의 아들들.’'
