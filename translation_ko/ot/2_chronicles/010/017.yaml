lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  english_pob_choice: the children of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: בְּנֵי יִשְׂרָאֵל은 여기서 민족을 가리키는 관용적 표현이므로, 직역적인 ‘아들들’보다 표준적이고 문맥에 맞는 ‘이스라엘 자손’이 원문과 POB의 형식을 함께 잘 살립니다.
- source_word: הַ/יֹּֽשְׁבִ֖ים
  english_pob_choice: who lived
  chosen_korean: 사는
  alternatives_korean:
  - 거주하는
  - 거하는
  lexicon: HALOT
  rationale: 히브리어 분사는 지속적 거주를 뜻하므로, 현대 한국어에서는 자연스러운 현재 관형형 ‘사는’으로 옮겨 지속성을 유지했습니다.
- source_word: בְּ/עָרֵ֣י יְהוּדָ֑ה
  english_pob_choice: in the cities of Judah
  chosen_korean: 유다의 성읍들에
  alternatives_korean:
  - 유다의 도시들에
  - 유다 성읍들에
  lexicon: HALOT
  rationale: 지리적 소속 관계를 드러내는 ‘유다의 성읍들에’가 가장 직접적이며, ‘도시’보다 성읍이 고대 문맥에 더 가깝습니다.
- source_word: וַ/יִּמְלֹ֥ךְ עֲלֵי/הֶ֖ם
  english_pob_choice: reigned over them
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 왕으로 군림했습니다
  lexicon: HALOT
  rationale: 문맥상 ‘왕이 되다’보다 이미 왕권을 행사하는 의미가 핵심이므로, 한국어에서는 ‘다스리다’가 가장 자연스럽고 원문의 통치 관계를 분명히 드러냅니다.
theological_decisions:
- issue: 한국어 서술에서 첫 절두사 וּ의 대비 기능을 어떻게 반영할지
  chosen_reading: 문맥 대비를 살려 ‘그러나’로 시작했습니다.
  alternative_readings:
  - 그리고
  - 또
  rationale: 앞 문맥의 분열·대조를 이어 주는 접속 기능이 있으므로, 단순 연결보다 대비를 나타내는 ‘그러나’가 서술 흐름을 더 정확히 드러냅니다.
  doctrine_reference: 서사 연결어의 문맥 기능 반영
