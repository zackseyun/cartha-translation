base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
  footnotes:
  - marker: a
    text: Or “Come back to me on the third day.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 여로보암과 온 백성이 셋째 날에 르호보암에게 왔습니다. 왕이 “셋째 날에 내게로 돌아오십시오”라고 말한 그대로였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 이르렀습니다
  - 도착했습니다
  lexicon: HALOT
  rationale: אֶל רְחַבְעָם의 방향성을 살려, 서술자의 시점에서 자연스러운 ‘왔습니다’로 옮겼습니다.
- source_word: וְכָל הָעָם
  english_pob_choice: and all the people
  chosen_korean: 온 백성
  alternatives_korean:
  - 모든 사람들
  - 백성 모두
  lexicon: HALOT
  rationale: 형식적인 ‘집회’보다 함께 온 무리를 가리키는 일반적 의미를 살려 ‘온 백성’으로 간결하게 옮겼습니다.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  english_pob_choice: on the third day
  chosen_korean: 세째 날에
  alternatives_korean:
  - 셋째 날에
  - 세 번째 날에
  lexicon: HALOT
  rationale: 한국어 성경 문맥에서 자연스러운 날짜 표현으로 옮겼습니다.
- source_word: שׁוּבוּ אֵלַי
  english_pob_choice: Return to me
  chosen_korean: 내게로 돌아오십시오
  alternatives_korean:
  - 내게로 돌아오라
  - 내게 돌아오십시오
  lexicon: HALOT
  rationale: 지시의 초점은 단순한 이동이 아니라 왕에게 다시 돌아오는 것이므로 ‘내게로 돌아오십시오’가 원문 명령을 가장 분명하게 살립니다.
theological_decisions:
- issue: 왕의 직접 발화의 높임말 처리
  chosen_reading: 직접 인용문 안에서는 요청형 명령을 예의 있는 명령체 ‘돌아오십시오’로 옮겼습니다.
  alternative_readings:
  - 돌아오라
  - 돌아오세요
  rationale: 본문의 왕의 말은 권위 있는 명령이지만, 현대 한국어 합쇼체 본문에서 지나치게 구어적이거나 비격식적인 표현은 피하는 것이 적절합니다.
  doctrine_reference: 문체·화행 처리
