translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「사흘 뒤에 다시 내게 돌아오십시오.」 그러자 백성이 떠났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 말했습니다
  lexicon: HALOT
  rationale: 서사적 wayyiqtol의 담화 도입을 자연스러운 현대 한국어 서술로 옮겼습니다.
- source_word: אֲלֵהֶם
  english_pob_choice: to them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들에게
  lexicon: HALOT
  rationale: 전치사 אֶל + 대명사 접미사를 대상어 표지인 ‘-에게/에게’로 자연스럽게 반영했습니다.
- source_word: ע֛וֹד שְׁלֹ֥שֶׁת יָמִ֖ים
  english_pob_choice: in three days
  chosen_korean: 사흘 뒤에
  alternatives_korean:
  - 또 사흘
  - 사흘 동안 더
  lexicon: HALOT
  rationale: 히브리어의 직역 가능성보다 문맥상 ‘세 날 후’라는 시간을 분명하게 드러내는 한국어 관용 표현을 택했습니다.
- source_word: וְ/שׁ֣וּבוּ אֵלַ֑/י
  english_pob_choice: Come back to me
  chosen_korean: 다시 내게 돌아오십시오
  alternatives_korean:
  - 내게 돌아오십시오
  - 돌아오십시오
  lexicon: HALOT
  rationale: שׁוּב의 ‘되돌아오다’ 의미를 살리면서, ‘내게’로 방향을 유지하고 공손한 명령형으로 옮겼습니다.
- source_word: וַ/יֵּ֖לֶךְ הָ/עָֽם
  english_pob_choice: So the people went away
  chosen_korean: 그러자 백성이 떠났습니다
  alternatives_korean:
  - 그러자 사람들이 떠났습니다
  - 백성이 떠났습니다
  lexicon: HALOT
  rationale: 히브리어 집합명사 הָעָם의 단수 동사 용법을 한국어에서는 집합적 주어 ‘백성’으로 자연스럽게 처리했습니다.
