source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה נְסִבָּה֙ מֵ/עִ֣ם הָֽ/אֱלֹהִ֔ים לְמַעַן֩ הָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֤ר דִּבֶּר֙ בְּ/יַד֙ אֲחִיָּ֣הוּ הַ/שִּֽׁלוֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
  footnotes:
  - marker: a
    text: Or 'for the cause was from God.' The Hebrew noun can denote a turn, circumstance, or causative development.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 왕은 백성의 말을 듣지 않았습니다. 이러한 일은 하나님께로부터 비롯된 것이었으니, 야훼께서 실로 사람 아히야를 통하여 느밧의 아들 여로보암에게 하신 말씀을 이루시기 위함이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 원인이 하나님께로부터 있었기 때문이었습니다.” 히브리어 명사 נְסִבָּה는 사건의 전개, 사정, 또는 원인적 전환을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  english_pob_choice: did not listen to
  chosen_korean: 듣지 않았습니다
  alternatives_korean:
  - 귀를 기울이지 않았습니다
  - 들으려 하지 않았습니다
  lexicon: HALOT
  rationale: 백성의 요청에 왕이 주의를 기울이지 않았다는 뜻이므로, 단순 청각이 아닌 반응 거부를 자연스러운 현대 한국어로 살렸습니다.
- source_word: נְסִבָּה
  english_pob_choice: turn of events
  chosen_korean: 이 일
  alternatives_korean:
  - 이러한 전개
  - 이런 전환
  - 사정
  lexicon: HALOT
  rationale: 문맥상 사건의 전개가 하나님의 섭리 아래 있었다는 점을 드러내면 충분하므로, 과도하게 추상적인 표현보다 서술 흐름에 맞는 '이 일'로 옮겼습니다.
- source_word: מֵעִם הָאֱלֹהִים
  english_pob_choice: from God
  chosen_korean: 하나님께로부터 난
  alternatives_korean:
  - 하나님께로부터 온
  - 하나님에게서 비롯된
  lexicon: HALOT
  rationale: 원문의 출처·기원을 나타내는 표현을 살려, 사건의 근원이 하나님께 있음을 분명히 하되 한국어로는 유려한 서술형으로 표현했습니다.
- source_word: בְּיַד אֲחִיָּהוּ
  english_pob_choice: through Ahijah
  chosen_korean: 아히야 ...를 통해
  alternatives_korean:
  - 아히야의 손을 통해
  - 아히야로 말미암아
  lexicon: HALOT
  rationale: בְּיַד의 매개 수단 의미를 '통해'로 자연스럽게 옮겨, 예언 전달의 중개 역할을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명기적 이름 יְהוָה를 '야훼'로 옮겨, 본문이 특정한 언약 명칭을 사용한다는 점을 유지했습니다.
theological_decisions:
- issue: 하나님의 주권과 인간의 책임이 함께 제시되는 구조
  chosen_reading: 이 일은 하나님께로부터 난 일이었으니 ... 하신 말씀을 이루려 하심이었습니다
  alternative_readings:
  - 이런 일은 하나님이 직접 하셨으니
  - 하나님이 왕을 듣지 못하게 하셨으니
  rationale: 본문은 왕의 실제 거부와 사건의 신적 기원을 함께 말합니다. 문장을 과도하게 단순화하지 않고, 하나님이 사건의 출처이되 왕의 행위는 그대로 서술되도록 유지했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
