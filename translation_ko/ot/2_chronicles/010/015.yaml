    rationale: ‘난 일’은 ‘일이 생김’ 또는 뜻밖의 사태라는 관용적 어감을 낼 수 있습니다. מֵעִם הָאֱלֹהִים의 기원 의미에는 ‘하나님께로부터 비롯된’이 더 분명합니다.
