  naturalness: ‘그의 조상들과 함께’는 의미상 가능하지만, 왕을 가리키는 표현이므로 ‘왕이 조상들과 함께’가 더 간결하고 자연스럽습니다. ‘유다에 되돌려 주었습니다’는 지명으로 표현된 정치 공동체에 대한 귀속 회복을 자연스럽게 전달합니다.
