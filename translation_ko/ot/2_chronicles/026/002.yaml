base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/002.yaml
  text: He built Eloth and restored it to Judah after the king slept with his fathers[a][b].
  footnotes:
  - marker: a
    text: Or 'brought it back to Judah.'
    reason: lexical_alternative
  - marker: b
    text: '''Slept with his fathers'' is a Hebrew idiom for death.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 엘롯을 건축하고, 왕이 조상들과 함께 잠든 뒤 그것을 유다에 되돌려 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 유다에 돌려주었습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘조상들과 함께 잠들다’는 죽음을 가리키는 히브리어의 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  english_pob_choice: built
  chosen_korean: 건축하고
  alternatives_korean:
  - 지었고
  - 세웠고
  lexicon: HALOT
  rationale: 도시/거점에 대한 일반적 ‘build’의 직접 대응으로 ‘건축하다’를 썼습니다. 문맥상 복원 의미가 있을 수 있지만, 동사 자체에는 그 뉘앙스가 명시되지 않습니다.
- source_word: אֵילוֹת
  english_pob_choice: Eloth
  chosen_korean: 엘롯
  alternatives_korean:
  - 엘로트
  - 에일랏
  lexicon: HALOT
  rationale: 지명은 음역하는 것이 원칙이므로, 현대 지명보다 본문 형태를 반영한 표기를 택했습니다.
- source_word: וַיְשִׁיבֶהָ
  english_pob_choice: restored it
  chosen_korean: 그것을 ... 돌려주었습니다
  alternatives_korean:
  - 그것을 되돌려주었습니다
  - 그것을 회복시켰습니다
  lexicon: HALOT
  rationale: 히필형 שוב의 사역적 의미를 살려 유다의 소유/통제권으로 ‘돌려주다’로 옮겼습니다. ‘회복’은 정치적 귀속보다 더 넓고 추상적일 수 있습니다.
- source_word: שְׁכַב הַמֶּלֶךְ עִם אֲבֹתָיו
  english_pob_choice: after the king slept with his fathers
  chosen_korean: 왕이 그의 조상들과 함께 잠든 뒤에
  alternatives_korean:
  - 왕이 그의 조상들과 함께 죽은 뒤에
  - 왕이 조상들 곁에 누운 뒤에
  lexicon: HALOT
  rationale: 왕실 부고 공식의 완곡어법을 유지하기 위해 직설적 ‘죽다’보다 ‘잠들다’를 살렸습니다. ‘with his fathers’는 관용구로서 ‘그의 조상들과 함께’로 직역했습니다.
