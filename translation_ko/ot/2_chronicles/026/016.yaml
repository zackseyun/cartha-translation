id: 2CH.26.16
reference: 2 Chronicles 26:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/כְ/חֶזְקָת֗/וֹ גָּבַ֤הּ לִבּ/וֹ֙ עַד לְ/הַשְׁחִ֔ית וַ/יִּמְעַ֖ל בַּ/יהוָ֣ה אֱלֹהָ֑י/ו וַ/יָּבֹא֙ אֶל הֵיכַ֣ל יְהוָ֔ה לְ/הַקְטִ֖יר עַל מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: ko
  text: 그가 강해지자 그의 마음이 교만해져서 멸망에 이르렀고, 그는 자기 하나님 야훼께 불충실하게 행하여 야훼의 성전에 들어가 향단 위에서 향을 피우기 위해 들어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘향단’은 ‘향 제단’의 통용 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  english_pob_choice: But when he became strong
  chosen_korean: 그가 강해지자
  alternatives_korean:
  - 그가 강해졌을 때
  - 그가 힘을 얻게 되자
  lexicon: HALOT
  rationale: 원문의 시간적 전환을 자연스럽게 살리면서, 상태 변화가 원인 사슬의 출발점임을 드러내기 위해 ‘강해지자’로 옮겼습니다.
- source_word: גָּבַהּ לִבּוֹ
  english_pob_choice: his heart was lifted up
  chosen_korean: 그의 마음이 교만해져서
  alternatives_korean:
  - 그의 마음이 높아져서
  - 그가 교만해져서
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘마음이 높아지다’를 한국어에서 자연스러운 도덕적 의미인 ‘교만해지다’로 풀되, 내적 상태의 변화를 유지했습니다.
- source_word: עַד לְהַשְׁחִית
  english_pob_choice: to his destruction
  chosen_korean: 멸망에 이르렀고
  alternatives_korean:
  - 파멸에 이르렀고
  - 스스로를 무너뜨릴 지경까지
  lexicon: HALOT
  rationale: 결과를 나타내는 표현이므로 행위의 방식보다 종착점을 살려 ‘멸망에 이르렀고’로 옮겼습니다.
- source_word: וַיִּמְעַל בַּיהוָה אֱלֹהָיו
  english_pob_choice: he acted unfaithfully against Yahweh his God
  chosen_korean: 자기 하나님 야훼께 불충실하게 행하여
  alternatives_korean:
  - 자기 하나님 야훼를 배반하여
  - 자기 하나님 야훼께 신의를 저버려
  lexicon: HALOT
  rationale: מעל의 언약적 배신 의미를 살려 ‘불충실하게 행하다’로 옮겼고, 본문이 야훼를 신뢰와 충성의 대상로 제시하므로 ‘대하여’보다 헌신 관계를 보이는 ‘께’가 더 적절합니다.
- source_word: הֵיכַל יְהוָה ... מִזְבַּח הַקְּטֹרֶת
  english_pob_choice: entered the temple of Yahweh to burn incense on the altar of incense
  chosen_korean: 야훼의 성전에 들어가 향단 위에 향을 피우려 했습니다
  alternatives_korean:
  - 야훼의 성전에 들어가 분향하려 했습니다
  - 야훼의 성전에 들어가 향 제단 위에 향을 피우려 했습니다
  lexicon: HALOT
  rationale: הֵיכָל은 여기서 성전 건물을 가리키므로 ‘성전’이 적절하고, מִזְבַּח הַקְּטֹרֶת은 기능을 드러내는 ‘향단’이 한국어 성경에서 널리 통용되어 문맥을 분명하게 합니다.
theological_decisions:
- issue: 여호와(יהוה) 대신 야훼 사용
  chosen_reading: 본문의 하나님의 이름은 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 야훼의 고유명사 יְהוָה가 직접 나오므로, 프로젝트 기본어에 따라 신적 칭호로 완화하지 않고 고유한 언약 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
