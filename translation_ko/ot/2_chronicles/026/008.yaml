id: 2CH.26.8
reference: 2 Chronicles 26:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְּנ֧וּ הָֽ/עַמּוֹנִ֛ים מִנְחָ֖ה לְ/עֻזִּיָּ֑הוּ וַ/יֵּ֤לֶךְ שְׁמ/וֹ֙ עַד לְ/ב֣וֹא מִצְרַ֔יִם כִּ֥י הֶחֱזִ֖יק עַד לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
  footnotes:
  - marker: a
    text: Or 'his name spread as far as the entrance of Egypt.' The Hebrew uses 'name' in the sense of reputation or fame.
    reason: lexical_alternative
  - marker: b
    text: '''The entrance of Egypt'' may refer to the approach to Egypt or its border region.'
    reason: cultural_note
translation:
  language: ko
  text: 암몬 사람들이 웃시야에게 조공을 바쳤고, 그의 명성[a]이 이집트의 입구[b]까지 퍼졌습니다. 그는 매우 강성해졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이름’을 사용하지만, 여기서는 평판이나 명성을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이집트의 입구’는 이집트로 들어가는 접근로 또는 국경 지역을 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  english_pob_choice: The Ammonites
  chosen_korean: 암몬 사람들
  alternatives_korean:
  - 암몬인
  - 암몬 족속
  lexicon: HALOT
  rationale: 민족/집단 표지로서 자연스럽고, 같은 맥락의 역사 서술에서 통용되는 중립적 표현입니다.
- source_word: מִנְחָה
  english_pob_choice: tribute
  chosen_korean: 조공
  alternatives_korean:
  - 선물
  - 예물
  - 공물
  lexicon: HALOT
  rationale: 왕에게 바치는 정치적 맥락이므로 일반적인 선물이나 제의적 예물보다 조공이 원문의 관계를 더 분명히 드러냅니다.
- source_word: שְׁמוֹ
  english_pob_choice: his fame spread
  chosen_korean: 그의 명성
  alternatives_korean:
  - 그의 이름
  - 그의 이름이
  lexicon: HALOT
  rationale: 히브리어의 ‘이름’이 평판/명성을 뜻하는 관용법이므로, 한국어에서는 의미를 드러내는 ‘명성’으로 옮겼습니다.
- source_word: עַד לְבוֹא מִצְרַיִם
  english_pob_choice: as far as the entrance of Egypt
  chosen_korean: 이집트의 입구까지
  alternatives_korean:
  - 이집트의 국경까지
  - 이집트에 이르기까지
  lexicon: HALOT
  rationale: ‘입구’라는 이미지가 원문의 표현을 가장 가깝게 살리며, 각주 없이도 지리적 경계/접근 지역이라는 뜻을 이해할 수 있습니다.
theological_decisions:
- issue: ‘그의 이름’ 관용을 한국어에서 어떻게 처리할지
  chosen_reading: 평판의 의미를 살려 ‘그의 명성’으로 번역했습니다.
  alternative_readings:
  - 직역하여 ‘그의 이름이’라고 옮김
  rationale: 이 구절은 신학적 쟁점보다 관용적 표현의 해석이 핵심이므로, 독자가 본문 의도를 즉시 이해하도록 의미 중심으로 처리했습니다.
  doctrine_reference: 역사서 본문의 서술 의도 유지
