  source_fidelity: 수정이 필요합니다. יְהוָה는 본문의 방침 및 영어 POB에 따라 ‘야훼’로 옮겨야 하며, צָרַעַת는 현대 의학적 나병으로 단정하지 않는 ‘피부병’과 각주 조합이 원어의 의미 범위를 더 충실히 보존합니다. מֵעַל לְמִזְבַּח הַקְּטֹרֶת의 위치 관계는 ‘분향단 곁에 있는 제사장들’로 처리하여 제사장들 앞에서 발생했다는 뜻과 분향단 인근이라는 위치를 자연스럽게 반영했습니다.
  naturalness: 합쇼체 서술로 자연스럽습니다. 두 문장으로 나누어 향로를 든 상태, 분노, 피부병의 발현이라는 사건 진행을 명료하게 했습니다.
  terminology: ‘웃시야’, ‘향로’, ‘분향’, ‘분향단’, ‘야훼’를 사용했습니다. ‘피부병’은 צָרַעַת를 현대 나병과 동일시하지 않으며, 각주가 전통적 ‘나병’ 번역 가능성과 더 넓은 의미를 안내합니다.
