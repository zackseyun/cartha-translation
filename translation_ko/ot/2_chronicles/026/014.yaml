translation:
  language: ko
  text: 웃시야는 온 군대를 위해 방패와 창과 투구와 갑옷과 활과 돌팔매돌을 준비하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌팔매돌’은 히브리어를 직역하면 ‘물매의 돌’입니다.
