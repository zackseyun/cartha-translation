  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִי֙ לִ/דְרֹ֣שׁ אֱלֹהִ֔ים בִּ/ימֵ֣י זְכַרְיָ֔הוּ הַ/מֵּבִ֖ין בִּ/רְאֹ֣ת הָ/אֱלֹהִ֑ים וּ/בִ/ימֵי֙ דָּרְשׁ֣/וֹ אֶת יְהוָ֔ה הִצְלִיח֖/וֹ הָ/אֱלֹהִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
  footnotes:
  - marker: a
    text: Or, 'who instructed in the fear of God.' The Hebrew phrase is difficult; the Masoretic Text more literally reads 'who had understanding in the visions of God.'
    reason: alternative_reading
  - marker: b
    text: Or 'and in the days when he sought the LORD'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 스가랴의 날들에 하나님을 찾는 일을 계속했습니다. 스가랴는 하나님의 환상들에 대한 이해가 있었고, 그가 야훼를 찾는 동안에는 하나님이 그를 형통하게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님을 경외하도록 가르친 자’라는 뜻입니다. 히브리어 구절은 어렵고, 마소라 본문은 더 문자적으로는 ‘하나님의 환상들 속에 이해가 있는’이라고 읽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그가 야훼를 찾던 날들 동안에’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: לִדְרֹשׁ אֱלֹהִים
  english_pob_choice: to seek God
  chosen_korean: 하나님을 찾는 일
  alternatives_korean:
  - 하나님께 묻는 일
  - 하나님을 구하는 일
  lexicon: HALOT
  rationale: 역대기에서 דרש은 단순한 정보 문의보다 언약적 의존과 경건한 추구를 가리키는 경우가 많으므로, ‘찾다’로 옮겨 그 지속적 신앙 행위를 살렸습니다.
- source_word: הַמֵּבִין בִּרְאֹת הָאֱלֹהִים
  english_pob_choice: who had understanding in the visions of God
  chosen_korean: 하나님의 환상들에 대한 이해가 있었고
  alternatives_korean:
  - 하나님의 환상들에서 분별력이 있었고
  - 하나님을 경외하도록 가르쳤고
  lexicon: HALOT
  rationale: 마소라 본문은 רְאֹת을 ‘보는 것/환상들’ 쪽으로 지시하므로, 어려운 구절을 ‘경외’로 매끈하게 바꾸지 않고 시각/계시의 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본값에 따라 신적 고유명사는 대체 호칭이 아니라 음역형 ‘야훼’로 일관되게 옮겼습니다.
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  english_pob_choice: God made him prosper
  chosen_korean: 하나님이 그를 형통하게 하셨습니다
  alternatives_korean:
  - 하나님이 그에게 성공을 주셨습니다
  - 하나님이 그를 번영하게 하셨습니다
  lexicon: HALOT
  rationale: Hiphil צלח의 원인성을 유지하면서, 한국어에서 자연스럽고 성경문체에 맞는 ‘형통하게 하다’로 옮겼습니다.
theological_decisions:
- issue: 스가랴를 설명하는 어려운 표현 בִּרְאֹת הָאֱלֹהִים의 처리
  chosen_reading: 스가랴는 하나님의 환상들과 관련된 이해를 가진 인물로 남겨 두었습니다.
  alternative_readings:
  - 하나님 경외에 대한 가르침이 있었다
  - 하나님을 경외하는 데 지혜가 있었다
  rationale: 본문의 자음과 마소라 분철은 ‘환상/보는 것’ 계열을 지지하므로, 전통적 해석으로 곧장 평탄화하지 않고 본문 난점을 드러냈습니다.
  doctrine_reference: 번역 원리 §1, §3
- issue: וּבִימֵי דָּרְשׁוֹ의 지속적/조건적 뉘앙스
  chosen_reading: ‘그가 야훼를 찾는 동안에는’로, 찾음이 형통의 조건이 되는 흐름을 살렸습니다.
  alternative_readings:
  - 그가 야훼를 찾던 때에
  - 야훼를 찾는 날들 동안
  rationale: 영어 POB가 지적하듯 이 구문은 단순한 시점 표지가 아니라 지속 상태와 그 결과를 함께 나타내므로, 한국어도 조건적 지속성을 드러내는 쪽이 적절합니다.
  doctrine_reference: 번역 원리 §1
