translation:
  language: ko
  text: 그는 야훼께서 보시기에 옳은 일을 했으며, 그의 아버지 아마샤가 한 모든 것대로 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
