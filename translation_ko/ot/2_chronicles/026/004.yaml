lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He did
  chosen_korean: 행했습니다
  alternatives_korean:
  - 했습니다
  - 행하였습니다
  lexicon: HALOT
  rationale: 서술형 wayyiqtol을 자연스러운 한국어 과거 서술로 옮겼습니다. '행했습니다'는 뒤의 도덕적 평가와 잘 어울립니다.
- source_word: הַיָּשָׁר בְּעֵינֵי
  english_pob_choice: what was right in the eyes of
  chosen_korean: 야훼 보시기에 옳은 일
  alternatives_korean:
  - 야훼 눈에 옳은 일
  - 야훼 앞에서 옳은 일
  lexicon: HALOT
  rationale: '''눈에''의 직역보다 한국어에서 자연스러운 평가 관용구인 ''보시기에 옳은 일''로 옮겨, מקור의 판단 기준을 유지했습니다.'
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 POB 기준에 따라 '야훼'로 음역했습니다. 이는 제목 '주'로 바꾸지 않고 고유한 신적 이름을 드러냅니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  english_pob_choice: according to all that ... had done
  chosen_korean: 그의 아버지 아마샤가 행한 모든 것대로
  alternatives_korean:
  - 그의 아버지 아마샤가 한 모든 것처럼
  - 그의 아버지 아마샤가 행한 그대로
  lexicon: HALOT
  rationale: '''כְּ...כֹל אֲשֶׁר''의 대응성과 전면성을 살려 ''...모든 것대로''로 옮겼습니다. 한국어에서 가장 자연스럽게 비교·모범의 의미를 전달합니다.'
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: 원문의 יְהוָה를 '야훼'로 옮기고, '주'로 대체하지 않았습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 절은 왕의 행위를 야훼의 기준 아래 평가하는 문맥이므로, 하나님의 고유한 언약 이름을 보존하는 것이 의미상 중요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
