source:
  edition: WLC
  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֻזִּיָּ֔הוּ וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣יכוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
  footnotes:
  - marker: a
    text: 'Or: ''and he was sixteen years old.'' The Hebrew conjunction can be read simply as connective rather than concessive.'
    reason: lexical_alternative
  - marker: b
    text: 'Or: ''selected Uzziah'' for ''took Uzziah''; the Hebrew verb is literally ''took'' but in context refers to the people''s action in elevating him to the throne.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다의 모든 백성이 아마지야의 뒤를 이어 왕이 되게 하려고, 열여섯 살인 웃시야를 데려다가 왕으로 세웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: took
  chosen_korean: 데려다가
  alternatives_korean:
  - 취하여
  - 받아
  - 선택하여
  lexicon: HALOT
  rationale: 직역의 ‘데리다/취하다’ 계열을 살리면서도, 즉위 문맥에서는 백성이 그를 왕위에 올리는 행위를 자연스럽게 드러낼 수 있어 ‘데려다가’로 옮겼습니다.
- source_word: כָּל עַם יְהוּדָה
  english_pob_choice: all the people of Judah
  chosen_korean: 유다의 모든 백성
  alternatives_korean:
  - 유다의 모든 사람들
  - 온 유다 백성
  lexicon: HALOT
  rationale: ‘백성’이 עַם의 집합적 의미를 잘 살리며, ‘유다의’로 속격 관계를 분명히 했습니다.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  english_pob_choice: made him king
  chosen_korean: 왕으로 세웠습니다
  alternatives_korean:
  - 왕이 되게 했습니다
  - 즉위시켰습니다
  - 왕으로 삼았습니다
  lexicon: HALOT
  rationale: מלך의 사역형은 ‘왕이 되게 하다/왕으로 세우다’가 적절하며, ‘왕으로 세웠습니다’는 한국어로 자연스럽고 의례적 뉘앙스를 과도하게 덧붙이지 않습니다.
- source_word: תַּחַת אָבִיו אֲמַצְיָהוּ
  english_pob_choice: in place of his father Amaziah
  chosen_korean: 아마지야의 뒤를 이어
  alternatives_korean:
  - 아버지 아마지야를 대신하여
  - 아마지야 대신
  - 아버지 아마지야의 자리에
  lexicon: HALOT
  rationale: 왕위 계승 문맥에서 תַּחַת은 단순한 ‘아래’가 아니라 ‘대신/뒤를 이어’의 의미이므로, 한국어에서 자연스러운 승계 표현인 ‘뒤를 이어’를 택했습니다.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  english_pob_choice: who was sixteen years old
  chosen_korean: 열여섯 살인
  alternatives_korean:
  - 열여섯 살이던
  - 열여섯 살의
  - 열여섯 살밖에 안 된
  lexicon: HALOT
  rationale: 히브리어의 나이 표시는 단순 동격이므로, 한국어에서는 간결한 관형절로 풀어 ‘열여섯 살인’으로 옮겼습니다.
