  text: וַ/יֵּצֵא֙ וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֔ים וַ/יִּפְרֹ֞ץ אֶת ח֣וֹמַת גַּ֗ת וְ/אֵת֙ חוֹמַ֣ת יַבְנֵ֔ה וְ/אֵ֖ת חוֹמַ֣ת אַשְׁדּ֑וֹד וַ/יִּבְנֶ֣ה עָרִ֔ים בְּ/אַשְׁדּ֖וֹד וּ/בַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
  footnotes:
  - marker: a
    text: Or 'breached' or 'broke down' the wall of Gath, the wall of Jabneh, and the wall of Ashdod.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in Ashdod and among the Philistines'; 'Ashdod' may refer to the city or its surrounding territory.
    reason: cultural_note
translation:
  language: ko
  text: 그가 나가서 블레셋 사람들과 싸웠으며, 가드의 성벽과 야브네의 성벽과 아스돗의 성벽을 무너뜨렸고, 아스돗의 영토와 블레셋 사람들 가운데에 성읍들을 세웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가드의 성벽과 야브네의 성벽과 아스돗의 성벽을 ‘돌파했다’ 혹은 ‘허물었다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아스돗 안에’ 또는 ‘블레셋 땅에’로도 옮길 수 있으나, 여기서는 아스돗의 권역과 블레셋 사람들의 영역을 가리키는 뜻으로 이해했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: He went out
  chosen_korean: 그가 나가서
  alternatives_korean:
  - 그가 나와서
  - 그가 출정하여
  lexicon: HALOT
  rationale: 연속 서술의 첫 동작을 자연스럽게 살리면서, 뒤따르는 전투 행위에 불필요한 군사적 뉘앙스를 덧붙이지 않기 위해 ‘나가서’로 옮겼습니다.
- source_word: וַיִּלָּחֶם בַּ/פְּלִשְׁתִּים
  english_pob_choice: fought against the Philistines
  chosen_korean: 블레셋 사람들과 싸웠으며
  alternatives_korean:
  - 블레셋 사람들을 대적하여 싸웠으며
  - 블레셋 사람들과 전쟁했으며
  lexicon: HALOT
  rationale: פְּלִשְׁתִּים은 사람 집단이므로 ‘블레셋 사람들’로 두었고, 전치사의 대립 관계는 한국어의 자연스러운 ‘~과/와 싸우다’로 표현했습니다.
- source_word: וַיִּפְרֹץ
  english_pob_choice: broke down
  chosen_korean: 무너뜨렸고
  alternatives_korean:
  - 허물었고
  - 파괴했고
  - 뚫고 나갔고
  lexicon: HALOT
  rationale: 성벽을 대상으로 한 פָּרַץ의 의미를 현대 한국어에서 가장 직접적으로 드러내는 말로 ‘무너뜨리다’를 택했습니다. ‘뚫다’는 ‘성벽을 깨뜨려 돌파하다’의 역동성은 있으나 결과를 덜 분명하게 만들 수 있습니다.
- source_word: חוֹמַת
  english_pob_choice: the wall of
  chosen_korean: 성벽
  alternatives_korean:
  - 벽
  - 성의 벽
  lexicon: HALOT
  rationale: 도시 방어시설을 가리키는 말이므로 일반적인 ‘벽’보다 ‘성벽’이 더 정확합니다. 히브리어의 단수 구성은 한국어에서도 각 도시마다 하나씩 반복해 살렸습니다.
- source_word: וַיִּבְנֶה עָרִים
  english_pob_choice: he built cities
  chosen_korean: 성읍들을 세웠고
  alternatives_korean:
  - 도시들을 세웠고
  - 도시들을 건설했고
  - 성읍들을 건축했고
  lexicon: HALOT
  rationale: עָרִים는 문맥상 정착지/거점으로서의 ‘성읍들’이 자연스럽고, בנה는 단순히 건축 행위보다 도시를 세우는 의미가 더 적절해 ‘세웠다’로 옮겼습니다.
theological_decisions:
- issue: 지명/영토 표현의 범위
  chosen_reading: ‘아스돗의 영토와 블레셋 사람들 가운데에’로 옮겨, 성읍을 실제 도시 안에 세웠다는 뜻이 아니라 그 지역과 세력권 안에 세웠다는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘아스돗 안에’
  - ‘블레셋 땅에’
  rationale: 히브리어의 전치사 사용과 영어 POB 주석이 지적하듯, 아스돗은 도시 자체보다 주변 권역까지 가리킬 수 있으므로, 장소 범위를 과도하게 축소하지 않도록 했습니다.
  doctrine_reference: 지리·역사 서술의 범위 보존
- issue: 정복 서사의 직설성
  chosen_reading: 전투와 성벽 파괴, 성읍 건설을 완곡화하지 않고 그대로 직진적으로 옮겼습니다.
  alternative_readings:
  - ‘개척했다’
  - ‘영향력을 넓혔다’
  rationale: 본문은 군사적 승리와 점령 확장을 말하므로, 그 강도를 약화시키는 해석적 완곡어를 피했습니다.
  doctrine_reference: 본문 충실성
