source:
  edition: WLC
  text: וַ/יָּבֹ֥א אַחֲרָ֖י/ו עֲזַרְיָ֣הוּ הַ/כֹּהֵ֑ן וְ/עִמּ֞/וֹ כֹּהֲנִ֧ים לַ/יהוָ֛ה שְׁמוֹנִ֖ים בְּנֵי חָֽיִל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
  footnotes:
  - marker: a
    text: Or 'men of valor.' The Hebrew idiom בְּנֵי חָיִל can denote men marked by strength, courage, or valor.
    reason: lexical_alternative
translation:
  language: ko
  text: 아사랴 제사장이 그 뒤로 들어갔고, 그와 함께 여호와의 제사장 팔십 명이 있었는데, 그들은 용맹한 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘용맹한 사람들’입니다. 히브리어 관용구 בְּנֵי חָיִל은 힘, 용기, 용맹을 지닌 사람들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  english_pob_choice: went in after him
  chosen_korean: 그 뒤로 들어갔고
  alternatives_korean:
  - 그 뒤를 따라 들어갔고
  - 그 뒤에 들어갔고
  lexicon: HALOT
  rationale: 동사는 단순한 ‘오다’보다 문맥상 성소 안으로 진입하는 움직임을 드러내며, אַחֲרָיו는 시간적 ‘뒤에’보다 실제 추적·추종의 뉘앙스가 있어 자연스러운 합쇼체로 옮겼습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 그 제사장
  lexicon: HALOT
  rationale: 아사랴의 직분을 지칭하는 단수 정관사 표현이므로, 한국어에서는 군더더기 없이 ‘제사장’으로 처리했습니다.
- source_word: כֹּהֲנִים לַיהוָה
  english_pob_choice: priests of Yahweh
  chosen_korean: 여호와의 제사장
  alternatives_korean:
  - 여호와께 속한 제사장
  - 여호와를 섬기는 제사장
  lexicon: HALOT
  rationale: לַיהוָה는 소속·전속 관계를 나타내므로 ‘여호와의’가 가장 सीधे하고, 본문이 제사장들의 신분을 강조하므로 관계를 분명히 했습니다.
- source_word: בְּנֵי חָיִל
  english_pob_choice: valiant men
  chosen_korean: 용맹한 사람들이었습니다
  alternatives_korean:
  - 용사들이었습니다
  - 용맹한 남자들이었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 힘·용기·담대함을 아우르며, 이 절에서는 제사장들의 결연한 태도를 묘사하므로 ‘용맹한 사람들’이 문맥상 자연스럽습니다.
theological_decisions:
- issue: בְּנֵי חָיִל의 성별이 드러나는 방식
  chosen_reading: ‘용맹한 사람들’로 옮기되, 문맥상 남성 제사장 집단임을 한국어 본문에서는 과도하게 강조하지 않았습니다.
  alternative_readings:
  - 용맹한 남자들
  - 용사들
  rationale: 히브리어는 남성형 복수이지만 한국어에서는 직업·집단 명사가 이미 남성 집단으로 충분히 이해될 수 있으므로, 본문 흐름을 해치지 않는 범위에서 과잉 성별화를 피했습니다.
  doctrine_reference: 'POB translation philosophy: source-accurate yet natural Korean; gender morphology is preserved where it adds meaning, not by forcing awkwardness.'
