translation:
  language: ko
  text: 웃시야는 예루살렘에 망대들을 세웠습니다. 곧 모퉁이문, 골짜기문, 그리고 각진 곳에 세웠으며, 그것들을 견고하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘각진 곳’은 히브리어의 뜻이 ‘각, 모퉁이, 꺾이는 지점’인 낱말을 반영한 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: built
  chosen_korean: 세웠습니다
  alternatives_korean:
