  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
  footnotes:
  - marker: a
    text: Or 'the corner' for 'the Angle'; the Hebrew term denotes an angle, corner, or turning point in the fortification.
