  lexicon: BDB/HALOT
  rationale: 직전의 ‘모퉁이문’과 중복되는 단순 ‘모퉁이’보다, 성벽의 꺾임이나 각을 가리키는 지형·구조적 의미를 살린 ‘각진 곳’이 원문의 구분을 더 잘 드러냅니다.
- source_word: וַיְחַזְּקֵם
