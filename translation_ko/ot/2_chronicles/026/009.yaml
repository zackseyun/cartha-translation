  lexicon: BDB/HALOT
  rationale: 문맥이 성읍 방어 시설이므로 ‘탑’보다 군사·방어적 기능을 살리는 ‘망대’가 자연스럽습니다.
- source_word: שַׁעַר הַפִּנָּה
  english_pob_choice: the Corner Gate
  chosen_korean: 모퉁이문
