  lexicon: BDB/HALOT
  rationale: 문 이름의 합성어를 한국어 성경 문체에 맞게 붙여 ‘모퉁이문’으로 옮기면 고유 지명성을 유지하면서도 간결합니다.
- source_word: הַמִּקְצוֹעַ
  english_pob_choice: the Angle
  chosen_korean: 각진 곳
  alternatives_korean:
