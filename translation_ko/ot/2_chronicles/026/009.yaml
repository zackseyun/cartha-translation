  - 건축했습니다
  lexicon: BDB/HALOT
  rationale: מִגְדָּלִים은 성벽 방어 시설인 ‘망대들’이므로, 일반적 ‘짓다’보다 방어 구조물을 세운다는 뜻이 드러나는 ‘세웠습니다’가 적절합니다.
- source_word: מִגְדָּלִים
