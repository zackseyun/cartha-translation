base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
  footnotes:
  - marker: a
    text: Or 'the corner' for 'the Angle'; the Hebrew term denotes an angle, corner, or turning point in the fortification.
    reason: lexical_alternative
translation:
  language: ko
  text: 웃시야는 예루살렘의 모퉁이문과 골짜기문과 성벽의 꺾이는 곳에 망대들을 세우고, 그것들을 견고하게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모퉁이’. 히브리어 낱말은 성벽이나 요새의 각, 모퉁이, 또는 꺾이는 지점을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: built
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 지었습니다
  - 건축했습니다
  lexicon: BDB/HALOT
  rationale: מִגְדָּלִים은 성벽 방어 시설인 ‘망대들’이므로, 일반적 ‘짓다’보다 방어 구조물을 세운다는 뜻이 드러나는 ‘세웠습니다’가 적절합니다.
- source_word: מִגְדָּלִים
  english_pob_choice: towers
  chosen_korean: 망대들을
  alternatives_korean:
  - 탑들을
  - 요새들을
  lexicon: BDB/HALOT
  rationale: 문맥이 성읍 방어 시설이므로 ‘탑’보다 군사·방어적 기능을 살리는 ‘망대’가 자연스럽습니다.
- source_word: שַׁעַר הַפִּנָּה
  english_pob_choice: the Corner Gate
  chosen_korean: 모퉁이문
  alternatives_korean:
  - 모퉁이 성문
  - 코너문
  lexicon: BDB/HALOT
  rationale: 문 이름의 합성어를 한국어 성경 문체에 맞게 붙여 ‘모퉁이문’으로 옮기면 고유 지명성을 유지하면서도 간결합니다.
- source_word: הַמִּקְצוֹעַ
  english_pob_choice: the Angle
  chosen_korean: 각진 곳
  alternatives_korean:
  - 모퉁이
  - 꺾인 곳
  - 각
  lexicon: BDB/HALOT
  rationale: 직전의 ‘모퉁이문’과 중복되는 단순 ‘모퉁이’보다, 성벽의 꺾임이나 각을 가리키는 지형·구조적 의미를 살린 ‘각진 곳’이 원문의 구분을 더 잘 드러냅니다.
- source_word: וַיְחַזְּקֵם
  english_pob_choice: and he fortified them
  chosen_korean: 그것들을 견고하게 했습니다
  alternatives_korean:
  - 그것들을 강화했습니다
  - 그것들을 굳게 했습니다
  lexicon: BDB/HALOT
  rationale: חזק의 피엘은 여기서 방어 시설을 ‘견고하게 하다/보강하다’는 뜻이므로, 일반적 ‘강화하다’보다 구조물의 보강을 드러내는 표현이 적합합니다.
theological_decisions:
- issue: 성읍 방어 시설을 설명하는 동사의 뉘앙스
  chosen_reading: 웃시야의 행동을 단순한 건축이 아니라 예루살렘 방어 체계의 보강으로 읽었습니다.
  alternative_readings:
  - 일반적인 건축 행위로만 읽기
  - 군사적 요새화로만 좁혀 읽기
  rationale: 본문은 망대, 성문, 각진 곳을 연결해 말하므로 단순 건축보다 성벽 방어의 강화라는 맥락이 분명합니다.
  doctrine_reference: 역사서의 서술 맥락과 עיר/성읍 방어 표현
