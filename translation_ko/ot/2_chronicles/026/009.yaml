  lexicon: BDB/HALOT
  rationale: חזק의 피엘은 여기서 방어 시설을 ‘견고하게 하다/보강하다’는 뜻이므로, 일반적 ‘강화하다’보다 구조물의 보강을 드러내는 표현이 적합합니다.
theological_decisions:
- issue: 성읍 방어 시설을 설명하는 동사의 뉘앙스
  chosen_reading: 웃시야의 행동을 단순한 건축이 아니라 예루살렘 방어 체계의 보강으로 읽었습니다.
  alternative_readings:
  - 일반적인 건축 행위로만 읽기
  - 군사적 요새화로만 좁혀 읽기
  rationale: 본문은 망대, 성문, 각진 곳을 연결해 말하므로 단순 건축보다 성벽 방어의 강화라는 맥락이 분명합니다.
  doctrine_reference: 역사서의 서술 맥락과 עיר/성읍 방어 표현
