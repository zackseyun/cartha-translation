reference: 2 Chronicles 26:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעְזְרֵ֨/הוּ הָֽ/אֱלֹהִ֜ים עַל פְּלִשְׁתִּ֧ים וְ/עַל ה/ערביים הַ/יֹּשְׁבִ֥ים בְּ/גוּר בָּ֖עַל וְ/הַ/מְּעוּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
  footnotes:
  - marker: a
    text: Or 'the Maonites.' The Hebrew ethnonym may reflect a related or variant group name.
    reason: alternative_reading
translation:
  language: ko
  text: 하나님께서는 블레셋 사람들과 구르바알에 사는 아라비아 사람들과 메우님 사람들[a]을 대적하는 데 그를 도우셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마오니 사람들’로 옮길 수 있습니다. 히브리어 민족명은 관련된 집단명이나 이형(異形)을 반영할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  english_pob_choice: helped him
  chosen_korean: 그를 도우셨습니다
  alternatives_korean:
  - 그에게 도움을 주셨습니다
  - 그를 거들어 주셨습니다
  lexicon: HALOT
  rationale: עזר의 서술형 과거는 ‘돕다’가 가장 직접적이며, 하나님이 주체적으로 우시아를 지원하셨다는 점을 간명하게 드러냅니다.
- source_word: פְּלִשְׁתִּים
  english_pob_choice: the Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
  - 블레셋인들
  - 블레셋 족속
  lexicon: HALOT
  rationale: 고대 민족명은 한국어 성경에서 널리 쓰이는 ‘블레셋 사람들’이 자연스럽고, 사람 집단으로서의 의미도 잘 살립니다.
- source_word: הָעַרְבִים
  english_pob_choice: the Arabians
  chosen_korean: 아라비아 사람들
  alternatives_korean:
  - 아라비아인들
  - 아랍 사람들
  lexicon: HALOT
  rationale: 본문의 고대 민족/집단명을 현대 정치적 함의가 강한 ‘아랍 사람들’보다 ‘아라비아 사람들’로 옮겨 역사적 거리감을 유지했습니다.
- source_word: בְּגוּר בָּעַל
  english_pob_choice: in Gur-baal
  chosen_korean: 그랄 바알에
  alternatives_korean:
  - 그르 바알에
  - 구르 바알에
  lexicon: HALOT
  rationale: 지명은 음역하되, 한국어 음운에 맞춰 ‘그랄 바알’로 옮겨 지명임을 드러냈습니다.
- source_word: הַמְּעוּנִים
  english_pob_choice: the Meunites
  chosen_korean: 메우님 사람들
  alternatives_korean:
  - 메우님족
  - 마오니 사람들
  lexicon: HALOT
  rationale: 히브리어 자음형 מעונים을 따라 ‘메우님’으로 음역하고, 집단성을 살리기 위해 ‘사람들’을 붙였습니다. 영어 주석이 제시한 대안 독법은 각주로 보존했습니다.
theological_decisions:
- issue: 하나님 주어의 직접성
  chosen_reading: ‘하나님께서 … 도우셨습니다’로 번역해, 전쟁/대적의 맥락에서 하나님의 능동적 개입을 분명히 했습니다.
  alternative_readings:
  - ‘하나님이 … 도와주셨습니다’
  - ‘하나님께서 … 도움을 주셨습니다’
  rationale: 히브리어 서술은 하나님이 실제로 개입해 돕는다는 역사 서술이므로, 우회적 표현보다 직접적 표현이 본문의 힘을 잘 전달합니다.
  doctrine_reference: 섭리와 하나님의 역사적 개입
- issue: 대적 관계의 방향
  chosen_reading: ‘대적하여’로 옮겨 עַל의 군사적 대립 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘~에 대하여’
  - ‘~을 향해’
  rationale: 문맥상 단순한 ‘관하여’가 아니라 적대 관계 속에서의 도움을 뜻하므로, 본문의 전투적 상황을 드러내는 표현이 필요합니다.
  doctrine_reference: 역사서의 전쟁 서술
