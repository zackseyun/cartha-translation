  source_fidelity: 하나님이 우시야를 블레셋 사람들, 구르바알에 거주하는 아라비아 사람들, 메우님 사람들을 상대로 돕셨다는 기본 의미는 반영합니다. 다만 지명 בְּגוּר בָּעַל은 ‘그랄 바알’이 아니라 ‘구르바알’로 음역하는 것이 안전하며, 대적 관계는 ‘대적하는 데 그를 도우셨습니다’로 표현하면 수식 관계가 분명해집니다.
