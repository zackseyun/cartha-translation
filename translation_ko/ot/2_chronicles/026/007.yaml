revisions:
- from: 하나님께서 블레셋 사람들[a]과 곧 그랄 바알에 살던 아라비아 사람들과 메우님 사람들을 대적하여 그를 도우셨습니다.
  to: 하나님께서는 블레셋 사람들과 구르바알에 사는 아라비아 사람들과 메우님 사람들[a]을 대적하는 데 그를 도우셨습니다.
  rationale: 지명은 원어 형태에 따라 ‘구르바알’로 바로잡고, 세 대상을 병렬로 제시했습니다. ‘대적하는 데 그를 도우셨습니다’는 하나님이 그를 이 집단들에 맞서도록 도우셨다는 עזר와 עַל의 관계를 자연스럽고 정확하게 나타냅니다. 메우님에만 해당하는 대안 명칭 각주도 올바른 단어에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:59Z'
