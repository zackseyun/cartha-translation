base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/022.yaml
  text: Now the rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
  footnotes:
  - marker: a
    text: Or, more literally, 'the words of Uzziah, the first and the last.' Here 'words' is a Hebrew annal-style expression meaning the events or acts of his reign.
    reason: lexical_alternative
translation:
  language: ko
  text: 웃시야의 남은 행적, 곧 처음부터 끝까지의 기록은 아모스의 아들 이사야 선지자가 기록했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘웃시야의 말들, 곧 처음과 마지막’입니다. 여기서 ‘말들’은 히브리어 연대기식 표현으로, 그의 통치에서 일어난 사건과 행적을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: the rest of the acts of
  chosen_korean: 남은 행적
  alternatives_korean:
  - 남은 말들
  - 남은 사건들
  - 그 밖의 행적
  lexicon: HALOT
  rationale: 왕의 연대기 공식에서 דִּבְרֵי는 문자적으로 ‘말’이 아니라 통치의 사건·행적을 가리키므로, 한국어로는 역사기록체에 자연스러운 ‘행적’이 가장 가깝습니다.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  english_pob_choice: first and last
  chosen_korean: 처음부터 끝까지
  alternatives_korean:
  - 처음과 마지막
  - 전부
  - 시초와 종말
  lexicon: HALOT
  rationale: 이 쌍은 전체 범위를 뜻하는 관용구이므로, 시간의 전 구간을 드러내는 ‘처음부터 끝까지’로 옮기는 것이 가장 자연스럽습니다.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  english_pob_choice: Isaiah son of Amoz the prophet
  chosen_korean: 아모스의 아들 이사야 선지자
  alternatives_korean:
  - 아모스의 아들 이사야 예언자
  - 아모스의 아들 이사야
  - 선지자 이사야 아모스의 아들
  lexicon: HALOT
  rationale: יִשַׁעְיָהוּ는 이사야로, בֶן אָמוֹץ는 소속을 밝히는 부칭이므로 순서를 한국어 어순에 맞추어 배치했고, הַנָּבִיא는 직함으로서 ‘선지자’로 옮겼습니다.
theological_decisions:
- issue: 연대기 공식의 의미 범위
  chosen_reading: 이 구절은 단순한 문서 제목이 아니라 웃시야 통치 전반의 역사 기록을 가리키는 것으로 읽었습니다.
  alternative_readings:
  - 문자적으로 ‘말들’로만 읽기
  - 왕의 개인 발언록으로 읽기
  rationale: Chronicles의 왕 결산 공식에서 דִּבְרֵי는 재위의 사건·행적을 뜻하는 관용적 표현이므로, 역사서 맥락을 따라 ‘행적’으로 번역하는 것이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
