  text: וַ/יְהִי֩ עֻזִּיָּ֨הוּ הַ/מֶּ֜לֶךְ מְצֹרָ֣ע עַד י֣וֹם מוֹת֗/וֹ וַ/יֵּ֜שֶׁב בֵּ֤ית ה/חפשות מְצֹרָ֔ע כִּ֥י נִגְזַ֖ר מִ/בֵּ֣ית יְהוָ֑ה וְ/יוֹתָ֤ם בְּנ/וֹ֙ עַל בֵּ֣ית הַ/מֶּ֔לֶךְ שׁוֹפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
  footnotes:
  - marker: a
    text: Or 'the house of freedom'; the Hebrew expression likely refers to a dwelling where Uzziah lived in separation because of his condition.
    reason: lexical_alternative
  - marker: b
    text: Or 'he was excluded from the house of the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 웃시야 왕은 죽는 날까지 나병환자였고[a], 나병환자로서 별도의 집에 살았습니다. 그는 야훼의 집에서 끊어졌기 때문입니다. 그의 아들 요담이 왕의 집을 맡아, 그 땅의 백성을 다스렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자유의 집’. 히브리어 표현은 그가 자신의 상태 때문에 분리된 거처에 살았음을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 야훼의 집에서 제외되었습니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: מְצֹרָע
  english_pob_choice: leprous
  chosen_korean: 나병환자
  alternatives_korean:
  - 피부병에 걸린 사람
  - 피부병으로 부정한 사람
  lexicon: HALOT
  rationale: POB의 ‘leprous’를 한국어로는 관용적으로 ‘나병환자’로 옮기되, 성경적 צרעת의 범위가 현대 의학적 나병보다 넓다는 점은 해석 여지를 남겼습니다.
- source_word: בֵּית הַחפשות
  english_pob_choice: a separate house
  chosen_korean: 별도의 집
  alternatives_korean:
  - 분리된 집
  - 격리된 집
  - 자유의 집
  lexicon: HALOT
  rationale: 문맥상 왕실과 성전 생활에서 분리된 거처라는 기능적 의미가 핵심이므로, 난해한 직역보다 ‘별도의 집’이 의미를 가장 분명하게 전달합니다.
- source_word: נִגְזַר מִבֵּית יְהוָה
  english_pob_choice: he was cut off from the house of Yahweh
  chosen_korean: 야훼의 집에서 끊어졌기 때문입니다
  alternatives_korean:
  - 야훼의 집에서 제외되었기 때문입니다
  - 야훼의 집에서 분리되었기 때문입니다
  lexicon: HALOT
  rationale: נִגְזַר의 ‘잘려 나가다/끊어지다’라는 강한 단절감을 살려 ‘끊어졌습니다’로 옮겼습니다.
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  english_pob_choice: judging the people of the land
  chosen_korean: 그 땅의 백성을 다스렸습니다
  alternatives_korean:
  - 그 땅의 백성을 বিচার했습니다
  - 그 땅의 백성에게 न्याय를 시행했습니다
  lexicon: HALOT
  rationale: שׁוֹפֵט는 여기서 단순 재판 행위보다 통치·행정적 직무를 포함하므로, 한국어는 ‘다스리다’로 풀어 의미를 자연스럽게 전달했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨, 본문의 성전-언약적 대조를 보존했습니다.
theological_decisions:
- issue: וַיֵּשֶׁב בֵּית הַחפשות의 해석
  chosen_reading: 웃시야가 나병으로 인해 분리된 거처에 살았다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘자유의 집’이라는 문자적 의미로 읽는 해석
  - 정확한 장소명으로 보는 해석
  rationale: 문맥과 POB 주석이 이 표현을 분리된 거처로 설명하므로, 장소명보다 상태와 사회적 분리를 드러내는 읽기가 본문 의도에 더 가깝습니다.
  doctrine_reference: Historico-grammatical reading; OT narrative context
- issue: 왕의 집을 맡은 요담의 직무
  chosen_reading: ‘왕의 집’은 왕실 가정/궁정의 관리 책임을 가리키는 것으로 번역했습니다.
  alternative_readings:
  - 왕궁 전체의 통치
  - 왕의 가문을 돌봄
  rationale: 히브리어 관용을 과잉 확대하지 않고, 요담의 대리 통치 기능을 한국어로 자연스럽게 드러내기 위한 선택입니다.
  doctrine_reference: Lexical-syntactic contextual reading
