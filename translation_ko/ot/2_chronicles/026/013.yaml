id: 2CH.26.13
reference: 2 Chronicles 26:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַל יָדָ/ם֩ חֵ֨יל צָבָ֜א שְׁלֹ֧שׁ מֵא֣וֹת אֶ֗לֶף וְ/שִׁבְעַ֤ת אֲלָפִים֙ וַ/חֲמֵ֣שׁ מֵא֔וֹת עוֹשֵׂ֥י מִלְחָמָ֖ה בְּ/כֹ֣חַ חָ֑יִל לַ/עְזֹ֥ר לַ/מֶּ֖לֶךְ עַל הָ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/013.yaml
  text: Under their command was an army of 307,500[a], making war with mighty power, to help the king against the enemy.
  footnotes:
  - marker: a
    text: Or, more formally, 'By their hand was an army force of 307,500, doers of war.' The main text renders the Hebrew military idioms in natural English.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 지휘 아래에는 30만 7,500명의 군대가 있었는데, 그들은 용맹한 힘으로 싸워 왕을 도와 적에 맞섰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל יָדָם
  english_pob_choice: Under their command
  chosen_korean: 그들의 지휘 아래에는
  alternatives_korean:
  - 그들의 손 아래에는
  - 그들의 통솔 아래에는
  lexicon: HALOT
  rationale: 문맥상 עַל יָד + 대명사 접미사는 문자적 ‘손’이 아니라 감독·권한 아래 있음을 뜻하므로, 군사 행정 문맥에 맞게 ‘지휘 아래’로 옮겼습니다.
- source_word: חֵיל צָבָא
  english_pob_choice: an army
  chosen_korean: 군대
  alternatives_korean:
  - 군사력
  - 전군
  - 군사
  lexicon: HALOT
  rationale: 두 명사의 결합은 군사 집단을 가리키므로, 한국어에서는 자연스럽게 ‘군대’로 간명하게 처리했습니다.
- source_word: עוֹשֵׂי מִלְחָמָה
  english_pob_choice: making war
  chosen_korean: 싸워
  alternatives_korean:
  - 전쟁하는
  - 전투를 벌이는
  - 싸움을 하는
  lexicon: HALOT
  rationale: 직역하면 ‘전쟁을 하는 자들’이지만, 병력 편성의 맥락에서는 실제 전투 가능성과 군사적 준비를 함께 드러내는 동사형 표현이 자연스럽습니다.
- source_word: בְּכֹחַ חָיִל
  english_pob_choice: with mighty power
  chosen_korean: 용맹한 힘으로
  alternatives_korean:
  - 강한 힘으로
  - 막강한 힘으로
  - 용사다운 힘으로
  lexicon: HALOT
  rationale: כֹחַ와 חָיִל의 중첩된 역량 강조를 한국어에서 한 덩어리로 살리기 위해 ‘용맹한 힘’으로 옮겼습니다.
theological_decisions:
- issue: 마지막 목적절의 전쟁 지향성
  chosen_reading: ‘적에 맞섰습니다’로 옮겨, 왕을 돕는 행위가 단순 보조가 아니라 적대 세력에 대한 군사적 대응임을 분명히 했습니다.
  alternative_readings:
  - ‘적을 대적하기 위해’
  - ‘원수를 향해’
  rationale: 히브리어 עַל הָאוֹיֵב는 군사적 대립 관계를 나타내므로, 본문의 긴장을 약화시키지 않도록 명시적으로 표현했습니다.
  doctrine_reference: 본문의 역사 서술에 대한 직역·맥락 보존 원칙
