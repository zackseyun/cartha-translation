- from: 그는 광야에 망대들을 세우고 많은 물웅덩이를 팠습니다[a]. 그에게는 가축이 많았기 때문입니다. 또한 낮은 지대와 평원에는 농부들과 포도원을 가꾸는 사람들이 있었고, 산지와 비옥한 땅[b][c]에도 그러했습니다. 그는 땅을 사랑했기 때문입니다.
