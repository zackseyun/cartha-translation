language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֨בֶן מִגְדָּלִ֜ים בַּ/מִּדְבָּ֗ר וַ/יַּחְצֹב֙ בֹּר֣וֹת רַבִּ֔ים כִּ֤י מִקְנֶה רַּב֙ הָ֣יָה ל֔/וֹ וּ/בַ/שְּׁפֵלָ֖ה וּ/בַ/מִּישׁ֑וֹר אִכָּרִ֣ים וְ/כֹֽרְמִ֗ים בֶּ/הָרִים֙ וּ/בַ/כַּרְמֶ֔ל כִּֽי אֹהֵ֥ב אֲדָמָ֖ה הָיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
  footnotes:
  - marker: a
    text: Or 'watchtowers' for 'towers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the Shephelah' for 'the lowland,' the Judean foothill region.
    reason: cultural_note
  - marker: c
    text: Or 'in Carmel' if taken as a place name rather than 'in the fertile land.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 광야에 망대들을 세우고 많은 물웅덩이를 팠습니다[a]. 그에게는 가축이 많았기 때문입니다. 또한 낮은 지대와 평원에는 농부들과 포도원을 가꾸는 사람들이 있었고, 산지와 비옥한 땅[b][c]에도 그러했습니다. 그는 땅을 사랑했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘망대들’ 또는 ‘감시탑들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘쉐펠라’, 곧 유다의 저지대 지역일 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 고유지명 ‘갈멜’로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  english_pob_choice: towers
  chosen_korean: 망대들
  alternatives_korean:
  - 탑들
  - 감시탑들
  lexicon: HALOT
  rationale: 일반적인 ‘탑’보다, 광야에 세운 구조물이라는 맥락을 살려 방어·감시 기능을 내포할 수 있는 ‘망대들’로 옮겼습니다. 다만 원문이 감시 기능을 명시하지는 않으므로 과도한 특정화는 피했습니다.
- source_word: בֹּרוֹת
  english_pob_choice: cisterns
  chosen_korean: 물웅덩이
  alternatives_korean:
  - 저수통
  - 우물
  lexicon: HALOT
  rationale: 가축을 위한 물 저장 시설이라는 점은 살리되, 석굴형 저장소라는 기술적 느낌을 한국어 일반 독자가 바로 이해하기 쉽게 ‘물웅덩이’로 풀어 옮겼습니다.
- source_word: שְׁפֵלָה
  english_pob_choice: the lowland
  chosen_korean: 낮은 지대
  alternatives_korean:
  - 저지대
  - 쉐펠라
  lexicon: HALOT
  rationale: 유다의 지리적 구역이지만 본문은 농업 배치를 말하므로, 지명 음역보다 의미를 드러내는 ‘낮은 지대’를 택했습니다.
- source_word: כֹרְמִים
  english_pob_choice: vinedressers
  chosen_korean: 포도원을 가꾸는 사람들
  alternatives_korean:
  - 포도 재배자들
  - 포도원 농부들
  lexicon: HALOT
  rationale: ‘포도원에서 일하는 사람들’이라는 직무를 자연스러운 현대 한국어로 풀어, 농부들과의 병렬을 유지했습니다.
- source_word: בַּכַּרְמֶל
  english_pob_choice: in the fertile land
  chosen_korean: 비옥한 땅
  alternatives_korean:
  - 갈멜
  - 기름진 땅
  lexicon: HALOT
  rationale: 여기서는 고유명사 ‘갈멜’보다 일반명사 ‘비옥한 땅’이 문맥상 더 적합하다는 POB의 판정을 따랐습니다.
theological_decisions:
- issue: אֹהֵב אֲדָמָה의 정서와 농경 이미지
  chosen_reading: ‘그는 땅을 사랑했기 때문입니다’로 직역에 가깝게 유지해, 단순한 농사 취미가 아니라 토지와 경작에 대한 실제 애정을 드러냈습니다.
  alternative_readings:
  - 그는 농사를 좋아했기 때문입니다
  - 그는 땅을 좋아했기 때문입니다
  rationale: 문맥은 그의 치세가 농경 기반의 경제·토지 관리에 깊이 연결되어 있음을 보여 주므로, 추상화된 ‘농사’보다 ‘땅’ 자체를 사랑했다는 표현이 원문 의미를 더 잘 보존합니다.
  doctrine_reference: 본문의 역사서술적 성격에 따른 의미 보존
