  lexicon: HALOT
  rationale: חַיִל은 여기서 군사력을 가리키며, עֹשֵׂה מִלְחָמָה는 전쟁 수행에 적합하다는 뜻이므로 ‘전쟁에 알맞은’으로 자연스럽게 살렸습니다.
- source_word: יוֹצְאֵי צָבָא לִגְדוּד
  english_pob_choice: going out to battle by divisions
  chosen_korean: 분대별로 나가 싸웠으며
  alternatives_korean:
  - 부대별로 전쟁하러 나갔으며
  - 군대로 편성되어 나갔으며
  - 분견대로 출정했으며
  lexicon: HALOT
  rationale: יוֹצְאֵי צָבָא는 군역에 나가는 자들을, לִגְדוּד는 편성된 군사 단위를 가리키므로 ‘분대별로 나가 싸웠으며’로 압축해 표현했습니다.
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  english_pob_choice: according to the number of their enrollment
  chosen_korean: 등록된 수대로
  alternatives_korean:
  - 소집된 수대로
  - 점호된 수대로
  - 편성된 수대로
  lexicon: HALOT
  rationale: פְּקֻדָּה는 공식적인 계수·등록·소집을 뜻하므로, 병력의 행정적 집계를 드러내는 ‘등록된 수’로 옮겼습니다.
- source_word: יעואל הַסּוֹפֵר
  english_pob_choice: Jeiel the scribe
  chosen_korean: 여우엘 서기관
  alternatives_korean:
  - 예우엘 서기관
  - 예이엘 서기관
  - 여이엘 서기관
  lexicon: source tradition
  rationale: 히브리어 철자 יעואל을 반영해 영어 전승의 Jeiel과 대응시키되, 표기상 변이 가능성을 남겨 ‘여우엘’로 음역했습니다.
theological_decisions:
- issue: מִשָּׂרֵי הַמֶּלֶךְ의 위계 표현
  chosen_reading: 왕의 지휘관들 가운데 한 사람인 하나냐의 권한 아래
  alternative_readings:
  - 왕의 고관들 가운데 한 사람인 하나냐 아래
  - 왕의 지휘관들 중 하나인 하나냐의 감독 아래
  rationale: שָׂר는 이 문맥에서 군사 지휘관의 뜻이 강하므로, 단순한 ‘관리’보다 위계와 통솔을 분명히 하는 ‘지휘관’으로 옮겼습니다.
  doctrine_reference: 역대하 26:11의 군사 조직과 왕권 아래의 질서 구조
