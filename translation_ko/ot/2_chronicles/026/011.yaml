  - severity: low
    issue: 각주 a의 대안 표현
    rationale: ‘그들의 소집된 수대로’는 수식 관계가 다소 어색합니다. ‘그들의 소집 명부에 기록된 수에 따라’라고 하면 פְּקֻדָּה의 공식 계수·등록의 뉘앙스가 더 분명합니다.
  revised_text: 웃시야에게는 전쟁을 수행하는 군대가 있었는데[a], 그들은 등록된 수에 따라 부대별로 출정하였습니다. 이들은 여우엘 서기관과 마아세야 관리의 지휘 아래 있었고, 왕의 지휘관들 가운데 한 사람인 하나냐의 감독 아래 있었습니다.
