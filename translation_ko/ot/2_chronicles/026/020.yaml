source:
  edition: WLC
  text: וַ/יִּ֣פֶן אֵלָ֡י/ו עֲזַרְיָהוּ֩ כֹהֵ֨ן הָ/רֹ֜אשׁ וְ/כָל הַ/כֹּהֲנִ֗ים וְ/הִנֵּה ה֤וּא מְצֹרָע֙ בְּ/מִצְח֔/וֹ וַ/יַּבְהִל֖וּ/הוּ מִ/שָּׁ֑ם וְ/גַם הוּא֙ נִדְחַ֣ף לָ/צֵ֔את כִּ֥י נִגְּע֖/וֹ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
  footnotes:
  - marker: a
    text: Or, 'they drove him out from there.' The Hebrew verb can convey urgent removal, with either the priests' forceful action or the haste of the moment in view.
    reason: lexical_alternative
  - marker: b
    text: Or, 'he was driven to go out.' The Hebrew may emphasize that he was impelled outward, though in context it likely means that he himself hurried out.
    reason: lexical_alternative
  - marker: c
    text: '''Leprous'' renders a Hebrew term used in priestly impurity laws for a serious skin affliction; it does not necessarily correspond exactly to modern medical leprosy.'
    reason: cultural_note
translation:
  language: ko
  text: 수석 제사장 아사랴와 모든 제사장들이 그를 향해 몸을 돌려 보니, 그의 이마에 나병이 생긴 것을 보았습니다.[c] 그래서 그들은 그를 급히 그곳에서 내보냈고[a], 그 자신도 나가려고 서둘렀습니다.[b] 야훼께서 그를 치셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘급히 … 내보냈고’는 히브리어 동사가 지닌 긴급한 퇴거 조치의 뜻을 옮긴 것입니다. ‘그곳에서 몰아냈다’로 번역할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나가려고 서둘렀습니다’는 히브리어의 ‘밀려 나가다, 재촉받아 나가다’라는 뉘앙스를 문맥에 따라 옮긴 것입니다. 그가 외부의 압박을 받아 나가게 되었다는 뜻도 가능하지만, 문맥상 그 자신도 급히 나가려 한 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘나병’은 히브리어 정결법에서 심각한 피부 질환을 가리키는 용어입니다. 이것이 현대 의학에서 말하는 나병과 정확히 일치한다고 단정할 수는 없습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  english_pob_choice: turned toward him
  chosen_korean: 그를 향하여 돌이켰는데
  alternatives_korean:
  - 그를 향해 돌아보았는데
  - 그를 향하여 몸을 돌렸는데
  lexicon: HALOT
  rationale: פנה의 공간적·서술적 움직임을 살려, 단순한 시선 이동보다 ‘향하여 돌이키다’로 옮겼습니다.
- source_word: כֹהֵן הָרֹאשׁ
  english_pob_choice: chief priest
  chosen_korean: 제사장장
  alternatives_korean:
  - 대제사장
  - 수석 제사장
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘머리/우두머리 제사장’을 뜻하므로, 한국어에서 직책감을 살리되 후대의 고정 용어를 과하게 끌어오지 않는 표현을 택했습니다.
- source_word: מְצֹרָע
  english_pob_choice: leprous
  chosen_korean: 나병 환자가 되어 있었습니다
  alternatives_korean:
  - 문둥병에 걸려 있었습니다
  - 피부병에 걸려 있었습니다
  lexicon: HALOT
  rationale: 의례적 부정과 심각한 피부 질환을 가리키는 본문의 관용적 표현을 따라, 전통적으로도 알아보기 쉬운 ‘나병 환자’로 옮겼습니다.
- source_word: וַיַּבְהִלֻהוּ / נִדְחַף לָצֵאת
  english_pob_choice: they hurried him out of there / he himself also hastened to go out
  chosen_korean: 그들은 그를 서둘러 그곳에서 내보냈고, 그도 몸을 돌려 나가려고 서둘렀습니다
  alternatives_korean:
  - 그들은 그를 그곳에서 급히 몰아냈고, 그도 급히 나갔습니다
  - 그들은 그를 서둘러 내보냈고, 그도 억지로 나가게 되었습니다
  lexicon: HALOT
  rationale: 두 동사의 긴급성과 결과를 함께 살리되, 외적 강제와 자기 주도의 서두름 사이의 긴장을 그대로 두었습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 번역상의 대체 호칭이 아니라 고유 이름으로 처리해야 하므로, 프로젝트 기본값인 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 신성한 이름 יְהוָה의 처리
  chosen_reading: ‘야훼’로 직역하여 하나님의 고유 이름을 드러냅니다.
  alternative_readings:
  - ‘주’로 대체
  - 전통적 음역 ‘여호와’ 사용
  rationale: 본문은 제목이 아니라 언약적 고유명을 직접 사용하므로, 대체 호칭보다 이름 자체를 드러내는 번역이 원문의 효과를 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘나병’ 표현의 의례적/의학적 범위
  chosen_reading: 전통적이고 본문에 익숙한 ‘나병 환자’로 옮기되 현대 의학적 동일시는 요구하지 않습니다.
  alternative_readings:
  - ‘심한 피부병 환자’
  - ‘문둥병 환자’
  rationale: 본문의 עִנְיָן은 레위기적 정결 범주와 연결되며, 현대 질병명과 정확히 일치한다고 단정하지 않되 서술의 강도를 약화시키지 않아야 합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
