revisions:
- from: 아사랴 제사장장과 모든 제사장들이 그를 향하여 돌이켰는데, 보니 그는 이마에 나병 환자가 되어 있었습니다. 그래서 그들은 그를 서둘러 그곳에서 내보냈고, 그도 몸을 돌려 나가려고 서둘렀습니다. 이는 야훼께서 그를 치셨기 때문입니다.[a][b][c]
  to: 수석 제사장 아사랴와 모든 제사장들이 그를 향해 몸을 돌려 보니, 그의 이마에 나병이 생긴 것을 보았습니다.[c] 그래서 그들은 그를 급히 그곳에서 내보냈고[a], 그 자신도 나가려고 서둘렀습니다.[b] 야훼께서 그를 치셨기 때문입니다.
  rationale: 직책명 오류를 ‘수석 제사장’으로 바로잡고, 원문에 없는 ‘몸을 돌려’라는 동작을 삭제했습니다. 또한 피부 질환의 발견, 제사장들의 긴급한 퇴거 조치, 우시아 자신의 급한 퇴장을 원문의 순서대로 분명히 했습니다. 각주 앵커를 실제로 설명하는 표현에 붙여 구조와 내용을 일치시켰습니다.
