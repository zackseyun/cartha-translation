  source_fidelity: 원문의 주어 구조와 사건 전개를 더 정확히 반영해야 합니다. עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ는 ‘제사장장’이 아니라 ‘수석 제사장 아사랴’로 옮기는 것이 적절합니다. נִדְחַף לָצֵאת의 피동적·강요적 함의를 단정하지 않으면서도, 문맥상 우시아 자신도 급히 나가려 했음을 번역에 유지했습니다.
  naturalness: ‘제사장장’은 현대 표준 한국어에서 비문에 가깝고, ‘그도 몸을 돌려’는 원문에 없는 동작을 덧붙입니다. 문장을 ‘수석 제사장 아사랴와 모든 제사장들이 그를 향해 몸을 돌려 보니’로 고치면 자연스럽고 원문의 관찰 장면도 살아납니다.
  terminology: ‘수석 제사장’은 כֹהֵן הָרֹאשׁ의 ‘우두머리/ראש’ 의미를 자연스럽게 전달하며 ‘대제사장’이라는 기술적 직함을 성급히 도입하지 않습니다. ‘야훼’는 프로젝트의 신명 방침에 부합합니다. מְצֹרָע는 본문 번역에서는 전통적 표현인 ‘나병’을 유지하되, 주석에서 현대 의학상의 나병과의 동일시를 유보합니다.
  issues:
  - severity: high
    issue: ‘아사랴 제사장장’은 부자연스럽고 직책 표현으로서 부정확합니다.
    rationale: כֹהֵן הָרֹאשׁ는 ‘우두머리/수석 제사장’이라는 뜻입니다. ‘제사장장’은 표준적인 현대 한국어 직책명이 아니며 문장 이해를 방해합니다.
  - severity: medium
    issue: ‘그도 몸을 돌려’는 원문에 없는 행위를 추가합니다.
    rationale: 두 번째 동사 נִדְחַף는 ‘밀려나다/재촉받다’ 또는 문맥상 ‘급히 나가다’를 가리키며, 몸을 돌리는 행위는 본문이 명시하지 않습니다.
  - severity: medium
    issue: 각주 a의 설명과 앵커 위치 및 내용이 맞지 않습니다.
    rationale: 기존 a는 ‘그를 향하여 돌이켰는데’에 붙어 있으나, 설명은 וַיַּבְהִלֻהוּ(그들을 급히 내보냄)의 가능한 뉘앙스를 다룹니다. 해당 구절 뒤로 앵커를 옮기고 설명을 바로잡아야 합니다.
  - severity: low
