  lexicon: HALOT
  rationale: 겹친 어근이 ‘의도적으로 고안된 제작물’임을 강조하므로, 결과를 드러내는 자연스러운 동사구로 옮기되 과도한 해설은 피했습니다.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  english_pob_choice: his fame spread far abroad
  chosen_korean: 그의 이름은 멀리까지 퍼졌습니다
  alternatives_korean:
  - 그의 명성이 멀리까지 퍼졌습니다
  - 그의 이름이 먼 곳까지 알려졌습니다
