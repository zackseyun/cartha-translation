source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בִּ/ירוּשָׁלִַ֨ם חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב לִ/הְי֤וֹת עַל הַ/מִּגְדָּלִים֙ וְ/עַל הַ/פִּנּ֔וֹת לִ/ירוֹא֙ בַּֽ/חִצִּ֔ים וּ/בָ/אֲבָנִ֖ים גְּדֹל֑וֹת וַ/יֵּצֵ֤א שְׁמ/וֹ֙ עַד לְ/מֵ֣/רָח֔וֹק כִּֽי הִפְלִ֥יא לְ/הֵעָזֵ֖ר עַ֥ד כִּֽי חָזָֽק׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
  footnotes:
  - marker: a
    text: Or 'engines' or 'contrivances'—that is, military devices designed for use on the towers and corners of the fortifications.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'his name went out far.'
    reason: lexical_alternative
  - marker: c
    text: The text does not explicitly name the one who helped him, though the context suggests divine help.
    reason: alternative_reading
translation:
  language: ko
  text: 예루살렘에서 그는 탑들과 성벽 모퉁이들 위에 두어, 화살과 큰 돌을 쏘게 하는 장치들을 만들어 냈습니다. 그의 이름은 멀리까지 퍼졌습니다. 이는 그가 놀랍게 도움을 받았기 때문이며, 마침내 강성해졌기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 이름이 멀리 나갔다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 도움의 주체를 직접 밝히지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  english_pob_choice: devices
  chosen_korean: 장치들
  alternatives_korean:
  - 기계들
  - 기구들
  - 장비들
  lexicon: HALOT
  rationale: 전쟁용으로 고안된 contrivances라는 뜻을 살리면서, 현대 한국어에서 자연스럽고 과도하게 기술시대적으로 들리지 않는 표현을 택했습니다.
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  english_pob_choice: invented by skillful men
  chosen_korean: 만들어 냈습니다
  alternatives_korean:
  - 숙련된 사람이 고안했습니다
  - 기술자들이 고안해 냈습니다
  - 설계된 것입니다
  lexicon: HALOT
  rationale: 겹친 어근이 ‘의도적으로 고안된 제작물’임을 강조하므로, 결과를 드러내는 자연스러운 동사구로 옮기되 과도한 해설은 피했습니다.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  english_pob_choice: his fame spread far abroad
  chosen_korean: 그의 이름은 멀리까지 퍼졌습니다
  alternatives_korean:
  - 그의 명성이 멀리까지 퍼졌습니다
  - 그의 이름이 먼 곳까지 알려졌습니다
  - 그의 명성이 널리 퍼졌습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그의 이름이 나갔다’이므로, 관용적 의미를 살리되 ‘이름’을 유지해 히브리어 이미지를 보존했습니다.
- source_word: הִפְלִיא לְהֵעָזֵר
  english_pob_choice: he was marvelously helped
  chosen_korean: 놀랍게 도움을 받았기 때문이며
  alternatives_korean:
  - 기이하게 도움을 받았기 때문이며
  - 크게 도움을 받았기 때문이며
  - 놀라운 도움을 받았기 때문이며
  lexicon: HALOT
  rationale: 도움의 주체를 본문대로 드러내지 않으면서, פלא 계열의 ‘경이로움’과 수동적 수혜를 함께 반영했습니다.
theological_decisions:
- issue: 도움을 준 주체를 명시할지 여부
  chosen_reading: 본문의 수동형을 따라 주체를 명시하지 않고 ‘도움을 받았습니다’로 처리했습니다.
  alternative_readings:
  - ‘야훼께서 놀랍게 도우셨습니다’처럼 명시할 수 있음
  rationale: 히브리어 본문은 이 절에서 도움의 주체를 직접 밝히지 않으므로, 문맥상 암시가 있더라도 본문에 없는 주어를 본문에 삽입하지 않았습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; avoid importing context beyond explicit source wording.'
