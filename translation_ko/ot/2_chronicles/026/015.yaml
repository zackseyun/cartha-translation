  to: 예루살렘에서 그는 탑들과 모퉁이들 위에 설치하여 화살과 큰 돌을 쏘도록, 숙련된 기술자가 고안한 장치들을 만들었습니다. 그의 이름은 멀리까지 퍼졌습니다[a]. 이는 그가 강해질 때까지 놀랍게 도움을 받았기 때문입니다[b].
