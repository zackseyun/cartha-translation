  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘신실하지 않게 행하였고’는 מָעַלְתָּ의 중대한 불성실·신의 위반을 다소 어색하게 전달하며, 마지막 절의 ‘당신의 영광이 되지 않을 것입니다’는 한국어에서 부자연스럽고 ‘영예/존귀’의 의미가 더 적절합니다. ‘이런 일은’은 히브리어의 생략을 설명적으로 보충한 것이므로, 더 절제하여 옮겼습니다.
  naturalness: 합쇼체와 전반적 문체는 적절하나, 왕에게 직접 말하는 대목은 ‘왕이신 웃시야여’보다 ‘웃시야 왕이여’가 더 자연스럽고 간결합니다. 또한 각주 표지는 한국어 문장부호 뒤에 두어 읽기 자연스럽게 정리했습니다.
  terminology: ‘야훼’, ‘분향’, ‘성소’, ‘아론의 자손 제사장들’, ‘거룩하게 구별된’은 제의 문맥과 프로젝트의 명명 방침에 부합합니다. 마지막의 כָבוֹד는 여기서 ‘영광’보다 개인에게 돌아오는 ‘영예’로 옮기는 편이 자연스럽습니다.
