base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
  footnotes:
  - marker: a
    text: Or 'withstood him' or 'confronted him' for 'stood against.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you have trespassed.' The Hebrew verb can denote acting unfaithfully, especially in a sacred or covenantal matter.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'and not to you for honor from the LORD God,' an elliptical expression meaning that this action would not result in honor from God.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 웃시야 왕에게 맞서서 그에게 말했습니다[a]. “왕이신 웃시야여, 야훼께 분향하는 일은 당신에게 합당하지 않습니다. 그것은 분향하도록 거룩히 구별된 아론의 자손 제사장들에게 속한 일입니다. 성소에서 나가십시오. 당신은 신실하지 않게 행하였고[b], 이런 일은 야훼 하나님께로부터 당신의 영광이 되지 않을 것입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맞서서’는 ‘stood against’의 대립 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘배반하였고’, ‘성물을 범하였고’로도 옮길 수 있습니다. 이 동사는 예배·언약 문맥에서 중대한 불성실을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘그리고 당신에게 영광이 아님/되지 않음’이라는 축약 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  english_pob_choice: stood against
  chosen_korean: 맞서서
  alternatives_korean:
  - 대항하여
  - 반대하여
  - 맞닥뜨려
  lexicon: HALOT
  rationale: 이 관용구는 단순한 위치가 아니라 공개적인 대립을 뜻하므로, 자연스러운 합쇼체로도 대립성을 드러내는 ‘맞서서’가 적절합니다.
- source_word: לְהַקְטִיר
  english_pob_choice: to burn incense
  chosen_korean: 분향하는 일
  alternatives_korean:
  - 향을 피우는 일
  - 향을 올리는 일
  lexicon: HALOT
  rationale: 성전 제의 맥락에서 הִקְטִיר는 단순히 향을 태우는 행위가 아니라 제의적 ‘분향’을 가리키므로, 전통 용어를 쓰되 과도하게 고어화하지 않았습니다.
- source_word: הַמְקֻדָּשִׁים
  english_pob_choice: who are consecrated
  chosen_korean: 거룩히 구별된
  alternatives_korean:
  - 성별된
  - 봉헌된
  lexicon: HALOT
  rationale: 제사장 직무에 따로 구별된 상태를 나타내므로, ‘거룩히 구별된’이 문맥의 성결·구별 의미를 가장 분명하게 드러냅니다.
- source_word: מָעַלְתָּ
  english_pob_choice: you have acted unfaithfully
  chosen_korean: 신실하지 않게 행하였고
  alternatives_korean:
  - 배신하였고
  - 성물을 범하였고
  - 언약을 어기셨고
  lexicon: HALOT
  rationale: 이 동사는 단순 실수보다 하나님께 대한 불성실과 성역 침범의 무게를 지니므로, ‘신실하지 않게 행하다’로 그 종교적·언약적 긴장을 살렸습니다.
- source_word: וְלֹא לְךָ לְכָבוֹד
  english_pob_choice: it will not be for your honor
  chosen_korean: 이런 일은 … 당신의 영광이 되지 않을 것입니다
  alternatives_korean:
  - 당신에게 영예가 되지 않을 것입니다
  - 당신에게 영광이 돌아가지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어는 축약적 표현이므로, 의미를 풀어 한국어로 자연스럽게 하되 ‘영광’의 반전을 유지했습니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: 본절의 יהוה는 영어 POB의 ‘LORD’에 맞춰 본문에서 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 프로젝트 기본값에 따라 YHWH는 학술적 전사형 ‘야훼’를 사용해 원문 식별성과 감사 가능성을 보존합니다.
  doctrine_reference: 출 3:15; 번역 원칙/고정 용례
- issue: 제사장 직무의 배타성
  chosen_reading: 분향은 아론의 자손 제사장들에게만 속한 성전 직무로 제시했습니다.
  alternative_readings:
  - 일반적인 종교 지도력의 문제
  - 왕권과 제사권의 상징적 갈등
  rationale: 본문은 추상적 상징보다 실제 제의 규정을 다루므로, 직무의 배타성을 분명히 드러내야 문맥과 신학적 무게가 살아납니다.
  doctrine_reference: 민 16–18; 출 30:7–8
