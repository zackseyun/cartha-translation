  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
  footnotes:
  - marker: a
    text: 'Hebrew: ''when he began to reign'' or ''at his becoming king.'''
    reason: lexical_alternative
  - marker: b
    text: Jecoliah may also be transliterated 'Jechiliah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 웃시야는 왕이 될 때에 열여섯 살이었습니다[a]. 그는 예루살렘에서 오십이 년 동안 통치했습니다. 그의 어머니의 이름은 예루살렘 출신 여길리아였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 “그가 왕이 되기 시작할 때” 또는 “즉위할 때”의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이름은 영어 본문의 Jecoliah처럼도, Jechiliah처럼도 음역할 수 있습니다.
    reason: lexical_alternative
