source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב עֻזִּיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַ/יִּקְבְּר֨וּ אֹת֤/וֹ עִם אֲבֹתָי/ו֙ בִּ/שְׂדֵ֤ה הַ/קְּבוּרָה֙ אֲשֶׁ֣ר לַ/מְּלָכִ֔ים כִּ֥י אָמְר֖וּ מְצוֹרָ֣ע ה֑וּא וַ/יִּמְלֹ֛ךְ יוֹתָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
  footnotes:
  - marker: a
    text: Or, “He has a skin disease.” The Hebrew term refers to one afflicted with צָרַעַת, which may be broader than modern leprosy.
    reason: lexical_alternative
translation:
  language: ko
  text: 웃시야는 그의 조상들과 함께 잠들었고, 그들은 그를 왕실 매장 들판에 그의 조상들과 함께 묻었습니다. 이는 그가 나병 환자[a]라고 말했기 때문입니다. 그의 아들 요담이 그를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피부병을 앓고 있는 사람.’ 히브리어 מְצוֹרָע는 צָרַעַת에 걸린 사람을 가리키며, 이는 현대의 나병보다 더 넓은 범주일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들었고
  alternatives_korean:
  - 죽었습니다
  - 눕게 되었습니다
  lexicon: HALOT
  rationale: 왕의 사망을 알리는 관용구를 한국어에서도 너무 평평하게 ‘죽었습니다’로 풀지 않고, 원문의 완곡한 표현을 살려 ‘잠들었고’로 옮겼습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 직역적 ‘아버지들’은 한국어에서 오해가 생길 수 있어, dynastic burial formula의 의미를 살리면서도 자연스러운 ‘조상들’로 옮겼습니다.
- source_word: בִּשְׂדֵה הַקְּבוּרָה
  english_pob_choice: in the burial field
  chosen_korean: 무덤 들판에
  alternatives_korean:
  - 장사 들판에
  - 매장 밭에
  - 묘지에
  lexicon: HALOT
  rationale: שָׂדֶה의 ‘들/밭’ 이미지를 보존하면서도 한국어에서 어색하지 않도록 ‘무덤 들판’으로 옮겼습니다.
- source_word: מְצוֹרָע
  english_pob_choice: leper
  chosen_korean: 나병 환자
  alternatives_korean:
  - 피부병 환자
  - 문둥병 환자
  lexicon: HALOT
  rationale: 본문의 이유 진술을 간명하게 전달하는 전통적 표현을 택하되, 현대 의학적 진단과 1:1 대응이 아님을 전제로 읽히도록 했습니다.
theological_decisions:
- issue: 성격병명 ‘מְצוֹרָע’의 번역이 현대 질병명과 완전히 일치하지 않는 문제
  chosen_reading: 본문은 ‘나병 환자라고’로 두되, 이는 고대의 צָרַעַת 범주를 가리키는 전통적 표기입니다.
  alternative_readings:
  - ‘피부병이 있다고’
  - ‘피부 질환에 걸렸다고’
  rationale: 왕실 매장 거부의 이유를 짧고 분명하게 전달하려면 전통적 표현이 가장 직접적입니다. 다만 고대 용어가 현대 나병(한센병)과 정확히 같지 않다는 긴장은 번역 본문 안에서 과도하게 풀지 않았습니다.
  doctrine_reference: Translation philosophy §3, §6
