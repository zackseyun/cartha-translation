review_pass:
  verdict: revise
  source_fidelity: 핵심 내용은 대체로 원문에 충실합니다. 그러나 마지막 절의 '그의 아들로서 그의 자리에'는 요담이 웃시야의 아들임과 웃시야를 계승함을 자연스럽고 분명하게 드러내지 못합니다. 또한 매장 장소의 '왕들에게 속한 매장 들판'이라는 관계를 더 명료하게 옮길 필요가 있습니다.
  naturalness: '''무덤 들판''과 ''요담이 그의 아들로서 그의 자리에 왕이 되었습니다''는 현대 표준 한국어에서 다소 부자연스럽고 대명사 관계가 모호합니다. ''왕실 매장 들판'', ''그의 아들 요담이 그를 이어 왕이 되었습니다''가 더 자연스럽습니다.'
  terminology: '''나병 환자''는 전통적 번역어로 유지할 수 있으나, 현대 한센병과 정확히 일치하지 않을 수 있음을 밝히는 각주가 필요합니다. 각주는 해당 표현 바로 뒤에 붙여야 합니다.'
  issues:
