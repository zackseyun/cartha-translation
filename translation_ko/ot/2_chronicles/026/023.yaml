revisions:
- from: 웃시야는 그의 조상들과 함께 잠들었고, 그들은 그를 왕들의 무덤 들판에 그 조상들과 함께 묻었습니다. 그가 나병 환자라고 말했기 때문입니다. 요담이 그의 아들로서 그의 자리에 왕이 되었습니다.[a]
  to: 웃시야는 그의 조상들과 함께 잠들었고, 그들은 그를 왕실 매장 들판에 그의 조상들과 함께 묻었습니다. 이는 그가 나병 환자[a]라고 말했기 때문입니다. 그의 아들 요담이 그를 이어 왕이 되었습니다.
  rationale: 왕의 죽음에 관한 관용구인 '조상들과 함께 잠들었다'는 유지했습니다. 매장 장소는 왕들과 연관된 매장 들판이라는 원문의 표현을 보존하면서 한국어 어법에 맞게 다듬었습니다. 요담의 부자 관계와 왕위 계승을 명확히 했고, מְצוֹרָע의 현대 의학적 용어와의 불일치를 설명하는 각주를 해당 단어에 직접 연결했습니다.
