    rationale: בְּנוֹ는 '그의 아들'로 요담을 수식하고, תַּחְתָּיו는 웃시야를 대신한 계승을 뜻합니다. '그의 아들 요담이 그를 이어 왕이 되었습니다'가 이를 정확하고 자연스럽게 전달합니다.
