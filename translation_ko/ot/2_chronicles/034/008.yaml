base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: Now in the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
  footnotes:
  - marker: a
    text: Or 'the land and the temple'; Hebrew literally 'the land and the house.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to strengthen'; in context this means to repair or restore the temple building.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 통치 십팔 년에, 그가 그 땅과 집을 깨끗하게 한 뒤에, 그는 사반(아살리야의 아들)과 성의 관원 마아세야와 아사랴의 아들 요아스, 곧 서기관을 보내어 야훼 그의 하나님의 집을 수리하게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 뒤 문맥에서 야훼의 집, 곧 성전을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘수리하게’는 히브리어 לְחַזֵּק의 문맥상 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  english_pob_choice: Now in the eighteenth year of his reign
  chosen_korean: 그의 통치 십팔 년에
  alternatives_korean:
  - 그의 치세 십팔 년에
  - 그가 왕이 된 지 십팔 년에
  lexicon: HALOT
  rationale: 히브리어 연대 공식은 한국어에서 자연스러운 절 표현으로 옮기되, 서술적 완곡어인 ‘그의 통치’로 regnal frame을 유지했습니다.
- source_word: לְטַהֵר הָאָרֶץ וְהַבָּיִת
  english_pob_choice: when he had cleansed the land and the house
  chosen_korean: 그가 그 땅과 집을 깨끗하게 한 뒤에
  alternatives_korean:
  - 그가 그 땅과 집을 정결하게 한 뒤에
  - 그가 그 땅과 집을 정화한 뒤에
  lexicon: HALOT
  rationale: לְטַהֵר는 의식적/도덕적 ‘정결하게 하다’의 뜻이지만, 한국어에서는 ‘깨끗하게 하다’가 문맥상 가장 직접적이며, POB의 ‘when he had cleansed’ 흐름도 반영합니다.
- source_word: הָאָרֶץ וְהַבָּיִת
  english_pob_choice: the land and the house
  chosen_korean: 그 땅과 집
  alternatives_korean:
  - 그 땅과 성전
  - 그 땅과 그 집
  lexicon: HALOT
  rationale: POB의 ‘house’를 그대로 살려 뒤의 ‘야훼의 집’과 연결되도록 했습니다. 여기서 ‘집’은 뒤 문맥에서 성전임이 밝혀집니다.
- source_word: הַמַּזְכִּיר
  english_pob_choice: the recorder
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 기록 담당관
  lexicon: HALOT
  rationale: 왕실 행정 관직을 가리키는 말이므로, 한국어에서 기능을 드러내는 ‘서기관’이 가장 자연스럽습니다.
- source_word: לְחַזֵּק
  english_pob_choice: to repair
  chosen_korean: 수리하게
  alternatives_korean:
  - 보수하게
  - 견고하게 하게
  lexicon: HALOT
  rationale: 동사의 기본 의미는 ‘강하게 하다’이지만 건물 문맥에서는 수리·복구를 뜻하므로, POB의 문맥 결정을 따라 ‘수리하다’로 옮겼습니다.
- source_word: יְהוָה אֱלֹהָיו
  english_pob_choice: Yahweh his God
  chosen_korean: 야훼 그의 하나님
  alternatives_korean:
  - 여호와 그의 하나님
  - 야훼 곧 그의 하나님
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본어인 ‘야훼’를 따랐고, 소유격 관계를 자연스럽게 살렸습니다.
