  lexicon: HALOT
  rationale: לְטַהֵר는 의식적/도덕적 ‘정결하게 하다’의 뜻이지만, 한국어에서는 ‘깨끗하게 하다’가 문맥상 가장 직접적이며, POB의 ‘when he had cleansed’ 흐름도 반영합니다.
- source_word: הָאָרֶץ וְהַבָּיִת
  english_pob_choice: the land and the house
  chosen_korean: 그 땅과 집
