base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: Now in the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
  footnotes:
  - marker: a
    text: Or 'the land and the temple'; Hebrew literally 'the land and the house.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to strengthen'; in context this means to repair or restore the temple building.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 다스린 지 십팔 년째 되는 해에, 그가 그 땅과 그 집[a]을 정결하게 한 뒤, 사반 곧 아살리야의 아들과 성의 관리 마아세야와 기록관 요아하스의 아들 요아를 보내어 그의 하나님 야훼의 집을 수리[b]하게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 뒤 문맥에서 야훼의 집, 곧 성전을 가리킵니다.
    reason: source_note
  - marker: b
    text: 히브리어는 직역하면 ‘견고하게 하다’이지만, 건물 문맥에서는 수리하거나 보수한다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
