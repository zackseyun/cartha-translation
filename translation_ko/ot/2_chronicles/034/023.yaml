  lexicon: HALOT
  rationale: 본 기록의 기본 규범에 따라 여호와 대신 고유명사 음역인 ‘야훼’를 사용해 신적 이름을 보존했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 주 하나님
  - 이스라엘의 하나님이신 야훼
  lexicon: HALOT
  rationale: 야훼를 이스라엘의 언약적 하나님으로 규정하는 소유격 구문을 가장 직접적으로 반영했습니다.
- source_word: אִמְרוּ לָאִישׁ
  english_pob_choice: Say to the man
  chosen_korean: 그 사람에게 말하여라
  alternatives_korean:
  - 그 남자에게 말하여라
  - 그에게 말하여라
  lexicon: HALOT
  rationale: 히브리어 אִישׁ의 문자적 의미를 살리되, 한국어에서는 대상이 요시야임이 문맥상 분명하므로 ‘그 사람’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 예언 공식과 하나님의 직접 화법의 존중
  chosen_reading: 「야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다」
  alternative_readings:
  - ‘야훼께서 말씀하십니다’
  - ‘주님께서 말씀하십니다’
  rationale: כֹּה אָמַר의 예언자적 공식은 단순 과거가 아니라 현재적 신탁 선언으로 읽는 것이 문맥에 맞습니다. 또한 하나님의 직접 발화를 따옴표로 분리해 화법의 위계를 분명히 했습니다.
  doctrine_reference: DOCTRINE.md — prophetic speech and divine name
- issue: 인용문 내부의 명령형 톤
  chosen_reading: “너희를 나에게 보낸 그 사람에게 말하여라.”
  alternative_readings:
  - “너희를 나에게 보낸 그 사람에게 말하십시오.”
  - “너희를 나에게 보낸 그 사람에게 말하라.”
  rationale: 본문의 אִמְרוּ는 복수 명령형이므로, 예언 신탁 내부의 직접 명령으로 반말형을 사용해 원문의 명령성을 살렸습니다.
  doctrine_reference: Korean style guidance for quoted divine speech
