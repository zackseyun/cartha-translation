  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
  footnotes:
  - marker: a
    text: Or 'from all the territories of the people of Israel.' The Hebrew literally says 'from all the lands that belonged to the sons of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he caused all who were found in Israel to serve the LORD their God.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the God of their fathers'; that is, the covenant God worshiped by their forefathers.
    reason: cultural_note
  - marker: d
    text: Or 'all who were found in Israel'.
    reason: previous_rendering
translation:
  language: ko
  text: 요시야는 이스라엘 자손에게 속한 모든 땅에서 모든 가증한 것들을 제거하고, 이스라엘에 있는 모든 사람이 그들의 하나님이신 야훼를 섬기게 하였습니다. 그의 온 생애 동안 그들은 그들의 조상들의 하나님이신 야훼를 따르기를 그만두지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손에게 속한 모든 땅’은 히브리어의 문자적 표현을 따른 것입니다. 문맥상 이스라엘에 속한 영토들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘발견된 모든 사람’입니다. 여기서는 문맥상 이스라엘에 있던 사람들을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וַיָּסַר
  english_pob_choice: removed
  chosen_korean: 제거하고
  alternatives_korean:
  - 없애고
  - 치워 버리고
  lexicon: HALOT
  rationale: סור의 히필은 무언가를 치워 없애는 뜻이므로, 현대 한국어에서는 ‘제거하다’가 가장 직접적이고 공적 개혁의 뉘앙스를 잘 살립니다.
- source_word: הַתּוֹעֵבוֹת
  english_pob_choice: abominations
  chosen_korean: 가증한 것들
  alternatives_korean:
  - 혐오스러운 것들
  - 역겨운 것들
  lexicon: HALOT
  rationale: 우상숭배적·언약 위반적 대상을 가리키는 강한 표현이므로, 성경적 어감이 유지되는 ‘가증한 것들’을 선택했습니다.
- source_word: וַיַּעֲבֵד אֵת כָּל הַנִּמְצָא בְּיִשְׂרָאֵל לַעֲבֹד
  english_pob_choice: he made all who were found in Israel serve
  chosen_korean: 이스라엘에 있는 모든 사람에게 ... 섬기게 하였습니다
  alternatives_korean:
  - 이스라엘에서 발견된 모든 사람으로 하여금 ... 섬기게 하였습니다
  - 이스라엘에 있는 모든 사람을 ... 섬기도록 하였습니다
  lexicon: HALOT
  rationale: 히필의 사역적·강제적 의미를 살리되, 한국어에서는 ‘~하게 하다’가 가장 자연스럽고 문맥상 과도한 물리적 강제는 드러내지 않아 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유명사를 그대로 옮겨, титул이 아니라 언약적 신명이라는 점을 분명히 하기 위해 ‘야훼’를 사용했습니다.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  english_pob_choice: the God of their fathers
  chosen_korean: 그들의 조상들의 하나님
  alternatives_korean:
  - 그들의 조상의 하나님
  - 그들의 선조들의 하나님
  lexicon: HALOT
  rationale: 히브리어의 직설적 친족 표현을 유지해, 언약적 계승과 세대 간 연속성을 드러냈습니다.
theological_decisions:
- issue: 여호와/야훼의 신명 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 Tetragrammaton יְהוָה를 직접 사용하므로, 제목어 ‘주’로 대체하지 않고 고유한 신명으로 번역하는 것이 स्रोत 충실성에 맞습니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה / YHWH
- issue: וַיַּעֲבֵד의 사역성
  chosen_reading: 섬기게 하였습니다
  alternative_readings:
  - 섬기도록 강요하였습니다
  - 섬기게 만들었습니다
  rationale: 동사의 사역성을 보존하되, 본문이 명시하는 것 이상으로 물리적 강압을 단정하지 않기 위해 중간 강도의 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
