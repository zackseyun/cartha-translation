  source_fidelity: 히브리어의 사역 동사 וַיַּעֲבֵד와 ‘이스라엘에 있는/발견되는 모든 사람’이라는 범위를 대체로 충실히 반영했습니다. 그러나 ‘이스라엘 자손의 모든 땅’은 소유·귀속 관계가 다소 불분명하며, 마지막의 ‘그들의 조상들의 하나님’은 한국어로 중복되고 어색합니다.
