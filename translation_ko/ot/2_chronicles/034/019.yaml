base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
  footnotes:
  - marker: a
    text: Or "the instruction"; Hebrew torah can denote instruction more broadly, though here it refers to the covenantal law being read before the king.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 율법의 말씀을 듣자 자신의 옷을 찢었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘율법’은 여기서 단순한 일반 교훈보다, 언약적 법문으로 읽히는 תורה를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  english_pob_choice: And when ... heard
  chosen_korean: 듣자
  alternatives_korean:
  - 들었을 때
  - 듣고
  lexicon: HALOT
  rationale: 히브리어 절은 사건의 경과를 시간적으로 연결하므로, 한국어에서는 자연스러운 선행 상황 표현인 ‘듣자’로 간결하게 옮겼습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕이
  alternatives_korean:
  - 그 왕이
  - 임금이
  lexicon: HALOT
  rationale: 문맥상 요시야를 가리키지만 히브리어는 인물명을 풀어 쓰지 않고 직함을 유지하므로, 이를 따라 ‘왕이’로 옮겼습니다.
- source_word: דִּבְרֵי הַתּוֹרָה
  english_pob_choice: the words of the law
  chosen_korean: 율법의 말씀을
  alternatives_korean:
  - 토라의 말씀을
  - 율법의 내용들을
  lexicon: HALOT
  rationale: 이 문맥의 תּוֹרָה는 단순한 ‘가르침’보다 언약적 법문을 가리키므로, 프로젝트 기본어인 ‘율법’을 사용하고 דִּבְרֵי를 ‘말씀’으로 살렸습니다.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  english_pob_choice: he tore his clothes
  chosen_korean: 자신의 옷을 찢었습니다
  alternatives_korean:
  - 옷을 찢었습니다
  - 자기 옷을 찢었습니다
  lexicon: HALOT
  rationale: בְּגָדִים은 일반적인 의복을 뜻하므로 ‘옷’이 가장 자연스럽고, 반사적 의미를 분명히 하기 위해 ‘자신의’로 다듬었습니다.
theological_decisions:
- issue: תורה의 의미 범위
  chosen_reading: ‘율법’은 여기서 발견된 언약 문서의 법적·권면적 권위를 드러내는 번역으로 유지했습니다.
  alternative_readings:
  - ‘교훈’
  - ‘토라’
  rationale: 이 장면은 성전에서 낭독된 책을 듣고 왕이 반응하는 역사 서술로, 한국어 독자가 본문의 충격과 권위를 즉시 이해하도록 ‘율법’이 가장 적절합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; consistency of key terms, or documented exception.'
