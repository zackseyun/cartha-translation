  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
  footnotes:
  - marker: a
    text: Or “the scroll of the law”; Hebrew sefer can refer to a book, document, or scroll.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 힐기야가 서기관 사반에게 대답하여 말했습니다. “제가 야훼의 집에서 율법책[a]을 찾았습니다.” 그리고 힐기야가 그 책을 사반에게 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “율법 두루마리”입니다. 히브리어 סֵפֶר는 책, 문서, 두루마리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  english_pob_choice: answered
  chosen_korean: 말했습니다
  alternatives_korean:
  - 대답했습니다
  - 응답했습니다
  lexicon: HALOT
  rationale: 서술 중의 응답 표지로 쓰인 동사라 한국어에서는 자연스러운 담화 동사인 ‘말했습니다’로 풀었습니다.
- source_word: הַסּוֹפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 서기
  lexicon: HALOT
  rationale: 행정 직무를 가리키는 הַסּוֹפֵר를 한국어 성경에서 통용되는 ‘서기관’으로 옮겨 직무성을 유지했습니다.
- source_word: סֵפֶר הַתּוֹרָה
  english_pob_choice: the Book of the Law
  chosen_korean: 율법책
  alternatives_korean:
  - 율법 두루마리
  - 율법의 책
  lexicon: HALOT
  rationale: סֵפֶר는 책/문서/두루마리를 포괄하지만, 여기서는 발견된 문헌을 가리키므로 간결하고 자연스러운 ‘율법책’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 표기해 본문이 지닌 언약명 자체를 드러냈습니다.
theological_decisions:
- issue: 율법책의 정체를 어떻게 드러낼지
  chosen_reading: 본문의 발견물은 단순한 일반 서책이 아니라 성전에서 발견된 율법 문헌이라는 점을 살리되, 지나친 해설은 넣지 않았습니다.
  alternative_readings:
  - ‘율법의 책’처럼 보다 직역하기
  - ‘율법의 두루마리’로 형식을 분명히 하기
  rationale: 히브리어는 책/문서/두루마리의 폭이 있으나, 문맥상 핵심은 발견 사실과 율법 문헌의 권위입니다. 한국어에서는 ‘율법책’이 그 긴장을 가장 간결하게 보존합니다.
  doctrine_reference: 본문 문맥상 성전 개혁과 율법의 재발견
- issue: 야훼의 집의 번역
  chosen_reading: ‘야훼의 집’으로 옮겨 성전의 소유자이자 언약의 하나님을 직접 드러냈습니다.
  alternative_readings:
  - ‘야훼의 성전’으로 풀기
  - ‘주님의 집’으로 완화하기
  rationale: 히브리어의 직설적 표현을 보존하는 편이 본문의 예언적·언약적 긴장을 더 분명히 전달합니다.
  doctrine_reference: YHWH 표기 원칙
