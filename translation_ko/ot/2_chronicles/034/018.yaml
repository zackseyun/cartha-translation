- from: 그때 서기관 사반이 왕에게 아뢰며 말했습니다. “제사장 힐기야가 저에게 책 한 권을 주었는데요,” 하고 사반이 왕 앞에서 그것을 읽었습니다.[a]
  to: 그때 서기관 사반이 왕에게 이렇게 보고했습니다. “제사장 힐기야가 저에게 책[a]을 주었습니다.” 그리고 사반은 왕 앞에서 그 책을 읽었습니다.
