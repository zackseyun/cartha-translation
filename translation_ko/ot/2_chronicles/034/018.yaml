  - 그 안에서 읽었습니다
  - 그것에서 읽었습니다
  lexicon: HALOT
  rationale: 부사적 전치사 בּוֹ의 관계를 한국어에서 굳이 직역하기보다, 왕 앞에서 그 문서를 낭독했다는 동작을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 공식 보고와 낭독의 서술 톤
  chosen_reading: ‘아뢰며 말했습니다’와 ‘왕 앞에서 그것을 읽었습니다’로 왕실 문맥의 격식을 유지했습니다.
  alternative_readings:
  - ‘말했습니다’
  - ‘낭독했습니다’
  rationale: 본문은 단순 전달이 아니라 왕 앞에서의 공식 보고와 낭독을 함께 보여 주므로, 서술 톤을 격식 있게 유지하는 것이 원문 기능에 더 가깝습니다.
  doctrine_reference: 왕정사 서술의 문맥적 정확성
