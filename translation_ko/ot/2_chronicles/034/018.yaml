  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
  footnotes:
  - marker: a
    text: Or “a scroll.” The Hebrew word can refer broadly to a written document or book; the physical form in this period was often a scroll.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 서기관 사반이 왕에게 아뢰며 말했습니다. “제사장 힐기야가 저에게 책 한 권을 주었는데요,” 하고 사반이 왕 앞에서 그것을 읽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘책’은 히브리어 סֵפֶר의 넓은 의미를 따른 번역이며, 이 시대의 물리적 형태는 두루마리였을 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 아뢰며 말했습니다
  alternatives_korean:
  - 말했습니다
  - 보고했습니다
  lexicon: HALOT
  rationale: 왕에게 공식적으로 전달하는 뉘앙스를 살리되, 현대 한국어에서 자연스러운 보고 체계를 반영했습니다.
- source_word: הַסּוֹפֵר
