  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
  footnotes:
  - marker: a
    text: Or “a scroll.” The Hebrew word can refer broadly to a written document or book; the physical form in this period was often a scroll.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 서기관 사반이 왕에게 이렇게 보고했습니다. “제사장 힐기야가 저에게 책[a]을 주었습니다.” 그리고 사반은 왕 앞에서 그 책을 읽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두루마리’. 히브리어 סֵפֶר는 기록 문서나 책을 넓게 가리킬 수 있습니다. 이 시대에는 물리적 형태가 흔히 두루마리였습니다.
    reason: lexical_alternative
