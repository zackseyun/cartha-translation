  - 문서
  lexicon: HALOT
  rationale: 원어는 넓게 ‘기록된 것’을 가리키지만, 한국어에서는 가장 자연스럽고 넓은 대응으로 ‘책 한 권’을 사용했습니다.
- source_word: וַיִּקְרָא בוֹ
  english_pob_choice: read from it
