  - 비서
  lexicon: HALOT
  rationale: 히브리어 סֹפֵר의 역사적 직함을 살리기 위해 ‘서기관’을 택했습니다.
- source_word: סֵפֶר
  english_pob_choice: a book
  chosen_korean: 책 한 권
  alternatives_korean:
  - 두루마리 한 통
  - 문서
  lexicon: HALOT
  rationale: 원어는 넓게 ‘기록된 것’을 가리키지만, 한국어에서는 가장 자연스럽고 넓은 대응으로 ‘책 한 권’을 사용했습니다.
- source_word: וַיִּקְרָא בוֹ
  english_pob_choice: read from it
  chosen_korean: 그것을 읽었습니다
  alternatives_korean:
  - 그 안에서 읽었습니다
  - 그것에서 읽었습니다
  lexicon: HALOT
  rationale: 부사적 전치사 בּוֹ의 관계를 한국어에서 굳이 직역하기보다, 왕 앞에서 그 문서를 낭독했다는 동작을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 공식 보고와 낭독의 서술 톤
  chosen_reading: ‘아뢰며 말했습니다’와 ‘왕 앞에서 그것을 읽었습니다’로 왕실 문맥의 격식을 유지했습니다.
  alternative_readings:
  - ‘말했습니다’
  - ‘낭독했습니다’
  rationale: 본문은 단순 전달이 아니라 왕 앞에서의 공식 보고와 낭독을 함께 보여 주므로, 서술 톤을 격식 있게 유지하는 것이 원문 기능에 더 가깝습니다.
  doctrine_reference: 왕정사 서술의 문맥적 정확성
