source:
  edition: WLC
  text: וְ/עַ֣ל הַ/סַּבָּלִ֗ים וּֽ/מְנַצְּחִים֙ לְ/כֹל֙ עֹשֵׂ֣ה מְלָאכָ֔ה לַ/עֲבוֹדָ֖ה וַ/עֲבוֹדָ֑ה וּ/מֵֽ/הַ/לְוִיִּ֔ם סוֹפְרִ֥ים וְ/שֹׁטְרִ֖ים וְ/שׁוֹעֲרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/013.yaml
  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
  footnotes:
  - marker: a
    text: Or 'for each kind of service.' The Hebrew repeats 'service' (literally, 'for service and service'), likely expressing distribution across the various tasks.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 짐을 나르는 이들을 맡고, 각 업무에 종사하는 모든 일꾼을 감독했습니다.[a] 레위인 중에는 서기관들, 관원들, 성문지기들이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘업무와 업무를 위해’입니다. 히브리어에서 ‘업무’가 반복되어, 여러 업무 영역에 걸친 분배적 의미를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  english_pob_choice: were over the burden-bearers
  chosen_korean: 짐을 나르는 자들을 맡아 감독했고
  alternatives_korean:
  - 짐을 나르는 자들 위에 있었고
  - 짐꾼들을 감독했고
  - 짐을 지는 자들을 맡아
  lexicon: HALOT
  rationale: עַל의 관리·감독 의미를 살려 단순 위치보다 권한과 책임을 드러내고, סַבָּלִים는 ‘짐을 나르는 자들’로 구체화했습니다.
- source_word: וּמְנַצְּחִים לְכֹל עֹשֵׂה מְלָאכָה
  english_pob_choice: supervised everyone doing work
  chosen_korean: 각종 일에 종사하는 모든 사람을…감독했습니다
  alternatives_korean:
  - 일하는 모든 사람을 감독했습니다
  - 모든 일꾼을 감독했습니다
  - 일하는 사람들을 지휘했습니다
  lexicon: HALOT
  rationale: מְנַצְּחִים은 단순 지시보다 감독·총괄의 뜻이 강해 ‘감독했습니다’로 옮겼고, עֹשֵׂה מְלָאכָה는 ‘일에 종사하는 모든 사람’으로 자연스럽게 풀었습니다.
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  english_pob_choice: for service after service
  chosen_korean: 각각의 일에 따라
  alternatives_korean:
  - 이 일 저 일에 따라
  - 한 가지 일에서 또 한 가지 일로
  - 섬김과 섬김을 위해
  lexicon: HALOT
  rationale: 반복된 עֲבוֹדָה의 분배적·반복적 뉘앙스를 한국어에서 가장 자연스럽게 드러내기 위해 ‘각각의 일에 따라’로 옮겼습니다.
- source_word: וּמֵהַלְוִיִּם סוֹפְרִים וְשֹׁטְרִים וְשׁוֹעֲרִים
  english_pob_choice: and some of the Levites were scribes, officers, and gatekeepers
  chosen_korean: 그리고 레위인 가운데에는 서기관들, 관리들, 성문지기들이 있었습니다
  alternatives_korean:
  - 그리고 레위인 중에는 서기관들, अधिकारी들, 문지기들이 있었습니다
  - 레위인 중 일부는 서기관들, 감독들, 문지기들이었습니다
  - 레위인 중에는 서기관들, 관리들, 문지기들이 있었습니다
  lexicon: HALOT
  rationale: מִן의 부분적 의미를 ‘가운데에는’으로 살리고, שׁוֹעֲרִים는 성전·도시 맥락을 반영해 ‘성문지기들’로 옮겼습니다.
theological_decisions:
- issue: 반복된 עֲבוֹדָה의 처리
  chosen_reading: ‘각각의 일에 따라’로 번역해 반복이 가리키는 분배·배치의 의미를 살렸습니다.
  alternative_readings:
  - ‘각종 일마다’
  - ‘서비스마다’
  - ‘각기 다른 봉사에 따라’
  rationale: 본문의 반복을 단순 중복이 아니라 업무 분담의 표지로 보고, 한국어에서도 그 기능이 드러나도록 했습니다.
  doctrine_reference: 본문의 행정적·성전 봉사 질서
- issue: 레위인 직분 명칭의 직역성
  chosen_reading: ‘서기관들, 관리들, 성문지기들’로 유지해 직분 구분을 분명히 했습니다.
  alternative_readings:
  - ‘기록관들, 감독관들, 문지기들’
  - ‘서기들, 관원들, 문지기들’
  rationale: 후대 교회 직분 용어로 흡수하지 않고, 본문이 열거하는 역사적 직무 구분을 그대로 보존했습니다.
  doctrine_reference: 구약 성전 행정과 레위인 직무
