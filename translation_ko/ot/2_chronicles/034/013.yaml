  source_fidelity: 첫 절반의 ‘짐을 나르는 자들을 맡아 감독했고’는 עַל의 관리·감독 의미와 סַבָּלִים를 대체로 충실히 반영합니다. 그러나 ‘각종 일에 종사하는 모든 사람을 각각의 일에 따라 감독했습니다’의 ‘…에 따라’는 לַעֲבֹדָה וַעֲבֹדָה가 나타내는 업무별·분배적 범위를 기준이나 방식의 의미로 바꾸며, ‘각종 일’과 ‘각각의 일’도 불필요하게 겹칩니다. 이를 ‘각 업무에 종사하는 모든 일꾼’으로 바로잡아 모든 업무 영역의 일꾼이라는 뜻을 보존했습니다. 레위인 가운데 특정 이들이 세 직무를 맡았다는 마지막 절은 충실합니다.
  naturalness: 원문 초안은 ‘각종 일에 종사하는 모든 사람을 각각의 일에 따라 감독했습니다’가 중복되고 ‘에 따라’의 연결이 부자연스럽습니다. 수정문은 두 감독 역할을 구분하면서 현대 표준 한국어 합쇼체로 자연스럽게 읽힙니다.
  terminology: ‘서기관들’과 ‘성문지기들’은 적절합니다. שֹׁטְרִים는 현대의 ‘관리’보다 고대 행정 직무를 더 중립적으로 나타내는 ‘관원들’로 옮겼습니다. ‘업무’는 כאן의 עֲבֹדָה가 가리키는 작업·봉사 영역을 현대 한국어로 무리 없이 전달합니다.
