    rationale: הַמּוּבָא는 수동 분사이므로, ‘집에 들어온 은’이 한국어에서 더 중립적으로 앞서 반입된 은을 가리킵니다.
  - severity: medium
    issue: 신명 표기가 영문 POB의 ‘Yahweh’ 결정과 불일치합니다.
    rationale: 영문 감사 기록은 직접 나타난 Tetragrammaton을 ‘Yahweh’로 번역한다는 방침을 명시합니다. 한국어 음역 ‘야훼’가 그 결정을 더 직접적으로 반영합니다.
  - severity: low
    issue: 각주 표지가 문장 끝에 있어 해당 관용구의 위치가 불분명합니다.
