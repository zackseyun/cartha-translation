  rationale: 이 기록의 본문과 기존 POB 영문 기준을 따라 한국어 독자에게 즉시 식별되는 전통적 표기를 사용했습니다.
  doctrine_reference: 'POB contested terms: YHWH'
- issue: תּוֹרָה의 번역
