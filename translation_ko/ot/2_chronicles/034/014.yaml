  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
  footnotes:
  - marker: a
    text: 'Hebrew: ''by the hand of Moses,'' an idiom meaning ''through Moses'' or ''given through Moses.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 야훼의 집에 들어온 은을 꺼내던 때에, 제사장 힐기야가 모세를 통하여 전해진[a] 야훼의 율법책을 발견했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘모세의 손으로’입니다. 히브리어 ‘모세의 손으로’는 흔히 모세를 매개로 하여 전해졌다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  english_pob_choice: And when they brought out
  chosen_korean: 그들이 ... 꺼낼 때
  alternatives_korean:
  - 그들이 ... 내놓을 때
  - 그들이 ... 꺼내었을 때
  lexicon: HALOT
  rationale: 동작의 동시·선행 상황을 나타내는 הזמן절로 읽어 한국어에서는 자연스러운 '-ㄹ 때' 구문이 가장 적절합니다.
- source_word: הַכֶּסֶף
  english_pob_choice: the silver
  chosen_korean: 은
  alternatives_korean:
  - 돈
  - 은돈
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '은'이며, 성전 수리 문맥에서 금전이지만 원문 어휘를 살려 '은'으로 옮기는 것이 더 직접적입니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 여호와의 성전
  - 야훼의 집
  lexicon: HALOT
  rationale: בֵּית는 문자적으로 '집'이므로, 본문 형식을 살려 '집'을 유지했습니다. 다만 프로젝트 관례상의 표기는 '여호와'로 두었습니다.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  english_pob_choice: the Book of the Law of Yahweh
  chosen_korean: 여호와의 율법책
  alternatives_korean:
  - 여호와의 율법 두루마리
  - 여호와의 가르침의 책
  lexicon: HALOT
  rationale: סֵפֶר은 이 맥락에서 전통적이고 자연스러운 '책'이 적절하고, תּוֹרָה는 언약적·규범적 의미가 강해 '율법'이 본문 문맥에 가장 맞습니다.
- source_word: בְּיַד מֹשֶׁה
  english_pob_choice: by the hand of Moses
  chosen_korean: 모세를 통해 주신
  alternatives_korean:
  - 모세의 손으로
  - 모세의 손을 통해
  lexicon: HALOT
  rationale: בְּיַד + 인물은 매개/전달의 관용구이므로, 한국어에서는 '모세를 통해'로 자연스럽게 풀어 원문의 매개 의미를 드러냈습니다.
