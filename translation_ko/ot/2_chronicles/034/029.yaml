translation:
  language: ko
  text: 그때 왕이 보내어 유다와 예루살렘의 모든 장로를 모았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내
  alternatives_korean:
  - 보내다
  - 전갈을 보내다
  lexicon: HALOT
  rationale: 히브리어 שׁלח은 기본적으로 ‘보내다’이므로 이를 직접 반영하되, 왕이 직접 이동한 것이 아니라 심부름꾼이나 소집자를 보냈다는 문맥을 살려 ‘사람을 보내’로 옮겼습니다.
- source_word: הַמֶּלֶךְ
  english_pob_choice: the king
  chosen_korean: 왕
  alternatives_korean:
  - 그 왕
  - 임금
  lexicon: HALOT
  rationale: 본문은 인물 이름보다 직함을 사용하므로, 현대 한국어에서 자연스러운 ‘왕’을 유지했습니다.
- source_word: וַיֶּאֱסֹף
  english_pob_choice: gathered
  chosen_korean: 모았습니다
  alternatives_korean:
  - 소집했습니다
  - 모집했습니다
  lexicon: HALOT
  rationale: אָסף의 핵심 의미는 ‘모으다/집합시키다’이므로, 장로들을 불러 모은 상황을 자연스럽게 드러내는 ‘모았습니다’를 선택했습니다.
- source_word: זִקְנֵי יְהוּדָה וִירוּשָׁלִָם
  english_pob_choice: the elders of Judah and Jerusalem
  chosen_korean: 유다와 예루살렘의 모든 장로
  alternatives_korean:
  - 유다와 예루살렘의 장로들
  - 유다와 예루살렘의 연장자들
  lexicon: HALOT
  rationale: זָקֵן의 이 문맥적 의미는 단순한 고령자가 아니라 공동체의 대표 장로이므로 ‘장로’로 옮겼고, כָּל을 ‘모든’으로 살려 전체 소집의 범위를 분명히 했습니다.
theological_decisions:
- issue: 왕의 소집 행위의 전달 방식
  chosen_reading: ‘사람을 보내’로 옮겨, 단순한 이동이 아니라 공식 소집의 성격을 드러냈습니다.
  alternative_readings:
  - ‘보냈습니다’
  - ‘소집했습니다’
  rationale: 히브리어는 직접적으로 ‘보내다’와 ‘모으다’를 연속해 쓰므로, 한국어에서도 그 행정적·공적 성격을 자연스럽게 보존하는 표현이 적절합니다.
  doctrine_reference: 본문 내 역사 서술
