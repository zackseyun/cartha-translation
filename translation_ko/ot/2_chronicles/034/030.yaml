  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְ֠הוָה וְ/כָל אִ֨ישׁ יְהוּדָ֜ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הָ/עָ֖ם מִ/גָּד֣וֹל וְ/עַד קָטָ֑ן וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בֵּ֥ית יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'all the men of Judah.' The Hebrew says 'every man of Judah,' using masculine language distributively.
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH, traditionally represented in English small caps.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 야훼의 집으로 올라갔고, 유다의 모든 남자와 예루살렘의 주민들과 제사장들과 레위 사람들과 모든 백성, 곧 큰 자부터 작은 자까지가 함께했습니다. 왕은 야훼의 집에서 발견된 언약책의 모든 말씀을 그들의 귀에 읽어 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 분배적으로 ‘유다의 모든 남자’라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼’는 히브리어 고유명 יְהוָה를 옮긴 표기입니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔고
  alternatives_korean:
  - 갔고
  - 올랐고
  lexicon: HALOT
  rationale: 히브리어 עלה의 기본 의미인 ‘올라가다’를 살려, 예루살렘 성전으로 올라가는 방향성을 한국어에서도 유지했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 문자적으로 ‘야훼의 집’이며, POB의 야훼 표기를 반영해 개인 이름을 보존했습니다. ‘성전’은 의미상 가능하지만 원문 표현의 직역성은 약해집니다.
- source_word: כָל אִישׁ יְהוּדָה
  english_pob_choice: every man of Judah
  chosen_korean: 유다의 모든 남자
  alternatives_korean:
  - 유다의 모든 사람
  - 유다의 남자들
  lexicon: HALOT
  rationale: 단수 אִישׁ의 분배적 용법을 살려 ‘모든 남자’로 옮겼고, 영어 POB의 성별-정확 번역 결정을 한국어에서도 반영했습니다.
- source_word: מִגָּדוֹל וְעַד קָטָן
  english_pob_choice: from great to small
  chosen_korean: 큰 자부터 작은 자까지
  alternatives_korean:
  - 가장 큰 자부터 가장 작은 자까지
  - 높은 자부터 낮은 자까지
  lexicon: HALOT
  rationale: 신분·연령을 포괄하는 관용구를 한국어의 자연스러운 대구 표현으로 옮겨 전체 범위를 드러냈습니다.
- source_word: כָּל דִּבְרֵי סֵפֶר הַבְּרִית
  english_pob_choice: all the words of the book of the covenant
  chosen_korean: 언약책의 모든 말씀
  alternatives_korean:
  - 언약서의 모든 말
  - 언약 책의 모든 말씀
  lexicon: HALOT
  rationale: דִּבְרֵי를 ‘말씀’으로, סֵפֶר הַבְּרִית를 ‘언약책’으로 옮겨 문서의 내용과 책의 성격을 함께 살렸습니다.
theological_decisions:
- issue: 야훼 고유명사의 처리
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 일관되게 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 신명기적 언약 갱신 맥락에서 하나님의 언약 이름을 직접 사용하므로, 칭호로 대체하지 않고 고유명을 보존하는 것이 원문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 'POB contested terms: יְהוָה → 야훼'
- issue: 유다 백성의 범위와 남성 분배적 표현
  chosen_reading: ‘유다의 모든 남자’와 뒤이은 ‘모든 백성, 곧 큰 자부터 작은 자까지’를 함께 살려 전체 회중을 포괄적으로 드러냈습니다.
  alternative_readings:
  - 유다 사람들
  - 유다의 모든 이들
  rationale: 원문은 먼저 분배적 남성 표현을 쓰고, 이어서 전체 백성을 명시합니다. 두 층위를 모두 보존해야 표현상의 긴장을 지우지 않습니다.
  doctrine_reference: 'Translation philosophy: gender-accurate over gender-neutral'
