  to: 그때 왕은 야훼의 집으로 올라갔습니다. 유다의 모든 남자[a]와 예루살렘의 주민들과 제사장들과 레위 사람들과 모든 백성, 곧 큰 자부터 작은 자까지도 올라갔습니다. 왕은 야훼[b]의 집에서 발견된 언약책의 모든 말씀을 그들이 듣는 데서 읽었습니다.
