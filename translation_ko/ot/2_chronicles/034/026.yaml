  lexicon: HALOT
  rationale: 분사구를 한국어에서 수식절보다 서술적 연결로 처리해, 왕이 사절단을 보냈다는 표지를 자연스럽게 살렸습니다.
- source_word: לִדְרֹשׁ בַּיהוָה
  english_pob_choice: to inquire of Yahweh
  chosen_korean: 야훼께 여쭙게
  alternatives_korean:
