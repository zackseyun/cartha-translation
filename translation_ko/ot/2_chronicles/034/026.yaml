  lexicon: HALOT
  rationale: דרשׁ ב의 예언적·신탁적 용법을 ‘여쭙다’로 옮겨 단순한 신앙적 ‘찾음’보다 문의/조회의 성격을 살렸습니다.
- source_word: כֹּה תֹאמְרוּ אֵלָיו / כֹּה אָמַר יְהוָה
  english_pob_choice: thus you shall say to him / Thus says Yahweh
  chosen_korean: 너희는 이렇게 말해야 합니다… 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 너희는 그에게 이렇게 말하십시오… 야훼께서 이같이 말씀하십니다
  - 너희는 그에게 이렇게 전해야 합니다… 야훼께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 사자 공식은 한국어에서 ‘이렇게 말해야 합니다’ / ‘이렇게 말씀하십니다’로 옮겨 공식성을 유지했습니다. 전통적 ‘이같이’보다 현대 문체를 택했습니다.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  english_pob_choice: As for the words that you have heard—
  chosen_korean: 네가 들은 그 말씀들에 관하여—
  alternatives_korean:
