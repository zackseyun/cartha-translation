  source_fidelity: 히브리어의 접속사, 유다 왕을 수식하는 분사구, 야훼께 묻기 위한 파견, 이중 사자 공식, 그리고 다음 절로 이어지는 화제 선취 구문을 유지했습니다. 다만 초안의 대시를 사용한 반복 동격은 문장 구조를 불필요하게 흔들고, ‘그에게’가 빠져 있어 보완했습니다.
  naturalness: ‘유다 왕에게—…그 왕에게—’라는 중복·삽입 구조 대신 자연스러운 현대 한국어 수식절로 정리했습니다. 인용문 안의 중첩 인용부호도 제거하여 예언 신탁의 범위를 명료하게 했습니다.
  terminology: יְהוָה는 프로젝트 결정에 따라 ‘야훼’로 유지했습니다. דרשׁ ב는 이 문맥에서 ‘야훼께 여쭈어 보다’로 옮기고, 대안적 ‘찾다’ 의미는 각주에 보존했습니다. ‘말씀들’은 여기서 들은 하나님의 말씀이라는 문맥에 자연스럽습니다.
