  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְר֣וֹשׁ בַּֽ/יהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
  footnotes:
  - marker: a
    text: Or, 'to seek the LORD' or 'to consult the LORD.' The Hebrew verb can carry both the sense of seeking and of inquiring in a prophetic context.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕에게—너희를 보내어 야훼께 여쭙게 한 그 왕에게—너희는 이렇게 말해야 합니다. 「야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. ‘네가 들은 그 말씀들에 관하여—’」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼께 여쭙게’는 히브리어 דרשׁ ב의 예언적 문맥에서 ‘찾다/문의하다’의 중첩 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: the king of Judah
  chosen_korean: 유다 왕
  alternatives_korean:
  - 유다의 왕
  - 유다의 임금
  lexicon: HALOT
  rationale: 히브리어 관용적 소유 관계를 자연스러운 한국어 관형구로 옮겼습니다. ‘임금’은 고어적이어서 현대 합쇼체 문맥에는 덜 적합합니다.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  english_pob_choice: who sent you
  chosen_korean: 너희를 보내어
  alternatives_korean:
  - 너희를 보낸
  - 너희를 보내신
  lexicon: HALOT
  rationale: 분사구를 한국어에서 수식절보다 서술적 연결로 처리해, 왕이 사절단을 보냈다는 표지를 자연스럽게 살렸습니다.
- source_word: לִדְרֹשׁ בַּיהוָה
  english_pob_choice: to inquire of Yahweh
  chosen_korean: 야훼께 여쭙게
  alternatives_korean:
  - 야훼를 찾게
  - 야훼께 묻기 위해
  lexicon: HALOT
  rationale: דרשׁ ב의 예언적·신탁적 용법을 ‘여쭙다’로 옮겨 단순한 신앙적 ‘찾음’보다 문의/조회의 성격을 살렸습니다.
- source_word: כֹּה תֹאמְרוּ אֵלָיו / כֹּה אָמַר יְהוָה
  english_pob_choice: thus you shall say to him / Thus says Yahweh
  chosen_korean: 너희는 이렇게 말해야 합니다… 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 너희는 그에게 이렇게 말하십시오… 야훼께서 이같이 말씀하십니다
  - 너희는 그에게 이렇게 전해야 합니다… 야훼께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 사자 공식은 한국어에서 ‘이렇게 말해야 합니다’ / ‘이렇게 말씀하십니다’로 옮겨 공식성을 유지했습니다. 전통적 ‘이같이’보다 현대 문체를 택했습니다.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  english_pob_choice: As for the words that you have heard—
  chosen_korean: 네가 들은 그 말씀들에 관하여—
  alternatives_korean:
  - 네가 들은 말씀들에 대하여—
  - 네가 들은 그 말들에 관하여—
  lexicon: HALOT
  rationale: 히브리어의 화제 선취/좌측 이동을 한국어의 ‘…에 관하여—’로 반영해 다음 절로 이어지는 미완결성을 보존했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 고유명사를 본문층에서 드러내기 위해 ‘야훼’를 사용했고, 예언문 공식인 ‘야훼께서 이렇게 말씀하십니다’로 일관했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
