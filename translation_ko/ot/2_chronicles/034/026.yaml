  revised_text: 유다 왕, 곧 야훼께 여쭈어 보게 하려고 너희를 보낸 왕에게는 이렇게 말해야 합니다. 「이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. 네가 들은 그 말씀들에 관하여—」
