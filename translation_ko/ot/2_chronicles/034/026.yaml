  - 네가 들은 그 말들에 관하여—
  lexicon: HALOT
  rationale: 히브리어의 화제 선취/좌측 이동을 한국어의 ‘…에 관하여—’로 반영해 다음 절로 이어지는 미완결성을 보존했습니다.
