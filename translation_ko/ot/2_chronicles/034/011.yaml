  lexicon: WLC/HALOT
  rationale: 이전 문맥의 자금을 가리키는 목적어를 한국어에서 보충해 자연스럽게 옮겼습니다.
- source_word: חָרָשִׁים
  english_pob_choice: craftsmen
  chosen_korean: 장인들
  alternatives_korean:
  - 기술자들
  - 공예가들
  lexicon: HALOT
  rationale: 건축 현장의 숙련된 작업자를 넓게 가리키므로, 좁은 직종명보다 ‘장인들’이 적절합니다.
- source_word: בֹּנִים
  english_pob_choice: builders
  chosen_korean: 건축자들
  alternatives_korean:
  - 건설하는 사람들
  - 건축공들
  lexicon: HALOT
  rationale: בנה의 분사적 용례를 살려, 단순히 ‘사람들’보다 건축 행위의 담당자를 드러냈습니다.
- source_word: אַבְנֵי מַחְצֵב
  english_pob_choice: quarried stone
  chosen_korean: 다듬은 돌
  alternatives_korean:
  - 채석한 돌
  - 채석장에서 나온 돌
  lexicon: HALOT
  rationale: 본문의 핵심은 건축용으로 준비된 돌이라는 점이므로, 자연스러운 한국어로는 채석·가공된 돌의 의미를 살려 표현했습니다.
- source_word: לַמְחַבְּרוֹת
  english_pob_choice: for the joining work
  chosen_korean: 구조를 위한
  alternatives_korean:
  - 이음 작업을 위한
  - 결합부를 위한
  - 맞춤 작업을 위한
  lexicon: HALOT
  rationale: 이 어휘는 의미가 확실하지 않지만 구조적 결합이나 맞춤을 가리킬 가능성이 있어, 과도한 구체화를 피하면서 기능을 드러냈습니다.
- source_word: וּלְקָרוֹת
  english_pob_choice: for roofing
  chosen_korean: 집들의
  alternatives_korean:
  - 지붕을 위한
  - 덮개를 위한
  lexicon: HALOT
  rationale: 문맥상 목재는 지붕 덮기와 구조용 모두에 쓰이므로, ‘집들의 구조’로 묶어 자연스럽게 처리했습니다.
- source_word: הַבָּתִּים
  english_pob_choice: the buildings
  chosen_korean: 집들
  alternatives_korean:
  - 건물들
  - 성전 건물들
  lexicon: HALOT
  rationale: 성전 수리 문맥이지만 בית의 기본 의미를 살려 ‘집들’로 옮기되, 한국어 문장에서는 구조물 전체를 가리키는 표현으로 처리했습니다.
- source_word: הִשְׁחִיתוּ
  english_pob_choice: had ruined
  chosen_korean: 허물어 버린
  alternatives_korean:
  - 망가뜨린
  - 파괴한
  - 훼손한
  lexicon: HALOT
  rationale: 단순한 손상보다 이전 왕들이 성전 관련 구조를 파손·황폐화시킨 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 성전 수리 대상의 표현 범위
  chosen_reading: ‘집들의 구조’로 옮겨, 본문의 건축·보수 맥락을 살리면서도 특정 건축 부위를 과도하게 단정하지 않았습니다.
  alternative_readings:
  - 성전 건물들
  - 지붕과 들보
  rationale: 히브리어의 구조 용어가 다소 불확실하므로, 한국어에서도 기능적 의미를 유지하되 세부는 열어 두는 것이 적절합니다.
  doctrine_reference: 본문 비신학적 기술어 처리
