    rationale: מֵבִין은 이 문맥에서 악기에 능숙한 사람을 뜻하며, 직역 설명도 ‘노래에 쓰는 악기에 능숙한 모든 이’처럼 문맥상 자연스럽고 정확하게 제시하는 편이 낫습니다.
