revisions:
- from: 그리고 사람들은 그 일에서 성실하게 일하고 있었습니다[a]. 그들 위에는 야핫과 오바댜 — 므라리 자손의 레위 사람들 — 와 스가랴와 므술람 — 고핫 자손의 레위 사람들 — 이 임명되어 있었고, 악기를 다룰 줄 아는 모든 레위 사람들은 음악을 맡아 감독했습니다[b].
  to: 사람들은 그 일을 성실하게 하고 있었습니다. 그들을 감독하도록[a] 므라리 자손 레위 사람들인 야핫과 오바댜, 그리고 고핫 자손 레위 사람들인 스가랴와 므술람이 임명되어 있었습니다. 또한 레위 사람들은 모두 노래에 쓰는 악기에 능숙했습니다[b].
  rationale: 감독하도록 임명된 네 사람과 악기에 능숙한 레위 사람들을 문법적으로 분리하여, 원문의 행정적 감독과 악기 숙련에 관한 진술을 혼동하지 않도록 했습니다. 원문의 마지막 동사 없는 구절은 한국어 문장 성립을 위해 ‘능숙했습니다’로 최소한 보완했으며, 음악 연주나 음악 감독이라는 추가 역할은 넣지 않았습니다. 각주의 위치와 내용도 해당 히브리어 표현에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
