review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 악기에 능숙한 레위 사람들이 ‘음악을 맡아 감독했다’고 하여, 히브리어의 לְנַצֵּחַ(감독하도록)를 앞서 열거된 임명자들과 분리하고 음악 담당이라는 역할을 덧붙였습니다. 본문은 야핫·오바댜·스가랴·므술람이 사람들을 감독하도록 임명되었다고 말한 뒤, 악기에 능숙한 레위 사람들을 덧붙입니다. 마지막 절반은 히브리어에서 동사가 없는 명사구이므로, 한국어에서는 최소한의 서술어로 자연스럽게 보완했습니다.
  naturalness: ‘그들 위에는’과 대시로 겹겹이 삽입한 동격 구조는 현대 한국어 산문에서 다소 부자연스럽습니다. 감독 대상은 ‘그들을 감독하도록’으로, 계보·소속은 쉼표 뒤 동격으로 정리하면 명확하고 자연스럽습니다.
  terminology: 인명과 레위 지파 명칭(야핫, 오바댜, 므라리, 스가랴, 므술람, 고핫)은 표준적인 성경식 한국어 표기를 유지했습니다. ‘노래에 쓰는 악기’는 כְּלֵי שִׁיר의 용도를 보존하면서도 자연스럽습니다.
  issues:
  - severity: high
    issue: 악기에 능숙한 레위 사람들이 음악을 맡아 감독했다는 역할을 추가했습니다.
    rationale: לְנַצֵּחַ는 야핫·오바댜·스가랴·므술람이 임명된 목적을 나타냅니다. 악기에 능숙한 레위 사람들을 ‘음악을 맡아 감독했다’고 연결하는 것은 히브리어에 없는 역할 배정이며, 감독의 대상을 바꿉니다.
