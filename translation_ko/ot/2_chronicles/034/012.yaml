  text: וְ/הָ/אֲנָשִׁים֩ עֹשִׂ֨ים בֶּ/אֱמוּנָ֜ה בַּ/מְּלָאכָ֗ה וַ/עֲלֵי/הֶ֣ם מֻ֠פְקָדִים יַ֣חַת וְ/עֹבַדְיָ֤הוּ הַ/לְוִיִּם֙ מִן בְּנֵ֣י מְרָרִ֔י וּ/זְכַרְיָ֧ה וּ/מְשֻׁלָּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים לְ/נַצֵּ֑חַ וְ/הַ֨/לְוִיִּ֔ם כָּל מֵבִ֖ין בִּ/כְלֵי שִֽׁיר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
  footnotes:
  - marker: a
    text: Or 'to direct'; the Hebrew verb can denote supervisory leadership.
    reason: lexical_alternative
  - marker: b
    text: Literally 'all understanding in instruments of song,' that is, all who were skilled with musical instruments.
    reason: lexical_alternative
translation:
  language: ko
  text: 사람들은 그 일을 성실하게 하고 있었습니다. 그들을 감독하도록[a] 므라리 자손 레위 사람들인 야핫과 오바댜, 그리고 고핫 자손 레위 사람들인 스가랴와 므술람이 임명되어 있었습니다. 또한 레위 사람들은 모두 노래에 쓰는 악기에 능숙했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지휘하도록’; 히브리어 동사는 감독하는 지도력을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘노래에 쓰는 악기에 능숙한 모든 이들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  english_pob_choice: faithfully
  chosen_korean: 성실하게
  alternatives_korean:
  - 신실하게
  - 충성스럽게
  lexicon: HALOT
  rationale: 여기서 אֱמוּנָה는 믿음의 주관적 태도보다 일의 수행 방식인 신실성/성실함을 나타내므로, 현대 한국어에서 자연스러운 ‘성실하게’가 문맥을 잘 살립니다.
- source_word: מֻפְקָדִים
  english_pob_choice: were appointed
  chosen_korean: 임명되어 있었고
  alternatives_korean:
  - 맡겨져 있었고
  - 임명받아 있었고
  lexicon: HALOT
  rationale: 수동 분사로서 책임을 부여받은 상태를 나타내므로, POB의 ‘were appointed’를 따라 ‘임명되어 있었고’로 옮겨 직무 지정의 수동성을 유지했습니다.
- source_word: לְנַצֵּחַ
  english_pob_choice: to oversee
  chosen_korean: 감독했습니다
  alternatives_korean:
  - 감독하도록
  - 지휘하도록
  lexicon: HALOT
  rationale: 이 동사는 단순한 음악 지휘에만 한정되지 않고 여기서는 업무를 총괄하는 감독의 의미가 강하므로, ‘감독했습니다’가 문맥상 가장 분명합니다.
- source_word: כָּל מֵבִין בִּכְלֵי שִׁיר
  english_pob_choice: all who were skilled with musical instruments
  chosen_korean: 악기를 다룰 줄 아는 모든 레위 사람들
  alternatives_korean:
  - 노래의 악기에 통달한 모든 사람들
  - 음악 도구를 이해하는 모든 사람들
  lexicon: HALOT
  rationale: 직역의 ‘이해하는 모든 사람’은 한국어에서 어색하므로, כלי שיר의 기능적 의미를 살려 악기 연주 기술이 있는 사람들로 풀었습니다.
theological_decisions:
- issue: 레위 사람들의 역할을 음악적 연주와 행정적 감독으로 함께 드러낼지 여부
  chosen_reading: 본문은 레위 사람들 가운데 일부는 공사를 감독하고, 나머지 레위 사람들은 악기를 다룰 줄 아는 자들로 음악을 맡았다는 구분을 드러낸다고 보아 이중 구조를 살렸습니다.
  alternative_readings:
  - 레위 사람들 전체를 단순히 음악 담당으로만 읽는 것
  - 감독 역할을 음악 지휘로만 한정하는 것
  rationale: 히브리어는 먼저 임명된 감독자들을 말한 뒤, 별도로 ‘모든 악기 이해자’들을 덧붙입니다. 이 구분을 흐리지 않아야 본문의 행정적·예배적 구성이 함께 보입니다.
  doctrine_reference: 역대하 34장 문맥의 성전 수리와 레위 직무 배치
