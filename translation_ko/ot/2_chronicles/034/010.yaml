revisions:
- from: 그들은 그 돈을 야훼의 집을 맡아 감독하는 일꾼들의 손에 넘겼습니다. 그리고 야훼의 집에서 일하는 일꾼들은 그 돈을 집을 수리하고 견고하게 하는 데 썼습니다.[a][b]
  to: 그들은 그 돈을 야훼의 집[b]을 감독하도록 임명된 사람들의 손에 넘겼습니다. 그들은 그것을 야훼의 집에서 일하는 일꾼들에게 주어, 그 집을 수리하고 견고하게 하게 했습니다.[a]
  rationale: 둘째 절의 반복된 '주다'를 한국어에서도 전달 행위로 보존하고, 감독자로 임명된 이들과 실제 작업자들을 구별했습니다. 원문에는 직접적으로 '하게 했다'가 없으나, '일꾼들에게 주어'와 목적 부정사구의 관계를 자연스러운 한국어 문장으로 연결한 것입니다. 각주 표지도 각각의 대상 어구에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:19:49Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 '그 돈'은 앞 문맥을 따라 자연스럽게 보충할 수 있고, '야훼의 집' 및 수리·보강의 뜻도 대체로 충실합니다. 그러나 두 번째 וַיִּתְּנוּ אֹתוֹ는 일꾼들이 돈을 '썼다'는 뜻이 아니라 그들이 그것을 작업자들에게 '주었다/넘겼다'는 전달 행위를 말합니다. 또한 첫 수령자는 감독하도록 임명된 이들이고, 둘째는 실제 작업을 하는 이들이므로 구별하는 것이 안전합니다.
  naturalness: '''맡아 감독하는 일꾼들''은 감독자와 작업자를 한 집단처럼 보이게 할 수 있습니다. ''감독하도록 임명된 사람들''과 ''일하는 일꾼들''로 구별하면 현대 한국어로도 자연스럽고 원문의 역할 구분이 분명합니다. ''그 집''은 앞의 ''야훼의 집''을 자연스럽게 받습니다.'
  terminology: 야훼(יְהוָה), '야훼의 집'(בֵּית יְהוָה), '수리하고 견고하게 하다'(לִבְדּוֹק וּלְחַזֵּק)의 선택은 적절합니다. 각주 a는 해당 표현에, 각주 b는 '야훼의 집'에 붙여야 합니다.
  issues:
