  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
  footnotes:
  - marker: a
    text: Or 'for restoring and reinforcing the house.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house of the LORD,' that is, the temple.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 그 돈을 야훼의 집을 맡아 감독하는 일꾼들의 손에 넘겼습니다. 그리고 야훼의 집에서 일하는 일꾼들은 그 돈을 집을 수리하고 견고하게 하는 데 썼습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집을 수리하고 보강하는 데’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼의 집’, 곧 성전입니다.
    reason: cultural_note
lexical_decisions:
- source_word: עַל יַד
  english_pob_choice: into the hand of
  chosen_korean: …의 손에 넘겼습니다
  alternatives_korean:
  - …의 관할에 맡겼습니다
  - …에게 인계했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 누군가의 관리와 처분 아래 두는 뜻이므로, 한국어에서는 구체적 이미지인 ‘손에’와 ‘넘기다’를 살려 전달했습니다.
- source_word: עֹשֵׂה הַמְּלָאכָה / עוֹשֵׂי הַמְּלָאכָה
  english_pob_choice: the workmen
  chosen_korean: 일꾼들
  alternatives_korean:
  - 일하는 사람들
  - 노동자들
  lexicon: HALOT
  rationale: 성전 보수 작업의 문맥에서 직역보다 자연스럽고, 원문의 작업 담당자라는 구체적 직무감을 유지하는 표현으로 ‘일꾼들’을 택했습니다.
- source_word: הַמֻּפְקָדִים
  english_pob_choice: who were appointed over
  chosen_korean: …을 맡아 감독하는
  alternatives_korean:
  - …에 임명된
  - …을 감독하도록 세워진
  lexicon: HALOT
  rationale: 수동 분사는 단순한 임명이 아니라 책임 있는 감독 직분을 가리키므로, 한국어에서는 ‘맡아 감독하는’으로 책임의 뉘앙스를 분명히 했습니다.
- source_word: לִבְדּוֹק וּלְחַזֵּק
  english_pob_choice: for repairing and strengthening
  chosen_korean: 수리하고 견고하게 하는 데
  alternatives_korean:
  - 수선하고 보강하는 데
  - 고치고 강화하는 데
  lexicon: HALOT
  rationale: בדק는 건물 수리의 맥락에서 ‘수리하다’가 적절하고, חזק은 구조를 더 단단하게 한다는 뜻이므로 ‘견고하게 하다’로 물리적 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 이 전승은 언약명 YHWH를 제목어가 아닌 고유명으로 드러내기 위해 프로젝트 기본값인 ‘야훼’를 따랐습니다.
theological_decisions:
- issue: בֵּית יְהוָה의 한국어 처리
  chosen_reading: ‘야훼의 집’으로 옮기되, 문맥상 성전을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘야훼의 성전’
  - ‘주님의 집’
  rationale: 히브리어 원문은 직역상 ‘집’이므로 이를 보존했고, 독자가 문맥상 성전을 이해할 수 있도록 별도 의역으로 대체하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: contested terms — בַּיִת יְהוָה'
- issue: 작업 반복의 뉘앙스
  chosen_reading: ‘집을 수리하고 견고하게 하는 데’로 반복적 작업성과 최종적 보강을 함께 드러냈습니다.
  alternative_readings:
  - ‘집을 고치고 튼튼하게 하는 데’
  - ‘집을 보수하고 강화하는 데’
  rationale: 두 부정사 לִבְדּוֹק וּלְחַזֵּק의 병렬 구조를 살려, 단순 보수와 구조적 보강이 모두 포함됨을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: source-structure preservation'
