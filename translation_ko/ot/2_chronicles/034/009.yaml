base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the doorkeepers' or 'the gatekeepers'; literally 'the keepers of the threshold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그들이 대제사장 힐기야에게 와서, 하나님의 집으로 가져온 돈을 넘겨주었습니다. 그 돈은 문지기를 맡은 레위 사람들[a]이 므낫세와 에브라임과 이스라엘의 남은 사람들, 그리고 온 유다와 베냐민과 예루살렘 주민들에게서 모은 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘문지방을 지키는 사람들’입니다. 영어 POB의 주석처럼 ‘문지기들/문간지기들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 수제사장
  lexicon: HALOT
  rationale: 공적 직함으로 굳어진 대응어를 사용해 제사장 서열의 최고 직분을 자연스럽게 드러냈습니다.
- source_word: הַכֶּסֶף
  english_pob_choice: the money
  chosen_korean: 돈
  alternatives_korean:
  - 은
  - 은돈
  lexicon: HALOT
  rationale: 문맥상 성전 헌금으로 전달되는 재화를 가리키므로, 현대 한국어에서는 문자적 ‘은’보다 ‘돈’이 의미를 더 분명하게 전달합니다.
- source_word: שֹׁמְרֵי הַסַּף
  english_pob_choice: the keepers of the threshold
  chosen_korean: 문지기를 맡은
  alternatives_korean:
  - 문지기들
  - 문간을 지키는 사람들
  - 임계석을 지키는 사람들
  lexicon: HALOT
  rationale: ‘threshold’의 직역 이미지를 살리면서도 한국어 독자가 기능을 이해하도록 ‘문지기’를 기본 의미로 풀었습니다. 영어 POB의 각주 취지를 본문에는 과도하게 낯설지 않게 반영했습니다.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  english_pob_choice: the remnant of Israel
  chosen_korean: 이스라엘의 남은 사람들
  alternatives_korean:
  - 이스라엘의 남은 자
  - 이스라엘의 남은 무리
  lexicon: HALOT
  rationale: ‘remnant’의 언약사적 무게를 살릴 수 있지만, 여기서는 과도한 신학적 고정 없이 자연스러운 현대어 표현으로 옮겼습니다.
theological_decisions:
- issue: שְׁאֵרִית('remnant')의 신학적 뉘앙스
  chosen_reading: 이스라엘의 남은 사람들
  alternative_readings:
  - 이스라엘의 남은 자
  - 이스라엘의 남은 무리
  rationale: 역대기 문맥에서 북이스라엘 지파의 생존자/잔존 집단을 가리킬 수 있으므로, ‘남은 사람들’로 번역해 집합적 의미를 유지하되 더 강한 구속사적 선언으로 확정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
