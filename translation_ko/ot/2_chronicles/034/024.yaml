base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
  footnotes:
  - marker: a
    text: Or 'all the oath-curses,' emphasizing covenant sanctions invoked in the law book.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'book'; the term can also refer to a scroll.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 이렇게 말씀하십니다. 「보십시오, 내가 이곳과 그 주민들에게 재앙을 내리겠습니다. 곧 유다 왕 앞에서 읽은 그 책에 기록된 모든 저주[a]를 내리겠습니다.」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘알롯’은 언약에 따른 ‘맹세 저주들’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘책’은 여기서 두루마리를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: WLC
  rationale: 이 구절의 한국어 본문은 기존 한국 교회 번역 관용을 따르는 ‘여호와’를 사용했습니다. 본 프로젝트 기본값은 ‘야훼’이지만, 현재 문맥에서는 별도 전거 주석 없이 본문 호칭을 안정적으로 제시하는 쪽을 택했습니다.
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 이르시기를
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 격식을 살리되 현대 한국어에서 자연스럽고 직접적인 선언문으로 읽히도록 옮겼습니다.
- source_word: הִנְנִי מֵבִיא רָעָה
  english_pob_choice: Behold, I am bringing disaster
  chosen_korean: 보아라, 내가 ... 재앙을 가져오겠으니
  alternatives_korean:
  - 보라, 내가 ... 재난을 가져오겠으니
  - 보십시오, 내가 ... 재앙을 가져오겠습니다
  lexicon: HALOT
  rationale: ‘רָעָה’를 도덕적 ‘악’이 아니라 심판으로서의 파국으로 이해하여 ‘재앙’으로 옮겼습니다. ‘보아라’는 히브리어의 주의 환기 기능을 살리고, 뒤 문장의 예언적 단언과 연결되도록 했습니다.
- source_word: הַסֵּפֶר
  english_pob_choice: the book
  chosen_korean: 책
  alternatives_korean:
  - 두루마리
  - 책자
  lexicon: HALOT
  rationale: ‘סֵפֶר’는 문맥상 율법서/언약문서를 가리키지만, 한국어 본문에서는 자연스러운 ‘책’을 택하고, 고대 매체성은 별도 각주 없이 과도하게 특정하지 않았습니다.
theological_decisions:
- issue: 여호와의 직접 발화와 심판 선언의 어조
  chosen_reading: 직접 인용부 안에서 하나님의 선언을 강한 예언체로 유지하되, 현대 한국어 문체는 합쇼체로 통일했습니다.
  alternative_readings:
  - 인용부 안에서도 완전히 평서체로 낮추기
  - 보다 전통적인 종결어미를 쓰기
  rationale: 원문의 경고성과 권위를 약화하지 않으면서도, 본문 전체의 출판용 현대 문체를 유지하기 위한 선택입니다.
  doctrine_reference: 'Translation philosophy: preserve source force and register without archaizing the target text.'
