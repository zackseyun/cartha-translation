  to: 여호와께서 이렇게 말씀하십니다. 「보십시오, 내가 이곳과 그 주민들에게 재앙을 내리겠습니다. 곧 유다 왕 앞에서 읽은 그 책에 기록된 모든 저주[a]를 내리겠습니다.」[b]
