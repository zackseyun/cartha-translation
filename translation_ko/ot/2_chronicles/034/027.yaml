- source_word: דְּבָרָיו
  english_pob_choice: his words
  chosen_korean: 그의 말씀
  alternatives_korean:
  - 그의 말들
  - 그의 말씀들
  - 그의 이야기
  lexicon: HALOT
  rationale: 문맥상 하나님이 말씀하신 심판 선언을 가리키므로 단수적·권위적 뉘앙스가 있는 ‘말씀’이 적절합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
