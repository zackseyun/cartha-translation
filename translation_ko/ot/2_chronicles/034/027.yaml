  - 스스로를 낮추었으며
  lexicon: HALOT
  rationale: 반사적 뉘앙스를 살리면서 한국어에서 하나님 앞의 태도를 가장 자연스럽게 드러내는 표현은 ‘자신을 낮추다’입니다.
- source_word: מִלִּפְנֵי אֱלֹהִים / לְפָנַי
  english_pob_choice: before God / before me
