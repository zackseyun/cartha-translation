base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'your heart was soft.' The Hebrew idiom describes a receptive, humbled inner disposition.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 네 마음이 부드러웠고[a], 네가 하나님 앞에서 자신을 낮추었으며, 이곳과 그 주민들에 대하여 전해진 그의 말씀을 들었을 때 네가 내 앞에서 자신을 낮추고 네 옷을 찢으며 내 앞에서 울었기 때문이다. 나도 너의 말을 들었다. 야훼의 선언입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 마음이 부드러웠다’. 히브리어 관용구는 수용적이고 겸손한 내면 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַךְ לְבָבְךָ
  english_pob_choice: your heart was tender
  chosen_korean: 네 마음이 부드러웠고
  alternatives_korean:
  - 네 마음이 연했고
  - 네 마음이 온화했고
  - 네 마음이 부드러웠다
  lexicon: HALOT
  rationale: 히브리어 관용구는 내면의 수용성과 겸손을 가리키므로, 직역적이면서도 현대 한국어에서 자연스러운 ‘부드럽다’를 택했습니다.
- source_word: וַתִּכָּנַע
  english_pob_choice: you humbled yourself
  chosen_korean: 자신을 낮추었으며
  alternatives_korean:
  - 겸손해졌으며
  - 자신을 낮추었으며
  - 스스로를 낮추었으며
  lexicon: HALOT
  rationale: 반사적 뉘앙스를 살리면서 한국어에서 하나님 앞의 태도를 가장 자연스럽게 드러내는 표현은 ‘자신을 낮추다’입니다.
- source_word: מִלִּפְנֵי אֱלֹהִים / לְפָנַי
  english_pob_choice: before God / before me
  chosen_korean: 하나님 앞에서 / 내 앞에서
  alternatives_korean:
  - 하나님 앞에서 / 내 면전에서
  - 하나님 앞에 / 내 앞에
  lexicon: HALOT
  rationale: 히브리어의 ‘앞에서’ 반복을 유지해 경외와 직접성을 살렸습니다.
- source_word: דְּבָרָיו
  english_pob_choice: his words
  chosen_korean: 그의 말씀
  alternatives_korean:
  - 그의 말들
  - 그의 말씀들
  - 그의 이야기
  lexicon: HALOT
  rationale: 문맥상 하나님이 말씀하신 심판 선언을 가리키므로 단수적·권위적 뉘앙스가 있는 ‘말씀’이 적절합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
  - 야훼의 말씀이십니다
  - 야훼의 말씀입니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언자적 종결 공식의 무게를 살리기 위해 ‘선언입니다’를 택했고, 본문의 신명기적 고유명사는 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 예언자적 종결 공식에서 יְהוָה의 처리
  chosen_reading: 본문 끝의 יְהוָה는 이름 자체를 드러내는 ‘야훼’로 옮기고, 뒤의 נְאֻם은 ‘선언입니다’로 번역했습니다.
  alternative_readings:
  - ‘주님께서 말씀하신다’식의 관용적 대체
  - ‘야훼께서 말씀하신다’
  rationale: 이 절은 심판 선언의 권위를 강조하는 직접 인용이므로, 전통적 대체어보다 신명기적 이름을 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
