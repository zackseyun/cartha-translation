  lexicon: HALOT
  rationale: 예언자적 종결 공식의 무게를 살리기 위해 ‘선언입니다’를 택했고, 본문의 신명기적 고유명사는 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 예언자적 종결 공식에서 יְהוָה의 처리
  chosen_reading: 본문 끝의 יְהוָה는 이름 자체를 드러내는 ‘야훼’로 옮기고, 뒤의 נְאֻם은 ‘선언입니다’로 번역했습니다.
  alternative_readings:
  - ‘주님께서 말씀하신다’식의 관용적 대체
  - ‘야훼께서 말씀하신다’
  rationale: 이 절은 심판 선언의 권위를 강조하는 직접 인용이므로, 전통적 대체어보다 신명기적 이름을 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
