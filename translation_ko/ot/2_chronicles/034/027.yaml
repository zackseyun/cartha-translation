base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'your heart was soft.' The Hebrew idiom describes a receptive, humbled inner disposition.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 네 마음이 부드러웠고[a], 이곳과 그 주민들을 심판하겠다고 하신 그의 말씀을 들었을 때 네가 하나님 앞에서 자신을 낮추었으며, 또 내 앞에서 자신을 낮추고 네 옷을 찢으며 내 앞에서 울었기 때문입니다. 나도 들었습니다. 야훼의 선언입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 마음이 연했다’. 히브리어 관용구는 수용적이고 겸손한 내면 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַךְ לְבָבְךָ
  english_pob_choice: your heart was tender
  chosen_korean: 네 마음이 부드러웠고
  alternatives_korean:
