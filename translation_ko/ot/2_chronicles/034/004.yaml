  text: וַ/יְנַתְּצ֣וּ לְ/פָנָ֗י/ו אֵ֚ת מִזְבְּח֣וֹת הַ/בְּעָלִ֔ים וְ/הַֽ/חַמָּנִ֛ים אֲשֶׁר לְ/מַ֥עְלָ/ה מֵ/עֲלֵי/הֶ֖ם גִּדֵּ֑עַ וְ֠/הָ/אֲשֵׁרִים וְ/הַ/פְּסִלִ֤ים וְ/הַ/מַּסֵּכוֹת֙ שִׁבַּ֣ר וְ/הֵדַ֔ק וַ/יִּזְרֹק֙ עַל פְּנֵ֣י הַ/קְּבָרִ֔ים הַ/זֹּבְחִ֖ים לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
  footnotes:
  - marker: a
    text: Or, 'the sun-pillars.' The Hebrew term is uncertain and may refer to cultic pillars associated with sun worship.
    reason: lexical_alternative
  - marker: b
    text: Or, 'the Asherah poles.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그의 앞에서 바알들의 제단들을 허물었고, 그는 그 위에 있던 분향 제단들[a]을 잘라 냈습니다. 또 아세림[b]과 새긴 형상들과 부어 만든 형상들을 깨뜨리고 가루가 되도록 부수어, 그것들을 그들에게 제물을 바치던 사람들의 무덤 위에 뿌렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘태양 기둥들’입니다. 히브리어 용어는 불확실하며, 태양 숭배와 관련된 제의 기둥을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아세라 기둥들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתְּצוּ לְפָנָיו
  english_pob_choice: they tore down before him
  chosen_korean: 그는 … 그의 앞에서 무너뜨리고
  alternatives_korean:
  - 그가 … 그의 앞에서 허물고
  - 그들이 … 그의 앞에서 무너뜨리고
  lexicon: HALOT
  rationale: 히브리어 동사는 구조물을 힘 있게 허무는 뜻이므로 ‘무너뜨리다’가 자연스럽고, לְפָנָיו는 조시야의 현장 앞이라는 점을 살려 ‘그의 앞에서’로 옮겼습니다.
- source_word: הַחַמָּנִים
  english_pob_choice: the incense altars
  chosen_korean: 분향단들
  alternatives_korean:
  - 해상 기둥들
  - 태양 기둥들
  - 향 제단들
  lexicon: HALOT
  rationale: 이 단어는 어휘적으로 불확실하므로, 본문 문맥에 맞는 제의 기구로서 ‘분향단들’을 본문에 두고, 가능성이 있는 다른 해석은 따로 보존했습니다.
- source_word: הָאֲשֵׁרִים
  english_pob_choice: the Asherim
  chosen_korean: 아세라 목상들
  alternatives_korean:
  - 아세라 기둥들
  - 아세림
  lexicon: HALOT
  rationale: POB의 ‘Asherim’은 숭배 대상과 관련된 제의 물건의 모호함을 남기기 위해 음역을 유지하지만, 한국어 본문에서는 독자가 이해하기 쉬운 ‘아세라 목상들’로 옮겨 그 제의적 물체성을 드러냈습니다.
- source_word: הַפְּסִלִים וְהַמַּסֵּכוֹת
  english_pob_choice: the carved images, and the metal images
  chosen_korean: 조각한 우상들과 주조한 우상들
  alternatives_korean:
  - 새긴 우상들과 부어 만든 우상들
  - 조각상들과 주상
  lexicon: HALOT
  rationale: פְּסִלִים와 מַסֵּכוֹת은 각각 새긴/조각한 형상과 주조한 금속 형상을 가리키므로, 재료와 제작 방식을 드러내는 표현으로 나누어 옮겼습니다.
- source_word: וְהֵדַק
  english_pob_choice: and crushed
  chosen_korean: 부수어
  alternatives_korean:
  - 짓부수어
  - 가루 내어
  lexicon: HALOT
  rationale: 히브리어는 단순 파괴를 넘어 잘게 부수는 강한 뉘앙스를 가지므로, 앞의 ‘깨뜨리고’와 함께 ‘부수어’로 연결해 파괴의 강도를 살렸습니다.
theological_decisions:
- issue: 우상 파괴 동사의 강도
  chosen_reading: ‘깨뜨리고 부수어’로 두 단계의 파괴를 구분해, 단순한 철거가 아니라 예배 대상의 완전한 폐기를 드러냈습니다.
  alternative_readings:
  - ‘부수고’로 단순화
  - ‘산산이 부수어’로 과장
  rationale: 본문은 שִׁבַּר와 הֵדַק의 연속으로 강한 파괴를 강조하므로, 한국어에서도 동작을 나눠 그 폭력성과 결단성을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘바알들의 제단들’의 복수성
  chosen_reading: ‘바알들의 제단들’로 복수를 유지해 지역별·형태별 바알 숭배의 다중성을 드러냈습니다.
  alternative_readings:
  - ‘바알의 제단’으로 단수화
  - ‘바알 우상의 제단들’
  rationale: 히브리어 복수형 בְּעָלִים을 단수로 평탄화하면 본문이 가진 다신적·지역적 숭배 현실이 약화되므로, 복수성을 살리는 번역이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §5
