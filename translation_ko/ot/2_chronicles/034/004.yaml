revisions:
- from: 그는 바알들의 제단들을 그의 앞에서 무너뜨리고, 그 제단들 위에 있던 분향단들을 찍어버렸습니다. 또 아세라 목상들과 조각한 우상들과 주조한 우상들을 깨뜨리고 부수어, 그것을 그들에게 제사하던 사람들의 무덤 위에 흩뿌렸습니다.[a][b]
  to: 그들은 그의 앞에서 바알들의 제단들을 허물었고, 그는 그 위에 있던 분향 제단들[a]을 잘라 냈습니다. 또 아세림[b]과 새긴 형상들과 부어 만든 형상들을 깨뜨리고 가루가 되도록 부수어, 그것들을 그들에게 제물을 바치던 사람들의 무덤 위에 뿌렸습니다.
  rationale: 복수형 첫 동사와 뒤따르는 단수형 동사들의 전환을 보존했습니다. 논쟁적인 제의 용어는 영어 POB의 본문 선택과 각주를 존중하되, 아세림은 한국어에서도 음역하여 형태상의 불확실성을 유지했습니다. 각주 표지를 해당 낱말에 직접 연결하고, 파괴 및 살포의 순서를 원문에 맞게 다듬었습니다.
