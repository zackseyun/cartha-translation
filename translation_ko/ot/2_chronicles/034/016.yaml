base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
  footnotes:
  - marker: a
    text: Or, “Everything that was entrusted to your servants, they are carrying out.” The Hebrew idiom is literally “was put into the hand of your servants.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 사반은 그 책을 왕에게 가져와서, 왕에게 다시 보고했습니다. “왕의 종들에게 맡겨진 모든 것[a]을 그들이 하고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕의 종들에게 맡겨진 모든 일을 그들이 수행하고 있습니다.” 히브리어 관용구는 문자적으로 “왕의 종들의 손에 주어진 모든 것”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא ... אֶת הַסֵּפֶר אֶל הַמֶּלֶךְ
  english_pob_choice: brought the book to the king
  chosen_korean: 그 책을 왕에게 가져오고
  alternatives_korean:
  - 그 책을 왕에게 가져왔고
  - 그 책을 왕에게 바치고
  lexicon: HALOT
  rationale: הֵבִיא는 사반이 단순히 오기보다 책을 왕 앞으로 가져온 동작을 나타내므로, 자연스러운 현대어로 '가져오고'를 택했습니다.
- source_word: וַיָּשֶׁב עוֹד אֶת הַמֶּלֶךְ דָּבָר
  english_pob_choice: also brought back word to the king
  chosen_korean: 왕에게 다시 보고하여
  alternatives_korean:
  - 왕에게 또 소식을 전하여
  - 왕에게 다시 말씀드려
  lexicon: HALOT
  rationale: שׁוּב + דָּבָר는 '말/소식/보고를 되돌려 전하다'는 관용구이므로, 문맥상 가장 자연스럽고 공적인 표현인 '다시 보고하여'로 옮겼습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 왕의 종들에게
  alternatives_korean:
  - 왕의 신하들에게
  - 왕의 종들 가운데
  lexicon: HALOT
  rationale: 궁정 문맥에서 עֲבָדֶיךָ는 왕의 종들/시종들을 가리키므로, 본문이 직접 지닌 종속 관계를 살려 '왕의 종들'로 번역했습니다.
- source_word: נִתַּן בְּיַד
  english_pob_choice: was committed into the hand of
  chosen_korean: 맡겨진 것은
  alternatives_korean:
  - 손에 넘겨진 것은
  - 부탁받은 것은
  lexicon: HALOT
  rationale: בְּיַד는 문자적으로 '손에'이지만 한국어에서는 '맡기다'가 이 관용을 가장 자연스럽게 드러내므로, '맡겨진 것'으로 의미를 살렸습니다.
- source_word: הֵם עֹשִׂים
  english_pob_choice: they are doing
  chosen_korean: 그들이 하고 있습니다
  alternatives_korean:
  - 그들이 실행하고 있습니다
  - 그들이 수행하고 있습니다
  lexicon: HALOT
  rationale: 주어 대명사와 분사형의 강조적 지속을 반영해 현재진행형으로 옮겼으며, 원문에 없는 목적어를 덧붙이지 않았습니다.
