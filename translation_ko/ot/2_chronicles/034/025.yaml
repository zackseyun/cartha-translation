reference: 2 Chronicles 34:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי ו/יקטירו לֵֽ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣י יְדֵי/הֶ֑ם וְ/תִתַּ֧ךְ חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
  footnotes:
  - marker: a
    text: Or 'foreign gods.' The Hebrew more literally says 'other gods.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the works of their hands' can refer broadly to what they have made or done, especially man-made idols and related acts.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 나를 버리고 다른 신들에게 분향하여, 나를 진노하게 하려고 그들의 손으로 한 모든 일로[a] 나를 진노하게 하였으므로, 내 분노가 이곳에 쏟아져 내릴 것이며 결코 꺼지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 손으로 한 모든 일’은 그들이 만든 것, 특히 우상과 그에 관련된 행위를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: עֲזָבוּנִי
  english_pob_choice: they have forsaken me
  chosen_korean: 나를 버리고
  alternatives_korean:
  - 나를 떠나고
  - 나를 저버리고
  lexicon: HALOT
  rationale: עזב는 단순한 이탈보다 언약적 배반의 뉘앙스를 담을 수 있어, 예언·심판 문맥에 자연스러운 ‘버리다’를 택했습니다.
- source_word: וַיַּקְטִירוּ לֵאלֹהִים אֲחֵרִים
  english_pob_choice: and burned incense to other gods
  chosen_korean: 다른 신들에게 분향하여
  alternatives_korean:
  - 다른 신들에게 향을 피워
  - 다른 신들에게 향을 올려
  lexicon: HALOT
  rationale: קטר는 우상 숭배 문맥에서 분향을 뜻하므로, 교회적이지만 원문에 충실한 ‘분향하다’로 옮겼습니다.
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  english_pob_choice: by all the works of their hands
  chosen_korean: 자기들의 손으로 한 모든 일로
  alternatives_korean:
  - 그들의 손이 만든 모든 것으로
  - 그들이 손으로 만든 모든 것으로
  lexicon: HALOT
  rationale: 직역형 표현을 유지하되 한국어로는 ‘손의 작품’보다 자연스러운 구조로 풀어, 우상 제작과 그에 따른 행위 전체를 포괄하게 했습니다.
- source_word: וְתִתַּךְ חֲמָתִי
  english_pob_choice: my wrath will be poured out
  chosen_korean: 내 분노가 쏟아져 내릴 것이며
  alternatives_korean:
  - 내 진노가 퍼부어질 것이며
  - 내 격분이 쏟아질 것이며
  lexicon: HALOT
  rationale: נתך의 ‘쏟아지다/부어지다’ 이미지를 살리되, חֵמָה는 심판 맥락에서 ‘분노’보다 ‘진노’가 더 강할 수 있어 본문에서는 유려한 ‘분노’와 결합해 화염 이미지의 흐름을 유지했습니다.
theological_decisions:
- issue: 신적 심판의 불 이미지와 ‘꺼지지 않음’ 표현을 약화하지 않기
  chosen_reading: 결코 꺼지지 않을 것입니다
  alternative_readings:
  - 사라지지 않을 것입니다
  - 끊이지 않을 것입니다
  rationale: כבה의 불 꺼짐 이미지는 하나님의 지속적 심판을 드러내므로, 의미를 완화하지 않는 ‘꺼지다’ 계열로 옮겼습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 직접 화법 안의 1인칭 신적 발화 유지
  chosen_reading: 나를 버리고 … 나를 진노하게 하였으므로
  alternative_readings:
  - 주님을 버리고 … 주님을 진노하게 하였으므로
  rationale: 본문은 야훼의 직접 발화이므로, 간접화하여 ‘주님’을 주어화하지 않고 1인칭을 그대로 유지했습니다.
  doctrine_reference: Original-language primacy; contested terms table for יְהוָה
