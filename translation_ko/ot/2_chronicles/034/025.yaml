review_pass:
  verdict: revise
  source_fidelity: ‘나를 진노하게 하였으므로’는 לְמַעַן הַכְעִיסֵנִי의 목적/지향 표현을 이미 이루어진 결과 및 인과로 다소 바꿉니다. ‘나를 진노하게 하려고’가 원문의 구문을 더 직접적으로 반영합니다. 나머지 핵심 표현, 곧 ‘버리고,’ ‘다른 신들에게 분향하여,’ ‘쏟아져 내릴 것이며,’ ‘꺼지지 않을 것입니다’는 히브리어의 의미와 심판·불의 비유를 충실히 전달합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘분향하다’는 제의·우상숭배 문맥에 적합하며, ‘내 분노가 이곳에 쏟아져 내릴 것이며, 결코 꺼지지 않을 것입니다’도 앞선 유체 은유를 무리 없이 유지합니다.
  terminology: ‘다른 신들’은 אֱלֹהִים אֲחֵרִים를 정확히 옮기며, ‘분향하여’는 קטר의 일반적인 제의적 뜻을 잘 반영합니다. חֵמָה는 여기서 ‘분노’로 옮겨도 충분히 강한 심판의 뜻을 보존합니다. 각주 표지는 설명 대상인 ‘그들의 손으로 한 모든 일’ 바로 뒤에 두어야 합니다.
