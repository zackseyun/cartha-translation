id: 2CH.34.17
reference: 2 Chronicles 34:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּתִּ֕יכוּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בְּ/בֵית יְהוָ֑ה וַֽ/יִּתְּנ֗וּ/הוּ עַל יַד֙ הַ/מֻּפְקָדִ֔ים וְ/עַל יַ֖ד עוֹשֵׂ֥י הַ/מְּלָאכָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
  footnotes:
  - marker: a
    text: Or 'emptied out the silver'; the Hebrew verb may denote pouring out or disbursing the money rather than literally melting it down in this context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house of the LORD,' that is, the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼의 집에서 발견된 은을 쏟아 내어 감독들의 손과 일꾼들의 손에 넘겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  english_pob_choice: have poured out
  chosen_korean: 쏟아 내어
  alternatives_korean:
  - 비워 내어
  - 녹여 내어
  lexicon: HALOT
  rationale: 이 문맥에서는 금속을 녹이는 뜻보다 모아 둔 은을 밖으로 쏟아 내어 분배하는 의미가 자연스럽습니다. 한국어로는 '쏟아 내다'가 동작성과 생동감을 살리면서도 과도하게 해석하지 않습니다.
- source_word: הַכֶּסֶף
  english_pob_choice: the silver
  chosen_korean: 은
  alternatives_korean:
  - 돈
  - 은전
  lexicon: HALOT
  rationale: 히브리어 כֶּסֶף는 문자적으로 '은'이며, 성전 자금이 실제 은으로 이해되는 맥락이므로 '은'이 원문을 가장 직접적으로 반영합니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집에서
  alternatives_korean:
  - 여호와의 집에서
  - 주님의 집에서
  - 성전에서
  lexicon: HALOT
  rationale: 본문의 신명표기는 יְהוָה이므로 프로젝트 기준에 따라 '야훼'를 사용했습니다. '집'은 성전의 관용적 표현을 그대로 살립니다.
- source_word: עַל יַד הַמֻּפְקָדִים ... עַל יַד עוֹשֵׂי הַמְּלָאכָה
  english_pob_choice: into the hands of the overseers and into the hands of those doing the work
  chosen_korean: 감독들의 손과 일꾼들의 손에 넘겼습니다
  alternatives_korean:
  - 감독들의 손에와 일꾼들의 손에 맡겼습니다
  - 감독들에게와 일꾼들에게 넘겼습니다
  lexicon: HALOT
  rationale: '''into the hands of''는 위탁과 관리의 관용구이므로 ''손에 넘겼습니다''가 원문의 이미지와 행정적 뉘앙스를 함께 살립니다. הַמֻּפְקָדִים는 감독들, עוֹשֵׂי הַמְּלָאכָה는 공사를 수행하는 일꾼들로 옮겼습니다.'
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 신명기적 이름 יְהוָה를 직접 사용하므로, 본 프로젝트 기준에 따라 이를 '야훼'로 옮겨 고유한 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
