base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/005.yaml
  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the altars.' The Hebrew form here is unusual; the sense is that Josiah burned the priests' bones on the altars associated with them.
    reason: textual_variant
translation:
  language: ko
  text: 그는 제사장들의 뼈를 그들의 제단들 위에서[a] 불살랐고, 유다와 예루살렘을 정결하게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 제단들’. 히브리어 형태가 이례적입니다. 요시야가 그 제사장들과 관련된 제단들 위에서 그들의 뼈를 불살랐다는 뜻으로 이해할 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת
  english_pob_choice: the bones of
  chosen_korean: 제사장들의 뼈
  alternatives_korean:
  - 그리고 제사장들의 뼈
  lexicon: HALOT
  rationale: עַצְמוֹת는 문자적으로 ‘뼈들’이므로 이를 그대로 살렸고, 문두의 접속사 וְ는 한국어 문장 흐름상 앞에 드러내지 않았습니다.
- source_word: כֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들의
  alternatives_korean:
  - 사제들의
  - 제사장들
  lexicon: HALOT
  rationale: 본문은 특정한 우상 숭배 제사장들을 가리키지만, 히브리어 자체는 단순히 ‘제사장들’이므로 과도한 해석을 피했습니다.
- source_word: שָׂרַף
  english_pob_choice: burned
  chosen_korean: 불살랐고
  alternatives_korean:
  - 태웠고
  - 불태웠고
  lexicon: HALOT
  rationale: 제사장들의 뼈를 제단 위에서 태운다는 강한 행위를 드러내기 위해 ‘불사르다’를 택했습니다.
- source_word: וַ/יְטַהֵר
  english_pob_choice: he cleansed
  chosen_korean: 깨끗하게 했습니다
  alternatives_korean:
  - 정결하게 했습니다
  - 깨끗하게 하셨습니다
  lexicon: HALOT
  rationale: טהר는 이 개혁 문맥에서 우상 숭배로 더럽혀진 것을 제거하는 의미이므로, 의례적·도덕적 정화를 함께 드러내는 ‘깨끗하게 하다’를 선택했습니다.
theological_decisions:
- issue: 정화 동사의 범위
  chosen_reading: 유다와 예루살렘을 우상 숭배의 더러움에서 제거하는 종교적·도덕적 정화로 이해했습니다.
  alternative_readings:
  - 단순한 의례 정결
  - 물리적 청소나 파괴만을 가리킴
  rationale: 문맥상 טהר는 단순 청소가 아니라 개혁을 통해 제의적 불결을 제거하는 행위이므로, 그 종교적 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §3, §6
