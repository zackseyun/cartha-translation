  text: וַ/יַּעֲמֹ֨ד הַ/מֶּ֜לֶךְ עַל עָמְד֗/וֹ וַ/יִּכְרֹ֣ת אֶֽת הַ/בְּרִית֮ לִ/פְנֵ֣י יְהוָה֒ לָ/לֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְ/לִ/שְׁמ֤וֹר אֶת מִצְוֺתָי/ו֙ וְ/עֵֽדְוֺתָ֣י/ו וְ/חֻקָּ֔י/ו בְּ/כָל לְבָב֖/וֹ וּ/בְ/כָל נַפְשׁ֑/וֹ לַ/עֲשׂוֹת֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית הַ/כְּתוּבִ֖ים עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
  footnotes:
  - marker: a
    text: Or, more historically, 'written in this scroll.' The Hebrew word can refer to a written document in scroll form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 자기 자리에 서서 야훼 앞에서 언약을 맺었습니다. 곧 야훼를 따라 걷고, 온 마음과 온 영혼을 다하여 그의 계명과 그의 증거와 그의 규례를 지키며, 이 책[a]에 기록된 언약의 말씀들을 실행하기로 한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 역사적으로, ‘이 두루마리에 기록된’입니다. 히브리어 단어는 두루마리 형태의 기록 문서를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל עָמְדוֹ
  english_pob_choice: Then the king stood in his place
  chosen_korean: 왕은 제 자리에서 일어났다
  alternatives_korean:
  - 왕은 서 있었다
  - 왕은 자기 위치에 섰다
  lexicon: HALOT
  rationale: עָמַד의 기본 의미를 살리면서도 한국어에서는 단순한 ‘서 있었다’보다 서사적으로 자연스러운 ‘제 자리에서 일어나다’로 옮겼습니다.
- source_word: וַיִּכְרֹת אֶת הַבְּרִית
  english_pob_choice: made the covenant
  chosen_korean: 언약을 맺어
  alternatives_korean:
  - 언약을 세워
  - 언약을 만들고
  lexicon: HALOT
  rationale: כרת ברית의 관용적 의미를 한국어 성경 문체에 맞게 ‘언약을 맺다’로 옮겨, 단순한 계약 체결이 아니라 엄숙한 언약 체결의 뉘앙스를 살렸습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼 면전에서
  - 야훼 앞에
  lexicon: HALOT
  rationale: 여호와 대신 원문 표기 원칙에 따른 ‘야훼’를 사용했고, לִפְנֵי의 공적·언약적 장면을 ‘앞에서’로 자연스럽게 표현했습니다.
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  english_pob_choice: to walk after Yahweh
  chosen_korean: 야훼를 따라 걷고
  alternatives_korean:
  - 야훼를 따라가고
  - 야훼를 뒤따르고
  lexicon: HALOT
  rationale: ‘walk after’의 언약적 은유를 직역에 가깝게 보존하되, 한국어에서는 ‘따라 걷다’가 가장 자연스럽고 비유도 유지합니다.
- source_word: מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו
  english_pob_choice: his commandments and his testimonies and his statutes
  chosen_korean: 그의 명령과 그의 증거와 그의 규례
  alternatives_korean:
  - 그의 계명과 그의 증거와 그의 법도
  - 그의 명령들과 그의 증언들과 그의 규례들
  lexicon: HALOT
  rationale: 세 개의 법적 용어를 서로 구별되게 유지했습니다. ‘증거’는 עדות의 언약적·증언적 성격을 살리기 위한 선택입니다.
- source_word: בְּכָל לְבָבֹו וּבְכָל נַפְשׁוֹ
  english_pob_choice: with all his heart and with all his soul
  chosen_korean: 온 마음과 온 영혼을 다하여
  alternatives_korean:
  - 전심과 전령혼으로
  - 마음을 다하고 영혼을 다하여
  lexicon: HALOT
  rationale: 신명기적 표현을 한국어로 자연스럽게 풀면서도, ‘마음/영혼’의 이중 구조를 유지했습니다.
- source_word: דִּבְרֵי הַבְּרִית הַכְּתוּבִים עַל הַסֵּפֶר הַזֶּה
  english_pob_choice: the words of the covenant that were written in this book
  chosen_korean: 이 책에 기록된 언약의 말씀들
  alternatives_korean:
  - 이 책에 적힌 언약의 말씀들
  - 이 두루마리에 기록된 언약의 말씀들
  lexicon: HALOT
  rationale: ‘언약의 말씀들’로 דִּבְרֵי הַבְּרִית의 직접성을 살렸고, ‘이 책’은 현대 독자에게 자연스러운 기본 번역으로 유지했습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה를 전통적 대체어로 희석하지 않고, 원문 표기 원칙에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: Covenantal metaphor in לָלֶכֶת אַחֲרֵי יְהוָה
  chosen_reading: 야훼를 따라 걷고
  alternative_readings:
  - 야훼를 따르고
  - 야훼를 좇고
  rationale: ‘걷다’의 은유를 유지해야 언약적 충성의 표현이 약화되지 않습니다. 한국어에서는 ‘따라 걷다’가 가장 덜 해석적입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3, §5
