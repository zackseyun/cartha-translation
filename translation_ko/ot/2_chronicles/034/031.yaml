  source_fidelity: ‘제 자리에서 일어나’는 עמד(서다)를 ‘일어나다’로 바꾸어, 왕이 이미 자기의 지정된 자리에 서는 장면이라는 원문의 뜻을 달리합니다. 또한 문장 끝의 ‘…하겠다고 하였습니다’는 원문에 없는 발화 행위를 덧붙입니다. 언약의 목적·내용을 나타내는 부정사들을 ‘…하기로 언약을 맺었습니다’로 처리하는 편이 충실합니다.
  naturalness: ‘자기 자리에 서서’와 ‘온 마음과 온 영혼을 다하여’는 현대 표준 한국어의 합쇼체 문장으로 자연스럽습니다. ‘증거’는 법적·언약적 문맥에서 다소 낯설 수 있으나, 용어의 구별과 성경적 용례를 보존할 수 있습니다.
  terminology: 야훼, 언약, 계명, 증거, 규례는 원문의 신명기적·언약적 어휘를 구별하여 반영합니다. ‘야훼를 따라 걷고’는 הלך אחרי의 비유를 보존합니다. ‘이 책’에는 두루마리라는 역사적·물질적 대안을 제시하는 각주를 해당 어구에 직접 붙입니다.
