  - 그들의 주위의 황폐한 곳들
  lexicon: HALOT
  rationale: 본문의 בתי/הם는 문자적으로는 ‘그들의 집들’처럼 보이지만, 문맥상 파괴된 장소를 가리키는 해석이 강하므로 POB의 ‘surrounding ruins’를 따라 ‘황폐한 곳들’로 옮겼고, סָבִיב는 위치·범위를 나타내는 ‘둘러싸인’으로 처리했습니다.
