  lexicon: HALOT
  rationale: עַד의 범위 표지를 ‘…까지’로 옮기고, 영어 POB의 ‘even’을 반영해 확장 범위를 강조하는 ‘곧’를 보탰습니다.
- source_word: בתי/הם ... סָבִֽיב
  english_pob_choice: in their surrounding ruins
  chosen_korean: 그들의 둘러싸인 황폐한 곳들
