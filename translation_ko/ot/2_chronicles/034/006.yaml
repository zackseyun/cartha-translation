base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/006.yaml
  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
  footnotes:
  - marker: a
    text: Hebrew text is difficult in the final phrase; literally, something like 'in/with their ... סביב.' Many translations understand the sense to be 'in their surrounding ruins/desolate places.'
    reason: textual_variant
  - marker: b
    text: Or 'in their surrounding desolate places.' The consonantal text could be read more literally as 'their houses,' but the context strongly favors a reference to ruined or devastated places.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 므낫세와 에브라임과 시므온의 성읍들, 곧 납달리까지, 그들의 둘러싸인 황폐한 곳들에까지 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 마지막 구절이 난해합니다. 문자적으로는 ‘그들의 … סביב 안/함께’쯤 되며, 많은 번역본은 ‘그들의 둘러싼 황폐한 곳들’로 이해합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그들의 둘러싼 황폐한 곳들’. 자음 본문은 더 문자적으로는 ‘그들의 집들’로 읽을 수도 있으나, 문맥은 파괴된 장소를 가리키는 쪽을 강하게 지지합니다.
    reason: lexical_alternative
