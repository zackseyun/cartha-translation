translation:
  language: ko
  text: 그는 예루살렘과 베냐민에 있는 모든 사람을 그 언약 앞에 서게 하였고, 예루살렘 주민들은 조상들의 하나님, 곧 하나님의 언약에 따라 행하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 예루살렘과 베냐민에 있는 모든 사람을 그 언약에 서게 하였고’로 볼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘예루살렘 주민들은 조상들의 하나님, 곧 하나님에 대한 언약에 따라 행하였습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  english_pob_choice: he made ... stand to it
  chosen_korean: 그는 … 서게 하였고
  alternatives_korean:
  - 그는 … 세웠고
  - 그는 … 그 언약에 서게 하였고
  - 그는 … 그 언약을 지키도록 하였고
  lexicon: HALOT
  rationale: 히필형 עמד는 ‘서게 하다/세우다’의 의미가 기본이므로, 강제로 결속시키는 뉘앙스를 과도하게 풀지 않고 ‘서게 하였고’로 옮겼습니다.
- source_word: אֵת כָּל הַנִּמְצָא
  english_pob_choice: everyone who was found
  chosen_korean: 모든 사람
  alternatives_korean:
  - 거기 있던 모든 사람
  - 발견된 모든 사람
  - 그곳에 있던 모두
  lexicon: HALOT
  rationale: ‘מצא’의 수동 분사 구조는 단순한 존재 진술을 넘어 ‘거기서 발견된/있는’ 사람 전체를 가리키므로, 자연스러운 한국어로 ‘모든 사람’에 이를 장소 구문을 붙였습니다.
- source_word: כִּבְרִית
  english_pob_choice: according to the covenant
  chosen_korean: 그 언약에 따라
  alternatives_korean:
  - 언약에 맞게
  - 언약대로
  - 언약에 따라
  lexicon: HALOT
  rationale: 전치사 כ는 준거·부합의 뜻이므로, 한국어에서는 규범적이고 자연스러운 ‘-에 따라’가 가장 직접적입니다.
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  english_pob_choice: of God, the God of their fathers
  chosen_korean: 조상들의 하나님, 곧 하나님
  alternatives_korean:
  - 조상들의 하나님, 곧 그들의 하나님
  - 조상들의 하나님, 곧 하나님이신 그들의 조상들의 하나님
  lexicon: HALOT
  rationale: 히브리어의 동격 반복을 살리되 한국어 어순에서는 ‘조상들의 하나님’ 뒤에 동격 설명을 덧붙이는 방식이 가장 자연스럽습니다. 본문에서는 반복된 ‘하나님’을 축약해 어색함을 줄였습니다.
theological_decisions:
- issue: כִּבְרִית의 언약적 압박과 참여 의미
  chosen_reading: ‘그 언약 앞에 서게 하였고’로 번역해 단순 집결이 아니라 언약적 결단의 의미를 드러냈습니다.
  alternative_readings:
  - 그 언약에 서게 하였고
  - 그 언약에 들어가게 하였고
  - 그 언약을 받아들이게 하였고
  rationale: 문맥상 요시야의 개혁은 단순한 물리적 배치가 아니라 언약에 대한 공개적 헌신을 포함하므로, ‘서다’의 이미지를 유지하면서 결단성을 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
