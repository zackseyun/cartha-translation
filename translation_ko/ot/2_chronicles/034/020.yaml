id: 2CH.34.20
reference: 2 Chronicles 34:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֡הוּ וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַבְדּ֨וֹן בֶּן מִיכָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סּוֹפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
  footnotes:
  - marker: a
    text: The Masoretic Text reads 'Abdon son of Micah.' The parallel in 2 Kings 22:12 has 'Achbor son of Micaiah.'
    reason: textual_variant
  - marker: b
    text: Or 'Asaiah, the king’s official.' The Hebrew literally reads 'the king’s servant,' which can denote a court official.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 왕이 힐기야[a], 사반의 아들 아히감, 미가의 아들 압돈, 서기관 사반, 왕의 종 아사야에게 명령하며 말했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마소라 본문은 ‘미가의 아들 압돈’으로 읽지만, 2열왕기 22:12 평행본문은 ‘미가야의 아들 악볼’로 읽습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘아사야, 왕의 관리’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘왕의 종’이지만, 궁정 관직을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하며
  alternatives_korean:
  - 명령하고
  - 지시하며
  - 분부하며
  lexicon: HALOT
  rationale: 왕의 공적이고 권위 있는 지시를 드러내기 위해 ‘명령하다’를 택했고, 문장 연결은 한국어 서술 흐름에 맞게 ‘명령하며’로 처리했습니다.
- source_word: שָׁפָן הַסֹּפֵר
  english_pob_choice: Shaphan the scribe
  chosen_korean: 서기관 사반
  alternatives_korean:
  - 사반 서기관
  - 사반, 서기관
  lexicon: HALOT
  rationale: סֹפֵר는 단순히 ‘글을 쓰는 사람’이 아니라 궁정 문서 담당 관원을 가리킬 수 있어, 직함을 앞세운 ‘서기관’으로 옮겼습니다.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  english_pob_choice: Asaiah the king’s servant
  chosen_korean: 왕의 종 아사야
  alternatives_korean:
  - 왕의 신하 아사야
  - 왕의 관리 아사야
  - 왕의 공식 아사야
  lexicon: HALOT
  rationale: עֶבֶד의 기본 의미를 살려 ‘종’으로 옮겼습니다. 궁정 직함일 가능성은 있으나, 본문 자체의 표현을 우선 보존했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르며
  - 말하여
  lexicon: HALOT
  rationale: 히브리어의 발화 도입 공식은 한국어에서 자연스럽게 다음 절을 예고하는 ‘말했습니다’로 처리했습니다.
theological_decisions:
- issue: 왕의 명령과 신하들의 직함을 어떻게 드러낼 것인가
  chosen_reading: 본문의 왕권 질서와 궁정 관직 성격을 그대로 살려, ‘명령하다’와 ‘서기관/왕의 종’을 유지했습니다.
  alternative_readings:
  - ‘말하다’로 완화하기
  - ‘왕의 관리’로 직함을 일반화하기
  rationale: 이 구절은 서술상 단순 전달이 아니라 공식적 왕명 전달 장면이므로, 권위의 강도를 약화시키지 않는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 성경 본문 해석의 문맥 우선 원칙
