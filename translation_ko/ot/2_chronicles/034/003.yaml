  source_fidelity: 개정이 필요합니다. הֵחֵל לְטַהֵר는 우상들을 단순히 ‘제거하기 시작했다’기보다 유다와 예루살렘을 그러한 제의 대상들로부터 ‘정결하게 하기 시작했다’는 뜻입니다. 또한 מַסֵּכוֹת는 철(쇠)에 한정되지 않는 주조 금속 형상입니다. אָבִיו는 직역하면 ‘그의 아버지’이나, 다윗이 요시야의 직접 부친이 아닌 왕조적 조상이라는 점을 한국어 본문에서 자연스럽게 밝혔습니다.
  naturalness: ‘다윗 그의 아버지의 하나님’은 현대 표준 한국어에서 부자연스럽고 수식 관계가 즉시 파악되지 않습니다. ‘그의 조상 다윗의 하나님’이 명료하고 자연스럽습니다. 열여섯 살 무렵의 요시야에게 ‘아직도 소년’은 다소 지나치게 아동적으로 들릴 수 있으므로, נַעַר의 폭을 보존하는 ‘아직 젊었을 때’가 적절합니다.
  terminology: בָּמוֹת는 ‘산당들’로 유지합니다. אֲשֵׁרִים는 물리적 형태가 논쟁적이므로 ‘아세라 상징물들’과 각주로 처리합니다. פְּסִלִים는 ‘새긴 우상들’, מַסֵּכוֹת는 ‘부어 만든 우상들’로 구별했으며, 각주 표지도 해당 어휘에 맞게 바로잡았습니다.
