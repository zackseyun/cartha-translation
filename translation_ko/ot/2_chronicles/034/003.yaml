revisions:
- from: 그가 통치한 지 팔 년이 되던 해, 아직도 소년이었을 때, 그는 다윗 그의 아버지의 하나님을 찾기 시작했습니다. 그리고 열두째 해에는 유다와 예루살렘에서 산당들과 아세라 상들[b], 조각한 우상들[c], 그리고 쇠로 부어 만든 우상들을 제거하기 시작했습니다.
  to: 그가 왕위에 오른 지 여덟째 해, 아직 젊었을 때에 그는 그의 조상 다윗의 하나님을 찾기 시작했습니다.[a] 열두째 해에는 유다와 예루살렘을 산당들과 아세라 상징물들[b], 새긴 우상들, 부어 만든 우상들[c]로부터 정결하게 하기 시작했습니다.
  rationale: 히브리어의 통사 관계를 따라 유다와 예루살렘 자체를 정결하게 하는 대상으로 옮기고, 주조 형상의 재료를 철로 제한한 표현을 수정했습니다. 아세라의 정확한 물리적 형태는 본문에서 단정하지 않고 각주에 대안을 제시했습니다. 또한 왕조적 ‘아버지’ 표현은 자연스러운 한국어 본문과 설명 각주로 처리했으며, 모든 각주 표지를 해당 어휘에 일치시켰습니다.
