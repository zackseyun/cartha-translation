  - 아직도 젊었을 때
  lexicon: HALOT
  rationale: נַעַר의 문맥상 미성숙한 연령대를 살리되, 한국어에서는 ‘소년’이 ‘아직도’와 결합할 때 자연스럽고 간결합니다.
- source_word: הֵחֵל לִדְרֹשׁ
  english_pob_choice: he began to seek
  chosen_korean: 찾기 시작했습니다
  alternatives_korean:
  - 구하기 시작했습니다
  - 여쭙기 시작했습니다
  lexicon: HALOT
  rationale: דרשׁ의 언약적·경건적 의미를 한국어 ‘찾다’로 옮겨 단순한 정보 탐색이 아니라 하나님을 향한 추구를 드러냅니다.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  english_pob_choice: the God of David his father
  chosen_korean: 다윗 그의 아버지의 하나님
  alternatives_korean:
  - 다윗 그의 조상의 하나님
  - 다윗 그의 선조의 하나님
  lexicon: HALOT
  rationale: 히브리어의 왕조적 계보 표현을 그대로 살리기 위해 ‘아버지’를 본문에 두고, 혈통상 조상을 뜻함을 유지했습니다.
- source_word: וְהָאֲשֵׁרִים
  english_pob_choice: the Asherim
  chosen_korean: 아세라 상들
  alternatives_korean:
  - 아세라 기둥들
  - 아세라 목상들
  lexicon: HALOT
  rationale: אֲשֵׁרִים의 물질적 형상을 단정하기보다, 우상적 표지를 가리키는 것으로 넓게 보면서도 한국어에서 이해 가능한 표현을 택했습니다.
- source_word: וְהַפְּסִלִים
  english_pob_choice: the carved images
  chosen_korean: 조각한 우상들
  alternatives_korean:
  - 새긴 우상들
  - 조각상들
  lexicon: HALOT
  rationale: פְּסִלִים의 ‘새김/조각’ 의미를 살리면서도 종교적 맥락에서 ‘우상’으로 기능을 분명히 했습니다.
- source_word: וְהַמַּסֵּכֹת
  english_pob_choice: the metal images
  chosen_korean: 쇠로 부어 만든 우상들
  alternatives_korean:
  - 주조한 우상들
  - 주조된 우상들
  lexicon: HALOT
  rationale: מַסֵּכוֹת의 ‘주조/부음’ 의미를 드러내되, 한국어에서 재료와 제작 방식을 함께 보여 주는 표현으로 구체화했습니다.
