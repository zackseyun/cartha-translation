  text: וּ/בִ/שְׁמוֹנֶ֨ה שָׁנִ֜ים לְ/מָלְכ֗/וֹ וְ/הוּא֙ עוֹדֶ֣/נּוּ נַ֔עַר הֵחֵ֕ל לִ/דְר֕וֹשׁ לֵ/אלֹהֵ֖י דָּוִ֣יד אָבִ֑י/ו וּ/בִ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה שָׁנָ֗ה הֵחֵל֙ לְ/טַהֵ֔ר אֶת יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם מִן הַ/בָּמוֹת֙ וְ/הָ֣/אֲשֵׁרִ֔ים וְ/הַ/פְּסִלִ֖ים וְ/הַ/מַּסֵּכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
  footnotes:
  - marker: a
    text: Or 'the God of David his ancestor'; 'father' here reflects normal royal ancestry language.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Asherah poles.' The Hebrew term may refer to cultic symbols associated with Asherah, often wooden poles or trees.
    reason: lexical_alternative
  - marker: c
    text: Or 'cast images' or 'molten images.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 통치한 지 팔 년이 되던 해, 아직도 소년이었을 때, 그는 다윗 그의 아버지의 하나님을 찾기 시작했습니다. 그리고 열두째 해에는 유다와 예루살렘에서 산당들과 아세라 상들[b], 조각한 우상들[c], 그리고 쇠로 부어 만든 우상들을 제거하기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘아세라 기둥들’. 히브리어는 아세라와 관련된 제의적 표지물, 흔히 나무 기둥이나 나무를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘주조한 우상들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  english_pob_choice: while he was still a youth
  chosen_korean: 아직도 소년이었을 때
  alternatives_korean:
  - 아직도 청년이었을 때
  - 아직도 젊었을 때
  lexicon: HALOT
  rationale: נַעַר의 문맥상 미성숙한 연령대를 살리되, 한국어에서는 ‘소년’이 ‘아직도’와 결합할 때 자연스럽고 간결합니다.
- source_word: הֵחֵל לִדְרֹשׁ
  english_pob_choice: he began to seek
  chosen_korean: 찾기 시작했습니다
  alternatives_korean:
  - 구하기 시작했습니다
  - 여쭙기 시작했습니다
  lexicon: HALOT
  rationale: דרשׁ의 언약적·경건적 의미를 한국어 ‘찾다’로 옮겨 단순한 정보 탐색이 아니라 하나님을 향한 추구를 드러냅니다.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  english_pob_choice: the God of David his father
  chosen_korean: 다윗 그의 아버지의 하나님
  alternatives_korean:
  - 다윗 그의 조상의 하나님
  - 다윗 그의 선조의 하나님
  lexicon: HALOT
  rationale: 히브리어의 왕조적 계보 표현을 그대로 살리기 위해 ‘아버지’를 본문에 두고, 혈통상 조상을 뜻함을 유지했습니다.
- source_word: וְהָאֲשֵׁרִים
  english_pob_choice: the Asherim
  chosen_korean: 아세라 상들
  alternatives_korean:
  - 아세라 기둥들
  - 아세라 목상들
  lexicon: HALOT
  rationale: אֲשֵׁרִים의 물질적 형상을 단정하기보다, 우상적 표지를 가리키는 것으로 넓게 보면서도 한국어에서 이해 가능한 표현을 택했습니다.
- source_word: וְהַפְּסִלִים
  english_pob_choice: the carved images
  chosen_korean: 조각한 우상들
  alternatives_korean:
  - 새긴 우상들
  - 조각상들
  lexicon: HALOT
  rationale: פְּסִלִים의 ‘새김/조각’ 의미를 살리면서도 종교적 맥락에서 ‘우상’으로 기능을 분명히 했습니다.
- source_word: וְהַמַּסֵּכֹת
  english_pob_choice: the metal images
  chosen_korean: 쇠로 부어 만든 우상들
  alternatives_korean:
  - 주조한 우상들
  - 주조된 우상들
  lexicon: HALOT
  rationale: מַסֵּכוֹת의 ‘주조/부음’ 의미를 드러내되, 한국어에서 재료와 제작 방식을 함께 보여 주는 표현으로 구체화했습니다.
theological_decisions:
- issue: 왕조적 친족 표현의 번역
  chosen_reading: ‘다윗 그의 아버지’로 본문을 유지합니다.
  alternative_readings:
  - ‘다윗 그의 조상’으로 완화
  rationale: 히브리어의 통상적인 왕조 언어를 보존해 다윗 언약과 유다 왕권의 연결을 본문 안에서 드러냅니다.
  doctrine_reference: Translation philosophy §4, §5
