  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דַרְכֵי֙ דָּוִ֣יד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
  footnotes:
  - marker: a
    text: Or 'in the sight of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''David his father'' uses ''father'' in the dynastic sense of ancestor.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 야훼의 눈에 옳은 일을 행하고, 그의 아버지 다윗의 길로 걸어갔으며, 오른쪽으로도 왼쪽으로도 치우치지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 아버지’는 왕조적 문맥에서 조상/선조를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  english_pob_choice: He did what was right
  chosen_korean: 옳은 일을 행하고
  alternatives_korean:
  - 바른 일을 하고
  - 의로운 일을 행하고
  lexicon: HALOT
  rationale: 평가적 왕 서술에서 עשה + הַיָּשָׁר는 한국어로 ‘옳은 일’이 가장 자연스럽고, 도덕적 평가를 분명하게 살립니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 시각적 이미지를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘눈에’로 옮겼습니다.
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  english_pob_choice: walked in the ways of
  chosen_korean: 길로 걸어갔으며
  alternatives_korean:
  - 길을 따라 걸었으며
  - 행실을 따라 살았으며
  lexicon: HALOT
  rationale: הלך/דרך의 윤리적 은유를 유지하면서, 한국어에서는 ‘길로 걸어가다’가 행동 양식을 가장 직관적으로 드러냅니다.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  english_pob_choice: he did not turn aside to the right or to the left
  chosen_korean: 오른쪽으로도 왼쪽으로도 치우치지 않았습니다
  alternatives_korean:
  - 오른쪽이나 왼쪽으로도 벗어나지 않았습니다
  - 우로나 좌로나 치우치지 않았습니다
  lexicon: HALOT
  rationale: 표준적 관용구를 살리되, 문어체 합쇼체에 맞게 ‘치우치지 않았습니다’로 표현해 방향적 일탈의 의미를 보존했습니다.
- source_word: דָּוִיד אָבִיו
  english_pob_choice: David his father
  chosen_korean: 그의 아버지 다윗
  alternatives_korean:
  - 다윗 그의 아버지
  - 조상 다윗
  lexicon: HALOT
  rationale: 여기서 ‘아버지’는 왕조적/조상적 의미를 담지만, 본문 흐름에서는 ‘그의 아버지 다윗’이 가장 자연스럽고 추가 설명 없이도 뜻이 전달됩니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 여호와를 직접 음역한 ‘야훼’를 유지해 고유한 언약 სახელ칭을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
