source:
  edition: WLC
  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'Asherah poles.' The Hebrew term refers to cultic objects associated with Asherah; the exact form may vary by context.
    reason: lexical_alternative
  - marker: b
    text: Or 'sun-pillars.' The Hebrew term likely refers to a type of cultic object, though its precise identification is debated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 제단들을 헐어 버리고, 아세라 상들[a]과 새긴 우상들을 부수어 가루로 만들고, 이스라엘 온 땅에 있는 모든 분향 제단[b]을 찍어 버렸습니다. 그런 다음 예루살렘으로 돌아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아세라 목상들’. 히브리어는 아세라와 관련된 제의적 물건을 가리키며, 정확한 형상은 문맥에 따라 달라질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘태양 기둥들’. 히브리어는 정확한 실체가 논의되는 제의적 물건을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  english_pob_choice: he tore down
  chosen_korean: 헐어 버리고
  alternatives_korean:
  - 허물고
  - 무너뜨리고
  lexicon: HALOT
  rationale: 제단 같은 가시적 구조물을 강하게 해체하는 뜻을 자연스럽게 살리며, 서술 흐름도 매끈하게 합니다.
- source_word: הָאֲשֵׁרִים
  english_pob_choice: the Asherim
  chosen_korean: 아세라 상들
  alternatives_korean:
  - 아세라 목상들
  - 아세라 기둥들
  lexicon: HALOT
  rationale: 정확한 물리 형태를 단정하지 않고, 관련 숭배 대상이라는 점을 드러내는 표현으로 옮겼습니다.
- source_word: הַפְּסִלִים
  english_pob_choice: the carved images
  chosen_korean: 새긴 우상들
  alternatives_korean:
  - 새긴 형상들
  - 조각한 우상들
  lexicon: HALOT
  rationale: פסילים의 조각된 우상이라는 의미를 살리되, 한국어 성경 문맥에서 읽기 자연한 표현을 택했습니다.
- source_word: כִּתַּת לְהֵדַק
  english_pob_choice: he crushed ... to powder
  chosen_korean: 부수어 가루로 만들고
  alternatives_korean:
  - 찍어 가루로 만들고
  - 갈아 가루로 만들고
  lexicon: HALOT
  rationale: 완전히 미세한 분말이 되도록 파괴했다는 결과를 분명히 드러냅니다.
- source_word: הַחַמָּנִים
  english_pob_choice: the incense altars
  chosen_korean: 분향 제단들
  alternatives_korean:
  - 태양 기둥들
  - 해 모양 제단들
  lexicon: HALOT
  rationale: 영어 POB가 본문에서는 기능적 의미를 택했으므로, 한국어도 예배 행위와 연결되는 대상으로 간명하게 옮기고, 정확한 실체의 불확실성은 주석으로 처리했습니다.
theological_decisions:
- issue: 우상 파괴 대상의 구체성 유지
  chosen_reading: ‘제단들’, ‘아세라 상들’, ‘새긴 우상들’, ‘분향 제단들’처럼 구체적 숭배 대상들을 각각 살렸습니다.
  alternative_readings:
  - ‘우상들’을 포괄적으로 묶는 번역
  rationale: 본문은 요시야의 개혁이 어떤 대상을 어떻게 제거했는지 구체적으로 열거하므로, 이를 일반화하지 않고 그대로 드러내는 것이 원문 의도를 더 정확히 전달합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 어휘적 구체성 보존'
