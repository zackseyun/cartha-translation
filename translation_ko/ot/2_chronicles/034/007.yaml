theological_decisions:
- issue: 우상 파괴 대상의 구체성 유지
  chosen_reading: ‘제단들’, ‘아세라 상들’, ‘새긴 우상들’, ‘분향 제단들’처럼 구체적 숭배 대상들을 각각 살렸습니다.
  alternative_readings:
  - ‘우상들’을 포괄적으로 묶는 번역
  rationale: 본문은 요시야의 개혁이 어떤 대상을 어떻게 제거했는지 구체적으로 열거하므로, 이를 일반화하지 않고 그대로 드러내는 것이 원문 의도를 더 정확히 전달합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 어휘적 구체성 보존'
