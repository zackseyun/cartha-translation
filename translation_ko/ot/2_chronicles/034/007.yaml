base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'Asherah poles.' The Hebrew term refers to cultic objects associated with Asherah; the exact form may vary by context.
    reason: lexical_alternative
  - marker: b
    text: Or 'sun-pillars.' The Hebrew term likely refers to a type of cultic object, though its precise identification is debated.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 제단들과 아세림[a]을 헐어 버리고, 새긴 형상들을 부수어 가루로 만들었으며, 이스라엘 온 땅에 있는 모든 분향 제단[b]을 잘라 냈습니다. 그 후 예루살렘으로 돌아왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아세라 기둥들’. 히브리어는 아세라와 관련된 제의 물건을 가리키며, 정확한 형태는 문맥에 따라 달라질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘태양 기둥들’. 히브리어는 정확한 실체가 논의되는 제의 물건을 가리키는 것으로 보입니다.
    reason: lexical_alternative
