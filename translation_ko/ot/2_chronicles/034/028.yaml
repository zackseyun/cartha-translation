  naturalness: ‘평안 가운데’와 ‘말을 전해 왔습니다’는 이해 가능하나 다소 번역투입니다. ‘평안히’ 및 ‘이 말을 왕에게 전했습니다’가 현대 정중 문체에서 더 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 두는 편이 독해와 구조 면에서 적절합니다.
