  edition: WLC
  text: הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ אֶל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁ֨ר אֲנִ֥י מֵבִ֛יא עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹשְׁבָ֑י/ו וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
  footnotes:
  - marker: a
    text: Or 'to your ancestors.' The Hebrew reads 'to your fathers,' a common idiom for joining one’s forefathers in death.
    reason: lexical_alternative
  - marker: b
    text: '''In peace'' likely means that Josiah would be spared from seeing the coming disaster, as the next clause explains; it need not imply that his death itself would be without violence.'
    reason: cross_reference
  - marker: c
    text: Or 'to your graves'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 제가 당신을 당신의 조상들 곁으로 거두려 합니다. 당신은 평안 가운데 당신의 무덤들로 거두어질 것이며, 이곳과 그 주민들에게 제가 가져오는 모든 재앙을 당신의 눈은 보지 못할 것입니다.” 그러고 나서 그들이 왕에게 말을 전해 왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘당신의 조상들(아버지들)’이라고 되어 있으며, 이는 죽음에서 선조들에게 합류한다는 관용구입니다.
    reason: source_note
  - marker: b
    text: ‘평안 가운데’는 반드시 죽음 자체가 폭력 없음을 뜻하기보다, 다가올 재앙을 보지 않게 된다는 뜻으로 이해하는 것이 문맥에 맞습니다.
    reason: theological_note
  - marker: c
    text: 또는 ‘당신의 무덤으로’. 히브리어는 복수형 ‘무덤들’로 되어 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold, I am about to
  chosen_korean: 보십시오, 제가 …하려 합니다
  alternatives_korean:
  - 보십시오, 제가 곧 …하겠습니다
  - 보십시오, 제가 …할 것입니다
  lexicon: HALOT
  rationale: 히닌니의 즉시성·선언성을 살리기 위해 호응어는 유지하고, 뒤의 동사는 임박한 의도를 나타내는 ‘하려 합니다’로 옮겼습니다.
- source_word: אֹסִפְךָ / וְנֶאֱסַפְתָּ
  english_pob_choice: gather you / you will be gathered
  chosen_korean: 거두려 합니다 / 거두어질 것입니다
  alternatives_korean:
  - 모으려 합니다 / 모여질 것입니다
  - 데려가려 합니다 / 데려가질 것입니다
  lexicon: HALOT
  rationale: 죽음에 이르는 ‘거두다’라는 관용을 살려 두 동사의 어근 반복을 한국어에서도 어느 정도 유지했습니다.
- source_word: אֶל אֲבֹתֶיךָ
  english_pob_choice: to your fathers
  chosen_korean: 당신의 조상들 곁으로
  alternatives_korean:
  - 당신의 아버지들에게
  - 당신의 선조들에게
  lexicon: HALOT
  rationale: 직역의 ‘아버지들’은 한국어에서 의미가 좁아질 수 있어, 영어 주석이 밝힌 관용적 뜻에 따라 ‘조상들’로 옮기되 ‘곁으로’로 죽음의 합류 이미지를 살렸습니다.
- source_word: אֶל קִבְרֹתֶיךָ
  english_pob_choice: to your graves
  chosen_korean: 당신의 무덤들로
  alternatives_korean:
  - 당신의 무덤으로
  - 당신의 묘실들로
  lexicon: HALOT
  rationale: 히브리어 복수형을 반영해 복수 표지를 살렸습니다. 한국어에서는 단수로 자연화하기보다 원문 형식을 보존하는 편이 더 직접적입니다.
- source_word: בְּשָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평안 가운데
  alternatives_korean:
  - 평화롭게
  - 평안히
  lexicon: HALOT
  rationale: 문맥상 전쟁·재앙을 겪지 않고 죽음에 이르는 상태를 가리키므로, 단순한 감정 상태보다 상황적 보전을 드러내는 ‘평안 가운데’를 택했습니다.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  english_pob_choice: And they brought back word to the king
  chosen_korean: 그들이 왕에게 말을 전해 왔습니다
  alternatives_korean:
  - 그들이 왕에게 보고했습니다
  - 그들이 왕에게 말을 되돌려 주었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 현대 한국어로 자연스럽게 풀되, ‘전해 왔습니다’로 돌아와 보고한다는 방향성을 유지했습니다.
theological_decisions:
- issue: ‘평안 가운데’의 의미와 요시야의 이후 죽음 사이의 긴장
  chosen_reading: 이 표현은 요시야가 임박한 재앙을 보지 않고 먼저 죽게 된다는 뜻으로 이해하고, 그의 죽음 자체가 반드시 비폭력적이었다고 단정하지 않습니다.
  alternative_readings:
  - 겉으로 평온한 죽음을 예언한다
  - 주로 평안한 매장을 말한다
  rationale: 바로 뒤의 설명절이 ‘당신의 눈은 보지 못할 것입니다’라고 평안의 내용을 풀어 주므로, 본문의 긴장을 해소하지 않고 그대로 보존하는 편이 source-grounded입니다.
  doctrine_reference: 본문의 긴장 보존
