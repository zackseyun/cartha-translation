revisions:
- from: 보십시오, 제가 당신을 당신의 조상들 곁으로 거두려 합니다. 당신은 평안 가운데 당신의 무덤들로 거두어질 것이며, 이곳과 그 주민들에게 제가 가져오는 모든 재앙을 당신의 눈은 보지 못할 것입니다.” 그러고 나서 그들이 왕에게 말을 전해 왔습니다.[a][b][c]
  to: 보라, 내가 너를 네 조상들에게로[a] 거두어들이겠다. 너는 평안히[b] 네 무덤들로[c] 거두어질 것이며, 네 눈은 내가 이곳과 그 주민들에게 내리는 모든 재앙을 보지 못할 것이다.’ 그들은 이 말을 왕에게 전했습니다.
  rationale: 신적 발화의 확정적 미래 선언을 살리고, 직접 호칭의 부자연스러움을 ‘내가/너를/네’로 바로잡았습니다. ‘평안히’는 בְּשָׁלוֹם의 폭넓은 의미를 유지하며, 각주에서 요시야의 죽음과 관련된 해석상 긴장을 단정 없이 설명합니다. 히브리어 복수형 ‘무덤들’은 본문에 보존하되 단수형의 자연스러운 대안을 각주로 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:20:03Z'
