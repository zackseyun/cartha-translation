  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֗/י וּ/בְעַד֙ הַ/נִּשְׁאָר֙ בְּ/יִשְׂרָאֵ֣ל וּ/בִֽ/יהוּדָ֔ה עַל דִּבְרֵ֥י הַ/סֵּ֖פֶר אֲשֶׁ֣ר נִמְצָ֑א כִּֽי גְדוֹלָ֤ה חֲמַת יְהוָה֙ אֲשֶׁ֣ר נִתְּכָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹא שָׁמְר֤וּ אֲבוֹתֵ֨י/נוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה לַ/עֲשׂ֕וֹת כְּ/כָל הַ/כָּת֖וּב עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
  footnotes:
  - marker: a
    text: Or 'the scroll that was found.' The Hebrew word can denote a book or a scroll; 'book' is used in the main text for natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'our ancestors.' The Hebrew is literally 'our fathers.'
    reason: lexical_alternative
  - marker: c
    text: Or 'in this scroll.'
    reason: lexical_alternative
translation:
  language: ko
  text: “가서 나를 위해, 또 이스라엘과 유다에 남아 있는 자들을 위해, 발견된 이 책의 말씀들에 관해 야훼께 문의하십시오. 우리의 조상들이 야훼의 말씀을 지키지 않고, 이 책에 기록된 모든 것을 행하지 않았으므로, 야훼의 진노가 우리에게 크게 쏟아졌습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘책’은 여기서 ‘두루마리’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리의 조상들’은 문자적으로 ‘우리의 아버지들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘이 두루마리 안에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  english_pob_choice: inquire of Yahweh
  chosen_korean: 야훼께 문의하십시오
  alternatives_korean:
  - 야훼를 찾으십시오
  - 야훼께 구하십시오
  lexicon: HALOT
  rationale: 왕의 명령 맥락에서 דרשׁ는 단순한 종교적 ‘찾음’보다 신적 의사 확인을 뜻하므로, 한국어에서는 ‘문의하다’가 가장 직접적으로 맞습니다.
- source_word: בַּעֲדִי / וּבְעַד
  english_pob_choice: for me / and for
  chosen_korean: 나를 위해 / …를 위해
  alternatives_korean:
  - 나를 위하여 / …를 위하여
  - 나를 대신하여 / …를 대신하여
  lexicon: HALOT
  rationale: בעד는 대표·유익의 뜻을 가지므로, 현대 한국어에서 자연스럽고 의미를 해치지 않는 ‘~를 위해’로 옮겼습니다.
- source_word: הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה
  english_pob_choice: the remnant in Israel and in Judah
  chosen_korean: 이스라엘과 유다에 남아 있는 자들
  alternatives_korean:
  - 이스라엘과 유다의 남은 자들
  - 이스라엘과 유다의 남은 사람들
  lexicon: HALOT
  rationale: הנשאר는 문자적으로 ‘남아 있는 자’이므로, 남은 자의 공동체적·언약사적 뉘앙스를 살리면서도 문장 흐름에 맞게 풀었습니다.
- source_word: עַל דִּבְרֵי הַסֵּפֶר אֲשֶׁר נִמְצָא
  english_pob_choice: concerning the words of the book that has been found
  chosen_korean: 발견된 이 책의 말씀들에 관해
  alternatives_korean:
  - 발견된 이 두루마리의 말씀들에 관해
  - 발견된 이 책의 내용에 관해
  lexicon: HALOT
  rationale: ספר는 ‘책/두루마리’ 모두 가능하지만 본문에서는 자연스러운 ‘책’을 채택했고, דברי는 단순 ‘내용’보다 ‘말씀들’이 원문의 표현을 더 가깝게 보존합니다.
- source_word: נִתְּכָה בָנוּ
  english_pob_choice: has been poured out on us
  chosen_korean: 우리에게 크게 쏟아졌습니다
  alternatives_korean:
  - 우리에게 부어졌습니다
  - 우리 위에 쏟아졌습니다
  lexicon: HALOT
  rationale: נתך는 심판/진노가 ‘부어지다, 쏟아지다’는 이미지가 핵심이므로, 한국어에서도 동일한 은유를 살렸습니다.
- source_word: שָׁמְרוּ אֲבוֹתֵינוּ אֶת דְּבַר יְהוָה
  english_pob_choice: our fathers have not kept the word of Yahweh
  chosen_korean: 우리의 조상들이 야훼의 말씀을 지키지 않고
  alternatives_korean:
  - 우리의 아버지들이 야훼의 말씀을 지키지 않고
  - 우리 조상들이 주의 말씀을 지키지 않고
  lexicon: HALOT
  rationale: אבותינו는 ‘우리의 조상들’이지만, 사본의 남성 복수성과 계보적 지칭을 유지하면서 한국어에서는 가장 자연한 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 진노를 ‘쏟아졌다’로 유지할지 여부
  chosen_reading: 진노가 우리에게 크게 쏟아졌습니다
  alternative_readings:
  - 진노가 우리에게 내려졌습니다
  - 진노가 우리 위에 부어졌습니다
  rationale: 본문의 נתך는 단순한 감정 표현이 아니라 심판이 실제로 임한 이미지를 가지므로, 진노의 ‘부어짐/쏟아짐’을 유지해 경고의 강도를 보존했습니다.
  doctrine_reference: WLC idiom נתך + POB wrath language
- issue: ‘말씀’을 책의 내용이 아니라 하나님의 명령으로 유지할지 여부
  chosen_reading: 야훼의 말씀
  alternative_readings:
  - 야훼의 지시
  - 야훼의 명령
  rationale: דבר יהוה는 단순 정보가 아니라 야훼가 선포한 권위 있는 말씀을 뜻하므로, 본문 전체의 신학적 무게를 살려 ‘말씀’으로 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy — preserve lexical/theological tension
