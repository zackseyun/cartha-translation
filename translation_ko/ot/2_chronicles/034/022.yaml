source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ חִלְקִיָּ֜הוּ וַ/אֲשֶׁ֣ר הַ/מֶּ֗לֶךְ אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תוקהת בֶּן חַסְרָה֙ שׁוֹמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יוֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַ/יְדַבְּר֥וּ אֵלֶ֖י/הָ כָּ/זֹֽאת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
  footnotes:
  - marker: a
    text: Hebrew mishneh, likely a named district of Jerusalem; traditionally rendered 'the Second Quarter.'
    reason: cultural_note
  - marker: b
    text: Or 'keeper of the wardrobe.' The Hebrew is literally 'keeper of the garments.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 힐기야와 왕이 보낸 사람들은 예언자 훌다에게 갔습니다. 훌다는 셀롬의 아들, 토깟의 아들, 하스라의 아내이며, 의복을 맡아보는 사람이었습니다. 그녀는 예루살렘의 둘째 구역에 살고 있었고, 그들은 그녀에게 이렇게 말했습니다:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 mishneh는 예루살렘의 특정 지구를 가리키는 말로 보이며, 전통적으로 ‘둘째 구역’으로 옮깁니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘의복의 지킴이’입니다. 문맥상 의복 관리자 또는 관리인으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻלְדָּה הַנְּבִיאָה
  english_pob_choice: Huldah the prophetess
  chosen_korean: 예언자 훌다
  alternatives_korean:
  - 예언자였던 훌다
  - 여예언자 훌다
  lexicon: HALOT
  rationale: 히브리어 여성형 명사 표지를 살리되, 한국어에서는 직함으로 자연스럽게 옮겨 ‘예언자’로 두었습니다. ‘여예언자’는 성별 표지가 과도하게 드러나므로 피했습니다.
- source_word: שׁוֹמֵר הַבְּגָדִים
  english_pob_choice: keeper of the garments
  chosen_korean: 의복을 맡아보는 사람
  alternatives_korean:
  - 옷을 맡아보는 사람
  - 의복 관리자
  lexicon: HALOT
  rationale: 직역하면 ‘의복의 지킴이’이지만 한국어에서는 역할을 풀어 ‘의복을 맡아보는 사람’으로 자연스럽게 옮겼습니다. 본문이 가리키는 관직적 기능을 과도하게 특정하지 않으면서도 의미를 보존합니다.
- source_word: בַּמִּשְׁנֶה
  english_pob_choice: in the Second Quarter
  chosen_korean: 둘째 구역
  alternatives_korean:
  - 둘째 지구
  - 제2구역
  - 미쉬네
  lexicon: HALOT
  rationale: 예루살렘의 특정 지명을 가리키는 표현이므로 의미를 전달하는 번역을 택했습니다. POB의 ‘Second Quarter’와 같은 정보를 유지하되, 한국어 독자에게는 ‘구역’이 가장 이해하기 쉽습니다.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  english_pob_choice: 'and they spoke to her thus:'
  chosen_korean: '그들은 그녀에게 이렇게 말했습니다:'
  alternatives_korean:
  - '그들은 그녀에게 이같이 말했습니다:'
  - '그들은 그녀에게 이처럼 말했습니다:'
  lexicon: HALOT
  rationale: 서술 도입구로서 자연스러운 현대 한국어를 택했습니다. 히브리어의 지시적 뉘앙스는 ‘이렇게’로 충분히 보존됩니다.
theological_decisions:
- issue: 예언자 호칭의 성별 표지
  chosen_reading: 본문의 여성형 표지를 살리되 한국어에서는 일반적으로 이해되는 직함인 ‘예언자’를 사용했습니다.
  alternative_readings:
  - 여예언자
  - 예언녀
  rationale: 본문은 훌다가 여성임을 분명히 하지만, 한국어에서 직함은 성별을 별도 표지하지 않아도 문맥상 분명합니다. 성별 표지를 과잉 강조하지 않으면서도 원문의 정보를 보존했습니다.
  doctrine_reference: 성경 본문의 문법적 성별과 수용 언어의 자연스러움 사이의 균형
- issue: ‘둘째 구역’의 지명성
  chosen_reading: ‘둘째 구역’으로 옮겨 예루살렘의 특정 지역이라는 점을 살렸습니다.
  alternative_readings:
  - 미쉬네
  - 제2지구
  rationale: 본문은 단순한 일반 명사가 아니라 지역명일 가능성이 높습니다. 본문 의미를 독자가 즉시 이해하도록 하면서도, 지명임을 흐리지 않는 번역을 택했습니다.
  doctrine_reference: 역사 지리적 본문 해석
