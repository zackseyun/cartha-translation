  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
  footnotes:
  - marker: a
    text: Or 'the Israelites.' The Hebrew says 'the sons of Israel,' preserving Israel's genealogical and covenantal identity.
    reason: lexical_alternative
  - marker: b
    text: Or 'which is Zion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 솔로몬이 이스라엘의 장로들과 모든 지파의 우두머리들, 곧 이스라엘 자손의 가문 우두머리들을 예루살렘으로 소집하여, 야훼의 언약궤를 다윗의 도시, 곧 시온에서 메어 올리게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘 자손’은 단순한 민족명보다 혈통과 언약 정체성을 함께 드러내는 표현입니다.
    reason: source_note
  - marker: b
    text: ‘메어 올리다’는 ארון을 예루살렘/시온으로 ‘올려’ 모시는 의례적 방향성을 살린 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: אָז / Then
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그 후에
  - 그때에
  lexicon: BDB/HALOT
  rationale: 서술 전환 표지로서 앞절 다음 사건을 자연스럽게 이어 주는 한국어 대응어입니다.
- source_word: יַקְהֵיל
  english_pob_choice: assembled
  chosen_korean: 소집하여
  alternatives_korean:
  - 모아
  - 집합시켜
  - 소집했습니다
  lexicon: BDB/HALOT
  rationale: 솔로몬이 사람들을 ‘모으게 했다’는 행정적·공적 의미를 살려, 단순한 물리적 집합보다 주도적 호출을 드러냅니다.
- source_word: זִקְנֵי יִשְׂרָאֵל / כָּל רָאשֵׁי הַמַּטּוֹת / נְשִׂיאֵי הָאָבוֹת / לִבְנֵי יִשְׂרָאֵל
  english_pob_choice: the elders of Israel / all the heads of the tribes / the leaders of the fathers’ houses / the sons of Israel
  chosen_korean: 이스라엘의 장로들 / 모든 지파의 우두머리들 / 이스라엘 자손의 가문 우두머리들
  alternatives_korean:
  - 이스라엘의 어른들
  - 모든 지파 지도자들
  - 조상 집안의 지도자들
  - 이스라엘 백성의 아들들
  lexicon: BDB/HALOT
  rationale: 본문의 세 겹의 지도 구조를 평준화하지 않고, ‘장로들-지파의 우두머리들-가문 우두머리들’로 각각 살렸습니다. לִבְנֵי יִשְׂרָאֵל은 혈통·언약 정체성을 보존하기 위해 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: לְהַעֲלוֹת
  english_pob_choice: to bring up
  chosen_korean: 메어 올리게 하였습니다
  alternatives_korean:
  - 올리게 하였습니다
  - 가져오게 하였습니다
  - 들어 올리게 하였습니다
  lexicon: BDB/HALOT
  rationale: ארון을 예루살렘으로 ‘올려’ 모시는 방향성과 의례적 뉘앙스를 살리되, 한국어에서 자연스럽게 읽히도록 ‘메어 올리다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겨 언약 이름을 분명히 드러냅니다.
theological_decisions:
- issue: 지파·가문 구조를 현대 한국어에서 어떻게 보존할 것인가
  chosen_reading: 행정적 집회 묘사를 유지하면서도, ‘지파의 우두머리들’과 ‘가문 우두머리들’로 원문의 족보·언약적 질서를 드러냈습니다.
  alternative_readings:
  - 모든 부족의 지도자들
  - 각 집안의 대표들
  - 이스라엘 지도층
  rationale: 이 절은 성전/언약궤 이송을 위해 이스라엘의 공적 대표 구조를 소집하는 장면이므로, 단순한 ‘리더들’로 평준화하면 본문의 질서감이 약해집니다.
  doctrine_reference: 'Translation philosophy: source-structure preservation'
