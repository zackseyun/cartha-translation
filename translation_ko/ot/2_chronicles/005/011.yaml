  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
  footnotes:
  - marker: a
    text: Or 'without keeping to their divisions,' that is, without observing the normal priestly courses.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들이 성소에서 나올 때에, 곧 그곳에 있던 모든 제사장들이 자기 몸을 성별하였으므로, 그들은 자기 조에 따라 지키지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 조를 지키지 않고’, 곧 일반적인 제사장 순번을 따르지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת
  english_pob_choice: came out
  chosen_korean: 나올 때에
  alternatives_korean:
  - 나왔을 때
  - 나가는 때에
  lexicon: HALOT
  rationale: בְּ + 부정사구는 서술의 다음 사건을 여는 시간 부사절이므로, 자연스러운 한국어로 ‘나올 때에’가 적절합니다.
- source_word: מִן הַקֹּדֶשׁ
  english_pob_choice: of the Holy Place
  chosen_korean: 성소에서
  alternatives_korean:
  - 거룩한 곳에서
  - 지성소에서
  lexicon: HALOT
  rationale: 성전 문맥에서 הַקֹּדֶשׁ는 추상적 ‘거룩함’이 아니라 성전의 거룩한 공간을 가리키므로 ‘성소에서’로 옮겼습니다.
- source_word: הִתְקַדָּשׁוּ
  english_pob_choice: had consecrated themselves
  chosen_korean: 자기 몸을 성별하였으므로
  alternatives_korean:
  - 자신을 성별하였으므로
  - 자기 몸을 거룩하게 하였으므로
  lexicon: HALOT
  rationale: 히트파엘 קָדַשׁ는 여기서 제의적 자기 성별을 뜻하므로, 교리적 ‘성화’보다 제의적 준비를 드러내는 ‘성별하다’가 더 정확합니다.
- source_word: לְמַחְלְקוֹת
  english_pob_choice: without regard to divisions
  chosen_korean: 자기 조에 따라 지키지 않았습니다
  alternatives_korean:
  - 분반을 지키지 않았습니다
  - 정해진 조를 따르지 않았습니다
  lexicon: HALOT
  rationale: מַחְלְקוֹת는 제사장들의 분반/조를 가리키므로, 문맥상 ‘조’로 풀어 한국어 독자가 제의적 조직을 이해하도록 했습니다.
theological_decisions:
- issue: 제의적 성별의 성격
  chosen_reading: ‘성별하다’로 옮겨, 도덕적·내적 성화보다 성전 봉사를 위한 의식적 준비라는 의미를 유지했습니다.
  alternative_readings:
  - ‘거룩하게 하다’
  - ‘성화하다’
  rationale: 문맥은 성전 봉사 직전의 정결 준비이며, 후대 신학 용어를 앞세우면 מקור의 제의적 의미가 약화됩니다.
  doctrine_reference: 'Translation philosophy: preserve source-text sense; avoid importing later ecclesial theology into cultic language.'
