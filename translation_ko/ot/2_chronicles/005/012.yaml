source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֣ם הַ/מְשֹׁרֲרִ֣ים לְ/כֻלָּ֡/ם לְ/אָסָ֡ף לְ/הֵימָ֣ן לִֽ֠/ידֻתוּן וְ/לִ/בְנֵי/הֶ֨ם וְ/לַ/אֲחֵי/הֶ֜ם מְלֻבָּשִׁ֣ים בּ֗וּץ בִּ/מְצִלְתַּ֨יִם֙ וּ/בִ/נְבָלִ֣ים וְ/כִנֹּר֔וֹת עֹמְדִ֖ים מִזְרָ֣ח לַ/מִּזְבֵּ֑חַ וְ/עִמָּ/הֶ֤ם כֹּֽהֲנִים֙ לְ/מֵאָ֣ה וְ/עֶשְׂרִ֔ים מחצררים בַּ/חֲצֹֽצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
  footnotes:
  - marker: a
    text: Or 'harp-like instruments' for נְבָלִים; the precise distinction between the ancient stringed instruments named here is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'standing on the east side of the altar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 노래하는 레위 사람들, 곧 아삽, 헤만, 여두둔과 그들의 아들들과 그들의 형제들은 모두 고운 베를 입고, 제금과 비파와 수금을 들고, 제단의 동쪽에 서 있었으며, 그들과 함께 백이십 명의 제사장들이 나팔을 불고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비파’는 여기의 נְבָלִים을 가리키며, 고대 현악기의 정확한 구분은 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘제단의 동쪽 편에 서 있는’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  english_pob_choice: the Levites who were the singers
  chosen_korean: 노래하는 레위 사람들
  alternatives_korean:
  - 노래하는 레위인들
  - 찬양하는 레위 사람들
  lexicon: HALOT
  rationale: 레위 집단의 직무를 설명하는 분사구를 자연스러운 한국어로 옮기되, ‘노래하는’으로 음악적 역할을 분명히 했습니다.
- source_word: מְלֻבָּשִׁים בּוּץ
  english_pob_choice: were clothed in fine linen
  chosen_korean: 고운 베를 입고
  alternatives_korean:
  - 세마포를 입고
  - 고운 세마포를 입고
  lexicon: HALOT
  rationale: בּוּץ를 성소 문맥의 고급 린넨으로 보아 ‘고운 베’로 옮겼습니다. ‘세마포’는 전통적이지만 본문의 의복 재질을 직접 드러내기 위해 피했습니다.
- source_word: בִּמְצִלְתַּיִם וּבִנְבָלִים וְכִנֹּרוֹת
  english_pob_choice: with cymbals, harps, and lyres
  chosen_korean: 제금과 비파와 수금
  alternatives_korean:
  - 제금과 하프와 수금
  - 제금과 류트와 수금
  lexicon: HALOT
  rationale: 세 악기를 한국어 성경에서 널리 통용되는 명칭으로 옮기되, נְבָלִים과 כִנּוֹרוֹת의 구별을 유지하기 위해 ‘비파’와 ‘수금’을 함께 사용했습니다.
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  english_pob_choice: standing east of the altar
  chosen_korean: 제단의 동쪽에 서 있었으며
  alternatives_korean:
  - 제단 동쪽에 서 있었으며
  - 제단의 동편에 서 있었으며
  lexicon: HALOT
  rationale: מִזְרָח의 위치 관계를 간결하게 살려, 제단을 기준으로 동쪽이라는 공간 정보를 분명히 했습니다.
- source_word: מְחַצְרְרִים בַּחֲצֹצְרוֹת
  english_pob_choice: blowing trumpets
  chosen_korean: 나팔을 불고 있었습니다
  alternatives_korean:
  - 나팔을 불었습니다
  - 나팔을 불며 있었습니다
  lexicon: HALOT
  rationale: 분사형의 진행적 상태를 반영해, 제사장들이 의식 중 계속 나팔을 불고 있는 장면으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 예배 장면의 직무와 위계 표현
  chosen_reading: 레위 사람들과 제사장들을 각각 구분하여, 레위 사람들은 노래와 악기 연주를, 제사장들은 나팔 불기를 맡은 것으로 옮겼습니다.
  alternative_readings:
  - 두 집단을 단순히 함께 서 있는 예배자들로 평면화하는 번역
  - ‘레위인’과 ‘제사장들’을 지나치게 교회 용어로 치환하는 번역
  rationale: 본문은 성전 예배에서 서로 다른 직무를 수행하는 두 집단을 병렬로 제시합니다. 이 구분을 흐리지 않는 것이 원문의 예배 질서를 보존합니다.
  doctrine_reference: 성전 예배와 레위인/제사장 직무 구분(역대기 문맥)
