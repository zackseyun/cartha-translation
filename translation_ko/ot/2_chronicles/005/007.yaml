  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
  footnotes:
  - marker: a
    text: Or 'the Holy of Holies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 제사장들이 야훼의 언약궤를 그 자리에—곧 성전의 안쪽 성소, 지극히 거룩한 곳, 그룹들의 날개 아래로—가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 그들의 안치된 자리입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבִיאוּ
  english_pob_choice: brought
  chosen_korean: 가져왔습니다
  alternatives_korean:
  - 옮겨왔습니다
  - 들여왔습니다
  lexicon: HALOT
  rationale: 히필 동사 בוא의 기본 의미를 반영하되, 궤를 예배 공간 안으로 이동시키는 서술에 자연스럽고 정확한 합쇼체 동사로 옮겼습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들이
  alternatives_korean:
  - 사제들이
  lexicon: HALOT
  rationale: 히브리어의 특정한 제의적 직분을 가리키므로, 한국어 성경에서 널리 쓰이면서도 직분을 분명히 드러내는 '제사장'을 택했습니다.
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: the ark of the covenant of Yahweh
  chosen_korean: 야훼의 언약궤
  alternatives_korean:
  - 야훼의 계약궤
  - 야훼의 증거궤
  lexicon: HALOT
  rationale: 아론은 제의용 성궤이므로 '언약궤'가 핵심 의미를 가장 직접적으로 살립니다. יְהוָה는 프로젝트 기본 원칙에 따라 '야훼'로 옮겼습니다.
- source_word: מְקוֹמוֹ
  english_pob_choice: its place
  chosen_korean: 그 자리에
  alternatives_korean:
  - 그 위치에
  - 그 정해진 곳에
  lexicon: HALOT
  rationale: 문맥상 궤가 지정된 안치 장소로 들어갔다는 뜻이므로, 영어 POB의 절제된 표현을 살려 지나친 설명 없이 '그 자리'로 옮겼습니다.
- source_word: דְּבִיר הַבַּיִת / קֹדֶשׁ הַקְּדָשִׁים
  english_pob_choice: the inner sanctuary of the house / the Most Holy Place
  chosen_korean: 성전의 안쪽 성소, 지극히 거룩한 곳
  alternatives_korean:
  - 집의 안쪽 성소, 지성소
  - 성전의 내실, 지성소
  lexicon: HALOT
  rationale: דְּבִיר는 성전의 가장 안쪽 공간을 가리키므로 '안쪽 성소'로 옮기고, קֹדֶשׁ הַקְּדָשִׁים은 전통적 용어 '지극히 거룩한 곳'으로 직역해 원문의 최상급 강조를 보존했습니다.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  english_pob_choice: under the wings of the cherubim
  chosen_korean: 그룹들의 날개 아래로
  alternatives_korean:
  - 그룹들의 날개 밑으로
  - 그룹들의 날개 아래
  lexicon: HALOT
  rationale: תַּחַת의 공간 관계를 살려 '아래로'를 넣었고, כְּרוּבִים은 관습적 음역 '그룹들'을 사용해 성전의 상징적 존재를 그대로 유지했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 יְהוָה가 직접 나오므로, 프로젝트 기본 원칙에 따라 신적 고유명사를 '야훼'로 옮겨 언약의 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 지성소 표현의 처리
  chosen_reading: 지극히 거룩한 곳
  alternative_readings:
  - 지성소
  - 가장 거룩한 곳
  rationale: קֹדֶשׁ הַקְּדָשִׁים의 최상급 구조를 드러내면서도, 전통 용어를 그대로 고정하기보다 원문의 강조를 한국어로 투명하게 전달하는 방향을 택했습니다.
  doctrine_reference: 성막/성전 용어의 원문 직역 원칙
