  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
  footnotes:
  - marker: a
    text: Or 'before the Most Holy Place' for 'in front of the inner sanctuary.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 막대들을 길게 하였으므로, 그 막대들의 끝이 언약궤에서부터 지성소 앞쪽으로 보였으나[a], 바깥에서는 보이지 않았습니다. 그 막대들은 오늘날까지 거기에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “지성소 앞에.” 원문의 공간 표현은 막대 끝이 언약궤에서 지성소 앞쪽으로 드러난 위치를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ / הַבַּדִּים
  english_pob_choice: the poles were so long / were made long
  chosen_korean: 그 막대들은 길어서
  alternatives_korean:
  - 그 막대들은 길게 만들어져서
  - 그 막대들은 길어져서
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 살리되, 한국어에서는 결과 상태를 나타내는 ‘길어서’가 가장 자연스럽고 문맥상 적절합니다.
- source_word: רָאשֵׁי הַבַּדִּים
  english_pob_choice: the heads of the poles
  chosen_korean: 그 막대 끝들이
  alternatives_korean:
  - 그 막대 머리들이
  - 그 막대의 머리 부분이
  lexicon: HALOT
  rationale: 직역하면 ‘머리’이지만, 물리적 끝부분을 가리키는 뜻이므로 한국어에서는 ‘끝’이 의미를 정확하게 전달합니다.
- source_word: עַל פְּנֵי הַדְּבִיר
  english_pob_choice: in front of the inner sanctuary
  chosen_korean: 지성소 앞에 있는
  alternatives_korean:
  - 지성소 앞의
  - 내실 앞에 있는
  lexicon: HALOT
  rationale: דְּבִיר는 성전의 ‘지성소’를 가리키며, עַל פְּנֵי는 공간 관계상 ‘앞에 있는’으로 옮기는 것이 자연스럽습니다.
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  english_pob_choice: and they are there to this day
  chosen_korean: 그것들은 오늘날까지 거기에 있습니다
  alternatives_korean:
  - 그것들은 오늘날까지 거기에 있었습니다
  - 그것들은 지금까지 거기에 있습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘오늘날까지’를 한국어 관용에 맞게 옮기되, 현재 시점의 지속을 분명히 했습니다.
