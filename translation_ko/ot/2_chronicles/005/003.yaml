  text: וַ/יִּקָּהֲל֧וּ אֶל הַ/מֶּ֛לֶךְ כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל בֶּ/חָ֑ג ה֖וּא הַ/חֹ֥דֶשׁ הַ/שְּׁבִעִֽי־־׃
base_translation:
