  source_fidelity: 개정이 필요합니다. בְּחֹרֵב는 ‘호렙에서’인데 초안은 이를 ‘시내 산에서’로 바꾸어 지명을 조화시켰습니다. 또한 לֻחוֹת에는 이 절에서 ‘돌’이 명시되지 않으므로 ‘돌판’은 본문에 정보를 더합니다. 두 번째 관계절은 호렙에서 야훼께서 언약을 맺으신 일을 가리키므로, 이를 문장 안에서 분명히 연결했습니다.
