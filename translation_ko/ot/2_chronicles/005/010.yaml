  - 야훼께서 이스라엘 자손과 언약을 세우셨는데
  rationale: כָּרַת בְּרִית의 관용적 뜻은 ‘언약을 맺다’이므로, 한국어에서도 의미를 자연스럽게 드러내면서 ‘끊다’의 직역 이미지는 본문 이해를 방해할 수 있어 피했습니다.
  doctrine_reference: 언약 표현 관용구(כָּרַת בְּרִית)
