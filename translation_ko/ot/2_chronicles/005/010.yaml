  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
  footnotes:
  - marker: a
    text: Or, more formally, 'the two tablets that Moses placed at Horeb.' The Hebrew verb is literally 'gave,' but here it refers to placing the tablets in the ark.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'sons of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 궤 안에는 야훼께서 이스라엘 자손[b]이 이집트에서 나올 때 그들과 언약을 맺으신 호렙에서 모세가 넣어 둔 두 판[a] 외에는 아무것도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נָתַן은 문자적으로 ‘주다’이지만, 여기서는 판들을 궤 안에 ‘두다’ 또는 ‘넣다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 직역하여 ‘이스라엘의 아들들’입니다.
    reason: lexical_alternative
