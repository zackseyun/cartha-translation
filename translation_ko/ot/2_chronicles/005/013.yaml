  text: וַ/יְהִ֣י כְ֠/אֶחָד ל/מחצצרים וְ/לַ/מְשֹֽׁרֲרִ֜ים לְ/הַשְׁמִ֣יעַ קוֹל אֶחָ֗ד לְ/הַלֵּ֣ל וּ/לְ/הֹדוֹת֮ לַ/יהוָה֒ וּ/כְ/הָרִ֣ים ק֠וֹל בַּ/חֲצֹצְר֨וֹת וּ/בִ/מְצִלְתַּ֜יִם וּ/בִ/כְלֵ֣י הַ/שִּׁ֗יר וּ/בְ/הַלֵּ֤ל לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּ֑/וֹ וְ/הַ/בַּ֛יִת מָלֵ֥א עָנָ֖ן בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
  footnotes:
  - marker: a
    text: Or 'in unison' for 'were as one.'
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, often denoting loyal, covenantal love; traditionally also rendered ''mercy'' or ''lovingkindness.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'and with praise to the LORD, saying,'.
    reason: previous_rendering
translation:
  language: ko
  text: 나팔수들과 노래하는 이들이 마치 한 사람처럼 되어, 야훼를 찬양하며 감사하는 데 한 소리를 내고, 나팔과 심벌즈와 노래의 악기들을 가지고 야훼를 찬양할 때, "그는 선하시니, 그의 인자하심이 영원합니다" 하니, 집 곧 야훼의 집에 구름이 가득 찼습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마치 한 사람처럼’은 공동의 일치성을 살린 표현입니다.
    reason: korean_style_note
  - marker: b
    text: ‘노래의 악기들’은 히브리어 כְּלֵי הַשִּׁיר의 기능적 의미를 반영한 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘인자하심’은 히브리어 חֶסֶד의 언약적이고 지속적인 사랑을 옮긴 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֶחָד
  english_pob_choice: were as one
  chosen_korean: 마치 한 사람처럼
  alternatives_korean:
  - 한마음으로
  - 한목소리로
  lexicon: HALOT
  rationale: ‘한 사람처럼’은 단순한 동시성이 아니라 공동의 일치성을 살리며, 뒤의 ‘한 소리’와도 자연스럽게 이어집니다.
- source_word: לְהַשְׁמִיעַ קוֹל אֶחָד
  english_pob_choice: to make one sound
  chosen_korean: 한 소리를 내고
  alternatives_korean:
  - 한 목소리를 내고
  - 한 소리만 내며
  lexicon: HALOT
  rationale: 히브리어의 ‘하나의 소리’라는 구체적 청각 이미지를 살려, 한국어에서도 직설적으로 옮겼습니다.
- source_word: לְהַלֵּל וּלְהֹדוֹת לַיהוָה
  english_pob_choice: in praising and giving thanks to Yahweh
  chosen_korean: 야훼를 찬양하며 감사하는 데
  alternatives_korean:
  - 야훼를 찬양하고 감사하며
  - 야훼께 찬양과 감사를 드리며
  lexicon: HALOT
  rationale: 목적/동시 행위를 나타내는 동사구이므로, 행위의 진행을 살리는 ‘-하며’ 구조로 옮겼습니다.
- source_word: וּכְהָרִים קוֹל
  english_pob_choice: and when they lifted up their voice
  chosen_korean: 목소리를 높일 때
  alternatives_korean:
  - 소리를 높일 때
  - 목소리를 들 높이며
  lexicon: HALOT
  rationale: ‘소리/목소리를 높이다’는 관용적 표현으로, 원문의 ‘소리 내어 올리다’는 의미를 자연스럽게 전달합니다.
- source_word: בַּחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר
  english_pob_choice: with trumpets and cymbals and instruments for song
  chosen_korean: 나팔과 심벌즈와 노래의 악기들을 가지고
  alternatives_korean:
  - 나팔과 심벌즈와 음악 기구들을 가지고
  - 나팔과 징과 노래 악기들을 가지고
  lexicon: HALOT
  rationale: ‘כלי השיר’는 단순한 일반 악기보다 ‘노래를 위한 악기들’이라는 기능을 드러내므로, 이를 직역에 가깝게 반영했습니다.
- source_word: כִּי טוֹב כִּי לְעוֹלָם חַסְדּוֹ
  english_pob_choice: For he is good, for his steadfast love endures forever
  chosen_korean: 그는 선하시니, 그의 인자하심이 영원합니다
  alternatives_korean:
  - 그는 좋으시니, 그의 인자하심이 영원합니다
  - 그는 선하시니, 그의 한결같은 사랑이 영원합니다
  lexicon: HALOT
  rationale: ‘טוֹב’는 문맥상 도덕적 선함을 가리키므로 ‘선하시니’로, ‘חֶסֶד’는 언약적이고 지속적인 사랑을 살려 ‘인자하심’으로 옮겼습니다.
theological_decisions:
