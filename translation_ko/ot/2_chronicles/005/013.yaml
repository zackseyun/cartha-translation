base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
  footnotes:
  - marker: a
    text: Or 'in unison' for 'were as one.'
    reason: lexical_alternative
  - marker: b
    text: '''Steadfast love'' translates Hebrew hesed, often denoting loyal, covenantal love; traditionally also rendered ''mercy'' or ''lovingkindness.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'and with praise to the LORD, saying,'.
    reason: previous_rendering
translation:
  language: ko
  text: 나팔 부는 이들과 노래하는 이들이 한마음이 되어[a], 야훼를 찬양하고 감사하려고 한 소리를 내며, 나팔과 심벌즈와 노래에 쓰는 악기들로[b] 목소리를 높여 야훼를 찬양하며 “그는 선하시며, 그의 한결같은 사랑은 영원합니다[c]” 하고 있을 때에, 그 집, 곧 야훼의 집이 구름으로 가득 찼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한마음이 되어’는 히브리어 כְאֶחָד(직역하면 ‘한 사람처럼’)의 일치된 행동이라는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘노래에 쓰는 악기들’은 히브리어 כְּלֵי הַשִּׁיר을 옮긴 말로, 노래나 음악에 사용되는 악기들을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘한결같은 사랑’은 히브리어 חֶסֶד을 옮긴 말로, 지속적이고 신실한 사랑을 뜻합니다. 전통적으로는 ‘인자’ 또는 ‘긍휼’로도 번역합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֶחָד
