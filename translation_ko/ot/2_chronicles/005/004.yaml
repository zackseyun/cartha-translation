lexical_decisions:
- source_word: וַיָּבֹאוּ / came
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 도착하여
  - 들어와서
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 wayyiqtol의 연속 동작을 자연스럽게 살리되, ‘오다’의 기본 의미를 유지했습니다.
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל / all the elders of Israel
  english_pob_choice: the elders of Israel
  chosen_korean: 이스라엘의 모든 장로
  alternatives_korean:
  - 이스라엘의 장로들 모두
  - 이스라엘의 모든 원로
  lexicon: HALOT
  rationale: 공동체를 대표하는 공식적 지도층이라는 뜻을 살려 ‘장로’를 유지하고, כֹּל의 포괄성을 ‘모든’으로 옮겼습니다.
- source_word: וַיִּשְׂאוּ / carried
  english_pob_choice: carried
  chosen_korean: 메었습니다
  alternatives_korean:
  - 들었습니다
  - 운반했습니다
  - 지고 갔습니다
  lexicon: HALOT
  rationale: 언약궤를 운반하는 행위는 한국어 성서 문맥에서 ‘메다’가 가장 정확하고 자연스럽게 전달합니다.
- source_word: אֶת הָאָרוֹן / the ark
  english_pob_choice: the ark
  chosen_korean: 그 궤
  alternatives_korean:
  - 궤
  - 그 언약궤
  lexicon: HALOT
  rationale: 본문은 단순히 ‘그 궤’라고 하며, 영어 본문의 주석처럼 문맥상 언약궤를 가리키더라도 본문 자체의 표현을 과잉 확장하지 않았습니다.
theological_decisions:
- issue: 언약궤의 명시 여부
  chosen_reading: 본문에는 ‘그 궤’로 두고, ‘언약궤’는 본문 밖의 문맥적 식별로만 남깁니다.
  alternative_readings:
  - 그 언약궤
  - 언약궤를
  rationale: 히브리어 원문은 הָאָרוֹן만 사용하므로, 문맥상 의미가 분명해도 본문에 없는 말을 덧붙이지 않는 원문 우선 원칙을 따랐습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; never paraphrase beyond what the source text warrants.'
