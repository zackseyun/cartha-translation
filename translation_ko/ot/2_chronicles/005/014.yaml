language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹא יָֽכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמ֥וֹד לְ/שָׁרֵ֖ת מִ/פְּנֵ֣י הֶ/עָנָ֑ן כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית הָ/אֱלֹהִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
  footnotes:
  - marker: a
    text: Or 'the temple of God.' Literally, 'the house of God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들이 구름 때문에 서서 섬길 수 없었습니다. 야훼의 영광이 하나님의 집을 가득 채웠기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 성전.’ 직역하면 ‘하나님의 집’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  english_pob_choice: could not
  chosen_korean: 서서 섬길 수 없었습니다
  alternatives_korean:
  - 할 수 없었습니다
  - 서 있을 수 없었습니다
  lexicon: HALOT
  rationale: יָכְלוּ의 불능을 자연스럽게 풀면서, 뒤의 ‘서다’와 ‘섬기다’를 함께 살려 제사장들의 예배 집행이 중단된 상황을 분명히 했습니다.
- source_word: לַעֲמוֹד לְשָׁרֵת
  english_pob_choice: stand to minister
  chosen_korean: 서서 섬길
  alternatives_korean:
  - 서서 봉사할
  - 서서 직무를 수행할
  lexicon: HALOT
  rationale: עמד와 שרת의 결합을 직역적으로 유지하되, 제의적 맥락을 살려 ‘섬기다’로 옮겼습니다.
- source_word: מִפְּנֵי הֶעָנָן
  english_pob_choice: because of the cloud
  chosen_korean: 구름 때문에
  alternatives_korean:
  - 구름으로 인해
  - 구름 앞에서
  lexicon: HALOT
  rationale: מִפְּנֵי의 원인 의미를 현대 한국어의 가장 자연스러운 인과 표현으로 옮겼습니다.
- source_word: כְבוֹד יְהוָה
  english_pob_choice: the glory of Yahweh
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 야훼의 영광스러움
  - 여호와의 영광
  lexicon: HALOT
  rationale: 본문이 하나님의 이름 יְהוָה를 직접 사용하므로 POB의 기준에 따라 ‘야훼’를 유지했고, כְבוֹד는 통상적인 ‘영광’으로 옮겼습니다.
- source_word: בֵּית הָאֱלֹהִים
  english_pob_choice: the house of God
  chosen_korean: 하나님의 집
  alternatives_korean:
  - 하나님의 성전
  - 하나님의 집(성전)
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 살리되, 문맥상 의미가 분명하므로 ‘집’으로 옮기고 별도의 해석어는 본문에 넣지 않았습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 본문은 POB 기준에 따라 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: WLC의 יְהוָה를 제목이 아닌 고유한 언약 이름으로 유지해야 하므로, POB의 일관된 원칙에 맞춰 ‘야훼’를 사용했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
