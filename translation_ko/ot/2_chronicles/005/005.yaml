  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ אֶת הָ/אָרוֹן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל הֶעֱל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
  footnotes:
  - marker: a
    text: Or, more literally, 'the priests, the Levites.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 언약궤와 회막과, 회막 안에 있는 모든 거룩한 기구들을 가져올렸습니다. 레위 사람 제사장들이 그것들을 가져올렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로는 ‘제사장들, 곧 레위 사람들’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  english_pob_choice: brought up
  chosen_korean: 가져올렸습니다
  alternatives_korean:
  - 올렸습니다
  - 가져왔습니다
  lexicon: HALOT
  rationale: עלה의 사역형은 단순 이동보다 ‘위로 올려 옮김’의 뜻이 핵심이므로, 성소 물품을 예루살렘 성전으로 이동시키는 맥락을 살려 ‘가져올렸습니다’로 옮겼습니다.
- source_word: הָאָרוֹן
  english_pob_choice: the ark
  chosen_korean: 언약궤
  alternatives_korean:
  - 궤
  - 언약의 궤
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘궤’이지만, 역대기 문맥에서는 그 대상이 성소의 언약궤임이 분명하므로 한국어 독자의 이해를 위해 ‘언약궤’로 풀었습니다.
- source_word: אֹהֶל מוֹעֵד
  english_pob_choice: the tent of meeting
  chosen_korean: 회막
  alternatives_korean:
  - 만남의 장막
  - 모임의 장막
  lexicon: HALOT
  rationale: 한국 교회 독자에게 가장 익숙한 성막 표현은 ‘회막’이지만, 바로 뒤에서 다시 ‘tent’를 반영해 ‘회막 안’으로도 일관되게 처리하여 원문의 반복을 살렸습니다.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: the Levitical priests
  chosen_korean: 레위 사람 제사장들
  alternatives_korean:
  - 레위계 제사장들
  - 레위 사람들인 제사장들
  lexicon: HALOT
  rationale: 히브리어의 병렬 표기는 제사장과 레위 사람을 동일시하기보다, 제사장들이 레위 계통임을 표시합니다. 이를 ‘레위 사람 제사장들’로 옮겨 직역성과 의미를 함께 살렸습니다.
theological_decisions:
- issue: ‘가져올리다’의 방향성과 성소 물품의 신성성
  chosen_reading: 성소 기구들을 단순히 운반한 것이 아니라, 성전으로 ‘올려’ 옮긴 행위를 강조했습니다.
  alternative_readings:
  - 가져왔습니다
  - 옮겼습니다
  rationale: עלה의 반복과 성소 문맥은 이동의 신학적 방향성, 곧 거룩한 것의 예루살렘 성전 중심 배치를 드러냅니다. 그래서 일반적인 ‘가져오다/옮기다’보다 상승성을 드러내는 표현을 택했습니다.
  doctrine_reference: 성소-성전의 거룩한 공간 질서와 언약궤의 중심성
