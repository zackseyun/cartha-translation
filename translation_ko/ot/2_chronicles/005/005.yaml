revisions:
- from: 그들은 언약궤와 회막과, 회막 안에 있는 모든 거룩한 기구들을 가져올렸습니다. 레위 사람 제사장들이 그것들을 가져올렸습니다.[a]
  to: 그들은 언약궤와 회막과 회막 안에 있는 모든 거룩한 기구들을 올려 옮겼습니다. 레위계 제사장들이[a] 그것들을 올려 옮겼습니다.
  rationale: 문법적으로 부자연스러운 ‘가져올렸습니다’를 ‘올려 옮겼습니다’로 교체하여 עלה 사역형의 상승·운반 의미와 원문의 반복을 함께 살렸습니다. 마지막 주어는 한국어의 자연스러움과 문맥상 의미를 고려해 ‘레위계 제사장들’로 고치고, 문자적 대안은 각주로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:16:29Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 목적어 열거, 두 차례의 עלה 사역형 반복, 그리고 마지막 주어인 ‘제사장들, 레위 사람들’을 충실히 반영했습니다. 다만 초안의 ‘가져올렸습니다’는 현대 표준 한국어에서 부자연스럽고 동사 결합이 적절하지 않아, 방향성을 유지하는 ‘올려 옮겼습니다’로 고쳤습니다. ‘언약궤’는 문맥상 지시 대상을 명확히 하는 관습적 표현이지만, 히브리어 자체는 단순히 ‘궤’라고 한다는 점은 유의할 수 있습니다.
  naturalness: ‘올려 옮겼습니다’는 성전으로의 운반이라는 상승 방향을 자연스럽게 드러내며, 합쇼체 서술에도 맞습니다. ‘레위 사람 제사장들’은 한국어 명사 결합으로 다소 어색하므로 ‘레위계 제사장들’로 다듬었습니다. 각주 표지는 대안 독법이 걸리는 명사구 바로 뒤에 배치했습니다.
  terminology: ‘회막’, ‘언약궤’, ‘거룩한 기구들’은 한국어 성서 문맥에서 통용되며 이해하기 쉽습니다. הַכֹּהֲנִים הַלְוִיִּם는 제사장과 모든 레위인을 무차별적으로 동일시하지 않도록 ‘레위계 제사장들’로 번역하고, 문자적 어순은 각주에 보존했습니다.
  issues:
