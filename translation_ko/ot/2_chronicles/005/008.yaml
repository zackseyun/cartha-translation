language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּהְי֤וּ הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם עַל מְק֖וֹם הָ/אָר֑וֹן וַ/יְכַסּ֧וּ הַ/כְּרוּבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
  footnotes:
  - marker: a
    text: Or 'stretching out their wings over the ark's place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그룹들이 날개를 펴서 언약궤의 자리 위에 있었고, 그룹들이 위에서 언약궤와 그 채들을 덮었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그룹들’은 성전 보좌를 지키는 הכרובים의 통상적 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרוּבִים
  english_pob_choice: the cherubim
  chosen_korean: 그룹들
  alternatives_korean:
  - 케루빔
  - 천사들
  lexicon: HALOT
  rationale: 성전 문맥의 הכרובים은 한국어 성경에서 익숙한 ‘그룹들’이 가장 자연스럽고, 단순한 천사로 풀면 정체성이 흐려집니다.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  english_pob_choice: spreading out their wings
  chosen_korean: 날개를 펴서
  alternatives_korean:
  - 날개를 펼치며
  - 날개를 펴고
  lexicon: HALOT
  rationale: פָּרַשׂ의 핵심은 ‘펴다/펼치다’이므로 진행 중인 자세를 자연스럽게 드러내는 ‘날개를 펴서’로 옮겼습니다.
- source_word: עַל מְקוֹם הָאָרוֹן
  english_pob_choice: over the place of the ark
  chosen_korean: 언약궤의 자리 위에
  alternatives_korean:
  - 언약궤의 장소 위에
  - 언약궤 자리 위에
  lexicon: HALOT
  rationale: מָקוֹם의 ‘자리/장소’ 뜻을 살리되, 한국어에서는 ‘언약궤의 자리 위에’가 문맥상 가장 자연스럽습니다.
- source_word: בַּדָּיו
  english_pob_choice: its poles
  chosen_korean: 그 채들
  alternatives_korean:
  - 그 막대기들
  - 그 운반채들
  lexicon: HALOT
  rationale: בַּדִּים은 언약궤 운반용 ‘채’이므로, 성경적 용례를 살리면서도 현대어로 이해되는 ‘채들’을 택했습니다.
theological_decisions:
- issue: 구름 같은 가림이 아니라 물리적 덮임으로 서술된 동작
  chosen_reading: 본문의 동사는 상징적 ‘그늘짐’보다, 그룹들이 언약궤와 그 채들을 실제로 위에서 덮는 모습을 직접 진술하는 것으로 옮겼습니다.
  alternative_readings:
  - ‘그늘지게 하였습니다’처럼 은유적으로 완화하는 번역
  - ‘드리워 있었습니다’로 시각적 효과를 강조하는 번역
  rationale: 히브리어 וַיְכַסּוּ는 일반적으로 ‘덮다’의 직접적 의미가 강하므로, 성전 묘사의 구체성을 보존하는 쪽이 원문에 충실합니다.
  doctrine_reference: 성막/성전 묘사 충실성, 출 25장 언약궤 규례와의 연속성
- issue: ‘언약궤’ 용어 선택
  chosen_reading: הָאָרוֹן을 단순히 ‘궤’로 줄이지 않고 ‘언약궤’로 옮겼습니다.
  alternative_readings:
  - 궤
  - 법궤
  rationale: 이 문맥의 הארון은 성소 기구인 언약궤를 가리키므로, 한국어 독자가 즉시 पहचान할 수 있는 ‘언약궤’가 가장 분명합니다.
  doctrine_reference: 성전/언약궤 문맥
