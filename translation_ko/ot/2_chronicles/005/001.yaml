source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣יד אָבִ֗י/ו וְ/אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת כָּל הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־־ס־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
  footnotes:
  - marker: a
    text: Or, 'the things dedicated by David his father' or 'the consecrated things of David his father.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 솔로몬이 야훼의 집을 위하여 한 모든 일이 마쳐졌습니다. 그러자 솔로몬은 그의 아버지 다윗의 거룩한 물품들[a]과 은과 금과 모든 기구를 가져다가 하나님의 집의 창고들에 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아버지 다윗이 바쳐 둔 물품들’ 또는 ‘그의 아버지 다윗의 성별된 물품들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם כָּל הַמְּלָאכָה
  english_pob_choice: Thus all the work ... was finished
  chosen_korean: 이렇게 … 한 모든 일이 끝났습니다
  alternatives_korean:
  - 모든 일이 완성되었습니다
  - 모든 공사가 끝났습니다
  lexicon: HALOT
  rationale: 완료된 상태를 자연스럽게 드러내면서도 성전 건축 전체 작업의 종결이라는 의미를 보존했습니다.
- source_word: לְבֵית יְהוָה
  english_pob_choice: for the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 주님의 집
  - 여호와의 집
  lexicon: HALOT
  rationale: 본문의 신명(יהוה)을 POB 기본 원칙에 따라 야훼로 옮기고, ‘집’ 이미지를 유지했습니다.
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  english_pob_choice: the holy things of David his father
  chosen_korean: 아버지 다윗의 거룩한 것들
  alternatives_korean:
  - 아버지 다윗이 바쳐 둔 것들
  - 아버지 다윗의 성별된 것들
  lexicon: HALOT
  rationale: קדשׁ의 기본적 성격을 반영해 ‘거룩한 것들’로 옮기되, 헌납·성별의 뉘앙스는 각주로 보완했습니다.
- source_word: כָּל הַכֵּלִים
  english_pob_choice: all the vessels
  chosen_korean: 모든 기구
  alternatives_korean:
  - 모든 그릇
  - 모든 도구
  lexicon: HALOT
  rationale: 성전 문맥에서 כֵּלִים은 성물/기구를 가리키므로, 한국어로는 성전 용례에 자연스러운 ‘기구’를 택했습니다.
- source_word: בְּאֹצְרוֹת בֵּית הָאֱלֹהִים
  english_pob_choice: into the treasuries of the house of God
  chosen_korean: 하나님 집의 창고에
  alternatives_korean:
  - 하나님 집의 곳간에
  - 하나님 집의 창고들에
  lexicon: HALOT
  rationale: אֹצָר의 핵심 의미는 저장 장소이므로, 성전 재물 보관 장소를 분명히 하는 ‘창고’로 옮겼습니다.
theological_decisions:
- issue: 야훼(יהוה)와 하나님(הָאֱלֹהִים)의 병행 유지
  chosen_reading: 앞부분은 ‘야훼의 집’, 뒷부분은 ‘하나님 집’으로 각각 살렸습니다.
  alternative_readings:
  - 둘 다 ‘주님의 집’으로 통일
  - 둘 다 ‘하나님의 집’으로 통일
  rationale: 히브리어는 같은 절 안에서 신명 표기를 달리하므로, 이를 평탄화하지 않고 구분해 독자가 원문 변화를 볼 수 있게 했습니다.
  doctrine_reference: 'Translation philosophy #1 and #5'
- issue: קָדְשֵׁי דָּוִיד의 성격
  chosen_reading: ‘거룩한 것들’로 직역하되, 각주로 ‘바쳐 둔 것들/성별된 것들’의 대안을 제시했습니다.
  alternative_readings:
  - ‘바쳐 둔 것들’
  - ‘성별된 것들’
  rationale: 본문은 다윗이 따로 구별해 둔 재물을 가리킬 가능성을 품고 있으므로, 한국어 본문은 직역을 유지하고 해석적 여지는 각주에 남겼습니다.
  doctrine_reference: Lexical transparency and source-level ambiguity
