id: 2CH.5.6
reference: 2 Chronicles 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֧ת יִשְׂרָאֵ֛ל הַ/נּוֹעָדִ֥ים עָלָ֖י/ו לִ/פְנֵ֣י הָ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
  footnotes:
  - marker: a
    text: Or, 'who were assembled with him' for 'who had gathered before him.' The Hebrew expression may be understood as the assembly gathered in Solomon's presence or gathered with him.
    reason: lexical_alternative
  - marker: b
    text: '''Sheep'' renders Hebrew צֹאן, a broader term that can include small livestock such as sheep and goats.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕과 그 앞에[a] 모여 언약궤 앞에 있던 이스라엘의 온 회중은 수가 너무 많아 셀 수도 없고 헤아릴 수도 없는 양[b]과 소를 희생 제물로 바치고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 회중이 솔로몬의 ‘그 앞에’ 모였다는 뜻일 수도 있고, 그와 ‘함께’ 모였다는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘양’은 히브리어 צֹאן을 옮긴 것으로, 양과 염소 같은 작은 가축을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  english_pob_choice: the assembly of Israel
  chosen_korean: 이스라엘의 온 회중
  alternatives_korean:
  - 이스라엘의 집회
  - 이스라엘의 공동체
  lexicon: HALOT
  rationale: עֵדָה는 제도명칭보다 ‘모여 있는 공동체’를 가리키므로, 합쇼체 문맥에서 ‘회중’이 가장 자연스럽고 집합성을 잘 드러냅니다.
- source_word: הַנּוֹעָדִים עָלָיו
  english_pob_choice: who had gathered before him
  chosen_korean: 그 앞에 … 모인
  alternatives_korean:
  - 그와 함께 모인
  - 그 앞에 집결한
  lexicon: HALOT
  rationale: 니팔 분사 뉘앙스를 살려 ‘모인’으로 옮기고, עָלָיו의 공간적 관계는 ‘그 앞에’로 반영했습니다.
- source_word: לִפְנֵי הָאָרוֹן
  english_pob_choice: before the ark
  chosen_korean: 언약궤 앞에
  alternatives_korean:
  - 궤 앞에
  - 언약궤 앞에서
  lexicon: HALOT
  rationale: הָאָרוֹן은 성막/언약궤를 가리키므로, 독자에게 더 분명하도록 ‘언약궤’로 특정했습니다.
- source_word: צֹאן וּבָקָר
  english_pob_choice: sheep and cattle
  chosen_korean: 양과 소
  alternatives_korean:
  - 양떼와 소떼
  - 가축과 소
  lexicon: HALOT
  rationale: צֹאן은 작은 가축의 포괄어이지만 제사 문맥에서 한국어로는 ‘양’이 가장 자연스럽고, בָּקָר은 ‘소’가 직접적입니다.
- source_word: מְזַבְּחִים
  english_pob_choice: were sacrificing
  chosen_korean: 바치고 있었습니다
  alternatives_korean:
  - 희생제물을 드리고 있었습니다
  - 제사를 드리고 있었습니다
  lexicon: HALOT
  rationale: 동작이 진행 중임을 살리면서도 제의적 행위를 분명히 드러내기 위해 ‘바치다’를 선택했습니다.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ מֵרֹב
  english_pob_choice: that could not be counted or numbered because of their great number
  chosen_korean: 그 수가 너무 많아 셀 수도 없고 헤아릴 수도 없는
  alternatives_korean:
  - 셀 수 없이 많은
  - 세고 헤아릴 수 없는
  lexicon: HALOT
  rationale: 쌍동 표현 ‘셀 수도 없고 헤아릴 수도 없는’으로 히브리어의 강조를 보존했고, מֵרֹב은 ‘그 수가 너무 많아’로 원인 관계를 살렸습니다.
theological_decisions:
- issue: 제의 동사 עבד/זבח 계열의 한국어 톤
  chosen_reading: ‘바치고 있었습니다’로 번역해 제물의 봉헌성과 진행성을 함께 드러냈습니다.
  alternative_readings:
  - ‘제사를 드리고 있었습니다’
  - ‘희생제물을 드리고 있었습니다’
  rationale: 이 절은 단순 행위 묘사라기보다 예물의 대량 봉헌을 강조하므로, 현대어로는 ‘바치다’가 가장 간결하게 제의적 의미를 전달합니다.
  doctrine_reference: 제의 문맥의 서술적 번역 원칙
