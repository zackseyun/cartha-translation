  text: 그리고 열두 사자가 그 여섯 계단 위에, 이쪽과 저쪽에 서 있었습니다. 어떤 나라에도 그것과 같은 것은 만들어진 적이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
