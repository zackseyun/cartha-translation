base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/019.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
  footnotes:
  - marker: a
    text: Or, 'twelve lions stood there on the six steps, one on each side.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 열두 마리의 사자가 그 여섯 계단의 양쪽에 서 있었습니다.[a] 어떤 나라에도 그것과 같은 것은 만들어진 적이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, '열두 사자가 그 여섯 계단 위에 서 있었는데, 각 계단의 양쪽에 하나씩 있었다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר / twelve
  english_pob_choice: And twelve
  chosen_korean: 그리고 열두
  alternatives_korean:
  - 또 열두
  - 열두
  lexicon: HALOT
  rationale: 서술의 흐름을 자연스럽게 잇는 접속을 살리고, 수량 표현은 직역에 가깝게 두었습니다.
- source_word: אֲרָיוֹת
  english_pob_choice: lions
  chosen_korean: 사자
  alternatives_korean:
  - 사자상
  - 사자들
  lexicon: HALOT
  rationale: 왕좌 장식물로서의 사자 형상을 뜻하므로, 한국어에서는 중복된 복수를 피하고 자연스럽게 단수 집합명사처럼 옮겼습니다.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  english_pob_choice: on the six steps
  chosen_korean: 그 여섯 계단 위에
  alternatives_korean:
  - 그 여섯 층계 위에
  - 여섯 계단에
  lexicon: HALOT
  rationale: מַעֲלוֹת는 여기서 계단·층계를 가리키므로, 왕좌로 오르는 구조를 드러내는 '계단'을 택했습니다.
- source_word: מִזֶּה וּמִזֶּה
  english_pob_choice: on this side and on that side
  chosen_korean: 이쪽과 저쪽에
  alternatives_korean:
  - 한쪽과 다른 쪽에
  - 좌우 양쪽에
  lexicon: HALOT
  rationale: 대칭 배치를 나타내는 관용적 표현이므로, 한국어에서 가장 자연스러운 양쪽 대비 표현으로 옮겼습니다.
- source_word: לֹא נַעֲשָׂה כֵן לְכָל מַמְלָכָה
  english_pob_choice: Nothing like it had been made for any kingdom
  chosen_korean: 어떤 나라에도 그것과 같은 것은 만들어진 적이 없습니다
  alternatives_korean:
  - 어느 왕국에도 이와 같은 것은 만들어진 적이 없습니다
  - 어떤 나라에도 이처럼 된 것은 없었습니다
  lexicon: HALOT
  rationale: 비교의 유일성을 강조하는 수동 표현을 살려, '그것과 같은 것'과 '만들어진 적이 없습니다'로 옮겼습니다.
