id: 2CH.9.18
reference: 2 Chronicles 9:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שֵׁ֣שׁ מַעֲל֣וֹת לַ֠/כִּסֵּא וְ/כֶ֨בֶשׁ בַּ/זָּהָ֤ב לַ/כִּסֵּא֙ מָאֳחָזִ֔ים וְ/יָד֛וֹת מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה עַל מְק֣וֹם הַ/שָּׁ֑בֶת וּ/שְׁנַ֣יִם אֲרָי֔וֹת עֹמְדִ֖ים אֵ֥צֶל הַ/יָּדֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
  footnotes:
  - marker: a
    text: Or possibly 'a gold ramp/stairway attached to the throne.' The Hebrew word כבשׁ can be understood differently, though 'footstool' fits the throne context well.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕좌에는 여섯 계단이 있었고, 금으로 된 발판이 왕좌에 붙어 있었으며, 이쪽과 저쪽에는 앉는 자리 옆으로 팔걸이가 있었고, 팔걸이 곁에는 두 마리 사자가 서 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כבשׁ은 다른 뜻으로도 이해될 수 있습니다. 여기서는 왕좌 문맥에 맞게 ‘발판’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  english_pob_choice: steps
  chosen_korean: 계단
  alternatives_korean:
  - 걸음
  - 단
  lexicon: HALOT
  rationale: 왕좌로 올라가는 구조를 가리키므로 현대 한국어에서는 자연스럽고 구체적인 ‘계단’이 가장 잘 맞습니다.
- source_word: כֶּבֶשׁ
  english_pob_choice: footstool
  chosen_korean: 발판
  alternatives_korean:
  - 발받침
  - 발등받이
  - 경사로
  lexicon: HALOT
  rationale: 본문과 평행본문의 왕좌 문맥에서 기능적으로는 발을 올리는 받침을 뜻하므로, ‘footstool’의 의미를 살리되 한국어로는 ‘발판’이 가장 간결하고 오해가 적습니다.
- source_word: יָדוֹת
  english_pob_choice: armrests
  chosen_korean: 팔걸이
  alternatives_korean:
  - 손잡이
  - 옆받침
  - 팔받침
  lexicon: HALOT
  rationale: 가구 문맥에서 좌석 양옆의 받침을 뜻하므로, 기능을 바로 드러내는 ‘팔걸이’가 가장 자연스럽습니다.
- source_word: מִזֶּה וּמִזֶּה
  english_pob_choice: on this side and on that
  chosen_korean: 이쪽과 저쪽에는
  alternatives_korean:
  - 양쪽에
  - 이편과 저편에
  - 양편에
  lexicon: HALOT
  rationale: 좌우 대칭 배치를 나타내는 표현이므로, 원문의 병렬감을 살려 ‘이쪽과 저쪽’으로 옮겼습니다.
theological_decisions:
- issue: 왕좌의 부속물 묘사에서 כבשׁ의 의미
  chosen_reading: 본문의 왕좌 맥락을 따라 ‘발판’으로 옮기고, 경사로 가능성은 본문에는 넣지 않았습니다.
  alternative_readings:
  - 경사로
  - 계단식 경사
  rationale: 히브리어 자체로는 다르게 이해될 여지가 있지만, 여기서는 왕좌 설명의 전체 흐름이 좌석 앞의 받침을 가리키는 것으로 읽히므로, 의미를 과도하게 넓히지 않는 번역이 적절합니다.
  doctrine_reference: 본문 비평/어휘 결정
- issue: 사자 형상의 표현
  chosen_reading: 히브리어가 단순히 ‘사자들’이라고 하므로, 조각상임을 명시하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 사자 조각들
  - 사자상들
  rationale: 원문이 형상 여부를 직접 말하지 않으므로, 해석을 덧씌우지 않고 서술의 여지를 남기는 것이 source-grounded입니다.
  doctrine_reference: 본문 충실성
