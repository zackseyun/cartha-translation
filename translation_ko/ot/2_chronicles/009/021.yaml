  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
  footnotes:
  - marker: a
    text: Or 'parrots' for the final item in the cargo list; the Hebrew animal name is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕에게는 두로의 종들과 함께 다니는 다시스 배들이 있었으며, 삼 년에 한 번씩 다시스 배들이 와서 금과 은, 상아, 원숭이와 타조를 실어 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 항목의 히브리어 동물명은 확실하지 않으며, ‘앵무새’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: … 있었으며
  alternatives_korean:
  - … 있었습니다
  - 이는
  lexicon: HALOT
  rationale: 문맥상 앞 절을 이어 왕의 부를 설명하는 이유-설명 관계이므로, 한국어에서는 문장 첫머리의 ‘이는/왜냐하면’보다 서술을 자연스럽게 잇는 연결로 처리했습니다.
- source_word: אֳנִיּוֹת לַמֶּלֶךְ הֹלְכוֹת תַּרְשִׁישׁ
  english_pob_choice: the king had ships going to Tarshish
  chosen_korean: 왕에게는 … 다시스 배들이 있었으며
  alternatives_korean:
  - 왕의 다시스 항해선들이 있었으며
  - 왕을 위한 다시스 배들이 있었으며
  lexicon: HALOT
  rationale: ‘to/for the king’는 여기서 소유·귀속을 나타내므로 자연스러운 한국어 관용에 따라 ‘왕에게는’으로 옮겼고, 진행형 표현은 ‘다시스 배들’보다 출항/운항의 상태를 드러내기 위해 앞의 수식으로 처리했습니다.
- source_word: עִם עַבְדֵי חוּרָם
  english_pob_choice: with Huram’s servants
  chosen_korean: 두로의 종들과 함께
  alternatives_korean:
  - 후람의 종들과 함께
  - 후람의 신하들과 함께
  lexicon: HALOT
  rationale: 본문의 חוּרָם을 영어 POB의 관례를 따라 두로의 왕으로 이해해 한국어 독자가 인물 식별을 쉽게 하도록 ‘두로의’로 풀었고, עַבְדֵי는 여기서 공식 수행 인력을 가리키므로 ‘신하들’보다 원문에 가까운 ‘종들’을 택했습니다.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  english_pob_choice: the ships of Tarshish
  chosen_korean: 다시스 배들
  alternatives_korean:
  - 다시스 항해선들
  - 다시스로 가는 배들
  lexicon: HALOT
  rationale: 이 구문은 장소명과 결합한 관용적 명칭으로, 한국어 성경 전통과 문맥을 함께 살려 ‘다시스 배들’로 옮겼습니다.
- source_word: תּוּכִּיִּים
  english_pob_choice: peacocks
  chosen_korean: 타조
  alternatives_korean:
  - 공작
  - 앵무새
  lexicon: HALOT
  rationale: 후반 목록의 동물명은 히브리어가 불확실하지만, 영어 POB가 각주로 대안 가능성을 남긴 점을 따라 한국어 본문에는 전통적 ‘타조’를 두고, 본문 단정성을 과도하게 높이지 않았습니다.
theological_decisions:
- issue: חוּרָם의 인물 식별
  chosen_reading: 후람을 두로의 왕으로 이해해 ‘두로의 종들’로 번역했습니다.
  alternative_readings:
  - 히람의 종들
  - 후람의 종들
  rationale: 열왕기 병행본문 및 본문 맥락에서 동일 인물을 가리키는 왕명으로 읽는 것이 자연스럽습니다. 한국어 독자의 혼동을 줄이기 위해 지명 보충을 사용했습니다.
  doctrine_reference: 본문 맥락 및 병행본문 조화
- issue: 마지막 동물명 תּוּכִּיִּים의 처리
  chosen_reading: 본문에는 전통적 식별 가능성을 반영해 ‘타조’를 넣었습니다.
  alternative_readings:
  - 공작
  - 앵무새
  rationale: 히브리어 어휘의 식별이 확실하지 않으므로 단정적 해석을 피해야 합니다. 다만 본문 자체는 목록의 완결성을 위해 하나의 동물명을 요구하므로, 한국어 본문은 전통적 대응을 유지하되 원문 불확실성은 각주로 남깁니다.
  doctrine_reference: 사본/어휘 불확실성 처리 원칙
