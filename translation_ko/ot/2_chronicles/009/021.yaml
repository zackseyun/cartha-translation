  source_fidelity: 수정이 필요합니다. חוּרָם은 본문에서 인명인데 초안의 ‘두로의 종들’은 지명으로 대치하여 원문의 표현을 넘어섭니다. 또한 הֹלְכוֹת תַּרְשִׁישׁ의 이동/목적지 의미는 ‘다니는’보다 ‘다시스로 가는’이 정확합니다. תּוּכִּיִּים를 ‘타조’로 옮긴 것은 영어 POB의 ‘peacocks’ 및 일반적인 어휘 이해와 맞지 않습니다.
  naturalness: ‘왕에게는 … 배들이 있었으며’와 ‘삼 년에 한 번씩 … 싣고 왔습니다’는 자연스럽고 현대 표준 한국어 합쇼체에 적합합니다. ‘다니는 다시스 배들’은 수식 관계와 운항 의미가 불명확하므로 고쳤습니다.
  terminology: חוּרָם은 한국어 음역 ‘후람’으로 보존했습니다. עַבְדֵי는 왕실 소속 수행자라는 문맥을 고려하여 ‘신하들’로 옮겼습니다. תּוּכִּיִּים는 본문에서 ‘공작’으로 옮기고, 어휘 식별의 불확실성과 ‘앵무새’ 대안을 각주에 남겼습니다.
