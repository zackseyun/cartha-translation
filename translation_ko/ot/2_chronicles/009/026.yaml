base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/026.yaml
  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
  footnotes:
  - marker: a
    text: '"the River" likely refers to the Euphrates River, a standard geographic designation in the Hebrew Bible.'
    reason: cross_reference
translation:
  language: ko
  text: 그는 모든 왕들을 다스렸는데, 강에서부터 블레셋 사람들의 땅까지, 그리고 이집트의 경계까지 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “강”은 본문에서 관용적으로 유프라테스 강을 가리키는 경우가 많습니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  english_pob_choice: And he ruled
  chosen_korean: 그는 … 다스렸는데
  alternatives_korean:
  - 그는 통치했는데
  - 그는 다스리고 있었는데
  lexicon: HALOT
  rationale: וַיְהִי + מוֹשֵׁל의 상태적·진행적 의미를 한국어에서는 자연스러운 서술형 ‘다스렸는데’로 압축해, 단순 완료보다 지속된 통치 상태를 살렸습니다.
- source_word: בְּכָל הַמְּלָכִים
  english_pob_choice: over all the kings
  chosen_korean: 모든 왕들을
  alternatives_korean:
  - 모든 왕들 위에
  - 모든 왕들에 대해
  lexicon: HALOT
  rationale: משל과 결합한 ב는 지배의 범위를 나타내므로, 한국어에서는 관계를 풀어 ‘모든 왕들을’로 옮겨 종주권의 뜻을 분명히 했습니다.
- source_word: מִן הַנָּהָר
  english_pob_choice: from the River
  chosen_korean: 강에서부터
  alternatives_korean:
  - 유프라테스 강에서부터
  - 그 강에서부터
  lexicon: HALOT
  rationale: 본문의 관용구를 따라 본문에는 ‘강에서부터’로 두고, 특정 강의 지칭은 영어 POB의 주석에 따라 각주에서 보완하는 편이 source-direct합니다.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  english_pob_choice: the land of the Philistines
  chosen_korean: 블레셋 사람들의 땅
  alternatives_korean:
  - 블레셋 땅
  - 블레셋 지역
  lexicon: HALOT
  rationale: 지명형 표현을 직역해 영토 범위를 드러내면서, 성경적 고유지명 ‘블레셋 사람들’을 유지했습니다.
- source_word: גְּבוּל מִצְרָיִם
  english_pob_choice: the border of Egypt
  chosen_korean: 이집트의 경계
  alternatives_korean:
  - 이집트의 국경
  - 이집트 경계
  lexicon: HALOT
  rationale: גְּבוּל은 단순한 행정 ‘국경’보다 경계선 전반을 뜻할 수 있어, 현대 한국어에서 더 포괄적인 ‘경계’를 선택했습니다.
