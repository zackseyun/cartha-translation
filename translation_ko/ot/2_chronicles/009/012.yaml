source:
  edition: WLC
  text: וְ/הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה נָתַ֣ן לְ/מַֽלְכַּת שְׁבָ֗א אֶת כָּל חֶפְצָ/הּ֙ אֲשֶׁ֣ר שָׁאָ֔לָה מִ/לְּ/בַ֖ד אֲשֶׁר הֵבִ֣יאָה אֶל הַ/מֶּ֑לֶךְ וַֽ/תַּהֲפֹ֛ךְ וַ/תֵּ֥לֶךְ לְ/אַרְצָ֖/הּ הִ֥יא וַ/עֲבָדֶֽי/הָ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
  footnotes:
  - marker: a
    text: Or 'apart from what she had brought to the king.' The Hebrew phrase may be understood as distinguishing Solomon's gifts from the gifts the queen had brought him.
    reason: lexical_alternative
  - marker: b
    text: Or 'she returned and went to her land.' The Hebrew literally says 'she turned and went.'
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕은 스바 여왕이 바라는 모든 것과 그녀가 요청한 것을 다 주었고, 왕에게 가져온 것 외에도 더 주었습니다. 그러자 그녀는 돌아서서 자기 땅으로 갔습니다. 그녀와 그녀의 종들도 함께였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그녀가 왕에게 가져온 것과는 별도로.’ 히브리어 구문은 솔로몬의 선물을 여왕이 가져온 예물과 구별하는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀는 돌아서서 자기 땅으로 갔습니다.’ 히브리어는 문자적으로 ‘그녀가 돌아서서 갔다’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  english_pob_choice: gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었습니다
  - 내주었습니다
  - 건네주었습니다
  lexicon: HALOT
  rationale: 단순한 증여·수여 동사로는 한국어 ‘주다’가 가장 자연스럽고, 본문이 특별한 법적 행위보다 왕의 호의를 말하므로 ‘내주었습니다’보다 덜 과장된 표현이 적절합니다.
- source_word: מַלְכַּת שְׁבָא
  english_pob_choice: the queen of Sheba
  chosen_korean: 스바 여왕
  alternatives_korean:
  - 스바의 여왕
  - 시바 여왕
  lexicon: HALOT
  rationale: 왕호는 현대 한국어에서 관용적으로 ‘여왕’으로 옮기고, 지명은 음역상 ‘스바’가 본문 전통을 안정적으로 반영합니다.
- source_word: כָּל חֶפְצָהּ + אֲשֶׁר שָׁאָלָה
  english_pob_choice: all that she desired / whatever she asked
  chosen_korean: 바라는 모든 것과 그녀가 요청한 것
  alternatives_korean:
  - 원하는 모든 것과 요청한 것
  - 바라는 바와 요청한 것
  lexicon: HALOT
  rationale: חֵפֶץ의 ‘원함/바람’과 שׁאל의 ‘요청함’을 구분해 살리면서도, 한국어에서는 병렬적으로 자연스럽게 들리도록 했습니다.
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  english_pob_choice: besides what she had brought to the king
  chosen_korean: 왕에게 가져온 것 외에도 더
  alternatives_korean:
  - 왕에게 가져온 것 말고도
  - 왕에게 가져온 것 이외에도
  lexicon: HALOT
  rationale: מִלְּבַד의 제외·추가 의미를 반영해, 솔로몬의 선물이 그녀가 가져온 예물과 별개로 더해졌다는 점을 분명히 했습니다.
- source_word: וַתַּהֲפֹךְ וַתֵּלֶךְ לְאַרְצָהּ
  english_pob_choice: she turned and went to her own land
  chosen_korean: 그녀는 돌아서서 자기 땅으로 갔습니다
  alternatives_korean:
  - 그녀는 돌아서서 자기 나라로 갔습니다
  - 그녀는 돌아가 자기 땅으로 갔습니다
  lexicon: HALOT
  rationale: 동사 ‘turn’의 서술 운동을 살리기 위해 ‘돌아서서’를 택했고, לְאַרְצָהּ는 정치적 ‘나라’보다 원문에 더 가까운 ‘땅’으로 옮겼습니다.
- source_word: הִיא וַעֲבָדֶיהָ
  english_pob_choice: she and her servants
  chosen_korean: 그녀와 그녀의 종들도 함께였습니다
  alternatives_korean:
  - 그녀와 그녀의 종들이었습니다
  - 그녀와 수행원들도 함께였습니다
  lexicon: HALOT
  rationale: עֲבָדִים의 기본 의미를 따라 ‘종’으로 옮기되, 왕실 수행 인원이라는 정황 때문에 ‘수행원’보다 원문 직역성이 있는 표현을 유지했습니다.
