  terminology: ‘조상들과 함께 잠들다’, ‘장사하다’, ‘다윗의 도성’은 성경 문체와 현대 표준어에 적절합니다. ‘그의 아버지 다윗’은 본문의 계보상 표현을 보존하므로 유지할 수 있습니다.
  issues:
