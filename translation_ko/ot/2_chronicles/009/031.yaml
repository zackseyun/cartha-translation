base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
  footnotes:
  - marker: a
    text: Hebrew 'slept with his fathers,' a customary expression for death and burial among one's ancestors.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬이 그의 조상들과 함께 잠들었습니다.[a] 사람들은 그를 그의 아버지 다윗의 도성에 장사하였습니다. 그의 아들 르호보암이 솔로몬의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘조상들과 함께 잠들다’는 죽음을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들었고
  alternatives_korean:
  - 누웠고
  - 죽었고
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘조상들과 함께 잠들다’를 살리기 위해 직설적인 ‘죽다’보다 ‘잠들다’를 택했습니다.
- source_word: וַיִּקְבְּרֻהוּ
  english_pob_choice: they buried him
  chosen_korean: 사람들이 그를 … 장사하였습니다
  alternatives_korean:
  - 그를 장사하였습니다
  - 그들이 그를 묻었습니다
  lexicon: HALOT
  rationale: 원문은 복수 능동형이므로 수동으로 돌리지 않고, 주어를 특정하지 않은 ‘사람들이’로 처리해 원문 형식을 보존했습니다.
- source_word: בְּעִיר דָּוִיד
  english_pob_choice: in the city of David
  chosen_korean: 다윗의 도성에
  alternatives_korean:
  - 다윗성에
  - 다윗의 성에
  lexicon: HALOT
  rationale: 성경적 관용 표현을 자연스럽게 옮기되, ‘도성’으로 왕도/왕실 매장 맥락을 분명히 했습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 뒤를 이어
  alternatives_korean:
  - 그의 자리를 대신하여
  - 그를 대신하여
  lexicon: HALOT
  rationale: 왕위 계승의 뜻을 한국어 관용으로 자연스럽게 풀어, 단순한 위치 교체보다 ‘계승’의 의미를 드러냈습니다.
theological_decisions:
- issue: 왕실 죽음 기사에서 관용적 완곡어법 유지
  chosen_reading: ‘잠들었고’로 번역해 죽음과 매장의 관용구를 보존했습니다.
  alternative_readings:
  - ‘죽었고’로 직역
  - ‘세상을 떠났고’로 완화
  rationale: 본문의 전형적인 왕실 사망 공식이 주는 서사적·문체적 효과를 살리기 위해, 의미는 분명히 하되 관용구를 유지했습니다.
  doctrine_reference: OT 서사체의 관용 표현 보존 원칙
- issue: ‘그의 조상들과 함께’의 공동체적 매장/선조 연속성
  chosen_reading: 조상들과 함께 잠들었다는 표현을 그대로 반영했습니다.
  alternative_readings:
  - ‘그의 조상들 곁에 묻혔다’
  - ‘그의 선조들과 함께 누웠다’
  rationale: 왕조 연대기 문맥에서 죽음이 단순한 생물학적 종료가 아니라 선조 열거와 계승의 틀 안에 놓인다는 점을 드러냅니다.
  doctrine_reference: 역대기 왕조 공식의 문학적 기능
