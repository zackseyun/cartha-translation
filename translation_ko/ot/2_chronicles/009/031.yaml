  source_fidelity: 전반적으로 히브리어의 왕실 사망·계승 공식을 충실히 반영합니다. 다만 마지막의 ‘그의 뒤를 이어’는 직전의 ‘다윗’도 문법적 선행사로 읽힐 수 있어, תַּחְתָּיו가 가리키는 솔로몬을 명시하는 편이 정확합니다. ‘왕이 되었습니다’는 이 계승 문맥에서 וַיִּמְלֹךְ의 즉위·통치 의미를 자연스럽고 충분히 전달합니다.
