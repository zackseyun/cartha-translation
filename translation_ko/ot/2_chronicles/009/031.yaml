  to: 솔로몬이 그의 조상들과 함께 잠들었습니다.[a] 사람들은 그를 그의 아버지 다윗의 도성에 장사하였습니다. 그의 아들 르호보암이 솔로몬의 뒤를 이어 왕이 되었습니다.
  rationale: 왕위 계승의 대상이 솔로몬임을 명시하여 대명사 모호성을 없앴습니다. 또한 וַיִּמְלֹךְ의 왕위 계승 맥락을 ‘왕이 되었습니다’로 자연스럽게 옮겼고, 각주를 해당 히브리어 관용구 직후에 배치했습니다. 각주는 ‘잠들다’ 관용구 자체가 직접 가리키는 죽음에 한정하여, 이어지는 별도의 매장 동작과 혼동하지 않게 했습니다.
