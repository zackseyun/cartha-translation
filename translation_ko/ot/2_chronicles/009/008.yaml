  language: ko
  text: 여호와 당신의 하나님은 찬송을 받으시기를 빕니다. 그분께서는 당신을 기뻐하시어 당신을 그분의 왕좌에 앉히시고, 여호와 당신의 하나님의 왕으로 세우셨습니다. 당신의 하나님께서 이스라엘을 사랑하시고 그것을 영원히 굳게 세우시려고 당신을 그들 위에 왕으로 세우셔서 정의와 공의를 행하게 하셨습니다.
