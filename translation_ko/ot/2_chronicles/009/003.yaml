translation:
  language: ko
  text: 스바의 여왕이 솔로몬의 지혜와 그가 지은 집을 보았을 때,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 지은 궁전’입니다. 히브리어는 ‘집’이라고 되어 있으나, 왕실 문맥에서는 솔로몬의 궁전 단지를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכַּת שְׁבָא
  english_pob_choice: the queen of Sheba
  chosen_korean: 스바의 여왕
  alternatives_korean:
  - 스바 여왕
  - 스바에서 온 여왕
  lexicon: HALOT
  rationale: 히브리어의 속격 구성을 자연스럽게 살려 ‘스바의 여왕’으로 옮겼습니다. 지명 ‘스바’를 인명처럼 처리하지 않고 왕국/지역 소속을 나타내는 표현으로 유지했습니다.
- source_word: חָכְמַת שְׁלֹמֹה
  english_pob_choice: Solomon’s wisdom
  chosen_korean: 솔로몬의 지혜
  alternatives_korean:
  - 솔로몬의 지혜로움
  - 솔로몬의 현명함
  lexicon: HALOT
  rationale: ‘지혜’가 솔로몬의 명성 있는 분별과 통찰을 가리키므로, 문맥에 맞게 일반적인 한국어 성경 용례를 유지했습니다.
- source_word: וְהַבַּיִת
  english_pob_choice: and the house
  chosen_korean: 그가 지은 집
  alternatives_korean:
  - 그가 지은 궁전
  - 그가 세운 집
  lexicon: HALOT
  rationale: 히브리어 בַּיִת은 문자적으로 ‘집’이며, 왕궁일 가능성은 있으나 본문 자체는 더 넓은 표현을 사용합니다. 본문에서는 ‘집’을 유지하고, 건축 행위를 자연스럽게 드러내기 위해 ‘그가 지은’을 붙였습니다.
- source_word: אֲשֶׁר בָּנָה
  english_pob_choice: that he had built
  chosen_korean: 지은
  alternatives_korean:
  - 건축한
  - 세운
  lexicon: HALOT
  rationale: 관계절을 한국어 관형절로 압축해 간결하게 옮겼습니다. 영어의 과거완료 뉘앙스는 서사 흐름상 ‘보았습니다’ 앞에서 이미 완공된 상태로 읽히도록 반영했습니다.
