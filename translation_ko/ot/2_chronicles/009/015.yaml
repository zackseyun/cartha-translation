  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
  footnotes:
  - marker: a
    text: Literally, 'six hundred of beaten gold went onto the one shield.' The Hebrew implies a weight measure; 'shekels' is supplied in English for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕은 큰 방패 두백 개를 만들었습니다. 그 큰 방패 하나마다 두랏 금 육백 세겔이 들어갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '두랏 금 육백이 한 방패 위로 올라갔다'는 식으로 말하지만, 여기서는 각 방패마다 사용된 금의 무게를 가리키는 것으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
