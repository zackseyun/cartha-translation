  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
  footnotes:
  - marker: a
    text: Literally, 'six hundred of beaten gold went onto the one shield.' The Hebrew implies a weight measure; 'shekels' is supplied in English for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 솔로몬 왕은 큰 방패 이백 개를 만들었습니다. 각 큰 방패에 두드려 편 금 육백 세겔을 사용했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘두드려 편 금 육백이 그 한 방패 위로 올라갔다’고 말합니다. ‘세겔’은 본문에 명시되어 있지 않지만, 각 방패에 사용된 금의 무게를 가리키는 것으로 보아 보충한 것입니다.
    reason: lexical_alternative
