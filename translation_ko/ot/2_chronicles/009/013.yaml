  text: 한 해 동안 솔로몬에게 들어온 금의 무게는 육백육십육 달란트였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘솔로몬에게 가져온 금’; 히브리어는 문자적으로 ‘솔로몬에게 온 [금]’이라고 하며, 누가 가져왔는지는 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל הַזָּהָב
  english_pob_choice: the weight of the gold
  chosen_korean: 금의 무게
  alternatives_korean:
  - 그 금의 무게
  - 금의 양
  lexicon: HALOT
  rationale: מִשְׁקַל은 ‘무게’를 뜻하므로, 수량보다 ‘무게’로 옮겨 원문의 측정 관점을 살렸습니다.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  english_pob_choice: that came to Solomon
  chosen_korean: 솔로몬에게 들어온
  alternatives_korean:
  - 솔로몬에게 온
  - 솔로몬에게 가져온
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘오다’(בָּא)라고만 하고 행위 주체를 밝히지 않으므로, 영어 POB의 주석 취지에 맞춰 ‘들어온’으로 옮겨 문장 구조를 보존했습니다.
- source_word: בְּשָׁנָה אֶחָת
  english_pob_choice: in one year
  chosen_korean: 그 해에
  alternatives_korean:
  - 한 해에
  - 한 해 동안
  lexicon: HALOT
  rationale: 직역하면 ‘한 해에’이지만, 앞선 문맥에서 특정 연간 총액을 말하므로 한국어에서는 자연스러운 ‘그 해에’가 가장 적절합니다.
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ כִּכְּרֵי זָהָב
  english_pob_choice: six hundred sixty-six talents of gold
  chosen_korean: 육백육십육 달란트였습니다
  alternatives_korean:
  - 육백육십육 달란트의 금이었습니다
  - 육백육십육 달란트의 금이 들어왔습니다
  lexicon: HALOT
  rationale: כִּכָּר는 표준적으로 ‘달란트’로 옮기며, 숫자는 본문의 역사적 수량을 그대로 유지했습니다.
theological_decisions:
- issue: 666이라는 수의 해석
  chosen_reading: 본문은 연간 금의 총량을 직접 진술하므로, 상징적 해석을 본문에 덧붙이지 않고 수량으로만 제시했습니다.
  alternative_readings:
  - 후대의 상징적 연상(다른 본문의 666)과 연결하는 번역
  - 의미를 강조해 경고적으로 처리하는 번역
  rationale: 히브리어 본문 자체는 이 숫자의 상징성을 설명하지 않으므로, 번역은 본문이 말하는 역사적 진술을 그대로 전달해야 합니다.
  doctrine_reference: 'Translation philosophy: 본문이 하지 않는 신학적 해석을 번역에 주입하지 말 것.'
