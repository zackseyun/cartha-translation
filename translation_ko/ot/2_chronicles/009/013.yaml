  text: Now the weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
  footnotes:
  - marker: a
    text: Or 'that was brought to Solomon'; the Hebrew literally says 'that came to Solomon,' without specifying the agent.
