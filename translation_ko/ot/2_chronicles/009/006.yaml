  naturalness: ‘내 눈으로 직접 보기까지는’, ‘그 절반도 내게 전해지지 않았습니다’, ‘보고보다 더 뛰어나십니다’는 현대 표준 한국어의 공적 직접화법에 자연스럽습니다. 솔로몬에게 말하는 장면에 맞게 존대 주체 선어말어미를 사용했습니다.
