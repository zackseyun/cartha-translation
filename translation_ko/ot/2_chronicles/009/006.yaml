reference: 2 Chronicles 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לְ/דִבְרֵי/הֶ֗ם עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּה֙ לֹ֣א הֻגַּד לִ֔/י חֲצִ֖י מַרְבִּ֣ית חָכְמָתֶ֑/ךָ יָסַ֕פְתָּ עַל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
  footnotes:
  - marker: a
    text: Or 'the abundance of your wisdom.'
    reason: lexical_alternative
  - marker: b
    text: Or 'You have exceeded the report that I heard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 말하였습니다. “내가 와서 내 눈으로 직접 보기까지는 그들의 말을 믿지 않았습니다. 그런데 보십시오, 당신의 지혜의 위대함은 그 절반도 내게 전해지지 않았습니다.[a] 당신은 내가 들은 보고보다 더 뛰어나십니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 지혜의 풍성함’.
    reason: מַרְבִּית의 가능한 어휘적 의미를 반영합니다.
  - marker: b
    text: 또는 ‘당신은 내가 들은 보고를 넘어섰습니다.’
    reason: יָסַף עַל의 ‘능가하다/넘어서다’라는 가능한 동등 번역을 제시합니다.
lexical_decisions:
- source_word: וְלֹֽא הֶאֱמַנְתִּי לְדִבְרֵיהֶם
  english_pob_choice: But I did not believe their words
  chosen_korean: “내가 와서 … 믿지 않았습니다”
  alternatives_korean:
  - “나는 그들의 말을 믿지 않았습니다”
  - “나는 그들의 말을 신뢰하지 않았습니다”
  lexicon: HALOT
  rationale: הֶאֱמַנְתִּי는 여기서 증언의 진위를 받아들이지 않았다는 뜻이므로, 한국어 ‘믿지 않았습니다’가 가장 자연스럽고 직접적입니다.
- source_word: וַתִּרְאֶינָה עֵינַי
  english_pob_choice: my own eyes saw it
  chosen_korean: “내 눈으로 보기 전에는”
  alternatives_korean:
  - “내 눈으로 보지 않고는”
  - “내 눈이 직접 보았습니다”
  lexicon: HALOT
  rationale: 직역하면 ‘내 눈이 보았습니다’이지만, 한국어에서는 결과를 드러내는 ‘내 눈으로 보기 전에는’이 시각적 확인의 강조를 살립니다.
- source_word: מַרְבִּית חָכְמָתֶךָ
  english_pob_choice: the greatness of your wisdom
  chosen_korean: “당신의 지혜의 عظ대함의 절반도”
  alternatives_korean:
  - “당신의 지혜의 풍성함의 절반도”
  - “당신의 매우 큰 지혜의 절반도”
  lexicon: HALOT
  rationale: מַרְבִּית는 ‘많음/증대/풍성함’의 뜻이지만, 문맥상 ‘지혜의 위대함’이라는 평가적 뉘앙스를 살려야 하므로 ‘지혜의 عظ대함’으로 옮겼습니다.
- source_word: יָסַפְתָּ עַל הַשְּׁמוּעָה
  english_pob_choice: You have surpassed the report that I heard
  chosen_korean: “내가 들은 소문보다 당신은 더 뛰어났습니다”
  alternatives_korean:
  - “내가 들은 보고를 넘어섰습니다”
  - “내가 들은 이야기보다 더하셨습니다”
  lexicon: HALOT
  rationale: יָסַף עַל은 단순한 ‘더하다’보다 ‘능가하다/초과하다’의 뜻이므로, 비교를 분명히 드러내는 ‘더 뛰어났습니다’가 적절합니다.
theological_decisions:
- issue: 왕비의 발화체 등록
  chosen_reading: 직접 인용 안에서는 궁정적 공손체를 유지하고, 화자는 여성 왕비로서 ‘-습니다’체로 말하게 했습니다.
  alternative_readings:
  - 서술체로 평면화
  - 감탄체로 과장
  rationale: 본문은 보고에 대한 실제 응답이므로, 화자의 사회적 지위와 장면의 공적 성격을 살려 공손한 직접화법을 유지하는 것이 적절합니다.
  doctrine_reference: Narrative discourse fidelity
- issue: ‘보십시오’의 담화 기능
  chosen_reading: וְהִנֵּה를 ‘보십시오’로 옮겨 놀라움과 청자의 주의를 환기하는 효과를 살렸습니다.
  alternative_readings:
  - ‘보라’
  - ‘과연’
  rationale: 히브리어 הִנֵּה는 단순 접속사가 아니라 청자에게 시선을 돌리게 하는 담화 표지이므로, 현대 한국어에서는 ‘보십시오’가 가장 자연스럽게 그 기능을 전달합니다.
  doctrine_reference: Discourse markers
