  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: ko
  text: 무역상들과 상인들이 가져온 것 외에도, 아라비아의 모든 왕들과 그 땅의 총독들도 솔로몬에게 금과 은을 가져왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבַד מֵאַנְשֵׁי הַתָּרִים וְהַסֹּחֲרִים
  english_pob_choice: Besides what the traders and merchants brought
  chosen_korean: 무역상들과 상인들이 가져온 것 외에도
  alternatives_korean:
  - 무역상들과 상인들이 가져온 것 말고도
  - 상인들과 장사꾼들이 가져온 것 외에도
  lexicon: מֵאַנְשֵׁי / תָּרִים / סֹּחֲרִים
  rationale: לְבַד의 배타적/부가적 의미를 살려 ‘…외에도’로 옮기고, 두 직업군은 상업 활동의 중복을 유지하면서도 한국어로 자연스럽게 풀었습니다.
- source_word: מְבִיאִים
  english_pob_choice: brought / were bringing
  chosen_korean: 가져왔습니다 / 가져왔고
  alternatives_korean:
  - 가져왔습니다
  - 가져오고 있었습니다
  lexicon: בוא (Hiphil)
  rationale: 본문은 왕들과 총독들의 지속적 공물 행위는 현재분사로, 앞선 상인들의 행위는 POB 개정에 따라 과거로 읽히므로 한국어에서도 시제를 구분해 반영했습니다.
- source_word: פַחוֹת הָאָרֶץ
  english_pob_choice: governors of the land
  chosen_korean: 그 땅의 총독들
  alternatives_korean:
  - 그 땅의 통치자들
  - 그 땅의 지방관들
  lexicon: פֶּחָה
  rationale: פַּחוֹת는 지방 통치관/총독을 가리키므로 전통적 왕족 용어보다 행정적 직함이 드러나는 ‘총독들’이 원문에 가깝습니다.
- source_word: זָהָב וָכֶסֶף
  english_pob_choice: gold and silver
  chosen_korean: 금과 은
  alternatives_korean:
  - 황금과 은
  - 금과 은화
  lexicon: זהב / כסף
  rationale: 헌상품의 일반 명칭을 그대로 유지해 물질을 단순명료하게 제시했습니다.
theological_decisions:
- issue: 솔로몬에게 바쳐지는 국제적 공물의 강조
  chosen_reading: 아라비아의 모든 왕들과 그 땅의 총독들이 솔로몬에게 금과 은을 가져오는 장면으로, 솔로몬의 부와 위상이 넓은 국제 관계 속에서 드러납니다.
  alternative_readings:
  - 단순한 호의적 방문으로 약화해 읽는 방식
  - 정치적 예속만을 강조하는 방식
  rationale: 문맥상 경제적 조공과 존숭이 함께 드러나므로, 공물의 반복 동작과 대상 인물을 모두 보존하는 번역이 적절합니다.
  doctrine_reference: 왕상 10장 및 대하 9장의 솔로몬 번영 전승
